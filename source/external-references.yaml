# Rules that hold for every entry above.
rules:
  - "Không phải tầng store. Không được đưa vào source/layers.yaml, không được tính vào coverage, không được dùng lấp chỗ trống `…pe…`."
  - "Không có căn cứ alignment thì không được hiển thị cạnh Pāli theo từng segment."
  - "Tác giả và người hiệu đính ghi riêng. Không gộp, và không suy cái này từ cái kia."
  - "Nguồn sao chép phải ghi là nguồn sao chép, kèm bản xuất bản gốc."
  - "Không có giấy phép máy đọc được thì NOASSERTION, kèm lý do. Đừng đoán."
  - "Bản đồ uid → URL phải kèm cách đã kiểm chứng và số đo. Không khai là có cái chưa đối chiếu."
