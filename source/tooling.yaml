# Support tooling — declared once, rendered everywhere.
#
# Why a file rather than prose in the pages: the project's own rule is that no claim may be
# asserted somewhere the code cannot keep true. Three places previously named an AI tool in
# hand-written markup — the home page, the site footer and the English fill scorecards — and
# they had already drifted apart: 561 text metadata files recorded ChatGPT, the newest fill
# files recorded OpenCode, and the site named only ChatGPT. Naming a tool in prose means the
# next tool arrives and half the site is quietly wrong.
#
# `tests/unit/tooling.test.ts` enforces the two rules that matter:
#   - every AI tool named anywhere in `content/meta` or on the site is declared here; and
#   - every entry here is actually credited somewhere, so the declaration cannot rot into a
#     list nobody reads.
#
# `declaredBy` records where a name comes from. `user-declared` means the repository cannot
# verify it — a model's release name is not something a build can check, and pretending
# otherwise would be the exact kind of unfalsifiable claim these rules exist to prevent.

schemaVersion: 1

assistance:
  - id: chatgpt
    name: ChatGPT
    vendor: OpenAI
    release: null
    link: https://chatgpt.com/
    # What this tool was actually used for, stated narrowly rather than generously.
    usedFor:
      - "Phương án dịch và QA cho 561 bài có metadata ghi ChatGPT"
      - "Đối chiếu Pāli / English / Việt hiện hành, kiểm logic, terminology, consistency"
      - "Adversarial review của bản dịch"
    standing: "Công cụ hỗ trợ. Không phải nguồn kinh điển, không bao giờ là authority."
    declaredBy: repository

