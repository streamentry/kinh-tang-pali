# Standing rules that hold for every tool above, kept here so a page cannot restate them
# more loosely than they are written.
rules:
  - "AI không phải nguồn kinh điển. Pāli root là authority duy nhất."
  - "Ghi credit cho công cụ không hàm ý công cụ bảo trợ, phê duyệt hay chịu trách nhiệm cho bản dịch."
  - "Bản dịch do người biên tập chịu trách nhiệm; công cụ chỉ là lớp trợ giúp."
