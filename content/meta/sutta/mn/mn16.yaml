summary: |-
  Kinh Tâm Hoang Vu do Đức Phật giảng tại rừng Jeta gần Sāvatthī. Ngài tuyên bố rằng khi một vị tỳ-kheo chưa từ bỏ năm trạng thái khiến tâm chai cứng và chưa cắt đứt năm trói buộc của tâm, vị ấy không thể tăng trưởng, tiến bộ và trưởng thành trong Giáo pháp và giới luật này; khi đã từ bỏ và cắt đứt, vị ấy có thể làm được điều đó.

  Năm trạng thái khiến tâm chai cứng được nêu từng điều: hoài nghi về bậc Đạo sư, về Giáo pháp, về Tăng đoàn, về sự tu học, và giận dữ, bất mãn với các bạn đồng tu, mang lòng oán hận và khép kín. Mỗi trạng thái đều được kết luận rằng vì thế tâm vị ấy không hướng đến nhiệt tâm, tận lực, kiên trì và nỗ lực. Phần đối xứng lặp lại cả năm dưới dạng đã từ bỏ, và tâm khi ấy hướng đến nhiệt tâm, tận lực, kiên trì, nỗ lực.

  Năm trói buộc của tâm cũng được nêu theo cùng cách thức: chưa thoát khỏi tham, ham muốn, khát khao, ái đối với dục lạc; tham đối với thân; tham đối với sắc; ăn thỏa thích đến no bụng rồi hưởng thú vui ngủ, nằm và mê ngủ; và sống đời phạm hạnh với mong muốn tái sinh vào một cõi trời, nghĩ nhờ giới hay khổ hạnh này mong ta trở thành một vị trời. Từng điều đều làm tâm không hướng đến nỗ lực, và phần đối xứng lặp lại dưới dạng đã cắt đứt.

  Khi đã từ bỏ cả năm trạng thái và cắt đứt cả năm trói buộc, vị tỳ-kheo tu tập bốn nền tảng thần lực có định do ý muốn, do tinh tấn, do tâm và do quán xét, mỗi nền tảng đi kèm nỗ lực chủ động; yếu tố thứ năm là tinh tấn mãnh liệt. Ví như con gà mái ấp và giữ ấm tám, mười hay mười hai quả trứng đúng cách thì dù không ước mong, những gà con vẫn có thể phá vỏ và nở ra an toàn. Cũng vậy, vị tỳ-kheo có đủ mười lăm yếu tố ấy, kể cả tinh tấn mãnh liệt, có khả năng phá vỡ vỏ bọc, giác ngộ và đạt sự an ổn tối thượng thoát khỏi mọi ràng buộc.
