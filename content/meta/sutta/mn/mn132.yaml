summary: |-
  Kinh Một Đêm Có Lành cho Ānanda được đặt tại rừng Jeta gần Sāvatthī, trong tu viện của ông Anāthapiṇḍika. Lúc bấy giờ, Tôn giả Ānanda đang hướng dẫn, khuyến khích, kích phát, làm hoan hỷ các tỳ-kheo trong nhà họp chúng bằng bài thuyết pháp hợp pháp, và thuyết bản tóm lược cùng phân biệt của một đêm có lành. Buổi chiều, Đức Phật từ chỗ thiền tịnh đến nhà họp chúng, hỏi ai là người đang thuyết; các tỳ-kheo thưa là Tôn giả Ānanda.

  Đức Phật hỏi Ānanda đã thuyết như thế nào. Tôn giả kể lại: trước là bài kệ tóm lược — chớ chạy theo quá khứ, chớ mong đợi vị lai; quá khứ đã bỏ lại sau, vị lai chưa đến với ta; pháp nào hiện tại, hãy quán thấy ngay tại đó, không rung chuyển, không bị lay động, biết rõ nó, hãy nuôi dưỡng nó; hôm nay hãy tinh cần, vì ai biết được ngày mai tử vong, và không có sự mặc cả với đại quân của tử thần; ai nhiệt tâm an trú như vậy, không ngừng nghỉ ngày đêm, chính là vị một đêm có lành, do bậc ẩn sĩ an tịnh tuyên nói.

  Phần phân biệt nêu sáu nghĩa. Chạy theo quá khứ là với quá khứ của dáng dạng, cảm thọ, tưởng, hành, thức lại theo đuổi sự hỉ lạc; không chạy theo quá khứ là nội dung ấy nhưng không theo đuổi hỉ lạc. Mong đợi vị lai là mong sẽ có dáng dạng, cảm thọ, tưởng, hành, thức như vậy trong thời vị lai và theo đuổi hỉ lạc; không mong đợi vị lai là nội dung ấy nhưng không theo đuổi hỉ lạc. Bị lung lay giữa các pháp hiện tại là kẻ phàm phu chưa nghe pháp, không được thấy và huấn luyện trong pháp các bậc Thánh, các người thiện, xem sắc là ngã, xem ngã có sắc, xem sắc trong ngã, xem ngã trong sắc, công thức lặp lại cho thọ, tưởng, hành, thức; không bị lung lay là Thánh đệ tử đã nghe pháp, được thấy và huấn luyện trong pháp các bậc Thánh, các người thiện, không xem năm uẩn theo bốn cách ngã nói trên. Tôn giả kết thúc bằng cách đọc lại bài kệ tóm lược.

  Đức Phật khen lành thay, rồi chính mình trình bày lại toàn bộ phần phân biệt ấy với Ānanda theo cùng thứ tự sáu nghĩa, và lặp lại bài kệ tóm lược một lần nữa. Tôn giả Ānanda hoan hỷ, tán đồng lời Đức Phật dạy. Như vậy, bài kinh cho thấy cùng một công thức "một đêm có lành" được đệ tử thuyết đầy đủ trước, và được chính Đức Phật xác nhận, trình lại trọn vẹn sau.
