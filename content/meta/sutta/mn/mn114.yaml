summary: |-
  Kinh Nên Hành Trì, Không Nên Hành Trì do Đức Phật thuyết tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika. Đức Phật nói sẽ giảng pháp môn về nên hành trì, không nên hành trì, rồi nói tóm tắt bảy điều, mỗi điều đều hai loại, từ thân hành, khẩu hành, ý hành, tâm sinh đến sự đạt được tưởng, sự đạt được kiến và sự đạt được cá thể. Sāriputta xin triển khai nghĩa rộng của lời tóm tắt ấy.

  Sāriputta nêu tiêu chuẩn chung: điều nào khi hành trì làm các bất thiện pháp tăng trưởng, các thiện pháp suy giảm thì không nên hành trì; điều nào làm bất thiện pháp suy giảm, thiện pháp tăng trưởng thì nên hành trì. Theo đó, thân hành và khẩu hành bất thiện là sát sinh, lấy của không cho, tà dâm trong các dục, nói dối, nói hai lưỡi, nói lời ác, nói lời phù phiếm; việc xa lìa tất cả những điều ấy là thân hành, khẩu hành thiện.

  Ý hành, tâm sinh và sự đạt được tưởng bất thiện nằm ở tham dục, tâm sân, ý nghĩ độc hại cùng sự sống hợp với chúng; phần thiện là không tham, không sân, không hại não và sống hợp với những điều ấy. Kiến bất thiện phủ nhận bố thí, hiến tế, quả của nghiệp, đời này, đời sau, mẹ, cha, chúng sinh hóa sinh và các bậc thánh; kiến thiện khẳng định tất cả. Cá thể bất thiện là cá thể có hại não, sinh ra không vì sự hoàn tất trạng thái; cá thể thiện không hại não, sinh ra vì sự hoàn tất trạng thái. Đức Phật khen và tự lặp lại phần triển khai chi tiết ấy.

  Lần thứ hai, Đức Phật nói tóm tắt: sắc được mắt thức biết, tiếng, hương, vị, xúc chạm, pháp được ý thức biết, mỗi thứ đều hai loại; lần thứ ba là y, đồ ăn khất thực, chỗ nghỉ ngơi, làng, thị trấn, thành phố, đất nước và cá nhân. Sāriputta triển khai cả hai bằng cùng tiêu chuẩn: điều gì khi thân cận làm bất thiện pháp tăng trưởng, thiện pháp suy giảm thì không nên thân cận, điều gì ngược lại thì nên thân cận. Sau cùng Đức Phật kết luận: nếu các Sát-đế-lợi, Bà-la-môn, Phệ-xá, Thủ-đà-la, và cả thế giới với chư thiên, Māra, Phạm thiên cùng loài chúng sinh hiểu nghĩa rộng ấy, sẽ được an lạc và hạnh phúc lâu dài.

  Bài kinh đề ra một tiêu chuẩn duy nhất, kiểm được trên chính kết quả: điều gì làm thiện pháp suy giảm, bất thiện pháp tăng trưởng thì không nên hành trì, không nên thân cận; điều gì làm ngược lại thì nên.
