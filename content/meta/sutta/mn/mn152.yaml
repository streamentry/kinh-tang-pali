summary: |-
  Đức Phật ở Gajaṅgalā, tại rừng tre. Ngài hỏi Uttara, đạo sĩ trẻ học trò của bà-la-mon Pārāsiviya, rằng thầy ông dạy sự tu tập các căn thế nào. Uttara đáp: được dạy không thấy sắc bằng mắt, không nghe tiếng bằng tai. Đức Phật chỉ ngay hệ quả: như vậy thì người mù và người điếc sẽ là người có các căn tu tập. Uttara ngồi im, ngượng ngùng, không đáp được.

  Đức Phật nói với Tôn giả Ānanda rằng trong Thánh luật có sự tu tập các căn vô thượng. Tỳ-kheo thấy sắc bằng mắt, khả ý, bất khả ý, hoặc cả hai khởi lên; vị ấy biết: khả ý và bất khả ý ấy là hữu vi, là thô, là do duyên sinh, còn cái an tịnh, thù diệu chính là xả. Các trạng thái ấy đoạn diệt nhanh lẹ, dễ dàng, và xả an trú — như người có mắt mở mắt ra rồi nhắm lại. Công thức lặp lại cho sáu cửa, mỗi cửa một ví dụ: với tiếng, như người khỏe mạnh đánh một con ruồi không tốn sức; với hương, như giọt nước lăn trôi trên lá sen hơi dốc; với vị, như vo tròn nước bọt nơi đầu lưỡi rồi nhổ ra; với xúc, như co duỗi cánh tay; với pháp do ý nhận biết, như vài giọt nước rơi chậm vào chảo sắt nung nóng cả ngày rồi bốc hơi tức thì.

  Tiếp theo là hai mức người. Vị hữu học đang thực hành, khi khả ý và bất khả ý khởi lên, thì kinh sợ, tàm quý và ghê tởm đối với chúng. Bậc Thánh với các căn đã tu tập thì tùy mong muốn mà trú: tưởng không yếm ly về điều yếm ly, tưởng yếm ly về điều không yếm ly, tưởng không yếm ly về cả hai, tưởng yếm ly về cả hai, hoặc trú như bậc xả, chánh niệm tinh tường, sau khi buông bỏ cả hai.

  Đức Phật tổng kết rằng Ngài đã dạy cả ba mức ấy; những gì đạo sư mong muốn lợi ích, do lòng từ mẫn, điều ấy đã làm cho các đệ tử; rồi dặn hãy thiền định nơi những gốc cây, trú xá trống, chớ có phóng dật. Kinh kết thúc bằng các đoạn tóm lược ghi tên các kinh của Phẩm Cáo Thị và loan báo Năm Mươi Sau hoàn tất.

  Tu tập các căn vì vậy không phải là tránh không nhìn, không nghe, mà là khi khả ý và bất khả ý khởi lên qua sáu cửa, chúng được đoạn diệt nhanh lẹ để xả an trú.
