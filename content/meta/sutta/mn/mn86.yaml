summary: |-
  Kinh Aṅgulimāla mở ra khi Đức Phật trú tại rừng Jeta. Trong cương vực vua Pasenadi xứ Kosala có tên cướp Aṅgulimāla, thợ săn tay vấy máu, chuyên giết chóc, đeo chuỗi ngọc làm bằng các ngón tay. Đức Phật một mình đi trên con đường dẫn đến Aṅgulimāla, dù người chăn bò, chăn dê, làm ruộng và đi đường ba lần can ngăn vì cả những đoàn năm mươi người kết đoàn chặt chẽ cũng rơi vào tay hắn; Ngài vẫn im lặng đi tiếp.

  Aṅgulimāla đuổi theo nhưng chạy hết sức cũng không kịp vị sa-môn đang đi với bước đi bình thường. Đức Phật đáp bằng kệ: Ta đã dừng mãi mãi, đã từ bỏ trượng phạt đối với mọi chúng sinh; còn ngươi tự mình chưa tự chủ với các chúng sinh, do vậy Ta dừng mà ngươi chưa dừng. Nghe kệ, Aṅgulimāla quăng bỏ kiếm và khí giới, xin xuất gia, và trở thành tỳ-kheo qua lời mời "Hãy đến đây, này tỳ-kheo!"

  Vua Pasenadi ra đi dẹp trừ Aṅgulimāla, ghé tu viện. Khi được hỏi sẽ xử trí thế nào nếu thấy Aṅgulimāla đã xuất gia, có giới hạnh, vua đáp sẽ đảnh lễ, mời ngồi, cúng dường. Đức Phật bèn chỉ vị tỳ-kheo ngồi không xa: đây chính là Aṅgulimāla; vua sợ hãi hoảng hốt, xin cúng dường nhưng Tôn giả từ chối vì chỉ có ba y, sống nơi rừng vắng. Vua tán thán rằng những người mà gậy kiếm không thể nhiếp phục, Đức Phật đã nhiếp phục không cần gậy, không cần kiếm.

  Khất thực, Tôn giả thấy một người đàn bà bị thai nghén trở ngại. Đức Phật bảo nói lời chân thật: từ khi tôi sinh ra, tôi không nhớ mình từng cố ý đoạt mạng một chúng sinh nào; Tôn giả từ chối vì con đã đoạt mạng nhiều chúng sinh, như vậy sẽ thành người nói dối; Đức Phật đổi thành "từ khi tôi sinh vào dòng Thánh", và người đàn bà với bào thai được bình an. Tôn giả sống một mình, chẳng bao lâu thành A-la-hán.

  Tôn giả bị người ném đá, ném gậy, ném sỏi — đầu vỡ, máu chảy, bát vỡ, y rách — và Đức Phật bảo hãy chịu đựng: do quả của nghiệp ấy, đáng lẽ phải chịu đốt nung trong địa ngục, nay đã cảm thọ ngay trong đời này. Vị ấy sống độc cư thiền tịnh và thốt kệ: kẻ trước phóng dật sau không phóng dật sáng như trăng thoát khỏi mây; bậc trí tự nhiếp phục chính mình không cần roi trượng; tên ta là Vô Hại, nay đúng với thật; quả nghiệp đã giáng thân, ta thọ thực không còn nợ nần; ba thắng trí đã đạt, việc dạy của Đức Phật đã hoàn thành.
