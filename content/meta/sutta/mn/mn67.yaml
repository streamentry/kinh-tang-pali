summary: |-
  Bài kinh kể lại khi Đức Phật trú ở Cātumā, tại vườn loa kè, khi năm trăm tỳ-kheo do Sāriputta và Moggallāna dẫn đầu đến yết kiến. Những tỳ-kheo khách du ấy khi chào hỏi, khi dọn chỗ trú, khi cất bát y đã làm ồn ào lớn tiếng, nghe như đám ngư dân đang vớ cá. Qua lời Ānanda, Đức Phật biết sự việc, cho gọi đại chúng đến và trục xuất, tuyên bố họ không được sống trong gần gũi của Ngài.

  Các tỳ-kheo gặp người Sakyā ở Cātumā. Người Sakyā đến thỉnh Đức Phật hoan hỷ và chấp nhận đại chúng như thuở trước, vì có những tỳ-kheo mới xuất gia, chưa lâu đến với Pháp và Luật, nếu không được thấy Đức Phật sẽ có thể thay đổi, biến chuyển, như mầm non không được nước, như con bê non không thấy mẹ. Phạm thiên Sahampati hiện ra nhắc lại cùng lời thỉnh cầu; nhờ vậy Đức Phật được thuyết phục, và Moggallāna bảo các tỳ-kheo trở lại.

  Khi đại chúng trở về, Đức Phật hỏi Sāriputta đã nghĩ gì. Sāriputta đáp mình nghĩ Đức Phật và chúng con sẽ sống không khởi cầu mong, an trú hiện tại lạc trú; Đức Phật bảo khoan, đừng nghĩ rằng sống hiện tại lạc trú. Moggallāna thì nghĩ mình và Sāriputta sẽ trông coi đại chúng; Đức Phật khen điều ấy: hoặc Ta, hoặc Sāriputta và Moggallāna, phải trông coi đại chúng tỳ-kheo.

  Cuối cùng, Đức Phật dạy: như người xuống nước cần dự đoán trước bốn nỗi sợ là sóng, cá sấu, xoáy nước, cá mập, người xuất gia sống không nhà trong Pháp và Luật này cũng cần dự đoán trước bốn nỗi sợ ấy. Nỗi sợ sóng là tên gọi cho giận dữ và bực bội: vị xuất gia vì lòng tin thấy đồng phạm hạnh khuyên dạy oai nghi đi lại, nhìn, mang y bát, liền uất ức, từ bỏ đạo học. Nỗi sợ cá sấu là tên gọi cho sự phàm ăn: vị ấy không chịu nổi các giới hạn về thức ăn uống hợp pháp và về giờ khắc. Nỗi sợ xoáy nước là tên gọi cho năm dục trưởng dưỡng: vị ấy khất thực không phòng hộ các căn, thấy gia chủ đang hưởng dục liền nhớ hồi của cải rồi trở về. Nỗi sợ cá mập là tên gọi cho phụ nữ: vị ấy thấy phụ nữ hở hang, tham dục ô nhiễm tâm rồi từ bỏ đạo học; cả bốn hạng đều quay về cuộc sống thấp kém.

  Bài kinh khép lại ở tương phản ấy: bốn nỗi sợ dưới nước chỉ là tên gọi cho bốn nguy hiểm khiến người xuất gia từ bỏ đạo học, cần dự đoán trước khi bước vào đời sống không nhà.
