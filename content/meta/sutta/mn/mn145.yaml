summary: |-
  Đức Phật ở gần Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika. Tôn giả Puṇṇa xin Đức Phật giáo hóa tóm tắt, để sau khi nghe pháp sẽ sống một mình, độc cư, không phóng dật, nhiệt tâm, kiên quyết.

  Đức Phật dạy: sắc do mắt nhận biết, đáng ưa, đáng thích, dễ chịu, hấp dẫn, liên hệ đến dục và khơi dậy ham muốn; nếu vị tỳ-kheo hoan hỉ, hoan lạc, chấp thủ mà đứng giữ các sắc ấy thì hỷ khởi lên, và hỷ sanh thì khổ sanh. Công thức ấy được lặp lại cho tiếng, hương, vị, xúc, pháp do tai, mũi, lưỡi, thân, ý nhận biết. Ngược lại, nếu vị tỳ-kheo không hoan hỉ, không hoan lạc, không chấp thủ mà đứng giữ, hỷ đoạn diệt, và hỷ diệt thì khổ diệt, cũng lặp lại cho từng môn.

  Khi được hỏi sẽ sống ở xứ nào, Puṇṇa đáp sẽ sống ở xứ Sunāparanta. Đức Phật cảnh báo người Sunāparanta dữ tợn, thô bạo, và hỏi nếu họ mắng nhiếc phỉ báng thì nghĩ sao; Puṇṇa đáp sẽ nghĩ họ thật là tốt vì không đánh mình bằng tay. Câu hỏi được đẩy lên từng nấc: nếu bị đánh bằng tay thì nghĩ họ tốt vì không ném đá, nếu bị ném đá thì tốt vì không bị đánh bằng gậy, nếu bị đánh bằng gậy thì tốt vì không bị đâm bằng dao, nếu bị đâm bằng dao thì tốt vì không bị lấy mạng sống bằng dao sắc; và nếu bị lấy mạng sống, Puṇṇa đáp sẽ nghĩ: có những đệ tử của Đức Thế Tôn sợ hãi, xấu hổ, ghê tởm thân và mạng sống, đi tìm dao để tự vẫn, còn mình đã tìm được dao ấy mà không cần tìm kiếm.

  Đức Phật tán thán: với sự tự chế và an tịnh như vậy, Puṇṇa có đủ khả năng sống ở xứ Sunāparanta. Puṇṇa ra đi, an trú tại đó, trong mùa an cư hướng dẫn khoảng năm trăm cư sĩ nam và năm trăm cư sĩ nữ được tín thọ, tự mình chứng đạt ba minh, rồi nhập Niết-bàn. Khi các tỳ-kheo hỏi về kiếp sau, Đức Phật xác nhận Puṇṇa là bậc hiền trí, hành theo pháp, không làm Ta phiền hà về pháp, và đã nhập diệt. Toàn bài gắn kết bài pháp về hỷ và khổ với tâm chuẩn bị sẵn sàng của người nhận pháp, và khép lại bằng quả chứng trọn vẹn của chính người được giáo hóa tóm tắt.
