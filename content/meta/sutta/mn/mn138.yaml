summary: |-
  Kinh Phân Biệt Tóm Lược diễn ra tại rừng Jeta, tu viện của ông Anāthapiṇḍika gần Sāvatthī, khi Đức Phật thuyết cho các tỳ-kheo một bản tóm lược mà không diễn giải rộng, rồi đứng dậy vào tịnh phòng: vị tỳ-kheo nên quán sát để thức của mình ở ngoài không tán loạn, không tán phát, ở trong không đứng dừng, không chấp thủ, không ưu nhiệt; khi ấy sự phát sinh của khổ tập sinh già chết trong tương lai không có.

  Các tỳ-kheo nghĩ đến Tôn giả Mahākaccāna, người được Đức Phật tán thán, để hỏi ý nghĩa; Tôn giả ví các vị như người cần lõi cây mà bỏ qua rễ và thân, chỉ tìm ở nhánh lá, vì đang đứng ngay trước bậc Đạo Sư lại bỏ qua Đức Phật, nhưng rồi vẫn diễn giải rộng nghĩa. Ông phân thức ở ngoài tán loạn, tán phát là thức theo đuổi theo tướng của đối tượng, bị trói vào vị ngọt của tướng ấy, qua cả sáu cửa từ thấy sắc bằng mắt đến biết pháp bằng ý; thức ở ngoài không tán loạn, không tán phát là thức không theo đuổi, không bị trói như vậy.

  Tâm ở trong đứng dừng là khi trong bốn thiền, từ sơ thiền với hỷ lạc do ly dục sinh đến thiền thứ tư không khổ không lạc, thức theo đuổi và bị trói vào vị ngọt của hỷ lạc hay xả thiền ấy; tâm ở trong không đứng dừng là khi thức không bị trói như vậy. Ưu nhiệt vì chấp thủ là của kẻ phàm phu chưa nghe pháp: xem sắc là ngã, ngã có sắc, sắc trong ngã, ngã trong sắc, và như vậy cho thọ, tưởng, hành, thức; khi sắc hay thức ấy biến đổi, thức theo đuổi sự biến đổi, ưu nhiệt chiếm trọn tâm, sanh lo âu, khổ não, kỳ vọng. Thánh đệ tử đã nghe pháp không xem năm uẩn ấy theo bốn cách ấy, nên khi chúng biến đổi, ưu nhiệt không chiếm trọn tâm, không sanh lo âu, khổ não, kỳ vọng.

  Tôn giả Mahākaccāna kết thúc bằng cách gửi các tỳ-kheo về hỏi Đức Phật; khi các vị trình lại lời diễn giải, Đức Phật tán thán Mahākaccāna là bậc hiền trí, đại tuệ, cho biết nếu được hỏi chính Ngài cũng sẽ diễn giải đúng như vậy, và xác nhận đó chính là ý nghĩa của bản tóm lược. Như vậy cả bốn phần diễn giải đều trả về cùng một điều: khi thức không tán loạn ở ngoài, không dừng ở trong, không ưu nhiệt vì chấp thủ, thì khổ trong tương lai không phát sinh.
