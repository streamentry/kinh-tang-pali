summary: |-
  Kinh Nhiều Loại Cảm Thọ diễn ra khi Đức Phật ở Sāvatthī, trong Kỳ Viên, tại tinh xá Anāthapiṇḍika. Người thợ cả Pañcakaṅga hỏi Tôn giả Udāyī Đức Phật đã nói bao nhiêu loại cảm thọ. Udāyī trả lời là ba loại: dễ chịu, đau khổ và không khổ không lạc. Pañcakaṅga không đồng ý: Đức Phật nói hai loại, dễ chịu và đau khổ; còn không khổ không lạc được xếp vào loại lạc yên tĩnh và vi tế. Hai người lặp lại lập luận ba lần, không ai thuyết phục được ai.

  Tôn giả Ānanda nghe được rồi thuật lại toàn bộ cho Đức Phật. Đức Phật cho cả hai đều đúng, mỗi người theo một cách phân loại: theo từng cách ấy, Ngài nói hai, ba, năm, sáu, mười tám, ba mươi sáu và một trăm lẻ tám loại cảm thọ. Nếu người ta không chịu công nhận điều người kia nói đúng và nói hay, có thể mong đợi tranh cãi, xung đột, bất hòa, dùng lời nói như giáo nhọn đâm chọc lẫn nhau; nếu biết công nhận như vậy, có thể mong đợi họ sống hòa hợp, hòa quyện như sữa với nước, nhìn nhau bằng ánh mắt thương mến.

  Đức Phật mô tả năm loại đối tượng dục — sắc do mắt, âm thanh do tai, mùi do mũi, vị do lưỡi, xúc chạm do thân nhận biết, đều đáng ưa, đáng thích, dễ chịu, hấp dẫn, khơi gợi ham muốn; niềm vui và lạc sinh khởi từ chúng được gọi là dục lạc. Rồi Ngài dựng một thang bậc: ai nói một mức lạc nào là mức cao nhất mà các hữu tình có thể cảm nhận, Ta không chấp nhận, vì còn lạc cao hơn và vi tế hơn.

  Từng bậc: sơ thiền có tầm và tứ vượt dục lạc; nhị thiền, khi tầm và tứ lắng dịu, vượt sơ thiền; tam thiền, tứ thiền lần lượt cao hơn; kế đến bốn xứ vô sắc — Không vô biên xứ, Thức vô biên xứ, Vô sở hữu xứ, Phi tưởng phi phi tưởng xứ — mỗi xứ cao hơn xứ trước; vượt hết thảy là diệt tưởng và thọ. Công thức lặp lại cho từng bậc.

  Ngài dự liệu du sĩ thuộc giáo phái khác sẽ thắc mắc sao diệt tưởng và thọ lại được xếp vào lạc, và dạy cách đáp: khi xếp một điều vào lạc, Đức Phật không chỉ nói đến cảm thọ dễ chịu; ở đâu và cách nào có lạc được tìm thấy, Như Lai đều gọi điều ấy là lạc. Bài kinh dừng ở đây: cùng một sự thật về cảm thọ có thể trình bày theo nhiều cách phân loại, và chữ lạc Đức Phật dùng rộng hơn cảm thọ dễ chịu.
