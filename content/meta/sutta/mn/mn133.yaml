summary: |-
  Kinh Một Đêm Có Lành cho Mahākaccāna được đặt tại Rājagaha, ở tu viện Suối Nước Nóng. Tôn giả Samiddhi sáng sớm đi tắm thì một vị thiên nữ hiện đến, hỏi ông có học thuộc bản tóm lược và phân biệt của một đêm có lành không; cả hai đều thưa không. Vị thiên nữ khuyên ông học lấy, tụng thuộc lòng và giữ gìn vì bản tóm lược ấy có ích, thuộc phạm hạnh ban đầu, rồi biến mất.

  Sáng hôm sau, Samiddhi tâu lại và xin Đức Phật thuyết. Đức Phật đọc bài kệ tóm lược — chớ chạy theo quá khứ, chớ mong đợi vị lai; hãy quán thấy pháp hiện tại một cách không lay động; hôm nay hãy tinh cần, vì không có sự mặc cả với đại quân của tử thần; ai nhiệt tâm an trú như vậy chính là vị một đêm có lành — rồi vào tịnh phòng mà không diễn giải rộng. Các tỳ-kheo chọn đến hỏi Tôn giả Mahākaccāna vì Ngài được Đức Phật tán thán, được đồng phạm hạnh có trí tôn trọng.

  Mahākaccāna ví các vị như người cần lõi cây gặp cây có lõi mà bỏ qua rễ và thân, lại tưởng lõi cây ở nhánh lá; ông nhắc rằng Đức Phật là bậc biết mà biết, thấy mà thấy, người ban sự bất tử, chủ tể của Pháp. Các tỳ-kheo nài xin, Tôn giả nhận lời.

  Tôn giả diễn giải sáu nghĩa theo sáu cặp mắt-sắc, tai-tiếng, mũi-hương, lưỡi-vị, thân-xúc, ý-pháp. Chạy theo quá khứ là nhớ từng cặp căn trần đã có trong quá khứ — tại đó thức bị trói buộc bởi dục vọng và tham ái; do hoan hỉ, vị ấy chạy theo quá khứ; không chạy theo là công thức ấy nhưng không trói buộc, không hoan hỉ. Mong đợi vị lai là mong sẽ có từng cặp căn trần như vậy — tâm đặt để đạt được điều chưa đạt được; do hoan hỉ, vị ấy mong đợi; không mong đợi là tâm không đặt để. Bị lung lay giữa các pháp hiện tại là khi từng cặp căn trần cùng hiện tại mà thức bị trói buộc bởi dục vọng và tham ái; do hoan hỉ, vị ấy bị lung lay; không bị lung lay là ngược lại. Tôn giả khuyên các vị đến hỏi chính Đức Phật và ghi nhớ đúng như Ngài diễn giải.

  Các tỳ-kheo tâu lại với Đức Phật. Đức Phật xác nhận Mahākaccāna là bậc hiền trí, bậc đại tuệ: nếu hỏi Ta, Ta cũng sẽ diễn giải đúng như cách Ngài đã diễn giải. Như vậy, "một đêm có lành" được mở qua sáu cặp căn trần: không truy quá khứ, không vọng vị lai, không lung lay giữa các pháp hiện tại.
