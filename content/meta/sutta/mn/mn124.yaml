summary: |-
  Kinh Bakkula diễn ra gần Rājagaha, tại Trúc Lâm, khu nuôi sóc. Đạo sĩ lõa thể Kassapa, bạn cũ thời cư sĩ của Bakkula, đến thăm, hỏi Ngài xuất gia bao lâu, được đáp tám mươi năm, rồi hỏi đã bao nhiêu lần hành dâm dục. Bakkula cho rằng không nên hỏi như vậy, mà nên hỏi đã bao nhiêu lần khởi lên dục tưởng; và ông không nhớ trong tám mươi năm có khởi lên dục tưởng nào. Kassapa thọ trì việc này là một pháp hy hữu, vị tằng hữu.

  Tiếp theo là loạt điều Bakkula không nhớ từng xảy ra trong tám mươi năm, mỗi điều đều được thọ trì là pháp hy hữu, pháp vị tằng hữu: không nhớ có khởi lên sân tưởng hay hại tưởng, dục tầm, sân tầm hay hại tầm; không nhớ có nhận y của cư sĩ, cắt, may, nhuộm y, may y kathina hay phụ giúp việc y cho đồng phạm hạnh; không nhớ có nhận lời thỉnh mời, khởi tâm mong được thỉnh mời, ngồi hay ăn trong nhà; không nhớ có chấp lấy tướng người nữ theo chi tiết, thuyết pháp cho người nữ dù chỉ một bài kệ bốn câu, hay thuyết pháp cho tỳ-kheo ni, thức-xá-ma-na, sa-di ni; không nhớ có cho ai xuất gia, thọ đại giới, trao nương tựa hay để sa-di hầu cận.

  Các điều không nhớ còn bao gồm: không tắm ở nhà tắm lửa, không tắm với bột tắm, không nhờ đồng phạm hạnh xát bóp thân, không từng bị bệnh dù chỉ trong thời gian vắt một vắt sữa bò, không nhận thuốc dù chỉ một mẩu harītakī, không tựa vào tấm tựa lưng, không dọn giường, và không an cư mùa mưa tại trú xứ gần làng. Kassapa nói có đúng bảy ngày mình còn mang nợ ăn đồ ăn khất thực của xứ, rồi ngày thứ tám chánh trí khởi sinh; ông xin xuất gia, thọ đại giới.

  Không lâu sau khi thọ đại giới, Kassapa sống một mình, độc cư, không phóng dật, nhiệt tâm, kiên quyết, chẳng bao lâu chứng đạt và an trú thắng trí, cứu cánh vô thượng của đời phạm hạnh, và trở thành một vị A-la-hán. Một thời gian sau, Bakkula cầm theo chìa khóa, đi từ tịnh xá này đến tịnh xá khác bảo các Tôn giả hãy đi ra, vì hôm nay ông sẽ nhập Niết-bàn; và ông nhập Niết-bàn trong tư thế ngồi ngay giữa Tăng chúng tỳ-kheo, việc này cũng được thọ trì là pháp hy hữu, pháp vị tằng hữu. Ý trung tâm của bài kinh là tám mươi năm thanh tịnh của Bakkula: không nhớ từng có dục tưởng, sân tưởng hay hại tưởng, và xa lánh gần như mọi dịp hội họp, tiếp xúc.
