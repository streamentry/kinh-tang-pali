summary: |-
  Ở Rājagaha, tại vườn Bambu, du sĩ Vacchagotta xin được dạy ngắn gọn điều gì là thiện, gì là bất thiện. Đức Phật nêu tham, sân, si mê là bất thiện và sự không tham, không sân, không si mê là thiện; rồi mười pháp bất thiện — từ hại sinh mạng, lấy của không cho, tà hạnh trong dục, bốn loại nói sai, đến tham dục, sân hận và tà kiến — với sự tránh của từng pháp là thiện. Khi khát ái được đoạn tận như gốc chặt cây talà, vị ấy là bậc A-la-hán.

  Vacchagotta hỏi lần lượt từng hạng: không phải chỉ một trăm mà hàng trăm và hơn nữa những tỳ-kheo, tỳ-kheo-ni nhờ đoạn tận các lậu hoặc tự thân chứng và an trú tâm giải thoát không lậu hoặc cùng huệ giải thoát ngay trong hiện tại. Cũng nhiều như vậy những nam cư sĩ sống phạm hạnh nhờ đoạn tận năm hạ phần kiết sử hóa sinh; những nam cư sĩ hưởng thụ các dục đã vượt qua hoài nghi, loại trừ do dự, sống tự tin không cần dựa vào ai trong lời dạy của Đạo sư; và hai hạng nữ cư sĩ với thành tựu tương ứng.

  Vacchagotta suy ra: nếu chỉ mình ông Gotama thành tựu thì đời phạm hạnh chưa hoàn thiện; nhưng vì cả bảy hạng — ông Gotama, các tỳ-kheo, tỳ-kheo-ni, nam và nữ cư sĩ sống phạm hạnh, nam và nữ cư sĩ hưởng thụ các dục — đều thành tựu, nên đời phạm hạnh hoàn thiện ở từng phương diện ấy. Ông ví hội chúng gồm cả tại gia lẫn xuất gia như dòng sông Hằng đổ vào Niết-bàn. Ông xin xuất gia; theo quy tắc sống thử thách bốn tháng cho cựu đạo sĩ đạo khác, Vacchagotta xin thử thách bốn năm và được xuất gia, thọ cụ túc giới.

  Nửa tháng sau, Vacchagotta bạch rằng mức tri thức của bậc hữu học mình đã đạt đến, xin dạy thêm. Đức Phật bảo phát triển thêm thiền định và tuệ quán để thông suốt nhiều giới, rồi liệt kê những điều nằm trong tầm tay: thần thông; thiên nhĩ giới thanh tịnh; bao quát tâm các chúng sinh, từ tâm có tham đến tâm chưa giải thoát; nhớ lại nhiều đời sống quá khứ; thiên nhãn thấy các chúng sinh chết đi, tái sinh theo nghiệp của mình; và nhờ đoạn tận các lậu hoặc, chứng tâm giải thoát không lậu hoặc cùng huệ giải thoát.

  Tôn giả Vacchagotta sống một mình, không buông lung, chẳng bao lâu chứng ngộ mục tiêu tối thượng và trở thành A-la-hán. Ông nhờ các tỳ-kheo đi yết kiến chuyển lời: con đã phụng sự Thế Tôn, con đã phụng sự Thiện Tôn. Đức Phật cho biết Ngài đã biết bằng tâm rằng Vacchagotta là bậc có Ba Thông Giải, lớn mạnh và có oai lực, và chư thiên cũng báo điều ấy.

notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 21.3–21.18 — «hiểu tâm … là “tâm …”» → «biết rõ tâm … là “tâm …”» (công thức `… cittanti pajāneyyaṁ`, cách dịch của an5.23:5.2–5.17 và an3.101:5.2–5.17; đổi cả 16 khoá của khối, gồm 21.5–21.7 và 21.18 không nằm trong danh sách, để khối thống nhất; 21.2 «hiểu rõ họ» giữ như an5.23:5.1); 21.13 — «không tối thượng» → «hữu thượng» (`sauttaraṁ` là «còn có cái cao hơn»; «tâm hữu thượng» là cách dịch của dn2:91.13, dn10:2.28.13) và 21.14 — «tối thượng» → «vô thượng» (`anuttaraṁ`, như dn2:91.14, dn10:2.28.14, an5.23:5.13); cách đa số «thượng thừa» cho `sauttaraṁ` bị bỏ vì lệch nghĩa; giữ nguyên 21.11–21.12 («quảng đại» như dn2/dn10; «rộng lớn» của an5.23 là cách khác, cùng đúng `mahaggata`) và 21.15–21.17 («có định», «đã giải thoát») vì đều đúng Pāli. Không đổi điểm.
