summary: |-
  Kinh Kosambī do Đức Phật thuyết tại tu viện Ghosita ở Kosambī, vì nhóm tỳ-kheo tại đó đang tranh cãi, gây gổ và bất hòa, dùng lời nói sắc như giáo mác đâm chém lẫn nhau; họ không thuyết phục được nhau, cũng không chịu để người khác thuyết phục, không chịu hiểu theo nhau. Được bậc Đạo Sư cho mời đến, họ thừa nhận với Đức Phật rằng đúng như vậy.

  Đức Phật hỏi các ông có hành động bằng thân, bằng khẩu, bằng ý với lòng từ đối với người đồng phạm hạnh lúc đang tranh cãi hay không; họ phải nhận cả ba đều không có mặt. Ngài cảnh báo như vậy sẽ đưa đến bất lợi và đau khổ lâu dài, rồi nêu sáu pháp đáng ghi nhớ, tạo nên thương mến, không tranh chấp, hòa hợp và nhất trí: thân hành, khẩu hành, ý hành đầy lòng từ; chia sẻ lợi dưỡng chân chánh dù chỉ phần thức ăn trong bình bát; sống hòa hợp trong những giới không sứt mẻ, đưa đến định; và sống hòa hợp trong chánh kiến cao quý đưa ra khỏi khổ.

  Trong sáu pháp ấy, chánh kiến cao quý là cao nhất, thu nhiếp và kết nối tất cả. Kinh định nghĩa: tỳ-kheo ở rừng, gốc cây hay nhà trống tự hỏi nội tâm còn trạng thái nào chưa từ bỏ có thể xâm chiếm tâm khiến không biết và không thấy đúng như thật. Nếu bị dục tham, sân hại, hôn trầm và thụy miên, trạo cử và hối tiếc, nghi, mải mê suy nghĩ về đời này hay đời sau, hay đang tranh cãi dùng lời sắc như giáo mác, tâm đang bị xâm chiếm; nếu không còn, tâm đã hướng đúng để giác ngộ các sự thật. Đây là tri kiến thứ nhất, cao quý, không chung với người phàm.

  Từ đó vị Thánh đệ tử tự thẩm định sáu tri kiến nữa: tự đạt được an tịnh và tịch lặng khi tu tập chánh kiến này; ngoài Giáo pháp này không có sa-môn hay bà-la-môn nào thành tựu chánh kiến cùng loại; phạm lỗi có thể phục hồi thì nhanh chóng trình bày, phơi bày và làm rõ trước bậc Đạo Sư hay người đồng phạm hạnh có trí, rồi phòng hộ trong tương lai; vẫn tha thiết với tăng thượng giới, tăng thượng tâm, tăng thượng tuệ dù bận việc cho người đồng phạm hạnh; và hai sức mạnh là lắng tai nghe Pháp, cùng cảm được ý nghĩa và hân hoan gắn với Pháp.

  Kinh kết luận: Thánh đệ tử có đủ bảy yếu tố ấy là người đã thành tựu quả Dự lưu; kinh đối lập lời sắc như giáo mác với sáu pháp hòa hợp, mà chóp đỉnh là chánh kiến.
