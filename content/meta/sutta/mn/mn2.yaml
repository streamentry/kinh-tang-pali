summary: |-
  Tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika, Đức Phật dạy các tỳ-kheo pháp môn phòng hộ tất cả lậu hoặc: lậu hoặc về dục, về sự hiện hữu và về vô minh. Ngài đặt nguyên tắc lậu hoặc chấm dứt đối với người biết và thấy, không phải người không biết không thấy, và sự khác biệt nằm ở chú tâm đúng cách hay chú tâm sai cách. Ngài nêu bảy cách đoạn trừ: bằng thấy biết, phòng hộ, sử dụng đúng cách, chịu đựng, tránh né, loại bỏ và tu tập.

  Phần dài nhất nói về lậu hoặc đoạn trừ bằng thấy biết, đối chiếu người phàm chưa được học hỏi với Thánh đệ tử. Người phàm không biết điều gì nên và không nên chú tâm, nên quay về những câu hỏi tự vấn về quá khứ, tương lai và hiện tại của tự ngã. Do chú tâm sai cách như vậy, một trong sáu quan điểm phát sinh và được xem là thật, là chắc chắn: rằng tôi có tự ngã, rằng tôi không có tự ngã, các cách nhận biết tự ngã, và quan điểm một tự ngã thường còn, là kẻ nói, kẻ cảm nhận. Người ấy mắc vào rừng rậm kiến chấp, không thoát khỏi sinh già chết. Ngược lại, Thánh đệ tử chú tâm đúng cách vào bốn sự thật: đây là khổ, nguồn gốc khổ, sự chấm dứt khổ, con đường đưa đến chấm dứt khổ; nhờ vậy ba kiết sử được đoạn trừ: thân kiến, hoài nghi, chấp thủ giới cùng nghi thức.

  Năm cách tiếp theo mang tính thực hành: bằng phòng hộ, sống có phòng hộ đối với mắt, tai, mũi, lưỡi, thân và ý; bằng sử dụng đúng cách, dùng y phục và chỗ ở để chống nóng lạnh, dùng thức ăn không để vui chơi mà để duy trì thân, hỗ trợ đời sống phạm hạnh, dùng thuốc men để giảm đau đớn do bệnh; bằng chịu đựng, chịu đựng lạnh nóng, đói khát, côn trùng, lời nói thô bạo và cảm thọ đau đớn dữ dội; bằng tránh né, tránh voi dữ, rắn, hố sâu, đầm lầy, những chỗ ngồi không thích hợp, nơi không nên lui tới và bạn xấu; bằng loại bỏ, không chấp nhận ý nghĩ về dục, sân hận hay gây hại đã sinh, mà từ bỏ và chấm dứt.

  Cách cuối cùng là tu tập bảy giác chi, từ niệm, trạch pháp, tinh tấn, hỷ, khinh an, định đến xả, dựa trên viễn ly, ly tham, đoạn diệt, hướng đến buông bỏ. Đức Phật kết luận: tỳ-kheo đã đoạn trừ bằng cả bảy cách ấy sống đã phòng hộ mọi lậu hoặc, cắt đứt ái, tháo bỏ kiết sử, nhờ thấu hiểu ngã mạn mà chấm dứt khổ.
