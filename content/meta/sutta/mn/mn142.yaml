summary: |-
  Đức Phật ở Kapilavatthu, trong tu viện Cây Đa. Đại ái đạo Gotamī dâng bộ y mới do chính bà dệt; ba lần Đức Phật khước từ và bảo hãy cúng dường Tăng, vì cúng dường Tăng thì cả Ngài lẫn Tăng đều được tôn trọng. Ānanda can rằng cả hai đã giúp ích nhau: bà là dì, là người cho sữa nuôi Đức Phật khi mẹ Ngài mạng chung; nhờ Ngài bà quy y Phật Pháp Tăng, từ bỏ sát sinh cho đến rượu men, đầy đủ tín bất hoại, hết hoài nghi về bốn Thánh đế.

  Đức Phật xác nhận ơn ấy không thể được báo đáp đầy đủ bằng sự đảnh lễ, đứng dậy chào đón, chắp tay cung kính, hay bằng cúng dường y, thức ăn, chỗ nằm chỗ ngồi, thuốc men; công thức ấy được lặp lại cho từng điều: quy y, từ bỏ các điều ác, tín bất hoại, hết hoài nghi về bốn Thánh đế.

  Đức Phật nêu mười bốn loại bố thí cho cá nhân: cúng dường Như Lai, Độc Giác Phật, bậc A-la-hán, rồi các bậc Dự lưu, Nhất hoàn, Bất hoàn và những người đang hành trì để chứng từng quả ấy, cho đến người ngoài đã ly tham các dục, phàm phu có giới hạnh, phàm phu ác giới, và chúng sinh súc sinh. Quả có thể mong đợi gấp trăm cho súc sinh, gấp nghìn cho phàm phu ác giới, gấp trăm nghìn cho phàm phu có giới hạnh, gấp trăm câu-chi cho người ngoài đã ly tham các dục, còn từ người hành trì chứng Dự lưu trở lên là vô số vô lượng.

  Tiếp đó là bảy loại bố thí cúng dường Tăng: cho chúng hai Tăng khi Đức Phật còn tại thế và sau khi Ngài nhập diệt, cho Tăng tỳ-kheo, Tăng tỳ-kheo ni, và cho các trường hợp cúng dường kèm lời xin chỉ định trong Tăng. Đức Phật nói thời vị lai sẽ có những hạng quàng vắt y vàng trên cổ, ác giới ác pháp, và bố thí cúng dường Tăng khi ấy vẫn vô số vô lượng; nhưng không có bố thí cho cá nhân nào có quả lớn hơn bố thí cúng dường Tăng.

  Cuối kinh là bốn sự thanh tịch của bố thí tùy theo người cho và người nhận có giới hay ác giới: thanh tịch nơi người cho, nơi người nhận, nơi cả hai, hay không nơi nào. Kệ kết luận nói bố thí của chân chính mà có, tâm đầy tịnh tín, tin chắc nghiệp quả, khi người có giới cúng dường cho bậc có giới thì có quả rộng lớn; còn người vô tham cúng dường cho bậc vô tham là bố thí tối thượng trong các bố thí vật chất.
