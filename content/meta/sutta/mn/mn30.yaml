summary: |-
  Tại rừng Jeta ở Sāvatthī, bà-la-môn Piṅgalakoccha đến gặp Đức Phật và hỏi về sáu giáo chủ nổi tiếng thời ấy, rằng theo lời họ tự tuyên bố, tất cả họ đều trực tiếp chứng biết, hay không ai chứng biết, hay chỉ một số người. Đây là Tiểu Kinh Dụ Lõi Cây.

  Đức Phật gác câu hỏi ấy sang một bên, mở đầu bằng hình ảnh những người cần lõi cây gặp cây lớn có lõi: kẻ chặt cành lá, kẻ chặt chồi non, kẻ bóc vỏ, kẻ chặt giác cây đều tưởng mình mang lõi cây và bị người sáng mắt bảo rằng việc gì cần lõi cây sẽ không đạt được; chỉ kẻ chặt đúng lõi cây mới làm thành công.

  Đức Phật áp vào người xuất gia vì lòng tin, mong chấm dứt khối khổ của sinh, già, chết, sầu, bi, khổ, ưu, não. Vị được lợi dưỡng, sự kính trọng và danh tiếng rồi cho là đủ, khen mình chê người, lười nhác buông xuôi, không khởi nhiệt tâm chứng những pháp cao hơn và tinh tế hơn, là nhầm cành lá; vị thành tựu giới mà dừng lại ở đó là nhầm chồi non; vị thành tựu định mà tự mãn là nhầm vỏ cây; vị thành tựu tri kiến, sống biết và thấy, mà dừng lại là nhầm giác cây.

  Đức Phật rồi liệt kê những pháp cao hơn và tinh tế hơn tri kiến: bốn tầng thiền, từ sơ thiền có tầm và tứ cho tới tứ thiền không khổ không lạc với niệm thanh tịnh nhờ xả; bốn cõi vô sắc, từ Không vô biên xứ qua Thức vô biên xứ, Vô sở hữu xứ đến Phi tưởng phi phi tưởng xứ; và cuối cùng diệt thọ tưởng định, nơi vị tỳ-kheo thấy bằng trí tuệ nên các lậu hoặc được đoạn tận. Vị ấy mới giống người chặt đúng lõi cây.

  Bài kinh kết luận: đời phạm hạnh không được sống vì lợi dưỡng, sự kính trọng và danh tiếng, cũng không phải để thành tựu giới, định hay tri kiến; chính tâm giải thoát không thể lay chuyển mới là mục tiêu của đời phạm hạnh, là lõi cây và là điểm cuối cùng. Nghe dạy, bà-la-môn Piṅgalakoccha quy y trọn đời làm cư sĩ.
