summary: |-
  Đức Phật ở Vesālī khi Saccaka, con của những người Nigaṇṭha, đến định chê bai Phật, Pháp và Tăng. Ông cho rằng có người tu thân không tu tâm, người tu tâm không tu thân, và đệ tử của Ngài thuộc loại sau. Hỏi về tu tập thân, ông kể khổ hạnh lõa thể của Nanda Vaccha, Kisa Saṅkicca, Makkhali Gosāla; Đức Phật chỉ ra thân họ tăng giảm vì từ bỏ thức ăn đạm bạc rồi ăn món ngon; hỏi về tu tập tâm thì Saccaka không trả lời được; Ngài kết luận ông chưa hiểu tu tập thân, huống chi tu tập tâm.

  Đức Phật giải thích: người chưa tu tập bị cảm thọ dễ chịu và đau khổ chiếm lấy tâm, dễ chịu vì thân chưa tu tập, đau khổ vì tâm chưa tu tập; vị Thánh đệ tử đã tu tập thì không bị chiếm lấy. Saccaka nói tin Ngài đã tu tập cả hai; Đức Phật đáp: từ khi xuất gia không cảm thọ nào chiếm lấy tâm.

  Khi còn là Bồ-tát, Ngài theo Āḷāra Kālāma chứng Vô sở hữu xứ, theo Uddaka Rāmaputta chứng Phi tưởng phi phi tưởng xứ; cả hai pháp ấy không dẫn đến giác ngộ, chỉ đưa đến tái sinh vào chỗ đạt được, nên Ngài rời đi. Ở Uruvelā, ba ví dụ hiện lên: cọ lửa vào khúc gỗ xanh còn nhựa hay khúc gỗ khô hết nhựa trên đất khô; chỉ khúc gỗ khô, hết nhựa mới tạo được lửa — người chưa xa lìa dục, dù chịu hay không chịu ép xác, không thể đạt tri kiến và giác ngộ tối thượng; người đã xa lìa dục thì có thể đạt.

  Ngài thử khổ hạnh: thiền không thở gây đau đớn dữ dội, nhịn ăn gần hoàn toàn, mỗi lần chỉ ăn chút nước luộc đậu, gầy kiệt. Tinh tấn và niệm vẫn duy trì, cảm thọ đau khổ không chiếm lấy tâm. Nhận thấy khổ hạnh ấy không đạt pháp siêu nhân, Ngài nhớ lại sơ thiền thuở nhỏ dưới bóng cây jambu, nhận thức đó là con đường đưa đến giác ngộ, rồi ăn, lấy lại sức và chứng bốn thiền, lạc thọ mỗi tầng đều không chiếm lấy tâm.

  Trong ba canh đêm ấy, Ngài đạt ba minh: trí nhớ các đời sống quá khứ; với thiên nhãn, thấy chúng sinh chết đi, tái sinh theo nghiệp; và trí đoạn tận các lậu hoặc khi biết bốn Thánh Đế, sinh đã tận, không còn trở lại. Hỏi về ngủ ngày, Ngài phân biệt mê muội và không mê muội ở chỗ có từ bỏ các lậu hoặc hay chưa. Saccaka khen gương mặt Đức Phật vẫn sáng trong dù bị công kích, khác các giáo chủ từng tỏ giận dữ, rồi ra đi.
