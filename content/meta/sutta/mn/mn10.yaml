summary: |-
  Kinh Niệm Xứ ghi lại lời Đức Phật, một thời ở xứ Kuru gần thị trấn Kammāsadamma, gọi các tỳ-kheo và tuyên bố bốn niệm xứ là con đường trực tiếp đưa đến thanh tịnh, vượt qua sầu bi, chấm dứt khổ ưu và chứng ngộ Niết-bàn. Bốn niệm xứ ấy là quán thân nơi thân, quán thọ nơi các thọ, quán tâm nơi tâm, quán pháp nơi các pháp, sống với nhiệt tâm, tỉnh giác, có niệm, đã gạt bỏ tham và ưu đối với đời.

  Quán thân gồm mười bốn phép. Trước hết là niệm hơi thở: ngồi nơi vắng, thiết lập niệm, vị ấy biết rõ hơi thở vào ra dài hay ngắn, tập cảm nhận toàn thân và làm lắng dịu hoạt động của thân. Tiếp theo là biết rõ các tư thế đi, đứng, ngồi, nằm; giữ tỉnh giác trong mọi sinh hoạt; quán các phần bất tịnh từ tóc đến nước tiểu; và quán bốn yếu tố đất, nước, lửa, gió cấu thành thân. Cuối cùng là chuỗi quán tử thi ở nghĩa địa, từ tử thi trương phồng, phân hủy, bị chim thú ăn, đến khi chỉ còn xương trắng; mỗi lần vị ấy so sánh với thân mình rằng thân này cũng có cùng bản chất như vậy, không thể vượt khỏi.

  Quán thọ liệt kê chín loại: lạc, khổ, không khổ không lạc, mỗi loại chia thành thuộc về thế tục hay không thuộc về thế tục, và vị ấy biết rõ từng thọ đang khởi. Quán tâm biết rõ mười sáu trạng thái theo từng cặp, từ tâm có tham hay không tham, có sân, có si, co hẹp hay tán loạn, đến có định hay không và được giải thoát hay chưa. Sau mỗi phần, kinh lặp lại công thức quán bên trong, bên ngoài, quán sinh khởi và hoại diệt, sống không nương tựa, không chấp thủ.

  Quán pháp gồm năm mục: biết khi nào năm chướng ngại (dục tham, ác ý, hôn trầm và buồn ngủ, trạo cử và hối hận, hoài nghi) có mặt, hiểu cách chúng phát sinh, được từ bỏ, không trở lại; quán xét sắc, thọ, tưởng, hành, thức cùng sự sinh khởi và biến mất của năm uẩn bị chấp thủ; hiểu kiết sử phát sinh do duyên mắt và hình sắc cho đến ý và các pháp; biết khi nào bảy giác chi từ niệm đến xả có mặt và cách tu tập đến viên mãn; và biết đúng như thật bốn Thánh đế.

  Kinh khép lại bằng cách thu ngắn thời gian tu tập từ bảy năm xuống bảy ngày, với hai kết quả có thể mong đợi: chánh trí trong đời này, hoặc nếu còn dư y thì quả Bất lai.
