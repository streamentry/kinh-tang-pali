summary: |-
  Tại Đại Lâm ở Vesālī, Saccaka, con của những người Nigaṇṭha, vốn tự hào không ai tranh luận nổi, nghe Tôn giả Assaji cho biết Đức Phật thường dạy năm uẩn vô thường, vô ngã. Ông dẫn khoảng năm trăm người Licchavi đến đàm luận, tự tin kéo được Đức Phật qua lại, xoay tới xoay lui như kéo lông cừu.

  Đức Phật xác nhận lời ấy. Saccaka nêu ví dụ đất: mọi cây cỏ và công việc cần sức lực đều nương vào đất, như con người lấy năm uẩn làm tự ngã mà tạo phước hay phi phước; ông tuyên bố sắc, thọ, tưởng, hành, thức là tự ngã của mình. Đức Phật hỏi ngược, lấy ví dụ vị vua có quyền xử tử trong lãnh thổ mình: khi nói sắc là tự ngã, ông có quyền ra lệnh sắc ấy như thế này hay đừng như thế kia không? Đến lần hỏi thứ ba, sợ dạ-xoa Vajirapāṇi cầm chày sắt cháy rực đứng trên không, ông đành trả lời không; câu hỏi lặp lại cho thọ, tưởng, hành, thức.

  Sau đó, Đức Phật dẫn qua chuỗi logic: sắc vô thường, cái vô thường là khổ, và cái vô thường khổ, chịu biến đổi không thích hợp để xem là của tôi, là tôi, là tự ngã của tôi; công thức lặp cho bốn uẩn còn lại; ai bám vào khổ thì không thể hiểu khổ hay chấm dứt khổ. Đức Phật ví luận điểm của Saccaka với thân chuối bị bóc hết bẹ lá mà không tìm được lõi cây, và chỉ ra mồ hôi đang chảy trên trán ông trong khi thân Ngài không mồ hôi. Dummukha thêm ví dụ con cua bị bẻ gãy hết càng; Saccaka phải bỏ lời tuyên bố cũ.

  Saccaka đổi sang hỏi pháp. Đức Phật phân hai mức: đệ tử thực hành theo lời dạy, đã vượt qua nghi, hết phân vân, không dựa vào người khác, là người thấy đúng như thật bằng chánh trí tuệ mọi sắc, thọ, tưởng, hành, thức, quá khứ, hiện tại hay tương lai, bên trong hay bên ngoài, thô hay tế, xa hay gần, là không phải của tôi, không phải là tôi, không phải tự ngã của tôi; còn tỳ-kheo A-la-hán là người thấy như vậy rồi được giải thoát vì không chấp thủ, thành tựu ba điều vô thượng: thấy, thực hành và giải thoát vô thượng.

  Saccaka thú nhận là liều lĩnh khi định tấn công Đức Phật, rồi mời Ngài cùng Tăng đoàn dùng bữa. Sau bữa cúng dường, Đức Phật phân biệt: quả cúng dường cho người chưa lìa tham, sân, si thuộc về người cúng dường, còn quả cúng dường cho bậc đã lìa tham, sân, si thì thuộc về Saccaka.
