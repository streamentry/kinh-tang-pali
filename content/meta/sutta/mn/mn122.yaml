summary: |-
  Kinh Đại Không mở đầu tại xứ Sakya, gần Kapilavatthu, khi Đức Phật thấy nhiều chỗ nằm đã dọn sẵn ở tịnh xá của Kāḷakhemaka, và buổi chiều được Tôn giả Ānanda cho biết nhiều tỳ-kheo đang trú ở tịnh xá ấy vì thời gian làm y. Ngài dạy: vị tỳ-kheo ưa thích hội họp, đoàn thể không sáng đẹp, không thể mong đợi chứng được lạc ly dục, lạc độc cư, lạc an tịnh, lạc chánh giác; người sống một mình, tách rời đoàn thể thì có thể mong đợi.

  Bài kinh nêu pháp an trú Như Lai đã giác ngộ: chứng và an trú nội không bằng cách không tác ý tất cả các tướng; khi ai đến yết kiến, Ngài chỉ nói những lời để tiễn người ấy về.

  Muốn chứng nội không, tỳ-kheo phải an định nội tâm, thu nội tâm vào định bằng bốn thiền. Vị ấy lần lượt tác ý nội không, ngoại không, nội ngoại không và bất động; nếu tâm không hướng đến, không tịnh tín, không an trú, không giải thoát, vị ấy biết rõ, rồi an định nội tâm ngay trên định tướng trước kia để tác ý lại; khi tâm hướng đến, tịnh tín, an trú, giải thoát, vị ấy cũng biết rõ như vậy.

  Khi kinh hành, đứng, ngồi hay nằm, vị ấy nghĩ tham và ưu cùng các pháp ác bất thiện sẽ không chảy theo mình; khi đàm luận và tư duy, tránh các đàm luận hạ liệt và suy nghĩ về dục, sân hận, gây hại, chỉ đàm luận về ít muốn, biết đủ, độc cư, giới, định, tuệ, giải thoát, và tư duy suy nghĩ ly dục, không sân, không gây hại. Vị ấy quán sát tự tâm xem có hướng đến năm đối tượng dục nào hay không, để biết dục vọng và tham ái đã đoạn trừ hay chưa; và quán sát sự sinh khởi, biến mất nơi năm thủ uẩn, để mọi tâm ngã mạn được đoạn trừ.

  Đức Phật nêu ba sự nguy hại: bậc thầy, rồi đồ đệ, sống độc cư mà say mê, tham lam khi dân chúng lui tới; và nguy hại của người phạm hạnh, khi chính Đức Phật không bị lôi kéo nhưng đệ tử noi Ngài lại bị, đưa đến đọa lạc. Vì vậy các thầy hãy đối xử với Ta như người bạn, đừng như kẻ thù. Ngài sẽ không nâng niu các thầy như người thợ gốm nâng niu chiếc chum còn thô, chưa nung, mà sẽ quở trách, thúc dục lại nhiều lần; cái gì là lõi sẽ đứng vững. Ý trung tâm là đối lập hội họp với độc cư: chỉ người sống một mình mới có thể mong đợi chứng được nội không và các tâm giải thoát.
