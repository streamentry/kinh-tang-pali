notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá mn129:35.7, 35.15 — “không được uống rượu” → “không được uống chất say” (majja là chất say nói chung, “rượu” hẹp hơn Pāli; khớp dn17:1.9.4, dn26:6.7); giữ nguyên “hưởng dụng như trước” cho yathābhuttañca bhuñjathā (bản đa số “theo mức đã được quy định” thêm ý không có trong Pāli) và giữ nguyên khoá 30.8 vì “đi đến mê loạn” cùng cách dịch với 5.8 trong bài.

summary: |-
  Đức Phật trình bày ba đặc tướng của kẻ ngu: suy tư ác, nói lời ác, làm ác nghiệp — vì thế người trí biết được kẻ ngu. Kẻ ngu cảm thọ ba khổ ưu ngay hiện tại: nghe người ta đàm luận chuyện sát sinh, lấy của không cho, tà dâm, nói dối, uống rượu thì thấy các pháp ấy ở nơi ta; thấy vua trừng trị kẻ phạm tội thì lo mình cũng bị vậy; khi nằm nghỉ, các ác nghiệp đã làm đè xuống như bóng núi lớn, và kẻ ngu than khóc vì điều lành chưa làm, điều ác đã làm.

  Kẻ ngu ấy sau khi chết sinh vào địa ngục — thứ hoàn toàn không đáng ưa, không vừa ý. Ví dụ: kẻ phạm tội bị đánh ba trăm mũi giáo; đem khổ ấy so với khổ địa ngục như hạt đá so với núi Himavān. Kinh tả các hình phạt — cọc sắt nung đỏ, rìu, dao, đất cháy, nồi đồng, đại địa ngục tường sắt cháy đỏ trăm do-tuần — không dễ kể cho cùng cực.

  Rồi là sinh cảnh súc sinh: đồng cư với loài ăn cỏ, loài ăn phân, loài sinh già chết trong bóng tối, trong nước, trong dơ bẩn. Ví dụ con rùa mù trăm năm nổi một lần, lọt qua lỗ cái ách trôi trên đại dương — thân người với kẻ ngu đã rơi vào đường đọa còn khó hơn thế, vì ở đó chỉ có ăn thịt kẻ yếu. Nếu trở lại thân người, kẻ ngu sinh vào gia đình hạ cấp, lại làm tà hạnh rồi rơi lại địa ngục — như người cờ bạc thua mất tài sản còn bị trói, mà lần thua ấy vẫn nhỏ hơn lần rơi vào địa ngục.

  Người hiền có ba đặc tướng đối xứng: suy tư thiện, nói lời thiện, làm thiện nghiệp; và ba loại an lạc ngay hiện tại — nghe chuyện tương xứng với mình thì thấy các pháp ấy ở nơi ta; thấy vua trừng trị kẻ phạm tội thì biết các pháp ấy không ở nơi ta; khi nằm nghỉ, các thiện nghiệp đã làm đè xuống như bóng núi lớn và người hiền không sầu não. Người hiền sau khi chết sinh vào cõi trời — thứ hoàn toàn đáng ưa, đáng thích, vừa ý.

  Ví dụ cõi trời là vị Chuyển luân vương thành tựu bảy báu — bánh xe báu chinh phục bốn phương với lời dạy giữ năm giới — và bốn phước lạc: sắc đẹp, trường thọ, ít bệnh, được yêu mến. Đức Phật cầm hạt đá hỏi lại: an lạc ấy đem thiên lạc ra so, như hạt đá đem núi Himavān ra so. Người hiền nếu trở lại thân người thì sinh vào gia đình cao quý, lại làm thiện hạnh sinh lên cõi trời — lần thắng ấy vẫn nhỏ hơn lần thắng lên cõi trời. Đó là địa người hiền đầy đủ.
