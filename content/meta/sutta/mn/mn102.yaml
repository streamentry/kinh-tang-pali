summary: |-
  Kinh Năm và Ba ghi lời Đức Phật dạy các tỳ-kheo tại rừng Jeta, tu viện ông Anāthapiṇḍika ở Sāvatthī, về những sa-môn bà-la-môn suy đoán đời sau và quá khứ mà ôm giữ kiến chấp, cùng những vị tuyên bố Niết-bàn ngay trong hiện tại; các chủ thuyết ấy gọi là tổng thuyết của năm và ba.

  Về đời sau, mọi suy đoán được quy về năm xứ. Xứ thứ nhất chủ trương tự ngã hữu tưởng, không bệnh sau khi chết, chia theo sắc và theo tưởng; trong đó có vị chủ trương vô sở hữu xứ là vô lượng, bất động. Xứ thứ hai chủ trương tự ngã vô tưởng, bác bỏ nhóm hữu tưởng vì coi tưởng là bệnh, mụn nhọt, mũi tên. Xứ thứ ba chủ trương tự ngã phi tưởng phi phi tưởng, bác bỏ cả hai nhóm trước; xứ ấy chỉ đạt được với tàn dư các hành. Xứ thứ tư chủ trương sự đoạn diệt hoại vong của chúng sinh, vẫn xoay quanh thân kiến như chó bị xích quanh cột trụ. Xứ thứ năm tuyên bố Niết-bàn ngay trong hiện tại.

  Về quá khứ, kinh nêu mười sáu quan điểm về tự ngã và thế giới: thường còn hay vô thường, hữu hạn hay vô hạn, các loại tưởng, các cảm thọ lạc khổ, mỗi cặp kèm hai trường hợp trung gian. Mỗi quan điểm đều tuyên bố đây mới là sự thật, ngoài ra là hư vọng; nhưng không tín, sở thích, truyền khẩu hay suy xét nào làm tri kiến tự mình thanh tịnh, và khi tri kiến ấy không có mặt, phần chút tri kiến ấy vẫn là chấp thủ.

  Xứ thứ năm bày theo từng tầng: có vị từ bỏ kiến chấp quá khứ, đời sau, không chú tâm các kiết sử dục, chứng nhập hỷ do viễn ly mà coi đó là tịch tịnh thù thắng; nhưng hỷ ấy đoạn diệt thì ưu sinh khởi, ưu diệt thì hỷ lại sinh. Tiếp đó là các tầng lạc phi vật chất, thọ không khổ không lạc, rồi lời quán ta là tịch tịnh, tịch diệt, vô chấp. Cho từng tầng, kinh nhắc công thức chừng ấy là hữu vi, thô thiển, nhưng sự đoạn diệt của các hành mới là thật; ngay cả lời quán ấy cũng vẫn là chấp thủ.

  Còn điều Như Lai đã chánh giác là pháp an tịnh tối thắng vô thượng: biết như thật sự tập khởi, diệt tận, vị ngọt, nguy hiểm và xuất ly của sáu xúc xứ, là giải thoát không chấp thủ. Mọi suy đoán, mọi tầng an vui hữu vi đều là chấp thủ; riêng biết thật sáu xúc xứ mới đưa đến an tịnh.
