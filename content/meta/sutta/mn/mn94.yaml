notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá mn94:15.4 — “Sống tại gia chật chội, lấm bẩn; đời xuất gia rộng rãi thoáng đãng” → “Đời sống tại gia chật hẹp, đầy bụi bặm; đời xuất gia rộng mở như hư không” (rajopatho là con đường bụi bặm, abbhokāso là khoảng trời rộng; khớp dn2:41.4, dn10:1.8.4); khoá mn94:18.1 (cùng 18.3–18.7, cùng công thức) — “Với mắt thấy sắc, vị ấy chẳng chấp thủ tướng, chẳng chấp thủ tùy tướng” → “Khi mắt thấy sắc, vị ấy không nắm giữ tướng chung hay các chi tiết” (nimittaggāhī / anubyañjanaggāhī là “nắm giữ”, không phải upādāna “chấp thủ”; khớp mn51:16.x, mn38, mn101, mn27 cùng Majjhima); giữ nguyên khoá 19.1 vì lặp “tỉnh giác khi …” theo từng vế sampajānakārī hoti của Pāli (bản đa số gộp một lần, mất phần lặp) và “y tăng-già-lê, bát và y” đúng saṅghāṭipattacīvara.

summary: |-
  Kinh Ghoṭamukha mở ra ở Bārāṇasī, tại vườn xoài Khemiya, nơi Tôn giả Udena trú. Bà-la-môn Ghoṭamukha đi dạo vào vườn và nói với Tôn giả đang kinh hành rằng chẳng có đời du sĩ như pháp, vì ông chưa từng thấy các bậc đáng kính như thế hay một giáo pháp cho chuyện này. Tôn giả Udena đề nghị đàm luận với điều kiện: chấp nhận điều nên chấp nhận, bác bỏ điều nên bác bỏ, hỏi lại ngay khi chưa hiểu ý nghĩa.

  Tôn giả Udena nêu bốn hạng người: hạng tự hành xác; hạng hành xác người khác; hạng vừa tự hành xác vừa hành xác người khác; và hạng chẳng hành xác ai, trong hiện tại không khát ái, đã tịch tịnh, nguội lạnh, thọ hưởng an lạc. Ghoṭamukha chỉ ưa thích hạng thứ tư, vì ba hạng kia hành hạ những người muốn an lạc, ghê sợ khổ đau. Hỏi hạng ấy thấy trong đoàn đắm say vợ con, ruộng đất, vàng bạc, hay trong đoàn xuất gia, ông đáp là đoàn xuất gia, rút lại lời: có đời du sĩ như pháp, xin phân tích chi tiết.

  Trong phần phân tích, hạng tự hành xác là người lõa thể, kiêng đủ thứ về ăn uống, cho đến nửa tháng một lần, ăn cỏ, ăn phân bò, mặc y vỏ cây, nhổ tóc râu, nằm chiếu gai. Hạng hành xác người khác là các nghề giết chóc: giết cừu, giết heo, thợ săn, đánh cá, trộm cướp, hành hình, giết bò, coi ngục. Hạng vừa tự hành xác vừa hành xác người khác là vị vua hay Bà-la-môn quý tộc làm lễ hiến tế, lệnh giết bò, nghé, dê, cừu, ngựa, khiến đầy tớ khóc lóc mà làm việc.

  Hạng thứ tư: Như Lai xuất hiện, thuyết Pháp; một gia chủ nghe Pháp, sinh tín, từ bỏ tài sản, xuất gia. Vị ấy sống với giới hạnh, biết đủ như con chim chỉ mang theo đôi cánh, kiềm chế các căn, có niệm tỉnh giác; từ bỏ năm triền cái, chứng bốn thiền; rồi nhớ lại các đời sống quá khứ, thấy các chúng sinh chết đi tái sinh tùy theo nghiệp, biết rõ khổ, nguồn gốc khổ, chấm dứt các lậu hoặc: sinh đã tận, không còn trở lại. Vị ấy chính là hạng người chẳng tự hành xác, chẳng hành xác ai.

  Ghoṭamukha xin quy y Tôn giả Udena, nhưng Tôn giả hướng ông về Đức Phật. Nghe Đức Phật đã nhập diệt độ, ông nói dù cách một trăm do-tuần cũng sẽ đi yết kiến nếu còn gặp được, rồi quy y Đức Phật, Pháp và Tăng chúng. Ông xin dâng khoản cấp hằng ngày năm trăm kahāpaṇa; Tôn giả không nhận vàng bạc, mà khuyên xây một giảng đường cho Tăng chúng ở Pāṭaliputta; giảng đường ấy về sau mang tên Ghoṭamukhī.
