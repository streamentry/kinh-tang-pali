summary: |-
  Kinh Nhiều Giới do Đức Phật thuyết tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika. Đức Phật khẳng định: mọi nguy hiểm, tai họa, họa hoạn đều khởi lên từ kẻ ngu, không phải từ bậc hiền trí; do đó các tỳ-kheo nên học để thành bậc hiền trí, bậc thẩm sát. Ānanda hỏi mức nào một tỳ-kheo xứng danh bậc thẩm sát, và đáp án là: khéo về giới, khéo về xứ, khéo về duyên khởi, khéo về chỗ có thể và không thể có.

  Bậc khéo về giới được nói qua sáu cách liệt kê: biết và thấy mười tám giới từ mắt, sắc, nhãn thức đến ý, pháp, ý thức; hoặc sáu giới đất, nước, lửa, gió, hư không, thức; hoặc sáu giới lạc, khổ, hỷ, ưu, xả, vô minh; hoặc sáu giới dục, ly dục, sân, không sân, hại, không hại; hoặc ba giới dục, sắc, vô sắc; hoặc hai giới hữu vi, vô vi. Bậc khéo về xứ là biết và thấy sáu nội ngoại xứ, từ mắt và các sắc đến ý và các pháp.

  Bậc khéo về duyên khởi biết rõ nguyên tắc khi cái này có, cái kia có; khi cái này không có, cái kia không có; do cái này diệt, cái kia diệt; và biết rõ toàn bộ chuỗi từ vô minh làm duyên cho hành, hành làm duyên cho thức, cho đến sinh làm duyên cho già-chết, sầu bi khổ ưu não, nhờ đó toàn bộ khối khổ sinh khởi; và khi vô minh hoàn toàn đoạn diệt, chuỗi ấy diệt cho đến toàn bộ khối khổ diệt tận.

  Về chỗ có thể và không thể có, vị tỳ-kheo biết rõ từng cặp. Không thể có, không có cơ hội, rằng vị thành tựu kiến chấp điều nào là thường, là lạc, hoặc chấp pháp nào là tự ngã; rằng vị ấy giết mẹ, giết cha, giết bậc A-la-hán, làm nhầu máu Đức Như Lai, chia rẽ Tăng hay chỉ rõ một bậc Đạo sư khác; rằng một thế giới xuất hiện cùng lúc hai vị A-la-hán Chánh Đẳng Giác hay hai vị vua Chuyển Luân; rằng nữ nhân là bậc A-la-hán Chánh Đẳng Giác, là vua Chuyển Luân, làm vua Sakka, vua Māra hay Phạm thiên; rằng ác hạnh thân, khẩu, ý sinh ra quả đáng ý, dễ chịu, hay người ác hạnh sinh vào cõi lành, cõi trời. Các điều ngược lại đều có thể có.

  Kinh kết thúc bằng năm tên Đức Phật đặt cho pháp môn: Nhiều Giới, Bốn Vòng Xoay, Gương Pháp, Trống Bất Tử, Chiến Thắng Không Hơn Nhau, để tỳ-kheo biết rõ cái gì không bao giờ xảy ra và cái gì vẫn có thể.
