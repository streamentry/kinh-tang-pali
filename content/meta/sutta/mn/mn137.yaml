summary: |-
  Đức Phật thuyết Kinh Phân Biệt Sáu Xứ cho các tỳ-kheo tại rừng Jeta, tu viện ông Anāthapiṇḍika gần Sāvatthī, tóm lược: sáu nội xứ, sáu ngoại xứ, sáu thức thân, sáu xúc thân, mười tám ý hành, ba mươi sáu hữu tình vị cần được biết; nương cái này hãy đoạn bỏ cái này; ba niệm xứ là điều bậc Thánh hành trì, nhờ đó bậc Đạo Sư xứng đáng lãnh đạo đồ chúng.

  Sáu nội xứ là xứ mắt, xứ tai, xứ mũi, xứ lưỡi, xứ thân, xứ ý; sáu ngoại xứ là xứ sắc, xứ tiếng, xứ hương, xứ vị, xứ xúc, xứ pháp; sáu thức thân là thức mắt cho đến thức ý, sáu xúc thân là xúc mắt cho đến xúc ý. Mười tám ý hành là sáu hỷ suy tầm, sáu ưu suy tầm, sáu xả suy tầm, khi qua mỗi cửa từ mắt đến ý, người ấy suy tầm điều đem lại hỷ, đem lại ưu, đem lại xả.

  Ba mươi sáu hữu tình vị gồm sáu hỷ, sáu ưu, sáu xả, mỗi loại chia cận cư gia đình và cận cư xuất thế. Hỷ và ưu gia đình gắn với đạt được hay không đạt được, đối tượng đáng ưa thuộc dục thế gian; hỷ và ưu xuất thế gắn với biết rõ xứ vô thường, biến đổi, ly tham, đoạn diệt; ưu xuất thế là ưu do khát ngưỡng đối với các vô thượng giải thoát. Xả gia đình là xả của kẻ ngu si phàm phu chưa nghe pháp, không vượt quá đối tượng; xả xuất thế vượt quá đối tượng.

  Phần đoạn bỏ thành chuỗi: nương sáu hỷ, ưu, xả xuất thế để đoạn bỏ, vượt qua sáu hỷ, ưu, xả gia đình, rồi nương hỷ xuất thế đoạn bỏ ưu xuất thế, nương xả xuất thế đoạn bỏ hỷ xuất thế. Kinh còn phân xả đa dạng, lấy đa dạng làm cảnh, là xả với sắc, tiếng, hương, vị, xúc, và xả thuần nhất nương vào bốn xứ vô sắc, rồi nương xả thuần nhất đoạn bỏ xả đa dạng, nương vô tham ái đoạn bỏ xả thuần nhất.

  Ba niệm xứ nói về thái độ của Như Lai với đệ tử: khi đệ tử không chịu lắng nghe, Ngài không khởi tâm không hài lòng; khi một số nghe, một số không, Ngài đoạn bỏ cả hai, sống xả; khi đệ tử đều lắng nghe, Ngài khởi tâm hài lòng; cả ba trường hợp Ngài sống có niệm, tỉnh giác. Cuối kinh, voi, ngựa, bò được điều phục chỉ chạy một hướng, còn người được Như Lai điều phục chạy tám hướng, từ thấy các sắc đến diệt tưởng thọ; đó là nhân duyên Ngài được gọi là bậc điều ngự vô thượng.
