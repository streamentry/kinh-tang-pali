summary: |-
  Đức Phật du hành xứ Magadha đến Rājagaha và xin trú đêm trong lò gốm của thợ gốm Bhaggava. Ở đó đã có Pukkusāti, người xuất gia vì niềm tin vào Đức Phật nhưng chưa từng gặp Ngài. Sau khi cả hai ngồi thiền phần lớn đêm, Đức Phật hỏi vị ấy theo ai xuất gia; Pukkusāti đáp là theo sa-môn Gotama đang an trú ở Sāvatthī, người ông chưa từng gặp, gặp cũng không nhận ra. Nhận ra người ấy xuất gia theo mình, Đức Phật bắt đầu thuyết pháp.

  Kinh nêu bản tóm lược: người này có sáu giới, sáu xúc xứ, mười tám ý hành, bốn ý lập; nơi đứng ấy, các dòng tưởng tư không chảy, vị muni được gọi là an tịnh. Sáu giới gồm đất, nước, lửa, gió, hư không, thức; sáu xúc xứ là mắt, tai, mũi, lưỡi, thân, ý; mười tám ý hành là ba cách suy tầm hỷ, ưu, xả qua sáu môn; bốn ý lập là tuệ, chơn thật, xả, an tịnh.

  Về lời dặn chớ phóng dật về tuệ, kinh phân tích từng giới nội, từ đất là những gì cứng đến hư không là các chỗ trống, và mọi giới, nội lẫn ngoại, cần được thấy bằng chánh tuệ là không phải của ta, không phải ta, không phải ngã của ta, để nhàm chán, ly tham. Khi đó chỉ còn lại thức thuần tịnh, sáng suốt: thọ lạc, thọ khổ, thọ không khổ không lạc do duyên xúc cảm khởi lên, và khi xúc cảm ấy diệt thì thọ ấy diệt.

  Tiếp đó chỉ còn lại xả thuần tịnh. Vị ấy biết hướng xả ấy đến bốn xứ vô sắc vẫn là pháp hữu vi; không tác hành, không tư tầm cho hữu hoặc phi hữu, vị ấy không chấp thủ gì, không ưu nhiệt, chứng nhập Niết-bàn. Vị ấy cảm thọ mọi thọ một cách ly hệ, không chấp trước, không hoan hỉ; sau khi thân hoại, mọi giác thọ không được hoan hỉ sẽ mát lạnh. Cuối kinh, các tưởng tư như ta là, ta sẽ có, ta sẽ không có được gọi là bệnh, ung nhọt, mũi tên; vượt qua tất cả, vị muni được gọi là an tịnh.

  Khi nghe xong, Pukkusāti nhận ra bậc Đạo Sư đã đến với mình, sám hối vì đã xưng đạo hữu, rồi xin thọ đại giới nhưng không được nhận vì bát và y chưa đủ; trên đường đi tìm bát và y, ông bị một con bò đi lạc cướp mất mạng sống. Đức Phật xác nhận ông đã đoạn tận năm hạ phần kiết sử và sẽ Niết-bàn nơi cõi hóa sinh, không trở lại. Toàn bài hội tụ về bậc muni an tịnh, nơi mọi dòng tưởng tư về ta không còn chảy.
