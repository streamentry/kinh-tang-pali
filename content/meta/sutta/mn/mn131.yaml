summary: |-
  Kinh Một Đêm Có Lành được Đức Phật thuyết tại rừng Jeta gần Sāvatthī, trong tu viện của ông Anāthapiṇḍika, trước các tỳ-kheo. Đức Phật nói sẽ thuyết cho các thầy bản tóm lược và phân biệt của một đêm có lành, rồi đọc bài kệ tóm lược trước khi lần lượt phân biệt.

  Bài kệ tóm lược dạy: chớ chạy theo quá khứ, chớ mong đợi vị lai; quá khứ đã bỏ lại sau, vị lai chưa đến với ta. Còn pháp nào hiện tại, hãy quán thấy ngay tại đó, không rung chuyển, không bị lay động, biết rõ nó và nuôi dưỡng nó. Hôm nay hãy tinh cần, vì ai biết được ngày mai tử vong; không có sự mặc cả với đại quân của tử thần. Ai nhiệt tâm an trú như vậy, không ngừng nghỉ ngày đêm, chính là vị một đêm có lành, do bậc ẩn sĩ an tịnh tuyên nói.

  Phần phân biệt nêu từng nghĩa một. Chạy theo quá khứ là với mỗi câu "Tôi đã có dáng dạng, cảm thọ, tưởng, hành, thức như vậy trong thời quá khứ" lại theo đuổi sự hỉ lạc; không chạy theo quá khứ là nội dung ấy nhưng tại đó không theo đuổi hỉ lạc. Mong đợi vị lai là với mỗi câu "Mong rằng tôi sẽ có dáng dạng, cảm thọ, tưởng, hành, thức như vậy trong thời vị lai" lại theo đuổi sự hỉ lạc; không mong đợi vị lai là nội dung ấy nhưng không theo đuổi hỉ lạc.

  Bị lung lay giữa các pháp hiện tại là trường hợp kẻ phàm phu chưa nghe pháp, không được thấy các bậc Thánh, không khéo léo và không được huấn luyện trong pháp các bậc Thánh, các người thiện: kẻ ấy xem sắc là ngã, hay xem ngã có sắc, hay xem sắc trong ngã, hay xem ngã trong sắc; công thức được lặp lại cho thọ, tưởng, hành và thức. Không bị lung lay giữa các pháp hiện tại là trường hợp Thánh đệ tử đã nghe pháp, được thấy và được huấn luyện trong pháp các bậc Thánh, các người thiện: vị ấy không xem sắc, thọ, tưởng, hành, thức theo bốn cách ngã nói trên.

  Cuối bài, bài kệ tóm lược được đọc lại trọn vẹn, và Đức Phật xác nhận lời "Ta sẽ thuyết cho các thầy bản tóm lược và phân biệt của một đêm có lành" được nói vì nhân duyên ấy. Như vậy, "một đêm có lành" mà kinh muốn nói không phải một đêm nào của đời thường, mà là người nhiệt tâm an trú không truy quá khứ, không vọng vị lai, quán thấy và nuôi dưỡng pháp hiện tại một cách không lay động.
