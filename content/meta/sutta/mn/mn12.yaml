summary: |-
  Đại Kinh Sư Tử Hống kể rằng Đức Phật ở ngoài thành Vesālī. Sunakkhatta, người vừa rời bỏ Giáo pháp và giới luật, tuyên bố Sa-môn Gotama không có chứng đạt siêu phàm nào về tri kiến xứng đáng với bậc Thánh, chỉ giảng điều suy ra bằng lý luận theo quan điểm riêng. Đức Phật nói ông ta đang tức giận, tưởng chỉ trích mà thật ra ca ngợi Như Lai, nhưng không thể từ Giáo pháp suy ra về Ngài thần thông hay biết được tâm người khác.

  Mười năng lực của Như Lai được nêu, nhờ đó Ngài cất tiếng sư tử hống giữa các hội chúng: từ biết điều có thể và không thể, biết mọi con đường dẫn đến đâu, đến nhớ lại nhiều đời quá khứ, thấy chúng sinh tái sinh theo nghiệp, và chứng tâm giải thoát, tuệ giải thoát không còn lậu hoặc.

  Tiếp đó là bốn sự tự tin không sợ hãi: không thấy căn cứ nào để ai chỉ trích rằng Ngài chưa hiểu điều tự nhận, rằng lậu hoặc vẫn còn, rằng pháp gọi là chướng ngại không gây chướng ngại, hay rằng con đường giảng không dẫn đến chấm dứt khổ. Nhờ bốn sự tự tin ấy, Ngài bước vào giữa tám loại hội chúng, từ người đến chư thiên, Māra và Phạm thiên, không thấy lý do sợ hãi. Kinh cũng nêu bốn cách sinh, và lặp lại lời khẳng định ai không từ bỏ lời nói ấy sẽ rơi vào địa ngục.

  Phần năm nơi đến nêu cách Như Lai hiểu địa ngục, cõi súc sinh, cõi ngạ quỷ, loài người, cõi chư thiên cùng Niết-bàn và con đường dẫn đến từng nơi; dùng tâm biết trước người ấy sẽ tái sinh vào đâu, rồi thấy quả thật như vậy, minh họa bằng sáu ví dụ từ hố than hồng đến hồ sen trong mát.

  Phần cuối kể lại bốn phương diện tu tập Ngài từng thực hành đến tột cùng: khổ hạnh mãnh liệt, đời sống thô khắc, sự cẩn trọng không làm hại sinh vật nhỏ, và viễn ly trốn người như con nai hoang. Với chủ trương thanh tịnh từ thức ăn, Ngài từng ăn ít đến gầy mòn; các chủ trương thanh tịnh từ luân hồi, tế lễ và lửa thiêng, Ngài đều đã trải qua. Nhưng bằng hạnh sống khắc nghiệt ấy Ngài không đạt sự chứng đạt siêu phàm nào, vì chưa có trí tuệ bậc Thánh đưa đến chấm dứt khổ. Kinh chốt rằng Ngài là chúng sinh không còn bị mê lầm chi phối, xuất hiện vì lợi ích và hạnh phúc của nhiều người; Tôn giả Nāgasamāla nghe xong lông tóc dựng đứng, và Đức Phật đặt tên là Bài kinh làm dựng tóc gáy.

notes: |-
  Lớp lỗi đã sửa (lát vc/tf2.json, 35 khoá; cộng mn12:17.2 nằm ngoài lát): bản Việt đã
  bỏ nội dung Pāli rồi thay bằng dấu lược bịa. Đo trên tệp gốc có 38 khoá lệch dấu lược
  theo quy ước của tầng (…pe… tính là MỘT dấu lược); 35 khoá thuộc lát, 1 là 41.2, và 3
  khoa 45.3-45.5 thuộc lớp lỗi ngược. Đã sửa 36 khoá, khôi phục từ Pāli:
  8.5-8.16 (12 khoá) khôi phục cả vế sadosaṁ cittanti pajānāti bị cắt, theo khuôn đã có ở
  8.3, 8.4, 8.17, 8.18;
  11.2-16.2 và 18.2 (7 khoá) khôi phục đuôi idampi, sāriputta, tathāgatassa tathāgatabalaṁ hoti
  … pavatteti — dùng lại NGUYÊN VĂN bản dịch của 10.2 và 19.2, vì đuôi Pāli này giống hệt
  ở cả mười khoá 10.2-19.2 (đếm bằng script, không phải bằng mắt);
  17.2 khôi phục đuôi như trên, đồng thời Pāli khoá này CÓ …pe… thật nên giữ đúng một dấu lược,
  đặt sau Vì biết đúng như thật điều ấy và trước đây là một năng lực của Như Lai, đúng vị trí
  …pe… của Pāli;
  28.2, 31.2, 34.2 khôi phục vế takkapariyāhataṁ … sayampaṭibhānan’ti;
  38.2, 38.10, 39.2, 39.10, 40.2, 40.10, 41.2, 41.11 (8 khoá) khôi phục vế tathāyaṁ puggalo
  paṭipanno tathā ca iriyati tañca maggaṁ samārūḷho, theo nguyên văn bản 37.10 và 42.2;
  37.8, 38.8, 39.8, 40.8, 41.9 (5 khoá) chỉ gỡ dấu lược trần ở cuối, Pāli khoá đó không có lược.

  Nguồn của lớp lỗi này đã đo được, không phải do đoán: tầng English Sujato đã ghim CŨNG đặt
  dấu lược đúng những chỗ đó. Trong 35 khoá của lát, 31 khoá có prose Anh; ở 8.5-8.16,
  11.2-16.2, 18.2, 28.2, 31.2, 34.2, 37.8, 38.2, 38.8, 39.2, 39.8, 40.2, 40.8, 41.2, 41.9,
  41.11, tầng Anh kết bằng dấu lược trong khi Pāli không có. Đây đúng là tiền lệ BRIEF_VI3
  §10.1 cảnh báo (lớp lấp sao chép lỗi của tầng Anh đã ghim), nên Pāli root được dùng làm
  authority và viết đủ, không theo lớp Anh.

  Còn lại, chưa sửa vì nằm ngoài lát:
  45.3, 45.4, 45.5 — PĀLI có …pe… mà bản Việt đã bung thành văn (lớp lỗi NGƯỢC so với lát này).
  _hvi.kiểm chặn cả tệp ở ba khoá này, nên không dùng save_vi mà gọi đúng bộ ghi _hvi._ghi,
  giữ nguyên thứ tự khoá.
  2.4, 3.4, 3.10, 21.3, 43.3 — vế takkapariyāhataṁ samaṇo gotamo dhammaṁ deseti vīmaṁsānucaritaṁ
  sayampaṭibhānaṁ dịch là Ông ấy giảng điều mình suy ra bằng lý luận, theo một đường suy xét,
  dựa trên quan điểm riêng: mất sayampaṭibhānaṁ và thêm dựa trên quan điểm riêng, không có
  trong Pāli. Vì tiền lệ đó sai nghĩa, 28.2/31.2/34.2 KHÔNG dùng lại nó mà dịch lại từ Pāli.

  Bất định đã ghi nhận, không che:
  takkapariyāhataṁ đọc là chứng ngộ trực tiếp, theo nghĩa chứng ngôn của Abhidhamma (takka =
  lý lý, pari-āhata = đi thấu); trong dn1 và mn76 cùng cụm này được dịch theo nghĩa suy luận
  (dựa trên lý luận đã suy xét), tức mỗi bên một nghĩa. Ở đây lấy nghĩa thứ nhất vì câu nằm trong
  lời ca ngợi Gotama và chủ ngữ là vị ấy đã giảng pháp ấy.
  vīmaṁsānucaritaṁ dịch là có thực hành quán sát; tầng Việt chưa có tiền lệ nào cho sayampaṭibhānaṁ
  (đếm 65 khoá Pāli có aṭibhāna trong toàn tầng, không khoá nào dịch đúng nghĩa này), nên
  không hứa hẹn điều chưa chứng ngộ được là cách diễn đạt mới, ghép từ các cụm có tiền lệ
  (chứng ngộ 873, quán sát 248).
  Trong 8.5-8.16, Pāli không có dấu câu phân biệt từng mục, bản cũ xen hoa chữ thường và chữ
  hoa; dùng khuôn của 8.3/8.4/8.17/8.18 (chữ hoa, chấm phẩy) cho cả mười hai mục cho đều.

  Phe dấu ti: đo lại ở phạm vi gần nhất và toàn tầng, hai số khác nhau nên ghi cả hai.
  Gần nhất, ngay trong mn12: GIỮ 7, BỎ 0.
  Cả bộ Trung Bộ: GIỮ 275, BỎ 52 (tỉ lệ BỎ:GIỮ 0,19:1).
  Cả năm bộ: GIỮ 669, BỎ 196 (0,29:1, tức 22,7% là BỎ).
  Cách đếm: khoá Pāli kết bằng n’ti thì GIỮ nếu bản Việt đóng nháy ngay khoá đó, BỎ nếu nháy
  để sang khoá sau. Số 1:3 trong tình huống là phe BỎ thiên lệch ở toàn tầng; ở phạm vi gần
  nhất thì ngược lại, GIỮ thắng tuyệt đối. 28.2/31.2/34.2 theo phe GIỮ: nháy đóng ngay khoá.

  Coverage tầng Anh, đo tay trên tệp đã ghim translation/en/sujato/sutta/mn/mn12: 316 khoá Pāli có
  nội dung, 264 có prose Anh, tức 83,5%, trên ngưỡng 80% trong reference-gaps.yaml, nên không
  phải blocker. Trong 36 khoá đã sửa thì 38.10, 39.10, 40.10, 41.11 không có prose Anh, dịch
  chỉ từ Pāli; vì vậy triangulation hạ 9,5 xuống 9,0. Tầng Việt hiện hành (Thích Minh Châu)
  không phủ Trung Bộ ở commit đã ghim, nên không đối chiếu được.

  Cổng kỹ thuật chưa chạy (bị cấm npm), còn lại bốn lệnh: npm run validate, npm test,
  npm run check, npm run build. Vì có blocker nên status là draft, không phải published.
  Scorecard cũ (Muse Spark, 2026-09-11, 9,58) giữ ở content/meta/assessments/mn/mn12.json
  dưới legacy_quality.
