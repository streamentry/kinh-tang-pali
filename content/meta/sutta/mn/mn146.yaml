summary: |-
  Đức Phật ở gần Sāvatthī. Đại ái đạo Gotamī cùng khoảng năm trăm tỳ-kheo ni xin Đức Phật giáo hóa; khi đó các tỳ-kheo trưởng lão thay phiên giáo hóa các tỳ-kheo ni, nhưng Nandaka không muốn nhận phiên mình, nên Đức Phật bảo Ngài hãy thuyết pháp cho các tỳ-kheo ni. Sáng hôm sau, sau khi khất thực, Nandaka đến vườn quốc vương, mở đầu bằng thể thức hỏi đáp.

  Nandaka hỏi lần lượt: mắt và các môn kia, cái vô thường là khổ hay lạc, và cái vô thường khổ biến đổi có nên xem là của ta, là ta, là ngã của ta không; các tỳ-kheo ni đáp không, vì đã thấy rõ bằng chánh tuệ rằng sáu nội xứ vô thường. Cùng thể thức ấy được lặp lại cho sáu ngoại xứ và sáu thức thân.

  Tiếp đó là các ví: ngọn đèn dầu đang cháy, dầu, tim đèn, ngọn lửa đều vô thường, ánh sáng không thể thường; vậy khi sáu nội xứ vô thường, những lạc khổ cảm nhận nhờ đó không thể thường, vì do duyên từng duyên cứa ấy, từng cảm thọ ấy khởi lên. Ví cây lớn có lõi cũng vậy cho sáu ngoại xứ. Ví người mổ bò xẻ con bò bằng dao sắc: lớp thịt bên trong là sáu nội xứ, lớp da bên ngoài là sáu ngoại xứ, thịt mỏn gân dây ràng buộc ở giữa là tham ái hoan hỉ, dao mổ sắc là Thánh tuệ cắt lọc sạch các cấu nhiễm, kiết sử ở giữa.

  Kết bài giáo hóa là bảy giác chi, từ niệm giác chi đến xả giác chi, mỗi chi đều nương vào viễn ly, ly tham, đoạn diệt, hướng về buông bỏ; nhờ tu tập và tăng trưởng, vị tỳ-kheo đoạn tận các lậu hoặc, chứng và an trú tâm giải thoát vô lậu, tuệ giải thoát vô lậu. Đức Phật nhận xét các tỳ-kheo ni ấy hoan hỷ với pháp thuyết của Nandaka nhưng chưa đạt đến ý nguyện đầy đủ, như mặt trăng ngày rằm được biết là khuyết, và bảo Nandaka mai dạy lại lời giáo hóa ấy.

  Ngày sau, Nandaka lặp lại trọn vẹn bài giáo hóa như trước. Lần này Đức Phật nói: như mặt trăng ngày rằm được biết là tròn, các tỳ-kheo ni ấy hoan hỷ với pháp thuyết của Nandaka và đã đạt đến ý nguyện đầy đủ; trong năm trăm tỳ-kheo ni, tỳ-kheo ni cuối cùng cũng là bậc Dự lưu, không chịu đọa lạc, hướng đến chánh giác. Hai buổi dạy kề nhau như trăng khuyết và trăng tròn: nền là sự thấy rõ sáu nội xứ, ngoại xứ, thức thân vô thường, và Thánh tuệ cắt lọc tham ái cho đến quả Dự lưu của người cuối cùng.

notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-05) — lệch đáp án hỏi–đáp ở lần dạy thứ hai**
  (`mn146:19-20.17`, `19-20.19`): Pāli đã pin cho `19-20.16` "dhammā niccā vā
  aniccā vā" → `19-20.17` "Aniccā, bhante" (Vô thường), và `19-20.18` "yaṁ panāniccaṁ
  dukkhaṁ vā taṁ sukhaṁ vā" → `19-20.19` "Dukkhaṁ, bhante" (Khổ). Bản dịch cũ ghi
  "Khổ, bạch Ngài." / "Không phải vậy, bạch Ngài." — trượt một bậc, tự mâu thuẫn
  (câu hỏi khổ/lạc được đáp "Không phải vậy"), trong khi dải song song lần dạy đầu
  (7.18–7.24) trả đúng. Đã sửa cả hai đáp án và khôi phục chữ "không?" cuối câu hỏi
  `19-20.21` (song song với `7.23`). Phát hiện trong quá trình audit tóm tắt.
