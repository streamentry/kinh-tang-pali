summary: |-
  Kinh Mật Hoàn kể rằng Đức Phật sau buổi khất thực vào Đại Lâm ngồi thiền dưới gốc cây táo rừng. Daṇḍapāṇi người Sakya đến gặp và hỏi Sa-môn chủ trương điều gì. Đức Phật đáp: Ngài chủ trương một người không tranh luận với bất kỳ ai, dù là chư thiên, Māra, Phạm thiên, Sa-môn, Bà-la-môn hay loài người; và các tưởng không còn ám ảnh vị Bà-la-môn đã sống tách khỏi dục lạc, không do dự, dứt lo âu, không còn khát ái đối với hiện hữu hay không hiện hữu. Daṇḍapāṇi lắc đầu, lè lưỡi rồi chống gậy bỏ đi.

  Chiều đó, Đức Phật kể lại sự việc; một tỳ-kheo hỏi cách nào các tưởng không còn ám ảnh Ngài. Ngài nêu lời tóm tắt: những phán đoán do tưởng và sự phóng diễn của tâm tạo ra có thể vây lấy một người; nếu ngay tại nguồn phát sinh, người ấy không tìm thấy điều gì đáng tán đồng, chào đón hay bám chấp, thì ngay đó các khuynh hướng ngầm của tham dục, chống đối, quan điểm, hoài nghi, kiêu mạn, khát ái hiện hữu và vô minh chấm dứt; cũng chấm dứt cãi vã, tranh chấp và nói dối. Ngài nói xong liền vào nơi ở, không giải thích.

  Các tỳ-kheo đến hỏi Tôn giả Mahākaccāna, người được Đức Phật khen ngợi, và Ngài trình bày cách hiểu. Do mắt và hình sắc, nhãn thức sinh khởi; sự gặp nhau của ba thứ là xúc; do xúc có thọ; cái được cảm thọ thì được tưởng nhận, được suy nghĩ, rồi được phóng diễn; từ sự phóng diễn ấy, những phán đoán do tưởng và phóng diễn vây lấy một người đối với các hình sắc trong quá khứ, hiện tại, tương lai. Công thức lặp lại cho sáu xứ.

  Tiếp theo, kinh theo hai chiều cho sáu xứ: khi có mắt, hình sắc và nhãn thức, có thể nhận ra sự hiện diện của xúc; khi có xúc có thể nhận ra thọ, khi có thọ nhận ra tưởng, khi có tưởng nhận ra suy nghĩ, và khi có suy nghĩ, việc bị những phán đoán ấy vây lấy. Khi không có mắt, hình sắc và nhãn thức thì không thể nhận ra xúc, và chuỗi phủ định ấy lặp lại cho từng xứ.

  Các tỳ-kheo trình lời giải thích lên Đức Phật. Ngài xác nhận Mahākaccāna sáng trí, có trí tuệ lớn, và nếu được hỏi cũng sẽ trả lời đúng như vậy. Ānanda tán tặng: như người đói lả được viên bánh mật, nếm ở đâu cũng thấy vị ngọt, vị tỳ-kheo khảo sát bất kỳ phần nào bằng trí tuệ cũng chỉ thêm hoan hỷ và sáng tỏ; và Đức Phật đặt tên bài giảng là Kinh Mật Hoàn.
