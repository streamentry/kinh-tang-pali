summary: |-
  Kinh Một Đêm Có Lành cho Lomasakaṅgiya: Đức Phật ở gần Sāvatthī, tại rừng Jeta, tu viện của ông Anāthapiṇḍika, còn Tôn giả Lomasakaṅgiya đang trú ở Kapilavatthu, trong tu viện Cây Đa. Vào đêm sâu, thiên tử Candana với dung sắc rực rỡ hiện đến hỏi Tôn giả có học thuộc bản tóm lược và phân biệt của một đêm có lành không; cả hai đều thưa không; những bài kệ của một đêm có lành thì vị thiên tử có học thuộc.

  Thiên tử Candana kể rằng có một lần Đức Phật trú giữa chư thiên Ba mươi ba, dưới gốc cây Pāricchatta, trên tảng đá phủ tấm thảm vàng đỏ, và đã thuyết bản tóm lược và phân biệt của một đêm có lành cho chư thiên. Vị thiên tử đọc lại bài kệ: chớ chạy theo quá khứ, chớ mong đợi vị lai; quá khứ đã bỏ lại sau, vị lai chưa đến với ta; pháp nào hiện tại, hãy quán thấy ngay tại đó, không rung chuyển, không bị lay động, biết rõ nó, hãy nuôi dưỡng nó; hôm nay hãy tinh cần, vì không có sự mặc cả với đại quân của tử thần; ai nhiệt tâm an trú như vậy, không ngừng nghỉ ngày đêm, chính là vị một đêm có lành, do bậc ẩn sĩ an tịnh tuyên nói. Vị ấy khuyên Tôn giả học lấy, đọc tụng thuộc lòng và giữ gìn, vì bản tóm lược và phân biệt ấy có ích, thuộc về phạm hạnh ban đầu, rồi biến mất.

  Sáng hôm sau, Lomasakaṅgiya thu dọn chỗ nghỉ, đi về Sāvatthī, tâu lại toàn bộ sự việc và xin Đức Phật thuyết. Đức Phật cho biết thiên tử ấy tên là Candana, là vị chú tâm suy xét, chú ý, đem toàn tâm hướng đến, lắng tai nghe pháp. Rồi Đức Phật thuyết bài kệ tóm lược, phân biệt lần lượt sáu nghĩa: thế nào là chạy theo quá khứ, không chạy theo quá khứ, mong đợi vị lai, không mong đợi vị lai, bị lung lay giữa các pháp hiện tại, và không bị lung lay giữa các pháp hiện tại; sau đó đọc lại bài kệ một lần trọn vẹn.

  Như vậy, bài kinh cho thấy bài kệ "một đêm có lành" từng được Đức Phật thuyết giữa chư thiên, và một thiên tử chuyên tâm nghe pháp đã mang nó đến cho tỳ-kheo; qua lời Đức Phật, trọng tâm vẫn là nhiệt tâm an trú trên pháp hiện tại, không truy quá khứ, không vọng vị lai.
