summary: |-
  Kinh Tháp Pháp mở ra giữa dân Sakiya, ở thị trấn Medaḷumpa. Vua Pasenadi xứ Kosala đến thị trấn ấy, vào vườn thượng uyển, thấy những gốc cây uy nghiêm, yên tĩnh, hợp cho thiền tịnh, nơi thuở trước Ngài thường phụng sự Đức Phật. Nghe nói Đức Phật đang trú ở Medaḷumpa, còn kịp đến trước khi mặt trời lặn, nhà vua thắng xe đi ngay.

  Tại tu viện, nhà vua được chỉ dẫn đi im lặng, gõ cửa; nhà vua trao gươm và mão trâm cho Dīgha Kārāyana, bước vào, cúi đầu xuống hai chân Đức Phật, hôn và xoa khắc hai chân Ngài. Đức Phật hỏi nhà vua thấy lý do gì mà tỏ lòng tôn kính tận cùng đối với thân xác này.

  Nhà vua nêu lần lượt các lý do suy xét theo giáo pháp, mỗi lý do khép lại bằng cùng một công thức: Đức Phật là bậc Chánh Đẳng Giác, Pháp do Ngài thuyết là khéo thuyết, Tăng chúng là những người thực hành khéo. Thứ nhất, vài sa-môn bà-la-môn sống phạm hạnh chỉ trong một thời hạn rồi trở lại thụ hưởng ngũ dục; các tỳ-kheo sống phạm hạnh viên mãn, thanh tịnh trọn đời, cho đến hơi thở cuối cùng. Thứ hai, người với người cãi vã nhau, từ vua chúa, Bà-la-môn, gia chủ đến cha mẹ, con cái, bạn bè; các tỳ-kheo sống hòa hợp, vui vẻ, như sữa với nước, nhìn nhau bằng cặp mắt thân thương. Thứ ba, vài sa-môn bà-la-môn gầy gò, xanh xao vì bệnh vàng da; các tỳ-kheo luôn tươi cười, hoan hỷ, các căn sung mãn, sống nhờ bố thí, tâm như hươu nai ngoài đồng.

  Thứ tư, nhà vua có quyền chém giết, phạt tiền, trục xuất mà vẫn bị ngắt lời khi xử kiện; còn khi Đức Phật giảng Pháp cho hội chúng hàng trăm người, không một tiếng ho, tiếng hắng, hội chúng được huấn luyện khéo, không cần roi đòn. Thứ năm, những Sát-đế-lợi, Bà-la-môn, gia chủ và sa-môn có trí, soạn sẵn câu hỏi định bẻ gãy Đức Phật; nhưng sau khi được pháp thoại khai thị, làm hoan hỷ, họ chẳng còn hỏi gì; các sa-môn ấy còn xin xuất gia. Thứ sáu, hai người nội thị Isidatta và Purāṇa, được nhà vua cho kế sinh nhai và danh tiếng, nằm với đầu hướng về phía Đức Phật, chân hướng về nhà vua, sau khi bàn luận pháp thoại suốt đêm.

  Cuối cùng, nhà vua nêu lý do Đức Phật và mình cùng là Sát-đế-lợi, người Kosala, tám mươi tuổi, nên việc tỏ lòng tôn kính là điều hợp lẽ. Nhà vua ra đi, và Đức Phật bảo các tỳ-kheo hãy học thuộc các tháp pháp nhà vua vừa trình bày, vì chúng có lợi ích, là nền tảng của đời phạm hạnh.
