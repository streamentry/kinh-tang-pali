notes: |-
  Lớp lược trần (Pāli ghi `…` ở giữa khoá, bản Việt viết đủ thành văn): đã khôi phục 9 dấu lược ở 9 khoá, còn 5 khoá để nguyên vì không xác định được vế đã bung (xét riêng ở cuối).
  Đã sửa, cả hai vế đều có mặt trong bản Việt nên chỉ đặt lược ở giữa: 8.3, 12.3, 9.3, 13.3, 10.3, 10.5.
  Đã sửa, chỉ có vế trước lược; vế sau lược (`tathārūpāsu cārittaṁ āpajjitā hoti`, `tathārūpiṁ vācaṁ bhāsitā hoti`, `tathārūpaṁ vācaṁ bhāsitā hoti`) bản Việt chưa hề dịch nên không mất gì khi cắt: 8.4, 9.4, 13.4.
  Còn lại 5 khoá: 9.2, 9.5, 12.4, 13.5, 14.5. Lý do chung: mốc lược rơi vào giữa danh sách mà bản Việt đã viết trọn, nên vế sau lược bị dính vào một đoạn thuộc khoảng lược. Cắt tại mốc thì mất nghĩa Pāli đã giữ; giữ thì phải viết lại cả khoá — tức là dịch mới, ngoài phạm vi lát này. Chi tiết từng khoá:
  9.2 `Sabhāgato vā … sampajānamusā bhāsitā hoti`: vế sau lược là phần cuối câu (người ấy cố ý nói dối), nhưng câu đó mở đầu bằng vốn từ thuộc khoảng lược (Vì mình, vì người khác hay vì một lợi ích vật chất nhỏ nào đó); cắt sẽ hoặc mất nghĩa Pāli đã giữ, hoặc phải dời vế.
  9.5 `Akālavādī … apariyantavatiṁ anatthasaṁhitaṁ` và 13.5 `… kālena sāpadesaṁ pariyantavatiṁ atthasaṁhitaṁ`: vế sau lược là cặp `pariyantavatiṁ anatthasaṁhitaṁ` (có giới hạn và đem lại lợi ích), nhưng hai từ ấy lại nằm ở CUỐI danh sách, còn các từ trước chúng trong danh sách (có giá trị, đúng thời, có căn cứ) lại thuộc khoảng lược; một dấu lược không đủ để phân định.
  12.4 `Kāmesumicchācāraṁ pahāya … tathārūpāsu na cārittaṁ āpajjitā hoti`: vế sau lược được dịch là Người ấy không quan hệ với, nhưng nó dính ngay trước danh sách phụ nữ vốn thuộc khoảng lược; thêm nữa chữ tránh tà hạnh trong dục cũng là phần bung mà Pāli đã lược.
  14.5 `… sayaṁ abhiññā sacchikatvā pavedentī’ti`: vế sau lược là cụm tự mình trực tiếp biết và chứng ngộ đời này cùng đời sau rồi tuyên bố lại cho người khác, trong đó cụm đời này cùng đời sau lại nằm giữa và thuộc khoảng lược.
  Việc này được hạ điểm chứ không che: `semantic_fidelity` 9.7 xuống 8.8, `ambiguity_integrity` 9.8 xuống 9.3. Nội dung năm khoá này vẫn là dịch của chữ Pāli có thật trong kinh, chỉ thiếu dấu lược, nên xem là khiếm khuyết hình thức đã ghi nhận chứ không phải sai nghĩa; đề nghị người gộp cho biên tập người phán xử riêng.
  Ngoài lớp này, 10.2 và 13.2 có `…pe…` ở Pāli mà bản Việt chưa có dấu lược; thuộc lớp `…pe…` đã giao lát khác, lát này không đụng.
