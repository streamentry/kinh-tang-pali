notes: |-
  Lớp lược trần (Pāli ghi `…` ở giữa khoá, bản Việt viết đủ thành văn): đã khôi phục 13 dấu lược ở 13 khoá, còn 3 khoá để nguyên vì không xác định được vế đã bung (xét riêng ở cuối).
  Đã sửa, cả hai vế đều có mặt trong bản Việt nên chỉ đặt lược ở giữa: 8.3, 12.3, 9.3, 13.3, 10.3, 10.5.
  Đã sửa, chỉ có vế trước lược; vế sau lược (`tathārūpāsu cārittaṁ āpajjitā hoti`, `tathārūpiṁ vācaṁ bhāsitā hoti`, `tathārūpaṁ vācaṁ bhāsitā hoti`) bản Việt chưa hề dịch nên không mất gì khi cắt: 8.4, 9.4, 13.4.
  Đã sửa ở lát sau, có dùng `mn41` làm chuẩn đối chiếu vì `mn41` có cùng công thức mà không lược: 9.5, 13.5 (cắt tới đúng trước `lan man` và `đúng thời`, tức `pariyantavatiṁ`/`atthasaṁhitaṁ`), 14.5 (cắt liền từ `có lễ vật hiến cúng` tới hết `chứng ngộ đời này cùng đời sau`), 10.2 (lớp `…pe…`, cắt từ `tài sản và vật dụng của người khác`; dấu `’` cuối câu là của chính Pāli).
  Còn lại 3 khoá: 9.2, 12.4, 13.2.
  9.2 `Sabhāgato vā … sampajānamusā bhāsitā hoti` và 13.2 (cùng lớp): trước dấu lược Pāli chỉ còn mảnh vụn `Sabhāgato vā`, còn cách dịch tự nhiên của nó là "Khi được gọi đến hội đồng" — mà `abhinīto sakkhipuṭṭho` ("được gọi đến") nằm BÊN TRONG khoảng lược. Cắt sạch thì phải xoá luôn "được gọi đến", tức dịch lại; cắt vội thì để lọt hai từ thuộc khoảng lược. Sửa bừa tệ hơn để nguyên.
  12.4 `Kāmesumicchācāraṁ pahāya … tathārūpāsu na cārittaṁ āpajjitā hoti`: vế sau lược là "không quan hệ với những phụ nữ ấy" (tathārūpāsu), nhưng bản Việt đã thay từ chỉ điểm bằng chính danh sách phụ nữ vốn nằm trong khoảng lược; cắt đi sẽ để lửng chủ từ ở vế "Người ấy không quan hệ với".
  Việc này được hạ điểm chứ không che: `semantic_fidelity` 8.7 (lát trước 8.8, xuống gốc 9.7), `ambiguity_integrity` 9.3. Nội dung ba khoá này vẫn là dịch của chữ Pāli có thật trong kinh, chỉ thiếu dấu lược, nên xem là khiếm khuyết hình thức đã ghi nhận chứ không phải sai nghĩa; đề nghị người gộp cho biên tập người phán xử riêng.

summary: |-
  Một thời Đức Phật ở Sāvatthī, tại rừng Jeta; các bà-la-môn và gia chủ từ Verañjā đang có công việc ở Sāvatthī đã đến gặp Ngài và hỏi do nhân duyên gì có những hữu tình sau khi thân hoại mạng chung tái sinh vào cảnh giới khổ, chốn đọa lạc, địa ngục, và do nhân duyên gì tái sinh vào cảnh giới tốt, cõi trời. Đức Phật trả lời ngắn gọn: do hành xử trái Pháp và lệch lạc, do hành xử đúng Pháp và ngay thẳng; được xin giảng rõ, Ngài phân tích chi tiết.

  Ngài trình bày hành xử trái Pháp và lệch lạc với ba loại về thân: sát sinh, lấy của không cho, tà hạnh trong dục; bốn loại về lời: nói dối, lời chia rẽ, thô ác, vô ích; ba loại về tâm: tham muốn tài sản của người khác, tâm ác ý mong các hữu tình bị hủy hoại, và tà kiến phủ định bố thí, cúng tế, quả của nghiệp, đời này đời sau, mẹ cha và các bậc sống đúng. Do hành xử ấy, hữu tình tái sinh vào cảnh giới khổ, địa ngục.

  Hành xử đúng Pháp và ngay thẳng được trình bày theo đúng đối chiếu: từ bỏ sát sinh, sống có lòng thương với mọi sinh vật; không lấy của không cho; từ bỏ tà hạnh trong dục; từ bỏ nói dối, lời chia rẽ, thô ác, vô ích, thay vào đó hòa giải người đang chia rẽ và nói những lời đúng lúc, có ý nghĩa và lợi ích; tâm không tham muốn tài sản người khác, không ác ý mà mong các hữu tình an vui, và chánh kiến khẳng định có bố thí, cúng tế, quả của nghiệp, đời này đời sau, mẹ cha và các bậc sống đúng. Do hành xử ấy, hữu tình tái sinh vào cảnh giới tốt, cõi trời.

  Kinh tiếp rằng người sống đúng Pháp và ngay thẳng có thể ước nguyện và việc ấy có thể thành tựu: tái sinh cùng các gia đình sát-đế-lỵ, bà-la-môn hay gia chủ giàu có, cùng các cõi trời từ Tứ Đại Thiên Vương qua các cõi Phạm thiên và sắc giới cho tới các cõi vô sắc; mỗi lần đều nêu lý do: vì người ấy sống đúng Pháp và ngay thẳng. Trên hết, người ấy có thể ước nguyện nhờ đoạn tận các lậu hoặc, ngay trong đời này chứng ngộ và an trú trong tâm giải thoát và tuệ giải thoát không còn lậu hoặc.

  Nghe xong, các bà-la-môn và gia chủ từ Verañjā tán thán pháp này như người mở ra điều bị che, chỉ đường cho người lạc, rồi quy y Phật, Pháp và Tăng, xin ghi nhận là những cư sĩ trọn đời.
