notes: |-
  Khôi phục 12 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Bốn khoá giác quan (8.4, 8.5, 8.6, 8.7): Pāli chỉ còn động từ nhận biết rồi …pe…, còn bản Việt đã thêm vế vị ấy cũng thực hành như vậy, vốn là nội dung lược. Đã bỏ; cách làm này khớp với tiền lệ mn107:4.4 và với bản Anh Sujato đã ghim cho chính các khoá này.
  Bốn khoá công thức bốn thiền (18.2-18.5): đối chiếu bản không lược ở mn45:7.5, mn51:21.1, mn30:14.1, mn30:15.1, mn51:22.1, mn30:16.1 để xác định khoảng lược, rồi bỏ đúng phần đó và đặt … đúng chỗ Pāli lược.
  Hai khoá nhớ đời sống quá khứ (20.2, 24.1) và hai khoá thấy hữu tình (21.1, 24.2): khoảng lược che phần liệt kê lặp; đã bỏ, đặt … đúng chỗ Pāli lược, khớp với tiền lệ mn65:18.2, mn119:40.1 và mn79:42.2.
  Không xác định được nên để nguyên: không có. Quét lại toàn bài cho 0 khoá lệch.
