notes: |-
  Khôi phục 12 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Bốn khoá giác quan (8.4, 8.5, 8.6, 8.7): Pāli chỉ còn động từ nhận biết rồi …pe…, còn bản Việt đã thêm vế vị ấy cũng thực hành như vậy, vốn là nội dung lược. Đã bỏ; cách làm này khớp với tiền lệ mn107:4.4 và với bản Anh Sujato đã ghim cho chính các khoá này.
  Bốn khoá công thức bốn thiền (18.2-18.5): đối chiếu bản không lược ở mn45:7.5, mn51:21.1, mn30:14.1, mn30:15.1, mn51:22.1, mn30:16.1 để xác định khoảng lược, rồi bỏ đúng phần đó và đặt … đúng chỗ Pāli lược.
  Hai khoá nhớ đời sống quá khứ (20.2, 24.1) và hai khoá thấy hữu tình (21.1, 24.2): khoảng lược che phần liệt kê lặp; đã bỏ, đặt … đúng chỗ Pāli lược, khớp với tiền lệ mn65:18.2, mn119:40.1 và mn79:42.2.
  Không xác định được nên để nguyên: không có. Quét lại toàn bài cho 0 khoá lệch.

summary: |-
  Kinh Hữu Học diễn ra tại tu viện Nigrodha ở Kapilavatthu, giữa dân Sākya, khi một hội trường mới vừa xây chưa ai dùng. Những người Sākya mời Ngài dùng trước để được lợi ích và an lạc lâu dài. Ngài nhận lời, dùng phần lớn đêm chỉ dạy, khuyến khích, làm phấn chấn và truyền cảm hứng cho người Sākya, rồi vì lưng đau giao Ānanda nói về con đường thực hành của bậc hữu học khi Ngài nằm nghỉ theo thế sư tử.

  Ānanda nói với Mahānāma: Thánh đệ tử hữu học cần thành tựu giới hạnh, hộ trì giác quan, tiết độ ăn uống, tỉnh thức, bảy thiện pháp, và tùy ý đạt bốn thiền tăng thượng tâm. Giới hạnh là sống chế ngự bằng giới bổn Pātimokkha. Hộ trì giác quan là khi sáu căn tiếp xúc, không nắm giữ tướng chung hay chi tiết khiến tâm bị cuốn theo. Tiết độ ăn uống là thấy thức ăn không phải để vui chơi hay làm đẹp, mà chỉ để duy trì thân, hỗ trợ phạm hạnh. Tỉnh thức là kinh hành, ngồi thiền ban ngày và canh đầu, canh cuối; nằm thế sư tử trong canh giữa.

  Bảy thiện pháp là lòng tin vào sự giác ngộ của Như Lai; biết hổ thẹn; biết sợ lỗi; học rộng, ghi nhớ, thâm nhập Pháp trình bày đời phạm hạnh viên mãn; tinh tấn từ bỏ bất thiện, thành tựu thiện; niệm nhớ những điều đã làm đã nói; và trí tuệ thấy sinh diệt, dẫn đến đoạn tận khổ.

  Về bốn thiền: ly dục, ly các pháp bất thiện, chứng sơ thiền; khi tầm tứ lắng xuống, chứng nhị thiền; khi hỷ phai nhạt, chứng tam thiền; khi bỏ lạc khổ, chứng tứ thiền với niệm thanh tịnh nhờ xả; bốn an trú lạc trong hiện tại vị tùy ý đạt được. Đủ các pháp ấy, vị là hữu học đang thực hành, như gà mái ấp trứng đúng cách: trứng không hư, gà con có thể phá vỏ nở an toàn.

  Nương vào sự thanh tịnh vô thượng của xả và niệm ấy, vị lần lượt phá ba lớp vỏ: nhớ lại nhiều đời quá khứ là lần thứ nhất; bằng thiên nhãn thấy các hữu tình đi theo nghiệp là lần thứ hai; do các lậu hoặc đã tận, tự mình chứng tâm giải thoát, tuệ giải thoát là lần thứ ba. Các pháp đầu thuộc về hạnh của vị, ba trí sau thuộc về minh; vị được gọi là đầy đủ minh và hạnh. Kinh kết bằng bài kệ Phạm thiên Sanaṅkumāra được Phật chấp thuận: Sát-đế-lợi cao nhất giữa người lấy dòng họ làm chuẩn, người đầy đủ minh và hạnh cao nhất giữa trời và người; Đức Phật ngồi dậy khen Ānanda.
