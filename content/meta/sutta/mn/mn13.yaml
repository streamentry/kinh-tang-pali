summary: |-
  Đại Kinh Khổ Uẩn kể rằng một số tỳ-kheo, còn sớm khi vào Sāvatthī khất thực, ghé tu viện của các du sĩ thuộc giáo phái khác. Các du sĩ nói rằng Sa-môn Gotama chủ trương cần hiểu thấu đáo dục lạc, sắc và thọ, họ cũng vậy. Các tỳ-kheo không tán thành cũng không bác bỏ mà trở về hỏi lại Đức Phật. Đức Phật dạy nên hỏi ngược: đối với dục lạc, sắc và thọ, đâu là vị ngọt, đâu là nguy hại, đâu là lối thoát; họ sẽ không trả lời được, vì điều ấy ngoài khả năng của họ, và ngoài Như Lai hay đệ tử của Như Lai không ai trả lời thỏa đáng được.

  Vị ngọt của dục lạc là niềm vui và hạnh phúc sinh từ năm loại đối tượng kích thích dục lạc: hình sắc, âm thanh, mùi, vị, xúc chạm. Nguy hại là người kiếm sống bằng nhiều nghề chịu khổ sở; tài sản tích được thì lo bảo vệ và vẫn có thể mất vì vua quan, trộm cướp, lửa, nước hay người thừa kế; vì dục lạc mà thân quen chém giết nhau, người ta lao vào chiến trận, cướp của, ngoại tình và chịu nhiều hình phạt, và vì hành xử xấu bằng thân, lời, ý, họ tái sinh vào địa ngục. Lối thoát là loại bỏ và từ bỏ ham muốn, tham đối với dục lạc.

  Với sắc, vị ngọt minh họa qua một thiếu nữ mười lăm, mười sáu tuổi ở độ rực rỡ nhất; niềm vui sinh từ vẻ đẹp ấy là vị ngọt của sắc. Nguy hại đi qua chuỗi hình ảnh: chính người ấy về sau già yếu; bệnh nặng nằm trong phân và nước tiểu; rồi thành tử thi ở nghĩa địa, trương phồng, bị chim thú ăn, dần chỉ còn xương trắng, mục nát; mỗi lần vẻ đẹp trước kia đã biến mất và nguy hại hiện rõ. Lối thoát là loại bỏ và từ bỏ ham muốn, tham đối với sắc.

  Với thọ, vị ngọt là khi tỳ-kheo chứng và an trú từ sơ thiền đến tứ thiền, lúc ấy vị ấy không có ý làm hại mình hay người khác, chỉ cảm nhận những thọ không gây tổn hại; kinh gọi sự không bị tổn hại là vị ngọt tối thượng của thọ. Nguy hại của thọ là thọ vô thường, khổ và biến hoại; lối thoát là loại bỏ và từ bỏ ham muốn, tham đối với thọ.

  Mỗi phần đều khép lại bằng một kết luận: ai không hiểu đúng như thật vị ngọt, nguy hại và lối thoát thì không thể tự mình hiểu thấu đáo điều ấy hay hướng dẫn người khác; ai hiểu được thì có thể cả hai.
