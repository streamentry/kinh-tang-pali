summary: |-
  Ở Kurū, trong phòng lửa của bà-la-môn Bhāradvāja, Đức Phật nghỉ trên tấm trải cỏ khô. Du sĩ Māgaṇḍiya thấy tấm trải ấy, gọi Sa-môn Gotama là kẻ sát trẻ con, vì khi ngủ tôi đã thấy vậy. Nhờ thiên nhĩ, Đức Phật nghe cuộc đàm luận ấy, chiều hôm ấy đến hỏi: phải chăng ông nhắc đến việc các căn — mắt, tai, mũi, lưỡi, thân, ý — vốn đắm say đối tượng, đã được Như Lai điều phục, che chở, chế ngự? Māgaṇḍiya xác nhận, và câu hỏi đáp lặp lại cho cả sáu căn.

  Đức Phật kể thuở còn tại gia, Ngài thỏa mãn sung sướng với năm dục trưởng dưỡng; về sau, nhờ hiểu đúng sinh khởi, chấm dứt, vị ngọt, nguy hại và lối thoát của dục, Ngài từ bỏ dục ái, sống không khát ái, không ao ước những chúng sinh đang bị dục cắn xé, vì có sự hoan lạc xa rời các dục. Phần tự thuật ấy lặp lại hai lần với ví dụ thiên tử trong vườn Nandana không ao ước nhân dục, và người phong cùi đã khỏi không ao ước hố than hồng.

  Ngược lại, nếu hai người khỏe mạnh kéo người phong cùi đã khỏi đến hố than hồng, người ấy sẽ xoay vặn thân: đám lửa bây giờ và trước kia đều là cảm xúc đau đớn, nóng bỏng; chỉ vì các căn suy yếu mà có tưởng niệm đảo ngược rằng nó là lạc. Cũng vậy, các dục đều là cảm xúc đau đớn, nóng bỏng; những chúng sinh chưa thoát khỏi dục, các căn suy yếu, tưởng niệm đảo ngược rằng chúng là lạc. Cả hai đều chưa thấy hay nghe vị vua hay đại thần nào hưởng thụ năm dục mà không từ bỏ khát ái dục.

  Đức Phật ngâm nga: sức khỏe là lợi lạc tối thượng, Niết-bàn là hạnh phúc tối thượng. Māgaṇḍiya nói các du sĩ tiền bối của mình cũng nói vậy; khi được hỏi sức khỏe và Niết-bàn ấy là gì, ông vuốt ve các chi mình: đây chính là sức khỏe, đây chính là Niết-bàn. Đức Phật ví ông như người mù bẩm sinh nhận tấm vải bẩn làm vải trắng vì lòng tin vào người sáng mắt; thân này là bệnh, ung nhọt, mũi nhọn, tai họa, mà ông không có Thánh nhãn để thấy Niết-bàn.

  Khi xin được dạy, Đức Phật nêu ví dụ người mù được chữa: thuốc hữu hiệu thì mắt được thanh lọc, lòng tham ái với tấm vải bẩn được đoạn bỏ. Cũng vậy, được dạy Pháp, Māgaṇḍiya có thể thấy Niết-bàn, lòng tham ái với năm thủ uẩn được đoạn bỏ, vì những gì ta chấp thủ chỉ là sắc, thọ, tưởng, hành, thức. Ngài chỉ đường: thân cận bậc chân nhân, nghe Chánh pháp, thực hành hợp Pháp. Māgaṇḍiya quy y, xin xuất gia, và chẳng bao lâu thành A-la-hán.
