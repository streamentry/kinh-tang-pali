summary: |-
  Kinh Sela mở ra khi Đức Phật du hành trong xứ người Aṅguttarāpa cùng Tăng chúng một nghìn hai trăm năm mươi vị, đến thị trấn Āpaṇa. Đạo sĩ búi tóc Keṇiya nghe danh tiếng, đến yết kiến và được pháp thoại làm hoan hỷ, mời Đức Phật cùng Tăng chúng dùng bữa ngày mai; Đức Phật hai lần nêu Tăng chúng đông đảo mà ông còn thân nhiệm với các Bà-la-môn, lần thứ ba thì im lặng nhận lời. Keṇiya nhờ bạn bè, bà con giúp chuẩn bị, còn tự mình dựng lều hội.

  Bà-la-môn Sela đang dạy ba trăm thiếu niên tụng các bài trí nguyện. Ông đến am Keṇiya, thấy các chuẩn bị, hỏi là việc gì; Keṇiya đáp đang chuẩn bị đại lễ hiến tế cho sa-môn Gotama, và khi Sela hỏi lại, xác nhận đã nói chữ bậc Phật. Sela nghĩ chữ bậc Phật hiếm có; theo các bài trí nguyện, người đủ ba mươi hai tướng nếu tại gia sẽ làm vua Chuyển luân thánh, nếu xuất gia sẽ thành bậc A-la-hán, Chánh Đẳng Giác. Ông hỏi Đức Phật ở đâu và được chỉ về dãy rừng xanh.

  Sela cùng ba trăm thiếu niên đến, dặn đi im lặng như đến gần sư tử giữa rừng. Ông thấy ba mươi hai tướng trừ hai tướng, vật dục được che kín và lưỡi dài rộng; Đức Phật tác ý thần thông cho ông thấy. Vì chưa biết Ngài có phải bậc Phật không, Sela nhớ truyền thuyết rằng bậc Chánh Đẳng Giác được khen ngợi hợp lẽ sẽ tự tỏ mình, bèn khen Ngài bằng những bài kệ: dung nhan rực rỡ, rực sáng như mặt trời giữa Tăng chúng, và rằng Ngài xứng làm vua Chuyển luân hơn là sống đời sa-môn.

  Đức Phật đáp: Ta là vị vua, vua Chánh pháp vô thượng; nhờ pháp Ta chuyển bánh xe, bánh xe chẳng thể quay ngược. Được hỏi ai là đại tướng tiếp tục chuyển bánh xe, Ngài trả lời Sāriputta, rồi khẳng định điều nên thắng tri, nên tu tập, nên đoạn bỏ đều đã hoàn mãn, do vậy Ta là bậc Phật. Sela tuyên bố ai mong muốn hãy theo ta, ta sẽ xuất gia nơi bậc trí tối thượng ấy; ba trăm thiếu niên cầu xin cùng xuất gia, và cả hội được xuất gia.

  Keṇiya dâng cúng bữa ăn; sau bữa, Đức Phật tán thán ông bằng những bài kệ nêu đầu của từng loại, kết luận Tăng chúng là đầu các bậc hiến tế mong phước. Sela cùng hội chúng sống một mình, tinh cần, tám ngày sau trở thành những bậc A-la-hán; họ đến khen Ngài bằng kệ: trong bảy đêm đã được nhiếp phục trong giáo pháp, xin Ngài duỗi đôi chân để các bậc đại tượng được đảnh lễ Đạo sư.
