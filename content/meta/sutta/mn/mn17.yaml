summary: |-
  Kinh Khu Rừng do Đức Phật giảng tại rừng Jeta gần Sāvatthī, với chủ đề cách đánh giá một nơi ở trong rừng. Đánh giá ấy xoay quanh hai mặt: khi sống ở nơi ấy, niệm có được thiết lập, tâm có vào định, các lậu hoặc có đi đến đoạn tận, sự an ổn tối thượng thoát khỏi mọi ràng buộc có đạt được hay không; và những vật dụng cần thiết cho đời sống xuất gia gồm y phục, thức ăn khất thực, chỗ ở, thuốc men là khó kiếm hay dễ kiếm.

  Kinh trình bày bốn trường hợp cho một vị tỳ-kheo sống nương vào khu rừng. Trường hợp không tiến triển nào được thiết lập mà vật dụng lại khó kiếm: nên rời khu rừng đó ngay trong đêm hay ban ngày. Trường hợp không tiến triển nhưng vật dụng dễ kiếm: sau khi suy xét rằng mình không xuất gia vì y phục, thức ăn, chỗ ở hay thuốc men, vị ấy nên rời đi. Trường hợp có tiến triển mà vật dụng khó kiếm: sau khi cân nhắc, vị ấy nên ở lại. Trường hợp vừa có tiến triển vừa vật dụng dễ kiếm: nên ở lại khu rừng đó suốt đời.

  Cũng theo bốn trường hợp ấy, kinh áp dụng cho tỳ-kheo sống nương vào một ngôi làng, một thị trấn, một thành phố, một xứ sở, và cuối cùng là một người. Trong mỗi trường hợp, vị tỳ-kheo đều phải suy xét và cân nhắc trước khi quyết định ở lại hay rời đi.

  Với người sống nương vào một người, kết quả thay đổi theo từng trường hợp: không tiến triển và vật dụng khó kiếm thì nên rời người đó bất cứ lúc nào, ban đêm hay ban ngày, không cần từ biệt; không tiến triển nhưng vật dụng dễ kiếm thì sau khi cân nhắc nên từ biệt rồi rời; có tiến triển nhưng vật dụng khó kiếm thì sau khi cân nhắc nên tiếp tục đi theo; vừa có tiến triển vừa vật dụng dễ kiếm thì nên đi theo người đó suốt đời, không nên rời đi, ngay cả nếu bị người ấy xua đuổi.
