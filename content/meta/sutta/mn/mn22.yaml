summary: |-
  Tại rừng Jeta ở Sāvatthī, tỳ-kheo Ariṭṭha khởi lên tà kiến: những pháp Đức Phật gọi là chướng ngại không gây chướng ngại cho người thực hành chúng. Các tỳ-kheo chất vấn, tranh luận nhưng ông ngoan cố. Đức Phật gọi ông là người ngu, xuyên tạc Ngài: bằng nhiều cách Ngài đã dạy những pháp gây chướng ngại thực sự gây chướng ngại, và ví dục lạc cho ít vui, nhiều khổ bằng mười hình ảnh, từ khúc xương, hố than hồng đến đầu rắn.

  Đức Phật phân biệt hai cách nắm giữ Giáo pháp. Người học chỉ để thắng tranh luận, không dùng trí tuệ suy xét ý nghĩa, thì lời dạy dẫn đến bất lợi — như nắm lấy thân hay đuôi con rắn nước và bị cắn chết. Người học rồi dùng trí tuệ suy xét ý nghĩa thì lời dạy dẫn đến lợi ích — như dùng gậy chẻ nhánh đè con rắn rồi nắm chắc cổ nó. Chưa hiểu chỗ nào thì phải hỏi.

  Ví dụ Giáo pháp như chiếc bè khép phần này: người làm bè qua bờ an toàn thì kéo bè lên bờ rồi đi — pháp dùng để vượt qua, không phải để ôm giữ; hiểu vậy còn phải buông cả những pháp đúng, huống nữa là điều không phải Pháp.

  Sáu nền tảng của kiến chấp: người phàm xem sắc, thọ, tưởng, hành, thức và mọi điều được thấy, nghe, nhận biết là của tôi, là tự ngã của tôi, kèm quan điểm thế giới và tự ngã là một, thường còn; Thánh đệ tử nhìn ngược lại. Có hai lối lo âu vì điều không thật có: sầu não khi mất thứ từng là của mình, và người nắm quan điểm thường còn nghe Pháp nhổ tận gốc mọi kiến chấp lại sợ tôi sẽ bị hủy diệt. Vì không có thứ thường còn nào để nắm làm của mình, và năm uẩn đều vô thường, khổ, phải biến hoại, bậc thấy vậy nhàm chán, tham ái phai nhạt, được giải thoát.

  Vị ấy được gọi là đã nhấc thanh chắn, lấp hào, nhổ cột trụ, không còn bị ngăn trở, bậc Thánh hạ cờ, đặt gánh nặng xuống — ứng với vô minh, vòng sinh tử, ái, năm kiết sử phần dưới, ngã mạn đã đoạn. Các vị trời cùng Indra, Brahmā tìm cũng không thấy thức của vị ấy nương tựa đâu. Đức Phật bác buộc Ngài chủ trương hủy diệt một chúng sinh thật có: điều Ngài chỉ dạy chỉ là khổ và sự chấm dứt khổ, và khuyên từ bỏ sắc, thọ, tưởng, hành, thức — cái không phải của mình. Giáo pháp sáng rõ, không chắp vá, kết quả bậc thang: A-la-hán không còn tái sinh, bậc hóa sinh Niết-bàn, Nhất Lai, Nhập Lưu, người đi theo Pháp hay niềm tin, ai có mức niềm tin và lòng thương kính nơi Đức Phật đều hướng đến cõi lành.

notes: |-
  Lát sửa 2026-10-05 — 18 khoá bị cắt cụt bằng dấu lược bịa. Cả 18 khoá đều có PĀLI VIẾT ĐỦ, không có `…`; bản Việt cũ lại kết bằng `…`, nghĩa là mệnh đề Pāli biến mất không dấu. Nghiêm trọng nhất là sáu khoá quán vô ngã `15.5`–`15.7` và `16.3`–`16.5`: Pāli dài 61–66 ký tự, bản Việt cũ chỉ 6–7 ký tự (`hành …`, `tưởng …`) — cả `‘etaṁ mama, esohamasmi, eso me attā’ti` lẫn `samanupassati` đều mất. Đã dịch lại 18/18 khoá từ Pāli.

  Nguồn vực: (1) Dải đối chiếu trong chính bài — `15.5`/`15.6`/`15.7` dùng lại khuôn của `15.4` (`Người ấy xem sắc là: ‘…’`), `16.3`/`16.4`/`16.5` dùng lại khuôn của `16.2` (`Vị ấy nhìn sắc như sau: ‘…’`), `10.17`/`11.17` dùng lại khuôn mở đầu `10.1`/`11.1`, `41.4`/`41.6`/`41.22` dùng lại khuôn của `41.2` và `41.10`, `8.10` dùng lại khuôn của `3.7` và `6.2`. (2) Tầng `vietnamese-project` — `Saṅkhārā … te pajahatha` (số nhiều `te`) chỉ có một tiền lệ đã dịch là `sn22.33:1.10` (“các hành không phải của các ông, hãy từ bỏ chúng”), dùng đúng khuôn đó với xưng hô “các thầy” của mn22. Đo bằng script: trong 5 bộ Nikāya, `…, bhikkhave, na tumhākaṁ, taṁ/te pajahatha` có 31 + 3 khoá Pāli, trong đó 18 + 2 đã có bản Việt dự án.

  Dùng lại NGUYÊN VĂN bản dịch: 2 khoá — `13.22` (trùng nguyên văn `13.14`) và `41.22` (trùng nguyên văn `41.2`). Đo bằng script trong chính mn22: 122 khoá thuộc 49 công thức Pāli trùng nguyên văn; trước khi sửa có 9 công thức mà bản Việt khác nhau, trong đó 2 công thức là lỗi thật và đã sửa; 7 công thức còn lại khác nhau ở danh xưng/ngôi kể (Đức Phật / Thế Tôn / Ta, Ngài / vị ấy / họ, ngôi kể ngoại truyền) nên khác là đúng, không đụng tới.

  Dấu lược, từng khoá (phép riêng của lát): trước khi sửa 18/18 khoá lệch (Pāli 0 `…`, Việt 1 `…`); sau khi sửa 0/18 lệch, và toàn bài 359 khoá lệch 0. Bảy khoá `…pe…` của Pāli (`3.36`, `8.7`, `8.12`, `26.10`, `27.2`, `41.24`, `41.26`) và 23 khoá có `…` trần của Pāli đều giữ đúng một `…` ở bản Việt, đúng quy ước tầng.

  Phe dấu `ti` chưa thống nhất toàn tầng, đo ở phạm vi gần nhất và ghi cả hai số: (1) `mn22` có 86 khoá Pāli chứa `’ti` hoặc `”ti` — `’ti` (nháy đơn) = 38, `”ti` (nháy kép) = 50. Trong 86 khoá đó, bản Việt có cặp nháy đơn ở 33 khoá trước khi sửa (38,4%) và 39 khoá sau khi sửa (45,3%); sáu khoá của lát nằm đúng trong số bị bỏ hẳn. (2) Toàn tầng `vietnamese-project` có 132 lần `’ti`, và xem mẫu thì chúng đều là CHÉP NGUYÊN VĂN dấu Pāli đặt SAU dấu nháy đóng (`…đi và đi ra.’ti.`), tức không phát lại tiểu tố nào — phe này không phải cách phát lại, nên lát này không theo. Sáu khoá đã viết theo phe của chính mn22: `’ti` thành dấu hai chấm + nội dung trong ngoặc đơn, đúng như `15.4`, `16.2`, `26.7`, `26.18`, `29.2` sẵn có trong bài.

  Hai chỗ phải phán xử, không dịch máy: (a) `khīṇāsavā` — bản cũ viết “các lậu hoặc đã tận”, nghe như lỗi “hoặc” (or) nhưng đó là cách tầng dịch `āsava`: đếm được “lậu hoặc đã tận” ở 27 khoá và “lậu hoặc” trong 416 tệp của `vietnamese-project`. Bản cũ đúng; lát này giữ nguyên, đã suýt sửa sai. (b) `43.2`/`44.2`/`45.2` nén cụm tính từ `uttāne vivaṭe pakāsite chinnapilotike` thành “Trong Giáo pháp được khéo giảng như vậy”. Đây là quy ước của chính bài: `42.1`/`43.1`/`44.1`/`45.1`/`46.1` nói đủ trước đó, và `46.2`/`47.2` cũng nén y hệt, nên không bung thêm ở đây. Riêng `42.2` đã bung vì bản cũ dịch `chinnapilotike` thành “đối với” — sai nghĩa; đã thay bằng “không chắp vá che giấu” và khôi phục `arahanto` (A-la-hán) đã bị bỏ.

  Tầng Anh không cứu được chỗ này và cũng không được làm cớ: bản Sujato đã ghim nén ĐÚNG những chỗ bản Việt bị cắt (`15.5` = “They also regard feeling …”, `41.4` = “Feeling …”, `42.2` có `…`), tức tiểu tố Anh đã sao chép cả dấu lược lẫn sự bỏ mất. Pāli là quyết định; coverage Anh của mn22 = 209/254 khoá Pāli có nội dung = 0,8228 (ngưỡng 0,80), không cần ghi nhận gap. Không có tầng `english-project` cho mn22. Tầng `vietnamese-current` tại commit đã ghim vắng mặt với mn22 (chỉ có Pháp Cú) — đặc trưng của snapshot upstream, không phải thiếu sót của repo.

  Bất định còn lại, đã đo và KHÔNG sửa vì ngoài lát: (a) `25.6` có `’=2` trong khi Pāli chỉ có `’=1` — lỗi nháy thừa đúng một dấu. (b) 11 khoá lệch cân nháy đơn `‘’` khi đếm từng khoá: `3.37` (Pāli cũng vậy nên khớp) và 10 khoá `13.9`, `13.11`, `13.14`, `13.16`, `13.22`, `13.24`, `18.5`, `18.6`, `19.4`, `19.5` — 10 khoá sau là trích dẫn trải nhiều khoá và Pāli cũng lệch đúng như vậy ở chính khoá đó, nên không phải lỗi. (c) 20 khoá lệch cặp nháy so với Pāli là quy ước lồng nhau của bài (lời nói trong `“”`, lời dẫn lại trong `‘’`) — khác cách đánh dấu của Pāli nhưng không đổi nghĩa. (d) `15.9` và `15.11` dùng “họ” trong khi `15.4`–`15.7` dùng “Người ấy” cho cùng một chủ thể `assutavā puthujjano`; lát này giữ “Người ấy” cho `15.5`–`15.7` vì bám khoá liền trước `15.4`, còn hai khoá kia ngoài phạm vi.

  Điểm: `semantic_fidelity` 9.5 → 9.8 vì 18/18 khoá đã lấy lại đủ nghĩa Pāli, kiểm được bằng script chứ không phải suông. `grammar_logic` 9.5 → 9.7 (khôi phục vế bị bỏ `te paṭisevato antarāyāya` ở `8.10`, và số nhiều `te pajahatha` ở `41.8`). `terminology` 9.4 → 9.6 và `ambiguity_integrity` 9.4 → 9.5 vì hai chỗ phán xử ở trên đã được ghi lại. `technical_integrity` 10.0 → 9.6 vì bị cấm chạy cổng kỹ thuật, nên KHÔNG tuyên bố technical gate pass. `final_score` 9.67 là trung bình số học thô của đúng 10 tiêu chí: 10.0 + 9.8 + 9.7 + 10.0 + 9.6 + 9.5 + 9.6 + 9.4 + 9.5 + 9.6 = 96.7 / 10. `blocking_errors` rỗng và 9.67 > 9.0 nên `status: published`. Bốn lệnh cổng còn phải chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
