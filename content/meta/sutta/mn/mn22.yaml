summary: |-
  Tại rừng Jeta ở Sāvatthī, tỳ-kheo Ariṭṭha khởi lên tà kiến: những pháp Đức Phật gọi là chướng ngại không gây chướng ngại cho người thực hành chúng. Các tỳ-kheo chất vấn, tranh luận nhưng ông ngoan cố. Đức Phật gọi ông là người ngu, xuyên tạc Ngài: bằng nhiều cách Ngài đã dạy những pháp gây chướng ngại thực sự gây chướng ngại, và ví dục lạc cho ít vui, nhiều khổ bằng mười hình ảnh, từ khúc xương, hố than hồng đến đầu rắn.

  Đức Phật phân biệt hai cách nắm giữ Giáo pháp. Người học chỉ để thắng tranh luận, không dùng trí tuệ suy xét ý nghĩa, thì lời dạy dẫn đến bất lợi — như nắm lấy thân hay đuôi con rắn nước và bị cắn chết. Người học rồi dùng trí tuệ suy xét ý nghĩa thì lời dạy dẫn đến lợi ích — như dùng gậy chẻ nhánh đè con rắn rồi nắm chắc cổ nó. Chưa hiểu chỗ nào thì phải hỏi.

  Ví dụ Giáo pháp như chiếc bè khép phần này: người làm bè qua bờ an toàn thì kéo bè lên bờ rồi đi — pháp dùng để vượt qua, không phải để ôm giữ; hiểu vậy còn phải buông cả những pháp đúng, huống nữa là điều không phải Pháp.

  Sáu nền tảng của kiến chấp: người phàm xem sắc, thọ, tưởng, hành, thức và mọi điều được thấy, nghe, nhận biết là của tôi, là tự ngã của tôi, kèm quan điểm thế giới và tự ngã là một, thường còn; Thánh đệ tử nhìn ngược lại. Có hai lối lo âu vì điều không thật có: sầu não khi mất thứ từng là của mình, và người nắm quan điểm thường còn nghe Pháp nhổ tận gốc mọi kiến chấp lại sợ tôi sẽ bị hủy diệt. Vì không có thứ thường còn nào để nắm làm của mình, và năm uẩn đều vô thường, khổ, phải biến hoại, bậc thấy vậy nhàm chán, tham ái phai nhạt, được giải thoát.

  Vị ấy được gọi là đã nhấc thanh chắn, lấp hào, nhổ cột trụ, không còn bị ngăn trở, bậc Thánh hạ cờ, đặt gánh nặng xuống — ứng với vô minh, vòng sinh tử, ái, năm kiết sử phần dưới, ngã mạn đã đoạn. Các vị trời cùng Indra, Brahmā tìm cũng không thấy thức của vị ấy nương tựa đâu. Đức Phật bác cáo buộc Ngài chủ trương hủy diệt một chúng sinh thật có: điều Ngài chỉ dạy chỉ là khổ và sự chấm dứt khổ, và khuyên hãy từ bỏ sắc, thọ, tưởng, hành, thức — cái không phải của mình. Giáo pháp sáng rõ, không chắp vá, kết quả bậc thang: A-la-hán không còn tái sinh, bậc hóa sinh Niết-bàn, Nhất Lai, Nhập Lưu, người đi theo Pháp hay niềm tin hướng đến giác ngộ, ai có một mức niềm tin đối với Đức Phật đều hướng đến cõi lành.
