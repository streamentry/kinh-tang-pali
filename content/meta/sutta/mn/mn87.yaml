summary: |-
  Kinh Sinh Từ Điều Thân Yêu diễn ra tại rừng Jeta, Sāvatthī. Một gia chủ mất đứa con một yêu dấu: từ khi con mất, ông chẳng còn muốn làm việc gì, chẳng còn muốn ăn gì, ra bãi thiêu khóc than "Con ơi, con một của bố ở đâu?". Đức Phật nói sầu, bi, khổ, ưu, não sinh từ những điều thân yêu, hiện hữu từ nơi những điều thân yêu; gia chủ bác bỏ, bảo niềm an lạc và hạnh phúc mới sinh từ những điều thân yêu, rồi ra đi kể lại cho các con bạc, các con bạc cũng tán đồng.

  Chuyện ấy truyền đến hoàng cung. Vua Pasenadi kể lại cho hoàng hậu Mallikā và chê bà cứ hoan hỷ theo mọi điều sa-môn Gotama nói như học trò tán đồng vị thầy, rồi đuổi bà đi. Mallikā sai bà-la-môn Nāḷijaṅgha đến hỏi lại Đức Phật và dặn mang về lời đáp đầy đủ, vì Như Lai không nói điều dối trá. Đức Phật xác nhận lời ấy và nêu phương tiện: người đàn bà mất mẹ đã phát điên mất trí, đi hỏi khắp các phố "Ai thấy mẹ tôi không?"; Ngài lặp lại tình cảnh ấy cho người đàn bà với cha, em trai, chị em gái, con trai, con gái, chồng đã mất, rồi cho người đàn ông với từng thân quyến.

  Một người đàn bà về ở nhà họ hàng bị người ta muốn tách khỏi chồng để gả cho người khác, dù bà không muốn; người chồng cắt người vợ làm đôi, mổ bụng tự tử, nghĩ sau khi chết cả hai sẽ ở với nhau. Nāḷijaṅgha mang lời ấy về cho Mallikā.

  Mallikā đến hỏi vua: có yêu công chúa Vajirī không, có yêu hoàng hậu Vāsabhā người Sát-đế-lợi không, có yêu vị đại tướng con trai Viḍūḍabha không, có yêu thiếp không, và có yêu hai nước Kāsi-Kosala không? Với từng người mà vua nhận là thương yêu, khi được hỏi nếu điều ấy đổi thay, hoại mất thì có sinh ra sầu, bi, khổ, ưu, não chăng, vua đáp nếu nó đổi thay hoại mất thì mạng sống của ta cũng có thể đổi thay, huống chi làm sao không sinh sầu; Mallikā kết luận mỗi lần như vậy là điều Thế Tôn đã nói.

  Vua khen Mallikā đã hỏi khéo và nhìn nhận bậc Thế Tôn có trí tuệ xuyên thấu sâu xa; ông rửa tay, khoác y qua một vai, chắp tay hướng về Đức Phật thốt lên ba lần: Đảnh lễ Đức Phật, bậc A-la-hán, Chánh Đẳng Giác! Bài kinh qua đó cho thấy chính những điều ta thương yêu nhất — người thân, quyền lực — là nơi sầu khổ sinh khởi khi chúng đổi thay, hoại mất.
