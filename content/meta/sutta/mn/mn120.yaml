summary: |-
  Kinh Tái Sinh Theo Hành do Đức Phật thuyết tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika. Ở đây, một vị tỳ-kheo đầy đủ lòng tin, giới hạnh, điều đã nghe, sự bố thí và trí tuệ, nghĩ rằng mong sau khi thân hoại, sau khi chết sinh vào chỗ đồng cư với các Sát-đế-lợi đại gia chủ; vị ấy an trú tâm ấy, thiết lập tâm ấy, tu tập tâm ấy. Những hành và những trạng an trú ấy, được tu tập, được làm cho sung mãn như vậy, chỉ đưa đến sự tái sinh ở đó; đây là con đường, đây là hạnh trình đưa đến sự tái sinh ở đó.

  Công thức ấy lặp lại cho các Bà-la-môn đại gia chủ và các gia chủ đại gia chủ; rồi cho chư thiên Tứ đại thiên vương, Ba mươi ba, Dạ ma, Đâu suất, Lạc biến hóa, Tha hóa tự tại, với cõi trường thọ, dung sắc đẹp, đầy an lạc. Tiếp đến là các bậc Phạm thiên: Phạm thiên Ngàn trải khắp và tác ý quyết định ngàn thế giới, sống an trú, ví như người cầm một quả bồ đào mà xem xét; các Phạm thiên Hai ngàn đến Năm ngàn, ví như năm quả bồ đào; Phạm thiên Mười ngàn, ví như ngọc xanh viễn ly tám mặt; và Phạm thiên Trăm ngàn, ví như món trang sức vàng ròng Jaṃbonada, mỗi bậc trải khắp và tác ý quyết định cõi giới tương ứng của mình.

  Rồi các cõi thiên: Quang, Thiểu quang, Vô lượng quang, Quang âm; Thiểu tịnh, Vô lượng tịnh, Biến tịnh; Quảng quả, Vô phiền, Vô nhiệt, Thiện kiến, Thiện hiện, Sắc cứu cánh; và chư thiên sinh lên hư không vô biên xứ, thức vô biên xứ, vô sở hữu xứ, phi tưởng phi phi tưởng xứ, những cõi trường thọ, an trú lâu dài, đầy an lạc. Với mỗi cõi, cùng công thức ấy được lặp lại: mong sinh vào chỗ đồng cư với chư thiên ở đó, an trú, thiết lập, tu tập tâm ấy, và những hành ấy chỉ đưa đến sự tái sinh ở đó.

  Đoạn cuối đưa đến đích cao nhất: vị tỳ-kheo đầy đủ như vậy nghĩ mong do đoạn tận các lậu hoặc, tự mình với thắng trí chứng ngộ, an trú giải thoát tâm vô lậu, giải thoát trí tuệ ngay trong hiện tại, và điều ấy được chứng ngộ; vị tỳ-kheo này không tái sinh nơi nào nữa. Toàn kinh thiết lập nguyên tắc tái sinh theo hành: tâm được an trú, thiết lập, tu tập hướng về cõi nào thì đưa đến tái sinh nơi cõi ấy, trong khi mong ước giải thoát thì đưa đến chỗ không tái sinh nữa.
notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 6.3, 6.5 — «Tứ đại thiên vương» → «Tứ Đại Thiên Vương» (cách viết hoa chiếm đa số của tầng, 66/72); 37.6, 37.7 — «giải thoát trí tuệ» → «giải thoát tuệ» (paññāvimutti, dạng chiếm đa số của tầng, 116/123 so với 7); giữ nguyên các khoá 3.3, 4-5.3, 4-5.4 (cụm «sinh vào chỗ đồng cư với» đã dùng nhất quán suốt bài và có tiền lệ trong tầng, bản đa số «tái sinh cùng những gia đình…» diễn giải xa Pāli hơn) và 6.3 phần «trường thọ, dung sắc đẹp, đầy an lạc» (khớp công thức lặp ở mọi khoá cùng bài). Tên các cõi khác trong bài (Tha hóa tự tại, Quang âm, Biến tịnh, Sắc cứu cánh) còn viết thường, chưa đồng bộ viết hoa theo tầng; để ngoài phạm vi lượt này.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 4-5.4 — thêm `sahabyataṁ upapajjeyyaṁ` vốn có
  trong Pāli khoá đó: «các gia chủ giàu có’» → «sinh vào chỗ đồng cư với các gia chủ giàu có’».
  Giữ nguyên khoá 3.3, 4-5.3, 6.3, 37.6, 37.7 vì bản đa số chỉ là lối viết lỏng hơn Pāli, còn bản
  hiện tại bám sát `khayā … sayaṁ abhiññā sacchikatvā upasampajja` và thống nhất với các khoá cùng
  khuôn trong bài.
