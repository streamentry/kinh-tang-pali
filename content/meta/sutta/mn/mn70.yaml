summary: |-
  Bài kinh mở đầu khi Đức Phật du hóa xứ Kāsi, dạy các tỳ-kheo hãy ăn ngoài bữa đêm để ít bệnh, nhẹ nhõm, mạnh khỏe và sống an lạc. Các tỳ-kheo phe Assaji-Punabbasuka trú tại Kīṭāgiri từ chối: họ ăn buổi chiều tối, buổi sáng và cả giờ trái giờ mà vẫn thấy vậy, và hỏi sao phải từ bỏ cái hiện tại thấy rõ để chạy theo kết quả về sau.

  Đức Phật hỏi các thầy có biết Ngài dạy rằng bất luận cá nhân cảm nhận lạc thọ, khổ thọ hay phi khổ phi lạc, bất thiện giảm đi và thiện tăng trưởng chăng; họ đáp không. Còn dạy rằng lạc thọ của một số người làm bất thiện tăng trưởng, của số khác làm thiện tăng trưởng, và cũng vậy với khổ và phi khổ phi lạc thọ? Họ đáp đúng vậy. Từ đó, Ngài dạy hãy từ bỏ loại cảm thọ này hay chứng và an trú loại kia, vì mỗi điều đều được Ngài biết, thấy, chứng ngộ bằng trí tuệ.

  Tiếp đó là quy tắc về tâm không buông lung: không phải tất cả tỳ-kheo đều cần làm với tâm không buông lung, cũng không phải tất cả đều không cần. A-la-hán, lậu hoặc đã tận, không cần, vì việc với không buông lung đã làm xong; còn các bậc hữu học, đang khao khát an tịnh tối thượng khỏi ách trói buộc, thì cần.

  Đức Phật nêu bảy hạng người: giải thoát hai phần, huệ giải thoát, thân chứng, quán đạt, tín giải thoát, tùy pháp hành, tùy tín hành. Hai hạng đầu nhờ thấy bằng trí tuệ mà lậu hoặc được đoạn tận — bậc giải thoát hai phần còn thân tự chứng những giải thoát vô sắc — nên không cần. Năm hạng sau thì cần: thân chứng với một số lậu hoặc được đoạn; quán đạt quán thấy và tư duy với trí tuệ các pháp được tuyên bố; tín giải thoát có lòng tin vững chắc nơi Như Lai; tùy pháp hành và tùy tín hành với đủ ngũ căn.

  Cuối kinh, Đức Phật nói quyết định thắng trí không đạt lập tức mà nhờ đạo học dần dần: từ lòng tin sinh khởi, người ấy đến gần, phụng sự, lắng tai, nghe Pháp, ghi nhớ, khảo sát ý nghĩa, chấp nhận sau tư duy, nhiệt tâm nỗ lực, cân nhắc gắng sức, rồi tự thân chứng ngộ chân lý tối thượng. Kinh khép lại: chẳng nên mặc cả với Đạo sư, huống chi với Như Lai không vướng lấn tài vật; vị đệ tử có lòng tin nói Đức Phật là Đạo sư của tôi, Đức Phật biết còn tôi thì không biết, và tuyên thệ dù da gân xương khô héo cũng không ngừng nỗ lực, với hai quả dự đoán được: chứng quyết định ngay trong hiện tại, hoặc, nếu còn bản hữu dư y, được A-na-hàm.
