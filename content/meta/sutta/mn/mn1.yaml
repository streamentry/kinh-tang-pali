summary: |-
  Bài kinh đầu tiên của Bộ Trung Bộ, do Đức Phật thuyết tại rừng Subhaga gần Ukkaṭṭhā cho các tỳ-kheo. Ngài báo trước sẽ giảng pháp môn về căn bản của mọi pháp, rồi trình bày cùng một công thức qua tám phần, mỗi phần đi hết một dãy dài các miền được nhận biết: bốn nguyên tố đất, nước, lửa, gió; các chúng sinh và các tầng trời — các vị trời, Sanh chủ, Phạm thiên, chư thiên Quang Âm, Biến Tịnh, Quảng Quả, Thắng giả, bốn cõi vô sắc; các hoạt động thấy, nghe, cảm nhận, nhận biết; tính đồng nhất, tính đa dạng, khái niệm tất cả; và cuối cùng là cả Niết-bàn.

  Phần thứ nhất mô tả người phàm chưa được học hỏi: người ấy nhận biết từng miền là chính nó, nhưng rồi quan niệm miền ấy, quan niệm trong đó, quan niệm từ đó, quan niệm là của mình, rồi ham thích miền ấy — từ đất, nước, lửa, gió cho tới cả Niết-bàn. Đức Phật nêu lý do: vì người ấy chưa hiểu thấu đáo điều ấy.

  Phần thứ hai nói về vị tỳ-kheo hữu học còn đang tu học: vị ấy trực tiếp biết từng miền, và được dạy không nên quan niệm, không nên ham thích — để vị ấy có thể hiểu thấu đáo. Sáu phần còn lại lặp lại công thức ấy cho bậc lậu tận và cho Đức Như Lai, với lý do mỗi phần một khác: bậc lậu tận không quan niệm, không ham thích vì vị ấy đã hiểu thấu đáo và vì tham, sân, si đã chấm dứt; Đức Như Lai không quan niệm, không ham thích vì Ngài đã hiểu thấu đáo đến tận cùng.

  Phần thứ tám nêu gốc của vấn đề: Đức Như Lai đã biết rằng sự ham thích là gốc của khổ, do hữu có sinh, người đã sinh thì có già và chết; nhờ mọi ái được hoàn toàn chấm dứt, ly tham, đoạn diệt, buông bỏ và xả ly, Ngài giác ngộ Vô thượng Chánh Đẳng Giác. Kinh kết thúc với ghi chú rằng các vị tỳ-kheo không hoan hỷ với lời Đức Phật nói.

  Cả bài kinh vì vậy xoay quanh một tương phản: người chưa hiểu thấu đáo thì quan niệm và ham thích mọi điều mình nhận biết, kể cả khi đối tượng là Niết-bàn; bậc đã giác ngộ thì trực tiếp biết tất cả những điều ấy mà không quan niệm, không ham thích.

notes: |-
  Lát sửa 2026-10-05 — 22 khoá `mn1:N.2` (N = 4..25) trước đây bị CẮT CỤT: Pāli liệt đủ năm vế `X maññati, X-smim maññati, X-to maññati, X meti maññati, X abhinandati`, còn bản Việt chỉ giữ vế đầu rồi kết bằng dấu lược `…`. Nghĩa mất hẳn ba vế sau, và đúng ba vế ấy là thứ Đức Phật sắp phê phán ở `N.3`–`N.4`, nên bản cũ làm nghĩa chính của bài sai. Cả 22 khoá đã viết lại đủ năm vế.

  Nguồn vực: `mn1:3.3` (đất) và `mn1:26.2` (Niết-bàn) — hai khoá DUY NHẤT trong toàn bộ tầng `vietnamese-project` viết trọn công thức dương năm vế. Đo bằng script: trong `mn1` có 16 khoá chứa cụm “là của tôi”, và 22 khoá lát này dùng đúng khuôn đó, khớp từng vế. Thuật ngữ lấy từ `mn1:N.1` của chính bài (bỏ ngoặc Pāli ở `9.1` và `14.1` vì `:N.2` không có ngoặc), không tự đặt; 22/22 khoá đã dùng đúng tên đó ở bản `:N.2` cũ.

  Dấu lược, từng khoá: trước khi sửa cả 22 khoá lệch (Pāli 0 `…`, Việt 1 `…`); sau khi sửa 0/22 lệch. Cả 22 là KIỂU 1 (cắt cụt mất nội dung), không có kiểu 2 nào — vì ở khoá nào Pāli vốn đã có `…` thì bản Việt giữ đúng, không động tới. Bảy khoá `…pe…` của Pāli (`28.1`, `52.1`, `76.1`, `100.1`, `124.1`, `148.1`, `172.1`) vẫn là một `…` trần ở bản Việt, đúng quy ước tầng; toàn bài 334 khoá lúc đó lệch dấu lược ở 0 khoá.

  Phe dấu `ti` chưa thống nhất toàn tầng, đo ở hai phạm vi: (1) phạm vi gần nhất — `mn1` có 40 khoá Pāli chứa `ti`, bản Việt KHÔNG khoá nào phát lại tiểu tố, tức 40 bỏ; (2) toàn tầng `vietnamese-project` — 3.628 khoá Việt có `ti`, trong đó 3.083 giữ nguyên chữ `ti`, 545 dùng tiểu tố (rồi/vậy/thế), không khoá nào dùng cả hai. Lát này không có khoá Pāli nào chứa `ti` nên không phải chọn phe; giữ theo phe của chính bài.

  Bất định còn lại, KHÔNG thuộc lát này và chưa sửa vì ngoài phạm vi 22 khoá: (a) `mn1:1.6` và `mn1:2.4` cùng Pāli `Bhagavā etadavoca:` nhưng dịch khác nhau (“Đức Phật nói như sau:” vs “Đức Phật nói:”) — 1 trong 38 nhóm Pāli trùng trong bài mà bản Việt khác nhau không giải thích được bằng danh xưng hay ngôi kể; 25 nhóm còn lại đều chỉ khác ở “Ngài” / “vị ấy” nên khác là đúng. (b) Bốn khoá lệch nháy đơn `‘’` và bốn khoá lệch ngoặc kép `“”` khi đếm từng khoá (`171.4`/`171.5`, `194.4`/`194.5` cho nháy đơn; `2.1`/`2.2`, `3.1`/`194.6` cho ngoặc kép). Với ngoặc kép đây là quy ước danh sách xuyên suốt bài của SuttaCentral nên cân tổng thể vẫn đúng; nháy đơn thì lệch từng khoá là thật. Đã đo, chưa sửa.

  Điểm: `semantic_fidelity` 9.6 → 9.8 vì nội dung Pāli đã được khôi phục đủ 22/22 khoá, có thể kiểm bằng script chứ không phải suông. `technical_integrity` 10.0 → 9.6 vì bị cấm chạy cổng kỹ thuật, nên KHÔNG tuyên bố technical gate pass. `final_score` 9.7 là trung bình số học thô của đúng 10 tiêu chí: 10.0 + 9.8 + 9.7 + 10.0 + 9.4 + 9.8 + 9.2 + 9.6 + 9.9 + 9.6 = 97.0 / 10. Không blocker còn lại và 9.7 > 9.0 nên `status: published`. Bốn lệnh cổng còn phải chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
