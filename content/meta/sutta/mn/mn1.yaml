summary: |-
  Bài kinh đầu tiên của Bộ Trung Bộ, do Đức Phật thuyết tại rừng Subhaga gần Ukkaṭṭhā cho các tỳ-kheo. Ngài báo trước sẽ giảng pháp môn về căn bản của mọi pháp, rồi trình bày cùng một công thức qua tám phần, mỗi phần đi hết một dãy dài các miền được nhận biết: bốn nguyên tố đất, nước, lửa, gió; các chúng sinh và các tầng trời — các vị trời, Sanh chủ, Phạm thiên, chư thiên Quang Âm, Biến Tịnh, Quảng Quả, Thắng giả, bốn cõi vô sắc; các hoạt động thấy, nghe, cảm nhận, nhận biết; tính đồng nhất, tính đa dạng, khái niệm tất cả; và cuối cùng là cả Niết-bàn.

  Phần thứ nhất mô tả người phàm chưa được học hỏi: người ấy nhận biết từng miền là chính nó, nhưng rồi quan niệm miền ấy, quan niệm trong đó, quan niệm từ đó, quan niệm là của mình, rồi ham thích miền ấy — từ đất, nước, lửa, gió cho tới cả Niết-bàn. Đức Phật nêu lý do: vì người ấy chưa hiểu thấu đáo điều ấy.

  Phần thứ hai nói về vị tỳ-kheo hữu học còn đang tu học: vị ấy trực tiếp biết từng miền, và được dạy không nên quan niệm, không nên ham thích — để vị ấy có thể hiểu thấu đáo. Sáu phần còn lại lặp lại công thức ấy cho bậc lậu tận và cho Đức Như Lai, với lý do mỗi phần một khác: bậc lậu tận không quan niệm, không ham thích vì vị ấy đã hiểu thấu đáo và vì tham, sân, si đã chấm dứt; Đức Như Lai không quan niệm, không ham thích vì Ngài đã hiểu thấu đáo đến tận cùng.

  Phần thứ tám nêu gốc của vấn đề: Đức Như Lai đã biết rằng sự ham thích là gốc của khổ, do hữu có sinh, người đã sinh thì có già và chết; nhờ mọi ái được hoàn toàn chấm dứt, ly tham, đoạn diệt, buông bỏ và xả ly, Ngài giác ngộ Vô thượng Chánh Đẳng Giác. Kinh kết thúc với ghi chú rằng các vị tỳ-kheo không hoan hỷ với lời Đức Phật nói.

  Cả bài kinh vì vậy xoay quanh một tương phản: người chưa hiểu thấu đáo thì quan niệm và ham thích mọi điều mình nhận biết, kể cả khi đối tượng là Niết-bàn; bậc đã giác ngộ thì trực tiếp biết tất cả những điều ấy mà không quan niệm, không ham thích.
