notes: |-
  Lớp lỗi dấu lược (Pāli ghi `…` ở giữa khoá, bản Việt bung thành văn xuôi): đã khôi phục 7 dấu lược, mỗi khoá đúng 1, khớp số dấu lược của Pāli sau khi sửa: 8.3, 8.4, 8.5, 16.3, 16.4, 16.5, 16.6.
  Cách cắt đặt theo tiền lệ có sẵn trong dự án, không phải do đoán: 8.4 và 16.4 theo `dn8:14.5/14.6`; 8.5 và 16.6 theo `mn94:10.4/10.5`; 16.3 theo `mn53:8.4-8.7`.
  Mốc lược mỗi khoá lấy từ Pāli, không lấy từ vị trí câu tiếng Việt; sau khi cắt hai về đều còn mặt nên dấu lược đặt ở giữa, đúng như `mn42:9.3`.
  Hạ điểm chứ không che: `semantic_fidelity` 9.5 xuống 9.4 vì trước lát này còn 7 khoá diễn đạt trọn nơi Pāli đã lược, tức bản Việt còn thừa chữ chưa đúng với hình thức của nguyên bản.
