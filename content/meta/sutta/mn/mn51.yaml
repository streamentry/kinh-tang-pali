notes: |-
  Lớp lỗi dấu lược (Pāli ghi `…` ở giữa khoá, bản Việt bung thành văn xuôi): đã khôi phục 7 dấu lược, mỗi khoá đúng 1, khớp số dấu lược của Pāli sau khi sửa: 8.3, 8.4, 8.5, 16.3, 16.4, 16.5, 16.6.
  Cách cắt đặt theo tiền lệ có sẵn trong dự án, không phải do đoán: 8.4 và 16.4 theo `dn8:14.5/14.6`; 8.5 và 16.6 theo `mn94:10.4/10.5`; 16.3 theo `mn53:8.4-8.7`.
  Mốc lược mỗi khoá lấy từ Pāli, không lấy từ vị trí câu tiếng Việt; sau khi cắt hai về đều còn mặt nên dấu lược đặt ở giữa, đúng như `mn42:9.3`.
  Hạ điểm chứ không che: `semantic_fidelity` 9.5 xuống 9.4 vì trước lát này còn 7 khoá diễn đạt trọn nơi Pāli đã lược, tức bản Việt còn thừa chữ chưa đúng với hình thức của nguyên bản.

summary: |-
  Kinh Kandaraka được Đức Phật thuyết ở Campā, bên hồ Gaggarā, khi Pessa, con người huấn luyện voi, và du sĩ Kandaraka đến gặp. Kandaraka thán phục Tăng chúng im lặng, nói các bậc A-la-hán Chánh Đẳng Giác quá khứ hay tương lai, nếu hướng dẫn Tăng chúng đến mức tối đa, cũng như Đức Gotama hiện nay. Đức Phật đồng ý: trong Tăng chúng có vị A-la-hán lậu hoặc đã tận, và những vị hữu học an lập trong bốn niệm xứ, quán thân, thọ, tâm, pháp.

  Pessa khen bốn niệm xứ nhằm thanh tịnh chúng sinh, vượt sầu bi, chấm dứt khổ ưu, chứng ngộ Niết-bàn; cư sĩ áo trắng thỉnh thoảng cũng sống như vậy. Ông nói con người thật khó dò, loài vật dễ thấy rõ hơn: con voi huấn luyện bộc lộ mọi mánh khóe gian trá, còn nô bộc thì hành một kiểu, nói một kiểu, tâm một kiểu khác. Đức Phật đồng ý và nêu bốn hạng người hiện hữu ở đời.

  Đó là người tự làm khổ mình, người làm khổ người khác, người vừa làm khổ cả hai, và người không làm khổ mình cũng không làm khổ người khác, sống không còn đói khát tham ái, tự thân trở thành Phạm. Pessa chọn hạng cuối, vì ba hạng kia làm đau những ai vốn mong an lạc và ghét đau khổ; rồi ông từ giã. Đức Phật nhận xét Pessa là người có trí; theo lời xin các tỳ-kheo, Ngài phân tích chi tiết bốn hạng.

  Người tự làm khổ mình là bậc sống lõa thể, ăn uống kiêng khem thậm chí theo chu kỳ nửa tháng, mặc áo gai, nhổ tóc râu, nằm giường gai. Người làm khổ người khác là người sống bằng các nghề tàn ác như giết mổ, săn bắn, đánh cá, trộm cướp, hành hình. Người vừa làm khổ cả hai là vua quán đảnh hay bà-la-môn giàu có tổ chức tế lễ giết súc vật, khiến nô bộc làm việc trong nước mắt.

  Hạng thứ tư: khi Như Lai xuất hiện thuyết Pháp, một gia chủ nghe, tin và xuất gia. Vị ấy từ bỏ sát sinh, lấy của không cho, đời sống không phạm hạnh, nói dối, chia rẽ, thô ác, phù phiếm; bằng lòng với y và thức ăn như con chim mang đôi cánh; phòng hộ sáu căn; có niệm tỉnh giác trong mọi cử chỉ. Sau khi từ bỏ năm triền cái, vị ấy lần lượt chứng bốn thiền, rồi hướng tâm đến ba trí: nhớ nhiều đời quá khứ, thấy các hữu tình đi theo nghiệp bằng thiên nhãn, và biết các lậu hoặc; tâm được giải thoát khỏi dục lậu, hữu lậu, vô minh lậu. Đó là người không làm khổ ai, tự thân đã trở thành Phạm.
