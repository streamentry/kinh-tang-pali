summary: |-
  Một thời Đức Phật ở Rājagaha, tại Trúc Lâm. Cư sĩ Visākha đến gặp Tỳ-kheo-ni Dhammadinnā và lần lượt đặt câu hỏi, phần trả lời đều do Ni sư đảm nhận.

  Hữu thân là năm thủ uẩn; nguồn gốc là ái dẫn đến tái sinh; chấm dứt là ái ấy được ly tham đoạn diệt; con đường đưa đến chấm dứt là Thánh đạo Tám ngành. Chấp thủ không phải năm thủ uẩn nhưng cũng không tách biệt, mà là dục và tham đối với chúng. Thân kiến hình thành khi phàm phu ít học xem mỗi uẩn là tự ngã, tự ngã có nó, nó ở trong tự ngã hay tự ngã ở trong nó; Thánh đệ tử có học thì không xem như vậy. Thánh đạo là hữu vi, chính Thánh đạo được bao gồm trong ba uẩn, không phải ba uẩn trong đạo. Định là nhất tâm, với bốn niệm xứ làm dấu hiệu và bốn chánh cần làm tư cụ hỗ trợ.

  Về ba loại hành, hơi thở vào ra là thân hành vì thuộc thân và gắn với thân; tầm và tứ là khẩu hành vì trước khi nói người ta suy nghĩ bằng tầm và tứ; tưởng và thọ là tâm hành vì thuộc tâm và gắn với tâm. Vị nhập diệt thọ tưởng không nghĩ tôi sẽ nhập, đang nhập hay đã nhập, vì tâm đã được tu tập trước; khi nhập, khẩu hành dừng trước, rồi thân hành, rồi tâm hành; khi xuất khỏi định, tâm hành sinh trước, rồi thân hành, rồi khẩu hành, ba xúc chạm đến vị ấy là xúc tính không, vô tướng, vô nguyện.

  Lạc thọ dễ chịu khi còn duy trì nhưng đau khổ khi biến đổi; khổ thọ đau khổ khi còn duy trì nhưng dễ chịu khi biến đổi; thọ không khổ không lạc dễ chịu khi có hiểu biết nhưng đau khổ khi không hiểu biết. Khuynh hướng ngầm của tham nằm dưới lạc thọ, của chống đối dưới khổ thọ, của vô minh dưới thọ trung tính, nhưng không phải dưới mọi thọ: nhờ hỷ lạc sơ thiền vị từ bỏ tham, nhờ tứ thiền vị từ bỏ vô minh. Khổ thọ đối ứng với lạc thọ và ngược lại; vô minh đối ứng thọ trung tính, minh đối ứng vô minh, giải thoát đối ứng minh, Niết-bàn đối ứng giải thoát; hỏi đối ứng của Niết-bàn là đi quá giới hạn, vì đời sống phạm hạnh đi vào, hướng đến và kết thúc ở Niết-bàn.

  Sau cuộc đối thoại, cư sĩ Visākha kể lại toàn bộ cho Đức Phật; Ngài xác nhận Tỳ-kheo-ni Dhammadinnā là người có trí, có đại trí, và nếu hỏi chính điều ấy, Ngài cũng sẽ trả lời đúng như vậy.
