summary: |-
  Tại rừng Jeta ở Sāvatthī, Đức Phật mở đầu bằng hình ảnh người gieo mồi cho đàn nai: gieo mồi không phải để đàn nai trường thọ, dung sắc đẹp, mà để chúng xông vào ăn, me say, loạn trí, phóng dật, rồi tùy tiện bị sai khiến. Đàn thứ nhất xông vào mồi và bị khống chế. Đàn thứ hai từ bỏ mồi, len vào rừng sâu, nhưng đến tháng cuối mùa hạ, khi cỏ nước cạn kiệt, thân gầy mòn, sức lực thối giảm, chúng trở lại nơi mồi và lại bị khống chế. Đàn thứ ba làm chỗ ở ngay gần nơi mồi mà không xông vào ăn; người gieo mồi vây lưới bốn phía vẫn tìm ra chỗ ẩn nấp. Đàn thứ tư làm chỗ ở tại nơi người gieo mồi không đến được; vây lưới vẫn không thấy chỗ ở của chúng, đành đặt tâm xả — đàn thứ tư thoát khỏi thần lực của người gieo mồi.

  Đức Phật giải nghĩa: nơi gieo mồi là năm dục công đức; người gieo mồi là Māra ác ma; đàn nai là các sa-môn bà-la-môn. Nhóm thứ nhất xông vào các vật dục thế tục, me say ăn cho đến bị Māra sai khiến. Nhóm thứ hai từ bỏ thức ăn nơi mồi, vào rừng sâu sống bằng lá cây, rễ cây và trái cây; nhưng đến cuối mùa hạ thân gầy mòn, tâm giải thoát thối giảm, họ trở lại nơi mồi và cũng bị Māra sai khiến.

  Nhóm thứ ba làm chỗ ở gần nơi mồi mà không xông vào ăn — nhưng vẫn giữ một trong các kiến: thế giới thường còn hay vô thường, hữu hạn hay vô hạn, linh hồn và thân là một hay khác nhau, và bốn cách nhìn về Như Lai sau khi chết. Như vậy nhóm thứ ba cũng chưa thoát khỏi thần lực của Māra.

  Nhóm thứ tư làm chỗ ở tại nơi Māra và đám tùy tùng Māra không đến được. Đức Phật nói rõ chỗ ấy là gì: tỳ-kheo chứng và an trú sơ thiền, nhị thiền, tam thiền, tứ thiền; rồi vượt các tưởng về sắc mà chứng Không vô biên xứ, thức vô biên xứ, vô sở hữu xứ, phi tưởng phi phi tưởng xứ; và vượt qua phi tưởng phi phi tưởng xứ để chứng diệt thọ tưởng, với các lậu hoặc được đoạn tận nhờ thấy bằng trí tuệ. Mỗi mức như vậy đều được gọi là đã làm Māra mù mắt, đi đến chỗ không bị ác ma thấy.

  Thoát khỏi Māra vì vậy không phải bằng cách lao vào dục lạc, không phải bằng khổ hạnh kiệt quệ rồi quay về, hay bằng lối sống giản dị kèm những kiến chấp siêu hình — mà là tiến lên từng bậc thiền định cho đến diệt thọ tưởng với lậu hoặc đoạn tận, nơi Māra không còn cách nào nhìn thấy.
