summary: |-
  Kinh Niệm Hơi Thở mở đầu tại Sāvatthī, ở Đông Viên, trong lâu đài của mẹ Migāra, cùng nhiều vị trưởng lão đệ tử nổi tiếng. Các trưởng lão đang chỉ dạy và khuyến giáo các tỳ-kheo mới, mỗi vị phụ trách từ mười đến bốn mươi người. Vào đêm ngày rằm, Đức Phật ngồi ngoài trời giữa Tăng chúng im lặng, bày tỏ lòng hài lòng và cho biết sẽ đón rằm Komaudī mùa bốn tháng tại Sāvatthī. Các tỳ-kheo nơi khác kéo về, và trong đêm rằm Komaudī, Đức Phật ngợi ca hội chúng: không có trấu, sạch trấu, thanh tịnh, an trú nơi lõi, đáng cúng dường, là ruộng phước vô thượng, khó gặp trong thế gian.

  Thành phần đại chúng gồm: những vị A-la-hán, lậu hoặc đã cạn; những vị đoạn năm hạ phần kiết sử, hóa sinh nhập Niết-bàn; những vị nhất lai hoàn, chỉ trở lại một lần; những vị dự lưu, không rơi vào đường dữ; những vị sống tinh cần tu tập bốn niệm xứ, bốn chánh cần, bốn như ý túc, năm căn, năm lực, bảy giác chi và Thánh đạo tám ngành; những vị tu tập từ, bi, hỷ, xả, bất tịnh và tưởng vô thường; và những vị sống tinh cần tu tập niệm hơi thở.

  Phần chính là mười sáu bước niệm hơi thở. Tỳ-kheo ngồi kiết già, giữ thân thẳng, có niệm, thở vào, thở ra. Bốn bước đầu biết hơi thở dài, ngắn, tập cảm nhận toàn thân và làm lắng dịu hoạt động của thân; bốn bước giữa tập cảm nhận hỷ, lạc, tâm hành và làm lắng dịu tâm hành; bốn bước kế tập cảm nhận tâm, làm tâm hoan hỷ, định tĩnh và giải thoát tâm; bốn bước cuối tập quán vô thường, quán ly tham, quán diệt và quán buông bỏ. Kinh giải thích: khi tập như vậy, vị ấy sống quán thân nơi thân, quán thọ nơi thọ, quán tâm nơi tâm hay quán pháp nơi pháp, nhiệt tâm, tỉnh giác, có niệm, xả ly tham ưu ở đời.

  Từ bốn niệm xứ, mỗi khi vị ấy sống quán nơi một niệm xứ, giác chi niệm được khơi dậy, rồi giác chi trạch pháp, tinh tấn, hỷ, khinh an, định, xả được khơi dậy, tu tập, viên mãn; công thức ấy lặp cho cả bốn niệm xứ. Bảy giác chi được tu tập dựa trên viễn ly, ly tham và đoạn diệt, hướng đến buông bỏ, làm viên mãn minh và giải thoát. Chuỗi này là kết luận của kinh: niệm hơi thở làm viên mãn bốn niệm xứ, bốn niệm xứ làm viên mãn bảy giác chi, bảy giác chi làm viên mãn minh và giải thoát, nên niệm hơi thở thành quả lớn, lợi ích lớn.

notes: |-
  Lượt cải thiện 2026-10-13 (kiểm toán mẫu): đọc đối kháng đủ 154 khoá Pāli↔Việt, đối chiếu bản Sujato đã ghim và bài song song an4.190 (cùng công thức hội chúng). Không phát hiện sai nghĩa nặng (phủ định, chủ thể, số lượng, lệch ranh khoá đều đúng). Sửa 17 khoá, toàn là lỗi thuật ngữ, văn phong và dấu câu, có đo tiền lệ bằng số đếm:

  1. 8.1–8.9, 9 khoá: "đại chúng" cho parisā đổi thành "hội chúng". Cách dịch kho cho parisā là "hội chúng" (MN 92 khoá, DN 82, AN 204), còn "đại chúng" chỉ có 9 khoá, đều nằm ở chính đoạn này; an4.190 mang cùng công thức và dịch là "hội chúng". 8.2, 8.4, 8.6, 8.8 viết lại để giữ "ayaṁ" ("Tăng chúng tỳ-kheo này như vậy, hội chúng này như vậy"). 8.1 "thoát trấu" đổi thành "sạch trấu" (an4.190 dùng "sạch trấu"; "thoát trấu" tối nghĩa).
  2. 8.9: "do-tuấn" là lỗi chính tả, kho dùng "do-tuần" (146 khoá, "do-tuấn" chỉ 1). "Chỉ để được chiêm ngưỡng" thêm chữ "chỉ" không có trong Pāli và bỏ mất "api" của puṭosenāpi; viết lại thành "đáng để đi nhiều do-tuần để được chiêm ngưỡng, dù phải mang theo lương thực trong bao". "Bị lương" là từ cổ.
  3. 4.1, 4.2: paṭipadā dịch "hạnh trình" đổi thành "sự thực hành". "Hạnh trình" chỉ có 16 trong 1.182 khoá có paṭipadā, còn "thực hành" 449 và "con đường" 767; Sujato cũng dịch "practice".
  4. 10.1: "nhập diệt tại đó" đổi thành "nhập Niết-bàn tại đó" (tattha parinibbāyino; kho: 9 khoá "nhập Niết-bàn", "nhập diệt" chỉ có ở đây, và dễ đọc thành "chết").
  5. 12.1: "không còn rơi vào đường dữ" bỏ "còn", vì avinipātadhammā không hàm ý trước đó đã từng rơi (kho: "không rơi vào" 73 khoá).
  6. 15.1, 16.1, 22.1: mahapphalā hoti mahānisaṁsā dịch "thành quả lớn" dễ đọc thành "thành tựu lớn"; đổi thành "có quả lớn, có lợi ích lớn", dạng đa số trong kho (khoảng 30 khoá, "thành quả lớn" 9 khoá). Bài song song mn119:3.1 (và sn54.1, an6.19, an6.20) còn dạng cũ; ngoài phạm vi lượt này, nên đồng bộ về sau.
  7. 14.13: Pāli kết bằng dấu gạch dài (nối sang 14.14), bản Việt kết bằng dấu chấm; sửa thành " —" như 14.6.

  Điểm đổi: vietnamese_clarity 9.0 → 9.2 (mục 2, 3, 6); han_viet_balance 9.1 → 9.2 (mục 3, 4). Các tiêu chí khác giữ nguyên: terminology giữ 9.2 vì lượt này chỉ đưa bản dịch về đúng mức đó (trước khi sửa, thuật ngữ parisā/paṭipadā/parinibbāyin lệch tiền lệ nên 9.2 là cao); semantic_fidelity, ambiguity_integrity không nâng vì bất định ở dưới còn nguyên.

  Giữ nguyên dù có nghi ngờ: "xếp bằng" cho pallaṅkaṁ ābhujitvā (kho: "kiết già" 62 khoá, "xếp bằng" 6 khoá, nhưng 4 bài thuộc họ niệm xứ và niệm hơi thở dn22, mn10, mn118, mn119 cùng dùng "xếp bằng", nên không phải lệch riêng của bài này); 8.3 "hiến tặng" cho dakkhiṇeyya (kho dao động giữa "bố thí" 11 khoá và "hiến tặng" 4 khoá); 18.2–18.3, 19.2–19.3, 20.2–20.3, 21.2–21.3 khác 24.x–27.x ở cách ghép câu, vì Pāli giống nhau nhưng ở 24–27 mệnh đề nằm trong cấu trúc "vào lúc nào … thì vào lúc ấy"; 37.1, 38.1 và 14.1–14.5 điền động từ ngầm ("sống quán thọ nơi các thọ", "tu tập") ở chỗ Pāli lược "…pe…", theo thông lệ kho (sn54.13, sn47.10, dn34:1.5.10).

  Bất định còn lại: palāpa trong apalāpāyaṁ, nippalāpāyaṁ (8.1) có thể đọc là "trấu" hoặc "lời lải nhải"; giữ "trấu" vì Sujato dịch "chaff" và vế sau "suddhā sāre patiṭṭhitā" (thanh tịnh, an trú nơi lõi) tạo cặp ẩn dụ trấu và lõi, nhưng chưa phân xử dứt khoát bằng nguồn ngoài bản dịch. 4.1–4.2 āraddha dịch "hài lòng" theo Sujato; nghĩa này ít tiền lệ trong kho (2 khoá). 4.4, 5.2, 7.1 "tháng thứ tư" cho cātumāsinī (Komudī mãn bốn tháng mùa mưa) theo Sujato "fourth month"; dn2:1.3 dịch "mãn bốn tháng", hai cách tương đương.

  Kỹ thuật: không chạy được npm run validate, npm test, npm run check, npm run build trong lượt này, nên technical_integrity giữ 9.5 và không tuyên bố đã qua cổng máy. Tầng Việt hiện hành không có cho bài này (chỉ có bản nguyên bài ở mục Tra cứu toàn văn, không dùng để chép câu chữ).
