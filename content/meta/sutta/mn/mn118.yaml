summary: |-
  Kinh Niệm Hơi Thở mở đầu tại Sāvatthī, ở Đông Viên, trong lâu đài của mẹ Migāra, cùng nhiều vị trưởng lão đệ tử nổi tiếng. Các trưởng lão đang chỉ dạy và khuyến giáo các tỳ-kheo mới, mỗi vị phụ trách từ mười đến bốn mươi người. Vào đêm rằm tháng mười lăm, Đức Phật ngồi ngoài trời giữa Tăng chúng im lặng, bày tỏ lòng hài lòng và cho biết sẽ đón rằm Komaudī mùa bốn tháng tại Sāvatthī. Các tỳ-kheo nơi khác kéo về, và trong đêm rằm Komaudī, Đức Phật ngợi ca đại chúng: không có trấu, thoát trấu, thanh tịnh, an trú nơi lõi, đáng cúng dường, là ruộng phước vô thượng, khó gặp trong thế gian.

  Thành phần đại chúng gồm: những vị A-la-hán, lậu hoặc đã cạn; những vị đoạn năm hạ phần kiết sử, hóa sinh nhập diệt; những vị nhất lai hoàn, chỉ trở lại một lần; những vị dự lưu, không rơi vào đường dữ; những vị sống tinh cần tu tập bốn niệm xứ, bốn chánh cần, bốn như ý túc, năm căn, năm lực, bảy giác chi và Thánh đạo tám ngành; những vị tu tập từ, bi, hỷ, xả, bất tịnh và tưởng vô thường; và những vị sống tinh cần tu tập niệm hơi thở.

  Phần chính là mười sáu bước niệm hơi thở. Tỳ-kheo ngồi kiết già, giữ thân thẳng, có niệm, thở vào, thở ra. Bốn bước đầu biết hơi thở dài, ngắn, tập cảm nhận toàn thân và làm lắng dịu hoạt động của thân; bốn bước giữa tập cảm nhận hỷ, lạc, tâm hành và làm lắng dịu tâm hành; bốn bước kế tập cảm nhận tâm, làm tâm hoan hỷ, định tĩnh và giải thoát tâm; bốn bước cuối tập quán vô thường, quán ly tham, quán diệt và quán buông bỏ. Kinh giải thích: khi tập như vậy, vị ấy sống quán thân nơi thân, quán thọ nơi thọ, quán tâm nơi tâm hay quán pháp nơi pháp, nhiệt tâm, tỉnh giác, có niệm, xả ly tham ưu ở đời.

  Từ bốn niệm xứ, mỗi khi vị ấy sống quán nơi một niệm xứ, giác chi niệm được khơi dậy, rồi giác chi trạch pháp, tinh tấn, hỷ, an tịnh, định, xả được khơi dậy, tu tập, viên mãn; công thức ấy lặp cho cả bốn niệm xứ. Bảy giác chi được tu tập dựa trên viễn ly, ly tham và đoạn diệt, hướng đến buông bỏ, làm viên mãn minh và giải thoát. Chuỗi này là kết luận của kinh: niệm hơi thở làm viên mãn bốn niệm xứ, bốn niệm xứ làm viên mãn bảy giác chi, bảy giác chi làm viên mãn minh và giải thoát, nên niệm hơi thở thành quả lớn, lợi ích lớn.
