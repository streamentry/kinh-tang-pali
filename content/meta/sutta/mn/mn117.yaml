summary: |-
  Kinh Đại Tứ Thập do Đức Phật thuyết tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika. Đức Phật giảng Thánh chánh định cùng với các nhân và các trợ cụ: chánh kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm; sự nhất tâm của tâm được chuẩn bị cùng với bảy chi ấy là Thánh chánh định. Chánh kiến luôn đi trước: tà được biết là tà, chánh được biết là chánh.

  Mỗi chi đều theo cùng một khuôn: chánh chia làm hai loại, có lậu hoặc, thuộc về phước, cảm quả nơi thủ, và Thánh, vô lậu, xuất thế gian, một chi của đạo; vị tỳ-kheo tinh tấn từ bỏ tà, chứng đạt chánh, có niệm như vậy, ba pháp chánh kiến, chánh tinh tấn, chánh niệm xoay quanh từng chi. Tà kiến phủ nhận bố thí, hiến tế, quả của nghiệp, đời này, đời sau và các bậc thánh; tà tư duy là suy nghĩ về dục, về sân hận, về gây hại; tà ngữ là nói dối, hai lưỡi, lời ác, phù phiếm; tà nghiệp là sát sinh, trộm cắp, tà dâm; tà mạng là xum xoe nịnh bợ, khoe khoang, đòi xin ám chỉ, ép buộc làm lợi, lấy lợi cầu lợi.

  Chánh kiến đi trước theo chuỗi sinh: chánh kiến làm sinh chánh tư duy, chánh tư duy làm sinh chánh ngữ, chánh ngữ làm sinh chánh nghiệp, chánh nghiệp làm sinh chánh mạng, chánh mạng làm sinh chánh tinh tấn, chánh tinh tấn làm sinh chánh niệm, chánh niệm làm sinh chánh định, chánh định làm sinh chánh trí, chánh trí làm sinh chánh giải thoát. Như vậy bậc hữu học đầy đủ tám chi, bậc A-la-hán đầy đủ mười chi; nhờ chánh trí nhiều pháp ác bất thiện được đoạn tận.

  Với người có mỗi chi chánh, chi tà đối ứng và mọi pháp ác bất thiện do duyên nó được làm tiêu tan, nhiều thiện pháp do duyên chánh được đưa đến viên mãn; công thức ấy lặp cho mười chi từ chánh kiến đến chánh giải thoát. Như vậy có hai mươi pháp thiện và hai mươi pháp bất thiện. Đức Phật tuyên bố pháp môn Đại Tứ Thập đã được chuyển động, không thể đảo lại bởi bất cứ sa-môn, bà-la-môn, chư thiên, Māra, Phạm thiên hay ai trong thế gian; ai muốn chỉ trích sẽ ngay hiện tại gặp mười thuyết tùy thuyết chính đáng: chỉ trích chi chánh nào là tôn kính chi tà đối ứng.

  Toàn kinh hướng tới chuỗi đạo từ chánh kiến đến chánh giải thoát: khi chuẩn ấy đã rõ, pháp môn trở thành chuẩn mười chi không ai có thể bác bỏ được.
