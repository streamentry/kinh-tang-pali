summary: |-
  Kinh Đại Tứ Thập do Đức Phật thuyết tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika. Đức Phật giảng Thánh chánh định cùng với nền tảng và các trợ cụ: chánh kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm; sự nhất tâm của tâm được chuẩn bị cùng với bảy chi ấy là Thánh chánh định. Chánh kiến luôn đi trước: tà được biết là tà, chánh được biết là chánh.

  Mỗi chi đều theo cùng một khuôn: chánh chia làm hai loại, có lậu hoặc, thuộc về phước, cảm quả nơi sanh y, và Thánh, vô lậu, xuất thế gian, một chi của đạo; vị tỳ-kheo tinh tấn từ bỏ tà, chứng đạt chánh, có niệm như vậy, ba pháp chánh kiến, chánh tinh tấn, chánh niệm xoay quanh từng chi. Tà kiến phủ nhận bố thí, hiến tế, quả của nghiệp, đời này, đời sau và các bậc thánh; tà tư duy là suy nghĩ về dục, về sân hận, về gây hại; tà ngữ là nói dối, hai lưỡi, lời ác, phù phiếm; tà nghiệp là sát sinh, lấy của không cho, tà hạnh trong các dục; tà mạng là lừa dối, nịnh hót, gợi ý, gièm pha, lấy lợi cầu lợi.

  Chánh kiến đi trước theo chuỗi sinh khởi: ở người có chánh kiến, chánh tư duy sinh khởi; ở người có chánh tư duy, chánh ngữ sinh khởi; rồi lần lượt chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm, chánh định, chánh trí, và ở người có chánh trí, chánh giải thoát sinh khởi. Như vậy bậc hữu học đầy đủ tám chi, bậc A-la-hán đầy đủ mười chi; nhờ chánh trí nhiều pháp ác bất thiện được đoạn tận.

  Với người có mỗi chi chánh, chi tà đối ứng và mọi pháp ác bất thiện do duyên nó được làm tiêu tan, nhiều thiện pháp do duyên chánh được đưa đến viên mãn; công thức ấy lặp cho mười chi từ chánh kiến đến chánh giải thoát. Như vậy có hai mươi pháp thiện và hai mươi pháp bất thiện. Đức Phật tuyên bố pháp môn Đại Tứ Thập đã được chuyển động, không thể đảo lại bởi bất cứ sa-môn, bà-la-môn, chư thiên, Māra, Phạm thiên hay ai trong thế gian; ai muốn chỉ trích sẽ ngay hiện tại gặp mười thuyết tùy thuyết chính đáng: chỉ trích chi chánh nào là tôn kính chi tà đối ứng.

  Toàn kinh hướng tới chuỗi đạo từ chánh kiến đến chánh giải thoát: khi chuẩn ấy đã rõ, pháp môn trở thành chuẩn mười chi không ai có thể bác bỏ được.
notes:
  - >-
    **Lượt cải thiện 2026-10-13 (kiểm toán mẫu).** Đọc đối kháng cả 152 khoá
    Pāli↔Việt, đối chiếu bản Anh Sujato đã ghim và đo tiền lệ trên tầng. Lượt
    chấm 2026-10-08 không để lại ghi chú nào, nên các bất định bên dưới trước
    đó chưa được ghi. Kết quả: 10 khoá đổi (không khoá nào sai ngược nghĩa hay
    bịa; 5 khoá lệch nghĩa nhẹ đến vừa, 4 khoá thuật ngữ, 1 khoá dấu câu).
    Điểm giảm 9.26 → 9.16 vì phát hiện thêm lỗi chưa từng được ghi nhận, không
    phải vì bản dịch xấu đi.
  - >-
    **Khoá đổi, lý do, tiêu chí liên quan.** (1) `34.3`: Pāli
    `sammādiṭṭhissa … sammāsaṅkappo pahoti` là sở hữu cách của *người có*
    chánh kiến (dạng nam tính, không phải dạng trừu tượng), bản cũ viết *“chánh
    kiến làm sinh chánh tư duy”* — thêm quan hệ nhân quả tác nhân mà Pāli không
    nói và lệch với `35.3` cùng cấu trúc (*“Với người có chánh kiến”*). Nay:
    *“Với người có chánh kiến … chánh tư duy sinh khởi”*; khớp `sn45.1:3.3` và
    `dn18:27.8` (cả hai đều dịch `pahoti` là sinh khởi, 2/2). Ảnh hưởng
    `grammar_logic` 9.3 → 9.1 (hạ vì lỗi bị bỏ sót), `semantic_fidelity` 9.2 →
    9.0. (2) `35.4`, `35.15`: bỏ sót `aneke` (*nhiều*), trong khi `35.5` và
    `35.16` giữ; nay *“nhiều pháp ác bất thiện”*. (3) `37.1`, `37.12`: chủ ngữ
    Pāli là `dasa sahadhammikā vādānuvādā` (mười thuyết và tùy thuyết) *đưa đến*
    chỗ đáng chỉ trích; bản cũ đảo thành *“vị ấy rơi vào chỗ đáng bị chỉ trích
    qua mười thuyết”*, lệch `mn101:22.2/22.24` (cùng cụm, 2/2). Nay theo
    `mn101`. (4) `2.1`, `3.1`, `3.4`: `saupanisa` dịch *“các nhân”* — không có
    tiền lệ nào trong tầng và trùng với `hetu`; `sn12.23` (cùng Pāli, 17 khoá)
    dịch *“có nền tảng”*. Nay *“nền tảng”* (`parikkhāra` giữ *“trợ cụ”*). (5)
    `36.2`: `pavattito … appaṭivattiyo` — *“chuyển động … đảo lại”* đổi thành
    *“chuyển vận … không thể bị đảo ngược”*, theo `ne4:31.2` và mục
    `dhammacakka` của glossary (`pavattita` = vận chuyển/chuyển vận). (6)
    `13.2`: Pāli kết bằng dấu hai chấm dẫn vào lời trích ở `13.3`, Việt kết
    bằng dấu chấm; đã sửa. Ảnh hưởng `terminology` 8.9 giữ nguyên (sửa `nền
    tảng`, `chuyển vận` bù cho việc phát hiện thêm bất nhất bên dưới),
    `vietnamese_clarity` 9.1 giữ.
  - >-
    **Bất định còn lại, không phân xử được bằng căn cứ có trong kho.**
    (a) `38.1` `okkalā vassabhaññā`: bản dịch giữ cách đọc *Vassa và Bhañña xứ
    Okkala* (hai người, theo chú giải); bản Sujato và hai đoạn song song
    `an4.30:8.2`, `sn22.62:13.2` bỏ tên riêng, hiểu là nhóm người nói to; hai
    đoạn song song trong kho dịch *“huyên thuyên to tiếng”*. Pāli không tự
    phân xử được và ba nơi trong kho đang không thống nhất — không sửa ở đây,
    chờ quyết định biên tập chung cho cả ba. (b) `34.5` `aneke pāpakā akusalā
    dhammā vigatā bhāvanāpāripūriṁ gacchanti`: Việt giữ sát cú pháp (*“được
    đoạn tận, được đưa đến sự viên mãn của sự tu tập”*); bản Sujato hiểu *sự
    đoạn trừ* là vật được tu tập viên mãn. Cách đọc của Việt có thể khiến người
    đọc tưởng chính các pháp ác được tu tập; chưa có căn cứ đủ để đổi. (c)
    `dn18:27.7` (cùng công thức `saupaniso itipi, saparikkhāro itipi`) dịch
    *“có y chỉ … có tư lương”*, khác bài này (*nền tảng … trợ cụ*); không sửa
    bài ngoài phạm vi, nhưng hai bài cần được thống nhất. (d) `29.2`
    `nippesikatā` dịch *“gièm pha”* theo `mnd14:121.2`, `mnd16:215.6` (2/2),
    còn `cnd23:148.3` dịch *“hạ người khác”*, Sujato *belittling*; nghĩa đúng
    chưa chắc. (e) `14.2` `appanā, byappanā`: *“sự an chỉ, sự an trú”* —
    hai từ này không có tiền lệ nào khác trong kho để đối chiếu.
  - >-
    **Đã đo và quyết định không đổi.** `veramaṇī` ở `19.2`, `25.2` dịch *“từ
    bỏ”*: toàn tầng chia *kiêng tránh* 8 (thêm 1 khoá *tránh*), *tránh xa* 4, *từ bỏ* 3
    (`dn22:21.11`, `mn141:26.2`, `mn141:27.2`); nhưng trong `20.2`, `26.2`, `32.2` cùng bài,
    `veramaṇī` là vế cuối của chuỗi bốn *“xa lìa, tránh xa, đã tránh xa, từ
    bỏ”* (khớp `cnd6:11.6`, `cnd21:27.1`, 5/5 `paṭivirati` = *“đã tránh
    xa”*) và `mn141` là bài song song gần nhất; để nguyên cho nhất quán trong
    bài, nhưng *từ bỏ* trùng nghĩa với `pajahati`/`pahāya` ở `9.2`, `31.2` — lỗi
    văn phong nhẹ, ghi nhận. `6.3`/`6.4` và các khoá lặp tương ứng viết *“có
    chánh kiến có lậu hoặc”* (hai chữ *có* liền nhau) — hơi vấp nhưng bám Pāli
    `atthi … sāsavā`, không sửa. `5.2`/`7.2` mở nháy bằng chữ thường (*‘không
    có…’*, *‘có…’*) khác tiền lệ `mn60:5.2` (chữ hoa); style, không sửa. Các số
    đã kiểm: bảy chi `3.2/3.3`; ba pháp `9.3`; bốn khẩu ác hạnh `20.2`; ba
    thân ác hạnh `26.2`; tám chi / mười chi `34.4`; chuỗi mười pháp `34.3` và
    mười vế `35.3–35.14`, `37.2–37.11`; hai mươi `36.1`; mười thuyết `37.1`,
    `37.12` — đều khớp Pāli. Nháy `“”‘’` khớp từng khoá, 0 lệch trên 152;
    ba nhóm khoá Pāli trùng nguyên văn trong bài, 0 nhóm bản Việt khác nhau;
    `…pe…` → đúng một `…` ở mọi khoá (0 sót).
  - >-
    **Kỹ thuật và đối chiếu.** Bài có bản Anh Sujato đã ghim và đã đọc đối chiếu
    ở cấp khoá; không có tầng Việt hiện hành cho MN tại commit đã ghim (chỉ có
    Pháp Cú), nên không đối chiếu được bản Hòa thượng Thích Minh Châu; `budsas.org`
    chỉ là tra cứu toàn văn. Tự kiểm 152/152 khoá, NFC, khoảng trắng, không
    Pāli lọt sang Việt (chỉ còn tên riêng). `technical_integrity` 9.6: lượt này
    chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`;
    việc đó thuộc cổng CI. Lượt chấm ghi trong `quality` chưa có bản ghi lịch sử
    tương ứng (`assessment_id` cũ đã bỏ vì nội dung dịch đã đổi sau lượt 2026-10-08).
  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá 35.16 — *nhiều thiện pháp do duyên chánh giải thoát được đưa đến sự viên mãn của sự tu tập* → *và nhiều thiện pháp do duyên chánh giải thoát đi đến sự viên mãn của sự tu tập* (`bhāvanāpāripūriṁ gacchanti` là chủ động *đi đến*, không phải bị động; thêm *và* cho `ca`); đồng bộ cùng công thức ở 35.5 và 34.5. Modal của khoá (*những điều thiện rất nhiều … do chánh giải thoát làm căn cứ*) kém nghĩa hơn nên không theo.
