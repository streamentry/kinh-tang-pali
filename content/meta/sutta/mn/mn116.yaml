summary: |-
  Kinh Isigili do Đức Phật thuyết tại Rājagaha, trên núi Isigili. Đức Phật lần lượt hỏi các tỳ-kheo có thấy núi Vebhāra, núi Paṇḍava, núi Vepulla và núi Gijjhakūṭa hay không, rồi cho biết cả bốn ngọn núi ấy trước kia từng có tên gọi khác, có sự khái niệm khác. Riêng núi Isigili giữ đúng tên gọi và sự khái niệm như hiện nay, vì thuở xưa năm trăm vị Độc Giác Phật từng trú lâu ngày trên núi này: các vị được thấy khi đi vào núi, nhưng đã vào rồi thì không được thấy nữa; thấy vậy, mọi người nói núi này nuốt các ẩn sĩ, và từ đó phát sinh danh xưng Isigili.

  Đức Phật tuyên bố sẽ kể tên, tán thán và giảng tên các vị Độc Giác Phật, rồi đọc mười ba vị đầu trong phần văn xuôi: Ariṭṭha, Upariṭṭha, Tagarasikhī, Yasassī, Sudassana, Piyadassī, Gandhāra, Piṇḍola, Upāsabha, Nīta, Tatha, Sutavā và Bhāvitatta, mỗi vị đều đã trú lâu ngày trên núi Isigili này.

  Phần kệ tiếp theo liệt kê những vị còn lại thành từng nhóm, kèm theo đó là những tán thán ngắn về từng bậc: các vị không phiền não, không còn hy vọng, đạt giác ngộ một mình độc lập, đã rút bỏ gai độc; các vị đoạn tận dây dẫn đến hữu; các vị đã cắt đứt mạn, đã hàng phục sức mạnh Māra, đã cắt tận thủ, gốc rễ khổ đau; các vị mang thân thể cuối cùng, đã cắt dây trói buộc hữu, đã cắt đứt ái; các vị ly tham, đạt trạng thái an tịnh, vô nhiễm, hiền trí, và cả vị tên Kaṇha với tâm hoàn toàn giải thoát.

  Kinh khép lại bằng lời khuyến tán: những vị ấy và những vị khác có đại oai thần là các Độc Giác Phật đã đoạn tận dây dẫn đến hữu; hãy đảnh lễ các bậc đại ẩn sĩ đã vượt qua mọi trói buộc, đã hoàn toàn tịch diệt, vô lượng. Cả bài kinh hướng tới việc tán thán và lưu giữ tên các Độc Giác Phật gắn với chính ngọn núi nơi bài kinh được nói.

notes: |-
  Lượt cải thiện 2026-10-13 (kiểm toán mẫu): đọc đối kháng đủ 96/96 khoá, đối chiếu Pāli với bản Anh đã ghim (phủ cả phần kệ) và đo tiền lệ trên toàn tầng bản dịch. Sửa 10/96 khoá; không có lỗi ngược nghĩa hay bịa. Lỗi nghĩa nhẹ–vừa: 4 khoá (5.1, 5.3, 6.7, 6.8). Lỗi thuật ngữ/văn phong nhẹ: 6 khoá (3.4, 3.5, 3.12, 6.4, 6.11, 7.1).

  Khoá đã đổi, và vì sao:
  - `mn116:5.1`: bản cũ bỏ sót `sattasārā` và thêm "bậc thánh" không có trong Pāli; nay "bậc tinh hoa của chúng sinh" (tiền lệ `thi-ap32:23.1`: "bậc tinh hoa của chúng sinh"). `nirāsā` đổi "không còn hy vọng" thành "không còn mong cầu" (tiền lệ `snp5.8`, `sn1.34`, `sn1.20`: "không cầu mong", "không còn khát vọng", "không khao khát"; "hy vọng" không có tiền lệ).
  - `mn116:5.3`: `visallāna` dịch "rút bỏ gai độc" là sai vật chỉ; `salla` ở toàn tầng là "mũi tên" (đo 20+ khoá, gồm `snp2.13:9.3` "đã nhổ mũi tên"), nay "đã nhổ mũi tên". `naruttama` đổi "tối thượng nhân" thành "bậc tối thượng giữa loài người" theo cách dịch phổ biến trong tầng (`dn30`, `tha-ap62`, `bv23`, `thag7.4`, `cnd1` đều là "bậc tối thượng/tối thắng … loài người").
  - `mn116:6.7`–`6.8`: bản cũ tách tuỳ tiện, `santacitto` thành tính từ nhưng `sacco tatho` thành tên riêng, còn `virajo paṇḍito` lại thành tính từ. Cả hai bản tham khảo (Anh đã ghim và Việt truyền thống) đều coi `Santacitta` là tên, và `sacco tatho virajo paṇḍito` là chuỗi đức tính; `Tatha` đã được liệt ở `4.11`/`5.8` nên chép lại làm tên là lặp. Nay: "Upanemi, Nemi, Santacitta, chân thật, như thật, vô nhiễm và hiền trí." Xem bất định bên dưới.
  - `mn116:6.4`, `7.1`: `mahānubhāva` "đại oai thần" đổi "đại oai lực" theo đa số (104 khoá "oai lực", 32 "uy lực" so với 2 khoá "oai thần", đều là chính bài này).
  - `mn116:6.11`: `jahi` "đoạn tận" đổi "từ bỏ", để "đoạn tận" dành cho `khīṇa` (`6.3`, `7.2`), theo tiền lệ `mn66:14` "từ bỏ … sanh y". Giữ "sanh y" cho `upadhi` (203 khoá).
  - `mn116:3.12`: Pāli `Bhagavā etadavoca:` trùng nguyên văn `1.6`, bản cũ dịch khác nhau ("Đức Phật nói điều này:" so với "Đức Phật nói:"); nay thống nhất "Đức Phật nói:" (120 khoá so với 8).
  - `mn116:3.4`: `Tamenaṁ manussā disvā evamāhaṁsu` nay "Người ta thấy vậy nói:" (tiền lệ `dn27:22.8`, `dn27:23.2`); bỏ "mọi người", sắc thái "tất cả" không có trong `manussā`.
  - `mn116:3.5`: `ime isī` là "những ẩn sĩ này" (đại từ gần), không phải "ấy".

  Bất định còn lại (không đoán, giữ trong notes): (1) Ranh giới tên riêng và tính từ ở `6.7`–`6.8`: chuỗi toàn danh từ số ít `santacitto sacco tatho virajo paṇḍito ca` có thể đọc là năm tên riêng, cũng có thể là đức tính của Santacitta; bản Anh đã ghim và bản Việt truyền thống đều đọc là đức tính, nên bản này theo đó, nhưng Pāli tự nó không phân xử. (2) `Upanemiso nemiso` ở `6.7`: dạng nominative của `Upanemisa`/`Nemisa` hay `Upanemi`/`Nemi` kèm `so`; bản này theo hai bản tham khảo ("Upanemi, Nemi"), chưa phân xử được bằng Pāli. (3) `tadādhimutto vimalo ca ketumā` ở `6.16`: bản này theo cách đọc "Adhimutta" kèm "Ketumā vô nhiễm"; phần `tad-` có thể là một phần của tên (`Tadādhimutta`) hoặc trạng từ `tadā`. (4) `susambuddho` ở `5.6`: bản này đọc là tính từ của Piyadassī (khớp cả hai bản tham khảo); cũng có thể là một tên riêng, nhưng danh sách văn xuôi `4.1`–`4.13` không có tên đó. (5) `dvādasa` ở `6.23`: "mười hai vị Ānanda, Nanda, Upananda" giữ mơ hồ như Pāli, chưa rõ mười hai vị nào. (6) `matulo` ở `6.1`: bản này giữ dạng Pāli đã ghim ("Matula"); bản Anh dùng dạng khác ("Methula").

  Tiền lệ: Pāli trùng nguyên văn trong bài 2 nhóm (`Evaṁ, bhante` ×5, `Bhagavā etadavoca:` ×2), 0 nhóm còn lệch sau khi sửa. Nháy đơn và nháy kép khớp Pāli 96/96 khoá; không Pāli lọt sang bản Việt; NFC đạt; khoá Pāli 96 = khoá Việt 96, cùng thứ tự; không có dấu lược `…` ở Pāli nên Việt cũng không có.

  Chấm lại (từ → sang): semantic_fidelity 9.2 → 8.9 (phát hiện thiếu `sattasārā`, thêm "thánh", sai vật chỉ `salla`, vẫn còn các bất định ở trên); grammar_logic 9.3 → 9.0 (phân tích sai ranh giới danh sách ở `6.7`–`6.8`); triangulation 9.3 → 9.0 (bản cũ bỏ sót những chỗ bản Anh đã ghim làm rõ); ambiguity_integrity 9.2 → 8.6 (bản cũ không ghi bất định nào, nay đã ghi sáu điểm nhưng không giải quyết được); technical_integrity 9.5 → 9.6; các tiêu chí còn lại giữ nguyên. final_score 9.29 → 9.15. Không có blocker; vẫn trên ngưỡng 9.0.

  Kỹ thuật: tự kiểm cấu trúc (tập khoá, thứ tự, nháy, NFC, trùng nguyên văn) đạt. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` ở lượt này.
