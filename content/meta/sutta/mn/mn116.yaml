summary: |-
  Kinh Isigili do Đức Phật thuyết tại Rājagaha, trên núi Isigili. Đức Phật lần lượt hỏi các tỳ-kheo có thấy núi Vebhāra, núi Paṇḍava, núi Vepulla và núi Gijjhakūṭa hay không, rồi cho biết cả bốn ngọn núi ấy trước kia từng có tên gọi khác, có sự khái niệm khác. Riêng núi Isigili giữ đúng tên gọi và sự khái niệm như hiện nay, vì thuở xưa năm trăm vị Độc Giác Phật từng trú lâu ngày trên núi này: các vị được thấy khi đi vào núi, nhưng đã vào rồi thì không được thấy nữa; thấy vậy, mọi người nói núi này nuốt các ẩn sĩ, và từ đó phát sinh danh xưng Isigili.

  Đức Phật tuyên bố sẽ kể tên, tán thán và giảng tên các vị Độc Giác Phật, rồi đọc mười ba vị đầu trong phần văn xuôi: Ariṭṭha, Upariṭṭha, Tagarasikhī, Yasassī, Sudassana, Piyadassī, Gandhāra, Piṇḍola, Upāsabha, Nīta, Tatha, Sutavā và Bhāvitatta, mỗi vị đều đã trú lâu ngày trên núi Isigili này.

  Phần kệ tiếp theo liệt kê những vị còn lại thành từng nhóm, kèm theo đó là những tán thán ngắn về từng bậc: các vị không phiền não, không còn hy vọng, đạt giác ngộ một mình độc lập, đã rút bỏ gai độc; các vị đoạn tận dây dẫn đến hữu; các vị đã cắt đứt mạn, đã hàng phục sức mạnh Māra, đã cắt tận thủ, gốc rễ khổ đau; các vị mang thân thể cuối cùng, đã cắt dây trói buộc hữu, đã cắt đứt ái; các vị ly tham, đạt trạng thái an tịnh, vô nhiễm, hiền trí, và cả vị tên Kaṇha với tâm hoàn toàn giải thoát.

  Kinh khép lại bằng lời khuyến tán: những vị ấy và những vị khác có đại oai thần là các Độc Giác Phật đã đoạn tận dây dẫn đến hữu; hãy đảnh lễ các bậc đại ẩn sĩ đã vượt qua mọi trói buộc, đã hoàn toàn tịch diệt, vô lượng. Cả bài kinh hướng tới việc tán thán và lưu giữ tên các Độc Giác Phật gắn với chính ngọn núi nơi bài kinh được nói.
