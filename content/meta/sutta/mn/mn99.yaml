summary: |-
  Kinh Subha ghi lại cuộc đối thoại giữa Đức Phật và thanh niên Subha con của Todeyya tại rừng Jeta ở Sāvatthī. Subha hỏi về chủ trương của các bà-la-môn: người tại gia thành tựu chánh pháp thiện pháp, người xuất gia không; công việc tại gia việc lớn quả lớn, xuất gia việc nhỏ quả nhỏ. Đức Phật là bậc nói sau khi phân tích, chẳng phải nói một chiều: không tán thán thực hành sai lạc cho cả hai, mà tán thán thực hành đúng đắn; và như ví với nghề làm ruộng, nghề buôn bán, công việc lớn hay nhỏ khi thành tựu thì quả lớn, khi thất bại thì quả nhỏ.

  Subha nêu năm pháp bà-la-môn chủ trương để tạo phước: chân thật, khổ hạnh, phạm hạnh, tụng đọc, bố thí. Đức Phật hỏi có vị bà-la-môn nào, thầy của các thầy đến đời thứ bảy, hay các thần tiên thuở xưa, từng tự mình với thắng trí thực chứng năm pháp rồi tuyên bố quả; không ai. Ngài ví lời các bà-la-môn như đoàn người mù nối nhau: kẻ đầu, kẻ giữa, kẻ cuối đều chẳng thấy. Subha bực bội, viện lời bà-la-môn Pokkharasāti phủ nhận khả năng chứng pháp siêu nhân; Phật chỉ ra vị ấy chẳng bao gồm bằng tâm được cả tâm nàng đầy tớ của mình, như người mù từ khi sinh nói chẳng có mặt trăng mặt trời, bị năm triền cái che lấp.

  Đức Phật phân biệt hỷ do duyên nơi ngũ dục, như lửa cháy nhờ cỏ củi, với hỷ hoàn toàn ngoài các dục, như lửa cháy chẳng cần nhiên liệu, tức sơ thiền và nhị thiền. Qua ví dụ hai vị bà-la-môn ganh đua chỗ được trọng đãi trong đại lễ hiến tế, Ngài nêu tâm từ mẫn như pháp thứ sáu. Subha thừa nhận năm pháp ấy thường thấy nơi người xuất gia hơn nơi tại gia; Phật nói chúng là phương tiện trợ ích cho tâm, là sự tu tập tâm không giận, không hại: mỗi pháp thực hiện đều sinh hoan hỷ gắn với Pháp.

  Subha hỏi con đường đến sống cùng chư Phạm thiên. Phật ví như người sinh ra ở làng Naḷakāra được hỏi đường về làng thì chẳng chậm trễ do dự: Như Lai biết Phạm thiên, biết con đường đưa đến cõi ấy. Con đường là bốn tâm giải thoát từ, bi, hỷ, xả lan tỏa mọi phương; khi tâm giải thoát do từ được tu tập như vậy, nghiệp nào có hạn lượng thì không tồn tại, không lưu trú ở đó; công thức lặp lại cho ba tâm còn lại. Subha quy y; trên đường về kể lại cho bà-la-môn Jāṇussoṇi, người cảm thán vua Pasenadi có phước báu vì trong cương vực có Như Lai trú.
