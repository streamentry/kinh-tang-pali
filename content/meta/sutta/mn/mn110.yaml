summary: |-
  Tiểu Kinh Đêm Trăng Tròn cũng diễn ra vào đêm trăng tròn ngày rằm, Đức Phật ngồi ngoài trời ở Đông Viên, lâu đài của mẹ Migāra tại Sāvatthī, được Tăng chúng vây quanh. Ngài hỏi liệu người bất thiện có thể biết người bất thiện, hay biết người thiện là người thiện; câu trả lời đều là không, điều ấy không thể có. Ngược lại, người thiện có thể biết người thiện và cả người bất thiện.

  Kinh mô tả người bất thiện qua tám mặt: đầy đủ các bất thiện pháp là vô tín, không biết hổ thẹn, không biết sợ lỗi, ít nghe, lười biếng, thất niệm, kém trí tuệ; thân cận với những sa-môn bà-la-môn cùng tội ấy; tư duy và bàn tính làm hại mình, làm hại người, làm hại cả hai; nói dối, nói hai lưỡi, nói lời ác, nói lời phù phiếm; sát sinh, lấy của không cho, tà dâm trong các dục; giữ kiến không có bố thí, cúng dường, hiến tế, không quả dị báo của nghiệp, không đời này đời sau, không mẹ cha, các chúng sinh hóa sinh và các sa-môn bà-la-môn chánh hạnh; và bố thí không cẩn thận, không tự tay, không thành tâm, vật bỏ đi, với kiến không tin có sự đến lại. Người ấy sau khi thân hoại sinh vào cảnh giới bất thiện: địa ngục hay súc sinh.

  Người thiện được mô tả đối chiếu đúng tám mặt ấy: có tín, biết hổ thẹn, biết sợ lỗi, nghe nhiều, tinh tấn nỗ lực, thiết lập niệm, có trí tuệ; thân cận với những bậc tương tự; không tư duy hay bàn tính làm hại mình, người, cả hai; từ bỏ nói dối, hai lưỡi, lời ác, lời phù phiếm; từ bỏ sát sinh, lấy của không cho, tà dâm; giữ kiến có bố thí, cúng dường, hiến tế, có quả dị báo của nghiệp, có đời này đời sau, có mẹ cha, các chúng sinh hóa sinh và các sa-môn bà-la-môn tự mình chứng ngộ rồi tuyên bố; và bố thí cẩn thận, tự tay, thành tâm, vật không bỏ đi, với kiến tin có sự đến lại. Người ấy sau khi thân hoại sinh vào cảnh giới của người thiện: sự vĩ đại chư thiên hay loài người.

  Kinh khép lại bằng kệ tóm lược phẩm Devadaha thứ nhất, điểm tên mười bài của phẩm. Trọng tâm kinh dựng lên là cặp đối xứng giữa tám mặt của người bất thiện và tám mặt của người thiện, gắn với câu trả lời mở đầu: người bất thiện không thể biết ai, còn người thiện có thể biết cả hai.
