summary: |-
  Kinh Phạm Thiên Cầu Thỉnh do Đức Phật thuyết tại rừng Jeta gần Sāvatthī, kể lại một thời xa trước ở rừng Subhaga tại Ukkaṭṭhā, khi Phạm thiên Baka khởi lên tà kiến: cõi mình là thường, bền vững, vĩnh cửu, toàn vẹn; nơi đó không sinh, không già, không chết, không tái sinh, và ngoài đây không còn lối thoát nào cao hơn. Đức Phật biết được ý nghĩ ấy và xuất hiện trong cõi Phạm thiên ấy.

  Baka lặp lại tà kiến ấy; Đức Phật tuyên bố Phạm thiên đã rơi vào vô minh. Māra Ác Ma nhập vào một thành viên đoàn tùy tùng, xúi tỳ-kheo đừng chống lại vị Đại Phạm thiên, cha của chúng sinh, rồi đem cả hội chúng ra gây sức ép; Đức Phật vạch mặt: ngươi chính là Māra, Phạm thiên và hội chúng đều nằm trong tay ngươi, nhưng Ta không nằm trong tay ngươi.

  Baka khẳng định lại và cảnh báo: nếu bám chấp đất, nước, lửa, gió, chúng sinh, chư thiên, Pajāpati hay Phạm thiên, tỳ-kheo sẽ nằm trong lãnh địa của ta, để ta tùy ý sai khiến và loại bỏ. Đức Phật đáp: với Ta cũng vậy nếu Ta bám chấp; nhưng Ta biết phạm vi và ánh sáng của ông, và biết cả những cõi ông không biết không thấy, như cõi Quang Âm nơi ông từng sinh rồi quên, cùng Biến Tịnh, Quảng Quả và Abhibhū; về trực tri, Ta biết nhiều hơn ông.

  Đức Phật lặp lại công thức ấy cho từng tầng cõi, rồi với tất cả: Ta trực tiếp biết tất cả là tất cả và biết cái không được kinh nghiệm trong phạm vi của tất cả, do vậy không tạo tác thành nó và không khẳng định nó. Đáp lời Baka mong điều ấy không thành trống rỗng, Đức Phật đọc kệ về thức không biểu hiện, vô biên, sáng chói mọi phía. Baka không thể biến mất; Đức Phật biến mất, hội chúng nghe tiếng mà không thấy Ngài, và đọc kệ: Ta thấy nguy hiểm trong hữu, không tán dương hữu nào, không nắm giữ sự hoan hỷ.

  Hội chúng kinh ngạc: với những chúng sinh vốn ưa hữu, Ngài đã nhổ bật hữu tận gốc. Māra lại nhập vào đoàn tùy tùng, khuyên đừng dẫn dắt đệ tử, đừng thuyết Pháp, đừng quyến luyến họ. Đức Phật vạch mặt: ngươi nói vì muốn điều bất lợi cho Ta; những bậc kia tự nhận Chánh Đẳng Giác nhưng không phải, còn Ta thật sự là; dù thuyết Pháp hay không, Như Lai vẫn như vậy, vì các lậu hoặc đã cắt tận gốc như gốc cây cọ. Vì Māra hết lời đáp và vì lời mời của Phạm thiên, bài kinh mang tên Phạm Thiên Cầu Thỉnh.
