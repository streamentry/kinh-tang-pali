summary: |-
  Tại rừng Jeta gần Sāvatthī, Đức Phật ví tâm với tấm vải: tấm vải dơ, đầy vết ố, dù nhúng vào màu nào, xanh, vàng, đỏ hay tím, màu nhuộm cũng xấu, không trong sạch; tấm vải sạch thì màu nhuộm đẹp, trong sạch. Cũng vậy, tâm bị ô nhiễm thì nẻo xấu có thể dự đoán, tâm không bị ô nhiễm thì nẻo lành có thể dự đoán.

  Ngài nêu mười sáu ô nhiễm của tâm: tham dục và tà tham, ác ý, giận dữ, hằn học, vô ơn, khinh miệt, ganh tị, keo kiệt, giả dối, xảo trá, bướng bỉnh, hung hăng, kiêu mạn, ngạo mạn, tự mãn, phóng dật. Tỳ-kheo hiểu rõ từng ô nhiễm ấy thì từ bỏ nó, lặp lại cho hết mười sáu. Khi đã từ bỏ đến mức ấy, vị ấy có niềm tin vững chắc nơi Đức Phật, Giáo pháp, Tăng đoàn; với ba niềm tin ấy và cả ý nghĩ mình đã từ bỏ, vị ấy đạt cảm hứng nơi ý nghĩa, nơi Pháp, niềm vui gắn liền với Pháp; khi có niềm vui, hỷ sinh khởi, thân an tịnh, vị ấy cảm thấy lạc và tâm đi vào định.

  Vị tỳ-kheo có giới hạnh, phẩm chất, trí tuệ như vậy, dù ăn cơm ngon nhiều món, điều ấy cũng không trở thành chướng ngại, như tấm vải dơ được nước sạch giặt cho trong sạch, như vàng được lò luyện cho sạch sáng. Vị ấy trú với tâm đầy từ, rải tâm rộng lớn, vô lượng, không thù hận, không ác ý đến một phương rồi toàn thể thế giới, phía trên, phía dưới, ngang khắp; công thức ấy lặp lại cho tâm bi, tâm hỷ và tâm xả. Vị ấy hiểu: có cái này, có cái thấp hơn, có cái cao hơn, và có sự thoát khỏi toàn bộ phạm vi của tưởng. Khi biết và thấy như vậy, tâm được giải thoát khỏi lậu hoặc về dục, về sự hiện hữu và vô minh; vị ấy hiểu sinh đã tận, việc cần làm đã làm, và được gọi là tỳ-kheo đã tắm bằng sự tắm rửa bên trong.

  Bà-la-môn Bhāradvāja ở Sundarikā hỏi Đức Phật có đi sông Bāhukā tắm không, vì nhiều người cho sông ấy dẫn đến cõi trời, rửa sạch nghiệp xấu. Đức Phật đáp bằng kệ: kẻ ngu dù ngâm mình trong Bāhukā hay Sundarikā cũng không rửa được nghiệp đen; với người có tâm trong sạch, ngày nào cũng là ngày hội thanh tịnh; nếu không nói dối, không hại sinh vật, không lấy thứ không được cho, có lòng tin và không keo kiệt, thì bất kỳ giếng nước nào cũng là Gayā của ông. Bhāradvāja quy y Tam bảo, xuất gia, thọ cụ túc giới và chẳng bao lâu thành A-la-hán.
