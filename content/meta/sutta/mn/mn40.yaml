summary: |-
  Tại xứ Aṅga, gần thị trấn Assapura, Đức Phật nói với các tỳ-kheo rằng người đời nhận biết họ là sa-môn và chính họ cũng tự nhận vậy; vì đã mang danh ấy, họ nên thực hành con đường thích hợp với một sa-môn, để danh xưng và lời tự nhận là thật, để người cúng dường được quả lớn, và đời xuất gia có kết quả, có thành tựu.

  Kinh xác định con đường ấy bằng việc từ bỏ mười hai pháp: tham muốn, ác ý, phẫn nộ, hiềm hận, thói chê bai, thói khinh miệt, ganh tị, keo kiệt, xảo trá, gian dối, ham muốn xấu và tà kiến; chưa từ bỏ những vết nhơ, khuyết điểm và cặn bã của sa-môn này, những điều dẫn đến cảnh giới thấp và quả khổ, thì chưa thực hành con đường ấy, ví như vũ khí hai lưỡi mài rất sắc lại được bọc trong đại y. Đức Phật phủ định rằng chỉ nhờ hình thức bên ngoài là thành sa-môn: khoác đại y, sống lõa thể, đầy bụi đất, ngâm mình trong nước, sống dưới gốc cây hay ngoài trời, hạnh luôn đứng, ăn theo giờ định sẵn, tụng chú thánh ca, mang tóc bện. Với khoác đại y và mang tóc bện, kinh lập luận: nếu chỉ nhờ khoác đại y mà từ bỏ được các pháp xấu ấy thì thân quyến đã cho khoác ngay từ khi mới sinh, nhưng Ngài vẫn thấy người khoác đại y còn đầy chúng; các hình thức khác được nêu lược.

  Người đã từ bỏ mười hai pháp ấy thấy chính mình được thanh lọc; khi thấy vậy niềm vui sinh lên, từ niềm vui hỷ sinh, thân lắng dịu, cảm nhận lạc, và tâm vào định. Vị ấy tỏa tâm từ đến bốn phương, trên, dưới, ngang khắp mọi nơi, đối với tất cả như chính mình, rộng lớn, cao cả, vô lượng, không hận, không sân, đến toàn thế giới; công thức lặp lại cho bi, hỷ và xả. Kinh ví như hồ sen nước trong mát: người khát nóng từ phương nào đến cũng được hết khát hết nóng; cũng vậy, ai xuất gia từ gia đình sát-đế-lỵ, bà-la-môn, thương gia hay lao động, phát triển bốn tâm ấy và đạt sự lắng dịu bên trong thì đang thực hành con đường thích hợp với sa-môn.

  Tóm lại, sự làm nên một sa-môn không nằm ở xuất thân hay hình thức khổ hạnh: dù xuất gia từ gia đình nào, nếu đoạn tận các lậu hoặc, ngay trong đời này tự mình trực tiếp biết, chứng ngộ và an trú trong tâm giải thoát và tuệ giải thoát không còn lậu hoặc, thì do đoạn tận lậu hoặc người ấy là sa-môn.
