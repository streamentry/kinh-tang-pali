summary: |-
  Kinh Kaṇṇakatthala mở ra ở Ujuññā, tại vườn Nai Kaṇṇakatthala. Vua Pasenadi xứ Kosala đến Ujuññā vì một công việc và đến yết kiến Đức Phật sau bữa sáng; hai chị em Somā và Sakulā nghe tin, nhờ nhà vua chuyển lời đảnh lễ, và Đức Phật nguyện cho hai chị em được an lạc.

  Nhà vua bạch rằng mình nghe nói sa-môn Gotama tuyên bố chẳng có sa-môn hay bà-la-môn nào biết tất cả, thấy tất cả và tự nhận tri kiến không còn dư sót. Đức Phật khẳng định những người ấy báng bổ bằng điều sai sự thật: lời Ngài nhớ đã nói là chẳng có ai biết tất cả, thấy tất cả cùng một lúc. Nhà vua nhận xét lời ấy nói có căn cứ; đại tướng Viḍūḍabha cho biết chuyện bàn tán vào hoàng cung từ bà-la-môn Sañjaya họ Ākāsa, và nhà vua triệu vị ấy đến.

  Về bốn đẳng cấp Sát-đế-lợi, Bà-la-môn, Phệ-sa, Thủ-đà, đời hiện tại hai đẳng cấp được tuyên là tối thượng về lễ nghi; nhưng khi nhà vua hỏi về đời vị lai, Đức Phật nêu năm pháp tinh cần: tín, ít bệnh, thật thà, tinh tấn, có trí, và nói ai thành tựu được lợi ích và hạnh phúc lâu dài. Được hỏi giữa những người thành tựu còn khác nhau chăng, Ngài nói chỉ khác nhau ở nỗ lực, ví như voi, ngựa hay bò thuần hóa khéo với chưa thuần hóa. Còn nếu nỗ lực chánh đáng, Ngài nói chẳng có sự khác nhau nào: giải thoát này với giải thoát khác.

  Nhà vua hỏi có chư thiên chăng; khi nói mình hỏi các vị ấy có trở lại hay không, Đức Phật đáp chư thiên còn phiền não sẽ trở lại, những vị không còn phiền não thì không. Đại tướng Viḍūḍabha hỏi chư thiên còn phiền não có thể lật đổ hay trục xuất những vị không còn phiền não chăng; Tôn giả Ānanda gỡ thắc mắc: trong cương vực, nhà vua có thể trục xuất bất cứ sa-môn bà-la-môn nào; ngoài cương vực thì không; còn chư thiên Trời Ba Mươi Ba, nhà vua còn chẳng thể nhìn thấy, huống chi trục xuất, và cũng vậy, chư thiên còn phiền não còn chẳng thể nhìn thấy những vị không còn phiền não. Nhà vua khen Tôn giả Ānanda, rồi hỏi về Phạm thiên và nhận được câu đáp tương tự.

  Sañjaya họ Ākāsa đến nơi, và khi nhà vua hỏi ai đã đưa chuyện bàn tán vào hoàng cung, vị ấy và đại tướng Viḍūḍabha đều chỉ vào nhau. Nhà vua tóm lại bốn câu hỏi đã được giải đáp: sự toàn tri, sự thanh tịnh của bốn đẳng cấp, chư thiên và Phạm thiên; bất cứ điều gì mình hỏi, Đức Phật đều giải đáp.
