summary: |-
  Kinh Vải Nước Ngoài mở ra ở Sāvatthī, trong rừng Jeta. Tôn giả Ānanda khất thực xong, đi đến Tịnh xá Đông nghỉ trưa. Vua Pasenadi xứ Kosala cưỡi voi giữa ban ngày, trông thấy Tôn giả, sai người hầu thay mình đảnh lễ và thỉnh đợi lại; Tôn giả im lặng nhận lời, rồi cùng nhà vua đến ngồi ở bờ sông Aciravatī.

  Nhà vua hỏi: Đức Phật ấy có thực hiện hành vi về thân, về khẩu, về ý như vậy, hành vi bị các sa-môn bà-la-môn quở trách chăng? Tôn giả đáp không. Nhà vua tán thán, nói câu hỏi mình chưa diễn đạt trọn vẹn thì Tôn giả đã giải đáp trọn vẹn, và rằng khen chê của kẻ ngu dốt không đáng kể, còn của bậc trí sau khi xem xét suy gầm mới đáng kể.

  Được hỏi hành vi nào bị quở trách, Tôn giả lần lượt định nghĩa: hành vi bất thiện là có lỗi, có lỗi là gây phiền não, gây phiền não là có quả là khổ, tức dẫn đến hại mình, hại người, hại cả hai, khiến pháp bất thiện tăng trưởng, pháp thiện suy giảm; công thức trình bày cho thân, rồi lặp lại cho khẩu và ý. Chuỗi ngược lại cũng được hỏi và trả lời theo cùng cấu trúc: hành vi thiện, không có lỗi, chẳng gây phiền não, có quả là lạc, chẳng hại mình, người, cả hai, khiến pháp bất thiện suy giảm, pháp thiện tăng trưởng. Hai lần được hỏi Đức Phật có tán thán việc đoạn bỏ các pháp bất thiện và việc thành tựu các pháp thiện chăng, Tôn giả đều đáp Như Lai đã đoạn bỏ tất cả các pháp bất thiện, thành tựu các pháp thiện.

  Nhà vua nói nếu hợp lẽ sẽ dâng voi báu, ngựa báu hay làng ưu tú, nhưng biết những vật ấy chẳng hợp với Tôn giả, nên dâng tấm vải nước ngoài do vua Ajātasattu xứ Magadha gửi tặng. Tôn giả chối từ vì ba y đã viên mãn. Nhà vua so sánh: khi mưa lớn đổ xuống vùng núi thượng nguồn, sông Aciravatī tràn lan cả hai bờ; cũng vậy, hãy lấy tấm vải làm ba y, chia ba y cũ cho các đồng phạm hạnh. Tôn giả nhận tấm vải, nhà vua từ biệt ra đi.

  Tôn giả Ānanda kể lại cuộc đàm luận cho Đức Phật và dâng tấm vải cho Ngài. Đức Phật bảo các tỳ-kheo rằng vua Pasenadi thật có lợi ích, thật có phước báu, vì được yết kiến và phụng sự Ānanda. Bài kinh xoay quanh tiêu chí phân định hành vi thân, khẩu, ý đáng quở trách hay đáng tán thán: quả khổ hay quả lạc, hại hay không hại cho mình, người và cả hai.
