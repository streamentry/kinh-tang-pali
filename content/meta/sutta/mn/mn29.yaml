summary: |-
  Đức Phật ở gần Rājagaha, trên núi Gijjhakūṭa, không lâu sau khi Devadatta rời Tăng đoàn; nhân chuyện Devadatta, Ngài nói với các tỳ-kheo. Đây là Đại Kinh Thí Dụ Lõi Cây, dựng lên hình ảnh người cần lõi cây đi tìm lõi cây để vạch ra các mức mà người xuất gia có thể dừng chân sai lầm.

  Thiện nam tử xuất gia vì lòng tin, mong chấm dứt toàn bộ khối khổ của sinh, già, chết, sầu, bi, khổ, ưu, não. Vị ấy có thể được lợi dưỡng, sự kính trọng và danh tiếng, rồi vui mừng, cho rằng đã đạt điều mình mong muốn, khen mình chê người, mê say và buông lung, nên sống trong khổ. Đức Phật ví với người cần lõi cây gặp cây lớn có lõi, nhưng bỏ qua lõi, giác cây, vỏ, chồi non, lại chặt cành lá mang đi tưởng là lõi cây; người sáng mắt sẽ bảo rằng việc gì cần lõi cây, ông ta sẽ không đạt được. Vị ấy gọi là nắm lấy cành lá của đời phạm hạnh và dừng lại ở đó.

  Công thức ấy được lặp lại cho từng cấp: vị thành tựu giới nhưng cho đó là đủ, khen mình chê người, buông lung, thì như người chặt lấy chồi non; vị thành tựu định, tâm nhất trí, mà dừng lại, thì như người bóc lấy vỏ; vị thành tựu tri kiến, biết và thấy, mà dừng lại, thì như người chặt lấy giác cây. Ở mỗi mức, hệ quả đều như nhau: mê say, buông lung, sống trong khổ, và bất cứ việc gì cần lõi cây sẽ không đạt được.

  Trái lại, vị tỳ-kheo vượt qua tất cả: vui với lợi dưỡng nhưng không cho là đủ, không vì nó mà khen mình chê người; sống không buông lung, lần lượt thành tựu giới, định, tri kiến, và ở từng cấp cũng không cho là đủ, không khen mình chê người, không mê say. Cuối cùng vị ấy đạt tâm giải thoát không thể lay chuyển và không thể thoái chuyển khỏi tâm đó, được ví với người chặt đúng lõi cây mang đi, biết rõ đó là lõi cây, nên việc gì cần lõi cây sẽ làm thành công.

  Bài kinh kết luận: đời phạm hạnh không được sống vì lợi dưỡng, sự kính trọng và danh tiếng, cũng không phải để thành tựu giới, định hay tri kiến; chính tâm giải thoát không thể lay chuyển mới là mục tiêu của đời phạm hạnh, là lõi cây và là điểm cuối cùng. Trọng tâm của bài là cảnh báo người xuất gia không dừng ở những thành tựu ngoài lõi.
