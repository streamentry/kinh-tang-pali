summary: |-
  Kinh Quán Từng Pháp Một ghi lời Đức Phật dạy tại rừng Jeta, tu viện của ông Anāthapiṇḍika gần Sāvatthī. Đức Phật tán dương Sāriputta là bậc hiền trí, đại trí tuệ, quảng trí tuệ, hỷ trí tuệ, nhanh trí tuệ, sắc bén và quyết trạch trí tuệ, và kể rằng trong nửa tháng, Sāriputta quán pháp tuần tự từng pháp một.

  Sāriputta chứng và an trú sơ thiền, có hỷ lạc do viễn ly sinh, còn tầm và tứ; rồi nhị thiền khi tầm tứ lắng dịu, nội tâm thanh sáng; rồi tam thiền khi hỷ phai nhạt, sống xả có niệm tỉnh giác; rồi tứ thiền do đoạn bỏ lạc khổ, diệt tận hỷ ưu. Tiếp đó lần lượt vượt qua các tưởng sắc để chứng hư không vô biên xứ, rồi thức vô biên xứ, vô sở hữu xứ, phi tưởng phi phi tưởng xứ, rồi vượt qua tầng ấy để chứng diệt thọ tưởng; sau khi thấy bằng trí tuệ, các lậu hoặc được đoạn tận.

  Ở từng tầng, các pháp có trong đó, từ tầm, tứ, hỷ, lạc, nhất tâm đến xúc, thọ, tưởng, tư, tâm, dục, thắng giải, tinh tấn, niệm, xả, tác ý, được xác định từng pháp một. Chúng được biết khi sinh khởi, an trú, biến mất; vị ấy biết: chưa từng có rồi hiện hữu, đã hiện hữu rồi đoạn hoại; sống với các pháp ấy không nương tựa, không hệ lụy, giải thoát, không buộc ràng, với tâm đã vượt ngoài giới hạn; và biết còn sự xuất ly cao hơn nữa, nhờ làm sung mãn điều ấy mà tầng cao hơn được thành tựu. Riêng ở tầng diệt thọ tưởng, xuất định với niệm, vị ấy quán các pháp đã qua, đã diệt, đã biến đổi theo cùng công thức, nhưng biết không còn xuất ly cao hơn nữa, và sự không-có-mặt được thành tựu.

  Đức Phật kết luận: ai được nói đúng đắn là đã đạt thuần thục và hoàn mãn trong giới Thánh, định Thánh, trí tuệ Thánh và giải thoát Thánh, chính là Sāriputta; và ai được nói đúng đắn là con của Đức Thế Tôn, sinh từ lòng Ngài, từ miệng Ngài, từ Pháp, được tạo bởi Pháp, trưởng tử thừa tự Pháp, không phải thừa tự vật chất, cũng chính là Sāriputta. Sāriputta đúng đắc chuyển theo vô thượng pháp luân đã được Đấng Như Lai chuyển động.

  Toàn bài là một chuỗi quán tuần tự: mỗi tầng định từ sơ thiền đến diệt thọ tưởng đều được soi bằng cùng một công thức, cho đến tầng không còn xuất ly cao hơn nữa.
