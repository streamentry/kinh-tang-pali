summary: |-
  Ở Sāvatthī, tại rừng Jeta, du sĩ Vacchagotta đến gặp Đức Phật và hỏi mười quan điểm: thế giới thường còn hay không thường còn, hữu biên hay vô biên; mạng sống và thân thể là một hay khác nhau; và bốn vế về Như Lai sau khi chết — còn tồn tại, không còn, vừa còn vừa không còn, không còn cũng không phải không còn — mỗi vế kèm lời tuyên bố đây là chân lý duy nhất. Với cả mười câu, Đức Phật trả lời: đây không phải quan điểm của tôi.

  Hỏi Ngài thấy nguy hại gì mà không theo bất kỳ quan điểm nào, Đức Phật mô tả từng quan điểm là rừng quan điểm, trói buộc của quan điểm, gắn với khổ, ưu não, nóng bỏng; không đưa đến nhàm chán, không tham, chấm dứt, an tịnh, thắng trí, giác ngộ và Niết-bàn. Hỏi tiếp Ngài có quan điểm nào hết không, Ngài đáp quan điểm đã bị Như Lai loại bỏ: Ngài đã thấy sắc, thọ, tưởng, hành, thức là gì, sự sinh khởi và chấm dứt của chúng ra sao, nên sau khi từ bỏ mọi ngã mạn và tùy miên mạn ngã, Như Lai được tuyên bố là giải thoát nhờ không chấp thủ.

  Vacchagotta hỏi khi tâm tỳ-kheo được giải thoát như vậy thì được tái sinh ở đâu; Đức Phật từ chối cả bốn vế: được tái sinh, không được tái sinh, vừa được vừa không được, không được và cũng không phải không được — đều không áp dụng. Vacchagotta thưa mình rơi vào không hiểu, mê muội, và cả chút tin tưởng trước đây cũng biến mất. Đức Phật bảo Pháp này sâu xa, vượt khỏi lý luận, rồi hỏi ngược về một đám lửa: nó cháy nhờ củi và cỏ khô làm chất nuôi dưỡng; khi chất nuôi dưỡng cạn kiệt, đám lửa là đã tắt, và câu hỏi nó đi về hướng đông, nam, tây hay bắc không áp dụng.

  Cũng vậy, bất cứ sắc, thọ, tưởng, hành hay thức nào nhờ đó có thể mô tả Như Lai đều đã được Ngài từ bỏ, cắt tận gốc rễ như gốc chặt cây talà, khiến không thể sinh khởi trong tương lai. Như Lai được giải thoát nhờ sự đoạn tận của từng pháp ấy, sâu xa, khó lặn thấu như biển cả; với cả bốn vế về tái sinh, không điều nào áp dụng — công thức lặp lại cho từng pháp.

  Nghe vậy, Vacchagotta ví lời dạy của ông Gotama như cây sāla đã rụng hết cành lá và vỏ, thanh tịnh trên lõi cây, rồi xin quy y trọn đời. Bài kinh khép lại: đối với bậc giải thoát, bốn vế về tái sinh đều không áp dụng, như không thể hỏi đám lửa đã tắt đi về đâu.
