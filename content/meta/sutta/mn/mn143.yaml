summary: |-
  Đức Phật ở gần Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika. Lúc ấy người gia chủ Anāthapiṇḍika trọng bệnh, sai người đến đảnh lễ Đức Phật và Tôn giả Sāriputta, xin Tôn giả vì lòng thương tưởng mà đến. Sāriputta đi với Ānanda theo sau, đến nhà và hỏi thăm bệnh tình.

  Anāthapiṇḍika đáp không dễ chịu gì; các cảm thọ khổ càng lúc càng gia tăng, không thuyên giảm, và mô tả bằng bốn ví: như bị mũi đục sắc đục vào đầu, như bị sợi dây da chắc buộc chặt quanh đầu, như bụng bị dao sắc xẻ ra, và như bị hai người khỏe mạnh đem thiêu trên than đỏ.

  Sāriputta dạy gia chủ hãy học như vầy: ta sẽ không chấp thủ mắt, không để còn có thức nào của ta nương vào mắt, rồi lặp lại công thức ấy cho tai, mũi, lưỡi, thân, ý; cho sắc, tiếng, hương, vị, xúc, pháp; cho thức và xúc của sáu môn; cho các cảm thọ sanh từ mỗi xúc ấy; cho sáu giới từ đất đến thức; cho năm uẩn; cho bốn xứ vô sắc; cho cõi này và cõi kia; và cho hết thảy những gì được thấy, nghe, giác, biết, được đạt, được tìm kiếm, được theo duy tâm trí.

  Nghe xong, gia chủ khóc lóc nước mắt tuôn trào; Ānanda hỏi ngươi có sa đọa không, ông đáp không, chỉ vì chưa từng nghe bài thuyết pháp hợp pháp nào như vậy. Khi Ānanda nói pháp như vậy chỉ đến với hàng xuất gia chứ không đến với hàng gia chủ áo trắng, Anāthapiṇḍika cầu mong nó đến với cả hàng gia chủ, vì có những người ít bụi trong mắt đang suy tàn vì không được nghe pháp, và sẽ có những bậc hiểu biết pháp.

  Không lâu sau hai vị ra đi, gia chủ mạng chung và sinh vào chúng trời Đâu suất. Đêm đó, thiên tử Anāthapiṇḍika chiếu sáng toàn bộ rừng Jeta, đến đảnh lễ Đức Phật và đọc kệ tán thán: nhờ nghiệp, trí tuệ, pháp, giới hạnh và sinh mạng tối thượng mà phàm nhân được thanh tịnh, chẳng phải bởi dòng họ hay của cải; người trí hãy khéo léo duy xét pháp; và tỳ-kheo nào đã qua bờ bên kia, tối đa cũng chỉ ngang với Sāriputta. Sáng hôm sau Đức Phật kể lại cho các tỳ-kheo; Ānanda đoán thiên tử ấy là Anāthapiṇḍika vì ông luôn sùng kính Sāriputta, và Đức Phật xác nhận suy luận ấy là đúng. Trọng tâm của bài kinh là lời dạy không chấp thủ bất cứ điều gì được thấy, nghe, giác, biết, bài pháp chưa từng đến với hàng gia chủ áo trắng, và quả tức khắc của nó nơi người đang hấp hối.
