summary: |-
  Tại rừng Jeta ở Sāvatthī, một vị tỳ-kheo tố cáo Tôn giả Moḷiyaphagguna giao du quá thân mật với các tỳ-kheo-ni, đến mức hai bên nổi giận, khởi tranh tụng khi ai nói xấu phía kia. Đức Phật răn dạy: một thiện nam tử vì lòng tin xuất gia thì việc đó không thích hợp; dù ai nói điều không hay hay dùng tay, cục đất, gậy, vũ khí đánh các tỳ-kheo-ni hay đánh chính thầy, phải từ bỏ ham muốn và suy nghĩ gắn với đời sống gia đình, tập cho tâm không biến đổi theo hướng xấu, không thốt ra lời ác, sống với lòng cảm thông, với tâm từ, không sân hận bên trong.

  Đức Phật nhớ lại thời các tỳ-kheo làm Ngài hài lòng: dạy một lần về việc ăn trong một lần ngồi là đủ, chỉ cần khơi dậy niệm, ví như người đánh xe giỏi lên cỗ xe thuần thục, roi đặt sẵn. Ngài cũng ví Tăng chúng như khu rừng sāla: chặt bỏ cây non cong queo hút dưỡng chất, chăm sóc cây thẳng khỏe — hãy từ bỏ điều bất thiện, chuyên tâm vào các pháp thiện.

  Nữ gia chủ Vedehikā có tiếng hiền hòa; nữ tỳ Kāḷī thử chủ bằng cách dậy muộn ba lần, lần thứ ba bị then cửa đánh rách đầu, cô kể với hàng xóm và tiếng tốt của bà chủ chuyển thành tiếng xấu. Đức Phật rút ra: tỳ-kheo tỏ ra hiền hòa, khiêm nhường, an tịnh chỉ chừng nào chưa bị lời nói khó chịu chạm đến; và dễ được khuyên dạy vì y phục, thức ăn, chỗ ở, thuốc men thì không tính — chỉ người kính trọng, coi trọng, tôn kính Pháp mới đúng nghĩa ấy.

  Có năm cách người khác có thể nói với mình: đúng lúc hoặc không, đúng sự thật hoặc không, nhẹ nhàng hoặc thô ác, có lợi hoặc không, với tâm từ hoặc với sân hận bên trong. Dù theo cách nào, hãy tập cho tâm không biến đổi theo hướng xấu, không thốt lời ác, sống với lòng cảm thông và tâm từ, rồi rải tâm từ đến người ấy và toàn thế giới. Bốn ví dụ minh họa tâm ấy khó lay chuyển: như đất lớn không thể bị làm cho không còn là đất, như hư không không thể vẽ hình lên được, như sông Hằng không thể bị bó cỏ cháy thiêu đốt, như túi da mèo thuộc kỹ không còn phát tiếng sột soạt.

  Kinh khép lại bằng lời dạy ví dụ cái cưa: ngay cả khi những tên cướp hèn hạ dùng cưa hai cán cưa tay chân từng phần, ai để tâm sinh ác ý là không làm theo lời dạy của Đức Phật; ngay trong trường hợp ấy cũng phải rải tâm từ đến kẻ đó và đến toàn thế giới. Các tỳ-kheo xác nhận không còn cách nói nào, dù nhỏ hay lớn, mình không chịu đựng nổi.
