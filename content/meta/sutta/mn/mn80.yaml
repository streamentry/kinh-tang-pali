summary: |-
  Kinh Vekhanasa kể khi Đức Phật ở Sāvatthī, tại rừng Jeta, tu viện Anāthapiṇḍika. Du sĩ Vekhanasa đến gặp và thốt lên đây là quang sắc tối thượng. Khi được hỏi quang sắc tối thượng là gì, ông chỉ lặp vòng quang sắc mà không có quang sắc nào khác cao hơn hay thù thắng hơn, không chỉ rõ quang sắc ấy. Đức Phật ví như người ham muốn người đẹp nhất trong xứ mà không biết nàng là ai, ở đâu — lời nói không thể minh chứng được.

  Vekhanasa giải thích đó là quang sắc của thân vô bệnh sau khi chết, ví như ngọc lưu ly đẹp đặt trên tấm thảm len, tự tỏa sáng. Đức Phật so sánh: ngọc lưu ly thua con đom đóm trong đêm, đom đóm thua ngọn đèn dầu, đèn thua đống lửa lớn, lửa thua ngôi sao mai, sao mai thua mặt trăng rằm, trăng thua mặt trời giữa trưa; hơn thế Ngài còn biết nhiều chư thiên mà ánh sáng mặt trời mặt trăng không chiếu tới, nhưng Ngài không nói quang sắc tối thượng.

  Ngài thuyết năm loại dục: sắc, tiếng, hương, vị, xúc đáng ưa, dễ chịu, khơi dậy ham muốn; dựa trên năm loại dục ấy sinh khởi lạc và hỷ là dục lạc; từ các dục sinh dục lạc, từ dục lạc sinh dục tối thượng lạc, điều ấy được tuyên bố là tối thượng. Vekhanasa khen và lặp lại câu ấy, nhưng Đức Phật nói vì ông có thấy khác, tin khác, ưa khác, tu tập khác, đạo sư khác nên khó hiểu các điều ấy; chỉ các tỳ-kheo A-la-hán mới có thể hiểu. Vekhanasa bực bội, mắng nhiếc rằng sa-môn Gotama sẽ bị thua thiệt, và rằng có sa-môn bà-la-môn không biết quá khứ, không thấy tương lai mà vẫn tự nhận sinh đã tận — đó chỉ là chuyện đùa cợt, hư vọng.

  Đức Phật đáp đối với họ có sự phê phán chính đáng theo Pháp, rồi mời: hãy để người có trí, không xảo trá, không gian dối, bản tính thẳng thắn đến đây, Ta sẽ giáo giới, thuyết Pháp; thực hành đúng như được giáo giới, chẳng bao lâu người ấy tự biết, tự thấy cách giải thoát đúng đắn khỏi trói buộc vô minh, ví như đứa trẻ thơ bị trói nơi cổ, khi lớn lên và các căn thuần thục thì dây được cởi ra và nó biết ta được giải thoát. Vekhanasa tán thán và xin quy y làm nam cư sĩ trọn đời. Bài kinh nhằm phơi bày một khẳng định trống rỗng, không minh chứng được, đối lập với lời dạy có thể thực hành và tự mình kiểm chứng.
