summary: |-
  Kinh Hàng Ma do Tôn giả Mahāmoggallāna kể tại rừng Bhesakaḷā giữa dân Bhagga. Khi Tôn giả đi kinh hành, Māra Ác Ma nhập vào bụng, tận vùng ruột; Tôn giả chú tâm đúng cách vào trong mình, thấy Māra và bảo hắn ra đi, đừng quấy nhiễu Như Lai hay đệ tử Như Lai. Māra tưởng sa-môn không thấy mình, nghĩ bậc Đạo Sư cũng không nhận ra hắn nhanh thế; Tôn giả nêu lại ý nghĩ ấy, Māra phải chui ra khỏi miệng.

  Từ đó Tôn giả kể thuở xưa từng là Māra tên Dūsī, có người chị tên Kāḷī, mà ngươi là con của chị ấy. Thời ấy Đức Phật Kakusandha có đôi đệ tử tối thắng: Vidhura, không ai ngang về thuyết Pháp, và Sañjīva, nhập diệt thọ tưởng dễ dàng. Một lần Sañjīva nhập diệt thọ tưởng dưới gốc cây, người đời tưởng đã chết và hỏa táng; hôm sau vị sống lại đi khất thực, nên tên là Sañjīva.

  Māra Dūsī nhập vào các bà-la-môn và gia chủ, xúi họ mắng nhiếc, sỉ nhục, chọc giận và quấy nhiễu các tỳ-kheo có giới hạnh tốt, để tìm kẽ hở; phần lớn người chết thời ấy sinh vào cõi dữ. Đức Phật Kakusandha cho biết họ đã bị Māra nhập, và dạy tỏa tâm từ, bi, hỷ, xả vô lượng đến toàn thế giới. Māra lại xúi họ kính trọng, tôn kính, cúng dường các tỳ-kheo cùng hy vọng; lần này phần lớn người chết sinh vào cõi lành, Đức Phật dạy quán bất tịnh của thân, tưởng đáng chán của thức ăn, tưởng không đáng say mê với thế giới, quán vô thường trong mọi hành.

  Buổi sáng, Đức Phật Kakusandha đi khất thực với Vidhura theo sau; Māra Dūsī nhập vào một cậu bé ném đá vỡ đầu Vidhura, vị ấy vẫn cứ theo sau, đầu vỡ máu chảy. Đức Phật ngoái nhìn như voi lớn, nói Māra Dūsī thật không biết giới hạn; Dūsī chết ngay, tái sinh vào Đại Địa Ngục có ba tên: Liên hệ Sáu Xứ Xúc, Bị Đâm Bằng Cọc và Tự Mình Cảm Thọ. Tôn giả kể mình từng bị nung đốt ở đó mười ngàn năm.

  Bài kệ lặp lại công thức: vị tỳ-kheo trực tiếp biết điều này, là đệ tử của Đức Phật; nếu ngươi xúc phạm vị ấy, hỡi Kẻ Đen Tối, ngươi sẽ đến đau khổ. Các việc vị tỳ-kheo trực tiếp biết gồm rung chuyển lâu đài mẹ Migāra và cung điện Vejayanta bằng ngón chân cái, hỏi Sakka về sự giải thoát do đoạn tận ái. Kệ kết bằng ví lửa: kẻ ngu chạm vào lửa đang cháy thì tự bị thiêu, xúc phạm Như Lai cũng vậy; sau khi được cảnh cáo, dạ xoa ấy buồn bã biến mất.
