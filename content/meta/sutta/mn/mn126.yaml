summary: |-
  Tại Trúc Lâm gần Rājagaha, Tôn giả Bhūmija đến thăm vương tử Jayasena. Vương tử hỏi: có một số sa-môn bà-la-môn chủ thuyết rằng dù hành phạm hạnh có ước nguyện, không ước nguyện, vừa có vừa không, hay không phải có không phải không ước nguyện, vẫn không thể đạt được quả — bậc Đạo sư của Tôn giả nói gì, lập luận gì? Bhūmija đáp rằng điều đó con chưa từng nghe tận mặt Đức Phật, nhưng có trường hợp Đức Phật sẽ trả lời: hành phạm hạnh một cách bất như lý thì dù theo bốn cách ước nguyện ấy vẫn không đạt quả; hành phạm hạnh một cách như lý thì dù theo bốn cách ấy đều có thể đạt quả. Vương tử nói nếu bậc Đạo sư thuyết như vậy thì chắc chắn đứng trên đầu mọi sa-môn bà-la-môn tầm thường, rồi tự tay thết đãi Bhūmija bằng món ăn trong chậu cơm của mình.

  Sau bữa ăn, Bhūmija thuật lại toàn bộ cho Đức Phật và hỏi liệu mình có phải là người nói đúng lời Đức Phật đã nói, không hủy báng bằng điều không thật, giải thích đúng pháp tùy pháp. Đức Phật xác nhận đúng như vậy.

  Đức Phật triển khai: những sa-môn bà-la-môn có tà đạo tám ngành — từ tà kiến đến tà định — dù hành phạm hạnh theo bất kỳ cách ước nguyện nào trong bốn cách cũng không thể đạt quả, vì đó không phải là phương pháp để đạt quả. Bốn ví dụ minh họa: người cần dầu mà đổ cát vào thùng, rắc nước rồi ép; người cần sữa mà kéo sừng con bò mới sinh bê; người cần bơ mà đổ nước vào chum rồi khuấy; người cần lửa mà mài cây khoan vào gỗ tươi còn nhựa —无论 ước nguyện theo bốn cách nào cũng không thành. Ngược lại, những ai có Thánh đạo tám ngành — từ chánh kiến đến chánh định — hành phạm hạnh theo bốn cách ước nguyện ấy đều có thể đạt quả, vì đó chính là phương pháp. Bốn ví dụ đối xứng: ép bột mè thì được dầu, kéo vú con bò mới sinh bê thì được sữa, khuấy sữa chua thì được bơ, mài cây khoan vào gỗ khô đã héo thì được lửa.

  Bhūmija thưa rằng bốn ví dụ ấy chưa từng được nghe trước đây, làm sao khởi lên cho con như đã khởi lên cho Đức Phật. Ý chính của kinh vì vậy nằm ở đối phản giữa hai nhóm: quả của đời phạm hạnh không do chuyện có hay không có ước nguyện quyết định, mà do phương pháp hành trì đúng hay sai — Thánh đạo tám ngành mới là phương pháp, tà đạo tám ngành thì bất kỳ nỗ lực nào cũng vô hiệu như ép cát tìm dầu.
