summary: |-
  Tiểu Kinh Phân Biệt Nghiệp ghi cuộc đối thoại giữa Đức Phật với người thanh niên Subha, con trai của Todeyya, tại rừng Jeta, tu viện của ông Anāthapiṇḍika gần Sāvatthī. Subha hỏi do nhân gì, do duyên gì mà giữa loài người là người lại thấy người thấp hèn và người cao sang. Đức Phật thuyết tóm tắt: chúng sinh là chủ của nghiệp, là thừa tự của nghiệp, sinh ra từ nghiệp, được nghiệp ràng buộc, nương tựa nghiệp; nghiệp phân biệt chúng sinh thành thấp hèn và cao sang. Subha thưa chưa hiểu nghĩa lời tóm tắt, và Đức Phật nhận lời nói rộng.

  Phần nói rộng triển khai bảy cặp hạnh đối lập, mỗi cặp cùng một mô thức: hạnh xấu nhờ nghiệp ấy đưa, sau khi chết, vào cảnh khổ, cảnh xấu, cảnh đọa, địa ngục, hoặc nếu trở lại thân người thì nhận quả ấy ở chỗ sinh lại; hạnh lành đưa đến cảnh lành, cõi trời, hoặc nhận quả đối lập nếu trở lại thân người. Sát sinh, không từ bi với chúng sinh đưa đến ngắn mạng; từ bỏ sát sinh, có từ bi đưa đến trường thọ. Làm hại chúng sinh bằng tay, đá, gậy, dao đưa đến nhiều bệnh; không làm hại đưa đến ít bệnh. Sân nhuận, nói ít thôi cũng nổi giận, bộc lộ oán ghét đưa đến xấu xí; không sân nhuận đưa đến đẹp đẽ. Ghen ghét trước lợi dưỡng và sự cung kính của người khác đưa đến ít uy quyền; không ghen tị đưa đến đại uy quyền. Không bố thí cho sa-môn hay bà-la-môn, từ thức ăn, nước uống cho đến nhà cửa, đèn đuốc, đưa đến nghèo nàn; bố thí đưa đến đại phú. Cứng cỏi, kiêu mạn, không tôn kính người đáng tôn kính đưa đến gia đình hạ cấp; ngược lại đưa đến gia đình cao quý. Không hỏi han về thiện, bất thiện, có tội, không tội, nên hành trì, và việc nào đưa đến khổ đau hay lợi ích lâu dài đưa đến kém tuệ; hỏi han như vậy đưa đến đại tuệ.

  Cuối bài, Đức Phật chốt rằng hạnh đưa đến ngắn mạng đưa đến ngắn mạng, hạnh đưa đến trường thọ đưa đến trường thọ, tiếp diễn qua hết thảy bảy cặp, rồi lặp lại nguyên tắc nghiệp phân biệt chúng sinh thành thấp hèn và cao sang. Subha tán thán, xin quy y Đức Phật, Pháp và Tăng chúng tỳ-kheo, và xin làm cư sĩ đến mạng chung.

  Bài kinh nối từng khác biệt về thân mạng, sức khỏe, dung mạo, uy quyền, tài sản, dòng họ, tuệ với hạnh đã làm, đã thọ trì, cho thấy chính hạnh ấy phân biệt chúng sinh thành thấp hèn và cao sang.
