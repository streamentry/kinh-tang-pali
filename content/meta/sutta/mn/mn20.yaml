summary: |-
  Tại rừng Jeta ở Sāvatthī, Đức Phật dạy rằng một vị tỳ-kheo chuyên tu tâm cao thượng nên thỉnh thoảng chú tâm đến năm phương pháp, khi những suy nghĩ xấu, bất thiện liên hệ đến tham, sân và si sinh khởi.

  Phương pháp thứ nhất là chuyển sang chú tâm một đề mục khác liên hệ đến thiện, ví như thợ mộc lành nghề dùng một cái chốt nhỏ để đánh bật hoặc rút ra cái chốt lớn. Nếu suy nghĩ ấy vẫn sinh khởi, phương pháp thứ hai là quán xét sự nguy hại của chúng: những suy nghĩ này là bất thiện, đáng chê trách và dẫn đến khổ — ví như người nam hay nữ còn trẻ, thích trang điểm, khi có xác rắn, chó hay người chết treo quanh cổ thì kinh hãi, ghê tởm và chán ghét. Nếu vẫn sinh khởi, phương pháp thứ ba là cố quên chúng đi và không chú ý, ví như người có mắt sáng nhắm mắt lại hoặc nhìn sang chỗ khác khi thấy cảnh không muốn nhìn.

  Nếu vẫn không hết, phương pháp thứ tư là chú tâm đến việc làm lắng sự tạo tác của những suy nghĩ ấy, ví như người đang đi rất nhanh lần lượt chuyển sang đi chậm, đứng lại, ngồi xuống, rồi nằm xuống, bỏ những tư thế thô hơn để sang những tư thế nhẹ nhàng hơn. Phương pháp cuối cùng là nghiến răng, ép lưỡi lên nóc miệng, dùng tâm chế ngự, đè nén và áp đảo tâm, ví như người mạnh nắm đầu, cổ hay vai một người yếu hơn rồi áp đảo người ấy. Mỗi phương pháp khi thành công đều đưa đến cùng một kết quả: những suy nghĩ xấu được từ bỏ và chấm dứt, tâm lắng xuống bên trong, an trú, nhất tâm và vào định.

  Đức Phật kết luận: vị tỳ-kheo đã đi hết năm phương pháp ấy được gọi là người làm chủ các đường hướng của suy nghĩ, có thể nghĩ điều mình muốn nghĩ và không nghĩ điều mình không muốn nghĩ, đã cắt đứt ái, tháo bỏ kiết sử, nhờ hiểu đúng sự kiêu mạn đã chấm dứt khổ. Bài kinh này cũng là kinh cuối cùng của Phẩm Sư Tử Hống, khép lại bằng một bài kệ tóm lược tên các kinh của phẩm.
