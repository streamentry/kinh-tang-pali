summary: |-
  Kinh Saṅgārava mở đầu khi Đức Phật du hành đến Caṇḍalakappa. Nữ Bà-la-môn Dhanañjānī có lòng tin sâu đậm nơi Đức Phật thốt lời đảnh lễ Ngài; thanh niên Saṅgārava, bậc thông ba Vệ Đà, mắng bà vì ca ngợi một sa-môn, và bà đáp cháu chẳng hiểu giới trí của Ngài. Khi Phật trú trong vườn xoài của bà-la-môn Todeyya, Saṅgārava đến hỏi trong các sa-môn bà-la-môn tự nhận thắng trí viên mãn hiện nay, Gotama là vị nào.

  Đức Phật nói có sự khác biệt: có vị nhờ truyền khẩu mà tự nhận, ví các bà-la-môn thông tam minh; có vị chỉ nhờ lòng tín; có vị do tự mình thắng tri pháp trước đây chưa từng được nghe — trong số ấy, Ta là một vị. Ngài kể lại: học với Āḷāra Kālāma, tự mình chứng pháp Vô sở hữu xứ; rồi học với Uddaka con của Rāma, chứng pháp Phi tưởng phi phi tưởng xứ; cả hai pháp chỉ đưa đến tái sinh trong các cõi ấy chứ không đưa đến Niết-bàn, nên Ngài chán bỏ ra đi.

  Ở Uruvelā, Ngài thấy vùng đất đẹp, ngồi tinh tấn. Ba phép ví chưa từng được nghe hiện lên: khoan que chẳng sinh được lửa từ thanh gỗ còn ướt còn nhựa, dù đặt trong nước hay trên đất khô, ví người chưa xa lìa các dục hoặc chưa đoạn tận năm điều — dục ái cho đến dục nóng; chỉ thanh gỗ khô kiệt trên đất khô mới sinh được lửa, ví người xa lìa các dục và năm điều ấy được đoạn tận, an tịnh nội tại — dù có hay không cảm thọ khổ do nỗ lực, các vị ấy vẫn đạt tri kiến, giác ngộ tối thượng.

  Rồi Ngài thử các nỗ lực khắc nghiệt: nghiến chặt hàm răng, dùng tâm đè ép tâm; thiền định không hơi thở khiến gió rít như bễ người thợ rèn, thân nóng như bị ném xuống hố than hồng; từ chối dưỡng chất thiên giới của chư thiên, ăn rất ít, thân gầy gò đến mức tối đa. Khổ hạnh ấy vẫn chưa đưa đến pháp siêu nhân nào.

  Nhớ lại thuở nhỏ đã chứng sơ thiền dưới bóng cây mận, Ngài nhận ra đó là con đường giác ngộ, bèn dùng thức ăn lấy lại sức rồi chứng bốn thiền. Trong ba canh đêm, Ngài đạt ba thắng trí: trí nhớ các đời sống quá khứ, thiên nhãn biết sự chết đi và tái sinh của chúng sinh, và trí đoạn tận các lậu hoặc khi tâm được giải thoát. Saṅgārava hỏi có chư thiên chăng; Phật đáp trên phương diện lý do có các chư thiên tối thượng, và người có trí sẽ đi đến kết luận ấy. Saṅgārava quy y tam bảo.
