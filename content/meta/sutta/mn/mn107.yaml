summary: |-
  Kinh Gaṇaka Moggallāna ghi cuộc gặp giữa Đức Phật và Bà-la-môn Gaṇaka Moggallāna tại Đông Viên, trong lâu đài của mẹ Migāra ở Sāvatthī. Thấy sự học tập thứ lớp, thực hành thứ lớp, hành đạo thứ lớp trong nghề xây dựng, trong các Bà-la-môn, các cung thủ và nghề tính toán, ông hỏi trong pháp và luật này có thiết lập được sự thứ lớp như vậy chăng.

  Đức Phật đáp có, trình bày cách Như Lai điều phục người đáng điều phục theo từng bậc: trước hết là người có giới, sống hộ trì Pātimokkha, đầy đủ oai nghi, thấy sợ trong các lỗi dù nhỏ; rồi phòng hộ các căn, chớ chấp thủ tướng và tùy tướng ở sáu căn; rồi biết độ lượng trong món ăn, để duy trì thân, nuôi phạm hạnh; rồi tinh cần tỉnh thức qua ban ngày và các canh đêm, niệm tỉnh giác trong mọi cử chỉ; rồi thân cận nơi viễn ly, từ bỏ năm triền cái là cấu uế làm trí tuệ suy yếu, và chứng bốn thiền. Với các vị hữu học, đó là sự giáo huấn; với các vị A-la-hán, những pháp ấy đưa đến an lạc hiện tại, niệm tỉnh giác.

  Bà-la-môn hỏi liệu các đệ tử được chỉ dạy như vậy có tất cả đều chứng Niết-bàn không. Đức Phật đáp có một số chứng, một số không. Khi ông hỏi vì sao vẫn có người không đạt dù Niết-bàn, con đường và người khuyến dụ đều có mặt, Đức Phật hỏi lại về con đường đi Rājagaha: được chỉ dạy như vậy, một người có thể đi lạc, người kia an toàn đến nơi. Ông đáp mình chỉ là người chỉ đường; Đức Phật khẳng định Như Lai cũng chỉ là người chỉ đường.

  Bà-la-môn phân biệt hai hạng xuất gia: những kẻ vô tín xuất gia vì mưu sinh, gian trá, không phòng hộ các căn — Đức Phật không sống chung; và những con nhà dòng học xuất gia vì lòng tín, có giới hạnh, trí tuệ — Đức Phật sống chung. Ông ví lời dạy của Đức Phật như râu hương trong các hương gốc, đàn hương đỏ trong hương lõi, hoa vassikā trong hương hoa, rồi xin quy y trọn đời với tư cách cư sĩ.

  Toàn bài lấy hình ảnh thứ lớp của các nghề làm khung: con đường được trình bày theo từng bậc từ giới đến định, và khi được hỏi vì sao vẫn có người không đạt, kinh để lại lời kết rằng Như Lai chỉ là người chỉ đường.
