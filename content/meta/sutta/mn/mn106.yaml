summary: |-
  Kinh Lợi Ích Bất Động ghi lời Đức Phật dạy tại Kammāsadamma, xứ Kuru. Đức Phật khai bằng nhận định các dục vô thường, trống rỗng, giả dối, pháp dối gạt; các dục và các dục tưởng, hiện tại hay đời sau, đều là lãnh địa, bãi mồi, cảnh giới Māra, nơi các ý niệm tham dục, sân hận, hiềm khích tăng trưởng, thành chướng ngại cho Thánh đệ tử đang học.

  Kinh trình bày bảy hành đạo: ba đưa đến bất động, sống với tâm rộng lớn vô lượng, chế ngự thế giới; suy tầm sắc là bốn đại và sắc do bốn đại làm duyên; suy tầm các dục, các sắc cùng các tưởng của chúng đều vô thường, không đáng ưa thích, bám víu. Ba hành đạo đưa đến vô sở hữu xứ: suy tầm các tưởng ấy đều là tưởng, chỗ tưởng đoạn diệt hết là tịch tịnh, thù thắng; quán cái này trống không của tự ngã hay cái thuộc tự ngã; suy tầm ta không là của ai, của ta không có gì ở đâu. Hành đạo đưa đến phi tưởng phi phi tưởng xứ cũng suy tầm tương tự trên các tưởng về bất động, vô sở hữu xứ. Với mỗi hành đạo, tâm được tin tưởng nơi xứ ấy; vị ấy hoặc chứng nhập ngay trong hiện tại, hoặc thiên về trí tuệ, hoặc sau khi thân hoại thức có thể đến xứ ấy.

  Tôn giả Ānanda hỏi về vị tỳ-kheo hành trì không có và không phải của ta, sẽ không có và sẽ không phải của ta, từ bỏ cái gì có mặt, chứng được xả; có nhập diệt độ chăng. Vị ưa thích, chấp mắc, trụ vào xả ấy thì thức thủ nơi ấy, không nhập diệt độ, mà chấp thủ Thủ Tối Thượng, tức phi tưởng phi phi tưởng xứ; vị không ưa thích, không trụ vào xả ấy thì thức không thủ nơi ấy, nên nhập diệt độ.

  Ānanda thán phục vì Đức Phật dạy vượt dòng lũ bằng cách nương tựa chỗ này chỗ kia, và hỏi Thánh giải thoát là gì. Đức Phật đáp: bậc Thánh đệ tử suy tầm các dục, các sắc, các tưởng về bất động, vô sở hữu xứ, phi tưởng phi phi tưởng xứ đều là thân kiến chừng nào còn thân kiến; bất tử là giải thoát tâm không chấp thủ.

  Toàn bài xếp các hành đạo theo bậc từ bất động lên vô sở hữu xứ, phi tưởng phi phi tưởng xứ, nhưng điểm dừng là Thánh giải thoát: các xứ cao đến đâu vẫn là tưởng, có thể thành chỗ chấp thủ; chỉ giải thoát tâm không chấp thủ mới là bất tử.
