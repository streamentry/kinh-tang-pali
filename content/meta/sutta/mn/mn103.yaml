summary: |-
  Kinh Nghĩ Như Thế Nào ghi lời Đức Phật dạy tại Kusinārā, khu rừng Baliharaṇa. Đức Phật hỏi các tỳ-kheo có nghĩ Ngài thuyết pháp vì y áo, đồ ăn khất thực, chỗ nghỉ ngơi hay vì sự tái sinh kiểu này kiểu kia; các tỳ-kheo phủ nhận và trả lời: Thế Tôn là bậc từ mẫn, mong muốn lợi ích, thuyết pháp xuất phát từ lòng từ mẫn.

  Đức Phật nhắc lại những gì Ngài đã dạy sau khi thắng tri: bốn niệm xứ, bốn chánh cần, bốn như ý túc, năm căn, năm lực, bảy giác chi, Thánh đạo tám ngành, tất cả cần được học tập trong hòa hợp, quý mến, không tranh luận. Khi hai vị tỳ-kheo khác nhau về Pháp, kinh xử lý bốn trường hợp: khác cả nghĩa lẫn văn, khác nghĩa cùng văn, cùng nghĩa khác văn, cùng cả hai. Với mỗi trường hợp, người ta đến gặp vị dễ khuyên nhất của mỗi phe, trình bày đúng tình trạng, xin chớ khởi tranh cãi; cùng nghĩa khác văn thì văn chỉ là việc nhỏ nhặt; rồi hãy nói đến Pháp và Luật, ghi nhớ điều sai là sai, điều đúng là đúng.

  Khi một tỳ-kheo có tội hoặc vi phạm, chớ vội trách cứ, cần quan sát cá nhân ấy. Nếu nói ra không phiền toái cho ta, không tổn hại người kia, và có thể đưa người ấy ra khỏi bất thiện, lập vào thiện, thì nên nói. Ở các trường hợp còn lại, ta phiền toái hay người kia tổn hại là chuyện nhỏ so với việc đưa người ấy ra khỏi bất thiện; riêng trường hợp vừa phiền toái vừa tổn hại mà không giúp được gì, chớ xem thường sự xả.

  Khi trong Tăng đoàn phát sinh lôi chuyện cũ, hiềm khích về kiến, giận dữ, người ta đến hỏi vị dễ khuyên nhất của mỗi phe: nếu vị sa-môn biết rõ điều ấy, Ngài có quở trách không, và không từ bỏ pháp ấy liệu có thể chứng ngộ Niết-bàn. Trả lời đúng là Ngài sẽ quở trách, và không từ bỏ pháp ấy thì không thể chứng ngộ Niết-bàn. Nếu người khác hỏi có đưa các tỳ-kheo ấy ra khỏi bất thiện không, trả lời đúng là mình đã đến nghe Pháp từ Đức Thế Tôn rồi nói lại cho họ; họ nghe xong đã vượt lên khỏi bất thiện, an lập vào thiện.

  Trả lời như vậy, vị ấy không tự đề cao, không chê bai người khác, không rơi vào chỗ đáng bị chỉ trích chính đáng. Toàn bài hướng về điều kinh lặp lại nhiều lần: học tập trong hòa hợp, quý mến nhau, không tranh luận.

notes: |-
  **Lượt cải thiện 2026-10-13 (kiểm toán mẫu, đọc đối kháng 128 khoá Pāli↔Việt).**
  Đã đo tiền lệ trên toàn tầng bằng số đếm rồi sửa 39/128 khoá so với bản trước lượt này.

  *Sửa theo tiền lệ (terminology, grammar_logic):*
  - `1.5` "Thưa Ngài" → "Bạch Thế Tôn": `Bhadante”ti te bhikkhū bhagavato paccassosuṁ` có 103 nơi, 91 nơi mở bằng "Bạch Thế Tôn", "Thưa Ngài" chỉ 2.
  - `2.2`, `2.4`, `2.7` "sự tái sinh kiểu này kiểu kia" → "sự trở thành cái này hay cái kia" (`itibhavābhavahetu`: khớp an3.40, an4.9; "tái sinh" hẹp hơn `bhava`); `senāsana` "chỗ nghỉ ngơi" → "chỗ ở" (292/378 nơi).
  - `3.2`, `4.1`, `9.1`, `15.1`–`16.4` công thức `samaggā sammodamānā avivadamānā`: "quý mến nhau, không tranh luận" → "vui vẻ với nhau, không tranh cãi" (đa số: 20/25 nơi có cặp này dùng "vui vẻ…", và 21/25 nơi dùng "không tranh cãi" thay vì "không tranh luận"; dn29:18.1 trùng nguyên công thức).
  - `15.1`, `15.3`, `15.5`, `16.2`, `16.4` `appaccayo`: "không thuận hòa" → "cay cú", và `anabhiraddhi` = "bất mãn", theo mn22:37.6 / mn22:39.1 (`āghāto appaccayo anabhiraddhi` → "…, cay cú hay bất mãn").
  - `6.x`, `7.x`, `8.x` (`atthato … byañjanato sameti`): "cùng về văn", "cùng nhau cả về nghĩa lẫn về văn" (câu cụt/sai ngữ pháp) → "giống nhau về …"; `sameti` = hợp, khớp (dn8:4.2 "đồng ý"), khớp Sujato "agree".
  - `4.1` `abhidhamme` "về Pháp" → "về Thắng Pháp": mất tiền tố `abhi-`; tầng dịch `abhidhamme abhivinaye` → "Thắng Pháp" 9/18 nơi, "Vi pháp" 6/18 nơi (cả hai giữ `abhi-`).
  - `10.2`, `11.2`, `12.2`, `13.2`, `14.2` `kodhano upanāhī`: "có sân, có hận" → "hay sân giận, ôm lòng oán hận" (dn25:12.3, 15.3 trùng cặp; "sân giận" 9, "dễ nổi giận" 9, "có sân" 2). Tránh lẫn `kodha` với `dosa`.
  - `5.13`, `6.13`, `7.15`, `8.13` `yo dhammo yo vinayo so bhāsitabbo`: "hãy nói đến Pháp và Luật" làm mất cấu trúc tương quan; nay "điều nào là Pháp, điều nào là Luật, điều ấy cần được nói ra" (dạng gerundive như `5.12` "cần được ghi nhớ").
  - `2.3`, `2.9` "Bạch Thế Tôn, chúng con … về Ngài": lời thưa với Đức Phật, đồng bộ "Bạch Thế Tôn".
  - `17.6` `na ca koci sahadhammiko vādānuvādo gārayhaṁ ṭhānaṁ āgacchati`: nay "không tạo cơ sở chính đáng nào cho lời bác bỏ hay chỉ trích" (đúng công thức dn28:19.21–22), thay cho câu cũ lẫn chủ thể của `āgacchati`.
  Điểm đổi: terminology 9.2 → 9.4 (từ ~10 chỗ lệch tiền lệ nay đã khớp); vietnamese_clarity 9 → 9.1 ("giống nhau", "chỗ ở", bỏ câu cụt); ambiguity_integrity 9.2 → 9 (bản trước không ghi bất định nào, xem dưới).

  *Bất định còn lại (không phân xử được, giữ nguyên trong notes):*
  - `vacīsaṁhāro` (`15.1`, `15.3`, `15.5`, `16.2`, `16.4`): từ chỉ có đúng ở mn103 trong tầng Pāli đã ghim (hapax; `an2.63` có dạng khác `vacīsaṁsāro`). Bản Anh Sujato hiểu là "lôi lại chuyện cũ", bản Việt nguyên bài ở mục Tra cứu toàn văn hiểu là "khẩu hành". Bản trước đã viết "lôi lại chuyện cũ", thêm nội dung "chuyện cũ" mà Pāli không nói rõ; nay dịch trung tính "chuyện lời qua tiếng lại với nhau" (`aññamaññassa` = với nhau). Chưa kiểm chứng được nghĩa chính xác bằng từ điển hay song song.
  - `5.13` v.v. `so bhāsitabbo`: có thể hiểu "điều ấy cần được nói/tuyên thuyết" hoặc "hãy nói về Pháp và Luật"; giữ cách đọc sát ngữ pháp tương quan.
  - `17.4` `āvuso` (số ít) → "Này các Hiền giả": số nhiều theo người hỏi `pare`, trong khi `15.3` dùng "Này Hiền giả". Giữ nguyên vì đối tượng ở đó khác nhau.
  - `15.5` / `15.6`: dấu nháy mở ở `15.5` đóng ở `15.6` theo đúng dấu Pāli từng khoá; ai nói câu hỏi thứ hai ở `15.6` (người hỏi hay người đáp) không được Pāli làm rõ, đã theo cách hiểu của Sujato (người hỏi tiếp).

  *Lỗi có thể lan sang bài khác:* mn104:5.2 cũng dùng `abhiññā desitā`; công thức `sammodamānā avivadamānā` ở nhiều bài khác còn bản "hài hòa/hòa hợp, vui vẻ, không tranh cãi" (không sai nghĩa); `kodhano upanāhī` còn dạng "có sân" ở 2 nơi ngoài bài này.

  Kỹ thuật: `technical_integrity` giữ 9.5; chưa chạy lại `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này (kiểm tra cục bộ: 128/128 khoá, thứ tự và tập khoá khớp Pāli, nháy/dấu lược khớp từng khoá, 96 cặp Pāli trùng trong bài đều có bản Việt giống nhau, NFC).
