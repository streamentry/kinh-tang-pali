summary: |-
  Kinh Nghĩ Như Thế Nào ghi lời Đức Phật dạy tại Kusinārā, khu rừng Baliharaṇa. Đức Phật hỏi các tỳ-kheo có nghĩ Ngài thuyết pháp vì y áo, đồ ăn khất thực, chỗ nghỉ ngơi hay vì sự tái sinh kiểu này kiểu kia; các tỳ-kheo phủ nhận và trả lời: Thế Tôn là bậc từ mẫn, mong muốn lợi ích, thuyết pháp xuất phát từ lòng từ mẫn.

  Đức Phật nhắc lại những gì Ngài đã dạy sau khi thắng tri: bốn niệm xứ, bốn chánh cần, bốn như ý túc, năm căn, năm lực, bảy giác chi, Thánh đạo tám ngành, tất cả cần được học tập trong hòa hợp, quý mến, không tranh luận. Khi hai vị tỳ-kheo khác nhau về Pháp, kinh xử lý bốn trường hợp: khác cả nghĩa lẫn văn, khác nghĩa cùng văn, cùng nghĩa khác văn, cùng cả hai. Với mỗi trường hợp, người ta đến gặp vị dễ khuyên nhất của mỗi phe, trình bày đúng tình trạng, xin chớ khởi tranh cãi; cùng nghĩa khác văn thì văn chỉ là việc nhỏ nhặt; rồi hãy nói đến Pháp và Luật, ghi nhớ điều sai là sai, điều đúng là đúng.

  Khi một tỳ-kheo có tội hoặc vi phạm, chớ vội trách cứ, cần quan sát cá nhân ấy. Nếu nói ra không phiền toái cho ta, không tổn hại người kia, và có thể đưa người ấy ra khỏi bất thiện, lập vào thiện, thì nên nói. Ở các trường hợp còn lại, ta phiền toái hay người kia tổn hại là chuyện nhỏ so với việc đưa người ấy ra khỏi bất thiện; riêng trường hợp vừa phiền toái vừa tổn hại mà không giúp được gì, chớ xem thường sự xả.

  Khi trong Tăng đoàn phát sinh lôi chuyện cũ, hiềm khích về kiến, giận dữ, người ta đến hỏi vị dễ khuyên nhất của mỗi phe: nếu vị sa-môn biết rõ điều ấy, Ngài có quở trách không, và không từ bỏ pháp ấy liệu có thể chứng ngộ Niết-bàn. Trả lời đúng là Ngài sẽ quở trách, và không từ bỏ pháp ấy thì không thể chứng ngộ Niết-bàn. Nếu người khác hỏi có đưa các tỳ-kheo ấy ra khỏi bất thiện không, trả lời đúng là mình đã đến nghe Pháp từ Đức Thế Tôn rồi nói lại cho họ; họ nghe xong đã vượt lên khỏi bất thiện, an lập vào thiện.

  Trả lời như vậy, vị ấy không tự đề cao, không chê bai người khác, không rơi vào chỗ đáng bị chỉ trích chính đáng. Toàn bài hướng về điều kinh lặp lại nhiều lần: học tập trong hòa hợp, quý mến nhau, không tranh luận.
