summary: |-
  Một thời Đức Phật ở Sāvatthī, tại Kỳ Viên, Ngài gọi các tỳ-kheo và nêu bốn cách thực hành: dễ chịu trong hiện tại nhưng về sau cho quả khổ; đau khổ trong hiện tại và về sau cũng cho quả khổ; đau khổ trong hiện tại nhưng về sau cho quả lạc; và dễ chịu trong hiện tại, về sau cũng cho quả lạc.

  Cách thứ nhất: một số sa-môn, bà-la-môn chủ trương các dục chẳng có gì tai hại, đắm mình trong các dục, vui thú với những nữ du sĩ búi tóc và bảo rằng sự chạm vào cánh tay mềm mại phủ lông tơ thật dễ chịu; sau khi mạng chung họ tái sinh vào cảnh giới khổ, địa ngục, cảm nhận những cảm thọ đau đớn, dữ dội, rồi nhận ra chính vì các dục mà mình chịu khổ. Kinh ví như hạt māluvā rơi xuống gốc cây sāla: vị thần trú cây sợ hãi nhưng bạn bè trấn an; hạt nảy mầm thành dây leo non, mềm, phủ lông tơ, sự chạm vào thật dễ chịu, rồi dây quấn quanh cây, tạo tán phía trên, buông màn rậm và làm nứt toác những cành lớn; vị thần nhận ra chính vì hạt ấy mà nay chịu cảm thọ đau đớn, nhức buốt.

  Cách thứ hai là người sống lõa thể, bỏ qua quy ước thông thường, liếm tay, từ chối đủ kiểu thức ăn và lời mời, ăn theo kỳ hạn, ăn rau và thức ăn thô kém, mặc vải gai, vỏ cây hay giẻ rách, nhổ tóc râu, luôn đứng, ngồi xổm, nằm giường gai và tắm ba lần mỗi ngày; chuyên thực hành nhiều cách hành xác, khi thân hoại mạng chung tái sinh vào cảnh giới khổ, địa ngục.

  Cách thứ ba: người vốn có tính tham, sân, si rất mạnh, thường xuyên chịu khổ đau và buồn phiền do chúng sinh; dù khổ đau, buồn phiền, nước mắt đầy mặt và khóc lóc, người ấy vẫn sống đời phạm hạnh trọn vẹn và thanh tịnh, rồi sau khi mạng chung tái sinh vào cảnh giới tốt, cõi trời. Cách thứ tư: người vốn không có tính tham, sân, si quá mạnh, không thường xuyên chịu khổ đau và buồn phiền do chúng sinh; ly các dục, ly các pháp bất thiện, vị ấy chứng và an trú từ thiền thứ nhất cho tới thiền thứ tư, rồi sau khi mạng chung tái sinh vào cảnh giới tốt, cõi trời.

  Bốn cách được phân định bằng hiện tại lẫn quả về sau; kinh nhấn mạnh cách thứ tư, dễ chịu hiện tại nhờ chứng bốn thiền và về sau cho quả lạc, đối lại với cách đắm dục tuy dễ chịu mà quả khổ.
