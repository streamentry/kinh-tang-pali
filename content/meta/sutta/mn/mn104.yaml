summary: |-
  Kinh Sāmagāma ghi lại khi Đức Phật trú ở xứ Sakiya, thị trấn Sāmagāma, sau khi Nigaṇṭha Nāṭaputta qua đời tại Pāvā. Đám Nigaṇṭha chia rẽ thành hai phe, cãi vã, đâm chọc nhau bằng lời như giáo nhọn; đệ tử tại gia chán ngán, lạnh nhạt, quay lưng, vì đó là pháp và luật giảng dạy dở, không đưa đến an tịnh. Sa-di Cunda thuật chuyện cho Tôn giả Ānanda; Ānanda trình lên Đức Phật, mong sau khi Đức Phật qua đời không có tranh luận trong Tăng đưa đến bất lợi, bất hạnh cho đa số.

  Đức Phật hỏi Ānanda có thấy tỳ-kheo nào khác ý kiến về những pháp Ngài đã dạy không; Ānanda thưa không, nhưng lo những kẻ sống bề ngoài như vâng lời sẽ tranh luận về sinh sống hay giới bổn. Tranh luận về sinh sống hay giới bổn là việc nhỏ nhặt; tranh luận về đạo hay hạnh mới nguy hại. Sáu gốc tranh luận: sân giận, oán hận; xúc phạm, khinh miệt; ganh tị, bỏn xẻn; gian trá, dối gạt; ác dục, tà kiến; chấp mắc trong kiến. Mỗi gốc khiến vị tỳ-kheo thiếu cung kính, tôn trọng, khởi tranh luận trong Tăng; thấy nơi mình hay nơi người thì nỗ lực từ bỏ, không thấy thì thực hành cho không tái hiện về sau.

  Bốn tránh sự là tranh luận, trách móc, tội lỗi, công việc; bảy cách dàn xếp: phán quyết hiện tiền, đa số, ức niệm, bất si, thừa nhận, nặng hơn, che rơm. Với hiện tiền hay đa số, hai phe họp hòa hợp, xét đường lối Pháp rồi làm lắng dịu như sự thuận hợp; ức niệm cho vị không nhớ tội nặng; bất si cho vị phạm khi tâm loạn; che rơm là hai phe cùng đưa tội của nhau và của mình ra giữa Tăng, trừ trọng tội và chuyện với người tại gia.

  Đức Phật nêu sáu pháp đáng ghi nhớ tạo nên thương mến, hòa hợp, không tranh chấp, nhất trí: thân hành, khẩu hành, ý hành đầy lòng từ với người đồng phạm hạnh; dùng chung lợi dưỡng chân chánh có được đúng Pháp; cùng chung giới không sứt mẻ; và cùng chung kiến Thánh dẫn đến chấm dứt khổ. Hành trì sáu pháp ấy, không còn lời nào dù nhỏ hay thô mà không kham nhẫn chịu đựng; điều ấy đưa đến an lạc, hạnh phúc lâu dài.

  Toàn bài đặt cạnh một tôn phái tan vỡ thành tranh chấp sau khi đạo sư qua đời, và những điều giữ hòa hợp trong Tăng: gốc tranh luận được từ bỏ, tránh sự được dàn xếp đúng phép, sáu pháp làm nền.

notes: |-
  **Lượt cải thiện 2026-10-14 (đọc đối kháng 166 khoá Pāli↔Việt).**
  Bản trước chưa có mục ghi chú nào; lượt này đo tiền lệ trên toàn tầng bằng số đếm rồi sửa 37/166 khoá (chỉ ghi nội dung dịch, không đổi khoá hay thứ tự).

  *Sửa nghĩa (semantic_fidelity, grammar_logic):*
  - `4.11`, `5.7`, `5.9`, `6.5`, `7-11.7` công thức `bahujanāhitāya bahujanāsukhāya bahuno janassa anatthāya ahitāya dukkhāya devamanussānaṁ`: "bất an cho đa số … thất lợi … bất an và đau khổ" → "bất lợi cho đa số, bất hạnh cho đa số, thiệt hại cho đa số, bất lợi và đau khổ …". `ahita` là "không lợi ích", không phải "không yên"; 12/12 khoá khác có `bahujanāhitāya`/`bahujanaahitāya` (dn33, an6.36, an1.316, an1.319, an3.11, an5.88, iti18) đều dịch `ahita` là "bất lợi" hoặc "không lợi ích"; `anatthāya` dùng "thiệt hại/tổn hại" ở dn33, an6.36, an1.316, an5.88.
  - `5.2`, `5.4` `abhiññā desitā`: "với thắng tri" → "sau khi thắng tri" (`abhiññā` là bất biến quá khứ; khớp mn103:3.1; dn16 "sau khi tự mình giác ngộ", dn29:17 "đã trực tiếp chứng biết rồi giảng dạy").
  - `2.2` `mukhasattīhi`: "gai nhọn" → "giáo nhọn" (`sattī` là giáo, dao; dn33:1.6.2 trùng đúng đoạn này dùng "giáo nhọn"); `vitudantā` "làm tổn thương" → "đâm chọc" (dn33, an3.95, an3.124, an10.50).
  - `2.4` `Vadhoyeva kho maññe`: "Người ta nghĩ rằng … chẳng có gì khác hơn sự tàn sát lẫn nhau" → "Dường như … chỉ còn sự tàn sát." (`maññe` là "dường như" của người kể, không phải ý nghĩ của "người ta"; bỏ "lẫn nhau" vì Pāli không có).
  - `5.3`, `5.5` `dvepi bhikkhū nānāvāde`: "hai vị … nào" → "dù chỉ hai vị" (`pi` giữ phạm vi "dù chỉ hai").
  - `5.6`, `6.5`, `7-11.7` `janeyyuṁ/janeti`: "khởi lên tranh luận" → "gây ra tranh luận" (động từ gây khiến, dn33/an6.36 dùng "gây ra").
  - `19.16` `So evamāha` do người truy hỏi nói (khớp `19.6`, `19.11` "Người kia"): "Vị ấy nói" → "Người kia nói", tránh lẫn với người bị hỏi ở `19.13`, `19.19`.

  *Sửa thuật ngữ theo tiền lệ (terminology, han_viet_balance):*
  - `6.3`, `6.4` `kodhano upanāhī`: "có sân, có hận" → "hay sân giận, ôm lòng oán hận" (dn25:12.3/12.4 và mn103:10.2 cùng dạng; "có sân" chỉ còn mn104, 2 khoá). Tránh lẫn `kodha` với `dosa`.
  - `7-11.1` `makkhī paḷāsī`: "có khinh mạn, có đố kỵ" → "hay xúc phạm, hay khinh miệt" (dn25:12.6, dn33:2.2.57, mn15:3.35/3.36 = 4 khoá, 3 bài; "khinh mạn" là `māna`); `7-11.2` `issukī maccharī` "ganh ghét" → "ganh tị" (mn15 ×2, an6.36:2.2, mnd10:60.8).
  - `2.2`, `20.2`, `20.6`, `20.10` `bhaṇḍanajāta`: "sinh lời lẽ bất hòa" → "sinh tranh chấp" (an3.95, an3.124, an10.50, ud6.x, ≥ 10 khoá; "lời lẽ" là thêm nghĩa); ở `20.x` "sống với … " → "đang sinh …" cho trôi câu.
  - `2.5` `nibbinnarūpā virattarūpā paṭivānarūpā`: "chán ghét, ghét bỏ và quay lưng" → "chán ngán, lạnh nhạt và quay lưng" (an7.61:10.6 `virattarūpā` = "lạnh nhạt"; dn33:1.6.5 "chán ngán"); bỏ chữ "ghét" lặp hai lần.
  - `4.6`, `4.9`, `5.4`, `5.6` `bhante` thưa Đức Phật: "Thưa Ngài" → "Bạch Thế Tôn" (đo trên mn+dn: 1.186 khoá có `bhante` dùng "Bạch Thế Tôn", chỉ 10 dùng "Thưa Ngài"; `22.2` trong bài đã dùng "bạch Thế Tôn"); `4.7` Cunda thưa Ānanda: "Thưa Ngài" → "Thưa Tôn giả" cho khớp `3.2` (Pāli trùng nguyên văn).
  - `6.7`, `6.8`, `7-11.9`, `7-11.10` `āyatiṁ anavassava`: "không lưu rơi" → "không tái hiện" (dn33:2.2.55/56/65/66; an6.36 dùng "không khởi lên"; "lưu rơi" chỉ có ở mn104, tối nghĩa).
  - `6.6`, `6.7`, `7-11.8`, `7-11.9`: "như vậy này" → "như vậy"; `ajjhattaṁ vā bahiddhā vā` "ở nội tâm" → "ở trong mình" (dn33:2.2.55/65).
  - `18.3` `ukkuṭikaṁ nisīditvā`: "ngồi ghé gối" → "ngồi xổm" (14/14 khoá khác có `ukkuṭika` dùng "ngồi xổm"); `vuḍḍhataraṁ` "thượng tọa hơn" → "có tuổi hạ lớn hơn" (so sánh của một chức danh là câu gượng).
  - `17.6`, `19.6`, `19.11` `nibbeṭhentaṁ`: "đang tìm cách thoát ly" → "đang tìm cách gỡ mình ra" ("thoát ly" dễ đọc thành xuất gia/xuất ly).
  - `21.11`, `21.13` `sīlasāmaññagato`, `diṭṭhisāmaññagato`: "sống hòa đồng trong …" → "sống cùng chung giới / chung kiến" (mn48:6.12/6.14, dn33:2.2.46/48, dn34:1.7.9 dùng "cùng chung").
  - `22.4` `dīgharattaṁ hitāya sukhāya`: "an lạc và hạnh phúc" → "lợi ích và hạnh phúc" (67 khoá dùng "lợi ích và hạnh phúc lâu dài", 1 khoá "an lạc và hạnh phúc" là mn104; `hita` ≠ `sukha`).
  `summary` đã sửa các cụm tương ứng cho khớp (giáo nhọn; chán ngán, lạnh nhạt; bất lợi; sáu gốc; không tái hiện; cùng chung giới/kiến).

  Điểm đổi: semantic_fidelity 9.2 → 9.3 (nghĩa `ahita`/`anattha`, `abhiññā`, `sattī`, `maññe`); grammar_logic 9.2 → 9.3 (người nói `19.16`, phạm vi `dvepi`, nhân vật gây khiến); terminology 9.1 → 9.3 (khoảng 12 thuật ngữ nay khớp tiền lệ); vietnamese_clarity 9 → 9.2 (bỏ "như vậy này", "lưu rơi", "thoát ly", "ngồi ghé gối"); han_viet_balance 9.1 → 9.2; ambiguity_integrity 9.1 → 9 (bản trước không ghi bất định nào, xem dưới). Các tiêu chí khác giữ nguyên.

  *Bất định còn lại (không phân xử được, giữ nguyên):*
  - `19.21` `Davā me etaṁ vuttaṁ, ravā me etaṁ vuttaṁ`: giữ "một cách vội vàng, một cách hấp tấp" theo Sujato ("hastily"); `davā` có thể là "đùa cợt", chỉ có một khoá trong tầng đã ghim, không song song để phân xử.
  - `19.23` `tassapāpiyasikā` "phán quyết nặng hơn" (dn33:2.3.50 "trừng phạt thêm", Sujato "further penalty"); thuật ngữ Luật tạng chưa xác minh được từ nguồn đã ghim.
  - `5.6`, `5.8` `ajjhājīve … adhipātimokkhe`: "về cách sinh sống … về giới bổn", tiền tố `adhi-` không dịch riêng; không có song song trong tầng.
  - `22.1` `vacanapathaṁ aṇuṁ vā thūlaṁ vā`: giữ sát chữ "con đường lời nói … nhỏ hay lớn"; Sujato hiểu là lời chỉ trích, không có song song để quyết.
  - `20.4`, `20.8` `byattena bhikkhunā` "khéo léo" (Sujato "competent"): nghĩa "có năng lực/thạo Luật" chưa phân xử.
  - `6.6` `ajjhattaṁ vā bahiddhā vā`: "ở trong mình hay ở bên ngoài" theo dn33; Pāli có thể hiểu "trong chính mình" hoặc "trong người khác", giữ cách nói trung tính.
  - `21.1`, `21.4`… `avivādāya` "không tranh chấp" còn lệch với `vivāda` "tranh luận" trong cùng bài; giữ theo mn48:6.2/6.16 (Pāli trùng nguyên văn, cùng bản Việt). Không sai nghĩa nhưng chưa thống nhất; đổi thì phải đổi cả mn48.
  - `21.4` so với `21.6`, `21.8`, `21.10`, `21.12`, `21.14` (Pāli trùng `Ayampi dhammo …`): khoá đầu "Đây là", các khoá sau "Đây cũng là"; cố ý, theo mn48:6.5 / 6.9 và Sujato.

  *Lỗi có thể lan sang bài khác:* mn128:2.1, 3.2 dịch `mukhasattīhi` "nhọn gai" (cùng lỗi "gai"); mn15, dn33, an6.36 dùng nhiều thuật ngữ khác nhau cho cùng danh sách `makkhī paḷāsī` (không sai nghĩa).

  Kỹ thuật: `technical_integrity` giữ 9.5; chưa chạy lại `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này (kiểm tra cục bộ: 166/166 khoá, thứ tự và tập khoá khớp Pāli, nháy kép/đơn khớp Pāli từng khoá, dấu lược khớp, 19 cặp Pāli trùng trong bài chỉ 5 cặp khác mà đã nêu, NFC, không Pāli lọt sang Việt ngoài tên riêng).
