summary: |-
  Kinh Sāmagāma ghi lại khi Đức Phật trú ở xứ Sakiya, thị trấn Sāmagāma, sau khi Nigaṇṭha Nāṭaputta qua đời tại Pāvā. Đám Nigaṇṭha chia rẽ thành hai phe, cãi vã, tổn thương nhau bằng lời như gai nhọn; đệ tử tại gia chán ghét quay lưng, vì đó là pháp và luật giảng dạy dở, không đưa đến an tịnh. Sa-di Cunda thuật chuyện cho Tôn giả Ānanda; Ānanda trình lên Đức Phật, mong sau khi Đức Phật qua đời không có tranh luận trong Tăng đưa đến bất an, bất hạnh cho đa số.

  Đức Phật hỏi Ānanda có thấy tỳ-kheo nào khác ý kiến về những pháp Ngài đã dạy không; Ānanda thưa không, nhưng lo những kẻ sống bề ngoài như vâng lời sẽ tranh luận về sinh sống hay giới bổn. Tranh luận về sinh sống hay giới bổn là việc nhỏ nhặt; tranh luận về đạo hay hạnh mới nguy hại. Sáu gốc tranh luận: sân hận; khinh mạn, đố kỵ; ganh ghét, bỏn xẻn; gian trá, dối gạt; ác dục, tà kiến; chấp mắc trong kiến. Mỗi gốc khiến vị tỳ-kheo thiếu cung kính, tôn trọng, khởi tranh luận trong Tăng; thấy nơi mình hay nơi người thì nỗ lực từ bỏ, không thấy thì thực hành cho không lưu rơi về sau.

  Bốn tránh sự là tranh luận, trách móc, tội lỗi, công việc; bảy cách dàn xếp: phán quyết hiện tiền, đa số, ức niệm, bất si, thừa nhận, nặng hơn, che rơm. Với hiện tiền hay đa số, hai phe họp hòa hợp, xét đường lối Pháp rồi làm lắng dịu như sự thuận hợp; ức niệm cho vị không nhớ tội nặng; bất si cho vị phạm khi tâm loạn; che rơm là hai phe cùng đưa tội của nhau và của mình ra giữa Tăng, trừ trọng tội và chuyện với người tại gia.

  Đức Phật nêu sáu pháp đáng ghi nhớ tạo nên thương mến, hòa hợp, không tranh chấp, nhất trí: thân hành, khẩu hành, ý hành đầy lòng từ với người đồng phạm hạnh; dùng chung lợi dưỡng chân chánh có được đúng Pháp; hòa đồng trong giới không sứt mẻ; và hòa đồng trong kiến Thánh dẫn đến chấm dứt khổ. Hành trì sáu pháp ấy, không còn lời nào dù nhỏ hay thô mà không kham nhẫn chịu đựng; điều ấy đưa đến an lạc, hạnh phúc lâu dài.

  Toàn bài đặt cạnh một tôn phái tan vỡ thành tranh chấp sau khi đạo sư qua đời, và những điều giữ hòa hợp trong Tăng: gốc tranh luận được từ bỏ, tránh sự được dàn xếp đúng phép, sáu pháp làm nền.
