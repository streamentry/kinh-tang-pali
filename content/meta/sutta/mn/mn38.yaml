summary: |-
  Kinh kể một thời Đức Phật ở Sāvatthī, tại rừng Jeta, tỳ-kheo Sāti con người đánh cá khởi tà kiến rằng theo y hiểu Đức Phật dạy chính thức này, không phải một thức khác, chạy đi và luân chuyển qua các đời. Các tỳ-kheo khuyên bảo rằng thức do duyên sinh, không duyên thì thức không sinh, nhưng Sāti khăng khăng nên việc được trình lên Đức Phật; được chất vấn, y giải thích thức ấy là cái nói, cái cảm nhận, cái trải nghiệm quả của nghiệp thiện ác, và bị quở trách vì nắm sai lời dạy, xuyên tạc Ngài.

  Đức Phật giảng thức sinh do duyên nào thì được gọi tên theo duyên ấy, như lửa gọi theo vật đang cháy. Kinh nêu bốn loại thức ăn, đoàn thực, xúc, ý tư và thức, truy ngược nguồn sinh của chúng qua ái, thọ, xúc, sáu xứ, danh-sắc, thức, hành cho tới vô minh, rồi chỉ ra chuỗi khởi lên từ vô minh cho tới già-chết cùng sầu bi khổ ưu não là toàn bộ khối khổ; phần đoạn diệt cũng được trình bày và xác nhận theo từng cặp duyên. Kiến dù trong sạch sáng rõ cũng không bám lấy, như ví Pháp chiếc bè dùng để vượt qua chứ không phải để nắm giữ.

  Khi biết thấy như vậy, các tỳ-kheo không còn suy đoán về tự ngã quá khứ, tương lai hay hiện tại, không nhận bậc thầy khác, không coi giới cấm nghi lễ là cốt lõi, chỉ nói điều mình đã biết đã thấy.

  Kinh tả sự thụ thai khi ba điều hội đủ: cha mẹ giao hợp, người mẹ ở thời kỳ thụ thai, gandhabba hiện diện; người mẹ mang nặng chín mười tháng với nhiều rủi ro. Trẻ lớn rồi vui hưởng năm dục; gặp sắc đáng ưa thì tham thích, không đáng ưa thì chống đối, niệm về thân chưa thiết lập và tâm hạn hẹp, rồi hoan hỷ bám chặt vào cảm thọ; sự thích thú đối với cảm thọ chính là thủ, từ đó toàn bộ khối khổ sinh khởi, lặp lại cho sáu cửa.

  Khi một Như Lai xuất hiện thuyết Pháp, người nghe rời nhà xuất gia: giữ giới, biết đủ, hộ trì các căn, sống niệm tỉnh giác, từ bỏ năm triền cái, nhập bốn thiền. Gặp sắc đáng ưa vị không tham thích, không đáng ưa không chống đối, niệm về thân đã thiết lập, tâm rộng lớn; không bám chặt vào cảm thọ nên sự thích thú, thủ, hữu, sinh và toàn bộ khối khổ đoạn diệt, lặp lại cho sáu cửa. Kinh kết: hãy ghi nhớ lời dạy tóm tắt về giải thoát nhờ đoạn tận ái, vì Sāti đang mắc trong tấm lưới lớn của ái.
