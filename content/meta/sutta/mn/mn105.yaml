summary: |-
  Kinh Sunakkhatta mở ra tại Vesālī, khu rừng Lớn, giảng đường mái nhọn. Nhiều vị tỳ-kheo tuyên bố thắng trí trước Đức Phật: sinh đã tận, phạm hạnh hoàn thành, việc cần làm đã làm, không còn trở lại hiện hữu này. Sunakkhatta Licchaviputta hỏi ai tuyên bố đúng đắn, ai do tăng thượng mạn. Đức Phật đáp có cả hai; với các vị tuyên bố sai, Như Lai nghĩ sẽ giảng Pháp, nhưng những kẻ ngu si soạn sẵn câu hỏi đến hỏi.

  Sau khi giảng năm dục công đức, Đức Phật dạy nhận biết trình độ qua điều người muốn nghe: mỗi bậc chỉ thân cận chuyện tương ứng, không nghe chuyện tầng liền kề. Người hướng về vật chất thế tục không nghe chuyện bất động. Người hướng về bất động, kiết sử về vật chất thế tục đã rơi như lá rụng cuống. Người hướng về vô sở hữu xứ, kiết sử về bất động đã bẻ gãy như tảng đá làm đôi. Người hướng về phi tưởng phi phi tưởng xứ, như người đã nôn món ngon. Người chánh hướng về Niết-bàn, kiết sử đã cắt tận gốc như cây tala bị chặt ngọn.

  Có tỳ-kheo tự nghĩ mũi tên ái đã từ bỏ, độc vô minh đã đem đi, nên chánh hướng về Niết-bàn, nhưng đó là mạn, dù không có sự thực. Vị ấy theo đuổi điều không tương ứng ở sáu căn, tham xâm lấn tâm, đi đến cái chết hoặc khổ đau gần chết: cái chết là từ bỏ học pháp trở lại đời thấp, khổ đau gần chết là phạm tội cấu uế. Ví dụ là người trúng mũi tên tẩm độc, độc còn sót chút dư; vì xem nhẹ lời dặn, vết thương sưng to, dẫn đến chết. Ngược lại, tỳ-kheo với niệm chánh hướng về Niết-bàn không theo đuổi điều không tương ứng; tham không xâm lấn tâm, như người trúng tên mà độc được lấy sạch, vết thương lành.

  Đức Phật giải nghĩa: vết thương là sáu nội xứ, chất độc là vô minh, mũi tên là ái, ống dò là niệm, con dao là trí tuệ, thầy thuốc là Như Lai. Vị tỳ-kheo ấy thực hành chế ngự ở sáu xúc xứ; biết thủ là gốc khổ, vị ấy giải thoát do diệt tận các thủ. Hai ví dụ cuối: người muốn sống không uống chén nước pha độc, không đưa tay cho rắn độc.

  Toàn bài xoay quanh sự khác biệt kinh thiết lập: tự tuyên bố thắng trí chỉ bằng mạn thì tham vẫn còn đường xâm lấn; người chế ngự sáu xúc xứ, với niệm và thánh trí tuệ rút mũi tên ái, mới thật sự chánh hướng về Niết-bàn.
