summary: |-
  Jānussoṇi gặp du sĩ Pilotika vừa từ chỗ sa-môn Gotama về; Pilotika kết luận Thế Tôn là bậc Chánh Đẳng Giác vì thấy bốn dấu tích — ví như người thạo theo dấu voi thấy dấu chân voi lớn trong rừng. Đó là: những sát-đế-lỵ, bà-la-môn, gia chủ, sa-môn thông minh, soạn sẵn câu hỏi để bóc lỗi, khi gặp Đức Phật chưa kịp hỏi đã bị thuyết phục — người thành đệ tử, người xin xuất gia rồi chẳng bao lâu tự chứng mục tiêu tối thượng và thốt lên: chúng ta suýt nữa đã lạc mất, trước kia tự xưng A-la-hán mà thật ra chẳng phải. Jānussoṇi xuống khỏi xe, chắp tay ba lần thốt lên kính lễ, rồi đến kể lại cho Đức Phật.

  Đức Phật nói ví dụ đó chưa đầy đủ: người theo dấu có kinh nghiệm không vội kết luận khi chỉ thấy dấu chân lớn, vì có những voi cái thấp bé nhưng dấu chân lớn; chưa khi thấy thêm dấu cọ xát trên cao hay dấu ngà, vì có những voi cái cao lớn; chỉ khi thấy cành cây bị gãy và tận mắt thấy con voi đực đi, đứng, ngồi, nằm, người ấy mới kết luận. Cũng vậy, bốn dấu tích ấy mới là manh mối.

  Con đường đầy đủ bắt đầu khi một Như Lai xuất hiện, thuyết Pháp; một gia chủ nghe, khởi lòng tin, thấy đời sống gia đình chật hẹp bụi bặm, từ bỏ tài sản và thân quyến để xuất gia. Vị ấy sống theo giới luật: từ bỏ sát sinh, trộm cắp, quan hệ tình dục, nói dối, nói chia rẽ, lời thô ác, lời phù phiếm; chỉ ăn một phần của ngày, tránh múa hát, trang điểm, giường cao sang, vàng tiền và nhiều tài sản; biết đủ như con chim bay chỉ mang đôi cánh. Tiếp đến là phòng hộ sáu căn, không nắm giữ tướng chung hay chi tiết khi mắt thấy sắc cho đến tâm nhận biết pháp; sống với niệm và tỉnh giác trong mọi tư thế; từ bỏ năm triền cái — những cấu uế làm trí tuệ suy yếu.

  Rồi vị ấy lần lượt chứng bốn thiền; mỗi bước đều là dấu chân của Như Lai, nhưng vị Thánh đệ tử vẫn chưa kết luận. Khi tâm định thanh tịnh, vị ấy hướng tâm đến trí nhớ các đời trước, đến thiên nhãn biết chúng sinh chết đi tái sinh theo nghiệp, rồi đến trí đoạn tận lậu hoặc khi biết đúng như thật bốn sự thật về khổ và về các lậu hoặc. Tâm được giải thoát, vị ấy biết sinh đã tận — đến đây mới kết luận Thế Tôn là bậc Chánh Đẳng Giác, Pháp được khéo giảng, Tăng đoàn thực hành đúng đắn, ví dụ dấu chân voi mới được trình bày đầy đủ. Jānussoṇi xin quy y Phật, Pháp, Tăng trọn đời.
