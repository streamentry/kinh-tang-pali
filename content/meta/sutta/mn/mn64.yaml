summary: |-
  Đại Kinh Māluṅkya kể khi Đức Phật ở Sāvatthī, tại tu viện Anāthapiṇḍika. Ngài hỏi các tỳ-kheo có nhớ năm hạ phần kiết sử không; Tôn giả Māluṅkyaputta đáp: thân kiến, hoài nghi, giới cấm thủ, dục tham, sân hận. Đức Phật trách bằng thí dụ đứa trẻ thơ, như du sĩ đạo khác sẽ trách: đứa trẻ nằm ngửa, chưa có thân, huống chi thân kiến sinh khởi, nhưng tùy miên thân kiến vẫn nằm nơi nó; cùng cách ấy, tùy miên hoài nghi, giới cấm thủ, dục tham, sân vẫn nằm nơi đứa trẻ chưa có các pháp, giới, dục, chúng sinh.

  Theo lời thỉnh của Ānanda, Đức Phật giảng hai hạng người. Kẻ phàm phu chưa học sống với tâm bị từng kiết sử chi phối, chìm đắm trong đó, không hiểu đúng như thật lối thoát; nó ngấm sâu, chưa trừ bỏ. Đệ tử Thánh có học ngược lại: tâm không bị chi phối, không chìm đắm, hiểu đúng như thật lối thoát; kiết sử ấy cùng tùy miên của nó được đoạn tận — lặp cho cả năm. Ngài khẳng định có con đường để đoạn tận năm hạ phần kiết sử: như lõi cây không chặt được nếu không chặt qua vỏ, giác cây; nhưng nương theo đó thì có thể.

  Ví sông Hằng đầy tràn đến nỗi quạ uống được: người yếu đuối không bơi ngang được, như người được dạy các pháp để tận diệt thân kiến mà tâm không hướng đến, không tin phục, không an trú, không giải thoát; người khỏe mạnh bơi ngang được, như người có tâm hướng đến, tin phục, an trú, giải thoát.

  Con đường gồm bảy bậc: ở sơ thiền, vị tỳ-kheo quán các pháp hiện có nơi ấy — thuộc sắc, thọ, tưởng, hành, thức — là vô thường, khổ, bệnh, ung nhọt, mũi nhọn, phiền não, tai họa, xa lạ, hoại đổ, trống rỗng, vô ngã; hướng tâm từ bỏ chúng về giới vô tử: an tịnh mọi hành, từ bỏ chấp thủ, đoạn tận khát ái, không tham, chấm dứt, Niết-bàn. An trú nơi ấy, vị ấy chứng đạt đoạn tận các lậu hoặc; nếu không, nhờ tham mộ Pháp và hoan hỷ Pháp ấy, với sự đoạn tận năm hạ phần kiết sử, vị ấy là bậc hóa sinh. Công thức lặp cho nhị, tam, tứ thiền và ba xứ vô sắc — Không vô biên xứ, Thức vô biên xứ, Vô sở hữu xứ.

  Cuối kinh, Ānanda hỏi: nếu đây là con đường, vì sao có tỳ-kheo tâm giải thoát và tỳ-kheo huệ giải thoát? Đức Phật đáp: do sự sai khác của các căn. Đó là đích của bài kinh: đưa năm hạ phần kiết sử vào con đường thiền định dẫn đến giới vô tử.
