notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `mn85:51.7`, `51.14`, `51.21` — *trước kia với lối sống, sự thực hành và khổ hạnh khắc nghiệt như vậy mà ngài còn chưa đạt được … Nay ngài sống buông thả … sao ngài lại đạt được …* → *ngay cả với lối sống ấy, sự thực hành ấy, khổ hạnh khắc nghiệt ấy, ngài cũng đã không đạt được …; huống gì nay ngài sống buông thả … làm sao ngài đạt được …*, theo `mn26:27.*`, vì Pāli `tāyapi … tāya … tāya` lặp ba chỉ định từ, `kiṁ pana` là *huống gì*, và `trước kia` là chữ không có trong Pāli; giữ nguyên khoá `mn85:43.4` (khớp `mn26:19.4` và `mn85:43.3`; bản đa số từ `dn14` dùng *ái trụ* và *tánh y duyên*, kém).

summary: |-
  Khi Đức Phật trú trong vườn Nai rừng Bhesakaḷā, Hoàng tử Bodhi vừa xây xong lâu đài Kokanada, mời Ngài đến dùng bữa; ông trải vải trắng lên tận bậc thang, nhưng Đức Phật không bước lên. Hoàng tử nói quan điểm: chẳng thể đạt được lạc bằng lạc, mà phải đạt được lạc bằng khổ; Đức Phật đáp khi còn là Bồ-tát Ta cũng từng nghĩ vậy, rồi kể lại hành trình của mình.

  Ngài học với Āḷāra Kālāma và Uddaka, con của Rāma, tự chứng pháp của hai thầy; nhưng cả hai chỉ đưa đến tái sinh trong Vô sở hữu xứ và Phi tưởng phi phi tưởng xứ. Ba phép ví dụ hiện lên: khoan que vào thanh gỗ còn ướt không thể sinh lửa, chỉ thanh gỗ khô kiệt mới sinh được; cũng vậy, chỉ khi các dục được xa lìa bằng thân và tâm, và dục ái, luyến, mê, khát, nóng được đoạn tận, an tịnh nội tại, dù chịu khổ hay không, các vị ấy mới có thể đạt tri kiến, giác ngộ tối thượng.

  Ngài thực hành nỗ lực khắc nghiệt: thiền định không hơi thở với các đau đớn ví như bễ rèn, giáo khoan đầu, dao mổ, than hồng; từ chối chất thiên giới chư thiên dâng qua lỗ chân lông; ăn rất ít khiến da bụng dính vào xương sống, nhưng vẫn chưa đạt pháp siêu nhân nào.

  Nhớ thuở ngồi dưới bóng cây khi cha vắng nhà, hoàn toàn ly dục chứng sơ thiền, Ngài biết đó là con đường giác ngộ, bèn dùng thức ăn thô cứng, làm nhóm năm tỳ-kheo ra đi. Ngài chứng tứ thiền và ba thắng trí: trí nhớ các đời sống quá khứ; thiên nhãn thấy chúng sinh chết đi và tái sinh tùy nghiệp; và trí đoạn tận các lậu hoặc. Phạm thiên Sahampati hiện ra thuyết phục Ngài thuyết Pháp; vì hai thầy cũ đã qua đời, Ngài đến Varanasi cho nhóm năm vị.

  Nhóm năm tỳ-kheo ba lần phản đối rằng trước kia với khổ hạnh khắc nghiệt ngài còn chưa đạt, nay sống đầy đủ sao lại đạt; Ngài đáp Như Lai không sống đầy đủ, không từ bỏ nỗ lực, rồi hướng dẫn họ chẳng bao lâu đạt mục tiêu tối thượng của phạm hạnh. Khi Hoàng tử hỏi một tỳ-kheo được hướng dẫn bao lâu sẽ đạt mục tiêu ấy, Đức Phật nêu năm pháp tinh cần — tín, ít bệnh, trung thực, tinh tấn, trí tuệ — hạ thời hạn từ bảy năm đến một đêm ngày: ai được dạy chiều sẽ đạt sự vượt bậc vào sáng. Sañjikāputta nhắc Hoàng tử vẫn chưa quy y; ông cho biết đã quy y từ trong lòng mẹ, rồi qua vú em, và đây là lần thứ ba.
