summary: |-
  Đức Phật ở Nātika, tại ngôi nhà bằng gạch. Buổi chiều, Ngài đến khu rừng sāla Gosiṅga, nơi Tôn giả Anuruddha, Nandiya và Kimila đang ở; người giữ vườn ngăn lại, nhưng ba vị ra đón, nhận y bát, chuẩn bị chỗ ngồi, nước rửa chân. Đây là Tiểu Kinh Rừng Gosiṅga.

  Đức Phật hỏi các vị sống thế nào. Ba vị cho biết họ sống hòa hợp, vui vẻ, không tranh cãi, hòa như sữa với nước, nhìn nhau bằng ánh mắt thương mến, nhờ duy trì thân hành, khẩu hành và ý hành từ ái cả công khai lẫn riêng tư, gác ý muốn riêng, thuận theo ý muốn của nhau; thân khác nhau nhưng tâm dường như là một. Về sự không buông lung, họ kể công việc luân phiên trong khất thực: ai về trước thì chuẩn bị chỗ ngồi, nước và thức ăn; ai về sau thì dùng hoặc bỏ phần thừa ở nơi không có sinh vật, cất dọn, quét dọn, châm đầy các bình nước trống; việc nặng thì ra hiệu bằng tay kêu giúp mà không phá sự im lặng; cứ mỗi năm ngày ngồi lại suốt đêm đàm luận về Pháp.

  Hỏi về pháp siêu nhân, tri kiến xứng đáng bậc Thánh, Đức Phật nhận được câu trả lời theo từng tầng: sơ thiền có hỷ lạc do viễn ly sinh, rồi nhị, tam, tứ thiền, tiếp là bốn cõi vô sắc từ Không vô biên xứ đến Phi tưởng phi phi tưởng xứ, và cuối cùng diệt thọ tưởng, nơi sau khi thấy bằng trí tuệ các lậu hoặc được đoạn tận; ba vị khẳng định không thấy sự an trú an lạc nào cao hơn, và Đức Phật xác nhận điều đó.

  Sau khi Đức Phật đi, Nandiya và Kimila hỏi Anuruddha tại sao Ngài trình bày được chứng đạt của họ; Tôn giả cho biết đã dùng tâm mình bao quát tâm hai vị và chư thiên cũng báo cho Ngài. Dạ-xoa Dīgha Parajana tuyên bố đó là lợi ích lớn cho dân Vajji; lời tuyên bố được truyền lên lần lượt qua các tầng chư thiên cho tới cõi Phạm thiên, làm ba vị được biết đến tận đó ngay trong khoảnh khắc.

  Đức Phật xác nhận điều đó: gia đình, dòng họ, làng, thị trấn, thành phố hay xứ sở nào mà ba vị đã rời bỏ, nếu nhớ đến họ với tâm tin tưởng sẽ được lợi ích và hạnh phúc lâu dài, và ba vị ấy đang thực hành vì lợi ích của nhiều người, vì lòng thương đối với thế gian. Bài kinh cho thấy đời sống hòa hợp và tinh tấn dẫn tới chứng đạt cao nhất, và chính điều đó mang lại lợi ích cho cả thế giới.
