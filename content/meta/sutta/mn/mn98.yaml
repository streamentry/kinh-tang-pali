summary: |-
  Kinh Vāseṭṭha mở đầu khi hai thanh niên Vāseṭṭha và Bhāradvāja tranh luận ở Icchānaṅgala, nơi Đức Phật đang trú trong khu rừng Icchānaṅgala, về câu hỏi thế nào là Bà-la-môn. Bhāradvāja nói người là Bà-la-môn nhờ sinh: sinh hai bên đều cao quý, mẹ cha thuần khiết huyết thống đến tận đời thứ bảy các cụ cố; Vāseṭṭha nói nhờ giới hạnh và thành tựu oai nghi. Không ai thuyết phục được ai, hai người đến hỏi Đức Phật, và Vāseṭṭha trình bày câu hỏi bằng kệ.

  Đức Phật giải thích từng bước sự phân loại loài hữu tình theo các giống: cỏ và cây, bò cạp và côn trùng, loài bốn chân, loài bò sát, cá, chim — yếu tính của chúng do giống sinh. Ở loài người thì không: chẳng nhờ tóc, đầu, tai, mắt, các chi thể, màu da hay giọng nói; trong từng thân thể loài người chẳng tìm thấy sự sai biệt ấy, và sự sai biệt giữa loài người được nói là do quy ước đặt tên.

  Ai sống bằng nghề nào thì được gọi theo nghề ấy: người làm ruộng, người thợ, thương gia, người làm thuê, kẻ trộm, chiến binh, người chủ tế, vị vua — chẳng phải Bà-la-môn. Đức Phật tuyên bố chẳng gọi là Bà-la-môn kẻ sinh từ bụng mẹ nào nếu còn ôm giữ sự vật; người không gì sở hữu, không chấp thủ, đã chặt đứt mọi kiết sử, nhẫn nhục không sân khi bị nhục mạ, chẳng dính mắc các dục, tự biết sự chấm dứt khổ của mình, vứt bỏ tham sân ngã mạn, nói lời chân thật, thoát khỏi ràng buộc của phước và tội, lậu hoặc đã tận, bậc A-la-hán — Ta gọi người ấy là Bà-la-môn; công thức ấy lặp lại qua chuỗi kệ dài.

  Kết luận khép lại: tên và họ là quy ước được đặt ra nơi đời, và kẻ vô minh chẳng hiểu đã xác quyết người là Bà-la-môn nhờ sinh. Chẳng nhờ sinh mà là Bà-la-môn, chẳng nhờ sinh mà chẳng phải Bà-la-môn; nhờ nghiệp là Bà-la-môn, nhờ nghiệp mà chẳng phải Bà-la-môn, nhờ nghiệp là người làm ruộng, thợ, thương gia, làm thuê, trộm, chiến binh, chủ tế, vua. Nghiệp làm cho thế gian vận hành, nghiệp làm cho chúng sinh vận hành như chốt xe của xe đang chạy; nhờ khổ hạnh, phạm hạnh, chế ngự và điều phục mà người là Bà-la-môn tối thượng, và đối kẻ hiểu biết, người thành tựu ba thắng minh ấy là Phạm thiên và Sakka. Hai thanh niên nghe xong quy y tam bảo.
