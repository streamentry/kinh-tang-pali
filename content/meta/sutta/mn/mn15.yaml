summary: 'Kinh Tư Lượng do Tôn giả Mahāmoggallāna giảng cho các tỳ-kheo ở vườn nai rừng Bhesakaḷā, tại
  Suṁsumāragira. Ngài đặt giả thiết một vị tỳ-kheo mời bạn đồng tu góp ý cho mình nhưng bản thân khó được
  góp ý, thiếu kiên nhẫn, không đón nhận lời chỉ dạy với sự kính trọng: khi ấy các bạn không muốn khuyên
  bảo hay hướng dẫn vị ấy, và vị ấy không nhận được sự tin cậy của họ.


  Kinh liệt kê những phẩm chất khiến một người khó được góp ý: có những mong muốn xấu và bị chúng chi
  phối; tự đề cao mình và hạ thấp người khác; dễ nổi giận, vì sân mà hằn học, cố chấp và buông lời gần
  với sân hận; khi bị chỉ lỗi thì phản đối, quay lại trách, cãi trả, né tránh vấn đề hoặc không giải trình
  được dựa trên sự việc; xúc phạm và khinh miệt người khác; ganh tị và keo kiệt; quanh co và giả dối;
  bướng bỉnh và ngạo mạn; và chấp chặt quan điểm của mình, nắm giữ cứng nhắc, không chịu buông.


  Phần đối xứng trình bày người dễ được góp ý: vị ấy mời góp ý hay không, các bạn đồng tu vẫn thấy đáng
  để khuyên bảo và hướng dẫn; toàn bộ mười sáu phẩm chất trên được phủ định lại từng điều một, từ không
  bị mong muốn xấu chi phối cho đến không chấp chặt quan điểm, dễ dàng buông bỏ.


  Sau đó kinh đưa ra cách tự đo lường: với từng phẩm chất ấy, vị tỳ-kheo xét rằng người kia có điều đó
  và mình không thích, không tán thành; nếu chính mình cũng vậy, người khác sẽ không thích và không tán
  thành mình; hiểu như vậy, vị ấy nên khởi ý không để phẩm chất ấy hiện hữu. Tiếp theo là cách tự kiểm
  tra: tự hỏi mình có phẩm chất ấy không; nếu thấy có, nên nỗ lực từ bỏ những pháp xấu, bất thiện ấy;
  nếu thấy không, nên tu tập với hỷ và niềm vui, ngày đêm rèn luyện các pháp thiện. Cả hai công thức được
  lặp lại cho từng phẩm chất.


  Kinh kết thúc bằng ví chiếu gương: như người còn trẻ thích trang điểm soi bóng trong gương sạch hay
  bát nước trong, thấy bụi bẩn thì cố làm sạch, không thấy thì vui mừng nghĩ may thay ta sạch sẽ; vị tỳ-kheo
  thấy mình chưa từ bỏ hết thì nỗ lực từ bỏ tất cả, đã từ bỏ hết thì tu tập với hỷ và niềm vui, ngày đêm
  rèn luyện các pháp thiện.'
