summary: |-
  Đức Phật thuyết Kinh Phân Biệt Không Tranh Chấp cho các tỳ-kheo tại rừng Jeta, tu viện ông Anāthapiṇḍika gần Sāvatthī, tóm lược: tránh hai cực đoan là lạc dục và tự làm khổ mình, đi trung đạo Như Lai giác ngộ, hướng đến Niết-bàn; biết tâng bốc, chê bai rồi chỉ thuyết pháp; biết sự phân biệt lạc rồi theo đuổi lạc nội tại; không nói lời bí mật, không nói thẳng mặt lời gay gắt; nói không vội vàng; không chấp trước ngôn từ địa phương, không vượt quá danh xưng thông thường.

  Việc theo đuổi hỷ lạc do duyên dục và việc tự làm khổ mình đều là tà hạnh; việc không theo đuổi cả hai đều là chánh hạnh. Trung đạo ấy là Thánh đạo tám chi. Nói ai theo đuổi thì tất cả những người ấy có khổ hay không khổ là chê bai hay tâng bốc một số người. Chỉ thuyết pháp là không nhắm vào người; về thủ hữu kiết sử, kinh nói chưa đoạn trừ thì hữu chưa được đoạn trừ, đã đoạn trừ thì hữu cũng được đoạn trừ.

  Năm đối tượng dục là sắc, tiếng, hương, vị, xúc; lạc hỷ do duyên năm đối tượng ấy là lạc dục, lạc uế trược, lạc phàm phu, lạc không Thánh, không nên thân cận mà nên sợ hãi; bốn thiền là lạc ly dục, lạc độc cư, lạc an tịnh, lạc chánh giác, nên thân cận. Lời bí mật và lời thẳng mặt gay gắt: không thật, không lợi ích thì không nói; thật nhưng không lợi ích thì tập không nói; thật, đúng và có lợi ích thì biết đúng thời.

  Nói vội vàng làm thân mệt mỏi, lời khó hiểu; nói không vội vàng thì rõ ràng, dễ hiểu. Cùng một vật ở mỗi địa phương có tên gọi khác nhau; chấp trước mà quyết định chỉ đây là thật, còn lại đều vô dụng, là chấp trước ngôn từ địa phương, vượt quá danh xưng thông thường; người không chấp trước thì nghĩ các Tôn giả nói với ý nghĩa này.

  Cuối kinh, từng cặp được xếp vào pháp có xung đột hay pháp vắng lặng: theo đuổi lạc dục hay tự làm khổ mình là có xung đột, không theo đuổi là vắng lặng; tâng bốc chê bai là có xung đột, chỉ thuyết pháp là vắng lặng; lời không thật hay thật mà không lợi ích là có xung đột, lời thật đúng có lợi ích là vắng lặng; nói vội vàng và chấp trước ngôn từ địa phương là có xung đột, ngược lại là vắng lặng. Kinh dạy biết rõ hai loại ấy để hành trì hạnh vắng lặng, và thiện nam Subhūti được nêu là người đang hành trì hạnh ấy.
