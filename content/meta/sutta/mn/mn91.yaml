summary: |-
  Kinh Brahmāyu mở ra khi Đức Phật du hành trong xứ người Videha. Bà-la-môn Brahmāyu trú tại Mithilā, một trăm hai mươi tuổi, thông thành ba Vệ Đà và tinh thông các tướng đại trượng phu, nghe danh tiếng của sa-môn Gotama, bèn sai học trò là thanh niên Uttara đến tìm hiểu danh tiếng ấy. Ông dặn: theo các bài trí nguyện, đại trượng phu thành tựu ba mươi hai tướng nếu sống tại gia sẽ là vua Chuyển luân thánh; nếu xuất gia sẽ là bậc A-la-hán, Chánh Đẳng Giác.

  Uttara thấy ba mươi hai tướng trừ hai tướng; Đức Phật bèn tác ý thần thông cho anh thấy vật dục được che kín và lưỡi dài rộng. Anh theo sát Đức Phật suốt bảy tháng như cái bóng, rồi về báo với Brahmāyu rằng danh tiếng ấy đúng và các tướng đủ cả; anh kể lại các cử chỉ khi đi, ngó quanh, vào làng, ngồi, ăn và giảng Pháp mà mình đã thấy, kết luận bậc Gotama là như vậy, còn hơn thế nữa. Nghe vậy, Brahmāyu chắp tay thốt lên ba lần lời đảnh lễ và mong được gặp.

  Đức Phật du hành đến Mithilā, trú trong vườn xoài Makhādeva. Brahmāyu sai thiếu niên đến báo trước, giới thiệu mình là bậc nhất về tài sản, bài trí nguyện, tuổi thọ và danh tiếng. Được chấp thuận, ông đến vườn, từ chối chỗ hội chúng nhường và ngồi ngay gần sa-môn Gotama. Ông thấy ba mươi hai tướng trừ hai tướng, bèn hỏi bằng kệ; Đức Phật cho ông thấy hai tướng ấy, đáp rằng điều nên thắng tri, nên tu tập, nên đoạn bỏ đều đã hoàn mãn, do vậy Ta là bậc Phật.

  Brahmāyu chọn hỏi về lợi ích đời sau, bạch bằng kệ: thế nào là Bà-la-môn, bậc tam minh, cho đến bậc Phật? Đức Phật đáp bằng kệ: bậc ấy biết các tiền thân, thấy cõi thiên và cõi dữ, đạt đến diệt tận sinh, đoạn sinh và tử, vượt qua mọi pháp. Brahmāyu cúi đầu xuống hai chân Đức Phật, xưng danh mình; Đức Phật giảng cho ông từng bước: thuyết bố thí, giới, thiên giới, nguy hại của các dục, lợi ích của xuất ly, rồi khổ, tập, diệt, đạo. Pháp nhãn sinh khởi nơi ông; ông xin quy y Phật, Pháp, Tăng và mời dùng bữa; bảy ngày liền ông dâng cúng Tăng chúng.

  Sau khi Đức Phật ra đi, Brahmāyu qua đời. Nhiều tỳ-kheo hỏi vị ấy sẽ đi đến cõi nào; Đức Phật đáp rằng Brahmāyu là bậc có trí, thực hành đúng với Pháp, và nhờ đoạn tận năm hạ phần kiết sử, vị ấy là bậc hóa sinh, sẽ nhập diệt độ tại đó, không còn trở lại từ cõi thế giới ấy.
