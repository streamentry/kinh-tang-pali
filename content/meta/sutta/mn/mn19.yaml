summary: |-
  Tại rừng Jeta ở Sāvatthī, Đức Phật kể lại thời trước khi giác ngộ, khi Ngài còn là Bồ-tát, Ngài quyết định sống bằng cách chia các suy nghĩ thành hai nhóm: suy nghĩ về dục, suy nghĩ sân hận và suy nghĩ gây hại xếp vào một nhóm; suy nghĩ ly dục, suy nghĩ không sân và suy nghĩ không gây hại xếp vào nhóm kia.

  Mỗi khi một suy nghĩ về dục, sân hận hay gây hại sinh khởi, Đức Phật hiểu rằng suy nghĩ ấy dẫn đến hại mình, hại người và hại cả hai, cản trở trí tuệ, nghiêng về phiền não và không dẫn đến Niết-bàn. Khi quán xét như vậy, suy nghĩ ấy lắng xuống; bất cứ khi nào nó sinh khởi, Ngài từ bỏ, xua tan và chấm dứt. Ngài nêu nguyên tắc: tỳ-kheo thường suy nghĩ và nghiền ngẫm điều gì thì tâm sẽ nghiêng về điều ấy, rồi ví với người chăn bò canh giữ đàn bò khỏi ruộng lúa đang mọc.

  Ngược lại, suy nghĩ ly dục, không sân, không gây hại không hại ai, làm tăng trưởng trí tuệ và dẫn đến Niết-bàn, nên suy nghĩ cả ngày lẫn đêm cũng không thấy điều gì đáng sợ. Tuy nhiên, suy nghĩ quá lâu làm thân mệt, tâm xao động và xa rời định, nên Ngài làm cho tâm lắng lại bên trong, an trú, nhất tâm, định tĩnh. Nguyên tắc ấy được nhắc lại, giờ ví với người chăn bò sau mùa gặt chỉ cần giữ niệm đàn bò ở đó.

  Với tinh tấn khơi dậy, niệm thiết lập, thân an tịnh, tâm có định và nhất tâm, Đức Phật chứng và an trú bốn thiền từ sơ thiền đến tứ thiền, rồi đạt ba minh trong ba canh: canh đầu là trí nhớ lại nhiều đời sống quá khứ; canh giữa là thiên nhãn thấy các chúng sinh chết đi và tái sinh thấp kém, cao quý theo nghiệp của mình; canh cuối là trí đoạn tận các lậu hoặc khi biết đúng như thật bốn sự thật về khổ và về các lậu hoặc, tâm được giải thoát khỏi lậu hoặc về dục, về hữu và vô minh.

  Bài kinh kết bằng ví dụ đàn nai ở khu đầm lầy, được giải nghĩa: đầm lầy là dục lạc, đàn nai là các chúng sinh, người muốn gây hại là Māra Ác ma, con đường sai là tà đạo tám ngành, nai đực làm mồi là sự thích thú và tham đắm, nai cái làm mồi là vô minh; người muốn lợi ích là Như Lai, và con đường an toàn, vững chắc, dẫn đến hạnh phúc là Thánh đạo tám ngành. Đức Phật đã mở con đường an toàn, đóng con đường sai, loại bỏ hai con mồi, rồi vì lòng thương dặn các tỳ-kheo hãy tu thiền nơi những gốc cây, căn nhà trống, đừng buông lung để sau này hối tiếc.
