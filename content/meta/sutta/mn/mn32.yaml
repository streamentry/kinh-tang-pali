summary: |-
  Đức Phật cùng nhiều vị trưởng lão đệ tử nổi tiếng như Sāriputta, Mahāmoggallāna, Mahākassapa, Anuruddha, Revata, Ānanda đang ở trong khu rừng sāla Gosiṅga. Đêm trăng, các vị tụ họp nơi Sāriputta để nghe Pháp, và Tôn giả nêu câu hỏi: hạng tỳ-kheo nào sẽ làm khu rừng sāla Gosiṅga thêm rực rỡ? Đây là Đại Kinh Rừng Sừng Bò.

  Từng vị trả lời theo sở trường của mình. Ānanda chọn vị tỳ-kheo học rộng, ghi nhớ những điều đã học và thuyết Pháp cho bốn hội chúng nhằm nhổ tận gốc các tùy miên. Revata chọn vị thích tĩnh cư, chuyên tâm làm lắng dịu nội tâm, không bỏ bê thiền định, có tuệ quán. Anuruddha chọn vị dùng thiên nhãn thanh tịnh quan sát một ngàn thế giới, ví với người có mắt sáng đứng trên tầng cao của tòa lầu nhìn thấy một ngàn vòng bánh xe. Mahākassapa chọn vị tự mình thực hành và tán thán đời sống trong rừng, hạnh khất thực, y phấn tảo, ba y, ít ham muốn, biết đủ, viễn ly, không giao du nhiều, tinh tấn, và đầy đủ giới, định, trí tuệ, giải thoát, tri kiến về giải thoát. Mahāmoggallāna chọn hai vị đàm luận Pháp, hỏi đáp nhau không lúng túng, cuộc đàm luận đúng Pháp cứ tiếp tục. Cuối cùng chính Sāriputta nêu vị tỳ-kheo làm chủ tâm mình, không để tâm làm chủ mình, muốn an trú trong sự an trú hay chứng đạt nào buổi sáng, trưa hay chiều cũng được, ví như vị vua có hòm đầy y phục nhiều màu sắc, muốn mặc bộ nào thì mặc bộ ấy.

  Các Tôn giả cùng đến trình bày vấn đề với Đức Phật. Ngài khen từng câu trả lời là đúng theo sở trường của người trả lời, và khi Sāriputta hỏi ai đã trả lời đúng, Ngài xác nhận tất cả đều đúng theo một phương diện.

  Đức Phật rồi nêu câu trả lời của chính mình: sau bữa ăn, khi đi khất thực trở về, vị tỳ-kheo ngồi kiết-già, giữ thân thẳng, thiết lập niệm trước mặt, và quyết tâm không rời thế ngồi cho đến khi tâm được giải thoát khỏi các lậu hoặc, không còn chấp thủ. Vị tỳ-kheo như vậy mới làm khu rừng sāla Gosiṅga thêm rực rỡ; sau những câu trả lời tả các đức tính riêng lẻ, bài kinh khép lại ở quyết tâm đạt giải thoát trọn vẹn.
