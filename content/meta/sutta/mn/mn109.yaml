summary: |-
  Đại Kinh Đêm Trăng Tròn ghi lời Đức Phật dạy vào đêm Uposatha trăng tròn ngày rằm, ngồi ngoài trời ở Đông Viên, lâu đài của mẹ Migāra tại Sāvatthī, với Tăng chúng vây quanh. Một tỳ-kheo được phép hỏi, và kinh triển khai thành chuỗi câu hỏi về năm thủ uẩn.

  Đức Phật xác nhận năm thủ uẩn là sắc, thọ, tưởng, hành, thức, lấy dục làm gốc. Chấp thủ không phải chính là năm thủ uẩn, cũng không ngoài các uẩn; khi có lòng dục, lòng tham đối với các uẩn, ở đấy là chấp thủ. Sự gọi tên uẩn: mọi sắc, thọ, tưởng, hành, thức — quá khứ, vị lai, hiện tại; nội hay ngoại; thô hay tế; hạ liệt hay thắng diệu; xa hay gần. Bốn đại là nhân duyên cho sắc uẩn; xúc cho thọ, tưởng, hành uẩn; danh sắc cho thức uẩn.

  Về thân kiến: người vô văn phàm phu quán từng uẩn theo bốn cách chấp ngã; bậc Thánh đệ tử có văn không quán như vậy. Vị ngọt của mỗi uẩn là hỷ lạc khởi do duyên nó; nguy hiểm là uẩn ấy vô thường, khổ, chịu biến đổi; xuất ly là điều phục, đoạn trừ lòng dục lòng tham với uẩn ấy. Như vậy, thấy mọi uẩn là không phải của tôi, không phải là tôi, không phải tự ngã của tôi, hết chấp ngã, ngã sở và tùy miên của mạn.

  Một tỳ-kheo khởi suy tư: nếu năm uẩn đều vô ngã, các nghiệp do vô ngã tạo ra, ai thọ quả? Đức Phật biết được bằng tâm, dạy đó là suy tư của kẻ ngu si, vô minh bao phủ, tâm bị tham chi phối, nghĩ vượt quá lời dạy của Đạo sư; các tỳ-kheo đã được khéo hướng dẫn chất vấn về các pháp ấy. Ngài hỏi lại: năm uẩn thường hay vô thường; vô thường là khổ hay lạc; cái vô thường, khổ, chịu biến đổi có thích hợp xem là của tôi, tự ngã của tôi không. Trả lời lần lượt là vô thường, khổ, không. Thấy vậy thì chán ngán cả năm uẩn; chán ngán nên ly tham, ly tham nên giải thoát, khởi tri kiến đã giải thoát: sinh đã tận, phạm hạnh hoàn thành, việc cần làm đã làm, không còn trở lại hiện hữu này.

  Kinh chốt bằng kết quả của pháp thoại: tâm sáu mươi tỳ-kheo được giải thoát khỏi các lậu hoặc do không chấp thủ. Toàn bài dồn về một tuyến: từ lấy dục làm gốc đến vô thường, khổ, rồi không phải của tôi, không phải là tôi, không phải tự ngã của tôi, cuối cùng là chán ngán, ly tham, giải thoát.
