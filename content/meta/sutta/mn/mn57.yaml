summary: |-
  Kinh Hạnh Con Chó do Đức Phật thuyết giữa dân Koliya tại thị trấn Haliddavasana. Puṇṇa thực hành hạnh con bò và Seniya, khổ hạnh lõa thể thực hành hạnh con chó, đến gặp Ngài; Seniya cuộn mình ngồi như chó. Puṇṇa hỏi Seniya thực hành hạnh con chó lâu dài, sau khi chết sẽ tái sinh ở đâu? Đức Phật hai lần chặn câu hỏi, đến lần thứ ba mới trả lời.

  Người phát triển trọn vẹn, không gián đoạn hạnh, giới, tâm, cách cư xử của chó sẽ tái sinh cùng loài chó; nếu cho rằng nhờ giới hạnh ấy sẽ thành một vị trời, đó là tà kiến, dẫn đến địa ngục hoặc loài vật. Vậy hạnh con chó thành tựu dẫn đến loài chó, không thành tựu thì địa ngục. Seniya bật khóc vì đã thực hành lâu dài, rồi hỏi về hạnh con bò của Puṇṇa. Đức Phật chặn hai lần, đến lần hỏi thứ ba mới trả lời theo công thức ấy: hạnh con bò thành tựu dẫn đến loài bò, không thì địa ngục. Puṇṇa cũng bật khóc.

  Puṇṇa xin được giảng Pháp để hai người từ bỏ hạnh ấy. Đức Phật nêu bốn loại nghiệp Ngài tuyên thuyết sau khi tự mình chứng ngộ: nghiệp đen với quả đen: thân, khẩu, ý hành gây tổn hại, tái sinh vào thế giới tổn hại, cảm thọ hoàn toàn đau khổ như chúng sinh địa ngục; nghiệp trắng với quả trắng: các hành không tổn hại, tái sinh vào thế giới không tổn hại, cảm thọ an lạc như chư thiên Subhakiṇha; nghiệp vừa đen vừa trắng với quả tương ứng, lạc khổ xen lẫn như loài người, một số chư thiên, một số chúng sinh cảnh giới thấp; và nghiệp không đen không trắng, dẫn đến chấm dứt nghiệp.

  Với cả ba loại đầu, kinh lặp lại: hữu tình sinh khởi từ hữu tình, người làm gì thì tái sinh theo đó, khi đã tái sinh thì các xúc chạm đến; vì vậy chúng sinh là người thừa hưởng nghiệp của mình. Loại thứ tư là ý định từ bỏ nghiệp đen, nghiệp trắng, và nghiệp vừa đen vừa trắng.

  Puṇṇa xin quy y làm cư sĩ trọn đời. Seniya xin xuất gia và thọ đại giới; Đức Phật cho biết người từ giáo phái khác phải sống bốn tháng thử thách; Seniya xin bốn năm và được xuất gia. Không lâu sau, sống không phóng dật, nhiệt tâm, quyết chí, Seniya chứng ngộ mục đích tối thượng của đời phạm hạnh và trở thành A-la-hán. Bài kinh cho thấy tái sinh đi theo hành vi và ý định, còn hạnh mô phỏng loài vật dẫn đến thân loài ấy hay địa ngục.
