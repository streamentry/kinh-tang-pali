summary: |-
  Đức Phật ở giữa dân Vajji, tại Ukkacelā, bên bờ sông Hằng, và thuyết Tiểu Kinh Người Chăn Bò cho các tỳ-kheo bằng hai câu chuyện đối lập về người chăn bò xứ Magadha.

  Người chăn bò thiếu trí, vào tháng cuối mùa mưa khi sang thu, không quan sát bờ bên này và bờ bên kia sông Hằng, lùa đàn bò qua chỗ không có bến lội để sang bờ bắc, về phía xứ Suvideha; đàn bò chen nhau thành khối giữa dòng và gặp tai họa. Đức Phật áp vào những sa-môn hay bà-la-môn không thông thạo đời này, đời sau, phạm vi của Māra và ngoài phạm vi của Māra, phạm vi của cái chết và ngoài phạm vi của cái chết: ai cho rằng các vị ấy đáng lắng nghe và tin theo sẽ chịu bất lợi và đau khổ lâu dài.

  Người chăn bò có trí thì ngược lại: sau khi quan sát cả hai bờ, người ấy lùa đàn qua đúng bến lội, theo thứ tự từ bò đực là cha và đầu đàn, bò khỏe thuần luyện, bò đực non và bò cái tơ, bê nhỏ yếu sức, cho tới con bê non vừa mới sinh cũng được tiếng bò mẹ thúc giục mà sang bờ bắc an toàn. Cũng vậy, những sa-môn hay bà-la-môn thông thạo đời này, đời sau, phạm vi của Māra và ngoài Māra, của cái chết và ngoài cái chết: ai tin theo sẽ được lợi ích và hạnh phúc lâu dài.

  Đức Phật rồi đối chiếu từng nhóm bò với từng hạng người: bò đực đầu đàn là các vị A-la-hán, đã đoạn tận lậu hoặc và cắt ngang dòng chảy của Māra; bò khỏe thuần luyện là những vị đoạn tận năm hạ phần kiết sử, hóa sinh rồi Bát-niết-bàn tại đó, không còn trở lại; bò đực non và bò cái tơ là bậc Nhất lai, đã đoạn ba kiết sử và làm suy yếu tham, sân, si, chỉ trở lại một lần nữa; bê nhỏ yếu sức là bậc Dự lưu, đoạn ba kiết sử, không rơi vào cảnh giới thấp, chắc chắn hướng đến giác ngộ; còn con bê non vừa sinh là người tùy Pháp hành và người tùy tín hành.

  Cuối cùng, Đức Phật khẳng định chính Ngài thông thạo đời này, đời sau, phạm vi của Māra và ngoài Māra, của cái chết và ngoài cái chết, nên ai tin theo Ngài sẽ được lợi ích và hạnh phúc lâu dài; câu kệ kết bài cho biết bậc Chánh Giác đã biết toàn thế giới, mở cánh cửa bất tử để đạt Niết-bàn an ổn, và cổ võ các tỳ-kheo vui mừng vì đã đạt đến nơi an ổn.
