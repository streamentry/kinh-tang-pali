summary: |-
  Tại rừng Jeta ở Sāvatthī, Đức Phật thuyết Đại Kinh Người Chăn Bò cho các tỳ-kheo, mở đầu bằng ví dụ: người chăn bò có mười một điều bất toàn thì không thể chăm sóc và làm đàn bò tăng trưởng.

  Cũng vậy, vị tỳ-kheo có mười một pháp bất toàn thì không thể tăng trưởng, phát triển và lớn mạnh trong Giáo pháp và giới luật này. Đức Phật giải thích lần lượt từng pháp: không biết sắc là không biết mọi sắc đều là bốn đại và sắc do bốn đại tạo thành; không giỏi nhận biết đặc điểm là không biết người ngu và người trí được nhận biết qua hành động; không biết gỡ trứng ruồi là khi suy nghĩ về dục, sân hận, gây hại sinh khởi thì dung chứa chứ không từ bỏ; không biết băng vết thương là khi mắt thấy sắc vẫn nắm giữ tướng chung và các chi tiết mà không phòng hộ nhãn căn, và công thức này lặp lại cho tai, mũi, lưỡi, thân, ý.

  Bảy pháp còn lại: không biết hun khói là không giảng giải rộng rãi Pháp mình đã nghe; không biết chỗ lội qua là không đến hỏi những vị học rộng để xua tan nghi ngờ về nhiều pháp; không biết chỗ uống nước thỏa thích là không có niềm hứng khởi và niềm vui gắn với Pháp khi được giảng dạy; không biết đường đi là không biết Thánh đạo tám ngành; không rành bãi chăn là không biết bốn niệm xứ; vắt sữa đến cạn là nhận y phục, thức ăn, chỗ ở, thuốc men của gia chủ có lòng tin mà không biết chừng mực; không đặc biệt tôn kính các vị trưởng lão là những bậc cha, người dẫn dắt Tăng đoàn, vì không duy trì thân, khẩu, ý hành từ ái với họ.

  Sau đó, Đức Phật lặp lại toàn bộ trình tự theo chiều thuận: người chăn bò có đầy đủ mười một điều thì làm đàn bò tăng trưởng, và vị tỳ-kheo có đầy đủ mười một pháp thì tăng trưởng, phát triển và lớn mạnh trong Giáo pháp và giới luật. Từng pháp được định nghĩa theo chiều ngược lại, từ biết sắc, giỏi nhận biết đặc điểm, từ bỏ pháp xấu vừa sinh, phòng hộ các căn cho tới biết chừng mực khi nhận vật dụng của gia chủ và đặc biệt tôn kính các vị trưởng lão.

  Bài kinh trình bày cùng một danh sách mười một điều theo cả hai chiều bất toàn và đầy đủ, đối chiếu người chăn bò với người tỳ-kheo: thiếu những pháp ấy thì không thể lớn mạnh trong Giáo pháp và giới luật, có đầy đủ thì được tăng trưởng, phát triển và lớn mạnh.
