summary: |-
  Kinh Assalāyana mở ra ở Sāvatthī. Khoảng năm trăm Bà-la-môn đến từ các xứ khác nghe rằng sa-môn Gotama chủ trương sự thanh tịnh cho cả bốn đẳng cấp, bèn tìm đến thanh niên Assalāyana, mười sáu tuổi, thông thành ba Vệ Đà, để nhờ đối chất. Anh từ chối ba lần, nói sa-môn Gotama là bậc nói chánh pháp mà bậc nói chánh pháp thì khó đối chất, và chỉ nhận lời khi bị thách đừng thua trước khi ra trận.

  Trước mặt Đức Phật, Assalāyana nêu quan niệm Bà-la-môn: chỉ có Bà-la-môn là đẳng cấp tối thượng, đẳng cấp trắng, được thanh tịnh, là con trai của Phạm thiên sinh từ ngực, sinh từ miệng của Ngài. Đức Phật chỉ ra người ta vẫn thấy bà-la-môn nữ có kinh nguyệt, có thai, sinh con, rồi hỏi về xứ Yonaka, Kamboja và các xứ biên giới, nơi chỉ có hai đẳng cấp chủ và tôi tớ đổi chỗ cho nhau. Assalāyana xác nhận cả hai, nhưng vẫn nhắc lại quan niệm cũ.

  Đức Phật vấn nạn tiếp theo từng bước: cả bốn đẳng cấp sát sinh, lấy của không cho, nói dối và làm các pháp bất thiện khác đều sinh vào cõi ác, và ai tránh đều sinh lên cõi trời; cả bốn đẳng cấp đều có thể tu tập tâm từ và rửa trôi bụi bặm bên sông; đứa con lai giữa thiếu niên Sát-đế-lợi và thiếu nữ Bà-la-môn có giống cả cha lẫn mẹ, nên gọi theo cả hai; và các Bà-la-môn cho người có giới hạnh ăn trước hơn người tinh thông tụng đọc mà không giới hạnh. Assalāyana xác nhận mọi điểm ấy, dù vẫn nhắc lại quan niệm cũ.

  Đức Phật nói: ông thuở trước nương vào giai cấp, rồi vào các bài trí nguyện, rồi vào khổ hạnh, giờ đã đến với sự thanh tịnh của bốn đẳng cấp mà Ngài chủ trương. Assalāyana ngồi im lặng, u sầu, hết lời đối đáp. Đức Phật kể thuở xưa bảy vị thần tiên Bà-la-môn khởi lên ác tri kiến ấy ở rừng vắng; thần tiên Asita Devala đến vấn nạn, các vị càng nguyền rủa, ông càng rực rỡ. Về tổ tiên và sự thụ thai, các vị chẳng biết gì ngoài hội ba điều: cha mẹ hội họp, mẹ đang kỳ kinh nguyệt, thần trung ấm hiện hữu; và chẳng biết thần trung ấm ấy thuộc đẳng cấp nào. Bị các vị ấy còn chẳng thắng nổi, huống chi bị Ta.

  Nghe vậy, Assalāyana xin quy y Đức Phật, Pháp và Tăng chúng từ hôm nay cho đến trọn đời. Chuỗi hỏi đáp ấy dời trọng tâm từ huyết thống sang hành vi, khép lại ở sự thanh tịnh của cả bốn đẳng cấp mà Đức Phật chủ trương.
