summary: |-
  Tại Đông Viên ở Sāvatthī, Sakka, vua chư thiên, đến hỏi Đức Phật một câu ngắn gọn: đến mức nào một vị tỳ-kheo được giải thoát nhờ đoạn tận ái, đạt cứu cánh tối hậu, an ổn tối hậu khỏi mọi trói buộc, và là bậc cao quý nhất giữa chư thiên và loài người. Đây là Tiểu Kinh Đoạn Tận Ái.

  Đức Phật trả lời: tỳ-kheo đã nghe rằng tất cả các pháp đều không đáng để chấp thủ, trực tiếp biết và hiểu thấu tất cả các pháp; bất cứ cảm thọ nào vị ấy cảm nhận, dễ chịu, đau khổ hay không khổ không lạc, vị ấy an trú quán vô thường, quán ly tham, quán đoạn diệt và quán xả bỏ đối với các cảm thọ ấy. An trú quán như vậy, vị ấy không chấp thủ bất cứ điều gì trong đời; không chấp thủ thì không dao động, không dao động thì tự mình tịch diệt, và biết rằng sinh đã tận, việc cần làm đã làm, không còn trở lại trạng thái hiện hữu này. Sakka hoan hỷ, đảnh lễ và biến mất ngay tại chỗ.

  Tôn giả Mahāmoggallāna ngồi gần đó tự hỏi vị thiên ấy có thật sự hiểu lời Phật rồi mới tán đồng không, rồi nhanh như co duỗi cánh tay, Tôn giả đến cõi Ba Mươi Ba, lúc ấy Sakka đang vui chơi trong vườn Một Hoa Sen với năm trăm nhạc khí trời. Tôn giả xin Sakka kể lại lời Đức Phật; Sakka nói mình có nhiều công việc, nhắc trận chiến vừa thắng a-tu-la, và mời Tôn giả xem cung điện Vejayanta mới xây với một trăm tháp, mỗi tháp có bảy trăm phòng; các nữ hầu thấy Tôn giả thì biết hổ thẹn, đi vào phòng riêng như người con dâu gặp cha chồng.

  Thấy vị thiên đang sống quá phóng dật, Tôn giả dùng ngón chân cái làm cung điện rung chuyển dữ dội, khiến Sakka cùng chư thiên cõi Ba Mươi Ba kinh ngạc; rồi Tôn giả hỏi lại câu cũ. Sakka kể lại trọn lời Đức Phật dạy, y như câu trả lời ban đầu. Tôn giả biến mất về Đông Viên; các nữ hầu hỏi có phải đó là Đức Phật, Sakka đáp đó chỉ là vị đồng phạm hạnh, và bảo rằng Đức Phật hẳn còn phi thường hơn nữa.

  Tôn giả trình lại với Đức Phật, và Đức Phật xác nhận đã trả lời Sakka như vậy. Câu trả lời được nhắc lại với cùng một chuỗi: tất cả các pháp không đáng để chấp thủ, quán các cảm thọ là vô thường, ly tham, đoạn diệt, xả bỏ, rồi không chấp thủ, không dao động và tự mình tịch diệt.
