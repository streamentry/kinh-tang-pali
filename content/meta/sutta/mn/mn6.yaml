summary: 'Tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika, Đức Phật dạy các tỳ-kheo hãy sống
  đầy đủ giới hạnh, đầy đủ giới bổn, sống phòng hộ theo giới bổn, có cách hành xử và phạm vi lui tới thích
  hợp, thấy nguy hiểm ngay trong lỗi nhỏ nhất và thọ trì, học tập các điều học.


  Từ đó, Ngài lặp lại một công thức cho từng ước nguyện: nếu một vị tỳ-kheo ước điều gì, thì vị ấy hãy
  làm viên mãn giới hạnh, chuyên tâm vào sự an tịnh nội tâm, không bỏ bê thiền định, thành tựu minh sát,
  và thường lui tới những chỗ ở trống vắng. Các ước nguyện được nêu: mong các bạn đồng tu quý mến, tôn
  trọng; mong nhận được y phục, thức ăn khất thực, chỗ ở, thuốc men; mong sự phục vụ cho người cung cấp
  vật dụng đem lại quả lớn cho họ; mong điều ấy đem lại quả lớn cho người thân đã qua đời khi nhớ đến
  mình với tâm tin tưởng; mong thắng được bất mãn và ham thích, thắng được sợ hãi và khiếp đảm, chứ không
  để chúng thắng mình; mong tùy ý chứng bốn thiền; mong tự thân chứng nghiệm các giải thoát an tịnh thuộc
  vô sắc, vượt qua các sắc pháp.


  Tiếp đó là các ước nguyện về hàng bậc thánh và các thắng trí: do đoạn tận ba kiết sử thành bậc Nhập
  lưu, không còn đọa đường dữ, chắc chắn hướng đến giác ngộ; do đoạn tận ba kiết sử và làm yếu tham, sân,
  si thành bậc Nhất lai, chỉ trở lại thế gian một lần nữa; do đoạn tận năm hạ phần kiết sử được hóa sinh
  và nhập Niết-bàn ngay tại đó; có nhiều loại thần thông, từ hóa một thân thành nhiều thân, đi trên nước
  đến làm chủ thân đến cõi Phạm thiên; với thiên nhĩ nghe âm thanh của chư thiên và loài người; dùng tâm
  hiểu rõ tâm của chúng sinh, từ tâm có tham hay không tham đến tâm được giải thoát hay chưa; nhớ lại
  nhiều đời sống quá khứ với các đặc điểm và chi tiết; thấy với thiên nhãn các chúng sinh chết đi và tái
  sinh theo nghiệp của mình; và tối hậu, do đoạn tận các lậu hoặc, ngay trong đời này bằng thắng trí chứng
  và an trú tâm giải thoát, tuệ giải thoát không còn lậu hoặc.


  Kết thúc, Đức Phật nhắc lại đúng lời khuyên đầu bài về giới hạnh và nói đó là điều Ngài đã nói, chính
  vì điều này mà Ngài nói như vậy. Như vậy mọi ước nguyện, dù nhỏ hay lớn, đều gắn vào cùng một nền tu
  tập được lặp lại suốt bài kinh.'
notes: '  **Bổ sung (2026-10-06):** khôi phục mn6:18.2 — Pāli viết đầy đủ "ajjhattaṁ cetosamathamanuyutto
  anirākatajjhāno vipassanāya samannāgato" (định tĩnh nội tâm, không bài xích thiền định, có tuệ quán)
  không có ký hiệu lược; bản dịch cũ thay bằng dấu lược — lỗi thật, đã dịch lại.

