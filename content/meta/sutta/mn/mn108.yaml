summary: |-
  Kinh Gopaka Moggallāna diễn ra ở Rājagaha, không lâu sau khi Đức Phật nhập diệt, tại công trường xây dựng của Gopaka Moggallāna. Bà-la-môn Gopaka Moggallāna hỏi Tôn giả Ānanda liệu có vị tỳ-kheo nào đầy đủ những pháp ấy hoàn toàn như Đức Thế Tôn. Ānanda thưa không: Đức Thế Tôn là người làm phát sinh con đường chưa từng phát sinh, là bậc biết đường, thông đạt đường; còn nay các đệ tử sống theo con đường, được trang bị về sau.

  Bà-la-môn Vassakāra, đại thần Magadha, đến hỏi tiếp: có vị tỳ-kheo nào được Đức Thế Tôn chỉ định làm nơi nương tựa sau khi Ngài qua đời không; có vị nào được Tăng chúng chỉ định không. Ānanda trả lời không với cả hai, nhưng khẳng định: chúng tôi có nơi nương tựa, chúng tôi nương tựa Pháp. Đó là học giới và bản Pātimokkha do Đức Thế Tôn chế định, tụng đọc ngày Uposatha; khi có vị nhớ lại tội, các tỳ-kheo xử trí đúng theo Pháp — chính Pháp xử trí chúng tôi.

  Về người được kính trọng, cung kính, cúng dường mà nương tựa, Ānanda nêu mười pháp làm khởi lòng tin được Đức Thế Tôn tuyên dạy: có giới hộ trì Pātimokkha; nghe nhiều, suy xét những pháp thiện diệu; biết đủ với tứ vật dụng; chứng bốn thiền; nhiều loại thần thông, thiên nhĩ; biết rõ tâm của chúng sinh khác; nhớ lại nhiều loại đời sống quá khứ; thiên nhãn thấy chúng sinh chết đi, tái sinh tùy nghiệp; và với thắng trí chứng ngộ giải thoát tâm, giải thoát trí vô lậu. Ai có những pháp ấy, các tỳ-kheo kính trọng, nương tựa.

  Vassakāra nhận xét rừng Tre yên tĩnh nhờ các thiền giả, và nhắc lời Đức Phật từng tán thán mọi thiền. Ānanda đính chính: Đức Thế Tôn không tán thán mọi thiền, cũng không phê phán mọi thiền. Theo lời Ānanda, thiền không được tán thán là thiền của kẻ sống với tâm bị tham dục, sân hận, hôn trầm, trạo hối, nghi chi phối mà không biết xuất ly, vẫn tầm tư suy tư với chúng; thiền được tán thán là bốn thiền từ ly dục đến xả niệm thanh sạch. Vassakāra thưa nghe nói Đức Phật phê phán thiền đáng phê phán, tán thán thiền đáng tán thán, rồi từ giã.

  Sau đó Gopaka Moggallāna nói câu hỏi đầu chưa được trả lời, và Ānanda nhắc lại đáp án đầu: không có vị tỳ-kheo nào được đầy đủ những pháp ấy hoàn toàn như Đức Thế Tôn. Toàn bài khắc họa đời sống Tăng sau khi Phật qua đời: nương tựa là Pháp chứ không phải cá nhân được chỉ định, và người xứng đáng kính trọng là người có mười pháp làm khởi lòng tin.
