summary: |-
  Kinh Jīvaka do Đức Phật thuyết tại vườn xoài của Jīvaka Komārabhacca ở Rājagaha. Jīvaka hỏi về tin đồn rằng người ta giết sinh vật riêng để dâng cho sa-môn Gotama, và Ngài biết rõ thịt ấy được giết vì mình mà vẫn ăn, nên có liên can đến việc ấy; xin hỏi những người nói vậy có thuật lại đúng lời Ngài, không xuyên tạc, không có cơ sở chính đáng để bác bỏ hay không. Đức Phật khẳng định những người nói vậy không nói đúng lời Ngài.

  Ngài cho biết trong ba trường hợp Ngài nói thịt không được dùng: khi đã thấy, đã nghe, hoặc có lý do để nghi rằng con vật được giết riêng cho mình; và trong ba trường hợp Ngài nói thịt có thể dùng: khi không thấy, không nghe và không có lý do để nghi như vậy.

  Đức Phật ví dụ tỳ-kheo sống nương vào làng, an trú với tâm từ lan tỏa mọi phương đến toàn thể thế giới, rộng lớn, vô lượng, không thù hận, không ác ý. Khi được mời và dâng thức ăn ngon, vị không nghĩ ước gì về sau vẫn được dâng như thế, mà dùng không trói buộc, không mê đắm, thấy rõ nguy hại, hiểu sự thoát ly, không có ý làm hại mình, người hay cả hai; như vậy là thức ăn không có lỗi. Jīvaka nói Phật là người sống với tâm từ; Ngài chỉ chấp nhận theo nghĩa mọi tham, sân, si có thể sinh ác ý nơi Ngài đã đoạn tận gốc như cây thốt nốt bị chặt ngọn.

  Kinh lặp lại công thức trên cho tâm bi, tâm hỷ, và chi tiết hơn cho tâm xả lan tỏa khắp thế giới; mỗi lần Jīvaka kết luận Phật sống với tâm bi, hỷ, xả, và mỗi lần Ngài chấp nhận theo nghĩa các lậu hoặc có thể làm phát sinh tàn nhẫn, bất mãn hay chống đối đã được đoạn trừ tận gốc, không còn sinh khởi trở lại. Đức Phật nêu năm lý do khiến người giết sinh vật riêng để dâng cho Như Lai hay đệ tử tạo nhiều nghiệp bất thiện: khi ra lệnh đi bắt con vật; khi con vật bị kéo đi với dây buộc ở cổ và chịu đau đớn; khi ra lệnh giết; khi con vật bị giết và chịu đau đớn; và khi đem thức ăn không hợp luật đến dâng.

  Jīvaka tán thán rằng các tỳ-kheo dùng thức ăn hợp luật, thức ăn không có lỗi, và xin quy y Phật, Pháp, Tăng cho đến trọn đời. Bài kinh phân định: con vật bị giết riêng vì người dâng mới là nguồn gốc của nghiệp bất thiện, còn bữa ăn dùng không trói buộc thì không có lỗi.
