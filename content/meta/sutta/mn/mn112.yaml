summary: |-
  Kinh Sáu Pháp Thanh Tịnh do Đức Phật thuyết tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika. Đức Phật dạy các tỳ-kheo cách nhìn một vị tỳ-kheo tuyên bố thắng trí, sinh đã tận, không còn trở lại trạng thái hiện hữu này nữa: chớ vội hoan hỷ, cũng chớ vội bác bỏ; nên hỏi vị ấy bằng những câu hỏi về pháp để lời tuyên bố được kiểm nghiệm qua chính lời đáp.

  Cách hỏi đi qua bốn nhóm pháp, mỗi lời đáp hợp pháp thì hoan hỷ, tán thán rồi hỏi tiếp. Trước hết là bốn loại ngôn từ: điều được thấy, được nghe, được suy cảm, được thức biết, mỗi điều được nói lên đúng như thế; vị tỳ-kheo phải cho biết mình sống đối với cả bốn loại ấy không nương tựa, không hệ lụy, giải thoát, với tâm đã vượt ngoài giới hạn. Rồi hỏi về năm thủ uẩn sắc, thọ, tưởng, hành, thức, về sáu giới đất, nước, lửa, gió, hư không, thức, và về sáu nội ngoại xứ từ mắt và các sắc đến ý và các pháp; với mỗi nhóm, vị ấy lặp lại cùng công thức: mọi hướng đến, chấp thủ, an trú của tâm, chấp trước và tùy miên đối với pháp ấy đã tận, diệt, xả ly, khai thả, tâm được giải thoát do không chấp thủ; với sáu giới, không chấp gì là tự ngã và không có tự ngã nương tựa.

  Câu hỏi cuối cùng: do biết như vậy, thấy như vậy, sự chấp ngã, chấp ngã sở và tùy miên của mạn có được trừ diệt đối với mọi tướng không? Để đáp, vị tỳ-kheo thuật lại trọn con đường đã đi: nghe Pháp, sinh lòng tin nơi Như Lai, rồi cạo bỏ râu tóc, đắp áo cà-sa, ra đi từ nhà vào không nhà. Sau xuất gia, vị ấy sống theo giới hạnh của các tỳ-kheo, xa lìa sát sinh, trộm cắp, nói sai, phi phạm hạnh và các nghề gian lận, no lòng với y phục đủ che thân, vật thực đủ nuôi bụng; kiềm chế các căn, chẳng chấp thủ tướng và tùy tướng; sống tỉnh giác trong mọi hoạt động. Ở chỗ viễn ly, vị ấy thanh lọc tâm khỏi năm triền cái, chứng bốn tầng thiền, rồi với tâm đã định tĩnh, thắng tri như thật khổ, nguồn gốc khổ, sự chấm dứt và con đường chấm dứt khổ, cũng như vậy với các lậu hoặc; tâm được giải thoát khỏi lậu hoặc dục, hữu, vô minh.

  Bài kinh muốn chỉ rằng lời tuyên bố thắng trí được kiểm nghiệm qua chính các câu hỏi pháp ấy, chứ không qua hoan hỷ hay bác bỏ vội; kinh khép lại bằng lời tán thán đồng phạm hạnh.
