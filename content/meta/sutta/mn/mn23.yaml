summary: |-
  Tại rừng Andha, đêm khuya, một vị trời hào quang rực rỡ đến gặp Tôn giả Kumāra Kassapa và đưa ra một câu đố: gò mối này ban đêm bốc khói, ban ngày cháy sáng; vị bà-la-môn bảo người có trí cầm gươm mà đào. Đào lên lần lượt thấy then cửa, con nhái, con đường hai ngã, cái rây lọc, con rùa, dao phay cùng thớt, miếng thịt — bảy thứ đều được bảo lấy ra rồi đào tiếp — và cuối cùng là con rắn, nhưng lần này lại được bảo: hãy để con rắn yên, đừng làm động nó, hãy kính lễ nó. Vị trời nói rằng trong thế giới này không ai giải đáp thỏa đáng câu đố ngoài Như Lai, đệ tử của Như Lai, hay người đã nghe lời giải từ họ, rồi biến mất.

  Sáng hôm sau, Tôn giả Kassapa đem câu đố đến hỏi Đức Phật. Đức Phật giải từng chi tiết: gò mối là thân này, tạo thành từ bốn đại, do cha mẹ sinh ra, nuôi lớn bằng cơm cháo, chịu vô thường, hao mòn, tan rã; bốc khói ban đêm là suy nghĩ, cân nhắc về những việc đã làm ban ngày; cháy sáng ban ngày là đem ra thực hiện bằng thân, lời nói, ý những điều đã suy nghĩ ban đêm. Vị bà-la-môn là Như Lai; người có trí là tỳ-kheo hữu học; gươm là trí tuệ của bậc Thánh; đào là sự khởi lên tinh tấn.

  Bảy vật được lấy ra lần lượt là những gì phải từ bỏ trên đường tu: then cửa là vô minh; con nhái là phẫn nộ và hiềm hận; con đường hai ngã là nghi hoặc; cái rây lọc là năm triền cái — dục tham, sân, hôn trầm-thụy miên, trạo cử-hối quá và nghi; con rùa là năm thủ uẩn; dao phay cùng thớt là năm loại dục lạc giác quan; miếng thịt là sự thích thú và tham đắm. Mỗi khi lấy ra một thứ, lời dạy vẫn là: hãy cầm gươm mà đào tiếp.

  Chỉ con rắn là không bị lấy ra mà được kính lễ, vì con rắn là tên gọi cho vị tỳ-kheo đã đoạn tận các lậu hoặc. Câu đố vì vậy vẽ trọn một con đường: với trí tuệ làm gươm và tinh tấn làm phép đào, vị tu hành lần lượt gỡ bỏ vô minh, sân hận, nghi hoặc, triền cái, chấp thủ vào năm uẩn, dục lạc và tham đắm, cho đến khi chạm đến bậc giải thoát — nơi công việc đào bới dừng lại và sự kính lễ thay thế cho sự lấy ra.
