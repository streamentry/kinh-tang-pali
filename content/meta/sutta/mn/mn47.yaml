summary: |-
  Một thời Đức Phật ở gần Sāvatthī, tại rừng Jeta. Ngài dạy rằng tỳ-kheo biết xem xét, khi không biết trực tiếp tâm người khác, nên điều tra Như Lai qua hai loại pháp có thể nhận biết bằng mắt và tai, để biết Ngài có phải là bậc Chánh Đẳng Giác hay không; các tỳ-kheo xin Ngài tự giải thích.

  Bước đầu, vị ấy điều tra: những điều ô nhiễm có thể thấy hoặc nghe có tồn tại nơi Như Lai hay không, và biết rằng không; những điều pha trộn, khi trong sạch khi ô nhiễm, cũng không; những điều trong sạch có thể thấy hoặc nghe thì có tồn tại. Vị ấy điều tra thêm: Ngài đã an trú trong thiện pháp ấy từ lâu, không phải chỉ mới gần đây; khi đã nổi tiếng và có danh vọng, những nguy hiểm do danh vọng không xuất hiện nơi Ngài; và Ngài từ bỏ vì không sợ hãi, không phải vì sợ hãi, vì đã ly tham, vì tham đã tận, nên không tìm hưởng các dục. Nếu được hỏi căn cứ, vị tỳ-kheo nêu cả thái độ không khinh thường bất kỳ ai quanh Ngài lẫn lời tuyên bố đã nghe trực tiếp từ chính Như Lai.

  Sau đó, chính Như Lai nên được hỏi thêm những câu ấy; Ngài sẽ trả lời: những điều ô nhiễm không tồn tại, những điều pha trộn không tồn tại, những điều trong sạch có tồn tại, đó là con đường Ngài đi, là phạm vi Ngài sống, nhưng Ngài không đồng hóa mình với chúng. Đệ tử nên đến gần vị thầy nói như vậy để nghe Pháp; vị thầy giảng Pháp ngày càng sâu hơn, tinh tế hơn, trình bày cả mặt tối, mặt sáng và sự đối chiếu giữa chúng; càng được giảng như vậy, tỳ-kheo càng trực tiếp biết một số pháp, đi đến kết luận chắc chắn và khởi lòng tin trong sáng nơi bậc thầy: Thế Tôn là bậc Chánh Đẳng Giác, Pháp được Thế Tôn khéo thuyết, Tăng chúng thực hành đúng đắn. Khi được hỏi dựa vào dấu hiệu nào mà nói vậy, ông kể lại chính trải nghiệm nghe Pháp ấy.

  Niềm tin được an lập như vậy được gọi là niềm tin có căn cứ, bắt rễ từ sự thấy biết; nó vững chắc, không thể bị lay chuyển bởi bất kỳ sa-môn, bà-la-môn, vị trời, Māra, Phạm thiên hay bất kỳ ai trên đời. Đó là cách điều tra Như Lai đúng Pháp, và là cách Như Lai được khảo sát kỹ lưỡng theo đúng Pháp.
