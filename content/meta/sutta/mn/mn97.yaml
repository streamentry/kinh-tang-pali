summary: |-
  Kinh Dhanañjāni mở đầu khi Tôn giả Sāriputta du hành trong vùng Núi Phía Nam, hỏi một vị tỳ-kheo vừa từ Rājagaha đến về Đức Phật, Tăng chúng, và Bà-la-môn Dhanañjāni ở cổng trạm thu gạo của thành. Vị tỳ-kheo cho biết Dhanañjāni còn mạnh nhưng phóng dật: mượn danh vua mà cướp bóc các bà-la-môn gia chủ, mượn danh các bà-la-môn gia chủ mà cướp bóc nhà vua; người vợ có tín đã qua đời, ông lại cưới người vợ không có tín.

  Sau khi trở về Rājagaha, Sāriputta gặp Dhanañjāni đang vắt sữa ngoài thành và hỏi ông còn không phóng dật chăng. Dhanañjāni nêu các bổn phận của mình: nuôi cha mẹ, vợ con, đầy tớ làm công; làm bổn phận với bạn bè, thân tộc, khách quý, người quá cố, chư thiên, nhà vua; và nuôi dưỡng cho đầy đặn mập mạp thân xác.

  Sāriputta lần lượt xét từng bổn phận: người vì bổn phận ấy sống phi pháp tà pháp sẽ bị các ngục tốt lôi xuống địa ngục, và cả người ấy lẫn người mà mình phục vụ đều chẳng thể cầu xin được tha; câu hỏi ấy lặp lại cho từng bổn phận. Rồi Ngài hỏi ai tốt hơn: người vì bổn phận ấy sống phi pháp tà pháp hay sống chánh pháp như pháp; Dhanañjāni thừa nhận hành vi chánh pháp tốt hơn hành vi phi pháp. Mỗi lần, Sāriputta kết luận có những nghề nghiệp có gốc rễ, hợp pháp, nhờ đó có thể làm bổn phận ấy, chẳng tạo ác nghiệp, và thực hành con đường phước.

  Một thời gian sau, Dhanañjāni bệnh nặng, mời Sāriputta đến nhà. Nghe ông tả các cảm thọ khổ dữ dội, Sāriputta lần lượt hỏi điều nào tốt hơn: địa ngục hay súc sinh, súc sinh hay ngạ quỷ, ngạ quỷ hay loài người, loài người hay chư thiên Tứ Đại Vương, rồi lần lượt các cõi trời cho đến Hóa Tự Tại, và cuối cùng cõi Phạm thiên. Dhanañjāni reo lên hai lần: ông Sāriputta nói đến cõi Phạm thiên. Sāriputta nghĩ các bà-la-môn hướng về cõi Phạm thiên, bèn giảng con đường đến sống cùng chư Phạm thiên: tâm từ, tâm bi, tâm hỷ, tâm xả lan tỏa các phương, rộng lớn vô lượng.

  Rồi chẳng bao lâu sau khi Sāriputta ra đi, Dhanañjāni qua đời và sinh lên cõi Phạm thiên. Đức Phật hỏi vì sao Sāriputta an lập ông vào cõi Phạm thiên kém cỏi, nơi vẫn còn điều hơn nữa cần làm; Sāriputta đáp vì các bà-la-môn hướng về cõi Phạm thiên. Ý kinh hướng tới điểm ấy: phước lớn của bốn tâm vô lượng vẫn là chỗ ở kém cỏi so với giải thoát, và cách dạy phải tùy theo chỗ hướng của người nghe.
