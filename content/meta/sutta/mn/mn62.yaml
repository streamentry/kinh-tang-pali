summary: |-
  Đại Kinh Giáo Giới Rāhula kể khi Đức Phật ở Sāvatthī, trong rừng Jeta, tại tu viện Anāthapiṇḍika. Buổi sáng đi khất thực, Rāhula theo sau; Đức Phật dạy: bất cứ sắc nào — quá khứ, tương lai hay hiện tại; bên trong hay bên ngoài; thô hay tế; thấp kém hay cao quý; xa hay gần — đều phải thấy đúng như thật bằng chánh trí: cái này không phải của ta, ta không phải là cái này, cái này không phải tự ngã của ta. Khi Rāhula hỏi có phải chỉ sắc thôi, Ngài đáp cả sắc, thọ, tưởng, hành, thức. Rāhula quay lại ngồi gốc cây, kiết già, thiết lập niệm; Tôn giả Sāriputta bảo cậu tu tập niệm hơi thở.

  Buổi chiều, Rāhula hỏi niệm hơi thở tu tập thế nào. Đức Phật dạy năm giới: phần trong thân thuộc về cá nhân là nội giới; nội và ngoại giới cả hai chỉ là giới ấy, phải thấy như trên và yểm ly, làm tâm ly tham. Địa giới như tóc đầu, móng, răng, da, thịt, xương; thủy giới như mật, mủ, máu, mồ hôi, nước tiểu; hỏa giới là cái nhờ đó con ấm áp, già nua, thức ăn được khéo tiêu hoá; phong giới như gió trong bụng, ruột, gió tuần hành và hơi thở vào ra; hư không giới như lỗ tai, mũi, cửa miệng và khoảng trống trong thân.

  Tiếp đó Ngài dạy tu tập thiền định như đất, như nước, như lửa, như gió, như hư không: khi tu tập như vậy, các xúc khả ý và không khả ý đã sinh sẽ không chiếm ngự, trú trong tâm. Ví dụ người ta đổ lên đất cả thứ sạch lẫn không sạch, đất không vì thế mà kinh sợ, hổ thẹn hay ghê tởm; hình ảnh tương tự lặp lại cho nước, lửa, gió, còn hư không không trú chỗ nào.

  Ngài còn dạy sáu thiền định, mỗi pháp đoạn bỏ một điều: lòng từ đoạn bỏ tâm sân, lòng bi đoạn bỏ tâm sát hại, hỷ đoạn bỏ sự bất lạc, xả đoạn bỏ tâm ghét bỏ, bất tịnh đoạn bỏ tâm tham ái, tưởng vô thường đoạn bỏ ngã mạn.

  Cuối cùng, Ngài trình bày niệm hơi thở qua mười sáu bước: có niệm thở vào ra; biết hơi thở dài, ngắn; tập thở vào ra cảm nhận toàn thân, lắng dịu hoạt động của thân; cảm nhận hỷ, lạc, hoạt động của tâm; làm tâm hoan hỷ, định tĩnh, giải thoát; quán vô thường, ly tham, đoạn diệt, xả bỏ. Niệm hơi thở tu tập, làm cho sung mãn như vậy có quả lớn, lợi ích lớn: ngay cả những hơi thở cuối cùng khi chấm dứt cũng được biết rõ.
