summary: |-
  Tại Trúc Lâm gần Rājagaha, Đức Phật nhận xét các căn của Tôn giả Sāriputta hoàn toàn trong sáng, da màu thanh tịnh, rồi hỏi ông thời nay thường trú bằng pháp trú nào. Sāriputta đáp là pháp trú chân không. Đức Phật nói rằng đó chính là pháp trú của bậc đại trượng phu, rồi chỉ cho ông con đường để thường trú như vậy.

  Một tỳ-kheo mong trú bằng pháp trú chân không nên suy niệm dọc con đường vào làng khất thực, tại nơi khất thực và dọc đường trở về: trong lòng có chăng mong muốn, tham, sân, si hay bất mãn đối với các sắc do mắt nhận biết? Công thức ấy lặp lại cho các tiếng do tai, hương do mũi, vị do lưỡi, xúc do thân, pháp do ý nhận biết. Mỗi lần suy niệm có hai lối ra: nếu thấy những pháp ác bất thiện ấy có trong lòng, vị ấy tinh cần để đoạn tận; nếu thấy không có, vị ấy trú với hỷ và hoan lạc ấy, ngày đêm học tập trong các thiện pháp.

  Sau đó là chuỗi tự kiểm tiếp nối, mỗi câu theo cùng quy luật hai phía: năm dục đã đoạn tận chưa, năm triền cái đã đoạn tận chưa, năm thủ uẩn đã hoàn toàn hiểu chưa, bốn niệm xứ, bốn chánh cần, bốn như ý túc, năm căn, năm lực, bảy giác chi và Thánh đạo tám ngành đã tu tập chưa, an tịnh và minh sát đã tu tập chưa, minh và giải thoát đã chứng ngộ chưa. Còn thiếu thì tinh cần để đạt, đã đạt thì trú với hỷ và hoan lạc ấy.

  Đức Phật kết luận rằng mọi đạo sĩ hay bà-la-mon thanh lọc đồ khất thực ở quá khứ, tương lai và hiện nay đều thanh lọc bằng cách suy niệm đi suy niệm lại như vậy. Ý chính của kinh nằm ở đó: đời sống khất thực được thanh lọc không nơi vật dùng, mà nơi việc tự soi lại tâm mình sau từng lần đi và về.
