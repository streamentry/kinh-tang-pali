summary: |-
  Tại xứ Aṅga, gần thị trấn Assapura, Đức Phật gọi các tỳ-kheo và nói rằng người đời nhận biết họ là sa-môn, và chính họ cũng tự nhận vậy; vì đã mang danh ấy, họ nên tu tập những phẩm chất làm nên một sa-môn và một bà-la-môn chân chính, để danh xưng và lời tự nhận là thật, người cúng dường được quả lớn, và đời xuất gia không vô ích.

  Kinh xếp các phẩm chất thành bậc thang: tàm và quý; thân hành, khẩu hành, ý hành và sinh kế trong sạch, minh bạch, không tự đề cao mình hay hạ thấp người khác; hộ trì sáu cửa căn; biết tiết độ trong ăn uống, chỉ ăn để duy trì thân, chấm dứt khó chịu và hỗ trợ phạm hạnh; chuyên tâm tỉnh thức qua các canh ngày đêm; và niệm tỉnh giác trong mọi động tác. Sau mỗi bậc, kinh lặp lại cùng lời nhắc: khi vẫn còn việc cao hơn phải làm, đừng bằng lòng cho là đủ và đừng để mục tiêu của đời sa-môn bị hụt mất.

  Vị tỳ-kheo tìm nơi ở vắng vẻ, ngồi kiết già, và lần lượt từ bỏ năm triền cái: tham, sân hận và ác ý, hôn trầm thụy miên, trạo cử và hối hận, nghi. Kinh ví năm triền cái như món nợ, bệnh tật, nhà tù, cảnh nô lệ và con đường hoang vắng nguy hiểm; khi đã từ bỏ thì như hết nợ, khỏe mạnh, ra khỏi tù, được tự do và đến nơi an toàn. Sau đó vị nhập bốn thiền, mỗi thiền kèm một ví dụ: sơ thiền như khối bột tắm thấm đều nước, nhị thiền như hồ nước có mạch phun từ bên trong, tam thiền như bông sen nuôi trong nước, tứ thiền như tấm vải trắng phủ kín toàn thân.

  Khi tâm đã định tĩnh, trong sạch và vững chắc, vị ấy hướng tâm đến trí nhớ về nhiều đời quá khứ, đến thiên nhãn thấy các hữu tình chết đi và tái sinh theo nghiệp, rồi đến trí đoạn tận các lậu hoặc, bằng biết đúng như thật khổ, nguồn gốc, sự chấm dứt và con đường của khổ cùng của các lậu hoặc. Tâm vị ấy được giải thoát khỏi dục lậu, hữu lậu và vô minh lậu; vị biết sinh đã tận, phạm hạnh đã hoàn thành, không còn trở lại trạng thái hiện hữu này.

  Kết kinh, vị ấy xứng gọi là sa-môn, bà-la-môn, người đã tắm sạch, người đã đạt tri thức, người tinh thông, bậc Thánh và A-la-hán, vì các pháp xấu bất thiện dẫn đến sinh già chết đã lần lượt được làm lắng xuống, loại bỏ, rửa sạch, biết rõ, gột bỏ và xa lìa.
