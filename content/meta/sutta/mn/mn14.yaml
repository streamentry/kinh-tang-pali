summary: |-
  Tiểu Kinh Khổ Uẩn kể rằng ở xứ Sakya, Mahānāma người Sakya thưa với Đức Phật rằng dù đã hiểu lời dạy tham, sân và si là những ô nhiễm của tâm, đôi khi những ý nghĩ ấy vẫn chiếm lấy tâm ông, và tự hỏi phẩm chất nào trong mình khiến điều đó xảy ra. Đức Phật xác nhận có phẩm chất ấy: chừng nào chưa từ bỏ, Mahānāma vẫn sống tại gia và hưởng thụ dục lạc.

  Đức Phật nêu nguyên tắc trung tâm: dục lạc cho ít vị ngọt nhưng mang nhiều khổ đau và phiền não, và nguy hại còn nhiều hơn nữa. Vị đệ tử bậc Thánh dù đã thấy rõ điều đó bằng chánh trí, chừng nào chưa đạt được hỷ lạc tách khỏi dục lạc và các pháp bất thiện, hoặc một trạng thái còn tịch tịnh hơn, vẫn có thể quay lại với dục lạc; đã đạt được thì không còn. Chính Ngài, thời còn là Bồ-tát, cũng thấy rõ điều ấy nhưng chỉ tuyên bố không quay lại với dục lạc sau khi đạt được hỷ lạc ấy.

  Bài phân tích dục lạc được lặp lại: vị ngọt là niềm vui sinh từ năm loại đối tượng kích thích dục lạc, hình sắc, âm thanh, mùi, vị, xúc chạm; nguy hại trải từ người kiếm sống bằng nhiều nghề chịu khổ sở, tài sản khó tích, dễ mất, tranh chấp và chiến trận giữa các tầng lớp và cả trong gia đình, đến cướp của, ngoại tình và các hình phạt, rồi hành xử xấu bằng thân, lời, ý và tái sinh vào địa ngục.

  Câu chuyện với các tu sĩ Nigaṇṭha: họ luôn đứng, từ chối ngồi, chịu đau đớn theo lời dạy của Nigaṇṭha Nāṭaputta, người tự tuyên bố toàn tri toàn kiến: hãy làm mòn nghiệp xấu quá khứ bằng khổ hạnh nghiêm khắc và không tạo nghiệp mới. Đức Phật hỏi họ có biết mình từng tồn tại trong quá khứ, từng làm nghiệp xấu nào, bao nhiêu khổ đã được làm mòn, hay cách từ bỏ pháp bất thiện và tu tập pháp thiện ngay trong đời này; họ đều trả lời không, và Ngài chỉ ra theo lập luận ấy những người hung bạo sau khi tái sinh sẽ xuất gia thành Nigaṇṭha.

  Khi các tu sĩ nói lạc không thể đạt bằng lạc mà phải đạt bằng khổ, ví vua Bimbisāra sống sung sướng hơn Ngài, Đức Phật chỉ ra họ nói vội vàng, rồi hỏi: vua Bimbisāra có thể trải nghiệm an lạc hoàn toàn suốt bảy ngày đêm mà không cử động thân hay nói lời nào không? Không. Còn Đức Phật có thể, từ một đến bảy ngày. Họ thừa nhận Tôn giả Gotama sống an lạc hơn vua Bimbisāra.
