summary: |-
  Kinh Ghaṭīkāra kể khi Đức Phật du hành trong Kosala cùng Tăng chúng đông đảo, rời khỏi đường và mỉm cười tại một khoảng đất. Ānanda hỏi nhân duyên; Đức Phật cho biết thuở xưa tại đây có thị trấn Vebhaliṅga, nơi Đức Phật Kassapa, bậc A-la-hán, Chánh Đẳng Giác, có tu viện và từng giáo giới Tăng chúng. Ānanda trải y mời Phật ngồi, nói khoảng đất này sẽ được hai vị A-la-hán, Chánh Đẳng Giác, sử dụng.

  Đức Phật kể thuở ấy có thợ gốm Ghaṭīkāra là người phụng vụ chính của Đức Phật Kassapa, bạn thân là thanh niên Jotipāla. Ghaṭīkāra rủ bạn yết kiến Phật ba lần nhưng bị từ chối với câu yết kiến vị sa-môn đầu trọc ấy để làm gì. Khi hai người ra sông tắm gội, ông rủ thêm ba lần rồi nắm vạt y, nắm cả tóc Jotipāla; Jotipāla ngạc nhiên vì người thuộc giai cấp thấp dám làm vậy, rồi đồng ý đi. Ghaṭīkāra xin Đức Phật thuyết pháp cho bạn; Jotipāla hỏi sao ông không xuất gia, ông đáp đang nuôi cha mẹ già mù lòa; Jotipāla bèn xin xuất gia.

  Đức Phật Kassapa đến Bārāṇasī; vua Kikī xứ Kāsi dâng cúng rồi ba lần xin Ngài an trú mùa mưa nhưng bị từ chối; nhà vua buồn rầu, hỏi có ai phụng vụ hơn mình không. Đức Phật tả: Ghaṭīkāra quy y Phật, Pháp, Tăng; tránh sát sinh, lấy của không cho, tà hạnh trong dục, nói dối, rượu và chất say; tín bất động, không nghi ngờ về bốn Thánh đế; từ bỏ vàng bạc; không tự tay cầm cuốc đào đất mà lấy đất từ nơi sạt lở hay chỗ chuột đào; nuôi cha mẹ già mù lòa; và đã đoạn tận năm hạ phần kiết sử, hóa sinh, nhập diệt độ tại đó.

  Đức Phật kể ba lần tin tưởng Ghaṭīkāra: tự lấy cơm trong nồi, canh trong chảo tại nhà cha mẹ ông; lấy cháo thô trong hũ; cho tỳ-kheo lật cỏ trên lò gốm lợp túp lều dột. Sau mỗi lần, hỷ lạc không rời Ghaṭīkāra nửa tháng, cha mẹ ông một tuần; cả lò gốm trống trời ba tháng mà không mưa. Vua Kikī gửi năm trăm gánh gạo, Ghaṭīkāra từ chối. Cuối cùng Đức Phật nói chính Ta thời ấy là thanh niên Jotipāla.

  Bài kinh nhằm cho thấy người phụng vụ bậc Chánh Đẳng Giác được đo bằng tín, giới và tâm không nghi ngờ, không bằng địa vị: người thợ gốm hơn nhà vua; và chính Đức Phật Gotama khi còn là Jotipāla đã phải được bạn kiên trì kéo đến yết kiến Phật Kassapa trước khi xin xuất gia.
