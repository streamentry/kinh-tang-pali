summary: |-
  Đại Kinh Phân Biệt Nghiệp đặt ở Rājagaha, Trúc Lâm, khu nuôi sóc: du sĩ Potaliputta gặp Tôn giả Samiddhi và thuật lại lời mình được nghe từ sa-môn Gotama rằng hành động của thân và lời là vô dụng, chỉ hành động của ý là thật sự; Samiddhi khuyên chớ hủy báng Đức Phật. Khi bị hỏi sau khi làm nghiệp có tác ý bằng thân, bằng lời, bằng ý, người ấy cảm giác gì, Samiddhi trả lời tuyệt đối rằng cảm giác khổ; cuộc đối thoại sau đó được trình lên Đức Phật qua Tôn giả Ānanda.

  Đức Phật bảo Ngài còn không nhớ từng thấy du sĩ Potaliputta, và Samiddhi đã trả lời tuyệt đối một điều phải phân tích theo ba thọ. Rồi Đức Phật phân biệt bốn loại người: người đang sát sinh, lấy của không cho, tà dâm, nói dối, hai lưỡi, thô ác, phù phiếm, tham lam, tâm hại người, tà kiến, sinh vào địa ngục; người khác hành như vậy mà sinh vào cõi trời; người từ bỏ cả mười điều ấy, có chánh kiến, sinh vào cõi trời; người khác từ bỏ như vậy lại sinh vào địa ngục.

  Những sa-môn hay bà-la-môn chứng đạt tâm định, bằng thiên nhãn thấy từng trường hợp ấy rồi lần lượt kết luận: có ác nghiệp, có quả của hạnh tà; hoặc không có ác nghiệp; hoặc có thiện nghiệp, có quả của hạnh thiện; hoặc không có thiện nghiệp. Đức Phật cho đúng nguyên lý có ác nghiệp và có thiện nghiệp cùng từng điều đã thấy, không cho nguyên lý phủ định ấy, và trong cả bốn trường hợp không cho là đúng lời khẳng định tất cả, lời ai biết khác là tà, và sự nắm giữ kiên cố, chấp trước rằng chỉ đây là thật, còn lại đều vô dụng, vì sự biết về Đại Phân Biệt Nghiệp của Như Lai là khác thế.

  Người hành ác mà sinh địa ngục là nhờ ác nghiệp cảm quả khổ đã được làm trước, được làm sau, hoặc tà kiến được thọ trì hoàn toàn lúc chết; người hành ác mà sinh cõi trời là nhờ thiện nghiệp cảm quả lạc, hoặc chánh kiến thọ trì hoàn toàn lúc chết; hai trường hợp người từ bỏ cũng vậy, còn quả của hành vi hiện tại được cảm thọ ngay trong hiện tại, kiếp sau, hoặc thời kỳ sau đó. Kinh kết lại: có nghiệp vô hiệu quả mà dường như vô hiệu quả, vô hiệu quả mà dường như có hiệu quả, có hiệu quả và dường như có hiệu quả, có hiệu quả mà dường như vô hiệu quả; điều thấy được ở một người không thể thành quy luật chung cho mọi người.
