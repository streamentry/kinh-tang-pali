summary: |-
  Tại rừng Jeta gần Sāvatthī, Tôn giả Sāriputta giảng cho các tỳ-kheo bốn hạng người được thấy ở đời: người mang uế nhiễm nhưng không biết mình mang; người mang uế nhiễm và biết mình mang; người không mang uế nhiễm nhưng không biết mình không mang; người không mang và biết mình không mang. Trong cả hai cặp, người không biết được xem là kém hơn, người biết được xem là tốt hơn.

  Mahāmoggallāna hỏi nguyên nhân. Sāriputta giải thích: người có uế nhiễm mà không biết sẽ không khởi lòng mong muốn, không nỗ lực, không phát khởi tinh tấn để từ bỏ, nên sẽ chết với tham, sân, si, tâm bị ô nhiễm; người biết sẽ khởi lòng mong muốn, nỗ lực và tinh tấn để từ bỏ, nên chết không còn tham, sân, si. Người không có uế nhiễm mà không biết có thể chú tâm đến tướng đẹp, khiến tham dục xâm chiếm tâm; người biết thì không, nên tham dục không xâm chiếm tâm. Mỗi trường hợp minh họa bằng ví dụ cái bát đồng được rửa hay bỏ nơi bẩn.

  Khi Moggallāna hỏi uế nhiễm là tên gọi cho điều gì, Sāriputta trả lời đó là tên gọi cho những phạm vi của ham muốn xấu, bất thiện, rồi lặp công thức qua một loạt mong muốn: tỳ-kheo mong lỗi mình không bị biết, mong được nhắc riêng, mong bậc Đạo sư chỉ hỏi mình, mong đi đầu khi vào làng, mong chỗ ngồi, thức ăn tốt nhất trong nhà ăn, mong nói lời tùy hỷ, mong thuyết Pháp cho bốn chúng, mong được tôn kính cúng dường, mong được y phục, chỗ ở, thuốc men tốt đẹp; khi điều mong không thành, vị ấy sinh giận dữ và bất mãn, và đó là uế nhiễm.

  Sāriputta nói thêm: nếu mọi người thấy và nghe rằng một vị tỳ-kheo chưa từ bỏ những ham muốn xấu bất thiện ấy, thì dù sống trong rừng, ăn đồ khất thực, mặc y nhặt từ giẻ bỏ, các bạn đồng tu vẫn không tôn kính, cúng dường; ngược lại, vị đã từ bỏ, dù sống trong làng, nhận lời mời dùng bữa, vẫn được tôn kính, cúng dường. Ngài minh họa bằng hai cái bát đồng: một đựng xác rắn, chó hay người, ai nhìn thấy cũng ghê tởm; một đựng cơm ngon nhiều món, ai thấy cũng muốn ăn. Mahāmoggallāna kể ví dụ người thợ bào vành bánh xe cho hết cong, vênh, khuyết đúng như kẻ đứng bên mong muốn: Sāriputta bào bỏ khuyết điểm của người xuất gia chỉ để kiếm sống, còn người xuất gia vì lòng tin thì uống lấy bài Pháp ấy bằng cả lời nói lẫn tâm nghĩ; hai bậc long tượng cùng hoan hỷ tán đồng lời nhau.
