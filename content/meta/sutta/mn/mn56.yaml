notes: |-
  Lớp lỗi dấu lược (Pāli ghi `…` ở giữa khoá, bản Việt bung thành văn xuôi): đã khôi phục 9 dấu lược, mỗi khoá đúng 1, khớp số dấu lược của Pāli sau khi sửa: 9.1, 20.7, 20.9, 20.10, 21.16, 21.19, 21.20, 26.4, 27.8.
  Pāli mở dấu ngoặc kép ở `21.19` còn bản Việt đặt nhầm ở `21.20`; sửa luôn vị trí cho khớp Pāli, vì nếu không sẽ hỏng cân ngoặc của cụm đó. Đây là hệ quả trực tiếp của việc cắt lược trong `21.19` và `21.20`, nên tính vào lát này.
  Hạ điểm chứ không che: `semantic_fidelity` 9.6 xuống 9.5 vì trước lát này còn 9 khoá diễn đạt trọn nơi Pāli đã lược.
  Lưu ý ngoài phạm vi lát này, chưa đụng tới: dấu ngoặc kép của bản Việt lệch `+2` từ trước và vẫn `+2` sau khi sửa (từ khoá `8.3`/`9.4` và `29.2`/`29.3`). Đề nghị người gộp xử lý riêng.

summary: |-
  Kinh Upāli do Đức Phật thuyết tại vườn xoài Pāvārika, Nāḷandā. Tu sĩ Nigaṇṭha Dīgha Tapassī đến trao đổi: Nigaṇṭha Nāṭaputta không quen nói nghiệp mà quen nói phạt, quy định thân phạt, khẩu phạt, ý phạt, và cho thân phạt nặng nhất; Đức Phật khiến ông xác nhận đến lần thứ ba, rồi cho biết ý nghiệp mới nặng nhất. Gia chủ Upāli, đứng đầu cư sĩ Bālaka, xin đi bác bỏ Ngài, dù Tapassī ba lần cảnh báo Đức Phật dùng huyễn thuật lôi cuốn: có thể Upāli trở thành đệ tử Ngài, không ngược lại.

  Đức Phật yêu cầu tranh luận bằng sự thật rồi đưa bốn ví: tu sĩ Nigaṇṭha chết khi tâm bị ràng buộc sẽ tái sinh nơi chư thiên Manosatta; Nigaṇṭha vô tình làm chết sinh vật nhỏ thì không đáng trách nặng, có chủ ý thì đáng trách, mà chủ ý là ý phạt; người cầm kiếm không thể biến Nāḷandā thành đống thịt, nhưng vị có thần thông với một niệm ác có thể biến thành phố thành tro; và Daṇḍaka, Kaliṅga, Mejjha, Mātaṅga thành hoang địa do niệm ác các ẩn sĩ. Upāli thú nhận từ ví dụ đầu đã hoan hỷ, phản bác chỉ để nghe thêm và xin quy y.

  Đức Phật khuyên suy xét kỹ trước khi quyết định, và bảo gia đình ông tiếp tục cho tu sĩ Nigaṇṭha thức ăn như xưa; cả hai khiến Upāli càng kính phục, xin quy y thêm. Ngài thuyết pháp tuần tự từ bố thí, giới hạnh, cõi trời đến bốn sự thật, và pháp nhãn sinh khởi tại chỗ.

  Về nhà, Upāli bảo người giữ cửa đóng với tu sĩ Nigaṇṭha, mở cho tứ chúng của Đức Phật; Nigaṇṭha cần thức ăn thì đứng ngoài nhận. Nāṭaputta ba lần không tin, rồi cùng đoàn đông đi xác minh; trước kia Upāli thường lau ghế cao nhất ôm đỡ ông, hôm nay ông ngồi sẵn trên ghế cao nhất, chỉ nói nếu muốn thì ngồi. Nāṭaputta mắng ông trở về bị mắc trong chiếc lưới giáo pháp rộng lớn, như người ra đi còn đủ hai tinh hoàn, hai mắt mà trở về mất sạch.

  Upāli đáp huyễn thuật lôi cuốn ấy tốt đẹp, rồi kể ví người bà-la-môn già mua khỉ con: khỉ không chịu nổi nhuộm, đập, ép, còn vải mới chịu được; học thuyết Nigaṇṭha bắt mắt với người ngu nhưng không chịu nổi chất vấn, còn lời dạy Đức Phật chịu được khảo sát kỹ. Khi Nāṭaputta hỏi nên xem ông là đệ tử của ai, Upāli chắp tay hướng về Đức Phật đọc mười bài kệ ca ngợi, và đáp rằng như người kết hoa, Phật có hàng trăm phẩm chất đáng ca ngợi. Không chịu nổi, Nāṭaputta phun máu nóng tại đó.
