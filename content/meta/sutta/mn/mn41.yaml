summary: |-
  Một thời Đức Phật cùng Tăng chúng du hành xứ Kosala và đến Sālā, một làng bà-la-môn; các bà-la-môn và gia chủ ở đó đến gặp và hỏi do nhân duyên gì có những hữu tình sau khi thân hoại mạng chung tái sinh vào cảnh giới khổ, nơi xấu, chốn đọa lạc, địa ngục, và do nhân duyên gì tái sinh vào cảnh giới tốt, cõi trời. Đức Phật trả lời ngắn gọn: do hành xử trái Pháp và lệch lạc, do hành xử đúng Pháp và ngay thẳng; được xin giảng rõ, Ngài phân tích chi tiết.

  Hành xử trái Pháp và lệch lạc gồm ba loại về thân: sát sinh, lấy của không cho và tà hạnh trong dục; bốn loại về lời: nói dối, lời chia rẽ, lời thô ác, lời vô ích; ba loại về tâm: tham muốn tài sản của người khác, tâm ác ý muốn các hữu tình bị tiêu diệt, và tà kiến phủ định bố thí, cúng tế, quả của nghiệp, đời này đời sau, mẹ cha và các bậc sống đúng. Do hành xử ấy, hữu tình tái sinh vào cảnh giới khổ, địa ngục.

  Hành xử đúng Pháp và ngay thẳng đối chiếu từng cặp: từ bỏ sát sinh, lấy của không cho và tà hạnh trong dục, sống có lòng thương với mọi sinh vật; từ bỏ nói dối, lời chia rẽ, thô ác, vô ích, thay vào đó hòa giải người đang chia rẽ và nói những lời đúng lúc, có ý nghĩa và lợi ích; tâm không tham muốn tài sản người khác, không ác ý mà mong các hữu tình an vui, và chánh kiến khẳng định có bố thí, cúng tế, quả của nghiệp, đời này đời sau, mẹ cha và các bậc sống đúng. Do hành xử ấy, hữu tình tái sinh vào cảnh giới tốt, cõi trời.

  Kinh nói người sống đúng Pháp và ngay thẳng có thể ước nguyện và việc ấy có thể thành tựu: tái sinh cùng các gia đình sát-đế-lỵ, bà-la-môn hay gia chủ giàu có, và cùng các cõi trời từ Tứ Đại Thiên Vương, qua các cõi Phạm thiên và các cõi trời sắc giới, cho tới các cõi vô sắc; mỗi lần đều nêu lý do: vì người ấy sống đúng Pháp và ngay thẳng. Trên hết, người ấy có thể ước nguyện nhờ đoạn tận các lậu hoặc, ngay trong đời này chứng ngộ và an trú trong tâm giải thoát và tuệ giải thoát không còn lậu hoặc.

  Nghe xong, các bà-la-môn và gia chủ ở Sālā tán thán pháp này như người mở ra điều bị che, chỉ đường cho người lạc, rồi quy y Phật, Pháp và Tăng, xin ghi nhận là những cư sĩ trọn đời.
