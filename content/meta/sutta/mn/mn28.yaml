summary: 'Tại rừng Jeta ở Sāvatthī, Tôn giả Sāriputta thuyết pháp cho các tỳ-kheo. Ngài nêu ví dụ: tất
  cả dấu chân của các loài vật đi trên mặt đất đều đặt vào trong dấu chân voi, nên dấu chân voi là lớn
  nhất; cũng vậy, tất cả các pháp thiện đều nằm trong Bốn Thánh Đế: Khổ Thánh Đế, Khổ Tập Thánh Đế, Khổ
  Diệt Thánh Đế và con đường đưa đến Khổ Diệt.


  Ngài giải thích Khổ Thánh Đế là năm thủ uẩn, sắc thủ uẩn gồm bốn đại cùng sắc do bốn đại tạo thành.
  Với bốn đại địa, thủy, hỏa, phong, Ngài dùng cùng cách trình bày: định nghĩa đại bên trong thuộc thân
  và đại bên ngoài; cả hai đều chỉ là đại ấy, phải được thấy bằng chánh trí là không phải của tôi, không
  phải là tôi, không phải tự ngã của tôi; ngay cả đại bên ngoài rộng lớn tồn tại lâu dài, như đại dương
  cạn dần hay lửa tắt hết nhiên liệu, cũng lộ rõ vô thường, huống gì thân ngắn ngủi này bị ái chấp giữ.


  Khi bị chửi mắng hay đánh đập, vị tỳ-kheo thấy cảm thọ đau ấy có điều kiện là xúc, còn xúc, thọ, tưởng,
  hành, thức đều vô thường; như lời dạy về ví dụ cái cưa, dù bị cắt từng phần thân thể, ai khởi sân là
  không thực hành lời Phật dạy. Vị ấy khơi dậy tinh tấn, thiết lập niệm, thân an tịnh, tâm định, vui lòng
  chịu đựng. Khi nhớ đến Phật, Pháp, Tăng mà xả dựa trên pháp thiện chưa ổn định, vị ấy khởi cảm giác
  cấp thiết như người con dâu gặp cha chồng; nếu xả ấy ổn định, vị ấy hoan hỷ. Ngài kết luận: đến mức
  này, vị tỳ-kheo đã làm được rất nhiều.


  Phần cuối, khoảng trống bao quanh bởi cây, dây leo, cỏ, bùn gọi là nhà; cũng vậy, khoảng trống bao quanh
  bởi xương, gân, thịt, da gọi là sắc. Khi mắt còn nguyên vẹn, sắc ngoài đi vào phạm vi và có chú ý tương
  ứng, loại thức tương ứng xuất hiện; sắc cùng thọ, tưởng, hành, thức ấy được xếp vào năm thủ uẩn; công
  thức lặp lại cho tai, mũi, lưỡi, thân, ý. Vị tỳ-kheo hiểu đó là quy tụ của năm thủ uẩn do duyên sinh;
  ham muốn, chấp thủ, ưa thích, bám víu với chúng là nguồn gốc khổ; từ bỏ, đoạn trừ chúng là sự chấm dứt
  khổ.


  Bài kinh khép lại bằng lời nhắc tới hai lần: ai thấy duyên khởi là thấy Pháp. Trọng tâm là nhìn mọi
  hiện tượng, từ bốn đại tới năm thủ uẩn, như điều kiện và vô thường, để tâm ly tham, không khởi sân dù
  bị xúc phạm.'
