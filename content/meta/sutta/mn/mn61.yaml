summary: |-
  Kinh Giáo Giới Rāhula ở Ambalaṭṭhikā kể khi Đức Phật ở Rājagaha, tại Trúc Lâm, khu nuôi sóc, còn Tôn giả Rāhula đang ở Ambalaṭṭhikā. Buổi chiều, Đức Phật đến nơi ấy; Rāhula sửa soạn chỗ ngồi và đặt nước rửa chân. Sau khi ngồi và rửa chân, Đức Phật dùng bốn hình ảnh với chậu nước: chút nước còn lại, chút nước bị đổ đi, chậu bị lật úp, chậu trống rỗng, lần lượt ví với phẩm chất của một sa-môn nơi người không biết hổ thẹn khi cố ý nói dối: ít ỏi, vứt bỏ, đảo lộn, trống rỗng.

  Tiếp đó là ví con voi chiến của vua từng trải chiến trận: khi vào trận mà vẫn giữ lại không dùng vòi, người quản tượng biết nó chưa phó bỏ mạng sống; khi dùng cả vòi, nó đã phó bỏ mạng sống và không có việc gì nó không làm. Cũng vậy, với người không biết hổ thẹn khi cố ý nói dối, không có việc ác nào người ấy không thể làm. Vì vậy Đức Phật dạy Rāhula: ngay cả để đùa, ta cũng không nói dối. Rồi Ngài lấy ví dụ cái gương dùng để soi xét: Rāhula phải nhiều lần xem xét khi hành động bằng thân, lời và ý.

  Phép xem xét ấy áp dụng cho thân nghiệp, khẩu nghiệp, ý nghiệp, ở ba thời điểm. Trước khi thực hiện, phải xét nghiệp ấy có hại mình, hại người khác hay hại cả hai, có bất thiện, dẫn đến khổ và cho quả khổ không; nếu có, phải hết sức tránh; nếu thiện, dẫn đến an lạc và cho quả an lạc, thì nên thực hiện. Trong khi đang thực hiện, xét như vậy: bất thiện thì dừng lại, thiện thì tiếp tục. Sau khi đã thực hiện, xét lại: nếu bất thiện, với thân nghiệp và khẩu nghiệp phải thú nhận, bộc lộ và trình bày rõ với vị Thầy hoặc người đồng phạm hạnh có trí, với ý nghiệp thì thấy bất an, hổ thẹn và ghê sợ; rồi phòng hộ để không tái phạm. Nếu nghiệp ấy thiện, hãy sống với niềm hỷ và vui ấy, ngày đêm tiếp tục tu học trong các pháp thiện.

  Cuối kinh, Đức Phật khẳng định tất cả sa-môn hay bà-la-môn trong quá khứ, tương lai và hiện nay thanh lọc thân nghiệp, khẩu nghiệp, ý nghiệp đều làm vậy: nhiều lần xem xét rồi thanh lọc từng loại nghiệp. Ngài dạy Rāhula: ta sẽ nhiều lần xem xét rồi thanh lọc thân nghiệp, khẩu nghiệp và ý nghiệp. Bài kinh kết hợp hai điều: không nói dối ngay cả để đùa, và nhiều lần xem xét, thanh lọc từng loại nghiệp trước, trong, sau khi hành động.
