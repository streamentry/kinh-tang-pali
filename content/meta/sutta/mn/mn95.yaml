summary: |-
  Kinh Caṅkī mở ra khi Đức Phật đến làng Bà-la-môn Opāsāda ở Kosala. Bà-la-môn Caṅkī trú tại đó, dạy ba trăm thiếu niên, được vua Pasenadi và Pokkharasāti tôn kính. Nghe Đức Phật đến, các gia chủ đi yết kiến, Caṅkī cũng sẽ đi; năm trăm Bà-la-môn khách khuyên chớ đi, vì sa-môn Gotama mới xứng đáng yết kiến ông. Caṅkī đáp bằng những lời khen Đức Phật và lẽ khách quý đến làng phải được tôn kính; ông nói lời khen về bậc Gotama là vô lượng, rồi mời tất cả cùng đi.

  Trong hội chúng, thanh niên Kāpaṭika, mười sáu tuổi, thông thành ba Vệ Đà, ngắt lời các Bà-la-môn cao niên đang đàm đạo và bị Đức Phật khiêm nhục; Caṅkī bênh vực, nói gã đa văn, đủ sức đối chất. Đức Phật nhìn về phía gã, và Kāpaṭika hỏi: các Bà-la-môn dựa trên truyền khẩu thuở xưa kết luận tuyệt đối: đây mới là chân lý, những điều khác là vô ích.

  Đức Phật hỏi: dù chỉ một vị Bà-la-môn, thầy của các thầy, hay các thần tiên thuở xưa, có ai nói tôi biết, tôi thấy, đây mới là chân lý chăng? Kāpaṭika thừa nhận là không, và nghe ví dụ đoàn người mù nối nhau: kẻ đầu, kẻ giữa, kẻ cuối đều không thấy. Khi gã nói còn nương vào truyền khẩu, Đức Phật nêu năm pháp cho kết quả hai chiều: tín, sở thích, truyền khẩu, suy xét theo dấu vết, chấp nhận tri kiến sau suy tầm; dù điều nào được tín nhiệm, nó vẫn có thể rỗng không, sai sự thật, và điều ngược lại vẫn có thể thật.

  Tiếp theo, các tầng được định nghĩa. Sự gìn giữ sự thật: người có tín nói đó là tín của tôi; chưa phải giác ngộ sự thật. Giác ngộ sự thật: một gia chủ kiểm tra vị tỳ-kheo trên tham, sân, si, thấy cử chỉ thân khẩu của người không tham, sân, si; rồi từ lòng tín đi qua các bước đến tự thân đạt đến chân lý tối thượng; nhưng đó vẫn chưa phải đạt được sự thật. Đạt được sự thật: bằng tập hành, tu tập, làm cho sung mãn các pháp ấy.

  Sau đó, chuỗi câu hỏi về điều quan trọng: với việc đạt được sự thật là nỗ lực; với nỗ lực là ước lượng; với ước lượng là cố gắng; với cố gắng là khát vọng; với khát vọng là chấp nhận Pháp sau suy tầm; rồi kiểm tra ý nghĩa, ghi nhớ, nghe Pháp, lắng tai, phụng sự, đến gần; và với sự đến gần là lòng tín. Caṅkī thú nhận thuở trước khinh miệt những đầu trọc sa-môn, giờ lòng ưa mến, tín nhiệm đã sinh khởi, và ông quy y trọn đời. Bài kinh thay kết luận tuyệt đối dựa trên tín và truyền khẩu bằng con đường kiểm nghiệm từng bước.
