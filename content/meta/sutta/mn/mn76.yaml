summary: |-
  Kinh Sandaka kể khi Đức Phật trú tại tu viện Ghosita ở Kosambī, Tôn giả Ānanda cùng một số tỳ-kheo đến hồ Devakata xem hang động và gặp du sĩ Sandaka cùng hội chúng khoảng năm trăm du sĩ. Sandaka gác chuyện đang dở và mời Tôn giả Ānanda trình bày pháp theo lời thầy mình.

  Tôn giả Ānanda nêu bốn lối sống không phải phạm hạnh mà Đức Thế Tôn chỉ ra, mỗi lối sống từ một chủ trương: con người do bốn đại hợp thành, khi chết đều đoạn diệt, không có quả của nghiệp hay đời sau; dù giết hại hay bố thí, không có điều ác hay phước phát sinh; không có nhân duyên cho sự ô nhiễm hay thanh tịnh, sinh vật bị định mệnh và bản tính chi phối; có bảy thực thể không được tạo ra; sau khi luân hồi qua tám triệu bốn trăm nghìn đại kiếp, cả kẻ ngu lẫn người trí đều chấm dứt khổ. Với mỗi chủ trương, người có trí thấy nếu lời thầy đúng thì sống tại gia cũng có cùng cảnh ngộ, đời tu ấy chỉ là thừa, rồi chán ngán bỏ đi.

  Kế đến là bốn đường tu không đáng tin cậy: thầy tự nhận biết tất cả, thấy tất cả, nhưng lại phải hỏi tên người hay đường đến làng, rồi nói mọi chuyện là phải vậy; thầy dựa vào lời truyền lại, kinh tạng lưu truyền, có điều được nghe đúng có điều nghe sai; thầy chuyên suy luận và tìm xét theo nhận định riêng, có điều được suy luận đúng có điều suy luận sai; thầy chậm hiểu mê muội, khi được hỏi chỉ lảng tránh quanh co. Người có trí nhận ra mỗi đường tu ấy không đáng tin cậy, chán ngán bỏ đi.

  Trái lại, khi Như Lai xuất hiện ở đời, tỳ-kheo theo học Ngài, từ bỏ năm triền cái, chứng bốn thiền, rồi nhớ lại các đời sống quá khứ, thấy chúng sinh chết đi tái sinh theo nghiệp, và biết sự đoạn tận các lậu hoặc, tâm giải thoát khỏi dục lậu, hữu lậu, vô minh lậu. Dưới thầy như vậy, người có trí sống phạm hạnh hết khả năng và thành tựu con đường đúng đắn của pháp thiện.

  Sandaka hỏi tiếp và Tôn giả Ānanda đáp: A-la-hán không thể vi phạm năm điều: cố ý sát sinh, trộm lấy của không cho, quan hệ tình dục, nói dối, tích trữ hưởng dục. Sandaka khuyến khích hội chúng đi sống phạm hạnh dưới Sa-môn Gotama, còn mình thì ở lại vì không dễ từ bỏ lợi dưỡng và danh tiếng. Bài kinh nhằm tương phản giữa những lối sống vô ích, những đường tu bất khả tín với con đường của Như Lai, nơi có nhiều người được giải thoát.
