summary: |-
  Kinh Thiên Sứ được Đức Phật thuyết tại rừng Jeta gần Sāvatthī, tại tu viện ông Anāthapiṇḍika, trước các tỳ-kheo. Nhờ thiên nhãn trong sạch vượt quá mắt người, Đức Phật thấy chúng sinh chết đi tái sinh, thấp kém hay cao quý, may mắn hay bất hạnh, và hiểu chúng sinh đi theo nghiệp: người có thiện hạnh thân, khẩu, ý, không phỉ báng các bậc Thánh, có chánh kiến thì sinh vào cõi trời hay loài người; người có tà hạnh thân, khẩu, ý, có tà kiến thì sinh vào ngạ quỷ, súc sinh hay địa ngục.

  Các ngục tốt dắt người làm ác đến trình vua Yama, tâu tội người ấy không cung kính mẹ, cha, sa-môn, bà-la-môn, trưởng thượng trong gia tộc. Yama lần lượt truy vấn, giáo giới người ấy về năm thiên sứ. Với mỗi thiên sứ, người ngu xác nhận đã thấy dấu hiệu ấy giữa loài người nhưng vì phóng dật đã không khởi nghĩ mình cũng có cùng tính ấy, nên phải làm điều lành bằng thân, lời, ý. Yama nhắc: ác nghiệp ấy không do ai khác làm, chính người ấy đã làm và sẽ cảm thọ quả.

  Năm thiên sứ ấy là: đứa trẻ thơ nằm trong nước tiểu và phân của chính mình, gợi đến tính sinh; người già nua cong queo, gợi đến tính già; người bị trọng bệnh, gợi đến tính bệnh; các vị vua thi hành nhiều hình phạt lên kẻ trộm cướp, nhắc rằng làm ác nghiệp thì ngay hiện tại đã chịu trừng phạt; và xác chết trương phù, mủ rữa, gợi đến tính chết.

  Sau thiên sứ thứ năm, Yama im lặng. Các ngục tốt thi hành hình phạt ngũ xích, đóng cọc sắt nung đỏ vào tay, chân, ngực, rồi nhiều hình phạt khác nữa. Người ấy bị thả vào đại địa ngục tường sắt mái sắt, lửa đập từ bốn vách; thỉnh thoảng có cửa mở, người ấy chỉ thoát ra sau nhiều lần, rồi rơi lần lượt vào địa ngục phân, địa ngục trấu, rừng cây gạo đỏ, rừng lá kiếm và sông nước axit. Khi đáp đói, khát, người ấy bị bắt nuốt đồng nung đỏ, đồng lỏng đang cháy, rồi bị thả lại vào đại địa ngục.

  Kinh chép lời vua Yama thuở xưa mong được thân người, được Như Lai xuất hiện, được nghe Pháp và hiểu Pháp. Đức Phật nói điều này do tự mình biết, thấy, giác ngộ. Bài kệ kết lại: người bị thiên sứ cảnh báo mà vẫn phóng dật sẽ khổ đau lâu dài; còn bậc thiện nhân không phóng dật đối với pháp bậc Thánh, thấy nguy hiểm trong chấp thủ, vô chấp mà được giải thoát, dứt tận khổ sinh khổ tử.
