summary: |-
  Tại rừng Jeta gần Sāvatthī, các tỳ-kheo hỏi Tôn giả Sāriputta: theo nghĩa nào một vị đệ tử bậc Thánh được gọi là người có chánh kiến, quan điểm ngay thẳng, có niềm tin vững chắc nơi Giáo pháp và đã đi vào Giáo pháp chân chánh. Tôn giả trả lời: vị ấy hiểu điều bất thiện và gốc của bất thiện, điều thiện và gốc của thiện; bất thiện là sát sinh, trộm cắp, tà hạnh trong dục, nói dối, nói chia rẽ, nói thô ác, nói vô ích, tham muốn, ác ý, tà kiến, với gốc là tham, sân, si; thiện là những điều ngược lại, với gốc là không tham, không sân, không si.

  Mỗi cách hiểu như vậy đều được kết bằng một công thức: vị ấy hoàn toàn từ bỏ khuynh hướng ngầm của tham, xua tan khuynh hướng ngầm của sân, nhổ tận gốc khuynh hướng ngầm của quan điểm và kiêu mạn 'tôi là', từ bỏ vô minh, làm sinh khởi minh, và chấm dứt khổ ngay trong đời này. Cứ mỗi lần các tỳ-kheo hỏi còn có cách nào khác, Tôn giả lại nêu một chủ đề, mỗi chủ đề được giải bốn điều: định nghĩa, nguồn gốc, sự chấm dứt và con đường đưa đến sự chấm dứt, con đường luôn là Thánh đạo tám ngành.

  Trình tự chủ đề: bốn nguồn nuôi dưỡng (thức ăn ăn được, xúc, ý định của tâm, thức) phát sinh từ ái; khổ với bốn sự thật, từ sinh, già, chết đến năm uẩn bị chấp thủ; già-chết phát sinh từ sinh; sinh phát sinh từ hữu; ba loại hữu (dục, sắc, vô sắc) phát sinh từ thủ; bốn loại thủ (dục thủ, kiến thủ, giới cấm thủ, ngã luận thủ) phát sinh từ ái; sáu nhóm ái phát sinh từ thọ; sáu nhóm thọ phát sinh từ xúc; sáu nhóm xúc phát sinh từ sáu xứ; sáu xứ (mắt, tai, mũi, lưỡi, thân, ý) phát sinh từ danh-sắc; danh-sắc gồm thọ, tưởng, tư, xúc, tác ý và bốn đại cùng sắc, phát sinh từ thức; sáu nhóm thức phát sinh từ ba hành thân, khẩu, tâm; hành phát sinh từ vô minh; vô minh là không biết bốn sự thật về khổ, và phát sinh từ lậu hoặc; ba lậu hoặc (về dục, hiện hữu, vô minh) phát sinh từ vô minh, nên vòng khép lại nơi vô minh và lậu hoặc.

  Như vậy, qua mười sáu cách mô tả, bài kinh cho thấy người có chánh kiến là người hiểu từng mắt xích, từ điều thiện, bất thiện đến các nguồn nuôi dưỡng, khổ và chuỗi duyên sinh, và nhờ hiểu như vậy mà từ bỏ các khuynh hướng ngầm, chấm dứt khổ ngay trong đời này.

notes: |-
  Khôi phục 22 dấu lược theo luật BRIEF_VI3 10.1 (Pāli có …pe… thì bản Việt phải giữ đúng một …, không bao giờ bung lược thành văn). Đây là sửa độ tận trung theo Pāli, không phải dịch mới và không xoá nghĩa: chính Pāli ở những chỗ đó cũng không có chữ.
  Mười khoá dạng công thức …pe… dukkhassantakaro hoti (23.1, 27.1, 31.1, 35.1, 39.1, 43.1, 47.1, 51.1, 55.1, 59.1): bản Việt đã bung cả liệt kê uccheda/bhañja của tham, sân, hữu, kiến và lời thề phạm hạnh. Đã bỏ đúng phần đó, giữ lại … trở bảo câu chấm dứt khổ ngay trong đời này, tức ứng với dukkhassantakaro hoti vốn nằm ngoài khoảng lược.
  Mười một khoá dạng siyā panāvuso …pe… (24.2, 28.2, 32.2, 36.2, 40.2, 44.2, 48.2, 52.2, 56.2, 60.2, 64.2): Pāli chỉ còn hai từ siyā panāvuso, còn bản Việt đã viết ra cả câu hỏi. Đã bỏ phần ứng với aññopi pariyāyo … saddhamman, chỉ giữ lại … có và dấu lược. Nội dung đã lược vẫn đọc được ngay ở khoá 20.2 (bản đủ) trong chính bài này.
  Khoá 70.5 (sammādiṭṭhi …pe… sammāsamādhi): đã thu lại thành chánh kiến … chánh định, khớp với 22.10, 26.5, 30.5, 34.5, 38.5 trong bài và 34 khoá cùng công thức ở các bài khác.
  Không xác định được nên để nguyên: 16 khoá có dấu … ở bản Việt mà Pāli không có (13.1, 13.2, 14.3, 20.1, 20.2, 21.2, 25.2, 33.2, 37.2, 41.2, 45.2, 49.2, 53.2, 57.2, 61.2, 65.1). Đó là lớp lỗi khác (thừa lược, xét theo 10.2) và ngoài lát này, xin người gộp xử lý.
  Trường summary vẫn diễn đạt công thức ấy bằng văn xuôi; để nguyên có chủ ý, vì luật 10.1 chỉ ràng buộc canonical scripture chứ không ràng buộc phần tóm lược.
