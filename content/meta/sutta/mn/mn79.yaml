summary: |-
  Tiểu Kinh Sakuludāyi kể khi Đức Phật ở Rājagaha, tại vườn Bambu. Còn quá sớm để khất thực, Ngài đến tu viện ở Khu Vườn Chim Công gặp du sĩ Sakuludāyī cùng hội chúng đang bàn chuyện thế tục. Sakuludāyī mời Ngài ngồi; cả hội chúng mong nghe Ngài giảng.

  Sakuludāyī kể thuở xưa có bậc tự xưng biết tất cả, khi được hỏi về quá khứ thì né tránh và tỏ phẫn nộ: Nigaṇṭha Nāṭaputta. Đức Phật nói ai nhớ được quá khứ thì hỏi được về quá khứ, ai có thiên nhãn thấy chết tái sinh thì hỏi được về tương lai, rồi thuyết: cái này hiện hữu thì cái này hiện khởi; không hiện hữu thì không hiện khởi. Udāyī nói công thức ấy càng không rõ, và nêu giáo nghĩa đạo sư: đây là quang sắc tối thượng.

  Khi được hỏi quang sắc tối thượng là gì, Udāyī chỉ lặp vòng định nghĩa; ông nói đó là quang sắc của thân vô bệnh sau khi chết, ví như ngọc lưu ly. Ngài so sánh: ngọc lưu ly thua đom đóm, đom đóm thua đèn dầu, đèn thua đống lửa, lửa thua sao mai, sao mai thua trăng rằm, trăng thua mặt trời; hơn thế Ngài còn biết chư thiên mà ánh sáng ấy không chiếu tới, nhưng không nói quang sắc tối thượng. Udāyī thốt lên Đức Phật đã cắt đứt câu chuyện: giáo nghĩa đạo sư trống rỗng khi bị vấn nạn.

  Về thế giới nhất hướng lạc, Udāyī nêu đạo lộ đạo sư mình: từ bỏ sát sinh, lấy của không cho, tà hạnh trong dục, nói dối, sống khổ hạnh. Phật vấn nạn: khi làm những điều ấy, tự ngã có cả lạc và khổ; nương đạo trình lẫn lộn lạc khổ làm sao chứng ngộ thế giới ấy. Udāyī thua lần nữa, rồi hỏi lại; Phật nêu sơ, nhị, tam thiền làm đạo lộ. Udāyī nói đến mức ấy đã chứng ngộ rồi; Phật nói chưa, đó chỉ là đạo lộ; đến tứ thiền, cùng ở với chư thiên thế giới ấy mới là chứng ngộ.

  Udāyī hỏi vì chứng ngộ ấy tỳ-kheo sống phạm hạnh với Phật chăng; Phật đáp có những Pháp cao hơn thù thắng hơn: từ bỏ năm triền cái, chứng bốn thiền, nhớ lại quá khứ, thấy chết tái sinh theo nghiệp, và do lậu hoặc đoạn tận mà tâm giải thoát khỏi dục, hữu, vô minh lậu. Udāyī tán thán, xin quy y và xuất gia, nhưng hội chúng ngăn vì ngài đã là đạo sư. Bài kinh làm lộ những giáo nghĩa vòng vo, không minh chứng được, đối lập với đạo lộ hợp lý mà Đức Phật nêu.
