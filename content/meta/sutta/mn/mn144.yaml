summary: |-
  Đức Phật ở Rājagaha, tại Trúc Lâm. Tôn giả Sāriputta, Tôn giả Mahācunda và Tôn giả Channa đang trú trên núi Gijjhakūṭa, và Channa đang bị trọng bệnh. Sāriputta rủ Mahācunda đi thăm bệnh; sau lời chào hỏi, Sāriputta hỏi thăm sức khỏe.

  Channa đáp không dễ chịu gì; các cảm thọ khổ rất khốc liệt, càng lúc càng gia tăng, không thuyên giảm, và mô tả bằng bốn ví: như bị mũi đục sắc đục vào đầu, như bị sợi dây da chắc buộc chặt quanh đầu, như bụng bị dao sắc xẻ ra, và như bị hai người khỏe mạnh đem thiêu trên than đỏ. Ông nói sẽ dùng dao tự vẫn và không muốn sống nữa. Sāriputta khuyên chớ dùng dao, hứa tìm thức ăn, thuốc men, người chăm sóc; Channa cho biết không thiếu gì cả, lâu nay đã hầu cận bậc Đạo Sư với lòng yêu mến, và nói hãy ghi nhớ rằng Channa sẽ dùng dao tự vẫn mà không có lỗi.

  Sāriputta hỏi Channa có xem mắt, thức mắt và các pháp được biết bởi thức mắt, và lặp lại câu hỏi cho tai, mũi, lưỡi, thân, ý, là của ta, ta là cái này, ngã của ta không; Channa đáp xem như không phải của ta, không phải ta, không phải ngã của ta. Hỏi đã thấy gì, trực tiếp biết gì mà xem như vậy, Channa đáp đã thấy sự đoạn diệt, đã trực tiếp biết sự đoạn diệt.

  Mahācunda nhắc thêm lời giáo huấn cần thường xuyên tác ý: hữu sở y thì có lay động, vô sở y thì không lay động; không lay động thì lắng tịnh, không khuynh hướng, không đi đến đi lùi, không chết đi sinh lại, và không có đời này, đời kia, khoảng giữa hai đời; đây chính là chấm dứt khổ. Hai vị ra đi, và không lâu sau Channa dùng dao tự vẫn. Khi Sāriputta hỏi kiếp sau, Đức Phật xác nhận: riêng việc Channa có những gia đình bạn bè ở làng Pubbajira, Ta không gọi là có lỗi; ai buông bỏ thân này và chấp thủ một thân khác, người ấy Ta gọi là có lỗi; Channa không làm như vậy, hãy ghi nhớ Channa dùng dao tự vẫn mà không có lỗi. Tiêu chuẩn của Đức Phật là: có lỗi là vì buông bỏ thân này mà chấp thủ một thân khác; Channa đã trực tiếp biết sự đoạn diệt, nên dùng dao tự vẫn mà không có lỗi.
