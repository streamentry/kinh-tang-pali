summary: |-
  Đức Phật thuyết cho các tỳ-kheo tại thị trấn Devadaha, xét lý thuyết của các Nigaṇṭha: mọi cảm thọ — lạc, khổ, không khổ không lạc — đều do nghiệp quá khứ; nhờ làm tận cùng nghiệp cũ bằng khổ hạnh, không tạo nghiệp mới, không có sự lưu rơi trong tương lai, nghiệp tận, khổ tận, tất cả khổ được làm tiêu tan.

  Đức Phật kể đã hỏi họ: chư vị có biết quá khứ của mình, các ác nghiệp đã làm, bao nhiêu khổ đã tiêu tan, và sự đoạn tận bất thiện pháp, chứng đạt thiện pháp hiện tại? Họ thừa nhận không biết, nên lời tuyên bố ấy không thích đáng; biết thì mới thích đáng. Ngài ví như người bị mũi tên tẩm độc được chữa lành rồi nhớ lại từng bước đau đã qua. Các Nigaṇṭha đáp dựa vào Nigaṇṭha Nāṭaputta tự nhận toàn tri toàn kiến; Phật nêu năm pháp hiện tại cho kết quả hai chiều — tín, sở thích, truyền khẩu, suy xét theo dấu vết, chấp nhận tri kiến sau suy tầm — mà không thấy sự đáp trả chính đáng nào.

  Tiếp theo, Ngài hỏi khi có nỗ lực mãnh liệt thì họ cảm thọ khổ do nỗ lực, khi không nỗ lực thì không; vậy tuyên bố mọi cảm thọ do nghiệp quá khứ không thích đáng, vì họ hiểu sai do vô minh. Chuỗi câu hỏi xét nghiệp, hiện tại hay đời sau, lạc hay khổ, thuần thục hay chưa, do nỗ lực có thể chuyển đổi thành chăng, câu trả lời đều là không, vậy nỗ lực và tinh tấn của họ vô quả. Theo mười thuyết về duyên của lạc khổ — nghiệp quá khứ, sự sáng tạo của đấng tối cao, kết hợp duyên, chủng tộc sinh, nỗ lực hiện tại — các Nigaṇṭha đều đáng bị chỉ trích.

  Ngược lại, nỗ lực có kết quả là thế nào: vị tỳ-kheo không hành hạ thân bằng khổ, không từ bỏ lạc hợp pháp, không say mê lạc ấy; nguồn gốc khổ nào do nỗ lực khắc phục các hành mà ly tham sinh khởi thì nỗ lực ở đó, nguồn gốc khổ nào do an trú xả mà ly tham sinh khởi thì tu tập xả ở đó, khổ ấy tiêu tan.

  Như Lai xuất hiện thuyết Pháp; người nghe sinh tín, xuất gia, sống giới hạnh, kiềm chế các căn, chứng bốn thiền, đạt ba thắng trí: nhớ các đời sống quá khứ, thấy chúng sinh tái sinh tùy nghiệp, và đoạn tận các lậu hoặc, tâm được giải thoát. Đối lại, lý thuyết của Như Lai đạt đến mười chỗ đáng tán thán: theo từng thuyết ấy, dù có hay không cảm thọ do nhân ấy, Ngài đều đáng tán thán.
