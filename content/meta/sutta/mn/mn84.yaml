summary: |-
  Kinh Madhurā kể chuyện Tôn giả Mahākaccāna trú tại Madhurā, trong rừng Cỏ Găng. Vua Avantiputta đến hỏi về lời các bà-la-môn vẫn nói: chỉ có Bà-la-môn là đẳng cấp tối thượng, các đẳng cấp khác hạ liệt, đen; chỉ Bà-la-môn được thanh tịnh, là con trai của Phạm thiên, sinh từ ngực, từ miệng của Phạm thiên. Tôn giả đáp đó chỉ là lời đồn ở đời.

  Tôn giả lập luận từng bước, hỏi về bốn đẳng cấp: Sát-đế-lợi, Bà-la-môn, Phệ-sa và Thủ-đà. Trước hết, người thuộc đẳng cấp nào sống sung túc thì người hầu hạ trung thành, dậy sớm, thức khuya, thi hành mệnh lệnh của chủ có thể thuộc cả bốn đẳng cấp; hỏi theo bốn lượt, vua thừa nhận bốn đẳng cấp bình đẳng. Kế đến, người thuộc đẳng cấp nào sát sinh, lấy của không cho, tà hạnh trong dục, nói dối, hai lưỡi, lời ác, phù phiếm, tham lam, bụt miệng, tà kiến thì sau khi thân hoại sinh vào cõi ác, cảnh giới xấu, dữ đọa, địa ngục; vua lại thừa nhận sự bình đẳng.

  Ngược lại, người thuộc đẳng cấp nào tránh các việc ấy và có chánh kiến thì sinh lên cõi lành, cõi trời. Tương tự, kẻ thuộc đẳng cấp nào trộm cướp hay tư thông vợ người, nếu bị bắt đưa đến, sẽ bị chém giết, tra tấn, trục xuất hay phạt tùy tội trạng, vì danh xưng đẳng cấp trước đây đã mất, chỉ còn bị tính là kẻ trộm. Còn ai thuộc đẳng cấp nào cạo bỏ râu tóc, đắp áo cà-sa, xuất gia, sống phạm hạnh, có giới hạnh, theo thiện pháp, thì vua sẽ đảnh lễ, mời ngồi, cúng dường y phục, đồ khất thực, chỗ nằm, thuốc men, và bảo vệ che chở, vì danh xưng cũ đã mất, chỉ còn bị tính là sa-môn. Với từng phép thử, vua thừa nhận bốn đẳng cấp là bình đẳng.

  Vua tán thán: như dựng đứng vật bị lật ngược, phơi bày điều bị che kín, chỉ đường cho kẻ lạc lối, hay cầm đèn trong bóng tối, Tôn giả đã trình bày Pháp bằng nhiều phương tiện; vua xin quy y Tôn giả, Pháp và Tăng. Tôn giả hướng vua về Đức Phật, bậc mà mình đã quy y; nghe tin Đức Phật đã nhập diệt độ, vua nói nếu nghe Đức Phật ở trong vòng mười, năm mươi hay trăm do-tuần, mình sẽ đi yết kiến; và quy y Đức Phật ấy, Pháp và Tăng chúng tỳ-kheo trọn đời.

  Qua đó, kinh bác bỏ ưu thế đẳng cấp do sinh ra: hành động, không phải dòng dõi, quyết định người ta được tính là kẻ trộm hay sa-môn.
