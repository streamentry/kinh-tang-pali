notes: |-
  Khôi phục 9 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Năm khoá lược ở cuối khoá (18.3, 19.3, 20.3, 24.3, 33.21): Pāli chỉ còn phần danh từ và động từ, còn bản Việt đã viết thêm các vế đã lược; đã bỏ, chỉ giữ lại phần có thật trong Pāli rồi đặt … ở cuối.
  Hai khoá công thức thiền (26.1, 27.1): đã bỏ phần thuộc tính theo khoảng lược, đặt … đúng chỗ Pāli lược. Ở 27.1 dấu nháy kép nằm trọn trong khoảng lược nên bỏ luôn, ngoặc kép của cả bài vẫn cân.
  Hai khoá 34.3 và 35.3: đã đối chiếu hai bản đủ ở 34.1 và 35.1 ngay trong bài để biết khoảng lược che gì, rồi bỏ đúng phần đó. Ở 35.3 dấu nháy kép nằm trọn trong khoảng lược nên bỏ luôn.
  Lớp lược trần (Pāli ghi `…` ở ranh giới khoá, bản Việt viết đủ thành văn) đã khép lại ở bài này: 34 khoá đều đã khôi phục dấu lược, không còn khoá nào lệch. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Bốn vế Thánh đế (14.2, 14.3, 14.6, 14.7): lược nằm giữa cặp, nửa `…` ở cuối khoá này và nửa kia thành tròn ở khoá kế. Công thức đầy đủ đứng ngay tại 14.1 và 14.4 trong cùng bài, nên đã bỏ đúng vế Khi được hỏi, Ta giải thích cho họ; câu trả lời của Ta khiến họ thỏa lòng.
  Quán sát (15.3, 15.4): lược nuốt vế `ātāpī sampajāno satimā vineyya loke abhijjhādomanassaṁ`; đã bỏ từ nhiệt tâm trở đi.
  Năm căn, năm lực, bảy giác chi (18.4, 18.5, 19.4, 19.5, 20.4-20.7): lược nuốt vế `upasamagāmiṁ sambodhagāmiṁ`, hoặc vế `vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ`; đã bỏ các vế ấy.
  Mười biến xứ (24.4-24.10): lược nuốt vế `uddhamadho tiriyaṁ advayaṁ appamāṇaṁ`; đã bỏ vế ở trên, ở dưới, khắp chiều ngang, không phân chia, vô lượng.
  Nhận biết tâm (33.22-33.34): lược nuốt vế lặp `sadosaṁ cittan’ti pajānanti` và các vế sau; đã bỏ vế là tâm có sân, là tâm không sân, v.v. Dấu ngoặc kép của cả bài vẫn cân.
  Không có khoá nào phải để nguyên vì không xác định được vế đã bung.
  Lưu ý cho người gộp: ở 14.3 và 14.7 Pāli chỉ giữ lại `dukkhanirodhaṁ`, còn bản Việt vẫn giữ chủ ngữ Họ hỏi Ta về Thánh đế về của cả công thức. Đây là lựa chọn theo đúng tiền lệ 33.21 và 18.3 trong chính bài này (giữ chủ ngữ, bỏ vế sau lược), không phải dịch lại từ đầu; nếu biên tập muốn cắt cả chủ ngữ thì số dấu lược sẽ không còn khớp.
  Sau khi sửa, quét lại toàn bộ bài cho thấy không còn khoá nào lệch số dấu lược với Pāli.
