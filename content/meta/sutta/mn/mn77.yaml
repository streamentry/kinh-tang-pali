notes: |-
  Khôi phục 9 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Năm khoá lược ở cuối khoá (18.3, 19.3, 20.3, 24.3, 33.21): Pāli chỉ còn phần danh từ và động từ, còn bản Việt đã viết thêm các vế đã lược; đã bỏ, chỉ giữ lại phần có thật trong Pāli rồi đặt … ở cuối.
  Hai khoá công thức thiền (26.1, 27.1): đã bỏ phần thuộc tính theo khoảng lược, đặt … đúng chỗ Pāli lược. Ở 27.1 dấu nháy kép nằm trọn trong khoảng lược nên bỏ luôn, ngoặc kép của cả bài vẫn cân.
  Hai khoá 34.3 và 35.3: đã đối chiếu hai bản đủ ở 34.1 và 35.1 ngay trong bài để biết khoảng lược che gì, rồi bỏ đúng phần đó. Ở 35.3 dấu nháy kép nằm trọn trong khoảng lược nên bỏ luôn.
  Lớp lược trần (Pāli ghi `…` ở ranh giới khoá, bản Việt viết đủ thành văn) đã khép lại ở bài này: 34 khoá đều đã khôi phục dấu lược, không còn khoá nào lệch. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Bốn vế Thánh đế (14.2, 14.3, 14.6, 14.7): lược nằm giữa cặp, nửa `…` ở cuối khoá này và nửa kia thành tròn ở khoá kế. Công thức đầy đủ đứng ngay tại 14.1 và 14.4 trong cùng bài, nên đã bỏ đúng vế Khi được hỏi, Ta giải thích cho họ; câu trả lời của Ta khiến họ thỏa lòng.
  Quán sát (15.3, 15.4): lược nuốt vế `ātāpī sampajāno satimā vineyya loke abhijjhādomanassaṁ`; đã bỏ từ nhiệt tâm trở đi.
  Năm căn, năm lực, bảy giác chi (18.4, 18.5, 19.4, 19.5, 20.4-20.7): lược nuốt vế `upasamagāmiṁ sambodhagāmiṁ`, hoặc vế `vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ`; đã bỏ các vế ấy.
  Mười biến xứ (24.4-24.10): lược nuốt vế `uddhamadho tiriyaṁ advayaṁ appamāṇaṁ`; đã bỏ vế ở trên, ở dưới, khắp chiều ngang, không phân chia, vô lượng.
  Nhận biết tâm (33.22-33.34): lược nuốt vế lặp `sadosaṁ cittan’ti pajānanti` và các vế sau; đã bỏ vế là tâm có sân, là tâm không sân, v.v. Dấu ngoặc kép của cả bài vẫn cân.
  Không có khoá nào phải để nguyên vì không xác định được vế đã bung.
  Lưu ý cho người gộp: ở 14.3 và 14.7 Pāli chỉ giữ lại `dukkhanirodhaṁ`, còn bản Việt vẫn giữ chủ ngữ Họ hỏi Ta về Thánh đế về của cả công thức. Đây là lựa chọn theo đúng tiền lệ 33.21 và 18.3 trong chính bài này (giữ chủ ngữ, bỏ vế sau lược), không phải dịch lại từ đầu; nếu biên tập muốn cắt cả chủ ngữ thì số dấu lược sẽ không còn khớp.
  Sau khi sửa, quét lại toàn bộ bài cho thấy không còn khoá nào lệch số dấu lược với Pāli.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 23.3, 23.6, 23.9, 23.12, 23.17, 23.22, 23.27, 23.32
  (công thức thắng xứ; flag ở 23.32, cả tám khoá cùng công thức được đồng nhất trong bài) — ‘Sau khi làm
  chủ các sắc ấy, vị ấy có tưởng như sau: ‘Ta biết, ta thấy.’’ → ‘‘Sau khi chế ngự các sắc ấy, tôi biết,
  tôi thấy’ — vị ấy có tưởng như vậy.’ (dạng đa số, 17/28 khoá trùng). Khoá 20.2, 20.8 — ‘dựa vào … dựa
  vào sự diệt … buông xả’ → ‘y cứ vào viễn ly, y cứ vào ly tham, y cứ vào diệt tận, và hướng đến buông
  bỏ’ (16/26 khoá trùng ở `upekkhāsambojjhaṅgaṁ …`). Khoá 29.2, 29.10 — chỉ đổi dấu ‘.’ thành ‘;’ cho
  khớp Pāli; 29.3, 29.11 — ‘Còn thức này của ta nương vào thân ấy, bị ràng buộc với thân ấy’ → ‘còn thức
  này của ta thì nương nơi đây, bị trói buộc nơi đây’ (`ettha` là ‘nơi đây’, bản cũ thêm ‘thân ấy’; 3/4
  khoá trùng). Giữ nguyên năm vế ‘vô thường, hao mòn, hư tổn, tan rã, hủy hoại’ ở 29.2/29.10: dạng đa số
  chỉ có bốn vế (‘chịu vô thường, hao mòn, vỡ hoại, tan rã’) nên thiếu một vế của
  `aniccucchādanaparimaddanabhedanaviddhaṁsanadhammo`.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt hai, ngưỡng lỏng): khoá 22.8 — «các tưởng về sự va
  chạm đã lắng xuống» → «do các tưởng về sự va chạm chấm dứt» (`paṭighasaññānaṁ atthaṅgamā`:
  `atthaṅgama` là sự chấm dứt, và vế này song song với `samatikkamā`, `amanasikārā`); giữ «không
  gian» và «ý niệm» cho khớp 22.10, 22.12, 24.10 của bài. Giữ nguyên khoá 29.2, 29.10 (đủ năm vế của
  `aniccucchādanaparimaddanabhedanaviddhaṁsanadhammo`, dạng đa số chỉ có bốn), 30.10 («lớp da lột»
  khớp 30.8 và bản Anh «slough»), 22.10, 22.12, 23.16–23.31 (đủ bốn vế màu sắc
  `vaṇṇa/nidassana/nibhāsa`), 29.6, 29.8, 3.4, 4.1, 4.2, 5.2, 5.11 vì đúng nghĩa và chỉ khác dạng đa
  số ở văn phong hoặc ở tên riêng Moranivāpa, giữ nguyên dạng Pāli.

summary: |-
  Đại Kinh Sakuludāyī kể khi Đức Phật ở Rājagaha, tại Trúc Lâm. Còn quá sớm để khất thực, Ngài đến khu vườn du sĩ ở Moranivāpa, gặp du sĩ Sakuludāyī cùng hội chúng đông đảo đang bàn chuyện thế tục. Sakuludāyī mời Ngài ngồi và kể chuyện mấy hôm trước.

  Trong hội trường, các sa-môn bà-la-môn nhiều giáo phái thảo luận: các vị lãnh đạo hội chúng đã đến Rājagaha an cư mùa mưa, ai được đệ tử cung kính và cúng dường. Pūraṇa Kassapa và Nigaṇṭha Nāṭaputta không được cung kính: có đệ tử xúi người khác đừng hỏi thầy mà hỏi mình, nhiều đệ tử phản bác thầy rồi bỏ đi. Còn sa-môn Gotama được cung kính, và kể cả ai hoàn tục cũng chỉ trách mình mà vẫn khen ngợi Đạo Sư, Pháp và Tăng.

  Đức Phật hỏi Udāyī thấy bao nhiêu phẩm chất nơi Ngài. Udāyī nêu năm: ăn ít; biết đủ với bất cứ y, thức ăn khất thực, chỗ ở nào; và sống viễn ly. Đức Phật bác từng điều: đệ tử ăn ít hơn Ngài nhưng Ngài đôi khi ăn đầy bát; đệ tử mặc y phấn tảo nhưng Ngài đôi khi nhận y do gia chủ dâng; đệ tử chỉ ăn thức khất thực nhưng Ngài đôi khi nhận lời mời; đệ tử sống dưới gốc cây, nơi rừng vắng nhưng Ngài đôi khi ở nhà kín gió, giữa đông đảo mọi người. Không phải vì năm phẩm chất ấy.

  Ngài nêu năm phẩm chất thật: giới hạnh thành tựu giới uẩn tối thượng; tri kiến vượt trội, chỉ nói tôi biết khi thực sự biết, giảng pháp có căn cứ và minh chứng; trí tuệ cao quý, thấy trước hướng tranh luận và bác bỏ học thuyết đối lập; khi đệ tử bị khổ nhấn chìm mà hỏi về bốn Thánh đế, câu trả lời khiến họ thỏa lòng; và việc đã chỉ dạy con đường thực hành.

  Thực hành theo con đường ấy, các đệ tử tu tập bốn niệm xứ, bốn chánh cần, bốn như ý túc, năm căn, năm lực, bảy giác chi, Thánh đạo tám ngành, tám giải thoát, tám thắng xứ, mười biến xứ và bốn thiền; rồi biết rõ thân vô thường mà thức nương vào, tạo thân do tâm tạo, thực hiện thần thông, biết tâm người khác, nhớ lại nhiều đời trước, thấy chết tái sinh theo nghiệp, và chứng tâm giải thoát khi các lậu hoặc đoạn tận. Bài kinh nhằm chỉ ra điều khiến đệ tử nương tựa không phải khổ hạnh bề ngoài, mà là giới, tri kiến, trí tuệ và con đường bậc thầy mở ra.
