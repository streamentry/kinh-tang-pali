notes: |-
  Lượt cải thiện 2026-10-14. Đọc đối kháng 162 khoá Pāli↔Việt; sửa 86 khoá, không đổi tập khoá hay thứ tự khoá.
  1) Công thức tinh tấn (10.15–18, 11.15, 11.18, 12.16, 12.19, 13.16, 13.19; 10 khoá). Pāli `chandaṁ janeti vāyamati vīriyaṁ ārabhati cittaṁ paggaṇhāti padahati`. Bản cũ dịch `paggaṇhāti` là hộ trì tâm (nghĩa là bảo vệ, lệch với nâng đỡ, đưa lên), `chanda` là nhiệt tâm, và bỏ chữ phát khởi của `ārabhati`. Đã sửa thành khởi ý muốn, nỗ lực, phát khởi tinh tấn, nâng đỡ tâm và cố gắng, theo tiền lệ của tầng: ý muốn 12/16 khoá (dn22 21.20–23, dn33 1.11.10–13, mn77 16.2–5; mn141 29.2–5 dùng ước muốn); nâng đỡ tâm 8 khoá (mn77, mn141) ngang nâng tâm 8 khoá (dn22, dn33); cố gắng 12/16 khoá, gắng sức 4 khoá (mn77). Cùng khoá 10.18, 11.18, 12.19, 13.19: không quên lãng đổi thành không bị mất đi theo mn77 16.5 và dn33 1.11.13 (`asammosāya`). Loại sửa: sai nghĩa mức vừa cho `paggaṇhāti`, nhẹ cho các chỗ còn lại.
  2) Danh xưng `thapati` (73 khoá có từ này). Bản cũ dịch đốc công, một mình bài này trong toàn tầng; cùng nhân vật Pañcakaṅga ở mn59, mn127, sn36.19 đều là người thợ cả (33 khoá, không nơi nào dùng đốc công). Đã đổi thành người thợ cả Pañcakaṅga và khi xưng hô là này thợ cả, để cùng một người không đổi nghề giữa các bài. Loại sửa: thuật ngữ.
  3) Khoá 2.4–2.6: `paṭisallīna` đổi thiền tịnh thành độc cư (tầng: độc cư 56 khoá, thiền tịnh 15 khoá; dn25 1.7–1.9 cùng công thức dùng độc cư); `manobhāvanīya` đổi đáng quý thành đáng kính (dn16 5.7, dn25 1.8–1.9, mn143 15.5 đều dùng đáng kính).
  4) Khoá 8.1 `Evaṁ vutte`: Khi nghe xong đổi thành Khi được nói vậy (tầng: 127 khoá mở đầu bằng Khi được nói; Khi nghe xong chỉ có ở khoá này).
  5) Khoá 10.6, 11.6, 12.6, 13.6: Pāli có nháy đơn quanh `cittasamuṭṭhānā` và `saññāsamuṭṭhānā`; bản cũ bỏ nháy, đã khôi phục. Bốn khoá 8.3–8.6 giữ nháy đơn ở ý niệm thân, lời nói, suy nghĩ, sinh kế dù Pāli chỉ có `ti` (không có dấu), vì `ti` chính là dấu trích; đây là lựa chọn ghi chú.
  Bất định còn lại, không phân xử được bằng căn cứ trong kho: (a) `bhāvanāya pāripūriyā` ở 10.18 và các khoá cùng công thức: bản này đọc là viên mãn do tu tập (một vế), còn các bài dn22, dn33, mn77, mn141 tách thành tu tập và viên mãn; cả hai cách đọc đều có người theo, đã chọn một vế và nêu ở đây. (b) `uttamapattipatta` dịch là chứng đắc mục đích tối thượng (14 khoá): `patti` là sự chứng đắc, mục đích là thêm nghĩa nhẹ; không có bài song song trong kho để phân xử nên giữ, ghi để biên tập viên cân nhắc. (c) `paramakusala` dịch là tối thắng thiện pháp: Hán–Việt hơi nặng nhưng chưa có tiền lệ khác trong kho. (d) `tindukācīre` đọc là được bao quanh bởi những cây tindukā (dn9 1.3 dịch là hàng cây mun tinduka); chưa xác định được nghĩa khác.
  Điểm: terminology 8.9 lên 9.1 (các sửa ở mục 2, 3, 4 và công thức); technical_integrity đặt 9.6, chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` ở lượt này. Các tiêu chí khác giữ nguyên vì không có cải thiện tương ứng.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 13.9 và sửa lan 13.2 — «ly dục» → «xuất ly», «không gây hại» → «không hại» (`nekkhamma` 128 so với 38 khoá «ly dục»; `avihiṁsā` 38 so với 12); khoá 3.8 và sửa lan 3.9 — «im lặng» → «yên lặng», «ưa… rèn luyện trong…» (`appasadda`: dn25, dn9, an10.93, an10.94 dùng «yên lặng»); giữ «im lặng» ở khoá 3.5 vì là lời yêu cầu «hãy im lặng».

summary: |-
  Kinh Samaṇamuṇḍika kể khi Đức Phật ở Sāvatthī, tại rừng Jeta, tu viện Anāthapiṇḍika. Người thợ cả Pañcakaṅga định yết kiến giữa ban ngày nhưng thấy Đức Phật và các tỳ-kheo đang độc cư, bèn đến du viện Một Sảnh của bà Mallikā, nơi du sĩ Uggāhamāna Samaṇamuṇḍikāputta cùng khoảng năm trăm du sĩ đang bàn chuyện thế tục. Uggāhamāna nói người không hành ác nghiệp bằng thân, không nói lời ác, không khởi suy nghĩ ác, không sống bằng ác mạng là sa-môn bất khả chiến thắng. Pañcakaṅga không hoan hỷ cũng không bác bỏ, đi trình lại với Đức Phật.

  Đức Phật đáp: nếu vậy một cậu bé thơ nhỏ mọn, ngây ngô, nằm ngửa cũng là sa-môn bất khả chiến thắng, vì thân, lời nói, suy nghĩ và mạng sống của bé còn không có, ngoài cựa mình, khóc lóc, bập bẹ, bú sữa mẹ. Người có bốn phẩm chất ấy được mô tả không phải là sa-môn bất khả chiến thắng, mà chỉ đạt đến ngang hàng với cậu bé thơ.

  Sa-môn bất khả chiến thắng thật sự phải có mười phẩm chất, gồm bốn nhóm điều nên hiểu rõ. Giới bất thiện là ác nghiệp bằng thân, ác nghiệp bằng khẩu và ác mạng; chúng sinh từ tâm có tham, sân, si; chấm dứt nơi vị từ bỏ thân, khẩu, ý ác hạnh và sống chánh mạng. Giới thiện là thiện nghiệp bằng thân, thiện nghiệp bằng khẩu, cùng sự thanh tịnh của mạng sống; chúng sinh từ tâm không tham, không sân, không si; chấm dứt nơi vị có giới nhưng không phải chỉ do giới mà thành, và biết đúng như thật tâm giải thoát cùng tuệ giải thoát.

  Suy nghĩ bất thiện gồm suy nghĩ dục, sân hận, gây hại, sinh từ các tưởng tương ứng; chấm dứt nơi sơ thiền. Suy nghĩ thiện là suy nghĩ ly dục, không sân, không gây hại, sinh từ các tưởng tương ứng; chấm dứt nơi nhị thiền. Thực hành để từng nhóm chấm dứt là bốn chánh cần: khởi ý muốn, nỗ lực, phát khởi tinh tấn, nâng đỡ tâm và cố gắng để pháp bất thiện chưa sinh không sinh, đã sinh được đoạn bỏ, pháp thiện chưa sinh được sinh, đã sinh được viên mãn.

  Đức Phật xác định cá nhân có mười phẩm chất, tức mười thành tựu vô học gồm chánh kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm, chánh định, chánh trí và chánh giải thoát, mới được gọi là sa-môn bất khả chiến thắng. Bài kinh nhằm phân biệt mức chỉ có không làm điều ác với việc hiểu rõ nguồn gốc và sự chấm dứt của thiện bất thiện, rồi chứng đạt các phẩm chất vô học.
