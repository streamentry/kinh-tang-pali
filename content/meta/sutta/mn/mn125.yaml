summary: |-
  Tại Trúc Lâm gần Rājagaha, vương tử Jayasena đến chỗ sa-di Aciravata xin nghe về câu: vị tỳ-kheo sống không phóng dật, nhiệt tâm, kiên quyết, có thể chạm đến sự nhất tâm của tâm. Sa-di ngại thuyết, theo lời nài nỉ vẫn thuyết. Vương tử tuyên bố điều ấy không thể có rồi bỏ đi.

  Sa-di thuật lại với Đức Phật. Đức Phật nói không thể khác được: vương tử đang sống giữa các dục, bị các dục tưởng nuốt chửng, bị nhiệt não dục thiêu đốt — làm sao biết, thấy hay chứng điều cần biết bằng sự ly dục. Ngài nêu hai ví dụ: voi ngựa bò thuần hóa khéo làm được việc của loài thuần hóa, còn con chưa thuần hóa thì không; và hai người bạn đi núi — người dưới chân nói không thể có chuyện từ đỉnh núi thấy vườn rừng, hồ sen, nhưng khi được dẫn lên đỉnh thấy rồi thì thừa nhận trước kia bị ngọn núi che lấp.

  Vương tử Jayasena bị khối vô minh che lấp còn lớn hơn ngọn núi ấy; nếu hai ví dụ ấy khởi lên, vương tử đã tịnh tín. Ví dụ trung tâm: vị vua quán đảnh sai người săn voi trói voi rừng với voi vương, dẫn ra chỗ trống trải — vì chỗ bám víu của voi rừng chính là rừng voi. Người thuần voi đóng cọc lớn trói nó, bắt đầu bằng lời nói dịu dàng và cỏ thức ăn nước, rồi đưa dần các việc phải làm cho đến việc gọi là bất động, nơi voi kham nhẫn các đòn giáo kiếm tên búa và các tiếng trống kèn, xứng đáng với nhà vua.

  Cũng vậy, khi một Như Lai xuất hiện và thuyết Pháp, một gia chủ nghe, khởi lòng tin, xuất gia — đến chừng ấy vị Thánh đệ tử mới đến chỗ trống trải, vì chỗ bám víu của chư thiên và loài người chính là năm đối tượng dục. Như Lai huấn luyện tuần tự: giới đức, phòng hộ các căn, biết đủ ăn uống, tỉnh giác, từ bỏ năm triền cái; bốn niệm xứ được ví là cọc lớn trói tâm. An trú quán mà không tư duy tầm liên hệ đến dục, vị ấy chứng thiền hai, ba, bốn, rồi đạt ba thắng trí cho đến trí đoạn tận lậu hoặc, tâm được giải thoát.

  Vị tỳ-kheo ấy kham nhẫn lạnh nóng, đói khát, lời thô ác và các cảm thọ đe dọa mạng sống, là ruộng phước vô thượng cho thế gian. Đức Phật khép lại: voi vương già lớn, tuổi giữa hay còn non chết khi chưa thuần hóa thì được tính là chết khi chưa thuần hóa; đã thuần hóa thì được tính là chết khi đã thuần hóa. Cũng vậy, tỳ-kheo trưởng thượng, tuổi giữa hay mới, chết khi chưa tận các lậu hoặc là chết khi chưa thuần hóa; đã tận là chết khi đã thuần hóa.
