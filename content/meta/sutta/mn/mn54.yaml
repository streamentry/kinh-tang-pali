notes: |-
  Lớp lỗi dấu lược (Pāli ghi `…` ở giữa khoá, bản Việt bung thành văn xuôi): đã khôi phục 7 dấu lược, mỗi khoá đúng 1, khớp số dấu lược của Pāli sau khi sửa: 3.5, 17.7, 18.11, 19.4, 20.11, 22.2, 23.1.
  Cách cắt đặt theo tiền lệ có sẵn trong dự án: 3.5 theo `dn16:3.5.1`; 18.11 theo `mn102:16.2`; 19.4 theo `mn95:9.21`; 20.11 theo `mn53:20.2`; 22.2 theo `mn53:24.2`.
  Hạ điểm chứ không che: `semantic_fidelity` 9.5 xuống 9.4 vì trước lát này còn 7 khoá diễn đạt trọn nơi Pāli đã lược.
  Lưu ý ngoài phạm vi lát này, chưa đụng tới: dấu ngoặc kép của bản Việt lệch `+1` từ trước và vẫn `+1` sau khi sửa (khoá `26.4` lệch `−1` so với Pāli). Đề nghị người gộp xử lý riêng.

summary: |-
  Kinh Potaliya được Đức Phật thuyết trong rừng gần thị trấn Āpaṇa, xứ Aṅguttarāpa. Gia chủ Potaliya, đã giao hết tài sản cho các con, sống với thức ăn, y phục cần thiết, nổi giận khi bị gọi là gia chủ ba lần, cho điều đó không hợp với mình. Đức Phật đáp: điều ông gọi là dứt bỏ các việc thế tục là một chuyện, còn sự dứt bỏ trong giới luật bậc Thánh là chuyện khác; Potaliya xin nghe.

  Tám pháp ấy là nương vào không sát sinh để từ bỏ sát sinh, vào chỉ lấy vật được cho để từ bỏ lấy của không cho, vào lời chân thật để từ bỏ nói dối, và vào không chia rẽ, không tham lam, không chê bai, không giận dữ, không kiêu mạn. Với từng pháp, vị Thánh đệ tử suy xét: pháp ấy là kiết sử, chướng ngại; nếu phạm phải, chính mình sẽ tự trách, người có trí sẽ chê trách, mạng chung có thể sinh vào cảnh giới xấu; những lậu hoặc do nó sinh ra sẽ không có nơi người đã từ bỏ.

  Đức Phật cho biết đó vẫn chưa phải dứt bỏ hoàn toàn, rồi nêu bảy ví về nguy hại của dục: con chó đói gặm xương róc sạch thịt; con kền kền quắp miếng thịt bị bầy đuổi; bó đuốc cỏ cháy ngược gió; hố than hồng sâu hơn người; giấc mơ thấy cảnh đẹp, tỉnh dậy mất sạch; của vay mượn bị lấy lại; và người leo cây hái quả khi cây bị chặt. Sau mỗi ví, kinh lặp lại: các dục đem lại nhiều khổ đau, phiền toái, nguy hại còn lớn hơn nữa; vị Thánh đệ tử tránh xả dựa trên đa dạng, phát triển xả dựa trên nhất thể, nơi mọi chấp thủ vào thế gian chấm dứt.

  Nương vào sự thanh tịnh tối thượng của niệm và xả ấy, vị Thánh đệ tử nhớ lại nhiều đời quá khứ; bằng thiên nhãn thấy các chúng sinh đi theo nghiệp; do lậu hoặc đã tận, tự mình chứng ngộ, an trú trong tâm giải thoát, tuệ giải thoát. Đến mức ấy mới là dứt bỏ hoàn toàn các việc thế tục theo giới luật của bậc Thánh, về mọi phương diện.

  Hỏi ông có thấy nơi mình sự dứt bỏ tương đương, Potaliya nhận còn cách rất xa, nhận ra trước đây đã nhầm du sĩ ngoại đạo là ngựa thuần chủng trong khi tỳ-kheo mới thật sự là ngựa thuần chủng. Ông nói Đức Phật đã sinh khởi lòng quý mến, tin tưởng, kính trọng, và xin quy y Phật, Pháp, Tăng trọn đời. Bài kinh phân biệt rành rẽ việc từ bỏ hình thức ngoài đời với sự dứt bỏ thật sự theo giới luật Thánh.
