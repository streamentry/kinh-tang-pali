notes: |-
  Lớp lỗi dấu lược (Pāli ghi `…` ở giữa khoá, bản Việt bung thành văn xuôi): đã khôi phục 7 dấu lược, mỗi khoá đúng 1, khớp số dấu lược của Pāli sau khi sửa: 3.5, 17.7, 18.11, 19.4, 20.11, 22.2, 23.1.
  Cách cắt đặt theo tiền lệ có sẵn trong dự án: 3.5 theo `dn16:3.5.1`; 18.11 theo `mn102:16.2`; 19.4 theo `mn95:9.21`; 20.11 theo `mn53:20.2`; 22.2 theo `mn53:24.2`.
  Hạ điểm chứ không che: `semantic_fidelity` 9.5 xuống 9.4 vì trước lát này còn 7 khoá diễn đạt trọn nơi Pāli đã lược.
  Lưu ý ngoài phạm vi lát này, chưa đụng tới: dấu ngoặc kép của bản Việt lệch `+1` từ trước và vẫn `+1` sau khi sửa (khoá `26.4` lệch `−1` so với Pāli). Đề nghị người gộp xử lý riêng.
