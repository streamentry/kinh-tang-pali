summary: |-
  Kinh Ví Dụ Chim Cút diễn ra tại thị trấn Āpaṇa. Chiều hôm ấy, Tôn giả Udāyī kể với Đức Phật: trước kia họ ăn những giờ không đúng lúc ban ngày lẫn ban đêm; khi Đức Phật bảo bỏ, vị ấy thất vọng vì món ngon gia chủ dâng, nhưng vì lòng quý mến, kính trọng cùng lòng biết hổ thẹn và sợ điều sai trái, chúng con đã bỏ. Vị ấy nhớ cảnh khất thực trong đêm tối, kể chuyện một phụ nữ thấy vị ấy khi ánh chớp lóe, kêu "Đúng là ma quỷ!" rồi nguyền rủa, và kết luận Đức Phật đã giúp bỏ biết bao điều gây khổ, đem lại biết bao điều an lạc.

  Người ngu si khi được bảo từ bỏ thì bảo việc nhỏ nhặt mà vị sa-môn cũng quá khắt khe, không từ bỏ, nuôi lòng bất mãn; với tỳ-kheo tha thiết tu học, điều ấy là dây trói mạnh — như con chim cút nhỏ bị buộc bằng sợi dây leo mục, với nó đó vẫn là dây trói mạnh. Người con nhà lành nói "từ bỏ điều nhỏ nhặt này thì có là gì", từ bỏ không bất mãn — với họ điều ấy chỉ là dây trói yếu ớt, như con voi của vua khẽ xoay mình bứt đứt dây da.

  Đức Phật nêu bốn hạng người thực hành để từ bỏ các sanh y, tùy cách xử lý những hồi tưởng về sanh y khi chúng khởi lên: dung dưỡng, xua tan, hoặc niệm khởi chậm mà xua tan nhanh — ba hạng đầu được gọi là còn bị trói buộc; hạng thứ tư biết sanh y là gốc rễ của khổ, được giải thoát khi sanh y đoạn tận, gọi là đã thoát khỏi trói buộc; lý do mỗi lần nêu là Ta biết rõ sự khác biệt về các căn.

  Ngài mô tả năm loại đối tượng của dục — hình sắc, âm thanh, mùi hương, vị, xúc chạm do năm căn nhận biết, đáng ưa, khơi dậy tham đắm — và gọi sự vui thích phát sinh từ đó là dục lạc, thứ lạc ô uế, lạc của phàm phu: cần e ngại, không theo đuổi. Bốn thiền được gọi là niềm an lạc của xuất ly, viễn ly, an tịnh, giác ngộ: nên theo đuổi, tu tập, không sợ.

  Về dao động, sơ thiền dao động vì tầm tứ chưa chấm dứt, nhị thiền vì hỷ lạc, tam thiền vì lạc đi cùng xả; tứ thiền không dao động. Mỗi trạng thái Ngài đều nói chưa đủ, hãy từ bỏ, hãy vượt qua, cho đến diệt tưởng và thọ vượt Phi tưởng phi phi tưởng xứ; Udāyī đáp không có trói buộc nào dù nhỏ hay lớn mà Ngài không dạy từ bỏ.

notes: |-
  Khôi phục 14 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Mười hai khoá công thức bốn thiền (20.1-20.4, 22.1, 23.1, 24.1, 25.1, 26.1, 27.1, 28.1, 29.1): đã tra cùng công thức ở bản không lược (mn45:7.5, mn51:21.1, mn30:14.1, mn30:15.1, mn51:22.1, mn30:16.1) để biết chính xác khoảng lược che gì, rồi bỏ đúng phần đó. Vị trí … đặt theo đúng chỗ Pāli lược, giống hệt tiền lệ đã có trong kho như mn79:25.1 và mn119:18.1.
  Khoá 10.6: khoảng lược che dubbalaṁ và pūtikaṁ, xác được nhờ ba bản đủ cùng ý ở 8.3, 11.10, 12.12 trong bài.
  Khoá 18.4: khoảng lược che vần các tính từ iṭṭhā kantā manāpā piyarūpā kāmūpasaṁhitā rajanīyā; đã bỏ, chỉ giữ các âm thanh do tai nhận biết.
  Không xác định được nên để nguyên: 18.5 và 18.6. Ở hai khoá này Pāli ghi dấu lược trần … chứ không phải …pe…, nên không thuộc lát này; nội dung bị bung vẫn còn nguyên. Đề nghị người gộp xử lý cùng lớp với 26 khoá tương tự ở mn51:16.5-16.6, mn52:5.1 và mn53:8.4-8.7.
