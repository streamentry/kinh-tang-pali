summary: |-
  Kinh Makhādeva mở đầu khi Đức Phật trú tại Mithilā, ở vườn xoài Makhādeva, bỗng mỉm cười; Tôn giả Ānanda hỏi duyên cớ, vì Như Lai không mỉm cười khi không có lý do. Đức Phật kể thuở xưa tại chính thành ấy có vua Makhādeva, vị pháp vương như pháp, thực hành Chánh pháp giữa bà-la-môn, gia chủ, thị dân và thôn dân, giữ lễ Bố-tát vào ngày bốn, năm, tám của tuần trăng.

  Sau nhiều năm tóc bạc mọc, thợ cạo báo các Thiên sứ đã hiện ra. Vua dạy thái tử: các dục nhân gian đã thọ hưởng, đã đến lúc tìm các dục thiên giới; con hãy trị vì, còn ta cạo bỏ râu tóc, đắp áo cà-sa, xuất gia; khi tóc con bạc, hãy làm y như vậy, duy trì truyền thống ấy, chớ thành người tối hậu. Vua xuất gia ngay tại vườn xoài ấy, an trú bốn vô lượng tâm từ, bi, hỷ, xả bao trùm toàn thế giới, trải qua các thời kỳ tám mươi bốn nghìn năm: tuổi thơ, làm phó vương, trị vì và sống phạm hạnh, sau khi thân hoại sinh lên cõi Phạm thiên.

  Con trai vua làm đúng như thế, và tám mươi bốn nghìn vị vua nối tiếp cũng vậy, tu tập bốn vô lượng tâm và sinh lên cõi Phạm thiên. Vua Nimi là vị cuối cùng. Chư thiên Trời Ba Mươi Ba khen ngợi vua tại Đại hội Sudhammā, và Sakka Thiên chủ phái Mātali đưa cỗ xe ngựa tuấn nghìn con đến đón. Mātali hỏi nên đi lối của ai cảm thọ quả các ác nghiệp hay lối của ai cảm thọ quả các thiện nghiệp, vua Nimi bảo đưa đi cả hai lối. Tại Đại hội Sudhammā, Sakka mời vua thọ hưởng thiên phúc, nhưng vua từ chối, xin về Mithilā thực hành Chánh pháp và giữ lễ Bố-tát.

  Trở về, vua Nimi sống như cũ; khi tóc bạc, vua dạy thái tử y như trước, rồi xuất gia, sống bốn thời kỳ tám mươi bốn nghìn năm và sinh lên cõi Phạm thiên. Nhưng người con của vua tên Kaḷāra Janaka không xuất gia, đã cắt đứt truyền thống ấy, là người tối hậu.

  Đức Phật bảo Ānanda chớ nghĩ vua Makhādeva thời ấy là người khác; chính Ta là vua Makhādeva. Truyền thống ấy không đưa đến yểm ly, ly tham, chấm dứt, an tịnh, thắng trí, giác ngộ, niết-bàn, chỉ đưa đến sinh lên cõi Phạm thiên; còn bây giờ Ta đã thiết lập truyền thống đưa đến những điều ấy, chính là Thánh đạo tám ngành: chánh kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm và chánh định. Ngài căn dặn các tỳ-kheo hãy duy trì truyền thống ấy, chớ thành người tối hậu sau Ta.
