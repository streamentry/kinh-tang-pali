summary: |-
  Bài kinh được nói ở Rājagaha, tại vườn Bambu, chỗ nuôi dưỡng các con sóc, khi vị tỳ-kheo Goliyāni, sống nơi rừng, cư xử thô kệch, đến vào giữa Tăng đoàn vì một công việc nào đó. Tôn giả Sāriputta nhân chuyện ấy nói với các tỳ-kheo, và toàn bài là lời giảng của Ngài về những điều vị tỳ-kheo sống nơi rừng cần có khi đến ở trong Tăng đoàn.

  Trước hết là nhóm điều về ứng xử trong đại chúng: vị ấy nên kính trọng và thân thiện với các đồng phạm hạnh, nên thạo trong việc chọn chỗ ngồi sao cho không xâm phạm các tỳ-kheo thượng tọa và không chiếm chỗ của các tỳ-kheo hạ tọa, cần biết cả những pháp về nghi tiết tu hành, không nên vào làng quá sớm hay trở về quá muộn, không nên đi lại với các gia đình trước hoặc sau bữa ăn, nên sống không xao động, không dao động, không nhiều lời, không nói năng lộn xộn, và nên dễ được khuyên bảo, có bạn lành. Mỗi điều đều đi kèm cùng một lập luận: nếu vị ấy vi phạm, sẽ có những kẻ chê hỏi vị tỳ-kheo sống đơn độc tự tại nơi rừng này có ích gì, rồi kết bằng lời vì vậy nên làm như vậy.

  Tiếp đến là các phẩm chất tu tập: cần phòng hộ các căn, biết tiết độ trong ăn uống, chuyên cần tỉnh thức, tinh tấn, có niệm hiện tiền, có định, có trí tuệ. Cuối cùng là ba yêu cầu cao hơn: cần nỗ lực về Thắng Pháp và Thắng Luật để khi bị hỏi có thể trả lời trôi chảy, nỗ lực chứng những giải thoát trầm lặng vượt khỏi sắc, thuộc vô sắc, và nỗ lực chứng pháp siêu nhân; nếu bị hỏi mà không trả lời trôi chảy, sẽ có kẻ chê nói chính vị ấy không biết mục tiêu mình xuất gia.

  Nghe vậy, Tôn giả Mahāmoggallāna hỏi những pháp này chỉ nên thực hành bởi vị tỳ-kheo sống nơi rừng, hay cả bởi vị tỳ-kheo sống tại làng. Sāriputta đáp những pháp này nên thực hành bởi vị tỳ-kheo sống nơi rừng, và càng hơn nữa bởi vị tỳ-kheo sống tại làng. Kinh khép lại ở câu đáp ấy: những phẩm chất được nêu không phải đặc quyền của sống nơi rừng, mà là điều càng hơn nữa đối với người sống tại làng.
