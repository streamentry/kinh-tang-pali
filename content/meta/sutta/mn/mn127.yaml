summary: |-
  Người thợ cả Pañcakaṅga mời Tôn giả Anuruddha thọ ăn và hỏi: các trưởng lão tỳ-kheo có người dạy ông hãy tu tập vô lượng tâm giải thoát, có người dạy hãy tu tập đại hành tâm giải thoát — hai pháp ấy khác nghĩa khác văn, hay đồng nghĩa chỉ khác văn? Anuruddha khẳng định khác nghĩa và khác văn.

  Anuruddha phân định: vô lượng tâm giải thoát là tỏa tâm từ, bi, hỷ, xả rộng lớn, cao cả, vô lượng, không hận, không sân đến một phương, rồi bốn phương, trên dưới, ngang khắp toàn thế giới. Còn đại hành tâm giải thoát là biến mãn trong phạm vi đo đếm được: đến một gốc cây, hai ba gốc cây, một vùng làng, hai ba vùng làng, một đại vương quốc, hai ba đại vương quốc, cho đến đất này được bao quanh bởi biển lớn.

  Tiếp đó là bốn hữu sinh: người biến mãn với hào quang ít ỏi, vô lượng, nhiễm ô hay thanh tịnh thì sau khi chết sinh đồng cư với chư thiên có hào quang tương ứng. Khi các vị thiên ấy tụ họp một chỗ, chỉ thấy khác biệt về màu sắc chứ không về hào quang, ví như nhiều ngọn đèn dầu trong một nhà chỉ thấy khác lửa chứ không khác ánh sáng; khi tản ra thì thấy cả hai, ví như đèn được mang ra khỏi nhà. Các vị thiên ấy không nghĩ chỗ an trú của mình là thường còn, thường trú, ví như con ruồi được mang theo trên đòn gánh chỉ ưa nơi mình trú.

  Tôn giả Sabhiya Kaccāna hỏi do nhân duyên gì trong một thiên chúng lại có vị thiên hào quang ít ỏi, vị thiên hào quang vô lượng. Anuruddha đưa Kaccāna tự trả lời qua chuỗi đối chiếu: đại hành càng mở rộng — từ gốc cây đến vùng làng, đại vương quốc, cho đến đất bao quanh biển lớn — thì càng hơn, đó là nhân duyên của khác biệt về hào quang. Về hào quang nhiễm ô và thanh tịnh, Anuruddha dùng ví dụ ngọn đèn: dầu và tim đèn không thanh tịnh thì cháy mờ đục — ứng với vị tỳ-kheo sự thô trọng của thân chưa lắng dịu, hôn trầm thùy miên chưa trừ dứt, trạo hối chưa điều phục; dầu và tim đèn thanh tịnh thì cháy sáng — ứng với vị đã lắng dịu, trừ dứt, điều phục hoàn toàn.

  Kaccāna nhận xét Anuruddha không nói tôi đã nghe như vậy, mà khẳng định các vị thiên này, các vị thiên kia — hẳn Ngài từng sống chung với các vị thiên ấy. Anuruddha nói lời ấy thật xúc phạm và áp đặt, nhưng vẫn xác nhận: lâu dài về trước tôi đã từng sống chung với các vị thiên ấy. Pañcakaṅga được nói là từ bỏ được trạng thái hoài nghi.
