summary: |-
  Kinh Esukārī ghi lại cuộc đối thoại giữa Đức Phật và bà-la-môn Esukārī tại rừng Jeta, tu viện của ông Anāthapiṇḍika ở Sāvatthī. Esukārī trình bày chủ trương của các bà-la-môn về bốn sự phục vụ: Bà-la-môn được cả bốn đẳng cấp phục vụ (kể cả chính đẳng cấp Bà-la-môn), Sát-đế-lợi được ba đẳng cấp phục vụ (kể cả chính đẳng cấp Sát-đế-lợi), Phệ-sa được hai đẳng cấp phục vụ (kể cả chính đẳng cấp Phệ-sa), còn Thủ-đà chỉ được Thủ-đà phục vụ (kể cả chính đẳng cấp Thủ-đà), vì chẳng ai khác có thể phục vụ Thủ-đà. Khi được hỏi thế gian có thừa nhận chăng, ông thừa nhận là không; Đức Phật ví điều ấy như kẻ nghèo khó bị ép nuốt miếng thịt rồi còn phải trả tiền.

  Đức Phật nêu lập trường của Ngài: chẳng nói phải phục vụ tất cả, cũng chẳng nói chẳng được phục vụ ai; kẻ mà phục vụ thì mình xấu đi thì chẳng nên phục vụ, kẻ mà phục vụ thì mình tốt lên thì nên phục vụ. Ngài không coi sinh trong gia tộc cao quý, dáng vẻ tuyệt vời hay tài vật nhiều là tốt hơn hay xấu hơn: người có ưu điểm ấy mà vẫn làm các điều bất thiện cho đến tà kiến, người có ưu điểm ấy mà tránh hết cho đến chánh kiến; công thức ấy lặp lại cho từng ưu điểm. Chỉ nên phục vụ người mà nhờ sự phục vụ ấy tín, giới, đa văn, bố thí, trí tuệ tăng trưởng.

  Esukārī lại nêu chủ trương bốn loại tài sản theo đẳng cấp: khất thực, cung tên, cày ruộng chăn nuôi, liềm và đòn gánh lần lượt cho Bà-la-môn, Sát-đế-lợi, Phệ-sa, Thủ-đà; ai coi thường tài sản ấy thì chẳng làm bổn phận, như tên canh gác lấy của không cho; ví ấy được lặp lại. Đức Phật chủ trương Pháp Thánh xuất thế gian là tài sản của con người: người được tính theo gia tộc nơi sinh ra, như ngọn lửa cháy tùy củi hay phân bò mà được gọi theo duyên cháy ấy. Nhưng người sinh trong gia tộc nào mà xuất gia đến giáo pháp do Như Lai khai thị, tránh sát sinh cho đến chánh kiến, là bậc thành tựu chánh pháp thiện pháp; công thức ấy lặp lại cho từng gia tộc.

  Bài kinh khép lại bằng ba phép đối chiếu: cả bốn đẳng cấp đều có thể tu tập tâm từ không giận không hại và mang thuốc tắm ra sông rửa bụi bặm; và mọi ngọn lửa, dù nhóm bằng que khoan gỗ tốt hay que khoan từ máng uống của bò heo hay thùng rác, đều cháy, sáng và làm được việc của lửa. Trọng tâm bài kinh là tương phản ấy: giá trị con người không quyết bởi nơi sinh mà bởi nỗ lực tu tập; Esukārī quy y tam bảo.
