summary: |-
  Tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika, Đức Phật dạy các tỳ-kheo hãy là những người thừa tự Pháp của Ngài, đừng là những người thừa tự tài vật, vì với lòng thương các đệ tử, Ngài luôn nghĩ làm sao họ có thể thừa tự Pháp. Nếu các đệ tử sống như người thừa tự tài vật thì cả họ lẫn bậc Đạo sư đều bị chê trách; nếu sống như người thừa tự Pháp thì không ai bị chê trách.

  Ngài nêu ví dụ: giả sử Ngài đã ăn xong nhưng còn ít thức ăn khất thực dư sắp phải bỏ đi, và hai vị tỳ-kheo đang đói, kiệt sức đi đến. Một vị nhớ rằng thức ăn khất thực cũng là tài vật, nên chọn chịu đói và yếu suốt ngày đêm; vị kia ăn phần thức ăn ấy. Dù vị thứ hai ăn, Đức Phật nói chính vị thứ nhất mới đáng được kính trọng hơn, vì về lâu dài việc ấy giúp vị ấy ít ham muốn, biết đủ, thực hành đoạn giảm, dễ nuôi và siêng năng tinh tấn hơn. Nói xong, Thế Tôn đi vào nơi ở của mình.

  Không lâu sau, Tôn giả Sāriputta giảng cho các tỳ-kheo thế nào là đệ tử của bậc Đạo sư sống viễn ly mà không học theo đời sống viễn ly: những điều bậc Đạo sư bảo phải từ bỏ, họ không từ bỏ; họ ham hưởng thụ, buông thả, đi đầu trong sự thối lui và bỏ bê đời sống viễn ly. Tỳ-kheo trưởng lão, trung niên lẫn trẻ đều đáng bị phê bình vì ba điều ấy, lặp lại cho từng nhóm tuổi. Người học theo đời sống viễn ly thì từ bỏ những điều được bảo từ bỏ, không ham hưởng thụ, không buông thả, đặt xuống gánh nặng của sự thối lui và đi đầu trong đời sống viễn ly; ba nhóm tuổi đều đáng được khen ngợi như vậy.

  Tôn giả nêu điều xấu cần từ bỏ trước hết là tham và sân, và con đường trung đạo để từ bỏ chúng là Thánh đạo tám ngành, gồm chánh kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm và chánh định, đem lại cái thấy và tri kiến, đưa đến an tịnh, trực tiếp biết, giác ngộ và Niết-bàn. Công thức ấy lặp lại cho từng cặp điều xấu còn lại: giận dữ và oán hận, gièm pha và hơn thua, ganh tị và keo kiệt, giả dối và xảo trá, bướng bỉnh và hung hăng, ngã mạn và ngạo mạn, tự mãn và buông lung. Tương phản của bài kinh nằm ở đó: thừa tự Pháp là từ bỏ từng cặp điều xấu qua con đường trung đạo.
