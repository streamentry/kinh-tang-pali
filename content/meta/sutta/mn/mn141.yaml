summary: |-
  Đức Phật ở Bārāṇasī, tại Isipatana, trong vườn Lộc Uyển, tuyên bố Như Lai đã chuyển pháp luân vô thượng ở đây, sự chỉ dạy, phân biệt, trình bày rõ ràng bốn Thánh đế, mà không ai từ sa-môn bà-la-môn đến thiên nhân, Ma vương, Phạm thiên có thể đảo ngược. Ngài khuyên các tỳ-kheo hãy thân cận Sāriputta và Moggallāna: Sāriputta như người mẹ sinh con, hướng dẫn chứng quả Dự lưu; Moggallāna như người nuôi dưỡng con, dẫn đến mục đích tối thượng; riêng Sāriputta có khả năng phân biệt bốn Thánh đế rộng rãi. Nói xong, Đức Phật vào tịnh phòng.

  Sāriputta lặp lại tuyên bố ấy rồi phân biệt Thánh đế về khổ: sinh, già, chết, sầu bi khổ ưu não, cầu không được, tóm lại năm thủ uẩn. Kinh định nghĩa từng mục: sinh là sự hiện khởi các uẩn; già là răng rụng, tóc bạc, tuổi thọ suy giảm; chết là tan rã các uẩn, đoạn tận mạng căn; sầu, bi, não là nỗi sầu muộn, khóc than, nhiệt não khi gặp tai ương; khổ là cảm thọ khổ bất lạc do thân xúc sanh, ưu là cảm thọ khổ bất lạc do ý xúc sanh. Cầu không được là khổ: chúng sinh có tính sinh, già, bệnh, chết, sầu bi khổ ưu não mong điều ấy không đến với mình, nhưng không thể đạt được bằng ước muốn.

  Thánh đế về khổ tập là ái dẫn đến tái sinh, đi kèm sự thích thú và tham, tìm khoái lạc chỗ này chỗ kia, cụ thể là dục ái, hữu ái, vô hữu ái. Thánh đế về khổ diệt là sự ly tham vô dư, đoạn diệt chính ái ấy, sự xả ly, buông bỏ, giải thoát, không níu túm đối với ái ấy. Thánh đế về con đường đưa đến khổ diệt là Thánh đạo tám chi.

  Kinh lần lượt định nghĩa tám chi: chánh kiến là trí về bốn Thánh đế; chánh tư duy là tư duy ly dục, không sân, không hại; chánh ngữ là từ bỏ nói dối, hai lưỡi, thô ác, phù phiếm; chánh nghiệp là từ bỏ sát sinh, lấy của không cho, tà dâm trong các dục; chánh mạng là từ bỏ tà mạng; chánh tinh tấn là bốn nỗ lực: ngăn ác pháp chưa sanh, đoạn ác pháp đã sanh, làm thiện pháp sanh và tăng trưởng; chánh niệm là quán thân, thọ, tâm, pháp, trừ bỏ tham ưu; chánh định là chứng và an trú bốn tầng thiền.

  Như vậy toàn bài là Sāriputta triển khai chính tuyên bố của Đức Phật, đưa pháp luân về bốn Thánh đế thành một bản phân biệt đầy đủ, từ định nghĩa khổ đến định nghĩa tám chi của con đường.
