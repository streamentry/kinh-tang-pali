summary: |-
  Đức Phật ở Bārāṇasī, tại Isipatana, trong vườn Lộc Uyển, tuyên bố Như Lai đã chuyển pháp luân vô thượng ở đây, sự chỉ dạy, phân biệt, trình bày rõ ràng bốn Thánh đế, mà không ai từ sa-môn bà-la-môn đến thiên nhân, Ma vương, Phạm thiên có thể đảo ngược. Ngài khuyên các tỳ-kheo hãy thân cận Sāriputta và Moggallāna: Sāriputta như người sinh ra con, hướng dẫn chứng quả Dự lưu; Moggallāna như người nuôi dưỡng đứa con ấy, dẫn đến mục đích tối thượng; riêng Sāriputta có khả năng phân biệt bốn Thánh đế rộng rãi. Nói xong, Đức Phật vào tịnh phòng.

  Sāriputta lặp lại tuyên bố ấy rồi phân biệt Thánh đế về khổ: sinh, già, chết, sầu bi khổ ưu não, cầu không được, tóm lại năm thủ uẩn. Kinh định nghĩa từng mục: sinh là sự hiện khởi các uẩn; già là răng rụng, tóc bạc, tuổi thọ suy giảm; chết là tan rã các uẩn, đoạn tận mạng căn; sầu, bi, não là nỗi sầu muộn, khóc than, bức bách quẫn bách khi gặp tai họa; khổ là cảm thọ khổ bất lạc do thân xúc sanh, ưu là cảm thọ khổ bất lạc do ý xúc sanh. Cầu không được là khổ: chúng sinh có tính sinh, già, bệnh, chết, sầu bi khổ ưu não mong điều ấy không đến với mình, nhưng không thể đạt được bằng ước muốn.

  Thánh đế về khổ tập là ái dẫn đến tái sinh, đi kèm sự thích thú và tham, tìm khoái lạc chỗ này chỗ kia, cụ thể là dục ái, hữu ái, vô hữu ái. Thánh đế về khổ diệt là sự ly tham vô dư, đoạn diệt chính ái ấy, sự xả ly, buông bỏ, giải thoát, không níu túm đối với ái ấy. Thánh đế về con đường đưa đến khổ diệt là Thánh đạo tám chi.

  Kinh lần lượt định nghĩa tám chi: chánh kiến là trí về bốn Thánh đế; chánh tư duy là tư duy ly dục, không sân, không hại; chánh ngữ là từ bỏ nói dối, hai lưỡi, thô ác, phù phiếm; chánh nghiệp là từ bỏ sát sinh, lấy của không cho, tà dâm trong các dục; chánh mạng là từ bỏ tà mạng; chánh tinh tấn là bốn nỗ lực: ngăn ác pháp chưa sanh, đoạn ác pháp đã sanh, làm thiện pháp sanh và tăng trưởng; chánh niệm là quán thân, thọ, tâm, pháp, trừ bỏ tham ưu; chánh định là chứng và an trú bốn tầng thiền.

  Như vậy toàn bài là Sāriputta triển khai chính tuyên bố của Đức Phật, đưa pháp luân về bốn Thánh đế thành một bản phân biệt đầy đủ, từ định nghĩa khổ đến định nghĩa tám chi của con đường.

notes: |-
  Lượt cải thiện 2026-10-13 (đọc đối kháng từng khoá với Pāli; đối chiếu bản Anh đã ghim và tiền lệ trong tầng, đo bằng số đếm).

  Điểm đổi: terminology 9.0 → 9.2 và vietnamese_clarity 9.0 → 9.1. Các điểm còn lại giữ nguyên. Các điểm trước lượt này đã được chấm khi bản dịch còn những lỗi dưới đây, nên điểm cũ phải coi là chấm cao so với văn bản cũ; lượt này sửa văn bản chứ không chỉ chấm lại.

  Sửa nghĩa (accuracy):
  - 2.2, 3.1, 4.2, 5.7, 8.2, 9.1, 32.2: Pāli có bảy từ (ācikkhanā, desanā, paññāpanā, paṭṭhapanā, vivaraṇā, vibhajanā, uttānīkammaṁ); bản cũ chỉ có sáu, bỏ paññāpanā. Đã thêm "tuyên bố". Bản Anh gộp thành sáu nên không phân xử được từ ngữ này bằng English; giữ bất định (xem dưới).
  - 3.1, 9.1: Pāli lặp đủ bảy từ cho từng Thánh đế trong bốn Thánh đế; bản cũ rút gọn thành "của Thánh đế về khổ tập; của Thánh đế về khổ diệt…". Đã chép lại đủ bốn lần để giữ lặp lại cấu trúc.
  - 18.2: āyāso upāyāso āyāsitattaṁ upāyāsitattaṁ cũ là "nhiệt não, ưu bức"; đã đổi thành "bức bách, quẫn bách, trạng thái bức bách, trạng thái quẫn bách", khớp dn22:18.25 và các bài cùng công thức. "Não" ở 18.1 và 18.3 là nhãn rút gọn của upāyāso, giữ nguyên vì đó là tên mục.
  - 31.4: "do hỷ ly tham" cũ gây hiểu rằng hỷ bị coi là tham; đã đổi thành "do hỷ phai nhạt" (virāga của pīti), đa số trong tầng (38 trên 63 khoá dùng dạng này).
  - 29.2–29.5: cũ có "tinh cần" lặp hai lần cho vīriyaṁ ārabhati và padahati, và "thiết lập tâm" cho paggaṇhāti (trùng với paṭṭhapanā ở đoạn đầu bài); đã đổi thành "phát khởi tinh tấn, nâng đỡ tâm, cố gắng", khớp sn49.1-12 (cùng "nâng đỡ tâm") và dn22:21.20, vốn cùng công thức; "tu tập đầy đủ" thành "tu tập và viên mãn" vì Pāli có hai danh từ bhāvanā và pāripūriyā.
  - 5.4: janetā dịch "người mẹ sinh con" thêm giới tính không có trong Pāli (janetā là danh từ chỉ người sinh ra); đã đổi thành "người sinh ra con". Bản Anh cũng giữ trung tính ("one who gives birth"). Tên thẻ mother-nurse-simile là cách gọi của người biên tập, không đổi.

  Sửa thuật ngữ và tiền lệ (terminology):
  - 12.2: "chín muồi các căn" thành "các căn suy yếu" (sn12.2, cnd7:66.5 cùng công thức); paripāko ở đây là chín đến suy tàn.
  - 13.2: "sự từ trần" cho cuti đổi thành "sự qua đời" (dn22:18.10, mn9:22.5, sn12.2); "từ trần" là dạng tôn xưng, không hợp cho mọi loài chúng sinh.
  - 14.2, 15.2, 18.2: "một tai ương này hay khác" thành "tai họa này hay tai họa khác" và "một pháp khổ này hay khác" thành "pháp khổ này hay pháp khổ khác", khớp dn22:18.13, 18.16, 18.25 và mnd/cnd; 14.2 "thẳm sâu" thành "thấm sâu" như dn22:18.13.
  - 5.2, 5.3: "kết bạn" thành "gần gũi" cho bhajatha (5.1 sevatha đã là "thân cận"); "hộ trợ" thành "trợ giúp" (anuggāhakā; chữ cũ cũng sai chính tả).
  - 7.1: "Rồi" thành "Tại đó" cho tatra kho, khớp mn9:1.3, mn28:1.3 và 1.3 của bài này.

  Sửa mạch văn (clarity):
  - 4.2: bỏ "Đó là" thừa vì 4.1 đã kết bằng "đó là:"; nay khớp 32.2 (cùng Pāli).
  - 30.2–30.5: đồng nhất "sống quán" (17 trên 19 khoá cùng công thức trong tầng) thay cho "an trú quán"; 30.4 cũ thiếu động từ viharati, nay có "sống quán tâm nơi tâm …".

  Phép đo sau sửa: 122 khoá Pāli và 122 khoá Việt, cùng thứ tự; nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch); không có …pe… sót, dấu lược … khớp Pāli; 6 cặp Pāli trùng nguyên văn trong bài (2.1/4.1, 2.2/8.2, 2.3/8.3, 3.1/9.1, 19.4/19.11, 19.5/19.12), 0 cặp bản Việt khác nhau; NFC sạch; không có từ Pāli lọt sang bản Việt ngoài tên riêng. Không có số lượng Pāli phải kiểm ngoài "bảy từ" và "bốn lần" ở trên (đếm trực tiếp trên Pāli).

  Bất định còn lại (giữ, không đoán):
  - paññāpanā: "tuyên bố" là lựa chọn bám nghĩa "làm cho được biết, công bố"; trong tầng, các bài có đủ bảy từ dùng khi "xác lập", khi "chỉ rõ", và hai chỗ bỏ hẳn (sn56.38:2.6, 3.3 và ps1.10:2.2, 2.8 cũng chỉ có sáu từ). Chưa có tiền lệ thống nhất.
  - 19.1 và 20.1: "Và thế nào, này các hiền giả, là cầu không được là khổ?" giữ cấu trúc "là … là" sát Pāli vì không được thêm nháy ở khoá mà Pāli không có; câu hơi nặng nhưng đúng nghĩa.
  - 11.2 "sañjāti" (sự sinh khởi) và "abhinibbatti" (sự tái sinh): hai từ gần nghĩa, theo tiền lệ dn22 và mn9; không phân biệt thêm.

