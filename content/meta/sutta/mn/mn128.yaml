summary: |-
  Tại Kosambī, các tỳ-kheo đang cãi cọ, tranh luận, sống đâm nhau bằng lời nói nhọn gai. Đức Phật khuyên ba lần, nhưng các tỳ-kheo đáp: xin để mặc, Đức Phật hãy sống vô sự, còn chúng tôi sẽ được biết đến vì sự cãi cọ ấy. Đức Phật bỏ đi, thốt kệ: hận thù không lắng dịu bằng hận thù mà bằng không hận thù; kẻ sát nhân, cướp phá quốc gia còn biết hòa hợp, sao riêng các thầy không có; nếu không tìm được bạn đồng hành sáng suốt, hãy như vua bỏ quốc gia, một mình độc hành như voi rừng.

  Đức Phật đến thăm Tôn giả Bhagu ở làng Bālakaloṇakāra, rồi đến rừng Phương Đông nơi Anuruddha, Nandiya và Kimbila trú. Người giữ vườn chặn lại nhưng Anuruddha nhận ra bậc Đạo sư. Khi được hỏi, ba vị cho biết họ sống hài hòa như sữa với nước hòa lẫn: mỗi người duy trì hạnh thân từ, khẩu từ, ý từ với đồng phạm hạnh, gác bỏ ý mình sống theo ý các vị kia — thân khác nhau nhưng tâm là một. Việc thường ngày chia nhau làm, và cứ năm ngày suốt đêm cùng đàm luận Pháp.

  Ba vị thưa rằng khi sống không phóng dật, họ nhận thấy hào quang và sự thấy các sắc, nhưng chẳng bao lâu biến mất. Đức Phật kể lại thời Bồ-tát: hào quang và thấy các sắc biến mất do từng tùy phiền não; mỗi lần định sụp, Ngài tìm nguyên nhân rồi hành trì để nó không còn khởi lên — mười một thứ: nghi hoặc; không tác ý; hôn trầm thùy miên; sợ hãi; phấn chấn; sự thô trọng; tinh cần quá độ hay quá lơi lỏng, ví như nắm chim cút quá chặt thì nó chết, quá lỏng thì nó bay mất; tham cầu; tưởng khác nhau; và suy tư quá mức về các sắc.

  Từ bỏ đủ mười một tùy phiền não ấy, Ngài thấy hào quang mà không thấy sắc, hoặc thấy sắc mà không thấy hào quang suốt ngày đêm, tùy lúc tác ý; định ít ỏi thì thấy ít ỏi, định vô lượng thì thấy vô lượng. Ngài rồi tu tập định ba phương thức — có tầm có tứ, không tầm chỉ còn tứ, không tầm không tứ — cùng định có hỷ, định không hỷ, định tương ưng lạc, định tương ưng xả — và tri thấy khởi lên: tâm giải thoát bất động, đây là lần sinh cuối cùng.

  Tương phản trung tâm: cùng cảnh hào quang và thấy các sắc, nhưng định sụp đổ mỗi khi một tùy phiền não lọt vào; bậc Bồ-tát lần lượt nhận diện, đoạn tận, cho đến tâm giải thoát bất động — còn các tỳ-kheo Kosambī lại lấy sự tranh cãi làm phận sự của mình.
