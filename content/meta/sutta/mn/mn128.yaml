summary: |-
  Tại Kosambī, các tỳ-kheo đang tranh chấp, cãi vã, tranh luận, sống đâm chọc nhau bằng những lời nói như giáo nhọn. Đức Phật khuyên ba lần, nhưng các tỳ-kheo đáp: xin để mặc, Đức Phật hãy sống thảnh thơi, còn chúng con sẽ được biết đến vì sự tranh chấp ấy. Đức Phật bỏ đi, thốt kệ: hận thù không lắng dịu bằng hận thù mà bằng không hận thù; kẻ sát nhân, cướp phá quốc gia còn biết hòa hợp, sao riêng các thầy không có; nếu không tìm được bạn đồng hành sáng suốt, hãy như vua bỏ quốc gia, một mình độc hành như voi rừng.

  Đức Phật đến thăm Tôn giả Bhagu ở làng Bālakaloṇakāra, rồi đến khu rừng Pācīnavaṁsa nơi Anuruddha, Nandiya và Kimila trú. Người giữ vườn chặn lại nhưng Anuruddha nhận ra bậc Đạo sư. Khi được hỏi, ba vị cho biết họ sống hài hòa như sữa với nước hòa lẫn: mỗi người duy trì hạnh thân từ, khẩu từ, ý từ với đồng phạm hạnh, gác bỏ ý mình sống theo ý các vị kia — thân khác nhau nhưng tâm là một. Việc thường ngày chia nhau làm, và cứ năm ngày suốt đêm cùng đàm luận Pháp.

  Ba vị thưa rằng khi sống không phóng dật, họ nhận thấy hào quang và sự thấy các sắc, nhưng chẳng bao lâu biến mất. Đức Phật kể lại thời Bồ-tát: hào quang và thấy các sắc biến mất do từng tùy phiền não; mỗi lần định sụp, Ngài tìm nguyên nhân rồi hành trì để nó không còn khởi lên — mười một thứ: nghi hoặc; không tác ý; hôn trầm thùy miên; sợ hãi; phấn chấn; sự thô trọng; tinh cần quá độ hay quá lơi lỏng, ví như nắm chim cút quá chặt thì nó chết, quá lỏng thì nó bay mất; tham cầu; tưởng khác nhau; và suy tư quá mức về các sắc.

  Từ bỏ đủ mười một tùy phiền não ấy, Ngài thấy hào quang mà không thấy sắc, hoặc thấy sắc mà không thấy hào quang suốt ngày đêm, tùy lúc tác ý; định ít ỏi thì thấy ít ỏi, định vô lượng thì thấy vô lượng. Ngài rồi tu tập định ba phương thức — có tầm có tứ, không tầm chỉ còn tứ, không tầm không tứ — cùng định có hỷ, định không hỷ, định tương ưng lạc, định tương ưng xả — và tri thấy khởi lên: tâm giải thoát bất động, đây là lần sinh cuối cùng.

  Tương phản trung tâm: cùng cảnh hào quang và thấy các sắc, nhưng định sụp đổ mỗi khi một tùy phiền não lọt vào; bậc Bồ-tát lần lượt nhận diện, đoạn tận, cho đến tâm giải thoát bất động — còn các tỳ-kheo Kosambī lại lấy sự tranh cãi làm phận sự của mình.

notes: |-
  **Lượt cải thiện 2026-10-14 (đọc đối kháng 279 khoá Pāli↔Việt, đo tiền lệ trên toàn tầng).**
  Đã sửa 31/279 khoá so với bản trước lượt này. Bản trước không ghi chú thích hay bất định nào, nên các lỗi dưới đây chưa từng được ghi nhận.

  *Sửa lỗi nghĩa và cú pháp (semantic_fidelity, grammar_logic):*
  - `2.1`, `3.2` `aññamaññaṁ mukhasattīhi vitudantā`: "nhọn gai" → "sống đâm chọc nhau bằng những lời nói như giáo nhọn". `satti` là ngọn giáo, không phải gai; 30 nơi Pāli có đúng cụm này, 9 nơi dùng "giáo nhọn", 18 nơi dùng "đâm chọc", "nhọn gai" không có nơi nào khác.
  - `6.22` `mayamettha yamāmase`: "chúng ta hãy tự chế ngự ở đây" (đọc thành lời khuyến khích) → "rằng ở đây chúng ta phải tự chế", khớp dhp6:2, thag8.1:5.2, ja428:6.2 (cùng Pāli, 3/3 nơi); `pare ca na vijānanti` đứng trước, nên đây là nội dung điều người khác không hiểu.
  - `6.31`, `6.35` `saddhiṁ caraṁ sādhuvihāri dhīraṁ`: "cùng sống tốt lành với bậc trí" làm chủ thể của `sādhuvihāri` thành người đi tìm bạn; ba tính từ đều đứng ở đối cách, bổ nghĩa cho `sahāyaṁ` → "người trí đồng hành, khéo sống" (theo ja428:8.2).
  - `6.4` `nāññaṁ bhiyyo amaññaruṁ`: "họ chẳng nghĩ ai hơn mình" thêm "mình" mà Pāli không nói → "họ chẳng nghĩ thêm điều gì khác" (sát chữ, khớp ja428:1.4).
  - `6.1` `puthusaddo samajano`: bản trước bỏ mất `samajano` → "Đám đông cùng cất nhiều tiếng ồn ào" (ja428:1.1).
  - `6.25`, `6.5`: `pāṇaharā` "kẻ sát nhân" hẹp hơn `pāṇa` → "kẻ đoạt mạng"; `aṭṭhicchinnā` → "kẻ chặt xương"; `parimuṭṭhā` "lầm lạc" → "mê muội" (ja428:7.1, 2.1); `6.6` theo ja428:2.2.
  - `6.29` bỏ "riêng" (Pāli `kasmā tumhākaṁ no siyā` không nói "riêng các thầy").
  - `32.3`: bỏ cặp nháy đơn ‘…’ thêm vào quanh lời tuyên bố (Pāli không có), chỉ giữ ” đóng lời Đức Phật.

  *Sửa theo tiền lệ (terminology):*
  - `4.6`, `4.13`, `4.20` `appossukko … diṭṭhadhammasukhavihāraṁ anuyutto viharatu`: "vô sự, chuyên chú an trú vị lạc trong hiện tại" ("vô sự" 0 nơi nào khác, "vị lạc" 0/99) → "thảnh thơi, chuyên an trú hiện tại lạc trú", đúng mn67:12.5 và mn67:13.5 (cùng công thức, nói về chính Đức Phật), và đồng bộ `6.41` đã dịch `appossukko` là "thảnh thơi".
  - `2.1`, `3.2`, `4.2`, `4.7` và các khoá lặp (`4.9`, `4.14`, `4.16`, `4.21`) công thức `bhaṇḍana / kalaha / viggaha / vivāda`: "cãi cọ, tranh luận, … tranh chấp" → "tranh chấp, cãi vã, xung đột, tranh luận". Cụm ba `bhaṇḍanajātā kalahajātā vivādāpannā` có 31 nơi, 13 nơi dùng "tranh chấp, cãi vã, tranh luận" (dn33, mn104, an3.95, an3.124, an10.50…), dạng cũ 0 nơi; `bhaṇḍana` dịch "cãi cọ" chỉ 6/84 nơi.
  - `12.4`–`12.6`, `12.16`–`12.18` `āvi ceva raho ca`: "cả nơi đông người lẫn nơi vắng vẻ" (biến cách thức thành nơi chốn; 0/16 nơi) → "cả trước mặt lẫn sau lưng" (12/16 nơi, gồm mn31:7.4 là đoạn song song của chính câu này).
  - `4.7`, `4.14`, `4.21`: "chúng tôi" → "chúng con" (tỳ-kheo thưa với Đức Phật, đồng bộ `10.10`, `12.x`; AGENTS/skill §9).
  - `5.2`, `7.6`, `10.6`: "Người" (đại từ viết hoa chỉ Đức Phật, chỉ có ở bài này trong tự sự) → "Đức Phật", như các khoá liền kề.
  - `14.3` "đặt ra nước uống … đặt ra thùng rác" → "đặt sẵn" (`upaṭṭhāpeti` = chuẩn bị, đặt sẵn; "đặt ra" nghĩa là đề ra, tạo ra).
  Điểm đổi: terminology 9.1 → 9.2 (công thức nay khớp đa số); vietnamese_clarity 9 → 9.1 (bỏ "nhọn gai", "vị lạc", "đặt ra"); semantic_fidelity 9.1 → 9 và ambiguity_integrity 9.2 → 9 (bản trước đã tính điểm cao khi các lỗi trên còn nguyên và bất định dưới đây chưa được ghi nhận); grammar_logic, segment_alignment, triangulation, han_viet_balance, source_provenance không đổi. final_score 9.21 → 9.2.

  *Bất định còn lại (không phân xử được, giữ nguyên trong notes):*
  - `19.5` `tassa ubhatopasse vaṭṭakā uppateyyuṁ`: Pāli đã ghim đọc `vaṭṭakā` (chim cút), bản Anh Sujato dịch "killers" (như thể đọc `vadhakā`). Toàn tầng chỉ có đúng một câu này, không có song song để so. Bản dịch giữ đúng chữ đã ghim ("chim cút vụt bay lên ở hai bên"); nếu bản đọc đúng là `vadhakā` thì phải đổi thành "kẻ sát nhân" và thí dụ gần như đổi hẳn hình ảnh.
  - `26.6`, `27.11`, `30.11` `atinijjhāyitattaṁ rūpānaṁ`: từ hiếm duy nhất trong tầng (hapax). Giữ "sự chú tâm quá mức vào các sắc" (Sujato "excessive concentration"); `nijjhāyati` ở mn50:13 và dn1:2.10 được dịch "chăm chú, đăm chiêu", "dò xét", nên "nhìn ngắm, suy xét quá mức" cũng có thể.
  - `6.4` `nāññaṁ bhiyyo amaññaruṁ`: Sujato hiểu "không ai nghĩ người kia hơn", bản dịch chọn nghĩa sát chữ "không nghĩ thêm điều gì khác"; chưa có chú giải để phân xử.
  - `6.6` `vācāgocarabhāṇino`: "vượt khỏi phạm vi" theo Sujato và ja428:2.2; `gocara` có thể chỉ "phạm vi", nên cũng có thể là "chỉ nói trong phạm vi lời nói, nói tùy ý". Giữ nguyên, chưa phân xử.
  - `16.7` v.v. `samādhi cavi`: "bị biến diệt" (Sujato "fell away"); `cavati` thường là rơi, mất, chết đi, trong khi `antaradhāyati` mới là biến mất; cụm `samādhimhi cute` chỉ có ở bài này.
  - `25.3` v.v. `nānattasaññā` "tưởng khác nhau" (18/99 nơi; "tưởng sai biệt" 47/99, trong MN 8 nơi) và `4.5` `dhammassāmī`: không sai nghĩa, giữ.

  *Lỗi ngoài bài (đo được, chưa sửa):* mn48:2.1, 3.2, 4.7, 5.2, 5.4, 5.5 dịch `mukhasattīhi` "giáo mác đâm chém" và công thức ba từ khác đa số; dhp3:1, dhp4:1 "Nó mắng tôi, đánh tôi" trong khi ja428:3.1 và mn128:6.9 cùng Pāli đã là "Hắn mắng ta, hắn đánh ta"; mn104:2.2 và an2.43:1.5 còn "gai nhọn", "đâm bác"; mn31:9.3, 9.5 dịch `avakkārapāti` "thùng đựng thức ăn thừa" còn mn128:14.3, 14.5 là "thùng rác"; mn31:5.7 dịch `kacci … na kilamathā` thành "việc khất thực có khó khăn không?" (đảo phủ định).

  *Không đổi dù nghi ngờ:* `7.9`/`10.9` "có không mệt nhọc … không?" (hơi cộm nhưng đúng nghĩa); `5.2` "trên đường khất thực trở về" (51/127 nơi cùng cách nói); `7.5`/`10.5` "trên chỗ đã soạn"; `8.4` `dāya` "khu vườn" so với "khu rừng" ở `7.11`, `8.1` (mn31:3.1, 3.4 cùng cách); `12.2` "lợi lành".

  Kỹ thuật: `technical_integrity` giữ 9.5; chưa chạy lại `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này. Kiểm tra cục bộ: 279/279 khoá, thứ tự và tập khoá khớp Pāli, nháy và dấu lược khớp từng khoá, 75 cặp Pāli trùng nguyên văn trong bài (chỉ có 6 cặp bản Việt khác, đều do dấu câu hoặc mạch liền trước), NFC, không còn `…pe…`.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 5.1 — ‘Rồi Đức Phật buổi sáng đắp y, mang bát và y
  ngoài, đi vào Kosambī khất thực’ → ‘Rồi Đức Phật vào buổi sáng đắp y, cầm bát và y, vào Kosambī
  khất thực’ (công thức `pattacīvaramādāya` — ‘cầm bát và y’ chiếm đa số trong tầng; `pāvisi` =
  ‘vào’, bỏ ‘đi’ thừa; giữ ‘Đức Phật’ theo quy ước kể chuyện của Trung Bộ, không đổi sang ‘Đức Thế
  Tôn’ như dạng modal); khoá 12.9, 12.21 (cùng Pāli, quét trong bài) — thêm ‘chính’ và ‘này’ cho
  `imesaṁyeva āyasmantānaṁ`, đồng bộ với 12.8/12.20 và với `mn31:7.9`; giữ nguyên khoá 12.10
  (‘Thật vậy… con nghĩ tâm chúng con là một’ giữ được `hi` và `maññe`, sát Pāli hơn dạng modal
  ‘dường như’).
