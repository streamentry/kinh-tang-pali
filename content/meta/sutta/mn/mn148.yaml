summary: |-
  Đức Phật ở gần Sāvatthī, tại rừng Jeta. Ngài tuyên bố sẽ thuyết pháp tốt lành ở đầu, ở giữa, ở cuối, có nghĩa, có lời hay, trình bày đời sống phạm hạnh hoàn toàn viên mãn, hoàn toàn thanh tịnh, đó là sáu nhóm sáu.

  Sáu nhóm sáu ấy là: sáu nội xứ cần được biết, xứ mắt cho đến xứ ý; sáu ngoại xứ cần được biết, xứ sắc cho đến xứ pháp; sáu nhóm thức cần được biết, nhờ từng cặp như mắt và sắc; sáu nhóm xúc cần được biết, xúc mắt cho đến xúc ý; sáu nhóm thọ cần được biết, cảm thọ do duyên từng xúc ấy sanh; và sáu nhóm ái cần được biết, sắc tham ái cho đến pháp tham ái.

  Kinh bác bỏ: nói mắt là ngã là điều không thể chấp được, vì sự sinh lên và biến mất của mắt được thấy rõ, thấy vậy sẽ phải kết luận ngã của tôi sinh lên rồi biến mất; và như vậy mắt vô thường. Lập luận ấy lặp lại cho sắc, thức mắt, xúc mắt, cảm thọ, khát ái, rồi cho ý, pháp, thức ý, xúc ý, cảm thọ, khát ái. Con đường đến sự sinh khởi của ngã chấp là xem từng món ấy là của ta, ta là cái này, ngã của ta; con đường đến sự chấm dứt của ngã chấp là xem từng món ấy không phải của ta, không phải ta, không phải ngã của ta.

  Kinh phân tích từng cặp môn: nhờ mắt và sắc, thức mắt khởi lên, do duyên xúc, cảm thọ lạc, khổ hay không khổ không lạc khởi lên. Chạm đến cảm thọ lạc mà hoan hỉ, chấp thủ thì bị tùy miên tham chi phối; chạm đến cảm thọ khổ mà sầu não than khóc thì bị tùy miên sân chi phối; chạm đến cảm thọ không khổ không lạc mà không biết như thật sự sanh diệt, thỏ ngọt, nguy hiểm, lối ra của nó thì bị tùy miên vô minh chi phối. Khi không hoan hỉ, không chào đón, không bám chặt vào cảm thọ nào thì ba tùy miên không chi phối, đoạn vô minh, sinh minh, chấm dứt khổ là điều có trường hợp xảy ra. Cả hai phần lặp lại cho sáu môn.

  Thấy như vậy, Thánh đệ tử nhàm chán với mắt, các sắc, thức mắt, xúc mắt, cảm thọ, khát ái, cho đến ý, các pháp, thức ý, xúc ý, cảm thọ, khát ái; nhàm chán thì ly tham, ly tham thì giải thoát, và trí đã giải thoát khởi lên. Trong khi bài phân giải được thuyết, sáu mươi tỳ-kheo không chấp thủ mà được giải thoát khỏi các lậu hoặc. Toàn bài hội tụ về con đường từ biết sáu xứ đến giải thoát.
