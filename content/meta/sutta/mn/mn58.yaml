summary: |-
  Kinh Vương Tử Vô Úy kể chuyện khi Đức Phật ở Rājagaha, trong Trúc Lâm, tại khu cho sóc ăn. Nigaṇṭha Nāṭaputta dạy Vương tử Abhaya bác lập luận của Sa-môn Gotama bằng một câu hỏi gài hai phía: Như Lai có bao giờ nói lời khiến người khác không ưa, không thích hay không; trả lời là có thì hỏi Ngài khác người phàm ở điểm nào, trả lời là không thì hỏi sao Ngài tuyên bố Devadatta sẽ đi đến địa ngục, không thể cứu vãn. Vương tử Abhaya mời Phật đến nhà dùng bữa rồi sau đó đặt câu hỏi như đã được dạy.

  Đức Phật trả lời câu hỏi ấy không thể trả lời dứt khoát chỉ theo một phía; vương tử thưa như vậy thì các Nigaṇṭha đã thua ở điểm này rồi. Lúc ấy, một bé trai còn rất nhỏ đang ngồi trong lòng vương tử. Đức Phật hỏi: nếu vì sơ ý mà đứa bé cho que gỗ hay viên sỏi vào miệng, ông sẽ làm gì? Vương tử đáp sẽ lấy vật ấy ra dù có làm chảy máu, vì con thương đứa bé.

  Trên hình ảnh ấy, Đức Phật phân loại lời nói theo ba tiêu chí thật hay không thật, có lợi ích hay không, khiến người khác ưa hay không ưa. Lời không thật, không lợi ích thì không nói; lời thật nhưng không lợi ích cũng không nói, cả hai đều vậy bất kể khiến người khác ưa hay không ưa; chỉ lời thật, đúng thực tế, đem lại lợi ích mới được nói, và Như Lai biết đúng lúc để nói dù lời ấy khiến người không ưa hay ưa thích. Lý do được nêu: vì Như Lai có lòng thương đối với các hữu tình.

  Vương tử hỏi tiếp: khi những vị Sát-đế-lỵ, bà-la-môn, gia chủ hay sa-môn thông thái soạn sẵn câu hỏi đến hỏi, Như Lai có phải suy nghĩ trước, hay câu trả lời hiện ra ngay tại chỗ. Đức Phật hỏi lại qua chuyện vương tử thành thạo các bộ phận của một cỗ xe: với người ấy, câu trả lời hiện ra ngay tại chỗ. Cũng vậy, vì đã thấu suốt nguyên lý của Pháp, câu trả lời hiện ra ngay tại chỗ đối với Như Lai. Vương tử tán thán, xin quy y Thế Tôn, Pháp và Tăng chúng tỳ-kheo, được ghi nhận là cư sĩ đến trọn đời.

  Bài kinh nhấn mạnh: lời nói được đánh giá theo tính thật, lợi ích và thời điểm nói; Như Lai vẫn nói lời khiến người khác không ưa khi điều đó thật và có lợi, nhưng mọi lời của Ngài đều từ lòng thương đối với các hữu tình.
