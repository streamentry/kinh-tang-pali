summary: |-
  Tại Sāvatthī, Đức Phật đến tịnh thất bà-la-môn Rammaka nơi các tỳ-kheo đang bàn Pháp, dặn khi hội họp chỉ nên bàn Pháp hoặc giữ im lặng Thánh, rồi giảng hai loại tìm cầu: phi Thánh cầu là tự mình còn phải sinh, già, chết, ô nhiễm lại đi tìm những thứ cũng vậy — như vợ chồng, con cái, vàng bạc, tiền của; Thánh cầu là thấy rõ nguy hại của điều ấy mà tìm cái không sinh, không già, không chết, không ô nhiễm — sự an ổn tối thượng khỏi mọi ách, Niết-bàn.

  Đức Phật kể lại: khi còn là Bồ-tát, dù cha mẹ khóc đẫm nước mắt, Ngài cạo bỏ râu tóc, khoác y màu đất, xuất gia. Với Āḷāra Kālāma, Ngài chẳng bao lâu tự chứng pháp của ông và được mời cùng lãnh đạo hội chúng, nhưng thấy pháp ấy chỉ đưa đến tái sinh trong Vô sở hữu xứ, rồi rời đi. Với Uddaka, con của Rāma, cũng vậy: Ngài chứng pháp của Rāma, được đặt ngang vị thầy, nhưng thấy nó chỉ đưa đến Phi tưởng phi phi tưởng xứ, và rời đi.

  Tại làng Senā ở Uruvelā, Ngài ngồi tinh tấn bên dòng sông trong lành và đạt được sự an ổn tối thượng khỏi mọi ách, với tri kiến đây là lần sinh cuối cùng. Nghĩ pháp đã chứng quá sâu, khó thấy, người ta ưa bám víu, tâm Ngài nghiêng về không thuyết; Phạm thiên Sahampati hiện ra thỉnh cầu xin mở cánh cửa Bất tử. Ngài nhìn thế gian bằng Phật nhãn, thấy chúng sinh ít bụi, nhiều bụi trong mắt, như các đóa sen dưới nước, ngang mặt nước hay vượt khỏi mặt nước, rồi đồng ý.

  Hai vị thầy cũ đã qua đời; Ngài đến vườn nai Isipatana gặp nhóm năm tỳ-kheo từng chăm sóc Ngài lúc khổ hạnh. Trên đường, đạo sĩ Ājīvaka tên Upaka hỏi thầy của Ngài là ai; Ngài đáp bằng kệ: Ta thắng tất cả, biết tất cả, đã buông tất cả, không có thầy, đang đi đến Kāsi để chuyển bánh xe Chánh Pháp; Upaka lắc đầu rẽ đi. Nhóm năm vị hẹn không đảnh lễ nhưng không giữ nổi; sau ba lần Ngài nói Ta đã chứng được Bất tử và hỏi ngược: trước đây các thầy có từng nghe Ta nói như vậy chưa, họ mới nghe.

  Đức Phật hướng dẫn họ thay phiên nhau, hai vị và ba vị đi khất thực nuôi cả sáu người, cho đến khi cả năm đạt cái không sinh ấy. Kinh kết bằng phần năm dục trưởng dưỡng: kẻ hưởng dùng trong khi bị trói buộc như nai nằm mắc trên đống bẫy; kẻ hưởng dùng mà không trói buộc, như nai không mắc; còn tỳ-kheo chứng bốn thiền, các cõi vô sắc và diệt thọ tưởng với lậu hoặc đoạn tận thì như nai hoang đi, đứng, ngồi, nằm an toàn, vì ở ngoài tầm của Ác Ma.

notes: |-
  Lát f4 (2026-10-05): dịch lại 2 khoá bị cắt ngắm, cộng 1 khoá sửa dấu câu kèm theo.

  NGUỒN GỐC LỖI, ĐÃ ĐỐI CHIẾU ĐƯỢC: bản Anh Sujato đã ghim để trống mn26:27.17 và
  lược mn26:27.14 thành Reverend Gotama … you have returned to indulgence. Bản Việt đã
  sao chép đúng lỗi ấy. Nhưng Pāli của 27.14 TRÙNG NGUYÊN VĂN với 27.7 và 27.19, và hai
  khoá kia đã có bản dịch đầy đủ trong chính bài này — tức bản Việt tự mâu thuẫn với
  chính nó.

  ĐÃ SỬA (3 khoá trong tệp dịch):
  - 27.14 — dùng lại NGUYÊN VĂN bản dịch đã có ở 27.7 (và 27.19), đúng luật Pāli trùng
    nguyên văn phải dùng lại bản dịch. Không dịch lại từ đầu.
  - 27.17 — bỏ dấu lược bịa ở đầu khoá (Pāli khoá này không có …; dấu lược của cả cụm
    …pe… đã nằm ở 27.16) và bỏ động từ hãy, vì Pāli là viharissathā, tức sẽ an trú.
    Chủ thể các thầy và tự mình được phục hồi từ công thức đã nêu đủ ở 27.9–27.12; dấu
    lược ở 27.16 đã đánh dấu chỗ ấy.
  - 27.16 — khoá kèm theo, ngoài lát: Pāli mở nháy đơn ở 27.16 và đóng ở 27.17 bằng ’ti.
    Bản nháp đóng ở cả hai chỗ, làm chạy nháy đơn cả bài âm 1 (âm lần đầu ở 27.17). Xoá
    đúng một dấu ’ thì chạy về +0.

  ĐỘ DÀI: Pāli 29719 ký tự · Việt 23353 → 23563 (tỉ lệ 0,786 → 0,793). Phép so dấu lược
  theo từng khoá: lệch 4 → 2.

  CÒN LẠI, CHƯA SỬA (ngoài lát, đã ghi thành blocking error):
  - 13.3 và 30.1 — Pāli lược, bản Việt bung ra văn không dấu. 13.3 có 4 dấu lược, 30.1 có
    3. Nội dung không mất, chỉ mất dấu đánh dấu, nhưng trái luật §10.1 nên chưa cho qua.
    Nên sửa: 13.3 thành Tại sao Ta, tự mình còn phải sinh, già … bệnh … chết, sầu và ô
    nhiễm, lại đi tìm những thứ có cùng bản chất ấy?; 30.1 chèn ba dấu … vào các vị trí
    tương ứng trong danh sách già, bệnh, chết, sầu và ô nhiễm.
  - 16 khoá lệch dấu câu so với Pāli, đều không làm lệch chạy: 15.7, 16.7, 21.10, 32.2,
    32.8, 33.2, 33.8 (mất dấu nháy đơn của lời dẫn); 15.9, 16.9, 27.2, 32.5, 32.6, 33.5,
    33.6 (Pāli dùng nháy đơn, Việt dùng ngoặc kép); 17.7, 26.9 (Việt thêm ngoặc kép).
  - 6 nhóm Pāli trùng nguyên văn trong bài mà bản Việt khác nhau. Nhóm đã sửa xong là
    27.7/27.14/27.19. Còn lại: nhóm Tassa mayhaṁ … etadahosi (18 khoá, 5 cách vì có
    thêm vế nói đến Āḷāra Kālāma, Uddaka, nhóm năm vị — phần lớn là hợp lý, khác ngôi
    kể); 15.5/16.5 (vế mà vị thầy đã chứng biết, khác chủ thể trong lời dẫn); 15.11/15.22
    (hỏi và nói); 18.2/22.10/23.10 (có vế và); 27.1/27.8/28.1 (hỏi, nói với họ, nói);
    27.5/27.12/28.6 (27.5 bung hết câu còn hai khoá kia lược theo …pe…).
  - 15.5 và 16.5 khác nhau ở vế mà vị thầy của mình đã chứng biết so với mà vị thầy đã
    chứng biết: 15.5 có vị thầy của mình, 16.5 không. Pāli hai khoá khác nhau nên có thể
    là cố ý, nhưng chưa có chú thích.

