summary: |-
  Tại Sāvatthī, Đức Phật đến tịnh thất bà-la-môn Rammaka nơi các tỳ-kheo đang bàn Pháp, dặn khi hội họp chỉ nên bàn Pháp hoặc giữ im lặng Thánh, rồi giảng hai loại tìm cầu: phi Thánh cầu là tự mình còn phải sinh, già, chết, ô nhiễm lại đi tìm những thứ cũng vậy — như vợ chồng, con cái, vàng bạc, tiền của; Thánh cầu là thấy rõ nguy hại của điều ấy mà tìm cái không sinh, không già, không chết, không ô nhiễm — sự an ổn tối thượng khỏi mọi ách, Niết-bàn.

  Đức Phật kể lại: khi còn là Bồ-tát, dù cha mẹ khóc đẫm nước mắt, Ngài cạo bỏ râu tóc, khoác y màu đất, xuất gia. Với Āḷāra Kālāma, Ngài chẳng bao lâu tự chứng pháp của ông và được mời cùng lãnh đạo hội chúng, nhưng thấy pháp ấy chỉ đưa đến tái sinh trong Vô sở hữu xứ, rồi rời đi. Với Uddaka, con của Rāma, cũng vậy: Ngài chứng pháp của Rāma, được đặt ngang vị thầy, nhưng thấy nó chỉ đưa đến Phi tưởng phi phi tưởng xứ, và rời đi.

  Tại làng Senā ở Uruvelā, Ngài ngồi tinh tấn bên dòng sông trong lành và đạt được sự an ổn tối thượng khỏi mọi ách, với tri kiến đây là lần sinh cuối cùng. Nghĩ pháp đã chứng quá sâu, khó thấy, người ta ưa bám víu, tâm Ngài nghiêng về không thuyết; Phạm thiên Sahampati hiện ra thỉnh cầu xin mở cánh cửa Bất tử. Ngài nhìn thế gian bằng Phật nhãn, thấy chúng sinh ít bụi, nhiều bụi trong mắt, như các đóa sen dưới nước, ngang mặt nước hay vượt khỏi mặt nước, rồi đồng ý.

  Hai vị thầy cũ đã qua đời; Ngài đến vườn nai Isipatana gặp nhóm năm tỳ-kheo từng chăm sóc Ngài lúc khổ hạnh. Trên đường, đạo sĩ Ājīvaka tên Upaka hỏi thầy của Ngài là ai; Ngài đáp bằng kệ: Ta thắng tất cả, biết tất cả, đã buông tất cả, không có thầy, đang đi đến Kāsi để chuyển bánh xe Chánh Pháp; Upaka lắc đầu rẽ đi. Nhóm năm vị hẹn không đảnh lễ nhưng không giữ nổi; sau ba lần Ngài nói Ta đã chứng được Bất tử và hỏi ngược: trước đây các thầy có từng nghe Ta nói như vậy chưa, họ mới nghe.

  Đức Phật hướng dẫn họ thay phiên nhau, hai vị và ba vị đi khất thực nuôi cả sáu người, cho đến khi cả năm đạt cái không sinh ấy. Kinh kết bằng phần năm dục trưởng dưỡng: kẻ hưởng dùng trong khi bị trói buộc như nai nằm mắc trên đống bẫy; kẻ hưởng dùng mà không trói buộc, như nai không mắc; còn tỳ-kheo chứng bốn thiền, các cõi vô sắc và diệt thọ tưởng với lậu hoặc đoạn tận thì như nai hoang đi, đứng, ngồi, nằm an toàn, vì ở ngoài tầm của Ác Ma.
