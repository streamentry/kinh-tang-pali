summary: |-
  Đức Phật đang du hành trong xứ Kosala cùng Tăng chúng tỳ-kheo đông đảo thì đến làng Nagaravinda của các bà-la-môn. Các gia chủ nghe tiếng lành của Ngài, đi đến chào hỏi đủ cách rồi ngồi xuống một bên. Đức Phật dạy họ nên trả lời thế nào khi các du sĩ ngoại đạo hỏi rằng hạng tỳ-kheo-bà-la-mon như thế nào thì không đáng được tôn kính, cung kính, tôn trọng, cúng dường, và như thế nào thì đáng.

  Câu trả lời thứ nhất: hạng chưa ly tham, chưa ly sân, chưa ly si đối với các sắc, tiếng, hương, vị, xúc, pháp nhận biết qua sáu căn, nội tâm chưa an tịnh, thân ngữ ý hành xử lúc ngay lúc không ngay — hạng ấy không đáng được tôn kính. Lý do được đưa ra là: vì chính các gia chủ cũng chưa ly tham, sân, si đối với các đối tượng ấy, nên họ không thấy hạnh đồng đều của các vị ấy cao hơn mình.

  Câu trả lời thứ hai đảo lại: hạng đã ly tham, sân, si đối với sáu đối tượng ấy, nội tâm an tịnh, thân ngữ ý hành xử ngay lành đồng đều — hạng ấy đáng được tôn kính, và vì chính mình chưa ly tham, sân, si nên các gia chủ thấy hạnh đồng đều của các vị ấy cao hơn mình. Khi du sĩ hỏi dựa vào căn cứ nào mà nói các bậc Đáng Tôn đã ly tham hoặc đang thực hành để ly tham, sân, si, câu trả lời là: các bậc ấy thường đến những nơi trú ở xa xăm trong rừng rậm hoang vắng, nơi không có những sắc, tiếng, hương, vị, xúc mà nhìn, nghe, ngửi, nếm, chạm rồi vẫn còn ưa thích.

  Tiêu chuẩn được đặt trên chính trạng thái ly tham, sân, si và sự an tịnh của nội tâm, với lối sống nơi rừng vắng làm dấu hiệu chứng thực. Nghe dạy xong, các bà-la-môn gia chủ ở Nagaravinda ngợi ca và xin quy y Đức Phật, Pháp và Tăng chúng tỳ-kheo.
