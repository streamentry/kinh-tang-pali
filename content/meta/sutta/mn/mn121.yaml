summary: |-
  Kinh Tiểu Không diễn ra tại Sāvatthī, ở Đông Viên, trong lâu đài của mẹ Migāra, khi Tôn giả Ānanda nhắc lại lời mình đã nghe tại Nagaraka, thị trấn của người Sakya: nay Ta thường an trú bằng pháp không. Đức Phật xác nhận là đúng: trước đây cũng như hiện nay, Ngài vẫn thường an trú như vậy. Như chính lâu đài này trống không voi bò ngựa, trống không vàng bạc, trống không hội họp nam nữ, chỉ còn Tăng chúng tỳ-kheo là cái không trống không, tỳ-kheo cũng không tác ý tưởng làng, không tác ý tưởng người, mà tác ý tính một do duyên tưởng rừng.

  Mỗi mức lặp lại một công thức: những não hại do duyên tưởng đã từ bỏ không có mặt ở đây, chỉ còn lại một chút não hại do duyên tưởng đang tác ý; vị ấy biết rõ lĩnh vực tưởng trống không cái này, trống không cái kia, chỉ còn cái không trống không ấy. Cái gì không có mặt, vị ấy thấy là trống không; cái gì còn lại, vị ấy biết rõ là có mặt. Như vậy là sự hiện khởi của pháp không chân thật, không đảo, thuần tịnh.

  Tiếp theo, tỳ-kheo trú tưởng đất như tấm da bò đực căng phẳng không còn nếp nhăn, rồi lần lượt tác ý tưởng hư không vô biên xứ, tưởng thức vô biên xứ, tưởng vô sở hữu xứ, tưởng phi tưởng phi phi tưởng xứ, mỗi mức lặp lại công thức trên cho cặp tưởng vừa được từ bỏ. Sau cùng, vị ấy tác ý tính một do duyên vô tướng tâm định; chỗ còn lại không trống không chỉ là sáu xứ tùy thuộc chính thân này, do mạng sống làm điều kiện.

  Lại nữa, vị ấy biết cả vô tướng tâm định này cũng do hành tạo tác, do tư tạo tác, và cái gì do hành tạo tác, do tư tạo tác là vô thường, có bản chất đoạn diệt. Khi biết và thấy như vậy, tâm được giải thoát khỏi dục lậu, hữu lậu và vô minh lậu. Chỗ ấy trống không cả ba lậu hoặc, và đó là sự hiện khởi của pháp không chân thật, không đảo, thuần tịnh, tối thượng vô thượng. Đức Phật khẳng định mọi sa-môn hay bà-la-môn quá khứ, tương lai, hiện tại chứng đạt pháp không thuần tịnh tối thượng vô thượng đều là chính pháp không này, và khuyên các thầy học như vậy.

  Ý trung tâm của bài kinh là dãy trút bỏ dần từng mức tưởng, nơi pháp không hiện khởi chân thật ở mỗi bước, nhưng chỉ đạt mức tối thượng vô thượng khi tâm được giải thoát khỏi ba lậu hoặc.
