summary: |-
  Một thời Đức Phật ở gần Sāvatthī, tại rừng Jeta. Ngài nêu: phần lớn chúng sinh mong điều không đáng ưa giảm đi và điều đáng ưa tăng lên, nhưng chúng lại tăng và giảm ngược lại. Nguyên nhân: người phàm chưa được học không biết pháp nào nên thực hành, điều gì nên gần gũi, nên làm ngược lại; Thánh đệ tử có học biết rõ, nên điều đáng ưa tăng lên.

  Kinh nêu bốn cách thực hành được chọn theo đuổi: hiện tại đau khổ và về sau quả khổ; hiện tại dễ chịu nhưng về sau quả khổ; hiện tại đau khổ nhưng về sau quả vui; hiện tại dễ chịu và về sau quả vui. Người ngu chìm trong vô minh, không hiểu đúng như thật từng cách: với hai cách cho quả khổ, họ thực hành và không tránh; với hai cách cho quả vui, họ không thực hành mà tránh. Người có hiểu biết, có minh, hiểu đúng như thật, làm ngược lại. Công thức được lặp lại cho từng cách.

  Cách hiện tại đau khổ và quả khổ là người vừa đau khổ vừa ưu buồn mà vẫn thực hành mười điều bất thiện gồm sát sinh, lấy của không được cho, tà hạnh trong dục, bốn loại lời xấu, tham muốn, sân hại và tà kiến, rồi tái sinh vào cõi dữ, địa ngục. Cách hiện tại dễ chịu nhưng quả khổ: cùng mười điều ấy được làm trong vui sướng hân hoan, quả cũng là địa ngục. Cách hiện tại đau khổ nhưng quả vui: vừa đau khổ ưu buồn mà vẫn từ bỏ mười điều ấy, tái sinh vào cõi lành, cõi trời. Cách hiện tại dễ chịu và quả vui: mười điều từ bỏ ấy được giữ trong vui sướng hân hoan, quả là cõi trời.

  Kinh nêu bốn ví dụ: quả bầu đắng trộn độc, không hấp dẫn, người uống không suy xét rồi chết, ví cách hiện tại đau khổ và quả khổ; cốc đồ uống màu đẹp, mùi thơm, vị ngon nhưng trộn độc, người uống không suy xét rồi chết, ví cách dễ chịu hiện tại mà quả khổ; nước tiểu lên men trộn thuốc chữa bệnh vàng da, không hấp dẫn nhưng uống xong khỏe, người uống sau khi suy xét, ví cách đau khổ hiện tại mà quả vui; sữa chua, mật ong, bơ sữa, mật mía trộn chung chữa bệnh kiết lỵ, hấp dẫn, uống xong khỏe, người uống sau khi suy xét, ví cách dễ chịu hiện tại và quả vui.

  Kinh kết bằng ví dụ mặt trời mùa thu xua tan bóng tối: cách hiện tại dễ chịu và về sau cũng cho quả vui vượt lên trên các học thuyết khác của nhiều sa-môn bà-la-môn.
