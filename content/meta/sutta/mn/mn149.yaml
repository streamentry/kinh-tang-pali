summary: |-
  Đức Phật ở Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika, tuyên bố sẽ dạy các tỳ-kheo bài kinh Đại sáu xứ.

  Kinh trình bày trường hợp người không biết, không thấy như thật mắt, các sắc, nhãn thức, nhãn xúc, và cảm giác thuộc lạc, thuộc khổ hay thuộc bất khổ bất lạc khởi lên do duyên nhãn xúc ấy: vị ấy tham thích tất cả, sống tham thích, hệ lụy, si mê, quán sát vị ngọt, nên năm thủ uẩn trong tương lai đi đến tích trữ; ái đưa đến tái sinh, câu hữu với hỷ và tham, tìm chỗ hoan lạc nơi này nơi kia, được tăng trưởng; ưu não, nhiệt não, nóng bỏng thuộc thân và thuộc tâm được tăng trưởng; vị ấy cảm thọ thân khổ và tâm khổ. Cơ cấu ấy được lặp lại cho tai, mũi, lưỡi, thân, ý.

  Người biết và thấy như thật những pháp ấy thì không tham thích, sống không hệ lụy, không si mê, quán sát bất lợi, nên năm thủ uẩn trong tương lai đi đến suy giảm; ái ấy được đoạn tận; ưu não, nhiệt não, nóng bỏng thuộc thân và thuộc tâm được đoạn tận; vị ấy cảm thọ thân lạc và tâm lạc.

  Với người biết và thấy như thật ấy, cái thấy là chánh kiến, tư duy là chánh tư duy, tinh tấn là chánh tinh tấn, niệm là chánh niệm, định là chánh định; thân nghiệp, ngữ nghiệp và mạng sống từ trước đã thanh tịnh; bằng cách đó Thánh đạo tám ngành được đưa đến sự viên mãn của sự tu tập, và bốn niệm xứ, bốn chánh cần, bốn như ý túc, năm căn, năm lực, bảy giác chi cũng vậy. Hai pháp chuyển vận song hành trong vị ấy là an tịnh và minh sát: năm thủ uẩn là những pháp cần hoàn toàn hiểu bằng trực tiếp biết, vô minh và hữu ái cần được đoạn tận, an tịnh và minh sát cần được tu tập, minh và giải thoát cần được chứng ngộ.

  Toàn bộ phần này được lặp lại cho các môn từ tai đến ý. Bài kinh dựng thành từng cặp tương phản: biết và thấy như thật sáu xứ với thức, xúc, cảm giác của chúng thì năm uẩn tương lai suy giảm và thân tâm được lạc; không biết, không thấy thì năm uẩn tích trữ và thân tâm chịu khổ; và toàn bộ Thánh đạo với các pháp cần hiểu, cần đoạn, cần tu tập, cần chứng ngộ được khép chặt vào sự biết thấy như thật ấy.
