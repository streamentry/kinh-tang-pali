summary: |-
  Kinh Bhaddāli kể khi Đức Phật ở Sāvatthī, tại tu viện Anāthapiṇḍika. Ngài khuyên các tỳ-kheo ăn một lần ngồi mỗi ngày để ít bệnh, nhẹ nhõm, mạnh khỏe. Tôn giả Bhaddāli thưa không thể nỗ lực, sợ tâm hối lỗi; dù được phép mang phần ăn về, vị ấy vẫn từ chối; khi giới học pháp được quy định, vị ấy tuyên bố không nỗ lực. Suốt ba tháng vị ấy không gặp mặt Đức Phật; được các tỳ-kheo đang may y cho Ngài cảnh báo, vị ấy mới đến thú nhận.

  Đức Phật xác nhận đó là lỗi, nêu sáu trường hợp không thấu rõ: từ Đức Phật đến cư sĩ, đạo sĩ khác đều sẽ biết ông không hoàn thành việc học giới. Ngài hỏi: nếu bảo một vị trong bảy hạng đệ tử Thánh làm cầu băng vũng lầy, há người ấy sẽ nói không chăng? Bhaddāli thừa nhận mình là kẻ rỗng tuếch, trống rỗng, có lỗi. Đức Phật chấp nhận: thấy rõ lỗi là lỗi, đối trị đúng Pháp, tự chế ngự về sau là trưởng thành trong đạo luật bậc Thánh.

  Hai vị tỳ-kheo cùng ở nơi trú ẩn viễn lý: vị không hoàn thành việc học giới bị Đạo sư, các đồng phạm hạnh, chư thiên và tự mình trách mắng, không chứng đạt pháp siêu nhân; vị hoàn thành việc học giới thì không bị ai trách mắng: chứng bốn thiền, nhớ lại nhiều đời quá khứ, thấy chúng sinh tái sinh theo nghiệp, đoạn tận các lậu hoặc — mỗi bước kèm lý do vì sự việc ấy xảy ra như vậy với người hoàn thành việc học giới.

  Bhaddāli hỏi vì sao Tăng đoàn làm khó dễ một số tỳ-kheo, không làm khó dễ một số khác; Đức Phật trả lời tùy theo vị được khuyên bảo ứng xử quanh co, lảng tránh, bực bội hay hành xử đúng, hạ tấm lòng, cam kết làm điều khiến Tăng đoàn vừa ý; riêng vị chỉ sống nhờ lòng tin, yêu mến thì được che chở như con mắt duy nhất của người một mắt.

  Bhaddāli hỏi vì sao trước kia giới học pháp ít hơn mà nhiều tỳ-kheo chứng được quyết định, bây giờ thì ngược lại; Ngài đáp: khi chúng sinh suy giảm, Chánh pháp đang biến mất thì như vậy, và chỉ khi có pháp chỗ cho lậu hoặc xuất hiện trong Tăng đoàn, Đạo sư mới quy định giới học pháp để ngăn chặn. Cuối kinh, Ngài dạy ví dụ con ngựa thuần chủng, kết bằng mười pháp vô học: chánh kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm, chánh định, chánh tri, chánh giải thoát — nhờ đó tỳ-kheo xứng đáng là ruộng phước tối thượng của đời.
