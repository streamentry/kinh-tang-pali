summary: |-
  Ở Rājagaha, trên núi Gijjhakūṭa, trong Hang Lợn Rừng, du sĩ Dīghanakha tuyên bố quan điểm của mình: không điều gì được chấp nhận bởi ta. Đức Phật hỏi ngay kiến giải ấy có được chính ông chấp nhận không; ông đáp: cũng như vậy thôi, cũng chỉ như vậy thôi. Đức Phật nhận xét nhiều người nói vậy nhưng vẫn chấp lấy kiến giải khác, và chỉ rất ít người từ bỏ nó mà không chấp lấy kiến giải khác.

  Đức Phật nêu ba giáo nghĩa: mọi thứ đều được chấp nhận bởi ta; không điều gì được chấp nhận; một số điều thì có, một số thì không. Kiến giải mọi thứ đều được chấp nhận là gần gũi với lòng tham, trói buộc, tán thưởng, chấp trước, chấp thủ; kiến giải không điều gì được chấp nhận thì xa rời năm điều ấy. Dīghanakha tưởng Ngài đang khen mình; Ngài hoàn thiện: ở giáo nghĩa thứ ba, phần chấp nhận gần gũi với năm điều ấy, phần không chấp nhận thì xa rời. Người có trí phản chiếu từng quan điểm: nếu khư khư chấp vịn với tinh thần đây là chân lý duy nhất, những điều khác đều vô nghĩa, thì sẽ bất đồng với hai hạng còn lại; bất đồng thì tranh cãi, tranh cãi thì phiền bức, phiền bức thì hại thương. Thấy vậy, người ấy từ bỏ kiến giải mà không chấp lấy kiến giải khác — như vậy các kiến giải được xả ly.

  Đức Phật chuyển sang thân: là sắc, tạo từ bốn đại, có tính vô thường; nên thấy nó là vô thường, khổ, bệnh, ung nhọt, phiền não, tai họa, trống rỗng, vô ngã; quán như vậy thì dục tham, ái luyến và sự qui thuận nơi thân được đoạn bỏ. Rồi ba loại thọ — lạc, khổ, phi khổ phi lạc: khi cảm nhận loại này thì không cảm nhận hai loại kia; cả ba đều vô thường, hữu vi, duyên sinh, có tính tận và hoại. Thấy vậy, đệ tử Thánh có học nhàm chán với cả ba thọ; nhàm chán thì không tham, không tham thì giải thoát, và vị ấy biết sinh đã tận, đời phạm hạnh đã hoàn thành. Tâm giải thoát không tranh luận, tranh chấp với ai; những gì được nói ở đời, vị ấy dùng ngôn ngữ ấy mà không chấp trước.

  Tôn giả Sāriputta đứng sau quạt mát, phản chiếu rằng Đức Phật khuyên từ bỏ nhờ thắng trí trực tiếp các pháp này, và tâm được giải thoát khỏi các lậu hoặc. Du sĩ Dīghanakha thì mắt Pháp không bụi bặm sinh khởi: Pháp gì có tính sinh khởi, tất cả đều có tính chấm dứt; ông vượt qua hoài nghi, loại trừ do dự, xin quy y trọn đời. Cả hai thành tựu ấy đều có trong chính bài kinh: Sāriputta tâm được giải thoát khỏi các lậu hoặc, Dīghanakha sinh mắt Pháp.
