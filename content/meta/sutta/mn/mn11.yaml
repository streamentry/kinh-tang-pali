summary: |-
  Tiểu Kinh Sư Tử Hống ghi lại thời Đức Phật ở rừng Jeta, tu viện ông Anāthapiṇḍika gần Sāvatthī. Ngài gọi các tỳ-kheo và tuyên bố: chỉ trong Giáo pháp này mới có bậc Sa-môn thứ nhất, thứ hai, thứ ba và thứ tư, các giáo phái khác không có; và đó là cách nên cất tiếng sư tử hống chính đáng.

  Khi du sĩ thuộc đạo khác hỏi dựa vào đâu mà tuyên bố như vậy, các tỳ-kheo được dạy trả lời: vì thấy bốn điều nơi chính mình là lòng tin nơi bậc Đạo sư, lòng tin nơi Giáo pháp, sự thành tựu giới hạnh, và tình thương với người cùng đi trên con đường này. Nếu họ nói cũng có bốn điều ấy, kinh chuyển sang chuỗi câu hỏi: mục tiêu là một hay nhiều, và dành cho người còn hay không còn tham, sân, si, ái, chấp thủ, thiên vị và chống đối, ưa sự phóng diễn của tâm; các cặp đều có đáp án theo mẫu dành cho người không còn tham, sân, si v.v., riêng cặp hiểu biết thì đáp án đúng là mục tiêu dành cho người vô minh, không phải người có hiểu biết.

  Kinh phân biệt hai loại quan điểm: thiên về hiện hữu và thiên về không hiện hữu; ai nương theo, chấp chặt loại này thì chống lại loại kia. Những Sa-môn Bà-la-môn không hiểu đúng như thật nguồn gốc, sự biến mất, vị ngọt, nguy hại và lối thoát khỏi hai quan điểm ấy thì còn tham, sân, si, ái, chấp thủ, vô minh, và Ta nói họ không thoát khỏi khổ; ai hiểu như vậy thì thoát khỏi khổ.

  Phần sau nêu bốn loại thủ: dục thủ, kiến thủ, giới cấm thủ và ngã luận thủ. Nhiều Sa-môn Bà-la-môn tuyên bố giảng sự hiểu thấu đáo mọi loại thủ nhưng không mô tả đúng: có vị chỉ mô tả dục thủ, có vị thêm kiến thủ hay giới cấm thủ, còn ngã luận thủ thì không mô tả. Trong giáo pháp và giới luật như thế, bốn điều nêu trên được xem là đặt không đúng chỗ, vì pháp ấy được giảng không khéo, không đưa đến giải thoát và an tịnh. Riêng Như Lai mô tả hiểu thấu đáo cả bốn loại thủ, nên bốn điều ấy được xem là đặt đúng chỗ, vì pháp được giảng khéo, đưa đến giải thoát và an tịnh, do bậc Chánh Đẳng Giác tuyên thuyết.

  Kinh kết thúc bằng chuỗi nguồn gốc: bốn chấp thủ lấy ái làm nguồn, ái lấy thọ, thọ lấy xúc, xúc lấy sáu xứ, sáu xứ lấy danh-sắc, danh-sắc lấy thức, thức lấy hành, hành lấy vô minh. Khi tỳ-kheo đã từ bỏ vô minh, làm sinh khởi minh, vị ấy không chấp thủ bốn loại thủ; không chấp thủ thì không còn lo âu, không lo âu thì tự mình đạt tịch diệt, và biết rằng sinh đã tận.
