summary: |-
  Kinh Người Thiện do Đức Phật thuyết tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika. Đức Phật nói sẽ giảng cho các tỳ-kheo pháp của người thiện và pháp của người bất thiện, và cả hai pháp được xét theo cùng một cách: người bất thiện có điều gì thì lấy điều đó tự tâng bốc mình và khinh miệt người khác; người thiện thì suy tầm khác đi và không làm thế.

  Trước hết là các điều thuộc thân thế, vật dụng và học tập: người bất thiện xuất gia từ gia đình cao quý hay giàu có, có danh tiếng, được y, đồ ăn khất thực, chỗ nghỉ ngơi và thuốc men trị bệnh, nghe nhiều, thông hiểu Luật, thuyết Pháp, nghĩ mình hơn người ở đó và nhờ đó tự tâng bốc mình, khinh miệt người khác. Người thiện thì suy tầm: không phải nhờ điều ấy mà các pháp tham, các pháp sân, các pháp si được đoạn tận; dầu có người không có điều ấy, nếu hành trì đúng pháp, tùy pháp, sống tùy thuận pháp, vị ấy mới đáng tôn kính, đáng tán thán. Chỉ đặt hạnh trình làm chuẩn, người thiện không tự tâng bốc hay khinh miệt ai.

  Các hạnh khổ hạnh cũng theo cách ấy: người bất thiện ở rừng, mặc y phấn tảo, ăn khất thực, ở gốc cây, ở rừng nghĩa địa, ở ngoài trời, ngồi không nằm, ngủ nơi nào có chỗ trải, ăn một bữa, nghĩ mình hơn người, tự tâng bốc và khinh miệt người khác; người thiện suy tầm rằng không phải nhờ các hạnh ấy mà tham, sân, si được đoạn tận, chỉ đặt hạnh trình làm chuẩn, không tự tâng bốc hay khinh miệt ai.

  Sang các tầng thiền và chứng đắc sâu hơn, chuẩn của người thiện chuyển sang tính không bị nó tác thành. Người bất thiện chứng sơ thiền, nhị thiền đến tứ thiền, hoặc vượt qua các tưởng sắc chứng hư không vô biên xứ, thức vô biên xứ, vô sở hữu xứ, phi tưởng phi phi tưởng xứ, nhờ đó tự tâng bốc mình, khinh miệt người khác. Người thiện suy tầm: ngay cả sự chứng đắc ấy cũng được Đức Thế Tôn nói là tính không bị nó tác thành, với cái nào họ quán niệm thì với cái ấy trở thành khác đi; chỉ đặt tính không bị nó tác thành làm chuẩn, không nhờ chứng đắc ấy mà tự tâng bốc hay khinh miệt ai.

  Kinh khép lại ở người thiện trọn vẹn nhất: vượt qua hoàn toàn phi tưởng phi phi tưởng xứ, chứng diệt thọ tưởng, thấy bằng trí tuệ, các lậu hoặc được đoạn tận. Vị tỳ-kheo ấy không quán niệm gì, không quán niệm ở đâu, không quán niệm vì cái gì.

notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-05) — hai lỗi nghĩa trọng yếu, phát hiện trong quá
  trình audit tóm tắt:**

  1. **Đảo chiều phủ định ở 12 segment** (3.8, 4-6.9, 7.7–15.7, 16-20.11): bản dịch
  cũ *"Không phải nhờ X mà các pháp tham **không** đoạn tận…"* — thêm phủ định thứ
  hai không có trong Pāli. Pāli đã pin: *"na kho [X]-ena lobhadhammā vā
  **parikkhayaṁ gacchanti**…"* — phủ định nắm cụm nhân cách, động từ khẳng định
  ("được đoạn tận"), khớp Sujato *"It's not because of … that thoughts of greed,
  hate, or delusion come to an end."* Đã bỏ phủ định thứ hai; giờ khớp Pāli và
  khớp chiều đối lập "Người thiện suy tầm" ở các segment liền sau.

  2. **`atammayatā` dịch nhầm thành "pháp vô tham ái" ở 12 segment** (21.7, 21.9,
  22-24.9/.11, 25.7/.9, 26.7/.9, 27.7/.9, 28.7/.9): Pāli *atammayatā* = tính *không
  bị nó tác thành* (a + taṁ + mayatā), Sujato: *"not being determined even by the
  attainment of the first absorption"*; câu liền sau của chính bản dịch — *"Với cái
  nào họ quán niệm, thì với cái ấy trở thành khác đi"* (21.8/28.8) — tự xác nhận
  nghĩa này; "vô tham ái" (arāga) là thuật ngữ khác. Đã dịch nhất quán thành
  *"tính không bị nó tác thành"*, giữ distinction với vô tham/ly tham.
