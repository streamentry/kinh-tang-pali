summary: |-
  Kinh Người Thiện do Đức Phật thuyết tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika. Đức Phật nói sẽ giảng cho các tỳ-kheo pháp của người thiện và pháp của người bất thiện, và cả hai pháp được xét theo cùng một cách: người bất thiện có điều gì thì lấy điều đó tự tâng bốc mình và khinh miệt người khác; người thiện thì suy tầm khác đi và không làm thế.

  Trước hết là các điều thuộc thân thế, vật dụng và học tập: người bất thiện xuất gia từ gia đình cao quý hay giàu có, có danh tiếng, được y, đồ ăn khất thực, chỗ nghỉ ngơi và thuốc men trị bệnh, nghe nhiều, thông hiểu Luật, thuyết Pháp, nghĩ mình hơn người ở đó và nhờ đó tự tâng bốc mình, khinh miệt người khác. Người thiện thì suy tầm: không phải nhờ điều ấy mà các pháp tham, các pháp sân, các pháp si được đoạn tận; dầu có người không có điều ấy, nếu hành trì đúng pháp, tùy pháp, sống tùy thuận pháp, vị ấy mới đáng tôn kính, đáng tán thán. Chỉ đặt hạnh trình làm chuẩn, người thiện không tự tâng bốc hay khinh miệt ai.

  Các hạnh khổ hạnh cũng theo cách ấy: người bất thiện ở rừng, mặc y phấn tảo, ăn khất thực, ở gốc cây, ở rừng nghĩa địa, ở ngoài trời, ngồi không nằm, ngủ nơi nào có chỗ trải, ăn một bữa, nghĩ mình hơn người, tự tâng bốc và khinh miệt người khác; người thiện suy tầm rằng không phải nhờ các hạnh ấy mà tham, sân, si được đoạn tận, chỉ đặt hạnh trình làm chuẩn, không tự tâng bốc hay khinh miệt ai.

  Sang các tầng thiền và chứng đắc sâu hơn, chuẩn của người thiện chuyển sang vô tham ái. Người bất thiện chứng sơ thiền, nhị thiền đến tứ thiền, hoặc vượt qua các tưởng sắc chứng hư không vô biên xứ, thức vô biên xứ, vô sở hữu xứ, phi tưởng phi phi tưởng xứ, nhờ đó tự tâng bốc mình, khinh miệt người khác. Người thiện suy tầm: ngay cả sự chứng đắc ấy cũng được Đức Thế Tôn nói là pháp vô tham ái, với cái nào họ quán niệm thì với cái ấy trở thành khác đi; chỉ đặt vô tham ái làm chuẩn, không nhờ chứng đắc ấy mà tự tâng bốc hay khinh miệt ai.

  Kinh khép lại ở người thiện trọn vẹn nhất: vượt qua hoàn toàn phi tưởng phi phi tưởng xứ, chứng diệt thọ tưởng, thấy bằng trí tuệ, các lậu hoặc được đoạn tận. Vị tỳ-kheo ấy không quán niệm gì, không quán niệm ở đâu, không quán niệm vì cái gì.
