summary: |-
  Kinh Pháp Chắc Chắn xảy ra khi Đức Phật du hành trong xứ Kosala cùng đại chúng tỳ-kheo, đến Sālā, một làng bà-la-môn. Các bà-la-môn và gia chủ ở đó đến gặp Ngài. Đức Phật hỏi họ chưa có vị thầy nào khiến mình hài lòng, chưa có niềm tin có căn cứ, rồi dạy tiếp nhận pháp chắc chắn đem lại lợi ích và an lạc lâu dài.

  Pháp chắc chắn được trình bày qua năm cặp chủ trương trái ngược nhau: về quả của bố thí, tế lễ, nghiệp thiện ác, về đời sau; về hiệu lực của hành động; về nguyên nhân khiến hữu tình ô nhiễm và thanh tịnh, về năng lực, nỗ lực của con người; về những chứng đạt vô sắc; và về sự chấm dứt hoàn toàn của quá trình hiện hữu.

  Ba cặp đầu phân tích cùng một công thức: người chủ trương phủ định có thể mong đợi tránh xa thiện rồi thực hành ác, quan điểm ấy là tà kiến, tà tư duy, tà ngữ; người chủ trương khẳng định thì ngược lại, nhiều pháp thiện sinh khởi. Người có trí suy xét: chủ trương phủ định, dù giả sử đúng, vẫn bị chê trách trong đời này; nếu sai, người ấy thua ở cả hai phía — bỏ mất phương án thiện. Chủ trương khẳng định, dù giả sử sai, vẫn được khen ngay trong đời này; nếu đúng, người ấy thắng ở cả hai phía — bao quát lợi thế cả hai phía, bỏ đi phương án bất thiện.

  Hai cặp cuối suy xét riêng: khi chưa trực tiếp biết, chưa thấy mà nắm lấy một phía tuyên bố dứt khoát là không thích hợp; sắc làm điều kiện cho tranh cãi, kiện tụng, nói dối — những việc không có trong trạng thái vô sắc; nếu sự chấm dứt hoàn toàn của quá trình hiện hữu có thật, người ấy sẽ hoàn toàn tịch diệt ngay trong đời này, còn quan điểm phủ định gần với tham ái, trói buộc và chấp thủ.

  Cuối kinh, Đức Phật nêu bốn hạng người: tự làm khổ mình bằng khổ hạnh; làm khổ người khác bằng các nghề giết mổ, trộm cướp; vừa làm khổ vừa làm khổ người khác; và người không làm khổ mình cũng không làm khổ người khác — sống không còn đói khát tham ái, tịch tịnh, mát mẻ, với tự thân đã trở thành Phạm. Hạng thứ tư được mô tả qua con đường xuất gia theo Như Lai: giữ giới, dứt năm triền cái, chứng bốn thiền, thấy các đời quá khứ và hữu tình tái sinh theo nghiệp, rồi đoạn tận các lậu hoặc, biết tâm được giải thoát. Các bà-la-môn và gia chủ ở Sālā xin quy y.

notes: |-
  Khôi phục 11 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Hai khoá 7.2 và 10.2: đã bỏ phần lược, chỉ giữ câu không có hoặc có ý nghĩa trong bố thí cùng vế người trực chứng đời sau.
  Khoá 15.4: khoảng lược che phần giết hại mạng sống của chúng sanh; đã bỏ, đặt … đúng chỗ Pāli lược.
  Ba khoá 36.2, 37.2, 38.2: Pāli chỉ còn phần đầu tiện tướng, còn bản Việt đã viết ra cả danh sách rất dài; đã bỏ. Cách làm khớp với bản Anh Sujato đã ghim cho 36.2.
  Hai khoá 40-54.5 và 40-54.6: khoảng lược che vế upasampajja viharati và phần mô tả thiền sau đó; đã bỏ, còn mốc … thì đặt đúng chỗ Pāli lược. Khoá 40-54.6 khớp với tiền lệ mn64:10-12.2.
  Khoá 55.2 và 55.4: đã bỏ phần liệt kê lặp và phần thuộc tính theo khoảng lược, đặt … đúng chỗ Pāli lược. Riêng 55.4, đoạn liệt kê về người làm điều xấu và điều tốt không nằm trong khoảng lược mà nằm ở đoạn kế sau pajānāti, nên cũng không có trong Pāli của khoá này; đã bỏ luôn, theo đúng cách bản cùng công thức ở mn125:27-28.2 và mn39:20.2 đã làm.
  Khoá 55.6: Pāli đóng nháy ngay sau idaṁ dukkhan, nên đã bỏ ba vế còn lại và đặt … trước dấu nháy đóng.
  Không xác định được nên để nguyên: 40-54.1 và 40-54.2. Ở đây bilara cắt dấu …pe… làm đôi, một nửa nằm cuối 40-54.1 và nửa kia thành cả khoá 40-54.2, nên hai khoá không vào được danh sách lớp lỗi này. Đề nghị người gộp xử lý.
