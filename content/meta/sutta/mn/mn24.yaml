summary: |-
  Tại Trúc Lâm gần Rājagaha, một số tỳ-kheo an cư mùa mưa ở quê nhà tâu với Đức Phật rằng Tôn giả Puṇṇa, con bà Mantāṇī, vị tỳ-kheo được đồng phạm hạnh tán thán vì ít ham muốn, biết đủ, có giới, định, trí tuệ, giải thoát, tri kiến giải thoát, và giảng những điều ấy cho người khác, khuyên dạy, khích lệ đồng phạm hạnh. Nghe vậy, Tôn giả Sāriputta mong được gặp Tôn giả Puṇṇa để đàm luận. Về sau, khi Đức Phật về Sāvatthī, Puṇṇa cũng theo về rồi đi rừng Andha nghỉ ban ngày; Sāriputta âm thầm theo.

  Chiều hôm ấy, Sāriputta hỏi Puṇṇa: có phải chúng ta sống đời phạm hạnh dưới sự hướng dẫn của Đức Phật chỉ để thanh tịnh về giới không? Puṇṇa trả lời không phải. Câu hỏi lặp lại cho thanh tịnh về tâm, về kiến, do vượt qua nghi, về tri kiến phân biệt con đường và không con đường, về tri kiến của tiến trình thực hành, và về tri kiến — mỗi câu đều được đáp: không phải. Puṇṇa kết luận: mục đích của đời phạm hạnh là Bát-niết-bàn không còn chấp thủ.

  Sāriputta hỏi tiếp: mỗi pháp thanh tịnh ấy có phải chính là Bát-niết-bàn không còn chấp thủ không? Tất cả đều không. Nhưng Bát-niết-bàn ấy cũng không nằm ngoài hoàn toàn các pháp thanh tịnh ấy. Puṇṇa giải thích: nếu tuyên bố một pháp thanh tịnh nào chính là Bát-niết-bàn không còn chấp thủ, thì là tuyên bố một trạng thái vẫn còn chấp thủ làm niết-bàn không chấp thủ; còn nếu niết-bàn nằm ngoài hoàn toàn các pháp ấy thì người phàm cũng Bát-niết-bàn được. Ông nêu ví dụ trạm xe: vua Pasenadi có việc khẩn từ Sāvatthī đến Sāketa, đi qua bảy trạm xe bảy chiếc; hỏi vua đến nơi bằng chính chiếc xe nào thì câu trả lời đúng là: chiếc xe thứ nhất đưa đến trạm thứ hai, xe thứ hai đến trạm thứ ba, và xe thứ bảy đưa đến cổng nội cung ở Sāketa.

  Cũng vậy, thanh tịnh về giới chỉ nhằm đưa đến thanh tịnh về tâm; thanh tịnh về tâm đưa đến thanh tịnh về kiến; rồi đến vượt qua nghi, đến tri kiến phân biệt con đường, tri kiến của tiến trình thực hành, thanh tịnh về tri kiến, và cuối cùng đưa đến Bát-niết-bàn không còn chấp thủ. Hai bậc cao đức bấy giờ mới hỏi nhau tên; khi biết mình vừa đàm luận với Puṇṇa và với Sāriputta, mỗi người khen ngợi người kia là đệ tử đa văn hiểu đúng lời bậc Đạo sư, nói các đồng phạm hạnh thật có phước được gặp và kính lễ vị ấy, và cả hai cùng hoan hỷ với lời nói thiện lành của nhau.

