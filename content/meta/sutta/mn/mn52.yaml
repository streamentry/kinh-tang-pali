notes: |-
  Khôi phục 12 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Bốn khoá công thức bốn thiền (5.1, 6.1, 7.1 và các khoá 5.3, 6.3, 7.3): đã đối chiếu bản đủ ở 4.1-4.6 để biết khoảng lược che gì. Ở 5.1, 6.1, 7.1 khoảng lược che phần thuộc tính của từng thiền, nên đã bỏ và đặt … đúng chỗ Pāli lược.
  Ba khoá 5.3, 6.3, 7.3: khoảng lược nuốt luôn dấu nháy đóng của câu trích, nên đã đóng nháy ngay sau dấu lược, đúng như tiền lệ mn24:10.3 trong kho. Nếu để mở nháy thì ngoặc kép của cả bài sẽ lệch.
  Bốn khoá So tattha ṭhito …pe… (8.5, 11.5, 12.5, 13.5): đối chiếu 4.5 cho thấy khoảng lược che phần āsavānaṁ khayaṁ và phần hóa sinh, đã bỏ.
  Hai khoá tâm đi cùng bi và tâm đi cùng hỷ (9.1, 10.1): đối chiếu 8.1 và 11.1 cho thấy khoảng lược che toàn bộ phần biến mãn một phương rồi tới bốn phương, đã bỏ, chỉ giữ lại lời theo Pāli.
  Không xác định được nên để nguyên: không có. Quét lại toàn bài cho 0 khoá lệch.
