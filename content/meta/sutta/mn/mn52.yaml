notes: |-
  Khôi phục 12 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Bốn khoá công thức bốn thiền (5.1, 6.1, 7.1 và các khoá 5.3, 6.3, 7.3): đã đối chiếu bản đủ ở 4.1-4.6 để biết khoảng lược che gì. Ở 5.1, 6.1, 7.1 khoảng lược che phần thuộc tính của từng thiền, nên đã bỏ và đặt … đúng chỗ Pāli lược.
  Ba khoá 5.3, 6.3, 7.3: khoảng lược nuốt luôn dấu nháy đóng của câu trích, nên đã đóng nháy ngay sau dấu lược, đúng như tiền lệ mn24:10.3 trong kho. Nếu để mở nháy thì ngoặc kép của cả bài sẽ lệch.
  Bốn khoá So tattha ṭhito …pe… (8.5, 11.5, 12.5, 13.5): đối chiếu 4.5 cho thấy khoảng lược che phần āsavānaṁ khayaṁ và phần hóa sinh, đã bỏ.
  Hai khoá tâm đi cùng bi và tâm đi cùng hỷ (9.1, 10.1): đối chiếu 8.1 và 11.1 cho thấy khoảng lược che toàn bộ phần biến mãn một phương rồi tới bốn phương, đã bỏ, chỉ giữ lại lời theo Pāli.
  Không xác định được nên để nguyên: không có. Quét lại toàn bài cho 0 khoá lệch.

summary: |-
  Kinh Bát Thành được Tôn giả Ānanda thuyết tại làng nhỏ Beluva gần Vesālī cho gia chủ Dasama, người xứ Aṭṭhaka, khi ông từ Pāṭaliputta đến. Dasama hỏi có một pháp nào được Thế Tôn chỉ dạy mà khi tỳ-kheo sống không phóng dật, nhiệt tâm, quyết chí thực hành, tâm chưa giải thoát được giải thoát, lậu hoặc chưa tận được tận diệt, và an ổn vô thượng khỏi các ách phược chưa đạt được thì được đạt đến. Ānanda khẳng định có, và trình bày.

  Con đường ấy: tỳ-kheo hoàn toàn ly dục, ly các pháp bất thiện, chứng và trú sơ thiền, có tầm, có tứ, có hỷ lạc do ly sinh; rồi suy xét: ngay cả sơ thiền này cũng là pháp được tạo tác, chủ ý tạo thành; bất cứ gì như vậy đều vô thường, có bản chất đoạn diệt. An trú trên sự thấy biết ấy, vị đạt đến đoạn tận các lậu hoặc; nếu chưa, do lòng ái luyến với pháp ấy, khi năm hạ phần kiết sử đã tận, vị hóa sinh tại đó, nhập Niết-bàn tại đó, không còn trở lại thế giới này.

  Với nhị, tam, tứ thiền, Ānanda lặp lại công thức trên cho từng thiền. Sau bốn thiền là bốn tâm giải thoát: biến mãn toàn thế giới bằng tâm đi cùng từ, rộng lớn, quảng đại, vô lượng, không oán, không hại, rồi bi, hỷ, xả theo cách tương tự; mỗi tâm cũng được quán là pháp tạo tác, vô thường, dẫn đến đoạn tận lậu hoặc hoặc thành Bất Lai.

  Cuối là ba cõi vô sắc: vượt qua các tưởng về sắc, vị chứng và trú Không vô biên xứ, rồi Thức vô biên xứ, rồi Vô sở hữu xứ; mỗi chỗ cũng được suy xét là pháp tạo tác, vô thường, kết quả như trên. Như vậy gồm bốn thiền, bốn tâm giải thoát và ba cõi vô sắc, mười một pháp được Thế Tôn chỉ dạy.

  Dasama đáp bằng hai ví: người tìm một lối vào kho báu lại gặp mười một lối vào; người có ngôi nhà mười một cửa, khi nhà cháy có thể thoát qua bất kỳ cửa nào; cũng vậy, ông tìm một cánh cửa bất tử mà được mười một cánh cửa để tu tập. Ông nói người giáo phái khác còn trả thù lao cho thầy, huống chi ông không cúng dường Ānanda; rồi cúng dường Tăng chúng ở Pāṭaliputta và Vesālī, tự tay phục vụ thức ăn, tặng mỗi tỳ-kheo một cặp vải, tặng Ānanda ba y và xây trú xứ trị giá năm trăm. Mười một pháp ấy là mười một cánh cửa bất tử, qua bất kỳ cửa nào người thực hành cũng đưa mình đến an toàn.
