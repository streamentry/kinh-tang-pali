summary: |-
  Một thời Đức Phật ở gần Sāvatthī, tại rừng Jeta; cuối buổi chiều, Tôn giả Mahākoṭṭhita đến gặp Tôn giả Sāriputta và lần lượt đặt câu hỏi, phần trả lời đều do Sāriputta đảm nhận. Người không có trí là người không hiểu bốn chân lý khổ, nguồn gốc, chấm dứt và con đường; người có trí là người hiểu bốn điều ấy. Thức được gọi vì nhận biết lạc, khổ và không khổ không lạc; trí tuệ và thức hòa lẫn không thể tách riêng, nhưng khác nhau ở chỗ trí tuệ cần được tu tập còn thức cần được hiểu thấu đáo. Thọ được gọi vì cảm nhận ba loại cảm thọ ấy, tưởng vì nhận ra màu xanh, vàng, đỏ, trắng; thọ, tưởng và thức cũng hòa lẫn không tách rời, vì điều được cảm nhận cũng được nhận ra, điều được nhận ra cũng được thức nhận biết.

  Tiếp theo, ý thức trong sạch tách khỏi năm căn có thể biết ba xứ vô sắc; pháp có thể biết được hiểu bằng con mắt trí tuệ. Chánh kiến sinh từ hai duyên là nghe lời dạy từ người khác và chú tâm đúng cách; được năm yếu tố giới, học hỏi, thảo luận, an tịnh, minh sát hỗ trợ, chánh kiến đưa đến tâm giải thoát và tuệ giải thoát. Kinh nêu ba loại hữu và cho biết đời sống mới hình thành khi vô minh che phủ, ái trói buộc, thích thú chỗ này chỗ kia, và không còn khi vô minh phai mất, minh sinh khởi, ái chấm dứt; sơ thiền được định nghĩa với năm yếu tố, đã từ bỏ năm triền cái.

  Năm căn nương vào ý, và ý trải nghiệm đối tượng cùng phạm vi của chúng; chúng nương vào mạng sống, mạng sống nương vào hơi ấm và hơi ấm nương vào mạng sống. Mạng sống và hơi ấm không phải là các pháp được cảm nhận, nếu một thì vị nhập diệt thọ tưởng không thể xuất khỏi trạng thái ấy. Người đã chết và vị đang nhập diệt thọ tưởng đều có thân hành, khẩu hành, tâm hành dừng lắng, nhưng người chết thì mạng sống hết, hơi ấm tan, các căn hư hoại, còn vị nhập định thì các căn vẫn trong sáng.

  Về vô tướng tâm giải thoát, kinh nêu hai duyên để nhập, ba duyên để duy trì, hai duyên để xuất khỏi. Bốn tâm giải thoát, vô lượng, vô sở hữu, qua tính không và vô tướng, có thể khác nhau cả ý nghĩa lẫn tên gọi, cũng có thể cùng một ý nghĩa chỉ khác tên gọi: tâm giải thoát bất động, trống không với tham, sân, si, được gọi là cao nhất trong từng loại.
