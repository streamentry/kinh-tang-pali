summary: |-
  Tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika, Bà-la-môn Jānussoṇi đến gặp Đức Phật và nói những người vì lòng tin nơi Ngài mà xuất gia sống không nhà đều có Ngài dẫn đường, giúp đỡ, khích lệ. Khi ông nói những trú xứ xa vắng nơi rừng sâu khó kham nổi, rừng sâu dường như cuốn mất tâm trí của vị tỳ-kheo chưa đạt định, Đức Phật xác nhận và kể lại suy nghĩ của mình trước khi giác ngộ.

  Trước khi giác ngộ, Ngài nghĩ đến mười sáu lỗi khiến Sa-môn và Bà-la-môn lui tới rừng sâu chuốc lấy nỗi sợ hãi, khiếp đảm bất thiện: hành vi thân, lời nói, tâm ý, sinh kế chưa thanh tịnh; tham muốn trong các dục; sân hận và ý nghĩ ác; hôn trầm và buồn ngủ; trạo động; nghi ngờ, do dự; tự đề cao, hạ thấp người khác; run sợ, nhút nhát; mong cầu lợi lộc, danh tiếng; lười biếng; thất niệm; không có định; kém trí. Với mỗi lỗi, Ngài thấy mình không có nó mà có phẩm chất đối lại; mỗi lần thấy vậy, Ngài càng vững tâm khi sống trong rừng.

  Vào những đêm mười bốn, mười lăm, mùng tám của mỗi nửa tháng, Ngài ở tại những miếu thờ trong vườn, trong rừng hay dưới cây, những nơi đáng sợ; khi một con nai đi đến hay gió lay đám lá khô, Ngài quyết loại bỏ sợ hãi ngay khi nó đến, trong chính tư thế đang ở, không đổi tư thế cho đến khi nó được loại bỏ. Ngài nói kẻ đêm lại tưởng là ngày là sống trong mê lầm, còn mình nhận biết đêm là đêm, ngày là ngày. Với tinh tấn được khơi dậy, niệm được thiết lập, thân an tịnh, tâm có định, Ngài ly các dục, ly các pháp bất thiện, chứng và an trú bốn thiền, từ sơ thiền có tầm tứ đến tứ thiền không khổ không lạc.

  Khi tâm đã có định như vậy, thanh tịnh, trong sáng, Ngài hướng đến ba minh: nhớ lại nhiều đời sống quá khứ với các chi tiết, trong canh đầu; thấy với thiên nhãn các chúng sinh tái sinh theo nghiệp của mình, trong canh giữa; và đoạn tận các lậu hoặc sau khi biết đúng như thật bốn sự thật về khổ, về lậu hoặc, trong canh cuối. Tâm được giải thoát khỏi lậu hoặc về dục, về sự hiện hữu và vô minh; sinh đã tận, việc cần làm đã làm. Đức Phật nêu hai lý do Ngài lui tới rừng sâu: sự an trú an lạc cho chính mình ngay trong đời này và lòng thương tưởng thế hệ tương lai; Jānussoṇi quy y Tam bảo, xin làm nam cư sĩ đến trọn đời.
