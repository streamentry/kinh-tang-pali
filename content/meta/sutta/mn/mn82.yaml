summary: |-
  Kinh Raṭṭhapāla kể về gia chủ Raṭṭhapāla, con trai gia tộc đứng đầu thị trấn Thullakoṭṭhika thuộc xứ người Kuru. Khi Đức Phật cùng Tăng chúng đến thuyết pháp, anh hiểu rằng sống tại gia khó giữ trọn phạm hạnh thanh tịnh, nên cầu xin xuất gia; Đức Phật không cho, vì cha mẹ anh chưa cho phép.

  Cha mẹ khước từ: anh là con một, đâu biết khổ đau gì. Raṭṭhapāla nằm trên nền đất trống, nghĩ hoặc là sẽ chết hoặc là sẽ xuất gia, không ăn suốt bảy ngày; cha mẹ cùng các bạn khuyên can mỗi bên ba lần, chỉ gặp im lặng. Cuối cùng, vì các bạn nói cho phép thì còn thấy con, không cho thì con chết, cha mẹ cho phép với điều kiện xuất gia rồi phải trở về ra mắt.

  Tôn giả Raṭṭhapāla chỉ sau nửa tháng đã thành A-la-hán; khi xin trở về, Đức Phật quán chiếu biết anh không thể từ bỏ việc học hỏi để quay về đời sống thấp kém, nên cho đi. Về quê, Ngài trú trong vùng rừng Nai của vua Koravya; khất thực về nhà cha thì bị rủa sả, chỉ xin phần cháo thô của đêm trước, nhờ đó mẹ nhận ra anh. Trước đống vàng thoi vàng vụn cha mở ra, anh bảo hãy kéo đổ giữa dòng sông Hằng, vì ai ôm giữ sẽ từ đó sinh sầu, bi, khổ, ưu, não; khi các bà vợ cũ nắm chân hỏi, anh chỉ gọi các chị, rồi tụng kệ về thân điểm trang chỉ là bọc xương phủ da.

  Vua Koravya đến yết kiến, hỏi: người ta xuất gia vì bốn loại suy vong (già, bệnh, tài sản, thân tộc), mà anh chẳng có loại nào, vậy anh đã biết gì? Anh đáp bằng bốn sự thuyết giáo Chánh pháp của Thế Tôn: thế giới vô thường, đi đến hủy diệt; thế giới vô hộ, vô chủ; thế giới vô sở hữu, ra đi phải từ bỏ tất cả; thế giới thiếu thốn, khao khát, nô lệ cho tham ái. Với từng lời, anh hỏi vua: sức trẻ đã qua lúc tám mươi tuổi; bệnh tiềm ẩn đến phải một mình cảm thọ; khi chết người khác hưởng tài sản, mình ra đi theo nghiệp; nghe có quốc độ trù phú ở bốn phương vẫn muốn chinh phục. Vua thừa nhận từng điều và tán thán.

  Bài kinh nhấn mạnh Raṭṭhapāla xuất gia không phải vì suy vong nào, mà vì biết được bốn sự thuyết giáo ấy — người trẻ, khỏe, giàu, có thân tộc vẫn ra đi — và lời hứa trở về được giữ trọn khi anh đã thành A-la-hán.
