summary: |-
  Đức Phật ở gần Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika. Trong lúc độc cư thiền tịnh, Ngài nghĩ rằng các pháp tu tập hướng đến giải thoát của Rāhula đã chín muồi, nên hãy dẫn Rāhula đoạn tận các lậu hoặc xa hơn. Sau khi khất thực, Ngài gọi Rāhula mang tọa cụ cùng đi rừng Andha nghỉ trưa; nhiều ngàn chư thiên theo sau, nghĩ rằng hôm nay Đức Phật sẽ dẫn Rāhula đoạn tận các lậu hoặc xa hơn. Dưới gốc cây, Đức Phật bắt đầu hỏi.

  Đức Phật hỏi Rāhula: mắt có vô thường không, cái vô thường là khổ hay lạc, và cái vô thường khổ có tính biến đổi có nên xem là của ta, là ta, là ngã của ta không; Rāhula đáp lần lượt vô thường, khổ, không phải vậy. Câu hỏi được lặp lại cho các sắc, thức mắt, xúc mắt, và cái gì do duyên xúc mắt khởi lên thuộc về thọ, tưởng, các hành, thức; rồi tiếp tục cho các môn còn lại từ tai đến ý, với đối tượng, thức, xúc và các pháp do duyên xúc ý khởi lên thuộc về thọ, tưởng, các hành, thức.

  Đức Phật kết luận: thấy như vậy, Thánh đệ tử nhàm chán với mắt, các sắc, thức mắt, xúc mắt, và với cái do duyên xúc mắt khởi lên thuộc về thọ, tưởng, các hành, thức; lặp lại cho từng môn cho đến ý. Nhàm chán thì ly tham; ly tham thì giải thoát; khi đã giải thoát, trí đã giải thoát khởi lên: sinh đã tận, đời phạm hạnh đã thành, việc cần làm đã làm, không còn trở lại trạng thái hiện hữu này nữa. Trong khi bài phân giải đang được thuyết, tâm Rāhula không chấp thủ mà được giải thoát khỏi các lậu hoặc, và trong mấy ngàn chư thiên ấy, mắt pháp thanh sạch, không bụi bẩn được sinh khởi với lời: phàm cái gì có tính sanh, tất cả đều có tính diệt.

  Bài kinh đặt đúng vào thời điểm Rāhula đã chín muồi về tu tập: toàn bộ lời hỏi đáp dẫy trên sáu môn, dẫn từ sự vô thường của từng món đến sự nhàm chán, ly tham, giải thoát, và kết quả là đôi nơi cùng chứng: Rāhula giải thoát khỏi các lậu hoặc, chư thiên thấy pháp.
