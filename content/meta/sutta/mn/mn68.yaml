summary: |-
  Bài kinh được nói ở Naḷakapāna, xứ Kosala, trong rừng palāsa, nhân chuyện nhiều thiện nam tử nổi danh vì lòng tin xuất gia do nhân duyên Đức Phật: Anuruddha, Bhaddiya, Kimbila, Bhagu, Koṇḍañña, Revata, Ānanda và nhiều vị khác. Đức Phật hỏi đại chúng ba lần những tỳ-kheo ấy có hoan hỷ với đời phạm hạnh chăng mà không được đáp; Ngài bèn hỏi thẳng Anuruddha và các thầy, nhận được câu trả lời đúng vậy.

  Đức Phật xác nhận đó là điều xứng đáng: các vị xuất gia không phải vì vua hay trộm cướp trục xuất, vì kiếp nợ, sợ hãi hay mưu sinh, mà vì thấy bị sinh già chết và sầu bi khổ ưu não vây phủ. Ngài nêu phép thử: khi chưa đạt hỷ lạc do viễn ly khỏi dục, viễn ly khỏi các pháp bất thiện, hay điều gì an tịnh hơn, thì bảy thứ còn chiếm giữ tâm là tham ái, sân, hôn trầm, trạo hối, nghi, bất mãn và đản đốn; khi đã đạt được, bảy thứ ấy không còn chiếm giữ tâm.

  Đức Phật hỏi tiếp các tỳ-kheo có nghĩ rằng các lậu hoặc của Như Lai chưa được đoạn tận nên Ngài phải suy xét rồi mới hành sử, chịu đựng, né tránh, xua đuổi điều này điều kia chăng. Họ đáp không: các lậu hoặc ấy đã được Như Lai đoạn tận, cắt tận gốc như gốc chặt cây talà. Về việc tuyên bố sự tái sinh của các đệ tử đã qua đời, Anuruddha xin Ngài tự làm rõ.

  Đức Phật giải thích Ngài không tuyên bố vì mị dân, phỉ dân, lợi dưỡng hay danh tiếng, mà vì có những thiện nam tử có lòng tin, có hỷ lạc và hoan lạc tuyệt vời; khi nghe điều ấy, họ hướng tâm về mục đích ấy, được lợi ích lâu dài. Kinh lặp lại công thức cho từng hạng tỳ-kheo, tỳ-kheo-ni, nam cư sĩ, nữ cư sĩ: nghe tin một người cùng hạng đã qua đời và Đức Phật đã tuyên bố thành tựu của người ấy — chứng được quyết định, hóa sinh nhờ đoạn tận năm hạ phần kiết sử, bậc nhất lai nhờ đoạn ba kiết sử và làm suy giảm tham sân si, hay bậc nhập lưu nhờ đoạn ba kiết sử; người sống lại hồi tưởng tín, giới, đa văn, xả và tuệ của người ấy, hướng tâm về mục đích ấy; sống như vậy là sống an lạc.

  Bài kinh khép lại: những tuyên bố ấy không nhằm để dân chúng biết đến Ta, mà để người có lòng tin hướng tâm về mục đích ấy; hoan hỷ với đời phạm hạnh được đo bằng việc đạt được hỷ lạc viễn ly, khi bảy thứ ấy không còn chiếm giữ tâm.
