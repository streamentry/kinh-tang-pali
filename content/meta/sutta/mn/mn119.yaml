summary: |-
  Kinh Niệm Thân bắt đầu tại Sāvatthī, trong rừng Jeta, tu viện của ông Anāthapiṇḍika. Sau bữa khất thực, các tỳ-kheo ngồi trong nhà họp bàn về điều hy hữu: Đức Thế Tôn đã nói niệm thân khi tu tập sung mãn thành quả lớn, lợi ích lớn. Đức Phật buổi chiều đến nhà họp, rồi giảng niệm thân được tu tập sung mãn như thế nào.

  Phần tu tập gồm mười tám cách. Trước hết là niệm hơi thở: biết hơi thở dài ngắn, tập cảm nhận toàn thân và làm lắng dịu hoạt động của thân. Rồi biết rõ bốn tư thế, tỉnh giác trong mọi hoạt động hằng ngày. Tiếp là quán thân đầy dẫy nhiều loại bất tịnh, từ tóc đến nước tiểu; quán thân theo các yếu tố đất, nước, lửa, gió; và chín cách quán tử thi ở nghĩa địa, từ tử thi đang phân hủy đến xương rụn thành bột, mỗi lần đều so sánh với thân mình: thân này cũng có cùng bản chất như vậy, không thể vượt khỏi điều ấy. Cuối cùng là bốn thiền, với hỷ lạc và tâm thanh tịnh thấm nhuần toàn thân. Mỗi cách đều kết bằng cùng kết quả: các hồi ức và suy tư thuộc về gia đình được từ bỏ, tâm nhất tâm và vào định.

  Ai đã tu tập sung mãn niệm thân, tất cả các thiện pháp có phần trong minh đều được bao gồm trong đó, ví như các con sông đổ về đại dương. Ai chưa tu tập, Māra có kẽ hở để tấn công; ai đã tu tập, Māra không có kẽ hở. Vị ấy hướng tâm đến pháp nào cần chứng ngộ bằng thắng trí thì ngay tại đó đạt được khả năng chứng ngộ. Niệm thân khi tu tập sung mãn có thể mong mỏi mười lợi ích: thắng được sự không ưa thích; thắng được sự sợ hãi kinh rợn; kham nhẫn lạnh nóng, đói khát, ruồi muỗi, gió nắng, rắn rết, lời nói thô ác và các cảm thọ thân gay gắt; tùy ý chứng bốn thiền làm chỗ an trú an lạc hiện tại; chứng nhiều loại thần thông; thiên nhĩ thanh tịnh nghe tiếng chư thiên và loài người; bao quát tâm của chúng sinh khác, biết rõ tâm có tham, sân, si hay không, tâm giải thoát hay không giải thoát; nhớ lại nhiều đời sống quá khứ; thiên nhãn thấy chúng sinh chết đi tái sinh tùy theo nghiệp; và vì đoạn tận các lậu hoặc, an trú ngay hiện tại giải thoát tâm vô lậu, giải thoát trí tuệ.

  Bài kinh cho thấy niệm thân là nền tảng chứa được mọi thiện pháp, chặn Māra, và đưa đến mười lợi ích chấm dứt tại giải thoát vô lậu.
