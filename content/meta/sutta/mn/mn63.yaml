summary: |-
  Tiểu Kinh Māluṅkya kể khi Đức Phật ở Sāvatthī, trong rừng Jeta, tại tu viện Anāthapiṇḍika. Khi độc cư thiền tĩnh, Tôn giả Māluṅkyaputta nghĩ về những quan điểm Đức Phật đã đặt sang một bên, bác bỏ: thế giới là thường còn hay không thường còn, hữu biên hay vô biên; mạng sống và thân thể là một hay khác nhau; sau khi chết, Như Lai còn tồn tại, không còn tồn tại, vừa còn vừa không còn, không còn cũng không phải không còn tồn tại. Vì không vừa ý, vị ấy đến đòi: nếu Ngài biết và giảng giải thì con sẽ sống phạm hạnh, nếu không thì con sẽ từ bỏ đạo học; nếu không biết, hãy thành thật nói không biết, không thấy.

  Đức Phật hỏi lại: Ngài có từng hứa giảng giải những điều ấy để vị ấy sống phạm hạnh, hay vị ấy có từng xin như vậy không; cả hai đều chưa từng. Ngài nói: vậy thì, này người ngu ngốc, ông là ai mà hủy bỏ với ai? Nếu ai kiên quyết không sống phạm hạnh cho đến khi được giảng giải, thì người ấy sẽ chết trong khi đó. Bài kinh nêu ví người trúng tên độc: trước khi cho rút mũi tên, người ấy đòi biết thứ hạng, tên họ, dáng người, màu da, quê quán của người bắn, cùng cây cung, dây cung, cán tên, cánh tên, thân tên, đầu nhọn; chưa biết hết thì đã chết.

  Với từng quan điểm trong năm cặp, nếu có quan điểm ấy thì đời phạm hạnh sẽ được sống; sự việc không như vậy. Dù nắm quan điểm bên nào, vẫn có tái sinh, già, chết, sầu, bi, khổ, ưu, não; và chính sự diệt trừ những điều ấy ngay trong hiện tại mà Ta công bố. Công thức lặp lại cho cả năm cặp.

  Cuối kinh, Đức Phật phân định: hãy ghi nhớ điều chưa được giảng giải là chưa được giảng giải, điều đã được giảng giải là đã được giảng giải. Chưa giảng giải là mười quan điểm nêu trên, vì không có lợi ích, không thuộc căn bản của đời phạm hạnh, không đưa đến nhàm chán, không tham, chấm dứt, an tịnh, thắng trí, giác ngộ và Niết-bàn. Đã giảng giải là đây là khổ, đây là khổ tập, đây là khổ diệt, đây là con đường đưa đến khổ diệt, vì có lợi ích, thuộc căn bản của đời phạm hạnh, đưa đến nhàm chán, không tham, chấm dứt, an tịnh, thắng trí, giác ngộ và Niết-bàn. Tương phản ấy là điểm nhấn: những câu hỏi ấy không đưa đến đời phạm hạnh, còn bốn chân lý về khổ thì dẫn thẳng đến đó.
