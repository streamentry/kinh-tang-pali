summary: |-
  Kinh Hy Hữu Vị Tằng Hữu Pháp diễn ra tại rừng Jeta, gần Sāvatthī. Sau bữa ăn, nhiều tỳ-kheo ngồi họp khen Như Lai biết được chư Phật quá khứ đã nhập diệt, với đủ sự sinh, danh xưng, dòng họ, giới đức, giáo pháp, trí tuệ, an trú, giải thoát. Ānanda nói các Như Lai là bậc hy hữu, đầy đủ các pháp hy hữu, là bậc vị tằng hữu, đầy đủ các pháp vị tằng hữu. Khi Đức Phật đến hỏi, Ngài bảo Ānanda hãy nói lên nhiều hơn nữa những pháp ấy.

  Ānanda kể lại từng điều mình đã nghe và thọ trì ngay trước mặt Đức Phật, mỗi điều được kết luận là pháp hy hữu, pháp vị tằng hữu: Bồ-tát với chánh niệm tỉnh giác sinh vào chúng trời Đâu suất, an trú đó đến hết thọ mạng, rồi mạng chung từ đó và nhập vào thai mẹ; khi nhập thai, một hào quang vô lượng, vi diệu hiện ra vượt xa oai lực chư thiên, soi cả những vực thẳm mà ánh sáng mặt trăng mặt trời không chiếu tới, và mười ngàn thế giới rung động mạnh.

  Bốn vị thiên tử canh giữ bốn phương khi Bồ-tát nhập thai; bà mẹ tự nhiên giữ giới, tâm không khởi tưởng liên hệ đến dục, không thể bị xâm phạm, không có bệnh tật, hưởng đủ năm đối tượng dục, và thấy rõ Bồ-tát trong bụng mình đầy đủ mọi chi phần. Sau khi Bồ-tát sinh được bảy ngày, mẹ Ngài mạng chung và sinh vào chúng trời Đâu suất; bà mang thai đúng mười tháng và đứng mà sinh.

  Khi ra khỏi thai mẹ, Bồ-tát được chư thiên đón nhận trước, loài người sau, được đặt trước mặt mẹ, ra sạch sẽ không bị vật ô uế nào bám vào như ngọc ma-ni trên tấm vải Ba-la-nại, và được hai dòng nước mát ấm tắm rửa. Ngài đứng vững bằng chính đôi chân, bước bảy bước, nhìn khắp mọi phương và lên tiếng như tiếng ngưu vương: Ta là bậc tối thượng của thế giới; đây là lần sinh cuối cùng, nay không còn tái sinh nữa. Công thức hào quang và rung động mười ngàn thế giới ấy lặp lại khi Bồ-tát sinh.

  Sau cùng, Đức Phật bảo Ānanda hãy thọ trì cả việc này là một pháp hy hữu, một pháp vị tằng hữu của Như Lai: các thọ được biết rõ khi khởi lên, khi hiện tiền, khi đi đến biến hoại; các tưởng và các tầm cũng vậy. Ānanda thọ trì điều ấy, và bậc Đạo sư chấp nhận. Ý trung tâm: điều kỳ lạ tối hậu được chính Đức Phật nêu thêm là các thọ, tưởng, tầm được biết rõ từ khi khởi lên đến khi biến hoại.
