summary: |-
  Bài kinh diễn ra khi Đức Phật trú ở Vesālī, tại Đại Lâm, trong hội trường mái nhọn. Buổi sáng, thấy giờ khất thực ở Vesālī còn quá sớm, Đức Phật đến du viện Một Hoa Sen, nơi du sĩ Vacchagotta đang trú; được mời ngồi vào chỗ đã trải sẵn, Ngài nhận lời, và Vacchagotta lấy một chỗ thấp ngồi xuống một bên rồi hỏi về một lời truyền miệng: Sa-môn Gotama là bậc toàn tri, toàn kiến, tuyên bố tri kiến không còn dư sót, dù đi, đứng, ngủ hay thức, tri kiến luôn luôn hiện tiền.

  Đức Phật trả lời thẳng: những người nói như vậy không phải nói đúng lời Ngài, mà đang vu khống Ngài bằng điều không thật. Cách trả lời đúng là Sa-môn Gotama là bậc có Ba Thông Giải. Vì Ngài tùy ý muốn có thể nhớ lại nhiều loại đời sống quá khứ với các đặc điểm và chi tiết; dùng thiên nhãn thanh tịnh, vượt hơn mắt người, thấy các chúng sinh chết đi và tái sinh, thấp kém, cao quý, đẹp đẽ, xấu xí, sinh vào cõi lành hay cõi dữ, biết chúng đi theo nghiệp của mình; và tự mình chứng biết trực tiếp, chứng ngộ và an trú tâm giải thoát không lậu hoặc cùng huệ giải thoát ngay trong hiện tại, nhờ đoạn tận các lậu hoặc.

  Vacchagotta hỏi tiếp từng câu. Không có vị cư sĩ nào chưa từ bỏ sự trói buộc của người tại gia mà khi thân hoại mạng chung được chấm dứt khổ; nhưng không phải chỉ một trăm mà hai, ba, bốn, năm trăm và còn nhiều hơn nữa những vị cư sĩ như vậy được sinh lên cõi trời. Về đạo sĩ Ājīvaka, không có vị nào khi thân hoại mạng chung được chấm dứt khổ; và từ chín mươi mốt kiếp trước mà Ta nhớ lại, Ta không nhớ có đạo sĩ Ājīvaka nào được sinh lên cõi trời, trừ một vị dạy về nghiệp và dạy về hành động.

  Khi Vacchagotta thưa rằng như vậy là đạo trại ấy trống rỗng, chẳng có gì, kể cả người được sinh lên cõi trời, Đức Phật xác nhận đúng vậy. Bài kinh khép lại ở sự đối sánh ấy: cách nói đúng về Đức Phật không phải là bậc toàn tri toàn kiến mà là bậc có Ba Thông Giải, và bên cạnh nhiều cư sĩ lên cõi trời là một đạo trại Ājīvaka được gọi là trống rỗng.
