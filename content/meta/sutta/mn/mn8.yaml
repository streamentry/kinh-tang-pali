summary: |-
  Vào cuối buổi chiều, Tôn giả Mahācunda đến hỏi Đức Phật: nhiều loại quan điểm phát sinh ở đời, liên hệ đến các thuyết về tự ngã hoặc thế giới; một vị tỳ-kheo chú tâm vào điểm khởi đầu của chúng thì làm sao từ bỏ và buông chúng? Đức Phật trả lời: thấy đúng như thật, với chánh trí, ngay tại nơi chúng phát sinh, bám vào và vận hành rằng: cái này không phải của tôi, tôi không phải cái này, cái này không phải tự ngã của tôi.

  Ngài nói tiếp: một vị tỳ-kheo có thể chứng và an trú bốn thiền, từ sơ đến tứ thiền, và nghĩ mình đang thực hành đoạn giảm; nhưng trong pháp huấn luyện của bậc Thánh, điều ấy không được gọi là đoạn giảm mà gọi là hiện tại lạc trú. Bốn chứng ngộ vô sắc, từ Không vô biên xứ đến Phi tưởng phi phi tưởng xứ, cũng được gọi là tịch tịnh trú, không phải đoạn giảm.

  Phần chính nêu bốn mươi bốn mục theo cùng một công thức: người khác có thể tàn nhẫn, sát sinh, trộm cắp, sống không phạm hạnh, nói dối, tham muốn, có ác ý, có tà kiến, tà định, tà giải thoát, hay hoài nghi, giận dữ, hằn học, ganh tị, keo kiệt, giả dối, ngạo mạn, khó được góp ý, kết bạn xấu, ít học, lười biếng, thất niệm, thiếu trí, và chấp chặt quan điểm của mình, không chịu buông; còn ở đây chúng ta sẽ có phẩm chất đối lại. Bốn mươi bốn mục ấy được sắp thành năm phần: thực hành đoạn giảm; khởi lên ý nghĩ, vì chỉ riêng việc khởi ý hướng đến phẩm chất thiện đã đem lại nhiều lợi ích, huống chi thực hành bằng thân và lời nói; đi vòng qua, ví như con đường gồ ghề được tránh bằng con đường bằng phẳng, người có lỗi tránh khỏi lỗi ấy bằng phẩm chất đối lại; đi lên, vì phẩm chất bất thiện dẫn xuống, phẩm chất thiện dẫn lên; và giải thích về sự tịch diệt: người chìm trong bùn không thể kéo người khác lên, người chưa điều phục không thể giúp người khác điều phục; người có từng lỗi dập tắt lỗi ấy bằng phẩm chất đối lại.

  Kết thúc, Đức Phật nói đã giảng các phương pháp theo đoạn giảm, khởi ý, đi vòng qua, đi lên và tịch diệt, vì lòng thương đã làm điều người thầy muốn lợi ích cho đệ tử cần phải làm, và dặn Cunda: đây là những gốc cây, đây là những căn nhà trống; hãy tu thiền, đừng buông lung, đừng để sau này phải hối tiếc. Bài kinh kết bằng lời thơ gọi tên Đoạn Giảm, sâu thẳm như đại dương.
