notes: |-
  **Phạm vi: 104 khoá, đủ mọi khoá Pāli của bài gộp `an7.96-614`, không khoá nào ngoài tập Pāli; thứ tự khoá đúng thứ tự Pāli.** Bài là một chuỗi peyyāla: sau công thức mở đầu (`1.1`–`1.2`), mỗi khoá chỉ nêu một đề mục thay đổi (sáu căn, sáu cảnh, sáu thức, sáu xúc, sáu thọ, tưởng, tư, ái, tầm, tứ của sáu cảnh, rồi năm uẩn) và phần còn lại bị lược bằng `…pe…`. Khoá `13.1`–`16.7` là kệ tóm tắt (uddāna) của cả loạt.
  **Coverage English (đo thật).** Công thức của kho: Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`. Mẫu số = **4** khoá (`1.1`, `1.3`, `1.9`, `12.6`); Sujato có chữ ở **4/4 = 100%**. Tầng `english-project` không có tệp nào cho bài này (không lấp thêm khoá nào, nên không có chuyện tự đối chiếu với chính mình). Tra manifest của commit đã ghim: có tệp Pāli và tệp Sujato cho đúng uid này; tầng `vietnamese-current` không có tệp (bilara chỉ phân phối Pháp Cú tiếng Việt). **Giới hạn của con số đó, nói thẳng:** mẫu số chỉ 4. Sujato **để trống 21 khoá** — `12.14` và toàn bộ kệ `13.1`–`16.7` (20 khoá) — tất cả đều ngắn hơn 40 ký tự nên không vào mẫu số; riêng kệ là phần Pāli phải tự đứng vững, không có bản Anh nào đối chiếu (xem mục bất định). Sujato còn chèn `…` ở đầu những khoá mà Pāli không có `…` ở đó (ví dụ `2.1`, `3.1`) — tôi bám Pāli, không chép theo.
  **Bản Hòa thượng Thích Minh Châu: đọc nguyên bài ở mục Tra cứu toàn văn (SuttaCentral, chân trang ghi Hòa thượng Thích Minh Châu dịch, Viện Phật Học Vạn Hạnh ấn hành), không phải tầng store.** Bản đó chỉ phủ phần văn xuôi (`1.1`–`12.14`) và gộp thành một đoạn liền; **không có bản nào cho kệ `13.1`–`16.7`**. Dùng để đối chiếu thuật ngữ, không sao chép; điểm khác biệt có chủ ý: Hòa thượng dịch `vayānupassī` là *hoại diệt*, bản này theo tầng là *biến diệt* (xem thuật ngữ).
  **Số Pāli (tự tính).** `Sattime` → *bảy* (satta 7, `Katame satta?` → *bảy*). Kệ: `aṭṭha` = **8** (ở `13.4`, `14.3`: tám bài kinh cho mỗi đề mục; `16.1`: *tám sự quán* — tám là: vô thường, khổ, vô ngã, diệt tận, biến diệt, ly tham, đoạn diệt, từ bỏ, đếm được đủ 8 ở `15.2`–`15.4`); `soḷasa` = **16** (aṭṭha 8 + 8, từ vựng chắc chắn; **đối tượng được đếm không phân xử được**, xem bất định); `pañca satāni` = 5 × 100 = **500**; `aṭṭhavīsati` = aṭṭha 8 + vīsati 20 = **28**; cả hai ở `16.4`–`16.5` cho **528**. Đối chiếu độc lập: sáu căn, sáu cảnh, sáu thức, sáu xúc, sáu thọ, sáu tưởng, sáu tư, sáu ái, sáu tầm, sáu tứ (10 nhóm × 6 = 60) cộng nhóm uẩn (năm uẩn riêng lẻ + `pañcakkhandhe` gộp = 6) = 66 nhóm; 66 × 8 pháp tùy quán = **528**, khớp con số kệ. Nhưng dải đánh số `96–614` của catalogue chỉ chứa 519 số; hai con số lệch 9 và tôi **không** phân xử được (xem bất định) — con số bản dịch giữ đúng Pāli (500 + 28), không sửa theo catalogue.
  **Bất định, ghi tại đây chứ không thêm vào thân kinh.** (1) `13.3` `dvārassa` ở cách sở hữu số ít, đứng sau `vedanāsu ca`; không rõ nó chỉ nhóm kinh về **sáu căn** (nhóm kinh mở đầu, `1.3`–`2.5`) hay một mục riêng; bản dịch giữ nguyên *và của cửa* theo từ ngữ. (2) `14.3` `Gocarassa` (sở hữu số ít) dịch *của phạm vi* — một nghĩa khác của `gocara` (*phạm vi, địa hạt*) trùng nhóm `ārammaṇa` đã nêu ở `13.1`; không phân xử được là nhóm sáu cảnh hay mục riêng. (3) `15.1` `soḷasasu … mūlesu` *mười sáu gốc*: không thấy mười sáu mục nào trong thân kinh ứng với 16 (8 pháp tùy quán chỉ đủ 8); bản dịch giữ từ ngữ, không đoán đối tượng. (4) `16.6` `āhuneyye ca vaggike` — dịch sát *trong Đáng Cúng Dường và trong phần thuộc phẩm*; cấu trúc `ca … vaggike` không phân xử được (có thể là: kinh mang tên Āhuneyya và các kinh còn lại của cả phẩm). (5) Tổng 528 của kệ không khớp 519 số của dải `96–614` (lệch 9): không phải lỗi dịch, là đặc điểm của nguồn; có thể liên quan cách đánh số của bộ gộp, nhưng không có căn cứ trong tầng đã ghim để chọn. Không bất định nào làm đổi nghĩa giáo lý của phần văn xuôi, nên không phải blocker; đã hạ `ambiguity_integrity` xuống 9.0.
  **Phép kiểm dấu lược.** Mỗi khoá có số `…` đúng bằng Pāli (`…pe…` → đúng một `…`; khoá không có `…` thì không có): 0 lệch trên 104 khoá. Pāli kết `….` (lược rồi mới tới chấm) → Việt kết ` ….`: có ở `1.9`, `2.5`, `3.6`, `4.6`, `5.6`, `6.6`, `7.6`, `8.6`, `9.6`, `10.6`, `11.6` (11 khoá, theo cách đa số tầng viết ` ….`). `12.14` `lokassā”ti.` giữ không có `…`, chỉ có dấu nháy đóng.
  **Nháy kép.** Pāli mở `“` ở `1.1` và đóng `”` ở `12.14`; mở `“` ở `13.1` và đóng `”` ở `16.6`. Đã so từng khoá với Pāli: 0 lệch trên 104 khoá, mẫu số 104.
  **Dùng lại tiền lệ — đã dò, đã đếm.** Dò Pāli trùng nguyên văn ở các bài khác: 5 khoá của bài này có Pāli trùng, tổng **125 cặp**, trong đó **38 cặp** bản Việt khác: `1.2` (`Katame satta?`) 59 cặp / 30 khác — bản Việt ở tầng viết rất nhiều cách theo đối tượng được đếm (*Bảy pháp nào?*, *Là bảy nào?*, *Bảy giác chi nào?*) nên tôi theo bài láng giềng cùng công thức `an7.95:1.2` là *Thế nào là bảy?*; `0.1` 6 cặp / 6 khác — tên bộ giữ nguyên Pāli *Aṅguttara Nikāya 7* (62 khoá `an` giữ Pāli so với 37 khoá dịch *Kinh Tăng Chi Bộ*; tương tự trong `an7`: 62/38), khác ở các cặp chỉ vì những bài kia ghi thêm số bài sau chữ 7; `14.1` (`Saññā sañcetanā taṇhā,`) 2 cặp / 2 khác — hai bài `sn18.10` (*Tưởng, tập hợp, khát ái,*) và `sn18.22` (*Tưởng, cố ý, ái,*) dịch khác nhau và không bài nào chuẩn; tôi chọn *Tưởng, tư, ái* (xem thuật ngữ). `0.2` (`10. Phẩm Đáng Cúng Dường`) và `0.3` (`~`) dùng lại nguyên văn `an7.95`. `1.1` dùng lại công thức `an7.95:1.1` (*bảy hạng người đáng được hiến dâng, đáng được tiếp đón … là phước điền vô thượng của thế gian*), chỉ bỏ vế *đáng được cúng dường, đáng được chắp tay lễ kính* vì Pāli của bài này đã lược cụm ấy bằng `…pe…`. `1.3` dùng lại khuôn `an7.95:1.3` (*Ở đây, này các tỳ-kheo, có một hạng người sống quán … nơi con mắt*).
  **Số cặp Pāli trùng nguyên văn trong chính bài mà Việt khác: 0 trên 0 cặp** — phép này chạy **rỗng**: không có hai khoá nào trong bài trùng nguyên văn Pāli (kể cả sau khi bỏ khoảng trắng đầu cuối), nên không có gì để đối chiếu nội bộ.
  **Thuật ngữ, kèm số đếm trên toàn tầng `vi/project` (đo, không đoán).** `aniccānupassī … paṭinissaggānupassī viharati` → *sống quán …* (khuôn `an7.95`, `an7.61`, `sn36.7`). `dukkha` → *khổ*; `anatta` → *vô ngã*; `khaya` → *diệt tận* (*quán diệt tận* 4 khoá; Hòa thượng cũng dịch *diệt tận*); `vaya` → *biến diệt* (*quán biến diệt* **6** khoá, *quán hoại diệt* **0** khoá — Hòa thượng dịch *hoại diệt*, nhưng tầng chưa dùng, chọn theo tầng để cả bài đồng nhất với `sn36.7`); `virāga` → *ly tham*; `nirodha` → *đoạn diệt* (*quán đoạn diệt* **14** khoá, *quán diệt tận* 4 khoá; khoá `khaya` đã giữ *diệt tận*, nên `nirodha` phải khác — đây là lý do hai thuật ngữ không gộp); `paṭinissagga` → *từ bỏ* (khuôn `an7.95`, `an7.61`, `sn36.7`). `cakkhusmiṁ` → *nơi con mắt* (`an7.95`); các căn còn lại *nơi tai/mũi/lưỡi/thân/ý* cho đồng nhất; mọi vị cách (locative) ở `2.x`–`12.x` đều dùng *nơi*, để một bài không lẫn *trên/trong/nơi*. `rūpa/sadda/gandha/rasa/phoṭṭhabba/dhamma` → *sắc / tiếng / mùi / vị / xúc chạm / pháp* (*xúc chạm* ghi nhận **111** khoá so với *các xúc* 34 khoá trên toàn tầng; chọn *xúc chạm* để `phoṭṭhabba` không đụng *xúc* là `phassa`). `viññāṇa` → *thức* (*thức ý* **128** khoá, *ý thức* 26, *thức tâm* 8). `samphassa` → *xúc* (*xúc ý* 86, *ý xúc* 6; *xúc thân* 28, *thân xúc* 6). `samphassajā vedanā` → *cảm thọ do xúc … sinh*. `saññā` → *tưởng về* (*tưởng về sắc* 73, *sắc tưởng* 38). `sañcetanā` → *tư* (khoá `cetanā` đã dịch *tư* 17 khoá; tầng cũng có *cư ý* 5, *chủ ý* 4, *tác ý* 9 cho các từ gần nghĩa; `an11.310-357` dịch *tập hợp về sắc* không bám `sañcetanā` là ý muốn/tư, nên tôi **không** theo). `taṇhā` → *ái*. `vitakka` → *tầm*, `vicāra` → *tứ* (bộ đôi này ở công thức sơ thiền: *tầm … tứ* 120 / 174 khoá, riêng *tứ* 53; bài `an11.454-501` dịch `vicāra` thành *suy xét*, tôi theo công thức chính vì ở đây `vitakka` và `vicāra` đứng cặp). `khandha` → *uẩn* (*sắc uẩn, thọ uẩn, tưởng uẩn, hành uẩn, thức uẩn*). `puggala` → *hạng người*, `āhuneyya … puññakkhetta` → theo `an7.95`.
  **Lỗi bản nháp đã bắt.** (a) Bản nháp đầu viết `0.1` là *Kinh Tăng Chi Bộ 7*; đo lại cho thấy tầng giữ nguyên Pāli ở đa số (62 so 37), nên đổi về *Aṅguttara Nikāya 7*. (b) `12.1` và `12.6`: đọc kỹ Sujato mới thấy `12.1` là *năm uẩn* (cả khối) rồi mới đến từng uẩn, và `viññāṇakkhandhe aniccānupassī viharati` ở `12.6` mở đầu chuỗi tám pháp áp cho cả nhóm — nên `12.7`–`12.13` chỉ còn là *sống quán khổ …* (không lặp *nơi thức uẩn*), đúng Pāli.
  **Đã làm được / chưa.** Tự kiểm bằng script riêng trên **mọi** khoá (không chỉ khoá ≥ 40 ký tự): đủ khoá, đúng thứ tự, NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang Việt, dấu lược và nháy khớp Pāli từng khoá. Đợt này bị cấm chạy cổng của kho, nên `technical_integrity` đặt **9.6**, **không** tuyên bố đã pass; bốn lệnh còn lại là `npm run validate`, `npm test`, `npm run check`, `npm run build`.
