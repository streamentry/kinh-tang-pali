notes: |-
  Dịch từ Pāli root tại commit đã ghim, đủ 99/99 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli. Pāli không có `…` nên bản Việt không có `…`.

  COVERAGE ANH ĐO THẬT: mẫu số = khoá Pāli có nội dung (>= 40 ký tự, bỏ khối 0.x) = 46. `english-sujato` phủ 43/46 = 0.935 (ngưỡng 0.8 trong `source/layers.yaml`). Ba khoá Sujato để trống là 13.2, 13.4, 13.6: Sujato gộp lời kể lại của Đức Phật thành một câu tóm tắt ở 13.1 rồi để trống 13.2 đến 13.6. Ba khoá đó đã có lớp lấp `english-project` (đã published, cùng lượt chấm riêng), nên cổng tính 46/46 = 1.000; nhưng phần lấp là bản của dự án chứ không phải bản Anh độc lập, nên không tính vào đối chiếu độc lập: ở 13.2, 13.4, 13.6 tôi đọc Pāli là chính, dựa vào 12.1, 12.3, 12.5 (cùng công thức, Sujato có dịch) làm chứng. Tầng `vietnamese-current` không có ở mức segment (bilara tại commit đã ghim chỉ có Pháp Cú); bản Việt nguyên bài của Hòa thượng Thích Minh Châu (SuttaCentral, không phân đoạn) chỉ được đọc như tra cứu toàn văn, không tính vào coverage. Vì Sujato phủ trên ngưỡng nên `reference-gaps.yaml` không cần entry.

  TIỀN LỆ ĐO TRƯỚC KHI CHỌN. Bài có hai bài song song đã published trong tầng: `sn6.10` và `snp3.10` (cùng sự kiện Kokālika, cùng thí dụ hạt mè và mười địa ngục), thêm `sn6.9` (Turū, cùng kệ). Pāli trùng nguyên văn với bài khác ngoài bài này: 68/99 khoá, 704 cặp đã dò, 289 cặp bản Việt khác (phần lớn là 192 cặp `Idamavoca bhagavā`, 268 cặp `Navamaṁ`, và hai bài song song dịch khác nhau). Dùng lại nguyên văn: 18 khoá (`1.5`, `2.5`, `3.5`, `5.3` từ `sn6.9:1.5`; `7.3` và `16.3`; `8.1`, `8.2`, `17.1`, `17.2`; `10.4` và `19.4`; `12.4`; `12.5` từ `sn2.20:6.2`; `15.1`; `15.15` (108 so với 31 `Đức Thế Tôn nói như vậy`); `15.16` (16 `Nói như vậy xong, bậc Thiện Thệ, bậc Đạo Sư lại nói thêm:`); `19.5` (265 `Thứ chín.`)). Trong chính bài: 21 nhóm Pāli trùng, 30 cặp, bản Việt giống hệt nhau ở cả 30 cặp, 0 cặp lệch (ba lần mở lời của Kokālika, ba lần đáp của Đức Phật, và toàn bộ bài kệ lặp ở 7–10 và 16–19).

  THUẬT NGỮ (đếm tầng). `bhikkhu` → tỳ-kheo (tầng `an`: dạng gạch nối chiếm gần hết). `āvuso` → hiền giả (`này hiền giả` 137 so với `này Hiền giả` 51). `brahmā` → Phạm thiên (88 so với `Phạm Thiên` 6 trong tầng `an`; `sn6` viết hoa nhưng bộ `an` viết thường). `paccekabrahmā` → Phạm thiên độc cư, theo `sn6.6`–`sn6.8` (`Phạm Thiên độc cư`; `sn6.9` bỏ chữ này khi đặt tên, tôi giữ để không mất `pacceka`). `kālaṅkato`/`kālamakāsi` → qua đời (123 so với 26 `mệnh chung`, 14 `mạng chung`, 33 `chết`); `sn6.10` dùng `mệnh chung`, tôi chọn đa số tầng. `padakkhiṇaṁ katvā` → đi nhiễu quanh … theo hướng bên phải (`sn2.20`). `ekamantaṁ aṭṭhāsi` → đứng sang một bên (47 so với 31 `đứng một bên`). `abhikkantāya rattiyā abhikkantavaṇṇo … obhāsetvā` → khi đêm đã về khuya, với dung sắc thù thắng, chiếu sáng toàn bộ rừng Jeta (`an6.32`, `an9.19`, `an6.21`, `an7.32`; `obhāsetvā` → chiếu sáng 57 so với 3 `soi sáng`). `pāpicchā` → có ác dục (25 so với 2 `ước muốn xấu`); `vasaṁ gatā` → bị chi phối (`snp3.10`; `sn6.10` dùng `chế ngự`). `saddhāyiko paccayiko` → đáng tin cậy, đáng được tin tưởng, theo `sn3.25`. `anāgāmī` → vị bất lai (37 chỗ `bất lai`/`Bất lai`/`Bất Lai`, 0 chỗ `bất hoàn` trong các khoá chứa `anāgāmī`). `āghātetvā` (`cittaṁ āghāteti`) → khởi tâm oán hận (tầng `āghāt`: hận 67, oán 35, thù 8; `ôm lòng oán hận` cho `āghātaṁ bandhati` ở `dn34`, `dn33`, `an9.29`); `sn6.10` và `snp3.10` dùng `ác ý` / `thù nghịch`, tôi chọn `oán hận` vì `āghāta` là sự oán hờn chứ không phải `vyāpāda`, và để dành `ác ý` cho `manaṁ padūsaye` (9.5). `pīḷakā` → mụn nhọt (14 so với 3 `mụt nhọt`); `sāsapa` → hạt cải; `tila` → hạt mè (9 so với 2 `hạt vừng`); `mugga` → đậu xanh; `kalāya` → đậu gà (4); `kolaṭṭhi` → hạt táo, `kola` → quả táo (`sn13.5`, `sn13.6`, `sn15.2`). `sahassa` → ngàn (74 so với 66 `nghìn năm`). `Seyyathāpi … evameko` → `ví như hai mươi địa ngục X bằng một địa ngục Y`, theo `sn6.10`.

  SỐ PĀLI (phép tính). `sataṁ sahassānaṁ` = `sata` 100 × `sahassa` 1000 = một trăm ngàn (100.000), cùng cấu tạo `satasahassa` đã xác lập ở tầng (`kappānaṁ satasahassaṁ` → một trăm ngàn). `chattiṁsati` = `cha` 6 + `tiṁsati` 30 = ba mươi sáu. `pañca` = năm. `vīsati` = hai mươi (11 chỗ trong Pāli: `vīsatikhāriko` ở 15.3 và 15.4 và chín dòng 15.5–15.13; 11 chỗ `hai mươi` ở Việt, khớp). `vassasatassa vassasatassa` = mỗi trăm năm. Chín phép nhân 20 giữa mười địa ngục xếp đúng thứ tự Pāli: Abbuda → Nirabbuda → Ababa → Aṭaṭa → Ahaha → Kumuda → Sogandhika → Uppalaka → Puṇḍarīka → Paduma.

  BẤT ĐỊNH ĐÃ PHÂN XỬ, KHÔNG THÊM VÀO THÂN KINH:
  (1) KHOÁ SỐ TRONG KỆ (10.1–10.2, 19.1–19.2): `Sataṁ sahassānaṁ nirabbudānaṁ, chattiṁsati pañca ca abbudāni`. Tôi dịch sát cấu trúc Pāli: một trăm ngàn nirabbuda, và ba mươi sáu, cùng năm abbuda, theo `sn6.10`, `snp3.10`, `sn6.4:5.3` và theo bản Hòa thượng Thích Minh Châu (`trăm ngàn … ni-ra-bu-đa … ba mươi sáu … năm a-bu-đa`). Bản Sujato đọc khác hẳn, theo lối nhân (`a hundred thousand times a hundred million times five hundred and thirty-six times …`) và chèn đơn vị `năm`. Không bản nào trong tầng cho phép phân xử độc lập giữa cách cộng và cách nhân, cũng không rõ `chattiṁsati` (36) đứng với `nirabbuda` hay với `abbuda`. Bản Việt vì vậy KHÔNG tự tính tổng và KHÔNG gán đơn vị `năm` (Pāli không nói `vassa` ở đây); người đọc cần con số cụ thể thì phải quay lại Pāli. Đây là điểm bất định lớn nhất của bài và là lý do `ambiguity_integrity` không cao hơn.
  (2) `Yamariyagarahī nirayaṁ upeti` (10.3): `yaṁ` có thể là đối cách chỉ thời lượng (Sujato `For … a slanderer of noble ones goes to hell`) hoặc đi với `nirayaṁ`. Tôi dịch như `sn6.10`, không thêm `trong chừng ấy năm`.
  (3) KHOÁ SỰ SO SÁNH ĐỊA NGỤC (15.4–15.13): Pāli nói `eko abbudo nirayo` (một địa ngục Abbuda), Sujato đọc ngầm là `lifetime in the Abbuda hell`, vì cả đoạn đang đo tuổi thọ (`āyuppamāṇa`, 14.2–14.3). Tôi giữ nguyên chữ Pāli (`một địa ngục Abbuda`), không thêm chữ `tuổi thọ` hay `kiếp` như `sn6.10` (`một kiếp trong địa ngục`) và `snp3.10` (`một kiếp sống`); ở 15.4 câu `chứ một địa ngục Abbuda thì chưa hết` là phần lược của Pāli `na tveva eko abbudo nirayo`. Tên mười địa ngục giữ nguyên dạng Pāli; nghĩa tên (Sujato: năm tên đầu Abbuda, Nirabbuda, Ababa, Aṭaṭa, Ahaha Sujato giữ nguyên dạng Pāli, rồi Yellow Lotus (Kumuda), Fragrant Water Lily (Sogandhika), Blue Water Lily (Uppalaka), White Lotus (Puṇḍarīka), Pink Lotus (Paduma), tức sen hồng) thuộc về glossary, không nhập vào lời kinh; `snp3.10` dịch nghĩa năm tên cuối, `sn6.10` giữ Pāli nên tôi theo `sn6.10`.
  (4) `4.3` chuỗi các quả: Pāli có chín bậc (hạt cải, đậu xanh, đậu gà, hạt táo, quả táo, āmalaka, tiṇḍuka, beḷuvasalāṭuka, billa) rồi `pabhijjiṁsu`. Bản Sujato bỏ `tiṇḍuka` (chỉ còn myrobalans → unripe wood-apples → ripe wood-apples) và bản Hòa thượng Thích Minh Châu cũng không có bậc này; Pāli đã ghim có, nên tôi dịch đủ và giữ tên Pāli `tiṇḍuka` (thường được xác định là quả của cây Diospyros; không có tên Việt chắc chắn). `āmalaka` (Sujato `myrobalans`), `beḷuva` (dạng `bilva`, Sujato `wood-apples`) và `billa` (cùng loại quả, Sujato `ripe wood-apples`) tôi giữ Pāli vì không có tiền lệ tầng chắc chắn và các bản Việt trước đã dùng `mộc qua`, `beluva chín` cho cùng một chữ `billa`, mà Pāli ở `billa` không có chữ `chín`. `salāṭuka` = non. `kalāya` Sujato `chickpeas`; theo `sn6.10` (`đậu gà`).
  (5) `kali` (8.3, 8.4, 9.1, 9.4): nghĩa đen là điểm thua (con xúc xắc thua) nên tôi dịch `vận rủi` (theo `snp3.10`, `an4.3` `vận xua`), không `quẻ xui` như `sn6.10`. `akkhesu dhanaparājayo` → thua mất của cải trong trò xúc xắc (`akkha` là xúc xắc; `sn6.10` `cuộc cờ`, `snp3.10` `đánh bạc`); chọn nghĩa đen. `vicināti` → nhặt lấy.
  (6) `5.7` `Passa yāvañca te idaṁ aparaddhan`: `aparaddha` là lỗi lầm, sai trật; dịch `Hãy xem ông đã sai lầm đến mức nào trong việc này!` theo Sujato `See how far you have strayed!` và Hòa thượng Thích Minh Châu `lầm lạc trong vấn đề này`; `idaṁ` ('việc này') chỉ cụ thể việc đến cõi người, nhưng Pāli không nói rõ.
  (7) `kevalakappaṁ` → toàn bộ; `abhikkantavaṇṇo` → dung sắc thù thắng theo tiền lệ tầng; `abhikkantāya rattiyā` → khi đêm đã về khuya. Ở 13.2 Pāli có `imaṁ rattiṁ` (đêm nay) trước `abhikkantāya rattiyā` (khi đêm đã khuya), tôi giữ cả hai nên đọc hơi lặp, đúng như Pāli.
  (8) `bhagavā` → Đức Phật xuyên bài (tầng `an`: `Đức Phật nói` 12, `Đức Thế Tôn nói` 14, `Thế Tôn nói` 2 trong riêng `an10`; toàn tầng 109 so với 23 ở `etadavoca`); lời xưng hô `bhante` → Bạch Thế Tôn. `sn6.10` viết `Thế Tôn`, `snp3.10` viết `Đức Thế Tôn`.
  (9) `pana` ở 15.1 và `kho` ở 14.3 và 15.14: trợ từ nhẹ; 15.1 bỏ `pana` theo 3 khoá tiền lệ (`sn15.6`, `sn15.7`), 14.3 dùng `thật dài`, 15.14 dùng `chính`.

  Kiểm: bộ khoá Việt = bộ khoá Pāli (99 = 99, đúng thứ tự); nháy đơn và nháy kép khớp Pāli từng khoá, 0 lệch trên 99 khoá (cả hai phép cùng mẫu số 99); NFC; không khoá rỗng; không khoảng trắng thừa; không Pāli lọt sang Việt ngoài tên riêng (Kokālika, Sāriputta, Moggallāna, Turū) và các tên địa ngục, tên quả đã nêu ở trên. Đã in và đọc đối chiếu từng cặp Pāli với Việt cho cả 99 khoá (kể cả 21 nhóm trùng), không tìm thấy khoá lệch nội dung; không có khoá nào mang nội dung của khoá kế bên.

