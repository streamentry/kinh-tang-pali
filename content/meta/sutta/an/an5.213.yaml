notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản song song ud8.6 trong kho.
  Thuật ngữ theo ud8.6: người phá giới, người giữ giới, nguy hại, lợi ích, hội chúng Sát-lỵ.
  Nửa sau (lợi ích) ud8.6 chỉ có 1/5, các điều còn lại dịch đối xứng với nửa nguy hại.
  Coordinartor chạy bốn cổng trước khi gộp: npm run validate, npm test, npm run check, npm run build.

  Quyết định hội đồng biên tập 2026-10-16: A3 — an5.213:1.1, 1.4, 2.2, 3.2, 4.2, 5.2, 5.3 (vipatti = “thất bại”, không phải “thất nghiệp” tức mất việc làm, cặp với “thành tựu”).
