  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `2.1`, `2.4`, `3.3`, `3.6`, `5.3` (`aparihānāya`, `aparihāna`) — «không thoái đọa» → «không suy giảm» (78 nơi dùng «suy giảm», chỉ bài này dùng «thoái đọa»); khoá `2.7`, `3.8` (`padakkhiṇaṁ katvā tatthevantaradhāyi`) — «thân hữu nhiễu … biến mất ngay tại chỗ» → «đi vòng bên phải rồi biến mất ngay tại đó» (cùng công thức với an7.33–35, an6.33; «thân hữu nhiễu» chỉ có 4 nơi và không rõ nghĩa); `2.7` đổi nháy ‘ ’ → “ ” cho khớp Pāli `“samanuñño me satthā”ti`, «biết rằng» → «nghĩ rằng».
