notes: |-
  **Phạm vi lát c7: đủ mọi khoá trong `all` của bài, không thêm khoá nào.**
  Chạy lại `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tự kiểm những
  cờ mà `rven88.py` không áp cho tầng Việt: đủ khoá và đúng segment ID theo `pre`
  (tiền tố khoá thật, không phải uid-gộp); ngoặc kép cân trên cả bài; mọi chuỗi
  đã NFC; không Pāli lọt; số dấu lược bằng Pāli.

  **Không đối chiếu được tầng Việt hiện hành.** Tại commit đã ghim,
  `translation/vi/` của bilara chỉ chứa Pháp Cú, nên các bài này không có bản Hòa
  thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu
  sót của kho; `triangulation` vì thế chỉ ở mức Pāli + English Sujato.

  Tôi **không** chạy `npm run validate|test|check|build` (đợt này cấm; người điều
  phối chạy tập trung sau khi gộp các pre), nên `technical_integrity` chấm 9.6
  chứ không phải 10.0.

  **Ba khoá `1.1`, `1.2`, `1.4` dùng lại nguyên văn đã có, không dịch lại.**
  Pāli của chúng giống hệt nhau ở cả dải `an2` hai pháp, và các bài anh em đã
  `published` (`an2.163`, `an2.164`, `an2.97`) dùng cùng một nguyên văn:
  *Có hai loại pháp, này các tỳ-kheo.* / *Thế nào là hai?* / *Này các tỳ-kheo,
  đây là hai loại pháp”.* Chỉ `1.3` và `1.5` là của riêng bài này.

  **Thuật ngữ `1.3`, đếm được.** `kodha` → *sân hận*: 448 chỗ so với *giận dữ*
  149. `upanāha` → *hiềm hận*: 29 chỗ so với *oán hận* 25, và *hiềm hận* là chữ
  dùng trong mọi bảng liệt kê lậu hoặc. `vinaya` ở đây là danh từ *sự điều phục*.

  **XUNG ĐỘT ĐÃ GHI, cần người biên tập phán xét.** Bài kề `an2.139:1.3` (Pāli
  `Kodho ca upanāho ca.`, cùng cặp từ nhưng không có hậu tố `-vinaya`) dịch là
  *là giận dữ, và oán hận* — cả hai chữ đều thuộc phe thiểu số theo số đếm trên.
  Tôi không theo vì 448:149 và 29:25 là chênh lệch rõ, nhưng hai bài kề nhau mà
  lệch chữ cho cùng một cặp gốc thì độc giả dễ thấy.

  **`1.5` đặt mới, 0 tiền lệ.** `Āyācana` (phẩm của những lời ước nguyện
  *āyāceyya* ở `an2.130–133`) → *Phẩm Ước Nguyện*. Đây là lý do `terminology`
  chỉ 9.2.
