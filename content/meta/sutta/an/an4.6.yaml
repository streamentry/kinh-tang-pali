notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.1 — "Có bốn chúng sinh này hiện có trên đời, này các tỳ-kheo." → "Này các tỳ-kheo, có bốn hạng người này hiện hữu trong thế gian." vì `puggalā` là người, không phải "chúng sinh" (`sattā`), và bài dùng "người" ở 1.7, 1.8; chọn "hạng người" thay vì "cá nhân" của cách đa số để khớp cách nói của chính bài.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 4.6 — «Này các tỳ-kheo, bốn chúng sinh này hiện có trên đời.» → «Này các tỳ-kheo, bốn hạng người này hiện hữu trong thế gian.» (`puggalā` là người, không phải `sattā`; `lokasminti` là thế gian; theo cùng lựa chọn «hạng người» đã ghi ở khoá 1.1, cách đa số là «cá nhân»). Không đổi điểm.

  Quyết định hội đồng biên tập 2026-10-16: A4 — an4.6:1.9, 2.3, 3.3, 4.3 (navaṅga: đủ chín thể loại theo mn22, bỏ “khất đàm”, “khế tùng”, chữ “kinh” gắn thừa).
