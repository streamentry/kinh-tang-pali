notes: |-
  Dịch toàn bộ 69 khóa Pāli root từ snapshot SuttaCentral/Bilara đã ghim; không có khóa nào ngoài tập khóa Pāli. Bài là một chuỗi nhân duyên: vô minh có "thức ăn" (āhāra) là năm triền cái, rồi ngược lên ba ác hạnh, sự không thu thúc các căn, sự thiếu niệm và tỉnh giác, tác ý không như lý, không có niềm tin, nghe phi Chánh Pháp, thân cận phi thiện nhân; sau đó là chuỗi đối xứng cho minh và giải thoát; mỗi chuỗi kèm một ví dụ mưa núi đổ về đại dương.

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE ENGLISH:
  - Tầng Anh Sujato phủ 31/31 khóa Pāli có nội dung (>= 40 ký tự, bỏ khối :0) = 1,00; chỉ khóa colophon 9.3 ("Paṭhamaṁ.") để trống ở Sujato vì ngắn hơn ngưỡng. Vượt ngưỡng 0,80; không cần entry trong reference-gaps. Tầng english-project không có tệp cho bài này, nên không có phần Anh nào do dự án tự lấp; toàn bộ tham khảo Anh là độc lập (Sujato).
  - Tầng Việt hiện hành (Hòa thượng Thích Minh Châu) không có trong snapshot đã ghim cho bài này, nên chỉ dùng tiền lệ Việt trong chính tầng dự án để đối chiếu thuật ngữ; vì vậy triangulation đặt 9.0.

  KIỂM TRA ĐO ĐƯỢC:
  - Tập khóa Việt = tập khóa Pāli = 69, thứ tự khóa đúng thứ tự Pāli.
  - Nháy đơn và nháy kép khớp Pāli từng khóa: 0 lệch trên 69 khóa. Dấu lược: Pāli chỉ có một "(…)" trần ở 4.1 (giữa câu, sau "deve vassante"), không có "…pe…"; bản Việt giữ đúng một "(…)" ở đúng khóa 4.1, theo quy ước của tầng Pāli ghim; khóa 8.1 (cùng ví dụ, không có "(…)") không có dấu lược.
  - Pāli trùng nguyên văn trong chính bài: 2 nhóm (3.2 với 5.2; 4.2 với 8.2), 2 cặp, bản Việt khác 0 cặp. Các khóa 3.1/5.1 và 7.1/9.1 khác ở từ mở đầu (Iti kho / Evamevaṁ kho) nên được dịch khác ở đúng chỗ đó ("Như vậy" / "Cũng vậy"); 4.1/8.1 khác ở "(…)" và dấu chấm giữa câu.
  - Pāli trùng nguyên văn với các bài đã dịch khác: 294 cặp (0.2 với 6 bài, 0.3 với 3 bài, 9.3 với 285 khóa); bản Việt khác 2 cặp, đều ở colophon 9.3 (sn14.11:5.4 và sn22.53:3.11 dịch "Bài thứ nhất."; 283 khóa còn lại dịch "Thứ nhất.", chọn dạng đa số).
  - Không có chữ số trong thân kinh; không có số Pāli cần tính (số lượng chỉ là "năm triền cái", "ba ác hạnh", "bảy giác chi"... , đã đối chiếu từng cụm với Pāli); không có khóa rỗng; NFC sạch; không có Pāli lọt sang bản Việt.

  THUẬT NGỮ VÀ TIỀN LỆ (đếm trên tầng):
  - āhāra/sāhāra/anāhāra -> "thức ăn" / "có thức ăn" / "không có thức ăn": theo sn46.2 (cùng cấu trúc cho năm triền cái và bảy giác chi, Pāli "āhāraṁ paṭicca tiṭṭhanti, anāhārā no tiṭṭhanti" -> "thức ăn"); toàn tầng āhāro dịch "thức ăn" 64 khóa, "chất nuôi" 29 khóa (sn22.54 dịch sāhāraṁ "cùng chất nuôi") và "nuôi dưỡng" 36 khóa; Sujato dùng "fuel". Giữ "thức ăn" để một khái niệm trong cùng chủ đề có cùng một chữ, và để câu "pi" (avijjampāhaṁ -> "cũng") đọc được.
  - nīvaraṇa -> "triền cái" (166 khóa, so với "chướng ngại" 83). duccarita -> "ác hạnh" (86; "hành vi xấu" 29, "ác hành" 10); sucarita -> "thiện hạnh" (63; "thiện hành" 7).
  - indriyasaṁvara -> "thu thúc các căn" (an6.50:0.3 "Kinh Thu Thúc Các Căn"; 6 khóa dạng này, "kiềm chế các căn" 3, "chế ngự căn" 2, "phòng hộ" 27 ở công thức khác). satisampajañña -> "niệm và tỉnh giác" (23 khóa; "niệm tỉnh giác" 18, "chánh niệm tỉnh giác" 14).
  - yonisomanasikāra -> "tác ý như lý" (18 dạng này, "như lý" 41); ayonisomanasikāra -> "tác ý không như lý" (8 dạng này, "không như lý" 13; an1.74, an1.90).
  - bojjhaṅga -> "giác chi" (512/516); satipaṭṭhāna -> "niệm xứ" (269/279).
  - vijjāvimutti -> "minh và giải thoát" (16 khóa; "minh giải thoát" 4); Sujato "knowledge and freedom".
  - saddhammassavana -> "nghe Chánh Pháp" (19 khóa); asaddhamma -> "phi Chánh Pháp" (an4.44; "Chánh Pháp" 15 khóa trong nhóm saddhamma/asaddhamma, "phi pháp" 7, "ác pháp" 4).
  - sappurisa -> "thiện nhân" (129 khóa; "người thiện" 101, "bậc thiện" 40, "chân nhân" 36); asappurisa -> "phi thiện nhân" (an2.134, an2.135).
  - sappurisasaṁseva -> "thân cận thiện nhân": trong 10 khóa Pāli tầng, "phục sự thiện nhân" 6 khóa (an4.248, an4.249, sn55.50, sn55.55, sn55.62, sn55.74) và "thân cận bậc chân nhân" 4 khóa (sn55.5, dn33, dn34). Chọn "thân cận" vì "phục sự" là cách nói cổ, ít rõ hơn cho người Việt hiện đại; chưa có phép đo nào cho thấy đây là quy ước cứng của tầng.
  - paripūra/paripūreti/pāripūri -> "viên mãn" (an1.74, an1.75: bhāvanāpāripūri "viên mãn trong tu tập"), nhưng trong ví dụ nước thì "lấp đầy" / "được đầy" theo an3.95:6.1, sn55.38:1.1 và an4.147:2.1 (cùng ví dụ, cùng Pāli nhưng khác dấu câu). Khối đối nhau 4.2/8.2 vì vậy dịch pāripūri là "sự lấp đầy", còn 3.2/5.2/7.2/9.2 là "sự viên mãn".
  - Ví dụ mưa núi: kusobbha -> "hồ nước", mahāsobbha -> "đầm lớn", kunnadī -> "suối", mahānadī -> "sông lớn", mahāsamuddaṁ sāgaraṁ -> "đại dương, biển cả", theo an3.95:6.1 và sn55.38:1.1 (hai khóa, cùng bản dịch); an4.147:2.1 chọn "vũng lầy / hồ lớn / dòng suối / dòng sông lớn / biển cả" (1 khóa) nên không theo. Cặp "đại dương, biển cả" giữ cả hai từ đồng nghĩa của Pāli (samudda, sāgara) mà Sujato gộp thành "ocean".
  - Tên phẩm: Yamakavagga -> "7. Phẩm Song Trùng" (6 bài có cùng dòng Pāli trong tầng, như an10.63 và an10.64, đều dịch như vậy; cũng như an8.75). Tựa Avijjāsutta -> "Kinh Vô Minh" (sn22.113, sn45.1, sn56.17 cùng tựa).
  - Dòng đầu 0.1: "Kinh Tăng Chi Bộ 10.61" (924 bài dạng này, "Aṅguttara Nikāya N" 395 bài).

  BẤT ĐỊNH (không thêm vào thân kinh):
  - idappaccayā (1.2): dịch "do điều kiện này"; có thể đọc là "do duyên cụ thể này" (Sujato "a specific condition"); tầng có sn46.4 dịch "do lý do này". Nghĩa không đổi.
  - ito pubbe (1.1): dịch "trước điểm này", nghĩa đen là "trước (điểm) này"; Sujato diễn "before which". Câu 1.1 nói điểm khởi đầu của vô minh không được biết đến, còn 1.2 nói vẫn có thể nhận ra điều kiện của vô minh; hai câu không mâu thuẫn vì một bên là điểm bắt đầu theo thời gian, bên kia là điều kiện (duyên).
  - asatāsampajañña (2.12 và các khóa lặp): hợp từ "không có niệm" và "không tỉnh giác"; dịch "thiếu niệm và tỉnh giác" (Sujato "lack of mindfulness and situational awareness"). Cách đọc "thiếu niệm" và "thiếu tỉnh giác" hay "thiếu cả hai" khác nhau không đáng kể.
  - "viên mãn" cho chuỗi bất thiện: từ này nghe tích cực nhưng ở đây chỉ nghĩa "đầy đủ, trọn vẹn" (paripūra); giữ cùng một chữ cho cả chuỗi bất thiện và chuỗi thiện để thấy tính đối xứng, đúng như Pāli dùng cùng một động từ.
  - Vị trí "(…)" ở 4.1: Pāli có "(…)" trần giữa "deve vassante" và "taṁ udakaṁ"; không rõ phần lược; giữ đúng vị trí, không đoán.

