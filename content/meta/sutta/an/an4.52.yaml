notes: |-
  Sửa lan 2026-10-13: khoá an4.52:3.2 — sāmīcippaṭipanno, 'thực hành chánh trực' → 'thực hành chân chánh'. Căn cứ: ujuppaṭipanno đã là 'thẳng ngay' nên 'chánh trực' trùng nghĩa, làm mất phân biệt bốn vế của công thức Tăng; cách dịch 'chân chánh' đã dùng ở an11.11:5.2 và dn16:2.9.8. Khoá an4.52:6.2 (ujubhūtañca dassanaṁ, 'kiến giải chánh trực') giữ nguyên vì Pāli là ujubhūta, không phải sāmīci.
