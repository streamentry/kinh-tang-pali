notes: |-
  Dịch từ Pāli root snapshot SuttaCentral/Bilara đã ghim (source/suttacentral.lock.json). Đầy đủ 64/64 khoá, từ an8.2:0.1 đến an8.2:17.2, không có khoá ngoài tập Pāli.

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE:
  - Pāli root là authority. Đối chiếu bản Anh Bhikkhu Sujato tại cùng commit đã ghim: trên 53 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0.x), Sujato có prose ở 49/53 = 92,5%, vượt ngưỡng 0,8 của source/layers.yaml; không cần entry trong content/meta/reference-gaps.yaml. Bốn khoá Sujato để trống (10.2, 10.3, 16.2, 16.6) được tầng english-project của dự án lấp (4/4), nên mẫu số 53/53 đều có English; nhưng bản lấp do cùng tác giả với bản Việt này nên KHÔNG phải cách đọc Anh độc lập: triangulation chỉ tính trên 49/53 khoá có Sujato độc lập (khác với 4 khoá lấp).
  - Tầng Việt hiện hành (vietnamese-current) vắng ở commit đã ghim (bilara chỉ có Pháp Cú). Bản nguyên bài Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn đã được đọc đối chiếu thuật ngữ (không phải tầng segment): TMC dịch hirottappa → tàm quý, garuṭṭhāniya → bậc đồng phạm hạnh đóng vai trò y chỉ sư, vūpakāsa → an tịnh, bhāvanāya → được tu tập.
  - Đối chiếu song song Pāli dn34:2.1.3–2.1.28 (cùng công thức tám hetu/paccaya) và an2.47, an3.20, an6.51, an10.11 (công thức mở điều chưa mở).

  SỐ PĀLI:
  - aṭṭha hetū aṭṭha paccayā = 8 nhân, 8 duyên; tám thứ tự paṭhamo…aṭṭhamo = nhất, hai, ba, tư, năm, sáu, bảy, tám; Pāli chạy đủ 8 khối (1.3–1.4, 2.1–2.4, 3.1–3.2, 4.1–4.2, 5.1–5.2, 6.1–6.2, 7.1–7.3, 8.1–8.7) và khoá 17.1 nhắc lại "tám". dvayena vūpakāsena = hai sự viễn ly (thân và tâm). pañcasu upādānakkhandhesu = năm thủ uẩn, liệt kê đủ sắc, thọ, tưởng, các hành, thức (hai trong năm ở dạng lược …pe…).

  DẤU LƯỢC VÀ NGOẶC:
  - …pe… (8.4, 16.3) và … trần (8.5, 16.4, 16.5) đều thành đúng một … ở bản Việt, khớp Pāli từng khoá: 5/5 khoá có dấu lược.
  - Nháy đơn ‘ ’ và ngoặc kép “ ” khớp Pāli từng khoá, 64/64 khoá, 0 lệch. Đặc thù tầng Pāli: 16.6 kết …atthaṅgamoti. không kèm nháy, nên bản Việt kết dấu chấm; nháy ’ đóng ở 16.7.

  DÙNG LẠI NGUYÊN VĂN VÀ TIỀN LỆ (đã đếm):
  - 2.3 và 10.3 dùng lại nguyên văn an3.20:6.4 (Những Tôn giả ấy mở ra cho vị ấy điều chưa mở…). Khoá 8.2–8.6, 16.2–16.6 theo biến thể đa số của công thức sắc–thọ–tưởng–hành–thức (an4.41 và tương tự: như vậy là … sanh khởi … diệt mất, 6/14 cặp trùng nguyên văn Pāli); …pe… ở 8.4/16.3: như vậy là tưởng/thọ … giữ dạng một … theo 5/12 tiền lệ.
  - 4.1/12.1 (công thức giới) theo biến thể đa số: sống hộ trì Pātimokkha, đầy đủ oai nghi và đường hạnh, thấy sự nguy hiểm trong các lỗi dù nhỏ…học luật đã thọ nhận (82 khoá Pāli có samādāya sikkhati sikkhāpadesu ở tầng; biến thể này là biến thể phổ biến nhất nhưng tiền lệ tầng không đồng nhất). 6.1/14.1 theo an3.20:5.2 và an3.96:3.2 (tinh tấn đã được khởi động… không bỏ gánh). 3.1 và 11.1 theo dn34:2.1.12 (hai sự viễn ly: thân viễn ly và tâm viễn ly). Công thức đầu bài theo dn34:2.1.3 (đưa đến đạt được tuệ căn bản…).
  - Pāli trùng nguyên văn ngoài bài: 7 khoá Pāli (≥ 25 ký tự) có trùng ở bài khác, 23 cặp; 14 cặp bản Việt khác (do tiền lệ vốn có nhiều biến thể, không do khoá lệch). Trong chính bài: 5 nhóm Pāli trùng (2.3=10.3; 7.2=15.2; 8.5=16.5; 9.3/10.4/11.2/12.2/13.2/14.2/15.3/16.7; 9.4/10.5/11.3/12.3/13.3/14.3/15.4/16.8), bản Việt giống nhau ở mọi cặp: 0 cặp trong bài mà Việt khác.
  - Thuật ngữ đã đối chiếu: sabrahmacārī → đồng phạm hạnh (252 khoá, 'đồng Phạm hạnh' 11); hirottappa → tàm quý (19; dn34 và an4.73 còn dùng hổ thẹn và kính sợ); upādānakkhandha → năm thủ uẩn (104 khoá) so năm uẩn chấp thủ (3); samudaya → sanh khởi (66, nhưng 'sinh khởi' 139, chọn 'sanh' để khớp công thức an4.41 trong cùng bài); tiracchānakathā → chuyện tầm phào (11 khoá); ajjhesati → thỉnh; sambhāventi → kính phục (mn77); tên kinh Paññāsutta → Kinh Có Tuệ (an9.25, sn56.63; Sujato Wisdom, TMC 'Tuệ'); 0.2 Mettāvagga → 1. Phẩm Từ (an8.1/8.3).

  BẤT ĐỊNH ĐÃ PHÂN XỬ:
  - garuṭṭhāniyaṁ sabrahmacāriṁ: dịch 'một vị đồng phạm hạnh ở địa vị bậc thầy' (ṭhāniya = ở vị trí; Sujato 'in a teacher's role'; TMC 'đóng vai trò y chỉ sư'); dn34:2.1.5 đã publish dịch 'được tôn trọng' (2 khoá). Hai cách đọc đều có căn cứ; chọn nghĩa 'vị trí bậc thầy' vì khớp Sujato, TMC và nghĩa 'satthāraṁ upanissāya'. Không ảnh hưởng giáo nghĩa.
  - yatthassa tibbaṁ hirottappaṁ paccupaṭṭhitaṁ hoti pemañca gāravo ca: 'nơi đó' chỉ vị thầy (Sujato 'for them'); giữ cấu trúc 'nơi đó…nơi vị ấy' như dn34:2.1.5.
  - anānākathiko: 'không nói chuyện tạp nhạp' (Sujato 'motley talk', TMC 'không nói nhiều'); không nói nhiều là cách hiểu hẹp hơn Pāli nên bỏ.
  - Addhā ayamāyasmā jānaṁ jānāti passaṁ passati: 'Chắc chắn vị tôn giả này thật sự biết, thật sự thấy'; không thêm tân ngữ 'điều đáng biết' như TMC vì Pāli không nói.
  - piyattāya garuttāya bhāvanāya sāmaññāya ekībhāvāya: 'thương mến, kính trọng, tôn quý, hòa đồng, hợp nhất'. bhāvanāya ở đây theo Sujato 'esteem' (hợp văn cảnh: các vị đồng phạm hạnh kính phục), không phải 'tu tập' như TMC; sāmaññāya = hòa đồng (cùng nghĩa 'harmony' của Sujato; TMC 'Sa-môn hạnh'). Chưa có tiền lệ công thức này đã publish (an10.87 chưa dịch); độ chắc trung bình.
  - Nghĩa đen mâu thuẫn văn cảnh: không gặp câu nào Pāli đọc nghĩa đen mà trái văn cảnh; hai chỗ cần phân xử (bhāvanā, garuṭṭhāniya) đã ghi trên.

