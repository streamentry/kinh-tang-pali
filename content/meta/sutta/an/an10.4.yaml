notes:
  - >-
    **Bố cục KHÁC `an10.3` và `an10.5`:** ở đây cả hai lần lặp đều bị lược, nên
    mỗi lần chỉ còn ba dòng và **ví dụ cây nằm ở giữa**, không phải sau dây đầy
    đủ. Đây là lý do ba bài nền tảng phải khai từng segment chứ không dùng chung
    một khuôn.
  - >-
    **Cả dãy chín mắt xích đã có tiền lệ từng chặt, không phải do tôi đặt ra.**
    `an5.168:1.2`–`1.5` và `2.1`–`2.4` (đã dịch) là **cùng cấu trúc `X asati,
    X-vipannassa hatūpanisaṁ hoti Y`** với `an10.3/4/5`, chỉ khác chuỗi pháp —
    nên dùng lại nguyên văn: *khi không có chánh định, người hư hoại chánh định
    đã hủy hoại nền tảng của sự thấy biết như thật*. Cùng đó, `dussīlassa
    sīlavipannassa hatūpaniso hoti X` → *vị phạm giới, giới hư hoại, nền tảng
    của X đã bị hủy hoại* và `X sati, X-sampannassa upanisasampannaṁ hoti Y` →
    *khi có X, người viên mãn X đã đầy đủ nền tảng của Y* (`an5.168:2.2`).
    `sīlasampannassa` → **giới viên mãn**, `sīlavipannassa` → **giới hư hoại** —
    cũng của `an5.168`.
  - >-
    **Thuật ngữ lấy từ tiền lệ, mỗi chữ một nguồn:** `avippaṭisāra` → *không sợ
    hãi* (0 segment, đặt mới — mắt xích đầu, đứng trước `hoan hỷ` nên là *thong
    thả không sợ hãi*, không phải *dũng cảm*); `pāmojja` → *hoan hỷ*
    (`an3.70:4.6`, `an3.95:5.3`); `pīti` → *hỷ* (cùng hai bài); `passaddhi` →
    *khinh an* (`an3.95:5.3` *thân khinh an*); `sukha` → *lạc*; `sammāsamādhi` →
    *chánh định* (128 segment); `yathābhūtañāṇadassana` → *sự thấy biết như
    thật*, `nibbidāvirāga` → *sự chán ngại và ly tham*, `vimuttiñāṇadassana` →
    *giải thoát tri kiến* (đều của `an5.168:1.3`–`1.5`).
    **Biến thể tiền lệ đã ghi để không lẫn:** `dn34:2.2.3` có cùng dãy nhưng
    dịch `passaddhi` là *lắng yên* và `cittaṁ samādhiyati` là *được định tĩnh*.
    Chương này theo `an3.95:5.3` — vì `an3.95:5.3` là **cùng Pāli** với
    `an10.2:1.10`–`1.18`, nên gần hơn. `nibbindati`/`virajjati` theo
    `an4.177:2.3` (*chán nản* / *ly tham*), khác `dn34` (*nhàm chán*).
  - >-
    `Seyyathāpi, āvuso, rukkho sākhāpalāsavipanno` → *ví dụ như một cây bị mất
    cành lá và tán lá* theo `an5.168:1.6`; `Tassa papaṭikāpi na pāripūriṁ
    gacchati, tacopi … pheggupi … sāropi` → *mầm non không đầy đủ, vỏ … phần mềm
    … lõi gỗ cũng không đầy đủ* theo `an5.168:1.7` (bản không lược nối thành
    *vỏ, phần mềm và lõi gỗ*; bản có lược phải giữ dấu `…`).
  - >-
