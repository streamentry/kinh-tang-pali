notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 3.9 — "Tôn giả Ānanda đáp." → "… đáp lời Đức Thế Tôn." vì Pāli có `bhagavato paccassosi` (cách dịch chiếm đa số "đáp lời Đức Thế Tôn"; cách "vâng lệnh" của một nhóm khác nghe như mệnh lệnh nên không dùng); giữ nguyên khoá 1.2, 2.2, 3.2 vì "con được nghe và lãnh nhận ngay từ trước mặt Đức Phật" đủ cả hai động từ `sutaṁ`/`paṭiggahitaṁ` và `sammukhā`, chỉ khác văn phong so với cách đa số.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt hai): khoá 3.8 — ‘ông hãy nghe và suy nghĩ cho khéo’ → ‘hãy lắng nghe và chú tâm kỹ’ (`suṇāhi sādhukaṁ manasi karohi` là công thức ‘lắng nghe và chú tâm kỹ’ ở hơn 25 khoá toàn tầng; `manasi karohi` là chú tâm, không chỉ ‘suy nghĩ’); giữ nguyên khoá 3.9 và 1.2, 2.2, 3.2 như đã ghi lý do ở mục trước.
