notes: |-
  Dịch toàn bộ 60 khoá Pāli root từ snapshot SuttaCentral/Bilara đã ghim (source/suttacentral.lock.json).

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE:
  - Đối chiếu bản Anh Bhikkhu Sujato tại commit đã ghim (an9.12 có bản Anh này). Bản Sujato để trống 11 khoá của mục 3 (3.1–3.11): Sujato không dịch lại lời Sāriputta thuật lại cho Đức Thế Tôn mà gộp vào câu dẫn 2.6 ("told him what had happened"). Phần còn lại của bản Anh (1.x, 2.x, 4.x–11.x, kể cả 6.2–6.8 và các dấu lược "This is the Nth individual …") được dùng làm tầng tham khảo thật.
  - Tầng Việt hiện hành (vietnamese-current) chỉ có Pháp Cú ở commit đã ghim, nên bài này không có bản Việt tham chiếu; đây là giới hạn của snapshot, không phải lỗi văn bản.
  - triangulation giữ 8,0 (không cao hơn): chỉ có một bản Anh độc lập, không có bản Việt tham chiếu, và mục 3 không có bản Anh nào.

  Giải quyết draft 2026-10-12 (thay thế mục "ĐỐI CHIẾU NGUỒN VÀ COVERAGE" và mục "THUẬT NGỮ VÀ NHẤT QUÁN 9 HẠNG NGƯỜI" của lượt chấm 2026-10-08, vốn ghi sai các tên bậc và đếm 10 khoá thay vì 11):
  - Blocker cũ lowEnglishCoverage (Sujato phủ 79,2% < 0,80, do 11 khoá 3.1–3.11 trống) thuộc loại do tác giả cũ tự đặt, không phải lỗi văn bản, và đã GỠ. Lý do: mục 3 là Sāriputta kể lại gần nguyên văn mục 1–2 (3.1–3.7 lặp 1.2–1.7/2.1; 3.8 lặp nguyên văn 2.2; 3.9–3.11 lặp 2.3–2.5) đổi sang ngôi thứ nhất. Đã đọc đối kháng từng khoá 3.1–3.11 với Pāli: ngôi (con/ngài), thì quá khứ (pāvisiṁ, upasaṅkamiṁ, nisīdiṁ, pakkamiṁ), lời dẫn lồng ‘…’ đều khớp; 3.8 cùng Pāli với 2.2 và bản Việt giống hệt 2.2 (chỉ khác kiểu nháy lồng). Các khoá Sujato trống đứng vững từ Pāli và từ chính bài (mục 1–2 có bản Anh). Việc ghi nhận mất mát tầng Anh ở khoá 3.x thuộc tệp reference-gaps do công cụ của kho sinh; bài này không tự khai ở đây.
  - Không còn blocker nào khác: không hapax chưa giải, không khoá thiếu/thừa, không lỗi số lượng. Số Pāli đã tự tính lại: chín hạng người (navayime … nava puggalā) = 5 hạng Bất Lai (antarāparinibbāyī, upahaccaparinibbāyī, asaṅkhāraparinibbāyī, sasaṅkhāraparinibbāyī, uddhaṁsoto akaniṭṭhagāmī) + Nhất Lai + Nhất Chủng + Gia Gia + Tối đa bảy lần = 9; thứ tự các hạng khớp ordinal Pāli (paṭhamo 5.5, pañcamo 6.8, chaṭṭho 7.3, sattamo 8.3, aṭṭhamo 9.3, navamo 10.3). Các số khác: pañcannaṁ orambhāgiyānaṁ = năm hạ phần kiết sử; tiṇṇaṁ saṁyojanānaṁ = ba kiết sử; dve vā tīṇi vā kulāni = hai hay ba gia tộc; sattakkhattu = tối đa bảy lần.

  Sửa bản dịch (7 khoá):
  - 5.4, 6.2, 6.3, 6.5, 6.7: tên các bậc Bất Lai đổi cho khớp tiền lệ của kho, đo bằng số đếm. antarāparinibbāyī → "bậc bát-niết-bàn giữa chừng" (sn48.15/16/17/24, sn55.25, sn46.3, an7.55, pe2:35, 15+ khoá; chỉ sn54.5 dùng "Trung Gian Bát-niết-bàn", dn33/sn51.26 dùng "nhập diệt ở giữa"). upahaccaparinibbāyī: bản cũ "Tổn hại Bát-niết-bàn" (chỉ sn54.5 dùng) → "bậc bát-niết-bàn khi chạm đến" (sn55.25, sn48.15/16/17/24, an7.55 ×2, pe2:35 ×2; "Tổn hại" nghĩa là bị hủy hoại, không đúng với upa+hacca "đạt đến/chạm đến"; Sujato: "extinguished upon landing"). asaṅkhāra-/sasaṅkhāraparinibbāyī → "bát-niết-bàn không cần gắng sức"/"cần gắng sức" (sn55.25, sn48.x, pe2:35; bản cũ "Vô hành/Hữu hành" chỉ là phiên Hán–Việt, Sujato: "without/with extra effort"). uddhaṁsoto akaniṭṭhagāmī → "bậc đi ngược dòng đến cõi Akaniṭṭha" (an7.55 ×2, sn48.66, sn55.25, pe2:35 ×2; bản cũ "Thượng lưu tiến đến cõi Sắc Cứu Cánh" làm mất tên Akaniṭṭha đã dùng nhất quán).
  - 10.2: sattakkhattuparamo, bản cũ "Thất Thừa" không có tiền lệ nào trong kho và không phản ánh Pāli → "bậc Tối đa bảy lần" (an3.87, an3.88, pe2:34.3, pe2:35.1, pe8:73.8; 5/5 khoá).
  - 7.2: bỏ chữ "nữa" thừa ("chỉ trở lại đời này một lần"; Pāli sakideva imaṁ lokaṁ āgantvā). 8.2: bỏ "nữa" thừa ("chỉ sinh ra một kiếp người"; ekaṁyeva mānusakaṁ bhavaṁ nibbattetvā). 9.2: "gia đình" → "gia tộc" (kulāni; an3.87/88 dùng "gia tộc").
  - 4.1 và 11.1: abyattā "không sáng suốt" → "kém hiểu biết" (dn23:13.29/30, mn88:9.3 dùng "kém/thiếu hiểu biết"; mn136:6.14 "vụng về").
  Đếm lỗi nghĩa thật: 0 khoá sai nghĩa nặng; 5 khoá tên bậc lệch tiền lệ/nghĩa (5.4, 6.2, 6.3, 6.5, 6.7) và 1 khoá bịa tên "Thất Thừa" (10.2) đã sửa; 3 khoá chữ thừa/chọn từ nhỏ (7.2, 8.2, 9.2) và 2 khoá chọn từ (4.1, 11.1) đã sửa; tổng 11 khoá đổi trên 60.

  Điểm giữ nguyên chủ ý (đã đo, không sửa):
  - 2.2/3.8 và các khoá có "hữu dư y": saupādiseso → "có hữu dư y", anupādiseso → "vô dư y" (an7.56 dùng "còn dư y/không còn dư y"; hai cách cùng tồn tại, giữ "hữu dư y" vì khớp nhan đề Kinh Hữu Dư Y và nhất quán trong bài; mn105 dùng nghĩa đen khác).
  - 5.3, 6.1, 7.1, 8.1, 9.1, 10.1: "làm cho viên mãn … nhưng chỉ thực hành vừa phải" cho paripūrakārī/mattaso kārī, khớp an3.86–87 ("làm trọn … nhưng chỉ làm vừa").
  - 1.7/3.6: sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā → "nói lời chào hỏi và thăm hỏi thân mật" (dn25:4.2 "thân thiện và xã giao"; dn6 "thân thiện và đáng ghi nhớ"): sắc thái sāraṇīya hơi nhẹ, chấp nhận được.
  - 6.2–6.8 là các khoá lược: 6.2, 6.3, 6.5 mỗi khoá một dấu "…" cho …pe…; 6.4 và 6.6 Pāli RỖNG, bản Việt điền "Đây là hạng người thứ ba/thứ tư." (quy ước của kho cho khoá Pāli rỗng là "…": an3.102:4.3–4, sn35.24:1.5, sn35.25:1.5; ở đây điền câu số thứ tự thật của hạng thứ ba/thứ tư vì Pāli đã lược chính công thức đó). Đây là chỗ lệch quy ước nhỏ, không đổi nghĩa; phần "Đây là hạng người thứ hai" ở 6.2 do Pāli ngầm ở dấu lược nên giữ "…".
  - 2.2 nối sau lời “…” của các du sĩ; 4.1 mở ngoặc “ của Đức Thế Tôn và đóng ” ở 11.6; ngoặc đơn ‘…’ cho lời dẫn lồng; khớp Pāli từng khoá.
  - Nhan đề phẩm :0.2 "Phẩm Tiếng Hồi" là cách dịch chung của 7/8 bài cùng phẩm (an9.11, 14, 16–19; an9.13 dùng "Tiếng Hùng Vĩ"); ngoài phạm vi bài này, sẽ đồng bộ khi sửa cả phẩm. Ghi nhận bất định: "Tiếng Hồi" cho Sīhanāda (tiếng rống sư tử) cần được người biên tập phân xử cho cả phẩm.

  Bất định còn lại: (1) 6.4/6.6 điền câu số thứ tự thay vì "…" (xem trên); (2) nhan đề phẩm. Không có bất định nào làm đổi giáo nghĩa.

  Kiểm kỹ thuật: bốn lệnh của kho npm run validate · npm test · npm run check · npm run build chưa chạy trong lượt này (bị cấm trong phiên làm việc), nên technical_integrity đặt 9,6 và không tuyên bố technical gate đã pass. Tự kiểm tập khoá (60/60), không giá trị rỗng, cân bằng dấu lược so với Pāli từng khoá (0 lệch; 6.4 và 6.6 không mang "…" vì Pāli rỗng), nháy đơn/kép khớp Pāli từng khoá và metadata đọc được.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an9.12:1.3 — *Khi ấy, Tôn giả Sāriputta nghĩ rằng*
  → *Bấy giờ, Tôn giả Sāriputta nghĩ* (công thức `Atha kho āyasmato sāriputtassa etadahosi`, 6
  trên 10 khoá trùng Pāli dùng đúng dạng này).
