notes: "Dịch toàn bộ 60 khoá Pāli root từ snapshot SuttaCentral/Bilara đã ghim (source/suttacentral.lock.json).\n\
  \nĐỐI CHIẾU NGUỒN VÀ COVERAGE:\n- Đối chiếu bản Anh Bhikkhu Sujato tại commit đã\
  \ ghim. Bản Sujato để trống 10 khoá (mục 3: 3.1–3.11, do Sujato gộp lời kể của Sāriputta\
  \ vào đoạn dẫn 2.6). Do đó, coverage tầng Anh Sujato là 38/48 khoá có nội dung =\
  \ 79.2% (< 80%).\n- Mặc dù lớp lấp english-project đã bổ sung 10 khoá này, theo\
  \ AGENTS.md, lớp lấp do cùng hệ thống agent thực hiện nên không cấu thành bản đọc\
  \ Anh độc lập; triangulation hạ 8.0 và bài đặt status: draft với blocker lowEnglishCoverage\
  \ theo đúng quy định.\n- Tầng Việt hiện hành (vietnamese-current) không có bản dịch\
  \ cho bài này ở commit đã ghim.\n\nTHUẬT NGỮ VÀ NHẤT QUÁN 9 HẠNG NGƯỜI:\n- Bố cục\
  \ 9 hạng người hữu dư y (saupādiseso kālaṁ kurumāno) giải thoát khỏi ác thú:\n \
  \ 1. Antarāparinibbāyī (Trung gian Bát-niết-bàn).\n  2. Upahaccaparinibbāyī (Tổn\
  \ hại Bát-niết-bàn).\n  3. Asaṅkhāraparinibbāyī (Vô hành Bát-niết-bàn).\n  4. Sasaṅkhāraparinibbāyī\
  \ (Hữu hành Bát-niết-bàn).\n  5. Uddhaṁsoto akaniṭṭhagāmī (Thượng lưu tiến đến cõi\
  \ Sắc Cứu Cánh).\n  6. Sakadāgāmī (Nhất Lai).\n  7. Ekabījī (Nhất Chủng).\n  8.\
  \ Kolaṅkola (Gia Gia).\n  9. Sattakkhattuparama (Thất Thừa).\n- Phân biệt giáo nghĩa\
  \ then chốt: 5 bậc Bất Lai (Anāgāmī) viên mãn cả giới và định (sīlesu paripūrakārī,\
  \ samādhismiṁ paripūrakārī, paññāya mattaso kārī), trong khi bậc Nhất Lai và 3 bậc\
  \ Dự Lưu chỉ viên mãn về giới, còn định và tuệ ở mức độ vừa phải (sīlesu paripūrakārī,\
  \ samādhismiṁ mattaso kārī, paññāya mattaso kārī).\n- Cụm từ giải thoát khỏi đọa\
  \ xứ (parimutto nirayā parimutto tiracchānayoniyā parimutto pettivisayā parimutto\
  \ apāyaduggativinipātā) dịch nhất quán 100%: «được giải thoát khỏi địa ngục, giải\
  \ thoát khỏi súc sanh, giải thoát khỏi ngạ quỷ, giải thoát khỏi đoạ xứ ác thú».\n\
  - Đối ứng đối thoại giữa mục 1–2 và mục 3 (Sāriputta thuật lại cho Đức Thế Tôn)\
  \ bảo toàn 100% ngữ nghĩa và từ vựng, chuyển ngôi thứ nhất chính xác (con / ngài).\n\
  \nDẤU NGOẶC VÀ DẤU LƯỢC:\n- Dấu ngoặc kép và ngoặc đơn khớp 1:1 với Pāli root từng\
  \ khoá. Đoạn dẫn 4.1 mở ngoặc kép kép “ và kết thúc tại 11.6 đóng ”, các trích dẫn\
  \ lồng dùng ngoặc đơn ‘…’.\n- Dấu lược: 6 khoá có …pe… trong Pāli (6.2, 6.3, 6.5,\
  \ 7.3, 8.3, 9.3) chuyển thành đúng một dấu ‘…’ trần; tuyệt đối không bung văn xuôi.\
  \ Hai khoá 6.4 và 6.6 Pāli rỗng được điền tương ứng («Đây là hạng người thứ ba.»\
  \ và «Đây là hạng người thứ tư.») mà không thêm dấu lược thừa."
