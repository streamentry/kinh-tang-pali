notes:
  - >-
    Bài **định nghĩa** của cả chương: định nghĩa "sādhu" rồi mười bài sau lấy
    cặp `sādhu/asādhu` làm khuôn. Đây là bài duy nhất của chương có **đối thoại
    đầy đủ** (`paccassosuṁ` → "đáp lời Đức Thế Tôn", 143 segment tiền lệ) và là
    bài duy nhất **không lược** (`Taṁ suṇātha, sādhukaṁ manasi karotha,
    bhāsissāmī”ti.` đủ ba vế). Vì vậy `1.2` dịch đủ, còn mười bài khuôn dịch "…"
    theo lược.
  - >-
    Hai danh sách mười điều kiện ở `2.2` và `2.5` là **cùng Pāli với
    `an10.103:1.3` và `2.3`**, dùng lại nguyên văn. `micchāñāṇaṁ` → "tà trí"
    theo số đông, không theo `an4.206`.
  - >-
    **Lỗi chính tả trong bản Pāli đã ghim, tại `an10.134:2.5`:** `sammāvācā
    sammākammanto` — thiếu dấu phẩy giữa `sammāvācā` và `sammākammanto`. Dịch
    thành "chánh ngữ, chánh nghiệp" như danh sách ở `an10.103:2.3`; không sửa
    bản Pāli và không chú thích trong thân bản dịch.
  - >-
    `idaṁ vuccati` ở `an10.134` và `an10.136` dịch **"Điều này được gọi là, này
    các tỳ-kheo, …"** — cùng cách với `ayaṁ vuccati` chủ đạo trong corpus (40
    segment, so với 9 segment của `idaṁ vuccati` chưa có cách chủ đạo nào). Hai
    từ Pāli này cùng nghĩa "điều này", nên một cách dịch cho cả hai giữ chương
    nhất quán.
  - >-
    `sādhu` → **"lành"** (163 segment, 39 lần dịch "lành"; `dhp223` "lấy lành
    thắng không lành"). `Sādhuvagga` → **"Phẩm Lành"**.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
