notes:
  - "Giải quyết draft 2026-10-12: blocker cũ (3 khoá `an5.162:2.5`, `2.7`, `2.9`
    bị cho là có dấu lược `…` mà Pāli tại khoá không có) không còn căn cứ: bản
    dịch hiện hành không chứa dấu `…` ở bất kỳ khoá nào, và ba khoá đó dịch đủ
    nội dung Pāli (hạnh khẩu/thân không thanh tịnh; hạnh thân và khẩu không
    thanh tịnh mà thỉnh thoảng đạt được sự cởi mở và tịnh tín của tâm; cũng
    không thỉnh thoảng đạt được). Dấu lược `…` ở ba khoá ấy chỉ nằm ở tầng
    Sujato (ông lược các lặp lại 2.6, 2.8, 2.10), không phải ở bản Việt. Đã gỡ
    blocker. Không còn blocker nào khác: Sujato có bài này (độ phủ trên Pāli có
    nội dung khoảng 0,89, trên ngưỡng 0,80; các khoá Sujato để trống là 2.6,
    2.8, 2.10, 5.10, 8.2, 8.3, vốn là câu lặp công thức và đã đọc từ Pāli, tự
    đứng vững); tầng Việt hiện hành không có cho bài này (giới hạn tham chiếu
    của kho, không phải lỗi văn bản)."
  - "Đọc đối kháng toàn 66 khoá, sửa 31 khoá. Lỗi nghĩa thật (accuracy fix) ở 9
    khoá: 3.2 (`paṁsukūliko` bị dịch \"hạnh mặc y ráo\", sửa thành \"mặc y phấn
    tảo\", đúng tiền lệ 58 khoá Pāli có `paṁsukūlik-`; `nantakaṁ` thành \"mảnh
    giẻ rách\"; \"xoa trải\" không có trong Pāli, `pattharitvā` là \"trải ra\");
    4.4 (\"quét sạch\" nói quá `apaviyūhitvā`, nay \"gạt ra phía này phía nọ\"
    theo `iticiti`; \"hứng\" thành \"vốc\"); 5.2 và 5.5 (`gopade` là \"vết chân
    bò\", không phải \"trâu\", khớp `an7.66`, `mil6.3.2`); 5.6, 5.7, 5.8 (\"quỳ
    bốn gối\", \"cho cạn\" thêm nghĩa; `catukkuṇḍiko` là bốn chi chạm đất,
    `gopītakaṁ` là uống như bò uống; \"Bấy giờ ta hãy\" sai chức năng của
    `Yannūna`, nay \"Chi bằng ta hãy\"); 6.6 và 6.10 (thiếu `yeva` \"chỉ\" và
    `evarūpepi` \"đối với hạng người như vậy\"); 8.5 (`samantapāsādika`: \"gây
    hoan hỷ\" lệch, nay \"khả ái trọn vẹn về mọi mặt\"; `cittaṁ pasīdati` là
    \"tâm trở nên tịnh tín\"). Thuật ngữ/đồng bộ tiền lệ (terminology fix):
    `ghammābhitatto ghammapareto kilanto tasito pipāsito` thành \"bị nắng nóng
    thiêu đốt và hành hạ, mệt mỏi, khát và khô cổ\" (9/12 khoá trên tầng; 1 khoá
    `an5.194` còn dạng cũ, ngoài lát này); `ābādhiko dukkhito bāḷhagilāno` thành
    \"bị bệnh, khổ đau, bệnh nặng\" (đa số trên tầng); `patirūpaṁ upaṭṭhākaṁ`
    thành \"người chăm sóc thích hợp\" (bám Pāli `patirūpa`; 4 khoá `an3.22`
    dùng \"đúng khả năng\", không đổi vì ngoài lát); `gāmantanāyakaṁ` thành
    \"người dẫn đưa đến gần làng\"; `cetaso vivaraṁ cetaso pasādaṁ` thành \"sự
    cởi mở và sự tịnh tín của tâm\" (\"tín tĩnh\" không phải từ tiếng Việt
    chuẩn, chỉ 16 khoá trên tầng, trong khi \"tịnh tín\" có 905); `kālena kālaṁ`
    thành \"thỉnh thoảng\" (86 khoá so với 12 khoá \"thi thoảng\");
    `sevālapaṇaka` thành \"rong rêu và bèo\" (tiền lệ `sn46.55`); `supatitthā
    setakā` theo `mn40:13.1` (\"sạch\", \"bờ thoai thoải dễ xuống\"); `apāyaṁ
    duggatiṁ vinipātaṁ nirayaṁ` thành \"cõi dữ, ác thú, đọa xứ, địa ngục\" (77
    khoá, so với 32 dạng cũ); thêm `tasmiṁ samaye` (\"lúc ấy\") ở 8.1 và
    \"cũng\" ở 8.2–8.3 (`yāpissa`/`yampi`). Style: `rukkhacchāyāya` số ít
    (\"bóng cây\", bỏ \"những hàng cây\"), `sañchannā` là \"che phủ\" (bỏ \"bao
    quanh\"), bỏ \"tắm gội\" thành \"tắm\", `ogāhetvā` thành \"xuống\" (bỏ \"lao
    xuống\")."
  - "Số Pāli: không có số đếm lớn; \"năm cách trừ\" (`pañca`) và \"bốn chi\"
    (`catu-`) khớp. Pāli có `(…)` trần: không có khoá nào. `…pe…`: không có.
    Nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli từng khoá (5.4–5.7, 6.6–6.13,
    1.2–1.3, 2.1, 9.1)."
  - "Bất định còn lại: (1) `anuddayā` dịch \"lòng từ ái\" (tiền lệ trên tầng
    không thống nhất; `sn16.3` dùng \"độ lượng\"); (2) `samantapāsādikaṁ` dịch
    \"khả ái trọn vẹn về mọi mặt\" theo tiền lệ `pāsādika` = \"khả ái\" (127
    khoá), Sujato dịch \"impressive all around\"; (3) `setakā` dịch \"sạch\"
    theo `mn40`. Không đổi nghĩa giáo lý."
  - "Chấm lại 2026-10-12: semantic_fidelity 9.4→9.3 vì phát
    hiện và đã sửa 9 khoá nghĩa; terminology 9.3; triangulation 9.0 (có Sujato,
    không có Việt hiện hành); technical_integrity 10.0→9.6 vì lượt này không
    chạy cổng kỹ thuật: bốn lệnh `npm run validate`, `npm test`, `npm run
    check`, `npm run build` chưa chạy ở lượt này."
  - "Lịch sử: mục chấm 2026-09-13 (GLM-5.3 Flash, ZCode) và blocker `cắt ngắm`
    bị lượt này thay thế."
