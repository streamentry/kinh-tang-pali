notes: |-
  **Giải quyết draft 2026-10-12.** Blocker cũ ("cắt ngắm — 3 khoá `…` mà Pāli không có, khoá
  `1.5`, `1.6`, `1.7`", ghi 2026-09-13) đã gỡ vì không còn đúng với bản dịch hiện tại: cả ba khoá
  được dịch đủ theo Pāli (`attanā ca samādhisampanno hoti, samādhisampadākathāya ca āgataṁ pañhaṁ
  byākattā hoti;` v.v. cho định, tuệ, giải thoát), không khoá nào mang dấu lược. Dấu lược duy nhất
  của bài là ở `1.1`, nơi Pāli có `…pe…` và bản Việt ghi đúng một `…`. Mầm của blocker nằm ở bản
  Anh Sujato: các khoá `1.5`–`1.7` của Sujato tự rút gọn bằng `…` sau mệnh đề đầu; Pāli ở ba khoá này
  được viết đủ, và bản Việt theo Pāli, không theo Sujato.
  **Đọc đối kháng 13 khoá từ Pāli:** không có lỗi nghĩa. Một sửa thuật ngữ: hô cách `āvuso` do Tôn giả
  Sāriputta nói với các tỳ-kheo (`1.2`, `1.4`, `1.9`) từ "này các bạn" thành "này các hiền giả", theo
  glossary (`āvuso` ưu tiên `hiền giả`; `bạn` chỉ cho ngoại đạo/thế tục) và theo `an5.163` cùng
  nhóm Sāriputta; "này các bạn" chỉ còn 74 lần so với 413 "này các hiền giả" + 248 "này hiền giả"
  trong tầng AN. `alaṁsājīvo sabrahmacārīnaṁ` = "đủ tư cách đồng sống với các đồng phạm hạnh",
  khớp nguyên văn `an5.66` (cùng câu Pāli, chỉ khác hô cách); `sīlasampadākathāya … āgataṁ pañhaṁ
  byākattā` = "khéo giải đáp câu hỏi nảy sinh khi hỏi luận về sự viên mãn giới", khớp `an5.163`
  `2.3`–`2.7` (thuật ngữ `kathā` = "hỏi luận" của nhóm này). Tiêu đề "Kinh Đồng Sống" khớp `an5.66`.
  Số khoá lỗi nghĩa thật: 0/13; khoá đổi chữ: 3/13 (`1.2`, `1.4`, `1.9`, chỉ hô cách).
  **Tham chiếu:** bản Anh Sujato có đủ bài, phủ cả 10 khoá nội dung (khoá `1.5`–`1.7` rút gọn bằng `…`,
  công thức hiển nhiên từ `1.4` và `1.8`); `triangulation` hạ 9,0 → 8,8 vì ba khoá đó không cho đối
  chiếu độc lập. Tầng `vietnamese-current` không có cho bài này (tầng ấy chỉ phủ Pháp Cú), chỉ là
  giới hạn tham chiếu, không phải lỗi văn bản.
  **Kỹ thuật:** `technical_integrity` 9,6; chưa chạy `npm run validate` · `npm test` · `npm run check` ·
  `npm run build` trong lượt này.
