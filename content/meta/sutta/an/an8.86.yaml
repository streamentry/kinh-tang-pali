notes: |-
  Phủ đủ 65/65 khoá Pāli, thứ tự khoá đúng Pāli, không khoá thừa.
  Coverage English đo thật: 53/53 đoạn Pāli có nội dung (từ 40 ký tự) đều
  có bản Sujato đã ghim; không cần lớp english-project. Bản Việt hiện hành
  phân đoạn không có cho bài này (Bilara chỉ có Pháp Cú); bản Hòa thượng
  Thích Minh Châu nguyên bài (không phân đoạn) chỉ được đọc làm tra cứu
  toàn văn, không cấp text cho khoá nào; triangulation 9.2 vì lẽ đó.
  Hai bản song song gần nhất đã publish được dùng làm tiền lệ: an6.42 (cùng
  khuôn Nāgita/Icchānaṅgala) và an5.30. Pāli
  trùng nguyên văn với bài khác: 37 khoá, 840 cặp đã dò; dùng lại nguyên
  văn 34 khoá, khác có chủ ý 3 khoá (2.6, 4.1, 3.4, xem dưới). Trong chính
  bài có 6 nhóm Pāli trùng nguyên văn (2.6=4.1; 2.7=4.2; 5.3=6.3=7.3;
  6.2…11.2 sáu khoá; 8.4=12.4; 9.4=10.4=11.4=13.3), 0 nhóm bản Việt khác nhau.
  Dấu lược: 1.6 Pāli có …pe…, Việt một dấu …; các khoá khác không có.
  Nháy đơn/kép khớp Pāli từng khoá (65/65). Không có số lượng nào trong bài
  (không có số Pāli để tính); số thứ tự 8.86 ở 0.1 giữ nguyên.

  Thuật ngữ, kèm tiền lệ:
  nekkhamma/paviveka/upasama/sambodha-sukha → lạc xuất ly/viễn ly/an tịnh/
  chánh giác (an6.42:2.6). nikāmalābhī akicchalābhī akasiralābhī → đạt được
  tùy ý, không khó khăn, không mệt nhọc; nikāma = tùy ý theo Pāli, hai vế sau
  theo an6.42:2.6; an3.63 dịch vế ba là không thiếu thốn (8 khoá) nên đây là
  điểm lệch giữa hai tiền lệ, chọn an6.42 vì cùng khuôn. mīḷha/middha/lābha-
  sakkāra-siloka-sukha → lạc bẩn thỉu/uể oải/của lợi dưỡng, tôn kính và danh
  vọng (an6.42:2.7). middhasukha ở 7.1 là thú vui ngủ nghỉ (an5.206, an9.72,
  an10.14, 3 khoá cùng khuôn seyya/passa/middha-sukha): hai chữ khác nhau vì
  đi theo từng tiền lệ riêng, không phải sót. yasa → danh vọng. riñcati →
  bỏ quên (10 khoá toàn tầng, an5.90…) thay vì bỏ bê (an6.42:9.2, 2 khoá);
  paṭisallāna → sự độc cư. araññavanapatthāni pantāni senāsanāni → các chỗ ở
  thanh vắng nơi núi rừng hoang dã theo an6.42:9.2 (cùng khuôn); toàn tầng
  có nhiều cách (xa vắng nơi rừng sâu 37 khoá, chỉ ở mn4). gāmantavihārī →
  sống nương chốn làng mạc (an6.42, 8 khoá). nikāmayamāno → khao khát (an6.42
  dịch tham đắm). Tên bài Yasasutta → Kinh Danh Vọng theo tên Pāli; Sujato
  đặt With Nāgita, an6.42 là Kinh Nāgita. Tên phẩm Sativagga → 9. Phẩm Niệm
  (9 khoá 0.2 ở an8.81…an8.85 đã dịch giống hệt).

  Chỗ lệch có chủ ý so với tiền lệ trùng Pāli: (a) 2.6 và 4.1 (Māhaṁ,
  nāgita, yasena samāgamaṁ…): hai tiền lệ (an6.42 và an5.30) tự lệch nhau
  2:2; chọn dạng nguyện/cầu mong để giữ thức mệnh lệnh mā…samāgamaṁ, không
  chép dạng khẳng định của an6.42. (b) 3.4: pavattanti là hiện tại nên dịch
  nước chảy, không dịch sẽ chảy như an6.42:3.4.

  Bất định, đã phân xử:
  (1) 5.2: Pāli là tumhākampi … viharataṁ evaṁ hoti, không có mayhaṁ như ở
  6.2, 7.2. Chủ thể suy nghĩ lấy là Đức Thế Tôn (Ta), vì lời trong 5.3 nói
  yassāhaṁ (ngôi một) và gọi các Tôn giả ở ngôi ba; Sujato đọc như vậy; bản
  Thích Minh Châu nguyên bài cũng ghi Ta suy nghĩ. Nếu đọc là các tỳ-kheo
  nghĩ thì 5.3 không nói được yassāhaṁ.
  (2) 11.3: avimuttaṁ cittaṁ vimuccissati là dạng bị động/tự động, khác
  vimocessati (nhân quả) ở an6.42:8.3. Dịch sẽ được giải thoát, nhưng chủ
  ngữ giữ ở tâm của vị tôn giả; Sujato dịch free ở dạng nhân quả.
  (3) 8.3: Taṁ tamhā samādhimhā cāvessati (sau dấu chấm) không nêu chủ ngữ;
  hiểu là người làm công hoặc sa-di, như an6.42:5.3 và Sujato.
  (4) saṅgaṇikavihāra (5.2, 5.4) chưa có tiền lệ chính xác (an5.78 dịch
  sống chen chúc cho saṅgaṇikavihāro hoti ākiṇṇavihāro; saṅgaṇikārāmatā là
  ham thích quần chúng, 4 khoá). Chọn cảnh giao du đông đúc theo Sujato
  (enjoy each other's company), không thêm nghĩa.
  (5) 2.7/4.2/5.1: nayimassa = na + imassa; assa/assu là thức khả năng; dịch
  không đạt được, không thêm ai không thể.
  (6) 3.1: adhivāsetu = nhận lời (an6.42:3.1), cùng nghĩa với
  Sujato relent; không thêm nội dung giải thích.
  Câu Pāli nghĩa đen không mâu thuẫn văn cảnh ở đâu; mọi chỗ trên đều khớp
  Sujato và an6.42.

  technical_integrity 9.6 vì agent lát không được chạy cổng; chưa chạy
  npm run validate, npm test, npm run check, npm run build. Đã đối chiếu
  khoá, nháy đơn/kép, dấu lược, NFC, khoảng trắng.
