notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit đã ghim. Đủ 72/72 khoá, thứ tự khoá đúng thứ tự Pāli.
  **Coverage Anh Sujato trên Pāli có nội dung (≥ 40 ký tự, bỏ khối đánh số `:N.0`): 32/32 = 100%.**
  Sujato chỉ im lặng đúng 1 khoá, `an10.62:8.5` (`Dutiyaṁ.`, 8 ký tự) — ngắn hơn 40 ký tự nên không nằm
  trong mẫu số, và đó là lý do khoá này vắng bản Anh. Không có khoá nào trong tập lấp, nên lớp `english-project`
  không có tệp cho bài này và `content/meta/en/an/an10.62.yaml` không tồn tại, không cần tạo. Vì không có lớp lấp,
  không có chuyện bản Anh và bản Việt cùng một người chấm; coverage 100% là của Sujato độc lập.
  Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ phân phối Pháp Cú tiếng Việt), nên không có bản Hòa thượng
  Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót
  của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **Khoá dùng lại nguyên văn từ tầng (Pāli trùng nguyên văn):** đã dò 3 khoá Pāli có bản trùng ở bài khác —
  `0.2` (`7. Yamakavagga` → *7. Phẩm Song Trùng*, 6/6 bản), `8.5` (`Dutiyaṁ.` → *Thứ hai.*, 270/274 khoá; 2 khoá
  *Bài thứ hai.*), `0.3` (`Taṇhāsutta`, 8 khoá trong tầng: *Kinh Khát Ái* 3 — `an6.106`, `sn18.8`, `sn27.8`;
  *Kinh Tham Ái* 2; *Kinh Tham Dụ* 1; *Kinh Khát Ái Người Đan Lưới* 1 — tôi theo dạng đa số *Khát Ái*). Trong 3 cặp,
  chỉ `0.3` có bản Việt khác nhau giữa các bài (vì khác kinh, tên kinh gọi theo ngữ cảnh từng bài).
  **Cặp Pāli trùng nguyên văn TRONG CHÍNH BÀI: 2 cặp, 0 cặp bản Việt khác.** `3.2` = `5.2` (`evametissā
  bhavataṇhāya āhāro hoti, evañca pāripūri.`) và `4.2` = `8.2` (`evametassa mahāsamuddassa sāgarassa āhāro hoti,
  evañca pāripūri.`); bản Việt hai bên giống nhau từng chữ. Hai khoá `3.1` và `5.1` khác Pāli ở chỗ mở đầu
  (`Iti kho` / `Evamevaṁ kho`) nên bản Việt khác đúng chỗ đó (*Như vậy* / *Cũng vậy*), phần chuỗi còn lại giống hệt.
  **Hai khoá `…pe…` ở `8.1` và `8.3` → đúng một `…`** (lược của Pāli, không mở rộng). Cổng cân bằng dấu lược: 72/72 khoá
  khớp Pāli; nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá 72/72 (khoá `1.1` mở `“` và không đóng — đúng
  Pāli, lời kinh đóng ở `8.4`).
  **Bài không có số lượng lớn hay cụm số chưa phân xử được**; các số có mặt chỉ là *năm* (`pañca nīvaraṇā`), *ba*
  (`tīṇi duccaritāni`, `tīṇi sucaritāni`), *bốn* (`cattāro satipaṭṭhānā`), *bảy* (`satta bojjhaṅgā`) — đối chiếu trực
  tiếp với Pāli từng khoá, 0 lệch.
  **Thuật ngữ — mọi số dưới đây là số ĐẾM trên tầng Việt dự án.**
  `bhavataṇhā` → *hữu ái* (33 so với *ái hữu* 3). `avijjā` → *vô minh* (463 lần trong 461 khoá có Pāli `avijjā`, so với *không hiểu biết* 9). `nīvaraṇa` → *triền cái* (219
  khoá, *năm triền cái* 46/51). `duccarita` → *ác hạnh* (217; *hạnh xấu* 9; trong `an` 133 so với 9) và `sucarita` → *thiện
  hạnh* (147). `ayonisomanasikāra` → *tác ý không như lý* (10; *không như lý tác ý* 5), `yoniso…` → *như lý*. `bojjhaṅga` →
  *giác chi* (830) · `satipaṭṭhāna` → *niệm xứ* (300) · `saddhā` → *lòng tin* (229; *tín* 156; *niềm tin* 85) ·
  `vijjāvimutti` → *minh và giải thoát* (17; *minh giải thoát* 4) · `satisampajañña` → *chánh niệm và tỉnh giác* (11,
  `an8.81`). `saddhammassavana` → *nghe Chánh pháp* (15/18 khoá; *nghe diệu pháp* 3). `asaddhamma` → *pháp phi Chánh pháp*
  (`an4.44`, 2 khoá) / *pháp không phải Chánh Pháp* (`an4.22`). `indriyasaṁvara` → *phòng hộ các căn* (28; *thu thúc các
  căn* 10, trong đó `an6.50` — cùng khuôn thiếu/đủ điều kiện nền tảng — dùng *thu thúc*; trong `an` là 15 so với 9; tôi
  theo đa số *phòng hộ*). `asappurisa` → *phi thiện nhân* (`an2.134/135`, `an5.150`).
  **Bất định đã ghi, không đưa vào thân kinh.**
  (1) `āhāra` / `sāhāra` / `anāhāra` → *thức ăn* / *có thức ăn* / *không có thức ăn* (*thức ăn* 17, *dưỡng* 11, *nguồn nuôi*
  1 trong 22 khoá tầng; Sujato *fuel*). Đây là *nguồn nuôi dưỡng, điều kiện duy trì*, không phải thức ăn theo nghĩa đen;
  giữ *thức ăn* để nhất quán với tầng, người biên tập có thể cân nhắc *chất nuôi* (`sn22.54`).
  (2) `idappaccayā` ở `1.2` → *do điều kiện cụ thể*, theo `idappaccayatā` → *tính điều kiện cụ thể* (`sn12.20`) và Sujato
  *specific condition*; tầng còn có *do lý do này* (`sn46.4`). Hai cách đều giữ được; câu sau (`2.1` trở đi) làm rõ điều
  kiện ấy là gì nên không có nguy cơ hiểu sai nghĩa kinh.
  (3) `asatāsampajañña` (`2.15`, `2.17`) — Pāli tách `asatā sampajaññassa` ở `2.17`; tôi hiểu *không có cả niệm lẫn tỉnh
  giác* và dịch *sự không có chánh niệm và tỉnh giác* (đối xứng với *chánh niệm và tỉnh giác* ở `6.15`), khớp Sujato
  *lack of mindfulness and situational awareness*. 0 tiền lệ trong tầng cho đúng dạng `asatāsampajañña`.
  (4) `sappurisasaṁseva` → *thân cận bậc thiện nhân* (*thân cận bậc chân nhân* 4 khoá, *phục sự thiện nhân* 6 khoá;
  tôi chọn *thân cận* vì rõ nghĩa hơn với người đọc hiện đại; đây là lựa chọn văn phong, không phải khác nghĩa Pāli).
  (5) `paripūra` → *viên mãn* (203 khoá) cho cả chuỗi bất thiện lẫn chuỗi thiện, để giữ đúng sự song song của Pāli
  (`paripūro … paripūreti`; Sujato *fulfilled / fulfills*); ở ví dụ nước dùng *lấp đầy / được đầy* theo `sn55.38:1.1` và
  `an3.95:6.1` (cùng Pāli, dùng lại nguyên văn), riêng `pāripūri` ở `4.2`/`8.2` dịch *sự đầy lên* vì chủ thể là nước.
  (6) `mahāsamuddaṁ sāgaraṁ` có 0 khoá tiền lệ trong tầng; dịch *đại dương, biển cả* (Sujato *the ocean*). Ở `4.1` các
  từ `kusobbha / mahāsobbha / kunnadī / mahānadī` theo `sn55.38:1.1`/`an3.95:6.1` (*hồ nước / đầm lớn / suối / sông lớn*);
  `an4.147:2.1` dịch khác (*vũng lầy / hồ lớn / dòng suối / dòng sông lớn*) — hai nhóm tiền lệ cùng tồn tại trong
  tầng; tôi theo nhóm trùng Pāli nguyên văn.
  (7) `ito pubbe` ở `1.1` → *trước điểm này* và `samabhavī` → *sinh khởi*: Sujato *before which … afterwards it came to
  be*; không ảnh hưởng giáo nghĩa.
  (8) Hậu tố `-pi` trong `Bhavataṇhampāhaṁ`, `Avijjampāhaṁ`… dịch *cũng* ở mọi khoá để giữ cấu trúc lặp; Sujato bỏ.
  **Tên phẩm và tên kinh — đã tra tiền lệ trước khi viết.** `0.2` → *7. Phẩm Song Trùng* theo 6/6 bản; `0.1` →
  *Kinh Tăng Chi Bộ 10.62* theo đa số khoá `0.1` của tầng `an` (924 so với 401 khoá viết *Aṅguttara Nikāya* trong `an`, cùng cách
  `an10.66`/`an10.69`).
