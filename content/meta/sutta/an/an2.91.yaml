notes: |-
  Ba khoá công thức 1.1/1.2/1.4 có Pāli giống hệt bài anh em đã published nên dùng lại nguyên văn: Có hai loại pháp, này các tỳ-kheo. / Thế nào là hai? / Này các tỳ-kheo, đây là hai loại pháp. (an2.163, an2.168, an2.169, an2.176, an2.177).
  Khoá 1.3: bhavadiṭṭhi và vibhavadiṭṭhi thành quan điểm về hữu và quan điểm về phi hữu. 0 tiền lệ trực tiếp cho cặp này nên terminology chỉ 9.0. Lý do từng phần: diṭṭhi thành quan điểm (tiền lệ mn11 hai loại quan điểm); vibhava thành phi hữu (tiền lệ cụm phi hữu trong tầng Việt); Sujato đọc là Views favoring existence and views favoring nonexistence. Không dùng chữ tà kiến vì Pāli chỉ nói diṭṭhi, không gắn micchā.
  Bản Anh Sujato đã ghim có đủ mọi khoá của bài; tầng Việt hiện hành không có Tăng Chi Bộ (bilara chỉ chứa Pháp Cú) nên đối chiếu Pāli + Anh.
  Tiêu đề Kinh Quan Điểm Về Hữu là tên mô tả do người biên tập đặt; 0 tiền lệ, ghi rõ ở đây.
  Không có blocker; điểm trung bình số học thô 9.44 nên published.
