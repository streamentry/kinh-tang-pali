notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 29/29 = 100%**, không khoá nào bị bỏ trống, không cần ghi nhận gap. Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708: bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **10 khoá có Pāli trùng nguyên văn ở bài khác (283 cặp); 8 cặp dùng lại NGUYÊN VĂN.** `0.3` theo 9/11 bản cho `Ānandasutta` (Kinh Ānanda) · `0.2` theo `an9.32` · `1.1` trùng 3 bản theo `an3.72:1.1` · `1.2` trùng byte-for-byte `an4.170:1.3` · `2.1` trùng byte-for-byte `an11.7:10.1` · `3.1` trùng byte-for-byte `an3.80:9.4` · `8.6` theo 241/246 bản cho `Chaṭṭhaṁ.`
  **2 khoá cố ý dịch khác, cùng lý do như an11.4.** `1.3` (`āvuso bhikkhave`) trùng 12 bản và `1.4` (`Āvuso'ti …`) trùng `an4.170:1.5`; tôi đặt *hiền giả* cho cả hai để khớp `an11.4` trong cùng lát, thay vì *này các bạn* hay *Kính bạch Tôn giả*.
  **Công thức ba tầng `āyatana` dùng lại nguyên văn của `an3.116`.** `4.2` theo `an3.116:1.3`, `5.1` theo `an3.116:2.1`, `6.1` theo `an3.116:3.1`: *vượt hoàn toàn mọi tưởng về sắc, với sự đoạn tận các tưởng về đối nghịch, không tác ý đến các tưởng về đa dạng, với ý niệm … chứng và an trú ở xứ vô số …*. Nhờ vậy `ākāsānañcāyatana` → xứ vô số hư không, `viññāṇañcāyatana` → xứ vô số thức, `ākiñcaññāyatana` → xứ vô sở hữu đều khớp tiền lệ đã công bố.
  **Thuật ngữ.** `saññī` → có tưởng, `asaññī` → không có tưởng (`an4.190:6.2` dùng *có tưởng*) · `paṭighasaññāna` → các tưởng về đối nghịch (`an3.116:1.3`) · `phoṭṭhabbā` → sự xúc chạm · `āvuso` → hiền giả (1.873 tiền lệ) · `isattva` → Sāketa (theo Sujato).
  **Bất định đã ghi, 0 tiền lệ.** (1) `sasaṅkhāraniggayhavāritagato` (`7.3`, `8.2`) — tôi dịch *bị hãm chế bởi sự cố gắng siết chặt*; `sasaṅkhāra` là cố gắng mạnh, `niggayha` là hãm chế, `vārita` là bị chặn. Sujato đọc là *not held in place by forceful suppression*; chỗ này còn có thể đọc thành *bị chặn bởi sự thu thúc cưỡng bức*. (2) `ñāyassa adhigamāya` (`2.2`) tôi dịch *thấy rõ con đường*; Sujato dịch *discover the system*, nên `ñāya` ở đây có thể là *chánh pháp* hơn là *con đường*. (3) `sākete` trong Pāli đã ghim (chỉ có `isattva` ở bản Anh) — tôi theo Pāli và viết Sāketa. (4) `añjanavana` không có tiền lệ, tôi giữ là *rừng Anjana*.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
