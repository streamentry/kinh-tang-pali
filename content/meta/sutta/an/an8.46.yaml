notes: |-
  **Phạm vi và nguồn.** 79/79 khoá, thứ tự khoá = thứ tự Pāli, không khoá nào ngoài tập Pāli. Pāli root đã ghim là authority. Đối chiếu: English Sujato đã ghim, bản Việt cùng phẩm `an8.47`, `an8.48`, `an8.49` và `an5.33` (cùng nhóm nữ nhân sinh về chư thiên Manāpa). Tầng `vietnamese-current` vắng ở cột (chỉ có Pháp Cú); bản nguyên bài Hòa thượng Thích Minh Châu của SuttaCentral được dùng để tra cứu nghĩa, không dựng thành cột.

  **Coverage Anh: 34/51 = 0.667, dưới sàn 0.80 ⇒ draft.** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối tham chiếu `:0`) = 51. Sujato phủ 34; để trống 17 khoá `6.1–6.7, 6.9, 6.10, 7.2, 7.4, 7.5, 8.1–8.4, 9.1` (đoạn Anuruddha kể lại với Đức Phật). Chưa có tệp `english-project` cho bài này, nên không có lớp lấp nào để cộng thêm (và nếu có thì do cùng một tay làm cũng không phải đọc Anh độc lập). Vì vậy blocker nêu ở `blocking_errors` là đúng cổng, `triangulation` chấm 7.0 (chỉ đối chiếu Anh độc lập được 34/51 khoá; 17 khoá kể lại này là lặp lại gần nguyên văn các khoá `1.3–5.2`, nên Pāli tự đứng vững, nhưng không phải là đối chiếu độc lập). Không nâng điểm để né blocker.

  **Tiền lệ và Pāli trùng nguyên văn.** Trong chính bài: 7 nhóm Pāli trùng nguyên văn (`1.5`=`6.4`, `1.6`=`6.5`, `1.7`=`6.6`, `2.1`=`3.1`, `4.2`=`8.2`, `4.3`=`8.3`, `6.8`=`7.1`), cả 7 Việt giống nhau, 0 nhóm Việt khác. Toàn tầng: 34 khoá có Pāli trùng nguyên văn với bài khác; 29 khoá dùng lại nguyên văn bản đã có (`0.2`, `0.3`, `1.1`, `6.8`, `7.1`, `10.2`, `11.1`, `11.2`, `15.1`, `16.1`, `17.1`, `17.2`, 16 dòng kệ `19.1–22.4`, `22.5`); 5 khoá khác tiền lệ: `2.1`, `3.1` chỉ khác chữ phiên âm tên (`Anuruddha` so với "A-na-luật-đà" ở sn6.5); `12.1`, `13.1`, `13.2` khác `an8.48`/`an8.49` có chủ ý (xem dưới). Mười sáu dòng kệ giữ đúng chữ của `an8.47`/`an8.48` (kể cả `”` ở `22.4`).

  **Thuật ngữ.** (a) `manāpakāyikā devatā` / `manāpakāyikānaṁ devānaṁ` → "vị thiên Manāpa" / "chư thiên Manāpa": theo `an8.47` và `an8.48` (4/4 khoá có cụm này đều là "chư thiên Manāpa"); cụm `-kāyika` không dịch riêng, đồng bộ với tiền lệ; Sujato dịch "Agreeable Host", Hòa thượng Thích Minh Châu "thân khả ái". `an5.33:8.4` dịch thành "Thiên Tự Tại Vui Vẻ" (1 khoá) — lệch với ba bài cùng nhóm; người biên tập nên phân xử. (b) `devatā` → "vị thiên" (đa số, an2.36, an3.70, sn1.31…). (c) `vaṇṇa` → "dung sắc" ở `1.5/6.4` và `nīlavaṇṇā` → "dung sắc xanh" để cùng một chữ cho hai chỗ; tiền lệ khác có "sắc xanh" (dn16, dn34) và "da màu xanh" (an5.195). (d) `uposatha`-vagga: "5. Phẩm Giữ Trai" theo cả phẩm. (e) `0.1` dùng dạng "Kinh Tăng Chi Bộ 8.46" (dạng đa số của tầng); `an8.47` còn giữ "Aṅguttara Nikāya 8.47" — lệch tiền lệ cục bộ, không đổi nghĩa.

  **Khác tiền lệ có chủ ý, vì sát Pāli hơn.** (1) `12.1` `uṇṇāti vā kappāsāti vā`: `uṇṇā` là len, `kappāsa` là bông vải; `an8.48`/`an8.49` dịch "dệt len hay may vá" (theo cách Sujato "knitting and sewing"), bản này dịch "việc làm với len hay với bông vải", không thêm động từ dệt hay may. `tatrupāyāya vīmaṁsāya … alaṁ kātuṁ alaṁ saṁvidhātuṁ` theo dn33/dn34 ("có sự suy xét về phương cách thích hợp, đủ sức làm, đủ sức sắp xếp"). (2) `13.2` `khādanīyaṁ bhojanīyañcassa paccaṁsena saṁvibhajati`: `khādanīya`/`bhojanīya` dịch "đồ ăn cứng và đồ ăn mềm" (an6.42, an8.86, mn82…) thay vì "đồ ăn sống, đồ ăn chín" ở `an8.48`/`an8.49`; `paccaṁsena` dịch "theo phần của họ", không dùng "tử tế và công bằng" vì Pāli không có hai chữ ấy. `gilānakānañca balābalaṁ jānāti` dịch "biết người bệnh mạnh hay yếu" (gần "ai khoẻ hay yếu" của an8.48).

  **Bất định của chính nguồn, ghi lại chứ không sửa thân kinh.** (a) `4.3` `tāsaṁ devatānaṁ alaṅkārānaṁ saddo`: nghĩa đen là "tiếng của những đồ trang sức của các vị thiên ấy"; Sujato dịch thành "the performance by those deities", Hòa thượng Thích Minh Châu "nhạc của các Thiên nữ khéo trang điểm". Bản này giữ nghĩa đen "tiếng của những trang sức nơi các vị thiên ấy", không quyết là nhạc hay chỉ tiếng trang sức; chưa phân xử được. (b) `4.1` `accharaṁ vādesi`: dịch "búng ngón tay" (Sujato "snapped her fingers"); Hòa thượng Thích Minh Châu "vỗ tay". (c) `4.4`/`8.4` `indriyāni okkhipi`: dịch "thu nhiếp các căn" (Sujato "averted his senses", Hòa thượng Thích Minh Châu "nhiếp phục"); `okkhipi` có thể là "hạ xuống, thu lại", không phân xử thêm. (d) `5.1`/`9.1` `na khvayyo anuruddho sādiyati`: `sādiyati` là "thọ nhận, thích thú"; dịch "không thích thú" (Sujato "isn’t enjoying this"; Hòa thượng Thích Minh Châu "không có thưởng thức"). (e) `14.1` Pāli root đã ghim chỉ có `dhanaṁ vā dhaññaṁ vā jātarūpaṁ vā` (tiền của, lúa gạo, vàng); thiếu `rajataṁ` (bạc) mà `an8.48`, `an8.49`, `an5.33`, Sujato và bản nguyên bài Hòa thượng Thích Minh Châu đều có. Pāli thắng nên dịch ba món, không thêm "bạc". `adhuttī athenī asoṇḍī avināsikā` dịch "không tiêu phá, không lấy cắp, không hoang phí, không để mất" theo đúng chữ của `an5.33`, `an8.48`, `an8.49` (Pāli gốc nghĩa đen "không phải kẻ lừa lọc/cờ bạc, không phải kẻ trộm, không phải kẻ nát rượu, không phải kẻ phá hoại" — cách đọc ở đây là tiền lệ đã có, chưa phân xử độc lập). (f) `10.3` `yassa mātāpitaro bhattuno denti … tassa hoti`: đọc `yassa` là của người nữ, `tassa` là người chồng, như `an8.48:2.3`. (g) `16.2`: năm điều kiêng giữ đúng thứ tự Pāli (sát sinh, trộm, tà hạnh trong các dục, nói dối, rượu men rượu nấu), theo `iti74`. (h) Từ "ba điều" cho `tīsu ṭhānesu` (Sujato "three things"); Hòa thượng Thích Minh Châu "ba địa hạt".

  **Số Pāli đã tự tính.** `tīsu ṭhānesu` = 3 (`vaṇṇa`, `sara`, `sukha` — đủ ba ở `1.5–1.7` và `6.4–6.6`). `pañcaṅgikassa tūriyassa` = nhạc cụ có năm phần, "dàn nhạc năm loại" (dn17). `aṭṭhahi dhammehi` = 8: đếm đủ trong bài `10.3` (1), `11` (2), `12` (3), `13` (4), `14` (5), `15` (6), `16` (7), `17` (8); `10.1`, `10.2` và `18.1` đều nói tám. Màu: `nīla` xanh, `pīta` vàng, `lohitaka` đỏ, `odāta` trắng; Pāli `3.2` và `7.2` có `…pe…`, `3.3` có `…` trần, `7.3` có `…pe…`, đúng số dấu lược từng khoá.

  **Dấu lược.** `3.2` (`…pe…`), `3.3` (`…` trần), `7.2` (`…pe…`), `7.3` (`…pe…`) → mỗi khoá đúng một ` …`; Pāli không có `…` thì Việt không có. Cân bằng Pāli từng khoá 79/79.

  **Kiểm kỹ thuật.** Đã tự kiểm: tập khoá Việt = tập khoá Pāli 79/79; nháy đơn ‘’ và kép “” khớp Pāli từng khoá 79/79; dấu lược cân bằng 79/79; NFC; không khoá rỗng; không Pāli lọt sang Việt; đã in cặp Pāli↔Việt từng khoá để đọc đối kháng. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` nên `technical_integrity` đặt 9.6 và không tuyên bố technical gate đã pass.

  **Giải quyết draft 2026-10-12.** Đọc đối kháng lại cả 79 khoá với Pāli root đã ghim, đối chiếu `an8.47`, `an8.48`, `an8.49`, `an8.50`, `an5.33`, `dn17`, `mn58`, `sn54.9`. Thay thế mục "Coverage Anh … ⇒ draft" ở trên và dòng "Vì vậy blocker nêu ở `blocking_errors` là đúng cổng": blocker độ phủ Anh đã được gỡ, lý do bên dưới. Điểm cũ 9.11 thay bằng 9.13.
  (1) **Blocker độ phủ tiếng Anh (loại B) — gỡ.** Sujato để trống 17 khoá Pāli có nội dung (`6.1–6.7, 6.9, 6.10, 7.2, 7.4, 7.5, 8.1–8.4, 9.1`) vì đó là đoạn Anuruddha kể lại với Đức Phật. Đã đọc kỹ từng khoá từ Pāli: `6.1`, `6.2`, `6.8`, `6.9`, `6.10`, `7.1`, `7.2`, `7.4`, `7.5`, `8.1`, `8.4`, `9.1` lặp `1.2–5.2` chỉ đổi ngôi (`maṁ`, `mama cittamaññāya`, `okkhipi`, `khvāhaṁ`); `6.3–6.7` và `8.2–8.3` trùng nguyên văn `1.4–1.8` và `4.2–4.3`; không khoá nào còn nghĩa chưa chắc. Các khoá này tự đứng vững từ Pāli và từ các khoá song song cùng bài đã được đối chiếu với Sujato. Theo quy tắc của kho, mất mát tầng Anh ở đây chỉ cần được ghi nhận ở danh mục khoảng trống tham chiếu, không cần lấp. Giới hạn vẫn còn: 17/51 khoá không có đọc Anh độc lập, nên `triangulation` giữ 7.0 (không nâng).
  (2) **Tầng `vietnamese-current` (loại C).** Tầng này vắng ở bài này (chỉ có Pháp Cú); chỉ là giới hạn tham chiếu, không phải lỗi văn bản. Bản nguyên bài chỉ để tra cách đọc.
  (3) **Sửa bản dịch (accuracy/clarity).** `1.5`, `1.6`, `1.7`, `6.4`, `6.5`, `6.6`: bỏ chữ "liền" ở "thì liền có được". `ṭhānaso` đã dịch "ngay tại chỗ" (đúng tiền lệ `mn58:10.8`, `mn58:11.3`, `sn54.9:7.1`), nên "liền" là thêm nghĩa và lặp; Pāli chỉ có `tādisakaṁ … paṭilabhāma … ṭhānaso`. `17.2`: "Vị ấy sống tại gia…" → "Nàng sống tại gia…" vì Pāli `Cāgavatī` nói về người nữ, nhất quán với `Nàng` ở `15.1`, `16.1`; khác `an8.47:3.2` (còn "Vị ấy"), không đổi nghĩa.
  (4) **Giữ nguyên, đã đo tiền lệ.** Các khoá kệ `19.1–22.4` trùng nguyên văn `an8.47:4.1–7.4` và `an8.48:11.1–14.4` (16/16 khoá, 0 khoá Việt khác): giữ. `20.4` `paṭipūjeti paṇḍitā` là chủ ngữ giống cái ("người nữ trí") nhưng bản kệ chung dịch "bậc trí đều tôn kính", không sai nghĩa, giữ để thống nhất ba bài. `22.3` "Được gọi là Manāpa, chư thiên," giữ như hai bài kia. `4.2` dùng đúng chuỗi `dn17:1.6.11` ("dàn nhạc năm loại được luyện kỹ, đánh nhịp khéo … du dương, hấp dẫn … mê say"), thêm `kamanīyo`→"đáng ưa", `pemanīyo`→"dễ mến". `10.3` (`atthakāmā hitesino` → "mong lợi ích, tìm hạnh phúc") giữ theo `an8.47:2.3`, `an8.48:2.3`.
  (5) **Bất định còn lại (không phải blocker).** `14.1` `adhuttī athenī asoṇḍī avināsikā` dịch theo cách đọc đã có ở `an8.48`, `an5.33` chứ chưa phân xử độc lập từ nghĩa gốc (`dhutta` kẻ lừa lọc/cờ bạc, `soṇḍī` kẻ nát rượu); `4.3` `alaṅkārānaṁ saddo`; `4.4`/`8.4` `okkhipi`; Pāli thiếu `rajataṁ` ở `14.1` (đã ghi ở trên). Các điểm này không đổi giáo nghĩa, được ghi để người biên tập biết, nên `ambiguity_integrity` giữ 9.0.
  (6) **Số khoá.** Lỗi nghĩa thật/lệch tiền lệ: 7/79 (6 khoá `liền` + 1 khoá `Vị ấy`); 72 khoá còn lại không đổi. Tập khoá 79/79, thứ tự theo Pāli, nháy đơn/kép và dấu lược khớp Pāli từng khoá. Điểm thay đổi: `semantic_fidelity` 9.2→9.3, `vietnamese_clarity` 9.2→9.3, trung bình thô 9.13. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; `technical_integrity` giữ 9.6, không tuyên bố technical gate đã pass.
