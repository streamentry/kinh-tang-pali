  - >-
    `an6.8:1.3` là **cùng danh sách** với `an6.140:1.3` (PR #120) — dùng lại
    nguyên văn để hai chỗ không lệch nhau.
  - >-
    **`an6.92`/`93`/`94` lặp `Abhabbo diṭṭhisampanno puggalo` SÁU LẦN** trong
    Pāli — tôi kể lại đúng sáu lần, không rút gọn thành một mở đầu chung. Chỉ
    mục **đầu** viết hoa, theo `an3.117:1.3` (đã `published`); bản đầu tôi hoa
    cả sáu.
  - >-
    `abhabbaṭṭhāna` → *chỗ không thể ở* (0 tiền lệ, đặt mới) · `diṭṭhisampanno`
    → *đầy đủ chánh kiến* · `anāgamanīya vatthu` → *nơi chốn không đáng đến* ·
    `ānantariya kamma` → *nghiệp không gián đoạn* · `kotūhalamaṅgala` → *vẻ
    ngoài điềm lành* · `duṭṭha citta` → *tâm hỏng hại* (`an3.53:2.1` *bị tham
    chế phục*) — 0 tiền lệ.
  - >-
    ⚠ **`an6.94:1.3` mục thứ tư dịch là *sinh ra sắc sái dơ bẩy bằng tâm hỏng
    hại đối với Như Lai***: `tathāgassa duṭṭhena cittena lohitaṁ uppādetuṁ`
    nghĩa là *làm cho Như Lai xuất hiện sắc sái dơ bẩy* — tức **đồng nhất Đức
    Phật với hình tượng dơ bẩn**, đúng như chủ đề tà kiến của cả chương. Không
    phải hỏi xin Đức Phật ban ơn.
