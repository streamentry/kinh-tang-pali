notes: |-
  63 khoá, đủ mọi khoá của Pāli (63/63), thứ tự khoá đúng Pāli. Bài là chuỗi tám mục lặp: `lābha, alābha, yasa, ayasa, sakkāra, asakkāra, pāpicchatā, pāpamittatā`; Pāli dùng `…pe…` và `…` ở các mục 2–7 của mỗi nhóm nên bản Việt giữ đúng MỘT `…` ở mỗi khoá lược (cân dấu lược 63/63 khoá khớp Pāli), không mở rộng.
  Số lượng: `aṭṭhahi` ở 1.7, 2.1, 2.10 là tám; danh sách đếm đủ tám mục (lợi dưỡng, mất lợi dưỡng, danh tiếng, mất danh tiếng, sự tôn kính, sự không được tôn kính, ác dục, bạn xấu). Không có số lớn nào khác.
  Dùng lại nguyên văn tầng đã publish: `an4.68:1.1` (Pāli trùng) cho khoá 1.1; công thức `abhibhūto pariyādinnacitto devadatto āpāyiko nerayiko kappaṭṭho atekiccho` theo `iti89:2.1` (bị … chế ngự, tâm bị chiếm đoạt, … đi đến đọa xứ, địa ngục, trụ suốt một kiếp, không thể cứu chữa); `atthavasaṁ paṭicca` → vì lợi ích (`an5.57:2.1`); `Tasmātiha…evaṁ sikkhitabbaṁ` và `Evañhi vo…sikkhitabban` theo dạng đa số của bộ Tăng Chi (9 khoá cho mỗi công thức); `Sattamaṁ` → Thứ bảy (126). Pāli trùng nguyên văn trong chính bài: 7 nhóm, 0 nhóm mà bản Việt khác nhau.
  Thuật ngữ chọn sau khi đếm tầng: `vipatti` → thất nghiệp (33 khoá dùng, 0 khoá dùng từ khác trong tầng; `an7.30:0.3` đã đặt Kinh Sự Thất Nghiệp). Tôi giữ theo quy ước tầng dù người đọc hiện đại dễ hiểu nhầm là thất nghiệp theo nghĩa việc làm; nghĩa trong kinh là sự hư hoại, sút kém (Sujato dịch Failure, Failings). `sampatti` → thành tựu (`an3.117:0.3`). `asaddhamma` → phi Chánh Pháp (`an4.44:1.1`). `pāpicchatā` → ác dục (`iti89`, sinh cùng công thức Devadatta); `pāpamittatā` → bạn xấu (40 khoá bạn xấu so với 4 khoá bạn ác trong tầng; `iti89` ghi bạn ác nhưng đa số tầng ghi bạn xấu; tôi đi theo đa số). `lābha` → lợi dưỡng: tầng dao động giữa lợi dưỡng (128), lợi ích (96), được cho (37) và `an8.5:1.3` (cùng phẩm) dịch lợi ích; tôi chọn lợi dưỡng để không trùng với `atthavasa` được dịch là lợi ích ngay trong bài này. `sakkāra` → tôn kính (103 khoá) so với cung kính (90); chọn tôn kính theo `an4.43`, `an4.68`. `ayasa` → mất danh tiếng (theo `an8.5:1.3`).
  `abhibhuyya abhibhuyya vihareyya` (lặp động từ chỉ sự lặp đi lặp lại) → sống chế ngự đi chế ngự lại; tầng không có tiền lệ cho dạng lặp đôi này (0 khoá). Bất định: sắc thái lặp (mỗi khi gặp, lần nào cũng chế ngự) so với liên tục; bản Việt giữ chữ lặp, không thêm nghĩa. `kālena kālaṁ` → thỉnh thoảng (25 khoá, đa số so với 11 khoá thời thời khắc khắc).
  Cấu trúc 5.1 và 5.8: `Yaṁ hissa … anabhibhuyya viharato uppajjeyyuṁ āsavā …, abhibhuyya viharato evaṁsa te … na honti` dịch thành hai vế song song nơi vị không chế ngự / nơi vị chế ngự; 5.8 không có `Yaṁ hissa` ở đầu khoá nên bản Việt mở bằng nơi vị sống không chế ngự, đúng cấu trúc Pāli của khoá.
  Nháy: 1.3 mở “ và 6.10 đóng ”; 6.2 mở ‘ và 6.9 đóng ’ — đã đối chiếu từng khoá, 0 lệch.
  Coverage English: mẫu số 22 khoá Pāli có nội dung (từ 40 ký tự, bỏ khối :0); Sujato phủ 18/22 (81,8%, trên ngưỡng 0,8); bốn khoá Sujato bỏ trống là 4.8, 5.2, 5.8, 5.16 — Pāli tự đứng vững, 5.8 dựa vào song song với 5.1. Bản lấp English của dự án có 4 khoá cho đúng bốn chỗ ấy nhưng tôi không coi đó là cách đọc English độc lập khi chấm triangulation. Không có bản Việt hiện hành (vietnamese-current chỉ có Pháp Cú).
