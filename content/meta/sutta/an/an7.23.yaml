notes: |-
  Đối chiếu Pāli + English Sujato (20 khoá). Bảy pháp bất thối của tăng chúng: thường xuyên hội họp, hội họp trong hòa hợp, tôn trọng học giới đã ban hành, kính trọng bậc trưởng lão kỳ cựu, không bị khát ái chi phối, ưa thích núi rừng thanh vắng, duy trì chánh niệm để đón tiếp bạn đồng tu. Số thứ tự uddāna 'Tatiyaṁ' = Thứ ba.
  
  Đủ khoá so với Pāli gốc, không có khoá nào thiếu hay orphan.
  
  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `3. Vajjisattakavagga` → «3. Phẩm Bảy Điều Tộc Vajji». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.
