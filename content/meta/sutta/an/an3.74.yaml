notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.4, 3.2, 4.2 — ‘Vị ấy không tạo nghiệp mới, và các
  nghiệp cũ được tiêu hủy dần dần khi cảm thọ quả’ → ‘Vị ấy không tạo nghiệp mới, và làm cho nghiệp
  cũ tiêu tan dần dần khi được cảm thụ’ (theo an4.195): `byantīkaroti` là động từ chủ động, bản cũ
  chuyển sang bị động nên mất chủ thể, và ‘quả’ không có trong `phussa phussa`. Giữ nguyên ‘hủy
  diệt’ cho `nijjarā` ở 2.1, 2.5, 3.3 (thuật ngữ khác).
