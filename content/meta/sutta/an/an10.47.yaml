notes:
  - >-
    **Hai danh sách đối xứng** (`1.4`–`1.8` với `2.2`–`2.6`), mỗi danh sách năm
    pháp, mỗi vế **lặp lại đúng hai lần**: *X là nhân, X là duyên*. Tôi dịch lặp
    y nguyên vì đó là **thứ tự lập luận** của bài, và vì bỏ lần lặp sẽ biến một
    mục thành một danh sách khác với `1.3` và `2.1`. **`heta`/`paccaya` →
    *nhân*/*duyên*** theo 47 segment tiền lệ (`an3.15:4.1`, `an3.56:1.4`,
    `an4.171:8.1`); bản đầu tôi tự đặt *lý do*/*nguyên nhân* — 0 segment.
  - >-
    **`micchāpaṇihitaṁ cittaṁ` → *Tâm hướng sai*** và **`sammāpaṇihitaṁ cittaṁ`
    → *Tâm hướng đúng*** — 0 segment tiền lệ, đặt mới; cặp song phương với
    `yoniso`/`ayoniso manasikāro` → *Tác ý như lý* / *Tác ý không như lý* (cũng
    0 tiền lệ, đặt mới cùng bài). **Lỗi lượt review bắt được:** bản đầu tôi thêm
    *làm cho mình* vào cả hai — *Tâm hướng sai **làm cho mình** là nhân* — vừa
    thừa, vừa **không thành tiếng Việt**. Đã sửa.
    **Thống nhất chữ hoa:** bản đầu viết hoa thuật ngữ giữa câu ở `1.4`–`1.6` và
    `2.2`–`2.4` (kiểu liệt kê), nhưng không ở `1.7`–`1.8` và `2.5`–`2.6`; bản
    đầu tiếng Việt sau đó lệch nhịp giữa chính các mục của nó. Đã bỏ hết, để
    *Tham là nhân, tham là duyên…* — mục nào cũng như nhau.
  - >-
    `alobho`/`adoṣa`/`amoha` → *Không tham* / *Không sân* / *Không si*: đây là
    **danh tính không tham**, nên mệnh đề Pāli là *sự không-tham là nhân*, và
    dịch *Không tham* giữ đúng cấu trúc song phương với *Tham* ở nửa trên.
    `adhammacariyāvisamacariyā` → *đời sống phi pháp là không cân bằng* (0
    segment, đặt mới; đối xứng với *chơn pháp*). Địa danh và tôn hiệu dùng
    nguyên văn tiền lệ chương 1–4: `Vesālī`, `mahāvana` → *rừng Đại Lâm*,
    `kūṭāgārasālā` → *tứ trản sừng Sālâyà*, `Licchavi` → *người Lạc Xứ*.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
