notes: |-
  Dịch từ Pāli root tại commit đã ghim, đủ 95/95 khoá, không khoá nào ngoài tập Pāli, thứ tự khoá đúng thứ tự Pāli.

  COVERAGE ANH ĐO THẬT: mẫu số = khoá Pāli có nội dung (>= 40 ký tự, bỏ khối 0.x) = 56; `english-sujato` phủ 56/56 = 1.000 (ngưỡng 0.8 trong `source/layers.yaml`). Không có tệp lấp `english-project` cho bài này nên số trên hoàn toàn là Sujato độc lập, không lẫn bản của dự án. Các khoá Sujato để trống (4.4, 5.5, 6.5, 7.9, 8.6 và 16.5) đều là khoá ngắn dưới 40 ký tự nên không nằm trong mẫu số. Tầng `vietnamese-current` không có trong store (bilara tại commit đã ghim chỉ có Pháp Cú); bản Hòa thượng Thích Minh Châu của bài này chỉ được đọc như tra cứu toàn văn nguyên bài, không phải cột phân đoạn. Vì thế `reference-gaps.yaml` không cần entry.

  TIỀN LỆ ĐO TRƯỚC KHI CHỌN:
    · Pāli trùng nguyên văn với bài khác trong tầng: 23 khoá; 22 khoá dùng lại nguyên văn bản Việt đã có (an7.73 cho 11.2; dn26 cho 13.8 và 13.9; an4.1 cho 14.7 và toàn bộ kệ 15.1 đến 16.4; các công thức mở và kết bài), 1 khoá khác là 1.2 (vì tiền lệ duy nhất cùng Pāli là `sn47.1:1.2`, dịch `Đại rừng` cho `ambapālivana`, trái với `dn16` đọc `vườn xoài của Ambapālī`; tôi theo `dn16`).
    · 0.1: `Aṅguttara Nikāya 7.66` theo dạng đa số của quyển 7 (an7.65, an7.69), dù toàn tầng an nghiêng về `Kinh Tăng Chi Bộ`. 0.2 `7. Phẩm Lớn` (18 khoá trùng Pāli, 18/18 cùng cách dịch).
    · `saṅkhārā` -> `các hành`; `anassāsika` -> `không đáng để nương tựa` (sn, 2 khoá; `không đáng tin cậy` dùng cho `brahmacariya`); `adhuva` -> `không bền vững` (mn, tiền lệ `addhuvo`).
    · Công thức kết `alameva … nibbindituṁ alaṁ virajjituṁ alaṁ vimuccituṁ` -> `là đủ để các ông chán nản trong mọi hành, đủ để ly tham, đủ để giải thoát` (nhiều khoá cùng công thức trong tầng, ví dụ `Như vậy, này các tỳ-kheo, là đủ để các ông chán nản trong mọi hành, đủ để ly tham, đủ để giải thoát`; `các ông` 230 so với `các thầy` 3 trong an; `chán nản` và `nhàm chán` hai bên bằng nhau ở an, 17/17, chọn dạng của các khoá cùng công thức).
    · `yojana` -> `do-tuần` (96 so với `do tuần` 6 trên toàn tầng; mn28 cùng công thức nước biển hạ xuống cũng dùng `do-tuần`; riêng quyển an có 5 khoá dùng `do tuần`, nhưng cả 5 chỉ ở hai bài và toàn tầng nghiêng hẳn về dạng có gạch nối). `tāla` -> `cây cọ`, `porisa` -> `sải` theo đúng mn28:12.4–12.5.
    · `mahāsamudda` -> `biển lớn` (133 so với `đại dương` 41 trên toàn tầng; an 8 so với 2). `mahāpathavī` -> `đại địa` (33). `pabbatarājā` -> `vua núi` (sn22.99, sn13.11).
    · `sūriya` ordinal: `thứ hai` đến `thứ bảy`; `hoti kho so … samayo yaṁ kadāci karahaci` -> `Có lúc, này các tỳ-kheo, thỉnh thoảng sau một thời gian rất dài` (tiền lệ về cửa Đông của đại địa ngục; một tiền lệ khác dịch `rồi sẽ có lúc, sau một thời gian rất dài` nhưng bỏ mất `kadāci karahaci`).
    · Tên chư thiên theo đa số trong an: `Tha Hóa Tự Tại` (5), `Hóa Lạc` (9), `Tusita` (5 so với `Đâu-suất` 2), `Yama` (9 so với `Dạ-ma` 0), `Tāvatiṁsa` (22 so với `Ba Mươi Ba` 15), `Tứ Đại Thiên Vương` (22). Tiền lệ cùng chuỗi Pāli là dn19:60.3–60.8 dùng `Đâu-suất`, `Dạ-ma`; tôi theo đa số an chứ không theo chuỗi đó và ghi chỗ lệch này. `mahāsāla` -> `đại phú hộ` (an 9).
    · `vua Chuyển Luân` (an 27 so với `Chuyển Luân Vương` 6); `Phạm thiên` (88 so với `Phạm Thiên` 14 trong an), `Đại Phạm thiên`; `Sakka` (307 so với `Đế Thích` 30); `Phạm cung trống không` theo an7.62:1.7 cùng Pāli (an 2; `cung Phạm thiên trống không` 6 trên toàn tầng nhưng 0 ở an).
    · `titthakara` -> `giáo chủ ngoại đạo` theo an7.73 cùng Pāli; `satthā` -> `đạo sư`; `saṁvaṭṭavivaṭṭakappe` -> `hoại kiếp và thành kiếp` theo an7.62:1.5.

  DẤU LƯỢC: Pāli có sáu khoá `…pe…` (3.5, 4.3, 5.4, 6.4, 7.8, 8.5), mỗi khoá giữ đúng một `…` ở bản Việt, 6/6 khớp; khoá ngay sau (`alaṁ vimuccituṁ.` ở 3.6, 4.4, 5.5, 6.5, 7.9, 8.6) dịch `đủ để giải thoát.`. Không khoá nào có `(…)` hay `…` trần. Dấu nháy đơn và nháy kép khớp Pāli từng khoá, 0 lệch trên 95 khoá (nháy kép mở ở 2.1 và đóng ở 14.5; kệ mở ở 15.1 và đóng ở 16.4). NFC sạch, không khoá rỗng, không khoảng trắng thừa. Pāli trùng nguyên văn trong chính bài: 4 nhóm (2.4 với 9.11; 3.4 với 9.8; `Evaṁ aniccā … pe` năm khoá 4.3, 5.4, 6.4, 7.8, 8.5; `alaṁ vimuccituṁ.` sáu khoá 3.6, 4.4, 5.5, 6.5, 7.9, 8.6), cả 4 nhóm bản Việt giống hệt; các khoá chỉ khác nhau ở số thứ tự mặt trời thì bản Việt khác đúng chỗ ấy.

  SỐ PĀLI ĐÃ TỰ TÍNH: `caturāsīti` = catu 4 + asīti 80 = 84, `yojanasahassāni` = 1000 do-tuần mỗi đơn vị -> 84 × 1000 = 84.000 do-tuần, lặp bốn lần ở 3.1 (dài, rộng, chìm sâu, nhô lên), tiền lệ `caturāsītinagarasahassāni` -> `tám mươi bốn ngàn`; `yojanasatika` = 100 do-tuần (7.2: một trăm, `dviyojanasatika` hai trăm, ba, bốn, năm, sáu, bảy trăm; 9.4: một trăm đến năm trăm); `sattatāla` … `tālamatta` = bảy đến một cây cọ; `sattaporisa` … `porisa`, `aḍḍhaporisa` = bảy sải đến một sải, nửa sải; `chattiṁsa` = cha 6 + tiṁsa 30 = 36 (an7.62:2.2 cùng cách dịch `ba mươi sáu`); `satta vassāni` = bảy năm, `satta saṁvaṭṭavivaṭṭakappe` = bảy kiếp hoại và thành; `parosahassaṁ` = hơn một ngàn (dn26:2.4); `sattaratana` = bảy báu; `catunnaṁ dhammānaṁ` = bốn pháp (14.2–14.4, đếm đủ bốn: giới, định, tuệ, giải thoát). Không dùng thang `ngàn` nhân gộp; không gặp cụm `Tiṁsakappasahassa`.

  BẤT ĐỊNH ĐÃ PHÂN XỬ, KHÔNG THÊM VÀO THÂN KINH:
    (1) `ālepito` (8.3): Sujato dịch `first kindled` (lò vừa nhóm lửa), Hòa thượng Thích Minh Châu `mới đốt lửa lên`. Từ này cũng có thể liên hệ nghĩa `trát, phết` (lò vừa được trát đất). Tôi chọn `vừa được nhóm lửa` theo hai bản tham khảo, ngữ cảnh khói bốc lên ủng hộ; chưa phân xử được bằng bằng chứng độc lập trong tầng (không có nơi nào khác dùng cùng từ).
    (2) `diṭṭhapadehi` (10.2): `pada` ở đây là `dấu chân, cảnh giới`; Sujato dịch `one who has seen the truth`, Hòa thượng Thích Minh Châu `trừ những người đã được chứng kiến`. Tiền lệ trong tầng cho `diṭṭhapada` là `người đã thấy Niết-bàn`, `người đã thấy đạo`, `chân lý mà ta đã thấu suốt` (ba nơi, ba cách). Tôi chọn `những vị đã thấy chân lý`, nghĩa gần Sujato và tiền lệ `chân lý`; chú giải truyền thống đọc là bậc Thánh đã thấy Niết-bàn nhưng điều đó không được đưa vào lời kinh.
    (3) `gopphakamattāni mahāsamudde udakāni ṭhitāni` (7.6): Pāli nói nước còn đọng sâu ngang mắt cá chân ở chỗ này chỗ kia, nối với ví dụ `gopadesu` (trong các vết chân bò) ở 7.5; Sujato dịch `puddles like cows’ hoofprints` (vũng như vết chân bò), Hòa thượng Thích Minh Châu `những vũng nước nhỏ`. Tôi dịch sát từng từ Pāli (`ngang mắt cá chân`).
    (4) `aṅgulipabbamattampi` (7.7): `aṅguli` có thể là ngón tay hoặc ngón chân; Sujato `tip of the toe`, Hòa thượng Thích Minh Châu `bằng độ ngón tay`. Tôi dịch `một đốt ngón tay` theo `pabba` (đốt). mn28 cho từ khác (`aṅgulipabbatemanamattampi`) đã dịch `ngón chân`, nên không dùng làm tiền lệ trực tiếp.
    (5) `dhūmāyanti sandhūmāyanti sampadhūmāyanti` (8.2, 8.4) và `dhūmeti …` (8.3): ba cấp bốc khói với tiền tố `saṁ-` (tăng mức); tôi dịch `bốc khói, bốc khói cuồn cuộn, bốc khói mù mịt` để giữ ba mức; Sujato gộp thành `smoke and smolder and give off fumes`.
    (6) `ayañca mahāpathavī` (8.2 đến 9.7) so với `ayañca pathavī` (10.2): Pāli đổi `mahāpathavī` thành `pathavī` ở câu nghi vấn 10.2, tôi theo từng khoá (`đại địa` và `đất`).
    (7) `So hi nāma` (13.10): tiểu từ `hi nāma` mang sắc thái ngạc nhiên; tôi dịch `ngay cả` để giữ sắc thái ấy; Sujato dịch `Yet even though`.
    (8) 14.5: `Tayidaṁ … anubodho … anubodhā` dùng dạng `anubodha` thay `anubuddha` của an4.1:2.7; nghĩa như nhau nên dùng lại bản Việt an4.1 và thêm `này các tỳ-kheo` ở đúng chỗ Pāli có `bhikkhave`.

