notes: |-
  Sửa lan 2026-10-13: khoá an3.40:2.7, vitakka bị dịch "các tưởng về dục / sân / sát hại" → "tầm dục, tầm sân, tầm hại" (kāma-/byāpāda-/vihiṁsā-vitakka); căn cứ: "tưởng" là saññā, không phải vitakka; tiền lệ "tầm dục, tầm sân, tầm hại" ở an3.124:1.8, dn33:1.10.13, mnd16:246.3, và vihiṁsā dịch "hại" chứ không "sát hại".
  Sửa lan 2026-10-13 (lượt L539): khoá an3.40:3.7, "thuyết giảng một cách đầy đủ" → "khéo thuyết giảng" (svākkhāto) và "không hề thời hạn" → "không thời hạn" (akāliko); khoá an3.40:3.9, "Giáo Pháp và Giới Luật được thuyết giảng đầy đủ ấy" → "Pháp và Luật được khéo thuyết giảng như vậy" (svākkhāte dhammavinaye). Căn cứ: Pāli root; cùng công thức đã sửa ở an11.13:7.2; tiền lệ "Pháp và Luật được khéo thuyết giảng như vậy" ở sn11.1:8.2, sn11.2:8.2, sn12.70:27.2, sn16.6:5.2.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an3.40:3.6 — bỏ dấu nháy đơn đóng ’ thừa ở cuối (Pāli 3.6 kết “paññāyethāti” không có dấu đóng; nháy mở ‘ ở 3.3 chỉ đóng ở 3.9); giữ nguyên khoá 3.7 vì Pāli không có nháy và “Pháp đã được Đức Phật khéo thuyết giảng” đúng svākkhāto bhagavatā dhammo (bản đa số thêm nháy không có trong Pāli); giữ nguyên khoá 2.6 vì sát Pāli “antakiriyā paññāyethā” (bản đa số diễn thành “ta có thể chấm dứt”).
