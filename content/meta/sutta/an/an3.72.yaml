notes:
  - >-
    **Giải quyết draft 2026-10-12 (thay thế lượt chấm 2026-09-13).** Blocker cũ
    "cắt ngắm ở `an3.72:4.2`" không còn căn cứ: Pāli `4.2` viết đủ ba mệnh đề
    tham, sân, si (không có `…pe…`), và bản Việt hiện hành cũng dịch đủ ba mệnh
    đề, không có dấu lược `…` ở khoá này. Dấu lược chỉ còn ở các khoá mà Pāli có
    `…pe…` (`4.4`, `5.6`, `6.4`, `6.6`, `6.8`), mỗi chỗ đúng một `…`.
  - >-
    **Khoá đã sửa vì lỗi nghĩa thật (accuracy fix).** `2.8`, `3.4`, `4.4`,
    `5.2`, `5.4`, `5.6`: người gia chủ nói với Tôn giả Ānanda, Pāli là *bhante*
    — bản cũ ghi "Bạch Thế Tôn" là sai người nghe; sửa thành "Bạch Tôn giả".
    `7.3`: Pāli là *taṁ bhagavantaṁ* ("Đức Thế Tôn ấy"); bản cũ thêm "bậc mà Tôn
    giả Ānanda theo hầu", không có trong Pāli — bỏ, theo công thức quy y của
    tầng (*nơi Đức Thế Tôn ấy, nơi Pháp và nơi Tăng chúng tỳ-kheo*). `4.2`,
    `4.4`, `5.6`, `6.8`: cấu trúc *yesaṁ rāgo pahīno … yesaṁ doso pahīno … yesaṁ
    moho pahīno …, te loke sukatā* viết lại đúng mệnh đề quan hệ; `4.4` và `5.6`
    bản cũ đảo thành "đã từ bỏ sân … đã từ bỏ si như vậy" làm mờ phần *yesaṁ*
    thứ hai và thứ ba, nay giữ đúng nhịp Pāli. *tālāvatthukato* dịch "làm như
    gốc cây thốt nốt" (*tāla* là cây thốt nốt, không phải chà là; tầng có 13 lần
    dùng "thốt nốt" so với 11 lần dùng "chà là"), *anabhāvaṅkato* "làm cho không
    còn hiện hữu", *anuppādadhammo* "không còn có thể sinh khởi trong tương
    lai". `6.3`: *attā ca anupanīto* là "bản thân không bị đưa vào", không phải
    "không đề cao cái ta"; *āyataneva dhammadesanā* là việc thuyết pháp ở đúng
    phạm vi của nó. `6.2`: *paradhammāpasādanā* là "chê bai pháp của người
    khác", không phải "làm cho người khác mất niềm tin". `6.1`: *acchariyaṁ
    abbhutaṁ* theo tiền lệ "Vi diệu thay … Hy hữu thay", bỏ "khó tin".
    `6.4–6.9`: các câu *tumhe, bhante ānanda* là lời xưng hô trực tiếp, bản cũ
    đổi thành ngôi thứ ba; nay "Bạch Tôn giả Ānanda, Tôn giả …", và `6.8` giữ đủ
    *tumhākaṁ rāgo … doso … moho*. `7.2`: "Tôn Ānanda" sai tước hiệu — sửa thành
    "Tôn giả Ānanda"; *telapajjota* là đèn dầu; *dhammo pakāsito* là Pháp được
    làm sáng tỏ. `2.4`: *yathā te khameyya* là "theo điều ông thấy thỏa đáng"
    (cùng hướng với tiền lệ "thấy thỏa đáng" của công thức này), không phải "ông
    nghĩ". *svākkhāto* "được khéo thuyết" thay "được thuyết giảng đầy đủ" (không
    có ý "đầy đủ" trong Pāli); *pahāna* thống nhất "đoạn trừ" như *pahīno* "đã
    được đoạn trừ". `0.3`, `1.2`: *Ājīvaka* theo dạng Pāli; `translationTitle`
    khớp. Tổng 28 / 44 khoá được đổi.
  - >-
    **Đối chiếu và giới hạn.** Pāli root + Sujato: Sujato phủ đủ các đoạn Pāli
    có nội dung của bài (chỉ `7.5` "Dutiyaṁ" để trống, ngắn hơn ngưỡng nội
    dung), nên không có blocker kiểu thiếu độ phủ. Sujato diễn `4.2`, `4.4` và
    `5.6` gộp "greed, hate, and delusion" một lần; đã đọc đối chiếu Pāli, chỗ
    nào Sujato gộp thì Pāli lặp từng *yesaṁ*, bản Việt bám Pāli. Tầng Việt hiện
    hành không có cho bài này (chỉ có Pháp Cú), nên `triangulation` không cao
    hơn 8,8. `sukatā` ("đã làm tốt", theo Sujato *done well*) là nghĩa thường
    gặp, không có tiền lệ nội bộ trong tầng để đối chiếu thêm. Không có Pāli
    trùng nguyên văn trong bài mà bản Việt khác: các lặp ở `5.2`, `5.4`, `5.6`
    khớp `2.8`, `3.4`, `4.4` (đã so từng cặp).
  - >-
    **Kiểm kỹ thuật.** Tập khoá Việt khớp Pāli (44/44, đúng thứ tự); dấu nháy
    đơn và kép khớp Pāli từng khoá. Không có số Pāli cần tính. Cổng kho (`npm
    run validate`, `npm test`, `npm run check`, `npm run build`) chưa chạy trong
    lượt này; `technical_integrity` đặt 9,6.
