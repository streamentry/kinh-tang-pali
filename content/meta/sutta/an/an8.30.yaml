notes: |-
  **119 khoá** (0.1–0.3, 1.1–1.10, 2.1–2.4, 3.1–3.11, 4.1–7.1, 8.1–12.4, 13.1–13.13, 14.1–21.5, 22.1–22.5, 23.1–25.6, 26.0–26.4), viết đủ cả 119; tập khoá Việt == tập khoá Pāli (119 == 119), thứ tự khoá == thứ tự Pāli; không khoá nào ngoài tập.
  **Trùng nguyên văn (chỉ mục toàn kho 284.708 khoá Pāli, 175.249 khoá Việt): 34/119 khoá có Pāli trùng ở bài khác, 31 khoá dùng lại một bản Việt có sẵn, 3 khoá khác có lý do.** Dùng lại: `1.3` (`sn52.1:1.3`, `sn52.2:1.2`) · `2.4` (`mn31:5.6`, `mn128:10.8`) · `14.2` / `18.2` / `19.2` / `20.2` / `21.2` *đó là điều đã được nói. Được nói đến vì nhân duyên gì?* (31/41 nơi, khuôn `mn139`; 6 nơi khác *Vì sao Ta nói như vậy?*, 4 nơi còn lại rải rác) · `14.5` / `15.4` / `16.5` / `17.4` / `18.5` / `19.5` / `20.5` *đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói.* (19/28 nơi) và `21.5` thêm `”` (`mn137:28.2`) · `17.2` (`an3.98:3.2`, `an3.97:3.2`, một nơi nữa, cả ba cùng bản, giữ nguyên *bậc tỳ-kheo*) · `19.3` theo `an4.41:2.2` *vị tỳ-kheo ly các dục … chứng và an trú thiền thứ tư* (2 nơi `an3.89`/`an3.90` viết *bậc tỳ-kheo hoàn toàn ly dục … tứ thiền*; chọn bản `an4.41` vì tầng `an` viết *thiền thứ tư* 42 nơi so với *tứ thiền* 13 nơi, và bốn khoá thiền ở `4.1`–`7.1` của bài đều dùng *thiền thứ …*) · `22.3` *Vị ấy biết rõ: ‘Sinh đã tận…* (3 nơi `dn8:24.6`, `dn16:5.30.6`, `an6.55:8.3`; 30 nơi với 22 biến thể) · `22.4` (`an3.130:3.4`) · `23.2` *bậc Thầy tối thượng trong đời* (`tha-ap199:3.2`, `tha-ap78:3.2`) · `23.3` · `23.4` (`tha-ap274:1.3`, `1.4`) · `25.3` *Ba minh đã chứng đắc* (16/39 nơi; *đã chứng đạt* 6 nơi) · `25.4` (14/24 nơi) · `25.5` *Thứ mười.* (275/280 nơi) · `0.2` (9 nơi) · `26.0` *Tóm lược:* (490 nơi, 23 biến thể) · `25.6`. Dùng khuôn nhưng đổi chủ ngữ cho đúng vagga: `2.2` / `13.2` / `13.3` (13 biến thể trong tầng; ở `an8.21`–`an8.25` cùng phẩm viết *Đức Phật*). **Trùng nhưng không dùng nguyên văn (3 khoá):** `22.2` (`an3.130:3.2` là bản nhiều lỗi diễn đạt, *tách biệt, kiên trì, các người con thiện nam chánh đáng xuất gia ly gia đi vào không nhà*; ta dựng khuôn từ `dn16:5.30.5` / `dn26:26.3` với *thiện nam tử*, 52 nơi so với *con nhà lành* 12 nơi) · `23.1` (`tha-ap274:1.1` *Biết được tâm niệm của tôi*; trong 24 nơi có `saṅkappamaññāya` thì *ý định* chiếm 19, *tâm niệm* 1, *ý nghĩ* 1, *tâm tư* 1 — ta theo 19 nơi) · `25.2` (`thag10.4:5.2` *ta vui vẻ sống theo giáo pháp*, 1 nơi; ta giữ *tôi* như cả bài kệ và dịch *sāsane* là *trong giáo pháp*, không *theo*).
  **Pāli trùng trong chính bài: 11 nhóm (`1.5`/`3.4`, `1.6`/`3.5`, `1.7`/`3.6`, `1.8`/`3.7`, `1.9`/`3.8`, `2.2`/`13.2`, `14.1`/`14.4`, `14.2`/`18.2`/`19.2`/`20.2`/`21.2`, `14.5`/`15.4`/`16.5`/`17.4`/`18.5`/`19.5`/`20.5`, `19.1`/`19.4`, `20.1`/`20.4`), Việt giống nhau cả 11; 0 cặp Pāli trùng mà Việt khác.** Các cặp chỉ khác dấu nháy mở/đóng (`1.4`↔`3.3`, `1.10`↔`3.9`) được viết cùng nội dung và đếm nháy theo từng khoá. Đã in cặp Pāli↔Việt cả 119 khoá để đọc đối kháng: bảy mục của `1.4`–`1.10` / `3.3`–`3.9` / `13.6`–`13.12` và mục thứ tám ở `3.11` / `13.13` đều đúng thứ tự Pāli (tư duy 1–7 rồi tư duy thứ tám, không cặp nào mang nội dung của cặp kia).
  **Dấu lược:** Pāli có `…` ở 2 khoá (`13.4` `…pe…` kết khoá; `19.3` `…pe…` giữa câu); mỗi khoá lược(vi) == lược(pāli) (một `…` mỗi khoá); 117 khoá còn lại không có `…`. Nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá, 0 lệch trên 119 khoá (`1.4` mở `“` đóng ở `1.10`; `3.1` mở `“` đóng ở `12.3`; `3.3`–`3.9` và `3.11` nháy đơn; `13.4` mở `“` đóng ở `21.5`; `22.3`, `23.1`–`25.4` nháy kép riêng). NFC đạt; không khoảng trắng đôi; Pāli lọt sang Việt chỉ ở tên riêng giữ nguyên (*Aṅguttara Nikāya*, *Bhesakaḷā*, *Pācīnavaṁsa*, *Susumāragira*, *Cetī*, *Bhagga*, *Anuruddha*, *Ugga*, *Hatthaka*, *Mahānāma*, *Jīvaka*, *sāli*).
  **Số Pāli (tự tính):** `aṭṭha` = *tám* (3.10 `aṭṭhamaṁ` = *thứ tám*; 4.1–13.5 *tám tư duy*) · bảy mục đầu `appiccha / santuṭṭha / pavivitta / āraddhavīriya / upaṭṭhitassati / samāhita / paññavant` ở `1.4`–`1.10` đếm đủ **7**, cộng mục thứ tám `nippapañcārāma` ở `3.11` = **8** (khớp `aṭṭha`; TMC ghi *bảy niệm* ở 3.2 cũng là bảy mục đầu) · 13.6–13.13 là **8** mục; 14.3 là **8** mệnh đề `…samāno … na icchati` (đếm đủ 8) · `catunnaṁ jhānānaṁ` = *bốn thiền* · `paṭhama / dutiya / tatiya / catuttha jhāna` = *thứ nhất / hai / ba / tư* (4.1, 5.1, 6.1, 7.1, 19.3) · `tisso vijjā` = *ba minh* (25.3) · `dasamaṁ` = *thứ mười* (25.5) · `Gahapativaggo tatiyo` = *thứ ba* (25.6) · uddāna `26.1`–`26.4`: `dve uggā` 2 + `dve hatthakā` 2 + `mahānāma` 1 + `jīvaka` 1 + `dve balā` 2 + `akkhaṇā` 1 + `anuruddha` 1 = **10**, khớp `dasā` và khớp mười bài `an8.21`–`an8.30` (21–22 Ugga, 23–24 Hatthaka, 25 Mahānāma, 26 Jīvaka, 27–28 Sức Mạnh, 29 Lúc Không Thuận, 30 bài này). 0 số lệch.
  **Tiền lệ thuật ngữ đã tra kèm đếm.** `mahāpurisavitakka` → *tư duy của bậc đại nhân* (duy nhất `dn34:2.1.150`, danh sách tám mục y hệt) · `vitakketi` → *tư duy* (bài gọi tám mục là *tư duy*; tầng viết `vitakka` thường là *tầm* 443 / *suy nghĩ* 152 / *tư duy* 22 nhưng ở đây không phải *tầm* của thiền) · `appiccha` → *ít ham muốn* (tầng 34, `an` 10 so với *thiểu dục* 7, *ít mong cầu* 4; `dn34:2.1.151`) · `santuṭṭha` → *tri túc* (`an` 54 so với *biết đủ* 9; cả `dn34:2.1.152` và công thức `an10.17`/`an10.18`; riêng `an8` chỉ có 2 khoá, đều là danh từ `santuṭṭhi` ở `an8.53:2.7`, `an8.53:3.6` và viết *biết đủ*) · `pavivitta` → *sống viễn ly* (64/76 khoá) · `saṅgaṇikārāma` → *ưa tụ họp* (`an` *tụ họp* 11, *hội chúng* 6; `an8.79`) · `āraddhavīriya` → *tinh tấn* (175/212, *tinh cần* 44) · `kusīta` → *biếng nhác* (33/48, *lười biếng* 14) · `upaṭṭhitassati` → *có niệm hiện tiền* (`dn34:2.1.155`, `dn33`; trong `an` *có niệm* 5, *niệm hiện tiền* 2, *thiết lập niệm* 1) · `muṭṭhassati` → *thất niệm* (56/72) · `duppañña` → *thiếu trí* (`an` 9/12, tầng 13, *thiếu tuệ* 1 ở `dn34`) và `paññavā` → *có trí tuệ* (`dn34`, `dn33`) · `papañca` → *hý luận* (50/125 nơi; *lan man* 1 nơi ở `dn34:2.1.158`) · `nippapañcārāma` / `nippapañcarata` → *ưa thích vô hý luận / ham thích vô hý luận*, đối với `papañcārāma papañcarata` → *ưa thích hý luận / ham thích hý luận* (`an6.14`, `an6.15` *ưa thích / ham thích*; `sn43.23:1.1` *vô hý luận* cho `nippapañca`) · `vivekaninna … nekkhammābhirata` → *nghiêng về / xuôi về / đổ về / trú trong viễn ly, ưa thích xuất ly* (`an8.28:4.1`, `an10.90:4.1`) · `uyyojanikapaṭisaṁyutta kathā` → *những lời … liên hệ đến việc tiễn … về* (`mn122:6.4`, duy nhất) · `cetasā cetoparivitakkamaññāya … balavā puriso` → khuôn `an6.55:2.1` / `an6.55:7.4` · `ovāda` → *giáo hóa* (`an6.55:7.4`, `mn143`, `mn144`) · `rahogata paṭisallīna` → *ở riêng, độc cư* (`sn52.1:1.3`) · `nikāmalābhī akicchalābhī akasiralābhī` → *tùy ý chứng được … không khó khăn, không vất vả* (`mn6:9.1`, `dn28:19.3`) · `gahapati vā gahapatiputta` → *gia chủ hay con của gia chủ* (`an3.35:3.2`) · `kūṭāgāra ullittāvalitta …` → *ngôi nhà mái nhọn, trát vữa trong ngoài, kín gió, cửa đóng then, cửa sổ khép kín* (`mn12:41.4` *mái nhọn*, `an3.35:3.2` *cao tầng*: chọn *mái nhọn* vì `kūṭa` là chóp) · `pallaṅka gonakatthata …` → theo `an3.35:3.3` (*da hươu tuyệt hảo, màn phía trên, gối đỏ hai đầu*) · `vicitakāḷaka` → *gạn bỏ hạt đen* (`an5.44:5.3`, duy nhất) · `pūtimutta` → *nước tiểu lên men* (`mn46:20.1`, `an4.27:1.6`) · `sappi navanītaṁ telaṁ madhu phāṇitaṁ` → *bơ sữa, bơ tươi, dầu, mật ong, mật mía* (`dn26:19.4`, `an7.67:12.2`) · `ratiyā aparitassāya phāsuvihārāya okkamanāya nibbānassa` → *để được vui thích, không lo âu, sống an ổn, và để bước vào Niết-bàn* (`an7.67:21.4`) · `titthiya` → *ngoại đạo* (`an` 36; tầng 168) · `rājamahāmatta` → *đại thần của vua* (`an` 14) · `kulaputta` → *thiện nam tử* (tầng 52, *con nhà lành* 12) · `bhagavā` → *Đức Phật* (`an8.21`–`an8.25` cùng phẩm; tầng `an` 171, *Đức Thế Tôn* 87; riêng ở các khoá mở đầu `Ekaṁ samayaṁ bhagavā …` / `Atha kho bhagavā …` của `an8` thì *Đức Thế Tôn* 27, *Đức Phật* 11 — chọn theo cùng phẩm và đa số tầng `an`).
  **0 tiền lệ, đặt mới, ghi kèm lý do:** `sāli` giữ *sāli* (`an5.44:5.3` dịch *cơm gạo ngon*, 1 nơi, mất tên loại gạo) · `piṇḍiyālopabhojana` → *bữa ăn nắm cơm khất thực* (`sn55.1:1.4` dịch `piṇḍiyālopena` là *ăn thức ăn dư khẩu phạm*, sai ngữ cảnh; `an4.27:1.4` *khất thực*) · `khāyissati` → *hiện ra với ông* (Sujato *will seem to you*; trong `ví như … cũng vậy` đủ rõ nghĩa) · `āyatikampi vassāvāsaṁ` → *mùa an cư mưa sắp tới … cũng* (0 tiền lệ cho cụm; xem bất định 3) · `santuṭṭho … itarītara…` → *những thứ … bất kỳ* (`itarītara` có nghĩa *bất kỳ thứ gì*; `an10.17:8.1` / `an10.18:9.1` bỏ nó, tầng `itarītara` có *bất…* 33/44 nơi).
  **Lượt review đối kháng bắt được 3 lỗi bản nháp, đã sửa; 4 điểm cân nhắc giữ nguyên.** Lỗi đã sửa: (1) `22.3` bản đầu ghi chủ ngữ *Tôn giả biết rõ* thay vì *Vị ấy biết rõ* (khuôn 3 nơi); đã đổi về khuôn tầng. (2) `23.1` / `23.2` / `23.4` / `25.3` bản đầu tự dịch *Thấu rõ ý nghĩ của tôi / bậc Đạo Sư vô thượng ở đời / bằng thần thông, Ngài đã đến gần / ba minh đã chứng đạt* dù Pāli trùng nguyên văn các khoá ở `tha-ap199`, `tha-ap78`, `tha-ap274`, `thag4.2`; đã đo rồi đổi theo tiền lệ, riêng `23.1` theo đa số *ý định* và `24.1` cũng đổi *ý nghĩ* thành *ý định* cho cùng một từ `saṅkappa`. (3) `6.1` bản đầu có hai chữ *và … và* liền nhau (*… ‘Xả, có niệm, an trú lạc’, và ông sẽ chứng và an trú …*); đã bỏ chữ *và* đầu. Điểm cân nhắc giữ nguyên: (a) `3.2` có thể viết *đã nghĩ đến* / *đã suy xét* thay *đã tư duy*; giữ *tư duy* để cùng một động từ `vitakketi` được dịch cùng một chữ ở `3.2` / `3.10` / `4.1`. (b) `17.2` giữ nguyên *bậc tỳ-kheo* của `an3.97`/`an3.98` dù các khoá khác trong bài viết *vị tỳ-kheo*, vì Pāli trùng nguyên văn. (c) `19.3` chọn *thiền thứ tư* (xem trên) để khớp `7.1`. (d) `15.2` giữ chữ *bất kỳ* cho `itarītara` dù `an10.17`/`an10.18` bỏ.
  **Bất định, ghi tại đây, không thêm vào thân kinh.** (1) `nippapañcārāma` / `nippapañcarata` (`3.11`, `13.13`, `14.3`, `21.1`, `21.4`, `24.3`–`24.4`): dịch theo nghĩa đen là *ưa thích / ham thích vô hý luận*, đối với `papañcārāma papañcarata` là *ưa thích / ham thích hý luận*; Sujato (*don’t enjoy proliferating and don’t like to proliferate*) và bản nguyên bài của Hòa thượng Thích Minh Châu (*không ưa hý luận, không thích hý luận*) đọc thành phủ định `không ưa …`, `an8.79:2.3` cũng viết *không thích hý luận* cho `nippapañcārāmatā`. Hai cách hiểu cho cùng ý (người ưa sự vắng hý luận ≈ người không ưa hý luận); bản này giữ dạng khẳng định của Pāli và dùng *vô hý luận* như `sn43.23:1.1`. (2) `Susumāragira`: Pāli ghi `suṁsumāragire` ở `1.1` nhưng `susumāragire` ở `2.1` / `13.1` (hai cách viết cùng tên chỗ); dịch cùng một tên *Susumāragira* theo `mn85:1.2`, `an8.48:1.1`, `an4.55:1.2`. `pācīnavaṁsadāye` dịch *khu rừng Pācīnavaṁsa* theo `mn128:8.1` (Sujato *Park of the East-Raftered Hall*; tên gọi là chữ Pāli, không dịch nghĩa). (3) `āyatikampi vassāvāsaṁ` (`12.3`, `22.1`): chữ `pi` có thể là *cũng* (thêm vào mùa an cư đang ở) hoặc nhấn mạnh; Sujato bỏ (*for the next rainy season residence*), bản Thích Minh Châu viết *nhân kỳ an cư mùa mưa sắp đến*. Giữ *cũng* ở cả hai khoá để không bỏ đơn vị nghĩa, nhưng không chắc đó là ý thêm. (4) `3.2` `yaṁ taṁ mahāpurisavitakkaṁ vitakkesi`: cấu trúc đồng căn (*tư duy tư duy*); câu Việt hơi lặp nhưng đúng Pāli, Sujato dịch *reflect on these thoughts of a great man*. (5) `8.1`–`12.2` `khāyissati`: nghĩa là *sẽ hiện ra / hiển lộ* (với ông như thế); không thêm *giống như*, vì dạng `seyyathāpi … evamevaṁ …` đã cho phép so sánh. (6) Bản Thích Minh Châu nguyên bài ghi *bảy niệm* ở 3.2 và *tám tư niệm* ở các khoá sau; Pāli `3.2`–`3.9` liệt kê bảy mục rồi `3.10`–`3.11` thêm mục thứ tám, nên *bảy* chỉ là bảy mục đầu, không mâu thuẫn. (7) `22.2` đồng công thức `an3.130:3.2` nhưng bản tầng ấy khác nhiều từ; không sửa `an3.130` (ngoài phạm vi). (8) `piṇḍiyālopabhojana` và `pūtimutta` giữ nghĩa sát chữ (nắm cơm khất thực / nước tiểu lên men), không bình giải về y học hay tập tục khổ hạnh.
  **Coverage Anh (công thức mục 7 của kho): mẫu số = 93 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); `english-sujato` phủ 93/93 (100%).** Các khoá Sujato bỏ trống (`25.5`, `25.6`, `26.0`–`26.4`) đều là câu kết hoặc uddāna dưới ngưỡng, không nằm trong mẫu số; `13.4` (`…pe…`) Sujato có (*Listen …*). Lớp `english-project` không có tệp cho `an8.30`; vì vậy không có phần English nào do dự án tự viết trong coverage. Tầng `vietnamese-current` phân đoạn không có (bilara chỉ có Pháp Cú); bản Hòa thượng Thích Minh Châu của `an8.30` có ở dạng nguyên bài (*Tra cứu toàn văn*, không căn theo segment) và đã được đọc đối chiếu thuật ngữ ; ta không sao chép mà viết lại từ Pāli (khác ở *ít ham muốn* so với *ít dục*, *tri túc* so với *biết đủ*, *ưa tụ họp* so với *ưa hội chúng*, *thiếu trí* so với *ác tuệ*, *vô hý luận* so với *không ưa hý luận*, *giáo hóa* so với *khuyến giáo*, và cách viết tên riêng). Ngưỡng 0,8 đạt (1,00); không cần ghi nhận gap. `triangulation` 9,2 vì English đối chiếu độc lập đầy đủ cả 93 khoá nhưng tầng Việt tham khảo chỉ ở dạng nguyên bài.
  **Phương án đã cân nhắc và loại:** (a) *không ưa hý luận* cho `nippapañcārāma` (Sujato, Thích Minh Châu, `an8.79`): đổi chiều khẳng định của Pāli thành phủ định; (b) *lan man* (`dn34:2.1.158`) cho `papañca`, chỉ 1 nơi so với 50 nơi *hý luận*; (c) *tứ thiền* cho `19.3` (xem trên); (d) *giống như … hiện ra* cho `khāyissati`, thêm chữ ngoài Pāli; (e) *biết đủ* cho `santuṭṭha` (46 nơi ở tầng nhưng chỉ 9 ở `an`, nơi `tri túc` 54).
  **Kiểm tra kỹ thuật:** bị cấm chạy cổng nên chưa tuyên bố pass; `technical_integrity` đặt 9,6. Cần chạy lại `npm run validate`, `npm test`, `npm run check`, `npm run build` trước khi gộp.
