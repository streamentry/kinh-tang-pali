notes: |-
  Lát c55. Mệnh đề 0.1 — đo lại: toàn tầng `an` là “Kinh …” 897 vs “Aṅguttara …” 353,
  nhưng riêng quyển 7 nghiêng ngược: “Aṅguttara” 52 vs “Kinh” 21 ⇒ “Aṅguttara Nikāya
  7.6”.

  Dùng khuôn có chủ ý: 0.2, 0.3, 1.1–1.3, 10.x, 11.x trùng nguyên văn với `an7.5` (bài kề
  ngay, đã có bản Việt) và 2.x–8.x trùng với `an5.47`; cả hai đều đã có ⇒ dịch nhất quán
  theo bản đã có, không tự tạo cách mới.

  0.3 `Vitthatadhanasutta` dùng **nguyên văn** `an7.5:0.3` “Kinh Bảy Loại Của Cải” —
  cùng Pāli, cùng nghĩa, cùng khuôn.

  12.1–12.4 `Tasmā saddhañca sīlañca, / pasādaṁ dhammadassanaṁ; / Anuyuñjetha medhāvī,
  / saraṁ buddhāna sāsanan` — cùng Pāli với `an4.52:7.1–7.4`, nhưng bản Việt của an4.52
  **parse lệch**: “Vì vậy, bậc trí hãy chuyên cần / với niềm tin và giới hạnh, / niềm tin
  và kiến giải pháp, / nhớ lời giáo huấn của các bậc Phật.” — lặp “niềm tin” hai lần và mất
  cả `pasāda` lẫn `dhammadassana`. Tôi dịch lại theo đúng cấu trúc Pāli: “Vì vậy, hãy
  chuyên cần vào / tín chân, giới hạnh, sự thanh tịnh / và sự thấy biết pháp; / hãy luôn
  nhớ lời giáo huấn của các bậc Phật.” an4.52 không thuộc lát này nên tôi không sửa tệp
  đó, chỉ báo ở đây.

  Dấu lược: 2.3, 3.2, 8.2 có `…pe…` ⇒ giữ **đúng một** `…` mỗi khoá, không mở rộng. 3.2
  nén đúng chỗ lược (năm giới), còn 2.3 nén đúng chỗ lược (giữa “Chánh Đẳng Giác” và “Đạo
  Sư”) vì đó là ranh giới Sujato cũng dùng.

  Thuật ngữ (đều có tiền lệ đếm được): “tài sản của đức tin” (an5.47), “tài sản của giới”,
  “tài sản của học tập”, “tài sản của buông xả”, `cāga` = “buông xả” (83 lần; khác với
  “bố thí” 815 — kho đã tách hai ngữ cảnh này); 4.2/5.2 dùng lại nguyên văn `an5.2:3.2`
  và `:4.2`.

  Triangulation 9.3: Sujato phủ 9/10 khoá Pāli ≥40 ký tự (90%). Khoá còn lại là
  `an7.6:2.3`, mà bản Anh đã ghim **để trống** và dự án đã có lớp lấp `english-project`
  (status `published`, khớp nguyên văn câu sau dấu lược) ⇒ coverage tính cả hai lớp là
  100%. Ở 2.3 tôi dùng lớp lấp làm đối chiếu thứ ba, nhưng nó do chính đợt dịch Anh của
  dự án sinh ra nên **không phải** bản Anh độc lập — cùng lý do khiến
  `english-project` bị chặn `triangulation ≤ 8.0`. `vietnamese-current` vắng.

  Bị chặn cổng kỹ thuật (không được chạy `npm run validate|test|check|build`), tiêu chí 10
  ở **9.6**: đã xác minh JSON hợp lệ, 42/42 khoá, không orphan/rỗng, NFC, dấu lược khớp
  từng khoá (0 lệch), ngoặc kép cân 1/1, không `(…)` đứng một mình. Bốn lệnh npm để
  coordinator chạy.