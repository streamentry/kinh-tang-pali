notes: |-
  Dịch từ Pāli root commit 11c9d708.
  Đối chiếu bản dịch tiếng Anh của Bhikkhu Sujato đã ghim: coverage tầng Anh 61/61 khoá Pāli có nội dung = 100.0%, không có gap dưới sàn. Lớp english-project không có tệp cho bài này.
  Bản Việt nguyên bài của Hòa thượng Thích Minh Châu được đọc đối chiếu như tra cứu toàn văn (không phải tầng segment); tầng vietnamese-current ở mức segment không phủ bài này.
  69/69 khoá khớp Pāli root tuyệt đối, đúng thứ tự khoá.
  Nháy kép và nháy đơn khớp Pāli từng khoá (0 lệch). Hai khoá có …pe… (12.3, 13.3) đều giữ đúng một dấu lược …; không có (…) trần.
  Pāli trùng nguyên văn trong bài: 10 nhóm (21 khoá), bản Việt khớp byte ở cả 10 nhóm, kể cả điệp khúc năm hạ phần kiết sử và công thức thuyết pháp.
  Bốn bài trong tầng có cùng văn Pāli (sn22.88, sn35.75; mn143 và mn144 cho bốn ví dụ cơn đau): dùng lại cách dịch dễ chịu / đủ sức, thuyên giảm / gia tăng, khoan vào đỉnh đầu, dây da chắc, dao mổ bò, hố than hồng. Hai bài sn22.88 và sn35.75 dịch Disvāna mañcake samadhosi thành chống tay vào chiếc giường mà ngồi dậy, trong khi Pāli chỉ nói samadhosi.
  Bất định ở 1.8 và 1.10: samadhosi. Bản này dịch cố ngồi dậy trên chiếc giường và đừng ngồi dậy trên chiếc giường, không thêm chống tay vì Pāli không nói; Sujato đọc stirred in his cot và don't get up, bản nguyên bài của Hòa thượng Thích Minh Châu đọc muốn rời khỏi giường. Hai bài sn22.88 và sn35.75 trong tầng dịch hơi khác ở cùng câu Pāli và nên được xem lại cho đồng nhất.
  Bất định ở 7.2, 7.5, 8.1: indriyāni vippasīdiṁsu dịch các căn trở nên trong sáng, theo tiền lệ sn28.2 (trong sáng) và Sujato (bright and clear); bản Hòa thượng Thích Minh Châu dùng sáng chói.
  Bất định ở 9.1, 11.5, 14.5, 15.1: kālena atthupaparikkhāya dịch xem xét ý nghĩa đúng lúc; lợi ích thứ ba và thứ sáu thực chất là suy tư pháp đã học, nhưng Pāli gọi là atthupaparikkhā nên giữ nguyên tên gọi, không giải thích thêm.
  Bất định ở 12.1 và các khoá tương ứng: upadhisaṅkhaye dịch sự hoại diệt tối thượng của các sanh y, theo tiền lệ sn4.25 (7 khoá dùng hoại diệt tối thượng của các sanh y; sn5.8 và an4.23 dùng diệt tận / đoạn tận); Sujato đọc supreme ending of attachments.
  Số Pāli: pañcahi orambhāgiyehi saṁyojanehi = năm hạ phần kiết sử (5); chayime ānisaṁsā = sáu lợi ích (6, đối chiếu sáu mục paṭhamo, dutiyo, tatiyo, catuttho, pañcamo, chaṭṭho = thứ nhất đến thứ sáu, khớp); hai người lực sĩ (dve balavanto purisā) = 2. 0 lệch.
  technical_integrity đặt 9.6: chưa chạy npm run validate, npm test, npm run check, npm run build trong phiên dịch này; cần chạy bốn lệnh ấy trước khi gộp.
