notes: |-
  Cấu trúc bài: mười vòng, mỗi vòng bốn khoá — phi pháp → pháp → điều bất lợi → điều lợi — rồi
  lặp lại nguyên văn lời dẫn ở `13.1–13.3`. Mười phi pháp theo đúng thứ tự Pāli: tà kiến · tà
  tư duy · tà ngữ · tà nghiệp · tà mạng · tà tinh tấn · tà niệm · tà định · tà trí · tà giải thoát.

  TẦNG THAM KHẢO — có đủ hai tầng có thể có. Tầng Anh Sujato đã ghim tồn tại:
  `translation/en/sujato/sutta/an/an10/an10.114_translation-en-sujato.json`, 52 khoá khớp
  Pāli, 51 khoá có chữ. Đo coverage theo đúng công thức `source/layers.yaml` (Pāli có nội dung
  ≥ 40 ký tự, loại block tham chiếu `:0`) cho **26/26 = 100%**, trên ngưỡng 0.8. Khoá duy nhất
  Sujato để trống là `13.5` (`Dutiyaṁ.`), vốn ngắn hơn 40 ký tự nên không tính vào mẫu số — đó là
  lỗi mất mát của tầng Anh bị loại có chủ đích, không phải chỗ trống thật. Tầng `vietnamese-current`
  vắng vì corpus Thích Minh Châu tại commit đã ghim chỉ có Pháp Cú (26 tệp). Không có lớp lấp
  `english-project` cho uid này và cũng không cần: tầng Anh đã ghim không để trống chỗ nào có nội dung.

  BẢN SONG SONG ĐÃ `published` — DÙNG LẠI NGUYÊN VĂN, ĐẾM ĐƯỢC. `an10.173` (Tatiyaadhammasutta,
  `published`) có **11 khoá Pāli trùng nguyên văn** với bài này; tôi dùng lại y hệt bản Việt đã có ở
  **8/11** khoá, kể cả khuôn bốn khoá `micchādiṭṭhi/sammādiṭṭhi/paccayā…/paccayā…` và khoá `13.4`.
  Ba khoá cố tình lệch là `1.1`, `13.1`, `13.3` — lý do ở dưới. `an10.113` (Paṭhamaadhammasutta)
  và `an10.171` cho tên mười phẩm và cho tên phẩm `12. Phẩm bước xuống`. `an10.172` cũng mang
  tiêu đề `Dutiyaadhammasutta` y hệt bài này nhưng **chưa** có bản Việt.

  HAI CHỖ TÔI CỐ TÌNH LỆCH BẢN ĐÃ CÓ, VÌ BẢN ĐÃ CÓ TỰ MÂU THUẪN VỚI CHÍNH NÓ. (1) `1.1` và
  `13.1`: Pāli là `Adhammo ca, bhikkhave, veditabbo dhammo ca` — **adhammo đứng trước**. Tôi dịch
  theo thứ tự Pāli: *cần phải thấy biết phi pháp và pháp*. `an10.173:1.1/5.1` dịch ngược lại
  (*pháp và phi pháp*), trong khi `an10.173:1.3/5.3` lại giữ thứ tự Pāli (*phi pháp và pháp*) —
  tức bản đã `published` ấy tự mâu thuẫn với chính nó. `an10.113:1.1` và `an10.171:1.1` đều giữ
  thứ tự Pāli. Ba trên bốn bản đã có giữ thứ tự Pāli, nên tôi theo số đông và theo Pāli làm
  authority. Người biên tập nên xem lại `an10.173:1.1` và `:5.1`. (2) `13.4`: Pāli
  `iti yaṁ taṁ vuttaṁ, idametaṁ paṭicca vuttan”ti.` không có chủ thể tích từ, nên tôi theo
  `an10.173:5.4`: *Do bởi vậy mà được nói như vậy; do bởi vậy mà nói là*; `an10.113:4.4` và
  `an10.171` thêm chủ thể *Ta* vào (`đó là điều Ta đã nói`) — đó là chữ thêm không có trong Pāli.

  DẤU `ti` — GIỮ, VÌ NHÓM BÀI SONG SONG GIỮ. `13.3` kết bằng `’ti,` nên bản Việt kết bằng
  `’ti,`; đây là khoá thứ ba tôi lệch `an10.173`. Trong nhóm bốn bài `an10.171/113/114/173`, hai
  bản giữ (`an10.113:4.3`, và nay là bài này) và một bản bỏ (`an10.173:5.3`). Ở tầng `an` nói
  chung thì ngược lại: đo trên toàn tầng (đã trừ bài này), khoá Pāli có `’ti` thì **giữ 30 / bỏ
  1.656**. Tôi theo số đông *trong nhóm bài song song*, vì đó là chỗ đọc liền mạch với `an10.113`
  và `an10.173`.

  TIÊU ĐỀ. `Dutiyaadhammasutta` → *Kinh Pháp (2)*. Trong chính loạt `Paṭhamaadhammasutta` /
  `Dutiyaadhammasutta` / `Tatiyaadhammasutta`, tầng Việt đã có *Kinh Pháp (1)* (`an10.113`,
  `an10.171`) và *Kinh Pháp (Ba)* (`an10.173`); loạt số ở dạng số là đa số trong `an10` (111/112,
  19/20, 211/212, 217/218, 56/57, 3/4/5), nên tôi dùng (2). Tên phẩm `Paccorohaṇivagga` → *12.
  Phẩm bước xuống*, theo giá trị `:0.2` của chính `an10.113`; tầng tên đã ghim xác nhận
  (`an-name:1483.an10-paccorohanivagga` → *The Chapter on the Ceremony of Descent*). LƯU Ý: cùng
  một phẩm mà `an10.113` ghi *12. Phẩm Lễ Xuống Nước* và `an10.117` ghi *12-paccorohanivagga* —
  ba cách, cần thống nhất.

  KHÔNG CÓ DẤU LƯỢC nào ở bài này: đo trên cả 52 khoá, Pāli có **0** `…pe…` và **0** `…` trần,
  nên không có chỗ nào có thể mở rộng hay bỏ. Trong chính bài này chỉ có **một** nhóm Pāli trùng
  nguyên văn (`anattho ca veditabbo attho ca.` ở `1.2` và `13.2`) và cả hai khoá có bản Việt
  giống hệt — bài không tự mâu thuẫn.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được
  JSON hợp lệ, `set(khoá Việt) == set(khoá Pāli)` (52 == 52, 0 thiếu, 0 thừa), 0 khoá rỗng,
  mọi giá trị NFC, dấu lược khớp Pāli từng khoá, mẫu nháy `“”` và `‘’` khớp Pāli từng khoá và
  cân trên cả bài, `(…)` không đứng một mình, không trùng nguyên văn Pāli (trừ `:0.1` vốn là tên
  bộ + số), không Pāli lọt vào, và YAML sạch. Bốn lệnh `npm run validate`, `npm test`,
  `npm run check`, `npm run build` để coordinator chạy.