notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.3, 5.2 — `appaṭivattiyaṁ` “không thể bị luân chuyển ngược lại” → “không thể bị xoay ngược lại” (cùng bài dùng “xoay chuyển” cho `vatteti` ở 2.2 và 5.1; các bài song song `an5.131`–`133` dùng “xoay lại”). Giữ nguyên phần còn lại của hai khoá.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt hai): khoá 5.2 — «chư thiên hay Ma Vương, hay Brahma» → «hay chư thiên, hay Māra, hay Phạm thiên» (đủ bốn `vā` của `devena vā mārena vā brahmunā vā`; `brahmā` là «Phạm thiên» ở 36/37 khoá cùng công thức, và «Māra» là dạng thông dụng nhất cho `māra`). Giữ nguyên khoá 2.3: «con người» đúng `manussabhūta`, bản đa số «người phàm» thêm sắc thái không có trong Pāli; giữ «Pháp luân ấy» ở 5.2 vì 5.1 dùng `dhammacakkaṁ`.
