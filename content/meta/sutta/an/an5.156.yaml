notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** Sáu khoá `2.2`, `3.3`, `4.4`, `7.2`, `8.3`, `9.4` bị cụt thành
  stub *Đây là pháp thứ hai …* v.v., mất vế `saddhammassa sammosāya antaradhānāya
  saṁvattati` và `saddhammassa ṭhitiyā asammosāya anantaradhānāya saṁvattanti`, và có
  dấu `…` bịa để che chỗ thiếu trong khi Pāli không có `…pe…`. Đã viết lại sáu khoá theo
  đúng văn bản của `1.5`/`5.4` và `6.5`/`10.4`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Hòa thượng Thích Minh Châu. 6 điểm bất đồng nghĩa → sửa 3 (9.1 và 9.3 `okkamane nikkhittadhurā paviveke pubbaṅgamā`: trước *không đi đầu trong sự thoái lui, không bỏ rơi sự viễn ly* → sau *bỏ rơi sự thoái lui, đi đầu trong sự viễn ly*, vì trong Pāli hai vế là khẳng định, không bị `na` phủ định, và cùng công thức ở `an2.44:2.2`, `an2.44:2.4`, `mn3:7.4` đều đã dịch theo hướng này; 10.1 `ekuddeso phāsuṁ viharati`: trước *một ràng buộc lời kinh … an trú vững vàng* → sau *cùng một lần đọc giới … sống an lạc*, vì `uddesa` là sự đọc/tụng giới và `phāsu` là an lạc chứ không phải vững vàng; cũng đổi `āgatāgamā` ở 3.1, 8.1 từ *thừa hưởng di sản* sang *thông hiểu truyền thống* cho khớp đa số tầng, 13 khoá so với 2), giữ 3 (4.2/9.2 `diṭṭhānugatiṁ`: giữ *bắt chước gương* theo cách tầng đã dùng và theo bản Anh, dù bản nguyên bài hiểu sát chữ là *đi theo tri kiến*; 3.2/8.2 `appaṭisaraṇo`: giữ *không còn ai gìn giữ* như `an4.160`, bản nguyên bài nói *không còn là chỗ nương tựa*; 5.2 `parikkhepā … pariccajanā`: giữ *ngăn cấm … xa lánh*, bản nguyên bài dùng *thanh trừng … tẩn xuất*, không rõ ràng hơn Pāli), bất định 0. Lỗi 9.1/9.3 cũng có trong bản Anh Sujato đã ghim (`not indulgent … leaders in backsliding`), nên khả năng cao đó là nguồn của nó. Bài này có bản Anh Sujato ở mức khoá; bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá.
