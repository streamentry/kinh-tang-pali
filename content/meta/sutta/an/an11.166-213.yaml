notes: |-
  Bản này là MỘT CÂU KỆ bị lược hai đầu, không phải bài kinh trọn vẹn: Pāli 1.1 là `…` rồi sáu
  vế `Cakkhusamphasse…` đến `manosamphasse…`, không có câu nào đủ nghĩa. Vì vậy TÔI KHÔNG mở rộng:
  mỗi vế giữ đúng MỘT dấu lược, và không thêm chủ ngữ, mệnh đề hay vế nào không có trong Pāli. Thêm
  chữ vào đây là bịa nội dung, không phải làm rõ.
  Tiền lệ đếm được. `samphassa` dịch "xúc chạm qua X" là chuỗi dài nhất tầng: sn25.4:1.2-1.7 và
  sn26.4 viết đúng `sự xúc chạm qua mắt / tai / mũi / lưỡi / thân / tâm`, 8 chỗ; sn14.2 và sn18.4
  dùng "xúc chạm của mắt", ít hơn. Tôi theo chuỗi 8 chỗ. Sujato 1.2 mở nháy kép và 1.7 đóng, Pāli
  gốc tại commit đã ghim KHÔNG có dấu nháy nào — tôi giữ theo Pāli: 1.1 `…` trần, 1.2-1.7 không nháy.
  Tiêu đề: `Paṭhamapaṇṇāsaka` dịch "Nhóm Năm Mươi Đầu" (5 tệp cùng cụm: an11.30-69, 70-117,
  118-165, 214-261, 262-309), KHÔNG theo an11.502-981 ("Bộ Mười Một Bài Kinh Đầu Tiên") vì
  `paṇṇāsaka` là nhóm năm mươi chứ không phải mười một, và Sujato cũng dịch "The First Fifty". Đây là
  chỗ tầng đang tự mâu thuẫn; tôi chọn theo nghĩa và theo đa số, ghi ra đây để người biên tập
  phán xét thống nhất. `Sāmaññavagga` → "Phẩm Sa-môn" (đúng tiền lệ an11.502-981).
  Sujato để trống toàn bộ 1.1-1.7 (chỉ có nhãn), nên ở bài này Pāli phải tự đứng vững — và nó đứng
  được, vì chỉ là liệt kê sáu căn xúc chạm. Không có bản Việt hiện hành (Hòa thượng Thích Minh Châu)
  ở commit đã ghim cho Tăng Bộ Aṅguttara.
