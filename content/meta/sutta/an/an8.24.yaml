notes:
  - >-
    **Cảnh báo về khuôn tải `Aṅguttara Nikāya` — đo lại, con số đã lệch.** Lệnh lát bảo dùng dạng `Kinh Tăng Chi Bộ` cho `0.1` của bài `an`, nói rằng đo được 862 tệp theo dạng đó và 342 tệp giữ Pāli. Tôi **đo lại trên đĩa hôm nay** và con số đã lệch: trong 1.600 tệp `an`, có **1.228** tệp có khoá `:0.1`; trong đó **875** viết `Kinh Tăng Chi Bộ` và **353** giữ `Aṅguttara Nikāya` (372 tệp không có khoá `:0.1` nào). Tỷ lệ chọn lựa thì không đổi, nên tôi **theo đo được**: dùng `Kinh Tăng Chi Bộ`. Hệ quả phải nói rõ: bài liền kề có thể lệch — `an8.25` viết `Kinh Tăng Chi Bộ 8.25` nhưng `an8.47` lại giữ `Aṅguttara Nikāya 8.47`, và `an6.33` cũng giữ Pāli. Việc này không đổi nghĩa segment nào.
  - >-
    **Mọi trích dẫn trong `notes` này đã tra bằng script** trên chỉ mục Pāli↔Việt tự dựng (5.032 bài, 88.415 chuỗi Pāli khác nhau) — trong đó **loại 8 tệp của chính lát này**, để không tự đếm bản dịch của mình làm tiền lệ.
  - >-
    **Coverage Anh đo bằng script, không suy.** Đo theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ, cộng `english-sujato` và `english-project` khi status là published). Cách đo đã được **kiểm lại** bằng bài đã có sẵn: chạy lại đúng công thức này trên `an5.249` cho ra **16/21 = 0.7619**, khớp con số đã ghi trong `blocking_errors` của chính tệp đó. Bài này đạt 18/18 = 100%, nhưng chỉ **16** khoá do Sujato và **2** khoá do bản lấp `english-project` của chính dự án (`1.19`, `1.20`) — nên `triangulation` hạ xuống, nên không cần mục trong `content/meta/reference-gaps.yaml` và không có blocker về tầng tham khảo.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo.** Tại commit đã ghim, tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) chỉ có Pháp Cú, nên **không có bản Thích Minh Châu để đối chiếu ở bất kỳ bài nào trong lát này**. Đối chiếu thuật ngữ vì vậy dựa vào Pāli root + bản Anh Sujato đã ghim + **tiền lệ đo được trong chính tầng Việt của kho**; `budsas.org` là tra cứu toàn văn, không dựng cột.
  - >-
    **Dấu lược — giữ đúng luật, không mở rộng.** Mọi khoá Pāli có `…pe…` đều giữ **đúng một** `…` trong bản Việt (luật §10.1 của BRIEF_VI3), và **không** khoá nào được thêm `…` để che chỗ thiếu. Ở những khoá lược, công thức bị nén đều là `peyyāla` mà bài đã phát lại đủ ở chỗ khác, nên nén thêm cũng không mất thông tin; tôi không mở rộng bất kỳ khoá lược nào.
  - >-
    **Bốn `saṅgahavatthūni` — đây là tiền lệ gần như trùng tuyệt đối, tôi dùng lại nguyên văn.** `an4.32:1.3` và `an4.256:1.3` đã dịch đúng danh sách `Dānaṁ, peyyavajjaṁ, atthacariyā, samānattatā—` thành **Bố thí, ái ngữ, lợi hành, và đồng sự**, và `saṅgahavatthūni` thành **bốn phương thức hội tụ**. Bài của tôi liệt kê đúng bốn pháp ấy, nên tôi dùng đúng bốn từ đó thay vì dịch lại thành *bốn điều kiện* (`dn30` còn dùng *bốn pháp sanh văn*) hay *bốn pháp nhiếp phục lòng người* (`cp34`) — mỗi cách 1 tiền lệ.
  - >-
    **4 khoá có Pāli trùng nguyên văn, dùng lại y hệt.** `1.1` khớp *Một thời, Đức Thế Tôn trú tại Āḷavī, tại đền thờ Aggāḷava.* (`an8.24` và `snp2.12`) · `2.4` khớp 1 tiền lệ · `2.14` khớp *Thứ tư.* (nhiều bài) · `0.2` khớp *3. Phẩm Gia Chủ*. `hatthako āḷavako` dịch **ông Hatthaka ở xứ Āḷavī** theo `an3.35` (*Rồi ông Hatthaka ở xứ Āḷavī, đang đi bộ tán hồ…*) và 3 bài nữa.
  - >-
    **Thuật ngữ tám pháp của Hatthaka — tiền lệ mỏng, nêu từng chỗ.** `saddho` → **có lòng tin** (2 tiền lệ, *có tín*) · `hirīmā` → **có lễ nghĩa** (cụm `hirīmāyaṁ … ottāpī` đã dịch *có hổ thẹn và kính sợ*) · `ottappī` → **cẩn trọng** (tiền lệ là *biết kính sợ*) · `bahussuto` → **đa văn** (rất nhiều tiền lệ) · `cāgavā` → **thí xả** (đa số) · `appiccho` → **ít ham muốn** (0 tiền lệ cho cụm `appiccho, bhikkhave`; nhưng `alpekho` đã dịch *ít ham muốn* nên theo đó) · `acchariyehi abbhutehi` → **kỳ lạ, chưa từng có** (0 tiền lệ cho cụm; Sujato *amazing and incredible*). Tám pháp này là danh sách peyyāla nên mỗi khoá phải giữ đúng một dấu `…` theo Pāli.
  - >-
    **Chỗ tôi không theo đa số: `Katamehi aṭṭhahi?`.** Đếm toàn tầng: *Với tám nào?* 9 bài (an8.3, an8.4, an8.16, an8.47, an8.58, an8.84, an8.87, an8.88, an8.89), *Tám pháp nào?* 4 bài (**kể cả 2 bài trong lát này**) cùng `dn33`, `mn54`, `sn45.10`. Tôi dùng **Tám pháp nào?** vì tân ngữ Pāli là `dhammehi` (tám **pháp**). Nếu người gộp muốn theo đa số thì phải đổi `an8.24:2.4` và `an8.48:2.2` cùng lúc.
  - >-
    **Tên kinh `Dutiyahatthakasutta` → *Kinh Hatthaka (Hai)* theo đa số đo được.** Trong `an` đo được **(Hai) 138** lần và **Thứ Hai** 88 lần cho các tên `Dutiya…sutta`, nên tôi theo dạng *(Hai)*.
  - >-
    **`technical_integrity` đặt 9.6 chứ không phải 10.0.** Đợt này lát bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên cổng kỹ thuật của repo **chưa chạy** và không thể tuyên bố là đã pass. Những gì đã quét bằng script riêng trên **mọi** khoá (không chỉ khoá ≥ 40 ký tự): JSON hợp lệ, đủ mọi khoá trong `all`, không khoá thừa so với Pāli, không khoá rỗng, NFC, không trùng nguyên văn Pāli, không Pāli lọt vào bản Việt, **số dấu lược khớp Pāli từng khoá**, và ngoặc kép cân trên cả bài (`ngoặc()` của `_hvi.py`). Cần chạy bốn lệnh trên trước khi merge.
