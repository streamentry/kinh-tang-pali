notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit 11c9d708.
  **Coverage Anh Sujato trên Pāli có nội dung (≥ 40 ký tự, bỏ khối đánh số `:N.0`): 15/15 = 100%.**
  Sujato im lặng đúng 1 khoá, `an10.97:12.2` (`Sattamaṁ.`, 10 ký tự) — ngắn hơn 40 ký tự
  nên không nằm trong mẫu số của cổng coverage. Tầng Việt hiện hành vắng ở commit đã ghim:
  bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng
  Thích Minh Châu để đối chiếu thuật ngữ; đây là đặc điểm của snapshot upstream, không phải
  thiếu sót của repo.
  **`content/meta/en/an/an10.97.yaml` không tồn tại và không cần tạo** — không còn khoá trống
  nào trong tập lấp của lớp `english-project`.
  **Bốn khoá dài dùng lại lời đã công bố, vì Pāli trùng hoặc chỉ khác chính tả:** `6.1`
  (trùng `mn108:18.1`, khác `parāmasati`/`parimasati`) · `9.1` (trùng `mn108:21.1`, khác
  `sukhadukkhappaṭisaṁvedī`/`…paṭisaṁvedī`) · `10.1` (trùng `dn10:2.32.2`, chỉ khác vì Pāli
  bài này **không** có `So` ở đầu và dùng dấu `;` thay `.`) · `3.1` (trùng `an4.22:4.4` và
  `mn53:14.1`, chỉ khác `,`/`.` và `sātthā`/`sātthaṁ`). Sáu khoá trùng NGUYÊN VĂN byte: `0.2`,
  `0.3`, `2.1`, `2.2`, `11.1`, `12.2`.
  **`11.1` dùng lại nguyên văn `an4.35:3.10` — Pāli hai bài GIỐNG HỆT TỪNG KÝ TỰ.** Hệ quả:
  cụm *tự thân thông suốt chứng ngộ* là một calque khó đọc mà tôi vẫn giữ, vì sửa riêng ở đây
  sẽ làm một bài trong cặp khác cách bài kia. Đây là điểm cần biên tập quyết định: nếu đổi
  thì phải đổi cả `an4.22:4.6`, `an4.35:3.10`, `dn34:1.7.92`, `mn108:23.1`, `mn119:42.1`.
  **Hai khoá cố ý khác tiền lệ, ghi lý do — đây là chỗ duy nhất trong bài tôi không theo đa số.**
  (1) `8.1` (`Parasattānaṁ parapuggalānaṁ cetasā ceto paricca pajānāti.`) trùng 3 bản và 3 bản
  đang chia **hòa 1–1–1**: `mn108:20.1` *Vị ấy với tâm bao quát…*; `mn119:39.1` *Vị ấy với
  tâm bao quát… — tâm có tham…*; và `an6.2:3.1` *…biết rõ từ tâm về tâm của các bậc Thánh
  khác, với bậc A-la-hán, với bậc Chánh Đẳng Giác*. Cải cách thứ ba **không đúng nghĩa Pāli ở
  đây** — nó nhét danh sách bậc Thánh vào một câu Pāli không hề có, nên tôi chọn cách thứ nhất.
  (2) `8.4`–`8.17` (14 khoá): cả 14 khoá đều trùng 4 bản (`mn119:39.4–17`, `mn77:33.22–34`,
  `an5.28:13.4–16`, `an6.2:3.4–16`) và **bốn bản ấy đều bỏ mất `vā`**. Tôi giữ lại: *Hoặc tâm
  có sân …*. `vā` là mối liên kết *hoặc* của danh sách; bỏ nó đi thì mất một phần quan hệ
  logic mà AGENTS.md yêu cầu giữ. Người đọc tiếng Việt đọc *Hoặc… Hoặc… Hoặc…* không thấy
  gượng. Tổng thể hai khoá đầu `8.2`/`8.3`/`8.17` tôi viết *Hoặc tâm có tham, vị ấy biết:
  ‘là tâm có tham’* để **một công thức cho cả chuỗi**, thay vì trộn hai văn phong đã có.
  **Thuật ngữ — kèm số đếm.** `Katamehi dasahi?` → *Mười pháp nào?* theo **24/29** bản ·
  `Idha, bhikkhave, bhikkhu sīlavā hoti…` → đa số **3/5** (đã loại 2 bản *"vị tỳ-kheo … đủ căn
  cơ và phẩm hạnh"* của `an10.17`/`an10.50`) · `Kalyāṇamitto hoti kalyāṇasahāyo
  kalyāṇasampavaṅko` → *có bạn lành, có bạn cùng, có bạn gần gũi*, đồng nhất 5 bản
  (`an10.17:3.1`, `an10.18:4.1`, `an10.50:6.1`, `dn33:3.3.11`, `dn34:2.3.10`) ·
  `sammādiṭṭhiko hoti sammādassanena samannāgato` → *có chánh kiến, đầy đủ với việc thấy chân
  chính*, 1 bản (`an8.57:1.6`) · `Dibbāya sotadhātuyā visuddhāya…` → *thiên nhĩ thanh tịnh,
  vượt quá tai người*, 2 bản (`dn34:1.7.86`, `mn119:38.1`) · `āhuneyyo pāhuneyyo dakkhiṇeyyo
  añjalikaraṇīyo anuttaraṁ puññakkhettaṁ lokassa` → *xứng đáng được cúng dường, được tiếp đón,
  được bố thí, được chắp tay lễ kính, là ruộng công đức vô thượng của thế gian*, theo 2 bản
  trong tầng `an` (`an10.16:1.1`, `an10.30:8.1`) · `Bahussuto hoti sutadharo sutasannicayo` →
  *là bậc đa văn, nhớ giữ và tích lũy những điều đã nghe*, theo `an4.22:4.4`.
  **Tên kinh — hòa 1–1, đã ghi để biên tập gộp.** `0.3` `Āhuneyyasutta` có đúng hai cách
  đã dùng: *Kinh Đáng Cúng Dường* (`an9.10`) và *Kinh Mười Bậc Đáng Cúng Dường* (`an10.16`).
  Tôi chọn **former** vì Pāli tiêu đề chỉ có `Āhuneyya-`; chữ *Mười Bậc* ở `an10.16` là do
  nội dung bài đó, và thêm vào đây là thêm chữ không có trong nguồn. Nếu biên tập chọn
  *phẩm* hơn thì phải sửa cả hai.
  **`0.2` `10. Upālivagga` → *10. Phẩm Upāli* theo 3/3** (`an10.92`, `an10.98`, `an10.100`) ·
  `0.1` → *Kinh Tăng Chi Bộ* (906 so với 371 trong tầng `an`) · `12.2` `Sattamaṁ.` → *Thứ bảy.*
  theo 255/259.
  **Ba khoá lấy từ Sujato một chỗ, đã kiểm lại bằng Pāli.** `6.1` mượn cách *ngồi kiết-già*
  (của chính bản `mn108`, không phải Sujato). Ở `9.1` Sujato gộp `pariyanto` vào *thọ mạng
  chừng ấy* — tôi theo Pāli tách *thọ mạng chừng ấy* như `mn108:21.1` đã làm. Ở `10.1` Sujato
  viết *in a good place or a bad place* cho `sugate duggate`; Pāli gọi tên hai loại cảnh giới
  (tốt/xấu), nên tôi dùng *cảnh giới tốt hay xấu* theo đa số bản Việt đã có.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì `technical_integrity` chỉ 9,6: npm run
  validate; npm test; npm run check; npm run build.
