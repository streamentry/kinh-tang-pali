notes: |-
  86 khoá, đủ mọi khoá của Pāli (86/86, 0 khoá thừa), thứ tự khoá đúng Pāli. Không có số lớn nào trong thân kinh; số duy nhất là tóm lược cuối bài: `Mettaṁ`1 + `paññā`1 + `dve piyā`2 + `dve lokā`2 + `dve vipattiyo`2 (`Devadatto ca uttaro` đứng đồng vị, hai bài) + `nando`1 + `kāraṇḍavena`1 = 10, khớp `Dasamaṁ` ở 11.7.

  **Coverage English (mẫu số 28 khoá Pāli có nội dung, từ 40 ký tự, bỏ khối `:0`): Sujato phủ 26/28 = 92,9% (trên ngưỡng 0,80).** Hai khoá Sujato bỏ trống là 3.3 và 3.4 (thân và lá của cây lúa mạch xấu, lặp 3.2 theo công thức); Pāli tự đứng vững và nghĩa song song với 3.2. Lớp english-project có hai khoá đúng cho 3.3 và 3.4 nhưng bài chưa có hồ sơ chấm English nên tôi không đếm vào coverage và không coi đó là cách đọc độc lập. Tầng vietnamese-current vắng ở commit đã ghim (chỉ Pháp Cú). Bản tiếng Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục tra cứu toàn văn chỉ được đọc để đối chiếu thuật ngữ, không phải tầng căn theo khoá, và không dùng để chép câu.

  **Pāli trùng nguyên văn trong chính bài: 7 nhóm, 48 cặp, 0 cặp mà bản Việt khác nhau** (2.7=4.2=5.6=6.6; 2.8=4.3=5.7=6.7; 2.9=4.4=5.8=6.8; 2.10=4.5=5.9=6.9; 2.11=3.9=4.6=5.3=5.10=6.10; 2.12=4.7=5.11=6.11; 4.1=5.5=6.5). Công thức đi đứng (2.6, 4.1, 5.5, 6.5) có Pāli giống nhau chỉ khác đầu câu `Idha` và `Evamevaṁ kho`, nên bản Việt khác nhau đúng ở phần mở.

  **Dùng lại tầng đã dịch (Pāli trùng nguyên văn):** 1.1 (`Một thời, Đức Thế Tôn trú tại Campā, bên bờ hồ sen Gaggarā.`, 1 trong 2 cặp); 2.1 (`Rồi Đức Thế Tôn bảo các tỳ-kheo:`, dạng phổ biến nhất, 9 trong 30 cặp); 2.11 và các khoá cùng dạng (`Vì sao vậy?`, 316 trong 470 cặp; riêng bộ Tăng Chi 88); 8.4 (`với tà kiến và không tôn kính.`, theo `an4.22:5.6`); 10.1 (`Hãy quăng bỏ đồ rác rưởi,`), 10.2 đến 10.4, 11.1 đến 11.3 theo `snp2.6` (Pāli trùng khoá `Kāraṇḍavaṁ niddhamatha` và `Niddhamitvāna pāpicche`; mấy khoá còn lại chỉ khác dấu câu hoặc chữ hoa); 11.7 (`Thứ mười.`, 263 trong 265 cặp); 12.0 (`Tóm lược:`, 359 trong 476 cặp). Công thức mn15 (`aññenaññaṁ paṭicarati, bahiddhā kathaṁ apanāmeti, kopañca dosañca appaccayañca pātukaroti`) lấy theo `mn15:3.29`: né tránh vấn đề, lái cuộc nói chuyện sang chuyện không liên quan, biểu lộ bực bội, sân hận, cay cú.

  **Chỗ tôi cố ý khác tiền lệ, nên người gộp xem lại:**
  `patissatā` ở 11.4 và `nipakā` ở 11.5. `snp2.6:10.2-3` và `mil7.7.7:4.2-3` (Pāli trùng) dịch là luôn tỉnh giác và khéo chánh niệm, tức hoán đổi hai từ so với cặp Pāli `nipakā patissatā` ở `an5.27` (tỉnh giác và chánh niệm), còn `mil7.7.10:4.4-5` dịch chánh niệm và sáng suốt. Tôi đi theo `an5.27` và `mil7.7.10`: `patissatā` → chánh niệm, `nipakā` → sáng suốt (19 khoá sáng suốt trong 44 khoá chứa `nipak`, dạng nhiều nhất). Cả ba tệp có Pāli trùng ở 11.4 và 11.5 đều có bản Việt khác tôi (hai tệp đầu hoán đổi hai từ, tệp thứ ba cùng nghĩa với tôi nhưng khác chữ); khuyến nghị xem lại `snp2.6` và `mil7.7.7`, ngoài phạm vi bài này.
  `0.2` và `11.8` (`Mettāvagga`): tôi dùng `1. Phẩm Từ` như `an8.1`, `an8.3`, `an8.4`, `an8.5` và ba bài cùng phẩm khác trong cây làm việc (đa số rõ rệt; `mettā` trong tầng dịch là từ ở tuyệt đại đa số khoá, chỉ 1 khoá là từ bi). Riêng `an8.9` đặt `Phẩm Từ Bi` có chủ ý và ghi trong notes của nó; hai cách đang lệch nhau, người biên tập nên chọn một và sửa cùng lúc.
  `vipatti` ở 12.2 → `Sự Thất Nghiệp` theo quy ước tầng (`an7.30:0.3`, `an8.7:0.3`; 33 khoá dùng, 0 khoá dùng từ khác). Tôi giữ quy ước, dù người đọc hiện đại dễ hiểu nhầm là mất việc làm; nghĩa trong kinh là sự hư hoại, sút kém (Sujato dịch Failure).

  **Thuật ngữ, chọn sau khi đếm tầng:** `āpatti` → tội (37 khoá có `tội`, 27 `phạm tội`; `codenti` → buộc tội); `bhaddaka` (tỳ-kheo) → hiền thiện, (lúa mạch, ngũ cốc) → tốt; `puggala` + `ekacca` → một cá nhân (`an4.104`, 33 khoá `ekaccassa puggalassa`); công thức `abhikkantaṁ…saṅghāṭipattacīvaradhāraṇaṁ` → đi tới đi lui, nhìn thẳng nhìn quanh, co duỗi, mang y ngoài, bát, y (giữ thứ tự Pāli; tầng còn dạng y ngoài, bình bát và y); `pāpiccha` → ác dục (39 khoá chứa `pāpicch`: ác dục 18, mong muốn xấu 10, cách khác 23; chọn dạng nhiều nhất, khớp `snp2.6:9.3` trùng 11.1); `kodhano` → hay nổi giận (tầng: giận 83, sân 31, nóng 20); `makkhī`/`paḷāsī` → xúc phạm/khinh miệt (`mn15:3.35`); `thambhī` → bướng bỉnh (`mn15:3.44`, `thaddho`); `issukī maccharī` → ganh tị, keo kiệt (`mn15:6.38`, `dhp262:4`); `saṭho` → xảo trá (`dn25`); `nāsenti` → tống ra (`sn37.30`); `niddhamati` → trục xuất cho người, quăng bỏ cho đồ rác (theo `snp2.6`); `yathātathaṁ` → đúng như thật (12 khoá); `samagga` → đoàn kết; `Tassuddānaṁ` → Tóm lược.
  Ba từ ẩn dụ chọn có chủ ý, nhất quán trong cả bài: `dūsī`/`dūseti` → làm hư hoại (cả người, lúa, hạt: `Mā aññe … dūsesī` giữ cùng gốc); `palāpa` → đồ bỏ đi trong danh xưng và trong kệ (theo `snp2.6:9.1`) nhưng hạt lép ở 5.1 (`mil7.7.10:3.3`, lúa lép); `kāraṇḍava` → rác rưởi (theo `snp2.6:8.3`). `sāravant` → đặc ruột cho cả hạt (5.1) lẫn cây (6.2), đối lập với `antopūtīni` (thối rữa bên trong); `avassuta` ở cây → rỉ nước (tầng dùng rỉ mủ hoặc mưng mủ cho người ở vài khoá cùng công thức `antopūti avassuto kasambujāto`).

  **Bất định ghi ở đây, không thêm vào thân kinh:**
  2.5 `Kiṁ vo tena paraputtena visodhitena`: dịch sát chữ là người ngoài ấy được làm cho trong sạch thì có ích gì cho các ông. Sujato dịch `vexed by an outsider`; bản Việt nguyên bài của Hòa thượng Thích Minh Châu bỏ khoá này. Tôi chọn cách ít giả định nhất theo Pāli (`kiṁ` + sở thuộc `vo` + công cụ cách `visodhitena`); sắc thái (không đáng tốn công thanh lọc một người đã không còn thuộc về Tăng) chưa xác định được bằng bằng chứng độc lập nên chỉ ghi ở đây.
  6.2 `kuṭhāripāsena`: 0 khoá tiền lệ trong tầng. Tôi dịch gõ bằng rìu; bản nguyên bài của Hòa thượng Thích Minh Châu nói cán búa, Sujato nói knock with the axe. Không thêm nghĩa sống hay cán rìu vào thân kinh.
  8.1 `janavati`: dịch giữa mọi người (khớp bản nguyên bài của Hòa thượng Thích Minh Châu, giữa người); Sujato không dịch riêng từ này. Dạng `-vati` hiếm, nghĩa này là cách đọc phổ biến chứ không chắc chắn.
  9.1 `saṁsappī`: luồn lách (Sujato dịch creep, Hòa thượng Thích Minh Châu quanh co). 29 khoá chứa `saṁsapp` trong tầng, không có cách dịch ổn định để theo.
  12.1 `dve piyā`: Pāli đọc piyā (ưa thích), còn tên hai kinh `an8.3` và `an8.4` là `Appiya` (bị ghét). Tôi dịch sát chữ Pāli là Ưa Thích và không sửa Pāli; nhiều khả năng là `appiyā` bị rụng a- đầu ở vần kệ, nên người đọc đối chiếu với tên hai kinh. Nếu người biên tập muốn thống nhất theo tên kinh thì đổi thành Bị Ghét.
  11.6 `karissatha` → các ông (nhắc lại `vo` ở 2.5 và Đức Thế Tôn nói với các tỳ-kheo); `snp2.6` dịch các vị.

  **Dấu lược và dấu câu:** Pāli không có `…`, bản Việt không có `…` (0 và 0). Nháy: 2.2 mở “ và 11.6 đóng ”; nháy đơn ‘ ’ ở 2.9, 3.7, 4.4, 5.8, 6.8 (7 khoá có nháy, 0 lệch so với Pāli từng khoá). Hai khoá `—` ở 2.6 và 4.1 giữ dấu gạch đúng cuối Pāli.

