  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.3, 2.3 (và đồng bộ cả
    bài, 1.1–1.5 và 2.1–2.5) — bỏ *muốn* trước *hoàn mãn* vì paripūressati
    là thì tương lai, không phải ý muốn → *sẽ hoàn mãn* (cùng an6.67); thêm
    nháy đơn ‘…’ bao trọn mệnh đề ở 1.2–1.5 và 2.2–2.5, và nháy kép mở ở
    1.1, cho khớp Pāli từng khoá. Các bài an5.22 trở đi cùng khuôn vẫn còn
    *muốn*, chưa đụng vào.
