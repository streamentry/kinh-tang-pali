notes: |-
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 3, sau chấm lại độc lập 2026-10-17): sửa 1.1, 2.1 (`thaddhā` «ngạo mạn» → «bướng bỉnh»: DPD thaddha 2 «stubborn; obstinate»; chú giải Itivuttaka cho cùng bài kinh «kodhena ca mānena ca thaddhamānasā … anonatā hutvā vicaraṇakā»; «ngạo mạn» trùng `atimānī`; như mn8, mn15, mnd14:156.15, iti108), 1.1, 2.2 (`unnaḷā` «buông lung» → «kiêu ngạo»: DPD unnaḷa «haughty; arrogant; conceited», Sujato «insolent», chú giải «naḷasadisaṃ tucchamānaṃ ukkhipitvā vicaraṇakā»; «buông lung» là `pamatta`), 1.3 (Pāli chỉ có năm mục `nikkuhā nillapā dhīrā atthaddhā susamāhitā`, Sujato cũng năm mục: bỏ «không ngạo mạn», «không mưu mô», «không buông lung» thừa, thêm `dhīrā` «hiền trí» bị sót, cùng chữ với 3.1), 3.1 (bỏ «không ngạo mạn» thừa), 3.2 (`atthaddhā` «không mưu mô» → «không bướng bỉnh»: DPD atthaddha «not stubborn»), 1.2, 1.4 (`vepullaṁ` «sự phổ biến» → «sự viên mãn»: DPD vepulla «full development; maturity», Sujato «maturity», chú giải «sīlādidhammakkhandhapāripūriyā vepullaṃ»; như mnd14:156.15), 2.3, 3.3 (`dhamme … sammāsambuddhadesite` vị cách số ít: «trong các pháp» → «trong Pháp», Sujato «in the teaching»); giữ `kuhā` «gian trá», `lapā` «nhiều lời», `siṅgī` «mưu mô» (cùng nghĩa DPD, khác chữ iti108), `te ve` (tiểu từ nhấn mạnh); bất định tiêu đề «Kinh Bậc Gian Trá» («bậc» là từ tôn xưng, «kẻ» hợp hơn; đổi tiêu đề để người biên tập quyết).
