notes: |-
  **Phạm vi:** 74/74 khoá, đúng tập khoá và thứ tự Pāli, 0 khoá ngoài tập. Bài song trùng Pāli với `ud4.1` (cùng câu chuyện Meghiya) và với `an9.1` (cùng phẩm: danh sách năm pháp và bốn pháp tu tập thêm).

  **Coverage English (đo thật):** mẫu số = 64 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`). Bản Sujato đã ghim phủ **53/64 = 0,8281** (≥ ngưỡng 0,80). 11 khoá còn lại (`4.1 4.2 4.3 4.6 4.7 9.1 9.2 9.4 9.5 9.6 9.7`) là các đoạn Meghiya kể lại lời mình, Sujato để trống; lớp `english-project` đã `published` lấp 11/11 nên cổng tính 64/64 = 1,0000, nhưng lớp lấp do cùng một tác giả viết nên **không phải đối chiếu English độc lập** — độc lập chỉ có 53/64. Không có tầng Việt hiện hành trong store cho bài này. Vì vậy `triangulation` hạ xuống 8,9 và không tuyên bố đã đối chiếu English cho toàn bài. Bài không có record trong `reference-gaps.yaml`, và coverage Sujato một mình đã đạt ngưỡng nên không cần record.

  **Đối chiếu ngoài store:** đã đọc bản Việt Thích Minh Châu nguyên bài ở mục tra cứu toàn văn (không phân đoạn, không phải tầng store) để phân xử bốn điểm: `padhāna` → *tinh cần* (TMC dùng *tinh cần*); `Yassadāni … kālaṁ maññasī` → *làm điều ông thấy là thích hợp* (TMC: *làm những gì Thầy nghĩ là hợp thời*, không thêm động từ *đi*); `paṭicaya` → *bồi đắp cho những gì đã làm*; `sammā dukkhakkhayagāminiyā` → *một cách đúng đắn*. Các chỗ khác Pāli quyết định.

  **Dùng lại bản Việt đã có:** đã dò 41/74 khoá có Pāli trùng nguyên văn (bỏ dấu câu, chữ hoa) với khoá ở bài khác trong tầng Việt (`ud4.1`, `an9.1`, các bài `an` khác cho nhãn `Thứ ba.`, `Thế nào là năm?`, `1. Phẩm Giác Ngộ`). **28/41** dùng lại nguyên văn; **13/41** khác có chủ đích, lý do ghi dưới đây. Pāli trùng nguyên văn **trong chính bài**: 13 nhóm = 15 cặp (1.5/6.6, 2.6/4.7, 3.1/8.1, 4.8/5.4/6.4, 4.9/5.5, 5.2/6.2, 5.3/6.3, 7.3/9.2, 7.5/9.4, 7.6/9.5, 7.7/9.6, 7.8/9.7, 15.1/16.1); **0/15** cặp bản Việt khác nhau (chỉ khác dấu nháy theo Pāli từng khoá).

  **13 chỗ khác `ud4.1` và lý do:**
  · `padhāna(ya)` → *tinh cần* (8 khoá: 2.5 2.6 4.6 4.7 4.8 5.4 6.4 6.5), `ud4.1` viết *tinh tấn*. Lý do: bài có `āraddhavīriyo` (13.1) dịch *tinh tấn*, nên hai gốc Pāli `padhāna` và `vīriya` được giữ khác nhau; tầng `an` đã dịch `padhāna` là *tinh cần* (`an10.94`, `an2.2`) và `sammappadhāna` là *chánh cần*; TMC cũng *tinh cần*.
  · `alaṁ vatidaṁ kulaputtassa …` (2.5, 4.6): *thật thích hợp cho* thay vì *thật xứng đáng cho* — `alaṁ` là *đủ / hợp*, không mang nghĩa *xứng đáng* (Sujato *good enough*).
  · `1.5`, `6.6` (cùng Pāli): *ông … nay ông thấy lúc nào thích hợp thì cứ làm* thay vì *ngươi … hãy đi khi ngươi thấy thích hợp*. Đại từ: trong tầng `an`, Đức Phật gọi một tỳ-kheo bằng *ông* ở 20 khoá, *ngươi* ở 4 khoá. Động từ: Pāli không có *đi*; lời đáp phải đúng cho cả hai chỗ (xin khất thực, và xin vào rừng xoài tinh cần).
  · `4.9`, `5.5`: bỏ *chúng ta* (Pāli `ekakamhi` không có đại từ), thêm *thêm* cho `aññopi`, *chờ cho đến khi* cho `yāva … āgacchati`.
  · `6.5`: *ông nói đến sự tinh cần, thì Ta biết nói gì?* — Pāli không có nháy đơn quanh `padhānanti`, bản Việt không thêm.
  · `7.6`, `9.5` (và `7.7`, `9.6`): `vatamhā … pabbajitā … anvāsattā` là **số nhiều** (ngôi thứ nhất), nên dịch *Chúng ta … xuất gia … bị … đeo bám*, thay vì *Ta*. `anvāsattā` → *đeo bám* (không dùng *xâm chiếm* vì Pāli không nói chiếm quyền). Xem bất định bên dưới.
  · `9.1`: giữ `Idha` → *ở đây* (ud4.1 bỏ).
  · `14.1`: *tuệ về sự sinh khởi và hoại diệt* theo công thức `udayatthagāminī` của tầng `an` (an9.1 và nhiều bài khác), *một cách đúng đắn* cho `sammā`; `ud4.1` viết *thấy sự sinh diệt … hoàn toàn*.
  · `19.1`: `Tena ca pana` → *Và … vị tỳ-kheo ấy, sau khi đã đứng vững trên năm pháp này, cần tu tập thêm bốn pháp*, theo cấu tạo `bhikkhunā … patiṭṭhāya … bhāvetabbā` (chủ thể là vị tỳ-kheo ở 15–18).
  · Thêm: `1.1` viết *núi Cālikā* (cùng gốc với *Cālikā*, `ud4.1` viết *Cālika*).

  **Thuật ngữ, hai phạm vi cho đa số khác nhau:** `vitakka` → *tư tưởng* (`ud4.1`, `an9.1:14.2` cùng Pāli: 19 khoá `kn`; và để cả bài nhất quán), nhưng toàn tầng `an` dùng *tầm* ở 30 khoá và *tưởng về* ở 9 khoá (TMC cũng *tầm*). Giữ *tư tưởng* vì các khoá trùng nguyên văn Pāli (7.3, 9.2, 19.2) đã được dịch như vậy ở `ud4.1` và `an9.1`; **nếu biên tập muốn thống nhất sang *tầm*, phải đổi cả `ud4.1` và `an9.1`**. `Katame pañca?` → *Thế nào là năm?* (toàn tầng `an` 107 vs *Là năm nào?* 29; `an9.x` 6 vs 2). `bhante` → *Bạch Thế Tôn*. `abhisallekhikā cetovivaraṇasappāyā` → *thanh thoát tâm, thích hợp để mở rộng tâm* (công thức của `an9.1`, `an10.30`, `an5.90`, `an5.97`: 7 khoá).

  **Số Pāli (tự tính):** `pañca dhammā` = 5 và năm mục đếm đủ (`kalyāṇamitta`, `sīlavā`, `kathā`, `āraddhavīriyo`, `paññavā`); thứ tự `paṭhamo, dutiyo, tatiyo, catuttho, pañcamo` = 1, 2, 3, 4, 5 khớp 10.4, 11.2, 12.2, 13.2, 14.2; `cattāro dhammā` = 4 và bốn mục (`asubhā, mettā, ānāpānassati, aniccasaññā`); `tayo … vitakkā` = 3 và ba mục; `Dutiyampi` = lần thứ hai, `Tatiyampi` = lần thứ ba. Tính tay, đối chiếu với `ud4.1` và `an9.1`; không có số lớn hay cấu tạo số ghép.

  **Bất định, ghi thẳng, không thêm vào thân kinh:** (1) `vatamhā … pabbajitā`, `anvāsattā` là số nhiều; Sujato, TMC và `ud4.1` đều dịch số ít (*I / Ta*). Pāli là authority nên giữ *chúng ta*; có thể là cách nói chung của người xuất gia. (2) `ekakamhi tāva` — ai là *một mình*: ba nguồn tham khảo đọc *chúng ta chỉ có một mình*; Pāli không có đại từ nên bản Việt để trống chủ ngữ. (3) `Yassadāni` — không có động từ; *làm* hợp cả hai ngữ cảnh. (4) `abhisallekhikā` (Sujato *self-effacement*) giữ công thức *thanh thoát tâm* của tầng `an`, chưa chuyển sang nghĩa *tự diệt trừ*; đề nghị xem lại cả nhóm khi biên tập. (5) Khoá `4.4 4.5 9.3 19.5` dưới ngưỡng 40 ký tự nên không vào coverage nhưng đã dịch đủ.

  **Kiểm đã làm:** tập khoá Việt = tập khoá Pāli (74/74); nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá (74 khoá × 4 loại dấu, 0 lệch); dấu lược khớp Pāli (4 khoá có `…pe…` là 15.2, 16.2, 17.1, 18.1, mỗi khoá đúng một `…`; 0 khoá `(…)` trần trong Pāli); không Pāli lọt sang bản Việt; NFC; không khoá rỗng, không khoảng trắng thừa; đã in cặp Pāli–Việt ra đọc.

  **technical_integrity 9.6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này nên không tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều phối.
