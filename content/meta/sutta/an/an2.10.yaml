notes:
  - >-
    **Cấu trúc chung của nhóm này**: bốn segment — `“Dveme/Dvemā/Dvemāni,
    bhikkhave, X.` / `Katame/Katamā/Katamāni dve?` / *hai danh từ* /
    `Imā/Ime/Imāni kho, bhikkhave, dve X”ti.` Nghe thì giống nhau 59 bài, nhưng
    **mỗi danh từ là một khái niệm khác nhau**, nên tôi dựng từng cặp riêng chứ
    không dùng một bảng dịch chung — nếu không, 21 vế `āmi…/dhamma…` ở
    `an2.141`–`an2.162` sẽ thành 21 câu máy móc.
  - >-
    **52/59 bài trong nhóm không có khối `:0` trong Bilara** (thiếu cả `0.1` lẫn
    `0.2`), và 6/59 có `0.1`+`0.2` nhưng thiếu `0.3`. Tôi **không thêm** khoá
    `0.x` không có trong Pāli — sẽ tạo segment ma, và bộ kiểm tra sẽ chặn. Hệ
    quả phải nói thẳng: **người đọc sẽ không thấy tên phẩm ở 52 bài này.** Tên
    phẩm nằm ở `translationTitle` trong metadata. Đây là hạn chế của bản chụp
    upstream, không phải lựa chọn của tôi.
  - >-
    **Số thứ tự phẩm trong AN 2 đánh số lại một lần nữa** — `an2.21:0.2` là *3.
    Bālavagga* và `an2.98:0.2` cũng là *10. Bālavagga*; `an2.32:0.2` là *4.
    Samacittavagga* còn `an2.87:0.2` là *9. Dhammavagga*. Vì vậy `an2.97:1.5`
    (`Dhammavaggo catuttho`, tức thứ tư theo lần đánh số **thứ hai**) và
    `an2.129:1.5` (`Āsāduppajahavaggo paṭhamo`, tức thứ nhất dù `an2.118:0.2`
    cùng phẩm lại ghi *11.*) **không phải lỗi đếm của tôi**. Tôi dịch theo Pāli
    vì Pāli là authority.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    **Bài khép cả phẩm kèm uddāna.** `Tassuddānaṁ` → *Tóm lược:* theo nguyên văn
    `an10.80:2.0` (đã `published`); bốn vế của uddāna liệt kê tên các bài trong
    phẩm, tôi kệ danh và dấu chấm phẩy như Pāli. `Upaññātena pañcamaṁ` không
    phải tên bài mà là *“Upaññāta là bài thứ năm”*, nên tôi dịch thành câu chứ
    không kệ như tên. `Kaṇha`/`Sukka` ở đây là **tên rút gọn của
    `an2.7`/`an2.8`**, không phải hai từ *tà*/*thiện* — tôi giữ nguyên dạng Pāli
    để không nhân bản nhầm. `Vajjā`, `Padhānā`, `Saṁyojana`, `Upaññāta`,
    `Cariyā` (0 tiền lệ, giữ dạng Pāli vì không có bản dịch nào đã duyệt).
  - >-
    **`vassūpanāyikā` → *cách vận hành thượng tọa*** (0 tiền lệ, đặt mới).
    `Purimikā ca pacchimikā ca` là lực ngắn thiếu danh từ; tôi nói rõ *cách vận
    hành thượng tọa trước / sau* để câu đọc được, và ghi ở đây vì đó là chỗ tôi
    chủ động nối lại chữ bị lược.
