notes: |-
  Giải quyết draft 2026-10-12 (thay thế lượt chấm 2026-09-13 của GLM-5.3 Flash; blocker cũ "cắt ngắm" đã gỡ).
  Blocker cũ (loại D, nay không còn đúng thực tế): "cắt ngắm — 1 khoá có dấu lược … mà Pāli không có" ở `an3.128:2.4`. Đọc lại: bản Việt không có dấu `…` ở bất kỳ khoá nào; Pāli `2.4` là câu đầy đủ ("rồi Đức Phật, sau khi khất thực ở Bārāṇasī, từ cuộc khất thực trở về sau bữa ăn, gọi các tỳ-kheo:") và bản Việt dịch đủ. Dấu `…` chỉ có ở khoá `2.4` của tầng Anh Sujato (câu của Sujato nén phần lặp rồi để trống các khoá `3.1`–`3.3`, `4.1`–`4.3`), không phải ở bản Việt. Đo lại: 0 dấu `…`, 0 khoá Việt có `…` mà Pāli không có. Blocker gỡ.
  Đọc đối kháng toàn bài (42 khoá; 30 khoá đổi nội dung). Lỗi nghĩa thật:
  1) accuracy: `attānaṁ` (mình) bị dịch "tâm mình" ở `2.1`/`2.2`/`4.1`/`4.2`/`5.4`/`7.1` — Pāli không có `citta` ở đây; sửa thành "mình"/"ông".
  2) accuracy: `netaṁ ṭhānaṁ vijjati` ở `2.2`/`4.2`/`5.4` bị dịch "không có gì khác" — sai cấu trúc. Pāli là "ruồi sẽ không sà đến, không bâu vào — trường hợp ấy không có" (phủ định của một khả năng); bản cũ đảo thành khẳng định lỏng lẻo. Sửa, `nānupatissanti` = "không sà đến", `nānvāssavissanti` = "không bâu vào" (cùng gốc `anupatati` ở `6.3`).
  3) accuracy: `8.4` có "này các tỳ-kheo" và "chỉ có" không có trong Pāli (`makkhikāhi purakkhato`); `8.2` thêm "nếu" (Pāli là phân từ `aladdhā`); `9.4` thêm "vì … sạch" (`nāsayitvāna` = "sau khi diệt trừ"); `7.4` "bức bối làm phần" lủng củng — `vighātasseva bhāgavā` = "chỉ được phần bực bội" (tiền lệ `vighātassa bhāgī` ở mn21 "chuốc lấy … bực bội").
  4) terminology: `vitakka` ở `5.3` đang là "tưởng" (lẫn với `saññā`); tiền lệ đo trên khoá có `pāpakā akusalā vitakkā`: 23/27 khoá dùng "suy nghĩ", 4/27 dùng "tưởng" ⇒ đổi thành "những suy nghĩ xấu, bất thiện" (mn20). `saṅkappā rāganissitā` ở `6.4`: "tưởng gắn với dục" sai cả `saṅkappa` (ý nghĩ) lẫn `rāga` (tham đắm, không phải `kāma`) ⇒ "những ý nghĩ nương vào tham đắm". `abhijjhā` ở `5.1` bị dịch "tham ái" (đó là `taṇhā`) ⇒ "tham muốn" (tiền lệ mn9, mn40, dn33). `āmagandha`: "tanh hôi" ⇒ "hôi tanh" (an6.54:22.1 "Không mùi hôi tanh", snp2.2 "Kinh Mùi Hôi Tanh").
  5) accuracy: `1.3`/`3.2` `pākatindriyaṁ` dịch "các căn không chế ngự" (đó là `asaṁvuta`/`indriyesu asaṁvutaṁ` ở `6.2`) — `pākatindriya` có tiêu đề sn9.13 "Các Căn Phóng Túng" ⇒ "các căn phóng túng". `goyogapilakkhasmiṁ`: "cây đề lá lượn" là dịch lại Sujato, và "đề" (bồ-đề) sai loài: kho giữ nguyên `pilakkha` (sn46.39, sn35.231) ⇒ "gần cây pilakkha, nơi buộc bò". `muṭṭhassati` "mất niệm" ⇒ "thất niệm" (73/92 khoá, "mất niệm" 6/92).
  6) `saṁvegamāpādi` ở `2.3`/`4.3`: "sinh lòng xúc động hoảng sợ" — "hoảng sợ" không có trong Pāli; tiền lệ sn9 "khởi lên niềm khẩn thiết" ⇒ sửa. `iminā ovādena ovadito` giữ đúng cấu trúc bị động "được … khuyên dạy bằng lời khuyên này" (bỏ "Nghe").
  7) clarity/alignment: `4.5`–`4.7` bỏ nháy đơn `‘ ’` quanh thuật ngữ (Pāli không có nháy ở các khoá này; nháy giờ khớp Pāli từng khoá). `7.3` "xa lìa Niết-bàn" ⇒ "xa Niết-bàn". `5.1`: giữ vị trí hô cách `bhikkhu`.
  Giữ nguyên (đã đúng): tiêu đề "Kinh Vị Đắng" (`Kaṭuviyasutta`), `bārāṇasī`/`isipatana`, `asampajānaṁ`, `vibbhantacittaṁ` = "tâm tán loạn" (mn4, mn29, mn30), `byāpādo` = "sân hận", `dummedho` = "thiếu trí" (an6.45, thag17.1), `purakkhato` = "được … tôn vinh" (tiền lệ dn16:4.41.6 "được tôn kính").
  Blocker còn lại: không. Phân loại: blocker duy nhất đã có là loại D (cắt ngắm) và đã gỡ như trên; không có blocker loại B/C trong hồ sơ này. Ghi nhận để công cụ xử lý: tầng Anh Sujato bỏ trống `3.1`–`3.3`, `4.1`–`4.3` (6 khoá lặp lại `1.2`–`1.4`/`2.1`–`2.2`) và khoá `2.4` kết bằng `…`; các khoá này tự đứng vững từ Pāli (lặp lại đúng các câu `1.x`/`2.x`, đã đối chiếu từng cặp, 0 cặp Việt khác nhau ngoài chuyển ngôi Ta/Đức Phật). Tầng Việt hiện hành không có cho bài này (giới hạn của snapshot upstream, không phải lỗi văn bản).
  Bất định còn lại: (a) `rittassādaṁ bāhirassādaṁ` ở `1.3`/`3.2`: dịch sát chữ "trống vắng hứng thú, hứng thú ở bên ngoài"; Sujato đọc "disgruntled, looking for pleasure in external things" (bất mãn, tìm vui ở ngoài) — không nhập nghĩa chú giải (thiền vị) vào lời kinh. (b) `pareti` ở `8.3`: Sujato "departs", bản này dùng "đi lại" (nghĩa "đi quanh") — chưa phân xử được giữa "đi lại" và "ra đi". (c) `purakkhato` ở `8.4` có thể là "đi trước/vây quanh" hơn là "tôn vinh"; chọn "tôn vinh" theo dn16 và Sujato.
  Số Pāli: không có số trong bài. Pāli trùng nguyên văn trong bài: 3 cặp (`1.3`/`3.2`, `2.1`/`4.1`, `2.2`/`4.2`/`5.4` khác nhau ở dấu phẩy và `bhikkhu`); bản Việt nhất quán ở cả ba (0 cặp khác nhau). Phép đo: tập khoá 42/42 khớp Pāli, thứ tự khớp; nháy đơn/kép và `…` khớp Pāli từng khoá (0 lệch); NFC, khoảng trắng 0 lỗi.
  Triangulation: chỉ có Sujato, trống 6 khoá lặp (xem trên); không có tầng Việt hiện hành ⇒ `triangulation` 8,0 (không cao hơn). `technical_integrity` 9,6: bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
