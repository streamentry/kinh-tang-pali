notes:
  - >-
    Thuộc cụm *AN 10 chương 13, Phẩm Thanh Tịnh*. Mười bài dùng chung một công
    thức liệt kê, nên segment có Pāli giống hệt nhau đã dùng lại đúng cách dịch
    đã chốt, không dịch lại mỗi bài một kiểu. Cụm này đồng thời là tiền lệ cho
    khoảng hai trăm bài liệt kê còn lại của AN 10.
  - >-
    Thuật ngữ bám theo số đo trên toàn corpus, không phải sở thích: `sammā-` →
    "chánh …" (chánh kiến 312, chánh niệm 274, chánh trí 92, chánh tư duy 70,
    chánh ngữ 67, chánh nghiệp 62, chánh mạng 56, chánh giải thoát 25 lần);
    `Dasamaṁ.` → "Thứ mười." (~90 lần mỗi thứ tự); `Katame dasa?` với danh từ
    `dhammā` → "Mười pháp nào?"; dấu lược `…pe…` của Pāli được giữ nguyên.
  - >-
    Hai thuật ngữ cố ý không theo `an4.205`/`an4.206`: `sammāājīvo` dịch "chánh
    mạng" (56 lần) chứ không phải "chánh mệnh" (9 lần), và `sammāñāṇaṁ` dịch
    "chánh trí" (92 lần) chứ không phải "chánh tri" (29 lần). `ājīva` là *sinh
    tài* còn "mệnh" là *số phận* — dùng "mệnh" là sai nghĩa. Xem
    `docs/translation-notes/terminology-micchatta-list.md`.
  - >-
    Không đối chiếu được tầng Việt hiện hành. Bilara tại commit đã ghim chỉ có
    Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để đối
    chiếu thuật ngữ. Đây là giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
