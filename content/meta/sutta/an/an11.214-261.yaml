notes: |-
  Bài uid-gộp gồm đúng 11 khoá và cả 11 khoá đều mang CHÍNH uid gộp (đã mở thẳng tệp Pāli
  và đếm, không suy từ tên bài). Đây là khối TÓM LƯỢC của 48 bài AN 11.214–261: bốn khoá
  tiêu đề, một khoá lược trống, rồi sáu vế bài đố kê sáu loại cảm thọ theo sáu căn.

  DAU LUOC THEO BRIEF_VI3 §10.1. Tệp Pāli dùng DẤU LƯỢC TRẦN (không phải …pe…) ở cả bảy khoá
  1.1–1.7. Tôi giữ đúng MỘT … mỗi khoá và không viết thêm chữ nào ở chỗ bị lược. `an11.992-1151:1.1`
  là tiền lệ cho việc giữ dấu lược trần, và `an11.502-981:1.3` + `2.1` + `2.2` cho việc khoá
  riêng chỉ còn … (hai dấu lược của Pāli giữ thành hai dấu lược của Việt, không gộp).

  TAU THAM KHAO DAY DU: 11/11 khoá có chữ trong bản Anh Sujato đã ghim. Không có bản Việt
  hiện hành cho Tăng Bộ tại commit đã ghin (bilara chỉ có Pháp Cú), nên triangulation là
  Pāli + English Sujato và tôi chấm vừa phải cho đúng lý do đó.

  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất của bài này chỉ 31 ký tự, nên
  `cần` trong `kiểm()` của _hvi.py rỗng và mọi assertion không chạy lần nào. Tôi tự quét
  11/11 khoá bằng chính các hàm đó: đủ khoá, đúng ID, không rỗng, NFC, dấu lược khớp từng
  khoá (1 = 1 ở cả bảy khoá thân), nháy kép mở ở 1.2 và đóng ở 1.7 nên cân trên cả bài,
  không còn (…) rỗng.

  THUAT NGUM, DEM DUOC. `Sāmaññavagga` → *Phẩm Sa-môn* dùng lại NGUYÊN VĂN (tiền lệ 16 khoá
  tính cả của lát này). `Paṭhamapaṇṇāsaka` → *Nhóm Năm Mươi Đầu*: tầng đang có ba cách, tôi
  chọn của an11.982 và đo lại trên đĩa là 4 lượt, so với *Bộ Mười Một Bài Kinh Đầu Tiên*
  (an11.30-69, an11.358-405, an11.502-981 — 3 lượt, và cách này SAI: paṇṇāsaka là bộ năm mươi,
  không phải mười một bài kinh) và *1. Paṭhamapaṇṇāsaka* (an11.992-1151, 1 lượt, chưa dịch).
  `~` ở 0.4 giữ nguyên dấu, đúng ba tiền lệ an11.982 / an11.502-981 / an11.992-1151.
  `:0.1` tôi viết đủ dải Aṅguttara Nikāya 11.214–261: Pāli chỉ ghi Aṅguttara Nikāya 11, nhưng
  bảy bài uid-gộp khác của AN 11 trên đĩa đều viết đủ dải lấy từ uid, và Sujato cũng ghi đủ
  dải. Đây là khối TIÊU ĐỀ, không phải thân bản.

  SÁU VẾ BÀI ĐỐI. `Cakkhusamphassajāya vedanāya…` … `manosamphassajāya vedanāya…` là tên riêng
  của sáu bài trong dải (đọc được với nghĩa bài đố: cảm thọ do từng căn xúc chạm sinh).
  `vedanā` → *cảm thọ* có 1.178 lượt trong tầng, `samphassa` → *xúc chạm* 403 lượt, `cakkhu` →
  *nhãn*, `sota` → *tai*, `ghāna` → *mũi*, `jivhā` → *lưỡi*, `kāya` → *thân*, `mano` → *tâm*
  đều là cách dùng sẵn. Tôi lặp y hệt sáu vế theo nhịp Pāli, không đổi vế nào.
