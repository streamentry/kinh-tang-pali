notes: |-
  Aṅguttara Nikāya 9.14 (Saṃyutta cũ, chính là an9.14). 34 khoá, tất cả đã dịch.

  CÔNG THỨC PĀLI ĐÃ CÓ TIỀN LỆ, DÙNG LẠI ĐỂ KHÔNG TỰ CHẾ THUẬT NGỮ. Chuỗi hỏi
  `arammaṇa / samudaya / samosaraṇa / pamukha / adhipateyya / uttara / sāra / ogadha` nằm trong
  `an10.58:3.4` đã dịch sẵn trong tầng này: *gốc rễ là tham; do tâm chuyển động mà có; do chân
  xúc mà sinh; quy về cảm thọ; có đầu là định; do chánh niệm chỉ huy; tối thượng là tuệ; cốt lõi
  là giải thoát; bám vào vị bất tử; kết thúc ở Niết-bàn*. Bản này đi đúng nhịp ấy: *hội tụ ở cảm
  thọ · đứng đầu là định · chánh niệm làm người chỉ huy · trí tuệ là bậc tối thượng · cốt lõi là
  giải thoát · bám vào bất tử*. `ps1.9:11.1` (Paṭisambhidāmagga) có cùng công thức và dùng *đứng
  đầu / làm chủ / vượt trội / cốt lõi / cứu cánh* — đã đối chiếu cả hai.

  TIỀN LỆ ĐẾM ĐƯỢC CHO PHẦN ĐẦU. Đếm trên 36 bài `an9.*` đã merge: `:0.1` → `Aṅguttara Nikāya 9.NN`
  (đa số giữ nguyên Pāli); `Sīhanādavagga` → **“2. Phẩm Tiếng Hồi”** in y hệt ở cả an9.15, 16, 17,
  18, 19 — dùng lại nguyên văn; `X suttasutta` → “Kinh …” (an9.15 `Gaṇḍasutta` → “Kinh Cục Bụi
  Bẩn”, an9.16 `Saññāsutta` → “Kinh Chín Loại Tưởng”) nên `Samiddhisutta` → “Kinh Samiddhi”.
  Câu dẫn `yenāyasmā … tenupasaṅkami; … abhivādetvā ekamantaṁ nisīdi` đã có 5 bản dịch sẵn
  (an5.100, an4.195, an3.72, an10.75, an5.50) đều theo khuôn *đến chỗ Tôn giả X; đến nơi, đảnh lễ
  … rồi ngồi xuống một bên* — dùng lại. `Catutthaṁ` → “Thứ tư.” theo an9.15 (`Pañcamaṁ` →
  “Thứ năm.”).

  `bhante` khi Samiddhi gọi Sāriputta: **“bạch ngài”**. `bhante` trong `an/` chủ yếu là “bạch Thế
  Tôn” (400×) khi gọi Đức Phật; giữa hai tỳ-kheo thì đếm được “Bạch Ngài” 28× + “bạch Ngài” 6× là
  đa số, mạnh hơn “bạch đại vương” 17× (cái này là `mahārāja`) và hơn “bạch thầy” 5×. Vì đây là
  tầng `an` nên không dùng văn xưng của tầng `mil`.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `dhātūsu` (3.2, 11.2) — đây là điểm khó nhất của bài: ý là các ý nghĩ trở nên phân biệt
  **trong** các nhóm nguyên tố. Đếm tiền lệ trên toàn tầng: `an6.41` dịch `pathavīdhātu` là
  “giới tánh đất”, `asubhadhātu` là “giới tánh bất tịnh”; `an6.38` dịch `ārabbhadhātu` là “yếu tố
  khởi sự”. Cả hai đều là nghĩa “yếu tố điều kiện”, **không phải** tứ đại cái, nên dùng chúng ở
  đây sẽ lệch nghĩa. “đại căn” (thuật ngữ chuẩn tiếng Việt cho `dhātu` = yếu tố cấu tạo vật chất)
  đếm được **0 tiền lệ** trong tầng Việt dự án; vẫn chọn vì nó là cách đọc đúng, và ghi lại đây để
  người điều phối gộp với các bài khác có `dhātu`.
  `maññī` (11.11) — `tena ca mā maññī` không phải mệnh lệnh cấm, mà là “đừng vì thế mà tự phụ /
  đừng cho rằng điều ấy là của Ta”. Dịch “nhưng xin đừng vì thế mà tự phụ.” Ô này là câu nói cuối
  trong `an` và không có tiền lệ ở tầng này; Sujato dịch “don’t get conceited”, dùng để đối chiếu
  ý chứ không dịch vòng. `puṭṭho puṭṭho vissajjesi` = trả lời được **từng** câu hỏi, nên giữ mạch
  lặp `từng`.

  DẤU LƯỢC — bài không có `…pe…`; không phát sinh chính sách. Sáu khoá 11.3–11.8 để trống trong
  bản Anh đã ghim vẫn được dịch đủ từ Pāli; ô trống đó không phải sự đồng thuận về cách dịch.

  `technical_integrity` đặt 9.6 vì bốn cổng kỹ thuật đều xanh, chưa đủ 10.0 vì không ai rà lại
  bằng con người.

  Bốn lệnh cổng kỹ thuật đã chạy và đều xanh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
