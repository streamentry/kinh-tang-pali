notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Bài này còn nhiều bài anh em đã `published` với cùng Pāli.** Trước khi viết đã đối chiếu từng bài trong danh sách và dùng lại **nguyên văn** của chúng: `an7.27` (khung bảy pháp không suy giảm) · `an7.39` (đúng Pāli `an7.38`) · `an5.240` (đúng câu khung `an5.237`) · `an10.14` (đúng Pāli `an5.206`) · `an9.82` (đúng bốn chánh cần `an9.73`) · `an7.44` (danh sách chư thiên của `an9.24`) · `sn14.28` (đúng khung `sn14.29`) · `sn14.7` (đúng danh sách `sn14.8`) · `sn15.6` (cùng dạng hỏi `sn15.7`) · `sn20.4` (đúng dải `2.x` của `sn20.5`) · `sn22.111` (đoạn kết ẩn dụ `sn12.56`) · `sn22.113/114` (khung hỏi `sn12.16`/`sn22.115`). Những chỗ **có chủ ý viết khác** đều ghi rõ trong `notes` của từng bài.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên **48.902 segment đã `published`**: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Khớp **48.477 / 48.902 = 99,13%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ (`hay` được miễn vì `vā…vā…vā` là cấu trúc).
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Tên phẩm của lát này: `Āhāravagga` → *2. Phẩm Đoàn Thực* (`sn12.13`, cùng phẩm) · `Dukkhavagga` → *6. Phẩm Khổ* (`sn12.59`) · `Kammapathavagga` → *3. Phẩm Nghiệp Đạo* (`sn14.28`, cùng phẩm) · `Catutthavagga` → *4. Phẩm Thứ Tư* (13 bài) · `Nānattavagga` → *1. Phẩm Dị Biệt* (đa số `sn14.2/6`) · `Paṭhamavagga` → *1. Phẩm Thứ Nhất* (`sn15.1/6`) · `Opammavagga` → *1. Phẩm Ví Dụ* (`sn20.4`) · `Dhammakathikavagga` → *12. Phẩm Người Giảng Pháp* (`sn22.113/114`). Tên phẩm An: `Upālivagga` → *10. Phẩm Upāli* · `Samacittavagga` → *4. Phẩm Tâm Bình Thản* (**0 tiền lệ**, chưa bài nào của phẩm này xuất bản) · `Kimilavagga` → *21. Phẩm Kimila* · `Āvāsikavagga` → *24. Phẩm Vị Trú Xứ* · `Sammutipeyyāla` → *27. Phẩm Chuỗi Lặp* (**0 tiền lệ**) · `Anuttariyavagga` → *3. Phẩm Vượt Trội* · `Vajjisattakavagga` → *3. Phẩm Bảy Điều Tộc Vajji* · `Devatāvagga` → *4. Phẩm Chư Thiên* · `Dhanavagga` → *1. Phẩm Của Cải* · `Gotamīvagga` → *6. Phẩm Gotamī* · `Sīhanādavagga` → *2. Phẩm Tiếng Hồi* · `Sattāvāsavagga` → *3. Phẩm Trú Xứ* · `Sammappadhānavagga` → *8. Phẩm Chánh Cần*. **Bốn chỗ đang phân kỳ trong kho, ghi rõ để không bị hiểu là lỗi:** `Sīhanādavagga` (`an9.17` ghi *Sư Tử Hống*) · `Sattāvāsavagga` (`an9.23` ghi *Bảy Lậu*) · `Nānattavagga` (`sn14.9` ghi *Sai Biệt*) · `Āvāsikavagga` (`an5.240` ghi *Người Cư Ở*) · `Kimilavagga` (`an5.204` ghi *Đạo Đức*) · `Sammappadhānavagga` (`an9.74-81` ghi *Chánh Điển Trừng Phạt*). **Người biên tập nên thống nhất.**
  - >-
    **`an7.27` đã xuất bản có cùng khung** (bảy pháp không suy giảm, ba bản `Yāvakīvañca …` và mốc `vuddhiyeva, bhikkhave, bhikkhūnaṁ pāṭikaṅkhā, no parihāni`) → dùng lại **nguyên văn** của nó cho `1.1`, `1.2`, `1.3`, `2.1`, `3.6`, `4.1`. Danh sách bảy điều của bài này khác hoàn toàn.
  - >-
    0 tiền lệ, đặt mới: `kammārāma` → *gây công việc* (`rāma` = ham muốn/sở thích) · `bhassārāma` → *gây tranh luận* · `niddārāma` → *gây tranh cãi* (`niddāra` = tranh cãi) · `saṅgaṇikārāma` → *gây cãi nhau* (`saṅgaṇika` = đổ lỗi lẫn nhau) · `pāpicchā` → *ham muốn điều xấu* · `pāpasampavaṅka` → *quy tụ cùng kẻ xấu* · `oramattakena visesādhigamena antarāvosāna` → *nương vào sự chấm dứt bằng một chút ưu thế hơn*.
  - >-
    Bất định đã ghi: `Dutiyasattakasutta` → *Kinh Bảy Điều (Hai)*; `an7.23` (`Paṭhamasattakasutta`) chưa dịch nên chưa có tiền lệ đối chiếu để xem tên kinh trong cặp này đã dùng là gì.
  - >-
    Điểm dễ dịch sai: `3.4`, `3.5` mỗi khoá có **hai** vế phủ định liên tiếp (`na … na …`), và `3.5` có **ba** vế. Rút một vế là đổi nghĩa.
