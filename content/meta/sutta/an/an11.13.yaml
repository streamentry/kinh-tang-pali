notes: |-
  Đợt 17, lát n175. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim và lớp
  english-project (3 khoá lấp, assessed_by khác người chấm bài này).

  **Coverage Anh trên Pāli có nội dung: 42/42 = 100%** — trên sàn 0.8, không có gì phải record
  trong reference-gaps.

  **Khoá lặp trong bài lấy y một cách dịch** (đối chiếu Pāli từng cặp): 4.2+4.3 lặp 3.4+3.5 (chỉ
  khác thì `karonti` → `pakkamissatī` và lớp vỏ nháy), 4.7 = 3.5, 2.1 = 4.1, 9.2 = 8.2, 11.4 =
  11.1 (thêm ”ti), 10.4 lặp lại 10.2 với vỏ `evamevaṁ kho, nandiya`.

  **Công thức có tiền lệ đếm được trong tầng**:
  - `:0.1` theo đa số an11 đo lại: 25 “Aṅguttara Nikāya” / 5 “Kinh …”; `:0.2` “2. Phẩm Nhớ Tưởng”
    (an11.14); `:11.5` “Thứ ba.” (đa số an).
  - 1.1 trùng nguyên văn Pāli của an11.12:1.1 → dùng lại nguyên văn “Một thời, Đức Phật ở xứ Sakya,
    gần Kapilavatthu, tại tu viện Cây Đa.”
  - `itipi so bhagavā` (6.2) lấy nguyên văn an5.47:2.3 / an5.30:1.7 (“Thế Tôn ấy là bậc A-la-hán,
    bậc Chánh Đẳng Giác, đầy đủ minh và hạnh, thiện thệ …” — đa số an); `svākkhāto bhagavatā
    dhammo` (7.2) lấy nguyên văn an3.75:2.6 / an3.70:7.4 (đa số an).
  - `ārādhako hoti` (5.4–5.9) → “có khả năng thành tựu” theo an10.156-166 và an10.199-210; cả sáu
    cặp có/không đều theo khuôn ấy.
  - Đuôi `muttacāgo payatapāṇi vossaggarato …` (9.3) dùng lại nguyên văn an3.42:1.3 đã publish (“sống
    ở trong nhà với tâm đã rời bỏ ô nhiễm keo kiệt: buông xả rộng rãi, mở tay rộng rãi …”), chỉ thêm
    vế `maccheramalapariyuṭṭhitāya pajāya` dịch theo Pāli.
  - `yannūnāhampi` (2.4) → “Sao tôi không …”; `Sādhu sādhu, nandiya` (5.1) → “Lành thay, lành thay,
    Nandiya.”; `sambahulā bhikkhū` → “nhiều vị tỳ-kheo” (đo trong an: 15).
  - 11.2 ghép dn28:2.9 (“những pháp làm ô nhiễm tâm và làm yếu trí tuệ”, “tu tập như thật bảy giác
    chi”) với an5.136:3.5 (“tâm [đã] được thiết lập vững chắc trên bốn niệm xứ”) — cùng dùng cho
    an10.95 cùng lát.

  **`kira` (2.2, 4.2) dịch “Nghe nói”**: bản Anh ghim giữ “they say” ở 2.2 nhưng bỏ ở 4.6 (không
  có `kira`); bản Việt giữ “Nghe nói” cho cả 2.2 và 4.2 vì cả hai Pāli đều có `kira`.

  Triangulation 9.0 như an10.95: có cả Sujato lẫn english-project, english-project do agent khác
  chấm nên độc lập với người chấm bài này, nhưng là bản dịch nội bộ nên không ngang bản Anh upstream
  hoàn toàn.

  technical_integrity 9.6: cổng kỹ thuật do coordinator chạy — npm run validate; npm test;
  npm run check; npm run build.
