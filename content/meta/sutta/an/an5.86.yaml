notes: |-
  Sửa lan 2026-10-13: khoá `an5.86:1.3` và tiêu đề `an5.86:0.3` (cùng `translationTitle`) — `atthapaṭisambhidāpatto … paṭibhānapaṭisambhidāpatto`. Trước: «đạt vô ngại trí về nghĩa/pháp/ngữ từ/biện tài» và «Kinh Đạt Bốn Vô Ngại Trí» → sau: «đạt vô ngại giải về nghĩa/pháp/ngữ từ/biện tài» và «Kinh Đạt Bốn Vô Ngại Giải». Căn cứ: `paṭisambhidā` được dịch «vô ngại giải» ở 821 khoá của tầng, so với 5 khoá còn lại dùng «vô ngại trí»; cùng công thức `…paṭisambhidāpatto` ở `ps3.1:40.2`, `ps3.1:47.2` và tiêu đề `an7.38`, `an7.39`, `ps2.6:0.3` đều dùng «vô ngại giải».
