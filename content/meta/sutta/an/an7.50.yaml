notes: |-
  **Coverage Anh Sujato trên Pāli có nội dung: 28/33 = 0.848**, trên ngưỡng 0.8 nên
  không cần ghi nhận gap. Mất 5 khoá: `2.6`, `2.9`, `2.13`, `2.16`, `2.19` — toàn bộ
  là nhóm `imā vuccanti … vedanā` (bilara render blockquote thành rỗng rồi nối câu
  vòng). Không có bản Anh nào khác phủ bài này ở commit đã ghim. Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708 (bilara chỉ phân phối 26 tệp tiếng Việt, toàn bộ là Pháp Cú), nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của kho.
  Vì mất tầng ở đúng nhóm định nghĩa, `triangulation` hạ xuống **8.8**; không nâng
  điểm tiêu chí khác để bù.

  **7/38 khoá trùng nguyên văn Pāli; 5 cặp dùng lại NGUYÊN VĂN** — `0.2` (4/4) ·
  `1.1` · `1.2` (3 tiền lệ, chọn bản khớp nhịp `Sammodanīyaṁ…` 84/152) · `11.1` ·
  `11.4` (234/238).

  **Nhóm bảy `…pe…` ở `3.2, 4.2, 5.2, 6.2, 7.2, 11.2`.** Pāli lược phần tiếp theo
  của bảy kiểu trói buộc, và cấu trúc Pāli là **mỗi khoá lặp lại toàn bộ danh sách
  bằng dạng phủ định** (`Napi…` / `api ca kho…`). Tôi dịch đúng cấu trúc đó — vẫn có
  **một** `…` mỗi khoá, không mở rộng, không bịa `…` — chứ không gộp thành hai vế
  `Napi…; api ca kho…` như Sujato làm, vì gộp sẽ mất đúng vế phủ định mà Pāli nêu
  riêng. Đây là lý do `grammar_logic` 9.4 chứ không cao hơn.

  **Bốn `khaṇḍa/chidda/sabala/kammāsa` tôi dịch *hư hỏng / đứt đoạn / nhiễm ô /
  đáng chê trách* — 0 tiền lệ cho cụm này.** Đây là điểm dễ dịch sai nhất của bài:
  `asabala` là *không nhiễm ô* chứ không phải *không bị tổn hại* (đó là
  `avisuddha/ugghaṭita`), `akammāsa` là *không đáng chê trách*. Tôi ghi vào đây vì
  `terminology` chỉ 9.2. Cùng bốn từ ấy được lặp lại đúng ở `1.5`-`1.6`, `1.7`,
  `2.4` và `8.4`, nên người rà soát chỉ cần phán một lần.

  **`methuna` → *dục* / *tình dục*, `methunena saṁyogena` → *sự giao cấu*,
  `methunasaṁyogānaṁ` → *kiểu trói buộc bằng tình dục*.** 0 tiền lệ cho `methuna`;
  Sujato dịch *Sex* / *yokes of sexual conduct*. `ucchādanaparimaddananhāpanasambāhanaṁ`
  → *xoa dầu, nắn bóp, tắm gội và xoa bóp* (0 tiền lệ cho cụm; Sujato *anointed,
  massaged, bathed, and rubbed*). `tirokuṭṭaṁ vā tiropākāraṁ` → *qua tường vách hay
  thành luỹ* theo `an3.60`/`an5.23`.

  **`an10.90:8.2` không liên quan, nhưng để người gộp biết:** cùng dạng
  `sīlena vā vatena vā tapena vā brahmacariyena vā` đã có 18 bản, trong đó *phép tạp*
  5 (an5.206, an10.14), *hạnh trì* 2 (an9.72), *sự giữ hạnh* 2 (mn76). Tôi dùng *phép
  tạp* theo đa số đo được; nếu người biên tập chốt *hạnh trì* thì phải sửa cả
  `an5.206`, `an9.72`, `an10.14`, `mn16`, `mn76` cùng lúc.

  **`8.2`, `8.3`, `2.3`.** `api ca kho aññataraṁ devanikāyaṁ paṇidhāya…` theo `an9.72`
  và `an5.206`. `assādeti / nikāmeti / vittiṁ āpajjati` → *say mê / ưa thích / được sự
  thoải mái*; 0 tiền lệ cho `vittiṁ āpajjati`, ghi rõ đây là lựa chọn của tôi.

  **`0.3` đặt mới (0 tiền lệ).** `Methunasutta` → *Kinh Dục*.

  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
