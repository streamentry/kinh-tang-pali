notes: |-
  TẦNG THAM KHẢO. Tầng english-sujato tồn tại tại commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639 và bản Sujato phủ 19/19 khoá Pāli có nội dung (100%), nên không cần mục trong content/meta/reference-gaps.yaml. Tầng Việt hiện hành vắng với AN.

  HAI THUẬT NGỮ MỚI, ĐÃ TRA VÀ GHI. Quét 5.764 tệp Pāli trong cache và 4.136 tệp Việt dự án: dhammayoga và jhāyī chỉ xuất hiện trong chính an6.46 (10 khoá, tất cả thuộc lát này), không bài nào khác trong kho. Tôi đặt dhammayoga → tu theo pháp và jhāyī → tu chứng, vì jhāyī theo nghĩa tu thiền định còn dhammayoga là yoked to the Dhamma nên giữ chữ pháp cho rõ; tôi chọn cặp này vì nó đối xứng nhau đúng như bản kinh đối xứng. Đây là điểm yếu thật của bài, người biên tập xét lại được.

  DÙNG NGUYÊN VĂN BÀN ĐÃ CÓ. 6.3 và 7.3 có Pāli trùng nguyên văn với an10.52:2.2 và an10.55:6.2 nên tôi dùng lại nguyên văn đó là đây là điều các bạn cần phải học, chỉ đổi chữ đầu câu cho hoa. 6.4 và 7.4 (Taṁ kissa hetu) dùng lại Vì sao của toàn tầng.

  DANH SÁCH Ô NHIỄM 3.2. uddhatā, unnaḷā, capalā, mukharā, vikiṇṇavācā, muṭṭhassatī, asampajānā, asamāhitā, vibbhantacittā, pākatindriyā: tôi theo đúng cụm đã dịch ở mn10 và dn (cao ngạo, ngạo mạn, nhẹ dạ, lắm lời, ba hoa), ghét với 10 mệnh đề của Pāli; muṭṭhassatī → thất niệm theo 12 khoá / 2 tệp trong tầng kn.

  TÊN ĐỊA DANH. 1.2 Pāli ghi sayaṁjātiyaṁ, còn hai bản song song an10.24:1.1 và an10.85:1.1 ghi sahajātiyaṁ. Tôi dịch theo dạng có trong chính bài: Sayaṁjāti. Tên này có dấu Pāli nhưng không trùng dạng gốc nên phải khai vào bộ nhớ _hvi._GIỮ trước khi ghi. cetīsu → xứ Ceti (an8.30 cũng dùng Ceti cho cetīsu).

  NHÁY KÉP BỔ SUNG, GHI RÕ. Pāli của bài mở nháy kép ở 2.1, 3.1, 4.1, 5.1 nhưng không đóng ở đâu; tôi đóng mỗi nhóm ở vế cuối (2.3, 3.3, 4.2, 5.2). 6.2 và 7.2 trong Pāli chỉ có nháy đơn ‘…’ nên tôi giữ nháy đơn, không thêm nháy kép. Đây là sửa chính tả, không thêm ý nghĩa.

  DẤU LƯỢC. Bài không có dấu lược nào; bản Việt cũng không có.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
