notes:
  - >-
    **Bài định nghĩa hai vế trước, rồi mới đi vào phần phản tư tâm mình** — khác
    `an10.51`–`an10.53` là vào thẳng. `parihānadhammo puggalo` → *có tính chất
    suy giảm* và `aparihānadhammo` → *không có tính chất suy giảm* (0 tiền lệ,
    đặt mới; `hāni` → *suy giảm* theo chương 2).
  - >-
    **`Sacittavagga` → *Phẩm Tâm Mình*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *Your Own Mind*, và cả phẩm nói đúng một việc — soi lại
    **tâm mình** (`sacittapariyāyakusala`). Tên bài `Sacittasutta` → *Kinh Chăm
    Chính Tâm Mình*.
    **`Sacittavaggo paṭhamo` ở `an10.60:15.5` dịch là *Phẩm Tâm Mình, thứ
    nhất*** — đây là **số thứ tự của chính Bilara đánh số lại**, vì phẩm này rõ
    ràng là thứ sáu trong Bộ Mười (đúng như `6.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Cả ẩn dụ gương / bát nước đều là thuật ngữ 0 tiền lệ, đặt mới**:
    `mukhanimitta` → *hình bóng khuôn mặt*, `maṇḍanakajātiko` → *thích trang
    điệm*, `raja` → *bẩn bẩn*, `aṅgaṇa` → *tế nhị*, `paccavekkhamāno` → *phản
    tư* (theo `an5.149:1.3`, vốn dùng *phản tư* cho động từ này),
    `paccavekkhaṇā` → *việc phản tư*.
  - >-
    **Bốn mục `4.2` và `5.2` là hai mệnh đề trái ngược nhau, dịch đối xứng theo
    từng vế**: không nghe pháp chưa từng nghe ↔ nghe pháp chưa từng nghe; pháp
    đã nghe thì trôi mất ↔ không trôi mất; pháp trước đây tâm chưa thấm nhuần
    thì không khởi lên trong tâm ↔ đã thấm nhuần thì khởi lên trong tâm; điều
    chưa biết thì không hiểu ↔ hiểu biết. Đây là nội dung **quan trọng nhất của
    bài**, nên tôi không rút gọn.
  - >-
    **`7.6` là danh sách mười mục khác hẳn, có thêm `saṁvijjati nu kho me eso
    dhammo udāhu no`** — *ta đã có hay chưa có pháp ấy* — lặp sau **mỗi** mục.
    `saṁvijjati` 0 tiền lệ; `dhammapāmojja` cũng 0 tiền lệ, tôi dùng *sự hân
    hoan với Pháp*.
    **Lỗi do lượt review bắt được:** bản đầu nối danh sách bằng `join` không dấu
    phẩy, ra *“…pháp ấy**tâm** không bị chi phối…”* ở chín vị trí. Đã sửa.
    **Ba mục `8.x`, `9.x`, `10.x` phân biệt ba tình huống theo số pháp thiện vị
    ấy thấy trong chính mình**: không thấy pháp nào / thấy một số / thấy tất cả
    — và vế `paṭilābhāya` (để đạt được) chỉ áp cho phần chưa có. Đây là lập luận
    của bài nên tôi giữ đủ.
