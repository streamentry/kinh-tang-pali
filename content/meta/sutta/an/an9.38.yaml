notes: |-
  Dịch từ Pāli root snapshot SuttaCentral/Bilara đã ghim (source/suttacentral.lock.json). Đầy đủ 74/74 khoá từ an9.38:0.1 đến an9.38:10.3; không có khoá nào ngoài tập khoá Pāli.

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE:
    - Đối chiếu bản Anh Bhikkhu Sujato tại cùng commit đã ghim. Coverage Anh Sujato trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): 46/47 = 0,979, trên ngưỡng 0,80. Khoá duy nhất Sujato để trống là 3.3, vốn là câu dẫn lại 2.9; khoá này do lớp english-project (đã published, cùng người biên tập) lấp, nên tính cả lớp lấp thì 47/47 nhưng phần lấp không phải cách đọc English độc lập; triangulation vì vậy không tuyên bố đối chiếu English độc lập cho khoá 3.3.
    - Tầng Việt hiện hành (vietnamese-current) vắng ở commit đã ghim vì bilara chỉ có Pháp Cú. Bản Việt nguyên bài của Hòa thượng Thích Minh Châu (SuttaCentral, tra cứu toàn văn, không căn lề theo khoá) đã được đọc để đối chiếu thuật ngữ và các số/khẳng định lớn.
    - Tiền lệ: các khoá có Pāli trùng nguyên văn ở nơi khác trong tầng đều được kiểm; 4.5 và 4.10 dùng lại nguyên văn cách dịch của đa số tiền lệ (3 khoá Pāli trùng ở nơi khác đã dò: 2 khoá cùng một cách dịch với an4.45 và 1 khoá ở sn2.26 dịch "cùng tận của thế gian"; chọn dạng 2 trên 3). Trong chính bài này có 9 nhóm Pāli trùng nguyên văn (2.2/2.6, 2.3/2.7, 2.4/2.8, 4.5/4.10, 4.6/4.11, 6.3/7.5/8.3/9.5, 6.4/6.6/7.6/7.8/8.4/8.6/9.6/9.8, 6.5/7.7/8.5/9.7, 7.4/8.2/9.4); cả 9 nhóm đều có bản Việt giống hệt nhau, 0 nhóm bị khác.

  BẤT ĐỊNH CẦN GHI (an9.38:2.4 và 2.8):
    - Pāli root đã ghim viết khoá 2.4 (lời Pūraṇa Kassapa) và khoá 2.8 (lời Nigaṇṭha Nāṭaputta) HOÀN TOÀN GIỐNG NHAU: "ahaṁ anantena ñāṇena anantaṁ lokaṁ jānaṁ passaṁ viharāmī". Nếu dịch đúng chữ, hai tuyên bố trùng nhau, trong khi 2.9 và đoạn sau nói đây là hai lời đối nghịch. Đây là điểm nghĩa đen mâu thuẫn với văn cảnh, nhiều khả năng do dị bản hoặc lược chữ trong nguồn.
    - Các bản tham khảo xử lý khác nhau: Sujato dịch 2.4 là thế giới vô biên và 2.8 là thế giới hữu biên (trí vô biên ở cả hai); bản Việt nguyên bài của Hòa thượng Thích Minh Châu ghi 2.4 là trí vô biên thấy thế giới hữu biên, còn 2.8 là trí hữu biên thấy thế giới hữu biên. Ba cách đọc không khớp nhau và không cách nào có chứng cứ độc lập từ Pāli đã ghim.
    - Quyết định: Pāli là authority, nên cả hai khoá được dịch đúng theo Pāli ghim (cùng một câu, "thế giới vô biên"), không tự sửa theo Sujato hay Thích Minh Châu và không thêm chữ vào lời kinh. Bất định này không đổi giáo nghĩa của lời Đức Phật (Ngài gác câu hỏi đó lại ở 3.1 đến 3.3) nên không được coi là blocker, nhưng phần ambiguity_integrity và semantic_fidelity đã được hạ tương ứng. Người biên tập có thể cân nhắc đối chiếu dị bản Pāli (Mahāsaṅgīti, PTS) rồi chỉnh 2.8 nếu dị bản xác nhận.

  THUẬT NGỮ VÀ CÔNG THỨC (đo trên tầng):
    - "lokassa anta" dịch "bờ cuối của thế giới": 14 khoá dùng "bờ cuối" so với 6 khoá "cùng tận" trong toàn tầng; bài anh em an4.45 dùng "bờ cuối". Giữ cho nhất quán trong bài.
    - "kāmaguṇā" dịch "dục trưởng dưỡng": 30 khoá so với "dục lạc" 17 và "dục công đức" 8; an9.65 cùng bộ dùng "dục trưởng dưỡng".
    - Thiền: "thiền thứ nhất/hai/ba/tư" theo đa số trong Tăng Chi Bộ (34 so với "sơ thiền" 5; trong an9 là 7 so với 2), dù bài an9.39 anh em dùng "sơ thiền".
    - "chứng và an trú" (upasampajja viharati): 118 so với "chứng đạt và an trú" 14 trong Tăng Chi Bộ.
    - Bốn xứ vô sắc và diệt thọ tưởng: "Không vô biên xứ" 23 so với "xứ vô số hư không" 6; "Diệt thọ tưởng" 19 khoá. "Phi tưởng phi phi tưởng xứ" theo quy ước tầng (168 khoá/62 tệp).
    - "các tưởng về sắc", "các tưởng đối ngại", "các tưởng sai biệt" theo đa số tầng (17, 4 và 11 khoá). Cây tāla dịch "cây cọ" theo mn12:62.7. "Pūraṇa Kassapa" và "Nigaṇṭha Nāṭaputta" theo tiền lệ dn16, dn2, sn22.60. "Lokāyatika" theo tiền lệ sn12.48 ("chủ trương vũ trụ luận"); tiêu đề giữ "Kinh Nhà Vũ Trụ Luận" như sn12.48 vì Pāli trùng nguyên văn.
    - Số: "vassasata" là một trăm năm (sata = 100); không có số nào khác ở bài này.
    - Câu kết 10.2 "tiṇṇo loke visattikan" dịch "đã vượt qua sự dính mắc trong đời" theo sn1.50 và sn1.35 (3 trong 4 khoá Pāli trùng cụm này ngoài mn25 dùng "dính mắc trong đời").

  DẤU NGOẶC VÀ DẤU LƯỢC:
    - Dấu ngoặc kép và nháy đơn khớp Pāli từng khoá: 0 lệch trên 74 khoá. ngoặc kép mở ở 2.1, 3.1, 3.6 và 4.1; đóng ở 2.9, 3.5, 3.6 và 10.2 (10.2 đóng nháy đơn rồi ngoặc kép).
    - Dấu lược khớp Pāli: 4.7, 4.8, 5.4, 5.5, 5.6, 7.2, 9.1, 9.2 mỗi khoá một dấu "…"; 7.1 hai dấu "…"; Pāli không có "(…)" nên bản Việt không có.
    - Khoá 3.3: Pāli kết bằng dấu chấm sau câu dẫn lại (khác 2.9 kết bằng dấu hỏi), nên bản Việt kết bằng dấu chấm sau nháy đơn và không dùng dấu hỏi, đúng với bản lấp English đã published.

  KIỂM TRA KỸ THUẬT:
    - Chưa chạy các lệnh sau trong phiên này (bị cấm): npm run validate, npm test, npm run check, npm run build. technical_integrity đặt 9,6 và không tuyên bố technical gate pass; cần chạy bốn lệnh này trước khi merge.
    - Kiểm tra tay: tập khoá Việt khớp tập khoá Pāli 74/74 và cùng thứ tự; NFC; không khoá rỗng; không Pāli lọt sang bản Việt ngoài tên riêng.
