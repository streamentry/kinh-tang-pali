notes: |-
  Sửa lan 2026-10-13: khoá an3.15:2.2–2.16 lệch hàng so với Pāli (2.5 mang nội dung của 2.6, 2.6 của 2.7, … 2.12 của 2.13, v.v., nên 2.6 là "Rồi vua Sacetana gọi người thợ xe" thay vì "trong sáu tháng còn thiếu sáu đêm (chahi māsehi chārattūnehi), người thợ xe hoàn thành một bánh xe", và 2.9 thiếu chahi māsehi chārattūnehi = "sáu tháng còn thiếu sáu đêm"). Đã viết lại từng khoá theo đúng Pāli (2.2 gọi thợ xe; 2.3–2.4 lời vua, sau sáu tháng và đôi bánh xe mới; 2.5 người thợ xe nhận lời; 2.6 một bánh xe sau sáu tháng thiếu sáu đêm; 2.7–2.8 vua hỏi lần hai; 2.9 trả lời; 2.10 hỏi bánh thứ hai trong sáu ngày; 2.11 nhận lời, hoàn thành và đến chỗ vua; 2.12 dâng đôi bánh; 2.13–2.14 vua hỏi khác biệt; 2.15–2.16 thợ xe đáp). Nháy đơn ‘ ’ cân theo Pāli từng khoá. Cũng sửa 3.1, 3.3: "làm trượt" → "cho lăn" (pavattesi, thêm "này các tỳ-kheo" ở 3.1); 3.2: "đà khởi động" → "sức tăng gia" cho đồng nhất với 3.4, 4.1–4.6 (abhisaṅkhārassa gati, Pāli trùng nguyên văn). Điểm cũ giữ nguyên vì bản hiện hành khớp Pāli từng khoá sau sửa.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an3.15:5.1 — «Này các tỳ-kheo, các ông có thể nghĩ rằng:» →
  «Nhưng này các tỳ-kheo, các ông có thể nghĩ:», thêm «Nhưng» cho tiểu từ `pana` theo công thức 9/10 khoá
  cùng Pāli; giữ «các ông» (an3.15 dùng «các ông» ở cả ba chỗ xưng hô), không đổi sang «các thầy» của modal.
