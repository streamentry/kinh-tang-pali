notes: |-
  Chấm điểm, không dịch. Pāli :1.1 lược toàn thân bằng …pe…, bản Việt dựng lại công thức đủ của cùng phẩm với dấu … đánh dấu chỗ lược, cùng cách Sujato làm.
  Tầng Anh Sujato chỉ còn stub một câu ở :1.1 và trống :1.2 là thứ tự Aṭṭhamaṁ, nên đoạn này hầu như chỉ có Pāli và công thức trong phẩm làm chứng, không coi chỗ Anh trống là đồng thuận. Tầng Việt Thích Minh Châu vắng với AN ở commit đã ghim.
  Ghi nhận cho coordinator: ekāsanika thành chỉ ăn trong một chỗ ngồi, chữ ăn là hàm ý đúng của hạnh một chỗ ngồi; động cơ thứ tư rớt cụm và đệ tử Phật so với bản đủ ở an5.181 và an5.190; idamatthatā thành tánh không cầu ngoại duyên là cách diễn giải mới, 0 tiền lệ trong kho.
  Cổng kỹ thuật do coordinator chạy: npm run validate, npm test, npm run check, npm run build.

  Coordinator (gather): bổ sung «và đệ tử Phật» theo Pāli cùng công thức an5.181:1.3 (vaṇṇitaṁ buddhehi buddhasāvakehī); bản ghim Sujato cũng rớt cụm này.
