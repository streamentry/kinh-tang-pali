notes:
  - >-
    Bài **mười phẩm, phiên bản có bốn phép thiền**. Cùng khung với `an10.9` và
    `an10.10`, chỉ khác mục thứ tám và thứ mười.
  - >-
    **`catunnaṁ jhānānaṁ ābhicetasikānaṁ diṭṭhadhammasukhavihārānaṁ nikāmalābhī
    akicchalābhī akasiralābhī` dùng nguyên văn `an4.22:4.5`**: *dễ dàng được,
    không khó khăn, không trở ngại, bốn phép thiền thuộc về tâm cao hơn, tạo nên
    an trú hiện tại lạc trú, tùy ý*. Ba chữ
    `nikāmalābhī`/`akicchalābhī`/`akasiralābhī` xác nhận thêm bằng `an3.63:5.1`
    (48 segment): *dễ dàng có được, không khó nhọc, không thiếu thốn* — cùng một
    cụm.
  - >-
    **`tenaṅgena` → *về phương diện ấy*** theo 18 segment tiền lệ (`dn29:10.2`
    *chưa trọn vẹn về phương diện đó*); `aparipūro`/`paripūro hoti` → *chưa trọn
    vẹn* / *trọn vẹn*. `Tena taṁ aṅgaṁ paripūretabbaṁ` → *Vì vậy, phải làm cho
    trọn vẹn yếu tố ấy*; `kintāhaṁ … assaṁ … cā’ti` → *Xin tôi được …*.
  - >-
    **`samantapāsādiko` → *yên ổn rộng lớn khắp mọi phương*** và
    **`sabbākāraparipūro` → *hoàn tất mọi phương diện***: cả hai **0 segment**,
    đặt mới và ghi lý do. `pāsādi` chỉ có 30 segment và ở `an4.85:4.3` là *khả
    ái* (người đẹp), nghĩa khác; ở đây `samanta` = khắp mọi phương nên *yên ổn
    rộng lớn khắp mọi phương*. `sabbākāra` = mọi phương diện.
  - >-
    **Lưu ý về thứ tự:** ở `2.7`/`2.8` tiếng Việt đặt *dễ dàng được, không khó
    khăn, không trở ngại* **trước** cụm *bốn phép thiền*, ngược với Pāli — vì
    `an4.22:4.5` đã dịch vậy và đã publish; dùng lại cho nhất quán và ghi lại ở
    đây để người sau không tưởng là lỗi.
  - >-
    **`āsavānaṁ khayā … viharati` giữ đúng thứ tự Pāli**, khác `an4.87:3.2` (bản
    đã publish) đảo *diṭṭheva dhamme sayaṁ abhiññā* lên trước *anāsavaṁ
    cetovimuttiṁ*. Ở đây cụm nằm **trong danh sách mười phẩm** nên phải theo
    Pāli; `an10.102:1.9` — bản nhúng trong danh sách — cũng giữ thứ tự Pāli, nên
    đây là quy tắc của corpus chứ không phải ý tôi.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
