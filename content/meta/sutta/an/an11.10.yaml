notes: |-
  Lát c55. MỆNH ĐỀ 0.1 — đo lại và ghi rõ CẢ HAI số như brief yêu cầu:
  toàn bộ tầng `an`: “Kinh …” **897** vs “Aṅguttara …” **353** ⇒ đa số CẢ BỘ là
  “Kinh Tăng Chi Bộ”. Nhưng riêng QUYỂN 11 nghiêng ngược: “Aṅguttara” **22** vs “Kinh”
  **4**; riêng QUYỂN 7: “Aṅguttara” **52** vs “Kinh” **21**. Tôi theo **đa số cục bộ**
  cho cả an11.10, an7.4, an7.6, an7.69: “Aṅguttara Nikāya …”. Người điều phối nên biết
  quyển 2, 6, 8, 9, 10, 11 cũng nghiêng “Aṅguttara” (đo: an2 10/9, an6 84/12,
  an8 43/16, an9 45/19, an10 19/159, an11 22/4) — tức số 887/353 mà brief nêu là đa số
  toàn cục chứ không phải xu hướng của từng quyển.

  Trùng nguyên văn: `Katamehi tīhi?` ×3 (2.2, 3.2, 4.2) và cụm
  `accantaniṭṭho hoti … seṭṭho devamanussānaṁ` ×8 (2.1, 2.4, 3.1, 3.4, 4.1, 4.4, 5.1,
  5.4) — dùng lại nguyên văn, chỉ đổi số theo Pāli (ba/hai). Bốn câu kệ 6.1–6.4 và
  8.1–8.4 trùng nguyên vân với nhau và với `sn6.11:2.1–2.4` ⇒ dùng lại **nguyên văn**
  dạng đã có: “Sát-đế-lợi là tối thượng giữa những người / lấy dòng dõi làm chuẩn mực; /
  nhưng bậc đầy đủ minh và hạnh / mới là tối thượng giữa chư thiên và loài người.”

  1.1–1.5 dùng lại nguyên văn `an3.143:1.1–1.5` (cùng mở đầu bài Paṭhamamoranivāpasutta);
  0.2 dùng lại `an11.1:0.2` “1. Phẩm Nương Tựa”; 0.3 đặt “Kinh Nơi Chăn Chim Công” theo
  khuôn của `an3.143:0.3` “Kinh Nơi Chăn Chim Công Thứ Nhất”.

  Bốn tiêu chí pháp lặp lại: 3.3 và 4.3 dùng lại nguyên văn `an3.144:1.3` / `an3.145:1.3`;
  2.3 dùng lại `an3.143:2.3`. Cụm `accantaniṭṭho…` tôi dùng y hệt an3.143:2.1/2.4 nhưng
  thêm “là bậc” trước cụm cuối cho câu đầy đủ hơn — khác một chữ, cùng nghĩa.

  5.3 `Vijjāya, caraṇena` tôi dịch “Minh và hạnh —”, khớp với cặp `vijjācaraṇasampanno`
  của sn6.11:2.3 “bậc đầy đủ minh và hạnh” — giữ đúng cặp thuật ngữ trong cùng phẩm.

  9.1–9.4 là uddāna (bài tụng tóm lược), không phải văn nghĩa chính; tôi dịch theo danh
  sách bài đã có trong đúng phẩm này: an11.1 “Kinh Vì Mục Đích Gì”, an11.2 “Kinh Điều
  Đáng Ý Nghĩ”, an11.6 “Kinh Tai Họa”, an11.7 “Kinh Có Tưởng”, an11.8 “Kinh Tác Ý”.
  Đây là **bất định thật**: uddāna làm bằng cách liệt kê tên đầu mỗi bài, nên cách dịch
  phụ thuộc cách người biên tập đặt tên các bài kia; tôi bám tên đã có để phẩm nhất quán.

  Dấu lược: bài này **không có** `…pe…` nào trong Pāli ⇒ bản Việt không có dấu lược nào
  (đã kiểm bằng `lược()`).

  Triangulation 9.4: Sujato phủ 15/15 khoá Pāli ≥40 ký tự (100%); `vietnamese-current`
  vắng. Ba bài song song đã dịch (an3.143, an3.144, an3.145) cho tiền lệ trực tiếp.

  Bị chặn cổng kỹ thuật (không được chạy `npm run validate|test|check|build`), tiêu chí 10
  ở **9.6**: đã xác minh JSON hợp lệ, 42/42 khoá, không orphan/rỗng, NFC, dấu lược khớp
  (0 lệch), ngoặc kép cân 3/3, không `(…)` đứng một mình. Bốn lệnh npm để coordinator
  chạy.