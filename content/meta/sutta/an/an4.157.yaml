  notes: |-
    Lượt cải thiện 2026-10-14 (bài trước đó chưa có ghi chú; điểm cũ 9.51 chưa phản ánh các lỗi dưới đây, nên điểm mới được chấm lại từ đầu, không phải nâng).
    Khoá đổi (5/19): 2.3, 2.4, 2.5, 2.6, 3.2. Lỗi nặng 1 (3.2: chuỗi bảy tính từ về cảm thọ chỉ có sáu vế, thiếu kaṭukānaṁ; thiếu uppannānaṁ và adhivāsakajātikā, nên "chịu đựng" bị lặp cho cả khamā lẫn vế cuối; vacanapathānaṁ bị dịch thành "chỉ trích"); vừa 1 (2.6: saṅkhāya dịch "với ý định được nhìn nhận" ở vế đầu, chép thêm từ vế anavañña mà Pāli không có ở đây, bốn vế sau lại chỉ "với ý định"); nhẹ 3 (2.3/2.4/3.2 vighātavā "bối rối" lệch nghĩa; 2.4/2.5/3.2 lābha "sự được cho" lệch tiền lệ; 3.2 pasamphassānaṁ "cắn xâu", vedanā "cảm thụ").
      - 3.2: bảy vế dukkhānaṁ tibbānaṁ kharānaṁ kaṭukānaṁ asātānaṁ amanāpānaṁ pāṇaharānaṁ nay đủ bảy (thêm "xót xa" cho kaṭuka theo mn125:30.1 và mnd16:176.7); thêm "đã khởi lên" (uppannānaṁ) và "có bản tính chịu đựng" (adhivāsakajātikā); "cảm thụ" → "cảm thọ" (tầng đo 11 khoá cảm thọ / 4 cảm thụ cho cụm sārīrikānaṁ vedanānaṁ); "sự cắn xâu" → "sự xúc chạm" (tầng đo 27 khoá xúc chạm / 4 cắn xâu); "các lời chỉ trích thô tục khó chịu" → "những lời nói thô ác, khó nghe" (vacanapatha là lời nói, khớp mn125:30.1, mnd16:176.7). Công thức này khớp an4.114:9.2 đã sửa; an4.165:2.2 và 3.2 vẫn còn các lỗi cũ (xem dưới).
      - 2.3/2.4/3.2: vighātavā "bối rối" → "hay phiền não" (đúng cụm Pāli mahiccho vighātavā asantuṭṭho của an6.84:1.3 và an6.84:2.3; mn138 cũng dịch "phiền não"; "bối rối" chỉ có ở bài này cho từ này).
      - 2.4/2.5/3.2: "sự được nhìn nhận và sự được cho, được tôn kính, được danh tiếng" → "sự không bị chê bai, cùng với lợi dưỡng, cung kính và danh tiếng". Lý do: lābhasakkārasiloka dịch "lợi dưỡng, cung kính, danh tiếng" ở 54 khoá của 18 bài, còn "sự được cho" chỉ 5 khoá của 2 bài; anavaññatti dịch "không bị chê (bai)" ở an7.1, an7.2, an8.4 và "không bị khinh miệt" ở an3.101, mnd14, mnd16, không có nơi nào dịch là "được nhìn nhận".
      - 2.6: saṅkhāya → "có tính toán" cho cả bốn vế, bỏ phần "được nhìn nhận" thêm vào vế đầu; kulāni "nhà" → "các gia đình" (số nhiều, khớp an7.61:10.4). Điểm đổi: semantic_fidelity 9.4→9.2, grammar_logic 9.4→9.3, terminology 9.3→9.2, vietnamese_clarity 9.4→9.3, ambiguity_integrity 9.2→9.0, technical_integrity 10.0→9.6 (chưa chạy cổng, xem dưới).
    Điểm chấm lại: source_provenance 10.0; semantic_fidelity 9.2; grammar_logic 9.3; segment_alignment 10.0; terminology 9.2; triangulation 9.0 (giữ, Sujato phủ toàn bài; bài không có bản Việt hiện hành để đối chiếu); vietnamese_clarity 9.3; han_viet_balance 9.4; ambiguity_integrity 9.0; technical_integrity 9.6. Trung bình 9.40; không blocker nên vẫn published (> 9.0).
    Bất định còn lại, không đổi: (1) anavaññappaṭilābhāya: bản Anh đọc là "status" (gần "được nhìn nhận"), tầng AN đọc "không bị chê (bai)"; giữ cách đọc theo gốc từ và tiền lệ, chưa có căn cứ Pāli độc lập để phân xử hẳn; (2) saṅkhāya: "có tính toán" theo nét "ulterior motive" của bản Anh, chưa dò được nơi nào khác trong tầng dùng saṅkhāya ở cấu trúc này; (3) muhuttampi giữ "khoảnh khắc" (tầng: 10 chốc lát / 4 khoảnh khắc; bản Anh "hour" nên đơn vị thời gian không chắc); (4) pāpikaṁ icchaṁ paṇidahati giữ "đặt ra mong muốn xấu" (an6.45, mnd14, mnd15 dịch "ước muốn xấu ác" và "nuôi/khởi lên"), chưa thống nhất; (5) "tu học như vầy" ở 3.1 so với "như vậy" ở 3.3 giữ nguyên (tầng dùng cả "học tập như sau" và "tu học như vầy").
    Ngoài phạm vi, chưa sửa: an4.165:2.2 và 3.2 còn "cắn xâu", "chỉ trích thô tục", "cảm thụ" và chỉ sáu vế (thiếu kaṭukānaṁ), 3.2 còn thiếu "đã khởi lên"; an4.114:9.2 đã sửa ở lượt khác; an4.243:6.1 và 6.4 dịch anavaññatti "ngợi khen" và lābha "được cho" lệch tiền lệ; an10.71:8.1 dịch vacanapatha "lời lẽ thô lập, lời lẽ đi xa" và kaṭukānaṁ "cay đắng", cần rà riêng.
