notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.5 — «gia tộc người xứ thấp tiện, gia tộc thợ tre, gia tộc thợ săn, gia tộc thợ xe, gia tộc người nhặt rác — …, nơi mà kẻo đói phải khó nhọc mới được» → «gia đình người dọn xác chết, gia đình người đan tre, gia đình người săn bắn, gia đình người làm xe, gia đình người nhặt rác — …, nơi mà phải chịu đựng khó nhọc mới được cơm áo» (cùng Pāli an4.85:2.2, 3.2, an6.57:11.2 và sn3.21:2.2; `caṇḍālakule` không phải «người xứ thấp tiện», và `kasirena ghāsacchādo labbhati` là «khó nhọc mới được cơm áo» — «kẻo đói» tối nghĩa). Giữ «chúng sinh» cho `puggala` theo cả bài an3.13 (bản đa số «một cá nhân»).
