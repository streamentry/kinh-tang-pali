notes:
  - >-
    **Bài ngắn (16 segment) nhưng danh sách mười vế rộng**: năm về của cải và
    năm về của phẩm chất. Sự đối xứng đó là ý của bài — tăng trưởng theo cả hai
    đường.
  - >-
    **`Ākaṅkhavagga` → *Phẩm Nguyện Cầu*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *If You Want*, và cả phẩm đúng một việc — *vị tỳ-kheo mong
    nguyện điều này, thì hãy làm điều kia* (`ākaṅkha` = mong nguyện).
    `Ākaṅkhasutta` → *Kinh Nguyện Cầu*.
    **`Ākaṅkhavaggo tatiyo` ở `an10.80:1.14` dịch là *Phẩm Nguyện Cầu, thứ ba***
    — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì phẩm này rõ
    ràng thứ tám (đúng như `8.` ở `0.2`). Tôi dịch theo Pāli vì Pāli là
    authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Năm vế về của cải đều 0 tiền lệ trong đúng nghĩa này, đặt mới**:
    `khettavatthū` → *ruộng đất*; `dhanadhañña` → *tiền tài và nông sản*;
    `dāsakammakaraporisa` → *nông nô, công nhân và lao dịch*; `catuppade` → *bốn
    loại vật nuôi* (tức bò, trừu, dê, gà — thứ tự truyền thống); `sārādāyī
    varādāyī kāyassa` → *làm cho đời sống này được trọn vẹn và cao quý*.
    `vaḍḍhi` → *tăng trưởng* và `ariyasāvako` → *bậc đệ tử Thánh* là 2 segment
    tiền lệ ở `an10.10:4.4`; `saddhā`, `sīla`, `suta`, `cāga`, `paññā` giữ
    nguyên theo chương 2 và chương 6.
  - >-
    **`2.1`–`2.4` là vế văn phong cổ** (`Dhanena dhaññena ca yodha vaḍḍhati…`) —
    bốn vế ngắn nối bằng dấu phẩy, tôi giữ dấu phẩy và chữ thường ở `2.2` vì
    Pāli vậy. Cùng khuôn đó ở `3.1`–`3.4`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
