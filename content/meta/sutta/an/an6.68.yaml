notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Không khoá nào có …pe…; nháy kép mở ở 1.1 và đóng ở 2.6 đúng Pāli.

  Xung đột thuật ngữ trong tầng, đã ghi lại thay vì tự chuẩn hoá: cùng công thức Pāli ‘X’ti netaṁ ṭhānaṁ vijjati được dịch hai kiểu. an6.67 (bài kề, cùng loạt an6.65-71) dùng thì điều ấy không thể xảy ra, còn an5.21 dùng điều này là không thể có. Riêng an6.68:1.4 có Pāli trùng nguyên văn với an5.21:1.5, nên khoá đó dùng lại nguyên văn của an5.21:1.5 (Muốn hoàn mãn chánh định mà chưa hoàn mãn chánh kiến — điều này là không thể có), và phần còn lại của bài cũng theo kiểu an5.21 cho nhất quán. Việc dùng lại nguyên văn trùng được ưu tiên hơn sự mượt của câu; chấp nhận rằng vế này hơi lệch nhịp với 1.2, 1.3, 1.5, 1.6, vốn bám Pāli chặt hơn.

  Tiền lệ có đếm và dùng lại: 0.2 → 7. Phẩm Chư Thiên (13, y hệt an6.67); 0.1 theo đa số toàn tầng là Kinh Tăng Chi Bộ (840 so với 280 bài giữ Aṅguttara Nikāya) — chọn đa số; sammādiṭṭhi → chánh kiến, sammāsamādhi → chánh định (theo an5.21:1.5); paripūressatī → làm tròn chánh kiến; nibbānaṁ sacchikaroti → chứng ngộ Niết-bàn (theo glossary); ṭhānametaṁ vijjati → điều này là có thể có. 0 tiền lệ, đặt mới: saṅgaṇikārāma → sự tụ họp; gaṇārāma → đám đông; saṅgaṇikārāmatā/gaṇārāmataṁ → niềm vui của sự tụ họp / của đám đông; abhiramissati → ham thích; paviveka → ở một mình trong sự vắng vẻ (paviveka có 223 tiền lệ nhưng chỉ dạng một mình); nimitta → dấu hiệu (148); saṁyojana → ràng buộc (138, chọn vì giữ được hệ với ràng buộc đã có, thay vì hàng ràng vốn 0 tiền lệ). Cụm vắng vẻ (32) đi cùng một mình để dịch eko paviveke.

  Triangulation mạnh nhất lát: có English Sujato đủ 16/16 khoá và 12/12 khoá có prose tại .cache/upstream/suttacentral/translation/en/sujato/sutta/an/an6.68. Cả khối 1.2-1.6 và 2.2-2.6 là sáu câu trong một dãy, đã giữ đúng quan hệ phủ định và đúng trạng thái chưa/đã của mỗi vế, không gộp. Không chạy được npm run validate|test|check|build theo lệnh phân công đợt này nên technical_integrity là 9.6.
