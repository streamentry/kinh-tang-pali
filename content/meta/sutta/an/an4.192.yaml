notes: |-
  Giải quyết draft 2026-10-12: kiểm toán độc lập, đọc đối kháng 76/76 khoá với Pāli root và bản Anh SuttaCentral.
  Mục chấm 2026-09-13 của GLM-5.3 Flash (ZCode) bị thay thế bằng mục này; blocker cũ được xử lý như sau.
  (1) Blocker "cắt ngắm" ở an4.192:9.5 và 11.5 (loại D): đã gỡ. Pāli tại hai khoá đó là câu dẫn trọn vẹn `‘yathā kho imassa āyasmato ummaggo … paññavā/duppañño …` (không có dấu lược), bản Việt hiện nay dịch đủ và không chứa `…`; không còn khoá nào mà Pāli không có `…` nhưng Việt có `…`.
  (2) Lỗi nghĩa/ngôn từ thật đã sửa (43 khoá đổi; khoảng 30 khoá là lỗi nghĩa, phần còn lại là đồng nhất diễn đạt):
  - `lābho ca, alābho ca, yaso ca, ayaso ca` (6.5, 7.3): bản cũ "được cho và không được cho, danh xưng và tai tiếng" — `lābha` là lợi lộc, không phải "được cho". Đồng nhất tiền lệ dn33, dn34 (2/2 khoá): "được lợi và mất lợi, có danh và mất danh, bị chê và được khen, lạc và khổ".
  - `ekena eko voharati, aññathā dvīhi, aññathā tīhi, aññathā sambahulehi` (4.4, 5.2): bản cũ "đối xử với người này một kiểu … mỗi người một kiểu khác" sai cấu trúc (mỗi nhóm một, hai, ba, nhiều người có một cách riêng; "một người với một người" bị đọc thành "người này"); 5.2 `yatheva … tathā …` là "cách nào … cũng cách ấy". Viết lại theo Pāli.
  - `vokkamati purimavohārā pacchimavohāraṁ` (4.5, 5.3): bản cũ "giao dịch phía trước (không) nhất quán với giao dịch phía sau" thiếu động từ "đi chệch"; theo tiền lệ bv2:148.4 ("không đi chệch khỏi đường đi"): "(không) đi chệch từ cách giao dịch trước sang cách giao dịch sau".
  - `na ittaraṁ` (1.3–1.6, 2.1, 3.4, 4.1, 5.5, 6.1, 7.5, 8.1, 12.1): bản cũ "không phải vội vàng" (`ittara` là ngắn ngủi, không phải hấp tấp); và "với người có chú ý/có trí" dễ đọc thành "với ai" thay cho "bởi người". Đồng nhất tiền lệ sn3.11:5.1–5.4 (4/4 khoá cùng công thức, đã dịch "không phải thời gian ngắn; cần người chú tâm … cần người có trí tuệ").
  - `iti kho panetaṁ vuttaṁ. Kiñcetaṁ paṭicca vuttaṁ?` và `iti yaṁ taṁ vuttaṁ idametaṁ paṭicca vuttaṁ` (2.2, 3.4, 4.2, 5.5, 6.2, 7.6, 8.2, 12.1): thể bị động, bản cũ thêm chủ thể "Ta". Theo tiền lệ mn139 (43 khoá, 30 khoá cho cặp cuối): "điều ấy đã được nói … vì nhân duyên gì" và "đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói".
  - `yathābhūte lokasannivāse yathābhūte attabhāvapaṭilābhe aṭṭha lokadhammā …` (6.4, 7.2): bản cũ "vì tám pháp thế tục xoay quanh" đổi cách định vị "trong … như vậy" thành quan hệ nhân quả ("vì") mà Pāli không có; viết lại "trong thế giới chúng sinh như vậy, trong sự đạt được thân như vậy, tám pháp thế tục xoay quanh thế giới". `lokasannivāsa` theo tiền lệ ps1.1:554 "thế giới chúng sinh".
  - `urattāḷiṁ kandati` (6.6, 7.4): bản cũ "đấm ngực" bỏ `kandati` (khóc); theo tiền lệ mn129, mn148 (64 khoá): "đấm ngực khóc lóc".
  - 6.3, 6.6, 7.1, 7.4: `ñātibyasanena … phuṭṭho samāno` là "khi bị tai họa về thân quyến … chạm đến" (tiền lệ mnd6:63, mnd11:5); bản cũ "gặp biến cố" mờ nghĩa `byasana`.
  - 8.7, 9.8, 10.5, 11.8: bản cũ "không thể trình bày nghĩa tóm lược hay cặn kẽ: chỉ bày, giảng dạy, …" đặt dấu hai chấm sai (các động từ nguyên mẫu `ācikkhituṁ … uttānīkātuṁ` là bổ ngữ của `paṭibalo`). Viết lại: "không đủ khả năng (đủ khả năng), dù tóm lược hay rộng rãi, để chỉ bày, giảng dạy, xác lập, thiết lập, mở ra, phân tích và làm rõ ý nghĩa của pháp ấy" theo sn22.89:13.2 (cùng chuỗi động từ).
  - `vegāyitattaṁ` (9.3, 11.3): bản cũ "sức lực" lệch; đổi "tốc độ". `udakarahada` (9.1, 11.1) "hồ nước" thay "ao".
  - 2.5, 3.3: `sīlesu dussīlo / sīlavā` bản cũ "không có giới nơi các giới" yếu hơn `dussīla`; đổi "thiếu giới" theo tiền lệ dn16, dn33 ("người thiếu giới"). 2.4, 3.2: `dīgharattaṁ` bản cũ "Lâu dài nay" (chữ lạ, kế thừa từ an10.85, ngoài phạm vi bài này) đổi "Suốt thời gian dài".
  - 9.4, 11.4: bỏ "sẽ biết" (Pāli `jānāti`, hiện tại).
  (3) Không có blocker loại A (Sujato có bài này tại commit ghim), B hay C trong danh sách cũ. Sujato để trống các khoá có nội dung 7.6, 9.7, 9.8, 11.7, 11.8 (và các khoá ngắn 9.6, 9.9, 11.6, 11.9); toàn bộ là phần lặp đúng khuôn của 8.6–8.8 và 10.4–10.6 đã đọc kỹ từ Pāli nên tự đứng vững; `triangulation` vì thế không vượt 8,8. Bản Việt hiện hành (`vietnamese-current`) chỉ có Pháp Cú; bài này không có tầng đó trong store (giới hạn tham chiếu, không phải lỗi văn bản), bản Hòa thượng Thích Minh Châu nguyên bài ở mục Tra cứu toàn văn chỉ dùng để hiểu cách đọc.
  (4) Bất định còn lại: `ummaggo` (8.4, 9.3, 9.5, 10.2, 11.3, 11.5) giữ "cách đến gần/cách ngoi lên" theo tiền lệ an4.186 ("sự đến gần") và mạch ví dụ con cá (Sujato "approach"); nghĩa chính xác của `ummaggo` và `abhinīhāro` ("ý hướng") chưa có căn cứ phân xử dứt khoát. `ṭhāna` ở 1.1 và 12.2 giữ "hoàn cảnh/phương diện" theo tiêu đề đã có "Kinh Các Hoàn Cảnh"; Sujato dịch cả hai là "things/situations", có thể xem lại thành "điều … trường hợp". `thāmo` "sự bền chí" (sn3.11: "sự kiên trì"). `…pe…` không có trong bài; không có `…` ở Việt.
  (5) Số Pāli: "bốn", "hai", "ba", "tám": cả bốn đã khớp Pāli (`cattāri`, `dvīhi`, `tīhi`, `aṭṭha`); không có số lớn. Nháy đơn/kép khớp Pāli từng khoá (0 lệch). Cặp Pāli trùng nguyên văn trong bài (8.4/9.5, 8.6/9.7, 8.7/9.8, 8.8/9.9, 10.2/11.5, 10.4/11.7, 10.5/11.8, 10.6/11.9) bản Việt đồng nhất (8 cặp đã dò, 0 cặp khác; 8.7/9.8 và 10.5/11.8 được viết giống nhau). 76/76 khoá, thứ tự khoá theo Pāli.
  (6) `technical_integrity: 9.6` — cổng kỹ thuật chưa chạy trong phiên này; còn phải chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trước khi chốt trạng thái.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an4.192:2.2, 4.2, 6.2, 8.2 — «Điều ấy đã được nói như vậy.
  Điều ấy được nói vì nhân duyên gì?» → «Đó là điều đã được nói. Được nói đến vì nhân duyên gì?», vì cùng
  Pāli `iti kho panetaṁ vuttaṁ. Kiñcetaṁ paṭicca vuttaṁ?` đa số 41/51 khoá dùng công thức này và bài cũng
  dùng «đó là điều đã được nói» ở an4.192:3.4; nghĩa không đổi, chỉ đồng nhất công thức.
