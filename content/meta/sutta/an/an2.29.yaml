notes: |-
  Bài hai phần, không theo công thức Dveme dhammā nên không dùng nguyên văn nhóm an2.163. Lời nói mở ở 1.1 và đóng ở 2.2 theo đúng Pāli (Pāli không đóng ngoặc ở 1.2).
  dussīla thành người phá giới (7 tiền lệ người phá giới trong tầng Việt); sīlavant thành người giữ giới; nirayo vā tiracchānayoni vā thành địa ngục hay loài súc sinh (6 tiền lệ địa ngục, hay đi đến súc sinh); devā vā manussā vā thành cõi trời hay cõi người (8 tiền lệ).
  paṭiggāhā thành nơi đón nhận: 0 tiền lệ trong tầng Việt, đặt mới theo nghĩa reception của Pāli và cách Sujato đọc là places waiting to receive. Đây là điểm terminology yếu nhất của bài nên terminology chỉ 9.1.
  Bản Anh Sujato đã ghim có đủ mọi khoá của bài; tầng Việt hiện hành không có Tăng Chi Bộ (bilara chỉ chứa Pháp Cú) nên đối chiếu Pāli + Anh.
  Tiêu đề Kinh Hai Nơi Đón Nhận là tên mô tả do người biên tập đặt; 0 tiền lệ, ghi rõ ở đây.
  Không có blocker; điểm trung bình số học thô 9.45 nên published.
