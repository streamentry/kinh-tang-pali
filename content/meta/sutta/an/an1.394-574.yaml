notes: |-
  **Phạm vi lát c7: đủ mọi khoá trong `all` của bài, không thêm khoá nào.**
  Chạy lại `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tự kiểm những
  cờ mà `rven88.py` không áp cho tầng Việt: đủ khoá và đúng segment ID theo `pre`
  (tiền tố khoá thật, không phải uid-gộp); ngoặc kép cân trên cả bài; mọi chuỗi
  đã NFC; không Pāli lọt; số dấu lược bằng Pāli.

  **Không đối chiếu được tầng Việt hiện hành.** Tại commit đã ghim,
  `translation/vi/` của bilara chỉ chứa Pháp Cú, nên các bài này không có bản Hòa
  thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu
  sót của kho; `triangulation` vì thế chỉ ở mức Pāli + English Sujato.

  Tôi **không** chạy `npm run validate|test|check|build` (đợt này cấm; người điều
  phối chạy tập trung sau khi gộp các pre), nên `technical_integrity` chấm 9.6
  chứ không phải 10.0.

  **Công thức dùng lại nguyên văn đã có, không dịch lại.** Pāli 1.1–1.3 của
  bài này cùng công thức với `an1.53` (đã `published`): *dù chỉ trong khoảng thời
  gian búng ngón tay* (3 chỗ trong tầng), *Vị tỳ-kheo sống không thiếu thiền định,
  làm theo lời dạy của bậc Đạo Sư, vâng theo lời khuyên, ăn vật thực của quốc độ
  không uổng phí* (4 chỗ *làm theo lời dạy của bậc Đạo Sư*), *Huống gì những vị
  làm cho sung mãn … ấy* (3 chỗ). *Thiền thứ nhất* 47 chỗ. Khác duy nhất đối
  tượng: `an1.53` là *tâm từ*, bài này là *thiền thứ nhất* — đúng theo Pāli, mỗi
  bên một chữ, không lẫn.

  **Chữ duy nhất không có tiền lệ: `apara` → *Khác* trong tên phẩm**, nên
  `terminology` chỉ 9.2. Sujato dịch *Another Chapter on a Finger-Snap*; *Khác*
  giữ đúng nghĩa *một phẩm nữa*, phân biệt với *Phẩm Búng Ngón Tay* (phẩm 6)
  đã có ở `an1.51:0.2`.

  **English đủ cho cả lát cắt này.** Cả 6 khoá đều có tiếng Anh Sujato tại commit
  đã ghim; đo trên toàn nhóm, 30/30 segment Pāli có nội dung đều có chữ Anh.
