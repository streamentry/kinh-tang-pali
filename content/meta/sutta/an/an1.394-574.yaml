  ghi **351** ký tự (6 khoá của lát c7) và sau khi ghi **3.217** ký tự (76 khoá mới:
  2.866). Toàn bài gộp có 5.742 ký tự Pāli.

  **Năm phép kiểm tự chạy** (`_hvi.py` không đủ: nó chỉ quét khoá từ 40 ký tự
  nên chạy rỗng ở lát này, chỉ đếm ngoặc kép không đếm nháy đơn, và lọc `\b\d+\.0\b`
  trong nội dung Pāli chứ không phải tên khoá):
  1. set(khoá Việt) == set(khoá Pāli): lát **82 == 82**, thiếu 0, thừa 0; cả bài
     gộp **82/169** vì 87 khoá của lát m2 chưa gộp.
  2. Nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli **từng khoá**: **0 lệch / 82 khoá**;
     2 khoá có ngoặc kép mở, 7 khoá có nháy đơn mở. Dưng ngoặc kép trên lát là +1
     **ở cả Pāli lẫn bản Việt** (`an1.395:1.1` mở ngoặc, dấu đóng nằm ngoài lát),
     nên đây là hạn chế của bản chụp upstream chứ không phải lỗi dịch.
  3. Pāli trùng nguyên văn **trong chính lát**: **3 nhóm** (`Tāni abhibhuyya:`
     6 khoá, `‘jānāmi passāmī’ti—` 6 khoá, `evaṁsaññī hoti.` 4 khoá), và
     **0 nhóm nào có bản Việt khác nhau**.
  4. Dấu lược: Pāli của lát có **8** khoá `…pe…`, **36** khoá `…` trần, **38** khoá
     không có dấu lược; **lệch 0 khoá**. `…pe…` dịch thành đúng một `…`.
  5. Mọi con số trong khối này do script in ra, không đo bằng mắt.

  **Dùng lại nguyên văn bản dịch đã có — phép quan trọng nhất của lát.** Đã dựng
  lại chỉ mục Pāli↔Việt toàn tầng từ đĩa (5.221 bài có cả hai vế, 71.118 chuỗi
  Pāli distinct). **35/76 khoá mới lấy nguyên văn từ 35 khoá tiền lệ** ở
  `an3.156`, `an3.157`, `an3.158`, `an3.159`, `an3.160`, `an3.161`, `an3.162`,
  `an8.119`, `sn47.40`. Đã dò **182 cặp** (khoá của lát × nơi khác trùng lõi Pāli);
  **41/82 khoá không có Pāli trùng lõi ở bất kỳ đâu**, nên dịch từ Pāli theo đúng
