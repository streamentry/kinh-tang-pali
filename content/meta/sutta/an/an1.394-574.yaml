  *sống quán thân trên thân* (an: 10, toàn tầng: 78), *tinh cần, tỉnh giác, có niệm,
  xa lìa tham lam và buồn phiền nơi đời* (an: 6, toàn tầng: 96) — cụm này là bản
  Việt trùng nguyên văn của `an3.156:5.2` và `an3.156:5.5`;
  *phát sinh khát cầu, nỗ lực, tinh tấn, giữ vững tâm, dốc sức* (an: 4, toàn tầng: 4)
  lấy nguyên văn từ `an3.157:3.2-3.5` cho cả bốn khoá 406-409;
  *tu tập thần túc đủ yếu tinh tấn* (an: 4, toàn tầng: 4) từ `an3.158`;
  *Vị ấy tu tập* (an: 5, toàn tầng: 34) — chỉ đặt ở khoá mở đầu mỗi nhóm, đúng
  như `an3.158:1.1`, `an3.159:1.1`, `an3.160:1.1`, `an3.161:1.1`, `an3.162:1.1`;
  khoá nhãn số dải (`395–401` …) giữ nguyên chuỗi số có dấu gạch nối, khớp 12
  khoá `an1.102-109:1.0` … đã có.

  **Bốn chỗ phải phán xử, đã ghi lại để người biên tập xem:**
  1. `suvaṇṇadubbaṇṇāni`: chọn **màu vàng, màu xấu** — nguyên văn từ `an8.119:1.3`
     (an: 5 chỗ) và `an8.65:1.3` dịch là *đẹp và xấu*. Sujato dịch *both pretty and
     ugly*, nên hai cách đều có chỗ dựa; ta theo tầng.
  2. `vedanāsu vedanānupassī`: chọn **sống quán thọ trên các thọ** (an: 2, toàn
     tầng: 8, `an3.156:5.3` và `an9.72:3.4`) chứ không phải *thọ trên các cảm thọ*
     (an: 2, toàn tầng: 37, `an9.63:2.4` và `an9.64:2.4`). Hai bản Việt ấy có
     **cùng một chuỗi Pāli** `vedanāsu …pe…` nên tầng đang tự mâu thuẫn 2–2 trong
     bộ an; ta chọn theo `an3.156` để cả nhóm 402-405 thành một bộ, vì 405 phải
     theo `an3.156:5.5` (trùng nguyên văn).
  3. `rūpasaññī` và `arūpasaññī`: bản Việt của `an8.119` dịch cả hai giống nhau
     (*bằng tưởng thấy về chính nó*), nên phân biệt có tưởng sắc / không tưởng sắc
     của Pāli mất đi. `an8.65` có giữ (*Ở nội có tưởng sắc* / *Ở nội không tưởng
     sắc*, 8 chỗ trong an), nhưng `an1.439:1.1` **trùng nguyên văn** `an8.119:1.3`
     nên phải dùng lại; giữ nhất quán cả nhóm 439-444 còn hơn đổi giữa chừng.
     Nếu người biên tập muốn giữ phân biệt thì phải sửa cả `an8.119` cùng lúc.
  4. Chữ hoa đầu câu: Pāli của lát hay viết hoa chữ đầu ở giữa danh sách
     (`Kāye kāyānupassī`, `Anuppannānaṁ …`) vì đó là đầu segment, nên bản Việt
     đặt chữ thường cho 402-409, khớp `an3.156:5.2` và `an3.157:3.2` (Pāli viết
     hoa `Anuppannānaṁ` mà bản Việt vẫn thường).

  **Ngoặc kép chạy qua ranh giới lát.** `an1.395:1.1` mở `“` nhưng dấu đóng nằm
  ở `an1.574:2.3` (`… bahulīkarontī”ti.`), tức là ngoài lát này. Ta giữ đúng một
  `“` ở khoá đó theo Pāli; khi lát m2 gộp xong thì cả bài cân (Pāli cũng vậy).

  **`ti` — quy ước không đồng nhất toàn tầng, đo ở phạm vi gần nhất `an1.*`:**
  khoá `:0.1` có **31** chỗ, trong đó **21** dùng *Kinh Tăng Chi Bộ 1* và **10** dùng
  *Aṅguttara Nikāya 1.xxx–yyy*; theo bộ `an` là **186** chỗ với *Kinh Tăng Chi Bộ
  1*. Tệp này đã có sẵn *Kinh Tăng Chi Bộ 1* nên giữ nguyên (là phía đa số ở cả hai
  phạm vi). Riêng `:0.2` *29. Phẩm Búng Ngón Tay Khác* là khoá của lát c7:
  `apara` dịch *Khác* để phân biệt với *Phẩm Búng Ngón Tay* (phẩm 6) ở
  `an1.51:0.2`, đúng như Sujato *Another Chapter on a Finger-Snap*; đây là chữ duy
  nhất chưa có tiền lệ nên `terminology` không cho 10.

