    2. Nháy đơn `‘’` + ngoặc kép `“”` khớp Pāli **từng khoá**: dưng `“` trên cả bài là
       **+0 ở Pāli và +0 ở Việt**, dưng `‘` là **+0 / +0**. Bốn khoá lệch về số ngoặc
