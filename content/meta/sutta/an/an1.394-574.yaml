      đó, **7** khoá dùng cách khác (`an9.24`, `an9.31`, `an9.46`, `an9.47`, `an9.52`,
      `an9.61`, `an11.19`). `dn15:33.17`, `dn15:34.7`, `dn15:35.15`, `dn15:35.17` viết hoa
      thành *Phi Tưởng Phi Phi Tưởng Xứ*. ⇒ Đây là **quy ước của tầng, không phải lỗi**;
      **giữ nguyên** ở `an1.453:1.1` và `an1.454:1.1`.
    * **Pāli kết `….` ⇒ Việt kết ` ….`** — xem mục dấu lược ngay trên.

    **Thuật ngữ của lát m2, kèm số đếm trong tầng** (đo bằng script):
    * `kasiṇa` → **môn địa**: **22** khoá / **2** tệp — `an10.25` (tệp đó còn đặt nhan đề là
      *Kinh Môn Địa*) và chính tệp này; mười môn của `an1.455-464` khớp **đúng một-một**
      với `an10.25:1.3-1.12`. Giữ nguyên, có tiền lệ.
    * `subhanteva adhimutto hoti` (`an1.449:1.1`) và `Rūpī rūpāni passati`
      (`an1.447:1.1`): mỗi cụm chỉ có **2** khoá trong toàn tầng, và khoá kia dịch **y
      hệt** — `an8.66:3.1` *Chỉ quyết tâm vào tịnh.*, `an8.66:1.3` *Có sắc thì thấy các
      sắc*. Lát m2 dùng lại nguyên văn. Đây cũng là bằng chứng cho thuyết `naṁ` ở trên:
      cụm `… naṁ bahulīkarontī` ấy **đúng là** kết thúc bằng `arūpasaññī` ở `an1.446` rồi
      sang `subhanteva` ở `an1.449`, giống hệt cấu trúc `an8.66`.
    * `ākāsānañcāyatana` / `viññāṇañcāyatana` → **xứ vô số hư không / xứ vô số thức**:
      **24** khoá mỗi cụm, đúng dạng `an8.120:1.3`.
    * `maraṇassati` → *tỉnh thức về sự chết*: tiền lệ `an6.20:1.4`;
      `cāgānussati` → *sự hào phóng*: `an6.25:5.1`; năm tưởng về xác → *bộ xương / đầy
      giòi bọ / xanh thẫm / nứt rạn / sưng phồng*: `an4.14:4.2` khớp từng cụm;
      `sabbaloke anabhiratisaññaṁ` → *không ham muốn trong tất cả thế gian*:
      `an5.303:1.3` khớp nguyên văn; `asubha` → *bất tịnh*: `an5.303:1.3`;
      `kāyagatāsati` → *niệm thân*: **25/29** khoá Pāli; `ānāpānassati` → *niệm hơi thở*:
      **47/52**.
    * **Chỗ KHÔNG có tiền lệ** (vì vậy `terminology` chỉ 9,0, không cho 10):
      `sahagataṁ` → *đồng hành với* có **2** khoá, cả hai đều của lát này; **22** khoá
      Pāli còn lại trong tầng dùng *câu hữu với* / *có … đi cùng*. Ta giữ *đồng hành với*
      vì đúng nghĩa và dùng nhất quán trong cả hai khoá của tệp. Ngoài ra `cāgā` ở đây là
      *hào phóng* trong khi một số tệp tầng dùng *sự cho* (`an6.9:1.3`, `an6.141:1.3`) hoặc
      *buông xả* (`an5.40`, `an7.6`), `saṅgha` ở đây là *Tăng chúng* trong khi tầng có cả
      *Tăng đoàn*; và `apara` → *Khác* (`an1.394:0.2`, khoá của lát c7) vẫn là chữ duy
      nhất chưa có tiền lệ, như lát m1 đã ghi.

    **Bất định còn lại mà tôi không sửa: `rūpasaññī` / `arūpasaññī`.** Ở **9** khoá
    (`an1.439:1.1` tới `an1.446:1.1` và `an1.448:1.1`) Pāli phân biệt `rūpasaññī` (thấy sắc
    bên trong) với `arūpasaññī` (không thấy sắc bên trong), còn bản Việt gộp cả hai thành
    *bằng tưởng thấy về chính nó* ⇒ mất phân biệt có sắc / không có sắc. Lát m1 đã phán
    xử theo `an8.119:1.3` và ghi lại; tôi giữ nguyên phán xử đó cho cả nhóm 439-446 và
    chấp nhận đây là lý do `semantic_fidelity` không đạt 10. Nếu người biên tập muốn giữ
    phân biệt thì phải sửa `an8.119` cùng lúc, không sửa riêng tệp này.

    **Hai điểm upstream đo được, không phải thiếu sót của kho:**
    * Nhãn `an1.495:1.0` là `495–574` nhưng tầng Pāli đã ghim **không có** khoá nào cho
      `an1.505`–`an1.564`; tầng Sujato thì **có 6** khoá không có bản Pāli tương ứng
      (`an1.505-514:1.1` … `an1.555-564:1.1`, lần lượt *the second absorption* … *rejoicing*).
      Tệp Việt bám đúng tập khoá Pāli, không tự sinh khoá.
    * `an1.464:1.1` có `(…)` **ngay trong Pāli đã ghim** (`viññāṇakasiṇaṁ bhāveti …. (…)`),
      nên `(…)` được giữ lại là giữ Pāli, **không** phải khoá bỏ dịch — quy tắc “(…) đứng
      một mình là khoá chưa dịch” không áp dụng ở đây.

