    ngoặc **kép** không đếm nháy **đơn**, và lọc `\b\d+\.0\b` trong **nội dung Pāli**
    chứ không phải **tên khoá**):
    1. `set(khoá Việt) == set(khoá Pāli)`: Việt **169** = Pāli **169**, thiếu **0**,
       thừa **0**; **thứ tự khoá trùng khớp Pāli** (`list(V) == list(P)` đúng). Lát m1
       **82**, lát m2 **87**, giao nhau **0**, hợp **169**. Câu cũ của lát m1 ghi `82/169`
