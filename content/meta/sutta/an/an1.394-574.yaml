  dấu câu ở đuôi (31), và bỏ hết dấu lược + dấu câu (35).

  **Thuật ngữ, kèm số đếm trong tầng** (đo bằng script, phạm vi ghi trong ngoặc):
  *thiền thứ nhất/hai/ba/tư* (an1: 0/0/0/0; an: 0/24/24/29; toàn tầng: 0/55/53/55 —
