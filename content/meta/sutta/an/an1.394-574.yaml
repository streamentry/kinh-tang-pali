    **Ba chỗ đã tra tiền lệ bằng `grep` kèm đếm:**
    * **`naṁ` trong `Ko pana vādo ye naṁ bahulīkarontī”ti.`** — cụm này trùng **byte**
      ở đúng **5** khoá toàn tầng, và **tiền đối của `naṁ` khác nhau thật**, nên **không
      ép một dạng**. Đọc vế trước ở **từng** bài: `an1.53:1.4`, `an1.54:1.4`, `an1.55:1.4`
      đều đứng sau `bhikkhu mettācittaṁ …`, tức `naṁ` chỉ chính cái `cittaṁ` — nên *tâm ấy*
      **đúng** ở cả ba; `an1.394:1.1` có `paṭhamaṁ jhānaṁ bhāveti`, `naṁ` chỉ `jhānaṁ` —
      nên *thiền ấy* của lát m1 **đúng hơn**, tôi **giữ nguyên**; còn `an1.574:2.1` là
      `Ayaṁ vuccati, bhikkhave:` và `an1.574:2.2` là `'bhikkhu arittajjhāno viharati …'`,
      trong đó **không có** `cittaṁ` lẫn `jhānaṁ` nào đứng trước, mà `naṁ` lại là trung
      tính nên **không thể** chỉ `bhikkhu` (đực tính). Tiền đối hợp lý là `Ayaṁ` trung tính
      ngay ở `an1.574:2.1` (chính m2 dịch *điều này được gọi là*) ⇒ **điều ấy**. *Tâm ấy*
      ở đây là mượn tiền đối từ bài khác, và Sujato để *it* nên không đòi một danh từ cụ
      thể. **Kết luận: sửa 1 khoá (`an1.574:2.3`), giữ nguyên 4 khoá kia.** Người biên tập nên
      phán một lượt cho cả chuỗi `an1.557-574` nếu lát sau cũng gặp cụm này.
