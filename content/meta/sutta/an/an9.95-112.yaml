notes: |-
  UID-GỘP, ĐÃ ĐẾM THẬT: tệp root/pli/ms/sutta/an/an9/an9.95-112_root-pli-ms.json có
  đúng 13 khoá, tiều tố DUY NHẤT `an9.95-112:`. KHÔNG có khoá lồng-range nào. `all` khớp
  tệp 13/13.
  Khác an8.121-147 ở đúng một điểm đo được: Pāli bài này đặt `…pe…` ở MỌI vế 1.1–1.9, còn
  bài kia chỉ có ở 1.1 và 1.9, các vế giữa là `…` trần. Số dấu lược mỗi khoá vẫn là một, nên
  cách dịch 1.1–1.9 giữ nguyên văn của an10.240-266 và an7.618-644 cho khớp công thức.
  1.10 dịch chín pháp này cần được tu tập, theo đúng chữ `nava dhammā` của Pāli.
  BẤT ĐỊNH CỦA CHÍNH NGUỒN, ghi lại chứ không sửa: Pāli liệt kê tám mục (parikkhayāya,
  pahānāya, khayāya, vayāya, virāgāya, nirodhāya, cāgāya, paṭinissaggāya) nhưng lại đếm là
  nava, chín. SuttaCentral cũng dịch these nine things. Bản Việt giữ chín theo Pāli; bản
  đọc thành chín có lẽ là tính thêm `pariññāya` ở 1.1 vào. Đây là mâu thuẫn bên trong nguyên
  văn, không phải lỗi dịch, nên hạ semantic_fidelity 9.4.
  Bản đọc chín mục của SuttaCentral là letting go of greed ở 1.9; Pāli chỉ có
  `paṭinissaggāya …pe…`, vế danh từ của tham đã rõ ở 1.1. Giữ "để buông bỏ …" cho khớp
  nguyên văn của an7.618-644 và an10.240-266, không thêm chữ vào thân kinh.
  Tiền lệ `:0.1` và `:0.2`: cùng nguồn với an8.121-147 (xem ghi chú bài đó).
  Coverage: mọi khoá ngắn hơn 40 ký tự nên không vào mẫu số; SuttaCentral có đủ 13/13.
  Không có bản Việt tham khảo (vietnamese-current chỉ có Pháp Cú).
