notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `7.9` (`sambādho gharāvāso rajāpatho, abbhokāso pabbajjā`) — «Đời sống tại gia là chật hẹp và dơ bẩn; đời sống xuất gia rộng mở.» → «Đời sống gia đình chật hẹp và bụi bặm; đời xuất gia rộng mở.» (6/10 khoá trùng, mn51, mn36, mn38…). Sửa thêm một khoá cùng bài để dấu lược cân bằng Pāli: `13.10` (`vivicceva kāmehi …pe… catutthaṁ jhānaṁ`) — bản trước thêm nội dung Pāli đã lược («chứng thiền thứ nhất … thiền thứ hai … thiền thứ ba …») và có ba dấu `…` → «vị ấy hoàn toàn ly dục … chứng và an trú thiền thứ tư.» (cùng cách an5.76:18.15, an5.192:8.12).
