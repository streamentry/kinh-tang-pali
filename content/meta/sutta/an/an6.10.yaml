notes: |-
  Đợt 19, lane 12. Dịch trọn 68/68 khoá từ Pāli root đã ghim, đối chiếu English Sujato đã ghim, bản nguyên bài của Hòa thượng Thích Minh Châu (chỉ để tra cứu toàn văn, không phải tầng cột) và các bài anh em an6.9, an6.25, an6.26, an11.12, an11.13, an3.70.

  **Coverage Anh: 35/51 = 68,6% trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0); dưới sàn 0,80 nên bài giữ draft.** Sujato để trống 16 khoá dù Pāli viết đầy đủ: 3.4–3.6, 4.4–4.6, 5.3–5.5, 6.5–6.7, 7.4–7.7; Sujato nối câu qua chỗ trống bằng dấu lược ở các khoá 3.3, 4.3, 5.2, 6.4. Chưa có lớp english-project cho an6.10, và tại commit đã ghim bilara chỉ phân phối Pháp Cú ở tầng Việt hiện hành. Ở những chỗ ấy Pāli phải tự đứng vững: các khoá trống đều là lượt lặp nguyên văn công thức của lượt đầu (2.4–2.9), nên dùng lại đúng bản Việt của khoá gốc. Triangulation hạ xuống 7,5 vì lý do đó.

  **Dùng lại nguyên văn.** Trong chính bài: 3 nhóm Pāli trùng (mỗi nhóm 6 khoá: 2.6 = 3.5 = 4.5 = 5.4 = 6.6 = 7.10; 2.7 = 3.6 = 4.6 = 5.5 = 6.7 = 7.11; 2.8 = 3.7 = 4.7 = 5.6 = 6.8 = 7.12), tổng 45 cặp, 0 cặp bản Việt khác nhau. Với tầng đã dịch: 22 khoá có Pāli trùng nguyên văn ở bài khác; 13/22 dùng lại đúng bản Việt đa số (tiêu đề phẩm, mở đầu 1.1, công thức Như Lai 2.3, *Khi hoan hỷ, hỷ sanh khởi …* (6 khoá của bài này, tầng có 4 tiền lệ giống hệt), công thức Pháp 3.2, *Thứ mười*, *Tóm lược*), 9/22 khác có chủ ý: lời *Ujugatacitto kho pana* (an11.12 ×2, 6 khoá của bài này) vì an11.12 dịch *Mahānāma* thành *Ma-ha-ca* (10 khoá so với 82 khoá viết *Mahānāma*) và dịch *pāmojja* là *niềm vui* trong khi cùng câu sau lại dịch *pamudita* là *hoan hỷ*; tôi dùng *niềm hoan hỷ gắn liền với Pháp* để hai chữ cùng gốc đọc ra cùng gốc; công thức Tăng 4.2 (tầng có ba cách: *Tăng đoàn đệ tử … hiến dâng* 4 khoá, *Chúng đệ tử … đài các* 2 khoá, *Tăng chúng … bố thí* 2 khoá; tôi theo cách đầu); danh sách chư thiên 7.2 (an3.70:16.4 viết *Đề Noa*, *Hóa Tự Tại*, *Yama*; tôi sửa như dưới đây); khoá 2.5 ngắn đã có đúng một tiền lệ ở an11.12:4.4 nhưng đổi *thời điểm* thành *lúc* cho khớp 2.4.

  **Thuật ngữ đã đo.** `ariyasāvako` → *vị thánh đệ tử* (an6: 23/23 khoá; toàn `an` 30 khoá so với *đệ tử Thánh* 110 khoá, chủ yếu ở an5 là 53). `anussarati` → *nhớ tưởng* (tầng: *hồi tưởng* 27, *quán nhớ* 18, *tùy niệm* 12, *ghi nhớ* 12, *nhớ tưởng* 10; chọn *nhớ tưởng* vì khớp an6.9 *Nơi Nhớ Tưởng*, an6.141 *sự nhớ tưởng về …* và an11.12, cùng một câu chuyện Mahānāma), `-anussati` → *sự nhớ tưởng về …*. `rāgapariyuṭṭhitaṁ` → *bị tham ám ảnh* (6 khoá, an6.26) so với *đầy tham* 5, *đầy tràn tham ái* 2; *tham ái* sai vì *rāga* không phải *taṇhā*. `ujugata` → *thẳng* (an6.25, an11.12; an6.26 dùng *chánh trực*). `saṅgha` → *Tăng đoàn* (5 khoá so với *Tăng chúng* 6, *Tăng* 2). `cāga` → *sự bố thí* (*bố thí* 12 khoá, *hào phóng* 4, *xả thí* 3). `suta` → *sự học rộng* (an6.26:7.8; ba cách khác nhau mỗi cách 1 khoá). `pajā` → *chúng sinh* (54 khoá, an11.13 dịch đúng câu này như thế) so với *loài người* 55. `visame … samaṁ` → *quân bình … bất quân bình* theo sn1.18 (*sống quân bình giữa chốn bất bình*; sn1.7 và sn1.8 dịch khác là *thăng bằng*). `abyāpajjo` → *không ác ý* theo an6.26 (*abyāpajjena* → *không ác ý*, 6 khoá). Tên cõi trời: `Hóa Lạc` (9 khoá), `Phạm Chúng` (5 so với *Phạm thiên* 3), `Tha Hóa Tự Tại` (5 khoá, giữ đủ chữ *para-* *tha*) so với *Hóa Tự Tại* 10; `Yāma` (5) so với *Yama* (9) và `Tusita` (10, ngang *Đâu-suất* 10, hơn *Đề Noa* 8): tôi giữ dạng gần Pāli.

  **Điểm khó nhất, không phân xử hoàn toàn: `visamagatāya pajāya samappatto viharati, sabyāpajjāya pajāya abyāpajjo viharati`.** Cụm này 0 tiền lệ trong tầng (0 khoá có `visamagatāya`). Bản Anh Sujato dịch *lives in balance among people who are unbalanced, lives untroubled among people who are troubled*; bản nguyên bài của Hòa thượng Thích Minh Châu dịch *bình thản … không bình thản* và *có não hại … không não hại*. Tôi dịch *quân bình … bất quân bình* (visama: không đều, gồ ghề; sama: đều, bằng) và *không ác ý … có ác ý* (cùng gốc `byāpajja`/`vyāpāda` mà an6.26 đã dịch *ác ý*). Hai điểm bất định: (1) `visamagatāya` có thể đọc là chúng sinh *đã đi vào chỗ bất bình* hoặc *đã rơi vào tà vạy*; tôi giữ cách đọc ít giả định nhất; (2) `sabyāpajjāya` có thể là *có ác ý* hay *có não hại*, hai cách đều đứng được.

  **Các bất định khác.** (1) `āgataphalo` → *đã đạt quả* (0 tiền lệ trong tầng; chỉ có `diṭṭhippatto viññātasāsano` ở mil5.3.1 dịch rất xa Pāli; Sujato *reached the fruit*, Hòa thượng Thích Minh Châu *đã đi đến quả*). `viññātasāsano` → *đã thấu rõ lời dạy* (Sujato *understood the instructions*; Hòa thượng Thích Minh Châu *đã liễu giải giáo pháp*). (2) `vihāra` ở 1.3 và 2.1 là *cách sống* (nghĩa *kiểu an trú*), `bahulaṁ` là *phần nhiều*. (3) `yācayogo` → *sẵn lòng đáp lời xin*: an11.13:9.3 dịch *chuyên cần bố thí*, an6.26:6.3 *đáp ứng sự cầu xin*, an6.25:5.3 *hướng về việc cầu xin*; nghĩa Pāli là *thích hợp để được xin*, tôi chọn cách đọc sát nhất. (4) `payatapāṇi` → *tay rộng mở* (an6.25 và an11.13 cùng cách). (5) `asabalāni akammāsāni` → *không vết đốm, không vết nhơ* theo an3.70:13.3, nhưng bản ấy ghi *vết đố*, có lẽ là lỗi gõ thiếu *m*; tôi sửa ngầm, không theo. (6) `Ayaṁ vuccati` → *vị này được gọi là* (đại từ đực, chỉ vị thánh đệ tử trong lời trích kế tiếp); sn12.27:5.2 dịch *điều này được gọi là*. (7) Nháy đơn: 2.9, 3.8, 4.8, 5.7, 6.9, 7.13 đóng cả ‘ lẫn ’ vì Pāli mở và đóng trong cùng khoá; 6.2 chỉ mở, 6.3 chỉ đóng, 7.2 chỉ mở, 7.7 chỉ đóng; 1.3 mở và đóng ngoặc kép; 2.1 chỉ mở và 8.1 chỉ đóng ngoặc kép.

  **Khoá `Tassuddānaṁ`.** `balāni` dịch *bài Bala* (một bài, an6.4); tổng: 2 (*āhuneyyā*) + 1 (*indriya*) + 1 (*bala*) + 3 (*ājānīyā*) + 1 (*anuttariya*) + 1 (*anussati*) + 1 (*mahānāma*) = 10, khớp *dasa* và tiêu đề các bài an6.1–an6.10 đã dịch.

  **Số.** Không có số lớn. *cattāri purisayugāni aṭṭha purisapuggalā* → *bốn cặp người, tám hạng cá nhân* (4 và 8, cùng cách ở sn55.1:2.7, sn41.10:3.8, an5.179:5.2, an5.32:6.2); *Dasamaṁ* → *Thứ mười*; *Āhuneyyavaggo paṭhamo* → *Phẩm Đáng Cúng Dường, thứ nhất*. Danh sách chư thiên: tám nhóm (*cātumahārājikā, tāvatiṁsā, yāmā, tusitā, nimmānaratino, paranimmitavasavattino, brahmakāyikā, tatuttari*), dịch đủ tám.

  **Kiểm đã làm:** 68/68 khoá khớp Pāli, đúng thứ tự; nháy đơn và nháy kép khớp Pāli từng khoá, 0 lệch trên 68 khoá; không có dấu lược trong Pāli (0 khoá) nên Việt cũng 0 dấu lược; NFC, 0 khoá rỗng, 0 khoảng trắng thừa, không có Pāli lọt sang bản Việt ngoài tên riêng; 45 cặp Pāli trùng trong bài, 0 cặp Việt khác.

