notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 6.5, 7.5, 8.5, 9.5, 13.1, 13.6 — `paralābhasakkāragarukāramānanavandanapūjanāsu`: “khi người khác được cho, được tôn kính, được trọng vọng, được cúng dường, được đảnh lễ, được phụng thờ” → “đối với lợi dưỡng, sự tôn trọng, sự cung kính, sự quý mến, sự đảnh lễ, sự cúng dường mà người khác nhận được” (sáu mục khớp `lābha, sakkāra, garukāra, mānana, vandana, pūjana`; bản trước dịch `lābha` là “được cho” và `mānana` là “cúng dường”, trùng với `pūjana`; theo `mn135:11.2`, `mnd15:189.3`); `upadussati` “bực dọc” → “oán ghét” (chữ “bực” đã dùng cho `upāyāsa` ở 6.1); giữ “ganh tị” cho `issati` trong cả bài. Ở 13.1 và 13.6, `anissāmanikā` tách thành vế riêng “không hay ganh tị” (bản trước lặp “không ganh tị, không ganh tị”). Giữ nguyên các khoá khác.
