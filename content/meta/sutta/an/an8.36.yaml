notes: |-
  Đã đọc HẾT p49.txt (40 khoá) trước khi viết. Xác minh bằng manifest: `an8.36`
  CÓ tệp Anh đã ghim `sutta/an/an8/an8.36_translation-en-sujato.json`, và coverage
  27/27 segment Pāli có nội dung = 100%, trên ngưỡng `englishCoverage.floor = 0.8`
  của `source/layers.yaml` ⇒ không cần entry trong `reference-gaps.yaml`. Tầng
  `vietnamese-current` vắng (commit đã ghim chỉ có 26 tệp Pháp Cú) nên
  `triangulation` 9.3, không phải 10.

  `:0.1` THEO ĐA SỐ ĐẾM ĐƯỢC CẢ BỘ, và đây là chỗ tôi đo thêm được điều người
  điều phối chưa nêu: toàn bộ tầng `an` (1.613 bài) là `Kinh Tăng Chi Bộ N` **884**
  so với giữ Pāli `Aṅguttara Nikāya N` **342** ⇒ theo đa số cả bộ như đã chỉ định.
  NHƯNG riêng quyển 8 thì ngược lại: **43** giữ Pāli / **14** `Kinh Tăng Chi Bộ`.
  Tôi theo chỉ dẫn đa số cả bộ và ghi lại mâu thuẫn cục bộ này để người điều phối
  gộp — đây là 43 bài `an8` đã merge và sẽ lệch với bài mới.
  `:0.2` thì ngược lại, tôi theo đa số TRONG CHÍNH QUYỂN 8 theo BRIEF_VI3 §11:
  `Dānavagga` → `4. Phẩm Cho Dâng`, nhất quán 7/7 với an8.31, an8.32, an8.33,
  an8.37, an8.38, an8.39, an8.40.

  TRA TIỀN LỆ KÈM ĐẾM. `puññakiriyavatthu` → `cơ sở tạo phước` (iti27:2.1 và
  dn33:1.10.84, câu ba mục `dānamayaṁ/sīlamayaṁ/bhāvanāmayaṁ puññakiriyavatthu`
  dịch NGUYÊN VĂN y hệt dn33:1.10.84). Danh sách mười `dibbena āyunā …` dùng lại
  nguyên văn dn30:1.4.3 cho cả `:4.4` và `:9.4`. Sáu cõi trời theo đúng an3.70:29.1
  – 34.5: Tứ Đại Thiên Vương, Ba Mươi Ba, Yama, Đề Noa, Hóa Lạc, Hóa Tự Tại.
  `So kāyassa bhedā paraṁ maraṇā` → `sau khi thân hoại mạng chung` (an3.70:29.5).
  `adhigaṇhāti … dasahi ṭhānehi` → `vượt trội … về mười phương diện` (dn30:1.4.3).
  `cattāro mahārājāno` → `bốn vị Đại Thiên Vương` (dn11:68.7). `sakko devānamindo`
  → `Sakka, vua chư thiên` (sn11.15). `suyāmo/santusito/sunimmito/vasavattī
  devaputto` → `thiên tử X` (dn11, sn40.11). `Chaṭṭhaṁ` → `Thứ sáu.` (218/225 toàn
  tầng). `Katamāni tīṇi` → `Thế nào là ba?` (43/46). `:9.6` = khoá đánh số phần,
  không vào kiểm `ngoặc()`.

  0 tiền lệ, đặt mới: `manussadobhagyaṁ` → `hàng người khổ cực` và
  `manussasobhagyaṁ` → `hàng người phú quý` (Sujato: disadvantaged / well-off
  humans; đối xứng nên tôi dùng cặp `khổ cực` / `phú quý` cho cân, thay vì
  `nghèo`/`giàu` vì Sujato nói về điều kiện hơn mức tài sản). `nābhisambhoti` →
  `chưa đạt tới` (0 tiền lệ; `abhisameti` có 8 tiền lệ nhưng nghĩa là `giác ngộ`).
  `parittaṁ` → `mức ít`, `mattaso` → `mức vừa phải`, `adhimattaṁ` → `mức vượt trội`
  (ba mức độ Pāli nêu, giữ đủ và phân biệt rõ; `adhimattaṁ` có 14 tiền lệ nhưng ở
  đóy là `hăng say tâm` theo nghĩa `uṭṭhāna`, nên không dùng lại).

  DẤU LƯỢC: bốn khoá `:5.4 :6.4 :7.4 :8.4` có `dibbena āyunā …pe…`; theo luật
  đơn phương 10.1 tôi giữ **đúng một** `…` (`bằng tuổi thọ trời …`), KHÔNG mở rộng
  và không viết `…pe…` như an1.314:1.7 đang làm. Nhịp `…` của Pāli ở bốn khoá
  này là 1, bản Việt cũng 1, khớp từng khoá.

  BẤT ĐỊNH ĐÃ PHÂN XỬ, KHÔNG GIẤU. `atirekaṁ karitvā … adhigaṇhanti` (`:4.3`):
  Pāli nói bốn Đại Thiên Vương tự thực hành hơn `cātumahārājike deve` (chư thiên
  Tứ Đại Thiên Vương) — tức vượt trội **trong hạng** của chính mình; Sujato đọc là
  `the other gods`. Tôi dịch `nhiều hơn các vị thần khác` cho vế thực hành (theo
  Sujato) và `vượt trội chư thiên Tứ Đại Thiên Vương` cho vế thứ hai (theo Pāli),
  vì hai vế ấy nói hai đối tượng khác nhau.
  `technical_integrity` đặt 9.6: bốn cổng kỹ thuật đều xanh nhưng không ai rà
  lại bằng con người.
