notes: |-
  Giải quyết draft 2026-10-12: Blocker cũ ("cắt ngắm" ở `an5.180:5.3`, `an5.180:6.3`) đã LỖI THỜI. Hai khoá đó trong bản dịch hiện hành là câu đầy đủ ("Bấy giờ, này Ānanda, năm trăm nam cư sĩ ấy nghĩ:"), Pāli của chính hai khoá cũng không có `…` và bản Việt không còn dấu `…` nào (0/96 khoá; Pāli `…` 0/96). Nội dung Pāli không bị thay bằng dấu lược. Đã gỡ blocker; không còn blocker nào ghi trong meta.
  Đọc đối kháng toàn bài từ Pāli (96/96 khoá in cặp Pāli-Việt ra đọc). Tập khoá Việt = tập khoá Pāli (96 = 96), thứ tự khớp; nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá (0 lệch); 27 cặp khoá Pāli trùng nguyên văn trong chính bài, 0 cặp mà Việt khác; số lượng: năm trăm (pañcamattāni = khoảng năm trăm ở 3.4; pañcannaṁ ... satānaṁ = năm trăm ở các khoá còn lại).
  Sửa lỗi nghĩa/thuật ngữ (43/96 khoá đổi; phần lớn là cụm công thức lặp): (1) `kulaputtā` ở `7.4`, `9.4` đã dịch sai thành "nam cư sĩ" (upāsaka) — sửa "thiện nam tử" (tiền lệ an6.60, an7.56); `yassatthāya` = "mục đích mà vì nó", không phải "lý do"; thêm `upasampajja` = "chứng đạt" bị bỏ sót; `vūpakaṭṭho` "thoát ly"/"độc cư" → "viễn ly" (39 khoá đa số trong tầng). (2) `ayyo gavesī` bị dịch "Bậc Đảnh Gavesī" (vô nghĩa) — sửa "Ngài Gavesī" (11 khoá: 4.4, 4.5, 4.8, 5.4, 5.5, 5.8, 6.4, 6.5, 6.8, 8.2, 8.3). (3) `bahūpakāro` = "giúp ích nhiều" (tiền lệ mn142, dn21), trước đó mất chữ "bahu" ("hữu ích"). (4) `Kimaṅgaṁ pana mayaṁ` = "huống chi là chúng ta" (tiền lệ dn14:2.16.5, dn14:3.14.6), trước đó dịch tự do "Sao chúng ta lại không làm theo?"; `Ayyo hi nāma … bhavissati/pabbajissati` đã dịch "sắp" (thêm nghĩa) và riêng `8.3` đổi sang quá khứ "đã" — nay thống nhất theo cấu trúc "ngay cả … còn …, huống chi chúng ta" (dn14). (5) `ārācārī virato methunā gāmadhammā` ghép sai (ārācārī bị dịch "xa lánh dâm dục", gāmadhammā bị dịch "hành vi hạ liệt của dân gian", mất methunā ở vị trí đúng) — sửa theo công thức tầng "sống phạm hạnh, sống xa lánh, tránh xa dâm dục, pháp thô tục của người đời" (an6.44, an10.75; 7 khoá). (6) `handāhaṁ` "Bấy giờ ta hãy" → "Vậy ta hãy" (22 khoá tầng dùng "Vậy" so với 5 khoá "Bấy giờ"); `dhāretha/dhāretu` "ghi nhớ" → "ghi nhận" (tiền lệ an3.53–59, an10.119, an10.176…); `āyasmanto` "các bậc khả kính" → "các tôn giả" (57 khoá so với 3 khoá "khả kính"); `ko hetu ko paccayo bhagavato sitassa pātukammāya` → "Nhân gì, duyên gì để Đức Phật mỉm cười?" (mn81:2.3, mn83:2.3). (7) `Aññataro … arahataṁ ahosi` = "một trong các bậc A-la-hán" (tiền lệ an6.55:8.4), bỏ "một bậc A-la-hán" làm mất "aññataro … arahataṁ" (genitive plural). (8) `nāparaṁ itthattāyā` "không còn tái sanh nữa" (tầng 7 khoá) → "không còn trở lại trạng thái này nữa" (hơn 110 khoá trong tầng, đủ các biến thể "trạng thái (hiện hữu) này"); `abbhaññāsi` "tự biết" → "biết rõ"; thống nhất "Sanh" (7.5 và 9.6 trước kia "Sanh"/"Sinh" lẫn lộn). (9) `iddhañceva phītañca bahujanaṁ ākiṇṇamanussaṁ` → "thịnh vượng, sung túc, đông dân, đầy người" (tiền lệ mn82:41.11, sn12.65:7.9, sn55.21:1.4); trước đó trùng nghĩa "thịnh vượng, phồn thịnh" và "nhiều người sinh sống". (10) `10.6` "Upāsakavaggo tatiyo": Pāli ghi "thứ ba" (thứ tự trong năm phẩm, 3), bản cũ ghi "Hết phẩm thứ mười tám" (số phẩm SuttaCentral, không có trong Pāli) — nay "Phẩm Nam Cư Sĩ, thứ ba." theo Pāli và đa số tầng (an10.x, an4.x, an6.x, an5.200 trở đi). `6.15`, `6.16` đổi "dùng một bữa" thành "người ăn một bữa" (không còn đọc nhầm thành hành động "đã ăn một bữa"); `3.4` bỏ "cũng" thêm ngoài Pāli, thêm "khoảng"; `6.4` bỏ "của chúng tôi" vì Pāli `6.4` không có `amhākaṁ`.
  Phân loại blocker: không còn blocker kiểu (A) (có bản Anh Sujato cho bài này); không có kiểu (B) đã ghi, nhưng độ phủ English Sujato tính trên Pāli có nội dung = 58/73 = 0,795 (< 0,80): Sujato để trống 15 khoá có nội dung: `5.4`, `5.5`, `5.7`, `5.8`, `5.12`, `5.13`, `6.4`, `6.5`, `6.7`, `6.8`, `6.12`, `6.13`, `6.14`, `6.15`, `9.5`. Cả 15 khoá đều là lặp công thức của các khoá liền trước (4.4–4.8, 4.10 … và 9.4) hoặc là mẩu câu thuộc cùng một cấu trúc `…pe…` do Sujato lược; đã đọc kỹ từ Pāli và đối chiếu với khoá song song trong chính bài, bản dịch tự đứng vững; `triangulation` ≤ 8,0 (không cao hơn). Mất mát cần ghi nhận trong `content/meta/reference-gaps.yaml` (tệp công cụ sinh). Tầng Việt hiện hành: chỉ có Pháp Cú tại commit đã ghim, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ — giới hạn tham chiếu, không phải lỗi văn bản.
  Bất định còn lại: (i) `paṭidesitāni` ở `3.4` (paṭideseti = chỉ ra, tuyên bố, nhận là) — giữ "dạy bảo và khuyến tấn" theo cách hiểu của Sujato ("taught and advised") và nghĩa `samādapitāni`; chưa phân xử được nghĩa chính xác "paṭi-" ở đây. (ii) Bản tóm lược `11.2` "người xác làm là thứ năm" (`caṇḍālapañcamaṁ`) và tên kinh an5.175 "Kinh Người Xác Làm": giữ nguyên để khớp tên các kinh anh em đã published; nghĩa của `caṇḍāla` trong tầng này chưa được xác minh bằng căn cứ trong lát này, ngoài phạm vi của bài. (iii) `an5.56:4.2` (ngoài phạm vi, chỉ báo) cũng dịch `kulaputtā` thành "các nam cư sĩ" — cùng lỗi với `an5.180:7.4/9.4` cũ.
  Kiểm kỹ thuật: bị cấm chạy cổng nên không tuyên bố technical gate pass; `technical_integrity: 9.6`; còn phải chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`. `translationTitle` "Kinh Về Gavesī" khớp `an5.180:0.3`.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `2.3`, `2.6` — «vô cớ» → «khi không có lý do» (cách dùng ở mn81, mn83, `akāraṇena`); giữ nguyên khoá `8.6` vì «chúng con» khớp `labheyyāma mayaṁ` (số nhiều), còn bản đa số «cúi mong chúng đệ tử …» là lối của dn14, không dùng làm gốc.
