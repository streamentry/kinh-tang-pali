notes:
  - >-
    **Bài là một xích dài hai mươi mốc**: mười bộ ba, mỗi bộ là điều kiện để
    đoạn bộ kế tiếp; rồi dựng ngược lại theo chiều âm (mục 11) và theo chiều
    dương (mục 21). Người đọc phải giữ được cả chuỗi, nên tôi giữ **đúng một
    khuôn cho mọi mục** và dựng bằng vòng lặp trên đúng bộ ba đó.
  - >-
    **`Ākaṅkhavagga` → *Phẩm Nguyện Cầu*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *If You Want*, và cả phẩm đúng một việc — *vị tỳ-kheo mong
    nguyện điều này, thì hãy làm điều kia* (`ākaṅkha` = mong nguyện).
    `Ākaṅkhasutta` → *Kinh Nguyện Cầu*.
    **`Ākaṅkhavaggo tatiyo` ở `an10.80:1.14` dịch là *Phẩm Nguyện Cầu, thứ ba***
    — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì phẩm này rõ
    ràng thứ tám (đúng như `8.` ở `0.2`). Tôi dịch theo Pāli vì Pāli là
    authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Lỗi nghiêm trọng nhất chương, lượt review bắt được ở chín segment của mục
    11.** Mục 11 là **chiều âm** của mục 21: Pāli dùng `abhabbo` (không thể đoạn
    bỏ) chứ không phải `bhabbo`, và các tính từ nối vế đều là phẩm chất **xấu**
    — `pamatto`, `pāpamitto`, `kusīto`, `dussīlo`, `upārambhacitto`,
    `vikkhittacitto`, `līnacitto`, `vicikiccho` — trong khi mục 21 dùng
    `appamatto`, `kalyāṇamitto`, `sīlavā`, `anupārambhacitto`. Bản đầu tôi dịch
    cả chín vế là *“có thể đoạn bỏ”* với điều kiện tốt, tức **đảo cả cực tính
    lẫn cả điều kiện**. Đã sửa.
    **Lỗi cơ học do lượt review bắt được ở mười tám segment:** tôi bọc nháy đơn
    cho các danh sách ở vế `.3`, trong khi Pāli ở đó là danh sách trần kết bằng
    `—`, không nháy nào. Bộ kiểm tra bắt được ngay (độ sâu nháy đơn dư 18).
  - >-
    **Lỗi Pāli phải ghi lại chứ không sửa: `11.1` tự mâu thuẫn.** Pāli là
    `Ahirikoyaṁ, anottāpī **pamatto** hoti` — *ai có hổ thẹn và kính sợ thì
    **lười biếng***, trong khi `21.1` là `Hirīmāyaṁ, ottāpī **appamatto** hoti`
    — *… thì **siêng nhiệm***, cùng một chủ thể. Chuỗi âm ở `11.2` trở đi đòi
    hỏi vị ấy **lười biếng**, nên chữ thể đầu mục 11 phải là người **thiếu** hổ
    thẹn thì mới khớp. Tôi dịch đúng Pāli (*… thì lười biếng*) và ghi lại ở đây;
    không tự sửa vì Pāli là authority.
  - >-
    **Mười bộ ba, mười bộ ba là 0 tiền lệ trong đúng nghĩa này, đặt mới và ghi
    lý do tại đây**: `kummaggasevena` → *ru theo đường sai*; `cetaso līnatta` →
    *tâm nhạt nhòa*; `muṭṭhassacca` → *quên mất*; `asampajañña` → *không biết
    tỉnh*; `ariyānaṁ adassanakamyata` → *mong muốn không gặp bậc Thánh*;
    `ariyadhammassa asotukamyata` → *mong muốn không nghe pháp của bậc Thánh*;
    `upārambhacittata` → *tâm đổ lỗi*; `asaṁvara` → *thiếu giữ chế*; `dussilya`
    → *mất giới*; `assaddhiya` → *vô tín*; `avadaññuta` → *vô ơn*; `anādariya` →
    *không tôn trọng*; `dovacassata` → *khó khuyên can*; `ayonisomanasikāra` →
    *suy nghĩ không đúng lý* (tiền lệ gần nhất `an10.47:1.7` dịch cụm `ayoniso
    manasikāro` là *tác ý không như lý*, khác cấu trúc).
    Có tiền lệ: `cetaso vikkhepa` → *tâm tán loạn* (`an5.151:1.3`);
    `sakkāyadiṭṭhi` → *thân kiến*, `vicikiccha` → *hoài nghi*,
    `sīlabbataparāmāsa` → *chấp thủ giới nghi lễ* (cả ba theo `an3.94:2.2`);
    `kosajja` → *lười nhác* (`an5.6:4.2`); `ahirika`/`anottappa` → *thiếu hổ
    thẹn* / *thiếu kính sợ* (`an10.105:1.1`); `pāpamittata` → *kết bạn xấu*
    (`an3.27:1.11`); `dhammavinaya` → *Giáo Pháp và Giới Luật* (`an3.40:3.9`);
    `kosajja`/`kusīto` → *lười nhác*.
    **`āraddhavīriyo` ở `21.4` là tính từ đứng riêng**, nên tôi dùng *tinh tấn
    kiên trì* (11 segment ở AN5) chứ không dùng *an trú với tinh tấn đã khởi* (2
    segment ở `an10.50`) — cùng lý do như chương 6, xem `docs/translation-
    notes/araddhaviriya-and-udayatthagamiya-split.md`.
    **Vế đầu của mục 2 và mục 12 dùng `jāti, jarā, maraṇa`** (danh sách có dấu
    phẩy) trong khi chín bộ ba còn lại là ba danh từ; tôi dựng riêng cho hai mục
    đó, không ép cùng một khuôn.
