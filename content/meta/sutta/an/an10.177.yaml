notes: |-
  **Cổng kỹ thuật của kho CHƯA chạy.** Lượt dịch này bị cấm chạy `npm run validate`, `npm test`, `npm run check` và `npm run build`; bốn lệnh đó để người điều phối chạy, nên `technical_integrity` đặt 9.6 chứ không phải 10.0 và **không** tuyên bố technical gate pass.

  **Phạm vi và kiểm cơ học.** Bài đủ 73 khoá, đúng thứ tự khoá Pāli, không khoá nào ngoài tập Pāli. Tự kiểm trên mọi khoá (kể cả khoá ngắn hơn 40 ký tự; 64/73 khoá Pāli đạt ngưỡng 40): tập khoá khớp 73/73; nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá (0 lệch trên 73); mỗi khoá Pāli có `…pe…` (12 khoá) có đúng một `…` ở bản Việt, Pāli không có `…` trần, không có `(…)`; NFC; không khoá rỗng; không Pāli lọt sang bản Việt ngoài tên riêng Jāṇussoṇi. Đã in và đọc đối chiếu cặp Pāli↔Việt từng khoá.

  **Pāli trùng nguyên văn.** Trong chính bài: 9 nhóm Pāli trùng nguyên văn (ví dụ 3.5=4.4=5.4, 6.1=14.1=16.1, 9.3=17.3, 11.2=13.2), 0 nhóm mà bản Việt khác. Với bài khác: 5 khoá có Pāli trùng nguyên văn ở bài khác đã có bản Việt (1.1, 1.2, 18.1, 19.1, 19.2), 53 cặp, trong đó 42 cặp bản Việt khác; đó là các công thức mở và đóng có nhiều cách diễn đạt không thống nhất trong tầng, nên không có một bản duy nhất để chép lại. Riêng 1.1 và 1.2 trùng nguyên văn với `an2.17:1.1` và `an2.17:1.2` (cũng là bà-la-môn Jāṇussoṇi) nên dùng đúng bản Việt đó.

  **Số Pāli.** Chỉ có `pañcannaṁ kāmaguṇānaṁ` = năm (ở 14.4, 15.2, 16.4, 17.2); không có số đếm nào khác trong bài.

  **Thuật ngữ và tiền lệ đã đo.** `kāyassa bhedā paraṁ maraṇā` → *thân hoại mạng chung* (362 khoá trong tầng; dạng *sau khi thân hoại mạng chung* 247). `sahabyataṁ upapajjati` → *tái sinh cộng trú với* (*cộng trú* 130 khoá, *đồng cư* 24). `pañca kāmaguṇā` → *năm dục trưởng dưỡng* (50 khoá, so với *dục lạc* 19 và *năm dục công đức* 14; cụm *năm dục trưởng dưỡng của loài người* có tiền lệ ở `sn55.54` và `mn75`). `ñātisālohitā` → *bà con huyết thống* (13 khoá; *bà con* 25, *thân quyến* 15; giữ một dạng xuyên suốt bài). `dāyako` → *người bố thí* (27 khoá, *thí chủ* 18). `tiracchānayoni` → *cõi súc sinh* (*súc sinh* 49, *súc sanh* 26). `paṭivirato` → *từ bỏ* (67 khoá, *kiêng tránh* 13, *tránh* 20); danh sách mười nghiệp theo đúng khuôn `an4.204` và `an4.203` (*kẻ nói lời ác* 7 khoá, so với *ác khẩu* 9 khoá). *sa-môn* và *bà-la-môn* viết thường nhất quán với `an2.17` và `an3.59`. `saraṇaṁ gatan` ở 19.2 theo dạng *nam cư sĩ đã quy y từ hôm nay cho đến trọn đời* (`an3.59:11.2`, `mn96:17.3`).

  **Tiêu đề.** `0.2` *17. Phẩm Vua Jāṇussoṇi* giữ nguyên theo tầng (8/8 khoá đã có), dù Pāli chỉ có `Jāṇussoṇivagga` và Sujato dịch *With Jānussoṇi*, không có chữ *vua*; đó là vấn đề của tên phẩm ở tầng, ghi lại để người biên tập quyết, **không** sửa ở đây. `0.3` *Kinh Jāṇussoṇi* (không thêm *Vua*; `an3.59` cũng viết *Kinh Jānussoṇi*, còn `sn12.47` viết *Kinh Vua Jāṇussoṇi*). `0.1` dùng dạng *Kinh Tăng Chi Bộ 10.177* (167 khoá `an10` so với 24 khoá dạng *Aṅguttara Nikāya*, dù các bài `an10.171`, `an10.173`, `an10.174`, `an10.175` cùng phẩm đang dùng dạng sau).

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh.**
  · **`6.4`: Pāli đã ghim lệch về nghĩa so với văn cảnh.** Câu `Idampi, brāhmaṇa, aṭṭhānaṁ yattha ṭhitassa taṁ dānaṁ upakappati` hiểu nghĩa đen là *đây cũng là chỗ không đúng, mà ở đó món bố thí ấy có ích*, tự mâu thuẫn: đây là cõi chư thiên, và các câu đối xứng `3.5`, `4.4`, `5.4` đều có `kho` và `na upakappati`; chỉ `7.4` mới là chỗ đúng. Bản Việt `6.4` được dịch như ba câu kia (*không có ích*), theo Sujato (*the gift does not aid*) và theo bản Thích Minh Châu nguyên bài ở mục Tra cứu toàn văn (*không được lợi ích*). Như vậy `6.4` **không** dịch sát từng chữ Pāli đã ghim, mà theo mạch văn và hai bản tham khảo; có thể root đã mất `na` do sao chép. Người biên tập cần biết điều này.
  · **`parikappa` ở 10.1–10.2.** Dịch *sự sắp đặt*. Sujato dịch cả cụm `parikappaṁ vadāmi` là *propose this* (không dịch riêng `parikappa`); Thích Minh Châu dịch *giả thuyết*; `an3.67` trong tầng dịch `parikappe` là *điều mình sẽ trình bày*, một nghĩa khác. Hướng hiểu phổ biến (một sự sắp đặt phần quả cho người bố thí ngay cả khi không tới được người chết) khớp phần Đức Phật trả lời ở 10.3–17.2, nhưng nghĩa chính xác của danh từ này chưa phân xử được. Tiếng Việt *sự sắp đặt* chấp nhận được nhưng mờ; đây là điểm yếu nhất về thuật ngữ của bài.
  · **`ṭhāna` / `aṭṭhāna`.** Dịch *chỗ đúng* / *chỗ không đúng* (cùng dạng ở 2.6, 3.1, 7.4, 10.1–10.2), vì Pāli dùng `ṭhāna` vừa là chỗ sinh (`yattha ṭhitassa`, `taṁ ṭhānaṁ upapanno`) vừa là chỗ hợp để bố thí có ích; Sujato dùng *conditions*, Thích Minh Châu dùng *tương ưng xứ* (không dùng ở đây vì mờ hơn). Ở `9.2` `aṭṭhānaṁ kho etaṁ … anavakāso` là công thức *không thể có*, dịch theo tiền lệ `an4.187` và `an5.166`, không phải *chỗ không đúng*.
  · **`saddhāni` ở 2.2 và 18.2** dịch *các lễ cúng* và ở 2.2 thêm *cho người đã chết*: nghĩa này suy từ ngữ cảnh (nội dung nguyện ở `2.3`) và từ `an3.59:1.2` (*vật cúng dường tổ tiên*), không có từ tương ứng trong câu Pāli.
  · **`dāyakopi anipphalo` (9.3, 17.3, 18.2, 18.3).** Giữ `pi` là *cũng*, không thành *ngay cả*: *người bố thí cũng không phải không có quả*, đúng với Sujato (*never fruitless for the donor*).
  · **`idha` ở 11.1, 13.1, 15.1, 17.1** dịch *ở đời này*, theo Sujato (*in this life*).

  **English tham khảo.** Sujato có bản đầy đủ cho bài này. Mẫu số coverage = 64 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); Sujato phủ 64/64 = 1.00, nên cổng coverage không chặn. Lớp `english-project` không có tệp cho bài này, nên 100% là từ Sujato độc lập. Hai khoá cuối (`19.3`, `19.4`) rỗng ở Sujato vì chỉ là chữ kết. Sujato rút gọn `18.1` (bỏ `abbhutaṁ`) và đọc `6.4` khác root như đã ghi ở trên. Bản Thích Minh Châu nguyên bài có ở mục Tra cứu toàn văn nhưng không căn theo khoá; dùng để đối chiếu thuật ngữ và mạch văn, không tính vào coverage.
