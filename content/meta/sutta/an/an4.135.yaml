  Sửa lan 2026-10-13: tiêu đề :0.3 'Kinh Người Đáng Bị Trách Trách' → 'Kinh Người Có Tội'; các khoá 1.3, 2.1, 2.2, 2.3, 3.2–3.5, 4.2–4.5, 5.1–5.3: sāvajja / vajjabahula / appavajja / anavajja, 'đáng bị trách trách' → 'có tội', 'phần nhiều có tội', 'ít có tội', 'không có tội'. Căn cứ: 'trách trách' là chữ lặp lỗi; tiền lệ đo trên tầng: sāvajja → 'có tội' 56 khoá so với 'đáng bị trách trách' 16 khoá; mẫu đã sửa ở an4.193.
