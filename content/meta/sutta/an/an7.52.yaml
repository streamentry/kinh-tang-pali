notes: |-
  Dịch trực tiếp từ Pāli root commit 11c9d708 đã ghim, đối chiếu tầng English Sujato và lớp lấp english-project đã có trong kho.
  - Phép kiểm 5/5:
    1) Đúng chính xác 58/58 khoá, thứ tự và ID giữ nguyên 100% theo an7.52.json.
    2) Dấu ngoặc nháy kép và đơn khớp 1:1 với Pāli root từng khoá. Cực kỳ cẩn thận dấu nháy đơn lồng trong lời thoại (các đoạn tư duy của người bố thí: ‘imaṁ pecca paribhuñjissāmī’, ‘sāhu dānan’, ‘dinnapubbaṁ katapubbaṁ…’, ‘ahaṁ pacāmi, ime na pacanti…’, ‘yathā tesaṁ pubbakānaṁ isīnaṁ…’, ‘imaṁ me dānaṁ dadato cittaṁ pasīdati…’).
    3) Dấu lược: Đúng 5 khoá mang dấu lược trong Pāli (6.2, 7.2, 8.2, 9.3, 10.3) được chuyển thành đúng một '…' trần; 53 khoá còn lại tuyệt đối không thêm dấu lược.
    4) Thuật ngữ 7 động cơ bố thí và các cõi trời: Sāpekho dānaṁ deti (bố thí với tâm mong cầu); patibaddhacitto dānaṁ deti (bố thí với tâm trói buộc); sannidhipekho (bố thí với tâm mong cầu tích trữ); ‘imaṁ pecca paribhuñjissāmī’ti (với ý nghĩ: ‘Ta sẽ hưởng dùng vật này ở đời sau’); cittālaṅkāracittaparikkhāraṁ (để trang nghiêm tâm, phụ trợ cho tâm); anāgāmī hoti anāgantā itthattaṁ (là bậc Bất Lai, không trở lui đời này). Bảy cõi trời đối ứng: Tứ Thiên Vương (Cātumahārājika ở 5.2) và Phạm Chúng (Brahmakāyika ở 12.12); các cõi trời trung gian (Ba Mươi Ba, Dạ-ma, Đâu-suất, Hoá Lạc, Tha Hoá Tự Tại) nằm trong đoạn lược Pāli.
    5) Nhất quán nội bộ: 7 mức độ bố thí và các cấu trúc lặp đối ứng (4.2 ≡ 11.3, 4.3 ≡ 11.4, 4.4 ≡ 11.5, 11.2 ≡ 12.11) dịch hoàn toàn đồng nhất. Danh sách 10 vị tiên cổ (Aṭṭhaka, Vāmaka, Vāmadeva, Vessāmitta, Yamadaggi, Aṅgīrasa, Bhāradvāja, Vāseṭṭha, Kassapa, Bhagu) đối chiếu chuẩn xác với mn95 và dn13.
  - Trạng thái và blocker: Coverage tầng Anh Sujato đạt 75.0% (< 80% do Sujato để trống các đoạn lược lặp lại; bản Việt dịch đầy đủ từ Pāli). Dù kho đã có lớp lấp english-project (17 khoá), theo quy tắc AGENTS.md lớp lấp cùng agent không được tính là cách đọc độc lập, nên bài giữ status: draft với blocker 'lowEnglishCoverage'; điểm triangulation đặt 8.4; final_score đạt 9.30.
  - Chuẩn hoá văn bản: File JSON và YAML đều chuẩn hoá Unicode NFC 100%.
  - Giải quyết draft 2026-10-12: Đọc đối kháng 58 khoá từ Pāli, đối chiếu bản Anh Sujato đã ghim (an7.52) làm tầng tham khảo. Sửa 7 khoá (6 lỗi thật + 1 chọn từ): (a) 0.2 '5. Phẩm Đại Tri Kiến' sai — Mahāyaññavagga = 'Phẩm Đại Tế Đàn' (mahā + yañña); Sujato cũng dịch 'A Great Sacrifice'; (b) 5.1 và 12.1 'tatra' (trong trường hợp ấy) bị dịch trùng 'idha' (ở đây) nên mất đối chiếu với 4.1 'idha'; nay 'Trong trường hợp ấy, này Sāriputta' (5 tiền lệ 'Trong trường hợp ấy, này' trong tầng AN); (c) 9.3, 10.2, 12.9 'dānasaṁvibhāgo' là 'sự chia sẻ vật thí' (tiền lệ an6.26), không phải 'phân phát bố thí'; (d) 12.13 'anāgantā itthattaṁ' đối xứng với 5.3 'āgantā itthattaṁ' (quay về đời này) nên nay 'không quay về đời này'. Các điểm kiểm lại và giữ: 'pitupitāmahehi' = cha và ông nội (không phải cha mẹ); 'Brahmakāyika' = chư thiên Phạm Chúng (15 tiền lệ trong tầng); 'Sāriputta' giữ dạng Pāli theo đa số tầng AN (70 tệp so với 2 tệp 'Xá-lợi-phất'; mục glossary mức warn); 'tādisaṁyeva' = cùng một món thí như vậy (Sujato: exactly the same gift); không có số lượng Pāli nào để tính (thang 7 động cơ nằm trong đoạn lược). Blocker 'lowEnglishCoverage' đã gỡ (loại tự đặt, không phải lỗi văn bản): Sujato để trống 21/58 khoá — 3.4, 3.6, 7.1, 8.1, 9.1, 10.1, 10.2, 12.2–12.10, 13.3 (cộng 6.2/9.3/10.3 chỉ phủ một phần) — toàn là câu lặp và dấu lược; đã đọc từng khoá từ Pāli, mỗi khoá lặp đúng cấu trúc đã dịch ở khoá liền kề (ví dụ 12.2–12.10 lặp 4.1, 7.2, 8.2, 9.2–9.3, 10.3; 3.4 ≡ 3.2) và đứng vững không cần bản Anh; tầng 'vietnamese-current' không có cho bài này (chỉ có Pháp Cú) là giới hạn tham chiếu, không phải lỗi văn bản. 'triangulation' đặt 8.0 (không cao hơn) vì các khoá Sujato trống chỉ dựa vào Pāli và lớp english-project cùng tác giả không phải cách đọc độc lập. Điểm trước→sau: triangulation 8.4→8.0; các điểm còn lại giữ nguyên; final_score 9.30→9.26 (trung bình thô). Còn lại cho các bài anh em an7.44–an7.53: tiêu đề vagga '5. Phẩm Đại Tri Kiến' ở 0.2 vẫn sai ở các bài đó. technical_integrity 9.6 giữ nguyên; các lệnh còn phải chạy ở cấp kho: npm run validate, npm test, npm run check, npm run build.
