notes: |-
  Dịch mới trọn bài 66/66 khóa, không khóa nào ngoài tập khóa Pāli. Pāli có nội dung (từ 40 ký tự, bỏ khối :0): 38 khóa. Coverage English: Sujato phủ 36/38 (0,947); hai khóa Sujato để trống là an7.15:3.9 và an7.15:4.10, do lớp english-project lấp (2/2, đã published) nên tính cả hai tầng là 38/38. Lớp lấp cùng một tay với bản Việt này nên hai khóa đó không phải cách đọc English độc lập; triangulation hạ xuống 8,7 vì lý do đó. Tầng Việt hiện hành (Hòa thượng Thích Minh Châu) không có dạng phân đoạn cho Tăng Chi Bộ; đã đọc bản nguyên bài ở mục tra cứu toàn văn để đối chiếu thuật ngữ, không dùng làm nguồn cột. Coverage cách xa ngưỡng 0,8, không sát ngưỡng.
  Dùng lại nguyên văn đã published: 8.6 giữ đúng an3.86:5.6 (Pāli trùng ở 5 khóa; 4 khóa an3.86:5.6, an3.87:4.6, an3.88:2.6, an7.95:1.4 cùng bản Việt, còn mn120:37.7 khác); 6.6 theo an3.86:3.6 (Pāli trùng ở 3 khóa; hai khóa an3.86:3.6 và an3.87:2.10 cùng bản Việt, an9.12:7.2 dùng khung khác); 1.2 Thế nào là bảy? (58 khóa Pāli trùng: 28 so với 12 cho Là bảy nào?); 9.2 Thứ năm. (270 khóa Pāli trùng, 263 viết đúng vậy); 0.2 Phẩm Thiên Hướng (9/9 khóa cùng bộ). Ngoài bài, 7 khóa Pāli có trùng, trong đó 5.6 và 7.6 chỉ có một tiền lệ và bản này viết khác (5.6: bậc nhập lưu thay cho bậc Sotāpanna, theo 52 khóa; 7.6: xem bất định 1). Trong chính bài: Pāli 3.2/4.2/5.2/6.2/7.2/8.2 trùng nhau, 3.3–3.5 lặp ở cả sáu mục, và 3.7/3.8 trùng 4.8/4.9; các khóa trùng đều có cùng bản Việt. 3.6 và 4.7 khác nhau ở Pāli nên Việt khác đúng chỗ đó.
  Thuật ngữ (đo trên tầng): saddhā + hirī + ottappa trong cùng khóa dịch niềm tin 29 / tín 12 · hổ thẹn 36 / tàm 12 · kính sợ 30 / quý 12 — chọn niềm tin, hổ thẹn, kính sợ theo an5.1 và an5.3. kusalesu dhammesu → các pháp thiện (123 so với các thiện pháp 8). sādhu → lành thay (22) so với tốt thay (2). sotāpanna → bậc nhập lưu (52 so với Nhập Lưu 15) cùng không rơi vào ác đạo (16) và chắc chắn, hướng về giác ngộ (15). sakadāgāmī → bậc Nhất lai (37) giữ viết hoa theo tầng dù nhập lưu viết thường. opapātiko → bậc hóa sinh (23). thale tiṭṭhati brāhmaṇo → bà-la-môn đứng trên bờ khô theo an4.5 (đã qua sông ở an4.5, bản này dùng đã vượt qua để không thêm sông). ekantakāḷaka → hoàn toàn đen tối (3 khóa Pāli, chưa có tiền lệ Việt: an6.62:9.4 và 9.11 chưa dịch).
  Bất định 1 — 7.6 tasmā lokā: sáu khóa (an3.86:4.6, an3.97:4.2, an3.141:4.2, an3.141:5.2, an3.141:6.2, an4.5:3.2) viết không trở lại thế gian này, còn 18 khóa khác viết không còn trở lại từ thế giới ấy; Pāli tasmā lokā là từ thế giới ấy, nên bản này theo 18 khóa và khác 6 khóa. Lỗi nằm ngoài lát này nên chỉ báo cáo, không sửa.
  Bất định 2 — 3.2 ummujjati sādhu saddhā: Pāli không có động từ nghĩ; chỉ có lời trích đóng bằng iti ở 3.5. Đọc nghĩa đen ummujjati sādhu saddhā có thể hiểu nổi lên nhờ niềm tin tốt, nhưng nghĩa đó mâu thuẫn với ba mục sau (3.6, 4.6, 5–8): cùng một cụm mở đầu mà kết quả là chìm, đứng yên, nhập lưu, nhất lai, hóa sinh, A-la-hán, nên chỉ có thể là lời trích của vị ấy. Sujato, Hòa thượng Thích Minh Châu và an3.27:2.13 (Pāli iti-quote không có nháy, Việt thêm nháy đơn) cùng hướng. Dịch nổi lên với ý nghĩ rằng và đặt nháy đơn ‘…’ mở ở 3.2, đóng ở 3.5; Pāli trong các khóa này không có nháy đơn.
  Bất định 3 — 1.6/5.1 vipassati viloketi dịch thấy rõ và nhìn quanh (Sujato: sees and discerns; Hòa thượng Thích Minh Châu: nhìn và thấy). 1.7/6.1 patarati dịch bơi tới (Sujato: crosses over, trùng với tiṇṇo ở mục cuối); không có chứng cứ độc lập để phân xử, giữ nghĩa đen động từ. 1.8/7.1 patigādhappatto dịch tới được chỗ có chân đứng (Sujato: finds a foothold; patigādha cũng xuất hiện ở an6.16:7.2 trong cụm ogādhappattā patigādhappattā, chưa dịch). 1.5/4.1 ṭhito dịch đứng yên, đồng nhất với 3.6/3.9 tiṭṭhati và 4.6/4.10 ṭhitā hoti.
  Bất định 4 — 1.1 udakūpamā puggalā dịch được ví với nước (Sujato: like those in water; Hòa thượng Thích Minh Châu: được ví dụ với nước). Tiền lệ an4.101 và an4.103 dùng cá nhân ví như mây/bình; ở đây theo tiền lệ an7 dùng hạng người, vì an5.141, mn70:14.1 và an7.14 đều dùng hạng người.
  Số Pāli: Sattime = bảy, satta = bảy (1.1, 9.1); tiṇṇaṁ saṁyojanānaṁ = ba kết trói; pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ = năm kết trói hạ phần; sakideva = một lần nữa; Pañcamaṁ = thứ năm. Bảy mục ở 1.3–1.9 đếm đủ bảy; mỗi mục có đoạn giải thích riêng 2–8, đều đủ.
