notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** `3.6` và `7.6` bị cụt thành stub *do thất nghiệp về tâm, …* /
  *do thành tựu về tâm, …* — 24 và 22 ký tự cho 111 và 98 ký tự Pāli — và có dấu `…`
  bịa để che chỗ thiếu, trong khi Pāli hai khoá đó viết đủ (`cittavipattihetu vā…` /
  `cittasampadāhetu vā…`) và không có `…pe…`. Đã viết lại hai khoá theo đúng vế đích
  của `3.5`/`3.7` và `7.5`/`7.7`.

  **Lượt cải thiện 2026-10-13.** Đọc đối kháng cả 38 khoá, đo tiền lệ bằng số đếm trên toàn tầng, rồi sửa 16 khoá (`1.5`, `1.6`, `2.2`, `2.3`, `3.2`, `3.3`, `3.4`, `3.7`, `5.2`, `5.3`, `6.2`, `6.3`, `7.2`, `7.3`, `7.4`, `7.7`); 22 khoá còn lại giữ nguyên. Tập khoá và thứ tự khoá không đổi (38/38). Phân loại:

  *Accuracy fix — bỏ sót từ.* Pāli có `bhikkhave` ở `3.7`, `7.7`, `5.3`, `6.3`, `7.4` mà bản Việt trước bỏ mất; đã đưa lại *này các tỳ-kheo* cho cân với `1.6`/`2.3`/`3.4` và `3.5`/`3.6`/`7.5`/`7.6`. `2.2`/`6.2`: `byāpannacitto` / `abyāpannacitto` đã mất yếu tố `citta` (*tham lam và sân hận*); đây là mục "thất nghiệp về tâm" nên đưa lại *tâm* theo tiền lệ `dn27:6.6`, `mn96:8.3` (*không có tâm sân hận*, *có tâm sân hận*); trong tầng, dạng có *tâm* 50 khoá, dạng chỉ *sân hận* 40 khoá (số đo trước khi sửa, đã gồm chính bài này), nên đây là chỗ hai dạng gần ngang nhau và lý do chọn là bối cảnh: mục này tên là sự hư hoại về tâm.

  *Accuracy fix — thêm ngoài Pāli.* `3.2`/`7.2`: bỏ *như:* (Pāli chỉ có dấu hai chấm, không có từ nào nghĩa là "chẳng hạn"). `3.3`/`7.3`: bỏ *cho người khác* (`pavedenti` là tuyên bố, Pāli không nêu người nhận). `1.5`, `2.2`, `3.2`: *có kẻ* → *có người* (`ekacco` trung tính; trong tầng *có người* 304 khoá, *có kẻ* chỉ 19 khoá, trong đó 9 khoá nằm ở cụm `an3.117`–`an3.119` (số đo trước khi sửa); nửa thành tựu của chính bài vốn đã là *có người*). Ba chỗ `1.6`, `2.3`, `3.4` thừa cặp nháy đơn ‘…’ quanh tên mục mà Pāli không có; đã bỏ để nháy khớp Pāli từng khoá (`5.3`, `6.3`, `7.4` vốn không có).

  *Terminology fix — theo đa số tầng, đo bằng số đếm.* Công thức tà kiến/chánh kiến `3.3`/`7.3` chỉ ở tầng này, `an3.118`, `an3.119`, `an10.211` dùng dạng riêng (*lễ hiến*, *lễ cúng*, *quả và quả báo của các nghiệp lành dữ*, *thế gian bên kia*); dạng của `mn60`, `mn76`, `mn110`, `mn114`, `sn42.13`, `an10.176` chiếm 9/15 khoá ở phía phủ định và 8/9 khoá ở phía khẳng định (không tính bài này; phần còn lại là `dn33`, `dn34`, `sn24.5`, `an8.29`, `an10.211`, `cnd23` với các dạng khác nhau) (*cúng tế*, *lễ vật hiến cúng*, *nghiệp thiện và nghiệp ác*, *đời này, đời sau*, *đi đúng đường, thực hành đúng*); hai khoá đã dùng lại nguyên văn từ `mn60:5.2` và `mn60:6.3`, Pāli cùng công thức. `adinnādāyī` / `adinnādānā paṭivirato`: *trộm cắp* → *lấy của không cho* (27 khoá so với 4 khoá `an3.117`–`an3.119`). `pharusavāco` / `pharusāya vācāya paṭivirato`: *nói ác khẩu* (2 khoá, chỉ ở bài này) → *nói lời ác* (17 khoá; trong AN 8 khoá). `paṭivirato`: *kiêng tránh* (1 khoá ngoài bài này) → *từ bỏ* (11 khoá so với *tránh* 7 khoá). `viparītadassano`: *quan niệm đảo ngược* (chỉ `an3.118`, `an3.119`) → *có cái thấy đảo ngược* / *không đảo ngược*, sát `dassana` và `an10.176:16.1`, `an10.176:36.1`. Giữ nguyên: *tà dâm* (9 khoá, ngang *tà hạnh trong dục* 10 khoá và *hành dâm* 10 khoá; đây không phải chỗ phân xử được), *nói hai lưỡi* (26 khoá), *nói phù phiếm* (21 khoá so với *vô ích* 11 khoá), *thọ sinh vào cõi ác, ác thú, cõi đọa, địa ngục* và *thọ sinh vào thiện thú, cõi trời* (dạng đa số trong AN).

  *Số lượng.* Pāli: `tisso` ba (liệt kê đủ ba ở `1.3`, `4.3`); danh sách ở `1.5` và `5.2` gồm bảy mục (`pāṇātipātī`, `adinnādāyī`, `kāmesumicchācārī`, `musāvādī`, `pisuṇavāco`, `pharusavāco`, `samphappalāpī`), bản Việt đủ bảy mục ở cả hai khoá. Không có số lớn nào khác. Sau sửa: 38/38 khoá, thứ tự khoá bằng thứ tự Pāli, nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch), 0 khoá có `…`, Pāli không có `…`; có một nhóm Pāli trùng nguyên văn trong chính bài (`1.2` và `4.2`) và bản Việt giống nhau; với phần còn lại của tầng có 28 khoá có Pāli trùng nguyên văn ở bài khác (434 cặp), 51 cặp khác bản này: 35 cặp là câu ngắn (`Katamā tisso?` có 14 cặp khác cho mỗi khoá trong hai khoá `1.2`, `4.2`; `Pañcamaṁ.` có 7 cặp khác) mà bài khác dịch ở dạng khác, 13 cặp ở `an3.118`/`an3.119` (cùng cụm, còn dạng cũ), 2 cặp ở `an8.76` và 1 cặp ở `an4.203`.

  *Điểm đổi, vì sao.* `segment_alignment` 5.5 → 9.4: điểm cũ phản ánh hai khoá cụt đã sửa hôm 2026-10-04; nay đã kiểm cả 38 khoá (không còn stub, đủ `bhikkhave`, nháy khớp). `semantic_fidelity` 7.5 → 8.2: các sửa thêm/bớt nghĩa ở trên (bỏ *như*, bỏ *cho người khác*, bỏ sắc thái *kẻ*, đưa lại *tâm*), trừ phần bất định còn lại bên dưới. `terminology` 9.3 → 8.9, `vietnamese_clarity` 9.4 → 8.5, `han_viet_balance` 9.4 → 8.7 là **hạ điểm**: lượt cũ coi *thất nghiệp* là thuật ngữ ổn; khi đọc đối kháng, đây là điểm yếu lớn nhất của bài (xem dưới). `technical_integrity` 10.0 → 9.6 vì văn bản đã đổi và các lệnh cổng chưa chạy: còn phải chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`. `source_provenance`, `grammar_logic`, `triangulation`, `ambiguity_integrity` giữ nguyên: không có cải thiện tương ứng mới.

  **Bất định / điểm yếu còn lại — không sửa trong lượt này.** (1) `vipatti` → *thất nghiệp*. Trong tiếng Việt hiện đại *thất nghiệp* nghĩa là mất việc làm; Pāli `vipatti` là sự hư hoại, sút kém, thất bại (Sujato dịch *failure*; bản Việt hiện hành ở mục Tra cứu toàn văn dùng một từ nghĩa *khiếm khuyết*, đọc để hiểu cách đọc, không chép). Tầng đã dùng *thất nghiệp* ở 64 khoá của 9 bài (`an2.173`, `an3.117`–`an3.119`, `an3.122`, `an7.31`, `an8.7`, `an8.8`, `ps1.2`) so với *hỏng* 12 khoá (`dn33`, `mnd16`, `ne36`, `pe1`) và *phá giới* 21 khoá (`dn16`, `an5.213`, `ud8.6`); hai bài khác nhắc đến cũng nêu cùng rủi ro. Đổi ở riêng bài này sẽ làm cùng một cụm Pāli có hai cách dịch ngay trong cụm kề nhau, nên tôi giữ và hạ ba điểm; đây là quyết định thuật ngữ cấp tầng, thuộc người biên tập (nếu đổi thì phải đổi đồng loạt cả chín bài và tiêu đề `0.3`). (2) `3.5`–`3.7`, `7.5`–`7.7`: `sattā` không có từ chỉ số lượng; *có chúng sinh* (Sujato: *Some sentient beings*) là cách đọc thận trọng nhưng ngầm giới hạn đối tượng; cấu trúc `hetu vā … hetu vā …` (hoặc do … hoặc do …) không được dịch thành chữ *hoặc*, chỉ thể hiện bằng ba mệnh đề song song nối dấu chấm phẩy. Giữ theo `an3.118:4.5` và tiền lệ `an10.217`; không phân xử được bằng căn cứ trong tầng. (3) `0.2` *Phẩm Đến Nơi Bại Vong* (10/10 khoá trong tầng, nhất quán, không đổi).

  Coverage English: mẫu số là các khoá Pāli có nội dung (từ 40 ký tự, bỏ khối `:0`); Sujato có bản cho bài này, các khoá `3.6`, `3.7`, `7.6`, `7.7` bản Anh chỉ có mảnh (*mind,* / *or view.*) vì Sujato gộp ba mệnh đề thành một câu; ở những khoá đó Pāli tự đứng vững. Không có lớp `english-project` cho bài này. Bản Việt hiện hành chỉ có dạng nguyên bài ở mục Tra cứu toàn văn, không phải tầng theo khoá. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này.
