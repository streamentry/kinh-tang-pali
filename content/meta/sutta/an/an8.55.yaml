notes: |-
  `Ujjayasutta` trong `Gotamīvagga`. 76 khoá, tất cả đã dịch. Bài song song gần nhất đã có là `an8.76` (cùng bộ tám thành tựu, cùng công thức `uṭṭhānasampadā … paññāsampadā` và cùng bài kệ `Uṭṭhātā kammadheyyesu`): thuật ngữ lấy từ đó (thiện nam tử, thành tựu siêng năng, thành tựu giữ gìn, có bạn lành, sống quân bình, thành tựu đức tin/giới/bố thí/tuệ), để hai bài không tự mâu thuẫn.

  COVERAGE ENGLISH (đo thật). Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 35. Bản Anh Sujato đã ghim (`an8.55_translation-en-sujato.json`, có trong manifest) có chữ ở 35/35 = 1,00, hoàn toàn độc lập với lớp lấp của dự án (không có tệp `english-project` cho bài này). Tầng `vietnamese-current` chỉ có Pháp Cú nên vắng ở bài này; tham khảo Việt truyền thống ở đây chỉ là các bài đã dịch của dự án (`an8.76`, `an8.75`, `an4.61`, `an3.79`, `dn31`, `snp1.6`). Cổng coverage không bị chặn.

  TIỀN LỆ PĀLI TRÙNG. 25/76 khoá có Pāli trùng nguyên văn ở bài khác trong tầng (tổng 804 cặp đã dò); 24/25 khoá dùng đúng một cách dịch đã có (`an8.76` cho bài kệ 15.1–18.4 và `10.6`; `an4.39` cho `1.1`–`1.2`; `6. Gotamīvagga` → *6. Phẩm Gotamī* 7 tệp). Khoá duy nhất khác mọi tiền lệ: `10.3` (`Saddhāsampadā, sīlasampadā, cāgasampadā, paññāsampadā.`) — `an4.61:6.3` viết *Niềm tin thành tựu, giới thành tựu, …*, còn bài này viết *Thành tựu đức tin, thành tựu giới, thành tựu bố thí, thành tựu tuệ* theo `an8.76` và để khớp ngay các câu hỏi `10.4`, `11.1`, `12.1`, `13.1` của chính bài. Trong bài có hai cặp Pāli trùng nguyên văn (`2.2`/`10.2`, `7.2`/`7.5`); cả hai cặp dịch giống hệt.

  THUẬT NGỮ VÀ BẤT ĐỊNH (không đưa vào thân kinh).
  1. `apāyamukhāni` / `āyamukhāni`. Cùng một từ Pāli nhưng hai ngữ cảnh: với tài sản dịch *cửa hao tán* / *cửa tăng thêm* (tiền lệ `dn31:7.1`: *cửa làm hao tán tài sản*); với hồ nước dịch *đường nước chảy ra* / *đường nước chảy vào* (tiền lệ `an4.178:3.6`, cùng câu `yāni ceva āyamukhāni tāni pidaheyya …`). Tách hai cách để mỗi nơi theo đúng tiền lệ của nó; mối song song vẫn lộ qua số *bốn* và đối xứng vào/ra.
  2. `itthidhutto / surādhutto / akkhadhutto` → *đắm chìm trong đàn bà / rượu / cờ bạc*, theo `snp1.6:17` (cùng ba từ). `pāpamitto pāpasahāyo pāpasampavaṅko` → *có bạn xấu, bạn đồng hành xấu, bạn thân tín xấu* (`sn3.18`, 13 khoá tương ứng *bạn đồng hành tốt, bạn thân tín tốt*); vế lành dùng *bạn lành* như `an8.76`/`an9.1`.
  3. `vīmaṁsā` ở `3.4`: dịch *sự xét đoán về phương cách thích hợp trong việc ấy, đủ sức làm, đủ sức sắp đặt*. Không chép `an8.76:1.7` (*biết cách thức và cách tính*) vì *cách tính* không có trong Pāli; Sujato: *understands how to go about these things*.
  4. `yācayogo` ở `12.2`: tầng có ít nhất năm cách dịch (*chuyên cần bố thí* `an3.79`, *sẵn sàng cho xin* `an4.61`, *hướng về việc cầu xin* `an5.47`, *sẵn sàng bố thí* `sn55.37`, *xứng đáng được xin* `an8.76:7.2` chỉ lược). Chọn *sẵn sàng đáp lại lời xin*, bám Pāli (yoga = gắn bó/sẵn sàng; yācā = lời xin); chưa phân xử được tuyệt đối.
  5. `vuddhasīlino` ở `5.2`: hiểu `daharā vā vuddhasīlino, vuddhā vā vuddhasīlino` là *dù còn trẻ mà giới hạnh thuần thục, hay đã lớn tuổi mà giới hạnh thuần thục* (Sujato: *may be young or old, but are mature in conduct*; `an8.76:3.2` tương tự). Cách đọc `vuddha` là *lớn tuổi* ở vế thứ hai là cách đọc thông thường, không có cách khác được kiểm chứng.
  6. `udumbarakhādī` → *kẻ ăn quả sung* và `ajeṭṭhamaraṇaṁ` → *chết như kẻ chết đói*: giữ đúng `an8.76:4.5–4.6` (cùng Pāli); Sujato: *fig-eater*, *starving themselves to death*. Nghĩa đen của `ajeṭṭhamaraṇaṁ` không kiểm chứng độc lập được ngoài hai bản ấy.
  7. `1.4` `Tesaṁ no bhavaṁ gotamo amhākaṁ tathā dhammaṁ desetu`: `tesaṁ no` được thể hiện qua *cho chúng tôi*; `tathā` → *theo cách ấy*; mệnh đề `ye amhākaṁ assu dhammā …` giữ ở thức khả năng (*có thể đem lại*).
  8. `1.1`–`1.2` dùng lại nguyên văn `an4.39:1.1`–`1.2` (cùng Pāli, cùng nhân vật Ujjaya), kể cả *lời nói đáng nhớ nhung* — công thức này đã được dùng nhất quán ở `an4.35`, `an4.183`, `an3.57` (8+5+3 khoá). Tên bài `Ujjayasutta` → *Kinh Với Ujjaya* theo `an4.39:0.3` (cùng Pāli).
  9. `pavāsaṁ gantukāmā` → *muốn đi xa nhà*; `pavāsa` là sự đi vắng khỏi nhà.

  NHÁY VÀ DẤU LƯỢC. `“` mở ở `1.3` và đóng ở `1.4`; `“` mở ở `2.1` và lại mở ở `14.1` (`…samparāyasukhāyāti.` không có nháy đóng), rồi đóng ở `18.4` (`”ti.`) — đúng từng khoá theo Pāli, không tự cân. Nháy đơn cân trong từng khoá. Bốn khoá có `…pe…` (`8.5`, `10.6`, `11.2`, `13.2`) giữ đúng một `…` mỗi khoá, không bung thành văn.

  SỐ PĀLI. `cattāro/cattāri` = bốn (2.1, 2.2, 7.1, 7.3, 8.1, 8.3, 9.1, 10.1, 10.2); `aṭṭha` ở `17.1` = tám (bốn pháp hiện tại + bốn pháp đời sau, khớp với hai nhóm bốn của bài); bốn đường vào và bốn đường ra của hồ nước (`7.3`, `8.3`) khớp Pāli. Không có số lớn nào cần tự tính.

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này không chạy bốn lệnh đó (bị cấm trong lát), nên để CI hoặc người điều phối chạy. `technical_integrity` đặt 9.6 vì kiểm tra tập khoá (76/76, đúng thứ tự Pāli), nháy đơn và nháy kép theo từng khoá, dấu lược theo từng khoá, NFC, không khoá rỗng, không Pāli lọt sang bản Việt và hai cặp Pāli trùng trong bài đều đã đạt; chưa đủ 10.0 vì các cổng `npm` và lượt rà của người chưa chạy.
