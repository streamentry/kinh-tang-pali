notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an5.55:5.3 — «Vì nếu ai muốn nói đúng nghĩa,» → «Này các tỳ-kheo, nếu có ai nói đúng nghĩa rằng:». Vì bản cũ làm mất hô ngữ bhikkhave và dấu «rằng:» dẫn vào câu trích ở 5.4; giữ «đúng nghĩa» (không đổi sang «một cách chân chánh» của các bài sn54.11, sn54.12) để cùng một cách nói với khoá 5.4 (sammā vadamāno vadeyya).
