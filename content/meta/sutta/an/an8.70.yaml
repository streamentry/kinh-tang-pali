notes: |-
  TẦNG THAM KHẢO. Tầng english-sujato có đủ bài này tại commit đã ghim: bản Sujato phủ 65/65 khoá Pāli có nội dung (khoá từ 40 ký tự trở lên, bỏ khối :0), tức 100%, nên không cần mục trong content/meta/reference-gaps.yaml. Không có lớp english-project cho bài này, nên toàn bộ phần đối chiếu English là của Sujato, độc lập với bản Việt. Tầng Việt hiện hành vắng với AN trong cột đối chiếu; bản Hòa thượng Thích Minh Châu (Tăng Chi 8.70) có ở dạng nguyên bài và được đọc để đối chiếu, không vào cột.

  BÀI SONG SONG, DÙNG LẠI CÁCH DỊCH ĐÃ CÓ. Bài này gần như trùng với dn16 (3.1–3.23 và 3.35–3.37), sn51.10 và ud6.1. Pāli trùng nguyên văn với một khoá của tầng ở 42 khoá; 37 khoá dùng lại đúng nguyên văn tầng đã có, 5 khoá cố ý lệch: 3.3 (dùng công thức tu tập của sn51.10, thống nhất với 3.2 và 4.4), 3.6 và 4.8 (dn16 viết trụ thế một kiếp, ở đây viết trụ một kiếp để khớp 3.2–3.3), 5.2 (ud6.1 gọi Ānanda là ngươi, dn16 tách thành hai khoá; ở đây dùng ông, như dn16), 7.4 (dn16 viết các cư sĩ, ở đây viết các nam cư sĩ theo đa số tầng). Pāli trùng nguyên văn trong chính bài: 6 nhóm (3.2 với 4.4; 3.4 với 4.6; 3.5 với 4.7; 3.6 với 4.8; 6.2, 7.2, 8.2; 7.1 với 8.1), bản Việt giống nhau ở cả 6 nhóm.

  THUẬT NGỮ, CÓ SỐ ĐẾM. Bốn như ý túc (iddhipāda): 40 tệp dùng như ý túc, 10 tệp dùng thần túc; chọn như ý túc (sn51.10 cũng dùng, dn16 và ud6.1 dùng thần túc). Công thức bhāvitā…susamāraddhā ở 3.2–3.3: dùng dạng của sn51.10 (làm thành cỗ xe, làm thành nền tảng, duy trì, tích lũy, khéo khởi phát) vì 3.3 trùng Pāli với sn51.10:3.3; dạng được dùng như cỗ xe, được hành trì, được làm cho quen thuộc, được khéo thực hiện (dn33 và nhiều bài AN) là cách dịch khác của cùng công thức, không dùng ở đây. Nam cư sĩ 125 tệp, nữ cư sĩ 70 tệp (dn16 viết cư sĩ-nữ, chỉ 1 tệp); phạm hạnh viết thường 467 tệp, viết hoa 68; tỳ-kheo-ni 94 tệp; đại oai lực 79 tệp, đại uy lực 54 tệp; Māra 76 tệp, Ma vương 69 tệp, giữ Māra ác nhân như dn16. Parinibbāyati dịch diệt độ như dn16 (23 khoá dn dùng diệt độ; sn và kn dùng nhập Niết-bàn nhiều hơn, AN không có tiền lệ cho các dạng parinibbāyissāmi, parinibbāyati, parinibbātu). Āyusaṅkhāra dịch lực mạng (dn16, sn51.10). Bhūmicāla dịch động đất (dn16, 19 khoá). 6.3, 6.4, 7.5 và 7.6 có pattayogakkhemā mà dn16 không có; dùng chuỗi am hiểu, được rèn luyện, vững vàng, đã đạt sự an ổn thoát khỏi ách trói buộc theo dn29 (5 khoá trùng chuỗi Pāli), khác dn16 (khéo léo, được huấn luyện, tự tin) ở cả ba từ đầu. 1.1: trong AN, Pāli trùng nguyên văn có 11 khoá viết Đức Phật và vài khoá viết Đức Thế Tôn; bài này giữ Đức Thế Tôn xuyên suốt để khớp các khoá lấy từ dn16, và dùng đúng câu an8.44 cho khoá 1.1. Khối :0.1: toàn tầng AN có 947 khoá viết Kinh Tăng Chi Bộ và 410 khoá viết Aṅguttara Nikāya; riêng an8 là 27 và 58; chọn dạng đa số toàn tầng, khớp an8.69 liền trước. Tên phẩm 7. Phẩm Đất Nền theo 9 bài an8.61–an8.69 cùng phẩm. Dasamaṁ dịch Thứ mười và Bhūmicālavaggo dutiyo dịch Phẩm Đất Nền, thứ hai theo mẫu các phẩm AN đã có. Kệ tóm lược (22.1–22.4) dịch theo tên các bài an8.61–an8.69 trong tầng (Ham Muốn, Đủ, Nói Tóm Tắt, Gayāsīsa, Tám Thắng Xứ, Giải Thoát, hai bài Cách Ăn Nói, Chúng Hội); Pāli viết abhibhunā, không có chữ tám, nên giữ là bài Thắng Xứ.

  SỐ PĀLI. Tiṇṇaṁ māsānaṁ (9.3) là ba tháng, dịch sau ba tháng. Tám nhân (aṭṭha hetū, aṭṭha paccayā) ở 14.1 và 21.3; các thứ tự paṭhamo, dutiyo, tatiyo, catuttho, pañcamo, chaṭṭho, sattamo, aṭṭhamo ở 14.4, 15.2, 16.2, 17.2, 18.2, 19.2, 20.2, 21.2 dịch nhất, hai, ba, tư, năm, sáu, bảy, tám, đủ tám và đúng thứ tự. Cattāro iddhipādā là bốn.

  BẤT ĐỊNH, KHÔNG THÊM VÀO THÂN KINH. (1) Kệ 10.4–10.7: ba bài song song trong tầng (dn16:3.10, sn51.10:18, ud6.1:17) dịch Tulamatulañca sambhavaṁ theo ba cách khác nhau; Sujato đọc tula như động từ so sánh và viết so sánh cái vô song với sự tạo ra đời sống kéo dài; Hòa thượng Thích Minh Châu viết mạng sống có hạn hay vô hạn. Ở đây dùng lại nguyên văn dn16:3.10.4–3.10.7 (Pāli trùng) và không phân xử thêm; sự lệch giữa ba bài là việc của người biên tập. (2) Kappa ở 3.2, 3.3, 3.6, 4.4, 4.5, 4.8 dịch là kiếp; Sujato dịch proper lifespan, nên nghĩa kiếp ở đây có thể là tuổi thọ đầy đủ; giữ chữ kiếp như toàn tầng và không giải thích. (3) Devatā ở 15.1 mang dạng số nhiều (devatā mahiddhikā mahānubhāvā) nhưng tassa ở câu sau là số ít; dịch có vị trời có đại thần lực, có đại oai lực như dn16. (4) 5.2 yassadāni kālaṁ maññasi: dịch bây giờ hãy làm điều ông nghĩ là hợp thời như dn16; Sujato dịch at your convenience. (5) Bahuputtakaṁ (3.1, 4.3) dịch đền Bahuputtaka đúng chữ Pāli ở đây; dn16 viết Bahuputta vì Pāli của dn16 là bahuputtaṁ. (6) Tầng Pāli ghim không có khoá an8.70:12.1 (đi từ 11.1 sang 12.2); giữ đúng khoá, không tự thêm.

  DẤU LƯỢC. 4.1, 4.5, 7.3 và 7.4 có …pe… ở Pāli, bản Việt giữ đúng một dấu … ở mỗi khoá, không mở rộng thành văn: 4.1 là câu bị cắt, 4.5 giữ phần giữa bị lược, 7.3 và 7.4 dừng ở chưa trở nên …. Pāli không có (…) trần ở khoá nào của bài này.

