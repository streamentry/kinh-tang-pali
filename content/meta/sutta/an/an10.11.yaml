notes:
  - >-
    **Bài mở đầu phẩm, và là bài duy nhất trong chương nói về chỗ ở** — nên nó
    đứng đầu. Ba mục: một tỳ-kheo đầy đủ năm phần, một chỗ ở đầy đủ năm phần,
    rồi kết luận lặp lại cả hai.
  - >-
    **`senāsana` → *chỗ ở*** theo 21 segment tiền lệ (`an3.40`, `an3.91`,
    `an4.28`, `an4.198`…). Cụm bốn tùy `senāsanagilānapaccayabhesajjaparikkharo`
    → *y pháp, thức ăn khất thực, chỗ ngồi nằm, thuốc men và đồ dùng cần thiết
    cho người bệnh* dùng nguyên văn `an3.140:4.6`.
  - >-
    **`pañcaṅga`/`chaḷaṅga` → *năm phần*/*sáu phần***: 25 segment trong corpus
    đang chia đôi — *yếu tố* 35 (đều ở `an3.19`, `an3.133`, `an5.135`… với nghĩa
    *nhân tố* của một người) và *phần* 22 (`an3.57`, `an4.112`, `an4.181`,
    `sn3.24`…). **Tôi chọn *phần*** vì ở đây nói đúng **năm phần bị trói buộc**
    `kāmacchando … vicikicchā`, mà tiền lệ trực tiếp cho đúng nghĩa đó là
    `an3.57:4.2` và `sn3.24:3.1` (*năm phần*). Ghi lại để người sau không tưởng
    là thiếu nhất quán.
  - >-
    **`Nāthavagga` → *Phẩm Bảo Hộ*** (0 segment tiền lệ, đặt mới): `nātha` là
    người bảo hộ, chỗ nương tựa — và Sujato dịch tên phẩm là *A Protector*. Cả
    phẩm đúng ngữ nghĩa đó: `nāthakaraṇā dhammā` → *mười pháp làm nên sự bảo
    hộ*, `sanāthā … mā anāthā` → *hãy sống có chỗ bảo hộ, đừng sống không chỗ
    bảo hộ*, `anātho viharati` → *sống không chỗ bảo hộ là khổ đau*. Vì ba cụm
    này lặp ở `an10.17` và `an10.18`, tôi dùng **cùng một cách** cho cả ba bài;
    `an10.19`–`an10.20` dùng `ariyāvāsā` → *chỗ ở của bậc Thánh* (cũng 0 tiền
    lệ), đối xứng với `senāsana` → *chỗ ở*.
  - >-
    **Bốn vế của `sīlavā … paññavā` dùng nguyên văn bài đã `published`**:
    `2.2`–`2.5` lấy từ `an5.135:3.3`–`:3.6` (cùng Pāli từng vế); `3.6`–`3.9` lấy
    từ `an3.20:6.2` và `an3.20:6.4` (`āgatāgamā dhammadharā vinayadharā
    mātikādharā` rồi `tassa te āyasmanto avivaṭañceva vivaranti…` — cùng Pāli).
    Vì `an3.20:6.2` dịch cụm `dhammadharā…` theo *thọ trì những gì đã được nghe,
    trì pháp, trì giới luật, trì bản mẫu* còn `an4.160:6.1` dịch theo *truyền
    thừa, giữ gìn Pháp, giữ gìn Giới, giữ gìn Mātikā*, tôi chọn **cách của
    `an4.160`** vì Tăng Chi Bộ dùng *giữ gìn Giới* (10 segment ở `an10.10:2.5`);
    đây là lựa chọn có chủ đích giữa hai tiền lệ cùng nghĩa.
  - >-
    **`…pe…` ở `2.3` được mở rộng, và đây là điểm cần biết.** Pāli chỉ còn
    `itipi so bhagavā … bhagavā’ti` — vế mở và vế đóng, không có gì ở giữa. Tôi
    dịch theo **hai tiền lệ đã `published`**: `an3.65:1.6` mở rộng phần đầu
    (*Bậc Đáng Kính ấy là bậc A-la-hán, Chánh Đẳng Giác, minh hạnh túc đủ …*),
    còn `an5.47:2.3` và `an5.135:4.3` thêm phần đóng (*… Đạo Sư chư Thiên và
    loài người, bậc Phật, Thế Tôn*). Nếu dịch đúng ba chữ nhìn thấy thì thành
    *“Bậc Đáng Kính ấy là … Thế Tôn.”* — **vô nghĩa**, và người đọc không có
    cách nào suy ra ý nghĩa. Ghi lại vì đây là chỗ duy nhất trong chương tôi chủ
    động viết ngoài chữ Pāli.
  - >-
    **Dấu hỏi ở `3.8` không có trong Pāli** (Pāli kết `’ti;`), nhưng
    `an4.195:5.3` — cũng Pāli không có `?` — đã `published` với dấu hỏi trong
    tiếng Việt. `ko attho` **là** câu hỏi, nên tôi theo tiền lệ ấy.
  - >-
    **`anāsavaṁ cetovimuttiṁ paññāvimuttiṁ diṭṭheva dhamme sayaṁ abhiññā
    sacchikatvā upasampajja vihareyya` → *nhờ đoạn tận các lậu, giải thoát tâm
    không lậu, giải thoát tuệ, tự mình chứng tri, chứng ngộ trong hiện tại, trực
    chứng và chứng ngộ, an trú, và sống*** dùng nguyên văn `an10.8:3.1` (cùng
    Pāli); `cetovimutti`/`paññāvimutti` theo `an5.71:2.4` (*được giải thoát tâm
    và được giải thoát tuệ*).
  - >-
