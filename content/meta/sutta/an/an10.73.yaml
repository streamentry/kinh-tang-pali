notes:
  - >-
    **Bài ba khối, và cả ba lặp lại cùng một mười điều**: liệt kê mười điều đáng
    ưa (mục 1), rồi mười vật chắn ngang (mục 2), rồi mười điều nuôi dưỡng (mục
    3) — và mỗi cặp vật chắn / nuôi dưỡng là **cùng một điều kiện, đảo dấu**.
    Đây là mẫu của bài nên tôi dịch thành cặp đối xứng và giữ đủ mười vế.
  - >-
    **`Ākaṅkhavagga` → *Phẩm Nguyện Cầu*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *If You Want*, và cả phẩm đúng một việc — *vị tỳ-kheo mong
    nguyện điều này, thì hãy làm điều kia* (`ākaṅkha` = mong nguyện).
    `Ākaṅkhasutta` → *Kinh Nguyện Cầu*.
    **`Ākaṅkhavaggo tatiyo` ở `an10.80:1.14` dịch là *Phẩm Nguyện Cầu, thứ ba***
    — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì phẩm này rõ
    ràng thứ tám (đúng như `8.` ở `0.2`). Tôi dịch theo Pāli vì Pāli là
    authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Cả ba danh sách đều là thuật ngữ 0 tiền lệ, đặt mới và ghi lý do tại
    đây**: `iṭṭha kanta manāpa` → *đáng ưa, đáng mến, đáng lòng*; `dullabha` →
    *hiếm có*; `paripantha` → *vật chắn ngang*; `uṭṭhāna`/`ālasya` → *cố gắng* /
    *lười nhác*; `maṇḍanā vibhūsanā` → *trang sức, làm đẹp*;
    `sappāyakiriyā`/`asappāyakiriyā` → *sinh hoạt chăm chỉ* / *sinh hoạt không
    thích hợp*; `sajjhāyakiriyā`/`asajjhāyakiriyā` → *ôn luyện chăm chỉ* /
    *không ôn luyện*; `sussūsā`/`asussūsā` → *lắng nghe* / *không lắng nghe*;
    `kalyāṇamittatā`/`pāpamittatā` → *kết bạn lành* / *kết bạn xấu* (theo
    `an3.27:1.11` *bạn bè xấu* cho phủ định); `sammāpaṭipatti`/`micchāpaṭipatti`
    → *tu hành đúng* / *tu hành sai*.
    Có tiền lệ: `saggā` → *cõi trời* (113 segment, `an10.229-232:1.2`),
    `brahmacariya` → *phạm hạnh* (137 segment), `bāhusacca` → *đa văn*,
    `pāpamittā` → *bạn bè xấu*, `anuyogo`/`apaccavekkhaṇā` → *chuyên tâm, phản
    tư* (theo `an5.149:1.3` cho `paccavekkhaṇā`).
  - >-
    **Ba danh từ đầu tiên phải cẩn thận vì dễ dịch trùng nghĩa**: `bhogā` → *tài
    sản*, `vaṇṇa` → *nhan sắc*, `ārogya` → *sức khỏe*; còn `sīla` → *giới* và
    `brahmacariya` → *phạm hạnh* là hai mục riêng biệt, dù tiếng Việt dễ gộp.
    Tôi giữ đủ mười mục.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
