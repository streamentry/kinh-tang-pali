notes: |-
  Dịch trọn 102/102 khoá từ Pāli root; bản Anh Sujato và bản Việt Hòa thượng Thích Minh Châu (toàn văn, không phân đoạn) dùng làm đối chiếu.

  Coverage English: mẫu số 62 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0); Sujato phủ 61/62 = 0,984 (≥ ngưỡng 0,80). Khoá duy nhất Sujato để trống là 7.9; lớp english-project của dự án đã lấp khoá này (cùng một nhóm tác giả với bản Việt, nên không tính là đọc English độc lập). Bản Việt phân đoạn (vietnamese-current) vắng cho bài này; bản Thích Minh Châu chỉ có dạng nguyên bài. Triangulation 9,3.

  Tiêu đề: 0.1 giữ « Aṅguttara Nikāya 7.68 » (quyển 7: Aṅguttara 59 vs Kinh Tăng Chi Bộ 35; toàn tầng an: Kinh Tăng Chi Bộ 959 vs Aṅguttara 411 — hai phạm vi cho đa số khác nhau, chọn phạm vi quyển; các bài lân cận an7.65, an7.69 cùng dạng). 0.2 « 7. Phẩm Lớn » trùng nguyên văn Pāli với 18 khoá khác, dùng lại. 0.3 « Kinh Bậc Biết Pháp »: bản tóm lược an7.74:12.2 đã dịch dhammaññū là « bậc biết pháp ».

  Thuật ngữ dòng ññū (đo trong tầng): dn33/dn34 « biết pháp, biết nghĩa, biết mình, … biết thời, biết hội chúng »; an5.131–132 và mn33:26.3 dùng « chừng mực » cho mattā (dn33 dùng « tiết độ ») ⇒ « biết chừng mực khi nhận ». attha trong atthaññū ở đây là « ý nghĩa của lời nói » (khác an5.131 nơi attha là « lợi ích » của vua). Nhãn trích dẫn ‘bậc biết …’ giữ « bậc » cho nhất quán với tiêu đề; puggalaparoparaññū dịch « biết các hạng người hơn kém » (Sujato: high and low; Thích Minh Châu: người thắng kẻ liệt); dạng puggalaparoparaññū có 0 tiền lệ trong tầng (chỉ có purisapuggalaparopariye ở an10.75, 2 khoá, ngữ cảnh khác).

  Danh sách chín phần (2.3, 2.5, 2.7): dùng dạng « kinh khất đàm, kinh khế tùng, kinh giải thích, kinh kệ, kinh tự nói, kinh bản sự, kinh bản sinh, kinh hy hữu, kinh phương quảng » — 26 khoá (an4.107, an4.191, an5.155…) so với 2 khoá an6.51:3.2 và :4.4 (« khế kinh, ứng tụng, giải thuyết, … ») và 4 khoá mn22 (« kinh văn, văn xuôi xen kệ, … »). Hai khoá an6.51 trùng nguyên văn Pāli với 2.3 nhưng bản Việt khác; tôi chủ ý theo dạng đa số của cùng bộ AN. Đây là lựa chọn đã cân nhắc, không phải lỗi; nếu người biên tập muốn thống nhất theo an6.51 thì đổi cả ba khoá.

  Các cặp trùng nguyên văn Pāli đã dò: 7.3/7.9 (bản Việt giống hệt nhau); 8.6, 9.4, 10.4, 11.4, 12.4, 13.4, 14.4 (gārayho) và 8.8, 9.6, 10.6, 11.6, 12.6, 13.6, 14.6 (pāsaṁso) đều giống hệt nhau trong bài; 1.2 « Với bảy nào? » (16 khoá an7 cùng dạng) và 16.3 « Thứ tư. » (161 khoá). So với tiền lệ an6.59 (4 + 4 khoá trùng nguyên văn Pāli cho 8.6 và 8.8): chỉ đổi « vị ấy » thành « người ấy » vì chủ ngữ ở đây là puggala chứ không phải bhikkhu; phần còn lại « thì như vậy, … đáng bị chê trách / đáng được khen ở phương diện ấy » giữ nguyên.

  Bất định đã ghi: (1) uddesa ở 6.3 dịch « học tụng » theo nghĩa đọc/học thuộc (Sujato: recitation); Thích Minh Châu dịch « tuyên thuyết », có thể hiểu là giảng dạy; trong tầng Việt, 28 khoá có uddesassa đều ở mn18, mn133, mn138 và dịch là « tóm lược » nên không dùng được làm tiền lệ cho nghĩa này. (2) yoga ở 6.3: « chuyên tâm tu tập » (Sujato: meditation; Thích Minh Châu: tu tập). (3) paṭisallāna: « độc cư » theo tiền lệ dn33/dn34/dn25; Thích Minh Châu dùng « thiền tịnh ». (4) 3.3 và 3.5, 3.7: Pāli lặp « imassa bhāsitassa » hai lần; giữ lặp đúng như Pāli và như bản Thích Minh Châu, không đọc thành « này … kia » như Sujato. (5) dassanakāmo dịch « muốn gặp » theo tiền lệ dn6, dn14, dn19, mn83 (Thích Minh Châu: ưa thấy). (6) dvayena ở 8.2/15.1: « theo từng cặp » (Sujato: in terms of pairs; Thích Minh Châu: theo hai hạng); giữ thể bị động « được vị tỳ-kheo biết » đúng với bhikkhuno … viditā honti.

  Số Pāli trong bài: chỉ « bảy » (sattahi, 1.1, 1.2, 16.2) và « hai » (dve, 8.3–14.1); không có phép tính nào khác.

  Dấu lược: 1.1, 2.5, 2.7, 7.6, 16.2 có …pe… ⇒ mỗi khoá giữ đúng một «…», 0 lệch; không có (…) trần. Nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch; 7.3→7.4, 7.6→7.7, 7.9→7.10 mở ở khoá trước và đóng ở khoá sau đúng như Pāli). Khoá và thứ tự khoá khớp Pāli 102/102; NFC; không khoá rỗng; không Pāli lọt sang Việt (ngoài 0.1).

  Bị chặn cổng kỹ thuật (không được chạy các lệnh kiểm), tiêu chí 10 ở 9.6; đã xác minh JSON hợp lệ và các phép đo nội bộ như trên. Bốn lệnh để người điều phối chạy: npm run validate · npm test · npm run check · npm run build.
