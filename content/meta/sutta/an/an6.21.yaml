notes: |-
  TẦNG THAM KHẢO. Tầng english-sujato tồn tại tại commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639; bản Sujato có 14/20 khoá Pāli có nội dung, thiếu 6 khoá nêu trong blocking_errors. Tầng Việt hiện hành vắng với AN tại commit đã ghim.

  DÙNG NGUYÊN VĂN BÀN ĐÃ CÓ. Năm khoá có Pāli trùng nguyên văn với an7.32 (cùng kiểu vị thiên nói ban đêm rồi Thế Tôn kể lại cho các tỳ-kheo) nên tôi DÙNG LẠI NGUYÊN VĂN: 2.5, 2.6, 2.7, 3.1, 3.7 lấy từ an7.32; 3.8 lấy từ an4.21 (Pāli trùng tuyệt đối). Cùng công thức parihānāya thì tôi theo an6.31 vì nó cùng cấu trúc câu (dhammā ... bhikkhuno parihānāya saṁvattanti) và cùng tầng an.

  THUẬT NGỮ, ĐẾM ĐƯỢC. Kammārāmatā, bhassārāmatā, niddārāmatā → thích làm việc, thích nói chuyện, thích ngủ: an6.31:1.3 dùng đúng ba này cho cùng công thức Pāli; an6.22:1.3 dùng ham thích công việc, ham thích nói chuyện, ham thích ngủ nghỉ. Tôi theo an6.31 vì gần hơn. Saṅgaṇikārāmatā → thích tụ họp (an6.31:1.3). dovacassatā, pāpamittatā → khó được khuyên, kết bạn xấu: an6.115:1.3 dùng đúng hai này. Katame tayo → Là ba pháp nào theo an6.31:1.2 (Katame cha → Là sáu nào); an6.115:1.2 dùng Thế nào là ba, nên tôi ghi nơi đây để người biên tập biết còn một cách nữa đang tồn tại trong tầng an.

  NHÁY KÉP BỔ SUNG. Pāli mở nháy kép ở 3.2 nhưng không đóng ở bất kỳ khoá nào (bản kinh cũng hở, vì an6.32 và an7.32 cùng lỗi này và cả hai tệp Việt đã merge đều hở). Tôi đóng nháy ở 4.2, đúng chỗ Pāli có dấu ”, để câu nói của Thế Tôn khép lại. Ba nhóm nháy còn lại (2.1–2.4, 4.5–5.3) khớp Pāli.

  DẤU LƯỢC. Bài không có dấu lược nào; bản Việt cũng không có.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.

  Giải quyết draft 2026-10-12: Hai blocker cũ (Sujato im lặng ở 10 khoá; coverage Anh 14/20 = 70% dưới ngưỡng 0,80) đều là loại độ phủ tham khảo, không phải lỗi văn bản, nên đã gỡ; mất mát được ghi nhận ở reference-gaps.yaml do công cụ của kho sinh. Các khoá Sujato trống: 3.2, 3.3, 3.4, 3.5, 3.6, 3.8, 3.9, 4.2, 5.2, 5.3. Đã đọc đối kháng từng khoá từ Pāli: 3.2–3.8 là lời vị thiên được Thế Tôn thuật lại y nguyên 2.1–2.7; 4.2 là lời mời lắng nghe; 5.2–5.3 song song với 5.1. Tất cả tự đứng vững từ Pāli, nên gỡ blocker; triangulation giữ 7,2 (không có bản Anh độc lập cho các đoạn này). Tầng Việt hiện hành vắng với AN tại commit đã ghim: chỉ là giới hạn tham chiếu.
  Sửa nghĩa thật, 8/32 khoá (2.1, 2.4, 3.3, 3.6, 3.9, 5.1, 5.2, 5.3): (1) bhante nói với Đức Thế Tôn nay là Bạch Thế Tôn, không Bạch tôn giả (an7.32 và an6.32, cùng khung thiên tử bạch Phật, đều Bạch Thế Tôn; Bạch tôn giả chỉ còn 4 khoá của chính bài này trong tầng an). (2) 3.6 mở nháy đơn thừa ở đầu câu (Pāli chỉ đóng nháy ở cuối), đã gỡ. (3) 3.9 alābhā/dulladdhaṁ trước đây dịch thành thật đáng tiếc lặp hai lần, mất vế đối ứng tesaṁ...ye; nay dịch theo cấu trúc quan hệ: những ai trong các ông mà chư thiên cũng biết đang thoái lui thì mất mát, được điều không tốt (đối chiếu an10.46:1.5 dịch alābhā/dulladdhaṁ là chịu thiệt/lãng phí điều quý báu). (4) 5.1–5.3 kusalehi dhammehi parihāyati là cách ly cách (thoái lui khỏi các pháp thiện), không phải theo các pháp thiện; atītamaddhānaṁ chỉ là trong thời quá khứ, nên bỏ đã xa xôi (thêm nghĩa); 5.2 parihāyissanti là tương lai nên có sẽ. Tiền lệ trong tầng an: 7 khoá thoái lui theo các pháp thiện, 4 thoái đọa khỏi các thiện pháp, 16 suy giảm trong các pháp thiện; chỉ sửa trong bài này, không động bài khác.
  Còn lại, ghi nhận không sửa: kevalakappaṁ dịch toàn thể theo an7.32 (kappa có thể mang nghĩa gần như toàn thể, không phân xử được); 2.7 padakkhiṇaṁ katvā là thân hữu nhiễu còn 3.8 là đi quanh Ta bên phải, hai cách dịch cùng cụm Pāli, mỗi cách theo bài nguồn của nó; tên Kinh Làng Sāma và Phẩm Vượt Trội (Anuttariya) theo quy ước nhất quán của 10 bài an6.21–30 trong tầng. Thẻ cũ sáu-pháp-không-suy-diễn (chép nhầm từ an6.22) đã đổi thành sáu-pháp-thoái-lui. technical_integrity vẫn 9,6 vì bốn lệnh npm run validate, npm test, npm run check, npm run build chưa chạy trong lát này.
