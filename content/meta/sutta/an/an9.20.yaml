notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh trên Pāli có nội dung: 32/40 = 0.80 — ĐÚNG NGƯỜNG, không dưới** (ngưỡng `minCoverage: 0.8`), nên không cần mục trong `reference-gaps.yaml`. Tầng `english-project` không có cho uid này; 8 khoá mất Anh là `9.2`–`9.9` — toàn bộ là bước lặp của cái thang đã được Sujato dịch đủ ở `6.1`–`9.1` đầu bài, nên mỗi bước được kiểm lại bằng Pāli đặt cạnh Pāli với chính bản dịch của bước đầu. Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ có Pháp Cú); `external-references.yaml` chỉ khai budsas cho MN và SN, KHÔNG khai cho AN, nên không có tra cứu toàn văn Việt cho bài này — mọi thuật ngữ dưới đây đều đối chiếu bằng tiền lệ đo được trong tầng Việt của chính kho.
  **8/56 khoá có Pāli trùng nguyên văn ở bài khác; 7 dùng lại.** `0.2` (6/7: *2. Phẩm Tiếng Hồi*) · `1.1` (15/33: *Một thời, Đức Phật ở Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika.*) · `1.2` — 11 tiền lệ chia 4 dùng *cư sĩ* / 7 dùng *gia chủ*: theo đa số nhóm từ + tiêu đề phẩm *Gia Chủ*, lấy nguyên văn an5.41:1.2 · `2.8` = `3.5` (267/431: *Vì sao vậy?*) · `3.4` (an5.148:3.2, nguyên văn) · `9.10` (244/246: *Thứ mười.*) · `10.0` (346/460: *Tóm lược:*).
  **Công thức lặp — dùng lại tiền lệ.** Năm điều dâng cúng `2.5`/`3.2` dùng nguyên văn cách dịch của an5.147:1.3/2.3 (*cẩu thả / không có tâm niệm / không bằng tay mình / những thứ bỏ đi / tâm nghĩ ‘chẳng bao giờ lại gặp lại nhau nữa’* và vế thuận *cẩn trọng / có tâm niệm / bằng tay mình / không phải bỏ đi / ‘sau này sẽ còn gặp lại nhau nữa’*) — hai khoá này tôi thêm `‘…’` quanh ý nghĩ theo đúng tiền lệ đó, root Pāli không có dấu này. `2.6`/`3.3` theo an5.148:5.2 (*thiên hướng hưởng thụ … thượng thặng*, `năm dục công năng` 2 tiền lệ) · `2.7` là phủ định của `3.4` đã trùng · `từ bỏ … veramaṇiṁ` theo dn5:26.5 (Pāli trùng từng điều) · `buddhappamukhaṁ bhikkhusaṅghaṁ` → *đại chúng tỳ-kheo lấy Đức Phật làm bậc nhất* (dn16:1.30.4/2.19.4) · `cātuddisaṁ saṅghaṁ uddissa vihāraṁ` → *nơi cư trú dành cho Tăng chúng bốn phương* (dn5:24.4) · `pasannacitto` → *tâm tịnh tín* (176 khoá) · `sikkhāpadāni samādiyati` → *thọ trì các học giới* (học giới 156 khoá) · `visodheti` → *làm cho sự cúng dường được thanh tịnh* (mil6.1.8) · `catuāsīti`-sahassa → *tám mươi bốn ngàn* (tiền lệ dn19/mn) · `tưởng vô thường` (57 khoá, không dùng *niệm vô thường* — 0 khoá).
  **Thuật ngữ thang quả vị:** `diṭṭhisampanna` → *bậc thành tựu chánh kiến* (tiền lệ *người đã thành tựu chánh kiến*; TMC-style *chứng ngộ tứ đế* có phần giải thích, không dùng) · `sakadāgāmi` → *Nhất Lai* (16 khoá) · `anāgāmi` → *Bất Lai* (1 tiền lệ là tiêu đề *Kinh Quả Bất Lai*; *Bất Hoàn* 0 khoá) · `arahanta` → *A-la-hán* (1.451 khoá) · `paccekabuddha` → *Độc Giác* (33 khoá) · `tathāgataṁ arahantaṁ sammāsambuddhaṁ` → *Như Lai, A-la-hán, Chánh Đẳng Giác*.
  **Bất định còn lại, đều ghi ở đây thay vì che:** (1) `lūkhaṁ kaṇājakaṁ biḷaṅgadutiyan` — hai cách dịch trong kho: *cháo chua trộn hạt bilaṅga* (dn23, 2 lần) và *cháo chua với hạt tiêu giả* (an3.39, 1 lần); theo đa số dn23 và giữ tên Pāli `biḷaṅga`. (2) `caturāsīti vatthakoṭisahassāni` — số học không xác định từ Pāli; tôi theo số của Sujato (8.400.000.000) → *tám tỷ bốn trăm triệu*. (3) `gandhanamattaṁ` / `accharāsaṅghātamattaṁ` — 0 tiền lệ trong tầng; dịch theo nghĩa được Sujato và chú giải xác lập: *khoảng thời gian kéo vú bò* / *pảy ngón tay*. (4) `(…)` trong root ở `7.1`, `8.1`, `8.9` giữ nguyên `(…)` đúng như các bài đã publish (mn40, mn82, mn95, mn126, dn16) — không bung, không bỏ; ở `8.9` phần bị lược là mệnh đề so sánh *so với việc thọ trì các học giới* (Sujato bung, tôi không bung). (5) `uddāna` `10.1`–`10.4` là thơ ghi nhớ; *Tiếng Hồi* khớp tên phẩm, *Tưởng cục bụi bẩn* gộp Gaṇḍa (9.15, *Kinh Cục Bụi Bẩn*) và Saññā (9.16), *gia đình* khớp an9.17, *chư thiên* khớp an9.19.
  **`9.11` `Sīhanādavaggo dutiyo` → *Phẩm Tiếng Hồi, thứ hai.*** theo mẫu `Phẩm X, thứ hai.` (53 khoá) và tên phẩm đa số `2. Phẩm Tiếng Hồi` (6/7 — tên này nén `sīha-nāda` thành *tiếng hồi* là kém chuẩn về ngữ nghĩa, nhưng là cách dịch đa số toàn tầng và đã được coordinator hiệu chỉnh ở an9.19; đổi tên phẩm là việc của người gộp, phải sửa cả 7 tệp).
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
