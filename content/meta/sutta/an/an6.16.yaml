notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit và bản Hòa thượng Thích Minh Châu (nguyên bài, chỉ tra cứu toàn văn, không căn theo segment). **Coverage Anh Sujato trên Pāli có nội dung: 46/57 = 80,7% (≥ ngưỡng 0,8, nhưng sát ngưỡng).** Sujato để trống 11 khoá có nội dung: `2.10`, `2.11`, `3.6`, `3.7`, `4.6`, `4.7`, `5.7`, `5.8`, `6.7`, `6.8` (điệp khúc nhắc lại `2.2`–`2.3`) và `8.3`. Lớp lấp `english-project` có bù đủ 11 khoá này (cổng tính 57/57), nhưng lớp ấy do cùng nhóm tác giả viết nên tôi **không** coi là cách đọc Anh độc lập: `triangulation` hạ xuống 8,8 và bản Việt chỉ tuyên bố đã đối chiếu độc lập với Sujato ở 46/57 khoá. Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ phân phối Pháp Cú). Không có blocker, không cần entry `reference-gaps`.
  **Pāli trùng nguyên văn trong chính bài: 6 nhóm, 34 khoá** (`2.2`=`2.10`=`3.6`=`4.6`=`5.7`=`6.7`=`7.7`; `2.3`=`2.11`=`3.7`=`4.7`=`5.8`=`6.8`; `2.4`=`3.1`=`4.1`=`5.1`=`6.1`=`7.1`; `2.6`=`3.3`=`4.3`=`5.3`=`6.3`=`7.3`; `2.9`=`3.5`=`4.5`=`5.6`=`6.6`=`7.6`; `5.5`=`6.5`=`7.5`); bản Việt của mỗi nhóm **giống nhau từng chữ** (0 cặp lệch). `7.8` chỉ khác `2.11` ở dấu đóng ngoặc kép, đúng như Pāli. **Pāli trùng với bài khác trong tầng: 17 khoá có cặp trùng, 15 khoá dùng lại nguyên văn** (`0.2` ← `an6.14:0.2`, 7 bài cùng phẩm; `0.3` ← `sn35.131:0.3`; `2.4`, `3.1`, `4.1`, `5.1`, `6.1`, `7.1` ← `an9.20:5.1`; `2.6`, `3.3`, `4.3`, `5.3`, `6.3`, `7.3` ← `an9.20:5.3`; `9.8` ← *Thứ sáu.*, 237 bản). **2 khoá khác tiền lệ có chủ ý**: `1.1` (`an8.48:1.1` viết *Đức Phật … vườn nai Bhesakaḷā*; `sn35.131:1.1` viết *Thế Tôn trú giữa xứ Bhagga … vườn Bhesakaḷāvana*; tôi theo *Đức Thế Tôn* của các bài cùng phẩm `an6.17`, `an6.18`, và giữ cả `vana` theo `an7.61`: *vườn nai rừng Bhesakaḷā*) và `9.1` (tầng đã có ba cách khác nhau cho `Lābhā te, gahapati, suladdhaṁ te`: *ngươi được lợi … ngươi được lành phúc* ở `sn41.5`, `sn41.7`, `sn47.29`, `sn47.30`; *ông thật được lợi lớn … lợi lành* ở `sn55.27`; *gặp phải may mắn* ở `sn41.1`; tôi giữ cấu trúc hai vế, đổi *ngươi* thành *ông* theo cách Đức Thế Tôn xưng hô gia chủ trong cùng bài).
  **Thuật ngữ, đã dò tiền lệ.** `sāpekkho kālamakāsi` → *qua đời khi còn quyến luyến* (`dn17:2.11.6`: *qua đời với tâm còn quyến luyến*; Sujato *concerns*, bản Hòa thượng Thích Minh Châu *mong cầu ái luyến*) · `kālakiriyā` → *sự qua đời* (tầng: *qua đời* 18, *cái chết* 14, *mạng chung* 13; chọn *qua đời* cho thống nhất với `kālamakāsi`) · `garahitā` → *bị chê trách* (`dn17`) · `ābādhiko dukkhito bāḷhagilāno` → *bị bệnh, khổ đau, bệnh nặng* (`sn52.10`) · `gilānā vuṭṭhito aciravuṭṭhito gelaññā` → *vừa khỏi bệnh, mới khỏi bệnh chưa lâu* (`an3.73`) · `daṇḍamolubbha` → *chống gậy* (`sn4.21`) · `Vuṭṭhahi … tamhā ābādhā` → *đã khỏi bệnh ấy* (`sn46.16:3.3`) · `so ābādho ahosi` đã đoạn trừ → *bệnh ấy … đã được đoạn trừ như vậy* (`sn46.14:4.4`, `sn46.16:3.4`) · `ābādho ṭhānaso paṭippassambhi` → *lắng dịu ngay tại chỗ* (`sn47.9:2.7`, `sn54.9`) · `odātavasanā` → *mặc áo trắng* (`an5.196`, `dn33`, `dn29`) · `sīlesu paripūrakārī` → *viên mãn về giới* (`an5.180`, 14 khoá) · `ajjhattaṁ cetosamatha` → *định tâm nội tại* (62 khoá; bản Hòa thượng Thích Minh Châu *nội tâm tịnh chỉ*) · `imasmiṁ dhammavinaye` → *Giáo Pháp và Giới Luật này* (toàn tầng: *Giáo Pháp và Giới Luật/Luật* 47 khoá, *Pháp và Luật* 42; trong `an`: 25 so với 22 — chọn theo đa số và theo `an6.17`) · `assāsappatta` → *sự yên ổn* (`sn38.5`, `sn38.6`) · `tiṇṇavicikicchā vigatakathaṅkathā vesārajjappattā aparappaccayā satthusāsane` → *đã vượt qua nghi hoặc, đã dứt trừ do dự, đạt đến sự không run sợ, không lệ thuộc người khác trong lời dạy của bậc Đạo sư* (`dn14:3.12.1`, ba khoá giống hệt; `mn73` dịch *sống với sự tự tin chắc chắn*) · `kaṅkhā vā vimati vā` → *hoài nghi hay phân vân* (`an4.76`, `sn47.12`) · `dassanakāma` → *muốn gặp* (`an8.25`, `an5.55`) · `anukampikā atthakāmā` → *thương cảm, muốn điều lợi lạc* (`sn9.2`, `sn9.13`; cùng 9 khoá) · `ovādena ovadiyamānassa` → *khuyên dạy bằng lời khuyên này* (`sn22.83`, `an8.63`) · `gahapatānī` → *nữ gia chủ* (`an1.266`, `an8.48`, `mn21`). `ovādikā`, `anusāsikā` không có tiền lệ dạng này: dịch *hay khuyên dạy, hay hướng dẫn* theo `an5.76`. `ogādhappattā`, `patigādhappattā` có 0 tiền lệ trong tầng (xem bất định 7). Tên riêng giữ đúng dạng Pāli của bài.
  **Bất định, ghi tại đây chứ không thêm vào thân kinh.** (1) `2.7` `kappāsaṁ kantituṁ veṇiṁ olikhituṁ`: `kantati` là kéo sợi, `veṇi` là bím tóc/dải bện, `olikhati` là chải/cào; Sujato hiểu *carding wool*, bản Hòa thượng Thích Minh Châu *chải lông cừu*; tôi dịch *kéo sợi bông và chải len* theo hai bản ấy, không chắc `veṇi` ở đây chính xác là len. (2) `2.5`, `2.8` `gharāvāsaṁ santharituṁ`: Sujato dịch *keep up the household carpets*, bản Hòa thượng Thích Minh Châu *duy trì nhà cửa*; Pāli `gharāvāsa` là đời sống tại gia (cf. `mn99`), nên tôi dịch *duy trì đời sống gia đình*, không theo *carpets*. (3) `3.2` `aññaṁ gharaṁ gamissati`: Pāli chỉ nói *đi đến nhà khác*; Sujato diễn *take another husband*. Việc tái giá là suy từ `3.4` chứ không có chữ nào nói *chồng*, nên tôi dịch *sẽ đi đến một gia đình khác*. (4) `3.4` `gahaṭṭhakaṁ brahmacariyaṁ samāciṇṇaṁ`: Sujato *remained chaste while at home*; Pāli chỉ nói *phạm hạnh của người tại gia*, và ngữ cảnh gợi sống tịnh hạnh trong đời sống gia đình nhưng không nói rõ nội dung; tôi giữ nguyên *phạm hạnh* và không giải thích thêm. Con số `soḷasa vassāni` = 16 (soḷasa 6 + 10) → *mười sáu năm*, khớp Sujato *sixteen years* và bản Hòa thượng Thích Minh Châu *mười sáu năm*. (5) `7.2` một chữ phủ định `na` đứng đầu cả chuỗi `ogādhappattā … aparappaccayā … viharati`; tôi phủ định từng mục như Sujato và bản Hòa thượng Thích Minh Châu, và dịch mục cuối `aparappaccayā` phủ định là *còn lệ thuộc người khác* (tương đương *not independent*, không thêm nghĩa). Phạm vi phủ định kiểu *không phải tất cả* cũng đọc được từ Pāli nhưng không đổi lập luận của `7.4`. (6) `6.2`, `7.2` Pāli không có `mamaccayena`: tôi dịch thì hiện tại, không gắn mốc *sau khi ta qua đời* như `2.5`, `3.2`, `4.2`, `5.2`. (7) `ogādhappattā patigādhappattā assāsappattā`: Sujato *found a footing, a firm footing, and solace*; bản Hòa thượng Thích Minh Châu *thể nhập, an trú, thoải mái*; không có tiền lệ cho `ogādha`/`patigādha` trong tầng; tôi dịch *chỗ đứng*, *chỗ đứng vững chắc*, *sự yên ổn* (khớp `assāsappatta` ở `sn38.5`). (8) `5.5` `Yassa kho panassa kaṅkhā vā vimati vā`: Pāli không nêu đối tượng của nghi ngờ; tôi không thêm *về điều này* như Sujato, và thêm chủ ngữ *người ấy* cho `pucchatu` theo bản Hòa thượng Thích Minh Châu. (9) `9.1`, `9.6` `Lābhā te … suladdhaṁ te`: ba tiền lệ trong tầng dịch khác nhau (xem trên); không phân xử được cách nào là chuẩn, tôi chọn cách bám Pāli hai vế. (10) `9.2` `Yassa te nakulamātā …` là mệnh đề quan hệ không có động từ chính; tôi thêm *Vì* để câu Việt nối được với `9.1`, theo sắc thái Sujato *to have*.
  **Dấu câu.** Nháy `“ ” ‘ ’` **khớp Pāli từng khoá** (0 lệch trên 67 khoá). Pāli không có `…` nên Việt cũng không có (0 lệch, 0 trên 0 khoá). Tiêu đề `0.1` giữ dạng `Aṅguttara Nikāya 6.16` như `an6.17` (97 tệp `an6.*` cùng dạng).
  **Số Pāli:** chỉ có `soḷasa vassāni` = 16.
