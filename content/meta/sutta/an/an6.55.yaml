notes: |-
  Dịch từ Pāli root commit 11c9d708.
  Coverage tầng Anh: Sujato phủ 52/57 khoá Pāli có nội dung (từ 40 ký tự, bỏ khối :0) = 91,2%, trên ngưỡng 0,80. Năm khoá còn lại (12.4, 13.4, 17.11, 17.14, 17.19) Sujato để trống; lớp english-project đã published lấp đủ năm khoá ấy, nên cổng tính 57/57, nhưng năm khoá đó do cùng một bên viết, không phải cách đọc Anh độc lập, nên không dùng để chấm triangulation. Cả năm khoá đều là lặp lại đúng Pāli đã có trong bài, bản Việt dùng lại nguyên văn.
  Bản Việt nguyên bài của Hòa thượng Thích Minh Châu được đọc đối chiếu như tra cứu toàn văn (không phải tầng segment); tầng vietnamese-current ở mức segment không phủ bài này.
  97/97 khoá khớp Pāli root tuyệt đối, đúng thứ tự khoá. Nháy kép và nháy đơn khớp Pāli từng khoá (0 lệch trên 97 khoá). Mười khoá có dấu lược … (17.3 đến 17.6, 17.10, 17.11, 17.15 đến 17.18) đều giữ đúng một …; Pāli của bài không có (…) trần.
  Pāli trùng nguyên văn trong bài: 11 nhóm (25 khoá), bản Việt khớp byte ở cả 11 nhóm. Pāli trùng với bài khác trong tầng: 20 khoá có cặp trùng, trong đó 20 khoá bản Việt hiện diễn đạt hơi khác (phần lớn là câu đệm Evaṁ bhante, No hetaṁ bhante, công thức Evaṁ me sutaṁ và ba cụm giác quan); công thức Khīṇā jāti và công thức mô tả bậc A-la-hán (đối chiếu an6.49:2.1) theo cách dịch đã có trong tầng.
  Số Pāli: cha ṭhānāni = sáu điều (6, đối chiếu sáu mục nekkhamma, paviveka, abyāpajja, taṇhākkhaya, upādānakkhaya, asammoha = 6, khớp); tham, sân, si = ba (3, mỗi mục 11.4 đến 16.1 đủ ba mệnh đề); bốn phương đông, tây, bắc, nam (4, đủ); sáu loại đối tượng sắc, tiếng, hương, vị, xúc, pháp (6, khớp sáu căn). 0 lệch.
  Bất định ở 7.2, 8.1: vīriyasamathaṁ adhiṭṭhaha / adhiṭṭhāsi. Bản này dịch quyết định sự quân bình của tinh tấn, theo cách đọc samatha là sự quân bình (cùng mạch với indriyānañca samataṁ ngay sau và ví dụ dây đàn); Sujato đọc focus on energy and serenity (tinh tấn và an tịnh), bản nguyên bài của Hòa thượng Thích Minh Châu đọc an trú tinh tấn một cách bình đẳng, nghiêng về cách đọc quân bình.
  Bất định ở 10.1 và các khoá có adhimutta: adhimutto dịch hướng tâm đến (Sujato dedicated to, Hòa thượng Thích Minh Châu xu hướng); tầng chỉ có dạng subhanteva adhimutto (dn33, dn15, dn34, dn16, mn77, mn137) dịch chú tâm vào, chưa có tiền lệ cho các dạng ghép nekkhammādhimutta. Abyāpajja dịch không ác ý theo tiền lệ abyāpāda (52 khoá không ác ý, 78 khoá không sân); Sujato đọc kindness, Hòa thượng Thích Minh Châu vô sân. Asammoha dịch không mê lầm; Sujato đọc mental clarity.
  Bất định ở 11.4, 12.4, 13.4, 20.3: katassa vā paṭicayaṁ / katassa paṭicayo natthi dịch điều còn phải bồi thêm vào việc đã làm (paṭicaya là sự tích thêm, bồi thêm); Sujato đọc anything that needs improvement, Hòa thượng Thích Minh Châu đọc cái gì cần phải làm thêm. Tầng chưa có tiền lệ nào cho paṭicaya.
  Bất định ở 1.6, 3.3: na anupādāya āsavehi cittaṁ vimuccati dịch tâm ta chưa được giải thoát khỏi các lậu hoặc do không chấp thủ, theo công thức anupādāya āsavehi cittaṁ vimuccati (51 khoá trong tầng dịch giải thoát khỏi các lậu hoặc do không chấp thủ); Hòa thượng Thích Minh Châu đọc còn chấp thủ, tâm chưa giải thoát.
  Bất định ở 17.2 và các khoá lặp: vayañcassānupassati dịch và vị ấy quán thấy sự hoại diệt, coi anupassati có chủ ngữ là vị tỳ-kheo; Sujato đọc mind observing disappearance, bản của Hòa thượng Thích Minh Châu đọc quán thấy tánh diệt của chúng. Amissīkata dịch không bị pha tạp (Sujato untainted; Hòa thượng Thích Minh Châu không lộn xộn).
  Bất định ở 17.10 đến 17.12: bhusā vātavuṭṭhi dịch cơn mưa gió dữ dội, có đủ vuṭṭhi; hai bài sn56.39 và sn56.40 trong tầng dịch cơn gió mạnh, bỏ vuṭṭhi, nên có thể xem lại cho đồng nhất. Bhusā ở 17.1 dịch mạnh mẽ (Sujato compelling, Hòa thượng Thích Minh Châu nhiều).
  Bất định ở 19.3: disvā āyatanuppādaṁ dịch sau khi thấy sự sinh khởi của các xứ, theo cách đọc Sujato (seen the arising of the senses); tầng chưa có tiền lệ. Bất định ở 22.2: tādino dịch bậc như thế (4 khoá trong tầng dùng bậc như vậy).
  Đại từ ngôi hai: Đức Thế Tôn nói với Tôn giả Soṇa dùng ngươi, cùng cách dùng với an6.56 trong cùng phẩm; tầng không thống nhất ở các khoá hỏi tỳ-kheo (ngươi và ông đều có); Tôn giả Soṇa xưng với Đức Thế Tôn là bạch Thế Tôn.
  technical_integrity đặt 9.6: chưa chạy npm run validate, npm test, npm run check, npm run build trong phiên dịch này; cần chạy bốn lệnh ấy trước khi gộp.
