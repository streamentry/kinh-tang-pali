notes: |-
  Sửa lan 2026-10-13: khoá an3.110:1.4 và 2.3, "ngôi nhà cao tầng có mái hỏng / có mái tốt: nóc nhà … các xà ngang …" → "ngôi nhà có mái nhọn lợp dở / lợp khéo: đỉnh mái … các cây rui …" (kūṭāgāre ducchanne/succhanne, kūṭa, gopānasī); căn cứ: đồng bộ với an3.109:2.1, 5.1 (đã sửa), mn48:7.2, an10.15:3.1, sn22.102:5.1. Giữ "sụp đổ" cho byāpanna vì cả bài và tiêu đề dùng thống nhất. Khoá an3.110:2.5 (Pāli có …pe… giữa câu) thêm dấu lược "…" cho khớp Pāli, trước đó Việt thiếu dấu lược nên không qua kiểm tra dấu lược của công cụ.
