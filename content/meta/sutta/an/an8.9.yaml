notes: |-
  **Coverage Anh Sujato trên Pāli có nội dung: 27/27 = 100%.** Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708 (bilara chỉ phân phối 26 tệp tiếng Việt, toàn bộ là Pháp Cú), nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của kho.

  **Bài song song `an4.37` và `an3.16`** (đủ bốn pháp: hộ trì các căn, biết đủ trong
  ăn uống, chuyên cần tỉnh thức, tỉnh giác). 8/38 khoá trùng nguyên văn Pāli;
  **3 cặp tôi dùng lại NGUYÊN VĂN** — `4.3` (*trong canh đầu của đêm, bằng kinh hành
  và ngồi, thanh lọc tâm khỏi các pháp là những chướng ngại;*) · `4.5` (1/2, chọn
  bản có dấu chấm câu khớp Pāli) · `5.3` (*các tưởng rõ biết …*) — cộng `0.3`
  (3/3) và `1.9`/`2.8` (15/15 cho *Như vậy, vị ấy tỉnh giác rõ ràng về điều ấy.*).

  **`0.2` — TÔI CỐ Ý LỆCH TIỀN LỄ, xin người gộp sửa hoặc giữ.** `Mettāvagga` đang
  được 4 tệp đã có (`an8.1`, `an8.3`, `an8.4`, `an8.5`) dịch là *1. Phẩm Từ* — nhưng
  `Mettā` là **từ bi**, còn *Từ* một mình là *vac* (lời/sound), nên cách đó mất đúng
  chữ `bi` và làm sai nghĩa tên phẩm. `an8.1:0.3` cũng đang dùng *Kinh Lợi Ích Của
  Từ*. Tôi dùng *1. Phẩm Từ Bi* cho `an8.9` và ghi ở đây; nếu người biên tập chọn
  giữ *Phẩm Từ* thì phải sửa `an8.1`, `an8.3`, `an8.4`, `an8.5` **cùng lúc**, không
  để một bài khác bốn bài.

  **Bốn thuật ngữ lấy theo đếm, và đây là phần câu chữ chính của bài.**
  `indriyesu guttadvāro` → *hộ trì các căn* (13/49; đối chiếu *hộ trì các cửa của
  các căn* 3 và *hộ trì các cửa giác quan* 7) · `bhojane mattaññū` → *biết đủ trong
  ăn uống* (11/42; *biết tiết độ* 10, *biết chừng mực trong thức ăn* 3) ·
  `jāgariyaṁ anuyutto` → *chuyên cần tỉnh thức* (10/38) · `satisampajña` → *tỉnh
  giác* (663 lần trong tầng). Cụm `neva davāya …` ở `3.3` dùng lại nguyên văn `an3.16`
  (đã công bố).

  **`disā` → *phương đông/tây/bắc/nam*** theo `dn31:1.4`. **`anudisa` → *các phương
  xen giữa*: 0 tiền lệ trong toàn tầng** (đo: *xen giữa* 0 lần, *giữa bốn phương* 0
  lần). Sujato dịch *the intermediate directions*. Đây là chỗ tôi phải tự đặt, nên
  ghi rõ trong notes; `ambiguity_integrity` 9.4 vì lý do này cùng với `Tibbarāgo`.

  **`kulaputto` → *thiện nam tử*** (124 lần) · `Balavā` → *mạnh mẽ* ·
  `Pāsādiko` → *đáng mến* (40 lần; `dn27:8.7` dùng *đẹp*, Sujato *lovely*) ·
  **`Tibbarāgo` → *ham tình dục*: 0 tiền lệ** (đo *ham tình dục* 0 lần, *tình dục*
  6 lần). Tôi dịch theo nghĩa Pāli và theo Sujato (*lustful*); vì không có cách
  đã dùng để đối chiếu, tôi chọn *ham tình dục* thay vì *say mê tình dục* — sát
  `rāga` hơn. Nếu người biên tập muốn *tình dục* thì dùng chung.

  **Dấu lược: bảy khoá** — `2.1` (`…pe…`), `2.2`-`2.5` (mỗi khoá một `…`), `5.3`
  (`…pe…`), `5.4` (`…pe…`). Tôi giữ đúng MỘT `…` mỗi khoá; riêng `5.4` Pāli lược cả
  *khi khởi lên, khi tồn tại* nên bản Việt cũng lược đúng hai vế đó, không bịa thêm.

  **`6.1` khác `1.5` ở một chữ.** Pāli `1.5` có `carituṁ`, `6.1` có `caritun` — nhưng
  cả hai là `caritum` (thể `caroti`). Tôi dịch hai câu giống nhau (*làm sao Nanda có
  thể giữ trọn vẹn và thanh tịnh đời sống phạm hạnh…*) vì nghĩa và cách viết là
  như nhau; Pāli chỉ khác ở chữ bản mạch (cuối câu của câu hỏi).

  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
