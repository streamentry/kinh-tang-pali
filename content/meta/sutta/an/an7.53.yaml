  **Thuật ngữ, kèm số đếm trên tầng Việt:** *Đại Thiên Vương Vessavaṇa* (`vessavaṇ-` + `mahārājā`: *Đại Thiên Vương* 15 · *Đại vương* 5, dn32/dn18/dn19/dn21) · *vùng Núi Phía Nam* cho `dakkhiṇāgirismiṁ` (đúng công thức của Tôn giả Sāriputta ở `mn97:2.1`; nơi khác là *vùng Dakkhiṇāgiri* / *đồi phía Nam*) · *phẩm Bờ Kia* cho `pārāyana` (`snp5.18`, `snp5.19`, `cnd3`: *Phẩm Bờ Kia*) · *pháp môn* cho `dhammapariyāya` (`snp5.18:1.4`) · *học giới* cho `sikkhāpada` (103 khoá; *điều học* 4) · *khởi tâm* cho `cittuppāda` (`mn114`) · *kiết sử* / *hạ phần kiết sử* (`mn64`, 20 khoá `pañcorambhāgiya`) · *Dạ-xoa* (104 khoá `yakkha`) · *qua đời* cho `kālaṅkato` (135 · *chết* 40 · *mệnh chung* 25) · *gần sáng* cho `rattiyā paccūsasamayaṁ paccuṭṭhāya` (5 · *rạng đông* 2 · *cuối đêm* 2 · *sáng sớm* 2) · *rời tay khỏi bát* cho `onītapattapāṇiṁ` · *Thưa Tôn giả* (10 · *Bạch Tôn giả* 8, trong an) cho `bhante` nói với Tôn giả Sāriputta.

  **Số Pāli:** `pañcorambhāgiyāni saṁyojanāni` = *năm hạ phần kiết sử* (pañca 5, `mn64`); `Dasamaṁ` = *thứ mười*; `Mahāyaññavaggo pañcamo` = *thứ năm*; `ekaputtako` = *con trai duy nhất* (1); uddāna `dve` = 2, `dasa` = 10 (1+1+2+2+1+1+1+1 = 10 bài từ an7.44 đến an7.53, khớp). Không có số lớn, không có cụm chưa phân xử được.

  **BẤT ĐỊNH (không thêm vào thân kinh):**
  1. **`12.4` `vivekajaṁ pītisukhaṁ dutiyaṁ jhānaṁ`.** Pāli đã ghim ghi *vivekajaṁ* (do ly sinh) ở thiền thứ hai, trong khi công thức chuẩn ở mọi nơi khác (và Sujato *born of immersion*, Hòa thượng Thích Minh Châu *do định sanh*) là *samādhijaṁ*. Đây là lệch của chính văn bản Pāli ghim, rất có thể là lỗi lặp từ thiền thứ nhất (`12.3`). Chỉ có **1** nơi trong toàn tầng có dạng này (không có tiền lệ đối chiếu). Bản Việt giữ *do ly sinh* đúng theo Pāli đã ghim (Pāli là authority); nếu người biên tập quyết định theo công thức chuẩn thì sửa thành *do định sinh*. Không ảnh hưởng giáo lý của cả bài, chỉ là một cụm trong công thức.
  2. **`8.5` `vadhe vā vajjhamāne vā`.** Pāli ghi *vadha/vajjhamāna* (bị hành hình / đang bị hành hình), cặp đứng giữa *bị bắt* và *bị giết* (`hate vā haññamāne vā`). Sujato dịch cặp này là *imprisoned / being put in prison* và Hòa thượng Thích Minh Châu *bị trói / đang bị trói*, tức hai bản đều đọc như *bandhe/bajjhamāne* (trói/bỏ tù). Bản Việt theo Pāli đã ghim: *bị hành hình hay đang bị hành hình*. Ý chung (con bị bắt, bị xử, bị giết mà tâm bà không đổi khác) không đổi.
  3. **`3.5`/`6.5` `bhātā`.** Pāli không nói anh hay em; tiếng Việt buộc chọn. Bản Việt dùng *người anh em* để không áp đặt tuổi. Hòa thượng Thích Minh Châu dịch *anh*.
  4. **`3.6`/`3.7`/`3.9` `ātitheyyaṁ` và `etañceva`.** Dịch *quà tiếp khách* (Sujato *offering … as my guest*; Hòa thượng Thích Minh Châu *quà tặng đón khách*). Kho chỉ có 4 khoá với *lễ đãi tặng* (toàn an2.157, nghĩa *đón tiếp* theo hai loại tặng vật), nên không áp ở đây. `etañceva` ở `3.7` mơ hồ phạm vi (điều vừa tụng, hay điều sắp nói ở `3.8`); bản Việt dùng *cả điều này cũng* để giữ cả hai khả năng.
  5. **`3.8`/`6.8` `dakkhiṇaṁ ādiseyyāsi`.** Dịch *dành sự cúng dường này cho tôi* (tránh *hồi hướng* vì nghĩa kỹ thuật hậu kỳ). `6.10` cho thấy nội dung là phước của việc bố thí.
  6. **`11.3` `upāsikā paṭidesitā`.** Dạng bị động, không nêu tác nhân. Sujato (*declared myself*) và Hòa thượng Thích Minh Châu (*tự chấp nhận*) đọc theo nghĩa tự xác nhận; bản Việt giữ trung tính *được nhận là nữ cư sĩ*.
  7. **`9.4` `uddassesi`** (hiện ra trước con): hiếm, nghĩa lấy từ ngữ cảnh và hai bản tham khảo (*revealed / hiện lên trước mặt*).
  8. **`0.2`/`14.3` *Phẩm Đại Tri Kiến*.** Giữ đúng cách dịch của 7 bài cùng phẩm đã publish (an7.44–an7.52) để nhất quán. `Mahāyañña` nghĩa gốc là *đại tế lễ* (dn5: *đại tế lễ*; Sujato *A Great Sacrifice*; Hòa thượng Thích Minh Châu *Đại Tế Đàn*), không phải *tri kiến*. Chưa sửa vì đây là tên phẩm chung của cả bảy bài; cần người điều phối quyết định đổi cả phẩm một lượt.
  9. **`15.1`–`15.2` uddāna** (`Ṭhiti ca parikkhāraṁ dve, aggī saññā ca dve parā`): bản Việt đọc *dve* ở dòng đầu là cặp *Trú xứ* + *Điều kiện* (an7.44, an7.45) và *dve parā* là hai cặp tiếp theo (*Lửa* an7.46–47, *Tưởng* an7.48–49), khớp 10 bài; đây là cách đọc suy từ số bài, không có tiền lệ cho đúng dòng này.

  **Dấu lược:** Pāli không có `…` ở khoá nào; bản Việt không có `…` ở khoá nào, 0 lệch. **Dấu nháy:** nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá, 84/84 khoá (đã đối chiếu cả hai loại từng khoá; các nháy chạy qua ranh giới khoá `4.4`→`4.5`, `6.1`→`6.10`, `7.1`→`7.2`, `8.1`→`8.5`, `12.1`→`12.6` đều khớp). Tập khoá Việt = tập khoá Pāli = 84, đúng thứ tự Pāli. NFC sạch, 0 khoá rỗng, 0 khoảng trắng thừa, không Pāli lọt sang Việt ngoài tên riêng.

  **`technical_integrity` = 9,6 (không phải 10):** các lệnh còn lại của kho **chưa được chạy trong phiên dịch này** và không được tuyên bố đã đạt: `npm run validate` · `npm test` · `npm run check` · `npm run build`. Cần chạy trước khi coi `published` là chốt.
