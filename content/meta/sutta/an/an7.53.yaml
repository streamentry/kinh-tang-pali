  **Dùng lại tiền lệ (Pāli trùng/gần trùng, đo trên tầng):** `0.1`–`0.3` theo mẫu an7.50–52 (*Kinh Tăng Chi Bộ 7.x* · *5. Phẩm Đại Tri Kiến* · *Kinh …*) · `14.2` `Dasamaṁ.` → *Thứ mười.* (an7.* dùng *Thứ chín.* ở 8/9 nơi, 1 nơi *Bài thứ chín.*) · `15.0` `Tassuddānaṁ` → *Tóm lược:* (đa số an6/an7) · `15.5` `Paṇṇāsako samatto.` → *Phần năm mươi kinh hoàn tất.* (nhóm an3–an10) · `10.3` gần trùng `an4.55:2.1`/`2.4` (cùng công thức *daharasseva daharā ānītā … manasāpi aticaritā, kuto pana kāyena*) → *từ khi … còn trẻ được đưa về cho … còn trẻ … không nhớ … huống nữa là bằng thân*, dùng *phụ bạc* theo `mn129:39.7` thay vì *làm trái* của an4.55 (hai tiền lệ, chọn cái gần nghĩa `aticarati` đối với vợ chồng) · `6.10` theo `mn35:30.5` (*phước và sự tăng trưởng của phước trong việc bố thí này, xin cho điều ấy đem lại hạnh phúc cho …*) · `5.1` theo công thức *bhuttāviṁ onītapattapāṇiṁ* (dn4, dn5, dn16 …: *đã dùng xong và rời tay khỏi bát … ngồi xuống một bên*) · `14.1` theo công thức *dhammiyā kathāya sandassetvā …* (dn4:27.1) · `4.1`/`4.9` theo dn4:25 / dn16:1.30 (*các món ăn ngon, loại cứng và loại mềm; tự tay …*).

