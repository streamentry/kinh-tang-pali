notes: |-
  Lát c55. Mệnh đề 0.1 — đo lại: toàn tầng `an` là “Kinh …” 897 vs “Aṅguttara …” 353,
  nhưng riêng quyển 7 nghiêng ngược: “Aṅguttara” 52 vs “Kinh” 21 ⇒ “Aṅguttara Nikāya
  7.69”.

  0.2 `7. Mahāvagga` trùng nguyên vân với `an3.61:0.2` ⇒ dùng lại “7. Phẩm Lớn”.

  Tên cây: `mn134:2.11` và `:5.15` đã dùng “cây Pāricchatta” (2 lần); `snp1.3:10.2` giữ “cây
  koviḷāra”. Tôi dùng “cây Pāricchatta” xuyên suốt (20 khoá) và KHÔNG tự đặt tên mới
  như “Càn Thắng”. Bất định đã ghi: `pāricchattako koviḷāro` là gộp hai từ
  (Pāricchatta + koviḷāra “xanh mát, che bóng”); Sujato dịch “The Shady Orchid Tree”, tức
  lấy `koviḷāra` làm tính từ. Tôi bỏ vế tính từ vì 20 lần lặp sẽ nặng câu; nếu coordinator
  muốn giữ thì nên thống nhất cách diễn đạt đó trước, vì nó xuất hiện ở cả bài.

  Sáu cõi chư thiên ở 16.2–16.7: tôi dùng **đúng những dạng đã có trong kho** — “chư thiên
  Tứ Đại Thiên Vương”, “chư thiên Tāvatiṁsa” (38), “chư thiên Yama” (11), “chư thiên
  Tusita” (7), “chư thiên Nimmānaratī” (3), “chư thiên Paranimmitavasavattī” (3) —
  đếm được trong tầng Việt, không tự đặt. `brahmakāyikā` (16.7) thì **0 tiền lệ** ⇒ tôi
  giữ Pāli kèm chức vị “chư thiên Brahmakāyikā”; người điều phối có thể thống nhất với
  “chư thiên Phạm Chúng” đang có ở dn (2 lần).

  `saddamanussāventi` (15.1, 16.7): grep toàn Pāli trong cache cho thấy cụm này **chỉ xuất
  hiện ở chính an7.69** (không bài nào khác), và grep tầng Việt = 0 tiền lệ ⇒ tôi đặt
  “cất tiếng reo lên”. Sujato dịch “raise the cry”. Đây là cách thứ N+1 có chủ đích, ghi
  ở đây.

  `yojana` tôi giữ nguyên Pāli làm đơn vị, theo tiền lệ đo được: “tám mươi bốn nghìn
  yojana” (an2.10), “một trăm yojana” (mil3.7.10). Đã sửa sau một lượt review: bản nháp
  đầu dùng “năm mươi lẻ / trăm lẻ” (chỉ 6 lần trong tầng Việt và không nhất quán với
  cách kho xử lý `yojana`).

  `Attamanā` = “vui vẻ” (83 lần). `kesamassuṁ ohāretvā kāsāyāni vatthāni acchādetvā`
  dịch theo tiền lệ: “cạo bỏ râu tóc, khoác áo cà-sa” (7 lần).

  Dấu lược: 10.1, 11.1, 12.1, 13.1, 14.1, 16.1 đều có `…pe…` ⇒ giữ **đúng một** `…`,
  không mở rộng. Lượt review bắt được một lỗi thật: bản nháp đầu đã xoá dấu lược ở 14.1,
  `_hvi.py` báo lệch và tôi sửa lại — đúng như chốt yêu cầu.

  15.2 và 16.8 trùng nguyên văn Pāli với nhau ⇒ dùng lại **nguyên văn** một dạng; công
  thức này cũng trùng với tiền lệ đã có trong tầng (“do cạn lậu hoặc, tự mình chứng tri,
  chứng ngộ trong hiện tại và an trú ở giải thoát tâm không lậu hoặc, giải thoát tuệ”).

  Triangulation 9.4: Sujato phủ 32/32 khoá Pāli ≥40 ký tự (100%); `vietnamese-current`
  vắng. Ba tầng tra tiền lệ: mn134 (tên cây), snp1.3 (koviḷāra), và các bài đã có cho cụm
  `anāsavaṁ cetovimuttiṁ…`.

  Bị chặn cổng kỹ thuật (không được chạy `npm run validate|test|check|build`), tiêu chí 10
  ở **9.6**: đã xác minh JSON hợp lệ, 42/42 khoá, không orphan/rỗng, NFC, dấu lược khớp
  từng khoá (0 lệch), ngoặc kép cân 1/1, không `(…)` đứng một mình. Bốn lệnh npm để
  coordinator chạy.