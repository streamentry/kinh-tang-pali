notes: |-
  Dịch đủ 81/81 khoá Pāli root của an9.4 từ snapshot SuttaCentral/Bilara đã ghim; không có khoá nào ngoài tập khoá Pāli.

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE ENGLISH:
  - Tầng Anh Sujato phủ 54/54 khoá Pāli có nội dung (>= 40 ký tự, bỏ khối :0) = 100%, cao hơn ngưỡng 0,80 của source/layers.yaml; chỉ khoá colophon 13.6 để trống ở Sujato (Pāli "Catutthaṁ." quá ngắn nên không nằm trong mẫu số). Tầng english-project không có tệp cho bài này, nên không có phần nào của coverage đến từ lớp lấp của dự án. Tầng vietnamese-current (segment) không có bài này tại commit đã ghim (chỉ có Pháp Cú); bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn được đọc để đối chiếu thuật ngữ, không căn theo segment. Không cần entry trong reference-gaps.

  KIỂM TRA ĐO ĐƯỢC (chạy sau khi ghi):
  - Tập khoá Việt = tập khoá Pāli = 81/81, thứ tự khoá đúng thứ tự Pāli; không khoá rỗng; NFC sạch; không khoảng trắng thừa; không Pāli lọt sang bản Việt (chỉ còn tên riêng Sāvatthī, Anāthapiṇḍika).
  - Nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá: 0 lệch trên 81 khoá. Cấu trúc nháy lồng nhau giữ đúng như Pāli: 8.3 mở nháy đơn và 8.6 đóng, 8.16 tự mở tự đóng, 8.2 mở nháy kép đến 13.5 mới đóng; 8.18 Pāli không có nháy đóng nên Việt cũng không thêm.
  - Dấu lược khớp Pāli từng khoá: 8.8, 10.1, 11.2, 12.1 và hai lần ở 12.2 (…pe… -> đúng một …); 3.3 có (…) trần của tầng Pāli ghim và được giữ nguyên (…) ở Việt.
  - Pāli trùng nguyên văn trong chính bài: 4 nhóm gồm 12 khoá (4.7/5.2/6.2/6.7/8.4; 4.8/5.3/6.8; 4.10/8.7; 11.1/13.1) = 15 cặp, bản Việt khác 0 cặp. Các cặp gần trùng (4.6/8.3, 4.9/8.6, 5.1/8.8, 6.3-6.5/8.11-8.12, 9.3-9.4 so với 10.1, 11.2, 12.2, 13.2) khác nhau về nháy, dấu câu hoặc phép lược nên không phải trùng byte và được dịch theo từng chỗ.
  - Số Pāli: không có phép tính cộng/nhân. catuppādako = bốn chân; catūhi padehi (8.2) = bằng bốn câu; dvayaṁ (4.4) = hai việc; pañca ānisaṁsā = năm lợi ích, và bài liệt kê đúng 5 (9.3, 10.1-10.2, 11.1-11.2, 12.1-12.3, 13.1-13.3, đánh số thứ nhất đến thứ năm ở 9.5, 10.3, 11.3, 12.4, 13.4); colophon Catutthaṁ = thứ tư, đúng thứ tự an9.4 trong phẩm.

  DÙNG LẠI TỪ TẦNG (đếm trên tầng):
  - 16 khoá Pāli trùng nguyên văn với khoá ở bài khác, tổng 593 cặp, trong đó bản Việt hiện có khác bản của tôi ở 213 cặp (phần lớn là các khoá ngắn như Thứ tư/Thế nào là năm, có nhiều biến thể). 13 khoá dùng đúng dạng đa số của tầng: 0.2 (7/7, 1. Phẩm Giác Ngộ), 1.1 (16/36), 4.7, 5.2, 6.2, 6.7, 8.4 (5/7: Như vậy, về phương diện ấy, vị ấy chưa trọn vẹn), 4.8, 5.3, 6.8 (7/10: Vì vậy, phải làm cho trọn vẹn yếu tố ấy), 7.2 (25/55), 9.2 (129/173), 13.6 (152/245). Ba khoá còn lại cố ý khác đa số: 4.9 (có giới thay cho giới đức của an8.71:1.4, vì có giới là 146 khoá so với giới đức 12), 7.3 (hai tiền lệ khác nhau, chọn đi vào chỗ trú theo an5.166:12.7), 8.10 (dạng chữ thường nối câu trước, dùng cùng cách dịch của 4.7).
  - Nhóm cùng khung an8.71, an8.72 và an10.8-10.10 (saddho, sīlavā, aparipūro, paripūretabbaṁ): hai cụm bản Việt của tầng khác nhau (an8.71 dùng viên mãn chi phần ấy, an8.72 và an10.8-10.10 dùng trọn vẹn yếu tố ấy / về phương diện ấy); chọn cụm nhiều khoá hơn (5/7 và 7/10), nên kinh này đọc đồng bộ với an8.72 và an10.8-10.10, khác an8.71.

  THUẬT NGỮ (đếm trên tầng):
  - upaṭṭhānasālā -> giảng đường (14 khoá, so với hội trường 2: sn54.9).
  - kulaputta -> thiện nam tử (66 khoá toàn tầng, 33 khoá ở an; con nhà lành 3).
  - sabrahmacārī -> đồng phạm hạnh (167 khoá so với bạn đồng 10). āvuso -> hiền giả (404) / các hiền giả (167), chư hiền 11 khoá; chọn các hiền giả cho lời Nandaka gọi nhiều tỳ-kheo.
  - ānisaṁsa -> lợi ích (213 khoá so với quả báo 3); kālena dhammasākacchāya -> bàn luận về pháp đúng thời theo an4.146 (bàn luận Pháp).
  - saddho -> có lòng tin (lòng tin 32, tín 38, niềm tin 17, đức tin 14: dạng lòng tin cùng an8.71); sīlavā -> có giới (146); lābhī -> được (132, so với đạt 16, chứng 12).
  - adhipaññādhammavipassanā -> thắng tuệ quán các pháp (35/35 khoá toàn tầng, an4.93-an4.95); cetosamādhi -> định của tâm bên trong, khớp cách an4.93 dịch cetosamatha là an định của tâm bên trong, chỉ đổi an định thành định vì ở đây là samādhi.
  - paṭisallānā vuṭṭhito -> từ nơi độc cư đứng dậy (độc cư 20 khoá, tịnh 12, thiền 11); ukkāsetvā aggaḷaṁ ākoṭesi -> ho khan rồi gõ vào then cửa (an10.30:1.9 dùng ho khan và gõ cửa).
  - ādikalyāṇaṁ majjhekalyāṇaṁ pariyosānakalyāṇaṁ sātthaṁ sabyañjanaṁ -> tốt đẹp ở phần đầu, tốt đẹp ở phần giữa, tốt đẹp ở phần cuối, có nghĩa lý, có văn từ (an5.30:1.9, sn35.133); kevalaparipuṇṇaṁ parisuddhaṁ brahmacariyaṁ pakāseti -> trình bày phạm hạnh hoàn toàn viên mãn, thanh tịnh (sn42.7:2.10).
  - piyo ca hoti manāpo ca garu ca bhāvanīyo ca -> yêu mến, ưa thích, tôn kính, và đáng ngưỡng mộ (cụm Pāli này có 29 khoá toàn tầng: 17 khoá dịch theo dạng yêu mến, ưa thích, tôn kính, ngưỡng mộ, còn lại chủ yếu theo an8.3 là được thương, dễ chịu, được kính, đáng thân cận; chọn dạng 17 khoá, ở đây chủ thể là Bậc Đạo Sư).
  - atthappaṭisaṁvedī ca dhammappaṭisaṁvedī -> chứng nghiệm về nghĩa và chứng nghiệm về pháp (an3.43, an3.44); Sujato dịch là feel inspired, Thích Minh Châu là thọ trì, hai cách đều rộng hơn chứng nghiệm.
  - appattassa pattiyā anadhigatassa adhigamāya asacchikatassa sacchikiriyāya -> để đạt được điều chưa đạt được, để chứng được điều chưa chứng được, để thực chứng điều chưa thực chứng (sn12.22:3.6). Công thức A-la-hán 13.3 theo sn54.12:4.1 và sn54.11:3.6; sekhā appattamānasā -> bậc hữu học, tâm chưa thành tựu (sn54.11:3.5, sn54.12:9.1).
  - dhammiyā kathāya sandasseti samādapeti samuttejeti sampahaṁseti -> chỉ dạy, khích lệ, làm phấn khởi và làm hoan hỷ (sn8.8:1.2, sn8.6:1.2); Sujato educating, encouraging, firing up, inspiring.
  - dhammī vā kathā ariyo vā tuṇhībhāvo -> hoặc nói về pháp, hoặc giữ sự im lặng cao quý: dùng nguyên văn ud2.2:4.3, ud3.8:6.3, ud3.9:6.3 (3/3). Sannipatitānaṁ vo ... dvayaṁ karaṇīyaṁ theo ud2.2:4.2.
  - Tên kinh: Nandakasutta -> Kinh Nandaka (giữ tên người theo Pāli). Phẩm Sambodhivagga = 1. Phẩm Giác Ngộ (7/7). Colophon Catutthaṁ = Thứ tư.

  BẤT ĐỊNH (không thêm vào thân kinh):
  - 3.3 ettakampi (…) no nappaṭibhāseyyā: Pāli có (…) trần ở giữa câu, giữ nguyên (…) theo quy ước tầng Pāli ghim. Nghĩa đen là ngay chừng này cũng đã không đến để nói (paṭibhāsi ở 2.3 là bài pháp đã nói); Sujato dịch I wouldn't have said so much và Thích Minh Châu dịch đã không nói dài như vậy. Tôi dịch ngay chừng này (…) chúng con cũng đã không nói theo sát chữ, đồng nghĩa với hai bản kia nhưng không thêm dài/nhiều. Nội dung đã lược trong (…) không xác định được.
  - bahidvārakoṭṭhake: dịch bên ngoài cổng theo sn3.11:1.2 và an6.42:1.9 (sn3.11 và an6.42 dịch ngoài cổng; an5.30 dịch ngoài cửa ra vào). Sujato và Thích Minh Châu dịch outside the door / ngoài cửa; koṭṭhaka có thể là gian cổng hoặc tiền sảnh ngay trước cửa giảng đường, trong khi 1.4 và 1.5 nói aggaḷa (then cửa) và dvāra (cửa) của chính giảng đường. Chọn cổng cho nhất quán tầng; cách hiểu cổng hay hiên ngoài cửa không đổi nghĩa bài.
  - omako lāmako (6.4, 8.11): dịch bị khiếm khuyết, tồi tệ (omaka thấp kém, lāmaka tồi); Sujato lame and disabled là cách hiểu cụ thể hơn Pāli. Câu so sánh chỉ cần bốn chân mà một chân không đủ.
  - yathā yathā ... tathā tathā: dịch càng ... bao nhiêu, thì ... càng ... bấy nhiêu ở 9.4, 10.1-10.2, 11.2, 12.2 theo sn11.22 (càng ... bao nhiêu ... bấy nhiêu) và Thích Minh Châu (nhiều như thế nào ... nhiều như vậy); Sujato dịch whenever. Ở 13.2 yathā yathā đi với tattha (không có tathā tathā), nên dịch mỗi khi ... thì ở đó, theo Sujato; vì vậy cùng một cụm Pāli có hai cách dịch trong bài, có chủ ý.
  - patto vā pajjati vā (12.3): dịch đã chứng đạt hoặc sẽ chứng đạt theo Sujato và Thích Minh Châu; Pāli không nói chứng đạt điều gì và pajjati có thể đọc là đang/sẽ đạt; không thêm tân ngữ.
  - sārajjamānarūpo (3.1, 4.1): dịch với vẻ bối rối / đang bối rối theo Sujato embarrassed và Thích Minh Châu bối rối; sārajja còn có thể là e ngại, rụt rè.
  - catūhi padehi (8.2): dịch bằng bốn câu theo Sujato và Thích Minh Châu; không đếm lại cụ thể bốn câu nào.
  - tenaṅgena / taṁ aṅgaṁ: dịch về phương diện ấy / yếu tố ấy theo nhóm an8.72, an10.8-10.10 (dạng đa số); aṅga cũng có thể dịch chi phần như an8.71.
  - Cách xưng hô: Đức Thế Tôn gọi Nandaka là ông và tự xưng Ta (2.4); Nandaka gọi tự xưng chúng con với Thế Tôn (3.2, 3.3).

