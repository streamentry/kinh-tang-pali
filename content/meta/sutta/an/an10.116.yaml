notes: |-
  CẤU TRÚC BÀI, đọc Pāli rồi kết luận (tên trong bản dựa là sai): bài này là `Ajitasutta`,
  thuộc phẩm `12. Paccorohaṇivagga` — không phải `Dutiya-paṭipadā`. Ba phần: dẫn dắt du sĩ
  Ajita hỏi (1.1–3.4), Đức Phật đáp (4.1–4.3), rồi thân giảng gồm ba khối song song 5 / 6 / 7
  về cách phản biện, lời dẫn quán triệt 8–9, mười cặp tà/chánh ở 10–11 (mười thứ theo đúng
  thứ tự Pāli: tà kiến · tà tư duy · tà ngữ · tà nghiệp · tà mạng · tà tinh tấn · tà niệm · tà
  định · tà trí · tà giải thoát), và lặp lại lời dẫn ở 12.

  TẦNG THAM KHẢO. Tầng Anh Sujato đã ghim **có** tồn tại cho uid này
  (`translation/en/sujato/sutta/an/an10/an10.116_translation-en-sujato.json`), khớp đủ 56 khoá
  Pāli. Đo coverage theo đúng công thức `source/layers.yaml` — mẫu số = segment Pāli có nội dung
  ≥ 40 ký tự, loại khối tham chiếu `:0` — cho **25/25 = 100%**, trên ngưỡng 0.8. Sujato chỉ để
  trống một khoá, `12.5` (`Catutthaṁ.`, 11 ký tự), vốn không nằm trong mẫu số. Vì vậy bài này
  **không** cần lớp lấp `english-project` và không có tệp lấp nào cho `an10.116` — đó là hệ quả
  đo được, không phải thiếu sót. Tầng `vietnamese-current` vắng vì corpus Thích Minh Châu tại
  commit đã ghim chỉ có Pháp Cú (26 tệp), nên không có bản song song Việt để đối chiếu thuật ngữ.
  Vì không có lớp lấp do tôi làm, bản Việt này **được** đối chiếu với một bản Anh độc lập của
  SuttaCentral, khác với trường hợp lớp lấp và bản Việt cùng một người.

  PROVENANCE ĐÃ TỰ KIỂM: mọi tệp đã đọc (56 khoá Pāli và 56 khoá Anh Sujato) khớp **git object
  hash** của commit đang ghim `11c9d708…`. Đo lại trên toàn bộ tầng đã tải về: **10.093/10.093**
  tệp khớp, 0 lệch. Lỗi của chính phép kiểm: lần đầu tôi tưởng trường `files` trong manifest là
  SHA-256 nên báo lệch toàn bộ; manifest ghi **git blob hash**, đổi sang đúng công thức thì khớp
  tuyệt đối. Ghi lại đây vì ai đọc lại cũng dễ phạm lại.

  DÙNG LẠI NGUYÊN VĂN, ĐẾM ĐƯỢC. Quét Pāli trùng **nguyên byte** trên cả năm bộ, rồi so với bản
  Việt đã có: tổng **609** cặp Pāli trùng có bản Việt. Trong đó **20/56** khoá của bài này dùng
  lại y hệt bản Việt đã có, **2** khoá cố tình lệch, **34** khoá không có bản Việt nào ở bài
  khác (phép rỗng — không phải "0 lỗi"). Nguồn tiền lệ gần nhất: `an10.114`
  (Dutiyaadhammasutta) và `an10.173` (Tatiyaadhammasutta) có **17** khoá Pāli trùng nguyên văn
  với bài này, và tôi dùng lại y hệt **16/17** — gồm cả bốn khoá `paccayā…`, cả bốn khoá
  `8.2/9.1/9.2/11.1`, và cả `:0.2`. Khoá duy nhất tôi không theo là `12.4`, xem mục dưới.
  `mn117` (Mahācattārīsaka) là bản song song đã dịch, và nó xác nhận **y hệt** mười cặp tà/chánh
  ở đây: tà kiến · tà tư duy · tà ngữ · tà nghiệp · tà mạng · tà tinh tấn · tà niệm · tà định ·
  tà trí · tà giải thoát.

  BA KHOÁ TÔI CỐ TÌNH LỆCH BẢN ĐÃ CÓ. (1) `12.1`: Pāli là `‘Adhammo ca, bhikkhave, veditabbo
  dhammo ca;` — **adhammo đứng trước**, nên tôi dịch *cần phải thấy biết phi pháp và pháp*,
  khớp `an10.114:13.1`; `an10.173:5.1` dịch ngược lại. Đo cả tầng: *thấy biết phi pháp và pháp*
  **6** so với *thấy biết pháp và phi pháp* **2**. (2) `12.4`: Pāli
  `iti yaṁ taṁ vuttaṁ, idametaṁ paṭicca vuttan”ti.` có **6** khoá trùng nguyên văn trong `an`
  và **3** dạng Việt, mỗi dạng hai khoá. `an10.114:13.4` và `an10.173:5.4` đảo thứ tự hai mệnh đề
  (*Do bởi vậy mà được nói như vậy*), tức đặt *vì sao* lên trước *điều đã nói*; bốn khoá còn lại
  giữ thứ tự Pāli. Tôi theo `an10.113:4.4` và `an10.171:4.4` — giữ thứ tự Pāli **và** giữ `ti`
  mà Pāli có. Chủ từ *Ta* không có trong Pāli, nhưng bốn trong sáu bản đã có đều có, và bản Anh đã
  ghim dùng *I* (*That's what I said*), nên tôi giữ. Người biên tập nên xét lại `an10.114:13.4`
  và `an10.173:5.4`. (3) `4.2`: tôi dùng y hệt `an10.134:1.3` và `an10.178:1.3` (*Dạ vâng, bạch
  Thế Tôn, các tỳ-kheo ấy đáp lời Đức Thế Tôn*); trong `an` có 15 dạng cho Pāli này, không dạng
  nào đa số. Lệch tầng: tôi chọn theo số dữ liệu trong `an10` (2 bản giống hệt) thay vì theo đa
  số toàn tầng (5 bản dùng *các vị tỳ-kheo ấy đáp*). Còn `4.1` là khoá tôi **không** có tiền lệ nào
  khớp: 12 khoá Pāli trùng toàn tầng với 10 dạng Việt khác nhau, trong `an` chỉ ba dạng và không
  dạng nào của tôi. Tôi ghép dạng đa số ở `mn` (3/3: *hãy lắng nghe và chú tâm kỹ*) với gọi danh
  `bhikkhave` mà dạng đó bỏ, và giữ `ti`. Ghi ra đây để người biên tập phán nếu thấy lạ.

  PĀLI TRÙNG NGUYÊN VĂN TRONG CHÍNH BÀI: **7** cặp, **0** cặp lệch. Ba nhóm: `5.2 = 6.2 = 7.2`,
  `5.3 = 6.3 = 7.3`, và `8.2 = 12.2`. Bài không tự mâu thuẫn. Nhóm `5.2/6.2/7.2` và
  `5.3/6.3/7.3` buộc phải dùng **cùng một lời**, và tôi đã dùng y hệt cho cả ba.

  SỐ PĀLI, in phép. `pañcamattāni cittaṭṭhānasatāni` — pañca 5 × sata 100 = **500**, `mattāni`
  là "khoảng", nên dịch *khoảng năm trăm*. `Catutthaṁ.` — catu 4 ⇒ *Thứ tư.*; đo trong `an10`:
  **16** bài giữ *Thứ tư.*, **1** bài dùng *Thứ bốn.*, còn toàn tầng `an` là 104 so với 21, nên
  tôi theo số đông gần nhất. Mười cặp ở `10–11` là mười *đôi* tà/chánh, không phải số đếm riêng;
  tôi đếm lại và giữ đúng thứ tự Pāli ở cả hai vế.

  DẤU LƯỢC. Bài này **không** có `…pe…` và không có `(…)`: đo trên cả 56 khoá, Pāli có **0**
  `…pe…` và **0** `(…)`. Có **7** khoá Pāli kết bằng một `…` trần (`10.2, 10.4, 10.6, 10.8,
  10.10, 10.12, 10.14`) — đó là peyyāla, phần bị lược là hai vế `paccayā…/paccayā…` đã nêu đủ
  ngay trong bài ở `9.4–9.5`. Bản Việt giữ **đúng một** `…` ở cả bảy khoá, không mở rộng, không
  có `… cho đến …`. Tôi thêm dấu `;` sau `…` (`… là pháp …;`) vì phần bị lược vốn là mệnh đề
  kết bằng `;`; đo toàn tầng, `an10.173` có **7/7** khoá Pāli kết `dhammo …` và cả bảy bản Việt
  đều viết `…;`. `10.16` thì Pāli kết `.` chứ không có `…`, nên bản Việt cũng không có `…` — dù
  bản Anh đã ghim viết `Right knowledge is a good principle. … `, tức lớp Anh **đã** bung dấu lược
  ở khoá này; Pāli root là authority nên tôi theo Pāli.

  THUẬT NGỮ, kèm đếm. Bộ *phi pháp / pháp / điều bất lợi / điều lợi* theo đúng `an10.114` và
  `an10.173` (Pāli trùng nguyên văn), và `mn117` cho mười cặp tà/chánh. `adhammo` → *phi pháp*;
  `sabrahmacārī` → *đồng phạm hạnh*, đo trên 243 khoá Pāli có chứa từ trong cả năm bộ thì *đồng
  phạm hạnh* **179**, *đồng tu* **21**, *đồng đạo* **5**; trong riêng `an` là 104 so với 0, nên
  cả hai phạm vi đều chọn *đồng phạm hạnh*. `uccāsaddamahāsaddā`
  → *ồn ào, cao tiếng, lớn tiếng*, y hệt `mn79:26.1` (đo toàn tầng: *ồn ào* **14/14**). `vāda` →
  *lập luận* (đo: 22 so với *lý lẽ* 2). `paribbājako` → *du sĩ*. `sugata` → *Thiện Thệ*
  (đo toàn tầng: 45/88, xa hơn *Thiện Thế* 3 và *Thiện Tôn* 1). `dhāretha` → *nhớ* trong khung
  `dhāretha no tumhe …` của `3.2`, y hệt `mn64:2.1`. `Atha kho` → *Rồi*;
  `bhagavā etadavoca` → *Đức Phật nói* (105/200). `Catutthaṁ` xem mục trên.

  TỪ CHỈ CÓ Ở BÀI NÀY, KHÔNG CÓ TIỀN LỆ VIỆT — đã dò bằng cách quét Pāli toàn bộ tầng đã ghim
  và đếm, không suy đoán. `abhiniggaṇhāti` + `abhinippīḷeti` (*bác bỏ rồi đè nén*), `rañjeti`
  (*làm cho … vui vẻ*), `upāraddha` (*bị bác bỏ*) và `cittaṭṭhāna` (*trạng thái của tâm*) mỗi từ
  chỉ xuất hiện ở **đúng một tệp Pāli**, chính là `an10.116`. `paṇḍitavatthūni` (*điều pháp của
  Người Khéo ấy*) có **hai** tệp Pāli — `an10.116` và `dhp334-359` — nhưng tầng Việt chưa có bản
  dịch Dhammapuda cho đoạn đó, nên vẫn là **0** tiền lệ Việt. Riêng `rañjeti` tôi giữ nghĩa *làm
  vui* như bản Anh đã ghim (*delights*), không suy rộng thành *hoan hỷ*. Vì không có tiền lệ, tôi
  dịch từ Pāli rồi đối chiếu bản Anh, và ghi bất định ở đây thay vì đưa vào thân kinh.

  `paṇḍito` — ĐÂY LÀ CHỖ PHÁN, VÀ TÔI CHỌN CÓ CHỦ ĐÍCH. Ở `2.1` Pāli là `paṇḍito nāma
  sabrahmacārī`: `nāma` là "tên là", nên đây là **biệt danh** của người ấy, và bản Anh đã ghim
  cũng viết hoa thành *Astute*. Tôi dịch nhất quán là *Người Khéo* ở `2.1`, `3.2`, `5.3`, `6.3`,
  `7.3`, để người đọc thấy đây là một người cụ thể chứ không phải lời khen chung. Nhớ rằng nếu
  tách `5.3` khỏi bài thì rất dễ thành *bậc trí lắm chứ* — đó là lý do tôi giữ tên.

  MỘT CHỖ PĀLI TẦNG GỐC CÓ DẤU CỘT THIẾU, TÔI GIỮ NGHĨA VÀ CHÚ Ý: `10.13` là
  `micchāsamādhi, bhikkhave adhammo;` — không có dấu phẩy sau `bhikkhave`, khác chín khoá cùng
  loại. Bản Việt đặt dấu phẩy cho đúng chuẩn tiếng Việt và đúng nghĩa; không sửa tầng Pāli.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được
  JSON hợp lệ, `set(khoá Việt) == set(khoá Pāli)` (56 == 56, 0 thiếu, 0 thừa), thứ tự khoá Việt
  trùng thứ tự Pāli, 0 khoá rỗng, mọi giá trị NFC, không khoảng trắng thừa, dấu lược khớp Pāli
  từng khoá, mẫu nháy `“”` và `‘’` khớp Pāli từng khoá (0 lệch trên 224 phép, tổng `“`=6 `”`=6
  `‘`=4 `’`=4 như Pāli), `(…)` không đứng một mình, Pāli không lọt sang tiếng Việt (trừ `:0.1`
  vốn là tên bộ + số, đúng như `an10.114`), và YAML sạch. Bốn lệnh `npm run validate`,
  `npm test`, `npm run check`, `npm run build` để coordinator chạy.