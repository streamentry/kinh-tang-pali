notes: |-
  Đợt 19, lát l36. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục tra cứu toàn văn. **120 khoá** (0.1–0.3, 1.1–1.2, 2.1–2.11, 3.1–3.4, 4.1–4.5, 5.1–5.5, 6.1–6.9, 7.1–7.8, 8.1–8.14, 9.1–9.8, 10.1–10.14, 11.1–11.5, 12.1–12.8, 13.1–13.6, 14.1–14.11, 15.1–15.4, 16.1–16.3); tập khoá khớp 120/120 với Pāli, đúng thứ tự, không có khoá ngoài tập.

  **Coverage Anh trên Pāli có nội dung: 68/93 = 73,1%** — dưới sàn 0,80. Mẫu số 93 là khoá Pāli ≥ 40 ký tự, bỏ khối :0. Sujato để trống 25 khoá dù Pāli viết đầy đủ: 2.9, 2.10 (khung "bà-la-môn có dòng dõi tốt…" lặp trong lời Doṇa), 5.3, 7.3–7.5, 7.7, 9.3–9.5, 9.7–9.8, 11.3–11.5, 12.2, 13.3 (khung lặp của bốn hạng bà-la-môn sau), 10.3–10.10 (đoạn lặp của hạng *giữ giới hạn*). Phần lớn là khung lặp mà Sujato đã dịch ở lần xuất hiện đầu (5.2, 5.4, 5.5, 6.1–6.2, 8.1–8.10…), nên nghĩa các khoá ấy vẫn được đối chiếu gián tiếp; nhưng cổng đo theo khoá nên coverage chỉ 73,1%. Lớp english-project **chưa có** tệp nào cho bài này, và `reference-gaps.yaml` chưa có mục cho bài; hai việc ấy không thuộc lát này. Vì vậy triangulation hạ xuống 7,5 và bài giữ `draft` kèm blocker. Gợi ý xử lý: lấp 25 khoá bằng lớp english-project (dùng lại đúng câu Anh Sujato đã dịch ở chỗ lặp), rồi chạy `npm run reference:gaps`. Tầng Việt hiện hành phân đoạn vắng với AN tại commit đã ghim (chỉ có Pháp Cú); bản Việt nguyên bài của Hòa thượng Thích Minh Châu được dùng để đối chiếu thuật ngữ nhưng không thay được tầng English trong cổng.

  **Pāli trùng nguyên văn trong chính bài: 20 nhóm, 71 cặp; 71 cặp Việt giống hệt, 0 cặp Việt khác.** Hai cặp Pāli gần trùng nhưng không tính vào số trên: 3.1/15.1 khác nhau chỉ ở dấu phẩy và chính tả (`samihitaṁ`/`samīhitaṁ`, `tyāssume`/`tyassume`) nên dịch cùng một câu, khác nhau duy nhất ở dấu nháy kép mở của 3.1; 3.4/15.4 khác nhau ở dấu nháy kép đóng và dấu phẩy. Trùng với tầng: các công thức *Sammodanīyaṁ…* 183 khoá (đã dịch tương tự), *Tena hi, brāhmaṇa, suṇohi…* (dn4:23.1, dn5:9.7), *ācariyadhanaṁ pariyesati* (sn7.14:13.4 *tìm kiếm học phí cho thầy*), khung phạm trú (an4.190:5.2–5.5, an3.65:42.1–42.4), khung "ly dục … thiền thứ tư" (an3.73:3.2), công thức quy y (xem dưới).

  **Thuật ngữ và tiền lệ đã đếm:**
  - `bho gotama` → *thưa Tôn giả Gotama*: trong 826 khoá Pāli chứa `bho gotama` trên tầng, 598 khoá viết *Tôn giả Gotama* (gồm 219 khoá mở bằng *Thưa Tôn giả Gotama*), 10 khoá viết *ngài Gotama*. Tên bài 0.3 → *Kinh Bà-la-môn Doṇa*, đúng khuôn tên bài kế *Kinh Bà-la-môn Piṅgiyānī* (an5.195); `brāhmaṇa` viết thường *bà-la-môn* theo đa số trong an5 (81 khoá viết thường so với 40 viết hoa) và theo an5.191, an5.193–195 ngay cạnh. `:0.1` → *Kinh Tăng Chi Bộ 5.192* theo đa số trong an5 (203 so với 67 *Aṅguttara Nikāya*).
  - `jiṇṇe vuḍḍhe mahallake addhagate vayoanuppatte` → *già cả, cao tuổi, già nua, đã đi đến chặng cuối của đời*: dùng lại nguyên văn khuôn `an4.22:1.5` (cùng chuỗi Pāli, một bản chính tả khác `vuddhe`). `abhivādeti vā paccuṭṭheti vā āsanena vā nimanteti` → *đảnh lễ … đứng dậy chào đón … mời ngồi* (`an4.22:1.5`, `dn18:17.6`).
  - `na sampannameva` → *không hợp lý* (`an4.22:1.8` *không phải là điều hợp lý*, `an2.38:1.6` *chưa hợp lý*).
  - `ubhato sujāto mātito ca pitito ca, saṁsuddhagahaṇiko yāva sattamā pitāmahayugā akkhitto anupakkuṭṭho jātivādena` → *có dòng dõi tốt … bên mẹ lẫn bên cha, huyết thống thanh tịnh đến bảy đời tổ phụ, không bị chê trách hay chỉ trích về dòng dõi*: 31 khoá trên tầng có `saṁsuddhagahaṇiko` dùng khuôn này (dn4:5.6, dn4:13.5, dn4:20.8…). Ở đây Pāli tách `ubhato sujāto—` (một khoá) khỏi `mātito ca pitito ca…` (khoá sau) nên tôi dịch *từ cả hai phía—* rồi *bên mẹ lẫn bên cha…*.
  - `ajjhāyako mantadharo … lokāyatamahāpurisalakkhaṇesu anavayo` → *tụng đọc, ghi nhớ thánh chú, thông thạo ba Veda … thành thạo thế luận và các tướng của bậc đại nhân*: dùng lại khuôn `dn4:5.10`, `dn4:13.6`, `dn5:6.10` (21 khoá có `tiṇṇaṁ vedānaṁ`, 49 khoá có `pāragū`: *thông thạo* 23, *vượt qua* 10).
  - `isayo mantānaṁ kattāro mantānaṁ pavattāro … tadanugāyanti…` → khuôn quan hệ của `dn3:2.9.3`, `dn13:13.1`. `mantā` → *thánh chú* (đồng nhất với `dn4:5.10`); `mantapadaṁ` → *bài thánh chú cổ xưa*.
  - `brahmasama`/`devasama` → *ngang hàng Phạm thiên / chư thiên* (`snp3.5:26.5` *ngang hàng Phạm thiên*); Hòa thượng Thích Minh Châu *đồng đẳng*. `mariyāda` → *giới hạn* (`mn111:4.5` *vượt ngoài giới hạn*; `dn27:18.28` dùng *ranh giới* cho nghĩa vật lý, ở đây là giới hạn đạo lệ nên chọn *giới hạn* theo Hòa thượng Thích Minh Châu); `sambhinnamariyāda` → *phá vỡ giới hạn* (0 tiền lệ trên tầng; Sujato *crosses the line*, Hòa thượng Thích Minh Châu *vượt lên giới hạn*). `brāhmaṇacaṇḍāla` → *bà-la-môn Chiên-đà-la* (0 tiền lệ cho từ ghép; `caṇḍāla` một mình là *Chiên-đà-la* ở 3 khoá `mn96:16.4`, `16.7`, `16.10`, còn 5 khoá giữ nguyên *caṇḍāla*, trong đó `dn1:1.13.2` và `dn2:48.2` là tên màn trình diễn, nghĩa khác). Sujato dịch *corpse-worker*, Hòa thượng Thích Minh Châu *Bà-la-môn bị vứt bỏ*.
  - Danh sách người nữ (8.3, 10.3, 12.4, 14.2): `khattiyā` → *Sát-đế-lợi* (423 khoá, so với *Sát-đế-lỵ* 3), `vessa`/`sudda` → *Vessa*/*Sudda* (4 khoá cùng cặp trong dn, so với *Phệ-xá*/*Thủ-đà-la* 3 khoá; mn79:10.6 dùng *Phệ-sa*/*Thủ-đà*; cả hai đều có tiền lệ, tôi chọn cặp đang dùng ở dn3, dn13), `caṇḍāla` → *Chiên-đà-la* (`mn96:16.4`), `nesāda` → *thợ săn*, `vena` → *thợ đan tre*, `rathakāra` → *thợ làm xe* (`mn96:16.4`), `pukkusa` → *đổ rác* (`mn96:16.4` *người đổ rác*; Sujato *scavengers*).
  - Sáu nghề (6.2, 7.7, 9.7, 12.2, 13.6): *làm nông, buôn bán, chăn nuôi, bắn cung, làm việc cho nhà nước, một nghề nào khác* — dùng lại đúng khuôn `mn13:8.3`, `mn14:7.3`, `an8.76:1.6` (3 khoá).
  - `ācariyadhana` → *học phí cho thầy* (`sn7.14:13.4`; `mn52:15.6` dùng *thù lao* nhưng trong ngữ cảnh khác).
  - `utuni`/`anutuni` → *đang trong thời kỳ thụ thai* / *ngoài thời kỳ thụ thai* (đúng `an5.191:2.1`–`2.2` ngay bài trước trong cùng phẩm).
  - `gacchati` (dùng cho giao hợp) → *đi lại với* (đúng `an5.191:1.3`, `an5.191:2.1`).
  - Công thức *kesamassuṁ ohāretvā kāsāyāni vatthāni acchādetvā agārasmā anagāriyaṁ pabbajati* → *cạo bỏ râu tóc, đắp áo cà-sa, xuất gia từ bỏ gia đình, sống đời không gia đình*: trong 93 khoá của công thức, *cạo bỏ râu tóc* 61 khoá, *cạo bỏ tóc râu* 12, *cạo râu tóc* 9 (đa số *cạo bỏ râu tóc*); `dn2` và `dn10` dùng *đắp áo cà-sa*, còn `dn14` và `dn4:6.10` dùng *khoác áo cà-sa* — tôi theo dạng *đắp*.
  - Khuôn tâm từ lan tỏa bốn phương (6.4, 6.7): dùng lại nguyên văn khuôn `an4.190:5.2`–`5.5` (`mettāsahagatena…` → *an trú với tâm từ lan tỏa một phương, rồi phương thứ hai … không thù hận, không ác ý, lan tỏa khắp toàn thế giới*), kể cả `Karuṇā …pe…` → *Với tâm bi …* (`an4.190:5.3`) và `muditā …` → *với tâm hỷ …* (`an4.190:5.4`, `an4.126:2.2`, `an3.66:46.3`).
  - `cattāro brahmavihāre bhāvetvā` → *bốn Phạm trú*: đo trên tầng chỉ có 5 khoá Pāli chứa `brahmavihāra`, 1 khoá dùng *Phạm trú* (`dn17:2.13.8`) và 4 khoá dùng *vô lượng tâm* (`mn83:6.2`, `9.7`, `11.5`, `17-19.7`); hai lựa chọn có tiền lệ gần ngang nhau, tôi giữ *Phạm trú* để sát `brahmavihāra` (nhà của Phạm thiên) và ngữ cảnh *brahmasama*/*brahmaloka* của bài. `kāyassa bhedā paraṁ maraṇā sugatiṁ saggaṁ lokaṁ` → *khi thân hoại mạng chung thì sinh vào thiện thú, cõi trời* (71 khoá `sugatiṁ saggaṁ lokaṁ upapajjati`: *thiện thú/thiện xứ/cảnh giới tốt, cõi trời*); ở 6.8 `sugatiṁ brahmalokaṁ` → *thiện thú, cõi Phạm thiên* (0 tiền lệ cho tổ hợp này).
  - 8.12: `vivicceva kāmehi …pe… catutthaṁ jhānaṁ upasampajja viharati` → *hoàn toàn ly dục … chứng và an trú thiền thứ tư* (đúng khuôn `an3.73:3.2`: một dấu `…` thay cho `…pe…`, khác khuôn `an4.246:4.2`/`an4.194:4.2` đọc cả bốn thiền).
  - `So ime cattāro jhāne bhāvetvā` → *Vị ấy tu tập bốn thiền này* (*bốn thiền* 33 khoá trên tầng, *bốn tầng thiền* 12).
  - 16.2 công thức quy y: Pāli y hệt `an5.193:13.1`, `an2.17:3.1`; *Thật tuyệt vời thay, thưa Tôn giả Gotama! …* theo hai khoá an ấy. Phần sau *ghi nhận con là nam cư sĩ đã quy y từ hôm nay cho đến trọn đời* theo đa số: 36 khoá công thức `upāsakaṁ maṁ bhavaṁ gotamo dhāretu…` trên tầng, 29 khoá dùng *con*, 3 khoá dùng *tôi*; dạng *ghi nhận con là nam cư sĩ …* là dạng `an3.54:8.2`, `an3.55:5.2`, `an3.56:5.2`, `an3.58:14.2`, `an3.59:11.2` (khác `an5.193:13.1` *nhận con làm cư sĩ*). Trong thân bài Doṇa xưng *tôi*/*chúng tôi* (theo `an3.58:3.3`, `mn99:23.1`), còn lời quy y xưng *con*: hai cách xưng này cùng tồn tại cho một người nói trong an3.58 nên không phải lỗi nhất quán.

  **Số Pāli:** `aṭṭhacattālīsa` = 8 + 40 = **48** (5.4, 5.5, 7.4, 7.5, 9.4, 9.5, 11.4, 11.5, 13.4, 13.5; tiền lệ `Aṭṭhatālīsa` = 48 ở `tha-ap302:8.5`, `cattālīsa` = 40); `yāva sattamā pitāmahayugā` = **bảy** đời tổ phụ; `tiṇṇaṁ vedānaṁ` = **ba** Veda; `itihāsapañcamānaṁ` = *thứ năm* (truyền thống lịch sử là môn thứ năm); `pañca brāhmaṇe` = **năm** hạng (3.2, 15.2), `pañcamaṁ` = thứ năm (3.3, 15.3); `ekaṁ disaṁ … dutiyaṁ … tatiyaṁ … catutthaṁ` = một, hai, ba, bốn phương; `cattāro brahmavihāre` = **bốn** Phạm trú; `cattāro jhāne`/`catutthaṁ jhānaṁ` = **bốn** thiền / thiền **thứ tư**; mười ẩn sĩ ở 3.1 và 15.1 = Aṭṭhaka, Vāmaka, Vāmadeva, Vessāmitta, Yamadaggi, Aṅgīrasa, Bhāradvāja, Vāseṭṭha, Kassapa, Bhagu (10/10); tám hạng người nữ ở 8.3, 10.3, 12.4, 14.2 (khattiyī, vessī, suddī, caṇḍālī, nesādī, venī, rathakārī, pukkusī = 8/8); `Dutiyaṁ` = *Thứ hai*. Không có số lớn.

  **Bất định có nghĩa đáng kể (không thêm vào thân kinh):**
  1. `8.5, 10.5 atimīḷhajo` → *sinh ra trong sự ô uế quá mức*: `mīḷha` nghĩa gốc là phân/ô uế, 0 tiền lệ cho từ ghép này trên tầng (một khoá `an5.196:10.1` dịch `mīḷha` là *bẩn thỉu*). Sujato *born in too much filth*, Hòa thượng Thích Minh Châu *hoàn toàn bị ô uế*. Giữ theo Pāli, không giải thích ô uế là gì.
  2. `8.8, 10.8 asucipaṭipīḷito` → *kẻ bị bất tịnh chèn ép*: `paṭipīḷita` là *bị chèn ép, bị áp bức*; Pāli không nói *bất tịnh* là gì. Sujato dịch cụ thể hơn (*drink back the semen*), Hòa thượng Thích Minh Châu *bú sữa không được thanh tịnh*; cách đọc cụ thể ấy theo chú giải hơn là theo chữ Pāli nên không đưa vào thân kinh.
  3. `8.11, 10.11, methunaṁ uppādetvā` → *sinh con nhờ giao hợp*: Pāli đứng riêng chỉ có *tạo ra sự giao hợp*; *con* được suy từ `pajatthāva` (8.10) và `puttassādaṁ` (10.11). Sujato *ensured his progeny through sex*, Hòa thượng Thích Minh Châu *từ dâm dục … sinh con rồi*. Đây là cách đọc theo ngữ cảnh, không bịa thêm ý.
  4. `13.6 kevalampi bhikkhācariyāya` → *và cả chỉ riêng việc khất thực*: Pāli là `kevalampi` (khẳng định, có `pi`), cùng chuỗi `-pi` của các nghề đứng trước. Sujato dịch phủ định (*not solely by living on alms*). Tôi giữ nghĩa khẳng định theo Pāli; người biên tập nên đọc lại 13.5–13.6 nếu muốn theo hướng Sujato.
  5. `3.1/15.1 tyāssume pañca brāhmaṇe paññāpenti`: đọc là mệnh đề chính của câu quan hệ bắt đầu ở `Ye kho te…` (Sujato đọc như vậy), khác Hòa thượng Thích Minh Châu dịch 3.1 thành một câu hỏi xác nhận. `paññāpenti` → *trình bày* (tầng dùng *chỉ dạy*, *chủ trương* cho `paññāpenti` ở `dn13:10.2`, `an3.93:1.1`; ở đây không phải chủ trương hay học thuyết nên chọn *trình bày*).
  6. `14.10`: Pāli có dấu nháy đơn đóng `’` nhưng nháy đơn mở chỉ ở 14.8, rồi 14.9 không có dấu nào; tôi giữ đúng một `’` ở 14.10 (sau *Kiếm sống bằng mọi nghề*), như Pāli. Tương tự Pāli 5.1 mở nháy kép `“` và không có dấu đóng ở 15.4; 15.4 và 16.1 không có dấu nào; 16.2 chỉ có `”` đóng.
  7. `2.6 Tvampi no, doṇa, brāhmaṇo paṭijānāsī`: `no` đọc là tiểu từ nghi vấn (Sujato *do you too claim*), nên dịch *ông cũng tự nhận là bà-la-môn sao?*.
  8. `2.9 mameva taṁ … sammā vadamāno vadeyya` → *người nói một cách chân chánh sẽ nói điều ấy về chính tôi* (Sujato *it's me*; Hòa thượng Thích Minh Châu *nói về tôi, nói một cách chân chánh là nói như vầy*).
  9. `14.6 bhavaṁ` giữa các bà-la-môn → *ông* (không phải *Tôn giả*, vì đây là lời các bà-la-môn nói với một bà-la-môn khác, không phải lời hướng về Đức Phật).

  **Dấu lược và ngoặc.** Dấu lược `…` khớp với Pāli: 6.5 `…pe…` → một `…`; 6.6 `…` trần → một `…`; 8.12 `…pe…` → một `…`; 16.2 `…pe…` → một `…`; 116 khoá còn lại không có dấu lược. Không có `(…)` ở Pāli nên Việt không có. Số nháy `“ ” ‘ ’` mỗi khoá bằng Pāli: 0 lệch / 120 khoá.

  **Lỗi bản nháp đã bắt:** không có lỗi nào trong tệp ghi sau khi in cặp Pāli↔Việt đọc đối kháng và chạy các phép đo. Một điều chỉnh trước khi ghi: 13.6 ban đầu cân nhắc dịch phủ định theo Sujato, nhưng Pāli `kevalampi` là khẳng định nên giữ khẳng định (xem bất định 4). Một lỗi của chính phép đo: lần đếm dấu lược đầu tính `…pe…` thành hai ký tự `…` nên báo lệch giả ở 6.5, 8.12, 16.2; khi tính `…pe…` là một dấu lược theo quy ước tầng thì 0 lệch.

