  **Coverage tầng Anh đo được: 38/38 khoá Pāli có nội dung = 1,0000.** Công thức `source/layers.yaml` (`substantivePaliMinChars: 40`, `excludeReferenceBlock: true`, `floor: 0.8`). Tầng `english-sujato` phủ **38/38** khoá mẫu số; trên toàn 55 khoá chỉ 1 khoá trống (`9.2` `Paṭhamaṁ.`) và khoá đó không vào mẫu số. `englishPath = sutta/an/an8/an8.61_translation-en-sujato.json` có trong `source/upstream-manifest.json` tại commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`, và git-object hash của tệp đã tải **khớp** giá trị manifest (2f6ccef4…831b); tệp Pāli `an/an8/an8.61_root-pli-ms.json` cũng khớp (f15f29d8…bf9c3). Không có `english-project` cho uid này. Tầng `vietnamese-current` tại commit đã ghim gồm **26** tệp, toàn bộ nằm dưới `sutta/kn/dhp` ⇒ **không** có bản Hòa thượng Thích Minh Châu để đối chiếu ở `an`; đây là giới hạn của snapshot upstream, không phải thiếu sót của kho.

  **Độ nhạy của cổng coverage — mẫu số 38.** Cần mất **8** khoá có nội dung thì coverage mới xuống 30/38 = 0,7895, tức dưới ngưỡng 0,8 ⇒ `review`/`published` bị chặn. Mất 7 khoá thì còn 31/38 = 0,8158, vẫn trên ngưỡng. Ngưỡng nằm giữa lưới **31** và **30**, tức chỉ cần **một** khoá Pāli có nội dung rút xuống dưới 40 ký tự là cổng đổi trạng thái.

  **`translationTitle` — đo hai phạm vi, hai kết quả khác nhau, ghi cả hai.**
  Phạm vi nghiêm (title bằng đúng chuỗi Pāli `:0.3` sau khi bỏ dấu và ký tự không chữ cái): trong `an` có **0** tệp giữ nguyên Pāli và **1.190** tệp dịch nghĩa, **465** tệp không đo được (`:0.3` là `~` ở bài peyyāla, hoặc không có tệp Pāli tương ứng). Cả năm Nikāya: **3** giữ Pāli (toàn bộ rơi vào `kn`) và **4.564** dịch nghĩa. Phạm vi hình thức (title vẫn mang dấu Pāli āīūṇṭḍñṃḥḷ): `an` là **135** giữ dấu Pāli và **1.520** không có. ⇒ Quy ước *giữ nguyên Pāli* ở `an` đã gần như tắt; tôi dịch nghĩa tiêu đề.
  **`Icchāsutta` → *Kinh Ham Muốn*.** Hai tiền lệ `:0.3` trùng byte: an8.77 = *Kinh Ham Muốn*, sn1.69 = *Kinh Ước Muốn* — hoà 1–1 ở phạm vi byte. Đếm rộng hơn (cả `:0.3` lẫn `translationTitle` toàn tầng) thì *Kinh Ham Muốn* **6** và *Kinh Ước Muốn* **1**. Tôi theo *Kinh Ham Muốn* để khớp thân bài và bài anh em cùng đợt. **Cần người điều phối phán:** nếu bảng tên chốt *Ước Muốn* thì phải sửa cả an8.77 lẫn sn1.69 cùng lúc, nếu không hai bài sẽ tự mâu thuẫn.

  **Cấu trúc bài là lưới 2×2×2, và tôi dựng lại từng khối từ cờ đọc trong Pāli chứ không theo trí nhớ.** Tám khối là tám tổ hợp của ba phép: có cố gắng (`na uṭṭhahati` / `uṭṭhahati`) · có được của cải (`lābho uppajjati` / `nuppajjati`) · hậu quả xấu có xảy ra không. Thứ tự là: 1 (cố gắng · không được · sầu) · 2 (cố gắng · được · say) · 3 (không cố gắng · không được · sầu) · 4 (không cố gắng · được · say) · 5 (cố gắng · không được · không sầu) · 6 (cố gắng · được · không say) · 7 (không cố gắng · không được · không sầu) · 8 (không cố gắng · được · không say). Cả tám khối đã kiểm bằng phép đọc cờ từ Pāli và so lại từng vế của bản Việt, kết quả 8/8 khớp.

  **22/55 khoá có Pāli trùng nguyên văn ở tầng (ngoài chính bài này); 19 khoá dùng lại nguyên văn bản Việt đã có.** Trong đó **9** khoá trùng byte **cả Pāli lẫn bản Việt** với an8.77 (bài cùng đợt, cùng công thức tám cá nhân về ham muốn): `0.3` · `1.2` · `1.6` · `2.3` · `2.4` · `4.3` · `5.4` · `6.3` · `7.3`. **34** khoá còn lại trùng Pāli sau khi bỏ dấu phẩy; trong đó **30** khoá dùng lại nguyên văn bản Việt đã có. Ba khoá còn lại trong 22 là nơi tôi **cố ý chọn khác**, ghi ở mục thuật ngữ bên dưới.

  **7 nhóm Pāli trùng nguyên văn TRONG CHÍNH bài, 61 cặp đã dò, 0 cặp bản Việt khác.** Nhóm lớn nhất là `Idha pana, bhikkhave, …` trùng **7** lần và `Ayaṁ vuccati, bhikkhave:` trùng **8** lần — tức bản dịch tự nhất quán trong toàn bài.

  **Số Pāli: bài này không có số lớn nào.** Toàn bộ số ẩn trong Pāli chỉ có `Aṭṭhime` (`1.1`) · `aṭṭha` (`1.2`, `9.1`) · `Paṭhamaṁ` (`9.2`); không có `sahassa`, `sata`, `navuti`, `tālīsa`, `kappa` hay `koṭi`. Phép tính: `aṭṭha` = 8, đối chiếu bằng `Katame aṭṭha?` → *Thế nào là tám?* (13/30 tiền lệ cùng Pāli, 20 khoá trong tầng viết đúng câu này); `Paṭhamaṁ` = thứ nhất (283/285 tiền lệ cùng Pāli viết *Thứ nhất.*, 2 viết *Bài thứ nhất.*). Hai số hiệu trong khối `:0` — `Aṅguttara Nikāya 8.61` và `7. Bhūmicālavagga` — chép nguyên văn từ Pāli, không phải số cần dịch. Phép đo số Pāli có hiệu chuẩn in **9/9 OK**, nhưng ở bài này **mẫu số bằng 0** vì không từ khoá nào trong bảng kiểm xuất hiện ⇒ phép đó ở đây **không đo được gì**; hai số ở trên là tôi tự tính từ Pāli.

  **Thuật ngữ, kèm số đếm (đếm trên 5.030 tệp Việt đã dịch, đã loại chính tệp này).**
  - `bhikkhave` → *này các tỳ-kheo*: **9.105** lần; *này các vị tỳ-kheo* **0**. Trong đó `Idha, bhikkhave,` → *Ở đây, này các tỳ-kheo,* **1.261** lần (dùng cho `1.3`), `Idha pana, bhikkhave,` → *Lại nữa, này các tỳ-kheo,* **299** lần (dùng cho 7 khoá `2.1`–`8.1`); *Tiếp nữa, này các tỳ-kheo* = **0**.
  - **Ghi nhận lệch với an8.77 cần người điều phối phán:** an8.77 dùng *Tiếp nữa, này các hiền giả,* cho `Idha panāvuso` (16 lần toàn tầng cho *Tiếp nữa,*, 1.007 cho *Lại nữa,*). Ở đây xưng hô là `bhikkhave` chứ không phải `āvuso`, và đúng cấu trúc `Idha pana + bhikkhave` thì đa số tầng là *Lại nữa* (299) chứ không phải *Tiếp nữa* (0), nên tôi theo số đo. Hai bài anh em cùng công thức sẽ lệch một chữ; nếu người biên tập muốn thống nhất thì nên chốt một dạng cho cả hai.
  - `pavivitta` → *sống viễn ly*: **72** lần. `nirāyattavutta` → *sống không lệ thuộc ai*: chỉ **8** lần, tất cả ở an8.77 — **tiền lệ rất mỏng**; từ này đi cặp với `pavivitta` mà lại dịch theo hai tiếng Việt khác nhau, xin người rà soát chú ý (Sujato dịch *living independently*).
  - `uṭṭhahati, ghaṭati, vāyamati` → *nỗ lực, gắng sức, tinh tấn*: **14** lần. Dạng phủ định `So na uṭṭhahati, na ghaṭati, na vāyamati lābhāya.` có **4** tiền lệ EXACT (an8.77 `4.2`, `5.2`, `8.2`, `9.2`) và **4/4** viết *không nỗ lực, gắng sức, tinh tấn* — dùng chung một "không". Tôi theo 4/4 cho `3.2`, `4.2`, `7.2`, `8.2`. Ngược lại, ở phạm vi rộng hơn (278 khoá Pāli có ba mệnh đề phủ định liên tiếp bất kỳ) đa số tầng **lặp** "không" (**173** lặp 3+ so với **62** dùng chung) — nhưng số đa số đó đến từ bộ ba hành động *khác nhau* như `socati/kilamati/paridevati` và `majjati/pamajjati/pamādamāpajjati`, không phải bộ ba gần nghĩa `uṭṭhahati/ghaṭati/vāyamati`. Phân biệt này có chủ ý: gần nghĩa thì dùng chung, khác nhau thì lặp.
  - `majjati, pamajjati, pamādamāpajjati` → *mê say, tham đắm và buông lung*; dạng phủ định → *không mê say, không tham đắm và không buông lung* (tiền lệ ở an8.77 `7.4`, `9.4` cùng mn29 và 9 dạng phủ định).
  - `socati kilamati paridevati, urattāḷiṁ kandati, sammohaṁ āpajjati` → *sầu não, mệt mỏi, than khóc, đấm ngực, và rơi vào hoang mang*; dạng phủ định lặp đủ *không sầu não, không mệt mỏi, không than khóc, không đấm ngực, không rơi vào hoang mang* (tiền lệ 4 lần, an4.184 và an8.77 `6.4`).
  - `icchā` → *ham muốn*: **712** lần toàn tầng nhưng phần lớn đến từ `chanda`/`kāmacchanda`; riêng `icchā` thì *ham muốn* là dạng đã dùng. `lābha` → *của cải* (**346**) chứ không phải *vật chất* (**96**). `lābhāya` giữ nguyên *để có của cải* để đọc không mơ hồ với *ham muốn*.
  - `saddhamma` → *chánh pháp* (**174**; *giới luật* **229** là cách khác trong kho). `saddhamme hi` ở bài khác có thể là *giới luật*, nhưng ở đây `cuto saddhammā` / `accuto saddhammā` là *rơi khỏi chánh pháp* / *chưa rơi khỏi chánh pháp* — Sujato cũng dịch *true teaching*.
  - `Ayaṁ vuccati, bhikkhave:` → *Này các tỳ-kheo, điều này được gọi là:*. Sáu tiền lệ cùng Pāli chia làm ba: *Người này được gọi là:* **4** (bỏ mất xưng hô `bhikkhave` có thật trong Pāli) · *Này các tỳ-kheo, điều này được gọi là:* **1** (trùng byte) · *Này các tỳ-kheo, đây được gọi là* **1**. Tôi theo dạng trùng byte vì giữ xưng hô.
  - `7. Bhūmicālavagga` → *7. Phẩm Đất Nền*: **7** tiền lệ trong `an` (an8.63–69), đã xác nhận từng bài bằng cách đối chiếu Pāli `:0.2` với bản Việt. Sujato dịch *Earthquakes* — không dùng, vì phẩm đó đã có tên Việt quy ước trong chính bộ.

  **Bản dịch này không phải là bản lấp `english-project`, nên `triangulation` đọc được như thật.** Toàn bộ 38 khoá mẫu số đều có chữ trong tầng Anh đã ghim.

  **Tầng Anh đã ghim ở bài này: bốn sai sót đo được, không sửa được (nằm ở tầng tham khảo, không phải lớp của tôi).**
  - **Bỏ nháy đơn ở 8 cụm định danh.** Pāli đánh dấu `‘…’` cho cả tám câu định nghĩa (`1.8`, `2.6`, `3.6`, `4.6`, `5.6`, `6.6`, `7.6`, `8.6`); bản Anh không có cặp nháy nào ở cả tám khoá. Ngoặc kép ngoài thì khớp (`“` ở `1.1`, `”` ở `9.1`).
  - **Nén năm phủ định thành một, ở 4 khoá.** `5.4` và `7.4` có **năm** mệnh đề phủ định (`na socati na kilamati na paridevati na urattāḷiṁ kandati na sammohaṁ āpajjati`) nhưng bản Anh chỉ còn một *don’t*; `6.4` và `8.4` có **ba** (`na majjati na pamajjati na pamādamāpajjati`) cũng còn một. Bản Việt giữ đủ từng phủ định.
  - **Dịch lệch quan hệ từ, ở cả 8 khoá.** Pāli `So tena lābhena …` / `So tena alābhena …` là khung công cụ (*nhờ ấy / nhờ sự không-có*), bản Anh đổi thành mệnh đề quan hệ *because …* hoặc *regarding those material things*; riêng `1.6`, `3.4`, `5.4`, `7.4` còn thêm vế *because they don’t get those material things* mà Pāli không có. Bản Việt dịch *Vì có của cải* / *Vì không có của cải* như lớp `vietnamese-project` đã làm ở an8.77.
  - **Đổi danh sách tính chất thành mốc thời gian, ở 8 cụm định danh.** Pāli liệt kê thuộc tính của người (`na ca lābhī, socī ca paridevī ca, cuto ca saddhammā`), bản Anh kể như một dòng thời gian (*But when they do not acquire material things, they sorrow and lament*).
  - **Không phát hiện, và đã kiểm:** mở rộng dấu lược (Pāli 0 `…`, bản Anh 0 `…`) · tự thêm ngoặc kép (0 khoá) · đảo thứ tự trong danh sách (`sorrow` → `wail` → `lament` đúng thứ tự ở cả 4 khoá có `kilamati`) · sai cực tính vế *lãnh được của cải* (8/8 khoá đúng).

  **Dấu lược: Pāli 0 `…pe…` ↔ Việt 0 `…`; Pāli 0 `(…)` ↔ Việt 0.** Bài này không lược gì. Nhặc kép: mở `“` ở `1.1`, đóng `”ti` ở `9.1`, tám cụm định danh dùng nháy đơn `‘…’` đúng như Pāli. Kiểm theo từng khoá: **0 lệch / 55** (18 dấu nháy ở cả hai phía).

