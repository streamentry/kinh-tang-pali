notes: |-
  TẦNG THAM KHẢO VÀ COVERAGE ENGLISH. Tầng english-sujato có tại commit đã ghim, và bản Sujato phủ 26/26 khoá Pāli có nội dung (từ 40 ký tự trở lên, bỏ khối :0), tức 1,00, trên ngưỡng 0,80 của source/layers.yaml. Hai khoá sát ngưỡng là 4.1 (38 ký tự, không tính) và 4.2 (đúng 40 ký tự, tính); cả hai đều được Sujato dịch. Không có lớp english-project cho bài này nên không có khoá nào do dự án lấp: mọi đối chiếu English ở đây đều là Sujato độc lập, kể cả chuỗi 3.9–3.12 (dấu lược). Có thêm bài kệ song song thag15.2 (Udāyī, Sujato) trùng gần như nguyên văn với 5.1–19.4 và bản nguyên bài của Hòa thượng Thích Minh Châu (không phân đoạn, đã đọc, không vào store theo khoá). Không cần mục trong content/meta/reference-gaps.yaml vì coverage đạt ngưỡng; có mục cũng không cứu được published.

  TIỀN LỆ ĐÃ ĐO. Đã dò các nhóm Pāli trùng với tầng: 1.4 và 2.3 trùng nguyên văn Pāli với mn26:3.2 và mn26:3.6 nên dùng lại nguyên văn bản Việt của mn26; 2.6 trùng Pāli với mn26:3.9 nhưng bản mn26 bỏ mất vế Pubbakoṭṭhake (ở cổng phía đông) nên tôi thêm vế đó, đây là chỉnh có chủ ý chứ không phải khác biệt tùy ý (1 cặp khác, 2 cặp giống). 1.5 và 2.4 trùng Pāli với mn26:3.3 nhưng bản mn26 viết Thưa vâng, ... đáp; trong tầng an công thức này đa số là Dạ vâng, bạch Thế Tôn, ... vâng lệnh Đức Thế Tôn (15 khoá so với 3 khoá Thưa vâng ... đáp), nên theo an. Trong chính bài chỉ có một cặp Pāli trùng nguyên văn (1.5 và 2.4) và hai bản Việt giống nhau; 3.8 và 3.14 chỉ khác dấu phẩy Pāli nên dịch giống nhau; 3.15 và 4.3 là cùng một câu nhưng 4.3 không có nháy kép bao ngoài (đúng theo Pāli) và khác chữ hoa đầu câu. Nháy đơn và nháy kép khớp Pāli ở cả 98 khoá. Pāli có bốn khoá chứa dấu lược (3.9, 3.10, 3.11, 3.12), bản Việt giữ đúng một dấu lược cho mỗi chỗ và không bung thành văn; Pāli không có dấu lược trần hay dấu lược bao ngoặc. Dấu lược cân bằng Pāli từng khoá. Công thức bốn cõi sadevake loke... sadevamanussāya dịch theo dn14, dn16, dn17, mn123: thế giới cùng chư thiên, Māra và Phạm thiên, quần chúng cùng sa-môn và bà-la-môn, chư thiên và loài người. Pubbakoṭṭhaka dịch cổng phía đông theo mn26 và sn48.44 (Kinh Ở Cổng Phía Đông).

  THUẬT NGỮ CHÍNH, VÀ ĐIỂM KHÓ NHẤT. (1) NĀGA. Đây là điểm quyết định của bài. Pāli nāga vừa là con voi (hatthi/nāga), vừa là tên gọi một sinh vật hay vật to lớn bất kỳ (ngựa, bò, rắn, cây, người), vừa là danh hiệu của bậc không làm āgu. Tầng đã dịch nāga là voi khi nghĩa voi rõ (mn125, an5.139, an5.140, an9.40; sn20.9 Kinh Voi Đực), là rồng/rắn khi nghĩa rắn rõ (sn29.2, sn20.12, các bài sn46/47/48 bài Balaṁ bījañca nāgo ca), và Đại Long cho mahānāga như danh hiệu (sn22.76, thag4.6, tha-ap288 và tha-ap111). Hòa thượng Thích Minh Châu dịch con voi cho mọi chỗ, kể cả khi người ta thấy con ngựa, con rắn, cái cây mà nói con voi, nghe vô lý; Sujato dịch giant. Tôi giữ nguyên nāga (không dịch) khi nó là tên gọi chung, là điều Đức Thế Tôn định nghĩa lại (3.6, 3.8, 3.14, 3.15, 4.3 và toàn bộ kệ 8.1 đến 20.3), vì nếu dịch voi thì câu hỏi của Tôn giả Udāyī (chỉ voi, hay vật to lớn khác cũng được gọi như thế) và câu trả lời mất nghĩa, còn nếu dịch giant hay Đại Long thì thêm một nghĩa mà Pāli không nói; và dịch voi khi nói về con voi thật của vua Pasenadi (3.1, 3.2, 3.3, và 3.5, 3.7 nơi Pāli dùng hatthi). Hệ quả: trong 3.3 người ta nói con voi của vua (Pāli rañño nāgo) trong khi 3.6 hỏi về chữ nāga; người đọc thấy lại chữ nāga ở 3.6 và nối được. Tiêu đề bài giữ Kinh Nāga cho cùng lý do. Mối liên hệ chữ nghĩa nāga với việc không làm āgu (na + āgu) là cách giải thích truyền thống, Pāli trong bài không nêu thành lời và tiếng Việt cũng không giữ được; không đưa vào thân kinh. (2) āgu dịch điều tội lỗi (āguṁ na karoti: không làm điều tội lỗi nào); Sujato dịch monstrous (nghĩa đen là quái gở), Hòa thượng Thích Minh Châu dịch tội phạm; sn4.25 (Āguṁ nu gāmasmimakāsi kiñci) tầng dịch lỗi lầm. Tôi chọn tội lỗi vì nó vừa đúng nghĩa vừa tự nhiên ở vị trí đối tượng của làm. (3) Các cụm đã chốt theo tầng: soraccaṁ ôn hòa (dn33:1.9.17; sn7.11:5.4 dùng nhu hòa), avihiṁsā không hại (dn33:1.9.19), tapo khổ hạnh (sn1.58, sn1.76, snp2.4), vīmaṁsā quán xét (dn33:1.11.18), anapekkho không luyến tiếc (dn25:13.16), anavajja không đáng chê (kp5:7.3; an4.27 dịch không bị lỗi), sannidhi chứa trữ (dn1, dn2), Himavā viết Himavān (mn129:9.3, mn129:47.3), parinibbissati nhập Niết-bàn (các dạng parinibbāyi-/parinibbissa- trong tầng được dịch Niết-bàn 8 khoá, nhập Niết-bàn 5 khoá, diệt độ 7 khoá chủ yếu nói về Đức Thế Tôn, đo sơ bộ bằng so khớp chuỗi; chọn nhập Niết-bàn vì ở đây nói về bậc vô lậu nói chung). Đức Thế Tôn cho bhagavā (đa số trong an6), bạch Thế Tôn cho bhante của Tôn giả Udāyī nói với Đức Thế Tôn. Seta giữ nguyên như tên riêng (Seta nghĩa là trắng; Pāli không nói con voi trắng).

  BẤT ĐỊNH, GHI RÕ. (a) Dhammakucchisamātapo (11.3): hợp từ khó. Sujato dịch the sacred hearth of the Dhamma; bài song song thag15.2:7.3 đọc Dhammakucchisamāvāso (ở đó Sujato dịch giống y); Hòa thượng Thích Minh Châu dịch bụng là chỗ chứa pháp. Tôi theo Sujato (lò lửa của Pháp) nhưng không dám khẳng định nghĩa chính xác của samātapo; người biên tập có thể đổi. Đây là bất định thật nhưng không ảnh hưởng giáo lý chính của bài. (b) Vanā nibbanamāgataṁ (7.2): chơi chữ vana (rừng, đồng thời nghĩa bóng là tham ái) và nibbana (không còn rừng) gần chữ nibbāna. Tôi dịch sát chữ từ rừng rậm đã đến nơi không còn rừng rậm; Sujato dịch escaped from entanglements, Hòa thượng Thích Minh Châu dịch Thoát rừng, đến Niết-bàn, tha-ap103:1.4 dịch từ chốn rừng sâu đi đến nơi tịch tịnh. Không đưa Niết-bàn vào thân kinh. (c) Assāsarato (12.1): assāsa là hơi thở (Sujato, Hòa thượng Thích Minh Châu đều đọc là hơi thở) nhưng cũng có nghĩa là sự an ủi, sự nhẹ nhõm; tôi theo hơi thở và ghi cách đọc kia. (d) Saṅkhāresūpasantesu (18.3): trong hình ảnh ngọn lửa, Sujato dịch coals (than hồng, theo cách hiểu saṅkhāra là cái còn lại khi lửa tắt); Hòa thượng Thích Minh Châu dịch hành. Tôi dịch các hành, giữ nguyên thuật ngữ, nghĩa kỹ thuật và nghĩa hình ảnh đều còn trong chữ này. (e) Iti me arahato sutaṁ (6.4): arahato có thể là từ bậc A-la-hán (Sujato) hay về bậc A-la-hán; tôi dịch từ bậc A-la-hán. (f) Nāgaṁ nāgena desitaṁ (19.4): Sujato what the giant taught the giant; Hòa thượng Thích Minh Châu lấy voi dạy cho voi. Tôi dịch bậc nāga do nāga thuyết giảng, giữ cả hai cách hiểu (nāga là đối tượng được nói đến, và nāga là người nói). (g) Paccuttarati dùng cho con voi (3.1) cùng chữ với Đức Thế Tôn bước lên khỏi nước (2.6, paccuttaritvā); Sujato dịch emerged. Tôi dịch bước lên khỏi cổng phía đông, không khẳng định con voi vừa tắm, dù ngữ cảnh gợi ý như thế. (h) Mahātūriyatāḷitavādita (3.1): dịch giữa tiếng đại nhạc được đánh lên và tấu lên, Sujato dịch the beating and playing of musical instruments. (i) Kāyupapanno dịch thân hình đầy đặn nhất quán (3.3, 3.5, 3.6, 3.7, 3.13); nghĩa đen là đầy đủ thân thể, Hòa thượng Thích Minh Châu dịch thân thể đẫy đà. Ở 3.6, aññampi kañci dịch bất cứ vật nào khác vì Pāli không nói là sinh vật (Sujato: other creatures).

  SỐ ĐẾM. Bài chỉ có một số: duve (9.4, hai chân) và apare (10.2, hai chân kia), khớp phép tính hai cặp chân trước và chân sau; không có số nào khác. Không có cụm số nào cần phép tính riêng (không có dạng navuti, tālīsa, sahassa hay tiṁsa).

