notes:
  - >-
    **Cảnh báo về khuôn tải `Aṅguttara Nikāya` — đo lại, con số đã lệch.** Lệnh lát bảo dùng dạng `Kinh Tăng Chi Bộ` cho `0.1` của bài `an`, nói rằng đo được 862 tệp theo dạng đó và 342 tệp giữ Pāli. Tôi **đo lại trên đĩa hôm nay** và con số đã lệch: trong 1.600 tệp `an`, có **1.228** tệp có khoá `:0.1`; trong đó **875** viết `Kinh Tăng Chi Bộ` và **353** giữ `Aṅguttara Nikāya` (372 tệp không có khoá `:0.1` nào). Tỷ lệ chọn lựa thì không đổi, nên tôi **theo đo được**: dùng `Kinh Tăng Chi Bộ`. Hệ quả phải nói rõ: bài liền kề có thể lệch — `an8.25` viết `Kinh Tăng Chi Bộ 8.25` nhưng `an8.47` lại giữ `Aṅguttara Nikāya 8.47`, và `an6.33` cũng giữ Pāli. Việc này không đổi nghĩa segment nào.
  - >-
    **Mọi trích dẫn trong `notes` này đã tra bằng script** trên chỉ mục Pāli↔Việt tự dựng (5.032 bài, 88.415 chuỗi Pāli khác nhau) — trong đó **loại 8 tệp của chính lát này**, để không tự đếm bản dịch của mình làm tiền lệ.
  - >-
    **Coverage Anh đo bằng script, không suy.** Đo theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ, cộng `english-sujato` và `english-project` khi status là published). Cách đo đã được **kiểm lại** bằng bài đã có sẵn: chạy lại đúng công thức này trên `an5.249` cho ra **16/21 = 0.7619**, khớp con số đã ghi trong `blocking_errors` của chính tệp đó. Bài này đạt 24/24 = 100%, toàn bộ do Sujato, không khoá nào phải dùng bản lấp `english-project`, nên không cần mục trong `content/meta/reference-gaps.yaml` và không có blocker về tầng tham khảo.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo.** Tại commit đã ghim, tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) chỉ có Pháp Cú, nên **không có bản Thích Minh Châu để đối chiếu ở bất kỳ bài nào trong lát này**. Đối chiếu thuật ngữ vì vậy dựa vào Pāli root + bản Anh Sujato đã ghim + **tiền lệ đo được trong chính tầng Việt của kho**; `budsas.org` là tra cứu toàn văn, không dựng cột.
  - >-
    **Dấu lược — giữ đúng luật, không mở rộng.** Mọi khoá Pāli có `…pe…` đều giữ **đúng một** `…` trong bản Việt (luật §10.1 của BRIEF_VI3), và **không** khoá nào được thêm `…` để che chỗ thiếu. Ở những khoá lược, công thức bị nén đều là `peyyāla` mà bài đã phát lại đủ ở chỗ khác, nên nén thêm cũng không mất thông tin; tôi không mở rộng bất kỳ khoá lược nào.
  - >-
    **Công thức định bảy tầng và công thức `cetovimutti` đều có tiền lệ gần trùng tuyệt đối, tôi dùng lại nguyên văn.** `savitakkampi savicāraṁ … nippītikampi … sātasahagatampi upekkhāsahagatampi` đã dịch *định có tầm có tứ, định không tầm chỉ còn tứ, định không tầm không tứ, định có hỷ, định không hỷ, định tương ưng lạc, định tương ưng xả* (`mn128`). Bài này lặp khối đó **bốn lần** (`3.1`, `5.1`, `7.1`, `9.1`) và tôi phát lại y hệt cả bốn. `mettā/karuṇā/muditā … cetovimutti bhāvitā bahulīkatā yānīkatā vatthukatā anuṭṭhitā paricitā susamāraddhā` đã dịch *Tâm giải thoát nhờ lòng từ/bi/hỷ của tôi đã được tu tập, được làm cho sung mãn, được dùng như cỗ xe, được làm nền tảng, được hành trì thường xuyên, được làm cho quen thuộc, được khéo khởi hành* (`dn33`, `dn34`); Pāli ở đây dùng **thì tương lai** `bhavissati` nên tôi chuyển hết sang *sẽ được* — giữ nguyên thì sẽ đã quá khoảng một chữ.
  - >-
    **5 khoá có Pāli trùng nguyên văn, dùng lại y hệt; 6 khoá cùng Pāli nhưng tôi chọn cách khác — nói rõ từng khoá.** `1.2` có 15 bản sẵn, tôi theo dạng phổ biến (*Tốt đẹp thay, bạch Thế Tôn, mong Đức Thế Tôn giảng pháp vắn tắt cho con; nghe pháp xong con sẽ sống một mình, viễn ly, không phóng dật, tinh cần, quyết tâm*). `1.1` có 9 bản sẵn, tôi theo dạng phổ biến (*Rồi một vị tỳ-kheo đi đến chỗ Đức Thế Tôn … ngồi xuống một bên, vị tỳ-kheo ấy bạch Đức Thế Tôn:*). `11.1` khớp `an5.56`. `8.3` (`citte …`) có 7 bản sẵn nhưng **không bản nào giữ đủ cả đoạn văn** của nó (chúng đều bắt đầu *quán tâm*), nên tôi dựng lại từ cấu trúc `dhammānupassī … viharissāmi` của `8.4`: *trong tâm …*. `8.4` có 1 tiền lệ (`sn47.29`) nhưng bản đó viết chữ thường ở đầu câu, nên tôi viết lại cho đúng ngôi. `11.2` có 3 bản sẵn, tôi theo bản có *viễn ly* (đồng nhất với `1.2` cùng bài) thay vì *thoát ly*. `11.3` có 5 bản sẵn, tôi theo dạng *Vị ấy biết rõ: “Sanh đã tận, phạm hạnh đã sống trọn, việc cần làm đã làm xong, không còn gì nữa cho đời sống này”*.
  - >-
    **`moghapurisā` → *những kẻ ngu si* (nhiều tiền lệ).** Sujato dịch *futile people*; *ngu si* là cách đã có trong tầng và không làm nhạc. `ṭhassantī` → *chiếm hữu* (1 tiền lệ: *không thể xâm chiếm và ngự trị tâm con*, `kn/mil7.4.6`). `vūpakaṭṭho appamatto ātāpī pahitatto` → *một mình, viễn ly, không phóng dật, tinh cần, quyết chí* (29 tiền lệ). `kāyānupassī` → *quán thân trên thân*, `dhammānupassī` → *quán các pháp trong các pháp*, `ātapī sampajāno satimā` → *tinh cần, tỉnh giác, có niệm*, `abhijjhādomanassaṁ` → *tham lam và ưu não* (đều có tiền lệ ở `sn47.29`).
  - >-
    **Dấu lược ở `4.2`, `4.3`, `8.2`, `8.3`:** Pāli cho `…` rời rạc giữa ba `cetovimutti` và trước `dhammānupassī`, nên bản Việt cũng rời rạc đúng vậy (mỗi khoá **một** `…`), chứ không gộp thành một danh sách — gộp sẽ là mở rộng.
  - >-
    **Chỗ cần người gộp lưu ý về thể tự thọ mình.** `1.5` tôi dùng *người thừa kế lời dạy* cho `dāyādo` (tiền lệ có *người thừa kế lời dạy*, `sn47.3`), nhưng `skill/translation.md` §7.1 nói rõ: tác phẩm của dự án **không** có nơi lấy, nên ở đây Ngài nói về **pháp của Ngài**, và tôi giữ *lời dạy* chứ không ghi *kế thừa Pháp*. Đây là lời của Đức Phật trong kinh, không phải credit của dự án.
  - >-
    **`technical_integrity` đặt 9.6 chứ không phải 10.0.** Đợt này lát bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên cổng kỹ thuật của repo **chưa chạy** và không thể tuyên bố là đã pass. Những gì đã quét bằng script riêng trên **mọi** khoá (không chỉ khoá ≥ 40 ký tự): JSON hợp lệ, đủ mọi khoá trong `all`, không khoá thừa so với Pāli, không khoá rỗng, NFC, không trùng nguyên văn Pāli, không Pāli lọt vào bản Việt, **số dấu lược khớp Pāli từng khoá**, và ngoặc kép cân trên cả bài (`ngoặc()` của `_hvi.py`). Cần chạy bốn lệnh trên trước khi merge.
