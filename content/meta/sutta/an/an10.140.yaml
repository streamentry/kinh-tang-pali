notes:
  - >-
    Mười bài `an10.135–144` dùng **cùng một khuôn Pāli** như chương 15 và chương
    19, chỉ thay danh từ X, nên toàn bộ cách diễn đạt của khuôn dùng lại nguyên
    văn từ hai chương đó: `katamo ca, bhikkhave, …?` → "Và thế nào, này các tỳ-
    kheo, …?" · `ayaṁ vuccati, bhikkhave, …` → "Điều này được gọi là, này các
    tỳ-kheo, …" · `Micchādiṭṭhi …pe… micchāvimutti—` → "Tà kiến … tà giải
    thoát—".
  - >-
    **Tiền tố "điều" chỉ có ở `an10.141`.** Sáu bài có `dhammaṁ` bắt đầu bằng
    tiền tố này, nhưng với năm bài còn lại nó làm câu **mất cân đối**: "… cho
    các ông *điều* pháp có quả là khổ và pháp có quả là an". Vì `dhammo` đã là
    danh từ, thêm "điều" là thừa và chỉ áp cho một nửa câu. Đã sửa; `an10.141`
    (`tapanīya`) là tính từ trần nên vẫn cần "điều". Lượt review bắt được lỗi
    này.
  - >-
    `sāvajjo` → **"đáng khiển trách"**, `anavajjo` → **"không đáng khiển
    trách"** (10 và 10 segment). Chọn cặp này chứ không phải "có tội / không có
    tội" (18 segment) vì bài đối lập trực tiếp hai mặt của cùng một tiêu chuẩn,
    và "khiển trách" là từ Hán-Việt quen thuộc với hàng người có trí.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
