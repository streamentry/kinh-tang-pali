  SỐ PĀLI — TỰ TÍNH, KHÔNG CHÉP TỪ BẢN DỊCH.
    · `an11.14:12.2`, danh sách `jāti`, **13** mục, tính từng mục:
      `ekampi` = 1 · `dvepi` = 2 · `tissopi` = 3 · `catassopi` = 4 · `pañcapi` = 5 ·
      `dasapi` = 10 · `vīsampi` = 20 · `tiṁsampi` = 30 · `cattārīsampi` = `cattālīsa` 40 ·
      `paññāsampi` = `paññāsa` 50 · `jātisatampi` = 1 × `sata` 100 = **100** ·
      `jātisahassampi` = 1 × `sahassa` 1000 = **1.000** ·
      `jātisatasahassampi` = 1 × (100 × 1000) = **100.000**.
      Bản Việt: *một, hai, ba, bốn, năm, mười, hai mươi, ba mươi, bốn mươi, năm mươi, một
      trăm, một ngàn, **một trăm ngàn*** — **13/13 khớp**. Mục cuối là điểm dễ sai: `một trăm
      ngàn` = 100 × 1000 = 100.000, **không phải** *một ngàn ngần* (= 1.000.000). Nguyên tắc
      thang lớn trong tiếng Việt nhân **cả** số đã tích lũy, không nhân riêng chữ số đứng
      trước.
    · `an11.14:11.1` / `:11.2` / `:23.1` `catunnaṁ jhānānaṁ` = `catu` (4) + `-naṁ` (cách số
      nhiều) ⇒ **4** *bốn thiền* ✔. `naṁ` là kết tố cách/số, **không** phải con số thứ hai.
    · `an11.14` nói pháp chân tín ở 11 khoá (`:4.1`, `5.1`, `6.1`, `7.1`, `8.1`, `9.1`,
      `10.1`, `11.1`, `12.1`, `13.1`, `14.1`) nhưng **Pāli không nêu con số**, nên bản Việt
      dịch từng mục *"một pháp chân tín"* là đúng; tôi không tự thêm số tổng.
    · **Không có** `sattatīti`, `sattatiṁse`, `sattati` hay `Tiṁsakappasahassa` trong bài này
      (đã tra toàn bộ 54 khoá kể cả `:0`) ⇒ bẫy `sattatīti` = 7 của đầu việc không áp dụng và
      tôi không dùng 70 cho bất cứ chỗ nào.

