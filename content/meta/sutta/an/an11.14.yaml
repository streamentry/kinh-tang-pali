  BẤT ĐỊNH CÒN LẠI (ghi ở đây, **không** thêm vào thân kinh).
    · `sātthaṁ sabyañjanaṁ` → *nghĩa văn đầy đủ*: hai vế `sāttha` (có nghĩa lý) và `sabyañjana`
      (có cách diễn đạt rõ) bị gộp làm một, và cụm *nghĩa văn* trong tiếng Việt thường mang
      nghĩa **kinh điển** nên dễ gây hiểu nhầm. Tôi giữ vì có 6 khoá tiền lệ nguyên văn trong
      `an`; người biên tập có thể chốt lại thành *có nghĩa lý, có văn từ* rồi áp cho cả
      `an10.17`, `an10.33`, `an10.50`.
    · `Đức Thế Tôn` so với `Đức Phật` cho `bhagavā` — đã nêu ở trên; cần một lựa chọn thống
      nhất cho toàn tầng.
    · `:0.2` *2. Phẩm Nhớ Tưởng* cho `Anussativagga`: `anussati` là "nhớ tưởng", nhưng phẩm
      này của `Aṅguttara` còn được dịch *2. Phẩm Tưởng* ở một số tài liệu. Tôi theo đa số
      cục bộ 6/6; người biên tập nếu muốn chốt tên phẩm thì chốt một lần cho cả `an11`.
    · `ācāragocarasampanno` → *đầy đủ oai nghi và đường hạnh*: tầng có **3** khoá dùng đúng
      dạng này cho đúng Pāli `ācāragocarasampanno` (`an3.96:2.2`, `an3.98:2.2`,
      `an8.13:2.3`) và **2** khoá dùng *đủ căn cơ và phạm hạnh*; bản Anh đọc là *resorting for
      alms in suitable places*. Không có đa số áp đảo nên giữ.

