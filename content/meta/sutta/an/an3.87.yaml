notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá :3.7 :3.8 :3.9 :3.10 — “Diệt tận có hành / không hành / khi thượng thăng / giữa hai đời” → “bát-niết-bàn cần gắng sức / không cần gắng sức / khi chạm đến / giữa chừng” (`sasaṅkhāra-` `asaṅkhāra-` `upahacca-` `antarā-parinibbāyī`; cùng cách dịch với an7.55:2.5, 5.3, 6.3, 7.3 và an9.12:5.4); và “năm kết trói buộc hạ giới” → “năm hạ phần kiết sử” (`orambhāgiya`, tầng dùng “hạ phần kiết sử” ở 53 khoá, “kết trói buộc hạ giới” 15). Để cả bài một thuật ngữ, quét lan: :3.6 (hạ phần kiết sử) và :2.6 :2.8 :2.9 :2.10 “ba kết trói buộc” → “ba kiết sử” (`tiṇṇaṁ saṁyojanānaṁ`, tầng 29 so với 12). Giữ “Với sự đoạn tận” ở đầu câu cho đồng đều trong bài (khác “Do đoạn tận” của bản số đông chỉ ở lối mở câu), và giữ các danh xưng Tối đa bảy lần / Gia gia / Một giống / Nhất lai / Tướng lưu.
