notes: |-
  Đợt 17, lát n174. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim và lớp
  english-project của dự án (bài đã publish từ lát lấp trước, assessed_by khác người chấm bài này).

  **Coverage Anh trên Pāli có nội dung: 36/36 = 100%** — trên sàn 0.8, không có gì phải record
  trong reference-gaps.

  **Mười câu hỏi (1.3–3.10) lấy khuôn mn72 đã publish**, đủ mười vế đúng thứ tự Pāli: thế giới là
  thường còn / không thường còn / hữu biên / vô biên / mạng sống và thân thể là một / mạng sống là
  một, thân thể là một khác / sau khi chết Như Lai còn / không còn / vừa còn vừa không còn / không
  còn cũng không phải không còn tồn tại — tất cả đều đóng bằng “đây là chân lý duy nhất, những điều
  khác đều vô nghĩa”. `…pe…` ở 3.1–3.7 và 6.1–6.7 giữ đúng MỘT `…` mỗi khoá, không mở rộng.

  **`abyākataṁ kho etaṁ ... mayā` → “điều này không được Ta tuyên thuyết”**: sn44.3:2.2 và
  sn44.11:1.5 (đã publish) dùng “Thế Tôn” vì người nói là đệ tử; ở đây chính Đức Phật xưng “Ta”
  (`mayā`) nên chỉ đổi đại từ, giữ nguyên khung “điều này không được … tuyên thuyết”. `etampi` ở
  2.2, 3.9, 5.2, 6.9 dịch có “cũng” theo sn44.3:2.5; bản Anh ghim bỏ vế “too” ở 2.2/3.9, bản Việt
  theo Pāli.

  **Trích dẫn lại 4.1–6.10 theo khuôn sn44.3:3.1–3.5 và mn72:13.1–13.3**: “khi được hỏi như vậy,
  ông nói:” mở khoá trả lời, “’, ông nói.” đóng khoá trả lời. 6.1 chỉ khác 3.1 ở dấu “ mở (Pāli
  đổi “ thành ‘ khi bắt đầu lời kể lại) và 6.7 cũng vậy với 3.7 — phần chữ còn lại trùng nguyên văn,
  nên dùng lại y cách dịch. Dấu “ mở ở 4.1 đóng ở 6.11 đúng vị trí Pāli.

  **7.1 — 0 tiền lệ cho `abhiññāya kho ahaṁ ... desemi`**: dịch nghĩa “dựa trên sự trực tiếp chứng
  ngộ”; đuôi công thức lấy nguyên văn dn22:1.7 / mn10:2.1 “thanh tịnh chúng sinh, vượt qua sầu và bi,
  chấm dứt khổ và ưu, đạt được chánh đạo và chứng ngộ Niết-bàn”.

  **Cổng thành 10.4–10.8**: 10.4 và 10.6 dùng lại nguyên văn sn47.12:6.3 / sn47.12:6.5 (Pāli trùng
  khớp từng chữ, chỉ đổi vocative theo bối cảnh); 10.5 theo dn16:1.17.4 — dạng khớp đúng ba tính từ
  `paṇḍito byatto medhāvī` (tiền lệ ghi sẵn khi chốt lát); 10.7–10.8 không có song song đã publish
  nên dịch mới từ Pāli.

  **`nīyati` ở 8.1 và 11.1–11.3**: bố cục “cả thế giới / một nửa / một phần ba” có 0 tiền lệ trong
  tầng, dịch `nīyati` là “giải thoát”. Công thức 11.2 ghép tiền lệ có đếm: “năm triền cái” (an: 7 tệp
  so với 2), “những pháp làm ô nhiễm tâm và làm yếu trí tuệ” (dn28:2.9), “tâm [đã] được thiết lập
  vững chắc trên bốn niệm xứ” (an5.136:3.5), “tu tập như thật bảy giác chi” (dn28:2.9).

  `:0.1` theo đa số an10 đo lại: 165 “Kinh Tăng Chi Bộ” / 22 “Aṅguttara Nikāya”. `:0.2` “10. Phẩm
  Upāli” (an10.92/97/98/100). `:0.3` “Kinh Uttiya” — cùng tên ở sn45.30 và sn47.16 nhưng đây là bài
  AN khác, giữ tên riêng đúng nguyên tắc.

  Triangulation 9.0: bài có cả Sujato lẫn english-project; english-project do agent khác chấm nên
  vẫn là đối chiếu độc lập với người chấm bài này, nhưng nó là bản dịch nội bộ nên không ngang bản
  Anh upstream hoàn toàn.

  technical_integrity 9.6: cổng kỹ thuật do coordinator chạy — npm run validate; npm test;
  npm run check; npm run build.
