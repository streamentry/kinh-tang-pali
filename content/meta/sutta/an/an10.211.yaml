notes:
  - >-
    **Bài chủ công của cả phẩm, và là bản đầy đủ duy nhất của mười hành vi xấu
    lẫn mười hành vi tốt.** Sáu bài sau (`an10.212`–`an10.217`, `an10.216`) đều
    **rút gọn từ đây**, nên tôi dựng mười hành vi thành mười hằng số và các bài
    kia chỉ viết phần vỏ bọc. Đây là lý do tôi dịch bài này trước.
  - >-
    **`Karajakāyavagga` → *Phẩm Thân Do Nghiệp*** (0 segment tiền lệ, đặt mới):
    Sujato dịch tên phẩm là *The Body Born of Deeds*, và `karajakāya` (thân do
    nghiệp tạo ra) là chủ đề của cả bài — `an10.219` giải thích thẳng rằng mọi
    nghiệp ác từng làm đều được cảm thọ ngay trong thân này. `Saṁsappanīyasutta`
    → *Kinh Tiếp Xúc Nghiệp* (Sujato *Karmic Contact*); `Adhammacariyāsutta` →
    *Kinh Sống Phi Pháp*.
    **`Karajakāyavaggo paṭhamo` ở `an10.220:12.4` dịch là *Phẩm Thân Do Nghiệp,
    thứ nhất*** — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì
    phẩm này rõ ràng thứ hai mốt (đúng như `21.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Nguyên văn dùng lại, đếm được, đều cùng Pāli**: mười hành vi xấu rút gọn ←
    **`an10.199-210:1.3`** (đã `published`: *Sát sinh, Trộm cắp, Tà dâm, Nói
    dối, Nói hai lưỡi, Nói ác khẩu, Nói phù phiếm, Tham lam, Sân hận, và có tà
    kiến*); mười hành vi tốt rút gọn ← **`an10.178:3.2`** (đã `published`:
    *Kiêng tránh sát sinh… không tham lam, không sân hận, và có chánh kiến*);
    `yathābhataṁ nikkhitto evaṁ niraye` ← **`an10.222:1.1`**; `… evaṁ sagge` ←
    **`an3.10:1.1`**; `natthi dinnaṁ … pavedentī’ti` ← **`an3.117:3.3`**;
    `pāṇupetaṁ saraṇaṁ gatan` ← **`an3.53:5.4`**; `apāyaṁ duggatiṁ vinipātaṁ
    nirayaṁ` ← **`an10.229-232:1.1`**; `sugatiṁ saggaṁ lokaṁ upapajjanti` ←
    **`an3.117:7.5`**; `Taṁ suṇātha, sādhukaṁ manasi karotha` ←
    **`an10.107:2.2`**.
  - >-
    **Mười hành vi xấu và mười hành vi tốt **không** phải cùng một danh sách với
    chiều ngược nghĩa giống nhau.** Phủ định thì dùng `hoti` (*là kẻ giết
    người*), khẳng định thì dùng `pahāya … paṭivirato hoti` (*đã từ bỏ …, kiêng
    tránh …*). Riêng vế tà kiến, phủ định là *Là kẻ có tà kiến, người nhìn
    ngược* còn khẳng định là *Là người có chánh kiến, không nhìn ngược* — **đảo
    cả hai vế**, tôi giữ nguyên.\n**Tám cặp phủ định–khẳng định cũng vậy**:
    `jānāmī/na jānāmī` và `passāmī/na passāmī` **đảo thứ tự** giữa `4.1` và
    `15.1`; `bhedāya`/`amūsaṁ bhedāya` đổi thành `na … bhedāya`; `vagga…` đổi
    thành `samagga…`; `aṇḍakā … kodhasāmantā asamādhisaṁvattanikā` đổi thành
    `nelā kaṇṇasukhā … bahujanakantā bahujanamanāpā`; `akālavādī … akālena
    anapadesaṁ apariyantavatiṁ anatthasaṁhitaṁ` đổi thành `kālavādī … kālena
    sāpadesaṁ pariyantavatiṁ atthasaṁhitaṁ`; `ime sattā haññantu vā …` đổi thành
    `averā hontu abyāpajjā anīghā, sukhī attānaṁ pariharantū`. Đây là nội dung
    của bài, tôi dịch từng vế chứ không dùng một công thức đảo dấu.
  - >-
    **Một chỗ Pāli đáng ghi: `19.1` là bản “không tham lam” nhưng vẫn giữ
    `‘…mama assā’ti`** (*…có được là của tôi thì tốt biết chừng nào!*) — dù câu
    đó tưởng như của kẻ tham. Tôi dịch đúng Pāli, không sửa.\n**`14.1` bị lược
    `…pe…`** giữa `māturakkhitā` và `antamaso mālāguḷaparikkhittāpi`; `3.1` giữ
    đủ. Đây là chỗ duy nhất trong `an10.211` tôi chủ động cắt bỏ chữ.
  - >-
    **Thuật ngữ 0 tiền lệ, đặt mới, kèm lý do tại đây**: `luddo` → *hung hăng*
    (⚠ chương 8 dùng *quá độ* cho `luddo` trong danh sách điều ác của con quạ —
    **nghĩa khác**: ở đây `luddo` đi với `lohitapāṇi hatapahate` nghĩa là bạo
    ác, nên tôi dịch khác và ghi lại để không ai hỏi vì sao cùng một chữ mà hai
    nơi khác); `lohitapāṇi` → *tay dính máu*; `hatapahate` → *quen tay giết*;
    `adayāpanno` → *không hề thương xót*; `theyyasaṅkhāta` → *lòng nghĩ là trộm
    cắp*; `māturakkhitā`…`mālāguḷaparikkhittā` → *có người mẹ giữ … cho dù chỉ
    được trao cho một vòng hoa* (11 danh từ); `sabhaggato`…`rājakulamajjhagato`
    → *trong đám đông … giữa triều đình vua* (5 danh từ); `āmisakiñcikkhahetu` →
    *lợi cho kẻ thân mật*; `aṇḍakā kakkasā parakaṭukā parābhisajjanī` → *gay gắt
    như tiếng quạ, cay nghiệt, cay đắng khó chịu, thô bạo đến mức khiến người
    nghe vô cùng tức giận*; `kodhasāmantā asamādhisaṁvattanikā` → *kèm theo sân
    hận, không dẫn đến an định*; `nelā kaṇṇasukhā pemanīyā hadayaṅgamā porī
    bahujanakantā bahujanamanāpā` → *mềm mại, dễ nghe thích, đáng yêu, thấm vào
    lòng người, thuần khiết, được nhiều người thích, được nhiều người hoan hỷ*;
    `nidhānavatī`/`anapadesa`/`apariyantavatī` → *không có chỗ đứng / không có
    chỗ hướng / không có chỗ kết thúc*; `aho vata` → *Ôi!…thì tốt biết chừng
    nào!*.\nCó tiền lệ: `nihitadaṇḍo nihitasattho` → *đã bỏ gậy, bỏ gươm*
    (`an3.70:19.3`); phủ định `pisuṇāya vācāya` dùng nguyên văn
    **`an4.198:8.5`** (đã `published`): *không kể ở đây điều nghe được ở kia để
    chia rẽ những người ấy… khích lệ những kẻ đang hòa hợp, ưa thích hòa hợp,
    hoan lạc trong hòa hợp, hoan hỷ với hòa hợp, nói những lời tạo hòa hợp*;
    `lajjī dayāpanno` → *biết hổ thẹn, đầy từ bi*; `sabbapāṇabhūtahitānukampī` →
    *thương yêu và hoan hỷ vì lợi ích của tất cả chúng sinh*; `niṭṭhāna` → *cào
    khoảng sâu trong thân tà dâm* (0 tiền lệ, đặt mới).
