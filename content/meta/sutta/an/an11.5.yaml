notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit 11c9d708.
  **Coverage Anh Sujato trên Pāli có nội dung (≥ 40 ký tự, bỏ khối đánh số `:N.0`): 27/27 = 100%.**
  Sujato im lặng đúng 1 khoá, `an11.5:4.5` (`Pañcamaṁ.`, 10 ký tự) — ngắn hơn 40 ký tự nên
  không nằm trong mẫu số của cổng coverage. Tầng Việt hiện hành vắng ở commit đã ghim: bilara
  chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng Thích
  Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không
  phải thiếu sót của repo.
  **`content/meta/en/an/an11.5.yaml` không tồn tại và không cần tạo** — không còn khoá trống
  nào trong tập lấp của lớp `english-project`.
  **30/33 khoá dùng lại NGUYÊN VĂN byte-for-byte. Đây là kết quả bắt buộc, không phải lười.**
  Bài song song `an11.4` (`Dutiyaupanisāsutta`, ngay trước trong cùng phẩm) có **cùng khung Pāli**:
  `1.2` ← `an11.4:2.1`; `1.3`–`1.11` ← `an11.4:2.2`–`2.10`; `2.1`–`2.4` ← `an11.4:3.1`–`3.4`;
  `3.1`–`3.10` ← `an11.4:4.1`–`4.10`; `4.1`–`4.3` ← `an11.4:5.1`–`5.3`. Ngoài ra còn trùng ở
  `an10.4`, `an10.5`, `an10.3`, `an11.3`. Dịch lại từ đầu sẽ làm phẩm *Nương Tựa* tự mâu thuẫn
  ở chính chuỗi `hatūpanisaṁ hoti …` của nó.
  **Ba khoá dịch khác, cả ba đều có lý do đo được.**
  (1) `1.1` Pāli `Tatra kho āyasmā ānando bhikkhū āmantesi …pe…` trùng `an10.5:1.1` (1/1) →
  dùng lại nguyên văn *Tại đó, Tôn giả Ānanda gọi các vị tỳ-kheo …*, giữ **đúng một** `…`
  theo quy ước `…pe…` của tầng.
  (2) `4.4` Pāli `vimuttiñāṇadassan”ti.` — **không** có `…pe…`; `an11.4:5.4` (cùng Pāli cộng
  thêm `…pe…`) thì bản Việt phải có `…`, nên không dùng lại được. Tôi theo `an11.3:4.4`:
  *giải thoát tri kiến”.* Ba bản có dấu chấm sau `”` nhưng Pāli ở khoá này đã mang dấu `.`
  riêng, và `an11.3` — bài cùng công thức trong cùng phẩm — không có.
  (3) `0.1` → *Kinh Tăng Chi Bộ* (906 so với 371 trong tầng `an`); `0.2` `1. Nissayavagga` →
  *1. Phẩm Nương Tựa* theo **8/8**; `0.3` `Tatiyaupanisāsutta` → *Kinh Nền Tảng Thứ Ba* theo
  `an11.4:0.3` (*Kinh Nền Tảng Thứ Hai*); `4.5` `Pañcamaṁ.` → *Thứ năm.* theo 253/259.
  **Lỗi của bản Anh đã ghim, tôi dịch theo Pāli — ghi lại vì ai đọc cột Anh sẽ thấy lệch.**
  Ở `an11.5:2.4` Pāli chỉ là danh từ trần `vimuttiñāṇadassanaṁ.` (vế cuối của chuỗi bị lược ở
  `2.3`), còn bản Anh đã ghim lại **nguyên câu đầy đủ đã bị lược** — đúng loại lỗi mà
  AGENTS.md cảnh báo. Tôi dịch *giải thoát tri kiến.*, khớp 8/9 bản Việt đã có và khớp
  `an11.4:3.4`. Nếu có ai vá tầng Anh, đây là chỗ cần sửa.
  **Thuật ngữ — dùng đúng bộ của `an11.4` để phẩm không tự mâu thuẫn, kèm số đếm.**
  `dussīla`/`sīlavipanna` → *phạm giới, giới hư hoại* · `hatūpanisā hoti` → *nền tảng của
  sự X đã bị hủy hoại* · `upanisasampannaṁ hoti` → *nền tảng của sự X đã đầy đủ* ·
  `avippaṭisāra` → *không hối tiếc* (tầng `an` có 155 chỗ *nền tảng*, 62 chỗ *hủy hoại nền
  tảng*) · `pāmojja` → *hoan hỷ*, `pīti` → *hỷ* (giữ phân biệt, không gộp) · `passaddhi` →
  *khinh an* · `sukha` → *lạc* · `sammāsamādhi` → *chánh định* · `yathābhūtañāṇadassana` →
  *sự thấy biết như thật* · `nibbidā` → *sự chán ngại* · `virāgo` → *ly tham* ·
  `vimuttiñāṇadassana` → *giải thoát tri kiến* (8/9 bản). `āvuso` → *hiền giả*.
  **Bất định đã ghi.** `Seyyathāpi` dịch *ví dụ như* và `pheggu` dịch *phần mềm* — cùng cách
  với `an11.4`, để ba bài (an10.4, an10.5, an11.4, an11.5) dùng chung một hình ảnh cây.
  `āyasmā ānando` → *Tôn giả Ānanda*; `āyasmā` đã đo 1.096/1.253 khoá trong tầng là *Tôn
  giả*, còn `āvuso` là *hiền giả* — hai địa chỉ khác nhau và tôi giữ đúng phân biệt đó.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì `technical_integrity` chỉ 9,6: npm run
  validate; npm test; npm run check; npm run build.
