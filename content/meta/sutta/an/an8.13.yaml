  `assājānīya`: tầng đang có ba cách — `ngựa thuần thục tốt của vua` (an5.203:1.1, an3.96:1.1, an3.98:1.1), `ngựa chánh của vua` (an4.112:1.1, an4.259:1.1, an4.260), `ngựa thuần chủng tốt của vua` (an6.5-6.7). Chọn `ngựa thuần thục tốt của vua` vì tiêu đề `Assājānīyasutta` đã có `Kinh Ngựa Thuần Thục` (an5.203:0.3, PāLI trùng tuyệt đối) và vì an5.203/an3.96/an3.98 dùng đúng câu `xứng đáng với vua, là báu vật của vua, và được tính là một yếu tố của vương quyền`. Ghi rõ ở đây vì đây là điểm chưa thống nhất trong tầng.
  `Katamehi aṭṭhahi?` -> `Với tám nào?`: đo riêng trong an8 đã dịch, 16/22 câu PāLI trùng này dùng đúng `Với tám nào?`, còn lại 2 `Tám cách nào?`, 3 `Tám pháp nào?`, 1 `Tám nào?`. `Katamehi` là cách ngữ của `katamehi` nên `Với tám nào?` giữ đúng số và đúng tiểu từ.
  Tiền lệ thuật ngữ, đều có số đếm: `ubhato sujāto` -> `sinh thuần chủng ở cả hai phía` (`sujāto` cho cả mẹ cha đã có an5.134:2.2 *được quán đảnh xuất thân cao quý ở cả hai phía — phía mẹ và phía cha*) · `sorato sukhasaṁvāso` -> `hiền hoà, dễ sống chung` · `avihaññamāno` -> `không phiền não` (sn1.38:1.5) · `kāyaduccarita`/`vācī-`manoduccarita` -> `hành xấu qua thân / lời nói xấu / ý nghĩ xấu` · `sikkhāpadesu` -> `học luật đã thọ nhận` (nguyên văn an3.98:2.2) · `sakkaccaṁ` -> `cẩn thận` (45 chỗ) · `ujumagga` -> `đường thẳng` · `thāma` -> `sức mạnh` (68 chỗ `mạnh mẽ`, 33 `cứng cỏi`) · `āraddhavīriyo` -> `tinh tấn kiên trì` (nguyên văn an4.259:4.2) · `āhuneyyo hoti …pe… anuttaraṁ puññakkhettaṁ lokassā` -> `đáng được cúng dường … là ruộng công đức vô thượng của thế giới` (nguyên văn an5.203:2.4 và an8.57:1.11).
  0 tiền lệ, đặt mới kèm lý do: `sāṭheyyāni kūṭeyyāni jimheyyāni vaṅkeyyāni` -> `thủ thuật, động tác đội lốt, mẹo móc và chỗ nấp náu` (theo mn51:4.14 đã có `bộc lộ đủ mọi mánh khóe, gian trá, quanh co và lệch lạc` cho cùng cụm; bốn từ PāLI được tách thành bốn danh từ Việt vì câu kế tiếp là `tāni yathābhūtaṁ āvikattā hoti`) · `sārathi` -> `người điều khiển` · `abhinimmadanāya` -> `kìm hãm` · `avikiranto` -> `không làm nhơ bẩn` · `uccāraṁ/passāvaṁ` -> `phân hay nước tiểu`.
