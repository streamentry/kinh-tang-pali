  Dịch từ Pāli root tại commit đã ghim. COVERAGE ĐO LẠI bằng chính hàm của kho (`englishCoverageFor`, ngưỡng 0.8 trong `source/layers.yaml`): `english-sujato` phủ 24/24 khoá Pāli có nội dung = 1.000, không cần tệp lấp `english-project`. Tầng `vietnamese-current` không có — tại commit đã ghim bilara chỉ phân phối Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  ĐỢT NÀY LÀ LƯỢT REVIEW ĐỐI KHÁNG THỨ HAI, trên bản dịch đã có trên đĩa. Sửa 3 khoá, giữ nguyên 40/40 khoá:
    · `1.11` và `2.10` — LỖI NGHĨA Ở MỘT TỪ TRONG CỤM BỐN. Pāli `Yāni kho panassa honti sāṭheyyāni kūṭeyyāni jimheyyāni vaṅkeyyāni, tāni yathābhūtaṁ sārathissa āvikattā hoti.` Bản dịch dùng `thủ thuật, động tác đội lốt, mẹo móc và chỗ nấp náu`. Ba từ đầu ứng với ba chữ PāLI là được; nhưng `vaṅkeyya` là trò đánh lừa, đường lừa dối trong đấu tay (Sujato dịch *feints*), KHÔNG phải chỗ nấp náu — nấm náu là chỗ trú ẩn, đối lập với nghĩa của chữ. Đã sửa thành `trò đánh lừa` ở cả hai khoá để giữ cấu trúc bốn danh từ và sự song song giữa 1.11 (ngựa) và 2.10 (tỳ-kheo).
    · `2.15` — LỖI KỸ THUẬT VÀ CÂU CHẬT. Bản dịch viết ` và đường thẳng ấy là, như sau—`: có khoảng trắng dẫn đầu (cả 40 khoá còn lại đều không có), và `tatrāyaṁ ujumaggo, seyyathidaṁ—` bị dịch thành hai vế lặp nghĩa `… là, như sau—` khiến câu không lập được. Đã sửa thày đủ `và đường thẳng ấy chính là—`, bỏ khoảng trắng dẫn đầu.
  Số khoá sửa: 3 (hai khoá dùng lại cùng một cụm Pāli nên tính là hai sửa, không gộp). Vì sửa không đụng số khoá, không khoá nào thừa/thiếu/lệch, `segment_alignment` giữ 10.0; `semantic_fidelity` giữ 9.4 vì lỗi đã sửa xong và phạm vi hẹp.

  ĐO LẠI TIỀN LỆ (không tin số của người khác):
    · 0.1 bài an: quét 1.248 khoá `:0.1` trong tầng `an` -> `Kinh Tăng Chi Bộ` 895 (72%), `Aṅguttara Nikāya` 353. Chọn `Kinh Tăng Chi Bộ 8.13`.
    · Tên phẩm: `2. Mahāvagga` -> `2. Phẩm Lớn` (5 tệp, an8.15-an8.18). Không tạo cách thứ N+1.
    · Dấu lược: ba khoá lược, giữ đúng MỘT `…` mỗi khoá và không mở rộng — `2.1` (`āhuneyyo hoti …pe… anuttaraṁ puññakkhettaṁ lokassa.`), `2.16` (`sammādiṭṭhi …pe… sammāsamādhi.`), `2.19` (cùng công thức, `…pe…` + `”ti.`). Cả 40 khoá khớp.
    · Ngoặc kép cân trên cả bài (đếm cả `“` và `”` toàn bài, kể cả ngoặc lồng nhau), 0 lỗi. NFC toàn bộ 0 lỗi. Không có khoá rỗng, không có `(…)` khoá chưa dịch, không có khoá tràn. Số khoá 40 = 40.
    · Dùng lại NGUYÊN VĂN, đối chiếu byte-for-byte (Pāli trùng tuyệt đối): `2.3` <- `an3.98:2.2` · `2.19` <- `an8.57:1.11` · `2.18` <- `sn12.22:2.3` · `2.16` <- `sn38.10:1.10` (nguyên văn cho cả dãy `sammādiṭṭhi …pe… sammāsamādhi`).

  `assājānīya`: tầng đang có ba cách — `ngựa thuần thục tốt của vua` (an5.203:1.1, an3.96, an3.98), `ngựa chánh của vua` (an4.112, an4.259, an4.260), `ngựa thuần chủng tốt của vua` (an6.5-6.7). Chọn `ngựa thuần thục tốt của vua` vì tiêu đề `Assājānīyasutta` đã có `Kinh Ngựa Thuần Thục` (an5.203:0.3, Pāli trùng tuyệt đối) và vì `an5.203`/`an3.96`/`an3.98` dùng đúng câu `xứng đáng với vua, là báu vật của vua, và được tính là một yếu tố của vương quyền`. Ghi rõ vì đây là điểm chưa thống nhất trong tầng.
  `Katamehi aṭṭhahi?` -> `Với tám nào?`: đo riêng trong tầng `an` có đúng 18 khoá viết `Với tám nào?` (rải ở 10 tệp an8), đa số rõ rệt trong đúng bộ này, nên giữ để an8.13 không lệch. Ghi rõ số đo vì `an5.203` lại dùng `Thế nào là năm?` cho cùng công thức — khác biệt là do quyển, không phải do cách dịch.
  `sāṭheyyāni kūṭeyyāni jimheyyāni vaṅkeyyāni` -> `thủ thuật, động tác đội lốt, mẹo móc và trò đánh lừa`: 0 tiền lệ cho cả cụm (`grep thủ thuật` trong tầng trước đợt này = 0 hit; `mn51:4.14` chỉ có `bộc lộ đủ mọi mánh khóe, gian trá, quanh co và lệch lạc` cho cùng cụm nhưng là câu văn khác và không tách thành bốn danh từ); bốn chữ PāLI được tách thành bốn danh từ Việt vì câu kế tiếp là `tāni yathābhūtaṁ āvikattā hoti` và cần liệt kê.

  Tiền lệ thuật ngữ, đều có số đếm: `ubhato sujāto` -> `sinh thuần chủng ở cả hai phía` (`sujāto` cho cả mẹ cha đã có an5.134:2.2 *được quán đảnh xuất thân cao quý ở cả hai phía — phía mẹ và phía cha*) · `sorato sukhasaṁvāso` -> `hiền hoà, dễ sống chung` · `avihaññamāno` -> `không phiền não` (sn1.38:1.5) · `kāyaduccarita`/`vācīduccarita`/`manoduccarita` -> `hành xấu qua thân / lời nói xấu / ý nghĩ xấu` · `sikkhāpadesu` -> `học luật đã thọ nhận` (nguyên văn an3.98:2.2) · `sakkaccaṁ` -> `cẩn thận` (45 chỗ) · `ujumagga` -> `đường thẳng` · `thāma` -> `sức mạnh` (68 chỗ `mạnh mẽ`, 33 `cứng cỏi`) · `āraddhavīriyo` -> `tinh tấn kiên trì` (nguyên văn an4.259:4.2) · `āhuneyyo hoti …pe… anuttaraṁ puññakkhettaṁ lokassā` -> `đáng được cúng dường … là ruộng công đức vô thượng của thế giới` (nguyên văn an5.203:2.4 và an8.57:1.11) · `sārathi` -> `người điều khiển` · `satthari vā viññūsu vā sabrahmacārīsu` -> `trước bậc Thầy, hoặc trước những bậc hiểu biết, hoặc trước những người đồng đạo`.
  0 tiền lệ, đặt mới kèm lý do: `avikiranto` -> `không làm nhơ bẩn` · `uccāraṁ/passāvaṁ` -> `phân hay nước tiểu` · `abhinimmadanāya vāyamati` -> `tìm cách kìm hãm` · `kāmaññe … mā vā` -> `Dù … hay không` · `tatrāyaṁ ujumaggo, seyyathidaṁ` -> `và đường thẳng ấy chính là—`.

  Bất định đã ghi lại:
    (1) `2.16` kết bằng `…` nhưng giữ đủ tám mục của chánh đạo trung đạo — đây là CHẾ ĐỘ ĐÃ CÓ của tầng: nguyên văn lấy từ `sn38.10:1.10` (`chánh kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm … chánh định.`) với Pāli trùng tuyệt đối, và `an10.118:2.2-2.3` cũng vậy. Ghi ra đây vì nguyên tắc chung là KHÔNG mở rộng dấu lược; ở đây giữ nguyên văn dùng lại, và dấu `…` vẫn đúng một.
    (2) `2.19` có chữ `đáng được tiếp đón,` nằm trong vùng `…pe…` — cũng là nguyên văn dùng lại từ `an8.57:1.11` (Pāli `Imehi kho, bhikkhave, aṭṭhahi dhammehi samannāgato bhikkhu āhuneyyo hoti …pe… anuttaraṁ puññakkhettaṁ lokassā”ti.` trùng tuyệt đối), nên giữ để khớp byte. Ngược lại `2.1` dùng `…` trần và bỏ chữ đó, vì lấy từ `an5.203:2.4` vốn viết đủ. Hai khoá khác nguồn nên khác cách — ghi ra để người biên tập không tưởng là lỗi.
    (3) `2.19` kết bằng `”ti.` — tầng đang phân hai cách: đo toàn tầng `sn`+`an` có 1.206 khoá kết bằng `”ti.` và 1.222 khoá kết bằng `”.`. Giữ `”ti.` vì nguyên văn dùng lại từ `an8.57:1.11`.
    (4) `1.16` dịch `yāva jīvitamaraṇapariyādānā` thành `cho đến khi chết đi hết thân` — đọc được nhưng lóng; giữ vì không sai nghĩa và không có tiền lệ để thay.

  Cổng kỹ thuật: `technical_integrity` đặt 9.6 thay vì 10.0 vì lát này bị cấm chạy `npm run validate`, `npm test`, `npm run check` và `npm run build` (bốn lệnh này là cổng thật do CI chạy). Đã tự kiểm bằng node: JSON hợp lệ, 40/40 khoá khớp Pāli, 0 khoá thừa/thiếu/rỗng, NFC sạch, dấu lược khớp từng khoá, ngoặc kép cân, không còn khoá nào có khoảng trắng dẫn đầu. Coverage tầng Anh đo lại bằng hàm của kho nên không có blocker loại 1. Không sửa `content/meta/reference-gaps.yaml`, không sửa `source/`, không sửa `scripts/` hay `src/`.
