notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt quét lỏng): khoá 5.2 (sửa lan 5.6) — “để tâm thanh tịnh, trong sáng thấm khắp chính thân này” → “lan tỏa khắp chính thân này với tâm thanh tịnh, trong sáng” (`pharitvā`; theo `dn2:81.2`, `dn10:2.18.2`); khoá 10.2 — đổi lại hai tay: `vāmena hatthena rasmiyo … dakkhiṇena hatthena patodaṁ` là tay trái cầm dây cương, tay phải cầm roi, bản trước ghi ngược (theo `mn21:7.11`, `mn119:31.2`); khoá 3.1, 4.1, 5.1 — thêm “này các tỳ-kheo, vị tỳ-kheo” (bản trước bỏ `bhikkhave, bhikkhu`), và ở 5.1 “từ bỏ lạc và khổ” → “từ bỏ lạc” (`sukhassa ca pahānā`; chữ “khổ” nằm sau dấu lược); khoá 15.1 — bỏ nghĩa lấy từ phần đã lược (“thấy chúng sinh đang chết đi và đang tái sinh”), thêm “cầu mong ta” cho `pajāneyyaṁ`, và “các chúng sinh đi theo nghiệp của họ” cho `yathākammūpage satte` (theo cách dịch đa số của công thức này, 82 khoá trùng). Cả 7 khoá trong danh sách đều đổi.
