notes: |-
  Giải quyết draft 2026-10-12: kiểm toán độc lập, đọc đối kháng 93/93 khoá với Pāli root và bản Anh SuttaCentral.
  Mục chấm 2026-09-13 của GLM-5.3 Flash (ZCode) bị thay thế bằng mục này; blocker cũ được xử lý như sau.
  (1) Blocker "cắt ngắm" ở an4.193:13.4 (loại D): đã gỡ. Pāli tại khoá đó là `Dosaṁ vineyya viharāhi.` (không có dấu lược), bản Việt hiện nay `Hãy sống từ bỏ sân.` dịch đủ và không chứa `…`; không còn khoá nào mà Pāli không có `…` nhưng Việt có `…`.
  (2) Lỗi nghĩa/ngôn từ thật đã sửa (43 khoá đổi, trong đó các khoá lỗi nghĩa: 2.3, 2.4, 3.3, 4.4, 5.4, 6.3–6.4, 6.9–6.10, 7.4, 8.3, 9.4, 10.3, 11.3–11.4, 11.9–11.10, 12.4, 15.5, 16.5; còn lại là đồng nhất thuật ngữ; xem thêm mục huyễn thuật bên dưới):
  - `sāvajja`: bản cũ "đáng bị trách trách" là chữ lặp vô nghĩa (cũng xuất hiện ở 7 bài khác, ngoài phạm vi bài này: an4.135, an4.222, an4.223, an4.230, an4.239, an4.263, an5.215). Đổi thành "có tội" / "không có tội" theo tiền lệ an3.65 (cùng công thức Kālāma), ở 3.3, 6.3–6.4, 7.4, 8.3, 11.3–11.4, 12.4.
  - 2.4: câu `kacci te … vuttavādino … sahadhammiko vādānupāto gārayhaṁ ṭhānaṁ āgacchati` bản cũ nói "không ai bị quở trách vì luận điểm hợp pháp" (sai chủ thể: chủ ngữ là lời bàn hợp Pháp rơi vào chỗ đáng chê trách) và `abbhācikkhanti` dịch "lừa gạt". Sửa theo tiền lệ an8.12:8.3, sn12.24, an3.57: "không xuyên tạc … bằng điều không thật … không có lời bàn nào hợp Pháp rơi vào chỗ đáng chê trách". `anabbhakkhātukāmā hi mayaṁ` là số nhiều: "chúng con", không phải "con". 2.3 `Ye te, bhante, evamāhaṁsu` cũ "Những ai bạch Thế Tôn nói như vậy" mơ hồ → "Bạch Thế Tôn, những ai đã nói như vầy".
  - 6.10 và 11.10: `Evaṁ no ettha hotī` do Bhaddiya (người dưới) thưa với Đức Phật; "chúng tôi" sai ngôi, sửa "chúng con". 6.9, 11.9, 15.11: thêm `bhante` bị bỏ sót ("Bạch Thế Tôn, …").
  - `sārambha`/`sāraddha`: bản cũ "gây hấn". Đo tiền lệ: các bài khác có Pāli `sārambh-/sāraddh-` dùng "hung hăng" 13 khoá, "ngạo mạn" 3, "hơn thua" 1, "gây hấn" 1 (chính bài này). Đổi toàn bài sang "hung hăng" (5.2, 5.4, 10.1, 10.3, 13.8–13.9).
  - 4.4, 5.4, 9.4, 10.3: bản cũ bỏ `luddho … purisapuggalo` / `aluddho … purisapuggalo` ("người tham này", "người không tham này"); đã đưa lại chủ ngữ.
  - 15.5: `Evaṁvādiṁ kho maṁ, bhaddiya, evamakkhāyiṁ … asatā tucchā musā abhūtena abbhācikkhanti` cũ "Dù Ta trình bày và xác lập … lừa gạt" thiếu hô cách `bhaddiya`; theo tiền lệ mn22:37.1, an10.29:21.3 (và dn24, an8.12): "tuyên bố và giảng dạy … xuyên tạc Ta bằng điều không thật, rỗng tuếch, giả dối, không đúng sự thật". Tiền lệ tầng: 4/4 bài có cả hai vế `Evaṁvādiṁ … evamakkhāyiṁ` dùng "tuyên bố/tuyên nói".
  - 16.5: Pāli kết `hitāya sukhāya (…).` — bản cũ chèn "— nếu chúng là chúng sanh", nghĩa không có trong Pāli root (chỉ có ở bản Anh Sujato). Bỏ phần thêm, giữ nguyên dấu `(…)` theo Pāli; ghi chú ở đây là Sujato hiểu đoạn lược theo nghĩa "if they were sentient".
  - Công thức Kālāma (3.1, 7.2, 8.1, 12.2, kèm 3.3/7.4/8.3/12.4): đồng nhất với tiền lệ 8/8 khoá `piṭakasampadānena` ở an3.65, an3.66: `paramparāya` "truyền thống", `itikirāya` "tin đồn", `piṭakasampadānena` "kinh sách" (bản cũ "sự học rộng trong Tạng" thêm nghĩa "học rộng"), `takkahetu` "suy lý", `nayahetu` "phương pháp suy luận", `diṭṭhinijjhānakkhantiyā` "chấp nhận … sau khi xem xét", `bhabbarūpatāya` "khả năng bề ngoài". Riêng `ākāraparivitakkena` giữ "sự xét đoán hợp lý" thay vì "suy tư biểu kiến" của an3.65/66 (cách dịch ấy không sát nghĩa `ākāra` = lý do/phương diện); ghi nhận chỗ lệch tiền lệ này.
  - 13.1–13.2: `samādapenti` "khuyến khích" (đồng nhất 4.4 `samādapeti`), `ambho purisa` "Này bạn" (tiền lệ 15 khoá "bạn" so với bản cũ "người hiền" thêm nghĩa "hiền").
  (3) Không có blocker loại A (bài có bản Anh Sujato tại commit ghim), B hay C trong danh sách cũ. Độ phủ Sujato trên Pāli có nội dung: 46/52 = 0,885 (≥ 0,80). Sujato để trống 6 khoá có nội dung: 9.4, 10.1, 13.7, 13.9, 15.11, 16.3; các khoá này đã đọc từ Pāli, đều là phần lặp theo mô thức song song của 4.4/5.4/13.5/15.10/16.2 nên tự đứng vững; `triangulation` vì thế không vượt 8,5. Bản Việt hiện hành (`vietnamese-current`) chỉ có Pháp Cú, bài này không có tầng đó (giới hạn tham chiếu, không phải lỗi văn bản).
  - `māyāvī … āvaṭṭaniṁ māyaṁ … āvaṭṭeti` (2.2, 2.4, 15.6–15.11, 16.2–16.5): bản cũ "kẻ phù phép … phép thuật dẫn dắt … dẫn dắt" lặp và mơ hồ. Cùng công thức Pāli có ở mn56 (3/3 khoá đã dịch "người dùng huyễn thuật … huyễn thuật lôi cuốn … lôi cuốn"); đồng nhất theo đó.
  (4) Bất định còn lại: `āvaṭṭanī` "lôi cuốn" theo mn56 (Sujato: "conversion trick … converted"); nghĩa gốc "xoay chuyển về phía mình" được giữ, có thể xem lại nếu sau này rà mn56. `mahāsālā` ở 16.5 hiểu là cây sa-la lớn (theo Sujato và mạch "ko pana vādo manussabhūtassa"). `…pe…` ở 5.2/10.1/14.2 đã chuyển thành `…`.
  (5) Số Pāli: không có số đếm trong bài. Đối chiếu nháy đơn/kép khớp Pāli từng khoá; không có cặp Pāli trùng nguyên văn trong bài mà bản Việt khác (3.1/8.1, 3.2/8.2/7.3/12.3, 7.2/12.2 và 4.2/9.2 cặp song song đã kiểm). 93/93 khoá, thứ tự khoá theo Pāli.
  (6) `technical_integrity: 9.6` — cổng kỹ thuật chưa chạy trong phiên này; còn phải chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trước khi chốt trạng thái.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 7.5, 12.5 — ‘Ta đã nói điều ấy, và vì lý do này Ta đã
  nói vậy’ → ‘Đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói’ (dạng đa số, 54/80 khoá
  trùng ở `iti yaṁ taṁ vuttaṁ idametaṁ paṭicca vuttaṁ`); bản cũ đưa chủ ngữ ‘Ta’ vào câu không có trong
  Pāli.
