notes:
  - >-
    Bài mở đầu chương: một cặp hỏi–đáp, trong đó câu trả lời **tái dùng nguyên
    văn** danh sách của `an10.42:1.4` và câu hỏi lại **tái dùng nguyên văn** câu
    hỏi của chính nó — nên hai bài đọi như một.
  - >-
    **Dãy `adhammaṁ dhammoti dīpenti …` (5 segment toàn corpus) là nơi lượt
    review bắt được lỗi nghiêm trọng nhất của chương này, nên ghi lại đủ.** Cấu
    trúc Pāli là **đối xứng**: vế trước và vế sau phải là **cùng một đối tượng
    của Thế Tôn, chỉ đảo chiều** — `abhāsitaṁ alapitaṁ tathāgatena bhāsitaṁ
    lapitaṁ tathāgatenāti dīpenti` là *gọi điều Thế Tôn **chưa** nói là điều Thế
    Tôn **đã** nói*. Bản đầu của tôi dịch cả hai vế thành một câu, và vế thứ
    nhất **bị đảo**. Đã sửa thành một khuôn thống nhất cho cả sáu vế: *gọi điều
    Thế Tôn X là điều Thế Tôn Y*.
    **Hai điểm khác cùng lúc sửa, cùng nguyên nhân:** (1) `āciṇṇa` tôi dịch là
    *tuyên thuyết* — nhưng *tuyên thuyết* đã dùng cho `abhāsita` ở ngay vế
    trước, nên hai vế trở thành nghĩa một; `āciṇṇa` là **đã thực hành**, đã sửa.
    (2) Tôi đan xen *Thế Tôn* và *Ngài* giữa các vế, tạo cảm giác run rẩy không
    có cơ sở; đã thống nhất *Thế Tôn*.
    **Hệ quả nằm ngoài chương này, ghi lại chứ không tự ý sửa:** cùng lỗi đảo vế
    ấy còn ở `an10.37:1.3` và `an10.42:1.4` là bản trong PR này; `an10.37:1.3`,
    `an10.38:1.3`, `an10.40:1.3` là **ba bài đã `published` có scorecard đã ký**
    — xem `docs/translation-notes/adhamma-dhamma-root-of-dispute.md`. Bản
    `an10.38:1.3` và `an10.40:1.3` còn lỗi nặng hơn: Pāli ở đó là `abhāsitaṁ
    alapitaṁ tathāgatena abhāsitaṁ alapitaṁ tathāgatenāti` (**không** nói như
    **không** nói) mà bản dịch lại viết *đã nói như đã nói*.
  - >-
    **`dīpenti` → *trình bày gọi … là …*** dùng nguyên văn `an10.37:1.3` (đã
    dịch ở chương 4). Vế *trình bày* nêu hành động của tỳ-kheo, vế *gọi … là …*
    nêu cái họ làm sai; bỏ *trình bày* thì mệnh đề thành vô nghĩa.
  - >-
    **`bhaṇḍanakalahaviggahavivādā` → *tranh chấp, cãi vã, xung đột, tranh
    luận***: bốn danh từ Pāli, giữ thành bốn tiếng Việt khác nhau để người đọc
    thấy đây là **bốn loại**, không phải một cụm. `hataṃ na phāsu viharantī` →
    *không sống an ổn* (0 segment, đặt mới; `phāsu` = thuận tiện, dễ chịu).
  - >-
    **`heta`/`paccaya` → *nhân* / *duyên*** theo 47 segment tiền lệ
    (`an3.15:4.1`, `an3.56:1.4`, `an4.171:8.1`); bản đầu tôi tự đặt *lý do* /
    *nguyên nhân* — **0 segment toàn corpus**, tức là đặt mới một cụm mà corpus
    đã có 47 cách khác. Đã sửa. `Paṭhamaṁ.` → *Thứ nhất.*
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    Sửa lan 2026-10-13: (1) `an10.41:1.2`, `an10.41:1.4` — *cãi vã, giẫy già,
    tranh luận* → *cãi vã, xung đột, tranh luận* (`viggaha` = *xung đột*; *giẫy
    già* không phải từ có nghĩa; tiền lệ `mn13:11.2`, `mn14:10.2`, `mnd9:114.4`,
    `mnd15:33.3`). Giữ bốn danh từ thành bốn tiếng Việt khác nhau. (2)
    `an10.41:1.3` — *gọi phi vinh là vinh pháp, gọi vinh là phi vinh* → *gọi phi
    luật là luật, gọi luật là phi luật* (`avinayaṁ vinayoti dīpenti, vinayaṁ
    avinayoti dīpenti`; *vinh* không phải dịch của `vinaya`, các bài khác dùng
    *luật*). Lỗi *phi vinh/vinh pháp* còn nằm ở `an10.37`, `an10.38`, `an10.39`,
    `an10.40`, `an10.42` — ngoài lane, chưa sửa.
