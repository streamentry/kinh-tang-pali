notes: |-
  `Dīghajāṇusutta` trong `Gotamīvagga`. 82 khoá, tất cả đã dịch; không có khoá nào ngoài tập khoá Pāli. Bài là bản song song gần như nguyên văn của `an8.55` (`Ujjayasutta`) và `an8.76`: cùng bốn pháp hiện đời (`uṭṭhānasampadā`, `ārakkhasampadā`, `kalyāṇamittatā`, `samajīvitā`), cùng bốn pháp đời sau, cùng kệ. Điểm khác: người hỏi là Dīghajāṇu người Koliya (gọi bằng dòng họ `Byagghapajja`), và có thêm khoá `5.5`–`5.8` về lối sống quân bình.

  COVERAGE ENGLISH (đo thật). Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = 52. Bản Anh Sujato đã ghim (`an8.54_translation-en-sujato.json`, có trong manifest) có chữ ở 52/52 khoá = 1,00. Không dùng lớp `english-project` (bài này không có), nên không khoá nào do bản lấp của dự án cung cấp và coverage trên đây là hoàn toàn độc lập. Không cần mục trong `content/meta/reference-gaps.yaml`. Cổng coverage (ngưỡng 0,80) đạt; không có blocker về tầng tham khảo.

  TẦNG VIỆT HIỆN HÀNH VẮNG. Tại commit đã ghim, tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) chỉ có Pháp Cú, nên không có bản Thích Minh Châu phân đoạn để đối chiếu cho bài này. Việc đối chiếu thuật ngữ dựa vào Pāli root + Sujato (52/52) + tiền lệ đo được trong chính tầng Việt của kho. Nguyên bài Thích Minh Châu ở mục Tra cứu toàn văn không được đọc làm căn cứ ở lát này; triangulation vì vậy đặt 9,3 chứ không cao hơn.

  TIỀN LỆ PĀLI TRÙNG. 31/82 khoá có Pāli trùng nguyên văn ở bài khác trong tầng (tổng 844 cặp đã dò; 284 cặp trong đó bản Việt khác bản tôi dùng — phần lớn là `Katame cattāro?` với 238 nơi dùng và nhiều cách đáp). Cả 31 khoá dùng lại nguyên văn một cách dịch đã có trong tầng, chủ yếu `an8.55` (cùng chuỗi Pāli ở `2.3`, `2.6`, `2.7`, `3.3`, `3.4`, `6.2`, `7.2`, bốn khoá kệ `15`–`18`) và `an8.55`/`an8.75`/`an8.76` cho kệ. Trong chính bài có 4 nhóm khoá trùng nguyên văn Pāli (`2.2`/`9.2`, `6.2`/`6.8`, `6.3`/`7.3`, `7.2`/`7.8`); bản Việt của cả 4 nhóm cũng trùng (0 nhóm bị lệch). Các khoá dịch mới theo cùng khuôn `an8.55` chỉ đổi vocative `brāhmaṇa` thành `Byagghapajja`: `3.2`, `4.2`, `5.2`–`5.8`, `6.x`–`7.x`, `10.2`, `12.2`, `13.2`.

  THUẬT NGỮ VÀ BẤT ĐỊNH (không đưa vào thân kinh).
  1. `Byagghapajja` giữ nguyên làm danh xưng (dòng họ của Dīghajāṇu); Sujato cũng giữ nguyên. `koliyaputto` → *người Koliya* (theo `mn57:2.1`, `an5.100:1.3`); tầng cũng có *người con trai dòng Koliya* (`ud2.8`, 2 khoá). Cả hai đều bám `-putta`; chọn dạng ngắn vì lặp nhiều lần trong khoá `1.2`.
  2. `apāyamukhāni` / `āyamukhāni`: cùng một từ Pāli ở hai ngữ cảnh. Với tài sản dịch *cửa hao tán* / *cửa tăng thêm* (theo `an8.55:7.1`, `8.1`); với hồ nước dịch *đường nước chảy ra* / *chảy vào* (theo `an4.178:3.6`, `4.6`, `an8.55:7.3`). Hai cách dịch không đổi nghĩa; ghi ra vì hai ngữ cảnh dùng hai từ Việt khác nhau.
  3. `pariyādāya ṭhassati` ở `5.2`, `5.4`, `5.7`: *vượt trên* (`an8.55`, `an8.76`). Pāli nghĩa đen gần *chiếm hết / làm cạn* (như `an6.13`: *chiếm ngự*); ở đây theo tiền lệ cùng công thức. Bất định nhỏ: *vượt trên* là cách đọc theo công thức, không phải nghĩa từ điển trực tiếp.
  4. `5.7`: `Yato ca khoyaṁ … ṭhassatī’ti.` được dịch thành mệnh đề điều kiện kết bằng dấu phẩy, nối vào `5.8` (*thì … đây được gọi là sống quân bình*) theo `an8.55:6.7`–`6.8`. Sujato ngắt thành hai câu độc lập. Pāli `yato … ayaṁ vuccati` ủng hộ cách nối; không đổi nghĩa.
  5. `vuddhasīlino` ở `4.2`: hiểu `daharā vā vuddhasīlino, vuddhā vā vuddhasīlino` là *dù còn trẻ mà giới hạnh thuần thục, hay đã lớn tuổi mà giới hạnh thuần thục* (theo `an8.55:5.2`).
  6. `vīmaṁsā` ở `2.7`: *sự xét đoán về phương cách thích hợp trong việc ấy* (theo `an8.55:3.4`).
  7. `yācayogo` ở `12.2`: *sẵn sàng đáp lại lời xin* (theo `an8.55:12.2`); tầng có ít nhất năm cách dịch khác nhau, không có cách nào là đa số rõ.
  8. `vigatamalamaccherena` ở `12.2`: *ô nhiễm keo kiệt*. Đo trên 27 khoá của tầng: *ô nhiễm* 15, *cấu uế* 9, *vết nhơ* 3. Bài anh `an8.55` dùng *cấu uế*; ở đây theo dạng đa số của tầng. Hai bài vì vậy lệch một từ (ghi ra, không đổi nghĩa).
  9. `pāṇātipātā paṭivirato` ở `11.2`: *kiêng tránh sát sinh* (104 khoá *sát sinh* so với 8 khoá *sát sanh* trong tầng; `an8.55` dùng *sát sanh*). `surāmerayamajjapamādaṭṭhānā` → *rượu và các chất men say gây phóng dật* (theo `an3.79:6.3`, cùng chuỗi Pāli).
  10. `udayatthagāminiyā` ở `13.2`: *hướng đến sự sanh diệt* (14/14 khoá của tầng). `paññā` giữ là *tuệ* trong cả danh mục (`9.3`, `13.x`) để đồng nhất với `an8.55`.
  11. `1.3`: `puttasambādhasayanaṁ ajjhāvasāma` → *sống trong nhà chật chội với con cái*; `kāsikacandanaṁ` → *trầm hương Kāsi*; `jātarūparajataṁ sādayāma` → *chấp nhận vàng bạc* (theo `sn3.11:4.1`, `sn55.53:2.4`, cùng chuỗi Pāli). `1.4`: `tesaṁ no … amhākaṁ` được thể hiện bằng *cho chúng con, những người như thế*; `tathā` → *theo cách nào để*; mệnh đề `ye amhākaṁ assu dhammā` → *để chúng con có được những pháp*.
  12. `bhante` với Đức Thế Tôn → *Bạch Thế Tôn*; tường thuật `bhagavā` ở khoá `1.1`–`1.2` → *Đức Phật* (theo `an4.57:1.1`, `an8.55:1.1`).
  13. Đề mục `0.1`: dùng `Kinh Tăng Chi Bộ 8.54` theo dạng đa số của tầng (cùng `an8.55:0.1`); cả hai dạng (`Aṅguttara Nikāya`, `Kinh Tăng Chi Bộ`) cùng tồn tại ở các bài lân cận, không đổi nghĩa segment nào.

  NHÁY VÀ DẤU LƯỢC. `“` mở ở `1.3` và đóng ở `1.4`; `“` mở ở `2.1` và đóng ở `18.4` (`cāgo puññaṁ pavaḍḍhatī”ti`). Khoá `14.1` kết bằng `…samparāyasukhāyāti.` trong Pāli, không có nháy mở hay đóng nên bản Việt cũng không có. Nháy đơn: `3.4`, `5.2`, `5.3`, `5.4`, `5.5`, `5.6`, `5.7`, `10.3` mỗi khoá khớp Pāli. Dấu lược: `10.3` và `11.2` mỗi khoá có đúng một `…pe…` trong Pāli và đúng một `…` trong Việt; Pāli không có `…` trần hay `(…)` ở khoá nào, nên bản Việt không có thêm. 0 khoá lệch số dấu lược/nháy (82/82 khoá đã đối chiếu).

  SỐ PĀLI. `cattāro/cattāri` = bốn (2.1, 2.2, 6.1, 6.3, 6.7, 7.1, 7.3, 7.7, 8.1, 9.1, 9.2, 14.1); `aṭṭha` ở `17.1` = tám (bốn pháp hiện đời + bốn pháp đời sau, khớp với hai nhóm bốn ở `2.3` và `9.3`). Pāli không có số nào khác. Phép tính: 4 + 4 = 8.

