notes: |-
  Lát c55. Mệnh đề 0.1 — đo lại: toàn tầng `an` là “Kinh …” 897 vs “Aṅguttara …” 353,
  nhưng riêng quyển 7 nghiêng ngược: “Aṅguttara” 52 vs “Kinh” 21 ⇒ theo đa số cục bộ,
  “Aṅguttara Nikāya 7.4”.

  Đây là bài mà tôi dùng khuôn nhiều nhất lát, và **đó là chủ ý**: 2.x–8.x trùng nguyên
  văn Pāli với `an5.2` (2.1/2.2/2.4, 3.x, 4.x, 5.x, 8.x), `an5.14` (6.x, 7.x) và
  `an7.3` (1.x, 9.x, 10.x, 11.x) — tất cả đã có bản Việt trong kho. Theo BRIEF_VI3 §6, khi
  nhiều bài dùng cùng công thức Pāli thì phải dịch nhất quán theo bản đã có, nếu không bài
  kinh sẽ tự mâu thuẫn. Danh sách bảy sức mạnh (1.3) trùng nguyên văn `an7.3:1.5`; 10.x,
  11.x trùng nguyên văn `an7.3:2.x–3.x`.

  Tôi đặt 0.3 “Kinh Bảy Sức Mạnh” theo khuôn của bài kề `an7.5:0.3` “Kinh Bảy Loại Của
  Cải” (cùng phẩm Của Cải, cùng kiểu `Vitthata…sutta`); 0.2 dùng lại `an7.1:0.2`
  “1. Phẩm Của Cải”.

  12.2 `pasādaṁ dhammadassanaṁ` tôi dịch “sự thanh tịnh và sự thấy biết pháp” — KHÔNG dùng
  lại `an4.52:7.2–7.3` (“với niềm tin và giới hạnh, / niềm tin và kiến giải pháp”), vì bản
  đó parse lệch: lặp “niềm tin” hai lần và mất cả `pasāda` lẫn `dhammadassana`. Đây là
  lượt review tự bắt được; bản an4.52 không thuộc lát này nên tôi không sửa, chỉ ghi ở
  đây để coordinator xử lý nếu muốn.

  Dấu lược: 7.3 là khoá chỉ có `…pe…` (Pāli lược cả phần định tâm và sơ thiền), bản Việt
  giữ **đúng một** `…` và KHÔNG mở rộng; 7.4 (`catutthaṁ jhānaṁ`) dịch “chứng và an trú
  thiền thứ tư” như `an3.59:3.2`. 2.3 có `…pe…` nên tôi nén đúng chỗ lược, giữ “Đạo Sư của
  chư Thiên và loài người” như Sujato.

  Thuật ngữ (đều có tiền lệ): “sức mạnh của niềm tin/tinh tấn/hổ thẹn/kính sợ/niệm/định/tuệ”
  (19 lần dạng niềm tin); `hirī` = “hổ thẹn” (238), `ottappa` = “kính sợ” (79);
  “Thế nào là ba?” (191), “Là bảy nào?” (26), “Thứ tư.” (154).

  Triangulation 9.3 (thấp hơn các bài SN vì Pāli lược nhiều): Sujato phủ 9/9 khoá Pāli
  ≥40 ký tự (100%), nhưng ở các khoá `…pe…` **bản Anh đã ghim để trống** và nối câu qua chỗ
  trống (ví dụ 2.3, 8.2) — đó là giới hạn upstream, không phải sự đồng thuận về cách dịch.
  Ở những chỗ đó Pāli phải tự đứng vững và tôi dựa vào công thức đã có trong an5.2/an5.14.
  `vietnamese-current` vắng.

  Bị chặn cổng kỹ thuật (không được chạy `npm run validate|test|check|build`), tiêu chí 10
  ở **9.6**: đã xác minh JSON hợp lệ, 42/42 khoá, không orphan/rỗng, NFC, dấu lược khớp
  từng khoá (0 lệch), ngoặc kép cân 1/1, không `(…)` đứng một mình. Bốn lệnh npm để
  coordinator chạy.