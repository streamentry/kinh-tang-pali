  - >-
    **⚠ SỬA LỖI MẤT NỘI DUNG: `an6.3:1.4` — tôi bỏ mất vế cuối** `anuttaraṁ
    puññakkhettaṁ lokassā` (*ruộng công đức vô thượng của thế giới*). Đây là lỗi
    mất nội dung, không phải lỗi văn phong. Sửa lại, và cả `an6.4:1.4` (bản đầu
    còn lặp vế đó **hai lần** vì tôi nối thêm vào cả hai bài trong một vòng lặp
    chung).
  - >-
    **⚠ `an6.24:1.3` — tôi thêm một mục không có trong Pāli.** Pāli của `an6.24`
    có **sáu** mục, mục đầu là `samādhissa samāpattikusalo`; `an7.40:1.3` mới có
    mục trần `samādhikusalo` ở đầu (nên bảy mục). Bản đầu tôi dùng chung **một**
    danh sách bảy mục cho cả hai — tức bịa thêm một mục. Đã tách.
  - >-
    **⚠ `an6.104:1.3` — Pāli KHÔNG có `na` ở `ahaṅkārā ca me uparujjhissanti`**,
    đọc chữ thì thấy *“sự kiêu mình của tôi sẽ bám vào”* — ngược hẳn với việc
    bài liệt kê **sáu lợi ích**. Bản Anh Sujato dịch toàn bộ khối thành phủ định
    (*“My I-making will stop.”*). Tôi theo cách đọc phủ định và **ghi lại bất
    định này ở đây** thay vì im lặng. `atammayo` → *không còn bám víu* (0 tiền
    lệ trong khung này) · `ahaṅkāra` → *sự tự cao tự đại* · `mamaṅkāra` → *ý
    kiến tự phụ tự mãn*.
  - >-
