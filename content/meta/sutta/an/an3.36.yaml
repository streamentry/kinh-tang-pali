notes: |-
  Giải quyết draft 2026-10-12: lượt đọc đối kháng toàn bài (108/108 khoá, Pāli root đối chiếu với Sujato đã ghim và bài song song mn129/mn130 trong kho; tầng Việt hiện hành không có cho bài này, đây là giới hạn của bản chụp upstream chứ không phải lỗi văn bản).
  Blocker cũ (cắt ngắm tại an3.36:14.1) đã gỡ: khoá 14.1 của Pāli không có dấu lược và bản Việt hiện tại cũng không có `…` ở khoá này (các `…` còn lại đều ở 15.1–15.3, nơi Pāli có `…pe…`; `(…)` ở 15.4 khớp `(…)` của Pāli). Chỉ có một blocker, không có blocker nào khác bị giữ.
  Sửa lỗi nghĩa/thuật ngữ (accuracy fix): 1.5 ngục giữ → ngục tốt (74 khoá dùng ngục tốt, 8 khoá ngục giữ đều chỉ ở bài này); 2.4/6.4/9.4 bỏ chữ "gì cả" (Pāli chỉ nói nāddasaṁ, và người ấy đã thấy người già/bệnh/chết ở các khoá sau); 4.2/7.2/11.2 mahallaka = đã lớn tuổi (22 khoá, không phải "trưởng thành"); 4.3/7.3/11.3 jarādhammo… = "phải chịu già/bệnh/chết", bỏ cặp “ ” mà Pāli không có ở 4.3 và 11.3; 5.3/8.3/12.3 Taggha = "quả thật"; 5.4/8.4/12.4 bhātarā/bhaginiyā = anh em trai/chị em gái (không giới hạn anh/chị lớn), mittāmaccehi = bạn bè và đồng liêu, ñātisālohitehi = bà con quyến thuộc; 13.2 pañcavidhabandhana = ngũ xích (4/4 tiền lệ; "ngũ tấu" chỉ có ở bài này); 13.3 ayokhila = cọc sắt (4/4 tiền lệ), không phải giáo; 13.4/14.2/15.6 bỏ "ngay" và "thanh toán", byantīhoti = được tận cùng; 15.1 bỏ "treo" (Pāli chỉ nói nắm, chân lên đầu xuống); 15.2 rathe yojetvā = buộc vào cỗ xe, bắt chạy tới chạy lui (không phải chở/kéo lê); 15.4 đủ ba tính từ ādittā/sampajjalitā/sajotibhūtā, nồi đồng theo tiền lệ, (…) khớp Pāli; 15.5 paccamāno = bị nấu sùng sục trong bọt nhớt (7 khoá tiền lệ), tiriyaṁ = trôi ngang, không phải xoay tròn; 16–17 bỏ "thong thả", "nhiệt nóng" (Pāli không có chủ ngữ này), bỏ dấu nháy không có trong Pāli; 18.2 thêm kira/vividhā; 18.3–18.4 bhagavantaṁ = Đức Thế Tôn ấy (249 khoá), payirupāseyyaṁ = thân cận; 18.5 cấu trúc yadeva…tadeva; 19.2/19.4 bỏ "mờ mịt" và "khốn khổ" (không có trong Pāli), hīnakāyūpagā narā = những người đi đến cảnh giới thấp hèn; 20 thêm santo/idha, chia dòng đúng theo Pāli; 22.2 abhinibbutā = tịch diệt (như mn130:30.16), không phải "diệt tận"; 22.1 thêm te = họ; 1.6/1.7 deva = Đại vương, bỏ "Bạch"; bhante = thưa ngài; 3.2 đốm nám (tilakāhata), cong như kèo nhà (gopānasi), người nữ hay người nam (itthiṁ vā purisaṁ vā). Số khoá có lỗi nghĩa/thuật ngữ thật được sửa: khoảng 40/108.
  Số Pāli: āsītikaṁ = 80, nāvutikaṁ = 90, vassasatikaṁ = 100 tuổi; ekāha/dvīha/tīhamataṁ = chết 1, 2, 3 ngày; yojanasataṁ = 100 do-tuần; pañcavidha = 5 chỗ bị đóng cọc (hai tay, hai chân, giữa ngực = 5). Khớp.
  Kiểm cơ học: tập khoá Việt = tập khoá Pāli (108/108, đúng thứ tự); dấu nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch trên 108 khoá); `…` chỉ ở 15.1–15.3 (Pāli `…pe…`); 9 nhóm Pāli trùng nguyên văn trong bài (5.2–5.5/8.x/12.x và các câu hỏi lặp), 0 nhóm bản Việt khác nhau.
  Coverage English: Sujato phủ gần như toàn bộ; khoá có nội dung Pāli mà Sujato để trống là an3.36:14.2 (đoạn lặp lại nguyên văn 13.4/15.6, đã đọc kỹ từ Pāli, bản dịch tự đứng vững); không cần lấp, không cần mục gap. Tầng english-project: không có. Tầng vietnamese-current: không có cho bài này (chỉ có Pháp Cú); đối chiếu cách dùng với mn129/mn130.
  Bất định còn lại (không thêm vào thân kinh): (1) tiêu đề và thân bài giữ "sứ giả trời" cho devadūta theo tên phẩm đang dùng ở cả phẩm Devadūtavagga, trong khi mn83/mn130 dùng "thiên sứ" (23 khoá); (2) ngũ xích theo quy ước đã có, nghĩa đen pañcavidhabandhana là "năm cách trói buộc"; (3) vāsī tạm dịch "rìu nhỏ" (mn129/130 dịch "dao"); (4) bho ở 18.2 là hô cách/thán từ, tạm giữ "này các bạn" theo mn130; (5) chủ ngữ của pharitvā tiṭṭhati ở 17.4 không nêu trong Pāli, bản Việt để mở; (6) hīnakāya trong 19.4 có thể hiểu là "thân thấp hèn" hay "nhóm thấp hèn", chọn "cảnh giới thấp hèn" theo mn130:30.6.
