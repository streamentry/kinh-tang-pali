notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 22/22 = 100%**, không khoá nào bị bỏ trống, không cần ghi nhận gap. Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708: bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **Bài song song là `an10.2` (Cùng tên `Cetanākaraṇīyasutta`): 26 khoá trùng byte-for-byte; 23 cặp tôi dùng lại NGUYÊN VĂN.** Riêng `11.1` là chuỗi `X attho Y ānisaṃso` và `11.2` là câu kết, nên không trùng `an10.2`; tôi theo đúng nhịp và cấu trúc của `an10.2:2.x` cho cả hai.
  **3 khoá cố ý dịch khác `an10.2`, và đây là điểm quan trọng nhất của bài.** `1.2`, `1.3`, `2.1` trùng byte-for-byte `an10.1:1.2`, `an10.1:2.2`, `an10.2:1.4`; cả ba bản đó dịch `avippaṭisāra` thành *sự không sỡ hãi*, nhưng `abhaya` mới là không sỡ hãi — `avippaṭisāra` là **không hối tiếc**, đúng như Sujato (*no regrets*) và như `an11.3:2.3` (Pāli trùng, 127 lần *hối tiếc* trong tầng). `notes` của `an11.3` đã ghi nhận đúng lệch này và kêu đề người biên tập xem lại `an10.1`–`an10.5`. Theo thứ tự ưu tiên `skill/translation.md` §12, Pāli thắng, nên ở đây tôi dịch *không hối tiếc* và **không** sao chép lỗi của bài kia.
  **Tách rõ `nibbidā` và `virāga` thay vì gộp.** `8.2`, `8.3`, `9.1`, `9.2`, `9.3` dịch `nibbindā` là *chán ngại* và `virajjāmi` là *ly tham*, khớp `an11.3:2.8-2.9` và `an11.3:3.8-3.9` (cùng phẩm, Pāli trùng nguyên văn). `an10.2:1.23` gộp thành *ta chán nản, ta ly tham* trong một dấu nháy — làm mất đúng distinction mà Pāli nêu riêng ở `8.2` và `9.2`. Ghi lại vì đây là chỗ tôi **không** theo bài song song.
  **Dùng lại nguyên văn các cặp còn lại:** `0.2` theo 4/4 bản (1. Phẩm Nương Tựa) · `0.3` trùng byte-for-byte `an10.2:0.3` (Kinh Điều Đáng Ý Nghĩ) · `2.2` đến `7.3` và `10.2` theo `an10.2:1.5-1.21` và `:1.26` · `11.2` theo `an10.2:2.10` · `11.3` theo 245/249 bản cho `Dutiyaṁ.`
  **Thuật ngữ.** `avippaṭisāra` → không hối tiếc · `pāmojja` → hoan hỷ · `pīti` → hỷ · `passaddhi` → khinh an · `sukha` → lạc · `samādhi` → định · `yathābhūtañāṇadassana` → sự thấy biết như thật · `nibbidā` → chán ngại · `virāga` → ly tham · `vimuttiñāṇadassana` → giải thoát tri kiến · `kusalāni sīlāni` → những điều lành này (`an10.1:2.2`, `an10.2:2.9`). Tất cả đều có tiền lệ.
  **Bất định đã ghi.** `cetana` ở `na cetanāya karaṇīyaṁ` tôi dịch *không nên ý nghĩ* theo `an10.2` đã công bố, và `uppajjatu` thành *cầu mong cho ta có*; hai bên cùng một văn bản Pāli, giữ nguyên văn để hai bài không tự mâu thuẫn. Nếu sau này chọn *không cần phát nguyện* thì phải sửa cả hai bài cùng lúc.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
