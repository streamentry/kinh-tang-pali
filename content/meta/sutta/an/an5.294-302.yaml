notes:
  - >-
    **Dùng lại nguyên văn đã `published`:** `Sappurisasaṁsevo,
    saddhammassavanaṁ, yonisomanasikāro, dhammānudhammappaṭipatti` → *Sự phục sự
    thiện nhân, sự nghe Chánh Pháp, sự tác ý hợp lý, và thực hành theo pháp hợp
    pháp* (`an4.248:1.3`) cho `sn55.55:1.3` và `sn55.62:1.3` — **cùng Pāli** ·
    `pathavīdhātu … vāyodhātu` → *giới tánh đất, giới tánh nước, giới tánh lửa,
    giới tánh gió* (`an3.61:10.5`) cho `sn14.30:1.4` — bản đầy đủ của `an3.61`
    có **sáu** sở, kho lấy đúng bốn sở đầu · `chavi / maṁsaṁ nhāru aṭṭhi
    aṭṭhimiñja` → *da; thịt, gân, xương, tủy xương* (`an10.60:6.3`) cho
    `sn17.28:1.3` · `upādānakkhandha` → *uẩn của sự tham trữ* (`an10.60:4.4`) ·
    `lābhasakkārasiloka` → *sự được cho, được tôn kính và danh tiếng*
    (`an4.157:2.4`) · `abhibhūto` → *chế phục* (`an3.53:2.1`) · `niyato
    sambodhiparāyaṇo` + `avinipātadhammo` → *là hướng chắc chắn đến giác ngộ* +
    *có pháp không còn thoát lui* (PR #118 `sn55.29:1.3`) cho `sn48.26:1.5` ·
    `ariyasāvako sotāpanno` cho cùng chỗ · `mātugāmo` → *thân người* (PR #120) ·
    `pāṇātipātā paṭivirato …` → *kiêng tránh sát sinh…* (`an10.178:3.2`) và
    `surāmerayamajjappamādaṭṭhāna` → *chỗ ngồi giữa rượu, thịt, tửu và say*
    (`sn56.64:1.1`) cho `sn37.33:1.3` · `pariyesanā` → *sự tìm kiếm*
    (`an4.255:0.3`) · `paṭikuṭṭha` → *đáng chê* (`an4.29:1.3`) · `anusaya` →
    *thiên hướng* (PR #116) cho `sn45.175` · năm lậu (PR #121 `sn46.35:1.1`) cho
    `sn45.177` · `satisambojjhaṅgo … upekkhāsambojjhaṅgo` → *giác chi có nhớ
    tưởng … giác chi có bình thản* (PR #120) cho `sn46.9`, `sn46.19`, `sn46.22`,
    `sn46.34`, `sn46.36` · `nimuggaṁ` → *bị mắc kẹt* (PR #120) · `kassapassa
    sammāsambuddhassa pāvacane` → *hàng giảng pháp của bậc Chánh Đẳng Giác
    Kassapa* (PR #122) · `Gijjhakūṭa` (PR #120) · `sattā opapātikā` → *chúng
    sinh hóa sinh* (`an10.211:11.1`) · `Ekakanipāta` → *Bộ Một Bài Kinh*
    (`thag1.2:0.2`) · `Namo tassa Bhagavato …` → *Kính lạ Đức Thế Tôn…*.
  - >-
    **⚠ `sn45.165`–`sn45.177:1.2` — SÁU CÂU HỎI CÒN NGUYÊN TIẾNG PÃ-LI**
    (`Katamā tisso?`, `Katame cattāro?`, `Katame satta?`, `Katamāni pañca?` đứng
    nguyên trong bản dịch). Bản đầu tôi truyền thẳng chuỗi Pāli vào cột câu hỏi
    mà không dịch — loại lỗi mà chỉ đọc song song mới thấy, vì `validate` không
    kiểm tra ngôn ngữ. Đã sửa cả sáu.
  - >-
    **⚠ `sn17.31`–`sn17.34:1.3` — CỤM BỊ LẶP HAI LẦN:** bản đầu cho *“Lãnh trong
    cõi thế gian có lợi và được tôn kính, được danh tiếng, **do cõi thế gian có
    lợi và được tôn kính, được danh tiếng** chế phục…”* — vì hằng `TU_BỐN` của
    tôi đã chứa trọn danh từ rồi tôi lại tiền tố thêm một lần nữa. Đã sửa.
  - >-
    **⚠ `an9.66`/`68`/`69:1.4` — TÔI THỪA CHỮ “này”.** Pāli `1.1` là `Pañcimā …
    nā` (có “này”) nhưng `1.4` là `imāni kho, bhikkhave, pañca macchariyāni`
    (**không** có). Tôi dùng chung một tên cho cả hai vế nên thêm một chữ không
    có trong nguồn. Đã tách hai tên.
  - >-
    `macchariya` → *hạnh khiêm tốn*. ⚠ **Lệch tiền lệ cần người biên tập
    quyết:** `an10.267-746:1.8` (đã `published`) dùng *keo kiệt* và
    `an4.304-783:1.1` dùng *hằn học về sự keo kiệt*. Trong `an5.254` và `an9.69`
    `macchariya` là **hạnh không đáng chê** với năm thành phần (sống tại, gia
    đình, sự được cho, khen ngợi, giới luật) — *keo kiệt* là nghĩa của `maccha`,
    không phải `macchariya`. Tôi dịch đúng nghĩa và ghi lại ở đây, không sửa bản
    đã xuất bản. `āvāsa` → *sống tại* · `kula` → *gia đình* · `lābha` → *sự được
    cho* · `vaṇṇa` → *công đức của người khác* (0 tiền lệ cho khung này).
  - >-
    `an5.294-302` — chín chúng trần trụi, tất cả **0 tiền lệ, đặt mới**:
    `nigaṇṭho` → *kẻ Nigantha* (giữ tên riêng theo `an3.74:1.3`) · `muṇḍasāvako`
    → *đệ tử của bậc trần trụi* · `jaṭilako` → *kẻ để tóc búi rối* ·
    `paribbājako` → *du sĩ* (`an3.64:1.8` *du sĩ Sarabha*) · `māgaṇḍiko` → *kẻ
    ăn xin nơi đường* · `tedaṇḍiko` → *kẻ bám thói quen* · `āruddhako` → *kẻ leo
    lên* · `gotamako` → *kẻ tự nhận theo Goutama* · `devadhammiko` → *kẻ lễ bái
    theo tà pháp*.
  - >-
