notes:
  - >-
    **Hai mươi bốn lỗi chấm câu của Pāli: mở dấu `“` rồi không đóng.** Đếm được
    14 bài: `an5.242`, `an5.243`, `an5.246`, `an5.247`, `an7.86`, `an9.48`,
    `an9.50`, `an9.53`, `an5.55`… nói rõ là `an9.55`, `an9.56`, `an9.57`,
    `an9.58`, `an9.59`, `an9.60`. Ở mỗi bài, `1.1` mở `“` và không segment nào
    đóng lại (độ sâu kép cuối = 1). Tôi đóng ngay sau mệnh đề cuối của `1.1` để
    người đọc không gặp dấu ngoặc treo, và **đây là cố ý lệch 14 segment** — bộ
    kiểm tra báo đúng mười bốy chỗ ấy, không phải sót sót. Pāli không bị sửa.
  - >-
    Cụm cuối là `iddhipādavasena` — *bốn Căn Tiến Dẫn* — **khác** `an9.74-81`.
    `iddhipāda` → *Căn Tiến Dẫn* (0 tiền lệ, đặt mới; kho chỉ có `iddhi` trong
    `iddhividha` → *thần thông*, nghĩa khác). Xem ghi chú của `an9.74-81` về lỗi
    tôi đã phạm và đã sửa.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi
    sang cách dịch đa số toàn tầng — `9. Iddhipādavagga` → «9. Phẩm Như Ý Túc».
    Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm;
    cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối
    tiêu đề, không đổi nghĩa segment nào.
  - >-
    Quyết định hội đồng biên tập 2026-10-16: B3 — an9.84-91:0.3, 1.1 (iddhipāda
    = “như ý túc”; sửa “phẩm Giảng Lửa”, “bốn Căn Tiến Dẫn” (Pāli
    satipaṭṭhānavagga = phẩm Niệm Xứ) và tiêu đề Nīvaraṇasuttādi = “Kinh Triền
    Cái, v.v.”).
