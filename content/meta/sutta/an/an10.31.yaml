notes:
  - >-
    Bài mở đầu chương, và là bài **đặt tiền lệ cho cả chương**: chín bài sau
    cùng hỏi Đức Thế Tôn theo đúng khuôn `Katihi nu kho, bhante, dhammehi
    samannāgato bhikkhu … sammannitabbo”ti?` → "Bạch Thế Tôn, vị tỳ-kheo hội đủ
    mấy pháp thì … ạ?" — dùng lại nguyên văn ở cả chín bài.
  - >-
    `atthavase paṭicca` → **"vì lý do"** (7 segment tiền lệ; `an3.43:1.1` dùng
    `atthavase` là "vì lợi ích"). `pātimokkha` giữ nguyên **"Pātimokkha"** theo
    46 segment tiền lệ (`an3.73:2.4` "sống hộ trì Pātimokkha") — không dịch "Ba
    Giới" vì corpus đã chọn giữ thuật ngữ này ở mọi nơi.
  - >-
    **Bốn cụm trong mười mục đích chưa có tiền lệ (0 segment)**, ghi lý do vì
    không có số đếm được: `Saṅghasuṭṭhu` → *giữ Tăng đoàn tịnh hòa*;
    `saṅghaphāsu` → *giữ Tăng đoàn không chia rẽ* (cặp đối nghịch, khác chương
    19 ở chỗ “không chia rẽ” là giữ cho Tăng chứ không phải để tránh chia);
    `saddhammaṭṭhitiyā` → *cho chánh Pháp đứng vững*; `vinayānuggahāya` → *nâng
    đỡ vinh pháp*. Còn `diṭṭhadhammika āsava` → *lậu rõ ràng theo Pháp* và
    `appasannānaṁ pasādāya` / `pasannānaṁ bhiyyobhāvāya` → *làm cho tin chân trở
    lại / thêm* theo `an4.245:1.3`.
  - >-
    `Upālivagga` → **"Phẩm Upāli"** (khác `an3.32` và `mn56` cùng tên bài "Kinh
    Upāli" — đây là tên phẩm, không phải tên bài).
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
