notes:
  - >-
    **`abhiññāya` → "để chứng ngộ", `bhāvetabbā` → "cần được tu tập"**: dùng
    nguyên văn từ `an3.183-352:1.1` (`Rāgassa … abhiññāya tayo dhammā
    bhāvetabbā` → "Để chứng ngộ tham, này các tỳ-kheo, ba pháp này cần được tu
    tập"). `Katame dasa?` → "Thế nào là mười?" theo `Katame tayo?`/`Katamā
    pañca?` trong cùng corpus.
  - >-
    Danh sách là Bát chánh đạo cộng `sammāñāṇaṁ` và `sammāvimutti`, **theo
    nguyên văn `an10.103:2.3`**: chánh kiến, chánh tư duy, chánh ngữ, chánh
    nghiệp, chánh mạng, chánh tinh tấn, chánh niệm, chánh định, chánh trí, chánh
    giải thoát. `sammāsaṅkappo` → "chánh tư duy" theo `an10.103`, không phải
    "chánh ý chí".
  - >-
    Đây là bài ngắn nhất của chương, và là nơi `sammāñāṇaṁ` → **"chánh trí"**
    được xác nhận lần nữa: `an4.206:4.2` ghi "chánh tri", đã ghi là ngoại lệ tại
    `docs/translation-notes/terminology-micchatta-list.md`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
