notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** `10.2` bị cụt còn *Thế nào là con đường và đạo lộ ấy?* (34 ký tự cho 164
  ký tự Pāli), mất vế `Katamo ca…maggo katamā ca paṭipadā` và nhất là vế định nghĩa
  `pahānāya samatikkamāya saṁvattati`. **Không phải dương giả**: Pāli và Việt đều là câu
  hỏi, nhưng câu hỏi Việt thiếu hẳn vốn từ định nghĩa mà nó hỏi, và không có dấu `…` nào
  đánh dấu chỗ bị cắt. Đã viết lại theo đúng văn bản của `10.1`.
