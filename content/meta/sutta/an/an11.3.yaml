notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim ở commit 11c9d708. Không có bản Việt tham khảo: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên tầng `vietnamese-current` không phủ bài này và triangulation chỉ dựa trên Pāli + Sujato.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  0.2 `Nissayavagga` dùng nguyên văn an11.6, an11.7, an11.8: 1. Phẩm Nương Tựa. 0.1 giữ Aṅguttara Nikāya theo đa số trong chính an11 (an11.6, an11.8, an11.15, an11.982 và các bài gộp), chỉ 10 tệp an dùng Tăng Chi Bộ không chữ Kinh.
  an10.3 là bài song song gần như trùng nguyên văn (cùng chuỗi dussīla … avippaṭisāra … vimuttiñāṇadassana, cùng ẩn dụ cây), nên dùng lại khuôn của an10.3 cho 1.1–1.10 và 3.1–3.10; an8.81 cho ví dụ cây ở 2.1 và 4.1.
  Một điểm phải lệch tiền lệ có chủ đích: an10.3 và an10.1–10.5 dịch avippaṭisāra là sự không sợ hãi, nhưng đó là abhaya, không phải avippaṭisāra; avippaṭisāra là không hối tiếc. Cùng tầng đã dùng đúng là không hối tiếc ở an5.41:6.3 và an5.167. Ở đây dịch đúng theo Pāli và đánh dấu là khác biệt có chủ đích, không phải lỗi soát trôi dạt; đề người biên tập xem lại an10.1–10.5.
  Vì cùng lý do, ở đây tách rõ nibbidā (sự chán ngại) và virāgo (ly tham) theo đúng Pāli, trong khi an10.3 gộp thành nibbidāvirāgo là một chữ. Chán ngại đếm 66 lần, giải thoát tri kiến 67 lần, thấy biết như thật 54 lần trong tầng.
  hatūpanisaṁ hoti và upanisasampanno hoti dịch là hủy hoại nền tảng của và đã đầy đủ nền tảng của, theo đa số (nền tảng 259 lần so với điều kiện thiết yếu 18 lần trong tầng).
  `pheggu` dịch là gỗ mềm theo mn35:22.4; an8.81 dịch là giác gỗ và an10.3 là phần mềm, cả hai đều khó hiểu hơn gỗ mềm.
  Dấu lược: 2.1 và 4.1 mỗi khoá có HAI …pe… nên bản Việt giữ hai …; 2.3 và 4.3 mỗi khoá một …. Đã đối chiếu lại bằng hàm lược của harness.
  Coverage tầng Anh trên Pāli có nội dung (26 segment) là 26/26 = 100%. Không cần ghi nhận gap.
