notes: |-
  Khuôn cùng phẩm: an9.48:1.1 và an9.50:1.1 (anh hiền giả 22 lượt).
  parinibbāna → Bát-niết-bàn (20 lượt), giữ distinction với nibbāna →
  Niết-bàn ở an9.48; hai từ Pāli khác nhau nên hai chữ Việt khác nhau là đúng,
  không phải lệch khuôn.
  Bất định đã phân xử: Sāmaññavagga được Sujato dịch là Similarity, nhưng
  an9.48:0.2/an9.50:0.2 cùng phẩm đã dùng 5. Phẩm Sa-môn; theo tiền lệ
  cùng phẩm để cả phẩm nhất quán, Pāli sāmañña vốn đa nghĩa.
  Đoạn …pe… lược phần đuôi đã có ở bài mẫu nên mở rộng theo khuôn;
  Sujato cũng mở rộng tương tự (Reverend, they speak of full extinguishment).
  Không có bản Việt hiện hành để đối chiếu; triangulation 8.5.
  technical 9.5 vì agent lát không được chạy npm validate, mới chỉ qua
  chốt _hvi (đủ khoá, NFC, ngoặc, dấu lược).
