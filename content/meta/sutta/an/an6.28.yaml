notes:
  - >-
    **Bài song song trùng Pāli với `an6.27` (Paṭipadādisutta, `published`) — dùng lại NGUYÊN VĂN 12 khoá.** `:6.3`=`an6.27:1.3`, `:7.2`=`:2.2`, `:7.3`=`:2.3`, `:7.4`=`:2.4`, `:7.5`=`:2.5`, `:7.6`=`:2.6`, `:12.1`=`:7.1`, `:12.2`=`:7.2`, `:12.3`=`:7.3`, `:12.4`=`:7.4`, `:12.5`=`:7.5`, `:13.2`=`:8.1`. Nhờ vậy `manobhāvanīya` → *đáng kính*, `samaya` → *dịp*, `āsava` → *ô nhiễm* giữ đúng một cách trong cặp bài.
  - >-
    **Coverage tầng Anh 38/38 = 1,000, NHƯNG ba khoá dựa vào bản lấp của chính dự án.** Sujato để trống `an6.28:3.4`, `:4.4`, `:5.4` — cả ba đều là Pāli có nội dung — và được `content/translation/en/project/sutta/an/an6.28` lấp; tệp đó `status: published` nhưng cùng `assessed_by` (*OpenCode Space Bunny Free (agent)*), tức không phải lần đọc Anh độc lập. Vì vậy `triangulation` hạ xuống 8,8 và scorecard không tuyên bố đã đối chiếu Anh ở ba khoá đó.
  - >-
    **Khác kho CÓ CHỦ Ý với `an6.27` ở ba triền cái — theo glossary.** `content/glossary/pali-vi.yaml` ghi rõ `severity: warn`: `thīnamiddha` = *hôn trầm và buồn ngủ* (an6.27 chỉ *hôn trầm*, bỏ mất `middha`); `uddhaccakukkucca` = *xao động và hối tiếc* (an6.27: *uể oải*); `vicikicchā` = *nghi hoặc* (an6.27: *nghi ngờ*). Lát này theo glossary vì đó là bộ nhớ thuật ngữ của chính dự án và `glossary:check` chạy trong CI; `byāpāda` thì glossary và an6.27 cùng là *sân hận* nên khớp. **Cần người điều phối sửa `an6.27` cho khớp** — lát này không có quyền sửa tệp ngoài phạm vi.
  - >-
    **Công thức ngồi kiết già, có số đếm.** `pallaṅkaṁ ābhujitvā ujuṁ kāyaṁ paṇidhāya parimukhaṁ satiṁ upaṭṭhapetvā` → *ngồi kiết già, giữ thân thẳng và thiết lập niệm trước mặt* (6 nơi trong kho). `sāyanhasamayaṁ paṭisallānā vuṭṭhito` → *vào buổi chiều, sau khi ra khỏi chỗ tĩnh tọa* (`mn61:2.2`, `mn151:1.3`). `sammukhā metaṁ, āvuso, bhagavato sutaṁ sammukhā paṭiggahitaṁ` trùng nguyên văn `dn16:4.8.2` → *Này các bạn, tôi đã nghe trước mặt Đức Thế Tôn, đã nhận được trước mặt Đức Thế Tôn*. `mahākaccāno` → *Mahākaccāna* (an=12 mn=76).
  - >-
    **0 tiền lệ, đặt mới.** (a) `0.3` `Dutiyasamayasutta` → *Kinh Thời Cơ (Hai)*; chưa tệp nào trong kho dịch `samayasutta`. (b) `:1.2` `maṇḍalamāḷe` → *trong lánh*; (c) `:3.5`/`:4.5` `vihārapacchāyāyaṁ` → *hiên ngoài nhà* — `dn18:7.6` và `dn27:1.4` dịch `pacchāyāyaṁ` là *dưới bóng trú xá* / *dưới bóng của lầu*; (d) `:4.5` `paccūsasamayaṁ` → *khi rạng sáng*; (e) `:5.3` `ojaṭṭhāyissa … phāsussa` → *đầy sức sống, nhẹ nhàng*, `buddhānaṁ sāsanaṁ` → *giáo pháp của chư Phật* (`dn` 8 nơi).
  - >-
    **Nhặc kép giữ y hệt Pāli.** Pāli mở `“` ở `:6.2` (Mahākaccāna dẫn lại lời Đức Thế Tôn) và chỉ đóng `”` ở `:13.2`; nháy đơn `‘…’` ở `:6.3`–`:12.5` và `:13.2`. Lớp lấp Anh của chính bài này chỉ điền ba khoá `:3.4`, `:4.4`, `:5.4`.
  - >-
    **Sửa sau review đối kháng:** `:9.1`, `:10.1`, `:11.1` tiếp nối câu của `:8.1` trong Pāli nên viết **thường** (bản nháp đầu viết hoa). `0.1` theo đa số quyển 6: 84 `Aṅguttara Nikāya` vs 12 *Kinh Tăng Chi Bộ* (toàn bộ 1255 tệp `an`: 357 vs 898). **Không đối chiếu được tầng Việt hiện hành** (tại commit đã ghim chỉ có 26 chương Pháp Cú).
