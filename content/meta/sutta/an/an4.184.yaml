notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 5.4, 5.6, 9.4, 9.5, 9.6 (cùng 5.1, 5.5, 9.1 trong bài) — *điều thiện lành / điều khéo léo / điều ô uế* → *điều lành / điều thiện / điều tội lỗi* (`kalyāṇa` / `kusala` / `kibbisa`; khớp `mn129:5.5`, `ne37:451.4`, `iti30`, `iti31`), và viết lại 5.6, 9.6 thành *Những ai … đi đến cõi nào, sau khi chết tôi sẽ đi đến cõi ấy* theo cấu trúc `yāvatā … gati taṁ gatiṁ`. Giữ nguyên *hung bạo* (`luddha`), *điều che chở* (`bhīruttāṇa`) và cách xưng *tôi* của lời tự nghĩ (đồng nhất cả bài) thay vì *ta* của `mn129`.
