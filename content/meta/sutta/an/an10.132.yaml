notes:
  - >-
    Bản dịch này là **tiền lệ** cho khoảng chín mươi bài Dasamasutta còn lại của phẩm Thanh Tịnh
    (AN 10), vì chúng dùng chung ba công thức: “Dasayime, bhikkhave, …” / “Katame dasa?” /
    “ime kho, bhikkhave, dasa …” / “Dasamaṁ.”. Ba quyết định được chốt ở đây và các bài
    sau phải theo:
    (1) `micchattā` dịch “tà” — theo `dn34:2.3.53` (“Dasa micchattā—” → “Mười tà:”).
    (2) `Dasayime` dịch theo mẫu mở đầu đã có 347 lần trong corpus: “Này các tỳ-kheo, có …”;
    động từ `atthi` bị lược trong Pāli nên thêm “có” là đúng, không phải bịa.
    (3) `Dasamaṁ.` dịch “Thứ mười.” — thiết lập sẵn, ví dụ `an3.101:8.3`.
  - >-
    `kho` (hạt nhấn) và `ti` (hạt dẫn lời dẫn) bị lược. Cả hai là tiểu từ diễn đạt, không mang
    nội dung; corpus xử lý `ti` như vậy ở `an1.1`.
  - >-
    **Không tham khảo được tầng Việt hiện hành cho Tăng Chi Bộ.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên thuật ngữ không đối chiếu được với Hòa thượng Thích Minh
    Châu ở bài này. Đó là giới hạn của bản chụp upstream, đã được ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    **Thuật ngữ còn bất đồng trong corpus, chưa sửa ở đây.** Cùng một danh sách mười `micchattā`
    đang được dịch khác nhau: `dn34:2.3.54` dùng “tà mạng” và “tà trí”, còn `an4.205:2.2` và
    `an4.206:2.2` dùng “tà mệnh” và “tà tri”. Bài này theo `dn34`, vì (i) “tà mạng” xuất hiện
    12 lần còn “tà mệnh” không xuất hiện ở đâu khác, và (ii) `ājīva` là *sinh tài*, mà “mệnh” nghĩa
    là *số phận* — nên “tà mệnh” là ngoại lệ sai nghĩa. Tương tự, `ñāṇa` được corpus dịch
    “trí” (7 lần), không phải “tri”. **Hai file `an4.205` và `an4.206` đang `published` với hai
    thuật ngữ sai; việc sửa lại chúng là thay đổi lịch sử biên tập nên không gộp vào lượt này.**
    Xem `docs/translation-notes/terminology-micchatta-list.md`.
