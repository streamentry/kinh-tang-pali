notes: |-
  COVERAGE ENGLISH — ĐO THẬT, mẫu số KHÔNG rỗng. Mẫu số = 96 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) theo `source/layers.yaml`; tầng `english-sujato` đã ghim phủ 95/96 = 0,9896, ngưỡng 0,8 cần tối thiểu 77 khoá. Khoá duy nhất Sujato để trống là `an10.99:3.7`. Khoá này được lớp lấp `english-project` (published) đóng nên cổng tính 96/96, nhưng lớp lấp do người khác chấm và không phải đối chiếu Anh độc lập: đối chiếu Anh độc lập chỉ là 95/96. Tầng `vietnamese-current` vắng tại commit đã ghim (bilara chỉ có Pháp Cú). Bản Việt nguyên bài của Hòa thượng Thích Minh Châu (sc-data, Bình Anson chuẩn bị văn bản) chỉ được đọc như tra cứu toàn văn, không căn lề theo khoá. Không cần entry `reference-gaps.yaml`.

  BỐ CỤC VÀ NHÁY. Bài có 148 khoá: `0.1`–`0.3` là đầu đề, `1.1`–`38.4` là thân. Nháy kép (Phật nói): `2.1`→`5.3`, `6.1`→`6.4`, `7.1`→`7.9`, `8.1`→`24.4` (một đoạn dài), `25.1`→`26.3`, `27.1`→`28.3`, `29.1`→`31.3`, `32.1`→`35.3`, `36.1`→`37.3`, `38.1`→`38.3`; câu của Upāli là nháy kép trọn trong một khoá (`1.2`, `5.4`, `6.5`, `7.10`, `24.5`, `26.4`, `28.4`, `31.4`, `35.4`, `37.4`). Nháy đơn mở-đóng trong một khoá: `2.5`, `2.6`, `4.8`, `4.12`, `4.13`, `24.4`, `26.3`, `28.3`, `31.1`, `31.3`, `33.1`, `34.1`, `35.1`, `35.3`, `37.3` (sáu khoá `24.4`–`37.3` kết bằng nháy đơn rồi nháy kép đóng lời Phật); mở ở một khoá và đóng ở khoá sau: `3.4`→`3.5`, `4.3`→`4.5`, `9.4`→`9.6`. Nháy đơn/kép khớp Pāli ở đủ 148/148 khoá.

  DẤU LƯỢC. Pāli có 12 khoá mang `…` hoặc `…pe…`: `7.4`–`7.6`, `20.3`–`20.6`, `26.1`, `28.1`, `30.1` (hai chỗ), `33.1`, `34.1`. Mỗi `…pe…` thành đúng một `…`; ba khoá Pāli kết `…pe….` (`30.1`, `33.1`, `34.1`) kết ` ….`. Pāli không có `(…)` ở khoá nào nên Việt cũng 0. Số dấu lược mỗi khoá bằng Pāli (0 lệch / 148).

  SỐ PĀLI — TỰ TÍNH, KHÔNG CHÉP. (1) `sattaratano vā aḍḍhaṭṭharatano vā` (`3.2`): `satta` = 7; `aḍḍhaṭṭha` = nửa-của-thứ-tám = 8 − ½ = 7½, không phải 8; cùng cấu tạo `aḍḍhaṭṭhamaratana` ở `ud4.4:4.2`, `ud4.4:6.4`, `sn16.10:9.1` đã dịch *bảy thước hay bảy thước rưỡi*. Viết *bảy thước hay bảy thước rưỡi*. Bản Thích Minh Châu ghi *bảy thước hay tám thước*; Sujato quy ra ba mét hoặc ba mét rưỡi, tức cũng 7 và 7½ ratana, nên theo Pāli và Sujato. (2) `pañcahi kāmaguṇehi` (`7.2`) = năm; `pañca nīvaraṇe` (`24.1`) = năm, đối chiếu `23.1`–`23.5` đúng năm triền cái (tham, sân, hôn trầm–buồn ngủ, trạo hối, nghi): 5 = 5. (3) Thứ tự thiền: `paṭhamaṁ` (`24.2`) = sơ thiền, `dutiyaṁ` (`26.1`) = nhị thiền, `tatiyaṁ` (`28.1`) = tam thiền, `catutthaṁ` (`30.1`) = tứ thiền; rồi bốn vô sắc xứ và diệt thọ tưởng ở `31.1`, `33.1`, `34.1`, `35.1`, `37.1`. Có sáu cặp hỏi-đáp `Taṁ kiṁ maññasi, upāli` ở `24.3`–`24.5`, `26.2`–`26.4`, `28.2`–`28.4`, `31.2`–`31.4`, `35.2`–`35.4`, `37.2`–`37.4`, cộng ba cặp ở `5.2`–`5.4`, `6.3`–`6.5`, `7.8`–`7.10`: chín lần Pāli, chín lần Việt. (4) `Navamaṁ` (`38.4`) = *Thứ chín*, theo 261/264 khoá Pāli `Navamaṁ.` đã dịch (2 khoá *Bài thứ chín*, 1 khoá thừa khoảng trắng). (5) Số trong đầu đề: `10. Upālivagga` = *10. Phẩm Upāli*; số bài `10.99` giữ nguyên.

  TIỀN LỆ — ĐO TRÊN TẦNG. 40 khoá ≥ 40 ký tự của bài có Pāli trùng nguyên văn với khoá đã dịch ở bài khác (246 cặp); 33 khoá trong số đó dùng lại nguyên văn ít nhất một bản; Việt khác ở 165/246 cặp vì cùng một Pāli công thức trong tầng đang có nhiều cách dịch, nên đây là chọn bản gần nhất chứ không phải lỗi. Dùng lại nguyên văn: `1.1` (`an10.31:1.1`, cùng khung Upāli); `9.1`–`9.6` và `10.1` (bảy khoá liền, `mn125:14.1`–`14.7`); `8.2` (15 bản) và `8.3` (10 bản); `7.3`, `7.7`, `18.3`, `18.4` (`mn38`); `17.1` (`dn2:44.7`); `18.9`, `18.12`, `18.14`, `18.15`, `18.17`, `18.18` (`mn27:13`); `19.5`, `20.1`, `20.7`, `21.1`, `24.1` (`mn51`, `mn101`, `mn38`); `22.2` (`mn122`, 3 bản); `22.3` (`an9.40:4.5`); `23.1`–`23.5` (`mn101:37`). Bảy khoá ≥ 40 ký tự có Pāli trùng nhưng Việt không trùng mọi bản, mỗi khoá có lý do: `13.1` (5 cặp, 5 cách dịch khác nhau, chưa có đa số) · `14.1` (6 cặp, 4 cách) · `18.1` (3 cặp, 2 cách; cả hai đều lủng củng) · `18.6` (*vàng bạc*: 16/25 khoá dùng đúng; `mn38`/`mn51` thêm *và tiền*, `mn27` *vàng và tiền*) · `18.19` (xem dưới) · `20.9` (đổi *hộ trì* thành *phòng hộ* cho đồng nhất cùng `saṁvara` ở `20.2`, `20.8`, `22.1`) · `24.2` (*do ly dục sinh* theo `mn27`/`mn38`, không viết *do ly sinh*). Trùng nội bộ: 10 nhóm Pāli trùng trong bài, Việt giống ở 7 nhóm; hai nhóm khác thật là `2.6`/`4.8`/`4.13` (chủ thể *người ấy* hay *nó*) và `3.3`/`4.2` (*con voi ấy* / *con thỏ hay con mèo ấy*); một nhóm `3.5`/`4.5` chỉ khác hoa đầu câu theo Pāli.

  THUẬT NGỮ — KÈM SỐ ĐẾM. `abhikkantataro ca paṇītataro ca` → *tuyệt vời hơn và thù thắng hơn* (24 khoá, `mn79`/`mn80`; *vi diệu hơn và tối thượng hơn* 10 khoá ở `an3.21`; *thù thắng hơn và vi diệu hơn* 6 khoá ở `an4.95`/`an4.100`); chọn bản đa số. `araññavanapatthāni pantāni senāsanāni` → *những trú xứ xa vắng nơi rừng sâu* (`mn4`), `paṭisevati` → *lui tới* (35 khoá so với 14 khoá *sống tại*). `Durabhisambhava` → *khó kham nổi* (`mn4:2.8`, `2.11`, `3.2`; `an2.2` ghi *khó thành* trong ngữ cảnh khác). `tassetaṁ pāṭikaṅkhaṁ` → *có thể dự đoán* (`mn5`, 8 khoá). `vihāro` → *sự an trú*. `anuppattasadattha` → *đạt được mục đích của mình* (15 khoá, gồm 11 + 2 + 2; *mục đích tối thượng* 14 khoá thuộc công thức A-la-hán, ở đây không dùng vì `sa-` là *của mình*). `attabhāvo` → *thân* (7 khoá; `an3.34` ghi *thân báo* trong ngữ cảnh nghiệp). `hatthināgo` → *voi chúa* (3 khoá `ud4.5`; 3 khoá `mil5.4.7` ghi *con voi*). `kāmaguṇa` → *năm dục lạc* (9 khoá họ *dục lạc*, `dn14`, `dn2`, `dn1`; 11 khoá *dục trưởng dưỡng*, `dn19`, `mn75`, `sn55.1`): chọn *dục lạc* vì *trưởng dưỡng* là Hán–Việt cổ khó hiểu (`skill/translation.md` §5). Danh sách đồ chơi (`vaṅkakaṁ ghaṭikaṁ mokkhacikaṁ ciṅgulakaṁ pattāḷhakaṁ rathakaṁ dhanukaṁ`) giữ đủ bảy món theo `mn38:28.2` ở `6.2`. Cặp `kaṇṇasandhovikaṁ`/`piṭṭhisandhovikaṁ khiḍḍaṁ kīḷati` không có tiền lệ nào trong tầng (0 khoá); dịch sát chữ *chơi trò rửa tai / chơi trò rửa lưng* (Sujato *play around while washing his ears and back*; Thích Minh Châu *chơi trò chơi rửa tai/lưng*).

  BẤT ĐỊNH — GHI Ở ĐÂY, KHÔNG ĐƯA VÀO THÂN KINH. (1) `Ekatte haranti maññe…` (`2.3`): ở `mn4:2.8`–`2.9` (cùng Pāli, cắt khoá khác) `ekatte` đứng cuối câu trước và được hiểu *trong độc cư*; ở bài này SuttaCentral cắt `Ekatte` ngay đầu `2.3`, và Sujato dịch *Staying alone, the forests seem to rob the mind*, tức gắn `ekatte` với `haranti`. Viết *Khi ở một mình, rừng sâu dường như cuốn mất tâm trí…*; nghĩa cả đoạn không đổi giữa hai cách đọc. (2) `uplavissati` (`2.6`, `4.8`, `4.13`): Sujato *float away*; Thích Minh Châu *nổi lên (mặt nước)*. Viết *trôi nổi*: Pāli đối `saṁsīdissati` (chìm xuống) với `uplavissati`, nên *nổi lên mà không đứng được* là nghĩa đang được dùng; độ chắc vừa phải. (3) `ko cāhaṁ, ko ca hatthināgo` (`4.3`): chữ nghĩa là *Ta là ai, con voi chúa là ai*; Sujato *What difference is there between me and a bull elephant?*. Dịch sát chữ, ý tự lộ qua ngữ cảnh. (4) `no ca kho tāva anuppattasadatthā viharanti` (`25.1` và bốn khoá trùng): bản Thích Minh Châu dịch đoạn này kèm chú thích trong ngoặc, đọc *cho đến khi mục đích chưa đạt, họ vẫn trú (ở đó)* ở đoạn 8 rồi *họ sẽ không trú nếu mục đích chưa đạt* ở đoạn 9–14, tức chính nguyên bài của Hòa thượng đọc hai chiều. Pāli: `anuppatta` là quá khứ phân từ *đã đạt*; `no ca kho tāva` là *vẫn chưa*; `38.1` bỏ `no ca kho tāva` và nói *đã đạt*. Viết *vẫn chưa đạt được mục đích của mình* theo Sujato và cấu tạo Pāli. Đây là chỗ nghĩa đen khó hòa với văn cảnh nhất của bài, nhưng không đổi giáo nghĩa: Đức Phật khuyên Upāli ở trong Tăng đoàn. (5) `nelā` (`16.1`): *không lầm lỗi* theo cách đọc `aneḷa`; Sujato *mellow*, `mn38` *nhẹ nhàng*, `mn27` *êm dịu*; người biên tập nên cân nhắc nếu thống nhất toàn tầng. (6) `kevalā paripūrā bālakhiḍḍā` (`5.3`): `bāla` vừa là *trẻ dại* vừa là *ngu*; viết *trò chơi trẻ dại* bao cả hai, và `paripūrā` giữ trong cụm *hoàn toàn, trọn vẹn*. (7) `kīḷeyya` (`3.6`–`3.7`) và `pakkhandeyya` (`4.6`) là optative; dịch *có thể…* ở voi và *lao vào* ở thỏ/mèo theo ngữ cảnh giả định. (8) `Idha kho pana vo` (`8.1`): `vo` không dịch riêng, *ở đây* gánh nghĩa. (9) Danh sách `cakkhuviññeyyehi rūpehi iṭṭhehi kantehi manāpehi piyarūpehi kāmūpasaṁhitehi rajanīyehi` (`7.3`, `7.7`): chọn `mn38:29.3`/`29.7` (đủ sáu tính từ) hơn `mn75` (9 khoá, chỉ năm tính từ cho sáu từ Pāli).

  KHÁC BIỆT ĐÃ PHÂN XỬ — `18.19`: Pāli `chedana-vadha-bandhana-viparāmosa-ālopa-sahasākāra` có sáu thành tố. `mn27:13.26` viết *cắt xẻo, giết người, bắt cóc, cướp bóc, trấn lột và bạo lực* (không có *trói*); `mn38:33.26` viết *chặt tay chân, giết người, trói buộc, cướp giật, trộm cướp và dùng bạo lực*. Dịch *cắt xẻo, giết hại, trói buộc, cướp đường, cướp phá và bạo lực* theo `dn30:2.28.2` (cùng cặp *cướp đường* cho `viparāmosa` và *cướp phá* cho `ālopa`), giữ đủ sáu mục.

  KIỂM CHỨNG. In cặp Pāli↔Việt cả 148 khoá và đọc đối kháng: tập khoá Việt = tập khoá Pāli (148 = 148), thứ tự khoá giống Pāli, nháy đơn/kép khớp từng khoá (0 lệch / 148), dấu lược khớp từng khoá (0 lệch), NFC sạch, không khoá rỗng, không Pāli lọt sang Việt (trừ tên riêng Upāli và Māra), không khoảng trắng thừa. Ba chỗ bản nháp đã sửa: (a) `9.6` và `10.1` ban đầu viết theo `mn38`/`mn51` (*rời nhà sống không nhà*), không trùng nguyên văn với bảy khoá liền kề lấy từ `mn125`; đã đổi về `mn125:14.6`–`14.7`; (b) `17.1` ban đầu viết lại nửa sau của `dn2:44.7`; đã dùng lại nguyên văn; (c) `23.1` ban đầu viết *tham muốn* ở cả ba chỗ, nhưng tầng dùng *tham* cho `abhijjhaṁ loke pahāya` ở `mn101:37.1`; đã theo tầng, và để *tham muốn và buồn phiền* ở `20.2`, `20.8` theo `mn27`/`mn51`.

