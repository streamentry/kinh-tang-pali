notes:
  - >-
    **Dùng lại `an10.238:1.3`** (đã `published`) cho **năm mục chung** — danh
    sách xác `aṭṭhika, puḷavaka, vinīlaka, vicchiddaka, uddhumāta` giống hệt;
    `an10.238` có thêm `vipubbaka` nên có sáu mục, bài này có năm.
    **Vị trí phải khớp chữ, không được dịch lệch:** `an10.238` lần lượt là *bộ
    xương* (aṭṭhika), *đống tro* (puḷavaka), *tro quét dầu* (**vinīlaka**), *vỏ
    trấu* (vipubbaka), *hạt vụn* (vicchiddaka), *đám bụi* (uddhumāta). Bài này
    không có `vipubbaka`, nên *vỏ trấu* **không** xuất hiện, và *tro quét dầu*
    đứng ở vị trí thứ ba.
    **Ghi rõ điều chưa chắc:** năm cách dịu cho năm danh từ xác này là của bài
    đã `published`, kế thừa để hai bài đọc giống nhau; riêng `vinīlaka` (xác tái
    xám) và `vicchiddaka` (xác rách bươm) thì *tro quét dầu* và *hạt vụn* có thể
    không phải nghĩa chuẩn. Tôi **không tự sửa bài đã `published`**; nếu biên
    tập muốn chuẩn hoá thì phải sửa cả `an10.238`.
  - >-
    **`Sacittavagga` → *Phẩm Tâm Mình*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *Your Own Mind*, và cả phẩm nói đúng một việc — soi lại
    **tâm mình** (`sacittapariyāyakusala`). Tên bài `Sacittasutta` → *Kinh Chăm
    Chính Tâm Mình*.
    **`Sacittavaggo paṭhamo` ở `an10.60:15.5` dịch là *Phẩm Tâm Mình, thứ
    nhất*** — đây là **số thứ tự của chính Bilara đánh số lại**, vì phẩm này rõ
    ràng là thứ sáu trong Bộ Mười (đúng như `6.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
