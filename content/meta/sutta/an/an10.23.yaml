notes: |-
  Nguồn: Pāli đọc từ snapshot đã ghim, 94 khoá (cả 94 đều có trong bản dịch, thứ tự khoá trùng thứ tự Pāli). Tầng Anh đã ghim có tệp trên đĩa: `sutta/an/an10/an10.23_translation-en-sujato.json`, đường dẫn bộ an là PHẲNG theo chương.
  COVERAGE TẦNG ANH, đo theo ngưỡng `substantivePaliMinChars: 40` của `source/layers.yaml` và bỏ khối `:0`: 46 khoá Pāli có nội dung, Sujato có prose ở cả 46 ⇒ 46/46 = 1,0, trên ngưỡng 0,8. Đếm trên mọi khoá thì Sujato chỉ im lặng đúng một khoá, `an10.23:8.22` (Tatiyaṁ., 8 ký tự, là bộ đếm chứ không phải văn xuôi). Không có lớp `english-project` cho bài này và không cần tạo, vì không còn khoá nào để lấp; không có SHADOWING. Vì thế toàn bộ đoạn có nội dung đều được đối chiếu với bản Anh đã ghim một cách độc lập, và triangulation không bị hạ vì lý do lớp lấp do cùng một người viết.
  Bản Việt hiện hành (Thích Minh Châu) chỉ có Pháp Cú ở tầng đã ghim, nên bài này không có tham khảo Việt truyền thống ở mức segment; các thuật ngữ được đo bằng tiền lệ trong chính tầng `vietnamese-project`.
  Tiền lệ nguyên văn: đã dò 271 cặp (khoá Pāli trùng nguyên văn với một khoá khác trong tầng đã có bản Việt, bỏ cặp với khoá chưa dịch) và bản này dùng lại nguyên bản Việt ở 267 cặp. Còn đúng 4 cặp khác (mn26:32.4, mn26:33.4, sn14.13:5.4, sn56.13:6.2), đều có lý do: `7.11` (So evamassa veditabbo) bám mn105 (5 khoá, `Người ấy cần được hiểu như sau:`, cả `8.11` cũng dùng đúng câu này) và khác mn26:32.4, 33.4 vì ở đó câu là phần giữa một mệnh đề khác; `8.22` Tatiyaṁ. viết `Thứ ba.` theo `Thứ hai.` của an5.162:9.2, trong khi sn14.13 và sn56.13 thêm chữ Bài/Kinh theo ngữ cảnh riêng của chúng. Trong chính bài, 28 cặp Pāli trùng nguyên văn (công thức 2.3 / 3.3, danh sách lobho-doso-moho… ở 4.x / 7.x / 8.x) đều có bản Việt GIỐNG HỆT, 0 cặp lệch.
  THUẬT NGỮ, kèm số đếm đo trên toàn tầng (khoá Pāli ngắn có chứa từ đó):
  `sabrahmacārī` đồng phạm hạnh 228, bạn đồng phạm hạnh 11, đồng đạo 4 (an10: 20 / 0 / 2) ⇒ đồng phạm hạnh. `viññū` người có trí 150, bậc trí 51, người trí 42 ⇒ ở đây số nhiều nên `các vị đồng phạm hạnh có trí`. `anuvicca` xem xét 13, tra xét 9, suy xét 7, sau khi xem xét 4 (an10: sau khi xem xét 1, xem xét 1) ⇒ sau khi xem xét. `kāyaduccaritaṁ` / `kāyasucaritaṁ` ác hạnh / thiện hạnh của thân theo an5.162:6.11 và an6.108:1.7, và `vacī-` dịch lời (an2.11, an6.108 `ác hạnh của lời`). `sādhu vatāyasmā` Lành thay, (thưa) Tôn giả theo an6.27 và an3.130. `ayamāyasmā` vị tôn giả này theo an4.192 (nhiều khoá). `cīvarapiṇḍapātasenāsanagilānapaccayabhesajjaparikkhārānaṁ` y phục, thức ăn khất thực, chỗ ở, thuốc men và vật dụng cho người bệnh theo an4.259:6.2 và an4.260:6.2. `pāpikā icchā` / `pāpicchā` ham muốn xấu theo an7.24:3.4 và mn40 (6 khoá) thay vì ác dục (9 khoá toàn tầng, an10 chỉ 1): chọn cùng một chuỗi ham muốn xấu với `pāpikā issā` ganh tị xấu để hai khái niệm đi cặp trong bài đọc như nhau. `assaddho` / `saddho` đức tin 13 so với niềm tin 6 (khoá ngắn bộ an). `appassuto` ít học theo an4.6 và an4.202. `kusīto` lười biếng theo an4.202:2.2. `muṭṭhassati` thất niệm 46 so với mất niệm 4 và quên 4. `asamāhito` không có định, `duppañño` thiếu trí tuệ theo an4.202:2.2 và an4.80:2.5. `akhīṇāsavo` chưa cạn lậu hoặc theo `khīṇāsavo` đã cạn lậu hoặc (an3.13:6.2, an3.93:5.5).
  Bốn từ cần người gộp để ý vì tầng KHÔNG có đa số: (1) `kodho` giận 100, sân 45, phẫn nộ 32, giận dữ 30 ⇒ giận dữ. (2) `upanāho` hận 55, oán hận 32, hằn học 19, hiềm hận 12 (an10: hận 3, hiềm hận 2) ⇒ hiềm hận, theo an9.62 và an10.100. (3) `makkho` khinh miệt 50, chê bai 24, gièm pha 18 và (4) `paḷāso` khinh miệt 25, ganh tị 14, chê trách 10, hơn thua 9, ganh ghét 7. Hai từ này cùng đứng trong một danh sách nên không thể cùng dịch khinh miệt; bản này chọn `makkho` gièm pha (an10.100 và mn7, nay có 18 khoá) và `paḷāso` khinh miệt (đa số riêng của từ này, 25 khoá). Sujato dịch hai từ là disdain và contempt. Cách chọn có thể đổi, nhưng phải đổi đồng thời ở 10 chỗ lặp lại (4.7, 4.8, 7.6, 7.7, 7.17, 7.18, 8.6, 8.7, 8.17, 8.18). `issā` ganh tị 23, ganh ghét 13, ghen tị 11, đố kỵ 7 (an10: ganh ghét 3, đố kỵ 2) ⇒ ganh tị xấu, theo đa số toàn tầng chứ không theo an10.100.
  `:0.1` của bộ an giữ Kinh Tăng Chi Bộ. `:0.2` `3. Mahāvagga` ⇒ `3. Phẩm Lớn`, theo an10.22:0.2. `:0.3` `Kāyasutta` không có tiền lệ cùng tên nào trong toàn tầng; dịch Kinh Thân theo khuôn Kinh + danh từ của các tên bài liền kề, Sujato dịch Body.
  BẤT ĐỊNH 1 — `kiñci desaṁ` (2.2, 2.4, 3.2, 3.4). Bản này dịch một điều bất thiện nào đó, theo cách an2.15 đã dịch `kañcideva desaṁ`. Đọc khác: `desaṁ` là phương diện hay phần, tức một mặt nào đó của hành vi; Sujato dịch a certain unskillful offense. Chưa làm đổi nghĩa bài, nhưng `āpanno` thuộc từ vựng vi phạm nên chữ phạm được giữ.
  BẤT ĐỊNH 2 — `abhibhuyya iriyati` (7.1, 7.10, 7.12, 7.21, 8.1, 8.10, 8.12, 8.21). Chủ ngữ của `iriyati` là tham sân si…, không phải vị tỳ-kheo (vì `taṁ bhikkhuṁ` là tân ngữ), nên dịch tham chế ngự vị tỳ-kheo ấy và cứ thế tiếp diễn, theo Sujato (masters … and keeps going). Đây là cụm duy nhất trong bài không có tiền lệ nào trong tầng (0 khoá). Ở vế phủ định `nābhibhuyya iriyati` bản này viết không chế ngự … và không cứ thế tiếp diễn, giữ cả hai động từ bị phủ định; nếu người biên tập hiểu phủ định chỉ rơi vào `abhibhuyya` thì có thể đổi một chữ, nhưng phải đổi đồng thời ở 8.1, 8.10, 8.12, 8.21.
  BẤT ĐỊNH 3 — `paññāya disvā pahātabbā`. Dịch sau khi thấy bằng tuệ, đúng hình thái absolutive của Pāli; Sujato thêm again and again (nhìn đi nhìn lại) mà Pāli không có, nên không đưa vào thân kinh.
  BẤT ĐỊNH 4 — `upavāsa` (5.4). Chỉ có tiền lệ gián tiếp cho `dāsa` (tôi tớ, an10: 0). Dịch người sống nương nhờ theo Sujato (dependent); không dùng nô lệ vì Pāli đứng cạnh `dāsa` đã có từ riêng.
  DẤU LƯỢC: 4.3 là `…pe…` ⇒ đúng một `…`. 4.4–4.8, 7.2–7.9, 7.13–7.20, 8.2–8.9, 8.13–8.20 là `…` trần của Pāli ⇒ mỗi khoá đúng một `…` đi sau từ đã dịch, theo khuôn an6.15:2.3. Không có khoá nào Pāli không có `…` mà Việt có. Không có `(…)` trần trong bài này.
  NHÁY: Pāli có một `“` mở ở 1.1 và một `”` đóng ở 8.21 (`iriyatī’”ti`); các cặp nháy đơn mở ở 2.4 / 3.4 đóng ở 2.5 / 3.5, 5.5, 5.8 mở và đóng trong cùng khoá, 6.3–6.11 mỗi khoá một cặp, 7.12 mở và 7.21 đóng, 8.12 mở và 8.21 đóng. Đã so từng khoá với Pāli, 0 khoá lệch cả bốn loại dấu `“ ” ‘ ’`.
  Phép đo: tập khoá Việt = tập khoá Pāli, 94/94; thứ tự khoá trùng; NFC; 0 khoá rỗng; 0 khoảng trắng thừa; 0 chữ số lọt vào thân kinh (bài không có số Pāli nào cần tính). Đã in 94 cặp Pāli với Việt để đọc.
