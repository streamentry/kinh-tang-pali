notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 25/25 = 100%**, không khoá nào bị bỏ trống, không cần ghi nhận gap. Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708: bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **7 khoá có Pāli trùng nguyên văn ở bài khác (644 cặp); 6 cặp dùng lại NGUYÊN VĂN.** `1.1` trùng 28 bài (theo an10.69:1.1) · `1.2` trùng byte-for-byte `an10.69:1.2` · `0.2` theo 4/4 bản (7. Phẩm Song Trùng) · `12.2` theo 228/230 bản cho `Dasamaṁ.` · `12.3` trùng byte-for-byte `sn35.22:2.8` (Phẩm Song Trùng, thứ hai) · `13.0` theo 283/363 bản cho `Tassuddānaṁ` (Tóm lược:).
  **Danh sách mười `…kathaṁ` ở `1.3` — dùng lại nguyên văn của `an10.69:1.3`, không dịch lại.** `1.3` có một `…pe…` nên bản Việt giữ đúng một `…`; tôi giữ *chuyện vua chúa, chuyện trộm cướp, chuyện đại thần … chuyện người đã chết, chuyện tạp nhạp, chuyện thế giới, và chuyện trở thành thế này hay thế khác* đúng như bản đã công bố.
  **Mười `ṭhānāni` — dùng lại nguyên văn danh sách đã có ở `an10.69:4.3`, không tự đặt lại.** appiccha → ít ham muốn · santuṭṭhi → biết đủ · pavivitta → viễn ly · asaṁsaṭṭha → không gần gũi · vīriyārambha → khơi dậy tinh tấn · sīla → giới viên mãn · samādhi → định viên mãn · paññā → tuệ viên mãn · vimutti → giải thoát viên mãn · vimuttiñāṇadassana → giải thoát tri kiến viên mãn. `pāsaṁsametaṁ ṭhānaṁ` → *một căn được khen ngợi*.
  **Một chỗ tôi cố ý dịch khác cùng Pāli trong chính lát này, ghi rõ để người gộp không tưởng là soát trôi dạt.** `2.2` `Katamāni dasa?` trùng byte-for-byte `an10.21:3.2`, nhưng hai bài hỏi hai danh từ khác nhau: ở đây `pāsaṁsāni ṭhānāni` nên tôi đặt *Thế nào là mười căn?*, ở an10.21 là `tathāgatabalāni` nên đặt *Thế nào là mười?*. Bảy bản Việt đã có cho cụm này chia làm năm cách, không có đa số.
  **Uddāna `13.1`–`13.4` — chỗ chưa phân xử, đây là lý do bài đặt `draft`.** `13.1` *Vô minh, ái cầu, sự hoàn thành,* · `13.2` *sau khi thấy rõ, hai sự an lạc;* · `13.3` *Trong Naḷakapāna, có hai điều đã nói,* · `13.4` *hai năm, đề tài thảo luận.* Tôi giữ nguyên văn `Naḷakapāna` ở `13.3` thay vì đoán nghĩa, vì đoán là bịa; `kathāvatthūpare duveti` đọc được như ám dụ chính bài này (đề tài thảo luận lần thứ hai) nhưng tôi không dám khẳng định, nên dịch theo nghĩa chữ. Xem `blocking_errors`.
  **Bất định khác đã ghi.** `itibhavābhavakathaṁ` tôi dịch *chuyện người đã chết, chuyện tạp nhạp, chuyện thế giới* theo đúng lời `an10.69:1.3` đã công bố; đây là cụm mà Sujato dịch *talk about the departed; motley talk; tales of land and sea* nên không khớp từng chữ, tôi theo tiền lệ Việt cùng công thức.
