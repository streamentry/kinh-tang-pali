notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 25/25 = 100%**, không khoá nào bị bỏ trống, không cần ghi nhận gap. Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708: bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **7 khoá có Pāli trùng nguyên văn ở bài khác (644 cặp); 6 cặp dùng lại NGUYÊN VĂN.** `1.1` trùng 28 bài (theo an10.69:1.1) · `1.2` trùng byte-for-byte `an10.69:1.2` · `0.2` theo 4/4 bản (7. Phẩm Song Trùng) · `12.2` theo 228/230 bản cho `Dasamaṁ.` · `12.3` trùng byte-for-byte `sn35.22:2.8` (Phẩm Song Trùng, thứ hai) · `13.0` theo 283/363 bản cho `Tassuddānaṁ` (Tóm lược:).
  [Thay thế bởi mục Giải quyết draft 2026-10-12 — phần `1.3`.] **Danh sách mười `…kathaṁ` ở `1.3` — dùng lại nguyên văn của `an10.69:1.3`, không dịch lại.** `1.3` có một `…pe…` nên bản Việt giữ đúng một `…`; tôi giữ *chuyện vua chúa, chuyện trộm cướp, chuyện đại thần … chuyện người đã chết, chuyện tạp nhạp, chuyện thế giới, và chuyện trở thành thế này hay thế khác* đúng như bản đã công bố.
  [Thay thế — thuật ngữ `ṭhāna` và cấu trúc câu đã đổi, xem mục cuối.] **Mười `ṭhānāni` — dùng lại nguyên văn danh sách đã có ở `an10.69:4.3`, không tự đặt lại.** appiccha → ít ham muốn · santuṭṭhi → biết đủ · pavivitta → viễn ly · asaṁsaṭṭha → không gần gũi · vīriyārambha → khơi dậy tinh tấn · sīla → giới viên mãn · samādhi → định viên mãn · paññā → tuệ viên mãn · vimutti → giải thoát viên mãn · vimuttiñāṇadassana → giải thoát tri kiến viên mãn. `pāsaṁsametaṁ ṭhānaṁ` → *một căn được khen ngợi*.
  [Thay thế — `2.2` nay là *Thế nào là mười?*, xem mục cuối.] **Một chỗ tôi cố ý dịch khác cùng Pāli trong chính lát này, ghi rõ để người gộp không tưởng là soát trôi dạt.** `2.2` `Katamāni dasa?` trùng byte-for-byte `an10.21:3.2`, nhưng hai bài hỏi hai danh từ khác nhau: ở đây `pāsaṁsāni ṭhānāni` nên tôi đặt *Thế nào là mười căn?*, ở an10.21 là `tathāgatabalāni` nên đặt *Thế nào là mười?*. Bảy bản Việt đã có cho cụm này chia làm năm cách, không có đa số.
  [Thay thế — uddāna đã phân xử, blocker đã gỡ, xem mục cuối.] **Uddāna `13.1`–`13.4` — chỗ chưa phân xử, đây là lý do bài đặt `draft`.** `13.1` *Vô minh, ái cầu, sự hoàn thành,* · `13.2` *sau khi thấy rõ, hai sự an lạc;* · `13.3` *Trong Naḷakapāna, có hai điều đã nói,* · `13.4` *hai năm, đề tài thảo luận.* Tôi giữ nguyên văn `Naḷakapāna` ở `13.3` thay vì đoán nghĩa, vì đoán là bịa; `kathāvatthūpare duveti` đọc được như ám dụ chính bài này (đề tài thảo luận lần thứ hai) nhưng tôi không dám khẳng định, nên dịch theo nghĩa chữ. Xem `blocking_errors`.
  **Bất định khác đã ghi.** `itibhavābhavakathaṁ` tôi dịch *chuyện người đã chết, chuyện tạp nhạp, chuyện thế giới* theo đúng lời `an10.69:1.3` đã công bố; đây là cụm mà Sujato dịch *talk about the departed; motley talk; tales of land and sea* nên không khớp từng chữ, tôi theo tiền lệ Việt cùng công thức.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  **Giải quyết draft 2026-10-12 (kiểm toán độc lập, đọc đối kháng Pāli ↔ Việt cả 36 khoá).** Phân loại blocker: một blocker duy nhất, loại (D) — bốn khoá uddāna `13.1`–`13.4` được coi là không phân xử được. **Đã giải quyết bằng căn cứ trong chính phẩm:** uddāna của Yamakavagga liệt kê tên mười bài `an10.61`–`an10.70` theo đúng thứ tự, như tiền lệ các uddāna khác của tầng (an10.10, an10.50, an10.60, an10.100, an10.112 đều liệt kê tên bài). Đối chiếu tên Pāli các bài: `an10.61` Avijjā · `an10.62` Taṇhā · `an10.63` Niṭṭhaṅgata (khoá `niṭṭhā`) · `an10.64` Aveccappasanna (khoá `avecca`) · `an10.65`–`an10.66` Paṭhama/Dutiyasukha (`dve sukhāni`) · `an10.67`–`an10.68` Paṭhama/Dutiyanaḷakapāna (`Naḷakapāne dve vuttā`; `an10.67:1.1` xác nhận Naḷakapāna là tên thị trấn của người Kosala) · `an10.69`–`an10.70` Paṭhama/Dutiyakathāvatthu (`kathāvatthūpare duve`). Vì vậy 10/10 bài khớp, không còn từ nào lơ lửng; bản cũ *sự hoàn thành*, *sau khi thấy rõ*, *hai năm* là đọc sai từng chữ (`hai năm` không có trong Pāli). Nay: `13.1` *Vô minh, khát ái, quyết định,* · `13.2` *tín bất động, hai bài về lạc;* · `13.3` *hai bài được nói ở Naḷakapāna,* · `13.4` *và hai bài tiếp theo về đề tài thảo luận.* Bất định còn lại rất nhỏ và không đổi nghĩa: `pare`/`upare` ở `13.4` đọc là *tiếp theo / sau* (dù đọc cách nào thì vẫn chỉ hai bài kathāvatthu cuối phẩm); `avecca` được trả bằng tên bài *tín bất động* theo tầng Việt (`an10.64:0.3`) chứ không dịch rời chữ. Blocker đã gỡ.
  **Lỗi nghĩa thật đã sửa (5 nhóm, 28/36 khoá đổi, gồm 4 khoá uddāna).** (1) `6.1`, `6.2`: *đã cần cũ* là chữ vô nghĩa, không có trong Pāli — `āraddhavīriyo` = *đã khơi dậy tinh tấn* (tầng dùng *tinh tấn*/*khơi dậy tinh tấn* ở nhiều bài; khớp với vế sau `vīriyārambhakathañca` đã dịch *khơi dậy tinh tấn*). (2) `1.3`: bản cũ đã nhét *chuyện người đã chết, chuyện tạp nhạp, chuyện thế gian* vào sau `…pe…`, trong khi Pāli của khoá này chỉ có `…pe… itibhavābhavakathaṁ iti vāti` — đó là nội dung của phần bị lược, không thuộc khoá này. Nay bám đúng Pāli: *chuyện đại thần … chuyện trở thành thế này hay thế khác.* Tiền lệ cùng dạng `…pe… itibhavābhavakathaṁ iti vā`: dn25:4.4, dn25:21.7, dn25:21.12, an10.69:3.2 — 4/4 đều là `… chuyện trở thành thế này hay thế khác`, không chèn thêm. (3) `2.1`, `2.4`, `3.2`…`11.2`, `12.1`: *căn được khen ngợi* — chữ *căn* không có tiền lệ nào khác (0 bài khác trong tầng dùng cụm này; ghi chú cũ nói dùng lại từ an10.69:4.3 là sai, an10.69 không có cụm đó) và dễ bị đọc nhầm là *indriya*; `pāsaṁsāni ṭhānāni` = *căn cứ đáng được khen ngợi* (Sujato: grounds for praise). (4) `2.2`: *Thế nào là mười căn?* thêm danh từ không có trong Pāli `Katamāni dasa?` → *Thế nào là mười?* (đúng như `an10.21:3.2`, trùng byte-for-byte). (5) `3.1`–`11.1`: Pāli chỉ có `Attanā ca … hoti` (tỉnh lược chủ ngữ, không có `idha`, `bhikkhave`), bản cũ lặp *Ở đây, này các tỳ-kheo* 9 lần — một hô cách thêm vào lời Đức Phật mà Pāli không nói; nay *Vị tỳ-kheo tự mình …* (và bỏ *ấy* để khỏi hiểu thành cùng một vị mang đủ mười điều; `2.3` giữ `Idha, bhikkhave` đúng Pāli). Thứ tự khoá nay theo thứ tự Pāli.
  **Giữ nguyên, đã kiểm.** `1.1`, `1.2` (trùng an10.69:1.1, :1.2), `0.x`, `12.2`, `12.3`, `13.0`. Cấu trúc `kattā hoti` dịch *nói với … về chuyện …* khớp Sujato (*speaks to the mendicants on …*); *chuyện* cho `kathā` giữ vì đối lập có chủ ý với `tiracchānakathā` ở `1.2`, khác *lời nói về* của an10.69:4.3 (cùng Pāli) — hai chỗ chọn khác nhau theo ngữ cảnh, ghi rõ để người gộp không tưởng là trôi dạt.
  **Coverage Anh.** Sujato phủ toàn bộ thân kinh `1.1`–`12.1` (25/25 khoá có nội dung); để trống `12.2`, `12.3`, `13.0`–`13.4` (tiêu đề phẩm và uddāna, vốn không được Sujato dịch) — những đoạn này tự đứng vững từ Pāli và cấu trúc phẩm, nên `triangulation` đặt 8,5, không cao hơn. Tầng Việt hiện hành không có cho bài này (bilara chỉ phân phối Pháp Cú): giới hạn tham chiếu, không phải lỗi văn bản.
  **Chưa xử lý ngoài tệp (báo):** tiêu đề `Kinh Đề Tài Thảo Luận Thứ Hai` dùng đánh số chữ, trong khi `an10.69` ghi `Nhất` và các cặp khác của phẩm ghi `(1)`/`(2)`; giữ nguyên ở đây để khớp `an10.69`. `an10.69:3.2` còn dư chữ *vậy* sau dấu ngoặc đóng.
