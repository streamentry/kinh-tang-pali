notes: |-
  Dịch từ Pāli root; bản Anh Bhikkhu Sujato ở commit đã ghim phủ 29/46 segment có nội
  dung (63.0%). Tầng Việt hiện hành không có bản chia theo segment (bản Hòa thượng Thích
  Minh Châu là văn bản liền mạch trên SuttaCentral/Budsas, đã đối chiếu toàn văn).
  Các đoạn Sujato để trống (3.4-3.7, 4.4-4.7, 5.3-5.6, 6.5-6.8, 7.4-7.7, 8.3) là các đoạn
  lặp lại theo công thức tùy niệm; bản Việt dịch đầy đủ bám sát Pāli root.
  Đảm bảo tính nhất quán 100% giữa 6 pháp tùy niệm (Buddhānussati, Dhammānussati,
  Saṅghānussati, Sīlānussati, Cāgānussati, Devatānussati).
  Khớp 1:1 dấu ngoặc kép, dấu ngoặc đơn và dấu lược với Pāli root.

  Giải quyết draft 2026-10-12: Blocker cũ "lowEnglishCoverage" (Sujato phủ 29/46 đoạn Pāli
  có nội dung, 63,0%) thuộc loại do mất mát tầng tham khảo, không phải lỗi văn bản; đã gỡ.
  Các khoá Sujato để trống (3.4-3.7, 4.4-4.7, 5.3-5.6, 6.5-6.8, 7.4-7.7) là phần lặp công
  thức tùy niệm (giống từng chữ 2.5-2.8 và 7.9-7.12 ở Pāli) hoặc phần Pāli bị lược "…";
  đã đọc đối kháng từng khoá này từ Pāli root, bản Việt tự đứng vững, nên mất mát được
  ghi nhận ở reference-gaps thay vì coi là lỗi chặn. Bản tham khảo Sujato còn lại được
  dùng thật để đối chiếu; vì các khoá trống không có bản Anh độc lập nên triangulation
  đặt 8,0 (trần), không cao hơn. Tầng Việt hiện hành không có cho bài này (giới hạn
  tham chiếu, không phải lỗi văn bản).
  Sửa sau kiểm toán (accuracy/terminology): (1) 2.8, 3.7, 4.7, 5.6, 6.8, 7.12: bỏ dấu
  nháy đóng ’ lạc trước "ở đây" (lỗi chép "evam'idhekacce") và thêm "Cũng" cho "idampi"
  bị bỏ sót; (2) 5.1: "không bị bẻ vụn" -> "không bị sứt mẻ" (akhaṇḍa; tiền lệ
  đa số 38 khoá so với "bẻ vụn" chỉ ở bài này); (3) 7.3 và 7.7: bỏ quan hệ nhân quả
  "Do ... mà" không có trong Pāli (samannāgatā là phân từ mô tả chư thiên, khớp tiền lệ
  an6.10/an11.11), 7.4-7.6 đồng bộ thành "Giới hạnh/Sự học rộng/Sự xả thí như thế nào …",
  thống nhất "học văn" thành "sự học rộng" như 7.8; 7.8 "các chư thiên" -> "chư thiên";
  (4) 0.3 tiêu đề đổi thành "Kinh Mahākaccāna" cho khớp tên riêng giữ nguyên trong thân
  bài (38 khoá) và tiền lệ an6.10, an6.29; translationTitle khớp. Giữ nguyên "năm dục
  trưởng dưỡng" (tiền lệ đa số trên tầng, 41 khoá) và "Phẩm Vượt Trội" (10 khoá).
  Bất định còn lại: không có. technical_integrity giữ 9,5; chưa chạy bốn lệnh
  npm run validate, npm test, npm run check, npm run build trong lượt này.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 4.2 — ‘Diệu hạnh là chúng đệ tử Thế Tôn …’ → ‘Chúng đệ tử Thế Tôn khéo thực hành …’ (`suppaṭipanno` là tính từ của `sāvakasaṅgho`, không phải danh từ ‘diệu hạnh’; đồng nhất với an10.92 mục 5.7); giữ nguyên khoá 3.2 (‘khéo thuyết giảng’ đúng `svākkhāto`, ‘tự mình giác hiểu’ đúng `paccattaṁ veditabbo`; cách đa số ‘thuyết giảng hay’ yếu hơn).
