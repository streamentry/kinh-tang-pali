notes: |-
  Dịch từ PĀLI root (authority). Tầng Anh dùng để đối chiếu, không phải nguồn phán xét.

  **Coverage tầng Anh đo được: 46/46 khoá Pāli có nội dung = 1,0000** (ngưỡng 0,80 nên không phải ghi nhận gap, và không cần sửa `content/meta/reference-gaps.yaml`). Đo bằng đúng công thức của `source/layers.yaml`: `substantivePaliMinChars = 40`, bỏ khối tham chiếu `:0`. Tệp `sutta/an/an5/an5.194_translation-en-sujato.json` **có trong `source/upstream-manifest.json`** (tầng `english-sujato`, treeSha 24e81ded…, commit `11c9d708978cde8ba61096d8a75f7ddfb846f639` khớp `source/suttacentral.lock.json`) và đã sync trong cache `.cache/upstream/suttacentral/`: 53 khoá, 52 khoá có chữ. **Số khoá Sujato im lặng có nội dung Pāli: 0.** Khoá Sujato rỗng duy nhất là `12.5` (`Catutthaṁ.`, 11 ký tự) — không có nội dung đáng đo. Vì vậy `content/meta/en/an/an5.194.yaml` không tồn tại và **không có khoá nào để lấp ở lớp `english-project`**. Tầng `vietnamese-current` vắng tại commit đã ghim (chỉ 26 tệp, toàn bộ là Pháp Cú) ⇒ không có bản Hòa thượng Thích Minh Châu để đối chiếu; đây là đặc điểm của snapshot upstream, không phải thiếu sót của kho, nên `triangulation` không được tuyên bố có đối chiếu bản Việt truyền thống.

  **Cổng 40 ký tự — đo đúng và ghi rõ bẫy.** 53 khoá, trong đó **46 khoá có nội dung** và 7 khoá bị loại vì PĀLI ngắn hơn 40 ký tự: `0.1`, `0.2`, `0.3` (khối tiêu đề), `1.4`, `5.2`, `5.3`, `12.5`. **Bộ lọc `\b\d+\.0\b` loại được 0 khoá** vì nó chạy trên *nội dung* Pāli chứ không phải trên tên khoá (đếm trên tên khoá cũng cho 0 ở bài này — đó là lý do phải in cả hai số).

  **Dấu lược: bài này KHÔNG có dấu lược nào.** Đếm bằng script: Pāli `…pe…` = 0 khoá, Pāli `…` trần = 0 khoá, Việt `…` = 0 khoá, khoá lệch hiện diện dấu lược = 0, và 0 khoá Việt còn để trống dạng `(…)`. Phép này vì vậy **đo được** chứ không phải “chạy rỗng”: nó nói rõ bài không có lược, khác hẳn với bài mà `_hvi.py` im lặng vì không khoá nào đủ 40 ký tự.

  **5/9 khoá trùng nguyên văn với bài đã dịch — dùng lại NGUYÊN VĂN, không dịch lại.** Đếm bằng script trên chỉ số Pāli→Việt của 6.961 bài Pāli / 5.406 tệp Việt đã có: `0.2` `20. Brāhmaṇavagga` → *20. Phẩm Bà-la-môn* (9 bài trùng Pāli; 8 anh em cùng phẩm đã dịch, trong đó an5.191/193/195/196/197/198/199/200) · `1.1` (24 bài trùng; dùng nguyên văn của an5.195:1.1, bài kề ngay) · `2.5` (mn27, mn99) → *Phải là người ngang tầm với ngài ấy mới có thể đánh giá trí tuệ sáng suốt ấy.* (nguyên văn mn27:2.8) · `2.8` (mn27) → *Ngài ấy được chính những người đáng được tán thán ca ngợi là bậc tối thượng giữa chư thiên và loài người.* (nguyên văn mn27:2.11) · `7.2` (an5.162, sn12.66) → *Bấy giờ có một người đi đến, nóng bức, khổ sở, mệt mỏi, khô khát, khát nước.* (nguyên văn an5.162:4.3/5.3/7.3) · `9.1`, `10.1` (an2.37, dn21, mn100, mn87, mn91, sn7.1) · `11.1` (mn91) · `12.5` (281 bài) → *Thứ tư.* Ngoài ra `2.4` trùng mn27:2.7 (chỉ khác `bhante`→`bho`) và `7.1` trùng lõi an5.162:7.2 (`pokkharaṇī acchodakā sātodakā sītodakā setakā supatitthā ramaṇīyā`) nên tôi dùng lại nguyên văn cả cụm. `8.1` trùng **toàn bộ công thức** với an2.37:5.1 (chỉ khác tên) nên dùng lại nguyên văn.

  **Pāli trùng nguyên văn TRONG CHÍNH bài — 2 nhóm, 9 khoá, Việt khớp tuyệt đối.** `3.2`=`4.3`=`5.6`=`6.3` (4 khoá) và `3.3`=`4.4`=`5.7`=`6.4`=`7.5` (5 khoá). Script so từng giá trị Việt trong mỗi nhóm: **0 nhóm lệch**. Đây là bộ Tăng Chi nên công thức lặp rất dày; tôi dịch một lần rồi dùng lại nguyên văn, không dịch khuôn.

  **Phe dấu `ti`: đo ở phạm vi gần nhất VÀ toàn tầng, ghi cả hai — và con số ~1:4 trong BRIEF_VI4 không tái lập được.** Chỉ xét những khoá mà PĀLI thật sự kết bằng `ti`. Phân bống lớp thì như sau:
  - *Pāli kết bằng `”ti` (nháy kép)* — toàn tầng: **KEEP `”ti` 3.400 · DROP (chỉ còn `ti`) 8 · bỏ hẳn `ti` 10.493**; phạm vi `an`: KEEP 431 · DROP 2 · bỏ hẳn 2.051; **phạm vi gần nhất `an5.*`: KEEP 50 · DROP 0**.
  - *Pāli kết bằng `’ti` (nháy đơn lồng trong lời thoại)* — toàn tầng: **bỏ hẳn `ti` 8.606 / 8.724 = 98,6%**; `an5.*`: **252/252 = 100% bỏ hẳn**.
  ⇒ Nếu phe “BỎ” được định nghĩa là *giữ `ti` mà bỏ dấu nháy*, phe đó thua ở mọi phạm vi (3.400:8 toàn tầng, 50:0 ở `an5`) và con số ~1:4 chỉ tái lập được khi tính “bỏ **hẳn** `ti`” vào phe BỎ (3.400 : 10.493 ≈ 1:3,1 toàn tầng). Đó là hai lựa chọn khác nhau, không phải một. **Lựa chọn của tôi, có chủ ý:** 9 khoá Pāli `”ti` của bài này giữ nguyên `”ti` (đúng phe KEEP, thắng ở mọi phạm vi), còn khoá `12.2` với `’ti` lồng trong `‘cakkhumanto rūpāni dakkhantī’ti` thì **bỏ hẳn `ti`** — theo đúng 252/252 của chính `an5`. Đếm bằng script trên bài này: KEEP 9 · DROP 0 · bỏ hẳn 1 (chính là `12.2`).

  **Nháy đơn `‘’`: đếm từng khoá, không chỉ đếm nháy kép.** Pāli `‘`=1 `’`=1, Việt `‘`=1 `’`=1, **0 khoá lệch nháy đơn**, **0 khoá lệch vị trí**; cả hai đều ở `12.2`. Nháy kép: Pāli mở 9 / đóng 9, Việt mở 9 / đóng 9, cân trên toàn bài và **vị trí khớp từng khoá** (0 lệch) — kể cả chỗ đáng ngạc nhiên: `9.1` mở, `11.1` **không** đóng, `12.4` mới đóng.

  **Vá lỗi dấu nháy của bilara: KHÔNG vá, vì Pāli bài này đã cân.** Pāli có đúng 9 `“` và 9 `”` ⇒ không thiếu dấu nào để bổ sung (khác `an5.193`, nơi tôi phải thêm một `“`). Nhưng bilara đặt dấu đóng ở **`12.4`** (`gatan”ti.`) chứ không ở `11.1`, tức là một cặp nháy kép kéo dài qua cả lượt nói của Piṅgiyānī (`12.1`–`12.3`). Tôi **giữ nguyên vị trí đó** vì đo được 5 tiền lệ y hệt trong tầng và mọi tiền lệ đều nhân nguyên vị trí của Pāli: dn21:2.10.6–8 (mở ở khoá `Namo` đầu, đóng ở khoá **kế tiếp**), mn100:2.3–5, mn87:29.5–7, mn91:23.2–4 (mở ở `23.2`, khoá `23.4` không đóng), an2.37:6.1–9.1 (mở ở `6.1`, đóng ở `9.1`). Đóng ở `11.1` sẽ phải xoá dấu ở `12.4` — tức là **dời** dấu, mà luật của dự án chỉ cho phép *thêm* dấu câu, không dời.

  **Dấu `.` → `!` ở ba khoá `Namo`: có chủ ý, có tiền lệ.** Pāli `9.1` và `10.1` kết bằng `.` vì đó là một câu bị cắt làm ba; nếu giữ `.` thì bản Việt thành ba câu rời rạc. Cả 5 tiền lệ nêu trên đều dùng `!` ở cả ba khoá, nên tôi theo.

  **Cách xưng hô: phân biệt `bho` với `bhavaṁ` theo đúng Pāli, đo được.** `bho` trần (2.2, 2.4, 2.7, 3.1, 3.2, 4.1, 5.1, 6.1, 7.1 và các khoá lặp) → *thưa ông*: 3 khoá `an` và 3 khoá toàn tầng dùng “Thưa ông”, 2 khoá dùng “Này ông”. `bhavaṁ <tên>` (2.1, 2.3, 2.6, 2.9, 12.2, 12.4) → *bậc …*: tiền lệ gần nhất là mn27:2.4 `bhavaṁ vacchāyano` → *Tôn giả Vacchāyana … ngài* và mn99:30.4 `bhavaṁ bhāradvājo` → *Này Bhāradvāja … ngài*, nên tôi dùng *bậc Piṅgiyānī … ngài*. `bho piṅgiyāni` (12.1, 12.2, 12.3) → *này Piṅgiyānī*: 12 khoá trong `an` với `bho <Tên riêng>` mở lời bằng “Này <Tên>”. Tách ba cách này là chủ ý, vì đó là ba tầng xưng hô khác nhau của Pāli.

  **Thuật ngữ — chọn theo số đếm được, mỗi số đo bằng script.** `Licchavi` → *Licchavi* (21 khoá) · `samaṇaṁ gotamaṁ` → *sa-môn Gotama* · `paññāveyyattiyaṁ` → *trí tuệ sáng suốt* (mn27:2.7/2.8 dùng đúng cụm này, 3 khoá) · `Paṇḍito maññe` → *người có trí* (nguyên văn mn27:2.6; `paṇḍita` chung trong tầng nghiêng *người trí*/*bậc trí*, không phải *bậc hiện tri*) · `bhisakko` → *thầy thuốc* (19 khoá) · `sokaparidevadukkhadomanassupāyāsā` → *sầu, bi, khổ, ưu, não* có dấu phẩy (98 khoá, đối lập *sầu bi khổ ưu não* không dấu phẩy 22) · `abbhatthaṁ gacchanti` → *chấm dứt* (10 khoá, đa số) · `cetaso pasādaṁ` → *tín tĩnh* (11/11, nhất trí) · `pāmojjaṁ / somanassaṁ` → *hân hoan* / *niềm vui*, đúng theo dn10:2.7.8 và 2.8.6 có cùng công thức `labhetha pāmojjaṁ, adhigaccheyya somanassaṁ` → *được hân hoan và đạt niềm vui* · `attamanataṁ` → *hài lòng* (3 khoá) · `candana` → *đàn hương* (7 khoá), `lohitacandana` → *đàn hương đỏ* (3 khoá; đối lập *hương đỏ* 4 — nhưng 4 khoá kia dịch *hương đỏ* cho cả cụm `sāragandhā`, tức mất chữ “đàn”, nên tôi giữ *đàn hương đỏ*) · `madhupiṇḍikaṁ` → *bánh mật* (mn18:22.2) · `ābādhiko dukkhito bāḷhagilāno` → *bị bệnh, khổ sở, bệnh nặng* (nguyên văn an5.162:6.2) · `Abhikkantaṁ` → *tuyệt vời thay* (đa số 32 khoá) · `tikkhattuṁ udānaṁ` → *ba lần thốt lên lời cảm thán* (nguyên văn an2.37:5.1) · `Upāsakaṁ maṁ` → *nam cư sĩ* (23 khoá) · `ajjatagge pāṇupetaṁ` → *trọn đời* (88 khoá) · `saraṇaṁ gacchāmi` → *quy y* (57 khoá) · `abhippasanno` → *tin tưởng* (6 khoá) · `atthavasaṁ sampassamāno` → *do lý do gì mà* (theo an10.30:3.1) · `dhamma` → *pháp* viết thường (171 khoá trong `an5`, đối lập *Pháp* 28, *giáo pháp* 12) · `Catutthaṁ` → *Thứ tư.* (**162** khoá toàn tầng, đối lập *Thứ bốn.* 95; trong `an` là 101 : 21 — thắng ở cả hai phạm vi) · `0.1` → *Kinh Tăng Chi Bộ 5.194* (**902** khoá trong `an`, đối lập *Aṅguttara Nikāya 5.x* 363) · `0.3` → *Kinh Kāraṇapālī*.

  **Năm chỗ KHÔNG có tiền lệ — ghi lại để lát sau khỏi phát minh thêm cách.** (1) `Kāraṇapālī`: tên riêng, chỉ xuất hiện trong chính bài này ở toàn tầng Pāli ghim (3 khoá), và Sujato cũng giữ nguyên Pāli. Tôi giữ Pāli, theo đúng tiền lệ của hai bài kề trong cùng phẩm là giữ tên Pāli khi không có nghĩa Việt dựng sẵn (an5.193 *Kinh Saṅgārava*, an5.195 *Kinh Bà-la-môn Piṅgiyānī*) — **không** tự chế ra nghĩa cho `kāraṇa`+`pālī`. (2) `asecanakaṁ` (4.2 và 5.5): **0 tiền lệ đọc được** — an1.315:1.4 có VI rỗng, an10.104:4.1 bỏ hẳn mệnh đề `asecanakattāya`, mn18:22.2 cũng bỏ. Tôi dịch *không còn mong muốn nếm thêm nữa* (4.2, `sāyetha`) và *không còn mong muốn hít thêm nữa* (5.5, `ghāyetha`) — cùng một nghĩa, khác động từ theo hai giác quan, và ghi rõ đây là cách của tôi chứ không phải tiền lệ. (3) Danh sách bốn `yadi suttaso, yadi geyyaso, yadi veyyākaraṇaso, yadi abbhutadhammaso` chỉ có ở bài này (5 khoá, trùng nguyên văn nhau); tôi dịch *dù là tụng, dù là bài kệ, dù là lời giảng giải, dù là chuyện chưa từng nghe*, trong đó *lời giảng giải* là tiền lệ của dn21:2.10.9. (4) `puthusamaṇabrāhmaṇappavādānaṁ` là hapax; `parappavādāna` chỉ xuất hiện ở ps2.5 mà bài đó chưa có VI ⇒ **0 tiền lệ** cho *giáo chủ trương*. (5) `haricandana` và `aggarasa` đều là hapax trong tầng đã dịch; tôi dịch theo nghĩa thường (*đàn hương vàng*, *vị ngon nhất*) và ghi đây là chỗ không có tiền lệ.

  **Bất định còn mở, đã ghi — không che.** (a) `kāraṇapālī brāhmaṇo licchavīnaṁ kammantaṁ kāreti` (1.2) có hai cách đọc: `kāreti` như nguyên nhân (*sai làm công cho*) hoặc như nétiếp (*đang làm việc cho*). Sujato chọn nghĩa thứ hai (*was working for*) và tôi theo — *làm việc cho các vị Licchavi*; nhưng ý “đang sai người thi công” cũng bảo vệ được. Người rà soát nên phán một lần cho bài. (b) `12.2` của Pāli ghim **thiếu hai dấu phẩy** so với 61 chỗ khác của cùng công thức trong tầng (`mūḷhassa vā maggaṁ ācikkheyya andhakāre vā telapajjotaṁ dhāreyya:` — chỗ khác đều là `ācikkheyya, andhakāre`). Tôi **không** sửa Pāli và không kể thêm dấu phẩy vào bản Việt; chỉ ghi ra đây. (c) `dhāreyya:` cũng thiếu dấu phẩy trước dấu hai chấm trong bản ghim; cùng cách xử lý. (d) Sujato dịch `yadi suttaso, yadi geyyaso` thành một mục (*mixed prose & verse*); Pāli có **bốn** mục, tôi giữ bốn.

  **Sáu lỗi bản nháp tự bắt được ở lượt review đối kháng, đã sửa trước khi ghi metadata.** (1) `6.5` và `7.6` đã làm người nói thành chủ ngữ của “chấm dứt/tan biến”, trong khi Pāli `6.5`/`7.6` xem chủ ngữ là chính `sokaparidevadukkhadomanassupāyāsā` và `sabbadarathakilamathapariḷāhā` ⇒ đã đổi thành “ở chỗ nào, sầu bi khổ ưu não cũng đều chấm dứt”. (2) `3.1` dịch `piheti` là *thèm* còn `3.4` là *mong muốn* — cùng một động từ Pāli, phải nhất ⇒ đã thống nhất thành *mong muốn*. (3) `1.4` “ông nói với ông” lủng củng ⇒ đổi thành “ông bạch ông” theo an5.195. (4) `4.2` “ở chỗ nào thì chỗ nào” lặp vô nghĩa theo `yato yato` ⇒ đổi thành “nếm ở đâu thì chỗ ấy”. (5) `4.5`/`5.5`/`5.8` còn sót cụm “chỗ nào cũng liền” đứng sai vai cho `tato tato` ⇒ đã viết lại theo mệnh đề chủ ngữ đúng. (6) `2.3` tôi tự chế “bậc hiện tri”, trong khi nguyên văn mn27:2.6 cho cùng mệnh đề là *người có trí* ⇒ đã dùng lại nguyên văn.

  **`technical_integrity` = 9,6, và tôi không tuyên bố technical gate đã pass.** Tôi bị cấm chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`. Những gì tôi **đã** tự kiểm và đều bằng script: JSON hợp lệ 53/53 khoá; NFC sạch (0 khoá lệch); `set(khoá Việt) == set(khoá Pāli)` (0 thiếu, 0 thừa, 0 khoá rỗng); nháy kép cân 9/9 và **đúng vị trí từng khoá**; nháy đơn `‘’` cân và đúng vị trí; `”ti` 9 khoá khớp đúng 9 khoá của Pāli; 0 dấu lược; 0 khoá `(…)`; 2 nhóm Pāli lặp trong bài có Việt khớp tuyệt đối; chứt `_hvi.py` (`kiểm` + `save_vi`) báo **✓ an/an5.194 53 khoá**. Bốn cổng còn lại thuộc coordinator và CI.
