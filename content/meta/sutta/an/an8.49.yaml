notes: |-
  Dịch từ Pāli root đã ghim (khớp byte-for-byte với dump 57 khoá), tham chiếu bản Anh Bhikkhu Sujato tại cùng commit. Coverage Anh Sujato trên Pāli có nội dung: 35/35 = 100%. Tầng Việt hiện hành vắng ở commit đã ghim (chỉ có Pháp Cú) — không có bản HT. Thích Minh Châu để đối chiếu.
  **Số khoá: 57/57 đúng dump header. Pāli trùng nguyên văn: 15/57 khoá, 13 dùng lại NGUYÊN VĂN theo đa số.** `2.2`=`7.2` "Katamehi catūhi?" 80 trùng, đa số 63/63… 63/80 cho «Thế nào là bốn?»; `8.3` lời tán thát Đức Phật 34 trùng, đa số 9/34 → dùng đúng chuỗi «‘Bậc Thế Tôn ấy là bậc A-la-hán, Chánh Đẳng Giác…bậc Phật, Thế Tôn.’»; `4.3` trùng nguyên văn an8.48:5.2; các câu thơ `13.2` (2/3), `13.3` (2/3), `13.4` (2/4), `14.1` (5/6), `14.2` (2/5), `14.3` (1/1, an8.75), `14.4` (1/1, an8.75), `15.1` (1/1, an8.75); `0.2` trùng 4/4 → «5. Phẩm Giữ Trai».
  **2 khoá trùng có lựa chọn biên tập.** `1.1` ("Ekaṁ samayaṁ bhagavā sāvatthiyaṁ viharati pubbārāme migāramātupāsāde") 3 bản 1-1-1, không bản nào trọn: ghép từ phần chi phối tầng — «Tu viện Đông» (3 tiền lệ) + «lầu nhà» (4) + «mẹ Migāra» (7) + «Đức Thế Tôn» theo chu kỳ Visākhā (an8.47). `1.3` 1-1 (ud2.9/ud8.8 «Visākhā, mẹ của Migāra») — chọn kiểu chu kỳ an8.47:1.3 «Visākhā mẹ Migāra» để nhất quán trong bài (`1.1`, `1.2`).
  **Tiêu đề `0.3` "Paṭhamaidhalokikasutta" không có tiền lệ** (an8.50 chưa dịch); theo mẫu hậu tố lặp «(1)» (33 tiền lệ) → «Kinh Thắng Đời Này (1)», khớp tiêu đề Sujato "Winning in This Life (1st)" và thân bài `idhalokavijayā` → «chiến thắng đời này» (`paraloka` → «đời sau», 173 tiền lệ vs «cõi bên kia» 5).
  **Thuật ngữ theo chu kỳ Visākhā (an8.47/an8.48):** `mātugāmo` → «người nữ»; `cāga` → «thí xả»; `upāsikā` → «nữ cư sĩ»; bốn mục `adhuttī athenī asoṇḍī avināsikā` (6.2) và công thức `vigatamalamaccherena…` (10.2) tái dùng đúng chuỗi an8.48. Khoá thơ `13.1`, `15.2`–`16.2` không có trùng → dịch mới ngắn theo nhịp thơ, giữ số (tám pháp, mười sáu phương diện, tám phần). Ghi chú: an8.48:6.1 có lặp chữ «Tiền của của» — khoá tương ứng của tôi (6.2) viết sạch «tiền của»; đề nghị coordinator rà an8.48.
  Cổng kỹ thuật do coordinator chạy; đã tự kiểm: JSON hợp lệ, NFC, đủ 57 khoá, parity dấu lược (`…pe…` = 1 lược, giữ `…`), không chép Pāli.

