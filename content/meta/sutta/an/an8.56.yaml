notes: |-
  `Bhayasutta` trong `Gotamīvagga`. 35 khoá, tất cả đã dịch. Có tầng Anh Sujato tại commit đã ghim (`an8.56_translation-en-sujato.json`): 11/11 khoá Pāli có nội dung đều có chữ Anh = **100%**, không phụ thuộc lớp lấp của dự án, nên `triangulation` cao hơn hẳn `an2.1`.

  **BÀI SONG SONG ĐÃ CÓ: `an6.23` (cùng Pāli `Bhayasutta`).** Nó dùng **đúng** công thức `“‘X’ti, bhikkhave, kāmānametaṁ adhivacanaṁ` cho sáu thuật ngữ, nên an8.56 dùng lại nguyên văn cả sáu để `an6.23` và `an8.56` không tự mâu thuẫn: *Sợ hãi · Khổ đau · Bệnh tật · Cặn lắng · Vướng mắc · Bùn lầm*, cùng `kāmānametaṁ adhivacanaṁ` → *là tên gọi của dục*. `an8.56` thêm hai thuật ngữ mà `an6.23` không có: `salla` → **gai nhọn** (tiền lệ `ud3.2`: *gai nhọn của sự thiền*) và `gabbha` → **bào thai** (tiền lệ `thag1.101:1.4`: *lại nhiều lần nữa đi vào bào thai*).

  KHÔNG CHÉP LỖI CỦA TIỀN LỆ. `an6.23:2.2` dịch `Yasmā ca kāmarāgarattāyaṁ, chandarāgavinibaddho diṭṭhadhammikāpi bhayā na parimuccati …` thành *“vì bị trói buộc bởi ham muốn và tham nên sợ hãi, dù loại hiện tại vị ấy cũng không thoát khỏi …”* — vừa thêm vừa lộn chủ thể (chính người ấy bị trói buộc, không phải *bị trói buộc vì* sợ hãi). `an8.56:1.10` và `:1.18` dịch lại từ Pāli: *Vì bị tham dục làm mê hoặc, bị ham muốn trói buộc … người ấy không thoát khỏi nỗi sợ ngay trong hiện tại, cũng không thoát khỏi nỗi sợ trong đời sau*. Giữ đúng tên thuật ngữ, **không** chép lỗi diễn đạt.

  DẤU LƯỢC — sáu khoá có dấu lược: `1.11` mang `…pe…` (một dấu), `1.12`–`1.16` mang `…`. Cả bảy giữ **đúng một** `…` mỗi khoá, không mở rộng. Ngoặc kép: `“` mở ở `1.1` và `”ti.` đóng ở `4.4`, đúng như Pāli (theo mẫu đã cân của `an6.23`: `“` ở `1.1`, `”ti.` ở `5.4`); các thuật ngữ trong ngoặc dùng nháy cong `‘’` và cân trong từng khoá.

  KHUÔN KỆ 3–4. `4.1`–`4.4` (`So imaṁ palipathaṁ duggaṁ / atikkamma tathāvidho; Pajaṁ jātijarūpetaṁ / phandamānaṁ avekkhatī”ti.`) đọc *thì bằng cách ấy vượt qua con đầy lầy lội khó đi ấy; / Họ thấy quần chúng ấy / đang lăn tăn lộn cào trong sinh già”ti.* — `So` ở đây là *bằng cách ấy*, không phải *kẻ ấy*; `avekkhatī` là thấy quan sát nên để ngôi thứ ba, đúng chỗ song song 1.9–1.18.

  Có tiền lệ Pāli trùng nguyên văn: `6. Gotamīvagga` → *6. Phẩm Gotamī* (an8.52/53/57/58/59), `Bhayasutta` → *Kinh Sợ Hãi* (`an6.23:0.3`), `Kasmā ca, bhikkhave, ‘bhayan’ti kāmānametaṁ adhivacanaṁ?` → *Vì lý do gì mà, này các tỳ-kheo, dục ấy được gọi là ‘sợ hãi’?* (`an6.23:2.1`), `Yato ca bhikkhu ātāpī,` → *Khi mà vị tỳ-kheo tinh cần,* (sn36.3/12), `Chaṭṭhaṁ.` → *Thứ sáu.*

