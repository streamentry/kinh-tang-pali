notes: |-
  Đã đọc hết Pāli của bài (97 khoá, tiền tố `an7.56:`) trước khi viết; ghi đủ 97/97 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá nào ngoài tập khoá Pāli. Đã in cặp Pāli↔Việt từng khoá ra đọc đối kháng sau khi ghi.
  **Coverage Anh (đo thật):** mẫu số = 68 khoá Pāli có nội dung (>= 40 ký tự, bỏ khối `:0`). Sujato phủ **53/68 = 77,9%**, dưới sàn 0,80; 15 khoá Sujato để trống là các khoá công thức lặp `2.2`, `2.5`, `2.7`, `3.4`, `4.12`, `4.14`, `5.2`, `5.4`, `6.3`, `6.6`, `7.7`, `8.7`, `9.7`, `10.9`, `13.7` (Sujato chỉ dịch lần đầu của mỗi đoạn lặp và bỏ trống chỗ lặp lại). Lớp `english-project` của dự án (published, assessed_by khác bản Việt này) lấp đủ 15/15 khoá đó, nên cổng của kho tính 68/68 = 1,0; nhưng lớp lấp được viết từ chính Pāli và bản Việt hiện hành, không phải bản Anh độc lập, nên `triangulation` chỉ tính cho 53 khoá có Sujato và hạ xuống 7,5, và bài giữ `draft` kèm blocker (như sn22.7) cho đến khi có người xử lý độ phủ độc lập. Tầng `vietnamese-current` vắng ở commit đã ghim (chỉ có Pháp Cú); bản Hòa thượng Thích Minh Châu nguyên bài (đã đọc) chỉ dùng làm tra cứu toàn văn, không phải cột đối chiếu, và không được chép lại.
  **Pāli trùng nguyên văn:** trong chính bài có 9 nhóm Pāli trùng (30 khoá), cả 9 nhóm đều có bản Việt giống hệt nhau (0 cặp lệch). Với bài khác: dò 14 khoá có Pāli trùng ở tầng (từ 25 ký tự trở lên; 50 cặp), dùng lại nguyên văn 10 khoá — `1.2`, `2.1`, `3.1`, `3.5`, `3.7`, `4.2`, `4.7`, `4.8`, `4.9`, `4.10` (phần lớn từ `an6.34`, bài cùng tình huống Phạm thiên Tissa tiếp Tôn giả Mahāmoggallāna). 4 khoá còn lại cố ý khác: `3.2` thêm *Rồi* cho `atha kho` (các tiền lệ chỉ có *Tôn giả Mahāmoggallāna nghĩ:*, 2/5); `9.4`, `10.6`, `13.4` (Pāli trùng với `mn70`, 5 cặp) khác ở hai điểm: bỏ nháy đơn mở đầu vì ở đây nháy `‘` đã mở từ khoá trước (`9.3`/`10.5`/`13.3`) và Pāli khoá này không có nháy, đồng thời giữ dấu `—` cuối khoá đúng Pāli thay vì dấu phẩy.
  **Thuật ngữ — đo trên tầng, ghi cả khoá/tệp:** `saupādisesa`/`anupādisesa` → *còn dư y* / *không còn dư y* (*dư y* 37 khoá / 10 tệp; *còn dư y* 15/6); không dùng *chấp thủ* vì `upādāna`/`anupādāparinibbāna` ở `an7.55` là chữ khác. `ubhatobhāgavimutto` → *giải thoát hai phần* (8/4; *giải thoát cả hai phần* 4/1; *song phương* 2/2). `paññāvimutto` → *tuệ giải thoát* (101/52; *giải thoát bằng tuệ* 12/4). `kāyasakkhī` → *thân chứng* (128/23; *chứng thân* 12/3). `diṭṭhippatto` → *đạt kiến* (15/5; *quán đạt* 5/2; *kiến chí* 2/1). `saddhāvimutto` → *tín giải thoát* (20/7). `dhammānusārī` → *tùy pháp* (trong tầng chỉ có 4 khoá Pāli mang chữ này: *tùy pháp* 2, *thọ trì theo pháp* 2; chọn *tùy pháp* vì cùng dạng với *tùy tín* trong danh sách bảy hạng người ở các bài khác). `animittaṁ cetosamādhiṁ` → *tâm định vô tướng* (theo mẫu *tâm định vô lượng* của `appamāṇaṁ cetosamādhiṁ`, 6 khoá / 2 tệp; *vô tướng* 59 khoá / 17 tệp). `brahmakāyika` → *chư thiên thuộc hệ Phạm thiên* (*hệ Phạm thiên* 4 khoá / 2 tệp; *Phạm Chúng thiên* 1). `ādhipateyya` → *quyền chủ* (16/9). `santuṭṭha` → *hài lòng* (*hài lòng với* 19/14). `nissaraṇa` → *xuất ly* (*sự xuất ly* 157/32). `bhikkhuniyo` → *tỳ-kheo-ni* (302 khoá; không có dạng *tỳ-khưu-ni*). `abhinanditvā anumoditvā` → *hoan hỷ và tán đồng* (112/90). `padakkhiṇaṁ katvā` → *đi quanh … bên phải* (theo 2 khoá tiền lệ có cùng Pāli *Idaṁ vatvā maṁ abhivādetvā padakkhiṇaṁ katvā …*; *nhiễu* 188 khoá / 83 tệp ở các văn cảnh khác, không chọn để khỏi lẫn hai dạng trong một bài).
  **Số Pāli:** `dve` 2 (hai vị thiên), `sattama` 7 (hạng người thứ bảy: sáu hạng ở các mục `7`–`10` gồm giải thoát hai phần, tuệ giải thoát, thân chứng, đạt kiến, tín giải thoát, tùy pháp; hạng thứ bảy là người an trú vô tướng ở mục `13`), `tatiya` 3 (*Thứ ba.*, nhãn thứ tự ở cuối bài, dạng chiếm 127/128 khoá ở tầng). Không có số lớn.
  **Công thức `saupādisese vā saupādisesoti, anupādisese vā anupādiseso`:** không có tiền lệ nguyên văn trong tầng (0 khoá). Dịch *người còn dư y là còn dư y, hoặc người không còn dư y là không còn dư y* theo cấu trúc Pāli (hai vị trí cách *saupādisese*/*anupādisese* lặp lại ở danh từ `-oti`), gần với Sujato (*whether a person has remainder or not*) và bản Hòa thượng Thích Minh Châu (*có dư y là có dư y hay không có dư y là không có dư y*); giữ lặp lại hai vế như Pāli thay vì nén thành *còn hay không còn dư y*. Cả 12 khoá mang công thức này đều cùng một câu Việt.
  **Bất định đã ghi, không đưa vào thân kinh:** (1) `te` ở `12.1` (*Na hi pana te, moggallāna*): đọc là đại từ ngôi hai *(cho) ông*, theo cả bản Hòa thượng Thích Minh Châu (*không nói cho Thầy*) lẫn Sujato (bỏ qua chữ này); `deseti` ở thì hiện tại, dịch *không nói cho ông về …* không thêm *đã*. (2) `uttari nissaraṇaṁ` ở `6.1`, `6.4`: dịch *sự xuất ly vượt lên trên*, theo cách đọc `uttari` là phó từ *vượt hơn* (Sujato *any escape beyond*; bản Hòa thượng Thích Minh Châu *xuất ly cao hơn trạng thái ấy*) và đồng nhất với `uttari` ở `an7.55` (*vượt lên trên*); Pāli không nói rõ cái gì bị vượt, nên không thêm *trạng thái ấy*. (3) `brahmakāyikā devā`: có thể hiểu là tập thể chư thiên Phạm chúng; giữ *chư thiên thuộc hệ Phạm thiên* theo tiền lệ thay cho tên cõi *Phạm Chúng thiên*, vì Pāli ở `3.5`, `4.1` dùng `brahmaloka` cho cõi và `brahmakāyika` cho nhóm chư thiên. (4) `10.1`–`10.2`: hai khoá `…pe…` (đạt kiến, tín giải thoát) lược hai hạng người; dịch chỉ phần Pāli có (*là bậc đạt kiến …*, *là bậc tín giải thoát …*) và giữ một `…` mỗi khoá; khoá `10.2` bắt đầu bằng *là* vì Pāli không lặp chủ ngữ. (5) `Appeva nāma … vihareyyā'ti` (`9.4`–`9.5`, `10.6`–`10.7`, `13.4`–`13.5`): câu dài kèm mệnh đề quan hệ `yassatthāya … tadanuttaraṁ` ở giữa hai dấu `—`; dịch *biết đâu … vị ấy sẽ … chứng đạt và an trú sự kết thúc tối thượng của đời phạm hạnh — mục đích mà vì nó các thiện nam tử … xuất gia*, đặt mệnh đề quan hệ sau danh từ để câu Việt rõ nghĩa (giống cách `mn70` làm); đã dùng *chứng ngộ bằng thắng trí* (`sayaṁ abhiññā sacchikatvā`) theo `an7.55`, tránh *chứng biết* của `mn70`. (6) `Evaṁ me sutaṁ—` ở `1.1`: dịch *Tôi nghe như vầy.* (27 khoá, so với 17 khoá có dấu `—`); không giữ dấu `—` cuối câu vì khoá này đứng riêng.
  **Dấu lược:** 2 khoá có `…pe…` (`10.1`, `10.2`), mỗi khoá đúng một `…`. Nháy đơn/kép khớp Pāli 97/97 khoá (0 lệch); NFC sạch, 0 khoá rỗng, 0 khoá chứa Pāli ngoài tên riêng.
