notes:
  - >-
    **Bài ngắn, cấu trúc thuần: định nghĩa – hỏi – đáp – lặp.** Bốn mục với năm
    mục là sự thật tối giản, nên dịch theo đúng bốn nhịp; phần lặp ở `3.x`–`6.x`
    là **bài kết** của người đọc chứ không phải lỗi lặp.
  - >-
    **`pañcaṅga`/`chaḷaṅga` → *năm phần*/*sáu phần***: 25 segment trong corpus
    đang chia đôi — *yếu tố* 35 (đều ở `an3.19`, `an3.133`, `an5.135`… với nghĩa
    *nhân tố* của một người) và *phần* 22 (`an3.57`, `an4.112`, `an4.181`,
    `sn3.24`…). **Tôi chọn *phần*** vì ở đây nói đúng **năm phần bị trói buộc**
    `kāmacchando … vicikicchā`, mà tiền lệ trực tiếp cho đúng nghĩa đó là
    `an3.57:4.2` và `sn3.24:3.1` (*năm phần*). Ghi lại để người sau không tưởng
    là thiếu nhất quán.
  - >-
    **`Nāthavagga` → *Phẩm Bảo Hộ*** (0 segment tiền lệ, đặt mới): `nātha` là
    người bảo hộ, chỗ nương tựa — và Sujato dịch tên phẩm là *A Protector*. Cả
    phẩm đúng ngữ nghĩa đó: `nāthakaraṇā dhammā` → *mười pháp làm nên sự bảo
    hộ*, `sanāthā … mā anāthā` → *hãy sống có chỗ bảo hộ, đừng sống không chỗ
    bảo hộ*, `anātho viharati` → *sống không chỗ bảo hộ là khổ đau*. Vì ba cụm
    này lặp ở `an10.17` và `an10.18`, tôi dùng **cùng một cách** cho cả ba bài;
    `an10.19`–`an10.20` dùng `ariyāvāsā` → *chỗ ở của bậc Thánh* (cũng 0 tiền
    lệ), đối xứng với `senāsana` → *chỗ ở*.
  - >-
    **`kāmacchando pahīno hoti …` ở `1.3` dùng nguyên văn `an3.57:4.2`** (cùng
    Pāli) — *dục tham… sân hận… hôn trầm thụ miên… phóng dật hoặc hối… hoài
    nghi*. `an3.121:3.2` cũng dùng *dục tham* cho `kāmacchanda`.
  - >-
    **`asekhena … khandhena samannāgato` ở `2.2` dùng nguyên văn `an5.108:2.2`**
    (cùng Pāli, đã `published`) — *đầy đủ giới uẩn vô học, đầy đủ định uẩn vô
    học, đầy đủ tuệ uẩn vô học, đầy đủ giải thoát uẩn vô học, và đầy đủ giải
    thoát tri kiến uẩn vô học*.
  - >-
    **`kevalī vusitavā uttamapuriso` → *viên mãn, đã vận hành, bậc tối thượng***
    (0 segment, đặt mới): `vusitavā` theo `an3.37:7.1` và `an3.38:4.1` (*đã sống
    trọn đời phạm hạnh*), `kevalī` là *viên mãn*, `uttamapuriso` là *bậc tối
    thượng*. **Vì đây là danh xưng của vị tỳ-kheo, tôi đặt trong ngoặc kép** ở
    `6.4` — *được gọi là ‘viên mãn’* — vì Pāli dùng `ti` (danh xưng), khác
    `ayampi dhammo` ở bài kế.
  - >-
