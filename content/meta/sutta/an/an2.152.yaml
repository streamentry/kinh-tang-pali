  - >-
    **Quy tắc dấu lược giữ nguyên.** Quy tắc là **có/không có `…` phải khớp theo
    từng segment**; ở loạt này tôi giữ dấu lược nguyên văn và **không** mở rộng
    `…pe…`. Rõ nhất ở `sn22.16:1.5`–`1.7` và `sn22.17:1.4`–`1.6` (bốn giác quan
    ở giữa danh sách), `sn25.3:1.3`–`1.6` (năm thức ở giữa), `sn22.16:1.11` và
    `sn22.17:1.9`, `an2.50:1.3` (Sujato điền đủ phần bị lược).
  - >-
    **Hình dạng bài con của một tệp Pāli dùng chung.** 34 bài `an2.*` nằm trong
    tệp dải (`an2.11-20`, `an2.98-117`, …) nên **không có** khoá `0.2`/`0.3` và
    có thêm khoá `1.0` chứ **số thứ tự trong phẩm**. Tôi dịch `1.0` thành
    **chính con số** (`78`), theo tiền lệ `an1.100:1.0` = *100*, và **không**
    bịa thêm tên phẩm hay tên kinh vào tệp dịch — tên kinh nằm ở
    `translationTitle` của metadata. Chỉ `an2.21` và `an2.77` là bài đầu tệp dải
    nên có `0.1`/`0.2`; `an2.86` mang thêm `1.3` = `Sanimittavaggo tatiyo.` và
    `an2.76` mang thêm `1.6` = `Sukhavaggo dutiyo.`
  - >-
    **Bản Anh Sujato sai ở `an2.57`–`an2.59:1.1` — tôi theo Pāli, không theo
    Sujato.** Pāli `Dveme, bhikkhave, asaniyā phalantiyā na santasanti.` (ba
    bài, giống hệt nhau về lời), nhưng Sujato đặt cho cả ba câu **“These two,
    mendicants, are not startled by a crack of thunder.”** — đó là lời của
    `sūladena mukhaṁ naṁkhamati`, tức một bài khác trong chính phẩm. Vế `1.3`
    của Sujato thì **đúng** (một vị tỳ-kheo đã cạn lậu và con ngựa thuần thục /
    con voi thuần thục / con sư tử vua của loài thú), nên đây là lỗi ghép Pāli ở
    `1.1`, không phải lỗi cả bài. Tôi dịch `1.1` theo Pāli: *Có hai loại, này
    các tỳ-kheo, là không cây nào mà không quả, không quả nào mà không cây.*
  - >-
    **Dùng lại nguyên văn đã `published`:** `kukkuccā` → *hối tiếc*
    (`an3.33:4.4`) · `accayaṁ accayato passati` / `na passati` → *nhận ra /
    không nhận ra lỗi lầm của mình* và `accayaṁ desentassa yathādhammaṁ
    paṭiggaṇhāti` → *chấp nhận, theo đúng Chánh Pháp, lời sám hối của người tỏ
    bày lỗi lầm* (`sn11.24:2.5`, nguyên văn cả hai chiều) · `khīṇāsavo` → *đã
    cạn lậu* (`an3.115:3.2`) · `hatthājānīyo` → *con ngựa thuần thục*
    (`an3.100:10.2`) · `assājānīyo` → *con ngựa thuần thục tốt* (`an3.96:1.1`) ·
    `migarājā` → *vua của loài thú* · `micchādiṭṭhi`/`sammādiṭṭhi` → *tà kiến* /
    *chánh kiến* · `manasikāro` → *tác ý* (`an10.47:1.7`) · `ayoniso`/`yoniso` →
    *vô ích* / *đúng chỗ* (cùng chỗ) · `tassasā dhammapaṭisanthāro` → *tiếp đãi
    bằng pháp* · `Sāvatthinidānaṁ` → *Tại Sāvatthī* · `‘netaṁ mama, nesohamasmi,
    na meso attā’ti evametaṁ yathābhūtaṁ sammappaññāya daṭṭhabbaṁ` → *cần được
    thấy như thật bằng chánh tuệ như vầy: ‘Cái này không phải của tôi, tôi không
    phải là cái này, cái này không phải là ngã của tôi.’* (`an4.177:2.2`) · `Yaṁ
    dukkhaṁ tadanattā` → *Ở chỗ nào là khổ, chỗ ấy là vô ngã*
    (`sn35.207-209:1.2`, nguyên văn) · `Evaṁ passaṁ …pe… nāparaṁ itthattāyā’ti
    pajānātī”ti` → *Thấy rộ như thế … thì biết rõ* + *không còn gì nữa cho sự
    hiện hữu này* (`an3.130:3.3`) · `aniññaṁ aññathābhāvi` → *làm thay đổi khác
    thường* · `sambodhiparāyano` → *hướng chắc chắn đến giác ngộ* (`an3.86:2.6`)
    · `duccarite`/`sucarite` → *hành hạnh xấu* / *hành hạnh thiện* (theo
    `an3.155:1.1`) · `anuvicca viññū garahanti`/`pasaṁsanti` → *những bậc hiểu
    biết liền kia chê bai / ca ngợi* · `pāpako kittisaddo abbhuggacchati` →
    *tiếng xấu vẫn lan ra* và `kalyāṇo kittisaddo abbhuggacchati` → *tiếng khen
    của người tốt lan xa* (quyết định PR #127).
  - >-
    **0 tiền lệ, đặt mới, ghi kèm lý do:** `āsava vaḍḍhanti` → *có hai lậu này
    lớn lên* · `na kukkuccāyitabbaṁ kukkuccāyati` → *người đáng hối tiếc thì lại
    hối tiếc* · `akappiye kappiyasaññī` → *thấy điều không đáng làm là đáng làm*
    · `āpattiyā anāpattisaññī` → *thấy đã phạm giới là không phạm giới* ·
    `adhamme dhammasaññī` → *thấy điều phi pháp là có pháp* · `avinaye
    vinayasaññī` → *thấy điều không tạo nên là có tạo nên* · `Titto ca tappetā
    ca` → *kẻ tự hài lòng, và kẻ làm cho người khác hài lòng* (⚠ bản đầu tôi
    hiểu nhầm là *người gieo hạt / gặp quả* — Sujato dịch *one who is satisfied,
    and one who satisfies others* xác nhận nghĩa tôi chọn, đã sửa) · `dullabhā
    lokasmin` → *hiếm có ở thế gian* · `duttappayā`/`sutappayā` → *khó gặp lành*
    / *dễ gặp lành* · `laddhaṁ laddhaṁ nikkhipati` / `vissajjeti` → *nhận rồi
    nhận thì giữ lại* / *nhận rồi nhận thì trao cho* · `paccayā … uppādāya` →
    *hai duyên cho … sinh khởi* · `Subhanimittañca` → *tác ý vào vẻ đẹp*
    (Sujato: *the feature of beauty*) · `Parato ca ghoso` → *tiếng nói từ người
    khác* · `dhammadesanā` → *kiểu giảng pháp của bậc Như Lai* · `saṅkhittena ca
    vitthārena ca` → *giảng rút gọn và giảng đầy đủ* · `paṭisanthārā` → *kiểu
    tiếp đãi* · `āmisapaṭisanthāro` → *tiếp đãi bằng vật nuôi* (Sujato:
    *hospitality in things of the flesh*) · `gatī pāṭikaṅkhā` → *chỗ đi đáng
    mong đợi* · `tiracchānayoni` → *cõi loài chó* (Sujato: *the animal realm*) ·
    `devā vā manussā vā` → *cõi trời hoặc là cõi loài người* · `parisā` → *hội
    chúng* · `asaniyā phalantiyā na santasanti` → *không cây nào mà không quả,
    không quả nào mà không cây* · `atitto appaṭivāno mātugāmo` → *người đàn bà
    chưa từ chán, chưa từ quay lại* (⚠ **lệch có chủ đích** với tiền lệ
    `mātugāmo` → *thân người* ở `sn37.*` và *người nữ trong gia tộc* ở PR #127;
    ở đây Pāli mô tả một người đàn bà chưa từ chán nản, nên tôi dịch theo ngữ
    cảnh) · `Methunasamāpattiyā ca vijāyanassa ca` → *sự chấp nhập tà dâm và sự
    sinh con* (Sujato: *sexual intercourse and giving birth*; **không** *sự
    phóng dã*) · `sappītika`/`nippītika` → *sự gắn bó* / *sự không gắn bó*
    (Sujato: *the happiness of attachments / of no attachments*) ·
    `sappītikārammaṇa` → *sự tựa vào* (Sujato: *relies on*) · `sātārammaṇa` →
    *sự tựa vào sự hân hoan* (Sujato: *relies on rapture*; **không** *tham
    muốn*) · `upekkhārammaṇa` → *sự tựa vào sự không hân hoan* (Sujato: *relies
    on freedom from rapture*) · `rūpārammaṇa`/`arūpārammaṇa` → *sự tựa vào sắc*
    / *sự tựa vào vô sắc* · `saṅkhata` → *điều kiệt rừng* (giữ nguyên quyết định
    PR #120, khác *vô vi* ở `an3.47`) · `nimitta`/`nidāna`/`hetu`/`saṅkhāra`/`pa
    ccaya`/`rūpa`/`vedanā`/`saññā`/`viññāṇa` trong loạt `an2.77`–`86` → *dấu
    hiệu* / *nhân* / *nguyên nhân* / *hành* / *điều kiện* / *hình tướng* / *cảm
    thọ* / *tưởng* / *thức* (phải phân biệt từng cặp vì Pāli chỉ khác một âm
    tiết) · `cakkhuviññāṇaṁ` → *thức của mắt* (theo `cakkhudhātu` → *sở mắt* ở
    `sn14.1:2.2`) · `vipariṇāmi aññathābhāvi` → *làm thay đổi khác thường* ·
    `Sūddhasutta`-style `0.3` vắng mặt ở bài con của tệp dải → tên kinh do tôi
    đặt ở `translationTitle`, **không** ghi vào tệp dịch.
  - >-
    **Lệch có chủ đích, ghi để người biên tập xem:** `atitto appaṭivāno
    mātugāmo` ở `an2.61` dịch *người đàn bà chưa từ chán, chưa từ quay lại*,
    **khác** tiền lệ `mātugāmo` → *thân người* (`sn37.*`) và *người nữ trong gia
    tộc* (PR #127). Lý do: ở đây Pāli mô tả một người đàn bà chưa từ chán nản và
    chưa từ quay lại, nên dịch theo ngữ cảnh; tôi **không** âm thầm viết lại
    `sn37.*`.
  - >-
    **Bẫy đã tránh trong lát nàa:** (a) **đừng dùng chung một khuôn cho các bài
    khác hình dạng** — loạt
    `an2.71`–`an2.76` cùng khung *hai sự sướng* nhưng `an2.75` và `an2.76`
    **không** mở đầu bằng `sappītika`;
    bản đầu tôi để chung vế đó và đã sửa. Tương tự, `an2.123`–`an2.126` cùng
    khung nhưng `an2.123`/`125`/`126`
    nói về **duyên**, không phải **loại người**; bản đầu tôi để chung *Có hai
    loại người này*, đã sửa.
    (b) **Dấu chấm kép** ở `1.3` của `an2.120`–`an2.126` — bản đầu tôi nối hai
    vế bằng dấu chấm rồi lại thêm
    một dấu nữa, ra *… hạt. người …*; đã sửa thành *…, và …*. (c) **Bỏ chủ thể
    khi Pāli có** — `an2.77` mang
    `0.1`/`0.2` vì là bài đầu tệp dải; bản đầu thiếu, checker bắt được. (d)
    **Không bịa `0.2`/`0.3` cho bài
    con của tệp dải** — 34 bài `an2.*` không có hai khoá đó. (e) **Đọc Pāli từng
    bài** — `an2.57`–`an2.59` có
    cùng lời Pāli nhưng Sujato ghép nhầm; xem ghi chú riêng. (f) **`nāparaṁ
    itthattāyā’ti` khác
    `nāparaṁ itthattāyāti`** ở `sn35.207-209`; tôi dịch hai dạng khác nhau, đã
    so.
  - >-
    **6 khoá**; có khoá `1.5` vế chốt `Etadaggaṁ` (tối thượng).
