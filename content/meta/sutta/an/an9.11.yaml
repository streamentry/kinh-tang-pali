notes: |-
  Dịch toàn bộ 62 khóa Pāli root từ snapshot SuttaCentral/Bilara đã ghim; không có khóa nào ngoài tập khóa Pāli.

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE ENGLISH:
  - Tầng Anh Sujato phủ 57/57 khóa Pāli có nội dung (>= 40 ký tự, bỏ khối :0); chỉ khóa colophon 14.5 để trống ở Sujato (Pāli "Paṭhamaṁ." ngắn hơn ngưỡng). Tầng english-project không có tệp cho bài này; tầng Việt hiện hành (Hòa thượng Thích Minh Châu) không có trong snapshot đã ghim, nên chỉ tiền lệ Việt trong chính tầng dự án được dùng để đối chiếu thuật ngữ. Vì không có bản Việt truyền thống độc lập, triangulation đặt 9.0.
  - Không phát sinh gap coverage; không cần entry trong reference-gaps.

  KIỂM TRA ĐO ĐƯỢC:
  - Tập khóa Việt = tập khóa Pāli = 62, thứ tự khóa đúng thứ tự Pāli.
  - Nháy đơn, nháy kép và dấu lược khớp Pāli từng khóa: 0 lệch trên 62 khóa. Pāli có 4 dấu lược "…" nằm giữa câu (các khóa 5.1, 6.1, 7.1, 8.1), không có "…pe…"; bản Việt giữ đúng 4 dấu ở đúng vị trí.
  - Pāli trùng nguyên văn trong chính bài: 8 khóa (4.3, 5.3, 6.3, 7.3, 8.3, 9.3, 10.3, 11.3) tạo 28 cặp, bản Việt khác 0 cặp. Hai khóa 3.1 và 12.3 cùng câu nhưng khác dấu nháy mở/đóng so với tám khóa trên, được dịch cùng một câu và chỉ khác dấu nháy; các cặp 1.8/2.6 và 1.11/1.13 không trùng byte (sandhi và dấu nháy) nhưng được dịch cùng nghĩa.
  - Không có chữ số trong thân kinh; không có số Pāli cần tính (không có số lượng); không có khóa rỗng; NFC sạch; không có Pāli lọt sang bản Việt.

  THUẬT NGỮ VÀ TIỀN LỆ (đếm trên tầng):
  - aṭṭīyati harāyati jigucchati -> "ghê tởm, xấu hổ và chán ghét": 9 khóa theo dạng này, 4 khóa "kinh khải, khó chịu và chán ghét" (an9.40), còn lại các dạng rải rác; chọn dạng đa số.
  - vipulena mahaggatena appamāṇena averena abyāpajjena -> "rộng lớn, cao cả, vô lượng, không thù hận, không ác ý": dạng đa số trên toàn tầng (an4.125, an6.26, an9.18, an10.219, sn41.7...).
  - sabrahmacārī -> "đồng phạm hạnh": 246 khóa, so với "bạn đồng phạm hạnh" 16 khóa.
  - sīhanādaṁ nadati -> "rống tiếng rống sư tử": 28 khóa (so với "tiếng rống sư tử" 31 khóa ở các vị trí danh từ).
  - Công thức nhận lỗi accayo accagamā yathābālaṁ yathāmūḷhaṁ yathāakusalaṁ và accayaṁ accayato paṭiggaṇhatu āyatiṁ saṁvarāyā dùng lại cách dịch an3.91 và an4.159 (an3.91:3.13 gần như nguyên văn); "vu khống" cho abbhācikkhi (an4.193 dịch "lừa gạt", an3.57 "phỉ báng" ở ngữ cảnh khác).
  - Phẩm: "2. Phẩm Tiếng Hồi" theo 8 khóa an9.12, an9.14 đến an9.20 (an9.13 có "Tiếng Hùng Vĩ" một khóa).
  - moghapurisa -> "kẻ ngu si": cùng bộ AN có "kẻ ngu"/"kẻ ngu si" (an5.55, an5.100, an5.167, an6.29, an6.49, an8.63); trong MN có "người rỗng tuếch" (mn136, mn70, mn109). Chọn dạng của bộ gần nhất; bāla ở 13.2 và 13.4 dịch "kẻ ngu" nên hai từ vẫn phân biệt được.
  - "đi vòng bên phải" cho padakkhiṇaṁ katvā, "cầm chìa khóa" cho avāpuraṇaṁ ādāya (mn124:40.1), "Chư Tôn giả hãy đi ra" cho abhikkamathāyasmanto (mn124:40.3).

  BẤT ĐỊNH (không thêm vào thân kinh):
  - āsajja (1.8, 2.6, 3.1): Pāli nói chung chung, có thể là xúc phạm bằng lời hoặc va chạm; dịch "xúc phạm", cùng nghĩa "attack" của Sujato. appaṭinissajja dịch "không xin lỗi" (không thu hồi/không giải quyết lỗi), theo Sujato.
  - gūthagata, muttagata, kheḷagata, pubbagata, lohitagata: dịch "vật dính phân/nước tiểu/nước bọt/mủ/máu"; chữ -gata có thể đọc là "dính vào" hay "thuộc về".
  - kaḷopihattho (9.1): Sujato dịch "pot"; dịch "cái nồi", nghĩa chính xác của kaḷopi (nồi, giỏ hay bát) chưa phân xử được.
  - caṇḍāla dịch "người dọn xác chết" theo an4.85 (cách dịch toàn tầng còn nhiều dạng: người xác làm, người phẫu uế, thấp tiện).
  - medakathālikā (12.1): dịch "bát mỡ" (bát đựng mỡ); khác với tên riêng Medakathālikā ở sn47.19.
  - khīyanadhammaṁ āpanno (2.5): dịch "đã phàn nàn".
  - kālaṁ maññasī (1.5): dịch "ông thấy lúc nào thích hợp thì cứ đi"; động từ "đi" được hiểu từ ngữ cảnh.

  TECHNICAL INTEGRITY: không chạy các lệnh cổng của kho trong lượt này; technical_integrity đặt 9.6. Còn phải chạy: npm run validate, npm test, npm run check, npm run build.
