notes: |-
  Lớp lược trần (Pāli ghi `…` ở giữa khoá, bản Việt viết đủ thành văn): đã khôi phục 8 dấu lược ở 4 khoá (2.1, 3.1, 4.1, 5.1), không còn khoá nào lệch. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Pāli: `… abhijjhābyāpādo vigato hoti, thinamiddhaṁ … uddhaccakukkuccaṁ … vicikicchā pahīnā hoti, …`. Mỗi dấu lược nuốt đúng một vế lặp lại y hệt vế đầu, nên bản Việt còn lại chỉ là danh từ + dấu lược: đã thay hai vế đã đoạn trừ đứng sau hôn trầm cùng buồn ngủ và sau trạo cử cùng hối quá bằng dấu lược.
  Cùng công thức này lặp ở cả bốn khoá (đi, đứng, ngồi, nằm trong khi thức) và chỉ khác ở động từ; bốn khoá đã sửa giống nhau, không có khoá nào phải để nguyên.
  Hạ nhẹ `semantic_fidelity` 9.4 xuống 9.2 vì đây là cắt cơ học theo Pāli, chưa qua một lượt review đối kháng riêng.
