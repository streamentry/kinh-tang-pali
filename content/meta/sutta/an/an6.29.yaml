  - >-
    **Danh sách thân tướng `6.2` — đã đếm từng mục, và ĐÃ BẮT ĐƯỢC LỖI CỦA CHÍNH
    BẢN NHÁP.** Pāli có **31** thành phần (tách theo `,` và cả ` và `, vì
    `lasikā muttan` là hai mục). Bản nháp đầu của tôi có **32** mục vì lấy cả
    *não* lẫn *mủ* cho một từ `pubbo`. Đo hai bản đã có: `dn22:5.2` = **31**
    mục, đúng thứ tự Pāli; `an10.60:6.3` = **32** mục ⇒ **thừa 1**, chính vì
    dịch `pubbo` thành BOTH *não* (đặt lạch sau `karīsaṁ`) và *mủ* (đúng chỗ sau
    `semhaṁ`). Tôi theo `dn22` cho `pubbo → mủ` (đúng thứ tự, đủ số, khớp Sujato
    *pus*), nhưng giữ *tủy xương*, *mạc treo ruột*, *dầu mỡ* của `an10.60` vì
    đúng nghĩa hơn *tủy*, *màng ruột*, *chất nhờn*. Bản của tôi = **31, khớp
    Pāli**. Người điều phối nên sửa `an10.60:6.3` cho khớp — lát này không có
    quyền sửa tệp ngoài phạm vi.
  - >-
    **`8.1` — Sujato thêm một loài vật mà Pāli không có, tôi không theo.**
    Sujato đọc *crows, hawks, vultures, hounds, jackals*, tức 5 loài; Pāli chỉ
    có 5 mục `kākehi kulalehi gijjhehi sunakhehi siṅgālehi` rồi tới `vividhehi
    pāṇakajātehi`. Sujato biến `sunakhehi` thành *hounds* và `siṅgālehi` thành
    *jackals*, còn `gijjhehi` thành *vultures* — tức dịch lệch chỗ nhưng vẫn đủ
    5. Tôi giữ ánh xạ đã có của kho từ danh sách 8 mục ở `mn10:16.1` /
    `mn13:22.2`: `kākehi` = *quạ*, `kulalehi` = *diều hâu*, `gijjhehi` = *kền
    kền*, `sunakhehi` = *chó*, `siṅgālehi` = *chó rừng*, rồi *nhiều loài sinh
    vật nhỏ*. `dn22:8.1` dịch cụng 8-mục thành 7 và có vẻ lạm dụng *cò*; tôi
    không sao chép lỗi đó.
  - >-
    **Sujato có một lỗi đếm lần, Pāli là authority, tôi theo Pāli.** `1.9` là
    `Tatiyampi kho āyasmā udāyī tuṇhī ahosi.` (lần **thứ ba**), nhưng bản Anh đã
    ghim dịch *"And a second time and a third time Udāyī kept silent."* — gộp
    `1.3` và `1.6` vào `1.9`. Tôi dịch từng khoá: `1.3` *Nói vậy, Tôn giả Udāyī
    im lặng.*, `1.6` *Lần thứ hai nữa…*, `1.9` *Lần thứ ba nữa…*. Nếu theo bản
    Anh thì bài sẽ đếm sai ba lần hỏi.
  - >-
    **Ba chỗ bản Anh gộp nhiều khoá, tôi dịch từng khoá.** `2.1` bản Anh gộp
    *Ear / Nose / Tongue / Body consciousness* vào một câu, trong khi Pāli `2.1`
    chỉ nói **lưỡi** — tai, mũi, thân nằm sau `…pe…` của bài khác (chính là bài
    `sn35.92`). `2.1` đã ghim không có nội dung, nên chỗ này tôi dựa vào Pāli
    một mình. `9.1`–`9.4` bản Anh nối tiếp liền mạch, còn Pāli chia bốn khoá và
    có `…pe…` ở `9.1`, `…` trần ở `9.2`; tôi giữ ranh giới khoá.
