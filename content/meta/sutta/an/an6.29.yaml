  - >-
    **`4.3` và `10.1` — nén theo `…pe…`, và đây là ranh giới của luật §10.1.**
    Pāli lược mất công thức đầy đủ của thiền `vivicca akusalehi dhammehi
    savitakkaṁ savicāraṁ vivekajaṁ pītisukhaṁ …` và `dukkhassa ca pahānā …
    adukkhamasukhaṁ upekkhāsatipārisuddhiṁ …`. Theo BRIEF_VI3 §10.1, `…pe…` của
    Pāli **không bao giờ** được mở rộng: viết chữ vào chỗ Pāli lược là thêm chữ
    không nguồn nào chứng thực tại đúng chỗ đó, và đã có tiền lệ bản Anh mang ba
    ngọn lửa sang khoá không có rồi một lát lấp sao chép luôn. §10.2 (cho phép
    nén) không mở ra ở đây vì nội dung bị nén **không** được nêu đủ trong cùng
    bài: `10.1` chỉ có `catutthaṁ jhānaṁ`, khác hẳn công thức ở `4.3`. Vì vậy cả
    hai khoá giữ một `…` và ghi ở đây để người biên tập phán xử, thay vì tự ý
    nới luật.
