notes: |-
  **ĐỌC TOÀN BỘ PĀLI 49 KHOÁ TRƯỚC KHI VIẾT** (`vc/p79.txt`), in lại từng cặp Pāli↔Việt sau khi ghi.

  **TẦNG THAM KHẢO ĐẦY ĐỦ.** Bản Anh Sujato đã ghim **có mặt** và **đủ 49/49 khoá**
  (`sutta/an/an10/an10.30_translation-en-sujato.json`, có trong
  `source/upstream-manifest.json` — đếm được: không thiếu, không thừa). Đo coverage bằng đúng
  công thức `src/lib/canon/reference.ts` (`prose() >= 40`, loại block tham chiếu theo
  `/^0(\.|$)/`): **35** Pāli có nội dung, **35** trong đó mang chữ Anh ⇒ ratio **1,0000** trên
  ngưỡng 0,8. Tầng `vietnamese-current` vắng; lớp lấp `english-project` không có. Chỉ có một
  tầng tham khảo nên `triangulation` đặt **9,2** — cao hơn nhóm `tha-ap`/`vv` (7,5) vì có bản
  Anh 100%, nhưng không có bản Việt để đối chiếu thêm.

  **BÀI SONG SINH VỚI `an10.21`** (`Sīhanādasutta`, ngay bài trước, cùng phẩm `Mahāvagga`).
  Cả hai đều là **bài thứ mười** của một phẩm và cùng khuôn *"Puna caparaṁ … / Yampi …"*.
  **Bốn vế lấy lại theo bản đã có, đếm từng vế:**
  · `:9.1` danh sách mười mục `appicchakathā … vimuttiñāṇadassanakathā` nguyên văn `an9.1:7.1`
    (bản duy nhất trong tầng đã dịch đủ cả mười mục không bị `…pe…` cắt), chỉ đổi chủ tử thành
    *Đức Thế Tôn* ·
  · `:11.1` vế hồi tưởng nguyên văn `an10.21:10.1` (cùng danh sách 13 số đếm và ba thế kỷ) ·
  · `:12.1` vế thiên nhãn nguyên văn `an10.21:11.1` (cùng hai nhóm thấy chúng sinh và cùng
    đối chiếu nghiệp) ·
  · `:10.1` theo `sn21.4:3.3` cho cụm *bốn phép thiền thuộc tăng thượng tâm, là các trú xứ an
    lạc ngay trong hiện tại*.
  Ngoài ra `:8.1` lấy nguyên văn bốn danh hiệu + *ruộng công đức vô thượng của thế gian* từ
  `an10.16:1.1`; `:14.4` lấy *đi nhiễu bên hữu* từ `an11.7:6.1` cho `padakkhiṇaṁ katvā`;
  `:14.6` lấy *Đại Phẩm thứ ba.* từ `snp3.12:64.7` (1 tiền lệ, cùng Pāli); `:14.5` *Thứ mười.*
  (245/247); `:1.1` theo đa số **60/203**; `:1.4` (2/2); `:2.3` (2 tiền lệ) và `:2.4` (3) —
  hai vế lặp nguyên văn nên phải cùng cách.

  **CẤU TRÚC CỦA BÀI — đủ mười mốc lý do, mỗi mốc có hai vế.**
  Mỗi cặp khoá `N.1` / `N.2` là: vua nêu một đức tính của Đức Phật, rồi lặp lại đức tính ấy trong
  mệnh đề *"…nên con thấy rõ lý do đó mà bày tỏ lễ bái tối đa…"*. Pāli dùng **hai** vế khác nhau
  ở đó: `Yampi, bhante, bhagavā …, idampi kho ahaṁ, bhante, atthavasaṁ sampassamāno bhagavati
  evarūpaṁ paramanipaccakāraṁ karomi` — "vì lý do ấy … **nên con** thấy rõ lý do đó mà…". Tôi
  giữ đúng hai vế và dùng *"nên con"* ở vế sau, để không làm mất lớp lý do gián tiếp mà Pāli
  đã dùng. Chính vì vậy bản Việt ở các khoá `.2` dài hơn bản Anh — đó là do Pāli, không phải do
  diễn giải thêm.

  **DẤU LƯỢC — 4 khoá, mỗi khoá đúng một `…`, KHÔNG mở rộng:** `:9.2` `:11.2` `:12.1` `:12.2`
  `:13.2` (5 khoá). ⚠ **`:12.1` là chỗ bản nháp đầu của tôi SAI và `_hvi.py` đã bắt được**:
  Pāli kết `satte passati …pe… yathākammūpage satte pajānāti.` — bản nháp viết liền hai vế thấy
  chúng sinh không có dấu lược nào, chốt báo *"dấu lược 0 ≠ Pāli 1"*. Đã sửa thành *"… đang
  sinh lại … biết rõ chúng sinh ấy đúng y như nghiệp của chúng."*, giữ `…` làm dấu nối.

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `Sīhādhivutti` (`:15.1`) — **0 tiền lệ**. Đây là ẩn dụ "tiếng rống sư tử"; `an10.21` =
    `Sīhanādasutta` đã `published` với tên *Kinh Tiếng Rống Sư Tử*. Tôi dịch *Tuyên xưng của bậc
    Sư Tử*. `kāyena` ở đây chỉ `Kāyasutta` (`an10.23`) — tôi dịch *bài Thân Tạng*; nếu coordinator
    muốn khớp sát tên thì đổi thành *bài Thân*.
  · `Kaśīna` (`:15.2`) — `an10.25:0.3` `Kasiṇasutta` đã có tên *Kinh Môn Địa* (không phải tên
    sông Kaśīna), nhưng khuôn uddāna giữ tên riêng Pāli (đã dịch *Kinh Với Kāḷī* giữ `Kāḷī`,
    *Kinh Cunda* giữ `Cunda`), nên tôi giữ `Kaśīna`. Tôi **không** sửa `an10.25` — ngoài lát này.
  · `vuddhasīlo` / `ariyasīlo` / `kusalasīlo` (`:5.1`) — **0 tiền lệ cho cả ba** (`vuddhasīlo`
    không xuất hiện ở đâu trong Pāli đã ghim đã dịch). `vuddha` = *trưởng thành đã qua tuần
    phản sở* (người đã trải qua 7 ngày gia đình); tôi dịch *giới đã trưởng thành*.
  · `gilānapaccaya` (`:7.1`) — `gilāna` = nước rửa/để uống; `bhesajjaparikkhā` = thuốc men và
    thuốc trị bệnh. 0 tiền lệ cho cụm; tôi liệt kê đủ năm nhóm theo thứ tự Pāli.
  · `aggaḷaṁ ākoṭehi` (`:1.9`, `:2.1`) — **0 tiền lệ cho cụm**. `aggaḷa` = bản lề / khung cửa;
    bản Anh đã ghim dịch *"knock on the door-panel"*. Tôi dịch *gõ cửa bằng đốt ngón tay* và ghi
    ở đây rằng từ Pāli là *khung cửa*, không phải *đốt ngón tay*.
  · `vijjācaraṇasampanno` → *Minh Hạnh Túc*, `anuttaro` → *Vô Thượng Sĩ* — lấy nguyên văn
    `dn24:1.6.2` (danh hiệu đầy đủ, không bị `…pe…` lược).

  **LỆCH ĐA SỐ, ĐÃ KIỂM CHỨNG BẰNG SỐ ĐẾM.** `:14.3` `Yassadāni tvaṁ, mahārāja, kālaṁ
  maññasī` — đa số đo được (3/4) là *"Này Đại vương, hãy đi khi **nhà vua** thấy hợp lúc."*, nhưng
  khoá này **Đức Phật đang nói với chính vua** mà lại xưng vua ở ngôi thứ ba là sai. Tôi dùng
  *khi **ngài** thấy hợp lúc*. Ghi ra đây để người biên tập biết có ba tệp khác cần sửa cùng lúc.

  **NGOẶC KÉP — giữ y hệt Pāli từng khoá, tự đếm: cân.** `“`/`”` = **6/6**; nháy cong `‘`/`’`
  = **2/2** (`:11.1` và `:12.1`).

