notes: |-
  Cấu trúc bài: Đức Phật nêu tóm lược (1.1–1.3) rồi vào tịnh phòng; các tỳ-kheo bàn nhau (2–3), đến hỏi Tôn giả Ānanda (4–7); Ānanda khiển trách nhẹ rằng họ bỏ gốc tìm cành (8–9), rồi giảng mười cặp tà/chánh (11–15); các tỳ-kheo kể lại với Đức Phật (17–21) và được Ngài ấn khả (22). Mười phi pháp theo đúng thứ tự Pāli: tà kiến · tà tư duy · tà ngữ · tà nghiệp · tà mạng · tà tinh tấn · tà niệm · tà định · tà trí · tà giải thoát (khớp `an10.114` và `an10.116`). Bài không có số lượng nào cần tính.

  TẦNG THAM KHẢO — COVERAGE ANH DƯỚI NGƯỠNG, NÊN BÀI GIỮ `draft`. Tầng Anh Sujato đã ghim có tồn tại (`translation/en/sujato/sutta/an/an10/an10.115_translation-en-sujato.json`, 105 khoá khớp Pāli). Đo theo công thức `source/layers.yaml` (khoá Pāli có nội dung ≥ 40 ký tự, loại khối `:0`): mẫu số 60, Sujato có chữ ở **42/60 = 0,70**, dưới ngưỡng 0,80. Sujato để trống **18** khoá có nội dung: `2.3`, `2.5`, `5.1`, `6.1`, `6.2`, `6.5`, `7.2`–`7.5`, `18.1`, `19.1`, `19.2`, `19.5`, `20.2`–`20.5` — đó là các đoạn các tỳ-kheo kể lại và trích lại lời tóm lược (Sujato nối câu qua chỗ trống). Không có lớp lấp `english-project` cho uid này, và tầng `vietnamese-current` vắng (corpus Thích Minh Châu tại commit đã ghim chỉ có Pháp Cú). Vì vậy 18/60 khoá phải dựa vào Pāli một mình, và `triangulation` bị hạ xuống 7,0. Cách gỡ: dùng lớp `english-project` lấp 18 khoá này (tái dùng cách dịch đã có của các khoá song song `2.2`–`2.6`, `5.1`, `11.1`–`11.4` theo luật lấp của kho), chạy `npm run reference:gaps`, rồi chấm lại. Không nâng điểm để né blocker.

  TIỀN LỆ — ĐẾM ĐƯỢC. Quét Pāli trùng nguyên văn trên toàn tầng (ngoài chính bài): **49** khoá của bài có ít nhất một khoá trùng, bản Việt dùng lại y hệt một bản đã có ở **35/49**, cố ý lệch **14/49**. Nguồn gần nhất là `sn35.116` và `sn35.117` (cùng cấu trúc tóm lược, Ānanda phân tích rồi Đức Phật ấn khả), `mn18`, `mn133`, `mn138` (Mahākaccāna), `an10.28`, và `an10.114`/`an10.116`/`an10.173` (khuôn mười cặp phi pháp–pháp). Trong chính bài có **10** nhóm Pāli trùng nguyên văn (cả 10 nhóm bản Việt giống hệt, 0 nhóm lệch): lời tóm lược ở `1.2`/`2.4`/`11.3`, `2.3`/`11.2`, `2.5`/`11.4`, lời khen Ānanda ở `3.3`/`7.3`/`9.5`/`20.3`, `3.4`/`7.4`/`20.4`, `7.2`/`20.2`, `7.5`/`20.5`, và các đoạn cụt `5.3`/`18.3`, `6.4`/`19.4`, `6.5`/`19.5`.

  NHỮNG CHỖ CỐ TÌNH LỆCH BẢN ĐÃ CÓ (14 khoá). (1) Dấu lược `…` ở `14.2`, `14.4`, `14.6`, `14.8`, `14.10`, `14.12`, `14.14` (Pāli `… dhammo …` không có dấu chấm phẩy): `an10.116` và `an10.173` viết `…;` (14/14 khoá cùng dạng, chỉ từ hai bài này), nhưng Pāli không có `;` và toàn tầng với Pāli kết bằng ` …` thì bản Việt kết bằng `…` trần ở khoảng 3.900 khoá so với 16 khoá `…;`. Tôi theo Pāli và theo đa số. (2) `10.1`: Pāli `Tenahāvuso` — cả hai bản đã có (`sn35.116:7.1`, `sn35.117:7.1`) viết *này hiền giả* số ít cho nhiều người nghe; vì trong bài này Ānanda nói với cả nhóm tỳ-kheo và các khoá khác của chính bài dùng *này các hiền giả* (`8.1`, `8.3`, `11.1`, `12.1`, `13.1`…), tôi dùng *này các hiền giả* cho nhất quán trong bài. (3) `22.1`: `mn38:7.5` viết *Tốt lắm, tốt lắm*; tôi dùng *Lành thay, lành thay* (4 khoá so với 3 khoá *Tốt đẹp/Tốt lắm* trên tầng; trong `an` chỉ có dạng *Lành thay*). (4) `0.3`: tiêu đề `Tatiyaadhammasutta` → *Kinh Pháp (3)* theo loạt `an10.113`/`an10.114` (*Kinh Pháp (1)*, *(2)*, dạng số là đa số); `an10.173` ghi *(Ba)*. (5) `8.1`, `8.2`, `9.3`, `11.1`: bản đã có là `sn35.116:5.1`, `5.2`, `mn133:10.3`, `mn133:9.1`/`mn138:9.4`, khác nhau ở chữ nhỏ vì Pāli của bài này không giống hệt (vd `8.1` có chủ ngữ *này các hiền giả* đặt sau *Ví như*; `9.3` dùng *Đức Thế Tôn trả lời* thay cho *Đức Phật diễn giải* của mn133; `11.1` mở bằng *về bản tóm lược mà…* theo `mn138:9.4` và `sn35.117:8.1`). Đây là khác biệt trình bày, không đổi nghĩa.

  ĐỔI XƯNG HÔ ĐỨC PHẬT: trong bài dùng *Đức Thế Tôn* nhất quán (khớp `sn35.116`/`sn35.117` mà bài này tái dùng nhiều nhất, và các khoá trùng nguyên văn ở các tỳ-kheo với nhau). Với `1.4` (`Idamavoca bhagavā.`) toàn tầng có *Đức Phật đã nói như vậy* 108, *Đức Thế Tôn nói như vậy* 31, *Đức Thế Tôn đã nói như vậy* 30; trong riêng `an` thì *Đức Phật đã nói* chiếm đa số (11 so với 3 cho *Đức Thế Tôn đã nói*). Tôi chọn *Đức Thế Tôn đã nói như vậy* để cả bài một cách gọi; người biên tập có thể đổi sang *Đức Phật* toàn bài nếu muốn theo số đông của `an`. `18.1` (Pāli không có `bhante`) dùng *Thế Tôn* trực tiếp theo `sn35.116:10.1`, còn `19.1`/`19.5` giữ *Đức Thế Tôn* y như các khoá trùng nguyên văn (`sn35.116:10.4`, `sn35.117:10.8`).

  THUẬT NGỮ (đo trên toàn tầng khi cần): `adhamma`/`dhamma` → *phi pháp*/*pháp*, `anattha`/`attha` → *điều bất lợi*/*điều lợi* (khớp `an10.114`, `an10.116`, `an10.173`; `an10.113` dịch *điều phi lợi ích*/*điều có lợi ích* — cần thống nhất). `saṅkhittena uddesaṁ` → *bản tóm lược … thuyết vắn tắt*, `vitthārena atthaṁ avibhajitvā` → *không phân tích rộng nghĩa* (khớp `sn35.116`/`sn35.117`/`mn138`; `mn133` dịch *giải rộng nghĩa*, `mn18` dịch *giải thích chi tiết*). `vihāraṁ paviṭṭho` → *vào tịnh phòng*. `satthu … saṁvaṇṇito sambhāvito` → *được bậc Đạo Sư khen ngợi*, `viññūnaṁ sabrahmacārīnaṁ` → *các bạn đồng phạm hạnh bậc trí* (khớp sn35). `cakkhubhūto ñāṇabhūto dhammabhūto brahmabhūto` → *là bậc mắt, là bậc trí, là bậc pháp, là bậc Phạm thiên* (khớp sn35.116:6.2 và mn133). `Tenahāvuso, suṇātha` → *Vậy thì … hãy lắng nghe và khéo tác ý*. Khi Buddha nói với tỳ-kheo (`22.4`, `22.5`), *các ông* (an: 18 khoá so với 2 khoá *các thầy*).

  DẤU LƯỢC VÀ CÁC KHOÁ CỤT. Pāli có `…pe…` ở `5.2`, `6.3`, `16.2`, `18.2`, `19.3`: mỗi khoá Việt giữ đúng **một** `…` và chỉ dịch phần Pāli hiển thị (`5.2`/`6.3`/`19.3` chỉ có `adhammo ca` → *Phi pháp và …*; `18.2` có `adhammo ca, bhikkhave, veditabbo` → *Này các tỳ-kheo, cần phải thấy biết phi pháp và …*; `16.2` có đến `dhammo ca` → *… phi pháp và pháp …*), theo tiền lệ toàn tầng cho khoá Pāli cụt kiểu này (`sn22.97:6.9`, `mn7:9.1`, `sn18.4:1.5`…). Các khoá cụt `5.3`, `6.4`, `16.3`, `18.3`, `19.4` (Pāli `tathā paṭipajjitabban…`) dịch *cần phải thực hành theo đó*, vì `tathā` chỉ là mệnh đề kết của câu `yathā dhammo yathā attho tathā paṭipajjitabbaṁ`. `14.16` Pāli kết `….` nên Việt kết ` ….` (đa số của tầng). Dấu nháy: nháy đơn `‘’` và ngoặc kép `“”` khớp Pāli từng khoá (105/105). Pāli ở `6.2` kết bằng gạch dài `—` và `6.4`/`19.4` thiếu `’` đóng (chỉ `6.5`/`19.5` mới có `’ti`) — tôi giữ đúng từng khoá như Pāli. Cũng lưu ý Pāli `6.2` ghi `bhagavatā … paviṭṭho` (cách công cụ) trong khi chủ ngữ đúng phải là `bhagavā` như `2.2`, `16.1`, `19.2`; bản Việt dịch theo nghĩa (chủ ngữ Đức Thế Tôn) giống `sn35.116:4.5`.

  ĐIỂM BẤT ĐỊNH. (a) `8.2` `evaṁsampadamidaṁ āyasmantānaṁ` dịch *các Tôn giả cũng vậy* theo `sn35.116:5.2`/`mn133:9.2`; `taṁ bhagavantaṁ atisitvā` = *bỏ qua Đức Thế Tôn ấy*. (b) `8.4`/`9.2` có `ahosi` (quá khứ) nhưng bản Việt viết *là lúc* theo tiền lệ (`sn35.116:5.5`, `mn133:9.4`); nghĩa là *lúc ấy, khi Bậc Đạo Sư đang hiện diện, đã là lúc …*. (c) `9.3` `yathā no bhagavā byākareyya tathā naṁ dhāreyyāma` nối liền câu bằng dấu phẩy sau `9.2`, nên Việt mở bằng *và nên ghi nhớ …* (khớp `mn133:10.3`). (d) `21.2` `attho suvibhatto` dịch *được … phân tích rõ*; `ākārehi padehi byañjanehi` → *phương cách / từ ngữ / văn cú* (khớp `sn35.117:10.14`).

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở 9.6: tôi chỉ xác minh được JSON hợp lệ, `set(khoá Việt) == set(khoá Pāli)` (105 == 105, 0 thiếu, 0 thừa, thứ tự khoá đúng thứ tự Pāli), 0 khoá rỗng, mọi giá trị NFC, không khoảng trắng thừa, dấu lược khớp Pāli từng khoá, nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch trên 105), không Pāli lọt sang bản Việt, và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
