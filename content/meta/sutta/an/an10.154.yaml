notes:
  - >-
    `sacchikātabba` → "trực chứng" (thiền: "chứng và an trú"). Bài khép chương,
    kèm `Ariyavaggo pañcamo` → "Phẩm Bậc Thánh, thứ năm." và `Tatiyo paṇṇāsako
    samatto` → "Phần năm mươi kinh thứ ba hoàn tất." theo 13 lần dùng trong
    corpus.
  - >-
    Thuộc cụm *AN 10 chương 15, Phẩm Bậc Thánh*. Đây là chương **đồng nhất
    nhất** của AN 10: cả mười bài dùng *đúng một khuôn Pāli*, chỉ thay danh từ
    X. Bốn bài đầu có cặp đối nghịch (thiện/phi thiện), sáu bài sau dạng "đáng X
    / không đáng X". Segment `Taṁ suṇātha …pe…`, `Micchādiṭṭhi …pe…
    micchāvimutti—` và `Sammādiṭṭhi …pe… sammāvimutti—` có Pāli **giống hệt
    nhau** ở cả mười bài, nên dùng lại một cách dịch — đó là trung thực với
    Pāli, không phải lặp máy móc.
  - >-
    Cả khuôn này đã có tiền lệ ở `mn113`, bài dài song song, nên dùng lại nguyên
    văn: `Katamo ca, bhikkhave, …?` → "Và thế nào, này các tỳ-kheo, …?" · `ayaṁ
    vuccati, bhikkhave, …` → "Điều này được gọi là, này các tỳ-kheo, …" ·
    `sappurisadhammañca vo … desessāmi` → "Ta sẽ giảng cho các ông …" · `Taṁ
    suṇātha, sādhukaṁ manasi karotha` → "Hãy lắng nghe và chú tâm kỹ".
  - >-
    Dấu `…pe…` của Pāli được **giữ nguyên** ở cả ba chỗ, vì đó là lược của bản
    gốc chứ không phải lược của người dịch. `Katamo ca, bhikkhave, …?` mở đầu
    bằng chữ thường trong Pāli và được giữ nguyên như vậy.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
