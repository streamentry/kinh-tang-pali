  **Coverage tầng Anh đo được: Sujato phủ 61/62 khoá Pāli có nội dung = 0,9839 (ngưỡng 0,80 đạt).** Mẫu số là 62 khoá Pāli dài từ 40 ký tự trở lên, bỏ khối `:0` (ngưỡng `source/layers.yaml`: `substantivePaliMinChars: 40`, `excludeReferenceBlock: true`, `floor: 0.8`); 15 khoá còn lại (ba khoá tiêu đề `:0.*`, các câu hỏi `Katamāni tīṇi?` / `Katame tayo?`, `Catutthaṁ.` và những khoá ngắn hơn 40 ký tự) nằm ngoài mẫu số. Khoá duy nhất Sujato để trống trong mẫu số là `3.3` (câu `‘sutaṁ metaṁ, bho gotama, aggissa ādānaṁ …’ti`, do bản Anh gộp vào `3.2`/`3.4`); lớp `english-project` có đúng một khoá, `3.3`, nên cổng tính cả hai lớp được 62/62 = 1,0000, nhưng **phần lấp đó không phải cách đọc English độc lập** (cùng một nhóm biên tập với bản Việt này) và tôi không dựa vào nó để chấm `triangulation`. Đường tệp `sutta/an/an7/an7.47_translation-en-sujato.json` có trong `source/upstream-manifest.json`. Tầng `vietnamese-current` tại commit đã ghim chỉ có Pháp Cú ⇒ không có bản Hòa thượng Thích Minh Châu ở lớp store; tôi có đọc bản nguyên bài (*Lửa (2)*) ở mục tra cứu toàn văn của SuttaCentral để đối chiếu thuật ngữ, nó không cấp chữ cho cột nào. `triangulation` 8,8 vì Sujato độc lập phủ 61/62 nhưng bản Việt hiện hành không ở lớp store, và Sujato lệch Pāli ở một khoá quan trọng (`15.2`, xem dưới).

  **Số Pāli: `pañca usabhasatāni` … `pañca urabbhasatāni` = 5 × `sata` (100) = 500 mỗi loại (`1.2` và `17.4`); `tīṇi satthāni` = ba con dao; `tayo aggī` = ba loại lửa; `Catutthaṁ` = thứ tư.** Năm loại gia súc ở `1.2` và `17.4` là năm nhóm 500 con, mỗi nhóm một loại (bò đực, bò đực non, bò cái non, dê, cừu); tôi đếm đủ năm ở cả hai khoá. Không có số lớn (`sahassa`, `navuti`, `tālīsa`, `kappa`). Pāli của bài không chứa từ khoá nào trong chín từ khoá số đã xác lập (`navuti`, `tālīsa`, `sattati`, `sahassa`…) ⇒ phép đo số theo bảng đó sẽ có **mẫu số bằng 0** và không đo được gì; các số trên là tôi tự tính bằng cách đếm trực tiếp từ Pāli.

  **Pāli trùng nguyên văn trong chính bài: 9 cặp đã dò (5 nhóm trùng: `2.1`=`2.5`, `2.2`=`2.6`, `5.5`=`6.2`, `5.6`=`6.3`=`7.2`, `8.2`=`12.2`, và `9.3`=`10.3`=`11.3`), 0 cặp bản Việt khác.** Ba khoá `9.2` / `10.2` / `11.2` chỉ khác danh từ `rāga` / `dosa` / `moha` và dùng cùng khuôn. **Tiền lệ ngoài bài: 34 cặp Pāli trùng nguyên văn với một khoá đã dịch ở nơi khác, trong đó bản Việt khác ở 34/34 cặp** (đây là số cặp, không phải số lỗi): (a) `9.2` ↔ `an3.54:3.1`: 1 cặp, chỉ khác tôi giữ hô ngữ *Này bà-la-môn* mà `an3.54:3.1` bỏ mất, còn lại dùng lại nguyên văn *Kẻ bị tham cầu ái nhiễm, bị tham chế phục, tâm bị tham thâu nhiếp, hành ác hạnh bằng thân, … khẩu, … ý*; (b) `9.3` / `10.3` / `11.3` ↔ 7 khoá mỗi khoá (21 cặp): `an3.36:1.4`, `an3.39:6.5`, `an3.39:6.8` giữ *hành ác hạnh bằng thân / khẩu / ý* như tôi nhưng kết bằng *thọ sinh vào cõi ác, ác thú, cõi đọa, địa ngục*; `an6.57:11.5`, `an6.57:14.5` kết giống tôi (*người ấy sinh vào cõi dữ, ác thú, đọa xứ, địa ngục*) nhưng dịch *làm ác hạnh … bằng lời*; `an4.85:2.5`, `an4.85:4.5` dùng *thực hành hành động ác … tái sanh*. Tôi chọn cho 9.3 phần đầu giống `an3.36` / `an3.39` (đúng khuôn của `9.2` ngay trước nó trong cùng bài) và phần cuối giống `an6.57` (đa số), nên không trùng byte với khoá nào; (c) `17.2` ↔ 12 khoá `…pe…` ở các bài khác: bản Việt dùng dạng phổ biến *Thật vi diệu thay, thưa Tôn giả Gotama!* mà không khớp byte với bất kỳ khoá nào vì các bài chia nhau ở chữ *thưa* và dấu `!`.

  **Thuật ngữ, kèm số đếm (toàn tầng đã dịch).**
