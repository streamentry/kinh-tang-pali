  - Gia súc: `usabha` *bò đực* · `vacchatara` *bò đực non* · `vacchatari` *bò cái non* · `aja` *dê* · `urabbha` *cừu* theo `dn5:1.6` (cùng năm loại; `sn3.9:1.2` dịch *bò con / bê cái*, `mn94:12.7` *bò non đực / bò non cái*).

  **Hai điểm bất định cần người biên tập phán (đã ghi ở đây, không thêm vào thân kinh).**
  1. **`15.2` `parappavādā paṭiviratā`.** Ở ba khoá khác của tầng, cùng công thức `ye te samaṇabrāhmaṇā … paṭiviratā khantisoracce niviṭṭhā ekamattānaṁ damenti …` mở bằng `madappamādā paṭiviratā` (*từ bỏ kiêu mạn và phóng dật*: `an4.61:16.1`, `an5.41:5.1`, `dn26:5.5`). Pāli đã ghim của bài này viết **`parappavādā`** (*luận thuyết của người khác*), không phải `madappamādā`; Sujato *refrain from intoxication and negligence* và Hòa thượng Thích Minh Châu *từ bỏ kiêu mạn, phóng dật* cùng theo công thức `madappamādā`, tức khác Pāli đã ghim. Theo quy tắc *Pāli là authority*, tôi dịch đúng chữ của Pāli ghim: *tránh xa các luận thuyết của người khác*. Nghĩa này không mâu thuẫn ngữ cảnh (các sa-môn bà-la-môn này tự điều phục, tự lắng dịu), nhưng nó là một **dị bản chữ** so với công thức quen; nếu người biên tập xác định dị bản là lỗi chép thì phải đổi thành *từ bỏ kiêu mạn và phóng dật* theo ba tiền lệ trên. Tôi không tự quyết.
  2. **`13.4` `ayaṁ āhuto sambhūto`.** `āhuta` ở đây có thể là *được mang đến* (từ `āharati`), Sujato *incubated*, Hòa thượng Thích Minh Châu *khiến cho mang lại*. Tôi dịch sát chữ *được mang đến, được sinh ra*; Pāli không nói thêm.

  **`13.2` và `14.2`: `yassa te honti …`.** `te` ở đây là đại từ *họ* (thuộc về `yassa` *của người nào*), không phải *của ông* như Sujato *Your mother and father*; bản Việt nói *của một người* theo đúng Pāli, không gán cho người đối thoại. Công thức `puttāti vā dārāti vā dāsāti vā pessāti vā kammakarāti vā` có tiền lệ nguyên văn ở `an5.148:3.2` và `an9.20:2.7` (*con cái, vợ, nô lệ, người hầu hay người làm*), tôi dùng lại cách dịch đó.

  **Dấu lược: Pāli có `…pe…` ở 2 khoá (`2.3`, `17.2`) ↔ Việt đúng một `…` ở cả 2/2.** Pāli 0 `…` trần, 0 `(…)` ↔ Việt 0. Việt không có `…` ở khoá nào mà Pāli không có. **Nháy: Pāli mở `“` ở `5.1` và đóng ở `16.1`; mở `“` ở `17.2` và đóng ở `17.5`; mở `‘` ở `5.5` rồi đóng trong cùng khoá, và `3.2` mở `“` đóng ở `3.7` (`’”`).** Bản Việt phản chiếu đúng Pāli từng khoá: 0 lệch / 77 trên bốn loại dấu `“ ” ‘ ’`.

  **Tầng Anh đã ghim ở bài này: hai ghi nhận.** (i) `15.2`, như trên. (ii) `3.3` bản Anh trống và gộp vào khoá lân cận, nên mẫu số tầng Anh độc lập ở khoá đó bằng 0.

