  - `kāyassa bhedā paraṁ maraṇā apāyaṁ duggatiṁ vinipātaṁ nirayaṁ upapajjati` → *khi thân hoại mạng chung, người ấy sinh vào cõi dữ, ác thú, đọa xứ, địa ngục* (9 khoá Tăng Chi Bộ cùng dạng; dạng *thọ sinh vào cõi ác, ác thú, cõi đọa, địa ngục* 7 khoá).
  - `puñña` → *công đức* 35 · *phước* 26 (Tăng Chi + Tương Ưng); chọn *công đức* và `apuñña` → *phi công đức* để phân biệt với `kusala` / `akusala` → *thiện / bất thiện* trong cùng câu `5.6`. `sugati` → *thiện thú* 71 · *cõi lành* 23 · *cõi thiện* 15; `duggati` → *ác thú* 80 · *cõi dữ* 46; chọn *thiện thú / ác thú* vì cặp đối xứng.
  - `dukkhudraya dukkhavipāka` → *dẫn đến khổ, cho quả khổ*: 19 khoá *dẫn đến khổ* (`mn61` 18 khoá, `an2.230-279` 1 khoá), 18 khoá *có khổ làm nền tảng* (chỉ hai bài `an10.217`, `an10.218`), 4 khoá *đưa vào khổ* (`an10.143`, `an10.187`). **Hai cách cùng có tiền lệ, mỗi cách nằm ở rất ít bài**; tôi chọn cách đọc tự nhiên hơn vì `udraya` là *kết quả* nên *dẫn đến khổ* không thêm nghĩa.
  - `sattha` → *dao*: 0 tiền lệ cho các hợp từ `kāyasattha` / `vacīsattha` / `manosattha`; từ đơn `satthaṁ` đếm theo **bài**: *dao* 9 bài (`mn101`, `mn105`, `mn124`, `mn135`, `mn144`, `mn145`, `mn23`, `dn23`, `sn35.88`) · *vũ khí* 5 bài · *gươm* 4 bài (`mn23`, `mn76`, `an8.1`, `dn2`) · *đao* 1 · *kiếm* 1 · *vật sắc* 1. Sujato *knives*, Hòa thượng Thích Minh Châu *kiếm*. Chọn *dao* vì đó là cách đa số bài và vì Pāli `sattha` là dụng cụ cắt gắn với việc giết súc vật ở đây; **bất định về vật cụ thể** ghi ở đây.
  - `pahātabbā parivajjetabbā na sevitabbā` → *cần phải đoạn tận, cần phải tránh xa, không nên thân cận*: `pahātabba` *cần phải đoạn tận* (302 khoá toàn tầng, ví dụ `an6.58:2.2`), `na sevitabbo` *không nên gần gũi* (`an10.199-210`), tôi dùng *thân cận* cho gần nghĩa Phật học hơn. `Taṁ kissa hetu?` → *Vì sao vậy?* (319 khoá; *Vì sao?* 68 · *Vì lý do gì?* 39 · *Do đâu vậy?* 15).
  - `sakkatvā garuṁ katvā mānetvā pūjetvā` → *kính trọng, tôn trọng, cung kính, cúng dường* (theo `mn108:24.6`, 1 khoá). `sammā sukhaṁ parihātabbā` → *được chăm sóc đúng đắn và an lạc*: 0 tiền lệ cho dạng thụ động `parihātabba`; dạng chủ động `sammā sukhaṁ pariharati` ở `an4.61:13.*` là *giữ gìn đúng đắn sự an lạc* (9 khoá), nhưng ở đó tân ngữ là người, ở đây là ngọn lửa. **Bất định về tân ngữ**, tôi dùng *chăm sóc* chung.
  - Ba ngọn lửa phụng sự: `āhuneyyaggi` → *lửa đáng cúng dường* (theo `an7.46:1.3`; `dn33` dùng *lửa của bậc đáng được cúng dường*); `gahapataggi` → *lửa gia chủ* (theo `dn33:1.10.74`; **khác `an7.46:1.3` vốn dịch *lửa đáng tôn kính*, không có căn cứ ở Pāli — `gahapati` là người tại gia, và chính bài này định nghĩa nó là con cái, vợ, người ở và người làm**); `dakkhiṇeyyaggi` → *lửa đáng được bố thí* (theo `an4.34:4.1` *xứng đáng được bố thí* và `an3.98:1.5`; **khác `an7.46:1.3` dịch *lửa đáng tế lễ***, vì *tế lễ* làm sai chủ đề của chính bài, nơi lễ tế giết súc vật bị phê phán). Hai bài `an7.46` và `an7.47` vì vậy đang dịch **khác nhau** hai trong bảy loại lửa; ghi để người điều phối phán.
