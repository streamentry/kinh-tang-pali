notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.2 (kèm 2.8 cùng cụm) — «tự mình thắng tri ngay
  trong hiện tại, hoặc nếu còn tàn ước thì chứng quả Bất lai» → «chánh trí ngay trong hiện tại,
  hoặc nếu còn dư y thì chứng quả Bất lai», vì aññā ở dn22, mn10 dịch «chánh trí» và upādisese
  dịch «dư y»; «tàn ước» không có căn cứ trong Pāli.

  Quyết định hội đồng biên tập 2026-10-16: B3 — an5.67:0.3, 2.2, 2.3, 2.4, 2.5 (iddhipāda = “như ý túc”).
