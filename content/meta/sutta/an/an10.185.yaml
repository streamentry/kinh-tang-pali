notes:
  - >-
    Mười bài `an10.179–188` dùng **cùng khuôn** và **cùng bộ từ khoá** với
    chương 14 (`an10.135–144`, đã dịch), nên toàn bộ cách dùng đã dùng lại
    nguyên văn, không dịch lại: mười danh từ X, các thứ tự, `katamo
    ca/katamañca`, `ayaṁ/idaṁ vuccati`, và cách chia tiền tố "điều". **Khác
    chương 14 ở giữa khuôn**: thay vì `Micchādiṭṭhi …pe… micchāvimutti—` gộp một
    segment, ở đây tách thành hai: `Pāṇātipāto …pe…` → "sát sinh …" và
    `micchādiṭṭhi—` → "tà kiến—"; chiều chính tương ứng.
  - >-
    **Bốn cụm từ ở chương này chưa có tiền lệ nào trong corpus (0 segment)**, và
    đã ghi quyết định ở chương 14 (vừa dịch, PR #106): `ariyo/anariyo dhammo` →
    *pháp bậc Thánh / pháp phi thiện*; `attho/anattho` → *có lợi ích / vô lợi
    ích*; `tapanīyo/atapanīyo` → *đáng bị thiêu đốt / không đáng bị thiêu đốt*;
    `ācayagāmī/apacayagāmī` → *pháp đưa đi lên / pháp đưa đi xuống*;
    `dukkhudrayo/sukhudrayo` → *pháp đưa vào khổ / vào an*. Dùng lại nguyên văn
    cả chương để hai chương đọc như một.
  - >-
    **`tapanīyo` / `atapanīyo` chưa có tiền lệ (0 segment).** `tapp` = *thiêu
    đốt, nung*; dịch "đáng bị thiêu đốt / không đáng bị thiêu đốt". Hình ẩu của
    bài là củi cháy so với vàng không cháy, nên giữ hình ảnh thiêu đốt thay vì
    nghĩa trừu tượng. Vì không có số đếm được, ghi kèm lý do.
  - >-
    Đây là bài duy nhất của sáu bài có `dhammaṁ` mà danh từ đứng đầu là tính từ
    trần, nên cần tiền tố "điều" ở `1.1`, `1.3`, `1.6`, `2.1`, `2.4`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
