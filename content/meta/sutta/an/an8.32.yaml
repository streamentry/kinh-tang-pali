notes: |-
  **Phạm vi lát c7: đủ mọi khoá trong `all` của bài, không thêm khoá nào.**
  Chạy lại `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tự kiểm những
  cờ mà `rven88.py` không áp cho tầng Việt: đủ khoá và đúng segment ID theo `pre`
  (tiền tố khoá thật, không phải uid-gộp); ngoặc kép cân trên cả bài; mọi chuỗi
  đã NFC; không Pāli lọt; số dấu lược bằng Pāli.

  **Không đối chiếu được tầng Việt hiện hành.** Tại commit đã ghim,
  `translation/vi/` của bilara chỉ chứa Pháp Cú, nên các bài này không có bản Hòa
  thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu
  sót của kho; `triangulation` vì thế chỉ ở mức Pāli + English Sujato.

  Tôi **không** chạy `npm run validate|test|check|build` (đợt này cấm; người điều
  phối chạy tập trung sau khi gộp các pre), nên `technical_integrity` chấm 9.6
  chứ không phải 10.0.

  **Khung khối `:0` theo anh em `an8.31` (đã `published`).** `0.1`
  giữ *Aṅguttara Nikāya 8.32* như `an8.31:0.1`; `0.2` dùng lại *4. Phẩm Cho
  Dâng*; `0.3` *Dutiyadāna* → *Kinh Cho Dâng (Hai)* theo mẫu *Kinh Tám Cách Cho
  Dâng (Một)* của `an8.31:0.3`; `1.5` *dutiyaṃ* → *Thứ hai.* (đối với *Thứ
  nhất.* ở `an8.31:1.12`).

  **Thuật ngữ kệ, đếm được.** `saddhā` → *lòng tin*; `hiri` → *biết hổ thẹn*
  (144 chỗ); `sappurisa` → *bậc thiện nhân*; `devaloka` → *cõi trời* (550 chỗ,
  so với *thiên giới* 48). `vadanti` → *được gọi là*, không đặt thêm chủ thể
  (*như lời dạy* ở bản nháp đầu đã bỏ vì thêm chữ *dạy* không có trong Pāli).

  **Bất định đã ghi: `diviya magga` 0 tiền lệ.** Cụm *con đường về cõi trời*
  chưa từng xuất hiện trong tầng; *con đường của chư thiên* cũng 0 chỗ. Tôi
  chọn *về cõi trời* để cặp với *đi đến cõi trời* ở câu kệ sau (`devaloka`), và
  vì *cõi trời* là chữ áp đảo của tầng. Đây là lý do `terminology` và
  `ambiguity_integrity* chỉ 9.0.
