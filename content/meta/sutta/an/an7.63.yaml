notes: |-
  Dịch từ Pāli root của snapshot SuttaCentral/Bilara đã ghim, đối chiếu với bản dịch tiếng Anh của Bhikkhu Sujato và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (tra cứu toàn văn, không phân đoạn). Tầng Việt hiện hành phân đoạn không có cho bài này.
  Đầy đủ 69 khoá, khoá và thứ tự khoá khớp Pāli. Coverage tiếng Anh Sujato: 17/17 khoá Pāli có nội dung (từ 40 ký tự, bỏ khối đầu đề) đều có bản Sujato, đạt 100%; không có lớp english-project cho bài này, nên không có chỗ nào dựa vào bản lấp của dự án. Khoá an7.63:14.4 (colophon Dasamaṁ) để trống ở bản Sujato, nằm dưới ngưỡng nội dung.
  Dấu câu: nháy kép và nháy đơn khớp Pāli từng khoá. Phần kệ mở nháy kép ở 5.1 và không đóng ở 13.4 (đúng như Pāli, nháy đóng nằm ở 14.2); 4.4 trùng nguyên văn với 14.1 và 4.5 trùng nguyên văn với 14.2, bản Việt giống nhau; điệp khúc "Yā evarūpā purisassa bhariyā" (5.4, 6.4, 7.4, 8.4, 9.4, 10.4, 11.4; bảy lần) dịch giống nhau. Không có dấu lược trong Pāli nên bản Việt không có dấu lược. Khoá 13.2 trùng Pāli với 11.5 trừ dấu cuối (chấm phẩy so với chấm), bản Việt giống nhau trừ dấu cuối.
  Số: bảy hạng vợ (vadhakasamā, corīsamā, ayyasamā, mātāsamā, bhaginīsamā, sakhīsamā, dāsīsamā) đếm đủ bảy; không có số lượng nào khác trong bài.
  Thuật ngữ và bất định:
  (1) Nhãn bảy hạng vợ: vadhaka "kẻ sát nhân", corī "kẻ trộm", ayyā "bà chủ" (Sujato: lord; Thích Minh Châu: chủ nhân), mātā "mẹ", bhaginī "chị em gái", sakhī "bạn", dāsī "nữ tỳ" (Thích Minh Châu: nữ tỳ; Sujato: bondservant). Dạng nhãn trong kệ "X ca bhariyā" dịch "vừa là X, vừa là vợ" để giữ cả hai thành phần của Pāli.
  (2) bhaginī: Pāli chỉ nói "chị em gái"; ví dụ so sánh ở 9.1–9.2 (jeṭṭhā bhaginī kaniṭṭhakā) cho thấy người em gái kính người chị. Thích Minh Châu dịch nhãn là "chị", Sujato là "sister". Bản này giữ "chị em gái" và dịch phép so sánh sát Pāli, không quy định ai là chị ai là em cho chính nhãn.
  (3) ahitānukampinī (5.1) và hitānukampinī (8.1): Pāli không nêu đối tượng; Sujato "no kindness"/"caring and kind"; Thích Minh Châu "không từ mẫn thương người"/"từ mẫn, có lòng thương xót người". Bản này dịch "chẳng từ mẫn nghĩ đến lợi ích" và "từ mẫn nghĩ đến lợi ích", không thêm đối tượng. Cách đọc khác của ahita- (thương xót điều bất lợi) có thể có nhưng không được chọn vì hai lần dùng đối lập nhau trong bài.
  (4) 7.3 uṭṭhāyakānaṁ abhibhuyya vattati: số nhiều sở hữu cách "những người siêng năng"; Sujato hiểu là người chồng ("He works hard, but she lives as his master"), Thích Minh Châu "đàn áp và chỉ huy mọi cố gắng của chồng". Bản này dịch sát Pāli là "những người siêng năng", không quyết định chủ thể cụ thể.
  (5) 6.1 Yaṁ itthiyā vindati sāmiko dhanaṁ: "itthiyā" có thể là sở hữu cách ("của người nữ ấy") hoặc dữ cách; hai cách đều cho nghĩa gần nhau; bản này chọn "người chồng của người nữ ấy".
  (6) 11.1 vadhadaṇḍatajjitā: dịch "bị đe dọa bằng đánh đập và gậy gộc", gồm cả hai thành tố vadha và daṇḍa; Sujato gộp thành "violence by the rod".
  (7) 2.3 sakkaroti garuṁ karoti māneti pūjeti dịch "tôn vinh, tôn trọng, kính nể, cúng kính" theo tiền lệ an5.58 (6 khoá), mn35:26.3 dùng bốn từ khác nhưng cùng nghĩa.
  (8) Hạng "mẹ/chị em gái/bạn/nữ tỳ" được đi cõi lành (13.4), nhóm sát nhân/trộm/bà chủ đi địa ngục (12.4): dịch "thân hoại" cho kāyassa bhedā vì Pāli ở đây không có paraṁ maraṇā.
  (9) Tên phẩm dùng "6. Phẩm Những Điểm Không Tuyên Bố" theo an7.54–an7.62 đã có. Tên kinh "Kinh Các Hạng Vợ" (Sujato: Kinds of Wives; Thích Minh Châu: Các Người Vợ).
