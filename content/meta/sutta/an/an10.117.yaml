notes: |-
  Dịch từ Pāli root tại commit đã ghim. COVERAGE ĐO LẠI bằng chính hàm của kho (`englishCoverageFor`, ngưỡng 0.8 trong `source/layers.yaml`): `english-sujato` phủ 14/14 khoá Pāli có nội dung = 1.000, không có tệp lấp `english-project` cần tính thêm. Tầng `vietnamese-current` không có — tại commit đã ghim bilara chỉ phân phối Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  ĐỢT NÀY LÀ LƯỢT REVIEW ĐỐI KHÁNG THỨ HAI, trên bản dịch đã có trên đĩa. KHÔNG sửa khoá nào — đọc lại từng cặp Pāli↔Việt và không tìm ra lỗi nào cần sửa. Giữ nguyên 40/40 khoá.

  ĐO LẠI TIỀN LỆ (không tin số của người khác):
    · 0.1 bài an: quét 1.248 khoá `:0.1` trong tầng `an` -> `Kinh Tăng Chi Bộ` 895 (72%), `Aṅguttara Nikāya` 353, không có dạng thứ ba. Chọn `Kinh Tăng Chi Bộ 10.117` theo đa số cả bộ. Ghi rõ số cả hai nhánh vì chúng kéo nhau trong tầng.
    · Tên phẩm: `12. Paccorohaṇivagga` -> `12. Phẩm bước xuống` (6 tệp trong an10). Suy ra từ `orohana` = đi xuống và khớp với Sujato *The Ceremony of Descent*.
    · Tiêu đề: `Saṅgāravasutta` -> `Kinh Saṅgārava` (`sn7.21:0.3`, `an3.60:0.3`).
    · `orimaṁ tīraṁ` / `pārimaṁ tīraṁ` -> `bờ bên này` / `bờ bên kia`: tiền lệ đo được ở dn13:24.3, dn13:24.6, dn13:26.5, mn22:13.6, mn22:13.9, mn34:2.1, mn34:3.3, mn34:4.1, mn34:5.11 và an10.118 — không có cách nào khác.
    · Dấu lược: bài này Pāli không có `…pe…` nào, bản Việt cũng không có dấu `…` nào. Cả 40 khoá khớp.
    · Ngoặc kép cân trên cả bài (đếm cả `“` và `”` toàn bài, kể cả ngoặc lồng nhau), 0 lỗi. NFC toàn bộ 0 lỗi. Không có khoá rỗng, không có `(…)` khoá chưa dịch, không có khoá tràn. Số khoá 40 = 40.
    · Dùng lại NGUYÊN VĂN, đối chiếu byte-for-byte: `1.1` <- `an3.60:1.1` · `1.2` <- `an3.60:1.2` · toàn bộ 22 câu kệ `2.1-6.6` <- `an10.118:3.1-7.6` (Pāli trùng tuyệt đối). Kệ `Appakā te manussesu …` còn có ở `sn45.34` và `sn46.17` với hai cách dịch khác; chọn `an10.118` vì cùng quyển 10 và cùng phẩm với bài này.

  Dãy tám chánh đạo, tiền lệ có số đếm: `micchādiṭṭhi`/`sammādiṭṭhi` -> `tà kiến`/`chánh kiến` · `micchāsaṅkappo` -> `tà tư duy` (55 chỗ `tà tư duy` so với 179 `chánh tư duy`) · `micchāvācā` -> `tà ngữ` · `micchākammanto` -> `tà nghiệp` · `micchāājīvo` -> `tà mạng` · `micchāvāyāmo` -> `tà tinh tấn` · `micchāsati` -> `tà niệm` · `micchāsamādhi` -> `tà định` · `micchāñāṇaṁ` -> `tà tri` · `micchāvimutti` -> `tà giải thoát`. Tiền lệ gần nhất cho cả dãy: `sn38.10:1.10` và `an10.118:2.2-2.3`. · `bho gotama` -> `Thưa Tôn giả Gotama` (206 chỗ đã có trong tầng) · `sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā` -> `cùng nhau thăm hỏi những lời chào hỏi thân tình đáng nhớ` · `kaṇhaṁ/sukkaṁ dhammaṁ` -> `pháp đen / pháp trắng` · `paṇḍito` -> `bậc trí` · `anupādāya` -> `không chấp thủ` · `khīṇāsavā jutimanto` -> `Đã đoạn tận các lậu, sáng chói` · `parinibbutā` -> `tịch diệt`.

  Bất định đã phân xử và ghi lại:
    (1) `1.4` và `1.14` có `kho, brāhmaṇa`, còn `1.5-1.13` không có; giữ đúng sự có mặt–vắng mặt của `này Bà-la-môn` theo bản PāLI.
    (2) `1.14` PāLI là `…tīranti` (số nhiều, nói chung về cả hai bờ) nên dịch `Đây là bờ bên này, … đây là bờ bên kia`.
    (3) `6.6` kết bằng `”ti.` — tầng đang phân hai cách: đo toàn tầng `sn`+`an` có 1.206 khoá kết bằng `”ti.` và 1.222 khoá kết bằng `”.`, tức `”.` hơi đông hơn. Giữ `”ti.` ở khoá này vì nó là NGUYÊN VĂN dùng lại từ `an10.118:7.6` (Pāli trùng tuyệt đối), sửa thành `”.` sẽ phá vỡ khớp byte với bài nguồn. Ghi ra đây thay vì âm thầm giữ.
    (4) Bài `Paṭhamaisidattasutta`-kiểu dùng `Dutiyaṁ.` cho bài thứ nhất không xảy ra ở đây: `6.7` là `Pañcamaṁ.` = *Thứ năm*, và PāLI `sn41.5:4.6` mới là trường hợp lệch (xem khoá đó).

  Cổng kỹ thuật: `technical_integrity` đặt 9.6 thay vì 10.0 vì lát này bị cấm chạy `npm run validate`, `npm test`, `npm run check` và `npm run build` (bốn lệnh này là cổng thật do CI chạy). Đã tự kiểm bằng node: JSON hợp lệ, 40/40 khoá khớp Pāli, 0 khoá thừa/thiếu/rỗng, NFC sạch, dấu lược khớp từng khoá, ngoặc kép cân. Coverage tầng Anh đo lại bằng hàm của kho nên không có blocker loại 1. Không sửa `content/meta/reference-gaps.yaml`, không sửa `source/`, không sửa `scripts/` hay `src/`.

  Lượt cải thiện 2026-10-14 (đọc đối kháng toàn bài; 3/40 khoá đổi). Ghi chú: các mục trên viết "không sửa khoá nào / không tìm ra lỗi" là kết luận của lượt trước; lượt này tìm thấy lỗi thật nên kết luận đó không còn đúng.
    · `5.3`-`5.4` (accuracy fix, vừa): `paṇḍito` là chủ ngữ (danh cách) của `pariyodapeyya`, giống `4.2`, nhưng bản cũ dịch thành hô cách "này bậc trí" — hai chỗ cùng từ trong một bài mà vai ngữ pháp khác nhau. Sửa thành "Bậc trí hãy làm thanh tịnh chính mình, / khỏi các nhiễm ô của tâm." (`cittaklesehi` số nhiều -> "các nhiễm ô"; dhp88 cũng dùng "người trí hãy tự làm cho mình thanh tịnh … khỏi các cấu uế của tâm").
    · `6.6` (accuracy fix, nhẹ): `loke` (vị trí cách, không có chỉ định từ) -> "ở đời", bỏ "đời này" vì Pāli không có `imasmiṁ`; khớp dhp89:6 "ở đời".
    · Tag phẩm `12-paccorohanivagga` -> `paccorohanivagga` theo `an10.114`, `an10.115`, `an10.116` (3 tệp so với 2 tệp lệch).
    · Điểm đổi: semantic_fidelity 9.5 -> 9.4, grammar_logic 9.5 -> 9.4, vietnamese_clarity 9.4 -> 9.3, ambiguity_integrity 9.4 -> 9.2 (hạ vì lượt trước bỏ sót lỗi phân tích cú pháp và còn bất định dưới đây); final_score 9.54 -> 9.49.
    · Sửa lại khẳng định cũ: `1.2` KHÔNG còn trùng byte với `an3.60:1.2` (bản đó nay là "Sau khi trao đổi những lời chào hỏi thân thiện, đáng ghi nhớ"); công thức `sammodanīyaṁ kathaṁ…` đo trong tầng có nhiều cách dịch (16/12/11/9/7 tệp). Giữ cách dịch của bài này (9 tệp, đồng nhất với các bài Saṅgārava song song), không ép theo `an3.60`.
    · Bất định còn lại, không phân xử được: `6.3`-`6.4` `ādānapaṭinissagge anupādāya ye ratā` — tách dòng "từ bỏ nắm giữ, / vui thích không chấp thủ" khiến người đọc có thể hiểu "vui thích" chỉ gắn với "không chấp thủ" mà không gắn với "từ bỏ nắm giữ" (vị trí cách của `ratā`); giữ nguyên vì cùng cách dịch ở sn45.34, an10.118, an10.169, an10.170 và chưa có căn cứ phân xử riêng cho bài này.
    · Tự kiểm sau sửa: 40/40 khoá khớp Pāli, 0 thừa/thiếu/rỗng, NFC sạch, nháy khớp Pāli từng khoá, dấu lược không có. Cổng kỹ thuật `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy ở lượt này; `technical_integrity` giữ 9.6.
