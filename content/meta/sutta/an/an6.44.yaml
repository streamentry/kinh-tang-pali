notes: |-
  TẦNG THAM KHẢO VÀ COVERAGE ENGLISH. Tầng english-sujato tồn tại tại commit đã ghim và bản Sujato phủ 52/62 khoá Pāli có nội dung (khoá từ 40 ký tự trở lên, bỏ khối :0), tức 0,839, trên ngưỡng 0,80 của source/layers.yaml; 10 khoá còn lại là 4.1–4.10 (lời Ngài Ānanda thuật lại cho Đức Thế Tôn) mà Sujato để trống. Mười khoá ấy được bản lấp english-project (đã published, content/translation/en/project) phủ, nhưng bản lấp do cùng một dòng tác giả viết nên KHÔNG phải cách đọc English độc lập; vì vậy triangulation hạ xuống 8,6 và bài này không tuyên bố đã đối chiếu English độc lập cho 4.1–4.10. Với 4.1–4.10 tôi đối chiếu nội bộ với 2.1–2.7 (cùng sự kiện, Pāli trùng ở 4.4≡2.2, 4.6≡2.4, 4.8≡2.6 chỉ khác dấu nháy, 4.7≡2.5, và 4.5 khác 2.3 ở sakadāgāmipatto/sakadāgāmī satto). Tầng Việt hiện hành có file nguyên bài của Hòa thượng Thích Minh Châu (không phân đoạn, đã đọc) nhưng không vào store theo từng khoá. Không cần mục trong content/meta/reference-gaps.yaml vì coverage đạt ngưỡng; có mục cũng không cứu được published.

  TIỀN LỆ ĐÃ ĐO. Bài song song an10.75 (cùng Migasālāsutta, bản mười hạng người) có Pāli trùng nguyên văn ở các công thức; đã dò 18 nhóm Pāli trùng nội bộ trong an6.44 (đều dịch nhất quán; 1 nhóm khác ở chữ hoa đầu câu 9.5/16.5) và dò sang an10.75. Dùng lại nguyên văn bản an10.75 cho công thức nghe/học/thấy rõ/giải thoát tạm thời (13 khoá trong tầng, chủ yếu ở an10.75), Tañhi tesaṁ ... ahitāya dukkhāya, Katame ... (Là sáu nào, 21/38 khoá an6), Taṁ kissa hetu (Vì sao vậy, 308/471 khoá). Khác an10.75 có chủ ý ở năm điểm, đều là lỗi hoặc điểm lệch của bản cũ chứ không phải ý thích: (1) bhagavā dịch Đức Thế Tôn thay vì Đức Phật, theo an6 (39 khoá Đức Thế Tôn so với 19 Đức Phật); (2) bhante của bà Migasālā nói với Ngài Ānanda dịch bạch Tôn giả chứ không phải bạch Thế Tôn (an10.75:2.2 ghi sai người được xưng hô); (3) kāyassa bhedā paraṁ maraṇā dịch khi thân hoại, sau khi chết thay vì sau khi tịch diệt (tịch diệt là nirodha); (4) tadantaraṁ ko jāneyya không thêm Này Ānanda vì Pāli không có; (5) gatimpi aññassa đọc là động từ (Sujato: could not have even known), không phải nói gì biết nơi đến của người khác; (6) puggala dịch cá nhân nhất quán, không dịch vị tỳ-kheo như an10.75:12.x.

  BẤT ĐỊNH, GHI RÕ. (a) ammakā ammakapaññā: tiểu từ chỉ nhỏ của amma (mẹ). Sujato dịch aunty, Hòa thượng Thích Minh Châu dịch với thân như bà mẹ, với trí như bà mẹ. Tôi chọn bà thím để giữ sắc thái coi thường nhưng không khẳng định nghĩa đen; người biên tập có thể đổi. (b) Petteyya (2.4, 4.6): Sujato uncle, Hòa thượng Thích Minh Châu cậu. Dạng petteyya thuộc phía cha nên tôi chọn chú; không xác định được chú hay bác. (c) kodhamāno adhigato (10.1 trở đi): adhigata nghĩa là đã đạt được, đã có; Sujato dịch angry and conceited. Hòa thượng Thích Minh Châu dịch đã chinh phục được phẫn nộ và kiêu mạn, nghĩa ngược. Tôi theo Pāli (adhigata không có nghĩa vượt qua) và ngữ cảnh (người ấy vẫn đi xuống khi chưa nghe, chưa học), nên dịch đã có sân hận và kiêu mạn. Đây là điểm bất định thật nhưng Pāli đủ phân xử, nên không đặt blocker. (d) vacīsaṅkhārā (13.1, 14.1, 16.1): dịch khẩu hành theo tầng (tầng có 61 khoá chứa vacīsaṅkhāra); Sujato diễn nghĩa là xung động nói không đúng chỗ, điều Pāli không nói, nên không đưa vào lời kinh. (e) hānāya pareti và visesāya pareti: dịch nơi thấp kém, nơi cao quý theo an10.75 và Sujato (lower and higher place); Hòa thượng Thích Minh Châu dịch thối đọa và thù thắng. Cả hai cách đều có căn cứ từ hāna (suy giảm) và visesa (thù thắng). (f) ke ca purisapuggalaparopariyañāṇe (5.1, 17.1): câu hỏi tu từ, các bản đọc khác nhau (Sujato: ai biết cách đánh giá; Hòa thượng Thích Minh Châu: để có thể biết sự thắng liệt). Tôi dịch sát chữ và giữ cả hai cách hiểu. (g) imassapi teva dhammā: teva là te eva, những pháp ấy; không xác định được dhammā cụ thể (có lẽ chỉ các đức đã nêu như hiền hòa, dễ sống chung). (h) 5.1 và 17.1 là câu hỏi tu từ; Pāli 17.1 kết bằng dấu chấm, tôi vẫn dùng dấu hỏi cho cả hai và ghi đây là chỉnh dấu câu, không thêm nghĩa. (i) Tusita (kāya = chúng trời) dịch chúng trời Tusita theo mn123 và dn14, trong tầng Tusita và Đâu-suất cùng tồn tại (Tusita 19 khoá, Đâu-suất/Đâu suất 33 khoá); giữ Tusita để khớp an10.75. Hòa thượng Thích Minh Châu viết Dự lưu cho sakadāgāmī, lệch Pāli (Dự lưu là sotāpanna); Pāli thắng, dịch Nhất lai (68 khoá so với 14 khoá nhất lai).

  SỐ ĐẾM. Bài chỉ có số sáu (cha, 5.2, 6.1, 17.2) và hai (cả hai người); sáu cá nhân thật sự được kể đủ (ba cặp: hiền hòa; sân hận kiêu mạn cộng tham; sân hận kiêu mạn cộng khẩu hành), khớp với Pāli.

  DẤU LƯỢC. Pāli có ba khoá chứa dấu lược (11.2, 12.1, 13.2), bản Việt giữ đúng một dấu lược cho mỗi chỗ, không bung thành văn. Pāli không có dấu lược trần và không có dấu lược bao ngoặc. Nháy đơn và nháy kép khớp Pāli ở từng khoá (77/77); 4.1 mở nháy kép, 4.3 mở nháy đơn, 4.8 đóng nháy đơn, 4.10 đóng cả nháy đơn lẫn nháy kép, đúng như Pāli.

