notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato ở commit đã ghim. Tầng Việt hiện
  hành không có bài này: `translation/vi/phantuananh/` ở commit đã ghim chỉ chứa Pháp Cú.
  TRIANGULATION HẠ 8.0, KHÔNG phải vì thiếu cẩn thận: bản Anh đã ghim để trống đúng 2
  khoá (21.4, 21.7) và coverage chỉ lên 100% nhờ lớp lấp `english-project` của chính dự án
  (content/translation/en/project/sutta/an/an9.13_translation-en-project.json, status
  published). Lớp lấp ấy do cùng một tác giả, nên KHÔNG phải một lần đọc Anh độc lập;
  theo AGENTS.md, scorecard tiếng Việt của bài này không được tuyên bố đã đối chiếu Anh.
  TRÙNG NGUYÊN VĂN (đo bằng cách so Pāli từng cặp): `No hidaṁ, āvuso` ở 1.4 và 2.2–10.2
  là một chuỗi giống hệt ⇒ 10 khoá dùng nguyên văn y hệt. `21.4` và `21.7` cũng trùng
  nhau (`Tassa ñāṇāya dassanāya pattiyā sacchikiriyāya abhisamayāya bhagavati
  brahmacariyaṁ vussati`) ⇒ dùng lại nguyên văn.
  1.3–10.1 hỏi thẳng, 11.1–20.1 Sāriputta KỂ LẠI đúng những câu hỏi đó
  (`iti puṭṭho samāno ‘no hidaṁ, āvuso’ti vadesi`) ⇒ phần trích phải GIỮ NGUYÊN VĂN câu
  hỏi đã dịch ở 1.3–10.1, chỉ đổi vòng dẫn. Ở 11.1 và 13.1/15.1/17.1/19.1 có
  `Kiṁ nu kho, āvuso sāriputta`; Ở 12.1/14.1/16.1/18.1/20.1 Pāli rút gọn thành `Kiṁ
  panāvuso` và BỎ cả tên Sāriputta ⇒ dịch bám đúng cả hai điểm, không thêm lại tên.
  Nhấn mạnh đã giữ: cả mười câu hỏi đều mang nghĩa đảo ngược sự mong muốn, và Sāriputta
  đều trả lời "Không hề" — đây là mấu chốt của bài, không được dịch nhu hòa đi.
  `vedanīya/avedanīya` dịch "cảm nhận được / không cảm nhận được"; `sukhavedanīya` /
  `dukkhavedanīya` dịch "sự dễ chịu / sự khổ đau" — giữ đúng nghĩa "cảm nhận được là sự
  dễ chịu" chứ không rút thành "thành sự dễ chịu", vì Pāli là `yaṁ kammaṁ sukhavedanīyaṁ`.
  `ñāṇāya dassanāya pattiyā sacchikiriyāya abhisamayāya` dịch «biết, thấy, đạt được,
  thực chứng, ngơi nhận» — năm mệnh đề, giữ
  đủ cả năm, và dùng lại y hệt ở 21.1, 21.2, 21.4, 21.7, 21.9.
  `aññātaṁ adiṭṭhaṁ appattaṁ asacchikataṁ anabhisametaṁ` dịch «chưa biết, chưa thấy,
  chưa đạt được, chưa thực chứng, chưa ngơi nhận» — lặp nguyên văn ở 21.1, 21.2, 21.3,
  21.6, 21.8.
  technical_integrity 9.6: môi trường lát này không có shell, nên không tự chạy được
  `npm run validate`/`test`/`build`; các bài đã tự kiểm bằng bản cài lại logic của
