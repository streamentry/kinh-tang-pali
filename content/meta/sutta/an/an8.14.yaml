notes: |-
  Dịch từ Pāli root tại commit đã ghim, đủ 90/90 khoá, không khoá nào ngoài tập Pāli; thứ tự khoá theo Pāli.

  COVERAGE ANH ĐO THẬT: mẫu số = khoá Pāli có nội dung (>= 40 ký tự, bỏ khối 0.x) = 68; `english-sujato` phủ 60/68 = 0.882 (ngưỡng 0.8 trong `source/layers.yaml`). Tám khoá Sujato để trống là 10.5, 11.6, 12.5, 13.4, 14.4, 15.4, 16.4, 17.7 (đều là câu `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi`, Sujato nối vào câu trước). Không có tệp lấp `english-project` cho bài này nên 0.882 hoàn toàn là Sujato độc lập, không lẫn bản của dự án. Tầng `vietnamese-current` không có trong store (bilara tại commit đã ghim chỉ có Pháp Cú); bản Hòa thượng Thích Minh Châu của bài này chỉ được đọc như tra cứu toàn văn nguyên bài, không phải cột phân đoạn. Vì thế `reference-gaps.yaml` không cần entry; tám khoá trống ở trên là chỗ Pāli tự đứng vững (câu công thức lặp lại 8 lần, nghĩa không đổi).

  TIỀN LỆ ĐO TRƯỚC KHI CHỌN:
    · 0.1: `Kinh Tăng Chi Bộ 8.14`; 0.2: `2. Phẩm Lớn` (theo an8.13). 0.3 `Assakhaḷuṅkasutta` -> `Kinh Ngựa Hoang` (cùng Pāli với an3.140 và an9.22, 2/2 cùng cách dịch).
    · `khaḷuṅka` -> `ngựa hoang` / `kẻ hoang` (an3.140, an9.22: 2 bài cùng tên kinh; an11.9 dùng `ngựa chứng` cho một bối cảnh khác nên không theo).
    · `sārathi` -> `người đánh xe` (77 so với `người điều khiển` 2).
    · `codeti`/`codaka` -> `chỉ lỗi` / `người chỉ lỗi` (50 so với `trách` 36 trên toàn tầng; mn15 cùng loạt `paṭippharati` -> `phản đối`, `paccāropeti` -> `cãi trả`, `aññenāññaṁ paṭicarati … appaccayañca pātukaroti` -> `né tránh vấn đề, lái câu chuyện …`).
    · `kopañca dosañca appaccayañca pātukaroti` -> `giận dữ, sân hận, bất mãn` (37 khoá: `bất mãn` 18, `giận dữ` 18, `sân hận` 27, `bực bội` 23, `cay cú` 5; chọn nhóm của an3.25/an3.27).
    · `sikkhaṁ paccakkhāya hīnāyāvattati` -> `từ bỏ sự học tập … trở về đời sống thấp hèn` (74 khoá, theo an3.39/an4.122).
    · `kiṁ nu kho tuyhaṁ bālassa abyattassa bhaṇitena` / `Tvampi nāma bhaṇitabbaṁ maññasī`: 2 bài trùng Pāli (an3.99, an5.166), Việt khác nhau ở cả hai; tôi dùng `Kẻ ngu vụng về như ông còn có gì để nói` (an3.99:3.3) và `Sao ông lại tưởng rằng mình có điều đáng nói!` (an5.166:10.5) vì khoá ở đây kết bằng chấm rồi sang khoá mới, không nối bằng dấu phẩy như an3.99.
    · `tathūpamāhaṁ, bhikkhave, imaṁ puggalaṁ vadāmi`: 45 khoá có cùng Pāli; Việt `Ta nói cá nhân này cũng như vậy` 40 (đều trong an4.101–110 và an5.249), `Ta nói hạng người này cũng tương tự như vậy` 5 (an5.75). Tôi chọn `hạng người` vì ở bài này `puggala` đi cùng `kẻ hoang`/`khuyết điểm của người`, `cá nhân` nghe sai giọng; số đếm 40 so với 5 được ghi lại ở đây.
    · `Evarūpopi, bhikkhave, idhekacco … hoti` -> `Có những … như thế, này các tỳ-kheo` theo an4.113 (28 khoá cùng khuôn).
    · `Bhagavā etadavoca:` -> `Đức Phật nói:` (116 so với `Đức Thế Tôn nói:` 26); `Taṁ suṇātha, sādhukaṁ manasi karotha, bhāsissāmī` -> `Hãy lắng nghe và chú tâm kỹ, Ta sẽ nói.` (18/44); `Catutthaṁ.` -> `Thứ tư.` (177 so với `Thứ bốn.` 92).
    · `hàm ngựa` cho `mukhādhāna` theo mn107 (mn65 dùng `hàm móc`; 2 bài, hai cách, chọn từ phổ thông hơn).
    · `doso` (khuyết điểm của ngựa/của người) -> `khuyết điểm`: 0 tiền lệ cho `assadoso`/`purisadoso`; Sujato `defect`, Hòa thượng Thích Minh Châu `tánh xấu`. Không dùng `lỗi` vì bài này đã dùng `chỉ lỗi` cho `codeti`.
    · Pāli trùng nguyên văn trong bài: 4 nhóm khoá (câu `Evarūpopi … assakhaḷuṅko hoti` 8 khoá, câu `Evarūpopi … purisakhaḷuṅko hoti` 8 khoá, câu `Puna caparaṁ … bhikkhū bhikkhuṁ āpattiyā codenti` 7 khoá, câu `tathūpamāhaṁ …` 8 khoá), cả 4 nhóm bản Việt giống hệt nhau; 0 nhóm Việt khác.

  DẤU LƯỢC: Pāli bài này không có `…` hay `(…)` ở khoá nào; bản Việt cũng không. Dấu nháy đơn và nháy kép khớp Pāli từng khoá, 0 lệch trên 90 khoá (1.1 mở `“` không đóng, 1.2 đóng `”`; 2.1 mở `“`, 17.10 đóng `”`; 11.3 mở `‘` không đóng, 11.4 đóng `’`). NFC sạch, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang Việt. Số Pāli: `aṭṭha` = tám (1.1, 2.1, 9.4, 10.1, 17.10) và thứ tự `paṭhamo … aṭṭhamo` = thứ nhất … thứ tám, 16 khoá, đã đối chiếu từng khoá; `Catutthaṁ` = Thứ tư.

  BẤT ĐỊNH ĐÃ PHÂN XỬ, KHÔNG THÊM VÀO THÂN KINH:
    (1) `kubbaraṁ hanati, tidaṇḍaṁ bhañjati` (3.1, 11.5): nghĩa kỹ thuật của `kubbara` và `tidaṇḍa` không được kinh giải thích. Sujato `hub` / `triple rod`; Hòa thượng Thích Minh Châu `thành xe` / `gọng xe`. Tầng đã ghim chỉ có `rathakubbaran` ở sn4.10 (dịch `trục`). Tôi dịch `trục xe` và `bộ ba thanh`, ngang mức chắc chắn của Sujato; chưa phân xử được bằng bằng chứng độc lập trong tầng.
    (2) `piṭṭhito rathaṁ pavatteti` (2.2, 10.4): `piṭṭhito` là `từ phía lưng`, `pavatteti` là `làm cho (xe) lăn đi`. Sujato `spin the chariot behind them`, Hòa thượng Thích Minh Châu `với lưng, làm chiếc xe chạy vòng lại`. Tôi giữ `làm cho chiếc xe lăn từ phía lưng nó`, không nói rõ lăn hướng nào vì Pāli không nói.
    (3) `nevāhaṁ āpannomhi, na panāhaṁ āpannomhī` (16.2): Pāli ở bản ghim lặp `āpannomhi` hai lần. Sujato đọc là `neither confesses nor denies` (tức là cách đọc `na panāhaṁ anāpannomhi`); Hòa thượng Thích Minh Châu dịch lặp nguyên văn `Tôi không phạm tội, tôi không có phạm tội`. Tôi theo đúng chữ Pāli đang có, dịch `Tôi không hề phạm, mà cũng chẳng phải là tôi đã phạm`, không thêm `chưa`. Câu có `ti` mà không có động từ nói; dùng `với ý` thay vì thêm động từ `nói` vì vị này đang im lặng.
    (4) `asatiyā nibbeṭheti` (10.3): dịch `thoái thác bằng sự không nhớ`; Sujato `evades it by saying they don't remember`. Pāli không nói người ấy thật sự quên hay giả vờ.
    (5) `viddho samāno codito sārathinā` (mọi khoá ngựa): `viddha` là `bị đâm/chọc`; tôi dịch `bị chọc thúc` để không nói rõ dụng cụ (Sujato gộp `spurs and goads`). Không thêm `roi nhọn` vào thân kinh.
    (6) `bāhuvikkhepaṁ karoti` (14.2): dịch `khua tay`; Sujato thêm `while speaking` còn Pāli không nói người ấy đang nói.
    (7) `sāpattikova` (15.2): dịch `dù vẫn còn mang tội` theo Sujato (`though still guilty`).
    (8) `hothā` (17.5) là mệnh lệnh cách; khoá kết `?` nên tôi dịch thành câu hỏi `đã hài lòng chưa?`, giọng mỉa mai như Sujato `are you happy now?`.

