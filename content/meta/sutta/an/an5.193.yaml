notes: |-
  **Coverage tầng Anh đo được: 47/47 khoá Pāli có nội dung = 1,0000** (ngưỡng 0,80 nên không phải ghi nhận gap). Đo bằng đúng công thức `src/lib/canon/reference.ts`: `substantivePaliMinChars = 40`, bỏ khối tham chiếu `:0`; `englishPath = sutta/an/an5/an5.193_translation-en-sujato.json` **có trong `source/upstream-manifest.json`** (tầng `english-sujato`, commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`) và đã sync trong cache: 51 khoá, 50 khoá có chữ, `substantiveWithoutEnglish = 0`. Lớp `english-project` không có cho uid này. Tầng `vietnamese-current` vắng tại commit đã ghim (chỉ 26 tệp, toàn bộ là Pháp Cú) ⇒ không có bản Hòa thượng Thích Minh Châu để đối chiếu; đây là đặc điểm của snapshot upstream, không phải thiếu sót của kho.

  **5/51 khoá trùng nguyên văn với bài đã dịch — dùng lại NGUYÊN VĂN, không dịch lại.** Đếm bằng script trên chỉ số Pāli→Việt của **5.307** bài đã dịch: `0.2` `20. Brāhmaṇavagga` → *20. Phẩm Bà-la-môn* (7×, an5.191/195/196/197/198/199) · `0.3` `Saṅgāravasutta` → *Kinh Saṅgārava* (5×, mn100, an3.60, an10.117, an10.169, sn7.21) · `1.1` (3×, an3.60, an10.117, an10.169) · `1.2` (3×, cùng ba bài) · `13.1` (2×, an2.17:3.1, an2.34:3.1). Ngoài ra `2.3`=`3.3`=`4.3`=`5.3`=`6.3` và `7.3`=`8.3`=`9.3`=`10.3`=`11.3` là Pāli **trùng nhau ngay trong bài** nên dùng chung một cách dịch, và `3.4`/`4.4`/… cùng khuôn.

  **Năm triền cái — chọn theo đa số ĐO ĐƯỢC, ghi kèm số.** `kāmarāga` → *dục tham* (167 khoá, đối lập *dục trưởng* 35) · `byāpāda` → *sân hận* (432) · `thinamiddha` → *hôn trầm và buồn ngủ* (24, đối lập *hôn trầm thụy miên* 13, *hôn trầm buồn ngủ* 21) · `uddhaccakukkucca` → *trạo hối* (13, đối lập *xao động và hối tiếc* 10, *trạo cử và hối hận* 5) · `vicikicchā` → *nghi hoặc* (103; *nghi ngờ* 119 và *hoài nghi* 158 đứng riêng nhưng trong danh sách nīvaraṇa thì kho dùng *nghi hoặc*, ví dụ dn34 và mil6.2.6). Khuôn vế phụ định chọn theo đúng công thức đã có sẵn cho `…pariyuṭṭhitena cetasā viharati …paretena, uppannassa … nissaraṇaṁ yathābhūtaṁ nappajānāti` (an6.27, mn64, mn108): *bị … chế ngự, bị … làm cho say; không biết như thật sự lối xuất ly khỏi …*. `nissaraṇaṁ` → *lối xuất ly khỏi* (*xuất ly khỏi* 52, *lối thoát khỏi* 36). **Ghi nhận lệch:** `an6.27` dùng *dục trưởng* cho cùng công thức; tôi theo đa số toàn tầng.

  **Danh sách thuốc nhuốm `lākhāya haliddiyā nīliyā mañjiṭṭhāya` → *son đỏ, son, nghệ, chàm hay cánh đỏ*** — 1 tiền lệ đúng danh sách này (`sn22.100:4.1`, ngữ cảnh vẽ tranh). Tôi dùng lại nguyên văn để trong kho không có hai cách, **nhưng ghi rõ là bất định**: bản Anh đã ghim phân định là *red lac, turmeric, indigo, rose madder*, mà *son đỏ* và *son* là hai tên cho cùng một chất, nên cụm Việt dễ đọc là lặp. Người rà soát nên phán một lần cho cả hai bài.

  **Vá lỗi dấu nháy của bilara.** Pāli bài này có **3 dấu `”` nhưng chỉ 2 dấu `“`**: đóng ở `1.4` (`”ti?`), `12.2` (`”ti.`), `13.1`; mở ở `1.3` và `13.1`. Tôi **giữ nguyên cả ba dấu `”`** (kể cả `ti` và dấu hỏi, theo đúng quy ước tầng Việt: 215 khoá kết bằng `”ti?`, 150 khoá kết bằng `”ti.`) và **thêm một `“` còn thiếu ở `12.1`** — bổ sung dấu câu, không thêm chữ. Kết quả: 3 mở / 3 đóng, cân trên cả bài. Sujato cũng để dấu `”` lơ lửng ở `12.2` mà không mở; tôi không chép lỗi đó.

  **0 tiền lệ, ghi lại để lát sau khỏi phát minh thêm cách:** `mukhanimittaṁ` → *hình bóng khuôn mặt của chính mình* (Sujato *their own reflection*) · `sevālapaṇakapariyonaddho` → *bị rêu tảo và cây thủy sinh bao quanh mọc kín* · `santatto ukkudhito ussadakajāto` → *bị lửa đun nóng, sôi sùng bụng, và sôi lên đầy bọt* · `vāterito calito bhanto ūmijāto` → *bị gió khuấy, chập loờn, xoay tròn và gợn sóng* · `attatthampi / paratthampi / ubhayatthampi` → *lợi ích cho mình / cho người khác / cho cả hai* (6 khoá *lợi ích cho mình*, 9 khoá *lợi ích cho người khác*, 8 khoá *lợi ích cho cả hai*) · `ko nu kho… hetu ko paccayo` → *do nhân gì, do duyên gì* (62 khoá) · `pageva` → *huống hồ* · `sajjhāyakatā` → *đã tụng đọc* (theo *tụng đọc* 65 khoá cho `sajjhāya`), `mantā` → *bài tụng* (13 khoá). `accho vippasanno anāvilo` → *trong suốt, trong sáng, không vẩn đục* và `āvilo luḷito kalalībhūto` → *đục ngầu, bị khuấy động lẫn lộn, đầy bùn* theo `dn10:2.36.1` và `an1.45:1.1`.

  **Chủ thể vô danh trong `yasmiṁ samaye … viharati`.** Pāli ở `2.1`–`11.4` không có chủ thể tường minh (không `ekacco`, không `bhikkhu`); Sujato thì dùng *your heart*. Tôi dịch vô danh (*vào lúc nào tâm sống bị …*) để không thêm một chủ thể Pāli không có, và vì Pāli vốn đã nói chung. Chỗ `brāhmaṇa` và `bho gotama` thì giữ *này Bà-la-môn* và *thưa Tôn giả Gotama* như 5 bài anh em đã dịch.

  **Dấu lược: Pāli 18 `…pe…` ↔ Việt 18 `…`, khớp từng khoá, không khoá nào mở rộng.** 17 khoá có `…pe…`; riêng `7.4`, `8.4`, `9.4`, `10.4` Pāli kết bằng `…pe….` (dấu lược rồi dấu chấm) — bản Việt giữ một `…` rồi dấu chấm, đúng quy ước. Chốt `_hvi.py` sạch: 51/51 khoá, khoá thừa 0, NFC OK, ngoặc kép cân.
