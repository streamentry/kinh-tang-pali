notes:
  - >-
    **Bài ngắn nhất chương (14 segment)**: mười kết trói buộc, chia đôi hạ phần
    và thượng phần, mỗi nửa một câu hỏi và một câu trả lời. Không có lặp, nên
    dịch thẳng.
  - >-
    **`Nāthavagga` → *Phẩm Bảo Hộ*** (0 segment tiền lệ, đặt mới): `nātha` là
    người bảo hộ, chỗ nương tựa — và Sujato dịch tên phẩm là *A Protector*. Cả
    phẩm đúng ngữ nghĩa đó: `nāthakaraṇā dhammā` → *mười pháp làm nên sự bảo
    hộ*, `sanāthā … mā anāthā` → *hãy sống có chỗ bảo hộ, đừng sống không chỗ
    bảo hộ*, `anātho viharati` → *sống không chỗ bảo hộ là khổ đau*. Vì ba cụm
    này lặp ở `an10.17` và `an10.18`, tôi dùng **cùng một cách** cho cả ba bài;
    `an10.19`–`an10.20` dùng `ariyāvāsā` → *chỗ ở của bậc Thánh* (cũng 0 tiền
    lệ), đối xứng với `senāsana` → *chỗ ở*.
  - >-
    **Bốn thuật ngữ của nửa dưới lấy từ `an3.94:2.2` và `an3.121:3.2`** (đã
    `published`): `sakkāyadiṭṭhi` → *thân kiến*, `vicikicchā` → *hoài nghi*,
    `sīlabbataparāmāso` → *chấp thủ giới nghi lễ*, `kāmacchanda` → *dục tham*.
    `byāpāda` → *sân hận* theo `an10.178:2.2` và `an10.43:1.4`.
  - >-
    **Nửa trên là năm thuật ngữ 0 segment tiền lệ, đặt mới và ghi lý do tại
    đây**: `rūparāga` → *tham sắc*, `arūparāga` → *tham vô sắc* (theo
    `an4.34:1.3` và `an5.32:3.1` dùng *không sắc* cho `arūpin`, và `arūparāga`
    là tên của `arūpino`); `māna` → *ngã mạn* (theo `an4.159:7.10`,
    `dhp146-156`, `dhp383-423`); `avijjā` → *vô minh* (theo `an3.58:1.1`);
    `orambhāgiya`/`uddhambhāgiya` → *thuộc hạ phần*/*thuộc thượng phần* — trong
    đó *hạ phần* có tiền lệ ở `an3.141` và `an4.131`, còn *thượng phần* là **0
    segment**, đặt mới theo cặp song phương.
  - >-
    **Dấu gạch ngang `—` ở cuối `1.5` và `2.2` giữ nguyên vì Pāli vậy**
    (`sānahān, byāpādaṁ—`): dấu báo danh sách còn tiếp, khác dấu chấm câu.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
