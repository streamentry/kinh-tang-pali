notes:
  - >-
    **Bài ngắn (17 segment), cùng khuôn với `an10.77`**: mười điều ác, mỗi vế
    một segment, kết bằng *đây là mười điều ác*. Khác `an10.77` ở chỗ danh sách
    **không lặp**, nên tôi dịch thẳng từng vế.
  - >-
    **`Ākaṅkhavagga` → *Phẩm Nguyện Cầu*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *If You Want*, và cả phẩm đúng một việc — *vị tỳ-kheo mong
    nguyện điều này, thì hãy làm điều kia* (`ākaṅkha` = mong nguyện).
    `Ākaṅkhasutta` → *Kinh Nguyện Cầu*.
    **`Ākaṅkhavaggo tatiyo` ở `an10.80:1.14` dịch là *Phẩm Nguyện Cầu, thứ ba***
    — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì phẩm này rõ
    ràng thứ tám (đúng như `8.` ở `0.2`). Tôi dịch theo Pāli vì Pāli là
    authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **`nigaṇṭha` → *du sĩ Nigantha*** theo `an3.70:3.2` (*có một hạng sa-môn gọi
    là người Nigantha*), giữ chữ Nigantha vì đây là tên một hạng người, không
    phải tên riêng.
    **Mười điều ác đều 0 tiền lệ, đặt mới**: `asappurisasambhattino` → *chạy
    theo hạng người bất thiện*; `attukkaṁsakaparavambhakā` → *tự khoe mình, hạ
    thế người khác*; `sandiṭṭhiparāmāsā ādhānaggāhī duppaṭinissaggino` → *nắm
    chặt kiến chấp riêng, nắm giữ chặt, khó chịu buông*; `kuhakā` → *giả dối*
    (tiền lệ `an5.90:11.2` dịch *kuhakā* là *kẻ lừa gạt*, cùng nghĩa);
    `pāpicchā` → *mong muốn ác*; `pāpamittā` → *bạn bè xấu* theo `an3.27:1.11`.
    Có tiền lệ: `assaddhā` → *vô tín*; `ahirikā`/`anottappino` → *thiếu hổ thẹn*
    / *thiếu kính sợ* theo `an10.105:1.1`.
  - >-
