notes:
  - >-
    **Bài mà cả Pháp Cú và Tăng Chi Bộ đều trích**: mười câu hỏi của du sĩ đạo
    khác và mười câu trả lời. Ở Tăng Chi Bộ, **`an3.68:1.1` là tiền lệ trực tiếp
    cho lớp vỏ** — *“Này các tỳ-kheo, nếu các du sĩ đạo khác hỏi…”* — và
    `an3.68:1.8` cho lời đáp của các tỳ-kheo: *“Bạch Thế Tôn, Pháp của chúng con
    lấy Đức Phật làm gốc, lấy Đức Phật làm người dẫn đường, lấy Đức Phật làm chỗ
    nương tựa…”*. Tôi dùng nguyên văn cả hai.
  - >-
    **`Sacittavagga` → *Phẩm Tâm Mình*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *Your Own Mind*, và cả phẩm nói đúng một việc — soi lại
    **tâm mình** (`sacittapariyāyakusala`). Tên bài `Sacittasutta` → *Kinh Chăm
    Chính Tâm Mình*.
    **`Sacittavaggo paṭhamo` ở `an10.60:15.5` dịch là *Phẩm Tâm Mình, thứ
    nhất*** — đây là **số thứ tự của chính Bilara đánh số lại**, vì phẩm này rõ
    ràng là thứ sáu trong Bộ Mười (đúng như `6.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Cả mười cặp thuật ngữ trong câu trả lời đều 0 tiền lệ trong corpus, đặt
    mới và ghi lý do tại đây**: `chandamūlakā` → *gốc rễ là tham*;
    `manasikārasambhavā` → *do tâm chuyển động mà có*; `phassasamudayā` → *do
    chân xúc mà sinh*; `vedanāsamosaraṇā` → *quy về cảm thọ*; `samādhippamukhā`
    → *có đầu là định*; `satādhipateyyā` → *do chánh niệm chỉ huy*; `paññuttarā`
    → *tối thượng là tuệ*; `vimuttisārā` → *cốt lõi là giải thoát*; `amatogadhā`
    → *bám vào vị bất tử* (theo `an5.61:1.1` *chìm đắm trong vị bất tử, với bất
    tử làm cứu cánh*); `nibbānapariyosānā` → *kết thúc ở Niết-bàn*.
    **Giữ nguyên số lần lặp `sabbe dhammā`** (mười lần trong câu trả lời, mười
    lần trong câu hỏi) — đó là nhịp của bài, rút bớt sẽ mất tiếng Việt.
  - >-
    **Lỗi do lượt review bắt được, và là loại lỗi chỉ lộ ra khi đọc cặp
    hỏi–đáp.** Bản đầu tôi hỏi `kiṁuttarā` là *“mọi pháp có kẻ trông coi ở
    đâu”*; nhưng Pāli trả lời bằng `paññuttarā` — **tuệ là tối thượng** — nên
    câu hỏi phải là *“mọi pháp tối thượng là gì”*. Tương tự, `kiṁadhipateyyā`
    trả lời bằng `satādhipateyyā` (chánh niệm chỉ huy), phải hỏi *“có người chỉ
    huy là gì”*. Sai một vị trí là hỏi sai và đáp lệch, mà người đọc không có
    cách nào phát hiện. Đã sửa cả `1.2` và `3.2`.
  - >-
    **`1.3` có lỗi chính tả *Đức Thật*** thay vì *Đức Phật* — do khi chép lại
    nguyên văn `an3.68:1.8`. Đã sửa.
    `1.2` có dấu hỏi trong Pāli, `3.2` thì không (`kiṁpariyosānā sabbe
    dhammā’ti,`); tôi theo từng bài.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
