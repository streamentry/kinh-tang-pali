notes: |-
  Đợt 19, lát 19. Dịch trọn 75 khoá từ Pāli root đã ghim, đối chiếu Sujato đã ghim, bản Việt song song `ud5.5` (cùng công thức tám pháp kỳ diệu của biển lớn, đã có trong tầng) và bản Hòa thượng Thích Minh Châu nguyên bài ở mục Tra cứu toàn văn (không phải tầng store, không căn lề vào khoá).

  **Coverage Anh — đo thật.** Mẫu số = khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = **69**. Sujato phủ **53/69 = 0,7681**. Ngưỡng 0,80 cần **56** khoá, thiếu **3**. Cả **16** khoá trống đều là dòng `Yampi …;` tóm tắt lại vế ngay trước. Tầng `english-project` của bài này đã `published` và lấp **16/16** (tính cả: 69/69 = 1,0000), nhưng đó là bản dịch English của chính dự án, do cùng một nguồn tác giả với bản Việt, nên **không** là cách đọc Anh độc lập; bài này không được tuyên bố đã đối chiếu English ở 16 khoá ấy. Vì vậy `triangulation` = 8,0 (trần) và bài giữ `draft` kèm blocker, đúng cách xử lý của `sn22.7`. Mất mát này **chưa** có entry trong `content/meta/reference-gaps.yaml` (đã dò `an8.19`: 0 entry); entry không cứu được `published`. Tầng `vietnamese-current` chỉ phủ Pháp Cú ⇒ không có tầng Việt hiện hành trong store cho bài này; bản Thích Minh Châu chỉ đọc ở mục tra cứu toàn văn.

  **Cách xử lý 16 khoá `Yampi`.** Giữ đúng công thức của lớp lấp: *việc …* + vế vừa nêu, rồi `ayaṁ …` mở bằng *đây, … là pháp kỳ diệu, hy hữu thứ …*. Cùng cấu trúc với khung *The fact that* trong lớp lấp English. Ghi lại để người biên tập có thể đổi đồng loạt: `yampi` ≈ *chính điều này / việc ấy*; đã đo tầng Việt: **174** khoá mở bằng `Yampi`, trong đó bản dịch mở bằng *việc/Việc* **48** (kể cả `dn25`, cùng khung `Yampi …; ayaṁ …`), *Dù* 31, *Nhờ* 16, *Và* 12, *Điều* 11 — nghĩa của `yampi` đổi theo bối cảnh nên chọn dạng *việc* của cùng khung.

  **Tám pháp của biển lớn, tám pháp của Pháp và Luật.** Mỗi danh sách tám mục được đánh số **hai lần** (`2.8`–`9.3`, rồi `10.9`–`18.4`): *thứ nhất … thứ tám* (paṭhama 1, dutiya 2, tatiya 3, catuttha 4, pañcama 5, chaṭṭha 6, sattama 7, aṭṭhama 8). `19.2` `Navamaṁ.` → *Thứ chín.*: nhãn thứ tự của bài trong Phẩm Lớn, không phải mục thứ chín của danh sách.

  **Số Pāli, kèm phép tính.** `yojanasatikāpi` = yojana × sata = **một trăm do-tuần**; `dviyojanasatikāpi` = 2 × 100 = **hai trăm**; `tiyojana…` 3 × 100 = **ba trăm**; `catuyojana…` 4 × 100 = **bốn trăm**; `pañcayojanasatikāpi` 5 × 100 = **năm trăm**. Các số khác: `aṭṭha` 8, `cattārome vaṇṇā` 4 giai cấp, `cattāro satipaṭṭhānā` 4, `cattāro sammappadhānā` 4, `cattāro iddhipādā` 4, `pañcindriyāni` 5, `pañca balāni` 5, `satta bojjhaṅgā` 7, `ariyo aṭṭhaṅgiko maggo` 8 chi. Năm sông (Gaṅgā, Yamunā, Aciravatī, Sarabhū, Mahī) đếm đủ **5**. Tám hạng Thánh ở `18.2/18.3` = 4 quả × 2 (vị đã chứng và vị đang thực hành) = **8**; đã đếm khớp 8 mục trong bản Việt.

  **Dấu lược ở `9.2`.** Pāli có **4** ký tự `…` thô, theo luật là **3** dấu lược (1 từ `…pe…` + 2 dấu trần sau `tiyojana` và `catuyojana`). Bản Việt có đúng **3** `…`, không mở rộng phần bị lược. 74 khoá còn lại có **0** `…` ở cả hai vế. Không có `(…)` trần ở khoá nào trong bài.

  **Ngoặc.** Chỉ `5.2`, `5.3`, `14.1`, `14.2`, `14.3` có nháy **đơn** `‘…’` (‘biển lớn’, ‘sa-môn dòng Thích tử’); khớp Pāli từng khoá. Nháy **kép**: lời Pahārāda mở ở `2.4` và đóng ở `10.1` (Pāli cho nháy chạy qua ranh giới khoá); lời Đức Thế Tôn mở ở `10.4` và đóng ở `19.1`. Đã so từng khoá với Pāli cho cả bốn ký tự `“ ” ‘ ’`: **0** lệch / 75 khoá.

  **Pāli trùng nguyên văn trong chính bài.** 1 cặp (`2.5` = `10.5`, `Katame aṭṭha?`), bản Việt giống nhau. 0 cặp khác. **Với tầng:** đã dò 4 khoá loại có Pāli trùng ở nơi khác (`0.2` ×5, `2.5`/`10.5` ×33, `19.2` ×255); `0.2` giống 5/5; `19.2` *Thứ chín.* 252/255 (`an` 116/118); `Katame aṭṭha?`: *Thế nào là tám?* 14, *Là tám nào?* 10 toàn tầng, nhưng ở `an8` *Là tám nào?* **9** so với *Thế nào là tám?* **7** ⇒ chọn *Là tám nào?* theo phạm vi gần nhất.

  **Thuật ngữ, kèm số đếm (cả hai phạm vi khi lệch).** *Pháp và Luật* (dhammavinaya): `an` 38 / 0 chữ thường; toàn tầng *Pháp và Luật* 96, *pháp và luật* 50, *giáo pháp và luật* 30 ⇒ viết hoa, đúng đa số cả hai phạm vi. *a-tu-la*: `an` 33 chữ thường / 6 hoa ⇒ chữ thường; riêng *vua A-tu-la* (asurinda): **30** khoá ở tầng, đều viết hoa. *Dự lưu* 43 / *Nhập lưu* 2, *Nhất lai* 37 (+4), *Bất lai* 20 (+3), *A-la-hán* 46. *Như Lai tuyên thuyết* 11 hơn *khai thị*. *sa-môn dòng Thích tử* nhiều nhất ở tầng (5 + các biến thể). *Sát-đế-lợi, Bà-la-môn, Phệ-sa, Thủ-đà* theo `mn90` (6 khoá), còn ba biến thể khác ở `dn3`/`dn27`/`ud5.5`. *Thánh đạo tám ngành* 133 / *tám chi* 10 / *tám chi phần* 4; *bốn như ý túc* 33 / *thần túc* 27 (chọn đa số, hơn kém ít). *sự học tập thứ lớp, sự thực hành thứ lớp, sự hành đạo thứ lớp* theo công thức `mn107` (5 khoá). *na-ga* (nāgā): trong ngữ cảnh danh sách *a-tu-la, na-ga, càn-thát-bà* là *Nāga/na-ga* 9, *long vương* 3, *rồng* 0; *rồng* thắng toàn tầng (30) nhưng ngoài ngữ cảnh này ⇒ chọn *na-ga*. *phạm giới, có hạnh ác, … hư hỏng từ gốc* theo công thức `an3.13`/`an3.27`. *do-tuần* theo `mn28`. *nhanh chóng* (khippameva) 59 / *liền* 9.

  **Bất định — ghi tại đây, không đưa vào thân kinh.**
  1. `masāragalla`: giữ nguyên Pāli (`dn17` 8 khoá) vì không phân xử được — `ud5.5` dịch *mắt mèo* (3 khoá), Sujato *emeralds*, Thích Minh Châu *mã não*.
  2. `silā` trong danh sách châu báu → *thạch anh* (theo `ud5.5`, 3/3 khoá cùng danh sách, và Sujato *quartz*); Thích Minh Châu *ngọc bích*; nghĩa là *đá*, cách hiểu cụ thể không chắc. `saṅkho` → *ốc xà cừ* theo `ud5.5` (3/3); các chỗ khác trong tầng thường là *tù và* (33) / *vỏ ốc* (35); `lohitako` → *hồng ngọc* (`ud5.5`; toàn tầng 9 khoá) — Thích Minh Châu *ngọc đỏ*.
  3. `ṭhitadhammo velaṁ nātivattati`: *có bản tính ổn định, không vượt quá bờ*; `ud5.5` *giữ đúng pháp*, Sujato *consistent*, Thích Minh Châu *đứng một chỗ*. `vela` = bờ / giới hạn.
  4. `naḷerupucimandamūle`: *dưới gốc cây pucimanda của Naḷeru*; Sujato *neem tree dedicated to Naḷeru*. `pucimanda` giữ nguyên (cây neem), mối quan hệ với Naḷeru không chắc (Thích Minh Châu *Nalerupucimanda*).
  5. `timi timiṅgalo timirapiṅgalo` (Pāli bài này; `ud5.5` có `timitimiṅgalo`, khác dạng): *cá timi, cá timiṅgala, cá timirapiṅgala*; `ud5.5` dịch *cá voi, cá voi nuốt, cá voi nuốt cá voi nuốt*, Sujato *leviathan* ×3; không có tiền lệ cho dạng thứ ba nên giữ tên Pāli.
  6. `aññāpaṭivedho` → *sự thấu triệt chánh trí*; `ud5.5` *sự chứng ngộ chân lý*, Sujato *penetration to enlightenment*; chỉ 2 khoá toàn tầng.
  7. `arahattāya paṭipanno` (không có `sacchikiriyāya`) → *vị đang thực hành để đạt đến quả A-la-hán* theo `an9.9`/`an8.60`; Sujato *practicing for perfection*.
  8. `bhūtā` → *sinh vật* (theo `ud5.5`); Sujato *beings*. `attabhāvā` → *thân hình*.
  9. `jīvitahetupi` → *dù vì mạng sống* (`an8.49`, `an8.50`).
  10. `ukkhipati` → *trục xuất* (`an3.99`); `an5.250` dùng *khai trừ*.

  **Khác biệt chủ ý so với bản Việt song song `ud5.5`.** Giữ lặp `disvā disvā` thành *thấy rồi lại thấy* (ud5.5 chỉ *thấy rồi*); *Pháp và Luật* thay *giáo pháp và luật*; *tám ngành*, *như ý túc*, *thứ lớp* thay *tám chi phần*, *thần túc*, *tuần tự*; không dùng *long vương* (Pāli không có *vương*). Không sửa `ud5.5`.

  **Kiểm tra đã làm.** Tập khoá Việt = tập khoá Pāli = **75**, đúng thứ tự Pāli; NFC; 0 khoá rỗng; 0 khoảng trắng thừa; 0 từ Pāli lọt sang thân Việt ngoài danh từ riêng; 0 dấu lược lệch; 0 nháy lệch. Đã in từng cặp Pāli ↔ Việt ra đọc: các khoá `Yampi` không bị lệch nội dung (mỗi khoá đúng vế ngay trước nó).

  **technical_integrity 9,6:** không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lát này, nên **không** tuyên bố technical gate pass; bốn lệnh đó còn lại cho người điều phối.
