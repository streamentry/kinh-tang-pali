notes: |-
  Mất rồi làm lại (người điều phối, có bằng chứng): bản nháp 1 khoá của bài này tồn
  tại ở PR #169 đã bị `git reset --hard` của tôi xoá khi tôi định tách PR Anh — vì
  nó chưa được commit. Mất đúng 4 khoá (1.0/1.1/1.2/1.4) và bản sửa 1.3 (bản nháp
  dùng `pháp tử` cho `dhātu` và thêm `đúng lý` vốn không có trong Pāli). Số đo
  `docs/store-verification.json` tự phát hiện: khoá Việt rơi 106.854 → 106.850.
  Nay dịch lại từ Pāli, không dựng lại từ trí nhớ, và ghi sự cố này vào đây.

  Dùng lại nguyên văn đã có (Pāli `1.1`/`1.2`/`1.4` giống hệt `an2.97` cùng tệp
  `an2.87-97_root-pli-ms.json`): *Có hai loại pháp, này các tỳ-kheo.* / *Thế nào là
  hai?* / *Này các tỳ-kheo, đây là hai loại pháp”*. `1.0` là số thứ tự, mô phỏng anh em.
  Khung `kusalatā` → *sự thành thạo tốt lành* có 3 tiền lệ (an2.97:1.3, an2.163:1.3,
  và bản nháp đã xoá), nên `1.3` đi nguyên khung đó.

  `dhātu` → *các yếu tố* (Sujato: "the elements"). Đo được: `dhātu`/`dhātū` trong tầng
  Việt chỉ có 5 cặp, cả 5 đều là "giới tánh" trong câu liệt kê `sáu giới tánh`
  (sn18.10:2.4, sn27.10:2.4, an3.136) — tức là không có tiền lệ nào cho nghĩa "phạm vi
  thực hành". Chọn *yếu tố* vì chữ này có 140 lượt / 59 bài trong tầng, đúng nghĩa
  (element), và tránh lẫn với `sīla` → *giới* (3.522 lượt) khi hai cụm kusalatā đứng
  cạnh nhau trong chính câu này. Ghi thay thế: *giới tánh* (đúng với nghĩa liệt kê nhưng
  lệch ngữ cảnh), *các pháp tử* (bản nháp cũ — `dhātu` không phải `dhamma`, tiền lệ
  "pháp tử" trong tầng là `dhamma`).

  `manasikāra` → *tác ý*. Quét từng cặp Pāli↔Việt có `manasikār`: 120 cặp, 52 dịch
  *tác ý* (kể cả `yonisomanasikāra` → *khéo tác ý* ở sn45.76), 2 dịch *hành ý*
  (an2.124:1.3, sn47.42:1.11), 1 dịch *suy nghĩ* (an10.76:5.1 — chính là tiền lệ mà
  bản nháp cũ dựa vào, và nó chỉ có 1 chỗ nên không đủ sức làm chuẩn). `cetanā` thì
  để riêng là *chủ ý*, không trộn vào đây.

  Số nhiều *các yếu tố* theo Sujato (elements) chứ không ghi rõ *bốn đại pháp tử*:
  cụm Pāli đứng trần, ghi thêm số là thêm ý.

  Đối chiếu được Sujato cho cả 4 khoá có chữ (1.1–1.4); tầng Việt hiện hành không có
  Tăng Bộ tại commit đã ghim (giới hạn upstream, đã đo: `translation/vi/phantuananh/`
  chỉ có Pháp Cú), nên `triangulation` ở 9.3 chứ không cao hơn. Bản dịch đi qua chốt
  `kiểm`/`_ghi` của `_hvi.py`: 5/5 khoá, NFC, ngoặc kép cân trên cả bài (mở ở 1.1,
  đóng ở 1.4), dấu lược 0 = 0, không Pāli lọt.
