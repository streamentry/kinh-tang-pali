notes: |-
  **Phạm vi: đúng một khoá** (`an2.96:1.3`). Bài chỉ có 5 khoá, trong đó
  `kiểm` của `_hvi.py` đòi đúng một khoá. Tôi dịch khoá đó và **không** tự thêm
  `1.0`/`1.1`/`1.2`/`1.4` — cùng nguyên tắc đã ghi ở `notes` của `cp35`. Hệ quả phải
  nói thẳng: người đọc sẽ thấy cột Việt dự án chỉ có một dòng, và dấu `“` mở ở
  `1.1` của Pāli sẽ không xuất hiện.

  **Tiền lệ, tất cả đều tra trong `content/translation/vi/project/sutta/`:**
  `an2.96:1.1`, `:1.2`, `:1.4` có Pāli **giống hệt** `an2.97` (cùng file
  `an2.87-97_root-pli-ms.json`), nên nếu sau này dịch nốt thì phải dùng lại nguyên văn
  câu đã có: *Có hai loại pháp, này các tỳ-kheo.* / *Thế nào là hai?* /
  *Này các tỳ-kheo, đây là hai loại pháp”*. `kusalatā` → *sự thành thạo tốt lành*
  (`an2.97:1.3`, cùng Phẩm Pháp). `dhātu` → *pháp tử*: **1 chỗ** trong tầng Việt, câu
  nhân quả *có tuổi, pháp bệnh tật thì có sức khỏe, pháp tử thần thì có mạng sống*.
  `manasikāra` → *suy nghĩ*: `an10.76:5.1` dịch `ayoniso manasikāraṁ` =
  *suy nghĩ không đúng lý*, suy ra `yoniso` = *đúng lý*.
  **0 tiền lệ cho cả cụm `dhātukusalatā` và `manasikārakusalatā`**: quét toàn bộ
  snapshot Pāli, hai cụm chỉ xuất hiện đúng ở `an2.96:1.3`, không có bản Việt nào
  để bám theo.

  **Đối chiếu được tầng Anh.** Sujato (đã ghim) cho đúng khoá này: *Skill in the
  elements and skill in application of mind.* Khớp với lựa chọn của tôi ở cả hai vế
  (pháp tử / sự suy nghĩ), nên `triangulation` cao hơn các bài Khuddaka cùng lát.
  Tầng Việt tham khảo (Thích Minh Châu) không có Tăng Chi Bộ tại commit đã ghim, nên
  không đối chiếu được.

  **Bất định đã ghi nhận:** `dhātu` ở đây là bốn đại pháp tử, nhưng cụm Pāli đứng
  trần nên tôi dịch là *các pháp tử* (số nhiều) theo Sujato (*the elements*) chứ không
  ghi rõ *bốn đại pháp tử* — ghi rõ sẽ là thêm ý không có trong câu. Tiếng Việt chỉ có
  1 chỗ `dhātu` nên `pháp tử` là chữ dịch **đặt mới theo một tiền lệ duy nhất**, đây là
  lý do hạ `terminology` xuống 9.3.
