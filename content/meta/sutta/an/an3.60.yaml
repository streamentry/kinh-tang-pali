notes:
  - >-
    **Giải quyết draft 2026-10-12 — thay thế mục chấm ngày 2026-09-13.** Blocker
    cũ ("cắt ngắm" ở `an3.60:14.2`) đã gỡ: ở bản dịch hiện tại khoá đó không còn
    dấu lược `…`; Pāli `yāva brāhmalokāpi kāyena vasaṁ vatteti` được dịch đủ
    ("tự tại bằng thân cho đến cõi Phạm thiên"). Dấu `…` ở `14.1`, `15.3`,
    `15.4`, `17.3`, `18.3` đều khớp `…pe…` của Pāli tại chính khoá đó; không có
    khoá nào có `…` mà Pāli không có. Không còn blocker nào khác; điểm số ở trên
    là điểm của lượt đọc đối kháng mới, thay cho điểm cũ.
  - >-
    **Lượt kiểm toán độc lập: 49/119 khoá được sửa, trong đó khoảng 35 khoá là
    lỗi hoặc lệch nghĩa thật, số còn lại là thuật ngữ và văn phong.** Chính: (1)
    mệnh lệnh số nhiều `vitakketha`/`pajahatha`/`viharatha` bị dịch "Ông hãy…"
    (số ít) ở `13.3`, `16.2`, `17.7`, `18.7` → bỏ "Ông", đúng với tiền lệ ps3.6;
    (2) `15.5` đánh rơi `avitakkaṁ avicāraṁ samādhiṁ samāpannassa` và thêm "của
    người khác" → trả lại "người đã chứng nhập định không tầm không tứ"; (3)
    `17.4`, `18.4` có "một chúng sinh" mà Pāli không có; (4) `18.1` "đâm thọc và
    ép buộc" (nghĩa Việt là gièm pha) cho `āsajja upanīya` → "xúc phạm và áp
    đặt" (tiền lệ mn127:17.8); (5) công thức tha tâm `itthampi te mano … itipi
    te cittaṁ` dịch ngược mano/citta ("tâm… ý") ở `9.3`, `10.2`, `11.2`, `15.2`
    → "Ý của ông… tâm của ông là như vậy", khớp dn11, dn28, ps3.6; (6)
    `vitakkayato vicārayato` bị gộp thành thứ được lan tỏa → "tầm và tứ nơi
    người đang tầm, đang tứ" (11.1, 12.1, 15.4, 15.5; tiền lệ ps3.6:3.8, 3.11);
    (7) `seyyathāpi bhavaṁ gotamo bhavaṁ cānando` bị hiểu thành "hai bậc";
    Sujato "Those such as…" → "Những vị như…" (4.4–4.5, 5.7–5.8, 6.7–6.8); (8)
    `appatthatarā ca appasamārambhatarā` "ít gánh nặng, ít dính líu" → "ít phận
    sự hơn, ít việc phải làm hơn" (4.2, 5.5, 6.5); (9) `17.2` mất chủ thể `bhotā
    gotamena` ("Được nói hay đến thế") → "Lời này được bậc Đáng Kính Gotama khéo
    nói biết bao!"; (10) `acchariyaṁ` "khó tin" → "kỳ diệu" (17.1; tiền lệ
    dn11:6.7, sn44.7, an6.52); (11) `sahadhammikaṁ pañhaṁ` "hợp pháp" → "hợp lý"
    (7.2; dn3, mn35); (12) `rājantepure` "triều đình" → "hoàng cung" (7.5, 7.6,
    7.9; mn90, mn87, sn3.20); (13) `vijjācaraṇasampanno` "minh hạnh túc đủ"
    (trùng nghĩa) → "đầy đủ minh và hạnh" (2.3; đa số trong kho) và thêm `idha`
    "Ở đây"; (14) `abhikkantatara`/`paṇītatara` "vi diệu hơn và tối thượng hơn"
    → "vượt trội hơn và thù thắng hơn" (13.6, 16.3; dn2); (15) `yajāmi` "cúng
    dường lễ hiến tế" dễ hiểu thành dâng cúng cho tăng → "cử hành lễ hiến tế"
    (1.4, 1.5); (16) công thức `amuṁ nāma vitakkaṁ vitakkessati` ("suy tư như
    thế kia") → "suy tầm một ý nghĩ như thế nọ" (12.2, 15.6, 17.5, 18.5;
    ps3.6:3.12); (17) nháy dư/thiếu ở `16.3`, `17.1` (lời Saṅgārava kéo từ 14.1
    đến 17.7) và thiếu nháy đơn quanh công thức thần thông ở `8.5` → khớp Pāli
    từng khoá; (18) uddāna `21.1`–`21.2`: thêm "khác" cho `aññataro`, "với du sĩ
    là kinh diệt tận" → "du sĩ, và Đã Diệt Tận" theo tên `an3.54`, `an3.55`.
    `8.5`, `14.2`, `17.3`, `18.3` thống nhất "tự tại bằng thân cho đến cõi Phạm
    thiên" (đa số trong dn10, dn11, ps3.6, mn108) và `parimasati` "sờ nắm" → "sờ
    chạm".
  - >-
    **Các phép đo đã chạy, ghi mẫu số.** Tập khoá Việt = tập khoá Pāli: 119/119,
    thứ tự trùng. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá: 0 lệch /
    119 khoá. `…pe…` → đúng một `…`: 5 khoá có `…pe…` ở Pāli, 5 khoá có `…` ở
    Việt, khớp từng khoá; không có `(…)` trần. Pāli trùng nguyên văn trong chính
    bài (≥ 20 ký tự): 23 cặp, 1 cặp Việt khác nhau (`12.2` và `17.5`, chỉ khác
    dấu cuối `.` và `;` do `17.6` nối tiếp). Số: `satāni` 100 / `dve` 200 /
    `tīṇi` 300 / `cattāri` 400 / `pañca` 500 → "một trăm, hai trăm, ba trăm, bốn
    trăm, năm trăm"; `anekāni satāni / sahassāni / satasahassāni` → "hàng trăm,
    hàng nghìn, hàng trăm nghìn"; ba nhiệm màu (`tīṇi`) và hai con đường
    (`dvinnaṁ`) đếm khớp. NFC, khoảng trắng thừa, khoá rỗng: 0 lỗi.
  - >-
    **Tầng tham khảo.** Bản Anh Sujato có đủ bài; Sujato **để trống** `14.2`,
    `15.2`, `15.6` (và các khoá tiêu đề cuối `20.5`–`21.4`). Ba khoá có nội dung
    đó (14.2 là câu cuối của công thức thần thông ở `8.5`; 15.2 lặp `9.3`–`9.4`;
    15.6 trùng `12.2`) được đọc kỹ từ Pāli và từ những khoá trùng nguyên văn
    trong chính bài, tự đứng vững. Tầng `vietnamese-current` không có cho bài
    này (bilara tại commit đã ghim chỉ có Pháp Cú); đối chiếu thuật ngữ Việt dựa
    vào tiền lệ trong kho (dn2, dn11, dn28, mn127, ps3.6) và `budsas.org` chỉ để
    hiểu cách đọc, không chép câu chữ. Vì thiếu bản Việt truyền thống độc lập,
    `triangulation` = 8,8.
  - >-
    **Bất định còn lại (không thêm vào thân kinh).** (a) `brahmacariyogadhaṁ`
    dịch "mục đích tối thượng của đời sống phạm hạnh" theo Sujato *supreme
    objective*; sắc thái "chìm sâu vào" của `ogadha` không có trong câu Việt.
    (b) `māyāsahadhammarūpaṁ viya khāyati` dịch "như một thứ ảo thuật"; thành tố
    `sahadhamma-` chưa phân xử được ngoài cách đọc của Sujato. (c)
    `paccanubhoti` "thọ dụng" và `kāyena vasaṁ vatteti` "tự tại bằng thân" là
    hai cách dịch có đa số khác nhau giữa cụm an3.101/an3.102/an5.23 ("thọ
    dụng", "điều ngự thân") và dn10/dn11/ps3.6 ("trải nghiệm", "tự tại bằng
    thân"); bài này giữ "thọ dụng" theo cụm AN, theo đa số cho vế sau. (d)
    `bhagavā` ở `2.3` và `bhavaṁ gotamo` đều là "bậc Đáng Kính" theo quy ước cụm
    AN (an3.75…); `bho gotama` lúc "ông Gotama" (lời Saṅgārava giữa bài) lúc
    "Tôn giả Gotama" (công thức quy y). (e) chuỗi "Thật khó tin, này ông Gotama"
    cho `acchariyaṁ, bho gotama` còn ở `an3.63` (4 khoá, ngoài phạm vi bài này),
    cần xem lại.
