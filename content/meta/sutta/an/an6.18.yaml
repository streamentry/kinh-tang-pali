notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 20/20 = 100%** (17 khoá của Sujato + 3 khoá `2.7`, `3.7`, `4.10` do lớp lấp `english-project` của dự án bù — tôi **không** dùng bản lấp ấy làm nguồn, chỉ để đối chiếu). Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ phân phối Pháp Cú cho tiếng Việt), nên `triangulation` 9.0. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **23 khoá có PĨI TRÙNG NGUYÊN VĂN ở bài khác; 18 cặp dùng lại NGUYÊN VĂN.** `0.2` = `an6.14:0.2` (2. Phẩm Hòa Kính) · `1.1` = `an5.180:1.1` · `1.4` = `dn14:1.14.2` · `1.6` = `dn16:3.39.5` · `2.1`–`2.3` và `4.1`–`4.2` = `mn129:9.2` / `an5.178:1.2` · `2.4`–`2.6`, `3.4`–`3.6`, `4.7`–`4.9` = `dn15:4.4` / `mn22:22.4` / `an5.178:1.7` · `2.8`, `3.8`, `4.11` = `dn14:1.27.3` · `4.17` = `sn38.8:1.14`.
  **`Sādhu, bhikkhave.` tôi dịch *Lành thay, các tỳ-kheo!*** 16 bản trùng nguyên văn chia ba: *Tốt lắm, này các tỳ-kheo!* (mn70, mn38), *Lành thay, các tỳ-kheo!* (mn22:22.4), *Tốt đẹp, này các tỳ-kheo.* (sn22.119:1.5). Tôi theo *Lành thay* vì đây là **Đức Thế Tôn công nhận câu trả lời đúng** của các tỳ-kheo, và vì `sn45.179` cũng đã chốt *Lành thay* cho `Sādhu` trong cùng bộ. `No hetaṁ, bhante.` → *Bạch Thế Tôn, không.* (216 bản trùng nguyên văn, `dn15:4.4`).
  **Thuật ngữ mới, nhiều chỗ 0 tiền lệ, đặt kèm lý do.** `macchika` và `macchabandha` (0 bản trong tầng) → *kẻ buôn cá* và *người bán cá*; giữ cả hai từ vì Pāli dùng cả hai, và `macchika` chỉ nghĩa nghề *đi bán cá* còn `macchabandha` là *người bán* · `goghātako` → *một người giết bò*, `orabbhiko` → *một kẻ giết cừu*, `sūkariko` → *một kẻ giết heo*, `sākuṇiko` → *một kẻ giết gia cầm*, `māgaviko` → *một người săn thú* (theo `mn51:9.2` và `mn94:11.2`, 19 bản cho `goghātako`) · `hatthiyāyī / assayāyī / rathayāyī / yānayāyī / bhogabhogī` — **0 bản trong toàn tầng**, tôi dịch *đi voi, đi ngựa, đi xe ngựa, đi xe cộ, hưởng thọ phú tài* · `bhogakkhandhaṁ ajjhāvasati` → *được sống trên một khối tài sản lớn* (`bhogakkhandha` theo `dn33:2.1.48`) · `vajjhe vadhāyupanīte` → *bị dẫn đến chỗ sát hại* · `pāpakena manasānupekkhati` → *đối xử với chúng bằng tâm ác*; 11 bản có `manasānupekkhati` nhưng theo nghĩa khác (dn33 dịch *dùng tâm suy lường, suy xét pháp*, vì ở đó nó đi kèm `anuvitakketi anuvicāreti`), nên tôi dịch theo nghĩa ở đây và **ghi rõ là không có tiền lệ đúng nghĩa** · `tiracchānagate pāṇe` → *loài vô hình* (`mn142:6.1`) · `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ` → *cảnh giới mất, cõi dữ, chỗ đọa đau, địa ngục* (`an10.21:11.1`) · `dīgharattaṁ` → *lâu dài* (212 bản) · `Ko pana vādo` → *còn tệ hơn biết bao*.
  **Nhãn kép ở tầng Pāli — ghi lại chứ không sửa.** Nháy `“` của Pāli ở bài này **không cân** (9 mở, 5 đóng): `1.5`–`2.5` đánh dấu từng lượt thoại nhưng `3.1` và `4.1` thì không. Tôi theo khuôn của `an5.178` (bài cùng công thức hỏi–đáp–`Sādhu`–`kissa hetu`, Pāli trùng nguyên văn ở `2.2` và `2.6`) và **tự cân ngoặc trên toàn bài**: mỗi lượt thoại của Đức Thế Tôn và các tỳ-kheo có một `“` và một `”` khớp nhau. Đây là chuẩn hóa biên tập ở mức dấu câu, **không thêm hay bớt chữ nào của Pāli**.
  **Dấu lược.** `4.3`, `4.4`, `4.5` giữ đúng một dấu `…` mỗi khoá (`…pe…` lược sáu loài thú trước `4.6`); không mở rộng. Sujato ở `4.3`–`4.5` dịch đủ *"of a butcher of sheep / pigs / poultry …"* — tôi giữ lược theo Pāli.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
