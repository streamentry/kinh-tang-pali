notes:
  - >-
    **Mười điều, mỗi điều một segment, mỗi điều là một câu tự vấn trong ngoặc
    kép** — và **điều thứ tám tràn sang hai segment** (`8.1` + `9.1`), vì Pāli
    cũng vậy. Đó là lý do mười điều nằm ở mười một khoá.
  - >-
    **Bốn chỗ bản đầu sai nghĩa, đều do đọc sai một từ, đều đã sửa.**
    (1) **`Vevaṇṇiyamhi ajjhupagato` → *Tôi đã đạt được sự không bị chê trách***
    (0 segment, đặt mới): bản đầu tôi dịch *Tôi đã quy về việc giữ mình nghiêm
    túc* — **không dịch `vevaṇṇiya` (không bị chê trách) cũng không dịch
    `ajjhupagata` (đã đạt được)**. Hệ quả nằm ngoài bài này: `an10.101:1.3`
    (**đã `published`**) có đúng lỗi ấy vì cùng cụm Pāli; xem `docs/translation-
    notes/vevanniya-ajjhupagata.md`.
    (2) **`Kathaṁbhūtassa me rattindivā vītivattantī` → *Trong khi đêm ngày của
    tôi trôi qua, tôi trở thành người thế nào***: bản đầu tôi viết *Những đêm
    ngày đã qua của tôi có trôi qua vô ích không ạ* — đọc `kathaṁbhūta` thành
    *vô ích* và **lạm dụng dấu hỏi**. Sujato cũng đọc là *what sort of person am
    I becoming*. Đã sửa.
    (3) **`…maṁ anuvicca viññū sabrahmacārī … na upavadantī` → *sau khi xem xét
    kỹ, không chê trách tôi***: bản đầu viết *…cũng không có lỗi lầm về giới của
    tôi* — biến **mệnh đề bị chê trách** thành **mệnh đề có lỗi lầm**, đảo cả
    hai bên. Đã sửa.
    (4) **`añño me ākappo karaṇīyo` → *Thái độ của tôi phải khác***: bản đầu
    thêm *Còn … thì*, vốn không có trong Pāli. Đã bỏ. Cùng lý do với
    `Parapaṭibaddhā me jīvikā` → *Sinh kế của tôi phụ thuộc vào người khác* (bản
    đầu *sinh tài*).
  - >-
    **`Nānābhāvo vinābhāvo` → *xa cách, phân ly*** (0 segment, đặt mới): bản đầu
    viết *sẽ khác biệt, sẽ ly tán* — *khác biệt* không làm chủ ngữ được. `uttari
    manussadhammo` → *điều vượt tầm con người*; `puṭṭho na maṅku bhavissāmī` →
    *tôi không xấu hổ*: `maṅku` là **xấu hổ**, không phải *hối tiếc* như bản
    đầu; `dhp249:3` đã dịch `maṅku` là *bất mãn*, cùng họ đào ngược, nên ở đây
    lấy nghĩa xấu hổ. `suññāgāre abhiramāmī` → *tôi thật thích an trú trong nhà
    trống* (bản đầu có thêm *sẽ*, không có trong Pāli).
  - >-
    **`paccavekkhitabbaṁ` giữ đủ ở cả mười mục** → *vị xuất gia nên thường xuyên
    xem xét*, dù Sujato ở bản Anh bỏ bớt; đây là mệnh đề có trong Pāli từng mục,
    bỏ thì mất chủ ngữ. `pabbajita` → *vị xuất gia* (tiền lệ chương 1–4). **Câu
    mở `Ime kho, bhikkhave` giữ *Này các tỳ-kheo***: 101 segment trong corpus có
    cụm này, **98** mở bằng *Này các tỳ-kheo*; bản đầu tôi mở *Đây là* — lệch
    chuẩn corpus, đã sửa.
