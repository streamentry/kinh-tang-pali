notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an5.44:2.1, 3.1, 4.1, 5.1, 6.1, 7.1 — «con đã được nghe chính tai Đức Phật, đã được thọ lãnh chính tai» → «con đã nghe ngay trước mặt Đức Phật, đã thọ trì ngay trước mặt Đức Phật». Vì sammukhā là «trước mặt, có mặt trực tiếp», không phải «chính tai», và «chính tai» đặt cạnh paṭiggahita (thọ trì) làm lệch nghĩa; «ngay trước mặt» là cách chiếm đa số của cùng công thức (18/29 khoá Pāli trùng, gồm mn123). Ngoặc kép mở giữ nguyên như Pāli.
