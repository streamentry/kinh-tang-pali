notes: |-
  **Cổng kỹ thuật của kho CHƯA chạy.** Lượt dịch này bị cấm chạy `npm run validate`, `npm test`, `npm run check` và `npm run build`; bốn lệnh đó để người điều phối chạy, nên `technical_integrity` đặt 9.6 chứ không phải 10.0 và **không** tuyên bố technical gate pass.

  **Phạm vi và kiểm cơ học.** Bài đủ 88 khoá, đúng thứ tự khoá Pāli, không khoá nào ngoài tập Pāli. Tự kiểm trên mọi khoá (kể cả khoá ngắn hơn 40 ký tự; 72/88 khoá Pāli đạt ngưỡng 40 nếu tính cả khoảng trắng cuối, 71/88 nếu cắt khoảng trắng, khác nhau ở khoá `17.1` đo đúng 40 ký tự gồm một khoảng trắng cuối): tập khoá khớp 88/88; nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá (0 lệch trên 88; Pāli giữ lời Đức Phật mở ở `5.1` và đóng ở `44.1`, lời Cunda mở ở `45.2` và đóng ở `45.3`, nên các khoá giữa không có nháy kép); khoá Pāli có `…pe…` (1 khoá, `45.2`) có đúng một `…` ở bản Việt, Pāli không có `…` trần, không có `(…)`; NFC; không khoá rỗng; không Pāli lọt sang bản Việt ngoài tên riêng Jāṇussoṇi và Pāvā. Đã in và đọc đối chiếu cặp Pāli↔Việt từng khoá.

  **Pāli trùng nguyên văn.** Trong chính bài: 1 nhóm Pāli trùng nguyên văn (`22.2` = `43.2`, *Taṁ kissa hetu?*), 0 nhóm mà bản Việt khác. Hai nửa phủ định và khẳng định (`17.2`–`22.3` và `38.2`–`43.3`, `10.2` và `29.2`, `14.2` và `34.2`) không trùng nguyên văn vì có `na`/`an-`, nên bản Việt khác là đúng. Với bài khác: 12 khoá có Pāli trùng nguyên văn ở bài khác đã có bản Việt, 1.946 cặp, trong đó 741 cặp bản Việt khác; phần lớn là công thức mở và đóng (`1.1`, `4.3`, `22.2`, `45.4`) có nhiều cách diễn đạt không thống nhất trong tầng. Đã dùng dạng đa số hoặc dạng sát nhất: `1.1` *Tôi nghe như vầy.* (229/439); `22.2`, `43.2` *Vì sao vậy?* (333/496); `45.4` *Thứ mười.* (270/275); `0.2` giữ *17. Phẩm Vua Jāṇussoṇi* (9/9); `0.3` *Kinh Cunda* (3/3); `45.2` *Thật vi diệu thay, bạch Thế Tôn! …* (2/2). `4.3` dùng *Đức Thế Tôn nói:* (26/221 trên toàn tầng, trong khi *Đức Phật nói:* 116/221; trong `an10` là 9 khoá *Đức Thế Tôn nói:* so với 7 khoá *Đức Phật nói…*), vì thân bài dùng *Đức Thế Tôn* nhất quán (`1.2`, `1.3`, `4.2`, `45.1`). `31.1`, `36.1`, `36.2` có Pāli trùng với `an10.217:26.1`, `an10.211:21.1`, `an10.211:21.2`; các bản Việt đó viết theo lối khác hẳn (*Là người có chánh kiến, không nhìn ngược…*), nên bài này theo đúng khuôn của các đoạn song song ở `mn41` (`mn41:13.4`, `mn41:14.4`, `mn41:14.5`) thay vì chép lại. Các đoạn dài `7.1`, `8.1`, `10.2`, `11.1`, `12.1`, `13.1`, `26.1`, `27.1`, `29.2`, `30.1`, `31.1`, `32.1`–`32.2`, `16.2`, `36.2` đối chiếu và lấy khuôn từ các đoạn song song `mn41:8.2`–`mn41:14.5` và `mn114`, nhưng Pāli ở đây khác chút ít ở dấu câu hoặc ở `kho pana`, nên không phải trùng byte và được viết lại thay vì chép.

  **Số Pāli.** `tividhaṁ` = ba (`5.1`, `5.3`, `6.1`, `9.1`, `14.1`, `16.3`, `24.1`, `24.3`, `25.1`, `28.1`, `34.1`, `37.1`); `catubbidhaṁ` = bốn (`5.2`, `10.1`, `13.2`, `24.2`, `29.1`, `33.1`); `dasa` = mười (`17.1`, `17.2`, `22.3`, `23.1`, `38.1`, `38.2`, `43.3`, `44.1`); `sāyatatiyakaṁ` (`2.8`, `22.1` ×2, `43.1` ×2) dịch *ba lần, kể cả buổi tối* (xem bất định). Danh sách người nữ được bảo hộ ở `8.1` và `27.1` có 8 hạng (mẹ, cha, cả cha mẹ, anh em trai, chị em gái, thân quyến, dòng họ, Pháp) rồi mới đến ba hạng sau (`sasāmikā`, `saparidaṇḍā`, `mālāguḷaparikkhittā`); đã đếm bằng Pāli, khớp. Đã đối chiếu máy từng khoá có số: 0 lệch giữa số trong Pāli và số trong bản Việt.

  **Thuật ngữ và tiền lệ đã đo.** `soceyya`/`asoceyya`, `suci`/`asuci` → *trong sạch* / *không trong sạch* (tầng: *trong sạch* ở `dn33`, `an2.167`, `ud6.2`, `cp29`; *thanh sạch* ở `an3.120`, `an3.121`, `an4.192` khoảng 14 khoá; *thanh tịnh* 8 khoá; chọn *trong sạch* vì tự nhiên khi đối lập với *không trong sạch* và dùng được cho cả phép lễ lẫn nghiệp đạo; chưa có một dạng đa số trong `an10`). `soceyyāni` số nhiều (`1.4`, `1.5`, `2.1`, `2.9`, `3.1`) → *những phép trong sạch*; `soceyyaṁ` số ít trong Luật của bậc Thánh → *sự trong sạch*. `kāmesumicchācārī` → *hành tà dâm trong các dục* (trong `an10`: *tà dâm* 33 khoá so với *tà hạnh* 2 và *hành dâm* 4; toàn tầng *tà hạnh* 89, *tà dâm* 74, *hành dâm* 43). `pisuṇavāco` → *nói hai lưỡi* (`an10` 32/37; toàn tầng 100/171). `samphappalāpī` → *nói lời phù phiếm* (`an10` 27/37; toàn tầng 112/156). `pharusavāco` → *nói lời thô ác* theo đúng khuôn câu song song `mn41:9.4`, `mn42:9.4`, `mn114:6.11` (trong `an10` có *ác khẩu* 11 khoá so với *nói lời ác* 3; giữ *nói lời thô ác* vì đó là Pāli trùng với khuôn đã dùng và đọc rõ hơn). `abhijjhālu` → *tham lam* (`an` 50, *tham dục* 10). `byāpannacitto` → *có tâm sân hận* (`an` 26, *tâm sân* 14, *ác ý* 2; khuôn `mn41:10.3` dùng *ác ý*, nhưng chọn dạng đa số của bộ). `kammapatha` → *nghiệp đạo* (11 khoá trong tầng, dạng *nghiệp đạo bất thiện* / *nghiệp đạo thiện* ở `dn33`, `dn34`, `dn26`). `nihitadaṇḍo nihitasattho` → *đã bỏ gậy và gươm* (*bỏ gậy* 15 khoá, *đặt gậy* 6 trong 27 khoá có Pāli này; *vũ khí* ở `mn41`, `mn42`, *gươm* ở `an8.43`, `an3.70`, `dn8`). `tiracchānayoni paññāyati` … `duggatiyo` → theo đúng khuôn của `an6.39:1.11` (Pāli trùng) *xuất hiện*, *loài súc sinh*, *cõi đọa xứ*. `dhammarakkhitā` → *được Pháp bảo hộ* (4 khoá `mn114`, so với *bảo hộ theo quy ước hay phép tắc* 2 khoá `mn41`). `mālāguḷaparikkhittā` → *đeo vòng hoa đính ước* (10 khoá có Pāli này; *đính ước* 6). `sahabyataṁ` không có trong bài. *bà-la-môn*, *sa-môn* viết thường nhất quán với `an10.177` và `mn41`. `pacchābhūmakā kamaṇḍalukā sevālamālikā … udakorohakā` → *các bà-la-môn miền tây mang bình nước, đeo tràng hoa rong rêu, …, ngâm mình trong nước*, theo `sn42.6:2.1` (cùng nhóm bà-la-môn, Pāli cùng gốc nhưng khác thứ tự) với một chỗ khác: `udakorohakā` dịch *ngâm mình trong nước* theo `mn40:5.4`, không phải *xuống nước tẩy tịnh* của `sn42.6` vì Pāli không nói mục đích tẩy tịnh. `ariyassa vinaye` → *giới luật của bậc Thánh* (47 khoá). `Cunda kammāraputta` → *Cunda con thợ rèn* (8 khoá có Cunda con thợ rèn ở `dn16`).

  **Tiêu đề.** `0.2` *17. Phẩm Vua Jāṇussoṇi* giữ nguyên theo tầng (9/9 khoá đã có), dù Pāli chỉ có `Jāṇussoṇivagga` và Sujato dịch *With Jānussoṇi*, không có chữ *vua*; đó là vấn đề tên phẩm của tầng, ghi lại để người biên tập quyết, **không** sửa ở đây. `0.3` *Kinh Cunda* (Pāli `Cundasutta`; `sn47.13:0.3` cùng dạng). `0.1` dùng *Kinh Tăng Chi Bộ 10.176* (143 khoá dạng này so với 24 khoá dạng *Aṅguttara Nikāya*, dù `an10.171` cùng phẩm đang dùng dạng sau).

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh.**
  · **`sāyatatiyakaṁ` (`2.8`, `22.1`, `43.1`).** Dịch *ba lần, kể cả buổi tối*, theo Sujato (*three times, including at dusk*) và theo tiền lệ `dn8`, `dn25` (13 khoá có Pāli này, 8 khoá viết *kể cả buổi tối*, cả 13 viết *ba lần*). Bản Thích Minh Châu nguyên bài ở mục Tra cứu toàn văn đọc *lần thứ ba vào buổi chiều* (xuống nước một lần vào buổi chiều, tính là lần thứ ba trong ngày); hai cách đọc đều có thể bảo vệ từ cấu tạo `sāyaṁ` + `tatiyaka`, chưa phân xử được bằng Pāli một mình.
  · **`sevālamālikā` (`1.5`, `2.1`, `2.2`, `2.9`, `3.1`).** Dịch *đeo tràng hoa rong rêu* theo `sn42.6:2.1` (cùng nhóm bà-la-môn) và `sn46.55:8.1` (`sevāla` = *rong rêu*). Sujato dịch *aquatic flowers* (hoa thủy sinh), Thích Minh Châu dịch *vòng hoa huệ*; `sevāla` là cây hay rêu sống dưới nước, nghĩa chính xác của loại nào chưa phân xử được, nên chọn dạng đã có tiền lệ trong tầng.
  · **`dhammarakkhitā` (`8.1`, `27.1`).** Dịch *được Pháp bảo hộ* theo tiền lệ `mn114` (4 khoá); Sujato dịch *protected on principle*, `mn41` dịch *bảo hộ theo quy ước hay phép tắc*. Ý hiểu chính xác (người nữ được bảo hộ bởi một đoàn thể tôn giáo, bởi một nguyên tắc, hay bởi bổn phận) chưa phân xử được bằng Pāli.
  · **`mālāguḷaparikkhittā` (`8.1`, `27.1`).** Chữ *đính ước* không có trong Pāli: đó là cách hiểu truyền thống mà cả Sujato (*as a token of betrothal*) và tiền lệ `mn41:8.4`, `mn114` đều mang; giữ theo tiền lệ, người đọc nên biết đây là chú giải đã đi vào bản dịch.
  · **`bajjhantu` (`15.1`).** Pāli đã ghim đọc `bajjhantu` (*bị trói*), tiền lệ `an10.211:9.1` dịch *bị trói*. Sujato dịch *slaughtered* (giống `mn41:10.3`, Pāli `vajjhantu`); cách đọc đó không có trong Pāli của `an10.176`, nên giữ *bị trói* theo Pāli.
  · **`abyāpajjā` (`35.1`).** Dịch *không bị tổn hại* theo khuôn `mn41:14.3` (`abyābajjhā`); Sujato dịch *free of … ill will*. Hai cách đọc (không gây hại / không bị hại) khác nhau về hướng; theo tiền lệ.
  · **`34.2` *không nghĩ*.** Pāli `taṁ anabhijjhitā hoti: ‘aho vata …’ti` đặt lời nguyện ngay sau `anabhijjhitā` không có `na` riêng; dịch *không tham muốn tài sản … , không nghĩ: ‘Ước gì …’* theo `mn41:14.2`. Sujato giữ nguyên dấu hai chấm không thêm *không nghĩ*; nghĩa không đổi nhưng chữ *không nghĩ* là cách đọc của tiền lệ.
  · **`paññāyati` (`23.1`, `44.1`).** Dịch *xuất hiện* theo `an6.39:1.11` (Pāli trùng nguyên văn ở vế sau); Sujato dịch *are found*. Trong tầng, `paññāyati` ở nơi khác thường dịch *được thấy* (75 khoá) hoặc *được biết* (15 khoá); chọn *xuất hiện* vì tiền lệ gần nhất cùng công thức *nirayo paññāyati …*.
  · **`kassa no` (`1.4`).** Đọc `no` là `nu` (*của ai vậy*) theo Sujato (*whose purity*); Thích Minh Châu dịch *trong những tịnh hạnh của ai*. Dịch *Này Cunda, ông ưa thích những phép trong sạch của ai?*.
  · **`anuppadātā` (`11.1`, `30.1`).** Dịch *khuyến khích* (nghiêng về chia rẽ) và *củng cố* (nghiêng về hòa hợp) theo `mn41:9.3`, `mn41:13.3`; Sujato dùng *supporting* cho cả hai. Cùng một danh từ nên hai vế dùng hai động từ khác nhau theo ngữ cảnh (đây là lựa chọn biên tập của `mn41`, không phải hai nghĩa Pāli).
  · **`atthavādī` (`32.1`).** Dịch *nói điều có ích*, đối với `anatthavādī` (`13.1`) *nói điều vô ích*, để giữ cặp đối lập; `mn41:13.5` dịch *nói điều có ý nghĩa*, Sujato dịch *meaningful*. `attha` vừa là *nghĩa* vừa là *lợi ích*; chọn *có ích* vì đi cùng `atthasaṁhitaṁ` (*đem lại lợi ích*) ở `32.2`.
  · **`ehambho purisa` (`10.2`, `29.2`) và `ambho purisa` (`2.3`).** Dịch *Này người kia* ở khoá làm chứng (khớp `mn41:9.2`, `an3.28`) và *này anh* ở lời dặn đệ tử (khớp `dn19:30.2`, `dn19:35.2`); cùng một từ gọi nhưng khác bối cảnh.

  **English tham khảo.** Sujato có bản đầy đủ cho bài này (88 khoá, 87 khoá có chữ; chỉ `45.4` rỗng vì là chữ kết). Mẫu số coverage = 72 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`; 71 nếu cắt khoảng trắng cuối ở `17.1`); Sujato phủ 72/72 = 1.00 (và 71/71), nên cổng coverage không chặn. Lớp `english-project` không có tệp cho bài này, nên 100% là từ Sujato độc lập, không có phần nào do dự án tự lấp. Tầng `vietnamese-current` chỉ có Pháp Cú tại commit đã ghim, nên vắng với bài này; bản Thích Minh Châu nguyên bài có ở mục Tra cứu toàn văn nhưng không căn theo khoá, dùng để đối chiếu thuật ngữ và mạch văn chứ không tính vào coverage. Đã đối chiếu Sujato ở những chỗ lệch: Sujato dịch `bajjhantu` theo `vajjhantu` (xem trên), bỏ chữ `no` trong `1.4` (*whose purity*), đọc `sāyatatiyakaṁ` là *three times, including at dusk*; Thích Minh Châu dịch `kassa no` thành *trong những tịnh hạnh của ai* (xem trên). Không khoá nào phải dựa Pāli một mình.
