notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** `13.1` và `14.1` rút bớt danh sách dài 425 và 440 ký tự Pāli xuống 111
  và 134 ký tự bằng dấu `…` bịa, mất khoảng hai mươi lăm phẩm chất mỗi khoá; Pāli hai
  khoá đó viết đủ, không có `…pe…`. Đã viết lại hai khoá, dùng nguyên văn danh sách đã
  dịch ở `11.1` và `12.1` (kèm sửa hai lỗi thiếu dấu cách *bất định,nhiều* và
  *khôngnhiều* ở hai khoá đó). Ngoài ra mười hai khoá `4.3`–`4.5`, `5.3`–`5.5`,
  `7.3`–`7.5`, `8.3`–`8.5` có dấu `…` thừa ở cuối trong khi Pāli không lược gì;
  đã bỏ.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Hòa thượng Thích Minh Châu, đồng thời đọc lại bản Anh Sujato đã ghim (bài này có bản Anh) và Pāli. 8 nhóm khoá bất đồng nghĩa → sửa 5 nhóm (24 khoá), giữ 2, bất định 1. Sửa: (1) `4.1`, `4.7`, `5.1`, `5.7`, `7.1`, `7.7`, `8.1`, `8.7` `upadahātabbo`: *nên được khiển trách về sự hối tiếc* (5.x, 7.x) sai nghĩa và *nên được an ủi về sự không hối tiếc* (4.x, 8.x) thêm nghĩa → *nên được làm cho hối tiếc* / *nên được làm cho không hối tiếc*, vì `vippaṭisāro` / `avippaṭisāro upadahātabbo` là làm cho hối tiếc / không hối tiếc phát sinh, không có việc khiển trách hay an ủi (bản nguyên bài dịch là sắp đặt cho hối tiếc); cùng khoá `7.1`, `7.7`, `8.1`, `8.7` đổi *chơn pháp* → *đúng pháp* (445 khoá *đúng pháp* so với 7 khoá *chơn pháp* trên tầng; đối ngẫu của *phi pháp*). (2) `2.5`, `3.1`, `4.5`, `5.5`, `6.1`, `7.5`, `8.5`, `9.3` `anatthasaṁhita`: *gây hại* → *không mang lại lợi ích*, vì Pāli là không gắn với lợi ích, không phải gây hại; tầng dịch đúng như vậy ở hơn 50 khoá (mn139, dn29, mn58, an6.30, sn56.11…) và bản nguyên bài dịch không liên hệ đến lợi ích; bản Anh dịch *harmfully* nhưng Pāli phân xử theo nghĩa chữ. (3) `12.1`, `14.1` `okkamane nikkhittadhurā paviveke pubbaṅgamā`: *không đi đầu trong sự thoái lui, không bỏ rơi sự viễn ly* → *bỏ rơi sự thoái lui, đi đầu trong sự viễn ly*, vì Pāli là thế đối lập của `11.1` chứ không phải phủ định từng vế, theo tiền lệ `an2.44:2.4`, `an5.156`, `an3.95`. (4) `14.1` `kulaputtā`: *người nam cư sĩ* → *thiện gia nam tử*, theo `12.1` cùng bài (người đã xuất gia không phải cư sĩ). (5) `9.3`, `9.5`–`9.10`: *ta* → *tôi*, vì đây là lời Sāriputta nói với các tỳ-kheo về chính mình (`ahampi`, `mayi`), cùng người nói và cách xưng với `3.1`. Giữ: `3.1`, `6.1` `kupita` *bực bội* (bản nguyên bài dịch *phản ứng*, không đủ nghĩa; Pāli là nổi giận/bực), và `dosantara` *tâm sân giấu kín* (bản nguyên bài dịch *sân tâm*; bản Anh *secret hate*; tầng dịch `an2.22:1.3` *sân hận bên trong*, nên `antara` = bên trong, còn *giấu kín* là cách đọc thêm một chút). Bất định: `10.1`, `11.1`, `12.1` `padakkhiṇaṁ gaṇhanti` — *nhận lãnh một cách cung kính* (bản Anh *respectfully*) so với *nắm được vấn đề* của bản nguyên bài; không phân xử được. Cũng chưa phân xử: `9.2` `akuppa` *tâm không xao động* (bản Anh *even temper*; bản nguyên bài *bất động*) và `2.3` `abhūta` *giả dối* (nghĩa Pāli là không có thật, `giả dối` hơi nghiêng về ý lừa). Chỗ giống hệt ở bài khác chưa sửa: `an10.44:7.5` còn *gây hại* cho `anatthasaṁhita`. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá.
