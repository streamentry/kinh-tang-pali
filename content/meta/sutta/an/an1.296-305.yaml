notes:
  - >-
    **Một catalog uid gộp MƯỜI bài, nhưng tệp Bilara chia làm hai phần với hai
    tiền tố khác nhau**: `an1.296:*` (7 khoá, có `0.1`/`0.2` rồi `1.0`) và
    `an1.297-305:*` (6 khoá). Xem ghi chú riêng bên dưới về việc 6 khoá sau bị
    chặn bởi bộ kiểm tra.
  - >-
    ⚠ **Hàng đợi đếm `an1.296-305` là 7 segment, không phải 13** —
    `segmentMapForUid` giải dải theo từng bài thật nên không thấy
    `an1.297-305:*`. Tôi vẫn dịch đủ 13, vì để 6 khoá Pāli có thật ở trạng thái
    không có bản dịch thì tệ hơn là dịch đủ; con số trong PR ghi rõ phần nào do
    hàng đợi đếm và phần nào không.
  - >-
    **Dùng lại nguyên văn đã `published`:** dây chuyền chánh tám pháp — *chánh
    kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn,
    chánh niệm, chánh định, chánh trí, chánh giải thoát* (`an10.103:2.3`) · năm
    căn *Tín căn, tinh tấn căn, niệm căn, định căn* (`an4.151:1.3`) · `Idha,
    bhikkhave, X viharati` → *Ở đây, này các tỳ-kheo, có X sống…*
    (`an3.116:1.3`) · `Ayaṁ vuccati, bhikkhave, X` → *Đây, này các tỳ-kheo, được
    gọi là X* (`an3.117:1.6`) · `vipatti` → *sự thất nghiệp* (`an3.117:1.1`) ·
    `sīlasampadā` → *thành tựu về giới* (`an3.117:5.1`) · `sagga` → *cõi trời* ·
    `tiracchānayoni` → *cõi địa ngục sinh ra từ sự tiếp xúc* và `pettivisaya` →
    *cõi thân thuộc* (PR #117) · `savitakka`/`savicāra` → *tán chương và cân
    nhắc* (`sn40.11:7.1`) · `Issariyabala` → *sức mạnh của bậc chúa tể* (chương
    8) · `tāyati` → *làm hại* (`an10.73`) · `bhaṇanti` → *hạng người*
    (`sn11.24:2.1`) · `asubha` → *bất thiện* (`an10.59:1.3`) · `Sāvatthinidānaṁ`
    → *Tại Sāvatthī.* (`an4.51:1.1`) · `anabhiratasaññā` → *niệm tưởng không ham
    muốn trong tất cả thế gian* (`an10.238`).
  - >-
    `Buddhānussati` → *sự nhớ tưởng về Đức Phật*; chín mục còn lại trong
    `an1.297-305:1.3` (`dhammānussati`…`upasamānussati`) là **chín thuật ngữ 0
    tiền lệ, đặt mới**: *sự nhớ tưởng về Pháp / Tăng đoàn / giới / sự cho / chư
    thiên*, *sự tỉnh giác về hơi thở / sự chết / điều thân đang làm*, *sự chân
    nhận có nhớ tưởng*.
  - >-
    `ekantanibbidāya` → *chán ngại hoàn toàn* (`an10.1:10.1` *sự chán ngại*) ·
    `virāgāya` → *ly tham* · `nirodhāya` → *diệt tận* · `upasamāya` → *chân
    nhận* · `sambodhāya` → *chứng ngộ* (0 tiền lệ cho ba sau).
  - >-
    **Quy tắc dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
    `published` có `…` trong Pāli, chỉ 617 (40%) giữ đúng số, và cặp lệch phổ
    biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` → `…`). Quy tắc là
    **có/không có `…` phải khớp theo từng segment**.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ và Tăng Chi Bộ Lớn không có bản
    Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp
    upstream, đã ghi ở `content/meta/reference-gaps.yaml`.
  - >-
    **⚠ SÁU KHOÁ PĀLI CÓ THẬT MÀ KHÔNG DỊCH ĐƯỢC, VÀ ĐÂY KHÔNG PHẢI LỰA CHỌN CỦA
    TÔI.** Tệp Bilara `an1.296-305_root-pli-ms.json` có **13** khoá: `an1.296:*`
    (7 — `0.1`, `0.2`, `1.0`, `1.1`–`1.4`) và `an1.297-305:*` (6 — chín bài
    `an1.297`–`305` gộp chung **một** vế kệ: `1.0`–`1.5`).
  - >-
    Tôi đã dịch đủ 13 khoá ở bản đầu, rồi `npm run validate` từ chối:
    `an1.297-305:1.5 has wrong UID prefix` và `orphan segment an1.297-305:1.5
    does not exist in pinned Pāli source`. Bộ kiểm tra chỉ công nhận tiền tố
    `an1.296`, nên 6 khoá kia không thể tồn tại hợp lệ trong kho. Tôi **xoá**
    chúng thay vì đẩy một trạng thái làm `validate` đỏ lên lịch sử.
  - >-
    Hệ quả thành thật: chín thứ được nhớ tưởng trong `an1.297-305:1.3` — *sự nhớ
    tưởng về Pháp, về Tăng đoàn, về giới, về sự cho, về chư thiên; sự tỉnh giác
    về hơi thở, về sự chết, về điều thân đang làm; sự chân nhận có nhớ tưởng* —
    **chưa** có bản Việt. Bản dịch tôi đã soạn cho chúng bị huỷ, không được đưa
    vào kho, và phải làm lại khi công cụ chấp nhận tiền tố này. Đây là việc còn
    dở, không phải việc đã xong.
  - >-
    Con số hàng đợi (7 segment) khớp đúng số khoá còn lại, nên khoản này không
    làm sai số đo.
