notes:
  - >-
    Bản **song song** của `an10.38` với Ānanda thay Upāli, cộng sáu câu ca ngược
    lại và mục `Tassuddānaṁ`.
  - >-
    **Sáu câu ca là hình ảnh trái ngược của `an10.39`**: chia rẽ → đọa ngục, còn
    hòa hợp → *an vui trong cõi trời suốt một kiếp*. Giữ đúng cặp nghịch đảo để
    hai bài đọc như hai mặt của một đồng xu.
  - >-
    `puññaṁ pasavati` → **"sinh ra công đức"** theo `an3.150:2.1`; `brahmaṁ`
    (giống `brahmacariya`) → *công đức* theo cùng câu đó.
  - >-
    **`Tassuddānaṁ` → "Tóm lược:"** theo 133 segment tiền lệ. Bốn vế tục ca điểm
    danh mười bài theo thứ tự Pāli: Upāli · trục xuất · đắc bội quần / thành tựu
    · khuyến khích / tỳ-kheo tân · hai bài chia rẽ / cùng hai bài Ānanda.
    `Upālivaggo catuttho.` → "Phẩm Upāli, thứ tư."
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
