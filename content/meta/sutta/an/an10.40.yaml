notes:
  - >-
    Bản **song song** của `an10.38` với Ānanda thay Upāli, cộng sáu câu ca ngược
    lại và mục `Tassuddānaṁ`.
  - >-
    **Sáu câu ca là hình ảnh trái ngược của `an10.39`**: chia rẽ → đọa ngục, còn
    hòa hợp → *an vui trong cõi trời suốt một kiếp*. Giữ đúng cặp nghịch đảo để
    hai bài đọc như hai mặt của một đồng xu.
  - >-
    `puññaṁ pasavati` → **"sinh ra công đức"** theo `an3.150:2.1`; `brahmaṁ`
    (giống `brahmacariya`) → *công đức* theo cùng câu đó.
  - >-
    **`Tassuddānaṁ` → "Tóm lược:"** theo 133 segment tiền lệ. Bốn vế tục ca điểm
    danh mười bài theo thứ tự Pāli: Upāli · trục xuất · đắc bội quần / thành tựu
    · khuyến khích / tỳ-kheo tân · hai bài chia rẽ / cùng hai bài Ānanda.
    `Upālivaggo catuttho.` → "Phẩm Upāli, thứ tư."
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    Sửa lan 2026-10-13 (accuracy fix): khoá an10.40:1.3 — Pāli `adhammaṁ adhammoti
    … avinayaṁ avinayoti … abhāsitaṁ alapitaṁ tathāgatena abhāsitaṁ alapitaṁ
    tathāgatenāti … paññattaṁ tathāgatena paññattaṁ tathāgatenāti dīpenti` (gọi
    cái nào đúng như cái ấy, bốn cặp sau cùng đều đối xứng). Trước: “gọi phi vinh
    là phi vinh, gọi vinh là vinh pháp, gọi điều Thế Tôn đã nói là điều Ngài đã
    nói, gọi điều Ngài đã nói là điều Ngài đã nói, gọi điều Tathagata chưa tuyên
    thuyết…” — chữ `vinaya` thành “vinh”, `tathāgata` để rời dạng Pāli không dấu,
    vế `abhāsita` bị dịch thành “đã nói”, và cặp `anāciṇṇa`/`āciṇṇa` bị bỏ. Sau:
    phi luật là phi luật, luật là luật; điều Thế Tôn chưa nói / đã nói; chưa thực
    hành / đã thực hành; chưa quy định / đã quy định, mỗi vế đúng như Pāli. Căn
    cứ: Pāli root và từ vựng của an10.41:1.3 (cùng công thức, vế đảo nghĩa). Khoá
    an10.40:2.1 — `Bhinnaṁ pana, bhante, saṅghaṁ samaggaṁ katvā kiṁ so pasavatī`
    trước bỏ mất `samaggaṁ katvā` (“sau khi Tăng đoàn đã chia rẽ, thì sinh ra điều
    gì”) → “sau khi làm cho Tăng đoàn đã chia rẽ trở nên hòa hợp, người ấy sinh ra
    điều gì” (khớp câu trả lời `brahmaṁ puññaṁ pasavati` ở 2.2 và các câu ca
    3.5–3.6). `an10.40:1.4` và `3.4` đã đối chiếu với an10.37:1.4, an10.38:1.4 và
    iti19:3.4, giữ nguyên. Điểm không đổi.
