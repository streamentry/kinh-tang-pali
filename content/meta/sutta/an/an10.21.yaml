notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato đo bằng script trên Pāli có nội dung (≥ 40 ký tự, loại block `:0`): 29/29 = 100%**, không khoá nào bị Sujato bỏ trống, không cần ghi nhận gap. Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708: bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **91 khoá của lát có Pāli trùng nguyên văn ở bài khác (2.582 cặp), đã đếm bằng script; 77 cặp tôi dùng lại NGUYÊN VĂN.** Ở bài này: 8 khoá trùng (456 cặp), 4 cặp dùng lại nguyên văn.
  **Dùng lại nguyên văn 4 cặp:** `0.2` theo `an10.25` (3. Phẩm Lớn) · `2.2` trùng byte-for-byte `an5.99:2.2` (Khi Như Lai thuyết pháp cho hội chúng, đó chính là tiếng rống sư tử của Ngài) · `3.1`, `3.4`, `4.2`, `5.2`, `12.2`, `13.1` theo công thức `āsabhaṁ ṭhānaṁ … brahmacakkaṁ pavatteti` đã có sẵn ở `an5.11:1.2` và `an4.8:1.1`: tuyên nhận địa vị của con bò đực, rống tiếng rống sư tử trong các hội chúng, và xoay chuyển Pháp luân · `13.2` theo 268/270 bản cho `Paṭhamaṁ.`
  **4 khoá có Pāli trùng nhưng tôi cố ý dịch khác, và ghi lý do từng khoá.** `1.1`/`1.2`/`1.5` là dụ con sư tử, trùng byte-for-byte `an4.33:1.1-1.5`; bản đó dùng vị ngữ `vị ấy` cho con sư tử, còn `an5.99` dùng `nó`. Tôi theo `an5.99` vì con sư tử là động vật, `vị ấy` cho thú là cách nói sai tiếng Việt; giữ nhất quán `nó` cho cả 1.1–1.5. `3.2` `Katamāni dasa?` có 7 bản Việt chia làm 5 cách, không có đa số đáng theo (*Là mười nào?*, *Mười gốc nào?*, *Mười nền nào?* …), nên tôi đặt *Thế nào là mười?* theo an10.2.
  **Bốn khoá `…pe…` của Pāli — giữ đúng một dấu `…`, không mở rộng.** `6.2`, `7.2`, `8.2`, `11.2` lần lượt có 1, 1, 1, 1 dấu lược; `9.2` có 2 và bản Việt giữ 2. `10.2` có 1 (`dvepi jātiyo …pe…`). Đã đối chiếu từng khoá bằng hàm `lược()` của harness.
  **Thuật ngữ.** `sīhanāda` → tiếng rống sư tử (2 tiền lệ: an5.99, an4.33) · `āsabhaṁ ṭhānaṁ` → địa vị của con bò đực (an5.11, an4.8) · `brahmacakkaṁ pavatteti` → xoay chuyển Pháp luân (đa số) · `tathāgatabala` → sức mạnh của Như Lai (an5.11) · `ānandaṁ gocarāya` → đi kiếm mồi (an5.99). `jhānavimokkhasamādhisamāpattīnaṁ` (9.1) là tứ vế ghép nên tôi dịch đủ thành các thiền, các giải thoát, các định và các sở chứng, không rút còn một chữ.
  **Bất định đã ghi, không đưa vào thân kinh.** (1) `1.7` `khuddake pāṇe visamagate` — tôi dịch là không dẫm lên loài thú nhỏ nào trên thế đất chưa rõ địa hình; Sujato đọc là tránh làm đau loài thú nhỏ trên đất chưa rõ. (2) `4.1` `ṭhānaso hetuso` là cặp *hoàn cảnh và nguyên nhân*; tôi giữ cả hai, không thu gọn thành một. (3) `6.1` `anekadhātuṁ nānādhātuṁ` — tôi dịch `dhātu` là yếu tố, không dùng tướng vì `dhātu` ở đây là thành phần cấu tạo của thế giới.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
