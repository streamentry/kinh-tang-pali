notes: |-
  Giải quyết draft 2026-10-12: Blocker cũ "cắt ngắm — 3 khoá có dấu lược `…` ở an4.234:4.2, 5.2, 6.2" đã được kiểm lại và GỠ: bản dịch hiện hành ở ba khoá này viết đủ cả ba hành thân–khẩu–ý (có/không/vừa có vừa không phiền não), không còn dấu lược `…` nào, và Pāli tại đó là câu đầy đủ; chỗ có `…` là ở bản Anh Sujato (4.2/5.2/6.2 kết bằng `…`, còn 4.3, 4.4, 5.3, 5.4, 6.3, 6.4 để trống), không phải ở bản Việt. Sáu khoá Sujato để trống (4.3, 4.4, 5.3, 5.4, 6.3, 6.4) đã đọc kỹ từ Pāli, bản Việt tự đứng vững và khớp công thức bài song song an4.233 và mn57; coverage Sujato đo được 27/33 khoá Pāli có nội dung (0,82, trên ngưỡng 0,80). Tầng Việt hiện hành không có cho bài này (giới hạn của nguồn tham khảo, không phải lỗi văn bản). triangulation đặt 8,0 vì sáu khoá trên chỉ có Pāli làm chuẩn.
  Khoá sửa (lỗi nghĩa/giọng thật, 7/39 khoá): 1.2 "đáng nhớ nhung" -> "đáng ghi nhớ" (sāraṇīya = đáng ghi nhớ; tiền lệ dn/mn "thân thiện và đáng ghi nhớ" 62 khoá; "nhớ nhung" là sai nghĩa); 2.1 "cậu Nam Tử Gotama" -> "Tôn giả Gotama" (bho gotama: tiền lệ "Thưa Tôn giả Gotama" ở dn3 và nhiều bài khác), "con" -> "tôi" (Bà-la-môn không phải đệ tử, theo dn3/dn24), "cậu học trò" -> "thanh niên" (māṇava: tiền lệ "thanh niên" 135/203 khoá so với "học trò" 9); 2.2 "chủ trương thế giới bị đoạn diệt" -> "nói đến sự đoạn diệt của thế giới" (ucchedaṁ āha lokassa, không có động từ "chủ trương" lần hai); 2.3 "thưa ông" -> "thưa Tôn giả" (bho ở đây là hô cách gọi Đức Phật, vì 2.3 là lời Sikhāmoggallāna sau khi dẫn xong lời Soṇakāyana ở 2.2), "thật sự có nhờ nghiệp, thật sự trụ nhờ những khởi tạo nghiệp" -> "lấy nghiệp làm thực tại, an trú nhờ sự khởi sự nghiệp" (kammasacca + kammasamārambhaṭṭhāyī; bỏ chữ "thật sự" lặp thừa; "khởi sự" tách khỏi "khởi tạo" dùng cho abhisaṅkharoti); 3.1/3.2 "cậu học trò"/"cậu ấy" -> "thanh niên Soṇakāyana"/"người ấy"; 7.2 "sự cư ý để từ bỏ" -> "ý định từ bỏ" ba lần, thêm "Ở đó" cho Tatra (cetanā: tiền lệ mn57:11.2 "ý định từ bỏ"; "cư ý" không phải từ Việt có nghĩa; câu cũ cũng làm mất ba mệnh đề yā cetanā song song).
  Giữ nguyên có chủ đích: "Những điều này ... được gọi là" cho idaṁ vuccati (15/15 khoá cùng công thức trong tầng dùng dạng này, dù Pāli ở số ít; không đổi để khỏi lệch); "Đức Phật" cho bhagavā ở 1.1 (62 so với "Thế Tôn" 36 ở công thức mở đầu của AN); "chào hỏi thân mật" (20 ở AN); "có phiền não/không phiền não" cho sabyābajjha/abyābajjha (4/6 khoá cùng công thức ở tầng, cùng cách với an4.233; mn57 dùng "gây tổn hại"); "thế giới" cho loka ở 4.3-6.4 (4/4 khoá); "chư Thiên Biến Tịnh" (12/13). Bản Việt không đưa Pāli vào thân kinh; dấu lược của Pāli không có nên không có `…` nào trong bản Việt; số lượng: bốn loại nghiệp (cattāri) khớp 3.3, 3.4, 7.4; ba hành thân/khẩu/ý khớp 4.2, 5.2, 6.2.
  Bất định còn lại: (1) kammasacca ở 2.3 dịch "lấy nghiệp làm thực tại" theo nghĩa đen sacca = thực; Sujato diễn "exists through deeds", nghĩa gần nhưng nhẹ hơn; (2) ucchedaṁ āha ở 2.2 là lời quy gán của Soṇakāyana, dịch theo sát Pāli; (3) idaṁ vuccati số ít vs "Những điều này" như đã nêu. Trong tầng còn 17 khoá ở AN dùng "nhớ nhung" cho sāraṇīya (cùng lỗi 1.2 ở đây đã sửa) — ngoài phạm vi bài này, cần xử lý riêng.
  Cổng kỹ thuật: technical_integrity 9,6; các lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
