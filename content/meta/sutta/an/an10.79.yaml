notes:
  - >-
    **Bài ngắn nhưng là một danh sách chín vế có cấu trúc kép**: ba vế về điều
    làm hại tôi, ba vế về điều làm hại người tôi yêu quý, ba vế về điều **tốt**
    cho người tôi không yêu quý — rồi thêm *và nổi giận vô lý*. Mỗi nhóm ba vế
    chỉ khác **thì** (đã / đang / sẽ), nên tôi dựng bằng một bộ ba hằng số.
  - >-
    **`Ākaṅkhavagga` → *Phẩm Nguyện Cầu*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *If You Want*, và cả phẩm đúng một việc — *vị tỳ-kheo mong
    nguyện điều này, thì hãy làm điều kia* (`ākaṅkha` = mong nguyện).
    `Ākaṅkhasutta` → *Kinh Nguyện Cầu*.
    **`Ākaṅkhavaggo tatiyo` ở `an10.80:1.14` dịch là *Phẩm Nguyện Cầu, thứ ba***
    — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì phẩm này rõ
    ràng thứ tám (đúng như `8.` ở `0.2`). Tôi dịch theo Pāli vì Pāli là
    authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Lỗi nghiêm trọng nhất bài, lượt review bắt được ở sáu segment.** Bản đầu
    tôi dịch vế quá khứ `anatthaṁ me acarī` thành *“tôi đắc tội”* — tức **đảo
    chủ thể**: Pāli nói **người khác** đã làm hại **tôi**, ta là người bị làm
    hại. Đáng chú ý là hai vế sau (`caratī`, `carissatī`) tôi đã dịch đúng là
    *tôi bị làm hại*, nên chỉ vế quá khứ sai; người đọc lướt sẽ tưởng cả ba vế
    khác nhau trong khi Pāli chỉ khác thì. Đã sửa cả sáu vế và sáu vế của
    `an10.80`.
  - >-
    **`taṁ kutettha labbhā` (chỉ ở `an10.80`) → *làm gì được cho nó***, 0 tiền
    lệ; `āghāta` → *sân hận* (tiền lệ gián tiếp: `an10.44:4.2` dịch `anāghāta`
    là *không gây hại*); `āghātaṁ bandhati` → *nuôi dưỡng sân hận* và `āghātaṁ
    paṭivineti` → *dứt bỏ sân hận* — 0 tiền lệ, đặt mới theo cặp; `aṭṭhāne ca
    kuppati` → *nổi giận vô lý*.
    **Bốn vế ở `1.6`, `1.7`, `1.9`, `1.10` bị lược `…pe…`** nên chỉ còn lời
    nghĩ; hai vế `1.8` và `1.11` thì đủ.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
