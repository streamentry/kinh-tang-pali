notes: |-
  TẦNG THAM KHẢO CÓ. NHÓM `an`/`sn` CÓ TẦNG ANH. Coverage đo theo đúng công thức src/lib/canon/reference.ts, ngưỡng đọc từ source/layers.yaml (substantivePaliMinChars=40, excludeReferenceBlock=true, floor=0.8): 20 khoá Pāli có nội dung, 0 khoá không tầng Anh nào có chữ, tức 100%. Tệp Anh đã ghim có mặt trong source/upstream-manifest.json (tầng english-sujato, 4.291 tệp), nên đây là not-published-upstream=false: bài CÓ tầng tham khảo. Lớp lấp english-project của dự án không có cho uid này, nhưng không cần vì Sujato đã phủ hết. Tầng vietnamese-current vắng: tại commit đã ghim thư mục đó chỉ có 26 tệp, toàn bộ là Pháp Cú.

    DÙNG LẠI NGUYÊN VĂN — 12 khoá. 0.2 Sambodhivagga = 1. Phẩm Giác Ngộ (6/6), 1.1 (5/5),
    1.2 và 1.6 (an5.14 và an4.153), 1.3 và 5.8 và 5.19 (an4.153:1.3), 2.1 và 2.4 (an5.14),
    4.2 và 4.3 (an4.32 và an4.256: bốn phương thức hội tụ — bố thí, ái ngữ, lợi hành, và đồng
    sự), 5.2 (đa số 81/114: Thế nào là năm?), 5.4 (an5.57:7.1), 5.25 (249/255: Thứ năm.).
    `Idaṁ vuccati, bhikkhave, X balaṁ` theo an5.14 (3 khoá trùng nguyên văn).

    `Balasutta`: SÁU CÁCH CHO MỘT PĨI, KHÔNG CÓ ĐA SỐ. Đếm được trong kho: Kinh Các Sức
    Mạnh (an4.261), Kinh Sáu Sức Mạnh, Kinh Sức Mạnh (an5.204), Kinh Sức Mạnh Định, Kinh
    Công Việc Bằng Sức Mạnh, Kinh Năm Sức Mạnh — mỗi cách đúng một lần. Tôi chọn Kinh Các
    Sức Mạnh vì an4.261 cùng tên Pāli và cùng nội dung cattāri balāni. Giao người biên tập
    hợp nhất cả sáu tệp.

    `saṅgāhabalaṁ` tôi dịch là sức mạnh của sự hội tụ, lấy nguyên văn an4.153:1.3; bài đó
    viết `saṅgahabalaṁ` không có nguyên âm dài, nhưng vì an9.5 lặp lại nguyên cả danh sách bốn
    sức mạnh đó ba lần (1.3, 5.8, 5.19) thì lấy nguyên văn của danh sách là đúng nhất.

    KHUNG `Etadaggaṁ … yadidaṁ …`: glossary `etadagga` = tối thắng, khung tối thắng … là …,
    và tầng `an` đang dùng tối thắng 283 lần; tiền lệ gần nhất với đúng công thức này là
    iti100:3.3 (trong hai loại bố thí này, bố thí pháp là tối thắng). Tôi vì thế dùng tối thắng,
    không dùng điều tối thượng.

    BỐN SỨC MẠNH YẾU — `duppañño` = người thiếu trí tuệ (29), `kusīto` = người lười biếng
    (122), `Asaṅgāhako` = người không biết hội tụ (saṅgāha = hội tụ theo an4.32/an4.256),
    `dussīlaṁ` = người hành vi xấu (19; dn33 và ud5.5 dùng vô giới / phá giới nên có tiền lệ
    cạnh tranh, đã ghi ở đây), `macchariṁ` = người keo kiệt (229), `duppaññaṁ` = người kém trí
    (52). Cụm bốn vế `samādapeti niveseti patiṭṭhāpeti` cùng bốn mục trong 4.6 là Pāli gần
    trùng an2.33:1.9, nên tôi theo nguyên văn của bài đó cho `Xsampadāya` (được an trú vào
    đầy đủ niềm tin / giới / thí xả / trí tuệ).

    NĂM NỖI SỢ. `ājīvikabhaya` = nỗi sợ về sinh kế (sinh kế 23 lần), `asilokabhaya` = nỗi
    sợ mất danh tiếng (asiloka đang được dịch là danh tiếng trong 61 khoá, còn danh tiếng dùng
    404 lần toàn tầng; bản Anh đã ghim dịch là disrepute), `parisasārajjabhaya` = nỗi sợ
    không vững vàng trong hội chúng, `maraṇabhaya` = nỗi sợ chết, `duggatibhaya` = nỗi sợ bị
    đọa vào ác đạo (an4.121, bốn khoá). Bốn mục đầu mới có tiền lệ ở 5.3 và lặp y hệt ở 5.13-5.15.

    DẤU LƯỢC. Năm dấu lược, đúng bằng Pāli. 4.6 có BA dấu lược trần, lược đúng cái
    `samādapeti niveseti patiṭṭhāpeti` lặp sau `sīlasampadāya` và sau `cāgasampadāya` —
    công thức đã nêu đủ hai lần ngay trong chính khoa đó, nên theo BRIEF_VI3 §10.1 tôi giữ
    dấu lược và không viết lại. 5.13, 5.14, 5.15 mỗi khoá một `…pe…` → mỗi khoá đúng một ….

    LỖI BẮT ĐƯỢC Ở LƯỢT REVIEW ĐỐI KHÁNG. (1) 4.6 nháp đầu viết cho đạt đầy đủ niềm tin,
    đã sửa theo an2.33:1.9 thành được an trú vào đầy đủ niềm tin cho cả bốn vế, và thêm
    khiến vào để câu đọc ra ba vế của samādapeti niveseti patiṭṭhāpeti. (2) 5.3 và 5.13
    nháp đầu viết nỗi sợ mất tiếng tăm; đã sửa thành nỗi sợ mất danh tiếng theo đa số.

    BẤT ĐỊNH CÒN MỞ. (1) `asiloka` là tiếng tăm xấu chứ không phải mất uy tín; tôi chọn mất
    danh tiếng vì đó là thuật ngữ đã có trong tầng. (2) `samānattatā` ở 4.3 tôi dùng đồng sự
    theo an4.32 và an4.256; dn33:1.11.191 dùng đồng tâm bình đẳng và an8.24 dùng đồng sự —
    đã có hai cách trong kho, tôi ghi để người biên tập chọn một cho cả hệ.

    CỔNG KỸ THUẬT. Đợt này tôi bị cấm chạy npm run validate / test / check / build, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Những gì tôi tự kiểm được và đều sạch: JSON hợp lệ; đúng 49/50 khoá mỗi bài và tập khoá khớp tuyệt đối với all trong vc/c83.json; không orphan; không rỗng; không còn stub dạng (…); toàn bộ NFC; số dấu lược không bao giờ vượt Pāli và mỗi …pe… của Pāli còn đúng một dấu …; ngoặc kép cân trên cả bài; không có Pāli nào mà hai bài trong lát dịch khác nhau; và save_vi chạy lại cho ra đúng byte cũ (idempotent). Bốn lệnh cổng để coordinator chạy sau khi gộp lát.
