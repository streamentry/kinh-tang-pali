notes: Đối chiếu tam giác Pāli root + bản dịch tiếng Anh của Bhikkhu Sujato (21/21 khoá có bản tham khảo Anh đầy đủ). Thuật ngữ 'indriyasaṁvara' dịch nhất quán là 'sự thu thúc các căn' theo các tiền lệ đã công bố trong kho (sn2.17, iti28, iti29). Cấu trúc duyên khởi tiến trình giới - định - tuệ đối chiếu song song với an5.24, an5.168, an10.3 và an10.4. Dấu lược …pe… tại 1.8 và 2.7 được giữ đúng một dấu … theo chuẩn kho. Văn phong sáng rõ, đạt chuẩn xuất bản.
