  Khuôn khoá mới: 348-350:1.1/1.2 dùng lại nguyên văn 333:1.1/1.2 (cùng pariyāya
  Jambudīpa); 1.1 mở “… Cũng vậy, này các tỳ-kheo, những chúng sinh [gốc] chết
  rồi sinh ra ở [nơi] thì ít ỏi;”, 1.2 “còn những chúng sinh [gốc] chết rồi
  sinh vào địa ngục … sinh vào cõi súc sinh … sinh vào cõi ngạ quỷ thì nhiều
  hơn.” Danh từ ba cõi lấy mn12:35.3 (địa ngục, cõi súc sinh, cõi ngạ quỷ),
  “cõi trời” theo sn56.105-125, “loài người” theo sn56.120.
  Dấu lược: 348-350:1.3 Pāli hai `…pe…` → VI hai `…`; các 1.1 một `…`, các 1.2
  hai `…` — cân bằng tuyệt đối từng khoá, kiểm bằng _checkwave. 1.3 “Phẩm thứ
  tư.” (vaggo catuttho); 1.4 “(Jambudīpa Lược đã hoàn tất.)” theo đăng ký
  `peyyāla` → *lược* (Gaṅgā Lược) của lát 30. Đóng ngoặc theo khuôn 347:1.5
  (bỏ `ti`, giữ `”.`). Không blocker; scorecard giữ nguyên, final 9.44.
