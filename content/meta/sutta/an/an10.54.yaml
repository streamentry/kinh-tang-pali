notes:
  - >-
    **Bài dài nhất chương (98 segment) nhưng chỉ có hai ý.** Trước hết bốn tình
    huống về `cetosamatha` và `adhipaññādhammavipassanā` (`3.x`–`6.x`); sau đó
    sáu vật dụng, mỗi vật một mục liệt kê rồi một mục giải nghĩa theo đúng khuôn
    mười segment (`7.x`–`13.x`). Không có lặp ý, chỉ có lặp khuôn — nên tôi dịch
    theo khuôn, và khuôn đó là **cùng khuôn cho cả sáu vật dụng**.
  - >-
    **`Sacittavagga` → *Phẩm Tâm Mình*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *Your Own Mind*, và cả phẩm nói đúng một việc — soi lại
    **tâm mình** (`sacittapariyāyakusala`). Tên bài `Sacittasutta` → *Kinh Chăm
    Chính Tâm Mình*.
    **`Sacittavaggo paṭhamo` ở `an10.60:15.5` dịch là *Phẩm Tâm Mình, thứ
    nhất*** — đây là **số thứ tự của chính Bilara đánh số lại**, vì phẩm này rõ
    ràng là thứ sáu trong Bộ Mười (đúng như `6.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Cả ẩn dụ gương / bát nước đều là thuật ngữ 0 tiền lệ, đặt mới**:
    `mukhanimitta` → *hình bóng khuôn mặt*, `maṇḍanakajātiko` → *thích trang
    điệm*, `raja` → *bẩn bẩn*, `aṅgaṇa` → *tế nhị*, `paccavekkhamāno` → *phản
    tư* (theo `an5.149:1.3`, vốn dùng *phản tư* cho động từ này),
    `paccavekkhaṇā` → *việc phản tư*.
  - >-
    **Cả tám cụm `lābhī nu khomhi ajjhattaṁ cetosamathassa…` dùng nguyên văn
    `an4.92:1.3`** (đã `published`) cho *sự an định của tâm bên trong* và
    `an4.92:1.4` cho *thắng tuệ quán các pháp*; `adhimatto chando…` lấy từ
    `an4.93:4.1`.
    **Sáu vật dụng**: `senāsana` → *chỗ ở* theo 21 segment tiền lệ (xem ghi chú
    chương 2), `cīvara` → *y pháp*, `piṇḍapāta` → *thức ăn khất thực* (theo
    `an3.140:4.6`), `gāmanigama` → *làng hay thị trấn*, `janapadapadesa` → *vùng
    đất*, `puggala` → *cá nhân* — năm cái sau **0 tiền lệ trong đúng nghĩa
    này**, đặt mới.
  - >-
    **Dấu ngoặc kép ở `6.2` cố ý không đóng**, vì Pāli cũng không đóng: `“` mở ở
    `1.1` và chỉ đóng ở `13.10` (`vuttan”ti.`). `an10.51:5.2`, `an10.52:6.2`,
    `an10.53:8.2` đều **có** `”` ở cùng vị trí. Đây là khác biệt thật trong
    Pāli, tôi giữ nguyên theo từng bài thay vì bình quân hoá.
  - >-
    **`2.6` lặp mỗi mục hai lần trong Pāli** (`lābhī nu khomhi X, na nu khomhi
    lābhī X`) — thừa ngữ, nhưng Pāli là authority. Tôi giữ **hai vế** và dịch vế
    hai là *hay là không có X* để giữ nghĩa `na`; dịch lặp y sẽ ra lời lặp vô
    nghĩa trong tiếng Việt.
  - >-
    **Cặp `8.3`/`8.10` rồi `9.3`/`9.10` … cố tình khác nhau**, vì Pāli cũng vậy:
    `8.3`, `9.3`, `10.3`, `11.3`, `12.3`, `13.3` dùng *iti kho panetaṁ vuttaṁ.
    Kiñcetaṁ paṭicca vuttaṁ?* (có dấu hỏi), còn vế chót của mỗi mục dùng *iti
    yaṁ taṁ vuttaṁ, idametaṁ paṭicca vuttaṁ.* (không có). Ngay trong `13`, vế
    `13.3` có dấu hỏi còn `13.10` thì không — giữ nguyên.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
