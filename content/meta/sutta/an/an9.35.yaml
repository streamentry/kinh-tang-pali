notes: |-
  Đối chiếu Pāli + English Sujato (62/64 khoá có nội dung) + bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn (không vào cột). Kinh Ví Dụ Con Bò Cái (Gāvīupamāsutta): Đức Thế Tôn lấy hình ảnh con bò cái núi ngu dốt, vụng về, nhấc chân sau trước khi chân trước đã vững nên không đến được nơi mới và cũng không trở về chỗ cũ an toàn, đối chiếu với con bò cái khôn ngoan, khéo léo; ứng vào vị tỳ-kheo vụng về vừa đạt thiền thứ nhất mà không an lập tướng ấy, rồi muốn thiền thứ hai không được, quay lại thiền thứ nhất cũng không được (rơi khỏi cả hai phía), và vị tỳ-kheo khéo léo đi lần lượt từ thiền thứ nhất đến sự chấm dứt của tưởng và thọ, không xô ép từng tầng, rồi nhờ tâm mềm và dễ uốn mà định trở nên vô lượng và có khả năng chứng sáu thắng trí tùy theo mong muốn. Số thứ tự uddāna `Catutthaṁ` = Thứ tư.

  **Coverage English: Sujato 62/64 = 96,9%** trên Pāli có nội dung (>= 40 ký tự, bỏ khối `:0`); hai khoá Sujato để trống là `1.7` và `3.7`, hai khoá ấy cùng nằm trong phần mà tầng `english-project` (đã published, 2 khoá) lấp, nên cổng tính 64/64 = 100% — nhưng phần lấp do dự án viết nên không phải đối chiếu độc lập; cổng chỉ cần phần Sujato độc lập (>= 0,80) và đã vượt. Khoá `18.3` (colophon) không tính vào mẫu số. Sujato dồn nội dung của `1.7` vào `1.6` (và `3.7` vào `3.6`) khi dịch, nên về nghĩa phần Sujato cũng đã phủ cả hai chỗ (She'd never return safely to the place she had started from; She'd return safely to the place she had started from). Tầng Việt hiện hành vắng ở commit đã ghim (chỉ có Pháp Cú) nên phần đối chiếu Việt dựa vào Pāli + Sujato + bản nguyên bài ở mục Tra cứu toàn văn. Cổng coverage đo được (62/64 >= 0,80), không có khoảng trống cần ghi nhận.

  **Dùng lại tiền lệ (đo trên toàn tầng).** 22 dòng Pāli của bài (không kể các dòng lặp trong chính bài) trùng nguyên văn với khoá ở bài khác: 1.001 cặp đã dò, trong đó 401 cặp bản Việt khác. Phần lớn lệch rơi vào ba khoá ngắn: `3.8` `Vì sao vậy?` (506 cặp; 343 cặp *Vì sao vậy?* — theo đa số, 68 *Vì sao?*, 37 *Vì lý do gì?*), `11.1` `Tassa evaṁ hoti:` (115 cặp; *Vị ấy nghĩ:* 48 theo đa số tầng, *Người ấy nghĩ:* 28, *Vị ấy nghĩ như vậy:* 15; trong riêng bộ Tăng Chi là *Người ấy nghĩ:* 23 nhưng đó là các bài nói về một hạng người, còn ở đây chủ thể là một vị tỳ-kheo nên giữ *Vị ấy nghĩ:*) và `18.3` `Catutthaṁ.` (275 cặp; *Thứ tư.* 180, *Thứ bốn.* 92). `0.2` (8/8 cặp cùng), `17.2` = `13.2` = `15.18` = `16.2` (11/11 cặp cùng, dùng nguyên văn *thì ngay chính chỗ ấy, trong từng trường hợp, vị ấy chứng đạt được sự tự thân chứng ngộ* theo `an5.23`, `an5.28`), `18.1` (3 cặp, 2 cùng; 1 cặp chỉ khác dấu chấm cuối), `18.2` (2/2 cùng). Công thức bốn thiền, bốn vô sắc, tha tâm thông, túc mạng, thiên nhãn, lậu tận lấy từ `an9.34`, `an9.36:4.5`, `an4.163`, `sn54.8:13.2`, `an5.23`, `an5.28:14.1`, `an9.40`, `an9.38`. Trong chính bài: 7 nhóm Pāli trùng nguyên văn (`1.2`=`3.2`; `1.3`=`3.3`; `1.8`=`3.8`; `2.1`=`2.4`=`4.1`…`11.1`; `2.2`=`4.2`; `3.11`=`4.4`=`5.4`…`10.4`; `13.2`=`15.18`=`16.2`=`17.2`), 0 nhóm có bản Việt khác nhau.

  **Thuật ngữ và lựa chọn đo trên tầng.** `khettaññū` → *biết rõ địa bàn* (0 tiền lệ trong tầng; Thích Minh Châu *biết đồng ruộng*, Sujato *common sense*; chọn *địa bàn* vì dùng được cả cho con bò lẫn cho tỳ-kheo, giữ cùng một từ cho cả hai). `bālā abyattā … akusalā` → *ngu dốt, không sáng suốt, … vụng về*; mặt đối lập *khôn ngoan, sáng suốt, … khéo léo*. `pabbateyyā` → *ở núi*, `visame pabbate` → *núi hiểm trở*. `yannūnāhaṁ` → *Hay là ta* (4 khoá *Hay là Ta* trong tầng; 10 khoá *Ta hãy*; chọn *Hay là ta* cho nghĩa "nếu ta … thì sao"). `anabhihiṁsamāno` → *không xô ép* (0 tiền lệ trong tầng, nghĩa đen *không làm tổn hại/áp bức*; Sujato *without charging at*, Thích Minh Châu *không lẫn lộn*; xem phần bất định). `nimitta` → *tướng* (`samādhinimitta` → *định tướng*, `dn34`; Sujato *basis*). `svādhiṭṭhitaṁ adhiṭṭhāti` → *khéo an lập cho vững vàng* (0 tiền lệ; Sujato *ensure it is properly stabilized*; Thích Minh Châu *trú một cách khéo trú*). `mudu … kammañña` → *mềm và dễ uốn* (`dn23:16.12`–`16.13`, 3 khoá cùng gốc `kammañña`; `an5.23` dịch `kammaniya` là *khéo dụng tác*). `appamāṇa samādhi` → *định vô lượng*. `kāmehi vivicca akusalehi dhammehi` → *ly dục, ly các pháp bất thiện*; `vivekajaṁ pītisukhaṁ` → *hỷ lạc do ly sinh* (`an9.38`, `an9.40`; còn *viễn ly sinh* ở `an9.33`, `an9.39`). `ākāsānañcāyatana` → *xứ vô số hư không*, `viññāṇañcāyatana` → *xứ vô số thức*, `ākiñcaññāyatana` → *xứ vô sở hữu*, `nevasaññānāsaññāyatana` → *xứ phi tưởng phi phi tưởng* (quy ước tầng, theo `an9.34`), `saññāvedayitanirodha` → *sự chấm dứt của tưởng và thọ*. `iddhividha … brahmaloka` → *thần thông biến hóa … cõi Brahma* (`an5.23`, `an5.28:11.1`, `an5.68:2.1`). `sauttaraṁ cittaṁ` → *tâm còn cao hơn* và `anuttaraṁ` → *tâm vô thượng* (tầng: *hữu thượng* 3, *thượng thừa* 2, *còn cao hơn* 1, *chưa đạt mức cao nhất* 2; chọn *còn cao hơn* vì đúng cấu tạo `sa-` + `uttara` = còn có cái cao hơn nó, không phải "ưu việt"; `an5.23`/`an5.28` dịch *thượng thừa* dễ hiểu ngược). `saṅkhittaṁ` → *thu hẹp*, `mahaggataṁ` → *rộng lớn*, `samāhitaṁ` → *có định*, `asamāhitaṁ` → *không định*, `vimuttaṁ` → *được giải thoát* (theo `an5.23`, `an5.28`).

  **Câu nghĩa đen khó, ghi bất định.** (1) `1.6`–`1.7` và `3.6`–`3.7`: `Yasmiṁ cassā padese ṭhitāya evamassa: … tañca padesaṁ na sotthinā paccāgaccheyya` — dịch *và ở chỗ nào nó đang đứng mà có thể nghĩ rằng: … thì nó cũng sẽ không trở về chỗ ấy một cách an toàn*; Thích Minh Châu cũng hiểu *chỗ ấy* là chỗ nó đang đứng, Sujato nói rõ *the place she had started from*; tôi giữ *chỗ ấy* (không thêm *xuất phát*), khớp lớp lấp English của dự án. Ranh giới câu giữa hai khoá theo Pāli (khoá `1.6` kết bằng dấu hai chấm). (2) `anabhihiṁsamāno` (`4.3`, `5.3`, `6.3`, `7.3`, `8.3`, `9.3`, `10.3`, `11.3`): không có tiền lệ trong tầng Việt, gốc `abhi` + `hiṁs` = làm tổn hại, ép, đánh; Sujato *without charging at* (xông vào), Thích Minh Châu *không lẫn lộn*; dịch *không xô ép* là cách hiểu ít giả định nhất, nhưng sắc thái (xông vào / làm tổn hại / làm xáo trộn) không phân xử được từ riêng tầng Pāli đã ghim; không đổi giáo nghĩa chính (khéo đi từng bước, không vội vàng bỏ tầng dưới). (3) `sakkhibhabbataṁ pāpuṇāti` (`12.3`, `13.2`, `15.18`, `16.2`, `17.2`, `18.2`): tầng đang dịch *chứng đạt được sự tự thân chứng ngộ* (16 cặp trùng Pāli); Sujato và Thích Minh Châu nhấn *có khả năng* chứng ngộ (`bhabba`), còn câu tầng thì đọc như đã chứng ngộ. Giữ nguyên bản tầng để nhất quán (không phải lỗi của bài này); nên rà soát toàn tầng sau. (4) `sati sati āyatane` ở `14.2`: Pāli chỉ còn mảnh này sau chỗ lược của `14.1`, dịch *trong từng trường hợp* theo tầng; Pāli `14.1` mở nháy đơn mà không bao giờ đóng, bản Việt giữ đúng như vậy. (5) `15.2`–`15.6`, `15.17`: Pāli không có nháy cho câu lặp `sarāgaṁ cittanti` nên bản Việt không thêm nháy *“tâm có tham”* (`an5.23`, `an5.28` có thêm); câu thành *biết rõ tâm có tham là tâm có tham*. (6) `8.3` có nháy đơn quanh *thức là vô lượng* còn `8.2` không, theo đúng Pāli.

  **Số Pāli:** không có số lượng nào cần tính: chỉ có thứ tự bốn thiền (`paṭhama` … `catuttha` = thứ nhất … thứ tư), danh sách lược `ekampi jātiṁ dvepi jātiyo` (một đời, hai đời), `ubhato` (cả hai phía) và `ekopi hutvā bahudhā` (từ một hiện ra nhiều).

  **Dấu lược và dấu nháy:** `…pe…` → đúng một `…` ở `2.3`, `2.6`, `6.3`, `7.3`, `13.1`, `14.1`, `16.1`, `17.1`; `…` trần ở `4.3`, `5.3`, `15.7`–`15.16` giữ `…`. Số dấu lược đúng bằng Pāli ở 95/95 khoá. Nháy đơn và nháy kép khớp Pāli từng khoá ở 95/95 khoá: nháy kép mở `“` ở `1.1`, đóng `”` ở `18.2`; nháy đơn ở các khoá ‘Hay là ta …’ khớp Pāli.

  **Lượt review đối kháng:** (1) `1.10` và `3.10` liệt kê bốn tính từ rồi nối thẳng sang mệnh đề ly dục nên đọc hơi dồn, nhưng Pāli không có đại từ ở chỗ này, giữ nguyên. (2) `evamassa` là optative nên dịch *nó có thể nghĩ* chứ không phải *nó nghĩ*. (3) Các khoá optative của bò (`1.4`, `1.5`, `3.4`, `3.5`, `1.7`, `3.7`) dùng *sẽ* cho cân; en-project cũng để cùng cách. Không tìm thấy lỗi sai nghĩa cần sửa.

