notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit 11c9d708. Ghi đủ 93/93 khoá của bài, thứ tự khoá đúng thứ tự Pāli, không khoá nào ngoài Pāli.
  **Coverage Anh Sujato trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): 55/55 = 100%.** Không khoá nào trong mẫu số bị Sujato để trống; các khoá Sujato để trống (`4.2`, `4.3`, `4.7`, `4.8`, `6.2`, `6.6`, `6.7`, `8.4`, `8.5`, `10.2`, `10.3`, `10.7`, `10.8`) đều là khoá Pāli dưới 40 ký tự (`ottappaṁ natthi …`, `vīriyaṁ atthi …`), nằm ngoài mẫu số; Sujato nhập các mục đó vào khoá liệt kê đứng trước. Chưa có lớp `english-project` cho bài này, và cũng không cần: coverage 100% là của riêng Sujato, độc lập, không phải bản lấp của dự án. Cổng coverage không đặt ra vấn đề gì cho bài này.
  Tầng Việt hiện hành vắng ở commit đã ghim: bilara chỉ phân phối Pháp Cú tiếng Việt. Bản nguyên bài của Hòa thượng Thích Minh Châu (Bình Anson hiệu đính) ở mục Tra cứu toàn văn có đủ thân kinh, nhưng thuộc dạng văn xuôi liên tục không căn lề theo khoá, nên chỉ dùng làm chứng cứ thuật ngữ và đối chiếu nghĩa, không dùng đối chiếu cú pháp. Có hai điểm bản ấy khác Pāli ghim và Pāli quyết định: (1) ở đoạn đầu (tương ứng `5.x`) bản ấy chỉ kể sáu hạng người suy giảm, bỏ `ahiriko`, `kusīto`, `duppañño`, `upanāhī`, trong khi Pāli ghim kể đủ mười (`5.1`–`5.10`) và đoạn lược sau của chính bài (`9.1`–`9.10`) kể đủ; (2) bản ấy viết *ác dục* cho `pāpiccho`, *hiềm hận* cho `anupanāhī`, *thiện bằng hữu* cho `kalyāṇamitto`.
  **Pāli trùng nguyên văn ở bài khác: 46 khoá có cặp trùng, 469 cặp đã dò (đếm theo khoá, gồm cả bản sao), 56 cặp trong đó bản Việt hiện có khác bản này.** 37 khoá dùng lại nguyên văn bản đã có, không cặp nào lệch: `0.2`, `1.4`, `2.1`–`2.4`, `3.1`, `4.1`–`4.3`, `4.5`–`4.8`, `6.1`, `6.2`, `6.4`, `6.6`, `6.7`, `8.1`, `8.2`, `8.4`, `8.5`, `8.7`, `8.8`, `9.3`–`9.6`, `10.2`, `10.3`, `10.5`, `10.7`, `10.8`, `11.4`–`11.6` (gần như toàn bộ từ `an10.68` và `sn16.7`). Chín khoá có cặp Việt khác, nói rõ lý do chọn: `1.3` (3 cặp, 1 trùng bản này; theo `an10.68:1.2` *vào ngày Uposatha*, hai bản kia dùng *ngày trai giới* và *ngày Bố-tát*, ngang nhau) · `2.5` (2 cặp, 1 trùng; *vâng lời Đức Phật* như `an10.68:2.5`, vì trong bài này `bhagavā` nhất quán là *Đức Phật*) · `3.2` (15/22 trùng: *Tại đó, Tôn giả Sāriputta gọi các vị tỳ-kheo:*) · `3.3` (14/26 trùng: *Này các hiền giả tỳ-kheo!*) · `3.4` (chỉ 2/19 trùng nguyên câu; 12 trong 19 khoá mở bằng *Thưa hiền giả*, nên chọn *Thưa hiền giả* và ghép *các vị tỳ-kheo ấy đáp lời Tôn giả Sāriputta* như `an10.68:3.4`; *Bạch đại hiền giả* 3 và *Kính bạch Tôn giả* 2 là cách xưng hô tôn kính, còn `āvuso` là cách gọi ngang hàng) · `3.5` (20/26 trùng) · `11.2` và `11.3` (xem phần thuật ngữ) · `11.11` (254/259 trùng: *Thứ bảy.*).
  **Trùng nguyên văn trong chính bài: 6 nhóm Pāli giống nhau, 24 cặp, bản Việt 0 cặp khác nhau.** Gồm `4.2` = `4.7` = `8.4` (`ottappaṁ natthi …`), `4.3` = `4.8` = `8.5` (`vīriyaṁ natthi …`), `4.4` = `4.9` = `8.6` (`paññā natthi …`), `6.2` = `6.6` = `10.2` = `10.7` (`ottappaṁ atthi …`), `6.3` = `6.8` = `10.4` = `10.9` (`paññā atthi …`), `6.7` = `10.3` = `10.8` (`vīriyaṁ atthi …`). Không nhóm nào lệch dù chỉ một dấu câu.
  **Thứ tự và độ đầy đủ của các mục `ottappa` / `vīriya` / `paññā` theo từng khoá, kể cả chỗ Pāli ghim lược.** `4.1`–`4.4`, `4.6`–`4.9` và `8.3`–`8.6` đi đủ `saddhā` – `hirī` – `ottappa` – `vīriya` – `paññā`. Nhưng ở `6.1`–`6.3` Pāli ghim chỉ có `saddhā`, `hirī`, `ottappaṁ`, rồi nhảy sang `paññā` (không có `vīriyaṁ atthi …`), trong khi `6.5`–`6.8` và `10.1`–`10.9` có đủ cả năm; Sujato đã tự bổ *energy* vào chỗ ấy. Bản Việt theo đúng Pāli từng khoá: `6.1`–`6.3` không có *có tinh tấn …*, không thêm cho đủ năm. Đây là điểm không đều của chính Pāli ghim, không đổi nghĩa vì dạng lược `…` trần thay cho phần bị bỏ.
  **Dấu lược `…` — theo quy ước tầng.** Các khoá kết bằng ` …` trần (`4.1`–`4.3`, `4.6`–`4.8`, `6.1`, `6.2`, `6.5`–`6.7`, `8.3`–`8.5`, `9.2`–`9.9`, `10.1`–`10.3`, `10.6`–`10.8`, `11.2`–`11.9`) giữ đúng một ` …`, không viết đủ phần bị lược. Hai khoá `…pe…` (`8.8`, `8.9`) đều ra đúng một `…`; riêng `8.9` dấu lược nằm giữa câu (`…pe… no vuddhi`), nên bản Việt đặt `…` giữa câu: *thì đối với người ấy, dù đêm hay ngày … không phải sự tăng trưởng.* Không khoá nào có `(…)`.
  **Thuật ngữ, kèm số đếm trên tầng Việt đã có (đếm theo khoá).** Danh sách mười hạng người ở `5.x`, `7.x`, `9.x`, `11.x` có song song gần nguyên với `sn16.7:4.1`–`4.7` và `7.1`–`7.7`, nên theo đó: `assaddho`/`saddho` → *người không có lòng tin* / *người có lòng tin* (`saddhā` → *lòng tin*, 107/245 toàn tầng) · `ahiriko`/`hirīmā` → *người không biết hổ thẹn* / *người biết hổ thẹn* · `anottappī`/`ottappī` → *người không biết kính sợ* / *người biết kính sợ* · `kusīto` → *người lười biếng* (`sn16.7:4.4`; trên tầng, các dạng *lười biếng* và *biếng nhác* ngang nhau) · `duppañño` → *người kém tuệ* (17 khoá *kém tuệ* so với *thiếu trí tuệ* 15) · `paññavā` → *người có trí tuệ* (*có trí* 67, *có trí tuệ* 44, *có tuệ* 36; theo `sn16.7:7.5`) · `kodhano`/`akkodhano` → *người hay giận dữ* / *người không giận dữ* (*giận dữ* 14 trong các khoá `kodhano`) · `upanāhī`/`anupanāhī` → *người hay oán hận* / *người không oán hận* (*oán hận* 6 trong `upanāhī`, 4 trong `anupanāhī`; *phẫn nộ* 4 là dạng ghép `kodhano`) · `āraddhavīriyo` → *người tinh tấn* (91 khoá *tinh tấn* trong các khoá `āraddhavīriyo`; theo `sn16.7:7.4`) · `pāpiccho`/`appiccho` → *người có ham muốn xấu* / *người ít ham muốn* (xem bất định) · `pāpamitto`/`kalyāṇamitto` → *người có bạn xấu* / *người có bạn lành* (như `an8.54:6.2`, `7.2`) · `micchādiṭṭhiko`/`sammādiṭṭhiko` → *người có tà kiến* / *người có chánh kiến* (đa số rõ của Tăng Chi Bộ) · `hirī` → *hổ thẹn* (36/44), `ottappa` → *kính sợ* (72/127). `an8.23`/`an8.24` dịch `hirīmā` là *có lễ nghĩa* (3 cặp) và `ottappī` là *cẩn trọng* (3/4 cặp) cho cùng chữ Pāli, nhưng đó là danh sách phẩm chất của một cư sĩ ở ngữ cảnh khác và lệch tầng chính (`hirī` → *hổ thẹn*, `ottappa` → *kính sợ*), nên không dùng; trong chính bài này `hirī` và `ottappa` đã dịch *hổ thẹn* và *kính sợ* ở `4.1`–`4.8`, `6.1`–`6.2` và các đoạn kế, nên `hirīmā` và `ottappī` phải nhất quán với đó. `saddhā natthi kusalesu dhammesu` → *không có lòng tin nơi các pháp thiện* (như `an10.68:4.1`) · `kusalesu dhammesu` → *các pháp thiện* (179 so với *thiện pháp* 46) · `catugguṇaṁ saṅghāṭiṁ` → *y tăng-già-lê gấp bốn* (như `an10.68:3.1`) · `tuṇhībhūtaṁ tuṇhībhūtaṁ` → *hoàn toàn im lặng* (như `an10.68:1.3`) · `āvuso` → *hiền giả* · `kāḷapakkha`/`juṇhapakkha` → *nửa tháng trăng khuyết* / *nửa tháng trăng tròn dần*, `ārohapariṇāha` → *đường kính lẫn chu vi* (như `an10.68`, `sn16.7`; `an10.14` viết *tuần hạ* / *tuần vọng* và `sn16.7:3.1` cùng cụm Pāli này viết như bản đang dùng, nên chọn theo đa số gần nhất).
  **Bất định, ghi ở đây chứ không đưa vào thân kinh.** (a) `pāpiccho` (`5.8`, `9.8`) và `appiccho` (`7.8`, `11.8`): chọn *có ham muốn xấu* / *ít ham muốn*; tầng đã có các cách *mong muốn xấu* (10 khoá, phần lớn ở `mn15`, cùng chữ `pāpicchā`), *ác dục* (7), *ham muốn điều ác* (4), *ước muốn ác* (1) cho `pāpiccho`; *ác dục* ngắn và là thuật ngữ quen, nhưng *có ham muốn xấu* đối xứng rõ với *ít ham muốn* (23 khoá cho `appiccho`) và bám Sujato (*corrupt wishes*), nên chọn cách đó; không có đa số rõ giữa hai nhóm nên đây là lựa chọn có chủ ý. (b) `akkodhano` / `anupanāhī` (`7.6`, `7.7`, `11.6`, `11.7`): Sujato viết *loving* và *kind* cho hai mục này, trong khi ở `5.6`, `5.7` chính ông viết *irritable* và *acrimonious* cho `kodhano` và `upanāhī`; Pāli là phủ định của hai từ ấy (`a-` + `kodhana`, `an-` + `upanāhin`) và `sn16.7:7.6`, `7.7` dịch cùng cặp là *không giận dữ* / *không oán hận*, nên bản Việt theo Pāli và `sn16.7`, không theo Sujato ở hai mục này. (c) `āraddhavīriyo` (`7.4`, `11.4`): *người tinh tấn* (như `sn16.7:7.4`), không có từ riêng cho `āraddha-` (đã khởi lên, nỗ lực); Sujato *energetic*. (d) `paṭibhātu taṁ` (`2.2`): theo `an10.68:2.2`, *tùy theo điều con cảm hứng*, như Sujato *as you feel inspired*; `dn33:1.5.3` bỏ hẳn sắc thái này. (e) `paccuṭṭhāya` (`8.1`): dịch trung tính *dậy*. (f) `ārohapariṇāhena` (`4.5`, `6.4`, `8.7`, `10.5`): Pāli có bốn `hāyati`/`vaḍḍhati` nhưng bốn công cụ cách (`vaṇṇena`, `maṇḍalena`, `ābhāya`, `ārohapariṇāhena`) không đều động từ; hiểu cả bốn đều chỉ giảm hay tăng, giống Sujato và `an10.68`, chọn cách ít giả định nhất.
  Các phép kiểm tự viết trên mọi khoá, không chỉ khoá ≥ 40 ký tự: tập khoá Việt = tập khoá Pāli (93/93, thứ tự trùng); nháy đơn và nháy kép khớp Pāli từng khoá (93 khoá, 0 lệch); dấu lược `…` cân bằng Pāli ở mọi khoá (…pe… = một `…`; `…` trần giữ nguyên; 0 lệch); NFC; không khoá rỗng; không khoảng trắng thừa; không từ Pāli lọt vào ngoài tên riêng (Naḷakapāna, Sāriputta, Uposatha, palāsa). In cặp Pāli↔Việt cả 93 khoá và đọc từng khoá. Số Pāli trong bài: `catugguṇaṁ` = *gấp bốn* (catu 4 + guṇa, tức bốn lớp) và `sattamaṁ` = *thứ bảy* (7); các số khác không có, không số lớn.
  Đợt này bị cấm chạy cổng của kho, nên `technical_integrity` đặt 9.6 chứ không phải 10.0 và không tuyên bố technical gate pass; còn phải chạy: npm run validate; npm test; npm run check; npm run build.
