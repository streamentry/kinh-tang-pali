notes: |-
  Đợt 19, lát 39. 152 khoá, đủ mọi khoá của Pāli (152/152, 0 khoá thừa), thứ tự khoá đúng thứ tự Pāli.

    **Coverage English (mẫu số 140 khoá Pāli có nội dung, từ 40 ký tự, bỏ các khoá tiêu đề `:0.x`): Sujato phủ 128/140 = 0,914 (trên ngưỡng 0,80).** 12 khoá Sujato để trống: 4.3, 4.6, 5.1, 5.2 (lần kể lại thứ hai, Sujato nối bằng dấu lược) và tám khoá kết khuôn `Ayaṁ kho, sīha, pariyāyo…` lặp ở 17.6, 18.6, 19.6, 20.6, 21.6, 22.7, 23.6, 24.5. Đó là chỗ trống thật của bản đã ghim, không phải sự đồng thuận về cách dịch; các khoá này được dựng lại từ Pāli trùng nguyên văn trong chính bài (8.2 = 9.2 = 17.6 …) và đối với 4.3/4.6/5.1/5.2 từ khoá lần thứ nhất (2.3, 2.6, 3.1, 3.2). Bài chưa có lớp english-project, tầng vietnamese-current vắng ở commit đã ghim (chỉ Pháp Cú), nên toàn bộ coverage là của Sujato, một bản độc lập. Bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục tra cứu toàn văn chỉ được đọc để đối chiếu thuật ngữ, không phải tầng căn theo khoá, và không dùng để chép câu.

    **Pāli trùng nguyên văn trong chính bài: 15 nhóm, 91 cặp, 0 cặp mà bản Việt khác nhau.** Gồm cặp lặp lần thứ hai và thứ ba (2.4=4.4, 2.5=4.5, 2.6=4.6, 3.1=5.1, 2.3=6.3), nhóm câu mở lời đáp `Atthi, sīha, pariyāyo…` (9.1, 10.1 … 16.1: 8 khoá), nhóm `Katamo ca, sīha, pariyāyo…` (17.1 … 24.1: 8 khoá), nhóm `Ayaṁ kho, sīha, pariyāyo…` (17.5 … 24.4: 8 khoá) và khoá nhắc lại lời buộc tội (8.2=9.2=17.6, 10.2=18.6, …). Hai khoá Pāli chỉ khác một dấu phẩy (3.2 và 5.2) cũng được dịch giống nhau.

    **Dùng lại tầng đã dịch (Pāli trùng nguyên văn với bài khác):** 16 khoá của bài có Pāli trùng nguyên văn với bài khác, tổng 112 cặp đã dò, trong đó 80 cặp bản Việt khác bản tôi (phần lớn do tầng đang xen hai ba cách cho cùng công thức; tôi chọn dạng nhiều nhất hoặc dạng gần nhất trong bộ). Dùng lại nguyên văn một dạng đã có: 29.3 (`Đức Thế Tôn im lặng nhận lời.`, 14 trong 32 cặp, dạng nhiều nhất); 28.4 (`khổ, tập, diệt, đạo.`, theo dn14:3.11.4, 3 trong 5 cặp trùng nguyên văn, và an8.21:4.5, an8.22:4.5, Pāli chỉ khác dấu phẩy); 28.5 (2 trong 10 cặp, theo an8.21, an8.22); 25.2 (2 trong 3 cặp); 29.2 (2 trong 4 cặp, theo dn16); 30.4 (3 trong 5 cặp); 1.1 (an8.44 và an8.70, 2 trong 24 cặp: tôi chọn dạng gần nhất trong bộ an8 thay cho `Một thời, Đức Phật ở Vesālī…` là dạng nhiều nhất, 8 trong 24 cặp, vì cả an8.11 của đợt này và 150 chỗ `Đức Thế Tôn` so với 113 chỗ `Đức Phật` trong an8 đều viết `Đức Thế Tôn`); 25.3 và 26.7 (1 trong 2 và 2 trong 9 cặp, giữ cho đồng nhất ba lần xin làm cư sĩ trong bài). Khác tiền lệ có chủ ý: 28.7 (`Bất cứ pháp nào có tính sinh khởi thì tất cả pháp ấy đều có tính chấm dứt` theo mn56:18.7; dạng `đoạn diệt` là dạng nhiều nhất, 6 trong 11 cặp, nhưng trong bài này `đoạn diệt` đã dùng cho `uccheda`, nên giữ `chấm dứt` cho `nirodha` để hai khái niệm không trùng chữ); 7.3 và 25.1 (tiền lệ an5.34:1.2, an5.34:7.1 viết `Đức Phật`, `hỏi`, `nói với`; ở đây giữ `Đức Thế Tôn` và `thưa với` cho đồng nhất trong bài); 26.6, 27.11 (mn56:16.7 dịch `Đức Phật, Giáo Pháp và Tăng chúng tỳ-kheo`; ở đây theo dạng nhiều nhất của công thức `bhagavantaṁ saraṇaṁ gacchāmi dhammañca bhikkhusaṅghañca`: `quy y Thế Tôn, quy y Pháp và quy y Tăng chúng tỳ-kheo`, dạng nhiều nhất khi đối tượng quy y là Thế Tôn, 7 trong 26 cặp của công thức).

    **Hai bài song song đã dùng làm tiền lệ, đếm được:** (a) an8.11 (Verañja) có cùng bộ sáu lời buộc tội và cùng câu đáp `Ahañhi … vadāmi`: `akiriyavādo` → `người chủ trương không hành động`, `ucchedavādo` → `người chủ trương đoạn diệt`, `jegucchī` → `người hay ghê tởm`, `venayiko` → `người chủ trương tiêu diệt`, `tapassī` → `người khổ hạnh`, `apagabbho` → `người không nằm thai`; các khoá 20.3–20.4, 22.3–22.5, 23.3–23.4 dùng lại câu của an8.11:7.4, an8.11:9.4–9.6, an8.11:10.4–10.5 chỉ đổi lời xưng hô. (b) mn56 (Upāli) có cùng chuỗi ba lần quy y, `Anuviccakāraṁ kho … karohi` và `Dīgharattaṁ kho te … opānabhūtaṁ kulaṁ`, và mn55 (Jīvaka) có câu buộc tội ăn thịt làm riêng cho mình; 26.1 theo mn56:16.1, 31.4 và 32.5 theo mn55:3.2 (`biết rõ thịt ấy được làm riêng cho mình mà vẫn ăn; đó là hành động do Ngài mà có`), 8.3 theo mn55:3.3.

    **Số trong bài, tự tính:** 7.1 `pañcamattehi rathasatehi` = pañca 5 × sata 100 = 500, với `matta` là `khoảng` (cùng cấu tạo với mn35:5.1 `pañcamattāni licchavisatāni`, tầng viết `khoảng năm trăm`): `khoảng năm trăm cỗ xe`. Lần kể lại: `Dutiyampi` thứ hai (4.1, 4.2, 5.3, 26.6), `Tatiyampi` thứ ba (6.1, 6.2, 27.11); ba lần quy y 25.3, 26.7, 27.12 khớp. Tám lời buộc tội (9.2 … 16.2): không hành động, hành động, đoạn diệt, ghê tởm, tiêu diệt, khổ hạnh, không nằm thai, an ủi = 8, và tám câu đáp 17–24. Không có cụm số chưa phân xử được (không có `Tiṁsakappasahassa`).

    **Thuật ngữ có đếm:** `Tướng Quân Sīha` (an5.34, an7.57: 5 khoá có `sīho senāpati`; tiêu đề tầng viết `Kinh Với Tướng Quân Sīha`, bài này `Kinh Tướng Quân Sīha`); `nigaṇṭha` → `Nigaṇṭha` giữ nguyên tên (mn56, mn58, sn42.9: `Nigaṇṭha Nāṭaputta`); `abhiññātā abhiññātā licchavī` → `rất nổi tiếng` (an10.72, cùng Đại Lâm Vesālī; dn24 dùng `rất có danh tiếng`); `santhāgāra` → `hội trường` (21 khoá, đa số); `anekapariyāyena buddhassa vaṇṇaṁ bhāsati` → `dùng nhiều cách để tán thán Phật` (dn1, 4 khoá); `paṭippassambhi` → `lắng dịu` (39 khoá chứa `paṭippassambh`, dn16:2.24.2 `lắng dịu`); `aññatitthiyā` → `ngoại đạo` (238 khoá, đa số `du sĩ ngoại đạo`); `arahaṁ sammāsambuddho` → `A-la-hán, Chánh Đẳng Giác` (210 khoá `A-la-hán`, 95 `A-la-hán Chánh Đẳng Giác`); `tālāvatthukatā` → `làm như gốc chà là` (theo an8.11); `pahīnā ucchinnamūlā` → `đã được từ bỏ, chặt tận gốc`; `vesārajjappatto` (25 khoá), `diṭṭhadhammo …` (8 khoá) theo an8.21, mn56; `sāvake vineti` → `huấn luyện các đệ tử` (7 khoá); `kālaṁ ārocāpesi` → `báo giờ` (10 khoá); `upakaṇṇake ārocesi` → `thưa nhỏ vào tai` (sn3.16:1.3, 1 khoá, tiền lệ duy nhất); `rathikāya rathikaṁ siṅghāṭakena siṅghāṭakaṁ` → `từ phố này sang phố khác, từ ngã tư này sang ngã tư khác` (14 khoá, đa số).
    Đặt mới, không có tiền lệ (0 khoá cho dạng Pāli này): `gamiyābhisaṅkhāro … paṭippassambhi` → `quyết tâm lên đường … đã lắng dịu`; `pavattamaṁsaṁ jānāhi` → `xem có thịt sẵn có không`; `jiridanti` → `không biết chán`; `thūlaṁ pasuṁ` → `một con thú lớn`; `Alaṁ ayyo` → `Thôi đi, thưa ông`; `kiriyaṁ vadāmi` → `Ta nói đến việc làm`; `assāsako paramena assāsena` → `người an ủi bằng sự an ủi tối thượng`.

    Bất định đã ghi lại (không đưa vào thân kinh):
      (1) `akiriyāya dhammaṁ deseti` và bảy cụm cùng dạng dùng một dạng thuộc cách chỉ mục đích (`akiriyāya`, `kiriyāya`, `ucchedāya`, `jegucchitāya`, `vinayāya`, `tapassitāya`, `apagabbhatāya`, `assāsāya`). Dịch `thuyết pháp về …` (cách Hòa thượng Thích Minh Châu và Sujato đều dùng), thống nhất tám lần; riêng 21.3–21.4 `vinayāya … rāgassa dosassa mohassa` có thể hiểu `để tiêu diệt tham, sân, si` như an8.11:8.4 (`Ta thuyết pháp để tiêu diệt`); chọn `về sự tiêu diệt` để lời buộc tội ở 21.2 và lời đáp ở 21.4 mang đúng cùng một cấu trúc.
      (2) `assāsako` (24.2–24.5): dịch `người an ủi`, `assāsāya` `sự an ủi`, theo Pāli (`assāsa` là sự an ủi, sự nhẹ lòng). Bản Sujato dịch `ambitious … solace`, nghĩa thứ nhất không có gốc trong `assāsa`; không theo.
      (3) `pavattamaṁsaṁ` (30.2): hiểu `thịt sẵn có`, tức thịt đã có người bán hay đã làm sẵn (Sujato `ready for sale`; Hòa thượng Thích Minh Châu `thịt tươi`). Không có tiền lệ trong tầng; nghĩa này khớp mạch kể vì ngay sau đó các Nigaṇṭha buộc tội Tướng Quân giết thú để dâng cơm.
      (4) `jiridanti` (32.7): từ hiếm, đọc là `không biết chán/mệt` (Sujato `never stop`); tầng chưa có tiền lệ, nên ghi ra đây.
      (5) `opānabhūtaṁ kulaṁ` (27.1, 27.3): giữ hình ảnh `như giếng nước cho các Nigaṇṭha` (nơi ai đến cũng có nước uống); Sujato `well-spring of support`, mn56:17.1 dịch lệch sang `nguồn hỗ trợ`.
      (6) `gamiyābhisaṅkhāro` (3.3, 5.3): hiểu `quyết tâm lên đường` (Sujato `determination to go`); không có tiền lệ.
      (7) `thūlaṁ pasuṁ` (31.3, 32.4): `thú lớn`, không rõ loài vật; Sujato đọc `fat calf` (con bê béo), Pāli chỉ nói `pasu` là gia súc, không nói bê.
      (8) Dấu nháy của khoá 32.2–32.8: giữ đúng dấu của Pāli từng khoá. Nháy kép mở ở 32.2 và chỉ đóng ở 32.8, nên lời của người báo tin (32.2–32.5) và lời đáp của Tướng Quân (32.6–32.8) nằm chung một cặp nháy; đó là cách Pāli ghim, không phải lỗi của bản dịch.
      (9) 28.7: tầng đang xen hai cách, `đoạn diệt` (6 trong 11 khoá), `chấm dứt` (4 khoá) và `hoại diệt` (1 khoá). Chọn `chấm dứt` như mn56:18.7; lý do ở trên.

