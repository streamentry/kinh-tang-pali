notes:
  - >-
    Bài mười phẩm, phiên bản **giải thoát**: mục thứ chín là chứng nghiệm tám sự
    giải thoát bằng thân. **Bố cục khác hai bài kia**: không có mục hai phẩm rút
    gọn ở đầu, nên cả mẫu mười phẩm nằm ngay ở mục 1.
  - >-
    **`ye te santā vimokkhā atikkamma rūpe āruppā` dùng nguyên văn
    `mn69:18.1`**: *những giải thoát trầm lặng vượt khỏi sắc, thuộc vô sắc* (13
    segment). `kāyena phusitvā viharati` → *chứng nghiệm bằng thân …* theo
    `an4.87:3.2` (*chứng nghiệm bằng thân tám sự giải thoát*).
  - >-
    **Một sửa lớn so với bản đầu:** cụm Pāli `… viharati, no ca āsavānaṁ khayā …
    upasampajja viharati` có **hai** `viharati`, và dịch máy móc thành *… và
    sống, mà không … và sống* trong cùng một câu — nghe như lỗi. Đã dùng *rồi
    sống* cho `viharati` đầu, giữ *và sống* cho `viharati` sau. Pāli vẫn cả hai
    `viharati`, nên không mất nghĩa.
  - >-
    `āraññiko pantasenāsano` → *sống trong rừng, ở nơi xa vắng* theo `mn5:29.1`
    (46 segment tiêu lệ). `parisāvacaro` → *quen hội chúng* (`dn25:5.3`);
    `visārado` → *tự tin* (`an4.7:1.3`); `vinayadharo` → *giữ gìn Giới*
    (`an4.180:8.2`).
  - >-
    **`samantapāsādiko`/`sabbākāraparipūro`** dùng đúng như `an10.8` — cùng hai
    cụm, cùng cách dịch, để chương đọi nhất quán.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
