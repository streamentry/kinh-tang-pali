notes: |-
  Đã đọc hết lát `vc/p46.txt` trước khi viết; dùng `pre` = `an7.54:`.
  **Coverage Anh Sujato: 31/31 = 100%** trên Pāli có nội dung; ngoài ra 7/8 khoá < 40 ký tự có prose. Tầng Việt hiện hành vắng ở commit đã ghim (26 tệp, toàn bộ là Pháp Cú) — giới hạn snapshot upstream. `budsas.org` chỉ là tra cứu toàn văn.
  **3 khoá có Pāli trùng nguyên văn ở bài khác; 2 cặp dùng lại NGUYÊN VĂN.** `0.2` trùng byte-for-byte `an7.60:0.2` (cùng phẩm Abyākatavagga) · `5.8` theo đa số lớp `an` cho `Paṭhamaṁ.` (130/130 lần *Thứ nhất.*). `1.1` trùng byte-for-byte `mn21:3.1` nhưng bản đó kết bằng dấu hai chấm còn Pāli khoá này kết bằng dấu chấm, nên chỉ dịch lại phần đuôi.
  **Thuật ngữ có 0 tiền lệ trong lớp `an` — đã ghi để người gộp lát biết:** `tathāgato paraṁ maraṇā` (0 khoá `an` đã dịch chứa cụm này), `diṭṭhinirodha`, `diṭṭhisamudaya`, `vippaṭisāro`, `taṇhāgatametaṁ / saññāgatametaṁ / maññitametaṁ / papañcitametaṁ / upādānagatametaṁ`, `na chambhati, na kampati, na vedhati, na santāsaṁ āpajjati`. Lựa chọn đã chốt: `tathāgata` → **Như Lai** (theo `content/glossary/pali-vi.yaml`, `preferred: Như Lai`) · `ariyasāvako sutavā` → **vị đệ tử Thánh đa văn** (6 tiền lệ nguyên văn trong `an`, ví dụ `an5.x`) · `assutavā puthujjano` → **kẻ phàm phu ít nghe** (theo glossary `assutavant`) · `diṭṭhi` → **kiến chấp** · `vippaṭisāra` → **sự hối tiếc** · `vicikicchā` → **nghi hoặc** (theo glossary).
  **Bốn chữ đối đáp `…tapi na byākaroti` giữ nguyên vế phủ định kép:** *vừa còn tồn tại vừa không còn tồn tại* và *không hề còn tồn tại cũng không hề không còn tồn tại*; không lược bớt vì dài.
  **Dấu lược:** `4.1`–`4.5` mỗi khoá một `…`; `5.2` có **hai** dấu (`…pe…` + `…`), bản nháp đầu tiên ghi ba — đã sửa theo đếm lại.
  **Lỗi bắt được ở lượt review đối kháng, đã sửa:** `1.2` bản nháp lặp *nguyên nhân là gì, duyên là gì, khiến cho* rồi thiếu động từ; đã viết lại *do nguyên nhân gì, do duyên gì, mà* cho đúng nhịp tiếng Việt mà không thêm ý.
  **Bất định đã ghi:** `neva hoti na na hoti` — đọc là phủ định kép của *không hề có lẫn không hề không*, đã dịch thành cặp *không hề còn tồn tại cũng không hề không còn tồn tại*; Sujato đọc *neither still exists nor no longer exists*, cùng nghĩa.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
