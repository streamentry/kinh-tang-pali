notes:
  - >-
    `asekho` → "vô học", theo 8 lần trong corpus. `sikkhākāma` không có tiền lệ
    nên dịch "có lòng muốn học". Đây là bài có **khung văn xuôi** ("Bấy giờ, một
    vị tỳ-kheo đi đến gần Đức Thế Tôn") giữa cụm toàn bài liệt kê, nên dịch theo
    kiểu văn xuôi chứ không theo mẫu liệt kê.
  - >-
    Thuộc cụm *AN 10 chương 11, Phẩm Niềm Tưởng Sa-môn*. Chương này dùng công
    thức khác chương 13: mở bằng `Dasayimāni`/`Dasayime` + `Katame dasa?` rồi
    liệt kê, thường kết bằng `…pe…` mà Pāli tự lược. Những segment Pāli giống
    hệt nhau đã dùng lại đúng cách dịch đã chốt, không dịch lại mỗi bài một
    kiểu.
  - >-
    Thuật ngữ bám theo số đo trên toàn corpus, không phải sở thích: `sammā-` →
    "chánh …"; `micchā-` → "tà …"; `samaṇa` → "Sa-môn" (1.034 lần); `bojjhaṅgā`
    → "bảy giác chi"; `Katamā tisso?` → "Thế nào là ba?"; `Dasamaṁ.` → "Thứ
    mười." (~90 lần mỗi thứ tự); `bhāvanāpāripūri` → "sự viên mãn của sự tu tập"
    (`mn149`).
  - >-
    Hai thuật ngữ cố ý không theo `an4.205`/`an4.206`: `micchāājīvo` → "tà mạng"
    (12 lần) chứ không phải "tà mệnh" (0 lần ngoài hai file đó), và
    `micchāñāṇaṁ` → "tà trí" (7 lần) chứ không phải "tà tri". `ājīva` là *sinh
    tài* còn "mệnh" là *số phận*. Xem `docs/translation-notes/terminology-
    micchatta-list.md`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
