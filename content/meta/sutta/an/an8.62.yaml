  **Coverage tầng Anh đo được: 58/58 khoá Pāli có nội dung = 1,0000.** Công thức `source/layers.yaml` (`substantivePaliMinChars: 40`, `excludeReferenceBlock: true`, `floor: 0.8`): mẫu số là 58 khoá Pāli dài từ 40 ký tự trở lên, bỏ khối `:0`; 18 khoá còn lại (bốn khoá tiêu đề `:0.*`, các câu hỏi `Katamehi …?`, `Dutiyaṁ.` và những khoá 39 ký tự như `sutānañca dhammānaṁ dhāraṇajātiko hoti;`) nằm ngoài mẫu số. Tầng `english-sujato` phủ **58/58**; toàn bài 76 khoá chỉ khoá `8.10` (`Dutiyaṁ.`) trống bên Sujato và khoá đó không vào mẫu số. Đường tệp `sutta/an/an8/an8.62_translation-en-sujato.json` có trong `source/upstream-manifest.json` tại commit `11c9d708978cde8ba61096d8a75f7ddfb846f639` và git-object hash của tệp đã tải khớp giá trị manifest (bbd6ba33…acab0); tệp Pāli `an/an8/an8.62_root-pli-ms.json` cũng khớp (825e21b8…). Không có lớp `english-project` cho uid này, nên `triangulation` đọc được như thật: cả 58 khoá mẫu số đều có chữ Sujato độc lập. Tầng `vietnamese-current` tại commit đã ghim chỉ có 26 tệp Pháp Cú ⇒ **không** có bản Hòa thượng Thích Minh Châu ở lớp store cho bài này. Tôi có đọc bản nguyên bài của Hòa thượng Thích Minh Châu ở mục tra cứu toàn văn (SuttaCentral, bản không phân đoạn) để đối chiếu thuật ngữ, nhưng nó không phải tầng store và không cấp chữ cho cột nào.

  **Cấu trúc bài là lưới tám khối, kiểm từng khối từ cờ phủ định trong Pāli chứ không theo trí nhớ.** Mỗi khối có sáu mệnh đề nền: (a) `khippanisanti` · (b) `sutānaṁ dhammānaṁ dhāraṇajātiko` · (c) `dhātānaṁ dhammānaṁ atthūpaparikkhitā` · (d) `atthamaññāya … dhammānudhammappaṭipanno` · (e) `kalyāṇavāco …` · (f) `sandassako …`; (a)–(d) thiên về lợi ích của chính mình, (e)–(f) thiên về lợi ích của người khác. Đếm các mệnh đề **không** bị phủ định ở từng khối: khối 1 = 6 (a–f) · khối 2 = 5 (b–f; (a) phủ định) · khối 3 = 4 (a–d; (e)(f) phủ định) · khối 4 = 4 (a, b, e, f; (c)(d) phủ định) · khối 5 = 3 (b, c, d) · khối 6 = 3 (b, e, f) · khối 7 = 2 (c, d) · khối 8 = 2 (e, f). Tám con số này khớp từng số Pāli đã dịch (`Chahi`=6, `Pañcahi`=5, `Catūhi`=4, `Catūhi`=4, `Tīhi`=3, `Tīhi`=3, `Dvīhi`=2, `Dvīhi`=2), và hướng lợi ích (`alaṁ attano` / `alaṁ paresaṁ` / `nālaṁ …`) khớp với tập mệnh đề còn lại ở cả 8/8 khối: nhóm (a–d) còn ⇒ đủ cho mình, nhóm (e–f) còn ⇒ đủ cho người khác.

  **Số Pāli: `chahi` 6 · `pañcahi` 5 · `catūhi` 4 · `tīhi` 3 · `dvīhi` 2 · `Dutiyaṁ` = thứ hai.** Không có số lớn, không có `sahassa`, `sata`, `navuti`, `tālīsa`, `kappa`. Phép tính là đếm số mệnh đề (a–f) không bị phủ định ở từng khối như trên, đối chiếu với `Katamehi X?` và với `Imehi kho … X dhammehi`. Phép đo số máy trên từ khoá đã xác lập có hiệu chuẩn in 9/9 OK nhưng ở bài này **mẫu số bằng 0** (không từ khoá nào của bảng xuất hiện) ⇒ phép đó không đo được gì, các số trên là tôi tự tính. `Dutiyaṁ.` → *Thứ hai.*: 266/270 tiền lệ cùng Pāli (4 dạng khác: *Bài thứ hai.* 2, *Kinh thứ hai.* 2).

  **Pāli trùng nguyên văn trong chính bài: 66 cặp đã dò, 0 cặp bản Việt khác.** Công thức (a)–(f) lặp lại nguyên văn qua các khối, và bản Việt dùng đúng một cách dịch cho mỗi dạng; hai dạng khác nhau chỉ ở `no`/`na` (`4.6` `na ca …` và `6.6` `no ca …`) cũng cho cùng một câu Việt. Tiền lệ trùng Pāli với phần còn lại của tầng: chỉ các khoá công thức. `0.2` → *7. Phẩm Đất Nền* (8/8 trùng byte, an8.61–69). `Katamehi X?` (`1.2`…`8.2`, 8 khoá): tiền lệ tầng cho `catūhi` 67/84 *Thế nào là bốn?*, `tīhi` 55/60 *Thế nào là ba?*, `pañcahi` 116/164 *Thế nào là năm?*; nhưng `chahi` chia *Là sáu nào?* 17 · *Với sáu nào?* 15 · *Là sáu pháp nào?* 6 · *Thế nào là sáu?* 1, và `dvīhi` chia *Là hai nào?* 6 · *Hai pháp ấy là gì?* 5 · *Với hai nào?* 4 · *Thế nào là hai?* 1. **Hai phạm vi cho đa số khác nhau.** Tôi dùng *Thế nào là X?* thống nhất cho cả năm số vì cùng một công thức Pāli `Katamehi X?` nên cùng một câu Việt trong một bài, và đó là đa số rõ ở ba trong năm số; hai số còn lại tôi chọn theo tính nhất quán nội bài, không theo đa số riêng của chúng. Nếu người biên tập muốn theo đa số riêng thì phải đổi cả hai chỗ `1.2` và `7.2`/`8.2`.

  **Tiền lệ gần nhất cho thân bài: an4.97 (cùng dãy bốn thuộc tính, Pāli `dhārakajātiko` / `atthūpaparikkhī`) và an5.87 / an5.166 (cùng khoá `kalyāṇavāco … anelagaḷāya … viññāpaniyā`, đúng dạng chính tả có `ḷ`).** Từ đó tôi lấy: `dhāraṇajātiko` → *là người dễ dàng ghi nhớ các pháp đã nghe* (an4.97 viết đúng cụm này cho `dhārakajātiko`); `atthūpaparikkhitā` → *là người khảo sát nghĩa của các pháp đã ghi nhớ* (an4.97 cho `atthūpaparikkhī`); khoá `kalyāṇavāco … viññāpaniyā` → *người nói lời tốt đẹp, lời nói khéo léo, đầy đủ lời nói trau chuốt, rõ ràng, thanh thoát, không ngập ngừng, và thể hiện được nghĩa* (an5.87 `1.5` và an5.166 `14.6`: 4 khoá cùng Pāli có `ḷ`); `sandassako samādapako samuttejako sampahaṁsako sabrahmacārīnaṁ` → *hướng dẫn, khích lệ, khuấy động, làm hoan hỷ các đồng phạm hạnh* (an4.97 `3.3` / `5.3`, 4 khoá). Đây là dùng lại thuật ngữ chứ không phải dùng lại nguyên khoá — các khoá Pāli ở đây khác dạng.

  **Thuật ngữ, kèm số đếm (đếm trên toàn tầng Việt đã dịch).**
  - `samannāgato` trong khuôn `X dhammehi samannāgato bhikkhu`: *đầy đủ* 61 · *thành tựu* 5 (khoá mở), và ở khoá `Imehi kho …` *đầy đủ* 101 · *thành tựu* 5. Tôi theo *đầy đủ*.
  - `alaṁ` → *đủ*, `nālaṁ` → *không đủ*. Tiền lệ gần: an4.262 *đủ khả năng* / *không đủ khả năng*, an5.124 và an5.127 *không đủ tư cách*, an5.65 và an5.66 *đủ tư cách* (4 khoá, các khoá này là hợp chất `alaṁsākaccho`, `alaṁsājīvo` hay động từ nguyên thể, khác khuôn này). Ở đây `alaṁ` đứng với **sở hữu cách** (`attano`, `paresaṁ`), không có động từ nguyên thể nên *đủ tư cách làm gì* không áp được; Sujato dịch *good enough for*, Hòa thượng Thích Minh Châu *vừa đủ cho*. Tôi chọn *đủ cho mình* / *đủ cho người khác*, bỏ chữ *vừa* vì trong tiếng Việt hiện đại *vừa đủ* thường nghĩa là *vừa khít, không dư*, hẹp hơn Pāli. **Bất định cần người biên tập phán:** Pāli không nói rõ *đủ* ở đây là đủ để làm gì (đủ để đạt lợi ích, đủ để đứng vững, hay đủ về mặt phẩm chất); Chú giải thường hiểu là *đủ năng lực làm lợi ích cho mình/người*, nhưng đó là tầng hậu kỳ và tôi không đưa vào thân kinh.
  - `khippanisanti` → *có trí nhanh nhẹn* (an5.169, 2 khoá cùng khuôn `khippanisanti ca hoti kusalesu dhammesu`); an4.97 dùng *bậc nhanh và sắc bén*; Sujato *quick-witted*. Dạng phủ định `na heva kho khippanisanti ca hoti` (1 tiền lệ ở an4.97 `3.2`, *không phải là bậc nhanh và sắc bén*) → *không phải là người có trí nhanh nhẹn*. Ý nghĩa nhấn của `na heva kho` (*không hẳn / hoàn toàn không*) Sujato và Hòa thượng Thích Minh Châu đều không dịch riêng; tôi cũng không thêm chữ nhấn.
  - `dhātānaṁ dhammānaṁ` → *các pháp đã ghi nhớ*: 5 khoá có cụm Pāli này ở tầng (an4.97 `3.2`, an5.154 `1.3` và `2.3`, an8.82 `1.11`, an9.19 `3.7`), đều dịch *các pháp đã ghi nhớ* hoặc *đã gìn giữ*.
  - `dhammānudhammappaṭipanno` → *thực hành pháp và tùy pháp*: tiền lệ **26** khoá dùng đúng *pháp và tùy pháp*, 8 khoá *pháp tùy pháp*, 8 khoá *phù hợp với giáo pháp ấy*, 4 khoá *phù hợp với pháp*, 1 khoá *pháp tùy theo pháp*. Tôi theo dạng 26.
  - `bhikkhu` → *vị tỳ-kheo*, `bhikkhave` → *này các tỳ-kheo*: dạng đã chuẩn trong tầng. `Idha, bhikkhave, bhikkhu …` → *Ở đây, này các tỳ-kheo, vị tỳ-kheo …*.
  - `7. Bhūmicālavagga` → *7. Phẩm Đất Nền*: 8/8 tiền lệ cùng Pāli trong an8; Sujato dịch *Earthquakes*, không dùng.
  - `Alaṁsutta` → *Kinh Đủ* (translationTitle). Hòa thượng Thích Minh Châu *Vừa Đủ*, Sujato *Good Enough*. Tiêu đề các bài anh em trong an5 mang chữ `alaṁ` (`Alaṁsākaccha` → *Kinh Hỏi Luận*, `Alaṁsājīva` → *Kinh Đồng Sống*) đều **bỏ** chữ `alaṁ`, nên không có tiền lệ nào cho cách dịch tên này; tôi giữ chữ *đủ* cho khớp thân bài. **Cần người điều phối phán** nếu muốn dùng *Vừa Đủ* theo truyền thống.

  **Hai điểm phạm vi mà Pāli cho phép đọc hai cách, tôi chọn cách ít giả định nhất:**
  1. **Phạm vi của `no ca` ở `3.7`, `5.7` (khoá `kalyāṇavāco`).** Pāli có **một** phủ định `no ca` đứng trước toàn bộ mệnh đề `kalyāṇavāco hoti kalyāṇavākkaraṇo, poriyā vācāya samannāgato vissaṭṭhāya anelagaḷāya atthassa viññāpaniyā`. Sujato đọc thành *not a good speaker and do not enunciate well. Their voice isn't polished, clear, articulate, and doesn't express the meaning*, tức phân phối phủ định ra từng vế. Bản Việt giữ **một** `không phải là người` đứng trước, rồi giữ nguyên danh sách thuộc tính ở dạng khẳng định (*… trau chuốt, rõ ràng, thanh thoát, không ngập ngừng, và thể hiện được nghĩa*), để cụm *không ngập ngừng* (phủ định nằm **trong** thuộc tính, `anelagaḷāya`) không bị lẫn với phủ định ngoài. Hệ quả: câu đọc là *không phải là người có đầy đủ các thuộc tính này*, chứ không nói rõ người ấy thiếu **từng** thuộc tính; đây là phạm vi đọc nghiêng về nghĩa **kết hợp** hơn nghĩa **phân phối**.
  2. **Phạm vi của `na ca atthamaññāya dhammamaññāya dhammānudhammappaṭipanno hoti` (`4.6`, `6.6`, `8.6`; `6.6`/`8.6` dùng `no ca`).** Hình thức Pāli là *không phải* [người, sau khi hiểu nghĩa, hiểu pháp, thực hành pháp và tùy pháp]. Sujato đọc *Not understanding the meaning and the teaching, they don't practice in line with the teaching* (phủ định hạ xuống thành *không hiểu*); Hòa thượng Thích Minh Châu nguyên bài ở khối 4 viết *không có sau khi hiểu nghĩa, sau khi hiểu pháp, thực hành pháp, tùy pháp*, tức giữ cấu trúc phủ định ngoài. Bản Việt giữ phủ định **ngoài**: *không phải là người, sau khi hiểu nghĩa, hiểu pháp, thì thực hành pháp và tùy pháp*. Nó khớp Pāli ở chỗ phủ định chưa rút gọn thành *không hiểu*; cả hai cách đọc cùng dẫn đến một kết luận (vị ấy không phải người thực hành đúng pháp, vì thiếu thuộc tính (d)), nên hệ quả giáo nghĩa không đổi, nhưng tiền lệ an4.6 `1.10` (*không hiểu nghĩa, không hiểu pháp, và không thực hành phù hợp với nghĩa pháp*) dùng cách đọc hạ phủ định. Một mình tôi không phân xử được hai cách đọc bằng Pāli, nên ghi ở đây.

  **Tầng Anh đã ghim ở bài này: không phát hiện sai sót đáng kể.** Số lượng mệnh đề, hướng lợi ích, dấu lược đều khớp. Hai ghi nhận nhỏ: (i) Sujato dịch `kalyāṇavāco ca hoti …pe… atthassa viññāpaniyā` (`2.7`, `4.7`, `6.7`) thành câu đầy đủ (*They're a good speaker. Their voice is polished, clear, articulate, and expresses the meaning.*), tức **mở rộng dấu lược**; ở `4.7` thậm chí giữ cả *who enunciates well* của `kalyāṇavākkaraṇo` mà `2.7` và `6.7` bỏ, nên bản Anh tự lệch nhau về mức mở rộng; (ii) Sujato dịch `anelagaḷāya` thành *articulate*, trong khi tầng Việt có tiền lệ *không ngập ngừng* (an5.87) và an4.97 *lưu loát* — tôi theo an5.87 vì cùng chính tả Pāli `ḷ`.

  **Dấu lược: Pāli `…pe…` ↔ Việt đúng một `…` ở cả 6/6 khoá** (`2.7` · `4.7` · `4.8` · `6.7` · `7.7` · `7.8`). Pāli 0 `…` trần, 0 `(…)` ↔ Việt 0. Việt không có `…` ở khoá nào mà Pāli không có. Hai khoá có `…pe…` giữa một vế đã dịch (`4.7`: `kalyāṇavāco ca hoti kalyāṇavākkaraṇo …pe… atthassa viññāpaniyā` → *… lời nói khéo léo … thể hiện được nghĩa*) giữ phần đã nêu của Pāli, bỏ phần được lược, và không bung dấu lược thành văn. Nháy kép: mở `“` ở `1.1`, đóng `”ti` ở `8.9`; Pāli 0 nháy đơn. Kiểm theo từng khoá: **0 lệch / 76**.

  **Chưa chạy bốn cổng của kho** (bị cấm trong lát này), nên không tuyên bố technical gate pass và `technical_integrity` đặt 9,6: `npm run validate` · `npm test` · `npm run check` · `npm run build`. Các kiểm tự viết đều sạch: tập khoá 76/76 và đúng thứ tự Pāli · nháy 0 lệch · 66 cặp Pāli trùng nội bộ 0 cặp lệch · dấu lược 6/6 · NFC sạch · không khoá rỗng · không ký tự Pāli lọt sang bản Việt · cấu trúc tám khối khớp 8/8 (số mệnh đề không phủ định = số Pāli, hướng lợi ích đúng).
