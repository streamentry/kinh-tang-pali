notes: |-
  Dịch từ Pāli root tại commit đã ghim, đủ 68/68 khoá (30 khoá có nội dung ≥40 ký tự). COVERAGE ĐO THẬT: `english-sujato` phủ 30/30 khoá Pāli có nội dung = 1.000 (ngưỡng 0.8 trong `source/layers.yaml`); không có tệp `english-project` cho bài này và cũng không cần, nên mọi đối chiếu Anh là bản Bhikkhu Sujato đã ghim, độc lập với người dịch. Khoá duy nhất Sujato để trống là 16.5 (colophon `Paṭhamaṁ`, dưới ngưỡng). Tầng `vietnamese-current` không có ở mức segment (bilara chỉ có Pháp Cú); bản Việt nguyên bài của Hòa thượng Thích Minh Châu (SuttaCentral, không phân đoạn) đã đọc đối chiếu nhưng chỉ làm tra cứu toàn văn, không tính vào coverage: bản ấy gộp cả bài thành ba đoạn, dẫn lại phần mở đầu của kinh 119 và lược mười món theo mẫu, nên không đối chiếu được từng khoá.
  TIỀN LỆ ĐÃ ĐO. Tầng + vùng gần (an10.168–171, an3.58, an3.59): 30/68 khoá có Pāli trùng nguyên văn ở bài khác, 606 cặp đã dò, 145 cặp bản Việt khác. Phần lớn lệch là do `5.3` `Bhagavā etadavoca` (207 cặp; 109 `Đức Phật nói:` · 22 `Đức Thế Tôn nói:`, chọn đa số), do dấu nháy đóng/mở ở `16.3`–`16.4` và do `16.5` (301 `Thứ nhất.`). Dùng lại nguyên văn: 0.1 (khuôn `Aṅguttara Nikāya 10.x` của bộ), 0.2 `17. Phẩm Vua Jāṇussoṇi` (7/7 cặp; xem bất định), `5.1` (đa số 2/5 `ông hãy nghe và suy nghĩ cho khéo; Ta sẽ nói`), `5.3`, `6.3`–`6.4`, `7.2`–`15.2` (9 khoá `ngay trong đời này và trong đời sau’.`), `7.3`–`7.4`, `8.4`, `9.4`, `10.4`, `11.4`, `13.4`, `14.4`, `15.3`–`15.4`, `16.5`. Trong chính bài có 1 nhóm Pāli trùng nguyên văn (9 khoá `7.2`–`15.2`), bản Việt giống hệt nhau: 0 cặp lệch.
  THUẬT NGỮ (đếm tầng, rồi vùng gần). `paccorohaṇī`/`paccorohati` → sự bước xuống / bước xuống khỏi …, theo `an10.168` (cùng công thức; Pāli ở đây là cùng từ nên dùng cùng một chữ, để hai bài anh em đọc ra là một khuôn). `pāṇātipāta` sát sinh (267 vs 10 sát sanh) · `adinnādāna` trộm cắp (tầng 114 lấy của không cho vs 85 trộm cắp; vùng gần an10.168–171 bốn bài đều trộm cắp, chọn vùng gần) · `kāmesumicchācāra` tà dâm (69 vs 51 tà hạnh trong các dục) · `musāvāda` nói dối (298) · `pisuṇā vācā` nói hai lưỡi (94) · `pharusā vācā` nói ác khẩu (38 vs 33 lời thô ác) · `samphappalāpa` nói phù phiếm (54 + 50 nói lời phù phiếm vs 29 nói lời vô ích; an10.170–171 dùng phù phiếm, an10.168 dùng vô ích ⇒ `12.4` lệch một cặp với `an10.168:8.2`, đã cân nhắc, chọn đa số) · `abhijjhā` tham lam (275 vs 22 tham dục) · `byāpāda` sân hận (202 vs 131 sân) · `micchādiṭṭhi` tà kiến (23). `iti paṭisañcikkhati` / `iti paṭisaṅkhāya` suy xét (82 · 14). `ariyassa vinaye` trong giới luật của bậc Thánh (32 vs 18 trong luật · 13 trong đạo · 3 trong Luật). `agyāgāra` phòng lửa (`mn75`, 3 khoá). `allakusamuṭṭhi` nắm cỏ kusa tươi (`cỏ kusa` 21). `tadahuposathe` đúng ngày Uposatha (Uposatha 10 vs 5 bố-tát vs 3 trai giới trong đúng khoá `tadahuposathe`). `Jāṇussoṇi` giữ đúng chính tả Pāli (25 vs 18 `Jānussoṇi`).
  `pāpako vipāko` dịch có quả xấu thay cho `thì quả xấu` ở `an10.168`; cùng nghĩa (`pāpako vipāko` là chủ ngữ, `hoti` bị lược), chọn dạng tự nhiên hơn, lệch một cặp ở `7.1`. Dấu lược: `7.1`–`15.1` có một `…` ở đầu (phần lược của món trước) và `16.3` có một `…` thay `…pe…`; Pāli `15.1` có `…` đầu, giữ đúng. Số: `soḷasiṁ` = 16 → một phần mười sáu (`16.2`); `tikkhattuṁ` = ba lần (`3.3`); không có số lớn nào khác.
  BẤT ĐỊNH (không thêm vào thân kinh). (1) `3.4` `paccorohāma bhavantaṁ`: `bhavantaṁ` là đối cách; dịch như lời xưng hô `thưa ngài` theo Sujato (lord), chưa chắc đối tượng của `paccorohāma` là lửa (có thể là `chúng tôi xuống đến ngài`). (2) `3.2` `antarā ca velaṁ antarā ca agyāgāraṁ`: `velā` ở đây là ranh giới (Sujato boundary), chưa xác định ranh giới của cái gì (nơi tế, khu vườn, làng); dịch `khoảng giữa ranh giới và phòng lửa`, không thêm. (3) `2.5` / `3.1` `paccorohaṇī`: Pāli không có từ `lễ`; dịch `sự bước xuống` cho cả nghi thức của bà-la-môn lẫn nghĩa của bậc Thánh để giữ trò chơi chữ của Pāli (`aññathā … aññathā`); Sujato và Hòa thượng Thích Minh Châu (`xuất ly`) đều chọn chữ khác. (4) `0.2` `Phẩm Vua Jāṇussoṇi`: `Jāṇussoṇi` là một bà-la-môn (kinh này gọi `brāhmaṇo`), không phải vua; giữ nguyên theo tầng (7/7 cặp) vì sửa là việc của cả phẩm; người biên tập nên cân nhắc đổi thành `Phẩm Jāṇussoṇi`.
  `4.3` / `Sādhu me … desetu` dịch `lành thay nếu … thuyết pháp cho con` theo `an2.17`, không theo `an3.58` (`cúi mong`). `16.4` dùng dạng đa số 10 khoá (`ghi nhận con là cư sĩ, từ hôm nay trở đi, trọn đời quy y`) thay cho 7 khoá `nam cư sĩ đã quy y từ hôm nay cho đến trọn đời`.
  Kiểm: bộ khoá Việt = bộ khoá Pāli (68 = 68, đúng thứ tự); nháy đơn và kép khớp Pāli từng khoá 68/68; dấu lược cân bằng từng khoá 68/68; NFC; không khoá rỗng; không Pāli lọt sang Việt ngoài tên riêng và `Uposatha`, `kusa`. Đã in và đọc đối chiếu từng cặp Pāli với Việt, kể cả 10 khối `X có quả xấu` / `vị ấy bước xuống khỏi X` (không có khối nào mang nội dung khối kia).
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy; technical_integrity 9.6 vì lát này bị cấm tự chạy bốn lệnh đó.
