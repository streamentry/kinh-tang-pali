notes: |-
  Sửa lan 2026-10-13: khoá `an3.70:10.4` (công thức `āhuneyyo pāhuneyyo dakkhiṇeyyo añjalikaraṇīyo`), *đáng được cúng dường, đáng được tiếp đón, đáng nhận vật bố thí đài các, đáng được chắp tay kính lễ* → *đáng được hiến dâng, đáng được tiếp đón, đáng được cúng dường, đáng được chắp tay kính lễ*. Căn cứ: `āhuneyyo` = hiến dâng, `dakkhiṇeyyo` = cúng dường, Pāli không có ý *đài các*; đo công thức này trong tầng: 27 khoá, dạng *hiến dâng, tiếp đón, cúng dường, chắp tay* là dạng chung của `an5.203:2.4`, `sn40.10:10.2`, `sn55.1:2.7`, `dn24:1.6.8`, `an7.16:1.5`; dạng *đài các* chỉ còn ở `an3.41`, `an3.57`, `an3.96` (ngoài phạm vi lượt này). Các vế khác của khoá (*ruộng công đức vô thượng của thế giới*, như `an5.203:2.4`) không đổi. `an3.70:12.3` chỉ là khoá lược `…pe…`, không chứa các vế này. Không tìm thấy `rājabhoggo` trong bài này nên vế *xứng đáng được vua sử dụng* của bài mẫu không áp dụng. Không đổi điểm.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 28.1 — *Lớn đến mức nào?* → đủ bốn vế *Có quả lớn…, có lợi ích lớn…, có sự rực rỡ lớn…, có sự tỏa rộng lớn…* (Pāli `kīvamahapphalo … kīvamahāvipphāro` có bốn vế, bản cũ bỏ ba); 28.3 — *ngày giới với đầy đủ tám phần ấy cũng chẳng đáng so với một phần mười sáu* → *việc ấy không đáng một phần mười sáu của ngày giới có đủ tám phần* (đúng cấu trúc `etaṁ kalaṁ nāgghati soḷasiṁ`, giữ *ngày giới* như cả bài); 29.7–34.7 — *quyền làm người* → *vương quyền của loài người là điều thấp kém khi đem so với hạnh phúc của chư thiên* (`mānusakaṁ rajjaṁ` là vương quyền; `upanidhāya` là *khi đem so với*), đồng bộ cả sáu khoá cùng Pāli; 29.6–34.6 cùng công thức `sandhāya bhāsitaṁ` → *Này Visākha, chính điều này là điều được nhắm đến khi nói rằng:* (như an8.43).
