notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an6.48:2.6 — bản cũ bung đủ năm đức tính của pháp
  trong khi Pāli lược bằng `…pe….`; nay giữ phần Pāli có: *như vậy, này bà-la-môn, pháp là thiết
  thực hiện tại ….* Dùng *thiết thực hiện tại* theo tên bài và 1.3, 1.4 thay cho *có thể thấy ngay
  trong hiện tại* của nhóm kia.

  Rà nhất quán theo Pāli trùng 2026-10-14: (lượt hai) khoá an6.48:1.3 — *người ta thường nói* →
  *người ta nói*, vì `vuccati` không có nghĩa *thường*; giữ *Pháp thiết thực hiện tại* theo tên bài
  và an6.47. Giữ nguyên 1.4, 2.6, 3.9: công thức *pháp là thiết thực hiện tại, không có thời gian,
  đến để mà thấy, có khả năng hướng thượng…* đã dùng ở an6.47, dn16:2.9.6, sn11.3:10.2, an9.27:7.2,
  an10.92:5.5; nhóm kia (*có thể thấy ngay trong hiện tại … mỗi bậc trí tự mình hiểu được*) cũng
  đúng nghĩa, chỉ khác lựa chọn thuật ngữ và không khớp tên bài.
