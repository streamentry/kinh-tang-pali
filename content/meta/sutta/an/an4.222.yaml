notes: |-
  Sửa lan 2026-10-13: khoá an4.222:1.1, 1.4 — sāvajjo ca hoti sānuvajjo viññūnaṁ, 'đáng bị trách trách và bị người có trí trách móc' → 'có tội và bị người có trí trách móc'; khoá 2.1, 2.4 — anavajjo ca hoti ananuvajjo viññūnaṁ, 'không đáng bị trách trách và bị người có trí trách móc' → 'không có tội và không bị người có trí trách móc' (bản cũ còn thiếu phủ định ở vế ananuvajjo viññūnaṁ). Căn cứ: Pāli; tiền lệ đo trên tầng: sāvajja → 'có tội' 56 khoá so với 'đáng bị trách trách' 16 khoá; mẫu đã sửa ở an4.193; tiền lệ cùng công thức ở an4.4.
