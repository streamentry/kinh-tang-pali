notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `1.3`, `1.5` — «an trú trong rừng…, gần làng» → «trú ở Icchānaṅgala, trong khu rừng Icchānaṅgala» (locative làng + rừng, bám Pāli); `1.5` còn sửa «dòng Sát-đế-lỵ» → «dòng Sakya» vì Pāli là `sakyaputto sakyakulā`, và thêm hô ngữ «Này các vị» cho `bho`; `1.8` — bỏ «lại», đưa về công thức đa số «chứng ngộ bằng thắng trí thế giới này cùng với chư thiên, Māra và Phạm thiên, … rồi tuyên thuyết điều ấy»; `2.1` — «người hầu cận» → «thị giả» (`upaṭṭhāko`); `2.7`, `4.3` — «của được cho, được tôn kính, được ngợi khen» → «của lợi dưỡng, tôn kính và danh vọng» (`lābhasakkārasiloka`); `3.7` — viết lại thành «Bạch Thế Tôn, bởi vì giới và trí tuệ của Đức Phật là như vậy» theo công thức đa số. Giữ nguyên khoá `1.2` và `2.2` vì chỉ khác ở lựa chọn từ nối (Bấy giờ/Rồi; du hóa/du hành), cả hai đều đúng Pāli và giữ cách gọi «Đức Phật» của cả bài.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt hai): khoá 2.7, 4.3 — «Kẻ ấy hãy thọ hưởng hạnh phúc bẩn thỉu, … danh vọng.» → «thì người ấy hãy thọ hưởng hạnh phúc bẩn thỉu, … danh vọng ấy.» (`so taṁ mīḷhasukhaṁ …`: `so` là vế đáp của `yo` ở 2.6, 4.2 và `taṁ` là «ấy»; dạng của an6.42, an8.86); và vì khoá liền trước cùng Pāli nên sửa luôn 2.6, 4.2: «Có những kẻ … không dễ dàng được hưởng khi muốn, không dễ dàng được hưởng không khó nhọc, không dễ dàng được hưởng không vất vả hạnh phúc …» (phủ định chồng nhau, đọc không ra nghĩa) → «ai không được hưởng hạnh phúc xuất gia … này một cách tùy ý, không khó nhọc, không vất vả, như Ta được hưởng … ấy một cách tùy ý, không khó nhọc, không vất vả,» (`yo … nayimassa … nikāmalābhī assa akicchalābhī akasiralābhī, yassāhaṁ … nikāmalābhī akicchalābhī akasiralābhī`: `na` phủ định cả ba vế, `yassāhaṁ` là «như Ta»); giữ «hạnh phúc» cho `sukha` và «xuất gia» cho `nekkhamma` theo cả bài. Giữ nguyên khoá 1.2, 2.2 như lượt trước (chỉ khác từ nối và du hóa/du hành, cả hai đúng Pāli, và giữ «Đức Phật» của cả bài).
