notes: |-
  **Giải quyết draft 2026-10-12.** Blocker cũ ("cắt ngắm — 3 khoá có dấu lược `…` mà
  Pāli không có: 2.4, 3.5, 4.5") đã được kiểm lại và gỡ: bản dịch hiện hành không có
  dấu `…` ở bất kỳ khoá nào (0/47), và Pāli của bài cũng không có `…pe…`; dấu `…` chỉ
  nằm ở tầng English Sujato tại đúng ba khoá đó (2.4, 3.5, 4.5), không phải ở bản Việt.
  Blocker vì vậy không còn căn cứ và đã xoá. Đồng thời đọc đối kháng toàn bài từ Pāli
  và sửa các lỗi nghĩa thật; điểm cũ (9.51, GLM-5.3 Flash) bị thay bằng điểm dưới đây.

  **Khoá đã sửa (accuracy fix).**
  - `2.2`, `2.6`, `3.2/3.3`, `3.7/3.8`, `4.2/4.3`, `4.7/4.8`: Pāli `yena me āyasmanto
    attamanā honti taṁ karomī` là **lời người nói tự hứa** ("điều nào khiến các ngài
    hài lòng với tôi, tôi sẽ làm điều ấy", động từ `karomi` ngôi thứ nhất). Bản cũ dịch
    "xin chư vị cứ tùy hỷ mà xử lý" — đảo người làm (đẩy việc cho đám đông) và thêm nghĩa
    không có. `bhante` + `āyasmanto` đang xưng hô số nhiều → "Thưa các ngài" (không "Này
    chư vị").
  - `1.3`, `1.4`: `coraṁ āgucāriṁ` = "kẻ trộm, kẻ phạm tội" (tiền lệ: 11/13 khoá có `āgucārī` ở tầng
    dịch "kẻ phạm tội"; bản cũ "kẻ trộm cướp làm điều dơ bẩn" thêm nghĩa và bịa "dơ bẩn"). `deva` khi nói
    với vua → "Tâu Đại vương" (không "Bạch").
  - `1.7`, `1.8`, `1.11`: `kharassarena paṇavena` = "theo tiếng trống chói tai" (tiền lệ
    `dn23`, `dn26`: 10 khoá có `kharassarena`, đều "trống chói tai"; bản cũ "đánh trống dữ
    dội" lệch); `rathikāya rathikaṁ` = "từ đường này sang đường khác" (không "ngõ"; tiền lệ
    `dn26`); `dakkhiṇena dvārena` = "cổng thành phía nam"; `dakkhiṇato nagarassa` = "ở phía
    nam thành". `1.7` thêm `gacchatha` ("hãy đi") bị bỏ sót.
  - `1.11`, `2.5`, `3.6`, `4.6`: `Yatra hi nāma … chindissanti/vakkhati` là mệnh đề lý do
    ("bởi lẽ … sẽ …", thì tương lai) chứ không phải câu hỏi. Bản cũ dịch "Vì sao …" kết bằng
    dấu chấm, vô nghĩa về cú pháp và làm mất thì tương lai.
  - `1.9`, `2.3`, `3.4`, `4.4`: `Tatraññatarassa thalaṭṭhassa purisassa evamassa` = "tại đó,
    có một người đứng một bên nghĩ" (người đứng ngoài, `thalaṭṭha`; bản cũ "người đứng
    đường" thêm nghĩa "đường"). Không có tiền lệ nội tầng cho `thalaṭṭha` (0 khoá khác).
  - `1.12`, `2.7`, `3.9`, `4.9`: `So vatassāhaṁ … na kareyyaṁ` = "vậy thì ta quả thật sẽ
    không làm …"; bản cũ "tuyệt đối" quá mạnh so với `vata`.
  - `1.13`, `2.8`, `3.10`, `4.10`: `tibbā bhayasaññā paccupaṭṭhitā hoti` = "có tưởng sợ hãi
    mãnh liệt … hiện khởi" (tiền lệ `ps1.1:544.2`; bản cũ bỏ `paccupaṭṭhitā`). `dhammesu`
    = "đối với các pháp …". `Tassetaṁ pāṭikaṅkhaṁ` = "điều này có thể mong" (tiền lệ
    `an4.196:5.6`, `an4.196:9.6`). `yathādhammaṁ paṭikarissati` = "sẽ sửa lỗi đúng pháp"
    (tiền lệ `dn25:22.6`, `dn2:100.3`, `mn140:33.7`; bản cũ "đối xử đúng pháp với nó" sai
    nghĩa). Tên bốn loại tội viết hoa không dấu/Pāli trần (`PARAJIKA`, `SAṄGHĀDISESA`,
    `PĀCITTIYA`, `PĀṬIDESANĪYA`, `Parajika`…) — Pāli lọt vào bản dịch — đã phiên âm sang
    tiếng Việt: ba-la-dị (tầng: 36 khoá viết "ba-la-dị" so với 9 "Ba-la-di"),
    tăng tàn, ba-dật-đề, ba-la-đề-đề-xá-ni.
  - `2.1`, `3.1`, `4.1`: `kese pakiritvā` = "xõa tóc" (rải ra, không "rối"); `mahājanakāyaṁ`
    = "một đám đông lớn" (bản cũ "đám đông đông đảo" thừa lặp; tiền lệ `dn14`, `sn56.41`).
  - `2.6`, `3.7/3.8`, `4.7/4.8`: lời trích lồng trong lời nghĩ — Pāli dùng nháy kép `“ ”`
    cho lớp trong; bản cũ dùng nháy đơn `‘ ’`; đã khớp Pāli từng khoá.
  - `3.2`–`3.9`: `bhasmapuṭaṁ` chỉ là "túi tro"; "đáng bị rắc tro tàn" thêm động từ không có
    trong Pāli → "đáng chịu túi tro".

  **Phép kiểm.** 47/47 khoá, tập khoá và thứ tự khớp Pāli; nháy đơn/kép khớp Pāli từng khoá
  (0 lệch); 0 dấu `…` ở Việt và 0 `…` trong Pāli; NFC, 0 khoảng trắng thừa; 0 Pāli lọt. Cặp
  Pāli trùng nội bộ: `2.2`↔`2.6`, `3.2+3.3`↔`3.7+3.8`, `4.2+4.3`↔`4.7+4.8` (khác nhau
  chỉ ở nháy), bản Việt giống nhau từng cặp (0 cặp lệch). Không có số Pāli cần tính.

  **Coverage English (Sujato).** Pāli có nội dung: 38 khoá (≥ 40 ký tự, bỏ `:0`). Sujato
  để trống 9: `1.11`, `2.5`, `2.6`, `3.6`, `3.7`, `3.8`, `4.6`, `4.7`, `4.8`; ba khoá `2.4`,
  `3.5`, `4.5` chỉ có một vế rồi dấu `…`. Phủ 29/38 ≈ 0,76 (dưới ngưỡng 0,80) — mất mát
  cần ghi nhận ở `reference-gaps.yaml`, không phải lỗi văn bản. Chín khoá trống đều là
  đoạn người nói **lặp lại** lời ở các khoá liền trước/sau (1.11 lặp 1.8, 2.5–2.6 lặp
  2.1–2.2, 3.6–3.8 lặp 3.1–3.3, 4.6–4.8 lặp 4.1–4.3); đã đọc kỹ từ Pāli, đối chiếu cách
  dịch ở đoạn nguồn trong cùng bài và tự đứng vững. Nên không còn blocker độ phủ.
  Tầng `vietnamese-current` không có cho bài này (chỉ có Pháp Cú) và `english-project`
  chưa có nội dung; bản Việt nguyên bài ở mục Tra cứu toàn văn chỉ dùng để hiểu cách đọc
  (không chép câu chữ). `triangulation` giữ 8,0 vì chín khoá không có bản Anh độc lập.

  **Bất định còn lại (không thêm vào thân kinh).**
  1. `gārayhaṁ mosallaṁ` / `bhasmapuṭaṁ` / `upavajjaṁ` là danh/tính từ trơn, không có động
     từ: `đáng bị đánh bằng chày` (mosalla, `musala`) theo cách đọc của Sujato và tiền
     bản; `đáng chịu túi tro` giữ sát chữ, chưa gán hành vi cụ thể. Chưa có tiền lệ nội
     tầng cho cả ba.
  2. Tên bốn loại tội (ba-la-dị / tăng tàn / ba-dật-đề / ba-la-đề-đề-xá-ni): chỉ `ba-la-dị`
     có tiền lệ nội tầng đo được (36/45); ba tên còn lại không có khoá nào khác trong tầng
     để đối chiếu và là lựa chọn biên tập theo truyền thống Việt (Hán–Việt phiên âm).
  3. `āpattibhaya` giữ "sự nguy hiểm" (tiền lệ cùng tầng cho `bhaya` ở dạng đếm là
     "hiểm họa"/"nguy hiểm", `mn67`, `mn115`), trong khi `bhayasaññā` dịch "tưởng sợ hãi"
     (`ps1.1:544.2`); Sujato dùng `perils`/`perception of peril`.
  4. Kiểm định kỹ thuật: bản chấm này không chạy `npm run validate`, `npm test`,
     `npm run check`, `npm run build`; `technical_integrity` = 9,6 theo đó.
