notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (tra cứu toàn văn, không phân đoạn).
    Coverage Anh: bản Sujato phủ 21/21 khoá Pāli có nội dung (>= 40 ký tự, bỏ khối :0), tỉ lệ 1,00, không có lớp english-project cho bài này; cổng coverage đạt, không cần ghi nhận gap. Ở các khoá lược ...pe... Sujato viết lại dạng rút gọn, nên đó là đối chiếu nghĩa chứ không phải đối chiếu từng chữ.
    Thuật ngữ: akkhaṇa/asamaya = "lúc không thuận, thời không thuận", khaṇa/samaya = "lúc thuận, thời thuận" theo dn33:3.2.43 đến 3.2.71 (cùng công thức akkhaṇo asamayo brahmacariyavāsāya) để cùng một bộ từ vựng; lấy "lúc thuận" cho cả các khoá kệ trong bài. Các kệ khác trong tầng (dhp315, snp2.10, thag6.5, thig1.5) dịch khaṇa là "phút giây/thời khắc/sát-na" cho cùng cụm "khaṇo ve mā upaccagā", sn35.135 dịch "cơ hội"; bài này giữ "lúc thuận" vì kệ đối chiếu trực tiếp với akkhaṇa trong văn xuôi. Tên kinh theo đó là Kinh Lúc Không Thuận.
    Công thức Như Lai theo an4.33 (13 khoá đa số trong bộ an cho dãy "đầy đủ minh và hạnh ... vô thượng điều ngự trượng phu khả được điều ngự"); tà kiến "natthi dinnaṁ" theo sn24.5 (bố thí, hiến tế, cúng dường); tiracchānayoni súc sinh (53 so với 12 bàng sinh), pettivisaya cõi ngạ quỷ, milakkha man di, viparītadassana "có cái thấy điên đảo" theo dn33/dn34 (đây là công thức trùng cả dn33 lẫn dn34).
    Dùng lại nguyên văn: 0.2 (6/6 cặp trùng), 19.2 (2/2), 20.3 (1/3), 20.5 (263/265) và 1.3 theo dạng phổ biến nhất (14/32 cặp). Số cặp Pāli trùng nguyên văn đã dò ở tầng: 9 khoá, 319 cặp, trong đó 33 cặp bản Việt khác; ở 14.3, 14.4, 15.2 và 20.4 chủ ý khác vì ngữ cảnh kệ khác hoặc vì thuật ngữ "lúc thuận". Trong chính bài có 2 nhóm Pāli trùng nguyên văn (3.1, 4.1, 5.1, 7.1 và 11.2, 17.2), bản Việt đều giống nhau.
    Số: aṭṭha = tám, eka = một, thứ tự paṭhama = thứ nhất, sattama = thứ bảy, aṭṭhama = thứ tám, navamaṁ = thứ chín; đã đếm đủ tám lúc không thuận theo trình tự (địa ngục, súc sinh, ngạ quỷ, chư thiên trường thọ, biên địa, tà kiến, đần độn, vắng Phật) khớp với dấu thứ tự ở 1.6, 7.3, 8.3.
    Bất định, chọn cách ít giả định nhất và không đưa vào thân kinh. (1) 1.1 "khaṇakicco loko": Sujato đọc như lời thốt "Now is the time!", Hòa thượng Thích Minh Châu "Làm việc đúng thời là thế giới"; bản này giữ nghĩa đen của hợp từ, "thế gian có việc phải làm đúng lúc", mệnh đề sau (không biết đâu là lúc thuận hay không thuận) cho thấy đó là lời của kẻ phàm phu nói về "đúng lúc". (2) 15.2 niyāmataṁ: Sujato "certainty", Hòa thượng Thích Minh Châu "quyết định tánh", dịch "sự xác quyết của chánh pháp"; naṁ đứng trước niyāmataṁ như đồng vị, không dịch riêng; không đưa nghĩa của chú giải (sammattaniyāma) vào lời kinh. (3) 15.3 atītattho: Sujato "like the merchant in the story of the past", Hòa thượng Thích Minh Châu "kẻ buôn mất của"; bản này đọc atīta + attha thành "đã lỡ mất lợi ích", bám Pāli, và không dùng cách hiểu "chuyện quá khứ". (4) 20.2 māradheyyaparānuge: không có tiền lệ trong tầng; dịch "đi theo người khác trong lãnh địa của Māra" theo hướng của Sujato, còn một cách đọc khác của parānuge chưa phân xử được. (5) 19.1 ye saṁvarā: hiểu saṁvarā là danh từ "những sự chế ngự" vì tesu gutto ở 19.3 cần nơi chốn để "được hộ trì", khác Sujato đọc thành người, bất định nhỏ. (6) 18.2 brahmacariyaṁ anuttaraṁ: Sujato và Hòa thượng Thích Minh Châu đều đọc là mục đích của khaṇa, ở đây dịch "dành cho", còn cách đọc là đối tượng trực tiếp của paccaviduṁ cũng khả dĩ. (7) 5.2: so ca hoti aviññātāresu milakkhesu dịch "người ấy ở giữa những kẻ man di thiếu hiểu biết", theo dn33:3.2.60.
    Cách ngắt "nhưng người này" ở các khoá 1.5 đến 5.2 theo dn33/dn34; Pāli chỉ có "ca", tính đối lập là do văn cảnh.
    Hán–Việt: giữ "tịch diệt" cho parinibbānika, "an tịnh" cho opasamika theo dn33; "tà kiến", "tùy miên", "lậu hoặc" là thuật ngữ quen thuộc.
    Hiệu chuẩn các phép đo tự viết: tập khoá Việt khớp Pāli 74/74 và đúng thứ tự; dấu nháy đơn và kép khớp Pāli từng khoá, 0 lệch trên 74 khoá; lược ...pe... đã về đúng một dấu lược ở mọi khoá, 0 lệch; không có (…) trần trong Pāli bài này nên phép (…) chạy rỗng; không Pāli lọt sang Việt; NFC.
    technical_integrity đặt 9,6 vì chưa chạy được các cổng của kho; điều phối viên chạy bốn lệnh trước khi gộp: npm run validate, npm test, npm run check, npm run build.
