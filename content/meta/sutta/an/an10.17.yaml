notes:
  - >-
    **Bài này và `an10.50` là cùng một danh sách mười phẩm**, chỉ khác lớp vỏ
    bên ngoài: ở đây mỗi mục là **ba segment** (`X` / `Yampi X …` / `Ayampi
    dhammo nāthakaraṇo`), ở `an10.50` là **ba dòng** có thêm `ayampi dhammo …
    saṁvattati` và khung `Yampi/ayampi`. Tôi dịch **nguyên văn `an10.50`** cho
    cả mười mục — cùng Pāli, cùng quyển, đã `published`.
  - >-
    **Lựa chọn đó có hệ quả phải ghi thẳng:** `an10.50` dùng cách dịch **thiểu
    số toàn corpus** cho hai mệnh đề `āraddhavīriyo viharati…` (2 segment so với
    11) và `udayatthagāminiyā paññāya…` (2 so với 10). Nguyên tắc đã dùng ở
    chương 5 và lặp lại ở đây là **ưu tiên nhất quán trong quyển hơn một câu
    dịch hay hơn ở quyển khác**. Hệ quả: lựa chọn này làm thiểu số **từ 2 lên
    5** thay vì thu hẹp khoảng cách. Xem `docs/translation-notes/araddhaviriya-
    and-udayatthagamiya-split.md`.
  - >-
    **`Nāthavagga` → *Phẩm Bảo Hộ*** (0 segment tiền lệ, đặt mới): `nātha` là
    người bảo hộ, chỗ nương tựa — và Sujato dịch tên phẩm là *A Protector*. Cả
    phẩm đúng ngữ nghĩa đó: `nāthakaraṇā dhammā` → *mười pháp làm nên sự bảo
    hộ*, `sanāthā … mā anāthā` → *hãy sống có chỗ bảo hộ, đừng sống không chỗ
    bảo hộ*, `anātho viharati` → *sống không chỗ bảo hộ là khổ đau*. Vì ba cụm
    này lặp ở `an10.17` và `an10.18`, tôi dùng **cùng một cách** cho cả ba bài;
    `an10.19`–`an10.20` dùng `ariyāvāsā` → *chỗ ở của bậc Thánh* (cũng 0 tiền
    lệ), đối xứng với `senāsana` → *chỗ ở*.
  - >-
    **`pañcaṅga`/`chaḷaṅga` → *năm phần*/*sáu phần***: 25 segment trong corpus
    đang chia đôi — *yếu tố* 35 (đều ở `an3.19`, `an3.133`, `an5.135`… với nghĩa
    *nhân tố* của một người) và *phần* 22 (`an3.57`, `an4.112`, `an4.181`,
    `sn3.24`…). **Tôi chọn *phần*** vì ở đây nói đúng **năm phần bị trói buộc**
    `kāmacchando … vicikicchā`, mà tiền lệ trực tiếp cho đúng nghĩa đó là
    `an3.57:4.2` và `sn3.24:3.1` (*năm phần*). Ghi lại để người sau không tưởng
    là thiếu nhất quán.
  - >-
    **`…pe…` ở `1.6`, `2.2`, `4.2`, `5.2` buộc phải lược**, khác `an10.50` ở
    những chỗ đó lặp nguyên văn. Đây là bẫy bố cục đã bắt được khi đối chiếu
    từng cặp khoá: dùng lại nguyên văn bài kia mà không đọc Pāli bài này sẽ ra
    **nội dung lặp thừa** ở bốn segment. `…` đặt đúng giữa phần đầu và phần đuôi
    Pāli còn lại, theo khuôn `an10.10:2.8`.
  - >-
    **`tassa therānukampitassa …` không có trong bài này** (Pāli chỉ có `ayampi
    dhammo nāthakaraṇo`), nên mười mục ở đây dài hơn `an10.50` **ít** một vế —
    và đó là đúng: bài này **không** lập luận về sự suy giảm, chỉ nêu mười pháp
    làm nên sự bảo hộ. Không thêm vế nào.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
