notes: |-
  TẦNG THAM KHẢO VÀ COVERAGE ENGLISH. Tầng english-sujato tồn tại tại commit đã ghim và bản Sujato phủ 19/19 khoá Pāli có nội dung (khoá từ 40 ký tự trở lên, bỏ khối :0), tức 1,00, trên ngưỡng 0,80 của source/layers.yaml. Bài không có khoá nào do tầng english-project cung cấp, nên cả 19 khoá đều có cách đọc English độc lập. Tầng Việt hiện hành có file nguyên bài của Hòa thượng Thích Minh Châu (không phân đoạn, đã đọc toàn bài, ghi là 6.45 Nghèo Khổ) nhưng không vào store theo từng khoá. Không cần mục trong content/meta/reference-gaps.yaml vì coverage đạt ngưỡng; có mục cũng không cứu được published.

  BỐ CỤC NHÁY. Pāli mở nháy kép ở 7.1 (“Iti kho…) và chỉ đóng ở 28.4 (…muttaman”ti), nên toàn bộ từ 7.1 đến 28.4 là một lời nói liền của Đức Thế Tôn; bản Việt giữ đúng một dấu mở ở 7.1 và một dấu đóng ở 28.4. Các câu hỏi 1.1, 2.1, 3.1 tự đóng nháy; 4.1, 5.1, 6.1 mở nháy ở vế đầu và đóng ở vế sau (4.2, 5.2, 6.2). Nháy đơn và nháy kép khớp Pāli ở từng khoá (100/100); 9.2 có năm cặp nháy đơn.

  TIỀN LỆ ĐÃ ĐO. Đã dò 18 khoá Pāli trùng nguyên văn với bài khác trong tầng (không kể khoá :0.1): 12 khoá trùng hẳn bản Việt hoặc chỉ khác chữ hoa và dấu câu; 6 khoá cố ý khác (17.2 thêm hay vì uda, 19.3 viết thường vì nối dòng, 21.3 thêm với, 22.2 dùng lòng tin thay đức tin cho khớp 7.2, 22.4 và 22.5 chỉ khác dấu câu và chữ hoa). Đã dùng lại nguyên văn: Evaṁ, bhante thành Bạch Thế Tôn, đúng vậy (45/130 khoá của tầng, 26/41 trong an); công thức kāyena duccaritaṁ carati thành làm ác hạnh bằng thân, bằng khẩu, bằng ý (13 khoá và 3 khoá caritvā, cùng dạng); 16.2 và 16.3 thành ác hạnh nơi lời, nơi ý (5 và 2 khoá); 22.3 lợi ích ngay trong hiện tại (5 khoá); 25.3 chứng đạt các thiền (2 khoá); 28.3 không sầu, không bụi, an ổn (4 khoá); 10.2 theo sn35.247 (vị đáng kính này làm như vậy, hành xử như vậy); 27.3 theo an3.85 (giải thoát của ta không rung chuyển). Trong bài, 8 nhóm Pāli trùng nội bộ: 6 khoá Evaṁ, bhante (1.2, 2.2, 3.2, 4.3, 5.3, 6.3) giống hệt; 13.3 và 13.4 giống 18.3 và 18.4; 15.1 giống 23.1; 18.1 và 18.2 giống 20.1 và 20.2; hai nhóm khác có chủ ý: 14.1 và 19.1 (cùng Pāli Tato anucaranti naṁ nhưng ở 14.1 chủ ngữ là chủ nợ, còn ở 19.1 chủ ngữ là saṅkappā ở 19.2 nên Việt khác), 14.3 và 21.1 (cùng Pāli Etañhi bandhanaṁ dukkhaṁ nhưng 14.3 nối thẳng sang 14.4, còn 21.1 đứng đầu câu và kết bằng dấu phẩy).

  THUẬT NGỮ ĐÃ ĐO. ariyassa vinaye thành trong giới luật của bậc Thánh (33 khoá so với trong luật của bậc Thánh 24). kusalesu dhammesu thành các pháp thiện (226 khoá so với thiện pháp 46). vippaṭisāra thành hối tiếc (150 khoá so với hối hận 25). ottappa thành kính sợ (40 khoá so với quý 27 trong an; mn110 dịch sợ lỗi), hirī thành hổ thẹn, saddhā thành lòng tin (22 khoá trong an so với niềm tin 5, đức tin 1). saṁyojana thành kiết sử (359 khoá toàn tầng; trong an trói buộc 92, kiết sử 33), chọn kiết sử để khỏi lẫn với bandhana vốn dịch trói buộc. nirāmisaṁ sukhaṁ thành lạc phi vật chất (23 khoá). tiracchānayoni thành cõi súc sinh (17 khoá so với súc sinh 13). kāyassa bhedā paraṁ maraṇā thành khi thân hoại mạng chung (22 khoá trong an4 đến an6). daliddo assako anāḷhiko thành người nghèo khó, không có của, túng thiếu (mn96 và mn66 cùng cấu tạo). yogakkhema thành an ổn khỏi các ách phược (20 khoá).

  BẤT ĐỊNH, GHI RÕ. (a) pāpakammavinibbayo (15.4) là hapax trong toàn Pāli ghim, không có tiền lệ trong tầng; Sujato dịch contemplates bad deeds, Hòa thượng Thích Minh Châu dịch quyết định chọn ác nghiệp. Tôi dịch quyết chọn ác nghiệp, theo cách hiểu vinibbaya như sự quyết định; nghĩa chung không ảnh hưởng vì 16 diễn tiếp. (b) saṁsappati (17.1): an10.216 trong tầng dịch tiếp xúc (4 khoá), nhưng Sujato dịch creepy cho cùng từ và an10.216 nói rõ các loài bò (rắn, bò cạp); tôi dịch len lỏi, mang nghĩa bò quanh co, lén lút, và không sửa an10.216 vì ngoài lát. (c) kaṭaggāho (22.1): hapax trong Pāli ghim, là nước đi thắng trong trò xúc xắc; Sujato dịch holds a winning hand, tôi dịch ván thắng, giữ ẩn dụ, không thêm giải thích. (d) yonimaññataraṁ (20.3): nghĩa đen một loài (thai sinh) nào đó; Sujato và Hòa thượng Thích Minh Châu đọc là loài súc sinh, tương hợp với 12.1 (tiracchānayoni) và an10.216, nhưng Pāli không nói súc sinh nên tôi giữ một loài nào đó. (e) anucariyā và anucarati (5.1, 5.2, 11.2, 14.1, 19.1): Sujato prosecuted, Hòa thượng Thích Minh Châu theo sát gót, truy tìm; tôi dịch bám theo, nhất quán cho cả chủ nợ lẫn ý nghĩ hối tiếc. (f) codeti và codanā dịch thúc đòi, bandhana dịch trói buộc (cả nghĩa bị giam), vaḍḍhi dịch lãi, paṭissuṇāti dịch chấp nhận trả lãi, kālābhataṁ vaḍḍhiṁ dịch tiền lãi đến hạn. (g) 9.1 chỉ nêu ác hạnh về thân dù Sujato dịch cả ba (body, speech, and mind); Pāli 9.1 chỉ có kāyaduccarita, ba phần còn lại ở 9.2 với dấu lược nên tôi theo Pāli. (h) 21.2 đến 21.4: bậc trí được giải thoát khỏi sự trói buộc nhờ bố thí bằng tài sản đúng pháp; câu nối giữa 21.2 và 21.3 là ngầm trong Pāli, không thêm từ nối. (i) 8.2, 9.3, 10.3, 11.2 đều là Idamassa … vadāmi; dịch Ta nói điều này là … của người ấy, giữ cấu trúc xác định từng bước của ẩn dụ (vay nợ, lãi, bị thúc đòi, bị bám theo).

  SỐ ĐẾM. Năm đức nơi 7.2 và 8.1 (lòng tin, hổ thẹn, kính sợ, tinh tấn, trí tuệ) đủ năm ở cả hai; sáu điều khổ ở 7.1 (nghèo khó, vay nợ, lãi, thúc đòi, bám theo, trói buộc) đủ sáu, khớp sáu bước ở 1.1 đến 6.2; năm triền cái (25.1); không còn số lớn nào khác.

  DẤU LƯỢC. 9.2 có hai chỗ …pe… giữa khoá, bản Việt giữ đúng một dấu lược cho mỗi chỗ (2/2) và không bung thành văn. Pāli không có dấu lược trần và không có (…).

