notes: |-
  Đối chiếu Pāli + English Sujato (đủ 58/58 khoá có nội dung) + bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn (không vào cột). Kinh Niết-bàn Là Lạc (Nibbānasukhasutta): Tôn giả Sāriputta tuyên bố Niết-bàn là lạc; Tôn giả Udāyī hỏi lạc ở đâu khi không có gì được cảm thọ; Sāriputta đáp rằng chính việc không có gì được cảm thọ là lạc, rồi đi qua chín tầng (năm dục trưởng dưỡng, bốn thiền, bốn định vô sắc, rồi sự chấm dứt của tưởng và thọ), mỗi tầng chỉ ra chứng bệnh còn có thể quấy nhiễu: các tưởng và tác ý đi kèm với tầng ấy. Số thứ tự uddāna `Tatiyaṁ` = Thứ ba.

  **Coverage English: Sujato 58/58 = 100%** trên Pāli có nội dung (>= 40 ký tự, bỏ khối `:0`); khoá còn lại là colophon `11.2` (không tính vào mẫu số). Tầng `english-project` không có bài này, tầng Việt hiện hành vắng ở commit đã ghim (chỉ có Pháp Cú) nên chỗ đó dựa vào Pāli + Sujato + tra cứu toàn văn. Cổng coverage đo được (58/58 >= 0,80), không có khoảng trống cần ghi nhận. Không có lớp lấp English của dự án cho bài này, nên toàn bộ phần đối chiếu English là độc lập (Sujato).

  **Dùng lại tiền lệ (bài kề cùng bộ, đã published):** `an9.42:3.4`/`3.8` và `an9.65:1.3`/`1.7` cho hai khoá `1.10` và `1.14` (đúng cùng Pāli: *Các sắc do mắt nhận biết, đáng ưa, đáng thích, dễ chịu, hấp dẫn, liên hệ đến dục và khơi dậy ham muốn*; riêng `1.14` kết bằng `—` theo Pāli); `an9.42:3.5`–`3.7` cho các dòng lược âm thanh/mùi/vị; `an9.42:12.1` cho tầng chấm dứt của tưởng và thọ và `an1.450`/`an9.40:6.1`/`an9.42:8.1` cho công thức vô sắc (*với ý niệm rằng hư không là vô lượng*, không có nháy đơn vì Pāli ở đây không có nháy). 15 khoá Pāli của bài trùng nguyên văn với bài khác trong toàn tầng (564 cặp, phần lớn là `Katame pañca?`, tiêu đề phẩm `4. Mahāvagga` và colophon `Tatiyaṁ.`), 423 cặp cùng bản Việt, 141 cặp khác; các cặp khác phần lớn là cách diễn đạt khác của cùng nghĩa ở những bài trước (`Katame pañca?` *Thế nào là năm?* 133 so với *Là năm nào?* 34 — theo đa số), không phải lỗi. Trong chính bài: 3 nhóm Pāli trùng nguyên văn (các khoá `x.3`, `x.5`, `x.6` ở các khối tương ứng), 0 cặp bản Việt khác nhau.

  **Thuật ngữ (đo trên toàn tầng):** `kāmaguṇā` → *dục trưởng dưỡng* (`an9.42`, `an9.65`; còn *đối tượng dục* ở `mn122`/`mn139`, *dục lạc* ở nhiều nơi khác — tầng chưa thống nhất, theo bài kề). `kāmasukha` → *dục lạc* (3 khoá `mn59`, `mn66`, `mn80` so với 1 khoá *lạc dục* `mn139` cho đúng câu `idaṁ vuccati kāmasukhaṁ`). `sukhaṁ somanassaṁ` → *lạc và hỷ* (`mn139:9.12`). `ābādho` → *chứng bệnh* (37 khoá trong tầng, so với *bệnh* 172; chọn *chứng bệnh* vì ở đây là danh từ chỉ một sự cố, `Svassa hoti ābādho` = *đó là một chứng bệnh đối với vị ấy*). `samudācaranti` → *khởi lên quấy nhiễu* (18 khoá dùng cả hai chữ, so với 9 chỉ *khởi lên*; theo `sn21.1`/`sn40.1`). `saññāmanasikārā` → *các tưởng và tác ý* (theo `sn21.1:2.8`). `kāmasahagatā` … → *đi kèm với dục* (… *đi kèm với tầm, hỷ, xả, sắc, xứ vô số hư không…*) theo `sn21.1`; `sn40.x` dùng *có X cùng đi* — chọn *đi kèm* vì tự nhiên hơn và có tiền lệ. `iminā vihārena viharato` → *sống trong sự an trú này* (14 khoá *an trú này* so với 8 *sống theo tu sự ấy*). `jhāna` hàng số: *thiền thứ nhất … thứ tư* (43 khoá *thiền thứ nhất*, 45 *thiền thứ tư*; còn *sơ thiền/tứ thiền* 46/45 — gần ngang nhau; `an9.42` dùng *sơ-nhị-tam-tứ thiền*, `an9.44`/`an9.45`/`an9.51` dùng *thiền thứ nhất…*; theo `an9.32`). `vitakkavicārānaṁ vūpasamā` → *làm lắng dịu tầm và tứ* (40 so với 4 *làm lắng dịu*); `pītiyā ca virāgā` → *do hỷ phai nhạt* (26 khoá *hỷ phai*, 13 *ly hỷ*, 5 *lìa hỷ*); `sukhassa ca pahānā` → *từ bỏ lạc* (21). `ākāsānañcāyatana` → *xứ vô số hư không*, `viññāṇañcāyatana` → *xứ vô số thức*, `ākiñcaññāyatana` → *xứ vô sở hữu*, `nevasaññānāsaññāyatana` → *xứ phi tưởng phi phi tưởng* (quy ước tầng). `saññāvedayitanirodha` → *sự chấm dứt của tưởng và thọ* (16 nơi, theo `an9.42:12.1`). `Nibbāna` → *Niết-bàn*. `sukha` → *lạc*; `vedayita` → *được cảm thọ*.

  **Câu nghĩa đen khó, ghi bất định.** (1) `1.7` `Etadeva khvettha, āvuso, sukhaṁ yadettha natthi vedayitaṁ` — dịch *chính điều này ở đây là lạc: việc ở đây không có gì được cảm thọ*. Sujato (*The fact that nothing is felt is precisely what's blissful about it*) và Thích Minh Châu (*cái này ở đây là lạc, dầu rằng lạc ấy ở đây không được cảm thọ*) cùng hiểu `yad` là mệnh đề đồng vị với `etad`; bản Thích Minh Châu thêm *dầu rằng* (nhượng bộ), không có trong Pāli; tôi theo Pāli và Sujato, không thêm chữ nhượng bộ. Đây là chỗ có thể đọc cách khác (lạc "không được cảm thọ" so với "việc không có cảm thọ chính là lạc"), nhưng không đổi giáo nghĩa. (2) `yāvadeva ābādhāya` (`x.3`) — dịch *chỉ để thành một chứng bệnh*, theo hướng Sujato (*that would be an affliction*) và Thích Minh Châu (*như một chứng bệnh*); `yāvadeva` + dative = "chỉ để/chỉ tới mức", không dịch thành *đến mức bệnh* để khỏi suy ra mức độ. (3) `x.6` `Imināpi kho etaṁ … pariyāyena veditabbaṁ yathā sukhaṁ nibbānaṁ` — Sujato phân biệt *That's the way* (ở khối thứ nhất) và *That too is a way* (các khối sau); Pāli cả chín khối **trùng nguyên văn** (đều có `api`), nên tôi dịch giống nhau ở mọi khối (*cũng theo phương cách này*), đúng hơn là tự thêm khác biệt. `pariyāyena` → *phương cách* (không dịch *nghĩa tương đối* như `an9.42`, vì `pariyāya` ở đây là "cách/phương diện" chứ không đối lập `nippariyāya`; `dn15` cũng dịch *theo cách này*). (4) `10.1` `paññāya cassa disvā` → *do thấy bằng trí tuệ … của vị ấy* theo `an9.42:12.1`.

  **Số Pāli:** không có số lượng nào trong bài (chỉ `pañca` = năm ở `1.8`–`1.16`, năm dục trưởng dưỡng; `paṭhama`…`catuttha` là số thứ tự bốn thiền).

  **Dấu lược và dấu nháy:** `1.11` có `…pe…` → đúng một `…`; `1.12`/`1.13` có `…` trần → giữ `…`; `2.1`/`3.1`/`4.1`/`5.1` mỗi khoá `…pe…` → một `…`. Có/không có `…` khớp Pāli từng khoá (70/70; 6 khoá có `…`). Nháy đơn/kép khớp Pāli từng khoá (70/70): lời Sāriputta mở `“` ở `1.3`, đóng `”` ở `1.4`; lời Udāyī mở và đóng `“…”` ở `1.6`; lời đáp của Sāriputta mở `“` ở `1.7` và đóng `”` ở `11.1`. Không có nháy đơn ở Pāli nên Việt không có.

  **Lượt review đối kháng:** không tìm thấy lỗi sai nghĩa cần sửa. Ba điểm đã cân nhắc và giữ nguyên: (1) `x.4` `Svassa hoti ābādho` dịch riêng thành câu *Đó là một chứng bệnh đối với vị ấy* thay vì nhét vào mệnh đề trước — bám đúng ranh giới câu của Pāli; (2) `evamevassa te …` dịch *cũng vậy, đối với vị ấy, các tưởng và tác ý … ấy* — `te` là chỉ định (*những … ấy*), không thêm đại từ khác; (3) `10.1` không có đoạn `Tassa ce …` như các khối trước (vì đã tới chấm dứt, không còn tưởng), đúng với Pāli, Việt không thêm vào.

