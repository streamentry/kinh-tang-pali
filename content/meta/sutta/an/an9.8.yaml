notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim (`11c9d708978cde8ba61096d8a75f7ddfb846f639`), bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  - |-
    **Ở bài này kiểm uddāna *không* kích hoạt, nhưng tôi vẫn xác minh thứ tự thật của Pāli.** `an/an9.8:3.7` là `Aṭṭhamaṁ`, khớp số 8 của uid, và khớp chuỗi `an/an9.7:3.7` = `Sattamaṁ` → `an/an9.19:4.6` = `Navamaṁ` của cùng phẩm. Bài `an/an9.9` chưa có tệp Việt dự án nên tôi không dùng nó làm chốt.
  - |-
    **Bài này giống `an9.7` đến mức tôi dựng chung một khung dịch, chỉ khác tên du sĩ và vế thứ chín.** Năm khoá đầu, `2.1`–`2.5` và `3.1`–`3.3`, `3.5`, `3.6` đều có Pāli giống hệt `an9.7` (chỉ khác `sutavā`/`sajjha`), nên tôi dịch giống hệt — đó là điều `tests/unit/english-fill.test.ts` ngòi buộc và cũng là điều một bài kinh phải tự nhất quán. Công thức năm điều dùng lại nguyên văn từ `dn/dn33:2.1.27` như ở `an9.7`.
  - |-
    **Vế thứ chín khác hẳn, nên tôi dịch riêng.** `3.4` có `…pe…` và Pāli nói thẳng bốn điều không thể phủ nhận: `buddhaṁ / dhammaṁ / saṅghaṁ / sikkhaṁ paccakkhātuṁ` → *không thể phủ nhận Đức Phật, không thể phủ nhận pháp, không thể phủ nhận Tăng, không thể phủ nhận giới hạnh*. Bốn `paccakkhātuṁ` là **phủ định**, giữ nguyên; bản Anh đã ghim cũng giữ *can't abandon*. `…pe…` lược bốn về chân lệch của năm điều, nên `3.4` mang **đúng một** `…`.
  - |-
    **Cùng lỗi `giribbaja` như `an9.7:2.1`, đã sửa cùng lúc.** Bản nháp đầu tôi viết *trên núi Chuồng*; đúng phải là *trong vùng chân núi* (tiền lệ `mn5:31.4`, `sn15.10:5.4`, `kn/iti24:4.4`).
  - |-
    **Vì sao gộp khung dịch mà vẫn là hai bài.** Tôi không dịch `an9.8` bằng cách đọc bản Việt của `an9.7`; tôi dịch từ Pāli của `an9.8` rồi dùng chung cách diễn đạt vì Pāli hai bài giống nhau. Ở `3.4` hai bài **khác nhau**, và khác đúng chỗ cần khác.
  - |-
    **Tầng Anh.** Prose có ở 17/18 khoá, thiếu ở `0.3`; coverage đo bằng `englishCoverageFor` là **14/14 = 100%**.
