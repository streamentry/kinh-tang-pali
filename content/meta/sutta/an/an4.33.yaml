notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an4.33:1.5 (cùng 1.2–1.4) — “vị ấy” → “nó” cho con sư tử (“vị ấy” dành cho người; khớp an5.99, an10.21 cùng đoạn), và 1.5 “Gầm ba lần xong” → “Sau khi gầm tiếng gầm sư tử ba lần” (bản cũ bỏ sīhanādaṁ); giữ nguyên khoá 1.1 vì “vào buổi chiều” đúng sāyanhasamayaṁ.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt quét lỏng): khoá 1.9 (sửa lan 2.8) — `mahiddhiko … mahesakkho … mahānubhāvo`: “uy lực lớn lao … oai nghi lớn … oai đức lớn” → “đại thần lực … đại oai đức … đại uy lực” (“oai nghi” là dáng vẻ, không phải `mahesakkha`; theo `sn22.78:1.5`, `sn22.78:2.12`); khoá 2.3 — thêm “ngay cả” và “cũng” cho `yepi … tepi` (bản trước bỏ `pi`) và “khi nghe”. Giữ nguyên khoá 1.5 vì đã đúng Pāli, chỉ khác bản đa số ở văn phong.
