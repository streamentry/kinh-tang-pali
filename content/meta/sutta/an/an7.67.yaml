notes: |-
  Dịch từ Pāli root (97/97 khoá, đúng thứ tự Pāli), đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu (nguyên bài, mục Tra cứu toàn văn; không có bản phân đoạn).
  Coverage English: mẫu số 78 khoá Pāli có nội dung (từ 40 ký tự, bỏ khối :0); Sujato phủ 77/78 = 0,987, vượt ngưỡng 0,80. Khoá duy nhất Sujato để trống là an7.67:18.2 (danh sách binh chủng); lớp english-project đã published lấp khoá đó (78/78 nếu tính cả lớp lấp, nhưng lớp lấp không phải cách đọc độc lập nên triangulation chỉ 9,2). Lớp lấp dùng lại đúng bộ từ của dn2:14.2 và dn2:34.3.
  Tiền lệ: tên phẩm "7. Phẩm Lớn" dùng lại nguyên văn (18/18 cặp Pāli trùng cùng bản Việt); colophon "Thứ ba." (246/248). Pāli trùng nguyên văn trong chính bài: 5 nhóm, 0 nhóm có bản Việt khác nhau. Công thức "hổ thẹn / kính sợ về hành động thân ác…" dùng nguyên văn an7.4:4.2 và an7.4:5.2 (cùng an5.2, an7.6); danh sách binh chủng theo dn2:14.2 (đổi chữ cuối thành "con của nô tỳ" vì Pāli ở đây là dāsakaputtā chứ không phải dāsikaputtā).
  Thuật ngữ đã đo: ariyasāvaka = "vị đệ tử Thánh" (an7: 27 nơi so với 0 nơi dạng "Thánh đệ tử"; toàn tầng an/sn/mn/dn: "Thánh đệ tử" 119 + "vị Thánh đệ tử" 117 so với "vị đệ tử Thánh" 103 + "đệ tử Thánh" 58 — hai phạm vi cho đa số khác nhau, chọn phạm vi gần nhất là bộ AN chương Bảy). saddhammā = "chánh pháp" theo an7.94 và an4.44; mn53 lại dùng "thiện pháp" (6 nơi) — khác bộ, không ép. Niết-bàn 494 so với 4 dạng Pāli. hirī/ottappa = "hổ thẹn/kính sợ" theo an7.4; bản an7.65 lại dùng "tàm/quý", khác ngữ cảnh tên kinh nên không ép.
  Số trong bài: bảy trang bị của thành trì (thứ nhất đến thứ bảy theo paṭhama, dutiya, tatiya, catuttha, pañcama, chaṭṭha, sattama), bảy chánh pháp (cùng thứ tự), bốn thứ nuôi dưỡng, bốn thiền. Đếm lại từng thứ tự, 0 lệch.
  Dấu lược: năm khoá có …pe… (14.3, 17.2, 21.3, 22.2, 23.2), Việt giữ đúng một "…" mỗi khoá; 0 khoá Việt có "…" mà Pāli không có. Nháy đơn và kép khớp Pāli từng khoá (0 lệch trên 97 khoá).
  Bất định (ghi ở đây, không đưa vào thân kinh): (1) salākañceva jevanikañca ở 5.1 và 17.1 — dịch "cả loại phóng đi lẫn loại cầm tay" theo Sujato; Thích Minh Châu viết "cung tên và cây lao". Hai tên Pāli chưa kiểm chứng độc lập bằng từ điển, người biên tập có thể đổi. (2) vāsanalepanasampanno (8.1, 20.1, 20.3) — dịch "đầy đủ lớp vữa trát"; Sujato chỉ ghi "covered with plaster", riêng vāsana chưa rõ nghĩa riêng. (3) akaraṇīyo ở 1.2, 13.2, 13.4, 25.2 — dịch "không thể bị … chinh phục" theo Sujato (overrun) và Thích Minh Châu; nghĩa đen "không phải làm gì đối với", toàn tầng chưa có tiền lệ. (4) 14.3 "itipi so …pe… buddho bhagavā" rút gọn hơn công thức thường gặp (itipi so bhagavā arahaṁ…), nên Việt viết "Như vậy, vị ấy … bậc Phật, Thế Tôn", không mượn câu đầy đủ như an7.4:2.3. (5) āhāra ở đây gồm cỏ, củi, nước, gạo, hạt, thuốc — dịch "thứ nuôi dưỡng" thay vì "thức ăn" của Thích Minh Châu vì nghĩa không chỉ là thức ăn. (6) paccantimaṁ nagaraṁ = "thành trì biên cương", khớp tiền lệ 1 nơi trong tầng.
  Chỗ Việt thêm chủ ngữ vì Pāli lược: "Thành trì" ở 2.1 và 9.1, "Vị ấy" ở 13.5 và 21.1 (theo ngữ cảnh kề trước, không thêm nghĩa). Các câu điều kiện 1.1/1.2, 13.1/13.2, 13.3/13.4, 25.1/25.2 ghép bằng dấu phẩy và "thì" ở khoá sau, trong khi Pāli ngắt bằng dấu chấm; đây là chọn lựa cú pháp tiếng Việt, không đổi nghĩa.
  technical_integrity 9,6 vì chưa chạy các cổng của kho: npm run validate, npm test, npm run check, npm run build do điều phối viên chạy.
