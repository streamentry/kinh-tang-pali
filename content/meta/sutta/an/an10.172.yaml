notes: |-
  **Cổng kỹ thuật của kho CHƯA chạy.** Lượt dịch này bị cấm chạy `npm run validate`, `npm test`, `npm run check` và `npm run build`; bốn lệnh đó để người điều phối chạy, nên `technical_integrity` đặt 9.6 chứ không phải 10.0 và **không** tuyên bố technical gate pass.

  **Vì sao `draft`.** Bản dịch đủ 122/122 khoá và điểm trung bình 9.22, nhưng coverage tầng English dưới sàn 0.80 (xem mục *English tham khảo*), nên theo luật blocker thắng điểm, bài giữ `draft` cho đến khi lớp `english-project` lấp 18 khoá Sujato để trống rồi chấm lại. Không nâng điểm để né blocker.

  **Phạm vi và kiểm cơ học.** Bài đủ 122 khoá, đúng thứ tự khoá Pāli, không khoá nào ngoài tập Pāli. Tự kiểm trên mọi khoá (kể cả khoá ngắn hơn 40 ký tự): tập khoá khớp 122/122; nháy đơn ‘’ và nháy kép “” khớp Pāli từng khoá (0 lệch trên 122); khoá Pāli có `…pe…` (5 khoá: `6.3`, `11.2`, `22.2`, `24.2`, `25.3`) có đúng một `…` ở bản Việt, Pāli không có `…` trần, không có `(…)`; NFC; không khoá rỗng; không khoảng trắng thừa; không Pāli lọt sang bản Việt ngoài tên riêng Jāṇussoṇi, Mahākaccāna, Kaccāna. Đã in và đọc đối chiếu cặp Pāli↔Việt từng khoá. Dấu nháy chạy qua nhiều khoá theo đúng Pāli: lời các tỳ-kheo mở ở `5.1` và đóng ở `7.6`; lời Tôn giả Mahākaccāna mở ở `11.1` và đóng ở `22.6`; lời các tỳ-kheo với Đức Phật mở ở `24.1` và đóng ở `27.2`; lời Đức Phật mở ở `28.1` và đóng ở `28.4`. `6.4` Pāli không có dấu nháy đóng nên Việt cũng không có.

  **Pāli trùng nguyên văn.** Trong chính bài: 10 nhóm Pāli trùng nguyên văn (các lần dẫn lại câu tóm lược ở `1.2`/`2.4`/`5.3`, `2.3`/`5.2`, `2.5`/`5.4`, `3.3`/`7.3`/`9.5`/`26.3`, `6.5`/`25.5`, `7.2`/`26.2`, `7.4`/`26.4`, `7.5`/`26.5`, `11.2`/`24.2`, `11.3`/`22.3`/`24.3`), 0 nhóm mà bản Việt khác. Với bài khác: 42 khoá có Pāli trùng nguyên văn ở bài khác đã có bản Việt, 578 cặp, trong đó 142 cặp bản Việt khác. Phần lớn là công thức mở/đóng; khoá đã dùng lại nguyên văn từ bản gần nhất cùng công thức (`mn138`, `mn18`, `mn133`, cùng một cặp Tôn giả Mahākaccāna giải rộng bản tóm lược): `2.1` (`mn18:10.1`), `2.2`/`6.2`/`25.2` (`mn138:5.2`, `23.6`, `6.7`), `2.6`/`6.5`/`25.5` (`mn138:5.5`), `3.2`/`7.2`/`26.2` (`mn138:6.12`), `3.3`/`7.3`/`9.5`/`26.3` (`mn138:6.13`), `4.1` (`mn138:6.1`), `4.2` (`mn138:6.2`), `5.1` (`mn138:6.3`), `7.4`/`26.4` theo `mn138:6.14`, `8.3` (`mn138:7.3`), `9.1` (`mn138:8.1`), `9.6` (`mn133:10.6`, `mn138:8.6`), `10.1` (`mn138:9.1`), `11.1` (`mn138:9.4`), `22.4` (`mn138:22.4`), `24.1` (`mn138:23.2`), `26.1` (`mn138:23.10`), `1.5` (`mn138:4.2`, 3 khoá), `28.5` *Thứ sáu.* (263 khoá, dạng đa số). Cặp trùng nguyên văn mà bản Việt khác, có cân nhắc: `1.4` *Đức Phật đã nói như vậy.* (104 khoá, so với *Đức Thế Tôn nói như vậy.* 30 và *Đức Thế Tôn đã nói như vậy.* 27; theo dạng đa số và theo `mn138`, cùng khuôn kinh; thân bài dùng *Đức Phật* nhất quán). `21.3`/`21.4` và `12.4`–`12.6` có tiền lệ Pāli trùng ở `an10.114`, `an10.116`, `an10.173` (*nhiều pháp bất thiện, pháp xấu được sinh khởi … được tu tập, viên mãn*) nhưng **không** chép lại: đo trên 214 khoá có `pāpakā akusalā dhammā`, *pháp ác bất thiện* 114 khoá so với *bất thiện, xấu* 39; đo trên 94 khoá có `bhāvanāpāripūriṁ`, *viên mãn của sự tu tập* 73 khoá (`mn117:35.5`, `ne12`, `an10.106`–`an10.110`) so với *được tu tập, viên mãn* 14 khoá. Dùng dạng đa số cho cả chín cặp đó (5 khoá, 9 cặp), nên các khoá này nhất quán trong chính bài. `28.1` dùng *Lành thay, lành thay* (3 trong 5 khoá `Sādhu sādhu, bhikkhave`) thay vì *Tốt lắm, tốt lắm* của `mn38:7.5`. `28.2` tách thành hai câu theo dấu chấm của Pāli (`mn138:24.1` dùng dấu chấm phẩy vì Pāli ở đó là dấu chấm phẩy).

  **Số Pāli.** Không có số lượng cần tính trong bài. Hai chỗ có chữ số trong Pāli: `Chaṭṭhaṁ` (`28.5`) = *Thứ sáu* (khớp thứ tự trong phẩm: `an10.171` *Thứ năm*, `an10.173` *Thứ bảy*), và `ekamantaṁ` (`4.2`, `23.1`) = *một bên* (công thức). Mười nghiệp đạo trong danh sách `12`–`21` được đếm bằng Pāli: sát sinh, trộm cắp, tà dâm, nói dối, nói hai lưỡi, nói ác khẩu, nói phù phiếm, tham lam, sân hận, tà kiến = 10 mục, mỗi mục một khối riêng, khớp với 10 khối `12.x`–`21.x` (khối đầu `12` có thêm hai khoá câu hỏi `12.1`, `12.2`).

  **Thuật ngữ và tiền lệ đã đo.** `adhamma`/`dhamma` → *phi pháp* / *pháp* (`an10.114`, `an10.116`, `an10.173` dùng *phi pháp* / *pháp*; `an10.171` dùng *điều phi pháp* / *điều đúng pháp* vì Pāli khác — danh sách mười nghiệp đạo trong một câu). `anattha`/`attha` → *điều bất lợi* / *điều lợi* (Pāli `anattho ca veditabbo attho ca` trùng 6/6 khoá trong tầng đều dịch *điều bất lợi và điều lợi*; `an10.171`, `an10.178` dùng *phi lợi ích* / *có lợi ích* cho một Pāli khác nên không áp dụng). `veditabbo`/`viditvā` → *thấy biết* (`an10.114`, `an10.173`; `an10.171` dùng *biết*). `paṭipajjitabbaṁ` → *thực hành* (`an10.173`; `an10.171` dùng *bước đi*). `pāṇātipāta` → *sát sinh* (dạng của `an10.171:2.2`, `an10.176`, `an10.177`, `an10.178:2.2`; chỉ `an10.173` dùng *sát hại điều sống*, một bài); `adinnādāna` → *trộm cắp* (`an10.171`, `an10.178` cùng danh sách; *lấy của không cho* dùng cho động từ ở nơi khác); `veramaṇī` → *kiêng tránh* (`an10.171`, `an10.178`; *tránh xa* ở `dn33`). `pisuṇā vācā` → *nói hai lưỡi*, `pharusā vācā` → *nói ác khẩu*, `samphappalāpo` → *nói phù phiếm* (đúng danh sách `an10.171:2.2`, `an10.178`); `abhijjhā`/`anabhijjhā` → *tham lam* / *không tham lam*, `byāpāda`/`abyāpāda` → *sân hận* / *không sân hận* (Sujato: *contentment* / *good will*, kho theo `an10.171:3.2`). `pāpakā akusalā dhammā` → *pháp ác bất thiện* (114/214, xem trên). `bhāvanāpāripūriṁ gacchanti` → *đi đến sự viên mãn của sự tu tập* (73/94). `paccaya` ở `…paccayā` → *do duyên* (`mn117:35.5` *do duyên chánh kiến*). `uddesa` → *bản tóm lược*, `saṅkhittena` → *vắn tắt*, `vitthārena atthaṁ avibhajitvā` → *chưa phân tích rộng nghĩa* (`mn138`). `sabrahmacārī` → *đồng phạm hạnh*, `viññū` → *có trí* (`mn138`). `agaruṁ karitvā` → *không ngại bỏ công* (`mn133:10.6`, `mn138:8.6`). `cakkhubhūto … dhammassāmī tathāgato` → theo đúng khuôn `mn133:9.3`, `mn138:7.3` (6/6 khoá). `Sugata` → *đấng Thiện Thệ* (`mn138:4.2`, 3 khoá). `vihāra` → *tịnh phòng* (`mn138:4.2`, 3 khoá; Sujato *dwelling*). `āvuso` → *hiền giả* (số nhiều *Này các hiền giả* khi Tôn giả Mahākaccāna hay các tỳ-kheo nói với nhóm; *thưa hiền giả* khi các tỳ-kheo nói riêng với Tôn giả Mahākaccāna); `āyasmanto` (`8.2`) → *các Tôn giả*. `bhante` → *Bạch Thế Tôn* (`mn138:23.2`). Tên phẩm `0.2` giữ *17. Phẩm Vua Jāṇussoṇi* (7/7 khoá, dù Pāli chỉ có `Jāṇussoṇivagga` và Sujato dịch *With Jānussoṇi*, không có chữ *vua*; vấn đề tên phẩm của tầng, ghi lại để người biên tập quyết, không sửa ở đây). Tên kinh `0.3` *Kinh Pháp (2)*: Pāli `Dutiyaadhammasutta` trùng với `an10.114:0.3` (cùng tên *Kinh Pháp (2)*, vì mỗi bài là *Dutiya* của phẩm riêng) — hai bài trùng tên trong cùng kho, ghi vào danh sách chờ biên tập. `0.1` dùng *Kinh Tăng Chi Bộ 10.172* (an10: 165 khoá dạng này so với 23 khoá *Aṅguttara Nikāya*; toàn bộ an: 922 so với 377), dù `an10.171` cùng phẩm đang dùng dạng sau.

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh.**
  · **`adhamma`/`dhamma` và `anattha`/`attha` (`1.1`–`1.3`, `12.1`–`21.4`).** Dịch *phi pháp* / *pháp* và *điều bất lợi* / *điều lợi* theo tiền lệ của tầng. Sujato dịch *bad principles / good principles* và *bad results / good results*. Ở phần giải thích (`12.5`, `12.6` … `21.3`, `21.4`) `anattho`/`attho` chỉ những *pháp ác bất thiện* / *pháp thiện* sinh ra từ mỗi nghiệp, nên *điều bất lợi / điều lợi* là kết quả; còn trong lời tóm lược (`1.2`) và lời hỏi (`12.2`) `attha` vừa là *nghĩa* vừa là *lợi ích*. Chữ *lợi* bao trùm cả hai, nhưng độc giả nên biết `attha` cũng là chữ *nghĩa* ở các cụm `vitthārena atthaṁ` (*rộng nghĩa*).
  · **Bản Thích Minh Châu nguyên bài không có văn kinh.** Mục Tra cứu toàn văn của bài chỉ có dòng chú thích *giống như kinh số 115, có hai sự khác: nói đến Tôn giả Mahākaccāna thay vì Tôn giả Ānanda; phi pháp là sát sinh cho đến tham, sân, tà kiến, và pháp là từ bỏ chúng cho đến không tham, không sân, chánh kiến.* Dòng chú thích này khớp với cấu trúc Pāli của bài (Tôn giả Mahākaccāna phân tích, mười nghiệp đạo), nhưng không cung cấp câu chữ để đối chiếu thuật ngữ.
  · **`8.4`, `9.2` (`ahosi`).** Pāli là quá khứ (`kālo ahosi`), dịch *Lúc ấy chính là lúc …* theo hướng của `mn138:7.4` (*Chính lúc ấy là lúc*); Sujato *That was the time*. Không đổi nghĩa; theo tiền lệ.
  · **`3.2`/`3.3` và `7.2`/`7.3` (và các khoá song song).** Pāli ngắt câu bằng dấu chấm giữa `sabrahmacārīnaṁ.` và `Pahoti cāyasmā …`; Việt nối bằng dấu chấm phẩy và `và` theo `mn138:6.12`–`6.13` (cùng Pāli, cùng cách ngắt), nghĩa không đổi.
  · **`6.4`, `11.3`, `22.3`, `24.3`, `25.4`.** Pāli chỉ còn vế cuối `tathā paṭipajjitabban’ti` (vế `yathā dhammo yathā attho` đã bị lược), nên Việt giữ đúng vế đó — *thì cần phải thực hành đúng như vậy* — không mở rộng. `6.4` Pāli có `paṭipajjitabbanti` không có dấu nháy đóng; Việt cũng không thêm.
  · **`10.2`, `23.1` (`Evaṁ, āvuso`/`Evamāvuso`).** Dịch *Vâng, thưa hiền giả* với dấu nháy đóng đặt trước dấu phẩy như `mn138:9.2`.
  · **`28.3` (`cetaṁ`).** `ahampi cetaṁ evamevaṁ byākareyyaṁ` dịch *Ta cũng sẽ giải đáp đúng như vậy*; chữ `ca` trong `cetaṁ` là tiểu từ nối, không dịch riêng. Pāli ở đây có `upasaṅkamitvā` (*đến chỗ Ta*) mà `mn138:24.2` không có, nên Việt thêm *đến chỗ Ta và hỏi* theo Pāli của bài này.
  · **`22.5` (`Ākaṅkhamānā ca pana`).** Dịch *Còn các hiền giả, nếu muốn …*; Sujato *If you wish*. `mn138:22.5` dịch *Nếu các Tôn giả muốn* vì Pāli ở đó là `āyasmanto`, ở đây là `āvuso`.

  **English tham khảo.** Sujato có bản cho bài này (122 khoá), nhưng để trống nhiều khoá: toàn bộ lần lặp lại lời tóm lược trong lời kể của các tỳ-kheo (`5.1`–`5.4`, `6.1`–`6.5`, `7.1`–`7.5`) và lần kể lại với Đức Phật (`24.1`–`24.3`, `25.1`–`25.5`, `26.1`–`26.5`). Mẫu số coverage = 77 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); Sujato phủ 59/77 = 0.766 (dưới sàn 0.80), 18 khoá Pāli có nội dung Sujato để trống: `5.1`, `5.2`, `5.4`, `6.1`, `6.2`, `6.5`, `7.2`, `7.3`, `7.4`, `7.5`, `24.1`, `25.1`, `25.2`, `25.5`, `26.2`, `26.3`, `26.4`, `26.5`. Lớp `english-project` không có tệp cho bài này, nên 100% phần đã phủ là từ Sujato độc lập, không có phần nào do dự án tự lấp. Tầng `vietnamese-current` chỉ có Pháp Cú tại commit đã ghim, nên vắng với bài này. Một ô Anh rỗng không phải sự đồng thuận về cách dịch: 18 khoá đó dựa vào Pāli một mình, nhưng 13/18 khoá có Pāli trùng nguyên văn hoặc với khoá Sujato đã dịch trong cùng bài (`5.2` = `2.3`, `5.4` = `2.5`, `7.3` và `26.3` = `3.3`/`9.5`) hoặc với bài song song đã có bản Việt công bố (`5.1`, `6.2`, `6.5`, `7.2`, `7.3`, `24.1`, `25.1`, `25.2`, `25.5`, `26.2`, `26.3` ở `mn138`, `mn18`, `mn133`), và 5/18 khoá còn lại (`6.1`, `7.4`, `7.5`, `26.4`, `26.5`) chỉ khác các khoá Sujato đã dịch (`2.1`, `3.4`, `3.5`) ở một tiền tố `paṭi-` hoặc từ xưng hô, nên nghĩa không bất định; vẫn chặn ở cổng vì coverage đo trên khoá, không đo trên nội dung lặp. Đã đối chiếu Sujato ở những chỗ lệch: Sujato dịch `attha` là *results* (kết quả) ở phần giải thích và *meaning* ở các cụm `vitthārena atthaṁ`; Sujato dịch `anabhijjhā` / `abyāpāda` là *contentment* / *good will* trong khi kho dùng *không tham lam* / *không sân hận* (xem trên).
