  Sửa lan 2026-10-13: khoá an3.96:1.1 và 1.4 (Pāli rājāraho hoti rājabhoggo, rañño aṅganteva saṅkhyaṁ gacchati), "là báu vật của vua, được tính là một phần của vương quyền" → "dùng cho vua, được kể là một chi phần của nhà vua"; căn cứ: bhogga = dùng cho (không phải "báu vật"), aṅga = chi phần/phần (không phải "vương quyền"); đồng bộ với an3.97:1.1, 1.4 và an3.98:1.1, 1.4 (cùng công thức).
