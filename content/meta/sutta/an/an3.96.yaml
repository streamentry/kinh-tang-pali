notes: |-
  Sửa lan 2026-10-13: khoá an3.96:1.1 và 1.4 (Pāli rājāraho hoti rājabhoggo, rañño aṅganteva saṅkhyaṁ gacchati), "là báu vật của vua, được tính là một phần của vương quyền" → "dùng cho vua, được kể là một chi phần của nhà vua"; căn cứ: bhogga = dùng cho (không phải "báu vật"), aṅga = chi phần/phần (không phải "vương quyền"); đồng bộ với an3.97:1.1, 1.4 và an3.98:1.1, 1.4 (cùng công thức).

  Sửa lan 2026-10-13: khoá an3.96:1.5 và 4.7 (Pāli āhuneyyo hoti pāhuneyyo dakkhiṇeyyo añjalikaraṇīyo), "đáng được cúng dường, đáng được tiếp đón, đáng nhận vật bố thí đài các, đáng được chắp tay" → "đáng được hiến dâng, đáng được tiếp đón, đáng được cúng dường, đáng được chắp tay"; căn cứ: āhuneyya = hiến dâng, dakkhiṇeyya = cúng dường (không phải "vật bố thí đài các"), đồng bộ với an3.98:1.5, an5.203:2.4 và an6.10:4.2 (cùng bốn từ Pāli). Giữ nguyên 1.1 và 1.4 (rājabhoggo → "dùng cho vua"): dạng này đã đồng bộ với an3.97, an3.98, an6.5–an6.7 và an8.13, không đổi theo an5.203.
