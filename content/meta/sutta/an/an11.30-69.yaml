notes: |-
  Lát đoạn (10 khoá, trong đó chỉ 5 khoá thân có nội dung). Bản dịch phủ đủ 10 khoá, không thừa, không thiếu.
  
  **Đối chiếu được tầng Anh đầy đủ.** Sujato có mặt và lạp đúng cả 5 khoá thân: *… ear … / nose … / tongue … / body … / mind …*. Không có chỗ nào Sujato im lặng trong phần thân, nên `triangulation` ở mức cao của lát. Việc `an11.30-69` không bị tính vào `substantivePaliMinChars` (cả 5 khoá thân đều ngắn hơn 40 ký tự) là đặc điểm của lát đoạn, không phải thiếu sót.
  
  **`Paṭhamapaṇṇāsaka` → *Nhóm Năm Mươi Đầu*** là cách đúng (Sujato: *The First Fifty*) và trùng đa số tầng: 9 tệp `an11.*` đã có dùng nguyên văn cụm này, kể cả `an11.982`. Ngược lại cụm *Bộ Mười Một Bài Kinh Đầu Tiên* là cách **sai nghĩa** (xem `an11.406-453`).
  
  **`0.1` giữ đúng khoảng số**: *Aṅguttara Nikāya 11.30–69*, khớp với mọi lát gộp khác trong `an11` (28 tệp gộp có khoảng).
  
  **Về giới hạn tầng Việt**: tại commit đã ghim, `translation/vi/phantuananh` chỉ có Pháp Cú, nên `an11` không có bản Hòa thượng Thích Minh Châu để đối chiếu. Đây là đặc điểm của snapshot upstream, đã ghi ở `content/meta/reference-gaps.yaml` — không phải thiếu sót của repo, nhưng cũng nghĩa là **thuật ngữ của lát này không có tầng Việt truyền thống nào để đối chiếu**; tôi chỉ đối chiếu được Pāli + Sujato.
  
  Điểm trừ nhỏ: năm khoá `1.2`–`1.6` dùng giới từ không đồng nhất (*Trong tai / Trên lưỡi / Trên thân / Trong tâm*). Cả tứ đều đúng với `sotasmiṁ` (nơi chốn), `jivhāya`/`kāyasmiṁ`/`manasmiṁ`, nhưng người đọc có thể thấy bốn cách cho một liên từ.
