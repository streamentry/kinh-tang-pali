notes: |-
  Mười khoá, mỗi khoá một từ. Đây là 40 kinh vô danh an11.30…an11.69 đã gộp trong một
  tệp bilara; SuttaCentral chỉ giữ lại chữ cuối của mỗi kinh (Sotasmiṁ, ghānasmiṁ,
  jivhāya, kāyasmiṁ, manasmiṁ), nên bản dịch cũng là năm mảnh vụn, KHÔNG mở rộng
  (BRIEF_VI3 §10.1): không viết chữ nào ở chỗ Pāli lược. 1.1 là dấu lược trần của Pāli
  nên tôi để y nguyên là …, và mỗi khoá sau đó giữ đúng MỘT dấu lược.
  Tiêu đề bốn khối theo đúng an11.502-981 — bài cùng Tăng Bộ 11, cùng panṇāsaka, cùng
  Sāmaññavagga, cùng dạng bốn khối có ~ ở 0.4, nên đây là tiền lệ gần nhất chứ không
  phải tiền lệ chung chung. 0.1 có thêm khoảng số 11.30–69: Pāli chỉ ghi Aṅguttara
  Nikāya 11, nhưng mười tệp Tăng Bộ 11 đã có trong tầng đều thêm dải số cho uid-gộp
  (an11.70–117, an11.118–165, an11.502–981, an11.992–1151…), nên tôi theo.
  Trôi dạt tiêu đề — TỰ SOÁT TOÀN TẦNG, không đoán. Tôi viết script dò mọi bài khác
  trong tầng có CÙNG giá trị Pāli ở CÙNG vị trí 0.x. Kết quả: Sāmaññavagga đã có 9 bài
  dịch là Phẩm Sa-môn, tôi khớp. Nhưng đây là lỗi có sẵn của cả tầng mà tôi không sửa
  được một mình: Samaṇavagga (9. Samaṇavagga) cũng được dịch là Phẩm Sa-môn ở 21 bài,
  trong khi sāmañña là tương tự, còn samaṇa là sa-môn. Hai phẩm khác nhau đang mang
  cùng một tên Việt. Tôi theo tiền lệ 9:1 và ghi lỗi ở đây; biên tập nên đổi cả hai
  cùng một lúc. Paṭhamapaṇṇāsaka thì tầng đang có ba cách: Nhóm Năm Mươi Đầu (5 bài),
  Bộ Mười Một Bài Kinh Đầu Tiên (4 bài), và giữ nguyên Pāli (2 bài). Tôi theo đa số 5,
  cách ấy cũng khớp gloss của Sujato là The First Fifty. Lựa chọn khác là Bộ Mười Một
  Bài Kinh Đầu Tiên của an11.502-981.
  Năm căn, đếm tiền lệ trong toàn tầng. sota → tai (658 chỗ), ghāna → mũi (467), jivhā
  → lưỡi (515), kāya → thân (82 chỗ có đủ câu trên thân; sn21.6:2.4 dịch kāyasmiṁ là
  thân), mana → tâm (trong tâm 171 chỗ). Vị trí chữ hậu tố quyết định mạo từ: sotasmiṁ
  và ghānasmiṁ và manasmiṁ là nơi chốn nên dịch Trong tai, Trong mũi, Trong tâm; jivhāya
  và kāyasmiṁ cũng là nơi chốn nhưng tiếng Việt đọc tự nhiên hơn với Trên lưỡi, Trên
  thân, và Sujato cũng dịch bằng on the tongue, on the body. Đây là 0 tiền lệ cho cả
  năm vị trí này ở dạng từ vụng, tôi đặt mới và ghi lý do. Bất định: mana trong danh
  sách năm căn, sn27.1:1.7 đã dịc là ý, tức Tham dục đối với ý là ô nhiễm của tâm; tôi
  dùng tâm vì ở đây chỉ còn một từ vụng đứng một mình và Trong ý không phải tiếng Việt.
  Không có nháy kép nào ở Pāli nên bản Việt cũng không thêm, khớp an11.502-981 và
  an11.992-1151 vốn cũng không có.
  Kỹ thuật: save_vi chạy sạch, chạy lại hai lần idempotent (sha256 không đổi). Mọi khoá
  Pāli ở bài này ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và các assertion không
  tự chạy; tôi tự quét MỌI khoá bằng script riêng: đủ 10/10, đúng ID, đúng thứ tự,
  không rỗng, NFC, dấu lược khớp Pāli từng khoá, nháy kép cân. Tôi KHÔNG chạy
  npm run validate|test|check|build (lát này cấm) nên technical_integrity = 9.5, không
  phải 10. Tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên không có bản Hòa
  thượng Thích Minh Châu để đối chiếu; scorecard này không tuyên bố đã đối chiếu
  tầng Việt hiện hành.
