notes: |-
  **Đã đọc toàn bộ Pāli 112 khoá trước khi viết**, đối chiếu từng khoá với Pāli root đã ghim và bản Anh Bhikkhu Sujato (nơi có), rồi in lại từng cặp Pāli↔Việt đọc đối kháng sau khi ghi. Bài thuộc phẩm `Mahāvagga`, tiêu đề Pāli `Paṭhamamahāpañhāsutta` (bài thứ nhất của chuỗi *Những Câu Hỏi Lớn*; bài thứ hai là `an10.28`). Đặt tên *Kinh Những Câu Hỏi Lớn (1)* theo Sujato (*The Great Questions (1st)*) và theo mẫu `(2)` của bài đôi cùng chuỗi.

  **COVERAGE ENGLISH — (kết luận "giữ `draft`/blocker" của mục này bị thay thế bởi mục "Giải quyết draft 2026-10-12"; số đo vẫn đúng).** Mẫu số = Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`) = **76** khoá. Bản Anh Sujato đã ghim phủ **31/76 = 0,4079**, dưới sàn 0,80. **45** khoá Sujato để trống dù Pāli viết đủ: `6.1` `6.3`–`6.6` `7.1`–`7.5` `8.1`–`8.3` (lời các tỳ-kheo kể lại với Đức Phật) và các khoá `x.1` `x.3` `x.6` `x.7` của các vòng `11`–`18` (Sujato nén các vòng lặp thành dấu lược). Bài chưa có lớp `english-project` nên cổng cũng tính 31/76; tầng Việt hiện hành của SuttaCentral tại commit đã ghim chỉ có Pháp Cú nên vắng ở bài này. Ở 45 khoá trống đó Pāli phải tự đứng vững; tôi **không** tuyên bố đã đối chiếu English ở đó. `triangulation` đặt **7,5**, `status: draft` kèm blocker. Chưa có `reference-gaps` cho bài này; `draft` không bị chặn bởi gap, nhưng muốn lên `review` hoặc `published` phải có English độc lập phủ đủ hoặc người biên tập phán xử.

  **Đối chiếu Việt truyền thống (nguyên bài, không phân đoạn).** Bản Hòa thượng Thích Minh Châu (hiệu đính Bình Anson) ở mục *Tra cứu toàn văn* cuối trang rút gọn: gộp các vòng 6–8 vào vài đoạn, dùng dấu lược thay vì viết đủ từng vòng; bản này viết đủ từng khoá theo Pāli. Chỗ khác thuật ngữ có chủ ý: `uddesa` *lời tóm lược* (Hòa thượng: *câu tuyên bố*; Sujato *summary recital*); `veyyākaraṇa` *lời giải đáp* (Hòa thượng: *câu trả lời*); `abhijānātha` / `abhiññāya` *trực tiếp biết* (Hòa thượng: *thắng tri*; Sujato *directly know*); `sammadatthaṁ abhisamecca` *thấu triệt đúng đắn mục đích* (Hòa thượng: *chơn chánh thắng tri ý nghĩa*; Sujato *fully comprehending its meaning*); `pariyantadassāvī` *thấy rõ giới hạn* (Hòa thượng: *thấy được sự cứu cánh*; Sujato *seeing their limits*). **Khác Pāli ở khoá `19.5`:** Hòa thượng ghi *mười thiện nghiệp đạo* nhưng Pāli của bài này là `akusalesu kammapathesu` (bất thiện) và Sujato *ways of performing unskillful deeds*; theo Pāli, dịch *mười nghiệp đạo bất thiện*. Bài đôi `an10.28:9.5` có Pāli `kusalesu` (thiện), nên hai bài chỉ khác nhau đúng ở từ này, không phải lỗi dịch.

  **BÀI SONG SONG.** Phần mở đầu (`1.2`–`5.1`, `6.x`–`8.x`) và các khoá `9.1` `9.3` `9.5` `9.6` đồng cấu với `mn13:2.1`–`6.8` và `sn46.53:2.1`–`3.1`; tôi lấy khung từ đó rồi viết lại theo Pāli của bài này. `9.5` (*Vì, này các tỳ-kheo, điều ấy nằm ngoài khả năng hiểu biết của họ.*) giống nguyên văn `mn13:6.7`. `9.6` dùng nguyên văn `mn13:6.8` (Pāli chỉ khác một dấu phẩy so với bài này); `sn46.53:3.1` có cùng Pāli nhưng bản Việt ở đó bỏ vế *này các tỳ-kheo* nên không theo.

  **TIỀN LỆ, ĐẾM TỪNG CỤM.**
  · Khoá trùng Pāli ngoài bài: **31** khoá của bài có ít nhất một trùng, tổng **1.112** cặp, trong đó **448** cặp Việt khác bản này (phần lớn do `Taṁ kissa hetu?` 470 khoá trùng — *Vì sao vậy?* 308, các dạng khác 162 — và `Kiñcetaṁ paṭicca vuttaṁ?` 24 khoá).
  · `Kiñcetaṁ paṭicca vuttaṁ?` (`11.2`–`18.2`, Pāli trùng nguyên văn nhau; cả 8 khoá cùng một câu Việt): 24 khoá trùng ở tầng, bốn dạng — *nhân gì mà được nói?* 16 (đều trong riêng `mn114`), *Nhờ nhân duyên gì mà nói vậy?* 4, *nhưng vì lý do gì Ta đã nói vậy?* 3, *Được nói đến vì nhân duyên gì?* 1 (`mn139:10.3`). Chọn dạng cuối vì cụm *iti kho panetaṁ vuttaṁ. Kiñcetaṁ paṭicca vuttaṁ?* có **34** khoá trùng ở tầng, trong đó dạng *đó là điều đã được nói. Được nói đến vì nhân duyên gì?* là dạng nhiều nhất (24 trên 34 khoá trùng, 10 khoá còn lại khác), dùng cho `10.2` và `19.2`.
  · `iti yaṁ taṁ vuttaṁ idametaṁ paṭicca vuttaṁ` (`10.8` và các vế đóng): 21 khoá trùng ở tầng, *đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói.* nhiều nhất (12 trên 21 khoá trùng; `mn139`, `mn148`).
  · `Sattamaṁ.` (`19.9`): **268** khoá trùng Pāli ở tầng, *Thứ bảy.* **263**; riêng `an` 126 so với 1.
  · `0.2` *3. Phẩm Lớn* khớp 5/5 khoá trùng. `0.1`: *Kinh Tăng Chi Bộ N* là dạng đa số của tầng.
  · `Ekaṁ samayaṁ … jetavane anāthapiṇḍikassa ārāme.` (`1.1`): 36 khoá trùng, *Một thời, Đức Phật ở Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika.* 16 (riêng `an10` 8/8, riêng `an` 12/23).
  · `aññatitthiyā paribbājakā` (`1.5` `2.1` `2.2` `4.1` … `9.1` `9.3`): 172 khoá chứa cụm ở tầng; *du sĩ ngoại đạo* 83, *du sĩ đạo khác* 31, *du sĩ thuộc giáo phái khác* 10, *du sĩ thuộc đạo khác* 4, chỉ *du sĩ* 26. Theo riêng `an` thì *du sĩ đạo khác* 22 so với *du sĩ ngoại đạo* 11 và riêng `an10` là *du sĩ đạo khác* 5 trên 5 khoá đo được (1 khoá không chứa chữ *du sĩ*); chọn *du sĩ đạo khác*. Ghi cả hai số vì toàn tầng đa số là *ngoại đạo* còn phạm vi gần nhất là *đạo khác*. `mn13` (cùng cảnh) dùng *du sĩ thuộc giáo phái khác*.
  · `sabbaṁ dhammaṁ abhijānāti; sabbaṁ dhammaṁ abhiññāya` (cùng cấu trúc với `3.2` `3.4`): 5 khoá tầng, *trực tiếp biết* 4 (`mn37` ×3, `an7.61`), *thắng tri* 1 (`sn35.80`); chọn *trực tiếp biết*. `viharatha` *sống* 38/48.
