  · Danh sách mười vòng theo đúng danh sách của `dn34`: *danh và sắc*, *ba thọ*, *bốn loại thực*, *sáu nội xứ*, *bảy trú xứ của thức*, *tám pháp thế gian*, *chín trú xứ của chúng sinh*, *mười nghiệp đạo bất thiện* (`dn34:1.3.9` `1.4.10` `1.5.14` `1.7.18` `1.8.11` `2.1.35` `2.2.10` `2.3.57`). `Sabbe sattā āhāraṭṭhitikā` (`10.5`) lấy *Tất cả chúng sinh đều tồn tại nhờ vật thực* theo `dn34:1.2.27` và `dn33:1.8.2` (2 khoá cùng cụm). Thuật ngữ: `upādānakkhandha` *thủ uẩn* 149/179; `ajjhattika āyatana` *nội xứ* 37/47; `viññāṇaṭṭhiti` *trú xứ của thức* 10/40; `lokadhamma` *pháp thế gian* 10/31; `pañha` *câu hỏi* 413/428; `uddesa` *tóm lược* 84 trên 330; `diṭṭheva dhamme` *ngay trong hiện tại* 220 so với *ngay trong đời này* 140.
  · Công thức `sammā nibbindamāno … dukkhassantakaro hoti` (10 vòng): 0 tiền lệ trong tầng; dùng một khuôn duy nhất cho cả mười vòng và khớp với khuôn của bài đôi `an10.28` (*nhàm chán / ly tham / giải thoát / thấy rõ giới hạn một cách đúng đắn, sau khi thấu triệt đúng đắn mục đích*).

  **SỐ PĀLI, TỰ TÍNH.** Dãy `9.2` theo đúng thứ tự Pāli: `eko/ekaṁ` 1 · `dve` 2 · `tayo/tīṇi` 3 · `cattāro/cattāri` 4 · `pañca` 5 · `cha` 6 · `satta` 7 · `aṭṭha` 8 · `nava` 9 · `dasa` 10 — Việt *một, hai, ba, bốn, năm, sáu, bảy, tám, chín, mười*, mỗi số lặp đủ ba lần (câu hỏi, lời tóm lược, lời giải đáp), tổng 30 mục, không vế nào đổi chỗ. Các vòng `10`–`19` theo cùng thứ tự: `dvīsu` 2, `tīsu` 3, `catūsu` 4, `pañcasu` 5, `chasu` 6, `sattasu` 7, `aṭṭhasu` 8, `navasu` 9, `dasasu` 10; số trong từng khoá `x.1` `x.3` `x.4` `x.6` `x.7` khớp số của vòng (phép đo: **0** lệch trên 9 vòng). Danh sách trả lời khớp con số: *danh và sắc* (2), *ba thọ* (`tīsu vedanāsu`), *bốn loại thực* (`catūsu āhāresu`), *năm thủ uẩn*, *sáu nội xứ*, *bảy trú xứ của thức*, *tám pháp thế gian*, *chín trú xứ của chúng sinh*, *mười nghiệp đạo bất thiện*. Không có số lớn nào (`sahassa`, `sata`, `navuti` …) trong bài.

  **CẤU TRÚC VÀ CHỖ LƯỢC.** Bài lập lại một công thức theo mười vòng. **Một khoá có `…pe…`** (`17.6`: Pāli `sammā nibbindamāno …pe… dukkhassantakaro hoti`), giữ **đúng một `…`**, không mở rộng; Pāli không có `…` trần nào khác và không có `(…)` nào, nên Việt cũng không có. Phép đo cho **0** lệch: khoá nào Pāli có `…pe…` thì Việt có đúng một `…`, và ngược lại. Khoá này Pāli có phần cuối `dukkhassantakaro hoti` nên Việt kết `.` thường.
  **Nhóm lặp, đo trong chính bài.** Pāli trùng nguyên văn nhau trong bài: `10.1` = `10.7`, `19.1` = `19.7`, `10.2` = `19.2`, và 8 khoá `Kiñcetaṁ paṭicca vuttaṁ?` (`11.2`–`18.2`) — **4 nhóm, 0 cặp Việt khác**. Ngoài ra không có cặp trùng nào; các khoá gần trùng (`x.1` `x.3` `x.4` `x.6` `x.7` của các vòng) chỉ khác ở số đếm và danh từ, và Việt khác đúng ở đó. `10.1`/`19.1` kết dấu phẩy và `10.2`/`19.2` mở bằng chữ thường vì Pāli là một câu bị cắt đôi qua khoá (`ti,` rồi `iti kho panetaṁ vuttaṁ`).

  **NGOẶC KÉP VÀ NHÁY — khớp Pāli TỪNG KHOÁ.** Cả bốn loại `“` `”` `‘` `’` khớp Pāli ở **112/112** khoá, không lệch khoá nào. Cấu trúc: suy nghĩ của các tỳ-kheo mở `“` ở `1.4`, đóng `”` ở `1.5`; lời các du sĩ mở `“` ở `3.1`, đóng `”` ở `3.5`, với các câu trích `‘…’` ở `3.2` và `3.4`; suy nghĩ ở `4.3` trong `“…”`; lời các tỳ-kheo kể lại mở `“` ở `6.1` và đóng `”` ở `8.3` (cùng khoá với `’`), với `‘…’` ở `6.3`–`6.4`, `8.3`, và câu trích `‘…’` **chạy qua** `7.1`–`7.5` (mở `‘` ở `7.1`, đóng `’` ở `7.5`, đúng như Pāli, các khoá `7.2`–`7.4` không có dấu nháy); lời Đức Phật mở `“` ở `9.1`, đóng `”` ở `19.8`, với `‘…’` bao các câu trích ở `9.2`, `10.1`, `10.5`, `10.7`, `11.1`, `11.7` … `19.7`. Các khoá `7.1` `7.3` `10.5` `11.5`–`19.5` kết em-dash đúng như Pāli (`—` không cách chữ, theo `mn13:3.4`).

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `sammadatthaṁ abhisamecca` (`10.3` …) — `sammā` + `attha`: `attha` có thể là *mục đích* hoặc *ý nghĩa*. Chọn *mục đích* theo mạch (*sau khi thấu triệt đúng đắn mục đích, ngay trong hiện tại là người chấm dứt khổ*) và để khớp bài đôi `an10.28`; Sujato (*meaning*) và Hòa thượng (*ý nghĩa*) cùng chọn *ý nghĩa*. Nếu người biên tập muốn theo hai bản tham khảo, đổi cả hai bài cùng lúc. 0 tiền lệ trong tầng.
  · `pariyantadassāvī` — 0 tiền lệ. Dịch *thấy rõ giới hạn*; `pariyanta` cũng có thể là *tận cùng*, *ranh giới*; Hòa thượng *thấy được sự cứu cánh*.
  · `abhisamecca` — dịch *thấu triệt* (0 tiền lệ cho dạng này trong tầng).
  · `yadidaṁ dhammadesanāya vā dhammadesanaṁ anusāsaniyā vā anusāsanin` (`3.5` `7.5`) — hình thức Pāli *A-từ-cách (instr./abl.) … A-đối-cách* (cặp từ lặp) nên dịch *giữa việc thuyết pháp với việc thuyết pháp, hay giữa lời chỉ dạy với lời chỉ dạy*, đúng cấu trúc so sánh của Sujato (*the difference between … teaching and instruction*) và của Hòa thượng (*về thuyết pháp và thuyết pháp, hay về giáo giới và giáo giới*). `mn13:3.5` rút gọn thành *về thuyết Pháp hay về giáo huấn*, không theo vì mất cặp lặp.
  · `uttari ca vighātaṁ āpajjissanti` (`9.3`) — dịch *còn bối rối* theo `mn13:6.5` và `sn46.53:2.4` (2/2 khoá cùng Pāli); `vighāta` còn có nghĩa *bực bội, phiền muộn* (Sujato *frustrated*).
  · `idha` ở `6.1` không dịch (tiểu từ mở lời, như `mn13:5.2`); `idha no, āvuso` (`3.5` `7.5`) dịch *Vậy thì, này các hiền giả* theo `mn13`.
  · `etha tumhe` (`3.2` `3.4` `7.2` `7.4`) — dịch *hãy đến đây, các thầy/các vị hãy …* theo `dn11:1.9`, `sn47.9:1.4`, không thêm giải thích.
  · `ito vā pana sutvā` (`9.6`) — *người đã nghe từ họ* theo `mn13:6.8`; `ito` có thể hiểu là *từ đây*, tức từ hai bậc vừa nêu; không thêm giải thích vào câu dịch.
  · Ngôi xưng: lời tỳ-kheo với Đức Phật dùng *Bạch Thế Tôn*; trong suy nghĩ và lời kể của họ dùng *Đức Thế Tôn* (`4.3` `8.3`); lời dẫn truyện dùng *Đức Phật* theo `an10` (8/8 khoá mở bài).

