notes: |-
  Dịch toàn bộ 89 khóa Pāli root từ snapshot SuttaCentral/Bilara đã ghim; không có khóa nào ngoài tập khóa Pāli, thứ tự khóa đúng thứ tự Pāli.

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE ENGLISH:
  - Tầng Anh Sujato có tại commit đã ghim và phủ 49/49 khóa Pāli có nội dung (>= 40 ký tự, bỏ khối :0) = 100%, vượt ngưỡng 0,80; không khóa nào có nội dung mà Sujato để trống. Chỉ khóa colophon 11.11 (Pāli "Chaṭṭhaṁ.", dưới ngưỡng 40 ký tự) Sujato để trống, tôi dịch từ Pāli theo đa số tầng: "Thứ sáu." 266/272 khóa trùng Pāli. Tầng english-project không có tệp cho bài này, nên không có lớp lấp nào lẫn vào số đo; coverage 100% hoàn toàn là Sujato độc lập. Tầng vietnamese-current (Pháp Cú) không có cho bài ngoài Dhammapada. Không phát sinh gap nên không cần entry trong reference-gaps.
  - Đã đọc thêm bản Hòa thượng Thích Minh Châu nguyên bài của SuttaCentral ("Cần Phải Thân Cận", tra cứu toàn văn, không phải tầng store và không được căn lề vào khóa) cùng hai bài song song trong chính tầng dự án là mn17 (Kinh Khu Rừng, phần 23–26 cùng khuôn "người nên thân cận hay rời bỏ") và an10.54 (cùng khuôn sáu vật dụng). Triangulation vì vậy dựa trên Sujato độc lập + bản Thích Minh Châu + hai bài song song, đặt 9.3.

  KIỂM TRA ĐO ĐƯỢC:
  - Tập khóa Việt = tập khóa Pāli = 89, thứ tự đúng.
  - Nháy đơn và nháy kép khớp Pāli từng khóa: 0 lệch trên 89 khóa, tổng 54 dấu nháy trong Pāli (nháy kép mở ở 2.1 và đóng ở 11.10; nháy đơn lồng nhau ở 3.1–3.2, 3.5–3.7 và các khóa x.1–x.2, x.5, x.7–x.9).
  - Dấu lược: Pāli có đúng một "…pe…" ở 1.1 và không có "…" trần; bản Việt có đúng một "…" ở 1.1 và không có ở nơi nào khác. Không có "(…)".
  - Pāli trùng nguyên văn trong chính bài: 22 nhóm, 87 cặp. Bản Việt khác ở 25 cặp, và cả 25 cặp đều cùng một nguyên nhân có chủ ý: câu "sevitabbopi asevitabbopi" / "sevitabbampi asevitabbampi" giữ nguyên chữ Pāli nhưng đi với sáu đối tượng khác nhau nên tôi chọn động từ riêng cho từng đối tượng (xem Thuật ngữ). Trong cùng một đối tượng, các khóa trùng Pāli đều được dịch giống hệt: 0 cặp lệch (ví dụ 3.2 = 6.6, 8.2 = 8.9, 10.2 = 10.9, 11.2 = 11.9, 3.3 = 7.3 = 8.3 = 9.3 = 10.3 = 11.3, và 6.7 = 7.10 = 8.10 = 9.10 = 10.10).
  - Pāli trùng nguyên văn với bài khác trong tầng: 44 khóa có song sinh; 19 dùng lại nguyên văn bản Việt đã có, 25 khác. Mười ba khóa dùng lại đa số của tầng: 0.2 (7/7 bài cùng phẩm), 3.3, 7.3, 8.3, 9.3, 10.3, 11.3 ("đó là điều đã được nói. Được nói đến vì nhân duyên gì?", 24/34), 6.7, 7.10, 8.10, 9.10, 10.10 ("đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói.", 15/26) và 11.11 (266/272). Khóa 11.10 dùng lại câu 15/26 ấy, thêm nháy kép đóng theo Pāli "vuttan”ti". 25 khóa khác là 3.4, 4.1, 5.1, 6.1, 7.2, 7.4–7.7, 7.9, 8.4, 8.6, 9.2, 9.4, 9.6, 9.9, 10.4–10.7, 11.4–11.7 và 11.10; lý do ở mục Thuật ngữ (khác an10.54 ở động từ "hãy nhận biết", ở "y pháp"/"y áo", và ở dấu phẩy thay dấu chấm cuối khóa x.2/x.9 theo dấu phẩy của Pāli).
  - Không có chữ số trong thân kinh (chỉ "9.6" và "1." ở khóa 0.1, 0.2 theo Pāli). Không có số lượng Pāli cần tính: "duvidhena" là "hai loại" (88/95 khóa trong tầng). Không khóa rỗng, NFC sạch, không Pāli lọt sang bản Việt (chỉ có tên riêng Sāriputta và tên bộ ở 0.1).

  THUẬT NGỮ VÀ TIỀN LỆ (đếm trên tầng):
  - sevitabba theo đối tượng: puggala → "thân cận" (77 khóa sevati/sevitabba dịch "thân cận" so với "dùng" 30); cīvara, piṇḍapāta, senāsana → "dùng" (an10.54 đã dùng "nên dùng/không nên dùng" cho đúng ba vật dụng này; bản Thích Minh Châu nguyên bài ở đây dùng "sử dụng"); gāmanigama, janapadapadesa → "lui tới" (Sujato: frequent; Thích Minh Châu: "tìm đến"). Mỗi đối tượng giữ một động từ xuyên suốt bài.
  - cīvara → "y áo": trong bộ an 23 khóa "y áo" so với 13 "y phục" và 10 "y pháp" (toàn tầng 29 / 64 / 10; mn17 dùng "y phục" cho cùng danh sách vật dụng nhưng ở bộ trung). piṇḍapāta → "thức ăn khất thực" (bộ an 21 khóa). senāsana → "chỗ ở" (bộ an 80 khóa, toàn tầng 168). gāmanigama → "làng hay thị trấn" (9 khóa, trùng an10.54). janapadapadesa → "vùng đất" (12 khóa; "xứ" 44 khóa thuộc janapada đơn, Thích Minh Châu "quốc độ" 9 khóa).
  - puggala → "người" (an: 393 khóa "người" so với 515 "cá nhân"); chọn "người" vì "hai loại cá nhân" không tự nhiên trong Việt; an10.54 dùng "cá nhân" cho cùng khuôn.
  - āvuso → "hiền giả" (an9: 89 khóa, "này các hiền giả" theo quy ước của quyển 9); veditabba → "cần được biết" (26 khóa so với "nên được hiểu" 20); paṭicca vutta → "nhân duyên" (tiền lệ đa số của tầng, xem trên); jīvitaparikkhāra… theo mn17: "vật dụng cần thiết cho đời sống", "thuốc men và vật dụng cho người bệnh", kasirena/appakasirena → "khó kiếm"/"dễ kiếm" (mn17); sāmaññattho → "mục đích đời sống sa-môn" (dn12); bhāvanāpāripūriṁ gacchati → "đi đến chỗ tu tập viên mãn" (Thích Minh Châu: "đi đến tu tập viên mãn"; dn34 dịch pāripūriyā là "viên mãn"); api panujjamānena → "ngay cả khi bị xua đuổi" (mn17:26.7).
  - Tiêu đề: Sevanāsutta → "Kinh Thân Cận" (0 tiền lệ cho tên bài này; Sujato: Association; Thích Minh Châu: "Cần Phải Thân Cận"); 0.2 "1. Phẩm Giác Ngộ" (7/7).
  - 0.1: "Aṅguttara Nikāya 9.6" theo hình thức phổ biến của chính quyển 9 trong tầng (48 bài "Aṅguttara Nikāya 9.N" so với 22 bài "Kinh Tăng Chi Bộ 9.N", đếm trên các bài an9.* đã có); xin người biên tập phán lại khi hợp nhất nếu muốn thống nhất toàn bộ an về "Kinh Tăng Chi Bộ".
  - Mở đầu 1.1: "Tatra kho āyasmā sāriputto bhikkhū āmantesi …pe… āyasmā sāriputto etadavoca:" → "Tại đó, Tôn giả Sāriputta gọi các vị tỳ-kheo … Tôn giả Sāriputta nói:"; "Tại đó … gọi các vị tỳ-kheo" là cách dịch của an6.15, an8.77 và mn28 cho cùng cụm Pāli. Đúng một dấu "…" thay cho "…pe…", không chép câu nào của Sujato vào chỗ lược.

  BẤT ĐỊNH (không thêm vào thân kinh):
  - 4.4 "saṅkhāpi anāpucchā": Pāli root và cả Sujato (without asking), Thích Minh Châu (không hỏi gì) đều đọc "không từ biệt". Nhưng bài song song mn17:24.9 (cùng tình huống: vật dụng dễ kiếm mà mục đích chưa viên mãn) lại có "saṅkhāpi so puggalo āpucchā pakkamitabbaṁ" nghĩa là sau khi cân nhắc thì từ biệt rồi mới rời. Có thể "anāpucchā" ở 4.4 là một dị bản hay một lỗi truyền; vì Pāli root đã ghim là tiêu chuẩn và Sujato, Thích Minh Châu cùng đọc như vậy nên tôi dịch "mà không từ biệt", chưa tự sửa theo mn17.
  - 3.7 "rattibhāgaṁ vā divasabhāgaṁ vā saṅkhāpi anāpucchā": Pāli root có "saṅkhāpi" (sau khi cân nhắc) ở đây, trong khi Sujato và Thích Minh Châu đều bỏ chi tiết này ở tình huống thứ nhất (ngay lập tức, không cân nhắc) và mn17:23.7 cũng không có. Có thể đây là chữ thừa do chép lặp từ 4.4. Tôi dịch đủ theo Pāli root "sau khi cân nhắc" và ghi ở đây; nếu đó là chữ thừa thì tình huống 3 và 4 chỉ còn khác nhau ở "dù là đêm hay ngày".
  - puggalena so puggalo ở 3.7–6.4: chủ thể "puggalena" là người đã nhận ra điều kiện tương ứng (động từ jaññā ở khóa dẫn), nên tôi viết "người đã biết như vậy" để phân biệt với "người kia" (so puggalo); đại từ "người này" trong dấu nháy là người kia.
  - janapadapadesa: "vùng đất" nghĩa là một vùng của xứ; Pāli gộp janapada + padesa; Thích Minh Châu "quốc độ", Sujato "country". Nghĩa chính xác của padesa trong compound chưa phân xử.
  - Hậu tố -pi ở 2.1–2.11: dịch bằng "cũng" để giữ giọng liệt kê sáu đối tượng của Pāli; an10.54 không dịch -pi ("Về y pháp, …") vì Pāli ở đó là -mpāhaṁ, không phải -pi.
  - 2.1 và 3.1: Sujato viết "two two kinds" (chữ lặp trong bản Anh), không có trong Pāli; bản Việt không lặp.

