  10.83*). `an10:0.2` = `9. Phẩm Các Vị Trưởng Lão` — đúng như `an10.81`, `an10.82`,
  `an10.83`, `an10.88` đã có (4/4 trong phẩm). `an10:15.3` `Catutthaṁ` → *Thứ tư*, theo
  `an4.158:3.9` (*Thứ tám*).

  **Đã sửa sau khi review đối kháng.** (1) `2.1` bản đầu tôi viết *Này bạn, một vị tỳ-kheo
  tuyên bố thắng trí* nhưng bỏ mất `Idhā` (*ở đây*); `mn112:2.1` cùng công thức dịch đầy đủ
  *Ở đây, này các tỳ-kheo…* — đã sửa thành *Ở đây, này bạn, một vị tỳ-kheo tuyên bố thắng trí:*.
  (2) `2.3`/`2.4` bản đầu tôi dịch `Tamenaṁ tathāgato vā …` là *Bậc ấy, hoặc Thế Tôn …*,
  lặp `Tamenaṁ` hai lần trong một câu (một lần làm chủ ngữ, một lần làm tân ngữ) và làm đổi
  chủ thể so với Pāli — đã sửa `2.3` thành *Thế Tôn, hoặc một vị đệ tử của Thế Tôn … sẽ hỏi
  dồn, ép hỏi và chất vấn bậc ấy*, và `2.4` thành *Khi bậc ấy bị hỏi dồn, ép hỏi và chất
  vấn như thế — dù là Thế Tôn, hay vị đệ tử của Thế Tôn … — thì bậc ấy rơi vào…*. Ở `3.1`/`4.1`
  thì `Tamenaṁ` **là** chủ ngữ, nên giữ nguyên *Bậc ấy, hoặc Thế Tôn, hoặc…*. (3) `14.1`
  bản đầu tôi dịch `oramattakena visesādhigamena` là *chút ít điều cao hơn*; `visesa` là *sự
  vượt trội / cao hơn*, nên đã sửa thành *chỉ đạt được chút ít sự vượt trội rồi dừng lại giữa
  chừng*.

