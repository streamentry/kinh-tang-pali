  **DÙNG LẠI NGUYÊN VĂN.** Mở đầu `1.1`–`1.4` trùng nguyên văn `sn40.1:1.2`–`1.5` (cùng công
  thức `Tatra kho āyasmā mahāmoggallāno bhikkhū āmantesi:` + `āvuso bhikkhave` +
  `paccassosuṁ` + `etadavoca`), nên tôi dùng lại nguyên văn bản đã có: *Tại đấy Tôn giả
  Mahāmoggallāna bảo các vị tỳ-kheo:* / *“Này các hiền giả tỳ-kheo!”* / *“Thưa vâng, hiền giả”,
  các vị tỳ-kheo ấy đáp lại Tôn giả Mahāmoggallāna.* / *Tôn giả Mahāmoggallāna nói điều này:*.
  Công thức tuyên bố thắng trí `khīṇā jāti, vusitaṁ brahmacariyaṁ, kataṁ karaṇīyaṁ,
  nāparaṁ itthattāyāti pajānāmī` dùng lại nguyên văn dạng phổ biến nhất trong tầng (đếm: cụm
  *Sinh đã tận, đời sống phạm hạnh đã hoàn thành, việc cần làm đã làm, không còn trở lại trạng
  thái hiện hữu này nữa* xuất hiện 22 lần nguyên văn cùng đuôi *biết rõ như vậy*), ở cả `2.2`
  và `3.3`. `samanuyuñjati samanuggāhati samanubhāsati` → *hỏi dồn, ép hỏi và chất vấn* (đã kiểm
  Pāli `an3.64:8.2`/`9.2` và bản Việt của nó: đúng ba động từ này được dịch vậy; cùng cách đó đã
  dùng ở `an3.36:2.1` và `an3.64:8.2`). `aññaṁ byākaroti` → *tuyên bố thắng trí*
  (`an5.93:1.3`–`1.7`, `mn112:2.1`, `sn48.45:1.4` — ba bài, cùng một cách).
  `cetasā ceto paricca pajānāti` → *hiểu rõ* (đối chiếu `an3.60:12.1` dịch là *bằng tâm hiểu rõ
  tâm của người khác*). `vuddhiṁ virūḷhiṁ vepullaṁ` → *tăng trưởng, tiến bộ và trưởng thành*
  (đếm toàn tầng: đúng cụm này 4 lần cho cùng Pāli `Aṅguttara`; cũng `sn14.17`).

  **Thuật ngữ, kèm số đếm.** `dhammavinaye` (đứng riêng) → *giới luật* (đếm toàn tầng: *Giáo
  pháp và giới luật* 14 lần, *giới luật* đứng riêng rất nhiều — không có cách nào cạnh tranh) ·
  `tathāgatappavedite` → *đã được Thế Tôn tuyên thuyết* · `parihānametaṁ` → *suy thoái*
  (đếm: *suy thoái* 13 lần cho nghĩa suy tàn, không phải *thoái đoạn* như `an4.158` dùng cho
  nghĩa khác của cùng từ — khác ngữ cảnh nên tôi theo nghĩa *suy thoái*) ·
  `āyasmā mahāmoggallāno` → *Tôn giả Mahāmoggallāna* (giữ PĀLI; đếm toàn tầng: hơn 30 tệp
  dùng đúng dạng này) · `āvuso` → *hiền giả* (theo `sn40.1`) · `sakadāgāmino` → *Nhất Lai*.

  **Chỗ không có tiền lệ, dịch từng từ một và ghi ở đây (xem blocker thứ ba).**
  (1) `2.4` chia năm danh từ cho `āpajjati`: `irīṇaṁ` → *sự tàn phá* (sa tàn) · `vicinaṁ` →
  *sự lạc lối* (mất đường) · `anayaṁ` → *tai nạn* · `byasanaṁ` → *tệ hại* · `anayabyasanaṁ` →
  *cả tai nạn lẫn tệ hại*. Bản Anh đã ghim nén năm từ thành hai vế, nên không có cách nào
  kiểm chéo từng từ; tôi giữ **đủ năm** vế trong tiếng Việt thay vì theo bản Anh.
  (2) `jhāyī samāpattikusalo paracittakusalo paracittapariyāyakusalo` → *tu thiền, thành thạo
  về các điều chứng đắc, thành thạo về việc đọc hiểu tâm người khác và về việc bao trùm tâm
  người khác*. Chuỗi bốn danh từ này lặp y hệt ở `2.3`, `2.4`, `3.1`, `4.1` nên tôi dùng
  **nguyên văn** y hệt cả bốn khoá — đây là trường hợp `skill/translation.md` yêu cầu: segment
  trùng nguyên văn thì dùng lại, không dịch lại từng chỗ.
  (3) Mười cặp danh từ của `5.1`–`13.1`: `kodha` → *giận dữ* (Sujato *irritable*) ·
  `upanāhī` → *ác ý* (*acrimonious*) · `makkhī` → *chê bai* (*disdain*) · `paḷāsī` →
  *khinh miệt* (*contemptuous*) · `issukī` → *ghen tị* (*jealous*) · `maccharī` → *đố kỵ*
  (*stingy*) · `sāṭha` → *lâu cá* (*devious*) · `māyāvī` → *lừa dối* (*deceitful*, cùng cách
  tôi dùng ở `ja400:9.4`) · `pāpiccha` → *ham muốn điều xấu*. Cả mười cặp cùng khuôn
  *"Vị ấy lại hay …, / vị ấy thường sống với tâm đầy tràn … . / Mà sự … đầy tràn thì có nghĩa
  là suy thoái…"* — đây là lặp **có chủ đích** của Pāli, tôi giữ nguyên và chỉ đổi danh từ.
  Đáng chú ý: `5.1` có `Kodhano kho` **không** có `pana`, mới chín đoạn sau có `kho pana`;
  tôi dịch đúng (chỉ `5.1` không có chữ *lại*).
  (4) `0.3` `Byākaraṇasutta` → *Kinh Tuyên Bố*: tôi đã grep toàn tầng và **không tìm thấy** bản
  nào dịch tiêu đề `Byākaraṇasutta`, nên đây là lựa chọn của riêng bài này, theo nghĩa của
  `byākaraṇa` (*tuyên bố / tuyên giảng*) và theo tiêu đề của Sujato (*Declaration*).

  **Ngoặc kép — cân tay, và khớp nguyên vị trí Pāli sau một lần sửa lúc review.** Pāli chỉ có
  `“` ở `2.1` và `”` ở `15.2` (hai khoá khác cũng chứa cặp riêng ở `1.2`/`1.3`), các lời trích
  trong `2.2`, `3.2`, `5.1`…`14.2` dùng `‘…’`, không tính vào vòng đếm. Bản đầu của tôi ở `3.3`
  đã tự thêm cặp `“…”` cho lời trích — Pāli `3.3` chỉ có dấu `’` đóng lời mở ở `3.2`; đã sửa
  thành nháy cong `’`, nên **không** thêm dấu kép nào ngoài ba vị trí của Pāli. Sau khi sửa, vị
  trí từng dấu khớp Pāli 100%.

  **Mệnh đề, đo lại (đo cục bộ cho riêng quyển 10, như yêu cầu).** `an10:0.1` — tôi đếm trên
  chính thư mục `content/translation/vi/project/sutta/an/`, lọc `an10.\d+`: **173** tệp có khoá
