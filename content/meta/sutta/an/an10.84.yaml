notes: |-
  **Vì sao `draft` (ba lý do, xem `blocking_errors`).** Điểm 9.02 vốn đã vượt ngưỡng 9.0, nhưng
  blocker thắng điểm, nên bài **không** được `review`/`published` cho tới khi ai đó sinh entry
  `an10.84` trong `content/meta/reference-gaps.yaml` (tôi không được sửa tệp đó) hoặc tầng Anh
  được vá. `triangulation` bị kéo xuống **7.2** — thấp hơn hẳn mức ~9 mà tầng Anh đầy đủ cho
  phép — vì đúng 14/30 segment có nội dung không có một chữ Anh nào.

  **Nguồn.** `an10.84` = `Byākaraṇasutta`, 47 khoá, đủ 47 khoá đã dịch. Pāli ghim
  `root/pli/ms/sutta/an/an10/an10.84_root-pli-ms.json`; bản Anh đã ghim cùng commit
  `11c9d708978cde8ba61096d8a75f7ddfb846f639`
  (`sutta/an/an10/an10.84_translation-en-sujato.json`, có **46** khoá nhưng **14** khoá trống).

  **Tầng Anh: 16/30 = 0.533.** Mười bốn khoá trống là `6.2`, `6.3`, `7.2`, `7.3`, `8.2`, `8.3`,
  `9.2`, `9.3`, `10.2`, `10.3`, `11.2`, `11.3`, `12.2`, `12.3` — tức đúng tám cặp công thức lặp
  `Xpariyuṭṭhitena cetasā bahulaṁ viharati` / `Xpariyuṭṭhānaṁ … parihānametaṁ` (sân hận, ác ý,
  chê bai, khinh miệt, ghen tị, đố kỵ, láu cá, lừa dối) mà bản Anh ghim **bỏ trọn**. Bản Việt
  hiện hành (`translation/vi/phantuananh/`) ở commit đã ghim chỉ có Pháp Cú.

  **DÙNG LẠI NGUYÊN VĂN.** Mở đầu `1.1`–`1.4` trùng nguyên văn `sn40.1:1.2`–`1.5` (cùng công
  thức `Tatra kho āyasmā mahāmoggallāno bhikkhū āmantesi:` + `āvuso bhikkhave` +
  `paccassosuṁ` + `etadavoca`), nên tôi dùng lại nguyên văn bản đã có: *Tại đấy Tôn giả
  Mahāmoggallāna bảo các vị tỳ-kheo:* / *“Này các hiền giả tỳ-kheo!”* / *“Thưa vâng, hiền giả”,
  các vị tỳ-kheo ấy đáp lại Tôn giả Mahāmoggallāna.* / *Tôn giả Mahāmoggallāna nói điều này:*.
  Công thức tuyên bố thắng trí `khīṇā jāti, vusitaṁ brahmacariyaṁ, kataṁ karaṇīyaṁ,
  nāparaṁ itthattāyāti pajānāmī` dùng lại nguyên văn dạng phổ biến nhất trong tầng (đếm: cụm
  *Sinh đã tận, đời sống phạm hạnh đã hoàn thành, việc cần làm đã làm, không còn trở lại trạng
  thái hiện hữu này nữa* xuất hiện 22 lần nguyên văn cùng đuôi *biết rõ như vậy*), ở cả `2.2`
  và `3.3`. `samanuyuñjati samanuggāhati samanubhāsati` → *hỏi dồn, ép hỏi và chất vấn* (đã kiểm
  Pāli `an3.64:8.2`/`9.2` và bản Việt của nó: đúng ba động từ này được dịch vậy; cùng cách đó đã
  dùng ở `an3.36:2.1` và `an3.64:8.2`). `aññaṁ byākaroti` → *tuyên bố thắng trí*
  (`an5.93:1.3`–`1.7`, `mn112:2.1`, `sn48.45:1.4` — ba bài, cùng một cách).
  `cetasā ceto paricca pajānāti` → *hiểu rõ* (đối chiếu `an3.60:12.1` dịch là *bằng tâm hiểu rõ
  tâm của người khác*). `vuddhiṁ virūḷhiṁ vepullaṁ` → *tăng trưởng, tiến bộ và trưởng thành*
  (đếm toàn tầng: đúng cụm này 4 lần cho cùng Pāli `Aṅguttara`; cũng `sn14.17`).

  **Thuật ngữ, kèm số đếm.** `dhammavinaye` (đứng riêng) → *giới luật* (đếm toàn tầng: *Giáo
  pháp và giới luật* 14 lần, *giới luật* đứng riêng rất nhiều — không có cách nào cạnh tranh) ·
  `tathāgatappavedite` → *đã được Thế Tôn tuyên thuyết* · `parihānametaṁ` → *suy thoái*
  (đếm: *suy thoái* 13 lần cho nghĩa suy tàn, không phải *thoái đoạn* như `an4.158` dùng cho
  nghĩa khác của cùng từ — khác ngữ cảnh nên tôi theo nghĩa *suy thoái*) ·
  `āyasmā mahāmoggallāno` → *Tôn giả Mahāmoggallāna* (giữ PĀLI; đếm toàn tầng: hơn 30 tệp
  dùng đúng dạng này) · `āvuso` → *hiền giả* (theo `sn40.1`) · `sakadāgāmino` → *Nhất Lai*.

  **Chỗ không có tiền lệ, dịch từng từ một và ghi ở đây (xem blocker thứ ba).**
  (1) `2.4` chia năm danh từ cho `āpajjati`: `irīṇaṁ` → *sự tàn phá* (sa tàn) · `vicinaṁ` →
  *sự lạc lối* (mất đường) · `anayaṁ` → *tai nạn* · `byasanaṁ` → *tệ hại* · `anayabyasanaṁ` →
  *cả tai nạn lẫn tệ hại*. Bản Anh đã ghim nén năm từ thành hai vế, nên không có cách nào
  kiểm chéo từng từ; tôi giữ **đủ năm** vế trong tiếng Việt thay vì theo bản Anh.
  (2) `jhāyī samāpattikusalo paracittakusalo paracittapariyāyakusalo` → *tu thiền, thành thạo
  về các điều chứng đắc, thành thạo về việc đọc hiểu tâm người khác và về việc bao trùm tâm
  người khác*. Chuỗi bốn danh từ này lặp y hệt ở `2.3`, `2.4`, `3.1`, `4.1` nên tôi dùng
  **nguyên văn** y hệt cả bốn khoá — đây là trường hợp `skill/translation.md` yêu cầu: segment
  trùng nguyên văn thì dùng lại, không dịch lại từng chỗ.
  (3) Mười cặp danh từ của `5.1`–`13.1`: `kodha` → *giận dữ* (Sujato *irritable*) ·
  `upanāhī` → *ác ý* (*acrimonious*) · `makkhī` → *chê bai* (*disdain*) · `paḷāsī` →
  *khinh miệt* (*contemptuous*) · `issukī` → *ghen tị* (*jealous*) · `maccharī` → *đố kỵ*
  (*stingy*) · `sāṭha` → *lâu cá* (*devious*) · `māyāvī` → *lừa dối* (*deceitful*, cùng cách
  tôi dùng ở `ja400:9.4`) · `pāpiccha` → *ham muốn điều xấu*. Cả mười cặp cùng khuôn
  *"Vị ấy lại hay …, / vị ấy thường sống với tâm đầy tràn … . / Mà sự … đầy tràn thì có nghĩa
  là suy thoái…"* — đây là lặp **có chủ đích** của Pāli, tôi giữ nguyên và chỉ đổi danh từ.
  Đáng chú ý: `5.1` có `Kodhano kho` **không** có `pana`, mới chín đoạn sau có `kho pana`;
  tôi dịch đúng (chỉ `5.1` không có chữ *lại*).
  (4) `0.3` `Byākaraṇasutta` → *Kinh Tuyên Bố*: tôi đã grep toàn tầng và **không tìm thấy** bản
  nào dịch tiêu đề `Byākaraṇasutta`, nên đây là lựa chọn của riêng bài này, theo nghĩa của
  `byākaraṇa` (*tuyên bố / tuyên giảng*) và theo tiêu đề của Sujato (*Declaration*).

  **Ngoặc kép — cân tay, và khớp nguyên vị trí Pāli sau một lần sửa lúc review.** Pāli chỉ có
  `“` ở `2.1` và `”` ở `15.2` (hai khoá khác cũng chứa cặp riêng ở `1.2`/`1.3`), các lời trích
  trong `2.2`, `3.2`, `5.1`…`14.2` dùng `‘…’`, không tính vào vòng đếm. Bản đầu của tôi ở `3.3`
  đã tự thêm cặp `“…”` cho lời trích — Pāli `3.3` chỉ có dấu `’` đóng lời mở ở `3.2`; đã sửa
  thành nháy cong `’`, nên **không** thêm dấu kép nào ngoài ba vị trí của Pāli. Sau khi sửa, vị
  trí từng dấu khớp Pāli 100%.

  **Mệnh đề, đo lại (đo cục bộ cho riêng quyển 10, như yêu cầu).** `an10:0.1` — tôi đếm trên
  chính thư mục `content/translation/vi/project/sutta/an/`, lọc `an10.\d+`: **173** tệp có khoá
  `0.1`, trong đó **154** dùng *Kinh Tăng Chi Bộ* (**138** dạng thường như *Kinh Tăng Chi Bộ 10.84*, **16** dạng dải cho uid-gộp kiểu
  *Kinh Tăng Chi Bộ 10..104*) và **19** giữ PĀLI *Aṅguttara Nikāya*. Tôi đo lại **sau khi** đã ghi `an10.84`, nên hai con số này đã
  bao gồm chính bài này; trước đó là 153/19 trên 172 tệp. Đối chiếu: các quyển
  6, 8, 9 hợp lại có **180** giữ PĀLI *Aṅguttara Nikāya* và chỉ **38** dùng *Kinh Tăng Chi
  Bộ* — **ngược hẳn** `an10`, đúng như đợt trước đã đo. Vậy tôi dùng *Kinh Tăng Chi Bộ 10.84*,
  và đây cũng là lựa chọn của người dịch ngay cạnh bên (`an10.83:0.1` = *Kinh Tăng Chi Bộ
  10.83*). `an10:0.2` = `9. Phẩm Các Vị Trưởng Lão` — đúng như `an10.81`, `an10.82`,
  `an10.83`, `an10.88` đã có (4/4 trong phẩm). `an10:15.3` `Catutthaṁ` → *Thứ tư*, theo
  `an4.158:3.9` (*Thứ tám*).

  **Đã sửa sau khi review đối kháng.** (1) `2.1` bản đầu tôi viết *Này bạn, một vị tỳ-kheo
  tuyên bố thắng trí* nhưng bỏ mất `Idhā` (*ở đây*); `mn112:2.1` cùng công thức dịch đầy đủ
  *Ở đây, này các tỳ-kheo…* — đã sửa thành *Ở đây, này bạn, một vị tỳ-kheo tuyên bố thắng trí:*.
  (2) `2.3`/`2.4` bản đầu tôi dịch `Tamenaṁ tathāgato vā …` là *Bậc ấy, hoặc Thế Tôn …*,
  lặp `Tamenaṁ` hai lần trong một câu (một lần làm chủ ngữ, một lần làm tân ngữ) và làm đổi
  chủ thể so với Pāli — đã sửa `2.3` thành *Thế Tôn, hoặc một vị đệ tử của Thế Tôn … sẽ hỏi
  dồn, ép hỏi và chất vấn bậc ấy*, và `2.4` thành *Khi bậc ấy bị hỏi dồn, ép hỏi và chất
  vấn như thế — dù là Thế Tôn, hay vị đệ tử của Thế Tôn … — thì bậc ấy rơi vào…*. Ở `3.1`/`4.1`
  thì `Tamenaṁ` **là** chủ ngữ, nên giữ nguyên *Bậc ấy, hoặc Thế Tôn, hoặc…*. (3) `14.1`
  bản đầu tôi dịch `oramattakena visesādhigamena` là *chút ít điều cao hơn*; `visesa` là *sự
  vượt trội / cao hơn*, nên đã sửa thành *chỉ đạt được chút ít sự vượt trội rồi dừng lại giữa
  chừng*.

  **technical_integrity = 9.6.** `npm run validate|test|check|build` bị cấm trong lát này. Tôi tự
  kiểm bằng bộ kiểm cục bộ: đủ 47/47 khoá trong `all`, không khoá thừa, không khoá nào trùng nguyên
  văn Pāli, mọi giá trị NFC, không có khoá nào chứa `…pe…` (bài không có dấu lược), không có
  `(…)` đứng một mình, ngoặc kép cân trên cả bài theo thứ tự số, không Pāli lọt, thứ tự khoá
  đúng thứ tự số.

  **Giải quyết draft 2026-10-12.** Mục này THAY THẾ các đoạn cũ ở trên nói về ba blocker, về cách dịch
  `Kinh Tuyên Bố`, `Thế Tôn`/`bậc ấy`, `đầy tràn`, `này bạn`, `giới luật` và các thuật ngữ mười cặp
  danh từ (`ác ý`, `chê bai`, `đố kỵ`, `láu cá`); phần còn lại của notes (nguồn, ngoặc kép, `0.1`/`0.2`,
  `15.3`) vẫn đúng. Đọc đối kháng lại toàn bài từ Pāli; **40/47 khoá đổi**, trong đó khoảng 31 khoá là
  lệch nghĩa hoặc thuật ngữ thật, 9 khoá là hiệu chỉnh theo tiền lệ hoặc dấu câu, 7 khoá giữ nguyên
  (`0.1`, `0.2`, `1.1`–`1.4`, `15.3`).

  *Lỗi nghĩa thật đã sửa.* (1) `15.1`: bản cũ *"không thể nào một vị tỳ-kheo bỏ mười pháp này mà lại đạt
  được…"* làm mất phủ định của `appahāya` (*không từ bỏ*) và biến mệnh đề thành vô nghĩa/ngược nghĩa;
  nay *"không từ bỏ … mà sẽ đạt được … — điều ấy không thể xảy ra"*, và `15.2` đối xứng *"từ bỏ … rồi sẽ đạt
  được … — điều ấy có thể xảy ra"*. Cấu trúc `So vatāvuso, bhikkhu ‘…’ti netaṁ ṭhānaṁ vijjati` khớp `an10.82:10.1`,
  `an10.85:31.1`, `mn99:13.2`, và dấu nháy đơn ‘…’ của Pāli được khôi phục (trước đó thiếu). (2) `2.3`–`4.1`:
  `Tamenaṁ` là **tân ngữ** (vị tuyên bố), không phải chủ ngữ; bản cũ gọi cả vị tuyên bố lẫn Thế Tôn là *bậc
  ấy* (hai chủ thể một tên) và còn lẫn chủ ngữ/tân ngữ ở `3.1`/`4.1`; đồng thời `cetasā ceto paricca` bị bỏ
  mất (*bằng tâm bao quát tâm*). Nay `2.3`: *Như Lai, hoặc … hỏi dồn, ép hỏi và chất vấn vị ấy*; `2.4`: *Khi
  bị … bởi Như Lai, hoặc … , vị ấy rơi vào…*; `3.1`/`4.1`: *dùng tâm mình bao quát tâm vị ấy …*. (3) `5.2`–`13.3`:
  `pariyuṭṭhita`/`pariyuṭṭhāna` bản cũ dịch *đầy tràn* — không có tiền lệ nào trong tầng; cách dịch có tiền lệ là
  *bị … chi phối* (`mn64:5.2`, `5.5`, `5.8`, `5.11`, `5.14`; `mn4:10.2` cùng chữ *chi phối*; `mn48:8.3` *xâm chiếm*),
  nay *"tâm bị X chi phối"* / *"việc bị X chi phối"* ở cả 9 cặp (18 khoá). (4) Thuật ngữ sai nghĩa: `maccharī`
  *đố kỵ* → *keo kiệt* (đếm tầng: `macchar-` 423 khoá, *keo kiệt* 256+ trội; *đố kỵ* đứng riêng chỉ 1) —
  bản cũ chồng *đố kỵ* lên `issukī` ở khoá kề; `upanāhī` *ác ý* → *oán hận* (tầng: `dn25:12.3`, `sn16.7:4.7`, 32
  khoá *oán hận* + 30 *hiềm hận*, *ác ý* chỉ 3); `makkhī` *chê bai* → *gièm pha* (`mn8:12.27`, `an10.87:6.1`,
  `an6.36:2.1`; tầng 90 *gièm pha* so với 26 *chê bai*); `sāṭheyya` *láu cá* → *xảo trá* (tầng 80 *xảo trá* so với 3
  *láu cá*; `dn25:12.8`, `dn33:2.2.59`, `mn7:4.18`); `issukī` *ghen tị* → *ganh tị* (109 so với 20; `mn8:12.29`,
  `mn15:3.38`); `pāpiccho` *ham muốn điều xấu* → *có ác dục* (14 so với 8; cùng phẩm `an10.87:4.1`, `an6.36:2.4`).
  (5) `14.1`: *"sự vượt trội"* (bản đã sửa một lần trước) → *"chút thù thắng nhỏ nhoi đã đạt được"*, theo đúng tiền
  lệ cùng cụm `oramattakena visesādhigamena` (`dn16:1.7.10`, `iti89:2.5`); nay hợp *"khi còn việc cần làm cao
  hơn"* (`uttari karaṇīye`). (6) Câu hỏi/dấu câu: `2.2` Pāli kết `ti.` (câu khẳng định) nhưng bản cũ ghi *"… vậy?"*,
  `3.3` kết bằng `à?` lạ; nay `2.2` kết `’.` và `3.3` kết `’?` như Pāli. (7) `2.1`/`15.1`/`15.2`: `āvuso` nói với cả nhóm
  tỳ-kheo → *này các hiền giả* (đếm `^Idhāvuso`: 113 *này các hiền giả* + 52 *này hiền giả* + 11 *hiền giả* so với
  chỉ 4 *này bạn*, toàn trong `an10.84–86`) — cũng khớp `1.2` đã có *hiền giả*. (8) `0.3` `Byākaraṇasutta` → *Kinh Tuyên
  Bố Thắng Trí*: cùng chữ Pāli đã dịch đúng như vậy ở `an5.93:0.3`, và nội dung bài (tuyên bố thắng trí) cũng là
  `aññaṁ byākaroti`; `translationTitle` đổi theo. Notes cũ ở mục (4) trên nói *"không tìm thấy bản nào dịch tiêu đề"*
  là sai: tìm sót `an5.93:0.3`. (9) `Thế Tôn` → `Như Lai` cho `tathāgato` / `tathāgatasāvako` / `tathāgatappavedite`: tầng
  đếm `tathāgatappavedite` 56 *Như Lai* so với 21 *Thế Tôn*; `tathāgatasāvak-` 40 *đệ tử của Như Lai* so với 11. `dhammavinaye`
  trong `tathāgatappavedite dhammavinaye` → *Pháp và Luật* (55 so với 20 *giới luật* đứng riêng), cũng là cách `an10.82`
