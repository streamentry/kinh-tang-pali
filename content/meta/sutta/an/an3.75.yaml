notes: |-
  Sửa lan 2026-10-13: khoá `an3.75:2.8` (`dakkhiṇeyyo` trong công thức `āhuneyyo pāhuneyyo dakkhiṇeyyo añjalikaraṇīyo`): *đáng nhận vật bố thí đài các* → *đáng được bố thí*. Căn cứ: *đài các* không có trong Pāli; công thức này có 27 khoá toàn tầng, chỉ 2/27 khoá dùng *đài các* (`an3.70:10.4` và `an3.75:2.8`), 25 khoá còn lại dùng *đáng được bố thí* / *hiến tặng* / *hiến dâng*. Mô tả lỗi ghi "như an3.40" (`vitakka` bị dịch *tưởng*) đã đối chiếu: an3.75 không có `vitakka` nên không có gì để đổi; `anukampeyyātha … sotabbaṁ maññeyyuṁ` → *thương tưởng … đáng nghe* trùng cách dịch ở 10/10 khoá toàn tầng nên giữ. Chưa đổi (ngoài mô tả, để người biên tập quyết): `aveccappasāda` → *tín xác quyết* (tầng có nhiều cách: *tín bất động* nhiều nhất) và *Bậc Đáng Kính* cho `bhagavā` ở `2.4` (4 khoá toàn tầng so với đa số *Thế Tôn*).
