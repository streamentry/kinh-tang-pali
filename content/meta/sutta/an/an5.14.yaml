notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 4.2 — «có niệm; đầy đủ chánh niệm bậc nhất, tinh tán, nhớ nghĩ và nhớ lại …» → «có niệm, đầy đủ niệm và tỉnh giác tối thượng, nhớ nghĩ và nhớ lại …» (`paramena satinepakkena samannāgato`; sn48.9:3.2, sn48.10:3.2, sn48.50 và an7.67 dịch `satinepakka` là «niệm … tỉnh giác tối thượng»; «tinh tán» không có căn cứ trong `nepakka`, vốn là sáng suốt, tỉnh giác); giữ «vị đệ tử Thánh» theo cả bài an5.14 (bản đa số ghi «Thánh đệ tử») và giữ vế «nhớ nghĩ và nhớ lại» vì bản đa số bỏ mất `anussaritā`. Ngoài phạm vi: an7.4:6.2 mang đúng câu cũ «tinh tán».
