notes:
  - >-
    **Hai mươi bốn lỗi chấm câu của Pāli: mở dấu `“` rồi không đóng.** Đếm được
    14 bài: `an5.242`, `an5.243`, `an5.246`, `an5.247`, `an7.86`, `an9.48`,
    `an9.50`, `an9.53`, `an5.55`… nói rõ là `an9.55`, `an9.56`, `an9.57`,
    `an9.58`, `an9.59`, `an9.60`. Ở mỗi bài, `1.1` mở `“` và không segment nào
    đóng lại (độ sâu kép cuối = 1). Tôi đóng ngay sau mệnh đề cuối của `1.1` để
    người đọc không gặp dấu ngoặc treo, và **đây là cố ý lệch 14 segment** — bộ
    kiểm tra báo đúng mười bốy chỗ ấy, không phải sót sót. Pāli không bị sửa.
  - >-
    **Catalog gộp mười sáu bài vào một uid dải**, nên khoá dịch phải mang UID
    **thật** của từng bài (`an1.378:1.1`…`an1.393:1.2`) chứ không phải
    `an1.378-393:*` — giống cách `dhp1-20` đã làm. `“` mở ở `an1.378:1.1` và
    đóng ở `an1.393:1.1`, y như Pāli.
  - >-
    `lābha` → *phần thưởng* và `pasāda` → *trong sạch* (cả hai 0 tiền lệ, đặt
    mới; `an3.74:1.7` chỉ có `visuddhiyā` → *thanh tịnh*). Mười sáu danh từ đều
    0 tiền lệ, đặt mới: `āraññikatta` → *sống trong rừng*, `piṇḍapātikatta` →
    *sống nhận từ gia tài*, `paṁsukūlikatta` → *sống giữa đống rác rưởi*,
    `tecīvarikatta` → *sống trong rừng sâu ba tầng*, `dhammakathikatta` → *sống
    để thuyết pháp*, `vinayadharatta` → *sống giữ học luật*, `bāhusacca` → *sống
    đa văn* (`an10.17:2.1`), `thāvareyya` → *sống thích đi lang thang*,
    `ākappasampadā` → *sự thành tựu về y phục*, `parivārasampadā` → *sự thành
    tựu về bát*, `mahāparivāratā` → *sự sống an nhàn*, `kolaputti` → *sống ăn
    cám*, `vaṇṇapokkharatā` → *vẻ mặt tươi như hoa*, `kalyāṇavākkaraṇatā` → *sự
    nói năng lành*, `appicchatā` → *sự ít bị quyến rũ*, `appābādhatā` → *sự
    không mỏi mệt*.
  - >-
    **`an1.378:1.1` nói *phần thưởng thứ nhất*** — tức tám phần thưởng đầu (`…`
    đến `an1.385`), rồi tám điều kiện (`…` đến `an1.393`); tổng cộng mười sáu,
    khớp với `(Soḷasa…)` ở `an1.393:1.2`.
  - >-
