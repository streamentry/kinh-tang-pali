notes: |-
  Giải quyết draft 2026-10-12 (thay thế lượt chấm 2026-09-13). Đủ 108/108 khoá, tập khoá và thứ tự khoá đúng Pāli, không khoá ngoài tập Pāli; đã đọc đối kháng toàn bài với Pāli root và bản Anh Sujato.

  **Blocker cũ (loại D, đã gỡ).** Blocker "cắt ngắm" ở `an3.65:48.3` do bản trước kết `48.3` bằng dấu lược thay cho sáu khoá `48.4`–`52.2` (Pāli lặp lại đủ bốn điều an ổn). Bản hiện tại không còn dấu lược ở `48.3` (Pāli `48.3` cũng không có), và sáu khoá `48.4`, `49.1`, `50.1`, `51.1`, `52.1`, `52.2` đã được dịch đủ, trùng nguyên văn với `43.3`, `44.1`, `45.1`–`45.2`, `46.1`, `47.1`, `47.2`. Dấu lược `…` còn lại khớp Pāli từng khoá: `1.6`, `31.2`, `31.3`, `42.2`, `42.3`, `53.1` (cả sáu đều là `…pe…` trong Pāli, mỗi khoá đúng một dấu `…`).

  **Sửa sau khi đọc đối kháng (35 khoá đổi; không khoá nào sai nghĩa nặng, phần lớn là accuracy và clarity fix).**
  - Accuracy fix. `1.5`: bản cũ "Danh tiếng tốt lành ấy đã lan xa về bậc Đáng Kính Gotama ấy" đổi theo tiền lệ của cùng Pāli (`Taṁ kho pana bhavantaṁ gotamaṁ evaṁ kalyāṇo kittisaddo abbhuggato`, 28 khoá trong tầng, 20 khoá dùng "Tôn giả Gotama … như sau"). `1.6`: `itipi so bhagavā` bị dịch "Bậc Đáng Kính ấy" và nới ra thành "A-la-hán, Chánh Đẳng Giác, minh hạnh túc đủ" trong khi Pāli chỉ có `itipi so bhagavā …pe…`; nay là "‘Đây là Thế Tôn …" (26 trên 74 khoá có `itipi so bhagavā …pe…` đã dùng đúng cách này; `bhagavā` là "Thế Tôn", không phải "Đáng Kính"). `3.8`: `kaṅkhanīyeva … ṭhāne vicikicchā` bản cũ đảo hai thuật ngữ so với `3.7` (`kaṅkhituṁ` là "hoài nghi", `vicikicchituṁ` là "bất định"); nay "Ở ngay chỗ đáng hoài nghi, bất định đã sanh khởi nơi các ông". `3.5`: `Tesaṁ … hoteva kaṅkhā hoti vicikicchā` — bỏ "Do đó" (không có trong Pāli), thêm ý `hoteva` (quả có). `3.2`, `3.4`: `dīpenti jotenti` "trình bày và rực sáng giáo thuyết" (`jotenti` được dịch như nội động từ, không có tân ngữ) đổi thành "trình bày và làm sáng tỏ giáo thuyết". `1.4`: `bho` được dịch "Thưa quý vị"; `sakyaputto` "con người dòng Sakya" đổi "người con dòng Sakya" (cùng lối với các khoá trong an và mn đã dịch). `samattā` (`samattā samādinnā`) bản cũ bỏ sót hẳn: nay "khi được thọ trì trọn vẹn" ở `4.3`, `23.1`, `24.1`, `25.5`, `26.3`, `39.1`, `40.1`, `41.5` (8 khoá; `samatta` là "trọn đủ", `samādinna` là "được thọ trì"). `etha tumhe` bản cũ bỏ hẳn: nay "Nào, này các người Kālāma," ở `4.1`, `25.2`, `26.1`, `41.2` (bản Anh: "Please"). `42.1`: bổ sung `evaṁ` ("như vậy"; theo `sn42.13:23.1`–`26.1`) và sửa `averena abyāpajjhena` từ "không thù hận, không sân hận" thành "không thù hận, không ác ý", cho khớp `42.4` và hai khoá trong an có cùng cụm (2/2 "không ác ý"; không khoá nào dùng "không sân hận"). `45.1`, `45.2`, `50.1`: "thì vì ta không suy nghĩ làm ác cho ai, vì ta không làm nghiệp ác" tách đúng hai mệnh đề của Pāli (`na kho panāhaṁ kassaci pāpaṁ cetemi` — không có ý định làm điều ác đối với bất kỳ ai; `akarontaṁ … maṁ pāpakammaṁ kuto dukkhaṁ phusissati` — khi ta không làm nghiệp ác, khổ từ đâu chạm đến ta); bỏ chữ "vì" suy diễn nhân quả. `46.1`, `51.1`: bỏ "vẫn" (không có trong Pāli; `ubhayeneva` là "cả hai phía" mà thôi).
  - Dấu lược. `31.2`, `31.3`: bản cũ chép thêm "là vì lợi ích hay vì bất lợi của người ấy?" trước dấu `…` — phần Pāli không có (Pāli chỉ có `uppajjati …pe…`); nay kết đúng chỗ Pāli kết. `31.4` giữ phần cuối câu hỏi "là lợi ích và hạnh phúc, phải không?”".
  - Clarity fix. `2.1`: "chào hỏi Đức Phật rồi sau khi thăm hỏi những lời thân tình đáng nhớ ngồi một bên" sửa thành "chào hỏi Đức Phật, sau khi trao đổi những lời thân tình đáng nhớ thì ngồi một bên" (`vītisāretvā` là "trao đổi"). `7.1`, `11.1`, `15.1`, `29.1`: thêm vocative `kālāmā` bị bỏ sót và đổi "kẻ" thành "người" (`purisapuggalo` là "người"; giọng khinh miệt "kẻ" không có trong Pāli); giữ "phải không?" ở cuối vì bản Anh Sujato cũng dịch là câu hỏi ("Is that for their lasting harm and suffering?"), và Pāli đáp "Evaṁ, bhante".
  - Dấu nháy. `41.3`: sửa dấu nháy thẳng `'` đóng thừa (Pāli `41.3` không có dấu đóng; dấu đóng thật nằm ở `41.5`). `5.1`: bỏ dấu mở “ thừa (lời Đức Phật mở ở `3.7` đã đóng ở `5.2`, nên khoá `5.1` không mang dấu nháy như Pāli). `27.1` giữ dấu mở “ vì Pāli `27.2` có dấu đóng ” mà không có dấu mở nào ở khoá trước (thiếu sót của chính ngữ liệu Pāli ở `25.1`); đây là chỗ duy nhất dấu nháy kép của Việt lệch khoá Pāli.
  - Không đổi (đã đo, không phải lỗi). `25.6`, `41.6` "Lời đã nói, được nói nhờ nhân duyên này" cho `iti yaṁ taṁ vuttaṁ, idametaṁ paṭicca vuttaṁ` (5 khoá cùng câu chữ; dạng đa số của tầng cho cụm này là "điều đã được nói; chính do nhân duyên này, điều ấy được nói", 53 khoá — cùng nghĩa). "Nhưng khi tự mình các người Kālāma biết rõ" cho `Yadā tumhe, kālāmā, attanāva jāneyyātha` (6 khoá cùng dạng "Nhưng khi tự … biết"). `assāsā` "sự an ổn" (bản Anh dùng "consolations"; không có tiền lệ khác trong tầng cho cụm `cattāro assāsā`).

  **Số Pāli, đã tự tính.** `ekaṁ disaṁ, dutiyaṁ, tatiyaṁ, catutthaṁ` = 4 phương (42.1, 42.4); `cattāro assāsā` = 4, khớp bốn mục `43.3`, `44.1`, `45.1`–`45.2`, `46.1` (thứ nhất, thứ hai, thứ ba, thứ tư); `appekacce` ở `2.1` = 5 nhóm (đảnh lễ · chào hỏi · chắp tay · xưng tên họ · im lặng), Việt có đủ 5; chuỗi `mā …` ở `4.1`, `25.3`, `26.1`, `41.3` = 10 mục, Việt có 10 "chớ vì" ở `4.1` và 10 ở `26.1`; `lobha`, `dosa`, `moha` = 3 và `alobha`, `adosa`, `amoha` = 3. Không có số lớn, không có `Tiṁsakappasahassa`.

  **Phép đối chiếu trong bài.** 45 cặp Pāli trùng nguyên văn (sau khi bỏ dấu câu và chữ hoa) nằm ngay trong bài này, trong đó 7 cặp Việt khác nhau, cả 7 đều chỉ khác dấu câu hoặc dấu nháy theo đúng Pāli (`41.4` Pāli kết bằng gạch ngang, không phải dấu hai chấm; `5.1` so với `9.1`, `13.1`, `27.1`, `31.1` về dấu mở nháy). Mọi chữ khác đều giống hệt.

  **Thuật ngữ, có số đếm.** `averena abyāpajjhena` → "không thù hận, không ác ý" (2/2 khoá có cụm này trong tầng an/mn/dn/sn, ngoài bài này). `samattā` → "trọn vẹn" (8 khoá, nay nhất quán). `kaṅkhā` → "hoài nghi", `vicikicchā` → "bất định": nhất quán ở `3.5`, `3.7`, `3.8`. `abyāpajjhacitto` → "có tâm không sân" (`43.1`, `47.1`, `48.2`, `52.1` đều giống nhau).

  **Bất định còn lại, ghi ở đây chứ không thêm vào thân kinh.** (1) `karoto karīyati pāpaṁ` (`45.1`, `46.1`, `50.1`, `51.1`): dịch "kẻ làm ác phải chịu ác" (ác quả đến với người làm ác), cùng cách hiểu với bản Anh ("bad things happen to people who do bad things"); `karīyati` thực ra là thể bị động "ác được làm", nghĩa quả báo là lối đọc phổ biến chứ không bị buộc bởi chữ Pāli. (2) `garu` ở `4.1` (`mā samaṇo no garu`): dịch "bậc Đạo Sư của chúng ta" theo tầng (8/8 khoá cùng câu), trong khi `garu` còn nghĩa "bậc đáng tôn kính". (3) `bhabbarūpatāya` "khả năng bề ngoài" và `ākāraparivitakkena` "suy tư biểu kiến": giữ theo tầng, nghĩa chưa tuyệt đối phân xử được.

  **Coverage English.** Sujato có bản cho an3.65: Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) 63 khoá, Sujato trống 6 khoá (`48.4`, `49.1`, `50.1`, `51.1`, `52.1`, `52.2`), phủ 57/63 = 0,905, trên ngưỡng 0,80 nên không có blocker độ phủ. Sáu khoá trống đều là phần lặp của `43.3`–`47.2`, vốn có Sujato, nên Pāli vẫn tự đứng vững. Tầng `vietnamese-current` không có cho an (chỉ có Pháp Cú); không có tầng `english-project` cho bài này. Triangulation 9,0 vì chỉ có một bản Anh độc lập và không có tham khảo Việt truyền thống.

  **Kiểm kỹ thuật.** Chưa chạy `npm run validate`, `npm test`, `npm run check` và `npm run build` trong lượt chấm này, nên `technical_integrity` đặt 9,6 thay vì 10; JSON hợp lệ, 108/108 khoá đúng tập và thứ tự Pāli, không giá trị rỗng, dấu lược cân bằng từng khoá, meta đủ 10 tiêu chí và `final_score` khớp trung bình thô (9,43).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an3.65:25.6, 41.6 — «Lời đã nói, được nói nhờ nhân duyên này» → «Đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói». Vì iti yaṁ taṁ vuttaṁ là «điều đã được nói ấy», và idam etaṁ paṭicca vuttaṁ nhấn vào «chính vì điều này mà nói»; bản cũ bỏ iti và đổi «điều» thành «lời». Đây là cách chiếm đa số của cùng công thức (54/80 khoá Pāli trùng, gồm an10.27, an4.192, an6.63); viết hoa «Đó» vì khoá liền trước đã khép câu.
