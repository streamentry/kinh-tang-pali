notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá :2.3 :5.2 (cùng Pāli với :1.3) — “Từ lúc đó, nhà vua không tắm …” → “Từ lúc hoàng hậu Bhaddā thân yêu và được yêu mến qua đời, nhà vua …” (Pāli lặp đủ `bhaddāya deviyā kālaṅkatāya piyāya manāpāya`; bản “Từ lúc đó” bỏ vế ấy, nên cả ba khoá của bài nay đồng nhất theo :1.3). Giữ nguyên :6.6 (“Bạch đại vương, các cỗ xe thượng hạng”) vì cùng xưng hô và cùng chữ “thượng hạng” với :6.4 :6.5 của bài, còn “Thưa Đại vương … thù thắng” là lời thoại của bài khác (mn89).
