notes: |-
  Lượt chấm trước (2026-09-13): final_score 9.51, không blocker.
  Lượt cải thiện 2026-10-13: đọc đối kháng 21 khoá và đối chiếu Pāli, bản Anh đã ghim (Sujato) và bài song song an4.211 (cùng khuôn "Vị tỳ-kheo, này các tỳ-kheo," / "làm rực rỡ"). Có sửa nghĩa thật ở an4.7:3.6 (trước đây dịch "chúng ấy là đoàn hoa trang điểm cho chúng Tăng", sai: ete hi saṅghasobhanā là "chính họ là những bậc làm rực rỡ chúng Tăng", cùng gốc với 2.4 và 3.5). Các khoá còn lại được đưa về đa số của kho: viyatta = "khéo léo" (19/42 trong tầng; an3.9, an3.150, an4.3, an4.4 cùng khuôn), vinīta = "huấn luyện" (6 so với "điều phục" 4), bahussuta = "đa văn" (189/270, so với "đa học" 15), dhammadhara = "nắm giữ Pháp" (17 khoá, sát với "giữ gìn Pháp" 13, cả hai đều chấp nhận được; chọn theo an8.70 và tha-ap8), dhammānudhammappaṭipanna = "thực hành pháp và tùy pháp" (48 khoá cùng dạng "pháp và tùy pháp"; cách "phù hợp với pháp" chỉ có 1 khoá và bỏ mất "tùy pháp"), anudhammacārī = "sống thuận theo pháp" (thuận theo pháp 11), sīlasampanno = "thành tựu giới" (an4.37 cùng bậc), tādiso = "người như thế" (153 so với "như vậy" 19), saddho = "có lòng tin" (72/199 toàn tầng, và 10 so với 0 "đức tin" trong AN4).
  Khoá đổi so với bản trước lượt này: 1.1, 1.3–1.7 (đa học/giáo huấn/thông thuộc giáo pháp/phù hợp với pháp thành đa văn/huấn luyện/nắm giữ Pháp/pháp và tùy pháp), 2.2, 2.3, 2.4, 3.1, 3.2, 3.3, 3.4, 3.6. Điểm đổi: terminology 9.3 → 9.5 (đưa các thuật ngữ về đa số có đếm, bỏ cách dịch lệch tiền lệ); vietnamese_clarity 9.4 → 9.5 (sửa 3.6 tối nghĩa, cân bằng nhịp 2.4/3.5/3.6); technical_integrity 10.0 → 9.6 (lượt này không chạy các cổng npm run validate · npm test · npm run check · npm run build nên không tuyên bố đã pass). Các tiêu chí khác giữ nguyên.
  Bất định còn lại: viyatta có thể đọc là "thạo, giỏi" hoặc "học rộng, sáng suốt"; "khéo léo" bám đa số của kho nhưng chưa chắc bao quát hết sắc thái. Sobheti là "làm đẹp, tô điểm" (bài song song an4.211 dịch "làm rực rỡ"); ở đây giữ "làm rực rỡ" cho nhất quán với bài song song. Bản Hòa thượng Thích Minh Châu không có tầng tham khảo ở bài này.
