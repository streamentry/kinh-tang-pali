notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** `6.7` **bung** dấu lược `…pe…` thành liệt kê mười mục (458 ký tự cho
  105 ký tự Pāli), trái BRIEF_VI3 §10.1. Ngoài ra chín khoá `9.4`, `9.5`, `10.1`,
  `10.6`, `11.1`, `11.6`, `12.1`, `12.10`, `13.1` có dấu `…` bịa ở cuối, mất
  vế `aniggahito asaṅkiliṭṭho anupavajjo appaṭikuṭṭho samaṇehi brāhmaṇehi viññūhi`
  trong khi Pāli viết đủ; đã viết lại theo đúng văn bản của `9.3`/`9.6`.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 10.7, 11.7, 12.11 (và 17.6 cùng bài) — ‘Lời đã nói, được
  nói nhờ nhân duyên này’ → ‘Đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói’ (dạng đa
  số, 54/80 khoá trùng ở `iti yaṁ taṁ vuttaṁ, idametaṁ paṭicca vuttaṁ`); khớp với ‘Lời đó đã được nói’ ở
  10.2/11.2/12.2. Giữ nguyên khoá 10.5 (‘giới tánh đất, giới tánh nước …’): cả bài dùng ‘giới tánh’ cho
  `dhātu` (9.3, 10.1, 10.4, 10.6, 13.4) và ‘giới tánh’ là thuật ngữ chiếm đa số toàn tầng (276 lần);
  dạng ‘giới đất, giới nước’ chỉ ở bốn khoá của các bài khác.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt thứ hai, ngưỡng lỏng hơn): khoá 14.1, 14.3, 15.1,
  15.14, 16.1, 16.14, 17.1, 17.4 — ‘Thế nào, này các tỳ-kheo, là diệu đế khổ (tập, diệt, đạo)?’ và
  ‘Đây, này các tỳ-kheo, được gọi là diệu đế …’ → ‘Và này các tỳ-kheo, thế nào là Thánh đế về …?’ và
  ‘Này các tỳ-kheo, đây gọi là Thánh đế về …’, khớp dn22 và cách dịch chiếm đa số toàn tầng (khoảng
  437 chỗ ‘Thánh đế’ so với 58 chỗ ‘diệu đế’); `Katamañca` có ‘ca’ nên thêm ‘Và’. Cùng thuật ngữ ở
  9.6, 13.1, 17.5: ‘bốn diệu đế’ → ‘bốn Thánh đế’. Giữ nguyên khoá 2.3, 4.3, 6.3 (‘Có thật chăng,
  các Tôn giả là những bậc nói thế này, thấy thế này’ sát `evaṁvādino evaṁdiṭṭhino` và khớp 2.1,
  3.3; dạng ‘chủ trương và tin rằng’ là của dn9) và 10.5 (‘giới tánh’, đã xét ở lượt trước). Chưa xử
  lý, ngoài phạm vi: nháy lồng ‘“…”’ ở 10.1, 10.6, 13.1 không có trong Pāli (17.5 đã sửa nháy cho khớp Pāli).

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Hòa thượng Thích Minh Châu (cùng bản English Sujato đã ghim, bài này có bản Anh nên khác với các bài không có bản Anh). 6 nhóm khoá bất đồng nghĩa → sửa 5, giữ 3, bất định 1. Sửa: (1) 1.6, 4.2, 4.7, 5.1 `issaranimmāna`: "tạo hóa của Đấng Toàn Năng" → "sự sáng tạo của đấng tối cao"; `issara` là bậc chủ tể, Pāli không có nghĩa "toàn năng", bản nguyên bài chỉ nói "một tạo hóa", và mn101 (cùng thuật ngữ, `issaranimmānahetu`) đã dịch "sự sáng tạo của đấng tối cao". (2) 2.7, 4.7, 6.7 `bhavissanti`: "có thể sát sinh…" → "sẽ là người sát sinh…"; Pāli là vị từ tương lai với danh từ chỉ người (`pāṇātipātino`, `adinnādāyino`…), bản nguyên bài "sẽ trở thành người…", còn "có thể" làm yếu chính điểm của lập luận (nếu mọi sự do nhân quá khứ thì hệ quả tất yếu, không phải khả năng). (3) 3.1, 5.1, 7.1 `sārato paccāgacchataṁ`: "coi … là yếu tố quyết định" → "quay lại xem … là cốt lõi" (tầng dịch `sārato` là "cốt lõi" ở 4/4 chỗ; `paccāgacchataṁ` là "trở lại" ở bản nguyên bài) và `chando` "sự khát cầu" → "ý muốn" (74 so 8 chỗ trong tầng; "khát cầu" dễ đọc thành ái). (4) 3.3, 5.3, 7.3 `niggaho`: "sự phê phán chính đáng" → "sự bác bỏ chính đáng", để cùng một từ với `aniggahito` "không bị bác bỏ" ở 9.1–9.6 và với mn80:16.3 (bản nguyên bài cũng dùng cùng một từ cho cả hai chỗ). (5) 9.5, 12.1, 12.10 `manopavicārā`: "mười tám hướng chú tâm của tâm" → "mười tám ý hành" (mn137 và mn140; bản nguyên bài "ý cận hành"); 12.4, 12.9 `somanassaṭṭhāniyaṁ…upavicarati`: "hoan lạc / buồn phiền / hướng đến" → "đáng đem lại hỷ / ưu / suy tầm", theo đúng câu Pāli trùng ở mn140:10.3 và 10.8 (cùng bài đã dùng "ưu" cho `domanassa` ở 14.2, 15.12, 16.12; "hoan lạc" dễ lẫn với `sukha`). Giữ 3: 1.1 `akiriyāya saṇṭhahanti` (bản nguyên bài "kiên trì trong quan điểm truyền thống về vô vi"; Pāli là "dừng lại/kết thúc ở không hành động", không có "truyền thống"); 13.4 `upādāya` (bản nguyên bài "chấp thủ sáu giới"; ở đây là "nương vào", đúng cả bản Anh); 1.3 và các chỗ tương tự `evaṁvādino evaṁdiṭṭhino` (bản nguyên bài "thuyết như sau, chấp kiến như sau"; cách dịch sát chữ của bài giữ nguyên). Bất định 1: 3.2, 5.2, 7.2 `paccattaṁ sahadhammiko samaṇavādo` — bản nguyên bài "danh từ Sa-môn không thể áp dụng đúng pháp cho các ông"; bản dự án "lời nói sa-môn chính đáng theo pháp dành cho chính mình" sát chữ nhưng nặng nề, nghĩa `vāda` là "danh xưng" hay "chủ trương" chưa phân xử được. Review đối kháng riêng sửa thêm: 14.2 dấu lược "…" → "(…)" cho khớp Pāli (73/93 khoá có `(…)` ở Pāli được giữ nguyên dạng trong tầng); 13.6 "kẻ đang cảm thọ" → "người đang cảm thọ" (Pāli `vediyamānassa` trung tính). Còn khác biệt dấu nháy so với Pāli ở 9.3–13.1 (Pāli không đánh dấu, bản Việt dùng nháy theo `ti`, như bản Anh) và 6.7 (Pāli có thêm ”): giữ như cũ. Mọi cặp Pāli trùng trong bài (22 cặp) vẫn dịch giống hệt nhau. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá.
