notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** `6.7` **bung** dấu lược `…pe…` thành liệt kê mười mục (458 ký tự cho
  105 ký tự Pāli), trái BRIEF_VI3 §10.1. Ngoài ra chín khoá `9.4`, `9.5`, `10.1`,
  `10.6`, `11.1`, `11.6`, `12.1`, `12.10`, `13.1` có dấu `…` bịa ở cuối, mất
  vế `aniggahito asaṅkiliṭṭho anupavajjo appaṭikuṭṭho samaṇehi brāhmaṇehi viññūhi`
  trong khi Pāli viết đủ; đã viết lại theo đúng văn bản của `9.3`/`9.6`.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 10.7, 11.7, 12.11 (và 17.6 cùng bài) — ‘Lời đã nói, được
  nói nhờ nhân duyên này’ → ‘Đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói’ (dạng đa
  số, 54/80 khoá trùng ở `iti yaṁ taṁ vuttaṁ, idametaṁ paṭicca vuttaṁ`); khớp với ‘Lời đó đã được nói’ ở
  10.2/11.2/12.2. Giữ nguyên khoá 10.5 (‘giới tánh đất, giới tánh nước …’): cả bài dùng ‘giới tánh’ cho
  `dhātu` (9.3, 10.1, 10.4, 10.6, 13.4) và ‘giới tánh’ là thuật ngữ chiếm đa số toàn tầng (276 lần);
  dạng ‘giới đất, giới nước’ chỉ ở bốn khoá của các bài khác.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt thứ hai, ngưỡng lỏng hơn): khoá 14.1, 14.3, 15.1,
  15.14, 16.1, 16.14, 17.1, 17.4 — ‘Thế nào, này các tỳ-kheo, là diệu đế khổ (tập, diệt, đạo)?’ và
  ‘Đây, này các tỳ-kheo, được gọi là diệu đế …’ → ‘Và này các tỳ-kheo, thế nào là Thánh đế về …?’ và
  ‘Này các tỳ-kheo, đây gọi là Thánh đế về …’, khớp dn22 và cách dịch chiếm đa số toàn tầng (khoảng
  437 chỗ ‘Thánh đế’ so với 58 chỗ ‘diệu đế’); `Katamañca` có ‘ca’ nên thêm ‘Và’. Cùng thuật ngữ ở
  9.6, 13.1, 17.5: ‘bốn diệu đế’ → ‘bốn Thánh đế’. Giữ nguyên khoá 2.3, 4.3, 6.3 (‘Có thật chăng,
  các Tôn giả là những bậc nói thế này, thấy thế này’ sát `evaṁvādino evaṁdiṭṭhino` và khớp 2.1,
  3.3; dạng ‘chủ trương và tin rằng’ là của dn9) và 10.5 (‘giới tánh’, đã xét ở lượt trước). Chưa xử
  lý, ngoài phạm vi: nháy lồng ‘“…”’ ở 10.1, 10.6, 13.1 không có trong Pāli (17.5 đã sửa nháy cho khớp Pāli).
