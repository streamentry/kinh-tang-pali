notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): an4.195:2.2, an4.195:2.5, an4.195:4.4, an4.195:4.8,
  an4.195:6.4, an4.195:7.5, an4.195:8.5, an4.195:9.5, an4.195:10.8, an4.195:12.8 — `vedanā` dịch “cảm
  thụ” → “cảm thọ” (thuật ngữ của glossary; “cảm thọ” áp đảo toàn tầng). Giữ nguyên phần còn lại của
  từng khoá.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 11.2 — ‘Bấy giờ có người đến với cuốc và giỏ’ → ‘Rồi một
  người mang theo cuốc và giỏ đi đến’ (`ādāya` = ‘mang theo’; `puriso` là ‘một người’; 3/4 khoá trùng).

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt hai): khoá 1.1 — ‘ở trong xứ người Sakya, tại
  Kapilavatthu, trong tinh xá Cây Bàng’ → ‘ở xứ Sakya, tại Kapilavatthu, trong tu viện Cây Đa’
  (`nigrodha` là cây đa, không phải cây bàng; khuôn câu theo `mn142:1.2`); khoá 6.3, 7.4, 8.4, 9.4 —
  ‘sự cạn dần ấy hiện tại, không thời gian, mời đến chứng nghiệm, có thể đạt đến, được bậc trí tự
  thân liễu tri’ → ‘sự tiêu mòn ấy có thể thấy ngay trong hiện tại, không thời hạn, có thể đến xem,
  hướng thượng, mỗi bậc trí tự mình hiểu được’ (`sandiṭṭhikā` là ‘thấy ngay trong hiện tại’ chứ
  không chỉ ‘hiện tại’; `opaneyyikā` là ‘hướng thượng’ chứ không phải ‘có thể đạt đến’; công thức
  `nijjarā` có 7 khoá trùng nguyên văn ở `sn42.12` và `an3.74` đều dùng cách này); khoá 10.2, 10.7,
  12.2, 12.7 — ‘không hoan lạc không buồn bã; … có niệm tỉnh giác’ → ‘không vui mừng, không buồn
  phiền; … có niệm, tỉnh giác’ (`neva sumano hoti na dummano … sato sampajāno`; cách dịch áp đảo ở
  `dn33`, `ps3.2`, `cnd8`, và ‘có niệm, tỉnh giác’ là hai thuật ngữ rời).
