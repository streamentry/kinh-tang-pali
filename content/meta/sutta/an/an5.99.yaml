notes: |-
  Lát f4 (2026-10-05): dịch lại 3 khoá bị cắt ngắm.

  NGUỒN GỐC LỖI, ĐÃ ĐỐI CHIẾU ĐƯỢC: bản Anh Sujato đã ghim lược 1.7 thành If he strikes
  a buffalo …, 1.8 thành a cow …, 1.9 thành a leopard …, trong khi Pāli ba khoá này viết
  đủ. Bản Việt đã sao chép đúng lỗi ấy.

  ĐÃ SỬA (3 khoá): 1.7, 1.8, 1.9 viết lại đủ theo công thức của 1.6 và 1.10 trong chính
  bài — vật thể, rồi sakkaccaññeva … no asakkaccaṁ thành một cách cẩn trọng, chứ không cẩu
  thả. Danh từ: mahiṁsassa thành con trâu (Sujato: a buffalo), gavassa thành con bò (a
  cow), dīpissa thành con báo (a leopard). Không đổi chữ hoa/thường sẵn có: 1.6 mở câu
  (Chữ Nếu), 1.7–1.9 nối tiếp nên chữ thường.

  BẤT ĐỊNH CÒN LẠI: dīpissa ở 1.9 nghĩa là mãn thú. Bản Anh đã ghim dịch là a leopard
  nên con báo là đúng; nhưng đếm cả tầng dự án thì dīpi, dīpissa, dīpino, dīpis chỉ có
  3 chuỗi Pāli, và 2 chỗ kia (ja162:2.3, ja189:1.2) dịch là hổ, tức đa số cục bộ nghiêng
  về hổ. Giữ con báo vì danh từ này không nằm trong phần bị cắt và vì bản Anh đã ghim nói
  leopard. Nếu người biên tập chốt dīpi là hổ thì phải đổi cả ba chỗ.

  ĐỘ DÀI: Pāli 1517 ký tự · Việt 1363 → 1495 (tỉ lệ 0,898 → 0,985). Phép so dấu lược
  theo từng khoá: lệch 3 → 0. Cả 25 khoá đều có nội dung, không thiếu khoá nào, không
  thừa.

  CÒN LẠI: một khoá lệch dấu câu so với Pāli — 2.1 có thêm một cặp nháy đơn quanh chữ
  sư tử mà Pāli không đặt trong nháy (Pāli 2.1 = Sīhoti kho, bhikkhave, tathāgatassetaṁ
  adhivacanaṁ …). Chạy xuyên suốt bài vẫn cân (2/2) nên không chặn, chỉ là lỗi chấm câu.

  PHE DẤU TI, ĐO Ở PHẠM VI GẦN NHẤT, CẢ HAI SỐ: bài này có 2 khoá Pāli mang hạt ti và
  bản Việt hiển thị dấu ti ở 0 khoá (0/2). Toàn tầng Việt dự án: 3588 trên 22603 (16%).
  Theo bộ: dn 0/3144, mn 0/6270, sn 1640/5076, an 479/4135, kn 1469/3978.

  ĐỐI CHIẾU: tầng Anh đã ghim phủ 17/17 khoá có nội dung (100%), nhưng ba khoá đã sửa bị
  Sujato lược, nên công thức lấy từ 1.6 và 1.10 (hai khoá Sujato dịch đủ) và đối chiếu
  danh từ. Đã dò 152959 khoá Việt của tầng dự án: công thức pahāraṁ deti, sakkaccaññeva
  … no asakkaccaṁ chỉ xuất hiện trong chính bài này, không có bản ghi nào ở sutta khác để
  dùng lại nguyên văn. Thuật ngữ một cách cẩn trọng, chứ không cẩu thả đã có sẵn 7 lần
  trong bài và được dùng lại y nguyên.

