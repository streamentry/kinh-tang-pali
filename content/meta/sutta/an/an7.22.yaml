notes: |-
  Dịch từ Pāli root đã ghim (đối chiếu byte-for-byte với dump 57 khoá; chỉ khác trailing space ở khoá kết bài `12.7`), tham chiếu bản Anh Bhikkhu Sujato tại cùng commit. Coverage Anh Sujato trên Pāli có nội dung: 46/47 = 97,9% (Sujato bỏ trống `2.3` và `12.7`). Tầng Việt hiện hành vắng ở commit đã ghim (chỉ có Pháp Cú) — không có bản HT. Thích Minh Châu để đối chiếu; đây là đặc điểm snapshot upstream.
  **Số khoá: 57/57 đúng dump header. Pāli trùng nguyên văn: 22/57 khoá, tất cả dùng lại cách dịch đã có.** Đếm bằng chỉ mục Pāli↔Việt dựng từ 5.478 tệp dịch sẵn + root Pāli toàn kho (khớp chuỗi tuyệt đối). Nguồn chính là `dn16` (Mahāparinibbāna — bài song ngữ trực tiếp): `1.3`, `2.2`, `2.3`, `2.5`, `2.8`, `3.3`, `3.4`, `4.1`, `4.4`, `5.2`, `11.2`, `12.4` dùng NGUYÊN VĂN bản dn16; `4.2` theo đa số 10/22 ("Rồi Đức Thế Tôn bảo Tôn giả Ānanda:"); `2.4` theo đa số 5/10 ("Và hãy nói thêm:"); `1.1` "Evaṁ me sutaṁ—" 428 trùng, theo đa số 223 cho "Tôi nghe như vầy." (121 ":", 29 "—"); `1.2` theo đa số 5/8; `1.4`=`3.5` "So evamāha:" theo đa số 20/69 "Vị ấy nói:". Khoá `0.2` "3. Vajjisattakavagga" trùng 9/9 → «3. Phẩm Bảy Điều Tộc Vajji».
  **4 khoá trùng có chia phiếu, ghi lựa chọn.** `0.3` "Vassakārasutta" 1-1 (an4.35 «Kinh Vassakāra» / an4.187 «Kinh Với Vassakāra») — theo mẫu «Kinh X» thống trị tầng (1184 vs 34 «Kinh Với X») → «Kinh Vassakāra». `2.9` 1-1 (dn16 vs mn87) — theo dn16, bài song ngữ trực tiếp. `12.5` "Yassadāni…" 1-1-1 — chọn an4.187 («Bây giờ, này Bà-la-môn, chính là lúc ông thấy nên đi.») vì cùng quan hệ người nói–người nghe (Đức Thế Tôn → Vassakāra) và sát nghĩa `kālaṁ maññasi` hơn hai bản còn lại. `0.1` theo đa số toàn tầng: «Kinh Tăng Chi Bộ» 894 vs «Aṅguttara Nikāya» 357.
  **Cấu trúc trích dẫn bám Pāli:** câu hỏi `5.1`–`10.1` KHÔNG mở nháy `“` (Pāli chỉ đóng `…”ti?` — nháy mở thuộc đoạn `Yāvakīvañca` liền trước `4.5`–`9.3`), lời báo lại `2.7`/`3.6` để nháy đơn trong nháy kép, đúng nesting Pāli. Cân nháy kiểm bằng máy: “=”,=22/22.
  **Thuật ngữ.** `aparihāniye dhamme` (11.3–12.2) → «pháp bất thối chuyển» theo 8 tiền lệ AN cùng vagga (an7.21–an7.28), khác với dn16 «không suy thoái» (0 tiền lệ trong AN); các dòng `no parihāni` ở 4.x–10.x giữ «suy giảm» vì là trùng nguyên văn dn16 — hai cách diễn đạt cùng gốc `parihāni` song song theo đúng hai nguồn đã ghim. Cột 35 khoá còn lại dịch mới theo khung dn16, giữ đúng thì tương lai (`bhavissanti` → «còn sẽ») và số lượng.
  Cổng kỹ thuật do coordinator chạy; đã tự kiểm: JSON hợp lệ, NFC, đủ 57 khoá, parity dấu lược, không chép Pāli.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.3, 3.3 — công thức hỏi thăm `appābādhaṁ appātaṅkaṁ lahuṭṭhānaṁ balaṁ phāsuvihāraṁ` “ít bệnh ít đau yếu, chân tay có nhẹ nhàng, có mạnh khỏe, có sống an trú dễ chịu” → “ít bệnh, ít não, thân thể nhẹ nhàng, khỏe mạnh và sống an ổn”, đúng khuôn `dn16:1.2.3`, `dn16:1.3.4` (cùng lời nhắn của Ajātasattu; khuôn này có ở 15/40 khoá của công thức, còn “chân tay” không có ở khoá nào khác và không có căn cứ cho `lahuṭṭhāna`). Khoá 12.1 — thêm sắc *dù chỉ* của `-pi` trong `ekamekenapi` và viết “chỉ có thể chờ đợi sự tăng trưởng, chứ không phải sự suy giảm”. “bất thối chuyển” → “không suy giảm” ở 11.3, 11.4, 12.1, 12.2: toàn kho “không suy giảm” 114 khoá, “không suy thoái” 26, “bất thối chuyển” 9 (5 ở bài này), và `an7.24`, `an7.25`, `an7.27` nay dùng “không suy giảm” nên mục Thuật ngữ ở trên (8 tiền lệ AN) đã cũ; “không suy giảm” còn đối xứng với `parihāni` → “sự suy giảm” ngay trong 11.4 và 12.1. `bho gotama` “ngài Gotama” → “Tôn giả Gotama” ở 3.3, 3.4, 12.1, 12.3, 12.4 (toàn kho 1.190 khoá “Tôn giả Gotama” so với 23 “ngài Gotama”). Giữ nguyên cấu trúc câu của 11.4 vì bám sát Pāli.
