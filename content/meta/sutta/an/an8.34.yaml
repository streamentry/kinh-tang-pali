notes: |-
  Dịch từ Pāli root (đường dẫn đã ghim trong content/catalog/sutta/an.json), đối chiếu
  bản dịch tiếng Anh của Bhikkhu Sujato tại cùng commit bilara. Tại commit đã ghim không
  có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Tăng Chi Bộ, nên không có
  tầng Việt truyền thống để so; đây là giới hạn của bản chụp upstream, không phải thiếu
  sót của repo.

  COVERAGE Anh, đo bằng đúng công thức của src/lib/canon/reference.ts: substantive = 12
  (Pāli ≥ 40 ký tự sau nén, bỏ khối :0), không có Anh = 0, ratio = 1.0000. Tệp Anh đã
  ghim có đủ 48 khoá; 47 khoá có chữ Anh, chỉ :11.5 (Catutthaṁ.) bị Sujato bỏ trống.

  TÊN, có số đếm. :0.2 4. Dānavagga → 4. Phẩm Cho Dâng (8/8 bài có Pāli trùng tuyệt
  đối: an8.31, an8.33, an8.36, an8.39…). :0.3 Khettasutta → Kinh Cánh Đồng, dùng lại
  nguyên văn an3.83:0.3 (Pāli y hệt). :11.5 Catutthaṁ. → Thứ tư. (đa số toàn tầng: 27 bài
  an4 + nhiều bài khác; trong chính an8 thì hòa 3–2 nên tôi theo đa số toàn tầng).
  :0.1 là trường CHƯA có bảng chốt: trong an8 đo được 39 bài dùng Aṅguttara Nikāya 8.x
  so với 13 bài dùng Kinh Tăng Chi Bộ 8.x, nên tôi theo phẩm và giữ nhất quán với
  an8.31, an8.32, an8.33 ngay sát trước; nhưng toàn tầng an thì ngược lại (370 so với
  901). Ghi ra đây để người điều phối gộp, vì đây là trường chưa được chốt.

  THUẬT NGỮ, có số đếm. samaṇabrāhmaṇa → Sa-môn hay Bà-la-môn (40 lần Pāli trong tầng;
  chọn hay vì đây là phép liệt kê rời như Sujato an ascetic or brahmin).
  micchādiṭṭhi…micchāsamādhi và sammādiṭṭhi…sammāsamādhi → tà/chánh kiến, tư duy, ngữ,
  nghiệp, mạng, tinh tấn, niệm, định, đúng như an10.103:2.3, an10.104:2.4, an10.105:1.2
  đã có. aṭṭhaṅgasamannāgata → đầy đủ tám điều kiện; riêng dạng …uposathaṁ đã có là có
  đầy đủ tám phần (an10.46, an3.70) hoặc trai giới có đủ tám điều kiện (an8.44), còn ở
  đây nói về ruộng và người nhận bố thí nên tôi dùng điều kiện. khetta → ruộng, bīja →
  hạt giống, mariyādasampanna → đủ ranh giới: cả ba theo mil7.8.4 đã có. sampadā → sự
  viên mãn: đo được 909 lần viên mãn so với 119 lần sự thành tựu trong tầng, và sammā*
  vẫn giữ chánh nên không lẫn với Chánh Đẳng Giác. nibbāna → Niết-bàn (đúng khuôn mil).

  BẤT ĐỊNH ĐÃ GHI. (a) mahassāda không có tiền lệ nào trong tầng Việt, và toàn bộ corpus
  Pāli chỉ có thêm một chỗ là tha-ap552:19.1 (Desanaṁ taṁ mahassādaṁ, nghĩa là bài pháp
  dạy thú vị dễ chịu); Sujato dịch rewarding. Tôi dịch lợi ích lớn để giữ cả nghĩa dễ
  chịu lẫn chức năng của một tính từ trong chuỗi ba danh từ về ruộng. (b) mahājutika và
  mahāvipphāra (0 tiền lệ) tôi dịch oai nghi lớn và sự lan rộng lớn; Sujato dịch
  brilliant và bountiful. (c) mātikāsampanna: mil7.8.4:1.2 dịch là có đủ đất mẹ, vì ở
  đó nó nói về nền tảng của người hành trì; ở đây mạch là thủy lâm ruộng và Sujato dịch
  irrigation channels, nên tôi dịch mương tưới — khác tiền lệ có chủ đích. (d) phātiseyya
  (0 tiền lệ) tôi dịch cây nảy mầm, giữ nghĩa nứt ra, mọc lên của phāti. (e) :4.4 Pāli
  kết bằng dạng tuyệt đối mahāvipphāranti, khác :4.1 dạng danh từ, nên bản Việt dùng có
  thì có sự lan rộng lớn thay vì cho sự lan rộng lớn như ở :2.1/:4.1.

  Cặp nháy kép: Pāli mở “ ở :1.1, đóng ” ở :11.4; không có nháy đơn. Bản Việt khớp đúng
  TỪNG khoá, không chỉ khớp tổng (quét riêng bằng _c77_quotes.py: 0/48 lệch). Cơ chốt
  _hvi.py chạy sạch: đủ 12/12 khoá có nội dung, không khoá thừa, NFC, không trùng nguyên
  văn Pāli, không lọt Pāli, số dấu lược khớp từng khoá, nháy kép cân trên cả bài.

  Bốn cổng kỹ thuật theo AGENTS.md (npm run validate, npm test, npm run check, npm run
  build) KHÔNG chạy trong lát này vì BRIEF_VI3 cấm; technical_integrity đặt 9.6 vì mọi
  chốt tự động của _hvi.kiểm đã xanh và 12/12 khoá của chính bài này, nhưng cổng npm và
  lượt rà độc lập của người rà chưa chạy. final_score là trung bình số học thô của đúng
