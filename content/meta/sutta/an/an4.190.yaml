notes:
  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá 6.2, 6.3, 6.4 — "với suy niệm
    ‘…’" → "với nhận thức ‘…’" (`saññā` là nhận thức/tưởng, không phải suy niệm;
    "nhận thức ‘không có gì’" đã dùng ở 9 bài khác, "suy niệm" chỉ có ở bài này
    và `an8.66`); 6.4 "không có gì hết" → "không có gì" theo `natthi kiñci`; 6.2
    "tưởng đối lại" → "tưởng đối ngại" (1 so với 34 chỗ trong tầng). Giữ nguyên
    cách gọi "xứ hư không vô biên / xứ thức vô biên / xứ vô sở hữu" của bài
    (cùng khuôn với `an8.66`, hợp lệ); giữ nguyên khoá 2.1 (khác cách đa số chỉ ở vị trí hô ngữ).
