notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 20/29 = 68,97%**, dưới ngưỡng 0,8; xem `blocking_errors`. Tầng `english-project` không có cho uid này. Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ phân phối Pháp Cú cho tiếng Việt), nên không có bản Hòa thượng Thích Minh Châu để đối chiếu; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **Chín khoá mất tầng Anh là lời Ānanda kể lại, và đó là lý do `triangulation` vẫn 8,0 chứ không xuống ≤ 8,0.** `4.1`–`4.6` và `5.1`–`5.5` là Ānanda tường thuật việc mình vừa nói ở `1.3`–`1.8` và `2.2` — tức gần như nguyên văn những gì ông đã nói. Tôi đối chiếu từng cặp trong chính bài (xem `an7.42`, bài trước cùng phẩm, có **cùng khung truyện** và 14 khoá PĀLI TRÙNG NGUYÊN VĂN) nên chín khoá đó vẫn được kiểm bằng Pāli đặt cạnh nhau, không phải đoán. Khác hẳn một bài mà cả hai tầng đều vắng, ở đó phải xuống ≤ 8,0.
  **`an7.42` là nguồn tiền lệ chính** (cùng phẩm, cùng khung truyện, 14 khoá PĨI TRÙNG NGUYÊN VĂN): `1.6` (*Sao ta không đến tu viện của những du sàu ngoại đạo nhỉ?*), `2.1`, `2.2`, `3.2`, `3.3`, `4.6`, `5.1`, `5.2`, `5.3`, `5.6`, `7.5`, `7.6` — và cả khuôn câu ở `1.3`, `1.7`, `1.8`, `3.1`, `3.4`, `4.1`, `4.2`, `4.5`, `5.4`, `5.5`, `6.1`, `6.2`, `7.3`, `7.4`. Ngoài ra `0.2` = `an6.31:0.2` (*4. Phẩm Chư Thiên*) · `1.1` = `dn14:1.1.1` (*Tôi nghe như vầy:*) · `1.2` = `dn7:1.2` (*Một thời, Đức Phật trú tại Kosambī, trong tu viện Ghosita.*) · `1.4` = `dn16:3.11.1` · `7.7` = `sn38.12:1.14` (*Thứ mười hai.*).
  **Tiêu đề `0.3` ghép cặp với `an7.42:0.3`.** `Paṭhamaniddasasutta` → *Kinh Tốt Nghiệp Thứ Nhất* (đã có), nên `Dutiyaniddasasutta` → *Kinh Tốt Nghiệp (Hai)*. `niddasa` / `niddasavatthu` → *tốt nghiệp* / *tiêu chí tốt nghiệp* theo đúng lựa chọn của `an7.42` (tiêu đề Sujato là *Graduation (1st)*; `niddasa` là từ chỉ người đã học xong). `brahmacariya` → *phạm hạnh* (tiền lệ `an7.42:1.8`). `aññatitthiya` / `paribbājaka` → *du sàu ngoại đạo* (49 bản trùng nguyên văn, và `an7.42` dùng y hệt).
  **`7.2` bảy tiêu chí tốt nghiệp — dùng lại đúng vựn từ của `an7.42`.** `saddho` → *có đức tin* · `hirīmā` → *biết hổ thẹn* · `ottappī` → *biết kính sở* · `bahussuto` → *nghe nhiều* · `āraddhavīriyo` → *tinh tấn đã khởi* · `satimā` → *có niệm* · `paññavā` → *có tuệ*. Riêng `ottappī` có hai nhánh trong tầng — `dn33:2.3.13` dịch *có quỷ*, còn `an5.84:2.3` và `an7.42` dùng *biết kính sợ*; tôi theo `an7.42` vì cùng phẩm và cùng danh sách bảy tiêu chí. `7.1` (`Katamāni satta?`) theo `an7.42:5.1` (*Thế nào là bảy?*).
  **Uddāna `8.0`–`8.4`, 0 tiền lệ, dịch theo nghĩa chữ.** `Appamāda` → *không phóng dật* (106 bản) · `hirī` → *biết hổ thẹn* (khớp `7.2`) · `suvacā` → *dễ trò chuyện* (`mn21:10.7` dịch *dễ được khuyên dạy*, cùng ý) · `mittā` → *hòa thuận* (0 tiền lệ) · `paṭisambhidā` → *biện giải* (`an4.140:1.8`) · `vasā` → *điện tài* (0 tiền lệ) · `niddasavatthu` → *tiêu chí tốt nghiệp* (khớp `6.2`, `7.3`). `7.8` theo `an6.36:7.1` cho khuôn *Phẩm …, thứ …*.
  **Dấu lược.** `4.4` giữ đúng một dấu `…` (`…pe…` lược phần `tehi saddhiṁ sammodiṁ`); không mở rộng. Ở `4.4` tôi đặt dấu lược ở cuối câu *Sao ta không đến … nhỉ? …* vì `4.5` mới là phần bị lược, và ở `5.2` tôi giữ `niddaso bhikkhūti` **không** nháy kép — theo đúng tiền lệ `an7.42:3.8`.
