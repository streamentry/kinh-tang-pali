notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** Tám khoá `11.4`–`11.11` bị cụt thành stub *như hố than hồng …* v.v.
  (18–21 ký tự cho 80–92 ký tự Pāli), mất vế `bahudukkhā bahupāyāsā, ādīnavo ettha
  bhiyyo` và có dấu `…` bịa để che chỗ thiếu trong khi Pāli không có `…pe…`. Ngoài ra
  `19.2` **bung** dấu lược `…pe…` thành liệt kê 458 ký tự cho 44 ký tự Pāli, trái
  BRIEF_VI3 §10.1. Đã viết lại chín khoá. `15.4`, `18.5`–`18.8`, `19.2` còn lại đã
  đối chiếu và giữ nguyên vì Pāli thật sự có dấu lược ở đó.

  **Lượt cải thiện 2026-10-11.** Đọc đối kháng cả 138 khoá với Pāli, đo tiền lệ trên toàn tầng trước khi đổi. Đã đổi 52/138 khoá, giữ nguyên tập khoá và thứ tự. Phép đo: Sujato phủ 112/112 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); tầng Việt hiện hành chỉ có Pháp Cú nên bài này không có bản Thích Minh Châu để đối chiếu (ghi chú cũ về việc đã tham khảo Thích Minh Châu qua công thức của kho là không kiểm chứng được và đã bỏ khỏi `assessed_by`; `source_provenance` hạ từ 10,0 xuống 9,6). Song song đối chiếu: sn20.10 (cùng câu `dunnivatthaṁ … rāgo cittaṁ anuddhaṁseti`), sn42.3 và sn42.5 (`pare hananti pariyāpādenti`), mn22 và mn54 (các ví dụ về dục), an5.75 (cùng công thức `saṅgāmasīsaṁ`, `vivittaṁ senāsanaṁ`, phần tu tập và lậu tận).
  Sửa chính xác (accuracy fix, điểm `semantic_fidelity` 8,0 → 8,8 và `segment_alignment` 6,0 → 9,0):
  - 9.1, 13.1, 17.1: Pāli nhắc lại trọn ví dụ (`asicammaṁ gahetvā … ussahati vāyamati … upalikkhanti`), bản cũ chỉ còn "Như bậc chiến sĩ bị kẻ địch làm bị thương …", mất gươm khiên, xung trận, nỗ lực cố gắng → viết lại đủ theo khuôn 7.1 và 20.1.
  - 18.14: Pāli có `abhijjhaṁ loke pahāya …pe… so ime pañca nīvaraṇe pahāya`, bản cũ mất vế đầu và dấu lược → "Người ấy từ bỏ tham lam nơi thế gian … Người ấy từ bỏ năm triền cái này — …" (dạng của an5.75:15.2; số dấu lược khớp Pāli).
  - 19.3: Pāli chỉ có `nāparaṁ itthattāyāti pajānāti`; bản cũ chép thêm "Sanh đã tận, phạm hạnh đã thành, việc nên làm đã làm" (nằm trong phần bị lược ở 19.2) và "tái sanh" → "Người ấy biết rõ: ‘Không còn trở lại trạng thái hiện hữu này nữa.’" (4 khoá cùng Pāli ở tầng dùng dạng này; 3 khoá khác đọc "không còn gì là tự thân nữa", xem bất định bên dưới).
  - 18.15: Pāli chỉ có `vivicceva kāmehi …pe…`; bản cũ thêm "ly các pháp bất thiện" → "hoàn toàn ly dục …" (23 khoá dùng "hoàn toàn ly dục", 10 khoá "ly các dục", 8 khoá "ly dục"; khớp an5.75:15.8).
  - 11.12: Pāli `sappasirūpamā kāmā vuttā bhagavatā bahudukkhā bahupāyāsā, ādīnavo ettha bhiyyo` không có `appassādā`, bản cũ chèn "ít có sự thỏa mãn" và viết thành câu lệch khuôn với 11.3–11.11; "đầu rắn độc" thêm "độc" (14 khoá cùng Pāli dùng "đầu rắn", 2 khoá thêm "độc") → "Các dục được Đức Phật ví như đầu rắn, nhiều khổ, nhiều ưu não, và ở đây có nhiều nỗi nguy hại hơn nữa."
  - 15.4: viết lại bám Pāli (một `…pe…` và bảy `…` = tám dấu lược, nay đúng tám), bỏ "— Đức Phật nói các dục là ít có sự thỏa mãn" không có trong khoá và dấu `…` thừa ở đầu khoá.
  - 5.2 và 20.1: "như bậc toàn thắng trận mạc" thêm "như/toàn" và "đỉnh của trận chiến" bịa "đỉnh" (`sīsa` = đầu; an3.12 dùng "đầu trận") → "Sau khi chiến thắng trận ấy, người đã thắng trận trú ngay nơi đầu trận chiến ấy" (cùng an5.75:5.2).
  - 1.5 và 7.1: `pariyāpādenti` "giết chết và hạ gục" → "giết và kết liễu" (tầng: "hạ trọn" 5 khoá, "kết liễu" 5 khoá, không có "hạ gục"; "hạ gục" yếu hơn nghĩa chấm dứt hẳn, "chết" thừa sau "giết").
  - 1.3, 2.1, 3.1, 4.1, 5.1, 7.1, 9.1, 13.1, 17.1, 20.1: `asicammaṁ gahetvā dhanukalāpaṁ sannayhitvā viyūḷhaṁ saṅgāmaṁ otarati` "đeo gươm khiên, thắt cung tên, xung vào trận tiền" → "mang kiếm và khiên, thắt cung tên, xung vào chiến trận đã dàn quân": khôi phục `viyūḷha` (đã bị bỏ; tầng dịch `ubhatobyūḷhaṁ saṅgāmaṁ` là "chiến trận hai bên dàn quân") và theo "mang kiếm và khiên" của mn86, mn13, mn14 (7/7 khoá cùng cụm).
  - 19.1: `āsavānaṁ khayañāṇāya` "trí cạn lậu hoặc" → "trí đoạn tận các lậu hoặc" (công thức chuẩn: "trí đoạn tận các lậu hoặc" ở 15/25 khoá chứa cụm `āsavānaṁ khayañāṇāya`, "trí đoạn tận lậu hoặc" 5 khoá; cùng an5.75:16.1).
  Sửa thuật ngữ (terminology fix, điểm `terminology` 9,3 → 9,5):
  - 11.2, 12.2, 15.2: `appassādā` "ít có sự thỏa mãn" → "ít vị ngọt" (`assāda` dịch "vị ngọt" ở 220/374 khoá, "thỏa mãn" ở 0 khoá; `appassādā` "ít vị ngọt" ở khoảng 9 khoá của mn14, mnd1, cnd23, thig, "ít vui" ở 5 khoá của mn22, "ít có sự thỏa mãn" chỉ ở chính bài này).
  - 6.6, 6.7, 8.4, 8.5, 10.4, 10.5, 14.4, 14.5: `rāgo cittaṁ anuddhaṁseti`, `rāgānuddhaṁsitena` "nhiễm bẩn" → "xâm chiếm" (cùng Pāli: sn8.1, sn8.2, sn8.4 "xâm chiếm" 5 khoá; mn67 "làm ô nhiễm" 1 khoá; sn20.10 "nhiễm bẩn" 1 khoá; "nhiễm bẩn" không phải nghĩa của `anuddhaṁseti`).
  - 8.8, 10.8, 10.11, 12.2, 14.8, 14.11, 16.2, 16.3: `āvuso` "Này các bạn" → "Này các hiền giả" (tầng: "hiền giả" 2.543 khoá, "bạn" 176 khoá; 11.2 và 15.2 vốn đã "Này hiền giả" nên bài tự lệch chính nó); 16.3 thêm lại lời xưng hô của Pāli (`Na dānāhaṁ, āvuso`).
  - 8.7, 10.7, 14.7: `yannūnāhaṁ` "Bấy giờ ta hãy" → "Hay là ta hãy" (92 khoá "hay là", 3 khoá "bấy giờ/bây giờ"; "bấy giờ" dễ đọc thành mệnh đề thời gian).
  - 11.3–11.12 và 15.3, 15.4: "được Đức Phật thí dụ như" → "được Đức Phật ví như" (trong 34 khoá cùng công thức `-ūpamā kāmā vuttā` ở tầng, 12 khoá có chữ "ví", 0 khoá "thí dụ như"); 11.3 và 15.3 thêm lại "và" cho cùng khuôn với 11.4–11.12.
  - 18.3, 18.9: `nimittaggāhī … anubyañjanaggāhī` "đặc tướng … tùy tượng" → "tướng chung hay các chi tiết" (dạng đa số, 18/53 khoá; "đặc tướng … tùy tượng" chỉ ở 6 khoá thuộc ba bài trước lượt này, và "tùy tượng" không phải thuật ngữ quen thuộc).
  - 18.12: `vivittaṁ senāsanaṁ` "chỗ trú vô người" → "chỗ ở xa vắng"; `pabbataṁ` "sườn núi" → "núi"; `vanapatthaṁ` "khu rừng" → "rừng sâu"; "đống rơm rạ" → "đống rơm" (khớp an5.75:14.5; "vắng vẻ/xa vắng" ở tầng).
  Đã đo, giữ nguyên: "bó cỏ cháy" (`tiṇukkā`: "bó cỏ cháy" 6 khoá, "bó đuốc cỏ" 7 khoá, không đủ chênh để đổi); "đao thớt" (3 khoá, "dao và thớt" 4 khoá); "gươm giáo" cho `sattisūla` (9/13 khoá); "bộ xương" (11/18); "giấc mộng" (6/11); "xung vào" cho `otarati` (cùng an5.75 "xung trận"); "chánh niệm không được thiết lập" (5 khoá; dạng "niệm không được thiết lập" nói chung 8/12 khoá của `anupaṭṭhitāya satiyā`); "người ấy" thay "vị ấy" (cùng an5.75); "không vui" cho `domanassa` ở 18.4 và 18.10 (tầng chia "ưu não" 15, "tham và ưu" 12, "không vui" 6; "ưu não" đã là `upāyāsa` ngay trong bài này nên không dùng lại); dấu nháy lồng “ ” ở 8.8–8.9, 10.8–10.9, 14.8–14.9 là dấu trình bày lời nói lồng (Pāli mở bằng dấu gạch ngang `—`, không có dấu nháy), nên 8.9, 10.9, 14.9 khác 10.12, 14.12 ở nháy kép dù Pāli trùng nguyên văn; 19.3 có nháy đơn dù Pāli khoá này không có (quy ước tầng, 4/4 khoá cùng Pāli).
  Phép kiểm: tập khoá Việt = tập khoá Pāli (138/138), thứ tự giống Pāli, không khoá rỗng, NFC, không chữ Pāli lọt vào; dấu lược cân bằng từng khoá (138/138; 15.4 có tám dấu lược như Pāli; 18.5–18.8, 18.14, 18.15, 19.2 mỗi khoá theo Pāli); không còn `…` ở khoá Pāli không có; cặp Pāli trùng nguyên văn trong chính bài: 85 cặp, bản Việt trùng ở 79 cặp, 6 cặp khác duy nhất ở nháy lồng nói trên; tỉ lệ độ dài Việt/Pāli trên 112 khoá có nội dung: thấp nhất 0,69 (các dòng "Đây là bậc chiến sĩ thứ …"), trung vị 1,06, cao nhất 1,55. Số: năm hạng chiến sĩ, năm hạng người; thứ tự nhất–nhì–ba–tư–năm đúng ở 1.7, 2.7, 3.8, 4.8, 5.4 và 7.2, 9.2, 13.2, 17.3, 20.3.
  Bất định còn lại (ghi, không đổi thân kinh): `upalikkhanti` (2.3, 3.3, 4.3, 9.1, 13.1; chỉ có trong bài này, Sujato dịch "wound", giữ "làm bị thương"); chủ thể của `apanenti … nenti` (2.4; Pāli số nhiều chủ động, không rõ ai, giữ thể bị động như Sujato); `itthattāya` ở 19.3 (4 khoá tầng "không còn trở lại trạng thái hiện hữu này nữa", 3 khoá "không còn gì là tự thân nữa"); `tiṇukkā` ("bó cỏ cháy" hay "bó đuốc cỏ"); `pariḍayhateva kāyena pariḍayhati cetasā` (8.5, 10.5, 14.5; chỉ ở bài này, giữ "nóng bỏng với thân, với tâm"); 16.2 gộp ba lần `āvuso` thành một lời xưng hô. Không bất định nào đủ để đổi nghĩa giáo lý hay làm blocker.
  Chưa chạy được cổng kỹ thuật trong lượt này nên `technical_integrity` đặt 9,6: `npm run validate`, `npm test`, `npm run check`, `npm run build` còn phải chạy.
