notes: |-
  **Lượt cải thiện 2026-10-13.** Bản trước chưa có `notes`. Đọc đối kháng cả 57 khoá cặp Pāli↔Việt, đối chiếu với bài song song `an3.50` (cùng công thức "đại trộm") và đo tiền lệ bằng số đếm trên toàn tầng; sửa 46 khoá (`0.3`, `1.1`, `1.3`, `2.1`–`2.3`, `3.1`–`3.3`, `4.1`, `4.2`, `4.4`–`4.6`, `5.1`, `5.2`, `5.4`–`5.6`, `6.1`, `6.2`, `6.4`, `6.5`, `7.1`, `8.1`, `8.3`, `9.1`–`9.3`, `10.1`–`10.3`, `11.1`, `11.2`, `11.4`–`11.6`, `12.1`, `12.2`, `12.4`–`12.6`, `13.1`–`13.3`, `14.1`); 11 khoá còn lại giữ nguyên. Tập khoá và thứ tự khoá không đổi (57/57). Phân loại:

  *Accuracy fix — thêm hoặc đổi nghĩa ngoài Pāli.* `2.2`: `nadīviduggaṁ` bị thêm *sâu* ("sông sâu không thể qua được"); đổi thành *vùng ven sông hiểm trở*, `pabbatavisamaṁ` thành *vùng núi gập ghềnh* (cùng `an3.50:1.5`). `3.2`: `mahāvanasaṇḍaṁ` bị dịch thành *bóng cây rừng lớn* (`vanasaṇḍa` là lùm rừng, không có nghĩa "bóng"); đổi thành *một lùm rừng lớn* như `an3.50:2.2`; `rodhaṁ` đổi *nơi bịt kín tầm mắt* → *một góc khuất* theo cùng bài song song (Sujato: *a blind spot*). `6.4`: *Vì sợ rằng* thêm cảm xúc *sợ* mà Pāli không nêu; đổi thành *Vì nghĩ rằng:* (Pāli chỉ có lời nghĩ trong nháy). `13.3`: *để kiếm được lợi dưỡng* thêm mục đích mà Pāli không nêu (`upasaṅkamanto … labhati` là hai động từ nối tiếp); đổi thành *đến … và nhận được lợi dưỡng*. `13.2`: bỏ *xa xôi* (`paccantimesu` chỉ là vùng biên); `6.2`/`13.2`: *tự mình một mình* → *một mình* (`ekakova`, thừa chữ). `4.4`, `4.5`, `5.4`, `5.5`, `11.4`, `11.5`, `12.4`, `12.5`: *buộc tội* → *tố cáo* (tiền lệ duy nhất cùng công thức `an3.50:3.4`; Pāli `vakkhati`/`āha` chỉ là "nói điều gì", ngữ cảnh là lời tố cáo, nên chọn từ đã dùng ở bài song song).

  *Accuracy fix — mất liên hệ thuật ngữ.* `9.2`: `visamena kāyakammena` v.v. bị dịch *ác hạnh của thân/khẩu/ý*, làm mất mắt xích với `visama` ở `2.2`/`9.1` (*gập ghềnh*); đổi thành *nghiệp thân/khẩu/ý gập ghềnh* theo `an3.50:5.2`. `10.2`: *chấp trước vào tà kiến chấp thủ biên cực* là câu rối (lặp *tà kiến*, dùng *chấp thủ* lẫn với `upādāna`, `antaggāhikāya diṭṭhiyā` chỉ là "kiến chấp cực đoan"); đổi thành *có tà kiến, có kiến chấp cực đoan* (tầng: *kiến chấp cực đoan* 39 khoá của `ps1.2`, kèm `an3.50:6.2`, `an4.243:4.1`).

  *Terminology fix — theo đa số tầng.* Công thức `khataṁ upahataṁ attānaṁ pariharati, sāvajjo ca hoti sānuvajjo viññūnaṁ, bahuñca apuññaṁ pasavati` (`8.1`, `14.1`): *giữ gìn bản thân như người đã bị tổn hại, bị hủy hoại; đáng bị trách cứ và đáng bị phê phán bởi những người có trí, và tràn đầy nhiều nghiệp bất thiện* chỉ có 2 khoá (chính bài này); dạng đa số trong tầng là *tự giữ lấy mình như đã bị phá hoại, bị tổn hại* (14 khoá), *có tội và đáng khiển trách theo hàng người có trí* (12 khoá), *sinh ra nhiều bất thiện* (11 khoá, kèm 5 khoá *nhiều bất thiện*); đã đổi theo dạng đa số (đồng nhất với `an3.50:4.1`, `an4.4`). `mahācoro`: *kẻ trộm cướp lớn* chỉ có ở bài này, tầng dùng *đại trộm* 14 khoá (không có khoá nào dùng *trộm cướp lớn*); đổi mọi chỗ và đổi tên bài `0.3` thành *Kinh Đại Trộm* như `an3.50`. Công thức hỏi `Kathañca, bhikkhave, … hoti?`: *Và nào là …, này các tỳ-kheo?* chỉ có 7–9 khoá trong tầng, dạng đa số là *Và thế nào, này các tỳ-kheo, …?* (283 khoá); đã đổi cả 12 câu hỏi. `balavanissito`: *người có quyền thế* → *người có thế lực* (6 khoá cùng bài song song so với 3). `nissito`: *nương vào* → *dựa vào* theo `an3.50` (16/16 câu có `nissito hoti` ở bài đó); `gahana`: *che chắn* → *che kín* theo `an3.50`; `visama`: *địa hình gập ghềnh* → *vùng đất gập ghềnh*; `lābhī hoti`: *thọ lãnh* → *là người được* (9 khoá so với 2) và *khất thực* → *đồ ăn khất thực* (tiền lệ `mn113:8.1`, `an4.259:6.2`). `bhogacāgī`: *dâng của đút lót* → *đút lót bằng của cải* (không đổi nghĩa; bỏ *dâng* vì chủ thể là kẻ trộm đút lót cho quan, và ở 12.1 là tỳ-kheo dùng lợi dưỡng của mình).

  *Terminology fix — `paṭisantharati`.* *đền bù* (`5.4`, `5.5`, `12.4`, `12.5`) mâu thuẫn với chính tiêu đề `bhogacāgī` = *đút lót* của bài (đền bù hàm ý bồi thường cho người bị hại; ngữ cảnh là dùng của cải để dập lời tố cáo, Sujato: *settle it with a bribe*); đổi thành *dàn xếp*. Từ này chỉ có đúng một nơi dùng khác trong tầng (`dn31:17.2`, nghĩa khác, `paṭisantharavutti`), nên không thể đo tiền lệ; xem bất định.

  *Xưng hô nội tâm.* `6.4` dùng *ta* còn `4.4`, `5.4`, `11.4`, `12.4` dùng *tôi* trong cùng một kiểu lời nghĩ của kẻ trộm/tỳ-kheo ác; đổi cả năm về *ta* (đồng nhất trong bài, và khớp `an3.50:3.4`, `an3.50:7.4`).

  *Số lượng.* Pāli: `pañca` năm; liệt kê đủ năm ở `1.3` và `8.3` (`visamanissito`, `gahananissito`, `balavanissito`, `bhogacāgī`, `ekacārī`), mục giải thích đủ năm ở `2`–`6` và `9`–`13`; bản Việt cùng đủ năm ở mọi chỗ. Không có số lớn nào khác. Sau sửa: 57/57 khoá, thứ tự khoá bằng thứ tự Pāli, nháy đơn, nháy kép và dấu `…` khớp Pāli từng khoá (0 lệch), 0 khoá chứa chữ Pāli, NFC; Pāli trùng nguyên văn trong chính bài có 4 nhóm (`1.2`/`8.2`, `4.3`/`5.3`/`11.3`/`12.3`, `4.4`/`11.4`, `4.5`/`11.5`) và bản Việt giống nhau ở cả 4 (0 lệch). `1.1`/`7.1` và `8.1`/`14.1` có Pāli khác ở dấu phẩy và phần mở nên không tính là trùng.

  *Điểm đổi, vì sao.* Bản chấm 2026-09-13 là một bộ điểm chung cho nhiều bài, chưa có phân tích theo khoá. `semantic_fidelity` 9.4 → 9.1: có bốn chỗ thêm hoặc làm lệch nghĩa thật (`2.2` *sâu*, `3.2` *bóng cây*, `6.4` *sợ*, `13.3` mục đích) và một chỗ ghép sai thuật ngữ (`10.2`) đã sửa, nhưng còn các bất định bên dưới. `ambiguity_integrity` 9.2 → 9.0: bản trước không ghi một bất định nào dù bài có ít nhất ba chỗ chưa phân xử được (xem dưới). `technical_integrity` 10.0 → 9.6 vì văn bản đã đổi và các lệnh cổng chưa chạy lại (`npm run validate`, `npm test`, `npm run check`, `npm run build`). `terminology` giữ 9.3: những chỗ lệch tiền lệ đã sửa theo đa số, nhưng `rodha`, `paṭisantharati` và `ekāgārika` còn bất định. Các tiêu chí còn lại giữ nguyên: không có cải thiện tương ứng mới.

  **Bất định còn lại.** (1) `paṭisantharati` → *dàn xếp*: gần với *settle* của Sujato, nhưng PED đọc là phủ lên, xoa dịu; không có nơi thứ hai trong tầng để đo, giữ bất định giữa *dàn xếp*, *đền bù* và *làm dịu*. (2) `rodhaṁ` → *một góc khuất*: theo bài song song `an3.50:2.2` và Sujato (*blind spot*); các nơi khác trong tầng dùng `rodha` với nghĩa *chướng ngại*, không có căn cứ trong tầng để loại cách đọc *vật che chắn*. (3) `ekāgārikampi karoti` → *trộm cắp nơi nhà vắng* (cùng dạng ở `cnd23:28.6`, `mnd7:19.2`, `mnd7:56.3`, `mnd15:3.8`; các bài khác dùng dạng khác: `an3.50` *cướp bóc nơi vắng vẻ*, `mn13:14.1` *cướp bóc một nhà riêng lẻ*, `mn84:8.2` *cướp của nơi vắng*); nghĩa gốc "đột nhập một nhà riêng lẻ" khác với *nhà vắng*, nhưng đã thành tiền lệ ở nhiều bài nên không sửa riêng một bài. (4) `pariyodhāya atthaṁ bhaṇanti` → *bào chữa cho … trong vụ án*: giữ theo `an3.50:3.4` (4 khoá); `pariyodhāya` (bao vây, che chở) không có từ riêng.

  Coverage English: mẫu số là các khoá Pāli có nội dung (từ 40 ký tự, bỏ khối `:0`); Sujato có bản cho bài này; chỉ khoá `14.2` (Thứ ba.) bản Anh để trống. Không có lớp `english-project` cho bài này. Bản Việt hiện hành chỉ có dạng nguyên bài ở mục Tra cứu toàn văn, không phải tầng theo khoá. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này.
