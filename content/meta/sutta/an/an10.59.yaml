notes:
  - >-
    **Bài ngắn (10 segment) nhưng là bài khó nhất chương về hình thức**, và đây
    là chỗ tôi phải chọn, không thể theo tiền lệ.
  - >-
    **`Sacittavagga` → *Phẩm Tâm Mình*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *Your Own Mind*, và cả phẩm nói đúng một việc — soi lại
    **tâm mình** (`sacittapariyāyakusala`). Tên bài `Sacittasutta` → *Kinh Chăm
    Chính Tâm Mình*.
    **`Sacittavaggo paṭhamo` ở `an10.60:15.5` dịch là *Phẩm Tâm Mình, thứ
    nhất*** — đây là **số thứ tự của chính Bilara đánh số lại**, vì phẩm này rõ
    ràng là thứ sáu trong Bộ Mười (đúng như `6.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Pāli lặp `X paricitañca no cittaṁ bhavissati` MƯỜI LẦN.** Dịch đúng nghĩa
    ra mười lần *“tâm của chúng ta sẽ vững vàng…”* — khó đọc mà không thêm
    nghĩa. Tôi nói khung **một lần** rồi liệt kê: *“…tâm mà chiếm giữ; và sẽ
    vững vàng trong niệm tưởng vô thường, trong niệm tưởng vô ngã, …”*. Ghi lại
    vì đây là quyết định dạng, không phải lựa chọn từ.
    **Ba vế `taṁsaññāparicitañca` phải giữ đúng vị trí.** Pāli là `lokassa
    samañca visamañca ñatvā **taṁ**saññā…`, `… bhavañca vibhavañca ñatvā
    **taṁ**saññā…`, `… samudayañca atthaṅgamañca ñatvā **taṁ**saññā…` — tức *sau
    khi biết rõ thế giới …, tâm vững vàng trong **chính niệm tưởng ấy***. Vì vậy
    ba vế ấy có điều kiện của riêng mình, không phải niệm tưởng riêng.
  - >-
    **Lỗi do lượt review bắt được, ở cả `1.3` và `2.1`:** khung *“tâm … sẽ vững
    vàng”* của bản đầu được chèn vào **giữa** câu, ra *“tâm của chúng ta sẽ vững
    vàng **sau khi biết rõ thế giới công bằng**…”* — vế “biết rõ thế giới công
    bằng” trở thành vế bổ nghĩa của *vững vàng* thay vì là điều kiện đứng trước
    nó. Sai nghĩa, không phải sai chữ.
    `lokassa samañca visamañca` → *thế giới công bằng và thế giới bất công*,
    `bhavañca vibhavañca` → *thế giới có và không có*, `samudayañca
    atthaṅgamañca` → *thế giới sinh và diệt* — cả ba 0 tiền lệ, đặt mới.
    `yathāpabbajjāparicitañca cittaṁ` → *tâm vững vàng như lúc xuất gia* (0 tiền
    lệ); `dvinnaṁ phalānaṁ aññataraṁ phalaṁ` → *một trong hai quả báo* (0 tiền
    lệ).
    **`aññā` ở `2.2` là *biết rõ*, không phải *chứng ngộ*** — bản đầu tôi dịch
    *“chứng ngộ ngay trong hiện tại”*, đã sửa thành *“biết rõ ngay trong hiện
    tại”*.
