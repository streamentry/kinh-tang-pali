notes: |-
  Dịch từ Pāli root; English Bhikkhu Sujato tại commit bilara đã ghim chỉ để đối chiếu. Không có bản Việt hiện hành (tại commit đã ghim `translation/vi/phantuananh/` chỉ có 26 chương Pháp Cú), nên không có tầng Việt truyền thống để so.

  BÀI NÀY LÀ TRÍCH ĐOẠN NGUYÊN VĂN CỦA DN 33, VÀ ĐÃ DÙNG LẠI BẢN DỊCH ĐÃ CÓ. Đo bằng script `_c80_dup.py` (khớp Pāli sau khi chuẩn hoá, chế độ bỏ dấu câu) trên 5.271 bài Việt đã có: 30/49 khoá của an6.13 trùng Pāli với `dn33:2.2.69–2.2.111`, và **36 khoá dùng lại NGUYÊN VĂN bản Việt của dn33** (đã kiểm lại bằng cách so từng chuỗi, không phải bằng mắt). Đây là chính sách bắt buộc: nếu dịch lại, bài này sẽ tự mâu thuẫn với DN 33 đã publish — cùng một câu Pāli mà hai bài ghi khác nhau.

  Coverage Anh, đo lại bằng đúng công thức của `src/lib/canon/reference.ts`: substantive = 43, không Anh = 8, ratio = **0,8140** ≥ ngưỡng 0,8 → đạt cổng. Tám lỗ hổng là `:2.5 :2.6 :3.5 :3.6 :4.5 :4.6 :5.5 :5.6` — đúng những đoạn Sujato lặp nguyên công thức rồi bỏ trống; cả tám đều có bản Việt dn33 đã publish để đối chiếu.

  Tên phẩm, có số đếm. `0.1` → *Aṅguttara Nikāya 6.13*: đo riêng trong AN6 cho 90/103 tệp (an6.9/6.11/6.12/6.14/6.18/6.20 đều viết vậy), dù toàn bộ AN thì *Kinh Tăng Chi Bộ* thắng 802/334 — theo luật đa số trong chính tác phẩm đang làm. `0.2` `Sāraṇīyavagga` → *2. Phẩm Hòa Kính* (5/5: an6.11, 6.12, 6.14, 6.18, 6.20). `0.3` `Nissāraṇīyasutta` → *Kinh Thoát Ly* (an5.200:0.3, cùng tên sutta). `7.2` `Tatiyaṁ` → *Thứ ba.* (an5.13:1.5, an6.33:2.7).

  Thuật ngữ, có số đếm. `nissāraṇīyā dhātuyo` → *giới thoát ly* (dn33:2.2.69 "Sáu giới thoát ly"; an5.200:1.1 "năm giới thoát ly"). `cetovimutti` → *tâm giải thoát* (171 lần trong tầng Việt). `mettā`/`karuṇā`/`muditā`/`upekkhā` → *lòng từ*/*lòng bi*/*lòng hỷ*/*lòng xả* — giữ nguyên của dn33, không tự đổi. `byāpāda` → *sân hận* (511) · `vihesā` → *sự hại* · `arati` → *sự không vui* (41) · `rāga` → *tham ái* · `nimitta` → *tướng* · `asmīti` → *mạn "ta là"* · `vicikicchākathaṅkathāsalla` → *mũi tên nghi hoặc lưỡng lự*.

  BẤT ĐỊNH ĐÃ GHI. (a) `:6.2` và `:6.5` — bản AN có thêm tiểu từ `ca` (`ayamahamasmīti ca`, `ayamahamasmīti ca na samanupassato`) mà dn33 không có, nên phải thêm chữ "và"; đây là hai khoá **không** dùng lại nguyên văn dn33, và là khác biệt có chủ đích chứ không phải trượt tay. (b) `:6.7` `asmīti mānasamugghāta` dịch theo sát dn33:2.2.111 `asmimānasamugghāta` → *sự trừ tận mạn "ta là"*; riêng `mānasamugghāta` trong an9.1:14.4 được dịch *nhổ tận gốc ngã mạn* — cùng nghĩa nhưng khuôn khác nhau, và ở đây ưu tiên khuôn của bài song song. (c) Dấu câu ở các khoá `:1.4 :1.7 :2.2 :2.5 :3.2 :3.5 :4.2 :4.5 :5.2 :5.5` đổi dấu chấm cuối của dn33 cho hợp với `;` của Pāli bản AN; chữ không đổi.

  Cặp nháy kép: Pāli mở `“` ở `:1.1` và đóng `”` ở `:7.1`; các cặp `“ta là”`, `“ta này là ta”` trong `:6.2 :6.5 :6.7` tự cân. Cơ chốt `_hvi.py` chạy sạch: 49 khoá, đủ khoá có nội dung, NFC, không trùng nguyên văn Pāli, không lọt Pāli, số dấu lược khớp, nháy kép cân.