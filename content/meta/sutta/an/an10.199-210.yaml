notes:
  - >-
    `an3.117:1.5` và `5.2` liệt kê **đúng hai danh sách mười điều kiện của bài
    này** và đã được dịch: sát sinh · trộm cắp · tà dâm · nói dối · nói hai lưỡi
    · nói ác khẩu · nói phù phiếm, và chiều tích cực là "kiêng tránh …". Dùng
    lại nguyên văn, không phát minh.
  - >-
    **Section `3.1`–`3.20` và `4.x` là cùng Pāli với `an10.156-166:1.1`–`2.5`**
    (danh sách mười vị người), nên dùng lại nguyên văn. Khác một chỗ: Pāli ở đây
    là `gāravo hoti` chứ không phải `sagāravo hoti`; vẫn dịch "có tôn kính" vì
    tiếng Việt không phân biệt vị trí của tiền tố `s-`.
  - >-
    `pāsaṁso` → "đáng được khen ngợi" (không phải "thiếu sót") — 31 segment ở
    `dn29`. `paṭivirato` → "kiêng tránh" (430 lần, `an3.117:5.2`).
    `abhijjhālu`/`byāpannacitto` → "tham lam"/"sân hận" (`an3.117:2.2`,
    `an10.101:2.2`).
  - >-
    **`Aparapuggalavagga` → "Phẩm Chúng Sinh Không Dẫn Đi" — chưa có tiền lệ
    trong corpus.** `para` là *dẫn đi* (sang thế giới sau), `apara` là *không
    dẫn đi được*. Vì không có tiền lệ, ghi kèm lý do để người sau kiểm chứng.
    Tên bài đặt theo `Bhajitabbādisutta` ở `an10.156-166` ("Kinh Đáng Kết Bạn Và
    Các Điều Khác").
  - >-
    `Catuttho paṇṇāsako samatto` → "Phần năm mươi kinh thứ tư hoàn tất." theo 9
    lần dùng trong corpus. Dấu lược `…pe…` bỏ chữ tắt `pe`, giữ `…` — nghi thức
    của 1.850 segment.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
