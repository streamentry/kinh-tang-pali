notes: |-
  113 khoá, đủ mọi khoá của Pāli (113/113), thứ tự khoá đúng Pāli, không khoá ngoài tập. Bài có khung lồng: Tôn giả Uttara nói với các tỳ-kheo (1.3–1.6), Đại Thiên Vương Vessavaṇa nghe và báo Sakka (2–3), Sakka đến hỏi Tôn giả Uttara (4–5), ví dụ đống ngũ cốc (6), rồi Sakka thuật lại lời Đức Phật về Devadatta (7.5–12.10) và thỉnh Tôn giả Uttara học bài pháp (13). Dấu lược giữ đúng MỘT `…` ở mọi khoá có `…pe…` hoặc `…` trần của Pāli (cân dấu lược 113/113 khoá khớp Pāli); không khoá nào có `(…)`.
  Dấu nháy: đã đối chiếu từng khoá, 113 khoá, 0 lệch cặp “ ” ‘ ’ so với Pāli. Lồng nháy theo Pāli: 1.3–1.6 và 2.3–2.6 mỗi nhóm mở “ đóng ”; 3.3 mở “, 3.5 mở ‘, 3.8 đóng ’”; 5.1 mở “, 5.2 mở ‘, 5.5 đóng ’”; 5.8 mở “ và 6.5 đóng ” (6.5 có ‘ ’ bên trong); 6.6 mở “‘ đóng ’ rồi ”; 6.7 mở “ và 6.8 đóng ”; 7.1 mở “, 7.3 mở ‘ và 7.4 đóng ’, 8.1 mở ‘ cho tới 12.10 đóng ’, bên trong có 12.2 mở “ và 12.9 đóng ”, và 13.7 đóng ” của 7.1. Riêng khoá 5.9 trong Pāli có dấu ’ chỉ là dấu lược âm của `m’idhekacce`, không phải nháy; bản Việt không có nháy ở khoá đó (khớp cách xử lý của `dn23:13.2`).
  Số lượng: `aṭṭhahi` (8.5, 8.6, 8.15) là tám; danh sách đếm đủ tám mục (lợi dưỡng, mất lợi dưỡng, danh tiếng, mất danh tiếng, sự tôn kính, sự không được tôn kính, ác dục, bạn xấu). `catasso parisā` là bốn hội chúng, liệt kê đủ bốn (tỳ-kheo, tỳ-kheo-ni, nam cư sĩ, nữ cư sĩ). `tāvatiṁsa` là cõi Ba Mươi Ba theo tiền lệ. Không có số lớn nào khác.
  Dùng lại nguyên văn tầng đã publish: khoá 2.1 theo `an7.53:2.1` (Pāli trùng nguyên văn); các khoá 8.5, 8.7–8.15, 9.2–9.8, 10.2–10.8, 11.1–11.8, 11.10–11.16, 12.3–12.8 theo `an8.7` (cùng công thức Devadatta và cùng chuỗi tám mục); 5.9 theo `dn23:13.2`; 12.1 theo `an8.7:6.1`; 13.8 theo công thức "Thứ tám". Đã dò 51 khoá có Pāli trùng nguyên văn với phần còn lại của tầng (518 cặp); 50/51 khoá dùng lại đúng một bản đã có; khoá duy nhất khác là 7.1 (`Acchariyaṁ, bhante, abbhutaṁ bhante`), vì `sn51.14:4.3` nói với Đức Thế Tôn nên là "Bạch Thế Tôn", còn ở đây người nghe là Tôn giả Uttara. Trong 518 cặp, 48 cặp bản đã có khác bản này, hầu hết ở công thức mở và kết ngắn như `Katamehi aṭṭhahi?` (19 khoá "Với tám nào?", 3 khoá "Tám pháp nào?"; tôi theo đa số) và `Tasmātiha…evaṁ sikkhitabbaṁ` (theo dạng của `an8.7`). Pāli trùng nguyên văn trong chính bài: 12 nhóm, 0 nhóm mà bản Việt khác nhau.
  Thuật ngữ, chọn sau khi đếm tầng: `vipatti` → thất nghiệp (37 khoá trong 70 khoá có `vipatti`, theo `an8.7`); tôi giữ theo quy ước tầng dù người đọc hiện đại dễ hiểu nhầm là việc làm, nghĩa trong kinh là sự hư hoại, sút kém (Sujato dịch Failings). `sampatti` → thành tựu. `lābha` → lợi dưỡng, `sakkāra` → tôn kính, `pāpicchatā` → ác dục, `pāpamittatā` → bạn xấu, `asaddhamma` → phi Chánh Pháp: theo đúng `an8.7` để cùng công thức không lệch giữa hai bài kế nhau. `kālena kālaṁ` → thỉnh thoảng. `sādhāvuso` → "Tốt đẹp, này các hiền giả" (cùng lối với `sādhu, bhikkhave` → "Tốt đẹp, này các tỳ-kheo" của `an8.7`; tầng dịch `Sādhāvuso` đứng một mình thành "Lành thay" ở 22/26 khoá nhưng đó là lời tán đồng, không phải câu có vị ngữ như ở đây); `āvuso` → hiền giả (3215 khoá). `sakko devānamindo` → Sakka, vua chư thiên (50/100 khoá trong tầng; "Thiên chủ" dùng chủ yếu cho xưng hô); xưng hô `devānaminda` → "này vua chư thiên" (Vua chư thiên 49 khoá, Thiên chủ 20 khoá trong 71). `vessavaṇo mahārājā` → Đại Thiên Vương Vessavaṇa (theo `dn32`, `an7.53`). `bhante` nói với vị tỳ-kheo → "thưa tôn giả" (448 khoá so với 150 khoá "Thưa Tôn giả"); `āyasmā` đi liền tên → "Tôn giả Uttara". `mahājanakāya` → đám đông (27/46 khoá), `dhañña` → ngũ cốc (29 trong 123 khoá; lúa 22, gạo 19), `nigama` → thị trấn (10/10), `ucchaṅga` → vạt áo (`mn54:21.8`), `piṭaka` → giỏ (`mn127:12.3`), `kāja` → đòn gánh (`mn81:18.13`), `añjali` → vốc tay. `dhammapariyāya` → bài pháp trình bày, theo đúng ba câu `Uggaṇhāhi…Pariyāpuṇāhi…Dhārehi` ở `sn12.45:6.6–6.9` và `sn35.113:3.6–3.9` (trên toàn tầng "bài pháp" 19 khoá, "pháp môn" 16 khoá, nên đây là chỗ hai dạng gần ngang nhau). `ādibrahmacariyaka` → căn bản của đời phạm hạnh (theo `mn63`, `sn56.31`, `mn133`; hai khoá `sn12.45:6.9`, `sn35.113:3.9` dịch là khởi đầu Phạm hạnh, tôi không theo đó vì "căn bản" là dạng đa số). `Yāva subhāsitañcidaṁ` → "đã khéo nói điều này biết bao" (theo `mn80:14.3`). Cụm "duỗi cánh tay đang co hay co cánh tay đang duỗi" theo thứ tự Pāli như `dn14`, `dn17` (một số khoá khác của tầng đảo thứ tự, cùng nghĩa). Tên kinh dịch "Kinh Uttara Về Sự Thất Nghiệp"; không dùng "Kinh Sự Thất Nghiệp Của Uttara" vì dễ hiểu nhầm Tôn giả Uttara là người thất nghiệp, trong khi kinh nói về điều Tôn giả giảng.
  Bất định, không đưa vào thân kinh: (1) `abhibhuyya abhibhuyya vihareyya` giữ lặp "chế ngự đi chế ngự lại" như `an8.7`, không thêm nghĩa lặp hay liên tục. (2) `Nāyaṁ dhammapariyāyo kismiñci upaṭṭhito` (13.3): `kismiñci` là vị trí cách trung tính hoặc nam tính nên có thể hiểu là "nơi bất cứ ai" hoặc "ở bất cứ chỗ nào"; bản Việt hiểu theo ngữ cảnh liền trước (bốn hội chúng), theo cả Sujato lẫn Hòa thượng Thích Minh Châu; `upaṭṭhito` dịch là được thiết lập. Câu 13.1 `Ettāvatā…manussesu catasso parisā` hiểu là "cho đến nay, trong loài người có bốn hội chúng". (3) `sakaṁ paṭibhānaṁ` (5.7): dịch "điều tự mình nhận thấy" theo `dn1:1.34.2` (`sayaṁ paṭibhānaṁ`); Sujato "own inspiration", Hòa thượng Thích Minh Châu "tự nói"; chưa có tiền lệ chính xác trong tầng. (4) `upādāyupādāya` (6.8, 7.4): dịch "nương vào đó hết lần này đến lần khác"; tiền lệ trong tầng có nghĩa "liên tục" ở `mn12:62.9` và "so sánh từng bậc" ở `mil5.3.9:5.1`; Sujato "rely completely", Hòa thượng Thích Minh Châu "dựa trên lời ấy, dựa lên trên ấy"; `mayaṁ` dịch "chúng tôi" vì Tôn giả Uttara nói gồm cả mình và người khác. (5) `yagghe, mārisa, jāneyyāsi` (3.3): dịch "Thưa ngài, xin ngài biết cho" theo `sn35.132:8.2`, `mn82:41.10`; `mārisa` là lời xưng hô của Vessavaṇa với Sakka. (6) Địa danh: Pāli là `mahisavatthusmiṁ saṅkheyyake pabbate vaṭajālikāyaṁ`; Sujato và Hòa thượng Thích Minh Châu viết Dhavajālikā (đọc khác); bản Việt theo Pāli ghim, `Vaṭajālikā`, và giữ nguyên `Mahisavatthu` như tên riêng (Sujato: vùng Mahisa). (7) Hòa thượng Thích Minh Châu viết câu mở bài là Thế Tôn trú ở Mahisavatthu, nhưng Pāli ghim nói `āyasmā uttaro` ở đó; bản Việt theo Pāli.
  Coverage English: mẫu số 61 khoá Pāli có nội dung (từ 40 ký tự, bỏ khối :0); Sujato phủ 52/61 (85,2%, trên ngưỡng 0,8); chín khoá Sujato bỏ trống là 2.3, 2.4, 2.5, 2.6 (lặp lời 1.3–1.6), 10.8, 11.2, 11.8, 11.16 (các mục lược của chuỗi tám) và 13.3. Pāli tự đứng vững ở những khoá ấy và được đối chiếu với `an8.7`. Không có lớp `english-project` cho bài này. Bản Việt hiện hành (Hòa thượng Thích Minh Châu) chỉ có dạng nguyên văn ở mục Tra cứu toàn văn, không có theo từng khoá; đã đọc để đối chiếu thuật ngữ (lợi dưỡng, chinh phục, pháp môn) nhưng không coi là tầng căn theo khoá.
