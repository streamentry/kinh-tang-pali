notes: |-
  Chấm điểm, không dịch. Pāli :1.3 dùng …pe… giữa công thức, bản Việt mở rộng theo công thức đủ ở an5.181 với dấu … đánh dấu chỗ lược, cùng cách Sujato làm.
  Tầng Anh Sujato phủ :1.1 tới :1.4 dạng rút gọn, trống :1.5 là thứ tự Dutiyaṁ. Tầng Việt Thích Minh Châu vắng với AN ở commit đã ghim nên chỗ khó do Pāli quyết.
  Ghi nhận cho coordinator: khi mở rộng, động cơ thứ tư rớt cụm và đệ tử Phật so với bản đủ ở an5.181 và an5.190; paṁsukūla dịch thành y ráo, khác chuẩn y phấn tảo của MN và KN nhưng nhất quán trong batch AN với an5.80 và an5.162; idamatthatā thành tánh không cầu ngoại duyên là cách diễn giải mới, 0 tiền lệ trong kho.
  Cổng kỹ thuật do coordinator chạy: npm run validate, npm test, npm run check, npm run build.

  Coordinator (gather): bổ sung «và đệ tử Phật» theo Pāli cùng công thức an5.181:1.3 (vaṇṇitaṁ buddhehi buddhasāvakehī); bản ghim Sujato cũng rớt cụm này.
  Sửa 2026-10-18 theo đối chiếu khoá trùng Pāli: 1.3 (phần mở rộng …pe… theo công thức an5.181:1.3) icchāpakato «có bản tính mong muốn» → «bị ham muốn chi phối», đồng bộ với sửa cùng ngày ở an5.181:1.3 và an5.190:1.3 (nghĩa từ sai: pakata là quá khứ phân từ, không phải pakati «bản tính»; DPD icchāpakata «who is afflicted with desire», chú giải AN «tāya eva icchāya abhibhūto hutvā»).
