notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá :2.1 — bỏ cụm “xứng đáng được chắp tay lễ kính” do dịch tràn vào phần bị `…pe…` che (Pāli chỉ còn `āhuneyyo hoti …pe… anuttaraṁ puññakkhettaṁ lokassa`), về đúng một dấu lược như :7.1 và an4.112:2.1, an4.114:6.1; khoá :4.2 — thêm “vị ấy có” trước “sức mạnh” (`thāmavā` là tính từ, câu cũ cụt động từ). Giữ nguyên các khoá :3.1 :3.3 :4.1 :4.3 :5.1 :5.3 (“Và thế nào … đẹp đẽ / khoẻ mạnh / nhanh nhẹn”): bản số đông an3.96–98 bỏ chữ “Và” của `Kathañca` và dùng “đầy đủ dung sắc / sức mạnh / tốc độ” theo khuôn của bài khác, còn tầng có 8 chỗ dùng “đẹp đẽ” cho `vaṇṇasampanno` và khớp :1.3 :2.3 :6.1 của chính bài.
