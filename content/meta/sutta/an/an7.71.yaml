notes: |-
  TẦNG THAM KHẢO CÓ. NHÓM `an`/`sn` CÓ TẦNG ANH. Coverage đo theo đúng công thức src/lib/canon/reference.ts, ngưỡng đọc từ source/layers.yaml (substantivePaliMinChars=40, excludeReferenceBlock=true, floor=0.8): 32 khoá Pāli có nội dung, 0 khoá không tầng Anh nào có chữ, tức 100%. Tệp Anh đã ghim có mặt trong source/upstream-manifest.json (tầng english-sujato, 4.291 tệp), nên đây là not-published-upstream=false: bài CÓ tầng tham khảo. Lớp lấp english-project của dự án không có cho uid này, nhưng không cần vì Sujato đã phủ hết. Tầng vietnamese-current vắng: tại commit đã ghim thư mục đó chỉ có 26 tệp, toàn bộ là Pháp Cú.

    DÙNG LẠI NGUYÊN VĂN — 13 khoá. 0.2 Mahāvagga = 7. Phẩm Lớn (16/16 khoá trùng nguyên
    văn), 0.3 Bhāvanāsutta = Kinh Sự Tu Tập (sn47.39:0.3), 1.4/2.6/2.11/3.4/4.6/4.11
    Taṁ kissa hetu? = Vì sao vậy? (đa số riêng của bộ an là 65/95), 2.1 và 4.1
    (trùng mn16:27.2 từng chữ), 4.3 (trùng mn16:27.4), 4.5 (trùng mn53:19.4),
    6.3 Sattamaṁ = Thứ bảy. (251/255).

    `Seyyathāpi` TÔI ĐỔI THEO ĐA SỐ. Nháp đầu tôi viết Tương tự vậy; đếm trong bộ `an` thì
    Như thể 23 lần, Ví như 7, Tương tự vậy 4 (và 4 lần đó chính là bản nháp của tôi), nên
    5.1 và 6.1 đã sửa thành Như thể. Riêng 2.1 và 4.1 tôi vẫn giữ nguyên văn đã có của
    mn16:27.2 là Ví như một con gà mái có tám, mười hay mười hai quả trứng, vì Pāli hai khoá
    đó trùng mn16 từng chữ và BRIEF_VI3 §6 bắt dùng lại nguyên văn; khác với Như thể ở
    5.1/6.1 là có chủ ý, ghi để biên tập biết đây là lựa chọn chứ không phải trôi dạt.

    THÍ DỤ THUYỀN. 6.1 Pāli gần trùng sn45.158:1.1 (cùng chiếc thuyền đi biển, sáu tháng
    trong nước, mùa đông kéo lên bờ khô, mây đổ mưa), nên tôi lấy nguyên văn của bài đó cho
    dây chằng và những đám mây mùa hè. NHƯNG phải giữ khác biệt: Pāli ở 6.1 là
    `parihāyanti` (mục rữa, thối rữa) còn ở 6.2 là `paṭippassambhanti` (đứt đoạn, thối rữa)
    — cùng hai từ với sn45.158:1.2. Tôi dịch 6.1 là mục rữa và thối rữa, 6.2 là đứt đoạn và
    thối rữa. Đừng ai đồng bộ hai chỗ đó là sai nghĩa.

    DANH SÁCH BẢY MỤC Ở 1.7 / 2.14 / 3.7 / 4.14: KHÔNG có Pāli trùng nguyên văn ở bài nào
    khác (đã tra cả tầng). Mẫu gần nhất là ud5.5 (bốn niệm xứ, bốn chánh cần, bốn thần túc,
    năm căn, năm lực, bảy giác chi, Thánh đạo tám chi phần), nhưng đếm cả tầng thì bốn
    niệm xứ 181 so với bốn tứ niệm xứ 3; năm sức mạnh 57 so với năm lực 35; tám chi phần 31
    so với bát đạo phần 2. Tôi theo đa số từng mục, nên dòng này lệch đúng một chữ so với
    ud5.5 (năm sức mạnh thay cho năm lực). Ghi ra đây. `bojjhaṅga` = giác chi theo glossary.

    `bhāvanā ananuyutta / anuyutta`: glossary có `anuyoga` = theo đuổi (177 lần) nhưng
    `anuyutta` trong tầng đang là chuyên cần (268 lần). Hai mục glossary kéo theo hai hướng
    cho đúng cặp này, nên tôi theo đa số đo được của dạng tính từ: không chuyên cần tu tập /
    chuyên cần tu tập.

    DẤU LƯỢC. Cả bài chỉ có một dấu lược, ở 4.14; Pāli 4.14 là
    `Catunnaṁ satipaṭṭhānānaṁ …pe… ariyassa aṭṭhaṅgikassa maggassa`, tôi giữ đúng MỘT …
    và không mở rộng — bốn mục bị lược đã nêu đủ ở 3.7 ngay trước đó. Ngoặc kép bám đúng
    Pāli: một cặp kép mở ở 1.1 và đóng ở 6.2, mười bốn cặp nháy đơn.

    LỖI BẮT ĐƯỢC Ở LƯỢT REVIEW ĐỐI KHÁNG. (1) 5.1 vế chính tôi đảo trật tự (viết thấy
    dấu ngón tay trên cán cần cuốc, đúng ra vế chủ ngữ đứng trước), đã sửa thành thấy ngay
    những dấu ngón tay và dấu ngón cái trên cán cần cuốc. (2) Nháp đầu dùng dây thằng và
    đám mây đầu mùa; đã sửa theo sn45.158 thành dây chằng và đám mây mùa hè.

    BẤT ĐỊNH CÒN MỞ. 5.1 `vāsijaṭe` (Pāli viết với nguyên âm ā, còn thường là vassijaṭe)
    là cán cần cuốc; `phalagaṇḍa` là cái rìu của thợ đẽo, `phalagaṇḍantevāsika` là thợ phụ.
    Cả ba từ này có 0 tiền lệ trong kho. Bản Anh đã ghim dịch là adze và mason, nên cụm
    cán cần cuốc và thợ đẽo là lựa chọn của tôi, ghi ở đây.

    CỔNG KỸ THUẬT. Đợt này tôi bị cấm chạy npm run validate / test / check / build, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Những gì tôi tự kiểm được và đều sạch: JSON hợp lệ; đúng 49/50 khoá mỗi bài và tập khoá khớp tuyệt đối với all trong vc/c83.json; không orphan; không rỗng; không còn stub dạng (…); toàn bộ NFC; số dấu lược không bao giờ vượt Pāli và mỗi …pe… của Pāli còn đúng một dấu …; ngoặc kép cân trên cả bài; không có Pāli nào mà hai bài trong lát dịch khác nhau; và save_vi chạy lại cho ra đúng byte cũ (idempotent). Bốn lệnh cổng để coordinator chạy sau khi gộp lát.
