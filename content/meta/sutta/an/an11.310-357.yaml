notes: |-
  **Bài chỉ là một mục lục sáu chủ đề**, không có lời thoại: `:1.1` là dấu lược đứng một mình mở danh sách, `:1.2`–`:1.7` là sáu cụm `…sañcetanāya…`. Tôi không mở rộng `:1.1` (BRIEF_VI3 §10.1) và không ghi ngoặc kép nào, vì Pāli không có và người đọc sẽ không phân biệt được đâu là lời nguồn.

  **Thuật ngữ, đếm được.** `sañcetana` → *tập hợp* — **tiền lệ chính xác và rất dày**: `sn18.7:1.3`–`1.9`, `sn26.7:1.2`–`1.6`, `sn27.7:1.2`–`1.7` đã dịch cùng sáu cụm `rūpa/sadda/gandha/rasa/phoṭṭhabba/dhamma-saṅcetanāya` thành *tập hợp về sắc · âm thanh · mùi · vị · … · các pháp*. `Sañcetanāsutta` → *Kinh Tập Hợp* (`sn27.7:0.3`, `sn26.7:0.3`, `sn18.7:0.3`, `sn25.7:0.3`). Riêng `phoṭṭhabba` có hai cách trên đĩa (*sắp xúc* ở `sn18.7:1.8`, *những thứ đi chạm được* ở `sn27.7:1.6`, 2:2); tôi theo *sắp xúc* vì `sn18.7` có **đủ cả sáu** mục nên nội bộ nhất quán. `Sāmaññavagga` → *Phẩm Sa-môn* (1 tiền lệ đúng khoá: `an11.502-981:0.3`). `Paṭhamapaṇṇāsaka` → *1. Paṭhamapaṇṇāsaka* (theo `an11.992-1151:0.2`; `an11.982:0.2` lại viết *Nhóm Năm Mươi Đầu* và `an11.502-981:0.2` viết *Bộ Mười Một Bài Kinh Đầu Tiên* — **ba cách cho một khoá Pāli**, tôi theo cách giữ nguyên danh; xin biên tập thống nhất, không phải việc của lát này).

  **Bất định đã ghi, chưa phân xử được.** (1) `saṅcetanāya` là cách ngữ sở hữu đích (*-āya*, *for the sake of*), mà chuỗi tiền lệ đều bỏ; tôi bỏ theo cho khớp, nhưng nghĩa *vì / nhằm cho* không hiện ra — ghi ra đây thay vì thêm vào thân kinh. (2) `Aṅguttara Nikāya 11.310–357` ở `:0.1` thêm khoảng 310–357 so với Pāli (`Aṅguttara Nikāya 11`); làm vậy là theo tiền lệ `an11.502-981` và `an11.992-1151`, cùng dạng uid-gộp. Toàn tầng an thì quy ước này chưa thống nhất (75 tệp viết *Kinh Tăng Chi Bộ N*, 299 tệp viết *Aṅguttara Nikāya N.N–M*), nhưng trong chính an11 thì cả hai bản anh em đều viết khoảng.**Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm — ở lát này chỉ 0/155 khoá Pāli đủ 40 ký tự, nên chốt tự kiểm 0% và assertion còn lại không tự chạy; phần tôi tự kiểm: 11/n khoá có mặt và không thừa khoá, đúng segment ID, mọi chuỗi NFC, không khoá rỗng, không khoá nội dung nào trùng nguyên văn Pāli, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài và không bao giờ âm, không còn `(…)`, không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (lát này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Theragāthā 1.N Aṅguttara Nikāya 11 không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.
