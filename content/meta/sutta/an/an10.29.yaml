notes: |-
  **Đã đọc toàn bộ Pāli 124 khoá trước khi viết** và sau khi ghi in lại từng cặp Pāli↔Việt đọc đối kháng. Bài thuộc phẩm `Mahāvagga`, tiêu đề Pāli `Paṭhamakosalasutta`; bài kế (`an10.30`) đã dịch tiêu đề `Dutiyakosalasutta` là *Kinh Vua Kosala Thứ Hai*, nên bài này là *Kinh Vua Kosala Thứ Nhất* (tầng có cả *Thứ Nhất*, *(1)* và *(Một)* cho các bài `Paṭhama…`; theo bài kế cùng cặp). Nội dung: vua Pasenadi, Đại Phạm thiên, chư thiên Quang Âm, mười biến xứ, tám thắng xứ, bốn thực hành, bốn tưởng, kiến chấp ngoại đạo, thanh tịnh tối thượng và Niết-bàn tối thượng ngay trong hiện tại — mỗi mục cùng điệp khúc *tối thượng … cũng có thay đổi, có biến chuyển … chán nản … ly tham*.

  **COVERAGE ENGLISH, ĐO THẬT.** Mẫu số = Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = **87** khoá. Bản Anh Sujato đã ghim phủ **87/87 = 1,0000** (không khoá nào để trống), trên ngưỡng 0,80 của `source/layers.yaml`; đây là đối chiếu English **độc lập**. Bài này **không có** lớp `english-project` (không có tệp của bài trong tầng lấp) nên không có chỗ nào cổng được nâng nhờ lớp lấp. Tầng `vietnamese-current` tại commit đã ghim chỉ có Pháp Cú nên vắng; bản Việt truyền thống (Hòa thượng Thích Minh Châu) được đọc nguyên bài ở mục *Tra cứu toàn văn* và dùng để đối chiếu thuật ngữ, không là tầng store. Không có entry `reference-gaps.yaml` cần cho bài này (coverage 1,0).

  **Đối chiếu Việt truyền thống (nguyên bài).** Bản Hòa thượng Thích Minh Châu gộp mỗi mục thành một đoạn dài, bỏ lặp công thức. Chỗ phân kỳ có chủ ý: `aggamakkhāyati` *được gọi là tối thượng* (Hòa thượng *được xem là tối thượng*); `nibbindati` *chán nản* (Hòa thượng *nhàm chán*); `kasiṇāyatana` *biến xứ* (Hòa thượng *Thiền án xứ*); `abhibhuyya` *chế ngự* (Hòa thượng *nhiếp thắng*); `abhiññā` trong `dandhābhiññā` *tuệ* (Hòa thượng *thắng tri*); `mahaggata` *cái cao cả* (Hòa thượng *đại hành*); `paramatthavisuddhi` *sự thanh tịnh về mục đích tối thượng* (Hòa thượng *thanh tịnh là mục đích tối thắng*, Sujato *ultimate purity of the spirit*).

  **TIỀN LỆ, ĐẾM TỪNG CỤM.**
  · Dò **37** khoá Pāli của bài có Pāli trùng nguyên văn ở tầng đã dịch (tổng **481** cặp), **72** cặp Việt khác bản này, **409** cặp giống. **11** khoá lấy nguyên văn bản Việt có sẵn: `0.2` *3. Phẩm Lớn* (7/7), `6.5` `7.3` `8.3` `9.3` `10.5` `11.5` `12.5` `13.5` *Đây là thắng xứ thứ N.* (5/5 mỗi khoá), `15.3` *Thực hành khổ với tuệ chậm chạp,* (6/6, `an4.163` `an4.166` …), `21.3` lấy nguyên `mn22:37.1` (1 khoá trùng).
  · Các khoá trùng nhưng cố ý khác: `4.3`–`4.12` theo `mn77:24.2`–`24.11` (cùng cách *Một vị nhận biết biến xứ …*; chỉ đổi dấu cuối khoá theo Pāli: `;` ở `4.3`, `…` ở `4.4`–`4.11`, `.` ở `4.12`); `10.1`–`13.4` theo `mn77:23.14`–`23.32` (cách *xanh, có màu xanh, hiện ra xanh, tỏa sắc xanh*, hoa/vải/sao mai), đổi `.` thành `;` ở khoá nào Pāli kết `;`. Cùng Pāli ở `dn16` `dn33` `dn34` Việt viết *màu xanh, sắc xanh, hiện ra xanh, chiếu sáng xanh* và *tấm vải làm ở Bārāṇasī được là cả hai mặt*: đo **3** tệp `dn` so với **1** tệp `mn77` (và `an8.65`, cũng khác); chọn dạng `mn77` vì *được làm nhẵn cả hai mặt* sát `ubhatobhāgavimaṭṭhaṁ` hơn *được là cả hai mặt*, và đo `paritta` toàn tầng: *nhỏ* 56, *hữu hạn* 28, *nhỏ hẹp* 7; chọn *hữu hạn* vì đối cực với *vô lượng* (`appamāṇa`) trong cùng khối.
  · `Katamā catasso?` (`15.2` `17.2`): **29** khoá trùng, *Thế nào là bốn?* **27**, *Bốn cách nào?* 1, *Là bốn nào?* 1. `Katamāni dasa?` (`4.2`): 12 khoá trùng, bốn dạng (*Thế nào là mười?* 2, *Mười sức mạnh nào?* 2, …) — theo dạng *Thế nào là N?* cho cả `4.2` `6.2` (`Katamāni aṭṭha?` *Thế nào là tám?* 5, *Là tám nào?* 4) và `15.2` `17.2`. `an10.25` (cùng phẩm) viết *Là mười nào?*; không khớp cách *Thế nào là N?* của 27/29 khoá tầng.
  · `Catasso imā, bhikkhave, paṭipadā.` (`15.1`) theo `an4.163:1.1` *có bốn thực hành này* (`paṭipadā` *thực hành*, 6 khoá `an4`). `15.5` giữ *… , và* của `an4.163:1.5`.
  · `sutavā ariyasāvako` *bậc Thánh đa văn* 71 khoá so với *Thánh đệ tử đa văn* 10. `nibbindati`: 180 khoá, *chán nản* **95** (`sn` 60, `an` 5) so với *nhàm chán* **62** (`mn` 29, `sn` 29, `an` 0) — theo đa số toàn tầng và đa số riêng `an`, nên viết *chán nản*; ghi cả hai số vì `mn` đa số *nhàm chán*. `virajjati`: 60 khoá chứa động từ, *ly tham* là dạng chủ đạo (`mn147:9.7`, `sn18.1:4.2`, `sn35.86:24.3`).
  · `aggamakkhāyati`: 117 khoá, *được gọi là tối thượng* **40**, *được xem là …* 34 (gồm *bậc nhất* 6), *được gọi là cao nhất* 6; chọn *được gọi là tối thượng*. `etadagga` (`Etadaggaṁ, bhikkhave, imesaṁ/imāsaṁ …`, 58 khoá không kể `an1`): *thượng thủ* **35** (`an2` 30, `an4` 5), *tối thượng* **13** (`an2`), *tối thắng* **9** (`an2` 2, `iti` 7). Đa số là *thượng thủ*, nhưng bài này chọn *tối thượng* có chủ ý: `aggamakkhāyati` (`1.1` … `3.4`), `agga` ở điệp khúc *ly tham đối với cái tối thượng* (`1.4` …) và `etadagga` (`5.1` …) cùng gốc `agga`, và logic bài là *điều được gọi là tối thượng ở mỗi hạng cũng có thay đổi, nên vị ấy ly tham ngay cả đối với cái tối thượng*; dùng hai từ ở đầu mục và ở điệp khúc sẽ làm đứt mối nối đó. Nếu người biên tập muốn theo đa số *thượng thủ* thì chỉ đổi ở 7 khoá có `etadagga`: `5.1` `14.1` `16.1` `18.1` `19.1` `20.2` `21.2`.
  · `ābhassara` *Quang Âm* 43 lần so với *Ābhassara* 6 (`dn1` `dn24` `dn27`); `mahābrahmā` *Đại Phạm thiên* 43 lần so với *Đại Phạm Thiên* 4; `brahmaloka` *cõi Phạm thiên* 37; `Tāvatiṁsa` *Ba Mươi Ba* 155 lần (kể cả viết thường) so với *Tāvatiṁsa* 99; `Cātumahārājika` *Tứ Đại Thiên Vương* 59 lần so với 3 dạng khác; `Paranimmitavasavattī` *Tha Hóa Tự Tại* 24 (so với *Hóa Tự Tại* 13); `Nimmānaratī` *Hóa Lạc* 3/3; `Yāma` *Yama* 16 so với *Yāma* 13 (`an` 8 so với 2: theo `an3.70` `an8.42` …); `Tusita` *Tusita* (`an`: 7 tệp, so với *Đề Noa* 5 tệp và *Đâu-suất* 3 tệp). Chuỗi *nghìn cõi chư thiên Tứ Đại Thiên Vương … nghìn cõi Phạm thiên* theo đúng `an3.80:4.2` (Pāli trùng ngoại trừ dấu phẩy), thay *Đề Noa* bằng *Tusita* và *Hóa Tự Tại* bằng *Tha Hóa Tự Tại*; `nghìn` 40 lần so với `ngàn` 7 lần trong `an`.
  · `diṭṭhigata` *kiến chấp* (36) so với *tà kiến* (59) và *quan điểm* (29): chọn *kiến chấp* vì Pāli không có sắc thái *sai* (`bāhirakānaṁ diṭṭhigatānaṁ` chỉ nói *của người ngoài*); `bāhiraka` *ngoại đạo* (3/6). `etaṁ pāṭikaṅkhaṁ` *điều này có thể mong đợi* (79 so với *có thể chờ đợi* 61). `paññāpeti` *chủ trương* (205 so với *tuyên bố* 142). `nicchāto nibbuto sītibhūto` *không còn đói khát, tịch tịnh, mát mẻ* theo `mn51` `mn60` `mn94` (10+ khoá). `pariññā` *liễu tri* theo `mn45`.

  **SỐ PĀLI, TỰ TÍNH.** `4.1` `4.13` `5.1`: `dasa` mười; danh sách `4.3`–`4.12` đủ **10** vế (đất, nước, lửa, gió, xanh, vàng, đỏ, trắng, không gian, thức) khớp 10. `6.1` `13.6` `14.1`: `aṭṭha` tám; sáu đến mười ba là **8** khối `x.1`–`x.5` đánh số *thứ nhất* … *thứ tám* (`paṭhamaṁ dutiyaṁ tatiyaṁ catutthaṁ pañcamaṁ chaṭṭhaṁ sattamaṁ aṭṭhamaṁ`). `15.1` `15.7` `16.1`: `catasso/catunnaṁ` bốn, và `15.3`–`15.6` đủ **4** vế. `17.1` `17.7` `18.1`: bốn, và `17.3`–`17.6` đủ **4** vế. `21.6` `Navamaṁ` *Thứ chín*. `2.2`: **16** từ `sahassaṁ/sahassāni` Pāli, Việt **16** cụm *nghìn* đúng thứ tự (7 *nghìn* đầu: trăng, mặt trời, Sineru, Jambudīpa, Aparagoyāna, Uttarakuru, Pubbavideha; rồi `cattāri … sahassāni` hai lần *bốn nghìn* (đại dương, Đại Vương); rồi 7 *nghìn cõi* (Tứ Đại Thiên Vương, Ba Mươi Ba, Yama, Tusita, Hóa Lạc, Tha Hóa Tự Tại, Phạm thiên)); thêm *thế giới gấp nghìn lần* ở `2.1` và `2.2` (`sahassadhā`). Không có số lớn nào khác (`sata`, `navuti`, `kappasahassa` …).

  **CẤU TRÚC VÀ CHỖ LƯỢC.** **Tám khoá** chứa dấu lược (`4.4`–`4.11`): `4.4` có `…pe…` giữ **đúng một** `…`; `4.5`–`4.11` có `…` trần (không `…pe…`) giữ `…` trần, đúng như Pāli. Phép đo: **0** lệch (khoá nào Pāli có `…`/`…pe…` thì Việt có `…`, và ngược lại). `(…)` **không có** khoá nào. Pāli không kết `….` ở khoá nào.
  **Pāli trùng nguyên văn trong chính bài:** **6** nhóm, **35** khoá (`Evaṁ passaṁ …` × 9; `Tasmiṁ nibbindanto …` × 9; `‘tāni abhibhuyya …’ti, evaṁsaññī hoti.` × 9 ở `6.4` `7.2` `8.2` `9.2` `10.4` `11.4` `12.4` `13.4` `14.2`; `Evaṁsaññinopi …` × 3; `Evaṁsaññīnampi …` × 3; `Katamā catasso?` × 2), cả sáu nhóm Việt giống nhau, **0** cặp Việt khác. Các khoá gần trùng (`1.2` `2.4` `3.5` `5.3` `16.3` `19.6` `20.5` …) khác nhau đúng ở chủ ngữ (vua Pasenadi, Đại Phạm thiên, chư thiên Quang Âm, chúng sinh có tưởng / thực hành / kiến chấp / chủ trương như vậy), nên Việt khác đúng ở chủ ngữ.

  **NGOẶC KÉP VÀ NHÁY — khớp Pāli TỪNG KHOÁ.** Bốn loại `“` `”` `‘` `’` khớp Pāli ở **124/124** khoá, không lệch khoá nào. Lời Đức Thế Tôn mở `“` ở `1.1`, đóng `”` ở `21.5`. Nháy đơn `‘…’` bao: lời tự nghĩ *‘Sau khi chế ngự các sắc ấy, tôi biết, tôi thấy’* (9 khoá), *‘không có gì cả’* (`17.6` `18.1`), kiến chấp `19.1`, lời xuyên tạc `21.4`; và **chạy qua ranh giới khoá** ở `19.3` (`‘` mở) → `19.4` (`’` đóng), đúng như Pāli. `15.6` `17.6` kết em-dash không cách chữ đúng như Pāli.

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `paramatthavisuddhi` (`20.1` `20.2`) — **0 tiền lệ** trong tầng. `parama` + `attha` + `visuddhi`; dịch *thanh tịnh về mục đích tối thượng* (Hòa thượng *thanh tịnh là mục đích tối thắng*, Sujato *ultimate purity of the spirit*). Hai cách hiểu: *sự thanh tịnh ở mức tối hậu* hoặc *sự thanh tịnh của mục đích tối thượng*; chọn cách giữ đủ ba thành tố. Nếu người biên tập muốn sát Sujato thì đổi.
  · `mahaggata` (`17.4`) — dịch *cái cao cả* (*cao cả* 89 khoá so với *đại hành* 57 và *quảng đại* 16; *rộng lớn* 139 khoá nhưng phần lớn nằm trong công thức tâm từ `vipulena mahaggatena appamāṇena`, nơi *rộng lớn* đứng trước *cao cả*); Hòa thượng *đại hành*, Sujato *expansive*. Đây là tưởng thuộc cõi sắc/vô sắc rộng lớn; không xác định được nội hàm kỹ thuật cho riêng bài này.
  · `appaṭikulyatā` / `pāṭikulyatā` (`19.3` `19.4`) — dịch sát chữ *sự không ghê tởm … sẽ không có; sự ghê tởm … sẽ không có*: người có kiến chấp này sẽ không có sự không ghê tởm đối với hữu (tức có ghê tởm hữu), và không có sự ghê tởm đối với sự diệt của hữu. Hòa thượng cũng sát chữ (*sự không nhàm chán … sự nhàm chán*); Sujato đảo về dạng *attracted / repulsed*. 0 tiền lệ trong tầng; đọc một khoá riêng dễ hiểu ngược, nên giữ nguyên chủ ngữ *vị ấy sẽ không có*.
  · `no cassaṁ, no ca me siyā` (`19.1`) — tầng dịch ở `sn22.55` `sn24.4` `an7.55` bằng *Có thể chẳng có, và … chẳng phải của tôi*; ở đây Pāli là ngôi thứ nhất (`na bhavissāmi`, `na me bhavissatī`) nên viết *Có thể tôi không có, và có thể không phải của tôi; tôi sẽ không có, và sẽ không phải của tôi*. `me siyā` (*cái ấy… của tôi*) không có tân ngữ rõ trong câu Pāli; giữ nguyên, không bổ sung.
  · `abhiññā` trong `dandhābhiññā`/`khippābhiññā` (`15.3`–`15.6`, `16.1`) — dịch *tuệ* theo đúng 6/6 khoá trùng `an4.163`; Hòa thượng *thắng tri*. Sát Pāli hơn sẽ là *thắng trí*; giữ *tuệ* vì Pāli trùng nguyên văn (reuse).
  · `mahārājasahassāni` (`2.2`) — dịch *bốn nghìn Đại Vương* (Pāli `mahārāja`, không có `deva`); `an3.80:4.2` viết *Đại Thiên Vương*. Giữ sát chữ Pāli; đây là *bốn vị đại vương mỗi thế giới* nhân nghìn.
  · `uddhaṁ adho tiriyaṁ` (`4.3` `4.12` `5.1`) — *ở trên, ở dưới, khắp chiều ngang* theo `mn77:24.2` (`tiriyaṁ` *ngang*; `an10.25` viết *ngang qua*).
  · `sahassī lokadhātu` (`2.3`) — dịch *nghìn thế giới*; `an3.80:5.1` dùng `sahassī cūḷanikā lokadhātu` *tiểu nghìn thế giới*, ở đây Pāli không có `cūḷanikā`.
  · `umāpuppha` *hoa lanh*, `osadhitārakā` *sao mai* theo `mn77:23.15`/`23.30` (`dn` 3 tệp viết *hoa umā*, *sao mai*); `kaṇikārapuppha`/`bandhujīvakapuppha` giữ tên Pāli theo `mn77` (Sujato *champak*, *scarlet mallow*).

  **LỆCH NGOÀI LÁT — BÁO, KHÔNG SỬA.** `an10.25:1.1`–`1.13` dịch `kasiṇāyatana` thành *môn địa* (2 khoá, 1 tệp) trong khi `dn33` `dn34` `mn77` viết *biến xứ* (3 khoá, 3 tệp); `an10.25:1.3` dịch `uddhaṁ adho tiriyaṁ advayaṁ appamāṇaṁ` *phía trên, phía dưới, ngang qua, không chia hai, không có giới hạn* trong khi `mn77:24.2` viết *ở trên, ở dưới, khắp chiều ngang, không phân chia, vô lượng*. Ngoài lát này; không chạm.

  **KIỂM CHỨNG.** Tập khoá Việt = tập khoá Pāli, **124/124**, đúng thứ tự Pāli. Chỉ tên riêng (`Kāsi`, `Kosala`, `Pasenadi`, `Sineru`, `Jambudīpa`, `Aparagoyāna`, `Uttarakuru`, `Pubbavideha`, `Bārāṇasī`, `Tusita`, `Yama`) và tên hoa (`kaṇikāra`, `bandhujīvaka`) giữ dạng Pāli; không từ Pāli nào khác lọt sang. NFC đúng ở cả 124 giá trị, không khoá rỗng, không khoảng trắng thừa.

  Điểm `technical_integrity` = **9,6** vì lát này bị cấm chạy cổng, nên **không** tuyên bố technical gate pass. Bốn lệnh còn lại: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
