notes:
  - >-
    **Mười căn cứ chia rẽ và mười căn cứ hòa hợp chỉ là cùng một danh sách, đảo
    chiều** — `an10.37:1.3` nói *gọi phi pháp là pháp*… còn `an10.38:1.3` nói
    *gọi phi pháp là phi pháp*… Người đọc phải thấy đây là **cùng một danh sách
    ở hai thái cực**, nên dịch đối xứng từng cặp và dùng chung một cách diễn đạt
    cho từng cặp, không phải hai danh sách độc lập.
  - >-
    Bản hòa hợp là **chiều đúng** của `an10.37`, nên vế sau mười căn cứ phải phủ
    định: "không phản đối, không phản đối lại, không làm những việc sai trái,
    không trình bày một bộ Pātimokkha sai lệch". Dịch phủ định đầy đủ, không rút
    gọn.
  - >-
    `Idhupāli` → "Ở đây, này Upāli" theo `an3.32:4.1` (`Idhānanda` → "Ở đây, này
    Ānanda") — chưa có tiền lệ cho `Idhupāli` vì chưa bài nào trong corpus có
    nó.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    Sửa lan 2026-10-13: khoá `an10.38:1.3` — bản cũ viết *gọi phi vinh là phi vinh, gọi vinh là vinh pháp*, còn mười vế `abhāsitaṁ … paññattaṁ` thì lẫn *Thế Tôn* / *Ngài* / *Tathagata* và chỗ *chưa* chỗ *đã*; nay dùng đúng khung `an10.41:1.3` cho từng cặp, chiều thuận: *phi pháp là phi pháp, pháp là pháp, phi luật là phi luật, luật là luật, điều Thế Tôn chưa nói là điều Thế Tôn chưa nói, … đã quy định là đã quy định* (Pāli `avinayaṁ avinayoti`, `vinayaṁ vinayoti`, `abhāsitaṁ alapitaṁ tathāgatena abhāsitaṁ alapitaṁ tathāgatenāti` …). Danh sách này chỉ là chiều thuận của danh sách đảo ngược `an10.41:1.3`. Khoá `an10.38:1.4`: *không phản đối, không phản đối lại, không làm những việc sai trái, không trình bày một bộ Pātimokkha sai lệch* → *không tách ra, không đi riêng; không tự riêng làm các Tăng sự, không tự riêng tụng Pātimokkha* — Pāli `na avakassanti na apakassanti na āveni kammāni karonti na āveni pātimokkhaṁ uddisanti`: `āveni` là *riêng*, không có nghĩa *sai trái / sai lệch*; bản Anh Sujato của `an10.38:1.4` đọc *don’t split off and go their own way … perform legal acts autonomously or recite the monastic code autonomously*. Ghi chú thứ hai phía trên (vế sau mười căn cứ *không phản đối, … sai lệch*) bị thay bằng cách đọc này. Cùng lỗi còn ở `an10.37:1.3`–`1.4`, `an10.39:1.4`–`1.6`, `an10.40:1.3`–`1.4`, `an10.42:1.4` (ngoài lát, chưa sửa).
