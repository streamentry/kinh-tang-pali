notes: |-
  Đối chiếu Pāli root đã ghim + English Bhikkhu Sujato (cùng commit) + bản Việt nguyên bài của Hòa thượng Thích Minh Châu (SuttaCentral, mục Tra cứu toàn văn, không vào cột). Kinh Thiền (Jhānasutta): Đức Thế Tôn nói rằng dựa vào từng tầng — bốn thiền, bốn xứ vô sắc, rồi sự chấm dứt của tưởng và thọ — mà có sự đoạn tận các lậu hoặc; rồi giải thích lần lượt cho từng tầng đến xứ vô sở hữu (các tầng lặp lại được lược): vị tỳ-kheo quán các pháp ở tầng ấy là vô thường … vô ngã, xoay tâm khỏi chúng, hướng tâm đến giới bất tử, và nếu chưa đoạn tận các lậu hoặc thì thành bậc hóa sinh, nhập Niết-bàn tại đó; ví dụ người bắn cung luyện trên hình nhân bằng cỏ; cuối bài nói hai xứ còn lại (xứ phi tưởng phi phi tưởng, sự chấm dứt của tưởng và thọ) do các thiền giả thành thạo, đã chứng nhập và xuất khỏi, tuyên bố đúng đắn. Số thứ tự uddāna `Pañcamaṁ` = Thứ năm.

  **Coverage English: Sujato 59/70 = 0,8429** trên Pāli có nội dung (>= 40 ký tự, bỏ khối `:0`; 86 khoá, trong đó 16 khoá không vào mẫu số) — đạt ngưỡng 0,80 chỉ với tầng Sujato độc lập, **không cần** tính lớp lấp. 11 khoá Sujato bỏ trống (`4.5`, `4.6`, `4.8`–`4.11`, `5.1`–`5.3`, `5.5`, `7.3`, đều là tứ thiền và các công thức lặp) đã có lớp `english-project` (published, do một phiên khác viết, không trùng người với bản Việt này); cổng tính cả lớp ấy lên 70/70 = 1,0000 nhưng đó **không phải** đối chiếu Sujato độc lập, nên `triangulation` hạ xuống 9,0. Tầng Việt hiện hành ở commit đã ghim chỉ có Pháp Cú; bản Hòa thượng Thích Minh Châu ở đây chỉ để đối chiếu thuật ngữ (y chỉ → *dựa vào*, giới bất tử, tránh né tâm → *xoay tâm*), không phải cột. Không có gap cần ghi nhận trong `reference-gaps.yaml`.

  **Dùng lại tiền lệ (đo trên toàn tầng).** 48 khoá Pāli của bài trùng nguyên văn với bài khác (532 cặp: 378 cặp cùng bản Việt, 154 cặp khác); 36 khoá dùng lại **nguyên văn** một bản đã công bố, 12 khoá cố ý khác. Trong chính bài: 11 nhóm Pāli trùng nội bộ, 0 nhóm có bản Việt khác nhau. Nguồn chính: `0.2` (7/7 *4. Phẩm Lớn*); `0.3` theo `an10.8:0.3` (*Kinh Thiền*, 1/1); `2.2`/`4.4`/`6.2`/`8.3` *Được nói đến vì nhân duyên gì?* theo `an10.28:4.2` (7 khoá, so với 16 khoá *nhân gì mà được nói?* ở `mn114` và 4 khoá *Nhờ nhân duyên gì mà nói vậy?* ở `an3.61`); `3.10`/`7.6`/`9.10` *đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói* theo `mn139:5.6` (15 khoá; so với 5 khoá *Đó là điều Ta đã nói, và đó là lý do Ta nói như vậy* ở `an10.54:8.10`) — chọn dạng 15 khoá vì đi cặp với *nhân duyên* ở câu hỏi; `2.5`/`3.4`/`4.7`/`6.5`/`8.6`/`9.4` *Vị ấy xoay tâm khỏi các pháp ấy* theo `mn64:9.4`; `2.7`/`3.6`/`4.9`/`6.7`/`8.8`/`9.6` theo `an10.6:3.2` (và `an3.32:4.2`; `mn64:9.6` là dạng 1 khoá, bỏ); `2.8`/`3.7`/`4.10`/`6.8`/`8.9`/`9.7` theo `mn52:4.5`; `2.9`/`3.8`/`4.11`/`6.9`/`8.10`/`9.8` theo `mn52:4.6` và `an11.16:4.7` (hai nơi, nguyên văn); `5.4`/`7.4` *không còn trở lại từ thế giới ấy* (4 khoá).

  **Công thức quán các pháp — `2.4` v.v.** Công thức `aniccato dukkhato rogato gaṇḍato sallato aghato ābādhato parato palokato suññato anattato` theo `an4.124:1.4`, `an4.124:2.2`, `an4.126:1.4`, `an4.126:2.4` (cùng bộ, 4 khoá cùng một bản Việt): *vô thường, khổ, bệnh, ung nhọt, mũi tên, tai họa, khổ bệnh, cái gì của người khác, tan rã, trống rỗng, vô ngã*; **một chỗ cố ý khác**: `an4.124` viết *thuộc thụ* (4 khoá) còn tôi viết *thuộc thọ* (3 khoá `mn64:13.2`–`15.2`, và *thọ* là thuật ngữ chuẩn của cả tầng, vd. *sự chấm dứt của tưởng và thọ*); vì ở `6.4`/`8.5`/`9.3` Pāli bỏ `rūpagataṁ` và chỉ có thọ, tưởng, hành, thức, dùng *thọ* cho cả bài để khỏi lệch nội bộ. Ba khoá `2.4`/`3.3`/`4.6` nhờ vậy khác `an4.124:1.4` đúng một chữ.

  **Thuật ngữ (số đếm tầng).** `jhāna` hàng số → *thiền thứ nhất … thứ tư* (47 và 36 khoá, so với *sơ thiền* 6 / *tứ thiền* 12; theo `an9.34`, `an9.32`). `ākāsānañcāyatana` → *xứ vô số hư không* (38 khoá, so với *không vô biên xứ* 14 và *xứ hư không vô biên* 4); `viññāṇañcāyatana` → *xứ vô số thức*, `ākiñcaññāyatana` → *xứ vô sở hữu* (theo `an9.34`/`an9.37`/`an9.42`), `nevasaññānāsaññāyatana` → *xứ phi tưởng phi phi tưởng* (quy ước tầng, 168 khoá/62 tệp). `paṭighasaññāna` → *các tưởng đối ngại* (theo `an9.34`/`an9.42`; `an9.37`/`an3.116` dùng *đối nghịch*). `amatā dhātu` → *giới bất tử* (`an3.130`, 2 khoá; `mn64:9.5` *giới vô tử*, 1 khoá — chọn *bất tử* vì `bất tử` là 201 lần toàn tầng). `saññāvedayitanirodha` → *sự chấm dứt của tưởng và thọ* (theo `an9.42:12.1`, `an9.34:10.1`). `āsavānaṁ khayaṁ` → *sự đoạn tận các lậu hoặc*. `nissāya` → *dựa vào* (Thích Minh Châu: *y chỉ*). `samāpatti` → *sự chứng đạt* (`an9.33`, `an11.16`). `aññāpaṭivedho` → *sự thấu triệt chánh trí* (`an8.19:10.7`, `an8.20:9.4`). `0.1` → *Kinh Tăng Chi Bộ 9.36* (947 khoá so với 409 khoá *Aṅguttara Nikāya* trong `an`). `aparena samayena` → *sau một thời gian* (10 khoá, ngang *thời gian sau* 10, hơn *về sau* 8). `dūrepātī` / `akkhaṇavedhī` / `mahato kāyassa padāletā` → *bắn xa được / trúng đích chính xác / phá vỡ được những vật lớn* (`an4.181:1.3`, `an4.181:1.7`, 4 khoá). Công thức tứ thiền `4.5` theo `sn36.31:8.2`, `sn48.40:4.7`, `sn54.8:14.2`: *do từ bỏ lạc, do từ bỏ khổ, do hỷ và ưu đã biến mất từ trước … xả niệm thanh tịnh* (so với `an10.20:10.2` *do diệt tận hỷ ưu đã cảm thọ trước kia* và `an4.38:3.2` *lạc ưu* — hai khoá ấy dịch `pubbeva` thành *đã cảm thọ trước kia* hoặc đảo hỷ thành lạc, không bám Pāli, nên không theo).

  **Bất định đã ghi, không thêm vào thân kinh.** (1) `10.1`–`10.3` — `Yāni ca kho imāni, bhikkhave, nissāya dve āyatanāni—`: tôi đọc `imāni` là các tầng có tưởng vừa nêu và dịch *hai xứ nương vào những điều này*, theo Sujato (*the two dimensions that depend on these*); Thích Minh Châu bỏ `nissāya` và nói *các xứ này, như Phi tưởng phi phi tưởng … và Diệt thọ tưởng*. Câu gốc ngắn và có thể phân tích khác (`nissāya` là *dựa vào những tầng ấy* hay là chính chữ *dựa vào* ở `1.1`–`1.9`), nhưng cả hai cách cùng cho giáo nghĩa: tầng có tưởng tới xứ vô sở hữu là chỗ dựa để đoạn tận lậu hoặc; hai xứ cuối do người đã chứng nhập và xuất khỏi tuyên bố. (2) `yāvatā saññāsamāpatti tāvatā aññāpaṭivedho` (`10.1`) — dịch sát *sự chứng đạt có tưởng đến đâu thì sự thấu triệt chánh trí đến đó*; Sujato *penetration to enlightenment extends as far as attainments with perception*; Thích Minh Châu *xa cho đến các tưởng Thiền chứng … cần phải lấy trí để thể nhập*; cùng nghĩa. (3) `Paṭhamampāhaṁ` … (-mpi, `1.1`–`9.9`) — Pāli có `pi` đồng đều ở cả chín mục; Sujato dịch *also* từ `1.2`; vì `1.1` cũng có `pi`, tôi không viết *cũng* ở mục nào để khỏi tự tạo khác biệt giữa các mục. (4) `6.1` có `jhānaṁ` sau `Ākāsānañcāyatanampāhaṁ` (còn `1.5`, `7.5` thì không): dịch *thiền xứ vô số hư không*, giữ đúng chữ của từng khoá. (5) `4.1`/`4.2`/`8.1` bị lược ngay sau `nissāya`: tôi viết *Ta nói rằng dựa vào …* — chữ *nói* lấy từ `vadāmi` của chính công thức bị lược. (6) `3.2`: Pāli là `bhikkhu`, Sujato viết *a noble disciple* (còn `7.2`, `9.2` viết *a mendicant*); tôi theo Pāli: *vị tỳ-kheo*. (7) `mahato kāyassa padāletā` — *kāya* số ít nhưng `an4.181` đã dịch *những vật lớn*; giữ theo tiền lệ. (8) `mattikāpuñja` — *đống đất sét* (đúng chữ *đống*, theo Thích Minh Châu); Sujato viết *clay model*. (9) `yoggaṁ karitvā` — *tập luyện* (Thích Minh Châu *tập bắn*); không có tiền lệ trong tầng.

  **Số Pāli:** không có số lượng nào cần phép tính — `pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ` = năm hạ phần kiết sử (5, khớp 22 khoá tầng); `dve āyatanāni` = hai xứ (2); `paṭhama` … `catuttha` là số thứ tự bốn thiền; chín mục ở `1.1`–`1.9` (bốn thiền, bốn xứ vô sắc, sự chấm dứt của tưởng và thọ) không được nêu bằng số.

  **Dấu lược và dấu nháy:** 8 khoá Pāli có `…pe…` (`2.3`, `3.2`, `4.1`, `4.2`, `5.2`, `5.3`, `7.3`, `8.1`) → đúng một `…` ở mỗi khoá Việt (8/8); khoá Pāli không có `…` thì Việt không có (86/86 khớp). Nháy đơn và nháy kép khớp Pāli từng khoá (86/86; 19 khoá có nháy đơn, 2 khoá có nháy kép): `1.1` mở `“` và `10.3` đóng `”`; `8.1` chỉ mở `‘` và `8.2` chỉ đóng `’` đúng như Pāli (câu trích bị cắt ở `…pe…` rồi nối sang khoá sau). Không có `(…)` trần ở khoá nào.

  **Lượt review đối kháng.** In từng cặp Pāli↔Việt cả 86 khoá. Hai chỗ đã sửa hoặc cân nhắc: (1) `1.1`–`1.9` — đã cân nhắc viết *cũng* cho `pi`, bỏ vì tạo khác biệt giữa các mục; (2) `3.2`/`5.2`/`7.2`/`9.2` ban đầu viết hoa *Cũng vậy* trong khi Pāli viết thường sau dấu `;` — đổi thành *cũng vậy* theo `an9.34:2.4`. Không còn khoá nào bản Việt trống, không còn Pāli lọt sang bản Việt.

