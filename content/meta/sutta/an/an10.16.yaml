notes:
  - >-
    **Bài ngắn nhất chương (8 segment)**: mười bậc đáng cúng dường, không giải
    thích từng bậc — và tôi **không** giải thích, vì Pāli cũng không.
  - >-
    **`āhuneyyā pāhuneyyā dakkhiṇeyyā añjalikaraṇīyā anuttaraṁ puññakkhettaṁ`
    dùng nguyên văn `an4.190:2.4`** (đã `published`) — *xứng đáng được cúng
    dường, xứng đáng được tiếp đón, xứng đáng được bố thí, xứng đáng được chắp
    tay lễ kính, là ruộng công đức vô thượng*.
  - >-
    **Ba danh xưng đầu có tiền lệ trực tiếp**: `paccekabuddho` → *bậc Bích Chi
    Phật* theo `an4.247:1.3`; `kāyasakkhī`, `diṭṭhippatto`, `saddhāvimutto` →
    *bậc chứng thân, bậc đạt kiến, và bậc tín giải thoát* theo `an3.21:2.3` và
    `:9.3` (10 segment); `cetovimutto`/`paññāvimutto` → *giải thoát tâm*/*giải
    thoát tuệ* theo `an5.71:2.4` và `an5.72:1.5`.
  - >-
    **Bốn danh xưng cuối là 0 segment tiền lệ, đặt mới và ghi lý do**:
    `ubhatobhāgavimutto` → *bậc song phương giải thoát* (`ubhato` = *cả hai
    phía*, `bhāga` = *phần*, nên **hai mặt của giải thoát**: sân và si, hoặc
    thức và tuệ); `saddhānusārī` → *bậc thọ trì theo tín*, `dhammānusārī` → *bậc
    thọ trì theo pháp* (hai chữ *thọ trì theo* dùng chung để phân biệt đôi một);
    `gotrabhū` → *bậc hành giả* (`gotra` = *hành*, `bhū` = *đã là*; Sujato dịch
    *one who has entered the stream*). Cả ba cụm đều là **tên giai cấp** trong
    danh sách, nên tôi dùng chữ *bậc* cho cả mười, không phải lúc *bậc* lúc
    *vị*.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
