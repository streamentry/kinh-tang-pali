notes: |-
  Giải quyết draft 2026-10-12: thay thế mục chấm 2026-09-13 của tác giả cũ. Blocker cũ "cắt ngắm" (3 khoá an5.161:1.5, 1.7, 1.9 có dấu lược `…` mà Pāli tại khoá đó không có) đã gỡ: bản dịch hiện hành không còn dấu `…` nào ở bất kỳ khoá nào, và cả ba khoá đều dịch đủ nội dung Pāli (karuṇā / upekkhā / asatiamanasikāro), nên blocker này không còn căn cứ.
  Đọc đối kháng 19/19 khoá với Pāli, Sujato và các bài song song (an5.57, mn20, an5.162). Sửa 2 khoá. (1) an5.161:1.9 — "hãy không lưu ý đến người ấy, không chú ý đến người ấy" đổi thành "nên không nhớ nghĩ, không chú tâm đến người ấy": asatiamanasikāro āpajjitabbo là cụm đã có tiền lệ ở mn20:5.1, 5.2, 6.1, 6.22, 8.5 (5/5 khoá dịch "không nhớ nghĩ, không chú tâm"); bản cũ bỏ mất yếu tố asati (không nhớ nghĩ) và dùng "hãy không" lủng củng. (2) an5.161:1.11 — "sự chủ nhân của nghiệp" đổi thành "tính chủ nhân của nghiệp" (kammassakatā là danh từ trừu tượng -tā, không phải "sự" + danh từ chỉ người).
  Giữ nguyên: "nghiệp là thai tạng, quyến thuộc, nơi nương tựa" khớp an5.57 (kammayoni kammabandhu kammapaṭisaraṇo); "vị khả kính này" cho ayamāyasmā khớp an5.162:6.11 và an5.100; mettā/karuṇā/upekkhā = từ/bi mẫn/xả khớp an5.162. Các khoá lặp 1.4 = 1.6 = 1.8 = 1.10 = 1.14 (evaṁ tasmiṁ puggale āghāto paṭivinetabbo) giống hệt nhau ở cả Pāli lẫn Việt (5/5 cặp).
  Coverage English: Sujato phủ 11/14 khoá Pāli có nội dung (≥ 40 ký tự); để trống 1.6, 1.8, 1.10, đều là câu lặp nguyên văn 1.4 trong Pāli, tự đứng vững từ Pāli và từ khoá 1.4 đã được Sujato dịch. Bài song song hiện thời trong kho không có tầng Việt hiện hành (tầng này chỉ có Pháp Cú). Vì vậy triangulation đặt 8.0.
  Bất định còn lại: tasmiṁ puggale dịch "đối với người ấy"/"nơi người ấy" nhất quán; adhiṭṭhātabbā dịch "quyết định" (Sujato: focus on), không phải bất định về giáo nghĩa. Không còn blocker.
  technical_integrity đặt 9,6: chưa chạy các cổng npm run validate, npm test, npm run check, npm run build trong lượt này; cần chạy trước khi chốt trạng thái.
