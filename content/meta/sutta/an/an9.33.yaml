notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato (đủ 66/66 khoá Pāli có nội dung từ 40 ký tự, coverage 1,00; không có lớp english-project cho bài này) và bản Việt không phân đoạn của Hòa thượng Thích Minh Châu (tra cứu toàn văn, không vào cột). Bản Việt hiện hành phân đoạn không có cho Tăng Chi Bộ. Đã đọc đối chiếu Pāli↔Việt từng cặp của cả 70 khoá.
  technical_integrity 9.6: phiên làm việc bị cấm chạy cổng, nên chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; người điều phối chạy sau.
  Cấu trúc: chín đơn vị cùng khuôn (dục · tầm và tứ · hỷ · lạc đi cùng xả · tưởng về sắc · bốn xứ vô sắc), mỗi đơn vị gồm lời Đức Phật, câu hỏi của người nói không biết, lời đáp, và lời hoan hỷ. Ba nhóm khoá Pāli trùng nguyên văn trong bài (`:n.3`, `:n.6`, `:n.7` của chín đơn vị, 27 khoá) đều dịch giống hệt nhau; 0 cặp trùng nội bộ có bản Việt khác. Đo cặp Pāli trùng nguyên văn với các bài đã dịch khác: 0 cặp.
  Dấu lược: `…pe…` ở `1.1`, `2.4`, `3.4`, `4.4` giữ đúng một `…`, không mở rộng thành văn; Pāli không có `(…)` trần nên bản Việt không có. Nháy đơn ‘ ’ và nháy kép “ ” khớp Pāli từng khoá (70/70, 0 lệch). Ở `5.4`, `6.4`, `7.4` Pāli không đặt nháy quanh `ananto ākāso`, `anantaṁ viññāṇaṁ`, `natthi kiñci` nên Việt dùng "với ý niệm rằng …" không nháy (theo `an9.34:6.1`–`8.1`).
  Số Pāli: `nava` → chín (`1.1`, `1.2`, `10.1`); `paṭhamaṁ/dutiyaṁ/tatiyaṁ/catutthaṁ jhānaṁ` → thiền thứ nhất/hai/ba/tư; `Dutiyaṁ.` → "Thứ hai." (bài thứ hai của nhóm, sau `an9.32` "Thứ nhất"). Không có số lớn nào cần tính.
  Thuật ngữ theo tiền lệ gần nhất (`an9`), đo cả hai phạm vi: `ākāsānañcāyatana` → *xứ vô số hư không* (an9: 13/16 khoá; toàn tầng thì *Không vô biên xứ* chiếm đa số, 23 so với 6); `viññāṇañcāyatana` → *xứ vô số thức* (an9: 13/15; toàn tầng *Thức vô biên xứ* 103 so với 23); `ākiñcaññāyatana` → *xứ vô sở hữu* (an9: 12/14; toàn tầng *Vô sở hữu xứ* 115 so với 39); `nevasaññānāsaññāyatana` → *xứ phi tưởng phi phi tưởng* (an9: 11/15); `saññāvedayitanirodha` → *sự chấm dứt của tưởng và thọ* (`an9.34:10.1`, `an9.40:6.6`, `an9.42`; khác `an9.32:1.3` dùng *sự diệt tận sở kiến và cảm thọ*, vì khoá ấy là tên gọi trong một danh sách, còn ở đây là động từ chứng nhập); thiền *thứ nhất/hai/ba/tư* (an9: 8 so với 3 *sơ/nhị/tam/tứ thiền*, và `an9.34`); `upekkhāsukha` → *lạc đi cùng xả* (`an9.42:6.5`, `mn66:24.4`, `dn9:12.3`); `nirujjhati` → *chấm dứt* (`an9.42`, `an9.40`); `asaṭho amāyāvī` → *không gian trá, không dối trá* (`an5.53:1.7`, `an5.135:3.6`); `āvuso` → *này hiền giả* (`an9.34`); `addhā` → *chắc chắn*; `nicchāta` → *không còn khát ái* (`iti52:4.4`; `sn22.22:7.4` dịch *hết thèm khát*); `abhinandati anumodati` → *hoan hỷ, tùy hỷ* (`sn35.74:21.2`: *hoan hỷ và tán đồng*). `anupubbavihāra` → *phép sống tiếp nối* theo `an9.32`; `samāpatti` → *sự chứng đạt*.
  Bất định 1, `nirodhetvā nirodhetvā`: dạng lặp của động từ bất biến quá khứ có thể là nhấn mạnh ("triệt để", như Sujato dịch "thoroughly") hoặc là lặp lại ("hết lần này đến lần khác", mỗi lần vào thiền). Bản Việt giữ nguyên dạng lặp ("làm chấm dứt rồi lại làm chấm dứt") để không chọn thay Pāli; đây là chỗ câu Việt hơi cứng và đã chấp nhận vì không có căn cứ trong tầng để phân xử.
  Bất định 2, `tadaṅgenā`: dịch "ở phương diện ấy" theo Sujato ("in that respect"). Hòa thượng Thích Minh Châu dịch "với Thiền chi ấy". Nghĩa đen của chuỗi `nicchātā nibbutā tiṇṇā pāraṅgatā` thường chỉ bậc đã giải thoát hẳn, trong khi ở đây áp dụng cho người mới chứng thiền thứ nhất; từ `tadaṅgenā` giới hạn lại thành "chỉ xét theo chi phần ấy". Bản Việt không thêm chữ "tạm thời" hay "một phần" vì Pāli không nói, và ghi chú này giữ vai trò cảnh báo người đọc không hiểu thành giải thoát cứu cánh.
  Bất định 3, cú pháp `‘sādhū’ti bhāsitaṁ abhinandeyya anumodeyya` (`1.8`–`9.6`, `1.9`–`9.7`): Sujato tách "approve and agree with that statement" khỏi "they'd say ‘Good!’", Hòa thượng Thích Minh Châu dính "với lời nói ‘Lành thay’". Bản Việt chọn "với lời đã nói ấy bằng tiếng ‘Lành thay’": `bhāsitaṁ` là lời đã được nói, còn `sādhū` là tiếng đáp. `payirupāseyya` dịch *hầu cận*; Sujato gộp với *namassamāno pañjaliko* thành một cụm lễ kính, Hòa thượng Thích Minh Châu tách ba ("đảnh lễ, chắp tay và hầu hạ"). Ba chỗ bất định trên không đổi giáo nghĩa chính của bài.
  Không có đối chiếu bản Việt phân đoạn: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt; đây là giới hạn của bản chụp upstream. Coverage English 1,00 nên bài không cần entry trong `content/meta/reference-gaps.yaml`.
