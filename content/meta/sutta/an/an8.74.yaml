notes:
  - >-
    **Cảnh báo về khuôn tải `Aṅguttara Nikāya` — đo lại, con số đã lệch.** Lệnh lát bảo dùng dạng `Kinh Tăng Chi Bộ` cho `0.1` của bài `an`, nói rằng đo được 862 tệp theo dạng đó và 342 tệp giữ Pāli. Tôi **đo lại trên đĩa hôm nay** và con số đã lệch: trong 1.600 tệp `an`, có **1.228** tệp có khoá `:0.1`; trong đó **875** viết `Kinh Tăng Chi Bộ` và **353** giữ `Aṅguttara Nikāya` (372 tệp không có khoá `:0.1` nào). Tỷ lệ chọn lựa thì không đổi, nên tôi **theo đo được**: dùng `Kinh Tăng Chi Bộ`. Hệ quả phải nói rõ: bài liền kề có thể lệch — `an8.25` viết `Kinh Tăng Chi Bộ 8.25` nhưng `an8.47` lại giữ `Aṅguttara Nikāya 8.47`, và `an6.33` cũng giữ Pāli. Việc này không đổi nghĩa segment nào.
  - >-
    **Mọi trích dẫn trong `notes` này đã tra bằng script** trên chỉ mục Pāli↔Việt tự dựng (5.032 bài, 88.415 chuỗi Pāli khác nhau) — trong đó **loại 8 tệp của chính lát này**, để không tự đếm bản dịch của mình làm tiền lệ.
  - >-
    **Coverage Anh đo bằng script, không suy.** Đo theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ, cộng `english-sujato` và `english-project` khi status là published). Cách đo đã được **kiểm lại** bằng bài đã có sẵn: chạy lại đúng công thức này trên `an5.249` cho ra **16/21 = 0.7619**, khớp con số đã ghi trong `blocking_errors` của chính tệp đó. Bài này đạt 31/31 = 100%, toàn bộ do Sujato, không khoá nào phải dùng bản lấp `english-project`, nên không cần mục trong `content/meta/reference-gaps.yaml` và không có blocker về tầng tham khảo.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo.** Tại commit đã ghim, tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) chỉ có Pháp Cú, nên **không có bản Thích Minh Châu để đối chiếu ở bất kỳ bài nào trong lát này**. Đối chiếu thuật ngữ vì vậy dựa vào Pāli root + bản Anh Sujato đã ghim + **tiền lệ đo được trong chính tầng Việt của kho**; `budsas.org` là tra cứu toàn văn, không dựng cột.
  - >-
    **Dấu lược — giữ đúng luật, không mở rộng.** Mọi khoá Pāli có `…pe…` đều giữ **đúng một** `…` trong bản Việt (luật §10.1 của BRIEF_VI3), và **không** khoá nào được thêm `…` để che chỗ thiếu. Ở những khoá lược, công thức bị nén đều là `peyyāla` mà bài đã phát lại đủ ở chỗ khác, nên nén thêm cũng không mất thông tin; tôi không mở rộng bất kỳ khoá lược nào.
  - >-
    **`maraṇassati` — 0 tiền lệ trong toàn tầng, đây là điểm yếu thật của bài và tôi không giấu.** Chỉ mục Pāli↔Việt cho **0** chuỗi trùng cụm `maraṇassati`, và cũng **0** chuỗi `maraṇasati`. Tôi chọn **niệm tưởng về sự tử** vì có tiền lệ cho cả lớp `saññā` mà `maraṇassati` thuộc vào: `an5.61` và `an5.62` dịch `pañcimā … saññā bhāvitā bahulīkatā` là *có năm niệm tưởng này, khi được tu tập và thường xuyên rèn luyện…*; `an10.56` và `an10.57` dịch cụng đó cho *mười niệm tưởng*. Cách thay thế rất phổ biến là **tỉnh thức về sự tử** (Hòa thượng Thích Minh Châu dùng *Tỉnh thức về sự tử*); hai cách chỉ khác nhau ở chữ dịch `sati`, **không đổi nghĩa giáo lý** — cùng một pháp tu tập quán sát sự tử. Tôi ghi lại để người điều phối chọn một lần cho cả `an8.73` và `an8.74`; đây là lý do tôi hạ `terminology` xuống 8.8 và `ambiguity_integrity` xuống 9.1, không che giấu bằng điểm cao.
  - >-
    **9 khoá có Pāli trùng nguyên văn, dùng lại y hệt.** Quan trọng nhất là `2.6`, trùng **nghĩa** với `an5.77:3.4` (bài nỗi sợ trong tương lai) — bản Việt ở đó đã viết *hay ta trượt chân ngã, hay thức ăn làm ta mắc bệnh, hay bị chứng lên huyết, chứng đờm tăng, hay bị những cơn gió xoáy đâm thẳng*, và tôi dùng lại nguyên văn; nhưng Pāli hai bài **không** giống hệt (`bhattaṁ vā me bhuttaṁ` ở đây so với `bhattaṁ vā bhuttaṁ me` ở `an5.77`), nên tôi không tính là trùng nguyên văn. Cụm `adhimatto chando ca vāyāmo ca ussāho ca ussoḷhī ca appaṭivānī ca sati ca sampajaññañca karaṇīyaṁ` → *hăng say tâm, cố gắng, tinh tần, dõng mãnh, không ngại khó, có niệm, biết tỉnh* (2 tiền lệ ở `an10.51`, `an10.53`) dùng lại ở `3.2`, `4.2`, `7.2`, `8.2`, `9.2`. `ahi vā maṁ ḍaṁseyya, vicchiko vā maṁ ḍaṁseyya, satapadī vā maṁ ḍaṁseyya` → *rắn cắn ta, hay bọ cạp đốt ta, hay rết đốt ta* (theo `an5.77:2.5`, khớp nguyên văn). `1.1` khớp *Một thời, Đức Thế Tôn trú tại Nātika, trong ngôi nhà bằng gạch.* `1.2` trùng Pāli nhưng tôi thêm **các vị** cho nhất quán với `1.3`.
  - >-
    **5 khoá cùng Pāli nhưng tôi chọn cách khác — nói rõ.** `4.1`/`8.1` có 1 tiền lệ *Này các tỳ-kheo, ví như y phục hay **đầu ai đó** đang bốc cháy, để dập tắt y phục hay cái đầu ấy…* (`an4.93`); tôi dùng *y phục hay **cái đầu** đang bốc cháy* vì Pāli `tasseva celassa vā sīsassa vā` quy cho chính y phục hoặc cái đầu ấy chứ không phải đầu ai đó. `4.2`/`8.2` có 1 tiền lệ *Cũng vậy, này các tỳ-kheo, để đoạn bỏ những **pháp bất thiện** ấy…* (`an10.51`); tôi dùng *những **pháp ác, bất thiện** ấy* để khớp với `3.2` và `7.2` cùng bài. `1.2` khác ở chỗ tôi thêm **các vị** như đã nói.
  - >-
    **Bất định đã ghi: `paṭisañcikkhati` → *suy xét* (tiền lệ `mn17`) nhưng `paccavekkhamāno` → *phản tư* (tiền lệ y hệt ở `an10.51`, `an10.53`, `an10.54`).** Hai động từ gần nghĩa nhau mà tầng đang dùng hai cách khác nhau; tôi giữ đúng sự phân biệt đó thay vì gộp làm một, vì nó không đổi nghĩa. `kālakiriyā` → *qua đời* và `antarāyo` → *trở ngại* theo `an5.77`.
  - >-
    **Một khoá tôi phải thêm dấu nháy kép mở, đã nói rõ.** Pāli ở `1.2` chỉ có `…pe…` — nơi lẽ ra phải mang `“` — nên cả bài Pāli lệch **−1** (0 dấu `“`, 1 dấu `”` ở `9.3`). Tôi mở `“` ở `1.3`, đúng chỗ lời Đức Phật bắt đầu. Đây là **dấu câu**, không phải thêm chữ có nghĩa; ngoài `1.3` thì **30/31** khoá khớp Pāli từng khoá.
  - >-
    **Bốn khoá phải lặp nguyên văn — đó là `peyyāla` của nguồn.** `2.2`–`2.9` và `6.1`–`6.8` là hai lần nói *đêm nay* rồi *ngày nay*, mỗi lần phát lại đúng chuỗi `sacc…, paccavekkhamāno evaṁ jānāti…, pāpakā akusalā dhammā appahīnā…, adhimatto chando…`, `Seyyathāpi, bhikkhave, ādittacelo…`, `evamevaṁ kho…`, `Sace pana…`. Tôi lặp y hệt; đó là bắt buộc của nguồn, không phải lỗi khuôn.
  - >-
    **`technical_integrity` đặt 9.6 chứ không phải 10.0.** Đợt này lát bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên cổng kỹ thuật của repo **chưa chạy** và không thể tuyên bố là đã pass. Những gì đã quét bằng script riêng trên **mọi** khoá (không chỉ khoá ≥ 40 ký tự): JSON hợp lệ, đủ mọi khoá trong `all`, không khoá thừa so với Pāli, không khoá rỗng, NFC, không trùng nguyên văn Pāli, không Pāli lọt vào bản Việt, **số dấu lược khớp Pāli từng khoá**, và ngoặc kép cân trên cả bài (`ngoặc()` của `_hvi.py`). Cần chạy bốn lệnh trên trước khi merge.
