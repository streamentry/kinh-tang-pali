notes:
  - >-
    **`abhiññāya` → "để chứng ngộ", `bhāvetabbā` → "cần được tu tập"**: dùng
    nguyên văn từ `an3.183-352:1.1` (`Rāgassa … abhiññāya tayo dhammā
    bhāvetabbā` → "Để chứng ngộ tham, này các tỳ-kheo, ba pháp này cần được tu
    tập"). `Katame dasa?` → "Thế nào là mười?" theo `Katame tayo?`/`Katamā
    pañca?` trong cùng corpus.
  - >-
    **Sáu `saññā` cuối — `aṭṭhika`, `puḷavaka`, `vinīlaka`, `vipubbaka`,
    `vicchiddaka`, `uddhumātaka` — chưa có tiền lệ nào trong corpus (0
    segment).** Đây là sáu hình quán tưởng về bài tối của người chết. Quyết định
    ở đây, mỗi chữ đều ghi kèm lý do vì không có số đếm được:
  - >-
    • `aṭṭhika` (bộ xương) → **"bộ xương"**;  - `puḷavaka` (đống tro) →
    **"đống tro"**;
  - >-
    • `vinīlaka` (tro đã quét dầu sau khi hỏa thiêu) → **"tro quét dầu"**;  -
    `vipubbaka` (vỏ trấu) → **"vỏ trấu"**;
  - >-
    • `vicchiddaka` (hạt bị băm vụn rơi rải rác) → **"hạt vụn"**;  -
    `uddhumātaka` (đám bụi tro bị gió cuốn) → **"đám bụi"**.
  - >-
    Cả sáu mở đầu bằng "niệm tưởng" như phần đầu danh sách, nên cả danh sách đọc
    thành một chuỗi.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
