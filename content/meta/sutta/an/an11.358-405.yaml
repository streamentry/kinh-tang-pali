notes: |-
  **Bản chụp Pāli của bài này CHỈ CÓ SÁU MẢNH vắt, mỗi mảnh một dấu lược.** Không phải tôi lược — đó là nguyên văn `an11.358-405_root-pli-ms.json` đã ghim: toàn bộ tệp có đúng 11 khoá, `1.1` = `…`, rồi `Rūpataṇhāya…` / `saddataṇhāya…` / `gandhataṇhāya…` / `rasataṇhāya…` / `phoṭṭhabbataṇhāya…` / `dhammataṇhāya…`. Bản Anh Sujato cũng đúng hình dạng ấy (7/7 khoá có tiếng Anh), tức hai tầng cùng bị cắt cụt ở commit đã ghim. Theo BRIEF_VI3 §10.1 tôi giữ **một** dấu lược ở mỗi khoá và **không** mở rộng; khoá `1.1` vì vậy là dấu lược trần `…`, đúng như 446 giá trị ngắn sẵn có trong tầng (vd `an11.502-981:2.2` = `…` cho Pāli `pe…`).

  **Sáu khoá thân bài là một danh sách, tôi không nhân bản thêm lượt nào. `taṇhā` → *tham*; `rūpa/sadda/gandha/rasa/phoṭṭhabba/dhamma` → *sắc / tiếng / mùi / vị / xúc chạm / pháp* (`rūpa` = *sắc* theo `an11.502-981:1.3` *biết rõ sắc*, và `phoṭṭhabba` là căn xúc chạm theo thứ tự sáu căn mà `an11.8:2.1` liệt kê: mắt, tai, mũi, lưỡi, thân, xúc chạm, rồi pháp).

  **Tiêu đề 0.2/0.3 — bản chụp upstream tự mâu thuẫn, tôi theo hình dạng giống hệt nhất.** Pāli `0.2` = `Paṭhamapaṇṇāsaka` và `0.3` = `Sāmaññavagga` trùng y hệt `an11.502-981` (bài duy nhất trong tầng có cùng cặp Pāli này, cũng gom nhiều bài, cũng `0.4` = `~`). Nhưng hai bản dịch đang có lệch nhau: `an11.502-981` ghi `Bộ Mười Một Bài Kinh Đầu Tiên` + `Phẩm Sa-môn`, còn `an11.992-1151` ghi `1. Paṭhamapaṇṇāsaka` + một tên dịch tự do cho `Rāgapeyyāla`. Tôi theo `an11.502-981` — cùng Pāli, cùng hình dạng — và ghi lại đây để biên tập thống nhất, vì **cùng một Pāli mà có hai cách dịch là lỗi theo luật của kho**. `0.1` tôi ghi `Aṅguttara Nikāya 11.358–405` (có số bài) theo đúng hai tiền lệ `an11.502-981`/`an11.992-1151`, dù Pāli chỉ ghi `Aṅguttara Nikāya 11`; đây là quy ước cho uid-gộp, ghi ra để không ai tưởng tôi bịa thêm chữ.

  **Tầng Việt hiện hành không có.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa 27 tệp Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế chỉ là Pāli + English Sujato.

  **Sàn coverage không kích hoạt, nhưng ô Anh trống KHÔNG phải đồng thuận.** Hàm `kiểm()` của `_hvi.py` lọc `cần = [k for k in p if len(p[k]) >= 40 …]`. Ở bài này mọi khoá Pāli ngắn hơn 40 ký tự, nên `cần` RỖNG và NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy. Tôi đã tự quét lại MỌI khoá bằng một lớp kiểm riêng áp đúng các quy tắc ấy lên toàn bài, và in ra từng cặp Pāli ↔ Việt để đọc đối kháng.

  **Ngoại lệ đã đo, không phải lỗi.** Khoá `:0.1` trùng nguyên văn Pāli là quy ước của tầng: 168/516 tệp `kn/*` có `:0.1` là chuỗi Pāli nguyên văn (đếm bằng script). Tương tự, tên riêng mang dấu Pāli trong tiêu đề là tiền lệ (`thag1.101` Belaṭṭhānika, `thag1.11` Cūḷavaccha, `thag1.15` Kuṇḍadhāna), và dấu lược trần `…` xuất hiện 446 lần trong tầng.

  **Tôi không chạy `npm run validate|test|check|build`** (đợt này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0 — đúng như `thag1.107` đã làm.
