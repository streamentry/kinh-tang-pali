notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 33/33 = 100%** — bài đầy đủ nhất lát này. Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ phân phối Pháp Cú cho tiếng Việt), nên `triangulation` 9.0. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **11 khoá có PĨI TRÙNG NGUYÊN VĂN ở bài khác; 9 cặp dùng lại NGUYÊN VĂN — và nguồn tiền lệ mạnh nhất lát này là `an10.21`.** `an10.21` là chính `Sīhanādasutta` ở bản mở rộng (mười sức mạnh thay vì sáu), nên bản Việt đã có sẵn toàn bộ khung ngữ pháp: `0.3` (Kinh Tiếng Rống Sư Tử) · `1.3` · `1.4` · `2.1` · `2.2` · `3.1` · `5.2`. Ngoài ra `0.2` = `an6.59:0.2` (6. Phẩm Đại) · `1.2` = `mn112:9.4` (Sáu điều nào?) · `13.8` = `sn38.10:1.14` (Thứ mười). Nhờ vậy `ṭhānañca ṭhānato aṭṭhānañca aṭṭhānato` → *điều có thể, điều không thể* · `āsabhaṁ ṭhānaṁ` → *địa vị của con bò đực* · `sīhanādaṁ nadati` → *rống tiếng rống sư tử trong các hội chúng* · `brahmacakkaṁ pavatteti` → *xoay chuyển Pháp luân* · `tathāgatabala` → *một sức mạnh của Như Lai* · `jhānavimokkhasamādhisamāpattīnaṁ saṅkilesaṁ vodānaṁ vuṭṭhānaṁ` → *sự nhiễm ô, sự thanh tẩy và sự xuất ra khỏi …* — tất cả dùng lại nguyên văn của `an10.21`.
  **Sáu cặp hỏi–đáp ở `7.x`–`12.x` là khoá mới, dựng từ `Yathā yathā … tathā tathā …`.** Pāli lặp hai lần cụm trí tuệ (một lần để nói *đã biết rõ thế nào*, một lần trong *câu hỏi các ông đã nêu*); tôi giữ đúng cả hai lần và dịch `Yathā yathā … tathā tathā` thành *… theo bất cứ cách nào, thì cũng theo đúng cách ấy …* — rõ nghĩa cho người đọc và không mất vế đối xứng. `13.1`–`13.6` theo `dn34:2.1.156` cho `samāhitassa / no asamāhitassa` = *dành cho bậc có định, không dành cho bậc không có định*; `samādhi maggo, asamādhi kummaggo` → *định là con đường, không có định là con đường đi ngược* (`mn19:26.13` dịch `kummaggo` là *con đường sai*).
  **`brahmacakka` giữ nguyên *Pháp luân* / *xoay chuyển Pháp luân*, không kiêng.** `mn12:9.1` và `an10.21` đã dịch vậy. Đây là chữ Pāli; tôi không thêm chú thích về tranh luận cổ điển về Pháp luân vào thân kinh.
  **Bất nhất ở tầng Pāli, ghi lại chứ không sửa.** `13.8` nói `Dasamaṁ.` (thứ mười) và `14.4` nói `te dasāti` (mười bài), nhưng `0.2` ghi `6. Mahāvagga` và `13.9` ghi `Mahāvaggo chaṭṭho`; thực tế phẩm này chỉ có sáu bài, `an6.59`–`an6.64`. Tôi dịch đúng chữ Pāli ở cả hai khoá (*Thứ mười.*, *đó là mười bài ấy.*) chứ không sửa Pāli cho khớp.
  **Uddāna `14.0`–`14.4`, vần đệ quy gọi tên bài, 0 tiền lệ.** `Soṇo` → *Sư Tử* (giữ chữ) · `phagguno` → *bụng lửa* (giữ nguyên hình ảnh Pāli) · `āsavā` → *Lậu Hoặc* (tên bài `Āsavasutta`; `dn33:2.1.25` cũng dùng *lậu hoặc*) · `dāruhatthi` → *Cây Đứng Trong Rừng*; tôi **không** giữ chữ Pāli `dāruhatthi` vì đó không phải tên bài nào của `an6` tại commit đã ghim (`an6.59` là `Dārukammikasutta`, đã có bản dịch *Kinh Cùng Dārukammika*) và giữ nó sẽ là tên bịa. `Majjhe` → *Giữa chừng* (tên `Majjhesutta`, `an6.61`) · `ñāṇaṁ nibbedhikaṁ` → *trí tuệ quán thẳng thấm* (`nibbedhika` → *xuyên thấm* ở `dn33:2.1.71`) · `sīhanāda` → *Tiếng Rống Sư Tử*. **Đây là chỗ dễ bị chê nhất của bài**: uddāna ở `an6` không khớp với tên sáu bài thật của phẩm, và tôi dịch nghĩa chữ thay vì sửa danh sách.
  **Dấu lược.** `3.2`, `4.1`, `4.2`, `5.1`, `5.2`, `6.1`, `6.2`, `13.6` mỗi khoá một dấu; `12.2` có **hai** dấu (Pāli lặp `…pe…` ở cả vế trước và vế sau) và bản Việt giữ hai. Không mở rộng ở chỗ nào; Sujato **mở rộng** `4.1`, `5.1`, `6.1`, `12.1` thành văn xuôi đầy đủ, tôi giữ lược.
