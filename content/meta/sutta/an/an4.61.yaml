    **Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan).** Đọc đối kháng đủ 81 khoá Pāli↔Việt; đổi 57 khoá, giữ nguyên tập khoá và thứ tự. Bản chấm trước (9.51) không có ghi chú và đã bỏ lọt các lỗi dưới đây nên bị hạ lại cho đúng sự thật.

    **Lệch khoá (như an5.58).** `19.1`–`19.2` (kệ): trước đây `19.1` mang *bậc trí cư sĩ* của Pāli `19.2` còn `19.2` mang *mong muốn được tài sản* của Pāli `19.1`. Đã căn lại: `19.1` Yadatthaṁ bhogaṁ iccheyya → *Vì mục đích nào mà mong cầu tài sản*, `19.2` paṇḍito gharamāvasaṁ → *bậc trí sống tại gia* (cũng bỏ *cư sĩ*, thêm căn cứ từ gharamāvasaṁ). Các khoá kệ còn lại (`18.1`–`18.6`, `19.3`–`19.4`, `20.1`–`20.5`) đã đối từng khoá, khớp. Cùng lỗi lệch khoá ở bài song song an5.41 (`8.1`–`8.2`) nằm ngoài phạm vi lượt này, chỉ báo.

    **Sai nghĩa / bỏ sót (accuracy).**
    - `10.3`, `10.5`, `10.7`, `10.9`, `10.11`: yasā ca sukhā ca dhaṁsati: yasā, sukhā là dạng cách xuất xứ (ablative), dhaṁsati nghĩa *rơi khỏi, đánh mất*; bản cũ lấy danh xưng và hạnh phúc làm chủ ngữ (*bị tan rã*). Đã đổi thành *người ấy rơi khỏi danh tiếng và hạnh phúc*. Bản Anh đã ghim hiểu theo chủ ngữ; chọn theo ngữ pháp Pāli, ghi chỗ khác biệt này.
    - `14.1`, `15.1`, `16.1`: thiếu Puna caparaṁ, thêm *Lại nữa*. `14.1` trước đó viết *làm cho các tai họa … — các tai họa ấy được đề phòng* (không có chủ ngữ rõ, lẫn *như* mở danh sách vốn đóng); viết lại: *trước những tai họa nào đến từ hỏa hoạn, lũ lụt, nhà vua, trộm cướp hay người thừa kế không thương mến, vị ấy dùng tài sản che chở trước những tai họa như thế* (pariyodhāya saṁvattati).
    - `6.1`, `12.8`: câu cũ *để đạt được bốn pháp ấy được ưa thích…* lỗi cú pháp; viết lại theo genitive Imesaṁ … catunnaṁ dhammānaṁ.
    - `17.1`: *này* gắn nhầm vào *tài sản*; Pāli là imāni cattāri pattakammāni (*bốn việc xứng đáng này*). `13.1` bỏ *xứng đáng với tài sản* (sai chỗ gắn).
    - `16.1`: *kiêu mạn* (madappamādā) không đúng; mada là *say sưa* (dn26 *tránh say sưa, phóng dật*; sn/an *say sưa*): đổi *từ bỏ say sưa và phóng dật*. Ekamattānaṁ *một mình* → *riêng mình* theo đúng công thức an7.47; parinibbāpenti *tự chứng Niết-bàn* → *tự đưa riêng mình đến tịch diệt*; thêm tathārūpesu (*những Sa-môn Bà-la-môn như thế*); sovaggikaṁ *thuộc về cõi trời* tách khỏi saggasaṁvattanikaṁ *dẫn đến cõi trời* (trước lặp cả hai là *cõi trời*).
    - `8.2`: …pe… trước bị bung ra thành năm giới; Pāli có …pe… nên phải là một dấu lược: *từ bỏ sát sinh … từ bỏ uống rượu men rượu cất các thứ gây say* (cùng cách an4.53:6.3).
    - `18.2` *mất mát* → *tai họa* (āpadā, đã là *tai họa* ở `14.1`); thêm *tôi* cho me.
    - `12.2`–`12.5`: trước bỏ iti viditvā; khôi phục *biết như vầy … và sự nhiễm ô ấy của tâm … đã được từ bỏ*; `12.6` bỏ nháy và đặt *thì vị này được gọi* (Pāli không có nháy). `11.1` sửa lặp *biết như vầy … sau khi biết như vậy* (Pāli chỉ một iti viditvā).
    - `13.4`–`13.6`: câu cụt viết thường sau dấu chấm; thêm chủ ngữ *Vị ấy*. `13.5` *vợ chồng* → *vợ con* (dāra = vợ; tiền lệ sn3.19, dn2).

    **Thuật ngữ, đo bằng số đếm trên toàn tầng.**
    - `yaso`: *danh tiếng* 119, *danh vọng* 25, *danh xưng* 13 (159 khoá) → bỏ *danh xưng* (`3.1`, `4.1`, `5.1`).
    - `lokasmiṁ` trong cụm dullabha: bài tự mâu thuẫn (*thế gian* 2.1, 5.2; *thế giới* 2.3, 3.1, 4.1, 5.1, 6.1); toàn tầng *thế gian* 139 so với *thế giới* 54 → thống nhất *thế gian*.
    - `sahadhammena`: *phương tiện chính đáng* chỉ có ở bài này; *chính đáng* 23, *theo pháp* 15, *hợp pháp* 11 → *một cách chính đáng*. `uppajjantu` → *sinh khởi* (iti76:2.3).
    - `sampadā`: *giới thành tựu* ngược với an8.54, an8.55, an8.76, an3.117 (*thành tựu giới*, *Thế nào, này X, là thành tựu …*); đổi toàn bài (`6.3`, `7.1`–`10.1`, `7.4`–`12.7`). Katamā ca: *Và nào là* → *Và thế nào* (toàn tầng *Thế nào* 82 chỗ, *Và thế nào* 21 chỗ; *Và nào là* rải rác ở vài bài khác).
    - `sugatiṁ saggaṁ lokaṁ`: trong AN *thiện thú* 51, *cõi lành* 7, *thiện xứ* 6 → *thiện thú, cõi trời*; kāyassa bhedā paraṁ maraṇā *thân hoại mạng chung* (đa số); upapajjāmi *sinh vào*. `dīghamāyuṁ pālemi`: *sống được dài tuổi thọ* → *giữ được tuổi thọ dài* (dn30:1.11.3).
    - Công thức uṭṭhānavīriyādhigata…: bỏ *bị mồ hôi chảy ròng, được đạt theo pháp, được đạt bằng pháp* (6 chỗ, chỉ bài này), dùng dạng đa số *do nỗ lực tinh cần mà đạt được, do sức mạnh cánh tay mà tích tụ, do mồ hôi đổ ra mà có, hợp pháp, có được đúng pháp* (an4.62).
    - Công thức cāga (`9.2`): đổi sang dạng an8.54, an8.55, an3.42, an3.79 (*tâm đã rời bỏ ô nhiễm keo kiệt … sẵn sàng đáp lại lời xin, ưa thích bố thí và chia sẻ*); *sẵn sàng cho xin* mơ hồ, *phân chia cúng dường* sai nghĩa dāna.
    - `uddhagga`: *hướng thượng* (sn3.19, dn2, dn26) thay *cao thượng*. `puthupañño`: *quảng trí tuệ* (sn2.29, mn111) thay *nhiều trí*.
    - `abhijjhāvisamalobha`: *tham lam bất thiện* không có tiền lệ cho visamalobha (dn26 và pe5 *tham lam bất chính*; an3.56 *tham bất công*; mn7 *tà tham*) → *tham lam bất chính* ở `10.2`, `11.1`, `12.1`.
    - `ṭhānagata / pattagata / āyatanaso`: *nằm trong phương tiện* không có căn cứ từ ṭhāna (mil5.1.6 ṭhānagataṁ *đến đúng chỗ*) → *đã đến đúng chỗ, đã đến nơi xứng đáng, được dùng hợp với hoàn cảnh* (`13.7`, `14.3`, `15.3`, `16.2`, `17.2`, `17.3`). Các nháy ‘…’ quanh *tài sản được dùng …* ở `17.2`–`17.3` và quanh danh hiệu ở `12.6` đã bỏ vì Pāli không có.

    **Cặp Pāli trùng nguyên văn trong bài.** 2 nhóm (`2.2`≡`6.2`; `10.3`≡`10.5`≡`10.7`≡`10.9`≡`10.11`), 0 cặp Việt khác. Với các bài khác: công thức đã dò theo từng cụm Pāli, số đếm ghi ở mục thuật ngữ.

    **Bất định còn lại (không đoán).**
    - `12.6` āpātadaso: chỉ gặp ở bài này trong toàn Pāli ghim (căn gần āpāta, āpātamupagacchati *đi vào tầm, đi tới*); bản cũ *thấy rõ lợi hại* là diễn giải không có căn cứ nên bỏ, hiện *thấy được điều hiện đến* và vẫn là cách đọc sát chữ chưa phân xử được; Sujato (*sees what matters*) và Thích Minh Châu (*giới vức minh kiến*) khác nhau.
    - ṭhānagata, pattagata, āyatanaso (xem trên): chỉ tìm được tiền lệ từ Milindapañha cho ṭhānagata; hai từ còn lại giữ cách cũ *xứng đáng, hợp với hoàn cảnh*.
    - abhijjhāvisamalobha: hiểu như một mục (*tham lam bất chính*), là mục đầu trong năm chướng ngại của bài; nếu là hai mục (abhijjhā và visamalobha) thì cần tách.
    - `10.3`: dhaṁsati với cách xuất xứ chọn theo ngữ pháp; bản Anh đã ghim hiểu khác.
    - Pāli các khoá `2.3`–`5.1`, `11.1`–`12.5`, `18.1`, `19.4` không có dấu nháy, bản Việt giữ nháy ‘…’ theo dấu ’ti của Pāli và để tách lời tự nhắc của đệ tử trong kệ (xưng *tôi*, không phải Đức Phật).
    - Phần dịch Anh lấp (7 khoá `10.5`, `10.7`, `10.9`, `12.2`–`12.5`) do dự án làm, không phải bản Anh độc lập.

