notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 20/23 = 87% (≥ ngưỡng 0,8).** Ba khoá Sujato để trống là `2.20`, `3.11`, `4.7` (nhắc lại câu hỏi ở `2.16`, `3.7`, `4.3`); lớp lấp `english-project` có bù ba khoá này, nhưng tôi **không** dùng bản lấp ấy làm tầng đối chiếu độc lập. Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ phân phối Pháp Cú), nên `triangulation` 9.0; `budsas.org` chỉ là tra cứu toàn văn, không dựng cột. Không cần entry `reference-gaps` vì coverage đạt ngưỡng.
  **Pāli trùng nguyên văn trong chính bài: 5 nhóm, 15 khoá** (`2.14`=`3.1`=`4.1`, `2.15`=`3.2`=`4.2`, `2.17`=`3.8`=`4.4`, `2.18`=`3.9`=`4.5`, `2.19`=`3.10`=`4.6`); bản Việt của mỗi nhóm **giống nhau từng chữ** (0 cặp lệch). Dùng lại nguyên văn từ `an6.18` (cùng phẩm, cùng công thức): `2.14` ← `an6.18:3.1` (bỏ nháy mở vì Pāli ở đây không có `“`), `2.15` ← `an6.18:2.2`, `2.17` ← `an6.18:2.4` (*Bạch Thế Tôn, không.*), `2.18` ← `an6.18:2.5` (*Lành thay, các tỳ-kheo!*), `2.19` ← `an6.18:2.6`; `0.2` = `an6.11:0.2`.
  **Thuật ngữ, đã dò tiền lệ.** `Sādhu, bhikkhave` → *Lành thay* (`an5.178` 5 bản, `an6.18` 3 bản, so với *Tốt đẹp* 1 bản) · `seyyasukhaṁ passasukhaṁ middhasukhaṁ` → *thú vui nằm giường, thú vui ngả lưng và thú vui ngủ nghỉ* (4 bản `an5.206`, `an9.72`, `an10.14`, so với 1 bản `an7.61`) · `dhammavinaya` → *Giáo Pháp và Giới Luật* (`an5.114`, `an3.22`) · `navā acirapabbajitā adhunāgatā` → *còn trẻ, xuất gia chưa lâu, mới đến* (`an5.114`) · `upaṭṭhānasālā` → *giảng đường* (`an4.48`, `an4.195`) · `dibbena cakkhunā visuddhena atikkantamānusakena` → *thiên nhãn thanh tịnh vượt trên mắt người* (`an3.58`, `an3.101`, `an3.129`) · `bhojane mattaññū` → *biết chừng mực trong ăn uống* (cạnh `an4.37`, `an3.16`) · `jāgariyaṁ anuyutto` → *chuyên cần tỉnh thức* (`an3.16`) · `vipassako kusalānaṁ dhammānaṁ` → *quán sát các pháp thiện* (`an5.56`) · `bodhipakkhiyānaṁ dhammānaṁ … pubbarattāpararattaṁ` → *các pháp thuộc về giác ngộ trong đêm đầu và đêm sau* (`an5.56`) · `muddhāvasitto` → *đã được rót nước lễ* (`an3.12`, `an3.13`) · `piyo manāpo` → *yêu mến, ưa thích* (`an5.135`) · `anāsavaṁ cetovimuttiṁ paññāvimuttiṁ` → *giải thoát tâm không lậu hoặc, giải thoát tuệ* (`an3.86`, `an5.87`). `indriyesu aguttadvāro` 0 bản trong tầng: tôi dịch *không hộ trì cửa các căn* theo `an4.37` (*hộ trì các cửa của các căn*). `raṭṭhiko`, `pettaṇiko`, `pūgagāmaṇiko` không có tiền lệ ở dạng đơn; theo `an5.58` (*quan lại được bổ nhiệm hay thế tập*, *trưởng đoàn thể*) và tách thành *quan được bổ nhiệm*, *quan thế tập*, *trưởng đoàn thể*. Tên tôn giả giữ đúng dạng Pāli của bài, gồm `Mahākoṭṭhika`.
  **Bất định, ghi tại đây chứ không thêm vào thân kinh.** (1) `2.13` `Tena no tumhe, bhikkhave, therā bhikkhū nāgatāti …` hàm `nāgatā` (= `na āgatā`) và `tena no` có thể đọc nhiều cách; tôi dịch sát chữ: *phải chăng vì các trưởng lão tỳ-kheo không đến mà các ông ngủ ngáy…*. Sujato diễn là *khi các trưởng lão rời đi, vì sao các ông ngủ…*. Tôi không chọn theo Sujato vì Pāli không có chữ nào nói "rời đi" ở khoá này; hai cách đọc cùng dẫn đến lời quở trách, không đổi giáo nghĩa của bài. (2) `4.3`, `4.7`: Pāli chỉ nối một chuỗi phân từ (…`ananuyutto … viharanto`); tôi thêm liên từ *mà vẫn* trước mệnh đề lậu tận để câu Việt đọc được, theo đúng sắc thái *Yet* của Sujato. (3) `3.11` có chữ `vā` thừa giữa `pūgagāmaṇikattaṁ` và `kārento` mà `3.7` không có; tôi dịch cùng một công thức với `3.7`, không dịch `vā` ấy (lớp lấp `english-project` dịch thành *either … or*, tôi không theo). (4) `1.4`–`1.11`: Pāli chỉ để `…` sau tên từng tôn giả (công thức của `1.3`); tôi giữ đúng một dấu `…` và thêm *cũng vậy* từ chữ `āyasmāpi kho` của Pāli; không mở rộng công thức.
  **Dấu câu.** Nháy `“ ” ‘ ’` **khớp Pāli từng khoá** (0 lệch trên 63 khoá). Ngoặc kép của Pāli cố ý để mở ở `2.13`, `2.18`, `3.9`, `4.5` và đóng ở `2.16`, `3.7`, `4.3`: tôi theo đúng như vậy, không tự cân. `…pe…` ở `3.3` thành đúng một `…`; Pāli không có `…` thì Việt không có (0 lệch).
  **Số Pāli:** bài không có số lượng cần tính.
