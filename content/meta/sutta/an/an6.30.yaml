notes: |-
  Dịch trọn 67/67 khoá Pāli (đủ khoá, đúng thứ tự Pāli). Đối chiếu Pāli root, bản Anh Sujato đã ghim và bản toàn văn của Hòa thượng Thích Minh Châu (nguyên bài, không phân đoạn, chỉ để tra thuật ngữ). Không có tầng Việt hiện hành theo segment cho bài này trong snapshot đã ghim.
  Coverage English đo thật: bản Sujato phủ 37/37 khoá Pāli có nội dung (>= 40 ký tự) = 1,00; bản Anh rút gọn bằng dấu … ở 3.4, 3.5, 4.4, 4.5, 5.4, 5.5, 6.4, 6.5, 7.5 (khoá vẫn có chữ nên vẫn tính là phủ), trong khi Pāli viết đủ ở mọi khoá trừ 6.4; bản Việt dịch đủ từ Pāli, không theo chỗ rút gọn của bản Anh. Không dùng tầng english-project; không cần ghi nhận gap.
  Số Pāli: cha = sáu (1.1, 1.2, 8.1); tatiyo = thứ ba; dasamaṁ = thứ mười; dve (12.3) = hai. Không có số lớn.
  Dấu lược: 6.4 là khoá duy nhất có …pe… ở Pāli, bản Việt giữ đúng một dấu … ở giữa câu; không khoá nào khác có dấu lược. Nháy kép khớp Pāli từng khoá (mở ở 1.1, đóng ở 11.4).
  Bất định 1 (2.3, 3.3, 4.3, 5.3, 6.3, 7.3): Pāli atthetaṁ … netaṁ natthīti vadāmi đọc theo nghĩa đen là có cái ấy, Ta không nói là không có (khớp bản Anh Sujato và tiền lệ dn1, sn21.10 trong tầng). Bản Thích Minh Châu nguyên bài đọc thành câu hỏi và phủ định (đây có phải là thấy không, Ta nói đây là không thấy), ngược với nghĩa đen Pāli. Chọn đọc theo Pāli; mạch văn vẫn nhất quán: Đức Phật thừa nhận có những cái thấy, nghe, đạt được thế gian ấy, rồi mới nói chúng hạ liệt và không đưa đến Niết-bàn.
  Bất định 2 (11.3): paccenti đọc là đi đến, vì mệnh đề yattha dukkhaṁ nirujjhati ở khoá sau cần một nơi chốn làm đích. Bản Thích Minh Châu đọc là chín muồi (khi thời đã chín muồi); sn55.2:4.3 trong tầng cũng dịch chín muồi cho cùng dạng này nhưng mất tân ngữ. Giữ nghĩa đi đến, ghi nhận cách đọc khác; hai cách đọc đều không đổi nghĩa chung của kệ.
  Bất định 3 (10.1): upaṭṭhitā pāricariyā đọc là an trú trong sự phục vụ (theo Thích Minh Châu). Sujato đọc như một động từ (serve with care). Chọn cách đọc ít giả định hơn.
  Thuật ngữ: anuttariya đặt là vô thượng (45 khoá / 8 bài trong tầng: dn28, dn33, dn34, mn35, mn102, an1.175-186, an10.22, ps1.1; so với vượt trội 4 khoá / 2 bài: an6.8, an6.140). Tên phẩm 3. Phẩm Vượt Trội giữ nguyên theo 10 bài anh em an6.21–an6.29 nên phần thân bài (vô thượng) và tên phẩm (vượt trội) hiện khác chữ; nên thống nhất ở lượt sau. lābha đặt là lợi đắc, không theo lợi dưỡng của dn33/dn34, vì ở đây lābha gồm có con, có vợ, có tài sản và có niềm tin chứ không chỉ cúng dường vật dụng. Công thức hīnaṁ gammaṁ pothujjanikaṁ anariyaṁ anatthasaṁhitaṁ → hạ liệt, thô tục, thuộc phàm phu, không thuộc bậc Thánh, không đem lại lợi ích (13/18 khoá tầng). Công thức na nibbidāya … na nibbānāya saṁvattati → không đưa đến nhàm chán, ly tham, đoạn diệt, an tịnh, thắng trí, giác ngộ và Niết-bàn (đa số tầng). Công thức sokaparidevānaṁ … sacchikiriyāya → vượt qua sầu và bi, chấm dứt khổ và ưu, đạt đến con đường chân chánh và chứng ngộ Niết-bàn (4 khoá cùng dạng ở dn22, mn10). Idaṁ vuccati → Cái này, này các tỳ-kheo, được gọi là (51/115 khoá). tathāgatappavedite dhammavinaye → trong Pháp và Luật do Như Lai tuyên thuyết. Khoá 5.2 dịch học cưỡi voi, cưỡi ngựa, điều khiển xe, bắn cung, đánh kiếm theo cùng công thức ở mn82:38.5 và an5.135:1.7. nipakā → sáng suốt (mn51, sn1.23). Voi báu, ngựa báu, ngọc báu theo dn14, dn30. niviṭṭhasaddho niviṭṭhapemo ekantagato abhippasanno → với niềm tin đã an lập, lòng mến mộ đã an lập, nhất hướng, hoàn toàn tịnh tín (0 tiền lệ cho niviṭṭha; ekantagato abhippasanno theo sn48.50).
  Dùng lại nguyên văn tầng: 11.4 (thag3.3:3.4, thag3.15:3.4), 11.5, 1.2, 0.2, 12.0 (5 khoá). Đã dò 8 cặp Pāli trùng với tầng; 3 cặp bản Việt khác có chủ ý (0.3 tên bài, 1.1 và 11.3, vì an6.8 dùng vượt trội còn sn55.2 đọc chín muồi). Không có Pāli trùng nguyên văn trong chính bài.
  Uddāna 12.1–12.4 dịch theo tên mười bài an6.21–an6.30 trong tầng: Làng Sāma, Không Suy Giảm, Sợ Hãi, Vua Núi, Chỗ Để Tùy Niệm, Ca-chiên-diên, hai kinh Thời Cơ, Udāyī, Vô Thượng. Tên hai kinh samaya trong tầng chưa thống nhất (an6.27 Dịp Thứ Nhất, an6.28 Thời Cơ (Hai)); ở đây chọn Thời Cơ, cần người điều phối thống nhất.
