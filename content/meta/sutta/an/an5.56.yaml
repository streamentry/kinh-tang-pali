notes: |-
  Sửa lan 2026-10-13: khoá `4.2` (`yassatthāya kulaputtā sammadeva agārasmā anagāriyaṁ pabbajanti`): *các nam cư sĩ chơn chánh xuất gia* → *các thiện nam tử chân chánh xuất gia*. Căn cứ: `kulaputta` là *thiện nam tử*, còn *nam cư sĩ* là `upāsaka` — hai từ khác nhau; đo công thức `yassatthāya kulaputtā` trên toàn tầng: 68 khoá, trong đó 52 *thiện nam tử* (36 *thiện nam tử chân chánh*), 12 *con nhà lành*, 1 *người con trai*, 2 khoá không còn chữ ấy, và 1 *nam cư sĩ* — chính khoá này. Đã đồng bộ với `an5.180:7.4` (cùng công thức, đã sửa). Giữ nguyên các khoá còn lại. Điểm không đổi.
