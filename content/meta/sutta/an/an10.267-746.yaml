notes:
  - >-
    **Mười sáu tâm ngư nhân dịch nguyên văn theo `an3.183-352:3.1`–`3.16`**, bài
    song parallel đã dịch: sân · si · sân giận · oán hận · khinh miệt · ngạo mạn
    · ganh ghét · keo kiệt · gian xảo · quỷ quyệt · cứng cỏi · hung hăng · mạn ·
    mạn quá · phóng túng · phóng dật. Mười mục đích phía sau cũng lấy nguyên văn
    `an3.183-352:3.17`–`3.26`.
  - >-
    **`(…)` ở `1.23`** giữ nguyên như ở `an10.240-266:1.8` — dấu bảo bản thảo
    hỏng, không phải lược của người dịch.
  - >-
    `Rāgapeyyālaṁ niṭṭhitaṁ` → "Chuỗi Lặp Tham đã hoàn tất." `Pañcamo paṇṇāsako
    samatto` → "Phần năm mươi kinh thứ năm hoàn tất." (`an4.253:2.5`).
  - >-
    **`Dasakanipātapāḷi niṭṭhitā` → "Kinh Chương Mười Lẻ hoàn tất."** Chưa có
    tiền lệ. Hai tiền lệ gần nhất: `Catukkanipātapāḷi niṭṭhitā` → "Kinh Tăng Chi
    Bộ Chương Bốn Pháp hoàn tất." (`an4.304-783:1.5`) và `Tikanipātapāḷi
    niṭṭhitā` → "Kinh Tương Ứng Ba Chi hoàn tất." (`an3.183-352:8.6`). Theo mô
    hình `Catukka` — chương Mười Lẻ là số thứ tự của tập hợp mười bài, và
    "Chương Mười Lẻ" đọc tự nhiên hơn. Tiền lệ `Tika` → "Ba Chi" không dùng vì
    nghe không xác đáng.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
