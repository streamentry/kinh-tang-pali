  MỘT LỖI CỦA BẢN ĐÃ CÓ, THẤY KHI TRA TIỀN LỆ — ĐÃ DỰNG LẠI TỪ PĀLI, KHÔNG
  SAO CHÉP: `ud1.9:1.2` có Pāli gần trùng `Ekaṁ samayaṁ bhagavā gayāyaṁ viharati
  gayāsīse.` nhưng dịch `gayāsīse` thành "đỉnh Gayā", **mất chữ `sīsa`**. Câu 1.1 ở
  đây viết "trên ngọn đồi Gayāsīsa", theo `sn35.28:1.1`.

