  DÙNG LẠI NGUYÊN VĂN — 18/53 khoá (6 nhóm Pāli trùng nguyên văn TRONG CHÍNH bài,
  mỗi nhóm một bản Việt duy nhất): 4 khoá `Tassa mayhaṁ, bhikkhave, etadahosi:`
  (2.1/4.1/6.1/8.1); 4 khoá `evaṁ me idaṁ ñāṇadassanaṁ parisuddhataraṁ assā’ti.`
  (2.3/4.3/6.4/8.7); 3 khoá `no ca kho tā devatā jānāmi:` (7.3/7.7/7.11); 3 khoá
  `tā ca devatā jānāmi:` (7.5/7.9/7.13); 2 khoá `So kho ahaṁ … tā ca devatā
  jānāmi:` (7.1/9.1); 2 khoá `‘sace kho ahaṁ … tā ca devatā jāneyyaṁ:` (6.2/8.2).
  Ngoài bài: 6 khoá "7. Phẩm Đất Nền" dùng lại từ cả 6 bài anh em cùng phẩm
  (an8.63, an8.65–69); cụm `sadevake loke … sadevamanussāya anuttaraṁ sammāsambodhiṁ
  abhisambuddho` và `ñāṇañca pana me dassanaṁ udapādi` dùng lại từ an3.103:1.7/1.8,
  an3.104:1.7/1.8, an3.103:1.9 (cùng bộ, cùng công thức, 4+1 khoá).

