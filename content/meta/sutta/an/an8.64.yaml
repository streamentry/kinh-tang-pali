  `’ti`/`”ti`, giữ nguyên dấu nháy. (Ghi rõ: hai lát đợt trước cho hai kết luận
  trái chiều ở hai phạm vi; ở đây tự đo lại và hai phạm vi đều nghiêng BỎ.)
  Quy tắc dấu lược cũng đo lại, không tin sẵn: 6.322 khoá có cả Pāli lẫn Việt với
  `…pe…` trong Pāli ⇒ **92,7%** giữ đúng một `…`, **98,3%** giữ ít nhất một.

  BẮT ĐƯỢC 3 LỖI Ở LƯỢT REVIEW ĐỐI KHÁNG, ĐÃ SỬA:
  1. `imassa kammassa vipākena` — bản nháp viết "nghiệp nào" theo Sujato, tức **thêm
     dấu hỏi mà Pāli không có** (`imassa` là từ chỉ không xác định, không phải dạng
     hỏi). Đã sửa thành "do quả báo của nghiệp ấy"; `mn86:17.7` đã dịch nguyên văn
     cụm **có** hỏi `yassa kho tvaṁ … kammassa vipākena` thành "do quả của nghiệp ấy".
     Lớp lấp Anh cũng đọc `imassa` là không xác định (viết "such deeds"), nên hai
     lớp cùng chiều sau khi sửa.
  2. `ito cutā tattha upapannā` — "từ nơi này mất đi" quá nhẹ. Đã sửa thành "từ chỗ
     này tận diệt, sinh ở chỗ kia", theo `an6.25:6.3` (cùng bộ, cũng nói về devatā:
     "khi từ chỗ này tận diệt đã sinh lại ở chỗ kia") và `dn25:18.13`.
  3. `evamāhārā` — bản nháp coi là hapax và dịch theo nghĩa `mahā`. tra lại toàn kho
     thì **không phải hapax**: cục gần trùng `evamāhāro evaṁsukhadukkhappaṭisaṁvedī
     evamāyupariyanto` có ở khoảng 25 khoá đã dịch (`dn25:18.13`, `dn28:15.11`,
     `dn28:16.4`, `dn1:1.31.2`, `dn1:1.32.3`, `an3.58:5.2`, `mn51:24.2`,
     `iti99:3.2`, `sn16.9:13.1`…) và đều dịch `evamāhāro` = "thức ăn như vậy"/"ăn
     uống như vậy", `evaṁsukhadukkhappaṭisaṁvedī` = "cảm thọ lạc khổ như vậy". Đã sửa
     thành "có thức ăn như vậy, cảm thọ lạc khổ như vậy" ở 7.8/7.10/8.5/9.4.

  BẤT ĐỊNH CÒN LẠI (không đủ làm blocking, vì không đổi giáo nghĩa):
  · `amukamhā vā amukamhā vā devanikāyā` là hapax toàn kho (5 khoá, 1 bài = chính
    an8.64) ⇒ không có tiền lệ Việt. Hai cách đọc đều có người theo: **hỏi**
    ("thuộc về phương nào, hay ở cõi thiên nào" — `amukamhā` có tối thiểu `ka` mà
    để hỏi; Sujato đọc "which orders of gods") và **không xác định**
    (lớp lấp `english-project` đã `published` viết "such-and-such an order of gods",
    còn chú giải lớp đó tự ghi "amuka → such-and-such (dn9, dn23 đã đếm)"). Bản
    canonical CHỌN CÁCH HỎI vì đó là nghĩa hình thái của `amukamhā`, và **giữ cả
    cụm trong dấu nháy** nên câu hỏi vẫn hiện ra với người đọc chứ không bị chốt
    thành khẳng định. Người biên tập có thể đảo sang cách không xác định cho cả 5
    khoá (5.3, 6.3, 7.2, 8.3, 9.2) nếu muốn nhất quán với lớp lấp Anh.
  · `aṭṭhaparivaṭṭa` cũng là hapax toàn kho (2 khoá, 1 bài); tầng Việt chỉ có "tám
    lần" đúng 1 lần ⇒ tự đặt "tám đợt", không có tiền lệ để dựa.
  · `adhidevañāṇadassana` chỉ có ở an8.64 và `cnd22`; `cnd22` chưa dịch ⇒ dịch mới
    "tri kiến của Ta về các vị thiên".

