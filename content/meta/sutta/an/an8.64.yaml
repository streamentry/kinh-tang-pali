  DẤU `ti` — ĐO CẢ HAI PHẠM VI, CÙNG CHIỀU, NÊN BỎ. Pāli kết bằng `’ti`/`”ti` mà
  có bản Việt: toàn tầng **22.585** khoá ⇒ BỎ **18.112 (80,2%)** vs GIỮ **3.567
