notes: |-
  Nguồn: Pāli đọc từ snapshot đã ghim, 197 khoá (cả 197 đều có trong bản dịch, thứ tự khoá trùng thứ tự Pāli, không có khoá ngoài Pāli). Tầng Anh đã ghim có tệp trên đĩa: `sutta/an/an10/an10.24_translation-en-sujato.json`, đường dẫn bộ an là PHẲNG theo chương. Bài là một khuôn lặp: sáu khối 2–4 và 6–9, 11 cùng một chuỗi mười phiền não, nên 128 khoá Pāli mang dấu lược `…` được giữ đúng một `…` ở bản Việt (128/128 khoá khớp số dấu lược; số nháy đơn và nháy kép khớp Pāli ở cả 197 khoá).
  COVERAGE TẦNG ANH, đo theo ngưỡng `substantivePaliMinChars: 40` của `source/layers.yaml` và bỏ khối `:0`: 63 khoá Pāli có nội dung, Sujato có prose ở cả 63 ⇒ 63/63 = 1,0, trên ngưỡng 0,8. Các khoá Pāli ngắn hơn 40 ký tự (danh sách `doso …`, `moho …`, v.v.) không vào mẫu số, nhưng Sujato cũng có prose ở chúng. Chỉ khoá `11.23` (Catutthaṁ., bộ đếm) là Sujato để trống. Không có lớp `english-project` cho bài này và không cần tạo, vì không còn khoá nào để lấp; không có SHADOWING. Vì thế toàn bộ đoạn có nội dung đều được đối chiếu với bản Anh đã ghim một cách độc lập, và triangulation không bị hạ vì lý do lớp lấp do cùng một người viết.
  Bản Việt hiện hành ở tầng segment (bilara) chỉ có Pháp Cú, nên bài này không có tham khảo Việt truyền thống ở mức segment. Bản Hòa thượng Thích Minh Châu nguyên bài (tra cứu toàn văn, không căn lề vào segment) được đọc để đối chiếu thuật ngữ và cấu trúc lập luận; mọi lựa chọn dưới đây được đo bằng tiền lệ trong chính tầng `vietnamese-project`.
  Tiền lệ nguyên văn: đã dò 1.238 cặp (khoá Pāli trùng nguyên văn với một khoá khác đã có bản Việt trong tầng, tính trên 9 khoá của bài) và 433 cặp bản Việt khác. Gần như toàn bộ chênh lệch là câu ngắn có nhiều cách dịch song song trong tầng: `5.5` và `10.5` Taṁ kissa hetu? viết Vì sao vậy? theo dạng đa số (308 khoá toàn tầng), `1.3` “āvuso bhikkhave”ti viết Này các hiền giả tỳ-kheo! theo mn3, mn5, mn9, mn28, mn141, sn21.1, sn40.1, và `11.23` Catutthaṁ. viết Thứ tư. theo đa số của bộ an (108 khoá, so với Thứ bốn 19). `0.3`, `1.2`, `1.5` khác `an6.46` vì đó là bài khác của Tôn giả Mahācunda mang chữ Trưởng lão; bài này giữ Tôn giả như mn144 và sn46.16. Trong chính bài, 26 nhóm Pāli trùng nguyên văn (150 cặp) đều có bản Việt GIỐNG HỆT, 0 cặp lệch.
  THUẬT NGỮ, kèm số đếm đo trên toàn tầng (khoá Pāli có chứa từ đó) và bám cách chọn đã dùng ở `an10.23` cho cùng danh sách phiền não, để hai bài liền kề đọc giống nhau: `lobho` tham, `doso` sân, `moho` si. `kodho` giận 130, phẫn nộ 53, giận dữ 50, sân hận 38 ⇒ giận dữ, giống `an10.23`. `upanāho` oán hận 20, hằn học 19, hiềm hận 12 ⇒ hiềm hận, theo an9.62 và an10.100 (cùng danh sách, cùng Pāli). `makkho` gièm pha 17 (khoá có từ này gần như chỉ có cách dịch đó) ⇒ gièm pha. `paḷāso` khinh miệt 19, ngạo mạn 10, hơn thua 9 ⇒ khinh miệt; hai từ makkho và paḷāso cùng đứng trong một danh sách nên không thể cùng dịch một chữ. Sujato dịch disdain và contempt. `macchariyaṁ` keo kiệt 56, xan tham 5 ⇒ keo kiệt. `pāpikā issā` ganh tị xấu và `pāpikā icchā` ham muốn xấu (mn40 dùng ham muốn xấu cho cùng cụm `pāpikā icchā`; ác dục 14 khoá nhưng phần lớn là `pāpiccha` ở bài khác; Thích Minh Châu dùng ác tật đố và ác dục) — hai từ đi cặp để người đọc thấy cùng một chữ xấu. `bhāvitakāyo bhāvitasīlo bhāvitacitto bhāvitapañño` tu tập thân, giới, tâm, tuệ (`bhāvit-` tu tập 23 khoá so với phát triển 9; an3.100 dùng phát triển nhưng bhāvanā ở bộ an dịch tu tập 38 khoá), `bhāvanāvādaṁ` tuyên bố về sự tu tập, `ñāṇavādaṁ` tuyên bố về trí theo dn24 (ñāṇavādo tuyên bố mình có trí tuệ). `aḍḍha` giàu có, `daliddo` nghèo khó theo mn96 và mn66. `dhana` đều dịch tiền của (cùng chữ ở `dhanaṁ vā dhaññaṁ vā rajataṁ vā jātarūpaṁ vā` tiền của, lúa gạo, bạc hay vàng theo mn54), `bhoga` của cải. `taṁ kissa hetu?` Vì sao vậy?
  Số Pāli: bài không có số lượng nào cần tính (không có từ chỉ số ngoài số thứ tự `Catutthaṁ`, dịch Thứ tư).
  `:0.1` Kinh Tăng Chi Bộ 10.24 theo an10.21 và an10.22. `:0.2` `3. Mahāvagga` ⇒ `3. Phẩm Lớn`, theo an10.21. `:0.3` `Mahācundasutta` ⇒ Kinh Mahācunda (tên riêng giữ nguyên Pāli như mn144 và sn46.16 giữ Mahācunda); `an6.46:0.3` dịch Kinh Trưởng Lão Mahācunda cho một bài khác cùng tên nên không áp dụng. Sujato dịch By Mahācunda.
  `Cetīsu … Sahajātiyaṁ` (`1.1`): 0 khoá tiền lệ. Dịch ở giữa người Cetī, tại Sahajāti (Cetī là nhóm dân, Sahajāti là thị trấn, hình thái số nhiều định vị cách của `cetīsu`); Sujato dịch in the land of the Cetīs at Sahajāti.
  BẤT ĐỊNH 1 — `abhibhuyya tiṭṭhati` (2.3, 2.12, 3.3, 3.12, 4.3, 4.12, 6.3, 6.12 và 2.13, 2.22 và các khoá tương ứng của khối 3, 4, 6; vế phủ định `nābhibhuyya tiṭṭhati` ở 7–9 và 11). Dịch chế ngự vị ấy và tồn tại, theo Thích Minh Châu (chinh phục … và tồn tại) và theo cách Sujato đọc (masters … and keeps going), vì đây là cụm không có tiền lệ nào trong tầng (0 khoá toàn tầng cho cặp này; `an10.23` dùng `abhibhuyya iriyati` là động từ khác). Ở vế phủ định bản này viết không chế ngự … và không tồn tại, giữ cả hai động từ bị phủ định, giống cách `an10.23` xử lý `nābhibhuyya iriyati`; nếu người biên tập hiểu phủ định chỉ rơi vào `abhibhuyya` (tham vẫn có nhưng không chế ngự được) thì có thể đổi, và phải đổi đồng thời ở 7.3, 7.12, 7.13, 7.22 và các khoá tương ứng của khối 8, 9, 11 (16 khoá). Hai cách đọc không làm đổi kết luận của kinh (tham, sân… có mặt thì chứng tỏ chưa hiểu biết đúng; không chế ngự được thì chứng tỏ có hiểu biết).
  BẤT ĐỊNH 2 — `nāyamāyasmā tathā pajānāti yathā pajānato lobho na hoti` (2.13 và các khoá song song). Dịch sát: vị tôn giả này không hiểu biết theo cách mà người hiểu biết như vậy thì không có tham. Sujato diễn nghĩa thành has the understanding that would eliminate greed; bản này không thêm động từ eliminate vì Pāli chỉ nói `lobho na hoti` (tham không có). `tathāhimaṁ` dịch chính vì thế, nối hai vế thành quan hệ chứng cứ (suy ra từ việc tham đang chế ngự), không phải quan hệ nguyên nhân tự nhiên.
  BẤT ĐỊNH 3 — `aḍḍhavādaṁ vadeyya, dhanavāvādaṁ vadeyya, bhogavāvādaṁ vadeyya` (5.1, 10.1). Ba cụm dịch tuyên bố mình giàu có / có tiền của / có của cải để giữ ba từ riêng của Pāli (`aḍḍha`, `dhanavā`, `bhogavā`); Sujato gom thành rich, affluent, and wealthy.
  Ghi chú về cổng kỹ thuật: bản này tự đo các phép đối chiếu Pāli–Việt (đủ khoá, thứ tự khoá, nháy, dấu lược, NFC, Pāli lọt sang Việt, cặp Pāli trùng) và đều sạch, nhưng KHÔNG chạy được bốn lệnh cổng của kho trong phiên này: `npm run validate`, `npm test`, `npm run check`, `npm run build` đều chưa chạy; vì vậy `technical_integrity` đặt 9,6 chứ không tuyên bố technical gate pass.
