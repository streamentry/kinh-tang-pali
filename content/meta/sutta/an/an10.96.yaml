notes: |-
  Đợt 19, lát lane 23. Dịch từ Pāli root commit 11c9d708, đối chiếu English Sujato đã ghim, lớp english-project của dự án và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không phải tầng segment).

  **Coverage Anh trên Pāli có nội dung (khoá ≥ 40 ký tự, bỏ khối :0): Sujato 26/37 = 70,3%, dưới sàn 0.8.** Sujato để trống 11 khoá: 5.3, 6.3, 7.10 (vế Ānanda đáp lại), 9.2, 10.2 (khung "được hỏi như vậy"), 9.4, 10.4, 11.11 (vế Kokanuda tóm lại), 10.1 (câu hỏi dẫn lại), 11.7, 11.8 (hai khoá trong chuỗi lược). Lớp english-project đã published phủ cả 11 khoá (37/37 = 100% nếu tính hai lớp), nhưng nó do cùng người dịch bài này làm, không phải đọc English độc lập; vì vậy triangulation 7.0 và status draft kèm blocker, theo đúng luật cổng (như sn22.7). Khi có người chấm độc lập cho lớp english-project, đo lại cổng; Pāli và mọi khoá Việt không cần sửa.

  **Công thức `idameva saccaṁ moghamaññaṁ` → "chỉ điều này là thật, ngoài ra đều hư vọng"**: đây là cách dịch của mn72 / mn74 / mn102 / dn9 (72 lần ở 5 tệp). an10.95, bài kế trước trong cùng phẩm, dùng "đây là chân lý duy nhất, những điều khác đều vô nghĩa" (12 lần, 1 tệp). Hai dạng khác nhau giữa hai bài liền kề; bài này theo đa số của tầng. Không sửa an10.95 (ngoài lát); người biên tập nên gộp một dạng cho cả hai bài. Các khoá lặp theo đúng chữ của mn72 (5.3 = mn72:3.4, 6.3 = mn72:4.4, 7.10 = mn72:12.4).

  **`diṭṭhigata` → "kiến chấp"** (13.1, 13.2, 13.10): trong an đo 7 khoá "kiến chấp" so với 1 "tà kiến", và an7.54:2.2 có đúng công thức `‘…’ti kho … diṭṭhigatametaṁ`. `diṭṭhi` trong `evaṁdiṭṭhi` dịch "quan điểm" theo mn72 (đa số tầng). `diṭṭhi` ở 14.1 giữ "kiến chấp" cho cùng nhóm từ.

  **14.1 `yāvatā diṭṭhi yāvatā diṭṭhiṭṭhānaṁ diṭṭhiadhiṭṭhānaṁ diṭṭhipariyuṭṭhānaṁ diṭṭhisamuṭṭhānaṁ diṭṭhisamugghāto`**: bất định về cú pháp. Pāli lặp `yāvatā` hai lần rồi nêu thêm bốn danh từ ghép không có `yāvatā`; Sujato đọc cả chuỗi như một danh sách những điều ông biết. Bản này giữ cách đọc đó: nền tảng (diṭṭhiṭṭhāna), chỗ bám (adhiṭṭhāna), sự ám ảnh (pariyuṭṭhāna), nguồn khởi (samuṭṭhāna), sự nhổ tận gốc (samugghāta). Ba từ đầu lấy theo mn22:20.5 ("nền tảng, chỗ bám, ám ảnh"); `samugghāta` theo dn5:11 ("nhổ tận gốc"); `samuṭṭhāna` "nguồn khởi" theo mn78 ("sinh khởi từ đây").

  **15.7 `ettakampi no nappaṭibhāyeyya`** dịch "chúng tôi đã không nói nhiều đến thế": `paṭibhāyati` nghĩa đen là "hiện ra/đến với (tâm) để nói"; Sujato ("wouldn't have said so much") và bản Việt Thích Minh Châu ("không nói nhiều như vậy") cùng nghĩa. Tầng chưa có tiền lệ cho dạng này.

  **Số ít/số nhiều**: `puccheyyāma mayaṁ`, `vedissāmā`, `jānimha`, `jāneyyāma` đều số nhiều ở Pāli nên dịch "chúng tôi"; `me` ở 15.2 và 15.8 số ít nên "tôi".

  **Thuật ngữ**: `āvuso` → "này hiền giả"; `bho` → "thưa ông"; `āyasmā` (lời người nói gọi Ānanda) → "hiền giả" theo mn24:16.2 (15.1 lấy nguyên văn, chỉ khác viết hoa Pāli); `paribbājaka` → "du sĩ"; `sabrahmacārī` → "đồng phạm hạnh" (257 lần ở 87 tệp); `sakyaputtiya` → "sa-môn con nhà Sakya" (dn24); `tapodā` → "suối nước nóng Tapodā" theo sn1.20:1.2 (cùng công thức `rājagahe viharati tapodārāme`); 1.3 theo mn133:1.4 (`ekacīvaro … gattāni pubbāpayamāno`); `mahācariya` → "bậc thầy lớn" (0 tiền lệ cho dạng này).

  **Tiền lệ Pāli trùng nguyên văn**: đã dò 27 khoá có Pāli trùng với khoá đã dịch ở nơi khác (không tính colophon `Chaṭṭhaṁ`), dùng lại nguyên văn 23, khác 4 (2.2 vì chủ thể đổi sang du sĩ; 9.4, 10.4, 11.11 vì bài này kết bằng `vadesi` "ông nói" mà mn72 không có). Trong chính bài: 18 cặp Pāli trùng nguyên văn, bản Việt khác ở 0 cặp.

  **Dấu nháy**: Pāli 9.1–12.4 là lời kể lại lồng nhiều tầng; từng khoá khớp `“ ” ‘ ’` với Pāli (80/80 khoá). 11.1–11.9 không có dấu nháy trong Pāli (kể cả `bhavanti` ở 11.9 thiếu nháy) nên bản Việt cũng không thêm. `…pe…` ở 7.1, 11.1, 13.3 giữ đúng một `…` mỗi khoá; Pāli không có `(…)`.

