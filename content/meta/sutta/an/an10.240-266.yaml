notes:
  - >-
    Mười mục đích (`pariññāya` … `paṭinissaggāya`) dịch **nguyên văn theo
    `an3.183-352:2.1`–`2.9`**, bài song parallel đã dịch: để hoàn toàn hiểu rõ ·
    để đoạn tận hoàn toàn · để từ bỏ · để đoạn tận · để hủy hoại · để ly tham ·
    để diệt · để xả · để buông bỏ.
  - >-
    **`(…)` ở `1.8` là dấu của soạn thảo, không phải lược của bản gốc** — bản
    Pāli đã ghi sẵn dấu này để báo chỗ bản thảo hỏng. Giữ nguyên `(…)` trong bản
    dịch, vì nếu đổi thành `…` thì người đọc sẽ tưởng đó là lược có chủ ý của
    người dịch. `an3.183-352:1.4` lại dịch `(…)` thành `…`; ở đây theo cách giữ
    dấu hiệu hỏng, và ghi lại khác biệt này.
  - >-
    Các mục từ `1.2` trở đi đứng rời, không có chủ ngữ — đúng như Pāli. Không
    thêm chủ ngữ vào.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
