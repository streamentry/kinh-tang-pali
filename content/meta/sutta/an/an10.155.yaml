notes:
  - >-
    `sevitabbo` → **"gần gũi"**, không phải "thân cận". Đây là bài đặt tiền lệ:
    ở chương 15 tôi dịch `āsevitabba` là "thân cận", và hai từ đó khác nhau —
    `āsevitabba` là *đáng để đi cùng*, `sevitabbo` là *đáng để ở chung*. Tiền lệ
    định hình là `an3.26`, câu gần trùng: `puggalo na sevitabbo na bhajitabbo na
    payirupāsitabbo` → "không nên gần gũi, không nên kết bạn, không nên phụng
    sự". Dùng lại nguyên văn cả ba.
  - >-
    **Danh sách mười điều kiện đã có tiền lệ ở `an10.103`** — cùng danh sách, đã
    dịch: `micchā-` → "tà kiến, tà tư duy, tà ngữ, tà nghiệp, tà mạng, tà tinh
    tấn, tà niệm, tà định, tà trí, tà giải thoát", `sammā-` → cùng danh sách với
    "chánh". Dùng lại nguyên văn, không phát minh.
  - >-
    **`micchāñāṇī` → "có tà trí", `sammāñāṇī` → "có chánh trí".**
    `an4.206:2.2`/`4.2` dùng "tà tri"/"chánh tri"; đó là ngoại lệ đã ghi ở
    `docs/translation-notes/terminology-micchatta-list.md` — đếm cho thấy "tà
    tri" có **0** lần ngoài `an4.206`, còn "tà trí" là tiền lệ của `an10.103`. Ở
    đây theo số đông.
  - >-
    `samannāgato` → "đầy đủ" (574 segment có tiền lệ, so với "hội đủ" 0).
    `puggalo` → "chúng sinh", theo `an3.26` — cùng cấu trúc câu với bài này.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
