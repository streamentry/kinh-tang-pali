notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không phân đoạn).
  **Coverage Anh Sujato trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0` và `:N.0`): 53/53 = 100%.** Sujato không để trống khoá nào có nội dung (khoá `14.3` `Catutthaṁ.` chỉ 10 ký tự nên ngoài mẫu số). Không cần lớp `english-project` và không cần entry trong reference-gaps. Tầng Việt hiện hành phân đoạn vắng ở commit đã ghim (chỉ có Pháp Cú).

  **Chỗ bản Anh lệch Pāli, bản Việt theo Pāli:** `1.2` Sujato viết "left Sāvatthī" nhưng Pāli là `campāya nikkhami` và `1.1` đặt Đức Phật ở Campā ⇒ dịch "rời Campā". `5.2` Sujato bỏ dấu hỏi; bản Việt giữ nghĩa khẳng định (lời buộc tội của du sĩ).

  **Bất định đã ghi, không thêm vào thân kinh:**
  - `1.2` `divā divassa`: bản Thích Minh Châu viết "buổi sáng sớm", Sujato "middle of the day". Tiền lệ trong tầng 7/7 khoá (sn3.19, sn3.20, mn78, mn86, mn88, mn99 ...) dịch "giữa ban ngày"; ngữ cảnh (Đức Phật đang độc cư, `akālo`) cũng hợp với ban ngày. Giữ "giữa ban ngày".
  - `5.2`/`5.7` `venayiko appaññattiko`: hai từ phủ định kép. `venayika` theo tiền lệ mn22:37 dịch "chủ trương đoạn diệt" (2 khoá); `paññatta`/`paññāpeti`/`paññatti` thống nhất "tuyên bố" ở 5.2–5.7 (Sujato dùng "statement"); `sapaññattiko` = "có tuyên bố". Tầng không có tiền lệ cho `appaññattiko`/`sapaññattiko` (0 khoá).
  - `7.3`–`12.2`: năm cặp `tapa` · `samādāna` · `padhāna` · `paṭinissagga` · `vimutti`, mỗi cặp dùng động từ đồng gốc (cognate accusative). Nghĩa đen "mọi sự giải thoát đều nên giải thoát" / "mọi sự từ bỏ đều nên từ bỏ" nghe như mâu thuẫn với giáo lý, nhưng ngữ cảnh (8.1–12.2) cho thấy đây là *các cách thực hành/loại hình* mà hiệu quả được thử bằng tiêu chí "pháp bất thiện tăng trưởng hay suy giảm", không phải Niết-bàn hay sự từ bỏ nói chung. Bản Việt giữ đúng cấu trúc đồng gốc và đúng phạm vi phủ định kép của Pāli, không giải thích thêm; Sujato dịch "all kinds of freedom / everything should be given up", bản Thích Minh Châu "tất cả sự giải thoát nên giải thoát". Cách hiểu `vimutti` ở đây (các loại "giải thoát" được áp dụng/nhận là giải thoát) là ambiguity cần comment, không phải blocker: tiêu chí đạo đức ở 12.1–12.2 đã rõ.
  - `7.4`, `7.6`, `7.8`, `7.10`, `7.12` `sabbaṁ ... na ...`: dịch "không có ... nào nên ...", vì "mọi X đều không nên" tiếng Việt dễ bị đọc thành "không phải mọi X".

  **Tiền lệ có đếm:** `4.4`/`4.5` công thức `sabbaṁ tapaṁ garahati ... ekaṁsena upakkosati upavadati` dùng lại cụm đã dịch ở dn8:2.2 (cùng cụm Pāli, nằm trong câu dẫn khác nên không trùng nguyên khoá); `vibhajjavādo`/`ekaṁsavādo` theo mn99:4.4–4.5; `tuṇhībhūtā maṅkubhūtā pattakkhandhā ...` theo an3.64:6.6 (34 khoá có `maṅkubhūt`); `saṅgamma samāgamma unnādino uccāsaddamahāsaddā ... tiracchānakathaṁ` theo dn25:4.3 ("chuyện phù phiếm" 5 trên 7); `dūratova` 78 khoá; `sandassito samādapito ...` theo an8.24:2.1 (9 khoá); `abhivaḍḍhanti/parihāyanti` "suy giảm" 82 trên 90 khoá hai từ cùng có; `manobhāvanīya` "đáng kính" theo an6.27 (49 khoá); `ārāma` của du sĩ "tu viện" (15 khoá); `Catutthaṁ.` → "Thứ tư." (152 trên 245); `sahadhammena` "một cách chính đáng" (34 khoá, an4.8); `moghapurisā` "kẻ ngu si" (an6.49, an8.63, sn16.13); `Sādhu sādhu` "Lành thay, lành thay" (đa số). Số cặp Pāli trùng nguyên văn trong chính bài: 0 (kiểm bằng so khoá, các cặp 8.x–12.x có cấu trúc song song nhưng khác từ khoá nên bản Việt khác đúng chỗ). Số cặp trùng nguyên văn với bài khác đã dò: 0 (chỉ trùng ở mức câu công thức, đã dùng lại cách dịch).

  `:0.1` "Kinh Tăng Chi Bộ 10.94" theo an10.95/an10.97 cùng phẩm; `:0.2` "10. Phẩm Upāli" theo an10.95/97/98; `:0.3` "Kinh Vajjiyamāhita" (Pāli `Vajjiyamāhitasutta`). Dấu nháy đơn/kép khớp Pāli từng khoá (0 lệch trên 63 khoá); không có `…` ở Pāli nên Việt không có.

