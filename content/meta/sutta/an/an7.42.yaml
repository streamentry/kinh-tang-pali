notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 20/30 = 66,7%**, dưới ngưỡng; xem `blocking_errors`. Tầng `english-project` không có cho uid này. Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708: bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **Vì sao vẫn chấm `triangulation` 8,4 chứ không ≤ 8,0 như bài không có tầng Anh.** Tầng Anh **có** và phủ 20/30 khoá; mười khoá mất là `3.1`–`3.11`, tức lời Sāriputta kể lại gần như nguyên văn những gì ông đã nói ở `1.1`–`1.8`. Tôi đối chiếu cặp trong chính bài nên mười khoá đó vẫn được kiểm bằng Pāli đặt cạnh nhau, không phải đoán. Khác hẳn `mil5.3.8`, ở đó cả tầng đều vắng.
  **7 khoá có Pāli trùng nguyên văn ở bài khác (95 cặp); 5 cặp dùng lại NGUYÊN VĂN.** `0.2` theo 18/18 bản (4. Phẩm Chư Thiên) · `1.1` trùng byte-for-byte `sn28.1:1.2` · `1.2` trùng byte-for-byte `an5.166:5.1` (Bấy giờ, Tôn giả Sāriputta nghĩ:) · `5.1` theo đa số 3/6 cho `Katamāni satta?` · `5.7` theo 49/51 bản cho `Ekādasamaṁ.`
  **2 khoá cố ý dịch khác, ghi lý do.** `1.6` (`Sammodanīyaṁ kathaṁ …`) trùng 8 bản, chia đúng đôi 4–4: *những lời chào hỏi thân thiện và đáng nhớ, ông* và *những lời thân hữu và xã giao, vị ấy*. Tôi theo vế sau nhưng thay *vị ấy* bằng *ngài*, vì Sāriputta ở đây là Tôn giả đã được gọi tên từ `1.1` và `1.2`, còn *vị ấy* để dành cho người chưa định danh. `3.2` trùng 8 bản nhưng các bản đó là Tôn giả Ānanda kể lại chuyện của chính mình (*Rồi con khởi lên nhận thức này:*); ở đây Sāriputta kể với Đức Thế Tôn nên tôi dùng đúng lời `an5.166:5.1` đã có: *Bạch ngài, bấy giờ tôi nghĩ:*
  **Thuật ngữ mới, 0 tiền lệ trong tầng, đặt kèm lý do.** `niddasa` / `niddasavatthu` — grep toàn tầng Việt không có bản nào dịch hai từ này. Tôi chọn *tốt nghiệp* và *tiêu chí tốt nghiệp* vì tiêu đề Sujato của bài là *Graduation (1st)* và `niddasa` là từ chỉ người đã học xong; `brahmacariya` → phạm hạnh (27 tiền lệ). `sikkhāsamādāna` → học tập (`an3.81:1.3`: *thọ trì học giới tăng thượng*) · `dhammanisanti` → thẩm xét giáo pháp · `icchāvinaya` → đoạn tận ham muốn · `paṭisallāna` → nhập xá · `vīriyārambha` → khơi dậy tinh tấn (`an10.69:4.3`) · `satinepakka` → giác chi và thả bỏ · `diṭṭhipaṭivedha` → thắng trí thuyết pháp. `aññatitthiya` → ngoại đạo (123 tiền lệ, và `an7.73:1.1` dịch `titthakara` là *giáo chủ ngoại đạo*).
  **Nhãn.** `niddaso bhikkhū` là một thuật ngữ được Pāli đánh dấu bằng nháy kép bên trong lời thoại; tôi không lồng nháy kép vào trong lời thoại vốn đã mở, mà để thành chữ thường — giữ đúng số từ, không thêm và không bớt ý.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
