notes:
  - >-
    **Sửa lan 2026-10-13:** các khoá `an5.58:13.1`–`13.4` và `14.1`–`14.4` của
    bài kệ trước đây mang nội dung xếp theo trật tự câu English, lệch khỏi từng
    khoá Pāli (ví dụ `14.3` Vittisañjanano hoti mang *cho các sa-môn,
    bà-la-môn*; `13.1` Ubhinnañceva atthāya mang *Người hào phóng, có giới*).
    Đã căn lại theo từng khoá Pāli: `14.3` *cho các sa-môn, bà-la-môn* → *làm
    sinh khởi niềm hoan hỷ* (như `tha-ap469:3.1`, `tha-ap129:4.3`), `14.1` →
    *Đối với các sa-môn, bà-la-môn*, `14.2` → *và cả chư thiên, bậc trí*,
    `14.4` → *khi sống tại gia một cách đúng pháp*, `13.1` → *Vì lợi ích của cả
    hai phía*, `13.2` → *người hào phóng, có giới*, `13.3` → *vì các thân quyến,
    các bậc tổ tiên đã khuất*, `13.4` → *và những ai đang sống ở đời này*.
    Nghĩa cả bài kệ giữ nguyên, chỉ đổi chỗ đặt từng mệnh đề cho khớp khoá.
  - >-
    **Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan):** đọc đối kháng đủ
    60 khoá Pāli↔Việt; đổi 38 khoá, giữ nguyên tập khoá và thứ tự. Các sửa lỗi
    nghĩa (accuracy fix):

    `3.3` `udānaṁ udānesi` dịch "tự thú rằng" (nghĩa là thú nhận lỗi) → "thốt
    lên lời cảm hứng:" (cụm này có 125 khoá trong tầng, đều theo nghĩa cảm
    hứng). `2.1`–`2.2` `sajjāni dhanūni` "đã cài tên" (thêm ý mũi tên) → "đã lên
    dây"; `kukkura` "chó săn" → "chó" (Pāli không nói săn; 36/41 khoá dùng
    "chó"); `parivutā` "hộ tống" → "vây quanh" (71 so với 9).
    `2.2`, `3.1`, `4.6` cụm lặp `tuṇhībhūtā tuṇhībhūtā` chỉ dịch một "lặng lẽ"
    → "hoàn toàn im lặng", đúng cách các khoá cùng cụm lặp (6 trong 10 khoá khác
    dùng "hoàn toàn im lặng"). `4.4` `paheṇakāni pahīyanti` "đồ ngọt được dâng"
    (thêm "ngọt" và "dâng" mà Pāli không có) → "những món quà biếu được gửi đi";
    `modakā` "bánh gối" → "bánh ngọt" (3 tiền lệ: an3.30, thi-ap13; 0 tiền
    lệ cho "bánh gối"). `4.5` "đấm" → "đánh" (Pāli `khipanti` không nói nắm đấm);
    "các gia danh giá" → "trong những gia đình danh giá".

    `5.1`, `5.2`, `6.2`–`11.2`: `kulaputta` "nam cư sĩ" → "thiện nam tử" (98 trên
    123 khoá; Pāli không nói upāsaka, và danh sách ngay sau gồm vua, quan, tướng,
    trưởng làng, không phải toàn cư sĩ). `saṁvijjanti` "đầy đủ" → "có" (cụm này ở
    tầng dịch là "tồn tại/có mặt"; "đầy đủ" chỉ 2 trong 94). `5.2`/`11.2`
    `raṭṭhikassa pettanikassa` "quan lại được bổ nhiệm hay thế tập" (thêm "bổ
    nhiệm"; tách thành hai chức trong khi Pāli chỉ có MỘT `yadi vā` cho cả hai
    từ) → "quan cai quản xứ sở do cha truyền lại"; `paccekādhipaccaṁ kārenti`
    "người tự chủ quyền ... của mình" (số ít, thêm "của mình") → "những ai mỗi
    người nắm quyền riêng trong các gia tộc". Công thức `vuddhiyeva pāṭikaṅkhā,
    no parihāni` "chỉ có sự tăng trưởng được mong chờ, chứ không phải sự suy
    tàn" → "chỉ có thể mong đợi sự tăng trưởng, không phải sự suy giảm" (đúng
    công thức tầng: "suy giảm" 108 so với "suy tàn" 15 trên 370 khoá chứa gốc
    `pāṭikaṅkh`). Công thức tài sản `6.2`, `7.1`, `8.1`, `9.1`, `10.1`: "mồ hôi
    giọt rơi, chính đáng, thuộc pháp" → "do mồ hôi đổ ra mà có, chính đáng, có
    được đúng pháp" (`dhammaladdha` là "có được đúng pháp", "thuộc pháp" sai
    nghĩa; theo an4.62), và "nhờ của cải ... tôn vinh" → "bằng của cải ... mà
    tôn vinh" để câu không đọc thành "thanks to". `6.3`, `7.2`, `8.2`, `9.2`, `10.2`
    `kalyāṇena manasā` "tâm từ ái" (thêm ý từ) → "tâm lành" (dn31:33.4 cùng
    cụm: "tâm lành"); `anukampanti` "thương cảm" (14 khoá) → "thương tưởng" (92
    khoá, và dn31:33.4); `9.1`–`9.4` `devatā` "các vị chư thiên" → "chư thiên"
    (191 so với 5), `yāvatā` thêm "tất cả". `6.4`, `7.3`, `8.3`, `9.3`, `10.3`
    `ciraṁ jīva, dīghamāyuṁ pālehi` là mệnh lệnh ngôi hai trong nháy, nhưng bản cũ
    đổi sang ngôi ba kèm chữ "cầu" ("Cầu cho người ấy sống lâu") → "Hãy sống
    lâu, hãy giữ gìn thọ mạng dài!".

    Kệ: `13.1` "cả hai phía" (thêm "phía") → "cả hai"; `13.3` `pubbapetānaṁ`
    "các bậc tổ tiên đã khuất" (nâng thành "bậc tổ tiên") → "những người đã
    quá cố" (`pubbapetā` ở mn97 luôn là "người quá cố", 6/6); `14.2`–`14.3` bản cũ
    để "bậc trí" thành đồng vị của chư thiên và bỏ mất `hoti` → "và chư thiên,
    bậc trí ấy / là người làm sinh khởi niềm hoan hỷ" (`paṇḍito ... gharamāvasaṁ`
    ở an8.38 là "bậc trí sống tại gia", tức chủ ngữ); `15.2` `pujjo` "kính
    trọng" → "tôn kính" (mn113: "đáng được tôn kính"); `15.3` thêm "ngay"
    (`idheva`; sn7.19, an4.4, an4.61) và đối tượng "người ấy" (`naṁ`).
    Tiêu đề `0.3` "Thiếu Ni" → "Thiếu Niên" (`kumāraka`).

    Điểm trước → sau: semantic_fidelity 9.4 → 9.0, grammar_logic 9.4 → 9.2,
    segment_alignment 10.0 → 9.8, terminology 9.3 → 9.3, vietnamese_clarity 9.4
    → 9.3, ambiguity_integrity 9.2 → 8.8, technical_integrity 10.0 → 9.6, các
    tiêu chí còn lại giữ nguyên; final_score 9.51 → 9.34. Điểm HẠ vì bản cũ có
    nhiều lỗi nghĩa (tự thú, cài tên, đồ ngọt, bổ nhiệm, cầu cho) chưa từng được
    ghi nhận, và vì các bất định dưới đây trước đó chưa ghi ở đâu cả. Cổng kỹ
    thuật (`npm run validate`, `npm test`, `npm run check`, `npm run build`)
    chưa chạy trong lượt này nên không tuyên bố đã đạt; technical_integrity 9.6.

    Bất định CÒN LẠI, không phân xử được bằng căn cứ trong tầng, không thêm vào
    lời kinh: (1) `4.3` `apānubhā` là hapax trong toàn Pāli root (một lần, ở
    đây); bản Anh đã ghim "brash", bản Việt nguyên bài "ngạo mạn"; giữ "hỗn
    xược" cùng trường nghĩa vô lễ. (2) `4.5` `pacchāliyaṁ khipanti` cũng là hapax
    (một lần); bản Anh "hit ... on their backs", bản Việt nguyên bài "đánh sau
    hông"; giữ "đánh vào lưng", nghĩa "lưng" hay "hông" chưa chắc. (3) `5.2`/
    `11.2` `raṭṭhika pettanika`: chỉ có hai lần trong toàn Pāli (cả hai ở bài
    này), bản Anh đọc "appointed or hereditary official", bản Việt nguyên bài đọc
    khác nữa; bản dịch chọn đọc một chức theo cấu trúc Pāli. (4) `8.1`
    `khettakammantasāmantasabyohāre`: cách tách hợp chất chưa chắc; bản cũ và bản
    Anh đọc "người làm ruộng gần kề" + "người làm ăn", nhưng có thể là ba nhóm
    (làm ruộng, láng giềng, người làm ăn). (5) `13.1` `ubhinnaṁ` "cả hai" không
    nêu rõ hai nhóm nào (nhóm trong nhà và người sống nhờ ở `12.3`–`12.4`, hay
    thân quyến đã khuất và đang sống ở `13.3`–`13.4`); `ñātīnaṁ` có thể bao cả
    hai nhóm sau. (6) `3.4`/`4.2` `bhavissanti vajjī`: danh từ `vajjī` ở danh cách
    nên câu cũng có thể đọc "người Vajjī sẽ (hưng thịnh)"; bản Anh và bản Việt
    nguyên bài đều thêm "họ", bản dịch giữ "họ sẽ thành người Vajjī". (7) `4.4`
    hướng gửi của `paheṇaka` (gửi đến hay gửi đi giữa các gia đình): giữ trung
    tính "gửi đi trong các gia đình". (8) `12.1`–`12.2` `sadā` chỉ đứng ở `12.2`
    nhưng "luôn" được đặt ở cả hai khoá; `14.2` "ấy" chỉ để đánh dấu chủ ngữ
    `paṇḍito`. Không có blocker mới; không có blocker nào bị xoá.

    Công thức tài sản `uṭṭhānavīriyādhigatehi ... dhammaladdhehi` ở an5.41 vẫn
    giữ cách dịch cũ ("mồ hôi giọt rơi, ... thuộc pháp") — ngoài phạm vi lượt
    này, cần xét riêng.
