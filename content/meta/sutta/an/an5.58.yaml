notes:
  - >-
    **Sửa lan 2026-10-13:** các khoá `an5.58:13.1`–`13.4` và `14.1`–`14.4` của
    bài kệ trước đây mang nội dung xếp theo trật tự câu English, lệch khỏi từng
    khoá Pāli (ví dụ `14.3` Vittisañjanano hoti mang *cho các sa-môn,
    bà-la-môn*; `13.1` Ubhinnañceva atthāya mang *Người hào phóng, có giới*).
    Đã căn lại theo từng khoá Pāli: `14.3` *cho các sa-môn, bà-la-môn* → *làm
    sinh khởi niềm hoan hỷ* (như `tha-ap469:3.1`, `tha-ap129:4.3`), `14.1` →
    *Đối với các sa-môn, bà-la-môn*, `14.2` → *và cả chư thiên, bậc trí*,
    `14.4` → *khi sống tại gia một cách đúng pháp*, `13.1` → *Vì lợi ích của cả
    hai phía*, `13.2` → *người hào phóng, có giới*, `13.3` → *vì các thân quyến,
    các bậc tổ tiên đã khuất*, `13.4` → *và những ai đang sống ở đời này*.
    Nghĩa cả bài kệ giữ nguyên, chỉ đổi chỗ đặt từng mệnh đề cho khớp khoá.
