notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 19/19 = 100%** (17 của Sujato + `5.5`, `5.6` do lớp lấp `english-project` của dự án bù — tôi không dùng làm nguồn). Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ phân phối Pháp Cú cho tiếng Việt), nên `triangulation` 9.0. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **14 khoá có PĨI TRÙNG NGUYÊN VĂN ở bài khác; 11 cặp dùng lại NGUYÊN VĂN.** `0.2` = `an6.31:0.2` (4. Phẩm Chư Thiên) · `1.1` = `sn55.52:1.1` · `1.4` = `an6.41:1.4` · `4.2` và `5.5` = `an5.45:5.2` · `5.1` = `an5.45:6.1` · `7.1`–`7.2` = `an5.38:6.1`–`:6.2` · `9.1`, `9.2`, `9.4` = `an4.40:7.1`–`:7.2`, `:7.4` · `9.5` = `sn38.7:1.15`.
  **`chaḷaṅga` tôi dịch *yếu tố*, không theo *sáu pháp* của `dn33`.** `dn33:3.3.51` dịch `chaḷaṅgasamannāgato` là *đầy đủ sáu pháp* (10 bản), nhưng ở đây `chaḷaṅga` nói về **sự cúng dường** (`dakkhiṇā`), và Sujato dịch tiêu đề là *A Gift With Six Factors*; *pháp* dùng cho sáu căn và sáu pháp bao la (kiền chế), không đúng ở đây. Tôi dùng *sáu yếu tố* và ghi lại để người biên tập thống nhất nếu muốn. `tīṇaṅgāni` → *ba yếu tố* (nhất quán).
  **`dāyaka` và `paṭiggāhaka` → *người bố thí* / *người nhận*, theo `an5.34:4.1` và `an4.58:2.1`.** `pubbeva dānā sumano` (0 tiền lệ) → *trước khi cho thì có tâm hoan hỷ*, `dadaṁ cittaṁ pasādeti` → *trong lúc cho thì làm trong sạch tâm* (`an8.37:1.3`: *cho với tâm đã thanh tịnh*), `datvā attamano hoti` → *sau khi cho thì tự mình hân hoan* (`an8.37:1.3` cùng vế). Ba vế này lặp lại nguyên văn ở `6.1`–`6.3` nên tôi dùng **cùng một cách dịch** ở cả hai chỗ — cũng là lý do `6.x` không dịch khác `2.4`.
  **`vītarāgā / vītadosā / vītamohā` → *ly tham / ly sân / ly si*, dùng lại nguyên văn của `an5.38:6.1`–`:6.2`** (PĨI TRÙNG NGUYÊN VĂN ở `7.1`–`7.2`). Ở vế `3.2` Pāli có hai khả năng — `vītarāgā vā honti rāgavinayāya vā paṭipannā` là *đã ly tham **hoặc** đang tiến hành để ly tham*; tôi giữ cả hai vế bằng *hoặc*, không gộp thành một. `anāsavā` → *không lậu hoặc*; tôi dùng `āsava` = *lậu hoặc* theo `dn6:13.8` và `dn15:36.2`, không dùng *ô nhiễm* như ở `saṅkilesa` (đó là từ khác).
  **Bốn kệ `6.1`–`9.4` là phần bị Sujato mở rộng, tôi dịch từ Pāli.** `8.3` `Attano parato ceso` (0 tiền lệ) → *lễ hy sinh này vượt hơn cả bản thân mình lẫn người khác*; Sujato dịch là *This sacrifice is very fruitful* — tức là Sujato đã lược mất mệnh đề `ceso`. `8.1`–`8.2` (`Sayaṁ ācamayitvāna, datvā sakehi pāṇibhi`) **không có trong bản Anh Sujato**, tôi dịch *Tự tay rửa sạch rồi, dùng chính đôi tay mình trao cho*. `9.1`–`9.2` theo `an4.40:7.1`–`:7.2` (*Khi bậc trí có lòng tin / cúng dường như vậy với tâm buông xả*); `9.3` Pāli ở đây đọc `Abyāpajjaṁ` khác `Abyābajjhaṁ` của `an4.40:7.3`, tôi theo đúng chữ mình có (*vào thế giới an lạc không phiền não*).
  **Ví dụ `4.1`–`5.6` theo `an5.45` và `sn55.41`.** Cụm `puññābhisando kusalābhisando sukhassāhāro sovaggiko sukhavipāko saggasaṁvattaniko iṭṭhāya kantāya manāpāya hitāya sukhāya saṁvattatī` dùng **nguyên văn** của `an5.45:5.2` (2 bản trùng nguyên văn): *dòng phước chảy tràn, dòng thiện chảy tràn, chất nuôi dưỡng hạnh phúc, đưa đến cõi trời, trổ quả hạnh phúc, đưa đến các điều được yêu thích, được say mê, được ưa chuộng, đưa đến lợi ích và hạnh phúc, chỉ có chừng ấy mà thôi.* `udakāḷhaka` → *bình nước* (`sn55.41:5.2`) · `asaṅkhyeyyo appameyyo mahāpuññakkhandhotveva saṅkhaṁ gacchati` → *chỉ được tính như một khối công đức lớn không thể đếm, không thể đo*.
  **Dấu lược.** Bài này Pāli **không có dấu lược nào**; bản Việt cũng không. (Đối chiếu: `an5.45:5.2` được dùng lại nguyên văn nhưng ở đó `…pe…` đã bị lược trước, nên bản sao của tôi sạch dấu lược — đúng như Pāli của bài này.)
