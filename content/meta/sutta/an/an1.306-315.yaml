notes: |-
  Hoàn thiện từ 5 khóa an1.306 lên đủ 47/47 khóa Pāli của cả chùm 306-315.
  5 khóa cũ giữ byte-identical, chỉ thêm 42 khóa mới qua save_vi của _hvi.py.
  Dịch từ Pāli, đối chiếu Anh Sujato đủ 46/47 khóa qua vr_prB.txt, chỉ thiếu
  Anh ở colophon 315:1.10. Không có tầng Việt hiện hành trong snapshot đã ghim.
  Khuôn câu giữ nguyên của khóa 306 đã review: Ta không thấy một pháp nào khác,
  mà do đó, y như điều này, là, sung mãn 446 tiền lệ, chưa sinh sinh khởi,
  suy giảm 394, tăng trưởng 576, pháp thiện 530, chánh kiến 597, tà kiến 444.
  Ayoniso manasi karoto theo sn9.11 Do không như lý tác ý; danh từ
  ayonisomanasikāra thành sự tác ý không như lý, yonisomanasikāra thành
  sự tác ý như lý, cặp xứng nhau.
  Tứ xứ tái sinh theo tiền lệ ác xứ, xấu xứ, đọa xứ, địa ngục; thiện thú,
  cõi trời theo tiền lệ thiện thú 88, cõi trời.
  Câu dài 314-315: cetanā thành chủ ý theo cách dùng mn về cetanā, phân biệt
  với tác ý của manasikāra; patthanā thành mong cầu 137, paṇidhi thành
  ước nguyện 138, giữ distinction; samattaṁ samādinnaṁ thành được thực hiện
  trọn vẹn, yathādiṭṭhi thành thuận theo tà kiến hay chánh kiến ấy.
  Ngũ quả thành không đáng ưa 199, không đáng thích 56, không vừa ý 43,
  bất lợi, khổ đau; chiều chánh thành đáng ưa, đáng thích, vừa ý,
  lợi ích và an lạc 42.
  Ví dụ hạt giống: bầu đắng 3 tiền lệ mn46 mn36, mía 6, nho 31, gạo thơm 2
  nên sāli thành lúa thơm; neem và mướp khía là đặt mới, 0 tiền lệ, theo
  Sujato neem và angled gourd; kaṭuka thành cay 74, asāta thành khó chịu,
  rasa thành dưỡng chất 7; asecanaka thành thơm ngon.
  pāpikā thành xấu ác 39, bhaddikā thành tốt lành 107.
  Taṁ kissa hetu thành Vì sao vậy 271. Colophon Vaggo dutiyo thành
  Phẩm thứ hai theo đúng sn52.24 và an1.208.
  Lược bỏ xưng hô này các tỳ-kheo ở các câu đáp ngắn 314-315:1.3, 1.6, 1.9
  theo đúng Sujato, không mất nghĩa.
  Bất đồng với Sujato: câu Anh ở 308:1.1 viết gives rise to unskillful
  qualities và 308:1.2 viết unskillful qualities arise, trong khi Pāli viết
  rõ kusalā dhammā nuppajjanti, tức pháp thiện không sinh; bản Việt theo
  Pāli vì Pāli là authority cuối cùng.
  technical_integrity 9.5 vì task này cấm chạy npm run validate, test, build;
  chốt save_vi của _hvi.py đã pass toàn bộ khóa mới gồm cân ngoặc kép,
  NFC, Pāli lọt và khóa thừa. Không blocker.
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và xuất
  bản.** Ký hiệu lược `…pe…` của bilara lọt nguyên văn vào bản Việt ở **4 khoá**. `…pe…`
  là **ký hiệu lược**, không phải chữ; quy ước kho là giữ **đúng MỘT** `…`. Ở **4 khoá**
  Pāli ghim **có** dấu lược nên chỉ rút cụm còn một `…`, nghĩa không đổi: `an1.314:1.1`,
  `an1.314:1.7`, `an1.315:1.1`, `an1.315:1.7`.

  `final_score` tính lại bằng script (trung bình số học thô của đúng 10 tiêu chí),
  `assessed_at` cập nhật. Đây là sửa lỗi kỹ thuật/thuật ngữ ở mức khoá, không phải biên
  dịch lại bài; không blocker, trạng thái giữ nguyên theo quality gate.
