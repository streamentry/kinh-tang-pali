notes: |-
  Đối chiếu Pāli + English Sujato (đủ 35/35 khoá có nội dung) + bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn (không vào cột). Kinh Chật Hẹp (Sambādhasutta): Tôn giả Udāyī hỏi Tôn giả Ānanda về bài kệ của thiên tử Pañcālacaṇḍa; Ānanda trả lời bằng chuỗi tám thiền định (bốn thiền sắc giới và bốn định vô sắc), mỗi tầng vẫn còn một "chật hẹp" riêng (tầm và tứ, hỷ, lạc đi cùng xả, tưởng về sắc, rồi tưởng của từng xứ), cho đến sự chấm dứt của tưởng và thọ, nơi các lậu hoặc đoạn tận (nghĩa tuyệt đối, nippariyāya). Số thứ tự uddāna `Paṭhamaṁ` = Thứ nhất.

  **Coverage English: Sujato 35/35 = 100%** trên Pāli có nội dung (>= 40 ký tự, bỏ khối `:0`); khoá còn lại là colophon `12.3` (không tính vào mẫu số). Tầng `english-project` không có bài này, tầng Việt hiện hành vắng ở commit đã ghim (chỉ có Pháp Cú) nên chỗ đó dựa vào Pāli + Sujato + tra cứu toàn văn. Cổng coverage đo được, không có khoảng trống cần ghi nhận.

  **Một chỗ nghĩa đen mâu thuẫn văn cảnh, đã xử lý và ghi bất định (`2.2`).** Tầng Pāli đã ghim đọc `Avidvā bhūrimedhaso` (nghĩa đen *a-vidvā* = "không biết/vô minh") — mâu thuẫn trực tiếp với `bhūrimedhaso` ("trí tuệ rộng lớn") ngay trong cùng dòng, và với cả bài (đây là lời tán thán bậc Phật). Kệ này là bài kệ của `sn2.7` (Pañcālacaṇḍasutta), nơi dòng tương ứng đọc `Avindi bhūrimedhaso` ("đã tìm thấy"), và các dòng `2.3`/`2.4` trùng chữ với `sn2.7:2.3`/`2.4`. Sujato (*was discovered by the Buddha of vast intelligence*) và Thích Minh Châu (*Bậc thiện trí tìm được*) đều dịch theo nghĩa "tìm thấy". Tôi coi `avidvā` là dị bản/biến dạng của `avindi` và dịch *bậc trí tuệ rộng lớn đã tìm thấy*; không dịch nghĩa đen "vô minh" vì sẽ biến lời tán thán thành lời chê và phá cả mạch bài. Chưa tra được bản Pāli thủ bản nào khác để xác minh dị bản này — đây là suy luận từ bài kệ song song, không phải chứng cứ bản văn trực tiếp. Không đặt blocker vì giáo nghĩa không đổi và mọi chứng cứ đều cùng chiều, nhưng `ambiguity_integrity` hạ xuống 9.0 vì điều này. `gataṁ` ở `2.1` tôi dịch *đã đạt tới* (khoảng trống đã đạt tới trong chỗ chật hẹp); Sujato không dịch riêng chữ này, `sn2.7` dùng `vata` thay chữ này.

  **Bất định thứ hai: `paṭilīnanisabho` (`2.4`).** Dùng lại *bậc ẩn sĩ, con bò mộng rút mình vào tịch tịnh* của `sn2.7:2.4` cho nhất quán; Sujato dịch *solitary boss bull*. Cụm *vào tịch tịnh* là cách đọc của `sn2.7` (paṭilīna = thu mình, ẩn dật), chưa chắc đã là nghĩa của Pāli; giữ để hai bài cùng bài kệ không lệch.

  **Thuật ngữ (đo trên lớp `an`):** `sambādha` → *chật hẹp* (theo `sn2.7`: *chỗ chật hẹp*); *okāsa* → *khoảng trống* (theo `sn2.7`). `kāmaguṇā` → *dục trưởng dưỡng* (an9.65 và ít nhất 19 nơi khác trong tầng). Công thức āyatana theo `an9.37`/`an9.40` (bài kề, đã published): *xứ vô số hư không* 23 lần, *xứ vô số thức* 23, *xứ vô sở hữu* 26 trong lớp `an`; cách *không vô biên xứ* cũng có (24 lần cả hoa lẫn thường) nên đây là chỗ tầng chưa thống nhất; tôi theo `an9.37`/`an9.40` để cả vòng thiền liền mạch. `paṭighasaññā` → *tưởng đối ngại*. Bốn thiền sắc giới dịch *sơ thiền … nhị thiền … tam thiền … tứ thiền* (khớp `mn66`, `an9.40`; lớp `an` dùng cả *thiền thứ nhất* 42 lần nhưng bài mn66 là bài song song trực tiếp); `upekkhāsukha` → *lạc đi cùng xả* theo `mn66:24.4`; `aniruddha` → *chưa chấm dứt* theo `mn66:22.4`. `pariyāyena`/`nippariyāyena` → *theo nghĩa tương đối*/*theo nghĩa tuyệt đối* (theo `an9.44`); các bài kề cùng phẩm dùng chưa thống nhất (`an9.43`: *theo phương tiện thế gian*, `an9.45`: *theo cách nói*); đây là điểm chưa chuẩn hoá của cả phẩm, chưa phải lỗi của bài này. `saññāvedayitanirodha` → *sự chấm dứt của tưởng và thọ* (16 nơi) thay vì *diệt thọ tưởng* (6 nơi).

  **Dùng lại tiền lệ:** 20 khoá Pāli trùng nguyên văn ở bài khác (toàn tầng): 11 giữ nguyên văn bản dịch cũ, 7 CỐ Ý dịch khác, 2 chưa có bản dịch. Bảy cặp khác gồm `4.1`/`5.1`/`6.1` (bản cũ dùng *Sơ thiền*/*thiền thứ hai* tuỳ bài; tôi theo chuỗi *sơ-nhị-tam-tứ thiền* thống nhất cả bài), `8.1` (bản cũ ở `an9.43` dùng *Không vô biên xứ* — chọn theo `an9.37`), `9.1`/`10.1` (chỉ khác lời mở: bản cũ *Nữa nữa*, tôi dùng *Lại nữa* theo đa số lớp `an` cho `puna caparaṁ`), `12.1` (các bản cũ có chỗ kém: *địa bàn không-có-tưởng* ở bốn khoá). Trong chính bài: 3 nhóm trùng (`x.2`, `x.3`, `x.4` ở tám khối) — 0 cặp bản Việt khác nhau.

  **Dấu lược và dấu nháy:** `3.5`/`4.1`/`5.1`/`6.1`/`7.1` mỗi khoá một `…`; `3.6`/`3.7` có `…` trần; khớp Pāli từng khoá (63/63). Nháy đơn/kép khớp Pāli từng khoá (63/63): lời hỏi của Udāyī mở `“` ở `1.4`, kệ trong nháy đơn `2.1`–`2.4`, đóng `”` ở `3.1`, lời đáp của Ānanda mở `“` ở `3.2` và đóng `”` ở `12.2`.

  **Lượt review đối kháng:** không tìm thấy lỗi sai nghĩa cần sửa. Ba điểm đã cân nhắc và giữ nguyên: (1) `4.5` và các khoá tương ứng (`x.5`) dịch *đó là chật hẹp ở đó* — bám `ayamettha sambādho`, không thêm giải thích; (2) `Ettāvatāpi` giữ chữ `pi` bằng *cũng* ở cả chín chỗ (`4.2`–`12.2`); (3) `okāsādhigamo` dịch *sự đạt được khoảng trống* theo `sn2.7`, không viết thành *sự giải thoát* như bản Thích Minh Châu vì Pāli không nói vậy.

