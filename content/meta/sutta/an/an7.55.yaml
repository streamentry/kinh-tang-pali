notes: |-
  Đã đọc hết Pāli của bài (78 khoá, tiền tố `an7.55:`) trước khi viết; ghi đủ 78/78 khoá, không có khoá nào ngoài tập khoá Pāli.
    **Coverage Anh:** mẫu số = 62 khoá Pāli có nội dung (>= 40 ký tự, bỏ khối `:0`). Sujato phủ **59/62 = 95,2%**; 3 khoá Sujato để trống là `2.8`, `2.9`, `2.10` (đoạn lược của bản Anh), và cả ba đã có lớp `english-project` (published) lấp đúng nguyên văn từ `2.2`–`2.4`, nên hợp hai lớp là 62/62. Lớp lấp KHÔNG phải cách đọc English độc lập (cùng một tác giả với bản Việt này), nên `triangulation` chỉ tính 59/62 khoá có Sujato độc lập, không tính 3 khoá lấp. Tầng `vietnamese-current` vắng ở commit đã ghim (chỉ có Pháp Cú); bản Hòa thượng Thích Minh Châu nguyên bài chỉ được dùng làm tra cứu toàn văn, không phải cột đối chiếu. Cổng coverage >= 0,80 đạt, không blocker.
    **Pāli trùng nguyên văn:** trong chính bài có 12 nhóm Pāli trùng (51 khoá), cả 12 nhóm đều có bản Việt giống hệt nhau (0 cặp lệch). Với bài khác: dò 9 khoá có Pāli trùng ở tầng (`0.2`, `1.2`, `1.3`, `1.4`, `2.5`/`2.11`/`3.5`, `9.6`, `9.9`); dùng lại nguyên văn 4 khoá — `0.2` (khớp byte với `an7.54:0.2`), `1.2` (dạng chiếm 15/40 trong tầng), `1.4` (*Đức Phật nói:* 108/205), `9.9` (*Thứ hai.* 266/270). `1.3` cố ý khác dạng đa số (*các tỳ-kheo ấy đáp.* 7/66): giữ thêm *đáp lời Đức Thế Tôn* vì Pāli có `bhagavato`. `2.5`/`2.11`/`3.5` và `9.6` chỉ có 2 tiền lệ mỗi khoá, hai tiền lệ khác nhau, nên dịch theo thuật ngữ đã chọn ở dưới.
    **Thuật ngữ — đo trên tầng, ghi cả khoá/tệp:** `orambhāgiyānaṁ saṁyojanānaṁ` → *năm hạ phần kiết sử* (51 khoá / 25 tệp; *phần dưới* 8/4, *hạ giới* 16/6). `antarāparinibbāyī` → *bát-niết-bàn giữa chừng* (12/8; *Trung gian Bát-niết-bàn* 2/2, *giữa hai đời* 2/2). `upahaccaparinibbāyī` → *bát-niết-bàn khi chạm đến* (9/6; *Tổn hại* 2/2): dạng này cũng khớp với ví dụ ở `5.4` (`upahacca talaṁ`, chạm mặt đất) nên giữ, không dùng *Tổn hại*. `asaṅkhāra-` → *không cần gắng sức* (8/6; *Vô hành* 4/4), `sasaṅkhāra-` → *cần gắng sức* (7/6; *Hữu hành* 4/4). `uddhaṁsoto` → *đi ngược dòng* (6/6; *Thượng lưu* 4/4). `akaniṭṭha` giữ nguyên tên *cõi Akaniṭṭha* (10 tệp; *Sắc Cứu Cánh* 2). `anupādāparinibbāna` → *Bát-niết-bàn không còn chấp thủ* (đồng nhất với `mn24`, `sn35.75`). `anusaya` → *thiên hướng* (trong `an`: *thiên hướng* 10 khoá / 5 tệp so với *tùy miên* 9/2; trong `an7`: *thiên hướng* 5 khoá, *tùy miên* 0): theo phạm vi gần nhất, ghi cả hai số vì toàn tầng `sn` lại nghiêng về *tùy miên* (14/13 so với 12/6). `bhavarāgānusayo` → *thiên hướng tham sự tồn tại* (theo `an7.11`, 1 tiền lệ; các tiền lệ còn lại 1 khoá mỗi dạng, không đủ để phân xử). `purisagati` → *nơi đến của con người* (theo *năm nơi đến* của `gatiyo` ở tầng `an`, 2 khoá). `upekkhaṁ paṭilabhati` → *đạt được xả* (tiền lệ *chứng được xả*, 3 khoá; không dùng *chứng* vì Pāli là `paṭilabhati`).
    **Công thức `no cassa no ca me siyā, na bhavissati na me bhavissati`:** không có tiền lệ nguyên văn trong tầng (0 khoá). Gần nhất là `no cassaṁ, no ca me siyā, nābhavissa, na me bhavissatī` ở `sn22.153` và `sn24.4` (*Có thể chẳng có, và sẽ chẳng phải của tôi; sẽ chẳng có, và sẽ chẳng phải của tôi*), nhưng đó là dạng ngôi thứ nhất `cassaṁ`, còn đây là `cassa` (ngôi thứ ba) kèm `siyā` cũng là cách giả định, nên viết *Có thể chẳng có, và có thể chẳng phải của tôi* và bỏ chủ ngữ, theo cả Sujato (*It might not be, and it might not be mine*) lẫn bản Hòa thượng Thích Minh Châu (*cái này*). Vế sau `yadatthi yaṁ bhūtaṁ taṁ pajahāmi` là lời nói ngôi thứ nhất, nên dịch *tôi từ bỏ cái ấy*.
    **Bất định đã ghi, không đưa vào thân kinh:** (1) `papaṭikā` — dịch *tia lửa* theo Sujato (*spark*); bản Hòa thượng Thích Minh Châu dùng *miếng vụn* (mảnh văng ra từ nồi nung). Cùng chữ này ở các bài khác (`an10.3`, `an11.3`) là *mầm non/chồi non*, nên không áp dụng. (2) `ayokapāle` — *nồi sắt* (Sujato *pot*; bản Hòa thượng Thích Minh Châu *bát bằng sắt*), cố ý khác *chảo sắt* của `ayokaṭāha` (4 tệp) để giữ hai chữ Pāli tách biệt. (3) `haritantaṁ … pathantaṁ … selantaṁ … udakantaṁ` ở `8.7`: dịch *rìa* theo nghĩa *anta* là mép/rìa; Sujato đọc thành *green field / roadside / cliff's edge / body of water*, bản Hòa thượng Thích Minh Châu đọc *đám ruộng xanh … đám đất cao … hòn đá … dòng nước*; ba cách đọc khác nhau ở mức chi tiết, cùng một ý (nơi lửa hết đường lan). `gaccha` dịch *bụi cây*, `dāya` dịch *khu rừng*. (4) `sambhave` — dịch *sự phát sinh* (Sujato *creating a new life*; bản Hòa thượng Thích Minh Châu *tích tụ của hữu*), cặp với `bhave` *sự tồn tại*; hai chữ Pāli không phân biệt trong ngữ cảnh gần nên không nén thành một. (5) `atthuttari padaṁ santaṁ` — dịch *còn có một trạng thái an tịnh vượt lên trên* (Sujato *a peaceful state beyond*); `uttari` không bị dịch là *tối thượng* như bản Hòa thượng Thích Minh Châu (*vô thượng*) vì Pāli là phó từ *thêm nữa/vượt hơn* chứ không phải tính từ so sánh cao nhất. (6) Ba mục `2`, `3`, `4` đều kết bằng cùng công thức `antarāparinibbāyī`; Pāli chỉ phân biệt chúng bằng ví dụ (tia lửa tắt ngay; bay lên rồi tắt; bay lên và tắt trước khi chạm đất), nên không thêm nhãn khác. (7) `sabbena sabbaṁ` — Sujato đảo trạng từ (*completely realized … totally given up* ở `2.4`, ngược lại ở `3.4`/`8.4`) cho cùng Pāli; bản Việt giữ một cách nói duy nhất *hoàn toàn, trọn vẹn*. (8) Pāli `9.5` bỏ `na` so với `2.4`; bản Việt đổi từ *chưa* sang *đã* đúng ở bốn chỗ (*chứng ngộ*, *đoạn trừ* ×3).
    **Dấu lược:** 11 khoá có `…pe…` (`3.8`, `4.2`, `4.6`, `5.2`, `5.6`, `6.2`, `6.7`, `7.2`, `7.7`, `8.9`, `9.6`), mỗi khoá đúng một `…`; 10 khoá `‘…` mở nháy đơn không đóng, đúng Pāli (nháy chạy qua ranh giới khoá). Số Pāli: `satta` 7 (số nơi đến, mục `2`–`8` = 7 mục), `pañca` 5 (kiết sử hạ phần) — không có số lớn. Nháy đơn/kép khớp Pāli 78/78 khoá, NFC sạch, 0 khoá rỗng.
