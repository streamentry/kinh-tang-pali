notes: |-
  **Bản chỉ là một mảnh liệt kê, và tôi không bịa thêm cho nó.** Cả `an11.118-165` và `an11.70-117` đều có thân bài đúng 7 khoá: `1.1` là dấu lược trần, rồi sáu khoá liệt kê theo cặp thanh–căn, mỗi khoá kết bằng dấu lược. Tôi giữ nguyên số dấu lược từng khoá (mỗi khoá đúng 1, khớp Pāli) và **không** mở rộng. `:0.4` của Pāli là `~` (vô danh), nên tôi để `~` — khớp tiền lệ `an11.502-981:0.4` và `an10.221-232:0.3`. Bản Anh Sujato có đặt tên cho hai mảnh này (*Untitled Discourses on Eye Consciousness, Etc.* / *… on Sights, Etc.*) nhưng **tôi không chép tiêu đề đó vào khoá `0.4`**: đó là chữ của bản dịch, không có trong Pāli, và `~` là dấu hiệu quy ước của tầng. Nếu biên tập muốn có tiêu đề tiếng Việt thì phải đổi cả quy ước `~` của tầng, không phải riêng hai bài này.

  **Ngoại địa ngữ giữ đúng dạng thanh–căn.** `Cakkhuviññāṇe` … `manoviññāṇe` và `Rūpesu` … `Dhammesu` đều là **cách nói nơi chốn** (locative), không phải danh từ đứng riêng. Tôi dịch *Trong thức mắt…* / *trong thức tai…* v.v., giữ cả vị trí nơi chốn lẫn dấu lược, thay vì *ý thức mắt…* như Sujato (*eye consciousness…*) — Sujato đã lược mất chức năng nơi chốn. Với `an11.70-117` tôi bám đúng cách dùng đã có trong tầng: `rūpa` → *sắc*, `sadda` → *tiếng*, `gandha` → *mùi*, `rasa` → *vị*, `phoṭṭhabba` → *xúc chạm*, `dhamma` → *pháp* (cùng cách `an11.8` dùng cho sáu căn và sáu căn xứ).

  **Ngoặc kép.** Pāli của hai bài này **không có dấu nháy kép nào**. Tôi theo Sujato (mở `“` ở `1.2`, đóng `”` ở `1.7`) vì nếu không bài sẽ là một danh sách lơ lửng không ai nói. Đây là quyết định biên tập đã ghi, không phải chữ có sẵn trong nguồn.

  **`Paṭhamapaṇṇāsaka` — ba cách dịch đang cạnh tranh trong tầng, tôi chọn theo nghĩa.** `an11.502-981:0.2` (cùng `Paṭhamapaṇṇāsaka`, cùng `Sāmaññavagga`) dùng *Bộ Mười Một Bài Kinh Đầu Tiên*; `an11.992-1151:0.2` dùng *1. Paṭhamapaṇṇāsaka*; `an11.982:0.2` dùng *Nhóm Năm Mươi Đầu*. Sujato đọc *The First Fifty* và `paṭhama` + `paṇṇāsa` nghĩa đen là *năm mươi đầu tiên*, nên tôi lấy **Nhóm Năm Mươi Đầu**. Ghi ra đây để người biên tập thống nhất một cách cho cả Tăng Bộ. `Sāmaññavagga` → *Phẩm Sa-môn* theo đúng `an11.502-981:0.3` (tiền lệ duy nhất trong tầng). `:0.1` viết *Aṅguttara Nikāya 11.70–117* / *… 11.118–165* như `an11.502-981` và `an11.992-1151` (Pāli gốc chỉ ghi *Aṅguttara Nikāya 11* không kèm số bài).

  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG ở hai bài này** (không khoá nào ≥ 40 ký tự, nên assertion không tự chạy). Tôi quét MỌI khoá: đúng 11/11 khoá mỗi bài, đúng segment ID, mọi chuỗi đã NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép mở ở `1.2` và đóng ở `1.7` nên cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim: `translation/vi/` của bilara chỉ chứa 26 chương Pháp Cú, không có Tăng Bộ. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato, và Sujato ở đây chỉ **phản chiếu lại** chính những mảnh lược Pāli chứ không đọc độc lập — đó là lý do `triangulation` chỉ 8.0.
