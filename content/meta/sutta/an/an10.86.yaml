notes: |-
  Dịch từ Pāli root đã ghim (khớp byte-for-byte với dump 57 khoá), tham chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 28/41 = 68,3%, DƯỚI SÀN 0,8** — Sujato bỏ trống 15 khoá (`8.3`, `8.4`, `11.2`–`14.3`, `15.2`, `16.2`, `17.2`, `18.2`, `20.3`). Cần entry trong `reference-gaps.yaml` do generator tạo lại sau khi bài vào tầng — ngoài phạm vi 8 tệp của lát này, coordinator chạy `npm run reference:gaps`. Chỗ trống của Sujato không phải sự đồng thuận về cách dịch: các khoá đó được kiểm bằng Pāli + trùng nguyên văn an10.84 (bài song ngữ cùng cấu trúc trong tầng).
  **Số khoá: 57/57 đúng dump header. Pāli trùng nguyên văn: 16/57 khoá, 14 dùng lại NGUYÊN VĂN an10.84** — gồm toàn bộ khối công thức dài: `2.1`, `2.3`, `2.4`, `3.1`, `3.2`, `4.1`, `6.1`, `7.1`, `9.1`, `19.1`, `19.2`, `20.1` và `0.2` (18/20 đa số «9. Phẩm Các Vị Trưởng Lão»), `1.3` (8/23 «“Này các hiền giả tỳ-kheo!”»).
  **2 khoá trùng sửa có lý do.** `2.2` 3 trùng 1-1-1: an10.84 kết «…tôi biết rõ như thế’ vậy?» (lệ artifact câu hỏi), an9.25 kết «…như vậy’.», mn112 kết «…như thế’ti.» — lấy thân chung của cả ba, kết bằng chấm vì Pāli `pajānāmī’ti.` là câu trần thuật; cùng một thân giữ NGUYÊN cho 5 khoá lặp trong bài (`2.2`, `3.3`, `5.3`, `6.4`, `8.4` — Pāli giống hệt nhau trong bài, buộc một cách dịch duy nhất). `20.2` trùng an10.84:15.2 nhưng bản đó thừa hạt `ti` («…có thể có”ti.») — tôi bỏ hạt thừa; đề nghị coordinator sửa an10.84:15.2 cho khớp (ngoài phạm vi lát).
  **Tiêu đề `0.3` "Adhimānasutta" không có tiền lệ trong tầng** (grep root: chỉ an10.86) → đặt «Kinh Tự Đề Cao»; thuật ngữ thân: `adhimāniko…adhimānasacco` → «tự đề cao, tin điều đó là thật», `appatte pattasaññī…` → «tưởng rằng mình đã đạt điều chưa đạt, đã làm điều chưa làm, đã chứng điều chưa chứng» — chuỗi này dùng nhất quán ở `5.1`, `6.2` (thêm `nissāya` → «Dựa vào điều gì»), `8.2` (thêm `Tasmā` → «Bởi vậy»). `aññaṁ byākaroti` → «tuyên bố thắng trí» theo an10.84.
  **Năm triền cái (10.x–14.x) và bốn ham (15.x–18.x) dịch mới theo đúng khung an10.84** («Vị ấy lại hay X, / vị ấy thường sống với tâm đầy tràn X. / Mà sự X đầy tràn thì có nghĩa là suy thoái…»): abhijjhā → tham lam, byāpāda → ác ý (trùng cách an10.84:6.1), thīnamiddha → hôn trầm thụy miên, uddhacca → hưng phấn, vicikicchā → hoài nghi; kammārāma → ham việc, bhassārāma → ham nói chuyện, niddārāma → ham ngủ, saṅgaṇikārāma → ham hội hè. `8.1` (bahussuta) dựng lại theo chuỗi 4 trùng của an5.87/88/96/109.
  Cổng kỹ thuật do coordinator chạy; đã tự kiểm: JSON hợp lệ, NFC, đủ 57 khoá, không có dấu lược trong bài (Pāli không có `…pe…`), không chép Pāli.

  **Sửa lan 2026-10-13: `2.1`, `2.3`, `2.4`, `3.1`, `3.2`, `4.1`, `5.1`, `6.1`,
  `6.2`, `7.1`, `8.1`, `8.2`, `9.1`, `10.1`–`19.2`, `20.1`, `20.2`** — cùng lỗi đã
  sửa ở `an10.84`. (a) `20.1`: bản cũ *Này bạn, không thể nào một vị tỳ-kheo bỏ mười
  pháp này mà lại đạt được …* **mất phủ định của `appahāya`** (Pāli: *không từ bỏ
  mười pháp này mà … đạt được — điều ấy không thể có*), nay dùng nguyên văn
  `an10.84:15.1`; `20.2` cũng dùng nguyên văn `an10.84:15.2` (và *giới luật này* →
  *Pháp và Luật này*). (b) `āvuso` *này bạn* → *này các hiền giả* (`2.1`, `20.1`,
  `20.2`). (c) `tamenaṁ` dịch *bậc ấy* (nâng bậc) → *vị ấy*; `tathāgato` dịch *Thế
  Tôn* → *Như Lai* như `an10.84`, `an10.85` (12 lần trong hai bài `an10.84`, `an10.85`, so với 6 lần *Thế Tôn, hoặc một vị đệ tử của Thế Tôn* chỉ ở bài này). (d) `pariyuṭṭhita` *đầy tràn* → *bị … chi phối*
  như `an10.84` (*tâm bị … chi phối*), và `ayamāyasmā` *vị hiền giả này* / *vị ấy* →
  *vị tôn giả này* cho thống nhất với `an10.84`/`an10.85`; `dhammavinaye
  tathāgatappavedite` *giới luật đã được Thế Tôn tuyên thuyết* → *Pháp và Luật do
  Như Lai tuyên thuyết* (82 lần *do Như Lai tuyên thuyết* trong tầng, so với 10 lần *giới luật đã được Thế Tôn tuyên thuyết*, cả 10 đều ở bài này). (e) `byāpāda`: *ác ý* ở
  `11.1` và *sân hận* ở `11.2`–`11.3` được thống nhất thành *sân hận*; `10.1` thêm
  nháy mở `‘` đã thiếu (Pāli mở nháy ở đây, đóng ở `19.2`). Các mục đã mô tả ở trên
  là bản trước khi sửa (ví dụ *đầy tràn*, *ác ý*, *14 khoá dùng lại nguyên văn
  `an10.84`*) được thay thế bởi mục này; số khoá dùng lại nguyên văn `an10.84` nay
  là 14 (`2.1`, `2.3`, `2.4`, `3.1`, `3.2`, `4.1`, `6.1`, `7.1`, `9.1`, `19.1`,
  `19.2`, `20.1`, `20.2` cùng `2.2`). Giữ nguyên `13.x` *hưng phấn* cho `uddhacca`
  (thuật ngữ này còn phân hóa trong tầng; ngoài phạm vi sửa lan). Điểm số giữ
  nguyên.
