notes:
  - >-
    **Cấu trúc lặp năm vòng, mỗi vòng bốn segment** (`2.3`–`2.7`, `3.1`–`3.5`,
    `4.1`–`4.5`, `5.1`–`5.5`, `6.1`–`6.6`): dẫn nhập → câu hỏi tự vấn → điều
    kiện phủ định → lời quở trách. Vòng năm (`5.x`) về **đa văn**, vòng sáu về
    **Pātimokkha** — khác sáu vòng đầu về thân, khẩu, từ và học luật. Dịch lặp
    đúng bốn nhịp, nhưng mỗi vòng **mang một nội dung khác nhau**, không dùng
    chung một câu.
  - >-
    **`baliharaṇe vanasaṇḍe` → *Rừng Cúng Dường*** (0 segment, đặt mới):
    `baliharaṇa` = lễ vật cúng dường, `vanasaṇḍa` = rừng. **Lỗi lượt review bắt
    được:** bản đầu viết *trong rừng Rừng Cúng Dường* — **hai chữ *rừng* cạnh
    nhau**. Đã sửa. Cùng lỗi ấy còn ở `an3.123:1.1` (bài đã `published`) vì tôi
    đã dùng lại nguyên văn từ đó; xem `docs/translation-notes/kusinara-grove-of-
    offerings.md`.
  - >-
    **`codaka` → *khiển trách*** theo `an5.167:1.2` (đã `published`);
    **`vattāro` → *lời nhắc nhở*** — 38 segment có `vattāro`/`vatte` trong
    corpus nhưng 28 segment kia đều là **sự ngăn ngăn lời can**, không phải lời
    quở trách, nên ở đây là 0 tiền lệ đúng nghĩa và phải đặt mới;
    ****`acchiddena appaṭimaṁsena` → *không bị soi mói, không bị chê trách
    nặng*** (0 segment, đặt mới — `acchiddha` là từ chối bị soi xét,
    `appaṭimaṁsa` là từ chối bị chê); **`iṅgha tāva` → *Này Tôn giả, xin ông
    hãy…*** (0 segment, đặt mới: `iṅgha` là lời mời quen thuộc giữa hai tỳ-kheo,
    dịch *Này Tôn giả, xin ông hãy* giữ cả hai lớp — gọi tên và xin);
    **`pātimokkhāni vitthārena svāgatāni …` → *đầy đủ, viết rõ ràng, dễ chia, dễ
    tuyên, dễ phân định, biết rõ theo kinh và theo giảng dạy chi tiết*** dùng
    **nguyên văn `an10.33:1.6`** (bài đã `published`, cùng cụm Pāli chỉ khác
    `assa`/`me`); lượt review đã sửa bản đầu vì tôi tự đặt *đã thuộc tẩn* cho
    `vitthārena` và **bỏ mất** *viết rõ ràng* của `svāgatāni`.
  - >-
    **`āgamaṁ pariyāpuṇassū` → *học thuộc kinh điển*** (0 segment, đặt mới): bản
    đầu tôi dịch *làm tròn mãn sự đến của mình*, vì lấy nhầm nghĩa động từ
    *đến*; ở đây `āgama` là danh từ chỉ **bộ kinh**, và `pariyāpuṇassū` là
    *thuộc kỹ*. Sujato cũng dịch *memorize the scriptures*.
  - >-
    **Bốn cụm phủ định ở `5.4` giữ nguyên phép phủ định kép của Pāli** (`na
    bahussuto`… `na suppaṭividdhā`): *không phải là bậc đa văn, không nghe
    nhiều, không nhớ giữ… không thấu suốt về kiến*. Đây là nghĩa của cả vòng —
    nếu gộp thành một phủ định thì mất hẳn lập luận. `an5.167:1.2` (đã
    `published`) có **cùng khuôn** *vị tỳ-kheo muốn khiển trách người khác*, nên
    dùng lại nguyên văn cho `2.1` và `7.8`.
  - >-
    **`mettaṁ cittaṁ paccupaṭṭhitaṁ` → *tâm từ đã được thiết lập***; `anāghātaṁ`
    → *không gây hại* (0 segment, đặt mới; `agha` ở đây là *hại*, không phải
    *lửa* như nghĩa thường thấy ở `aggi`).
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
