notes: |-
  TẦNG THAM KHẢO. Tầng english-sujato tồn tại tại commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639 và bản Sujato phủ 27/27 khoá Pāli có nội dung (100%), nên bài đạt ngưỡng 0.8 của source/layers.yaml và không cần mục trong content/meta/reference-gaps.yaml. Tầng Việt hiện hành vắng với AN tại commit đã ghim (chỉ có 26 chương Pháp Cú), nên triangulation chỉ dựa trên Pāli + Sujato.

  KUNG LẶP 20 LẦN, DỊCH NHẤT. Khung Tathāgatassa, bhikkhave, arahato sammāsambuddhassa pubbeva sambodhā anabhisambuddhassa bodhisattasseva sato xuất hiện ở 20 khoá; tôi dùng một khung dựng bằng hằng số trong tệp ghi nên không thể lệch. Hai dạng khác nhau về cách (suy đoạn 5.1 và 10.1 dùng tông cách) được dịch theo đúng sai khác ấy, không dùng chung một công thức.

  THUẬT NGỮ, ĐẾM ĐƯỢC TIỀN LỆ. Tathāgatassa + arahato + sammāsambuddhassa → Đức Thế Tôn, bậc A-la-hán Chánh Đẳng Giác: trong tầng an, cụm bậc A-la-hán Chánh Đẳng Giác dùng ở 40 khoá / 14 tệp, là cách phổ biến nhất (an3.70, an4.180, an8.85). Đức Thế Tôn cho tathāgata: 166 khoá / 70 tệp trong tầng an. supina → mộng / giấc mơ (dn1:1.21.2 đoán mộng, dn23:15.0 Ví dụ giấc mơ), nên mahāsupinā → đại giấc mộng; tên bài 0.3 theo đúng tên đã dịch của các bài cùng phẩm (Kinh Loài Chó, Kinh Hạng Chỉ Ăn Trong Bát Khất). Katame pañca → Thế nào là năm (đúng an5.197:1.2 ngay bài kế bên trong cùng phẩm). Kinh Tăng Chi Bộ dùng cho :0.1 theo đa số trong chính an5 (196 tệp so với 68 tệp dùng Aṅguttara Nikāya). Chaṭṭhaṁ → Thứ sáu.

  CỐ Ý BỎ CHÚ THÍCH. 2.1 và 7.1 có tiriyā nāma tiṇajāti, tức tên loài cỏ; Sujato dịch tên ấy thành the crosser. Tôi giữ Tiriyā nguyên văn và KHÔNG chú thích nghĩa trong thân kinh, theo BRIEF_VI3 mục 6; nghĩa của tên ấy là chỗ loài cỏ ấy hay vươn qua bên kia.

  DẤU LƯỢC. 3.1 có (…), tôi giữ đúng một dấu lược ở vị trí ấy. 11 khoá khác của bài không có dấu lược nào, nên bản Việt cũng không có; không mở rộng, không nén.

  NHÁY KÉP. Bài chỉ có một cặp: 1.1 mở, 11.1 đóng, đúng như Pāli. 6.1 và 7.1 kết thúc bằng dấu chấm phẩy vì Pāli kết bằng chấm phẩy, nên tôi bỏ dấu chấm ở cuối các vế ấy.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
