notes:
  - >-
    **Coverage Anh Sujato đo bằng script: 12/12 khoá Pāli có nội dung = 100.0%.** Không khoá nào Sujato để trống.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot, không phải thiếu sót.** Đếm trực tiếp trên `source/upstream-manifest.json` tại commit đã ghim `11c9d708978cde8ba61096d8a75f7ddfb846f639`: tầng `vietnamese-current` có **0** file cho 14 uid của lát này (bilara chỉ phân phối Pháp Cú cho tiếng Việt). Nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ ở bất kỳ bài nào; `budsas.org` chỉ là tham khảo toàn văn, không dựng cột.
  - >-
    **Tầng Anh Sujato — đếm từng khoá, không suy.** Đo `coverage` theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ): kết quả ghi ở từng bài. Ở bốn bài Tăng Bộ, những khoá Sujato để trống đều là khoá `…pe…` mà bilara không dịch — tôi **không** mở rộng những khoá đó và **không** lấy tiếng Anh của bài khác để bịa chữ.
  - >-
    **48 cặp khoá có Pāli trùng ở bài khác — đã đếm bằng script, và đã dùng lại nguyên văn.** Quét toàn tầng Pāli gốc (5.764 file, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn** của từng khoá của lát này: **45 cặp trùng byte-for-byte**, thêm **3 cặp** trùng sau khi chuẩn hoá dấu câu và nháy kép = **48 cặp**. Trong đó **35 cặp** đã có bản Việt ở bài khác và tôi **dùng lại nguyên văn** (28 cặp khớp từng chữ; 7 cặp còn lại được nêu riêng dưới đây), **13 cặp** chưa bài nào trong kho có bản Việt thì tôi đặt mới. Không có cặp nào tôi dịch khác mà không ghi lý do.
  - >-
    **Nhịp và hình thức — không lặp khuôn.** Bốn bài Tăng Bộ là `peyyāla` thuần: mỗi mục phải phát lại đúng công thức của Pāli, nên sự lặp ở đây là **bắt buộc của nguồn**, không phải lỗi khuôn. Mười bài Jātaka thì mỗi bài một bài kệ riêng, nhịp khác nhau; tôi không dùng chung một công thức dịch cho cả mười bài.
  - >-
    **Có tầng Anh Sujato ở commit đã ghim** — kiểm bằng cách tra `source/upstream-manifest.json` (không phải tra thư mục cache): tệp `translation/en/sujato/.../{uid}_translation-en-sujato.json` có trong `files` của commit đã ghim. Không có blocker nào ở tiêu chí provenance.
  - >-
    **Bài ngắn, công thức lặp đúng 5 lần — giữ nguyên tiếng đếm.** `1.5`, `2.3`, `3.2`, `4.2`, `5.2` là cùng một mệnh đề `Ayaṁ, bhikkhave, X, vassassa antarāyo, yaṁ nemittā na jānanti, yattha nemittānaṁ cakkhu na kamati` với X lần lượt là thứ nhất…thứ năm. Tôi giữ **thứ nhất / thứ hai / thứ ba / thứ tư / thứ năm** đúng thứ tự Pāli; đổi sang số La Mã hoặc bỏ số là mất semantic unit. Mỗi mục ở `1.3`/`2.1`/`3.1`/`4.1`/`5.1` mở lại bằng `Này các tỳ-kheo` vì Pāli mở lại `bhikkhave` ở đúng năm chỗ đó.
  - >-
    **Dùng lại nguyên văn.** `Katame pañca?` (`1.2`) trùng **160 bài** và đã có sẵn: đa số **110/167** là *Thế nào là năm?* — tôi dùng lại đúng câu đó. `vassassa antarāyā`, `rāhu asurindo`, `vassavalāhakā devā`, `mahāsamudde` đều chưa có bản Việt nào ở bài khác nên tôi đặt mới.
  - >-
    **Hai định danh lực được dịch lệch nhau, và đó là chủ ý.** `tejodhātu` → **hỏa đại** (1 tiền lệ trong kho) còn `vāyodhātu` → **gió** (nhiều tiền lệ cho `vāyodhātu` trong sáu `dhātu` là *giới gió* / *giới tánh gió*). Tôi cân hai bên theo tiền lệ riêng của từng từ thay vì ép cho cặp song song; hệ quả là hai câu không cùng sắc thái, nhưng mỗi từ đều có căn cứ. Nếu biên tập muốn cặp song song thì phải chọn đổi một trong hai và phá tiền lệ của từ kia.
  - >-
    **Một từ có nhiều nghĩa, đã chọn theo ngữ cảnh.** `pāṇinā` ở `3.1` là **bằng tay** (cụm `pāṇinā udakaṁ sampaṭicchitvā` = hứng nước bằng tay), không phải *bằng bàn tay* theo nghĩa Hán–Việt; `chaḍḍeti` là **đổ** (đổ nước), không phải *quẳng*. `nemittā` là **kẻ xem thời tiết** chứ không phải *nhà chiêm tinh*, vì cả bài nói về mưa và Sujato dịch *the forecasters*.
  - >-
    **Bất định:** `nemittānaṁ cakkhu na kamati` — tôi dịch *con mắt của họ không với tới*, theo nghĩa *tầm với của thức nhận không đạt tới chỗ ấy*; Sujato dịch *their vision does not traverse*. Hai cách gần như tương đương, nhưng chưa có tiền lệ trong kho để chốt. `manussā adhammikā honti` tôi dịch **con người trở nên phi pháp**; `adhammika` cũng có thể là *phi lợi ích*, nhưng trong cặp với `tejodhātu`/`vāyodhātu` thì nghĩa *phi pháp* hợp hơn.
  - >-
    Đợt này bị cấm chạy `npm run validate|test|check|build` theo lệnh lát, nên `technical_integrity` đặt **9.6** chứ không phải 10.0: tệp JSON hợp lệ, đủ khoá, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài, không Pāli lọt — tất cả đã quét bằng script riêng trên **mọi** khoá, không chỉ khoá ≥ 40 ký tự — nhưng cổng kỹ thuật của repo thì chưa chạy, nên không thể tuyên bố là đã pass.
