notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato (35/36 khoá có chữ, không khoá Pāli có nội dung nào bị trống). Coverage English = 14/14 khoá Pāli có nội dung = 100%; bài này không phụ thuộc bản lấp English của dự án nên tầng Anh là bản SuttaCentral đã ghim.
  0.1 giữ `Aṅguttara Nikāya 10.168` theo 1599 tệp của bộ Aṅguttara; 0.2 theo tiền lệ 4 bài cùng phẩm (17. Phẩm Vua Jāṇussoṇi, khớp `an10.171/173/174`).
  12 khoá có PĀLI TRÙNG NGUYÊN VĂN với tệp đã có trong HEAD, dùng lại nguyên văn: 0.2 (4 bài) · 1.1 (`an10.120:1.1`, cùng công thức `Ariyaṁ vo … paccorohaṇiṁ desessāmi` — nhưng dịch khác, xem mục lệch có chủ đích bên dưới) · 1.2 (`sn14.1:1.3`) · 1.3 (`sn12.19:4.2`) · 1.4 (`sn1.11:1.6`) · 2.2 (`an10.120:1.4`) · 2.4 (`an10.120:1.6`) · 3.2 (`an10.120:1.6`) · 11.2 (`an10.120:1.7`) · 11.3 (`an10.120:1.8`) · 11.4 (`an10.120:1.21`) · 11.5 (Thứ hai.). Tổng lát c32: 143 cặp.
  LỆCH CÓ CHỦ ĐÍCH, ghi rõ — điểm lớn nhất của bài này: `ariyā paccorohaṇī` / `Ariyaṁ vo, bhikkhave, paccorohaṇiṁ desessāmi` / `paccorohati` dịch là sự bước xuống của bậc Thánh và vị ấy bước xuống khỏi …, chứ không theo `an10.120` (5 khoá) dịch lễ xuống nước của bậc Thánh. Pāli ở đây không có nghi lễ, không có nước; nghĩa là bước xuống khỏi điều ác. Chính `an10.120:1.8` cũng đã dịch động từ là bước xuống khỏi, nên tệp đó tự mâu thuẫn. Người biên tập nên sửa `an10.120` cho khớp.
  Mười món nghiệp dịch theo đúng tiền lệ: sát sinh, trộm cắp, tà dâm, nói dối, nói hai lưỡi (`pisuṇā`, 25 khoá), nói ác khẩu (`pharusā`, 25 khoá), nói lời vô ích (`samphappalāpa`, 4 khoá ở `an4.270`; `an10.224` dùng phù phiếm), tham lam (`abhijjhā`, 288 khoá), sân hận (`byāpāda`, `an3.121:3.3`), tà kiến. `pāpako vipāko` dịch quả xấu, theo 12 khoá của `an10.120`.
  `So iti paṭisaṅkhāya … pajahati` dịng suy xét như vậy rồi từ bỏ …, theo `an10.120:1.7` và `an10.120:1.19`. `diṭṭhe ceva dhamme abhisamparāyañcā` dịch ngay trong đời này và trong đời sau, theo `an10.120:1.6`.
  BẤT ĐỊNH: tên bài `Ariyapaccorohaṇīsutta` 0 tiền lệ. Chọn Kinh Sự Bước Xuống Của Bậc Thánh theo Sujato (The Noble Descent) và theo nghĩa đã chốt ở trên; anh em ruột `an10.167` là `Brāhmaṇapaccorohaṇīsutta` nên người biên tập nên dùng cùng khuôn.
  Mười dấu lược: 3.1, 11.1 có MỘT dấu lược ở đầu (phần lược của món trước); 4.1, 5.1, 6.1, 7.1, 8.1, 9.1, 10.1 có HAI (một ở đầu, một là …pe…), theo đúng Pāli. Không mở rộng bất kỳ dấu lược nào.
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy; technical_integrity 9.6 vì lát này không tự chạy bốn lệnh đó. Đã tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, và mô phỏng đúng `validateSegmentMap` của `scripts/validate.ts` (tiền tố khoá, orphan, requireComplete, non-Latin) — 316/316 khoá sạch.
