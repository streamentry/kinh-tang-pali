notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `2. Anussativagga` → «2. Phẩm Nhớ Tưởng». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an11.21:1.1 — «Tại đấy, Tôn giả Sāriputta bảo các tỳ-kheo:»
  → «Tại đó, Tôn giả Sāriputta gọi các vị tỳ-kheo:» (`āmantesi`, công thức đa số 15/22 khoá); nghĩa không
  đổi, chỉ đồng nhất công thức.

  Rà nhất quán theo Pāli trùng 2026-10-14 (đợt hai): khoá `2.2` bỏ «cho chúng tôi» (không có trong
  Pāli `paṭibhātu etassa bhāsitassa attho`); khoá `2.3`, `6.2` — và `3.1`, `4.1`, `6.3` cùng bài — dấu
  chấm cuối đưa vào trong ngoặc kép/nháy đơn (`.”`, `.’`) theo đa số tầng (10.085 so với 1.711 khoá
  Pāli kết `”ti.`; 3.203 so với 852 khoá kết `’ti.`); giữ nguyên cách dịch ở `6.2` (*tịch tịnh*, *vi
  diệu*) vì khác bản đa số chỉ ở từ đồng nghĩa.

  Rà nhất quán theo Pāli trùng 2026-10-14 (đợt ba): khoá 2.2 — «Lành thay nếu chính Tôn giả
  Sāriputta giải thích ý nghĩa của lời dạy này» → «Lành thay, xin chính Tôn giả Sāriputta làm sáng
  tỏ ý nghĩa của lời nói này» (`bhāsita` là lời nói, không phải «lời dạy»; `paṭibhātu` là lối mệnh
  lệnh «xin»; theo công thức sn22.1, sn22.2, an10.55, vẫn không có «cho chúng tôi»). Giữ nguyên khoá
  2.3 («Nghe từ Tôn giả Sāriputta rồi, các tỳ-kheo sẽ ghi nhớ» đủ `sutvā … dhāressanti`) và 6.2
  («tham ái» là cách dịch đa số toàn tầng: 1.289 chỗ so với «khát ái» 420 chỗ).
