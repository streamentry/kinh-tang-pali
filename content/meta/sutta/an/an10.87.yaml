  - 11 khoá Pāli có trùng nguyên văn với bài khác trong tầng: 0.2 (an10.84/85/86/88/89/90 và các phẩm khác: 24/26 «9. Phẩm Các Vị Trưởng Lão»), 1.2 (77/104 «“Này các tỳ-kheo!”»), 1.3 (101 bài, hai dạng ngang nhau 29/29: «“Bạch Thế Tôn,” các vị ấy đáp.» và «“Bạch Thế Tôn,” các vị tỳ-kheo đáp.», chọn dạng sau), 1.4 (119/230 «Đức Phật nói:»), 12.3 và năm khoá cùng Pāli (350/513 «Vì sao vậy?»), 26.5 (276/281 «Thứ bảy.»). Tổng 3.820 cặp Pāli trùng ngoài bài, 1.224 cặp trong đó bản Việt khác (tính lặp cho 6 khoá cùng Pāli «Taṁ kissa hetu?»; đa số là biến thể xưng hô và lời đáp của từng bài); tôi theo đa số ở từng khoá.
  - Trong chính bài: 4 nhóm Pāli trùng nguyên văn (12.2=13.6; 12.3=13.3=13.7=24.3=25.3=26.3; 12.4=13.8; 24.2=26.2), cả 4 nhóm bản Việt giống nhau: 0 cặp trong bài mà Việt khác. Hai nhóm đối xứng 12.2 (không cung kính) và 24.2 (vẫn cung kính) và hai khoá kết 12.4/24.4 (appahīne → chưa được đoạn trừ; pahīne → đã được đoạn trừ) khác nhau đúng chỗ Pāli khác (na ceva…na…, appahīne/pahīne).
  - Thuật ngữ đã đối chiếu: sabrahmacārī → đồng phạm hạnh (252 khoá; «đồng Phạm hạnh» 11); vaṇṇavādī → tán thán (tầng: dn10, dn25, an3.91, mn32); sikkhākāmo → ham học tập, sikkhāsamādāna → thọ trì học tập (an3.91:5.1, 6.2, cùng cụm Pāli na sikkhākāmo na sikkhāsamādānassa vaṇṇavādī); pāpiccho → ác dục (12 khoá, so «ham muốn xấu» 8); appiccho → ít ham muốn (mn24, mn32); icchāvinaya → đoạn trừ ham muốn (vinaya = đoạn trừ, sn21.9:3.3 kodhamānamakkhavinayattha → đoạn trừ giận, mạn và hiềm khích); kodhano → hay giận dữ (kodha → giận dữ, mn7); makkhī/makkha → gièm pha (21 khoá, mn7 và mn8; «khinh/xem thường» 44 chủ yếu dịch paḷāsa; mn15 dịch cặp makkhī paḷāsī là «xúc phạm và khinh miệt»); saṭho → xảo trá (13) và māyāvī → gian dối (22), như dn25 và dn33; dhammanisanti → quán sát pháp (dn33:2.3.18, dn34:1.8.50; an7.20 «lắng nghe pháp», an7.42 «thẩm xét giáo pháp», Sujato «attending to the teachings», Hòa thượng «vâng theo Chánh pháp»); paṭisallīna → độc cư (141 khoá; thiền tịnh 51, tĩnh cư 16); paṭisanthāra → đón tiếp ân cần (an6.32, an7.70: 21 ân cần, 19 đón tiếp); sakkaroti/garuṁ karoti/māneti/pūjeti → cung kính, tôn trọng, kính lễ, cúng dường (mn77:9.1; tầng: cúng dường 60, tôn trọng 46, kính lễ 36); viññū sabrahmacārī → các vị đồng phạm hạnh có trí (mn2, mn24, mn65); assakhaḷuṅka → ngựa chứng (an11.9:2.6); ājānīya → ngựa thuần chủng (12 khoá mn54, mn65, mn107, an11.9); sāṭheyya/kūṭeyya/jimheyya/vaṅkeyya → mánh khóe, gian trá, lệch lạc, quanh co (mn51:4.14 ánh xạ đúng từng từ Pāli; an8.13 dịch khác nhưng không theo vì khó hiểu); Theravagga → «9. Phẩm Các Vị Trưởng Lão»; Sattamaṁ → «Thứ bảy.».
  - piyatāya garutāya bhāvanāya sāmaññāya ekībhāvāya → «sự thương mến, kính trọng, tôn quý, hòa đồng và hợp nhất», theo đúng an8.2:9.4 và 11 khoá cùng công thức (8/8 khoá an8.2 có cùng chuỗi Pāli đều đã dịch đúng chuỗi này; Sujato fondness, respect, esteem, harmony, unity; Hòa thượng thân ái, kính trọng, làm quen, hòa đồng, nhất trí). Tiền lệ an8.2 dùng dạng piyattāya garuttāya (hai chữ cái đôi), ở đây Pāli là piyatāya garutāya; cùng nghĩa.
  - ayampi dhammo → «pháp này cũng» (Sujato this quality). Phần lược 16.2–22.2: …pe… thay chuỗi piyatāya…sāmaññāya nên Việt viết «pháp này cũng … đưa đến sự hợp nhất», đặt … ở đúng chỗ Pāli.

  SỐ PĀLI: không có số đếm nào trong bài; công thức có năm kết quả (piyatā, garutā, bhāvanā, sāmaññā, ekībhāvā) và mười cặp phẩm chất đối nghịch (adhikaraṇa, sikkhā, icchā, kodha, makkha, sāṭheyya, māyā, dhammanisanti, paṭisallāna, paṭisanthāra) ở 2–11 và 14–23. Bản Việt có đủ 5 vế ở mỗi câu kết đầy đủ (2.2–11.2, 14.2, 15.2, 23.2) và đủ 10 khối ở cả hai nửa.

  BẤT ĐỊNH ĐÃ PHÂN XỬ (không thêm vào thân kinh):
  1. 1.1 kālaṅkataṁ bhikkhuṁ ārabbha: Pāli đã ghim đọc nghĩa đen là «nhân việc một vị tỳ-kheo đã qua đời». Sujato dịch thành tên riêng «the mendicant Kalandaka», Hòa thượng Thích Minh Châu «Tỷ-kheo Kàlaka», tức hai bản trước đọc tên người (Kalandaka/Kāḷaka) chứ không đọc kālaṅkata. Tôi giữ nghĩa đen của Pāli đã ghim, vì nó không mâu thuẫn văn cảnh (một vị tỳ-kheo đã mất có thể là cớ để Đức Phật nêu các pháp khiến không được quý mến) và nằm ngoài giáo nghĩa chính của bài. Chưa xác lập được đây là tên riêng hay phân từ; cần người biên tập phân xử nếu có nguồn Pāli khác. Khoá này chỉ là câu mở đầu, không ảnh hưởng đến phần thân kinh.
  2. Tựa 0.3 Nappiyasutta: Sujato đặt tựa «Disciplinary Issues» (theo adhikaraṇa), Hòa thượng đặt «Tỷ Kheo Kàlaka». Tôi dịch tựa Pāli: na piya = không thương mến, theo piyatā → «thương mến» ở an8.2 → «Kinh Không Được Thương Mến». Tựa không có tiền lệ trong tầng (grep Pāli: chỉ an10.87); độ chắc trung bình.
  3. adhikaraṇiko / adhikaraṇasamatha: tầng dịch adhikaraṇa là «tranh chấp» (15), «vụ việc» (8), «tranh tụng» (4), «kiện tụng» (3; Hòa thượng); Sujato raises disciplinary issues. Chọn «hay gây tranh chấp / việc giải quyết tranh chấp»; phạm vi hẹp hơn («vụ việc luật») có thể đúng hơn, không ảnh hưởng nghĩa chung.
  4. dhammānaṁ nisāmakajātiko / dhammanisanti: nisāmaka là người chú ý, quan sát, lắng nghe; jātika = bản tính. Chọn «có bản tính quán sát các pháp» theo dn33/dn34; các bản khác lệch (xem thuật ngữ ở trên). Không làm thay đổi cấu trúc đối nghịch của mười cặp.
  5. ājānīyaparimajjana → «chải xoa»: parimajjana là xoa, cọ rửa, chải thân; Sujato grooming; Hòa thượng dịch «điều phục» (có vẻ đọc khác). Chọn nghĩa chăm sóc thân thể ngựa.
  6. 12.4 / 24.4 te pāpake akusale dhamme: «những pháp ác, bất thiện ấy» chỉ lại các phẩm chất vừa nêu (mười pháp từ 2.1 đến 11.1); Sujato those bad unskillful qualities. «nơi vị ấy» dịch assa trong tathāhissa.
  - Nghĩa đen mâu thuẫn văn cảnh: chỉ 1.1 như trên; các câu còn lại không có chỗ Pāli đọc nghĩa đen mà trái văn cảnh.

