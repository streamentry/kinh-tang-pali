notes: |-
  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG. `_hvi.kiểm` chỉ quét `cần` = khoá Pāli ≥ 40 ký tự. Ở 16/17 bài của lát này khoá Pāli dài nhất chỉ 19–35 ký tự nên `cần` rỗng và vòng chốt NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG CHẠY LẦN NÀO. Tôi tự quét lại **164/164 khoá** bằng chính các hàm đó (`_chk_rv3.py`): 0 lỗi — không khoá rỗng, không khoá thừa so với Pāli, không thiếu khoá, mọi chuỗi NFC, số dấu lược khớp Pāli từng khoá, ngoặc kép cân trên cả bài, ngoặc tròn cân, không còn `(…)`, không còn sót `pe…`. Chỉ `mil3.1.7` có 4 khoá ≥ 40 ký tự (`:1.2`–`:1.5`) nên ở bài đó chốt thật sự có chạy. `save_vi` chạy sạch, chạy lại hai lần idempotent.

  COVERAGE — ĐO BẰNG CHÍNH HÀM CỦA KHO (chỉ đọc, `englishCoverageFor`). Cả **17/17 bài ra `ratio = 1`**: 16 bài có `substantiveSegments = 0` vì không khoá Pāli nào đủ 40 ký tự; `mil3.1.7` có 4 khoá substantive. Không bài nào rơi dưới ngưỡng 0,8 nên **không** cần mục trong `content/meta/reference-gaps.yaml` — tệp đó tôi không đụng tới.

  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho bất kỳ bài nào trong lát này. Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là **Pāli + English Sujato + các bài song song trong chính tầng này**.

  KỸ THUẬT. Tôi KHÔNG chạy `npm run validate|test|build|check` — đợt này người điều phối cấm và chạy tập trung. Vì vậy `technical_integrity` chấm **9.6 chứ không phải 10.0**; đó là hạn chế thật của lượt đánh giá này chứ không phải lời khen. Tất cả những gì chạy được thì đã chạy.

  BÀI UID-GỘP — KHOÁ THẬT ĐÃ ĐO. Cả 11 khoá đều mang CHÍNH uid gộp `an11.262-309:` (đếm trực tiếp trên tệp Pāli `an11.262-309_root-pli-ms.json`); `an11.262:` không tồn tại trong nguồn tại commit đã ghim, dù API SuttaCentral có sinh `an11.262` riêng. Tôi dùng uid đúng như đọc được, không suy từ tên bài.

  `:0.2 Paṭhamapaṇṇāsaka` → *Nhóm Năm Mươi Đầu* (dùng lại nguyên văn `an11.982:0.2`; Sujato dịch *The First Fifty*). Ba bản khác trên đĩa dùng ba cách khác: *Nhóm Năm Mươi Đầu* ×3, *Bộ Mười Một Bài Kinh Đầu Tiên* ×1, *1. Paṭhamapaṇṇāsaka* (giữ nguyên Pāli) ×1. `:0.3 Sāmaññavagga` → *Phẩm Sa-môn* (6 tiền lệ, gồm `an11.502-981:0.3` cùng phẩm). `:0.4` Pāli là `~` → giữ `~` (y như `an11.982`, `an11.502-981`, `an11.992-1151`).

  `:0.1` — PẢI CHỈ CÓ SỐ BÀI ĐẦU, TÔI BỔ DẢI. Pāli là `Aṅguttara Nikāya 11`; tệp gốc không ghi dải. Sáu bài uid-gộp AN 11 đã có trên đĩa đều bổ dải lấy từ uid, và Sujato cũng ghi đủ dải. Tôi theo đa số, dùng DẤU GẠCH DÀI. Đây là khối TIÊU ĐỀ, không phải lời kinh.

  `:1.1` PĀLI CHỈ CÓ `…` — BẢN DỊCH GIỮ `…`. Đây là khoá duy nhất trong lát mà bản Việt trùng nguyên văn Pāli, và không có cách nào khác: dấu lược không có nội dung ngữ nghĩa để dịch, y như `~` ở `:0.4`. Bản Anh Sujato đã ghim cũng viết đúng `… ` cho khoá này, nên tôi theo.

  **DẤU LƯỢC — THEO PĠLI, KHÔNG THEO SỬ JATO.** Pāli có `…` ở CẢ 7 khoá `1.1`–`1.7` (mỗi khoá đúng một dấu). Bản Anh Sujato đã ghim thêm một dấu `…` ở đầu `1.2` và một dấu ở cuối `1.7`, tức 9 dấu cho 7 khoá. Theo `BRIEF_VI3` §10.1 (mở rộng lược là thêm chữ KHÔNG ĐÁNH DẤU, và đã có tiền lệ bản Anh ghép lỗi được một lát lấp sao chép), tôi giữ **7 dấu**: `1.1` = `…`, `1.2`–`1.7` = `<danh từ>…`.

  **BẢN THÂN BÀI LÀ MỘT ĐOẠN LƯỢC, KHÔNG PHẢI CÂU TRỌN VẸN.** Sáu từ đều là cách bái `…saññāya` (cái tở tương ứng), và tôi dịch như danh từ: *tưởng về sắc… / tiếng… / mùi… / vị… / sự xúc chạm… / pháp…* — theo 20+ tiền lệ `rūpasaññā` → *tưởng về sắc* trong tầng (vd `sn25.6:1.2`, `sn18.6:1.3`, `mn77:23.16`). **BẤT ĐỊNH ĐÃ GHI:** `dhammasaññāya` tôi dịch *tưởng về pháp* theo nghĩa căn (`dhamma` là căn thứ sáu = tâm pháp), còn Sujato dịch *perception of ideas*; hai cách không sai nhau về nghĩa, nhưng *pháp* là cách đã có tiền lệ trong tầng. **BẤT ĐỊNH ĐÃ GHI:** `atth` không có trong Pāli của bài này, nên tôi KHÔNG chèn nghĩa giải thích nào (Sujato chèn cả tiêu đề *Untitled Discourses on Perception of Sights, Etc.* vào khoá `0.4` — khoá đó Pāli chỉ có `~`).

  **ĐỢT HỘI TỤ THUẬT NGỮ 2026-10-02 (lượt sau, lát v6/v7) — MỘT KHOÁ.** Đo lại trên **toàn tầng** `vietnamese-project`, ghép từng khoá với Pāli của chính nó (không đếm `grep` trên chuỗi rời, vì `sadda` tiếng và `saddhā` niềm tin dễ lẫn): `sadda` → *tiếng* **16 lượt / 15 tệp**, → *âm thanh* **13 lượt / 6 tệp**. Bản đa số là *tiếng*, và trong chính lát v6/v7 hai bài đã dùng *tiếng* cho cùng công thức (`an11.70-117`, `an11.358-405`). Tôi đổi `1.3` *tưởng về âm thanh…* → *tưởng về tiếng…*. `phoṭṭhabba` giữ nguyên *sự xúc chạm* (đếm: *xúc chạm* 49 lượt / 26 tệp vs *sắp xúc* 7 lượt / 4 tệp — `sn18.6`, `sn18.7`, `sn18.8`, `an11.310-357`; ba bài `sn18` cùng một loạt). Các khoá khác của bài không đổi, và **không** khoá nào bị lược bớt.
