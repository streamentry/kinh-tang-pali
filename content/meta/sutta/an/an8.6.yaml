notes: |-
  Dịch mới đủ 70/70 khoá từ Pāli root tại commit đã ghim; thứ tự khoá đúng thứ tự Pāli, không khoá thừa, thiếu hay rỗng.

  COVERAGE ENGLISH (đo lại): mẫu số = khoá Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`) = 28 khoá. `english-sujato` phủ 28/28 = 1.000 (ngưỡng 0.8); khoá Sujato bỏ trống duy nhất là colophon `9.5` (dưới 40 ký tự nên không vào mẫu số). Không có tệp lấp `english-project` cho bài này nên toàn bộ phần phủ là Sujato độc lập, không phải lớp của dự án. Tầng `vietnamese-current` không có trong store (bilara tại commit đã ghim chỉ phân phối Pháp Cú tiếng Việt); bản Hòa thượng Thích Minh Châu nguyên bài của SuttaCentral (tham khảo toàn văn, không căn lề theo khoá) được đọc để đối chiếu thuật ngữ.

  ĐỐI CHIẾU: Pāli là chuẩn; Sujato dùng để kiểm cú pháp (`favor/oppose`, `occupy their mind`); bản Thích Minh Châu dịch `thuận ứng / nghịch ứng`, `xâm nhập tâm`, `lợi dưỡng`. Bản này chọn khác ở ba điểm có chủ ý: `pariyādāya tiṭṭhati` → `chiếm ngự tâm` (39/39 khoá cùng công thức trong tầng đều viết `chiếm ngự`, 0 khoá `xâm nhập`) · `lābho` → `lợi ích` (nguyên văn `an8.5:1.3`, cùng nhóm tám pháp thế tục) · `anurujjhati / paṭivirujjhati` → `thuận theo / chống đối` (0 tiền lệ cho hai động từ; danh từ ghép `anurodhavirodha` ở tầng là `ưa và ghét` (mn38) và `ưa thích và chống đối` (snp2.13:4.3); giữ gốc `chống đối`).

  DÙNG LẠI NGUYÊN VĂN (đo bằng Pāli trùng nguyên văn trên toàn tầng): 25 khoá của bài có Pāli trùng với bài khác, tổng 691 cặp, trong đó 243 cặp bản Việt khác (phần lớn do công thức mở đầu/kết bài dịch nhiều cách: `Bhagavā etadavoca:` 205 cặp, `Chaṭṭhaṁ.` 272 cặp, `Evaṁ, bhante…` 66 cặp). Đã chọn cách đa số hoặc cách của bài anh em: `1.1`, `1.3`, `7.1`–`7.3`, `8.3` ← `an8.5` · `2.4` ← `an3.68:1.8` (và `an10.58:1.3`) · `3.1`, `3.2`, `3.3`, `9.5` theo dạng đa số của công thức · `0.2` → `1. Phẩm Từ` (4 khoá, so với 1 khoá `1. Phẩm Từ Bi`). `1.2` `Katame aṭṭha?` → `Là tám nào?` theo bài anh em `an8.5` và tỉ lệ 7/7 trong `an` (toàn tầng 14 `Thế nào là tám?` / 8 `Là tám nào?`). `5.2/5.12` `So iti paṭisañcikkhati:` → `Người ấy suy nghĩ như sau:` (22/36 cặp). `4.7/6.7` có ba dạng trong tầng, chọn `‘… khổ’, Ta nói vậy`. `2.3` và `6.8`: cụm `viseso / adhippayāso / nānākaraṇaṁ` → `sự khác biệt / điểm vượt trội / điều khác nhau` (nguyên cách của `an3.116:1.8` với cùng khuôn `sutavato ariyasāvakassa assutavatā puthujjanena`; bản này thêm `này các tỳ-kheo` vì Pāli có `bhikkhave`). Cặp Pāli trùng ngay trong bài: 11 nhóm (22 khoá), 0 nhóm bản Việt khác.

  THUẬT NGỮ (có số đếm): `assutavā puthujjano` → `phàm phu không có học` (16 khoá; đối ứng với `ít nghe` 7, `không được nghe` 10) · `sutavā ariyasāvako` → `đệ tử Thánh đa văn` (106 khoá `đa văn`; `đệ tử Thánh` 130 so với `thánh đệ tử` 75 trong `an`) · `vipariṇāmadhamma` → `chịu sự biến hoại` (28 khoá `chịu sự …`; `biến hoại` 109 khoá, `chuyển biến` chỉ 2 khoá, đều ở `an8.5`) · `satimā` → `có niệm` (232 khoá) · `sumedho` → `bậc trí` (4 khoá) · `yathābhūtaṁ pajānāti` → `biết rõ đúng như thật` (70 khoá `đúng như thật`) · `jātiyā jarāya maraṇena …` → `sinh, già, chết, sầu, bi, khổ, ưu, não` (26 khoá) · `lokaṁ anuparivattanti` → `xoay quanh` (11 khoá).

  KHÁC BIỆT VỚI `an8.5` (cùng một đoạn kệ, Pāli trùng 12 khoá, bản Việt giống nhau 4 khoá và khác 8 khoá — khác có chủ ý, không sửa `an8.5`): (1) `8.1` `satimā sumedho` → `bậc trí có niệm` (`an8.5:3.1` viết `người có tỉnh tác`: `tỉnh tác` ở tầng là `sampajāna` (sn36.3:5.2, ne8:6.1) và bản đó bỏ `sumedho`); (2) `7.4`, `8.2` dùng `chịu sự biến hoại` thay `mang tính chuyển biến` (109 so với 2); (3) `8.4` `Aniṭṭhato no paṭighātameti` → `đối với điều không ưa thích, không sinh bực bội` (`an8.5:3.4` viết `những pháp không ưa thích cũng không làm tâm bực bội`, đổi chủ ngữ); (4) `9.1`–`9.4`: `Tassānurodhā atha vā virodhā` → `Sự thuận theo hay chống đối của vị ấy` (`an8.5:4.1` viết `Tùy theo điều ấy`), `vidhūpitā atthaṅgatā` → `đã được xua tan, đã lặn mất`, và `Sammappajānāti bhavassa pāragū` → `bậc đã đến bờ bên kia của hữu hiểu biết chân chánh` (`an8.5:4.4` viết `chính thắng người biết rõ bờ bến của sự hiện hữu`, hiểu `sammā` thành `chính thắng`). Ngoài ra `an8.5:1.4` bắt đầu bằng chữ thường `này` trong khi `an8.6:1.4` viết hoa. Đề nghị người biên tập cân nhắc cho `an8.5` khớp lại.

  BẤT ĐỊNH ĐÃ GHI: (1) `9.3` `padaṁ` có thể là `trạng thái`, `cảnh giới` hay `chỗ đặt chân`/`con đường` (tầng: 20 khoá `bước`, 12 `cảnh giới`, 10 `trạng thái`, 9 `con đường`); chọn `cảnh giới` theo `sn8.2:6.3` và Sujato `state`. (2) `9.1` `tassa` có thể đọc là sở hữu (`của vị ấy`) hoặc thuộc cách `nơi vị ấy`; chọn sở hữu. (3) `3.17/5.14` `idaṁ dukkhaṁ … aniccaṁ dukkhaṁ`: `dukkhaṁ` đầu là mục `khổ` trong danh sách tám pháp, `dukkhaṁ` sau là tính chất; giữ lặp `khổ` để theo đúng Pāli, không thêm `nỗi`/`cái`. (4) `lābho/alābho` chọn `lợi ích / mất lợi ích` cho nhất quán với `an8.5` dù truyền thống Việt hay dùng `lợi dưỡng`; đã đo: `an4.192`, `dn33`, `dn34` dùng `được cho/được lợi`, nên tầng chưa thống nhất. (5) Khoá `3.9`–`3.13`, `5.6`–`5.10` bắt đầu bằng chữ thường vì Pāli là câu tiếp ngay sau `…pe…`/dấu lược của khoá trước.

  KIỂM ĐÃ CHẠY: tập khoá Việt = tập khoá Pāli (70 = 70, đúng thứ tự); nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá trên 70 khoá (0 lệch); dấu lược `…` cân bằng Pāli từng khoá (10 khoá `…` trần, 2 khoá `…pe…` chuyển thành một `…`); NFC sạch; 0 khoá rỗng; không có Pāli lọt sang bản Việt ngoài khối `0.1` (tên bộ `Aṅguttara Nikāya`); số Pāli: `aṭṭha` = tám, khớp tám mục của danh sách `1.3` (lābha, alābha, yasa, ayasa, nindā, pasaṁsā, sukha, dukkha); không có số lớn nào khác.

