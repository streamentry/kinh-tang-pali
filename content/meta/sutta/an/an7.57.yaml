notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh trên Pāli có nội dung: 45/45 = 100%** (ngưỡng 0.8): 34 khoá do Sujato, 11 khoá `2.6`, `4.2`, `4.3`, `5.2`, `5.3`, `6.2`, `6.3`, `7.2`, `7.3`, `8.2`, `9.2` do tầng `english-project` (published) lấp — nhưng bản lấp này do cùng agent chấm, **không phải cách đọc Anh độc lập**, nên 11 khoá đó được kiểm lại bằng Pāli đặt cạnh Pāli: chúng là cùng một câu hỏi lặp và cùng một đáp lặp trong bài, đồng thời đối chiếu song hành an5.34 (cùng bài kinh, 5 quả thay vì 7). Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ phân phối Pháp Cú) — đặc điểm của snapshot upstream, không phải thiếu sót của repo. `external-references.yaml` không khai budsas cho AN, nên không có tra cứu toàn văn Việt cho bài này.
  **8 khoá có Pāli trùng nguyên văn ở bài khác; 7 dùng lại NGUYÊN VĂN.** `0.2` (4/4: *6. Phẩm Những Điểm Không Tuyên Bố*) · `0.3` (1/1: *Kinh Với Tướng Quân Sīha* — an5.34 là bài song hành cùng tên `Sīhasenāpatisutta`) · `1.1` (218/422: *Tôi nghe như vầy.*) · `1.3` (an5.34:1.2, nguyên văn) · `10.12` (an5.34:7.8, nguyên văn) · `10.15` (an5.34:7.10, nguyên văn) · `10.17` (153/249: *Thứ tư.*). Riêng `1.2` có 12 tiền lệ trùng byte không có đa số tuyệt đối (3-2-2-1...): tôi chọn *giảng đường mái nhọn* (2/12) vì `kūṭāgārasālā` là `sālā` (giảng đường, như an5.34 cùng bài dịch *giảng đường có mái chóp*), KHÔNG theo x3 *ngôi nhà có nóc nhọn* — đây là lệch có chủ đích, cần sửa cả 12 nếu gộp sau này.
  **Lặp trong bài khớp tuyệt đối.** 7 khoá `2.6` `4.2` `5.2` `6.2` `7.2` `8.2` `9.2` là một chuỗi Pāli trùng byte (phép đo bằng script), nên bản Việt viết đúng một chuỗi: *kẻ bất tín, keo kiệt, bủn xỉn, hay sỉ nhục, hay người có lòng tin, vị thí chủ, luôn hoan hỷ cho đi*. Cặp `10.1`=`10.10` và `10.2`=`10.11` cũng trùng byte và được dịch giống nhau.
  **Thuật ngữ, có đếm.** `0.1` theo mẫu đa số *Kinh Tăng Chi Bộ* (910 tệp) so với giữ Pāli *Aṅguttara Nikāya* (368 tệp). `arahanto` → *bậc A-la-hán* (1.451 khoá). `anukampati` → *thương xót* (121 khoá); tiền lệ trực tiếp duy nhất của công thức này là an5.38 (*thương mến trước tiên*) — tôi không theo vì `anukampā` là thương xót/kíp thương, không phải yêu mến; `parisaṁ` → *hội chúng* (696 khoá, đúng như an5.34) · `visārado amaṅkubhūto` → *với tự tin, không e ngại* (nguyên văn cách dịch của an5.34 cho cùng công thức) · `sandiṭṭhikaṁ dānaphalaṁ` → *quả của sự bố thí hiện tại thấy ngay* (an5.34) · `kalyāṇo kittisaddo` → *tiếng đồn tốt đẹp* được truyền tụng (an5.34:4.1, 26 lần trùng ở 20 tệp cho cụm họ hàng) · `dāyako dānapati` → *người bố thí, vị thí chủ* (an5.34) · `saddho` → *có lòng tin* (157 khoá) · `anuppadānarato` — hapax toàn root (chỉ có ở an7.57; ja536 có `anuppadānena` nghĩa *cho đi*), dịch *luôn hoan hỷ cho đi* theo Sujato *loves charity* · `assaddho maccharī kadariyo` → *bất tín, keo kiệt, bủn xỉn* (`maccharī` theo an5.34:9.2 *vết nhơ keo kiệt*; `bất tín` 17 khoá so *vô tín* 12, và an5.38 dùng *người bất tín*) · `paribhāsako` → *hay sỉ nhục* (15 khoá) · `kāyassa bhedā paraṁ maraṇā sugatiṁ saggaṁ lokaṁ` → *sau khi thân hoại mạng chung, thọ sinh vào thiện thú, cõi trời* (440 khoá cho cụm thân hoại; 91 khoá thiện thú; an10.217-220 cùng công thức).
  **4 khoá `4.3` `5.3` `6.3` `7.3` là đáp lặp có động từ khác nhau** (`upasaṅkamati/paṭiggaṇhāti/deseti/abbhuggacchati`), giữ đúng bốn động từ ấy: *đến gần thăm* · *tiếp nhận vật thực* · *thuyết pháp* · *được truyền tụng tiếng đồn*.
  **Hạt `ti` ở cuối lời thoại:** bẩm theo an5.34 (bài song hành), hạt `ti` được bỏ, chỉ giữ dấu `“ ” ‘ ’` đúng vị trí Pāli từng khoá (kiểm bằng script).
