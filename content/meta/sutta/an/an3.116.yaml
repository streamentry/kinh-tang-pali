  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.6, 1.7, 2.4, 2.5, 3.4, 3.5 — «trụ cho đến hết thọ mạng của các vị thiên ấy, xả hết thọ mạng ấy rồi…» → «ở cho đến khi hết thọ mạng, đã dùng hết tuổi thọ của những chư thiên ấy, thì…» (khepetvā = dùng hết; công thức 6/9 khoá toàn tầng); «súc sinh giới / ngạ quỷ giới» → «súc sinh / ngạ quỷ» theo cùng công thức; «chư thiên» viết thường theo 1.4–1.5 trong bài.
