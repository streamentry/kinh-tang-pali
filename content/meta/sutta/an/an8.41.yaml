notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato ở commit đã ghim (36/36 segment
  có nội dung đều có chữ Anh, coverage 100%). Tầng Việt hiện hành không có bài này:
  `translation/vi/phantuananh/` ở commit đã ghim chỉ chứa Pháp Cú.
  Tên phẩm 0.2 lấy theo 3 tiền lệ cùng phẩm `Uposathavagga` đã dịch: an8.44, an8.47,
  an8.48 đều dùng «5. Phẩm Giữ Trai». Cụm `aṭṭhaṅgasamannāgato uposatho` dùng nguyên
  văn an8.44:2.2 làm tiền lệ: «giữ trai giới có đủ tám điều kiện».
  TRÙNG NGUYÊN VĂN: đo bằng cách so Pāli từng cặp, `Imināpaṅgena arahataṁ anukaromi,
  uposatho ca me upavuttho bhavissatī’ti` ở 2.6 và 3.3–9.3 là MỘT chuỗi giống hệt ⇒ 8 khoá
  ấy dùng nguyên văn y hệt nhau, chỉ khác ở "Iminā" → "Ta".
  Ngoặc kép: chuỗi trích trong tám điều kiện nằm trong lời Thế Tôn đang mở từ 2.1, nên
  nó đóng bằng nháy cong `’` ở 2.6/3.3/…/9.3 (khớp `bhavissatī’ti` của Pāli), còn nháy
  kép `”` của Thế Tôn đóng ở 10.1. Lần so đầu đã đóng bằng `”` và làm ngoặc lệch 7;
  đã sửa.
  `lajjī dayāpannā` dịch «hiền thiện, có lòng từ bi» — giữ cả hai vị tính, không rút còn
  một. `sabbapāṇabhūtahitānukampino` dịch «đầy tình thương với mọi loài đang sống».
  `nikhīlathito`/`dinnādāyī dinnapāṭikaṅkhī` dịch «chỉ lấy những gì được cho, chỉ mong
  những gì được cho» — "mong" là `kaṅkhī`, "lấy" là `dinnādāyī`, giữ đúng hai vế.
  `nīcaseyyaṁ kappenti` dịch «chỉ ngủ ở chỗ thấp»; `ekabhattikā rattūparatā` dịch «ăn
  trong một thời khóa, kiêng tránh ăn vào ban đêm» — Sujato dịch "eat in one part of the
  day"; Pāli `ekabhattikā` mới là giữ đúng một bữa, nên thêm "một thời khóa" cho tự nhiên
  mà không đổi nghĩa.
  technical_integrity 9.6: môi trường lát này không có shell, nên không tự chạy được
  `npm run validate`/`test`/`build`; các bài đã tự kiểm bằng bản cài lại logic của
  `_hvi.py` (đủ khoá, không thừa khoá, NFC, không trùng nguyên văn Pāli, số dấu lược
  khớp từng khoá, ngoặc kép cân trên cả bài theo thứ tự số).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.3 — ‘vị thánh đệ tử khéo tác ý đúng đắn’ → ‘vị Thánh
  đệ tử suy xét như vậy’ (`iti paṭisañcikkhati` là ‘suy xét như vậy’, không phải `yoniso manasi karoti`;
  3/5 khoá trùng); khoá 2.4 (và 2.5) — ‘Trong suốt phần đời còn lại’ → ‘Trọn đời’ (`yāvajīvaṁ`, bỏ ‘phần
  còn lại’ không có trong Pāli; đồng nhất ở 3.1, 4.1, 5.1, 6.1, 7.1, 8.1, 9.1); ‘sát sanh’ → ‘sát sinh’
  (622 so với 16 toàn tầng); ‘hiền thiện, có lòng từ bi, sống đầy tình thương với mọi loài đang sống’ →
  ‘biết hổ thẹn, có lòng thương, sống thương tưởng đến lợi ích của mọi sinh vật’ (`lajjī` là ‘biết hổ
  thẹn’, không phải ‘hiền thiện’; `hita` bị bỏ sót ở bản cũ; 2/3 khoá trùng). Chưa sửa trong đợt này
  (ngoài phạm vi): 4.1–4.2 (‘tà hạnh … sống xa lai … tà dâm’ cho `abrahmacariya … ārācārī … methuna`).

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt hai): khoá 9.1, 9.2 — ‘chỗ nằm cao lớn’ → ‘giường ngủ cao sang lớn lao’ (`uccāsayanamahāsayana`, cách đa số 10 khoá); ‘chỉ ngủ ở chỗ thấp — chiếc chiếu hay tấm cỏ’ → ‘nằm ngủ chỗ thấp trên giường nhỏ hay tấm trải cỏ’ (`mañcaka` là giường nhỏ, không phải ‘chiếc chiếu’; bỏ ‘chỉ’ không có trong Pāli); giữ nguyên khoá 2.5 (‘Ta cũng trong đêm nay và ngày hôm nay …, đặt gậy và kiếm xuống’ đủ `ahampajja imañca rattiṁ imañca divasaṁ` và `nihitadaṇḍo nihitasattho`, đồng nhất với 3.2–9.2 trong bài, chỉ khác văn phong so với cách đa số).