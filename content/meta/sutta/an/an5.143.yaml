notes: |-
  Giải quyết draft 2026-10-12 (kiểm toán độc lập, đọc đối kháng từng khoá với Pāli root đã ghim, Sujato đã ghim và tiền lệ trong kho).
  Blocker cũ "cắt ngắm tại an5.143:4.6" thuộc loại lỗi văn bản nhưng đã lỗi thời: khoá này hiện là câu đầy đủ, không có dấu lược `…` nào ở bản Việt (Pāli 4.6 là câu trọn, không có `…pe…`). Đã gỡ blocker.
  Sửa nghĩa thật (accuracy fix) 5 khoá: 5.1 "bị thỏa mãn nơi các dục, nên…" sai — kāmādhimutta là "thiên về/chuyên chú vào dục", genitive "Kāmādhimuttānaṁ … licchavīnaṁ" đi với "câu chuyện khởi lên" chứ không phải quan hệ nhân quả "nên"; kāmaṁ số ít → "dục". 5.5–5.8: mỗi mục có vị ngữ "pātubhāvo/puggalo dullabho lokasmiṁ" riêng, bản cũ dồn một vị ngữ ở cuối 5.8 làm 5.5–5.7 cụt vị ngữ; 5.6 thiếu "desitassa" (đã được thuyết giảng); 5.7 lộn trật tự "viññātā … dhammānudhammappaṭipanno" (hiểu rõ rồi thực hành). Đã khôi phục từng vị ngữ và đúng trật tự theo Pāli.
  Khôi phục lặp (1.6, 4.8): Pāli lặp "pātubhāvo dullabho lokasmiṁ" cho từng báu; bản cũ gộp thành một vế. Nay giữ đủ năm vế. Thuật ngữ theo tiền lệ tầng (dn17/dn26/dn30, 13–21 khoá mỗi từ): hatthiratana = voi báu, assaratana = ngựa báu, maṇiratana = ngọc báu, itthiratana = nữ báu, gahapatiratana = gia chủ báu (bản cũ "báu voi… báu minh châu, báu phụ nữ" lệch tiền lệ).
  Sửa khác: 1.3/4.5 "nổ ra" → "khởi lên" (antarākathā udapādi: tiền lệ mn119, sn3.12, dn14…; "nổ ra" chỉ có ở đây trong nghĩa này); 2.6 → "tùy thời mà làm điều … thấy nên làm" (tiền lệ dn16:1.25.2 cho yassadāni … kālaṁ maññathā); 2.5 thêm "ayaṁ so" (đây là); 4.1 thêm "sādhu" (lành thay), bỏ "Đức Thế Tôn" thừa; 4.4–5.9 "các người" → "các ông" khi Đức Phật nói với người cư sĩ; 4.5 "chúng tôi" → "chúng con" (người nói với Đức Phật); 1.4, 4.6, 5.2 bỏ "này" không có trong Pāli (imesaṁ chỉ ở 1.7, 4.9, 5.9); Pháp và Luật, tuyên bố, biết ơn và nhớ ơn theo an5.195, an3.114, an5.39.
  Cặp Pāli trùng nguyên văn trong bài đã dò: 1.4–1.7 với 4.6–4.9 (4 cặp) và 5.3 với 1.5/4.7; bản Việt nay khớp nhau (4 cặp chỉ khác nhau ở dấu nháy đơn/kép đúng như Pāli). Đã kiểm dấu nháy khớp Pāli từng khoá.
  Coverage English: Sujato phủ 25/27 khoá Pāli có nội dung (0,926, trên ngưỡng 0,80); Sujato để trống 4.7–4.9 (4.8 và 4.9 là khoá có nội dung) và giữ dấu lược `…` ở 4.6; chỗ ấy tự đứng vững từ Pāli, không cần bản lấp. Tầng Việt hiện hành không có cho bài này (giới hạn upstream: chỉ có Pháp Cú); triangulation giữ 9,0.
  Số: pañcamattānaṁ licchavisatānaṁ = "chừng năm trăm" (pañca + matta + sata); ratana = năm; không có số lớn khác.
  Bất định còn lại: "tùy theo pháp" cho dhammānudhammappaṭipanno (tiền lệ dn16 "pháp và tùy pháp", sn/an8 "thực hành đúng pháp") — giữ cách hiểu "thực hành pháp thuận theo pháp"; "câu chuyện giữa chừng" cho antarākathā (tiền lệ khởi lên giữa các vị).
  technical_integrity 9,6: chưa chạy các lệnh npm run validate, npm test, npm run check, npm run build ở phiên này; chỉ kiểm tập khoá, dấu nháy, dấu lược `…`, NFC.
