notes: |-
  TẦNG THAM KHẢO: có Sujato cho cả 31 khoá; đo coverage theo công thức `source/layers.yaml`
  (Pāli có nội dung ≥ 40 ký tự, loại block tham chiếu `:0`) cho 22/22 khoá có nội dung =
  100%, trên sàn 0.8 ⇒ đủ điều kiện `published`. Lớp lấp `english-project` không cần dùng.
  Lát c14: 10 bài, 310 khoá, dịch đủ MỌI khoá trong `all` của vc/c14.json. Đã đọc
  HẾT vc/p14.txt trước khi viết chữ. 110/310 khoá trùng nguyên văn Pāli với bài đã merge, đã
  dùng lại đúng nguyên văn đó (đếm bằng _dup14c.txt).

  Tiền lệ có đếm và dùng lại cho bài này:
  · `Katame aṭṭha?` → “Thế nào là tám?” (đa số 9/21 bản cùng Pāli; “Là tám nào?” chỉ 7).
  · `Katamāni pañca?` → “Thế nào là năm?” (đa số 73/97).
  · `…pe…` trong thân bài → “…” (440 bản).
  · `Navamaṁ.` → “Thứ chín.” (237 bản).
  · Công thức `puññābhisandā kusalābhisandā sukhassāhārā … saṁvattanti` → “dòng phước
    chảy tràn, dòng thiện chảy tràn …” theo an4.51:1.4, an5.45:5.2, sn55.32/33:1.5 (đa số
    trong tầng). CHÚ Ý tầng đã có hai cách: “nguồn phước báu tràn đầy, nguồn thiện pháp tràn
    đầy” (sn55.43) và “dòng phước chảy tràn, dòng thiện chảy tràn” — tôi chọn nhóm đông hơn
    và nhất với cả ba AN mà tôi dịch cùng lát.
  · Danh sách `mahādānāni aggaññāni rattaññāni vaṁsaññāni porāṇāni asaṅkiṇṇāni
    asaṅkiṇṇapubbāni, na saṅkiyanti … appaṭikuṭṭhāni samaṇehi brāhmaṇehi viññūhi` →
    “bố thí lớn, tối thượng, truyền thống lâu đời, là dòng dõi, nguyên thủy, không trộn
    lẫn, chưa từng bị trộn lẫn, không bị nhiễu loạn hiện nay và cũng sẽ không bị nhiễu
    loạn, không bị các Sa-môn Bà-la-môn có trí khinh miệt” — dựng từ an4.28:1.1 và
    an4.30:2.1 (cùng công thức, cùng AN).
  · `ariyasāvako` → “đệ tử Thánh” (93 so với “Thánh đệ tử” 4).
  · `Xṁ pahāya Xā paṭivirato hoti` → “từ bỏ X, kiêng tránh X” theo sn2.23, sn35, sn31
    (2-3 bản mỗi cách).

  Tên phẩm KHÔNG phải đặt mới — đã có tiền lệ và tôi khớp vào: `Abhisandasutta` → “Kinh
  Dòng Phước Chảy Tràn”, đúng như sn55.31:0.3 “Kinh Dòng Phước Chảy Tràn Thứ Nhất”,
  an4.51:0.3, an4.52:0.3 “Kinh Dòng Phước Chảy Tràn Thứ Hai” và an5.45:0.3 “Kinh Dòng
  Phước Chảy Tràn” (4 bản). Đây là bài con thứ tư của AN8 nên tôi giữ dạng không đánh số
  như an5.45. Sujato dịch “Overflowing Merit”.

  0 tiền lệ, phải tự đặt: `abhayaṁ averaṁ abyābajjhaṁ` → “sự không sợ hãi, không oán thù,
  không phiền não” (0 bản nào có đủ cả ba tiếp nối; chỉ có các cụm lẻ như “không sợ hãi,
  không oán thù” ở dhp258:3).

  Bất định đã ghi lại: `Dānavagga` trong tầng có HAI cách — “Phẩm Cho Dâng” (4: an8.31,
  32, 37, 38) và “Phẩm Bố Thí” (2: an8.33, 40). Tôi theo đa số “Phẩm Cho Dâng”. Cả hai đều
  lệch về `dāna`; người điều phối có thể chuẩn hoá về một. GHI CHÚ: bản Sujato dịch
  “Dānavagga” là “4. Giving” và `Bhūmicālavagga` (an8.65) là “7. Earthquakes” — “Earthquakes”
  là nghĩa sai của `bhūmi-cāla` (tầng đất nền), không phải động đất; tôi dịch theo Pāli.

  Một lượt review đối kháng tự bắt được và đã sửa: khoá 7.5 `aṭṭhamo` đã từng bị dịch
  “thứ tám” theo quán tính nhịp kệ, và khoá 8.2 `Navamaṁ.` là “Thứ chín.” — kiểm lại cấu
  trúc cho thấy Pāli cố ý nhảy số (chỉ liệt kê ba nơi quy y rồi tới tám món bố thí), nên
  đây là điển số mục, không phải lỗi đếm; tôi giữ nguyên như Pāli và đã ghi ở đây.

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
