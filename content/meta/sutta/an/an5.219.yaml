  - >-
    **⚠ BẢN ĐẦU TÔI BỎ MẤT TÊN BÀI Ở `0.3` của cả bốn bài** — để nhầm `~` (bài
    trong chuỗi lặp, không tên riêng) cho trường hợp có tên. Pāli ghi rõ:
    `Yāgusutta`, `Aggisutta`, `Paṭhamakulūpakasutta`, `Nissayasutta`. Đã sửa
    thành *Kinh Bàn Xe*, *Kinh Lửa*, *Kinh Người Cư Sĩ Thứ Nhất*, *Kinh Nơi
    Nương Nhờ*. Bối cảnh: bài nào có `0.3` = `~` thì **không** có tên, còn bốn
    bài này thì có — và `an7.615`, `an8.118`, `an8.120`, `an9.93`, `an9.94`
    trong cùng loạt mới đúng là `~`.
