notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  **Sửa lỗi (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và xuất bản.**
  `3.1` bị cụt còn *“Nhưng thưa Tôn giả Gotama, đó là pháp nào?”* (44 ký tự cho 148 ký
  tự Pāli), mất cả vế định nghĩa `eko dhammo bhāvito bahulīkato yo ubho atthe
  samadhiggayha tiṭṭhati—diṭṭhadhammikañceva atthaṁ, yo ca attho samparāyiko`. Đây
  **không phải** dương giả như dự đoán ban đầu. Đã viết lại theo đúng văn bản của `2.1`.
  **Lượt cải thiện 2026-10-13** — đọc đối kháng 25/25 khoá với Pāli, đối chiếu bản Anh đã ghim và các bài song song cùng công thức (sn22.102, an10.15, sn3.17); sửa 16/25 khoá, không đổi tập khoá.
  Dấu lược (`segment_alignment` 6.5 → 8.8; `semantic_fidelity` 8.0 → 8.8): `5.2`, `6.2`, `7.2`, `8.2` Pāli chỉ là `evamevaṁ kho, brāhmaṇa …pe….` nhưng bản cũ bung đoạn lược thành văn (“không buông lung là một pháp mà khi được tu tập… …”); nay còn đúng một `…` như an10.15 (6/6 khoá cùng công thức). 4 khoá này trùng nguyên văn Pāli nên Việt giống nhau. Đã dò 25 khoá: 1 nhóm trùng nguyên văn (4 khoá), 0 cặp khác nhau.
  Thuật ngữ (`terminology` 9.2 → 9.5): `appamāda` “buông lung” → “phóng dật” ở `0.3`, `3.2`, `4.2`, `9.2` — toàn tầng 277 khoá dùng “phóng dật” so với 38 khoá “buông lung”, trong AN 59 so với 8; ba bài cùng tên `Appamādasutta` (sn3.17, an4.116, an10.15) đều là “Không Phóng Dật”; glossary `pamāda` ưu tiên “phóng dật”. `gopānasiyo` “rui mè” → “cây rui” (`5.1`; “mè” là thêm ý không có trong Pāli; tiền lệ sn22.102, an10.15, an3.109, sn46.7). `kūṭāgāra` “đỉnh nhọn” → “mái nhọn” (sn22.102, an10.15, an3.109). `aggamakkhāyati` thống nhất “được gọi là tối thượng” ở `4.1`, `5.1`, `8.1`, `9.1` (bản cũ trộn “bậc nhất” và “được xem là tối thượng”; hai bài song song gần nhất dùng “được gọi là tối thượng”). `tārakarūpānaṁ` “tinh tú” → “các vì sao” (an10.15; Hán–Việt hiếm). `jaṅgalānaṁ pāṇānaṁ` “sinh loại đi trên cạn” → “sinh vật sống trên cạn” (sn3.17, an10.15).
  Nghĩa (`4.1`): `samodhānaṁ gacchanti` “hội tụ vào” → “nằm gọn trong” (an10.15; bản Anh “fit inside”); `yadidaṁ mahantattena` bản cũ đọc thành nguyên nhân “vì sự to lớn của nó”, nay “tức là về tầm vóc to lớn” (an10.15, sn3.17). `7.1`: `tadanvayāni` bản cũ thêm “rụng xuống” không có trong Pāli, nay “đều đi theo nó” (bản Anh “follow along”); hai bài song song mỗi bài tự thêm một động từ khác (dn1 “đứt theo”, sn22.102 “rơi theo”) nên không có tiền lệ đa số. `6.1`: bỏ “mà” gượng trước “rũ xuống”. `11.2`: “nhận con làm cư sĩ quy ngưỡng” → “ghi nhận con là cư sĩ, từ hôm nay trở đi, trọn đời quy y” — dạng đa số 11/37 khoá cùng công thức (khoảng 30 khoá dùng “quy y”, “quy ngưỡng” chỉ 4); “quy ngưỡng” không nói được `saraṇaṁ gataṁ`.
  Câu (`3.1`, `vietnamese_clarity` 9.3 → 9.4; `han_viet_balance` 9.4 → 9.5): “pháp nào là pháp mà khi…” (lặp gượng) → “một pháp mà khi được tu tập… —là pháp nào?”; `3.2` bỏ “sự… chính” (Pāli `kho` chỉ là tiểu từ nhấn, `4.2`/`9.2` đã không có).
  Bất định còn lại (không đổi điểm `ambiguity_integrity`, giữ 9.2): `nicchādeti` (`6.1`) chỉ xuất hiện ở bài này và, ở dạng `nicchoṭeti`, ở sn22.102 (“đập cho ráo”); “rũ sạch” theo bản Anh “shakes off”, sắc thái chính xác chưa phân xử được. `anuyantā` (`8.1`) giữ nghĩa đen “đi theo”; hai bài song song dùng “chư hầu”/“bề tôi” nhưng Pāli không nói rõ quan hệ. `kalaṁ nāgghanti soḷasiṁ` (`9.1`) giữ “không bằng một phần mười sáu” như an10.15 (toàn tầng 5 khoá dùng “không đáng một phần mười sáu”, 4 khoá dùng “không bằng”; chưa phân xử được).
  Ngoài phạm vi tệp: bài an6.54 `an6.54:30.4` (tóm kệ) còn ghi tên “Không Buông Lung” cho bài này; cần đổi thành “Không Phóng Dật” nếu muốn nhất quán.
  technical_integrity vẫn 9.6: các lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
