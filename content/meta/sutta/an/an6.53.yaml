  **Sửa lỗi (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và xuất bản.**
  `3.1` bị cụt còn *“Nhưng thưa Tôn giả Gotama, đó là pháp nào?”* (44 ký tự cho 148 ký
  tự Pāli), mất cả vế định nghĩa `eko dhammo bhāvito bahulīkato yo ubho atthe
  samadhiggayha tiṭṭhati—diṭṭhadhammikañceva atthaṁ, yo ca attho samparāyiko`. Đây
  **không phải** dương giả như dự đoán ban đầu. Đã viết lại theo đúng văn bản của `2.1`.
