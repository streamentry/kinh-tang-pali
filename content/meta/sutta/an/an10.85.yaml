notes: |-
  Dịch từ Pāli root đã ghim (90/90 khoá, đúng thứ tự Pāli), đối chiếu bản Anh Bhikkhu Sujato đã ghim cùng commit. Bài `an10.85` (Katthīsutta) là lời Tôn giả Mahācunda nói với các tỳ-kheo: kẻ khoe khoang chứng đắc thiền bị Như Lai hoặc đệ tử tu thiền thạo tâm người khác hỏi dồn rồi lộ ra mười điều suy thoái (khối 6–15, lặp lại ở 21–30), ví dụ người bạn chỉ chỗ đào tiền (khối 16), kết bằng việc không thể tăng trưởng nếu không đoạn bỏ mười pháp ấy (khối 31).
  **Coverage English (đo thật).** Mẫu số = 54 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) trên tổng 90 khoá. Sujato phủ **46/54 = 85,2%**, trên sàn 0,8. Tám khoá Sujato bỏ trống (`22.2`–`29.2`, các câu «… means decline …» lặp) do tầng `english-project` đã `published` lấp, nên cổng tính được 54/54 = 100%, nhưng phần lấp do cùng nhóm tác giả với bản Việt nên **không phải tầng đọc độc lập**; tám khoá đó được kiểm bằng Pāli, bằng chính các khoá song song `8.2`–`15.2` (Pāli y hệt, Sujato đã dịch đủ) và bằng bản lấp. Bản Việt Hòa thượng Thích Minh Châu không nằm trong store cho `an` (tầng `vietnamese-current` chỉ có Pháp Cú); có bản nguyên bài ở mục Tra cứu toàn văn, dùng để so thuật ngữ, không căn theo segment. Vì chỉ đối chiếu độc lập được 46/54 khoá và không có tầng Việt căn theo segment, `triangulation` đặt 8,8 chứ không cao hơn.
  **Số khoá: 90/90, đúng tập khoá Pāli, không khoá ngoài `keys`.** Không có số Pāli cần tính: `dasa dhamme` (`31.1`, `31.2`) = *mười pháp*, khớp chín mục đã nêu cộng một mục đầu `dussīlo` = 10 (`6.2`–`15.1`), đếm được trong chính bài.
  **Pāli trùng nguyên văn trong chính bài: 48 cặp, 12 cặp Việt khác — đều có lý do.** Cả 12 là bảy khoá `So evaṁ vadeyya:` ở khối 16 (`16.4`, `16.6`, `16.8`, `16.11`, `16.13`, `16.16`, `16.18`): Pāli chỉ nói «So» (người ấy) nhưng người nói đổi chỗ theo từng lượt (người đề nghị cho tiền ↔ người đến xin tiền), nên bản Việt phân biệt *người kia nói* (người đã đề nghị: `16.4`, `16.8`, `16.13`, `16.18`) với *người ấy nói* (người đến xin: `16.6`, `16.11`, `16.16`); đây là cách đọc từ logic lời thoại (Sujato cũng giữ «They'd say» và để ngữ cảnh phân xử), không thêm ý. Các cặp trùng còn lại dùng nguyên văn một cách dịch duy nhất: `2.2`=`17.2`, `3.1`=`18.1`, `3.2`=`18.2`, `4.1`=`19.1`, `4.2`=`19.2`, `4.4`=`19.4`, `7.1`/`7.2`=`22.1`/`22.2` … đến `15.2`=`30.2` (`6.3` và `21.3` chỉ khác chữ hoa đầu câu, dùng cùng một bản Việt), `16.9`=`16.14`, `16.12`=`16.17`, `16.5`/`16.10` khác nhau đúng chỗ Pāli khác (`tatra`/`tatrapi`).
  **Pāli trùng nguyên văn với khoá ở bài khác: 14 khoá, 41 cặp (đo trên toàn `an`), 8 cặp dùng đúng văn bản Việt đã có, 33 cặp khác.** 8 cặp dùng lại là `1.3` (Pāli `“āvuso bhikkhave”ti.`, *Này các hiền giả tỳ-kheo!*, dạng này 8 trong 16 khoá có Pāli ấy, trong đó `an10.84:1.2` và `an10.86:1.3`; 8 khoá còn lại dùng *các vị tỳ-kheo*, *chư hiền*, *các bạn*). 33 cặp khác gồm 11 cặp ở lời mở: `1.3` (8 cặp, nói trên), và `1.2`, `1.4`, `1.5` khác `an6.46` (bài duy nhất dịch `āyasmā` thành *Trưởng lão*; tầng dịch *Tôn giả* ở 36 khoá so với 1, nên giữ *Tôn giả*), cùng 22 cặp ở các khoá công thức `3.1`, `3.2`, `4.1`, `5.1`, `18.1`, `18.2`, `19.1`, `31.1`, `31.2` đối với `an10.84` và `an10.86`, mà tôi **cố ý** không chép lại vì ba lý do đã đo: (1) tầng viết *Như Lai* cho `tathāgata` ở **342** khoá so với *Thế Tôn* **53** khoá (trong các khoá `an` có từ `tathāgata`), còn hai bài anh em dùng *Thế Tôn* và dịch `dhammavinaye` là *giới luật* (**4** khoá) trong khi tầng dùng *Pháp và Luật* **38**, *Giáo Pháp và Giới Luật* **26**; (2) hai bài đó dịch `Tamenaṁ` (*vị ấy*, tân ngữ) thành *Bậc ấy* ở vị trí chủ ngữ, tức là gán tôn xưng cho người khoe khoang, mà Pāli không có; (3) cụm `vuddhiṁ virūḷhiṁ vepullaṁ` có ba cách dịch trong tầng: *sự tăng trưởng, hưng thịnh, và thành tựu viên mãn* (**22** khoá, chỉ riêng `an10.82`), *sự tăng trưởng, sự phát triển và sự sung mãn* (**11** khoá) và *sự tăng trưởng, tiến bộ và trưởng thành* (**4** khoá, chính hai bài anh em), tôi lấy dạng 11 khoá vì từng chữ khớp `vuddhi` / `virūḷhi` / `vepulla`. Hai bài anh em còn bỏ nháy đơn `‘ ’` mà Pāli `31.1`/`31.2` có; bản này giữ đúng nháy theo từng khoá.
  **Thuật ngữ, kèm số đếm toàn `an`.** `ayamāyasmā` → *vị tôn giả này* (32 trong 67 khoá có từ này, dạng *tôn giả này* chung 38; cùng công thức với `an4.192`); `Dīgharattaṁ kho` → *Lâu dài nay* (đúng cách dịch hai khoá của `an4.192`, cùng công thức `khaṇḍakārī … sabalakārī kammāsakārī`; tầng có 87 khoá `dīgharattaṁ` nhưng cách *lâu dài* chiếm 62); `jhāyī` → *tu thiền* (14/26, *thiền định* 7); `samāpattikusalo`, `paracittakusalo`, `paracittapariyāyakusalo` theo hai bài anh em (không có tiền lệ nào khác trong tầng). `dussīlo` → *phá giới* (57 khoá: *không có giới* 23, *phạm giới* 14, *phá giới* 12, *ác giới* 5, *mất giới* 4; chọn *phá giới* vì là lựa chọn của bài gần nhất `an10.82`, và `dussilyaṁ` → *sự phá giới* cùng gốc để hai vế khối 6 nhất quán); `assaddho` → *không có niềm tin* (38 khoá: *bất tín* 18, *không có niềm tin* 12, *không có lòng tin* 4; hai dạng thuần Việt cộng 17, sát *bất tín*); `appassuto` → *ít học* (13/15), `kusīto` → *lười biếng* (25/33), `muṭṭhassati` → *thất niệm* (18/31, *mất niệm* 5), `duppañño` → *thiếu trí tuệ* (19/38, *kém trí* 5), `dubbaco` → *khó dạy* (tiền lệ duy nhất `an10.82`), `dubbharo` → *khó nuôi dưỡng* (`an8.53`), `pāpamitto` → *có bạn xấu* (`an3.27`, `an8.55`), `kuhako` → *kẻ lừa gạt* (`an5.83`). `jhāna` → *thiền thứ nhất… thứ tư* (trong `an`: *thiền thứ nhất* 45 so với *sơ thiền* 6; *thiền thứ tư* 31 so với *tứ thiền* 11); bốn vô sắc → *không vô biên xứ*, *thức vô biên xứ*, *vô sở hữu xứ*, *phi tưởng phi phi tưởng xứ* (toàn tầng, «xứ» đứng sau: 128, 41, 63, 61 khoá; «xứ» đứng trước: 13, 17, 45, 33; riêng `an`, «xứ» đứng trước trội ở hai mục cuối, 26 so với 7 và 27 so với 8, nhưng tôi giữ một kiểu cho cả dãy theo đa số toàn tầng); `saññāvedayitanirodhaṁ` → *sự chấm dứt tưởng và thọ* (`an5.166`, 14 khoá). `anaya` / `byasana` → *bất hạnh* / *tai họa*: `byasana` → *tai họa* theo `sn` (14 khoá) và `mn` (10 khoá); `anaya` không có đa số trong tầng (`an3.69` dịch *tai họa*, hai bài anh em *tai nạn*), nên lấy *bất hạnh* theo bản nguyên bài của Hòa thượng Thích Minh Châu, đã tra, và để `anayabyasanaṁ` thành *cả bất hạnh lẫn tai họa*.
  **Bất định, không che.** (1) **`irīṇaṁ`, `vicinaṁ` (`3.2`, `18.2`)**: không có tiền lệ độc lập trong tầng (chỉ hai bài anh em, dịch *tàn phá* / *lạc lối*); Sujato *get stuck / lose their way*; Hòa thượng Thích Minh Châu *trống không* / *rối ren*. Chọn *bế tắc* / *lạc lối* bám nghĩa Sujato; sắc thái `irīṇa` (đất trống, bế tắc) và `vicina` chưa phân xử được bằng Pāli một mình. (2) **`paracittapariyāyakusalo`**: giữ *bao trùm tâm người khác* theo hai bài anh em và Sujato *encompassing*, nhưng `pariyāya` còn có nghĩa *lối, cách thức, hành tướng*; bản Thích Minh Châu đọc *hành tướng tâm người khác*; hai cách đọc đều chấp nhận được, Pāli không buộc một. (3) **`anācāro` (`8.1`, `23.1`)**: *hạnh kiểm xấu* theo nghĩa gốc `anācāra` (hạnh sai trái), được bản nguyên bài xác nhận (*theo tà hạnh*); Sujato *unpracticed* đọc khác; `8.2` chỉ nêu `appasacca` (ít học), không nêu hạnh kiểm. (4) **`20.1`**: Pāli của khoá này **bỏ** `paracittakusalo` và `evaṁ` so với `5.1` (Sujato dùng «…» ở đây); bản Việt theo đúng Pāli: bỏ mệnh «đọc hiểu tâm người khác», không có «như sau». (5) **`19.3`**: Pāli chỉ có `samāpajjāmipi` (không `vuṭṭhahāmipi`) trước `…pe…`, nên bản Việt chỉ «nhập», khác `4.3` có «nhập và xuất»; đây là khác biệt thật của Pāli, không phải lỗi cắt. (6) `samāpajjāmipi vuṭṭhahāmipi` có hạt nhấn `-pi` ở cả hai vế; tiếng Việt «nhập và xuất» không biểu đạt riêng hạt này (Sujato cũng bỏ). (7) `ayamāyasmā` luôn là kính xưng ngay cả khi nói về người phá giới: giữ *vị tôn giả này* theo tiền lệ `an4.192`, không hạ xưng hô để khỏi thêm ý. (8) `katthī` / `vikatthī` → *hay khoe khoang, huênh hoang* (không có tiền lệ nào trong tầng; Sujato *boasts and brags*; bản Thích Minh Châu *khoe khoang, khoa trương*). Tên kinh *Kinh Kẻ Khoe Khoang*.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 90/90, đúng thứ tự Pāli. Nháy đơn `‘ ’` và nháy kép `“ ”` khớp Pāli từng khoá, 0 lệch trên 90 khoá (phép đo có mẫu số, không chạy rỗng). `…pe…` ở `4.3`, `19.3` → đúng một `…`; Pāli không có `…` trần và không có `(…)` ở khoá nào nên Việt cũng không có. Không số Ả Rập, NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang tiếng Việt (ngoài tên riêng *Mahācunda*, *Cetī*, *Sahajāti*). Pāli có `…pe…` ở 2 khoá, mẫu số 2/2 khớp.
  Cổng kỹ thuật `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy, không chạy trong lát agent này; vì vậy `technical_integrity` đặt 9.6 và **không** tuyên bố cổng đã qua. Sau khi bài vào tầng cần chạy `npm run reference:gaps` để cập nhật record gap (coverage Sujato 85,2% trên sàn 0,8 nên không cần entry gap).
