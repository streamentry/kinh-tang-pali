notes:
  - >-
    **Bài ngắn nhất chương (8 segment) nhưng là bài đòi một thuật ngữ phải đọc
    lại.**
  - >-
    **`sarīraṭṭhā` → *tựa vào thân*** (0 segment trước đó, đặt mới): `ṭṭha` =
    **tựa vào, dựa vào**, nên `dhammā sarīraṭṭhā` là *những pháp tựa vào thân*;
    Sujato dịch *existing because of the body*. Bản đầu tôi đặt ***răn rỏi
    thân*** — đọc nhầm thành một phép *răn rỏi thân*, tức là **rằm ràng thân**,
    là nghĩa của một từ khác hẳn. Đã sửa ở cả `1.1`, `1.4` và `an10.50:15.4`;
    ghi lại vì đây là loại lỗi **nghe rất hợp lý nhưng sai nghĩa**, dễ tái phát
    nhất trong chương này.
  - >-
    **Cả danh sách mười pháp này chỉ có 3 segment trong toàn corpus và cả ba đều
    thuộc bài này và `an10.50:15.4`**, nên **không một thuật ngữ nào ở đây có
    tiền lệ**; tất cả đặt mới và ghi lý do tại đây: `uccāro`/`passāvo` → *đi
    tiêu*/*đi tiệu*; `kāyasaṁvaro`/`vacīsaṁvaro`/`ājīvasaṁvaro` → *giữ
    thân*/*giữ khẩu*/*giữ mạng sống* — chỗ này `saṁvaro` là **giữ chế ngự**,
    khác `pātimokkhasaṁvara` (*hộ trì*) của bài trước, nên phải phân biệt;
    `ponobhaviko bhavasaṅkhāro` → *ngăn vòng sanh tái sanh*; còn
    `sītaṁ`/`uṇhaṁ`/`jighacchā`/`pipāsā` → *lạnh*/*nóng*/*đói*/*khát* thì có
    hàng trăm segment tiền lệ, không cần ghi thêm.
  - >-
    **Danh sách kết bằng gạch ngang** `—` vì Pāli cũng kết bằng `—`; không thêm
    dấu chấm.
