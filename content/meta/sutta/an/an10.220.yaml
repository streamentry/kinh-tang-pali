notes:
  - >-
    **Bài cuối phẩm, là bài đối thoại với một vị Bà-la-môn** hỏi thẳng: vì sao
    có người sinh xuống, vì sao có người sinh lên? Đức Phật trả lời bằng
    `adhammacariyā` / `dhammacariyā` chia theo thân–lời–ý.
  - >-
    **`Karajakāyavagga` → *Phẩm Thân Do Nghiệp*** (0 segment tiền lệ, đặt mới):
    Sujato dịch tên phẩm là *The Body Born of Deeds*, và `karajakāya` (thân do
    nghiệp tạo ra) là chủ đề của cả bài — `an10.219` giải thích thẳng rằng mọi
    nghiệp ác từng làm đều được cảm thọ ngay trong thân này. `Saṁsappanīyasutta`
    → *Kinh Tiếp Xúc Nghiệp* (Sujato *Karmic Contact*); `Adhammacariyāsutta` →
    *Kinh Sống Phi Pháp*.
    **`Karajakāyavaggo paṭhamo` ở `an10.220:12.4` dịch là *Phẩm Thân Do Nghiệp,
    thứ nhất*** — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì
    phẩm này rõ ràng thứ hai mốt (đúng như `21.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Nguyên văn dùng lại, đếm được, đều cùng Pāli**: mười hành vi xấu rút gọn ←
    **`an10.199-210:1.3`** (đã `published`: *Sát sinh, Trộm cắp, Tà dâm, Nói
    dối, Nói hai lưỡi, Nói ác khẩu, Nói phù phiếm, Tham lam, Sân hận, và có tà
    kiến*); mười hành vi tốt rút gọn ← **`an10.178:3.2`** (đã `published`:
    *Kiêng tránh sát sinh… không tham lam, không sân hận, và có chánh kiến*);
    `yathābhataṁ nikkhitto evaṁ niraye` ← **`an10.222:1.1`**; `… evaṁ sagge` ←
    **`an3.10:1.1`**; `natthi dinnaṁ … pavedentī’ti` ← **`an3.117:3.3`**;
    `pāṇupetaṁ saraṇaṁ gatan` ← **`an3.53:5.4`**; `apāyaṁ duggatiṁ vinipātaṁ
    nirayaṁ` ← **`an10.229-232:1.1`**; `sugatiṁ saggaṁ lokaṁ upapajjanti` ←
    **`an3.117:7.5`**; `Taṁ suṇātha, sādhukaṁ manasi karotha` ←
    **`an10.107:2.2`**.
  - >-
    **Hai lỗi chấm câu của Pāli trong `an10.218`, ghi lại chứ không sửa Pāli.**
    Pāli mở dấu `“` ở `1.1` và ở `7.1` mà **không đóng ở đâu cả** — đếm được độ
    sâu kép cuối bài là 1. Vì hai vế `1.x` và `7.x` là cùng một công thức mở đầu
    lặp lại, tôi đóng ngoặc ở `1.3` và `7.3` — hai chỗ Pāli kết câu — để người
    đọc không gặp dấu ngoặc treo. Đây là **cố ý lệch ba segment**, không phải
    sót sót: bộ kiểm tra cấu trúc báo đúng ba chỗ ấy.\nTương tự, `an10.220` dùng
    `’` làm **dấu lược** trong `evam’idhekacce`/`m’idhekacce` sáu lần; nếu đếm
    `’` như dấu ngoặc thì Pāli báo lệch âm. Bản dịch không có dấu lược ấy nên
    cân bằng, và tôi ghi ra đây để không ai tưởng là mất dấu.
  - >-
    **Lỗi nghiêm trọng nhất bài, lượt review bắt được ở `7.3` và `11.3`.** Pāli
    là `Evaṁ adhammacariyāvisamacariyāhetu **kho, brāhmaṇa**, evam’idhekacce
    sattā …` — tức Đức Phật **xưng hô các tỳ-kheo**, vì đây là lời dạy trong
    chúng Tăng, không phải lời đáp riêng với vị Bà-la-môn. Bản đầu tôi viết
    *“Nhà la-môn này, do…”, vừa sai người nghe vừa bỏ mất xưng hô; đã sửa thành
    *“Này các tỳ-kheo, do…”*. Lưu ý `1.4` và `2.2` **có** xưng hô *Bạch Bà-la-
    môn* (vì đó mới là lời đáp trực tiếp) — hai loại xưng hô trong cùng một bài.
  - >-
    **Sáu mục `Kathañca … hoti …pe…` đều bị lược**, nên chỉ còn câu hỏi và vế
    kết. `5.2`, `6.2`, `7.2`, `9.2`, `10.2`, `11.2` vì vậy bắt đầu bằng chữ
    thường — tôi giữ nguyên như Pāli.
  - >-
    **`12.1` và `12.2` tách đôi**: `12.1` là lời tán dương bị lược, `12.2` là
    lời xin quy y. Tôi dùng nguyên văn `an3.53:5.4` cho vế quy y.
  - >-
    **Thuật ngữ 0 tiền lệ, đặt mới**: `adhammacariyāvisamacariyā` → *sống phi
    pháp và sống không đúng pháp*; `dhammacariyāsamacariyā` → *sống đúng pháp và
    sống không đúng pháp*; `idhekacce` → *chúng sinh loại này*; `sañkhittena …
    vitthārena` → *viết tắt và trình bày đầy đủ* (bản đầu dịch *tóm tắt và giảng
    đầy đủ* — đã sửa); `saddhiṁ sammodi` → *chào hỏi thân tình* (bản đầu dịch
    *chào hỏi với niềm vui*, thừa — đã sửa); `“Evaṁ, bho”ti` → *“Như vậy đấy,
    bạch ông”* (bản đầu dịch *“Vâng, bạch ông”*, sai vì `evaṁ` là *như vậy*,
    không phải *vâng*); `abhikkanta` → *Tuyệt quá* (0 tiền lệ; `sādhu` đã có
    tiền lệ *Lành thay* ở `an4.48:3.2`); `na kho ahaṁ … ājānāmi` → *tôi không
    hiểu rõ ý nghĩa*.\nCó tiền lệ: `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ` → *cõi
    ác, ác thú, cõi đọa, địa ngục* (`an10.229-232:1.1`); `sugatiṁ saggaṁ lokaṁ`
    → *thiện thú, cõi trời* (`an3.117:7.5`); `bho gotama` → *này ông Gotama*
    (`an3.51:1.3`); `bhāsissāmī` do Đức Phật nói → *Ta sẽ nói* (`an10.107:2.2`);
    `abhiññā` → *thắng trí*.
  - >-
    **`Karajakāyavaggo paṭhamo` ở `12.4` là số thứ tự do Bilara đánh số lại** —
    xem ghi chú `VAGGA`.
