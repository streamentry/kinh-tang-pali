notes:
  - >-
    **Hai mươi bốn lỗi chấm câu của Pāli: mở dấu `“` rồi không đóng.** Đếm được
    14 bài: `an5.242`, `an5.243`, `an5.246`, `an5.247`, `an7.86`, `an9.48`,
    `an9.50`, `an9.53`, `an5.55`… nói rõ là `an9.55`, `an9.56`, `an9.57`,
    `an9.58`, `an9.59`, `an9.60`. Ở mỗi bài, `1.1` mở `“` và không segment nào
    đóng lại (độ sâu kép cuối = 1). Tôi đóng ngay sau mệnh đề cuối của `1.1` để
    người đọc không gặp dấu ngoặc treo, và **đây là cố ý lệch 14 segment** — bộ
    kiểm tra báo đúng mười bốy chỗ ấy, không phải sót sót. Pāli không bị sửa.
  - >-
    **Mười lăm mục đầu lấy nguyên văn từ `an10.267-746`** (đã `published`): *Với
    sân, với si, với sân giận, với oán hận, với khinh miệt, với ngạo mạn, với
    ganh ghét, với keo kiệt, với gian xảo, với quỷ quyệt, với cứng cỏi, với hung
    hăng, với mạn, với mạn quá, với phóng túng*. Tám bước diệt tận phía sau cũng
    lấy từ đó.
  - >-
    **⚠ `1.16` KHÁC Pāli gốc: đây là `abhiññāya`, không phải `pariññāya`.**
    `an10.267-746:1.16` viết `pamādassa pariññāya`; hai bài này viết `pamādassa
    abhiññāya` — *chứng ngộ bằng thắng trí*, không phải *hoàn toàn hiểu rõ*. Tôi
    dịch riêng đúng chỗ khác, vì dùng lại nguyên văn sẽ **bịa thêm một bước
    không có trong nguồn**.
  - >-
    **⚠ Lỗi đếm của Pāli: vế kết ghi **sáu** pháp** trong khi danh sách có mười
    lăm mục cộng tám bước.** `an10.267-746` ghi *mười*. Tôi dịch theo Pāli
    (authority) và ghi lại, không sửa.
  - >-
    **Hai lời bạt cuối nằm ở mục khác nhau, và đây KHÔNG phải lỗi đánh số.**
    `an7.645-1124` đặt bốn vế `Idamavoca bhagavā.`… ở **`2.1`–`2.4`**, còn
    `an6.170-649` đặt ở **`1.27`–`1.30`** — vì Bilara gói hai chùng bài theo hai
    kiểu khác nhau. Tôi dựng theo đúng mục của từng tệp.
  - >-
    `Kinh Chương Sáu Lẻ hoàn tất.` theo khuôn `an10.267-746:1.28` (*Kinh Chương
    Mười Lẻ hoàn tất*). `Idamavoca bhagavā.` → *Như vậy Đức Phật nói.*;
    `Attamanā te bhikkhū bhagavato bhāsitaṁ abhinandunti.` → *Các vị tỳ-kheo ấy
    hoan hỷ với lời Đức Thế Tôn đã nói.*; `Rāgapeyyālaṁ niṭṭhitaṁ.` → *Chuỗi Lặp
    Tham đã hoàn tất.* theo nguyên văn `an10.267-746:1.26`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.    ĐÍNH CHÍNH của người điều phối (cùng PR): chuỗi genitive `1.17`–`1.25` bị **lệch một
    bậc** so với Pāli — `pariññāya` nhận văn bản của `parikkhayāya`, `parikkhayāya` nhận của
    `pahānāya`, … và `cāgāya` nhận của `paṭinissaggāya`; ông cuối bị lặp. Hậu quả: nghĩa
    *hiểu rõ trọn vẹn* biến mất, và hai khoá liên tiếp cùng nghĩa. Đã sửa 8 khoá theo đúng
    nguyên văn đã `published` ở `an10.267-746:1.16`–`1.23` (cùng công thức, cùng nguyên văn
    Pāli). Đo toàn tầng: công thức này có ở **4** bài — `an10.267-746` đúng sẵn,
    `an11.992-1151` dùng bộ riêng, `an6.170-649` và `an7.645-1124` sai và đã sửa.
    `semantic_fidelity` hạ 0,3 và `segment_alignment` hạ 0,4 — đây là lỗi lệch khoá, không
    chỉ sai từ.
