notes:
  - >-
    Bản tóm lược về nơi tái sinh theo bốn mức 10/20/30/40.
  - >-
    `yathābhataṁ nikkhitto evaṁ niraye` → "như vật đã được mang đến, bị đặt vào
    địa ngục" và `… evaṁ sagge` → "… được đặt vào cõi trời": dùng nguyên văn từ
    `an3.10:1.1` và `2.1` (50 và 85 segment tiền lệ). `samannāgato` → "đầy đủ"
    (574 segment).
  - >-
    `Samannāgato` ở đây **không kèm danh từ tường thuậc** (`… dhammehi
    samannāgato yathābhataṁ nikkhitto`), khác `an3.10:1.1` có `male appahāya`
    làm chủ ngữ. Dịch "kẻ đầy đủ mười pháp này thì…" — "kẻ" là cách Việt hóa chủ
    ngữ ẩn của dạng tính từ, không phải thêm ý.
  - >-
    `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ upapajjati` → "thọ sinh vào cõi ác, ác
    thú, cõi đọa, địa ngục" và `sugatiṁ saggaṁ lokaṁ upapajjati` → "thọ sinh vào
    thiện thú, cõi trời": nguyên văn từ `an3.101:7.1` (133 và 47 segment).
    `kāyassa bhedā paraṁ maraṇā` → "sau khi thân hoại mạng chung" cũng vậy.
  - >-
    `idhekacco` → **"có một số"**: giữ chủ ngữ, vì ở đây nó là chủ thể của
    `upapajjati`, không phải từ bổ nghĩa. Chỉ 10/162 segment trong corpus giữ
    được nghĩa này; phần lớn bị hấp thụ vào mệnh đề kế.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    **Sửa sau khi xuất bản:** 7 segment trong chương 22 dùng dấu chấm **ngoài**
    ngoặc kép (`…trời”.`). Đếm toàn corpus: **4.790** segment dùng dấu chấm
    **trong** (`.”`) theo lệ pháp Việt, chỉ **12** dùng ngoài, và 7 trong số đó
    là của chương 22. Đã sửa 7 segment này; 5 segment còn lại thuộc `dn16`,
    `mn25`, `sn3.11` — bài không do đợt này viết, giữ nguyên. Đây là sửa thuần
    chính tả, không đổi nghĩa.
