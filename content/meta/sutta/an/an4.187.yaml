notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.3 — «Này Bà-la-môn, điều này không thể có, không có khả năng xảy ra» → «Điều này không thể có, này Bà-la-môn, không có khả năng xảy ra» (chỉ đưa hô ngữ `brāhmaṇa` về đúng vị trí của Pāli `aṭṭhānaṁ kho etaṁ, brāhmaṇa, anavakāso`, để đồng nhất với 3.3, 8.3, là cùng câu do Bà-la-môn thuật lại); giữ nguyên khoá 2.7, 2.11 — bản hiện tại đủ cả `anavakāso` («không có khả năng xảy ra») lẫn `brāhmaṇa`, còn dạng đa số (các khoá thuật lại 3.5, 3.7, 8.5, 8.7) bỏ `anavakāso` hoặc thêm từ nối «Nhưng» không có trong Pāli. Vì vậy sửa các khoá thuật lại cho khớp lời gốc: 3.3, 8.3 — thêm «Điều này» (`etaṁ`) và «này Bà-la-môn»; 3.5, 8.5 — thêm «không có khả năng xảy ra»; 3.7, 8.7 — bỏ «Nhưng» và đặt «này Bà-la-môn» đúng vị trí của Pāli.
