notes: |-
  **Phạm vi: đủ 5 khoá, không thêm khoá nào.** Bài này không có khối `:0` trong Bilara
  (những bài có `0.1`+`0.2` trong nhóm này chỉ là `an2.163`), nên `1.0` là con số thứ tự bài và
  đó là mọi khoá Pāli có. Tôi không tự thêm `0.1`/`0.2` — sẽ tạo segment ma.

  **Ba khoá `1.1`, `1.2`, `1.4` dùng lại nguyên văn đã có, không dịch lại.** Pāli của chúng
  giống hệt nhau ở cả mười bài của lát, và năm bài anh em cùng Phẩm Hộ Trì đã `published`
  (`an2.163`, `an2.168`, `an2.169`, `an2.176`, `an2.177`) dùng cùng một nguyên văn cho đúng ba
  khoá đó. Số đếm trong tầng: `1.1` — 9/10 đoạn có Pāli giống hệt dùng *Có hai loại pháp, này
  các tỳ-kheo*; `1.4` — 6/6 dùng *Này các tỳ-kheo, đây là hai loại pháp”*; `1.2` — 5/5 bài anh
  em dùng *Thế nào là hai?* (toàn tầng còn tranh cãi: 35 *Thế nào là hai?* so với 24 *Là hai
  nào?*, nhưng trong phẩm này không có tiếng nào khác). Chỉ `1.3` là khác nhau giữa mười bài, và
  tôi dựng riêng từng cặp — dùng một bảng dịch chung cho cả mười bài sẽ là điền bằng khuôn.

  **Tầng Anh đủ 100%, đã đối chiếu từng khoá.** Cả 5/5 khoá đều có tiếng Anh Sujato tại commit
  đã ghim, không khoá nào bị bỏ trống, nên không có chỗ nào phải dựa vào Pāli một mình.

  **Không đối chiếu được tầng Việt hiện hành.** Tại commit đã ghim, `translation/vi/` của bilara
  chỉ chứa Pháp Cú, nên Tăng Chi Bộ không có bản Hòa thượng Thích Minh Châu cho bài này. Đây là
  giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế chỉ ở
  mức Pāli + English Sujato.

  **Kiểm kỹ thuật.** Chạy lại `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tự kiểm
  những cờ mà `rven88.py` không áp cho tầng Việt: đủ khoá và đúng segment ID; ngoặc kép `“` mở
  ở `1.1` và `”` đóng ở `1.4`, cân trên cả bài; mọi chuỗi đã NFC; không Pāli lọt; số dấu lược
  bằng Pāli (bài này không có dấu lược nào); `1.3` nối tiếp `1.2` bằng *là*. Khoá `:1.0` bằng
  đúng số của Pāli vì đó là **số thứ tự bài** chứ không phải nội dung cần dịch — `_hvi.py` cố
  ý loại khoá dạng `N.0` khỏi kiểm trùng nguyên văn, và năm bài anh em cũng ghi y hệt. Tôi
  **không** chạy `npm run validate|test|check|build` (đợt này cấm; người điều phối chạy tập
  trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Thuật ngữ `1.3`, đếm được.** `vipatti` → *thất nghiệp*: 45 chỗ trong tầng, và
  đúng hai từ ghép của bài này đã có tiền lệ ở `an3.117`, `an3.118`, `an3.119` (cả ba
  `published`): *Thất nghiệp về giới, thất nghiệp về tâm, thất nghiệp về kiến*, kèm câu định
  nghĩa *được gọi là ‘thất nghiệp về giới’*. So với *hỏng* (~14 chỗ, chủ yếu `dn16:1.23`,
  `dn33:2.1`, `ud8.6` — đều là *sự hỏng giới* trong câu kể nguy hiểm). `sīla` → *giới* và
  `diṭṭhi` → *kiến* là quy ước cố định.

  **XUNG ĐỘT ĐÃ GHI.** `dn33:1.9.29` có Pāli **y hệt** câu này và dịch *Sự hỏng giới và sự
  hỏng kiến*. Tôi theo `an3.117–119` vì 45:14, và vì *thất nghiệp* giữ được nghĩa *thất bại*
  như một mục riêng đúng như cách kinh liệt kê, còn *hỏng* làm nghẹt bớt.

  ⚠ **Rủi ro độ rõ của *thất nghiệp* — đây là lý do hạ `vietnamese_clarity` xuống 9.0.** Người
  Việt hiện đại đọc *thất nghiệp* là *mất việc*. Tôi vẫn giữ vì đây là thuật ngữ Hán–Việt quen
  thuộc trong Phật học Việt, đã thành chuẩn ở ba bài `an3.117–119` đã publish, và đổi sang
  *hỏng* sẽ để tầng này có hai cách dịch cho cùng một cụm Pāli.

  ⚠ **Tôi KHÔNG thêm chữ *tà* vào *kiến*.** Pāli chỉ viết `diṭṭhi` trần, không phải
  `sammādiṭṭhi` cũng không phải `micchādiṭṭhi`; mặc định phổ biến của kho cho `diṭṭhi` là *tà
  kiến* (374 đoạn), thêm vào đây là **thêm ý không có trong câu**. Cùng lý do đó, `an2.172`
  tôi cũng giữ *quán* chứ không thêm chữ nào, dù Sujato dịch là *discerning*.
