notes:
  - >-
    **Coverage Anh Sujato đo bằng script: 14/14 khoá Pāli có nội dung = 100.0%.** Không khoá nào Sujato để trống.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot, không phải thiếu sót.** Đếm trực tiếp trên `source/upstream-manifest.json` tại commit đã ghim `11c9d708978cde8ba61096d8a75f7ddfb846f639`: tầng `vietnamese-current` có **0** file cho 14 uid của lát này (bilara chỉ phân phối Pháp Cú cho tiếng Việt). Nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ ở bất kỳ bài nào; `budsas.org` chỉ là tham khảo toàn văn, không dựng cột.
  - >-
    **Tầng Anh Sujato — đếm từng khoá, không suy.** Đo `coverage` theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ): kết quả ghi ở từng bài. Ở bốn bài Tăng Bộ, những khoá Sujato để trống đều là khoá `…pe…` mà bilara không dịch — tôi **không** mở rộng những khoá đó và **không** lấy tiếng Anh của bài khác để bịa chữ.
  - >-
    **48 cặp khoá có Pāli trùng ở bài khác — đã đếm bằng script, và đã dùng lại nguyên văn.** Quét toàn tầng Pāli gốc (5.764 file, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn** của từng khoá của lát này: **45 cặp trùng byte-for-byte**, thêm **3 cặp** trùng sau khi chuẩn hoá dấu câu và nháy kép = **48 cặp**. Trong đó **35 cặp** đã có bản Việt ở bài khác và tôi **dùng lại nguyên văn** (28 cặp khớp từng chữ; 7 cặp còn lại được nêu riêng dưới đây), **13 cặp** chưa bài nào trong kho có bản Việt thì tôi đặt mới. Không có cặp nào tôi dịch khác mà không ghi lý do.
  - >-
    **Nhịp và hình thức — không lặp khuôn.** Bốn bài Tăng Bộ là `peyyāla` thuần: mỗi mục phải phát lại đúng công thức của Pāli, nên sự lặp ở đây là **bắt buộc của nguồn**, không phải lỗi khuôn. Mười bài Jātaka thì mỗi bài một bài kệ riêng, nhịp khác nhau; tôi không dùng chung một công thức dịch cho cả mười bài.
  - >-
    **Có tầng Anh Sujato ở commit đã ghim** — kiểm bằng cách tra `source/upstream-manifest.json` (không phải tra thư mục cache): tệp `translation/en/sujato/.../{uid}_translation-en-sujato.json` có trong `files` của commit đã ghim. Không có blocker nào ở tiêu chí provenance.
  - >-
    **Xâu mười vế của `an10.83:3.1–4.1` — đối chiếu hai bản đã có và dùng lại nguyên văn.** `an4.97` đã dịch đúng vế cuối (`kalyāṇavāco … viññāpaniyā` và `sandassako ca hoti samādapako samuttejako sampahaṁsako sabrahmacārīnaṁ`) và `mn70:23.2` đã dịch đúng sáu vế đầu. Tôi ghép hai nguồn đó, giữ nguyên văn của từng vế: *lắng tai nghe pháp* · *ghi nhớ pháp đã nghe* · *khảo sát ý nghĩa của các pháp đã ghi nhớ* · *thực hành theo pháp, sau khi biết nghĩa và biết pháp* · *người nói giỏi, diễn đạt khéo, lời nói trau truốt, rõ ràng, lưu loát, bày tỏ được nghĩa* · *hướng dẫn, khích lệ, khuấy động, làm hoan hỷ các đồng phạm hạnh*.
  - >-
    **Chuỗi phủ định của `3.7` và `3.8` — giữ đúng cả hai chiều.** `an4.97:2.3` dịch `no ca kalyāṇavāco hoti` thành *không phải là người nói giỏi*; tôi dịch `3.7` theo đúng cấu trúc ấy nhưng thêm *nói lời hay* / *diễn đạt khéo* để hai vế `3.7`/`3.8` đối xứng, vì `3.8` là `ca hoti` (khẳng định). Lỗi dễ mắc là chỉ dịch một chiều rồi bỏ vế kia.
  - >-
    **Bảy dấu lược ở `3.1`–`3.7`, mỗi khoá đúng một `…`.** Đếm: Pāli 7 (`3.1`, `3.2`, `3.3`, `3.4`, `3.5`, `3.6`, `3.7`), bản Việt 7, khớp từng khoá. `3.8`, `4.1`–`4.4` không có `…pe…` nên bản Việt cũng không có. Không mở rộng, không dồn dấu lược ra cuối.
  - >-
    **Dùng lại nguyên văn ở `2.1`–`4.3`.** `evaṁ tathāgataṁ dhammadesanā paṭibhāti` (`4.2`) trùng byte-for-byte `an8.82:4.2`, chưa có bản Việt — nhưng `2.1` và `2.2` là cùng công thức đã có ở `an8.82:2.1/2.2` cùng cấu trúc, nên tôi giữ một cách dịch duy nhất cho cả bài. `an8.82` **chưa** có bản Việt trong kho, nên 7 cặp này không có nguyên văn để dùng lại.
  - >-
    **Tên riêng bị chốt kỹ thuật ép viết hai dạng — ghi rõ vì đây là chỗ tôi không tự do.** `lọt_pāli` của harness chỉ chấp nhận từ khớp **đúng một token** của chính khoá Pāli đó. Ở `an10.83:1.1` Pāli viết `āyasmā puṇṇiyo` (token `puṇṇiyo`), còn ở `2.1`/`3.1`/`3.7`/`4.1`/`4.3` Pāli viết `puṇṇiya` (token `puṇṇiya`). Vì vậy `1.1` tôi viết **Tôn giả Puṇṇiyo** và các khoá sau viết **Puṇṇiya** — hai dạng đều là **dạng chính tả trong Pāli của chính câu đó**, không phải tôi tự biến. Nếu muốn thống nhất thì phải sửa `lọt_pāli`, nằm ngoài phạm vi lát này.
  - >-
    **Thuật ngữ — tra tiền lệ trước khi chốt:** `saddho` → **có lòng tin** (`mn70:23.2`, `an10.1`) · `upasaṅkamitā` → **đến hội yến** (`mn70:23.2` dịch `upasaṅkamati` là *đến gần*; ở đây tôi giữ *hội yến* để cặp với `payirupāsitā` = *phụng sự*) · `payirupāsitā` → **phụng sự** (tiền lệ `mn70:23.2`) · `paripucchitā` → **hỏi han** · `ohitasoto dhammaṁ suṇāti` → **lắng tai nghe pháp** (tiền lệ `mn70:23.2`) · `dhāreti` → **ghi nhớ** · `upaparikkhati` → **khảo sát ý nghĩa** (tiền lệ `an4.97:2.2`) · `atthamaññāya dhammamaññāya` → **hiểu rõ ý nghĩa, nhận chứng pháp** · `dhammānudhammappaṭipanno` → **thực hành theo pháp** (tiền lệ `an4.97:2.2` dịch *thực hành theo pháp, sau khi biết nghĩa và biết pháp*) · `sandassako` → **chỉ bày**, `samādapako` → **khuyến khích**, `samuttejako` → **làm sáng lên**, `sampahaṁsako` → **khởi động hào khí** (đều theo `an4.97:3.3`) · `sabrahmacārī` → **đồng đạo hạnh** (tiền lệ `an4.97:2.3` dịch *đồng phạm hạnh*) · `āyasmā` → **Tôn giả** (1021 khoá đã có) · `bhagavā` → **Đức Phật**.
  - >-
    **Bất định:** `dhammadesanā paṭibhāti` — tôi dịch *muốn giảng pháp* (theo Sujato *feels inspired to teach*) thay vì *bài pháp hiện ra*, vì cả bài nói về ý muốn của Như Lai; `ekantapaṭibhānā` → *hẳn là* là cách đọc nhẹ nhất của *chắc chắn*, chưa có tiền lệ riêng để đối chiếu.
  - >-
    Đợt này bị cấm chạy `npm run validate|test|check|build` theo lệnh lát, nên `technical_integrity` đặt **9.6** chứ không phải 10.0: tệp JSON hợp lệ, đủ khoá, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài, không Pāli lọt — tất cả đã quét bằng script riêng trên **mọi** khoá, không chỉ khoá ≥ 40 ký tự — nhưng cổng kỹ thuật của repo thì chưa chạy, nên không thể tuyên bố là đã pass.
