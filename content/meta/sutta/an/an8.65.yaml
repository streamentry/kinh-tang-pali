notes: |-
  TẦNG THAM KHẢO: có Sujato cho cả 31 khoá; đo coverage cho 18/18 khoá có nội dung =
  100%, trên sàn 0.8 ⇒ đủ điều kiện `published`.
  Lát c14. 19/31 khoá của bài này trùng nguyên văn với bài đã merge — cao nhất
  trong ba bài AN của lát — và tôi dùng lại đúng nguyên văn đã có.

  Tiền lệ có đếm và dùng lại:
  · `abhibhāyatana` → “thắng xứ”; `Idaṁ …ṁ abhibhāyatanaṁ.` → “Đây là thắng xứ thứ nhất.”
    (4 bản đồng nhất, dn34:2.1.163/166/169/172…). Toàn bộ tám vế lấy từ dn34:2.1.160-183
    và dn16:3.24-32, gồm “Ở nội có tưởng sắc, độc cư thấy các sắc ở ngoại hữu hạn, đẹp và
    xấu” và “‘Vượt qua các sắc ấy, ta biết rõ, ta thấy rõ’ — có tưởng như vậy” (2 bản cho
    vế đầu; 3 bản cho vế màu xanh/vàng/đỏ/trắng).
  · `Katamāni aṭṭha?` → “Là tám nào?” (3 bản cùng Pāli; “Thế nào là tám?” 3). Hoà giữa,
    chọn theo an8.66:1.2 ngay cùng phẩm Bhūmicālavagga.
  · `Pañcamaṁ.` → “Thứ năm.” (233 bản).

  KHÁC BIỆT CẦN GHI: an8.119 (Kaḷāyatana Sutta, cùng AN8, cùng tám vế này) đã dịch
  `abhibhuyya` là “chúng thoáng qua” — sai nghĩa (`abhi + √bhū` = vượt qua / làm chủ, không
  phải bay qua). Tôi theo dn34 (“Vượt qua các sắc ấy”) và ghi mâu thuẫn này ở đây để người
  điều phối biết; không sửa tệp ngoài lát.

  0 tiền lệ: `Abhibhāyatanasutta` → “Kinh Tám Thắng Xứ” (đặt theo thân bài đã dịch).

