notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 5.2 và 6.2 (kèm 5.3, 6.1, 6.3 cùng cụm) — «tri kỷ
  tưởng và tư duy, suy lường và quán sát pháp một cách rộng rãi với tâm» → «dùng tâm suy tầm, suy
  xét và dùng ý quán sát pháp», bỏ «rộng rãi» vì cụm cetasā anuvitakketi anuvicāreti
  manasānupekkhati không có vitthārena; «một niệm đề mục định nhất nào đó được vị ấy thiện khéo
  nắm giữ, thiện khéo chú tâm, thiện khéo thọ trì, và thiện khéo thấu đáo bằng tuệ» → «một định
  tướng nào đó được khéo nắm giữ, khéo tác ý, khéo ghi nhớ, khéo thâm nhập bằng tuệ» (khớp dn33,
  dn34, nơi cùng công thức samādhinimittaṁ suggahitaṁ … suppaṭividdhaṁ paññāya); điệp khúc «chưa
  được giải thoát được giải thoát … đoạn tận trừ khơi» ở các khoá 1.1, 2.9, 3.8, 5.9, 6.9,
  7.1 chưa xét trong lượt này; khoá 4.8 (Pāli có …pe…) trước đó viết đủ, nay rút về đúng một «…» như Pāli.
