notes: |-
  Giải quyết draft 2026-10-12: kiểm toán độc lập toàn bài 79 khoá đối chiếu Pāli đã ghim, Sujato và tiền lệ trong tầng.
  Blocker cũ ("cắt ngắm" ở an3.69:15.2 và 15.4) thuộc loại D và đã lỗi thời: hai khoá này không còn dấu lược `…`, Pāli tại chỗ chỉ là `parinibbāyati.` nên bản Việt `nhập Niết-bàn.` đủ nghĩa; dấu lược `…` ở 7.1, 8.1, 15.1, 15.3, 16.1 khớp Pāli `…pe…`. Đã gỡ blocker.
  Lỗi nghĩa thật đã sửa (khoảng 45 khoá trên 79): (1) 7.4 và 15.5 có chữ hỏng "cây s ta" nay là cây sāla; (2) `parassa asatā dukkhaṁ uppādayati` (2.3, 3.3, 4.3, 5.2, 10.3, 11.3, 12.3, 13.2) từng là "lấy cớ sai khiến người khác chịu khổ", sai vì `uppādayati` là gây ra, không phải sai khiến; nay là "vin cớ không thật mà gây khổ cho người khác"; (3) `puggalo` đã dịch "chúng sinh", nay là "hạng người" (tiền lệ trong tầng: người/hạng người áp đảo); (4) 6.1, 7.5, 15.10 thêm "tham, sân và si" trong khi Pāli tại khoá chỉ có `lobhajehi`/`lobhajā`, phần sân và si nằm ở khoá sau của dạng lược; (5) 7.2, 8.2 và 16.2 thiếu "các pháp ác bất thiện" của `mohajehi pāpakehi akusalehi dhammehi`; (6) `abhūtavādī` "kẻ nói điều sai" nay là "kẻ nói điều không thật" để khỏi lẫn với `atacchaṁ` ("sai"); `anatthavādī` "vô nghĩa" nay là "vô ích" (tiền lệ mn114, an10.176); (7) `anayaṁ/byasanaṁ/anayabyasanaṁ āpajjati` từng là "tai họa, khốn khổ, tai họa và khốn khổ", nay "bất hạnh, tai họa, cả bất hạnh lẫn tai họa" theo tiền lệ; (8) `apariḷāhaṁ` "bồn chồn" nay "nóng rực", `upāyāsa` "đau thương" nay "ưu não" (tiền lệ an6.75, an5.3); (9) `tālāvatthukatā` "gốc chà là" nay "gốc cây thốt nốt bị chặt" (tāla là cây thốt nốt, tiền lệ cùng cụm trong dn33/dn34 và nhiều nơi); (10) `parinibbāyati` từng là "diệt tận", nay "nhập Niết-bàn" (tiền lệ dn27:30); (11) `kudālapiṭakaṁ` "xẻng và giỏ" nay "cuốc và giỏ" (4/4 tiền lệ), và các động từ khả năng ở 15.6 đến 15.9 được trả lại thể "giả sử/sẽ"; (12) `pāṭikaṅkhā` "ác thú chờ đón" nay "ác thú là điều có thể chờ đợi"; (13) `pavāheyya` "rải xuống" nay "thả trôi" (tiền lệ an4.195, sn12.55); (14) `itissame ... nidānā ... samudayā ... paccayā` bỏ "duyên nguồn" khó hiểu, nay "có tham làm nguồn, khởi lên từ tham, lấy tham làm duyên"; (15) `avajānāti`/`paṭijānāti` giữ "khinh miệt" cho avajānāti và thêm "thừa nhận" cho paṭijānāti; (16) bỏ dấu nháy đơn ở các khoá mà Pāli không có nháy (2.3, 3.3, 4.3, 5.2, 5.4, 10.3 đến 13.2), giữ ở 13.5 nơi Pāli có.
  Giữ nguyên có chủ ý (đã đo): "chế phục … tâm bị thâu nhiếp" cho `abhibhūto pariyādinnacitto` là quy ước của an3.53, an3.54, an3.55, an3.65, an3.71, an7.47; "ta mạnh, ta muốn quyền lực" cho `balavamhi balattho` khớp cách đọc của Sujato; "kẻ nói phi pháp, phi giới luật" giữ vì tương đương `adhammavādī`, `avinayavādī`.
  Độ phủ tiếng Anh: Sujato để trống 7.1 đến 7.3, 8.1 đến 8.3, 15.1 đến 15.4, 16.1 đến 16.4 (đoạn lược `…pe…` và khoá lặp công thức); đã đọc kỹ từ Pāli, các khoá này lặp nguyên công thức của 6.1, 6.2, 14.2, 14.3 nên tự đứng vững. Tầng `vietnamese-current` không có cho bài này (giới hạn của bản chụp). Vì vậy `triangulation` chỉ 8,0.
  Bất định còn lại: `balattho` ("muốn quyền lực" hay "cần sức mạnh") giữ theo Sujato; `nibbeṭhanāya` dịch "giải trình"; `usīra` giữ nguyên tên cỏ.
  Technical gate: phép kiểm tập khoá, dấu lược và điểm số đã đạt; các lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong phiên này nên `technical_integrity` đặt 9,6.
