notes: |-
  Sửa lan 2026-10-13: khoá `an3.133:1.1` và `an3.133:1.4` — *xứng đáng với vua, là báu vật của vua* → *xứng đáng với vua, xứng đáng được vua sử dụng, và được tính là…* (accuracy fix; thêm *và* như `an5.140`). Pāli `rājāraho hoti rājabhoggo`: `bhogga` là *đáng được dùng/thụ dụng* (từ `bhuñjati`), không phải *báu vật*. Căn cứ: cùng công thức `rājāraho … rājabhoggo, rañño aṅganteva saṅkhyaṁ gacchati` ở `an5.139`, `an5.140`, `an5.203` đều dịch *xứng đáng được vua sử dụng* (đo tiền lệ toàn tầng: dạng *xứng đáng được vua sử dụng* ở 9 bài `an4.112`, `an4.114`, `an4.181`, `an4.196`, `an4.259`, `an4.260`, `an5.139`, `an5.140`, `an5.203`; dạng cũ *dùng cho vua* ở `an3.96`–`an3.98`, `an6.5`–`an6.7`, `an8.13` cùng nghĩa, chưa thống nhất; không bài nào khác dịch *báu vật của vua*). Hai khoá Pāli trùng nguyên văn trong bài và hai bản Việt giống nhau. Điểm số giữ nguyên.
