notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim (`11c9d708978cde8ba61096d8a75f7ddfb846f639`), bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  - |-
    **Đây là tệp gộp 48 bài (an11.454–501) trong một tệp bilara, và tôi chỉ dịch phần đứng vững về nghĩa.** Bốn khoá `:0` đã dùng lại nguyên văn từ `an/an11.22-29` và `an/an11.502-981` (*Aṅguttara Nikāya 11* / *Nhóm Năm Mươi Đầu* / *Phẩm Sa-môn* / *~*). 13 khoá nội dung là **công thức lặp**, mọi vế có tiền lệ.
  - |-
    **Tám thuật ngữ quán sát lấy nguyên văn từ bài liền kề `an/an11.22-29`** (cùng phẩm, cùng bộ tám pháp trợ giác ngộ): `aniccānupassī` → *vô thường* · `dukkhānupassī` → *khổ* · `anattānupassī` → *vô ngã* · `khayānupassī` → *tiêu diệt* · `vayānupassī` → *tan rã* · `virāgānupassī` → *vô tham* · `nirodhānupassī` → *diệt tật* · `paṭinissaggānupassī` → *buông xả*. Dùng lại y hệt để lát này không sinh ra cách thứ N+1.
  - |-
    **Một quyết định tôi phải tự phán và ghi rõ: `vicāra` ≠ `vitakka`.** Bài liền trước `an/an11.406-453` là `Rūpavitakke… / saddavitakke…` và đã dịch *Tầm về sắc… / tầm về tiếng…*; bài này là `Rūpavicāre… / saddavicāre…` — khác mắt xích, nên tôi dùng *suy xét về sắc…* cho nhóm `vicāra`. Nếu người biên tập muốn thống nhất hai bài thành một cách thì phải sửa cả hai, không sửa một. `…pe…` ở `1.14` rơi đúng vào `paṭinissaggānupassī viharituṁ` nên tôi giữ một `…` duy nhất theo luật 10.1.
  - |-
    **Tầng Anh yếu ở bài này, nên `triangulation` chỉ 8.8.** Sujato có prose ở 18/18 khoá nhưng văn bản Anh chỉ là danh sách vỡ vụn (*considerations regarding sights …*) dựng lại từ công thức, và ở `1.7` Nó **thêm** mệnh đề *meditate* vào trước cả khi Pāli chỉ có `dhammavicāre`. Tôi dịch `viharituṁ` thành *sống quán …* theo `an11.502-981:2.3`, không mở rộng. Ngoài ra `substantivePaliMinChars: 40` không thấy segment nào ở bài này nên phép đo coverage của `englishCoverageFor` cho `ratio = 1` — tức ngưỡng 80% là **rỗng**, không phải tầng Anh đã mạnh.
  - |-
    **Về tiêu đề.** `:0.4` là `~` và Pāli không đặt tên cho tệp gộp này, nên tôi đặt `translationTitle` là *Các Pháp Trợ Giác Ngộ Của Đệ Tử* để tên hiển thị có nghĩa; đây là **nhãn biên tập**, không phải dịch của một segment Pāli.
