  TẦNG THAM KHẢO. Tầng english-sujato tồn tại tại commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639 và bản Sujato phủ 15/15 khoá Pāli có nội dung (100%), nên không cần mục trong content/meta/reference-gaps.yaml. Tầng Việt hiện hành vắng với AN.

  BÀI SONG SONG, DÙNG LẠI NGUYÊN VĂN. Đoạn này trùng toàn bộ với dn16:3.21–3.23 và mn12:29–30. Mười hai khoá có Pāli trùng byte-for-byte với dn16, tôi dùng lại nguyên văn đã có: 1.6, 1.7, 1.8, 1.9, 1.10, 1.11, 1.12 và 2.9, 2.10, 2.11, 2.12, 2.13, 2.14, 2.15. 1.3 trùng Pāli với dn16:3.21.3 nên tôi dùng lại đúng tám thuật ngữ hội chúng đã có: hội chúng Sát-đế-lợi, hội chúng Bà-la-môn, hội chúng gia chủ, hội chúng Sa-môn, hội chúng Tứ Đại Thiên Vương, hội chúng Tam Thập Tam Thiên, hội chúng Māra, hội chúng Phạm thiên.

  DẤU LƯỢC — CHỖ TÔI CỐ Ý LỆCH VỚI BÀN ĐÃ CÓ. 2.1 có …pe… và 2.2 đến 2.6 có …, bản Việt tôi để đúng một dấu lược ở mỗi khoá. dn16:3.23.1 và mn12:30.1 đã merge lại viết thêm chữ pe trong bản Việt và thêm cả động từ upasaṅkamit (đã từng đến gần) vào chỗ Pāli lược — việc thêm chữ ở chỗ Pāli lược là thêm chữ không nguồn nào chứng thực, nên tôi không làm. Hệ quả phải nói rõ: 2.1 của tôi đọc là câu bị cắt (Ta nhớ rằng, này các tỳ-kheo, hội chúng Bà-la-môn gồm nhiều trăm vị …) và 2.2 đến 2.6 không có chữ nhiều trăm vì Pāli không viết ở các khoá ấy. Nếu người biên tập muốn thống nhất theo dn16 thì phải sửa cả ba bài.

  TÊN PHẨM. Bhūmicālavagga → 7. Phẩm Đất Nền theo đa số trong chính phẩm (an8.67 và an8.68; an8.66 dùng Phẩm Động Đất gần nghĩa động đất hơn). Tên chưa có trong bảng chốt của BRIEF_VI3 mục 11 nên tôi theo đa số; người biên tập muốn chốt khác thì phải sửa cả ba bài.

  DÙNG LẠI NGUYÊN VĂN CHO CÁC CÂU NGẮN. 1.2 Thế nào là tám (đúng an8.75:1.2), 2.16 và 2.17 theo dn16. Tôi viết Ta thay vì Ngài ở 1.4, 1.10, 2.1, 2.13 vì ở AN người nói là Thế Tôn nhưng văn mạch dùng Ta như dn16 và mn12.

