notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 21/22 = 95,5%.** Sujato bỏ trống đúng một khoá `an10.26:7.1`; khoá đó đã có bản lấp của lớp `english-project` (`content/meta/en/an/an10.26.yaml`, status published) nên coverage tính theo `creditLayers` của `source/layers.yaml` là 22/22 = 100%, không cần ghi nhận gap. Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708: bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **8 khoá của bài này có Pāli trùng nguyên văn ở bài khác (254 cặp); cả 8 đã dùng lại NGUYÊN VĂN.** `2.2`, `2.3`, `2.4` và `6.2`, `6.3`, `6.4` trùng byte-for-byte `sn4.25:14.2-14.4`: *chiến thắng đạo quân những gì đáng yêu khả ái;* · *một mình ngồi thiền, ta chứng ngộ hạnh phúc;* · *vì thế ta không kết giao với người đời,*. Tôi lấy thêm `2.1`, `2.5`, `6.1`, `6.5` theo đúng số câu kệ của `sn4.25:14.1` và `:14.5` (*Đã đạt mục đích, an tịnh nơi tâm,* … *và chẳng có ai kết giao được với ta*) vì Pāli hai bên chỉ khác dấu phẩy và dấu nháy. `0.2` theo `an10.25`, `7.2` theo 241/246 bản cho `Chaṭṭhaṁ.`
  **Dấu lược — đếm từng khoá.** `5.1` có `…pe…` nên bản Việt giữ một `…`; `5.2` đến `5.8` mỗi khoá một `…` trần; `5.9` **không** có dấu lược nào nên tôi viết đủ câu, không mở đầu bằng `…`; `5.11` có bốn `…` trần nên bản Việt giữ bốn. Đã đối chiếu bằng `lược()` của harness.
  **Thuật ngữ mới, 0 tiền lệ trong tầng, đặt kèm lý do.** Cả nhóm `kasinī` (0 tiền lệ cho `pathavīkasinī`…) dịch là *quán <yếu tố> vô biên*, theo đúng nghĩa mà Sujato nêu ở đây là meditation on universal <element>: Đất, Nước, Lửa, Gió, Xanh, Vàng, Đỏ, Trắng, Hư không, Thức. `assāda` → sự đáng ưa, `ādīnava` → tai họa, `nissaraṇa` → lối thoát, cả ba theo `an3.105:1.7` và `an5.221:1.1`. `bhagini` → người em gái, theo `an4.159:4.1` (4 tiền lệ); tôi không tự đặt *bạ chị* để tránh sinh thêm một cách thứ N+1.
  **Bất định đã ghi.** `abhinibbattesuṁ` ở `4.1`, `5.1`, `5.9` — Sujato đọc là *are reborn*, còn `an10.65:2.2` dịch `abhinibbatti` thành *tái sanh*; tôi theo Sujato và tiền lệ đó, dịch là *tái sanh*, không dịch là chứng đạt Niết-bàn vì ngữ cảnh ở đây là các vị sa-môn tin vào sự chứng đắc ấy rồi tái sanh. `pavatte pabbate` (`1.1`) tôi dịch *trên núi dốc cao*; `pavatta` là đối tượng của `pabbate` nên nghĩa là núi dốc, không phải núi cao nói chung.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
