notes:
  - >-
    Bản **song song** của `an10.37` với Ānanda thay Upāli, cộng thêm sáu câu ca
    về hậu quả.
  - >-
    **Sáu câu ca `3.1`–`3.6` là cùng bài ca với `iti18:3.1`–`3.6`** (đã dịch,
    Kinh Chia Rẽ Tăng Đoàn của Itivuttaka), nên dùng lại nguyên văn: *Kẻ chia rẽ
    Tăng đoàn / bị đọa địa ngục suốt một kiếp / ưa phe nhóm, không đứng trong
    pháp / phá hoại sự an ổn khỏi các ách / Sau khi chia rẽ Tăng đoàn hòa hợp /
    sẽ bị nung nấu trong địa ngục suốt một kiếp.*
  - >-
    **Một biến thể giữa hai bản:** `an10.39:3.3` là `Vaggarato` (ưa phe nhóm)
    còn `iti18:3.3` là `Vaggārāmo` (yêu phe nhóm) — cùng nghĩa, dùng bản của
    `iti18` cho cả hai để hai chỗ đọc như nhau. Ghi lại vì đây là khác biệt bản
    thảo, không phải lỗi dịch.
  - >-
    **`kappaṭṭhikaṁ kibbisaṁ` chưa có tiền lệ (0 segment):** dịch *điều khổ não
    suốt một kiếp*. `kappa` = một kiếp (theo `iti18:3.2` "bị đọa địa ngục suốt
    một kiếp"), `kappaṭṭhika` = kẻ bị đọa một kiếp, `kibbisam` = khổ não. Ghép
    lại để câu hỏi ở `2.3` và câu trả lời ở `2.2` dùng **cùng một cụm từ**, đúng
    như Pāli lặp lại.
  - >-
    **`1.4` chỉ lược giữa bốn mục đầu và mục thứ mười**, nên `1.5` là mảnh cuối
    độc lập — không thêm dấu lược ở đầu `1.5`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
