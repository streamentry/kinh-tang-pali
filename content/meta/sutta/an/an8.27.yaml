notes:
  - >-
    **Hai mươi bốn lỗi chấm câu của Pāli: mở dấu `“` rồi không đóng.** Đếm được
    14 bài: `an5.242`, `an5.243`, `an5.246`, `an5.247`, `an7.86`, `an9.48`,
    `an9.50`, `an9.53`, `an5.55`… nói rõ là `an9.55`, `an9.56`, `an9.57`,
    `an9.58`, `an9.59`, `an9.60`. Ở mỗi bài, `1.1` mở `“` và không segment nào
    đóng lại (độ sâu kép cuối = 1). Tôi đóng ngay sau mệnh đề cuối của `1.1` để
    người đọc không gặp dấu ngoặc treo, và **đây là cố ý lệch 14 segment** — bộ
    kiểm tra báo đúng mười bốy chỗ ấy, không phải sót sót. Pāli không bị sửa.
  - >-
    **Tám cặp `X-bala` đều là thuật ngữ 0 tiền lệ, đặt mới**: `ruṇṇabala` → *sức
    mạnh nhẫn nhịn*, `dārakabala` → *sức mạnh dũng cảm*, `kodhabala` → *sức mạnh
    nổi giận*, `āvudhabala` → *sức mạnh lính tráng*, `issariyabala` → *sức mạnh
    chúa tể*, `ujjhattibala` → *sức mạnh bạo liều*, `nijjhattibala` → *sức mạnh
    dám nói*, `paṭisaṅkhānabala` → *sức mạnh suy xét*, `khantibala` → *sức mạnh
    nhẫn nhịn*.
  - >-
    **`ruṇṇabala` và `khantibala` cùng dịch là *nhẫn nhịn*** vì Pāli cũng dùng
    hai từ gần nghĩa cho hai đối tượng khác (mọi người, và sa-môn Bà-la-môn).
    Nếu phân biệt cũng sẽ là bịa thêm.
