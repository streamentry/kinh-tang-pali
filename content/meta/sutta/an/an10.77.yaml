notes:
  - >-
    **Bài ngắn nhất chương (12 segment)**: con quạ có mười điều ác, và vị tỳ-
    kheo ác có **đúng mười điều ấy**. Hai danh sách lặp nguyên văn — tôi dùng
    một hằng số chung cho cả hai, vì Pāli cũng vậy.
  - >-
    **`Ākaṅkhavagga` → *Phẩm Nguyện Cầu*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *If You Want*, và cả phẩm đúng một việc — *vị tỳ-kheo mong
    nguyện điều này, thì hãy làm điều kia* (`ākaṅkha` = mong nguyện).
    `Ākaṅkhasutta` → *Kinh Nguyện Cầu*.
    **`Ākaṅkhavaggo tatiyo` ở `an10.80:1.14` dịch là *Phẩm Nguyện Cầu, thứ ba***
    — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì phẩm này rõ
    ràng thứ tám (đúng như `8.` ở `0.2`). Tôi dịch theo Pāli vì Pāli là
    authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Mười điều ác của con quạ đều 0 tiền lệ trong đúng nghĩa này, đặt mới và
    ghi lý do tại đây**: `dhaṁsī` → *hỗn láo*; `pagabbho` → *vô lễ*; `tintiṇo` →
    *tham lam*; `mahagghaso` → *ăn nhiều* (tiền lệ gần nhất `dhp320-333:1` cũng
    dịch *mahagghaso* là *ăn nhiều*); `luddo` → *quá độ*; `akāruṇiko` → *không
    biết xót*; `dubbalo` → *yếu* (tiền lệ `an5.121:1.3` dịch *dubbala* là *suy
    yếu*); `oravitā` → *ồn ào*; `muṭṭhassati` → *hay quên*; `necayiko` → *chạy
    theo của cải*. `dhaṁsī`/`pagabbho` có tiền lệ ở `an4.188:5.3` với nghĩa chửi
    thề (*vô lễ*, *trạo cử*), cùng cơ nên tôi theo.
    **Tôi giữ cặp trong danh sách** (`hỗn láo và vô lễ`, `tham lam và ăn
    nhiều`…) vì Pāli ghép từng cặp bằng `ca`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
