notes:
  - >-
    **Hai mươi bốn lỗi chấm câu của Pāli: mở dấu `“` rồi không đóng.** Đếm được
    14 bài: `an5.242`, `an5.243`, `an5.246`, `an5.247`, `an7.86`, `an9.48`,
    `an9.50`, `an9.53`, `an5.55`… nói rõ là `an9.55`, `an9.56`, `an9.57`,
    `an9.58`, `an9.59`, `an9.60`. Ở mỗi bài, `1.1` mở `“` và không segment nào
    đóng lại (độ sâu kép cuối = 1). Tôi đóng ngay sau mệnh đề cuối của `1.1` để
    người đọc không gặp dấu ngoặc treo, và **đây là cố ý lệch 14 segment** — bộ
    kiểm tra báo đúng mười bốy chỗ ấy, không phải sót sót. Pāli không bị sửa.
  - >-
    `sampadā` → *thành tựu* (0 tiền lệ ở dạng danh từ, đặt mới; `an10.11:2.6`
    chỉ có `upasampadāya` → *viên mãn*). Tám mục: `uṭṭhāna` → *khởi lên*
    (`an4.134:0.3`), `ārakkha` → *giữ gìn* (`an4.117:0.3` *Kinh Sự Bảo Vệ*),
    `kalyāṇamittatā` → *kết bạn lành* (`an10.73:3.2`), `samajīvitā` → *sống
    chung*, `saddhā` → *tín chân*, `sīla` → *giới*, `cāga` → *bố thí*, `paññā` →
    *tuệ*.
  - >-
    Có kệ `2.1`–`5.5` (mười sáu vế). `appamāda` → *không phóng dật*
    (`an10.15:1.2`); `magga` → *con đường*; `sotthāna` → *chỗ tốt lành*;
    `samparāyika` → *khởi điểm* (0 tiền lệ, đặt mới); `gharamesino` → *người tìm
    kiếm kho báu* (0 tiền lệ, đặt mới). ⚠ `sukhāvahā` là **một** danh từ ghép
    nên tôi dịch *mang sự dễ chịu* chứ không phải *đem lại sước sước* — bản đầu
    lặp từ theo nghĩa đen và bộ kiểm tra bắt được.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
