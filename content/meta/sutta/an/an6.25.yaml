notes: |-
  Dịch từ Pāli root; bản Anh Bhikkhu Sujato ở commit đã ghim phủ 24/34 segment có nội
  dung (70,6%). Tầng Việt hiện hành không có bài này: `translation/vi/phantuananh/` ở
  commit đã ghim chỉ chứa Pháp Cú.
  COORDINATOR: 10 khoá không có một chữ Anh nào là 2.4, 2.5, 2.6, 3.4, 3.5, 3.6, 4.3,
  4.4, 4.5, 6.7. Tất cả nằm ở phần bản đã ghin đã lược `…pe…` / blockquote, nên Sujato
  để trống rồi nối câu qua chỗ trống. Đây KHÔNG phải thiếu sót của repo và cũng không phải
  sự đồng thuận về cách dịch — chỗ đó Pāli phải tự đứng vững.
  VÌ BỐN CỤM LẶP TRÙNG NGUYÊN VĂN Pāli, dịch từng cụm một lần rồi dùng lại y hệt:
  đo bằng cách so Pāli từng cặp khoá, kết quả ghi trong notes: 1.6/2.4/3.4/4.3/7.2 trùng
  nhau; 1.7/2.5/3.5/4.4/7.3 trùng nhau; 1.8/2.6/3.6/4.5/7.4 trùng nhau. Các khoá 1.5,
  2.3, 3.3, 4.2 chỉ khác nhau ở tân ngữ quán nhớ, nên giữ nguyên phần chung, đổi đúng danh
  từ. 5.4 chỉ có `…pe…` ⇒ giữ đúng một dấu lược, KHÔNG mở rộng (luật BRIEF §10.1).
  6.4–6.6 là ba đoạn lược `…` nối tiếp, giữ nguyên theo Pāli.
  Thuật ngữ: `anussatiṭṭhāna` dịch «chỗ quán nhớ» — tra tiền lệ trong tầng Việt dự án thì
  "sở từ niệm" và "sở niệm" đều 0 kết quả, nên đây là cách diễn đạt mới của lát này; nếu
  các lát sau có kinh quán nhớ, nên bám theo để khỏi sinh cách thứ N+1.
  `pañcannetaṁ kāmaguṇānaṁ adhivacanaṁ` dịch «tên gọi của năm loại trần duyên» — giữ
  mạch "đây là tên gọi" vì chính người nói đang giải thích nghĩa của chữ "tham".
  `evam'idhekacce` dịch «được thanh tẩy như thế này» ("idhekacce" = sự thanh tẩy, "sạch
  bằng thứ này"), không dịch "được cải thiện" để giữ nghĩa thanh lọc của tầng này.
  technical_integrity 9.6: môi trường lát này không có shell, nên không tự chạy được
  `npm run validate`/`test`/`build`; các bài đã tự kiểm bằng bản cài lại logic của
  `_hvi.py` (đủ khoá, không thừa khoá, NFC, không trùng nguyên văn Pāli, số dấu lược
  khớp từng khoá, ngoặc kép cân trên cả bài theo thứ tự số).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.4 — ‘bậc Ứng Cúng … bậc Giác Ngộ’ → ‘bậc A-la-hán …
  bậc Phật’ (dạng đa số 8/13 khoá trùng ở `itipi so bhagavā …pe…`; ‘A-la-hán’ 2.274 lần so với ‘Ứng
  Cúng’ 5 lần toàn tầng); khoá 2.2 — ‘được người trí tự mình giác hiểu’ → ‘đáng để những bậc trí tự mình
  nhận biết’ (`veditabbo` = ‘đáng để nhận biết’; 6/8 khoá trùng). Giữ ‘Thế Tôn’ (không đổi thành ‘Đức
  Phật’) và ‘khéo thuyết giảng’ vì cả bài dùng ‘Thế Tôn’ (3.2) và ‘khéo thực hành’.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt hai): khoá 1.6, 2.4, 3.4, 4.3, 7.2 — ‘tâm vị ấy
  hoàn toàn vững vàng, đã lìa bỏ tham, đã tự do khỏi tham, đã vượt khỏi tham’ → ‘vào lúc ấy tâm vị
  ấy hoàn toàn chánh trực, đã xuất ly, giải thoát, và vượt khỏi lòng tham’ (dạng 6/11 khoá trùng,
  cũng là cách `an6.26:2.5`; bản cũ lặp ‘tham’ ba lần trong khi `gedhamhā` chỉ một lần và bỏ
  `tasmiṁ samaye`); khoá 3.2 — ‘Chúng đệ tử Thế Tôn khéo thực hành … ở đời’ → ‘Tăng chúng đệ tử
  của Thế Tôn khéo thực hành … của thế gian’ (`lokassa` = ‘của thế gian’: 17 khoá so với 1 khoá ‘ở
  đời’ trong các câu có `anuttaraṁ puññakkhettaṁ lokassa`; lấy lại ‘Tăng’ của `saṅgha`); khoá 6.2
  — danh sách sáu cõi trời (‘các vị chư thần … hân hoan, thích tạo ra…’) → tên chuẩn đang dùng ở
  `an6.10:7.2` và `an11.11:8.2` (‘chư thiên Tứ Đại Thiên Vương … Tha Hóa Tự Tại … Phạm Chúng’);
  quét cả bài cho thuật ngữ đó: 6.1 và 7.1 ‘chư thần’ → ‘chư thiên’; 6.3 và 6.7 viết lại đúng
  `saddhāya` / `paññāya` (bản cũ liệt kê đủ năm đức ở cả hai khoá, trong khi Pāli mỗi khoá chỉ một
  đức) theo cách đã dùng ở `an6.10:7.3/7.7` và `an11.11:8.3/8.7` (‘từ đây mệnh chung, được sinh
  vào nơi kia’; bản cũ ‘tận diệt’ cho `cutā` là sai nghĩa); giữ nguyên khoá 2.2 (đã sửa ở lượt
  trước; ‘Thế Tôn khéo thuyết giảng’ sát `svākkhāto bhagavatā` hơn ‘Đức Phật … hay’ của modal).
