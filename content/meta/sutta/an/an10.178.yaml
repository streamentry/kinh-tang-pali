notes:
  - >-
    Bài **định nghĩa** của chương, song song `an10.134`. Cùng khung
    (`sādhu/asādhu`, đối thoại `paccassosuṁ`, `Taṁ suṇātha, sādhukaṁ manasi
    karotha, bhāsissāmī”ti.` đủ ba vế) nhưng **trả lời khác**: `an10.134` định
    nghĩa bằng dãy `micchā-/sammā-`, còn `an10.178` định nghĩa bằng **tên từng
    điều sai** — sát sinh, trộm cắp, tà dâm… Vì vậy hai bài dịch khác nhau ở
    `2.2`/`2.5` và không thể dùng lại cho nhau.
  - >-
    Hai danh sách ở `2.2` và `3.2` là **cùng Pāli với `an3.117:1.5` và `5.2`**,
    đã dịch: sát sinh · trộm cắp · tà dâm · nói dối · nói hai lưỡi · nói ác khẩu
    · nói phù phiếm, rồi tham lam · sân hận · tà kiến; chiều tích cực là "kiêng
    tránh …". Cùng danh sách ấy đã dùng ở `an10.199-210:1.3` và `2.3`, dùng lại
    nguyên văn.
  - >-
    `idaṁ vuccati` ở `an10.178` và `an10.180` dịch **"Điều này được gọi là, này
    các tỳ-kheo, …"** — cùng cách với `ayaṁ vuccati` chủ đạo trong corpus (40
    segment, so với 9 segment của `idaṁ vuccati` chưa có cách chủ đạo). Hai từ
    Pāli cùng nghĩa "điều này".
  - >-
    `sādhu` → **"lành"** (163 segment, 39 lần dịch "lành"; `dhp223` "lấy lành
    thắng không lành"). `Sādhuvagga` → **"Phẩm Lành"** — cùng tên chương với
    chương 14, cùng cách dịch. Lưu ý bài này đánh số mục `1.x`, `2.x`, `3.x`
    (không phải `1.x`, `2.x` như `an10.134`); giữ nguyên theo Pāli.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
