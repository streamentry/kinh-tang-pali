notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 4.2 — ‘xin Thế Tôn nhận đệ tử làm cư sĩ quy ngưỡng’ → ‘mong Thế Tôn ghi nhận đệ tử là nam cư sĩ đã quy y’ (`upāsaka` là nam cư sĩ, `saraṇaṁ gata` là đã quy y; cùng Pāli ở `an8.12`, `an10.176`); giữ nguyên khoá 4.1 vì ‘Thật vi diệu thay’ là một trong các cách dịch `abhikkantaṁ` đang dùng chung trong kho (‘Thật tuyệt vời’ 18 khoá, ‘Thật vi diệu’ 10, ‘Tuyệt vời thay’ 7, ‘Tuyệt diệu thay’ 6), không có chuẩn đa số.

  Rà nhất quán theo Pāli trùng 2026-10-14 (đợt quét lỏng): khoá 1.3 — bỏ “thường” khỏi “người ta thường nói” (`vuccati` là “được nói”, không mang nghĩa thường xuyên) → “người ta nói”, khớp `an6.48:1.3` và `sn35.70:1.3`; giữ nguyên khoá 1.4 (“thiết thực hiện tại … tự mình giác tri” là khuôn của `an6.48:1.4` và `an6.47:3.9`, nhất quán trong bài).
