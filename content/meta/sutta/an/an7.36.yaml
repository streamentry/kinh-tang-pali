    `2.1`–`4.4` **lặp lại** bảy phẩm ấy rồi kết bằng *Ở những hoàn cảnh này, có
    người sinh trưởng ở đây*. Tôi dịch cả hai lần, không rút gọn. ⚠ `guyhamassa
    āvi karoti` (*nói thẳng* bí mật) và `guyhamassa pariguhati` (*giữ kín*)
    trông trái ngược; xem ghi chú bất định.
