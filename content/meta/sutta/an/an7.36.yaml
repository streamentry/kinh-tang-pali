    **Bất định có nghĩa đáng kể, đã phân xử và ghi lại:** (1) `an6.106:2.3-2.4`
    — uddāna ghi `Nibbānaṁ anavatthi, / ukkhittāsi atammayo`. Đây là uddāna của
    nhóm `Nibbanā…`, và hai vế này **không** nói rõ đối tượng: `anavatthi`
    (*không lay chuyển*) có thể là Niết-bàn hoặc hạt giống Thánh thừa;
    `atammayo` (*cọc*) có thể là hạt giống hoặc cây cờ Pháp. Tôi dịch theo cách
    đọc trực tiếp (*Niết-bàn không lay chuyển / được dựng thành cọc không lung
    lay*) và **không** gán chúng vào bài nào, vì tầng Pāli không cho tên các bài
    con trong nhóm. (2) `an8.60:4.2` — `dīghajāṇu` và `ujjayo` có thể là tên
    riêng hoặc danh xưng. Tôi **giữ nguyên chữ Pāli** vì không có cách nào kiểm
    chứng từ tầng đã ghim. (3) `an5.220:1.3` — năm `ādīna` của thứ dễ chịu là ẩn
    dụ về đồ ăn; `visamā/bahurajā/caṇḍasunakhā/vāḷayakkhā/dullabhapiṇḍā` tôi
    dịch theo nghĩa về thức ăn ( cay đắng / đắt tiền / đắng khó nuốt / nhức nhối
    / khó kiếm) — đây là cách đọc của Sujato (*too bitter, too expensive, too
    sharp, too painful, hard to find*) chứ không phải nghĩa trừu tượng của
    `visama`. (4) `an7.36:1.3` — `guyhamassa āvi karoti` nghĩa là **nói thẳng**
    ra bí mật của kẻ kia, và `guyhamassa pariguhati` là **giữ kín**; hai vế
    trông trái ngược nhưng Pāli cố ý vậy, tôi giữ cả hai và ghi ở đây.
