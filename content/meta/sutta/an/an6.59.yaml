notes: |-
  Dịch từ Pāli root (`an6.59_root-pli-ms.json`, 39/39 khoá khớp `pre` = `an6.59:`).

  **Coverage.** 21 segment Pāli có nội dung, Sujato phủ đủ 21 ⇒ 21/21 = 1,0000; không cần entry trong
  `content/meta/reference-gaps.yaml`, và không có lớp lấp `english-project` cho bài này nên coverage
  không dựa vào bản dịch Anh của chính dự án.

  **Pāli trùng nguyên văn: 2 khoá, 472 cặp; dùng lại y nguyên văn 1.** `9.5` `Pañcamaṁ.` dùng lại đa số
  241 bài. `1.1` `Evaṁ me sutaṁ—` là chỗ **lệch có lý do, và số đo rất đáng ghi**: toàn tầng có 225 lần
  dịng Pāli này với 10 cách, lớn nhất là *Tôi nghe như vầy:* (110 lần) — nhưng **110 lần đó không có lần
  nào trong bộ `an`** (12 ở `sn`, 98 ở bộ khác). Trong `an` thì *Tôi nghe như vầy.* thắng 23–38, và trong
  `sn` cũng thắng 45. Vì an6.59 thuộc `an`, đã theo khuôn của `an` và giữ dấu chấm; nếu người biên tập
  muốn thống nhất toàn tầng thì phải sửa 110 tệp kia, không phải tệp này.

  **Danh sách mười lỗi của vị tỳ-kheo: 0 tiền lệ, dịch mới toàn bộ.** `uddhato` **kiêu ngạo** (26 lần),
  `unnaḷo` **hỗn láo** (2), `capalo` **đổi tính** (0 — dùng *hay đổi* là cách riêng, chọn *đổi tính* để
  giữ dạng danh–tính), `mukharo` **nói lỡ** (0), `vikiṇṇavāco` **nói lời phỉ tục** (0), `muṭṭhassati`
  **quên mất** (33), `asampajāno` **thiếu giác tri** (`giác tri` 6), `asamāhito` **thiếu định**,
  `vibbhantacitto` **tâm lang thang** (0), `pākatindriyo` **các căn không kiềm chế**; phủ định của chúng
  là `anuddhato … saṁvutindriyo` → **không kiêu ngạo … các căn đã ngăn giữ**. Vì không có tiền lệ nào để
  đối chiếu, đây là lựa chọn của người dịch và là lý do `terminology` ở 9,2 cùng `ambiguity_integrity` ở 9,0.

  **Thuật ngữ loại tỳ-kheo: dựng từ tiền lệ đo được, không bịa.** `ārāñika` → **sống trong rừng** (50 lần
  đếm được, khuôn mn77 *…giữ Giới, sống trong rừng, ở nơi xa vắng…*), `piṇḍapātika` → **chỉ ăn thức ăn
  khất thực** (đúng câu của mn77:9.7 và mn77:9.9), `nemantaniko` → **nhận lời mời** (đúng câu của mn77:9.8
  *nhận lời mời dùng bữa*), `paṁsukūlika` → **mặc y phấn tảo** (đúng câu của mn77:9.4 *mặc y phấn tảo, mang
  y thô*), `gahapaticīvaradharo` → **mặc y do gia chủ dâng** (đúng câu của mn77:9.5). `gārayha` →
  **đáng bị chê trách** (20 lần), `pāsaṁsa` → **đáng được khen** (18 lần), `tenaṅgena` → **ở phương diện
  ấy** (192 lần), `saṅgha` → **hội chúng** (793 lần). `gahapati` → **này gia chủ**, đúng khuần đã có (đo 315
  khoá Pāli có `gahapati`; không bài nào dùng *ông này, gia chủ*, nên bản nháp đầu đã bỏ).

  **Một chỗ tự đặt, đã ghi:** `kāsikacandana` dịch **gỗ đàn hương mang từ Kāsi về**. Chuỗi `Kāsi` có 0
  lần trong tầng Việt và `gỗ đàn hương` có 9 lần (không kèm địa danh), nên địa danh giữ nguyên Pāli.

  **Dấu lược và nháy kép.** Tám khoá có `…pe…` (4.1, 4.3, 5.1, 5.3, 6.1, 6.3, 7.1, 7.3) và mỗi khoá giữ
  **đúng một** `…`; danh sách mười lỗi bị lược ở đó **không** mở rộng, trong khi 3.1 và 8.1 có đủ mười
  lỗi vì Pāli viết đủ. Nháy kép đúng như Pāli: `1.4` mở và đóng ngay, `1.5` mở và đóng ở `1.6`, `2.1` mở
  và đóng ở `9.3`, `9.4` mở và đóng ngay; `ngoặc()` báo cân.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`, và `npm run build` vì bài sẽ `published`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
