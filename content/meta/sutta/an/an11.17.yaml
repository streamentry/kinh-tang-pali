notes: |-
  Dịch toàn bộ 106 khóa Pāli root từ snapshot SuttaCentral/Bilara đã ghim; không có khóa nào ngoài tập khóa Pāli, thứ tự khóa đúng thứ tự Pāli.

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE ENGLISH:
  - Tầng Anh Sujato phủ 90/90 khóa Pāli có nội dung (>= 40 ký tự, bỏ khối :0), tức 1,00; không dưới ngưỡng 0,80. Chỉ khóa colophon 28.2 ("Sattamaṁ.") để trống ở Sujato, và khóa đó ngắn hơn ngưỡng. Tầng english-project không có tệp cho bài này, nên toàn bộ phần đối chiếu English là độc lập (Sujato). Không phát sinh gap; không cần entry trong reference-gaps.
  - Tầng Việt hiện hành dạng phân đoạn không có bài này trong snapshot đã ghim; bản Hòa thượng Thích Minh Châu nguyên bài (mục Tra cứu toàn văn) được đọc để đối chiếu thuật ngữ, không cấp text cho cột nào. Bài song song Trung Bộ 33 (Đại Kinh Người Chăn Bò) đã published trong tầng dự án, cùng công thức mười một chi phần, là tiền lệ chính.

  KIỂM TRA ĐO ĐƯỢC:
  - Tập khóa Việt = tập khóa Pāli = 106; thứ tự khóa đúng thứ tự Pāli; không khóa rỗng; NFC sạch; không Pāli lọt sang bản Việt.
  - Nháy đơn, nháy kép và dấu lược khớp Pāli từng khóa: 0 lệch trên 106 khóa. Pāli có dấu lược "…" trong các khóa 5.2, 6.4 đến 6.7, 13.2, 20.4 đến 20.7, 27.2, và một "(…)" trần ở 3.2; bản Việt giữ đúng từng dấu ở đúng vị trí, không có "…pe…" trong Pāli của bài này. Khóa 5.2 kết bằng " …" đúng như Pāli kết bằng lược.
  - Pāli trùng nguyên văn trong chính bài: 11 cặp; 4 cặp bản Việt khác có chủ đích, đều là câu "Katamehi ekādasahi?" ("Mười một yếu tố nào?" khi câu trước nói aṅgehi ở 1.2 và 15.2; "Mười một pháp nào?" khi câu trước nói dhammehi ở 2.2 và 16.2). 7 cặp còn lại bản Việt giống nhau (các công thức giác quan 6.4 đến 6.7 với 20.4 đến 20.7).
  - Dùng lại nguyên văn từ Trung Bộ 33: 90/106 khóa có bản Việt trùng đúng một câu của mn33; trong đó 58 khóa có Pāli trùng nguyên văn byte với một khóa của mn33, phần còn lại chỉ khác dấu câu hoặc sandhi ở Pāli (ví dụ ngắt câu hoặc dấu chấm phẩy so với dấu chấm, "Evamevaṁ" so với "Evameva", "kaṅkhāṭhāniyesu" so với "kaṅkhāṭhānīyesu"), dịch cùng nghĩa.
  - Số Pāli: ekādasa = 11 ("mười một") ở 1.1, 1.2, 1.4, 2.1, 2.2, 14.1, 15.1, 15.2, 15.4, 16.1, 16.2, 28.1 (12 khóa); cattāri/cattāro = 4 ("bốn đại", "bốn niệm xứ") ở 3.2, 11.2, 17.2, 25.2; aṭṭhaṅgika = 8 ("Thánh đạo tám ngành") ở 10.2 và 24.2. Không có số lớn hay phép nhân.

  THUẬT NGỮ VÀ TIỀN LỆ (đếm trên tầng):
  - Bộ thuật ngữ mười một chi phần dùng lại nguyên của mn33 (cùng Pāli): "biết hình dáng" cho người chăn bò và "biết sắc" cho vị tỳ-kheo (rūpaññū), "giỏi nhận biết đặc điểm" (lakkhaṇakusala), "gỡ trứng ruồi" (āsāṭikaṁ hāretā), "băng vết thương" (vaṇaṁ paṭicchādetā), "hun khói" (dhūmaṁ kattā), "chỗ lội qua" (tittha), "chỗ uống nước thỏa thích" (pīta), "đường đi" (vīthi), "rành bãi chăn" (gocarakusala), "vắt sữa đến cạn" / "vắt sữa mà chừa lại" (anavasesadohī / sāvasesadohī). Ba tệp trong tầng (mn33, an11.22-29 và bài này) dùng đúng bộ này, an11.22:1.3 trùng chữ với khóa liệt kê của người chăn bò ở đây (1.3), chỉ khác dấu kết.
  - adhivāseti -> "dung chứa" (mn33 và mil5.3.12 trong tầng) thay vì "chấp nhận" (12 khóa ở ngữ cảnh khác); chọn dạng của bài song song để hai bài cùng công thức không lệch nhau.
  - atirekapūjāya pūjetā -> "đặc biệt chăm sóc" (bò đực đầu đàn) và "đặc biệt tôn kính" (các vị trưởng lão), đúng như mn33; cùng một động từ Pāli nhưng đối tượng khác nên giữ hai dạng của bài song song.
  - mettaṁ kāyakammaṁ / vacīkammaṁ / manokammaṁ -> "thân hành / khẩu hành / ý hành từ ái" (mn33); paccupaṭṭhāpeti -> "duy trì".
  - Câu kết "Sattamaṁ." -> "Thứ bảy." (279 khóa trong tầng dùng dạng này); tên phẩm "2. Phẩm Nhớ Tưởng" theo các bài an11 cùng phẩm (an11.12, an11.13, an11.18, an11.19) dù một khóa an11.21 viết "Phẩm Tùy Niệm".
  - Nháy đơn quanh câu iti: ở Pāli có nháy đơn tại 3.2, 4.2, 8.3, 17.2, 18.2, 22.3; trong tầng AN dạng giữ nháy chiếm đa số (1361 khóa có nháy so với 80 không có). Vì vậy 3.2, 4.2, 17.2 và 18.2 giữ nháy đơn dù mn33 (khóa Pāli trùng) viết "rằng" không nháy; đây là khác biệt có chủ đích so với mn33 và là điểm mn33 có thể xem lại.

  BẤT ĐỊNH (không thêm vào thân kinh):
  - "(…)" ở 3.2: Pāli ghim có dấu lược trần nằm sau "yaṁ kiñci rūpaṁ"; bản Anh Sujato và mn33 điền "tất cả sắc"; ở đây giữ "(…)" đúng dấu lược của tầng Pāli, không điền chữ.
  - yatvādhikaraṇaṁ (6.3, 6.9, 20.3, 20.9): dịch "Nếu ... có thể tràn ngập" theo mn33; Sujato dịch khác nhau giữa chiều phủ định (đã xảy ra) và chiều khẳng định (giả định). Thể anvāssaveyyuṁ là cách ước định ("có thể tràn ngập"), nên giữ cách đọc có điều kiện cho cả hai chiều; chưa phân xử được nếu đọc yatvādhikaraṇaṁ là "vì lẽ nào mà".
  - pīta (9.1, 23.1): với con bò là "chỗ uống nước"; với vị tỳ-kheo, Pāli nối ngay với atthaveda, dhammaveda và pāmojja, nên "chỗ uống nước thỏa thích" ở đây là phép ẩn dụ; Sujato dịch "satisfaction". Giữ nguyên cách dịch của mn33.
  - yathāsutaṁ yathāpariyattaṁ dhammaṁ (7.2, 21.2): giữ dạng của mn33 "những Pháp mình đã nghe và học thuộc"; yathāpariyatta có thể hiểu thêm là "như đã được học để thuộc/ nắm vững".
  - rūpaññū: bản tiếng Việt truyền thống đối chiếu ra "biết sắc" cho cả người chăn bò và tỳ-kheo; dự án giữ "biết hình dáng" cho người chăn bò theo mn33 và "biết sắc" cho tỳ-kheo (nghĩa kỹ thuật "bốn đại và sắc do bốn đại tạo thành").
  - 15.3 kết bằng dấu gạch ngang trong Pāli, nối trực tiếp sang 15.4; bản Việt giữ gạch ngang và viết 15.4 chữ thường.

