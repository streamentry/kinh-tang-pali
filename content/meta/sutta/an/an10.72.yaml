notes:
  - >-
    **Bài có tình tiết thật** — các vị đại đệ tử bỏ đám Licchavi để tránh tiếng
    ồn, rồi Đức Phật khen và giảng mười gai nhọn. Vì vậy đây là bài duy nhất
    chương có **tên riêng địa danh** và **danh sách tên người**.
  - >-
    **`Ākaṅkhavagga` → *Phẩm Nguyện Cầu*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *If You Want*, và cả phẩm đúng một việc — *vị tỳ-kheo mong
    nguyện điều này, thì hãy làm điều kia* (`ākaṅkha` = mong nguyện).
    `Ākaṅkhasutta` → *Kinh Nguyện Cầu*.
    **`Ākaṅkhavaggo tatiyo` ở `an10.80:1.14` dịch là *Phẩm Nguyện Cầu, thứ ba***
    — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì phẩm này rõ
    ràng thứ tám (đúng như `8.` ở `0.2`). Tôi dịch theo Pāli vì Pāli là
    authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Sáu vị ở `1.2` là tên riêng, giữ nguyên chữ Pāli**; `Vesālī`,
    `kūṭāgārasālā`, `mahāvana` (Rừng Lớn) và `gosiṅgasālavana` đều **0 tiền lệ
    trong đúng nghĩa này** — đặt mới. `licchavī` có 9 segment tiền lệ nhưng ở
    `an5.143:2.1` dùng *những người Licchavī ấy* cho cụm tương tự, nên tôi theo.
    **`kaṇṭaka` → *gai nhọn*** (0 tiền lệ trong nghĩa này; `an3.35:2.1` dùng
    *gokaṇṭaka* cho *gai nhọn* trong cảnh đông lạnh, cùng nghĩa gai nhọn) — và
    toàn bộ bài xoay quanh từ này, nên tôi dịch `saddakaṇṭakā jhānā` thành
    *tiếng động là gai nhọn của sự thiền*, giữ nguyên hình ảnh của Đức Phật.
  - >-
    **Bốn vế trong mười gai nhọn dùng lại tiền lệ có thật**: `saṅgaṇikārāmatā` →
    *ham thích quần chúng* và `paccavekkhati` → *phản tư* theo `an5.149:1.3`;
    `guttadvārassa` → *giữ chặt các căn* theo `an5.150:1.3` (bài đó dịch phủ
    định *không bảo vệ các căn*); `vitakkavicārā` → *tầm và tứ* theo
    `an3.63:6.6`; `mātugāma` → *người nữ* theo `an3.129:1.2`.
    Không có tiền lệ, đặt mới: `pavivekārāma` → *ham thích sự vắng vẻ* (đối xứng
    với `saṅgaṇikārāmatā`); `asubhanimitta`/`subhanimitta` → *tướng xấu*/*tướng
    đẹp*; `visūkadassana` → *sự thấy rõ ràng*; `pīti` → *hỷ*; `assāsapassāsa` →
    *hít vào và thở ra* (theo chương 6); `saññāvedayitanirodha` → *sanhỏa tưởng
    và thọ tận*.
  - >-
    **`7.1`–`7.6` lặp ba vế `akaṇṭakā / nikkaṇṭakā / akaṇṭakanikkaṇṭakā` trước
    rồi lặp lại với `arahanto`** — sáu segment, tôi dịch đủ sáu và giữ dấu chấm
    phẩy ở `7.4`–`7.5` vì Pāli vậy. `nikkaṇṭakā` (đã nhổ) khác `akaṇṭakā` (không
    gai) nên tôi dùng *không còn gai nhọn* cho chữ thứ nhất.
  - >-
    **Lỗi chính tả do lượt review bắt được:** `1.2` ghi *Tôn giā Nikaṭa* thay vì
    *Tôn giả Nikaṭa*.
