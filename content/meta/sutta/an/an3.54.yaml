notes: |-
  Sửa lan 2026-10-13: khoá an3.54:1.3 và an3.54:7.3, «không hề thời hạn» → «không thời hạn» cho akāliko (công thức sandiṭṭhiko akāliko ehipassiko opaneyyiko paccattaṁ veditabbo viññūhī); căn cứ: dạng «không thời hạn» đã dùng ở an11.13:7.2 (đã sửa theo an11.11:4.2), «hề» là chữ thêm không có trong Pāli. Đã xét và giữ nguyên: bài không có vitakka nên không có lỗi «tưởng» như an3.40; mẫu số 24 khoá, 2 khoá đổi, tập khoá và thứ tự không đổi. Ghi nhận, chưa sửa vì ngoài phạm vi lượt này: an3.54:4.3 kết bằng «…”» nhưng Pāli ở khoá đó không có dấu nháy đóng (nháy đóng ở 7.3); cùng dạng ở hai bài anh em. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại sau sửa lan; điểm và status giữ nguyên.
