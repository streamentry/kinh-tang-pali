  TẦNG THAM KHẢO. Tầng english-sujato tồn tại tại commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639 và bản Sujato phủ 28/28 khoá Pāli có nội dung (100%), nên không cần mục trong content/meta/reference-gaps.yaml. Tầng Việt hiện hành vắng với AN.

  MƯỜI KHOÁ PĀLI TRÙNG NGUYÊN VĂN, TÔI DÙNG LẠI NGUYÊN VĂN. Tôi tự dựng chỉ mục Pāli↔Việt (5.764 tệp Pāli trong cache, 4.136 tệp Việt dự án) và quét từng khoá thân bài. Kết quả: 9 khoá trùng byte-for-byte với an8.26 (bài cùng phẩm, cùng nội dung với Jīvaka) — 1.3, 2.1, 3.1, 3.9, 4.1, 4.3, 4.4, 4.5, 4.6, 4.7, 4.8, 4.9 — và tôi dùng lại nguyên văn của bài ấy cho tất cả; 1.2 trùng byte-for-byte với mn14:2.1 nên dùng lại nguyên văn ấy; 1.1 trùng với mn14:1.2, mn18:1.2, mn122:1.2 nên dùng lại Một thời, Đức Phật ở xứ Sakya, gần Kapilavatthu, tại tu viện Cây Đa. 1.5 trùng byte-for-byte với sn55.37:2.3 nên tôi dùng lại nguyên văn của sn55.37: cho đến chừng ấy, này Mahānāma, được gọi là một người cư sĩ.

  MỘT CHỖ KHÔNG NHẤT, GHI ĐỂ NGƯỜI BIÊN TẬP XỊT. Vì dùng lại nguyên văn ở 1.5, trong chính bài này upāsako có hai cách: một người cư sĩ (1.5, theo sn55.37) và người cư sĩ cận sự nam (1.3, 2.1, 2.3, 3.1, 3.10, 4.1, 4.10, theo an8.26). Tôi chọn giữ cả hai theo luật dùng lại bản đã có thay vì tự tạo cách thứ ba; muốn thống nhất thì phải sửa an8.26 hoặc sn55.37, tức ngoài lát này.

  THUẬT NGỮ KHÁC, ĐẾM ĐƯỢC. Gahapativagga → 3. Phẩm Gia Chủ (an8.26 và an8.28 dùng, an8.27 dùng Phẩm Thuộc Tộc). Mahānāmasutta → Kinh Mahānāma (đúng sn55.37:0.3 và sn55.49:0.3). Kinh Tăng Chi Bộ 8.25 cho :0.1 theo đa số trong tầng an. Tên từng vế trong 3.2 đến 3.8 và 4.2 đến 4.9 dùng lại nguyên văn an8.26: tự mình đầy đủ lòng tin, đầy đủ giới hạnh, đầy đủ sự bố thí buông xả, ưa thích gặp gỡ các tỳ-kheo, ưa thích nghe Chánh pháp, ghi nhớ những pháp đã nghe, suy xét tìm hiểu ý nghĩa, thấu hiểu ý nghĩa và Chánh pháp.

  Sakya, KHÔNG Sākya. Đếm cả tầng Việt dự án: Sakya 135 lần, Sākya 33, Sakk 19; tôi theo Sakya. Cùng câu 1.1 vẫn dùng nguyên văn của mn14 vốn ghi Sakya nên không lệch.

  DẤU LƯỢC. Bài không có dấu lược nào; bản Việt cũng không có.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
