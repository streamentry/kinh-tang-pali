notes: |-
  **Coverage tầng Anh đo được: 39/39 khoá Pāli có nội dung = 1,0000.** Đo bằng công thức `src/lib/canon/reference.ts` (`substantivePaliMinChars = 40`, bỏ khối `:0`): `englishPath = sutta/an/an7/an7.51_translation-en-sujato.json` **có trong `source/upstream-manifest.json`** (commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`), đã sync, 51 khoá / 50 khoá có chữ, `substantiveWithoutEnglish = 0`. Không có lớp `english-project` cho uid này. Tầng `vietnamese-current` vắng tại commit đã ghim (chỉ 26 tệp Pháp Cú) ⇒ không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  **2/51 khoá trùng nguyên văn, dùng lại nguyên văn.** `0.2` `5. Mahāyaññavagga` → *5. Phẩm Đại Tri Kiến* (5×: an7.44/45/46/48/50) · `1.2` `Taṁ suṇātha …pe…` → *Hãy lắng nghe và chú tâm kỹ …* (**40×**, an4.208, an10.135–…). Ngoài ra chuỗi sáu khoá `2.2 / 2.5 / 3.2 / 3.5 / 4.3 / 4.6 / 5.2 / 5.5` là Pāli trùng nhau từng cặp nên dùng chung một cách dịch.

  **`saṁyoga` / `visaṁyoga` → *sự trói buộc* / *sự thoát khỏi trói buộc* — chọn theo tiền lệ có sẵn, không phát minh.** Đếm trên tầng Việt: `saṁyogo hoti` → *có sự trói buộc* (sn35.63, 2×) · `kāmayogavisaṁyogo` → *sự thoát khỏi trói buộc bởi dục* (an4.10:5.3–5.7, dn34:1.5.27) · `methunasaṁyogānaṁ` → *kiểu trói buộc bằng tình dục* (**an7.50:9.1 và :10.1**) · `mārasaṁyogaṁ` → *sự trói buộc của Ma* (snp3.12). `an7.50` là bài ngay trước trong cùng phẩm, nên đây còn là bắt buộc về tính nhất quán trong chính phẩm. **Ghi nhận:** *giao duyên* có **0** tiền lệ trong kho, nên tôi không dùng. Tiêu đề `0.3` dùng *Kinh Trói Buộc Và Thoát Trói Buộc* để khớp với thân bài, dù dài hơn hẳn các tiêu đề khác trong bộ — cần người điều phối ghi vào bảng tên nếu muốn rút ngắn.

  **0 tiền lệ cho toàn bộ khối `itthi-/puris-` (0/13 cụm), ghi lại đầy đủ để lát sau khỏi phát minh thêm cách:** `kutta` → *cử chỉ* · `ākka` → *dáng vẻ* · `vidha` → *cách cư xử* (4 khoá, ví dụ mn) · `chanda` → *ham muốn* (575 khoá) · `sara` → *giọng nói* (11 khoá) · `ālaṅkāra` → *sự trang sức* (81 khoá) · `rajjati` → *bị quyến rũ* (*quyến rũ* 25 khoá) · `abhiramati` → *thích thú trong điều ấy* (*thích thú* 85 khoá) · `manasi karoti` → *chú tâm vào* (20 khoá) · `ākaṅkhati` → *mong muốn* (269 khoá) · `sukhaṁ somanassaṁ` → *sự vui và sự an ổn* (*sự an ổn* 128 khoá) · `itthattaṁ` / `purisattaṁ` → *tính nữ* / *tính nam* · `nātivattati` / `ativattati` → *không vượt khỏi* / *vượt khỏi* tính của mình. `itthindriyaṁ purisindriyaṁ` → *căn nữ tính, căn nam tính* theo đúng 1 tiền lệ `sn48.22:1.3`.

  **Danh sách sáu mục giữ nguyên sự lặp của Pāli** (`itthikuttaṁ itthākappaṁ … itthālaṅkāraṁ`): *cử chỉ nữ tính, dáng vẻ nữ tính, cách cư xử nữ tính, ham muốn nữ tính, giọng nói nữ tính và sự trang sức nữ tính*. Lặp bảy lần chữ *nữ tính* trong một câu nghe nặng nề, nhưng **đó đúng là điểm nhấn của Pāli** — thứ gì cũng tính nữ, không chừa mảnh nào; Sujato cũng lặp *feminine* sáu lần. Đây là lý do `vietnamese_clarity` không lên cao hơn.

  **Chủ thể.** `2.3`/`2.6` dùng `Sā`, `3.3`/`3.6` dùng `So` (nam mặc định trong Pāli) — cả hai đều dịch *Người ấy*, vì giới tính đã do `2.1` và `3.1` xác lập ngay trước và tiếng Việt không có từ tốc nào trung tính hơn.

  **Dấu lược: Pāli 1 `…pe…` (ở `1.2`) ↔ Việt 1 `…`, khớp.** Không khoá nào mở rộng. Nhặc kép: mở `“` ở `1.1`, đóng `”` ở `5.12` (giữ nguyên `ti`), khớp đúng cấu trúc Pāli. Chốt `_hvi.py` sạch: 51/51 khoá, khoá thừa 0, NFC OK.
