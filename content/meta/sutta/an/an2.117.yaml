    một hằng chứ không viết hai lần. (e) **Đọc Pāli, không đọc bản dịch cũ** —
    `sn27.6`–`sn27.8` trông y hệt `sn27.4` nhưng Pāli khác hẳn ở danh từ, và
    chính xem soát mới bắt được.
  - >-
    **7 khoá** — bài **cuối** của bộ nên mang thêm hai dòng đóng: `1.5`
    `Bālavaggo pañcamo` → *Phẩm Kẻ Ngu, thứ năm.* (theo `an2.98:0.2` *10. Phẩm
    Kẻ Ngu*, khác `an3.10:2.8` *Phẩm Ngu*) và `1.6` `Dutiyo paṇṇāsako samatto` →
    *Phần năm mươi kinh thứ hai hoàn tất.* theo `an10.154:1.11`.
