notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (tra cứu toàn văn, không căn lề theo segment). **Coverage Anh trên Pāli có nội dung: 59/59 = 100%** (ngưỡng 0.8): toàn bộ 59 khoá Pāli ≥ 40 ký tự (bỏ khối `:0`) đều do Sujato phủ; không có khoá nào do tầng `english-project` lấp, nên không có chỗ nào Pāli phải tự đứng một mình. Tầng Việt hiện hành phân đoạn vắng ở commit đã ghim (bilara chỉ có Pháp Cú).
    **11/71 khoá có Pāli trùng nguyên văn ở bài khác; 7 dùng lại NGUYÊN VĂN, 4 khác có chủ ý.** Dùng lại: `1.1` (14 cặp trong AN: *Một thời, Đức Phật ở Vesālī, tại Đại Lâm, trong giảng đường mái nhọn.* 5, cùng hạng với biến thể *an trú* 5) · `1.2` (*Tại đó, Đức Phật gọi các vị tỳ-kheo:* 20/32 trong AN, 59/129 toàn tầng) · `1.4` (186 cặp: *Đức Phật đã nói như vậy.* 8/16 trong AN) · `1.5` (7 cặp: *Nói vậy xong, đấng Thiện Thệ từ chỗ ngồi đứng dậy vào tịnh phòng.* 3/7, theo an8.23:1.14 đã publish) · `4.5` (khổ, tập, diệt, đạo: 5/8) · `13.1` (*Lành thay, lành thay, này tỳ-kheo!* 13/20, 5/5 trong AN) · `13.4` (*Thứ nhất.* 134/134 trong AN).
    Khác có chủ ý: `4.3` (chỉ 1 cặp trùng, ở dn3:2.21.2 dịch *bố thí, giới hạnh, cõi trời;* — ở đây mở đầu `4.2` kết bằng *tức là:*, nên theo dn14 *pháp thoại về bố thí, pháp thoại về giới, pháp thoại về cõi trời;* và *nguy hiểm · hạ liệt · ô nhiễm · lợi ích của xuất ly*); `4.6` (8 cặp trùng, 4 biến thể không có đa số rõ: *khéo lãnh nhận thuốc nhuộm* 3, *nhuộm màu đều đặn* 2, *thấm màu nhuộm đúng cách* 1 …; chọn cách đọc dễ nhất nhưng vẫn giữ *vết đen* = `kāḷaka` và *đúng cách* = `sammadeva`); `4.8` (3 cặp trùng cùng nội dung *Bất cứ pháp nào có tính sinh khởi, tất cả đều có tính đoạn diệt*; tôi giữ nháy đơn `‘ ’` khớp Pāli, các bài kia đổi sang nháy kép); `6.1` (1 cặp trùng ở an8.24:1.14 có thêm *Nhưng* và người nghe là Đức Phật, ở đây không có cả hai).
    **Số Pāli (đã tự tính):** `aṭṭha` 8 ở 9 khoá (1.3, 3.1, 3.2, 3.4, 3.5, 11.1, 11.3, 13.2, 13.3); thứ tự `paṭhamo` 1 · `dutiyo` 2 · `tatiyo` 3 · `catuttho` 4 · `pañcamo` 5 · `chaṭṭho` 6 · `sattamo` 7 · `aṭṭhamo` 8 (3.11, 4.11, 5.10, 6.3, 7.3, 8.4, 9.7, 10.2 — đủ tám pháp, thứ tự liên tục); `catasso` 4 vợ (5.1); `pañcorambhāgiyāni` 5 hạ phần kiết sử (10.1); `brahmacariyapañcamāni` = giới thứ năm là phạm hạnh (4.10, 5.3).
    **Thuật ngữ.** `bhante` của gia chủ nói với tỳ-kheo → *thưa tôn giả* (toàn tầng: *thưa tôn giả* áp đảo *bạch thầy*; trong AN *bạch Thế Tôn/ngài* chủ yếu là lời nói với Đức Phật, nên không dùng làm tiền lệ cho người nghe là tỳ-kheo); `acchariyā abbhutā dhammā` → *pháp kỳ lạ, chưa từng có* (an8.23, an8.24, 0 tiền lệ khác); `dhāretha` → *hãy ghi nhớ* (an8.23); `byākato` → *tuyên bố* (an8.23) còn `byākaramāno/byākareyya` → *giải đáp* (người trả lời câu hỏi) — cùng một gốc `byākaroti`, chia hai nghĩa theo ngữ cảnh, nêu rõ ở đây; `payirupāsati` → *phụng sự* (53 cặp, trước *thân cận* 29, *đến gần* 9); `sakkaccaṁ/asakkaccaṁ` → *cẩn thận / thiếu cẩn thận* (an8.13 đã publish, 2/2); `ayyaputta` (vợ gọi chồng) → *thưa anh* (mn87:22.5), kèm `bhaginiyo` → *các em*, người chồng tự xưng *anh* khi nói với vợ; `komāriyo pajāpatiyo` → *người vợ trẻ* (nghĩa đen là những thiếu nữ khi lấy chồng; theo Sujato *teenage* và Thích Minh Châu *còn trẻ tuổi*); `itthannāma` → *tên như vầy* (mn99:19.4); `kallacitta muducitta vinīvaraṇacitta udaggacitta pasannacitta` → *sẵn sàng, mềm dẻo, không triền cái, phấn khởi, tịnh tín* (dn14, 3 cặp cùng cấu trúc `-citte`); `sāmukkaṁsikā dhammadesanā` → *bài thuyết pháp đặc biệt của chư Phật*; `pañcorambhāgiyāni saṁyojanāni` → *năm hạ phần kiết sử* (19 khoá, mn64 …); `appaṭivibhatta` → *không giữ riêng, mà chia sẻ* (dn16/dn34/mn48, 8 khoá cùng gốc *không dùng riêng mà chia sẻ*).
    **Bất định, ghi tại đây chứ không thêm vào thân kinh.** (1) `9.1` `Anacchariyaṁ kho pana maṁ … devatā upasaṅkamitvā ārocenti` — nghĩa đen *"việc chư thiên đến báo cho tôi không có gì lạ"*, nghe như mâu thuẫn với việc đây là một trong tám pháp kỳ lạ. Tôi giữ nghĩa đen (*không có gì lạ*, như Sujato *It's not unusual* và Thích Minh Châu *Thật không phải là vi diệu*) và để cái kỳ lạ nằm ở `9.5`–`9.7`: ông không khởi `unnati` (kiêu hãnh/phấn chấn quá mức) vì việc ấy. Cách đọc khác (`anacchariyaṁ` là trạng từ *"thường xuyên"*) không được tầng Anh hay Việt nào ủng hộ nên không chọn. (2) `9.5` `unnati` → *sự kiêu hãnh của tâm* (Sujato *getting too excited*, Thích Minh Châu *tự hào*); 0 tiền lệ trong tầng, nghĩa chính xác giữa *kiêu mạn* và *phấn chấn quá mức* còn có thể cân nhắc. (3) `5.5` `purisādhippāyo` dịch *có ý muốn theo một người đàn ông nào đó* (Sujato *would you prefer if I gave you to another man* diễn giải rộng hơn). (4) `5.8` `oṇojesiṁ` dịch *rưới nước làm lễ trao* (Sujato *presented … with the pouring of water*); `bhiṅgāra` → *bình nước nghi lễ* (dn26 cùng gốc `bhiṅkāra`). (5) `5.9` `pariccajanto` → *cho đi*: Pāli nói *từ bỏ/xả bỏ*, ngữ cảnh 5.8 là gả vợ theo ý nàng nên chọn *cho đi*. (6) `3.5` Pāli có dấu `,;` liền nhau (lỗi dấu câu của bản chụp) — dịch như một mệnh đề nối tiếp `3.6`. (7) `13.2` `Yathā taṁ … byākareyya` là cách nói điều kiện (*như người ấy khi giải đáp chân chính sẽ giải đáp*); dịch *sẽ giải đáp đúng như thế*.
    **Dấu nháy khớp Pāli từng khoá** (71/71 khoá, 0 lệch cho `“ ” ‘ ’`): nháy đơn lồng trong nháy kép ở `3.4`, `4.8`, `5.3`–`5.7`, `9.2`–`9.6`; không có `…pe…`, không có `(…)`. Không có cặp Pāli trùng nguyên văn trong chính bài mà bản Việt khác nhau (0/0 cặp). Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
