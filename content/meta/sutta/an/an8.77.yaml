notes: |-
  **Coverage tầng Anh đo được: 44/44 khoá Pāli có nội dung = 1,0000.** Công thức `src/lib/canon/reference.ts` (`substantivePaliMinChars = 40`, bỏ khối `:0`). `englishPath = sutta/an/an8/an8.77_translation-en-sujato.json` **có trong `source/upstream-manifest.json`** (tầng `english-sujato`, commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`), đã sync: 51 khoá / 50 khoá có chữ, `substantiveWithoutEnglish = 0`. Không có `english-project` cho uid này. Tầng `vietnamese-current` vắng tại commit đã ghim (26 tệp, toàn bộ Pháp Cú) ⇒ không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  **6/51 khoá trùng nguyên văn — dùng lại nguyên văn, không dịch lại** (đếm trên chỉ số 5.307 bài Việt đã dịch): `0.2` `8. Yamakavagga` → *8. Phẩm Song Trùng* (5×: an8.71/72/74/75/79) · `1.1` `Tatra kho āyasmā sāriputto bhikkhū āmantesi:` → *Tại đó, Tôn giả Sāriputta gọi các vị tỳ-kheo:* (10×) · `1.2` → *“Này các hiền giả tỳ-kheo!”* (2×: mn15, sn46.4, sn52.7) · `1.3` → *“Thưa hiền giả,” các vị ấy đáp.* (4×) · `1.4` `Āyasmā sāriputto etadavoca:` → *Tôn giả Sāriputta nói:* (15×) · `2.2` `Katame aṭṭha?` → *Thế nào là tám?* (12×). Khuôn `…puggalā santo saṁvijjamānā lokasmiṁ` → *…cá nhân này hiện hữu trong thế gian* theo an4.43:1.1 (31×) và `Ime kho, āvuso, …` → *Này các hiền giả, đây là…* theo an4.126:2.7 (30×).

  **`icchā` → *ham muốn*, đo riêng cho chính từ này chứ không đo chung.** Trong 36 cặp Pāli có `icchā` đã dịch: *ham muốn* **10×** (dn19:46.17 …), *ước muốn* 6× (mn141:19.2), *mong muốn* 3× (dn34:1.8.51). Con số *ham muốn* 575 khoá toàn tầng phần lớn đến từ `chanda`/`kāmacchanda` và câu kệ `Ettha, deva, chandaṁ pajaha…`, **không** phải `icchā` — nên đa số đúng cho `icchā` vẫn là *ham muốn*. **Ghi nhận lệch cần người điều phối phán:** tiêu đề `sn1.69:0.3` `Icchāsutta` hiện là *Kinh Ước Muốn*; tôi dùng *Kinh Ham Muốn* để khớp với thân bài. Nếu bảng tên chốt *Ước Muốn* thì cần sửa cả hai cùng lúc, nếu không bài này sẽ tự mâu thuẫn.

  **Thuật ngữ, kèm số đếm.** `uṭṭhahati, ghaṭati, vāyamati` → *nỗ lực, gắng sức, tinh tấn* (đúng 1 tiền lệ `an4.157:2.5`, cùng ba động từ và cùng dụng ý). `pavivitta` → *sống viễn ly* (8×, mn3:5–7; dn21:2.9.6 dùng *sống nơi xa vắng*). `majjati pamajjati pamādamāpajjati` → *mê say, tham đắm và buông lung*, phủ định → *không mê say, không tham đắm và không buông lung* (mn29:2.8 và 9× dạng phủ định ở mn29:3.7, 4.21, 4.43, 5.37). `socati kilamati paridevati, urattāḷiṁ kandati, sammohaṁ āpajjati` → *sầu não, mệt mỏi, than khóc, đấm ngực, và rơi vào hoang mang* (an4.184:3.6, 4×; phủ định theo an4.184:7.6). `saddhamma` → *chánh pháp* (150 khoá; *giới luật* 203 khoá là cách khác trong kho — với ngữ cảnh tỳ-kheo thì *giới luật* cũng đúng, nhưng Sujato dịch *true teaching* nên tôi theo *chánh pháp*). `lābha` → *của cải* (253 khoá; *vật chất* 85). **0 tiền lệ:** `nirāyattavutta` → *sống không lệ thuộc ai* (Sujato *living independently*); đây là từ cần người rà soát chú ý vì nó đi cặp với `pavivitta` mà hai từ lại dịch theo hai tiếng Việt khác nhau.

  **`Idha panāvuso` → *Tiếp nữa, này các hiền giả,*** (7 khoá: `3.1`–`9.1`). `Idha` thuần ở `2.3` dịch *Ở đây, này các hiền giả,*. `panāvuso` = "và nữa, các hiền giả", nên *Tiếp nữa* là dịch nghĩa chứ không phải thêm chữ; Sujato cũng dịch *Next*.

  **Văn phong:** bài này cấu trúc tám biến thể của cùng một đoạn, nên tám khối `2`–`9` dùng **cùng một bộ câu** — đó là đúng ý Pāli (đối xứng toàn phần), không phải điền bằng khuôn. Mỗi khối vẫn giữ đúng vế nào có `na` và vế nào không.

  **Dấu lược: Pāli 0 `…pe…` ↔ Việt 0 `…`** — bài này không lược gì. Nhặc kép: mở `“` ở `1.2`, `2.1`; đóng `”` ở `1.3`, `9.6`; tám câu định danh trong `2.7`–`9.5` dùng nháy đơn `‘…’` đúng như Pāli. Chốt `_hvi.py` sạch: 51/51 khoá, khoá thừa 0, NFC OK.
