notes: |-
  Chấm điểm, không dịch. Đối chiếu Pāli root đã ghim với bản Việt dự án và bản Anh Bhikkhu Sujato.
  Tầng Anh Sujato phủ đủ các segment có nội dung, trống các segment thứ tự :2.3 và toàn bộ kệ tóm lược uddāna :2.4 tới :3.4, chỗ đó Pāli tự đứng vững. Tầng Việt Thích Minh Châu vắng với AN ở commit đã ghim nên chỗ khó do Pāli quyết.
  Ghi nhận cho coordinator: simile sữa ở :2.1 gán dadhi thành bơ và navanīta thành bơ lỏng, Sujato là curds rồi butter, chuỗi tiến triển vẫn nguyên; kệ uddāna phủ đủ mười bài của phẩm; :2.4 Pāli ghi catuttho nhưng bản Việt theo số thứ tự của chính header 0.2 thành hết phẩm thứ mười chín, nhất quán với 0.2 của an5.180 là phẩm mười tám và an5.191 là phẩm hai mươi.
  Cổng kỹ thuật do coordinator chạy: npm run validate, npm test, npm run check, npm run build.
