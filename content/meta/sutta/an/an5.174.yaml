notes: |-
  Sửa lan 2026-10-14 (cơ học): khoá an5.174:2.3, an5.174:3.3, an5.174:8.1, an5.174:8.2, an5.174:9.5,
  an5.174:11.5 — bản Việt còn lẫn từ tiếng Anh hoặc từ ngoại không cần thiết (beer/wine, machete,
  teck, bael, myrobalan, kshatriya, yaksha, “Nanda’s mother”); đã thay bằng từ Việt hoặc dạng đã dùng
  ở toàn tầng (rượu men / rượu nấu / các chất say; rựa; gỗ tếch; beluva; āmalaka; Sát-đế-lợi; dạ-xoa;
  Nandamātā). Giữ nguyên phần còn lại của khoá.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 4.2 (cùng 4.1, 8.1, 8.2 quét trong
  bài) — «xả sự sát sinh» → «từ bỏ sát sinh» và «xả sự uống …» → «từ bỏ uống …» (paṭivirata là
  kiêng tránh, không phải «xả»; «Nơi người từ bỏ sát sinh» ở 3/3 khoá cùng Pāli của bản đa số),
  «được an tịnh như vậy» → «được lắng dịu như vậy» (vūpasanta). Giữ «nỗi sợ và mối thù» của 4.1
  thay cho «nỗi sợ hãi và oán thù» của bản đa số để 4.2 khớp 4.1 trong bài, và giữ «Với người»
  mở câu.
