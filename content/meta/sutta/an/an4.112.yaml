notes:
  - >-
    **Lượt cải thiện 2026-10-14 (đọc đối kháng cả bài, 12 khoá, đổi 6 khoá).** Tầng Anh Sujato có đủ cho bài này; không có bản Việt hiện hành (bilara tại commit đã ghim chỉ có Pháp Cú). Khoá đổi và lý do: `an4.112:1.1` và `1.4` — *ngựa chánh* → *con ngựa thuần chủng tốt* (tiền lệ cùng công thức `an6.5`–`an6.7`, 9 khoá; 24 khoá dùng *ngựa chánh* là cách dịch cũ chưa thống nhất, *chánh* dễ đọc thành "ngay chính" cho `bhadro`); *phù hợp làm vật sở hữu của vua* → *dùng cho vua* (`rājabhoggo` là thứ để vua dùng, không có ý sở hữu); *chi phần của vương quyền* → *chi phần của vua* (Pāli `rañño aṅga`, không có danh từ trừu tượng *vương quyền*; `an6.5`–`an6.7` dùng *của vua*); thêm hô ngữ *này các tỳ-kheo* bị bỏ sót ở `1.1`, `1.4`, `2.4` (Pāli `bhikkhave` ở cả ba). `an4.112:1.3` và `2.3` (Pāli trùng nguyên văn, hai bản Việt giống nhau) — *Chân thật* → *Ngay thẳng* cho `ajjava` (đo: 3 khoá `ja534`, `snp2.2`, `snp2.7` dịch *ngay thẳng*, 1 khoá `dn33` *thẳng thắn*; *chân thật* ứng với `sacca`, không phải `ajjava`); *hiền hòa* → *ôn hòa* cho `soraccena` (tiền lệ không có *hiền hòa* cho `soracca`; *ôn hòa* có ở `dn33`, `an6.43`, `thag15.2` và `dn33` cũng đặt cạnh *nhẫn nại*; *nhu hòa* có 6 khoá nhưng trùng với `maddava` ở `snp2.7`, `ja534` nên tránh); khoá kết thúc bằng gạch dài `—` ở Pāli nay giữ gạch dài (863/1.040 khoá tương tự trong Tăng Chi Bộ giữ), khoá sau bắt đầu chữ thường. `an4.112:2.1` — bỏ cụm *xứng đáng được chắp tay lễ kính* đặt sau dấu lược: Pāli chỉ có `…pe… anuttaraṁ puññakkhettaṁ lokassa`, `añjalikaraṇīya` thuộc phần bị lược; nay khớp `2.4`. Điểm đổi: `semantic_fidelity` 9.4 → 9.5, `terminology` 9.3 → 9.5, `technical_integrity` 10.0 → 9.6 (không chạy được các cổng máy trong lượt này). Các tiêu chí còn lại giữ nguyên vì không có cải thiện cụ thể tương ứng.
  - >-
    **Bất định còn lại, không phân xử được bằng căn cứ trong kho.** `java` dịch *nhanh nhẹn*, trong khi các khoá khác của tầng dịch `java` là *tốc độ* (`sn20.6`, `sn2.26`, `cnd23`) hoặc *sự mau chóng* (`an4.45`, `an4.46`); tên kinh *Sự Nhanh Chóng* cũng theo hướng này. Giữ vì ở đây `java` là phẩm chất của vị tỳ-kheo song hành với ngựa, không phải đại lượng đo được. `soracca` có hai cách đã ổn định trong tầng (*nhu hòa*, *ôn hòa*), không có căn cứ ép một dạng. Cách dịch `puññakkhettaṁ` (*phước điền* ở `an4.112`, `an4.114`, `an4.259`, `an4.260`; *ruộng phước*, *ruộng công đức* ở `an3.96`, `an5.203`, `an6.x`) chưa thống nhất trong tầng; không đổi ở bài này.
  - >-
    **Cổng máy.** Lượt này không chạy các lệnh của kho; cần chạy `npm run validate`, `npm test`, `npm run check` và `npm run build` trước khi coi technical gate đã đạt. Đã tự kiểm tập khoá khớp Pāli (12/12), nháy kép và nháy đơn khớp Pāli từng khoá, dấu lược `…` khớp số dấu lược Pāli (2/2), hai cặp Pāli trùng nguyên văn trong bài (`1.2`/`2.2`, `1.3`/`2.3`) có bản Việt giống nhau, chuỗi NFC, không khoá rỗng.
