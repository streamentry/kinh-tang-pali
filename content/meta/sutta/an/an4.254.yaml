notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.1, 3.1, 4.1, 5.1 — thêm lại ‘Và này các tỳ-kheo’
  (Pāli `Katame ca, bhikkhave, dhammā…` có `ca` và hô ngữ; bản cũ bỏ cả hai) và ‘thế nào là các
  pháp’ → ‘những pháp nào’ (`katame dhammā`, như `mn149:11.1–11`); giữ ‘nên được … trọn vẹn / từ
  bỏ / tu tập / chứng ngộ’ vì khớp 1.3–1.6 và các câu đáp 2.3, 3.3, 4.3, 5.3 cùng bài.
