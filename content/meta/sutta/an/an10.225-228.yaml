notes:
  - >-
    Bản tóm lược: nối bốn mức 10/20/30/40 bằng một dựng cảnh về cách tự giữ
    mình.
  - >-
    `yathābhataṁ nikkhitto evaṁ niraye` → "như vật đã được mang đến, bị đặt vào
    địa ngục" và `… evaṁ sagge` → "… được đặt vào cõi trời": dùng nguyên văn từ
    `an3.10:1.1` và `2.1` (50 và 85 segment tiền lệ). `samannāgato` → "đầy đủ"
    (574 segment).
  - >-
    `Samannāgato` ở đây **không kèm danh từ tường thuậc** (`… dhammehi
    samannāgato yathābhataṁ nikkhitto`), khác `an3.10:1.1` có `male appahāya`
    làm chủ ngữ. Dịch "kẻ đầy đủ mười pháp này thì…" — "kẻ" là cách Việt hóa chủ
    ngữ ẩn của dạng tính từ, không phải thêm ý.
  - >-
    `khataṁ upahataṁ attānaṁ pariharati` → "tự giữ lấy mình như đã bị phá hoại,
    bị tổn hại" và `akkhataṁ anupahataṁ …` → "tự giữ lấy mình nguyên vẹn, không
    tổn hại": nguyên văn từ `an3.150:1.1` và `2.1`.
  - >-
    **`1.6` là segment chỉ chứa `(…)`** — dấu soạn thảo báo chỗ bản thảo hỏng,
    nằm ngay trong bản Pāli đã ghim. Bài này vì vậy **mất câu kết** trong bản
    gốc, không phải trong bản dịch. Giữ nguyên `(…)` và ghi ở đây; không bịa câu
    kết.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
