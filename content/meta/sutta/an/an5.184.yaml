notes: |-
  Chấm điểm, không dịch. Pāli :1.3 dùng …pe… giữa công thức, bản Việt mở rộng theo công thức đủ ở an5.181 với dấu … đánh dấu chỗ lược, cùng cách Sujato làm.
  Tầng Anh Sujato phủ :1.1 tới :1.4 dạng rút gọn, trống :1.5 là thứ tự Catutthaṁ. Tầng Việt Thích Minh Châu vắng với AN ở commit đã ghim nên chỗ khó do Pāli quyết.
  Ghi nhận cho coordinator: khi mở rộng, động cơ thứ tư rớt cụm và đệ tử Phật so với bản đủ ở an5.181 và an5.190; sosānika thành trú bãi tha ma theo đúng truyền thống Việt; idamatthatā thành tánh không cầu ngoại duyên là cách diễn giải mới, 0 tiền lệ trong kho.
  Cổng kỹ thuật do coordinator chạy: npm run validate, npm test, npm run check, npm run build.

  Coordinator (gather): bổ sung «và đệ tử Phật» theo Pāli cùng công thức an5.181:1.3 (vaṇṇitaṁ buddhehi buddhasāvakehī); bản ghim Sujato cũng rớt cụm này.
