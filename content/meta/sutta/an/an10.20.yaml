notes:
  - >-
    **Bài giảng nghĩa cho `an10.19`**: cùng danh sách, rồi mỗi mục một câu hỏi
    và một câu định nghĩa — mười mục, mười vòng. Cuối bài chốt lại bằng **quá
    khứ – tương lai – hiện tại**.
  - >-
    **`Nāthavagga` → *Phẩm Bảo Hộ*** (0 segment tiền lệ, đặt mới): `nātha` là
    người bảo hộ, chỗ nương tựa — và Sujato dịch tên phẩm là *A Protector*. Cả
    phẩm đúng ngữ nghĩa đó: `nāthakaraṇā dhammā` → *mười pháp làm nên sự bảo
    hộ*, `sanāthā … mā anāthā` → *hãy sống có chỗ bảo hộ, đừng sống không chỗ
    bảo hộ*, `anātho viharati` → *sống không chỗ bảo hộ là khổ đau*. Vì ba cụm
    này lặp ở `an10.17` và `an10.18`, tôi dùng **cùng một cách** cho cả ba bài;
    `an10.19`–`an10.20` dùng `ariyāvāsā` → *chỗ ở của bậc Thánh* (cũng 0 tiền
    lệ), đối xứng với `senāsana` → *chỗ ở*.
  - >-
    **`6.2` dùng bốn động từ có tiền lệ, còn `saṅkhāyekaṁ` thì không** (0
    segment, đặt mới): `adhivāseti` → *chịu đựng* theo `an4.11:1.2` (*chịu đựng
    nó*), `parivajjeti` → *từ bỏ* theo `dhp256-272:1` (*Từ bỏ các điều ác*),
    `vinodeti` → *loại bỏ* (theo `an3.101:2.1` *bị diệt trừ*). Bản đầu tôi dịch
    `paṭisevati` là *nương tựa* và lặp *suy nghĩ tức thì thì* bốn lần — vừa vô
    nghĩa vừa lặp vụng; đã sửa thành *suy nghĩ một cách thì tiếp nhận, suy nghĩ
    một cách thì chịu đựng, suy nghĩ một cách thì từ bỏ, suy nghĩ một cách thì
    loại bỏ*.
    **Sửa thêm ở `4.2` và `4.7`:** bản đầu dịch `upekkhako viharati` thành *giữ
    sự bình thản … sống trong sự bình thản* — **lặp chữ *bình thản* hai lần
    trong một câu**; đã sửa thành *không vui không buồn, sống trong sự bình
    thản, có niệm, biết tỉnh*.
  - >-
    **`7.3` dùng nguyên văn `an4.38:1.4`** (cùng Pāli, đã `published`) cho mười
    kiến chấp sai lầm, và `7.4` dùng nguyên văn `an4.38:1.5` cho dãy phép từ bảy
    động từ — *đã vứt bỏ, đã đoạn trừ, đã quăng đi, đã từ khước, đã buông xả, đã
    từ bỏ, đã xả ly* (Pāli bảy động từ: `nuṇṇāni panuṇṇāni cattāni vantāni
    muttāni pahīnāni paṭinissaṭṭhāni`).
  - >-
    **`8.2` dùng nguyên văn `an4.38:2.2`** (cùng Pāli) — *sự tìm kiếm dục… sự
    tìm kiếm hữu… sự tìm kiếm Phạm hạnh đã được lắng dịu*; chữ *lắng dịu* cho
    `paṭippassaddhā` là của bài đó, giữ nguyên để cùng Pāli đọc giống nhau.
    **`12.2` dùng nguyên văn `an4.38:4.2`** cho *bị chặt tận gốc, như gốc cây
    duối, bị hủy hoại không còn, là pháp không tái sanh trong tương lai*; `10.2`
    → *tứ thiền, không khổ không lạc, xả niệm thanh sạch* (cũng theo khuôn
    `an3.101:2.x` của corpus).
  - >-
    **Địa danh: `Kuru` → *Câu-tát-la*, `Kammāsadamma` → *Công-đức-pháp*** — cả
    hai **0 segment tiền lệ**, đặt mới; `Kammāsadamma` là **tên riêng của ngôi
    làng**, nên `kurūnaṁ nigamo` chỉ cần *làng* chứ không phải *làng Câu-tát-
    la*. Bản đầu tôi ghép sai thành *làng Câu-tát-la-bộ-la, gọi là Công-đức-
    pháp* — đã sửa.
    **`an10.20:14.0`–`14.4` là `Tassuddāna`**, dịch theo 48 segment tiền lệ
    (*Tóm lược:*), và **điểm danh đúng mười bài** của phẩm theo thứ tự: *Chỗ ở
    và Năm Phần, / Kết Trói Buộc và Tâm Cứng; / Không Phóng Dật, Đáng Cúng
    Dường, / Hai Bảo Hộ, Hai Chỗ Ở Của Bậc Thánh.* `Akkosavaggo pañcamo` → *Phẩm
    Bảo Hộ, thứ hai.*
  - >-
