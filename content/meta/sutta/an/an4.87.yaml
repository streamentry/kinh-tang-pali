  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá 6.4 (và 5.5 cùng Pāli) — bỏ *không đáng yêu* thêm vào *Những cảm thụ* (`yāni vedayitāni pittasamuṭṭhānāni…` chỉ nói các cảm thọ do mật, đàm, gió… khởi lên); *cảm thụ* → *cảm thọ* (theo `an5.104`). Giữ nguyên khoá 5.3 và 6.5 vì bản hiện tại đúng Pāli và khớp tiền lệ cùng công thức ở `an4.35`.
