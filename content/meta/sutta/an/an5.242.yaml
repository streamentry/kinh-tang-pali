notes:
  - >-
    **Hai mươi bốn lỗi chấm câu của Pāli: mở dấu `“` rồi không đóng.** Đếm được
    14 bài: `an5.242`, `an5.243`, `an5.246`, `an5.247`, `an7.86`, `an9.48`,
    `an9.50`, `an9.53`, `an5.55`… nói rõ là `an9.55`, `an9.56`, `an9.57`,
    `an9.58`, `an9.59`, `an9.60`. Ở mỗi bài, `1.1` mở `“` và không segment nào
    đóng lại (độ sâu kép cuối = 1). Tôi đóng ngay sau mệnh đề cuối của `1.1` để
    người đọc không gặp dấu ngoặc treo, và **đây là cố ý lệch 14 segment** — bộ
    kiểm tra báo đúng mười bốy chỗ ấy, không phải sót sót. Pāli không bị sửa.
  - >-
    **Bốn bài cùng một khuôn, chỉ đổi `kāya`↔`vacī` và số thứ tự.**
    `kāyaduccarita` → *ác hạnh của thân* theo nguyên văn `an3.101:2.1` (đã
    `published`), `kāyasucarita` → *tịn hạnh của thân* theo nguyên văn
    `an3.17:2.3` (*Tịn hạnh của thân, tịn hạnh của khẩu, tịn hạnh của ý*). ⚠
    Dùng **khẩu** chứ không phải **lời** như ở chương 21: đó là nguyên văn của
    đúng cụm `vacīsucarita`, còn `vācā` ở chương 21 là từ khác. Cả năm điều và
    toàn bộ lợi ích đều bị `…pe…` lược, nên tôi chỉ dịch phần còn lại và
    **không** bịa danh sách.
