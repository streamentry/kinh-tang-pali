notes:
  - >-
    **⚠ SỬA LỖI: tên phẩm `Vajjisattakavagga` không nói về người cư sĩ.** Bản
    đầu tôi dịch là *Phẩm Bảy Điều Lách Của Người Cư Sĩ* — tức lấy chủ đề của
    bài `an7.30` để đặt tên phẩm. Nhưng `Vajjisattaka` là **bộ tộc Vát-ji**
    (liên minh Vát-ji mà Đức Phật đã gặp ở `an7.52`–`an7.55`, cùng phẩm này). Đã
    sửa thành *3. Phẩm Bảy Điều Lách Của Bộ Tộc Vát-ji* — **0 tiền lệ, đặt
    mới**, và đã ghi lại đây.
  - >-
    `Vipattisutta` → *Kinh Sự Thất Nghiệp* theo nguyên văn `an3.117:1.1` (đã
    `published`). `sampadā` → *thành tựu* theo quyết định chung của kho cho
    `sampadā` (PR #116).
  - >-
    `puggala` → *hạng người* · `āhuneyya` → *đáng cúng dường* · `anuttaraṁ
    puññakkhettaṁ lokassa` → *ruộng công đức vô thượng của thế gian*
    (`puññakkhetta` có 40 segment tiền lệ) · `sugati` → *cõi lành* (0 tiền lệ) ·
    `sagga` → *cõi trời* (tiền lệ) · `mātugāma` → *thân người*.
  - >-
    `anissukī` → *không thèm mình* (0 tiền lệ) · `hiri`/`ottappī` → *biết hổ
    thẹn / biết sợ hối* (chương 8 chỉ có dạng phủ định *thiếu hổ thẹn* / *thiếu
    kính sợ*, nên dạng khẳng định ở đây là 0 tiền lệ) · `Issariyabala` → *sức
    mạnh của bậc chúa tể* (tiền lệ chương 8) · `abhibhuyya` → *thắng trộn*.
  - >-
    **Hai bài này không mở dấu nháy kép** trong Pāli (`an7.17:1.1` và
    `an7.30:1.1` đều vô nháy) — giữ nguyên, không tự thêm.
  - >-
    **Dùng lại nguyên văn đã `published`:** dây chuyền chánh tám pháp — *chánh
    kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn,
    chánh niệm, chánh định, chánh trí, chánh giải thoát* (`an10.103:2.3`) · năm
    căn *Tín căn, tinh tấn căn, niệm căn, định căn* (`an4.151:1.3`) · `Idha,
    bhikkhave, X viharati` → *Ở đây, này các tỳ-kheo, có X sống…*
    (`an3.116:1.3`) · `Ayaṁ vuccati, bhikkhave, X` → *Đây, này các tỳ-kheo, được
    gọi là X* (`an3.117:1.6`) · `vipatti` → *sự thất nghiệp* (`an3.117:1.1`) ·
    `sīlasampadā` → *thành tựu về giới* (`an3.117:5.1`) · `sagga` → *cõi trời* ·
    `tiracchānayoni` → *cõi địa ngục sinh ra từ sự tiếp xúc* và `pettivisaya` →
    *cõi thân thuộc* (PR #117) · `savitakka`/`savicāra` → *tán chương và cân
    nhắc* (`sn40.11:7.1`) · `Issariyabala` → *sức mạnh của bậc chúa tể* (chương
    8) · `tāyati` → *làm hại* (`an10.73`) · `bhaṇanti` → *hạng người*
    (`sn11.24:2.1`) · `asubha` → *bất thiện* (`an10.59:1.3`) · `Sāvatthinidānaṁ`
    → *Tại Sāvatthī.* (`an4.51:1.1`) · `anabhiratasaññā` → *niệm tưởng không ham
    muốn trong tất cả thế gian* (`an10.238`).
  - >-
    **Quy tắc dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
