notes:
  - >-
    Giải quyết draft 2026-10-12: blocker cũ "cắt ngắm tại an4.62:4.3" là lỗi tồn
    đọng, không còn đúng với văn bản hiện hành. Khoá 4.3 ở bản Việt không có dấu
    lược `…` nào (toàn bài 0 dấu `…`; Pāli 4.3 cũng không có), và nội dung Pāli
    của 4.3 (đủ năm vế định ngữ của tài sản + "puññāni ca karomī") đã được dịch
    đủ. Đã gỡ blocker.
  - >-
    Đọc đối kháng 33 khoá với Pāli root và bản Anh Sujato đã ghim (phủ 32/33
    khoá có nội dung, chỉ `:8.5` "Dutiyaṁ" trống, không phải đoạn có nội dung
    nên không có gap). Sửa 9 khoá. Lỗi nghĩa thật ở 3.2, 3.3, 4.2, 4.3: "bị mồ
    hôi chảy ròng" (đảo chiều thụ động, sai `sedāvakkhittā` = mồ hôi đổ ra) và
    "được tạo bởi sức tay", "được đạt theo pháp, được đạt bằng pháp" nay thành
    "do nỗ lực tinh cần mà đạt được, do sức mạnh đôi tay mà tích lũy, do mồ hôi
    đổ ra mà có, hợp pháp, có được đúng pháp", khớp công thức đã dùng ở
    an8.54:3.2, an8.55:4.2, an8.76:2.2 (hợp pháp, có được đúng pháp). Vế "tài
    sản" ở 4.2/4.3 là tân ngữ của "sử dụng" (bhogehi ... paribhuñjati) nên viết
    "sử dụng những tài sản …". 3.3/4.3/5.3/6.3: "suy niệm" (động từ không có
    trong Pāli, chỉ có `ti) đổi thành "nghĩ", trung tính hơn. 5.2/5.3: "kassaci
    kiñci" = "bất cứ ai bất cứ điều gì". 7.2: "atho atthisukhaṁ paraṁ" — "ở
    trên" dễ hiểu thành thứ bậc cao hơn nên đổi thành "và thêm hạnh phúc có tài
    sản" (paraṁ = thêm/tiếp theo; Sujato "extra"). 8.2: "ubho bhoge" là "cả hai
    thứ thọ hưởng", không viết "cả hai hạnh phúc" vì Pāli là `bhoge`, không phải
    `sukhaṁ`. 8.3: "etaṁ" trung tính = "điều ấy" thay "hạnh phúc kia".
  - >-
    Giữ nguyên theo quy ước tầng đã đo: "Và nào là …?" (153 khoá), "Được ngồi ở
    một bên" (công thức đi cùng an4.60/61), "Cái này … được gọi là" (97 khoá),
    "người phàm" cho `macco` (cùng an4.61:20.1), "hạnh phúc" cho `sukha`, "tùy
    theo lúc và hoàn cảnh" cho `kālena kālaṁ samayena samayaṁ upādāya`. Số đếm
    là số dòng khoá trong tầng `vi/project/sutta/an`.
  - >-
    Bất định còn lại: (1) `ubho bhoge` ở 8.2 có thể là "cả hai thứ tài sản/thọ
    hưởng" hoặc hiểu qua chú giải là hai thứ hạnh phúc `atthisukha` +
    `bhogasukha`; bản Việt giữ nghĩa trung tính "thứ thọ hưởng", Sujato dịch
    "both kinds of happiness". (2) `atthisukhaṁ paraṁ` ở 7.2: paraṁ có thể là
    "thêm / kế tiếp" (chọn) hoặc "cao hơn". Không blocker vì cả hai cách đọc đều
    không làm đổi giáo nghĩa của câu kệ (hạnh phúc không có lỗi hơn hẳn các thứ
    kia).
  - >-
    Tầng Việt hiện hành: bilara tại commit ghim chỉ có Pháp Cú, nên không có bản
    Việt tham chiếu phân đoạn cho bài này; bản Hòa thượng Thích Minh Châu nguyên
    bài (mục Tra cứu toàn văn) chỉ dùng để hiểu cách đọc, không chép câu chữ.
    Triangulation 9.0 vì có Sujato phủ đủ và một bản Việt nguyên bài. Cổng kỹ
    thuật (`npm run validate` · `npm test` · `npm run check` · `npm run build`)
    chưa chạy trong lượt này, nên `technical_integrity` đặt 9.6.
