notes:
  - >-
    **ĐO LẠI MỆNH ĐỀ `0.1`, cả hai số.** Toàn bộ 1255 tệp `an` có `:0.1`: **898** viết *Kinh Tăng Chi Bộ* và **357** viết `Aṅguttara Nikāya`. **Riêng quyển 6 nghiêng ngược: 84 `Aṅguttara Nikāya` vs 12 *Kinh Tăng Chi Bộ*** (96 tệp có `:0.1`). Lát này theo đa số CỤC BỘ của quyển 6, tức `Aṅguttara Nikāya 6.20`. Lưu ý bài anh em cùng lát (`an6.27`, `an6.28`) cũng theo đa số quyển 6.
  - >-
    **`0.2` `Sāraṇīyavagga` → *2. Phẩm Hòa Kính*** (3/3 trong an6); ngay bên cạnh, `Anuttariyavagga` → *3. Phẩm Vượt Trội* (5/5 trong an6, ví dụ `an6.21:0.2`).
  - >-
    **`0.3` đặt mới, có lý do.** `an6.19` (Maraṇassati thứ nhất) **chưa được dịch**, nên không có tiền lệ cho `maraṇassati` trong tầng Việt. Chọn *tỉnh thức về sự chết* — đây là cách gọi đã thành thông dụng trong truyền thống Việt, và khớp cấu tạo `-assati` mà `mn118` dịch cho `ānāpānassati` là *niệm hơi thỏ*. Dạng ngoặc *(Hai)* có tiền lệ ở an6 (*Kinh Đáng Nhớ (Hai)*, *Kinh Địa Ngục (Hai)*, *Kinh Chỗ Không Thể Ở (Hai)*).
  - >-
    **Coverage tầng Anh 30/30 = 1,000, KHÔNG dùng bản lấp của dự án.** Sujato để trống 7 khoá (`an6.20:8.2`, `:8.3`, `:9.0`–`:9.4`) nhưng tất cả đều là Pāli ngắn (số thứ tự và khối `Tassuddānaṁ`), không tính vào Pāli có nội dung.
  - >-
    **Bài song song cùng công thức: `mn151` (Sīlavat).** `paccavekkhamāno evaṁ jānāti` → *khi suy xét biết như vậy* (`mn151:3.4`, `:13.3`…); `teneva pītipāmojjena vihātabbaṁ ahorattānusikkhinā kusalesu dhammesu` → *nên trú với hỷ và hoan lạc ấy, ngày đêm học tập trong các thiện pháp* (`mn151:13.6`). `mn118` (Ānapānasati) cho `bhāvitā bahulīkatā mahapphalā hoti mahānisaṁsā` → *được tu tập, được làm cho sung mãn, thành quả lớn, lợi ích lớn*.
  - >-
    **Thuật ngữ, có số đếm.** `semha` → *đàm* (an=74 mn=103) · `antarāyo` → *chướng ngại* (sn=88 an=20) · `pāpakā akusalā dhammā` → *pháp bất thiện* (an=148, hơn *điều bất thiện* 59) · `vāyāma` → *nỗ lực* (an=232) · `ussāha` → *tinh tấn* (an=357) · `ussoḷhī` → *bền bỉ* (an=40) · `appaṭivānī` → *không phóng dật* (an=73) · `sati` → *có niệm* và `sampajañña` → *tỉnh giác* (glossary). `Tassuddānaṁ` → *Tóm lược:* (5/5 tệp an6 có khối này: an6.74/.84/.95/.106/.116).
  - >-
    **0 tiền lệ, đặt mới, đã nói rõ.** (a) `amatogadhā amatapariyosānā` → *lấy quả vị vô tử làm mục đích, lấy quả vị vô tử làm điểm tối thượng*; **không tệp nào trong kho dịch cụm này**. `gādhā` bám theo `mn118:9.1` (*đã đạt mục đích tối thượng*), `pariyosānā` dịch *điểm tối thượng*. (b) `satthakā vātā` → *những cơn gió như lưỡi lúa* — 0 tiền lệ, dịch theo nghĩa (gió cắt như lưỡi lúa). (c) Danh sách tên bài ở `:9.1`–`:9.4` (*Sāraṇī, Nisāraṇīya, Bhaddaka, Anutappiya, Nakula, Soppamaccha, Maraṇassati*) **giữ nguyên Pāli** như khuôn của `cp` và `ja`; tiền lệ ngược là `an6.74:3.1` dịch *Bất lai, A-la-hán, bạn* — nhưng đó là các từ Phật học thông dụng, còn đây là tên riêng của từng bài kinh.
  - >-
    **Sửa sau review đối kháng.** `:3.3` và `:6.3` `Seyyathāpi` là *Giả sử* (bản nháp đầu viết *Ví dụ như*); `:2.5`/`:5.5` `kuppeyya` dịch *rối loạn* theo nghĩa *disturbance* của bản Anh đã ghim, thay cho *tràn chảy* ở bản nháp.
