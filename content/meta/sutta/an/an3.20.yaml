notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 6.2 — `āgatāgamā` “thọ trì những gì đã được nghe” → “tinh thông truyền thống” (bản trước chồng nghĩa lên `bahussutā` “đa văn”; theo `an6.51:3.4`); `kālena kālaṁ` “từ thời giờ này đến thời giờ kia” → “thỉnh thoảng” (`an8.2:2.1`, `an11.17:22.2`); `paripucchati paripañhati` “hỏi họ” → “hỏi han, chất vấn” (hai động từ); `vinayadharā` “trì giới luật” → “trì luật”; `mātikādharā` “trì bản mẫu” → “trì mẫu đề” (`an6.51:3.4`, `mil6.4.1:63.1`).
