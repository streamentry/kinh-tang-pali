notes:
  - >-
    **Bài dài nhất chương (56 segment) nhưng chỉ có hai ý**, lặp ngược chiều:
    *chưa đoạn bỏ* (mục 1–5) rồi *đã đoạn bỏ trọn vẹn* (mục 6–14), mỗi ý gồm
    **năm tâm cứng lòng** và **năm sự trói buộc của tâm**. Bốn mục 5 và 12 mở
    bằng ẩn dụ **trăng tuần hạ / trăng tuần vọng** — âm cảnh của cùng một ý.
  - >-
    **Hai thuật ngữ trụ cột đều 0 segment tiền lệ, đặt mới**: `cetokhila` → *tâm
    cứng lòng* (`ceto` = tâm, `khila` = cứng, rời rạc) và `cetasovinibandha` →
    *sự trói buộc của tâm* (`vibandha` là *trói buộc* — cùng gốc với *saṁyojana*
    mà `an10.13` dịch *kết trói buộc*, nên hai bài dùng chung một từ). `ṭhāna` →
    *chỗ*, `pāṭikaṅkhā` → *trông chờ* (theo `an10.43` và chương 1),
    `hāni`/`vuddhi` → *suy giảm*/*tiến triện*.
  - >-
    **`ānattamano āhatacitto khilajāto` → *buồn bực, tâm bị thương tổn, sinh
    lòng cứng lòng*** (0 segment, đặt mới): ba danh từ Pāli phải ra ba tiếng
    Việt khác nhau, vì cả ba là bối cảnh của `khilajāto` chứ không phải cách nói
    lại cùng một thứ. `yāvaṁdatthaṁ udarāvadehakaṁ bhuñjitvā` → *ăn no đến mức
    căn bụng mãn no*; `pasāne bhiñjamānassa` không có ở đây nên không cần dịch.
  - >-
    **Dải ẩn dụ ở `7.1` và `14.1` dịch theo phép chia chủ ngữ của Pāli**:
    `hāyateva … hāyati … vaḍḍhateva` là **mọi vế đều** giảm/thêm, nên tôi đặt
    chủ ngữ chung ở cuối — *sắc đẹp, sự tròn tròn, ánh sáng, đường kính và chu
    vi của vị ấy đều chỉ khuyết đi / đều chỉ đầy thêm* — thay vì lặp *khuyết đi*
    năm lần. Đây là bản dịch đã sửa trong lượt review; bản đầu viết *vị ấy vẫn
    khuyết đi… vị ấy vẫn đầy thêm…*.
  - >-
    **Sửa trong lượt review, đáng ghi vì là mẫu lỗi ngữ pháp:** bản đầu ghép
    hằng số `NAMATI` (kết bằng dấu chấm) rồi nối *thì*, ra *“…nỗ lực tu tập**.**
    thì đây là…”* ở **tám segment** (`2.4`, `3.6`, `4.4`, `5.6`, `9.4`, `10.6`,
    `11.4`, `12.6`) — chấm đầu câu giữa vế. Đã bỏ dấu chấm khỏi hằng số và nối
    bằng dấu phẩy. Cùng lúc sửa *Vị ấy có tâm **có** hướng về…* thành *Vị ấy có
    tâm hướng về…*.
  - >-
    **`…pe…` ở `12.5` chỉ lược phần giữa, đuôi còn nguyên** (`devaññataro
    vāti`), nên tôi dịch *… hay một vị trời khác* chứ không mở rộng. Bản đầu lặp
    lại cả hai vế *ta sẽ thành một vị trời, hay một vị trời khác* — sai. `deva`
    cũng được giữ là *vị trời* (chứ không phải *thiên đế*) vì cụm `devaññataro`
    chỉ *một vị trời khác*.
