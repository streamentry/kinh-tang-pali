notes:
  - >-
    Mười bài `an10.135–144` dùng **cùng một khuôn Pāli** như chương 15 và chương
    19, chỉ thay danh từ X, nên toàn bộ cách diễn đạt của khuôn dùng lại nguyên
    văn từ hai chương đó: `katamo ca, bhikkhave, …?` → "Và thế nào, này các tỳ-
    kheo, …?" · `ayaṁ vuccati, bhikkhave, …` → "Điều này được gọi là, này các
    tỳ-kheo, …" · `Micchādiṭṭhi …pe… micchāvimutti—` → "Tà kiến … tà giải
    thoát—".
  - >-
    **Bốn bài đầu không có `dhammaṁ`, sáu bài sau có** (`Ariyadhammañca vo,
    bhikkhave, desessāmi …` so với `… dhammaṁ desessāmi …`). Tiếng Việt không có
    mạo từ tương ứng nên hai dạng dịch giống nhau; ghi ở đây để người sau biết
    đó là do Pāli.
  - >-
    `idaṁ vuccati` ở `an10.134` và `an10.136` dịch **"Điều này được gọi là, này
    các tỳ-kheo, …"** — cùng cách với `ayaṁ vuccati` chủ đạo trong corpus (40
    segment, so với 9 segment của `idaṁ vuccati` chưa có cách chủ đạo nào). Hai
    từ Pāli này cùng nghĩa "điều này", nên một cách dịch cho cả hai giữ chương
    nhất quán.
  - >-
    **`an10.136` đổi cả giới danh từ:** Pāli ở đây dùng `katamañca` và `idaṁ
    vuccati` (trung tính, khớp `akusalaṁ`), trong khi mười bài khuôn dùng
    `katamo ca` và `ayaṁ vuccati` (nam tính). Bản dịch theo đúng giới từng bài;
    tiếng Việt không chia giới nên chỉ thể hiện qua việc có "điều" hay không.
  - >-
    `akusalaṁ` → "điều bất thiện", `kusalaṁ` → "điều thiện" (108 và 218 segment
    tiền lệ).
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
