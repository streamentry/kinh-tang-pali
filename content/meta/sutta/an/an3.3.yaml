notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.1 và 2.1 (cùng 1.8, 2.8 trong bài) — *ba dấu hiệu, ba biểu tượng và ba kết quả hiển lộ* → *ba đặc tướng, dấu hiệu và hành trạng* (`lakkhaṇa` / `nimitta` / `apadāna`; *kết quả hiển lộ* không có căn cứ ở `apadāna`; khớp `ne37:399.1`–`399.4`, `mn129:2.1`). Giữ nguyên các khoá 1.3, 1.6, 2.3, 2.6 (*suy niệm điều xấu / điều tốt*, *bậc trí* — đúng `duccintitacintī` / `sucintitacintī`, đồng nhất cả bài và khớp tên kinh; `mn129` dùng *người hiền* cho `paṇḍita` là lựa chọn riêng của bài đó).
