notes: |-
  **Một blocker, bài phải ở `draft`.** Đã tra tiền lệ trước khi chấm và phát hiện lỗi này là **có sẵn trong tầng**, không phải do lô này.
  
  **Về `blocking_errors`.** Cụm *Bộ Mười Một Bài Kinh Đầu Tiên* xuất hiện y hệt ở `an11.358-405:0.2` và `an11.502-981:0.2` — tức đã có 3 tệp trong repo mang cách dịch sai này, trong khi 9 tệp khác (`an11.30-69`, `.70-117`, `.118-165`, `.166-213`, `.214-261`, `.262-309`, `.982`) dùng *Nhóm Năm Mươi Đầu*. Đây là **lý do tôi ghi nó là blocker chứ không hạ điểm nhẹ**: số tệp sai đã tăng lên 3, và sửa một tệp sẽ tạo ra thêm một biến thể. Đây là việc cần quyết định toàn corpus rồi sửa cả 12 tệp cùng lúc, không phải việc sửa lẻ ở đây. Tôi **không sửa** tệp dịch nào theo phạm vi công việc đã giao.
  
  **Lỗi phụ ở `0.1` (không chặn).** `Aṅguttara Nikāya 11` bị bỏ khoảng số: bản dịch ghi *Aṅguttara Nikāya 11* trong khi mọi lát gộp khác trong `an11` đều ghi kèm khoảng (*Aṅguttara Nikāya 11.30–69*, *11.70–117*, …). Người đọc mất thông tin lát này là nhóm 406–453. Đếm toàn corpus: 28 tệp gộp có khoảng, 24 tệp không — nên đây là quy ước chưa thống nhất toàn repo, và trong `an11` thì thống nhất là **có** khoảng. Tôi trừ ở `semantic_fidelity` và `vietnamese_clarity`.
  
  **Phần thân thì sạch — 6 khoá `1.2`–`1.7` đều đúng.** Đây là lát lục: `Rūpavitakke… / saddavitakke… / gandhavitakke… / rasavitakke… / phoṭṭhabbavitakke… / dhammavitakke…`. Bản dịch dùng một công thức thống nhất — *Tầm về sắc / âm thanh / mùi / vị / xúc chạm / pháp* — và giữ nguyên dấu lược `…` ở từng khoá theo Pāli. Đây là chỗ dễ bị làm mất cấu trúc lặp, và bản dịch giữ được. `vitakka` → *Tầm về* là dịch nghĩa (thức tưởng lan tỏa về sự vật) chứ không phải *suy nghĩ*, và Sujato xác nhận (*thoughts about sights…*).
  
  **`0.3` `Sāmaññavagga` → *Phẩm Sa-môn*** ✓ trùng nguyên văn `an11.30-69` và toàn bộ các lát `an11` cùng phẩm. `0.4` `~` giữ nguyên là `~` ✓ đúng — biểu tắc `~` là ký hiệu bilara nghĩa là không có tiêu đề, và dịch nó thành chữ có thể làm nghĩa sai.
  
  **Tầng Anh** có mặt và lạp đúng cả 6 khoá thân, không chỗ nào trống.
  
