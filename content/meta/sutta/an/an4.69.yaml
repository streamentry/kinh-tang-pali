notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an4.69:2.2, an4.69:3.2, an4.69:4.1; sửa lan 1.5, 4.2
  (cùng công thức) và 1.4, 2.1, 3.1 (cùng khuôn `Katamañca`) — cụm “phát khởi ý nguyện, nỗ lực, tinh
  tấn, dõng mãnh, quyến mũ tâm” (“quyến mũ” không phải từ tiếng Việt và không ứng với `cittaṁ
  paggaṇhāti`) → công thức Chánh tinh tấn đã dùng ở sn43.12, sn51.13, ne5: “khởi ý muốn, cố gắng,
  phát khởi tinh tấn, nâng đỡ tâm, nỗ lực”; “sanh” → “sinh” theo tầng; “Và nào là …” → “Và thế nào
  là …, này các tỳ-kheo?”. Pāli không đổi cấu trúc: `pahānāya` → “để đoạn trừ”, `ṭhitiyā asammosāya
  …` → “duy trì, không mất đi, tăng trưởng, mở rộng, được tu tập và viên mãn” (như sn43.12:6.11).
