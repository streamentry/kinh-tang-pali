  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá 7.2, 11.2 — «noi theo tà kiến ấy» / «noi theo kiến giải ấy» → «noi theo tấm gương ấy» (diṭṭhānugatiṁ āpajjati: 6 khoá toàn tầng trùng Pāli, 4 khoá dùng «gương»; «tà kiến» thêm sắc thái xấu mà Pāli không nói, và hai khoá của chính bài này vốn khác nhau); giữ nguyên khoá 4.5, 5.2, 6.3, 7.4, 8.5, 9.2, 10.3, 11.4 — bản đa số bỏ hô ngữ «này các tỳ-kheo» (bhikkhave) và dịch sammosāya là «phai nhợt», trong khi bản hiện tại giữ đủ hô ngữ và dùng «suy tàn» nhất quán với 4.1, 4.5 và 8.1.
