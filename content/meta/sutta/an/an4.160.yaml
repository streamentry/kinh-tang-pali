notes:
  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá 7.2, 11.2 — «noi theo tà kiến ấy» / «noi theo kiến giải ấy» → «noi theo tấm gương ấy» (diṭṭhānugatiṁ āpajjati: 6 khoá toàn tầng trùng Pāli, 4 khoá dùng «gương»; «tà kiến» thêm sắc thái xấu mà Pāli không nói, và hai khoá của chính bài này vốn khác nhau); giữ nguyên khoá 4.5, 5.2, 6.3, 7.4, 8.5, 9.2, 10.3, 11.4 — bản đa số bỏ hô ngữ «này các tỳ-kheo» (bhikkhave) và dịch sammosāya là «phai nhợt», trong khi bản hiện tại giữ đủ hô ngữ và dùng «suy tàn» nhất quán với 4.1, 4.5 và 8.1.
  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14 (lượt hai): khoá 4.3, 4.4, 8.3, 8.4 — «các chữ
    nghĩa» → «các từ ngữ» (padabyañjana: dn16, an3.5 dịch «từ ngữ», an2.20 dịch «văn cú»; «chữ
    nghĩa» không có ở nơi nào khác, và lẫn với attha «nghĩa» ngay trong câu), «nghĩa cũng bị suy
    đoán sai/được suy đoán đúng» → «nghĩa cũng bị dẫn sai/được dẫn đúng» (dunnayo/sunayo, theo
    an2.20:1.4 và 2.4), thêm hô ngữ «Này các tỳ-kheo» (bhikkhave) đã bị bỏ ở 4.4 và 8.4; khoá
    5.1, 6.1, 7.1, 9.1, 10.1, 11.1 — thêm «Lại nữa» cho Puna caparaṁ (464/531 khoá toàn tầng mở
    bằng «Lại nữa»); giữ nguyên khoá 7.3 (khớp 7.1 cùng bài); giữ nguyên các
    khoá đã nêu ở mục trước vì bản hiện tại đủ hô ngữ và nhất quán «suy tàn» với 4.1, 7.5, 8.1.
