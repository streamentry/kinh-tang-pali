notes: |-
  Dịch toàn bộ 92 khoá Pāli root từ snapshot SuttaCentral/Bilara đã ghim; không có khoá nào ngoài tập khoá Pāli, thứ tự khoá đúng thứ tự Pāli.

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE ENGLISH:
  - Mẫu số: 80 khoá Pāli có nội dung (>= 40 ký tự, bỏ khối :0). Tầng english-sujato phủ 78/80 = 0.975, trên ngưỡng 0.80 mà không cần tính lớp nào khác. Hai khoá Sujato để trống là 2.2 và 2.4 (lần thứ hai Gotamī xin và Đức Phật từ chối; Sujato nén thành "For a second time …"); hai khoá này do lớp english-project của dự án lấp (đã published), nên tính cả lớp ấy coverage là 80/80, nhưng lớp lấp do cùng một dòng làm việc viết nên không phải cách đọc English độc lập, và triangulation không tính nó.
  - Khoá 2.3 ("Alaṁ, gotami.", dưới 40 ký tự) cũng trống ở Sujato và ở lớp lấp; bản Việt dịch theo 1.4 và 3.3 là cùng một câu Pāli.
  - Tầng vietnamese-current (Hòa thượng Thích Minh Châu) không có trong snapshot đã ghim cho bài này; chỉ có tiền lệ Việt trong chính tầng dự án để đối chiếu thuật ngữ. Vì vậy triangulation đặt 9.0, không cao hơn.
  - Không phát sinh gap coverage; không cần entry trong reference-gaps.

  KIỂM TRA ĐO ĐƯỢC:
  - Tập khoá Việt = tập khoá Pāli = 92; 0 khoá rỗng; NFC sạch; không khoảng trắng thừa; không có chữ số trong thân kinh.
  - Nháy đơn, nháy kép khớp Pāli từng khoá: 0 lệch trên 92 khoá. Dấu lược: Pāli có ba chỗ "…pe…" (8.1, 9.7, 22.2) và bản Việt giữ đúng một "…" ở mỗi chỗ; 22.2 kết " …." theo quy ước tầng; Pāli không có "(…)" hay "…" trần.
  - Pāli trùng nguyên văn trong chính bài: 63 cặp; bản Việt khác 6 cặp, đều là cặp 1.5/2.4/3.4 với 7.6/8.5 (Pāli "Mā te rucci …" không có hô cách; người được nói tới là Gotamī ở nhóm đầu và Ānanda ở nhóm sau, nên dịch "Bà đừng ưa thích …" và "Ông đừng ưa thích …"). Các cặp còn lại (cụm cầu xin 1.3/2.2/3.2/7.4/8.3/9.10, cụm "Ayampi dhammo …" ở 11.2–18.2 và 22.2–23.2, cụm 27.2/28.2/29.2) dịch giống hệt nhau.
  - Pāli trùng nguyên văn với bài khác trong tầng: 10 khoá đã dò; 4 dùng lại nguyên văn, 6 khác (5.2, 5.3, 7.1, 8.2, 9.4, 25.1). 7.1 và 25.1 đã đưa về dạng đa số trong tầng; 5.2 ("từng chặng", an3.91:1.8), 5.3 và 8.2, 9.4 khác nhau ở cách gọi Đức Phật hoặc dấu câu và giữ cách dịch thống nhất trong bài.
  - Số Pāli: aṭṭha = 8 ("tám pháp tôn trọng"); vassasata = 100 ("một trăm năm", 11.1 và 22.1); dve vassāni = 2 ("hai năm", 16.1); chasu = 6 ("sáu pháp"); tīhi = 3 ("ba điều", 14.1); dve dhammā = 2 ("hai điều", 13.1); vassasahassa = 1000 ("một ngàn năm", 26.1); pañca vassasatāni = 5 x 100 = 500 ("năm trăm năm", 26.3). Không có cụm số chưa phân xử được.

  THUẬT NGỮ VÀ TIỀN LỆ (đếm trên tầng):
  - tathāgatappavedite dhammavinaye -> "Pháp và Luật do Như Lai tuyên thuyết": "Pháp và Luật" 24 khoá so với "Giáo Pháp và Giới Luật" 10, "Pháp và Giới Luật" 5; động từ "tuyên thuyết" 26 khoá so với "khai thị" 10, "trình bày" 6.
  - agārasmā anagāriyaṁ pabbajjaṁ -> "xuất gia từ đời sống tại gia đi đến đời sống không nhà": dạng đa số trên tầng (93 + 14 khoá), so với "xuất gia từ bỏ gia đình" 60.
  - mātugāma -> "người nữ": 137 khoá, so với "phụ nữ" 47, "nữ giới" 20, "người đàn bà" 4.
  - saddhamma -> "Chánh pháp": dạng đa số (Chánh Pháp 182, Chánh pháp 119, chánh pháp 56, diệu pháp 40).
  - abhivādanaṁ paccuṭṭhānaṁ añjalikammaṁ sāmīcikammaṁ -> "đảnh lễ, đứng dậy chào, chắp tay hành lễ và giữ lễ nghi đúng đắn": theo an4.187:4.2.
  - akkosati paribhāsati -> "quát mắng, lăng mạ": theo an3.27:2.13.
  - mātucchā āpādikā posikā khīrassa dāyikā và janettiyā kālaṅkatāya thaññaṁ pāyesi -> theo mn142:3.3 và 3.4 (Pāli gần như nguyên văn).
  - maṇḍanakajātiko sīsaṁnhāto uppalamālaṁ vassikamālaṁ -> theo mn5:33.1 ("thích trang điểm", "vừa gội đầu xong", "hoa sen, hoa nhài hay hoa leo", "đặt trên đỉnh đầu").
  - garudhammaṁ ajjhāpannā -> "đã phạm tội lớn", theo an8.52:2.9; garudhamma (tám) -> "pháp tôn trọng".
  - pavāreti -> "tự tứ" (sn8.7, mn118, dn19: "Tự tứ"); uposatha -> "bố-tát"; vassaṁ upagacchati -> "vào an cư mùa mưa" (sn47.9); sikkhamānā -> "thức-xoa-ma-na" (sn19.19).
  - bhagavā ở lời dẫn truyện -> "Đức Phật" (an8.25, an10.46 cùng cụm nigrodhārāme -> "tu viện Cây Đa"); lời xưng hô bhante -> "bạch Thế Tôn"; kūṭāgārasālā -> "giảng đường mái nhọn" (nhiều khoá).
  - Phẩm: "6. Phẩm Gotamī" theo an8.52:0.2 và an8.53:0.2. Dòng 0.1 giữ "Aṅguttara Nikāya 8.51" theo đa số trong an8 (49 so với 20 khoá "Kinh Tăng Chi Bộ").

  BẤT ĐỊNH (không thêm vào thân kinh):
  - vacanapatho ovaṭo/anovaṭo (18.1, 23.1): dịch sát chữ "lối nói … bị ngăn chặn / không bị ngăn chặn"; Sujato dịch "criticize". Pāli chỉ nói về "con đường lời nói" bị chặn hay mở, không nêu rõ là chỉ trích hay khuyên bảo; dịch giữ nguyên độ mở của Pāli.
  - uposathapucchakaṁ (13.2): dịch "việc hỏi về bố-tát"; Sujato "the date of the sabbath". Pāli chỉ có "hỏi về uposatha", không nói hỏi ngày; không thêm "ngày" vào thân kinh.
  - pakkhamānattaṁ (15.1): giữ thuật ngữ "mānatta" (hành phạt trong nửa tháng dành cho tỳ-kheo-ni phạm garudhamma); không tìm thấy tiền lệ dịch trong tầng, Sujato dịch "penance".
  - kumbhatthenakehi (27.1): dịch "những kẻ trộm chum vại" (Sujato "grain-jar thieves"); sn20.3 cùng công thức bỏ chữ này. Nghĩa chính xác của kumbhatthenaka (trộm chum, trộm đồ trong chum, hay trộm vặt trong nhà) chưa phân xử được.
  - setaṭṭhikā và mañjiṭṭhikā (28.1, 29.1): tên hai loại bệnh cây, dịch sát nghĩa chữ "xương trắng" và "bệnh đỏ" (Sujato "white bones", "red rot"); không xác định được tên bệnh học.
  - sampanne sālikkhette (28.1) và ucchukkhette (29.1): dịch "đang tươi tốt" (Sujato "full of rice"/"full of sugarcane"); sampanna có thể là "đầy đủ, trúng mùa".
  - bahidvārakoṭṭhake (5.6, 6.1, 7.2): dịch "bên ngoài cổng"; koṭṭhaka có thể là cổng lầu hoặc tiền sảnh.
  - 4.1: "iti" đóng lời nghĩ trước chuỗi trạng thái nên dịch "nghĩ rằng" (Sujato cũng dịch là lời nghĩ); Pāli không có động từ "nghĩ".
  - 11.1: Pāli không có chữ "dù" trước vassasatūpasampannāya bhikkhuniyā; bản Việt cũng không thêm, và tương phản được nêu bởi tadahūpasampannassa ("vừa thọ cụ túc giới ngay hôm ấy").
  - 9.8: Pāli viết bahukārā bằng chữ thường nối từ 9.7 (nếu … thì …); thêm "thì" ở đầu 9.8 để giữ quan hệ điều kiện, không thêm nghĩa nào khác.

