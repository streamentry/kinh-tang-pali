notes:
  - >-
    **Bài dài nhất chương (76 segment)**: Đức Phật giảng bài giáo pháp về việc
    ai thừa kế nghiệp của ai, rồi lần theo mười hành vi của `an10.211` để cho
    thấy hành vi xấu dẫn tới thân phận xiền xui, hành vi tốt dẫn tới thân phận
    ngay thẳng.
  - >-
    **`Karajakāyavagga` → *Phẩm Thân Do Nghiệp*** (0 segment tiền lệ, đặt mới):
    Sujato dịch tên phẩm là *The Body Born of Deeds*, và `karajakāya` (thân do
    nghiệp tạo ra) là chủ đề của cả bài — `an10.219` giải thích thẳng rằng mọi
    nghiệp ác từng làm đều được cảm thọ ngay trong thân này. `Saṁsappanīyasutta`
    → *Kinh Tiếp Xúc Nghiệp* (Sujato *Karmic Contact*); `Adhammacariyāsutta` →
    *Kinh Sống Phi Pháp*.
    **`Karajakāyavaggo paṭhamo` ở `an10.220:12.4` dịch là *Phẩm Thân Do Nghiệp,
    thứ nhất*** — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì
    phẩm này rõ ràng thứ hai mốt (đúng như `21.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Nguyên văn dùng lại, đếm được, đều cùng Pāli**: mười hành vi xấu rút gọn ←
    **`an10.199-210:1.3`** (đã `published`: *Sát sinh, Trộm cắp, Tà dâm, Nói
    dối, Nói hai lưỡi, Nói ác khẩu, Nói phù phiếm, Tham lam, Sân hận, và có tà
    kiến*); mười hành vi tốt rút gọn ← **`an10.178:3.2`** (đã `published`:
    *Kiêng tránh sát sinh… không tham lam, không sân hận, và có chánh kiến*);
    `yathābhataṁ nikkhitto evaṁ niraye` ← **`an10.222:1.1`**; `… evaṁ sagge` ←
    **`an3.10:1.1`**; `natthi dinnaṁ … pavedentī’ti` ← **`an3.117:3.3`**;
    `pāṇupetaṁ saraṇaṁ gatan` ← **`an3.53:5.4`**; `apāyaṁ duggatiṁ vinipātaṁ
    nirayaṁ` ← **`an10.229-232:1.1`**; `sugatiṁ saggaṁ lokaṁ upapajjanti` ←
    **`an3.117:7.5`**; `Taṁ suṇātha, sādhukaṁ manasi karotha` ←
    **`an10.107:2.2`**.
  - >-
    **Bản đầu tôi bịa một loài trong `4.4`/`6.4` và lượt review bắt được.** Pāli
    liệt kê bảy loài `ahi, vicchikā, satapadī, nakulā, biḷārā, mūsikā, ulūkā` —
    tôi dịch `nakulā` thành *rắn lục*, tức **bịa ra một loài không có trong danh
    sách**, và bỏ mất `mūsikā`. `nakulā` và `biḷārā` đều là loài chồn diệt rắn,
    nên tôi dùng *chồn tay đen* và *chồn hôi*; `mūsikā` là *chuột nhắt*. Tên các
    loài này **0 tiền lệ**, đặt mới.\n**Cũng ở `4.4`:** `…sattā manusse disvā
    saṁsappanti` là *thấy chúng sinh loại ấy rồi sinh ra*, không phải *tiếp
    xúc*; tôi dùng *sau khi thấy … thì sinh ra*.
  - >-
    **`8.2`/`10.2` là danh sách dòng dõi cao sang** (`uccākulāni
    khattiyamahāsālakulāni … gahapatimahāsālakulāni aḍḍhāni mahaddhanāni
    mahābhogāni …`) — 0 tiền lệ, đặt mới: *dòng dõi quý tộc chiến sĩ và đại thị
    phiền, dòng dõi Bà-la-môn và đại thị phiền, dòng dõi thương nhân và đại thị
    phiền; cao quý, giàu có, đông đúc tài sản, nhiều vàng bạc, nhiều của cải,
    nhiều tiền tài và nông sản*. Bản đầu tôi dịch `mahābhogāni` là *đông đúc của
    cải*, vừa lặp với `pahūtavittūpakaraṇāni` vừa không đúng; đã sửa.
  - >-
    **`9.11` thiếu dấu phẩy** nối `parañca lokaṁ` với `sayaṁ abhiññā sacchikatvā
    pavedentī` — lượt review bắt được, ra chữ *“thế gian kiatự mình chứng ngộ”*.
    Đã sửa.
  - >-
    **Thuật ngữ 0 tiền lệ, đặt mới**: `saṁsappanīya` → *tiếp xúc (với nghiệp)*;
    `kammadāyā` → *kẻ thừa kế nghiệp*; `kammayonī` → *nguồn của nghiệp*;
    `kammabandhū` → *sợi dây của nghiệp*; `kammapaṭisaraṇā` → *di sản của
    nghiệp*; `jimha` → *xiền xui*; `uju` → *ngay thẳng*; `gati` → *thân phận*;
    `saṁsappajātikā tiracchānayoni` → *cõi địa ngục sinh ra từ sự tiếp xúc ấy*;
    `tiracchānayoni` → *địa ngục*; `bhūtā bhūtassa upapatti` → *chúng sinh này
    sinh ra một chúng sinh cùng loại với nó*; `phussanti` → *chạm tới*;
    `ekantadukkhā` / `ekantasukhā` → *khổ đau tuyệt đối* / *dễ chịu tuyệt đối*
    (bản đầu lặp *khổ khổ*; đã sửa).\nCó tiền lệ:
    `vicchikā`/`nakulā`/`biḷārā`/`mūsikā`/`ulūkā` chỉ có ở đây;
    `saññavedayitiracchāna` không có.
