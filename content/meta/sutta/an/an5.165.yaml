notes: |-
  Sửa 2026-10-18 theo đối chiếu khoá trùng Pāli: 1.3 icchāpakato «có bản tính mong muốn» → «bị ham muốn chi phối» (nghĩa từ sai: pakata là quá khứ phân từ, đã bị đọc như pakati «bản tính»; DPD icchāpakata «who is afflicted with desire; who is led astray by longing» [icchā + apakata], dẫn chú giải AN «tāya eva icchāya abhibhūto hutvā»; chú giải Mahāniddesa «icchāya apakato, upaddutoti attho»; bản Thích Minh Châu an5.93 «bị dục chi phối»; khớp cnd23:213.2, mnd16:67.3, mnd10:42.3). Sujato «being of wishful temperament» là cách đọc khác, DPD và chú giải không ủng hộ.
