notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `7. Mahāvagga` → «7. Phẩm Lớn». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.1–1.6, 1.9–1.14, 2.1–2.6, 2.8, 2.9 — `hatūpanisaṁ hoti` / `upanisasampannaṁ hoti` đổi «điều kiện cốt tủy cho … bị phá hủy / được thành tựu» → «nền tảng của … bị hủy hoại / được đầy đủ» («nền tảng» cho `upanisā`: 123 khoá trong tầng; «điều kiện cốt tủy» chỉ có ở bài này); `vipanna` «thiếu» → «hư hoại» (84 khoá; «thiếu» đã dành cho `asati`); «như thật tri kiến» → «sự thấy biết như thật» (61 so với 10); «giới đức» → «giới». Không chép nguyên cách dịch chiếm đa số của nhóm (`an5.24`, `an6.50`…: «người hư hoại X đã hủy hoại nền tảng của Y») vì ở `hatūpanisaṁ hoti` chủ ngữ là Y (sự thấy biết… bị hủy hoại nền tảng), không phải người; bài này giữ chủ ngữ Y. Giữ «nhàm chán và ly tham» (`nibbidā`: «nhàm chán» 324 so với «chán ngại» 74 toàn tầng) và «sự phòng hộ các căn» (42 so với «thu thúc» 8).
