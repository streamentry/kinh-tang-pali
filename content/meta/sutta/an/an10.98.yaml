  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức đã chạy trên **48.902 segment đã `published`**: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Khớp **48.477 / 48.902 = 99,13%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ (`hay` được miễn vì `vā…vā…vā` là cấu trúc).
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Tên phẩm của lát này: `Āhāravagga` → *2. Phẩm Đoàn Thực* (`sn12.13`, cùng phẩm) · `Dukkhavagga` → *6. Phẩm Khổ* (`sn12.59`) · `Kammapathavagga` → *3. Phẩm Nghiệp Đạo* (`sn14.28`, cùng phẩm) · `Catutthavagga` → *4. Phẩm Thứ Tư* (13 bài) · `Nānattavagga` → *1. Phẩm Dị Biệt* (đa số `sn14.2/6`) · `Paṭhamavagga` → *1. Phẩm Thứ Nhất* (`sn15.1/6`) · `Opammavagga` → *1. Phẩm Ví Dụ* (`sn20.4`) · `Dhammakathikavagga` → *12. Phẩm Người Giảng Pháp* (`sn22.113/114`). Tên phẩm An: `Upālivagga` → *10. Phẩm Upāli* · `Samacittavagga` → *4. Phẩm Tâm Bình Thản* (**0 tiền lệ**, chưa bài nào của phẩm này xuất bản) · `Kimilavagga` → *21. Phẩm Kimila* · `Āvāsikavagga` → *24. Phẩm Vị Trú Xứ* · `Sammutipeyyāla` → *27. Phẩm Chuỗi Lặp* (**0 tiền lệ**) · `Anuttariyavagga` → *3. Phẩm Vượt Trội* · `Vajjisattakavagga` → *3. Phẩm Bảy Điều Tộc Vajji* · `Devatāvagga` → *4. Phẩm Chư Thiên* · `Dhanavagga` → *1. Phẩm Của Cải* · `Gotamīvagga` → *6. Phẩm Gotamī* · `Sīhanādavagga` → *2. Phẩm Tiếng Hồi* · `Sattāvāsavagga` → *3. Phẩm Trú Xứ* · `Sammappadhānavagga` → *8. Phẩm Chánh Cần*. **Bốn chỗ đang phân kỳ trong kho, ghi rõ để không bị hiểu là lỗi:** `Sīhanādavagga` (`an9.17` ghi *Sư Tử Hống*) · `Sattāvāsavagga` (`an9.23` ghi *Bảy Lậu*) · `Nānattavagga` (`sn14.9` ghi *Sai Biệt*) · `Āvāsikavagga` (`an5.240` ghi *Người Cư Ở*) · `Kimilavagga` (`an5.204` ghi *Đạo Đức*) · `Sammappadhānavagga` (`an9.74-81` ghi *Chánh Điển Trừng Phạt*). **Người biên tập nên thống nhất.**
  - >-
    0 tiền lệ, đặt mới, ghi kèm lý do: `Upālivagga` → *10. Phẩm Upāli* (`an10.100*`) · `Therasutta` → *Kinh Trưởng Lão* · `thero` → *trưởng lão* (cùng ý `therā` ở `an7.28:1.7*`) · `rattaññū cirapabbajitā` → *biết rõ lâu dài, xuất gia lâu dài* · `yassaṁ yassaṁ disāyaṁ viharati, phāsuyeva viharati` → *khi sống ở bất cứ đâu, khắp nơi đều sống an lành* · `uḷārapāmojjo` → *học vừa sâu vừa rộng* · `adhikaraṇasamuppādavūpasamakusalo` → *rất thành thạo về việc phân định và xử lý tranh chấp* (Sujato *expert in settling legal cases*).
  - >-
    Dùng lại **nguyên văn** đã `published`: `ubhayāni kho panassa pātimokkhāni … suttaso anubyañjanaso` → *cả hai bộ Pātimokkha của vị ấy đều đầy đủ, viết rõ ràng, dễ chia, dễ phân định, biết rõ theo kinh và theo giảng dạy chi tiết* (`an7.76:1.7*`/`an7.80:1.7*`, hai bài song sinh có đúng Pāli này) · `āsavānañca khayā anāsavaṁ cetovimuttiṁ paññāvimuttiṁ …` → *nhờ đoạn tận các lậu mà vô lậu, giải thoát tâm không lậu, giải thoát tuệ, tự mình thắng tri, chứng ngộ trong hiện tại và an trú ở giải thoát* (`sn51.18:1.1*`, `sn51.23:1.8*`) · `sīlavā …pe… samādāya sikkhati sikkhāpadesu` và `bahussuto …pe… diṭṭhiyā suppaṭividdhā` theo `an5.234:1.3–1.4*`.
  - >-
    **Lệch có chủ đích, ghi rõ:** `1.11` (`catunnaṁ jhānānaṁ ābhicetasikānaṁ diṭṭhadhammasukhavihārānaṁ nikāmalābhī akicchalābhī akasiralābhī`) và `an8.58:1.9` có **cùng Pāli** với `an5.234:1.6*` đã xuất bản, nhưng bản đó **đảo thứ tự**: *được hưởng khi muốn, không khó nhọc, không vất vả bốn thiền, những trạng thái an lạc hiện tại thuộc tâm tăng thượng*. Hai bài này viết **đúng thứ tự Pāli**: *tự tại bốn tầng thiền, tâm không bị dao động, sống sở pháp được thấy rõ như thật, được hưởng khi muốn, không khó nhọc, không lầy lội*. **Người biên tập nên sửa `an5.234:1.6` cho khớp.**
  - >-
    Bất định đã ghi: `santūṭṭho hoti itarītaracīvarapiṇḍapātasenāsanagilānappaccayabhesajjaparikkhārena` dịch *buông ngỏ sự phân biệt đồng với khác về y phục, thực phẩm, bệnh tật và điều trị* — `itari-itara` = chỗ này chỗ kia; cách này giữ được ý 'những thứ vốn phải phân biệt thì vị ấy không còn phân biệt nữa'.
