    cùng Pāli dùng «nói với»). Phần «lời chào hỏi thân mật và lời nói đáng nhớ nhung» giữ nguyên
    (cách dịch phổ biến của tầng). Ghi nhận ngoài phạm vi lượt này, chưa sửa: an4.168:1.2 còn
    «bạch».
