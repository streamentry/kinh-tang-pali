  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.2 — «Được ngồi ở một bên, Tôn giả Sāriputta
    bạch Tôn giả Mahāmoggallāna» → «Ngồi xuống một bên, Tôn giả Sāriputta nói với Tôn giả
