notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (tra cứu toàn văn, không căn lề theo segment; bản Việt phân đoạn của tầng `vietnamese-current` vắng ở commit đã ghim, bilara chỉ có Pháp Cú). **Coverage Anh trên Pāli có nội dung: 62/62 = 100%** (ngưỡng 0.8): toàn bộ 62 khoá Pāli ≥ 40 ký tự (bỏ khối `:0`) đều do Sujato phủ; không có tệp `english-project` cho bài này nên không khoá nào do tầng lấp của dự án cung cấp, và không có chỗ nào Pāli phải tự đứng một mình. Sujato đặt phần thấy Pháp, quy y và thọ giới trong một ô `4.9`, trùng ranh giới Pāli.
  **49/76 khoá có Pāli trùng nguyên văn ở bài khác (688 cặp trùng toàn tầng); 46 khoá dùng lại NGUYÊN VĂN một cách đã có, 3 khác có chủ ý, 183 cặp có bản Việt khác.** Phần lớn là bài anh em `an8.21` (Kinh Ugga (Một)), cùng gia chủ Ugga, cùng tám pháp, chỉ khác nơi ở và các pháp thứ năm–tám: dùng lại nguyên văn các khoá `1.2` (60/127 trong tầng), `1.4` (106/188), `1.5`, `2.4`, `3.1`, `3.2`, `3.9`, `4.1`–`4.8` (`4.6` chỉ 1/9 cặp và `4.8` 1/4: các bài kia dùng biến thể không có đa số rõ, tôi theo cách của `an8.21`), `4.10`, `5.1`–`5.10`, `6.1`–`6.3`, `7.1`, `7.2`, `7.4`–`7.6`, `8.6`, `9.1`, `9.2`, `9.4`, `9.5`, `9.7`, `10.3`, `11.1`, `12.2`, `13.1` (14/21), `13.4` (272/276 *Thứ hai.*), `0.2` (7/7). Khác có chủ ý: `1.1` (1 cặp trùng ở `sn35.125:1.1`, đang dịch *Vương Khúc, trong làng gốm* — không khớp `hatthigāme`, nên theo `an4.1` *xứ Vajji* và `dn16:4.5.2` *làng Hatthi*); `3.4` (3 cặp trùng, ở đó người nói là Đức Phật nên *Ta sẽ nói*; ở đây người nói là gia chủ nên *tôi sẽ nói*, theo `an8.21:3.6`); `10.1` (1 cặp trùng ở `sn41.9:2.9`, cùng Pāli nhưng `bhante` ở đó là Đức Thế Tôn, ở đây là vị tỳ-kheo, nên đổi *Thưa ngài* thành *Thưa tôn giả* và *Đức Thế Tôn* thành *Đức Phật*). Không có cặp Pāli trùng nguyên văn trong chính bài mà bản Việt khác nhau (0/0 cặp; phép này chạy rỗng vì bài không có khoá Pāli nào lặp).
  **Số Pāli (đã tự tính):** `aṭṭha` 8 ở 9 khoá (1.3, 2.3, 2.4, 3.2, 3.3, 11.1, 11.3, 13.2, 13.3) đều dịch *tám*; thứ tự `paṭhamo` 1 (3.9) · `dutiyo` 2 (4.10) · `tatiyo` 3 (5.10) · `catuttho` 4 (6.3) · `pañcamo` 5 (7.6) · `chaṭṭho` 6 (8.6) · `sattamo` 7 (9.7) · `aṭṭhamo` 8 (10.3), liên tục, đủ tám pháp; `catasso` 4 người vợ (5.1); `brahmacariyapañcamāni` = giới thứ năm là phạm hạnh (4.9, 5.3); danh sách `8.2` có đúng 9 hạng người (ubhatobhāgavimutta, paññāvimutta, kāyasakkhī, diṭṭhippatta, saddhāvimutta, dhammānusārī, saddhānusārī, sīlavā, dussīla), Việt cũng 9 mục.
  **Khác với `an8.21`.** Bài này cùng khung nhưng có pháp thứ năm gộp *phụng sự và nghe pháp cẩn thận* (`7`), pháp thứ sáu là cho Tăng với tâm bình đẳng và nghe chư thiên nêu các hạng tỳ-kheo (`8`), pháp thứ bảy là chuyện chư thiên khen Pháp (`9`), pháp thứ tám là không còn kiết sử để trở lại đời này (`10`) — khác với `an8.21` (nơi pháp thứ tám là đoạn trừ năm hạ phần kiết sử). Phần mở đầu `3.7`–`3.8` thêm `nāgavane paricaranto` và `surāmado ca pahīyi` mà `an8.21` không có.
  **Thuật ngữ.** `bhante` của gia chủ nói với tỳ-kheo → *thưa tôn giả* (như `an8.21`; trong toàn tầng *thưa tôn giả* áp đảo *bạch thầy*); `acchariyā abbhutā dhammā` → *pháp kỳ lạ, chưa từng có* (an8.21, an8.23, an8.24); `dhāretha` → *hãy ghi nhớ*; `byākato` → *tuyên bố* (93 khoá `byākat…` toàn tầng, *giải đáp* 27, *tuyên thuyết* 56) còn `byākaramāno/byākareyya` ở `13.2` → *giải đáp* (người trả lời câu hỏi); `payirupāsati` → *phụng sự* (như an8.21); `sakkaccaṁ/asakkaccaṁ` → *cẩn thận / thiếu cẩn thận* (an8.13, an8.21); `hatthigāma` → *làng Hatthi* (dn16:4.5.2), `vajjī` → *xứ Vajji* (an4.1); `nāgavana` → *rừng Nāga* giữ nguyên tên, vì tầng Việt chỉ có `mn27` dịch *rừng voi* cho một ngữ cảnh tự nhiên khác (8 khoá), còn Thích Minh Châu viết *rừng Nàga*; `ubhatobhāgavimutto … saddhānusārī` ở `8.2` theo đúng chuỗi Pāli ở `an2.48:1.6` (*giải thoát hai phần · tuệ giải thoát · thân chứng · đạt kiến · tín giải thoát · tùy pháp · tùy tín · có giới hạnh thiện pháp · ác giới ác pháp*; riêng từng thuật ngữ trong tầng: *giải thoát hai phần* 7/13, *thân chứng* 9/15, *đạt kiến* 15/25, *tín giải thoát* 20/21, *tùy pháp* 19/21, *tùy tín* 19/27, *tuệ giải thoát* 8/21); `kālaṁ kareyyaṁ` → *mệnh chung* (sn41.9:2.9 cùng câu Pāli, sn48.42:6.5); `natthi taṁ saṁyojanaṁ … puna imaṁ lokaṁ āgaccheyya` → *Không có kiết sử nào … còn trở lại thế giới này nữa* (sn41.9:2.10, sn48.42:6.5, an3.94:3.3, 3/3); `samacitta` → *tâm bình đẳng* (mil7.4.1, tha-ap276, 2/5 khoá; còn *quân bình*, *bình tĩnh* cho các ngữ cảnh khác); `parivisati` → *phục vụ* (dn16 dùng *dâng* khi có tân ngữ là món ăn cụ thể; ở đây Pāli chỉ có `saṅghaṁ`, không có tân ngữ món ăn).
  **Bất định, ghi tại đây chứ không thêm vào thân kinh.** (1) `8.1` và `9.1` `Anacchariyaṁ` — nghĩa đen *"không có gì lạ"*, nghe như mâu thuẫn với việc đây là hai trong tám pháp kỳ lạ. Giữ nghĩa đen như Sujato (*It's not unusual*) và Thích Minh Châu (*Thật không phải là vi diệu*), để cái đáng ghi nằm ở chỗ ông không bị lay chuyển (`8.3`–`8.5`, `9.5`–`9.7`). Cách đọc khác không có tầng Anh hay Việt nào ủng hộ. (2) `3.7` `nāgavane paricaranto` — `paricaranto` dịch *vui chơi* (Thích Minh Châu *vui chơi*, Sujato *partying*), hợp với `3.8` `surāmado ca pahīyi`; nghĩa đen của gốc `paricarati` là *đi quanh, hầu cận, hưởng thú*. `nāga` có thể là voi, rồng hay cây nāga: Sujato dịch *Dragon's Park*, Thích Minh Châu giữ *Nàga*, tôi giữ tên *Nāga* và không chọn nghĩa. (3) `3.8` `surāmado` dịch *cơn say rượu* (Sujato *sobered up*); `pahīyi` là bị bỏ/dứt, dịch *đã dứt*. (4) `8.4` `imassa vā thokaṁ demi imassa vā bahukan'ti` có cấu trúc `vā … vā` (*hoặc … hoặc*), dịch giữ cặp *hoặc*; Sujato diễn rộng *Let me give … a little, and that one a lot*. (5) `9.6` Pāli ở bài này là `maṁ tā devatā` còn `an8.21:9.6` là `maṁ vā devatā`; dịch *Chư thiên ấy đến gặp tôi*, thêm *ấy* cho `tā`. (6) `5.5` `purisādhippāyo`, `5.8` `oṇojesiṁ`, `5.9` `pariccajanto` — kế thừa cách dịch của `an8.21:5.5`, `5.8`, `5.9` (*có ý muốn theo một người đàn ông nào đó*, *rưới nước làm lễ trao*, *cho đi*), không tự phân xử thêm; Pāli `pariccajanto` nghĩa gốc là từ bỏ/xả bỏ. (7) `10.1` Pāli `anacchariyaṁ kho panetaṁ yaṁ maṁ bhagavā evaṁ byākareyya` — *không có gì lạ nếu Đức Phật tuyên bố* (điều kiện, không phải khẳng định rằng Đức Phật đã tuyên bố). (8) `13.2` `Yathā taṁ … byākareyya` là cách nói điều kiện (*như người ấy khi giải đáp chân chính sẽ giải đáp*), dịch *sẽ giải đáp đúng như thế*, theo `an8.21:13.2`.
  **Dấu nháy khớp Pāli từng khoá** (76/76 khoá, 0 lệch cho `“ ” ‘ ’`): nháy đơn lồng trong nháy kép ở `3.2`, `4.8`, `5.3`–`5.7`, `8.2`, `8.4`, `9.2`–`9.6`, `10.2`, `11.3`. Không có `…pe…`, không có `(…)`, không có `…` trong Pāli nên Việt cũng không có. NFC sạch, 0 khoá rỗng, 0 chữ Pāli lọt sang Việt. Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
