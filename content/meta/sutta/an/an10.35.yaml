notes:
  - >-
    **Đoạn dài nhất chương, và đã có tiền lệ gần như nguyên văn.** `an10.33:1.4`
    là cùng Pāli với `an3.73:2.4` (đã dịch): "bậc tỳ-kheo có giới, sống hộ trì
    Pātimokkha… học tập giữ đúng các học luật đã thọ nhận". `an10.33:1.5` là
    cùng Pāli với `an4.22:4.4` (14 segment tiền lệ): "Là bậc đa văn… thiện trong
    khởi đầu, thiện ở giữa, thiện ở đoạn cuối…". Dùng lại nguyên văn, chỉ đổi vị
    ngữ cho khớp số lượng (`aṭṭhikas`/hai bộ).
  - >-
    **Mười pháp này chưa có tiền lệ trong corpus** (`ubbāhikāya sammannitabbo`,
    `upasampādetabban`, `nissayo dātabbo`: 0 segment). Ba bài `an10.33–36` chỉ
    khác nhau ở vế cuối (`đắc bội quần` / `đạt tới` / `khuyên` / `hầu hạ tỳ-kheo
    tân`) và ở chỗ lược, nên **mười điều kiện dùng lại nguyên văn cả ba bài**.
  - >-
    `nissayo dātabbo` → **"cần phải khuyên"** (chưa có tiền lệ).
  - >-
    **Ba chỗ lược ở `1.11`–`1.13` được xử lý khác nhau, đúng theo Pāli:** `1.11`
    kết bằng `…pe…` nên giữ dấu lược ở cuối; `1.12` chỉ có dấu lược thường nên
    chỉ giữ ở cuối; `1.13` **không có dấu lược** nên không thêm. Lượt review bắt
    được chỗ tôi thừa dấu lược ở đầu hai segment sau.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
