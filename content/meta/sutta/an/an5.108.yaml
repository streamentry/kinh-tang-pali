  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.3 (và 1.1 cùng khuôn) — bản cũ mở rộng
    `…pe…` thành danh sách đầy đủ; Pāli ngắt ở `āhuneyyo hoti …pe… anuttaraṁ puññakkhettaṁ
