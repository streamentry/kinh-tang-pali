    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Bản song song trùng Pāli, đã `published`, dùng lại nguyên văn.** `an10.6*` cho `an11.19*` (cùng danh sách các tầng trạng và cùng `sabbasaṅkhārasamatho`) · `an10.10*` cho `an8.72*` (cùng khung 'yếu tố chưa trọn vẹn / làm cho trọn vẹn') · `an6.3:1.4` cho cụm `āhuneyyo pāhuneyyo dakkhiṇeyyo añjalikaraṇīyo` của `an8.57:1.1` · `an10.220:1.4` cho `an2.16:1.4` (trùng nguyên vân `Adhammacariyāvisamacariyāhetu`) · `an10.58:1.3` cho `Bhagavaṁmūlakā no, bhante, dhammā…` (`an8.83/11.19`) · `an7.615:1.1` cho `Rāgassa, bhikkhave, abhiññāya …` (`an8.119`) · `an8.16:1.1` cho khuôn `Aṭṭhahi, bhikkhave, dhammehi samannāgato bhikkhu…` · `sn12.30*` cho cụm `nappajānanti` của `sn12.14` · `sn22.50*` (lát 39) cho cặp `samaṇasammatā…` của `sn12.14` · `sn56.60/61*` (lát 38–39) cho ẩn dụ bụi móng tay – mặt đất lớn (`sn13.1`).
  - >-
    **Những lỗi mà lượt review đối kháng bắt được ở lát này, đều là lỗi nghĩa chữ — không phải lỗi hình thức.** (1) `an6.2:3.10–3.13`: `mahaggata/amahaggata` và `sauttara/anuttara` bị dịch thành *có/không có tầm viễn* và *có/không có định hơn* — sai hoàn toàn; đã sửa thành *rộng lớn* và *cao hơn*. (2) `an2.5:1.4/1.7/1.11`: `kāmaṁ taco ca nhāru ca aṭṭhi ca` bị xếp sai thứ tự (da/xương/gân) — đã sửa theo đúng Pāli là xác thịt, gân, xương. (3) `sn13.1:2.3/2.6`: `neva satimaṁ kalaṁ upeti` bị dịch thành *không đến một phần bao nhiêu* — vô nghĩa; đã sửa thành *không phải một phần*. (4) `an8.44:3.5` lúc đầu rối vừa đọc vừa dịch, đã viết lại. **Máy không bắt được loại lỗi này — cả bốn đều qua mọi chốt tự động.**
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán.** Công thức: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`. Đo lại trên toàn bộ segment Việt đang có trong `content/translation/vi/project/` (bỏ 22 tệp trong thư mục APFS orphan): **khớp 46.755 / 47.140 = 99,18%**. Harness còn chặn hoa sau ngoặc, hoa sau chấm, sót `ti`, `pe…`, Pāli lọt và lặp từ.
  - >-
    **Mọi tên phẩm đều tra tiền lệ `published` trước khi viết.** Dùng lại: `Āhuneyyavagga` (An 6) → *1. Phẩm Đáng Lễ Bái* (`an6.1` chưa dịch nhưng `an6.3/4` ghi *1. Phẩm Đáng Cúng Dường* — **hai tên khác nhau cho cùng phẩm, cần thống nhất**) · `Sāraṇīyavagga` → *2. Phẩm Đáng Nhớ* · `Anusayavagga` → *2. Phẩm Ám Ảnh* · `Uposathavagga` → *5. Phẩm Giữ Trai* · `Gotamīvagga` → *6. Phẩm Gotāmī* · `Yamakavagga` → *8. Phẩm Song Chi* · `Sativagga` → *9. Phẩm Có Nhớ Tưởng* · `Rāgapeyyālā` → *11. Ấp Tặng Tham* · `Sattāvāsavagga` → *3. Phẩm Bảy Chướng Ngại* · `Jāṇussoṇivagga` → *17. Phẩm Vua Jāṇussoṇi* · `Anussativagga` → *2. Phẩm Nhớ Lễ* · `Āhāravagga` (Sn 12) → *2. Phẩm Đoàn Thực* · `Dasabalavagga` → *3. Phẩm Mười Lực* · `Dukkhavagga` → *6. Phẩm Khổ* · `Abhisamayavagga` (Sn 13) → *1. Phẩm Thông Đạt* · `Paṭhamavagga` (Sn 15) → *1. Phẩm Thứ Nhất* · `Chaṭṭhavagga` (An 1) → *19. Phẩm Thứ Sáu*. **Hai phẩm 0 tiền lệ:** `Gahapativagga` (Sn 12) → *5. Phẩm Giếng Nước* (`gahapati` là bến nước/đầu nguồn) · `Vihāravagga` (An 8, kho có `an8.68–70` chưa dịch) → *Phẩm Thiền* theo `sn45.19*`. **Người biên tập nên thống nhất các chỗ phân kỳ.**
  - >-
    **`an10.6*` (lát trước, đã `published`) là bài song song trùng Pāli** → dùng lại **nguyên văn** toàn bộ danh sách tầng trạng (đất · nước · lửa · gió · không trung · thức · vô sở hữu · phi tưởng phi phi tưởng · thế giới này · thế giới kia) và câu `“Đây là sự an tịnh, đây là sự vi diệu…”. Bài này Pāli che bằng `…pe…` nên danh sách bị cắt — dấu lược phải ở **giữa** danh sách, và `4.1`, `6.3` không có dấu lược vì đã thành câu trọn.
  - >-
    **`2.1`, `4.1`, `5.1` và `6.3` là cùng một câu hỏi/câu khẳng định** nhưng phải phân biệt ba mức: `2.1` là **hỏi** của vị tỳ-kheo (hỏi Đức Thế Tôn, có dấu `?`), `4.1` và `6.3` là **khẳng định** của Đức Thế Tôn (không dấu hỏi), `5.1` là **hỏi lại** để xin giảng thêm. Nháp đầu dịch cả bốn như một câu giống nhau là mất đúng cấu trúc này.
  - >-
    `6.2` dùng **nguyên văn** `an10.6:3.2`: *‘Đây là sự an tịnh, đây là sự vi diệu, tức là sự lắng dịu của mọi hành, sự buông bỏ mọi chấp thủ, sự tận diệt khát ái, sự ly tham, sự diệt, Niết-bàn’.* `2.2` dùng **nguyên văn** `an10.58:1.3` cho `Bhagavaṁmūlakā no, bhante, dhammā…`.
  - >-
    0 tiền lệ cho `Dutiyasamādhisutta` → *Kinh Thứ Định (Hai)*; `samādhipaṭilābha` → *thành tựu thứ định* (nguyên văn `an10.6:1.2`; xem `iddhipāda` ở ghi chú chung — ở đây `paṭilābha` là *thành tựu* chứ không phải *cầu được* như ở `sn51.27:3.2` của lát 39, và **hai chỗ khác nhau là cố ý**). `anussativagga` → *2. Phẩm Nhớ Lễ* (0 tiền lệ trong kho). `saññī ca pana assā` → *nhưng lại có tưởng* (giữ `pana` là *nhưng* và `ca` là *lại*).
  - >-
    terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `2. Anussativagga` → «2. Phẩm Nhớ Tưởng». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.
