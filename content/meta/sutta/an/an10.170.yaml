  Dùng lại NGUYÊN VĂN, đối chiếu byte-for-byte: `1.1`←an10.118:1.1 · `1.14`←an10.118:2.4 · `2.1-6.6` (22 khoá)←an10.118:3.1-7.6. Ngoài ra 31 khoá Pāli trùng nguyên văn với an10.169 và 22 khoá với an10.117 — bản Việt trùng khớp ở cả hai.
  Ngũ giới và điều răn: dùng nguyên văn an10.171:2.2 và an10.171:3.2 cho tám câu `1.4-1.10` (khác an10.169 ở chỗ xưng `bhikkhave` thay cho `kho, brāhmaṇa`, đã giữ đúng). `1.11-1.12` là `Abhijjhā/anabhijjhā` và `Byāpādo/abyāpādo` không có `-ā veramaṇī` -> `không tham lam`, `không sân hận` theo an10.171. `1.13` là `Micchādiṭṭhi/sammādiṭṭhi` -> `tà kiến`, `chánh kiến`.
  Bất định đã ghi lại: `0.3` `Orimasutta` dịch `Kinh Bờ Bên Này`, theo tiền lệ an10.118:0.3 (`Orimatīrasutta` -> `Kinh Bờ Bên Này`) và Sujato dịch cả hai tiêu đề đều là *The Near Shore*; hệ quả là HAI bài trong cùng quyển có tiêu đề tiếng Việt giống nhau. Không tự đặt cách thứ N+1 — nếu người biên tập muốn tách thì sửa cả hai cùng lúc, và đó là việc ngoài lát này.
  `1.2` (`Taṁ suṇātha …pe…`) giữ đúng MỘT dấu lược, không mở rộng `sādhukaṁ manasi karotha` — đây là lược của chính bản PāLI tại commit đã ghim.
