notes: |-
  Dịch từ Pāli root tại commit đã ghim. COVERAGE ĐO LẠI bằng chính hàm của kho (`englishCoverageFor`, ngưỡng 0.8 trong `source/layers.yaml`): `english-sujato` phủ 13/13 khoá Pāli có nội dung = 1.000, không cần tệp lấp `english-project`. Tầng `vietnamese-current` không có — tại commit đã ghim bilara chỉ phân phối Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  ĐỢT NÀY LÀ LƯỢT REVIEW ĐỐI KHÁNG THỨ HAI, trên bản dịch đã có trên đĩa. KHÔNG sửa khoá nào — đọc lại từng cặp Pāli↔Việt và không tìm ra lỗi nào cần sửa. Giữ nguyên 40/40 khoá.

  ĐO LẠI TIỀN LỆ (không tin số của người khác):
    · 0.1 bài an: quét 1.248 khoá `:0.1` trong tầng `an` -> `Kinh Tăng Chi Bộ` 895 (72%), `Aṅguttara Nikāya` 353, không có dạng thứ ba. Chọn `Kinh Tăng Chi Bộ 10.170`.
    · Tên phẩm: `17. Jāṇussoṇivagga` -> `17. Phẩm Vua Jāṇussoṇi` (7 tệp trong an10).
    · `orimaṁ tīraṁ` / `pārimaṁ tīraṁ` -> `bờ bên này` / `bờ bên kia`: tiền lệ ở dn13:24.3, dn13:26.5, mn22:13.6, mn34:2.1 và an10.118.
    · Dấu lược: bài này chỉ có một chỗ lược — `1.2` (`Taṁ suṇātha …pe…`) giữ đúng MỘT `…`, KHÔNG mở rộng `upayamatthisu, vadāmi` dù bản Anh Sujato đã ghim dịch đủ cả hai vế. Đây là lược của chính bản PāLI tại commit đã ghim. Cả 40 khoá khớp.
    · Ngoặc kép cân trên cả bài (đếm cả `“` và `”` toàn bài, kể cả ngoặc lồng nhau), 0 lỗi. NFC toàn bộ 0 lỗi. Không có khoá rỗng, không có `(…)` khoá chưa dịch, không có khoá tràn. Số khoá 40 = 40.
    · Dùng lại NGUYÊN VĂN, đối chiếu byte-for-byte: `1.1` <- `an10.118:1.1` · `1.14` <- `an10.118:2.4` · toàn bộ 22 câu kệ `2.1-6.6` <- `an10.118:3.1-7.6` (Pāli trùng tuyệt đối). Ngoài ra 31 khoá Pāli trùng nguyên văn với `an10.169` và 26 khoá với `an10.117` — bản Việt trùng khớp ở cả hai, nên cùng một công thức Pāli chỉ có MỘT cách dịch trong ba bài an10 này.

  Ngũ giới và điều răn, dùng nguyên văn `an10.171` (bài ngay cạnh đã có bản Việt) cho tám câu `1.4-1.10`: `pāṇātipāto` -> `Sát sinh` / `kiêng tránh sát sinh` · `adinnādānaṁ` -> `Trộm cắp` / `kiêng tránh trộm cắp` · `kāmesumicchācāro` -> `tà dâm` / `kiêng tránh tà dâm` · `musāvādo` -> `nói dối` / `kiêng tránh nói dối` · `pisuṇā vācā` -> `nói hai lưỡi` / `kiêng tránh nói hai lưỡi` · `pharusā vācā` -> `nói ác khẩu` / `kiêng tránh nói ác khẩu` · `samphappalāpo` -> `nói phù phiếm` / `kiêng tránh nói phù phiếm`. Ở bài này xưng `bhikkhave` (tỳ-kheo) thay cho `kho, brāhmaṇa` như ở `an10.169`, và đã giữ đúng. · `1.11`/`1.12` là cặp `abhijjhā`/`anabhijjhā` và `byāpādo`/`abyāpādo` không có hậu tố `-ā veramaṇī` -> `không tham lam` / `không sân hận` theo `an10.171`. · `1.13` -> `tà kiến` / `chánh kiến` · `kaṇhaṁ/sukkaṁ dhammaṁ` -> `pháp đen / pháp trắng` · `paṇḍito` -> `bậc trí`.

  Bất định đã ghi lại:
    (1) `0.3` `Orimasutta` dịch `Kinh Bờ Bên Này`, theo tiền lệ `an10.118:0.3` (`Orimatīrasutta` -> `Kinh Bờ Bên Này`) và Sujato dịch cả hai tiêu đề đều là *The Near Shore*. Hệ quả là HAI bài trong cùng quyển có tiêu đề tiếng Việt giống nhau — không tự đặt cách thứ N+1; nếu người biên tập muốn tách thì phải sửa cả hai cùng lúc, việc đó ngoài lát này.
    (2) `6.6` kết bằng `”ti.` — tầng đang phân hai cách: đo toàn tầng `sn`+`an` có 1.206 khoá kết bằng `”ti.` và 1.222 khoá kết bằng `”.`. Giữ `”ti.` vì đây là nguyên văn dùng lại từ `an10.118:7.6` (Pāli trùng tuyệt đối), sửa thành `”.` sẽ phá vỡ khớp byte với bài nguồn.
    (3) `1.14` PāLI không có `kho, brāhmaṇa` nên không thêm xưng gọi nào; lời nói của Đức Phật mở ở `1.1` và chưa đóng tới `6.6`, nên `1.14` không có dấu đóng ngoặc kép — đúng như bản PāLI.

  Cổng kỹ thuật: `technical_integrity` đặt 9.6 thay vì 10.0 vì lát này bị cấm chạy `npm run validate`, `npm test`, `npm run check` và `npm run build` (bốn lệnh này là cổng thật do CI chạy). Đã tự kiểm bằng node: JSON hợp lệ, 40/40 khoá khớp Pāli, 0 khoá thừa/thiếu/rỗng, NFC sạch, dấu lược khớp từng khoá, ngoặc kép cân. Coverage tầng Anh đo lại bằng hàm của kho nên không có blocker loại 1. Không sửa `content/meta/reference-gaps.yaml`, không sửa `source/`, không sửa `scripts/` hay `src/`.
