notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có 26 chương Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Hai tầng còn lại là Pāli root (authority) và bản Anh Bhikkhu Sujato đã ghim.
  - >-
    **Coverage tầng Anh: bài này không có Pāli có nội dung.** Cả 31 khoá đều dưới 40 ký tự (dài nhất là `an8.148-627:1.26` = 31 ký tự), nên theo đúng luật đo của `source/layers.yaml` (`substantivePaliMinChars: 40`) tỉ lệ phủ được xem là đầy đủ; tệp Anh Sujato có **30/31** khoá có chữ. Dù đo được 1,000, **đây là 1,000 của một bài không có đoạn văn** — ghi ra để không ai đọc nhầm là đã đối chiếu Anh ở mức câu chữ.
  - >-
    **Trùng nguyên văn 1:1 với `an7.645-1124`, đã `published` — 26 khoá lấy nguyên văn.** Đây là chính là danh sách *Dosassa … pamādassa abhiññāya …* rồi tới *pariññāya … paṭinissaggāya*, chỉ khác `Aṅguttara Nikāya 7`→`8` và `satta dhammā`→`aṭṭha dhammā`. Vì vậy toàn bộ danh sách *(sân, si, sân giận, oán hận, khinh miệt, ngạo mạn, ganh ghét, keo kiệt, gian xảo, quỷ quyệt, cứng cỏi, hung hăng, mạn, mạn quá, phóng túng, phóng dật)* và *(hoàn toàn hiểu rõ, đoạn tận hoàn toàn, từ bỏ, đoạn tận, hủy hoại, ly tham, diệt, xả, buông bỏ)* giữ **nguyên văn** bản Việt đã công bố — không dịch lại từ đầu, để hai bài không tự mâu thuẫn. Cùng cách dùng: `an3.183-352`, `an6.170-649`, `an10.267-746` (4 bài cùng một `peyyāla`).
  - >-
    **Tên phẩm dùng nguyên văn của `an7.645-1124:0.2`** — *11. Chuỗi Lặp Tham* — vì **cùng số phẩm 11** và cùng tên `Rāgapeyyāla`. Ba cách khác đang tồn tại trong kho cho chuỗi này: *Phẩm Chuỗi Lặp Tham* (5), *Chuỗi Lặp Tham* (3), *Ấp Tặng Tham* (1); lấy theo bản đã `published` cùng số phẩm.
  - >-
    **`0.3` giữ nguyên `~`.** Pāli ở khoá này là ký tự `~` (không có tiêu đề riêng); bốn bài cùng dạng đã merge — `an3.183-352`, `an6.170-649`, `an7.645-1124`, `an10.267-746` — đều giữ `~`, nên giữ nhất quán thay vì dịch hoặc bỏ trống.
  - >-
    **`:1.26` là khác biệt thật, không phải công thức.** Pāli `ime aṭṭha dhammā bhāvetabbā”ti.` (tám pháp, vì có thêm `māna`/`atimāna`/`mada`) → *tám pháp này cần được tu tập”.* Nguyên văn `an7.645-1124:1.26` nói *bảy pháp* nên **không** dùng lại; chỉ `Rāgapeyyālaṁ niṭṭhitaṁ` và `Aṭṭhakanipātapāḷi niṭṭhitā` là lấy lại (theo `an7.645-1124:2.3` và `an6.170-649:1.29`).
  - >-
    **Dấu lược — quyết định từng khoá.** `…pe…` ở `:1.1` và `:1.16`, dấu `…` rời ở 24 khoá còn lại; bản Việt giữ **một** `…` mỗi khoá, không mở rộng. **Ngoặc kép:** `:1.1` mở, `:1.26` đóng.
  - >-
    **Khoá số:** `:1.0` vắng mặt trong `all` nên không ghi; ngược lại `:1.28` là `Aṭṭhakanipātapāḷi niṭṭhitā` → *Kinh Chương Tám Lẻ hoàn tất.*, theo đúng loại của *Kinh Chương Bảy Lẻ* / *Kinh Chương Sáu Lẻ* đã có.
  - >-
    `technical_integrity` 9.6 vì bốn lệnh cổng **do coordinator chạy**, lát này đã tự kiểm mọi thứ còn lại bằng `_hvi.kiểm` (NFC, dấu lược khớp từng khoá, nháy kép cân trên cả bài, không Pāli lọt): `npm run validate` · `npm test` · `npm run check` · `npm run build`.
  - >-
    terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `11. Rāgapeyyāla` → «11. Phẩm Chuỗi Lặp Tham». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.
