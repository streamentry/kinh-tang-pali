notes: |-
  **Phạm vi và nguồn.** 70/70 khoá, thứ tự khoá = thứ tự Pāli, không khoá nào ngoài tập Pāli. Pāli root đã ghim là authority. Tầng English: Sujato phủ 34/34 segment Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = coverage 1,00; Sujato chỉ để trống khoá colophon `12.5`, nên `english-project` không có và không cần; `reference-gaps` không phát sinh. Tầng `vietnamese-current` vắng (chỉ có Pháp Cú). Bản Hòa thượng Thích Minh Châu của bài này chỉ ghi "giống như kinh 42 với cả bài kệ, với những thay đổi cần thiết", không có lời dịch từng đoạn, nên không đối chiếu được thuật ngữ từ đó. Vì vậy `triangulation` chỉ dựa Pāli + Sujato + tiền lệ của tầng dự án (an3.70, an8.45, an8.41, an8.44, an8.49).
  **Hai chỗ Sujato lệch Pāli đã ghim, Pāli thắng.** (1) `3.3`: Sujato liệt kê "Vaccha" và "Persia"; Pāli đã ghim là `vaṅgānaṁ` và `kambojānaṁ` (cùng danh sách mười sáu nước ở an3.70:28.3 và an8.45:4.3), nên dịch Vaṅga, Kamboja. (2) `3.2` `pahūtarattaratanānaṁ`: Sujato và an3.70 dịch "giàu đầy bảy báu"; Pāli không có chữ "bảy", nên dịch "dồi dào châu báu" như an8.45:4.2.
  **Số Pāli đã tự tính.** `paññāsa vassāni` (4.1) = 50 năm người = một ngày đêm cõi Tứ Đại Thiên Vương; `tiṁsarattiyo māso` = 30 ngày đêm = một tháng; `dvādasamāsiyo saṁvaccharo` = 12 tháng = một năm; `pañca vassasatāni` (4.4) = 5 × 100 = 500 năm trời. `vassasataṁ` (5.1) = 100 năm người = một ngày đêm cõi Ba Mươi Ba; `vassasahassaṁ` (5.4) = 1.000 năm. Chuỗi lược `6.1–6.4`: `dve vassasatāni` 200 · `cattāri vassasatāni` 400 · `aṭṭha vassasatāni` 800 (đúng thứ tự gấp đôi, từ 100 ở 5.1) · `soḷasa vassasatāni` (6.4) = 16 × 100 = 1.600 năm người = một ngày đêm cõi Tha Hóa Tự Tại; `soḷasa vassasahassāni` (6.7) = 16 × 1.000 = 16.000 năm trời. `soḷasiṁ` = một phần mười sáu. `soḷasannaṁ mahājanapadānaṁ` = mười sáu nước, đếm đủ 16 tên ở `3.3`. `aṭṭhamena aṅgena` (2.4) = điều kiện thứ tám; `paṭhamena` (1.9) = thứ nhất. Tám điều kiện: các khoá `7.1–8.2` liệt kê đủ sát sinh, trộm cắp, nói dối, rượu, dâm dục, ăn đêm, hoa và hương, giường cao.
  **Tiền lệ và đối chiếu Pāli trùng.** Trong chính bài: 5 nhóm Pāli trùng nguyên văn (`1.8`=`2.3`; `4.2`=`5.2`=`6.5`; `4.3`=`5.3`=`6.6`; `4.6`=`5.6`=`6.9`; `4.7`=`5.7`), cả năm Việt giống nhau, 0 nhóm Việt khác (`6.10` Pāli kết `āti` nên đứng riêng nhưng Việt cùng câu). Toàn tầng: 62 khoá có Pāli trùng nguyên văn với bài khác (kể cả khoá tiêu đề và colophon); 52 khoá dùng lại nguyên văn một bản đã có, 10 khoá khác có chủ ý (`1.6` Pāli chỉ khác một dấu phẩy so với an8.45:2.4; `3.2`, `3.5`, `4.5`, `4.6`, `5.1`, `5.5`, `5.6`, `6.8`, `6.9` theo an8.45 thay vì an3.70). Cụ thể khác an3.70 (cùng Pāli): `3.5`/`4.7`/`5.7`/`6.10` an3.70 dịch `mānusakaṁ rajjaṁ` là "quyền làm người" (5 khoá, cùng một bài), bản này dùng "vương quyền của loài người" của an8.45 vì `rajja` là quyền cai trị của vua; `4.5`/`5.5`/`6.8` an3.70 "Có trường hợp … được tái sinh trong hội", bản này "có khả năng xảy ra việc này" (`ṭhānaṁ vijjati`); `4.6`/`5.6`/`6.9` an3.70 "Nói này được nói có liên hệ đến", bản này "chính điều này là điều được nhắm đến khi nói rằng" (cũng là cách an8.45 chọn). Khác an8.41 (cùng Pāli ở `1.8`/`2.3`, 8 cặp "ta sẽ noi theo … về điều ấy, và ta sẽ có giữ trai giới", bỏ mất `imināpaṅgena`): bản này giữ "Với điều kiện này, ta noi theo các bậc A-la-hán, và trai giới của ta sẽ được giữ" của an8.45 (2 khoá). `1.6`–`2.2` theo an8.45:2.4–3.2 ("bỏ gậy và gươm, biết hổ thẹn, có lòng thương", "giường nhỏ hay tấm trải cỏ"), không theo an8.41 ("đặt gậy và kiếm xuống", "chiếc chiếu hay tấm cỏ"). `1.1` dùng nguyên văn an8.49:1.1. `7.1`–`12.4` theo an8.45:7.1–12.4 (cùng Pāli). Tên chư thiên: "Tứ Đại Thiên Vương" (25 lần ở an), "Ba Mươi Ba" (30 lần), "Tha Hóa Tự Tại" (8 lần ở an; dạng "Hóa Tự Tại" 10 lần, ở an3.70). Hô cách `visākhe` dịch "Visākha" (an: 73 lần "này Visākha" so với 34 lần "này Visākhā"); tên trong tự sự viết "Visākhā".
  **Thuật ngữ trai giới và đầu đề.** `uposatha` dịch "trai giới" theo an8.41, an8.44, an8.45 (cùng phẩm); toàn tầng an còn "ngày giới" (47 lần ở an) và "bố-tát". `aṅga` dịch "điều kiện" theo an8.41/an8.44/an8.45 (an3.70 dịch "phần/chi"). Đây là phân kỳ của tầng, chưa thống nhất; người biên tập nên quyết. Tên kinh `0.3` "Kinh Visākhā" (2/2 tiền lệ). Đầu đề `0.1` viết "Kinh Tăng Chi Bộ 8.43": toàn tầng an 903 khoá dạng này so với 367 khoá giữ "Aṅguttara Nikāya", nhưng ở an8 thì 53 giữ Pāli so với 20 dịch; chọn đa số toàn tầng.
  **Bất định của chính nguồn, ghi lại chứ không sửa thân kinh.** (a) `3.3` `etaṁ kalaṁ nāgghati soḷasiṁ`: đọc `etaṁ` là vương quyền nêu ở `3.2` không đáng một phần mười sáu của trai giới tám điều kiện. (b) `5.4` `tena saṁvaccharena vassasahassaṁ` không có chữ `dibbāni` (khác `4.4` và `6.7` có), nên Việt viết "Một nghìn năm như vậy" không thêm "trời"; `tena saṁvaccharena` vẫn chỉ năm của chư thiên vừa định nghĩa ở `5.2–5.3`. (c) `10.1` `etasmiṁ … antare`: "trong khoảng ấy", hiểu là trong phạm vi mặt trăng và mặt trời vận hành ở `9.2` (an3.70 dịch "nơi cõi này"). (d) `10.3` `siṅgīsuvaṇṇa`: giữ âm `siṅgī` vì chưa phân xử được nghĩa (Sujato "vàng núi"); `10.4` `jātarūpaṁ haṭakaṁ`: "thứ vàng tự nhiên được gọi là haṭaka", `haṭaka` giữ âm (Sujato "coruscant"). (e) `11.3` `candappabhā tāragaṇā ca sabbe` không có động từ hay phủ định; đọc là so sánh với `11.2` ("cũng như ánh trăng so với mọi đám sao"), không thêm "không sánh"; an3.70:39.3 dịch "ánh trăng chẳng thua gì ánh sao". (f) `8.2` `chamāyaṁ va sayetha santhate`: "trên đất được trải ra" theo an8.45:8.2. (g) `1.9` và `6.1–6.3` là dấu lược `…pe…` của Pāli: mỗi khoá Việt giữ đúng một `…`; riêng `1.9` Pāli kết `….` nên Việt kết ` ….` (dạng đa số của tầng).
  **Dấu lược.** Pāli có `…pe…` ở `1.9`, `6.1`, `6.2`, `6.3` (4 khoá), Việt giữ đúng một `…` ở cả 4; Pāli không có `…` ở khoá nào khác và Việt cũng không có.
  **Kiểm kỹ thuật.** Đã tự kiểm: tập khoá Việt = tập khoá Pāli 70/70, đúng thứ tự; nháy đơn ‘’ và kép “” khớp Pāli 70/70 khoá; dấu lược `…pe…` 4/4 → một `…`; 5 nhóm Pāli trùng trong bài 0 lệch; NFC; không khoá rỗng; không còn Pāli lọt sang bản Việt ngoài tên riêng và hai từ giữ âm `siṅgī`, `haṭaka`. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` nên `technical_integrity` đặt 9,6 và không tuyên bố technical gate đã pass.
