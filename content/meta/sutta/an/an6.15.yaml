  Nguồn: Pāli đọc bằng `pali.pal('an','an6.15')`, 33 khoá. Tầng Anh đã ghim tra bằng `source/upstream-manifest.json` (`sutta/an/an6/an6.15_translation-en-sujato.json`, tệp có trên đĩa), không suy từ tên thư mục.
  COVERAGE TẦNG ANH, đo theo `src/lib/canon/reference.ts`: substantive là Pāli có prose >= 40 ký tự và bỏ block `:0` ⇒ 13 khoá. Trong 13 khoá đó Sujato im lặng 2 khoá, là `an6.15:2.5` và `an6.15:4.5` (đúng hai khoá `papañcārāma` đầu tiên bị Sujato bỏ trống). 11/13 có prose Sujato đã ghim. Hai khoá còn lại được lớp lấp `content/translation/en/project/sutta/an/an6.15_translation-en-project.json` phủ, và `content/meta/en/an/an6.15.yaml` có `status: published` nên được tính (`source/layers.yaml:64` countsOnlyWhenStatus). Tỉ lệ 13/13 = 1,0, trên ngưỡng 0,8. Đây là ba bài của lát, mỗi bài một phép đo riêng, không suy từ nhau.
  ⚠ KHÔNG TỰ ĐÁNH BÀI CỦA MÌNH. Lớp lấp English của an6.15 do chính `OpenCode Space Bunny Free (agent)` chấm, trùng `assessed_by` với scorecard tiếng Việt này, nên nó KHÔNG phải một lớp đọc Anh độc lập. Vì vậy triangulation hạ xuống 8.6 thay vì 9.3 như hai bài anh em an6.14 và an10.21, và bài này không tuyên bố đã đối chiếu English cho toàn bộ: 11/13 đoạn có nội dung đối chiếu được với Sujato đã ghim, 2/13 chỉ có bản lấp của chính dự án. Bản lấp không chứa bất kỳ câu nào trong bản dịch Việt này, nên không có rủi ro tự đối chiếu.
  ⚠ Sujato dịch khung `vihāraṁ kappeti` thành "makes their bed" (xem `an6.15:1.2` bản Anh) và `an6.15:1.2` còn bịa thêm một câu "and die tormented by regrets" không có trong Pāli khoá đó. Pāli là authority: `kappeti` ở đây là trang bị ở trú, và cả bài nói về trạng thái tâm lúc mạng chung (`kālakiriyā`). Bản dịch theo cư trú, đúng như an6.14 đã làm.
  TIỀN LỆ ĐÃ ĐO (150.984 khoá Việt). `āvuso` trong phẩm Sāraṇīya: 40 "hiền giả" và 11 "này chư hiền"; riêng an6.14 là 11/11 "này chư hiền", còn an6.13, an6.27, an6.28, an6.41, an6.46, an6.51 đều dùng "hiền giả". Toàn bộ bộ an: `āvuso` 286 "hiền giả"; `bhikkhave` 6.920 "các tỳ-kheo". Bản này dùng "hiền giả" theo đa số đo được. MỐI LỆCH CẦN NGƯỜI GỘP XỬ: an6.14 đang `published` với 11 khoá "này chư hiền", nên hai bài liền kề có cùng một công thức Pāli mà hai cách Việt. Đây là đánh đổi có chủ đích, không phải lỗi; nếu biên tập muốn, phải sửa cả hai cùng lúc, và sửa theo đa số 40/11 thì an6.14.
  `:0.1` của bộ an: 898 "Kinh Tăng Chi Bộ N" / 318 để nguyên Pāli / 46 cách khác ⇒ dùng "Kinh Tăng Chi Bộ 6.15". `:0.2` `2. Sāraṇīyavagga` có 6/6 "2. Phẩm Hòa Kính" ⇒ y hệt an6.14:0.2.
  `:0.3` Anutappiyasutta: 0 tiền lệ trong toàn kho, dùng khuôn "Kinh + mô tả" của an6.14:0.3 (Bhaddakasutta → "Kinh Cái Chết Tốt Đẹp"). `Anutappiya` là không bị chê trách, không hối tiếc, khớp với `anutappā` ngay dưới.
  Tái dùng NGUYÊN VĂN của an6.14 ở bốn khoá có Pāli giống hệt: 2.8 với 3.4, 4.8 với 5.4, 5.3 với 6.3, 5.4 với 6.4. Sáu ngôi vị `…rāma` ở 2.1–2.5 và 4.1–4.5 cũng dùng nguyên văn bản dịch đã có của an6.14:3.1 và an6.14:5.1, cắt đúng tại chỗ Pāli lược.
  ⚠ CỐ Ý KHÔNG sao chép lỗi của an6.14 ở khổ kệ, đã đọc lại từng vế: an6.14:6.1 `Yo papañcamanuyutto,` dịch là "Kẻ say sưa hý luận," là mất `anuyutto` và đưa ý của vế sau sang; thêm nữa an6.14 thêm dấu `“` ở khoá 6.1 trong khi Pāli không có, làm bài đó lệch 4 `“` với 3 `”`. an6.14:6.2 `papañcābhirato mago;` dịch là "như loài thú mê say;" lấy hình ảnh loài thú từ bản Anh của Sujato, không có trong Pāli nào của bài này. Bản này tách đúng hai vế: 5.1 `papañcamanuyutto` là chuyên tâm ưa, 5.2 `papañcābhirato mago` là ưa thích mà kém hiểu biết.
  `nippapañcapade rato` dịch là "hoan nhuận trạng thái không hý luận" thay cho "vui trạng thái ly hý" của an6.14:7.2, để `papañca` giữ một nghĩa hý luận xuyên suốt bài như ở 2.5 và 4.5.
  DẤU LƯỢC: 2.1–2.4 và 4.1–4.4 mỗi khoá mang một `…` trần, vì Pāli lược đúng ở đó (`bhassārāmo hoti …`). Giữ đúng một `…`, không bung và không bỏ.
  NHÁY KÉP: Pāli có một `“` mở ở 1.2, một `”` đóng ở 6.4, và hai cặp `‘…’` ở 2.8 và 4.8. Bản dịch giữ y hệt, `ngoặc()` cân bằng.
