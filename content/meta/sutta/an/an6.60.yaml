notes: |-
  Dịch từ Pāli root đã ghim (98/98 khoá, khoá có tiền tố `an6.60:`; đủ khoá, đúng thứ tự Pāli), đối chiếu Bhikkhu Sujato cùng commit và đọc song song bản Việt nguyên bài của Hòa thượng Thích Minh Châu (bản không phân đoạn do SuttaCentral phân phối, chỉ để đối chiếu thuật ngữ, không copy).

  **Coverage English trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): mẫu số 76.** Bhikkhu Sujato phủ 70/76 = 0,9211, trên ngưỡng 0,80. Sáu khoá Sujato để trống là `3.6`, `8.11`, `8.12`, `9.6`, `9.8`, `9.10`; lớp lấp `english-project` của dự án phủ đúng sáu khoá ấy (published) nên cổng tính được 76/76, nhưng lớp lấp do dự án viết, không phải một cách đọc English độc lập; vì vậy bài chỉ tuyên bố đã đối chiếu English độc lập ở 70/76 khoá. Bản Việt hiện hành phân đoạn vắng hoàn toàn cho bài này (0/76; tại commit đã ghim chỉ Pháp Cú có). Không cần entry trong `content/meta/reference-gaps.yaml`.

  **Pāli trùng nguyên văn ngoài bài: 15 khoá, 945 cặp; 12 khoá dùng lại y nguyên văn bản đã có, 3 khoá khác.** Dùng lại: `0.2` (an6.61 “6. Phẩm Đại”), `1.1` (“Tôi nghe như vậy—”: trong `an6` 4 bài viết đúng dạng này; trong cả `an` dạng có dấu gạch ngang “vậy—” 8 bài · “vầy—” 9 · “vầy.” có chấm 29, gần ngang nhau nên theo bài láng giềng `an6.61`), `1.2` (= `an6.61:1.2`), `3.3`/`4.6`/`5.7`/`6.6`/`7.6`/`8.8` (“Không phải, hiền giả.”, 14 khoá `mn24` cho đúng chuỗi Pāli này, 6 khoá ở đây), `9.9` (= `mn31:20.7`), `11.3`, `11.5` (“Thứ sáu.” 276/282 khoá). Ba khoá khác: `2.5`, `3.8`, `8.4` (`So rāgānuddhaṁsitena cittena sikkhaṁ paccakkhāya hīnāyāvattati`), tầng chỉ có hai bản khác nhau (`sn17.9:1.9` “tham ám ảnh … bỏ sự tu tập, đi xuống chỗ thấp hơn” và `an4.122:5.8` “tham ái ám ảnh … từ bỏ sự học hành và lui về đời sống thấp hèn”); tôi theo `an4.122` ở động từ “ám ảnh” và theo đa số tầng ở vế sau (xem bên dưới).

  **Pāli trùng nguyên văn trong chính bài: 10 nhóm, 58 cặp, Việt giống nhau trong cả 10 nhóm (0 nhóm lệch).** Các nhóm: `2.3`=`3.6`; `2.4`=`3.7`=`8.3`=`8.12`; `2.5`=`3.8`=`8.4`; `3.3`=`4.6`=`5.7`=`6.6`=`7.6`=`8.8`; `4.2`=`4.9`; `5.2`=`5.10`; `6.2`=`6.10`; `7.2`=`7.9`; `8.2`=`8.11`; và tám khoá `sikkhaṁ paccakkhāya hīnāyāvattati.` (`4.3`, `4.10`, `5.3`, `5.11`, `6.3`, `6.11`, `7.3`, `7.10`). Hai khoá chỉ khác nhau ở dấu cuối trong Pāli (`9.6` kết `’”ti?` và `9.10` kết `’”ti.`) nên không thuộc nhóm trùng; Việt khác nhau đúng ở dấu cuối: `9.6` là câu hỏi `…’”?`, `9.10` là lời kể `…’”.`. Các khoá thiền `4.1`/`5.1`/`6.1`/`7.1` (và `4.8`/`5.9`/`6.9`/`7.8`) không trùng nhau vì mỗi thiền một công thức riêng.

  **Dấu lược.** Pāli có 17 khoá chứa `…pe…` và một khoá (`7.7`) chứa thêm một `…` trần; mỗi khoá giữ đúng số `…` như Pāli (cân bằng 98/98); không mở rộng công thức thiền, không nén thêm. Pāli bài này không có `(…)` ở khoá nào, bản Việt cũng không. Các khoá Pāli kết `…pe… ` (`4.2`, `4.9`, `5.2`, `5.10`, `6.2`, `6.10`, `7.2`, `7.9`) Việt kết `…` không thêm dấu chấm; khoá liền sau (`4.3` …) bắt đầu bằng động từ không chủ ngữ, tôi thêm “Vị ấy” để câu Việt tự đứng được.

  **Nháy.** Dấu nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá (98/98, đếm riêng bốn ký tự). Pāli để nháy chạy qua ranh giới khoá: `2.1` mở đến `3.2` đóng; `3.4` mở đến `4.5` đóng; `4.7`→`5.6`; `5.8`→`6.5`; `6.7`→`7.5`; `7.7`→`8.7`; `8.9`→`8.13`; `9.3`→`9.6`; `9.7`→`9.10`; `1.8`→`1.9`. Bản Việt giữ nguyên cấu trúc đó.

  **Số Pāli (tự tính).** `paṭhama`/`dutiya`/`tatiya`/`catuttha jhāna` = thiền thứ nhất, hai, ba, tư (4.1–7.1, khớp thứ tự 4–7 của bài); `caturaṅginiyā senāya` = quân có bốn binh chủng (catu 4), và `8.6` liệt kê đủ bốn tiếng voi · ngựa · xe · bộ binh; `ekarattiṁ` = một đêm; `Chaṭṭhaṁ` = thứ sáu (bài thứ sáu của phẩm Đại: `an6.55`–`an6.64` đếm Paṭhamaṁ … Dasamaṁ, `an6.61` là “Thứ bảy”). Không có số lớn (không sahassa, sata, kappa, tiṁsa), nên không có chỗ nào phải ghi bất định số.

  **Thuật ngữ, đo trước khi chốt.** `sikkhaṁ paccakkhāya hīnāyāvattati` → “từ bỏ sự tu học và quay về lối sống hạ liệt” (đo trên tầng: “quay về lối sống hạ liệt” 19 khoá · “quay về cuộc sống thấp kém” 10 · “lui về đời sống thấp hèn” 8; trong `an` “từ bỏ sự tu học … hạ liệt” lặp ở `an5.75`, `an5.76`, bài láng giềng). `rāgo cittaṁ anuddhaṁseti` → “tham ái ám ảnh tâm” (tầng: “ám ảnh” 2 bài `sn17.9`, `an4.122`; “làm nhiễm bẩn” 5 khoá ở `an5.76`, `sn20.10`, `mn67`; chọn “ám ảnh” vì `an4.122` có đúng cặp `rāgānuddhaṁsitena cittena sikkhaṁ paccakkhāya hīnāyāvattati`). `saṁsaṭṭha` → “giao du” (`sn16.5`, `snp3.9`; ngược nghĩa `asaṁsaṭṭha`). `abhidhammakathaṁ kathenti` → “đàm luận về Pháp” (`mn32:8.6`, `mn32:15.6`; Sujato “talking about the teachings”, Thích Minh Châu “Thắng pháp luận”; không dùng “Abhidhamma” vì đây là cuộc đàm luận của các trưởng lão, không phải Tạng Abhidhamma). `maṇḍalamāḷe` → “ngôi nhà tròn” (`dn2`, `ud3.8`; “gò đất bằng phẳng” ở `sn56.30` 3 khoá không theo). `kathaṁ opāteti` → “chen ngang vào câu chuyện” (`mn95:11.3`, `an5.112`). `soratasorato`, `nivātanivāto`, `upasantupasanto` → “rất hiền hòa, rất khiêm nhường, rất an tịnh” (đúng khuôn `mn21:10.1`; Sujato và Thích Minh Châu dịch “nhất trong những người …”, khác về mức nhưng cùng nghĩa). `vihārasamāpattīnaṁ lābhī` → “đạt được những sự an trú và chứng đạt” (`mn31:20.6`); `imāsañca imāsañca` → “này nọ”. `āvuso` → “hiền giả” (các dạng “hiền giả” 3.409/4.304 khoá có `āvuso` toàn tầng; “bạn” là cách riêng của `an6.61`, `an6.28`), `bhante` → “thưa Tôn giả” khi chư thiên nói với Tôn giả và “bạch Thế Tôn” khi các tỳ-kheo thưa với Đức Phật. `satthā` → “Bậc Đạo Sư” (`an` 56 khoá viết hoa/viết thường · “Đạo Sư” 34/123). `sabrahmacārī` → “đồng phạm hạnh”. `ābhidosikaṁ bhojanaṁ` → “đồ ăn để lại từ đêm trước” (theo `mn82:18.1` “cháo thô của đêm trước”). `nacchādeyya`/`chādessati` → “không còn làm … thấy ngon miệng” (`an5.48`).

  **Bất định, ghi để biên tập chọn (không thêm vào thân kinh).**
  (1) `10.3` `Na, bhikkhave, citto ciraṁ sarissati nekkhammassā`: nghĩa đen “Citta sẽ không nhớ đến sự xuất ly lâu” mâu thuẫn với văn cảnh (`11.1` `nacirasseva … pabbaji` — xuất gia không bao lâu sau); Sujato “soon Citta will remember renunciation”, Thích Minh Châu “không bao lâu sẽ nghĩ đến xuất ly”, tầng không có tiền lệ cho `ciraṁ sarissati`. Tôi hiểu `na ciraṁ` là “không lâu nữa mới” ⇒ “chẳng bao lâu nữa … sẽ nhớ đến”, theo cả hai bản tham khảo và văn cảnh.
  (2) `garuṭṭhāniyaṁ sabrahmacāriṁ` → “đồng phạm hạnh đáng kính trọng” (`dn33:2.1.128`, `dn34:1.6.78` “được tôn trọng”); Sujato dịch “in a teacher’s role”, Thích Minh Châu “đóng vai trò y chỉ sư” — hai cách đều nghiêng về “vị ở địa vị của bậc thầy”; tôi giữ nghĩa “đáng tôn kính” của tầng.
  (3) `cīrikasadda` → “tiếng dế” theo cả Sujato (“crickets”) lẫn Thích Minh Châu (“con dế”); từ điển còn cho nghĩa ve sầu, không phân xử được.
  (4) `bheripaṇavasaṅkhatiṇavaninnādasaddena` → “tiếng vang dội của trống lớn, trống nhỏ, tù và, trống tiṇava”. Tầng chưa nhất quán cho chuỗi này (`an4.114:4.2` “chũm chọe”, `an5.139:3.2` “tiêu … chave”, `mn125:12.25` “tiếng mõ”); tôi giữ danh xưng Pāli cho `tiṇava` thay vì chọn một loại nhạc cụ không chắc chắn.
  (5) `cetopariyāyaṁ` (`2.1`) → “diễn tiến tâm”: 0 tiền lệ trong tầng cho dạng này; Sujato “encompass another’s mind”.
  (6) `rāga` → “tham ái” theo `an4.122`; từ này cũng là tên thông dụng của `taṇhā`, nên người đọc cần dựa vào ngữ cảnh (`rāga` ở đây là tham dục, không phải `taṇhā`).
  (7) `apasādesi` (`1.8`) → “chê trách” (Sujato “rebuke”, `an6.46` “chê bai”); Thích Minh Châu “bất mãn”.
  (8) `lābhimhi` → “Ta là người đạt được” (dạng “ta là người có được”, không phải “ta vừa đạt”).

