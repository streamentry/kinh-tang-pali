notes:
  - >-
    **Bộ thứ hai của mười gốc tranh cãi, đổi hoàn toàn danh sách** — cùng câu
    hỏi, cùng cách mở, khác danh sách, nên đây là bài riêng chứ không phải bản
    lặp của `an10.42`.
  - >-
    **Năm thuật ngữ, tất cả đều 0 segment tiền lệ trong toàn corpus**, nên đặt
    mới và ghi lý do: `āpatti` → *vi phạm*; `garuka`/`lahuka` → *nặng*/*nhẹ*;
    `duṭṭhulla` → *thô trọng*; `sāvasesa` → *còn dư sót*; `sappaṭikamma` → *bị
    phê bình*. Cả năm đều có **tiêu ngữ phủ định** `an-`/`du-` đi kèm, nên bắt
    buộc phải ra cặp *có … / không có …*, đúng như Pāli. **Cảnh báo ghi lại:**
    lần trước tôi ghi tiền lệ cho chúng rồi mà tra lại thì `an4.243` và `mn127`
    **không tồn tại trong corpus** — đó là tiền lệ bịa, và bài này phải chứng
    minh mọi tiền lệ bằng số đếm.
  - >-
    **Lỗi lượt review bắt được, đáng ghi vì là mẫu lỗi:** tôi dịch `anāpattiṁ
    āpattīti` thành *gọi vi phạm phi pháp là vi phạm* — **tự mâu thuẫn ngay
    trong một cụm** (*vi phạm phi pháp* vừa là *vi phạm* vừa là *không phải vi
    phạm*). Đã sửa thành *gọi vi phạm không phải vi phạm là vi phạm*. Đồng thời
    bỏ chữ *trình bày* ở chín vế sau, vì `an10.37:1.3` dùng *trình bày gọi* một
    lần ở đầu rồi bỏ — lặp *trình bày gọi* mười lần nghe như cường điệu.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
