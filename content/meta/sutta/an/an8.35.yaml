  PĀLI TRÙNG NGUYÊN VĂN — DÙNG LẠI NGUYÊN VĂN BẢN DỊCH ĐÃ CÓ. Bài này là bản
  thu ngắn của đúng danh sách "tám loại hóa sinh nhờ bố thí" đã có ở `dn33` (các khoá
  `3.1.97` – `3.1.137`), khác nhau ở chỗ cắt segment. Tôi đòi lại bản dịch đã
  `published` của `dn33` cho mọi cụm Pāli trùng **byte**: `So yaṁ deti taṁ paccāsīsati`
  (4 chỗ, nguồn `dn33:3.1.99/107/116/129`), `Tassa sutaṁ hoti:` (2 chỗ,
  `dn33:3.1.108/117/130`), `:2.4` (`dn33:3.1.109`), `:1.7` (`.102`), `:2.6` (`.111`),
  `:3.10` (`.124`), `:4.4` (`.131`), `:4.6` (`.133`), `Tañca kho sīlavato vadāmi, no
  dussīlassa` (3 chỗ, cộng dấu chấm phẩy ở `:4.10`; `dn33:3.1.104/113/126/135`),
  `vītarāgassa, no sarāgassa` (`dn33:3.1.136`), `cetopaṇidhi vītarāgattā`
  (`dn33:3.1.137`). Đo được **29/55** khoá của bài này trùng nguyên văn với một khoá
  đã dịch ở nơi khác. Trong chính bài có **8** nhóm Pāli trùng nguyên văn (tính
  trên 36 nhóm Pāli khác nhau trong 55 khoá) và **0** nhóm nào bản Việt lệch nhau.

  THUẬT NGỮ — MỌI SỐ ĐẾM ĐƯỢC, GHI CẢ HAI PHẠM VI KHI CHUNG CHO ĐA SỐ KHÁC NHAU.
  `dānūpapatti` → *hóa sinh nhờ bố thí* (3 chỗ ở `dn33`; 0 chỗ ở `an` trước đây).
  `dānaṁ deti samaṇassa vā brāhmaṇassa vā` → *bố thí cho sa-môn hay Bà-la-môn*
  (tầng: `sa-môn` chữ thường 11 khoá so với `Sa-môn` 6; `an` chưa có tiền lệ).
  `Idha, bhikkhave` → *Ở đây, này các tỳ-kheo* (1.262 khoá / 552 tệp toàn tầng; riêng
  `an`: 1.076 khoá so với *Ở đây, hiền giả* 2). `Idha pana, bhikkhave` → *Lại nữa, này
  các tỳ-kheo* (50 khoá ở `an`). `Katamā aṭṭha?` → *Thế nào là tám?* (21 khoá /
  18 tệp; *Tám loại ấy là gì?* 0 chỗ). `So yaṁ deti taṁ paccāsīsati` → *Cái gì bố thí,
  người ấy mong được báo đáp* (4/4). `Tassa evaṁ hoti:` → *Người ấy nghĩ:* (24/111;
  đa số tầng là *Vị ấy nghĩ* 48, nhưng chủ thể ở đây là người bố thí chứ không phải
  tỳ-kheo, nên tôi theo vế trước và ghi lý do). `Tassa sutaṁ hoti:` → *Người ấy đã
  nghe:* (25/25) và `Tassa sutaṁ hoti—` → *Người ấy nghe được—* (6/6) — hai dạng Pāli
  khác nhau, tôi giữ khác nhau. `dahati/adhiṭṭhāti/bhāveti` → *đặt tâm vào đó, quyết
  định tâm ấy, tu tập tâm ấy* (4 chỗ ở `dn33`), nhưng đa số tầng là *an trú tâm ấy,
  thiết lập tâm ấy, tu tập tâm ấy* (14 chỗ ở `mn120`); tôi chọn `dn33` vì **cùng một
  danh sách tám loại hóa sinh** và cùng chủ thể là người bố thí, còn `mn120` nói Đức
  Phật. `hīne vimuttaṁ, uttari abhāvitaṁ` → *thoát ly chỗ thấp, chưa được tu tập hơn
  nữa* (4/4). `sahabyataṁ upapajjati` dạng khẳng định → *sinh vào hội chư thiên X*
  theo đúng an8.36 (6/6 khoá, bài liền kề cùng phẩm `Dānavagga`, liệt kê đúng sáu
  cõi trời này theo cùng thứ tự); riêng `:1.10` đối tượng không phải chư thiên nên
  dùng *cùng chỗ với* để khớp với lời mong ước ở `:1.7`. Đa số tầng cho dạng khẳng
  định là *sinh vào chỗ đồng cư với* (11/55) — khác, ghi lại ở đây.

  Sáu cõi trời theo **đúng an8.36**: Tứ Đại Thiên Vương (tầng 35 khoá / 16 tệp so với
  *Tứ Đại Vương Thiên* 3 khoá / 1 tệp của `dn33`; riêng `an` là 3/3), Ba Mươi Ba
  (118 khoá / 43 tệp so với *Tam Thập Tam Thiên* 11 khoá của `dn33`), Yama (12 khoá
  so với *Yāma* 7), Đề Noa (6 khoá, `an8.36:7.2`; nhưng *Tusita* 8 khoá ở tầng — tôi
