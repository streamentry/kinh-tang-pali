  *Nimmānaratī* 5), Hóa Tự Tại (27 khoá so với *Tha Hóa Tự Tại* 14). `brahmakāyikā` →
  *Phạm thân sanh sơ khởi*: an8.36 không có cõi này nên tôi theo `dn33:3.1.131` vì
  **Pāli trùng byte**; đếm được *Phạm chúng* 8 khoá và *Phạm thân sanh sơ khởi*
  7 khoá — gần như ngang, tôi ghi bất định này ở đây thay vì tự đặt. `devā` →
  *chư thiên* (1.541 khoá / 451 tệp so với *thiên thần* 90 khoá / 24 tệp của `dn33`).
  `khattiyamahāsālā` → *Sát-đế-lợi đại phú hộ*: `dn33:3.1.100/102` dùng đúng chữ này
  và Pāli trùng; đếm trên các khoá Pāli chứa `khattiya` thì *Sát-đế-lợi* 42 khoá và
  *Sát-đế-lỵ* 40 khoá — gần như ngang, riêng `an8` chỉ dùng *Sát-đế-lợi*, tôi theo.
  `cetopaṇidhi visuddhattā` → *nguyện vọng của tâm thành tựu nhờ sự thanh tịnh*
  (3 chỗ `dn33`). `dīghāyukā vaṇṇavanto sukhabahulā` → *sống lâu, dung sắc đẹp, nhiều
  hạnh phúc* (`dn33` 3 khoá; `mn120` dùng *trường thọ, dung sắc đẹp, đầy an lạc*
  5 khoá — tôi theo `dn33` cho cả bộ để ba câu trong bài giống nhau). `Pañcamaṁ` →
  *Thứ năm.* (125/126 khoá ở `an`).

  TIÊU ĐỀ — ĐO CẢ HAI PHẠM VI. `:0.2` `Dānavagga` → *4. Phẩm Cho Dâng*: **9/9**
