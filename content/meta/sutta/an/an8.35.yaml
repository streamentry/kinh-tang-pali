  BẤT ĐỊNH CÒN LẠI, GHI Ở ĐÂY CHỨ KHÔNG THÊM VÀO THÂN KINH. (1) `brahmakāyikā` chọn
  *Phạm thân sanh sơ khởi* theo `dn33:3.1.131`; *Phạm chúng* và *cõi Phạm thiên* là
  hai dạng còn đang dùng ở tầng. (2) Ba động từ `dahati/adhiṭṭhāti/bhāveti` theo
  `dn33` chứ không theo đa số `mn120`, lý do đã nêu ở trên. (3) `tusitā` chọn *Đề Noa*
  theo an8.36 dù đa số tầng là *Tusita*. (4) `Pañcamaṁ` ở `:4.14` là số thứ tự phần
  trong bộ, không phải số mục trong bài: bài này có bốn khối đánh số 1 – 4 rồi khoá
  này.

  SỐ PĀLI, TỰ TÍNH. `aṭṭhimā` = aṭṭha 8 → *Có tám loại hóa sinh nhờ bố thí này* (`:1.1`);
  `aṭṭha` = 8 → *Thế nào là tám?* (`:1.2`) và *đây là tám loại hóa sinh nhờ bố thí*
  (`:4.13`); `pañcahi kāmaguṇehi` = pañca 5 → *năm dục* (`:1.5`); `Pañcamaṁ` = pañca 5,
  thứ tự phần → *Thứ năm.* (`:4.14`). `tāvatiṁsā` ở `:3.4` là **tên cõi trời** chứ
  không phải số viết ra trong Pāli, nên tôi dịch theo tên (*Ba Mươi Ba*) và không
  thêm chữ số nào. **Không khoá Việt nào ở bài này viết số Ả-rập**, trừ số hiệu bài ở
  `:0.1`. Phép đo số hiệu chuẩn của kho chạy xanh 9/9, nhưng **không đo được gì cho bài
  này**: bảng từ khoá số của phép đó chỉ có dạng ghép như `Ekanavutito`,
  `Catunnavutito`, mà `an8.35` chỉ có `aṭṭha` 8 và `pañca` 5. Nên con số "0 lệch" ở
  bài này là **phép rỗng**, không phải kết quả kiểm.

  NĂM PHÉP KIỂM TỰ VIẾT, KÈM MẪU SỐ. (1) Tập khoá Việt bằng tập khoá Pāli — 55/55,
