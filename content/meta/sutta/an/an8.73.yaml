notes: |-
  Dịch từ Pāli root snapshot SuttaCentral/Bilara đã ghim. Đầy đủ 81/81 khoá từ an8.73:0.1 đến an8.73:12.4, đúng thứ tự Pāli, không khoá thừa.

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE ANH:
  - Coverage Anh Sujato trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): 59/65 = 0,9077, vượt ngưỡng 0,80. Sáu khoá Sujato để trống là 10.4, 10.6, 10.8, 10.10, 10.12, 11.3 (cùng một mệnh đề dẫn "yo cāyaṁ, bhikkhave, bhikkhu evaṁ maraṇassatiṁ bhāveti:"); bản lấp english-project (published, 6 khoá) bù vào nên cổng tính 65/65, nhưng bản lấp không phải cách đọc Anh độc lập, nên chỉ 59/65 khoá là được đối chiếu Anh độc lập. Mệnh đề ở sáu khoá này đã có tiền lệ Pāli trùng nguyên văn ở an6.19 (4 khoá) và được đối chiếu với Sujato ở 10.2 và 11.1 của chính bài; vì vậy Pāli vẫn tự đứng vững.
  - Tầng Việt hiện hành (vietnamese-current) vắng ở commit đã ghim vì bilara chỉ phân phối Pháp Cú. Bản nguyên bài của Hòa thượng Thích Minh Châu (SuttaCentral html_text, ghi công theo chân trang tệp: Hòa thượng Thích Minh Châu dịch Việt, Bình Anson hiệu đính; nguồn tra cứu toàn văn, không dựng cột) được dùng để đối chiếu thuật ngữ và cấu trúc, không sao chép.

  THUẬT NGỮ VÀ TIỀN LỆ (đã đếm trên tầng Việt hiện có):
  - maraṇassati → "tỉnh thức về sự chết": theo bài song song Pāli gần trùng nguyên bài là an6.19 (`Paṭhamamaraṇassatisutta`, cùng nhan đề Pāli) và an6.20; 31 khoá chứa "tỉnh thức về sự chết" (+3 viết hoa đầu câu) so với "niệm tưởng về sự tử" 3 khoá (+1 nhan đề) chỉ ở an8.74. Bản Thích Minh Châu viết "niệm chết". Chọn "tỉnh thức về sự chết" cho cả nhan đề (`Kinh Tỉnh Thức Về Sự Chết (Một)`, trùng nguyên văn an6.19:0.3). BẤT ĐỊNH ĐÃ GHI: an8.74 (kề bên, cùng phẩm) đang dùng "niệm tưởng về sự tử"; hai bài kề nhau trong cùng phẩm vì thế lệch thuật ngữ — chỉ khác cách dịch `sati` (tỉnh thức/niệm), không đổi nghĩa giáo lý, nhưng người biên tập nên chọn một cách cho cả an6.19–20 và an8.73–74. Đây là lý do `terminology` hạ xuống 9,0 và `ambiguity_integrity` xuống 9,2.
  - amatogadhā amatapariyosānā (1.6) → "chìm đắm trong vị bất tử, với bất tử làm cứu cánh": 11 khoá của tầng dùng dạng này (an5.61, an5.62, an10.56, an10.57, an8.74…) so với "lấy quả vị vô tử làm mục đích, lấy quả vị vô tử làm điểm tối thượng" 4 khoá (an6.19, an6.20). Đây là khoá duy nhất trong 64 khoá có Pāli trùng với tầng mà tôi KHÔNG dùng lại nguyên văn bản gần nhất (an6.19:1.6/an6.20:1.3); lý do: dạng 11 khoá là đa số, và "vô tử" là cách riêng chỉ có ở một cặp bài. Phần đầu câu ("Tỉnh thức về sự chết, này các tỳ-kheo, khi được tu tập và được làm cho sung mãn") giữ y an6.19:1.6; "thì có quả lớn, có lợi ích lớn" theo an8.74:1.3.
  - bhagavā → "Đức Thế Tôn" ở 1.2, 1.5 (bài song song an6.19/an6.20: "Đức Thế Tôn"); toàn tầng có "Đức Phật nói:" 61 khoá so với "Đức Thế Tôn nói:" 13 khoá. Chọn "Đức Thế Tôn" để cả bài nhất quán với 1.1 (Pāli cũng là bhagavā) và với an6.19; không đổi nghĩa.
  - 1.1 "làng Ñātika" (dùng lại nguyên văn an6.19:1.1 và an6.20:1.1; an8.74 viết "Nātika, trong ngôi nhà bằng gạch"): chữ "làng" là cách gọi của tiền lệ, Pāli chỉ có `nātike`.
  - `tadantaraṁ … yadantaraṁ` → "trong khoảng thời gian … tôi …" (8 khoá an6.19, dùng nguyên văn); `saṅkhāditvā ajjhoharāmi` → "nhai và nuốt"; `ekapiṇḍapātaṁ` → "một phần thức ăn khất thực". `upaḍḍhadivasaṁ` → "nửa ngày" (4.5, 10.7) và `upaḍḍhapiṇḍapātaṁ` → "nửa phần thức ăn khất thực" (6.5, 10.11): 0 tiền lệ trong tầng, dịch trực tiếp từ Pāli theo mẫu `ekapiṇḍapātaṁ`; Sujato "half a day", "half an almsmeal".

  SỐ PĀLI (tự tính): rattindivaṁ = ngày và đêm; divasaṁ = một ngày; upaḍḍha- = một nửa; eka- = một; `cattāro pañca ālope` = 4 và 5 (bốn năm) miếng; `ekaṁ ālopaṁ` = một miếng. Không có số lớn nào cần phép tính.

  BẤT ĐỊNH ĐÃ GHI:
  - 1.7 `Bhāvetha no tumhe, bhikkhave, maraṇassatin”ti.` Dạng `bhāvetha` vừa có thể là hiện tại vừa là mệnh lệnh ngôi hai số nhiều; bản Pāli ms ở đây kết bằng dấu chấm. Tôi dịch thành câu hỏi ("các ông có tu tập … không?"), theo Sujato ("But do you develop mindfulness of death?") và theo an6.19:1.7 (cùng cấu trúc, có dấu hỏi), vì các vị tỳ-kheo trả lời ngay "con có tu tập" và Đức Thế Tôn hỏi tiếp "Yathā kathaṁ pana tvaṁ". Bản Thích Minh Châu dịch mệnh lệnh ("các Thầy hãy tu tập niệm chết"); hai cách không đổi giáo nghĩa, chỉ đổi giọng hỏi–khuyên.
  - 10.2 `yvāyaṁ` (yo + ayaṁ) khác `yo cāyaṁ` ở 10.4 trở đi (thêm `ca` "và"); bản Việt đều viết "vị tỳ-kheo nào tu tập … như vầy", đúng theo an6.19:8.2/9.1 (tiền lệ cũng không phân biệt). 10.6 và 10.10 (Pāli `yo` chữ thường sau dấu `;`) viết thường "vị tỳ-kheo nào …", còn 10.4/10.8/10.12/11.3 (sau dấu chấm) viết hoa — cùng nghĩa.

  DẤU CÂU VÀ DẤU LƯỢC:
  - Dấu nháy đơn ‘ ’ và nháy kép “ ” khớp Pāli từng khoá (0 lệch / 81 khoá; kiểm cả bốn loại dấu). Pāli không có `…` ở bất kỳ khoá nào nên bản Việt cũng không có `…` nào (0/81).
  - Pāli có 11 nhóm khoá trùng nguyên văn trong chính bài (mỗi nhóm 2–8 khoá, tổng 52 khoá trong nhóm); cả 11 nhóm đều dịch y hệt nhau, 0 nhóm lệch.
  - Pāli trùng nguyên văn với tầng Việt đã có: 64/81 khoá; 63/64 khoá dùng lại nguyên văn, 1/64 khoá (1.6) khác có chủ ý như đã nói.

  SO KHỚP VỚI NGUỒN BA LỚP: bản Anh Sujato dịch `maraṇassati` là "mindfulness of death" và `sati` là "mindfulness"; các tỳ-kheo trả lời bằng `bahu vata me kataṁ assā` ("I could really achieve a lot") — bản Việt giữ "việc tôi làm được sẽ thật nhiều". Bản nguyên bài của Hòa thượng Thích Minh Châu gộp và tóm lược phần 10.x–11.x thành một đoạn, nên không dùng làm khuôn cấu trúc; cấu trúc theo Pāli từng khoá.

