notes: |-
  Sửa lan 2026-10-13: khoá an3.63:3.1, 7.1, 9.1, 11.1 (Pāli trùng nguyên văn "Acchariyaṁ, bho gotama, abbhutaṁ, bho gotama"), "Thật khó tin, này ông Gotama, thật hy hữu, này ông Gotama!" → "Thật kỳ diệu, này ông Gotama, thật hy hữu, này ông Gotama!"; căn cứ: acchariya = kỳ diệu, không phải "khó tin" (không có ý hoài nghi); đồng bộ với an3.60:17.1 (cùng công thức, cùng người nói ngôi "ông") và sn44.7:8.1, an6.52:8.1 ("Thật kỳ diệu … Thật hy hữu"). Bốn khoá trùng nguyên văn nay giống nhau.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.6 — `sabrahmakaṁ` “Brahma” → “Phạm thiên” (29/30 khoá cùng công thức dùng “Phạm thiên”); câu theo cấu trúc đa số: “chứng ngộ bằng thắng trí thế giới này cùng với chư thiên, Ma vương và Phạm thiên, cùng quần chúng sa-môn, bà-la-môn, chư thiên và loài người, rồi tuyên thuyết điều ấy” (bản trước “chúng sinh với các sa-môn bà-la-môn…” và “trình bày cho người khác” lệch `sassamaṇabrāhmaṇiṁ pajaṁ sadevamanussaṁ` và `pavedeti`). Giữ “Ma vương” như hiện hành (cả “Ma vương” 10 khoá và “Māra” 18 khoá đều có tiền lệ).
