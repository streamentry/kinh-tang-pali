notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim (`11c9d708978cde8ba61096d8a75f7ddfb846f639`), bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  - |-
    **Kiểm uddāna của `_selftest.ts` báo sai ở bài này, và tôi không sửa bản dịch để làm nó im.** Pāli ở khoá cuối ghi rõ ``an/an9.18:4.2` là `Aṭṭhamaṁ``, tức là thứ tự trong phẩm khởi lại từ `Paṭhamaṁ`, chứ không phải số cuối của uid. Tôi đã đọc số trước và số sau trong cùng phẩm để chốt: `an/an9.17:2.5` là `Sattamaṁ` và `an/an9.19:4.6` là `Navamaṁ` — đúng chuỗi của phẩm `Sīhanādavagga`. Công cụ lại so thứ tự ấy với số trong uid và báo lệch. Đây là **false positive có sẵn**: quét toàn tầng, **1539 / 2702** tệp Việt dự án có khoá cuối mang số thứ tự sẽ bị cùng phép so đó báo lệch (`sn/sn14.19:4.2` `Navamaṁ` → *Thứ chín* với uid 19; `sn/sn12.21:1.16` `Paṭhamaṁ` → *Thứ nhất* với uid 21; `an/an5.264:2.5` `Cuddasamaṁ` → *Thứ mười bốn* với uid 264). Tôi đã đối chiếu lại từng tệp bị báo với chính Pāli của nó: **0 / 1539 là sai thật** — đều là cách dịch đúng. Sửa bản dịch để làm cổng im là đổi đúng thành sai, nên tôi giữ *Thứ tám* và ghi lỗi ở đây.
  - |-
    **Năm khoá đã có bản Việt trùng nguyên văn, tôi dùng lại nguyên văn — và đây là bài có giá trị tái dụng cao nhất lát.** Bài `an/an3.70` (Cẩm Lê, câu hỏi của Visākha) nói đúng hai aṅga này của ngày giới:
    `1.4` trùng `an/an3.70:19.2`, `1.5` trùng `:19.3`, `1.6` và `2.3` trùng `:19.4` và `:26.3` → *Với chi này, ta học theo các bậc A-la-hán; ngày giới của ta sẽ được giữ như vậy.*;
    `2.1` trùng `an/an3.70:26.1`, `2.2` trùng `:26.2` → *Trọn đời, các bậc A-la-hán từ bỏ giường ngủ cao sang lớn lao, kiêng tránh giường ngủ cao sang lớn lao, nằm ngủ chỗ thấp trên giường nhỏ hay tấm trải cỏ*;
    `3.1` trùng `dn/dn26:28.20` cho câu biến mãn từ bi.
  - |-
    **`aṅga` → *phần*, và tôi ghi vì có hai cách đang tồn tại trong tầng.** `an/an3.70:28.3` dịch `navahaṅge` là *tám phần ấy* và `an/an3.57:4.3` là *năm phần ấy*, nên tôi theo **phần**. (Tầng cũng có *yếu tố* cho `yant-factor`, nhưng đó là ngữ cảnh khác.) Vì vậy `Navaṅguposathasutta` → *Kinh Ngày Giới Chín Phần*, `navahi aṅgehi` → *chín phần này*, `navahaṅgehi` → *chín phần này*. `uposatho` → *ngày giới* theo `an/an3.70:27.1`.
  - |-
    **`mahapphalo hoti mahānisaṁso mahājutiko mahāvipphāro` dùng lại nguyên văn từ `an/an3.70:27.2`** → *có quả lớn, có lợi ích lớn, có sự rực rỡ lớn, có sự tỏa rộng lớn*. Bốn vế xuất hiện ở `1.1`, `1.2`, `4.1` và tôi giữ nguyên ở cả ba chỗ để bài không tự lệch với chính nó.
  - |-
    **Vì bài kể **hai** trong chín aṅga, tôi không kết câu.** `1.7` là *Với phần thứ nhất này, vị ấy được đầy đủ ….* (`…pe….` nên giữ một `…`), `2.4` là *Với phần thứ tám này, vị ấy được đầy đủ.*, `3.2` là *Với phần thứ chín này, vị ấy được đầy đủ.* — số thứ tự đúng theo câu mà Đức Thế Tôn tự xác trong mỗi khoảng (`Iminā paṭhamena aṅgena`, `Iminā aṭṭhamena aṅgena`, `Iminā navamena aṅgena`), không phải số tôi tự đặt.
  - |-
    **Tên phẩm đã tra tiền lệ, có một chỗ phải ghi.** `Sīhanādavagga` có *2. Phẩm Tiếng Hồi* (2 bài: `an/an9.15/16`) và *2. Phẩm Sư Tử Hống* (1 bài: `an/an9.17`) — tôi theo đa số. `Navaṅguposathasutta` **0 tiền lệ** → mới đặt. Sujato dịch bản Anh là *The Sabbath with Nine Factors*, dùng *sabbath* còn tầng đã chọn *ngày giới* cho `uposatho`, nên tôi theo tầng.
