notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 3.2 — «bậc tỳ-kheo» → «vị tỳ-kheo» (idha bhikkhave bhikkhu, dạng chiếm đa số của tầng), đồng bộ cả 1.5 và 2.2; 3.2–3.6 — «sanh khởi» → «sinh khởi» (cách viết của phần còn lại của bài); 3.4 — «hôn trầm thụ miên» → «hôn trầm và buồn ngủ» (thinamiddha, 127+ khoá của tầng so với 2). Giữ nguyên cấu trúc câu «biết rõ: ‘Trong ta có …’ khi trong ta có …» của cả năm khoá 3.2–3.6, vì bản đa số viết lại thành «Khi trong mình có …, vị ấy biết: ‘Trong tôi có …’» — đổi trật tự và đổi «ta» thành «tôi» so với Pāli (atthi me … pajānāti), không có lợi về nghĩa.
