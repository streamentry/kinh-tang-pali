notes:
  - >-
    **Bài dài nhất chương (59 segment) và là bài *lập luận*, không chỉ liệt
    kê**: mỗi mục kết bằng `Tassa therānukampitassa … vuddhiyeva pāṭikaṅkhā
    kusalesu dhammesu, no parihāni` — *chỉ trông chờ **tiến triện**, không phải
    suy giảm*. Vì vậy mỗi mục dài bốn segment, và tôi **lặp nguyên văn vế kết
    luận** cho cả mười mục: đó là thứ tự lập luận của bài.
  - >-
    **`therānukampita … majjhimānukampita … navānukampita` → *Được các vị tỳ-
    kheo Trưởng lão thương xót, được các vị tỳ-kheo Trung lão và các vị tỳ-kheo
    Tân khái thương xót…***: `anukampita` **0 segment tiền lệ**, đặt mới;
    `therā` → *tỳ-kheo Trưởng lão* theo `an4.160:7.1` và `an4.180:6.2`, còn
    `majjhimā`/`navā` chỉ suy ra theo tương ứng tuổi tác. `vattabbaṁ
    anusāsitabbaṁ` → *đáng được khuyên nhắc, đáng được khuyên dạy* — tiền lệ chỉ
    có `an4.111:4.10` (*khuyên bảo hay dạy dỗ*), và tôi giữ hai động từ riêng vì
    Pāli có **hai** phép; ghi lại đây là quyết định có chủ đích, không phải sót
    tiền lệ.
  - >-
    **`Nāthavagga` → *Phẩm Bảo Hộ*** (0 segment tiền lệ, đặt mới): `nātha` là
    người bảo hộ, chỗ nương tựa — và Sujato dịch tên phẩm là *A Protector*. Cả
    phẩm đúng ngữ nghĩa đó: `nāthakaraṇā dhammā` → *mười pháp làm nên sự bảo
    hộ*, `sanāthā … mā anāthā` → *hãy sống có chỗ bảo hộ, đừng sống không chỗ
    bảo hộ*, `anātho viharati` → *sống không chỗ bảo hộ là khổ đau*. Vì ba cụm
    này lặp ở `an10.17` và `an10.18`, tôi dùng **cùng một cách** cho cả ba bài;
    `an10.19`–`an10.20` dùng `ariyāvāsā` → *chỗ ở của bậc Thánh* (cũng 0 tiền
    lệ), đối xứng với `senāsana` → *chỗ ở*.
  - >-
    **`vatāyaṁ` là 0 segment tiền lệ trong corpus, nên tôi phải tự đặt, và đây
    là quyết định quan trọng nhất của bài.** Nghĩa là *“gọi là”* — `Sīlavā
    vatāyaṁ bhikkhu` = *vị tỳ-kheo được gọi là “Có giới thật”*, không phải *“Có
    giới thật” vậy*. Vì vậy tôi đặt **danh xưng trong ngoặc kép đơn** và để
    `’ti` thành **dấu chấm phẩy**: *vị tỳ-kheo có giới, …; vị ấy được gọi là ‘Có
    giới thật’; các vị tỳ-kheo Trưởng lão cũng nghĩ rằng vị ấy đáng được khuyên
    nhắc…*.
    **Bản đầu tôi sai ở cả mười vế** theo ba kiểu, và đây là ba lỗi đáng ghi vì
    chúng đều do **dán văn bản dài vào chỗ không có chỗ cho nó**: (1) **lặp tiền
    ngữ** — ra *“Lại nữa, này các tỳ-kheo, Lại nữa, này các tỳ-kheo, …”* ở chín
    segment, vì Pāli của vế `vatāyaṁ` bắt đầu bằng `‘Sīlavā vatāyaṁ…` chứ không
    có `Puna caparaṁ`; (2) **dấu chấm kép** — ra *“…nhận**.;** vị ấy…”* và
    *“…gần gũi**.,** được gọi là…”*; (3) **chữ hoa sai chỗ** — *“…thì **Các** vị
    tỳ-kheo Trưởng lão…”* giữa câu. Cả ba đã sửa, và sửa bằng cách cho `vat()`
    tự cắt tiền ngữ và tự cắt dấu chấm, thay vì vá tay.
  - >-
    **`8.1` và `8.2` là cặp duy nhất Pāli tách `navāpi` ra segment riêng**
    (`majjhimāpi bhikkhū …` ở cuối `8.1`, `navāpi …` nguyên vẹn ở `8.2`), nên
    `8.2` **không** có dấu lược — đã kiểm, và bản đầu tôi có dấu lược ở đó.
    **`11.3` cũng vậy**: Pāli lược giữa `therānukampitassa` và `no parihāni`,
    nên có `…`.
  - >-
    **`āhuneyya`… không có ở đây; `attā` → *tôi* ở `1.1`** vì `Evaṁ me sutaṁ` là
    lời người kể, và tôi dùng **nguyên văn `an10.1:1.1`** (*Tôi nghe như vầy—*,
    cùng Pāli, cùng quyển) — 385 segment trong corpus giữ dấu gạch ngang ở đây,
    chỉ 102 đổi thành dấu hai chấm. `Idamavoca bhagavā` → *Đức Phật đã nói như
    vậy*, `Attamanā te bhikkhū` → *Các vị tỳ-kheo ấy hoan hỷ, tin nhận lời Đức
    Phật dạy* (0 segment, đặt mới, nhưng là khuôn cố định của sutta).
  - >-
    **Lỗi chính tả do lượt review bắt được:** `6.1` ghi *các công việc lớn
    **nhở*** thay vì *lớn **nhỏ*** — `an10.50:8.1` (đã `published`) ghi đúng,
    nên đây là lỗi của bản chương 2 chứ không phải của corpus.
