notes: |-
  Đã đọc hết lát `vc/p46.txt` trước khi viết; dùng `pre` = `an9.40:`.
  **Coverage Anh Sujato: 29/29 = 100%** trên Pāli có nội dung; ngoài ra 9/10 khoá < 40 ký tự có prose. Tầng Việt hiện hành vắng ở commit đã ghim (26 tệp, toàn bộ là Pháp Cú). `budsas.org` chỉ là tra cứu toàn văn.
  **19 khoá có Pāli trùng nguyên văn ở bài khác; chỉ 4 cặp dùng lại NGUYÊN VĂN, 15 cặp CỐ Ý dịch khác** — lý do ở hai mục ngay dưới: số đo đa số của lớp `an` và bài kề cùng phẩm `an9.37` thắng bản trùng ở `mn`/`dn`. `0.2` theo `an9.32:0.2` · `0.3` trùng byte-for-byte `sn20.9:0.3` (cùng tên Pāli `Nāgasutta`) · `4.4` trùng byte-for-byte `an5.76:18.12` · `4.5` trùng byte-for-byte `an5.76:18.13` · `5.10` trùng byte-for-byte `dn4:23.9` (`tam thiền …`).
  **Hai khoá có Pāli trùng nhưng CỐ Ý dịch khác, và đây là chỗ đáng ghi nhất.** (1) `5.11` Pāli trùng byte-for-byte `dn5:27.10`, nhưng bản Việt đã có ở đó là *và tứ thiền* — rút gọn mất `upasampajja viharati` và thêm *không khổ không lạc, với niệm thanh tịnh nhờ xả*, phần đó **không có trong Pāli khoá này**. Đã dịch đầy đủ thành *vị ấy chứng và an trú tứ thiền*. (2) `5.9` trùng `dn26:28.15` nhưng bản Việt ở đó chỉ có **một** dấu lược trong khi Pāli khoá này có **hai** (`…pe…` + `…`); đã viết lại *Do tầm và tứ lắng dịu … vị ấy chứng và an trú nhị thiền …* cho khớp số dấu.
  **Công thức āyatana bám `an9.37`** (cùng phẩm Mahāvagga, bài kề, đã published) thay vì bản trùng ở `dn15`/`mn77`, vì đo trong lớp `an` cho *xứ vô số hư không* 19 lần > *xứ hư không vô biên* 4 lần, *xứ vô số thức* 19 > *xứ thức vô biên* 4. Ghi rõ điểm chưa thống: `an9.37` dùng *ý niệm* còn lớp `an` đa số là *suy niệm* (41 > 12) — tôi theo `an9.37` để cả phẩm nhất quán.
  **Tên phẩm đo theo Pāli:** `Nāgasutta` chỉ có 1 tiền lệ trong lớp `an` (`an4.114` → *Kinh Voi Naga*) nhưng đó là bản dịch SAI theo đúng cái bẫy BRIEF_VI3 §1.6 nêu: `an4.114:1.1` là `rañño nāgo rājabhoggo` (voi của vua), không phải rồng. Ở `an9.40` `nāgo` chắc chắn là voi (`hatthīpi hatthiniyopi hatthikalabhāpi hatthicchāpāpi`). Lưu yêu cầu *vàng ròng/bạc ròng* cho `jātimantara/rattalohita` và *trộm cướp* cho `corā`, đã ghi rõ để người gộp lát sửa nếu có ý kiến khác.
  **Dấu lược:** `5.9` có hai, `5.10`/`6.3`/`6.4`/`6.5` mỗi khoá một; phía Pāli và phía Việt khớp từng khoá.
  **Lỗi bắt được ở lượt review đối kháng, đã sửa:** (1) `1.1`/`1.3` bản nháp dịch `purato purato gantvā` thành *đã đi trước đến trước* — vô nghĩa bằng tiếng Việt; đã sửa thành *đã đi tới trước*. (2) `1.1`–`1.3`/`2.2`/`3.2` để *voi non, voi con* cho cả `hatthikalābha` lẫn `hatthicchāpa`, lặp nghĩa; đã tách thành *voi mới sinh* và *voi non*. (3) `5.4` dùng *xao động cùng hối tiếc* thay vì cụm glossary `xao động và hối tiếc`; đã theo glossary. (4) `5.7` đảo thứ tự `savitakkaṁ savicāraṁ vivekajaṁ pītisukhaṁ`; đã sửa thành *có tầm, có tứ, có hỷ lạc do ly sinh*.
  **Bất định đã ghi:** `attamano soṇḍaṁ saṁharati` — Sujato dịch *happily relieving his itches*, tức đã cộng thêm ý *gãi ngứa* (ý này đến từ `3.2` `sākhābhaṅgaṁ bhañjitvā … parimajjitvā` ở chính khoá đó, không có ở `5.8`/`5.12`/`6.2`/`6.7`). Tôi giữ nghĩa chữ của Pāli ở cả năm chỗ: *vui vẻ giơ vòi lên*.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
