notes:
  - >-
    Chín cặp *không nên mong muốn / đây là pháp tánh*, cộng chín vế tóm lược đảo
    ngược.
  - >-
    **Thuật ngữ lấy từ tiền lệ, mỗi chữ một nguồn:** `avippaṭisāra` → *không sợ
    hãi* (0 segment, đặt mới — mắt xích đầu, đứng trước `hoan hỷ` nên là *thong
    thả không sợ hãi*, không phải *dũng cảm*); `pāmojja` → *hoan hỷ*
    (`an3.70:4.6`, `an3.95:5.3`); `pīti` → *hỷ* (cùng hai bài); `passaddhi` →
    *khinh an* (`an3.95:5.3` *thân khinh an*); `sukha` → *lạc*; `sammāsamādhi` →
    *chánh định* (128 segment); `yathābhūtañāṇadassana` → *sự thấy biết như
    thật*, `nibbidāvirāga` → *sự chán ngại và ly tham*, `vimuttiñāṇadassana` →
    *giải thoát tri kiến* (đều của `an5.168:1.3`–`1.5`).
    **Biến thể tiền lệ đã ghi để không lẫn:** `dn34:2.2.3` có cùng dãy nhưng
    dịch `passaddhi` là *lắng yên* và `cittaṁ samādhiyati` là *được định tĩnh*.
    Chương này theo `an3.95:5.3` — vì `an3.95:5.3` là **cùng Pāli** với
    `an10.2:1.10`–`1.18`, nên gần hơn. `nibbindati`/`virajjati` theo
    `an4.177:2.3` (*chán nản* / *ly tham*), khác `dn34` (*nhàm chán*).
  - >-
    **`na cetanāya karaṇīyaṁ` → *không nên ý nghĩ*** (0 segment, đặt mới):
    `cetanāya karaṇīya` là *cố ý hướng tới*, nên mệnh đề này cấm **chủ ý tạo
    ra** một trạng thái tâm, chứ không phải cấm mong muốn nói chung.
  - >-
    **Lượt review bắt được lỗi slop rõ nhất của cả lô.** Trước đó tôi dịch 9 câu
    mong muốn bằng **một khuôn máy móc** `'{X} của ta hãy xảy ra'`, và khuôn đó
    sinh ra *"ta cảm thọ lạc **của ta** hãy xảy ra"*, *"tâm **của ta** được định
    tĩnh **của ta** hãy xảy ra"* — **"của ta" lặp trong một câu**, đúng mẫu lỗi
    mà nhiệm vụ cấm. Đã viết lại **từng câu** thủ công theo `an3.101:8.1` (*Cầu
    mong ta…*): *Cầu mong cho ta có sự không sợ hãi*, *Cầu mong cho thân ta được
    khinh an*, *Cầu mong cho tâm ta được định tĩnh*… Bổ sung phép kiểm chặn `của
    ta của ta` trong generator.
  - >-
    **Còn một lỗi ngữ pháp do khuôn:** câu trả lời thứ năm tôi viết *ta cảm thọ
    lạc* trong khi Pāli `sukhaṁ vediyati` là ngôi thứ ba — phải là *vị ấy cảm
    thọ lạc*. Đã sửa. Và `2.10` tôi dịch *đưa qua bờ bên kia, đưa đến bờ bên
    kia* — lặp động từ; `apārā pāraṁ gamanāyā` là *đi từ bờ bên này sang bờ bên
    kia*, đã sửa, và `paripūrenti` (làm cho trọn vẹn) chứ không phải *viên mãn
    trong*.
  - >-
    **`abhisandenti` → *thấm nhuần*** (0 segment, đặt mới): `abhisandanti` =
    thấm vào, truyền sang. `apāra`/`pāra` theo 37 segment tiền lệ (*bờ bên
    kia*); `dn16:1.33.2` đã dịch `apārā` là *ở bờ bên này* — dùng nguyên văn.
  - >-
