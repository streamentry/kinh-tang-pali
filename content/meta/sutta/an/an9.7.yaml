notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim (`11c9d708978cde8ba61096d8a75f7ddfb846f639`), bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  - |-
    **Ở bài này kiểm uddāna *không* kích hoạt, nhưng tôi vẫn xác minh thứ tự thật của Pāli.** `an/an9.7:3.7` là `Sattamaṁ`, khớp số 7 của uid; hai bài anh em `an/an9.6` và `an/an9.8` chưa có tệp Việt dự án nên tôi không dùng chúng làm chốt. Chuỗi `Sattamaṁ → Aṭṭhamaṁ → Navamaṁ` của phẩm đã được xác nhận ở `an/an9.17`, `an/an9.19` và `an/an9.8:3.7`.
  - |-
    **Công thức năm điều và chín điều dùng lại nguyên văn từ `dn/dn33:2.1.27` và `mn/mn76:51.3`**, không tự dịch lại: *vị tỳ-kheo đã hết lậu không thể cố ý đoạt mạng sinh vật; không thể lấy của không cho với tâm trộm cắp; không thể thực hành pháp dâm; không thể nói dối có chủ ý; không thể hưởng các dục bằng cách tàng trữ của cải, như thời còn là cư sĩ trước kia*. Bốn vế chân lệch thêm `chandāgatiṁ/dosāgatiṁ/mohāgatiṁ/bhayāgatiṁ` lấy từ `dn/dn29:26.8` → *không thể hành động thiên lệch vì ưa thích / vì sân hận / vì si mê / vì sợ hãi*.
  - |-
    **Danh sách công thức `yo so bhikkhu arahaṁ khīṇāsavo vusitavā …` dùng lại nguyên văn từ `mn/mn76:51.2`** → *một vị tỳ-kheo là bậc A-la-hán, các lậu hoặc đã tận, đã hoàn thành phạm hạnh, đã làm xong việc cần làm, đã đặt gánh nặng xuống, đã đạt mục đích của mình, đã đoạn tận những trói buộc vào sự hiện hữu, đã giải thoát nhờ chánh trí*. `dn/dn29:26.7` có cách khác (*đã hoàn thành phạm hạnh, làm xong việc cần làm, đặt gánh nặng xuống, đạt mục đích của mình, dứt sạch kiết sử trói buộc vào tái sinh*); tôi theo `mn76` vì đó là bài đối thoại vua–tỳ-kheo, cùng ngữ cảnh. Người biên tập nên chọn một cho toàn bộ `dn29` và `mn76`.
  - |-
    **Bốn khoá đầu dùng lại nguyên văn theo mẫu có sẵn.** `1.1` trùng `sn/sn10.2:1.1` → *Một thời, Đức Phật trú tại Rājagaha, trên núi Gijjhakūṭa*; `1.3` theo `dn/dn10:1.3.3` → *Sau những lời chào hỏi thân thiện và đáng ghi nhớ…*; `3.1` theo `mn/mn121:3.5` → *“Thật vậy, này Sutavā, ông đã nghe đúng, đã thọ trì đúng, đã tác ý đúng, đã ghi nhớ đúng.*
  - |-
    **Một lỗi thật lượt review đối kháng bắt được, đã sửa.** `2.1` `…rājagahe viharāmi giribbaje.` Nháp đầu tôi viết *trên núi Chuồng*, tức là dịch `giribbaja` thành Gijjhakūṭa. Đó là sai: `giribbaja` là **vùng chân núi quanh Rājagaha**, không phải Linh Thứu, và `1.1` của chính bài này đã nói rõ `gijjhakūṭe pabbate`. Tiền lệ: `mn/mn5:31.4` dịch cụm tương đương là *đang ở ngay tại Rājagaha, thành phố nằm giữa các dãy núi*, còn `magadhānaṁ giribbaje` → *trong vùng núi của dân Magadha*. Tôi đã sửa thành *ở ngay tại Rājagaha này, trong vùng chân núi*.
  - |-
    **`3.1–3.6` là sáu khoá nhỏ, tôi dịch theo đúng từng khoá chứ không gộp.** Pāli chia `3.1` (xác nhận) · `3.2` (*Pubbe cāhaṁ … vadāmi*) · `3.3` (mở đầu chín điều) · `3.4` (năm điều rồi bốn về chân lệch) · `3.5` (lặp lại *Pubbe cāhaṁ*) · `3.6` (chốt *imāni nava ṭhānāni*). Số là **chín** ở `3.3` và **chín** ở `3.6`, không phải chín ở `3.6` cộng thêm gì nữa.
