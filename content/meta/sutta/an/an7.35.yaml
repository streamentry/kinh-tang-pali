notes: |-
  Đã đọc hết lát `vc/p46.txt` trước khi viết; dùng `pre` = `an7.35:` (trùng uid ở bài này).
  **Coverage Anh Sujato: 22/22 = 100%** trên Pāli có nội dung (≥ 40 ký tự, loại block `:0`); ngoài ra 16/17 khoá < 40 ký tự cũng có prose. Không khoá nào bị bỏ trống, không cần ghi nhận gap. Tầng Việt hiện hành vắng ở commit đã ghim: bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú — đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **11 khoá có Pāli trùng nguyên văn ở bài khác (đếm bằng script trên toàn tầng); 10 cặp dùng lại NGUYÊN VĂN — 8 nguyên văn byte-for-byte, 2 chỉ chỉnh dấu câu — và phần lớn đến từ cặp song song `an7.34` (Paṭhamasovacassatāsutta) của chính bài này.** `0.2` theo `an6.31:0.2` (`4. Phẩm Chư Thiên`) · `1.2` trùng byte-for-byte `an7.34:1.2` · `1.3` trùng `an7.34:1.3` (*Là bảy nào?*) · `1.4` trùng byte-for-byte `an7.34:1.4` · `1.5` trùng byte-for-byte `an7.34:1.5` · `1.6` theo `an6.21:3.7` · `2.1` theo `mn32:17.1` · `2.2` trùng byte-for-byte `an4.171:7.2` · `3.1` trùng byte-for-byte `an5.176:4.1`.
  **Câu kết bài đo, không đoán:** `Catutthaṁ.` trong lớp `an` đã dịch là *Thứ tư.* 96 lần và *Thứ bốn.* 21 lần ⇒ chọn **Thứ tư.** Cụm `saṅkhittena bhāsitassa evaṁ vitthārena` có 5 tiền lệ nguyên văn trong lớp `an` (`an4.171:7.2`) ⇒ giữ nguyên *nghĩa rộng* cho `2.2`/`2.14`/`3.2`/`3.14` cho nhất quán, dù `mn114` dùng *nghĩa chi tiết*.
  **Dấu lược:** `…pe…` và `…` rút về đúng MỘT `…` theo luật của `_hvi.lược`; tổng lát này là 8 dấu ở phía Pāli và 8 dấu ở phía Việt.
  **Lỗi bắt được ở lượt review đối kháng, đã sửa:** (1) `1.1` bản nháp ghi *suốt đêm được ưa chuộng* — thừa chữ *suốt*, đã bỏ. (2) `2.5`/`3.5`/`2.13`/`3.13` gộp `bhūtaṁ tacchaṁ kālena` thành *đúng thật … đúng lúc*; đã tách đủ ba vế thành *thật lòng, đúng đắn, đúng lúc*.
  **Một khoá trùng nhưng cố ý dịch khác:** `1.7` trùng `sn2.20:12.2` (*đi nhiễu quanh ta theo hướng bên phải*) — tôi lấy *đi vòng bên phải* từ `an7.34:1.7` để hai bài trong cặp nói cùng cách, và thêm `”ti.` vì Pāli khoá này có dấu nháy đóng còn `an7.34` thì không có.
  **Bất định đã ghi:** không có điểm nào chưa phân xử được ở mức thay đổi nghĩa. `abhikkantāya rattiyā abhikkantavaṇṇā` là danh từ tán dương của vị thiên (được ưa chuộng và được ca ngợi trong đêm), tôi dịch với vai trò danh từ; Sujato lược mất vế này.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
