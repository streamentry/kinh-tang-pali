notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 3.2 (`Atha kho āyasmā anuruddho eko vūpakaṭṭho
  appamatto ātāpī pahitatto viharanto nacirasseva …`) — viết lại theo công thức đa số toàn tầng:
  «Rồi Tôn giả … sống một mình, viễn ly, không phóng dật, nhiệt tâm, tinh cần; chẳng bao lâu, ngay
  trong đời này, … tự mình chứng ngộ bằng thắng trí, chứng đạt và an trú cứu cánh vô thượng của
  đời phạm hạnh — mục đích mà vì đó các thiện nam tử chân chánh xuất gia từ bỏ gia đình, sống
  không gia đình». Bản cũ thiếu «Rồi», «ngay trong đời này» và «ātāpī», lại có cụm «các người con
  thiện nam chánh đáng», «đi vào không nhà» không phải cách dịch của Pāli.
