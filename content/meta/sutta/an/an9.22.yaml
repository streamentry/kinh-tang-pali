notes: |-
  Dịch từ Pāli root snapshot SuttaCentral/Bilara đã ghim (source/suttacentral.lock.json). Đầy đủ 74/74 khoá từ an9.22:0.1 đến an9.22:12.11, không khoá thừa.

  ĐỐI CHIẾU NGUỒN VÀ COVERAGE:
  - Coverage bản Anh Bhikkhu Sujato tại cùng commit đã ghim, đo trên Pāli có nội dung (>= 40 ký tự, bỏ khối :0): 49/49 = 100%, không có gap nào. Lớp english-project của bài này chưa có nội dung nên cổng chỉ tính một mình Sujato; đây là tham chiếu Anh độc lập duy nhất. Ở các khoá …pe… Sujato để dấu …; riêng 1.2 Sujato mở rộng (…) thành "Listen and apply your mind well, I will speak" còn bản Việt giữ nguyên dấu lược của tầng Pāli.
  - Tầng Việt hiện hành (vietnamese-current) vắng ở commit đã ghim do bilara chỉ phân phối Pháp Cú; đã đọc bản nguyên bài của Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn để đối chiếu thuật ngữ (Ngựa chưa được điều phục; thắng pháp, thắng luật), không căn lề vào segment.
  - Bài song song đã published trong cùng bộ: an3.140 (Assakhaḷuṅka), an3.141 (Assaparassa), an3.142 (Assājānīya) là phiên bản rút gọn của chính công thức chín nhóm này. Dò Pāli trùng nguyên văn ở cấp khoá với phần còn lại của bộ Tăng Chi: 40 khoá của bài trùng ở ít nhất một bài khác, 261 cặp, trong đó 33 cặp Việt khác. Các khác biệt đều có chủ ý: thêm "là" ở câu "Như vậy... là kẻ hoang/bậc người ..." và "Và thế nào ... là ..." cho đủ câu; đổi "bậc tỳ-kheo" thành "vị tỳ-kheo" cho đúng đa số tầng và nhất quán trong bài; câu hỏi "Katame ca" viết "Và ba ... là gì, này các tỳ-kheo?" theo an9.23 liền kề; "Khi được hỏi ... vị ấy giải đáp được mà không lúng túng" bỏ "Nhưng" vì Pāli 5.4/6.4/9.5/12.5 trùng byte nhau và tiền lệ an3.140:6.4, an3.141:6.4, an3.142:4.5 không có "Nhưng" (3 so với 2).
  - Trong chính bài: 10 nhóm Pāli trùng nguyên văn (tổng 31 khoá), 0 nhóm có bản Việt khác nhau.

  THUẬT NGỮ VÀ CÔNG THỨC:
  - khaḷuṅka → "hoang" (assakhaḷuṅka: ngựa hoang; purisakhaḷuṅka: kẻ hoang) theo an3.140 đã published; assaparassa/purisaparassa → "tuyệt hảo" (an3.141); bhadda assājānīya/purisājānīya → "thuần thục tốt" (an3.142). Sujato dùng wild colt, excellent horse, fine thoroughbred. Thích Minh Châu dùng "chưa được điều phục"/"được điều phục"/"hiền thiện thuần lương", khác tiền lệ dự án; không đổi để giữ đồng bộ với ba bài song song.
  - javasampanno → đầy đủ tốc độ; vaṇṇasampanno → đẹp đẽ; ārohapariṇāhasampanno → cân đối hoàn hảo (an3.140 đến an3.142; an4.259 dùng "thân hình cân xứng", không đổi). Công thức "Idamassa javasmiṁ/vaṇṇasmiṁ/ārohapariṇāhasmiṁ vadāmi" dùng lại nguyên văn an3.140-142: "Điều này, Ta nói, là tốc độ/sự đẹp đẽ/sự cân đối hoàn hảo của vị ấy".
  - Abhidhamme abhivinaye pañhaṁ puṭṭho → "khi được hỏi về giáo pháp hay đạo hạnh" theo an3.140, an3.141, an3.142 (7 khoá). Bất định: an10.17, an10.18 và các bài khác dịch cùng cặp từ là "Vi pháp và Vi luật" (6 khoá), mn dịch "Thắng Pháp và Thắng Luật"; Sujato dịch "teaching or training". Đây là chỗ thuật ngữ tầng chưa thống nhất, ghi nhận để người biên tập quyết, không sửa các bài đã published.
  - saṁsādeti → lúng túng; vissajjeti → giải đáp (an3.140-141). Năm hạ phần kiết sử (pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ) theo đa số tầng (66 so với 16 "kết trói buộc hạ giới"); opapātiko ... tattha parinibbāyī anāvattidhammo tasmā lokā → "được hóa sinh, nhập Niết-bàn tại đó, không còn trở lại từ thế giới ấy" theo dn29:25.10. Công thức diệt lậu dùng lại nguyên văn an3.142:4.3 (cùng Pāli), khớp dạng thường gặp của tầng.
  - Tên phẩm Sattāvāsavagga → "3. Phẩm Trú Xứ" đúng 9 khoá cùng bộ. Tiêu đề :0.1 theo "Kinh Tăng Chi Bộ 9.22" là dạng đa số của tầng (923 so với 388 "Aṅguttara Nikāya"), khác với các bài an9.2x liền kề còn mang dạng cũ.
  - Không có số Pāli cần tự tính ngoài "năm hạ phần kiết sử" (pañca = 5) và "ba" (tayo = 3); nhóm "ba ... và ba" ở 1.1 gồm sáu loại ba mục, khớp bố cục 2 đến 12.

  DẤU NGOẶC VÀ DẤU LƯỢC:
  - Dấu nháy kép và nháy đơn khớp Pāli từng khoá (1.1 mở “, 12.10 đóng ”; 4.2, 5.2, 6.2 mỗi khoá cân nháy đơn); đã in cặp Pāli và Việt đọc đối kháng cả 74 khoá.
  - Dấu lược khớp từng khoá: 1.2 giữ "(…)" trần đúng như Pāli (khoá này chỉ có hai chữ Pāli rồi (…), phần "sādhukaṁ manasi karotha, bhāsissāmī" bị lược); 5.2 và 6.2 mỗi khoá một "…" từ …pe…; 7.2, 8.2, 9.1, 10.2, 11.2, 12.1 mỗi khoá một "…" từ …pe….

  KIỂM TRA KỸ THUẬT:
  - Chưa chạy npm run validate, npm test, npm run check, npm run build trong phiên dịch này (bị cấm chạy cổng); technical_integrity đặt 9.6, không tuyên bố technical gate đã pass. Cần chạy đủ bốn lệnh đó trước khi gộp.
