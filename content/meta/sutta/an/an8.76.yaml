notes: |-
  Dịch từ Pāli root đã ghim (khớp byte-for-byte với dump 57 khoá), tham chiếu bản Anh Bhikkhu Sujato tại cùng commit. Coverage Anh Sujato trên Pāli có nội dung: 21/21 = 100%. Tầng Việt hiện hành vắng ở commit đã ghim (chỉ có Pháp Cú). Bài song ngữ Dīghajāṇu (an8.54) CHƯA được dịch trong tầng, nên các công thức trần thế chỉ có trừ chỉ mục ở an4.62.
  **Số khoá: 57/57 đúng dump header. Pāli trùng nguyên văn: 23/57 khoá, 20 dùng lại NGUYÊN VĂN.** `0.2` trùng 6/6 → «8. Phẩm Song Trùng»; `1.1` trùng nguyên văn an8.75:1.1 («Có tám loại thành tựu, này các tỳ-kheo.»); `1.2` đa số 4/5; `6.1`/`6.3` trùng 2/2 với an3.117 («Thế nào, này các tỳ-kheo, là thành tựu về giới?» / «Đây được gọi là thành tựu về giới.»); câu thơ `10.1`–`13.4` trùng an8.75/an4.53/an4.54/an5.33/an8.47/an8.48/mn91 — `11.1` 1-1-1 chọn an8.75 (bài cặp); `13.1` đa số 2/4 (mn91 «Vì lợi ích và hạnh phúc ngay đời này,» — ăn với `13.2` mn91 «và hạnh phúc ở các đời sau,»); `13.3`/`13.4` trùng nguyên văn an8.75.
  **`0.3` "Dutiyasampadāsutta" trùng nguyên văn an5.92:0.3** → tái dùng đúng «Kinh Sự Viên Mãn (2)» theo luật trùng khớp. Ghi nhận căng: an8.75 (bài cặp, "Paṭhamasampadāsutta") đã dịch «Kinh Tám Loại Thành Tựu» — hai bài cặp mang hai tên khác nhau trong tầng; luật trùng thắng nên tôi giữ «Kinh Sự Viên Mãn (2)», thân bài vẫn theo «thành tựu» của an8.75/an3.117. Đề nghị coordinator xem có nên quy hóa tiêu đề hai bài cặp về một mẫu không — đó là sửa ở an5.92/an8.75, ngoài phạm vi lát này.
  **Thuật ngữ theo an8.75 (bài cặp):** danh sách `1.3` tái dùng đủ 8 «thành tựu…»; `cāga` → «bố thí» (khác an8.49 cùng lát dùng «thí xả» theo chu kỳ Visākhā — mỗi bài bám tiền lệ riêng của mình, ghi rõ tại đây); `kulaputto` → «người con nhà tử» (an4.62). `1.3` của an8.75 kết bằng «—», của an8.76 kết bằng «.» theo Pāli → đóng câu bằng chấm.
  **3 hình ảnh mới trong tầng (0 tiền lệ, tra trước khi đặt):** `tulādhāro` → «người cầm cân» (4.3); `udumbarakhādī` → «kẻ ăn quả đề» (4.5, theo nghĩa Sujato "fig-eater"); `ajeṭṭhamaraṇaṁ` (4.6) — từ khó, không có bản Anh gốc khác tại commit; chọn đọc theo Sujato ("starving themselves to death") → «sẽ tự đói mình cho đến chết», bất định ở mức hình ảnh, không chạm giáo nghĩa; alternative reading ghi tại đây: có thể hiểu «chết như bậc trưởng tử không hưởng của». `bhogā honti uṭṭhānavīriyādhigatā…` (2.2) tái dùng chuỗi an4.62:3.2 đã có, thêm vế `te ārakkhena guttiyā sampādeti` → «vị ấy canh giữ, bảo vệ tài sản ấy» theo công thức an8.48.
  Cổng kỹ thuật do coordinator chạy; đã tự kiểm: JSON hợp lệ, NFC, đủ 57 khoá, parity dấu lược, không chép Pāli. Ghi chú cho coordinator: an8.75:4.3 «được tuyên thuyết với cái tên là chân điến,» (tái dùng nguyên văn ở `12.3`) dùng chữ «chân điến» khó hiểu — đáng rà lại ở an8.75.

