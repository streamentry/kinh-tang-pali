notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.3, 3.3, 4.3, 5.3 — ‘Tôi bị nhấn chìm bởi sự tái sinh… tôi bị khổ ngập lụt, bị khổ hoành hành’ → ‘Tôi đang bị sinh, già, chết, sầu, bi, khổ, ưu, não vây phủ; đang bị khổ nhấn chìm, bị khổ chi phối’, dùng lại cách dịch của `mn30`/`mn67` cho cùng Pāli (18 khoá): bản cũ dịch `otiṇṇa` là ‘nhấn chìm’ nhưng lại dịch `dukkhotiṇṇa` là ‘ngập lụt’ và `dukkhapareta` là ‘hoành hành’, lệch tiền lệ ở cả ba từ; khoá 2.4, 3.4, 4.4, 5.4 — ‘mong sao sự chấm dứt của khối khổ này được hiện rõ!’ → ‘mong sao tôi có thể chấm dứt toàn bộ khối khổ này.’ (bản cũ bỏ mất `kevalassa`; 18/23 khoá cùng Pāli dùng cách dịch mới); khoá 5.6 và 5.7 — ‘trần trụi’ → ‘lộ liễu’ vì `duppāruta` là mặc che không đúng cách chứ không phải khoả thân (cùng Pāli ở `an5.76` dịch ‘lộ liễu’), giữ ‘phụ nữ’ vì bài dùng nhất quán cho `mātugāma` (5.7, 5.10); giữ nguyên khoá 5.8 vì bản hiện hành bám thuật ngữ của bài (‘sự học hành’, ‘lui về đời sống thấp hèn’ lặp ở 2.10, 3.14, 4.12, 5.8).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 5.8 (cùng 2.10, 2.11, 3.14, 3.15, 4.11, 4.12, 4.13, 5.9) — `sikkhaṁ paccakkhāya` «từ bỏ sự học hành» → «từ bỏ sự tu học» (`sikkhā` là sự rèn luyện, không phải chuyện học hành; toàn tầng ‘tu học’ 49 chỗ, ‘học hành’ 9 chỗ). Sửa đồng loạt cả bài. Giữ nguyên ‘đời sống thấp hèn’ cho `hīnāya āvattati` và chữ ‘và’ mở khoá 5.8 (nối tiếp 5.7, kết bằng dấu phẩy).
