notes: |-
  Dịch từ Pāli root đã ghim, 67/67 khoá khớp Pāli đúng tập và đúng thứ tự. Đối chiếu Bhikkhu Sujato
  tại cùng commit, và đọc bản Việt nguyên bài của Hòa thượng Thích Minh Châu (bản này hiện ở mục Tra cứu
  toàn văn cuối trang, không phải một tầng của store) để so thuật ngữ.

  **Coverage Anh trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0): mẫu số 57.** Bhikkhu Sujato phủ 55/57
  = 96,5%, trên ngưỡng 0,80. Hai khoá Sujato để trống là `13.3` (đúng 40 ký tự sau khi bỏ khoảng trắng
  cuối) và `16.3` (166 ký tự); lớp lấp `english-project` đã published phủ đủ hai khoá này ⇒ 57/57. Tầng
  Việt hiện hành vắng hoàn toàn (0/57): tại commit đã ghim bản Việt phân đoạn chỉ có Pháp Cú. Vì
  `content/meta/en/an/an6.57.yaml` cũng ghi `assessed_by` là cùng một công cụ với bản Việt này, bản lấp
  KHÔNG phải lớp đọc Anh độc lập: `13.3` và `16.3` không được tính là đã đối chiếu English độc lập
  (độc lập là 55/57), và `triangulation` được hạ theo đó. `13.3` ở bản Việt lặp lại cụm tính từ của `11.3`
  (xấu xí, khó nhìn, dị dạng) vì Pāli `13.3` chỉ còn đúng ba tính từ ấy; `16.3` trùng byte `14.3`
  nên dùng lại nguyên văn.

  **Pāli trùng nguyên văn trong chính bài: 10 cặp, bản Việt giống nhau ở cả 10, 0 cặp lệch.** Gồm
  `11.4`=`14.4`, `11.5`=`14.5`, `12.2`=`13.2`, `12.3`=`15.3`, `12.4`=`15.4`, `12.5`=`15.5`, `13.4`=`16.4`,
  `13.5`=`16.5`, `14.2`=`16.2`, `14.3`=`16.3`.
  **Pāli trùng với bài khác: 17 khoá, 319 cặp; 123 cặp bản Việt giống nguyên văn, 196 cặp khác.** Phần
  khác gần như chỉ là công thức mở và kết bài mà bản Việt của tầng tự có nhiều cách dịch (`1.1` 6 cách,
  `1.2` 14 cách, `10.4` 17 cách), nên tôi theo cách nhiều nhất: `1.1`, `1.2` và `10.4` theo dạng “Đức Phật”
  (`10.4`: 108/205 khoá toàn tầng, và 36 so với 11 “Đức Thế Tôn nói” trong riêng `an`), `10.3` theo 15/24
  khoá đã dịch “vâng lệnh”, `9.2` theo “Thưa không, bạch Thế Tôn” (4/12 khoá cho đúng chuỗi Pāli này,
  dạng nhiều nhất), `10.2` theo `mn73:3.5` (“chú tâm kỹ”, 3/6 khoá, dạng nhiều nhất). Công thức
  gia đình thấp hèn/cao quý theo khuôn `sn3.21` và `an4.85` (cùng chuỗi Pāli), thay đổi thứ tự cho khớp
  Pāli của bài này (`nesādakule` đứng trước `venakule`).

  **Dấu lược.** Pāli có 3 khoá `…pe…` (`12.2`, `13.2`, `15.2`), bản Việt giữ đúng một `…` ở mỗi khoá
  (3/3); Pāli không có `…` nào khác (0/64 khoá còn lại), bản Việt cũng không. Các khoá `12.3`,
  `13.3`, `15.3` là phần còn lại sau chỗ lược của Pāli, bản Việt viết thường như tiền lệ
  `dn33:3.1.119` và không thêm `…`.
  **Dấu nháy: 67/67 khoá khớp Pāli từng khoá (cả nháy kép và nháy đơn), 0 lệch.** `9.2` chỉ mở nháy kép
  mà không đóng và `9.3` không mở nháy, đúng theo Pāli (lời Đức Phật từ `9.3` tới `10.2` không có nháy
  mở riêng); nháy đơn của lời người nghèo ở `9.3` đóng ngay trong khoá.

  **Số.** Chỉ có số nhỏ, đếm lại được: `1.4` liệt kê 6 loại sinh (đen, xanh, đỏ, vàng, trắng, trắng
  tối thượng), từ `2.1` đến `7.1` là 6 khoá, mỗi khoá đúng một loại; `10.6`–`10.11` là 3 + 3 = 6 mệnh đề;
  `pañca nīvaraṇe` = năm triền cái, `catūsu satipaṭṭhānesu` = bốn niệm xứ, `satta bojjhaṅge` = bảy giác chi.
  Không có số lớn hay số cộng nào cần quy đổi.

  **Thuật ngữ, kèm số đếm trên tầng.** `abhijāti` dịch “loại sinh” (tên kinh `dn33:2.2.120` dịch “Sáu loại
  sinh”; thân `dn33` lại dịch “dòng” (6 khoá, `2.2.121`–`126`) và `kaṇha`/`sukka` là “tối tăm”/“sáng”; bản Thích Minh Châu
  dịch “sanh loại”, “đen”, “trắng”). Tôi chọn “loại sinh” và “đen/trắng” để cả bài dùng một cặp từ,
  khớp với `akaṇhaṁ asukkaṁ` = “không đen không trắng” (`mn57:7.6`); `dn33` giữ nguyên, ghi ra để biên
  tập thấy hai bài khác cách. `abhijāyati` đi với `dhammaṁ` dịch “làm phát sinh pháp” và đi với `nibbānaṁ`
  dịch “chứng đạt Niết-bàn”, theo đúng `dn33:2.2.121`–`126` (4 khoá “làm phát sinh pháp”, 2 khoá “chứng đạt”).
  `paññatta`/`paññāpeti` dịch “chế định” (không còn tiền lệ khác trong `an6.57`; bản Thích Minh Châu
  dịch “trình bày”). `duccaritaṁ carati` → “làm ác hạnh”: 17/33 khoá trong tầng, so với “làm việc ác” 4
  và “hành động ác” 4; `sucaritaṁ carati` → “làm thiện hạnh” (4/23 khoá, ngang với “việc thiện” 4 và “hành động thiện” 4;
  chọn để đối xứng với “ác hạnh” trong cùng bài). `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ` → “cõi dữ, ác thú, đọa xứ,
  địa ngục” (`apāya` = “cõi dữ” 40 khoá, “cõi khổ” 13 khoá; `đọa xứ` 58). `sugatiṁ saggaṁ lokaṁ` →
  “thiện thú, cõi trời” (`thiện thú` 76 khoá). `paccājāto` → “sinh vào” (18/37 khoá của tầng dùng “sinh vào/sanh vào”, 7/37 dùng “sinh ra/sanh ra”). `nigaṇṭha` giữ dạng “Nigaṇṭha” (211 khoá Việt giữ dạng này, 5 khoá dùng “Ni-kiền-tử”, trong 321 khoá Việt ứng với Pāli có `nigaṇṭh`). `caṇḍāla` → “người dọn xác chết”
  theo `an4.85` (4 khoá, so với “phẫu uế” 3 khoá).

  **Chỗ bất định, ghi ở đây chứ không thêm vào thân kinh.**
  (1) `3.1` `kaṇṭakavuttikā`: Pūraṇa Kassapa nói về các tỳ-kheo, chữ nghĩa đen là “sống bằng/như gai”;
  Sujato dịch “whose life is thorny”, bản Thích Minh Châu “sống như cỏ gai đâm bên hông”. Tôi giữ nghĩa
  rộng “có lối sống gai góc” và không thêm điều giải thích.
  (2) `9.4` `akhettaññunā` (nghĩa đen “không biết cánh đồng/lĩnh vực”): Sujato “lacking common sense”,
  bản Thích Minh Châu “không biết thích ứng”; tôi giữ nghĩa sát chữ “không thông thạo lĩnh vực này”.
  (2b) `bilaṁ olaggeyyuṁ` ở `9.3` dịch “ép phải nhận một miếng thịt”, theo tiền lệ duy nhất
  `mn96:4.3`; Pāli `anāḷhiko`/`anāḷhiyo` đều dịch “túng thiếu” như `mn96:4.3` và `mn66:11.1`.
  (3) `11.3` `okoṭimako`: Sujato “deformed”, `an4.85:3.3` “dị dạng”, `mn129:25.4` “lùn thấp”, `sn3.21:2.3`
  “thấp nhỏ tàn tạ”; tôi chọn “dị dạng” theo Sujato và bản lấp English của chính dự án; còn
  `bavhābādho` dịch “nhiều bệnh tật”, `kuṇī` “què tay”, `khañjo` “thọt chân”.
  (4) `2.1`: Sujato có thêm “butchers of cattle” còn Pāli đã ghim không có `goghātakā`; tôi dịch đủ 9 mục
  đúng Pāli (`orabbhikā`, `sūkarikā`, `sākuṇikā`, `māgavikā`, `luddā`, `macchaghātakā`, `corā`,
  `coraghātakā`, `bandhanāgārikā`) và không thêm mục thứ mười. `7.1` `makkhali gosālo` giữ tên riêng
  Makkhali Gosāla theo `dn2:19.0`, không theo Sujato “bamboo-staffed ascetic Gosāla”.
  (5) `14.3` `pāsādiko` dịch “khả ái” (19/37 khoá trong tầng); bản lấp English ghi chú rằng Sujato dịch
  “lovely”, lệch với nghĩa thường thấy; chỗ này một bản đọc độc lập có thể bàn lại.
  (6) `nīlābhijāti` dịch “xanh” như bản Thích Minh Châu; `nīla` trong Pāli bao gồm cả xanh lam lẫn xanh
  đậm, nên “xanh” không chốt màu hẹp hơn Pāli.

