notes: |-
  Đợt 19, lane 12. Dịch trọn 67/67 khoá từ Pāli root đã ghim, đối chiếu English Sujato đã ghim, bản nguyên bài của Hòa thượng Thích Minh Châu (chỉ để tra cứu toàn văn, không phải tầng cột) và các bài anh em an9.25, an4.195, mn112, an10.84, an10.86, sn56.39, sn56.40, sn35.231.

  **Coverage Anh: 38/55 = 69,1% trên Pāli có nội dung (≥ 40 ký tự, bỏ khối :0); dưới sàn 0,80 nên bài giữ draft.** Sujato để trống 17 khoá dù Pāli viết đầy đủ: 2.3, 2.4, 3.2–3.11, 4.2–4.4, 4.7, 4.8. Chưa có lớp english-project và bản Việt hiện hành cho bài này (tại commit đã ghim bilara chỉ phân phối Pháp Cú). Chỗ trống đó Pāli phải tự đứng vững: các khoá ấy là lời lặp nguyên văn các khoá 1.4–1.6 và 2.2–2.7 nên đã dùng lại đúng bản Việt của khoá gốc. Triangulation hạ xuống 7,0 vì lý do đó.

  **Dùng lại nguyên văn:** 8 nhóm Pāli trùng trong chính bài, tổng 42 cặp, 0 cặp bản Việt khác nhau. Nhóm lớn nhất là 1.5 = 2.3 = 3.3 = 3.7 = 4.3 = 4.7 (6 khoá). Hai chỗ Pāli chỉ khác dấu nháy đóng được giữ khác: 1.6/2.7/3.4/3.11/4.4 đóng cả ‘ lẫn ”, còn 2.4/3.8/4.8/4.11 chỉ đóng ‘ vì lời của Sāriputta chưa dứt và còn tiếp ở 5.1 đến 7.6. Công thức *khīṇā jāti … pajānāmi* theo đa số của tầng: *không còn trở lại trạng thái hiện hữu này nữa … tôi biết rõ như thế* (mn112:2.2, an10.86 ×5, an10.84 ×2: 8 khoá), khác an9.25:1.2 và 2.12 (*không còn gì là tự thân nữa*, 2 khoá) và sn35.153:2.1.

  **Điểm khó nhất và tôi không phân xử được hoàn toàn: sự khác nhau giữa lời Candikāputta và lời Sāriputta.** Pāli ghim ghi Devadatta bị gán nói *cetasā citaṁ hoti* (không có chủ ngữ, không có *suparicitaṁ*), còn Sāriputta sửa lại là *cetasā cittaṁ suparicitaṁ hoti*. Tôi bám đúng chữ: *citaṁ* → *được tích tập bằng tâm ý* (tôi phải bổ sung *tâm của vị tỳ-kheo* làm chủ ngữ vì Pāli lược), *cittaṁ suparicitaṁ* → *được khéo tích tập bằng tâm ý*. Bản Anh Sujato dịch hai chỗ là *solidified* và *well consolidated*; bản nguyên bài của Hòa thượng Thích Minh Châu ở lời bị gán cho Devadatta ghi *với trí tuệ* và ở lời Sāriputta ghi *với tâm ý*, tức là nền bản đọc ấy khác Pāli ghim ở chữ *paññāya/cetasā*; tôi theo Pāli ghim, không theo bản đọc kia. Nghĩa đen của *citaṁ* thiếu chủ ngữ có thể mâu thuẫn với văn cảnh nếu hiểu là câu hỏi về trí tuệ; tôi giữ cách đọc ít giả định nhất và ghi bất định ở đây, không thêm giải thích vào thân kinh.

  **Khác an9.25 ở `suparicitaṁ`.** an9.25 dịch cụm này là *được tuệ làm cho hoàn toàn trong sạch*. Đo toàn tầng: 139 khoá Pāli có `paricit-` thì *quen thuộc* 28, *thuần thục* 17, *tích tập* 7, *thành thạo* 2, còn *trong sạch* chỉ có đúng 12 khoá, tất cả nằm ở an9.25. Tôi không theo an9.25 mà theo truyền thống *khéo tích tập* (*khéo* xuất hiện ở 45 trong 139 khoá có `paricit-`, chủ yếu cho *susamāraddhā*; *tích tập* ở 7 khoá). Hai bài anh em vì thế đang lệch nhau; đề nghị người biên tập xem lại an9.25 chứ tôi không sửa ngoài phạm vi lát.

  **Thuật ngữ đã đo.** `kāmabhava / rūpabhava / arūpabhava` → *dục hữu / sắc hữu / vô sắc hữu* (4 / 10 / 5 khoá theo dạng này so với 1 / 1 / 1 khoá *cõi hữu dục / cõi có sắc / cõi vô sắc*, đều ở an9.25). `vītarāgaṁ cittaṁ` → *tâm không tham* (17/17 khoá có `vītarāgaṁ vā cittaṁ`, ví dụ dn2:91.4, dn10:2.28.4). `asarāgadhammaṁ / asadosadhammaṁ / asamohadhammaṁ` → *mang bản chất không tham / sân / si* (theo an9.25:2.5–2.7, 0 tiền lệ khác; Sujato dịch *not liable to become greedy/hateful/deluded*, và *-dhamma* ở đây là *có bản chất*, giữ phân biệt với *vīta-*). `anāvattidhammaṁ` → *mang bản chất không quay trở lại* (35 trong 53 khoá có từ này dịch *không còn trở lại*). `āpātha` → *phạm vi* (6 khoá: mn28) so với *tầm nhìn / tầm* (8 / 8 khoá: sn35.231); chọn *phạm vi* vì dùng được cho cả mắt lẫn ý. `pariyādiyanti` → *lấn át* theo sn35.231:8.1, 9.1, 10.1, 12.1 (4 khoá). `sammā vimuttacittassa` → *tâm đã được giải thoát đúng đắn* theo an4.195:10.1 và 12.1. `ṭhitaṁ āneñjappattaṁ` → *an trú, đạt bất động* theo dn3:2.2.17, dn10:2.21.1, dn10:2.22.3. `taṁ kissa hetu` → *Vì sao vậy?* (297 khoá so với 68 *Vì sao?*). `āvuso` → *này hiền giả* / *này các hiền giả* (khoảng 1.410 khoá số ít so với 1.433 khoá số nhiều, đo trên các khoá có `āvuso` mà không có `bhikkhave`); tôi dùng số nhiều khi Candikāputta hoặc Devadatta nói với các tỳ-kheo, số ít khi Sāriputta nói với Candikāputta.

  **Chỗ khác tiền lệ.** `kukku` → *khuỷu tay*: sn56.40:2.1–2.2 giữ nguyên *kukku* (2 khoá), tôi đổi vì người đọc hiện đại không biết đơn vị ấy; Sujato đổi sang *feet* nên cũng không giữ nguyên. `vātavuṭṭhi` → *cơn mưa gió mạnh*: sn56.39:4.2 và sn56.40:2.3 (2 khoá) bỏ mất *vuṭṭhi* (mưa) và dịch *cơn gió mạnh*; tôi giữ cả hai vế. `nemaṅgamā … nemassa` → *nằm trong nền móng … ở phía trên nền móng*, `nema` → *nền móng* theo sn56.40:2.2, 2.5; tôi đọc *nemaṅgamā* là phần đi xuống tới nền móng, nên nghĩa 8 + 8 = 16 khuỷu tay (*soḷasa* 16, *aṭṭha* 8) không cần chỉnh. `atha` đầu câu ở 6.3–6.6 dịch *rồi*; tầng không có tiền lệ nào cho *atha* đứng đầu câu trong ví dụ trụ đá (0 khoá), nên đây là lựa chọn mới.

  **Các bất định khác.** (1) `‘…’ti cetasā cittaṁ suparicitaṁ hoti` ở 5.2–5.10 không có động từ *biết*; tôi dịch *‘…’, như vậy tâm được khéo tích tập bằng tâm ý* theo đúng bản Hòa thượng Thích Minh Châu về cấu trúc, không thêm *khi biết rằng* như an9.25 đã làm. (2) `vayaṁ cassānupassati` không nêu rõ *sự hoại diệt của cái gì* (của chính các sắc, hay của sự đi vào, hay của tâm); tôi dịch *vị ấy quán sát sự hoại diệt* không thêm tân ngữ, giống Sujato (*observing disappearance*), còn bản Hòa thượng Thích Minh Châu thêm *của chúng*. (3) `amissīkata` → *không bị pha tạp* (0 tiền lệ cho từ này trong tầng; Sujato *untainted*, Hòa thượng Thích Minh Châu *không bị tạp nhiễm*), nghĩa đen là *không bị trộn lẫn*, không nói trộn với cái gì. (4) `kallaṁ veyyākaraṇāya` → *thích hợp để tuyên bố*; `veyyākaraṇ-` trong tầng được dịch (đo sơ bộ) *giải thích* 47, *giải đáp* 46, *trả lời* 26, *tuyên bố* 10, nhưng ở đây là lời tự tuyên bố đạt quả nên chọn *tuyên bố*. (5) `Bhusā` ở 7.5 không lặp ở Pāli (chỉ ở 7.1) nên 7.5 không có *mạnh mẽ*, đúng Pāli. (6) Dấu lược `(…)` ở 1.1 và 1.3 phản chiếu đúng dấu lược của Pāli ghim, giữ nguyên.

  **Số.** Không có số lớn. *soḷasa* = 16, *aṭṭha* = 8, 8 + 8 = 16; ba lần (*dutiyampi, tatiyampi*) → *lần thứ hai / lần thứ ba*; *Chaṭṭhaṁ* → *Thứ sáu* (đúng thứ tự trong phẩm: an9.25 là *Thứ năm*, an9.27 là *Thứ bảy*).

  **Kiểm đã làm:** 67/67 khoá khớp Pāli, đúng thứ tự; nháy đơn và nháy kép khớp Pāli từng khoá, 0 lệch trên 67 khoá; dấu lược cân bằng từng khoá, 0 lệch; NFC, 0 khoá rỗng, 0 khoảng trắng thừa, không có Pāli lọt sang bản Việt ngoài tên riêng; 42 cặp Pāli trùng trong bài, 0 cặp Việt khác.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở 9,6; bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để người điều phối chạy.


  **Giải quyết draft 2026-10-12.** Đọc đối kháng lại cả 67 khoá cặp Pāli↔Việt: 0 khoá lỗi nghĩa thật, không sửa khoá nào; tập khoá 67/67 khớp Pāli, đúng thứ tự. Đối chiếu lại với Sujato đã ghim, với bản nguyên bài của Hòa thượng Thích Minh Châu (chỉ để hiểu cách đọc) và với công thức *bhusā … āpāthaṁ āgacchanti, nevassa cittaṁ pariyādiyanti* ở sn35.231 (*lấn át*, *tầm nhìn*/*phạm vi*) và mn28 (*phạm vi*): các lựa chọn của bản dịch đứng vững. Blocker duy nhất còn lại ở bản trước là loại độ phủ Anh Sujato dưới ngưỡng (kèm câu về lớp english-project và tầng Việt hiện hành); đã gỡ vì các lý do sau, thay thế các câu *bài giữ draft* ở mục coverage phía trên.
  (1) Sujato để trống 17 khoá Pāli có nội dung: 2.3, 2.4, 3.2–3.11, 4.2–4.4, 4.7, 4.8 (38/55 = 69,1%). Cả 17 khoá là lời lặp nguyên văn các khoá 1.4–1.6 và 2.2–2.7 (Candikāputta thuật lại, Sāriputta bác và sửa lại), đã đọc trực tiếp từ Pāli và dùng lại đúng bản Việt của khoá gốc; khoá nào mang khác biệt có nghĩa (*citaṁ* ở 1.5/2.3/3.3/3.7/4.3/4.7 so với *cittaṁ suparicitaṁ* ở 2.6/3.10/4.10) thì Sujato đều có mặt ở ít nhất một khoá cùng loại (1.5 và 2.6, 4.10), nên điểm tựa tham chiếu cho sự khác biệt ấy không mất. Không có đoạn nào còn nghĩa chưa chắc do khoảng trống này; mất mát được ghi nhận ở tệp ghi nhận khoảng trống tham chiếu của kho chứ không cần lớp lấp. Không có lớp english-project.
  (2) Tầng Việt hiện hành không có cho bài này: tại commit đã ghim bilara chỉ phân phối Pháp Cú (giới hạn của nguồn tham chiếu, không phải lỗi văn bản; mọi bài ngoài Pháp Cú đều như vậy). Bản nguyên bài của Hòa thượng Thích Minh Châu vẫn ở mục Tra cứu toàn văn.
  `triangulation` nâng từ 7,0 lên 7,5, không cao hơn: có đúng một bản Anh độc lập (Sujato) và nó im lặng ở 17/55 khoá; không có tầng Việt phân đoạn. Các điểm khác giữ nguyên. Bất định còn lại vẫn là những bất định đã nêu ở trên: nghĩa chính xác của *citaṁ* không chủ ngữ (Candikāputta/Devadatta) so với *cittaṁ suparicitaṁ*, và việc an9.25 dịch `suparicitaṁ` khác bài này (bản đó chưa sửa ngoài phạm vi). Cổng kỹ thuật vẫn do người điều phối chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
