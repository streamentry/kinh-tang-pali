notes:
  - >-
    **Coverage Anh Sujato đo bằng script: 11/11 khoá Pāli có nội dung = 100.0%.** Không khoá nào Sujato để trống.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot, không phải thiếu sót.** Đếm trực tiếp trên `source/upstream-manifest.json` tại commit đã ghim `11c9d708978cde8ba61096d8a75f7ddfb846f639`: tầng `vietnamese-current` có **0** file cho 14 uid của lát này (bilara chỉ phân phối Pháp Cú cho tiếng Việt). Nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ ở bất kỳ bài nào; `budsas.org` chỉ là tham khảo toàn văn, không dựng cột.
  - >-
    **Tầng Anh Sujato — đếm từng khoá, không suy.** Đo `coverage` theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ): kết quả ghi ở từng bài. Ở bốn bài Tăng Bộ, những khoá Sujato để trống đều là khoá `…pe…` mà bilara không dịch — tôi **không** mở rộng những khoá đó và **không** lấy tiếng Anh của bài khác để bịa chữ.
  - >-
    **48 cặp khoá có Pāli trùng ở bài khác — đã đếm bằng script, và đã dùng lại nguyên văn.** Quét toàn tầng Pāli gốc (5.764 file, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn** của từng khoá của lát này: **45 cặp trùng byte-for-byte**, thêm **3 cặp** trùng sau khi chuẩn hoá dấu câu và nháy kép = **48 cặp**. Trong đó **35 cặp** đã có bản Việt ở bài khác và tôi **dùng lại nguyên văn** (28 cặp khớp từng chữ; 7 cặp còn lại được nêu riêng dưới đây), **13 cặp** chưa bài nào trong kho có bản Việt thì tôi đặt mới. Không có cặp nào tôi dịch khác mà không ghi lý do.
  - >-
    **Nhịp và hình thức — không lặp khuôn.** Bốn bài Tăng Bộ là `peyyāla` thuần: mỗi mục phải phát lại đúng công thức của Pāli, nên sự lặp ở đây là **bắt buộc của nguồn**, không phải lỗi khuôn. Mười bài Jātaka thì mỗi bài một bài kệ riêng, nhịp khác nhau; tôi không dùng chung một công thức dịch cho cả mười bài.
  - >-
    **Có tầng Anh Sujato ở commit đã ghim** — kiểm bằng cách tra `source/upstream-manifest.json` (không phải tra thư mục cache): tệp `translation/en/sujato/.../{uid}_translation-en-sujato.json` có trong `files` của commit đã ghim. Không có blocker nào ở tiêu chí provenance.
  - >-
    `an7.95:0.3` là `~` — tầng Pāli không đặt tên cho bài này. Tôi giữ `~` (37 tệp `an` đã có trong kho đều giữ `~`) và đặt tên bài ở `translationTitle` là `~`; tên mô tả (*Quan vô thường nơi con mắt*) nằm ở `tags` chứ không đưa vào khoá `:0.3`.
  - >-
    **`an7.95` là bản song cấu trúc của `an7.16` — dùng lại nguyên văn ở mọi chỗ có thể.** Bảy khoá trùng **byte-for-byte**: `1.2` (`Katame satta?` → *Thế nào là bảy?*, 22/43) · `1.4` (→ `an3.88:2.6`: *Vị ấy, do cạn lậu hoặc, tự mình chứng tri, chứng ngộ trong hiện tại và an trú ở giải thoát tâm không lậu hoặc, giải thoát tuệ*) · `2.2` · `2.3` · `3.2` · `3.3` · `3.4` · `3.5` · `3.6` · `3.8` — tôi lấy nguyên văn của `an7.16` cho tất cả, kể cả `3.8`.
  - >-
    **Tôi CHỌN LỆCH khỏi `an7.19` ở hai chỗ, và ghi rõ vì đây là quyết định biên tập.** `an7.95:3.7` trùng byte-for-byte `an7.19:3.7` và `an7.95:3.8` trùng byte-for-byte `an7.14:1.4` lẫn `an7.16:3.8`. Ba bản đó dùng ba hệ thống khác nhau: `an7.19` viết *lễ bái, cúng dường, tế lễ*; `an7.14` viết *cúng dường* cho **cả** `āhuneyya` lẫn `dakkhiṇeyya` (lặp, làm mất một phẩm tính); `an7.16` viết *hiến dâng, tiếp đón, cúng dường, chắp tay lễ kính*. Tôi theo **`an7.16`** trên **cả năm** lần xuất hiện của công thức này trong `an7.95` (`1.1`, `1.5`, `2.3`, `3.7`, `3.8`) vì nó là bản song cấu trúc, giữ đủ bốn phẩm tính, và nhất quán trong chính bài này; chấp nhận lệch với `an7.19`. Đây là lý do `ambiguity_integrity` của bài hạ hơn hai bài Tăng Bộ kia.
  - >-
    **Tôi tách hai semantic unit mà `an7.16` đã gộp — cần nói rõ đây là cải thiện có chủ ý, không phải lệch ngẫu nhiên.** Ở `1.3`/`2.1`/`3.1`, `an7.16:1.3` dịch `sabbasaṅkhāresu aniccānupassī viharati, aniccasaññī, aniccapaṭisaṁvedī` thành *sống quán vô thường … có tưởng về vô thường, đi vào sự an trú của vô thường* rồi lại dịch `cetasā adhimuccamāno` thành *tâm giải thoát* — `aniccapaṭisaṁvedī` **biến mất**. Ở `an7.95` tôi giữ đủ bốn vế: *sống quán vô thường nơi con mắt* (`aniccānupassī`) · *có tưởng về vô thường* (`aniccasaññī`) · *thấy biết rõ sự vô thường ấy* (`aniccapaṭisaṁvedī`) · *đem tâm giải thoát, đem tuệ thâm nhập* (`cetosā adhimuccamāno paññāya pariyogāhamāno`). Đây là lý do `terminology` hạ xuống 9.2: tôi biết đang lệch với tiền lệ gần nhất, và lý do là tiền lệ đó mất một vế.
  - >-
    **Dấu lược: tám khoá, mỗi khoá đúng một `…`.** `1.1`, `1.5`, `2.3`, `3.2`, `3.3`, `3.4`, `3.5`, `3.7` — đếm Pāli 8, bản Việt 8. `3.1` **không** có `…pe…` trong Pāli, và bản Anh Sujato đã ghim lại chèn `…` vào đúng khoá đó; tôi **không** chép theo (§10.1).
  - >-
    **Thuật ngữ:** `puggalo` → **hạng người** (đa số `an7.16`/`an7.14`) · `cakkhusmiṁ` → **nơi con mắt** (tiền lệ `an3.94` dịch `cakkhusmiṁ aniccānupassī` là *xứng sáng quán vô thường nơi con mắt*) · `ekacca puggalo` → **một hạng người**, còn `idhekacco puggalo` → **hạng người như sau** (hai vế khác nhau ở Pāli, tôi không lặp như `an7.16` đã lặp) · `āhuneyyā`…`añjalikaraṇīyā` theo `an7.16` như trên · `puññakkhettaṁ lokassa` → **là phước điền vô thượng của thế gian** theo `an7.16`.
  - >-
    Đợt này bị cấm chạy `npm run validate|test|check|build` theo lệnh lát, nên `technical_integrity` đặt **9.6** chứ không phải 10.0: tệp JSON hợp lệ, đủ khoá, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài, không Pāli lọt — tất cả đã quét bằng script riêng trên **mọi** khoá, không chỉ khoá ≥ 40 ký tự — nhưng cổng kỹ thuật của repo thì chưa chạy, nên không thể tuyên bố là đã pass.
