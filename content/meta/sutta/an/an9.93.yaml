notes:
  - >-
    **Dùng lại nguyên văn đã `published`:** `nibbindati` → *chán nản* và
    `virajjati` → *ly tham* (`an10.2:1.24`) · `nibbidā` → *chán ngại*
    (`an10.1:10.1`) · dây chuyền chánh tám pháp (`an10.103:2.3`) · năm căn *Tín
    căn, tinh tấn căn, niệm căn, định căn* (`an4.151:1.3`) · `Idha, bhikkhave, X
    viharati` → *Ở đây, này các tỳ-kheo, có X sống…* (`an3.116:1.3`) và *với ý
    niệm ‘hư không là vô lượng’…* (`an3.116:1.3`, `an3.116:2.1`, `an3.116:3.1`)
    · `Ayaṁ vuccati, bhikkhave, X` → *Đây, này các tỳ-kheo, được gọi là X*
    (`an3.117:1.6`) · bảy điều ác (`an4.202:2.2`) · năm uẩn vô học
    (`an10.12:2.2`) · `vepullāya bhiyyobhāvāya` → *tăng trưởng và mở rộng*
    (`an3.68:3.1`) · `bhāvanāpāripūri` → *sự viên mãn của sự tu tập*
    (`an10.106:1.5`) ·
    `kāmacchando`/`byāpādo`/`thinamiddhaṁ`/`uddhaccakukkuccaṁ`/`vicikicchā` →
    *dục tham / sân hận / hôn trầm thụy miên / phóng dật hoặc hối / sự nghi ngờ*
    (`an10.12:1.3`) · cả ẩn dụ mưa lấp đầy dòng nước (`an3.95:6.1`, cùng Pāli
    với `sn55.38:1.1`) · `ānantariya` → *chậm chạp chứng đạt pháp tối tận*
    (`an4.162:2.7`) · `agāravo`/`appatisso` → *không tôn kính / không vâng phục*
    (`an10.156-166:1.9`, `:1.11`) · `kotūhala` → *coi các điềm lành là nghi lễ*
    và `dakkhiṇeyya` → *người đáng cúng dường* (`an5.175:1.5`–`1.6`) · `Evaṁ me
    sutaṁ—` → *Tôi nghe như vầy—* (`an10.1:1.1`) · `veḷuvana`/`gijjhakūṭa` →
    *rừng trúc Veḷuvana* / *núi Gijjhakūṭa* (`sn2.13:1.3`, `sn4.11:3.2`) ·
    `ariyakantāni sīlāni` → *giới được các bậc Thánh yêu thích* (`an5.32:7.1`) ·
    `ceto paricca` → *bằng tâm hiểu rõ tâm của các chúng sinh và các cá nhân
    khác* (`an3.101:5.1`) và `avimuttaṁ` → *tâm chưa được giải thoát*
    (`an3.101:5.17`) · `lābhasakkārasiloka` → *sự được cho và được tôn kính,
    được danh tiếng* (`an4.157:2.4`) · `Taṁ suṇātha` → *Hãy nghe điều ấy*
    (`an10.107:2.2`).
  - >-
    `an9.32:1.3` và `an9.94:1.3` có **cùng một danh sách chín mục** (bốn tầng
    thiền + bốn căn xứ + sở kiến và cảm thọ diệt tận) — dùng lại chung một khuôn
    để hai bài không lệch nhau.
  - >-
    `saññāvedayitanirodha` → *sự diệt tận sở kiến và cảm thọ* (0 tiền lệ, đặt
    mới) · `anupubbavihāra` → *phép sống tiếp nối* (0 tiền lệ; `an10.1:11.10` có
    *tiến lên lần lượt* cho `anupubba` dạng trạng từ) · `jhāna` → *thiền* (tiền
    lệ) · bốn căn xứ theo `an10.6:1.2` (đã `published`).
  - >-
    `an9.93:1.3` — chín niệm tưởng, thứ tự **khác** `an5.303`–`307` và
    `an7.616`–`617`: mở bằng *bất tịnh, chết, thức ăn, không ham muốn* rồi mới
    tới *vô thường, khổ trong vô thường, vô ngã trong khổ, từ bỏ, ly tham*. Tôi
    dựng riêng, không kế thừa thứ tự của các bài kia.
  - >-
    **Quy tắc dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
