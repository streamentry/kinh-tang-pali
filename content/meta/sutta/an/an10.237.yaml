notes:
  - >-
    **`abhiññāya` → "để chứng ngộ", `bhāvetabbā` → "cần được tu tập"**: dùng
    nguyên văn từ `an3.183-352:1.1` (`Rāgassa … abhiññāya tayo dhammā
    bhāvetabbā` → "Để chứng ngộ tham, này các tỳ-kheo, ba pháp này cần được tu
    tập"). `Katame dasa?` → "Thế nào là mười?" theo `Katame tayo?`/`Katamā
    pañca?` trong cùng corpus.
  - >-
    `asubhasaññā` → "niệm tưởng bất tịnh", `maraṇasaññā` → "niệm tưởng về cái
    chết", `āhāre paṭikūlasaññā` → "niệm tưởng không sạch trong thức ăn",
    `sabbaloke anabhiratasaññā` → "niệm tưởng không yêu thích trong tất cả thế
    giới": cả bốn **theo nguyên văn `an5.61:1.3`**, vì đó là cùng danh sách.
  - >-
    `aniccasaññā` / `anicce dukkhasaññā` / `dukkhe anattasaññā` / `pahānasaññā`
    / `virāgasaññā` lấy nguyên văn từ `an5.72:1.3`; `nirodhasaññā` → "niệm tưởng
    diệt" theo `dn33:2.2.128` (`nirodhasaṅñā` → "tưởng diệt") và theo
    `nirodhāya` → "diệt" ở `an3.183-352:2.7`.
  - >-
    Pāli không có tên bài (`:0.3` là `~`), giữ nguyên `~` theo `an3.183-352`.
    `translationTitle` đánh số theo quy ước bài vô danh đã có (`an5.61` "Kinh
    Các Niệm Tưởng (1)"), không phát minh nội dung.
