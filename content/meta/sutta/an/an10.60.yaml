notes:
  - >-
    **Bài dài thứ hai chương (80 segment), hình thức là một bài kinh trần liệu:
    Đức Phật dạy Tôn giả Ānanda mười niệm tưởng để chữa bệnh cho Tôn giả
    Girimānanda, và bệnh khỏi thật.** Mười niệm tưởng được giảng từng cái — chín
    vế hỏi–đáp rồi kết bằng *“Này Ānanda, điều ấy được gọi là …”*. Tôi dịch theo
    đúng nhịp lặp đó; đây là bài **ít nhất phải lặp** trong cả chương, vì hình
    thức nó chính là sự lặp.
  - >-
    **`Sacittavagga` → *Phẩm Tâm Mình*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *Your Own Mind*, và cả phẩm nói đúng một việc — soi lại
    **tâm mình** (`sacittapariyāyakusala`). Tên bài `Sacittasutta` → *Kinh Chăm
    Chính Tâm Mình*.
    **`Sacittavaggo paṭhamo` ở `an10.60:15.5` dịch là *Phẩm Tâm Mình, thứ
    nhất*** — đây là **số thứ tự của chính Bilara đánh số lại**, vì phẩm này rõ
    ràng là thứ sáu trong Bộ Mười (đúng như `6.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Ba chỗ dùng lại nguyên văn bài đã `published`, đều cùng Pāli:** `6.3`
    (danh sách 30 phần thân) ← **`kp3:1.1`**; `9.3` và `10.3` (trích
    `sabbasaṅkhārasamatho…`) ← **`an10.6:3.2`**; `13.2` (ngồi kết già co) ←
    **`an4.198:13.3`**. Với `kp3:1.1` chỉ khác một chữ — `matthaluṅga` ở kp3,
    `karīsa` ở đây, cùng nghĩa *não* — nên tôi giữ nguyên vị trí.
    `bāḷhagilāna` → *bệnh nặng* theo `an3.36:6.6`; `paṭisañcikkhati` → *suy niệm
    như sau* theo **`an3.40:1.5`** (dùng y nguyên cho cả sáu vế); `ānāpānassati`
    → *chánh niệm hơi thở* theo `an5.96:1.1`.
    `kāmacchandavitakka / byāpādavitakka / vihiṁsāvitakka` → *các tưởng về dục /
    sân / sát hại* theo **`an3.123:3.6`**; năm động từ `nādhivāseti, pajahati,
    vinodeti, byantīkaroti, anabhāvaṁ gameti` → *không chịu đựng, từ bỏ, loại
    bỏ, làm cho tiêu tan, đưa đến không còn* theo `an4.11:1.2` (cho `adhivāseti`
    và `anabhāvaṁ gameti`) và `an3.101:2.1` (cho ba động từ giữa); `aṭṭīyati
    harāyati jigucchati` → *ghê tởm, xấu hổ và chán ghét* theo `an3.39:3.2`.
  - >-
    **Danh sách năm mươi bệnh ở `7.4` là chỗ tôi phải tự đặt gần như toàn bộ, và
    bản đầu sai nặng.** Pāli là một danh sách liên tục **không dấu phẩy**; đếm
    được 58 từ, trong đó tám mục dạng `X ābādhā`, nên **58 − 8 = 50 mục**, và
    bản dịch cũngng đúng 50 mục. Bản đầu tôi chỉ có 40 mục và **lệch dần**:
    `pināso` bị dịch thành *bệnh đau nhức* (thật ra *sổ mũi*), `kuṭṭhaṁ` thành
    *bệnh phù* (thật ra *bệnh phong*), `nakhasā` thành *bệnh do chúng hợp lại*
    (thật ra *bệnh rò*), `madhumeho` thành *bệnh do quả báo của nghiệp* (thật ra
    *tiểu đường*), `vitacchikā` thành *bệnh do đổi khí thời tiết* (thật ra *bệnh
    đi lỏng*)… Danh sách đã dựng lại **một-một** theo Pāli. Tên bệnh 0 tiền lệ
    trong corpus, đặt mới.
    **Mười sáu phần của chánh niệm hơi thở ở `13.4`–`13.19` cũng 0 tiền lệ**:
    `sabbakāyapaṭisaṁvedī` → *cảm nhận trọn thân*, `pītipaṭisaṁvedī` → *cảm nhận
    sự dễ chịu*, `sukhapaṭisaṁvedī` → *cảm nhận sự dễ thân*,
    `cittasaṅkhārapaṭisaṁvedī` → *cảm nhận các hành thuộc tâm*,
    `paṭinissaggānupassī` → *quán sự buông xả*.
    **`13.13`–`13.18` bị lược bằng `…pe…`** nên chỉ dịch đầu, đuôi trống — sáu
    mục *Tâm lắng dịu, Tâm tập trung, Tâm thả lỏng, Quán vô thường, Quán ly
    tham, Quán diệt tận*.
  - >-
    **Ba lỗi nhỏ hơn, đều do lượt review bắt được:** `4.4` dịch `aniccānupassī`
    thành *quán **bất thường*** trong khi cùng chữ ở `13.16` là *quán **vô
    thường*** — đã sửa cho khớp; `13.2` không có `paṭisañcikkhati` trong Pāli
    nhưng bản đầu cắm khung *“suy niệm như sau”* của sáu vế kia vào giữa câu, ra
    *“…nhà trống suy niệm như sau ngồi xuống kết già co”* — đã sửa; `11.2` dịch
    `adhiṭṭhāna` là *thắng chấp*, thật ra là *hướng tới* (động từ `adhiṭṭhāna` =
    hướng tới/chống lại), đã sửa.
    **`15.5` là số thứ tự do Bilara đánh số lại** — xem ghi chú `VAGGA`.
    **`16.0`–`16.4` là `Tassuddāna`**, dịch theo 95 segment tiền lệ (*Tóm
    lược:*) và điểm danh đúng mười bài của phẩm theo thứ tự: *Chăm Chính và
    Sāriputta, / Trì Trệ và Bình Thản; / Suy Giảm và hai bài Niệm Tưởng, / Gốc
    Rễ, Xuất Gia và Girimānanda.*
