notes: |-
  Sửa lan 2026-10-13: khoá an4.230:1.2 — anavajjo ca hoti ananuvajjo viññūnaṁ, 'không đáng bị trách trách và bị người có trí trách móc' → 'không có tội và không bị người có trí trách móc' (bản cũ còn thiếu phủ định ở vế ananuvajjo viññūnaṁ). Căn cứ: Pāli; tiền lệ đo trên tầng: anavajja → 'không có tội' 46 khoá so với 'không đáng bị trách trách' 17 khoá; mẫu đã sửa ở an4.193; tiền lệ cùng công thức ở an4.4. Khoá an4.230:1.1 (Pāli có hai dấu lược …pe…): bản cũ có bốn dấu lược cùng các cụm 'Người ngu … sanh ra nhiều bất thiện pháp', 'Bậc trí … sanh ra nhiều phước đức' không có trong khoá → '… Người ấy không có niềm tin, không có giới, lười biếng, và thiếu trí tuệ … Người ấy có niềm tin, có giới, tinh tấn kiên trì, và có trí tuệ —', cùng cách rút của an4.219:1.1; sửa để dấu lược khớp Pāli (cổng cắt ngắm).
