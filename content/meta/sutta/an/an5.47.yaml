notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an5.47:2.3 — bản cũ trải đủ mười danh hiệu thay cho dấu lược
  `…pe…` của Pāli (`itipi so bhagavā …pe… satthā devamanussānaṁ buddho bhagavā`) → «Bậc Thế Tôn ấy là bậc
  A-la-hán … thầy của chư thiên và loài người, bậc Phật, Thế Tôn.», đúng một dấu `…` thay `…pe…` và theo
  công thức đa số 8/13 khoá (sn40.10:17.2); không để bản dịch tự mở rộng đoạn mà Pāli đã lược. Cùng lỗi mở rộng dấu lược ở an5.47:4.2 (`bahussuto hoti …pe… diṭṭhiyā suppaṭividdho`) cũng được thu về «… » để dấu lược cân bằng Pāli.
