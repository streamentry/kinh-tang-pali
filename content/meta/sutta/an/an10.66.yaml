notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit 11c9d708.
  **Coverage Anh Sujato trên Pāli có nội dung (≥ 40 ký tự, bỏ khối đánh số `:N.0`): 12/12 = 100%.**
  Sujato im lặng đúng 1 khoá, `an10.66:3.13` (`Chaṭṭhaṁ.`, 10 ký tự) — ngắn hơn 40 ký tự
  nên **không nằm trong mẫu số** của cổng coverage, và đó là lý do `3.13` vắng bản Anh.
  Tầng Việt hiện hành vắng ở commit đã ghim: bilara chỉ phân phối 26 tệp tiếng Việt và toàn
  bộ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài
  này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org`
  chỉ là tra cứu toàn văn, không dựng cột.
  **`content/meta/en/an/an10.66.yaml` không tồn tại và không cần tạo.** Lớp `english-project`
  chỉ lấp khoá mà tầng Anh đã ghim để trống; ở bài này không còn khoá trống nào trong tập
  lấp, nên không có việc gì để lấp.
  **Bài song song `an10.65` (Paṭhamasukhasutta) — 3 khoá trùng NGUYÊN VĂN, dùng lại:**
  `1.1` (còn trùng `sn38.1`), `1.2`, `1.3`. Ba khoá mở đầu này đúng y hệt bài trước, dịch lại
  từ đầu sẽ làm cặp bài không còn là cặp.
  **Tám khoá trùng nguyên văn TRONG CHÍNH BÀI — dùng lại nguyên văn, không dịch khuôn.**
  `2.5–2.12` (`ṭhitopi …` … `abbhokāsagatopi …`) và `3.3–3.10` là **cùng tám chuỗi Pāli**;
  bản Việt hai bên giống nhau từng chữ. Tổng cộng lát n5: 49/99 khoá dùng lại nguyên văn
  (41 khoá trùng với bài khác trong tầng + 8 khoá trùng trong `an10.66`).
  **Thuật ngữ — mọi số dưới đây là số ĐẾM, không phải ước lượng.**
  `sukhaṁ` → *lạc* và `dukkhaṁ` → *khổ* theo `an10.65:2.3`; `pāṭikaṅkhaṁ` → *điều được
  mong đợi là* theo `an10.65:2.3`; `āvuso` → *hiền giả* (đếm trên 3.724 khoá Việt có Pāli
  `āvuso` trong tầng, đa số *hiền giả*; `an10.65:2.3` cũng viết *này hiền giả*); `āyasmā` →
  *Tôn giả* (1.096/1.253 khoá); `dhammavinaya` → *giáo pháp và giới luật* (đếm trên 273 khoá
  Việt có PāLi chứa `dhammavinay*`: *giáo pháp và luật* / *giáo pháp và giới luật* chiếm
  đa số, còn *giới luật* trần chỉ là `vinaya` đứng riêng nên không phải tiền lệ); `suññāgāra`
  → *nhà trống* (50/54 khoá có PāLi `suññāgāra`); `abbhokāsa` → *ngoài trời* (62/102);
  `rukkhamūla` → *gốc cây* (87/88).
  **Một thuật ngữ 0 tiền lệ, ghi rõ lý do:** `bhikkhumajjhagatopi` — **0 khoá nào trong toàn
  tầng Việt dự án có Pāli chứa dạng này** (đếm bằng `re` trên cả 5 bộ). Tôi dịch *dù ở giữa
  chúng tỳ-kheo*, theo đúng cách tầng đã dùng cho dạng `bhikkhumajjhe` (`an3.96` v.v.), chứ
  không tự đặt một cách thứ N+1.
  **Bất định đã ghi, không giấu.** (1) `abhirati` / `anabhirati` ở An 10.65–67: 0 tiền lệ cho
  đúng công thức này trong tầng `an`; tôi dùng *hài lòng* / *bất mãn* — *bất mãn* đã xuất hiện
  21 lần trong tầng `an` cho `anabhirati`, còn *hài lòng* là mặt đối. Nếu biên tập chọn cách
  khác thì phải sửa cả `an10.66` lẫn họ hàng của nó.
  (2) `sātaṁ` trong `sukhaṁ sātaṁ` tôi dịch *sự dễ chịu*; Sujato dịch *pleasure*. Hai đều
  giữ được, nhưng *sự dễ chịu* làm rõ hơn rằng đây là vế thứ hai của cặp `sukha`-`sāta`.
  (3) `…pi` ở `gacchantopi`, `ṭhitopi`… tôi dịch *dù*; đây là lựa chọn văn phong để giữ nghĩa
  chuyển ý *dù… vẫn không thể*, không phải thuật ngữ.
  **Tên phẩm và tên kinh — đã tra tiền lệ trước khi viết.** `0.2` `7. Yamakavagga` → *7. Phẩm
  Song Trùng* theo 5/5 bản (`an10.63/64/65/69/70`). `0.3` `Dutiyasukhasutta` → *Kinh Lạc (2)*
  theo `an10.65:0.3` (`Paṭhamasukhasutta` → *Kinh Lạc (1)*, 1/1, cùng công thức
  Paṭhama-/Dutiya-). `0.1` → *Kinh Tăng Chi Bộ* vì trong tầng `an` có 906 khoá viết thế và 371
  khoá viết *Aṅguttara Nikāya*. `3.13` `Chaṭṭhaṁ.` → *Thứ sáu.* theo 254/259.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì `technical_integrity` chỉ 9,6: npm run
  validate; npm test; npm run check; npm run build.
