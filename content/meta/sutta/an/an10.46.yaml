notes:
  - >-
    **Bài dài nhất chương (81 segment) nhưng lặp khuôn bốn lần**: mục 2, 3, 6 và
    `4.2`–`4.16` — cùng một câu hỏi, khác số tiền. Tôi dùng **cùng một cách diễn
    đạt** cho cả bốn, vì Pāli ở đây là **cùng một câu** chỉ khác con số; dùng
    bốn cách khác nhau sẽ làm người đọc tưởng bốn ý khác nhau.
  - >-
    **Chuỗi số lượng giữ nguyên Pāli, không làm tròn.** Ở `4.2`–`4.15`,
    `8.1`–`8.8`, `9.1`–`10.9`, `11.1`–`12.8` tôi kể đủ từng số như Pāli
    (`dve`…`paññāsaṁ kahāpaṇe`, `chín năm`…`hai tháng`, `chín ngày đêm`…`hai
    ngày đêm`) vì đây là lập luận của bài: mức nào cũng không đủ, kể cả khi cộng
    dồn. Rút gọn cũng đúng ngữ nghĩa nhưng làm mất đúng cái lập luận đó, nên
    giữ.
  - >-
    **Ba lỗi số lượng, đều do tôi đọc hụt, và đều là lỗi nghiêm trọng vì bài này
    lập luận bằng chính con số.**
    (1) **`satampi vassāni satampi vassasatāni satampi vassasahassāni`** là
    **ba** khoảng: trăm năm, mười nghìn năm, một trăm nghìn năm. Bản đầu tôi
    viết *trong trăm năm, trong ngàn năm* — **bỏ mất một khoảng** và làm sai
    `vassasatāni` thành nghìn thay vì mười nghìn. Sửa ở cả 6 chỗ.
    (2) **`kahāpaṇasataṁ kahāpaṇasahassaṁ`** ở `5.2` là **trăm và nghìn**
    kahāpaṇa; bản đầu tôi viết *trăm kahāpaṇa, **trăm lần kahāpaṇa*** — đọc
    `sahassa` thành số nhân. Đã sửa.
    (3) **`pañca vassāni`** ở `8.5` là *năm năm*; bản đầu tôi viết *năm …*, mà
    tiếng Việt đọc **năm** thành *năm (thời gian)* chứ không phải *năm (số
    đếm)*. Đã sửa, và thêm phép miễn trừ có chủ đích cho đúng trường hợp này.
  - >-
    **`So ca khvassa …` tôi đã thêm *Vào thời ấy* ở 6 chỗ** — Pāli **không có**
    mệnh đề thời gian nào ở đây; nó chỉ nói *và vị ấy sẽ là*. Đây là loại chèn
    thêm cho dễ đọc, và phải bỏ. Đồng thời `apaṇṇakaṁ vā sotāpanno` → *hay chắc
    chắn là bậc **nhập lưu*** theo `an4.241:2.2` (tiền lệ *bậc nhập lưu*), thay
    vì *bậc chứng đạt* của bản đầu; `sakadāgāmī`/`anāgāmī` → *Nhất lai*/*Bất
    lai* và `apaṇṇaka` → *chắc chắn là* — cả ba **0 segment tiền lệ** toàn
    corpus, đặt mới; hai danh từ đầu là thuật ngữ quen thuộc, còn `apaṇṇaka` là
    trạng ngữ *chắc chắn là* mới cần ghi.
  - >-
    **`sokasabhaye jīvite maraṇasabhaye jīvite` → *trong đời sống đầy lo buồn,
    đời sống đầy sợ chết*** (0 segment, đặt mới): bản đầu tôi viết *đời sống
    **tàn nhẫn**, đời sống tử vong* — `soka` là **lo buồn**, không phải tàn
    nhẫn, và hai vế đều có `sabhaye` (có nỗi sợ ấy) mà bản đầu bỏ mất. Sửa ở cả
    `1.5` và `12.10`.
    **`alābhā … dulladdhaṁ` → *đã chịu thiệt, đã lãng phí điều quý báu*** (0
    segment, đặt mới): `alābha` = mất mát, `dulladdha` = **có được một cách
    không đáng quý**, không phải *lãng phí*; bản đầu dùng *đã đánh mất, đã lãng
    phí* cho cả hai nên mất cả vẻ đối xứng.
  - >-
    **`Dakkho puriso uṭṭhānasampannoti alaṁvacanāyā` → *người khéo léo, làm việc
    thành tựu, xứng đáng được gọi là đại tài***: `uṭṭhānasampanna` → *làm việc
    thành tựu*; `alaṁvacana` → *xứng đáng được gọi là* (tiền lệ `an10.33:1.6` đã
    dùng *xứng* cho `alaṁvacana`). Cụm Pāli này chỉ có 4 segment trong corpus và
    **cả bốn đều là chính bài này**, nên là 0 tiền lệ; **đại tài** đặt mới vì
    bản đầu tôi đặt *đại tiện trước* — vừa lạ vừa không có nghĩa.
  - >-
    **`anāpajja akusalaṁ … nibbiseyya` → *không làm công việc gì, suốt ngày trộm
    … kahāpaṇa***: `kahāpaṇa` giữ nguyên chữ (13 segment tiền lệ đã vậy, Sujato
    dịch *dollar* nhưng đó là quyết định của chính Sujato, không phải của Pāli);
    `trộm` có tiền lệ ngay trong cùng cụm ở `an3.100:8.1`.
  - >-
    **`ekantasukhappaṭisaṁvedī` → *trọn vẹn sự an ổn và sự chuyên chú*** và
    **`yathā mayānusiṭṭhaṁ tathā paṭipajjamāno` → *thực hành đúng như Ta đã chỉ
    dạy***: hai cụm **0 segment**, đặt mới. **`Tiṭṭhantu … dasa vassāni.` → *Xin
    các vị Thiên Tộc Sakk đừng dừng lại ở mười năm***: `Tiṭṭhatu` là cảm thán,
    không phải mệnh lệnh; giữ *xin* để vai người nói đúng.
