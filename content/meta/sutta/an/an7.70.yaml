notes: |-
  Đợt 19, lát l24. Dịch trọn 82/82 khoá từ Pāli root đã ghim; tập khoá và thứ tự khoá khớp tuyệt đối Pāli; không khoá ngoài Pāli.

  COVERAGE ANH. Công thức đúng như src/lib/canon/reference.ts, ngưỡng từ source/layers.yaml (40 ký tự, bỏ khối :0, sàn 0.80): 62 khoá Pāli có nội dung, Sujato phủ 44, tức 44/62 = 0.710 (dưới sàn). Tầng english-sujato có tệp cho an7.70 trong manifest đã ghim. Tầng english-project: không có tệp cho an7.70 nên không cộng thêm. Tầng vietnamese-current vắng: tại commit đã ghim chỉ có 26 tệp Pháp Cú. 18 khoá Sujato bỏ trống đều là phần Pāli lặp lại nội dung đã có ở khoá khác trong cùng bài: toàn bộ 4.1–4.4, 4.8–4.11, 4.13–4.16 là lời Tôn giả Sāriputta thuật lại cho Đức Phật đúng nguyên văn đoạn 1.1–2.9 (Sujato nén thành một câu ở 3.1); 13.1, 15.1, 17.4, 18.1, 20.1, 22.1 là các câu mở rộng của chuỗi lặp. Vì vậy các khoá đó được dịch lại theo đúng cách dịch của khoá song song trong chính bài, và triangulation hạ xuống 8.0: 18/62 khoá không có bản Anh độc lập để đối chiếu. Đây là blocker thật của cổng, không phải điểm số: bài chỉ lên review hoặc published khi lớp english-project lấp được các khoá này hoặc người biên tập ghi nhận gap.

  DÙNG LẠI NGUYÊN VĂN (12 khoá). Đã dò 11 chuỗi Pāli khác nhau của bài có trùng nguyên văn ở bài khác trong tầng: 0.2 (18/18 là 7. Phẩm Lớn), 1.3 và 2.1 (Bấy giờ, Tôn giả Sāriputta nghĩ: đa số 4/7), 2.5 (Người ấy nghĩ: đa số tương đối 20/50), 5.1 và 17.1 (Lành thay, lành thay, này Sāriputta! 10/20), 6.1 (an7.35:2.1), 6.2, 16.1, 17.2, 23.1 (đều theo an7.35:2.2, 2.14, 3.2, 3.14), 23.2 (Thứ sáu. 256/262). Trong 11 chuỗi đó, bản Việt của dự án khác nhau ở 3 chuỗi: 6.2/16.1/17.2/23.1 có hai cách dịch ở an6.69 và an7.35, tôi theo an7.35 (cùng bộ, cùng khuôn Sāriputta giảng rộng lời Phật nói vắn tắt, và đã được chấm published); 2.5 là đa số tương đối; 4.1 (Idha mayhaṁ, bhante, rahogatassa…) có tiền lệ nguyên văn ở ud5.6 là Bạch Tôn giả vì người nghe là Tôn giả Mahākaccāna, còn ở đây người nghe là Đức Thế Tôn nên tôi giữ Bạch Thế Tôn và dùng cụm ở riêng, độc cư của 1.1 (tiền lệ ở riêng, độc cư: nhiều lần trong tầng). Pāli trùng nguyên văn TRONG CHÍNH bài: 8 nhóm (1.3=2.1, 2.3=4.10, 2.4=4.11, 2.7=4.14, 2.8=4.15, 2.9=4.16, 4.3=4.8, 5.1=17.1), cả 8 nhóm bản Việt trùng byte; 0 nhóm bản Việt khác nhau. Nhiều khoá lặp của 4.x và 2.x giữ nguyên cách dịch vì Pāli giống từng chữ; 4.13 khác 2.6 chỉ ở dấu nháy mở đầu của Pāli.

  THUẬT NGỮ (đếm tầng, ưu tiên đa số). sakkatvā garuṁ katvā upanissāya viharanto = cung kính, tôn trọng, sống nương tựa vào: đúng cách tầng đã dịch cụm này (sn, mn, an) và dịch giả tách hai bậc cung kính, tôn trọng khỏi gāravo. agāravo / sagāravo = không tôn kính / tôn kính: trong cùng Pāli ngắn ở an, không tôn kính 15 so với không kính trọng 2, tôn kính 17 so với kính trọng 12; chọn tôn kính để không đụng với cung kính, tôn trọng của sakkatvā garuṁ katvā. sikkhā = học giới (an7.33, an6.32, an7.59), samādhi = định, appamāda = sự không phóng dật (an6.32 hai lần, an7.59). paṭisanthāra = sự đón tiếp ân cần (3 tiền lệ an6.32, an7.59; Sujato dịch hospitality, Thích Minh Châu dịch tiếp đón thân tình). Seyyathāpi nāma = Ví như (28 so với Giống như 12 trên toàn tầng). suvaṇṇanikkha = thỏi vàng (tiền lệ ở tầng). kammāra = thợ rèn (tiền lệ Cunda kammāraputta là con thợ rèn): Thích Minh Châu dịch thợ vàng, tôi giữ nghĩa rộng của Pāli, ghi ở đây. netaṁ ṭhānaṁ vijjati = điều ấy không thể xảy ra, ṭhānametaṁ vijjati = điều ấy có thể xảy ra (tầng dùng cụm này nhiều lần). Sādhu sādhu = Lành thay, lành thay. Thứ sáu. đúng 256 trên 262.

  BẤT ĐỊNH (không thêm vào thân kinh). (1) kiṁ ở 1.2 và 4.2 là đại từ nghi vấn trung tính nên tôi dịch điều gì, không dịch ai như Thích Minh Châu; câu trả lời liền sau lại nêu cả Đạo Sư (người) lẫn Pháp, Tăng, học giới, định, không phóng dật, đón tiếp (không phải người), nên cách dịch trung tính phản ánh Pāli. Chưa có chứng cứ độc lập để chọn ai thay cho điều gì. (2) Ở 1.5–1.9, 4.5–4.6 và 5.4–5.7 Pāli viết tắt bằng …pe… hoặc …; tôi giữ đúng MỘT … và không bung ra, kể cả đoạn tắt còn thiếu động từ. (3) ceva … ca và parisuddhasaṅkhātatara: dịch vừa thanh tịnh, vừa được xem là thanh tịnh hơn nữa (cả Sujato và Thích Minh Châu đều hiểu saṅkhāta là được xem là, và -tara là so sánh hơn); không có điểm bất đồng giữa các nguồn. (4) 17.3 kết bằng …pe… không có dấu chấm, và 17.4 mở bằng yo so viết thường, nên bản Việt kết 17.3 bằng ” …” và mở 17.4 bằng này Sāriputta viết thường đúng như Pāli. (5) 4.12–4.13: Pāli có Tassa evamassa— rồi câu nghĩ không có dấu nháy (khác 2.5–2.6, có dấu nháy đơn); bản Việt theo Pāli từng khoá, không thêm nháy.

  SỐ PĀLI. Bài không có số lượng: chỉ có số bài (7.70) và danh sách bảy mục (đạo sư, pháp, tăng, học giới, định, không phóng dật, đón tiếp). Không có tính toán số nào cần phân xử.

  CÁC PHÉP KIỂM TỰ LÀM. Tập khoá Việt = tập khoá Pāli: 82 = 82, thứ tự khớp. Nháy đơn và nháy kép khớp Pāli từng khoá: 82 khoá, 0 lệch. Dấu lược: 24 khoá Pāli có … hoặc …pe…, mỗi khoá có đúng số … tương ứng ở bản Việt, 0 lệch; Pāli kết ….(12.1, 14.1, 19.1, 21.1) thì bản Việt kết …. đúng đa số của tầng. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang bản Việt. Cặp Pāli với Việt đã đọc đối kháng toàn bộ 82 khoá. Lỗi bản nháp đã sửa: 2.2 và 4.9 ban đầu viết đã thanh tịnh (Pāli chỉ có tính từ, không có ý đã), đã bỏ; 4.6 mở bằng chữ hoa trong khi Pāli viết thường nối tiếp 4.5, đã sửa.

  CỔNG KỸ THUẬT. Lát này bị cấm chạy các lệnh cổng nên không tuyên bố technical gate pass và technical_integrity đặt 9.6. Bốn lệnh còn lại chưa chạy: npm run validate; npm test; npm run check; npm run build. Sau khi gộp, nếu bổ sung được lớp english-project hoặc gap được ghi nhận thì cần chạy lại npm run reference:gaps và npm run audit:store trước khi đổi status.
