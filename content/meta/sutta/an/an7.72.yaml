notes: |-
  TẦNG THAM KHẢO CÓ. Coverage đo theo đúng công thức của kho (ngưỡng đọc từ cấu hình tầng: tối thiểu 40 ký tự Pāli, bỏ khối :0, floor 0,8): 72 khoá Pāli, 49 khoá có nội dung, 0 khoá nào thiếu chữ Anh của Sujato, tức 49/49 = 100%. Tệp Sujato của bài có mặt trong manifest đã ghim (tầng english-sujato, 4.291 tệp). Lớp english-project không có cho bài này và không cần vì Sujato đã phủ hết, nên số 100% này hoàn toàn là bản Anh độc lập, không phải lớp lấp của dự án. Tầng vietnamese-current vắng: commit ghim chỉ có Pháp Cú. Bản Việt nguyên bài của Hòa thượng Thích Minh Châu (hiệu đính Bình Anson, hiện ở mục Tra cứu toàn văn) được đọc để đối chiếu thuật ngữ và không cấp text cho cột nào.

  DÙNG LẠI NGUYÊN VĂN. Đã dò 21 khoá có Pāli trùng nguyên văn với bài khác trong tầng. 18 khoá dùng đúng bản Việt đa số toàn tầng (0.2 = 7. Phẩm Lớn 18/18; 1.7 = Thưa vâng, bạch Thế Tôn. 5/10; 3.2 và 6 khoá Taṁ kissa hetu? = Vì sao vậy? 308/470; 7.1; 18.1 = Đức Phật đã nói như vậy. 104/186; 18.6 = Thứ tám. 253/260; 1.1 = Tôi nghe như vầy. 225/432 toàn tầng và 27/47 trong bộ an). 2 khoá theo bộ an: 1.5 (20 khoá Pāli trùng, 5 trong an, mỗi khoá một cách viết; chọn Ngồi xong, Đức Phật gọi các tỳ-kheo theo an10.69:2.2) và 17.1 (39 khoá trùng, 22 trong an; dạng nhiều nhất trong an là Vì vậy, này các tỳ-kheo, các ông nên học tập như sau 9 khoá, còn toàn tầng nhiều nhất là cần học tập như vậy 14 khoá). 1 khoá khác đa số: 1.2, dùng bản của an5.180 và an6.18 (cùng Pāli, chỉ khác chữ đầu viết hoa), hòa 2 so 2 với ud4.3 và ud5.9 (Đức Thế Tôn đang du hành). Các khoá 5.1/9.1/11.1/13.1/15.1 dùng Điều ấy các ông nghĩ sao, này các tỳ-kheo, (35/91, đa số toàn tầng); 7.1 và 2.1 dùng Các ông nghĩ sao, này các tỳ-kheo (8/27, và 5/6 trong an). Trong chính bài: 3 nhóm Pāli trùng nguyên văn (52 cặp: 7 khoá Taṁ kissa hetu?, 7 khoá Tatonidānañhi so…, 5 khoá Taṁ kiṁ maññatha, bhikkhave, không dấu nháy), 0 cặp mà bản Việt khác nhau.

  CẤU TRÚC BẢY VÒNG. Bài có bảy vòng hỏi đáp (ôm lửa/thiếu nữ, dây thừng cắt đến xương/đảnh lễ, giáo đâm ngực/chắp tay, tấm sắt quấn thân/y phục, viên đồng nhét miệng/thức ăn khất thực, giường ghế sắt/giường ghế, nồi đồng/tinh xá). Đã đọc đối chiếu từng vòng: câu hỏi 2.2/5.2/7.2/9.2/11.2/13.2/15.2, câu đáp 2.3/5.3/7.3/9.3-9.4/11.3/13.3/15.3 và lời tuyên bố 3.1/6.1/8.1/10.1/12.1/14.1/16.1 mang đúng hai vế của vòng ấy; các khoá …4 (4.1, 6.4, 8.4, 10.4, 12.4, 14.4, 16.4) mang đúng vế cúng dường tương ứng. Công thức Tatonidānañhi… và Taṁ kissa hetu? dịch giống nhau ở cả bảy vòng.

  THUẬT NGỮ, KÈM SỐ ĐẾM. aggikkhandha = đống lửa lớn: toàn tầng 13 đống lửa, 12 đám lửa, 5 khối lửa trên 31 khoá (mn79 bốn khoá). Sát-đế-lợi 157 khoá, 0 khoá viết Sát-đế-lỵ. mahāsāla = đại phú: 30 khoá đại phú, 36 giàu có, 5 quyền quý trên 83 khoá; chọn đại phú vì cùng Pāli trong sn3.21 và dn33, và vì giàu có đã dùng riêng cho khattiyamahāsāla ở mn42; ghi ra để biên tập biết đây là lựa chọn. ādittaṁ sampajjalitaṁ sajotibhūtaṁ = đang cháy, đỏ rực, cháy bùng bùng (7/12 khoá; mn129, mn130, sn19.17). dussīla = phá giới (54/199, so với không có giới 46, ác giới 15). Công thức dussīlo pāpadhammo asuci saṅkassarasamācāro … antopūti avassuto kasambujāto theo an3.13 và sn35.241 (ô uế, hành xử khả nghi, thối rữa bên trong, mưng mủ, hư hỏng từ gốc); pāpadhamma = ác pháp theo ud5.5 và iti74; paṭicchannakammanta = che giấu việc làm theo ud5.5. kaññā = thiếu nữ (13/70, mn13:18.2, mn93:13.2). paribhuñjati = thọ dụng (22/182, so với sử dụng 32); giữ thọ dụng vì đi cùng saddhādeyya, như dn1 và dn2 (14 khoá). vihāra = tinh xá (4/311, so với chỗ ở 5, trú xứ 4; ba cách gần ngang nhau, chọn tinh xá vì đây là công trình do thí chủ cúng). abhivādana = đảnh lễ (747/764); añjalikamma = chắp tay cung kính theo mn142:4.3. Cắt xương: chavi = lớp da ngoài, camma = lớp da trong (mn130:20.3 viết da và lớp da trong). Nồi đồng nung đỏ theo mn129:15.1; bọt nhớt, trồi lên trên / chìm xuống dưới / trôi ngang theo mn129:15.2-15.3 (pheṇuddehaka, sakimpi uddhaṁ). ayosaṅkunā = dùi sắt theo mn130:25.5. antaguṇa = màng ruột (18 khoá, như dn22:5.2, dn28:7.4, mn28:6.5). tiṇhāya sattiyā = cây giáo sắc nhọn theo sn35.235:5.1.

  SỐ PĀLI. Số duy nhất là saṭṭhi = 60 (18.2, 18.3, 18.5; saṭṭhimattā): sáu mươi ở cả ba khoá, đối chiếu trực tiếp. Không có số nào khác.

  BẤT ĐỊNH CÒN MỞ (không đưa vào thân kinh). (1) saṭṭhimattānaṁ: Thích Minh Châu viết khoảng sáu mươi, Sujato viết sixty; trong tầng, các khoá có dạng số + matta bỏ chữ khoảng 14 lần và giữ 1 lần, nên viết sáu mươi theo đa số; -matta có thể mang nghĩa ước chừng. (2) sattī (7.2, 7.3, 8.1): Sujato viết sword và Thích Minh Châu viết cây kiếm, nhưng sn35.235:5.1 trong tầng dịch cùng cụm tiṇhāya sattiyā là cây giáo sắc nhọn; theo tiền lệ nội tầng viết cây giáo. Pāli chỉ nói sattī, không phân biệt giáo hay kiếm. (3) vālarajju (5.2, 5.3, 6.1): Pāli chỉ có vāla (lông) + rajju (dây thừng); Sujato và Thích Minh Châu đều viết đuôi ngựa nhưng Pāli không nói ngựa nên viết dây thừng bện bằng lông. (4) ghaṁseyya (5.2) nghĩa đen là cọ xát; Thích Minh Châu viết siết mạnh, Sujato viết tighten; chọn cọ xiết. (5) āhacca tiṭṭheyya (5.2, 5.3, 6.1): sn17.28 và sn17.29 trong tầng dịch cùng cụm là tựa vào tủy xương mà đứng vững; ở đây chọn chạm đến tủy xương và dừng lại ở đó theo Thích Minh Châu và Sujato vì chủ ngữ là sợi dây; ghi để biên tập quyết có đồng bộ hay không. (6) lohaguḷa (11.2, 11.3, 12.1) viết viên đồng theo mn130:25.5; loha có thể là sắt, đồng hay kim loại nói chung (Sujato copper, Thích Minh Châu hòn sắt). (7) 9.3/9.4: Pāli dừng …pe… ở cuối 9.3 rồi nối saddhādeyyaṁ cīvaraṁ paribhuñjeyya ở 9.4; tiếng Việt cần động từ trước tân ngữ nên thọ dụng nằm ở 9.3 và y phục ở 9.4. (8) alameva appamādena sampādetuṁ (17.4-17.6): sampādetuṁ không có tân ngữ trong Pāli; viết chỉ vậy cũng đủ để làm cho thành tựu bằng sự không phóng dật theo Sujato (quite enough); sn12.22:3.10 trong tầng dịch yếu hơn (siêng nỗi) nên không theo. (9) upanisīdeyya vā upanipajjeyya vā: bỏ nghĩa gần của tiền tố upa- vì đã có āliṅgetvā (ôm lấy), theo Sujato; Thích Minh Châu giữ ngồi gần, nằm gần.

  DẤU LƯỢC. Pāli có 17 dấu …pe… ở 15 khoá (4.1, 5.3, 6.1 hai dấu, 6.4, 8.1, 8.4, 9.3, 10.1, 10.4, 12.1, 12.4, 14.1, 14.4, 16.1 hai dấu, 16.4); mỗi dấu giữ đúng MỘT …, không mở rộng chữ nào vào chỗ lược. Không có (…) trần. Ngoặc kép và nháy đơn khớp Pāli từng khoá (72 khoá, 0 lệch).

  LƯỢT REVIEW ĐỐI KHÁNG. Bản nháp đầu viết đối với người ấy trước danh sách phá giới mà đoạn đầu chưa nói ai là người ấy; đã sửa thành đối với người phá giới … ấy. Nháp đầu ở 5.2 viết cắt đứt lớp da ngoài rồi lại cắt lớp da ngoài, thừa chữ đứt; đã gọt. 17.5 và 17.6 ban đầu bỏ chữ hay (vā của Pāli); đã đặt lại. 1.1 ban đầu giữ dấu gạch dài của Pāli (Tôi nghe như vầy—) rồi đo lại: 27/47 trong an và 225/432 toàn tầng viết dấu chấm, nên đổi.

  CỔNG KỸ THUẬT. Đợt này bị cấm chạy npm run validate / npm test / npm run check / npm run build, nên KHÔNG tuyên bố technical gate pass; technical_integrity đặt 9.6. Bốn lệnh đó phải do người điều phối chạy sau khi gộp lát. Đã tự kiểm được và sạch: JSON hợp lệ; 72/72 khoá, tập khoá và thứ tự khớp Pāli; không khoá rỗng; toàn bộ NFC; không có Pāli lọt sang bản Việt; …pe… giữ đúng một …; ngoặc kép và nháy đơn khớp Pāli từng khoá.
