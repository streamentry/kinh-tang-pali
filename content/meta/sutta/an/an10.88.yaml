  - >-
    **⚠ PĨa CỦA `an10.88` NÓI MƯỜI (`dasannaṁ`) NHƯNG CHỈ LIỆT KÊ CHÍN MỤC.**
    Chuỗi dấu phẩy cho thấy chín, vì `saddhammassa na vodāyanti` và `saddhammesu
    vā adhimāniko hoti anabhirato vā brahmacariyaṁ carati` bị nối chung bằng một
    dấu phẩy. Bản Anh Sujato tách đúng chỗ đó thành HAI mục, ra đủ mười. Tôi
    theo cách tách đó — **không bịa mục thứ mười**, và cũng **không bỏ mất mục
    thứ tư**. Đã ghi lại ở đây.
  - >-
    `akkosakaparibhāsako` → *kẻ chửi rủa nói lời độc hại* · `ariyūpavādī` → *kẻ
