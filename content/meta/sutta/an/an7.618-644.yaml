notes:
  - >-
    **Hai mươi bốn lỗi chấm câu của Pāli: mở dấu `“` rồi không đóng.** Đếm được
    14 bài: `an5.242`, `an5.243`, `an5.246`, `an5.247`, `an7.86`, `an9.48`,
    `an9.50`, `an9.53`, `an5.55`… nói rõ là `an9.55`, `an9.56`, `an9.57`,
    `an9.58`, `an9.59`, `an9.60`. Ở mỗi bài, `1.1` mở `“` và không segment nào
    đóng lại (độ sâu kép cuối = 1). Tôi đóng ngay sau mệnh đề cuối của `1.1` để
    người đọc không gặp dấu ngoặc treo, và **đây là cố ý lệch 14 segment** — bộ
    kiểm tra báo đúng mười bốy chỗ ấy, không phải sót sót. Pāli không bị sửa.
  - >-
    **Nguyên văn dùng lại gần như toàn bộ**: tám bước `1.1`–`1.9` lấy từ
    **`an10.240-266`** (đã `published`) — cùng Pāli, chỉ khác ở `1.8` là `cāgāya
    …pe…` thay vì `(…) cāgāya …`. Đây là lý do bài này có điểm cao nhất trong
    loạt.
  - >-
    **`an7.618-644:1.9` là MỘT segment, không phải hai.** Pāli gộp
    `paṭinissaggāya` lẫn vế kết `ime satta dhammā bhāvetabbā”ti.` vào cùng một
    đoạn. Bản đầu tôi tách làm `1.9` + `1.10` theo đúng hình dạng của
    `an10.240-266`, rồi bộ kiểm tra bắt được khoá `1.10` không tồn tại trong
    Pāli. Đọc tệp Pāli từng khoá mới ra — giống hệt bẫy đã gặp ở `an10.212`.
  - >-
    **Khác `an10.240-266` ở con số**: bản đó kết bằng *mười pháp này cần được tu
    tập*, bản này là *bảy* — đúng, vì đây chỉ liệt kê bảy bước.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
