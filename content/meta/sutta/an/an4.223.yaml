notes: |-
  Sửa lan 2026-10-13: khoá an4.223:1.1 — sāvajjo ca hoti sānuvajjo viññūnaṁ, 'đáng bị trách trách và bị người có trí trách móc' → 'có tội và bị người có trí trách móc'. Căn cứ: Pāli; tiền lệ đo trên tầng: sāvajja → 'có tội' 56 khoá so với 'đáng bị trách trách' 16 khoá; mẫu đã sửa ở an4.193; tiền lệ cùng công thức ở an4.4. Khoá an4.223:1.4 (Pāli có hai dấu lược …pe…): 'Ở đây … … bậc trí … sanh ra nhiều phước đức. …”' → 'Với những pháp này … hành động thân thiện, hành động khẩu thiện, hành động ý thiện, và biết ơn, ghi ơn ….' — bản cũ có năm dấu lược, thêm cụm bậc trí / sanh ra nhiều phước đức không có trong khoá và một nháy đóng thừa; sửa để dấu lược khớp Pāli (cổng cắt ngắm).
