notes: |-
  **Phạm vi và nguồn.** 64/64 khoá, thứ tự khoá = thứ tự Pāli, không khoá nào ngoài tập Pāli. Pāli root đã ghim là authority. Tầng English: Sujato phủ 29/29 segment Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); `english-project` không cần vì Sujato không để trống segment nào; `reference-gaps` không phát sinh. Tầng `vietnamese-current` vắng (chỉ có Pháp Cú). Bản Hòa thượng Thích Minh Châu của bài này chỉ ghi "Thế Tôn nói lại kinh 42, kể cả bài kệ, với những thay đổi cần thiết" và không có lời dịch cho từng đoạn, nên không đối chiếu được thuật ngữ từ đó.
  **Hai chỗ Sujato lệch Pāli đã ghim, Pāli thắng.** (1) `4.3`: Sujato liệt kê "Vaccha" và "Persia"; Pāli đã ghim là `vaṅgānaṁ` và `kambojānaṁ` (cùng danh sách mười sáu nước ở an3.70:28.3), nên dịch Vaṅga, Kamboja. (2) `11.1–11.2`: Sujato dịch "they're not worth a sixteenth part of the mind developed with love"; Pāli là `aṭṭhaṅgupetassa uposathassa, kalampi te nānubhavanti soḷasiṁ` — phần mười sáu là của trai giới tám điều kiện, khớp với `4.3`, nên không dịch "tâm từ".
  **Số Pāli đã tự tính.** `paññāsa vassāni` = 50 năm người = một ngày đêm cõi Tứ Đại Thiên Vương; ngày đêm × 30 = tháng; tháng × 12 = năm; `pañca vassasatāni` = 500 năm trời. Chuỗi lược `6.1–6.4`: `vassasataṁ` 100 · `dve vassasatāni` 200 · `cattāri vassasatāni` 400 · `aṭṭha vassasatāni` 800 (đúng thứ tự gấp đôi, khớp an3.70:30–33); `6.5` `soḷasa vassasatāni` = 16 × 100 = 1.600 năm người = một ngày đêm cõi Tha Hóa Tự Tại; `6.8` `soḷasa vassasahassāni` = 16 × 1.000 = 16.000 năm trời. `soḷasiṁ` = một phần mười sáu. Danh sách `4.3` đếm đủ 16 nước. Tám điều kiện: mười hai khoá `7–8` liệt kê đủ (sát sinh, trộm cắp, nói dối, rượu, dâm dục, ăn đêm, hoa–hương, giường cao) và `2.7`, `3.4` đánh số thứ nhất và thứ tám.
  **Tiền lệ và đối chiếu Pāli trùng.** Trong chính bài: 4 nhóm Pāli trùng nguyên văn (`2.6`=`3.3`, `5.2`=`6.6`, `5.3`=`6.7`, `5.6`=`6.10`), cả bốn Việt giống nhau, 0 nhóm Việt khác. Toàn tầng: 38 khoá có Pāli trùng nguyên văn với bài khác. Dùng lại nguyên văn: `5.2`, `5.3`, `6.6`, `6.7` (an3.70, 6/6 cặp), `5.4` (an3.70:29.4), `7.2`–`8.4` theo snp2.14:26.2–27.4 (cùng Pāli, ngoài `8.3` đổi "bố-tát tám chi phần" thành "trai giới tám điều kiện" để thống nhất thuật ngữ với cả phẩm), `3.4` (an8.41:9.4). Khác tiền lệ có chủ ý: `2.6`/`3.3` (an8.41 có 8 cặp "ta sẽ noi theo … về điều ấy, và ta sẽ có giữ trai giới", bỏ mất `imināpaṅgena`; bản này giữ "Với điều kiện này"); `3.1`/`3.2` (an8.41:9.1–9.2 dịch `mañcake` là "chiếc chiếu"; bản này theo an9.18:2.1–2.2 "giường nhỏ hay tấm trải cỏ"); `2.5` (an8.41 "hiền thiện … đặt gậy và kiếm xuống" so với "biết hổ thẹn, có lòng thương, bỏ gậy và gươm" của mn42, dn2); `5.7`, `6.11` (an3.70 "quyền làm người" cho `mānusakaṁ rajjaṁ` — không rõ nghĩa, bản này "vương quyền của loài người"); `6.8` (an3.70:34.4 "Hóa Tự Tại" so với "Tha Hóa Tự Tại" ở mn42, dn33, mn120 — theo đa số). Tên chư thiên: "Tứ Đại Thiên Vương" (44 khoá toàn tầng), "Tha Hóa Tự Tại" (19 khoá).
  **Thuật ngữ trai giới.** `uposatha` dịch "trai giới" theo an8.41 và an8.44 (cùng phẩm); toàn tầng có chỗ "ngày giới" (51 khoá, an3.70, an9.18) và "bố-tát". `aṅga` dịch "điều kiện" theo an8.41/an8.44 (an3.70 và snp2.14 dịch "phần/chi phần"). Đây là phân kỳ của tầng, chưa thống nhất; người biên tập nên quyết.
  **Bất định của chính nguồn, ghi lại chứ không sửa thân kinh.** (a) `4.2` `pahūtarattaratanānaṁ`: an3.70 và Sujato dịch "giàu đầy bảy báu"; Pāli không có chữ "bảy" nên bản này dịch "dồi dào châu báu". (b) `4.3` `etaṁ kalaṁ nāgghati soḷasiṁ`: đọc `etaṁ` là vương quyền vừa nêu ở `4.2` (không bằng một phần mười sáu của trai giới); an3.70:28.3 viết đảo thành "ngày giới … chẳng đáng so với một phần mười sáu", dễ hiểu ngược. (c) `10.3` `siṅgīsuvaṇṇa`: giữ nguyên âm `siṅgī` vì chưa phân xử được nghĩa (vàng "sừng", hay vàng núi theo Sujato); `10.4` `jātarūpaṁ haṭakaṁ`: "vàng tự nhiên được gọi là haṭaka" (tiền lệ mn7:12.2 "vàng tự nhiên"), `haṭaka` giữ âm. (d) `11.3` `candappabhā tāragaṇā ca sabbe` không có động từ hay phủ định; đọc là so sánh với `11.2` ("như ánh trăng so với mọi đám sao"), không thêm chữ "không sánh"; an3.70:39.3 dịch "ánh trăng chẳng thua gì ánh sao" cho ra ý ngược lại về thế vượt trội. (e) `9.2` `yāvatā`: "khắp nơi chúng vận hành đến". (f) `5.6`/`6.10` `sandhāya bhāsitaṁ` là thể bị động không nêu người nói: "chính điều này là điều được nhắm đến khi nói rằng".
  **Dấu lược.** `2.7` Pāli `…pe….` → ` ….` (khớp dạng đa số ` ….`); `6.1–6.4` mỗi khoá một `…`, cân bằng Pāli 5/5 khoá có dấu lược; Pāli không có `…` thì Việt không có.
  **Kiểm kỹ thuật.** Đã tự kiểm: tập khoá Việt = tập khoá Pāli 64/64; nháy đơn ‘’ và kép “” khớp Pāli 64/64 khoá; dấu lược cân bằng 64/64; NFC; không khoá rỗng. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` nên `technical_integrity` đặt 9,6 và không tuyên bố technical gate đã pass.
