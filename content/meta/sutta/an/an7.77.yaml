  - >-
    **Ba chốt mới thêm vào harness sau lát này — vì lỗi (1)(2)(10) đều lọt qua
    mọi chốt cũ.** (a) Sau ngoặc kép mở (`“` hoặc `‘`, có thể mở **hai** ngoặc
    liền nhau như `“‘Vô minh…`) phải là chữ hoa — bắt đúng lỗi `“này các tỳ-
    kheo`. (b) Sau dấu chấm phải là chữ hoa; dùng `.isupper()` của Python chứ
    không dùng regex, vì lớp `[a-zà-ỹđ]` **bỏ sót** `Đ` (U+0110 khác U+0111) và
    báo nhầm. (c) Nới lỗi thứ tự khoá `:1.0` thành `[0-9][0-9–-]*(\. .+)?` vì
    `an2.9:1.0` là `9. Cariyasutta` — số kèm tên, không phải số thuần. ⚠ **Hai
    chốt tôi thử rồi bỏ, ghi lại để không ai thử lại:** *lặp âm* báo nhầm thuật
    ngữ Pāli giữ nguyên (`Dhammakathika` có `mm` hợp lệ); *segment phải có từ
    thuần Việt* báo nhầm uddāna *Tóm lược:* và mọi tiêu đề. Cả hai báo nhầm
    nhiều hơn bắt được.
