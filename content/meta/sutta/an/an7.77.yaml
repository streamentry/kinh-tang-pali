    Pāli. (7) `sn15.10:1.3` là `“bhikkhavo”ti.` — nghĩa là lời gọi, tôi viết
    *“Các tỳ-kheo ơi”* và giữ dấu chấm. (8) `sn22.113:1.4` mở **hai** ngoặc liền
    nhau `“‘avijjā, avijjā’ti` — giữ nguyên, không gộp. (9) `sn19.10:1.6` kết
    `…pe….` tức **một** `…` rồi dấu chấm.
  - >-
    **Bất định có nghĩa đáng kể, đã phân xử và ghi lại:** (1) `bhavā` — kho đã
    `publish` dùng *hữu* cho `kāmabhavo` ở `an3.76:2.1`; trong `an6.105` ba
    *bhava* là ba **cõi tồn tại** người học phải từ bỏ, tôi dùng *cõi tồn tại*
    cho rõ nghĩa, và dùng **cùng một cách** cho cả ba để trong bài không lệch.
    (2) `ubhayenevāyaṁ` ở `sn21.5:1.5` — nghĩa là *cả hai mặt*, nhưng hai mặt
    nào thì chỉ `1.6` mới nói; tôi dịch *đẹp cả hai mặt* và **không** bịa mặt
    nào. (3) `gāmakūṭako` — thành ngữ Hán–Việt *khẩu cục cao cấp* không còn dùng
    và cũng không có trong kho; tôi dịch nghĩa chữ *kẻ mang cục đất trong
    miệng*, giữ nguyên ở cả `1.6` và `2.6` để bài tự nhất quán. (4) `gijjhā` —
    kho đã `publish` không có; Pāli ghép `gijjhāpi kākāpi kulalāpi` là ba loài
    thú, tôi dịch *chó sói, quạ và bầy chó*; nếu `gijjha` thực ra là *quạ* thì
    `kāka` sẽ trùng nghĩa — tôi ghi đây là điểm người biên tập nên kiểm. (5)
    `an5.240:1.7` `dhammamaccharī` — đối xứng `Āvāsamaccharī`… nên *keo kiệt về
    pháp* là cách nhất quán trong bài; xem thêm ghi chú lỗi (4). (6)
    `an2.9:1.4`/`1.6` — Pāli **không** có ngoặc đơn cho lời nói *Mẹ tôi, dì
    tôi…*; tôi không thêm ngoặc, dù thêm sẽ dễ đọc hơn.
  - >-
    **Bẫy đã tránh trong lát này:** (a) **Không cắt chuỗi hằng để ghép câu** —
    đây là nguồn gốc của ba lỗi văn bản vô nghĩa; phải viết tay hoặc truyền
    **nhiều tham số có tên**, không index chuỗi. (b) **Cùng khuôn ≠ cùng nội
    dung** — `an5.217`/`an5.241` và `an5.239`/`an5.240` có **cùng** bốn mục đầu
    nhưng **mục thứ năm khác hẳn** (`saddhādeyyaṁ vinipāteti` vs
    `dhammamaccharī`); tôi tách bốn hằng thay vì dùng chung. (c) **Danh sách
    phải bắt đầu từ đâu** — `sn22.11:1.4` đã nói *sắc* thì `1.12` phải nói
    *thức*; tôi truyền tên danh xưng vào hàm thay vì viết lại. (d) **Hai bài anh
    em cùng tệp Pāli** — `an2.136`/`an2.137` đã làm ở PR #133 bằng **một hàm**
    vì chỉ khác đúng một vế; ở đây `an2.136`… không có, nhưng `an2.42`/`43`/`45`
    dùng **một hàm** vì chỉ khác danh từ và mệnh đề liệt kê. (e) **Tiêu đề
    `…-ādisutta`** — `Bhallikādisutta` là *Kinh Bhallikā Và Các Bài Sau Nữa*
    theo đúng công thức đã dùng ở `sn46.175-184` (PR #133), **không** phải tên
    riêng của bài.
  - >-
    **14 khoá**; bảy pháp của người giữ giới luật, **không** lược — khác
    `an7.80` là của bản trang nghiêm có lược. `1.3`–`1.6` dùng **nguyên văn
    `an7.84:1.3`** cho *biết mình phạm giới / không phạm giới / phạm giới nhẹ /
    phạm giới nặng* (PR #132). `1.9` là bốn tầng định + ba giải thoát.
