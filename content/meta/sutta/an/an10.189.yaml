notes:
  - >-
    Thuộc cụm AN 10 chương 19, Phẩm Con Đường Thánh.
  - >-
    Cùng khuôn Pāli với chương 15 (`an10.145–154`, đã dịch), nên **toàn bộ**
    cách diễn đạt của khuôn được dùng lại nguyên văn, không phát minh: `katamo
    ca, bhikkhave, …?` → "Và thế nào, này các tỳ-kheo, …?" · `ayaṁ vuccati,
    bhikkhave, …` → "Điều này được gọi là, này các tỳ-kheo, …" · `Taṁ suṇātha
    …pe…` → "Hãy lắng nghe và chú tâm kỹ …".
  - >-
    **Hai segment giữa khuôn là mới so với chương 15:** `Pāṇātipāto …pe…` → "sát
    sinh …" và `Pāṇātipātā veramaṇī …pe…` → "kiêng tránh sát sinh …". Cả hai
    theo `an3.117:1.5` và `5.2` — cùng danh sách đã dịch: "sát sinh, trộm cắp,
    tà dâm…" và "kiêng tránh sát sinh, kiêng tránh trộm cắp…". `veramaṇī`
    (*kiêng tránh*) có 430 segment tiền lệ qua `paṭivirato`.
  - >-
    **Bốn bài đầu không có `dhammaṁ`, sáu bài sau có** trong Pāli
    (`Ariyamaggañca vo, bhikkhave, desessāmi …` so với `… dhammaṁ desessāmi …`).
    Tiếng Việt không có mạo từ tương ứng nên hai dạng dịch giống nhau; ghi ở đây
    để người sau biết đó là do Pāli, không phải do lười.
  - >-
    `Ariyamaggavagga` → **"Phẩm Con Đường Thánh"** — cố ý **khác** `Ariyavagga`
    ở chương 15, vốn dịch "Phẩm Bậc Thánh". Pāli phân biệt hai tên chương, tiếng
    Việt cũng nên phân biệt; gộp làm một là mất một chi tiết của bản gốc.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
