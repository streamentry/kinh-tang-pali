notes:
  - >-
    **Bài dài hơn hai bài trước vì mở đầu bằng phần lý luận về ba trạng thái:
    trì trệ `ṭhiti`, suy giảm `hāni`, tiến triện `vuḍḍhi`** — mỗi trạng thái một
    câu hỏi, một định nghĩa, một kết luận, tám segment. `ṭhiti` → *trì trệ* (0
    tiền lệ), `hāni` → *suy giảm* và `vuḍḍhi` → *tiến triện* (theo chương 2 và
    chương 5).
  - >-
    **`Sacittavagga` → *Phẩm Tâm Mình*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *Your Own Mind*, và cả phẩm nói đúng một việc — soi lại
    **tâm mình** (`sacittapariyāyakusala`). Tên bài `Sacittasutta` → *Kinh Chăm
    Chính Tâm Mình*.
    **`Sacittavaggo paṭhamo` ở `an10.60:15.5` dịch là *Phẩm Tâm Mình, thứ
    nhất*** — đây là **số thứ tự của chính Bilara đánh số lại**, vì phẩm này rõ
    ràng là thứ sáu trong Bộ Mười (đúng như `6.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Cả ẩn dụ gương / bát nước đều là thuật ngữ 0 tiền lệ, đặt mới**:
    `mukhanimitta` → *hình bóng khuôn mặt*, `maṇḍanakajātiko` → *thích trang
    điệm*, `raja` → *bẩn bẩn*, `aṅgaṇa` → *tế nhị*, `paccavekkhamāno` → *phản
    tư* (theo `an5.149:1.3`, vốn dùng *phản tư* cho động từ này),
    `paccavekkhaṇā` → *việc phản tư*.
  - >-
    **Lượt review đối kháng bắt được lỗi nghiêm trọng nhất chương, ở sáu
    segment.** Danh sách 20 mục trong Pāli kết bằng `… āraddhavīriyo,
    **asamāhito, samāhito**` — tức *chưa đạt định* rồi mới *đã đạt định*. Bản
    đầu của tôi đảo thứ tự này, và vì **cả hai danh sách 10 mục lấy từ chính
    danh sách 20 mục**, mục cuối của `an10.51:4.2` và `:5.2` (lặp y ở
    `an10.53:7.2`/`:8.2`) **bị đảo cả cực tính**: danh sách “xấu” lại kết bằng
    *đã đạt định*, danh sách “tốt” lại kết bằng *chưa đạt định*. Đây đúng là
    loại lỗi mà đọc lướt sẽ không thấy, vì mười mục đầu vẫn đúng. Đã sửa, và
    hiện dùng hai hằng số tách riêng `XẤT` / `TỐT` với chỉ số tường minh.
  - >-
    **Sáu mục `saddhāya sīlena sutena cāgena paññāya paṭibhānena` lặp y ở `2.2`,
    `3.2`, `4.2`** — tôi dùng nguyên văn cả ba. `paṭibhānena` chỉ có 1 tiền lệ
    (`sn8.3:1.2` → *tài ứng đối*, nghĩa khác) nên tôi dùng *tài ứng đối*;
    `yattako` 0 tiền lệ, dịch *chỉ đến mức nào chừng ấy*.
    **Bản đầu lặp *có một phần* sáu lần** cho sáu danh năng — khó đọc mà không
    thêm nghĩa; đã sửa thành một vế *có tín chân, giới, sự đã học, bố thí, tuệ,
    tài ứng đối, chỉ đến mức nào chừng ấy*.
  - >-
    **Ba câu kết `2.3`/`3.3`/`4.3` và `2.4`/`3.4`/`4.4` cố tình lặp nguyên
    văn**, vì đó là cách bài chốt: `… vadāmi` rồi lặp lại `evaṁ kho … hoti`. Bỏ
    lặp sẽ làm mất nhịp.
  - >-
    **`7.4` kết bằng dấu chấm phẩy** vì Pāli vậy (`kareyya;`), và `7.5` vì thế
    bắt đầu bằng chữ thường — khác `an10.51:4.3` và `an10.52:5.3`, nơi hai câu
    ấy nằm chung một segment nên tôi dùng dấu chấm.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
