notes:
  - >-
    **Danh sách mười tưởng lặp nguyên văn bốn lần** (`1.2`, `1.3`, `2.1`, `3.3`)
    — đúng như Pāli. Không rút gọn và không gộp, vì đây là điểm Đức Thế Tôn nhắc
    lại chính xác tiêu chuẩn định.
  - >-
    **Thuật ngữ lấy từ `an3.116`:** `ākāsānañcāyatana` → *xứ vô số hư không*,
    `viññāṇañcāyatana` → *xứ vô số thức*, `ākiñcaññāyatana` → *xứ vô sở hữu*,
    `nevasaññānāsaññāyatana` → *xứ phi tưởng phi phi tưởng* (79–88 segment mỗi
    chữ, ví dụ `an3.116:2.1` và `3.1`, `an4.171:8.3`).
  - >-
    `samādhipaṭilābho` → *thứ định* (chứng ngộ tam bản định); `yathā … assa`
    dịch thành *mà không có tưởng về …* — giữ `na` và `saññī ca pana assā` thành
    *nhưng lại có tưởng*, vì đây là **điểm mấu chốt** của bài: định không trở
    thành vô tưởng. `evaṁsaññī hoti` → *có tưởng như vậy* theo `dn16:3.25.2`.
  - >-
    **`etaṁ santaṁ etaṁ paṇītaṁ …` dùng nguyên văn `an3.32:4.2`** (13 segment):
    *Đây là sự an tịnh, đây là sự vi diệu, tức là sự lắng dịu của mọi hành, sự
    buông bỏ mọi chấp thủ, sự tận diệt khát ái, sự ly tham, sự diệt, Niết-bàn.*
  - >-
    **Một lỗi ngoặc kép lượt review bắt được:** Pāli `3.3` chỉ **đóng** ngoặc
    (tiếp nối `3.1`) chứ không mở; tôi đã mở thêm. Đã sửa theo đúng cách phân bố
    ngoặc của Pāli.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
