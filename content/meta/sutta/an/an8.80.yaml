notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không căn theo segment nên chỉ dùng để đối chiếu thuật ngữ và mạch lập luận, không dùng làm tầng cột). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú); tầng `english-project` chưa có bản lấp cho bài này, nên coverage dưới đây hoàn toàn là bản Sujato độc lập.
  Coverage English = **48/48** khoá Pāli có nội dung = **100%** (Pāli ≥ 40 ký tự, bỏ khối `:0`), cao hơn xa ngưỡng 0,8; Sujato có key cho 91/91 khoá và có chữ ở 84 khoá. 7 khoá Sujato để trống (`17.2`, `17.3`, `18.0`–`18.4`: colophon `Dasamaṁ.`, `Yamakavaggo tatiyo.` và bốn dòng uddāna) đều ngắn hơn ngưỡng nên không nằm trong mẫu số. Bài không cần entry trong `content/meta/reference-gaps.yaml`.
  **Số Pāli.** `aṭṭha` = *tám* (`1.1`, `1.2`, `8.6`, `9.1`, `9.2`, `17.1`). Thứ tự `paṭhamaṁ`, `dutiyaṁ`, `tatiyaṁ`, `catutthaṁ`, `pañcamaṁ`, `chaṭṭhaṁ`, `sattamaṁ`, `aṭṭhamaṁ` = *thứ nhất … thứ tám*, đối chiếu từng khoá: hai dãy tám khối (`1.7`–`8.5` và `9.7`–`16.5`) khớp 1→8, đúng thứ tự, không khối nào bị nhân đôi hay nhảy. `Dasamaṁ` = *thứ mười*, `tatiyo` = *thứ ba*. Uddāna: `dve` ×3 = *hai* (đức tin, niệm chết, thành tựu).
  **Dùng lại nguyên văn đã có, đếm được.** Trong chính bài có 14 nhóm Pāli trùng nguyên văn, 88 cặp, **0 cặp bản Việt khác nhau**: `1.2`=`9.2`; `1.3`=`9.3`; `Tassa evaṁ hoti:` 11 khoá (`1.4`, `2.2`–`8.2`, `9.4`, `10.2`, `16.2`); `So nipajjati, na vīriyaṁ ārabhati appattassa …` 5 khoá (`1.6`, `2.4`, `3.4`, `4.4`, `8.4`); `So nipajjati, na vīriyaṁ ārabhati …pe…` 3 khoá (`5.4`, `6.4`, `7.4`); `Tassa evaṁ hoti—` 5 khoá (`11.2`–`15.2`); và các cặp mở đầu `2.1`=`10.1`, `3.1`=`11.1`, `4.1`=`12.1`, `5.1`=`13.1`, `6.1`=`14.1`, `7.1`=`15.1`, `8.1`=`16.1`, `9.6`=`16.4`. `0.2` → *8. Phẩm Song Trùng* (5 bài đã có: an8.71/72/74/75/79). `1.2`/`9.2` `Katamāni aṭṭha?` → *Thế nào là tám?* theo `an8.77:2.2` cùng phẩm (dạng *Là tám nào?* của `an8.79` chỉ 1 khoá). `Puna caparaṁ, bhikkhave` → *Lại nữa, này các tỳ-kheo* (155 khoá của tầng). `Dasamaṁ.` → *Thứ mười.* (127 khoá). `Tassuddānaṁ` → *Tóm lược:* (86 trên 111 khoá). `Yamakavaggo tatiyo.` → *Phẩm Song Trùng, thứ ba.* theo `an10.70:12.3` (*Phẩm Song Trùng, thứ hai.*) và `an2.10:1.6` (*Phẩm …, thứ nhất.*).
  **Công thức `appattassa pattiyā anadhigatassa adhigamāya asacchikatassa sacchikiriyāya`** → *để đạt được điều chưa đạt, chứng ngộ điều chưa chứng ngộ, tự thân chứng đạt điều chưa tự thân chứng đạt* theo `an2.44`, `an5.77`, `an5.78` (34 khoá của tầng dùng đúng dạng này, so với 4 khoá `an4.160` dịch *chứng được … thực hiện* và 1 khoá `an3.95` dịch *tự thể hiện*). `na vīriyaṁ ārabhati` → *không tinh tấn* (`an2.44`, `an4.160`); `vīriyaṁ ārabhāmi` → *ta hãy tinh tấn* (`an5.77`); `paṭikacceva` → *trước* (*ta hãy tinh tấn trước* theo `an5.78`). `buddhānaṁ sāsanaṁ manasi kātuṁ` → *chú tâm vào lời dạy của các bậc Phật* theo `an5.78` (5 khoá `1.6`, `2.4`, `3.6`, `4.6`, `5.4`, *chú tâm lời dạy của các bậc Phật*; thêm *vào* cho tự nhiên); `na sukaraṁ` → *khó* theo cùng 5 khoá. `Ṭhānaṁ kho panetaṁ vijjati` → *Sự việc này có thể xảy ra:* (`an7.61`, 6 khoá; không có tiền lệ nào dịch khác). `gilānā vuṭṭhito … aciravuṭṭhito gelaññā` → *vừa khỏi bệnh, mới khỏi bệnh chưa lâu* theo `an3.73:1.3` (*vừa mới thoát bệnh, mới khỏi bệnh ít lâu*) và `an11.12:1.2`; `yāvadatthaṁ` → *thỏa thích* (`an5.206`, `an9.72`, `an10.14`, 5 khoá). `Tassa evaṁ hoti` (43 khoá của tầng): *Người ấy nghĩ:* 23, *Vị ấy nghĩ như vầy:* 10, *Người ấy nghĩ như vầy:* 5; chủ thể ở đây là tỳ-kheo (và đồng bộ với *Vị ấy nằm xuống*, *Vị ấy tinh tấn*) nên dùng *Vị ấy nghĩ:*, bỏ *như vầy* cho gọn.
  **Thuật ngữ mới đặt, kèm lý do.** `kusītavatthu` → *căn cứ lười biếng* (tiền lệ `an9.29:0.3` `Āghātavatthusutta` → *Kinh Căn Cứ Hiềm Hận*; Sujato *grounds for laziness*; Thích Minh Châu *căn cứ biếng nhác*; `kusīta` → *lười biếng* theo `an5.101:5.1`, `an2.44`); `ārambhavatthu` → *căn cứ khởi tinh tấn* (Sujato *grounds for arousing energy*; Thích Minh Châu *căn cứ siêng năng*). `akammañño` → *không đủ sức làm việc* và `kammañño` → *đủ sức làm việc* (Sujato *unfit/fit for work*): tầng chỉ có 3 khoá `kammañña-` (`an1.47`, nói về tâm) dịch *đắc dụng*, không hợp khi nói về thân mệt hay khỏe nên chọn nghĩa theo Sujato; đây là chỗ cần người rà soát chú ý. `maggo gantabbo` → *có đường phải đi* và `maggo gato` → *đã đi đường* (Sujato *has to go on a journey / has gone on a journey*; không thêm *xa* hay *hành trình*). `pavaḍḍheyya` → *tăng thêm*, `paccudāvatteyya` → *tái phát*. `lūkha`/`paṇīta` → *thô*/*tinh* (Thích Minh Châu *thô*/*tế*; tầng không có tiền lệ nào cho cặp này về thức ăn).
  **Bất định đã ghi nhận, không thêm vào thân kinh.** (1) `māsācitaṁ maññe` (`6.3`): dịch *như thể bị chất đầy đậu*; Sujato *like I've just eaten a load of beans*, Thích Minh Châu *nặng nề như loại đậu bị ngâm nước*. `ācita` nghĩa đen là *chất đống, chất đầy*; việc bị nhồi hay bị ngâm thuộc cách chú giải, bản Việt không thêm. (2) `atthi kappo nipajjituṁ` (`7.3`): dịch *nằm xuống là thích hợp*; Sujato *Lying down would be good for me*, Thích Minh Châu *có lý do để nằm xuống*. Ba cách đọc cùng hướng, khác độ mạnh. (3) `11.3`, `12.3`, `13.3`, `14.3`, `15.3` Pāli không có nháy đơn (viết trần sau `Tassa evaṁ hoti—`) và kết bằng dấu lược; bản Việt đúng như Pāli, không thêm nháy. Sujato thêm nháy và dấu `…’ …`. (4) Uddāna `18.1`–`18.4` dịch nghĩa chữ theo tên các kinh `an8.71`–`an8.80` (đức tin, niệm chết, thành tựu, ham muốn, đủ, suy giảm, căn cứ); `athāpare` → *và những kinh còn lại*; độ chắc thấp hơn thân kinh. (5) Các khoá `9.5`, `10.3` khác nhau ở chữ `paṭikacceva` (chỉ `9.5` có): giữ đúng sự khác biệt đó.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 91/91, đúng thứ tự Pāli. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá, 91 khoá (mẫu số 91, 0 lệch): mở `“` ở `1.1`, đóng `”` ở `17.1`; các câu nghĩ `‘…’` ở `1.5`, `2.3`, `3.3`, `4.3`, `5.3`, `6.3`, `7.3`, `8.3`, `9.5`, `10.3`, `16.3`. Dấu lược: 8 khoá Pāli có `…pe…` (`5.4`, `6.4`, `7.4`, `11.3`, `12.3`, `13.3`, `14.3`, `15.3`) và cả 8 khoá Việt giữ đúng một `…`; 83 khoá còn lại Pāli không có dấu lược và Việt cũng không. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang bản Việt; không có `(…)` trần.
