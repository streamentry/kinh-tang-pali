notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit và bài song hành `ud5.5` (cùng câu chuyện và phần lớn cùng Pāli, bản dịch của chính dự án nên **không phải cách đọc độc lập**). Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ có Pháp Cú) nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ.
  **Coverage Anh trên Pāli có nội dung: Sujato phủ 39/43 = 90,7%** (ngưỡng 0,8; mẫu số = 43 khoá ≥ 40 ký tự, bỏ khối `:0`). 4 khoá còn lại `7.4` `8.2` `9.5` `9.9` Sujato để trống và được tầng `english-project` (published) lấp, nên cổng tính 43/43 nhưng phần độc lập chỉ là 39/43. Đã đối chiếu thẳng Pāli cho 4 khoá đó (đều là câu lặp `Yampi, bhikkhave …` ngay sau câu đã có ở `7.3` `8.1` `9.4` `9.8`). Không có blocker coverage.
  **Dùng lại bản dịch có sẵn:** 37/73 khoá có Pāli trùng nguyên văn ở bài khác (1.626 cặp, trong đó 1.379 cặp giống hệt bản của ta); 24 khoá dùng lại nguyên văn một bản đã publish (`1.1` an8.49:1.1; `1.3` `2.2` `2.6` `3.1` `4.1` `4.2` `5.1` `1.5=2.4=2.9=5.4` từ ud5.5/ud3.3; `0.2` 5/5 *2. Phẩm Lớn*; `7.2=9.2` *Là tám nào?* theo an8.1:2.2 (an8: *Là tám nào?* 7, *Thế nào là tám?* 7 — hòa, lấy dạng của bài đầu nipāta); `9.12` *Thứ mười.* 260/265; `10.0` *Tóm lược:* 357/476; v.v.). 13 khoá Pāli trùng nhưng bản Việt khác có chủ ý: `1.2` `2.10` `3.2` `3.3` `3.4` `5.3` `5.5` `7.1` `8.3` `9.4` `9.5` `9.10` `9.11` — lý do ở các dòng dưới. Trong chính bài có 4 nhóm Pāli trùng (`1.5=2.4=2.9=5.4`, `3.7=4.3=4.7`, `3.8=4.4=4.8`, `7.2=9.2`), 0 nhóm có bản Việt khác nhau.
  **Thuật ngữ — đếm toàn tầng so với phạm vi `an`, và chọn theo phạm vi gần nhất:** `parisā` → *hội chúng* (an 150, tầng 256; *đại chúng* chỉ 19 khoá toàn tầng, 0 khoá trong `an`) — lệch khỏi ud5.5 ở `2.10` `3.3` `5.3`. `bhikkhusaṅgha` → *Tăng chúng* (an 19 so *Tăng đoàn* 12; tầng 186 so 76) — lệch khỏi ud5.5. `acchariyā abbhutā dhammā` → *pháp hy hữu vi diệu* (an 18 khoá, chủ yếu an4.127–130; so *kỳ lạ, chưa từng có* 9 khoá trong `an`, và *kỳ diệu, hy hữu* 20 khoá toàn tầng ngoài `an`, gồm ud5.5); thán từ `Acchariyaṁ … abbhutaṁ` → *Thật hy hữu … thật vi diệu* (an4.35). `dhammavinaya` → *Giáo Pháp và Giới Luật* (an 51 so *Pháp và Luật* 36; toàn tầng đảo lại 96 so 51; chọn theo `an`). `moghapuriso` → *kẻ ngu si* (trong `an`: 0 khoá *người rỗng*, 8 khoá *kẻ ngu* / *kẻ ngu si* / *người ngu*; toàn tầng *người rỗng* 53 so *kẻ ngu si* 7 và *kẻ ngu* 4, các khoá *người rỗng* nằm ngoài `an`; ud5.5:7.6 cũng *kẻ ngu si*). `sotāpanno … arahā arahattāya paṭipanno` → theo an8.60:1.3 cùng Pāli (*người nhập lưu … bậc A-la-hán*). `yojana` → *do-tuần* (31 so 7). `asurā` → *a-tu-la* 77/81 khoá (4 khoá còn lại không có chữ này). `pātimokkha` → *giới bổn* khi là đối tượng của `uddisati` (ud5.5; an có 2 khoá) thay vì để nguyên *Pātimokkha* (an 35, nhưng chủ yếu ở cụm `pātimokkhasaṁvara`). `Uposatha` → *Bố-tát*: `an` chỉ 1 khoá so *trai giới* 21, *giữ giới* 14 và để nguyên *uposatha* 3, nhưng hai dạng sau là ngày giữ giới của cư sĩ (an3.70, an4.190); ở đây là lễ đọc giới bổn của Tăng nên chọn *Bố-tát*.
  **Bất định, ghi ở đây chứ không thêm vào thân kinh.** (1) `5.6` `āgamissati` ở thì tương lai; Sujato dịch *waited to be taken* (quá khứ) còn ud5.5:7.6 dịch *để cho người ta nắm tay kéo đi*. Dịch *lại chờ cho đến lúc bị nắm tay* (giữ `nāma` là từ cảm thán; không thêm *mới chịu đi*). (2) `3.8/4.4/4.8` `natthi te … saṁvāso` → *Ông không được sống chung*: Pāli là câu khẳng định (*ông không có sự sống chung*); giữ cách dịch của ud5.5:5.8; Sujato *You can't live in communion*. (3) `2.6/2.7` `nandimukhī ratti` → *đêm đã sáng* theo ud3.3:14.1 và ud5.5:4.1 (hai tiền lệ, không có trong an); nghĩa đen *đêm có gương mặt hoan hỷ* (Sujato *bringing joy to the night*) nên chỗ này là cách đọc theo quy ước, không chắc hơn. (4) `7.4` `8.2` `9.5` `9.9` `Yampi` không dịch thành từ riêng (theo ud5.5:10.2/13.2/14.2 cùng cấu trúc, và an8.20 chỉ lặp lại câu liền trước); tầng `english-project` lấp bằng *The fact that*. (5) `7.5` `(yathā purime tathā vitthāro.)` giữ dấu ngoặc đơn như `sn16.10:6.4`; `purime` (định sở cách số ít) dịch *ở bài trước* theo Sujato *previous discourse* và theo vị trí bài liền trước `an8.19`, Pāli không nêu tên bài. (6) `9.4/9.5` `aññāpaṭivedho` → *sự thấu triệt chánh trí* (không theo ud5.5:19.2 *sự chứng ngộ chân lý*: `aññā` là *chánh trí* ở mn70:22–23 *thành tựu chánh trí*; Sujato *penetration to enlightenment*). (7) `8.1` `nāgā` → *rồng* thay vì *long vương* của ud5.5:17.1 (nāga số nhiều, không phải nāgarāja); tầng cho nāgā đi kèm asurā/gandhabbā có 4 khoá để nguyên *nāga*, 3 khoá *long vương* (toàn ud5.5), 1 khoá *rồng* (sn34.55). `timi timiṅgalo timirapiṅgalo` theo ud5.5:17.1 *cá voi, cá voi nuốt, cá voi nuốt cá voi nuốt* (Sujato *leviathan …*); nhận `timirapiṅgalo` khác `timitimiṅgalo` ở ud5.5 nhưng cùng nghĩa. (8) `3.4` `cetasā ceto paricca` → *dùng tâm mình bao quát tâm* (an1.43/44) thay vì *dùng tâm biết được tâm* của ud5.5:5.4. (9) `3.5` `avassutaṁ` → *nhiễm ô*, `kasambujātaṁ` → *như rác* theo ud5.5:5.5 (cùng chuỗi tính từ); `avassuta` tầng có 3 khoá *nhiễm ô*, 4 khoá *ô nhiễm*, 3 khoá *rỉ*.
  **Số Pāli (tự tính):** `aṭṭha` = 8 (*tám*); `paṭhamo` thứ nhất, `aṭṭhamo` thứ tám; `dasamaṁ` thứ mười; `yojanasatikā` = 1 yojana × 100 = *một trăm do-tuần*, `pañcayojanasatikā` = 5 × 100 = *năm trăm do-tuần*; `dutiyampi/tatiyampi` = lần thứ hai/ba; `paṭhame/majjhime/pacchime yāme` = canh đầu/giữa/cuối. Không có số lớn.
  **Dấu lược và nháy:** Pāli có 7 chỗ `…pe…` (`7.6`, `8.1`, `8.2`, `9.6`, `9.7`, `9.8`, `9.9`), mỗi chỗ đúng một `…` ở Việt (`7.6` là giá trị `…`; `9.6` kết bằng ` …` vì Pāli kết `…pe…` không dấu chấm); Pāli không có `(…)` trần nên Việt không có. Nháy kép và nháy đơn khớp Pāli từng khoá (73 khoá, 0 lệch), kể cả lồng `“…:` ở `3.2` và `‘…’”` ở `3.3`; `“` mở ở `6.2` đóng ở `9.11`.
  **Tiêu đề:** `0.3` `Uposathasutta` → *Kinh Bố-tát* (ud5.5:0.2); các bài cùng tên Pāli ở an3.70 *Kinh Ngày Giới*, an4.190 *Kinh Ngày Trai Giới*, sn29.3 *Kinh Giữ Trai* là kinh về ngày giữ giới của cư sĩ hoặc chư thiên, không phải lễ đọc giới bổn, nên không theo. `10.1–10.4` (`Tassuddānaṁ`, bài kệ tóm lược) dịch theo `an3.10:3` và `an3.20:7` (*Tóm lược:*), tên bài lấy theo tên đã publish ở phẩm: *ngựa thuần thục* (an8.13), *ngựa hoang* (an3.140 `assakhaḷuṅka` → *ngựa hoang*), *cấu uế* (an8.15), *đi sứ* (an8.16), *Bắt* (an8.17/18); `Verañja` `Sīho` `Pahārāda` chưa có bài tương ứng được dịch, giữ tên riêng / *sư tử*.
