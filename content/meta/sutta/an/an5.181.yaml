notes: |-
  Chấm điểm, không dịch. Đối chiếu Pāli root đã ghim với bản Việt dự án và bản Anh Bhikkhu Sujato.
  Tầng Anh Sujato phủ đủ các segment có nội dung, chỉ trống :2.3 là thứ tự Paṭhamaṁ. Tầng Việt Thích Minh Châu vắng với AN ở commit đã ghim nên chỗ khó do Pāli quyết.
  Ghi nhận cho coordinator: simile sữa ở :2.1 gán dadhi thành bơ và navanīta thành bơ lỏng, Sujato là curds rồi butter, chuỗi tiến triển vẫn nguyên; idamatthatā dịch thành tánh không cầu ngoại duyên là cách diễn giải mới, 0 tiền lệ trong kho, nên cân nhắc chú thích khi có lớp comment.
  Cổng kỹ thuật do coordinator chạy: npm run validate, npm test, npm run check, npm run build.
  Sửa 2026-10-18 theo đối chiếu khoá trùng Pāli: 1.3 icchāpakato «có bản tính mong muốn» → «bị ham muốn chi phối» (nghĩa từ sai: pakata là quá khứ phân từ, đã bị đọc như pakati «bản tính»; DPD icchāpakata «who is afflicted with desire; who is led astray by longing» [icchā + apakata], dẫn chú giải AN «tāya eva icchāya abhibhūto hutvā»; chú giải Mahāniddesa «icchāya apakato, upaddutoti attho»; bản Thích Minh Châu an5.93 «bị dục chi phối»; khớp cnd23:213.2, mnd16:67.3, mnd10:42.3). Sujato «being of wishful temperament» là cách đọc khác, DPD và chú giải không ủng hộ.
