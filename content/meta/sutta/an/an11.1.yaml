notes: |-
  **Coverage Anh Sujato trên Pāli có nội dung: 28/28 = 100%.** Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708 (bilara chỉ phân phối 26 tệp tiếng Việt, toàn bộ là Pháp Cú), nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của kho.

  **Hai bài song song, và cả hai đều đã có bản Việt công bố.** `an10.1` là cùng chuỗi
  `kimatthiya` + `kusalāni sīlāni` (bản một-môn-tăng, cùng câu hỏi ở `2.1`-`10.1`),
  `an11.2` là cùng danh sách 10 bước nốt vào (ngược chiều, `11.1` chính là bản tóm
  tắt). 8/38 khoá trùng nguyên văn Pāli; **6 cặp tôi dùng lại NGUYÊN VĂN**:
  `0.2` (6/6) · `1.5` (đổi *sợ hãi*→*hối tiếc*, xem dưới) · `11.11` ·
  `1.1` (215/404) · `1.2` (48/162) · `1.3` (4/21) · `11.12` (262/264) · `0.3`.
  Nhịp và cấu trúc cả hai vế hỏi–đáp theo `an10.1`, phần tổng kết 10 bước theo
  `an11.2:11.1`.

  **`avippaṭisāra` → *không hối tiếc*: tôi theo tiền lệ CỤC BỘ, và đây là quyết định
  quan trọng nhất của bài.** Đếm trên tầng, các khoá có `avippaṭisār` trong Pāli dịch
  **31** lần *không sợ hãi* và **25** lần *không hối tiếc* — gần như ngang. Nhưng
  **toàn bộ `an11.2`-`an11.5` (21 khoá trong cùng Phẩm Nương Tựa) dùng *không hối
  tiếc***, và Sujato dịch *not having regrets*. Theo `skill/translation.md` §12, khi
  hai tầng tham khảo bất đồng thì Pāli và ngữ cảnh quyết định; `avippaṭisāra` là
  *không hổ thẹn / không hối tiếc*, còn *không sợ hãi* là `abhaya`. Vì vậy ở đây tôi
  theo phía cục bộ. `an10.1:2.2` đã công bố dịch *không sợ hãi* cho cùng một câu
  Pāli — **người gộp nên xem lại `an10.1`-`an10.5`** để hai bài không tự mâu thuẫn.

  **Còn `kimatthiyo/kimatthiyā` → *nhằm mục đích gì* và `kimānisaṁso` → *lợi ích ra
  sao ạ?*** theo đúng `an10.1` và `an11.2`. `kimatthiyasutta` có 3 tiền lệ tiêu đề
  chia rẻ: *Kinh Lợi Ích Gì* (an10.1), *Kinh Vì Lý Do Gì* (sn38.4), *Kinh Vì Mục Đích
  Gì* (sn45.5). Tôi chọn *Kinh Vì Mục Đích Gì* vì `kimatthiya` hỏi về MỤC ĐÍCH và vì
  thân kinh dùng *mục đích*; ghi rõ ở đây vì đây là chỗ tầng còn đang phân kỳ.

  **Giữ `nibbidā` và `virāga` là hai bước riêng** (`8.2`-`9.2`, `11.8`-`11.9`) đúng như
  Pāli liệt kê, khớp `an11.2:11.1` và `an11.3:2.8-3.9`. `an10.1` gộp thành *sự chán
  ngại và ly tham* trong một mũi tên, làm mất đúng distinction mà bài này nêu riêng.

  **Dấu lược: bài này KHÔNG có khoá nào bị lược** — không bịa `…` ở đâu cả.

  **`an11.1:11.11` dùng lại nguyên văn** *Như vậy, này Ānanda, những điều lành này
  tiến lên lần lượt, không đi ngược.”* (Pāli trùng tuyệt đối với `an10.1:11.10`).
  Riêng nhịp `11.6`-`11.7` tôi dùng *chánh định* và `11.7` dùng *sự thấy biết như
  thật*, khớp với vế hỏi–đáp ở `6.2` và `7.2` trong cùng bài; `an10.1` dùng *sự định*
  ở `11.6`-`11.7` nên bài kia tự lệch với chính nó.

  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
