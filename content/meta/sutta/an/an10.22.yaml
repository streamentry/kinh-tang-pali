notes: |-
  Nguồn: Pāli đọc bằng `pali.pal('an','an10.22')`, 33 khoá. Tầng Anh đã ghim tra bằng `source/upstream-manifest.json` (`sutta/an/an10/an10.22_translation-en-sujato.json`, tệp có trên đĩa). Đường dẫn tầng Anh của bộ an là PHẲNG, thư mục con theo chương: `translation/en/sujato/sutta/an/an10/…`.
  COVERAGE TẦNG ANH, đo theo `src/lib/canon/reference.ts`: substantive là Pāli có prose >= 40 ký tự và bỏ block `:0` ⇒ 20 khoá. Sujato có prose ở CẢ 20 khoá, nên 20/20, tỉ lệ 1,0, trên ngưỡng 0,8. Đây là phép đo riêng của bài này, không suy từ an6.15.
  KHÔNG CÒN KHOÁ NÀO ĐỂ LẤP Ở LỚP english-project. Đếm trên MỌI khoá chứ không chỉ khoá substantive, Sujato im lặng đúng 1 khoá: `an10.22:13.2` là Dutiyaṁ., 8 ký tự, là bộ đếm chứ không phải văn xuôi. Không có `content/meta/en/an/an10.22.yaml` và không cần tạo. Cũng không có SHADOWING.
  Vì không có lớp lấp nào của chính dự án, mọi đoạn có nội dung đều đối chiếu được với bản Anh đã ghim độc lập, nên triangulation ở đây 9.5, cao hơn an6.15 là 8.6 — bên kia chỉ có 11/13 đoạn độc lập.
  NGUYÊN VĂN TỪ an10.21. an10.21 là bài ngay trước, liệt kê ĐÚNG MƯỜI sức mạnh của Như Lai giống hệt bài này, chỉ khác ở chỗ người nghe là `bhikkhave` thay vì `ānanda` và chỗ Pāli lược. Bản này dùng nguyên văn bản dịch đã có của an10.21 cho các khoá 1.1, 3.1, 3.3, 3.4, 4.1, 5.1, 6.1, 7.1, 8.1, 9.1, 10.1, 11.1, 12.1, 12.2 và 13.1, chỉ thay `các tỳ-kheo` bằng `Ānanda` và cắt đúng tại những chỗ Pāli của bài này có lược. Đây là cách tránh dịch hai lần một công thức.
  Thuật ngữ, kèm số đếm: `tathāgatabala` an10.21 10 khoá và an6.64 6 khoá dùng sức mạnh, mn12 10 khoá dùng năng lực ⇒ chọn sức mạnh. `āsabhaṁ ṭhānaṁ` địa vị con bò đực ở an10.21 8, an6.64 8, an4.8 2, an5.11 2, còn mn12 dùng vị trí hàng đầu 6 ⇒ y hệt an10.21. `brahmacakkaṁ pavatteti` Pháp luân ở an10.21 12, an6.64 8, an4.8 2. `sīhanādaṁ nadati` tiếng rống sư tử ở an10.21 9, an6.64 8. `atikkantamānusakena` vượt tầm người 25, vượt loài người 7, vượt mắt người 2. `Yathābhūtaṁ pajānāti` như thật biết rõ, `pubbenivāsaṁ anussarati` ghi nhớ các kiếp sống quá khứ — cùng cách với an10.21.
  MỐI LỆCH CẦN NGƯỜI GỘP XỬ — `visuddhena`. Cả cụm `dibbena cakkhunā visuddhena atikkantamānusakena` có 91 khoá trong 56 bài, đa số là thiên nhãn thanh tịnh 59, còn thiên nhãn thanh tẩy chỉ 6. Nhưng riêng cụm liệt kê MƯỜI sức mạnh thì an10.21 và an6.64 đều dùng thanh tẩy, và bản này bám hai bài đó để hai bài liền kề đọc như nhau. Đây là đánh đổi có chủ đích theo tiền lệ cục bộ, trái với đa số toàn kho; nếu biên tập muốn theo đa số thì phải sửa cả an10.21 và an6.64 cùng lúc, và sửa thì sửa theo thanh tịnh 59/6.
  `:0.1` của bộ an: 898 Kinh Tăng Chi Bộ N, 318 để nguyên Pāli, 46 cách khác ⇒ chọn Kinh Tăng Chi Bộ. `:0.2` `3. Mahāvagga` có 4/4 Phẩm Lớn. `:0.3` Adhivuttipadasutta KHÔNG có tiền lệ nào trong toàn kho, nên Kinh Chỉ Định là phán xứ của người dịch theo khuôn Kinh + danh từ của an6.14:0.3 và an10.21:0.3; `adhivutti` là sự chỉ định, `pada` là căn cứ, và Sujato dịch Hypotheses. Cùng lý do, 2.1 dùng căn cứ chỉ định cho `adhivuttipadānaṁ`.
  Bất định 1 — sáu mệnh đề ở 2.2 là SÁU nhưng ghép thành BA cặp đối nghịch: santa/asanta, hīna/paṇīta, sauttara/anuttara. Bản dịch giữ đúng ba cặp bằng ba vế có dấu chấm phẩy, và giữ `hīna` thấp kém với `paṇīta` cao quý khác `sauttara` chưa tối thượng với `anuttara` tối thượng, dù hai cặp sau ngữ nghĩa gần nhau.
  Bất định 2 — `Katamāni dasa?` ở 3.2. Cùng một câu Pāli này đã được 11 bài dịch theo 11 CÁCH KHÁC NHAU, đo được trên cả kho: Mười năng lực nào, Mười nền nào, Mười kết trói buộc nào, Thế nào là mười, Là mười nào, Mười gốc nào, Mười đề tài thảo luận nào, Mười sức mạnh nào, Mười căn nào, Mười kết nào và còn hai cách. Ở đây không có đa số để theo, nên bản này chọn Mười sức mạnh nào để khớp với từ ngữ sức mạnh của chính bài. Người gộp lát nên biết đây là một cách thứ N+1 có chủ đích, không phải cách đã chốt.
  DẤU LƯỢC: 4.2, 5.2, 6.2, 7.2, 8.2, 9.2, 10.2 và 11.2 mỗi khoá mang HAI `…pe…`, vì Pāli lược trọn cả hai vế của công thức; 10.1 và 11.1 mang MỘT; 12.2 mang MỘT. Giữ đúng số ở từng khoá, không bung chỗ lược. Khuôn dùng lại là an10.21:9.2.
  NHÁY KÉP: Pāli có một `“` mở ở 2.1, một `”` đóng ở 13.1, và một cặp `‘…’` mở ở 2.2 đóng ở 2.3 bằng `sacchikarissati vā'ti`. Cặp nháy đơn bắt được khi tự so, vì ngoặc của harness chỉ đếm nháy kép.
