notes: |-
  **Phạm vi lát c7: đủ mọi khoá trong `all` của bài, không thêm khoá nào.**
  Chạy lại `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tự kiểm những
  cờ mà `rven88.py` không áp cho tầng Việt: đủ khoá và đúng segment ID theo `pre`
  (tiền tố khoá thật, không phải uid-gộp); ngoặc kép cân trên cả bài; mọi chuỗi
  đã NFC; không Pāli lọt; số dấu lược bằng Pāli.

  **Không đối chiếu được tầng Việt hiện hành.** Tại commit đã ghim,
  `translation/vi/` của bilara chỉ chứa Pháp Cú, nên các bài này không có bản Hòa
  thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu
  sót của kho; `triangulation` vì thế chỉ ở mức Pāli + English Sujato.

  Tôi **không** chạy `npm run validate|test|check|build` (đợt này cấm; người điều
  phối chạy tập trung sau khi gộp các pre), nên `technical_integrity` chấm 9.6
  chứ không phải 10.0.

  **Khung `1.1`/`1.5` theo `an1.130:1.1` (đã `published`).** Cụm
  *vì sự bất lợi và bất hạnh của nhiều người, vì sự tổn hại, bất lợi và khổ đau
  của đông người, của chư thiên và loài người* dùng lại đúng chữ cho Pāli
  `bahujanaahitāya bahujanaasukhāya, bahuno janassa anatthāya ahitāya dukkhāya
  devamanussānaṃ*; `ekapuggala` → *một cá nhân* (`puggala` → *cá nhân* là quy
  ước, ví dụ `an4.93`/`an4.94`); `1.2` *Một cá nhân nào?* theo mẫu *Một pháp
  nào?* của `dn33` cho cấu trúc `Katamo …?`.

  **`1.2`–`1.3` của `an1.319` (cùng nhóm, chưa tới lượt lát này) đã có sẵn
  nguyên văn: `an3.137:3.1`–`3.2` (Pāli y hệt, đã `published`)** — *cái bẫy đặt
  ở cửa sông … Makkhali kẻ mù quáng ấy có lẽ là cái bẫy của loài người*. Người
  gộp nhóm sau này phải dùng lại đúng hai câu đó, không dịch lại.

  **Thuật ngữ `1.3`, có lý do từng chữ.** `micchādiṭṭhi` → *tà kiến* là quy ước.
  `viparītadassana` → *có cái thấy đảo lộn*: *đảo lộn* 41 chỗ cho họ
  `viparīta`/`vipallāsa*, *cái thấy* cho `dassana` đã có tiền lệ.

  **`1.4` đặt mới, 0 tiền lệ cho động từ.** `vuṭṭhāpeti` (thể khiến của *rời
  khỏi*) → *đưa … ra khỏi Chánh pháp*; `patiṭṭhāpeti` → *đặt … vào phi pháp*
  (`phi pháp* cho `asaddhamma* đã vững). Đây là lý do `terminology` chỉ 9.0 và
  `vietnamese_clarity* 9.2 — câu giữ cấu trúc Pāli hơi cứng để không mất đối
  xứng *ra khỏi / đặt vào*.
