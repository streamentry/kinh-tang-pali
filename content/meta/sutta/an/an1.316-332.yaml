notes: |-
  **Phạm vi lát m3: đủ mọi khoá trong `all` của bài, không thêm khoá nào.** Tệp
  trước khi ghi có **8** khoá, nay **60/60**; 8 khoá cũ kiểm lại từng chuỗi và
  **giữ nguyên byte-identical**, chỉ thêm **52** khoá mới. Tiền tố khoá là
  `an1.NNN:` theo từng bài, không phải uid-gộp `an1.316-332:`. Độ dài: Pāli
  **3078** ký tự → Việt **3783** (1,23); riêng phần mới Pāli **2634** → Việt
  **3253** (1,24).

  **Năm phép kiếm tự chạy, in số.** (1) `set(khoá Việt) == set(Pāli)`: Pāli
  **60** / Việt **60**, thiếu 0, thừa 0, rỗng 0, thứ tự đúng bằng `all`. (2) Nháy
  đơn `‘…’`: Pāli **0** / Việt **0**, lệch **0** khoá; ngoặc kép Pāli **28** /
  Việt **28**, lệch từng khoá **0**, cân xuyên bài dư **+0**. (3) Pāli trùng
  nguyên văn mà Việt khác: dựng chỉ mục Pāli→Việt toàn tầng (**100.166** chuỗi
  Pāli có bản Việt; **16.973** chuỗi xuất hiện > 1 nơi, **73.700** cặp, trong đó
  **8.022** cặp Việt khác nhau và **8.951** cặp giống nhau); riêng hai bài lát:
  **65** chuỗi trùng, **937** cặp, **16** nhóm Việt khác — xem dưới. (4) Dấu lược:
  Pāli có **0** khoá `…pe…` và **3** dấu `…` trần (đều ở `an1.329:1.1`), Việt
  **0** và **3**, `lược()` khớp từng khoá, lệch **0**. (5) Mọi số trong khối này
  do script in.

  ⚠ Các tổng số toàn tầng ở mục (3) **đổi mỗi lần đo** vì nhiều agent viết song
  song trong cùng kho; đây là lần đo lúc ghi tệp này.

  **Mười một khoá mới dùng lại nguyên văn bản dịch đã có.** `an1.319:1.2` và
  `:1.3` dùng lại **nguyên văn** `an3.137:3.1`–`3.2` (Pāli trùng từng ký tự, đã
  `published`) — đúng như ghi chú cũ của tệp này đã yêu cầu · `an1.320`–`an1.327`
  tám khoá `:1.2` → *Vì sao vậy?* (đa số **77** khoá `an`, phạm vi gần nhất
  `an1.3xx` **6/6**) · `an1.329:1.3` `Vaggo tatiyo` → *Phẩm thứ ba.* theo
  **nguyên văn** `an1.218:1.2`, và đúng như `an1.315:1.10` đã làm với `Vaggo
  dutiyo`.

  **Thuật ngữ, kèm số đếm.** `ekapuggalo` → *một cá nhân* theo khoá cũ `316:1.1`
  (đa số chung tầng là *một người*: `an1.170`, `an1.172`, `an1.174`; giữ khoá cũ
  là chọn nhất quán trong chính tệp này) · `micchādiṭṭhi` → *tà kiến* và
  `sammādiṭṭhi` → *chánh kiến* (tà kiến **444** / chánh kiến **597** theo thống kê
  của tệp `an1.306-315`) · `viparītadassana` → *có cái thấy đảo lộn* và
  `aviparītadassana` → *có cái thấy không đảo lộn*, dùng lại đúng khung của khoá
  cũ `316:1.3` (tiền lệ cạnh tranh: *thấy sai lệch* 1, *không nhìn ngược* 8,
  *quan niệm đảo ngược* 6) · `mahāsāvajja` → *đáng trách nặng* theo `mn56`
  (*đáng trách nặng nhất* **11** chỗ) · `dhammavinaye` → *Pháp và Luật* ·
  `durakkhāta` → *được giảng dạy vụng về* và `svākkhāta` → *được khéo giảng dạy*,
  theo đúng cặp ở `dn29:4.13`/`dn29:6.11` · vế `yo ca samādapeti … sabbe te
  bahuṁ apuññaṁ/puññaṁ pasavanti` dùng lại **nguyên văn** `dn29:4.11` và
  `dn29:6.9` (*gây nhiều điều bất thiện* / *tạo nhiều phước đức*) · `dāyaka` →
  *người cúng dường* và `paṭiggāhaka` → *người nhận* theo `an4.78` (mười khoá
  cùng cặp) · `mattā jānitabbā` → *nên biết vừa đủ*, **0** tiền lệ cho cụm,
  đặt mới theo nghĩa Pāli (Sujato *know moderation*) và theo *biết vừa đủ trong
  ăn uống* của `mattaññu` · `āraddhavīriyo` → *tinh tấn nỗ lực* (tinh tấn nỗ lực
  **8** chỗ; `āraddhavīriyo` đứng riêng là *tinh tấn* ở `dn34`, `sn2.29`) ·
  `kusīto` → *lười biếng* (**10** chỗ) thay cho *biếng lười* (5) vì đây là người
  chủ thể, không phải vế liệt kê · `dukkhaṁ/sukhaṁ viharati` → *sống trong khổ
  đau / sống trong an lạc* (sống trong khổ đau **6**, sống trong an lạc **6**).
  Đây là lý do `terminology` ở 9,3 chứ không cao hơn.

  **`Seyyathāpi` → *Như thể*, có đếm.** Trong tầng `an`: *Như thể, này các tỳ-kheo*
  **30** so với *Ví như, này các tỳ-kheo* **9**; ở `an1.306-315` lại là *Ví
  như*. Tôi theo số đông của chính bộ và theo khoá `an1.319:1.2` đã dùng lại
  nguyên văn. `mil5.1.10:3.6` có Pāli gần y hệt `an1.328:1.1` nhưng bản Việt đã
  có **bỏ** mất `Seyyathāpi`; tôi giữ lại vì bỏ là mất một đơn vị nghĩa không
  lấy được ở nơi khác.

  **Một chỗ cố ý dịch khác tiền lệ, và lý do.** `an1.328:1.2` và
  `an1.329:1.2` (Pāli **giống hệt nhau**, nên hai bản Việt cũng **giống hệt
  nhau**): `appamattakampi bhavaṁ` và `accharāsaṅghātamattampi`. Tiền lệ duy
  nhất là `mil5.1.10:3.7`, dịch *một tích tục hiện hữu nhỏ bé … tích tục như một
  đàn kiến*. Tôi dịch *một cõi hiện hữu nhỏ bé … lượng nhỏ như một đàn kiến*
  vì chính tệp tiền lệ ấy dịch `bhava` thành *cõi hiện hữu* ở `mil5.1.10:3.4` và
  `:3.7` (cuối câu), nên *tích tục* trong `3.7` là chữ không nhất quán với chính
  nó; `vaṇṇemi` thì theo đúng `:3.7` là *không ưa*.

  **Bốn dấu `…` trần giữ nguyên, không mở rộng.** `an1.329:1.1` có ba `…` trần
  ở Pāli, bản Việt giữ **ba** `…` trần; `muttaṁ` → *nước tiểu*, `kheḷo` → *nước
  bọt*, `pubbo` → *mủ*, `lohitaṁ` → *máu* (cả bốn đều có tiền lệ ở `mn62`/`dn28`/
  `mn119`), `gūtha` → *phân* và `duggandha` → *có mùi thối* theo
  `mil5.1.10:3.6`.

  **Khoá đánh số `:1.0`: quy ước không đồng nhất, đã đo ở phạm vi gần nhất.**
  Trong tệp này tôi ghi **14** khoá dạng **số thuần** (`317`…`329`) và **0**
  dạng dải. Đo ở phạm vi gần nhất `an1.25x`–`an1.3xx`: **45** số thuần / **9**
  dải; đo toàn bộ 204 tệp `an1`: **185** số thuần / **16** dải. Cả hai số đều
  nghiêng về số thuần nên tôi theo số thuần, và khoá cũ `an1.316:1.0` đã là số
  thuần. ⚠ Sujato ghi `329–332` cho `an1.329:1.0` vì 330–332 không có khoá Pāli
  riêng; Pāli đã ghim chỉ có `329`, và Pāli là authority, nên tôi giữ `329`.

  **Sáu mươi khoá này là `an1.316` đến `an1.329`; `330`, `331`, `332` không có
  khoá Pāli trong tệp ghim** nên `all` dừng ở `an1.329:1.3`. Tệp Pāli gốc
  `an1.316-332_root-pli-ms.json` có đúng **60** khoá.

