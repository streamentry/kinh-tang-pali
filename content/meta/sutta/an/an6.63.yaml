notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): 97/97 = 100%.** Sujato chỉ để trống `45.2` (nhãn `Navamaṁ.`, dưới ngưỡng 40 ký tự nên không vào mẫu số). Lớp `english-project` không có tệp cho bài này, nên con số trên hoàn toàn là Sujato độc lập, không lẫn bản lấp. Tầng Việt hiện hành vắng (0/97): tại commit đã ghim bản Việt phân đoạn chỉ có Pháp Cú; `triangulation` vì vậy 9.0 dù Anh phủ đủ.
  **Sujato mở rộng 9 khoá `…pe…` thành văn đầy đủ** (`14.2`, `15.1`, `20.2`, `21.1`, `26.2`, `27.1`, `32.2`, `33.1`, `38.2`); Pāli chỉ viết đầu và cuối cụm, bản Việt giữ đúng một dấu `…` như Pāli (14 khoá có `…pe…` tính cả `19.4`, `25.4`, `31.4`, `37.4`, `43.4`; thêm ba khoá `8.5`–`8.7` có `…` trần của Pāli). Không mở rộng chỗ nào.
  **Dấu nháy:** 142/142 khoá khớp Pāli từng khoá về `“ ” ‘ ’`. Ngoặc kép mở ở `1.1` và `2.1`, đóng ở `1.2` và `45.1`; chỉ có hai khối nháy đơn là `8.1` (câu mở đầu được dẫn lại) và `42.3` (lời người đang khổ). `14.2`, `15.1`, `20.2`… Pāli không có dấu nháy nên bản Việt cũng không thêm.
  **Pāli trùng nguyên văn TRONG CHÍNH bài: 23 cặp, 0 cặp bản Việt khác** (các khối `Phasso, bhikkhave, …`, `Ayaṁ vuccati, bhikkhave, …`, bốn câu `iti yaṁ taṁ vuttaṁ idametaṁ paṭicca vuttaṁ`, ba câu `iti kho panetaṁ vuttaṁ. Kiñcetaṁ paṭicca vuttaṁ?`…). Các khoá cùng công thức nhưng khác danh từ (dục/thọ/tưởng/lậu hoặc/nghiệp/khổ) dịch song song, chỉ đổi danh từ.
  **Pāli trùng nguyên văn Ở BÀI KHÁC: 30 khoá có bản Việt sẵn; dùng lại nguyên văn 24 khoá; viết riêng 6 khoá** (`8.5`, `19.3`, `21.4`, `25.3`, `37.1`, `43.1`), mỗi chỗ có lý do. `8.5`: ba bản sẵn dịch `sotaviññeyyā saddā` là *tiếng do tai nhận biết …*, còn các khoá liền kề `8.6`–`8.8` đã dùng lại nguyên văn `an9.34:1.12` v.v. có *các âm thanh/mùi/vị …*; tôi giữ *âm thanh* cho cả dãy để dãy năm trần cùng một nhịp. `19.3`/`25.3`: ba bản sẵn ở `sn36.15`, `sn36.17`, `sn22.56` đảo thành *Chính con đường đưa đến diệt tận của cảm thọ là Thánh đạo tám ngành*; Pāli `Ayameva ariyo aṭṭhaṅgiko maggo … paṭipadā` có chủ ngữ là *Thánh đạo tám ngành*, nên tôi giữ trật tự Pāli, theo đúng dạng *Chính Thánh đạo tám ngành này …* đã có ở `sn45.40` (7 khoá) và `sn51.29` (6 khoá). `21.4`: hai bản sẵn (`dn33:2.2.15`, `sn22.56:9.3`) dịch *tưởng thanh, tưởng hương*; tôi dùng *tưởng về âm thanh, tưởng về mùi* cho khớp `8.5`–`8.8` và `23.2` của chính bài. `37.1`/`43.1`: bản sẵn duy nhất (`sn35.146:1.11`, `sn22.104:1.12`) mở câu bằng *Và này các tỳ-kheo, thế nào là …*; tôi dùng *Và thế nào, này các tỳ-kheo, là …?* cho cả mười hai câu hỏi `Katamo ca, bhikkhave …?` của bài (dạng này 50 khoá ở `an`, bên cạnh *Thế nào, này các tỳ-kheo, là …?* 72 khoá).
  **Công thức `iti kho panetaṁ vuttaṁ. Kiñcetaṁ paṭicca vuttaṁ?` dùng lại bản `mn139`.** `15.2`, `21.2`, `27.2` = *đó là điều đã được nói. Được nói đến vì nhân duyên gì?* (31 khoá trùng Pāli); `8.2`, `33.2` = *Được nói đến vì nhân duyên gì?* (15 khoá, so với *nhân gì mà được nói?* 16 khoá ở `mn114`; chọn dạng thứ nhất cho khớp `15.2`); `14.3`, `20.3`, `26.3`, `32.3`, `38.3`, `44.3` = *đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói.* (19 khoá trùng Pāli).
  **Thuật ngữ, kèm số đếm toàn tầng:** `nidānasambhava` → *nguồn gốc phát sinh* (`an10.174:10.3` là chỗ duy nhất có chữ này, dịch *nguồn cội phát sanh*; tôi dùng *gốc* + *phát sinh* theo cách viết `sinh` của phần lớn tầng; không có bản trùng) · `vemattatā` → *sự khác biệt* (18 khoá) so với *sự sai khác* (5) · `vipāka` → *quả* (457 khoá) so với *quả báo* (129): chọn *quả* vì Pāli dùng cùng một chữ cho cả dục, thọ, tưởng, lậu hoặc, nghiệp và khổ, và *quả báo* hẹp về nghiệp · `kāmaguṇā` → *dục trưởng dưỡng* (`an` 23 khoá, toàn tầng 51 khoá) so với *dục lạc* (12) và *dục công đức* (8) · `sāmisā`/`nirāmisā` (đối với thọ) → *thuộc về thế tục* / *không thuộc về thế tục*, theo `dn22:11.5`, `mn10:32.5` (12 khoá); `sn36.31` dịch *thuộc vật chất* cho hỷ/lạc/xả/giải thoát, nhưng ở đó ngữ cảnh là bốn thứ khác, không phải thọ · `veditabba` → *cần được biết* (khác `pajānāti` → *biết rõ*) · `ariyasāvako` → *Thánh đệ tử* (784 khoá Pāli có chữ này, dạng *Thánh đệ tử* là dạng thường gặp nhất) · `nibbedhika` → *thấu suốt* (8 khoá `nibbedhikapañña` → *trí tuệ thấu suốt*, 5 *thông suốt*, 3 *thấy thấu*; `an6.64:14.3` dịch *quán thẳng thấm* ở uddāna, `sn55.74` đặt tên *Tuệ Thấy Thấu*) · `dhammapariyāya` → *pháp môn* (`an7.51`, `mn114`, `sn55.7`) · `Mahāvagga` → *Phẩm Đại* (như `an6.59`–`an6.64`) · `diṭṭheva dhamme upapajje vā apare vā pariyāye` → *ngay trong hiện tại, hoặc trong kiếp sau, hoặc trong một thời kỳ về sau* (theo `mn136:17.4`, `an3.34:2.2`) · `tiracchānayoni` → *loài súc sinh* (59 khoá) so với *bàng sinh* (12) · `pettivisaya` → *cõi ngạ quỷ* (108) · `āsava` ba loại → *dục lậu, hữu lậu, vô minh lậu* (`dn33`, `sn45.163`, `sn47.50`, `iti56-57`) · `phoṭṭhabba` → *xúc chạm* (như `an9.34`), còn `phassa` → *xúc*.
  **Số Pāli:** năm `kāmaguṇā` (`8.3`; `8.4`–`8.8` liệt đủ năm: sắc, âm thanh, mùi, vị, xúc chạm) · ba vedanā (`15.4`: lạc, khổ, không khổ không lạc) · sáu thọ chia theo `sāmisa`/`nirāmisa` (`17.2`: 3 × 2 = 6) · sáu saññā (`21.3`–`21.4`: sắc, âm thanh, mùi, vị, xúc chạm, pháp) · ba āsava (`27.3`–`27.4`) · năm cõi (`29.2`, `35.2`: địa ngục, súc sinh, ngạ quỷ, người, trời; đếm 5/5) · ba loại quả của nghiệp (`36.2`–`36.3`: hiện tại, kiếp sau, thời kỳ về sau) · bốn loại khổ (`41.2`: nặng, nhẹ, chậm phai, mau phai) · tám chi Thánh đạo (`13.4`, mỗi chỗ liệt đủ tám hoặc dùng `…pe…` ở năm khối sau) · `ekapadaṁ dvipadaṁ` → *một câu hay hai câu* (`42.3`). Không có số lớn, không có cụm số chưa phân xử.
  **Bất định (ghi ở đây, không đưa vào thân kinh):**
  (1) `saṅkapparāgo` (`8.10`, `8.12`) → *tham đắm trong tư duy*. Bản sẵn duy nhất là `sn1.34:4.2` (*tư tưởng tham ái*) — tôi không giữ vì bài này dùng *ái* riêng cho `taṇhā` (`40.2`, `43.2`) và *tham* cho `rāga`; Sujato dịch *greedy intention*.
  (2) `attabhāvaṁ abhinibbatteti`, đặc biệt `tajjaṁ tajjaṁ` (`12.2`, `18.2`, `30.2`) → *tạo ra thân hiện hữu tương ứng*. `attabhāva` có 54 khoá dịch *thân*, 25 khoá *cá thể*; không có bản trùng cho cụm này. `yaṁ … kāmayamāno` được hiểu là *khi khao khát dục* (như Sujato *When one who desires …*), không phải quan hệ `yaṁ`–`ayaṁ` theo nghĩa *điều nào … thì điều ấy*; chủ thể không nêu trong Pāli nên dịch *người ta*.
  (3) `vohāravepakkaṁ saññaṁ vadāmi` (`24.2`) → *tưởng có quả là sự diễn đạt*; `vohāra` ở `mn54` dịch *việc thế tục*, ở đây ngữ cảnh là việc nói ra điều đã nhận ra (`24.3`), nên dùng *diễn đạt* (Sujato *communication*). `24.3` `evaṁ saññī ahosinti` là lời trực tiếp nhưng Pāli khoá đó không có dấu nháy nên bản Việt chuyển thành *rằng mình đã có tưởng như vậy* mà không thêm nháy.
  (4) `cetanāhaṁ … kammaṁ vadāmi` (`33.3`) → *ý định*. Các nơi khác dịch `cetanā` thành *tư* khi đứng trong danh sách tâm sở (`mn9:54.2`, `mn111`) và *ý định* khi đối lập với nghiệp (`mn57:11.2`); chọn *ý định* vì ở đây Pāli định nghĩa chính nghiệp, người đọc cần hiểu ngay.
  (5) `nirayavedanīyaṁ` … (`35.2`) → *phải cảm thọ trong địa ngục …*; chỉ giữ nghĩa `vedanīya` (*sẽ được cảm thọ*), không thêm *quả*. Sujato diễn *lead to rebirth in …*, rộng hơn Pāli.
  (6) `so imaṁ nibbedhikaṁ brahmacariyaṁ pajānāti kāmanirodhaṁ` (`14.1`, `20.1`, …) → *biết rõ phạm hạnh thấu suốt này là sự diệt của các dục*, theo Sujato (*they understand that this penetrative spiritual life is the cessation of …*). Còn một cách đọc *biết rõ phạm hạnh thấu suốt này, tức sự diệt của …* khác về dấu câu, không khác về nghĩa. Pāli ở `20.1` ngắt chấm trước `So imaṁ …`, các khoá `14.1`, `26.1`, `32.1`, `38.1`, `44.1` thì dùng dấu phẩy; bản Việt dùng *… như vậy, thì vị ấy biết rõ …* cho cả sáu để câu có vị ngữ.
  (7) Tên bài `0.3` *Kinh Thấu Suốt*: `an6.64:14.3` (đã published) gọi bài này bằng *trí tuệ quán thẳng thấm* trong uddāna của Phẩm Đại. Tôi không sửa `an6.64`; nếu biên tập muốn thống nhất tên thì phải sửa cả hai nơi cùng lúc.
  (8) Lỗi ngoài lát, chỉ báo: `an6.64:7.1`, `7.2`, `13.1` có chữ *thế* lẽ ra là *thể* (*điều có thế*, *không thế*), 3 khoá; không sửa.
