notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit 11c9d708. Ghi đủ 74/74 khoá của bài, thứ tự khoá đúng thứ tự Pāli, không khoá nào ngoài Pāli.
  **Coverage Anh Sujato trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): 30/30 = 100%.** Không khoá nào trong mẫu số bị Sujato để trống. Chưa có lớp `english-project` cho bài này, và cũng không cần: nên coverage 100% là của riêng Sujato, độc lập, không phải bản lấp của dự án. Lưu ý: ở `5.11`, `6.13`, `7.11` Pāli là `…pe…`, Sujato viết đầy đủ hoặc rút gọn theo cách của ông; bản Việt giữ đúng một `…` theo Pāli, không mở rộng theo Sujato.
  Tầng Việt hiện hành vắng ở commit đã ghim: bilara chỉ phân phối Pháp Cú tiếng Việt. Bản nguyên bài của Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn chỉ có phần mở đầu và một chú thích tóm lược ("kinh này giống Kinh 67, chỉ khác các pháp được đề cập"), không có phần thân kinh, và chú thích ấy liệt kê không nhất quán (một danh sách có *trì pháp* hai lần, thiếu *tinh tấn*), nên chỉ dùng được làm chứng cứ thuật ngữ phụ (lắng tai, suy tư ý nghĩa, thực hành đúng pháp), không dùng đối chiếu cú pháp. Pāli quyết định.
  **Pāli trùng nguyên văn ở bài khác: 10 khoá có cặp trùng, 360 cặp đã dò (đếm theo khoá, bỏ trùng bản sao), 51 cặp trong đó bản Việt hiện có khác bản này.** Dùng lại nguyên văn theo đa số ở 7 khoá: `0.2` (7/7) · `2.3` `Lưng Ta đang đau;` và `2.4` `Ta sẽ duỗi lưng.”` (cùng `mn53:5.3`, `5.4`, 1/1) · `3.2` `Tại đó, Tôn giả Sāriputta gọi các vị tỳ-kheo:` (14/21) · `3.3` `Này các hiền giả tỳ-kheo!` (13/25) · `3.5` `Tôn giả Sāriputta nói:` (19/24) · `7.13` `Thứ tám.` (253/260). Ba khoá cố ý khác tiền lệ: `1.2` (hai bản có sẵn chia 1/1; tôi dùng dạng thứ ba, sát `mn110:2.1`, vì `tadahuposathe` có thể dịch *ngày Uposatha* hoặc *ngày trai giới* với số lượng ngang nhau); `2.5` (`dn33:1.5.6` viết *vâng lời Đức Thế Tôn*; trong bài này `bhagavā` nhất quán là *Đức Phật* theo đa số của Tăng Chi Bộ nên viết *vâng lời Đức Phật*); `3.4` (`Āvuso” ti kho te bhikkhū…` có 18 khoá trùng chia nhiều dạng câu, không dạng nguyên câu nào quá 4 khoá; hai bài `an10.52` và `an10.55` dùng *Bạch đại hiền giả*, nhưng đó là cách xưng hô tôn kính còn `āvuso` là cách gọi ngang hàng nên tôi chọn *Thưa hiền giả*, mở đầu của 11/18 khoá Pāli trùng, và ghép với *các vị tỳ-kheo ấy đáp lời Tôn giả Sāriputta* như `an10.52`).
  **Trùng nguyên văn trong chính bài: 17 nhóm Pāli giống nhau, 25 cặp, bản Việt 0 cặp khác nhau.** Gồm tám khoá liệt kê `…natthi …` của `4.2`–`4.8` lặp ở `4.12`–`4.18`, và `4.9` = `4.19`; cùng cấu trúc cho dạng `atthi`. Hai khoá Pāli `6.11` và `4.9` khác nhau đúng một dấu phẩy (`kusalesu dhammesu tassa`) nên không thuộc nhóm trùng; bản Việt đặt cùng một câu vì nghĩa không đổi.
  **Thứ tự `paññā` / `vīriya` ở `6.5`–`6.6` đổi chỗ so với `4.3`–`4.4`, `5.3`–`5.4`, `7.3`–`7.4`:** Pāli ghim ở `6.5` là `paññā natthi …` rồi `6.6` là `vīriyaṁ natthi …` (ngược các chỗ khác). Bản Việt theo đúng Pāli từng khoá (`6.5` *không có trí tuệ …*, `6.6` *không có tinh tấn …*); Sujato viết lại theo thứ tự thường lệ nên không phản ánh chỗ này. Không đổi nghĩa.
  **Dấu lược `…` trần của tầng Pāli ghim — giữ nguyên.** `4.1`–`4.8`, `4.11`–`4.18`, `5.1`–`5.8`, `6.3`–`6.10`, `7.1`–`7.8` đều kết bằng ` …` trần (không phải `…pe…`) theo quy ước tầng; bản Việt giữ đúng một ` …` ở mỗi khoá và không viết đủ phần bị lược. Ba khoá `…pe…` (`5.11`, `6.13`, `7.11`) cũng giữ đúng một `…`.
  **Thuật ngữ, kèm số đếm trên tầng Việt đã có (đếm theo khoá, bỏ trùng bản sao).** `saddhā` → *lòng tin* (27/59 khoá trong Tăng Chi Bộ so với *niềm tin* 18 và *đức tin* 5; toàn tầng 107/245; riêng Tăng Chi Bộ quyển mười chỉ có 5 khoá và ở đó *niềm tin* chiếm 3, mẫu quá nhỏ để lấy làm chuẩn, nên theo đa số toàn tầng) · `hirī` → *hổ thẹn* (36/44) và `ottappa` → *kính sợ* (72/127 khoá trong Tăng Chi Bộ; còn *quý* 34, *xấu hổ* 8) · `vīriya` → *tinh tấn* (390/459) · `paññā` → *trí tuệ* · `sotāvadhāna` → *sự lắng tai nghe* (26/27 khoá dùng *lắng tai*) · `dhammadhāraṇā` → *sự ghi nhớ Pháp* (10/10) · `atthūpaparikkhā` → *sự khảo sát ý nghĩa* (theo `mn70:24.7`, cùng danh sách `sotāvadhāna` – `dhammadhāraṇā` – `atthūpaparikkhā`; toàn tầng 14 khoá chia *kiểm tra* 6, *khảo sát* 5, *suy xét* 3, *tìm hiểu* 3, không có đa số rõ, nên ghi là chọn có chủ ý theo bài cùng danh sách) · `dhammānudhammappaṭipatti` → *sự thực hành pháp tùy theo pháp* (theo `dn33:1.11.107` và `dn34:1.4.3`, cùng danh sách; các cách khác trên 19 khoá của tầng: *đúng chánh pháp* 8, *hợp pháp* 6, *pháp thuận pháp* 5; không có đa số rõ) · `appamādo natthi/atthi` → *không có sự không phóng dật / có sự không phóng dật* (`appamāda` → *không phóng dật* 208/270 khoá; cách nói *không có sự không phóng dật* nặng nề nhưng giữ nguyên danh từ của Pāli, không đổi thành *phóng dật* vì Pāli không viết `pamādo`) · `kusalesu dhammesu` → *các pháp thiện* (179 so với *thiện pháp* 46) · `catugguṇaṁ saṅghāṭiṁ` → *y tăng-già-lê gấp bốn* (7/14 khoá dùng *tăng-già-lê*, *sa-đề* 4, *y ngoài* 2; cùng `dn33:1.5.7`, `sn1.38:1.6`) · `tuṇhībhūtaṁ tuṇhībhūtaṁ` → *hoàn toàn im lặng* (4/8, như `mn118:7.2`, `mn110:2.2`) · `āvuso` → *hiền giả* (đa số).
  **Hai chỗ khác tiền lệ gần nhất, nói rõ.** (1) `kāḷapakkha` / `juṇhapakkha`: `an10.14:7.1` và `14.1` viết *tuần hạ* / *tuần vọng*; tôi viết *nửa tháng trăng khuyết* / *nửa tháng trăng tròn dần* theo nghĩa `pakkha` là nửa tháng và theo Sujato (*waning/waxing fortnight*) vì *tuần hạ* khó hiểu với người đọc hiện đại; chỉ có một bài tiền lệ nên không phải quy ước tầng. (2) `ārohapariṇāhena` → *đường kính lẫn chu vi*, theo `an10.14:7.1` và Sujato.
  **Bất định, ghi ở đây chứ không đưa vào thân kinh.** (a) `hāyateva vaṇṇena hāyati maṇḍalena hāyati ābhāya hāyati ārohapariṇāhena` (`4.10`, `6.12`, và dạng `vaḍḍhateva …` ở `5.10`, `7.10`): bốn lần `hāyati` nhưng chỉ có ba tân ngữ-công cụ đầu có động từ riêng, còn `ārohapariṇāhena` đứng một mình. Bản Việt hiểu cả bốn đặc điểm (sắc đẹp, độ tròn, ánh sáng, đường kính và chu vi) đều chỉ giảm/tăng, giống Sujato; chọn cách ít giả định nhất. `vaṇṇa` dịch *sắc đẹp* (Sujato *beauty*), `maṇḍala` dịch *độ tròn* (Sujato *roundness*): nghĩa đen *vầng/đĩa*, nhưng ở đây là một đặc điểm của mặt trăng chứ không phải vật thể thứ hai. (b) `paṭibhātu taṁ` (`2.2`): Sujato dịch *as you feel inspired*; `dn33:1.5.3` bỏ hẳn sắc thái này. Tôi giữ *tùy theo điều con cảm hứng* vì Pāli `paṭibhātu` có nghĩa *hãy hiện rõ trong tâm*, không bắt buộc đúng một cách dịch. (c) `paccuṭṭhāya` (`6.1`): dịch trung tính *dậy* vì Pāli không nói Đức Phật ngồi hay đứng. (d) `appamādo natthi kusalesu dhammesu` — xem phần thuật ngữ ở trên.
  Các phép kiểm tự viết trên mọi khoá, không chỉ khoá ≥ 40 ký tự: tập khoá Việt = tập khoá Pāli (74/74, thứ tự trùng); nháy đơn và nháy kép khớp Pāli từng khoá (74 khoá, 0 lệch); dấu lược `…` cân bằng Pāli ở mọi khoá (…pe… = một `…`; `…` trần giữ nguyên; 0 lệch); NFC; không khoá rỗng; không khoảng trắng thừa; không từ Pāli lọt vào ngoài tên riêng (Naḷakapāna, Sāriputta, Uposatha, palāsa). Không có số lượng Pāli cần tính ngoài `catugguṇa` = *gấp bốn* (4 lớp) và `aṭṭhamaṁ` = *thứ tám* (8); không số lớn.
  Đợt này bị cấm chạy cổng của kho, nên `technical_integrity` đặt 9.6 chứ không phải 10.0 và không tuyên bố technical gate pass; còn phải chạy: npm run validate; npm test; npm run check; npm run build.
