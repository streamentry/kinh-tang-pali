notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** `3.6`, `4.4`, `5.4`, `6.4` đều cắt mất vế tự mô tả lặp lại của chính
  người nói; `3.6` mất trọn danh sách mười hai phẩm chất nên còn 35 ký tự cho 179 ký tự
  Pāli. `3.5`, `4.3`, `5.3` mang dấu `…` bịa ra để che chỗ thiếu trong khi Pāli
  không có `…pe…`. Đã viết lại `3.5`, `3.6`, `4.3`, `4.4`, `5.3`, `5.4`,
  `6.3`, `6.4` cho khớp đúng Pāli từng khoá.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Hòa thượng Thích Minh Châu (bài này có cả bản Anh Sujato trong tầng đã ghim, nên được đọc thêm làm chứng thứ ba, không phải thay thế). 6 điểm bất đồng nghĩa → sửa 1 (6.1/6.4/6.5: *được cho … ngợi khen* → *ham lợi lộc, ham cung kính, ham không bị chê* và *ngưỡng mộ*: `lābhakāmo` là ham lợi lộc chứ không phải "được cho", `anavaññattikāmo` là ham không bị khinh chê chứ không phải ham được khen — bản nguyên bài và ba bài song song `an7.1`, `an7.2`, `an8.4` đều theo nghĩa "không bị chê"; `mānessanti` ở các bài khác của tầng là *ngưỡng mộ*, không phải *ngợi khen*), giữ 4 (1.5: bản nguyên bài viết Bāhiya "đứng về phía hòa hợp" trái Pāli `saṅghabhedāya ṭhito` = dấn vào việc phá hòa Tăng, giữ bản dự án; 2.2: bản nguyên bài bỏ `tumhe ceva` — Pāli nói chính Ānanda cùng Sāriputta và Moggallāna, giữ; 3.3/3.6: `avassuto kasambujāto` bản nguyên bài hiểu là đầy ứ dục vọng, bản dự án *mưng mủ, dơ bẩn* theo cách đọc của tầng ở 8 chỗ khác (`an3.13`, `an3.27`, `an8.19`, `sn35.241`…), Pāli cho cả hai cách đọc; 3.6/4.4/5.4/6.4: `nāsessanti` bản nguyên bài *làm hại*, bản dự án *trục xuất* theo bối cảnh kỷ luật), bất định 1 (`avassuto`, cùng khoá 3.3/3.6). Đọc đối kháng lại cả 39 khoá từ Pāli: không thấy lỗi nào khác ngoài các điểm trên. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá.
