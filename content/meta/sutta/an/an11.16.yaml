notes: |-
  Đợt 19, lát l16. Dịch từ Pāli root đã ghim, đối chiếu English Bhikkhu Sujato tại cùng commit; bài này không có lớp english-project. Đọc thêm bản Hòa thượng Thích Minh Châu nguyên bài ở mục tra cứu toàn văn (không phải tầng store, không cấp text cho cột nào) để đối chiếu thuật ngữ và các chỗ nghi vấn bên dưới.

  **Coverage Anh trên Pāli có nội dung: 59/59 = 100%** (khoá Pāli ≥ 40 ký tự, bỏ khối `:0`; Sujato phủ cả 59, không khoá nào chỉ có `…`). Toàn bộ là Sujato độc lập, không có khoá lấp của dự án; trên sàn 0,8 nên không cần ghi nhận gap. Tầng Việt hiện hành vắng ở commit đã ghim: bilara chỉ có Pháp Cú, đây là giới hạn của snapshot upstream.

  **Dùng lại nguyên văn đã có trong tầng (16/72 khoá bằng đúng một bản đã công bố):** `0.2` theo 8/8 bản (`2. Phẩm Nhớ Tưởng`) · `1.2` = `mn52:1.3` · `2.2` = `mn52:2.2` · `2.4` = `mn52:2.4` · `7.2` theo 17/17 bản (`với tâm hỷ …`) · `7.3` và `7.4` = `an10.219:7.3`, `an10.219:7.4` · `11.4` theo 248/254 bản (`Thứ …`) · `5.3` theo 5/16 bản (`chứng và an trú thiền thứ tư`, đa số tương đối) · `5.2` theo 2/6 · `4.3` cùng năm khoá `suy xét` còn lại: Pāli `So iti paṭisañcikkhati:` có 36 khoá trùng ở bài khác, 22 dịch `Người ấy suy nghĩ như sau:` (khung `puggala`), 9 dịch `Vị ấy suy xét:` (khung `bhikkhu`, gồm sáu chỗ ở `mn52`); bài này chủ thể là tỳ-kheo nên theo `mn52`. Tổng dò: 31 khoá có Pāli trùng ở bài khác, 546 cặp, 338 cặp cùng lời Việt, 208 cặp khác lời Việt (phần lớn là biến thể thuật ngữ trong 36 cặp `paṭisañcikkhati` và các khung câu khác nhau).

  **Trùng nội bộ trong chính bài, đã dò từng cặp:** năm nhóm Pāli giống nhau (6 khoá `So iti paṭisañcikkhati:`, 6 khoá `So tattha ṭhito …`, 6 khoá `no ce āsavānaṁ khayaṁ …`, 5 khoá `‘Yaṁ kho pana kiñci …’`, 3 khoá `Ayampi kho, gahapati … pe …`), 26 khoá, 0 cặp mà bản Việt khác nhau. Hai khoá `4.8` và `5.9` chỉ khác nhau ở một dấu phẩy Pāli nên cùng một lời Việt.

  **Thuật ngữ, kèm số đếm:**
  - `tena bhagavatā jānatā passatā arahatā sammāsambuddhena` → *Thế Tôn, bậc biết và thấy, bậc A-la-hán, Chánh Đẳng Giác* (`mn52:3.2`); `sammadakkhāto` → *khéo giảng*: toàn tầng có 5 khoá, 4 dịch *khéo giảng* (`sn46.14:3.3`, `sn46.15:3.3`, `sn46.16:2.3`) và 1 dịch *tuyên thuyết chánh đáng* (`dn33:1.7.10`); chọn đa số, và Thích Minh Châu cũng viết *khéo nói/khéo thuyết*.
  - `appamatto ātāpī pahitatto` → *không phóng dật, tinh cần, quyết tâm* (`an7.83:2.1`; tiền lệ `an` còn có *tự nỗ lực* ở `an5.26`, `mn52` dùng *nhiệt tâm … quyết chí*). Chọn theo bộ `an`.
  - `abhisaṅkhataṁ abhisañcetayitaṁ` → *được tạo tác và được chủ ý tạo thành* (`mn52:4.3`, 13 khoá trong tầng, toàn bộ `mn52`); các bài khác dịch rời rạc (*được tạo tác, được chủ ý* ở `sn35.146:1.4`, *đã được cố ý* ở `sn12.37:1.3`).
  - `mettā cetovimutti` → *tâm giải thoát nhờ lòng từ* (`mn52:8.3`), `upekkhā cetovimutti` → *…nhờ xả*. Đã đo: `an10.219`, `an11.15`, `an11.982` đặt `sự giải thoát tâm và thương yêu`; tôi theo `mn52` vì đúng cùng khung câu `ayampi kho … abhisaṅkhatā abhisañcetayitā`.
  - Thiền và vô sắc: `paṭhamaṁ jhānaṁ` → *thiền thứ nhất* (36/43 khoá `an`, `sơ thiền` 7/43); `ākāsānañcāyatana / viññāṇañcāyatana / ākiñcaññāyatana` → *Không vô biên xứ / Thức vô biên xứ / Vô sở hữu xứ* (`mn52`, `an11.7`, `an11.9`); `‘ananto ākāso’ti` → *với ý niệm ‘hư không là vô biên’*; `paṭighasaññā` → *tưởng về va chạm* (`mn52:12.1`).
  - `sakkuṇeyya attānaṁ sotthiṁ kātuṁ` → *đưa mình đến an toàn* (`mn52:15.4-5`); `ācariyadhanaṁ` → *của cải để trả thù lao cho thầy* (`mn52:15.6`, trong khi `sn7.14:13.4` dịch *học phí*).

  **Số Pāli đã dịch, kèm phép tính:** `ekādasa` = 1 + 10 = **mười một** (`10.2`, `10.3`, `10.4`, `10.5`); `pañcannaṁ orambhāgiyānaṁ` = **năm** hạ phần kiết sử (`4.7` và các khoá lặp); `pañcasataṁ` = pañca 5 × sata 100 = **năm trăm** (`11.3`); thứ tự `dutiyaṁ / tatiyaṁ / catutthaṁ` = thứ hai / ba / tư; `Chaṭṭhaṁ` = **thứ sáu**. Số đã đối chiếu tay từng khoá (`ekādasa` ra *mười một* đúng ở `10.2`–`10.5`, mỗi khoá một lần; `pañca` ra *năm hạ phần* ở đủ 6 khoá `4.7`, `5.8`, `6.6`, `7.9`, `8.6`, `9.7`); các từ này không nằm trong bộ từ khoá số đã xác lập của phép đo máy nên phép đo máy không áp dụng và không được tính là đã kiểm.

  **Bất định, ghi tại đây chứ không thêm vào thân kinh:**
  1. **`6.1` — `ekaṁ disaṁ` lặp hai lần.** Pāli viết `sabbāvantaṁ lokaṁ mettāsahagatena cetasā ekaṁ disaṁ pharitvā viharati vipulena …`, nghĩa đen là lan tỏa *toàn thế giới* mà vẫn là *một phương*, tự mâu thuẫn. Khoá song song `7.4` (cùng công thức, lòng xả) không có `ekaṁ disaṁ`, và Sujato cũng không dịch lần lặp thứ hai; bản Thích Minh Châu nguyên bài cũng bỏ. Tôi dịch như `7.4`, tức không dịch lần lặp thứ hai của `ekaṁ disaṁ`; đây là điểm duy nhất của bài mà bản Việt chủ động không đi theo từng chữ Pāli, và là chỗ người biên tập nên xét.
  2. **`vā … vā … vā` (`3.2`, `3.3`, `4.1`, `4.8` và các khoá lặp).** Tôi dịch *hay … hay …* theo Pāli (`avimuttaṁ vā cittaṁ vimuccati, aparikkhīṇā vā āsavā …, ananuppattaṁ vā …`) và theo Thích Minh Châu (*hay sẽ đưa đến chấm dứt … hay đạt được*). `an5.26` (6 cặp có cùng mệnh đề) lại dịch *và* như một chuỗi liệt kê; Sujato cũng nối bằng *and*. Hai cách đọc gần nhau, không đổi giáo nghĩa; tôi chọn nghĩa đen của `vā`.
  3. **`aṭṭhakanāgaro`** dịch *người thành Aṭṭhaka* (`mn52:1.3`, và Thích Minh Châu *dân ở thành Atthaka*). Sujato dịch *a wealthy citizen* (đọc `aṭṭhaka` thành giàu có); tôi không theo vì Pāli không có chữ nào nói *giàu* và `mn52` đã đặt nghĩa địa danh. Tên bài `Kinh Bát Thành (Hai)` đặt theo `mn52` (*Kinh Bát Thành*) kèm *(Hai)* để phân biệt, theo thông lệ `an11.12`.
  4. **`dhammarāgena tāya dhammanandiyā` (`4.7`).** Dịch *lòng ái luyến và hoan hỷ đối với pháp ấy* theo `mn52`; *pháp* ở đây là trạng thái đang trú (thiền hoặc vô sắc), và Sujato diễn là *that meditation*. Tôi giữ *pháp ấy* mơ hồ như `mn52`, không thêm giải thích vào thân kinh.
  5. **`sevanāya` (`10.3`)** → *để thực hành*; `mn52` có `bhāvanāya` dịch *để tu tập*, nên hai bài khác từ Pāli và khác lời Việt, đúng theo Pāli từng bài. Sujato dịch *for cultivation*.
  6. **`pañcasataṁ vihāraṁ` (`11.3`)**: dịch *một trú xứ trị giá năm trăm* như `mn52:16.2` và Thích Minh Châu (*giá trị 500 đồng tiền*); Pāli không nêu đơn vị tiền, nên tôi cũng không nêu. Cách đọc *năm trăm trú xứ* bị loại vì `vihāraṁ` là số ít.
  7. **`ime hi nāma … aññatitthiyā … Kiṁ panāhaṁ …` (`10.6`–`10.7`)** dịch *ngay cả … còn …* và *Vậy sao con lại không …* theo ý `hi nāma … kiṁ pana`; Sujato và Thích Minh Châu cho cùng nghĩa.

