notes:
  - >-
    **Bài chỉ liệt kê, không giải thích** — mười `ariyāvāsā` chỉ được đọc tên
    rồi thôi; phần giải thích nằm ở `an10.20`. Tôi dùng **nguyên văn
    `an10.20:2.3`** cho cả danh sách, vì cùng Pāli.
  - >-
    **`Nāthavagga` → *Phẩm Bảo Hộ*** (0 segment tiền lệ, đặt mới): `nātha` là
    người bảo hộ, chỗ nương tựa — và Sujato dịch tên phẩm là *A Protector*. Cả
    phẩm đúng ngữ nghĩa đó: `nāthakaraṇā dhammā` → *mười pháp làm nên sự bảo
    hộ*, `sanāthā … mā anāthā` → *hãy sống có chỗ bảo hộ, đừng sống không chỗ
    bảo hộ*, `anātho viharati` → *sống không chỗ bảo hộ là khổ đau*. Vì ba cụm
    này lặp ở `an10.17` và `an10.18`, tôi dùng **cùng một cách** cho cả ba bài;
    `an10.19`–`an10.20` dùng `ariyāvāsā` → *chỗ ở của bậc Thánh* (cũng 0 tiền
    lệ), đối xứng với `senāsana` → *chỗ ở*.
  - >-
    **Danh sách mười `ariyāvāsā` — bốn thuật ngữ có tiền lệ, sáu thì không, ghi
    rõ ở đây.** Có tiền lệ: `pañcaṅgavippahīno`/`chaḷaṅgasamannāgato` → *năm
    phần*/*sáu phần* (xem ghi chú chương); `paṇunnapaccekasacca` → *đã đoạn trừ
    các chân lý riêng biệt*, `samavayasaṭṭhesano` → *đã đoạn trừ hoàn toàn sự
    tìm kiếm*, `passaddhakāyasaṅkhāro` → *đã an tịi các hành thuộc thân* — cả ba
    theo **`an4.38:1.1` và `:2.1`, `:3.1`** (đã `published`); `suvimuttacitto` →
    *tâm khéo giải thoát* theo `sn4.25:17.1` và `dhp1-20:4`.
    Không có tiền lệ, đặt mới: `ekārakkho` → *giữ một chỗ* (`ekāraṁ + rakkhā` =
    **một chỗ canh giữ**; và `5.2` còn giải nó bằng `satārakkhena cetasā` → *tâm
    được chánh niệm bảo vệ*, theo `an5.114:3.1` — hai bên xác nhận lẫn nhau, nên
    cụm này **tự giải thích trong chính bài**); `caturāpasseno` → *dựa vào bốn
    chỗ* (`āpassa` xuất hiện ở `an3.123:1.x` với nghĩa *nhận lời*, nên *dựa vào*
    là nghĩa đúng; Sujato dịch *four supports*); `anāvilasaṅkappo` → *có ý chí
    không ô nhiễm* (`anvīla` = không ô nhiễm, `saṅkappa` = ý chí — dùng **có**
    chứ không dùng *đầy đủ* vì Pāli không có `samannāgato`); `suvimuttapañño` →
    *tuệ khéo giải thoát* (theo `suvimuttacitto` bên cạnh, 0 tiền lệ).
  - >-
