  mười tiêu chí thay vì hạ xuống draft cho khớp với đo trước. Mười ba bài Jātaka còn lại thì đúng
  như brief: upstreamPublishes trả false cho cả mười ba.

  BẢN ANH SỐNG CÓ, VÀ TÔI ĐỐI CHIẾU TỪNG CẶP. Sujato dịch an2.38 theo nghĩa chứ không phải theo
  cấu, và tôi lấy Pāli làm chuẩn ở ba chỗ Sujato làm phẳng. (1) 1.3 và 1.5 Sujato để lời thoại
  của Bà-la-môn chạy liền mạch và bỏ dấu nháy kép trong, trong khi Pāli có một lời dẫn lời nghe
  (ngoặc tròn) bao quanh lời nghe được; tôi giữ cả hai lớp nháy kép đúng vị trí Pāli. (2) 1.4 Sujato
  đọc Tayidaṁ... tatheva? là một mệnh đề khẳng định và đóng bằng dấu phẩy, còn Pāli có dấu hỏi
  và câu 1.5 trả lời là không, nên tôi dịch thành câu hỏi. (3) 2.3 Sujato dịch là they are reckoned
  as a child, not a senior — chữ a child không có trong Pāli, và Sujato còn dùng child cho bālo (kẻ
  ngu), trong khi câu 2.3 của Pāli chỉ nói ông ta bị tính là chẳng phải bậc Trưởng lão. Tôi dịch
  theo Pāli. Trái lại, chỗ Sujato có ích tôi vẫn dùng: 2.3 và 2.6 chỉ đổi chữ.

  TIỀN LỆ THUẬT NGỮ, CÓ ĐẾM, VÀ DÙNG LẠI NGUYÊN VĂN. (1) an2.38:1.1 trùng nguyên văn với mn84:1.2
  (Ekaṁ samayaṁ āyasmā mahākaccāno madhurāyaṁ viharati gundāvane), nên tôi dùng lại nguyên văn
  bản dịch đã có: Một thời, Tôn giả Mahākaccāna ở Madhurā, tại rừng Cỏ Găng. (2) 1.3, 1.5, 2.1
  dùng lại cụm của an4.22, cùng công thức và đã publish: jiṇṇa vuddha mahallaka addhagate
  vayoanuppatte → già cả, cao tuổi, già nua, đã đi đến chặng cuối của đời; āsītiko vā nāvutiko vā
  vassasatiko vā jātiyā → tám mươi, chín mươi hay một trăm tuổi về đời sống; susukāḷakeso bhadrena
  yobbanena samannāgato paṭhamena vayasā → tóc đen đẹp, đầy đủ tuổi trẻ trong thuở đầu của đời sống;
  thera → bậc Trưởng lão. (3) 4.1 trùng nguyên văn với an2.34:3.1, chỉ khác tên, nên dùng lại
  nguyên văn Thật vi diệu thay, thưa Kaccāna … từ nay Ngài Kaccāna hãy nhớ con là nam cư sĩ đã
  quy y cho đến mạng chung. (4) mahākaccāno → Tôn giả Mahākaccāna có 71 khoá Pāli đã có bản Việt
  (ud1.5, ud5.6); kāmapariḷāha → nóng bỏng, nhiệt não (mn75, mn125); kāmapariyesanāya → tích cực
  tìm cầu các dục (mn125); pāde sirasā vandati → cúi đầu đảnh lễ dưới chân (24 khoá, dn16, ud2.8,
  ud5.6); ekaṁsaṁ uttarāsaṅgaṁ karitvā → chắp áo vắt lên một vai (37 khoá, an4.21, dn14); bhavanto
  số nhiều → Các ngươi (dn19.48 dùng cùng cách xưng). Sáu cụm này được quét bằng
  npx --no-install tsx trên toàn tầng, không suy từ trí nhớ.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU. (1) brāhmaṇe ở 1.3 và 1.5 là số ít trong Pāli; bản đã publish của
  an4.22 dịch cùng công thức là các vị Bà-la-môn, tức thêm số nhiều. Tôi giữ Bà-la-môn không
  gắn số, vì Pāli là authority và dạng số ít mới đúng. Người biên tập có thể muốn thống nhất theo
  an4.22. (2) na therotveva saṅkhyaṁ gacchati ở 2.3: tôi hiểu na phủ định therotveva, nên dịch
  là bị tính là chẳng phải bậc Trưởng lão. Có thể đọc khác là na phủ định cả vế tính, khi đó câu
  thành bị tính chẳng phải gì cả; hai cách đều giữ nguyên mạng nghĩa là ông già ấy không được tính
  là bậc già. (3) 2.1 tôi dịch Atthi ... akkhātā là đã giảng rõ có, theo mn76:6.1 đã dùng giảng
  rõ/chỉ ra cho cùng cụm; cũng có thể đọc là có sự giảng giải, không đổi nghĩa cảnh. (4) Tôn giả
  Mahākaccāna ở 1.2 và 3.1 lấy từ āyasmā mahākaccāno; còn bhavaṁ kaccāno ở 1.5 và 4.1 tôi dịch
  Ngài theo đúng cách tầng này dịch bhavaṁ (an2.34:1.2 và 3.1), không nâng thành Tôn giả.

  DẤU LƯỢC §10, ĐÃ KIỂM TỪNG KHOÁ. Trong 17 khoá của bài chỉ có hai khoá mang …pe…, là 1.2 và
  4.1; cả hai bản Việt đều giữ đúng MỘT dấu lược, không mở rộng, không nén. 15 khoá còn lại không
  có dấu lược nào và bản Việt cũng không có. Không khoá nào có (…) đứng một mình.

