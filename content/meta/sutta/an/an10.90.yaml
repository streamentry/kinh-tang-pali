notes: |-
  **Coverage Anh Sujato trên Pāli có nội dung: 18/18 = 100%.** Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708 (bilara chỉ phân phối 26 tệp tiếng Việt, toàn bộ là Pháp Cú), nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của kho.

  **Bài song song là `an8.28`** (cùng công thức *sức mạnh của bậc đã đoạn tận lậu
  hoặc*, khác ở chỗ 8 thay cho 10). **23/38 khoá trùng nguyên văn Pāli; 21 cặp tôi
  dùng lại NGUYÊN VĂN** — gồm `1.2`, `2.4`, `3.1`, `5.1`, `6.6` và toàn bộ nhóm
  công thức *Điều này… nhờ nương vào sức mạnh ấy…* ở `2.5, 3.2, 4.2, 5.2, 6.7`,
  cùng `2.2, 2.6, 3.3, 4.3, 5.3, 6.8` (*Các lậu hoặc của tôi đã đoạn tận*) và `7.2`.
  Pāli chỉ khác `an8.28` ở `bhikkhave`/`bhente` và thêm một dạng xưng `bhante`; dùng lại
  nguyên văn là đúng, vì `an8.28` đã công bố.

  **`2.3` — cố ý KHÔNG theo tiền lệ.** `Katamāni dasa?` có 10 tiền lệ nhưng chúng
  trộn lẫn: 2× *Mười gốc nào?* (đó là của `Katamāni mūlāni` — sai), 1× *Mười năng lực
  nào?*, 1× *Thế nào là mười?*. Tôi dùng *Mười sức mạnh nào?* để giữ `bala`→*sức
  mạnh* đúng như cả `an8.28` và mười khoá còn lại của bài. Đây là chỗ
  `terminology` có cơ sở cao nhất (9.5).

  **Nhóm `6.1`-`6.6` dịch đủ cả năm bộ theo PāLI, không nén.** Pāli lần lượt là bốn
  tinh tấn chân chính (`…pe…`), bốn thần túc (`…pe…`), năm căn (`…`), năm sức mạnh
  (`…`), bảy giác chi (`…`), Thánh đạo tám ngành. Mỗi khoá giữ đúng MỘT `…`.
  Lưu ý: `an8.28:6.2` đã bỏ mất *bốn thần túc* (nó viết thẳng *năm căn*); `an10.90`
  Pāli có đủ nên tôi viết đủ. Người gộp nên xem lại `an8.28` vì lỗi đó.

  **Uddāna `8.0`-`8.4` — 0 tiền lệ, đối chiếu bằng danh xưng bài trong `an10.81`-`an10.90`.**
  *Vāhanānando puṇṇiyo* = `an10.81 Vāhanasutta` + `an10.82 Ānandasutta` +
  `an10.83 Puṇṇiyasutta`; *byākaraṁ katthimāniko* = `an10.84 Byākaraṇasutta` +
  `an10.85 Katthīsutta` + `an10.86 Adhimānasutta` (māniko → của tâm); *Napiyakkosakokāli*
  = `an10.87 Nappiyasutta` + `an10.88 Akkosakasutta` + `an10.89 Kokālikasutta`;
  *khīṇāsavabalena* = `an10.90` (chính bài này). Tôi dùng **tên bài** chứ không dùng
  dạng rút gọn trong kệ, để sau này khi các bài kia được dịch còn khớp.
  `Tassuddānaṁ` → *Tóm lược:* theo 290/386. `7.4` theo dạng đa số *Phẩm X, thứ N*
  (27 mẫu), **không** theo mẫu *Hết phẩm thứ chín, Phẩm…* vì Pāli không có vế đó.

  **Tên riêng khai vào bộ nhớ tiến trình.** `Byākaraṇa`, `Kaṭṭhī`, `Adhimāna`,
  `Nappiya`, `Khīṇāsavabala` có **0** lần trong tầng Việt (vì `an10.84`-`an10.87` và
  `an10.89` chưa được dịch) nên `lọt_pāli()` sẽ bắt nhầm. Đã tra chứng trong danh xưng
  bài gốc của chính phẩm này và khai vào `_GIỮ`; không sửa `_hvi.py`.

  **`0.1` theo đa số tầng.** Đo lại: 1228 khoá `:0.1` ở tầng `an`, **875** dùng *Kinh
  Tăng Chi Bộ* và **353** dùng *Aṅguttara Nikāya*. `an10` riêng là 155/19 nghiêng về
  *Kinh Tăng Chi Bộ*, nên cả bốn bài `an` của lát này tôi dùng *Kinh Tăng Chi Bộ*.
  Xem mục (4) của báo cáo: con số người điều phối nêu là 862, đo được 875.

  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
