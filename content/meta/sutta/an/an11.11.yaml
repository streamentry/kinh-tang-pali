notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu English Sujato đã ghim, các bài cùng mô thức đã có (an6.10 Kinh Mahānāma, an11.12 Kinh Mahānāma (Hai), an11.13 Kinh Nandiya) và bản Việt hiện hành nguyên bài (Hòa thượng Thích Minh Châu, tra cứu toàn văn) để đối chiếu thuật ngữ. Ghi đủ 71/71 khoá, đúng thứ tự Pāli, không khoá thừa.

  **COVERAGE ANH: 42/60 = 70,0% trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) — DƯỚI SÀN 0,80, nên status BẮT BUỘC là draft kèm blocker.** Sujato để trống 18 khoá dù Pāli viết đủ: 1.5, 1.6, 4.4, 4.5, 4.6, 5.4, 5.5, 5.6, 6.3, 6.4, 6.5, 7.5, 7.6, 7.7, 8.4, 8.5, 8.6, 8.7. Cả 18 khoá đều là chỗ Sujato nối câu qua dấu lược khi Pāli lặp công thức (1.5–1.6 lặp 2.2–2.4; 4.4–4.6, 5.4–5.6, 6.3–6.5, 7.5–7.7 lặp 3.13–3.15; 8.4–8.7 là bốn vế song song của 8.3). Bài chưa có lớp `english-project` (chưa có tệp nào cho an11.11), tầng `vietnamese-current` không cấp text segment cho bài này (chỉ Pháp Cú có bản Việt phân đoạn); bản nguyên bài chỉ là tra cứu toàn văn, không tính vào coverage. Vì vậy `triangulation` đặt 7,5 và không nâng điểm tiêu chí khác để bù. Pāli của 18 khoá này vẫn tự đứng vững vì lặp nguyên văn đúng ở khoá có Sujato phủ. Cách gỡ blocker: lấp 18 khoá bằng `english-project` rồi publish; lưu ý lớp lấp do cùng một tác giả với bản Việt này thì không phải cách đọc English độc lập (xem luật "không tự đánh bài của mình"). `content/meta/reference-gaps.yaml` có entry cũng không cứu được `published` ở mức 0,70.

  Dấu lược: Pāli không có `…` ở khoá nào, bản Việt cũng không có `…` nào (0/0 cân bằng); Pāli không có `(…)` nên không dùng `(…)`. Sujato dùng `…` ở 4.3, 5.3, 6.2, 7.4 vì lược; bản Việt dịch đủ vì Pāli đủ.

  Số trong Pāli, tính từ chính từ: `pañca` 5 (3.9: năm pháp: lòng tin, tinh tấn, niệm, định, tuệ); `cha` 6 (3.9: sáu pháp thêm — buddha, dhamma, saṅgha, sīla, cāga, devatā anussati; đủ 6 mục 3–8); `temāsa` = ti 3 + māsa tháng = ba tháng (1.3, 1.6, 2.4); `cattāri purisayugāni` 4 cặp + `aṭṭha purisapuggalā` 8 hạng, khớp nhau (4 cặp × 2 = 8; 5.2); `tāvatiṁsā` Ba Mươi Ba (8.2); tám nhóm chư thiên ở 8.2 gồm bảy tên và `tatuttari` (cao hơn nữa). Không có cụm số chưa phân xử được.

  Thuật ngữ và tiền lệ (đo trên các tệp Việt đã có): `anussati` → nhớ tưởng (an6.10, an11.12); `ujugata` → thật thẳng (an6.10 6/6 khoá trùng Pāli, an11.12 2); `atthaveda/dhammaveda` → cảm hứng nơi ý nghĩa / nơi Pháp; `pāmojja` → niềm hoan hỷ gắn liền với Pháp (6 khoá trùng Pāli đều như vậy; an11.12 viết "niềm vui"); `rāga/dosa/moha` → tham/sân/si với `pariyuṭṭhita` → "bị … ám ảnh" (an6.10), không dùng "đầy tràn" của an11.12; `ārabbha` → nương vào (an6.10); `visamagatāya/samappatto`, `sabyāpajjāya/abyāpajjo` → quân bình / bất quân bình, không ác ý / có ác ý (an6.10, tiền lệ duy nhất); dòng công thức hỷ–khinh an–lạc–định dùng đúng khung "Khi hoan hỷ, hỷ sanh khởi; tâm có hỷ thì thân khinh an; …" (10 khoá trùng Pāli trong tầng cùng viết như vậy: an3.95, an6.10…).
  Công thức Phật hiệu ở 3.11 trùng Pāli với 36 khoá; chọn dạng đa số (10): "Bậc Thế Tôn ấy là bậc A-la-hán, Chánh Đẳng Giác, … thầy của chư thiên và loài người, bậc Phật, Thế Tôn" (dạng của an6.10 và an4.52 có 6 khoá, dùng "vô thượng điều ngự trượng phu khả được điều ngự" và "Đạo Sư của chư Thiên", khó đọc hơn và viết hoa Thiên lệch với 8.2). Công thức Pháp ở 4.2 chọn dạng 4/12. Công thức Tăng ở 5.2 dùng nguyên văn bản dịch an4.52:3.2 (trùng Pāli nguyên văn 2/2 khoá cùng dạng); khác an6.10:4.2 ("hiến dâng", "đúng chánh đạo") — hai dạng cùng tồn tại trong tầng, ghi để người biên tập chốt một dạng.
  Dùng lại nguyên văn bản Việt đã có cho các khoá trùng Pāli khi dạng đó là đa số: 1.1 (6/10), 1.2 (an11.12:1.3), 3.14/4.5/5.5/6.4/7.6/8.10 (6/8), 3.15/4.6/5.6/6.5/7.7/8.11 (10/10 dạng an3.95), 3.13/4.4/5.4/6.3/7.5, 8.2 và 8.3–8.7 (theo an6.10:7.2–7.7). Khác tiền lệ có lý do: 1.3/1.6/2.4 (bỏ "an cư kết hạ", xem dưới), 2.1 (đủ hai vế "ngồi xuống một bên" như Pāli), 2.5/3.3 (xem dưới), 3.4–3.8, 3.9.
  Trong bài, Pāli trùng nguyên văn 2 nhóm (3.14 = 4.5 = 5.5 = 6.4 = 7.6 = 8.10 và 3.15 = 4.6 = 5.6 = 6.5 = 7.7 = 8.11), bản Việt trùng nhau cả hai nhóm (0 cặp trùng mà Việt khác). Các khoá còn lại khác Pāli ở danh từ đối tượng và ngữ cảnh nên Việt khác đúng chỗ.

  BẤT ĐỊNH VÀ CÁC LỰA CHỌN CÓ CHỦ Ý:
  (1) 1.3, 1.6, 2.4: Pāli `temāsaccayena` chỉ "sau ba tháng"; không có chữ nào là "an cư". Sujato thêm "the rains residence" và an11.12/an11.13 viết "an cư kết hạ". Giữ sát Pāli: "Khi y đã may xong, sau ba tháng, Đức Phật sẽ lên đường du hành." Đây là diễn giải ngữ cảnh (mùa mưa), thuộc về chú giải/glossary.
  (2) 2.5/3.3: Pāli `kenassa vihārena vihātabbaṁ` ("nên sống bằng cách trú nào"). Dịch "chúng con nên sống theo cách nào?" (như an11.13:4.8) thay vì "phải thực hành theo kiểu sống nào" của an11.12:2.8, vì Pāli là gerundive "vihātabbaṁ" (nên sống), không có "thực hành".
  (3) 3.4–3.8 `ārādhako`: dịch "có khả năng thành tựu" (an11.13, an10.156-166) thay vì "thành tựu" trơn của an11.12. Sujato "succeed". Nghĩa chính xác của từ (thành tựu / làm viên mãn / làm hài lòng) có thể bàn; không ảnh hưởng ý chung.
  (4) 3.6 `upaṭṭhitassati` → "có niệm hiện tiền" và `muṭṭhassati` → "mất niệm" (an3.115); 3.8 `duppañño` → "kém tuệ" (không dịch "ngu si" như an11.12:3.8, vì `duppañña` là "tuệ kém", không phải `moha`).
  (5) 7.3: `yācayogo` dịch "sẵn lòng đáp lời xin" theo an6.10:6.3; an11.13:9.3 viết "chuyên cần bố thí" và Sujato "committed to charity". Nghĩa của `yācayogo` đáng được chú giải kiểm lại.
  (6) 7.2–7.3, 8.2–8.7: lời tự nhủ dùng "ta" (an6.10, an11.12 là cùng nhân vật Mahānāma, 2 tệp) thay vì "tôi" như an11.13:8.2 (Nandiya, 1 tệp). 3.2 và 3.9: "ông / các ông" khi Đức Phật nói với Mahānāma, theo an11.13; an11.12 viết "ngươi / các ngài" lẫn lộn trong cùng một bài.
  (7) 3.16/4.7/5.7/6.6/7.8/8.12: `visamagatāya pajāya samappatto` dịch "quân bình giữa chúng sinh bất quân bình" theo duy nhất tiền lệ an6.10; Sujato "lives in balance among people who are unbalanced". Có thể đọc khác (đạt trạng thái đồng đều/bình thản giữa đời bất bình). Không thêm vào thân kinh.
  (8) Dấu nháy: Pāli mở “ ở 1.3, 1.5, 2.2, 3.1 và đóng ” ở 1.3, 1.6, 2.5, 8.12; nháy đơn mở ở 1.6 (trong nháy kép), 2.3, 3.3, 3.11, 4.2, 5.2, 7.2, 8.2 và đóng ở 1.6, 2.4, 3.3, 3.11, 4.2, 5.2, 7.3, 8.7. Bản Việt khớp Pāli từng khoá (0 lệch trên 71 khoá).

  Lỗi ngoài lát, chỉ báo, không sửa: tệp Việt của an11.12 (Kinh Mahānāma (Hai)) viết tên người nói là "Ma-ha-ca" ở 10 khoá (3.1, 3.2, 3.4, 3.9, 4.1, 4.5, 4.7, 5.1, 5.14, 5.16) trong khi Pāli là `mahānāma` và các khoá cùng bài khác viết "Mahānāma"; đây là lỗi phiên âm tên riêng, cần sửa ở lượt riêng.

  Kiểm tay đã làm: đủ 71 khoá khớp tập khoá và thứ tự Pāli; nháy đơn và nháy kép khớp Pāli từng khoá; không khoá rỗng; không khoảng trắng thừa; NFC; không Pāli lọt sang Việt ngoài tên riêng (Mahānāma, Sakya, Kapilavatthu, Yāma, Tusita, Aṅguttara Nikāya).

  `technical_integrity` = 9.6 vì lượt dịch này không được chạy `npm run validate`, `npm test`, `npm run check` và `npm run build`; cần chạy bốn lệnh đó trước khi chốt trạng thái.
