notes:
  - >-
    **Ngắn nhất chương (14 segment)**: mười hành vi rút gọn còn **hai mục** —
    đầu và cuối — vì `…pe…` nuốt tám mục giữa. Vì vậy đây là bản duy nhất chỉ
    cần hai mục, và `pāṇātipātinī` → *sát sinh* / `micchādiṭṭhikā` → *có tà
    kiến*.
  - >-
    **`Karajakāyavagga` → *Phẩm Thân Do Nghiệp*** (0 segment tiền lệ, đặt mới):
    Sujato dịch tên phẩm là *The Body Born of Deeds*, và `karajakāya` (thân do
    nghiệp tạo ra) là chủ đề của cả bài — `an10.219` giải thích thẳng rằng mọi
    nghiệp ác từng làm đều được cảm thọ ngay trong thân này. `Saṁsappanīyasutta`
    → *Kinh Tiếp Xúc Nghiệp* (Sujato *Karmic Contact*); `Adhammacariyāsutta` →
    *Kinh Sống Phi Pháp*.
    **`Karajakāyavaggo paṭhamo` ở `an10.220:12.4` dịch là *Phẩm Thân Do Nghiệp,
    thứ nhất*** — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì
    phẩm này rõ ràng thứ hai mốt (đúng như `21.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Nguyên văn dùng lại, đếm được, đều cùng Pāli**: mười hành vi xấu rút gọn ←
    **`an10.199-210:1.3`** (đã `published`: *Sát sinh, Trộm cắp, Tà dâm, Nói
    dối, Nói hai lưỡi, Nói ác khẩu, Nói phù phiếm, Tham lam, Sân hận, và có tà
    kiến*); mười hành vi tốt rút gọn ← **`an10.178:3.2`** (đã `published`:
    *Kiêng tránh sát sinh… không tham lam, không sân hận, và có chánh kiến*);
    `yathābhataṁ nikkhitto evaṁ niraye` ← **`an10.222:1.1`**; `… evaṁ sagge` ←
    **`an3.10:1.1`**; `natthi dinnaṁ … pavedentī’ti` ← **`an3.117:3.3`**;
    `pāṇupetaṁ saraṇaṁ gatan` ← **`an3.53:5.4`**; `apāyaṁ duggatiṁ vinipātaṁ
    nirayaṁ` ← **`an10.229-232:1.1`**; `sugatiṁ saggaṁ lokaṁ upapajjanti` ←
    **`an3.117:7.5`**; `Taṁ suṇātha, sādhukaṁ manasi karotha` ←
    **`an10.107:2.2`**.
  - >-
    **Chủ ngữ `upāsikā` (nữ cư sĩ) là nữ tính, nên Pāli dùng `samannāgatā` (chứ
    không phải `samannāgato`) và `nikkhittā` (không phải `nikkhitto`)**. Đây là
    chỗ dễ bỏ sót: nếu dịch giống hệt `an10.213` thì đã sai số và cả giới tính.
    Tôi dựng riêng cụm mở đều cho bài này.
  - >-
    `upāsikā` → *nữ cư sĩ* theo `an3.127:3.4`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
