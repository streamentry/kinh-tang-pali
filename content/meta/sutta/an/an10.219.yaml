notes:
  - >-
    **Bài đặt tên cho cả phẩm, và là bài trả lời thẳng câu hỏi của Migasālā ở
    `an10.75`.** Ý tưởng: một người có thể nuôi dưỡng tâm thương yêu hoặc bình
    thản, và dù thân ấy đã từng làm nghiệp ác thì những nghiệp ấy **không theo
    sau** — cũng như hòn ngọc quý bị hét tung vẫn rơi đúng chỗ của nó.
  - >-
    **`Karajakāyavagga` → *Phẩm Thân Do Nghiệp*** (0 segment tiền lệ, đặt mới):
    Sujato dịch tên phẩm là *The Body Born of Deeds*, và `karajakāya` (thân do
    nghiệp tạo ra) là chủ đề của cả bài — `an10.219` giải thích thẳng rằng mọi
    nghiệp ác từng làm đều được cảm thọ ngay trong thân này. `Saṁsappanīyasutta`
    → *Kinh Tiếp Xúc Nghiệp* (Sujato *Karmic Contact*); `Adhammacariyāsutta` →
    *Kinh Sống Phi Pháp*.
    **`Karajakāyavaggo paṭhamo` ở `an10.220:12.4` dịch là *Phẩm Thân Do Nghiệp,
    thứ nhất*** — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì
    phẩm này rõ ràng thứ hai mốt (đúng như `21.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Nguyên văn dùng lại**: `2.1` (cả đoạn tán quán tâm thương yêu) ←
    **`an3.65:42.1`** — cùng Pāli, chỉ khác dấu câu và cách xưng hô; tôi dùng
    lại nguyên văn, chỉ đổi *này các người Kālāma* thành *này các tỳ-kheo*.
    `7.4` (bản bình thản) dựng theo đúng khuôn ấy.\n**Bản đầu tôi dịch `mettā
    cetovimutti` thành *giải thoát tâm và thương yêu*** — 0 tiền lệ cho cụm này;
    `cetovimutti paññāvimutti` đã có tiền lệ *giải thoát tâm và giải thoát tuệ*
    (`an5.71:2.4`), nhưng ở đây chỉ có một tâm phạm chứ không có `paññāvimutti`,
    nên tôi đặt mới và ghi lại. Tương tự `upekkhā cetovimutti` → *giải thoát tâm
    và bình thản*; `karuṇā` → *bi*, `muditā` → *hỷ* (theo `an3.66:46.2` và
    `an3.63:8.7`), `upekkhā` → *bình thản* (0 tiền lệ, đặt mới).
  - >-
    **`7.1` và `7.2` bị lược `…pe…`**, nên chỉ còn *Tán quán tâm bi …* và *Tán
    quán tâm hỷ …*; `7.3` mới là vế đầy đủ của bình thản.
  - >-
    **Lỗi do lượt review bắt được, ở `4.2`, `5.1`, `9.2`, `10.1`:** dấu hỏi nằm
    **ngoài** dấu ngoặc kép (*“…không”?*), trái quy ước đã dùng cả chương và cả
    kho. Đã sửa thành *“…không?”*.\n**`5.3` và `10.3` thiếu dấu chấm câu** ở
    cuối (*…được”* thay vì *…được”.*) — Pāli `phusissatī”ti.`. Đã sửa.\n**Ba chỗ
    khác**: `upacitānaṁ` bản đầu dịch *những việc đã tích lũy* (quá mơ hồ, đã
    sửa thành *những điều đã tích lũy*); `tatrāvasissati` bản đầu dịch *không
    dính vào chỗ ấy* (thô, đã sửa thành *không tích lũy ở chỗ ấy* — nghĩa gốc là
    *tích lũy ở*, và `an10.217:17.1` cũng dùng *tích lũy* cho cùng một họ từ);
    `pare vā pariyāye` bản đầu dịch *thân phận về sau* (đã sửa thành *trạng thái
    về sau* — `pariyāya` là trạng thái, không phải thân phận; `gati` mới là thân
    phận).
  - >-
    **Cấu trúc ngoặc kép của bài rất khó, tôi dựng theo từng segment**: `“` mở ở
    `1.1`; `4.2` đóng ngoặc của lời hỏi; `4.3`, `5.1` là ngoặc kép khép kín;
    `5.2` mở và `5.3` đóng; `6.1` mở và **`6.7` không đóng** — ngoặc ấy kéo dài
    qua `7.x`, `8.x` tới `9.2`. Đây là chỗ dễ dựng sai nhất của bài.
