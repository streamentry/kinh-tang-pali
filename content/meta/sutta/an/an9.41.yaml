notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn; không căn theo segment nên chỉ dùng để đối chiếu thuật ngữ và mạch lập luận, không làm tầng cột). Tầng `vietnamese-current` căn theo segment không có cho bài này (tại commit đã ghim chỉ có 26 chương Pháp Cú). Đủ 177/177 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli.
  **Coverage English: 125/129 = 96,9% theo Sujato** (mẫu số 129 = khoá Pāli ≥ 40 ký tự, bỏ khối `:0`), vượt xa ngưỡng 0,8 và không sát ngưỡng. Bốn khoá Sujato để trống là `6.1`–`6.4` (Ānanda dẫn lại nguyên văn lời Tapussa ở `2.1`–`3.4`); tầng `english-project` đã `published` lấp đúng bốn khoá này nên cổng tính 129/129 = 100%, nhưng bản lấp do một công cụ khác viết, không được coi là cách đọc độc lập: bốn khoá ấy được dịch bám `3.1`–`3.4` (nơi Sujato có câu đủ). 48 khoá Pāli < 40 ký tự thì 41 khoá có prose Sujato; 7 khoá còn lại là colophon và tụng đề (`16.5`–`17.4`). Bài không cần entry trong `content/meta/reference-gaps.yaml`.
  **Bất định chính, ghi rõ, không che: `etaṁ santanti passato` (47 khoá: `3.3`, `6.3`, `7.4`, `7.6`, `7.9`, `7.12`, `7.14`, và năm khoá `.3`, `.5`, `.8`, `.10`, `.12` ở mỗi chặng 8–15).** Đây là sở hữu cách tuyệt đối (genitive absolute) *đang thấy rằng: đây là an tịnh*, và Pāli **không có `na` đứng trước `passato`**: `na pakkhandati nappasīdati na santiṭṭhati na vimuccati` là bốn động từ chính, còn `passato` đứng ngoài phủ định. Sujato dịch ở mọi khoá phủ định là *I didn't see it as peaceful* (tức thêm một phủ định mà chữ Pāli không có) và ở khoá khẳng định *I saw it as peaceful*; bản Việt Thích Minh Châu viết *dầu Ta có thấy: Đây là an tịnh* (nhượng bộ) ở phủ định và *vì Ta thấy* ở khẳng định. Bài này theo chữ Pāli và Thích Minh Châu: khoá phủ định dịch *dù Ta thấy rằng đây là an tịnh*, khoá khẳng định dịch *khi Ta thấy rằng đây là an tịnh* (trích lời các tỳ-kheo trẻ ở `3.3`/`6.3` cũng dùng *khi thấy rằng*). Hệ quả đọc: ở chặng nào cũng là tâm *chưa* hướng đến dù đã nhận ra sự an tịnh, vì nguy hại chưa thấy và lợi ích chưa đạt (`7.8`: `kāmesu kho me ādīnavo adiṭṭho … nekkhamme ca ānisaṁso anadhigato`), chứ không phải *chưa thấy an tịnh*. Nếu người biên tập muốn theo cách hiểu của Sujato thì chỉ phải đổi *dù Ta thấy rằng* thành *vì Ta chưa thấy rằng* ở các khoá phủ định; không đụng chỗ nào khác.
  **Các bất định khác.** (1) `6.2`–`6.4`: dấu nháy đơn đóng ở cuối `6.2` rồi mở lại ở `6.3` (không đóng) và đóng cùng nháy kép ở `6.4`; bản Việt giữ đúng từng khoá như Pāli, và hiểu `6.3`–`6.4` vẫn là lời Tapussa (lặp lại `3.3`–`3.4`), nên `bhante` ở đó dịch *bạch Tôn giả*, không đổi thành *bạch Thế Tôn*. (2) `upekkhāsukhe` (`10.7`) dịch *lạc của xả*, đọc là hợp từ sở thuộc; Sujato *bliss with equanimity*. (3) `anāsevito`/`tamāseveyyaṁ`/`tamāseviṁ` dịch *thực hành* (không dùng *tu tập* để khỏi lẫn với `bhāvita`; Sujato *developed*, Thích Minh Châu *thưởng thức*); toàn tầng không có đa số dứt khoát (*tu tập* thường đi chung cặp `bhāveti`). (4) `daharānaṁ daharānaṁ` lặp để chia từng vị; bản Việt *các tỳ-kheo trẻ tuổi* theo tiền lệ `dn16:2.16.1` (*các chàng Licchavī trẻ tuổi*), không thêm *từng vị*. (5) `15.2` Pāli **không có** `sabbaso` nên dịch *vượt qua*, còn `15.13` có `sabbaso` nên *vượt hoàn toàn*; Sujato viết *totally beyond* ở cả hai. (6) Sujato thêm *and keeping it connected* ở `8.16` trong khi Pāli `vitakkasahagatā` chỉ có *tầm*; bản Việt theo Pāli.
  **Số Pāli.** `nava anupubbavihārasamāpattiyo` (`16.1`, `16.2`) = *chín*: bốn thiền sắc giới (`7.15`, `8.13`, `9.13`, `10.13`) + bốn xứ vô sắc (`11.13`–`14.13`) + diệt thọ tưởng (`15.13`) = 4 + 4 + 1 = 9, khớp số chặng 7–15. `Dasamaṁ` = *thứ mười*; `catuttho` = *thứ tư*; `pañcamaṁ` = *thứ năm* (`jhānena pañcamaṁ`: đếm từ `an9.32`: `an9.32` và `an9.33` là hai bài phép sống, `an9.34` Niết-bàn, `an9.35` bò cái, `an9.36` Thiền là bài thứ năm); `dve vihārā` = *hai*.
  **Dùng lại nguyên văn đã có, đếm được.** 12 khoá Pāli trùng nguyên văn với khoá ở bài khác, tổng 839 cặp. 7 khoá dùng lại đúng bản Việt đã có: `0.2` (9/9 cặp), `0.3` (`an6.119:0.3`, cùng tên Pāli `Tapussasutta` nhưng là một bài khác; hai bài cùng mang tựa *Kinh Tapussa*), `1.1` (`sn42.11:1.1`), `7.1` (`sn47.10:5.1`, chọn trong hai dạng có sẵn), `16.3` (18 cặp: 8 cặp cùng dạng *Và tri kiến khởi lên nơi Ta:* là dạng đa số), `16.5` (276/281), `17.0` (372/491, dạng *Tóm lược:* chiếm đa số). 5 khoá cố ý dịch khác: `1.5` (28 cặp, đều khác — dạng *Dạ vâng … vâng lệnh Đức Thế Tôn* chủ yếu ở một bài `dn16`; bài này theo `an9.37:1.4`, cùng phẩm: *đáp lời*), `4.3` (5 cặp; theo `an3.21:8.4` và `an6.61:9.4`, chỉ đổi *Đức Phật* thành *Đức Thế Tôn* cho khớp văn bản bài), `10.2` và `14.2` (trùng `an9.35:6.2`, `an9.35:10.2`; chỉ đổi *ta* thành *Ta* vì người nói ở đây là Đức Thế Tôn), `16.6` (1 cặp ở `pv51`, *Đại Phẩm, thứ tư.*; bài này viết *Phẩm Lớn, thứ tư.* theo tên phẩm `4. Phẩm Lớn` đã dùng ở `an9.32`–`an9.40`).
  **Trong chính bài.** Hai nhóm Pāli trùng nguyên văn: `Tassa mayhaṁ, ānanda, etadahosi:` (35 khoá) và `Seyyathāpi, ānanda, sukhino dukkhaṁ uppajjeyya yāvadeva ābādhāya;` (8 khoá); cả 43 khoá bản Việt giống hệt nhau, 0 cặp khác. Các câu phủ định/khẳng định/tụng của chín chặng 7–15 lặp theo một mẫu, đúng như Pāli, và đổi thuật ngữ chặng theo từng khoá; phần Việt của từng chặng đã đọc đối chiếu từng cặp Pāli↔Việt, không khoá nào mang nội dung của khoá kế bên.
  **Thuật ngữ chọn theo tiền lệ đếm được.** `nekkhamma` → *xuất ly* (an: 31 khoá so với *viễn ly* 13 khoá, nhưng *viễn ly* là dịch của `paviveka`, nên ở `7.3` *sādhu nekkhammaṁ, sādhu paviveko* → *Lành thay xuất ly! Lành thay viễn ly!*); `ādīnava` → *nguy hại* (toàn tầng 135 khoá đi cùng `kāmesu ādīnavaṁ`/`ādīnavo` so với *tai họa* 28 và *nguy hiểm* 27; riêng an là 21 so với 19, sát nhau nên theo toàn tầng); `ānisaṁsa` → *lợi ích* (an: 284); `bahulīkata` → *làm cho sung mãn* (toàn tầng 516 so với *làm cho nhiều* 12 và *thực hành nhiều* 5); `pakkhandati pasīdati santiṭṭhati vimuccati` → *hướng đến, tịnh tín, an trú, giải thoát* (theo `dn33`, `dn34`, `an5.200`); `gihī kāmabhogī` → *người tại gia thụ hưởng các dục*; `papāta` → *vực thẳm*; `ābādha` → *chứng bệnh* và `samudācaranti` → *khởi lên quấy nhiễu*, `sahagatā saññāmanasikārā` → *các tưởng và tác ý đi kèm với …*, theo `an9.34` (cùng nhóm bài, cùng công thức); `nevasaññānāsaññāyatana` → *xứ phi tưởng phi phi tưởng* (quy ước tầng, 168 khoá / 62 tệp), `ākāsānañcāyatana` → *xứ vô số hư không* và `viññāṇañcāyatana` → *xứ vô số thức* theo `an9.34`, `an9.35`, `an9.37`, `an9.40` (số đo ghi ở `an9.40`: 19 so với *vô biên* 4); `saññāvedayitanirodha` → *sự chấm dứt của tưởng và thọ* theo `an9.34`/`an9.35`; `anupubbavihārasamāpatti` → *sự chứng đạt phép sống tiếp nối* theo `an9.33`; `mahāvana` → *Đại Lâm* (`mn35`); `divāvihāra` → *nghỉ ban ngày* (30 so với *an trú ban ngày* 17); `imasmiṁ dhammavinaye` → *Pháp và Luật này* (an: 39 so với *Giáo Pháp và Giới Luật* 26); `sambodhā anabhisambuddhassa bodhisattasseva sato` → *trước khi giác ngộ, khi Ta còn là Bồ-tát chưa giác ngộ* (`mn4:3.1`, `mn85:10.1`); công thức `sadevake loke … abhisambuddho ti paccaññāsiṁ` (`16.1`, `16.2`) theo `an3.103`/`an3.104`, riêng *Ma vương, Phạm thiên* là dạng đa số của an (11 so với *Brahma* 6); `akuppā me cetovimutti, ayamantimā jāti` → *Tâm giải thoát của Ta không thể lay chuyển, đây là đời sống cuối cùng* (toàn tầng: *không thể lay chuyển* 10 so với *bất động* 2; *đời sống cuối cùng* 10 so với *kiếp cuối cùng* 5). Tên bài `Tapussasutta` → *Kinh Tapussa* theo `an6.119`.
  **Phép đo trên bản dịch (đều chạy sau khi ghi).** Tập khoá Việt = tập khoá Pāli, 177/177, đúng thứ tự Pāli. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá, 177 khoá (mẫu số 177, 0 lệch). Dấu lược: 4 khoá Pāli có `…pe…` (`8.2`, `8.13`, `9.13`, `10.13`) — cả 4 khoá Việt giữ đúng một `…`, không mở rộng; không khoá Pāli nào có `…` trần và Việt không có `…` nào ngoài 4 khoá này. NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang bản Việt.
