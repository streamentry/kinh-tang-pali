notes: |-
  Đợt 19, lát l40. Dịch từ Pāli root đã ghim, đối chiếu Bhikkhu Sujato tại cùng commit và bản nguyên bài Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn (không phải tầng store). Bài thuộc Phẩm Đại; nhãn `Aṭṭhamaṁ.` ở `13.3` là bài thứ tám trong chuỗi mười `an6.55`–`an6.64` (`an6.61` mang `Sattamaṁ.`) nên dịch “Thứ tám.”.

  **Coverage Anh trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): 98/136 = 0,721** — dưới sàn 0,80. Sujato để trống 38 khoá dù Pāli viết đủ: `3.2`–`3.8` (Sujato gộp cả đoạn Ānanda kể lại vào `3.1`), `7.11`–`7.14`, `8.11`–`8.14`, `8.17`–`8.18`, `9.9`–`9.10`, `9.12`–`9.14`, `10.18`–`10.21`, `10.23`–`10.25`, `11.15`–`11.18`, `11.20`–`11.22`, `12.9`–`12.10`: toàn là đoạn lặp công thức mà Sujato rút gọn bằng `…`. Lớp `english-project` chưa có tệp cho bài này (0 khoá lấp) và tầng Việt hiện hành vắng (0/136; tại commit đã ghim bản Việt phân đoạn chỉ có Pháp Cú). Vì vậy bài giữ `draft` kèm blocker, `triangulation` hạ xuống 7.5; 38 khoá ấy dựa vào Pāli, vào chính các khoá lặp đã được Sujato dịch ở khối đầu của cùng công thức (`7.1`–`7.9` làm mẫu cho cả sáu khối), và vào bản nguyên bài Hòa thượng Thích Minh Châu. Khi lớp `english-project` lấp được các khoá trên và `npm run reference:gaps` được chạy lại thì coverage vượt 0,80 và bài có thể chấm lại để publish; blocker này là của tầng tham khảo, không phải của bản dịch.
  **Bất định, không đưa vào thân kinh.**
  (1) `2.5`/`3.6` `kenacideva pariyāyena` dịch “theo một cách nói nào đó” (Sujato “just a way of speaking”). Bản nguyên bài Hòa thượng Thích Minh Châu viết “nhờ một Thiên nhân”, có vẻ do tách `kenacideva` thành `kenaci` + `deva`; Pāli root không có yếu tố “thiên” nào, tôi không theo.
  (2) `4.2` `dvejjhaṁ āpajjissati` dịch “rơi vào chỗ nước đôi”; chủ ngữ ngầm là vị tỳ-kheo hỏi (Sujato: “take something … to be ambiguous”). Giữ chủ ngữ ngầm, không thêm “vị ấy”.
  (3) `5.8` `Sace tumhe … suṇeyyātha` dùng ngôi số nhiều, dù Đức Phật nói với Ānanda; giữ “các ông” đúng số của Pāli (Sujato “If you would all listen”), vì ngay sau đó (`6.2`) Ānanda nói đến các tỳ-kheo sẽ nghe. Dấu `?` cuối Pāli `5.8` không dịch thành câu hỏi (Sujato cũng dịch như lời đề nghị).
  (4) `10.15`/`11.12` `abhido addharattaṁ bhattakālasamaye` / `abhido majjhanhike bhattakālasamaye`. Sujato đọc “nearly time for the midnight/midday meal”; Pāli root không nói “sắp”, và tầng đã dịch `abhido aḍḍharattasamayaṁ` / `abhido majjhanhikasamayaṁ` ở `mn79` và `mn80` (12 khoá) là “vào lúc nửa đêm” / “vào giữa trưa” mà không dịch `abhido`. Tôi theo tiền lệ tầng và không dịch `abhido`; giờ ăn lúc nửa đêm là điểm lạ mà tôi không phân xử được.
  (5) `7.17` (và các khoá song song) `purisindriyañāṇaṁ … viditaṁ hoti`: chủ ngữ ngữ pháp là “trí”, nên dịch “trí của Như Lai về căn của con người được rõ biết bằng cách …”; Sujato diễn thành “the Realized One knows a person’s faculties”. Giữ sát Pāli, câu hơi nặng.
  (6) `parihānadhammo` / `aparihānadhammo` / `parinibbānadhammo`: giữ dạng `-dhammo` là “có tính chất …” (“có tính chất suy giảm”, “không có tính chất suy giảm”, “có tính chất nhập Niết-bàn”); Sujato “liable to decline” / “bound to become extinguished”. Hai dạng đầu theo `an10.55` (9 khoá, cùng cấu tạo `puggalo parihānadhammo`); `parinibbānadhammo` không có tiền lệ trong tầng (0 khoá).
  (7) `1.4` `āvasathaṁ` dịch “nhà nghỉ”; tầng chỉ có `āvasathāgāra` → “nhà khách” (`dn16`). Giữ “nhà nghỉ” vì Pāli chỉ nói chỗ trú để tìm.
  (8) Hai chỗ dùng “đọa xứ”: `2.5` … `13.1` (`āpāyiko`, theo `an8.7`/`iti89`, 8 khoá cùng công thức `āpāyiko nerayiko kappaṭṭho atekiccho`) và `9.4`/`9.11` (`vinipāta`, trong chuỗi “cõi dữ, ác thú, đọa xứ, địa ngục”, 19/19 khoá `an7` và 2/4 khoá `an6`). Cả hai đều có tiền lệ, nhưng chữ “đọa xứ” mang hai gốc Pāli khác nhau trong cùng một bài; biên tập có thể muốn đổi một trong hai.
  **Thuật ngữ, đếm trên tầng trước khi chốt.** `kusalamūla`/`akusalamūla` → “gốc thiện”/“gốc bất thiện” (10 khoá mỗi dạng; “thiện căn” 2, “căn lành” 2) · `cetasā ceto paricca pajānāmi` → “dùng tâm mình bao quát tâm” (dạng ngôi thứ nhất `paricca pajānāmi`: “bao quát” 15/24 khoá, còn lại không dùng từ nào trong hai từ; trên cả 84 khoá có công thức: “bao quát” 28, “bao trùm” 14) · `kappaṭṭho` → “trụ suốt một kiếp” 8/10 · `āpāyiko nerayiko kappaṭṭho atekiccho` → “đi đến đọa xứ, địa ngục, trụ suốt một kiếp, không thể cứu chữa” (`an8.7`, `iti89`, 8 khoá; `mn58` dịch “cảnh giới khổ … ở đó một kiếp, không thể cứu vãn”, 2 khoá) · `acirapabbajito … abyatto` → “xuất gia chưa lâu … ngu dốt, thiếu năng lực” (`sn22.86:2.5`) · `sukkadhamma` → “pháp trắng” (11 trên 204 khoá có chữ `sukka`; 25 khoá khác dịch “thiện” trong ngữ cảnh khác) · `ekantakāḷaka` → “hoàn toàn đen tối” (`an7.15`), `ekantasukka` → “hoàn toàn trắng sáng” · `antarahita` → “biến mất” 96/112 · `āyatiṁ` → “trong tương lai” 298/341 · `vālaggakoṭinittudanamatta` → “nhỏ bằng đầu mút sợi lông” (`dn16:5.5.8`, 1 khoá) · `atthakāmo hitakāmo yogakkhemakāmo` → “muốn lợi ích, muốn điều tốt, muốn sự an toàn” (`mn19`) · `vuddhiṁ virūḷhiṁ vepullaṁ` cho hạt giống → “tăng trưởng, phát triển và hưng thịnh” (`sn55.25`, `sn22.54`: cùng câu hỏi `api nu tāni bījāni …`; 4 khoá hạt giống trong tầng) còn cho than hồng tôi đổi chữ thứ ba thành “lan rộng” cho tự nhiên (Sujato “spread”); `sammukhībhūta` → “hiện diện”; `Evaṁ, bhante.` đáp câu hỏi `Jāneyyāsi tvaṁ …?` → “Bạch Thế Tôn, đúng vậy.” (35 khoá `an`, cao nhất; “Bạch Thế Tôn, có.” 6).
  **Dùng lại tiền lệ.** 17 khoá có Pāli trùng nguyên văn ở bài khác (tổng 1.766 cặp tầng đã dò); dùng lại nguyên văn bản Việt đã có ở 16 khoá (`3.1`, `6.1`, `6.3`, `6.4`, `6.5`, `10.1`, và 10 khoá `Evaṁ, bhante.`). 1 khoá viết khác: `10.3` `“Sakkā, ānandā”ti bhagavā avoca:` → “Có thể, này Ānanda,” vì tiền lệ duy nhất (`sn45.4:4.1`) dịch “Được”, còn Pāli trả lời trực tiếp `sakkā nu kho` ở `10.2` nên giữ “Có thể”.
  **Trong chính bài:** 21 nhóm Pāli trùng nguyên văn (95 khoá); bản Việt giống nhau trong cả 21 nhóm, 0 nhóm lệch. Sáu khối (ba hạng người đầu `7`–`9`, ba hạng sau `10`–`12`) lặp công thức nên một số cặp khối chỉ khác nhau ở vế thiện/bất thiện; đã in từng cặp Pāli↔Việt ra đọc để chắc không khối nào mang nội dung khối khác (hạng 1: thiện mất, gốc thiện còn → không suy giảm; hạng 2: bất thiện mất, gốc bất thiện còn → suy giảm; hạng 3: toàn đen tối → địa ngục; hạng 4: gốc thiện sắp bị nhổ → suy giảm; hạng 5: gốc bất thiện sắp bị nhổ → không suy giảm; hạng 6: toàn trắng sáng → nhập Niết-bàn; khớp `13.1`–`13.2`).
  **Kiểm dấu nháy: 157/157 khoá khớp Pāli từng khoá** (cả nháy đơn `‘’` và nháy kép `“”`; Pāli dùng nháy lồng, quan trọng nhất ở `2.4`–`2.6`, `3.5`–`3.8`, và chuỗi lời Đức Phật mở ở `7.1` kéo dài tới `9.14`). **Dấu lược: Pāli bài này không có `…`, `…pe…` hay `(…)` ở khoá nào (0/157); bản Việt cũng không (0/157).**
  **Số Pāli, tự tính.** `eka`/`eko` = một (`ekapuggala` 4.3, `eko` 13.1–13.2 mỗi cụm ba lần) · `tayo puggalā` = ba hạng người (`10.2`, `13.1`, `13.2`) · `tiṇṇaṁ puggalānaṁ` = của ba hạng người (`10.2`, `13.1`, `13.2`) · `Aṭṭhamaṁ.` = thứ tám · `6.62` ở `0.1` giữ nguyên. Không có `sahassa`, `sata`, `kappa`+số hay `tiṁsa` nào; `kappaṭṭho` chỉ là “trụ suốt một kiếp”, không kèm số.
  **Kiểm tra máy.** Tập khoá Việt = tập khoá Pāli 157/157, đúng thứ tự Pāli; không khoá rỗng; NFC; không Pāli lọt sang Việt (ngoài tên riêng `Aṅguttara`, `Daṇḍakappaka`). Chưa chạy bốn lệnh của kho trong lượt này (bị cấm): `npm run validate`, `npm test`, `npm run check`, `npm run build` — vì vậy `technical_integrity` đặt 9.6 và không tuyên bố technical gate đã qua.
