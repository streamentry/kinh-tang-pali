notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): an4.159:5.5 — `vedanā` dịch “cảm thụ” → “cảm thọ” (thuật ngữ
  của glossary; “cảm thọ” áp đảo toàn tầng). Giữ nguyên phần còn lại của từng khoá.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an4.159:5.8, 6.10, 7.11 — «vì lý do như vậy Ta đã nói điều
  ấy» → «đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói», vì bản cũ gộp `iti` với
  `idametaṁ paṭicca` thành «lý do như vậy» (cách đa số 54/80 khoá cùng Pāli); khoá an4.159:6.5, 7.5 — thêm
  «Người ta nói» cho tiểu từ `kira` bị bỏ (cùng công thức an3.13:4.7), giữ «tên như thế này» cho
  `itthannāmo`; giữ nguyên khoá an4.159:2.4 vì «chấp nhận bằng cách im lặng» (`adhivāsesi … tuṇhībhāvena`)
  sát từng chữ hơn «im lặng nhận lời».

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt hai, ngưỡng lỏng): khoá 6.5, 6.7, 7.5 (kèm 7.7 cùng
  cụm) — «tự thân thông suốt chứng ngộ» → «tự mình chứng ngộ bằng thắng trí» (`sayaṁ abhiññā
  sacchikatvā`: không có chữ nào của Pāli ứng với «thân thông suốt»; dùng lại cách của ud7.5:4.2);
  giữ «nhờ sự diệt tận các lậu hoặc», «tên như thế này» (`itthannāmo`) và «chứng và an trú trong
  hiện tại» nguyên vẹn.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt ba): khoá 6.7 — ‘Bao giờ tôi cũng sẽ nhờ sự diệt tận các
  lậu hoặc …!’ → ‘Bao giờ thì tôi cũng sẽ nhờ sự diệt tận các lậu hoặc …?’ (`kudāssu nāma ahampi …` là lời
  mong ước dạng câu hỏi; «bao giờ … cũng sẽ» dễ đọc thành «lúc nào cũng sẽ»; «cũng» ứng với `ahampi`);
  khoá 7.8 (cùng lời nghĩ với 7.7, quét theo 6.7) — «huống gì là ta» → «huống gì là tôi» để cùng cách xưng
  với 6.7. Giữ nguyên khoá 2.4 (đã chốt lượt trước: «chấp nhận bằng cách im lặng» sát `adhivāsesi …
  tuṇhībhāvena`), khoá 6.5, 7.5 (đã rà lượt trước; giữ «Người ta nói … tên như thế này» cho `kira` và
  `itthannāmo`).
