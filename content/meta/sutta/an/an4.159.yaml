notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): an4.159:5.5 — `vedanā` dịch “cảm thụ” → “cảm thọ” (thuật ngữ
  của glossary; “cảm thọ” áp đảo toàn tầng). Giữ nguyên phần còn lại của từng khoá.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá an4.159:5.8, 6.10, 7.11 — «vì lý do như vậy Ta đã nói điều
  ấy» → «đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói», vì bản cũ gộp `iti` với
  `idametaṁ paṭicca` thành «lý do như vậy» (cách đa số 54/80 khoá cùng Pāli); khoá an4.159:6.5, 7.5 — thêm
  «Người ta nói» cho tiểu từ `kira` bị bỏ (cùng công thức an3.13:4.7), giữ «tên như thế này» cho
  `itthannāmo`; giữ nguyên khoá an4.159:2.4 vì «chấp nhận bằng cách im lặng» (`adhivāsesi … tuṇhībhāvena`)
  sát từng chữ hơn «im lặng nhận lời».
