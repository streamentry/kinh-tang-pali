notes:
  - >-
    **Mười tai họa, nhưng bốn tình huống phải hỏi lại thay vì kể tiếp** (mục 2,
    3, 4, 5 dùng *Tại đó, nhà vua nghĩ thế này* / *Họ nghĩ thế này* rồi hỏi *có
    phải vị đã xuất gia ấy làm điều gì không*), sáu tình huống sau (6–9) thì
    không cần hỏi vì vụ việc đã lộ ra. Tôi dịch theo đúng sự phân chia này,
    **không** đồng nhất hết thành một khuôn.
  - >-
    **Hai chỗ đọc sai nghiêm trọng, lượt review bắt được, ghi lại vì cả hai đều
    là loại “đúng hình thức, sai nghĩa”.**
    (1) **`mahesī` là *hoàng hậu*, không phải *đại thần*.** Bản đầu tôi dịch
    *đại thần*, vì hình dạng từ giống `mahāmatta`. Nhưng `rājā mahesiyā saddhiṁ
    nisinno hoti` là **ngôi thứ ba số nữ** (`mahesiyā` là cách ngữ số nữ của
    `mahesī`), và vế sau `Mahesī vā bhikkhuṁ disvā sitaṁ pātukaroti` — **bà**
    cười. Đối chiếu corpus: `an4.198:6.5` đã dịch cùng từ đó là *hoàng hậu*.
    Ngoài ra `dhp422:2` và `snp1.12:2.4` dịch `mahesi` là *bậc đại ẩn sĩ* — đó
    là **từ khác** (đại hiền giả, số ít), không phải *đại thần*. Đã sửa cả `1.3`
    và `1.5`.
    (2) **`sitaṁ pātukaroti` là *nở nụ cười*, không phải *chỉ tay gọi*.**
    `sitaṁ` là hình thức danh từ của *sita* (cười), `pātukaroti` là *lộ ra, biểu
    lộ*. Bản đầu dịch *chỉ tay gọi* — sai cả động từ. Đã sửa.
  - >-
    **`rājantepurappavesa` → *khi đi vào cung vua*** (0 segment, đặt mới):
    `rājantepura` = thành cung của vua, `purappavesa` = đi vào; **người đi vào
    là tỳ-kheo, không phải vua**. Bản đầu tôi dịch *khi vua đi vào cung* — làm
    đảo chủ thể, và đó là cả lỗi của tiêu đề lẫn mười hai chỗ trong thân. Đã sửa
    toàn bộ.
  - >-
    **`addhā imesaṁ kataṁ vā karissanti vā` → *ở lâu quá rồi, hoặc họ đã làm,
    hoặc họ sẽ làm***: Pāli có **`vā … vā`** nên phải để **hai khoảng vàng**;
    bản đầu vắt thành *rồi họ sẽ làm điều gì đây* — mất luôn vế đã làm. Đã sửa.
  - >-
    **`Yesaṁ taṁ amanāpaṁ` → *Những người thấy việc ấy không dễ chịu*** theo
    `an4.115:1.3` (*làm thì không dễ chịu*); bản đầu bỏ mất vế *không dễ chịu*,
    khiến cả bốn mục 6–9 đọc như chỉ có một tiếng nói. **`rājā … saṁsaṭṭho` →
    *Vua đã bị vị đã xuất gia ấn cản rồi*** — 0 tiền lệ đúng nghĩa; `dhp291:3`
    có `saṁsaṭṭha` theo nghĩa *bị trói buộc*, khác ngữ cảnh. Bản đầu dịch *bị vị
    đã xuất gia chặn đường*, dựa trên một tiền lệ mà tôi ghi nhầm là
    `an5.90:3.1` — tra lại thì `an5.90` **không có** trong corpus. Đã sửa và ghi
    lại ở đây để lần sau đừng ghi tiền lệ bằng trí nhớ.
  - >-
    **`nīcaṭṭhāniyaṁ ucce ṭhāne ṭhapeti` → *nhà vua đặt người thấp lên chỗ
    cao***: bản đầu dịch *đặt **việc** thấp vào chỗ cao* — Pāli nói về **người**
    (`ṭhapeti` = đặt người ấy vào chỗ ấy), không phải việc. Cùng lỗi ở mục 7. Đã
    sửa.
    **Bỏ thành ngữ *có vị vua* ở mục 2, 6, 7, 8, 9**: Pāli chỉ có `rājā`, không
    có *có*; thành ngữ này làm chủ thể mơ hồ. Giữ *có* ở mục 3, 4, 5, 10 vì ở đó
    Pāli thật sự nói **trong cung vua có…**.
  - >-
    **`kāle senaṁ uyyojetvā antarāmaggato nivattāpeti` → *sai quân ra đúng lúc,
    rồi lúc binh sĩ còn trên đường đi lại bảo quay về***: bản đầu dịch *đang ở
    giữa chiến trường* — `antarāmaggata` là **đang trên đường đi**, không phải
    giữa chiến trường. Đã sửa.
    **`rūpasaddagandharasaphoṭṭhabbāni` → *những thứ khiến phải nhìn, nghe,
    ngửi, nếm và chạm***: đây là **năm căn**, và bản đầu của tôi **chỉ kể sắc và
    mùi** — mất tiếng và vị. Đây là loại lỗi mà nhiệm vụ gọi là mất modality,
    nên đã sửa và ghi rõ. Cùng lúc `hatthi/assa/ratha-sammadda` → *chỗ voi giàm,
    ngựa giàm, xe ngựa giàm* thay cho *quả vực*, vì `sammadda` là **giàm nát**,
    không phải *đi qua quả*.
    **`abbhantarā guyhamantā bahiddhā sambhedaṁ gacchanti` → *có những việc bên
    trong, những việc giữ bí mật, bị đem ra ngoài, đi đến chỗ chia rẽ*** (0
    segment, đặt mới): bản đầu dịch *có đồ bên trong lén lút đưa ra ngoài, rồi
    đi vào chỗ chia rẽ* — vừa lộn ngữ pháp, vừa bỏ mất `sambheda` là **chia rẽ,
    phân cách**. Đã sửa.
