notes:
  - >-
    **Bài dài nhất chương (117 segment) và là bài duy nhất có tình tiết**: nữ cư
    sĩ Migasālā hỏi vì sao cha chú đều sinh lên cùng một nơi, Tôn giả Ānanda trả
    lời rồi báo lại, Đức Phật quở nhẹ rồi nói về việc **không nên phán xét về
    các cá nhân** — và phần còn lại là mười cá nhân theo năm cặp.
  - >-
    **`Ākaṅkhavagga` → *Phẩm Nguyện Cầu*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *If You Want*, và cả phẩm đúng một việc — *vị tỳ-kheo mong
    nguyện điều này, thì hãy làm điều kia* (`ākaṅkha` = mong nguyện).
    `Ākaṅkhasutta` → *Kinh Nguyện Cầu*.
    **`Ākaṅkhavaggo tatiyo` ở `an10.80:1.14` dịch là *Phẩm Nguyện Cầu, thứ ba***
    — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì phẩm này rõ
    ràng thứ tám (đúng như `8.` ở `0.2`). Tôi dịch theo Pāli vì Pāli là
    authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Năm cặp cá nhân dùng đúng một khuôn**, tôi dựng bằng hàm cho cả mười khối:
    vị thứ nhất **không** biết rõ, vị thứ hai **có** biết rõ; cùng một điều
    kiện; rồi cùng một kết luận ngược chiều. `yatthassa taṁ … aparisesaṁ
    nirujjhati` → *nơi … chấm dứt trọn vẹn* (bản đầu tôi dịch vòng cặp là *ở nơi
    X không còn X*, vừa lặp vừa vô nghĩa; đã sửa).
    **Cặp đầu lệch phân mục**: `9.1`–`9.2` là phần *“đây là mười cá nhân / là
    mười gì?”* nên vị thứ nhất của cặp đầu bắt đầu ở `9.3`, không phải `9.1`.
    Đây là bẫy bố cục; dùng vòng lặp suy ra `mục + 1` sẽ sinh nội dung thừa.
  - >-
    **Ba mục so sánh bị lược `…pe…`** (`15.1`, `18.1`, `21.1`) nên chỉ còn
    *những kẻ hay phán xét so sánh họ …*; hai mục đầy đủ (`11`, `24`) và mục dài
    nhất (`12`, `25`) tôi dịch đủ. `25.1` dài hơn `12.1` vì Pāli dài hơn — không
    phải lỗi lệch khuôn.
  - >-
    **Cùng một câu hỏi của Migasālā xuất hiện bốn lần với dấu câu khác nhau
    trong Pāli**: `2.1` mở ngoặc kép và kết bằng dấu chấm, `3.1` đóng ngoặc kép
    và có dấu hỏi, `6.1` không ngoắc và không dấu hỏi, `7.1` có dấu hỏi không
    ngoắc. Tôi theo từng chỗ, vì dấu hỏi được đối chiếu theo **sự hiện diện** ở
    từng segment. Cùng kiểu: lời Đức Phật báo về Tusita ở `2.3`/`2.5` bọc trong
    **nháy đơn**, còn ở `6.3`/`6.5` không có nháy nào.
  - >-
    **Thuật ngữ 0 tiền lệ, đặt mới và ghi lý do tại đây**: `ammakā ammakapaññā`
    → *dở không biết, vô duyên với buổn dở, chỉ có trí hiểu như buổn dễ* (lời
    quạc ngạt của Đức Phật, nên tôi dịch sát thành ngạt nghĩu, không làm nhẹ);
    `purisapuggalaparopariye ñāṇe` → *biết chỗ xứng tầm người*; `dhammasoto
    nibbahati` → *dòng pháp cuốn vị tỳ-kheo ấy đi*; `pamāṇikā` → *hay phán xét*;
    `khaññati` → *tự hại mình*; `ekaṅgahīnā` → *thiếu ở một phần*;
    `abhisamparāyaṁ` → *trong đời sau* (theo `an4.121:6.3` *quả báo ở vị lai*).
    Có tiền lệ: `sakadāgāmī` → *bậc Nhất lai* (`an10.46:7.2`); `kālaṅkato` →
    *qua đời* (`an4.113:6.2`); `upāsikā` → *nữ cư sĩ* (`an3.127:3.4`);
    `pubbaṇhasamaya` → *buổi sáng* và `paññatte āsane` → *chỗ toạ đã được dọn
    sẵn* (`an3.123:2.4`); `pacchābhatta` → *sau bữa ăn* (`an10.50:1.2`);
    `cetovimutti paññāvimutti` → *giải thoát tâm và giải thoát tuệ*
    (`an5.71:2.4`); `savane` → *nghe*, `diṭṭhiyā paṭividdha` → *thấy rõ về lý
    thuyết*.
    `tusita` **0 tiền lệ** — tôi giữ *cõi trời Tusita*; `Purāṇa` và `Isidatta`
    là tên riêng.
