notes: |-
  Hoàn thiện toàn bài 33/33 khóa Pāli (5 khóa an1.268 giữ nguyên từ đợt trước,
  thêm 28 khóa 269–277). Đã đối chiếu Sujato ở mọi khóa có nội dung qua vr_prA.txt.
  Không có tầng Việt hiện hành cho AN trong snapshot đã ghim.
  Khung aṭṭhāna giữ nguyên từng chữ theo an1.268 trên đĩa và published an1.278-286.
  Vế trong: 269 là lạc và 270 pháp nào là tự ngã khớp mn115:12.4/12.6 đã published;
  271–273 giết mẹ/giết cha/giết bậc A-la-hán khớp mn115:13.1–13.4 và an6.87:1.3;
  275 chia rẽ Tăng và 276 chỉ rõ một bậc Đạo sư khác khớp mn115:13.7/13.9;
  277 khớp mn115:14.1/14.2 (cùng một lúc cho apubbaṁ acarimaṁ; có một vị cho ekova).
  Hai chỗ lệch tiền lệ gần nhất, đã ghi nhận: 274 dùng với tâm ác + làm chảy máu
  Như Lai theo an6.87:1.3 thay vì tâm độc hại + làm nhầu máu Đức Như Lai của mn115
  (tâm độc hại và nhầu máu chỉ xuất hiện ở mn115, 2 occ; làm chảy máu Như Lai rõ
  tiếng Việt hiện đại hơn và vẫn sát lohitaṁ uppādeyya hơn injure của Sujato);
  276 giữ chỉ rõ theo mn115 dù Sujato dịch dedicate themselves to another teacher —
  Pāli uddisati là chỉ rõ/bổ nhiệm, Pāli thắng.
  Pāli 271:1.2 thiếu etaṁ so với các bài anh em (kho etaṁ → kho), không đổi nghĩa,
  bản Việt giữ nhất quán. 277:1.3 Phẩm thứ nhất có 4 tiền lệ.
  Chủ thể, phủ định kép, modality khả năng đều đúng Pāli. Không blocker.
