notes:
  - >-
    `pātimokkhaṭṭhapanā` → **"lý do trục xuất"** (`ṭhapanā` là hành động trục
    xuất khỏi Tăng). Mười lý do đi theo cặp: năm *ngồi trong đại hội* và năm
    *bàn luận nổ ra cãi nhau*.
  - >-
    **`pārājika` và `paṇḍaka` giữ nguyên chữ Pāli**, kèm chú thích nhỏ bằng
    tiếng Việt ("phạm pháp Pārajika", "phạm tội Pāṇḍaka"), theo `an4.244:1.14`
    ("phạm pháp Parajika") — đây là tên lỗi trong Luật Tứ Phần, dịch ra tiếng
    Việt sẽ không nhận ra được.
  - >-
    **`sikkhakpaccakhātaka` chưa có tiền lệ (0 segment):** dịch *lừa dối người
    học để trục xuất*. `sikkhaka` = người đang học (tỳ-kheo tân), `paccakhāta` =
    bị đẩy ra. Giữ nghĩa đủ cả hai vế.
  - >-
    **`anupasampanna` chưa có tiền lệ (0 segment):** dịch *điều chưa phát sinh*.
    Pāli ghép `anupasampanno` (chưa xảy ra) với `tassaṁ parisāyaṁ nisinno hoti`
    (ngồi trong đại hội); ý là có người ngồi đó khiến điều chưa phát sinh trở
    thành phát sinh rồi cãi nhau. Vì không có số đếm được, ghi lý do.
  - >-
    `vippakatā` → **"cãi nhau"**. Tiền lệ 39 segment ở `an4.185:3.1` dịch là
    "câu chuyện nào còn dang dở?", không phải cãi nhau — ở đây nghĩa là *tranh
    cãi*, nên khác; ghi lại để người sau không lấy `an4.185` làm chuẩn.
  - >-
    `nisīno hoti` đặt "ngồi" **trước** vế động từ ("có kẻ ngồi giết hại tỳ-kheo
    nữ") chứ không đặt cuối, vì đặt cuối mười lần liên tiếp đọc rất nặng. Lượt
    review bắt được chỗ "lừa dối người học để trục xuất ngồi" là loại này.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
