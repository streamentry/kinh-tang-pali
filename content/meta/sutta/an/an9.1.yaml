notes: |-
  **Bài này là bản Aṅguttara RÚT GỌN của hai bài đã có tiếng Việt trong cùng kho — đo được, không phải suy đoán.** `an9.1` không phải bài độc lập: nó lấy danh sách năm *upanisā* và bốn pháp tu tập thêm từ `dn34:2.1` (danh sách trong *Mahāghaṇikāyasuttanta* của Đại Bộ) và từ `ud4.1` (Kinh Meghiya). Tôi dựng chỉ mục Pāli ↔ Việt của toàn tầng (5.764 tệp Pāli trong cache, 4.983 bài Việt, 86.135 chuỗi Pāli đã có bản dịch) và đếm được các cặp trùng nguyên văn: `dn34:2.1.14` / `2.1.18` / `2.1.31` trùng với `6.1` / `8.1` / `9.1`; `ud4.1:12.1 / 17.1 / 18.1 / 19.1 / 20.1 / 21.1–21.4` trùng với `5.1 / 10.1–13.2 / 14.1–14.4`. **10 khoá của bài này dùng lại nguyên văn bản Việt đã có** (chi tiết ở cuối `notes`). Đó là lý do `triangulation` ở mức 9.3 dù bài không có tầng Việt tham khảo nào.

  **`āvuso` → *hiền giả*, `kalyāṇamitta` → *bạn lành*.** Cả hai lấy từ `dn34:2.1` và `ud4.1` — tức là đúng hai bài mà `an9.1` rút gọn từ đó, chứ không phải đa số chung chung: `āvuso` → *hiền giả* có 5 tiền lệ (dn33, dn34) và còn 9 tiền lệ *bạn đạo hữu* trong tầng, tôi chọn vì nó khớp đúng công thức của bài nguồn; `kalyāṇamitta` → *bạn lành* khớp cả `content/glossary/pali-vi.yaml` lẫn `ud4.1:12.1`, trong khi `sn3.18` dùng *bạn tốt* và `sn45.2` dùng *người lành* — tôi theo glossary và bài song song.

  **Một sợi dấu lược, không mở rộng.** `2.3` có `…pe…`; Pāli khoá đó không đủ ý, tôi giữ **đúng một** `…` và không chép câu nào của bản Anh vào chỗ trống, theo `BRIEF_VI3` §10.1. Chỗ đóng ngoặc kép đặt đúng như Pāli: `“` mở ở `2.1`, đóng ở `2.2`; `“… ”` ở `2.3`, `3.1`, `3.2`; `“` mở ở `4.1` và đóng ở `14.4`; `‘… ’` lồng nhau ở `2.2`, `4.2`, `5.1–9.2`. Đếm bằng script: Pāli 5 mở / 5 đóng, bản Việt 5 / 5.

  **Bốn khoá lặp nguyên văn TRONG CHÍNH BÀI — dịch một lần, dùng lại y hệt.** `10.1`, `11.1`, `12.1`, `13.1` đều là `Kalyāṇamittassetaṁ, bhikkhave, bhikkhuno pāṭikaṅkhaṁ kalyāṇasahāyassa kalyāṇasampavaṅkassa—`. Nếu bốn câu mà lệch nhau một chữ thì bài tự mâu thuẫn. Cùng nguyên tắc cho `2.1`/`4.1` và `5.2`–`9.2` (năm câu *…là điều kiện thứ N…*, chỉ khác số thứ tự).

  **`14.2` dùng lại nguyên văn `ud4.1:21.2`.** Pāli hai bài giống hệt từng chữ. **Xung đột với glossary đã ghi nhận, chưa tự ý quyết:** glossary (`severity: warn`) đặt `byāpāda` → *sân hận*, còn `ud4.1:21.2` dùng *sân*. Theo `skill/translation.md` §6 glossary là memory/QA aid chứ không phải luật bất biến, và BRIEF bắt dùng lại nguyên văn khi Pāli trùng — nên tôi giữ *sân* và **giao người biên tập phán**. Lưu ý thêm: mục `asubhanimitta` của glossary (*tướng bất tịnh*) là khoá khác, không phải `asubhā` của `14.2`, nên không xung đột.

  **`3.2` bỏ hạt `Evaṁ`.** Pāli `“Evaṁ, bhante”ti kho te bhikkhū bhagavato paccassosuṁ`; tôi dịch *“Bạch Thế Tôn,” các vị tỳ-kheo đáp.* — đây là **đa số đo được của bộ `an`** (15/58 câu `paccassosuṁ`), còn *“Dạ vâng, bạch Thế Tôn,”* chỉ 5. Hạt chấp nhận-lời bị lược, là mất nhẹ nhưng là mất; ghi ra đây để biên tập biết là có chọn lựa, không phải sơ suất.

  **Hai cụm từ đặt mới, 0 tiền lệ trong toàn tầng.** `sambodhipakkhikānaṁ dhammānaṁ` → *những pháp thuộc về giác ngộ* (Sujato: *qualities on the same side as awakening*; `sambodhipakkhi` = có giác ngộ bên cạnh, tôi nới thành *thuộc về* để người Việt hiểu ngay, không dịch *bên cạnh* vì câu sẽ tối nghĩa). `upanisā bhāvanāya` → *điều kiện để tu tập* (`bhāvanā` → *tu tập* đã có 27 tiền lệ theo dn33/dn34/mn53/mn85/mn90/an10.11/an10.17/an10.50; `upanisā` = điều kiện nền tảng). Cả hai xuất hiện 5 lần và 5 lần trong bài, dùng **y hệt nhau** mọi lần.

  **Bốn lời mở đầu lấy đa số riêng của bộ `an`, không đoán.** `Evaṁ me sutaṁ—` → *Tôi nghe như vầy—* (25 lần với *vầy*; 7 lần *vậy* — tôi theo *vầy*, và giữ gạch dài `—` vì Pāli kết bằng gạch) · `ekaṁ samayaṁ bhagavā sāvatthiyaṁ …` → 8 cách, đa số 11/32 → *Một thời, Đức Phật ở Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika.* · `Tatra kho bhagavā bhikkhū āmantesi` → 6 cách, đa số 15/26 → *Tại đó, Đức Phật gọi các vị tỳ-kheo:* · `Bhagavā etadavoca` → 6 cách, đa số 31/49 → *Đức Phật nói:*. Vì vậy trong bài này `bhagavā`/`bhagavato` là **Đức Phật** còn `bhante` là **bạch Thế Tôn** — đúng như cặp đó đã có trong `an`.

  **`an9.1:2.1` và `:4.1` — Pāli trùng với `an10.58:1.1/3.1`, `an3.68:1.1/2.1`, `an8.83:1.1`, và `an10.58` là bài *nói về* `an9.1`.** Có 3 cách trong tầng, mỗi cách 2 lần, hòa nhau. Tôi chọn *“Này các tỳ-kheo, nếu các du sĩ đạo khác hỏi:* vì trật tự Hán–Việt tự nhiên hơn, và ghi lại ở đây vì đây là **lựa chọn hòa**, không phải đa số.

  **`0.1` — điểm người điều phối nêu SAI ở cấp bộ, đúng ở cấp bài; tôi theo chỉ đạo và ghi rõ.** Người điều phối nói `0.1` của bài `an` là *Kinh Tăng Chi Bộ* (862 tệp). Tôi đo lại: **875 tệp *Kinh Tăng Chi Bộ* / 353 tệp *Aṅguttara Nikāya*** (1.228 tệp có `0.1`; 372 tệp không có) — xác nhận chỉ đạo. **Nhưng riêng quyển 9 thì ngược lại: 45 tệp *Aṅguttara Nikāya 9.N* / 4 tệp *Kinh Tăng Chi Bộ 9.N***, và ba bài lân cận ngay trong phẩm này (`an9.2`, `an9.7`, `an9.10`) đều dùng *Aṅguttara Nikāya 9.N*. Tôi theo chỉ đạo (đa số toàn bộ bộ `an`, và lệnh là rõ ràng) nên `0.1` = *Kinh Tăng Chi Bộ 9.1*; **xin người điều phối phán lại khi gộp** — đổi một khoá, không tốn công. `0.2` thì tuyệt đối thống nhất: *1. Phẩm Giác Ngộ* (5 bài `an9.*` cùng phẩm, không lệch). `0.3` = *Kinh Giác Ngộ* — lặp chữ *Giác Ngộ* với `0.2`, nhưng Pāli cũng lặp (`Sambodhivagga` / `Sambodhisutta`), nên tôi giữ, không tự sửa cho khác.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root: `root/pli/ms/sutta/an/an9/an9.1_root-pli-ms.json`, 37 khoá. Bản Anh Sujato **có** tại commit đã ghim: `translation/en/sujato/sutta/an/an9/an9.1_translation-en-sujato.json`. Đo coverage đúng công thức `source/layers.yaml` (Pāli có nội dung ≥ 40 ký tự sau chuẩn hoá, loại khối tham chiếu `:0.x`): **30/30 = 100%**, không có khoá nào rỗng. Chỗ duy nhất Sujato im lặng là `14.5` `Paṭhamaṁ.` (một từ) — và đó **không phải** sự đồng thuận về cách dịch; tôi dịch từ Pāli và dùng *Thứ nhất.* theo đa số tuyệt đối **128/128** trong bộ `an`. Lớp lấp `english-project` của dự án **không** có `an9.1` (tôi đã `find`; tệp `an9.13` là của bài khác, khớp do ký tự đại ý `*`). Tầng `vietnamese-current` **vắng**: trong checkout này thư mục `translation/` không tồn tại, nên không có Hòa thượng Thích Minh Châu để đối chiếu — đây là đặc điểm của snapshot, không phải thiếu sót của bài. Triangulation của bài này dựa vào: Pāli root + Anh Sujato + **hai bài song song trong chính corpus** (`dn34`, `ud4.1`) + 10 khoá dùng lại nguyên văn.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì BRIEF cấm `npm run validate|test|build|check` trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0, vì mọi chốt tự động của `_hvi.kiểm` đã xanh (37/37 khoá có nội dung đủ, không khoá thừa, ngoặc kép cân trên cả bài, NFC, không trùng nguyên văn Pāli, không lọt Pāli, số dấu lược khớp từng khoá) nhưng cổng `npm` và lượt rà độc lập chưa chạy.

  **10 khoá dùng lại nguyên văn (đếm bằng script, không bằng mắt):** `0.2` ← `an9.2/an9.7/an9.8/an9.9/an9.10` · `1.1` ← `an10.1/an10.18` · `1.2` ← `an10.1/an10.18` · `1.3` ← `an3.1` · `2.1` ← `an3.68` · `3.3` ← `an10.216` · `4.1` ← `an3.68` · `8.1` ← `dn34:2.1.18` · `14.2` ← `ud4.1:21.2` · `14.5` ← `an10.1`.