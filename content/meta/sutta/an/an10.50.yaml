notes:
  - >-
    **Bài kết chương, có đủ ba phần**: thân bài, `Akkosavaggo pañcamo.`, rồi
    `Tassuddānaṁ` và `Paṭhamo paṇṇāsako samatto.`. **Mười mục, mỗi mục lặp khuôn
    ba dòng** (`Yampi …,` / `ayampi dhammo … saṁvattati.`), trong đó mục bốn
    phải dồn số vì `4.1`–`4.2` đã bị Pāli dùng làm phần mở đầu — **điểm bẫy bố
    cục đã được xử lý khi khai, không phải khi đoán**.
  - >-
    **Lỗi nghiêm trọng nhất của cả lô: mục 10 và mục 11 bị ĐẢO CHỖ.** Bản đầu
    đặt nội dung `santuṭṭho` (tri túc) vào `10.1` và nội dung `āraddhavīriyo`
    (tinh tấn) vào `11.1`, trong khi Pāli ngược lại. Hai mục này khác nhau hoàn
    toàn, nên đây đúng là mẫu lỗi *đúng hình thức, sai nghĩa* mà nhiệm vụ cấm.
    Đã hoán lại và **giữ đúng thứ tự Pāli** ở cả hai mục, kể cả vế `ayampi`.
  - >-
    **`SA_LONG` tôi viết trùng tiền ngữ**: `4.1` ra *Đây là mười pháp **Đây là
    mười pháp** làm cho thân mật…*. Đã tách tiền ngữ khỏi danh sách. Cùng lúc
    sửa lỗi dấu chấm ở `14.1`: bản đầu kết bằng `.”.` — **hai dấu chấm**; và bổ
    sung *Này các tỳ-kheo* cho `Ime kho, bhikkhave` như 98/101 segment tiền lệ.
  - >-
    **`ācāragocarasampanno … aṇumattesu vajjesu bhayadassāvī, samādāya sikkhati
    sikkhāpadesu` ở `4.3` là **cùng Pāli** với `an10.33:1.4` và `an10.34:1.4`,
    nên dùng lại **nguyên văn hai bài đã `published`**: *đủ căn cơ và phẩm hạnh,
    biết rõ sợ hãi trong điều nhỏ bé, học tập giữ đúng các học luật đã thọ
    nhận*. Lượt review **đã thử đổi** sang *đầy đủ hạnh nghi và sở hành* (tiền
    lệ `an5.109:1.3`, `an5.134:3.3`, `an5.136:4.2`) và *học giới*, rồi **trả
    lại** — vì cùng một Pāli đã có hai cách trong corpus (Tăng Chi Bộ 2 segment,
    Tăng Chi Bộ Năm 3 segment), và người đọc Tăng Chi Bộ phải thấy một cách
    trong chính quyển đó. Xem `docs/translation-notes/acara-gocara-
    sankhadesu.md`. `samannāgato` → *đầy đủ* (297 segment tiền lệ; bản đầu tôi
    dùng *thành tựu* ở `7.x` và `12.x`, đã sửa).
  - >-
    **`saritā anussaritā` → *nhớ rồi nhớ lại được***: Pāli lặp hai động từ để
    nói **vừa nhớ vừa nhớ lại**; bản đầu chỉ một *nhớ được*.
    **`uccāvacāni kiṅkaraṇīyāni` → *các công việc lớn nhỏ***, `alaṁ kātuṁ alaṁ
    saṁvidhātuṁ` → *để hoàn thành và sắp đặt*; `abhidhamme abhivinaye` → *Vi
    pháp và Vi luật*; `udayatthagāminiyā paññāya` → *tuệ về sự sinh khởi và hoại
    diệt*.
  - >-
    **`Tassuddānaṁ` → *Tóm lược:*** theo 48 segment tiền lệ. Bốn vệ tục ca
    **điểm danh đúng mười bài** của chương: *Tranh Cãi, và hai bài Gốc Tranh
    Cãi, / Kusinārā và Đi Vào Cung; / Thiên Tộc Sakk, Mahāli, Xem Xét Thường
    Xuyên, / Tựa Vào Thân và Tranh Chấp.* — bản đầu để *Sakko* không dịch và
    viết *và Kusinārā đi vào cung*, lạc cả hai. **`Paṭhamo paṇṇāsako samatto.` →
    *Phần năm mươi kinh thứ nhất hoàn tất.*** theo 10 segment tiền lệ (*Phần năm
    mươi kinh thứ ba hoàn tất*…); bản đầu tôi viết *Phẩm thứ nhất* —
    **`paṇṇāsako` là phần năm mươi kinh, không phải phẩm**, đã sửa.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    **Sửa lan 2026-10-13: `1.2`, `3.1`, `3.2`** — cùng lỗi đã sửa ở `an3.124`:
    `vivādāpannā` bản cũ *tranh luận* ở `1.2` nhưng *vướng vào giẫy già* ở
    `3.1`/`3.2` (*giẫy già* không phải chữ dịch của `vivāda`), và `mukhasattīhi
    vitudantā` bản cũ *dùng lời nhọn sắc đâm chỉ trích*. Nay cả ba khoá dùng đúng
    chuỗi của `an3.124:1.1`: *sinh ra tranh chấp, sinh ra cãi vã, rơi vào tranh
    luận, đâm chọc lẫn nhau bằng những lời như giáo nhọn mà sống*; ở `3.2` vế *yaṁ
    tumhe … vihareyyātha* là *là việc các ông …*. Căn cứ: Pāli root ba khoá
    (`bhaṇḍanajātā kalahajātā vivādāpannā aññamaññaṁ mukhasattīhi vitudantā
    viharanti`) và tiền lệ trong tầng (`an3.124`, `an2.43`, `mn128`, `dn33`,
    `ud6.4`). Điểm số giữ nguyên.
  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá `an10.50:2.3` — *kể từ lúc nãy các ông ngồi bàn luận chuyện gì, câu chuyện nào còn dang dở ạ?* → *vừa rồi các ông ngồi tụ họp bàn chuyện gì? Câu chuyện còn dang dở của các ông là gì?*, bỏ *ạ* (lời Đức Phật không dùng *ạ*) và đưa `etarahi` về *vừa rồi* như `an10.69:2.3`, `dn1:1.4.2`; khoá `an10.50:2.1` — *gian phòng hội trì* → *giảng đường* (`upaṭṭhānasālā`: 29/57 chỗ dùng *giảng đường*, *gian phòng hội trì* chỉ có ở bài này) và đổi cùng cách ở `an10.50:1.2`.
