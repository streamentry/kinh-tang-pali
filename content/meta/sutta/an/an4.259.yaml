notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.1 — bỏ cụm «xứng đáng được chắp tay lễ kính»
  chen sau dấu lược (Pāli chỉ có một …pe… che các vế pāhuneyyo, dakkhiṇeyyo, añjalikaraṇīyo) →
  «xứng đáng được cúng dường … là phước điền tối thượng của thế gian», đúng một dấu lược như
  an4.112 và an4.114; giữ nguyên khoá 4.2 (công thức «sống tinh tấn kiên trì … sức mạnh, nỗ lực
  dẻo dai» dùng ở nhiều bài khác, bản modal chỉ hơn một chút về số đếm), và khoá 3.1, 3.3, 4.1,
  4.3, 5.1, 5.3 (đẹp đẽ, khoẻ mạnh, nhanh nhẹn khớp khoá 1.3, 2.3, 6.1 cùng bài, bản «đầy đủ dung
  sắc, sức mạnh, tốc độ» làm lệch mạch ví dụ ngựa chánh).
