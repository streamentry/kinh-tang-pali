notes: |-
  Dịch từ Pāli root; đối chiếu Bhikkhu Sujato ở commit đã ghim (coverage Anh Sujato trên Pāli có nội dung: 84/84 = 100%, không còn khoá nào Sujato để trống; không có lớp english-project cho bài này nên đây là đối chiếu Anh độc lập hoàn toàn) và bản nguyên bài Hòa thượng Thích Minh Châu ở mục Tra cứu toàn văn (không phân đoạn, không phải tầng store; tầng `vietnamese-current` ở commit ghim chỉ có Pháp Cú). Cổng coverage đo được và đạt, không cần mục trong `content/meta/reference-gaps.yaml`.

  Cấu trúc bài: mười hạng người hưởng dục (kāmabhogī) = ba kiểu tầm cầu tài sản (phi pháp-cưỡng ép / vừa đúng vừa phi pháp / đúng pháp-không cưỡng ép) x ba mức dùng của cải (không tự làm an vui; tự làm an vui nhưng không chia sẻ; vừa an vui vừa chia sẻ làm phước) = chín kiểu; riêng kiểu cuối (đúng pháp, vừa an vui vừa chia sẻ) tách đôi theo cách hưởng dụng (bám giữ hay không bám giữ) nên thành mười hạng. Mục 12-21 kiểm điểm từng hạng bằng số điểm chê/khen; mọi cặp số đã tự đối chiếu với Pāli (ba=tīhi, hai=dvīhi, một=ekena, bốn=catūhi): 12.1/12.5 chê 3; 13 chê 2 khen 1; 14 chê 1 khen 2; 15 khen 1 chê 3; 16 khen 2 chê 2; 17 khen 3 chê 1; 18 khen 1 chê 2; 19 khen 2 chê 1; 20 khen 3 chê 1; 21 khen 4 — khớp 10/10 khoá tổng (12.1-21.1) và 10/10 khoá kết (12.5-21.6).

  Pāli trùng nguyên văn trong chính bài: 14 nhóm, 26 cặp, bản Việt dùng đúng một cách dịch cho mỗi nhóm (0 nhóm lệch). Dò 5 khoá Pāli trùng nguyên văn với bài khác trong tầng: 0.2 (5/5 cùng cách dịch) và 23.2 `Thứ nhất.` (302/304) dùng lại nguyên văn; 1.1 (16/36) và 1.2 (4/12) theo dạng phổ biến nhất vì tầng không thống nhất ở hai khoá này; 2.2 là cặp cố ý khác — `Katame dasa?`: tầng có 13 chỗ "Mười pháp nào?" nhưng ở đây đối tượng là mười hạng người, không phải mười pháp, nên viết "Mười hạng nào?". Số cặp đã dò: 5; bản Việt khác ở 1 cặp (2.2).

  Thuật ngữ (đo trên tầng, grep kèm đếm):
  - `kāmabhogī` -> "người hưởng dục": an4.15, an4.246, an3.29 (3/3 khoá); Thích Minh Châu cũng "hạng người hưởng dục". Tiêu đề "Kinh Người Hưởng Dục".
  - `attānaṁ sukheti pīṇeti` -> "làm cho mình an vui, thỏa mãn": sn3.19 (4 khoá cùng công thức) trước an5.41 (3 khoá "hạnh phúc, sung mãn"); chọn dạng sn3.19 vì ngắn và đã là đa số.
  - `gārayho` / `pāsaṁso` -> "đáng bị chê trách" / "đáng được khen" (an6.59, nhiều khoá cùng công thức); `ṭhāna` -> "điểm" (Sujato "ground").
  - `gathito mucchito ajjhosanno anādīnavadassāvī anissaraṇapañño paribhuñjati` -> theo an3.123 (3.5, 5.5; Pāli đối xứng, cùng động từ `paribhuñjati`): "bám giữ, say đắm, dính mắc, không thấy hậu quả, không có tuệ thấy lối thoát" và dạng phủ định tương ứng.
  - `sappimaṇḍo` thang sữa -> theo sn34 (5/8 khoá): sữa, sữa đông, bơ, bơ lỏng, tinh chất bơ. Hai khoá an5.190/an5.181 dùng thang lệch một nấc (dadhi -> "bơ", sappi -> "bơ trong") nên không theo.
  - `aggo ca seṭṭho ca pāmokkho ca uttamo ca pavaro ca` -> theo an4.95 (2/2 khoá): tối thượng, tối thắng, tối tôn, tối cao, và tối quý.
  - `bhoge pariyesati` -> "tìm cầu tài sản" (Thích Minh Châu "tầm cầu tài sản"); `bhagavā` ở 1.1-1.2 -> "Đức Phật" theo đa số công thức Anāthapiṇḍika ở an10 (an10.50 và các bài tương đồng).
  - `dhammādhammena` ... `sāhasenapi asāhasenapi` -> "bằng cả đúng pháp lẫn phi pháp, bằng cả cưỡng ép lẫn không cưỡng ép" (Sujato "both legitimate and illegitimate, and coercive and non-coercive").

  BẤT ĐỊNH (ghi ở đây, không thêm vào thân kinh): `sāhasa` có nhiều tầng nghĩa — bạo lực, hấp tấp liều lĩnh, cưỡng bức. Tầng dùng "hung bạo" (an7.62:7.3), "cưỡng ép" (ja434:8.1, 9.2), "bạo hành" (sn56.96-101:3.4); Sujato dịch "coercive"; Thích Minh Châu "với sức mạnh". Chọn "cưỡng ép" vì đối lập trực tiếp với `asāhasena` và với `dhammena`, và vì sát Sujato; không thêm giải thích. Mọi chỗ khác Pāli, Sujato và bản Việt truyền thống đồng thuận về cấu trúc và số đếm.

  `(…)` và `…pe…`: Pāli bài này không có khoá nào chứa dấu lược nên bản Việt cũng không có.

