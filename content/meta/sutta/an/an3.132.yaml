notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.5, 2.2 — «có chúng sinh thường hay giận dữ» → «có
  hạng người thường hay giận dữ» (`ekacco puggalo` là một hạng người, không phải `satto`/chúng sinh;
  theo an5.75, an7.15, an3.100); đồng nhất cả bài (1.1, 1.3, 1.4, 1.8, 1.10, 2.1, 2.5, 2.7, 3.1,
  3.2, 3.4, 3.5, 3.6) vì mọi chỗ `puggala` đều bị dịch «chúng sinh». Không dùng «một cá nhân» của
  an4.110 vì «hạng người» là cách dịch đa số toàn tầng.
