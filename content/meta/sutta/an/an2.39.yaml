notes: |-
  UID-GỘP TRONG TỆP BILARA, đã đếm: tệp nguồn là
  root/pli/ms/sutta/an/an2/an2.32-41_root-pli-ms.json, 168 khoá, mười tiều tố uid từng bài
  (an2.32 … an2.41). Lát này chỉ mang 13 khoá `an2.39:`; 155 khoá còn lại thuộc chín bài
  anh em, KHÔNG đụng tới: an2.32, an2.40, an2.41 đã có bản dịch trong tầng; an2.33–35 và
  an2.36–38 chưa có, thuộc lát khác. `all` và tệp đã ghi khớp đúng 13/13.
  Đây là bài DUY NHẤT trong lát có `cần` khác rỗng (12 khoá ≥40 ký tự), nên assertion của
  harness có chạy và đã pass. Tự kiểm bổ sung mọi khoá: NFC, trùng Pāli, dấu lược, nhấy kép,
  Pāli lọt — 0 lỗi.
  TRÙNG NGUYÊN VĂN, ĐÃ TRA BẰNG ĐẾM: `an2.39:1.6` và `an2.39:2.6` trùng nguyên văn với
  an5.88:1.1 và an5.88:4.8 (cùng Aṅguttara, đã publish). Đã dùng lại NGUYÊN VĂN cách dịch
  đã có cho cả cặp tiêu cực và tích cực, chỉ thêm dấu hai chấm sau điều ấy là để câu đọc
  được. Ngoài ra Pāli của an2.39 KHÔNG trùng nguyên văn với an2.32/40/41 — nó song
  song công thức nhưng khác (1.2 có `na phāsu hoti`, 2.2 không có `na`; 1.3/2.3 vậy; 1.5
  `paccantime vā janapade acchanti` đối lập 2.5 `yena vā pana tena pakkamanti`), nên dịch
  đủ 12 khoá riêng, không dùng lại nguyên văn của bài kia.
  Tiền lệ thuật ngữ, có đếm: balavanto = khỏe mạnh (83 lần trong tầng, vd mn75:15.5,
  mn143:4.8); pāpabhikkhū = vị tỳ-kheo ác (33 lần, vd an5.102:1.1, an10.77:1.8);
  pesalā = hiền lành, hiền thiện (vd dn16:1.6.17, sn6.10:1.16); brāhmaṇagahapatikā = Bà-la-môn
  và gia chủ (41 lần, vd dn4:9.3); tuṇhībhūtā saṅkasāyanti = giữ im lặng (15 lần);
  paccantime janapade = vùng biên cương (4 lần, vd dn33:3.2.60).
  BẤT ĐỊNH, đã ghi khi tra: `phāsu hoti` có 0 tiền lệ trong tầng Việt (từ thuận tiện đã
  được dùng cho sumanākappa, chỉ 1 chỗ, và là nghĩa khác: thuận tiện để đi, không phải
  được an toàn khi ra ngoài). Vì không có tiền lệ, chọn an toàn thong thả, đúng nghĩa gốc
  của phāsu, và ghi lý do ngay đây. `anusaññātuṁ`, `bāhirāni vā kammantāni paṭivekkhituṁ`
  và `yena vā pana tena pakkamanti` cũng 0 tiền lệ — chỉ xuất hiện trong chính an2.39 ở
  toàn tầng Pāli; dịch theo nghĩa: tuần duyên trong các nước, trông coi những việc làm
  bên ngoài, bỏ đi bất cứ nơi nào.
  Đối chiếu: SuttaCentral có 12/12 khoá có nội dung, coverage 100%, không cần ghi
  reference-gaps.yaml. Tầng Việt hiện hành không có bài này (vietnamese-current chỉ có
  Pháp Cú), nên triangulation dựa trên Pāli + SuttaCentral + an2.32/40/41 cùng tệp.
  Bài này không có khoá tiêu đề riêng trong bilara (chỉ có :1.0 = 39), nên translationTitle
  đặt theo nội dung: thời bạo chúa thịnh thì vua suy, thì tỳ-kheo lành cũng yếu theo.
