  notes: |-
    Lượt cải thiện 2026-10-14 (bài trước đó chưa có ghi chú; điểm cũ 9.51 chưa phản ánh các lỗi dưới đây, nên điểm mới được chấm lại từ đầu, không phải nâng).
    Khoá đổi (10/40): 2.2, 2.4, 4.2, 5.2, 5.4, 6.1, 7.2, 8.2, 9.2, 10.2. Lỗi nặng 1 (9.2 thiếu một vế của chuỗi bảy tính từ, thiếu uppannānaṁ và adhivāsakajātiko); vừa 5 (2.4/7.2 thiếu aṭṭhiṁ katvā; 6.1 chép thêm "xứng đáng được chắp tay lễ kính" từ phần bị lược của Pāli khiến lệch 10.4; 9.2 pasamphassānaṁ dịch thành "cắn xâu"; 9.2 vedanā dịch "cảm thụ"; 10.2 hai thuật ngữ khác nhau cùng dịch "diệt tận"); nhẹ 4 (người thuần voi; usuppahāra "cung tên"; 7.2 "khai thị / Giới Luật"; 8.2 hanati "phế hoại" lệch hantā "phá hoại").
      - 9.2: bảy vế dukkhānaṁ tibbānaṁ kharānaṁ kaṭukānaṁ asātānaṁ amanāpānaṁ pāṇaharānaṁ nay đủ bảy (thêm "xót xa" cho kaṭuka theo mn125:30.1); "cảm thụ" → "cảm thọ" (tầng đo 2320 cảm thọ / 55 cảm thụ, glossary vedanā = thọ); "sự cắn xâu" → "sự xúc chạm" (9 xúc chạm / 2 đụng chạm trong tầng); "chỉ trích thô tục khó chịu" → "lời nói thô ác, khó nghe" (vacanapatha là lời nói, không có nghĩa chỉ trích); thêm "đã khởi lên" (uppannānaṁ) và "có bản tính chịu đựng" (adhivāsakajātiko), giữ chữ "chịu đựng" cho cả khamo lẫn nādhivāseti ở 8.2 để giữ nét đối lập trong Pāli. Điểm đổi: semantic_fidelity 9.4→9.2, terminology 9.3→9.2 (xem dưới), grammar_logic 9.4→9.3.
      - 2.4/7.2: thêm "coi đó là việc hệ trọng" cho aṭṭhiṁ katvā, nay theo đúng công thức mn48:13.4 (cùng chuỗi Pāli); "Pháp và Giới Luật … khai thị" → "Pháp và Luật … tuyên thuyết" (72 so với 2 trong tầng). Hai khoá giờ cùng một công thức.
      - 6.1: bỏ vế "xứng đáng được chắp tay lễ kính" (Pāli chỉ có āhuneyyo …pe… anuttaraṁ puññakkhettaṁ), nay khớp 10.4; điểm segment_alignment giữ 10.0.
      - 2.2/5.2: "người thuần voi" → "người huấn luyện voi" (đúng tiền lệ mn51, mn65; "thuần" làm động từ chỉ hiếm); 5.4 thêm "đến hướng ấy" cho taṁ; 4.2 "đòn cung tên" → "đòn tên" (mn125:12.25); 8.2 "phế hoại" → "phá hoại" cho cùng gốc hantā; 10.2 taṇhākkhayo → "đoạn tận khát ái" (8/11 trong tầng) để không trùng "diệt tận" với nirodho.
    Điểm chấm lại: source_provenance 10.0; semantic_fidelity 9.2; grammar_logic 9.3; segment_alignment 10.0; terminology 9.2; triangulation 9.0 (giữ, Sujato phủ gần hết); vietnamese_clarity 9.3; han_viet_balance 9.4; ambiguity_integrity 9.0; technical_integrity 9.6. Trung bình 9.40; không blocker nên vẫn published (> 9.0).
    Bất định còn lại, không đổi: (1) tiṇava trong bheripaṇavasaṅkhatiṇavaninnādasaddānaṁ: giữ "chũm chọe" theo bản Anh, không có căn cứ Pāli độc lập để phân xử (mn125 dịch "tiếng mõ", an5.140 dịch khác); (2) "voi naga" giữ phiên âm cho nāga như an4.36 (18 lần xuất hiện ở cả hai bài), chưa thống nhất với "voi chúa" ở sn4.2; (3) công thức rājāraho rājabhoggo rañño aṅganteva saṅkhaṁ gacchati dịch "xứng đáng được vua sử dụng, phù hợp làm vật sở hữu của vua, … chi phần của vương quyền" lệch chữ so với Pāli nhưng là công thức chung của an4.112/181/196/259/260 và an8.13 (khác nhẹ); sửa riêng bài này sẽ lệch tiền lệ, nên để đợt rà công thức; (4) "biết chạy nhanh" cho gantā: Pāli chỉ nói gantā, "nhanh" lấy từ khippaṁ ở 5.4 và 10.2.
    Ngoài phạm vi, chưa sửa: an4.165:2.2 và 3.2 còn "cắn xâu", "chỉ trích thô tục", "cảm thụ" và chỉ sáu vế (thiếu kaṭukānaṁ); an4.157:3.2 cũng còn "cắn xâu", "chỉ trích thô tục", "cảm thụ" và thiếu kaṭukānaṁ.
    Cổng kỹ thuật chưa chạy trong lượt này; cần chạy npm run validate, npm test, npm run check, npm run build trước khi coi technical_integrity là đã xác nhận (đặt 9.6).
