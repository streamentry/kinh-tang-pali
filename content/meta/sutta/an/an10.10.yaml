notes:
  - >-
    Bài mười phẩm, phiên bản **hồi tưởng túc mạng và thiên nhãn**; kèm
    `Ānisaṁsavaggo paṭhamo` và mục `Tassuddānaṁ` kết chương.
  - >-
    **`anekavihitaṁ pubbenivāsaṁ anussarati` và `dibbena cakkhunā visuddhena
    atikkantamānusakena …pe… yathākammūpage satte pajānāti` dùng nguyên văn
    `an10.102:1.6`–`1.9`** (81 segment tiền lệ): *hồi tưởng nhiều loại túc mạng*
    · *một đời, hai đời …pe… một cách đầy đủ và rõ ràng* · *Nhờ thiên nhãn thanh
    tịnh vượt trên mắt người …* · *Nhờ đoạn tận các lậu …*.
  - >-
    **Lỗi lượt review bắt được và đáng ghi:** tôi lấy `Q` từ khung chung với
    `an10.8/9`, nên **mục thứ tám sai thứ tự** — đặt *thiên nhãn* vào trước *hồi
    tưởng túc mạng*, trái với Pāli. Đã sửa: mục thứ tám phải là *hồi tưởng nhiều
    loại túc mạng*, mục thứ chín là *thiên nhãn*. Đây là bài nhắc rằng ba bài
    “mười phẩm” **không chia sẻ một danh sách**, chỉ chia sẻ khuôn cú pháp.
  - >-
    **`…pe…` trong `2.6`, `2.7`, `2.8` giữ nguyên số chỗ lược của Pāli**, không
    thêm dấu lược cho các cụm Pāli chỉ lặp lại mà không có `…pe…` (ví dụ `2.4`
    lặp *tự tin mà thuyết pháp cho chúng* hai lần nhưng Pāli không có dấu lược —
    vì vậy bản dịch cũng lặp hai lần, đúng Pāli).
  - >-
    **`Tassuddānaṁ` → *Tóm lược:*** theo 133 segment tiền lệ. `vijjayāti` →
    *thắng trội* (0 segment, đặt mới). `Ānisaṁsavaggo paṭhamo.` → *Phẩm Lợi Ích,
    thứ nhất.* Bốn vế tục ca điểm danh mười bài theo thứ tự Pāli.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
