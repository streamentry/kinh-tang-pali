notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.3, 1.4, 2.3, 2.4 — «không thẩm cứu, không xét
  đoán tận gốc … kẻ đáng bị chê trách / bậc đáng được tán thán» → «không tra xét, không suy
  lường … người đáng bị phê phán / người đáng được tán thán» (`ananuvicca apariyogāhetvā`,
  `avaṇṇāraha / vaṇṇāraha`: sáu bài cùng Pāli dùng dạng này); đồng bộ 1.5 và 2.5 «thẩm cứu, xét
  đoán tận gốc» → «tra xét, suy lường»; bỏ «kẻ» và «bậc» vì Pāli không mang sắc thái ấy. Giữ tên
  kinh «Kinh Chê Kẻ Đáng Khen» (tiêu đề, không thuộc phạm vi rà này).
