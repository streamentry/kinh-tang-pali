notes:
  - >-
    **Mười căn cứ chia rẽ và mười căn cứ hòa hợp chỉ là cùng một danh sách, đảo
    chiều** — `an10.37:1.3` nói *gọi phi pháp là pháp*… còn `an10.38:1.3` nói
    *gọi phi pháp là phi pháp*… Người đọc phải thấy đây là **cùng một danh sách
    ở hai thái cực**, nên dịch đối xứng từng cặp và dùng chung một cách diễn đạt
    cho từng cặp, không phải hai danh sách độc lập.
  - >-
    `dīpenti` → **"trình bày"** theo `an3.65:3.2` ("Họ chỉ trình bày và rực sáng
    giáo thuyết của riêng mình").
  - >-
    **Ba từ chưa có tiền lệ (0 segment), ghi lý do:** `avakassanti apakassanti`
    → *phản đối, phản đối lại* (tranh chấp và phản trào; `apa-` là tiền tố phản
    bác); `āveni kammāni` → *những việc sai trái*; `āveni pātimokkha` → *một bộ
    Pātimokkha sai lệch*.
  - >-
    **Lời Ānanda xuyên qua `1.1` → `1.2`** (Pāli mở `"` ở `1.1`, đóng `”ti?` ở
    `1.2`). Bản dịch giữ nguyên: `1.1` để ngoặc kép mở, `1.2` mang dấu `”` đóng.
    Lượt review bắt được chỗ tôi đóng ngoặc kép ở `1.1` rồi lại mở ở `1.2` — sẽ
    thành hai lần mở.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    Sửa lan 2026-10-13: khoá an10.37:1.3 — trước là danh sách mười căn cứ bị đảo thứ tự và sai thuật
    ngữ (*gọi phi vinh là vinh pháp, gọi vinh là phi vinh*; *gọi điều Thế Tôn đã nói là điều Ngài
    chưa nói* — đảo vế đầu của cặp `abhāsitaṁ alapitaṁ … bhāsitaṁ lapitaṁ`; `anāciṇṇaṁ … āciṇṇaṁ` bị
    dịch thành *Tathagata chưa tuyên thuyết* thay vì *chưa thực hành*) → dùng lại nguyên văn
    `an10.41:1.3`: *gọi phi luật là luật, gọi luật là phi luật, gọi điều Thế Tôn chưa nói là điều
    Thế Tôn đã nói, … chưa thực hành … đã thực hành, … chưa quy định … đã quy định*. Căn cứ: Pāli
    `an10.37:1.3` trùng nguyên văn Pāli `an10.41:1.3` (cũng `an10.42:1.4`, `an10.39`);
    `avinaya`/`vinaya` → *phi luật/luật* theo `an10.41:1.3`; `anāciṇṇa/āciṇṇa` = chưa/đã thực hành.
    Pāli của `an10.37:1.3` đối chiếu từng cụm với `an10.40:1.3` (danh sách đối xứng, không đảo). Ghi
    chú trên về `an10.38:1.3` vẫn đúng ở ý (cùng danh sách ở hai thái cực), nhưng chữ *vinh* trong
    `an10.38`/`an10.40` là cách dịch sai chưa sửa ở bài này. `an10.37:1.4` giữ nguyên (cụm
    `avakassanti apakassanti`/`āveni` không có căn cứ mới).
