notes: |-
  Sửa lan 2026-10-13: khoá an3.41:1.5 (Dakkhiṇeyyānaṁ), "đáng nhận vật bố thí đài các" → "đáng được cúng dường". Căn cứ: dakkhiṇeyya là "đáng được cúng dường"; "đài các" không có căn cứ trong Pāli. Cùng công thức, an5.203:2.4 và tầng đã dùng "đáng được cúng dường" cho dakkhiṇeyyo/dakkhiṇeyyānaṁ (kp6:6.3, sn1.33:13.2, an7.31:1.9, an4.34:5.4, dn33:2.3.43). Mô tả lỗi nhắc rājabhoggo, nhưng bài này không có từ đó. Ngoài lane, còn "đài các" ở an3.57:11.4, an3.70:10.4, an3.96:1.5 và an3.96:4.7.
