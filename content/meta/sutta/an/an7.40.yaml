  - >-
    **⚠ `an7.14:1.3` — ĐẢO THỨ TỰ so với tiền lệ, và đây là điểm phải giữ.**
    Cùng một danh sách ở `an10.16:1.3` kết bằng `saddhānusārī, dhammānusārī`;
    `an7.14` kết bằng `dhammānusārī, saddhānusārī` — **ngược lại**. Tôi dùng lại
    cách dịch từng mục nhưng theo đúng thứ tự của `an7.14`, nếu không hai bài sẽ
    trái nhau ở đúng chỗ cần khớp.
  - >-
    `an7.40` / `an7.41` — **cùng công thức nhưng khác ba chỗ**: `an7.40` nói *vị
    tỳ-kheo* và dùng `hoti` ở cả bảy mục; `an7.41` nói *người con gái Thích nữ
    Sa-ri-pút-ta* và chỉ mục cuối mới có `hoti`. `cittaṁ vase vatteti` → *điều
    khiển được tâm* / `no ca … cittassa vasena vattati` → *không bị tâm điều
    khiển* (0 tiền lệ). Sáu `…-kusala` dùng chung một khuôn trong **cả hai** bài
    — đúng, vì Pāli giống nhau và đã có tiền lệ ở `an6.24:1.3`.
  - >-
    `an7.60:1.3` — bảy pháp, dùng lại đúng từng vế đã `published`:
    `saddho`/`sīlavā` → *có tín chân / có giới* · `bahussuto` → *đa văn* ·
    `paṭisallīno` → *chuyên cần* · `āraddhavīriyo` → *sống với tinh tấn đã được
    khởi động* · `satimā` → *có niệm* · `paññavā` → *có tuệ*.
  - >-
    `an7.85:1.1` — `bhinno` → *bậc chứng ngộ trọn vẹn* (0 tiền lệ) · `bhinna` →
    *đã phá vỡ*. `Katamesaṁ sattannaṁ?` hỏi *bảy trong số ấy* chứ không phải
    *thế nào là bảy*, nên dịch khác `Thế nào là bảy?` (đúng như `an7.92:1.2` ở
    PR #121).
