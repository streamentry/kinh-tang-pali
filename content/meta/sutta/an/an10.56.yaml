notes:
  - >-
    **Bài ngắn nhất chương (8 segment) nhưng dịch gần như nguyên văn một bài đã
    `published`**: `an10.237:1.3` (bài trong `Rāgapeyyāla`) có **cùng Pāli** —
    `Asubhasaññā, maraṇasaññā, āhāre paṭikūlasaññā, sabbaloke anabhiratasaññā,
    aniccasaññā, anicce dukkhasaññā, dukkhe anattasaññā, pahānasaññā,
    virāgasaññā, nirodhasaññā—` — nên tôi dùng lại nguyên văn mười mục.
    `saññā` ở đây dịch là **niệm tưởng**, theo `an10.237:1.3`, **khác**
    `an4.34:1.3` và `an5.32:3.1` dùng *tưởng* cho dạng tính từ `saññino`. Vì hai
    tiền lệ đều có và khác nhau, tôi theo tiền lệ **đúng cấu trúc danh sách niệm
    tưởng**, và ghi lại sự phân biệt này.
    `amatogadhā amatapariyosānā` → *chìm đắm trong vị bất tử, với bất tử làm cứu
    cánh* và `mahapphalā … mahapphalā … mahānisaṁsā` → *thành quả to lớn và lợi
    ích to lớn* theo `an5.61:1.1` (đã `published`).
  - >-
    **`Sacittavagga` → *Phẩm Tâm Mình*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *Your Own Mind*, và cả phẩm nói đúng một việc — soi lại
    **tâm mình** (`sacittapariyāyakusala`). Tên bài `Sacittasutta` → *Kinh Chăm
    Chính Tâm Mình*.
    **`Sacittavaggo paṭhamo` ở `an10.60:15.5` dịch là *Phẩm Tâm Mình, thứ
    nhất*** — đây là **số thứ tự của chính Bilara đánh số lại**, vì phẩm này rõ
    ràng là thứ sáu trong Bộ Mười (đúng như `6.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
