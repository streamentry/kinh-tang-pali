    `Bodhisaññā` → hai bài *Bojjhaṅgasutta* (`an7.26`) + *Saññāsutta* (`an7.27`) ·
    `dve ca hāni` → hai bài *parihāni* (`an7.28`, `an7.29`) · `vipatti` → `an7.30` ·
    `parābhava` → `an7.31`. Tôi dùng lại **nguyên văn tiêu đề đã `published`** của
    `an7.26` (*Giác Chi*, 709 lần trong tầng), `an7.27` (*Các Tưởng*) và `an7.28`
