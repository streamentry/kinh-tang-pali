  - >-
    **Bất định 1 — `sambhavā` ↔ `parābhavā` (khoá `1.1`, `1.2`, `1.11`, `0.3`, `10.4`).**
    Tôi dịch `parābhavā` → **sa đọa** và `sambhavā` → **thành tựu**. Lý do: `parābhava`
    đã có 12 tiền lệ dịch *sa đọa* trong tầng này (`snp1.6`), còn `sambhavā` đứng đối
    xứng với nó nên *thành tựu* là cặp tự nhiên, và `an7.30` đã chốt `sampadā` → *thành
    tựu* cho đúng ô trống song song. **Cách đọc thay thế:** `sambhavā` nghĩa gốc là
    *nguồn gốc, nguyên nhân*, nên có thể dịch *bảy nguyên nhân thành tựu*; và `parābhava`
    trong Sujato là *downfall* chứ không phải *hell*, nên *sa đọa* có thể nặng hơn dàn
    ý. Cả hai đã ghi ở đây, không giấu trong thân kinh.
  - >-
    **Bất định 2 — siêu ngữ vị `1.7` + `1.8`.** Pāli `pasādabahulo hoti,` đứng riêng ở
    `1.7`, còn tân ngữ `bhikkhūsu theresu ceva navesu ca majjhimesu ca` lại đứng đầu
    `1.8` — tức tân ngữ đứng **sau** động từ. Sujato tách `1.7` thành *very confident…*
    và đẩy *fault-finding mind* sang `1.8`, tức coi cụm tân ngữ là bổ nghĩa cho **cả**
    mục 4 và mục 5. Tôi dịch theo đúng cách đó: `1.7` *lòng tin … rất đậm đà*, `1.8`
    mở đầu bằng *đối với các vị tỳ-kheo bậc trưởng lão, bậc mới và bậc vừa*, rồi mới
    *nghe pháp không với tâm bực bội*. Cách này giữ được cả hai quan hệ. Nhưng nó **lệch
    vị trữ** với Pāli, nên người đọc bốn cột thấy `1.8` mở đầu bằng tân ngữ — đã ghi
    rõ ở đây.
  - >-
    **Bất định 3 — `pubbakāraṁ` (`1.10`, `4.3`, `8.3`).** Pāli không nêu tân ngữ (vật thể
    không tường), `karoti` chỉ là *làm*. Tôi dịch **tôn trọng trước ở đây / ở bên kia**,
    dựa vào nghĩa cặp `dakkhiṇeyyaṁ … gavesati` + `pubbakāraṁ karoti` trong chính bài
    (tức ưu tiên làm việc với họ trước) và theo Sujato *serve … first*. Tiền lệ
    `an5.175:2.7` dịch cùng công thức là *và dâng vật bố thí ở đây trước*, nhưng ở đó
    `pubbakāra` gắn với hành động cho bố thí nên mới dịch được cụ thể. Đây là khoá mỏng
    nhất của bài.
  - >-
    **Bất định 4 — kệ uddāna `10.1`–`10.4`.** Đây là kệ gợi nhớ tên các bài trong phẩm
    `an7.21`–`an7.31`, không phải văn xuôi. Tôi ánh xạ theo tiêu đề Pāli từng bài:
    `Sāranda` → `an7.21` *Sārandadasutta* · `vassakāro` → `an7.22` *Vassakārasutta* ·
