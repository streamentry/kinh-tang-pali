  Khoá 1.3: paggāha thành nỗ lực (0 tiền lệ ở cặp này; theo Sujato Exertion; cố ý tránh chữ tinh tấn vì tầng Việt đã dùng tinh tấn cho viriya và ātappa). avikkhepa thành không tán loạn (27 tiền lệ).
  Bản Anh Sujato đã ghim có đủ mọi khoá của bài; tầng Việt hiện hành không có Tăng Chi Bộ (bilara chỉ chứa Pháp Cú) nên đối chiếu Pāli + Anh.
  Tiêu đề Kinh Nỗ Lực là tên mô tả do người biên tập đặt; 0 tiền lệ, ghi rõ ở đây.
