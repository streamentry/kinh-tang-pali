notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `9. Sativagga` → «9. Phẩm Niệm». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `1.1`–`1.7`, `1.9`–`1.11`, `2.1`–`2.7`, `2.9`–`2.11` (công thức `hatūpanisaṁ` / `upanisasampannaṁ`) — «người thiếu X đã hủy hoại điều kiện thiết yếu cho Y» → «người hư hoại X đã hủy hoại nền tảng của Y»; «người đầy đủ X đã làm viên mãn điều kiện thiết yếu cho Y» → «người viên mãn X đã đầy đủ nền tảng của Y»; «như thật tri kiến» → «sự thấy biết như thật»; «yểm ly và ly tham» → «sự chán ngại và ly tham»; «tri kiến giải thoát» → «giải thoát tri kiến». Lý do: `vipanna` là «hư hoại», không phải «thiếu»; công thức này ở an6.50, an5.24, an10.3, an11.5… (124 khoá mang `upanis-`) dùng «nền tảng», còn «điều kiện thiết yếu» chỉ có ở bài này (9 khoá). Giữ «sự phòng hộ các căn» (42 nơi) và «giới hạnh» vì thuộc tiền lệ khác của bài, không phải thuật ngữ của công thức.
