notes:
  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.2 giữ nguyên (khớp 3.2; bản
    modal thật ra là 1.9). Sửa 1.9, cùng Pāli «tatra tatreva sakkhibhabbataṁ
    pāpuṇiṁ sati sati āyatane» với 2.2 và 3.2: bỏ mệnh đề «đối với bất cứ pháp
    nào …, khi Ta hướng tâm …» và dời lên 1.8, nơi Pāli có yassa yassa
    abhiññāsacchikaraṇīyassa dhammassa cittaṁ abhininnāmesiṁ; nhờ vậy ba khoá
    1.9, 2.2, 3.2 dùng cùng một câu.
