notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu Bhikkhu Sujato tại cùng commit.
  **Nhãn thứ tự `Sattamaṁ.` ở `12.7` KHÔNG đếm các khối của chính bài** (bài này có 12 khối). Đo cả
  chuỗi `an6.55`–`an6.64`: Paṭhamaṁ · Dutiyaṁ · Tatiyaṁ · Catutthaṁ · Pañcamaṁ · Chaṭṭhaṁ ·
  Sattamaṁ · Aṭṭhamaṁ · Navamaṁ · Dasamaṁ — đúng mười bài, không thiếu không trùng, và
  `an6.64:14.4` `te dasāti` (đó là mười bài ấy) khớp đúng mười. `an6.61` là bài thứ bảy trong chuỗi
  đó, nên “Thứ bảy.” là đúng chữ Pāli. Chuỗi kế tiếp `an6.65` lại mở đầu bằng `Paṭhamaṁ.`, và
  `an6.75`, `an6.85` cũng vậy: nhãn đếm trong từng chuỗi mười, không đếm toàn phẩm. Nhãn nằm ở
  CUỐI bài chứ không ở khối mở đầu như phần lớn `an1`; tôi giữ đúng vị trí Pāli, không dời.
  **Tên bài `0.3` = “Kinh Giữa Chừng”.** Lý do: `an6.64:14.3` (đã published) dịch chữ `Majjhe` trong
  uddāna của chính Phẩm Đại thành “Giữa chừng”, và đó là con trỏ trực tiếp tới bài này — tôi giữ
  một tên cho một bài. Sujato dịch tiêu đề là “In the Middle”; nếu biên tập muốn “Kinh Ở Giữa” thì
  phải sửa cả `an6.64:14.3` cùng lúc, nếu không sẽ có hai tên cho một bài.
  **Coverage Anh trên Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): mẫu số 41/41.** Bhikkhu Sujato
  37/41; chỗ trống đúng là `4.3`, `5.3`, `6.3`, `7.3` (bản đã ghim lược mấy vế đó), và lớp lấp
  `english-project` của dự án đã lấp đủ 4 khoá ở trạng thái published ⇒ 41/41 = 100%, trên ngưỡng
  0.8. Tầng Việt hiện hành vắng hoàn toàn (0/41): tại commit đã ghim bản Việt chỉ phân phối Pháp Cú.
  Vì 4 khoá kia chỉ được đối chiếu với bản lấp English mà `content/meta/en/an/an6.61.yaml`
  cũng ghi `assessed_by: OpenCode Space Bunny Free (agent)` — tức cùng một công cụ với bản Việt này —
  nên bản lấp KHÔNG phải một lớp đọc Anh độc lập; `triangulation` hạ xuống
  8.8 và bài KHÔNG được tuyên bố là đã đối chiếu English độc lập cho toàn bộ.
  **17 khoá có Pāli trùng nguyên văn ở bài khác; 15 khoá trong đó bài khác đã có bản Việt. Tôi dùng
  lại nguyên văn 13 khoá, viết riêng 2 khoá** vì bản sẵn có khác nhau. Nguồn: `0.2` = `an6.59:0.2`;
  `1.1` = `an6.1:1.1`; `1.3` = `sn41.1:1.2` và `sn56.30:1.2` (chỉ có một dạng Việt cho đúng chuỗi này);
  `3.2`/`4.1`/`5.1`/`6.1`/`9.1` = `an6.28:2.1`; `9.3` = `an3.21:8.3`; `9.4` = `an3.21:8.4`;
  `12.1` = `an10.134:1.2`; `12.3` = “Đức Phật nói:”; `12.7` = “Thứ bảy.”.
  **Hai khoá tôi viết riêng, ghi ra đây để biên tập chọn.** `9.2` trùng byte `an3.21:8.2` (dịch
  “theo tài ứng tài riêng của mình”, hơi nặng) và `mn32:10.2` (dịch “theo điều mình thấy thích
  hợp”); tôi lấy cách diễn đạt của `mn32:10.2` nhưng giữ cách gọi `āvuso` của phẩm (này các bạn)
  cho khớp năm vị trong chính bài. `1.2` không có bản nào trùng byte; tôi ghép “trú ở” (theo
  `an6.59:1.2`, `an6.28:1.1`) với “tại vườn nai Isipatana” (4/8 khoá có `bārāṇasiyaṁ viharati`).
  **Kiểm dấu nháy: 54/56 khoá khớp Pāli từng khoá; 2 khoá lệch CÓ CHỦ ĐÍNH — `1.4` và `10.5`.**
  Pāli không có dấu nháy quanh tên bài, tôi thêm `‘…’` vì ba bản Việt đã có cho đúng công thức
  `sandhāya bhāsitaṁ pārāyane …pañhe` (`an3.32:5.1`, `an3.33:3.4`, `an4.41:5.10`) cũng thêm vậy.
  Mọi `’` trong Pāli bài này đều là nháy đóng như đã đếm; không có nháy sở hữu nào. Nếu biên tập
  muốn khớp tuyệt đối thì bỏ hai cặp nháy ấy.
  **Trong chính bài có 8 nhóm Pāli trùng byte; bản Việt giống nhau trong cả 8 nhóm, 0 nhóm lệch.**
  `4.4` `5.4` `6.4` `7.4` khác nhóm bốn khoá chỉ bởi hai dấu phẩy, `12.6` khác bằng cách xưng hô
  (`bhikkhave` thay cho `āvuso, bhikkhu`); dùng chung một cách dịch vì khác biệt không mang nghĩa.
  **Dấu lược: Pāli bài này không có `…`, `…pe…` hay `(…)` ở khoá nào (0/56), bản Việt cũng không
  (0/56)** ⇒ không có gì để nén hay mở rộng. Sujato ở `4.4`–`7.4` dùng lược riêng của mình và để
  trống `4.3`–`7.3`; tôi dịch đủ cả vế, không theo lược ấy.
  **Số Pāli, tự tính.** `cha` = 6 → “sáu” (7.2 dùng hai lần: sáu nội xứ, sáu ngoại xứ) ·
  `eko anto` = một bên, `dutiyo anto` = bên thứ hai (mỗi cách 8 khoá) · `Sattamaṁ` = satta bảy cộng
  dấu thứ tự → thứ bảy · `6.61` và `6.` ở hai khoá tiêu đề giữ nguyên. Bài không có số lớn nào
  (không sahassa, sata, kappa, tiṁsa) nên không có chỗ nào phải ghi bất định số.
  **Thuật ngữ, đếm trên tầng trước khi chốt.** `abhiññeyya` → “thắng tri” 63/63 khoá, không có
  cách thứ hai · `pariññeyya` → “liễu tri” 6/8, hai chỗ lệch đều là thông tục riêng ·
  `diṭṭheva dhamme` → “ngay trong hiện tại” 213/512, còn “hiện pháp” chỉ 5/512 · `sakkāyo` →
  “hữu thân” (31 khoá; “thân kiến” ở `an4.33` và “thân” ở `sn22.105` ít hơn) ·
  `ajjhattikāni āyatanāni` → “nội xứ” 34 khoá, `bāhirāni āyatanāni` → “ngoại xứ” 41 khoá ·
  `Sattamaṁ.` → “Thứ bảy.” 236/240 khoá (tầng lấp English dùng “Seventh.” 6 khoá với 13 dạng
  nhãn thứ tự, mỗi dạng một cách; tôi theo khuôn của tầng Việt, không theo khuôn English) ·
  `āvuso` → “này các bạn” / “này hiền giả” theo `an6.28` và `an6.41` · `Evamāvuso` →
  “Thưa vâng, này hiền giả” (`an6.41:1.6`) · `Evaṁ, bhante` → “Thưa vâng, bạch Thế Tôn” (đa số
  trong `an6`). `sibbinī` → “bà thợ dệt”: 0 tiền lệ trong tầng (6 khoá có chữ “thợ dệt”, không
  khoá nào là `sibbinī`), lấy theo Sujato “seamstress”.
