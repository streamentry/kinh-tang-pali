notes: |-
  Dịch từ Pāli root tại commit đã ghim, đủ 69/69 khoá, không khoá nào ngoài tập Pāli.

  COVERAGE ANH ĐO THẬT: mẫu số = khoá Pāli có nội dung (>= 40 ký tự, bỏ khối 0.x) = 31; `english-sujato` phủ 31/31 = 1.000 (ngưỡng 0.8 trong `source/layers.yaml`). Không có tệp lấp `english-project` cho bài này nên số trên hoàn toàn là Sujato độc lập, không lẫn bản của dự án. Tầng `vietnamese-current` không có trong store (bilara tại commit đã ghim chỉ có Pháp Cú); bản Hòa thượng Thích Minh Châu của bài này chỉ được đọc như tra cứu toàn văn nguyên bài, không phải cột phân đoạn. Vì thế `reference-gaps.yaml` không cần entry.

  TIỀN LỆ ĐO TRƯỚC KHI CHỌN:
    · 0.1: `Kinh Tăng Chi Bộ 10.119` theo đa số tầng an (khoảng 150 khoá an10 so với 23 dạng `Aṅguttara Nikāya`); các bài anh em 113/114/116/118/120/121/122 dùng dạng sau, 117 dùng dạng đầu.
    · Tên phẩm: `12. Phẩm bước xuống` (8 khoá trùng Pāli, 8/8 cùng cách dịch). Tiêu đề: `Kinh bước xuống (Một)` theo đúng khuôn của an10.120 `Kinh bước xuống (Hai)` (Paṭhama/Dutiya).
    · `bho gotama` -> `Tôn giả Gotama` (595 so với `ông Gotama` 146 trên toàn tầng); `Bhagavā etadavoca` -> `Đức Phật nói:` (109 so với `Đức Thế Tôn nói:` 23); `Evaṁ, bho` -> `Thưa vâng, Tôn giả`.
    · `ariyassa vinaye` -> `trong giới luật của bậc Thánh` (32; `trong luật của bậc Thánh` 18, `trong đạo của bậc Thánh` 13).
    · `tadahuposathe` -> `vào ngày trai giới` (`trai giới` 30 khoá trong bộ an, các dạng khác thấp hơn).
    · `micchāñāṇa` -> `tà trí` (20 khoá; `tà tri` 9; `tri kiến sai` 1). Bài an10.117 và an10.120 cùng phẩm dùng `tà tri` / `tri kiến sai`; tôi chọn đa số toàn tầng và ghi lại chỗ lệch này.
    · `sappi` -> `bơ lỏng` (23), `navanīta` -> `bơ tươi` (8), `agyāgāra` -> `phòng lửa` (mn75), `santappeti` -> `làm thỏa mãn`.
    · Pāli trùng nguyên văn trong bài: 1 nhóm 10 khoá (`diṭṭhe ceva dhamme abhisamparāyañcā’ti`), cả 10 bản Việt giống hệt; công thức nhắc lại `micchā-X … pajahati / paccorohati` mười lần, mỗi lần khác thuật ngữ nên bản Việt khác đúng chỗ cần khác.
    · Dùng lại nguyên văn đã có: `Vị ấy suy xét như vậy rồi từ bỏ tà kiến;` (an10.120), `ngay trong đời này và trong đời sau.’`, `Vậy thì, này bà-la-môn, hãy lắng nghe và chú tâm kỹ`, `Tuyệt vời thay, thưa Tôn giả Gotama! …`, `Xin Tôn giả Gotama ghi nhận con là cư sĩ, từ hôm nay trở đi, trọn đời quy y.`, `Thứ bảy.`

  DẤU LƯỢC: khoá 16.3 có `…pe…` -> giữ đúng một `…`. Chín khoá 7.1 đến 15.1 mở đầu bằng `…` trần của tầng Pāli ghim, bản Việt giữ `… ‘` ở đúng chỗ đó. Không khoá nào có `(…)`. Dấu nháy đơn và nháy kép khớp Pāli từng khoá, 0 lệch trên 69 khoá. NFC sạch, không khoá rỗng, không khoảng trắng thừa. Không có số Pāli nào cần tính ngoài `soḷasiṁ` = một phần mười sáu (`kalaṁ nāgghati soḷasiṁ`, tiền lệ: tam-minh).

  BẤT ĐỊNH ĐÃ PHÂN XỬ, KHÔNG THÊM VÀO THÂN KINH:
    (1) `paccorohaṇī` dịch `bước xuống` / `lễ bước xuống` cho nghi thức bà-la-môn, theo đúng sự nhất quán với an10.120 và Sujato `ceremony of descent`; Hòa thượng Thích Minh Châu dịch `xuất ly` cho phần bậc Thánh và `lễ đi xuống` cho phần bà-la-môn, nghĩa là cùng một từ Pāli bị tách đôi ở đó. Tôi giữ một từ Việt xuyên suốt vì Pāli dùng một từ. Nghĩa nghi thức chính xác của việc `đi xuống` không được kinh nói rõ.
    (2) `paccorohāma bhavantaṁ` (3.4): `bhavantaṁ` ở đối cách nên dịch `đến ngài`, theo Hòa thượng Thích Minh Châu; Sujato đọc như lời gọi (`We descend, lord!`). Hai cách đọc khác nhau ở chỗ có hay không có đích đến.
    (3) `antarā ca velaṁ` (3.2): `vela` được Sujato hiểu là ranh giới, Hòa thượng Thích Minh Châu hiểu là cát. Tôi chọn `ranh giới` theo Sujato; chưa phân xử được bằng bằng chứng độc lập trong tầng.
    (4) `khomayugaṁ` -> `bộ áo lanh mới` (0 tiền lệ trong tầng; Sujato `a new pair of linen robes`, Hòa thượng Thích Minh Châu `đôi áo lụa mới`). `khoma` là vải lanh hoặc gai nên chọn `lanh`, không chọn `lụa`.
    (5) `allakusa` -> `cỏ kusa tươi`, `haritehi kusehi` -> `cỏ kusa xanh` (Hòa thượng Thích Minh Châu `ướt` và `xanh`).
    (6) `kiṁ nvajja brāhmaṇakulassā` (2.4): nghĩa đen `hôm nay dòng họ bà-la-môn có việc gì`; Sujato `What’s going on today with the brahmin clan?` Hòa thượng Thích Minh Châu `Có phải hôm nay là ngày của gia đình Bà-la-môn?`. Chọn nghĩa đen, câu trả lời ở 2.5 khớp.
    (7) Khoá 6.2 trong Pāli không có dấu gạch ngang cuối khoá còn 7.1 trở đi có; bản Việt theo đúng từng khoá.

