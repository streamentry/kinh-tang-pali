notes: |-
  Sửa lan 2026-10-13: khoá `an3.53:1.3` và `an3.53:4.3` (công thức `sandiṭṭhiko dhammo hoti akāliko ehipassiko opaneyyiko paccattaṁ veditabbo viññūhī`): *không hề thời hạn* → *không thời hạn* cho `akāliko`. Căn cứ: *hề* không có trong Pāli; cùng công thức đã được sửa thành *không thời hạn* ở `an11.13:7.2` và `an11.11:4.2`. Tiền lệ đo trên 50 khoá chứa `akāliko`: *không thời hạn* 11 khoá, *không có thời gian* 12 khoá, *không hề thời hạn* 14 khoá trước lượt sửa lan này (gồm hai khoá của bài này). Điểm số giữ nguyên.
