notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim (`11c9d708978cde8ba61096d8a75f7ddfb846f639`), bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  - |-
    **Bài gộp `an2.42-51`; tôi dịch riêng 18 khoá `an2.48:*` và căn vào chín bài anh em đã có trong tầng.** Công thức `“Dvemā, bhikkhave, parisā. / Katamā dve? / Ayaṁ vuccati … / Imā kho, bhikkhave, dve parisā. / Etadaggaṁ …` dùng lại nguyên văn từ `an/an2.42:1.1`, `:1.6`, `:2.3`, `:2.4`, `:2.5` (bản dịch tốt nhất trong loạt). Tôi **không** theo `an/an2.49` và `an/an2.50`, vì hai bài đó viết thường chữ thường và để `(…)` đứng một mình ở `1.6`/`2.3` — đúng loại lỗi mà bài này không nên có.
  - |-
    **Đoán ngữ nghĩa lớn nhất của bài, tôi ghi rõ để người đọc kiểm được.** `āmisagaru parisā no saddhammagaru` → *hội chúng trọng vật lợi mà không trọng Chánh Pháp*. `garu` là *nặng, tôn trọng* — tầng đã có `saddhammagaruno` → *tôn trọng Chánh Pháp* (`sn/sn6.2:9.1`, `an/an4.21:10.1`), và `mn70:26.1` dịch `āmisagaru` là *màng đến tài vật*. `āmi` ở đây không phải *thịt* như bản Anh (*things of the flesh*) mà là **vật lợi**, vì chính `1.7` nói rõ: các vị khen nhau trước mặt cư sĩ để *được lợi* (`lābha`). Tôi chọn *vật lợi*; nếu người biên tập ưu tiên theo bản Anh thì phải đổi cả `1.3`, `1.4`, `1.9`, `2.1`, `2.6`, `2.8` cho khớp.
  - |-
    **Danh sách khen trong `1.6` và `2.3` dùng lại nguyên văn từ các bài đã có** chứ không tự dịch lại: `ubhatobhāgavimutto` → *giải thoát hai phần*, `paññāvimutto` → *tuệ giải thoát*, `kāyasakkhī` → *thân chứng*, `diṭṭhippatto` → *đạt kiến*, `saddhāvimutto` → *tín giải thoát*, `dhammānusārī` → *tùy pháp*, `saddhānusārī` → *tùy tín* (theo `dn33:2.3.44`; `an/an10.16:1.3` dùng *chứng thân / đạt kiến* cho hai khoản giữa — đây là **chỗ lệch có sẵn trong tầng**, người biên tập nên chọn một). `sīlavā kalyāṇadhammo` / `dussīlo pāpadhammo` → *có giới hạnh thiện pháp* / *ác giới ác pháp* theo `mn142:10.2` và `mn142:11.2`.
  - |-
    **`gathitā mucchitā ajjhopannā anādīnavadassāvino anissaraṇapaññā` ở `1.8` và phủ định của nó ở `2.5`.** Tôi theo `mn26:32.1` → *trong trói buộc, trong say mê, trong bám chặt, không thấy nguy hại, không hiểu lối thoát*, và đảo thành *trong không trói buộc, trong không say mê, trong không bám chặt, có thấy nguy hại, hiểu lối thoát* cho `2.5` — `agathitā amucchitā anajjhosannā ādīnavadassāvino nissaraṇapaññā`. Phủ định được giữ ở **năm** chỗ, không chỉ một, vì đó là ý nghĩa của cặp `gathita`/`agathita`.
  - |-
    **Đo tầng Anh — và một chỗ tôi phải nói thẳng là khác với bản đo trước.** Bài này **CÓ** bản Anh Sujato đầy đủ tại commit đã ghim: `translation/en/sujato/sutta/an/an2/an2.42-51_translation-en-sujato.json` có mặt trong `source/upstream-manifest.json` và có prose ở **18/18** khoá; coverage đo bằng chính `englishCoverageFor` của repo là **12/12 = 100%**. Tôi đã đối chiếu lại từng khoá Anh với Pāli (xem `E:` trong bản đối chiếu) và bản Anh khớp cấu trúc, chỉ khác chỗ dịch `āmisagaru` thành *things of the flesh* như đã nói ở trên. Vì vậy tôi **không** ghi blocker cho bài này. Người điều phối nên sửa lại danh sách đo trước nếu đó là điều kiện của cổng.
