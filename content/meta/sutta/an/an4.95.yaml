notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá :4.1 — chuỗi `khīra → dadhi → navanīta → sappi → sappimaṇḍa` “sữa → sữa đông → bơ tươi → bơ kỹ lưỡng → phần tinh túy của bơ kỹ lưỡng” → “sữa → sữa đông → bơ → bơ lỏng → tinh chất bơ” (dùng lại chuỗi của sn34.1:1.9, sn34.2:1.9, sn34.19:1.9, dn9:52.1; “bơ kỹ lưỡng” không tương ứng `sappi`). Bản “modal” của khoá này (an5.181:2.1, an5.190:2.1: “sữa → bơ → bơ lỏng → bơ trong → bơ tinh túy”) bỏ mất `dadhi` và lệch cả chuỗi nên không dùng. Giữ “được xưng là tối thượng” (nhất quán với :4.2).
  Quét lan khoá :2.1 (khoá không thuộc danh sách lệch): thêm dấu lược `(…)` của Pāli ở cuối `na araññe (…)` và đổi dấu chấm cuối thành dấu chấm phẩy theo Pāli; khoá cũ thiếu dấu lược nên số dấu lược lệch so với Pāli.
