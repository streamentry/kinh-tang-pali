notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh Sujato trên Pāli có nội dung: 28/28 = 100%**, không khoá nào bị bỏ trống, không cần ghi nhận gap. Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708: bilara chỉ phân phối 26 tệp tiếng Việt và toàn bộ là Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo. `budsas.org` chỉ là tra cứu toàn văn, không dựng cột.
  **Bài song song là `an11.3` ngay trước trong phẩm: 19 khoá trùng byte-for-byte (302 cặp); 17 cặp dùng lại NGUYÊN VĂN.** Toàn bộ chuỗi `2.2`–`2.10` và `4.2`–`4.10` dùng đúng lời của `an11.3:1.2-1.10` và `:3.2-3.10`; `3.3` và `5.3` dùng lại lời có dấu lược của `an11.3:2.3` và `:4.3`; `3.4` dùng lại `an11.3:2.4`.
  **Ví dụ cây `3.1` và `5.1` trùng byte-for-byte `an10.4:1.5` và `an10.4:2.4` (2 bản) — dùng lại nguyên văn.** Ba khoá này có hai `…` trần trong Pāli (`tacopi … pheggupi …`) nên bản Việt giữ hai `…`. Với `pheggu` tôi theo an11.3 và dịch *phần mềm*.
  **2 khoá cố ý dịch khác, ghi lý do.** `1.2` (`āvuso bhikkhave`) trùng 12 bản và `1.3` (`Āvuso'ti … paccassosuṁ`) trùng 9 bản, đang chia làm ba cách: *này các bạn*, *này các vị tỳ-kheo*, *Kính bạch Tôn giả*. Tôi chọn *hiền giả* cho cả hai vì `āvuso` đã được 1.873 lần trong tầng và chính `an10.4`–`an10.5` (bài có đúng hai câu ví dụ cây tôi dùng lại) cũng viết *Này các hiền giả*. Giữ nhất quán với `an9.37` trong cùng lát.
  **Dùng lại nguyên văn các cặp còn lại:** `0.2` theo 4/4 bản (1. Phẩm Nương Tựa) · `1.1` trùng 12 bản theo `an10.52:1.1` · `1.4` theo `an10.52:1.4` · `5.5` theo 138/231 bản cho `Catutthaṁ.`
  **Thuật ngữ — cùng bộ với `an11.3` để phẩm không tự mâu thuẫn.** `dussīla`/`sīlavipanna` → phạm giới, giới hư hoại · `hatūpanisā hoti` → nền tảng của X đã bị hủy hoại · `upanisasampannaṁ hoti` → nền tảng của X đã đầy đủ · `avippaṭisāra` → không hối tiếc · `sammāsamādhi` → chánh định · `saññī`/`asaññī` không dùng ở bài này. `0.3` `Dutiyaupanisāsutta` dịch *Kinh Nền Tảng Thứ Hai* theo `an11.3:0.3` (*Kinh Nền Tảng Thứ Nhất*).
  **Bất định đã ghi.** `Seyyathāpi` tôi dịch *ví dụ như* theo `an10.4`; `rukkho sākhāpalāsavipanno` là *bị mất cành lá và tán lá* theo đúng lời đã công bố ở `an10.4`, dù Sujato chỉ nói *lacked branches and foliage* — tôi theo bản Việt đã có để hai bài dùng chung một hình ảnh.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
