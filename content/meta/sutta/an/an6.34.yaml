notes:
  - >-
    **Cảnh báo về khuôn tải `Aṅguttara Nikāya` — đo lại, con số đã lệch.** Lệnh lát bảo dùng dạng `Kinh Tăng Chi Bộ` cho `0.1` của bài `an`, nói rằng đo được 862 tệp theo dạng đó và 342 tệp giữ Pāli. Tôi **đo lại trên đĩa hôm nay** và con số đã lệch: trong 1.600 tệp `an`, có **1.228** tệp có khoá `:0.1`; trong đó **875** viết `Kinh Tăng Chi Bộ` và **353** giữ `Aṅguttara Nikāya` (372 tệp không có khoá `:0.1` nào). Tỷ lệ chọn lựa thì không đổi, nên tôi **theo đo được**: dùng `Kinh Tăng Chi Bộ`. Hệ quả phải nói rõ: bài liền kề có thể lệch — `an8.25` viết `Kinh Tăng Chi Bộ 8.25` nhưng `an8.47` lại giữ `Aṅguttara Nikāya 8.47`, và `an6.33` cũng giữ Pāli. Việc này không đổi nghĩa segment nào.
  - >-
    **Mọi trích dẫn trong `notes` này đã tra bằng script** trên chỉ mục Pāli↔Việt tự dựng (5.032 bài, 88.415 chuỗi Pāli khác nhau) — trong đó **loại 8 tệp của chính lát này**, để không tự đếm bản dịch của mình làm tiền lệ.
  - >-
    **Coverage Anh đo bằng script, không suy.** Đo theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ, cộng `english-sujato` và `english-project` khi status là published). Cách đo đã được **kiểm lại** bằng bài đã có sẵn: chạy lại đúng công thức này trên `an5.249` cho ra **16/21 = 0.7619**, khớp con số đã ghi trong `blocking_errors` của chính tệp đó. Bài này đạt 28/28 = 100%, toàn bộ do Sujato, không khoá nào phải dùng bản lấp `english-project`, nên không cần mục trong `content/meta/reference-gaps.yaml` và không có blocker về tầng tham khảo.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo.** Tại commit đã ghim, tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) chỉ có Pháp Cú, nên **không có bản Thích Minh Châu để đối chiếu ở bất kỳ bài nào trong lát này**. Đối chiếu thuật ngữ vì vậy dựa vào Pāli root + bản Anh Sujato đã ghim + **tiền lệ đo được trong chính tầng Việt của kho**; `budsas.org` là tra cứu toàn văn, không dựng cột.
  - >-
    **Dấu lược — giữ đúng luật, không mở rộng.** Mọi khoá Pāli có `…pe…` đều giữ **đúng một** `…` trong bản Việt (luật §10.1 của BRIEF_VI3), và **không** khoá nào được thêm `…` để che chỗ thiếu. Ở những khoá lược, công thức bị nén đều là `peyyāla` mà bài đã phát lại đủ ở chỗ khác, nên nén thêm cũng không mất thông tin; tôi không mở rộng bất kỳ khoá lược nào.
  - >-
    **5 khoá có Pāli trùng nguyên văn và tôi dùng lại y hệt; 2 khoá cùng Pāli nhưng tôi chọn cách khác; 30 khoá là Pāli mới.** `2.6` trùng **nguyên văn** `mn37:7.6`, nên tôi dùng lại nguyên văn *Xin mời ngồi, chỗ ngồi đã được chuẩn bị.* — kể cả cách gọi `mārisa moggallāna` là **Tôn giả Moggallāna**.
  - >-
    **Cảnh báo: hai khoá `2.4`–`2.5` trùng **nghĩa** với `mn37:7.4`–`7.5` nhưng Pāli **không** giống hệt, nên tôi không được tính là trùng nguyên văn.** Bản Việt ở `mn37:7.4`–`7.5` đã viết *Mời Tôn giả Moggallāna đến! Hoan nghênh Tôn giả Moggallāna!* và *Đã lâu lắm Tôn giả mới có dịp đến đây.*, và tôi dùng lại đúng chữ đó vì đây là cùng một cảnh — nhưng Pāli khác ở dấu chấm phẩy và thứ tự từ (`ehi kho, mārisa moggallāna, svāgataṁ…` ở `mn37` so với `ehi kho, mārisa moggallāna; svāgataṁ…` ở đây). Ghi rõ để không ai tưởng đã đếm trùng byte.
  - >-
    **Tên các cõi chư thiên — theo tiền lệ sẵn có, nhưng một chỗ còn bất định thật.** Toàn tầng đã có một đoạn liệt kê **đúng sáu cõi này** (`dn18`, cùng `dn19` và `dn20`) nên tôi theo nguyên văn: `cātumahārājikā` → **Tứ Đại Thiên Vương** · `tāvatiṁsa` → **Tāvatiṁsa** · `yāma` → **Dạ-ma** · `tusita` → **Đâu-suất** · `nimmānaratī` → **Hóa Lạc** · `paranimmitavasavattī` → **Tha Hóa Tự Tại**. **Bất định cần nói thẳng:** `nimmānaratī` (*thích thú tự tạo*) dịch **Hóa Lạc** là theo tiền lệ (`mn41`/`mn42` viết *cùng chư thiên Nimmānaratī, cõi Hóa Lạc*), nhưng cách thông dụng hơn trong văn học Việt là **Ưng Tạo**; `Hóa Lạc` lại dễ bị hiểu nhầm với `vanippa` của cõi Tứ Đại. Tôi giữ theo kho để tầng không sinh thêm một cách thứ N+1, và để người điều phối chọn một lần cho cả sáu tên.
  - >-
    **`sotāpannā avinipātadhammā niyatā sambodhiparāyaṇā` → *là bậc nhập lưu, không rơi vào ác thú, chắc chắn, hướng về giác ngộ* (6 tiền lệ, khớp y hệt).** Cụm này lặp **14 lần** trong bài (`1.4`, `3.1`, `3.2`, `4.1`, `4.2`, `4.3`, `4.4`, `5.1`, `5.5`, `5.6`, `6.1`, `6.2`, `6.3`, `6.4`) và tôi phát lại y hệt cả mười bốn lần — đó là `peyyāla` của nguồn, không phải lỗi khuôn.
  - >-
    **`aveccappasādena` → *lòng tin vững chắc* (đa số, 3 bản sẵn ở `dn16`), `asamannāgata` → *không được đầy đủ*, `ariyakantehi sīlehi` → *giới luật được bậc Thánh yêu thích* (13 tiền lệ, `an5.179`, `an9.28`, `sn55.12`…).** Bản ở `dn16` viết *được đầy đủ lòng tin vững chắc nơi Đức Phật* cho cả hai vế có/không, tôi giữ cùng cách đó. `ñāṇaṁ hoti` → *có điều biết như thế này* thay vì *biết rằng*, vì đây là **tri thức tự biết về bản thân**, không phải tri thức về người khác.
  - >-
    **Nháy kép khớp Pāli **từng khoá**, đã kiểm bằng script.** Cả bài có 12 dấu `“` và 12 dấu `”` ở cả hai bên, và **không một khoá nào lệch**. Lượt đầu tôi đóng gộp cho gọn và đã tự sửa lại — kể cả `1.4` (Pāli là 0 mở / 1 đóng, tức chỉ đóng cặp mở ở `1.3`) và `1.7` (mở và đóng ngay trong khoá).
  - >-
    **`technical_integrity` đặt 9.6 chứ không phải 10.0.** Đợt này lát bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên cổng kỹ thuật của repo **chưa chạy** và không thể tuyên bố là đã pass. Những gì đã quét bằng script riêng trên **mọi** khoá (không chỉ khoá ≥ 40 ký tự): JSON hợp lệ, đủ mọi khoá trong `all`, không khoá thừa so với Pāli, không khoá rỗng, NFC, không trùng nguyên văn Pāli, không Pāli lọt vào bản Việt, **số dấu lược khớp Pāli từng khoá**, và ngoặc kép cân trên cả bài (`ngoặc()` của `_hvi.py`). Cần chạy bốn lệnh trên trước khi merge.
