notes:
  - >-
    **Bài song song với `an10.79`** — cùng mười vế, nhưng thêm `taṁ kutettha
    labbhā` và đảo vế kết. Vì cùng Pāli vế nào nên tôi dùng **cùng bộ hằng số**
    cho cả hai bài, để người đọc thấy hai bài là một cặp.
  - >-
    **`Ākaṅkhavagga` → *Phẩm Nguyện Cầu*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *If You Want*, và cả phẩm đúng một việc — *vị tỳ-kheo mong
    nguyện điều này, thì hãy làm điều kia* (`ākaṅkha` = mong nguyện).
    `Ākaṅkhasutta` → *Kinh Nguyện Cầu*.
    **`Ākaṅkhavaggo tatiyo` ở `an10.80:1.14` dịch là *Phẩm Nguyện Cầu, thứ ba***
    — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì phẩm này rõ
    ràng thứ tám (đúng như `8.` ở `0.2`). Tôi dịch theo Pāli vì Pāli là
    authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Khác biệt chữ trong Pāli, ghi lại vì người đọc tưởng là lỗi**:
    `an10.79:1.3` viết `acarī` còn `an10.80:1.3` viết `acari`; cùng nghĩa (thì
    quá khứ), nên tôi dịch giống nhau.
  - >-
    **Lỗi đảo chủ thể ở `1.3` và `1.6`** — xem ghi chú của `an10.79`: bản đầu
    tôi dịch *“tôi đắc tội”*, đúng ra là *“người ấy đã làm hại tôi”*. Đã sửa.
    **`1.8` là segment dài nhất chương** vì Pāli gộp **hai** vế vào một segment
    (vế cuối của nhóm yêu quý rồi vế đầu của nhóm không yêu quý). Tôi dịch đủ cả
    hai và nối bằng dấu chấm phẩy, không tách.
  - >-
    **`Ākaṅkhavaggo tatiyo` ở `1.14` là số thứ tự do Bilara đánh số lại** — xem
    ghi chú `VAGGA`.
    `2.0`–`2.4` là `Tassuddāna`, dịch theo 95 segment tiền lệ (*Tóm lược:*) và
    điểm danh đúng mười bài của phẩm: *Nguyện Cầu, Gai Nhọn, Điều Đáng Ưa, /
    Tăng Trưởng và Migasālā; / Ba Điều Pháp và Con Quạ, / Nigantha và hai bài
    Sân Hận.*
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
