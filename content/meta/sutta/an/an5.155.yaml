notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** Sáu khoá `2.2`, `3.2`, `4.2`, `7.2`, `8.2`, `9.2` bị cụt thành
  stub *Đây là pháp thứ hai …* v.v., mất vế `saddhammassa sammosāya antaradhānāya
  saṁvattati` và `saddhammassa ṭhitiyā asammosāya anantaradhānāya saṁvattanti`, và có
  dấu `…` bịa để che chỗ thiếu trong khi Pāli không có `…pe…`. Đã viết lại sáu khoá theo
  đúng văn bản của `1.5`/`5.2` và `6.5`/`10.2`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Hòa thượng Thích Minh Châu, và với bản Anh của Bhikkhu Sujato đã ghim (bài này có bản Anh upstream). 2 khoá bất đồng nghĩa → sửa 2 (5.1 và 10.1: cụm tri kỷ tưởng và tư duy, suy lường và quán sát pháp với tâm → dùng tâm suy tầm, suy xét và dùng ý quán sát pháp; cụm cũ không có nghĩa trong tiếng Việt và làm mất vế manasānupekkhanti, vì với tâm chỉ ứng với cetasā; Pāli cetasā anuvitakkenti anuvicārenti manasānupekkhanti, ba động từ và hai chỗ nương tâm và ý, và bản Anh lẫn bản nguyên bài đều giữ cả ba; cách dịch mới theo dn34:1.6.91 và an7.61:3.1 cho cùng cụm), giữ 1 nhóm (sammosa: bản dự án phai nhợt theo tiêu đề an5.154–156, bản nguyên bài hỗn loạn, bản Anh decline, cùng ý suy tàn), bất định 1 nhóm (1.4 và 6.4: kinh khất đàm cho suttaṁ theo quy ước hơn 30 khoá trong tầng, bản nguyên bài dịch Khế kinh; không đổi riêng một bài). Cụm tri kỷ tưởng còn ở an5.73:5.1 và an5.74:5.1, ngoài phạm vi, chưa sửa. Đối chiếu đã làm ở mức khoá với bản Anh và ở mức đoạn với bản nguyên bài.
