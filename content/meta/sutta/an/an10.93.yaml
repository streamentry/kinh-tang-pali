notes: |-
  Đợt 19, lát lane 34. Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (mục Tra cứu toàn văn, không phân đoạn). Tầng Việt hiện hành phân đoạn vắng ở commit đã ghim (chỉ có Pháp Cú). Bài dịch đủ 103/103 khoá, thứ tự khoá đúng thứ tự Pāli.

  **Coverage Anh Sujato trên Pāli có nội dung (khoá ≥ 40 ký tự, bỏ khối `:0`): 66/66 = 100%.** Sujato không để trống khoá nào thuộc mẫu số (chuỗi `8.3`–`8.8` và `11.3`–`11.8` có bản Anh nhưng Pāli chỉ `…` ngắn nên ngoài mẫu số). Không cần lớp `english-project`, không cần entry trong reference-gaps; cổng coverage đạt mà không dựa vào lớp lấp.

  **Chỗ bản Anh lệch Pāli, bản Việt theo Pāli:** `1.2` Sujato "in the middle of the day" cho `divā divassa`; bản Thích Minh Châu viết "buổi sáng thật sớm". Giữ "giữa ban ngày" theo tiền lệ của tầng (7/7 khoá: sn3.19, sn3.20, mn78, mn86, mn88, mn99 và an10.94). `1.5`/`1.7` Sujato nối hai vế bằng "as"; bản Việt giữ hai câu riêng đúng ranh giới khoá Pāli.

  **Bất định đã ghi, không thêm vào thân kinh:**
  - `9.6` (và 10.5, 11.12) `bhūtā saṅkhatā cetayitā paṭiccasamuppannā`: bốn tính từ liền nhau. Dịch "đã hiện hữu, hữu vi, do chủ ý tạo ra, do duyên khởi". `bhūta`+`saṅkhata`+`paṭiccasamuppanna` theo dn34:1.4.27 ("đã hiện hữu, hữu vi, do duyên khởi"; tầng không có tiền lệ khác cho đủ bộ bốn từ). `cetayita` (quá khứ phân từ của `cetayati`, "nghĩ, có ý định") không có tiền lệ đơn lẻ trong tầng (chỉ có dạng ghép `abhisañcetayita` ở mn52, mn121 dịch "được chủ ý tạo thành" / "do tư tạo tác"). Sujato dịch "chosen", bản Thích Minh Châu "do tâm suy tư". Bản này chọn "do chủ ý tạo ra" để giữ cả sắc thái cố ý lẫn tính được tạo ra; nghĩa không vì thế mà đổi, vì toàn chuỗi chỉ để nêu quan điểm là pháp hữu vi, vô thường.
  - `9.9` (10.8, 11.15, 13.3) `allīno` · `ajjhupagato`: "bám vào" · "chấp nhận". `allīna` theo mn35:21.2 ("bám vào khổ"); `ajjhupagata` không có tiền lệ trong tầng (0 khoá). Sujato "clings to and holds to", bản Thích Minh Châu "chấp trước, chấp nhận". Cặp từ này cùng nói một ý (dính chặt vào khổ), nên bản Việt giữ hai động từ khác nhau như Pāli mà không giải thích thêm.
  - `14.4` `tassa ca uttari nissaraṇaṁ`: "lối thoát vượt trên điều ấy". `uttari` là "xa hơn, vượt lên"; Sujato "the escape beyond that", bản Thích Minh Châu "sự xuất ly hơn thế nữa". `tassa` chỉ cái "khổ" vừa nói (khổ của pháp hữu vi); không dịch thêm tên đối tượng ngoài Pāli. Tầng có `nissaraṇaṁ yathābhūtaṁ pajānāti` → "hiểu đúng như thật lối thoát" (mn64, 5 khoá).
  - `9.2`/`10.1`/`11.1` `yvāyaṁ`/`yopāyaṁ ... āyasmā evamāha`: đại từ quan hệ treo (câu "đối với vị nào nói như sau, quan điểm này của vị ấy ..."). Dịch thành chủ đề + bình luận ("về vị tôn giả đã nói như sau: '...', quan điểm này của vị tôn giả ấy ..."), theo cách Sujato đọc ("Regarding the venerable who said this"). Pāli kết `9.4`, `10.3`, `11.10` bằng dấu phẩy sau nháy đóng, nên bản Việt cũng kết bằng dấu phẩy.
  - `3.5` `bhagavato` trong lời Anāthapiṇḍika: "Đức Phật" theo an10.94:4.5 (cùng phẩm, cùng công thức); Sujato "his views". Sa-môn Gotama ở lời các du sĩ.
  - `5.3`/`5.4` `byākātuṁ yaṁdiṭṭhikā mayaṁ`: "nêu rõ mình có quan điểm gì". `kiṁdiṭṭhiko` ở `3.4`, `5.2`, `12.3` cũng dịch "có quan điểm gì". Sujato "what my views are". `diṭṭhi` dịch "quan điểm" theo an10.96 cùng phẩm và mn72. `diṭṭhigata` (`5.4`, `12.2`): tầng có 70 khoá, trong đó "tà kiến" 45, "quan điểm" 18, "kiến chấp" 4, khác 3. Ở đây `yathāsakāni diṭṭhigatāni` chỉ việc mỗi du sĩ nêu quan điểm riêng của mình (Sujato "convictions"), không phải lời Đức Phật phán xét là sai, nên chọn "quan điểm riêng" thay cho "tà kiến"; bất định ghi tại đây, không thêm vào thân kinh.

  **Công thức `idameva saccaṁ moghamaññaṁ` → "chỉ điều này là thật, ngoài ra đều hư vọng"**: 62 khoá của tầng (mn72 40, mn102 19, mn74 3), cộng an10.96 cùng phẩm, so với 21 khoá "mọi điều khác đều sai" (dn29 chủ yếu) và 7 khoá "ngoài ra là sai" (dn9); an10.95 dùng "chân lý duy nhất ... vô nghĩa" (12 lần, 1 tệp). Theo đa số của tầng và an10.96 cùng phẩm. Khoá Pāli kết `—`: tầng viết ` —` (10/10 khoá cùng công thức `moghamaññanti—`), nên bản Việt kết ` —` có khoảng trắng.

  **`…pe…`:** `8.2` và `11.2` → đúng một `…`, mở nháy đúng như Pāli (`“` ở 8.2, `‘` ở 11.2). Chuỗi `8.3`–`8.9` và `11.3`–`11.9` theo mẫu an10.95/an10.96 cùng phẩm (`hữu biên` 13 trên 4 `hữu hạn` trong tầng; `mạng sống` theo mn72, an10.95, an10.96).

  **Tiền lệ có đếm:** `1.1` công thức Sāvatthī: 66 khoá viết "Một thời, Đức Phật ở Sāvatthī, tại rừng Jeta, trong tu viện của ông Anāthapiṇḍika." (dạng chiếm đa số); `2.2`, `2.7`, `2.8`, `3.3`, `4.2`, `15.1`, `15.2`, `15.3`–`15.4`, `16.2` dùng lại câu đã dịch ở an10.94 (cùng công thức, cùng phẩm); `2.2` còn khớp dn25:4.3 ("chuyện phù phiếm"). `15.3`–`15.4`: Pāli `Sādhu sādhu ... moghapurisā kālena kālaṁ sahadhammena suniggahitaṁ niggahetabbā` trùng nguyên văn với an10.94:7.1–7.2 nên dùng nguyên văn bản Việt đó. `16.1` thuộc công thức `sandassesi samādapesi samuttejesi sampahaṁsesi`: tầng có hai dạng ("chỉ dạy, khuyến tấn, làm phấn chấn và khiến hoan hỷ" ở dn16; "chỉ bày, khuyến khích, khích lệ và cổ động" ở an10.94); chọn dạng của an10.94 vì cùng phẩm. `17.2` `vassasatupasampanno` → "đã thọ cụ túc giới một trăm năm" (vassasata = 100 năm; tầng chưa có tiền lệ cho dạng ghép này, 0 khoá; phép tính: vassa 1 năm × sata 100 = 100). `17.3` `Tatiyaṁ.` → "Thứ ba." (cùng cách của an10.103:2.5, an10.125:1.5, ... 132 khoá "Thứ ba.").

  **Số cặp Pāli trùng nguyên văn:** trong chính bài, 17 nhóm khoá trùng (6.3/7.3/8.10; 7.1/8.1; 8.3–8.9 với 11.3–11.9; 9.4/10.3/11.10; 9.6/10.5/11.12; 9.7/10.6/11.13; 9.8/10.7/11.14/12.5/13.2/14.2; 9.9/10.8; 10.1/11.1; 10.4/11.11; 12.4/14.1): cả 17 nhóm dùng cùng một bản Việt, 0 nhóm lệch. Với các bài khác trong tầng: 27 khoá của bài này trùng Pāli ở nơi khác (99 cặp, trong đó 88 cặp ở các bài an10 đã có bản Việt), bản Việt khác ở 9 cặp thuộc 4 khoá: `1.5`/`1.7` (dn25:1.7, 1.9 viết dạng mệnh đề phụ "vì Ngài đang độc cư" vì nằm giữa câu, còn ở đây là câu riêng), `2.5` (tầng có bốn dạng khác nhau, theo mn77) và `2.9` (tầng có bốn dạng khác nhau, theo dn25:3.7 và dn9:4.6 "Có lẽ khi thấy hội chúng chúng ta yên lặng, ông ấy sẽ nghĩ nên đến gần"; an10.94:3.6 viết "Biết hội chúng này yên lặng, biết đâu vị ấy sẽ nghĩ là nên đến gần").

  `:0.1` "Kinh Tăng Chi Bộ 10.93" theo an10.94, an10.96; `:0.2` "10. Phẩm Upāli" theo cùng phẩm; `:0.3` `Kiṁdiṭṭhikasutta` dịch nghĩa "Kinh Quan Điểm Gì" (Sujato "What is Your View?", bản Thích Minh Châu "Kiến"), như các tên dịch nghĩa cùng phẩm (an10.91 "Người Hưởng Dục", an10.92 "Nỗi Sợ", an10.97 "Đáng Cúng Dường"). Số: không có số nào trong thân kinh ngoài "một trăm năm" ở `17.2`. Dấu nháy đơn/kép khớp Pāli từng khoá (0 lệch trên 103 khoá); `…pe…` Pāli 2 khoá → `…` Việt 2 khoá, các `…` còn lại khớp từng khoá (0 lệch); không có `(…)`.

