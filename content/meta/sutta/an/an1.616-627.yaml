notes: |-
  Hoàn thiện toàn bài 43/43 khóa Pāli (5 khóa an1.616 giữ nguyên từ đợt trước,
  thêm 38 khóa 617–627). Đã đối chiếu Sujato ở mọi khóa có nội dung qua vr_prA.txt.
  Không có tầng Việt hiện hành cho AN trong snapshot đã ghim.
  Khung những ai … họ … giữ nguyên theo an1.616 trên đĩa; thứ tự mệnh đề amata
  trước theo Pāli (Sujato đảo lại cho xuôi Anh — Pāli thắng).
  Động từ theo tiền lệ đếm được: thọ hưởng tiếp 616 (29 file); đánh mất theo
  đã đánh mất chánh niệm; bỏ lỡ + tinh tấn cho cặp viraddha/āraddha theo
  sn46.18:1.1/1.2 đã published; phóng dật đối với (2 file) + đã phóng dật (3 file);
  quên/chưa quên; thực hành cho āsevita để khỏi phẳng với tu tập cho bhāvita
  (cặp āsevita-bhāvita, khớp an1.575 được tu tập, làm cho sung mãn);
  làm cho sung mãn 104 file; thắng tri động từ cho abhiññāta theo an4.23
  (Sau khi thắng tri toàn bộ thế giới) để khỏi phẳng với liễu tri 85 file cho
  pariññāta; chứng ngộ 291 file cho sacchikata.
  Hai chỗ ghi nhận: 619:1.2 giữ āraddha là đã tinh tấn theo sn46.18, trong khi
  Sujato diễn nới thành have not missed out — Pāli có từ riêng nên giữ nét riêng;
  đã tinh tấn sự bất tử hơi gượng nhưng đúng mẫu đã tinh tấn bát chánh đạo của
  sn46.18. Pāli 620:1.2 đóng ngoặc kép trước ti (”.), bản Việt giữ quy ước ”ti.
  của cả phẩm cho nhất quán.
  Cụm kết không tiền lệ, dựng theo mẫu SN Tương Ưng X đã xong:
  627:1.3 (…) có 13 tiền lệ; 2.1 Đức Thế Tôn đã nói như vậy 16 occ;
  2.2 Các vị tỳ-kheo ấy hoan hỷ, tán đồng lời Đức Phật dạy 10 occ;
  2.3 (Phẩm Bất Tử.) ghép từ tên phẩm ở 0.2; 2.4 Thiên Một Pháp đã xong.
  theo lối Thiên Một Pháp của truyền thống Việt, bỏ pāḷi vì dạng có dấu đứng
  riêng chưa từng xuất hiện trong kho nên chốt lọt-Pāli sẽ bắt.
  Chủ thể te/ye → những ai … họ …, thì quá khứ/hiện tại đúng Pāli. Không blocker.
