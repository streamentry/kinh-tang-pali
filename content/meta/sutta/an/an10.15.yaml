notes:
  - >-
    **Mười ẩn dụ “tối thượng”, mỗi ẩn dụ một segment rồi quy về cùng một kết
    luận** — bốn mục kết luận viết **đầy đủ** (`1.2`, `2.2`, `3.2`, `10.2`), sáu
    mục lược bằng `…pe…`. Đây là lựa chọn có chủ đích: dịch đủ cả mười sẽ làm
    người đọc phải đọc lại một câu giống nhau mười lần; để `…` thì vẫn thấy đủ
    mười ảnh.
  - >-
    **`appamādo` → *không phóng dật*** và **`aggamakkhāyati` → *được gọi là tối
    thượng*** dùng nguyên văn `sn3.17:4.3`–`:4.4` (đã `published`) — *… Không
    phóng dật được gọi là tối thượng trong chúng*; và ẩn dụ **dấu chân voi** ở
    `2.1` lấy từ đúng câu đó. `saddhammika`/`dhammika` → *theo pháp, hợp pháp*
    theo `an3.14:1.1`.
  - >-
    **`nevasaññināsaññino` → *phi tưởng phi phi tưởng*** theo `an4.34:1.3` và
    `an5.32:3.1` (đều `published`): cả hai dùng *tưởng* cho `saññā`, và
    **không** dùng *cảm thọ* — bản đầu của tôi dùng *cảm thọ* và *không có cảm
    thọ lẫn không không có cảm thọ*, vừa lệch 102 segment tiền lệ vừa đọc rối.
    Đã sửa. `arūpino` → *không sắc* theo `an4.34:1.3`.
  - >-
    **Bốn mục hương liệu là 0 segment tiền lệ, đặt mới và ghi lý do**:
    `gandhapūpa` → *hổ phách* (Sujato dịch *spikenard*),
    `kācīva`/`lohitacandana` → *bát hương đỏ*, `gandhaphalakaṁ pupphaṁ` → *hoa
    lài*. Tên sông giữ nguyên chữ Pāli cho ba con sông chưa có tiền lệ
    (`Aciravatī`, `Sarabhū`, `Mahī`) vì đó là **tên riêng**; riêng `Gaṅgā` →
    *sông Hằng* có tiền lệ ở `sn6.4:9.1`. `cakkavattī` → *vua Chuyển Luân* theo
    34 segment.
  - >-
    **`nāḍī** sông Dăm** là 0 segment** — `Dammayā`/`Dām` không có tiền lệ; tôi
    dịch *Dăm* theo cách phát âm Pāli, và ghi lại đây là chỗ duy nhất trong
    chương tôi tự đặt tên riêng mà không có tiền lệ.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
