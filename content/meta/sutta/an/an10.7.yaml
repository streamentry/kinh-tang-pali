notes:
  - >-
    **Bản song song của `an10.6`**: Ānanda hỏi Sāriputta, rồi Đức Thế Tôn kể một
    mình mình đã chứng định thứ định ấy ở Sāvatthī trong rừng sâu. Đây là bài
    **duy nhất trong chương** dùng ngôi `ahaṁ` của Đức Thế Tôn, nên phải giữ
    đúng ngôi: *Ta ở ngay tại Sāvatthī này* … *Tại đó, Ta đã chứng đắc* … *đối
    với tôi*.
  - >-
    **Ba cụm chưa có tiền lệ, ghi lý do:** `andhavanasmiṁ` → *trong rừng sâu
    tối* (rừng tối; `mn147:1.9` chỉ có tên *rừng Andha*); `sakalikaggissa
    jhāyamānassa` → *người đang thiền với đôi mắt nhắm kín* (`sakalikagga` = mắt
    khép lại); `bhavanirodho nibbānaṁ` → *sự diệt hữu vi là Niết-bàn* (mười vị
    trí có sự thật này đều diệt hữu vi).
  - >-
    `aññāva saññā uppajjati aññāva saññā nirujjhati` → *có một tưởng khác sinh
    lên, một tưởng khác tắt đi*; ví dụ ngọn lửa theo `mn130:17.1` (*ngọn lửa*).
    `accāya` (lần trước, ở đây `ekamidāhaṁ`) → *Một thời* theo 464 segment tiền
    lệ.
  - >-
    **Danh sách mười tưởng ở `3.1` và `4.1` bị lược giữa đầu và cuối** (`yathā
    neva pathaviyaṁ pathavisaññī assa …pe… na paraloke paralokasaññī assa`) —
    tôi dịch *không có tưởng về đất … không có tưởng về thế giới kia* với
    **một** dấu lược, đúng bằng số chỗ lược của Pāli, không thêm dấu lược giả.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
