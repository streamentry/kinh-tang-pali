notes:
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Hai tầng còn lại là Pāli root + bản Anh Sujato đã ghim; `budsas.org` chỉ là tham khảo toàn văn.
  - >-
    **Bản song trùng Pāli, dùng lại nguyên văn — không dịch lại từ đầu.** `an10.134:2.2` cho danh sách mười `micchādiṭṭhi … micchāvimutti` của `an10.113` và cặp *chánh* tương ứng · `an10.178:2.2/3.2` — **cùng Pāli** danh sách `Pāṇātipāta … micchādiṭṭhi` / `… veramaṇī … sammādiṭṭhi` của `an10.171` · `an2.11:1.7` cho `kāyaduccarita` / `kāyasucarita` · `an5.156:4.3` và `an4.160:7.3` cho cụm `bāhulikā sāthalikā … sacchikiriyāya` của `an2.44` · `an7.19` cho **cùng khung bảy hạng người** của `an7.16` (chỉ khác `sukha` ↔ `anicca`) · `an5.179:5.2` cho năm vế `āhuneyyo … puññakkhettaṁ lokassa` · `an3.20:1.3` cho `nissayasampanno` → *có chỗ dựa vững vàng* · `sn37.25` cho **cùng danh sách** năm `balāni` của `sn37.30` · `sn37.14:1.3` và `sn37.33:1.3` cho năm giới ở hai dạng tính từ và `paṭiviratā` của `sn14.25` · `sn14.22` cho **cùng công thức** `Dhātusova … saṁsandanti samenti` của bốn bài `sn14.21/23/24/25` · `sn33.6-10:0.3` làm mẫu uid dải cho `sn33.1-5` · `sn22.104:1.7` cho `rūpupādānakkhandho` → *sắc thủ uẩn* · `sn22.71:1.4` cho danh sách phẩm chất của `sn22.48` · `an7.12:2.1` cho `ucchinnamūlo … anuppādadhammo` của `sn38.3`.
  - >-
    **Lượt review đối kháng bắt 9 lỗi, tất cả đều là lỗi nghĩa chữ.** (1) **`an2.44:1.5` và `2.2` để nguyên Pāli trong bản Việt** — `therā bhikkhū bāhulikā honti sāthalikā, okkamane pubbaṅgamā, paviveke nikkhittadhurā, na vīriyaṁ ārabhanti` nằm thẳng trong bản dịch. Hằng `LỤI`/`TIẾN` đã **xoá**, không dịch, vì vế tính từ và động từ đã nằm trong chính câu kế tiếp. **Chốt kiểm Pāli-lọt của harness chỉ bắt 7 gốc cố định** (`bhagav|bhikkhu|dhamm|pañña|saññā|khayā|koṭṭ|namassāmi`) nên không bắt được; lát này quét riêng bằng cách tìm chữ có dấu Pāli (`ṃṅñṭḍṇāīūṛḷ`) trong mọi từ Latin của bản Việt, và kiểm lại bằng cách đếm kết quả. (2) **`an8.17:1.3–1.10` sinh ra *"Bằngằng nước mắt"** ở cả tám khoá** — hàm cắt `t[1:]` của chuỗi *"bằng …"* làm mất chữ `b`. (3) `an7.16:2.1/3.1` **lặp lại** *"Ở đây, này các tỳ-kheo, có vị hạng người"* sau *"có loại người này:"*, sinh câu hỏng. (4) `an7.16:1.4` **mở rộng** `…pe…` thành đủ câu (chép nguyên văn `an7.19:1.2`) — đúng loại lỗi bất biến kho chặn. (5) `sn12.21:1.3–1.7` dịch `iti` thành *"điều như thế này"*; Pāli là *"vậy"*. (6) `sn14.23:2.5` sinh ra *"… với người có trí hòa hợp và tụ hội với người có trí"* — hàm ghép ba chuỗi. (7) `sn14.25:1.7` sinh ra *"Kẻ kẻ say rượu"*; `2.5` ban đầu ghép **hai** cặp trong khi Pāli chỉ có một. (8) `sn22.48:1.5/1.9` sinh ra **"sắcuẩn"** (dán tên sai tham số); và `upādāna-kkhandha` bị dịch *uẩn thọ nắm* thay vì **năm thủ uẩn** theo `sn22.104:1.7`. (9) `an9.2:1.2` và `sn38.3:1.2` **thêm** *"Này hiền giả,"* ở đầu câu trong khi Pāli không có; `an9.2:2.3` dịch `saṅkhāyekaṁ paṭisevati … vinodeti` thành *"dùng pháp này vào việc gì, chịu đựng pháp này"* — vô nghĩa, đã sửa thành *tự mình chọn lấy, tự mình tán thành, tự mình tránh xa, tự mình diệt trừ*.
  - >-
    **Một lớp lỗi nguyên nhân: dựng bản nháp từ trí nhớ thay vì từ Pāli.** Bản nháp đầu tiên của lát này viết `sn12.21`, `an9.2`, `sn38.3`, `sn23.2`, `sn33.1-5`, `sn22.48` từ trí nhớ và từ bản Sujato, **không** mở Pāli từng khoá. Kết quả là sáu lỗi trong chín lỗi ở trên. Đã in Pāli từng khoá (2.150 dòng cho lát 42, 1.614 dòng cho lát này) và viết lại từng bài. **Bài học chung cho lát sau: bản nháp phải sinh từ Pāli đã đọc, không từ bộ nhớ** — nhiều nhất chỉ dùng Sujato để đối chiếu sau.
  - >-
    **Ba tệp `:0.1` sai đã được phát hiện ở lát 43 — trong đó có tệp đã ship.** `u[2:]` là cách cắt đúng (bỏ tiền tố hai chữ); `'.'.join(u.split('.')[1:])` cho `sn51.19` ra `51.19` nhưng cho `sn33.1` ra `1`. Đã sửa 16 tệp: 13 tệp của lát này, và **3 tệp `sn51.19/28/29` đã lên `main` ở PR #162 với `Saṁyutta Nikāya 19/28/29` thay vì `51.19/51.28/51.29`** — lỗi cùng hình thức với 27 tệp đã sửa ở lát 42. Kiểm lại bằng một lệnh khác: còn 0 tệp sai trong toàn bộ kho.
  - >-
    **Một phát hiện về chính bộ chốt của repo.** Lỗi (1) cho thấy chốt *Pāli lọt vào bản Việt* chỉ nhận diện 7 gốc cố định, còn lỗi (2) và (7) cho thấy chốt *lặp từ* không bắt được cụm lặp có một từ ngăn cách giữa. **Không sửa bộ chốt dùng chung ở lát này** (thay đổi đó ảnh hưởng mọi bài đã công bố và cần một lượt quét riêng); ghi lại đây để biên tập quyết định.
  - >-
    Quy tắc dấu lược — đếm bằng số, không đoán. Công thức: `số = đết('…pe…') + đết('…' còn lại sau khi bỏ '…pe…')`, trừ 1 nếu segment **bắt đầu** bằng `…` **không** phải `…pe…`.
  - >-
    **Năm bài dưới ngưỡng coverage English 0,8, đã ghi nhận trong `content/meta/reference-gaps.yaml` và hạ điểm `triangulation` xuống 8,8.** `sn33.3/4/5` 3/11 = 27%: Sujato chỉ dịch câu hỏi và câu trả lời ngắn, để trống toàn bộ danh sách mười kiến chấp · `sn33.2` 7/11 = 64% · `sn33.1` 8/11 = 73%: cùng hình thức, nhưng `sn33.1` còn thêm phần mở đầu nên cao hơn. **Một ô Anh rỗng không phải sự đồng thuận về cách dịch** — chỗ đó Pāli phải tự đứng vững.
  - >-
    **Tên phẩm và tên kinh — đã tra tiền lệ `published` trước khi viết.** Dùng lại: `an7.17:0.2` cho `Anusayavagga` → *2. Phẩm Thiên Hướng* (7 bài) · `an2.11/2.42` cho `Dutiyavagga` → *2. Phẩm Thứ Hai* (78 bài) · đếm bằng lệnh cho 13 phẩm: `Paccorohaṇivagga` 2–2 · `Jāṇussoṇivagga` 1 · `Yamakavagga` → *7. Phẩm Song Trùng* (2) · `Mahāvagga` → *2. Phẩm Lớn* (2) · `Sambodhivagga` → *1. Phẩm Giác Ngộ* (2) · `Dasabalavagga` → *3. Phẩm Mười Lực* (3) · `Kammapathavagga` → *3. Phẩm Nghiệp Đạo* (2) · `Vacchagottavagga` → *1. Phẩm Vaccha* (11) · `Balavagga` → *3. Phẩm Sức Mạnh* (7) · `Jambukhādakavagga` → *1. Phẩm Jambukhádaka* (13) · `Attadīpavagga` → *5. Phẩm Tự Mình Là Hòn Đảo* (3) · `Paṭhamamāravagga` → *1. Phẩm Ma Rối Lần Nhất* (8). **Phân kỳ hoãn cho biên tập:** `Paccorohaṇivagga` hòa 2–2 giữa *Phẩm Bước Chân Trước* và *Phẩm Lễ Xuống Nước* — đã chọn *Lễ Xuống Nước* vì khớp Sujato (*The Ceremony of Descent*) và đúng nghĩa `paccorohaṇa` (nghi lễ tắm rửa). **Bốn tên kinh 0 tiền lệ:** `Paṭhamaadhammasutta` → *Kinh Pháp (1)* (`adhammo/anattho` → *điều phi pháp / điều phi lợi ích*; **lưu ý `an10.113` và `an10.171` cùng mang một tên**, vì mỗi bài là *Paṭhama* của phẩm riêng) · `Paṭhamasukhasutta` → *Kinh Lạc (1)* · `Paṭhamabandhanasutta` → *Kinh Bắt (1)* (Sujato *Catching*) · `Nissayasutta` → *Kinh Có Chỗ Dựa*.
  - >-
    Nguyên văn y hệt `an8.17`, chỉ **đổi chiều chủ thể** (`puriso itthiṁ bandhati`); dùng lại cùng cách dịch và cùng danh sách tám cách. `Aṭṭhamaṁ` → *Thứ tám*.
