notes: |-
  Cùng phẩm và cùng khuôn với an7.87 (xem notes an7.87 về khung bảy pháp).
  nhāta → tắm sạch, theo Sujato (Numbered Discourses 7.89): because of
  bathing off seven things that you become a bathed initiate.
  Đếm được: tắm sạch 10 lượt.
  Giữ điệp tắm sạch … tắm sạch để giữ lối chơi chữ nhātattā/nhātako của Pāli;
  đây là giữ cấu trúc nguồn, không phải lặp khuôn.
  Không có bản Việt hiện hành để đối chiếu; triangulation 8.5.
  technical 9.5 vì agent lát không được chạy npm validate, mới chỉ qua
  chốt _hvi (đủ khoá, NFC, ngoặc, dấu lược).
