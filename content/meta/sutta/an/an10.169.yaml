notes: |-
  Dịch từ Pāli root tại commit đã ghim. COVERAGE ĐO LẠI bằng chính hàm của kho (`englishCoverageFor`, ngưỡng 0.8 trong `source/layers.yaml`): `english-sujato` phủ 14/14 khoá Pāli có nội dung = 1.000, không cần tệp lấp `english-project`. Tầng `vietnamese-current` không có — tại commit đã ghim bilara chỉ phân phối Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  ĐỢT NÀY LÀ LƯỢT REVIEW ĐỐI KHÁNG THỨ HAI, trên bản dịch đã có trên đĩa. KHÔNG sửa khoá nào — đọc lại từng cặp Pāli↔Việt và không tìm ra lỗi nào cần sửa. Giữ nguyên 40/40 khoá.

  ĐO LẠI TIỀN LỆ (không tin số của người khác):
    · 0.1 bài an: quét 1.248 khoá `:0.1` trong tầng `an` -> `Kinh Tăng Chi Bộ` 895 (72%), `Aṅguttara Nikāya` 353, không có dạng thứ ba. Chọn `Kinh Tăng Chi Bộ 10.169`.
    · Tên phẩm: `17. Jāṇussoṇivagga` -> `17. Phẩm Vua Jāṇussoṇi` (7 tệp trong an10). Không tạo cách thứ N+1.
    · Tiêu đề: `Saṅgāravasutta` -> `Kinh Saṅgārava` (`sn7.21:0.3`, `an3.60:0.3`).
    · `orimaṁ tīraṁ` / `pārimaṁ tīraṁ` -> `bờ bên này` / `bờ bên kia`: tiền lệ ở dn13:24.3, dn13:26.5, mn22:13.6, mn34:2.1 và an10.118.
    · Dấu lược: bài này Pāli không có `…pe…` nào, bản Việt cũng không có dấu `…` nào. Cả 40 khoá khớp.
    · Ngoặc kép cân trên cả bài (đếm cả `“` và `”` toàn bài, kể cả ngoặc lồng nhau), 0 lỗi. NFC toàn bộ 0 lỗi. Không có khoá rỗng, không có `(…)` khoá chưa dịch, không có khoá tràn. Số khoá 40 = 40.
    · Dùng lại NGUYÊN VĂN, đối chiếu byte-for-byte: `1.1` <- `an3.60:1.1` · `1.2` <- `an3.60:1.2` · toàn bộ 22 câu kệ `3.1-7.6` <- `an10.118:3.1-7.6` (Pāli trùng tuyệt đối). Ngoài ra 26 khoá Pāli trùng nguyên văn với `an10.117` (`0.3`, `1.1`, `1.2`, `1.14` và cả 22 câu kệ) và 31 khoá trùng với `an10.170` — bản Việt trùng khớp ở cả hai, nên cùng một công thức Pāli chỉ có MỘT cách dịch trong ba bài an10 này.

  Ngũ giới và điều răn, dùng nguyên văn bài ngay cạnh đã có bản Việt (`an10.171:2.2` và `an10.171:3.2`): `pāṇātipāto` -> `Sát sinh` / `kiêng tránh sát sinh` · `adinnādānaṁ` -> `Trộm cắp` / `kiêng tránh trộm cắp` · `kāmesumicchācāro` -> `tà dâm` / `kiêng tránh tà dâm` · `musāvādo` -> `nói dối` / `kiêng tránh nói dối` · `pisuṇā vācā` -> `nói hai lưỡi` / `kiêng tránh nói hai lưỡi` · `pharusā vācā` -> `nói ác khẩu` / `kiêng tránh nói ác khẩu` · `samphappalāpo` -> `nói phù phiếm` / `kiêng tránh nói phù phiếm` · `abhijjhā` -> `tham lam` · `anabhijjhā` -> `không tham lam` · `byāpādo` -> `sân hận` · `abyāpādo` -> `không sân hận` · `micchādiṭṭhi` -> `tà kiến` (72% tầng an dùng `Kinh Tăng Chi Bộ` cho `:0.1`, còn dãy `tà kiến/chánh kiến` thì đồng nhất) · `bho gotama` -> `Thưa Tôn giả Gotama` (206 chỗ trong tầng) · `brāhmaṇa` -> `Bà-la-môn`.

  Bất định đã phân xử và ghi lại:
    (1) `2.2` và `2.3` có `kho, brāhmaṇa`, các khoá `2.4-2.11` không có; giữ đúng vắng mặt của `này Bà-la-môn` theo bản PāLI.
    (2) `2.9` (`abhijjhā`/`anabhijjhā`) và `2.10` (`byāpādo`/`abyāpādo`) là cặp KHÔNG có hậu tố `-ā veramaṇī`, nên dịch theo `an10.171` là `không tham lam` / `không sân hận`, không thêm `kiêng tránh`. Giữ đúng phủ định và đúng mức độ của PāLI.
    (3) `7.6` kết bằng `”ti.` — tầng đang phân hai cách: đo toàn tầng `sn`+`an` có 1.206 khoá kết bằng `”ti.` và 1.222 khoá kết bằng `”.`. Giữ `”ti.` vì đây là nguyên văn dùng lại từ `an10.118:7.6` (Pāli trùng tuyệt đối), sửa thành `”.` sẽ phá vỡ khớp byte với bài nguồn. Ghi ra đây.
    (4) `0.3` trùng tiêu đề với `an10.117:0.3` — cả hai đều là `Saṅgāravasutta` và đều dịch `Kinh Saṅgārava`, vì PāLI giống nhau.

  Cổng kỹ thuật: `technical_integrity` đặt 9.6 thay vì 10.0 vì lát này bị cấm chạy `npm run validate`, `npm test`, `npm run check` và `npm run build` (bốn lệnh này là cổng thật do CI chạy). Đã tự kiểm bằng node: JSON hợp lệ, 40/40 khoá khớp Pāli, 0 khoá thừa/thiếu/rỗng, NFC sạch, dấu lược khớp từng khoá, ngoặc kép cân. Coverage tầng Anh đo lại bằng hàm của kho nên không có blocker loại 1. Không sửa `content/meta/reference-gaps.yaml`, không sửa `source/`, không sửa `scripts/` hay `src/`.

  Lượt cải thiện 2026-10-14 (đọc đối kháng lại cả 40 khoá; ĐÍNH CHÍNH nhận định "không có lỗi" ở lượt trước): đổi 3/40 khoá, các khoá còn lại giữ nguyên.
    · `6.3`-`6.4` (`Pariyodapeyya attānaṁ, cittaklesehi paṇḍito`): trước là "Hãy làm thanh tịnh chính mình, / này bậc trí, khỏi nhiễm ô của tâm." — hiểu `paṇḍito` là hô cách, trong khi Pāli là danh cách số ít, chủ ngữ của `pariyodapeyya` (cùng cấu trúc với `5.2` `sukkaṁ bhāvetha paṇḍito`, đã dịch "bậc trí hãy tu tập pháp trắng"). Nay: "Bậc trí hãy làm thanh tịnh chính mình, / khỏi các nhiễm ô của tâm." (`cittaklesehi` số nhiều -> "các nhiễm ô"). Sai nghĩa mức vừa (sai chức năng ngữ pháp của một từ, ranh khoá không đổi).
    · `7.6` (`te loke parinibbutā”ti`): "họ tịch diệt trong đời này" -> "họ tịch diệt ở đời" — `loke` không có `imasmiṁ`/"này"; bỏ chữ "này" thêm vào. Sai nhẹ.
    · Không điểm tiêu chí nào được nâng; điểm giữ nguyên vì lỗi vừa được sửa chứ không có cải thiện vượt mức đã chấm. Các câu kệ đồng bộ với các bài kệ trùng nguyên văn trong cùng nhóm (an10.117, an10.118, an10.170) cần cùng sửa `6.3`-`6.4`/`7.6` tương ứng (báo cho người biên tập).
    · Bất định còn lại: không có thêm. Blocker: không. Cổng kỹ thuật vẫn đặt 9.6 vì chưa chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`.
