notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh Bhikkhu Sujato tại cùng commit. **Coverage Anh trên Pāli có nội dung: 25/25 = 100%** (ngưỡng 0.8): 7 khoá do Sujato, 18 khoá `5.1`–`5.13`, `6.1`–`6.4`, `7.5` do tầng `english-project` (published) lấp — cùng agent chấm nên **không phải cách đọc Anh độc lập**; 18 khoá đó được kiểm lại bằng Pāli đặt cạnh Pāli (5.x kể lại đúng công thức 1.x của chính bài, đối chiếu cặp trong bài) và bằng bài liền kề an8.24 cùng công thức. Tầng Việt hiện hành vắng ở commit đã ghim (bilara chỉ có Pháp Cú); budsas không được khai cho AN trong `external-references.yaml`.
  **19/56 khoá có Pāli trùng nguyên văn ở bài khác; 18 dùng lại NGUYÊN VĂN.** `0.2` (5/5: *3. Phẩm Gia Chủ*) · `1.1` (an8.24:1.1: *Một thời, Đức Thế Tôn trú tại Āḷavī, tại đền thờ Aggāḷava.*) · `1.2` (56/121: *Tại đó, Đức Phật gọi các vị tỳ-kheo:*) · `1.4` = `3.2` = `5.5` (13/23: *Với bảy nào?*) · `1.13` (103/178: *Đức Phật đã nói như vậy.*) · `3.5` = `5.8` (an8.24:2.7: *có lễ nghĩa …*) · `3.6` = `5.9` (*cẩn trọng …*) · `3.7` = `5.10` (*đa văn …*) · `3.8` = `5.11` (*thí xả …*) · `5.6` (an8.24:2.5: *Này các tỳ-kheo, ông Hatthaka ở xứ Āḷavī có lòng tin;*) · `7.1` (12/19: *Lành thay, lành thay, này tỳ-kheo!*) · `7.5` (249/251: *Thứ ba.*). Cả bài dùng lại cách dịch của an8.24 cho mọi khoá của bảy pháp: *có lòng tin · có giới · có lễ nghĩa · cẩn trọng · đa văn · thí xả · có tuệ · ít ham muốn*; cụm `acchariyehi abbhutehi dhammehi` → *pháp kỳ lạ, chưa từng có* (an8.24:2.3, 0 tiền lệ trước đó cho cụm).
  **Tiêu đề `0.3` `Paṭhamahatthakasutta` → *Kinh Hatthaka (Một)* — lệch có chủ đích khỏi đa số, nêu rõ.** Đếm toàn tầng các tên `Paṭhama…sutta`: *Thứ Nhất* 74, *(Một)* 50. Nhưng bài cặp `Dutiyahatthakasutta` đã publish là *Kinh Hatthaka (Hai)* (và dạng *(Hai)* chiếm 138 so *Thứ Hai* 88), hai bài là một cặp Paṭhama/Dutiya về cùng một người, nên tôi theo sự nhất quán của cặp: *(Một)*/*(Hai)*.
  **`0.1` theo mẫu đa số *Kinh Tăng Chi Bộ* (910 tệp) so với giữ Pāli (368 tệp).**
  **Khoá `1.14` hoà 2-2 trong 6 tiền lệ trùng byte** (mn138/mn141: *Nói vậy xong, đấng Thiện Thệ từ chỗ ngồi đứng dậy vào tịnh phòng.* vs mn18/mn3: *Nói xong, Thế Tôn…*): chọn vế *Thiện Thệ* vì 3/6 tệp dùng `Thiện Thệ` (314 khoá toàn tầng) và `tịnh phòng` có tiền lệ.
  **Hạt `ti`:** giữ `”ti.` ở ba khoá khép công thức `1.12` `3.10` `7.4` đúng như an8.24:2.13 đã publish; các lời thoại bỏ `ti`, dấu `“ ” ‘ ’` khớp Pāli từng khoá (kiểm bằng script).
  **`4.2` — Sujato thêm câu ngoài Pāli** (*and told him of what he had discussed… The Buddha said:*); Pāli chỉ có công thức chuẩn và `so bhikkhu etadavoca:` — tôi dịch theo Pāli (vị tỳ-kheo là người nói trước), không theo phần nối của Sujato.
