notes: |-
  Đợt 19, lát 33. 102 khoá, đủ mọi khoá của Pāli (102/102, 0 khoá thừa), thứ tự khoá đúng thứ tự Pāli.

  **Coverage English (mẫu số 78 khoá Pāli có nội dung, từ 40 ký tự, bỏ các khoá tiêu đề `:0.x`): Sujato phủ 78/78 = 100% (trên ngưỡng 0,80).** Khoá duy nhất Sujato để trống là 20.7 (`Paṭhamaṁ.`, 9 ký tự, nằm ngoài mẫu số). Bài chưa có lớp english-project và tầng vietnamese-current vắng ở commit đã ghim (chỉ Pháp Cú), nên toàn bộ coverage là của Sujato, một bản độc lập. Bản Việt nguyên bài của Hòa thượng Thích Minh Châu ở mục tra cứu toàn văn chỉ được đọc để đối chiếu thuật ngữ, không phải tầng căn theo khoá, và không dùng để chép câu.

  **Pāli trùng nguyên văn trong chính bài: 3 nhóm, 59 cặp, 0 cặp mà bản Việt khác nhau.** Nhóm `Atthi khvesa…` mở lời đáp (3.2, 4.2, 5.2, 6.2, 7.2, 8.2, 9.2, 10.2: 8 khoá, 28 cặp); nhóm `Ayaṁ kho, brāhmaṇa, pariyāyo…` (3.5, 4.5, 5.5, 6.5, 7.5, 8.5, 9.7, 10.6: 8 khoá, 28 cặp); nhóm lặp ba minh `avijjā vihatā vijjā uppannā…` (15.2, 17.2, 19.2: 3 cặp).

  **Dùng lại tầng đã dịch (Pāli trùng nguyên văn giữa các bài):** 20 khoá của bài có Pāli trùng với bài khác, tổng 852 cặp đã dò, trong đó 274 cặp bản Việt khác bản tôi; 18 trong 20 khoá tôi dùng lại nguyên văn một dạng đã có: 0.2 (`2. Phẩm Lớn`, 8/8); 1.1 (`Tôi nghe như vầy.`, 230 trong 443 cặp, dạng nhiều nhất); 2.1 (1 cặp); 13.1 (theo `mn4`, cùng Bà-la-môn, 1 cặp); 13.3 và 13.5 (theo `an3.63`, cùng công thức ngôi thứ nhất); 14.1, 16.1, 18.1 (dạng `Khi tâm đã định tĩnh như vậy … lìa các cấu uế, mềm dẻo, đắc dụng`, dạng nhiều nhất: 2 trong 4, 5 và 6 cặp; ví dụ `mn85:38.1`, `mn85:40.1`); 18.2 và 18.3 (1 cặp mỗi khoá); 18.4 (2 trong 5 cặp); 18.6 (2 trong 4 cặp); 20.3 (2 trong 4 cặp); 20.4 (5 trong 22 cặp, dạng nhiều nhất); 20.5 (6 trong 17 cặp); 20.6 (4 trong 13 cặp); 20.7 (`Thứ nhất.`, 307 trong 309 cặp). Hai khoá có Pāli trùng mà tôi cố ý không dùng lại: 2.3 (`Tayidaṁ, bho gotama, tatheva.`, 1 cặp, `an4.22:1.6`) vì cặp ấy dịch `bho gotama` thành `cậu Nam Tử Gotama` (58 lần trong 10 tệp, so với `Tôn giả Gotama` 1.161 lần trong tầng); ở đây tôi theo đa số rõ rệt; và 18.5 (`Vimuttasmiṁ vimuttamiti ñāṇaṁ ahosi.`, 5 cặp): Pāli khoá này không có dấu nháy nào, còn đa số cặp đã dịch thêm nháy đơn, nên tôi viết một dạng không nháy để khớp Pāli từng khoá.

  **Công thức dịch theo tiền lệ của tầng (đã đếm):** `tālāvatthukatā` → `làm như gốc chà là` (53 lần `chà là`, so với `gốc cây thốt nốt` 17 và `gốc cây cọ` 10; câu trọn `đã được … từ bỏ, … chặt tận gốc, làm như gốc chà là, làm cho không còn hiện hữu, là pháp không sinh khởi trong tương lai` theo `sn22.3:5.2`); `kāyaduccarita…` → `ác hạnh về thân` (33 trong 93 khoá có `kāyaduccarit`, dạng nhiều nhất); `pāpake akusale dhamme` → `pháp ác, bất thiện` (`pháp ác, bất thiện` hoặc `pháp ác bất thiện` 187 lần, so với `pháp xấu` 88 lần); `punabbhavābhinibbatti` → `sự tái sinh vào hữu mới trong tương lai` (31 khoá có Pāli này, dạng nhiều nhất); `kukkuṭi` công thức → `con gà mái có tám, mười hay mười hai quả trứng` (`mn16:27.2`, `sn22.101:3.1`, `an7.71:2.1`, 24 khoá); `sammā adhisayitāni…` → `ấp đúng cách, sưởi ấm đúng cách, nuôi dưỡng đúng cách` (`mn16:27.3`); `abhinibbhidā … kukkuṭacchāpakasseva aṇḍakosamhā` → `lần phá vỏ … như gà con phá vỏ trứng` (`mn53:20.3`, 3 khoá); `pariyāyo` → `cách` (`dn23:8.3`, `dn23:8.5`: `có cách nào`, `có cách`); `Bà-la-môn` viết hoa (2.825, so với `bà-la-môn` 1.357); `sammā vadamāno vadeyya` → `người nói đúng … có thể nói` (`dn29:16.4`, `mn4:21.4`, `sn54.11`); `abhivādeti … paccuṭṭheti … āsanena nimanteti` → `đảnh lễ, đứng dậy chào đón, mời ngồi` (`an4.22:1.5`, `dn18:17.6`).

  **Số trong bài, tự tính:** `aṭṭha vā dasa vā dvādasa vā` (11.1) = 8, 10, 12 (`mn16:27.2`, 24 khoá giống). Dãy 14.2: `ekampi` 1, `dvepi` 2, `tissopi` 3, `catassopi` 4, `pañcapi` 5, `dasapi` 10, `vīsampi` 20, `tiṁsampi` 30, `cattālīsampi` 40, `paññāsampi` 50, `jātisata` 100, `jātisahassa` 1.000, `jātisatasahassa` 100.000, khớp `mn4:27.2` (cùng dãy). Ba minh: 15.1 `paṭhamā` thứ nhất ở `paṭhame yāme` canh đầu; 17.1 `dutiyā` thứ hai ở `majjhime yāme` canh giữa; 19.1 `tatiyā` thứ ba ở `pacchime yāme` canh cuối; ba lần phá vỏ 15.3, 17.3, 19.3 khớp. Bốn thiền (13.2–13.5) sơ, nhị, tam, tứ; bốn sự thật (18.2, 18.3) hai bộ bốn. Năm đối tượng giác quan ở 3.4 và 4.4 (`rūpa`, `sadda`, `gandha`, `rasa`, `phoṭṭhabba`) = sắc, thanh, hương, vị, xúc. Không có cụm số chưa phân xử được (không có `Tiṁsakappasahassa`).

  **Chỗ tôi cố ý chọn, nên người gộp xem lại (cả tám lời buộc tội ở 3 đến 10 đều là từ chưa có tiền lệ ổn định trong tầng):**
  3.1 `arasarūpo` → `người vô vị`; Sujato dịch `lacks taste`, bản Việt nguyên bài của Hòa thượng Thích Minh Châu `thiếu ý vị`. `rasa` ở 3.4 tôi dịch `vị của sắc, vị của thanh, vị của hương, vị của vị, vị của xúc` (`vị của vị` hơi lủng củng nhưng giữ đúng `rasarasā`). Tiếng Việt `vô vị` còn có nghĩa nhạt nhẽo, chán; nghĩa ấy tình cờ khớp với ý Bà-la-môn muốn chê, nhưng Pāli ở đây là `không có hương vị` của năm đối tượng.
  4.1 `nibbhogo` → `người không hưởng thụ`; lời giải ở 4.4 là `rūpabhogā…` nên tôi dịch `bhoga` thành sự hưởng thụ. Sujato dịch nhãn `indelicate` nhưng lời giải `delight`; Hòa thượng Thích Minh Châu `thiếu tài sản`. Trong `sn7.14:4.1` cùng từ nghĩa là vô dụng (con ngựa già), nên nghĩa gốc có thể rộng hơn cách tôi chọn.
  5.1 `akiriyavādo` → `chủ trương không hành động` (tầng có `chủ trương không hành động` ở `sn22.62`, `an3.61`, `an4.30`, và `chủ trương vô tác` ở `mn117:38.1`; chọn dạng thứ nhất, trùng bản Hòa thượng Thích Minh Châu). Bên cạnh là `akiriyaṁ vadāmi` → `nói không làm đối với …`, theo `an2.34:2.1` (ghép đúng Pāli `akiriyaṁ kho ahaṁ, brāhmaṇa, vadāmi kāyaduccaritassa…`).
  6.1 `ucchedavādo` → `chủ trương đoạn diệt` (9 khoá `ucchedavād` trong tầng, đều cùng cách, `dn1:3.9.1`).
  7.1 `jegucchī` → `người hay ghê tởm`; `jigucchāmi` → `ghê tởm`. `samāpattiyā` ở 7.4 tôi dịch `việc rơi vào` (vì đối tượng là các pháp ác, bất thiện; `chứng đạt` hoặc `đạt đến` nghe như việc tốt). Pāli trùng ở `an8.13:2.8` dịch `việc chứng đạt`; cặp ấy ngoài phạm vi bài này, người gộp nên cân nhắc thống nhất.
  8.1 `venayiko` → `người chủ trương tiêu diệt`, và `vinayāya dhammaṁ desemi` → `thuyết pháp để tiêu diệt`; Sujato `exterminator`, Hòa thượng Thích Minh Châu `hư vô`. Trong `mn22:37.2, 37.4` (Pāli `venayiko samaṇo gotamo`, 2 khoá) bản Việt hiện có là `chủ trương đoạn diệt` vì ở đó lời buộc tội đi cùng `sato sattassa ucchedaṁ vināsaṁ vibhavaṁ paññāpeti`; trong bài này `ucchedavādo` đã chiếm nhãn đoạn diệt ở 6.1 nên tôi chọn từ khác để hai lời buộc tội không trùng. Nghĩa `vinaya` ở đây là tiêu trừ, dẹp bỏ (tham, sân, si), không phải Luật tạng.
  9 `tapassī` → `người khổ hạnh` (84 khoá `tapassī` trong tầng), nhưng `tapanīya` → `đáng bị thiêu đốt` (24 khoá có `tapanīy` trong tầng, `an2.4:1.1`). Cách chơi chữ trên gốc `tapa` (nung đốt, khổ hạnh) vì vậy chỉ còn lại một nửa trong tiếng Việt: người đọc thấy `thiêu đốt` và `khổ hạnh` mà không thấy hai từ cùng gốc. Sujato cũng gặp khó ấy (mortifier / mortified).
  10 `apagabbho` → `người không nằm thai`; `gabbhaseyyā` → `sự nằm thai`. Lời giải của Đức Phật gắn `apagabbho` với `gabbhaseyyā punabbhavābhinibbatti` (sự nằm thai và tái sinh đã dứt), nên tôi theo nghĩa thai tạng, giống Hòa thượng Thích Minh Châu (`không nhập thai`). Sujato dịch `gutless`, tức đọc `gabbha` theo nghĩa gan dạ, mạnh bạo (xem `sn16.3:1.3`, `snp4.10:5.3` `appagabbho`, tầng dịch `thô lỗ`, `không thô tháo`). Rất có thể lời buộc tội thật của Bà-la-môn là `thiếu gan dạ` còn Đức Phật cố ý hiểu theo nghĩa khác; bản Việt không thể mang cả hai và đã chọn nghĩa mà lời giải ở 10.4 cần. Không đổi giáo nghĩa vì câu giải thích ở 10.4 và 10.5 đứng đủ nghĩa.
  11.3 `jeṭṭho vā kaniṭṭho vā` → `con trưởng hay con út`; 12.2 `jeṭṭho seṭṭho` → `bậc trưởng, bậc tối thắng`; 20.2 cùng cách. Sujato dịch `eldest and first`, bản Hòa thượng Thích Minh Châu `con trưởng`, `đệ nhất, tối thắng`. `jeṭṭha` nghĩa là lớn nhất, đứng đầu; hai nghĩa ấy trùng nhau trong hình ảnh con gà ra khỏi vỏ trước.
  2.2 và 2.4 `addhagate`: `đã sống lâu năm`. `dn19:33.4` bỏ từ này, `mn91:26.21` dịch `tuổi đã cao`; không có cách ổn định nên tôi giữ nghĩa sát chữ nhất (đã đi qua nhiều thời gian).
  2.5 `na sampannamevā` → `quả thật không thích hợp` (Sujato `not appropriate`; Hòa thượng Thích Minh Châu `không đầy đủ`).
  2.6–2.7 `yañhi … muddhāpi tassa vipateyya`: tôi dịch `người nào mà Như Lai đảnh lễ … thì đầu người ấy cũng sẽ nứt vỡ`, theo `dn24:2.12.4` và `dn24:2.3.8` (`đầu y sẽ nứt vỡ`). Sắc thái đây là cách nói về điều không thể xảy ra, không phải lời đe dọa; chỉ ghi ở đây, không thêm vào thân kinh.
  16.2 và 16.1: bỏ tiếng gọi tôn kính `bhonto` trong `ime vata bhonto sattā` theo `mn4:29.2` (cùng Pāli, cùng Bà-la-môn nghe).
  `pajā` được dịch hai cách trong bài: 2.6 `quần chúng` (cụm cố định `sassamaṇabrāhmaṇiyā pajāya sadevamanussāya`, trong tầng dịch `đám đông`, `quần chúng` hoặc `chúng sinh`, không có dạng đa số rõ) và 12.1 `chúng sinh` (nghĩa sinh loại đang bị vô minh bao bọc). `aṇḍabhūtāya pariyonaddhāya` → `vốn như trứng, bị bao bọc kín`.
  13.2 `savitakkaṁ savicāraṁ` → `còn tầm và tứ` theo `an3.63:6.5` và `mn19:14.1` (cùng cách ở các bài ngôi thứ nhất); dạng `có tầm có tứ` cũng có trong tầng (`mn4:22-26.2`). Hai cách cùng nghĩa.
  13.3 `ekodibhāvaṁ` → `tâm nhất tâm` theo `an3.63:6.6` (Pāli trùng), `mn25:13.1` và `mn101:39.1`; dạng `tâm hợp nhất` (`an4.163`, `mn141:31.3`) cũng nhiều. Giữ dạng ngôi thứ nhất cùng `Ta`.

  **Dấu lược và dấu câu:** Pāli không có `…`, bản Việt không có `…` (0 và 0). Nháy kép `“ ”` và nháy đơn `‘ ’` khớp Pāli từng khoá ở cả 102 khoá (0 khoá lệch). Hai chỗ dấu nháy kép chạy qua ranh giới khoá giữ đúng Pāli: nháy mở ở 10.2 không đóng ở 10.7 (Pāli 10.7 kết `vadesi.` không có dấu đóng) và nháy đóng ở 11.3 (`…vā’”ti?`) không có dấu mở cùng khoá; nháy mở ở 12.1 đóng ở 19.3. Các khoá kết `—` ở Pāli: 1.1 (`Evaṁ me sutaṁ—`) tôi dịch `Tôi nghe như vầy.` theo dạng nhiều nhất của tầng (230 cặp; dạng `—` có 33 cặp).

