notes: |-
  **Coverage Anh Sujato trên Pāli có nội dung: 22/25 = 0.88**, trên ngưỡng 0.8, không
  cần ghi nhận gap. Mất 3 khoá: `6.5`, `7.5`, `8.4` — cả ba là `Nimittametaṁ … na
  samanupassāmi` (bilara bỏ trống rồi nối câu vòng). Tầng Việt hiện hành vắng ở commit đã ghim 11c9d708 (bilara chỉ phân phối 26 tệp tiếng Việt, toàn bộ là Pháp Cú), nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này; đây là đặc điểm của snapshot upstream, không phải thiếu sót của kho. Vì mất tầng ở ba
  khoá lặp lại, `triangulation` hạ xuống **9.0**.

  **9/38 khoá trùng nguyên văn Pāli; 8 cặp dùng lại NGUYÊN VĂN** — `0.2` (2/2) ·
  `1.5`, `2.3`, `3.3`, `4.3` (3/3 cho *Chớ để người khác biết điều này về ta!*) ·
  `6.6`, `7.6`, `8.5` (4/4 cho *Vì không thấy lý do ấy, Ta sống an toàn, không sợ
  hãi, đầy tự tín.*) · `10.2` (228/234).

  **Thuật ngữ, tất cả đều có tiền lệ đếm được.** `arakkheya` → *không cần che giấu*
  (dn33:1.10.62) · `anupavajjo` → *không bị quở trách* (an3.61, 8 bản) ·
  `kāyasamācāra / vacīsamamācāra / manosamācāra` → *hành thân / hành khẩu / hạnh ý*
  (mn88:14.12/16.8, an5.162) · `duccaritaṁ` → *hành ác hạnh* (21/102) ·
  `micchāājīvo` → *tà mạng* (21/26) · `tathāgato` → *Như Lai* (601/647) ·
  `cetovimutti`/`paññāvimutti` → *sự giải thoát không lậu của tâm* / *sự giải thoát
  bằng tuệ* (an4.35:5.8, mn71:9.1) · `sahadhammena paṭicodessati` → *có lý do chính
  đáng để chỉ trích* · `nibbānagāminī paṭipadā` → *con đường dẫn đến Niết-bàn*
  (dn19:8.1/23.1). `ājīvo` ở `4.1` tôi dùng *mạng sống* cho *sinh kế thanh tịnh* —
  `an3.61` dùng *chánh mạng* cho `sammāājīvo`, nên đây là biến thể cùng hệ.

  **Dấu lược ở `7.4` và `8.1`.** Pāli lược `anāsavaṁ cetovimuttiṁ paññāvimuttiṁ
  diṭṭheva dhamme sayaṁ abhiññā` — giữ đúng MỘT `…` mỗi khoá, không mở rộng. Ở `8.3`
  Pāli viết đủ, nên tôi cũng viết đủ; sự khác biệt này là có chủ ý.

  **Ba nhịp `6.3`/`7.3`/`8.2` và `6.6`/`7.6`/`8.5` lặp nguyên văn y hệt**, đúng như
  Pāli — vì vậy bài không có cảm giác khuôn.

  **`0.3` đặt mới (0 tiền lệ).** `Arakkheyyasutta` → *Kinh Không Có Gì Phải Giấu*
  theo Sujato (*Nothing to Hide*) và theo `dn33` (*Ba điều Như Lai không cần che
  giấu*).

  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
