notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `3. Sattāvāsavagga` → «3. Phẩm Trú Xứ». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `4.1`, `4.7` (`catūhi sotāpattiyaṅgehi samannāgato`) — «Vị ấy thành tựu bốn chi phần Dự lưu nào?» → «Bốn chi phần Dự lưu mà vị ấy thành tựu là những gì?»; «Vị ấy thành tựu bốn chi phần Dự lưu này.» → «Đây là bốn chi phần Dự lưu mà vị ấy thành tựu.» (công thức của sn55.28, sn12.41, an10.92…); khoá `4.3` («Đây là Thế Tôn …» sai so với `itipi so bhagavā`) → «Bậc Thế Tôn ấy là bậc A-la-hán … thầy của chư thiên và loài người, bậc Phật, Thế Tôn.» (8/13 khoá trùng); thêm một sửa trong bài: `2.1` (`pañca bhayāni verāni`) thiếu số «năm» → «Năm nỗi sợ hãi và hận thù nào đã được làm lắng dịu?».
