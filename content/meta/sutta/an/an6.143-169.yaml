notes: |-
  **UID-gộp: đã đọc `path` và đếm thật.** 12 khoá, tiền tố thật là `an6.143-169:` — tệp Pāli gốc **không** tách khoá theo `an6.143` … `an6.169`. `all` khớp 12/12, `thừa` bằng 0. (Hai dạng uid-gộp đã gặp: `sn12.83-92`/`sn48.83-92` mang khoá theo uid từng bài; lát này thì không. Tôi đếc từng tệp thay vì suy.)

  **Tự kiểm.** Không khoá nào dài từ 40 ký tự nên `kiểm()` của `_hvi.py` không chạy assertion nào. Tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá `all`, NFC, **số dấu lược khớp Pāli từng khoá**, ngoặc kép cân trên cả bài, không Pāli lọt, không `(…)`, không trùng Pāli, `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Ba dòng tiêu đề PĀLI TRÙNG Y HỆT `an6.170-649:0.1-0.3` (đã `published`)** → dùng lại nguyên văn: *Kinh Tăng Chi Bộ 6* · *13. Chuỗi Lặp Tham* · *~*. Khác `an6.140`/`141`/`142` (bài từng bài) đang viết *Aṅguttara Nikāya 6.142* và *13. Phẩm Chuỗi Lặp Tham*; ở đây tôi theo **uid-gộp** vì Pāli ở `:0.1` không có số và `:0.2` không có chữ *Phẩm*, giống hệt bài gộp.

  **Tám bước diệt tận: tôi căn cứ bản CĂN ĐÚNG TỪNG VẾ, và BÁO CÁO MỘT LỖI CỦA HAI BÀI NGOÀI LÁT.** Chuỗi `pariññāya … parikkhayāya … pahānāya … khayāya … vayāya … virāgāya … nirodhāya … cāgāya … paṭinissaggāya` có ở ba nơi, và:
  - `an10.267-746:1.16-1.24` (`published`) **đúng**: `pariññāya` → *để hoàn toàn hiểu rõ*, `parikkhayāya` → *để đoạn tận hoàn toàn*, `pahānāya` → *để từ bỏ*, `khayāya` → *để đoạn tận*, `vayāya` → *để hủy hoại*, `virāgāya` → *để ly tham*, `nirodhāya` → *để diệt*, `cāgāya` → *để xả*, `paṭinissaggāya` → *để buông bỏ*.
  - `an6.170-649:1.17-1.25` và `an7.645-1124:1.17-1.25` (cả hai `published`) **LỆCH MỘT VẾ**: `1.17` dịch `pariññāya` là *để đoạn tận hoàn toàn* (nghĩa của `parikkhayāya`), `1.18` dịch `parikkhayāya` là *để từ bỏ* (nghĩa của `pahānāya`), và cứ dịch lệch như vậy tới hết — `pariññāya` của chính nó bị mất, và `cāgāya` bị dịch thành *buông bỏ* (nghĩa của `paṭinissaggāya`).
  Tôi **không** sửa hai bài đó (ngoài lát của tôi), nhưng cũng **không sao chép lỗi**: tôi lấy từng vế từ `an10.267-746` cho `an6.143-169`, và English Sujato xác nhận đúng thứ tự ấy (`:1.1` *For the complete understanding of greed* · `:1.2` *complete ending* · `:1.3` *giving up* · `:1.4` *ending* · `:1.5` *vanishing* · `:1.6` *fading away* · `:1.7` *cessation* · `:1.8` *giving away* · `:1.9` *letting go*). Người đọc nên biết ba bài này đang hiện khác nhau trên cùng công thức.

  **`1.16` ở `an6.170-649` là `abhiññāya`, không phải `pariññāya`** — bài đó đã tự ghi lại chuyện này trong `notes` và dịch riêng *chứng ngộ bằng thắng trí*. Bài của tôi mở đầu bằng `pariññāya`, nên tôi dùng *Để hoàn toàn hiểu rõ tham, này các tỳ-kheo, …* theo `an10.267-746:1.16`, **không** dùng *chứng ngộ* (đó là của `abhiññāya`).

  **Dấu lược.** `1.1` có `…pe…` → một `…`; `1.2`–`1.8` mỗi vế một `…`; `1.9` không có. Tổng khớp từng khoá (tự kiểm, xem trên). BRIEF_VI3 §10.1: **không** mở rộng, dù bản Anh Sujato có mở rộng ở `1.1`.

  **Tiền lệ, đếm được.**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: *Để hoàn toàn hiểu rõ* (đúng `an10.267-746:1.16`) · *để đoạn tận hoàn toàn* (20 chỗ) · *để từ bỏ* · *để đoạn tận* (77) · *để hủy hoại* (23) · *để ly tham* (38) · *để diệt* (44) · *để xả* (23) · *để buông bỏ* (36). Vế đầu của mỗi bước là `…āya`, tôi dịch *để …*. Mệt đề mở đầu *Để … tham, này các tỳ-kheo, …* theo đúng ba bài anh em `an6.140`/`141`/`142` (đều `published`, đều mở *Để chứng ngộ tham, này các tỳ-kheo,*). Vế kết *… cần được tu tập* theo `an6.170-649:1.26`.

  **Bất định đã ghi.** `1.9` Pāli là `paṭinissaggāya cha dhammā bhāvetabbā` — *cho việc buông bỏ, sáu pháp này cần được tu tập*. `Rāgassa` ở `1.1` không lặp lại ở `1.9`, nên tôi **không** thêm *tham* vào vế kết, dù Sujato có (*letting go of greed*); thêm chữ là bịa. Tôi cũng **không** sửa con số *sáu* dù phần danh sách đã bị lược — `an6.170-649` cũng giữ lỗi đếm tương tự và ghi ra, nên tôi theo.

  **Không có bản Việt tham khảo** tại commit đã ghim; `triangulation` là Pāli + English Sujato (12/12 — tệp Anh đủ mọi khoá, kể cả dòng lược).

  **`technical_integrity` 9,6** vì đợt này cấm `npm run validate|test|build`.
  terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi sang cách dịch đa số toàn tầng — `13. Rāgapeyyāla` → «13. Phẩm Chuỗi Lặp Tham». Đếm bằng cách ghép PāLI↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên PāLI ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề, không đổi nghĩa segment nào.
