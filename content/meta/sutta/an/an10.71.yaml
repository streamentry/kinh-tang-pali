notes:
  - >-
    **Bài mở đầu phẩm: một lần ra lệnh, rồi mười lời nguyện theo đúng một
    khuôn.** Khuôn là *“Nếu … mong nguyện: ‘…’, hãy làm tròn vẹn giới của mình
    …”* — mười lần lặp nguyên văn, vì đó là cách bài dạy.
  - >-
    **`Ākaṅkhavagga` → *Phẩm Nguyện Cầu*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *If You Want*, và cả phẩm đúng một việc — *vị tỳ-kheo mong
    nguyện điều này, thì hãy làm điều kia* (`ākaṅkha` = mong nguyện).
    `Ākaṅkhasutta` → *Kinh Nguyện Cầu*. **`Ākaṅkhavaggo tatiyo` ở `an10.80:1.14`
    dịch là *Phẩm Nguyện Cầu, thứ ba*** — đây là **số thứ tự Bilara đánh số lại
    trong một tập con**, vì phẩm này rõ ràng thứ tám (đúng như `8.` ở `0.2`).
    Tôi dịch theo Pāli vì Pāli là authority, và ghi lại để không ai tưởng là đếm
    sai.
  - >-
    **Năm vế đầu dùng lại nguyên văn bài đã `published`, đều cùng Pāli**: `2.1`
    và `13.1` ← **`an10.11:2.5`–`2.6`** (sáu vế *sống trọn vẹn giới… sống hộ trì
    Pātimokkha… đủ căn cơ và phẩm hạnh… biết rõ sợ hãi trong điều nhỏ bé… học
    tập giữ đúng các học luật đã thọ nhận*); `4.1`–`7.1` dùng nguyên văn
    **`an10.11:3.5`** cho danh sách *y pháp, thức ăn khất thực, chỗ ngồi nằm,
    thuốc men và đồ dùng cần thiết cho người bệnh*; `3.1` → *đồng phạm hạnh*
    theo `an10.11:2.5`; `12.1` → *giải thoát tâm không lậu, giải thoát tuệ, tự
    mình chứng tri, chứng ngộ trong hiện tại…* theo `an10.8:3.1`.
  - >-
    **`5.1`–`11.1` bị lược `…pe…`** nên vế sau cắt thành *hãy làm tròn vẹn giới
    của mình … hãy hay ở tại nhà trống*; `3.1`, `4.1`, `12.1` giữ đủ năm vế. Đây
    là chỗ duy nhất trong chương tôi chủ động cắt bỏ chữ.
  - >-
    **Thuật ngữ 0 tiền lệ, đặt mới và ghi lý do tại đây**: `anirākatajjhāno` →
    *không lơ là trong sự an trú*; `suññāgāra` → *nhà trống* (đã có ở
    `an10.60:4.2` nhưng tôi dùng sau khi PR #112, nên ghi lại); `sālohita` →
    *quyến*; `anussaranti` → *nhớ đến*; `duruttānaṁ durāgatānaṁ vacanapathānaṁ`
    → *lời lẽ thô lập, lời lẽ đi xa*; `pāṇaharāna` → *mất ngủ*;
    `adhivāsakajātiko` → *sống chung với chúng*; `arati` → *bất an*. `kālaṅkata`
    → *qua đời* theo `an4.113:6.2`. `an10.71:8.1` là danh sách cảm thọ dài nhất
    chương; tôi giữ nguyên thứ tự và cả ba cặp “gay gắt, khó chịu”, “không thật,
    không dễ chịu” vì Pāli ghép cặp (`tibbānaṁ kharānaṁ`, `asātānaṁ amanāpānaṁ`)
    — bỏ cặp đi là mất ý.
  - >-
    **Lỗi do lượt review bắt được:** hàm dựng vế ra `‘‘…’’` ở tám mục vì cả
    người viết lẫn người gọi đều bọc nháy; và `12.1` bản đầu **đảo thứ tự** —
    đặt *đã chứng ngộ tự mình trong hiện tại* lên trước *giải thoát tâm không
    lậu*, trong khi Pāli đặt `anāsavaṁ cetovimuttiṁ paññāvimuttiṁ` trước. Đã sửa
    theo nguyên văn `an10.8:3.1`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
  - >-
    Rà nhất quán theo Pāli trùng 2026-10-14: khoá 13.1 (và khoá 2.1 cùng Pāli,
    cùng sửa) — bản cũ “hãy biết rõ sợ hãi trong điều nhỏ bé” sai nghĩa
    `aṇumattesu vajjesu bhayadassāvino` (thấy sự nguy hiểm trong những lỗi nhỏ
    nhất), “hãy đủ căn cơ và phẩm hạnh” → “đầy đủ hạnh kiểm và phạm vi lui tới”
    (`ācāragocarasampannā`), và thiếu `bhikkhave`; viết lại là “Này các tỳ-kheo,
    hãy sống đầy đủ giới hạnh, đầy đủ giới bổn; hãy sống thu thúc theo sự phòng
    hộ của giới bổn, đầy đủ hạnh kiểm và phạm vi lui tới, thấy sự nguy hiểm
    trong những lỗi nhỏ nhất, hãy thọ trì và học tập các điều học”, theo
    `mn6:20.1`, `an4.12:1.2`, `iti111:3.1`.
  - >-
    Quyết định hội đồng biên tập 2026-10-16: A1 — an10.71:8.1 (durāgata = “những
    lời nói thô ác, khó nghe”, sửa cả vế câu sai theo an4.114).
