  - >-
    **Đặc thù của tầng Pāli tại commit đã ghim — ghi ra, không sửa Pāli, không
    chú thích trong thân kinh:** (1) `an11.992-1151:1.25` nói `ime ekādasa
    dhammā` — **mười một pháp** — nhưng `1.1`–`1.15` liệt kê **mười lăm** mục.
    Tôi dịch đúng `mười một` và ghi ở đây; đây là điểm nhất quán thuộc tầng
    Pāli, không phải lỗi dịch. (Có thể `ekādasa` nói về **mười một phẩm** —
    `3.5` là `Ekādasakanipātapāḷi` — nhưng Pāli không nói thẳng, nên tôi không
    suy diễn vào thân kinh.) (2) `an7.3:1.6` (`balānīti`), `an8.15:1.11`
    (`malānīti`) và `an8.37:1.4` (`dānānīti`) đều kết `…ni ti.` mà **không** có
    `”`, dù `1.1` đã mở `“`; tôi dịch theo đúng số ngoặc từng segment, tức
    **không** thêm `”` ở ba chỗ này. (3) `ja159:3.1` **không** mở lại `“` dù
    `1.1` đã mở; tôi giữ đúng. (4) `sn12.72-81` có **tám** ngoặc kép `“` mở mà
    chỉ một `”` đóng ở `10.3`; đây là đặc thù bilara, tôi dịch đúng từng
    segment. (5) `an11.992-1151:0.4` là `~` — tầng Pāli không có tên cho lời
    đóng Tăng Bộ này.
  - >-
    **Bất định có nghĩa đáng kể, đã phân xử và ghi lại:** `ja159:1.4` và `3.4` —
    `Tayājja guttā viharemu divasaṁ`. `guttā` là chữ Pāli thật (con vịt) nhưng
    Sujato đọc cả vế là *guarded by you let us live out this day*. Hai cách đọc:
    (a) *được gìn giữ* — câu cầu cho sự bảo vệ, khớp Sujato; (b) *con vịt* — con
    côc kiêu ngạo để tha một ngày cho con vịt, khớp chủ đề kiêu ngạo của
    `morajātaka`. Tôi chọn (a) vì `viharemu` là ngôi thứ nhất số nhiều và đọc
    (b) sẽ để câu tối nghĩa; ghi lại đây để người biên tập xem. Không thêm chú
    thích vào thân kinh.
  - >-
    **Bẫy đã tránh trong lát này:** (a) **Hằng Python nối nhầm Pāli vào bản
    dịch** — ⚠ đã xảy ra và đã sửa: bốn hằng của `ja159` viết dạng `"PĀ", "VI"`
    trên hai dòng nên Python **nối thành một chuỗi**, làm **8 segment** có Pāli
    lẫn vào JSON (`1.3`, `2.1`, `2.3`, `2.4`, `3.3`, `4.1`, `4.3`, `4.4`). Tôi
    đã thêm phép kiểm chặn Pāli lọt vào `save()` nên không tái diễn được nữa.
    (b) **Số ngoặc kép phải đọc từ Pāli chứ không suy** — `an7.3:1.6` và
    `an8.15:1.11` bản đầu tôi thêm `”`; `ja159:3.1` bản đầu tôi thêm `“`. (c)
    **Chủ từ rơi mất ở ranh giới khoá** — `an7.3:2.5`–`2.6` (`Etehi balavā
    bhikkhu, / sukhaṁ jīvati paṇḍito`) và `an8.37:4.1`–`4.2` (`Evaṁ yajitvā
    medhāvī, / saddho muttena cetasā`) bản đầu tôi đặt `vị tỳ-kheo có trí tuệ`
    vào khoá kế tiếp làm vế đệ ngữ; đã sửa để chủ từ ở đúng khoá. (d) **Cái tên
    riêng bị kéo dài theo cách ngữ pháp Pāli** — `Anāthapiṇḍikassa` ở
    `an7.3:1.2` phải là *Anāthapiṇḍika* theo tiền lệ; đã sửa. (e) **Đọc Pāli
    từng bài chứ không chỉ so văn bản Việt** — cả ba bài `ja159`, `sn12.72-81`
    và `sn22.42` trông như bản sao của nhau nhưng khác nhau ở dấu lược và số
    ngoặc kép.
