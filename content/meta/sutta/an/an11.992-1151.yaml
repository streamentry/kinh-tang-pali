  - >-
    **Lượt cải thiện 2026-10-13 (kiểm toán mẫu).** Đọc đối kháng đủ 38 khoá
    với Pāli, bản Anh đã ghim và tiền lệ toàn tầng Tăng Bộ; sửa 31 khoá
    (một số chỉ là khoảng trắng trước dấu lược). **Đính chính các ghi chú cũ
    ở trên:** phần lớn chúng mô tả bài khác (`an7.3`, `an8.15`, `ja159`,
    `sn12.72-81`, `sn22.42`, `thag1.1`…), không phải bài này; con số "50% có
    bản Anh" cũng sai — bài này chỉ có hai khoá Pāli đủ 40 ký tự (`1.25`,
    `2.2`) và bản Anh đã ghim phủ cả hai, nên coverage đo được là 2/2, các khoá
    `2.3` và `3.1`–`3.4` bản Anh để trống nhưng đều dưới ngưỡng nội dung. Khẳng
    định "`1.25` nói mười một nhưng liệt kê mười lăm mục" cũng **bị rút lại**:
    mười lăm mục ở `1.1`–`1.15` là các phiền não (sân, si, giận…, phóng dật)
    làm đối tượng của hàng động từ `1.16`–`1.25`, còn "mười một pháp" là mười
    một pháp đã nêu ở các bài `an11.982`–`991`; không có mâu thuẫn trong Pāli.
    **Lỗi nặng (sai nghĩa hoặc sai thực thể), 8 khoá:** `3.3` *Sattapaññāsa* là
    **năm mươi bảy** (7 + 50), bản cũ viết bảy mươi bảy, nên tổng 9.000 + 500 +
    57 = 9.557 bài mới đúng truyền thống; `3.5` *Ekādasakanipāta* là **Chương
    Mười Một Pháp**, không phải "tập mười một phẩm" (tiền lệ `an9.113-432:1.28`
    *Chương Chín Pháp*, `an1.627:2.4` *Thiên Một Pháp*); `0.3` và `2.3`
    *Rāgapeyyāla* không phải "kệ" mà là chuỗi lặp về tham (tiền lệ *Chuỗi Lặp
    Tham*, các tệp `an6`–`an10` và `an11.982`); `1.1` *dosa* là **sân**, bản
    cũ dịch "oán giận" trùng với `upanāha` ở `1.4`; `1.11` *thambha* là bướng
    bỉnh, cứng đầu, không phải "kiêu ngạo"; `1.12` *sārambha* là hung hăng (tiền
    lệ 7 tệp kể cả `mn7`), không phải "hăng hái", một từ mang sắc thái tích cực;
    `0.2` có chữ Pāli *Paṭhamapaṇṇāsaka* lẫn số thứ tự "1." không có trong Pāli,
    nay là *Nhóm Năm Mươi Đầu* như các bài `an11` khác (13 tệp). **Lỗi vừa, 5
    khoá:** `1.5` *makkha* "chê bai" nay *khinh miệt* (tiền lệ 7 tệp) và `1.6`
    *paḷāsa* "chê trách" nay *coi thường* (`an4.304-783`); `1.15` *mada* "say
    mê" nay *kiêu căng* (`an5.308-1152`), vì *say mê* là sắc thái ham thích chứ
    không phải kiêu mạn; `1.25` bỏ "trọn vẹn" thêm vào *paṭinissagga*; `3.2`
    *bhiyyo* là "thêm nữa", không phải "hơn là". **Chỉnh nhẹ:** dãy động từ
    `1.16`–`1.24` về tiền lệ đa số (13 tệp): `abhiññāya` → *thắng tri* (109 trên
    252 khoá có `abhiññāya`; bản cũ *thấy biết rõ* là lẻ duy nhất), `pariññāya`
    → *hoàn toàn hiểu rõ*, `parikkhayāya` → *đoạn tận hoàn toàn*, `pahānāya` →
    *từ bỏ*, `khayāya` → *đoạn tận*, `nirodhāya` → *diệt*, `cāgāya` → *xả*;
    riêng `vayāya` giữ *tan rã* (hai tiền lệ: `an5.308-1152`, bản này) thay vì
    *hủy hoại* của đa số, vì *vaya* là tan biến tự nhiên chứ không phải phá
    huỷ; `1.13` *māna* → *mạn*, `1.14` *atimāna* → *quá mạn*, `1.7` *issā* →
    *ganh tị* (`mn7`, `an4`, `an5`); `2.1` về *Đức Phật đã nói như vậy* (19 trên
    22 tiền lệ); `3.4` *samāyutā* → *kết hợp trong*, bản cũ *quy thành* thêm
    ý; khoảng trắng trước dấu lược theo đa số kho. Điểm đổi: terminology 9,2 →
    8,8; triangulation 9,2 → 8,8; semantic_fidelity 9,4 → 9,0; grammar_logic
    9,3 → 9,1; vietnamese_clarity 9,3 → 9,0; han_viet_balance 9,3 → 9,1;
    ambiguity_integrity 9,5 → 8,9; source_provenance 9,6 → 9,4 (các ghi chú
    cũ sai bài); technical_integrity 10,0 → 9,6 (chưa chạy `npm run validate`,
    `npm test`, `npm run check`, `npm run build` trong lượt này);
    segment_alignment giữ 10,0 (đủ 38 khoá, đúng thứ tự, nháy và dấu lược khớp
    Pāli từng khoá). **Bất định còn lại:** (a) các cặp *makkha/paḷāsa*,
    *thambha*, *mada* chưa có bản dịch Việt thống nhất trong kho và các bài
    `an3`–`an10` còn dùng cách khác (*ngạo mạn*, *cứng cỏi*, *phóng túng*); đã
    chọn theo Pāli và bản Anh (*disdain/contempt*, *obstinacy*, *vanity*) và
    chưa đồng bộ các bài đó; (b) đối tượng của hàng động từ `1.16`–`1.25` chỉ
    lộ ra ở `1.16` (*phóng dật*); bản Anh thêm "of negligence" ở `1.25`, tôi
    **không** thêm vào Việt vì Pāli không nói; (c) *aṅguttarasamāyutā* nghĩa sát
    là "liên kết với Tăng Bộ", không chắc hơn; (d) tổng 9.557 là truyền thống,
    không kiểm bằng cách đếm bài thực tế. Tập kề `an11.983-991:0.3` còn dùng
    *Tập Kệ Rút Gọn…* cùng lỗi "kệ"; chưa sửa vì ngoài phạm vi bài này.
