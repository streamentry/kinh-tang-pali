notes: |-
  ĐỌC LẠI TỪNG CÂU TỪ PĀLI. Bản dịch có sẵn do phiên trước ghi, thiếu metadata; tôi đã đối
  chiếu 48/48 khoá với Pāli root đã ghim và sửa 9 khoá. **Đây là bài yếu nhất trong lát c76**;
  các lý do nằm ngay dưới đây.

  ⚠⚠ COVERAGE CHỈ 80,65% — SÁT NGƯỠNG. Đo bằng đúng công thức
  `src/lib/canon/reference.ts` (Pāli ≥ 40 ký tự sau nén khoảng trắng, bỏ khối tham chiếu
  `:0`): **25/31 khoá Pāli có nội dung**. Sáu khoá trống Anh: **1.4, 2.2, 2.3, 5.6, 5.7,
  5.11**. Đây là bài duy nhất trong lát không có tầng lấp `english-project` (không có
  `content/meta/en/an/an11.12.yaml`), nên sáu khoá đó hoàn toàn không có tầng Anh nào.
  Ngưỡng `source/layers.yaml` là 0.8 nên **vẫn qua** và không phải ghi
  `content/meta/reference-gaps.yaml`, nhưng chỉ hơn 0,65 điểm phần trăm.
  `triangulation` đặt **8.0** theo quy định cho bài thiếu tầng Anh ở một phần khoá có nội
  dung, và **không** nâng điểm ở tiêu chí khác để bù. Sáu khoá này là:
  (a) 1.4 và 2.3 — lời tiên tri "y hoàn tất và ba tháng qua đi thì khởi hành", lặp nguyên văn
  ở 1.4, 2.3 và 2.7 trong chính bài, nên Pāli vẫn đứng vững; (b) 2.2 — cùng nội dung với 2.3
  và 1.3; (c) 5.6, 5.7, 5.11 — đoạn chư thiên, 5.7 và 5.11 là hai vế song song
  (`saddhā`/`paññā`) nên dịch được một từ cái kia.

  SỬA 9 KHOÁ:
  3.3 và 5.12. **LỖI ĐẢO NGHĨA NẶNG NHẤT TRONG CẢ LÁT.** Pāli
  `na rāgapariyuṭṭhitaṁ cittaṁ hoti, na dosapariyuṭṭhitaṁ cittaṁ hoti, na mohapariyuṭṭhitaṁ
  cittaṁ hoti` — `rāga` là THAM, `dosa` là SÂN. Bản dịch cũ dịch vế một là "sân hận", vế hai
  là "thù ghét", tức **rāga và dosa bị đảo chỗ**: câu trở thành "tâm không đầy sân, không đầy
  thù ghét, không đầy si", mất đúng cả ba tam nhãn. Tiền lệ tuyệt đối: `an6.25` dùng đúng
  công thức này (5 lần) dịch "tâm vị ấy không đầy tham, không đầy sân, không đầy si" — và
  bản 5.x của `an6.25` còn trùng nguyên văn 5.12 ở đây. Đã sửa thành "không đầy tràn tham
  ái, không đầy tràn sân hận, không đầy tràn si mê".
  3.4. **LỖI CẤU TRÚC NHÁY KÉP.** Pāli 4.1 (`Idha tvaṁ, mahānāma, tathāgataṁ anussareyyāsi:`)
  không có dấu nháy nào, nhưng bản dịch mở `“` ở đó. Hậu quả kép: `“` thừa là chữ thêm
  không có nguồn, và nó cưỡng ép 5.11 đóng `”` — trong khi `‘` mở ở 5.6 (Pāli có `'`) thì
  không có gì đóng. Đã bỏ `“` ở 4.1 và đổi dấu đóng ở 5.11 từ `”` thành `’` cho khớp Pāli
  `saṁvijjatī'ti.`. Lời thoại cha vẫn đúng quy ước nhấy kép xuyên suốt của SuttaCentral: `“`
  mở ở 3.1 và đóng ở 5.16. Sau sửa, cả hai loại nháy đều cân 4/4 và 5/5.
  4.4. `bhagavā` ở 4.2 dịch "Đức Thế Tôn ấy" trong khi 9 chỗ khác của bài dịch "Đức Phật" (`bhante`
  mới là "Bạch Thế Tôn"). Đã chuẩn hóa theo đa số trong chính bài.
  5.5. 5.4 dịch `cāgaṁ` thành "sự cho" (16 lần toàn kho) trong khi 5.10 và 5.12 dùng "sự bố
  thí" (854 lần toàn kho). Đã chuẩn hóa.
  5.6. 2.8 có đuôi thêm không có trong Pāli: "phải thực hành theo kiểu sống nào **của chúng
  con**”ti?" — Pāli `kenassa vihārena vihātabban` không có dạng sở hữu đó, và 3.3 dịch đúng
  công thức không có ("theo kiểu sống nào”ti?"). Đã bỏ.
  5.7. 2.6 bỏ mất `kira` rồi thay bằng "cho là", trong khi 2.2 dịch cùng từ Pāli đó là "Nghe
  nói có". Cùng một từ, hai kiểu trong cùng bài; "cho là" ở 2.6 còn thuộc về ý của mệnh đề kế
  tiếp (2.7) nên đặt sai chỗ. Đã sửa thành "nghe nói có".

  DẠNG LẠI TRONG PĀLI — ĐÃ GHI, KHÔNG SỬA VÌ KHÔNG PHẢI VIỆC CỦA BẢN DỊCH. Ở 5.11, Pāli
  đọc `cāgena … paññāya samannāgatā`, trong khi các bản in thường `paññena`. Bản Việt dịch
  theo nghĩa ("đầy đủ tuệ như thế ấy") chứ không dịch hình thức, nên không ảnh hưởng gì; nhưng
  đây là dấu hiệu bản chụp Bilara có thể lỗi chính tả, đáng để người biên tập tra lại với
  nguồn in.

  Thuật ngữ, kèm đếm: `kulaputta` → thiện nam tử (128 lần toàn kho) ·
  `anussati` → nhớ tưởng · `buddhānussati`/`devatānussati` → nhớ tưởng về Đức Phật/chư thiên ·
  `puttasambādhasayanaṁ` → cùng vợ con (khớp `an6.59`, `sn3.11`, `sn55.53`) ·
  `cāga` → sự bố thí (854 lần) · `sutta` → sự đã học tập · `ariyasāvako` → bậc Thánh đệ tử ·
  `ujugata` → thật thẳng · `atthavedaṁ/dhammavedaṁ` → cảm hứng nơi ý nghĩa / nơi Pháp (147
  lần) · `pāmojja` → niềm vui · `sīla` → giới hạnh (1249 lần "thanh tịnh" cho `parisuddha`,
  909 lần "viên mãn" cho `paripuṇṇa`) · `tathāgata` → Như Lai.
  0.1 giữ `Aṅguttara Nikāya 11.12` theo 1673 khoá `:0.1` đã có; 0.2 `Anussativagga` →
  "2. Phẩm Nhớ Tưởng" đúng 5 bài cùng phẩm (`an11.15`, `18`, `19`, `20`, `21`); 0.3
  `Dutiyamahānāmasutta` → "Kinh Mahānāma (Hai)", theo `Dutiyapaccorohaṇīsutta` →
  "Kinh bước xuống (Hai)" và `Tatiyaadhammasutta` → "Kinh Pháp (Ba)".

  Dấu lược: 4.2 lược phần lớn danh xưng (`…pe…`), 5.1–5.4 lược chuỗi năm pháp, 5.6 lược
  phần giữa. Mỗi khoá giữ đúng MỘT `…`; không mở rộng chỗ Pāli lược (luật 10.1).

  ⚠ MỘT CÁCH DỊCH ĐANG CÙNG TỒN TẠI. Chuỗi `Pamuditassa pīti jāyati, pītimanassa kāyo
  passambhati, passaddhakāyo sukhaṁ vediyati, sukhino cittaṁ samādhiyati` ở 4.6 và 5.15 được
  dịch theo khung **"tâm có hỷ thì thân khinh an; …"**, tức nguyên văn `an3.95` (cũng là
  chính công thức ấy). Cùng Pāli đó ở `sn35.97:2.4–2.7` của chính lát này lại dùng khung
  **"Với người …"**, tức nguyên văn `an5.26`. **Hai khung cho một công thức Pāli trong cùng một
  lát.** Cả hai đều có tiền lệ đã công bố nên tôi không tự chọn; **người biên tập nên chốt một
  khung rồi áp lại cho `an3.95`, `an5.26`, `an11.12`, `sn35.97`.**

