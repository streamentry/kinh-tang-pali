notes:
  - >-
    Đối chiếu Pāli root và bản Anh của Bhikkhu Sujato (coverage 100%, 43/43
    substantive segments). Các công thức quan trọng: - Đức Phật từ khước danh
    vọng: "Māhaṁ, nāgita, yasena samāgamaṁ, mā ca mayā yaso" dịch nhất quán:
    "Này Nāgita, Ta không dính líu đến danh vọng, và danh vọng cũng chớ dính líu
    đến Ta." - Bốn loại an lạc của người từ bỏ: nekkhammasukha (lạc xuất ly),
    pavivekasukha (lạc viễn ly), upasamasukha (lạc an tịnh), sambodhasukha (lạc
    chánh giác). - Đoạn so sánh người chứng đắc và không chứng đắc dễ dàng:
    "yassāhaṁ ... na nikāmalābhī assaṁ na akicchalābhī na akasiralābhī" dịch
    chuẩn xác, bảo tồn sự lặp lại cấu trúc đối xứng. - So sánh sinh hoạt làng
    mạc ồn ào và độc cư rừng vắng thanh tịnh dịch rõ ràng, tôn trọng chuẩn mực
    văn phong Phật học hiện đại.
