notes:
  - >-
    **Cảnh báo về khuôn tải `Aṅguttara Nikāya` — đo lại, con số đã lệch.** Lệnh lát bảo dùng dạng `Kinh Tăng Chi Bộ` cho `0.1` của bài `an`, nói rằng đo được 862 tệp theo dạng đó và 342 tệp giữ Pāli. Tôi **đo lại trên đĩa hôm nay** và con số đã lệch: trong 1.600 tệp `an`, có **1.228** tệp có khoá `:0.1`; trong đó **875** viết `Kinh Tăng Chi Bộ` và **353** giữ `Aṅguttara Nikāya` (372 tệp không có khoá `:0.1` nào). Tỷ lệ chọn lựa thì không đổi, nên tôi **theo đo được**: dùng `Kinh Tăng Chi Bộ`. Hệ quả phải nói rõ: bài liền kề có thể lệch — `an8.25` viết `Kinh Tăng Chi Bộ 8.25` nhưng `an8.47` lại giữ `Aṅguttara Nikāya 8.47`, và `an6.33` cũng giữ Pāli. Việc này không đổi nghĩa segment nào.
  - >-
    **Mọi trích dẫn trong `notes` này đã tra bằng script** trên chỉ mục Pāli↔Việt tự dựng (5.032 bài, 88.415 chuỗi Pāli khác nhau) — trong đó **loại 8 tệp của chính lát này**, để không tự đếm bản dịch của mình làm tiền lệ.
  - >-
    **Coverage Anh đo bằng script, không suy.** Đo theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ, cộng `english-sujato` và `english-project` khi status là published). Cách đo đã được **kiểm lại** bằng bài đã có sẵn: chạy lại đúng công thức này trên `an5.249` cho ra **16/21 = 0.7619**, khớp con số đã ghi trong `blocking_errors` của chính tệp đó. Bài này đạt 19/19 = 100%, nhưng chỉ **15** khoá do Sujato và **4** khoá do bản lấp `english-project` của chính dự án (`2.3`, `2.5`, `2.6`, `2.7`) — nên `triangulation` hạ xuống, nên không cần mục trong `content/meta/reference-gaps.yaml` và không có blocker về tầng tham khảo.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo.** Tại commit đã ghim, tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) chỉ có Pháp Cú, nên **không có bản Thích Minh Châu để đối chiếu ở bất kỳ bài nào trong lát này**. Đối chiếu thuật ngữ vì vậy dựa vào Pāli root + bản Anh Sujato đã ghim + **tiền lệ đo được trong chính tầng Việt của kho**; `budsas.org` là tra cứu toàn văn, không dựng cột.
  - >-
    **Dấu lược — giữ đúng luật, không mở rộng.** Mọi khoá Pāli có `…pe…` đều giữ **đúng một** `…` trong bản Việt (luật §10.1 của BRIEF_VI3), và **không** khoá nào được thêm `…` để che chỗ thiếu. Ở những khoá lược, công thức bị nén đều là `peyyāla` mà bài đã phát lại đủ ở chỗ khác, nên nén thêm cũng không mất thông tin; tôi không mở rộng bất kỳ khoá lược nào.
  - >-
    **8 khoá có Pāli trùng nguyên văn và tôi dùng lại y hệt; 29 khoá là Pāli mới.** Trong đó quan trọng nhất là `1.4`/`2.2`/`3.2` (`Tassa evaṁ hoti:`) — chỉ mục cho 109 bản sẵn chia làm nhiều cách (*Vị ấy nghĩ:* 49, *Người ấy nghĩ:* 21); tôi chọn **Người ấy nghĩ:** vì chủ thể ở đây là người cư sĩ đang sinh lòng tin với một cá nhân, không phải một vị tỳ-kheo — đây là **cố ý lệch đa số**, ghi để người gộp biết. `1.2` (`Katame pañca?`) có 185 bản sẵn, tôi theo đa số *Thế nào là năm?* (122/185) dù bài anh `an5.249` trong cùng phẩm lại dùng *Là năm nào?*. `4.5` (`Pañcamo paṇṇāsako samatto.`) khớp y hệt *Phần năm mươi kinh thứ năm hoàn tất.*
  - >-
    **Thuật ngữ mới, tiền lệ bằng 0 hoặc rất mỏng — kèm lý do.** `puggalappasāda` → **niềm tin vào cá nhân**: chỉ mục cho **0** chuỗi Pāli trùng cụm này trong toàn tầng. `puggala` đã có tiền lệ ở `an5.249` (*cá nhân*), `pasāda` đã có (niềm tin), `ādīnava` đã có (*tai họa* ở `an5.249`), `saddhamma` đã có (*Chánh pháp*). Ghép lại thành *niềm tin vào cá nhân* là cách ít giả định nhất. `abhippasanno` chỉ có **1** tiền lệ (*thân nhiệm*) và ở đây nghĩa là *hết lòng tin tưởng*, nên tôi dịch thẳng chứ không bám tiền lệ. `saṅgho ukkhipati` → **Tăng đoàn khai trừ vị ấy** (0 tiền lệ cho `ukkhipati`; `ukkhitta` trong tầng là *đã nhấc thanh chắn* nhưng đó là `ukkhittapaligho`, một nghĩa khác). `ante nisīdāpeti` → **cho vị ấy ngồi xuống cuối hàng** (0 tiền lệ; Sujato dịch *makes them sit at the end of the line*).
  - >-
    **Bản chỉ liệt kê 1, 2 rồi nhảy thẳng 5 — đây là **nguyên văn**, tôi không bịa hai tai họa còn thiếu.** `3.7` Pāli là `pañcamo ādīnavo` (*thứ năm*) và Sujato cũng vậy. Bài không có phần định nghĩa tai họa thứ ba và thứ tư, nên bản Việt không có chúng; đây là đặc điểm của kinh, không phải thiếu sót của tôi. `3.1` giữ **đúng hai** `…` vì Pāli có hai `…pe…` (ba khoảng trống: đi nơi khác, từ bỏ y pháp, qua đời).
  - >-
    **Hai chỗ cần người gộp phán xử, đã ghi ở đây.** (1) `4.3` `Catūhi pare dve sivathikā` — `pare` là *những cặp*, nhưng cụm nằm trong `uddāna` và danh sách `duccarita` của phẩm chỉ có sáu bài, nên tôi dịch chữ-từng-chữ *Bốn Cặp Bài, Hai Bài Nghĩa Địa* theo quy ước `uddāna` đã có, không suy diễn. (2) Tên kinh `Puggalappasādasutta` → *Kinh Niềm Tin Vào Cá Nhân*, theo đúng thuật ngữ đã chốt ở trên.
  - >-
    **`technical_integrity` đặt 9.6 chứ không phải 10.0.** Đợt này lát bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên cổng kỹ thuật của repo **chưa chạy** và không thể tuyên bố là đã pass. Những gì đã quét bằng script riêng trên **mọi** khoá (không chỉ khoá ≥ 40 ký tự): JSON hợp lệ, đủ mọi khoá trong `all`, không khoá thừa so với Pāli, không khoá rỗng, NFC, không trùng nguyên văn Pāli, không Pāli lọt vào bản Việt, **số dấu lược khớp Pāli từng khoá**, và ngoặc kép cân trên cả bài (`ngoặc()` của `_hvi.py`). Cần chạy bốn lệnh trên trước khi merge.
