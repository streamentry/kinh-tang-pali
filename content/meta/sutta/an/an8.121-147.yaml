  TRÙNG NGUYÊN VĂN, ĐÃ DÙNG LẠI: 1.1 trùng nguyên văn với an9.95-112:1.1 (cùng lát) và
  cả cặp 1.1–1.9 trùng công thức với an10.240-266 (đã publish) và an7.618-644 (đã publish).
  Đã kiểm từng khoá: 1.1–1.7 và 1.9 y hệt từng chữ với an10.240-266; 1.1–1.8 y hệt với
  an7.618-644. 1.8 khác an10.240-266 đúng một chỗ có lý do: Pāli của bài kia là `(…) cāgāya …`
  nên bản dịch kia phải giữ `(…)`, còn Pāli ở đây là `cāgāya …` nên không có.
  Đây là chính lý do phải dùng lại nguyên văn: đợt trước có 87 khoá trùng Pāli bị dịch hai
  cách vì 8 agent không được báo dùng chung công thức.
