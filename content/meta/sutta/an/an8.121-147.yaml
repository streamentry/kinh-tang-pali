  an8.120 và an9.93.
  `…pe…` giữ đúng MỘT dấu lược theo luật của tầng Việt; khoá 1.2–1.8 của Pāli vốn đã là
  `…` trần nên cũng một dấu. Không mở rộng dấu lược ở đâu cả.
  LỖ HỔNG ĐỂ LẠI, nói thẳng: `nirodhāya` dịch là để diệt, còn cụt; đây là nguyên văn của
