  **SỐ PĀLI, TỰ TÍNH.** Dãy `2.2` theo đúng thứ tự Pāli: `eko/ekaṁ` 1 · `dve` 2 · `tayo/tīṇi` 3 · `cattāro/cattāri` 4 · `pañca` 5 · `cha` 6 · `satta` 7 · `aṭṭha` 8 · `nava` 9 · `dasa` 10 — Việt *một … hai … ba … bốn … năm … sáu … bảy … tám … chín … mười*, đủ 10 vế, không vế nào đổi chỗ. Các khoá đóng `x.1`/`x.7` mang số Pāli tương ứng: `dve` hai (`5.1`), `tayo` ba (`5.9`), `cattāro` bốn (`6.1`, `6.7`), `pañca` năm (`7.1`), `aṭṭha` tám (`7.13`), `nava` chín (`8.1`, `8.7`), `dasa` mười (`9.1`, `9.7`). Các khoá `Nsu dhammesu` theo đúng số locative: `dvīsu` 2 (`5.3`), `tīsu` 3 (`5.8`), `catūsu` 4 (`6.3` `6.6`), `pañcasu` 5 (`7.3`), `aṭṭhasu` 8 (`7.12`), `navasu` 9 (`8.3` `8.6`), `dasasu` 10 (`9.3` `9.6`); các câu hỏi `katamesu` `dvīsu/tīsu/catūsu/pañcasu/chasu/sattasu/aṭṭhasu/navasu/dasasu` lần lượt 2, 3, 4, 5, 6, 7, 8, 9, 10. Danh sách trả lời: *ba thọ* (`tīsu vedanāsu`), *bốn niệm xứ*, *năm căn*, *sáu giới thoát ly*, *bảy giác chi*, *Thánh đạo tám ngành*, *chín trú xứ của chúng sinh*, *mười nghiệp đạo thiện* — cả tám khớp con số của chính mệnh đề ngay trước. Không có số lớn nào (`sahassa`, `sata`, `navuti` …) trong bài.

  **CẤU TRÚC VÀ CHỖ LƯỢC.** Bài lập lại một công thức theo mười vòng. **Năm khoá có `…pe…`** (`5.5` `7.5` `7.7` `7.9` `10.2`), mỗi khoá giữ **đúng một `…`**, không mở rộng; Pāli không có `…` trần nào khác, `(…)` không có khoá nào. Phép đo cho **0** lệch: khoá nào Pāli có `…pe…` thì Việt có đúng một `…` và ngược lại. Năm khoá ấy đều kết ` …` (không chấm) vì Pāli kết `…pe…` không có dấu chấm. Các vế trả lời bị lược ở `5.5`–`5.7` (danh sắc, ba thọ) và `7.5`–`7.9` được viết đúng như Pāli, không bù thêm pháp nào ngoài tên đã nêu.
  **Nhóm vòng lặp, đo trong chính bài.** Sáu khoá `Kiñcetaṁ paṭicca vuttaṁ?` trùng Pāli nguyên văn nhau và cùng một câu Việt (**1 nhóm, 0 cặp Việt khác**). Ngoài nhóm đó **không có cặp Pāli trùng nguyên văn nào khác** trong bài; các khoá gần trùng (`4.3` `5.3` `5.8` `6.3` … và các vế `x.1`/`x.7`) khác nhau ở danh từ đếm số hoặc cách locative nên Việt khác đúng ở con số.

  **NGOẶC KÉP VÀ NHÁY — khớp Pāli TỪNG KHOÁ.** Cả bốn loại `“` `”` `‘` `’` khớp Pāli ở **75/75** khoá, không lệch khoá nào. Cấu trúc: lời cư sĩ mở `“` ở `2.1`, đóng `”` ở `2.3`; lời Tỳ-kheo-ni mở `“` ở `3.1`, đóng `”` ở `3.3`; lời Tỳ-kheo-ni phần chính mở `“` ở `4.1`, đóng ở `10.5`; nháy đơn `‘…’` bao các câu trích ở `2.2` `4.1` `4.7` `5.1` `5.9` `6.1` `6.7` `7.1` `7.13` `8.1` `8.7` `9.1` `9.7`, và **chạy qua ranh giới khoá** ở `10.2`→`10.3` (`‘` mở ở `10.2`, `’` đóng ở `10.3`, đúng như Pāli). Lời Đức Thế Tôn mở `“` ở `11.1`, đóng ở `11.4`. `4.5` `5.7` `6.5` `7.11` `8.5` `9.5` kết em-dash đúng như Pāli (`—` không cách chữ, theo `sn48.8:1.11`).

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `manobhāvanīyānaṁ bhikkhūnaṁ` (`3.1`) — **0 tiền lệ** trong tầng. Dịch *các tỳ-kheo đáng được tôn kính trong tâm* (`bhāvanīya` = đáng được tôn kính, đáng được tu tập; `mano` = tâm). Sujato *esteemed mendicants*; Hòa thượng Thích Minh Châu *các Tỷ-kheo có tu tập về ý*. Hai cách hiểu: *đáng được tâm tôn kính* hoặc *tỳ-kheo có tâm đã được tu tập*. Chọn cách ít giả định nhất và đứng gần Sujato; nếu người biên tập muốn sát Hòa thượng thì đổi.
  · `sammadatthaṁ` (`4.3` …) — `sammā` + `attha`: `attha` có thể là *mục đích* hoặc *nghĩa lý*. Chọn *mục đích* theo mạch (*sau khi thấu triệt đúng đắn mục đích, ngay trong hiện tại là người chấm dứt khổ*); Hòa thượng *mục đích*, Sujato *meaning*. 0 tiền lệ trong tầng.
  · `pariyantadassāvī` — **0 tiền lệ**. Dịch *thấy rõ giới hạn*; `pariyanta` cũng có thể là *tận cùng*, *ranh giới*.
  · `abhisamecca` — dịch *thấu triệt*; `sn56.32` dùng *tự mình thấy rõ* cho cùng gốc, nhưng ở đó tân ngữ là các thánh đế; ở đây tân ngữ là `sammadatthaṁ`.
  · `sammā subhāvitacitto` — dịch *có tâm được khéo tu tập một cách đúng đắn*; 0 tiền lệ cho dạng `subhāvitacitto`.
  · `Mahāpañhā` (`2.1`, `10.1`) viết hoa *Câu Hỏi Lớn* như tên của một nhóm bài (`an10.27`–`an10.28`), vì Pāli dùng làm tên và Sujato đặt trong nháy đơn ở `2.1`.
  · `Kajaṅgalikā` xử lý như **tên riêng** (*Tỳ-kheo-ni Kajaṅgalikā*), không dịch là *nữ tỳ-kheo ở Kajaṅgalā*; cả Sujato lẫn Hòa thượng đều xử lý như tên. `kajaṅgalakā upāsakā` → *các nam cư sĩ ở Kajaṅgalā*.
  · `aṭṭhasu ariyaaṭṭhaṅgikamaggesu` (`7.11`) — Pāli ở số nhiều (*tám … đạo*); dịch *Thánh đạo tám ngành* (số tám đã nằm trong *tám ngành*), khớp mệnh đề *đối với tám pháp* ở `7.12`.
  · `sabbe sattā āhāraṭṭhitikā` (`4.5`) — **2** khoá trùng nguyên văn (`dn33:1.8.2`, `dn34:1.2.27`) đều là *Tất cả chúng sinh đều tồn tại nhờ vật thực.*; lấy nguyên câu, chỉ khác dấu kết (`—` ở đây).

  **LỆCH NGOÀI LÁT — BÁO, KHÔNG SỬA.** `an10.30:15.3` (uddāna) dịch `Kāḷī ca dve mahāpañhā` thành *Kāḷī và hai bài Đại Đường Đạo*: `mahāpañhā` là *những câu hỏi lớn* (cùng tên bài này), không phải *Đại Đường Đạo*. 1 khoá, ngoài lát này; không chạm.

  **KIỂM CHỨNG.** Tập khoá Việt = tập khoá Pāli, **75/75**, đúng thứ tự Pāli. Tên riêng `Kajaṅgalā`/`Kajaṅgalikā` là các từ duy nhất giữ dạng Pāli trong bản Việt; không có từ Pāli nào khác lọt sang. NFC đúng ở cả 75 giá trị, không khoá rỗng, không khoảng trắng thừa.

  Điểm `technical_integrity` = **9,6** vì lát này bị cấm chạy cổng, nên **không** tuyên bố technical gate pass. Bốn lệnh còn lại: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
