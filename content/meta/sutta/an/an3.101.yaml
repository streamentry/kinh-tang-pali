notes: |-
  Sửa lan 2026-10-13: khoá an3.101:2.2, 2.3, 2.4, vitakka bị dịch "tưởng" → "tầm": "các tưởng về dục / sân / sát hại" → "tầm dục, tầm sân, tầm hại"; "các tưởng về thân tộc / quốc độ / gắn với danh vọng" → "tầm về thân tộc, tầm về quốc độ, tầm gắn với việc không bị khinh miệt" (anavaññattipaṭisaṁyutto vitakko; "danh vọng" cũng không sát Pāli, theo cnd12:6.1, mnd16:246.3, cnd17:38.3); "các tưởng về pháp" → "các tầm về pháp" (dhammavitakka). Căn cứ: "tưởng" là saññā; tiền lệ "tầm dục, tầm sân, tầm hại" ở an3.124:1.8, dn33:1.10.13.
