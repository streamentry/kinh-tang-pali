notes:
  - >-
    **`pāsaṁso` = "đáng khen ngợi", KHÔNG phải "thiếu sót".** Đây là chỗ dễ sai
    nhất của bài: `pasaṃsā` nghĩa là *ca ngợi*, và corpus xác nhận — 31 segment
    ở `dn29` dịch `pāsaṁso` là "đáng khen ngợi". Trong danh sách mười điều kiện
    này, `na pāsaṁso hoti` / `pāsaṁso hoti` là cặp *không đáng khen ngợi / đáng
    khen ngợi*, nên dịch theo nghĩa khen ngợi.
  - >-
    **`mānaṁ nādhibhoti` / `mānaṁ adhibhoti` — chưa có tiền lệ trong corpus** (0
    segment). Quyết định ở đây: `māna` → "ngã mạn" theo `an4.159:4.5`;
    `adhibhoti` (= *làm chủ, thắng được*) → "làm chủ được". Vì không có tiền lệ,
    ghi kèm lý do để người sau kiểm chứng được.
  - >-
    `ārādhako` → "có khả năng thành tựu", theo `an5.10:1.1`/`2.1`
    (`abhabbo/bhabbo imasmiṁ dhammavinaye vuddhiṁ virūḷhiṁ` → "không có khả năng
    / có khả năng đạt được sự tăng trưởng"), ghép với `ārādhako` = "thành tựu" ở
    `mn73`. `visujjhati` → "được thanh tịnh" (`an4.78`). `agāravo/appatisso` →
    "không tôn kính và không vâng phục" / "có tôn kính và biết vâng phục"
    (`an5.10`). `bhajitabbo`/`payirupāsitabbo` → "kết bạn"/"phụng sự"
    (`an3.26`).
  - >-
    `bahuṁ apuññaṁ pasavati` → "sinh ra nhiều bất thiện", `bahuṁ puññaṁ
    pasavati` → "sinh ra nhiều công đức": dùng nguyên văn từ `an3.150:1.1` và
    `2.1`, cùng ngữ cảnh một-người-một-hành-vi.
  - >-
    **Cấu trúc mười điều kiện lặp lại đúng như bài trước**: `sammādiṭṭhiko hoti
    … sammāvimutti hoti` ở `2.4` là **cùng Pāli** với `an10.155:2.3`, nên dùng
    lại nguyên văn.
  - >-
    Dấu lược: `…pe…` ở `1.2`–`1.20` được dịch thành `…` — **bỏ chữ viết tắt `pe`
    của bản Pāli**. Đây là nghi thức của 1.850 segment trong corpus, so với 142
    segment còn giữ nguyên. Lượt review phát hiện chính chương 15 của tôi đã làm
    sai — đã sửa 10 segment và ghi `docs/translation-notes/ellipsis-pe-
    abbreviation.md`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
    đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã ghi ở
    `content/meta/reference-gaps.yaml`.
