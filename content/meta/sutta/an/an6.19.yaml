notes: |-
  TẦNG THAM KHẢO. Tầng english-sujato có bản của bài này tại commit đã ghim; đo thật: Pāli có nội dung (>= 40 ký tự, bỏ khối :0) là 51 khoá, Sujato phủ 47/51 = 0,922 (trên ngưỡng 0,8 ở source/layers.yaml). Bốn khoá Sujato để trống là 9.1, 10.1, 11.1, 14.1 (cùng một câu Pāli Yo cāyaṁ…, đúng chỗ bản Sujato dùng dấu lược); bản lấp của dự án (content/meta/en) phủ đủ bốn khoá ấy, nhưng do cùng một tác giả với bản Việt nên KHÔNG tính là bản đọc English độc lập, và scorecard này không tuyên bố đã đối chiếu English ở bốn khoá đó (chúng được dịch từ Pāli và từ 8.2, 13.1 ngay trong bài). Tầng Việt hiện hành (Thích Minh Châu) vắng với AN tại commit đã ghim nên không có tham khảo Việt truyền thống cho bài này. Do đó triangulation chấm 8,9 chứ không cao hơn.

  DÙNG LẠI NGUYÊN VĂN, có số đếm. Ba khoá có Pāli trùng tuyệt đối với an6.20: 1.1 (:1.1), 1.2 (:1.2) và 1.6 (an6.20:1.3, công thức maraṇassati bhāvitā bahulīkatā… amatapariyosānā) nên dùng lại đúng nguyên văn. Đã dò 259 cặp Pāli trùng nguyên văn với các bài đã dịch (11/65 khoá có tiền lệ); 83 cặp giống và 176 cặp khác, gần như toàn bộ chỉ khác Đức Phật / Đức Thế Tôn và nói / nói như sau ở các khoá mở bài. Chọn Đức Thế Tôn cho nhất quán với an6.20 (cùng làng Ñātika, cùng phẩm). Trong bộ an không có tiền lệ nào khác cho bốn khoá mở bài (1.2, 1.4, 1.5, 2.1); trong tầng, mn nghiêng Phật (82/82 ở 1.5), dn nghiêng Thế Tôn (19/19). Bên trong bài: 32 cặp Pāli trùng nguyên văn, 0 cặp mà bản Việt khác.

  THUẬT NGỮ. maraṇassati → tỉnh thức về sự chết (theo an6.20, chọn đặt mới ở đó). Tên bài: Kinh Tỉnh Thức Về Sự Chết (Một), đối ứng (Hai) của an6.20; (Một) có tiền lệ ở an6 (an6.5, an6.81, an6.92), còn an6.1, an6.11, an6.73 dùng (Nhất). manasi kareyyaṁ → chú tâm vào: trong toàn tầng manasi kar… đi với chú tâm 62 lần so với tác ý 36 lần; mn144 (bhagavato sāsanaṁ … manasi kātabbaṁ) dịch tác ý, còn dn3 (tameva atthaṁ sādhukaṁ manasi kareyyātha) dịch chú tâm; chọn chú tâm theo đa số và theo Sujato (focus on). sāsana → lời dạy (dn14, dn19). rattindivaṁ → một ngày đêm (mn14:21.11; ngày đêm 56 so với đêm ngày 10 trong tầng); divasaṁ → một ngày. assasitvā / passasāmi → thở vào / thở ra (dn22, mn10: assasanto = thở vào). ālopa → miếng ăn (dn25:8.6 dịch miếng). ekapiṇḍapātaṁ → một phần thức ăn khất thực (mn3:3.21 dịch piṇḍapāta là phần thức ăn khất thực). Yathā kathaṁ pana → như thế nào (22 khoá trong tầng, ví dụ dn31:2.13). āsavānaṁ khayāya → để đoạn tận các lậu hoặc. pamattā / appamattā → phóng dật / không phóng dật (79 khoá). Tasmātiha … evaṁ sikkhitabbaṁ → Do vậy … nên học như vầy (mn143:5.1 dịch Do vậy … hãy học như vầy; 23 khoá). Ime vuccanti → những vị này được gọi là (tầng dịch Này các tỳ-kheo, đó gọi là… cho khoá tương tự, nhưng ở đây chủ ngữ là người nên đổi). dandhaṁ → chậm chạp và tikkhaṁ → sắc bén: 0 tiền lệ trong tầng, đặt mới theo nghĩa (dandha: chậm, uể oải; tikkha: sắc, nhạy), đối nhau như Pāli.

  SỐ PĀLI. cattāro pañca ālope → bốn năm miếng ăn (4 hoặc 5; Sujato four or five). ekaṁ ālopaṁ → một miếng. Chuỗi bảy thời lượng giảm dần: một ngày đêm, một ngày, một phần thức ăn khất thực, bốn năm miếng, một miếng, một hơi thở vào-ra. Bốn thời lượng đầu bị gọi là phóng dật, hai thời lượng sau là không phóng dật; 8.2–11.2 gồm bốn khoá đầu, 13.1–14.2 gồm hai khoá sau.

  BẤT ĐỊNH (không thêm vào thân kinh). (a) bahu vata me kataṁ assa: kataṁ là phân từ thụ động, assa là thể khả năng; dịch việc tôi làm được sẽ thật nhiều, bám sát Sujato (I could really achieve a lot); kinh không nói rõ đó là việc gì, nên không thêm hạn định thiện hay tu tập. (b) tadantaraṁ … yadantaraṁ: dịch trong khoảng thời gian tôi …, thời điểm xảy ra sau khi sống hết chừng ấy thời gian không được Pāli nói. (c) assasati / passasati: dịch thở vào / thở ra theo tiền lệ trong tầng (dn22, mn10), cùng chiều với cách Sujato đọc ở 7.5 (breathe out after breathing in); không có chứng cứ độc lập khác trong tầng ghim, nên chỉ ghi nhận. (d) Ngoặc kép mở ở 8.2 chỉ đóng ở 16.3; các khoá 9.1 đến 15.1 nằm trong lời nói ấy và không mở ngoặc kép, khớp Pāli từng khoá.

  DẤU LƯỢC. Pāli bài này không có dấu lược nào; bản Việt cũng không có (0 khoá có …). Nháy đơn và nháy kép khớp Pāli ở cả 65 khoá (0 lệch); không có chữ số Ả Rập trong thân kinh; NFC sạch.

  LÚC REVIEW ĐỐI KHÁNG. Đã đọc lại 65 cặp Pāli với Việt: 2.5 và 8.3 cùng Pāli nên cùng Việt (tương tự 3.5 với 9.2, 4.5 với 10.2, 5.5 với 11.2, 6.5 với 13.2, 7.5 với 14.2). Bốn khoá mở danh sách (9.1, 10.1, 11.1, 14.1) cùng Pāli với 8.2 nhưng 8.2 có thêm ngoặc kép mở nên Việt khác ngoặc.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
