notes: |-
  KỸ THUẬT. Đợt này tôi KHÔNG chạy `npm run validate|test|build|check` — người điều phối
  cấm và chạy tập trung. Vì vậy tôi KHÔNG tuyên bố technical gate pass:
  `technical_integrity` chấm 9,6 chứ không phải 10,0. Bốn lệnh đó để người điều phối
  chạy lại.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG. Không khoá Pāli nào đủ 40 ký tự (khoá dài
  nhất 44 nhưng là `0.4` = `~` và bị `excludeReferenceBlock` loại; khoá thân tối đa
  `1.1` 38 ký tự), nên `cần` rỗng. Tôi tự quét lại TOÀN BỘ 14 khoá (`_chk_w5.py`):
  mọi khoá có bản dịch, không thừa/thiếu, thứ tự khớp Pāli, NFC, không Pāli lọt,
  dấu lược khớp TỪNG khoá (mỗi khoá `1.1`–`1.9` đúng một `…`), ngoặc kép cân, không
  `(…)`.

  COVERAGE. Đo bằng quy tắc của `source/layers.yaml`: `substantiveSegments = 0` → theo
  định nghĩa của kho `ratio = 1`, nên **không** cần mục trong
  `content/meta/reference-gaps.yaml`. Nhưng ngưỡng đó không đo khoá ngắn, nên tôi đếm
  TAY thêm: bản Sujato đã ghim phủ **14/14 khoá** của bài này, kể cả `1.1`–`1.10`.
  Ngược lại, cả 7 bài `thag2` cùng lát chỉ được Sujato phủ 12/13 — khoá `2.5`
  (`… X thero ….`) Sujato để trống, và ở khoá đó Pāli phải đứng một mình.

  ⚠ PĀLI TẠI COMMIT ĐÃ GHIM BỊ CẮT CỤT, VÀ NGƯỜI ĐỌC PHẢI BIẾT. Mười một pháp trong
  `Rāgapeyyāla` đầy đủ phải mở đầu bằng `abhiññāya`, nhưng khoá `an11.983-991:1.1` ở
  đây **bắt đầu bằng `pariññāya…`** — `abhiññāya` không có trong tệp Pāli đã ghim. Tôi
  dịch đúng những gì có, không dựng thêm mục vắng. Bài song song `an11.992-1151`
  (cũng Rāgapeyyāla, cùng 9 genitive) có đủ `abhiññāya` ở `1.16`.

  XUNG ĐỘT CÙNG CÔNG THỨC — ĐÃ ĐI THEO ĐA SỐ, GHI LẠI ĐỂ GỘP. Chín khoá `1.2`–`1.8`
  của bài này có Pāli **y hệt** `an11.992-1151:1.18`–`1.24`, nên theo luật "Pāli trùng thì
  dùng lại nguyên văn" thì phải dùng đúng *để liễu tri / để đoạn trừ trọn vẹn / để
  nhổ bỏ / để chấm dứt / để tan rã / để ly tham / để diệt tận / để xả bỏ* của bài ấy.
  Nhưng **7 bài đang `published`** dùng cách khác cho đúng chuỗi này — `an6.143-169`,
  `an8.121-147`, `an10.240-266`, `an10.267-746`, `an9.95-112`, `an7.618-644`,
  `an3.183-352` — theo đúng thứ tự: *hoàn toàn hiểu rõ / đoạn tận hoàn toàn / từ bỏ /
  đoạn tận / hủy hoại / ly tham / diệt / xả / buông bỏ*. Tôi theo đa số 7:1, vì theo 1
  bài lẻ tôi sẽ tự tạo ra cách thứ ba trong **cùng một loạt AN**. Người điều phối nên
  chuẩn hoá lại `an11.992-1151:1.17`–`1.25` cho khớp (không phải tệp của lát này).
  Cùng lý do, `1.9` `paṭinissaggāya…` tôi dịch *để buông bỏ …* theo 4 bài có đúng dạng
  Pāli đó, và `1.10` theo 3 bài có đúng dạng `ime … dhammā bhāvetabbā”.` →
  *… pháp này cần được tu tập”.*

  ⚠ HAI BÀI `published` CÓ LỆCH MỘT BẬC — BÁO ĐỂ NGƯỜI ĐIỀU PHỐI XỬ LÝ. `an7.645-1124`
  và `an6.170-649` dịch chuỗi 9 genitive **lệch một vị trí**: `pariññāya` ở `1.17` được
  dịch bằng văn bản của `parikkhayāya` (`an7.645-1124:1.17` = *để đoạn tận hoàn toàn …*,
  trong khi Pāli `1.17` là `pariññāya …`), và cứ lệch dần tới `cāgāya → để buông bỏ` ở
  `1.24`. Tôi không sửa hai tệp đó (ngoài lát), nhưng đây là lỗi thật trong bản đã publish.

  `Rāgapeyyāla` ở `0.3`: **1–1 hòa** — `an11.982` dùng *Chuỗi Lặp Tham*, `an11.992-1151`
  dùng *Tập Kệ Rút Gọn Bắt Đầu Bằng Tham*, không có đa số để theo. Tôi chọn *Tập Kệ
  Rút Gọn Bắt Đầu Bằng Tham* vì `an11.983-991` và `an11.992-1151` là hai uid-khoảng anh
  em của cùng một peyyāla và phải đọc giống nhau; `an11.982` là bài đơn lẻ nên giữ cách
  riêng. Nếu người điều phối muốn thống nhất cả peyyāla thì đây là chỗ cần quyết.

  `0.1` giữ số khoảng như 10 bài `an11` đã có (ví dụ `Aṅguttara Nikāya 11.982`,
  `11.992–1151`, dấu nối là EN DASH U+2013). `0.2` `Paṭhamapaṇṇāsaka` → *Nhóm Năm Mươi
  Đầu* theo đa số 7/12 bài an11 đã có. `0.4` = `~` giữ nguyên `~` (12/12).

  THUẬT NGỮ. Chín genitive của Rāgapeyyāla không phải mới — chúng đã có tiền lệ ở 7
  bài nêu trên; điều mới ở đây là chúng nằm trong **uid-khoảng** `an11.983-991`.
