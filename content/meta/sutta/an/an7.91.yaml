notes: |-
  Cùng phẩm và cùng khuôn với an7.87 (xem notes an7.87 về khung bảy pháp).
  āraka → xa lìa (xa lìa 184 lượt); ariya → bậc Thánh (Bậc Thánh 28 lượt).
  Sujato (Numbered Discourses 7.91) đọc ari là foe: because seven foes have
  been nobbled that you become a noble one.
  Bất định đã phân xử: lối chơi chữ āraka/ari (xa kẻ thù) chỉ để ở notes;
  thân kinh giữ xa lìa bảy pháp, không thêm thù nghịch để khỏi đưa diễn
  giải vào nguyên văn.
  Không có bản Việt hiện hành để đối chiếu; triangulation 8.5.
  technical 9.5 vì agent lát không được chạy npm validate, mới chỉ qua
  chốt _hvi (đủ khoá, NFC, ngoặc, dấu lược).
