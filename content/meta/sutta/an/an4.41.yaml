notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** `2.2` **bung** dấu lược `…pe…` thành mô tả đủ bốn tầng thiền (539 ký tự
  cho 85 ký tự Pāli) và `4.3` bung `…pe…` thành liệt kê *các cảm thọ… các tưởng*; cả
  hai trái BRIEF_VI3 §10.1. Đã rút cả hai về đúng một dấu `…`.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): an4.41:4.2 — `vedanā` dịch “cảm thụ” → “cảm thọ” (thuật ngữ
  của glossary; “cảm thọ” áp đảo toàn tầng). Giữ nguyên phần còn lại của từng khoá.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 3.3 — ‘ban ngày như thế nào thì ban đêm như thế ấy…’ → ‘như ban ngày thế nào, ban đêm thế ấy; như ban đêm thế nào, ban ngày thế ấy’ theo 12/13 khoá cùng Pāli (công thức `yathā divā tathā rattiṁ`).

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Hòa thượng Thích Minh Châu. 3 khoá bất đồng nghĩa → sửa 2 (an4.41:6.1: “thế giới này kia, cả trên dưới” → “những điều cao thấp trong đời”, vì `paroparāni` là những điều cao thấp, `lokasmiṁ` là vị trí cách “trong đời”, không có “này kia”; an4.41:6.3: “không đau khổ, không hy vọng” → “không khổ não, không cầu mong”, vì `nirāso` là không còn mong muốn, “không hy vọng” gợi nghĩa tuyệt vọng; theo tiền lệ 12 và 17 khoá của tầng), giữ 1 (an4.41:5.10: bản nguyên bài dịch `pārāyane` thành “phẩm về mục đích”, khác Pāli; giữ “Con Đường Đến Bờ Bên Kia”), bất định 0. Review đối kháng bổ sung, sửa theo Pāli và tiền lệ tầng: `Katamā ca` ở 2.1, 3.1, 4.1, 5.1 “Và nào là” → “Và thế nào là”; `diṭṭhadhammasukhavihārāya` ở 1.3, 2.1, 2.3 “an trú hiện tại lạc trú” (dịch hai lần `vihāra`) → “sự an trú an lạc ngay trong hiện tại” (dn33, an6.29, an1.576-582); 5.4 “thụ” → “thọ” (nhất quán với 4.2 và an8.2). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá. Bài này, khác phần lớn các bài cùng đợt, có bản Anh Sujato đã ghim, nên được đối chiếu cả ba nguồn (Pāli, Anh, Việt nguyên bài) khoá theo khoá: 6.1 “cao thấp” và 6.3 “không cầu mong” đều có chỗ dựa ở bản Anh (high and low; no need for hope).
