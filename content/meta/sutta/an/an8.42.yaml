notes: |-
  **Phạm vi và nguồn.** 86/86 khoá, thứ tự khoá = thứ tự Pāli, không khoá nào ngoài tập Pāli. Pāli root đã ghim là authority. Tầng English: Sujato phủ 46/46 segment Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) = coverage 1,00, vượt ngưỡng 0,80; lớp `english-project` không có và không cần; `reference-gaps` không phát sinh. Tầng `vietnamese-current` vắng (chỉ có Pháp Cú). Bản Hòa thượng Thích Minh Châu nguyên bài (tra cứu toàn văn, không phân đoạn) có lời dịch cho các khoá này nhưng lược "như kinh 41" ở phần tám điều kiện; dùng để đối chiếu thuật ngữ, không ghi vào cột. `triangulation` dựa Pāli + Sujato + Thích Minh Châu nguyên bài + tiền lệ của tầng dự án (an8.43, an8.45, an3.70, an8.41).
  **Hai chỗ Sujato lệch Pāli đã ghim, Pāli thắng.** (1) `3.3`: Sujato liệt kê "Vaccha" và "Persia"; Pāli đã ghim là `vaṅgānaṁ` và `kambojānaṁ` (cùng danh sách ở an3.70, an8.43, an8.45), nên dịch Vaṅga, Kamboja. (2) `3.2` `pahūtarattaratanānaṁ`: Sujato "full of the seven treasures" và Thích Minh Châu "tràn đầy bảy báu"; Pāli không có chữ "bảy", nên dịch "dồi dào châu báu" như an8.43:3.2 và an8.45:4.2.
  **Số Pāli đã tự tính.** `paññāsa vassāni` (4.1) = 50 năm người = một ngày đêm cõi Tứ Đại Thiên Vương; `tiṁsarattiyo māso` = 30 ngày đêm = một tháng; `dvādasamāsiyo saṁvaccharo` = 12 tháng = một năm; `pañca vassasatāni` (4.4) = 5 × 100 = 500 năm trời. `vassasatāni` (5.1) = 100 năm người (xem bất định bên dưới); `vassasahassaṁ` (5.4) = 1.000 năm trời. `dve vassasatāni` (6.1) = 200; `dve vassasahassāni` (6.4) = 2 × 1.000 = 2.000. `cattāri vassasatāni` (7.1) = 400; `cattāri vassasahassāni` (7.4) = 4.000. `aṭṭha vassasatāni` (8.1) = 800; `aṭṭha vassasahassāni` (8.4) = 8.000. `soḷasa vassasatāni` (9.1) = 16 × 100 = 1.600; `soḷasa vassasahassāni` (9.4) = 16 × 1.000 = 16.000. Dãy năm người 50 · 100 · 200 · 400 · 800 · 1.600 gấp đôi liên tiếp từ cõi thứ hai; dãy tuổi thọ trời 500 · 1.000 · 2.000 · 4.000 · 8.000 · 16.000 cũng gấp đôi liên tiếp, cả hai dãy đều nhất quán với nhau. `soḷasannaṁ mahājanapadānaṁ` = mười sáu nước, đếm đủ 16 tên ở `3.3`. `soḷasiṁ` = một phần mười sáu. `paṭhamena aṅgena` (1.7) = điều kiện thứ nhất; `aṭṭhamena aṅgena` (2.4) = điều kiện thứ tám; bản Pāli ghim lược các điều kiện thứ hai đến thứ bảy bằng `…pe…` ở `1.7`.
  **Tiền lệ và đối chiếu Pāli trùng.** Toàn tầng an (cả cây chính lẫn các bài vừa dịch trong đợt này): 63 khoá của bài này có Pāli trùng nguyên văn với bài khác (kể cả tiêu đề và colophon); đã dò 588 cặp, trong đó 115 cặp có bản Việt khác bản này. 59/63 khoá dùng lại nguyên văn một bản đã có (phần lớn từ an8.43 và an8.45: `1.4`–`1.6`, `2.1`–`2.4`, `3.3`, `4.4`, `10.1`–`15.4`; `5.4`, `6.4`, `7.4`, `8.4` từ an3.70). 4 khoá khác tiền lệ có chủ ý: `1.1` và `1.2` (an8.41:2.1, 2.2 có cùng Pāli nhưng dịch "việc giữ trai giới … quả báo lớn lao … thịnh đạt lớn lao"; bản này theo an8.43/an8.45, "trai giới có đủ tám điều kiện … có quả lớn … có sự tỏa rộng lớn", để cả phẩm một thể); `1.3` (Pāli giống an9.18:1.3, an10.120:1.4 viết "vị Thánh đệ tử suy xét như vậy"; bản này viết "thánh đệ tử" thường, 83 khoá so với 5 khoá viết hoa, và giữ "như vậy" vì Pāli có `iti`, 33 khoá "suy xét như vậy" so với 12 khoá "suy xét:"); `3.1` (an3.70:28.1 cùng Pāli nhưng chỉ dịch "Lớn đến mức nào?", mất ba trong bốn vế; bản này theo an8.43:3.1 đủ bốn vế). Các khoá còn lại mang "này các tỳ-kheo" thay cho "này Visākha"/"này Bojjhā" của an8.43/an8.45 (4.1, 4.5, 4.6, 5.1, 5.5 …, 3.2, 3.5, 2.5). Trong chính bài: 5 nhóm Pāli trùng nguyên văn (`1.6`=`2.3`; `4.2`…`9.2` 6 khoá; `4.3`…`9.3` 6 khoá; `4.6`…`9.6` 6 khoá; `4.7`…`8.7` 5 khoá), cả năm Việt giống nhau, 0 nhóm Việt khác (`9.7` Pāli kết `āti` nên đứng riêng nhưng Việt cùng câu).
  **Thuật ngữ.** Tên chư thiên: "Tứ Đại Thiên Vương" (30 khoá ở an), "Ba Mươi Ba" (20), "Yama" (31, so với "Yāma" 2), "Hóa Lạc" (11), "Tha Hóa Tự Tại" (13; dạng "Hóa Tự Tại" ở an3.70). `tusitānaṁ devānaṁ` dịch "Đề Noa", theo an3.70:32.1/32.4 là đoạn có cùng Pāli, và an8.35:3.6, an8.36:7.2–7.3 (3 bài, 8 khoá, đều ở an8/an3); dạng "Tusita" có 11 khoá nhưng ở an6, an7, an10, an11 (danh sách thiên giới và nơi sinh của bậc Nhất lai), "Đâu-suất" 2 khoá. Đây là phân kỳ của tầng, chưa thống nhất; người biên tập nên quyết. `uposatha` dịch "trai giới" theo an8.41, an8.43, an8.44, an8.45 (cùng phẩm); toàn tầng an còn "ngày giới" (46 khoá, so với 48 khoá "trai giới"). `aṅga` dịch "điều kiện" theo cùng phẩm (an3.70 dịch "phần"). Tên kinh `0.3` "Kinh Giữ Trai Giới Tám Điều Kiện (Chi Tiết)": `vitthata` là "chi tiết, được trải rộng" (Sujato "In Detail"), đối với `0.3` của an8.41 "(Vắn Tắt)"; Thích Minh Châu đặt "Ngày Trai Giới" cho cả bài. Đầu đề `0.1` viết "Kinh Tăng Chi Bộ 8.42": ở cây chính toàn tầng an có 923 khoá dạng này so với 388 khoá giữ "Aṅguttara Nikāya", nhưng riêng an8 thì 24 so với 57; chọn theo an8.43 (cùng phẩm) và đa số toàn tầng; đây cũng là chỗ tầng chưa thống nhất.
  **Bất định, ghi lại chứ không sửa thân kinh.** (a) `5.1` Pāli `Yāni … mānusakāni vassasatāni` viết số nhiều và không có số đếm đứng trước (an8.43:5.1 Pāli viết `Yaṁ … vassasataṁ`, số ít). Đọc là 100 năm người, theo an8.43:5.1, an3.70:30.1, Sujato "A hundred years", Thích Minh Châu "Một trăm năm" và theo dãy gấp đôi 50 → 100 → 200; Pāli bản ghim không tự nói rõ "một trăm". (b) `3.3` `etaṁ kalaṁ nāgghati soḷasiṁ`: đọc `etaṁ` là vương quyền cai trị mười sáu nước nêu ở `3.2` không đáng một phần mười sáu của trai giới tám điều kiện. (c) `4.4` Thích Minh Châu viết "Năm mươi năm chư Thiên của năm ấy làm thành thọ mạng", nghĩa là 50 năm trời; Pāli `pañca vassasatāni` là 500 và Sujato "five hundred", nên dịch 500, Pāli thắng. (d) `13.3` `siṅgīsuvaṇṇa`: giữ âm `siṅgī` vì chưa phân xử được nghĩa (Sujato "mountain gold", Thích Minh Châu "vàng cục trong lòng đất"); `13.4` `haṭaka` giữ âm (Sujato "coruscant"). (e) `14.3` `candappabhā tāragaṇā ca sabbe` không có động từ hay phủ định; đọc là so sánh với `14.2` ("cũng như ánh trăng so với mọi đám sao"), không thêm "không sánh". (f) `13.1` `etasmiṁ … antare`: "trong khoảng ấy", hiểu là trong phạm vi mặt trăng và mặt trời vận hành ở `12.2`. (g) `11.2` `chamāyaṁ va sayetha santhate`: "trên đất được trải ra" theo an8.43:8.2. (h) `1.7` là dấu lược `…pe…` của Pāli, Việt giữ đúng một `…`; Pāli kết `….` nên Việt kết ` ….` (dạng đa số của tầng). Các điều kiện thứ hai đến thứ bảy không có trong bản Pāli ghim của bài này, nên bản dịch không bù vào.
  **Dấu lược và nháy.** Pāli có `…pe…` ở một khoá (`1.7`), Việt giữ đúng một `…`; Pāli không có `…` ở khoá nào khác và Việt cũng không có. Nháy đơn ‘’ và kép “” khớp Pāli từng khoá ở 86/86 khoá (12 khoá có nháy); lời của Thế Tôn mở “ ở `1.1` và đóng ” ở `15.4`, các đoạn trích tám điều kiện và câu nói về vương quyền dùng nháy đơn.
  **Kiểm kỹ thuật.** Đã tự kiểm: tập khoá Việt = tập khoá Pāli 86/86, đúng thứ tự; NFC; không khoá rỗng; không khoảng trắng thừa; không còn Pāli lọt sang bản Việt ngoài tên riêng (mười sáu nước) và hai từ giữ âm `siṅgī`, `haṭaka`; đọc lại từng cặp Pāli với Việt. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` nên `technical_integrity` đặt 9,6 và không tuyên bố technical gate đã pass.
