notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato ở commit đã ghim. Tầng Việt hiện
  hành không có bài này: `translation/vi/phantuananh/` ở commit đã ghim chỉ chứa Pháp Cú.
  TRIANGULATION HẠ 8.0, KHÔNG phải vì thiếu cẩn thận: bản Anh đã ghim để trống đúng 2
  khoá (4.4, 4.5) và coverage chỉ lên 100% nhờ lớp lấp `english-project` của chính dự án
  (content/translation/en/project/sutta/an/an6.69_translation-en-project.json, status
  published). Lớp lấp ấy do cùng một tác giả, nên KHÔNG phải một lần đọc Anh độc lập;
  theo AGENTS.md, scorecard tiếng Việt của bài này không được tuyên bố đã đối chiếu Anh.
  4.4 và 4.5 TRÙNG NGUYÊN VĂN Pāli với 3.4 và 3.5 (đã so từng cặp: 3.4==4.4, 3.5==4.5),
  nên 9 khoá 3.4–3.12 và 4.4–4.12 dùng CÙNG một cách dịch, giống hệt nhau.
  1.4 và 2.5 cũng trùng nguyên văn nhau (`Satthugāravatā… kalyāṇamittatā—`) ⇒ dùng lại y hệt.
  3.1–3.13 và 4.3–4.13 khác nhau ở chỗ 3.13 (`atthaṁ ājānāmī"ti`) và 4.13 (`attho daṭṭhabbo"ti`):
  người nói là "tôi hiểu" còn Đức Phật là "phải thấy như vậy" — giữ đúng khác biệt chủ thể.
  `samanuñño satthā ahosi` dịch «Giáo sư hoàn toàn đồng ý»; `padakkhiṇaṁ katvā` dịch
  «cung kính vâng quanh» (giữ "vâng quanh" vì nghĩa hành vi, không dịch "cúng dường" như
  ở 5.7 của sn12.41 — hai cụm Pāli khác nhau).
  `sovacassatā` dịch «dễ dạy»; `kalyāṇamittatā` dịch «thiện hữu» — tra tiền lệ trong tầng
  Việt dự án thì "hữu thiện" và "đồng hữu thiện" đều 0 kết quả; "thiện hữu" là cách đã
  quen trong văn học Việt và đọc rõ trong danh sách sáu pháp.
  1.8 có nháy kép lồng ("Giáo sư đã hoàn toàn đồng ý với con") khớp với `“samanuñño me
  satthā”ti` của Pāli; vẫn cân trên cả bài.
  technical_integrity 9.6: môi trường lát này không có shell, nên không tự chạy được
  `npm run validate`/`test`/`build`; các bài đã tự kiểm bằng bản cài lại logic của
  `_hvi.py` (đủ khoá, không thừa khoá, NFC, không trùng nguyên văn Pāli, số dấu lược
  khớp từng khoá, ngoặc kép cân trên cả bài theo thứ tự số).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 4.13 — thêm hô ngữ ‘Này Sāriputta,’ (Pāli có `sāriputta`; bản cũ bỏ sót; mọi khoá trùng đều có hô ngữ); giữ ‘ý nghĩa chi tiết … vắn tắt’ đồng nhất với 4.2.
  Thống nhất cấp kho 2026-10-17: satthā/satthu- (1.4, 1.7, 1.8, 2.5, 3.3–3.5, 4.3–4.5) «giáo sư» → «bậc Đạo Sư». Căn cứ: satthar là Đức Phật, bậc Đạo Sư (DPD satthar «teacher», Sujato «the Teacher»); «giáo sư» là chức danh hiện đại; kho dùng «bậc Đạo Sư» cho satthugārav-/satthari (s)agārava ở mọi bài còn lại (an6.32, an6.33, an7.32–an7.35, an7.70, dn16…) và cho Samanuñño satthā (an6.21, an6.32, an6.49, an7.32…). Động từ «tôn trọng» (gārava) giữ như cả danh sách của bài.
