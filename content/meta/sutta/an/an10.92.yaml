notes: |-
  Dịch từ Pāli root; đối chiếu bản Anh Bhikkhu Sujato ở commit đã ghim (29/29 segment
  có nội dung đều có chữ Anh, coverage 100%). Tầng Việt hiện hành không có bài này:
  `translation/vi/phantuananh/` ở commit đã ghim chỉ chứa Pháp Cú.
  ĐO TÊN BỘ RIÊNG cho lát này, không dùng đa số toàn tầng: quyển 10 đo ra 19 tệp
  "Aṅguttara Nikāya 10." và 145 tệp "Kinh Tăng Chi Bộ 10." ⇒ chọn "Kinh Tăng Chi Bộ 10.92".
  (Các quyển khác trong lát: an6 = 88 Aṅguttara / 10 Kinh; an8 = 43 / 11; an9 = 45 / 6.
  Người điều phối nói đo cục bộ thì "đảo" ở quyển 6/7/10 — đo lại thì đúng ở quyển 10,
  và quyển 6 ngược với con số đã nêu: 88/10 chứ không phải 83/10.)
  PARALLEL ĐÃ GHI TRƯỚC, dùng lại nguyên văn khi Pāli trùng:
  - an9.27 (đã dịch, cùng công thức 5 bhayāni verāni): 1.1, 3.1, 3.3, 4.1, 4.2, 4.3,
    4.5, 5.1 dùng lại nguyên văn (Pāli giống hệt); 4.4 chỉ khác ở dấu câu (`…pasavati,
    cetasikampi…` → `…pasavati samparāyikampi…`) nên dịch lại đúng nhịp, còn chữ giữ nguyên.
  - sn55.28 và sn12.41 (đã dịch) cho phần `ariyo ñāyo` và dãy duyên khởi: 6.1, 6.2, 6.3,
    6.4, 6.5, 6.17, 6.18, 6.19 dùng lại nguyên văn.
  2.2 và 7.2 phân biệt đúng dấu câu Pāli: 2.2 `…vinipāto. Sotāpannohamasmi…` (chấm)
  còn 7.2 `…vinipāto; sotāpannohamasmi…` (chấm phẩy) — giữ nguyên, đúng như an9.27 đã ghin.
  5.3 và 6.17/4.1/2.2/3.2 có `…pe…`: giữ đúng MỘT dấu lược, không mở rộng (luật BRIEF §10.1).
  6.3–6.4 Sujato nối "that is:" vào 6.3; Pāli đặt `yadidaṁ—` ở cuối 6.4 nên giữ ở 6.4.
  Bất định đã xử lý: `vedanā` trong dãy duyên khởi dịch "thọ" (khớp với thang sắc và với
  sn12.41/sn55.28 đã ghin), không dịch "cảm giác" để tránh lẫn với `viññāṇa` ở 6.6.
  technical_integrity 9.6: môi trường lát này không có shell, nên không tự chạy được
  `npm run validate`/`test`/`build`; các bài đã tự kiểm bằng bản cài lại logic của
  `_hvi.py` (đủ khoá, không thừa khoá, NFC, không trùng nguyên văn Pāli, số dấu lược
  khớp từng khoá, ngoặc kép cân trên cả bài theo thứ tự số).