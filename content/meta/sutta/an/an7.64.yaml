notes: |-
  Dịch từ Pāli root của snapshot SuttaCentral/Bilara đã ghim, đối chiếu với bản dịch tiếng Anh của Bhikkhu Sujato và bản Việt nguyên bài của Hòa thượng Thích Minh Châu (tra cứu toàn văn, không phân đoạn). Tầng Việt hiện hành phân đoạn không có cho bài này.
  Đầy đủ 128 khoá, khoá và thứ tự khoá khớp Pāli, không có khoá nào ngoài tập Pāli. Coverage tiếng Anh: 36 khoá Pāli có nội dung (từ 40 ký tự, bỏ khối đầu đề :0.x); bản Sujato phủ 33/36 = 0,917, đạt ngưỡng 0,80 mà không cần tầng nào khác. Ba khoá còn lại (1.8, 2.6, 7.6) Sujato để trống vì gộp vào khoá liền trước hoặc lược; lớp english-project đã published lấp ba khoá đó (tính cả thì 36/36), nhưng lớp ấy không phải cách đọc Anh độc lập, nên ở ba khoá đó chỉ có Pāli và bản Thích Minh Châu làm đối chiếu. Các khoá colophon 25.5, 25.6 và toàn bộ 26.x (kệ tóm lược) nằm dưới ngưỡng nội dung hoặc không có bản Sujato; Sujato cũng không dịch phần tóm lược.
  Dấu câu: nháy kép và nháy đơn khớp Pāli từng khoá (mở nháy kép ở 1.1, đóng ở 25.4). Pāli có hai nhóm khoá trùng nguyên văn trong chính bài: "Taṁ kissa hetu?" (7 khoá: 1.5, 2.3, 3.3, 4.3, 5.3, 6.3, 7.3) và "Puna caparaṁ, bhikkhave, sapatto sapattassa evaṁ icchati:" (6 khoá: 2.1 đến 7.1); bản Việt giống nhau trong từng nhóm, 0 cặp lệch. Khoá 7.6 có "…pe…" trong Pāli, bản Việt giữ đúng một "…". Pāli không có "(…)" nên bản Việt không có.
  Tiền lệ trùng nguyên văn với tầng: "Taṁ kissa hetu?" 470 khoá, "Vì sao vậy?" 308 (trong bộ Tăng Chi 88/122); "Katame satta?" 58 khoá, "Thế nào là bảy?" 28 (trong bộ 16/25); "Parinibbanti anāsavā”ti." 2 khoá (snp3.12, sn35.136, hai bản Việt khác nhau), chọn dạng của snp3.12; "Bhayamantarato jātaṁ / taṁ jano nāvabujjhati" 3 khoá của iti88, dùng lại nguyên văn "nỗi sợ khởi lên từ bên trong" và "người ta không hay biết điều ấy", cùng "sinh ra bất lợi" và "làm cho tâm dao động" theo các khoá song song của iti88. Số cặp Pāli trùng nguyên văn với tầng đã dò: 3.369 cặp khoá (phần lớn do hai cụm công thức trên, mỗi cụm tính theo từng khoá của bài này), trong đó 1.177 cặp có bản Việt khác; các cụm có nghĩa riêng của bài này (11.3, 14.4) chỉ có một cặp tiền lệ, không cùng ngữ cảnh nên không dùng lại.
  Số: bảy pháp (satta), đếm đủ bảy: xấu xí, ngủ khổ, không lợi ích, mất của cải, mất danh tiếng, mất bạn bè, đọa xứ; các thứ tự paṭhama đến sattama dịch thứ nhất đến thứ bảy; Ekādasamaṁ là thứ mười một; chaṭṭho là thứ sáu.
  Thuật ngữ và bất định:
  (1) sapattakantā sapattakaraṇā: dịch "được kẻ thù ưa thích, tiếp tay cho kẻ thù" (Sujato: please and assist an enemy; Thích Minh Châu: tác thành kẻ thù địch). Vế sapattakaraṇā (tạo nên điều kẻ thù làm) có thể đọc khác nhau; bản này giữ nghĩa trung tính "tiếp tay".
  (2) kodhana: "dễ nổi giận" theo mn15 (40 khoá, một bài); kodhābhibhūto "bị cơn giận chế ngự" (mn15 dùng "bị cơn giận chi phối" cho kodhābhibhūto; ở đây kodhapareto dành chỗ "chi phối" nên chọn "chế ngự" cho abhibhūta, theo an3.65 và an3.71).
  (3) 2.5: Pāli đã ghim chỉ có gonakatthate paṭalikatthate, không có paṭika (tấm trắng) mà Sujato và Thích Minh Châu đều có; bản này theo Pāli, không thêm "trắng". Mô tả giường theo an3.35, an5.44, mn12.
  (4) 3.5 và 9.3–9.4: attha / anattha "lợi ích" / "bất lợi". 9.4 anatthaṁ adhipajjati: nghĩa đen "đi đến, rơi vào điều bất lợi"; Sujato và Thích Minh Châu hiểu là nhận lầm hoặc cảm thấy điều ấy là bất lợi, theo mạch 3.5. Bản này chọn "rơi vào" để không khẳng định thêm; bất định giữa kết quả thực và nhận thức.
  (5) 3.6: Tassime dhammā aññamaññaṁ vipaccanīkā gahitā: "những pháp này, bị nắm giữ theo cách đối nghịch nhau". Thích Minh Châu hiểu khác (khiến người khác thành thù địch); bản này theo Pāli, bất định ở chỗ hai pháp nào đối nghịch nhau.
  (6) 4.5: các vế của cải theo an5.41, an5.58, an8.76; "mồ hôi giọt rơi" theo an5.41/an5.58 (10 khoá), "có được đúng pháp" theo an8.76 cho dhammaladdhā. Chủ ngữ khoá cuối (kodhābhibhūtassa) dịch là sở hữu cách, không thêm quan hệ nhân quả.
  (7) 5.5: tamhāpi dhaṁsati, dhaṁsati đi với xuất xứ cách: "sa sút khỏi chính danh tiếng đó" (Sujato: falls to dust; Thích Minh Châu: danh tiếng ấy lánh xa họ; an4.61 dịch "bị tan rã"). Bất định về sắc thái.
  (8) Cõi khổ: "cảnh khổ, cảnh xấu, cảnh đọa, địa ngục" cho apāyaṁ duggatiṁ vinipātaṁ nirayaṁ, dạng có 37 khoá trong tầng (trong bộ Tăng Chi dạng "cõi ác, ác thú, cõi đọa" nhiều hơn nhưng không dịch paraṁ maraṇā); paraṁ maraṇā dịch riêng thành "sau khi chết". duccaritaṁ carati: "hành ác hạnh bằng thân / khẩu / ý" theo bộ Tăng Chi (17 khoá dạng này); "khẩu" 31 so với "lời" 10 ở những nơi Pāli dùng vācāya.
  (9) Kệ, các chỗ chưa phân xử được, đã chọn nghĩa ít giả định nhất:
  10.2 vadhaṁ katvāna: vadha vừa "giết" vừa "đánh hại"; Sujato "kills", Thích Minh Châu "đả thương"; bản này "gây tổn hại".
  11.1 kodhasammadasammatto "say cuồng vì cơn giận"; 11.2 āyasakyaṁ "tai tiếng" (Sujato: disgrace).
  14.1–14.2 yaṁ kuddho uparodheti, sukaraṁ viya dukkaraṁ: nghĩa đen mơ hồ; Sujato đọc "phá hoại dễ dàng điều khó dựng", bản này giữ nguyên thế đối lập "khó làm mà như dễ làm". Ý chính của cả đoạn (14.3–14.4: hối hận sau khi hết giận) không đổi.
  15.1 dummaṅkuyaṁ "vẻ sầm mặt"; 15.3–15.4 yato patāyati kodho, yena kujjhanti mānavā: không rõ cơn giận của ai và ai "khiến" ai (Sujato: họ khiến người khác nổi giận); bản này dịch trung tính "khi cơn giận bùng lên, do đó người đời nổi giận".
  17.2 yāni dhammehi ārakā: dhammehi số nhiều, dịch "xa cách các pháp", không thêm "thiện"; Sujato: far from those that are good.
  18.2 samātaraṁ: dịch "mẹ mình" (sa- là "của mình"), Sujato "their mother, too".
  18.3 brāhmaṇaṁ: "Bà-la-môn" (Sujato: saint, Thích Minh Châu: Phạm chí); nghĩa "bậc A-la-hán" có thể có trong kệ nhưng Pāli không nói rõ.
  19.3 pāṇadadiṁ santiṁ: santiṁ có thể là "đang là" hoặc "hiền thiện"; bản này theo Sujato ("good woman"), "người hiền thiện đã ban cho sự sống".
  20.1 attūpamā "lấy chính mình làm ví dụ"; 20.3 puthuttānaṁ "tự giết mình theo nhiều cách" (khoá này ở bản Sujato mang ký hiệu chỉnh sửa, dấu hiệu của dị bản).
  21.3 rajjuyā bajjha: nghĩa đen "buộc bằng dây"; hiểu "treo cổ" là suy diễn của Sujato; bản này ghi "buộc mình bằng dây mà chết". 21.4 pabbatāmapi kandare: "chết nơi khe vực của núi", không nói chi tiết cách chết.
  22.1 bhūnahaccāni: Sujato "baby-killing", Thích Minh Châu "sát sanh"; chú giải hiểu là phá hoại sự tăng trưởng; bản này chọn "hủy hoại sự phát triển" (bất định cao).
  23.1 itāyaṁ: nghĩa không rõ (có thể "iti ayaṁ"), dịch "Đây, mang hình dạng cơn giận"; 23.2 maccupāso guhāsayo "bẫy của Thần Chết ẩn trong hang" theo ja366 và dhp37 (guhāsaya).
  23.4 diṭṭhiyā: "chánh kiến" theo ngữ cảnh tích cực (Sujato: right ideas), Pāli chỉ nói "kiến".
  24.1 yathā metaṁ akusalaṁ: cấu trúc yathā…tatheva có thể đọc nhiều cách; "me" có thể là "của mình"; bản này dịch "Giống như điều bất thiện này của mình / bậc trí nên cắt đứt hoàn toàn / Cũng vậy, nên học tập trong các pháp". 24.4 mā no dummaṅkuyaṁ ahu "chớ để nơi chúng ta có sự sầm mặt".
  (10) Các phần tóm lược: 26.x dịch theo tên các bài an7.54 đến an7.63 đã có trong tầng; "kodhekādasā" = "giận dữ" và "thứ mười một".
  (11) Tên kinh "Kinh Người Dễ Nổi Giận" (Sujato: Irritable; Thích Minh Châu: Sân Hận); tên phẩm dùng "6. Phẩm Những Điểm Không Tuyên Bố" theo an7.54 đến an7.63.
  Đã đối chiếu ba nguồn nhưng không copy nguyên văn bản nào; mọi chỗ khác nhau đáng kể giữa ba nguồn đã được ghi ở các mục trên.
