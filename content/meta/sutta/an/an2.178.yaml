notes: |-
  Ba khoá công thức 1.1/1.2/1.4 có Pāli giống hệt bài anh em đã published nên dùng lại nguyên văn: Có hai loại pháp, này các tỳ-kheo. / Thế nào là hai? / Này các tỳ-kheo, đây là hai loại pháp. (an2.163, an2.168, an2.169, an2.176, an2.177).
  Khoá 1.3: muṭṭhassacca thành thất niệm (tiền lệ cụm liệt kê thất niệm trong tầng Việt); asampajañña thành thiếu tỉnh giác (glossary sampajañña: tỉnh giác, phủ định là thiếu tỉnh giác).
  Bản Anh Sujato đã ghim có đủ mọi khoá của bài; tầng Việt hiện hành không có Tăng Chi Bộ (bilara chỉ chứa Pháp Cú) nên đối chiếu Pāli + Anh.
  Tiêu đề Kinh Thất Niệm là tên mô tả do người biên tập đặt vì bản Anh Sujato không đặt tên riêng cho bài này; 0 tiền lệ, ghi rõ ở đây.
  Không có blocker; điểm trung bình số học thô 9.48 nên published.
