notes:
  - >-
    **Hai mươi bốn lỗi chấm câu của Pāli: mở dấu `“` rồi không đóng.** Đếm được
    14 bài: `an5.242`, `an5.243`, `an5.246`, `an5.247`, `an7.86`, `an9.48`,
    `an9.50`, `an9.53`, `an5.55`… nói rõ là `an9.55`, `an9.56`, `an9.57`,
    `an9.58`, `an9.59`, `an9.60`. Ở mỗi bài, `1.1` mở `“` và không segment nào
    đóng lại (độ sâu kép cuối = 1). Tôi đóng ngay sau mệnh đề cuối của `1.1` để
    người đọc không gặp dấu ngoặc treo, và **đây là cố ý lệch 14 segment** — bộ
    kiểm tra báo đúng mười bốy chỗ ấy, không phải sót sót. Pāli không bị sửa.
  - >-
    `dhana` → *của cải* (0 tiền lệ ở nghĩa này, đặt mới; chương 8 đã dùng *của
    cải* cho `necayiko` và *tiền tài và nông sản* cho `dhanadhañña`, nên giữ
    nhất quán). `suta` → *nghe học* (`an10.17:2.1` *đa văn, nghe nhiều*), `cāga`
    → *bố thí* (`an10.53:2.2`), `Adaliddoti` → *không thiếu* và `amoghaṁ
    jīvitaṁ` → *không uổng phí* (cả hai 0 tiền lệ, đặt mới).
  - >-
    **Bài có kệ tụng, không chỉ liệt kê.** Mười hai vế kệ `2.1`–`4.4` tôi dịch
    thành từng vế, giữ dấu chấm phẩy và chấm câu đúng Pāli. `2.2` (`hirī
    ottappiyaṁ dhanaṁ`) chỉ có **một** lần `dhanaṁ` cho hai mục — bản đầu tôi
    lặp *của cải* hai lần cho đủ nhịp, đã bỏ để khớp lực lược của Pāli.
  - >-
    **`1.4` không có `”` và đó là ĐÚNG**: `“` mở ở `1.1` và đóng ở `4.4`
    (`sāsanan”ti.`); `dhanānīti` chỉ là `dhanāni iti` dính liền chứ không phải
    dấu đóng. Bản đầu tôi tưởng là lỗi Pāli và thêm `”`, làm độ sâu kép thành
    −1; đã sửa.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Chi Bộ không có bản Thích Minh Châu để
