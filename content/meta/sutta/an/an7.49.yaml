notes: |-
  Đợt 19, lát l30. Dịch từ Pāli root đã ghim, đối chiếu English Sujato đã ghim và bản Hòa thượng Thích Minh Châu (SuttaCentral, nguyên bài, không phân đoạn) làm tham khảo thuật ngữ.

  **Coverage Anh trên Pāli có nội dung: 38/71 = 53,5%** (khoá Pāli ≥ 40 ký tự, bỏ khối :0) — dưới sàn 0,80. Sujato để trống 33 khoá dù Pāli viết đủ (4.3–5.7, 6.3–7.7, 8.4–9.7, 10.4–11.7, 13.1–13.7, trừ các khoá cuối khối). Chưa có lớp english-project cho bài này, và lớp ấy nếu có cũng không phải cách đọc Anh độc lập. Vì vậy bài giữ draft và triangulation ≤ 8,0 (chấm 7,0) cho đến khi lớp lấp English phủ các khoá trống. Bản Việt vẫn dịch trọn 94/94 khoá từ Pāli, không cắt xén.

  **Dùng lại nguyên văn đã có (Pāli trùng byte):** an7.48:1.1 → 1.1; an7.48:2.2 → 1.3 (danh sách bảy; an7.617:1.3 và an9.93:1.3 cùng cách dịch nhưng Pāli khác ở cuối khoá); an7.48:2.3 → 17.1 (1.4 là cùng câu nhưng Pāli không có nháy kép đóng nên bỏ nháy). `Itiha tattha sampajāno hoti` → *Như vậy, vị ấy tỉnh giác rõ ràng về điều đó* (15 khoá ở mn122 viết *điều đó*, 2 khoá ở an8.9 viết *điều ấy*; chọn đa số tầng). `iti kho panetaṁ vuttaṁ. Kiñcetaṁ paṭicca vuttaṁ?` → *đó là điều đã được nói. Được nói đến vì nhân duyên gì?* (24 khoá mn137/139/140/148; cũng có dạng ngôi *Ta* ở an10.54 ×6, an4.192 ×4, mn54 — Pāli ở đây là thể bị động nên không thêm *Ta*). `iti yaṁ taṁ vuttaṁ idametaṁ paṭicca vuttaṁ` → *đó là điều đã được nói; chính do nhân duyên này, điều ấy được nói* (12 khoá mn137/139). `Kiñcetaṁ paṭicca vuttaṁ?` đứng riêng → *Được nói đến vì nhân duyên gì?* (11 khoá an9.36, an10.28). Dạng ‘…’ — đó là điều đã được nói theo an9.36. Số cặp Pāli trùng với bài khác đã dò: 839 cặp trên 33 khoá của bài này, trong đó bản Việt giống 634 và khác 205 (205 khoá lệch chủ yếu là các công thức bị động ở trên, mỗi công thức đã có nhiều dạng trong tầng; đã chọn dạng đa số). Trong chính bài này 4 nhóm Pāli trùng, 121 cặp, bản Việt khác nhau 0.

  **Thuật ngữ, có đếm:** `saññā` trong danh sách bảy → *niệm tưởng …* (an7.48, an7.617, an9.16, an9.93, an5.303). `āhāre paṭikūlasaññā` → *niệm tưởng khinh thiểu về thức ăn* theo an7.48 (5 khoá; dạng *không sạch trong thức ăn* ở an5.61/62/69… cũng có, chọn dạng của bài anh em kề bên). `bhāvanābalaṁ` → *lực tu tập* (8 khoá, so với *sức tu tập* 3 khoá). `pubbenāparaṁ viseso` → *sự thù thắng càng về sau càng cao hơn trước* (sn47.10, mn89, mn118; không có chữ *uḷāra* ở đây nên bỏ *cao cả*). `rasataṇhā` → *khát ái về vị* (sn18.8, sn25.8, sn27.8). `lābhasakkārasiloko` → *lợi dưỡng, cung kính và danh tiếng* (đa số ở SN; trong AN còn có *lợi dưỡng, tôn kính và danh vọng* 8 khoá và *được cho, được tôn kính và danh tiếng* 6 khoá). `ahaṅkāramamaṅkāramānāpagataṁ mānasaṁ … vidhāsamatikkantaṁ santaṁ suvimuttaṁ` → theo sn22.92:1.3 và 2.6 (cùng câu Pāli). `ukkhittāsike vadhake` → *kẻ giết người cầm gươm đã rút* (an6.103:1.3). `tibbā bhayasaññā` → *tưởng sợ hãi dữ dội* (an4.244, 4 khoá). `kukkuṭapattaṁ vā nhārudaddulaṁ vā` → *lông gà hay mẩu gân* (mn28:17.4). `pāṭikulyatā … saṇṭhāti` → *sự chán ghét được thiết lập* (an5.30). `amatogadhā amatapariyosānā` → dùng nguyên cách của an7.48 (2 khoá) để hai bài kề nhau khớp; đa số tầng (≈10 khoá an5.61/62…) viết *chìm đắm trong vị bất tử, với bất tử làm cứu cánh*, và có chữ *vị* mà Pāli không có — nên không đổi theo.

  **Bất định, ghi để người biên tập phán:**
  - `13.1` (và đối xứng với `13.4`): Pāli là `tibbā bhayasaññā, na paccupaṭṭhitā hoti, seyyathāpi, bhikkhave, ukkhittāsike vadhake`. Đọc sát chữ, mệnh đề so sánh *như kẻ giết người cầm gươm* đứng sau mệnh đề phủ định, giống hệt ở `12.3` và `13.4` (xác định). Bản Việt giữ nguyên cấu trúc ấy, chỉ thêm/bỏ *không* như Pāli, nên hai khoá đối xứng nhau. Bản Thích Minh Châu tự thêm *không giống như* để giải nghĩa; Sujato để trống 13.1. Ý nghĩa giáo lý không đổi (tưởng khổ trong vô thường chưa có sức thì nỗi sợ sắc bén chưa hiện khởi), nhưng cách đọc câu so sánh chưa phân xử được.
  - `15.1`: Pāli chỉ có một `na` đứng trước cả chuỗi `ahaṅkāramamaṅkāramānāpagataṁ mānasaṁ hoti vidhāsamatikkantaṁ santaṁ suvimuttaṁ`. Bản Việt phân phối phủ định cho cả bốn vế (không lìa chấp…, không vượt qua so đo, không tịch tịnh, không khéo giải thoát) theo Sujato và Thích Minh Châu; cách đọc chặt hơn (chỉ phủ định vế đầu) cũng khả dĩ về ngữ pháp.
  - `jīvitanikantiyā` → *sự ham muốn đời sống*: Sujato dịch *desire to be reborn*, Thích Minh Châu *thích thú sự sống*; chọn nghĩa đen của `jīvita` (mạng sống/đời sống) và `nikanti` (ham muốn, quyến luyến).
  - `patilīyati patikuṭati pativattati, na sampasāriyati` → *co rút lại, cuộn lại, quay lui, không vươn ra*, dùng chung cho tâm và cho lông gà/mẩu gân để giữ nguyên hình ảnh so sánh; Thích Minh Châu viết *thối lui, trở lưng, quay lưng, không căng thẳng*.
  - `ālasye kosajje vissaṭṭhiye pamāde ananuyoge apaccavekkhaṇāya`: sáu từ đều ở vị trí đối cách nơi chỗ (locative) trừ `apaccavekkhaṇāya`; dịch chung là *đối với sự lười biếng, biếng nhác, buông thả, phóng dật, không chuyên tâm, không quán xét lại*. Không thêm chữ *nguy hiểm* như Sujato.
  - `0.2` giữ *Phẩm Đại Tri Kiến* theo 9 bài cùng phẩm đã dịch; `Mahāyaññavagga` nghĩa đen là phẩm về đại tế đàn (Sujato: A Great Sacrifice) — không sửa trong lát này.

  **Số:** *bảy* (`satta`) khớp với danh sách ở `1.3`: bất tịnh, sự chết, thức ăn, thế gian, vô thường, khổ trong vô thường, vô ngã trong khổ = 7. Colophon `Chaṭṭhaṁ` → *Thứ sáu* (258 khoá cùng dạng trong tầng).

  **Kỹ thuật:** technical_integrity chấm 9,6 vì chưa chạy bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build`; cần chạy trước khi coi cổng kỹ thuật là đạt. Kiểm cấu trúc: đủ 94/94 khoá, 0 khoá ngoài Pāli, nháy đơn/kép khớp Pāli từng khoá, 8/8 khoá có `…pe…` giữ đúng một `…`, 0 khoá rỗng, NFC.

  **Giải quyết draft 2026-10-12.** Đọc đối kháng toàn bài từ Pāli, đối chiếu Sujato (38/71 khoá có nội dung được phủ) và bản Hòa thượng Thích Minh Châu nguyên bài ở mục Tra cứu toàn văn (chỉ để hiểu cách đọc). Các mục "Thuật ngữ" ở trên về *niệm tưởng khinh thiểu về thức ăn*, *niệm tưởng không ham muốn trong tất cả thế gian* và *kẻ giết người cầm gươm đã rút* **bị thay thế** bởi các sửa dưới đây.
  - **Khoá đổi (20/94 khoá có chữ đổi, 3 lỗi nghĩa):** (1) `āhāre paṭikūlasaññā` → *niệm tưởng ghê tởm đối với thức ăn* (1.3, 6.1, 6.2, 6.4, 7.1, 7.2, 7.4, 7.5, 7.7). *Khinh thiểu* không có căn cứ ở `paṭikūla` (nghĩa gốc: đáng ghê tởm, đáng nhờm gớm); Hòa thượng Thích Minh Châu viết *nhàm chán đối với món ăn*, dn34 và sn46.69 dùng *ghê tởm*. Tầng hiện còn *khinh thiểu* 17 khoá/9 tệp (an1.467, an1.478, an5.303–304, an7.48, an7.617, an9.16, an9.93), *không sạch trong thức ăn* 11 tệp, *ly khuất về thức ăn* 4 khoá (an4.163, an4.169), *ghê tởm* 3 khoá; các tệp kề bên chưa sửa, cần người biên tập phán. (2) `sabbaloke anabhiratasaññā` → *niệm tưởng không hoan hỷ đối với tất cả thế gian* (1.3, 8.1, 8.3, 8.5, 9.1, 9.2, 9.4, 9.5, 9.7). `anabhirata` là *không vui thích/không hoan hỷ*, không phải *không ham muốn* (ham muốn là một nghĩa khác, thuộc loại `icchā`/`lobha`); khớp dn34 (*không hoan hỷ đối với toàn thể thế gian*) và Hòa thượng Thích Minh Châu. Tầng còn *không ham muốn* 7 tệp (cùng nhóm với trên), *không yêu thích* 11 tệp. (3) `ukkhittāsike vadhake` → *kẻ giết người đang giơ gươm lên* (12.3, 13.1, 13.4): `ukkhitta` là giơ lên/nâng lên, không phải *đã rút*; ps1.1:544.2 và ps1.4:105.2 (cùng Pāli) viết *đang giơ gươm lên*, Hòa thượng Thích Minh Châu *giơ đao lên*. an6.103:1.3 viết *đã rút* (1 khoá).
  - **Đã đọc và giữ:** *đã được tăng cường* cho `bahulīkatā` (49 khoá/18 tệp so với *sung mãn* 270 khoá/66 tệp — cả hai đều chấp nhận được, không phải lỗi nghĩa; glossary nêu *sung mãn*); *dựa vào chỗ không chết* cho `amatogadhā` (9 tệp, sn45.139 cùng dạng; *nhập vào bất tử* 14 khoá cũng có; chọn nghĩa *chỗ đứng/nơi nương* của `ogadha`); *ham muốn đời sống* cho `jīvitanikantiyā`; *những thứ sặc sỡ của thế gian* cho `lokacitresu` (Hòa thượng Thích Minh Châu: *lòe loẹt của thế giới*; 4 khoá chỉ ở bài này). Số 7 khớp danh sách ở 1.3; *Thứ sáu* cho `Chaṭṭhaṁ`.
  - **Blocker đã gỡ (phân loại B):** blocker độ phủ English (38/71 = 0,535) do tác giả cũ tự đặt; Sujato bỏ trống 33 khoá Pāli có nội dung, gồm 4.3–5.7, 6.3–7.7, 8.4–9.7, 10.4–11.7 và 13.1–13.7 (trừ các khoá cuối khối). Các khoá ấy là công thức lặp lại y hệt khối 2–3 (khối đã được Sujato dịch) với chỉ một thay đổi: tên tưởng và chỗ tâm co rút (*jīvitanikanti*, *rasataṇhā*, *lokacitra*, *lābhasakkārasiloka*), cộng ba cặp `…pe…`. Đã đọc đối kháng từng khoá từ Pāli: các vế đổi đều ghép đúng với bản Việt, ba cặp `…pe…` giữ đúng một `…`, 13.1–13.7 chỉ khác 12.3 ở chữ *na paccupaṭṭhitā* và các câu kết đã khớp với 3.x. Mất mát English được ghi nhận ở `content/meta/reference-gaps.yaml`, không còn là lỗi văn bản. `triangulation` nâng nhẹ từ 7,0 lên 7,5 (có bản Thích Minh Châu đối chiếu mọi khoá, nhưng không có bản Anh độc lập ở 33 khoá nên không vượt 8,0). Tầng `vietnamese-current` ở snapshot đã ghim chỉ có Pháp Cú, đó là giới hạn của tham chiếu, không phải lỗi văn bản.
  - **Bất định còn (không phải blocker):** 13.1/13.4 và 15.1 như đã nêu ở mục Bất định ở trên (vị trí mệnh đề so sánh `seyyathāpi…vadhake` sau phủ định; phạm vi của một `na` ở 15.1). Cả hai bản Anh Sujato lẫn Việt nguyên bài đều cho ý giáo lý như bản này.
  - **Kỹ thuật:** technical_integrity giữ 9,6 vì chưa chạy bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build`; tệp dịch vẫn đủ 94/94 khoá, thứ tự khoá theo Pāli, nháy đơn/kép khớp Pāli từng khoá.
