notes:
  - >-
    **Bài mở đầu phẩm, và là mẫu của cả năm bài kế**: ẩn dụ soi gương, rồi hai
    mục — thấy thế bất thiện thì đoạn, thấy thế thiện thì an trú.
    `an10.52`–`an10.54` lặp y nguyên bố cục này.
  - >-
    **`Sacittavagga` → *Phẩm Tâm Mình*** (0 segment tiền lệ, đặt mới): Sujato
    dịch tên phẩm là *Your Own Mind*, và cả phẩm nói đúng một việc — soi lại
    **tâm mình** (`sacittapariyāyakusala`). Tên bài `Sacittasutta` → *Kinh Chăm
    Chính Tâm Mình*.
    **`Sacittavaggo paṭhamo` ở `an10.60:15.5` dịch là *Phẩm Tâm Mình, thứ
    nhất*** — đây là **số thứ tự của chính Bilara đánh số lại**, vì phẩm này rõ
    ràng là thứ sáu trong Bộ Mười (đúng như `6.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Cả ẩn dụ gương / bát nước đều là thuật ngữ 0 tiền lệ, đặt mới**:
    `mukhanimitta` → *hình bóng khuôn mặt*, `maṇḍanakajātiko` → *thích trang
    điệm*, `raja` → *bẩn bẩn*, `aṅgaṇa` → *tế nhị*, `paccavekkhamāno` → *phản
    tư* (theo `an5.149:1.3`, vốn dùng *phản tư* cho động từ này),
    `paccavekkhaṇā` → *việc phản tư*.
  - >-
    **Lượt review đối kháng bắt được lỗi nghiêm trọng nhất chương, ở sáu
    segment.** Danh sách 20 mục trong Pāli kết bằng `… āraddhavīriyo,
    **asamāhito, samāhito**` — tức *chưa đạt định* rồi mới *đã đạt định*. Bản
    đầu của tôi đảo thứ tự này, và vì **cả hai danh sách 10 mục lấy từ chính
    danh sách 20 mục**, mục cuối của `an10.51:4.2` và `:5.2` (lặp y ở
    `an10.53:7.2`/`:8.2`) **bị đảo cả cực tính**: danh sách “xấu” lại kết bằng
    *đã đạt định*, danh sách “tốt” lại kết bằng *chưa đạt định*. Đây đúng là
    loại lỗi mà đọc lướt sẽ không thấy, vì mười mục đầu vẫn đúng. Đã sửa, và
    hiện dùng hai hằng số tách riêng `XẤT` / `TỐT` với chỉ số tường minh.
  - >-
    **Danh sách 20 trạng, mười trạng “xấu” và mười trạng “tốt”, dùng tiền lệ có
    thật**: `uddhato` → *hung hãn* và `anuddhato` → *không hung hãn* theo
    **`an3.115:1.5`/`:2.2`** (cùng cặp từ, đã `published`); `kusīto` → *biếng
    lười* theo `an3.40:3.9`; `cetosamatha` → *sự an định của tâm bên trong* và
    `adhipaññādhammavipassanā` → *thắng tuệ quán các pháp* theo
    **`an4.92:1.3`**, `an4.93:4.1`.
    Không có tiền lệ, đặt mới: `byāpannacitto` → *tâm bị chi phối*,
    `thinamiddhapariyuṭṭhito` → *chìm đắm trong hôn trầm thụy miên*,
    `vigatathinamiddho` → *đã hết hôn trầm thụy miên*, `vicikiccho` → *đầy
    nghi*, `tiṇṇavicikiccho` → *đã hết nghi*, `kodhano` → *nóng nảy*,
    `saṅkiliṭṭhacitto` → *tâm bị nhiễm* (âm tính dựa trên `an3.65` dùng *có tâm
    không ô nhiễm*), `sāraddhakāyo` → *thân cường trì*.
    `āraddhavīriyo` ở đây là **tính từ đứng riêng** trong danh sách, không phải
    mệnh đề dài của `an10.50`; tôi dùng *tinh tấn kiên trì* (11 segment ở AN5)
    chứ không dùng *an trú với tinh tấn đã khởi* (2 segment ở `an10.50`) — xem
    `docs/translation-notes/araddhaviriya-and-udayatthagamiya-split.md`.
  - >-
    **`adhimatto chando … sati ca sampajaññañca` dùng nguyên văn `an4.93:4.1`**
    (đã `published`) — *hăng say tâm, cố gắng, tinh tần, dõng mãnh, không ngại
    khó, có niệm, biết tỉnh*; và `nibbāpanāya` → *để dập tắt* cho ẩn dụ thân
    cháy / đầu cháy. `sevati`/`sevitabba` → *dùng* / *nên dùng*.
  - >-
    **Cách diễn đạt hai danh sách 20 và 10 mục là quyết định riêng, ghi lại để
    người sau không tưởng là lệch.** Pāli hỏi `X nu kho bahulaṁ viharāmi` cho cả
    hai mươi mục; dịch đúng nghĩa ra *“Ta có sống nhiều trong tham dục chăng,
    không sống nhiều trong tham dục chăng, …”* — mười hai cụm như thế thì không
    đọc nổi. Tôi dùng hai khuôn: câu hỏi gom thành *“Ta có hay không: tham dục
    nhiều, không tham dục nhiều, …”*, còn danh sách khẳng định thì để trần
    *“tham dục nhiều, tâm bị chi phối nhiều, …”*. Cả hai đều giữ đủ hai mươi hay
    mười mục và giữ `bahulaṁ` (nhiều) ở từng mục.
    **Vế cuối dùng *ạ* thay cho dấu hỏi** ở `3.6`, vì Pāli kết bằng
    `vharāmī’ti.` — không có `?`; so dấu hỏi theo **sự hiện diện** chứ không
    theo vị trí, nên thêm `?` vào đây là sai.
  - >-
