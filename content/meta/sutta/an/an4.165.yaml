  notes: |-
    Lượt cải thiện 2026-10-14 (bài trước đó chưa có ghi chú; điểm cũ 9.51 chưa phản ánh các lỗi dưới đây, nên điểm mới được chấm lại từ đầu, không phải nâng).
    Khoá đổi (4/26): 2.2, 3.2, 4.6, 4.8. Lỗi nặng 0; vừa 3 (2.2 và 3.2 thiếu một vế của chuỗi bảy tính từ, thiếu uppannānaṁ và jātiko trong adhivāsakajātiko, "chỉ trích" là nghĩa thêm vào cho vacanapatha; 4.8 anvāssaveyyuṁ là thức mong khả năng nhưng dịch "sẽ xâm chiếm" như chắc chắn); nhẹ 3 (2.2/3.2 "cắn xâu" cho pasamphassānaṁ và "cảm thụ" cho vedanā; 4.6 "chạm xúc chạm" lặp chữ).
      - 2.2/3.2: chuỗi dukkhānaṁ tibbānaṁ kharānaṁ kaṭukānaṁ asātānaṁ amanāpānaṁ pāṇaharānaṁ nay đủ bảy vế (thêm "xót xa" cho kaṭuka theo mn125:30.1 và mnd16:176.7); "cảm thụ" → "cảm thọ" (glossary vedanā = thọ; tầng đo 2320 cảm thọ / 55 cảm thụ); "sự cắn xâu của ruồi muỗi, gió nắng, loài bò sát" → "sự xúc chạm của ruồi, muỗi, gió, nắng và loài bò sát" (công thức pasamphassānaṁ: 9 xúc chạm / 2 đụng chạm trong tầng; mn2:18.2, dn29:22.6); "các lời chỉ trích thô tục khó chịu" → "những lời nói thô ác, khó nghe" (vacanapatha là lối nói, không có nghĩa chỉ trích; mn125:30.1, mn119:35.1); thêm "đã sanh" (uppannānaṁ, cùng cách dịch uppanna ở 5.2) và "có bản tính chịu đựng" (adhivāsakajātiko; ở 2.2 là "không có bản tính chịu đựng"), giữ chữ "chịu đựng" cho cả khamo lẫn nādhivāseti ở 5.2 để giữ nét đối lập trong Pāli. Điểm đổi: semantic_fidelity 9.4→9.3, grammar_logic 9.4→9.3.
      - 4.6: "sau khi chạm xúc chạm với thân" → "sau khi chạm xúc với thân" (phoṭṭhabbaṁ phusitvā; tầng đo 7 khoá lặp "chạm xúc chạm" so với 11+7+7 khoá "chạm xúc bằng thân / khi thân chạm xúc"). Điểm đổi: vietnamese_clarity 9.4→9.3, terminology 9.3→9.2 (cùng với tiêu đề, xem dưới).
      - 4.8: "các pháp ác bất thiện là tham lam và ưu não sẽ xâm chiếm; vì sự chế ngự ấy, vị ấy thực hành" → "… có thể tràn vào, nên vị ấy thực hành để chế ngự nó". Thức mong khả năng anvāssaveyyuṁ: tầng đo ba mươi hai khoá, "có thể tràn vào / tràn ngập" chiếm đa số (khoảng 50), "sẽ xâm chiếm" chỉ ở họ an4 (13); tassa saṁvarāya là cách chỉ mục đích "để chế ngự", không phải "vì sự chế ngự ấy". Bản Anh Sujato cũng dùng thức khả năng.
    Điểm chấm lại: source_provenance 10.0; semantic_fidelity 9.3; grammar_logic 9.3; segment_alignment 10.0; terminology 9.2; triangulation 9.0 (Pāli + Sujato + các bài song song trong tầng; không có bản Việt phân đoạn); vietnamese_clarity 9.3; han_viet_balance 9.4; ambiguity_integrity 9.2; technical_integrity 9.6. Trung bình 9.43; không blocker nên vẫn published (> 9.0).
    Bất định còn lại, không đổi: (1) tiêu đề "Kinh Bậc Kiên Nhẫn" (khama là tính kiên nhẫn của một lối thực hành, không phải một bậc người; Sujato dịch Patience); giữ nguyên vì trùng an4.164 và đổi riêng một bài sẽ lệch cặp, nên để đợt rà tiêu đề cả phẩm; (2) thứ tự "gay gắt, dữ dội" cho tibbānaṁ kharānaṁ đảo so với Pāli, nhưng đúng tiền lệ mn125 và an4.114; hai từ gần nghĩa, không đổi ý; (3) "không khả ái" cho amanāpānaṁ (4 khoá) so với "không vừa ý" (3 khoá): giữ, chưa đủ chênh để đổi; (4) sameti dịch "an tịnh" theo tiền lệ an4.164; ngữ cảnh an4.114 dịch khác vì đối lập với "biết phá hoại".
    Ngoài phạm vi, chưa sửa: an4.164:3.7 và 3.3/3.9 còn "chạm xúc chạm" và "sẽ xâm chiếm; vì sự chế ngự ấy"; an4.157:3.2 còn "cắn xâu", "chỉ trích thô tục", "cảm thụ" và thiếu kaṭukānaṁ.
    Cổng kỹ thuật chưa chạy trong lượt này; cần chạy npm run validate, npm test, npm run check, npm run build trước khi coi technical_integrity là đã xác nhận (đặt 9.6).
