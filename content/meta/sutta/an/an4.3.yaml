notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.3, 1.4, 2.3, 2.4 — ‘không khảo sát, không suy
  xét kỹ, khen ngợi kẻ đáng khiển trách’ → ‘không tra xét, không suy lường, người ấy tán thán
  người đáng bị phê phán’ (và các vế đối xứng) theo dạng đa số 5/10 khoá trùng ở `an5.117–120`
  (`avaṇṇaṁ bhāsati` = ‘phê phán’, khác `nindati` = ‘khiển trách’ ở 3.1–3.2); quét cả bài: 1.5,
  1.6, 2.5, 2.6 đổi cùng cặp ‘tra xét, suy lường’ để `ananuvicca apariyogāhetvā` / `anuvicca
  pariyogāhetvā` luôn một cách dịch, chỉ đổi phần mở đầu, giữ nguyên phần còn lại của các khoá ấy.
