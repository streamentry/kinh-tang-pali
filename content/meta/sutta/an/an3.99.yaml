notes: |-
  **Sửa dấu lược bịa (2026-10-05).** Bốn khoá của bài này đã **bỏ nội dung Pāli rồi để lại
  `…`**, trong khi Pāli tại chính khoá đó viết đủ và không có dấu lược nào. Tỉ lệ PĀLI/VI
  đo trước: `1.2` 3,0× · `1.3` 3,5× · `2.11` 0,9× · `2.13` 1,0×. Đã dịch lại từ Pāli:

  - `1.2` `majjhimopi, bhikkhave, potthako dubbaṇṇo ca hoti dukkhasamphasso ca appaggho ca;`
  - `1.3` `jiṇṇopi, bhikkhave, potthako dubbaṇṇo ca hoti dukkhasamphasso ca appaggho ca.`
  - `2.11` `thero cepi, bhikkhave, bhikkhu hoti dussīlo pāpadhammo, idamassa dubbaṇṇatāya vadāmi.`
  - `2.13` (Pāli **trùng byte** với `2.4`) nên dùng lại **nguyên văn** bản dịch ở `2.4`.

  **Thuật ngữ — đếm trên toàn tầng `vietnamese-project` (155.826 giá trị) trước khi chốt:**
  `tấm vải potthaka` 8 · `giữa kỳ` 3 · `xấu xí` 76 · `khó chịu khi chạm vào` 6 · `vô giá trị` 5 ·
  `trưởng lão` 344 · `này các tỳ-kheo` 9066. `opi` (“cũng/dù … vẫn”) dịch bằng cấu trúc
  “Dù …, … vẫn …” để giữ đủ ba vế `dubbaṇṇo / dukkhasamphasso / appaggho`; `bhikkhave`
  dịch là `này các tỳ-kheo` như phần còn lại của bài.

  **Sửa thêm một chữ cho cân nháy kép:** Pāli `1.1` mở `“Navopi` còn bản Việt thì không có, nên
  chạy `“` trên cả bài là **−1** và `save_vi` chặn. Đã thêm `“` mở đầu `1.1`; sau đó chạy
  `“` = **0**, khớp Pāli.

  **Ba blemish còn lại, ngoài lát này, nêu ra chứ không tự sửa** (không mất nghĩa nào cho
  người đọc, nên không coi là blocker):
  - `1.1` gộp sẵn bốn trạng thái `mới / cũ / giữa kỳ / tàn tạ`, trong khi Pāli `1.1` chỉ có
    `nava`. Sau khi `1.2`/`1.3` viết đủ thì có lặp, nhưng không thiếu gì. `segment_alignment`
    hạ 10,0 → **9,4** vì lý do này.
  - `1.1` có chú thích trong ngoạch `(vải gai thô)` — không có trong Pāli (bản Anh đã ghim dịch
    `jute canvas`). Giữ nguyên vì gloss đúng nghĩa, nhưng theo luật kho thì chỗ giải thích
    nên để ở `notes`, không ở thân kinh.
  - `2.10`, `5.9`, `5.10` đã **bung** `…pe…` của Pāli thành văn đủ (chiều ngược của lỗi này).
    Số dấu lược vẫn khớp 1 = 1 nên `_hvi` không bắt. Ngoài lát, không sửa.

  Điểm: `semantic_fidelity` 9,4 → **9,6** vì nội dung Pāli đã khôi phục; `segment_alignment`
  10,0 → **9,4** vì blemish ở `1.1`; `technical_integrity` 10,0 → **9,6** vì lát này bị cấm
  chạy cổng. `final_score` tính lại bằng script. Còn lại bốn lệnh: `npm run validate`,
  `npm test`, `npm run check`, `npm run build`.

  **Về blocker `<uid>: cắt ngắm` — nói đúng những gì tôi kiểm được.** Lúc tôi mở tệp này
  (16:19) `blocking_errors` còn là `[]` và `status` còn là `published`; tôi đọc tệp trước khi ghi
  và không thấy blocker nào. Ở `dn22` thì blocker ấy **đã có mặt**, nhưng do một tiến trình khác
  ghi vào **sau đó**, trong lúc tôi đang dịch; ở đó tôi đã gỡ nó sau khi sửa và đo lại. Với tệp
  này tôi không quan sát thấy gì, nên tôi tự xác minh điều kiện blocker rồi để `[]` và trả `status`
  theo quality gate. Nếu người điều phối đã ghi blocker vào một bản khác thì bản đó cần được
  đồng bộ lại với tệp này.
