notes: |-
      Nguồn: đúng uid an5.200, Pāli root bilara đã ghim; tầng Anh đã ghim là bản Bhikkhu Sujato cùng commit. Tầng Việt hiện hành không có cho bài này (snapshot upstream chỉ phân phối Pháp Cú) — đặc điểm của snapshot, không phải thiếu sót của repo.
      Coverage đo bằng đúng quy tắc trong source/layers.yaml: 24/24 segment có nội dung đều có tiếng Anh = 100%. Lớp lấp English của dự án không cần dùng ở bài này. Không có mất tầng tham khảo nào.
      Trùng nguyên văn: 11/41 khoá có Pāli trùng tuyệt đối với khoá đã dịch ở dn33/dn34/an10.199-210 — 1.4 với dn33:2.1.103, 2.2 với dn33:2.1.108, 3.2 với dn33:2.1.113, 4.2 với dn33:2.1.118, 5.2 với dn33:2.1.123, 1.7 với dn33:2.1.106, 2.5 với dn33:2.1.111, 3.5 với dn33:2.1.116, 4.5 với dn33:2.1.121, 5.5 với dn33:2.1.126, 7.5 với an10.199-210:4.7; dùng lại nguyên văn bản Việt. Ngoài ra 1.5/2.3/3.3/4.3/5.3 có Pāli gần trùng `visaṁyuttaṁ` của dn33 (bài này là `suvisaṁyuttaṁ`), giữ cách dịch của dn33 nhưng dịch `suvisaṁyuttaṁ` thành «khéo tách ly» thay vì «thoát ly» để không lặp chữ với `suvimuttaṁ` (= «khéo giải thoát») ngay trước. Trong chính lát không có cặp trùng nội bộ nào ở an5.200.
      Tiền lệ đo được: khối `:0.1` của bộ `an` dùng «Kinh Tăng Chi Bộ N.N» 799/1250 (64%) so với «Aṅguttara Nikāya N.N» 320/1250 — theo đa số cả bộ; `20. Brāhmaṇavagga` → «20. Phẩm Bà-la-môn» 6/6; `Tassuddānaṁ` → «Tóm lược:» 99 lượt ở bộ `an`; `Xvaggo N.` → «Hết phẩm thứ N, Phẩm …» (an5.160:1.6, an5.180:10.6); tên bài trong anuddāna viết «bài Tên» theo an10.122:2.1–2.2.
      Đã đối chiếu, không đoán: bốn khoá anuddāna 7.1–7.4 liệt kê tên mười kinh trong phẩm Brāhmaṇavagga. Đọc Pāli gốc trong content/catalog/sutta/an.json và cache đã ghim cho từng uid an5.191–an5.200: Soṇasutta, Doṇabrāhmaṇasutta, Saṅgāravasutta, Kāraṇapālīsutta, Piṅgiyānīsutta, Mahāsupinasutta, Vassasutta, Vācāsutta, Kulasutta, Nissāraṇīyasutta. Vì vậy `Kulaṁ nissāraṇīyena cāti` là bài Kula (an5.199) cộng bài Nissāraṇīya (an5.200, chính bài này) đủ mười — KHÔNG phải Cūlanissāraṇīya như có thể đoán nhầm. Bản Anh đã ghim để trống cả bốn khoá 7.1–7.4 nên không có câu nào của Sujato để đối chiếu ở đây.
      Bất định đã ghi, không giấu:
        1) 6.1 — Pāli có mười vị từ: `nānuseti` (không tựa vào được) lặp năm lần cho năm loại niềm vui, rồi `ananusayā` (không có xu hướng ẩn) lặp năm lần cho chính năm loại ấy. Giữ đủ cả mười vị từ, không lược. Có thể đọc `nānuseti` là «không còn ở lại» và `ananusaya` là «tập khánh ẩn»; ở đây dùng «không còn tựa vào» và «xu hướng ẩn» để giữ đúng quan hệ giữa hai vế mà Sujato cũng phân biệt (don’t linger / underlying tendencies).
        2) `sugata` ở 1.5, 2.3, 3.3, 4.3, 5.3 — ở đây là `su-gata` = được hướng dẫn tốt, dịch «khéo hướng» theo dn33:2.1.104, KHÔNG phải «Thiện Thệ». Đã kiểm bối cảnh: cả năm câu đều nói về một tâm sau khi tác ý.
        3) `vihesā` dịch «sự hại», `sakkāya` dịch «thân hiện có» — theo đúng dn33:2.1.113–2.1.126. Tầng còn có nhánh «thân kiến» cho `sakkāya` ở một số bài; ghi ra để người biên tập gộp nếu muốn thống nhất.
        4) `vighātapariḷāhā` dịch «khổ não nóng rực» (an4.195:6.2) và thêm dấu phẩy tách «lậu» khỏi «khổ não» vì Pāli `āsavā vighātapariḷāhā` là hai từ ghép, và câu này lặp năm lần nên cần dễ đọc.
      Dấu lược: bài này Pāli KHÔNG có `…pe…`; bản Việt cũng không thêm dấu lược nào.
      Kiểm tra: `_hvi.py` bắt được 0 lỗi (41/41 khoá, NFC, ngoặc kép cân trên cả bài — 1.1 mở và 6.3 đóng, đúng như Pāli, không trùng nguyên văn Pāli ở khoá có nội dung, không lọt Pāli). Lượt review đối kháng bắt được một lỗi đánh máy thật ở bản nháp: 5.4 gõ nhầm «khổ nous nóng rực» thay vì «khổ não nóng rực» — đã sửa. Cả 41 khoá đã in ra đọc từng cặp.

