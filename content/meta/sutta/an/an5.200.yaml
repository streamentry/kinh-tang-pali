notes: |-
  Dịch từ Pāli root (bilara đã ghim), đối chiếu Anh Bhikkhu Sujato. ĐO LẠI: 24/24 khoá Pāli có nội dung đều có chữ Anh ⇒ coverage 1,000.
  Bản Việt hiện hành (Hòa thượng Thích Minh Châu) không có: tầng `vietnamese-current` tại commit đã ghim chỉ có 26 chương Pháp Cú.
  MỆNH ĐỀ 0.1 ĐÃ TỰ ĐO LẠI (không tin đa số cục bộ): trong 1.623 tệp `an` đã có, khoá `:0.1` là `Kinh Tăng Chi Bộ …` ở 898 tệp và `Aṅguttara Nikāya …` ở 325 tệp (322 đơn lẻ + 27 gói `anN.MMM–NNN`). Lân cận thì phân kỳ: an5.197 viết `Kinh Tăng Chi Bộ 5.197`, còn an5.198/199/201–203/205–209 viết `Aṅguttara Nikāya …`. Theo đa số CẢ BỘ thì 0.1 ở đây là `Kinh Tăng Chi Bộ 5.200`. Người biên tập nên thống nhất vì 325 tệp kia cũng là cách đã publish. `Aṅuttara` (sai dấu) = 0 lần.
  0.2 dùng lại nguyên văn `an5.191:0.2` (`20. Phẩm Bà-la-môn`, tiền lệ 4 bài cùng phẩm). 0.3 `Nissāraṇīyasutta` → `Kinh Thoát Ly` theo đúng tiền lệ đã có trên đĩa (`Nissāraṇīyasutta` → `Kinh Thoát Ly`); `dhātuyo` → `giới thoát ly` theo `dn33:2.1.101`.
  BÀI SONG SONG ĐÃ DÙNG LÀM KHUÔN: `dn33:2.1.102–106` và `dn34:1.6.42–46` (đã publish) là CÙNG công thức năm vế. 1.4, 2.2, 3.2, 4.2, 5.2 có PĀLI TRÙNG NGUYÊN VĂN với `dn33`/`dn34` nên dùng lại nguyên văn (`Khi tác ý đến xuất ly, tâm vị ấy hướng đến xuất ly, tịnh tín, an trú, giải thoát.`); 1.5, 2.3, 3.3, 4.3, 5.3 và 1.6, 2.4, 3.4, 4.4, 5.4 cũng theo đúng cách dịch đó (`Tâm ấy được khéo hướng, khéo tu tập, khéo vượt lên, khéo giải thoát, thoát ly khỏi …`). PĀLI khác `dn33` ở `suvisaṁyuttaṁ` (thay cho `visaṁyuttaṁ`) và `vighātapariḷāhā … vediyati` (thay cho `vighātā pariḷāhā … vedeti`), nghĩa không đổi.
  PĀLI TRÙNG NGUYÊN VĂN: 15/41 khoá có Pāli giống hệt tệp đã có; cả 15 khoá dùng lại nguyên văn: 0.2, 1.2, 1.4, 1.7, 2.2, 2.5, 3.2, 3.5, 4.2, 4.5, 5.2, 5.5 (12 khoá theo `dn33`/`dn34` và các bài AN cùng phẩm), 6.5 (`sn1.50:13.5`), 7.0 (`sn1.10:5.0`), 7.5 (`an10.199-210:4.7`).
  BẤT ĐỊNH 1: `sugataṁ` dịch `được khéo hướng` — đây là NGUYÊN VĂN của `dn33:2.1.104`/`dn34:1.6.44` (cả hai đã publish, Pāli chỉ khác `suvisaṁyuttaṁ`). Nghĩa gốc của `sugataṁ` là `đã hướng về bến hiền thiện`, nên `khéo hướng` là cách dịch lệch; nhưng sửa riêng ở đây sẽ tạo hai cách cho cùng một cụm trong cùng dải. Giữ nguyên văn và ghi ra đây để người biên tập quyết — nếu sửa thì phải sửa cả `dn33` và `dn34`.
  BẤT ĐỊNH 2: `anusayā` ở 6.1 và `niranusayo` ở 6.2 dịch `thiên hướng`, theo tiền lệ `sn35.58:1.1`/`sn35.59` (`thiên hướng`, 74 khoá). Không dùng `tham dự` — 15 khoá có `tham dự` trên đĩa đều là `usūyati` (`hăng hái tham dực vào việc …`), không phải `anusaya`. Lượt review đối kháng đã bắt lỗi này: bản nháp đầu dịch `không tham dự` ở 6.2, lệch với 6.1.
  BẤT ĐỊNH 3: 6.1 có `nānuseti` ×5 rồi `nānusayā` ×5 — Pāli cố tình lặp lại cùng một ý bằng hai dạng ngữ pháp. Bản này phân biệt `không có thiên hướng ưu ái X` (nānuseti) và `không có thiên hướng bám theo X` (nānusayā) để hai vế không thành lặp máy móc; Sujato gộp cả hai thành một (`Don’t linger within them`). Người biên tập nên chọn một cách cho cả hai vế.
  UDĀNA 7.1–7.4 (0 tiền lệ cho cách ghi tên trong udāna của chính AN 5; đã tra và cả `sn1.10:5.1–5.6` lẫn `sn1.20:29.1–29.6` — cả hai dùng TÊN BÀI đã dịch, không phải `bậc …`). Ở đây theo `sn22.52:2.4` (`Dve soṇā dve nandikkhayena cāti.` → `hai bài Soṇa, hai bài Nandikkhaya, vậy là.`) và `sn15.10:8.4` (`cāti` → `là vậy`): `bài Soṇa, bài Doṇa, bài Saṅgārava,` / `bài Kāraṇapālī và bài Piṅgiyānī;` / `bài Supinā, bài Vassā, bài Vācā,` / `bài Kula, bài Nissāraṇīya là vậy.` Tên bài đã có trên đĩa: `Doṇasutta` → Kinh Doṇa · `Saṅgāravasutta` → Kinh Saṅgārava · `Vācāsutta` → Kinh Lời Nói (= an5.198) · `Piṅgiyānīsutta` → Kinh Bà-la-môn Piṅgiyānī (= an5.195) · `Kulasutta` → Kinh Gia Đình lẫn Kinh Các Gia Đình (an5.199, an7.13) — hai cách, đã có sẵn. `Soṇa` (bà-la-môn ở an2.36), `Kāraṇapālī`, `Supinā`, `Vassā` chưa có tiền lệ vì các bài đó chưa dịch.
  DẤU NHÁY: 1.1 mở thì 6.3 khép (Pāli cũng vậy — 1.7/2.5/… không có `”`); các khoá 1.10–6.2 tự cân. Cân trên toàn bài. Bài không có `…pe…`.
  CỔNG KỸ THUẬT: bốn lệnh do coordinator chạy; technical_integrity 9,6. Đã tự kiểm bằng `_hvi.kiểm()` — 41/41 khoá sạch.
