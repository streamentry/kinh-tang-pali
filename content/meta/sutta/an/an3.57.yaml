notes: |-
  **Sửa lan 2026-10-13.** Khoá `11.4` (`vipulā hoti dakkhiṇā`): *vật bố thí đài các được dồi dào* → *vật bố thí được dồi dào*. Căn cứ: Pāli chỉ có `dakkhiṇā` (vật cúng dường, của bố thí) và `vipulā` (dồi dào, rộng lớn); không có chữ nào ứng với *đài các*, vốn là cách dịch của `rājabhoggo`/`dakkhiṇeyyo` ở công thức năm chi phần (đã sửa thành *xứng đáng được vua sử dụng* ở `an5.203`) và không thuộc câu kệ này. Ba khoá cùng cụm `vipulā hoti dakkhiṇā` ở `an5.179`, `an5.36` đều dịch *vật bố thí … nhiều lớn* mà không có *đài các*. Các khoá khác của bài đã dò: không có chữ `rājabhoggo`, `dakkhiṇeyyo` trong Pāli, giữ nguyên. Điểm chấm không đổi.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 5.2 — *đầy đủ phần giới vô học … phần giải thoát tri kiến vô học* → *đầy đủ giới uẩn vô học … giải thoát tri kiến uẩn vô học* (`sīlakkhandha` … `vimuttiñāṇadassanakkhandha`: *khandha* là *uẩn*; *phần* dành cho `aṅga` ở 4.1/5.1, nên bản cũ làm hai khái niệm trùng một chữ; theo `sn3.24:3.6`). Giữ nguyên khoá 1.14 (*bậc Đáng Kính Gotama* đồng nhất với 1.13 trong bài) và 4.2 (*đoạn bỏ* nhất quán với 4.1/4.3; hai cách *đoạn bỏ*/*đoạn trừ* ngang nhau trên tầng, 3/3).
