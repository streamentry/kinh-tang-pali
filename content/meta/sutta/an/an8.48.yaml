notes:
  - >-
    **Cảnh báo về khuôn tải `Aṅguttara Nikāya` — đo lại, con số đã lệch.** Lệnh lát bảo dùng dạng `Kinh Tăng Chi Bộ` cho `0.1` của bài `an`, nói rằng đo được 862 tệp theo dạng đó và 342 tệp giữ Pāli. Tôi **đo lại trên đĩa hôm nay** và con số đã lệch: trong 1.600 tệp `an`, có **1.228** tệp có khoá `:0.1`; trong đó **875** viết `Kinh Tăng Chi Bộ` và **353** giữ `Aṅguttara Nikāya` (372 tệp không có khoá `:0.1` nào). Tỷ lệ chọn lựa thì không đổi, nên tôi **theo đo được**: dùng `Kinh Tăng Chi Bộ`. Hệ quả phải nói rõ: bài liền kề có thể lệch — `an8.25` viết `Kinh Tăng Chi Bộ 8.25` nhưng `an8.47` lại giữ `Aṅguttara Nikāya 8.47`, và `an6.33` cũng giữ Pāli. Việc này không đổi nghĩa segment nào.
  - >-
    **Mọi trích dẫn trong `notes` này đã tra bằng script** trên chỉ mục Pāli↔Việt tự dựng (5.032 bài, 88.415 chuỗi Pāli khác nhau) — trong đó **loại 8 tệp của chính lát này**, để không tự đếm bản dịch của mình làm tiền lệ.
  - >-
    **Coverage Anh đo bằng script, không suy.** Đo theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ, cộng `english-sujato` và `english-project` khi status là published). Cách đo đã được **kiểm lại** bằng bài đã có sẵn: chạy lại đúng công thức này trên `an5.249` cho ra **16/21 = 0.7619**, khớp con số đã ghi trong `blocking_errors` của chính tệp đó. Bài này đạt 14/14 = 100%, toàn bộ do Sujato, không khoá nào phải dùng bản lấp `english-project`, nên không cần mục trong `content/meta/reference-gaps.yaml` và không có blocker về tầng tham khảo.
  - >-
    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo.** Tại commit đã ghim, tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) chỉ có Pháp Cú, nên **không có bản Thích Minh Châu để đối chiếu ở bất kỳ bài nào trong lát này**. Đối chiếu thuật ngữ vì vậy dựa vào Pāli root + bản Anh Sujato đã ghim + **tiền lệ đo được trong chính tầng Việt của kho**; `budsas.org` là tra cứu toàn văn, không dựng cột.
  - >-
    **Dấu lược — giữ đúng luật, không mở rộng.** Mọi khoá Pāli có `…pe…` đều giữ **đúng một** `…` trong bản Việt (luật §10.1 của BRIEF_VI3), và **không** khoá nào được thêm `…` để che chỗ thiếu. Ở những khoá lược, công thức bị nén đều là `peyyāla` mà bài đã phát lại đủ ở chỗ khác, nên nén thêm cũng không mất thông tin; tôi không mở rộng bất kỳ khoá lược nào.
  - >-
    **19 khoá có Pāli trùng nguyên văn ở bài khác và tôi dùng lại đúng chữ đã có — mạnh nhất là 14 khoá kệ trùng với `an8.47`.** Bài anh `an8.47` (`Dutiyavisākhāsutta`) liệt kê **cùng tám pháp** và **nguyên văn** khớp ở `11.1`–`11.4`, `12.1`–`12.4`, `13.1`–`13.4`, `14.1`–`14.4`: *Người chồng nuôi nàng mọi lúc, / luôn siêng năng lo lắng; / Cho mọi điều nàng muốn, / nàng không khinh chồng. / Nàng cũng không mắng chồng, / bằng lời ghen tuông; / Mọi bậc chồng kính trọng, / bậc trí đều tôn kính. / Siêng năng không biếng nhác, / quản người làm đầy đủ; / Xử sự vừa ý chồng, / giữ của đã gom. / Người nữ nào sống như vậy, / theo ý muốn của chồng; / Được gọi là Manāpa, chư thiên, / nơi nàng ấy sinh về”ti.* Tôi dùng lại nguyên văn cả mười bốn, kể cả dấu `”ti.` ở khoá cuối. `14.5` khớp *Thứ tám.*
  - >-
    **Một khoá cùng Pāli nhưng cố ý khác: `1.1`.** Chỉ mục có 3 bản sẵn, trong đó một bản còn kèm chú giải trong ngoặc (*Susumāragira (Đồi Cá Sấu Hống)*, *vườn Bhesakaḷāvana (vườn Lộc Uyển)*). Tôi bỏ phần chú giải trong ngoặc vì đó là **nội dung thêm không có trong Pāli đã ghim**, và luật của kho là không đưa giải thích vào thân kinh.
  - >-
    **`2.3` — tiền lệ y hệt ở hai bài, tôi dùng lại nhịp đó.** Cụm `pubbuṭṭhāyinī pacchānipātinī kiṅkārapaṭissāvinī manāpacārinī piyavādinī` đã dịch *Nàng dậy trước vua và đi ngủ sau vua, sẵn sàng làm theo, cư xử vừa ý và nói lời dễ mến* (`dn17`) và *Nữ báu ấy dậy trước Chuyển luân vương, ngủ sau, làm mọi việc được giao, dễ bảo, vui lòng hầu hạ, nói lời dễ thương* (`mn129`). Riêng `mātāpitaro … denti atthakāmā hitesino anukampakā anukampaṁ upādāya` tôi theo `an8.47` (*vì mong lợi ích, vì tìm hạnh phúc, vì lòng thương*) và thêm *với tấm lòng thương ấy* cho `upādāya` — không bỏ, vì bỏ thì mất một từ.
  - >-
    **`āsanodakena paṭipūjeti` → *dâng ghế ngồi và nước uống* (1 tiền lệ, `an5.33`).** `5.2` giữ đủ ba vế `katañca katato … akatañca akatato … gilānakānañca balābalaṁ`; `6.1` giữ đủ bốn `adhuttī athenī asoṇḍī avināsikā` (không tiêu phá, không lấy cắp, không hoang phí, không để mất). `8.2` giữ **đúng hai** `…` vì Pāli có hai `…pe…`; `9.1` dùng lại xuôi cụm *tâm không còn cấu uế keo kiệt, thí xả rộng rãi, tay mở rộng, thích xả bỏ, xứng đáng được xin, thích chia sẻ bố thí* của `an8.47:3.2`.
  - >-
    **Tên riêng: tôi dùng *bà Nakulamātā* thay vì *mẹ của Nakula*.** `Nakulamātā` là tên riêng trong danh mục SuttaCentral (Sujato dịch *Nakula’s mother*); giữ dạng Hán–Việt của tên riêng là đúng, và nó tránh việc lặp *Này mẹ Nakula, này mẹ Nakula* suốt bài. Đây là lựa chọn biên tập, ghi ra đây.
  - >-
    **`technical_integrity` đặt 9.6 chứ không phải 10.0.** Đợt này lát bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên cổng kỹ thuật của repo **chưa chạy** và không thể tuyên bố là đã pass. Những gì đã quét bằng script riêng trên **mọi** khoá (không chỉ khoá ≥ 40 ký tự): JSON hợp lệ, đủ mọi khoá trong `all`, không khoá thừa so với Pāli, không khoá rỗng, NFC, không trùng nguyên văn Pāli, không Pāli lọt vào bản Việt, **số dấu lược khớp Pāli từng khoá**, và ngoặc kép cân trên cả bài (`ngoặc()` của `_hvi.py`). Cần chạy bốn lệnh trên trước khi merge.
