notes: |-
  Sửa lan 2026-10-13: (1) khoá `10.2` — `uppannaṁ kāmavitakkaṁ … byāpādavitakkaṁ … vihiṁsāvitakkaṁ nādhivāseti`: *dục tưởng / sân tưởng / hại tưởng* → *dục tầm / sân tầm / hại tầm*. Căn cứ: `vitakka` là *tầm*, không phải `saññā` (*tưởng*). Đo trên tầng: Pāli có `kāmavitakka` ở 93 khoá, 50 khoá dùng *tầm*; trong họ cùng công thức `uppannaṁ kāmavitakkaṁ nādhivāseti` (13 khoá) các bài kề bên `an4.114:8.2` và `an6.58:7.2` đều dịch *dục tầm*; *dục tưởng* chỉ còn ở `mnd16:246.5` (nơi Pāli là `kāmasaññā`, khác từ) và ở khoá này trước khi sửa. (2) khoá `14.1` — Pāli `āhuneyyo hoti …pe… anuttaraṁ puññakkhettaṁ lokassā”ti` có dấu lược nhưng bản Việt chép đủ các vế nằm trong vùng lược mà không có `…`; đã đưa về đúng một `…` (*đáng được hiến dâng … là phước điền vô thượng của thế gian.”*), theo `an3.98:4.4` và `an7.95:2.3`. Giữ nguyên các khoá còn lại. Điểm không đổi.

  Quyết định hội đồng biên tập 2026-10-16: A1 — an5.140:12.2 (durāgata = “những lời nói thô ác, khó nghe”, sửa cả vế câu sai theo an4.114).
