notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và
  xuất bản.** `1.2`–`1.4` lệch đúng một khoá: `1.2` mang nội dung của `1.3`,
  `1.3` mang nội dung của `1.4`, còn `1.4` chỉ ghi *điều này có thể có* trong khi
  Pāli khoá đó là 181 ký tự (`No ce diṭṭheva dhamme…`). `1.1` còn mở rộng `…pe…`
  (BRIEF_VI3 §10.1). Đã dựng lại bốn khoá, dùng nguyên văn các khoá trùng Pāli
  `3.2`/`3.3`/`3.4`.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 5.3, 9.3 — «Bấy giờ ta hãy …» → «Hay là ta …»
  (`yannūnāhaṁ` là «hay là ta», không phải «bấy giờ»; 44/151 khoá `Yannūna…` trong tầng dùng «Hay
  là»). Giữ nguyên khoá 11.1, 12.7, 14.6 vì cách dịch hiện tại đúng và nhất quán trong bài.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Hòa thượng Thích Minh Châu, và đối chiếu lại khoá-theo-khoá với bản Anh Sujato đã ghim (bài này CÓ bản Anh trong snapshot, nên khác các bài còn lại trong cùng đợt). 14 khoá bất đồng nghĩa → sửa 10 (`1.4`, `3.4`, `5.8`, `7.4`, `12.4`: «chứng đạt thắng trí» → «chứng chánh trí», vì `aññaṁ ārādheyya` là `aññā` (trí cuối cùng), không phải `abhiññā` («thắng trí», dùng đúng ở `14.8`); cả bản nguyên bài lẫn 5 khoá `mn12` trong tầng đều dùng «chánh trí» (riêng ở `12.4` bản nguyên bài viết lời Đức Phật là «không thể đạt được chánh trí», khác lời Sāriputta trong khi Pāli hai đoạn y hệt nhau); `10.2`: «ông tin vào thân do tâm tạo à?» → «ông tin vào thân do tâm tạo nào?», vì `kaṁ` là nghi vấn từ và câu đáp nêu loại chư thiên; `paccesi` là «tin» có tiền lệ ở `sn5.10:4.1` và `mnd15:178.1`; bản nguyên bài hiểu «ai», bản Anh dịch câu hỏi có hay không; `13.2`: «các vị tỳ-kheo trưởng lão khác đã bị khiêu khích rồi» → «có người khiêu khích các vị tỳ-kheo trưởng lão khác», vì `vihesenti` là chủ động và không có «đã … rồi»; `13.3`: «Chúng ta không được hỏi về điều đó» → «Chúng ta không thoát khỏi việc ấy», vì Pāli đã ghim là `mayaṁ tena na muccāma`, và `muccāma` là «được thoát khỏi», không có nghĩa hỏi; cả bản nguyên bài lẫn bản Anh đều dịch thành «không hỏi», nhiều khả năng theo một dị bản `pucchāma` mà bản đã ghim không có; `13.5`: «Bây giờ ta» → «Bây giờ chúng ta», vì `amhākaṁ` là số nhiều; `14.5`: «nhiều học tập … quán sát xuyên suốt bằng tri kiến» → «đa văn … khéo thấu suốt bằng kiến», đúng với `bahussuto` và `diṭṭhiyā suppaṭividdhā`, theo công thức ở `an5.234:1.4`, `an8.58`, `dn33`), giữ 4 (`10.4`–`10.5`: bản nguyên bài cấu trúc khác nhưng cùng ý quở trách; `11.3`: cả ba bản đều hiểu là lời trách, khác ở dạng câu; `13.4`: bản nguyên bài kể lại khác Pāli, bản dự án và bản Anh khớp nhau; `15.3`: một lượt đọc thử `na sakkareyyuṁ … khaṇḍiccena` thành câu khẳng định, nhưng bản Minh Châu và bản Anh đều đọc là câu hỏi tu từ và Pāli cho phép cả hai, nên giữ nguyên bản cũ), bất định còn lại 2 (`10.2`: `paccesi` «tin» hay «viện đến»; `13.3`: `muccāma` như nêu trên). Đồng thời sắp lại thứ tự khoá theo thứ tự Pāli (trước đó khoá `1.5` nằm ngoài thứ tự), không đổi nội dung. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá.
