  notes: |-
    Giải quyết draft 2026-10-12: kiểm toán độc lập từng khoá với Pāli root (21/21 khoá có mặt, thứ tự khớp Pāli). Mục đánh giá cũ (GLM-5.3 Flash, 2026-09-13) được thay thế.
    Blocker cũ "cắt ngắm an3.98:1.4" (loại D, lỗi văn bản) đã GỠ vì không còn căn cứ: Pāli 1.4 là câu đầy đủ ("Imehi kho … rañño aṅganteva saṅkhayaṁ gacchati") và bản Việt 1.4 dịch đủ mọi đơn vị nghĩa, không có dấu lược. Dấu lược `…` duy nhất của bài nằm ở 4.4, nơi Pāli có `…pe…` (khớp). Dấu lược ở 1.4 chỉ có trong bản Sujato (Sujato tự rút gọn), không phải bản Việt.
    Sửa 4/21 khoá (accuracy/terminology fix): 1.1 và 1.4 — "là báu vật của vua, được coi là một phần của vương quyền" đổi thành "dùng cho vua, được kể là một chi phần của nhà vua" (rājabhoggo = thuộc quyền dùng của vua, không có "báu vật"; rañño aṅgaṁ = chi phần của vua, không có "vương quyền"). Tiền lệ đo trên tầng: "dùng cho vua/vua dùng" 10 khoá (an6.5, an6.6, an6.7, mn65, mn94, an4.244…) so với "báu vật của vua" 12 khoá (cùng họ an3.96–97, an8.13); "chi phần của vua" 21 khoá so với "phần của vương quyền" 20 khoá — chọn dạng sát Pāli và sát an6.5–7, mn65. Các bài họ hàng an3.96/an3.97/an8.13 chưa đổi trong lát này.
    1.5 và 4.4 — "đáng được cúng dường, đáng được tiếp đón, đáng nhận vật bố thí đài các, đáng được chắp tay kính lễ" đổi thành "đáng được hiến dâng, đáng được tiếp đón, đáng được cúng dường, đáng được chắp tay kính lễ" (āhuneyyo, pāhuneyyo, dakkhiṇeyyo, añjalikaraṇīyo theo đúng thứ tự Pāli): "đài các" (9 khoá) không có căn cứ trong dakkhiṇeyyo; công thức hiến dâng–tiếp đón–cúng dường–chắp tay có 19 khoá trở lên (dn24, sn40.10, an5.139, an7.16, an7.95…).
    Giữ nguyên sau khi đối chiếu: "dung sắc" cho vaṇṇa; "oai nghi và đường hạnh" (23 khoá, so với 7 khoá "oai nghi và hành xứ"); "tinh tấn đã được khởi động … không bỏ gánh" (công thức tầng); công thức lậu tận 4.2 ("do cạn lậu hoặc, tự mình chứng tri, chứng ngộ … an trú ở giải thoát tâm không lậu hoặc, giải thoát tuệ", 44–51 khoá, đúng thứ tự Pāli); 4.4 `…pe…` thành một `…`. Không có số Pāli, không có nháy đơn/kép lệch (chỉ cặp “ ” mở ở 1.1 và đóng ở 4.4 như Pāli). Pāli trùng nguyên văn trong bài: 1.2=1.6 và 1.1≈1.4 (khác ở phần mở đầu, khớp từng chữ với Pāli), bản Việt tương ứng nhất quán.
    Tham chiếu: Sujato có bài này; chỉ để trống 1.4 ở dạng rút gọn "…" (Pāli có đủ nội dung) — 4.4 đã được Sujato dịch đủ. Không có tầng Việt hiện hành (chỉ có Pháp Cú) nên không đối chiếu Thích Minh Châu; `triangulation` đặt 8,0. Phần Sujato rút gọn ở 1.4 tự đứng vững từ Pāli (câu lặp nguyên 1.1 với aṅgehi → "tīhi aṅgehi") và nhất quán với bản Việt 1.1.
    Bất định còn lại: "aṅga" dịch "chi phần" (nghĩa đen "bộ phận của vua"); "ājānīya" giữ "thuần thục" theo tiêu đề cả họ (an3.94–an3.97). Không blocker.
