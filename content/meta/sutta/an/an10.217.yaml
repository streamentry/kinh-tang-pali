notes:
  - >-
    **Bài dài thứ hai chương (60 segment), và là bài tái dùng `an10.211` nhiều
    nhất**: chín hành vi xấu ở `3.2`–`14.2` và chín hành vi tốt ở `20.2`–`31.2`
    đều lấy nguyên văn từ `an10.211`, chỉ khác cách dựng câu vỏ bọc. Nhờ vậy
    phần thuật ngữ khó nhất chương đã có sẵn một bản dịch đã duyệt để tái dùng.
  - >-
    **`Karajakāyavagga` → *Phẩm Thân Do Nghiệp*** (0 segment tiền lệ, đặt mới):
    Sujato dịch tên phẩm là *The Body Born of Deeds*, và `karajakāya` (thân do
    nghiệp tạo ra) là chủ đề của cả bài — `an10.219` giải thích thẳng rằng mọi
    nghiệp ác từng làm đều được cảm thọ ngay trong thân này. `Saṁsappanīyasutta`
    → *Kinh Tiếp Xúc Nghiệp* (Sujato *Karmic Contact*); `Adhammacariyāsutta` →
    *Kinh Sống Phi Pháp*.
    **`Karajakāyavaggo paṭhamo` ở `an10.220:12.4` dịch là *Phẩm Thân Do Nghiệp,
    thứ nhất*** — đây là **số thứ tự Bilara đánh số lại trong một tập con**, vì
    phẩm này rõ ràng thứ hai mốt (đúng như `21.` ở `0.2`). Tôi dịch theo Pāli vì
    Pāli là authority, và ghi lại để không ai tưởng là đếm sai.
  - >-
    **Nguyên văn dùng lại, đếm được, đều cùng Pāli**: mười hành vi xấu rút gọn ←
    **`an10.199-210:1.3`** (đã `published`: *Sát sinh, Trộm cắp, Tà dâm, Nói
    dối, Nói hai lưỡi, Nói ác khẩu, Nói phù phiếm, Tham lam, Sân hận, và có tà
    kiến*); mười hành vi tốt rút gọn ← **`an10.178:3.2`** (đã `published`:
    *Kiêng tránh sát sinh… không tham lam, không sân hận, và có chánh kiến*);
    `yathābhataṁ nikkhitto evaṁ niraye` ← **`an10.222:1.1`**; `… evaṁ sagge` ←
    **`an3.10:1.1`**; `natthi dinnaṁ … pavedentī’ti` ← **`an3.117:3.3`**;
    `pāṇupetaṁ saraṇaṁ gatan` ← **`an3.53:5.4`**; `apāyaṁ duggatiṁ vinipātaṁ
    nirayaṁ` ← **`an10.229-232:1.1`**; `sugatiṁ saggaṁ lokaṁ upapajjanti` ←
    **`an3.117:7.5`**; `Taṁ suṇātha, sādhukaṁ manasi karotha` ←
    **`an10.107:2.2`**.
  - >-
    **Lỗi nghiêm trọng nhất chương, lượt review bắt được ở mười segment của nửa
    “dương”.** Trong Pāli, nửa âm (`2.1`–`15.1`) nói `kammantasandosabyāpatti` —
    *hành động **tiếp xúc với điều gây hại*** — còn nửa dương (`19.1`–`32.1`)
    nói `kammantasampatti` — *hành động **đạt được***, **không có**
    `sandosabyāpatti`. Bản đầu tôi dùng chung một khuôn cho cả hai nên nửa dương
    cũng mang *tiếp xúc với điều gây hại* — **nghĩa sai, và người đọc không có
    cách nào phát hiện** vì cấu trúc hai nửa giống hệt nhau. Đã tách thành tám
    hằng số riêng.
  - >-
    **`20.2` có `…pe….` ở CUỐI**, nên phần định nghĩa sau `dayāpanno` bị lược
    **hết** — bản đầu tôi dịch đủ cả `sabbapāṇabhūtahitānukampī viharati` rồi
    mới đặt dấu lược, tức vừa thừa vừa sai. Đã sửa thành chỉ dịch đầu. Ngược lại
    `14.2` và `31.2` lược **ở giữa**, nên phải giữ cả đầu lẫn đuôi.
  - >-
    **`7.2` kết bằng `:` chứ không phải lời nói** (`Sabhaggato vā …
    sakkhipuṭṭho`), lời nói nằm ở `7.3`. Bản đầu tôi dựng chung một hằng số nên
    lời nói rơi vào `7.2` và `7.3` mở đầu bằng một gạch ngang không có trong
    Pāli; đã tách hằng số làm hai.
  - >-
    **Sai khác biệt chữ trong Pāli, ghi lại vì người đọc tưởng là lỗi**: `12.2`
    viết `aho vata, yaṁ parassa taṁ mama assā` còn `an10.211:8.1` viết `aho vata
    yaṁ parassa taṁ mama assā` — thiếu một chữ `taṁ`; `29.2` viết `taṁ mamassā`
    (dính liền hai chữ). Cùng nghĩa, tôi dịch giống nhau.
  - >-
    **Thuật ngữ 0 tiền lệ, đặt mới**: `sañcetanikā kamma` → *hành ý*;
    `kammantasandosabyāpatti` → *hành động tiếp xúc với điều gây hại*;
    `kammantasampatti` → *hành động đạt được*; `dukkhudrayā dukkhavipākā` → *có
    khổ làm nền tảng, chín muồn khổ*; `sukhudrayā sukhavipākā` → *có sự dễ chịu
    làm nền tảng, chín muồn sước*; `apaṇṇako maṇi uddhaṅkhitto` → *hòn ngọc quý
    bị hét tung*; `sattā kammadāyādā` → *bảy hạng kẻ thừa kế nghiệp* (theo
    `an10.216`); `sayaṁ abhiññā sacchikatvā pavedentī` → *tự mình chứng ngộ bằng
    thắng trí rồi trình bày cho người khác*.\nCó tiền lệ: `apāyaṁ duggatiṁ
    vinipātaṁ nirayaṁ` → *cõi ác, ác thú, cõi đọa, địa ngục*
    (`an10.229-232:1.1`); `sugatiṁ saggaṁ lokaṁ` → *thiện thú, cõi trời*
    (`an3.117:7.5`); `dukkhassantakiriya` → *sự chấm dứt của khổ*; `byantībhāva`
    → *tan rã*.
  - >-
    **Ba vế `16.1`, `33.1` lặp nguyên văn** (`sau khi thân hoại mạng chung, có
    chúng sinh…`) vì Pāli cũng lặp đúng ba lần; tôi nối bằng dấu chấm phẩy như
    Pāli, không rút thành một.
