notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato đã ghim và bản Việt Hòa thượng Thích Minh Châu (đọc nguyên bài ở mục tra cứu toàn văn, không căn theo segment). Đủ 171/171 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli.

  CẤU TRÚC BÀI. Tôn giả Dhammika mắng nhiếc các tỳ-kheo khách ở bảy trú xứ nơi quê hương nên bị các cư sĩ trục xuất ba lượt (1–6), đến gặp Đức Phật (7); Ngài kể hai ví dụ: con chim dò bờ (8) và cây đa chúa Suppatiṭṭha cùng vị thiên giữ pháp của cây (9–13.2), rồi hỏi pháp của sa-môn (13.3–13.6); tiếp đến sáu đạo sư ngoại đạo và lời dạy không ôm ác ý với bạn đồng phạm hạnh (13.7–19), kệ (20–29), phần kết phẩm và kệ tóm lược của phẩm (29.5–30.5).

  COVERAGE ANH (đo thật). Mẫu số: khoá Pāli có nội dung (từ 40 ký tự trở lên, bỏ khối `:0`) = 103. Bản Anh Sujato đã ghim có chữ ở 92/103 = 0,893, trên ngưỡng 0,80. Sujato để trống 11 khoá: `4.2`–`4.8` và `6.2`–`6.5`, đều là các đoạn lặp nguyên văn của `2.2`–`2.8` (vòng cư sĩ nghĩ thứ hai và thứ ba), nên Pāli của chúng đã được đối chiếu qua các khoá song song `2.2`–`2.8` mà Sujato có chữ. Tầng `english-project` có tệp cho uid này (lấp chính 11 khoá ấy); nhưng đó là bản của dự án chứ không phải cách đọc Anh độc lập, nên coverage độc lập chỉ tính theo Sujato (0,893). Tầng `vietnamese-current` vắng ở mức segment (corpus Thích Minh Châu theo segment tại commit đã ghim chỉ có Pháp Cú); bản nguyên bài chỉ dùng để tra cứu.

  TIỀN LỆ — ĐẾM ĐƯỢC. Quét Pāli trùng nguyên văn trên toàn tầng (ngoài chính bài): 15 khoá của bài có khoá trùng; bản Việt dùng lại y hệt ở 9/15 (khác chỉ hoa thường/dấu hoặc tiền lệ không cùng nghĩa ở 6 khoá). Cụ thể 6 khoá: `8.4` theo `dn11:85.5` nhưng giữ chủ ngữ *nó* vì Pāli có `so`; `22.3`/`23.5` theo `snp1.7:27.3` (*sau khi ly tham ái dục*, chữ thường vì tiếp dòng kệ); `24.5`/`24.6` khác `an4.4:3.5`–`3.6` (dịch *apuñña* là *bất thiện*, *tạo ác*) vì cùng bài này dùng *điều vô phước* theo `an7.73:3.2`–`3.5` và `dn27:4.12`, `dn29:4.11`; `28.1` khác `mn50:24.13` (*ngươi xúc phạm*) vì ngữ cảnh kệ này là câu khái quát. Gần nhất về nội dung là `an7.73` (cùng khuôn Sunetta, Mūgapakkha, Aranemi, Kuddālaka, Hatthipāla, Jotipāla — Pāli gần như trùng, chỉ khác lời gọi `bhikkhave` và một chữ `nappasādesuṁ`): `13.7`–`13.11`, `14.1`–`18.5`, `19.2`, `19.4`, `19.5` (`19.5` trùng byte, bản Việt trùng y hệt), `19.7`, `19.8`, `19.9` dùng lại câu chữ của `an7.73:1.1`–`1.5`, `2.1`–`2.10`, `3.2`–`4.2` (đổi lời gọi sang *này bà-la-môn Dhammika*, và *sáu* thay cho *bảy* đạo sư). Trong chính bài có 16 nhóm Pāli trùng nguyên văn (các lượt nghĩ, lời mời đi và lời xin rời của ba vòng cư sĩ, câu Sunetta/Jotipāla, kệ `22`/`23`, `24.3`/`25.3`); cả 16 nhóm bản Việt giống hệt, 0 nhóm lệch.

  THUẬT NGỮ (đo trên toàn tầng khi cần). `akkosati` → *mắng nhiếc*, `paribhāsati` → *phỉ báng* (trong các cặp có cả `akkosati` và `paribhāsati`: *phỉ báng* 18 khoá so với *sỉ nhục* 11 khoá; `an7.73` cũng dùng *phỉ báng*), `vihiṁsati` → *quấy nhiễu* (`mn50`), `vitudati` → *đâm chọc* (`ud6.4`, `dn29`), `roseti` → *chọc giận* (`mn50`); `āgantuka bhikkhu` → *tỳ-kheo khách* (`ud3.3`); `āvāsa` → *trú xứ*; `jātibhūmaka upāsaka` → *các cư sĩ ở quê hương ấy*; `pabbājeti` → *trục xuất* (`mn84`, `dn3`, `dn27`); `nigrodharājā` → *cây đa chúa* (*cây đa* nhiều hơn *cây bàng* khoảng 16 so với 5 khoá nhắc cây Nigrodha); `yojana` → *do-tuần* (`an7.66`); `sakko devānamindo` → *Sakka, vua chư thiên* (`sn11.20`); `bhusā vātavuṭṭhi` → *cơn mưa gió dữ dội* (`an6.55:17.10`, `an9.26:6.3`); `iddhābhisaṅkhāra` → *vận dụng thần thông* (`mn49`, `dn3`); `dukkhī dummanā assumukhī rudamānā` → *đau khổ, buồn rầu, mặt đẫm lệ, khóc than* (`an8.51`); `mārisa` → *thưa ngài* (`dn32`); `titthakara` → *giáo chủ ngoại đạo*, `satthā` → *đạo sư*, `kāmesu vītarāga` → *đã ly tham đối với các dục*, `brahmalokasahabyatā` → *cộng trú với cõi Phạm thiên* (`an7.73`); đích sinh: *cõi dữ, ác thú, đọa xứ, địa ngục* (42 khoá, nhiều nhất) và *thiện thú, cõi trời* (49 khoá, nhiều nhất); `diṭṭhisampanna` → *thành tựu chánh kiến*; `samatho ca vipassanā` → *an tịnh và minh sát* (`mn149`, `mn151`); `bhagavā` ở phần dẫn → *Đức Phật* (đa số của tầng, `an7.66`, `sn35.118`), lời xưng hô `bhante` → *Bạch Thế Tôn*, còn cư sĩ gọi Dhammika thì *Thưa Tôn giả*. Tên phẩm 0.2 *5. Phẩm Dhammika* khớp `an6.50`–`an6.53`; `Tassuddānaṁ` → *Tóm lược:* (90 khoá so với 19 khoá không dấu hai chấm); `Dvādasamaṁ.` → *Thứ mười hai.* (4/4); `Paṭhamo paṇṇāsako samatto.` → *Phần năm mươi kinh thứ nhất hoàn tất.* (4 khoá, nhiều nhất); `Dhammikavaggo pañcamo.` → *Phẩm Dhammika, thứ năm.* theo cách *Phẩm X, thứ năm* (`an5`). Tiêu đề kệ tóm lược dùng tên kinh của chính bộ (`an6.45` *Nợ Nần*, `an6.47`/`an6.48` *Thiết Thực Hiện Tại*, `an6.50` *Các Căn*, `an6.52` *Sát-đế-lợi*, `an6.53` *Không Buông Lung*).

  SỐ LƯỢNG (tự tính, không có từ khoá số đã xác lập nào cần quy đổi). Bảy trú xứ (`satta āvāsā`) = 7; `dvādasa yojanāni` = 12 do-tuần (tán), `pañca yojanāni` = 5 do-tuần (rễ); `pañcasākho` = năm cành; năm phần dùng năm `khandha` (vua cùng hậu cung, quân đội, dân thị thành và miền quê, sa-môn bà-la-môn, loài thú); sáu đạo sư (`cha satthāro`: Sunetta, Mūgapakkha, Aranemi, Kuddālaka, Hatthipāla, Jotipāla); `sattapurohito` = tư tế của bảy; `sattamo puggalo` = hạng người thứ bảy; `pañcindriyā` = năm căn; `Dvādasamaṁ` = thứ mười hai; `Dhammikavaggo pañcamo` = phẩm thứ năm; ba vòng trục xuất (hai vòng khỏi một trú xứ, vòng thứ ba khỏi cả bảy).

  ĐIỂM BẤT ĐỊNH (ghi ở đây, không thêm vào thân kinh). (1) `19.7` Pāli ghim ghi `khantiṁ` (nhẫn nại), nhưng cả ngữ cảnh lẫn Sujato (*injury*), Thích Minh Châu (*sự tổn hại*) và tiền lệ `an7.73:3.7` đều đọc theo nghĩa *tổn hại/xúc phạm* (cách đọc `khatiṁ`); bản Việt theo ba nguồn ấy. Nếu Pāli đọc đúng là `khanti`, nghĩa sẽ khác nên điểm này cần người biên tập xác nhận. (2) `19.9` Pāli `samasabrahmacārīsu` có tiền tố `sama-`; Thích Minh Châu và `an7.73:4.2` (`sabrahmacārīsu`) đều không dịch `sama-`, Sujato dịch theo cách khác (*those who we want to have as our spiritual companions*), nên bản Việt dịch *các bạn đồng phạm hạnh* và bỏ `sama-`, thừa nhận mất một đơn vị nghĩa chưa phân xử được. (3) `9.1`/`9.7` `pañcasākho` và `ekaṁ khandhaṁ`: dịch sát chữ *năm cành* / *một thân*; Sujato dịch cả hai là *trunks*, Thích Minh Châu là *cành*; chưa rõ hai từ chỉ cùng năm phần của cây hay không. (4) `9.4` `āḷhakathālikā` giữ đơn vị *āḷhaka* (một đơn vị đong, Sujato: *rice pot*, Thích Minh Châu: *nồi con*) và `9.6` `khuddaṁ madhuṁ anelakaṁ` → *mật tinh khiết của loài ong nhỏ* (`mn77:6.65`). (5) `21.2` `sattapurohito` → *tư tế của bảy vị vua*: chữ *vua* lấy từ nghĩa của hợp từ (tư tế của bảy, theo `dn19` và Sujato), Pāli ở đây không có chữ tương ứng. (6) `29.2` `rakkhito tassa bāhiro` → *người khác cũng được bảo vệ* (Sujato *the other*; Thích Minh Châu *bề ngoài*): `bāhira` nghĩa đen là *bên ngoài*. (7) `8.4` `tathāgatakova hoti` → *bay đi luôn* theo tiền lệ `dn11:85.5`; Sujato đọc là *đến đó và ở lại*. (8) `12.4`/`12.9` `rukkhadhamme ṭhitāya` / `aṭṭhitāyeva` dịch *đứng vững trong pháp của cây* theo Sujato (*stand by a tree's duty*) và Thích Minh Châu (*gìn giữ cây pháp*), `dhamma` ở đây là bổn phận/phép tắc của cây; tương ứng `samaṇadhamme` ở `13.2`–`13.6`. (9) `13.10`/`13.11` `cittāni na pasādesuṁ`/`pasādesuṁ` → *không có/có lòng tin tưởng nơi* theo `an7.73:1.4`. (10) `10.2`, `11.4`, `12.x` `devatā` (giống cái về ngữ pháp) dịch trung tính *vị thiên*, không gán giới tính.

  DẤU LƯỢC VÀ NHÁY. Pāli có `…pe…` ở `14.1` và `6.5`: mỗi khoá Việt giữ đúng một `…`; `6.5` Pāli kết `….` nên Việt kết ` ….` (đa số của tầng). Các khoá Pāli lược bằng `…` trần (`15.1`, `16.1`, `17.1`, `18.1`) giữ đúng vị trí `…` đầu/cuối như Pāli. Nháy đơn và nháy kép khớp Pāli từng khoá (171/171, 0 lệch). Ngoặc kép lời nói mở ở `13.7` mà Pāli chỉ đóng ở `29.4`; nháy giữa chừng theo đúng Pāli từng khoá, không cân từng khoá.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở 9.6: chỉ xác minh được JSON hợp lệ, tập khoá Việt và Pāli bằng nhau (171 và 171, 0 thiếu, 0 thừa, đúng thứ tự), 0 khoá rỗng, mọi giá trị NFC, không khoảng trắng thừa, dấu lược khớp Pāli từng khoá, nháy khớp Pāli từng khoá, không Pāli lọt sang bản Việt ngoài tên riêng, và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
