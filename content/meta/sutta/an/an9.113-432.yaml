notes: |-
  TẦNG THAM KHẢO — SÀN COVERAGE KHÔNG KÍCH HOẠT, VÀ ĐÓ KHÔNG PHẢI SỰ ĐỒNG THUẬN:
  đo theo đúng công thức `source/layers.yaml`, bài này có **0 khoá Pāli đủ 40 ký tự** (mọi
  vế kệ của Rāgapeyyāla đều ngắn hơn), nên `englishCoverageFor` trả `ratio = 1` và bài không
  cần entry trong `content/meta/reference-gaps.yaml`. Hệ quả thật: ô Anh để trống ở 15 khoá
  đầu vẫn KHÔNG có nghĩa là Sujato đồng ý với cách dịch của tôi. Tuy vậy Sujato CÓ tệp cho
  bài này và tệp có đủ 31 khoá, tôi đã đối chiếu từng vế (đặc biệt `…pe…` và hệ từ), nên vẫn
  đủ điều kiện `published`.
  Lát c14. 29/31 khoá trùng nguyên văn — tỷ lệ cao nhất lát — vì đây là peyyāla
  (Rāgapeyyāla) cùng công thức với an10.267-746 và an11.992-1151, đã cả ba đều merge.

  Tiền lệ có đếm và dùng lại (nguyên văn y hệt, không dịch lại từ đầu):
  · `Dosassa …pe…` → ““Với sân …”; `mohassa …` → “với si …”; … `madassa …` → “với phóng
    túng …” — 4-5 bản mỗi vế, đều là an10.267-746:1.1-1.15 (cùng Aṅguttara Nikāya).
  · `pamādassa abhiññāya …pe…` → “với phóng dật, để chứng ngộ bằng thắng trí …” (3 bản:
    an6.170-649, an7.645-1124, an8.148-627, đồng nhất cả ba).
  · `pariññāya …` → “để hoàn toàn hiểu rõ …” (3 bản); `parikkhayāya/pahānāya/khayāya/
    vayāya/virāgāya/nirodhāya …` → “để đoạn tận hoàn toàn / từ bỏ / đoạn tận / hủy hoại /
    ly tham / diệt …” (9 bản mỗi vế); `cāgāya …` và `paṭinissaggāya …pe…` → “để xả …”,
    “để buông bỏ …” (6 bản).
  · `Aṅguttara Nikāya 9` → “Kinh Tăng Chi Bộ 9” (12 bản; an9.93/9.94 dùng “Aṅguttara
    Nikāya 9.93/9.94”).
  · `10. Rāgapeyyāla` → “10. Phẩm Chuỗi Lặp Tham” (đúng an9.93:0.2, an9.94:0.2, cùng
    Tăng Chi Bộ).
  · `~` giữ nguyên `~` (56 bản).

  Bất định đã ghi: hai khoá không có bản trùng nên phải tự dịch — `ime nava dhammā
  bhāvetabbā”ti.` → “chín pháp này cần được tu tập”ti.” và `Navakanipātapāḷi niṭṭhitā.` →
  “Kinh Chương Chín Pháp hoàn tất.”. Hai chỗ này tầng đang phân tán nặng: `…kanipātapāḷi
  niṭṭhitā` đã có 5 cách (Chương Sáu Lẻ / Chương Bảy Lẻ / Chương Mười Lẻ hoàn tất;
  Tập mười một phẩm … đã khép lại; Thiên Một Pháp đã xong). Tôi chọn “… hoàn tất” theo đa
  số 4/5 và dùng “Kinh Chương Chín Pháp” cho AN9. Người điều phối nên chuẩn hoá cả cụm này.

  Một phát hiện cần nêu: `Rāgapeyyālaṁ niṭṭhitaṁ.` khi tôi đo chỉ có 3 bản chia đều
  3/3/3 (“Chuỗi Lặp Tham đã hoàn tất”, “Tập kệ bắt đầu bằng tham đã khép lại”, “Chuỗi
  lặp về tham đã hoàn tất”). Tôi chọn “Chuỗi Lặp Tham đã hoàn tất” không phải vì số
  phiếu mà vì trong chính Tăng Chi Bộ 9, phẩm này đã được gọi là “Phẩm Chuỗi Lặp Tham” ở
  khoá 0.2 — nhất với chính bài. Người điều phối nên chuẩn hoá cả cụm `niṭṭhita` này vì
  tầng vẫn đang phân tán.

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
