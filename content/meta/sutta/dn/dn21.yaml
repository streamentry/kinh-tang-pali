summary: |-
  Kinh Đế Thích Sở Vấn kể khi Đức Thế Tôn trú trong động Indasāla trên núi Vediyaka, gần Rājagaha. Sakka, vua chư thiên, tha thiết muốn yết kiến; vì Như Lai đang thiền định, độc cư, khó đến gần, Sakka nhờ Pañcasikha mang đàn vīṇā đến làm Ngài hoan hỷ trước.

  Pañcasikha gảy đàn hát những câu kệ liên hệ đến Đức Phật, Giáo pháp, Tăng đoàn, các bậc A-la-hán và tình yêu của mình với Bhaddā Suriyavaccasā, con gái vua Càn-thát-bà Timbaru. Đức Thế Tôn khen tiếng đàn hòa hợp giọng hát. Pañcasikha kể bài kệ ra đời thời Ngài mới giác ngộ tại Uruvelā: con say mê nàng nhưng nàng yêu Sikhaṇḍī, nên con hát kệ ca ngợi Đức Thế Tôn trước cha nàng, nhờ vậy nên duyên với nàng.

  Sakka kể chuyện từng đến Sāvatthī khi Ngài nhập định, chỉ nhờ thiên nữ Bhūjati chuyển lời đảnh lễ; Đức Thế Tôn nhớ tiếng bánh xe của Sakka đã khiến Ngài xuất định. Sakka kể chuyện Gopikā: nữ cư sĩ Sakya có lòng tin nơi Phật, Pháp, Tăng, giữ giới trọn vẹn, sinh lên cõi Ba Mươi Ba làm con Sakka tên Gopaka; ba tỳ-kheo từng sống phạm hạnh dưới Ngài lại sinh vào hàng Càn-thát-bà thấp hơn; được quở trách, hai vị vượt lên chúng Phạm phụ thiên, một vị vẫn ở lại trong dục lạc. Sakka xin được hỏi.

  Đức Thế Tôn đáp: kiết sử ghen tị và keo kiệt khiến chúng sinh dù mong sống không thù hận vẫn làm hại nhau. Ghen tị, keo kiệt do cái ưa, cái ghét; cái ưa, cái ghét do dục; dục do tầm; tầm do các khái niệm do tưởng và phóng diễn. Đức Thế Tôn chỉ hỷ, ưu, xả, thân hành, khẩu hành, tìm cầu và các đối tượng của sáu căn đều có hai loại nên và không nên tu tập, thực hành, tiếp xúc, tùy thiện pháp tăng hay giảm; loại không còn tầm, tứ cao thượng hơn.

  Đức Thế Tôn còn xác nhận không phải mọi sa-môn, Bà-la-môn đều cùng chủ trương; chỉ người đoạn tận ái mới đạt cứu cánh tối hậu. Sakka bạch mình là đệ tử của Đức Thế Tôn, một bậc Dự lưu, mũi tên nghi hoặc đã được nhổ ra; hỷ lạc do chiến thắng A-tu-la thuộc phạm vi gậy gộc, không dẫn đến Niết-bàn, hỷ lạc do nghe Giáo pháp thì dẫn đến; Sakka thấy sáu lợi ích, từ thọ mạng kéo dài đến sinh về Akaniṭṭha. Sakka ban cho Pañcasikha vua Càn-thát-bà cùng Bhaddā Suriyavaccasā, ba lần cúi lạy Đức Thế Tôn; khi ấy Pháp nhãn khởi lên nơi Sakka và tám mươi ngàn vị thiên: bất cứ pháp nào sinh khởi, tất cả đều đoạn diệt; nên bài kinh gọi là Đế Thích Sở Vấn.
