summary: |-
  Một thời, Đức Phật trú tại Kosambī, trong tu viện Ghosita. Hai vị xuất gia là du sĩ Muṇḍiya và Jāliya, đệ tử của Dārupattika, đến gặp Đức Phật, chào hỏi rồi hỏi một câu duy nhất: sinh mệnh và thân thể là một, hay sinh mệnh là một thứ, thân thể là một thứ khác? Đức Phật mời họ lắng nghe rồi trình bày câu trả lời theo từng bậc thiền định.

  Điểm khởi đầu là một Như Lai xuất hiện ở đời; tỳ-kheo thành tựu giới hạnh, chứng và an trú sơ thiền. Đức Phật hỏi: một tỳ-kheo biết và thấy như vậy, có thích hợp để nói rằng sinh mệnh và thân thể là một, hoặc là hai thứ khác nhau hay không — và trả lời: vị ấy biết và thấy như vậy thì thích hợp để nói như vậy. Còn Ngài, biết như vậy và thấy như vậy, thế nhưng không nói rằng sinh mệnh và thân thể là một hoặc khác.

  Công thức ấy lặp lại cho từng bậc: tỳ-kheo chứng và an trú nhị thiền, tam thiền, tứ thiền — biết và thấy như vậy thì thích hợp để nói sinh mệnh và thân thể là một hoặc khác, còn Đức Phật biết và thấy như vậy nhưng không nói vậy. Đến bậc hướng tâm, dẫn tâm đến tri kiến, kết luận vẫn như thế: vị ấy thích hợp để nói, còn Đức Phật vẫn không nói.

  Chỉ có một điểm đổi chiều ở bậc cuối: vị tỳ-kheo biết rõ không còn trở lại trạng thái này nữa — biết và thấy như vậy thì không thích hợp để nói rằng sinh mệnh và thân thể là một hoặc khác. Và lần cuối cùng, Đức Phật nhắc lại: Ta biết như vậy và thấy như vậy, thế nhưng Ta không nói rằng sinh mệnh và thân thể là một hoặc là khác. Hai vị xuất gia hoan hỷ, tán đồng lời dạy. Bài kinh cho thấy Đức Phật biết và thấy như vậy nhưng từ chối cả hai vế của câu hỏi, và ở bậc cao nhất — khi biết rõ không còn trở lại — không vế nào còn thích hợp để nói.
