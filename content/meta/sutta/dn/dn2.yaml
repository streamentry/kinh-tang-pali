summary: |-
  Kinh Sa-môn Quả mở đầu tại Rājagaha, nơi Đức Thế Tôn trú trong vườn xoài của Jīvaka Komārabhacca cùng đại chúng tỳ-kheo. Vào đêm rằm, vua Ajātasattu nước Magadha muốn đến gần một vị Sa-môn hay Bà-la-môn để tâm được tịnh tín; các quan lần lượt tâu sáu giáo chủ danh tiếng: Pūraṇa Kassapa, Makkhali Gosāla, Ajita Kesakambala, Pakudha Kaccāyana, Sañjaya Belaṭṭhaputta, Nigaṇṭha Nāṭaputta, nhưng vua giữ im lặng, cho đến khi Jīvaka tâu về Đức Thế Tôn. Vua đi bằng voi đến vườn xoài, ngắm sự lặng yên tuyệt đối của chúng tỳ-kheo, rồi hỏi về quả Sa-môn thấy rõ ngay trong đời này.

  Đức Thế Tôn hỏi vua đã từng hỏi ai; vua kể lại, nhận mỗi câu đều lệch câu hỏi, như hỏi xoài lại trả lời mít. Pūraṇa Kassapa đáp bằng thuyết không hành động: giết hay bố thí đều không gây ác hay phước. Makkhali Gosāla đáp bằng thuyết thanh tịnh qua luân hồi: kẻ ngu và người trí bị định mệnh, vận hội, bản tánh đưa đẩy. Ajita Kesakambala đáp bằng thuyết đoạn diệt: không có đời sau, người do bốn đại tạo thành, khi chết tan rã. Pakudha Kaccāyana nói về bảy thân không lay động; Nigaṇṭha Nāṭaputta nói về sự chế ngự bốn mặt; Sañjaya Belaṭṭhaputta thì trả lời quanh co lẩn tránh. Với mỗi vị, vua không tán thành cũng không phản đối.

  Đức Thế Tôn bèn chỉ hai quả hiện thấy đầu tiên: người nô bộc hay nông phu gia chủ khi xuất gia sống thu thúc thân, lời, ý, biết tri túc, sẽ được vua đảnh lễ, cúng dường. Những quả thù thắng hơn bắt đầu khi người nghe pháp sinh lòng tin, xuất gia, thành tựu tiểu giới, trung giới, đại giới, từ bỏ sát sinh, nói dối, tránh xa tà mạng; rồi hộ trì các cửa giác quan và chánh niệm tỉnh giác. Vị ấy đoạn trừ năm triền cái rồi lần lượt chứng bốn thiền.

  Với tâm đã định, vị ấy lần lượt thành tựu tám trí: thấy rõ thân gồm bốn đại và thức nương nơi thân; hóa hiện thân do ý tạo; các thần thông; thiên nhĩ; trí biết tâm người khác; trí nhớ đời trước; thiên nhãn thấy chúng sanh chết và sanh theo nghiệp; và trí đoạn tận lậu hoặc, giải thoát khỏi dục lậu, hữu lậu, vô minh lậu. Ngoài quả hiện tại này, không còn quả Sa-môn nào thù thắng hơn.

  Vua Ajātasattu quy y làm ưu-bà-tắc trọn đời, xưng nhận tội giết cha, bậc vua trị vì đúng pháp; Thế Tôn nhận lỗi vì vua thấy lỗi và sửa lỗi đúng pháp. Sau khi vua ra đi, Ngài nói nếu không giết cha thì pháp nhãn thanh tịnh đã sanh khởi ngay tại chỗ ngồi.
