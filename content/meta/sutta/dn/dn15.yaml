summary: |-
  Kinh Đại Duyên được Đức Thế Tôn thuyết trong xứ Kuru, tại thị trấn Kammāsadhamma. Tôn giả Ānanda bạch rằng Pháp duyên khởi sâu xa, biểu hiện cũng sâu xa, nhưng con thấy dễ hiểu. Đức Thế Tôn bảo chớ nói vậy: không giác ngộ, không thâm nhập pháp này mà chúng sinh bị rối như cuộn chỉ, không vượt khỏi ác thú, đọa xứ và luân hồi.

  Đức Thế Tôn dạy cách đáp khi được hỏi: già-chết có duyên, do duyên sinh mà có già-chết; sinh do duyên hữu; hữu do duyên thủ; thủ do duyên ái; ái do duyên thọ; thọ do duyên xúc; xúc do duyên danh-sắc; danh-sắc do duyên thức; thức lại do duyên danh-sắc. Như vậy, từ hai pháp duyên lẫn nhau, già-chết cùng toàn khối khổ tập khởi. Từng mắt bị phủ định: nếu mắt ấy hoàn toàn không có, điều nó duyên khởi không thể được thấy.

  Từ thọ, ái sinh tầm cầu, lần lượt lợi, quyết định, tham dục, đắm trước, chấp giữ, hà tiện, thủ hộ; từ thủ hộ, nhiều pháp ác bất thiện sinh khởi; hai dòng tuy hai phương diện, cùng hội tụ ở thọ. Bảy câu hỏi bảy đáp quanh danh-sắc, bốn về xúc, ba về thức trong thai mẹ, đều được Tôn giả Ānanda đáp không. Ngược lại, thức không tìm được chỗ đứng trong danh-sắc thì sinh, già, chết không thể được thấy.

  Bốn cách tuyên bố về ngã, hữu sắc hay vô sắc, hữu hạn hay vô hạn, tuyên về hiện tại, nơi khác sẽ thành, hay nuôi để thành, đều làm quan kiến tiềm ẩn; không tuyên bố thì không tiềm ẩn. Ba cách quán ngã quanh thọ bị bác: thọ là ngã thì ngã ấy vô thường; bảo ngã không cảm thọ thì nơi không còn thọ, ý niệm 'Tôi là' không hiện hữu; bảo ngã cảm thọ thì mọi thọ đoạn diệt, ý niệm 'Tôi là cái này' cũng vậy. Không quán như vậy, tỳ-kheo không chấp thủ, không dao động, đạt Niết-bàn, không còn quan kiến về Như Lai sau khi chết.

  Bảy trú xứ của thức và hai xứ, từ cõi người qua Phạm Chúng, Quang Âm, Biến Tịnh, ba xứ vô sắc, đến Vô Tưởng Hữu Tình Xứ và Phi Tưởng Phi Phi Tưởng Xứ; người biết như thật từng trú xứ không thích thú nơi đó, tỳ-kheo ấy là tuệ giải thoát. Tám giải thoát, từ thấy sắc đến Diệt Thọ Tưởng Định; tỳ-kheo nhập xuất thuận, nghịch, cả hai chiều, đoạn tận các lậu hoặc, chứng tâm và tuệ giải thoát vô lậu, gọi là câu phần giải thoát. Toàn kinh hướng về một điểm: thấy duyên khởi từ danh-sắc và thức đến toàn bộ khối khổ, qua không chấp thủ đạt giải thoát cao nhất ấy.
