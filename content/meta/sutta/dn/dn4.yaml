summary: |-
  Kinh Chủng Đức mở đầu khi Đức Thế Tôn du hành trong xứ Aṅga cùng khoảng năm trăm tỳ-kheo và trú bên bờ hồ sen Gaggarā ở Campā. Bà-la-môn Soṇadaṇḍa, người cai quản Campā nhờ lãnh địa do vua Bimbisāra ban, thấy dân chúng kéo đi yết kiến Sa-môn Gotama bèn nhắn họ chờ ông cùng đi. Năm trăm Bà-la-môn khuyên ông đừng đi vì sợ danh tiếng giảm, và liệt kê phẩm chất của ông từ dòng dõi đến chức thầy; Soṇadaṇḍa đáp lại bằng việc tán thán phẩm chất của Đức Thế Tôn, từ dòng dõi, tướng Đại Nhân đến việc hai vị vua và Pokkharasāti đều đã quy y, rồi kết luận Ngài là khách của chúng ta nên chúng ta phải đi.

  Trên đường đi và cả khi đã ngồi xuống, Soṇadaṇḍa vẫn lo bị hội chúng khinh thường nếu hỏi hoặc trả lời không đúng cách, vì danh tiếng giảm thì tài sản giảm; ông ước Đức Thế Tôn hỏi về truyền thống ba Veda để mình trả lời cho hài lòng. Biết dòng suy nghĩ ấy, Đức Thế Tôn hỏi ngược: một người phải có bao nhiêu yếu tố để được công nhận là Bà-la-môn. Soṇadaṇḍa nêu năm yếu tố: dòng dõi thanh tịnh đến bảy đời, thánh chú ba Veda, dung sắc, giới hạnh và trí.

  Đức Thế Tôn lần lượt hỏi có thể bỏ yếu tố nào: Soṇadaṇḍa chấp nhận bỏ dung sắc, rồi bỏ thánh chú, rồi bỏ dòng dõi, chỉ còn giới hạnh và trí. Các Bà-la-môn phản đối rằng ông hạ thấp dung sắc, thánh chú, dòng dõi; ông giải thích qua ví cháu trai Aṅgaka: đủ ba yếu tố kia nhưng nếu giết sinh mạng, lấy của không cho, ngoại tình, nói dối và uống chất say thì những yếu tố ấy có ích gì. Hai yếu tố còn lại không thể bỏ, vì trí tuệ được giới hạnh gột sạch và giới hạnh được trí tuệ gột sạch, như dùng tay này rửa tay kia; giới hạnh và trí tuệ được gọi là tối thượng ở đời.

  Đức Thế Tôn tán đồng rồi giải thích: giới hạnh ấy thành tựu khi một Như Lai xuất hiện, người nghe pháp xuất gia và chứng bốn thiền; trí tuệ ấy là trí và kiến dẫn đến biết không còn trở lại trạng thái hiện hữu này. Soṇadaṇḍa quy y làm nam cư sĩ trọn đời và mời cúng dường. Sáng hôm sau, sau bữa ăn, ông xin quy ước: giữa hội chúng, chắp tay nghĩa là đứng dậy đảnh lễ, tháo khăn nghĩa là cúi đầu, giơ roi trên xe nghĩa là xuống xe, hạ lọng nghĩa là đảnh lễ. Đức Thế Tôn dạy pháp khiến ông hoan hỷ rồi ra đi.
