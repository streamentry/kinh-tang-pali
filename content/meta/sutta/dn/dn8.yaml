summary: |-
  Một thời, Đức Thế Tôn trú tại Uruññā. Kassapa, vị tu lõa thể, hỏi tin đồn rằng Sa-môn Gotama chê bai mọi khổ hạnh, chỉ trích tất cả người khổ hạnh khắc khổ. Đức Thế Tôn phủ nhận: với thiên nhãn vượt loài người, Ngài thấy có người khổ hạnh khắc khổ tái sinh vào địa ngục, cũng có người tái sinh cõi trời; người khổ hạnh sống ít đau khổ cũng vậy, nên không thể chê bai mọi khổ hạnh.

  Với những vị sa-môn, Bà-la-môn thông minh, sắc bén, Đức Thế Tôn đồng ý một số điểm, không đồng ý một số điểm; ở những điểm đồng ý, người có trí hãy thẩm vấn, đối chiếu thầy với thầy, hội chúng với hội chúng: ai từ bỏ hoàn toàn các pháp bất thiện, đen tối, ai thọ trì đầy đủ các pháp thiện, sáng — phần lớn người có trí khi thẩm xét sẽ tán thán. Con đường tự mình biết điều ấy là Thánh đạo tám chi.

  Kassapa kể các lối khổ hạnh được xem là dấu hiệu của đời sa-môn, Bà-la-môn: lõa thể, liếm tay, ăn theo kỳ hạn đến nửa tháng một lần, ăn rau và các hạt dại, mặc vải gai, nằm trên gai, không uống nước, tắm ba lần mỗi ngày. Đức Thế Tôn trả lời: dù thực hành những lối ấy, nếu giới thành tựu, tâm thành tựu và tuệ thành tựu chưa được tu tập, người ấy còn rất xa phẩm chất sa-môn, Bà-la-môn.

  Kassapa nói làm sa-môn hay Bà-la-môn thật khó. Ngài đáp nếu chỉ nhờ khổ hạnh ấy mà khó, thì một gia chủ hay một nữ tỳ đội ghè nước cũng làm được; điều khó thật sự nằm ngoài chừng ấy: tỳ-kheo tu tập tâm từ, đoạn tận các lậu hoặc, chứng tâm giải thoát và tuệ giải thoát — vị ấy được gọi là sa-môn, Bà-la-môn. Lập luận ấy cũng dùng cho lời thật khó biết ai là sa-môn: lối khổ hạnh bên ngoài ai cũng nhận biết được; bậc chứng điều ấy mới khó nhận biết.

  Được hỏi thế nào là giới, tâm, tuệ thành tựu, Đức Thế Tôn mô tả: giới — từ bỏ sát sinh, xa lánh tà mạng; tâm — chứng bốn thiền; tuệ — hướng tâm đến tri kiến và biết rõ không còn trở lại trạng thái hiện hữu này; không có thành tựu nào khác cao hơn. Về giới, khổ hạnh thanh lọc, tuệ và giải thoát, Ngài không thấy ai ngang bằng, huống nữa vượt hơn; tiếng sư tử hống vang trước hội chúng cho đến khi người thực hành theo thành tựu. Kassapa xin xuất gia, xin biệt trú bốn năm thay vì bốn tháng dành cho người từng theo ngoại đạo, rồi chẳng bao lâu chứng A-la-hán.
