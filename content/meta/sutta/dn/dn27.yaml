summary: |-
  Kinh Khởi Thế Nhân Bổn được Đức Thế Tôn thuyết tại Sāvatthī, trong lầu của mẹ Migāra ở Đông Viên, cho Vāseṭṭha và Bhāradvāja, hai người xuất gia từ gia tộc Bà-la-môn đang sống tập sự giữa các tỳ-kheo. Hai người cho biết bị các Bà-la-môn chửi mắng, phải nghe lời tự xưng rằng chỉ Bà-la-môn là giai cấp cao nhất, thanh tịnh, là con ruột của Phạm thiên sinh từ miệng Ngài.

  Đức Thế Tôn đáp rằng các Bà-la-môn đã quên truyền thống xưa: phụ nữ Bà-la-môn vẫn mang thai, sinh con, vậy mà sinh từ bụng mẹ lại tự xưng do Phạm thiên sinh ra, tức vu khống Phạm thiên. Trong bốn giai cấp Sát-đế-lỵ, Bà-la-môn, Vessa và Sudda, các pháp tối và sáng đều xen lẫn; người trí không chấp nhận lời tự xưng ấy, vì vị tỳ-kheo nào là bậc A-la-hán được gọi là tối thượng do Pháp, và Pháp là tối thượng giữa loài người, cả trong đời này lẫn đời sau.

  Khi thế giới co lại, phần lớn chúng sinh sinh về cõi Ābhassara, do tâm tạo, tự phát sáng; khi thế giới mở ra, họ sinh trở lại đây. Một lớp vị đất ngon ngọt lan ra trên mặt nước; khi chúng sinh bắt đầu ăn, ánh sáng tự thân biến mất, mặt trăng mặt trời xuất hiện, ngày đêm được phân biệt. Càng ăn, thân thể càng thô cứng, người đẹp khinh người xấu, tính tự cao sinh khởi, và vị đất biến mất; nấm đất rồi dây leo padālatā lần lượt xuất hiện, biến mất theo cùng chu kỳ.

  Khi lúa chín không cần gieo trồng xuất hiện, đặc điểm nữ và nam hiện ra; do nhìn nhau quá lâu, ái dục sinh khởi, họ giao hợp. Khi bắt đầu tích trữ lúa, lúa đã cắt không mọc lại; từ đó lấy của không cho, khiển trách, nói dối cùng cầm gậy trừng phạt xuất hiện. Chúng sinh chọn ra một người để khiển trách, trục xuất đúng người; từ đó có danh xưng Mahāsammata vì được đại chúng chọn, Khattiya vì chủ ruộng đất, Rājā vì làm vui lòng bằng Pháp. Nhóm Bà-la-môn hình thành từ những ai loại bỏ các pháp xấu bất thiện, nhóm Vessa từ những ai sống đời giao hợp, làm nhiều nghề, nhóm Sudda từ những ai sống bằng săn bắt, rồi nhóm sa-môn từ cả bốn nhóm ấy; mỗi nhóm đều bằng Pháp, không phải bằng phi pháp.

  Trong cả năm nhóm ấy, ai làm ác sinh vào cõi khổ, ai làm thiện sinh vào cõi trời, ai làm cả hai cảm thọ cả lạc lẫn khổ; ai hộ trì thân, lời, ý và tu tập bảy pháp trợ giác ngộ thì nhập Niết-bàn ngay trong hiện tại. Kinh kết bằng bài kệ Phạm thiên Sanaṅkumāra: người thành tựu minh và hạnh là tối thượng giữa chư thiên và loài người.
