summary: |-
  Bài kinh Tướng thuộc Trường Bộ Kinh, do Đức Thế Tôn thuyết tại Sāvatthī, trong rừng Jeta, tu viện của Anāthapiṇḍika. Ngài nêu ba mươi hai đại tướng nam của bậc Đại Nhân: người đầy đủ các tướng ấy chỉ có hai hướng đi, không có hướng thứ ba — nếu sống tại gia thì thành Chuyển Luân Vương, vua chân chánh trị nước theo Pháp, đầy đủ bảy báu; còn nếu xuất gia thì thành bậc A-la-hán, Chánh Đẳng Giác, vén bỏ màn che của thế gian. Các đạo sĩ ngoài đạo cũng nhớ được các tướng ấy, nhưng không biết mỗi tướng do nghiệp nào mà có, nên kinh giải thích từng tướng bằng nghiệp đã làm ở đời trước.

  Mỗi tướng được trình bày theo cùng một trình tự: một nghiệp thiện đã làm đưa vị ấy sanh lên cõi trời; khi trở về kiếp sống này, vị ấy đạt được tướng tương ứng; nếu sống tại gia, người ấy thành Chuyển Luân Vương và hưởng một lợi ích nhất định, còn nếu xuất gia làm Phật thì lợi ích ấy cao hơn.

  Kinh lần lượt gắn từng tướng với nghiệp tương ứng: kiên trì thọ trì các pháp thiện, bố thí, trì giới, hiếu kính mẹ cha cho bàn chân đặt vững chãi; mang hạnh phúc đến cho nhiều người, che chở bằng chính pháp cho bánh xe ngàn nan nơi hai bàn chân, cùng hội chúng to lớn; xa bỏ giết sinh vật cho gót chân thon dài, ngón dài, thân thẳng như Phạm thiên, ứng với thọ mạng dài lâu; kết hiệp chúng sanh bằng bố thí, ái ngữ, lợi hành và đồng lợi cho tay chân mềm mại, có tấm lưới.

  Những tướng tiếp theo gắn với các nghiệp như: không nóng giận và bố thí y áo mềm mại cho da màu vàng như vàng ròng; đoàn tụ người thân thất tán cho nam căn được vỏ bọc che kín; nhìn thẳng bằng đôi mắt tình thương cho mắt xanh chàm, lông mi như bò cái. Nhóm tướng nơi miệng gắn với khẩu nghiệp: nói chân thật cho mỗi lỗ lông một sợi lông và lông mài trắng giữa hai lông mày; xa lời chia rẽ cho bốn mươi răng khít không kẽ hở; xa lời độc ác cho lưỡi dài rộng, tiếng nói như Phạm thiên; sống bằng chánh mưu sinh cho răng trắng tinh sạch.

  Ở mỗi tướng, phần quả trong đời Phật đều thắng hơn phần quả trong đời vua: thọ mạng dài lâu, quyến thuộc gắn bó, trí tuệ, bảy thứ tài, được yêu mến, hội chúng không thể bị chia rẽ, không thể bị cản trở hay tiêu diệt. Bài kinh kết thúc khi các tỳ-kheo hoan hỷ, tán thán lời Đức Thế Tôn.
