notes: |-
  **Sửa lớp lỗi lệch khoá (2026-10-05) — quét tìm trên toàn tầng.** Luật *"Pāli trùng
  nguyên văn thì cách dịch phải khớp"*: bài này có **9 nhóm / 45 khoá** trùng Pāli mà bản
  Việt khác nhau. Đọc từng nhóm cùng khoá liền trước / khoá / khoá liền sau cho thấy phần
  lớn **không phải khác cách diễn đạt** mà là **lệch đúng một khoá**: bản Việt nhét nội dung
  khoá kế vào khoá trước rồi để khoá thật mang nội dung của khoá khác — cùng lớp với lỗi
  `dn16` đã sửa ở PR #244.

  **Đã sửa 15 khoá.**

  - **Chuỗi lệch ở `2.4.10`–`2.4.19` (10 khoá).** Bản Việt lệch **đúng một khoá** suốt bốn
    vòng hỏi–đáp: `2.4.10` mang nội dung của `2.4.11`, `2.4.11` của `2.4.12`, … Hệ quả là ba
    khoá `“Taṁ kiṁ maññasi, ambaṭṭha, ` (`2.4.10`, `2.4.14`, `2.4.17`) **không còn lời Việt
    nào** mang nội dung Pāli của chính nó, còn `2.4.18` và `2.4.19` lại mang hai câu tóm
    lược (*"Ambaṭṭha, như vậy truyền thống của ông không thực hành những lối sống ấy."*,
    *"Ngay cả những cách rời xa minh và hạnh ấy cũng không có nơi các ông."*) **không thuộc
    Pāli hai khoá ấy**. Đã dựng lại theo đúng tiền lệ ngay trong chính bài này: `2.4.6`–`2.4.9`
    (cùng dạng, cùng cấu trúc `hỏi → giả định → hỏi lại → đáp`) và `1.24`–`1.27`. Câu dài
    *"Ông và truyền thống của mình có … mang cuốc và giỏ đi vào rừng, nghĩ rằng"* dời từ `2.4.10`
    sang `2.4.11`; *"sẽ sống bằng củ và quả không?”"* từ `2.4.11` sang `2.4.12`; *"…dựng nhà lửa
    gần làng hay thị trấn và sống thờ lửa thiêng không?”* từ `2.4.13` sang `2.4.15` (Pāli `2.4.15`
    có `gāmasāmantaṁ vā nigamasāmantaṁ vā agyāgāraṁ`, `2.4.18` mới có
    `cātumahāpathe catudvāraṁ agāraṁ`); *"…dựng nhà lửa bốn cửa tại ngã tư và sống ở đó,
    nghĩ rằng:"* từ `2.4.15` sang `2.4.18`; *"‘Bất cứ sa-môn hay Bà-la-môn nào từ bốn phương
    đến, ta sẽ tiếp đãi họ hết khả năng’ không?”"* từ `2.4.16` sang `2.4.19`. Dấu chấm cuối mỗi
    khoá theo **đúng dấu cuối của Pāli khoá đó**. Kiểm ngoặc kép toàn khối `2.4.6`–`2.4.20`:
    **8 mở / 8 đóng**.
  - **`2.18.7` mang nội dung của `2.18.8`** (`"là tướng nam căn được che kín"`), còn `2.18.8` chỉ
    dịch **nửa sau** của Pāli (`… pahūtajivhatāya cā”ti.`) thành *"và tướng lưỡi dài rộng."*. Đã
    dựng lại: `2.18.7` theo `2.11.5`, `2.18.8` theo `2.12.4` = `2.11.6`.
  - **`2.1.5`** mang câu không thuộc Pāli (*"Nhưng đó không phải tiêu chuẩn của minh và hạnh vô
    thượng."*). Pāli `‘arahasi vā maṁ tvaṁ, na vā maṁ tvaṁ arahasī’ti.` đã được dịch đúng ở
    `2.1.3`; đã sửa `2.1.5` theo **đúng câu ấy**.
  - **`1.24.13` và `1.25.12`** mở ngoặc kép `"` mà không đóng, trong khi Pāli
    `“No hidaṁ, bho gotama”. ` tự đóng. Đã đóng ngoặc theo `1.26.5`.

  **Không xác định được ⇒ ĐỂ NGUYÊN** (khác biệt hợp lệ, hoặc ngoài danh sách):

  - `Atha kho bhagavā ambaṭṭhaṁ māṇavaṁ etadavoca:` — `1.15.3` / `1.9.4` dịch **hỏi** vì khoá
    kế là câu hỏi (`”ti?`: *"Ambaṭṭha, ông thuộc dòng họ nào?"*), `1.20.1` / `1.20.10` dịch
    **nói** vì khoá kế là câu phát biểu / mệnh lệnh. Khác vị ngữ sở hữu từ → phải khác.
  - `Atha kho bhagavato etadahosi:` — `1.15.1` = `1.23.1` dịch **nghĩ** vì khoá kế là ý nghĩ trong
    ngoặc kép; `2.12.1` / `2.18.5` dịch **biết** vì khoá kế là mệnh đề tường thuật. Hợp lệ.
  - `Dvīsu mahāpurisalakkhaṇesu kaṅkhati…` — `2.11.5` mở mệnh đề (*"về hai tướng ấy chàng còn
    nghi ngờ:"*), `2.12.3` = `2.18.3` nối tiếp câu trước (*"và còn nghi ngờ"*). Khác vị ngữ.
  - `“Api nu naṁ brāhmaṇā bhojeyyuṁ…` — `1.26.6` dùng *"Họ có cho người ấy ăn…"* thay *"Các
    Bà-la-môn có…"*; đây là khác cách chỉ chủ ngữ đã dùng ngay ở `1.24.8`, `1.26.8`, `1.26.10`,
    không phải lệch khoá. Để nguyên.
  - `Bhagavantaṁ etadavoca:` — `2.12.9` *"Chàng nói:"*, `2.19.3` *"Ông thưa với Đức Thế Tôn:"*.
    Khác độ dài, cùng nghĩa. Để nguyên.
  - `2.4.3` mở `"` mà không đóng và `2.4.4` cũng không đóng ngoặc; Pāli `“No hidaṁ, bho gotama. `
    ở `2.4.3` vốn chưa đóng — ngoài danh sách nên **không sửa**.
  - `2.10.2`, `2.10.5`, `2.10.8`, `2.10.11` rút gọn `Evaṁ su te … seyyathāpi tvaṁ etarahi sācariyako”ti?`
    thành *"Có phải như vậy không?”*. Là tóm lược, không lệch khoá; ngoài danh sách nên **không sửa**.

  Hạ `semantic_fidelity` 9,3 → **8,6** và `segment_alignment` 10 → **9,0**: 13 khoá từng mang sai
  nội dung và 12 khoá từng lệch khoá là lỗi ở **cả hai** tiêu chí, không chỉ ở văn phong.
  `final_score` tính lại bằng script (trung bình số học thô của đúng 10 tiêu chí), `assessed_at`
  cập nhật. Lỗi đã sửa xong nên **không blocker**; `final_score` vẫn > 9,0 nên trạng thái giữ
  nguyên `published` theo quality gate.

summary: |-
  Kinh Ambaṭṭha mở đầu khi Đức Thế Tôn du hành trong xứ Kosala cùng khoảng năm trăm tỳ-kheo và trú trong rừng gần Icchānaṅgala. Bà-la-môn Pokkharasāti ở Ukkaṭṭhā nghe tiếng về Sa-môn Gotama, bèn sai học trò nội trú Ambaṭṭha, thông thạo ba Veda và được thầy công nhận ngang mình, đi tìm hiểu tiếng đồn. Pokkharasāti nhắc truyền thuyết ba mươi hai tướng Đại Nhân: người đầy đủ các tướng ấy nếu sống tại gia sẽ làm Chuyển Luân Vương với bảy báu, nếu xuất gia sẽ thành bậc A-la-hán, Chánh Đẳng Giác.

  Ambaṭṭha đến với thái độ khinh miệt, vừa đi vừa nói khi Đức Thế Tôn đang ngồi, và ba lần gọi người Sakya là thấp kém vì không được mời ngồi ở Kapilavatthu. Đức Thế Tôn bèn hỏi về dòng họ của chàng: dòng Kaṇhāyana bắt nguồn từ Kaṇha, con trai nữ nô lệ Disā của vua Okkāka, tổ tiên người Sakya; Kaṇha sau trở thành ẩn sĩ lớn xin vua cưới công chúa Maddarūpī, và mũi tên vua không bắn ra nổi, nên vì sợ uy lực Phạm hình, vua phải gả công chúa. Khi Ambaṭṭha im lặng ba lần trước câu hỏi hợp lý, Dạ-xoa Vajirapāṇī hiện lên đe dọa đập đầu chàng vỡ thành bảy mảnh; chàng bèn thừa nhận nguồn gốc ấy.

  Đức Thế Tôn dùng chính quy ước của các Bà-la-môn để chứng minh Sát-đế-lỵ cao hơn: con của hai dòng hỗn chủng đều không được quán đảnh làm vua, còn Sát-đế-lỵ bị trục xuất vẫn được Bà-la-môn kính trọng như trước. Ngài tán đồng bài kệ Phạm thiên Sanaṅkumāra: Sát-đế-lỵ cao nhất giữa những người lấy dòng họ làm tiêu chuẩn, nhưng người đầy đủ minh và hạnh là tối thắng giữa chư thiên và loài người. Minh và hạnh ấy không bàn về sinh chủng, dòng họ hay chuyện gả cưới; hạnh là bốn thiền, minh là tri kiến và biết không còn gì nữa cho trạng thái hiện hữu này. Ngài cũng nêu bốn con đường rời xa minh hạnh, từ sống bằng trái cây tự rụng đến dựng nhà lửa bốn cửa tại ngã tư, mà người theo chỉ đáng làm người phục vụ; truyền thống của Ambaṭṭha không theo nổi lối nào, và thuộc lòng bài tụng xưa không làm ai thành ẩn sĩ.

  Ambaṭṭha rồi Pokkharasāti đều còn nghi hai trong ba mươi hai tướng; Đức Thế Tôn tỏ ra tướng nam căn được che kín và tướng lưỡi dài rộng. Pokkharasāti mời cúng dường; sau bữa ăn, Đức Thế Tôn thuyết pháp theo thứ lớp từ bố thí, giới hạnh, cõi trời đến bốn sự thật về khổ, và pháp nhãn khởi lên nơi ông. Ông quy y cùng gia quyến và mời Ngài đến thăm các gia đình cư sĩ ở Ukkaṭṭhā.
