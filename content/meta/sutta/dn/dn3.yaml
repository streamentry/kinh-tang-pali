  **Sửa dấu lược bịa (2026-10-05) — đợt hai.** Đo bằng script trên **mọi** khoá, không chỉ khoá
  ≥ 40 ký tự, và tính cả `…pe…` theo quy ước một dấu lược của tầng Việt:

  - **Ba khoá đã bỏ nội dung Pāli rồi để lại `…`**, dù Pāli viết đủ: `2.4.11`
    (PĀLI 169ch → VI 73ch, **2,3×**) · `2.4.15` (253ch → 99ch, **2,5×**) · `2.4.18`
    (257ch → 90ch, **2,8×**). Mất trọn vế `pavattaphalabhojanatañca anabhisambhuṇamāno`,
    `kandamūlaphalabhojanatañca anabhisambhuṇamāno`, `aggipāricariyañca anabhisambhuṇamāno`
    — tức mất luôn **tiêu chí** của bài: đây là bốn lối sống mà truyền thống của Ambaṭṭha đã thử
    và không theo nổi, và Đức Thế Tôn chỉ vào đúng chúng. Đã dịch lại từ Pāli.

  **Dấu lược bịa này đến từ đâu — và vì sao Pāli là authority:** bản Anh **đã ghim** (Sujato) ở
  đúng ba khoá ấy cũng viết `…` (*Have you with your denomination … plunged into a wilderness
  region…*). Bản Việt đã chép theo. Nhưng Pāli `2.4.11` không có `…` nào, và cùng bài có tiền lệ
  gần như y hệt ở `2.3.7` / `2.3.11` / `2.3.14`, nơi Sujato dịch **đủ**. Pāli là authority cuối
  cùng nên tôi viết đủ.

  **Tiền lệ dùng lại (luật “Pāli trùng nguyên văn thì dùng lại nguyên văn bản dịch”), đếm
  bằng script:** với ba khoá trên, Pāli **không** trùng byte với khoá nào ở bài khác (quét
  toàn tầng, > 20 ký tự: 0 cặp). Trong chính dn3 thì tiền lệ là:

  - `2.4.7` — cùng khung `api nu tvaṁ … sācariyako:` ⇒ dùng làm khung cho cả ba vế mở đầu
    (*Vì không đạt được minh và hạnh vô thượng, … ông và truyền thống của mình có …*).
  - `2.3.7` — cho `pavattaphalabhojanatañca anabhisambhuṇamāno` ⇒ *cũng không sống nổi bằng trái
    cây tự rụng*.
  - `2.4.12` — cho `kandamūlaphalabhojanatañca` ⇒ *củ và quả*.
  - `2.4.7` dùng *đi sâu vào rừng* cho `majjhogāhasi`; bản cũ của `2.4.11` ghi *đi vào rừng*, nên
    tôi theo `2.4.7`.
  - `aggipāricariyañca` ở `2.4.18` không có tiền lệ dịch đầy đủ — `2.3.14` đã **nén** thành
    *không sống nổi bằng các cách trên*. Tôi viết đủ: *cũng không sống nổi bằng việc thờ lửa
    thiêng*, đồng bộ với `2.4.15` và `2.3.11` vốn đã dịch `aggiṁ paricaranto` là *thờ lửa thiêng*.

