summary: |-
  Kinh Ưu-đàm-bà-la Sư tử hống kể chuyện Đức Thế Tôn trú tại Rājagaha, trên núi Gijjhakūṭa. Vì Ngài đang độc cư, gia chủ Sandhāna giữa trưa đến vườn du sĩ của nữ cư sĩ Udumbarikā, nơi du sĩ Nigrodha ngồi cùng hội chúng ba ngàn du sĩ bàn chuyện phù phiếm. Sandhāna nói hội chúng ấy ồn ào, khác hẳn Đức Thế Tôn thường lui tới trú xứ xa vắng thích hợp cho độc cư; Nigrodha khinh bỉ, thề chỉ bằng một câu hỏi sẽ làm sa-môn Gotama bối rối, vây chặt như chiếc vò rỗng.

  Với thiên nhĩ, Đức Thế Tôn nghe được lời ấy, xuống núi kinh hành bên bờ hồ Sumāgadhā; hội chúng định hỏi Ngài pháp nào huấn luyện đệ tử đến an ổn nơi mục đích sâu xa của đời phạm hạnh. Ngài mời Nigrodha hỏi về pháp tu thanh tẩy cao hơn trong chính truyền thống của ông. Ngài kể trọn các tập tục khổ hạnh, từ sống lõa thể, ăn uống khắc khổ đến mặc áo gai, rồi kết luận ngay cả khổ hạnh như vậy vẫn đầy cấu uế: tự mãn, khen mình chê người, khổ hạnh vì mong lợi dưỡng và danh tiếng, tật đố, nói dối, sân giận, tà kiến, chấp chặt quan điểm; đoạn các cấu uế ấy, khổ hạnh mới chỉ đạt lớp vỏ ngoài.

  Chế ngự bằng bốn pháp không sát sinh, không lấy của không cho, không nói dối, không mong cầu các dục lạc, từ bỏ năm triền cái và biến mãn các phương với tâm đi cùng từ, bi, hỷ, xả, khổ hạnh mới chỉ đạt đến lớp vỏ cây; thêm nhớ lại nhiều đời sống quá khứ, đạt đến lớp gỗ dác; thêm thiên nhãn thấy chúng sinh chết đi và tái sinh theo nghiệp, mới đạt tối thượng, đạt đến lõi.

  Nghe Đức Thế Tôn nói còn có trạng thái cao hơn, các du sĩ thừa nhận cả thầy lẫn trò đã thất bại. Sandhāna nhắc lại lời khinh bỉ ấy; Nigrodha hổ thẹn, thừa nhận đã nói ngu si, mê muội và bất thiện, xin Ngài chấp nhận lỗi ấy; Ngài chấp nhận: thấy lỗi là lỗi, sửa chữa đúng Pháp là sự trưởng thành trong luật của bậc Thánh.

  Ngài cũng cho biết người có trí, thực hành đúng như được dạy, sẽ chứng ngộ cứu cánh phạm hạnh vô thượng từ bảy năm ngắn dần đến bảy ngày. Ngài khẳng định không dạy để có học trò hay để ai từ bỏ học tụng, sinh kế của mình, mà để đoạn trừ các pháp gây ô nhiễm, cho các pháp thanh tịnh tăng trưởng, trí tuệ viên mãn ngay trong hiện tại; rồi cất tiếng sư tử hống, bay lên hư không về lại núi Gijjhakūṭa.
