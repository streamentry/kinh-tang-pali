summary: |-
  Kinh Chuyển Luân Thánh Vương mở đầu tại Mātulā, xứ Magadha, với lời dạy các tỳ-kheo hãy sống tự mình làm hòn đảo và nơi nương tựa, không nương tựa gì khác, lấy Pháp làm hòn đảo và nơi nương tựa; tức quán thân trên thân, thọ, tâm, pháp, nhiệt tâm, tỉnh giác, chánh niệm, nhiếp phục tham ưu ở đời. Ngài bảo đi trong lãnh vực của mình để Māra không tìm được chỗ xâm nhập; do thực hành các pháp thiện, công đức tăng trưởng.

  Ngài kể chuyện vua Daḷhanemi, Chuyển Luân Thánh Vương đầy đủ bảy báu, trị vì vùng đất đến tận biển bằng Pháp. Khi bánh xe báu lui khỏi vị trí, vị vua trao ngôi cho thái tử rồi xuất gia; bảy ngày sau bánh xe biến mất. Người kế vị được dạy bổn phận cao quý ấy: nương tựa nơi Pháp, thiết lập bảo vệ đúng Pháp cho mọi hạng người, cấp tài sản cho người không có, thỉnh thoảng hỏi các sa-môn Bà-la-môn điều gì thiện, điều gì bất thiện để tránh và thực hành. Bánh xe báu xuất hiện, lăn qua bốn phương; các vua đối địch quy thuận, được dạy tránh sát sinh, lấy của không cho, tà hạnh trong dục, nói dối, chất say, hưởng dùng theo mức quy định.

  Sáu vị vua kế tiếp cũng như vậy; đến vị thứ bảy xuất gia, con không hỏi về bổn phận cao quý, trị nước theo hiểu biết riêng. Vị vua ấy thiết lập bảo vệ nhưng không cấp tài sản cho người không có; nghèo đói, trộm cắp, vũ khí, sát sinh, nói dối, lời nói chia rẽ, tà hạnh trong dục, lời thô ác, tham muốn, sân hận, tà kiến lần lượt lan rộng; tuổi thọ và sắc đẹp suy giảm dần, từ tám mươi ngàn năm xuống một trăm năm.

  Thời người chỉ sống mười năm, mười nghiệp đạo thiện biến mất, người bất kính lại được tôn kính; giữa chúng sinh khởi thù hận dữ dội, có thời kỳ vũ khí kéo dài bảy ngày. Một số người ẩn vào rừng rậm; ra khỏi nơi ẩn náu, họ ôm lấy nhau, hòa giải, tự hứa từ bỏ sát sinh.

  Ngược lại, khi họ từ bỏ các pháp bất thiện, kính mẹ cha, tôn trọng sa-môn Bà-la-môn và người lớn tuổi, tuổi thọ tăng dần lên tám mươi ngàn năm; vua Saṅkha xuất hiện, và Đức Thế Tôn tên Metteyya sẽ xuất hiện, vị vua ấy sẽ xuất gia dưới sự chỉ dạy của Ngài. Kinh khép lại bằng lời nhắc sống tự mình làm hòn đảo, lấy Pháp làm nơi nương tựa, rồi chỉ tuổi thọ, sắc đẹp, an lạc, tài sản và sức mạnh của tỳ-kheo, cao nhất là đoạn tận các lậu hoặc.
