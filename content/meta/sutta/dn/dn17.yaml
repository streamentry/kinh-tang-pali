notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.1.3 — bỏ ‘lại’ (Pāli `Atha kho, ānanda, rañño
  mahāsudassanassa etadahosi` không có `puna`; cùng câu đã dịch ‘Rồi, này Ānanda, vua
  Mahāsudassana nghĩ:’ ở 1.22.1, 2.1.1, 2.6.2); khoá 2.13.8 — ‘thế giới Phạm thiên’ → ‘cõi Phạm
  thiên’ (`brahmaloka`: ‘cõi Phạm thiên’ chiếm áp đảo, 53 khoá), đồng bộ 2.13.3 cùng bài; giữ
  ‘Phạm trú’ cho `brahmavihāre` (không đổi sang ‘vô lượng tâm’: đó là `appamaññā`) và giữ ‘khi
  thân hoại mạng chung’ (dạng đang dùng, 97 lần); giữ nguyên khoá 1.22.1, 2.1.1, 2.6.2 (giữ tên
  ‘Mahāsudassana’ đúng `rañño mahāsudassanassa`; dạng modal ‘vua’ bỏ tên) và khoá 1.22.7 (‘một
  bằng vàng, một bằng bạc…’ giữ `ekaṁ … ekaṁ`; Pāli khác 1.26.6 vì có lặp `ekaṁ sopānaṁ`).
summary: |-
  Kinh Đại Thiện Kiến Vương được Đức Thế Tôn thuyết khi Ngài sắp nhập Niết-bàn tại Kusinārā, trong rừng sāla của người Malla, giữa hai cây sāla song đôi. Tôn giả Ānanda xin Ngài đừng nhập Niết-bàn ở thị trấn nhỏ bé như nhánh phụ, mà hãy chọn một thành phố lớn nơi các Sát-đế-lợi, Bà-la-môn, gia chủ có lòng tin sẽ tôn kính xá-lợi. Đức Thế Tôn từ chối, kể rằng thuở xưa Kusinārā là kinh đô Kusāvatī của vua Mahāsudassana, vị Sát-đế-lợi quán đảnh làm chủ bốn phương, bao quanh bảy lớp tường và bảy hàng cây cọ báu.

  Vua có đủ bảy báu. Ngày rằm bố-tát, bánh xe báu hiện ra; vua rảy nước và phán bánh xe hãy lăn đi, hãy chinh phục, rồi đi theo bánh xe qua bốn phương; các vua đối địch quy phục và được dạy: không sát sinh, không lấy của không cho, không tà hạnh trong dục, không nói dối, không uống chất say. Voi báu Uposatha, ngựa báu Valāhaka, ngọc báu, nữ báu, gia chủ báu cùng vị chỉ huy báu lần lượt hiện ra; voi, ngựa bay trong không trung, ngọc báu tỏa sáng một do-tuần. Bốn thành tựu đặc biệt: sắc đẹp, trường thọ, ít bệnh, và được Bà-la-môn, gia chủ yêu mến như cha con.

  Vua cho đào hồ sen mở cho mọi người, bố thí thức ăn, y phục, chỗ nằm; khi các Bà-la-môn, gia chủ dâng tài sản bị từ chối, Sakka sai thiên tử Vissakamma xây cung điện Dhamma với tám mươi bốn ngàn phòng mái nhọn bằng vàng, bạc, lưu ly, pha lê. Vua tự nhận uy thế của mình do ba nghiệp bố thí, tự chế, tiết chế; ngài chặn các tư duy dục, sân hận, làm hại, chứng và trú bốn thiền, rồi lan tỏa tâm từ, bi, hỷ, xả khắp mọi phương.

  Vua có tám mươi bốn ngàn của mỗi loại: thành phố, cung điện, voi, ngựa, xe, ngọc, phụ nữ, gia chủ, chư hầu, bò sữa, y phục, mỗi lúc chỉ dùng một. Hoàng hậu Subhaddā đến xin vua hãy ham muốn các của báu và luyến tiếc sự sống; vua nói đó là lời không đáng nghe lúc cuối, dạy rằng mọi thứ thân yêu đều phải đổi khác, lìa xa, phân tán, đừng chết trong luyến tiếc; bà bật khóc rồi lặp lại lời ấy.

  Vua qua đời nhẹ nhàng và sinh về thế giới Phạm thiên nhờ bốn Phạm trú. Đức Thế Tôn tiết lộ chính Ngài là vị vua ấy: tất cả các hành đã qua, đổi khác, vô thường, không đáng nương tựa, đủ để nhàm chán, ly tham, giải thoát; đây là lần thứ bảy Ngài đặt thân xuống nơi này với thân Chuyển Luân Vương, không có lần thứ tám.
