summary: |-
  Kinh Thập Thượng là bài thứ ba mươi bốn của Tạng Kinh Trường. Một thời, Đức Thế Tôn trú tại Campā, bên bờ hồ sen Gaggarā, cùng đại Tăng-già khoảng năm trăm tỳ-kheo. Tại đó, Tôn giả Sāriputta tuyên thuyết cho các tỳ-kheo bài Thập Thượng, pháp đưa đến đạt Niết-bàn, để làm tận cùng khổ đau, giải thoát khỏi mọi điều kết buộc.

  Toàn bài là danh mục pháp theo thang số một đến mười, mỗi nhóm được xét dưới mười góc độ lặp lại: có nhiều công dụng, cần tu tập, cần hiểu rõ tột cùng, cần trừ diệt, thuộc phần suy giảm, thuộc phần thù thắng, khó thấu suốt, cần làm sinh khởi, cần thắng tri, cần chứng ngộ. Mỗi nhóm khép lại bằng lời khẳng định các pháp ấy thực có, chân thật, do Như Lai tự mình thắng tri.

  Nhóm một pháp lấy không phóng dật đối với các pháp thiện làm pháp có nhiều công dụng, mạn “ta là” cần trừ diệt, và tâm giải thoát bất động cần chứng ngộ. Nhóm hai pháp ghi niệm và tỉnh giác, chỉ và quán, danh và sắc; minh và giải thoát cần chứng ngộ. Nhóm ba pháp đối lại ba gốc bất thiện với ba gốc thiện, nêu ba ái cần trừ diệt. Nhóm bốn pháp gồm bốn niệm xứ, bốn thức ăn, bốn dòng lũ, bốn chân lý Thánh và bốn quả Sa-môn. Nhóm năm pháp liệt kê năm triền cái, năm tâm kết, năm căn, năm thủ uẩn, năm chỗ giải thoát.

  Nhóm sáu pháp mở đầu bằng sáu pháp làm cho thân mật giữa các bậc cùng sống Phạm hạnh, rồi sáu chỗ niệm, sáu nội nhập, sáu ái thân. Nhóm bảy pháp nêu bảy tài sản Thánh, bảy giác chi, bảy tùy miên và bảy lực của tỳ-kheo đã diệt tận lậu hoặc; phần tụng thứ nhất kết thúc. Nhóm tám pháp gồm tám nhân, tám duyên đưa đến tuệ sơ Phạm hạnh chưa đạt, Đạo Thánh tám phần, tám cơ sở biếng nhác đối lại tám cơ sở phát khởi tinh tấn, và tám giải thoát. Nhóm chín pháp nêu chín pháp lấy tác ý như lý làm gốc dẫn đến giải thoát, chín pháp lấy ái làm gốc, chín cách trừ sân hận và chín diệt tiệm tiến. Nhóm mười pháp gồm mười pháp làm chỗ nương tựa, mười nhập xứ tục thành, mười đạo thiện và bất thiện nghiệp, mười chỗ trú của bậc Thánh và mười pháp của bậc vô học.

  Sau lời hoan hỷ, tán thán của các tỳ-kheo, bài kinh khép lại Phẩm Pāṭika và toàn bộ Tạng Kinh Trường, hướng về mục đích nêu ngay từ đầu: pháp đưa đến đạt Niết-bàn, làm tận cùng khổ đau, giải thoát khỏi mọi điều kết buộc.
