notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và xuất
  bản.** Ký hiệu lược `…pe…` của bilara lọt nguyên văn vào bản Việt ở **28 khoá**. `…pe…`
  là **ký hiệu lược**, không phải chữ; quy ước kho là giữ **đúng MỘT** `…`. Ở **28 khoá**
  Pāli ghim **có** dấu lược nên chỉ rút cụm còn một `…`, nghĩa không đổi: `dn16:1.10.5`,
  `dn16:1.11.5`, `dn16:1.8.2`, `dn16:1.8.3`, `dn16:1.9.1`, `dn16:2.12.6`, `dn16:2.12.7`,
  `dn16:2.26.4`, `dn16:2.26.5`, `dn16:2.6.7`, `dn16:2.7.6`, `dn16:3.23.1`, `dn16:3.36.4`,
  `dn16:3.36.5`, `dn16:3.36.6`, `dn16:3.36.7`, `dn16:3.39.1`, `dn16:3.42.1`,
  `dn16:3.44.1`, `dn16:3.46.1`, `dn16:3.5.1`, `dn16:4.10.11`, `dn16:5.16.21`,
  `dn16:5.16.22`, `dn16:5.16.31`, `dn16:5.16.32`, `dn16:5.24.10`, `dn16:6.6.1`.

  `final_score` tính lại bằng script (trung bình số học thô của đúng 10 tiêu chí),
  `assessed_at` cập nhật. Đây là sửa lỗi kỹ thuật/thuật ngữ ở mức khoá, không phải biên
  dịch lại bài; không blocker, trạng thái giữ nguyên theo quality gate.
  - >-
    **Sửa nốt một khoá lược bị cắt đôi qua ranh giới segment.** `dn16:4.10.6` còn giữ nguyên
    `pe… ` — nghĩa là **ký hiệu lược của bilara lọt vào bản Việt**, không phải chữ. Pāli ghim ở
    `4.10.5` kết thúc bằng `…` và `4.10.6` là `pe… `, ghép lại đúng `…pe… `; kho có **12
    tiền lệ** render dạng này thành **đúng một** `…` (`dn1:3.4.1`, `dn1:3.8.1`, `mn75:11.2`,
    `mn93:18.4`, `mn96:8.6`, `mn96:8.8`, `dn33:1.11.31`, `an11.22:3.1`, `mn119:15-17.8`…).
    Đã theo đúng tiền lệ. Quét lại toàn tầng: **0** khoá Việt nào còn chứa `…pe…`, `pe…`
    hay `…pe`.
    **Sửa lớp lỗi lệch khoá ở `4.9` / `4.10` / `4.11` (2026-10-04).** Quét tìm trên toàn
    tầng phát hiện **8 khoá** trong bài này sai theo cùng một kiểu: bản Việt **nhét nội dung
    khoá kế vào khoá trước**, rồi để khoá thật là chuỗi rỗng `(…)`.

    - `4.9.2` nuốt nội dung của `4.9.3` (dài 152 ký tự, gộp hai mệnh đề Pāli vào một);
      `4.9.3` lại mang nội dung của `4.9.4`; `4.9.4` **trống** trong khi Pāli có 47 ký tự
      văn xuôi — tức **một đoạn chưa hề được dịch**.
    - `4.10.2` nuốt nội dung của `4.10.3`; `4.10.3` **trống** (Pāli 55 ký tự).
    - `4.11.2` nuốt nội dung của `4.11.3`; `4.11.3` mang nội dung của `4.11.4`; `4.11.4`
      **trống** (Pāli 47 ký tự).

    Đã sửa theo **tiền lệ đúng ngay trong chính bài này**: `4.8.2` / `4.8.3` — khoá `:2`
    giữ mệnh đề "Tôi đã nghe…", khoá `:3` giữ "đây là Pháp, đây là luật…". Và theo **từ vựng
    của chính dn16**: `saṅghassa` → **đại chúng** (47 khoá, 0 khoá dùng *Tăng chúng*) ·
    `therānaṁ` → **các vị trưởng lão** (theo `4.10.9`) · `sammukhā … paṭiggahitaṁ` →
    **đã nghe trước mặt …, đã nhận được trước mặt …** (theo `3.40.1`, `4.8.2`, `4.42.7`).

    Ba chuỗi Pāli này **trùng nguyên văn** với `an4.180:6.3/8.3/9.3` (một bản dịch 67
    khoá có sẵn), nhưng bản đó dùng *Tăng chúng* và *đã lãnh nhận* — **không** dùng lại, vì
    trong cùng một bài thì từ vựng phải khớp nhau trước. Đó là ngoại lệ có lý do cho luật
    *"Pāli trùng thì dịch trùng"*, và ghi rõ ở đây.

    Dấu chấm cuối mỗi khoá theo **đúng dấu cuối của Pāli khoá đó** (`4.9.3` hết bằng phẩy,
    `4.10.3` / `4.11.3` hết bằng gạch dài). Kiểm lại: ngoặc kép toàn bài **cân** (491 mở /
    491 đóng), 14/14 tệp NFC.

    Hạ `semantic_fidelity` 9,3 → **8,9** và `segment_alignment` 10 → **9,2**: ba khoá **chưa
    được dịch** và ba khoá **mang sai nội dung** là lỗi ở cả hai tiêu chí, không chỉ ở văn
    phong.
