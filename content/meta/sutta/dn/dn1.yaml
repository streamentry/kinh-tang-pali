notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và xuất
  bản.** Ký hiệu lược `…pe…` của bilara lọt nguyên văn vào bản Việt ở **16 khoá**. `…pe…`
  là **ký hiệu lược**, không phải chữ; quy ước kho là giữ **đúng MỘT** `…`. Ở **16 khoá**
  Pāli ghim **có** dấu lược nên chỉ rút cụm còn một `…`, nghĩa không đổi: `dn1:2.27.6`,
  `dn1:2.27.7`, `dn1:2.27.8`, `dn1:2.27.9`, `dn1:2.27.12`, `dn1:2.27.13`, `dn1:2.27.14`,
  `dn1:2.27.15`, `dn1:2.27.16`, `dn1:2.27.17`, `dn1:2.27.18`, `dn1:2.27.19`, `dn1:2.29.1`,
  `dn1:2.34.1`, `dn1:2.38.5`, `dn1:2.40.1`.

  3 khoá `dn1:2.29.1`, `dn1:2.34.1`, `dn1:2.40.1` là dạng **bị cắt**: segment Pāli ngay
  trước kết bằng `…` và segment này mở bằng `pe…`, tức ký hiệu `…pe…` bị bilara cắt đôi
  qua ranh giới khoá (Pāli ghim: `dn1:2.28.2` = `… natthi ito bahiddhā …`, `dn1:2.29.1` =
  `pe… `). Đã theo đúng tiền lệ đã có trong kho: `an11.22:3.1`, `an11.502-981:2.2`,
  `dn1:3.4.1`, `dn1:3.8.1`, `dn33:1.11.31`, `mn75:11.2`, `mn93:18.4`, `mn96:8.6`,
  `mn96:8.8`, `mn137:12.3`, `mn119:15-17.8`, `mn119:18.6` — mỗi khoá ấy dịch thành đúng
  một `…`.

  `final_score` tính lại bằng script (trung bình số học thô của đúng 10 tiêu chí),
  `assessed_at` cập nhật. Đây là sửa lỗi kỹ thuật/thuật ngữ ở mức khoá, không phải biên
  dịch lại bài; không blocker, trạng thái giữ nguyên theo quality gate.
