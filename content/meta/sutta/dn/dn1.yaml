notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và xuất
  bản.** Ký hiệu lược `…pe…` của bilara lọt nguyên văn vào bản Việt ở **16 khoá**. `…pe…`
  là **ký hiệu lược**, không phải chữ; quy ước kho là giữ **đúng MỘT** `…`. Ở **16 khoá**
  Pāli ghim **có** dấu lược nên chỉ rút cụm còn một `…`, nghĩa không đổi: `dn1:2.27.6`,
  `dn1:2.27.7`, `dn1:2.27.8`, `dn1:2.27.9`, `dn1:2.27.12`, `dn1:2.27.13`, `dn1:2.27.14`,
  `dn1:2.27.15`, `dn1:2.27.16`, `dn1:2.27.17`, `dn1:2.27.18`, `dn1:2.27.19`, `dn1:2.29.1`,
  `dn1:2.34.1`, `dn1:2.38.5`, `dn1:2.40.1`.

  3 khoá `dn1:2.29.1`, `dn1:2.34.1`, `dn1:2.40.1` là dạng **bị cắt**: segment Pāli ngay
  trước kết bằng `…` và segment này mở bằng `pe…`, tức ký hiệu `…pe…` bị bilara cắt đôi
  qua ranh giới khoá (Pāli ghim: `dn1:2.28.2` = `… natthi ito bahiddhā …`, `dn1:2.29.1` =
  `pe… `). Đã theo đúng tiền lệ đã có trong kho: `an11.22:3.1`, `an11.502-981:2.2`,
  `dn1:3.4.1`, `dn1:3.8.1`, `dn33:1.11.31`, `mn75:11.2`, `mn93:18.4`, `mn96:8.6`,
  `mn96:8.8`, `mn137:12.3`, `mn119:15-17.8`, `mn119:18.6` — mỗi khoá ấy dịch thành đúng
  một `…`.

  `final_score` tính lại bằng script (trung bình số học thô của đúng 10 tiêu chí),
  `assessed_at` cập nhật. Đây là sửa lỗi kỹ thuật/thuật ngữ ở mức khoá, không phải biên
  dịch lại bài; không blocker, trạng thái giữ nguyên theo quality gate.

  **Sửa lớp lỗi lệch khoá (2026-10-05) — quét tìm trên toàn tầng.** Luật *"Pāli trùng
  nguyên văn thì cách dịch phải khớp"*: bài này có **11 nhóm / 49 khoá** trùng Pāli mà bản
  Việt khác nhau. Đọc từng nhóm cùng khoá liền trước / khoá / khoá liền sau cho thấy **một**
  nhóm là lỗi thật, mười nhóm còn lại là khác cách diễn đạt.

  **Đã sửa 6 khoá.** Ở `3.18`, `3.26`, `3.28` — ba chỗ bilara đánh dấu phần lặp bằng
  `…pe…` — bản Việt đã **mở rộng ký hiệu lược** ra thành văn xuôi:

  - `3.18.1`, `3.26.1`, `3.28.1`: Pāli ghim chỉ là `pe… ` (ký hiệu lược bị bilara cắt đôi qua
    ranh giới khoá, vì khoá trước kết bằng `… `), nhưng bản Việt lại viết **485 ký tự** kể
    lại `Tayidaṁ … anupādāvimutto` — tức **nội dung của mục khác** (`3.30.1`–`3.30.4`), mà Pāli
    của ba khoá ấy không có. Quét lại toàn tầng: đây là **3/3** khoá có Pāli rỗng-sau-lược mà
    bản Việt dài — `dn1`, `dn2`, `dn3`, `dn9`, `mn30` còn lại **0**. Đã rút về đúng một `…`,
    theo **đúng tiền lệ có sẵn trong chính bài này**: `3.4.1` và `3.8.1` cùng Pāli `pe… ` đã
    là `…` (xem mục 2026-10-04 ở trên).
  - `3.18.2`, `3.26.2`, `3.28.2`: Pāli `yehi tathāgatassa yathābhuccaṁ vaṇṇaṁ sammā vadamānā
    vadeyyuṁ.` **trùng nguyên văn** với `3.4.2` và `3.8.2`, nhưng bản Việt lại kể lại cả vế
    `Ime kho te, bhikkhave, dhammā gambhīrā…` — vế nằm **trong** phần bị lược. Đã sửa theo
    `3.4.2` = `3.8.2`: *là những pháp mà ai tán thán Như Lai đúng như thật thì phải nói đến.*
    Sau khi sửa, đọc `3.17.2` → `3.18.1` → `3.18.2` giống hệt `3.3.2` → `3.4.1` → `3.4.2`.

  **Không xác định được ⇒ ĐỂ NGUYÊN** (khác biệt hợp lệ):

  - `Vedanānaṁ samudayañca atthaṅgamañca…` (5 khoá), `Ime kho te, bhikkhave, dhammā
    gambhīrā…` (5 khoá), `‘ime diṭṭhiṭṭhānā evaṅgahitā…` (4 khoá), `Ahañhi ātappamanvāya…`
    (2 khoá), `‘Nevarūpī nārūpī attā hoti….` / `‘Antavā…` / `‘Anantavā…` /
    `‘Antavā ca anantavā ca…` (3 khoá mỗi nhóm), `Ittheke sato sattassa ucchedaṁ…` (7 khoá),
    `So kho, bho, attā yato kāyassa bhedā…` (6 khoá): đều là **cùng một mệnh đề Pāli được
    diễn đạt hơi khác** — *"hiểm họa"* vs *"sự nguy hiểm"*, *"sâu xa"* vs *"sâu kín"*, *"khó giác
    hiểu"* vs *"khó chứng ngộ"*. Khác từ ngữ, **không khác nghĩa**, và mỗi bên đều dịch đủ Pāli
    của nó. Để nguyên.
  - `yehi tathāgatassa yathābhuccaṁ vaṇṇaṁ sammā vadamānā vadeyyuṁ.` — sau khi sửa, hai họ
    vẫn còn khác nhau: `2.29.2` = `2.34.2` = `2.40.2` (*"mà khi tán thán Như Lai một cách
    đúng như thật, người tán thán chân chính sẽ nói đến."*) và `3.4.2` = `3.8.2` =
    `3.18.2` = `3.26.2` = `3.28.2` (*"là những pháp mà ai tán thán Như Lai đúng như thật thì phải
    nói đến."*). Cả hai đều là mệnh đề nối tiếp phần bị lược `Ime kho te…`, nên vế dẫn khác
    nhau là hợp lệ; không có khoá nào mang nội dung của khoá khác. **Không xác định được** nên
    **để nguyên cả hai họ**.
  - `2.38.6`–`2.38.10` không kèm *"vị ấy xác quyết như vậy"*, còn `3.2.4`–`3.6.4` có. Pāli hai
    bên như nhau (`…. ` = lược), nên bên nào cũng là một cách xử lý lược; không đủ căn cứ để
    chọn. **Để nguyên.**

  Hạ `semantic_fidelity` 9,1 → **8,8** và `segment_alignment` 10 → **9,4**: ba khoá từng mang nội
  dung của mục khác và ba khoá từng mở rộng phần bị lược, vi phạm *"repetition/ellipsis không
  làm mất canonical meaning"*. `final_score` tính lại bằng script (trung bình số học thô của
  đúng 10 tiêu chí), `assessed_at` cập nhật. Lỗi đã sửa xong nên **không blocker**; `final_score`
  vẫn > 9,0 nên trạng thái giữ nguyên `published` theo quality gate.

summary: |-
  Kinh Phạm Võng, bài đầu Trường Bộ Kinh, mở ra khi Đức Thế Tôn cùng đại chúng tỳ-kheo đi giữa Rājagaha và Nāḷandā. Du sĩ Suppiya đi theo hủy báng Phật, Pháp, Tăng đoàn, còn đệ tử ông là thanh niên Brahmadatta lại tán thán; cả hai cùng trú đêm tại nhà nghỉ của vua ở Ambalaṭṭhikā. Khi các tỳ-kheo bàn rằng Ngài thấu rõ những khuynh hướng khác nhau của chúng sinh, Đức Thế Tôn dạy: chớ phẫn nộ khi bị hủy báng, chớ mừng rỡ khi được tán thán, mà hãy vạch rõ điều không thật và xác nhận điều có thật.

  Phần tán thán, kẻ phàm phu chỉ nói được ở mức giới: ba phần Tiểu giới, Trung giới, Đại giới, từ bỏ sát sinh, nói dối, không nhận vàng bạc, không nuôi mạng bằng tà thuật thấp kém. Ngoài ra, Như Lai tự chứng những pháp sâu xa, khó thấy, khó hiểu, chỉ bậc hiền trí cảm nhận được, mà tán thán đúng như thật phải nói đến.

  Về quá khứ, một số sa-môn, bà-la-môn nêu mười tám căn cứ: bốn của thuyết thường hằng, nhờ định tâm nhớ lại nhiều đời sống quá khứ hoặc do lý luận; bốn của thuyết bán thường, gắn với chuyện vị Phạm thiên tự coi là bậc Tạo hóa, hoặc chư thiên hư hoại vì vui đùa hay tâm ô nhiễm; bốn của thuyết hữu biên–vô biên; bốn của ngụy biện trườn uốn như lươn, khi sợ nói dối, sợ chấp thủ, sợ bị chất vấn hay đần độn si mê; và hai của thuyết ngẫu nhiên sinh.

  Về tương lai, bốn mươi bốn quan điểm chia thành năm nhóm: hữu tưởng luận mười sáu trường hợp; vô tưởng luận và phi hữu tưởng phi vô tưởng, mỗi nhóm tám; chủ trương đoạn diệt bảy luận cứ, từ thân do bốn đại tạo thành đến phi tưởng phi phi tưởng xứ; và năm luận cứ cho Niết-bàn ngay trong hiện tại, từ hưởng năm thứ dục lạc đến thiền thứ tư. Từng quan điểm được trình bày hai chiều: nêu căn cứ, khẳng định ngoài đó không còn gì khác, rồi cho biết Như Lai biết rõ mà không chấp thủ, tự chứng tịch tĩnh.

  Cuối kinh, mọi chủ thuyết ấy là cảm thọ của những vị không biết, không thấy, bị khát ái chi phối, chỉ là sự lo sợ và quằn quại, do duyên xúc, dắt theo khát ái, chấp thủ, hữu, sinh, già chết; tỳ-kheo tuệ tri sáu xứ xúc thì vượt lên trên tất cả. Mọi nhà suy luận về tiền tế, hậu tế đều bị nhốt trong lưới sáu mươi hai luận cứ; kinh được thọ trì là Lưới Nghĩa, Lưới Pháp, Lưới Phạm, Lưới Kiến, chiến thắng tối thượng trong chiến trận.
