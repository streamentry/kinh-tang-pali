summary: |-
  Kinh Thanh Tịnh bắt đầu khi Nigaṇṭha Nāṭaputta vừa qua đời tại Pāvā: những người Nigaṇṭha chia thành hai phe tranh chấp, cãi vã, các đệ tử tại gia chán ngán; giáo pháp và giới luật ấy được giảng dạy vụng về, thiếu rõ ràng, không đưa đến giải thoát và an tịnh, không do bậc Chánh Đẳng Giác tuyên dạy. Sa-di Cunda kể với Tôn giả Ānanda, rồi hai vị trình với Đức Thế Tôn đang trú trong vườn xoài Vedhaññā của dòng họ Sakya.

  Đức Thế Tôn phân tích: khi thầy không phải bậc Chánh Đẳng Giác, đệ tử sống tách khỏi giáo pháp ấy đáng khen, sống theo giáo pháp ấy đáng chê; khi thầy là bậc Chánh Đẳng Giác thì ngược lại. Khi một vị thầy bậc A-la-hán qua đời, đệ tử còn nuối tiếc nếu ý nghĩa của chánh pháp và toàn bộ đường tu chưa được bày tỏ cho họ, và không còn nuối tiếc khi đã được bày tỏ.

  Đường tu ấy còn cần vị thầy trưởng lão lâu năm, đủ các đệ tử tỳ-kheo, tỳ-kheo-ni và cư sĩ, thành công, hưng thịnh, đạt mức cao nhất về lợi dưỡng, danh tiếng; Đức Thế Tôn cho biết hiện nay mọi phương diện ấy đều đủ nơi mình. Các pháp Ngài đã trực tiếp chứng biết, từ bốn niệm xứ đến Thánh đạo tám ngành, cần được cùng tụng đọc, đối chiếu nghĩa với nghĩa, lời với lời, không tranh cãi; khi bạn đồng tu hiểu sai nghĩa hay diễn đạt sai lời thì giúp vị ấy hiểu rõ, không tán đồng cũng không bác bỏ.

  Khi các du sĩ ngoại đạo cho rằng sa-môn theo dòng Sakya sống chuyên hưởng lạc, kinh chỉ ra bốn loại hưởng lạc thấp kém: sát hại chúng sinh, lấy của không cho, nói dối, hưởng năm loại dục lạc, đối lại với bốn thiền, đưa đến nhàm lìa, ly tham, đoạn diệt, an tịnh, thắng trí, giác ngộ và Niết-bàn. Còn khi được hỏi, Như Lai có trí biết quá khứ dựa vào sự nhớ lại, trí biết tương lai do giác ngộ sinh ra, và chỉ giải đáp điều thật và có lợi ích.

  Ngài không tuyên bố bốn quan điểm về Như Lai sau khi chết vì không mang lại lợi ích; điều Ngài tuyên bố là đây là khổ, nguồn gốc của khổ, sự chấm dứt khổ và con đường đưa đến chấm dứt khổ. Những quan điểm về quá khứ khởi nguyên và tương lai, từ tự ngã và thế giới thường còn đến tự ngã bị đoạn diệt, đều bị Ngài không chấp nhận khi nói chỉ điều này là thật, bởi trong vấn đề còn có những chúng sinh nhận thức khác; để từ bỏ và vượt qua những quan điểm ấy, Ngài giảng dạy bốn niệm xứ.
