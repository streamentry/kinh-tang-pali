summary: |-
  Kinh Pāthika mở đầu ở thị trấn Anupiya của dân Malla, khi Đức Thế Tôn chờ giờ khất thực trong vườn du sĩ Bhaggavagotta. Vị du sĩ hỏi về tin Sunakkhatta người Licchavī mấy hôm trước đã tuyên bố chối bỏ Đức Thế Tôn, từ nay không còn sống nương nhờ Ngài. Đức Thế Tôn xác nhận việc ấy thật, rồi kể lại cho Bhaggavagotta nghe.

  Đức Thế Tôn hỏi lại: Ngài chưa từng mời y sống nương nhờ mình, chưa từng hứa thực hiện thần thông và oai lực vượt hơn loài người; dù thực hiện hay không, Pháp mà Ngài thuyết giảng vẫn đưa người thực hành đến chấm dứt khổ đau chân chánh. Rồi Ngài nêu các lời tuyên bố được kiểm chứng: du sĩ trần truồng Korakhattiya, người giữ hạnh chó, bảy ngày sau mạng chung vì bệnh trướng khí, sinh vào bộ a-tu-la Kālakañcika thấp kém nhất; du sĩ trần truồng Kaḷāramaṭṭaka, kẻ giữ bảy hạnh nguyện, chẳng bao lâu phá giới, sống có bạn đời, ăn cơm và cháo, mạng chung với danh tiếng suy tàn. Quả báo khớp đúng từng lời, tức thần thông đã được thực hiện, thế mà Sunakkhatta vẫn lìa bỏ Pháp-Luật.

  Du sĩ trần truồng Pāthikaputta phao lời rằng sa-môn Gotama thực hiện bao nhiêu thần thông, y sẽ thực hiện gấp đôi. Đức Thế Tôn tuyên bố y không thể đến diện kiến khi chưa từ bỏ lời nói, tâm và thắng kiến ấy, nếu không đầu sẽ nứt vỡ. Khi Ngài đến vườn của y, hàng trăm hàng nghìn người kéo đến; Pāthikaputta khiếp sợ, chạy đến vườn du sĩ Tindukakhāṇu, và dù một người đàn ông, vị đại thần Licchavī hay Jāliya với ví dụ con sư tử và chó rừng đến giục, y vẫn không rời khỏi chỗ ngồi. Sau pháp thoại, Đức Thế Tôn vớt 84.000 chúng sinh khỏi vực thẳm lớn, hóa hiện ngọn lửa bay lên hư không rồi hiện về đại lâm; Sunakkhatta vẫn chối bỏ.

  Phần cuối, Đức Thế Tôn nói Ngài biết điểm khởi đầu và còn biết vượt hơn, nhưng không chấp trước nên chứng biết sự an tịnh; các thuyết do Tự Tại tạo hóa, Phạm thiên tạo hóa, hư hoại vì vui đùa, hư hoại vì tâm hay sinh khởi ngẫu nhiên đều xuất phát từ một chúng sinh chỉ nhớ được một đời quá khứ. Ngài cũng bác lời vu báng về giải thoát về cái đẹp đẽ, khẳng định theo Ngài bậc ấy biết rõ tất cả là đẹp đẽ; và bảo Bhaggavagotta hãy giữ gìn lòng tịnh tín có nơi Ngài. Bài kinh cho thấy Pháp đưa đến chấm dứt khổ đau chân chánh mới là mục đích, còn thắng kiến xấu ác phải đoạn bỏ.
