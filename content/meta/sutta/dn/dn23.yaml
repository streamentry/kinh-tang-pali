notes: |-
  Khôi phục 17 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Sáu cặp khoá mở và trả lời (10.3/10.4, 12.3/12.4, 14.3/14.4, 16.3/16.4, 18.3/18.4, 20.3/20.4): Pāli chỉ còn Atthi pana, rājañña, pariyāyo …pe… và atthi, bho kassapa, pariyāyo …pe…, còn bản Việt đã viết ra cả kết luận về đời sau. Đã bỏ phần đó, thay bằng …, giữ dấu nháy kép mở ở khoá .3 và đóng ở khoá .4 như trước. Toàn văn kết luận vẫn có ở 9.35 và 10.2 trong bài.
  Ba khoá …pe… vipāko (24.3, 26.4, 28.4): Pāli còn itipi natthi paro loko … vipāko. Đã bỏ phần lược, giữ lại câu không có đời sau. Vế vipāko là nửa vế sau của cụm phalaṁ vipāko nằm trong khoảng lược nên không giữ lại riêng, vì nếu giữ sẽ thành vế vô nghĩa.
  Khoá 11.30: Pāli chỉ còn sắc xanh và người thấy được sắc xanh; đã bỏ ba cặp sắc nữa là phần đã bung.
  Khoá 18.11: Pāli còn Te me sādhū ti paṭissutvā … chaviñca … jīvitā voropenti. Đã đặt … đúng sau lớp da ngoài, vị trí Pāli lược; vế đoạt mạng sống vốn nằm trước trong bản Việt thì vẫn giữ vì không lược. Xem thêm 8.3, 11.10, 12.12 trong bài làm bản đủ cho biết khoảng lược che đúng dubbalaṁ và pūtikaṁ.
  Không xác định được nên để nguyên: không có. Quét lại toàn bài cho 0 khoá lệch.

summary: |-
  Kinh Pāyāsi kể chuyện tộc trưởng Pāyāsi ở Setavyā, khởi lên tà kiến ác: không có đời sau, không có chúng sinh hóa sinh, không có quả và trái của các nghiệp thiện và bất thiện. Khi Tôn giả Kumārakassapa cùng đại Tăng-già năm trăm tỳ-kheo đến trú rừng siṁsapā phía bắc thành, dân chúng đến gặp Ngài; Pāyāsi sai người hầu Khatta giữ họ lại, hẹn sẽ tự đến.

  Pāyāsi lần lượt nêu các lập luận phủ định đời sau, từ người bạn giữ giới chết đi không hề trở lại báo tin, đạo sĩ có giới không tự kết liễu đời mình, đến việc không thấy linh hồn thoát khỏi nồi đậy kín, người chết nặng hơn khi cân; Tôn giả đáp lại qua mười bốn ví dụ: mặt trăng mặt trời, kẻ trộm, người rơi hố phân, chư thiên Ba Mươi Ba, người mù bẩm sinh phủ nhận màu sắc, người đàn bà có thai tự mổ bụng tìm thừa tự, giấc mơ, viên sắt nóng, người thổi tù và, đạo sĩ búi tóc thờ lửa.

  Đời sau không thấy bằng mắt thịt mà bằng thiên nhãn thanh tịnh của các đạo sĩ trú rừng; khi thân còn kết hợp với mạng sống, hơi ấm và thức, nó thấy, nghe, ngửi, nếm, cảm nhận và biết; khi không còn, nó chẳng làm gì cả. Pāyāsi vẫn không từ bỏ tà kiến; Tôn giả lại dùng bốn ví dụ: hai đoàn thương đội trong hoang mạc, người mang phân, người đánh bạc nuốt hạt thấm độc, người mang gai đay từ chối đổi lấy vàng.

  Pāyāsi nhận ra mình hoan hỷ ngay từ ví dụ đầu, chỉ đối nghịch để nghe vấn đáp đa dạng; Ngài quy y Đức Gotama, Chánh Pháp và Tăng-già tỳ-kheo, xin làm ưu-bà-tắc, rồi xin giáo huấn về lễ đại cúng hiến. Tôn giả dạy: cúng hiến có giết mổ sinh vật, người thọ nhận có tà kiến cho đến tà định, thì không có quả lớn; cúng hiến không giết mổ, người thọ nhận có chánh kiến cho đến chánh định, thì quả lớn.

  Pāyāsi ổn đặt buổi bố thí với cháo chua và y phục thô ráp; cậu Uttara làm giám nhiệm, than rằng chỉ mong được cùng Ngài ở đời này, và theo lời khuyên cho đi loại đồ ăn, y phục mà Pāyāsi dùng. Sau khi chết, vì bố thí không cẩn thận, không tự tay cho, không suy xét chu đáo, Pāyāsi sinh vào cung điện trống rỗng nơi chư thiên Tứ Đại Thiên Vương; cậu Uttara, vì bố thí cẩn thận, tự tay cho, suy xét chu đáo, sinh cùng chư thiên Ba Mươi Ba. Thiên tử Pāyāsi nhờ Tôn giả Gavampati tuyên bố ở cõi người: hãy bố thí một cách cẩn thận.
