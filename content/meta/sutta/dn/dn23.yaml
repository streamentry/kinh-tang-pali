notes: |-
  Khôi phục 17 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Sáu cặp khoá mở và trả lời (10.3/10.4, 12.3/12.4, 14.3/14.4, 16.3/16.4, 18.3/18.4, 20.3/20.4): Pāli chỉ còn Atthi pana, rājañña, pariyāyo …pe… và atthi, bho kassapa, pariyāyo …pe…, còn bản Việt đã viết ra cả kết luận về đời sau. Đã bỏ phần đó, thay bằng …, giữ dấu nháy kép mở ở khoá .3 và đóng ở khoá .4 như trước. Toàn văn kết luận vẫn có ở 9.35 và 10.2 trong bài.
  Ba khoá …pe… vipāko (24.3, 26.4, 28.4): Pāli còn itipi natthi paro loko … vipāko. Đã bỏ phần lược, giữ lại câu không có đời sau. Vế vipāko là nửa vế sau của cụm phalaṁ vipāko nằm trong khoảng lược nên không giữ lại riêng, vì nếu giữ sẽ thành vế vô nghĩa.
  Khoá 11.30: Pāli chỉ còn sắc xanh và người thấy được sắc xanh; đã bỏ ba cặp sắc nữa là phần đã bung.
  Khoá 18.11: Pāli còn Te me sādhū ti paṭissutvā … chaviñca … jīvitā voropenti. Đã đặt … đúng sau lớp da ngoài, vị trí Pāli lược; vế đoạt mạng sống vốn nằm trước trong bản Việt thì vẫn giữ vì không lược. Xem thêm 8.3, 11.10, 12.12 trong bài làm bản đủ cho biết khoảng lược che đúng dubbalaṁ và pūtikaṁ.
  Không xác định được nên để nguyên: không có. Quét lại toàn bài cho 0 khoá lệch.
