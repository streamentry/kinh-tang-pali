summary: |-
  Kinh Đại Bổn mở đầu tại Sāvatthī, khi các tỳ-kheo tự hỏi Như Lai nhớ các vị Phật quá khứ nhờ tự mình thấu đạt pháp tánh hay nhờ chư thiên cáo bảo; Đức Thế Tôn xác nhận cả hai rồi kể lại bảy vị Phật với đủ dòng sanh, tuổi thọ, cây giác ngộ, đệ tử, hội chúng, kinh đô: từ Vipassī chín mươi mốt kiếp trước, Sikhī, Vessabhū, Kakusandha, Koṇāgamana, Kassapa, đến chính Ngài trong hiền kiếp này.

  Phần sau kể về Bồ-tát Vipassī theo đúng pháp tánh: từ Đâu Suất xuống vào bụng mẹ, ánh sáng vô lượng hiện ra, mẹ giữ giới, không bệnh khổ, mang thai đủ mười tháng; Bồ-tát sinh ra thanh sạch, đi bảy bước, tuyên bố đây là kiếp cuối. Bà-la-môn thuật tướng thấy đủ ba mươi hai đại tướng nam, tiên đoán vị ấy sẽ thành Chuyển Luân Vương đầy đủ bảy báu nếu sống tại gia, thành A-la-hán Chánh Đẳng Giác nếu xuất gia. Vì nhìn không chớp mắt, thái tử mang danh hiệu Vipassī.

  Nhiều lần ra vườn nghe, thái tử thấy một người già, một người bệnh và một người đã khuất, than thở: khốn thay, cái gọi là sanh, vì ai có sanh thì sẽ thấy rõ già, bệnh và chết. Gặp người xuất gia, thái tử cạo râu tóc, khoác y áo màu vàng hoe; 84.000 dân chúng theo xuất gia; còn Ngài xa lánh đám đông, sống một mình. Nhờ tác ý như lý, vị ấy thấu đạt chuỗi duyên khởi ngược lên từ già và chết do duyên sinh, qua hữu, thủ, ái, thọ, xúc, sáu xứ đến danh-sắc và thức, biết thức quay lui nơi danh-sắc không vượt qua hơn nữa; như vậy toàn bộ khối khổ sinh khởi. Ngài cũng thấu đạt chuỗi đoạn diệt; quán năm thủ uẩn sinh khởi và hoại diệt, tâm được giải thoát khỏi các lậu hoặc.

  Đức Thế Tôn Vipassī chần chừ không muốn thuyết Pháp; sau ba lần Đại Phạm thiên thỉnh cầu, Ngài thuyết Pháp cho vương tử Khaṇḍa, con vị chính sư Tissa và hai đoàn 84.000 người: pháp thoại tuần tự về bố thí, giới, cõi trời rồi khổ, tập, diệt, đạo; pháp nhãn khởi lên, các vị xuất gia, giải thoát khỏi các lậu hoặc. Với đại chúng 6.800.000 vị, Ngài cho đi du hành, chớ hai người một đường, hẹn sáu năm trở lại tụng giới.

  Đức Thế Tôn đến các cõi Sống Thanh Sạch, nơi các vị thiên nhân từng sống Phạm hạnh dưới bảy vị Phật kể lại từng vị và nói nhờ thế họ được sanh lên cõi ấy; nhờ đó bậc Như Lai nhớ lại các vị Phật quá khứ theo cả hai phương diện: pháp tánh tự thấu đạt và lời chư thiên cáo bảo.
