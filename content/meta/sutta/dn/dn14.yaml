  1 khoá `dn14:3.29.20` là dạng **bị cắt**: segment Pāli ngay trước kết bằng `…` và
  segment này mở bằng `pe…`, tức ký hiệu `…pe…` bị bilara cắt đôi qua ranh giới khoá (Pāli
