summary: |-
  Kinh Đại Điển Tôn được thuyết tại Rājagaha, trên núi Gijjhakūṭa. Vị gandhabba Pañcasikha đến với dung sắc rực rỡ chiếu sáng núi, xin Đức Thế Tôn thuật lại điều mình trực tiếp nghe trước chư thiên Tāvatiṁsa.

  Đêm trăng tròn Tự tứ cuối mùa mưa, chư thiên Tāvatiṁsa tụ họp trong hội trường Sudhamma; những vị thiên mới sống phạm hạnh dưới sự chỉ dạy của Ngài vượt trội mọi vị; Sakka trình bày tám lời tán thán đúng sự thật: vì lợi ích của số đông, lòng thương tưởng thế gian; giáo pháp khéo thuyết, hướng thượng; phân rõ thiện, bất thiện, tối sáng; con đường hòa hợp Niết-bàn như Gaṅgā hòa Yamunā; nói sao làm vậy; dứt nghi ngờ. Một số vị thiên ước có hai, ba, bốn vị Phật cùng xuất hiện; Sakka bảo không thể có hai bậc A-la-hán Chánh Đẳng Giác trong một thế giới cùng lúc.

  Ánh sáng lớn báo hiệu Phạm thiên; Sanaṅkumāra hiện ra, vượt trội mọi vị thiên; cả hội im lặng chắp tay, vị thiên được Ngài ngồi cùng chỗ hỷ lạc như vua quán đảnh. Ngài tùy hỷ bằng chính những câu kệ ấy, giọng tám đặc tính gọi là Phạm âm, rồi mang hình thanh niên năm búi tóc ngồi giữa hư không kể chuyện.

  Thuở xưa, tế sư Govinda của vua Disampati qua đời; con ông là Jotipāla kế chức, gọi là Mahāgovinda, Đại Điển Tôn, chia đại địa thành bảy phần cho bảy vị. Ông độc cư bốn tháng thiền tâm bi mà không thấy Phạm thiên; Sanaṅkumāra chỉ bày: bỏ tâm sở hữu, sống nhất tâm, chuyên chú lòng bi, không còn mùi ô uế thì người phàm đạt cõi Phạm thiên bất tử; hỏi mùi ô uế, được kể: sân hận, nói dối, gian trá, phản bội, keo kiệt, ngã mạn, xan tham; ông nhận ra người tại gia không dễ điều phục chúng nên quyết xuất gia. Sáu vị vua giữ ông bằng tài sản, phụ nữ, xin chờ bảy năm xuống nửa tháng; ông chỉ nhận bảy ngày rồi xuất gia cùng các vị vua, Bà-la-môn, học trò, người vợ và đông người khác, dạy tâm từ, bi, hỷ, xả đưa đến cộng trú Phạm thiên; ai hiểu trọn vẹn sinh cõi Phạm thiên, kẻ khác sinh cõi trời.

  Đức Thế Tôn xác nhận chính mình thuở ấy là Đại Điển Tôn: đời phạm hạnh ấy chỉ dẫn đến cõi Phạm thiên, không đến nhàm chán, ly tham, đoạn diệt, giác ngộ, Niết-bàn; còn đời phạm hạnh này, tức Bát Chánh Đạo, dẫn thẳng đến các điều ấy. Người hiểu trọn vẹn đoạn tận lậu hoặc, chứng ngộ tâm, tuệ giải thoát; người khác có người hóa sinh nhập Niết-bàn không trở lại, có người Nhất lai, có người Dự lưu.
