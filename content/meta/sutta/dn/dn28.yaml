summary: |-
  Kinh Tự Hoan Hỷ được thuyết tại Nāḷandā, trong vườn xoài Pāvārika. Tôn giả Sāriputta tuyên bố trước Đức Thế Tôn một lời lớn lao: trong quá khứ, tương lai hay hiện tại, không có sa-môn hay Bà-la-môn nào có thắng trí về giác ngộ vượt hơn Thế Tôn. Đức Thế Tôn chất vấn: Tôn giả có dùng tâm mình biết rõ tâm các bậc A-la-hán Chánh Đẳng Giác trong quá khứ, tương lai và hiện tại, với giới hạnh, Pháp, trí tuệ, an trú và giải thoát như thế nào không? Tôn giả thừa nhận là không.

  Sāriputta đáp rằng ông biết điều ấy bằng suy luận theo Pháp. Tất cả các bậc A-la-hán Chánh Đẳng Giác trong quá khứ đều từ bỏ năm triền cái, những pháp làm ô nhiễm tâm và làm yếu trí tuệ, khéo an trú tâm trong bốn niệm xứ, tu tập như thật bảy giác chi, rồi chứng Vô thượng Chánh Đẳng Giác; các bậc tương lai cũng sẽ như vậy; và Đức Thế Tôn hiện tại cũng đã như vậy.

  Kinh tiếp đó liệt kê những điều vô thượng trong cách thuyết của Thế Tôn: các thiện pháp, các xứ, các cách nhập thai, các phương thức ký tâm, các kiến định, các hạng người, sự tinh cần, các cách hành trì, chánh hạnh trong lời nói, giới hạnh của con người, các phương thức chỉ dạy, trí biết sự giải thoát của người khác, các thuyết thường trú, trí nhớ các đời sống quá khứ, trí biết sự chết và tái sinh của chúng sinh, các loại thần thông, và thành tựu của bậc Đạo Sư; một số mục kết luận rằng Thế Tôn biết trọn vẹn điều ấy, nhờ thế không ai có thể vượt hơn Ngài.

  Kinh nêu nội dung của vài mục: bốn quả vị từ bậc Dự lưu đến giải thoát vô lậu lặp lại cho cả cách chỉ dạy lẫn trí biết giải thoát của người khác; ba loại thuyết thường trú của những vị nhớ lại nhiều đời quá khứ rồi kết luận bản ngã và thế giới thường hằng, đối lại với trí nhớ quá khứ của Thế Tôn nhớ được cả những cõi trời tuổi thọ không thể đếm; và thần thông chia làm hai loại, hữu lậu là không phải Thánh, vô lậu là Thánh.

  Khi được hỏi, Sāriputta thừa nhận có các bậc ngang bằng Thế Tôn về giác ngộ trong quá khứ và tương lai, nhưng không thể có hai bậc Chánh Đẳng Giác xuất hiện đồng thời trong cùng một thế giới. Đức Thế Tôn dặn Sāriputta thường xuyên thuyết bài Pháp này cho các tỳ-kheo, tỳ-kheo-ni, nam cư sĩ và nữ cư sĩ, để những người còn nghi ngờ hay phân vân về Như Lai được đoạn trừ; vì thế bài thuyết được gọi là Tự Hoan Hỷ.
