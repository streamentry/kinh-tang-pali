summary: |-
  Kinh Đại Hội được thuyết giữa dân Sakya, tại Đại Lâm gần Kapilavatthu, khi Đức Thế Tôn cùng năm trăm tỳ-kheo A-la-hán trú tại đó, phần lớn chư thiên mười thế giới tụ hội yết kiến. Bốn vị thiên cõi Tịnh Cư hiện đến, mỗi vị đọc một bài kệ: đại hội giữa rừng sâu để thấy Tăng bất bại; các tỳ-kheo nhập định hộ trì các căn như người đánh xe giữ cương; chặt cọc, phá then, nhổ trụ kiên cố, được Bậc Có Mắt điều phục như long tượng; ai quy y Đức Phật không đến cảnh giới đọa lạc, sau khi rời bỏ thân người sẽ làm đầy các thiên chúng.

  Đức Thế Tôn bảo các tỳ-kheo rằng các bậc Chánh Đẳng Giác quá khứ, tương lai cũng có những cuộc tụ hội chư thiên như thế này, rồi dùng lời kệ kể tên các thiên chúng; các đệ tử khởi tri kiến, thấy phi nhân từ trăm, ngàn, bảy mươi ngàn đến vô số tràn khắp mọi phương. Trước hết là các địa thần: bảy ngàn Dạ-xoa ở Kapilavatthu, sáu ngàn từ Himavanta, ba ngàn từ Sātāgiri, năm trăm từ Vessāmitta, Kumbhīra trên núi Vepulla cùng hơn một trăm ngàn hầu cận, tất cả hoan hỷ đến hội chúng trong rừng.

  Bốn vị Đại Thiên Vương đến với nhiều con trai tên Inda: Dhataraṭṭha ở phương đông chúa các Càn-thát-bà, Virūḷha ở phương nam chúa các Cưu-bàn-trà, Virūpakkha ở phương tây chúa các Nāga, Kuvera ở phương bắc chúa các Dạ-xoa; cùng các thuộc hạ giỏi huyễn thuật, các vua Càn-thát-bà như Pañcasikha. Rồi các Nāga danh tiếng cùng vị Đại Nāga Erāvaṇa và các thiên điểu Supaṇṇa; Đức Phật khiến Nāga an toàn trước Supaṇṇa, cả hai loài cùng quy y; các Asura bị vị Cầm Kim Cang đánh bại, do Rāhu dẫn đến; chư thiên thuộc nước, đất, lửa, gió, theo mặt trăng, mặt trời, các tinh tú, Sakka, Hóa Lạc và Tha Hóa Tự Tại; tất cả là sáu mươi thiên chúng cùng nhiều vị tương tự, đến thấy những bậc dứt tái sinh, vượt dòng lũ như trăng khỏi bóng tối. Một ngàn Phạm giới với Đại Phạm thiên đứng đầu, cùng Sanaṅkumāra, Hārita.

  Cả Ma quân cũng đến; Kẻ Đen Tối sai quân bắt, trói, bao vây mọi phía; vị đại tướng vỗ bàn tay xuống đất tạo tiếng vang kinh khiếp như mây mưa gầm sấm chớp sáng, rồi quay lui giận dữ không tự chủ. Đức Thế Tôn bảo các tỳ-kheo nhận biết Ma quân; trước những vị đã lìa tham, Ma quân rút lui, không một sợi lông của các vị lay động. Kinh kết: tất cả chiến thắng trận chiến, vượt qua sợ hãi, các đệ tử hoan hỷ cùng muôn loài, được người đời biết đến.
