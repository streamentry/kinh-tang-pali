summary: 'Không lâu sau khi Đức Thế Tôn nhập Niết-bàn, Tôn giả Ānanda trú tại
  Sāvatthī, trong rừng Jeta. Thanh niên Bà-la-môn Subha Todeyyaputta đang ở
  Sāvatthī, cử người mời Tôn giả Ānanda đến nhà và hỏi: với thời gian dài làm
  thị giả bên cạnh Tôn giả Gotama, Ānanda biết Đức Thế Tôn từng tán thán, khích
  lệ, hướng dẫn và an lập mọi người trong những pháp nào.


  Tôn giả Ānanda đáp Đức Thế Tôn tán thán ba uẩn: Thánh giới uẩn, Thánh định uẩn
  và Thánh tuệ uẩn. Về giới, một Như Lai xuất hiện, người nghe Pháp có lòng tin,
  từ bỏ gia đình xuất gia, sống chế ngự theo giới bổn Pātimokkha: từ bỏ sát
  sinh, tránh xa các loại thuật thấp kém, tà mạng như lễ cầu an, cầu nguyện.
  Thành tựu giới như vậy, vị tỳ-kheo không thấy nguy hiểm từ phương nào, như vua
  quán đảnh đã đánh bại kẻ thù, và cảm nhận niềm an lạc nội tâm không lỗi lầm.


  Về Thánh định uẩn, Ānanda mô tả tỳ-kheo hộ trì các căn: khi mắt thấy sắc, tai
  nghe tiếng... ý nhận biết pháp, không nắm giữ tướng chung, tướng riêng; có
  niệm và tỉnh giác trong mọi việc làm; và biết đủ với y và thức ăn khất thực,
  như chim mang theo đôi cánh. Vị ấy từ bỏ năm triền cái — xem chúng như món nợ,
  bệnh tật, nhà tù, cảnh nô lệ và con đường qua vùng hoang vắng — rồi hân hoan,
  hỷ, lắng dịu, lạc sinh lên, tâm được định tĩnh, và chứng bốn thiền với ví dụ
  thấm nhuần toàn thân.


  Về Thánh tuệ uẩn, với tâm đã định tĩnh, vị ấy hướng tâm đến tri kiến, biết rõ
  thân này do bốn đại tạo thành, chịu vô thường, còn thức nương vào thân. Tiếp
  theo: tạo thân do ý tạo; các thần thông từ một thân hóa nhiều thân cho đến tận
  cõi Phạm thiên; thiên nhĩ nghe âm thanh chư thiên, loài người; trí biết tâm
  người khác; trí nhớ nhiều đời sống quá khứ; thiên nhãn thấy chúng sinh chết và
  tái sinh theo nghiệp; và trí đoạn tận các lậu hoặc: biết bốn sự thật, tâm được
  giải thoát, sinh đã tận, phạm hạnh đã thành, việc cần làm đã làm.


  Sau mỗi uẩn, Subha khen viên mãn còn Ānanda nói vẫn còn việc cao hơn cần làm,
  cho đến uẩn cuối cùng thì không còn gì cao hơn. Subha tán thán, ví Ānanda như
  người dựng đứng vật bị lật, và quy y Tôn giả Gotama, Pháp và Tăng chúng
  tỳ-kheo. Bài kinh cho thấy đời phạm hạnh theo Đức Phật kết trọn ở ba thành tựu
  giới, định, tuệ, với đỉnh cao là giải thoát khỏi các lậu hoặc.'
