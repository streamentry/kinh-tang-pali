  theo quality gate.

summary: |-
  Một thời, Đức Thế Tôn trú gần Sāvatthī. Ngài đến giảng đường của Mallikā, nơi du sĩ Poṭṭhapāda cùng ba trăm du sĩ tụ họp. Ông kể cuộc tranh luận về sự chấm dứt của tưởng: có người nói tưởng sinh diệt không do nguyên nhân; có người nói tưởng là tự ngã đi vào, đi ra; có người nói thần lực của sa-môn, Bà-la-môn hay các vị trời đưa vào, kéo ra. Ông hỏi Đức Thế Tôn tưởng chấm dứt như thế nào.

  Đức Thế Tôn cho biết tưởng sinh, diệt do nguyên nhân và điều kiện: do tu tập, một loại tưởng sinh lên, một loại chấm dứt. Từ bỏ năm triền cái, tỳ-kheo chứng sơ thiền — tưởng về dục chấm dứt, tưởng vi tế về hỷ lạc sinh lên — rồi tuần tự qua nhị, tam, tứ thiền và ba xứ vô sắc, mỗi bậc tưởng trước chấm dứt, tưởng vi tế hơn sinh lên. Từ khi tự chủ với tưởng, vị ấy đến đỉnh của tưởng rồi, không cố ý, không tạo tác, chạm đến sự chấm dứt.

  Về chứng nhập với tỉnh giác vào chấm dứt tuần tự của tưởng, Poṭṭhapāda nói chưa từng nghe. Ngài nói đỉnh của tưởng có thể một hoặc nhiều, tùy cách chạm đến chấm dứt; tưởng sinh trước, trí sinh sau. Về tưởng có phải là tự ngã, với từng loại tự ngã ông tin — thô, do tâm tạo, vô sắc do tưởng tạo thành — Ngài cho thấy tưởng là một thứ, tự ngã là thứ khác, điều khó cho ông hiểu vì khác quan điểm.

  Poṭṭhapāda hỏi vì sao Ngài không tuyên bố thế giới thường còn hay không thường còn, hay Như Lai còn tồn tại sau khi chết. Ngài đáp những điều ấy không gắn với lợi ích, không đưa đến nhàm chán, ly tham, chấm dứt, giác ngộ hay Niết-bàn; bốn sự thật về khổ được tuyên bố vì đưa đến những điều ấy. Khi bị du sĩ chế giễu vì tán đồng mọi lời Gotama, ông đáp Gotama trình bày con đường thực hành có thật, đúng pháp.

  Ngày sau, Citta Hatthisāriputta cùng Poṭṭhapāda đến gặp Ngài; Đức Phật nói các du sĩ kia đều mù, chỉ ông có mắt. Ngài chất vấn những người chủ trương sau khi chết tự ngã hạnh phúc: không trực tiếp biết thấy thế giới ấy, không biết con đường — lời họ không có cơ sở kiểm chứng. Ngài nêu ba dạng hiện hữu — thô, do tâm tạo, vô sắc — và dạy Pháp từ bỏ chúng. Khi Citta hỏi dạng nào là thật, Ngài đáp mỗi thời chỉ dạng đang có được gọi tên, như từ sữa đến tinh chất bơ. Poṭṭhapāda quy y; Citta xuất gia, chẳng bao lâu chứng A-la-hán.
