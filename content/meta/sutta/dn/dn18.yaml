summary: |-
  Kinh Xà-ni-sa được thuyết khi Đức Thế Tôn trú tại Nātika, trong nhà bằng gạch. Ngài thường tuyên bố nơi tái sinh của tín đồ nhiều xứ đã qua đời: hơn năm mươi tín đồ Nātika đoạn tận năm hạ phần kiết sử, sẽ nhập Niết-bàn tại đó; hơn chín mươi vị đoạn ba kiết sử, làm suy yếu tham, sân, si, là bậc Nhất lai; hơn năm trăm vị đoạn ba kiết sử là những bậc Dự lưu, không đọa ác thú, hướng đến giác ngộ.

  Ānanda suy xét: ở Magadha cũng có nhiều tín đồ lâu năm đã qua đời, trong đó có vua Bimbisāra, vị vua theo Pháp, vậy mà Đức Thế Tôn chưa tuyên bố về họ dù đã giác ngộ tại Magadha. Sau khi Ānanda trình bày, Đức Thế Tôn vào nhà bằng gạch, tập trung toàn tâm đến họ và thấy được đời sau của họ. Chiều ấy, Ngài kể: một Dạ-xoa hiện ra, tự xưng Janavasabha, chính là vua Bimbisāra, tái sinh lần thứ bảy làm bạn Đại Thiên Vương Vessavaṇa, mười bốn lần luân chuyển; nhờ giáo pháp của Ngài, vị ấy từ lâu biết mình không đọa ác thú, vẫn hy vọng đạt quả Nhất lai.

  Dạ-xoa thuật lại: vào ngày Bố-tát đầu mùa an cư, chư thiên Tāvatiṁsa tụ họp trong Thiện Pháp đường; những vị trời mới sống phạm hạnh dưới sự hướng dẫn của Đức Thế Tôn vượt trội về dung sắc, danh tiếng, chư thiên hoan hỷ: thiên chúng tăng trưởng, A-tu-la suy giảm. Sanaṅkumāra hiện ra với thân thô hơn, mang hình đồng tử Pañcasikha, giọng nói đủ tám đặc tính gọi là Phạm âm; Ngài hóa hiện ba mươi ba thân dạy rằng ai quy y Phật, Pháp, Tăng và thành tựu giới hạnh sẽ tái sinh vào các cõi trời.

  Phạm thiên tuyên dương bốn thần túc (định do dục, tinh tấn, tâm, quán xét cùng các hành tinh cần) nguồn của mọi thần thông quá khứ, tương lai, hiện tại; ba cơ hội an lạc nhờ nghe Thánh pháp: rời các dục và pháp bất thiện, lắng dịu các hành thô, hoặc đoạn vô minh sinh minh; bốn niệm xứ (quán thân, thọ, tâm, pháp trên nội thân rồi sinh trí, kiến về người khác); và bảy pháp hỗ trợ chánh định sinh nối tiếp từ chánh kiến đến chánh giải thoát. Ngài nói hơn hai triệu bốn trăm ngàn tín đồ Magadha quá cố là bậc Dự lưu, trong đó có bậc Nhất lai.

  Phạm thiên còn nói các bậc Đạo sư thù thắng như vậy từng có và sẽ lại có. Lời kể truyền từ Vessavaṇa qua Janavasabha đến Đức Thế Tôn, rồi qua Ānanda đến bốn chúng, để đời sống phạm hạnh hưng thịnh giữa chư thiên và loài người.
