summary: |-
  Kinh Đại Niệm Xứ chép lời Đức Thế Tôn dạy tỳ-kheo giữa dân Kuru, tại Kammāsadamma: bốn niệm xứ là con đường trực tiếp để thanh tịnh chúng sinh, vượt qua sầu và bi, chấm dứt khổ và ưu, đạt được chánh đạo và chứng ngộ Niết-bàn. Tỳ-kheo sống quán thân nơi thân, quán thọ nơi các cảm thọ, quán tâm nơi tâm, quán pháp nơi các pháp, nhiệt tâm, tỉnh giác, chánh niệm, gạt bỏ tham muốn và ưu phiền đối với đời.

  Phần quán thân gồm mười bốn phép quán, mỗi phép khép lại bằng cùng một công thức: quán bên trong, bên ngoài, quán sinh khởi, hoại diệt, sống không nương tựa, không chấp thủ gì trong đời. Tỳ-kheo thở vào thở ra với chánh niệm, biết rõ hơi thở dài ngắn; biết đúng từng tư thế; quán các phần bất tịnh và bốn đại địa, thủy, hỏa, phong. Chín phép quán tử thi, từ thi thể trương phồng đến xương trắng mục nát, đều đưa về suy xét: thân này cũng sẽ trở thành như vậy.

  Phần quán thọ chỉ biết đúng từng cảm thọ: lạc, khổ, không khổ không lạc, mỗi loại chia thành thuộc và không thuộc vật chất. Phần quán tâm liệt kê mười sáu trạng thái: có tham hay không tham, có sân hay không sân, có si hay không si, co rút hay tán loạn, rộng lớn hay không, còn có thể vượt hơn hay không, có định hay không, giải thoát hay chưa giải thoát.

  Phần quán pháp có năm đề tài. Với năm triền cái, vị ấy biết chúng hiện có hay không, sinh khởi, từ bỏ và không sinh lại. Với năm thủ uẩn, vị ấy quán sự sinh khởi và hoại diệt của sắc, thọ, tưởng, hành, thức. Với sáu nội xứ và ngoại xứ, vị ấy biết kiết sử sinh do duyên cả hai, từ bỏ và không tái sinh của nó. Với bảy giác chi, biết hiện có hay không và cách tu tập đến viên mãn.

  Phần bốn Thánh đế: khổ là sinh, già, chết, sầu bi khổ ưu não, gặp điều không ưa, xa điều thương, mong cầu mà không được, tóm lại là năm thủ uẩn. Nguồn gốc của khổ là ái đưa đến tái sinh, tức dục ái, hữu ái, phi hữu ái, an trú ở mọi điều đáng yêu, dễ chịu; chấm dứt khổ là ly tham, đoạn diệt hoàn toàn ái ấy ngay tại đó; con đường là Thánh đạo tám ngành, với chánh niệm là chính bốn niệm xứ, chánh định qua bốn thiền. Ai tu tập bốn niệm xứ, từ bảy năm đến bảy ngày, có thể mong đợi một trong hai quả: chánh trí ngay trong hiện tại, hoặc nếu còn dư y, quả Bất lai.

notes: |-
  **Sửa dấu lược bịa (2026-10-05).** Mười khoá của lát đã **bỏ nội dung Pāli rồi để lại `…`**, và
  thêm một khoá lệch-một-vị-trí mà lát không liệt kê. Đo bằng script trên **mọi** khoá (49 + 77 +
  437 + 454 khoá của bốn bài), tính `…pe…` theo quy ước một dấu lược của tầng Việt:

  - `9.4` — Pāli liệt kê đủ mười ba món xương, không có `…`; bản cũ cắt ở *chỗ này sọ …*.
    Đã bỏ dấu lược. Danh sách mười ba món xương vốn đã đủ, không mất gì khác.
  - `14.9` — Pāli `iti ajjhattaṁ vā dhammesu dhammānupassī viharati, bahiddhā vā …,
    ajjhattabahiddhā vā … viharati.`: **cả ba** vế. Bản cũ chỉ giữ vế đầu rồi cắt. Đã viết đủ.
  - `18.38`, `18.41`, `18.43` — Pāli `… dhammānaṁ … evaṁ icchā uppajjati` kèm lời nguyện cầu đầy
    đủ; bản cũ chỉ giữ *mong ước tương tự khởi lên …*, mất trọn lời nguyện cầu. Đã viết đủ.
  - `18.40`, `18.42`, `18.44` — Pāli `Na kho panetaṁ icchāya pattabbaṁ, idampi yampicchaṁ na
    labhati tampi dukkhaṁ.`: bản cũ chỉ giữ vế đầu. Đã ghép đủ hai vế.
  - `22.11` — Pāli `Yo hi koci … sattamāsāni … pāṭikaṅkhaṁ`: bản cũ mất vế
    `tassa dvinnaṁ phalānaṁ aññataraṁ phalaṁ pāṭikaṅkhaṁ` — tức mất chính **tiêu chí** của cả
    đoạn. Đã viết đủ.

  **Một khoá tôi tự phát hiện ngoài danh sách: `22.12`, và nó là lỗi lệch-một-khoá.** Pāli
  `22.12` là `diṭṭheva dhamme aññā; sati vā upādisese anāgāmitā.`, trùng **byte** với `22.2`, nhưng
  bản Việt lại mang câu của `22.13` (*Không cần đến bảy tháng.*). Hệ quả: cả ba khoá `22.12` và
  `22.13` đều đọc *Không cần đến bảy tháng*, còn `22.11`–`22.13` lệch nguyên một vị trí. Tôi sửa
  cả hai: `22.12` theo nguyên văn `22.2`, `22.13` thành *Không cần đến bảy tháng.* theo `22.3`
  / `22.10` / `22.21`. **Người điều phối nên biết đợt này sửa 11 khoá của dn22, không phải 10.**

  **Pāli trùng nguyên văn ở bài khác — quét bằng script, không đoán.** `dn22:9.4` trùng **byte**
  với `mn/mn10:24.1`. Tôi **không** chép nguyên văn bản dịch ở `mn10:24.1` vì bản đó **mắc đúng
  lỗi này**: nó cũng kết bằng *chỗ này hộp sọ …* trong khi Pāli không có `…`. Luật “dùng lại nguyên
  văn” là quy ước mặc định, còn Pāli là authority; khi bản dùng lại sai thì Pāli thắng. Ngoài ra
  `mn10:46.2` / `mn10:46.12` trùng byte `dn22:22.2` và `mn10:46.13` trùng byte `dn22:22.13` — hai
  khoá này khác cách diễn đạt (*chánh trí ngay trong **đời này**…* và dấu phẩy cuối) nhưng cùng
  nghĩa, nên tôi giữ bản trong bài cho nhất quán với `22.2` / `22.3` / `22.10` / `22.21`.

  **Trong chính dn22 thì đếm được:** nhóm Pāli trùng nguyên văn ≥ 40 ký tự = **13**; sau sửa còn
  **4** nhóm mà bản Việt khác, và tôi **giữ nguyên** có lý do cho từng nhóm:

  - `18.40/18.42/18.44` — trước đây lệch phân biệt hoa/thường (*Nhưng* / *nhưng*); nay đã thống
    nhất theo Pāli, vốn viết hoa ở cả ba khoá.
  - `13.9` trùng với `14.9` khác **đúng một chữ** (`Iti` / `iti`); tôi dùng lại nguyên văn `13.9`.
    `13.10`/`14.10` và `13.11`/`14.11` cũng khác nhau, nhưng là khác **vị trí câu** trong khối
    (`14.10`–`14.11` nối liền câu đã mở ở `14.3`) nên khác là đúng, không sửa.
  - `2.12` / `3.4`+`10.7` — `2.12` lặp chủ ngữ ba lần cho ba vế, hai khoá kia dùng dạng rút gọn;
    là khác cách diễn đạt trên cùng nghĩa.

  **Thuật ngữ — đếm trên toàn tầng `vietnamese-project` (155.826 giá trị) trước khi chốt:**
  `bên trong, bên ngoài, và cả bên trong lẫn bên ngoài` 9 (chính là `13.9` và bảy khoá anh em) ·
  `mong ước này khởi lên` 1 (`18.34`, đúng cấu trúc hai chấm) · `chịu sự già` 2 · `chịu bệnh` 2 ·
  `chịu sự chết` 4 · `không thể đạt được chỉ bằng mong cầu` 5 · `mong cầu mà không được là khổ` 5 ·
  `Không cần đến` 10 · `có thể mong đợi một trong hai quả` 10 (`22.1`) · `xương hàm` 5 ·
  `bốn niệm xứ` 181. Bản cũ ở `18.38/41/43` ghi *mong ước **tương tự** khởi lên* — cụm đó không có
  tiền lệ nào trong tầng (đếm = 0) và làm lệch `evaṁ icchā` ⇒ đổi theo `18.34`.

  **Dấu kết:** `18.38` kết dấu hai chấm vì lời nguyện cầu nằm ở `18.39`; `18.41` và `18.43` kết
  dấu hai chấm ngay trong khoá vì lời nguyện cầu nằm ngay trong Pāli khoá đó. `22.11` kết dấu hai
  chấm vì `22.12` nối tiếp. `14.9` kết dấu chấm phẩy để nối `14.10` vốn bắt đầu chữ thường.

  **Ngoài lát, nêu ra chứ không sửa:** `14.8` đóng ngoặc kép quá sớm (`… của thức.’`) trong khi
  `14.9`–`14.10` còn nằm trong lời thoại, và `14.11` lại mở ngoặc mới. Không mất nghĩa gì, nhưng
  là lỗi cấu trúc. Ngoài ra `22.14`–`22.20` đã **nén** phần `…pe…` thành *sáu tháng …*, *năm tháng
  …*; theo BRIEF_VI §10.2 việc nén được phép khi công thức bị nén đã nêu đủ trong cùng bài, và sau
  khi `22.11`–`22.13` viết đủ thì điều kiện đó đúng.

  Điểm: `semantic_fidelity` 9,6 → **9,7** (khôi phục nội dung Pāli ở mười một khoá) ·
  `segment_alignment` 10,0 → **9,6** (`22.12` thật sự là lệch-một-khoá, không thể để 10,0) ·
  `technical_integrity` 10,0 → **9,6** vì lát này bị cấm chạy cổng. `final_score` tính lại bằng
  script: 96,4 / 10 = **9,64**. Còn lại bốn lệnh: `npm run validate`, `npm test`,
  `npm run check`, `npm run build`.

  **Blocker đã gỡ, và nói rõ điều lệch tiến trình.** Lúc tôi mở tệp lần đầu (16:19) nó còn
  `status: published` và `blocking_errors: []`. Blocker `dn22: cắt ngắm` của người điều phối **có
  mặt**, nhưng được một tiến trình khác ghi vào **sau đó**, trong lúc tôi đang dịch. Cả mười khoá
  nó liệt kê đã sửa xong, và đo lại bằng script cho phép `số … của VI == số … của Pāli` trên
  **cả 454 khoá** cho kết quả **0 lệch**; `22.12` là khoá thứ mười một, tôi tự phát hiện. Nên tôi
