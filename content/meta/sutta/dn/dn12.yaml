summary: |-
  Kinh Lohicca mở đầu khi Đức Phật cùng khoảng năm trăm vị tỳ-kheo đến Sālavatikā trong xứ Kosala. Ở đó, Bà-la-môn Lohicca nắm giữ quan điểm sai lầm và có hại rằng nếu một sa-môn hay Bà-la-môn chứng đạt một pháp lành thì không nên nói cho người khác biết, vì người này có thể làm gì cho người kia; ông cho rằng việc ấy là xấu ác, do lòng tham.

  Lohicca cử người thợ cắt tóc Rosika mời Đức Phật và Tăng đoàn dùng bữa, và mong Ngài giúp chủ mình thoát khỏi quan điểm ấy. Sau bữa ăn, Đức Phật chất vấn Lohicca: ai nói mọi nguồn lợi từ vùng đất ông cai quản chỉ một mình người ấy hưởng, không chia cho ai, có gây trở ngại cho những người sống nhờ không. Người gây trở ngại mong điều bất lợi cho họ, tâm thù nghịch hiện diện, đó là tà kiến, đưa đến một trong hai cảnh giới: địa ngục hoặc loài bàng sinh. Người nói pháp lành đã chứng đạt không nên dạy cho người khác gây trở ngại cho những ai nhờ Pháp và Luật của Như Lai mà chứng quả Dự lưu, Nhất lai, Bất lai hay A-la-hán, hay đang làm chín mầm tái sinh vào các cõi trời.

  Đức Phật nêu ba loại đạo sư đáng bị khiển trách: vị xuất gia vì một mục đích nhưng chưa đạt được mục đích ấy mà vẫn thuyết Pháp, dù các đệ tử không muốn nghe; loại thứ hai cũng chưa đạt mục đích nhưng các đệ tử muốn nghe; loại thứ ba đã đạt mục đích nhưng các đệ tử không nghe theo. Mỗi loại đi kèm một ví dụ, như kẻ cắt đứt sợi dây trói cũ rồi tự tạo sợi dây trói mới; ai khiển trách họ là khiển trách đúng sự thật và không có lỗi.

  Được hỏi có đạo sư nào không đáng khiển trách, Đức Phật chỉ ra một Như Lai xuất hiện ở đời: vị tỳ-kheo thành tựu giới hạnh, chứng và an trú bốn tầng thiền, hướng tâm đến tri kiến, biết rõ không còn trở lại; mỗi tầng bậc đều kết luận rằng đạo sư mà đệ tử đạt thành tựu cao quý như vậy là đạo sư không đáng bị khiển trách. Lohicca tán thán, ví mình như người rơi xuống vực địa ngục được nắm tóc kéo lên đặt trên đất vững chắc, rồi quy y Đức Phật, Pháp và Tăng đoàn đến trọn đời.

  Bài kinh bác bỏ quan điểm giữ pháp cho riêng mình: ai cản trở truyền dạy pháp lành là người có tà kiến, còn bậc thầy giúp đệ tử đạt thành tựu cao quý thì không đáng bị khiển trách.
