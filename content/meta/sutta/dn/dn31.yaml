summary: |-
  Bài kinh Giáo Thọ Siṅgāla thuộc Trường Bộ Kinh, do Đức Thế Tôn thuyết tại Rājagaha, trong Trúc Lâm. Sáng sớm, Siṅgālaka, con một gia chủ, ra khỏi thành, chắp tay lễ sáu phương: đông, nam, tây, bắc, dưới, trên, theo lời cha dặn. Khi đi khất thực thấy vậy, Đức Thế Tôn bảo rằng trong giới luật của bậc Thánh sáu phương không nên lễ theo cách ấy, rồi thuyết cách lễ đúng nghĩa.

  Người Thánh đệ tử từ bỏ bốn nghiệp ô nhiễm là sát sinh, lấy của không cho, tà hạnh trong các dục, nói dối; không làm nghiệp xấu do thiên vị vì tham muốn, sân hận, si mê hay sợ hãi; không theo sáu cửa làm hao tán tài sản, gồm đắm rượu và chất say, lang thang đường phố phi thời, tìm đến các cuộc vui, mê cờ bạc, giao du bạn xấu, lười biếng. Từng cửa mang sáu nguy hại: tài sản hao mất; mất sự bảo vệ khi đi đường phi thời; thắng gây thù, thua tiếc của khi mê cờ; lười biếng thì viện đủ lý do trời lạnh, trời nóng, muộn quá, để của đã có thì dần cạn.

  Tránh được mười bốn điều xấu ấy, Thánh đệ tử che chở sáu phương, thành tựu cả hai đời và tái sinh cõi trời. Kinh phân biệt bốn kẻ thù mang dáng vẻ bạn — người chỉ muốn lấy, người chỉ nói suông, người nịnh hót, người làm bạn trong đường suy sụp — mỗi loại có bốn dấu hiệu để nhận ra; còn có bốn bạn chân thành: người giúp đỡ, người đồng cam cộng khổ, người chỉ điều lợi ích, người có lòng thương, biết giữ kín điều bí mật và vui khi bạn thịnh vượng.

  Phần cuối giải nghĩa sáu phương: cha mẹ là phương đông, thầy cô là phương nam, vợ con là phương tây, bạn bè và đồng sự là phương bắc, người làm công và người phục vụ là phương dưới, sa-môn và Bà-la-môn là phương trên. Với mỗi phương, kinh nêu năm cách đối xử và các cách đáp lại: người con làm việc cần làm, gìn giữ gia sản, còn cha mẹ dạy nghề, trao gia sản; vợ chồng không ngoại tình; chủ trả công; người tại gia cúng dường sa-môn Bà-la-môn bằng thân, khẩu, ý hành có lòng từ, và được đáp lại bằng cách ngăn điều xấu, chỉ đường đến cõi trời.

  Kinh khuyên chia tài sản thành bốn phần: một phần để thọ hưởng, hai phần cho công việc, một phần để dành; bốn cách gắn kết — cho tặng, lời nói thân ái, hành động vì lợi ích, đối xử bình đẳng — giữ cho đời sống gắn bó. Nghe xong, Siṅgālaka xin quy y Thế Tôn, Pháp và Tăng với cương vị nam cư sĩ đến trọn đời.
