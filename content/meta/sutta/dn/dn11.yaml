summary: |-
  Kinh Kevaṭṭa mở đầu tại Nāḷandā, nơi Đức Phật trú trong vườn xoài của Pāvārika. Kevaṭṭa, con một gia chủ, thỉnh cầu Thế Tôn cho một vị tỳ-kheo biểu hiện thần thông vượt khả năng thông thường của con người để dân chúng thêm tín tâm; Đức Phật từ chối ba lần.

  Đức Phật nêu ba loại thị hiện Ngài tự mình thắng tri rồi tuyên thuyết: thị hiện thần thông, thị hiện biết tâm và thị hiện giáo giới. Thị hiện thần thông là vị tỳ-kheo thực hiện nhiều loại thần thông, từ một thân hóa thành nhiều thân cho đến dùng thân làm chủ tận cõi Phạm thiên; nhưng người không có lòng tin có thể quy cho một loại thuật gọi là Gandhārī. Thị hiện biết tâm cũng có thể bị quy cho một loại thuật gọi là Māṇikā; vì thấy mối nguy hại ấy, Đức Phật chán ngán, hổ thẹn và ghê sợ hai thị hiện này. Thị hiện giáo giới là lời dạy nên suy nghĩ, từ bỏ và chứng đạt điều gì; trọn vẹn nhất là con đường Như Lai hướng dẫn, từ giới hạnh qua bốn tầng thiền đến chỗ biết rõ không còn trở lại.

  Phần sau kể về một vị tỳ-kheo khởi ý tìm nơi bốn đại chủng là địa đại, thủy đại, hỏa đại, phong đại đoạn diệt hoàn toàn, không còn dư sót. Nhập định, vị ấy lần lượt hỏi từ chư thiên Tứ Đại Thiên Vương, Ba Mươi Ba, Sakka qua các tầng trời cao hơn đến thiên tử Vasavattī và chư thiên Phạm chúng; tất cả đều trả lời không biết, chỉ lên trên. Đại Phạm thiên kéo vị tỳ-kheo sang một bên, thú thật rằng hội chúng tin mình biết tất cả nên không dám trả lời, thực ra cũng không biết, rồi dặn trở về hỏi Đức Thế Tôn.

  Đức Phật ví vị tỳ-kheo như con chim trên thuyền buôn được thả ra dò tìm bờ: bay khắp các hướng mà không thấy bờ thì quay về con thuyền; vị ấy tìm đến tận cõi Phạm thiên mà không có lời giải, cuối cùng trở về với Đức Phật. Ngài dạy phải hỏi khác đi: ở đâu nước cùng đất, lửa và gió không tìm được chỗ đứng; ở đâu danh và sắc đều đoạn diệt hoàn toàn. Câu trả lời: thức không biểu hiện, vô biên, sáng tỏ khắp nơi; do thức đoạn diệt, tất cả những điều ấy đoạn diệt tại đây.

  Bài kinh khép lại khi Kevaṭṭa hoan hỷ, tán đồng: hai thị hiện đầu có thể bị quy cho các loại thuật, còn câu hỏi về nơi bốn đại chủng đoạn diệt được đổi về nơi thức đoạn diệt, danh và sắc đoạn diệt hoàn toàn.
