summary: |-
  Một thời, Đức Thế Tôn du hành trong xứ Magadha cùng khoảng năm trăm tỳ-kheo và trú tại Ambalaṭṭhikā gần Khāṇumata. Ở đó, Bà-la-môn Kūṭadanta đang chuẩn bị đại tế lễ với hàng nghìn bò, dê, cừu đã dẫn đến cọc tế. Ông nghe rằng Sa-môn Gotama biết cách thành tựu một tế lễ có ba phương diện và mười sáu điều kiện, nên quyết định đến yết kiến để hỏi.

  Các Bà-la-môn can ngăn, kể những phẩm chất của Kūṭadanta và bảo rằng Sa-môn Gotama mới nên đến gặp. Kūṭadanta đáp lại bằng chuỗi phẩm chất của Đức Phật và lý do vị khách đến vùng làng phải được kính trọng. Nghe vậy, các Bà-la-môn đồng ý đi yết kiến.

  Đức Thế Tôn kể chuyện vua Mahāvijita thuở xưa muốn làm đại tế lễ. Vị tế sư khuyên không trấn áp nạn cướp bằng giết hay giam giữ, mà cấp hạt giống, vốn liếng và lương bổng để mọi người chuyên tâm công việc; đất nước nhờ vậy an ổn và nguồn thu tăng lên.

  Tế lễ ấy thành tựu theo ba phương diện — vua không nuôi hối tiếc về tài sản trước, trong và sau lễ — cùng mười sáu điều kiện: bốn nhóm trong nước đồng thuận, tám phẩm chất của nhà vua và bốn phẩm chất của tế sư. Tế sư hóa giải hối tiếc của vua về người nhận và bác bỏ các lời chỉ trích, mỗi lần khuyên vua bố thí, xả bỏ, hoan hỷ, làm tâm trong sáng. Trong lễ không sinh vật nào bị giết; lễ hoàn tất chỉ bằng bơ sữa, mật ong và mật mía. Bốn nhóm dâng tài sản, vua từ chối, nên họ lập các cuộc bố thí phụ trợ bốn phía, cũng không hiến sinh.

  Kūṭadanta hỏi liệu Đức Phật có dự tế lễ ấy; Ngài xác nhận khi xưa chính mình là vị tế sư. Về tế lễ ít công việc hơn mà quả lớn hơn, Ngài lần lượt nêu: bố thí thường xuyên cho người xuất gia có giới hạnh; xây nơi cư trú cho Tăng đoàn bốn phương; quy y Đức Phật, Giáo pháp và Tăng đoàn; tiếp nhận các học giới — mỗi bậc có quả lớn hơn bậc trước — rồi cao hơn hết là khi một Như Lai xuất hiện: xuất gia, thành tựu giới, chứng bốn thiền, tu tập cho đến khi biết không còn gì nữa cho trạng thái hiện hữu này. Kūṭadanta quy y, thả các súc vật và mời Đức Thế Tôn dùng bữa; sau bài pháp, Pháp nhãn khởi lên nơi ông. Bài kinh cho thấy tế lễ chân chính không nằm ở hiến sinh mà ở bố thí, giới hạnh và tu tập.
