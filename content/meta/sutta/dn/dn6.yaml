summary: |-
  Một thời, Đức Phật trú tại Vesālī, trong Đại Lâm, ở giảng đường Trùng Các. Một số sứ giả Bà-la-môn từ Kosala và Magadha nghe tiếng lành về Sa-môn Gotama, đến xin yết kiến; Tôn giả Nāgita cho biết Đức Thế Tôn đang độc cư, nên họ ngồi chờ tại đó. Oṭṭhaddha người Licchavi cùng hội chúng đông đảo cũng đến chờ. Nhờ sa-di Sīha trình lên, Đức Thế Tôn ra ngồi trong bóng mát phía sau trú xá.

  Oṭṭhaddha hỏi về lời Sunakkhatta người Licchavi: sống nương tựa Đức Thế Tôn chưa đầy ba năm, ông đã thấy những sắc tướng cõi trời đáng ưa, liên hệ đến dục, nhưng không nghe những âm thanh cõi trời; vậy những âm thanh ấy có thật hay không? Đức Thế Tôn xác nhận chúng có thật và cho biết nguyên nhân: tỳ-kheo tu tập định theo một phương diện — đông, nam, tây, bắc, trên, dưới, ngang — nhằm thấy những sắc tướng cõi trời thì thấy mà không nghe; tu tập định nhằm nghe thì nghe mà không thấy; còn tu tập định theo cả hai phương diện thì vừa thấy vừa nghe.

  Các tỳ-kheo sống đời phạm hạnh dưới sự hướng dẫn của Ngài không phải để chứng nghiệm những cách định ấy, mà để chứng nghiệm các pháp cao hơn và thù thắng hơn: do đoạn tận ba kiết sử, trở thành bậc Dự lưu, chắc chắn hướng đến giác ngộ; do đoạn tận ba kiết sử và làm suy yếu tham, sân, si, trở thành bậc Nhất lai, chỉ trở lại một lần nữa; do đoạn tận năm hạ phần kiết sử, được hóa sinh, sẽ nhập Niết-bàn tại đó, không còn trở lại; và do các lậu hoặc đã đoạn tận, chứng ngay trong đời này tâm giải thoát, tuệ giải thoát không còn lậu hoặc. Đường đến các quả ấy là Thánh đạo tám chi, từ chánh kiến đến chánh định.

  Phần sau, Đức Thế Tôn kể chuyện hai vị xuất gia, du sĩ Muṇḍiya và Jāliya, đệ tử của Dārupattika, hỏi Ngài tại Kosambī: sinh mệnh và thân thể là một hay khác nhau. Từ bậc thành tựu giới hạnh, chứng bốn thiền, đến bậc hướng tâm đến tri kiến, vị tỳ-kheo biết và thấy như vậy thì thích hợp để nói như thế; nhưng vị biết rõ không còn trở lại trạng thái này nữa thì không thích hợp nói như vậy. Còn Đức Phật biết và thấy như vậy, thế nhưng không tuyên nói cả hai.

  Bài kinh cho thấy đời phạm hạnh dưới sự hướng dẫn của Đức Phật nhằm chứng nghiệm bốn Thánh quả, cao hơn các chứng định về thấy và nghe, còn câu hỏi về sinh mệnh và thân thể Ngài không tuyên nói.
