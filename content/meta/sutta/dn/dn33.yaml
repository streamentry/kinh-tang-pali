notes: |-
  Khôi phục 9 dấu lược theo luật BRIEF_VI3 10.1. Đây là sửa độ tận trung theo Pāli, không phải dịch mới.
  Bốn khoá Ayampi dhammo sāraṇīyo …pe… ekībhāvāya (2.2.41, 2.2.43, 2.2.45, 2.2.47): đối chiếu bản đủ ở 2.2.39 cho thấy khoảng lược che sáu vế còn lại; đã bỏ, chỉ giữ vế đầu và vế ekībhāvāya.
  Hai khoá bố thí (3.1.106, 3.1.115): khoảng lược che phần y phục, cỗ xe, hoa hương, bột xức; đã bỏ, giữ vế seyyāvasathapadīpeyyaṁ.
  Ba khoá 2.1.132, 3.3.24, 3.3.33: đã đặt … đúng chỗ Pāli lược, y hệt ba khoá anh em cùng công thức đã đúng sẵn là 2.1.133, 2.1.134, 3.3.21, 3.3.27, 3.3.30.
  Không xác định được nên để nguyên: không có. Quét lại toàn bài cho 0 khoá thiếu lược.


summary: |-
  Kinh Phúng Tụng mở đầu tại thành Pāvā của người Malla, nơi Đức Thế Tôn trú trong vườn xoài của Cunda nhà thợ vàng cùng đại Tăng-già năm trăm tỳ-kheo. Người Malla vừa xây xong hội trường mới tên Ubbhaṭaka, mời Đức Thế Tôn dùng trước. Thấy đại Tăng-già lặng thinh, không còn hôn trầm buồn ngủ, Đức Thế Tôn nói lưng đau nhức, nhờ Tôn giả Sāriputta giảng pháp thay. Nhân duyên là đạo sĩ Nigaṇṭha Nāṭaputta vừa qua đời, đệ tử rạn nứt, chia phe, cãi vã; Sāriputta xem đó là pháp và luật giảng dạy tồi, đối lại pháp của Đức Thế Tôn được giảng dạy lành, đưa đến xuất ly, an tịnh.

  Thân kinh là danh mục pháp kê theo nhóm từ một đến mười, mỗi nhóm khép lại bằng lời kêu gọi đồng tụng, chớ tranh cãi, để Phạm hạnh trường tồn, vì lợi ích của nhiều người, của chư thiên và loài người. Nhóm một: tất cả chúng sinh trú nhờ ăn uống, trú nhờ các hành. Nhóm hai nêu các cặp như danh và sắc, niệm và tỉnh giác, chỉ và quán. Nhóm ba có ba gốc bất thiện, ba gốc thiện, ba thọ, ba học tập về tăng thượng giới, tâm và tuệ, ba cơ sở tạo phước. Nhóm bốn: bốn niệm xứ, bốn chánh cần, bốn như ý túc, bốn thiền, bốn vô lượng, bốn quả Sa-môn; phần tụng thứ nhất kết thúc ở đó.

  Nhóm năm có năm uẩn, năm thủ uẩn, năm triền cái, năm giới học. Nhóm sáu có sáu gốc tranh cãi, cùng sáu giới thoát ly, nơi tâm giải thoát nhờ lòng từ, bi, hỷ, xả không thể bị sân hận hay tham ái chiếm ngự. Nhóm bảy gồm bảy tài sản Thánh, bảy giác chi, bảy pháp làm yên các vụ tranh luận; phần tụng thứ hai kết thúc ở đó. Nhóm tám nêu tám tà đối lại tám chánh, tám cơ sở biếng nhác đối lại tám cơ sở phát khởi tinh tấn, tám giải thoát. Nhóm chín chỉ chín cách trừ sân hận, chín bậc an trú tiệm tiến và chín diệt tiệm tiến. Nhóm mười kết bằng mười pháp làm chỗ nương tựa, mười đạo thiện nghiệp đối lại mười đạo bất thiện nghiệp, mười pháp của bậc vô học.

  Khi Sāriputta thuyết xong, Đức Thế Tôn đứng dậy khen ngợi, xác nhận ngài đã thuyết phép đồng tụng cho các tỳ-kheo; Bậc Đạo sư hoan hỷ chấp thuận. Bài kinh nhằm một điều: gom giáo pháp thành danh mục mà cả Tăng chúng cùng nắm giữ, để sự hợp nhất trong pháp che chắn khỏi cảnh rạn nứt như nơi hàng Nigaṇṭha, giữ Phạm hạnh trường tồn và lợi ích của chư thiên cùng loài người.
