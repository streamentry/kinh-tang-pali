summary: |-
  Kinh Tam Minh mở đầu khi Đức Thế Tôn cùng khoảng năm trăm tỳ-kheo trú tại Manasākaṭa, trong vườn xoài bên bờ sông Aciravatī, xứ Kosala. Hai thanh niên Bà-la-môn Vāseṭṭha và Bhāradvāja tranh luận về con đường đến cộng trú với Phạm thiên: một bên theo con đường do Bà-la-môn Pokkharasāti giảng dạy, bên kia theo con đường do Bà-la-môn Tārukkha giảng dạy, đều cho đó là con đường thẳng, trực tiếp duy nhất; không ai thuyết phục được ai, họ đến hỏi Đức Phật.

  Vāseṭṭha lập luận rằng các Bà-la-môn dạy nhiều con đường khác nhau, tất cả đều dẫn đến cộng trú với Phạm thiên. Đức Phật hỏi lại: trong các Bà-la-môn tinh thông ba Veda, có dù chỉ một người, một vị thầy hay ai trong dòng truyền thừa bảy đời đã tận mắt thấy Phạm thiên chưa; các vị tiên tri cổ có từng tuyên bố biết, thấy Phạm thiên ở đâu chưa; lần lượt đều là không. Như thế họ chỉ con đường đến cộng trú với điều mình không biết, không thấy, như một đoàn người mù nối nhau, người đầu, người giữa và người cuối đều không thấy.

  Đức Phật minh họa: như người đứng bờ sông gọi bờ bên kia sang mà bờ không sang và tự mình không thể vượt qua, các Bà-la-môn ấy từ bỏ phẩm chất Bà-la-môn, dính mắc năm dục trưởng dưỡng, bị năm triền cái che lấp, dù gọi Inda, Soma, Varuṇa hay Brahmā cũng không thể cộng trú với Phạm thiên. Ngài đối chiếu: Phạm thiên không bị ràng buộc bởi sự sở hữu, không thù nghịch, không ác ý, không ô nhiễm và tự chủ, còn các Bà-la-môn thì ngược lại cả năm điểm; sự tinh thông ba Veda vì vậy chỉ là bãi hoang, rừng rậm và tai họa Tam Veda.

  Khi Vāseṭṭha xin được chỉ con đường, Đức Phật trình bày: một Như Lai xuất hiện ở đời, vị tỳ-kheo thành tựu giới hạnh, thấy năm triền cái được từ bỏ thì hân hoan sinh khởi, hỷ sinh khởi, thân lắng dịu, cảm nhận lạc và tâm định tĩnh; rồi vị ấy biến mãn khắp các phương, trên, dưới, ngang, khắp nơi với tâm đi cùng từ, bi, hỷ, xả, rộng lớn, vô lượng. Khi tâm giải thoát được tu tập như thế, nghiệp hữu hạn đã tạo không còn lưu lại. Vị tỳ-kheo ấy có cùng phẩm chất với Phạm thiên, nên sau khi thân hoại mạng chung có thể cộng trú với cõi ấy.

  Bài kinh khép lại khi hai thanh niên quy y; con đường đến Phạm thiên không phải sự tinh thông ba Veda, mà là tu tập tâm từ, bi, hỷ, xả tương hợp với phẩm chất của Phạm thiên.

notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 20.8 và 22.13 — «Đúng vậy… Nếu vậy… quả thật» → «Thật vậy… trong trường hợp ấy…» (khớp 14.12, 18.13, 19.15, 22.6 cùng Pāli `addhā kho… evaṁ sante`); khoá 21.3 — «ngôi nhà» → «tòa lầu» (`pāsāda`), lặp «phương» cho từng hướng, «trung bình» → «vừa» (khớp dn9:37.3); sửa lan 21.1 và 22.2 cùng thuật ngữ `pāsāda`; khoá 19.11 — thêm «yêu thích» cho `kāmesi` (khớp dn9:35.10) và sửa lan 19.4, 19.8; giữ nguyên khoá 19.2 («mong muốn… yêu thích» khớp dn9 và 19.4) và 7.1 (cả bài chỉ nêu «thanh niên» ở lần giới thiệu).
