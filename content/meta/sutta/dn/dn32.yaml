summary: |-
  Bài kinh Āṭānāṭiya thuộc Trường Bộ Kinh, do bốn vị Đại Thiên Vương trình với Đức Thế Tôn tại Rājagaha, trên núi Gijjhakūṭa. Đêm khuya, các vị cùng đạo quân lớn gồm Dạ-xoa, Càn-thát-bà, Cưu-bàn-trà và Nāga, sau khi bố trí sự bảo vệ, tuần tra ở bốn phương, với dung sắc rực rỡ, đi đến đảnh lễ Đức Thế Tôn và ngồi xuống một bên.

  Đại Thiên Vương Vessavaṇa thưa: trong các Dạ-xoa, bậc cao bậc thấp đều có vị có tín tâm, có vị không, nhưng phần lớn không có tín tâm, vì Thế Tôn thuyết pháp tránh sát sinh, lấy của không cho, tà hạnh trong dục, nói dối, và rượu cùng các chất say. Vì các đệ tử thường lui tới trú xứ xa vắng trong rừng sâu, nơi có Dạ-xoa không tín tâm cư trú, Vessavaṇa xin Thế Tôn tiếp nhận bài hộ trì Āṭānāṭiya nhằm gìn giữ, bảo hộ và giúp sống an ổn cho tỳ-kheo, tỳ-kheo-ni, nam cư sĩ và nữ cư sĩ; Đức Thế Tôn im lặng nhận lời.

  Bài tụng kính lễ bảy vị Phật, từ Vipassī đến Gotama, rồi tả bốn phương: phương đông do Dhataraṭṭha, chúa các Càn-thát-bà trấn giữ; phương nam do Virūḷha, chúa các Cưu-bàn-trà; phương tây do Virūpakkha, chúa các Nāga; phương bắc do Kuvera, chúa các Dạ-xoa, còn gọi là Vessavaṇa. Mỗi đoạn kết bằng lời đảnh lễ Đức Phật, người bà con của Mặt Trời, bậc thành tựu Minh và Hạnh. Phần phương bắc tả xứ Uttarakuru, nơi người sinh ra không tích giữ tài sản, dùng lúa tự chín, cùng các thành phố giữa không trung và kinh đô Āḷakamandā.

  Vessavaṇa tuyên bố: phi nhân nào với ác tâm — Dạ-xoa, Càn-thát-bà, Cưu-bàn-trà hay Nāga — đi theo hoặc đến gần tỳ-kheo, tỳ-kheo-ni, nam cư sĩ hay nữ cư sĩ đã ghi nhớ bài hộ trì, thì sẽ không được kính trọng, không được đất ở trong kinh đô Āḷakamandā, không được dự hội nghị các Dạ-xoa, bị úp bát rỗng lên đầu, thậm chí bị chẻ đầu thành bảy mảnh. Với những phi nhân hung dữ không tuân lệnh các Đại Thiên Vương, ví như đại đạo tặc chống lại vua Magadha, vị ấy nên kêu cứu và báo cho các tướng quân Dạ-xoa như Inda, Soma, Varuṇa.

  Bốn vị Đại Thiên Vương và đạo quân từ biệt, biến mất. Sáng hôm sau, Đức Thế Tôn kể lại sự việc cho các tỳ-kheo, trình lại toàn phần bài tụng, rồi dặn hãy học thuộc và ghi nhớ bài hộ trì Āṭānāṭiya, vì nó có lợi ích, nhằm bảo hộ các tỳ-kheo, tỳ-kheo-ni, nam cư sĩ và nữ cư sĩ; các tỳ-kheo hoan hỷ, tùy hỷ lời Đức Thế Tôn dạy.
