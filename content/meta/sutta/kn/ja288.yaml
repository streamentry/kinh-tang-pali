  Khoá đổi (lỗi nghĩa thật 7 trên 14 khoá thân kệ, thêm 4 khoá sửa nhẹ):
  - 1.1 "Cá ngợi giá hơn một nghìn" có chữ vô nghĩa "ngợi giá"; Pāli agghanti = đáng giá
    (tiền lệ "đáng giá hơn trăm nghìn"): sửa thành "Cá đáng giá hơn một nghìn".
  - 1.3/1.4 `assu` và `kiṇeyyaṁ` đều là thức cầu nguyện/điều kiện: "nếu ở đây tôi có bảy
    đồng tiền thì tôi cũng sẽ mua chuỗi cá ấy". Bản cũ viết thẳng thì ("chỉ có", "mua được
    cả"), thêm "chỉ" và "cả" không có trong Pāli và lẫn "tôi" với "ta" trong cùng một lời.
  - 1.2 bỏ "ở đời" (Pāli chỉ nói không có ai tin điều này).
  - 2.2 `ādisi` = hồi hướng phần cúng dường (cùng cụm với pv13:14.4, bản Việt đã có là "hồi hướng
    phần cúng dường").
  - 2.3/2.4 `sarantiyā` là dạng nữ sở thuộc về người đang nhớ, tức người nói (ta), không phải
    "ngươi" như bản cũ; `kataṁ apacitiṁ tayā` = lòng tôn kính do ngươi thể hiện. Bản cũ đảo
    chủ thể (ngươi nhớ, ngươi lập) và dùng "lễ bái" cho apaciti.
  - 3.1 `paduṭṭhacitta` theo tiền lệ trong kho là "tâm ác ý"; `phāti` dịch "hưng thịnh" (kho
    dùng "tăng trưởng" cho cụm phātiṁ karoti, không khớp với phāti hoti).
  - 3.2 bỏ "các" thừa trước "chư thiên"; `pūjayanti` dịch "lễ kính".
  - 3.3/3.4 lỗi nặng nhất: bản cũ "cướp mất phần của cha, của mẹ" thêm "mẹ" không có trong
    Pāli và làm mất `bhātaraṁ` (anh em). Pāli: yo bhātaraṁ pettikaṁ sāpateyyaṁ avañcayī
    dukkaṭakammakārī = kẻ nào lừa gạt anh em mình về tài sản của cha, là kẻ làm điều ác. Sửa
    theo đó, giữ động từ avañcayī ở 3.4.
