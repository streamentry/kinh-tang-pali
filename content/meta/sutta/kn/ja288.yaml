  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 6 khoá chênh lệch lớn nhất (trên 17 khoá) → khác nghĩa 2: sửa 0, giữ 2, bất định 0. Giữ 2: `1.3` `satta māsā` (bản mù đọc “bảy tháng” và đánh dấu không chắc; `māsā` đi với `kiṇeyyaṁ` “mua” và với `agghanti … adhikaṁ sahassaṁ` ở `1.1`, nên là đơn vị tiền nhỏ, “bảy tháng” vô nghĩa); `2.3` `taṁ dakkhiṇaṁ sarantiyā` (bản mù “hồi hướng”, bản dự án “phần cúng dường” như `2.2`; `sarantiyā` là dạng nữ của người nói). Các khoá còn lại (`0.4`, `4.1`, `3.1`, `3.4`) chỉ khác diễn đạt hoặc tên riêng. Không có bản Anh hay bản Việt độc lập khác nên `triangulation` chỉ 7,6.
