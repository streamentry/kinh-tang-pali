  NGHIÊN CỨU TAM GIÁC. Không có tầng Anh nào để đối chiếu (xem trên), nên tôi đọc chú giải
  Jātaka từng vế để phân xử những chỗ Pāli khó, rồi vẫn tự viết lại bản Việt. Chú giải được
  dùng như TỪ ĐIỂN và để cân nhắc bối cảnh, không sao chép câu Anh nào vào thân kinh.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ: 0 cặp thân kệ. `mama dakkhiṇamādisi` ở `2.2` trùng `pv13` sau
  khi chuẩn hoá dấu câu và nháy kép, nhưng pv13 chưa có bản Việt nên tôi đặt mới; lát sau dịch
  pv13 thì phải tra lại.

  CHỐT LƯỢC. `dakkhiṇam` và `apacitiṁ` là hai mặt của một việc: chú giải nói người làm khách
  dâng thức ăn cho cá tức là dâng cho mình (cúng dường), và vì nhớ đến sự cúng dường ấy nên mới
  lập được sự lễ bái. Tôi dịch theo đúng phân biệt đó: 2.2 sự cúng dường, 2.4 sự lễ bái. Cả
  hai từ đều đã có tiền lệ trong tầng. `māsā` là đơn vị tiền rất nhỏ; chú giải đọc là māsakā
  một hạt đậu, nên tôi dịch là bảy hạt tiền chứ không gộp thành số lớn. `sattadevā` ở `3.2`
  là các chư thiên, dịch đúng. `avañcayī` → gian lận, `sāpateyyaṁ` → cướp mất phần của.

  TÊN BÀI. `Macchuddānajātaka` → Kinh Chuỗi Cá, theo chú giải: chuỗi cá là một dãy cá buộc
  lại với nhau và con cá ấy là cả dãy.

