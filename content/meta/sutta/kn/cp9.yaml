notes: |-
  **Nguồn.** Pāli root từ snapshot bilara đã ghim, `kn/cp/cp9_root-pli-ms.json`, 239 khoá (không khoá nào ngoài tập Pāli, đúng thứ tự Pāli). Bản Anh tham khảo là Bhikkhu Sujato cùng commit, **có thật** trong tầng đã ghim: 238/239 khoá có chữ; khoá duy nhất rỗng là `:59.1` (colophon hạnh). `kn` không có tầng Việt hiện hành (`vietnamese-current` chỉ có Pháp Cú), nên không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  **Coverage English — nói rõ giới hạn.** Cổng coverage đo trên khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): khoá dài nhất của bài là 28 ký tự nên **mẫu số của cổng = 0**, cổng không đo được gì và không sinh entry ở `reference-gaps.yaml`. Đo thô thay thế: Sujato phủ **238/239 = 0,996** mọi khoá và **238/238 = 1,00** trên mọi khoá không phải colophon (khoá `:0.1`–`:0.4` là tiêu đề, có bản Anh). Tầng `english-project` không có tệp cho bài này. Phần kệ nội dung được đối chiếu Anh độc lập đầy đủ; tuy vậy Sujato đọc khác Pāli ở một số chỗ (xem bất định bên dưới) nên `triangulation` chỉ 9,1 chứ không để ở mức cao nhất, và không có tham khảo Việt truyền thống nào.

  **Pāli trùng nguyên văn: 28 khoá** có Pāli giống hệt khoá của bài khác đã dịch, tổng **105 cặp** đã dò, trong đó bản Việt của ta **trùng 84 cặp, khác 21 cặp**. Dùng lại nguyên văn (21 khoá): `0.1` (`Hạnh Tạng`, 33/34 cặp; ngoại lệ `cp34:0.1` viết `Cariyāpiṭaka`), `0.2` (`Phẩm Akitti`, 9/9), `16.2`, `17.1`–`17.2`, `19.2`–`19.3`, `20.1`–`20.4` (cùng cụm với `cp3:2.2`, `3.1`–`3.2`, `4.2`–`4.3`, `5.1`–`5.4`), `28.3` (`Một mình, không có người thứ hai,` theo `tha-ap23:2.3`), `36.2` và `37.2` (`đáng kinh ngạc, rợn da gà;`, 7/9 cặp), `43.2` (theo `tha-ap110:1.2`), `52.2`, `52.3` (theo `cp21:5.3`), `52.4` (6/6 cặp `chỉ vì một mục đích duy nhất là giác ngộ.`), `53.3` (`Mà vì Nhất Thiết Chủng Trí là điều quý báu nhất đối với ta,`, 7/9 cặp; ngoại lệ `cp5:3.3` ngôi `tôi`, `mil6.3.1:23.3` viết `trí toàn tri`), `54.3` (theo `cp21:4.3`), `56.2` (theo `bv6:16.2`). Gần nguyên văn: `26.4` (`khi ấy ta đã rời khỏi thành.`, đổi ngôi `tôi` của `tha-ap340:2.4` thành `ta` như cả bài), `16.1` (`Kaliṅga` có dấu — `bv29:11.4` và `cnd16:9.3` viết có dấu, còn `cp3:2.1` viết `Kalinga`). Ngoài ra `52.1`, `53.1`, `53.2`, `53.4` khớp `mil6.3.1:23.1`–`23.4` và `mil5.1.4:10.1` về chữ (Pāli các khoá đó mở đầu bằng dấu nháy nên không vào phép trùng nguyên văn). **Cố ý khác tiền lệ (5 khoá, 9 cặp):** `6.2` (`tuṭṭhahaṭṭhā pamoditā` dịch `bà vui mừng, hớn hở, hoan hỷ;`, khác `tha-ap434:5.2` `đã đứng lên, đầy hân hoan`, vì Pāli là hai phân từ về niềm vui, không có động từ đứng); `16.4` (`dhaññaṁ maṅgalasammataṁ` dịch `con voi may mắn, được xem là điềm lành.`, khác `cp3:2.4` `được coi là lành và lành đẽo` vì câu đó không rõ nghĩa, còn `dhañña` là tính từ `may mắn`); `17.3` (không có `ta` — Pāli `Dadāhi pavaraṁ nāgaṁ` không có tân ngữ gián tiếp, khác `cp3:3.3` vốn thêm `ta`); `26.3` (`Mahādānaṁ daditvāna` dịch `Sau khi làm xong cuộc đại thí,`, khác 5 cặp `tha-ap`/`thi-ap` dịch `dâng đại thí` vì ở đó cúng dường Phật, ở đây là bố thí của chính nhân vật); `57.2` (`mahāmegho pavassatha` dịch `đám mây lớn đã đổ mưa;` thay `một cơn mây lớn rơi xuống` của `tha-ap56:2.2`, vì Pāli là động từ `mưa`, và `57.1` đã có `vassiṁsu`); 2 cặp khác chỉ ở chính tả/ngôi (`16.1`, `26.4`); 10 cặp còn lại là khoá khác nghĩa hoặc khác ngôi/ngữ cảnh nên bản Việt khác là có chủ ý: `0.1` (`cp34:0.1`), `28.3` (`mil7.5.9:3.3`, `thag10.2:5.1`), `36.2`/`37.2` (`tha-ap113:6.2`, `tha-ap125:4.2`), `52.3` (`mil5.1.4:10.3` viết `khi xả bỏ, ta không bận tâm`), `53.3` (`cp5:3.3`, `mil6.3.1:23.3`). Trong chính bài có **6 nhóm** Pāli trùng nhau (`14.2`=`23.2`, `17.4`≈`21.2`, `36.2`=`37.2`, `41.3`=`42.3`, sáu khoá điệp `Tadāpi pathavī kampi,` và bảy khoá điệp `sineruvanavaṭaṁsakā.` — tổng cộng 21 khoá), **0 nhóm** bản Việt khác nhau (trừ khác dấu câu cuối khoá).

  **Dấu lược và ngoặc.** Pāli bài này không có khoá nào chứa `…`, nên Việt không có `…` hay `(…)`. Nháy kép `“…”`: mở ở `1.1`, đóng ở `58.4` (`pakampathā”ti`). Nháy đơn `‘…’`: `2.3`–`2.4`; `3.3`–`3.6`; mở `4.3` đóng `5.4`; `13.1`–`13.4`; `17.1`–`17.4`; `22.4` (cả câu nằm trong một khoá); `29.1`–`29.4`; `32.4` (cả câu nằm trong một khoá). Mọi khoá khớp Pāli về số lượng từng loại nháy (239/239). Pāli không đặt nháy ở `18.x`–`19.x`, `25.x`, `37.x`, `41.x` nên Việt không thêm (Sujato thêm nháy ở một số chỗ đó).

  **Thuật ngữ đã đo.** `vara` → `ân huệ` (21 khoá của tầng dùng `ân huệ` cho `vara`, gồm `ja440:13.6` `này Sakka, đó là ân huệ tôi cầu xin`). `devindo` → `chúa chư thiên` (19/37 khoá; `chúa tể chư thiên` 5, `vua chư thiên` 2, `vua trời` 3 — đa số rõ ràng là `chúa chư thiên`). `yakkha` → `dạ-xoa` (113/131). `khattiya` → `Sát-đế-lợi` (152/231, `khattiya` giữ nguyên 26, `Sát-lỵ` 6). `paṇṇasālā` → `chòi lá` (10/12). `mahesī` → `chánh hậu` (2/9 khoá, `ja514:29.1`, `ja524:20.4`; `hoàng hậu` 1). `mahiddhika` → `đại thần thông` (12/60; `cp8:4.2` cùng dùng). `Vessa` giữ nguyên `Vessa` như `dn3:1.14.4`, `dn27:5.2`. `Uposatha` → `ngày trai giới` (31 khoá `trai giới` / 13 `Bố-tát`, theo `cp10`). `hirottappa` → `hổ thẹn và ghê sợ` (theo `iti42:2.3`). `sabbaññutā` → `Nhất Thiết Chủng Trí` (14/74 toàn tầng nhưng 7/8 trong nhóm `cp` cùng cụm câu). `pathavī` → `đất` (41/43 khoá; `đại địa` 3). `dāsiṁ dāsaṁ` → `tớ gái, tớ trai` (theo `tha-ap430:22.1`, `tha-ap503:23.1`). `Dānapāramī 9` → `Bố Thí Ba-la-mật Thứ Chín` theo khuôn `cp1`–`cp8`, `cp10`. Tên bài: `Hạnh Của Vessantara` theo `cp1` (`Hạnh Của Akitti`, `Akitticariya`) vì Pāli `Vessantaracariya` không có `rāja`, khác `cp8` (`Sivirājacariya` → `Hạnh Của Vua Sivi`).

  **Số Pāli (tính tay, đều dễ thấy, không có số bất định).** `dasa vare` = 10 ân huệ; `dasa māse` = 10 tháng; `aṭṭhavassiko` = tám tuổi (`aṭṭha` 8); `pannarase` = ngày thứ mười lăm (`pañca` 5 + `dasa` 10 = 15); `saṭṭhirājasahassāni` = `saṭṭhi` 60 × `sahassa` 1000 = **60.000** vị vua (`sáu mươi ngàn`; không dùng thang lớn nào khác nên không có cạm bẫy `ngàn` nhân cả số tích lũy); `caturo janā` = bốn người; `catuvāhiṁ` = bốn ngựa (`catu` 4); `tayo jane` = ba người (Vessantara và hai con, theo cú pháp `poseti sā tayo jane`); `ekaṁ varaṁ` = một ân huệ (`23.4`, `24.2`); `ubho` = cả hai (hai con); `satta ratanāni` = bảy báu; `sattakkhattuṁ` = bảy lần; `navamaṁ` = thứ chín. Cụm `Tiṁsakappasahassa` không có trong bài.

  **Bất định đã phân xử, ghi ở đây chứ không thêm vào thân kinh.** (1) `6.3` `Mamaṁ abbhantaraṁ katvā`: nghĩa đen `đặt ta vào bên trong`; chỉ dịch sát, không thêm `trong số những ân huệ` hay `thụ thai`; Sujato đọc `Having conceived me` (có thể là cách hiểu theo chú giải rằng một ân huệ là được sinh ra người con này), nhưng root Pāli không nói rõ nên không chọn. (2) `14.2`/`23.2` `akampitamasaṇṭhitaṁ`: `akampita` = không lay chuyển; `asaṇṭhita` hiếm (`iti51:3.2` dịch `asaṇṭhitā` là `không an trú`), nên dịch `không xao động` theo Sujato (`undisturbed and steadfast`); độ chắc về sắc thái thấp. (3) `14.4` và 6 khoá điệp `sineruvanavaṭaṁsakā`: `vaṭaṁsakā` có vẻ là dạng nữ số ít, hợp với `pathavī` nên hiểu là vòng hoa/trang sức **của đất** (núi Sineru và các rừng); Sujato tách thành `and Mount Sineru, wreathed in forests` (Sineru cùng rung chuyển). Hai cách hiểu cùng nghĩa kể chuyện nhưng khác ngữ pháp. (4) `15.3` `Paccayaṁ nāgamāruyha`: hiểu `Paccaya` là tên con voi (theo Sujato); Pāli root cũng có thể đọc `paccaya` là danh từ chung nhưng cách đó không có nghĩa ở đây. (5) `25.3`–`25.4` `Dānenimaṁ nīharanti, puna dānaṁ dadātayaṁ`: chủ ngữ là ngôi ba (`imaṁ`, `ayaṁ`), nên dịch là lời kêu của đám đông nghe thấy, giữ ngôi ba; Sujato đổi thành ngôi nhất (`they drove me out … I just gave again`). (6) `39.2` `tadā vasanti mātule`: dịch sát `ở chỗ người cậu` (`mātula` = cậu bên mẹ); Sujato viết `Mātula` như tên nơi chốn. Không phân xử được; không ảnh hưởng nghĩa kể chuyện. (7) `32.4`/`33.4` `vaṅkantapabbato`: hiểu cùng là núi `Vaṅka` ở `22.4`, `31.4`, `40.4` (`-nta-` là âm nối hoặc biến thể); Sujato cũng cùng nghĩa (`Crooked Mountain`). (8) `45.2` `asuñño homi assame`: dịch `luôn có mặt ở am thất` (`asuñña` = không trống); Sujato đọc `not idle` — một cách hiểu khác, độ chắc thấp. (9) `55.1` `Hirottappena garunā`: `garu` = nặng, trọng; dịch `sâu nặng`, không thêm `kính trọng` vì Pāli không nói. (10) `30.1`–`30.4`: hai so sánh `padumaṁ puṇḍarīkaṁva` và `suvaṇṇabimbaṁva` đều ở cách đối cách (accusative) nên chỉ hai đứa trẻ; Việt giữ trật tự và không nói rõ so sánh gắn với người bế hay đứa trẻ. (11) `10.3`/`11.3` `vessavīthi`: giữ `Vessa` (tầng dùng `Vessa` ở dn3, dn27) để giữ lời giải tên `Vessantara`, không dịch thành `thương nhân`/`nông dân` (Sujato: `peasant`; chú giải thường hiểu thương gia). (12) `13.3` `Dadeyyaṁ kāyaṁ sāvetvā`: `sāvetvā` dịch `sau khi đã tuyên bố`; chủ thể tuyên bố là Vessantara (Sujato: `I announced`). (13) `29.1` `Kaṇhaṁ` là dạng ngắn của `Kaṇhājinā` (dùng ở `30.2`, `44.2`, `46.4`).

  **Cổng kỹ thuật.** Agent dịch không được chạy lệnh npm, nên `npm run validate`, `npm test`, `npm run check` và `npm run build` là việc của coordinator; `technical_integrity` đặt 9,6 và **không** tuyên bố cổng kỹ thuật đã pass. Tự kiểm: JSON hợp lệ, đủ 239/239 khoá theo Pāli đúng thứ tự, không khoá thừa, NFC toàn bộ, không khoá rỗng, nháy khớp Pāli từng khoá (239/239), không Pāli lọt ngoài tên riêng. final_score là trung bình số học thô của đúng 10 tiêu chí.
