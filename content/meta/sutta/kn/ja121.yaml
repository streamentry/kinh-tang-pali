notes: |-
  Đã đọc hết Pāli qua v4/p4.txt. Tại commit đã ghim không có tệp Anh Sujato cho bài này (0/9 khoá) và tầng Việt hiện hành chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu — bản dịch đứng hoàn toàn trên Pāli root. Mọi segment Pāli đều dưới 40 ký tự nên không có segment nội dung theo ngưỡng coverage.
  Tiền lệ (đếm trong tầng Việt dự án): khung tiêu đề như ja1 (0.1 giữ Jātaka, 0.2 Bộ Một Bài Kinh, colophon Kinh ... thứ nhất không phẩy); sarikkha → ngang mình theo ngang bằng (34); seṭṭha → hơn mình; nihīna → thấp kém (222); byasana → hoạn nạn (9); uttamattha → lợi ích tối thượng (2).
  0 tiền lệ, đặt mới, ghi lý do: Kusanāḷi → lau kusa (lau sậy 18, cỏ kusa đã có tiền lệ; Sujato ở bài anh em ja126 gọi phẩm này là The Reed-stalk Chapter); Kusanāḷivagga → Phẩm Lau Kusa; kareyyum ete → Những người bạn ấy sẽ mang lại (danh từ bạn hàm ẩn, ete là chủ thể số nhiều).
  Bất định đã ghi, không giấu: 1.4 rucāyan đọc là được quý mến (gốc ruc, làm vui lòng) nhưng hình thái ở đây chưa chắc chắn nên ambiguity hạ điểm; không thêm chú thích vào thân kinh.
  Triangulation 7.5 vì chỉ có Pāli root, không có bản Anh hay bản Việt nào để đối chiếu.
