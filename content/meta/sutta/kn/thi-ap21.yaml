notes: |-
  Dịch trực tiếp từ Pāli root, đủ 221/221 khoá, thứ tự khoá như Pāli; commit đã ghim không có bản Anh cho toàn bộ `thi-ap` (xem blocking_errors). Bản Việt nguyên bài của Bhikkhu Indacanda ở mục Tra cứu toàn văn (không phân đoạn, không phải tầng store, giấy phép NOASSERTION) chỉ được đọc để kiểm nghĩa ở những chỗ khó, không sao chép; mọi câu Việt đều viết lại từ Pāli. Bài chỉ có một lượt đọc đối kháng cặp Pāli với Việt do chính người dịch làm, chưa có review độc lập.
  Tiền lệ: thi-ap20 (cùng công thức Padumuttara, vua Kikī, bảy công chúa), thi-ap22, thi-ap23, thi-ap24, thi-ap26 (cùng Phẩm Kuṇḍalakesī, cùng công thức), thi-ap1 (chuỗi cõi trời Dạ-ma đến Tha Hóa Tự Tại) và các bài tha-ap có chung công thức. Pāli trùng nguyên văn với các bài `*-ap` đã dịch (cả hai cây làm việc): 117/221 khoá; trong đó 110 khoá dùng đúng một dạng bản Việt đã có, 7 khoá khác có chủ ý: 3.4, 10.1, 10.2, 42.1 chỉ đổi ngôi tôi hoặc con thành ta theo phạm vi gần nhất; 29.2 đổi ta thành thiếp vì là lời người vợ nói với chồng; 43.1 thêm ta vì Pāli có `ahaṁ` (`suṇitvāhaṁ`) và đặt đầu câu như thi-ap22:29.1; 51.4 `buddhaseṭṭhassa sāsane` dịch trong lời dạy của Đức Phật tối thượng, vì tiền lệ duy nhất (2 khoá, tha-ap254) thêm bậc điện tôn mà Pāli không có.
  Số cặp Pāli trùng trong chính bài: 8 nhóm (9.2=21.2, 9.3=21.3, 9.4=21.4, 11.4=12.4, 28.3=29.3, 31.2=32.2, 31.3=32.3, 34.1=35.1); bản Việt giống nhau ở 7 nhóm, khác có chủ ý ở 28.3 (ta, lời kẻ cướp) và 29.3 (thiếp, lời người vợ). 31.1 và 32.1 không trùng vì chỉ 31.1 mở nháy đơn.
  Đại từ ngôi thứ nhất: lời kể dùng ta, theo phạm vi gần nhất: thi-ap22 ta 41, tôi 1, con 5; thi-ap23 ta 44, tôi 1, con 4; thi-ap24 ta 32, tôi 1, con 6; thi-ap26 ta 24, tôi 1, con 4 (đếm từ, gồm cả lời trực tiếp); thi-ap20 con 65 và thi-ap29 tôi 13 là hai bài lệch trong cùng nhóm. Ngôi số nhiều `no`, `mayaṁ` ở 17.1, 17.2 dịch chúng ta. Lời nói trực tiếp của người vợ với chồng ở 27 đến 30 dùng thiếp (tiền lệ: 5 khoá ở 2 bài thi-ap, thi-ap6 và thi-ap33, đều là lời phụ nữ nói trực tiếp) và gọi chồng là chàng (0 tiền lệ chàng làm đại từ xưng hô trong thi-ap và tha-ap, chỉ có chàng làm danh từ như chàng thanh niên), nên cách gọi chàng là lựa chọn riêng của bài, người biên tập có thể phán. Kẻ cướp xưng ta, gọi người vợ là người đẹp (`kalyāṇī`).
  `:0.3` Pāli là `1 Kuṇḍalakesātherīapadāna` bắt đầu bằng số nên giữ số thứ tự theo hình thức `1. `; đo toàn nhóm thi-ap (cả hai cây): 15 tệp có Pāli bắt đầu bằng số thì 9 tệp giữ số và 6 tệp bỏ, 17 tệp Pāli không số, 0 tệp thêm số ở chỗ Pāli không có. translationTitle bằng đúng `:0.3`; `:56.1` kết bằng thứ nhất (Pāli `paṭhamaṁ`). Hình thức `Tuyên Ngợ` ở `:0.3` và `:56.1`: nhóm thi-ap (cả hai cây) đo 30 tệp Tuyên Ngợ, 1 tệp Tuyên Ngôn, 0 tệp Ký Sự (cùng Phẩm Kuṇḍalakesī: 4 Tuyên Ngợ ở thi-ap22, 23, 24, 26 và 1 Tuyên Ngôn ở thi-ap29); giữ `Tuyên Ngợ` theo phạm vi gần nhất. Chữ này có dấu hiệu là lỗi chính tả của tầng, người biên tập nên phán một lượt cho cả cuốn; tôi không tự đổi riêng bài này. `:0.2` `Kuṇḍalakesīvagga` dịch Phẩm Kuṇḍalakesī theo thi-ap22, 23, 24, 26 (7 khoá trùng Pāli đều dùng đúng dạng này). Tên người giữ Pāli (Padumuttara, Haṁsavatī, Kikī, Bārāṇasī, Giribbaja, Sattuka, Bhikkhudāyī và các tên trong danh sách bảy công chúa).
  Công thức lời kết `Itthaṁ sudaṁ … abhāsitthāti` dịch nhóm đã nói những bài kệ này (số nhiều, khớp `imā gāthāyo`): đo 31 khoá nhóm số nhiều so với 0 khoá nhóm số ít, 1 khoá dạng khác, trên 32 bài thi-ap đã có.
  Số Pāli: `Ito satasahassamhi` (1.3) = sata 100 × sahassa 1000 = một trăm ngàn kiếp, quá khứ; `Satasahassito kappe` (7.1) cùng cấu tạo = một trăm ngàn kiếp, thì tương lai (`bhavissati`, `hessati`) nên dịch sau một trăm ngàn kiếp nữa, khớp thi-ap20:9.1; `catutthā` (16.1) = thứ tư; `Vīsavassasahassāni` (17.3) = vīsa 20 × sahassa 1000 = hai mươi ngàn năm (thang lớn nhân cả số đã tích lũy: 20 × 1000 = 20.000); `satta dhītaro` (18.4) = bảy người con gái; danh sách 19.1 đến 19.4 đủ 7 tên (Samaṇī, Samaṇaguttā, Bhikkhunī, Bhikkhudāyikā, Dhammā, Sudhammā, Saṅghadāyikā), danh sách 20.1 đến 20.4 đủ 7 tên (Khemā, Uppalavaṇṇā, Paṭācārā, chính ta, Kisāgotamī, Dhammadinnā, Visākhā); `sattamī` (19.4, 20.4) = thứ bảy; `sahassena` (23.3) = bằng một ngàn (Pāli không nêu đơn vị, không thêm đồng tiền); `tāvatiṁsa` (9.4, 21.4) là tên cõi trời Ba mươi ba (tầng đã dịch Ba mươi ba ở mọi khoá trùng Pāli; không phải số `tiṁsa` đứng riêng, và cụm `Tiṁsakappasahassa` không có trong bài này); `parittaṁ toyaṁ` (44.4) = một ít nước; `tisso vijjā` (53.3) = ba minh; `Paṭisambhidā catasso` (54.1) = bốn; `aṭṭhime` (54.2) = tám; `Chaḷabhiññā` (54.3) = sáu; `paṭhamaṁ` (56.1) = thứ nhất.
  Ghi nhận bất định, không thêm vào thân kinh: 25.2 `balimajjhāsayo diso` — `balimajjhāsayo` là hapax trong toàn Pāli root (0 chỗ khác), không phân tích được `bali`; dịch kẻ thù mang ác ý theo ngữ cảnh 25.3 đến 25.4 (đưa đến vực để giết) và theo bản Việt nguyên bài ở mục Tra cứu toàn văn (ý định gây tội); `diso` đọc là kẻ thù. 28.1 `Oropayassu` — dạng sai khiến của `oropeti`, Pāli không nêu tân ngữ; tiền lệ duy nhất trong tầng là `Kese oropayanto me` (cạo tóc cho tôi), nên đọc là gỡ bỏ; dịch hãy gỡ xuống đi, không chọn giữa gỡ đồ trang sức xuống và xuống khỏi vách, và không thêm tân ngữ. 27.3 `bhaddante` đọc là `bhaddaṁ te` nên dịch chúc chàng được tốt lành. 33.3 `Migaṁ uṇṇā yathā evaṁ` — hình ảnh so sánh con nai và sợi len không rõ nghĩa (0 tiền lệ trong tầng), dịch sát chữ, không giải thích. 33.2 `nikaṭṭhe` dịch khi ở gần. 4.4 `subhaṁ` đọc là tính từ (tốt đẹp) đứng cạnh `bhikkhuniṁ`, không đọc là tên Subhā; 4.3 `Khippābhiññānamagganti` dịch là bậc tối thắng trong những vị có thắng trí nhanh chóng (`ti` bỏ, không có nháy trong Pāli; tiền lệ khippābhiñña: 3 khoá, thắng trí nhanh chóng). 24.3 `visaṭṭhā` dịch thân tín, 24.4 `dayitā hitā` dịch yêu mến, một lòng mong điều tốt cho y; 0 tiền lệ, `hitā` có thể chỉ là tính từ phụ không nêu đối tượng. 37.3 `Pabbajitvāna` — chủ ngữ của tuyệt đối phân từ không nêu, dịch sau khi xuất gia với người nhận ngầm là ta, chủ ngữ của `ācikkhiṁsu` là họ (các người mặc y trắng). 38.4 đến 39.2 chó ngoạm bàn tay người đã bị chặt, đánh rơi gần ta rồi bỏ đi: bản Việt nối ba khoá thành một câu, `chinnaṁ` đọc là bổ nghĩa cho `karaṁ`. 39.3 `Disvā nimittamalabhiṁ` dịch sau khi thấy, ta đã có được dấu hiệu (`alabhiṁ` đọc là đã có được, không đọc là đã nhặt lấy); 39.4 `hatthaṁ taṁ puḷavākulaṁ` đọc là tân ngữ của `disvā`. 41.1 `pucchissaṁ` có thể là quá khứ (aorist) hoặc tương lai; chọn quá khứ vì 41.3 `Te mamādāya gacchiṁsu` nối tiếp là sự việc đã xảy ra. 43.4 `pabbajjaṁ upasampadaṁ` không có động từ trong khoá, thêm ta đã xin theo 44.1 `Āyācito`. 45.2 `ñatvā saudayabbayaṁ` dịch sau khi biết có sinh và diệt, Pāli không nêu tân ngữ (nước ở 44.4 là nguồn ngữ cảnh). 20.2 `paṭācārā ahaṁ tadā` — ahaṁ là chính người kể trong danh sách bảy tên, dịch và ta khi ấy. 11.4, 12.4 `mahesittamakārayiṁ` là dạng sai khiến (cho lập làm hoàng hậu) nhưng tầng dùng đã giữ ngôi hoàng hậu (10 khoá tôi, 4 khoá con, 1 khoá ta) nên giữ theo tiền lệ. 26.2 `sattukaṁ` đọc là tên kẻ cướp (Sattuka); `sattu` ở 35.3 là kẻ thù (chơi chữ). 25.3 `Corappapātaṁ` dịch Vực Kẻ Trộm (0 tiền lệ), 36.3 `setavatthānaṁ` dịch người mặc y trắng (0 tiền lệ), 37.1 `saṇḍāsa` dịch cái nhíp (0 tiền lệ). 34.1, 35.1 `uppatitaṁ atthaṁ` dịch sự việc đã nảy sinh (0 tiền lệ; `attha` ở đây là việc cần xử lý, không dịch là lợi ích); 32.4 `atthavicintikā` dịch suy xét điều lợi ích.
  Dấu câu: nháy kép mở ở 1.1 và đóng ở 54.4 (lời tự thuật của Kuṇḍalakesā); nháy đơn mở ở 6.2 và đóng ở 8.4 (lời thọ ký của Đức Padumuttara, không có dấu nháy ở 6.3 đến 8.3), mở ở 27.1 và đóng ở 27.4, mở ở 28.1 và đóng ở 28.4, mở ở 29.1 và đóng ở 30.4, mở ở 31.1 và đóng ở 32.4, mở ở 40.3 và đóng ở 40.4, mở ở 44.2 và đóng ngay trong khoá; đúng như Pāli, khớp từng khoá (221 khoá, mẫu số 221, 0 khoá lệch cả nháy đơn lẫn nháy kép). Dấu `ti` (`iti`) bỏ ở 4.3, 8.3, 16.2, 27.4, 42.3, 42.4 và 44.2 theo phe BỎ của quy ước tầng; không đo lại tỉ lệ phe BỎ trong bài này. Pāli không có `…pe…` hay `(…)` nào nên bản Việt cũng không (0/221).
  Tự kiểm: tập khoá Việt bằng tập khoá Pāli (221/221, cùng thứ tự); NFC, 0 khoá rỗng, 0 khoảng trắng thừa; 0 chữ số lọt vào thân kinh; 0 chữ Pāli lọt sang thân kinh ngoài tên riêng. `content/meta/reference-gaps.yaml` chưa có entry cho thi-ap21 (đã có thi-ap2, thi-ap26, thi-ap29); mẫu số coverage chỉ là 1 khoá. technical_integrity 9.6 vì lát này không chạy gate (brief cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
