notes: |-

  **Tầng Anh có mặt nhưng thiếu đúng một khoá.** 8/9 khoá có tiếng Anh Sujato tại commit đã ghim. Khoá thiếu là dòng kết *… X thero ….* (`:1.5`), vốn là dạng lược của công thức quy kết *Itthaṁ sudaṁ … gāthaṁ abhāsitthāti*. Tôi **không** mở rộng dòng kết: BRIEF_VI3 §10.1 nói thẳng *Pāli có dấu lược thì bản Việt giữ nguyên, không bao giờ mở rộng* — mở rộng là thêm chữ KHÔNG ĐÁNH DẤU, và đã có tiền lệ sai thật (ba ngọn lửa `rāgagginā…` bị nhân sang `sn35.29:1.15`). Tiền lệ có sẵn trên đĩa làm đúng như vậy và đã `published`: `thag1.42` là ngoại lệ ngược lại, tôi **không** theo. Số dấu lược của mọi khoá `:1.5` bằng Pāli (2 = 2). Không đối chiếu được tầng Việt hiện hành như đã nói ở trên.
  **Đặt kinh theo thứ tự khoá của lát này** (`0.1` = Theragāthā + số · `0.2` = Ekakanipāta · `0.3` = vagga · `0.4` = tên bài kệ) — cùng thứ tự với `thag1.42`, `thag1.107`, bài đã `published`. `Ekakanipāta` → *Bộ Một Bài Kinh* (159 lần trong tầng kn; chỉ `thag1.1:0.2` viết *Tập Một*). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>* (25 lần, so với 4 lần *Bài Kệ…*). `Theragāthā 1.N` giữ **số** như `thag1.42:0.1`. ở `:1.5` Pāli dùng dạng chủ cách (*Cittako*, *Suppiyo*, *Suyāmano*…); bản Việt dùng dạng gốc để thống nhất với tên bài kệ, đúng cách `thag1.113` (`Vanavaccho` → *Vanavaccha*), `thag1.34` (`Posiyo` → *Posiya*), `thag1.46` (`Samiddhitthero` → *Samiddhi*) đã làm.

  **Tên riêng giữ nguyên dạng Pāli** và đều xác minh được trong Pāli đã ghim (không phải đặt mới): Ramaṇīyavihārin, Añjanavaniya, Vimalakoṇḍañña, Suyāmana, Cittaka, Suppiya, Sīha, Mettaji (giữ âm, dạng gốc). `lọt_pāli` trong `_hvi.py` chỉ quét khoá Pāli ≥ 40 ký tự mà mọi khoá của Theragāthā đều ngắn hơn, nên tên có dấu ở đây không bị chặn; tôi vẫn tra lại từng tên.
  **`:1.1` LÀ NGUYÊN VĂN TRÙNG — dùng lại, không dịch lần hai.** `“Yathāpi bhaddo ājañño,` giống **hệt** `thag1.16:1.1`, và bản dịch sẵn có là `“Như con ngựa thuần chủng tốt,`. Tôi chép nguyên văn đó. Đây không nằm trong `TIEN_LE_PHAI.md` — tôi tự dò bằng cách quét Pāli và bản Việt của toàn tầng, và đây là cặp chỉ thứ hai tôi bắt được ngoài danh sách đó (cặp kia là `thag1.55:1.3`/`thag1.66:1.5` và `thag1.94:1.2`/`dn32`).

  **Thuật ngữ, đếm được.** `ājañña` → *ngựa thuần chủng* (tiền lệ chính xác `thag1.16:1.1`, `snp3.6` *bậc tuấn mã*, `snp2.7` *ngựa thuần chủng*). `dassanā-sampanna` → *đầy đủ phần thấy biết* (tiền lệ `dhp209-220` *Vị đầy đủ giới và kiến*, `an10.3` *viên mãn sự thấy biết như thật*). `sammāsambuddha` → *bậc Chánh Đẳng Giác* — 298 tiền lệ, và `cnd1`, `pv1`, `ja1`, `thig1.1` đều viết *bậc Chánh Đẳng Giác* khi gặp `sammāsambuddha`. `khalati` → *vấp lún đi*; `patitiṭṭhati` → *đứng vững*.

  **Một điểm trừ tôi nói rõ:** ở `:1.5` Pāli là `Ramaṇīyavihāritthero` (dạng ghép), nên tôi dùng dạng gốc *Ramaṇīyavihārin* cho thống nhất với `:0.4`; riêng bài này tên dài, nên đọc *Trưởng lão Ramaṇīyavihārin* hơi nặng — nhưng đổi thành *Ramaṇīyavihāri* thì lệch tiêu đề.**Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm — ở lát này chỉ 0/155 khoá Pāli đủ 40 ký tự, nên chốt tự kiểm 0% và assertion còn lại không tự chạy; phần tôi tự kiểm: 9/n khoá có mặt và không thừa khoá, đúng segment ID, mọi chuỗi NFC, không khoá rỗng, không khoá nội dung nào trùng nguyên văn Pāli, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài và không bao giờ âm, không còn `(…)`, không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (lát này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Theragāthā 1.N Aṅguttara Nikāya 11 không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.
