notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Adhimutta trong phẩm Dvādasamavagga.

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1). Đo trên đĩa: 10 bản mở
  rộng, 5 bản giữ lược (thag2.35, thag6.2, thig1.7, thig1.8, thig1.9). Tôi theo §10.1 — xem
  `thag1.112.yaml`. Cả hai cách đều giữ **2 dấu lược** như Pāli.

  **Thứ tự khoá tiêu đề: tôi theo PĀLI** (`0.3` = tên phẩm, `0.4` = tên bài kệ). **12 bản thag đã
  publish đặt ngược**; 4 bản đặt đúng. Tôi theo Pāli và không sửa 12 bản ngoài lát.

  **Không đối chiếu được tầng Việt hiện hành** (bilara tại commit đã ghim chỉ có Pháp Cú). Sujato
  có 8/9 khoá, trống đúng dòng kết lược; mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments
  = 0`, `ratio = 1`, không rơi ngưỡng 80%.

  **Thuật ngữ, đếm được.** `Kāyaduṭṭhulla` → *thô trọng* (20 bản trong tầng; mn127:16.7 *sự thô
  trọng của thân*, mn128:21.3 *Sự thô trọng*) — tôi thêm *nặng nề* cho `garu` (nặng) để không bỏ mất
  chữ thứ hai của Pāli. `hiyyamāna` → *tàn dần* (Pāli `vayo` ở an3.47:1.3 được dịch *sự diệt*).
  `jīvite` → *đời sống*. `sukhagiddha` → *ham luyến sự sung sước*. `samaṇasādhutā` → *an lành*;
  `kuto` → *làm sao* (tiền lự ở mn97:2.12 *làm sao mà…*).

  **Bất định đã ghi.** `kāya` ở đây là *thân* (thân xác) chứ không phải *đời sống*; vế
  `Sarīrasukhagiddhassa` là sở hữu cách mô tả người nghe, nên tôi để *lại* ở đầu vế như Pāli đứng.
  Sujato đọc `Kāyaduṭṭhullagaruno` là *Your body is uncomfortably heavy* — tôi giữ cả hai vế của
  Pāli (*thô trọng* cho `duṭṭhulla`, *nặng nề* cho `garu`).

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2 ở dòng kết); ngoặc kép cân; không
  chữ ngoài Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này cấm) →
  `technical_integrity` = **9.6**.

  **Danh xưng giữ nguyên dạng Pāli** (Adhimutta).
