notes: |-
  TẦNG THAM KHẢO ĐÃ ĐO, KHÔNG ĐOÁN. 14 bài của lát w10/w8, toàn bộ là Jātaka ngắn của
  pli/ms. Đếm trực tiếp trên đĩa: `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/`
  có 83 tệp, chỉ trong đó có `ja20` và `ja30`; 12 bài còn lại không có tệp. Tầng Việt
  hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên
  không có bản Hòa thượng Thích Minh Châu để đối chiếu cho bất kỳ bài nào trong lát —
  đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  `triangulation` vì thế đặng ở mức trần.

  CHỐT KIỂM KHÔNG ĐỦ — ĐÃ TỰ KIỂM MỌI KHOÁ. `kiểm()` trong `_hvi.py` chỉ quét khoá Pāli
  ≥ 40 ký tự. Đo trên 14 bài này: **đúng 1 khoá** đạt ngưỡng đó (`ja20:4.4`, 40 ký tự);
  khoá dài nhất còn lại là 37 ký tự (`ja185:2.5`), ngắn nhất trong lá là 7. Nghĩa là chốt
  gần như không kiểm được gì cho 13/14 bài, đúng như cảnh báo. Tôi viết chỉ kiểm riêng quét
  **mọi** khoá: đủ khoá / không khoá thừa, NFC, cân dấu lược theo `lược()`, không còn
  `(…)` đứng một mình, không trùng nguyên văn Pāli (trừ `0.1` `Jātaka`), không Pāli lọt,
  và nháy kép cân trên cả bài. Kết quả: 210 khoá, 0 lỗi.

  PĀLI TRÙNG NGUYÊN VĂN — ĐÃ DÙNG LẠI, KHÔNG DỊCH LẠI. Tự dựng chỉ mục Pāli↔Việt của
  toàn tầng (110.685 cặp, đọc thẳng từ đĩa, cả 5 collection) rồi so 210 khoá của lát:
  tìm được **600 cặp trùng** theo so khớp nguyên văn, trong đó **6 khoá thuộc công thức
  kệ** (bỏ khoá `0.1/0.2/0.3` và bỏ `Tassuddānaṁ` vì nó lặp ở ~300 bài khác):
  - `ja185:0.4` + `ja185:3.1` — Pāli trùng y hệt `ja65:0.4` / `ja65:2.1`, đã dùng lại
    nguyên văn `5. Kinh Bất Mãn` / `Kinh Bất Mãn thứ năm.` theo `TIEN_LE_PHAI.md`.
  - `ja222:2.3` / `2.4` / `2.5` — Pāli trùng `sn11.10:5.3` / `5.4` / `5.1` (Karmavācaniya).
    Đã dùng lại nguyên văn đã có, **kể cả chữ “gặt”** của `sn11.10` (nghĩa là gặt quả,
    không phải “gặp”). Riêng `ja222:2.4` tôi giữ dấu `;` theo Pāli thay vì `.` của
    `sn11.10:5.4`: hai chuỗi Pāli đó giống hệt kể cả dấu chấm, nhưng file cũ đặt `.` giữa
    khiến bốn vế trong một khoảng ngắt thành hai câu. Đây là khác biệt **một ký tự có
    chủ ý**, ghi đây để người điều phối phán xử có sửa ngược `sn11.10` hay không.
  - `ja226:2.3` — Pāli trùng `snp3.7:26.3`, dùng lại `đã khuất phục mọi kẻ thù,`.
  - `ja222:2.6` (`tādisaṁ harate phalan”ti.`) so khớp nguyên văn **không** khớp vì Pāli
    đóng `”ti.` thay vì `;`, nhưng là cùng công thức với `sn11.10:5.2` nên vẫn lấy
    nguyên văn `gặt trái loại ấy`. Tổng công thức dùng lại: 7 khoá.
  - `ja20:3.1` / `ja30:3.1` (`Tassuddānaṁ`) → `Tóm lược:`.

  MỘT LƯỢT SỬA CHÉP MÌNH CÓ ĐO ĐƯỢC. Lần đếm tiền lệ đầu tiên tôi chỉ quét collection
  `kn`, và nó báo `Tassuddānaṁ` → *Tóm tắt phẩm* 22×. Đếm lại trên **toàn tầng** thì
  ngược lại: *Tóm lược:* 236×, *Tóm lược* 21×, *Tóm tắt phẩm* 19×. Tôi đã đổi hai khoá
  `3.1` sang `Tóm lược:` theo số đếm thật. Bài học chung cho các lát sau: **đếm tiền lệ phải
  quét cả 5 collection**, không chỉ `kn` — và chỉ kiểm so khớp nguyên văn mới bắt được
  lỗi tôi đã viết `gặp` (gặp phải) thay cho `gặt` (gặt quả) ở `ja222:2.3–2.4`.

  BỐN TÊN ĐANG TREO TRONG TẦNG — ĐI THEO ĐA SỐ, GHI LẠI ĐỂ GỘP.
  - `Dukanipāta`: dùng **Tập Kẻ Đau Đớn**. Đếm toàn tầng ở khoá `:0.2`: *Tập Kẻ Đau Đớn*
    45× vs *Bộ Hai Bài Kinh* 26× vs *Phẩm Hai Pháp* 23× vs *Tập Hai* 3× → đa số là
    *Tập Kẻ Đau Đớn*, khớp với chỉ đạo của lát. 12 bài Dukanipāta trong lát này dùng
    cách đó. (Bộ đếm còn lại 23 *Phẩm Hai Pháp* + 26 *Bộ Hai Bài Kinh* là xung đột
    **chưa** ai gộp — tôi không sửa bài ngoài lát.)
  - `Ekakanipāta`: dùng **Bộ Một Bài Kinh** (259×, đa số tuyệt đối) cho `ja20` và `ja30`.
  - `Kulāvakavagga`, `Atthakāmavagga`, `Channā me kuṭikā sukhā nivātā`: lát này **không
    chạm** tới, nên không có gì để ghi.
  - `Ruhakavagga` (ngoài danh sách bốn tên, nhưng cũng đang rác): `ja199` lấy **Phẩm Thằn
    Lằn** theo đa số 6/8 trong chính phẩm đó (`ja192/193/195/196/197/198`), dù `ja191`
    là *Phẩm Dây Cung* và `ja194` là *Phẩm Dây Leo*. Ba cách — xin người điều phối gộp.

  THUẬT NGỮ ĐẶT MỚI (0 tiền lệ trong tầng, kèm lý do — không ghi vào thân kinh):
  - `Kāsāvavagga` → **Phẩm Kāsāva** (`ja222/226/227`). 0 tiền lệ. `Kāsāva` không có một
    từ Việt thông dụng nào giữ được cả hai nghĩa (cỏ kāsa và ô nhiễm), nên giữ chữ Pāli
    theo đúng kiểu tầng đã làm cho các tên phẩm Dukanipāta khó dịch (`Phẩm Bīraṇathambha`
    2×, `Phẩm Kulāvaka`, `Phẩm Atthakāma`, `Phẩm Parosata`).
  - `Upāhanavagga` → **Phẩm Upāhana** (`ja235/238`). 0 tiền lệ, cùng lý do.
  - `migī` → *rắn cái* (chỉ xuất hiện trong `ja157:1.2`; `nāga` ở `ja227:1.3` dịch *rắn*
    theo nghĩa rắn thường, **không** phải *rồng* của `aṇḍajā nāgā` — giữ đúng đa nghĩa).
  - `sippikasambuka` → *cụm bọt*; `macchagumba` → *cụm cá*; `āvila` → *đục*; `appasanne` /
    `vippasanne` → *chưa lọc hết* / *đã lọc hết*.
  - `kaṭukaphala` → *hạt đắng*; `pucimanda` → *xoài thối*; `Asātasannivāsa` → *chỗ cư trú
    thối rữa*; `kaṭukapphala` giữ hạt “hạt” của `phala` vì đó là mãnh quả.
  - `kosiya` → *tên tắm* (`ja226` thân kệ) nhưng **giữ “Kosiya”** ở tiêu đề (`0.4`, `3.1`).
    Đây là đa nghĩa phải giữ: trong tầng `Kosiya` là tên riêng (đại thần, `dn21`, `mn37`,
    `ud3.7`), còn ở `ja226` là tên tắm. Không chuẩn hoá một nghĩa.
  - `dhaṅka` → *quạ* (chọn nghĩa chính trong từ điển; còn nghĩa *bói cá* thì không dùng ở đây).
  - `veṇikā` → *thoi buộc chỉ*; `aṅkitakaṇṇako` → *kẻ chỉ còn một mắt*; `gahapati` /
    `gāmapati` → *gia trưởng* (dùng nhất quán hai chỗ trong `ja199` và `ja219`).
  - `hirañña` / `suvaṇña` → *vàng* / *vàng* (giữ cả hai từ đồng nghĩa như Pāli).
  - `ariyadhamma` → *bạch pháp*; `sukha` (tính từ) → *hạnh phúc*; `dummedhāna` → *ngu dốt*;
    `jaraggava` → *gầy cơ*; `dīghāyu` → *sống thọ*; `bhusa` → *rơm rác*.
  - `guṇa` → giữ chữ (tên bài `ja157`); `Dāṭhi`, `Giridatta`, `Dadhivāhana`, `Gahapati`,
    `Gaṅgeyya`, `Garahita`, `Cūḷanandiyā`, `Kosiya`, `Gūthapāṇa`, `Vacchanakha`,
    `Ekapada`, `Munika` → giữ tên riêng, theo tiền lệ `Kūṭavāṇija`, `Vālodaka`, `Kaṇha`.
  - **Xung đột đa nghĩa phát hiện, không tự sửa:** `naḷa` ở `ja20` tôi dịch *nọc* theo lựa
    chọn đã ghi sẵn trong scorecard cũ của bài, nhưng `snp3.1:3.0` (`Naḷavaggo paṭhamaṁ.`)
    trong tầng đang dịch `naḷa` là *cây lau*. Tôi **không** sửa `ja20` theo hướng đó và
    **không** sửa `snp3.1`, vì cả hai đều ngoài phạm vi lát; xin người điều phối gộp.

  CÔNG THỨC ĐÃ THEO TIỀN LỆ (đếm trên đĩa):
  - `<Tên>jātakaṁ <thứ tự>.` → `Kinh <Tên> thứ <N>.` — 145/179 cặp ở JA không có dấu
    phẩy trước “thứ”, nên 14 bài này không dùng dấu phẩy (nhóm 34× có dấu phẩy là thiểu số).
  - `<Vagga>vaggo <thứ tự>.` → `Phẩm <Tên> thứ <N>.` — dạng `Phẩm Tâm thứ ba.`,
    `Phẩm Rắn Độc thứ nhất.` có sẵn; chỉ có 2 khoá trong lát (`ja20:2.2`, `ja30:2.2`).
  - `0.1` `Jātaka` → giữ `Jātaka` (hàng trăm bài JA đã giữ nguyên như vậy).
  - Thứ tự số: `paṭhamaṁ`…`dasamaṁ` → *thứ nhất…thứ mười*, khớp các bài lân cận.

  BẤT ĐỊNH CHƯA PHÂN XỬ (đã ghi ở đây, **không** đưa vào thân kinh):
  - `ja184:1.4` và `2.6` `tassevānuvidhiyyati`: `tassa eva` = “chỉ cái ấy”, nhưng Pāli ở
    bài kệ ngắn này **không nói cái ấy là gì**, và cả hai khoá dùng đúng một công thức.
    Tôi giữ đại từ “đó” và không bịa mục tiêu.
  - `ja184:2.2` `sikharākārakappito`: `sikharākāra` là “có đỉnh”, dịch *đủ tài đệ nhất*; đây
    là cách đọc bảo thủ, không khẳng định người ấy đã chứng ngộ.
  - `ja186:2.4` `nisevare`: đọc là `nis-varati` (rơi xuống). Chi tiết này ảnh hưởng hình
    ảnh nhưng không đổi nghĩa chung của khoảng; tôi giữ hình ảnh, không thêm giải thích.
  - `ja157:1.4` `jātaṁ saraṇato bhayaṁ`: đọc là “sinh ra làm nơi nương tựa và làm nỗi sợ
    hãi”; có thể đọc khác là “sinh ra để nương tựa và để kinh sợ”, cùng nghĩa.
  - `ja20:1.3` `pissāma` là ngôi số nhiều nhưng `maṁ` ở `1.4` là số ít. Tôi dịch cả hai
    về số ít cho nhất quán và ghi ra đây; không sửa được gì trong Pāli.
  - `ja219:2.3` `Lambatthano veṇikato`: chỉ giữ hình ảnh “thoi dài buộc chỉ”, không khẳng
    định thêm chi tiết về người ấy.
  - `ja226:1.6` `dhaṅka` có thể là *quạ* hoặc *bói cá*; chọn *quạ*.

  BA `DUKANIPĀTA` VAGGA CÒN CHIA RÁC — ĐÃ ĐI THEO ĐA SỐ TỪNG PHẨM:
  - `Asadisavagga` (`ja184/185/186`) → **Phẩm Asadi**, theo `ja187:0.3` đã có sẵn trong
    tầng; 5 bài anh em cùng phẩm đang dùng 5 cách khác nhau (Vô Đối Đẳng, Bất Bại, Bất
    Thành Tựu, Vua Không Ghen, Bất Bại). Cần gộp.
  - `Ruhakavagga` (`ja199`) → **Phẩm Thằn Lằn**, 6/8. Cần gộp.
  - `Daḷhavagga` (`ja157`) → **Phẩm Tàn Tật**, 4/5 (`ja159` lệch *Phẩm Người Yêu*).
  - `Nataṁdaḷhavagga` (`ja205`) → **Phẩm Bó Lúa**, 6/6 nhất quán.
  - `Bīraṇathambhavagga` (`ja219`) → **Phẩm Bīraṇathambha**, 2/2 nhất quán.
  - `Sīlavagga` (`ja20`) → **Phẩm Giới**, 9/9 nhất quán.
  - `Kuruṅgavagga` (`ja30`) → **Phẩm Nai Bốn Sừng**, 9/9 nhất quán.

  TECHNICAL GATE: CHƯA CHẠY, ĐỂ NGƯỜI ĐIỀU PHỐI. Lát này bị cấm chạy
  `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tôi **không** thể
  tuyên bố technical gate pass và đã hạ `technical_integrity` xuống 9,6. Bốn lệnh đó
  xin người điều phối chạy sau khi gộp. Việc tôi tự kiểm được là chỉ kiểm mọi khoá ở trên
  (210 khoá, 0 lỗi), không thay thế được bốn lệnh đó.

  `ja20` LÀ BÀI DUY NHẤT ĐÃ CÓ FILE TỪ LÁT TRƯỚC, VÀ ĐÃ ĐƯỢC LÀM TRỌN VẸN. File cũ chỉ
  có 1 khoá (`4.4`) và scorecard ghi blocker “thiếu khoá”. Tôi đã dịch đủ 15 khoá, giữ
  nguyên văn cũ của `4.4` và chỉ thêm dấu chấm câu cho khớp các dòng kết khác.
  Lưu ý thuần hình thức: `save_vi` giữ thứ tự khoá cũ, nên trong tệp `ja20` khoá `4.4` đứng
  trước `0.1`; 13 tệp kia sạch. Tôi không sắp lại tệp vì `_ghi` cảnh báo việc sắp khoá đã
  làm hỏng 612 tệp đã merge.

  Bốn vế của khoảng 2 là **nguyên văn dự án đã có** ở `sn11.10:5.1–5.4` (Karmavācaniya),
  lấy lại đúng cả chữ “gặt”. Đây là khoảng tôi tự soát kỹ nhất: bản nháp đầu viết “gặp” ở
  hai khoá và bị chỉ kiểm bắt bằng so khớp nguyên văn.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja222:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  Giải quyết draft 2026-10-12: kiểm toán độc lập, đọc đối kháng 15 khoá với Pāli. Lỗi nghĩa
  thật: **4/15 khoá** (`1.1`–`1.4`); thêm 2 khoá lỗi chính tả tên riêng (`0.4`, `3.1`); tổng 6/15
  khoá được sửa. Chi tiết:
  - `1.1`–`1.2` `Idaṁ tadācariyavaco, pārāsariyo yadabravi` — bản cũ *“Người chở đò ngày xưa từng
    nói để vượt sang bờ bên kia* là **sai**: `Pārāsariya` là tên riêng người nói (cùng gốc với
    `Pārāsara`; xem `thag16.2`, `thag16.10` giữ tên `Pārāpariya`), không phải “người chở đò”; `pāra`
    (bờ bên kia) bị đọc nhầm vào đây. `ācariyavaco` = “lời của vị thầy”, `yadabravi` = “mà (ngài) đã
    nói”. Đã sửa: *“Đây là lời của vị thầy, / lời mà Pārāsariya đã nói:*.
  - `1.3` `Māsu tvaṁ akari pāpaṁ` — bản cũ *Ngươi chưa từng làm điều ác nào* sai ngữ pháp và đảo
    nghĩa: `mā` + aorist `akari` là **lời cấm** (*chớ làm*), không phải lời kể quá khứ phủ định;
    `su` chỉ nhấn. Đã sửa: *Ngươi chớ làm điều ác,*. (Cùng lỗi đọc ở `ja353:3.3`, trong đó `Ngươi chớ
    từng làm điều ác` cũng chưa đúng; lỗi ngoài tệp của bài này, chỉ báo.)
  - `1.4` `yaṁ tvaṁ pacchā kataṁ tape` — bản cũ *mà sau này ngươi sẽ phải chịu* bỏ mất `kataṁ`
    (đã làm) và `tape` (`tapati` = bị thiêu đốt, dày vò; ở đây là hối hận). Đã sửa: *điều mà về sau, khi
    đã làm rồi, ngươi sẽ phải hối hận.* `hối hận`/`hối tiếc` theo tiền lệ `ja546:13.4`, `ja71:1.4`,
    `dhp67:2`, `sn2.22:3.2` (đối ứng `pacchā … anutappati`; `sn2.8:4.2` dùng *dày vò về sau*).
  - `0.4`, `3.1` — `Cūḷanandiyā` → `Cūḷanandiya`: Pāli là `Cūḷanandiya` + `jātaka` (gốc `-a`, nối
    âm), không có `-ā`; đối chiếu tiền lệ `ja385` (`Nandiyamigarāja` → Nandiya). `translationTitle`
    đã đổi theo.
  - Các khoá `2.1`–`2.6` đối chiếu từng chữ, giữ nguyên: `Yāni karoti puriso, tāni attani passati`
    = *Người làm điều gì thì tự thấy điều ấy trong mình*; bốn vế sau là nguyên văn `sn11.10:5.1–5.4`
    (**4/4 cặp Pāli trùng, 0 cặp Việt khác**), kể cả `gặt`.
