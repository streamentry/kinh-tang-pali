notes: |-
  **Phạm vi: đủ 1566/1566 khoá của mnd16, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải `snp4.16` (Sāriputtasutta, Kinh Xá-lợi-phất), bài cuối của phẩm Aṭṭhakavagga, cấu trúc như `mnd13`, `mnd14`, `mnd15`: dẫn từng đoạn kệ in đậm (21 đoạn, trùng 21 khổ kệ của `snp4.16`: `2`, `14`, `54`, `76`, `82`, `88`, `120`, `140`, `149`, `158`, `169`, `174`, `181`, `188`, `194`, `204`, `214`, `231`, `252`, `263`, `273`), giải từng cụm, rồi nhắc lại cả đoạn kệ trong nháy kép (21 lần: `13`, `53`, `75`, `81`, `87`, `119`, `139`, `148`, `157`, `168`, `173`, `180`, `187`, `193`, `203`, `213`, `230`, `251`, `262`, `272`, `289`). Lời dẫn trước mỗi lần nhắc lại có 21 dòng: 8 dòng *Vì thế, trưởng lão Sāriputta đã nói—* (tám khổ đầu là lời hỏi của Tôn giả Sāriputta: `12`, `52`, `74`, `80`, `86`, `118`, `138`, `147`) và 13 dòng *Vì thế, Đức Thế Tôn đã nói—* (mười ba khổ sau là lời đáp: `156`, `167`, `172`, `179`, `186`, `192`, `202`, `212`, `229`, `250`, `261`, `271`, `288`). Các đoạn trích đáng chú ý: năm loại mắt và trí của Đức Thế Tôn (`23`–`34`, dùng lại gần như nguyên khuôn `cnd19:4`–`19`), năm cách là vị như vậy (`58`–`65`, theo `mnd5:52`–`57`), ví dụ lãnh vực của người khác và lãnh vực của mình (`127`–`132`, nguồn `sn47.7`), giới và hạnh khổ hạnh (`133`–`136`, theo `mnd3:17`–`20`), các cách giải danh xưng *Bhagavā* (`151`, `287`; theo `mnd13:157`), bốn ranh giới (`160`–`164`), năm nỗi sợ và các hiểm nguy (`158`–`173`), mắt đảo quanh và chân lang thang (`232`–`242`), tầm và hối hận (`246`–`249`), lời nhắc nhở và giới hạn của lời nói (`253`–`260`), năm thứ bụi (`264`–`267`), tâm khéo giải thoát và kệ về thời (`276`–`285`), nhất tâm (`286`). Pāli có 307 khoá mang thẻ in đậm, bản Việt không mang thẻ. Dấu lược `…`: 198 khoá có dấu lược (53 khoá có `…pe…`, đều thành đúng một `…`, mỗi khoá một lần; 145 khoá chỉ có `…` trần; 15 khoá có nhiều hơn một dấu), tổng 380 dấu ở Pāli và 380 dấu ở bản Việt, từng khoá khớp số dấu; 181 khoá Pāli kết bằng `…` và 181 khoá Việt kết bằng `…`; 0 khoá có `(…)`; 0 khoá Pāli kết `….`. Nháy: Pāli có 113 khoá chứa “ và 113 khoá chứa ”, 0 khoá chứa ‘ hay ’, 6 khoá chứa ngoặc đơn (`2.2`, `13.2`, `149.2`, `157.2`, `273.5`, `289.5`; hai khoá *(Iti bhagavā.)* ở `273.5`, `289.5` dịch *(Đức Thế Tôn nói như vậy.)* theo `mnd13:139.5`); bản Việt khớp Pāli từng khoá (0/1566 lệch cả hai loại nháy kép và ngoặc đơn).

  **Tên bài.** `0.1` → *Đại Tập Kể Lược*, `0.2` → *Kể Lược Phẩm Tám Kệ*, theo `mnd13`, `mnd14`, `mnd15`; `0.3` → *16. Kể Lược Kinh Xá-lợi-phất*, `1.1` → *Giờ đây, sẽ nói phần Kể Lược Kinh Xá-lợi-phất—*, `290.1` → *Kể Lược Kinh Xá-lợi-phất, thứ mười sáu*, `291.1` → *Trong Phẩm Tám Kệ, mười sáu bài kể lược kinh đã hoàn tất*, `292.1` → *Đại Tập Kể Lược đã khép lại*, cùng khuôn với `mnd13:0.3`, `mnd13:160.1`, `mnd15:207.1`. Tên kinh theo `snp4.16:0.2` (*Kinh Xá-lợi-phất*); tiêu đề Anh của Sujato cho phần chú giải này (tệp tên `mnd-name`) là *Exposition of the Discourse to Sāriputta*.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd16`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho `kn/mnd/mnd16` và tệp tên `mnd-name` (chỉ có tiêu đề các bài); không có tệp `mnd16_translation-en-sujato.json`. Lớp `english-project` không có `mnd16`; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự, bỏ khối `0.x`) là **584** khoá (651 nếu đếm cả thẻ in đậm trong độ dài); Sujato phủ 0/584, `english-project` 0/584, `vietnamese-current` 0/584. Ba tầng vắng hết ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`; không nâng điểm để né blocker, và entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.16` (*With Sāriputta*) có trong tầng đã ghim nhưng là bản của **bài khác** (bài kệ gốc), nên không tính là đối chiếu English của mnd16; nó chỉ được dùng để đọc cú pháp 21 khổ kệ (ví dụ `kaṇhassa pakkho` ở Sujato là *Māra’s ally*, khớp cách chú giải `185.2`–`185.3` giải *kaṇho* là Ma vương). Chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.16` và các đoạn chú giải trùng công thức ở `cnd5`, `cnd6`, `cnd8`, `cnd9`, `cnd17`, `cnd19`, `mnd1`, `mnd3`, `mnd5`, `mnd6`, `mnd7`, `mnd8`, `mnd11`, `mnd13`, `mnd14`, `mnd15`, cùng các bản kinh `mn33`, `mn51`, `mn91`, `dn1`, `dn2`, `sn3.2`, `sn3.11`, `sn47.7`, `iti88`, `ja331`, `ne5`.

  **Tiền lệ, đo chứ không đoán.** 481 khoá của mnd16 có Pāli trùng nguyên văn (bỏ thẻ in đậm, gộp khoảng trắng) với khoá đã dịch ở nơi khác trong tầng; 337 khoá dùng lại nguyên văn bản Việt đã có (nguồn dùng nhiều nhất theo số khoá: `mnd1` 99, `cnd19` 67, `mnd13` 56, `cnd5` 48, `mnd7` 43, `mnd6` 41, `mnd3` 36, `mnd11` 32; trong đó chỉ 15 khoá lấy nguyên văn từ `snp4.16`); 144 khoá khác có chủ ý, theo bốn nhóm. (1) 98 khoá là dòng kệ và các lần nhắc lại kệ trong 21 đoạn kệ (`2.5`, `14.2`, `53.2`, `54.1`, `54.3`, `75.2`, `75.3`, `76.1`–`76.3`, `81.2`, `81.3`, `82.1`, `82.2`, `82.4`, `87.2`, `88.2`–`88.4`, `119.2`, `119.3`, `120.1`–`120.4`, `139.2`, `139.3`, `140.1`–`140.3`, `148.2`, `148.3`, `149.4`, `149.5`, `157.1`, `157.4`, `158.1`–`158.3`, `168.2`, `168.3`, `169.1`, `169.3`, `169.4`, `173.3`, `174.1`–`174.3`, `180.2`, `180.3`, `181.1`–`181.4`, `187.2`, `187.3`, `188.1`–`188.4`, `193.2`, `193.3`, `194.1`–`194.4`, `203.2`, `203.3`, `204.3`, `204.4`, `213.3`, `214.1`, `214.3`, `214.4`, `230.3`, `231.1`–`231.3`, `251.2`, `251.3`, `252.1`–`252.4`, `262.2`, `262.3`, `263.1`–`263.4`, `272.2`, `272.3`, `273.1`–`273.4`, `289.2`, `289.3`): bản Việt của `snp4.16` dịch ngắn gọn hoặc dùng chữ khác với lời giải ngay trong bài này (ví dụ `abhisambhave` *phải vượt qua* so với *nên chế ngự*, `sīlabbata` *giới và nguyện* so với *giới luật và khổ hạnh*, `bheravā` *nỗi sợ* so với *điều đáng sợ*), nên mỗi dòng được dịch lại theo từng dòng Pāli và theo lời giải đi kèm, cùng chữ với phần chú giải của chính khoá đó. Hai khoá trong nhóm này chỉ khác viết hoa hoặc dấu câu (`76.2`, `81.2`). (2) 4 khoá tên riêng (`2.2`, `13.2`, `149.2`, `157.2`): giữ *Sāriputta* theo thân bài `mnd`/`cnd`, không dùng *Xá-lợi-phất* của `snp4.16` (xem mục Thuật ngữ). (3) 7 khoá chỉ khác viết hoa hoặc dấu câu so với nguồn: `43.2`, `127.8`, `254.3`, `255.1`, `255.3`, `258.3`, `265.2`. (4) 35 khoá còn lại khác chữ so với nguồn trùng Pāli: dòng kệ trích từ bài khác dịch lại cho khớp từng dòng Pāli (`47.1`, `114.2`, `114.3`, `211.2`, `85.3`, `117.3`); nguồn gộp hoặc lược chữ mà Pāli ở đây có đủ nên bổ sung cho đủ chữ (`127.4`, `127.5`, `127.12`, `132.4`, `132.5`, `132.11`, `121.7`, `121.8`, `151.21`, `208.6`, `248.4`, `249.4`, `249.5`, `191.11`, `191.12`); thống nhất thuật ngữ trong bài (`96.5`, `97.7` *chi phối* theo `mnd1:53.5`–`53.6`, không theo *áp đảo* của `sn35.151`; `189.4` *ngạo mạn*; `191.4`, `191.15` *ưa thích*; `184.26` *do mọi bứt rứt*; `142.7`, `160.5`, `175.8`; `155.1`, `155.5` cùng khuôn với `149.5`, `157.5`; `67.4`, `67.15` *Vị ấy nói như vầy—*; `212.1`). Trong chính bài có 76 nhóm Pāli trùng nguyên văn (168 khoá) và **chỉ 2 nhóm** mà Việt khác: `10.3` so với `11.3`, `11.6` (cùng Pāli *Evampi tusitā gaṇimāgato*, nhưng `10.3` đi sau `10.2` nói về cõi Tusita, còn `11.3` và `11.6` đi sau hai cách đọc *tusita* là chư thiên và là các vị A-la-hán, nên Việt theo ngữ cảnh), và `204.4` so với `212.1` (chỉ khác viết hoa: dòng kệ nối tiếp so với câu đứng riêng). Nhiều đoạn dài có song song trực tiếp nên được dịch bám sát bản Việt đã có để cùng một công thức không thành hai cách: năm loại mắt và trí Phật theo `cnd19:4`–`19`; năm cách là vị như vậy theo `mnd5:52`–`57`; hiểm nguy lộ rõ và ẩn giấu theo `mnd1:48`–`49`; bậc *ukkhittapaligho* (`61.5`) theo `mnd1:81`; cách trình bày giới, hạnh, quyết chí theo `mnd3:17`–`20`; các danh hiệu *Bhagavā* theo `mnd13:157` và `mnd7:16`; chín tầm theo `cnd17:38`, hối hận theo `cnd17:22`–`23`; năm thứ bụi theo `cnd17:3`; các tri túc về y, thức ăn, chỗ ở, thuốc theo `an4.28`; bảng những trò trình diễn theo `dn1`, `dn2`.

  **Thuật ngữ, kèm số đếm (khoá / tệp, tầng `mnd` và `cnd` đã dịch, trừ bài này).** `Sāriputta` giữ nguyên chữ Pāli ở thân bài: 18 khoá / 6 tệp, trong khi *Xá-lợi-phất* 0 / 0; riêng tên kinh (`0.3`, `1.1`, `290.1`) theo `snp4.16:0.2` là *Xá-lợi-phất*. `daṁsa` → *ruồi trâu* (10 / 6; *ruồi mòng* chỉ 1 / 1, ở `mnd7:57.1`). `parissaya` → *hiểm nguy* (56 / 2; *nguy hiểm* 12 / 8): giữ *hiểm nguy* vì lời giải `171.3` và `199.2` chia thành *pākaṭaparissaya* và *paṭicchannaparissaya* (hiểm nguy lộ rõ / ẩn giấu), như `mnd1:48`. `dhīra` → *bậc kiên định* (17 / 5, so với *bậc trí* 46 / 15): `159.2` giải *dhīra* là *paṇḍito paññavā …*, nên dịch *dhīra* thành *kiên định* và *paṇḍita* thành *có trí* để giữ hai chữ khác nhau. `kukkucca` → *hối hận* (53 / 4), `vippaṭisāra` → *sự hối tiếc* (33 / 4 cho *hối tiếc*), như `cnd17:22.5`. `khila` → *sự chai cứng* (`cetokhila` *tâm chai cứng*; 3 / 2). `adhisīla`, `adhicitta`, `adhipaññā` → *giới tăng thượng, tâm tăng thượng, tuệ tăng thượng* (54 / 9). `sekha` → *bậc hữu học* (12 / 7). `pariyanta` → *ranh giới* (13 / 3; toàn tầng 39 / 17). `āvila` → *vẩn đục* (13 / 6). `takkāsaya` → *tầm, nơi trú ẩn của tầm* (`āsaya` giải ở `246.5`–`246.6` là *nơi trú ẩn*, *avijjāsayo* …). `kaṇha` → *kẻ đen tối* ở `185.2` và *phe của kẻ đen tối* ở `185.3`, theo lời giải; không có tiền lệ nguyên văn trong `mnd`/`cnd`. `santuṭṭha` → *tri túc* (toàn tầng 124 / 56; *biết đủ* 131 / 61): theo cách `an4.28` dịch đoạn *itarītarena cīvarena* (*tri túc với bất cứ …*, 16 / 8). `ariyavaṁsa` → *tông tộc Thánh* (7 khoá, ở `an4.28`). `bhaddekaratta` → *Một Đêm Có Lành* (12 / 6 toàn tầng). `agocara`, `paravisaya` → *nơi không phải nơi lui tới*, *lãnh vực của người khác* (11 / 2), `sakapettikavisaya` → *lãnh vực của mình, nơi quen thuộc của cha ông* (14 / 3). `atimāna` → *ngạo mạn* (31 / 15, đối lập *quá mạn* 24 / 4; xem Bất định 2). `Bhagavā` → *lời xưng hô tôn kính* (`gāravādhivacana`, 42 / 21). `vessa`, `sudda` → *Phệ-sa*, *Thủ-đà* (28 / 13). `vedhati`, `pavedhati`, `sampavedhati` ở `170.4` → *run rẩy, run rẩy mạnh, run rẩy khắp người* (giữ một dãy thống nhất; `cnd18:9.7` dịch *vedhati* là *run rẩy*). `abhisambhoti` → *chế ngự*, `abhibhavati` → *lấn át*, `ajjhottharati` → *trùm lên*, `pariyādiyati` → *chiếm ngự*, `maddati` → *nghiền nát* (chuỗi năm động từ ở `171.2`, `199.9`, `200.3`, `201.2`, `270.2`, nhất quán trong bài). `pajahati vinodeti byantiṁ karoti anabhāvaṁ gameti` → *từ bỏ, xua tan, làm chấm dứt, làm cho không còn hiện hữu* (giữ nguyên chuỗi mnd/cnd).

  **Số Pāli tự tính.** `pañcannaṁ bhayānaṁ` (`158`–`159`) = 5, khớp năm mục *ruồi trâu, ruồi sà xuống, loài bò sát, sự xúc chạm của loài người, loài bốn chân* (`165`–`166`; lời giải đếm *ḍaṁsā*, *adhipātakā*, *sarīsapā*, *manussaphassā*, *catuppadā*). `cattāro pariyantā` (`160.9`–`160.10`) = 4, khớp bốn mục; `catūhi kāraṇehi sato` (`160.3`) = 4, khớp bốn niệm xứ `160.4`–`160.7`. `cattāro paridevanīye dhamme` (`201.2`) = 4, khớp hai tư tưởng về thức ăn và hai về chỗ ở (`207.2`). `cha cīvarāni` (`215.3`) = 6, khớp sáu loại vải `215.4`. `nava vitakkā` (`246.2`) = 9, khớp chín tầm `246.3`. `tisso sikkhā` (`208.9`, `269.7`) = 3. `pañca rajāni` (`264.4`) = 5, khớp năm bụi. `bāttiṁsāya tiracchānakathāya` (`121.9`) = 32. `aṭṭhasataṁ` ở `55.32` = 108, như `mnd5:48.6`. `dvāsaṭṭhi` (`56.3`) = 62. `vīsativatthukā` = 20, `dasavatthukā` = 10 (`56.2`). `dasannaṁ tathāgatabalānaṁ` = 10, `catunnaṁ vesārajjānaṁ` = 4, `catunnaṁ paṭisambhidānaṁ` = 4, `channaṁ abhiññānaṁ` = 6, `chabbuddhadhammānaṁ` = 6 (`151.21`, `287.2`, `20.1`). Chuỗi bốn thiền, bốn vô lượng, bốn vô sắc; tám giải thoát, tám thắng xứ, chín sự chứng đạt tiếp nối; mười tưởng, mười biến xứ; bốn niệm xứ, bốn chánh cần, bốn thần túc, năm căn, năm lực, bảy giác chi, Thánh đạo tám chi (`151.15`–`151.20`, `287.2`) đọc theo số trong chính Pāli. Dãy thế giới ở `25.8`: một, hai, ba, bốn, năm, mười, hai mươi, ba mươi, bốn mươi, năm mươi, một trăm, rồi *cūḷanikā*, *majjhimikā*, ba nghìn, *mahāsahassī*, dịch như `cnd19:6.7`. `pañcahi cakkhūhi` (`23.1`) = 5. `tīṇi kuhanavatthūni` (`66.2`, `70.5`) = 3. `tayo antarāmalā` (`99.1`) = 3. `dve parissayā` (`171.3`, `199.2`) = 2. `dvīhi kāraṇehi` = *hai lý do* hoặc *hai nguyên nhân* (`176.2`, `176.4`, `216.2`, `243.2`, `248.1`). `dvinnaṁ samuggapaṭalānaṁ` (`28.9`) = hai. `satta sahadhammike` (`170.2`) = bảy hạng người cùng pháp: bài không liệt kê bảy hạng, nên Việt không thêm. Không gặp cụm số chưa phân xử.

  **Bất định (không đưa vào thân kinh).**
  1. `Sāriputta` giữ chữ Pāli ở thân bài theo toàn tầng `mnd`/`cnd` (18 / 6, không có *Xá-lợi-phất*), trong khi tên kinh và bản Việt của `snp4.16` viết *Xá-lợi-phất*; chưa có quy ước chung cho hai cách viết.
  2. `atimāna`: *ngạo mạn* theo `mnd10:68`, `mnd3:27.16`, `cnd5:56.20`; `mnd11:6.3` (cùng câu Pāli với `189.4`) và `mnd15:97.4` dịch *quá mạn*; `snp4.16:14.1` dịch cả `kodhātimāna` là *sân hận và ngã mạn*. Giữ *giận dữ và ngạo mạn* cho `188`–`190`, không phân xử cho cả tầng.
  3. `kaṇhassa pakkho` (`181`, `185`): *phe của kẻ đen tối*, theo lời giải đồng nhất *kaṇho* với Ma vương; `snp4.16:13.4` dịch *phe cánh của kẻ tối tăm*. Cả hai đọc *kaṇha* là Ma vương hoặc tối tăm chưa phân xử.
  4. `takkāsayaṁ` (`231.4`, `246`–`249`): *tầm, nơi trú ẩn của tầm* theo lời giải; Sujato ở `snp4.16` đọc *worrisome habits of thought*, nên có thể là một hợp từ khác; chưa phân xử.
  5. `okkhittacakkhu`, `khittacakkhu` (`232`–`239`): *mắt nhìn xuống / mắt đảo quanh*; `snp4.16:18.1` dịch *mắt nhìn xuống*, nhưng `khittacakkhu` không có tiền lệ trong tầng (0 / 0 cho *mắt đảo quanh*); chọn đối nghĩa trực tiếp.
  6. `aḍḍhayoga` (`152.4`, `206.2`, và các dòng tương ứng) giữ chữ Pāli *nhà aḍḍhayoga*, vì nghĩa chưa chắc (kiểu nhà mái một bên hay nhà nửa vòng); `mnd3:17` và `an3.16` cũng giữ nguyên.
  7. `235.2` danh sách trò trình diễn (*pāṇissara, vetāḷa, kumbhathūṇa, sobhanaka, caṇḍāla, vaṁsa, dhovana*): *vỗ tay, đánh chiêng, đánh trống, biểu diễn sắc đẹp, các màn diễn của người caṇḍāla, xiếc sào, lễ rửa xương* theo `dn1`, `dn2`; nghĩa từng chữ chưa chắc.
  8. `158`–`159`, `168`: *dhīro … na bhāye* dịch *bậc kiên định không nên sợ* và *sapariyantacārī* dịch *sống trong ranh giới* theo chính lời giải `160.9`–`160.10`; `snp4.16:10.1`–`10.2` dịch *Bậc trí, Tỳ-kheo chánh niệm sống nơi biên địa, chớ sợ năm nỗi sợ*, thứ tự dòng khác.
  9. `210`–`211` (hai khổ kệ trích *Magadhaṁ gatā …* và *Sādhu caritakaṁ … Etaṁ sāmaññaṁ akiñcanassā*): chỉ `210.2` có Pāli trùng ở `sn9.4:4.2`, các dòng còn lại không có bản Việt song song trong tầng; dịch từ Pāli, riêng `211.2` tham chiếu `thag1.36:1.2`.
  10. `236.2`: *na cakkhulolo … na dīghacārikaṁ … rūpadassanāya* dịch thành một câu phủ định dài *không … và không chuyên đi những chuyến đi dài …*; có thể đọc ngắt khác, chưa phân xử.
  11. `222`–`225`: *dakkho analaso sampajāno paṭissato* dịch *tinh thông, không biếng nhác, tỉnh giác, có niệm*: *tinh thông, không biếng nhác* theo `an4.28`, nhưng `an4.28` dịch *sampajāno* là *có tuệ minh sát*, còn bài này giữ *tỉnh giác* như toàn bộ `mnd`/`cnd`; *dakkha* còn có thể là *khéo léo*.
  12. `273`–`285`: kệ *Kāle paggaṇhati cittaṁ …* (`278`–`284`) không có Pāli trùng nguyên văn ở nơi khác trong tầng nên không có bản Việt song song; dịch từ Pāli, riêng `280.4` *kathaṁ dasseti yogino* dịch *vị ấy chỉ bày cho hành giả như thế nào*, chủ ngữ *vị ấy* (người nói kệ) là cách đọc, chưa chắc.
  13. Lỗi ngoài lát, báo chứ không sửa: `snp4.16:10.1`–`10.2` và `snp4.16:11.3`–`11.4` đảo thứ tự dòng so với Pāli (`Pañcannaṁ dhīro bhayānaṁ na bhāye / Bhikkhu sato sapariyantacārī`, và `Athāparāni abhisambhaveyya / Parissayāni kusalānuesī`); `snp4.16:7.3` *những giới và nguyện nào* trong khi chú giải `133`–`136` (và `mnd3:17`) giải *sīlabbata* là *giới và khổ hạnh*.

  **Kỹ thuật.** Bài chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` (lát này bị cấm chạy cổng); vì vậy `technical_integrity` đặt 9.6 và không tuyên bố technical gate đã qua. Khi chạy các lệnh đó và nếu có lỗi thì hạ điểm hoặc sửa. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (1566/1566, cùng thứ tự), không khoá rỗng, 0/1566 khoá Việt trùng nguyên văn Pāli, 0 khoá Việt còn chữ `pe`, dấu lược cân bằng Pāli từng khoá (380/380), nháy kép và ngoặc đơn khớp Pāli từng khoá, không nháy thẳng, không khoảng trắng thừa, NFC. Bài giữ `draft` với blocker nêu trên; việc áp dụng waiver `no-upstream-english` (nếu người biên tập muốn) làm riêng bằng lệnh của kho, không sửa tay.

  Sửa lan 2026-10-13: `mnd16:24.9` — *giống như sao osadhi* → *giống như sao mai* (`osadhitārakasamānaṁ`; `osadhitārakā` là sao mai / sao Mai ở rạng đông, không phải tên riêng *osadhi* — tầng dịch *sao mai* ở `cnd19:5.8` (Pāli y hệt), `mn79:15.3`, `mn80:8.3`, `sn2.29:10.1`, `iti27:5.1`, `mn77:23.30`; chữ *osadhi* để nguyên là Pāli lọt sang bản Việt). Cùng lỗi còn ở `mnd14:58.8` và `dn16:3.32.2` — ngoài lane, chưa sửa.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 83.3 và 152.4 — «nhà aḍḍhayoga» → «nhà một mái» (từ Pāli lọt sang bản Việt; `mnd14:134.5` và `ps1.3:61.8` cùng Pāli đã dịch «nhà một mái»); khoá 247.1 — «hối hận về tay/chân» → «sự cựa quậy ở tay/chân» và «nhận thức» → «tưởng» (khớp `mnd10:22.2`, `mnd14:130.2`, `cnd17:22.2`: `hatthakukkucca` là sự cựa quậy của tay chứ không phải «hối hận về tay», và `-saññitā` dịch «tưởng» ở cả hai bản trùng; giữ «được phép» cho `kappiya`); giữ nguyên khoá 127.4, 127.5, 132.5, 29.2, 29.4, 233.1, 126.1, 131.1, 235.1, 175.3, 67.3, 69.2, 70.4 vì bản hiện tại bám đúng Pāli, còn bản đa số chỉ khác văn phong hoặc bỏ sót/thêm nghĩa (127.4 bỏ `agocare`; 127.5 thêm «không phải lãnh vực của mình»; 175.3 đảo nghĩa `samohito`; 67.3 gán sai tân ngữ cho `atthiko`).

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 313 khoá chênh lệch lớn nhất (trên 1566 khoá) → khác nghĩa 12 nhóm: sửa 4 (khoá 258.4 · 149.2 và 157.2 · 136.9 cùng 69.21 và 206.2 · 70.1), giữ 6 (khoá 125.2, 162.3, 162.6 và 234.2 · 61.7–61.9 · 73.6 · 174.3, 177.1, 177.10 và 180.3 · 194.3, 194.4, 200.1, 201.1, 201.2, 263.4 và 270.1 · 30.7–30.8), bất định 2 (khoá 188.4, 191.1, 191.27, 191.29 và 193.4 · 211.3). Sửa (theo Pāli): (1) `258.4` «như chim tu hú non bị hại vì tiếng kêu» → «như chim tu hú non», vì Pāli chỉ có `kokilāyeva atrajo` (như con của chim tu hú); «bị hại vì tiếng kêu» lấy từ truyện kể của Jātaka (cùng câu ở `ja331:1.4`), không có trong lời Pāli của đoạn này, nên là thêm nghĩa ngoài văn bản; bản mù không có phần thêm đó. (2) `149.2`, `157.2` «(Đức Thế Tôn đáp lời Sāriputta,)» → «(Này Sāriputta, Đức Thế Tôn nói,)», vì `sāriputtāti bhagavā` là hô cách, mất hô cách trong bản cũ và «đáp lời» là chữ thêm; `151.1`, `151.24` của chính bài đã dịch «Này Sāriputta, Đức Thế Tôn nói», cùng khuôn `pe1:109.2`, `cnd15:17.2`, `cnd20:9.2`. (3) `136.9` cùng `69.21`, `206.2` «nhà aḍḍhayoga» → «nhà một mái»: cùng Pāli `aḍḍhayoga` đã dịch «nhà một mái» ở `83.3`, `152.4`, `mnd10:44.21`, `mnd14:134.5`, và một bài không được có hai cách dịch cho một từ; đây đính chính mục Bất định 6 ở trên (chữ Pāli không còn được giữ trong bài). (4) `70.1` `lapakalapako` «kẻ thường xuyên nói bóng gió» → «kẻ thường xuyên nịnh hót», vì `lapanāya` ở `215.6` dịch «nịnh hót», `mnd10:45.1` và `cnd23:216.1` cùng dịch «nịnh hót», còn «nói bóng gió» là nhãn của `sāmantajappana` (`66.3`, `70.4`), không dùng cho một từ khác. Giữ (bản mù sai hoặc chỉ khác diễn đạt): `125.2`, `162.3`, `234.2` `yatvādhikaraṇam enaṁ …` giữ «Nếu …; nhưng vị ấy không thực hành …» theo `mn33:7.3` và `Vì nếu … vì vậy …` ở `162.6` theo `dn2:64.3`, `mn94:18.2`; bản mù đọc `yatvādhikaraṇam` thành «do nguyên nhân nào», làm câu thuận ở `162.6` thành vô lý (ác pháp tràn vào dù đã phòng hộ tốt); `61.7`–`61.9` `apacinitvā` «làm giảm bớt» theo `sn22.79:14.1`, `mnd1:81.2`, `cnd8:106.6`; `73.6` `pañhāgamo` «sự đến của câu hỏi» theo `cnd7:11.5`, `cnd17:14.3` và lời giải `73.4` (`āgamanaṁ abhikkamanaṁ upasaṅkamanaṁ`), không phải «sự thông đạt»; `177.1`, `177.10` `anoko` «không tạo cơ hội» theo lời giải `177.6`, `177.8` (`okāsaṁ na karoti`), không phải «không chỗ trú»; `194.3`, `200.1`, `201.1`, `270.1` `sahetha` «thắng phục» vì lời giải `200.3`, `201.2`, `270.2` xếp `saheyya` cùng `abhibhaveyya, ajjhotthareyya, pariyādiyeyya, maddeyya` (chữ «chịu đựng» dành cho `adhivāsayeyya` ở `176.1`, `176.8`; `snp4.16:15.3` dịch «chịu đựng», khác tầng chú giải này); `30.7`–`30.8` `upakkhittakā … te bhagavato sampajjanti` «được thu nhận … trở thành người của Đức Thế Tôn» theo `ps3.1:50.3`. Ngoài các nhóm trên, phần còn lại chỉ khác diễn đạt (ví dụ `108.3` «do tự thân khởi lên» theo `sn3.2:3.3`, `mnd1:65.3`, `mnd14:87.3`, `cnd23:113.3`, bản mù đổi chỗ động từ nhưng cùng nghĩa). Bất định: `188.4`, `191.1`, `191.27`, `191.29`, `193.4` `addhā bhavanto abhisambhaveyya` → «thật vậy, nên chế ngự khi đang vượt hẳn», theo lời giải `191.28` đọc `bhavanto` như `abhisambhavanto`/`adhibhavanto`; bản mù đọc «người đang là như thế» và tự ghi không chắc; `snp4.16:14.4` dịch «chắc chắn người ấy sẽ vượt qua»; chưa phân xử. `211.3` `padakkhiṇaṁ kammaṁ` → «việc làm đáng tán thưởng» theo `thag1.36:1.3`; bản mù «hành động thuận chiều hữu nhiễu» (nghĩa đen của `padakkhiṇa`) và cũng ghi không chắc; chưa phân xử. Từ lượt review đối kháng toàn bài (ngoài 313 khoá), thêm vào bất định: `11.2`, `11.5` `āgato` số ít đi với `te` số nhiều, dịch «Họ … đã đến» (cả hai bản đồng ý, chủ ngữ chưa chắc); `123.2`, `128.2` `thullakumārī` «thiếu nữ phong quang» (cùng `an5.102:2.2`), nghĩa sát hơn có thể là thiếu nữ đã lớn, chưa phân xử; `70.1` `korajikakorajiko` «giả vờ» (`mnd10:45.1` «bày trò», `cnd23:216.1` để nguyên chữ Pāli); `127.4`, `132.4` «Māra» theo `sn47.6:3.2`, `sn47.7:3.2`, `dn26:1.15` trong khi `41.2`, `185.2` «Ma vương», chưa thống nhất; `69.25`, `136.13` `leṇa` «nơi trú ẩn» (cùng `mnd3:19.13`; `mnd10:44.25` «thạch thất», `cnd23:215.25` «động đá»). Lỗi ngoài lane, báo chứ không sửa: `ja331:1.4` cùng thêm «bị hại vì tiếng kêu»; `cnd21:13.3`, `cnd22:59.2`, `ps1.3:56.1` cùng `55.2` ở bài này dịch `sayambhū` «bậc Tự Tại»; `cnd23:215.21` `aḍḍhayoga` «nhà nửa mái» khác `mnd10:44.21` «nhà một mái»; `30.1` «cá voi nuốt cá voi nuốt» cho `timitimiṅgala` (cùng ở `mnd8:82.1`, `mnd14:64.1`, `cnd19:11.1`, `ps3.1:28.1`). Không có bản Anh hay bản Việt độc lập khác; chỉ có một lần dịch lại độc lập cùng họ công cụ, nên `triangulation` đặt 7.8 (trước đó 8.0; còn 2 nhóm chưa phân xử); blocker `noEnglishEditionUpstream` và waiver giữ nguyên, không đụng.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn 1566 khoá, đoạn song song cnd9:40.10, cnd22:38.2, cnd19:8.4, ps1.3:56.1, ja331:1, dhp304, mnd3:18, cnd23:307; không có bản nguyên bài độc lập, không có bản Anh): sửa 8 khoá. (1) `57.8` bỏ sót đơn vị nghĩa: Pāli có sáu chữ `asito anissito anallīno anupagato anajjhosito anadhimutto` nhưng Việt chỉ năm — thêm «không lệ thuộc» cho `asito` (đúng cách `57.2` dịch `asito`, và `cnd9:40.10`); đồng thời `diṭṭhasutamutaviññātabbe` đổi «được thấy, được nghe, được nhận thức, được nhận biết» → «nên thấy, nên nghe, nên cảm nhận, nên biết» theo toàn tầng (`cnd9:40.10`, `mnd10:110.18`, `cnd23:297.13`; `muta` là «cảm nhận», không phải «nhận thức», vốn trùng với `viññāta`). (2) `39.2` `paṭhamena vayasā` «đang ở thời đẹp nhất của đời người» → «ở giai đoạn đầu của đời người» (`paṭhama` là thứ nhất; theo `cnd22:38.2`, `dn4:6.9`, và `136.39` của chính bài dịch `purime vayokhandhe`; chữ «thời đẹp nhất» chép từ `mn100:9.5`, cũng là lỗi nhưng ngoài lô). (3) `21.3` `asantettha na dissanti` «cũng không thấy» → «cũng không được thấy» (`dissanti` là bị động; câu cũ đọc thành «kẻ ác không thấy»; cùng câu ở `dhp304:3` còn nguyên, ngoài lô). (4) `55.2` `sayambhū` «bậc Tự Tại» → «bậc Tự Hữu» (nghĩa đen «tự mình thành, tự hữu»; «Tự Tại» là `vasī`/`vasībhāva`, đã dùng ngay sau đó ở cùng khoá là «làm chủ»; theo `ps1.3:56.1`; còn «Tự Tại» ở `cnd18:2.2`, `cnd21:13.3`, `cnd21:32.2`, `cnd22:59.2`, `cnd22:83.1`, `cnd22:109.5`, `mil5.1.2:7.2`, nhiều bài `tha-ap`, `thi-ap`, `bv`; `cp2:2.2` «Tự Giác»; chưa thống nhất toàn tầng). (5) `135.3` `napi passaṁ nipātessaṁ` bỏ «nữa» (Pāli không có; theo `mnd3:18.3`). (6) `191.28` `abhibhaveyya` «vượt hẳn» → «lấn át», cùng chữ với `92.2`, `116.2`, `171.2`, `199.9` trong bài (lỗi nhất quán; chưa đụng bất định về `bhavanto` ở `188.4` v.v.). (7) `257.2` `muñceyya pamuñceyya` bỏ «thật rõ» (Pāli không có «rõ») → «nên thốt ra, nên phát ra». (8) `258.3` `nihato seti` «sẽ bị tiêu vong thảm hại» → «nằm đó, bị hạ gục» (`seti` là hiện tại, «thảm hại» là chữ thêm; cùng chữ ở `ja331:1.3`, ngoài lô). Giữ (khác bản đối chiếu hoặc khác diễn đạt nhưng Pāli ủng hộ): `73.2` «con cần có câu hỏi nên đã đến» (cùng `cnd7:11.1`, `cnd17:14.1`, `cnd18:11.1`; nghĩa `atthiko` chưa đẹp nhưng nhất quán); `77.3`, `89.6`, `175.5` «tai trong/tai ngoài» cho `sota-`/`kaṇṇa-` (nhất quán `an10.60:7.4`, `cnd5:14.2`, `cnd8:28.5`, `cnd22:107.45`, `mnd10:140.3`; Pāli chỉ có hai chữ «tai», phân «trong/ngoài» là quy ước tầng, bất định); `27.4` «lợi ích» cho cả chuỗi `attha` theo `cnd19:8.4`, `mnd8:79.5` (`ps3.1:25.5` đổi sang «ý nghĩa» từ `uttāno attho` trở đi, sát hơn; bất định); `176.7` `duruttānaṁ durāgatānaṁ vacanapathānaṁ` «lời nói thô ác, khó nghe» gộp hai chữ, theo `an4.114:9.2`, `an4.165:2.2`; `30.1` `timitimiṅgala` «cá voi nuốt cá voi nuốt» còn nguyên (lỗi chéo năm bài, chờ quyết định chung). Bất định thêm: `191.28` cách đọc `bhavanto` (xem mục Bất định cũ). Không có cụm `tare loke visattikaṁ`, `adurāgataṁ`, `oḷārikā`/`anusahagatā` ngoài phạm vi (`276.11`–`276.12` giữ như cũ).

  Lô G4 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): sửa 1 khoá nghĩa. timitimiṅgala (PED: cá khổng
  lồ, hình thức nhấn mạnh của timiṅgala = kẻ nuốt timi, tức loài ăn cá voi) trước đây bị dịch thành
  chuỗi vô nghĩa lặp từ cá voi nuốt cá voi nuốt; nay dịch cá khổng lồ nuốt cá voi, thống nhất ở mnd8,
  mnd14, mnd16, cnd19, ps3.1. Chuỗi timi timiṅgalo timirapiṅgalo ở an8.20/ud5.5 chưa chạm tới, để
  người biên tập quyết định. Bản này không có English độc lập nên triangulation giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: B1 — `41.2` (`visattikā` = “sự vướng mắc ở đời”; `tare` = “có thể vượt qua”); B2 — `55.2` (`sayambhū` = “bậc Tự Giác”); B3 — `46.2`, `93.4`, `121.11`, `150.7`, `151.20`, `249.8`, `287.2` (`iddhipāda` = “như ý túc”); B4 — `260.3` (`vipatti` = “thất bại”, cặp với “thành tựu”); B12 — 22 khoá (`120.3` … `139.3`) (`vata`/`sīlabbata` bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”); B18 — `30.1` (`kenīdha … vikappayeyya` = “lấy gì ở đời này mà phán đoán được vị ấy”; `timitimiṅgala` = “cá nuốt cá nuốt cá khổng lồ”).

  Nghiên cứu nguồn ngoài 2026-10-16: bản Việt song ngữ Pāli–Việt của Tỳ khưu Indacanda,
  Mahāniddesapāḷi - Đại Diễn Giải (Tam Tạng Song Ngữ Pāli–Việt, Sri Lanka 2018),
  https://tamtangpaliviet.net/TTPV/35_Nidd_I.pdf (Đại Diễn Giải, tập 35); đã tải toàn văn và đối chiếu
  phần tương ứng; nguồn độc lập với dự án, giấy phép không khai (NOASSERTION), chỉ dùng làm bằng chứng
  nghĩa, không chép. Đã đối chiếu: căn chỉnh theo đoạn 292 nhóm đoạn của bài với Indacanda (169 nhóm
  khớp từ vựng và không lệch phủ định hay số đếm, 35 nhóm trùng chữ với nhóm đã so ở bài khác, 88 nhóm
  bị cờ; nhóm bị cờ mới quét theo danh sách cờ, chưa đọc từng nhóm); đọc từng nhóm kệ trích (25 nhóm)
  cạnh Indacanda và Sujato; so 119 mục từ đầu đoạn với mục từ của Indacanda; kệ trích còn so với
  Sujato snp4.16 (213 khoá có Pāli trùng chữ với kho `snp`, 32 khoá có Việt trùng chữ, 181 khoá khác,
  đã xem mẫu: phần lớn do ngắt dòng, chấm câu hoặc do Niddesa tự đọc kệ khác Sujato). Phần lời giải
  Niddesa chỉ có Indacanda làm nguồn độc lập (Sujato không có bài này); phần kệ trích có thêm Sujato.
  Sửa: không có khoá nào. Bất định/ghi nhận: 165.x `adhipātakā` «ruồi sà xuống» theo lời giải
  165.4–165.6 (Indacanda «loài mòng… bay lên đáp xuống»), giữ.

  Nguồn thứ hai 2026-10-16: *Mahāniddesa-Aṭṭhakathā* (Saddhammappajotikā 1), chú giải Pāli, phần 16.
  Sāriputtasuttaniddesavaṇṇanā, bản CST Roman trên tipitaka.org,
  https://www.tipitaka.org/romn/cscd/s0515a.att16.xml; loại giải nghĩa (không phải bản dịch), độc lập
  với bản Việt Indacanda đã dùng; giấy phép không đọc được bằng máy (NOASSERTION), chỉ dùng làm bằng
  chứng nghĩa, không chép. Đã tách 746 mục lời giải (lemma in đậm và lời giải) và đọc hết; đối chiếu
  185/1566 khoá (khoá có chữ Pāli trùng lemma của một mục lời giải dài từ 7 chữ cái, đã đọc cặp
  Pāli–Việt–chú giải; chú giải chỉ giải từng chữ khó và giảng nghĩa từng khổ kệ, không phủ cả bài);
  KHỚP 180, LỆCH-THẬT 0 (không sửa khoá nào), NGUỒN-LỆCH 5: `114.1` Pāli ghim ghi *anavasesaṁ* («không
  sót»), chú giải đọc *anavasekaṃ* và giảng là không để đổ, không để tràn (`ja96:1.1`, cùng câu kệ, có
  Pāli *anavasekaṁ* và dịch «không để tràn»); Việt theo Pāli ghim, giữ, không dùng dị bản, ghi cho
  người biên tập; `3.3`, `16.1` *paṇḍukambalasilā*, chú giải «tảng đá giống tấm thảm đỏ», Việt «tảng
  đá phủ tấm thảm vàng nhạt» (nhất quán mn134, mil6.4.2, giữ); `31.2`, `31.4`
  *paralokavajjabhayadassāvino* (xem mnd14, cùng bất định, cả kho đọc một cách). Chú giải ủng hộ cách
  đọc hiện có ở: `158.3` *ḍaṁsādhipātā* (hai loại ruồi: ḍaṃsa và adhipāta, hợp «ruồi trâu, ruồi sà
  xuống», bất định cũ giữ); `174.3` *anoko* (không để thức cùng hành tạo tác có chỗ, hợp «không tạo cơ
  hội»); `191.1` *bhavanto abhisambhaveyya* (chú giải giải *bhavanto* như đang vượt hẳn: hợp bản
