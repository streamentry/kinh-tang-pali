  Lượt thi hành đề nghị còn mở sau chấm round 2 (2026-10-17): thống nhất thuật ngữ *aniketa(cārī)* «(sống) không nơi nương tựa» → «du hành không nhà» (204.4, 208.1, 209.1, 209.5, 209.7, 212.1, 213.4; *niketacārī* 209.2, 209.4 → «du hành có nhà»; *aniketā viharanti* 210.4 và *aniketavihāro* 211.2 → «sống không nhà»), dùng lại dòng kệ snp4.16:16.4 (đã publish) và mnd9:69.1, 75–76 *aniketasārī*, DPD *aniketa* không nhà; cũng tránh trùng «nương tựa» đã dành cho *nissaya* (55.28–57.8); `185.3` *māravisayo* «cõi của Māra» → «lãnh địa của Māra» như chuỗi y hệt cnd5:13.2, cnd23:63.3, mnd1:28.4, mnd2:22.3; giữ «Māra» trong hợp từ vì Ma/Māra/Ma vương còn chờ quyết chung cấp kho. Thêm 1 chú thích `204.4` *aniketacārī* (lời giải 209.2–209.7, chú giải att16 *apalibodhacārī nittaṇhacārī*). Giữ: chuỗi danh hiệu 26.2 (khớp mnd8:78.15, khác mnd14:60.2/cnd19:7.2, để người biên tập); 137.19 đã sửa trước lượt này. Các câu sau trong ghi chú cũ đã bị thay: «bốn thần túc» (đoạn Số Pāli tự tính; nay «như ý túc» theo B3); Bất định 3 «đồng nhất *kaṇho* với Ma vương» (nay lời kinh dùng «Māra»); Bất định 6 «aḍḍhayoga giữ chữ Pāli *nhà aḍḍhayoga*» (đã đổi «nhà một mái» ngày 2026-10-14); số đếm «26 so với 11 khoá cho *māro*, 9 so với 4 cho *samārako*» (không tái lập được; lượt chấm round 1 đếm 11 so với 7 và 9 so với 5); «aniketa … chưa có chú thích», «*aniketa* «không nhà» như snp4.16:16.4 để người biên tập» (nay đã thi hành).
  Thi hành quyết định biên tập 2026-10-17: đổi 3 khoá lời kinh, 1 chú thích. (1) Māra trong hợp từ: 185.3 «phe/bẫy/lưỡi câu/mồi/lãnh địa/nơi ở/nơi lui tới/xiềng xích của Māra» → «… của Ma», 185.5 «phe của Māra» → «phe của Ma», như chuỗi Pāli y hệt cnd5:13.2 (published), cnd23:63.3, mnd1:28.4, mnd2:22.3; đếm hợp từ māra- trong cnd/mnd (trừ bài này): «Ma» 18 khoá, «Ma vương» 11, «Māra» 10 (đều là māracakkhu). Māra đứng riêng giữ «Māra» (41.2, 127.4, 132.4, 185.2): «Māra» 21 khoá, «Ma vương» 14, «Ma» 2; samārako giữ «Māra» (15.1, 29.5, 30.2): 6 so với 5 «Ma vương». Chú thích 181.4 cập nhật theo. (2) Chuỗi danh hiệu 26.2: vế đầu theo mnd14:60.2 và cnd19:7.2 («là bậc có trí tuệ lớn …; khéo léo trong việc phân tích trí tuệ, có trí đã được phân tích thấu triệt …; bậc gánh vác trọng trách …; giàu có, nhiều của cải …», 2 so với mnd8:78.15); vế cuối netā … pasādetā giữ «người dẫn dắt, người rèn luyện, người hòa giải; …» vì lượt thi hành cùng ngày ở mnd14 đã đưa mnd14:60.2 về dạng này (nay mnd8, mnd14, ps3.1:24.1 so với cnd19). 26.2 nay trùng từng chữ mnd14:60.2; 8.1 (cùng vế cuối) giữ. Giữ: thân bài 18/18 khoá «Sāriputta», đúng quyết định; tên kinh 0.3, 1.1, 290.1 «Kể Lược Kinh Xá-lợi-phất» giữ vì là tên kinh gốc snp4.16:0.2 (published, không nằm trong quyết định), đổi riêng bài này làm tên Niddesa lệch tên kinh nó giải; paralokavajja 31.2, 31.4 «lỗi lầm liên quan đến đời sau» theo quyết định. Đã kiểm: lời kinh và chú thích không còn «thần túc», iddhipāda 6 khoá đều «như ý túc». Các câu sau trong ghi chú cũ đã bị thay: «bốn thần túc» (đoạn Số Pāli tự tính); «Māra 41.2, 185.2, 185.3 (8 chỗ), 185.5» ở lượt hoàn thiện (185.3, 185.5 nay «Ma»); «giữ «Māra» trong hợp từ vì Ma/Māra/Ma vương còn chờ quyết chung cấp kho» và «Để người biên tập: Māra/Ma vương/Ma chưa có mục glossary» (đã quyết ở mức bài); «chuỗi danh hiệu 26.2 … để người biên tập» (đã thi hành); Bất định 1 «chưa có quy ước chung cho hai cách viết» Sāriputta (nay theo quyết định giữ dạng Pāli ở thân bài).
  Rà lỗi còn sót 2026-10-17: 1566 khoá đã đọc (103 khoá lặp nguyên văn đối chiếu tự động, khớp hết); sửa 83.7, 89.2 (nghĩa từ: kittakā là đại từ nghi vấn «bao nhiêu/cỡ nào» — DPD kittaka 1 adj. pron. interr. «how many?», chú giải Mahāniddesa CST phần 16 «kittakā ti pamāṇapucchā» — bản cũ «bấy nhiêu» là chỉ định từ, sai nghĩa; nay «bao nhiêu, cỡ nào, chừng nào, nhiều đến đâu»); không sửa 30.7 upakkhittakā «những vị được thu nhận» (DPD: convert; đúng nghĩa, chỉ khác cách tách đoạn so với mnd14:64.8, cnd19:13.3), 191.7 «yāssa te honti atthakāmā» (đại từ quan hệ đặt lệch sang «người nào» nhưng nghĩa chung không đổi), 140.4 niddhame dịch trần thuật trong câu hỏi (cùng snp4.16:8.4 đã publish); không đảo các bất định cũ (11.x, 123.2, 183.3, 188.4, 255.5, 280.4).
  Lượt văn phong theo lời phê 2026-10-17 (quyết định §5.2): xử lý lời phê vietnamese_clarity «vụng ở 191.7/191.18 “những vị mong muốn điều bất lợi”» — 191.7, 191.18 «Ở đây, đối với người nào những vị mong muốn…» → «Ở đây, đối với một người, những ai mong muốn…» (te = «những ai», bỏ kính ngữ «những vị» dành cho kẻ muốn hại; assa = «đối với một người», một lần như Pāli; đủ 4 và 5 cụm -kāmā; 191.7 thêm dấu phẩy trước «là mẹ»). Không xử lý: 152.7/78.5 «giao tiếp, thực hành» (chuỗi trùng mnd6:69.4 đã published), 30.5 «vẫn» (trùng cnd19:12.2 published), 15.1 thế gian/thế giới (lemma là kệ snp4.16; vế giải là công thức chung với 30.2, mnd8:82.2, mnd14:64.2), sīlabbata «giới luật và cấm hạnh» (kho chia đôi, B12 không chốt vế sīla; người chấm không trừ). han_viet_balance không có chỗ cụ thể bị phê. aniketa, chuỗi māra-, chuỗi danh hiệu 26.2, 137.19 đã thi hành ở lượt trước, không đảo.
  Hoàn nguyên sau kiểm văn phong 2026-10-17: thay đổi 191.7, 191.18 («những ai») không được giữ, vì cùng công thức Pāli đã published ở mnd6:75.5, 75.13, mnd11:11.5, cnd23:90.4 dùng «đối với người nào những vị»; đổi lẻ làm lệch nhóm (người kiểm: LỆCH, delta 0). Mục «Lượt văn phong theo lời phê» ngay trên đã bị thay.
  Thống nhất cấp kho 2026-10-17: công thức (y)assa te honti atthakāmā/anatthakāmā… dịch «những người mong muốn … cho một người» (assa = cho một người, te = những người ấy), bỏ «đối với người nào những vị…» (kính ngữ «vị» gồm cả người muốn hại, «nào» gắn sai chỗ); cùng cấu trúc với dn22:18.28/18.31, ps1.1:189.2/190.2.
  Sửa 2026-10-17 (lỗi nghĩa, người kiểm cấp kho nêu): 123.3 anatthakāmāni ahitakāmāni aphāsukāmāni ayogakkhemakāmāni là «mong muốn điều bất lợi, điều tai hại, điều không thoải mái, điều không an ổn khỏi các ách» (an-attha-kāma = muốn điều bất lợi; DPD «wanting harm»), không phải «không mong muốn điều lợi ích…» (phủ định đặt sai phạm vi). Cùng cách với 191.18.
  Thống nhất cấp kho 2026-10-17: paṭipassaddhi/paṭippassaddha/paṭippassambhati thống nhất «dịu xuống» ở 70.5, 208.12, 269.12 (DPD calming down/subsiding; «an tịnh» va chạm santi theo B19, «lắng dịu» va chạm vūpasama), như các chuỗi santo … paṭipassaddho đã dùng; atthakāmāni hitakāmāni «điều lợi ích, điều có ích» → «lợi ích, phúc lợi» ở 128.3, khớp 191.7 và mnd6/mnd11/cnd23 (dec/corpus_rest.tsv).
  Thống nhất cấp kho 2026-10-17 (lời phê vietnamese_clarity/terminology của mnd14, mnd16): (`96.1`, `96.2`, `96.4`, `96.6`, `97.6`, `97.8`, `97.9`) lời Phật trích từ sn35.151 (santevāsiko/sāntevāsiko sācariyako): «có đệ tử ở nhà, có giáo sư» → «có đệ tử nội trú, có thầy». Căn cứ: antevāsika DPD «apprentice; student; lit. who lives with», Sujato «resident pupil», HT. Thích Minh Châu «đệ tử nội trú»; «nội trú» giữ lối chơi chữ với anto vasanti «cư trú bên trong», còn «đệ tử ở nhà» dễ hiểu thành đệ tử tại gia; ācariya là «thầy» (DPD sācariyaka «together with one's teacher», Sujato «teaching master»; kho đã dùng «không có thầy» cho anācariyako), «giáo sư» là chức danh hiện đại. Thêm «thì» trước «sống trong khổ/sống an lành» để «có thầy» không bị đọc thành chủ ngữ của «sống». Đồng bộ sn35.151, mnd1, mnd14, mnd16, cnd23. — (`78.5`, `152.7`) chuỗi đồng nghĩa (bhajato sambhajato) sevato nisevato saṁsevato paṭisevato với tân ngữ là chỗ ngồi/chỗ nằm ngồi: «giao tiếp, thực hành» → «gắn bó, sử dụng». Căn cứ: DPD saṁsevati «associates, attends», paṭisevati «uses; makes use of / resorts to; lives in»; «sử dụng» như senāsanaṁ paṭisevati «sử dụng chỗ ở» ở mnd16:219.1, mnd16:67.12, mn2:15.1; «giao tiếp», «thực hành» không đi được với chỗ ngồi. Đủ động từ, đúng thứ tự Pāli. Đồng bộ mnd6:69.4, mnd16:78.5, mnd16:152.7. Không chấm lại; điểm chỉ đổi theo delta (§2, §5.2 của docs/editorial-decisions-2026-10-17.md) sau khi người kiểm độc lập xác nhận.
  Thống nhất cấp kho 2026-10-17: yathā pajānaṁ «như Ta biết rõ» thay «như Ta liễu tri» (149.5, 155.1, 155.4, 155.5, 157.5): pajānāti ≠ parijānāti (hội đồng A5), lời giải 155.4 không có parijānanto; cùng dòng ở cnd2:19.3, cnd8:31.3–36.3, snp5.5:2.3 là «biết rõ»; khớp snp4.16:9.5. snp4.16:4.1, 9.1, 10.1–10.2, 11.3–11.4 đã căn theo dòng trích của bài này.
  Thống nhất cấp kho 2026-10-17 (dhīra): dhīra «bậc kiên định» → «bậc trí» theo chính lời giải của Niddesa (dhīro paṇḍito paññavā buddhimā ñāṇī vibhāvī medhāvī: mnd9:25.4, mnd11:125.3, mnd12:86.1, mnd13:133.3, mnd16:159.2), theo đa số kho (cnd2, cnd8, cnd23, snp1–snp5, snp4.2, snp4.13, snp4.16 đều «bậc trí»), cho dòng kệ Niddesa khớp bài kệ gốc snp4.13:19.3 và snp4.16:10.1; trong lời giải, chữ đầu dhīro nay là «bậc trí», sáu chữ sau giữ nguyên; snp3.6:33.4 («dũng mãnh», mạch định nghĩa vīra) không đổi.
