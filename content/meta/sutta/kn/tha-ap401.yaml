notes: |-
  Dịch từ Pāli root; kn/tha-ap không có bản Anh Sujato ở commit đã ghim, không có lớp english-project, tầng Việt hiện hành chỉ có Pháp Cú, nên không đối chiếu độc lập được: triangulation thấp, bài giữ draft (mẫu số coverage English: 0 khoá Anh trên toàn bài).
  Số Pāli: saṭṭhi 60 x sahassa 1000 = 60.000 nhạc cụ; soḷasa 16 x 1000 = 16.000 phụ nữ; aṭṭhārase kappasate = 18 x 100 = 1.800 kiếp; satasahassa = 100.000; tiṁsa = 30 nên tiṁsakappasahassamhi = ba mươi ngàn kiếp (21.1 tương lai: sau ba mươi ngàn kiếp nữa; 25.1 quá khứ: vào ba mươi ngàn kiếp trước đây). Lưu ý brief phẩm tha-ap ghi tiṁsa = 3 (ba nghìn kiếp); bài này theo người biên tập: tiṁsa = 30. Tiền lệ cùng phẩm: 6 khoá ba mươi ngàn kiếp trước đây, 1 khoá ba mươi ngàn kiếp nữa.
  Nháy theo Pāli từng khoá: “ mở ở 1.1, đóng ” ở 28.3; ‘ mở ở 11.2, đóng ’ ở 12.4; ‘ mở ở 18.1, đóng ’ ở 23.4. Ba khoá …pe… (26.2, 27.2, 28.2) giữ đúng một dấu …; Pāli không có (…) trần.
  Đại từ: người kể là ta (majority tầng 100/144 cho dòng Kilesā jhāpitā mayhaṁ; 12/21 ở phạm vi tha-ap380-420); Đức Phật nói ở 18-23 là Ta. Công thức 26-28, 17.x, 19.x, 21-22.x theo tiền lệ đã đo (Bốn vô ngại giải 495; Thật lành thay sự đến của ta 95; Sau khi đảnh lễ Đức Chánh Đẳng Giác 5).
  Bất định: (1) tên chim giữ phiên âm vì không có chứng cứ trong tầng: cakkavāka (tiền lệ ja451), ravihaṁsa, dindibha, pampaka, jīvajīvaka, kosiya, piṅgala; piṅgalā có thể là tính từ (vàng nâu) chứ không phải tên chim; mandālaka là một loại sen/súng, giữ phiên âm. (2) 12.2 tavantike là ngôi hai số ít (gần bên ngươi) trong lời ta nói với đoàn tùy tùng, chưa phân xử được. (3) 18.2 tappayiṁ là ngôi một số ít trong lời Đức Phật nói về người khác; đọc như tappayi (người ấy đã làm hài lòng). (4) 23.4 ḍayhatha đọc như ngôi ba số ít (được thiêu); 23.3-23.4 dùng sẽ theo bối cảnh thọ ký. (5) bījaniyo dịch quạt (bījanī là quạt); tầng có tiền lệ dịch hạt giống ở các bài khác, không theo. (6) 25.4 sabbadānassidaṁ phalaṁ: quả của việc bố thí tất cả, tên Sabbadāyaka = người cho tất cả; có thể hiểu mọi sự bố thí. (7) pañcaṅgikehi tūriyehi giữ năm chi. (8) 13.3 vasīsatasahassehi đọc một trăm ngàn bậc tự tại. (9) sāmañña 24.1 = đời sống sa-môn.
  translationTitle bằng :0.3; Pāli :0.3 không bắt đầu bằng số nên không có số thứ tự.
  Chưa chạy được bốn cổng của kho trong phiên này; người điều phối chạy trước khi gộp: npm run validate, npm test, npm run check, npm run build.
  Lượt cải thiện 2026-10-13: đọc đối kháng lại cả 114 khoá, đo tiền lệ theo số đếm trên toàn tầng kn và phạm vi tha-ap; đổi 4 khoá, các khoá còn lại giữ nguyên vì khớp tiền lệ hoặc chưa phân xử được. (a) 3.4 kokilādīhi: "chim cu" thành "chim tu hú" (kokila dịch tu hú 55 khoá, chim cu 4 khoá trong đó 2 khoá là chính cặp bài này; trong tha-ap các bài khác đều dùng tu hú). (b) 5.1 haṁsā: "ngỗng" thành "thiên nga" (toàn tầng 93 khoá thiên nga so với 18 khoá ngỗng và ngỗng trời; phạm vi tha-ap 15 so với 4). (c) 5.2 kosiyā: "kosiya" phiên âm thành "chim cú": trong chính tầng, ja226 (kosiyaṁ, kosiyova) dịch con cú, ja270:1.2 kosiyo (bài Ulūkajātaka) dịch con cú, ja145:1.4 kosiyāyane dịch tổ chim cú; piṅgalā vẫn giữ phiên âm và đọc là tên loài hoặc tính từ chưa phân xử được, nên câu viết nhiều chim cú và chim piṅgala. Bất định (1) cũ ghi kosiya giữ phiên âm vì không có chứng cứ nay được thay bằng căn cứ này. (d) 18.2: "ta" thành "Ta" cho thống nhất đại từ của Đức Phật ở 18.3 và 18.4 (lời Đức Phật nói ở 18 đến 23). Điểm đổi: terminology 8.8 thành 9.1 (ba khoá thuật ngữ lệch đa số được sửa theo số đếm; piṅgala và các tên chim khác vẫn giữ phiên âm nên chưa cao hơn); final_score 8.93 thành 8.96. Các tiêu chí khác giữ nguyên: semantic_fidelity và grammar_logic vì các bất định về tavantike 12.2, tappayiṁ 18.2, ḍayhatha 23.4 và sabbadānassidaṁ 25.4 vẫn chưa phân xử được; ambiguity_integrity giữ vì các bất định đó còn nguyên; triangulation giữ 6.5 vì không có tầng Anh độc lập; technical_integrity giữ 9.6. Khoá 8.2 (Đức Sumedha là tân ngữ của vandayiṁ, chủ ngữ ta chỉ hiện ở 8.4) giữ nguyên theo tiền lệ cùng phẩm dù người đọc lướt có thể tạm hiểu Đức Sumedha là chủ ngữ của 8.1. Khoá 12.2 tavantike (ngôi hai số ít trong lời ta nói với đoàn tùy tùng) giữ nguyên theo tiền lệ hai bài, chưa phân xử được. Chưa chạy được bốn cổng của kho trong lượt này; người điều phối chạy npm run validate, npm test, npm run check, npm run build trước khi gộp.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 4 khoá bất đồng nghĩa → sửa 1 nhóm (`12.1`–`12.3`: *chúng ta … bên ngươi … Chúng ta* → *chúng tôi … bên ngài … Chúng tôi*, vì `tavantike` là ngôi hai số ít còn `amhaṁ`, `vasāma`, `mayampi` là ngôi một số nhiều, tức đoàn tùy tùng đáp lại người kể, không phải người kể nói với đoàn tùy tùng, mà `11.2` `vo` là số nhiều; bản nguyên bài cũng ghi đây là lời đáp của họ; điều này giải quyết bất định `12.2` đã ghi ở trên), giữ 3 (`1.1` `ogayha` *sau khi đi sâu vào đại dương* — bản nguyên bài hiểu là ở gần biển; `3.4` `kokilādīhi` *chim tu hú và các loài khác* — bản nguyên bài hiểu thành dơi và chim sáo; `2.1` `mandālakehi` *hoa mandālaka* — bản nguyên bài hiểu là cây mạn-đà-la), bất định 0 mới. Mọi số đếm khớp: sáu mươi ngàn nhạc cụ, mười sáu ngàn phụ nữ, một ngàn tám trăm kiếp, ba mươi ngàn kiếp (cả `21.1` và `25.1`, bản nguyên bài cũng viết ba mươi ngàn kiếp). Bài khác có cùng lỗi: `tha-ap553:12.1`–`12.3`. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
