notes: |-
  Bản dịch chỉ từ Pāli root vì commit đã ghim không có bản Anh cho toàn bộ Vimānavatthu, đây là giới hạn upstream.
  Tiêu đề 0.2 dùng họ Chuyện Cung Điện song song nam và nữ trong lát để nhất quán nội bộ, 0.3 giữ tên phẩm theo tiền lệ từng file trong kho.
  Công thức hỏi đáp 3.1 tới 3.4 theo khung vv65 đã có, đổi sang giống cái theo vv49.
  Cụm giáo lý 5.2 và 5.3 không có bản Anh để đối chiếu nên terminology và ambiguity không vượt 9.0.
  technical_integrity 9.6 vì agent lát này không chạy gate. Bốn lệnh gate do coordinator chạy trước khi publish: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Kiểm toán độc lập 2026-10-11: đọc đối kháng 29 khoá với Pāli. Lỗi nghĩa thật ở 4 khoá, đã sửa. (1) 1.1–1.2: `maṇikañcanācitaṁ`, `sovaṇṇajālacitaṁ`, `mahantaṁ` đều ở đối cách trung/đực, hợp với `gajavaraṁ` (con voi), chỉ `alaṅkatā` (giống cái, chủ cách) mới nói về nữ thiên; bản cũ gán "điểm trang bằng ngọc ma-ni và vàng, phủ lưới vàng" cho người. Nay 1.1 là "Nàng được điểm trang; thớt voi nạm ngọc ma-ni và vàng", 1.2 giữ "phủ lưới vàng, to lớn"; 1.3 đổi "thớt voi ưu tú" thành "voi chúa" (tiền lệ vv60:1.3) để không lặp danh từ. (2) 4.1: `Bārāṇasiyaṁ` là vị trí cách ("ở Bārāṇasī"), không phải nơi đến; bản cũ "Đã đến thành Bārāṇasī" đổi nghĩa; nay "Ở Bārāṇasī, tôi đã đến gần,". (3) 6.3: `aññatarā pajāpati` là "một người vợ" (tiền lệ sn11.12:6.1, sn11.13:11.1 dịch "làm vợ"), không có nghĩa "chánh hậu"; bản cũ thêm nghĩa chức vị. Lỗi nhẹ hơn: 5.2 bỏ sót `me` (nay "đã giảng cho tôi"); 5.4 thêm "Thánh" không có trong Pāli (`maggaṁ` đơn thuần; nay "Đạo"); 2.4 thêm "vũ công"; 3.1 hô cách `mahānubhāve` bị đọc như thuộc tính ("có uy thế lớn lao") và lệch tiền lệ "đại oai lực" (vv11, vv31, vv12); nay theo vv12 "này vị có đại oai lực". Xưng hô: nữ thiên đáp tôn giả Moggallāna xưng "ta" ở 7 chỗ (4.2, 4.3, 4.4, 5.4, 6.1, 6.2, 6.3), trong khi họ Itthivimāna đo được vv1–vv15 hoàn toàn dùng "tôi" (0 "ta"); đã đổi sang "tôi" cho nhất quán. Không có khoá nào đọc hô cách thành tân ngữ lặp, không có `idha mijjhati`, `Tenamhi`, `yamakāsi`, `tila`, `ākāsa` trong bài này; 5.1 đã hợp với `kañcanasannibhattaco`.
  Bất định còn lại: 5.2 `samudayadukkhaniccataṁ` (chỉ có thêm vv16:7.2 cùng Pāli, cùng cách dịch "tập khởi, khổ và vô thường") — chữ viết là `niccataṁ` (thường hằng), đọc "vô thường" như `aniccataṁ` dựa vào thể kệ và ngữ cảnh, không có bản Anh hay chú giải trong kho để phân xử; giữ cách đọc của họ vv16 và ghi bất định, nên ambiguity_integrity hạ từ 9.0 xuống 8.8, semantic_fidelity từ 9.2 xuống 9.0 (bản cũ có 4 khoá sai nghĩa). Tiêu đề phẩm 0.2 `Itthivimāna` hiện dịch "Chuyện Cung Điện Nữ Hư Không" ở cả bộ, trong Pāli không có `ākāsa`; không sửa riêng một tệp để khỏi lệch bộ, ghi để sửa chung. 5.3 `dukkhanirodhasassataṁ` giữ như vv16:7.3. Các điểm khác giữ nguyên. Blocker upstream giữ nguyên.
  technical_integrity 9.6 vì lượt này không chạy gate: `npm run validate`, `npm test`, `npm run check`, `npm run build` do coordinator chạy.
