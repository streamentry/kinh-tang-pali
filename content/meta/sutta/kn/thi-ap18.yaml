notes: |-
  Khemātherīapadāna, bài thứ tám của Phẩm Ekūposathika trong Therīapadāna. 383/383 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá nào ngoài tập khoá Pāli. Nội dung: lời tự thuật của Khemā. Thời Đức Phật Padumuttara cô nguyện được vị trí đệ nhất đại trí và được thọ ký thành Khemā thời Đức Phật Gotama (sau một trăm ngàn kiếp nữa); các đời hoàng hậu cõi trời và cõi người; thời Đức Phật Vipassī xuất gia mười ngàn năm; thời Koṇāgamana cùng Dhanañjānī và Sumedhā dâng tịnh xá; thời Kassapa là công chúa Samaṇī, một trong bảy chị em con vua Kikī; đời cuối là con gái vua Madda, hoàng hậu của vua Bimbisāra, được dẫn đến Veḷuvana, thấy thiếu nữ đẹp trở nên già yếu, nghe kệ của Đức Phật và kinh Mahānidāna, thấy rõ pháp nhãn, tỏ bày lỗi lầm, xuất gia, đắc A-la-hán, được đặt vào vị trí đệ nhất trong những vị đại trí tuệ.

  NGUỒN VÀ TAM GIÁC — không có tầng Anh (Sujato) đã ghim, không có `english-project`, không có `vietnamese-current` cho thi-ap; bài đối chiếu Pāli root và các tiền lệ đã dịch trong kho: thi-ap19, thi-ap20 đến thi-ap27 (cùng khuôn Padumuttara, bảy công chúa con vua Kikī, đoạn nghe Pháp xuất gia), thi-ap25 và thi-ap36 (cùng các kệ về thân bất tịnh), thi-ap35 (câu Đâu-suất, đời sau), thi-ap22 (làm thanh sạch pháp nhãn), thi-ap38 (cách đặt tên), tha-ap541 (lời thọ ký của Đức Phật), dhp346 và dhp347 (cùng kệ về mạng nhện và dòng nước), thag21.1 và snp2.11 (cùng bốn câu tu tập vô tướng). Tầng tra cứu toàn văn của kho (bản Việt nguyên bài của Bhikkhu Indacanda, không căn lề từng khoá, không phải tầng store) chỉ được đọc để hiểu mạch ở những chỗ hiếm và khó; câu Việt ở đây viết từ Pāli, không chép từ bản ấy. Vì vậy triangulation = 7.5 và bài không được coi là đã đối chiếu English.

  TIÊU ĐỀ, TÊN PHẨM VÀ SỐ THỨ TỰ — đo trước khi chốt, ghi cả hai phạm vi:
  - :0.1 Therīapadāna giữ nguyên Pāli: 36 trên 37 tệp thi-ap đã vào cây chính dùng cùng dạng (tệp còn lại là thi-ap6, viết Trưởng Lão Ni Ký Sự).
  - :0.2 Ekūposathikavagga → Phẩm Ekūposathika: 8 trên 8 tệp đã có cùng Pāli (thi-ap11 đến thi-ap16, thi-ap19, thi-ap20).
  - :0.3 Pāli là Khemātherīapadāna, không bắt đầu bằng số nên :0.3 không có số; translationTitle bằng đúng :0.3 từng ký tự. Trong 37 tệp thi-ap ở cây chính: 18 tệp có số ở Pāli (12 giữ, 6 bỏ) và 0 tệp thêm số ở chỗ Pāli không có; bài này thuộc nhóm không số.
  - Từ chỉ thể loại apadāna ở :0.3 và :98.1. Phạm vi gần nhất, Phẩm Ekūposathika (8 tệp): Tuyên Ngợ 8, Tuyên Ngôn 0. Toàn thi-ap ở cây chính (37 tệp): Tuyên Ngợ 34, Tuyên Ngôn 2 (thi-ap29, thi-ap30), 1 khác (thi-ap6). Toàn tha-ap (559 tệp): Tuyên Ngợ 255, Ký Sự 155, Tuyên Ngôn 142, 7 khác. Cả hai phạm vi cùng cho Tuyên Ngợ đứng đầu nên giữ Tuyên Ngợ cho khớp thi-ap19, thi-ap20 và các tệp cùng phẩm; chữ này có dấu hiệu là lỗi chính tả của Tuyên Ngôn, người biên tập nên phán một lượt cho cả cuốn chứ không sửa riêng bài này.
  - Từ chỉ người: Trưởng Lão Ni ở tiêu đề (33 trên 37 tệp thi-ap); câu kết :97.1 bhikkhunī → Tỳ-kheo-ni, công thức Tôi nghe như vầy: Tỳ-kheo-ni X đã nói những bài kệ này (33 khoá cùng công thức Itthaṁ sudaṁ ... bhikkhunī imā gāthāyo abhāsitthāti trong thi-ap và thig đã dịch: 31 khoá dùng đúng dạng này, 2 khoá dạng khác là thi-ap6 và thig1.1; không dùng dạng số ít đã từng nói bài kệ này vì Pāli imā gāthāyo là số nhiều). :98.1 aṭṭhamaṁ → thứ tám, theo thi-ap8:22.1 và thi-ap38:22.1 (và vị trí thứ tám của phẩm 11 đến 20). :83.1 Dutiyaṁ bhāṇavāraṁ → Phần tụng đọc thứ hai, theo thi-ap23:19.1 và thi-ap35:34.2 (Tatiyaṁ, Pañcamaṁ bhāṇavāraṁ → Phần tụng đọc thứ ba, thứ năm).

  NGÔI KỂ — lời kể của Khemā dùng ta (ahaṁ), lời nói trực tiếp với Đức Phật (74 đến 78) dùng con, lời nói với vua Bimbisāra (81, 82) dùng thiếp và bệ hạ theo thi-ap33:5 (Tâu bệ hạ, ... thiếp), lời Đức Phật nói với Khemā (7 đến 9, 66 đến 69) dùng ngươi theo thi-ap19, thi-ap20 và thi-ap26, lời vua cho phép (84.3) dùng ta và nàng. Đo đại từ kể trong cây chính, ta/tôi/con: thi-ap11 tôi 25; thi-ap12, 13, 14, 15 con 12, 10, 43, 38; thi-ap16 tôi 6 và ta 5; thi-ap19 ta 47 và con 37; thi-ap20 con 65; thi-ap21 đến thi-ap27 ta ở mọi tệp (57, 36, 41, 25, 36, 23, 41). Trong chính phẩm Ekūposathika ba cách đều có mặt, nên chọn theo thi-ap19 (bài liền trước, cùng khuôn bảy chị em) và thi-ap21 đến 27 (cùng khuôn Padumuttara, cùng kệ thân bất tịnh): ta cho phần kể, con cho phần nói với Đức Phật. Đây là chọn theo phạm vi gần nhất, không phải đa số toàn nhóm; người biên tập nên phán một lượt cho cả phẩm.

  SỐ PĀLI — tự tính, in phép:
  - Ito satasahassamhi kappe (1.3) = sata 100 × sahassa 1.000 = 100.000 → một trăm ngàn kiếp (thì quá khứ: cách đây). Satasahassito kappe (8.1) cũng 100.000, nhưng là lời thọ ký tương lai nên dịch Sau một trăm ngàn kiếp nữa, theo thi-ap20:9.1, thi-ap21:7.1, tha-ap541:12.1 (17 khoá cùng dạng Sau một trăm ngàn kiếp nữa).
  - Ekanavutito kappe (15.1) = eka 1 + navuti 90 = 91 → chín mươi mốt kiếp (127 khoá cùng Pāli; dạng đa số 45 là Vào chín mươi mốt kiếp trước, dùng lại).
  - Dasavassasahassāni (17.1) = dasa 10 × sahassa 1.000 = 10.000 → mười ngàn năm (8 khoá cùng Pāli đều dịch Mười ngàn năm). Vīsavassasahassāni (30.3) = vīsa 20 × sahassa 1.000 = 20.000 → hai mươi ngàn năm (5 khoá cùng Pāli: thi-ap19:49.3 và các bài cùng khuôn).
  - sattāhaṁ (4.3), sattāhe (5.1) = bảy ngày; satta dhītaro (31.4) = bảy người con gái, và hai danh sách bảy: 32.1 đến 32.4 là Samaṇī, Samaṇaguttā, Bhikkhunī, Bhikkhudāyikā, Dhammā, Sudhammā, Saṅghadāyikā = 7 (sattamī = thứ bảy, khớp); 33.1 đến 33.4 là ahaṁ, Uppalavaṇṇā, Paṭācārā, Kuṇḍalā, Kisāgotamī, Dhammadinnā, Visākhā = 7 (Visākhā là sattamī, khớp). Tayo janā (24.4) = ba người: Dhanañjānī, Sumedhā, ahaṁ = 3, khớp.
  - addhamāse upaṭṭhite (85.2) = nửa tháng; Caturoghe (86.3) = bốn dòng lũ; Paṭisambhidā catasso (96.1) = bốn vô ngại giải; tāvatiṁsa (10.4, 26.2, 35.4) = Ba mươi ba (tên cõi trời); aṭṭhamaṁ (98.1) = thứ tám; Dutiyaṁ (83.1) = thứ hai.
  - Không có cụm Tiṁsakappasahassa (tiṁsa 30) trong bài: tiṁsa chỉ xuất hiện trong tên cõi trời Tāvatiṁsa (33). Phép kiểm cụm số chưa phân xử được vì vậy chạy rỗng với bài này, không phải pass.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò (chỉ mục dựng trên các bài kn, sn, an, dn, mn đã dịch ở cây chính và ở nhánh làm việc, không tính bài này; so không phân biệt dấu câu và chữ hoa đầu dòng):
  - 144 khoá có Pāli trùng byte với ít nhất một khoá đã dịch; 137/144 dùng lại đúng một dạng đã có (đa số là dạng đa số), 7/144 khác mọi tiền lệ, đều có lý do: 19.2 (upapannā → tái sinh: tầng đo upapann 321 khoá, tái sinh hoặc tái sanh 74, sinh ra 25, sinh vào 158; tiền lệ duy nhất thi-ap35:4.4 là sinh ra); 24.4 (tiền lệ thi-ap1 là tôi, bài này dùng ta); 33.1 (tiền lệ thi-ap20 là con, bài này dùng ta); 58.3 (tiền lệ thi-ap25:44.1 mở bằng Người có eo thon, hông đẹp; ở đây là một vế trong chuỗi mô tả thiếu nữ nên bỏ Người có); 64.1 (tiền lệ thag6.1:2.3 là xúc cảm kinh sợ; saṁvega/saṁvigga tầng đo 113 khoá: xúc động 32, kinh động 4, kinh sợ 2, nên dùng xúc động theo thi-ap21:40.1 và thi-ap25:46.3); 67.3 (tiền lệ nơi ông, người được nói là nam; Khemā là nữ nên nơi ngươi); 80.2 (5 tiền lệ chia hai dạng, bài này dùng dạng thực hiện lễ hữu nhiễu quanh Ngài, thêm và theo ca).
  - Lấy lại nguyên cả bốn câu kệ của dhp346 và dhp347 cho 70.2, 70.3, 70.4 (như nhện sa vào lưới mình dệt; sau khi cắt được nó, người ta xuất gia; không còn mong mỏi, đã từ bỏ dục lạc) và 70.1 (Kẻ say đắm tham dục lao vào dòng); các câu 66, 67, 68, 69 theo thi-ap25, thi-ap36 và thag21.1.
  - Trong chính bài có 9 nhóm Pāli trùng nguyên văn: 10.2·35.2; 10.3·35.3; 12.4·13.4; 23.2·27.2; 23.4·27.4; 73.4·80.4; 77.4·78.4; 94.2·95.2·96.2; 95.3·96.3. Cả 9 nhóm có bản Việt giống nhau; 0 cặp lệch. 77.4 và 78.4 chỉ khác nhau ở nháy đóng ’ theo Pāli; 95.3 và 96.3 chỉ khác ở nháy đóng ” theo Pāli. Ba khoá …pe… (94.2, 95.2, 96.2) đều là … đúng một dấu lược.

  DẤU TI — Pāli có ti gắn vào từ mà không mở nháy (khemāti 37.3, iti 41.4, dosavādīti 39.3, ahitoti 78.2, khemeti 79.3, aggāti 93.3). Đo trong thi-ap và tha-ap ở cây chính: 30 khoá có ti gắn vào tên hoặc danh xưng mà không có nháy trong khoá Pāli, 0/30 khoá Việt thêm nháy (bỏ ti). Bài này bỏ ti và không thêm nháy, nháy khớp Pāli từng khoá. Nháy Pāli chạy qua khoá: ‘ mở ở 7.2 đóng ở 9.4; mở 47.1 đóng 47.4; mở 48.1 đóng 48.4; mở 52.1 đóng 54.4; mở 56.4 đóng 59.4; mở 60.2 đóng 60.4; mở 64.3 đóng 64.4; mở 66.1 đóng 70.4; mở 74.1 đóng 78.4; mở 81.1 đóng 82.4; mở 84.3 đóng 84.4; “ mở 1.1 đóng 96.3. Hai chỗ nháy Pāli giữ nguyên dù ngữ nghĩa lệch: cặp nháy ‘ ’ ở 48.1 đến 48.4 bao cả đoạn kể của Khemā (không phải lời nói trực tiếp), và 79.3 (Avoca tiṭṭha khemeti) Pāli không có nháy nên lời Đức Phật ở đó được dịch không nháy.

  THUẬT NGỮ — kèm số đếm (toàn tầng kn, sn, an, dn, mn đã dịch):
  - narasārathi → Điều Ngự Trượng Phu (9 trên 10 khoá; 1 khoá Chủ Xế); vināyaka → Điều Ngự (45 trên 65; Hướng Đạo 4); lokanāyaka → Dẫn Đạo thế gian (177 trên 233; Lãnh Đạo 17, Dẫn Lộ 7); mahesī → Đại Ẩn Sĩ (184 trên 252); sugata → Thiện Thệ (421 trên 901 khoá); narāsabha → Nhân Ngưu (94 trên 133); narādicca → bậc Mặt Trời của loài người (2 trên 2, thi-ap27:3.1); mahākāruṇika → bậc Đại Bi (15 trên 16); sabbadassāvī → bậc Thấy Tất Cả (tha-ap409:14.3; 8 trên 24; toàn kiến 13).
  - sabbadhammesu cakkhumā (1.2) → bậc Hữu Nhãn đối với mọi pháp: 11 khoá cùng Pāli, 9 khoá dùng Hữu Nhãn (tha-ap, thi-ap), 2 khoá dùng có mắt sáng suốt trong mọi pháp (snp5.1:17.4 và cnd1:17.4); toàn tầng cakkhumā 186 khoá: có mắt 127, Hữu Nhãn 17. Chọn dạng của cùng Pāli trong loạt apadāna.
  - visārada → tự tin (tầng đo 149 khoá: tự tin 126, vững vàng 13, tinh thông 4, thông thạo 2), nên 18.2 và 90.2 dùng tự tin, không dùng thông thạo. kusala/kovida → thiện xảo (kovida tầng đo 133 khoá: thiện xảo 29, thông thạo 10, tinh thông 8): 18.1, 86.2, 90.1 cùng dùng thiện xảo.
  - catusacca → bốn chân lý (26 khoá: bốn chân lý 16, bốn sự thật 6, Bốn Thánh Đế 2). kappa → kiếp; bhaddake kappe → hiền kiếp (21 trên 23). asubha → bất tịnh (113 trên 149). amata → bất tử (322 trên 479). pabbaj- → xuất gia.
  - khema/khemā → an ổn (37.2; 105 khoá: an ổn 39, an toàn 24); tên Khemā giữ nguyên Pāli.
  - accayaṁ desayāmi (73.3, 77.4, 78.4) → tỏ bày lỗi lầm; tầng đo 8 khoá accayaṁ desa-: tỏ bày lỗi 4 (sn11.24), sám hối 6 (sn1.35, an2.21; hai cách xuất hiện chung một khoá); chọn tỏ bày lỗi lầm vì cùng động từ deseti ngôi thứ nhất của vị đang tự nhận lỗi, như sn11.24:1.4.
  - lūkha (56.4) → khắc khổ (lūkhajīvī sn42.12 → sống khắc khổ; lūkhacīvara → y thô 73; sn7.14 lūkho → nghèo nàn); chọn theo mạch Khemā thấy Đức Phật ngồi an lạc có người nữ quạt nên nghĩ vị này không khắc khổ.
  - brahmabandhu → thân quyến của Phạm thiên (15 trên 16 khoá cùng Pāli); Koṇāgamana, Kassapa, Vipassī, Padumuttara giữ nguyên Pāli; Veḷuvana giữ nguyên Pāli kèm rừng trúc ở lần nhắc đầu (40.3; theo sn10.9, ud1.6 viết rừng trúc Veḷuvana); Nandana giữ nguyên Pāli (30 khoá Nandana); Giribbaja giữ nguyên Pāli (13 khoá); Toraṇavatthu giữ nguyên.
  - Mahānidāna giữ nguyên Pāli (tha-ap212:5.3 giữ nguyên Mahānidāna; dn15 là Kinh Đại Duyên).
  - tāvatiṁsa → Ba mươi ba; yāma → Dạ-ma; tusita → Đâu-suất; nimmānarati → Hóa Lạc; vasavatti → Tha Hóa Tự Tại (theo thi-ap21:10 và thi-ap25:16; 3 khoá cùng Pāli).
  - paṭisambhidā → vô ngại giải (592 khoá Bốn vô ngại giải); cetopariyañāṇa → trí biết tâm người khác; saṁvega → xúc động (xem trên).

  BẤT ĐỊNH — ghi ở đây, không đưa vào thân kinh:
  1. 4.1 đến 4.2 Mātaraṁ pitarañcāhaṁ āyācitvā vināyakaṁ: dịch thỉnh cầu cha và mẹ và bậc Điều Ngự (cả hai là tân ngữ của āyācitvā); cách đọc khác: vināyakaṁ chỉ là tân ngữ của nimantayitvā (4.3).
  2. 5.2 đến 5.4: mahāpaññānamuttamaṁ (5.2) là tân ngữ của bhikkhuniṁ (5.3), tức vị tỳ-kheo-ni được đặt vào vị trí tối thắng, không phải Đức Phật; giữ nguyên trật tự Pāli nên 5.2 đứng trước 5.3.
  3. 6.3 đến 6.4: taṁ ṭhānaṁ là tân ngữ của paṇīdahiṁ (phát nguyện vị trí ấy); kāraṁ katvāna (tỏ lòng tôn kính) đi với puno tassa mahesino (6.2).
  4. 19.4 brahmacārīphalenahaṁ: dịch nhờ quả báu của người sống phạm hạnh; cách đọc khác: nhờ quả của phạm hạnh.
