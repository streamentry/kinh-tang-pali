notes: |-
  Tiền lệ: khung tiêu đề như ja131; canda → mặt trăng; paññā → trí tuệ;
  ābhassara → cõi Quang Âm (tiền lệ dn15: sinh về cõi Quang Âm).
  Bất định: 1.2 gādha (chỗ đứng vững, chỗ lội qua) 0 tiền lệ, đọc như tính từ vị
  ngữ nên bậc chiến sĩ nhờ trí tuệ mà đứng vững; 1.1 để lửng như Pāli (hai túc từ
  không động từ). Kệ có hai vế trích dẫn (1.2 và 1.4 đều đóng bằng ti) nên bản
  Việt giữ hai cặp ngoặc kép cân nhau.
  Thiếu tầng Anh nên triangulation chỉ 7.0 và bài ở draft.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): sửa 1.2: yodha là yo + idha ("ai ở đây"),
  không phải yodha "chiến sĩ". Còn bất định: gādha ("đứng vững/thấu đạt") và quan hệ giữa 1.1–1.2 với
  1.3–1.4 giữ như cũ.
