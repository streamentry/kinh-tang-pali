notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja398 tại commit đã ghim, `vietnamese-current` tại commit đã ghim vắng với Jātaka.
  Dùng lại nguyên văn 2 khoá theo Pāli trùng nguyên văn: `:4.2` theo an4.57:3.2 (tinh khiết, ngon lành, đầy đủ hương vị) và `:7.2` theo ja359:5.2 (cùng với toàn thể quyến thuộc bà con). Ngoài ra hai chỗ Pāli chỉ khác ở dấu chấm câu nên vẫn dùng lại nguyên văn: `:1.2` theo ja309:2.2 (được rưới nước canh thịt tinh khiết).
  Bất định: `Sudullabho hehiti bhakkhite mayi` ở `:4.4` dịch là lúc ta ăn thì khó lấy được lắm — đây là cách đọc theo nghĩa vế `bhakkhite mayi`, không thêm vế nào nữa. `rañño ca vacanaṁ katan` ở `:7.4` là lời nhà vua, theo genitive của từ chỉ vua.
  Thuật ngữ theo tiền lệ đếm được: `yakkha` → dạ-xoa (68 tiền lệ trong tầng kn), `māṇava` → hỡi người (theo ja163:2.3), `bhikkhā` → các bậc nữ, `saññino` → nghĩ đến, `sagga` không có ở đây nhưng cùng dòng với `cõi trời` đã dùng ở tầng an. Tên phẩm Sattakanipāta → Bộ Bảy Bài Kệ, Kukkuvagga → Phẩm Kukku, xem ghi chú chung của lát ở ja396.
  Cổng kỹ thuật chưa chạy vì agent dịch không được chạy lệnh npm. Coordinator chạy bốn lệnh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5, Claude Code), đọc lại đủ 33 khoá Pāli↔Việt; chỉ có Pāli
  đã ghim và PED. Bản cũ sai gần toàn bài (khoảng 24/29 khoá có nội dung). Lỗi chính: `1.3`
  `Maghadevasmiṁ adhivatthe` là `Maghadeva` đang ngụ ở đây (PED `adhivattha` = ở trong, c. loc.;
  `Maghadeva` là tên chứ không phải nước Ma-ga-tha, vì tại `3.1` người nói gọi người ăn là `yakkha`);
  `2.1`–`2.4` (`orena` = về phía này; `bhikkhamādāya sūpitaṁ` = mang phần ăn đã nêm canh; `ubho
  bhakkhā bhavissatha` = cả hai đều sẽ là thức ăn, bản cũ nói “lau cho sạch”, “các bậc nữ”);
  `3.1`–`3.4` (`appakena … thullamatthaṁ jahissasi` = vì chút ít mà đánh mất lợi lớn; `janā
  maraṇasaññino`); `4.1`–`4.4` (`āhariyo naro … sudullabho hehiti bhakkhite mayi` = người mang phần ăn
  đến sẽ rất khó có khi ta đã bị ăn); `5.1`–`5.4` (`sutano` là hô cách tên `Sutana`, không phải `suta`
  nghe; `mameva … attho` = chính là lợi ích của ta; `sotthiṁ passāhi mātaraṁ` = bình an mà gặp mẹ);
  `6.1`–`6.4` (`khaggaṁ chattañca pātiñca` = gươm, lọng, bát; bản cũ dịch “gậy, roi, que”). Giữ
  `7.1`–`7.4`. Bất định: `4.1` `laddhāya` đọc là phân từ hoàn thành (đã có phần ăn thường nhật); `5.1`
  đọc `sutano` là tên riêng theo tên bài, không thêm gì ngoài Pāli.

  Quyết định hội đồng biên tập 2026-10-16: B21 — `1.2` (`suci` bổ nghĩa nước canh thịt (theo dạng ghép dn3, thag16.7)); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
