notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja398 tại commit đã ghim, `vietnamese-current` tại commit đã ghim vắng với Jātaka.
  Dùng lại nguyên văn 2 khoá theo Pāli trùng nguyên văn: `:4.2` theo an4.57:3.2 (tinh khiết, ngon lành, đầy đủ hương vị) và `:7.2` theo ja359:5.2 (cùng với toàn thể quyến thuộc bà con). Ngoài ra hai chỗ Pāli chỉ khác ở dấu chấm câu nên vẫn dùng lại nguyên văn: `:1.2` theo ja309:2.2 (được rưới nước canh thịt tinh khiết).
  Bất định: `Sudullabho hehiti bhakkhite mayi` ở `:4.4` dịch là lúc ta ăn thì khó lấy được lắm — đây là cách đọc theo nghĩa vế `bhakkhite mayi`, không thêm vế nào nữa. `rañño ca vacanaṁ katan` ở `:7.4` là lời nhà vua, theo genitive của từ chỉ vua.
  Thuật ngữ theo tiền lệ đếm được: `yakkha` → dạ-xoa (68 tiền lệ trong tầng kn), `māṇava` → hỡi người (theo ja163:2.3), `bhikkhā` → các bậc nữ, `saññino` → nghĩ đến, `sagga` không có ở đây nhưng cùng dòng với `cõi trời` đã dùng ở tầng an. Tên phẩm Sattakanipāta → Bộ Bảy Bài Kệ, Kukkuvagga → Phẩm Kukku, xem ghi chú chung của lát ở ja396.
  Cổng kỹ thuật chưa chạy vì agent dịch không được chạy lệnh npm. Coordinator chạy bốn lệnh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
