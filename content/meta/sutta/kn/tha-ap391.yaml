notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho tha-ap391 (không có tệp Anh trong manifest), và không có bản Việt hiện hành cho uid này. Bài chỉ có Pāli làm chứng cứ; các điểm dưới đây là chỗ Pāli cho phép hơn một cách hiểu hoặc chưa có tiền lệ trong tầng.
  Tên bài `:0.3`: Pāli `9 Soṇakoṭivīsattheraapadāna` bắt đầu bằng số nên giữ số ở dạng `9. `; `translationTitle` bằng đúng giá trị `:0.3`. Mở đầu tên: đo trên tầng tha-ap thấy Bài Kệ Tuyên Ngợ/Ngợi 244, Bài Kệ Tuyên Ngôn 97, Ký Sự 96 (Tuyên Ngợ là lỗi chính tả); ở phạm vi gần (tha-ap360–395) Tuyên Ngợ/Ngợi 24, Ký Sự 6, Tuyên Ngôn 1; trong phẩm Avaṭaphala (tha-ap383–390) Ký Sự 4, Tuyên Ngợ/Ngợi 4. Hai phạm vi cho đa số khác nhau; chọn Ký Sự vì đây là cách dịch đúng của apadāna, không mang lỗi chính tả, và bài liền trước (tha-ap390) dùng đúng dạng này. Cần biên tập phán một lượt cho cả cuốn. Tên phẩm `Phẩm Trái Avaṭa` theo 7 trên 8 bài đã dịch cùng phẩm (một bài viết Phẩm Avaṭaphala). Tên người giữ nguyên dạng Pāli của khoá (Soṇa Koṭivīsa, khác dạng Koḷivisa ở an1.205).
  Số đếm tự tính: navuti = 90 (kappe navuti, atītā navuti kappā); ekanavutito = eka 1 + navuti 90 = 91, khớp Atītā navuti kappā + ayaṁ eko ca uttari = 90 + 1 (nhưng bản dịch 8.2 chỉ nói thêm một kiếp này nữa, không tự cộng); caturaṅgulā = bốn ngón tay; vīsakoṭī = hai mươi koṭi, giữ đơn vị koṭi (tiền lệ trong tầng: asīti vassakoṭiyo dịch tám trăm triệu năm, tức koṭi = mười triệu).
  Bất định: (1) leṇa dịch hang động, tầng chỉ có tiền lệ rời rạc (hang đá, hang trú ẩn, nơi trú ẩn); cũng có thể là tịnh thất hoặc chỗ trú ẩn nói chung. (2) bhikkhusaṅghassa aggato dịch trước Tăng chúng; có thể hiểu là bậc đứng đầu Tăng chúng, và Pāli không phân xử được. (3) aggaseṭṭhi dịch vị trưởng giả hàng đầu, không có tiền lệ trong tầng. (4) pāvacana dịch giáo pháp. (5) ayaṁ eko ca uttari dịch và thêm một kiếp này nữa. (6) Khoá 6.2–6.4: Pāli không có dấu ngoặc cho lời của người cha nên bản dịch cũng không thêm ngoặc. (7) bandhumā rājadhānī dịch kinh thành Bandhumā theo đúng dạng Pāli của khoá, không tự đồng nhất với Bandhumatī. (8) Dấu ti ở 15.4 (mahāsareti) không dịch, theo đa số tầng.
  Công thức kết `Itthaṁ sudaṁ … abhāsitthāti` dịch theo nhóm đa số (443 khoá: đã nói những bài kệ này) thay vì nhóm số ít. Các khoá lược `…pe…` (12.2, 13.2, 14.2) giữ đúng một `…`; Pāli không có `(…)` ở khoá nào. Công thức 12.x–14.x dùng lại nguyên văn bản dịch tha-ap390 (Kilesā jhāpitā, Paṭisambhidā catasso, kataṁ buddhassa sāsanaṁ) trừ 12.3 bỏ chữ đời thanh tịnh vì Pāli chỉ có viharāmi anāsavo, và 13.1 đổi ta sang tôi theo giọng của bài.
  Đã kiểm 62/62 khoá khớp tập khoá và thứ tự Pāli, nháy kép “ ” khớp Pāli từng khoá (mở ở 1.1, đóng ở 14.3), NFC, không khoảng trắng thừa, không Pāli lọt sang bản Việt (ngoài tên riêng và đơn vị koṭi).
