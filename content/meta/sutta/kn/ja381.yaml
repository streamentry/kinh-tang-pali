notes: |-
  Lát c14. KHÔNG có Sujato tại commit đã ghim cho ja381 ⇒ `draft`, xem
  blocking_errors. Điển số thập phân Rà-la (động vật) đòi hỏi cốt truyện ở khoá 3.1-3.4
  (“Có những loài chim khác bay vút trên tầng trời”) mà tầng nào cũng không có.

  Tiền lệ có đếm và dùng lại: `Chakkanipāta` → “Bộ Sáu Bài Kệ” (9 bản, cả 9 đều nhất —
  không có cách thứ hai trong tầng); `Avāriyavagga` → “Phẩm Avāriya” (4/4);
  `Jātaka` → “Jātaka” (358).

  0 tiền lệ, phải tự đặt: `migālopa` (0 lần trong tầng Việt) — giữ nguyên Pāli theo mẫu
  các bài Jātaka chưa có tên Việt. `verambhānaṁ` (4.4, lưới bẫn / bẫy của thợ săn) và
  `gijjhovātīta` (6.4, giáo pháp giả dối hư hoại) cũng 0 tiền lệ.

  Bất định đã ghi:
  · `Atisīmacaro ditto` (6.3) — động từ `ati-sīma` + `caro`/`ditto` (bị vứt bỏ, bị dẫn đi),
    cụm này rối trong chính Pāli và tôi không tìm được bản song song để phân xử; tôi dịch
    theo nghĩa có thể chịu được (“bị đưa đi đâu và bị bỏ rơi như đồ vứt”) và ghi rõ ở đây.
  · `atuccaṁ` / `abhūmiṁ` (1.3-1.4) — cùng nghĩa “trên mặt đất”, lặp lại có chủ ý để
    nhấn; tôi giữ cả hai vế thay vì gộp.
  · `sassanā` (7 bản “Tóm lược các phẩm”) với `sassanāṁ` trong 5.4 là hai từ khác: ở
    khoá 7.1 là “tóm lược”, ở khoá 5.4 là “lời dạy”. Tôi dịch đúng nghĩa từng chỗ; đây là
    chỗ dễ bị một người dịch dùng chung một cách.

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  Giải quyết draft 2026-10-12: đọc đối kháng toàn bài từ Pāli và viết lại cả 26 khoá kệ 1.1-6.6 (các khoá 0.1-0.4 và 7.1 giữ nguyên); trong đó nghĩa sai thật ở ít nhất 20/26 khoá, phần còn lại sai xưng hô, vế câu hoặc thứ tự. Phần ghi chú cũ phía trên về `sassanā`, `verambhānaṁ` (“lưới bẫy / bẫy của thợ săn”), `gijjhovātīta` (“giáo pháp giả dối hư hoại”), `Atisīmacaro ditto` (“bị đưa đi và bị bỏ rơi”) và câu về “điển số thập phân” bị THAY THẾ bởi đoạn này; chúng dựa trên cách đọc sai.
  Sửa lỗi nghĩa thật (accuracy fix): (1) 1.3-1.4 `atuccaṁ … abhūmiṁ` là “bay quá cao / lui tới chốn chẳng phải là đất”, bản cũ dịch “đừng bước trên mặt đất” ngược nghĩa hoàn toàn; (2) 2.1-2.2 `catukkaṇṇaṁ kedāraṁ` là “thửa ruộng bốn góc” (mặt đất nhìn từ cao giống một thửa ruộng), bản cũ “bốn con đường nước … dòng chảy”; 2.4 `etto paraṁ` là “xa hơn chỗ này”; (3) 3.3 `akkhittā vātavegena` là “bị sức gió quăng đi” (cùng cấu trúc `verambhavātakkhittassa` ở sn17.9:1.5, “bị gió Verambhā quăng”), 3.4 `naṭṭhā … sassatīsamā` là “tiêu vong suốt những năm dài vô tận”, bản cũ “trong vòng trăm năm, ngươi không còn gì”; (4) 4.1-4.2 `apanandassa pitu vuddhassa sāsanaṁ`: Apananda là tên người cha già (đồng vị với `pitu vuddhassa`), bản cũ “lời dỗ dành”; 4.3-4.4 chủ thể là con chim bị gió Verambhā cuốn, không phải “tôi/ta”; (5) 5.4 `anovādakare dije` là mệnh đề định vị “vì con chim không làm theo lời khuyên dạy”, bản cũ “bị đời gọi là kẻ không biết nghe lời”; (6) 6.3-6.4 `atisīmacaro ditto gijjhovātītasāsano` là “đi quá giới hạn, kiêu căng, như con kền kền đã vượt qua lời dạy”, bản cũ “bị đưa đi đâu và bị bỏ rơi như đồ vứt … giáo pháp hư vọng”; 6.5-6.6 `sabbe byasanaṁ papponti, akatvā vuddhasāsanaṁ` bản cũ tách đôi nghĩa; (7) xưng hô: người cha nói với con dùng “ta … con” (bản cũ trộn “ngươi/con”); (8) thứ tự khoá: 6.6 phải đứng trước 7.1 theo Pāli (bản cũ để 6.6 ở cuối), nay `segment_alignment` đúng 10,0.
  Phân loại blocker: câu blocker duy nhất còn lại là loại (A), thiếu bản Anh upstream, được giữ nguyên vì là sự thật về bản chụp đã ghim; phần nói tầng Việt hiện hành vắng (loại C) chỉ là giới hạn tham chiếu, không phải lỗi văn bản, và không còn được tính là lỗi bản dịch. Không có blocker loại (D) vì các điểm khó đã được phân xử như dưới đây.
  Tiền lệ: `Verambhā` là tên loại gió trên cao (sn17.9:1.3 “trên trời có những cơn gió tên là Verambhā”, bản Việt dự án đã dùng “gió Verambhā”); giữ dạng đó. `kālavāta` dịch “gió Kāla” theo cùng quy ước tên gió. Kền kền (`gijjha`) dịch “con kền kền”.
  Bất định còn lại, không thêm vào thân kinh: (a) `akkhittā` đọc là `ākkhittā` “bị quăng đi” (theo sn17.9:1.5), nếu là `a-khittā` “không bị quăng” thì 3.3-3.4 phải đổi nghĩa; người dịch chọn cách đọc nhất quán với ngữ cảnh “chúng tiêu vong”; (b) `Apananda` hiểu là tên người cha già; bản Anh upstream không có để đối chiếu; (c) `kālavāte` có thể là “gió đen” (tính từ) thay vì tên gió; (d) `abhūmiṁ` (1.4) dịch sát “chốn chẳng phải mặt đất”, nghĩa bóng “nơi không phải chỗ của mình” không đưa vào thân kinh; (e) người nói ở 3.1-6.6 là một lời trích liền trong Pāli (mở ngoặc ở 3.1, đóng ở 6.6); không gán người nói. Do đó `ambiguity_integrity` 9,0 và `triangulation` ≤ 8,0 (7,5, chỉ có song song sn17.9 cho cụm gió Verambhā).
  Điểm: semantic_fidelity 9,1 → 8,8; grammar_logic 9,1 → 9,0; terminology 9,1 → 8,8; vietnamese_clarity 9,2 → 8,8; han_viet_balance 9,3 → 9,0; các điểm còn lại giữ nguyên. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` vẫn để coordinator chạy; `technical_integrity` giữ 9,6.

  Giải quyết draft 2026-10-13 (vòng 2): đọc đối kháng lại cả 31 khoá từ Pāli, đối chiếu cách xử lý của các khoá song song trong kho; không có khoá nào sai nghĩa thật (0/31). Hai chỉnh sửa rõ ràng (clarity fix, không đổi nghĩa): 2.2 `yadā te pathavī siyā` thành “khi mặt đất đối với con như thế” (bản trước đảo trật tự khó đọc); 3.1 `Santi aññepi sakuṇā` thành “Cũng có những loài chim khác” (bỏ “Còn … nữa” dư so với `aññepi`). Các khoá còn lại giữ nguyên sau khi kiểm từng câu: người cha già nói “Ta … con” ở 1.1-2.4; `atuccaṁ … abhūmiṁ` (1.3-1.4), `catukkaṇṇaṁ kedāraṁ` (2.1), `etto paraṁ` (2.4), `akkhittā vātavegena` (3.3), `apanandassa pitu vuddhassa sāsanaṁ` (4.1-4.2), `verambhānaṁ vasaṁ agā` (4.4), `anovādakare dije` (5.4) và `atisīmacaro ditto gijjhovātītasāsano` (6.3-6.4) đều đã đúng theo hình thái và cú pháp. Căn cứ thêm cho `Apananda` là tên người: kệ tóm tắt cuối phẩm Avāriya (ja385:9.3) liệt kê `Apananda` trong dãy tên chuyện của phẩm, tức là chuyện này được gọi theo tên ấy. Khoá 5.1-5.4 trùng Pāli nguyên văn với ja427:8.1-8.4; bản Việt của ja427 hiện còn lệch nghĩa ở đoạn này (ví dụ 8.4), nên không dùng làm tiền lệ và ghi ở đây để báo ngoài phạm vi tệp.
  Phân loại blocker vòng này: blocker cũ gộp hai sự thật; đã viết lại thành một blocker duy nhất, ngắn, đúng sự thật loại (A): Sujato không có tệp cho ja381 tại commit đã ghim (`not-published-upstream`), kèm việc tầng Việt hiện hành cũng vắng (loại C, chỉ là giới hạn tham chiếu). Không còn blocker loại (D): các điểm khó (`kālavāte` là tên gió hay tính từ; `akkhittā` đọc “bị quăng đi”; `sassatīsamā` là thời lượng “suốt những năm vĩnh hằng”; `abhūmiṁ` nghĩa đen “chốn chẳng phải đất”; `ditto` đọc “kiêu căng”; người nói ở 3.1-6.6) đều được ghi là bất định không đổi giáo nghĩa và giữ nghĩa sát nhất với Pāli, không đưa nghĩa phụ vào thân kinh. Giới hạn tham chiếu: Sujato không phát hành bản Anh cho bài; không có tầng `english-project`; mẫu số độ phủ (khoá Pāli có nội dung ≥ 40 ký tự) bằng 0 theo cách đo của kho, nên cổng độ phủ không đo được gì; mọi đối chiếu ngoài Pāli chỉ qua các bài song song ja427 và sn17.9.
  Điểm vòng 2: giữ nguyên toàn bộ 10 điểm (không có lỗi nghĩa mới, không có lý do nâng); `triangulation` 7,5 (≤ 8,0 vì không có bản Anh độc lập); `final_score` 8,98. `technical_integrity` giữ 9,6; bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 9 khoá chênh lệch lớn nhất → khác nghĩa 0: sửa 0, giữ 8 (2.1/2.2 bản mù đảo thứ tự hai dòng của phép so sánh, cùng nghĩa; 1.4, 2.3, 3.4, 4.3, 6.2, 0.4: chỉ khác diễn đạt; 4.3 `Kālavāte` cùng đọc là gió Kāla), bất định 1 (4.2 `apanandassa`: bản dự án và bản mù cùng đọc là tên người cha già, nhưng Pāli chỉ có một chữ ở cách sở hữu và tầng đã ghim không có truyện khung nên không phân xử được tên riêng hay tính từ). Review đối kháng toàn bài (31 khoá): nháy, số, dấu lược, xưng hô không có lỗi; không đổi khoá nào. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài, không có đoạn song song đã published; đọc lại cùng sn17.9 và ja427:8.1–8.4 như notes cũ): sửa 1 khoá, chỉ dấu câu — 6.6 dời dấu chấm ra sau nháy đóng theo Pāli. Không phát hiện lỗi nghĩa mới ở 31 khoá; 5.4 `anovādakare dije` (định cách tuyệt đối) dịch "vì chim ấy không làm theo lời khuyên dạy" giữ. Bất định giữ nguyên (a)–(e) của notes trước; lỗi ngoài phạm vi ja427:8.4 vẫn để người biên tập. Bổ sung: quét có hệ thống Pāli trùng toàn kho cho mọi khoá (11 khoá có song song: ja160:2.2, ja427:3.5–9.4, ja523:40.2, ja489:10.2, tha-ap393:190.2); sửa thêm 1.4 cho khớp dòng Pāli trùng nguyên văn đã published ja160:2.2 (`abhūmiṁ tāta sevasi` → "con lui tới chốn không phải của mình"), thay cho bản dịch sát chữ "chốn chẳng phải mặt đất" (bất định (d) cũ coi như đã phân xử theo tiền lệ). Các song song ja427:8.4, 9.2–9.4 lệch nghĩa ở phía ja427 (ngoài phạm vi, đã báo).

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
