  - Thuật ngữ (đếm trên tầng Việt hiện có, cùng Pāli):
    + `paṭhamaṁ/dutiyaṁ/tatiyaṁ/catutthaṁ jhānaṁ` → "thiền thứ nhất/hai/ba/tư" (105/88/82/95; so "sơ thiền/nhị thiền/tam thiền/tứ thiền" 82/59/57/66; "thiền thứ nhứt" 107 là biến thể chính tả).
    + `vitakka` → "tầm" (230 so "suy nghĩ" 58, "tư tưởng" 42), `vicāra` → "tứ"; `pītisukha` → "hỷ lạc" (176); `pīti` → "hỷ"; `savitakkaṁ savicāraṁ vivekajaṁ` → "có tầm, có tứ, với hỷ lạc do ly sinh" ("do ly sinh" 28).
    + `somanassindriya` "hỷ căn", `sukhindriya` "lạc căn", `dukkhindriya` "khổ căn" (26 so "căn khổ" 7), `domanassindriya` "ưu căn", `samādhindriya` "định căn" (ps1.1, mil3.1.9). `pīti` và `somanassa` đều là "hỷ" (636 và 246); ở `4.11` ("Yā pīti, taṁ somanassindriyaṁ") bản Việt thành "Hỷ nào, đó là hỷ căn": là sự đồng nhất mà Pāli nêu, không phải lặp từ.
    + `ekodibhāva` "sự hợp nhất" (tách khỏi `cittekaggatā`/`ekaggatā` "nhất tâm", 30; ở mn45:7.6 `ekodibhāvaṁ` là "tâm hợp nhất"); `vūpasama` "lắng dịu" (134); `ajjhattaṁ ceto sampasīdati` → "tâm lắng trong ở bên trong".
    + `alobha/adosa/amoha` "vô tham/vô sân/vô si" (13 "không tham" so 11 "vô tham", nên chọn theo chức năng gốc thiện); `abyāpāda`/`avihiṁsā` trong `vitakka` "không sân" (72) và "không hại" (34); `akusalamūla` "gốc bất thiện" (15 so "căn bất thiện" 3), `kusalamūla` "gốc thiện" (14).
    + `niggaṇhāti` "kiềm chế" (mil5.3.11); `paṭighāta` "chặn đứng" (ja425:9.3 "chặn giữ"); `paṭigha` "sự bực bội" (mil5.3.2) thay "sân" (55) để không đụng `dosa` "sân"; `anunaya` "sự quyến luyến" (mil3.2.4: "sự ưa thích"; mil5.3.12: "tham luyến"); `ādīnava` "hiểm họa" (137 so "nguy hiểm" 126).
    + `carita` → "tính" ở dạng "hạng người tính tham/sân/si…" (mil4.2 "tính tình tham/sân/si"); `puggala` → "hạng người" (334 so "người" 1309, "cá nhân" 686), vì ở đây là loại người; `samabhāgacarita` → "tính cân bằng giữa tham, sân và si".
    + `paṭisambhidā` "vô ngại trí" (an5.86, an5.95), `paṭibhāna` "biện tài", `nirutti` "ngữ từ"; `chandasamādhi`/`vīriyasamādhi`/`vīmaṁsāsamādhi` "định do ý muốn/tinh tấn/thẩm sát" (mn16:26, "khảo sát" ở mn16 đổi thành "thẩm sát" cho cùng nhóm với "định do tâm"); `cāga`/`sacca`/`paññā`/`upasama` + `adhiṭṭhāna` "ý lập xả/chân thật/tuệ/an tịnh" (mn140:11.3, 6 khoá); `appaṇihita/suññatā/animitta` "vô nguyện/tính không/vô tướng" (sn43.4, sn41.6, "tính không" 7 so "tánh không" 3); `sukhā paṭipadā dandhābhiññā` "thực hành lạc với thắng trí chậm" theo an4.161 ("thực hành lạc với tuệ chậm chạp"; `abhiññā` giữ "thắng trí" theo `ps1.1`).
