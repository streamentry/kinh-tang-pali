  - Lượt cải thiện 2026-10-13 (đọc đối kháng lại 78 khoá; 16 khoá đổi, 62 khoá giữ):
    + Thuật ngữ, theo số đếm lại trên tầng (thay các dòng "Thuật ngữ" ở trên khi khác): `ādīnava` → "nguy hại" thay "hiểm họa" ở `9.2`, `9.3` (nguy hại 548, nguy hiểm 121, tai họa 107, hiểm họa 34 khoá; trong Tiểu Bộ: nguy hại 215 so hiểm họa 22; dòng cũ "hiểm họa 137 so nguy hiểm 126" không tái lập được). `paṭisambhidā` (bốn vô ngại: `atthapaṭisambhidā`…) → "vô ngại giải" thay "vô ngại trí" ở `3.13` (nhóm công thức bốn vô ngại ngoài `ps`: giải 13, trí 4; `ps`: giải 115); `pe2:38` và `an5.86`/`an5.95` còn dùng "vô ngại trí", là việc của bài khác. `thinamiddha` → "hôn trầm và buồn ngủ" (dạng chiếm đa số, ≥ 97 khoá so 11 khoá "hôn trầm buồn ngủ"), `1.8` viết "Sân, cùng hôn trầm và buồn ngủ, thuộc phe sân" để không lặp "và". `puggalamūla` → "gốc của hạng người" (cùng `mūla` → "gốc" với `akusalamūla`) thay "căn bản" ở `1.6`. `vitakketi` → "tư duy" ở cả `2.1`–`2.3` lẫn `3.6`, `3.7` (trước đó "suy tầm" ở `3.6`–`3.7` lệch với "tư duy" ở `2.x`). `adhiṭṭhāna` ở `10.5`: kiểm lại 6 "ý lập" (`mn140`, `pe8`, `pe9`) so 6 "quyết định" (`dn33`, `ne36`), giữ "ý lập" theo `mn140` — hòa, không có đa số.
    + Cú pháp: `1.7` đặt "do gốc bất thiện là tham" làm vế chung cho cả ba (tham lam, trạo cử, sự bồng bềnh), không chỉ cho sự bồng bềnh; scope này theo cấu trúc song song với `1.8` (grammar_logic). `3.4` `vitakkayanto` là phân từ hiện tại, nên "vừa khởi tầm về những điều ấy, vừa xét kỹ thêm" thay cho "khởi tầm rồi xét"; "người có giới hạnh hay người ác giới" cho cân đối hai vế. `5.1` bỏ dấu gạch ngang và "như vậy" (là chữ `iti` đóng lời xét): "người ấy xét điều ấy rằng tâm hỷ là chấp thủ, và chỉ tác ý đến xả". `5.3` khôi phục `yathā` quan hệ: "Và lạc nào do hỷ đem đến, người ấy cảm nhận lạc ấy…". `7.1`–`7.3` `tassa X` dịch "người ấy có X", đồng với cách dịch `tassa` ở `9.1`.
    + Tiếng Việt: `3.3` `vicaraṇaṁ` "sự lưu chuyển" → "sự dạo khắp" (không gợi luân chuyển, và trùng `vicarati` "dạo khắp" ở `3.6`); `3.5` `anuvattati` "theo sát" → "theo sau" (theo tiền lệ "theo sau" của `ja532`; "anu" là sau, không có ý "sát").
    + Điểm đổi: `grammar_logic` 8.5 → 8.7 (1.7, 3.4, 5.1, 5.3, 7.x); `terminology` 9.0 → 9.2 (ādīnava, paṭisambhidā, thinamiddha, puggalamūla, vitakketi); `vietnamese_clarity` 8.8 → 9.0 (3.3, 5.1, 7.x, 1.7). `semantic_fidelity`, `ambiguity_integrity`, `triangulation`, `segment_alignment`, `han_viet_balance`, `source_provenance` giữ nguyên vì không có cải thiện tương ứng. `final_score` 8.86 → 8.92.
    + Bất định còn nguyên, không phân xử được bằng căn cứ trong kho (đã tra: `uppilavataṁ`, `paliko`, `daraṇitabba`, `ojahi`, `jallasahagata`, `tappoṇa…`, `jeṭṭhānaṁ` chỉ có ở bài này hoặc bài khác không soi sáng thêm; `uppilava` ở `mil3.7.2`/`mil7.2.6`/`snp3.10` xác nhận nghĩa "nổi lên/trôi nổi" nên giữ "bồng bềnh"): `1.6` `yena`, `yathā asamattho`; `1.7` `uppilavataṁ`; `3.9` `jeṭṭhānaṁ saṁvāraṇā`; `3.10` `paliko` ("người già" vẫn là phỏng đoán); `4.7`–`4.8`; `4.14`; `6.1`–`6.2` (sơ đồ lệch với thứ tự quen thuộc), `6.4`; `9.2`–`9.3` `ādīnavaṁ dassitā` (có thể là "thấy hiểm họa" hay `adassitā`); `10.7`–`10.10` (`sukhāya paṭipadāya` lặp bốn lần); `10.7` `anuvattanakāni` ("tùy thuận", hapax). Vì những chỗ ấy còn mở, không nâng `semantic_fidelity` và `ambiguity_integrity`.
    + Blocker `noEnglishEditionUpstream` giữ nguyên (sự thật về upstream); `technical_integrity` giữ 9.6, bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` vẫn chưa chạy ở bước này. Phép kiểm sau chỉnh sửa: tập khoá Việt = Pāli 78/78, cùng thứ tự; nháy đơn/kép, ngoặc, `…` khớp Pāli từng khoá 0/78 lệch; Pāli trùng nguyên văn trong bài 0 cặp (phép rỗng); NFC đạt, không khoá rỗng, không Pāli lọt sang Việt ngoài `0.1`.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem
  bản dự án; so 14 khoá chênh lệch lớn nhất → khác nghĩa 5: sửa 0, giữ 2 (6.4: bản mù đọc 'xả trở nên trong sáng
  nhờ bốn căn', trái với 6.5 nơi xả có được do bốn căn diệt, nên giữ cách nói trung tính 'với bốn căn'; 10.5:
  bản mù dịch `adhiṭṭhāna` là 'nền tảng', bản dự án giữ 'ý lập' theo mn140, pe8, pe9), bất định 3 (1.6 `yathā
  asamattho`: bản dự án đọc 'vì không đủ sức', bản mù đọc 'tùy theo hạng không đủ năng lực', Pāli không phân xử
  được và câu cũng nói `cha puggalamūlāni` nhưng liệt kê bảy hạng; 3.10 `paliko` chưa xác định, bản dự án đọc
  'người già', bản mù giữ phiên âm; 4.8 `daraṇitabbaṁ`: 'dẹp trừ' hay 'xé bỏ'). 9 khoá còn lại chỉ khác diễn
  đạt; trong đó 9.2 và 9.3 `ādīnavaṁ dassitā` hai bản cùng đọc 'nguy hại được chỉ ra', nhưng Pāli cũng có thể là
  'không thấy nguy hại', chưa phân xử. Không có bản Anh hay bản Việt độc lập khác.
  - Lượt rà soát 2026-10-15 (Claude Opus 5.5 (Claude Code), đọc đối kháng Pāli↔Việt 78 khoá; đoạn song song `dn33:1.10.15` cho `3.2`): sửa 0 khoá; giữ nguyên cách dịch ở `1.6`, `1.7`, `3.4`, `3.10`, `4.7`, `4.14`, `6.5`, `9.2`–`9.3`, `10.7`–`10.10` (các chỗ đã ghi ở mục Chỗ bất định, không có bằng chứng Pāli mới để đổi). Kiểm lại số lượng (7 hạng người, 4 thiền, 5+4+5+4 chi), phủ định (`na`, `a-`) và chủ thể ở `8.1`–`9.3`: khớp Pāli. Không có bản Việt nguyên bài hay bản Anh để đối chiếu; `triangulation` giữ nguyên. Bất định: `3.10` `paliko` và `4.8` `daraṇitabbaṁ` vẫn chưa xác định được; không đổi.

  Nghiên cứu nguồn ngoài 2026-10-16: Ñāṇamoli, The Piṭaka-Disclosure (Peṭakopadesa), PTS 1964, https://ancient-buddhist-texts.net/Reference/PTS/Nyanamoli-Pitaka-Disclosure.pdf (bản scan, đọc qua OCR của người làm; còn bản quyền PTS; chỉ làm bằng chứng nghĩa); Indacanda, Peṭakopadesa song ngữ, https://tamtangpaliviet.net/TTPV/ttpv_44_Pet.pdf (NOASSERTION; chỉ làm bằng chứng nghĩa; lưu ý Indacanda có chỗ nhận hiệu đính của Ñāṇamoli nên không hoàn toàn độc lập với PD); DPD https://dpdict.net (jalla); đã đọc đối chiếu toàn bài (§§573–599 của Ñāṇamoli, tức pe7 trọn vẹn) với Pāli↔Việt; Indacanda đọc từ khoá `3.8` đến hết, chưa đọc phần `1.1`–`3.7`; sửa `3.10` `paliko tuṇhiko sajjhāyaṁ karoti` (bản cũ "người già" không có cơ sở: Ñāṇamoli dịch người đọc tụng văn bản, chú giải `palim adhīte`, Indacanda "vị đọc tụng"; nay "người học thuộc văn bản"), `6.4` `upekkhā pasādā hoti` (bản cũ "xả trở nên trong sáng" mâu thuẫn câu sau `tesaṁ nirodhā upekkhāsampajaññaṁ hoti`; Ñāṇamoli, chú giải `upekkhā asuddhā hoti` và Indacanda "sự không trong sáng của hành xả là do bốn quyền" đều hiểu xả chưa trong sáng vì bốn căn; nay "xả chưa được trong sáng"), `10.7` `anuvattanakāni cattāri` (bản cũ "bốn thiền tùy thuận"; Ñāṇamoli và Indacanda đều hiểu là bốn căn còn lại theo sau định căn; nay "bốn (căn) tùy thuận"); bất định `4.7`–`4.8` `dve dhammānussaritabbā, paccuppannādaraṇitabbaṁ` (Ñāṇamoli "không còn cần nhớ" và "nay có thể phụng sự", chú giải `ādaraṁ netabbaṁ`, Indacanda "không cần được quan tâm": ba hướng khác nhau, giữ "hồi tưởng" và "dẹp trừ" chưa có nguồn xác nhận), `4.14` `jalla` (DPD "bùn, bẩn ướt"; Ñāṇamoli "ướt", Indacanda "thấm ướt"; giữ "cáu bẩn"), `6.1`/`10.4` (Ñāṇamoli đề nghị đọc `domanassindriya`/`dukkhindriya` ở một số chỗ; chữ ghim và Indacanda giống nhau nên giữ), `5.5` "bốn chi" (Ñāṇamoli đề nghị năm chi, chữ ghim `caturaṅga`), `9.2` (Bb, Ba thêm `assādaṁ dassitā`, chữ ghim `ādīnavaṁ`).
