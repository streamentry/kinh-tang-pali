  - Tiền lệ cùng bộ (`pe`):
    Không có bài `pe` nào đã dịch trong tầng (pe1–pe9 đều chưa có bản Việt tại thời điểm dịch), nên tiêu đề và hình thức tiêu đề do bài này đặt ra. `0.1` "Peṭakopadesa" giữ nguyên dạng Pāli theo cách giữ tên bộ của `ne*` ("Netti"), `mil*` ("Milindapañha"), `ps1.1` ("Paṭisambhidāmagga"). `0.2` "Pakiṇṇakaniddesa" → "Phần Giải Thích Tạp Tập": `niddesa` theo `ne*:0.2` ("Phần Giải Thích" cho `Paṭiniddesavāra`, 21 tệp `ne` đã dịch), `pakiṇṇaka` theo `ja490:0.2` ("Bộ Tạp Tập" cho `Pakiṇṇakanipāta`); `11.1` dùng cùng cách. Tên Sujato "Miscellaneous Exposition" khớp hướng "tạp" này. Các bài `pe` khác nên giữ cùng cách đặt 0.1 để nhất quán.
  - Pāli trùng nguyên văn:
    Dò Pāli của 78 khoá với toàn bộ Pāli đã ghim: 2 khoá có Pāli trùng ở bài khác (`0.1` trùng `pe1`–`pe9`; `3.2` trùng `ne36:59.29`); cả hai nơi đều chưa có bản Việt, nên 0 khoá dùng lại nguyên văn, 0 cặp bản Việt khác. Trong chính bài: 0 cặp Pāli trùng nguyên văn (phép chạy rỗng, không phải "0 lỗi").
  - Thuật ngữ (đếm trên tầng Việt hiện có, cùng Pāli):
    + `paṭhamaṁ/dutiyaṁ/tatiyaṁ/catutthaṁ jhānaṁ` → "thiền thứ nhất/hai/ba/tư" (105/88/82/95; so "sơ thiền/nhị thiền/tam thiền/tứ thiền" 82/59/57/66; "thiền thứ nhứt" 107 là biến thể chính tả).
    + `vitakka` → "tầm" (230 so "suy nghĩ" 58, "tư tưởng" 42), `vicāra` → "tứ"; `pītisukha` → "hỷ lạc" (176); `pīti` → "hỷ"; `savitakkaṁ savicāraṁ vivekajaṁ` → "có tầm, có tứ, với hỷ lạc do ly sinh" ("do ly sinh" 28).
    + `somanassindriya` "hỷ căn", `sukhindriya` "lạc căn", `dukkhindriya` "khổ căn" (26 so "căn khổ" 7), `domanassindriya` "ưu căn", `samādhindriya` "định căn" (ps1.1, mil3.1.9). `pīti` và `somanassa` đều là "hỷ" (636 và 246); ở `4.11` ("Yā pīti, taṁ somanassindriyaṁ") bản Việt thành "Hỷ nào, đó là hỷ căn": là sự đồng nhất mà Pāli nêu, không phải lặp từ.
    + `ekodibhāva` "sự hợp nhất" (tách khỏi `cittekaggatā`/`ekaggatā` "nhất tâm", 30; ở mn45:7.6 `ekodibhāvaṁ` là "tâm hợp nhất"); `vūpasama` "lắng dịu" (134); `ajjhattaṁ ceto sampasīdati` → "tâm lắng trong ở bên trong".
    + `alobha/adosa/amoha` "vô tham/vô sân/vô si" (13 "không tham" so 11 "vô tham", nên chọn theo chức năng gốc thiện); `abyāpāda`/`avihiṁsā` trong `vitakka` "không sân" (72) và "không hại" (34); `akusalamūla` "gốc bất thiện" (15 so "căn bất thiện" 3), `kusalamūla` "gốc thiện" (14).
    + `niggaṇhāti` "kiềm chế" (mil5.3.11); `paṭighāta` "chặn đứng" (ja425:9.3 "chặn giữ"); `paṭigha` "sự bực bội" (mil5.3.2) thay "sân" (55) để không đụng `dosa` "sân"; `anunaya` "sự quyến luyến" (mil3.2.4: "sự ưa thích"; mil5.3.12: "tham luyến"); `ādīnava` "hiểm họa" (137 so "nguy hiểm" 126).
    + `carita` → "tính" ở dạng "hạng người tính tham/sân/si…" (mil4.2 "tính tình tham/sân/si"); `puggala` → "hạng người" (334 so "người" 1309, "cá nhân" 686), vì ở đây là loại người; `samabhāgacarita` → "tính cân bằng giữa tham, sân và si".
    + `paṭisambhidā` "vô ngại trí" (an5.86, an5.95), `paṭibhāna` "biện tài", `nirutti` "ngữ từ"; `chandasamādhi`/`vīriyasamādhi`/`vīmaṁsāsamādhi` "định do ý muốn/tinh tấn/thẩm sát" (mn16:26, "khảo sát" ở mn16 đổi thành "thẩm sát" cho cùng nhóm với "định do tâm"); `cāga`/`sacca`/`paññā`/`upasama` + `adhiṭṭhāna` "ý lập xả/chân thật/tuệ/an tịnh" (mn140:11.3, 6 khoá); `appaṇihita/suññatā/animitta` "vô nguyện/tính không/vô tướng" (sn43.4, sn41.6, "tính không" 7 so "tánh không" 3); `sukhā paṭipadā dandhābhiññā` "thực hành lạc với thắng trí chậm" theo an4.161 ("thực hành lạc với tuệ chậm chạp"; `abhiññā` giữ "thắng trí" theo `ps1.1`).
    + `thinamiddha` "hôn trầm buồn ngủ" (ud4.2 "hôn trầm và buồn ngủ"); `uddhaccakukkucca` tách "trạo cử" và "hối tiếc" (iti111 "xao động và hối tiếc").
  - Số Pāli:
    `cattāri jhānāni` 4; `duvidhāni`/`duvidhaṁ` 2; `cha puggalamūlāni` 6 nhưng danh sách ngay sau đó nêu 7 hạng (rāga, dosa, moha, rāgadosa, rāgamoha, dosamoha, samabhāga) và `10.1` `sattasu puggalesu` 7: giữ đúng hai con số của Pāli, không sửa; "sáu căn bản" có thể là sáu hạng pha trộn đơn/đôi đối với hạng thứ bảy là cân bằng. `tīṇi akusalamūlāni` 3; `tayo vitakkā` 3; `pañcaṅgavippahīnaṁ` 5 chi; `caturaṅgasamannāgataṁ` 4 chi (4.13, 5.5); `catūhi indriyehi` 4; `tiṇṇaṁ puggalānaṁ` 3; `catūsu samādhīsu` 4. Bài không có số lớn; không có cụm cần phân xử.
  - Chỗ bất định (không thêm vào thân kinh):
    + `1.1` `Jhānaṁ virāgo`: hai danh từ cách 1 đặt cạnh nhau, không hệ từ; dịch "Thiền, ly tham." để giữ nguyên tính mơ hồ (tiêu đề chủ đề, hay "thiền là ly tham").
    + `1.6` `yena cha puggalamūlāni tesaṁ nikkhipetvā`: "yena" không có tương quan rõ; dịch "nhờ đó… sau khi nêu ra sáu căn bản của hạng người, trong số ấy có". `yathā asamattho` đọc là "vì không đủ sức" (a-samattha); nếu bản khác đọc `yathāsamatthaṁ` thì nghĩa là "tùy sức".
    + `1.7` `uppilavataṁ`: dịch "sự bồng bềnh" (nổi lên, bất định), chưa tra được nghĩa kỹ thuật chắc chắn.
    + `3.5` `vicāro vitakke appeti`: "gắn vào tầm" (appeti = đặt, gắn vào).
    + `3.6` `āyūhati/anupālati/vitakketi/vicarati/vicāreti`: dịch từng động từ theo nghĩa thường, "gắng sức; gìn giữ, suy tầm, dạo khắp, dò xét"; không giải thích thêm.
    + `3.9` `jeṭṭhānaṁ saṁvāraṇā`: `jeṭṭha` đọc là "hàng đầu", có thể là "bậc trưởng/ điều chính yếu".
    + `3.10` `paliko`: chưa xác định được (có thể `palita` "người già" hay liên quan `pāḷi`); dịch "người già", cần người biên tập kiểm.
    + `4.5` `tassa vicārārammaṇaṁ`: mảnh câu; dịch "Với người ấy: đối tượng của tứ".
    + `4.8` `paccuppannā daraṇitabbaṁ`: `daraṇitabba` chưa gặp ở tầng Pāli đã ghim; dịch "cần được dẹp trừ" (cả "làm lắng dịu" lẫn "phá bỏ" đều có thể).
    + `4.14` `yāti ojahi jallasahagataṁ`: văn bản có vẻ hỏng; dịch từng chữ ("tiến đến; đã bỏ lại điều đi kèm với cáu bẩn"), `ojahi` đọc như aorist của `ava + jahāti`, `jalla` "cáu bẩn".
    + `5.1` `somanassacittamupādānanti ca`: "tâm hỷ là chấp thủ — người ấy cân nhắc điều ấy như vậy".
    + `5.3` `sukhamānitaṁ`: đọc là `sukhaṁ ānitaṁ` ("lạc được đem đến"); cách khác là `sukhāyitaṁ`.
    + `6.1`–`6.2`: bài nêu hỷ căn diệt ở thiền thứ nhất, khổ căn ở thiền thứ hai; lệch với sơ đồ Abhidhamma quen thuộc nhưng Pāli ghim là vậy, dịch đúng như Pāli (không điều chỉnh).
    + `6.4` `catūhi indriyehi … pasādā`: dịch "với bốn căn — … — xả trở nên trong sáng", giữ cách chỉ cách công cụ mơ hồ.
    + `6.5` `upekkhāya ca saññā`: "tưởng về xả" (cũng có thể là "tên gọi").
    + `9.2`, `9.3` `ādīnavaṁ dassitā`: dịch theo Pāli ghim ("hiểm họa được chỉ ra"); ngữ cảnh (thoái giảm) gợi ý bản gốc có thể là `adassitā` ("không thấy hiểm họa"), chưa dám sửa.
    + `10.7`–`10.10`: cả bốn đều ghi `sukhāya paṭipadāya`, trong khi `dandhābhiññā`/`khippābhiññā` xen kẽ; giữ như Pāli, không giả định có `dukkhāya`. `10.7`–`10.9` không có động từ chính (chỉ `10.10` có `gato`); dịch bỏ động từ.
    + `8.1`: thiền thứ ba/tư diệt `anunaya` cho hạng người tính tham, thiền thứ nhất/hai diệt `paṭigha` cho hạng người tính sân; giữ như Pāli.
