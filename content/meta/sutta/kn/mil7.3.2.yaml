notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Pāli có nháy kép mở lơ lửng ở 1.2, 2.2, 3.1, 3.2; bản Việt bỏ các nháy lơ lửng ấy theo khuôn mil7.3.1 và chỉ giữ nháy ở 1.1 và 3.4, cân trên cả bài.

  Tiền lệ có đếm và dùng lại: Opammakathāpañha → Câu hỏi về cách dùng dẫn với ví dụ (20); Samuddavagga → Phẩm Biển (3, y hệt mil7.3.1); paduma → hoa sen (37); câu hỏi về những phần của… theo đúng khuôn mil7.3.1 Câu hỏi về phần của cây leo và mil7.6.3; Opammaṁ karohī → Hãy làm một ví dụ; anupalitta → không nhuốm bẩn; accuggamma → nhô lên; Puna caparaṁ → Nữa nữa, khớp mil6.3.7.

  Ba chi phần phải giữ đủ cả mặt tích cực và tiêu cực thì ví dụ mới đúng, nên không cắt: một là không nhuốm bẩn trong gia đình, tập thể, lợi đắc, danh vọng, sự cung kính, sự kính trọng và các duyên của sự thọ dụng; hai là sau khi thắng trị cõi thế gian thì phải nhô lên ở các pháp cao thượng hơn thế gian; ba là phải biết giữ chế ngự ngay cả khi phóng dật và phải sống biết sợ hãi. 3.4 giữ nguyên lời dạy Đức Thế Tôn, bậc Thiện Nhân, về điều phải học tập và ghi nhớ điều hãy phòng hộ trong các điều nhỏ bé, đúng sắc thái bảo hộ.

  0 tiền lệ, đặt mới: erita → bị gió thổi bay; appamattakenapi → kể cả khi phóng dật. paribhogapaccaya dịch là các duyên của sự thọ dụng để giữ đúng quan hệ với paribhoga và không dịch chết.

