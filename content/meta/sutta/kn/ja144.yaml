notes: |-
  Đủ 9/9 khóa. naṅguṭṭha → đuôi (đuôi nhiều tiền lệ); tên bài Kinh Cái Đuôi
  là đặt mới, chưa có tiền lệ. Jātaveda giữ nguyên tên gọi (danh xưng của
  thần Lửa, có trong Pāli đoạn). asabbhi → kẻ chẳng lành; maṁsāraha → bậc
  đáng nhận thịt; bhavaṁ paṭiggaṇhātu → xin ngài nhận lấy.
  vāladhi 0 tiền lệ: dịch là quạt đuôi theo tiền lệ quạt đuôi trâu ở
  dn1 (vật phẩy bằng lông đuôi), chưa chắc chắn hẳn là cùng một vật; cần
  từ điển hoặc bản song song mới nâng điểm terminology được.
  Ngôi chúng tôi ở 1.2 là chủ ngữ bắt buộc của tiếng Việt cho động từ số
  nhiều abhipūjayāma, không thêm nghĩa. Sujato trống cả 9 khóa → Pāli đơn
  tuyến, giữ draft.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): sửa 1.1–1.2: asabbhi là hô ngữ đi với
  Jātaveda ("hỡi Jātaveda xấu xa"), không phải "từ kẻ chẳng lành này"; vāladhi là cái đuôi, "chiếc
  quạt đuôi" không có căn cứ trong Pāli; taṁ là "ngài" (tân ngữ của abhipūjayāma).
