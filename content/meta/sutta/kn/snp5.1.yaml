notes: |-
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17 (Cūḷaniddesa không giải Vatthugāthā; đối chiếu với bản chép cnd1): sửa 12.1–12.2, 25.1–25.2, 26.1–26.2, 30.1–30.4, 48.3–48.4, 49.1–49.4, 50.1–50.2 (lệch ranh khoá: bản Việt theo thứ tự dòng của bản Anh nên mỗi khoá mang nội dung dòng Pāli khác, ví dụ 49.1 'Ko nu devo vā brahmā vā' mang 'Ai đã hỏi những câu hỏi bằng tâm?'; dịch lại từng dòng theo Pāli, dùng câu đã có của cnd1 cùng dòng Pāli, như cnd1 notes đã đề nghị); 29.4 bỏ dấu nháy đóng thừa (lời Bāvari kéo dài đến 30.4, Pāli 29.4 không có nháy); 38.2 'Vesāliṁ māgadhaṁ puraṁ' là hai địa danh, không phải đồng vị ('Vesālī, thành của xứ Magadha' → 'Vesālī và thành của xứ Magadha'; Sujato 'Vesālī and the Magadhan city', cnd1:38.2).
