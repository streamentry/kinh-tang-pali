  Sửa lan 2026-10-13: khoá 4.2 «đổi điều bất định lấy điều chắc chắn;» → «đổi điều chắc chắn lấy điều bất định;» (accuracy fix). Căn cứ: 4.1–4.2 là hai vế song song cùng cấu trúc nimināti «X (đối cách, thứ nhận) Y (công cụ cách, thứ bỏ)» — 4.1 asanthutaṁ maṁ cirasanthutena, 4.2 adhuvaṁ dhuvena: nàng Sāmā nhận «ta, kẻ mới quen» / «điều bất định» và bỏ «người quen lâu» / «điều chắc chắn». Bản cũ 4.1 đã đúng chiều («đổi người tình lâu năm để lấy ta») nhưng 4.2 đảo chiều nên hai vế đọc ngược nhau. Đối chiếu ja374:2.1–2.2 (Pāli trùng nguyên văn, chỉ khác bhotī/sāmā): «đã đổi người quen biết lâu năm để lấy ta … đã đổi cái vững bền để lấy cái không vững bền». 4.1, 4.3, 4.4 giữ nguyên (đo: 4.3 mayāpi … nimineyya aññaṁ cùng mẫu, «bỏ ta để lấy người khác»).

  Quyết định hội đồng biên tập 2026-10-16: C1 — `0.4`, `5.1` và translationTitle (tiêu đề giữ "Kinh X", bỏ đuôi "jātaka" hoặc "Chuyện Tiền Thân"; cùng tên Pāli thì cùng tên Việt); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
