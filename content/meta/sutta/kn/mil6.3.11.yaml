notes: |-
  Đã đọc HẾT p84.txt (912 dòng, cả 6 bài của lát) trước khi viết chữ nào. Bài này
  50 khoá, 42 khoá Pāli có nội dung (≥ 40 ký tự sau nén, bỏ khối tham chiếu `:0`).

  COVERAGE ĐO ĐƯỢC. Đúng công thức `src/lib/canon/reference.ts` với
  `source/layers.yaml` (`substantivePaliMinChars: 40`, `excludeReferenceBlock: true`):
  substantive = 42, có chữ ở tầng Anh đã ghim = 0 ⇒ ratio = 0.0000 (ngưỡng `floor: 0.8`).
  Đây là lý do `draft`, không phải lỗi dịch.

  BỐN THÍ DỤ (4.1–7.5) lặp đúng khuôn `Yathā…evameva…` rồi ba câu
  `daṭṭhabbaṁ / daṭṭhabbo / daṭṭhabbā`. Tôi dịch bốn cụm giống nhau theo cùng cách
  (không tạo bốn cách khác nhau), nhưng giữ khác nhau đúng những gì Pāli khác nhau:
  `:4` lửa ba ngọn, `:5` đàn thú trên đống xác tro, `:6` cơn sóng sợ hãi, `:7` bùn
  lầy nhão.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ. `“Bhante nāgasena, tumhe bhaṇatha—` trùng nguyên văn ở
  11 bài, đa số là `“Bạch ngài Nāgasena, các ngài từng nói—` (mil5.2.6, mil5.2.8,
  mil5.3.8, mil6.2.2, mil6.2.3) — dùng lại đúng chuỗi ấy ở `:1.1`.
  `“Sādhu, bhante nāgasena, evametaṁ tathā sampaṭicchāmī”ti.` — bài CÙNG PHẨM
  mil6.3.9:4.11 đã có đúng `“Lành thay, thưa ngài Nāgasena, đúng là như vậy, trẫm xin
  kính nhận”ti.` (giữ cả đuôi `”ti.`), nên tôi dùng lại nguyên văn ở `:12.2`.

  NHÁY KÉP — BÀI NÀY CÓ CÁI BẪY THẬT. Pāli `:2.2` mở `“` và KHÔNG đóng ngay; nó
  được đóng bởi `”` ở `:12.1`, vì Nāgasena đang trích lại chính lời mình đã dặn
  Đại vương đừng bày ra ở `:2.1`. Bản nháp đầu tiên đóng nháy ở `:2.2` thì bộ chốt
  báo lệch. Đã sửa theo đúng cách SuttaCentral chia khoá: `“` mở ở `:2.2`, đóng ở
  `:12.1`; trong đó `:12.1` còn có một cặp `‘…’` bao lấy tên gọi `‘đã chứng ngộ
  Niết-bàn’ti` đúng như Pāli (`‘nibbānaṁ sacchikarotī’ti`). Tổng: Pāli `“`=5 `”`=5,
  `‘`=6 `’`=6; bản Việt cân đúng. Không có dấu lược nào trong bài (đếm bằng `lược()`
  = 0).

  LỖI BẢN NHÁP BẮT ĐƯỢC KHI REVIEW ĐỐI KHÁNG (4 chỗ, đã sửa hết):
  (1) `:5.3` — nháp đầu tiên dịch cả vế `evaṁ pañca kāmaguṇā daṭṭhabbā` thành “bãi
  rác phải được nhìn thấy là bãi rác”, làm MẤT đối tượng so sánh. Đúng ra: dục trần
  năm món phải được nhìn thấy là đống xác chết. Đây là lỗi nặng nhất của lát.
  (2) `:7.3` — cùng lỗi: mất `evaṁ lābhasakkārasiloko daṭṭhabbo`, còn lại “nhão
  phải được nhìn thấy là nhão”. Đã sửa thành “cõi được lợi và danh tiếng cũng phải
  được nhìn thấy là nhão”.
  (3) `:10.1` — `sabbūpadhipaṭinissaggo` không phải “sự dứt bỏ hết thảm bám”.
  `upadhi` có tiền lệ rõ (ud3.10:7.1 “nương vào sanh y”), đã sửa thành “sự chấm dứt
  tận cùng của sanh y”.
  (4) `:4.2` — `tividhaggi` là lửa BA ngọn (tiền lệ mil5.4.5:3.2 “ba ngọn lửa thiêu
  đốt”); nháp đầu tiên bỏ mất số ba. Đã sửa.
  Ngoài ra `paramasukha` đã sửa từ “chỗ tối thượng” thành “chỗ an lạc tối thượng”
  ở cả 8 chỗ, vì `sukha` là “an lạc” (87 khoá) và `paramasukha` không phải từ Hán
  Việt riêng.

  BẤT ĐỊNH ĐÃ GHI. (1) `:5.1` `ahikukkuramanussakuṇapasarīravaḷañjakoṭṭhāsarāsigato`
  — 0 tiền lệ trong toàn tầng Việt, và tôi KHÔNG nhận ra chắc chắn từng loài thú nào
  (chỉ chắc `ahikukkura` là rắn chuột, `kuṇapa` là xác chết). Vì vậy tôi dịch ở mức
  nghĩa “đàn thú dữ vây tới từ cạnh phía” và giữ chắc chắn phần sau
  `kuṇapajaṭājaṭitantaramanupaviṭṭho` = “rơi vào đống xác chết, tro và bụi bặm”. Tôi
  KHÔNG bịa danh sách loài; nếu người biên tập muốn nêu loài thì phải tra nguồn
  từ điển trước. (2) `:3.2` `santato sukhato sātato paṇītato sucito sītalato` — 0 tiền
  lệ cho cả chuỗi tính từ này; tôi dịch “thường còn ở, là an lạc, là điều lành, là
  thanh tịnh, là thuần khiết, là mát mẻ”, giữ thứ tự để mạch đối xứng còn nguyên.
  `sātato` tôi dịch “điều lành” vì `sāta` là điều tốt lành, không phải “thuần tuệ”.
  (3) `:11.1` `vippanaṭṭho videsapakkhando` — 0 tiền lệ; `videsa` là kẽ rạch nứt,
  không chắc là vết thương, nên tôi dịch “đã bị đập gãy, nứt rách” và không thêm
  chi tiết nào.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `sukha` → “an lạc” (87 khoá, đa số); `upadhi` → “sanh
  y” (ud3.10:7.1); `lābhasakkārasiloka` → “cõi được lợi và danh tiếng” (mil7.2.6:4.2
  “cõi thế gian có lợi và được tôn kính”, mil7.3.10:4.2); `kāmaguṇā` → “dục trần năm
  món” (mil6.3.9:2.4); `tividhaggi` → “ba ngọn lửa thiêu đốt” (mil5.4.5:3.2);
  `asaṅkhatā nibbānadhātu` → “thắc trắc Niết-bàn chưa vô ngại” (mil6.3.8 đã dùng đúng
  nghĩa này); `nibbāna` → “Niết-bàn”; `sacca` → `”ti` giữ nguyên.

