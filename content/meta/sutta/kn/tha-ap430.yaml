notes: |-
  Dịch trực tiếp từ Pāli root, 141/141 khoá, không có khoá ngoài tập Pāli. Ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng cho uid này. Có đọc đối chiếu nghĩa với bản Việt nguyên bài của Bhikkhu Indacanda ở mục Tra cứu toàn văn; bản đó không căn theo segment, không phải tầng store và không cấp text, nên chỉ nâng triangulation lên 7.8 chứ không hơn. Hai chỗ bản nguyên bài khác Pāli: nó ghi vị Phật thọ ký là Tissa trong khi Pāli ghim ở `:8.1` là Padumuttaro (theo Pāli, Padumuttara; tha-ap424 cũng ở Haṁsavatī và cũng là Padumuttara), và nó dịch `Satānaṁ tīṇikkhattuñca` đúng là ba trăm lần. Pāli thắng.
  Đủ 10 tiêu chí; final_score = (9.5+8.9+9.0+10.0+9.0+7.8+9.0+9.2+8.9+9.6)/10 = 9.09 (trung bình số học thô); status bắt buộc draft vì blocker tầng Anh vắng. technical_integrity 9.6 vì người dịch bị cấm chạy cổng. Bốn lệnh còn lại CHƯA chạy: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
  Tiêu đề: `:0.3` Pāli `Sucintitattheraapadāna` không bắt đầu bằng số nên không có số thứ tự; `translationTitle` bằng đúng giá trị `:0.3`. Công thức tên bài: phạm vi gần nhất (cùng phẩm, `tha-ap427`–`tha-ap432`) 5 Tuyên Ngôn · 0 Ký Sự · 0 Tuyên Ngợ; cả phẩm (`tha-ap423`–`tha-ap432`) 5 Tuyên Ngôn · 4 Ký Sự; phạm vi rộng (`tha-ap418`–`tha-ap442`) 9 Tuyên Ngợ · 8 Ký Sự · 6 Tuyên Ngôn; toàn tầng tha-ap 255 Tuyên Ngợ (sai chính tả) · 136 Tuyên Ngôn · 132 Ký Sự. Hai phạm vi cho hai đa số khác nhau; chọn Tuyên Ngôn (đúng chính tả, đa số trong chính phẩm); cần biên tập phán một lượt cho cả cuốn. `:0.2` Phẩm Sakiṁsammajjaka (9/9 chỗ trong tầng).
  Tên Trưởng lão: giữ Pāli, dạng gốc từ `Sucintita` (như Ekadhammassavaniya ở tha-ap429 và Sovaṇṇakiṅkaṇiya ở tha-ap431); tiền lệ duy nhất cho đúng Pāli `Sucintitattheraapadāna` và `sucintito thero` là tha-ap68 dùng dạng `Sucintito` (1 chỗ ở `:0.3`, 1 chỗ ở lời kết, cùng với Tuyên Ngợ sai chính tả); bài này theo dạng gốc từ, nếu biên tập muốn đồng nhất thì sửa tha-ap68 hoặc bài này. Nghĩa của tên (su + cintita) là suy luận, không đưa vào thân kinh.
  Lời kết `Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti` dịch `đã nói những bài kệ này` (nhóm số nhiều, khớp `imā gāthāyo`): đo ở tầng tha-ap 527 khoá số nhiều so với 2 khoá số ít; không dùng nhóm số ít.
  Số Pāli, tự tính (mẫu số 9/9 khớp): `dvattiṁsa` = dvā 2 + tiṁsa 30 = 32 → ba mươi hai tướng; `Saṭṭhiyojana` saṭṭhi 60 → sáu mươi do-tuần; `tiṁsayojana` tiṁsa = 30 → ba mươi do-tuần (tiṁsa là ba mươi, không phải ba); `Ekūnavīsati` = vīsati 20 − 1 = 19 → phần tụng thứ mười chín; `Satānaṁ tīṇikkhattuṁ` = sata 100 × 3 = ba trăm lần (tha-ap539:18.1 và tha-ap541:17.1 cùng dịch ba trăm lần; tha-ap413:21.1 Và ba trăm lần); `Satānaṁ pañcakkhattuṁ` = 100 × 5 = năm trăm lần (tha-ap539, tha-ap541: năm trăm lần); `Aṭṭhānisaṁse` = aṭṭha 8 → tám điều lợi ích; `Satasahassito kappe` = sata 100 × sahassa 1000 = 100.000 → một trăm ngàn kiếp; `catasso` = bốn; `aṭṭhamaṁ` = thứ tám. Bài không có Tiṁsakappasahassa.
  Dùng lại nguyên văn: 55/61 khoá có Pāli trùng ở tầng kn (mẫu số: 138 khoá thân kinh, bỏ khối :0; đã dò 5.698 cặp Pāli trùng; 890 cặp trong đó bản Việt khác — chủ yếu khác đại từ tôi/ta/con và biến thể diễn đạt, không đếm là lỗi). Sáu khoá không dùng lại có chủ ý: `:1.2` (tha-ap321 dịch `ahosiṁ kassako tadā` là lúc ấy ta là dân làng ở đó — kassaka là người làm ruộng, không phải dân làng, nên bài này dịch người làm ruộng); `:14.1` và `:18.2` (tiền lệ tôi; đổi sang ta để thống nhất đại từ cả bài); `:17.3` (tiền lệ năm trăm lần thiếu chữ Và của Pāli `-ñca`; thêm Và theo tha-ap413); `:23.2` (tiền lệ tha-ap109 `không còn khó chịu nào` thuộc ngữ cảnh khác; pariḷāha dịch nhiệt não theo snp3.11); `:35.1` (Sucintito → Sucintita, xem trên).
  Đại từ: ngôi thứ nhất dùng ta xuyên suốt (ahaṁ) cho thống nhất trong bài; tiền lệ tầng không đồng nhất (ví dụ `cakkavattī ahosahaṁ` 11 tôi · 4 ta; `Bhoge me ūnatā natthi` 5 ta · 2 tôi · 1 tôi viết hoa; `Mama saṅkappamaññāya` 18 ta · 16 tôi). Lời kết giữ Tôi nghe như vầy theo công thức tầng.
  Thuật ngữ kèm số đếm (đo trên 57 khoá tầng cho `Satasahassito kappe`): `Vào một trăm ngàn đại kiếp trước` 31 · `Vào một trăm ngàn kiếp trước đây` 10 · `Vào một trăm ngàn kiếp trước` 5; chọn đại kiếp theo đa số dù Pāli chỉ có kappa. `Duggatiṁ nābhijānāmi` (444 khoá): `Ta không biết mình rơi vào khổ đau` 140 · `Tôi không còn biết đến đọa xứ nào` 105 · `Ta không còn biết đến đọa xứ` 65; chọn dạng ta … đọa xứ theo tha-ap424 (cùng phẩm) và vì dạng khổ đau thêm chữ mình rơi vào mà Pāli không có. `Padesarajjaṁ vipulaṁ` 15 Vương quyền cai quản các vùng đất rộng lớn · 15 Vương quốc rộng lớn ấy (hoà): chọn dạng sát padesa là vùng đất. `devarajjamakārayiṁ` 11 làm ra vương quyền nơi chư thiên · 2 cai trị cõi trời: giữ đa số. `Hatthiyānaṁ assayānaṁ` Xe voi, xe ngựa (tha-ap425, tha-ap360). `Koseyyakambaliyāni` Vải lụa tơ tằm và vải len (tha-ap340). `Idaṁ khāda idaṁ bhuñja` theo tha-ap421 Hãy ăn món này, hãy dùng món này. Cụm `Karotopadhikaṁ puññaṁ` hữu sanh y và `cattāro ca paṭipannā … phale ṭhitā` theo vv44 (đúng Pāli, 3 khoá); `Yajantānaṁ` cúng tế theo vv44. `āhutīnaṁ paṭiggaho` 29 bậc tiếp nhận lễ vật hiến cúng. `puññakkhetto anuttaro` ruộng phước vô thượng (tha-ap45, 2 chỗ). `cakkhuma` hỡi bậc Có Mắt (thi-ap15, tha-ap486).
  Lỗi số ở tiền lệ (báo, không sửa ngoài lát): `Satānaṁ tīṇikkhattuñca` bị dịch Cả bảy món báu quý giá ở tha-ap344:7.1, tha-ap345:3.1, tha-ap375:7.1 (đúng ba trăm lần); `Satānaṁ pañcakkhattuñca` bị dịch Cũng cả năm món báu quý giá ở tha-ap344:7.3, tha-ap345:3.3, tha-ap375:7.3 và Cũng cả trăm món báu cùng năm món quý ở tha-ap459:6.3 (đúng năm trăm lần); tha-ap321:1.2 `ahosiṁ kassako tadā` dịch dân làng (đúng người làm ruộng); tha-ap501:4.3 `Saṭṭhiyojanamubbedhaṁ` dịch rộng sáu mươi do-tuần (đúng cao).
  Trùng nguyên văn trong chính bài: 5 nhóm (`:11.1`/`:12.1`; `:11.2`/`:12.2`; `Labhāmi sabbamevetaṁ,` ở `:19.3` `:20.3` `:21.3` `:22.3` `:24.3`; `navasassassidaṁ phalaṁ.` ở `:18.4` `:19.4` `:20.4` `:21.4` `:22.4` `:24.4` `:30.4` `:31.4`; `…pe…` ở `:32.2` `:33.2` `:34.2`); bản Việt giống nhau ở cả 5 nhóm — 0 cặp mà Việt khác.
  Dấu lược: ba khoá `:32.2`, `:33.2`, `:34.2` là `…pe…`, mỗi khoá đúng một `…`; Pāli không có `(…)` trần nên Việt cũng không có (141/141 khoá). Nháy: Pāli mở `“` ở `:1.1` và đóng `”` ở `:34.3`; nháy đơn `‘` mở ở `:7.1` và đóng `’` ở `:7.4`, mở lại ở `:9.1` và đóng ở `:11.4`; bản Việt khớp Pāli từng khoá (141/141), tổng Pāli và Việt đều 1 · 1 · 2 · 2.
  Hiệu chuẩn: 141/141 khoá khớp tập khoá và thứ tự Pāli; NFC đạt; không khoá rỗng; không khoảng trắng thừa; không Pāli lọt vào bản Việt ngoài `:0.1` (Therāpadāna, quy ước tầng), `:0.2` và tên riêng Haṁsavatī, Padumuttara, Sucintita.
  Bất định ghi, không che (không đưa vào thân kinh): (1) `:2.1` `Susampannaṁ` dịch sung túc và `:7.1` `sampannaṁ` dịch sẵn sàng — sampanna là đầy đủ, hoàn tất; cũng có thể hiểu là đã chín. (2) `:3.4` `aggaṁ` dịch phần đầu tiên; cũng có thể là phần thượng hạng. (3) `:4.3` `pabhāvito` dịch được thành lập; nghĩa sát hơn có thể là được làm cho hiển lộ. (4) `:5.2` và `:28.4` `pure pure` dịch trước nhất; có thể là lần này đến lần khác. (5) `:7.2` `āyāgosi` dịch bậc xứng đáng thọ nhận. (6) `:11.1` và `:12.1` `Saṅghato uddisitvāna` dịch sau khi chỉ định từ Tăng; chủ thể và đối tượng được chỉ định (các vị tỳ-kheo) không nêu trong Pāli, chưa thêm vào. (7) `:19.2` `sivikaṁ sandamānikaṁ` dịch kiệu khiêng và xe kéo; sandamānikā chưa xác định chắc loại xe (tha-ap425 dịch xe kiệu cho `sarathaṁ sandamānikaṁ`). (8) `:20.2` `navaggarasabhojanaṁ` hiểu là navaṁ + agga + rasa + bhojana. (9) `:25.1` `pacchimako` dịch sau cùng và `:25.3` `deyyadhammo` dịch vật cúng dường, `:25.4` `phalaṁ tosesi` hiểu phalaṁ là chủ ngữ (khớp tha-ap490 `phalaṁ toseti kassakaṁ`). (10) `:27.3` `Mahāpakkho` dịch đông phe cánh (pakkha: phe, phía ủng hộ); cp18 dịch khác trong ngữ cảnh Dạ-xoa. (11) `:29.3` `Sabbepi samatikkamma` dịch Vượt qua tất cả; đối tượng bị vượt qua (các vị khác) không nêu trong Pāli. (12) `:26.2` `gaṇavaruttame` dịch hội chúng cao quý tối thượng. (13) `:16.4` `tidase` dịch chư thiên Ba Mươi Ba theo tha-ap420 và tha-ap422, còn `:13.4` `tāvatiṁsa` giữ cõi trời Ba mươi ba theo đa số. (14) `:3.3` `Yohaṁ` + `ce` hiểu là Nếu ta chưa dâng … mà thọ dụng; `:2.4` kết bằng dấu hai chấm để dẫn lời nghĩ (Pāli dùng dấu chấm). (15) Pāli `:15.1` là dấu mốc phần tụng, dịch theo tha-ap486 `Phần tụng đọc thứ …`.
