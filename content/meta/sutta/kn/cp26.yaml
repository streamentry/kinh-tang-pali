notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh của Bhikkhu Sujato tại cùng commit bilara (cp26 có trong tầng english-sujato theo manifest). Tại commit đã ghim không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya, nên không có tầng Việt truyền thống để so. Tầng english-project không có gì cho bài này.

  PHẠM VI. Bài đủ 83 khoá, khớp tập khoá Pāli, theo đúng thứ tự Pāli; không có khoá nào ngoài tập đó.

  COVERAGE ANH. Công thức của `source/layers.yaml` (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`) cho mẫu số = 0: toàn bộ kệ ngắn hơn 40 ký tự, nên cổng coverage không đo được gì ở bài này. Vì vậy tôi đo thô trên khoá thân bài: Sujato có chữ Anh ở 78/78 khoá `:1.1`–`:19.4` (ratio 1,00); tính cả bốn khoá tiêu đề `:0.1`–`:0.4` là 82/83 khoá (0,988). Khoá duy nhất Sujato để trống là `:20.1` (câu kết Temiyacariyaṁ chaṭṭhaṁ), dịch từ Pāli một mình theo khuôn các Hạnh kết thúc (`Hạnh của … , thứ N`). Số đo thô này là tham khảo, không phải kết quả cổng.

  TIỀN LỆ, có số đếm. Đã dò 12 khoá có Pāli trùng (sau khi bỏ dấu câu và chữ hoa) với khoá đã dịch ở các bài khác trong tầng Việt. Dùng lại cùng chữ ở 9 khoá: `:0.1` Hạnh Tạng và `:0.2` Phẩm Yudhañjaya (cp21–cp35); `:1.1` và `:1.2` theo cp23:1.1–1.2 (lại nữa, vào thời thuở nọ khi ta / là con đẻ thật của vua nước Kāsi); `:9.3` và `:13.2` ta hoan hỷ, tâm xúc động theo cp8:10.2 (tha-ap445:2.4 cho saṁviggamānaso); `:17.4` chỉ vì một mục đích duy nhất là giác ngộ (cp8:15.4, cp14:10.4, cp21:5.4: 3/3 khoá giống nhau); `:18.1` Không phải ta ghét bỏ cha mẹ (cp21:6.1, cp23:10.1: 2/2); `:18.3` Mà vì Nhất Thiết Chủng Trí là điều quý báu nhất đối với ta (cp1, cp3, cp14, cp21, cp22, cp23: đa số trong 24 khoá chứa sabbaññutaṁ; chữ nhất là cách diễn đạt đã thành quy ước trong các Hạnh, không đổi ở đây). `:8.2` theo ta đã nói lời này (cp19:9.4, cp23:3.4). `:9.1` đổi người ấy của cp8:10.1 thành vị ấy vì chủ thể ở đây là vị thiên nữ. `:15.1` (tha-ap363:2.3) không dùng lại vì khác nghĩa (che suốt bảy ngày đêm). `:19.4` theo khuôn đây là … Ba-la-mật của ta (cp27:4.4, cp29:11.6, cp30:9.6, cp31:13.6, cp32:6.6: 5/5; cp20:7.4 viết thường). Tên khoá `:0.3` Adiṭṭhānapāramī 1 (root viết adiṭṭhāna, thiếu h so với adhiṭṭhāna) theo khuôn Bố Thí, Trì Giới, Xuất Gia, Chân Thật, Xả Ba-la-mật Thứ N: ở đây Quyết Tâm Ba-la-mật Thứ Nhất. Tên người Temiya và Mūgapakkha giữ Pāli (cp35:8.3 cũng giữ Mūgapakkha). Trong chính bài có 3 nhóm Pāli trùng (`:9.3` và `:13.2`; `:10.3` và `:19.1`; `:10.4` và `:19.2`); ở cả 3 nhóm bản Việt chỉ khác nhau về chữ hoa và dấu câu như Pāli, 0 cặp lệch nghĩa. Tên khoá `:0.3` Adiṭṭhānapāramī 1 (root viết adiṭṭhāna, thiếu h so với adhiṭṭhāna) theo khuôn Bố Thí, Trì Giới, Xuất Gia, Chân Thật, Xả Ba-la-mật Thứ N: ở đây Quyết Tâm Ba-la-mật Thứ Nhất. Tên người Temiya và Mūgapakkha giữ Pāli (cp35:8.3 cũng giữ Mūgapakkha).

  THUẬT NGỮ, có số đếm. adhiṭṭhāna, adhiṭṭhahiṁ → quyết tâm: tiền lệ trong tầng chỉ có cp35:13.1 (daḷhamadhiṭṭhānaṁ → quyết tâm vững chắc), 1/1 khoá, và Sujato dịch resolve. Truyền thống Việt thường gọi Quyết định Ba-la-mật; tôi chọn Quyết Tâm để khớp cp35:13.1 và vì quyết định hiện nay dễ bị hiểu là việc ra quyết định; đây là lựa chọn biên tập, đề nghị người biên tập xem lại nếu muốn theo thuật ngữ truyền thống. aṅga → chi phần (cp12:3.3 cũng dịch aṅga là chi phần, 2/2 khoá trong cp). pāramī → ba-la-mật; sārathī → người đánh xe (ja23:1.4, ja349:4.4, thag6.9:4.2 giữa những người đánh xe; ja151:2.6 kẻ cầm cương); setacchatta → lọng trắng (tha-ap295:3.3); jutindhara → rạng rỡ quang minh (ja270:2.4 quang minh rực rỡ); purohita → tế sư (thag6.9: vị tế sư); padakkhiṇaṁ → nhiễu hữu (tha-ap110, tha-ap83 hữu nhiễu); atthakāmā → mong muốn lợi ích (cp24:6.2, ja150); senāpati → tướng soái; jānapada → dân chúng trong nước; Sabbaññutaṁ → Nhất Thiết Chủng Trí (24 khoá). Từ xưng hô: vị thiên nữ được gọi là mẹ với con theo amma ở `:8.5` (Sujato dịch mom); hai bên ngôi con và mẹ nhất quán từ `:7.3` đến `:8.6`.

  SỐ PĀLI, có phép tính. soḷasitthisahassānaṁ (`:2.1`) = soḷasa 16 × sahassa 1000 = 16.000 nữ nhân → mười sáu ngàn. vassāni soḷasaṁ (`:10.4`, `:19.2`) = 16 năm → mười sáu năm. sattāhaṁ (`:15.1`) = satta 7 + ahaṁ ngày = bảy ngày. tīsu ṭhānesu (`:6.4`) = ba điều; tayo aṅge (`:9.4`) = ba chi phần (câm, điếc, què ở `:10.1`–`:10.2`: đúng ba). Không có cụm số chưa phân xử được.

  KIỂM CHUẨN. Tập khoá Việt = tập khoá Pāli, 83/83, đúng thứ tự. Nháy đơn và nháy kép khớp Pāli từng khoá, 0 lệch trên 83 khoá. Pāli không có dấu lược ở khoá nào nên Việt cũng không có. NFC sạch, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang Việt ngoài tên riêng (Yudhañjaya, Kāsi, Mūgapakkha, Temiya). Cặp Pāli↔Việt đã in ra đọc từng khoá.

  BẤT ĐỊNH ĐÃ GHI (không đưa vào thân kinh). (a) `:2.2` na vijjati pumo: Pāli chỉ nói không tìm thấy nam nhi nào trong số mười sáu ngàn nữ nhân; Sujato đọc là không người nào sinh được con trai; tôi giữ lời Pāli và để ngữ cảnh tự nói. (b) `:5.3` vinicchayaṁ samāpanno: tôi dịch đi vào sự suy xét; Sujato dịch reached the decision; cả hai đọc được. (c) `:6.4` tīsu ṭhānesu yojayi: yojayi (khiến gắn vào, thúc làm) tôi dịch khuyên thực hành ba điều; ba điều là ba lời ở `:7.1`–`:7.3`. (d) `:7.4`, `:13.4` attho: dịch mục đích (khác `:6.2`, `:8.5` atthakāma, dịch lợi ích) vì ở đây Sujato đọc goal. (e) `:8.1` evaṁ vuttāyahaṁ tassā: cú pháp mơ hồ; theo Sujato đọc khi vị ấy đã nói như vậy. (f) `:11.4` kāḷakaṇṇī: tôi dịch sát nghĩa chữ là kẻ tai đen (Sujato black-ear); nghĩa thành ngữ có thể là kẻ mang điềm xấu, chỗ đó không phân xử được, ja192:2.3 chỉ dùng như tên. (g) `:13.3` tapociṇṇo: tôi dịch đã hành khổ hạnh; Sujato dịch lived fervently, tức nghĩa rộng hơn khổ hạnh. (h) `:14.3` chattena abhisiñcitvā: dịch sát chữ là lấy lọng làm lễ quán đảnh; Sujato tách thành anointed và held the umbrella. (i) `:16.2` sajjassaṁ hatthamuccito: câu cú pháp lỏng; theo Sujato đọc ngựa đã thắng cương được buông khỏi tay (người đánh xe); không chắc chủ ngữ của hatthamuccito. (j) `:17.2` tajjento vividhakāraṇā: Pāli không nêu rõ ai đe dọa; tôi dịch dù bị đe dọa bằng nhiều cách (kāraṇā cũng có thể là cực hình); Sujato đọc khác (I was afraid for the many different resolves), nghĩa của tajjento ở đây có thể còn bàn. (k) `:18.4` vata: dịch lời nguyện, có thể đọc là hạnh nguyện; Sujato vow. (l) `:12.1` jānapadā: người dân trong nước, tách khỏi tướng soái và tế sư ở `:12.2`.

