notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ của bài kệ dưới 40 ký tự, nên assertion không tự chạy). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Dòng lược kết `:1.5` giữ nguyên hai dấu lược.** Pāli là `… <tên> thero …. `; tôi viết `… Trưởng lão <tên> ….`, đúng dạng `thag1.98`, `thag1.101`, `thag1.106` đã có trên đĩa, và **không** mở rộng thành *Bạch Thế Tôn, vị trưởng lão … đã từng nói bài kệ này* như nhóm `thig1.10`–`1.16` đang làm — BRIEF_VI3 §10.1 nói thẳng Pāli có dấu lược thì bản Việt giữ lược, mở rộng là thêm chữ KHÔNG ĐÁNH DẤU. Tên ở `:1.5` tôi dùng **dạng gốc** cho khớp tên ở `:0.4`, đúng cách 20 tệp thag/thig đã làm, dù Pāli dùng dạng chủ cách.

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Ekakanipāta` → *Bộ Một Bài Kinh* (160 chỗ trên đĩa, thắng *Phẩm Một Pháp* của 27 tệp `iti`). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>*. `Tatiyavagga` → *Phẩm Thứ Ba* (`iti21`–`iti26`), `Catutthavagga` → *Phẩm Thứ Tư* (`iti80`–`iti85`), `Pañcamavagga` → *Phẩm Thứ Năm* (`iti90`–`iti92`), `Sattamavagga` → *Phẩm Thứ Bảy* (`thag1.66`). Với `Chaṭṭhavagga`, `Aṭṭhamavagga`, `Navamavagga` chưa có tiền lệ nào trong tầng, tôi đặt mới *Phẩm Thứ Sáu* / *Thứ Tám* / *Thứ Chín* theo đúng công thức số thứ tự của loạt `Phẩm Thứ Hai`…`Thứ Mười Hai`. `Theragāthā 1.N` giữ **số** như `thag1.42`, `thag1.101`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có Pháp Cú), nên `triangulation` là Pāli + English Sujato. Bản Anh đã ghim có prose ở **8/9** khoá của mỗi bài; khoá trống duy nhất là `:1.5`, tức dòng lược — đúng như BRIEF_VI3 §10.1 nói, chỗ đó Pāli phải tự đứng vững.
  **Bốn vế PĀLI TRÙNG NGUYÊN VĂN với `dhp326:1`–`4` — tôi dùng lại nguyên văn bản dịch đã có, KHÔNG dịch lại.** Đã đối chiếu từng khoá: `1.1` khớp *Trước đây tâm này lang thang,* (tôi thêm dấu mở `“` vì Pāli `thag1.77:1.1` có `“` còn `dhp326:1` thì không) · `1.2` khớp *chạy theo nơi mình muốn, theo ý thích;* · `1.3` khớp *nay Ta sẽ khéo chế ngự nó,* · `1.4` khớp *như người cầm móc điều phục voi đang phát dục.* (tôi đóng `”ti.` thay vì `.` vì Pāli `thag1.77:1.4` có `”ti`). Vế `1.2` và `1.3` còn trùng **nguyên văn bản dịch `dhp326` đã publish**, tức Pāli giống nhau đã có sẵn một cách dịch duy nhất trong tầng — dịch khác đi là tự tạo mâu thuẫn.

  **Cái tôi `Tadajjahaṁ` giữ đúng hoa/thường theo Pāli.** `Tadajjahaṁ … niggahe**ssāmi**` — `niggahessāmi` là thứ tư số một (tôi sẽ), nên tôi viết *Ta*; còn `dhp326:3` cũng viết *Ta*. Vế `1.2` nói về tâm bằng *mình*, vế `1.3` nói người nói bằng *Ta* — đó là chuyển số của Pāli, tôi giữ nguyên chứ không đồng nhất hoá.

  **Thuật ngữ đặt mới: 0.** Cả bốn vế lấy nguyên văn `dhp320-333` đã có. `Aṭṭhamavagga` → *Phẩm Thứ Tám* đặt mới theo công thức số thứ tự của loạt. Tên `Hatthārohaputta` giữ dạng gốc ở `:0.4` và `:1.5` (Pāli `:1.5` là `Hatthārohaputto`).
