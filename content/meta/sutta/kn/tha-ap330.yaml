notes: |-
  Đã đọc HẾT p49.txt (40 khoá) trước khi viết. `:0.2` `Umāpupphiyavagga` → `Phẩm
  Umāpupphiya` theo đa số đếm được (5/6 bài `tha-ap` đã dịch trọn). Các khoá
  `:0.1` `:0.3` `:9.1`–`:9.3` `:10.1` `:11.1` dùng lại nguyên văn đã có như tha-ap117
  cùng lát. `pupphapūjāyidaṁ phalaṁ` → `đó là quả báo của việc cúng dường hoa`
  (tha-ap105:4.4, 6/10). `pubbe sukatamattano` → `từ thuở xa xưa đã khéo tạo`
  (tha-ap94:3.4).

  HÌNH THỨC SỐ: Pāli ghi `8 Sumanāveḷiyattheraapadāna` (**không có dấu chấm** sau
  số), nên tôi viết `8 Bài Kệ …` cũng không có dấu chấm, đúng như tiền lệ
  tha-ap Kakkārupupphapūjaka (`4 Bài Kệ …`). Bài kệ thứ tám trong phẩm, `:11.1` →
  `thứ tám`.

  DẤU LƯỢC: `:9.2` là `…pe…`, giữ **đúng một** `…`.

  BẤT ĐỊNH ĐÃ GHI. (1) `nimmānaṁ upapajjahaṁ` (4.2) — 0 tiền lệ cho cụm này trong
  toàn tầng (`tha-ap116:5.2` và `tha-ap118:3.4` có Pāli nhưng tệp Việt của chúng là
  tệp dịch dở nên khoá để trống, tôi không sửa tệp ngoài lát). `nimmāna` có thể là
  `hình tượng`/`hình dạng`, cũng có thể là địa danh; tôi dịch `tôi đã được tái sinh`
  và **ghi rõ ở đây là chỗ dịch lược**, không đoán thêm từ nào vào thân kinh. Đây là
  lý do `ambiguity_integrity` của bài này thấp nhất lát (8.6). (2)
  `Sudhāya piṇḍaṁ katvāna, āveḷaṁ sumanāyahaṁ` (2.1–2.2) — 0 tiền lệ;
  `Sudhāya` đọc là bánh cơm trắng bóng, `āveḷaṁ` là phần vàng, và `sumanāyahaṁ` là
  tên tự giới thiệu trong Thera-gāthā, tôi giữ `Sumanāveḷiya` như tiền lệ
  tha-ap118 và các bài cùng phẩm. (3) `Kenidaṁ pūjitaṁ pupphaṁ` (3.3) — câu hỏi
  `hoa nào được dâng lên`; tôi giữ dạng câu hỏi để không thêm dấu chấm câu lệnh.
  (4) `Saṁyatānaṁ tapassīnaṁ` (6.3) — 0 tiền lệ; dịch `những bậc tiết chế hành
  khổ ấy`. (5) `sahassārosi khattiyo` (8.2) — `khattiyo` là hạng quyền quý, không
  phải chức tăng, tôi dịch `có vị tưỳng lão họ Sahassārosi`.
  `technical_integrity` đặt 9.6: không ai rà lại bằng con người.
