notes: |-
  Đợt 19, làn 115. Dịch từ Pāli root tại commit đã ghim, đủ 306/306 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm Ubbari (Petavatthu), chuyện thứ chín: đoàn người đi lấy của cải gặp một dạ-xoa có bàn tay ban điều mong muốn, Aṅkura hỏi nguyên do, nhờ đó lập đại thí ở Dvārakā; sau khi sinh lên cõi Ba Mươi Ba, Aṅkura bị Indaka, người chỉ dâng một muôi thức ăn, vượt trội, và Đức Phật nói về ruộng tốt, ruộng xấu của sự bố thí.

  **Tiêu đề.**
  - `0.1` Petavatthu → giữ Pāli (49/49 tệp đã dịch có Pāli trùng đều giữ). `0.2` Ubbarivagga → giữ Pāli (12/12 tệp).
  - `0.3` “9. Chuyện Ngạ Quỷ Aṅkura”: theo khuôn `pv20:0.3` và `pv22:0.3` (*N. Chuyện Ngạ Quỷ X*); số 9 là số ghi trong tiêu đề Pāli và khớp `navamaṁ` ở `76.1` (“thứ chín”, cùng khuôn `pv22:11.1`).
  - `translationTitle` bỏ số thứ tự (32 tệp meta pv không số so với 17 có số).

  **Người nói.** Pāli chỉ đánh dấu người nói bằng nháy kép: mỗi bài kệ `1`–`2` (một lời), `3`, `4`, `5`, `6` là một lời riêng; `7.1`→`9.4` là một lời liền (không đóng ở `7.4`, `8.4`). Tên người nói không có trong Pāli nên không đưa vào thân kinh; việc gán người nói trong bản dịch là suy theo ngữ cảnh đối đáp (`39.3`, `40.3` gọi `sindhaka`, nên `1`–`2`, `4`, `6`, `41`, `44`–`45` được hiểu là lời người bạn đồng hành). Đại từ theo vai: ngạ quỷ nói “tôi”, gọi Aṅkura là “ngài”; Aṅkura gọi ngạ quỷ là “ông” (`13`, `20`, `27`) và chỉ đổi thành “ngươi” ở `31` sau lời xưng tội, nơi Pāli gọi `kāpurisa`; Aṅkura nói với Đức Phật là “con” (`68`–`69`).

  **Số Pāli, đã tự tính.** `ekaratti` = một đêm (7.1, 8.1). `pañcadhāra` = năm dòng (11.2). `saṭṭhi` 60 × `sahassa` 1.000 = **sáu mươi ngàn** (`50.1` xe, `52.1` người đàn ông). `ti` 3 × `sahassa` 1.000 = **ba ngàn** (`51.1` đầu bếp). `soḷasa` 16 × 1.000 = **mười sáu ngàn** (`53.1`, `54.1`). `dasa dve ca` = 10 + 2 = **mười hai do-tuần** (`65.1`). `dasahi ṭhānehi` = **mười phương diện** (59.1): đếm đủ mười ở `59.3`–`60.2` (sắc, thanh, vị, hương, xúc = 5; thọ mạng, danh tiếng, dung mạo, hạnh phúc, quyền thế = 5). `dasasu lokadhātūsu` = mười thế giới (63.1). `navamaṁ` = thứ chín (76.1). Không có cụm số chưa phân xử được (không có `Tiṁsakappasahassa`, `navuti`, `tālīsa`).

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã có trong cây chính (dn, mn, sn, an, kn; trừ chính bài này; so Pāli sau khi bỏ dấu câu và chữ hoa): 75 khoá của bài (trừ `0.1`, `0.2`) có Pāli trùng với khoá đã dịch ở bài khác, tổng 312 cặp; 58 khoá dùng đúng nguyên văn một tiền lệ (kể cả khác dấu câu): `3.1`–`3.4`, `4.1`, `4.2`, `4.4`, `5.1`, `5.2`, `5.4`, `6.1`, `6.2`, `6.4`, `12.1`, `12.2`, `13.3`, `16.2`, `26.2`, `30.4`, `31.1`, `32.3`, `32.4`, `34.2`, `36.2`, `36.4`, `41.2`, `42.2`, `42.4`, `42.5`, `43.1`–`43.3`, `45.2`, `47.3`, `48.3`, `48.4`, `49.1`–`49.4`, `51.2`, `52.2`, `53.1`, `53.2`, `54.1`, `54.2`, `59.3`, `59.4`, `66.4`, `69.4`, `72.1`, `72.2`, `73.3`, `74.2`, `74.4`, `75.1`–`75.3`. Cặp có Việt khác bản tôi viết chủ yếu nằm ở các khoá có nhiều tiền lệ tự khác nhau (vd `36.4` 35 cặp, `26.2` 4 cặp). 17 khoá khác mọi tiền lệ, mỗi cái có lý do:
  - `9.1` (`Yo pubbe katakalyāṇo`): tiền lệ `ja302:4.1`, `ja409:5.1`, `ja409:6.1` đều “Kẻ trước kia đã làm điều lành,”. Ở đây tôi đọc `katakalyāṇa` là người **đã được** làm điều lành cho (khách đã được chủ nhà đãi), vì 7–9 nói về khách và chủ, và `9.2` “về sau lại hại bằng điều ác”. Ở `ja409:5`–`6` Pāli đối `katakalyāṇo` với `katattho` (người đã được làm lợi ích), cũng hợp cách đọc “được làm cho”. Chưa phân xử được; xem Bất định 1. Tôi không sửa ba khoá kia (ngoài lát).
  - `13.1` đổi đại từ (`pv38:20.1` “Ngươi”, `snp2.9:1.1` “Người”) thành “Ông” cho khớp `20.1`, `27.1`; phần còn lại giữ nguyên.
  - `17.3` (`Tesāhaṁ puṭṭho akkhāmi`): theo `sn4.24:7.3` “khi được hỏi, ta giảng cho họ”, đổi ngôi và nhịp câu.
  - `24.4`: `vv42:5.4` “ai lại chẳng làm các việc phước lành?”; tôi giữ “ai lại không làm phước?” sát chữ (`puññaṁ` số ít, không thêm “các việc”). `25.4`, `33.4` (`yaṁ mamassa sukhāvahaṁ`): tiền lệ duy nhất `vv79:7.4` ở một ngữ cảnh khác (nước), không dùng.
  - `10.3` (`Yakkhohamasmi paramiddhipatto`): tiền lệ duy nhất `pv20:10.3` dịch “Tôi là ngạ quỷ, là điểm đến tối thượng của chúng sinh”; tôi đọc `yakkho` là dạ-xoa và `iddhipatta` là người đã đạt thần thông (`tha-ap25:26.1`, `ja506:38.1` đều dịch “đạt thần thông/thần lực”). Không sửa `pv20`.
  - `26.3`, `34.3`, `36.3` (`Papañca udapānañca`): `pv39:19.3`, `vv52:21.3` “cùng lập trạm nước uống và giếng nước,” có động từ “lập” theo văn cảnh ở đó; ở đây là danh sách thứ được cho (`dassāmi`, `adā`), nên bỏ “cùng lập”, giữ “trạm nước uống và giếng nước” (3 tiền lệ).
  - `28.2` (`Saddhassa gharamesino`): tiền lệ `an8.54:17.2` “của người tại gia có đức tin”; tôi bỏ “của” vì `28.1` đã có “Của gia chủ Aṅgīrasa,”. `42.1`: tiền lệ `dn21:1.5.49`, `ja527:14.1` “Nếu Sakka ban cho ta một điều ước,” chỉ đổi “ta” thành “tôi”.
  - `42.6` (`sīlavanto ca yācakā`): `ja480:16.6` “và những người xin có giới hạnh.”; tôi dùng “người cầu xin” cho `yācaka` cả bài cho nhất quán (xem thuật ngữ).
  - `58.1` (`Kaṭacchubhikkhaṁ datvāna`): tiền lệ duy nhất `thi-ap7:7.3` “Sau khi trao cho vị tỳ-kheo-ni Kaṭacchu,” coi `kaṭacchu` là tên người. Tôi dịch `kaṭacchu` là cái muôi và `bhikkhā` là thức ăn khất thực (khớp 54.4 `dabbi`/muôi và câu chuyện Indaka chỉ dâng một muôi). Có vẻ `thi-ap7:7.3` đọc sai; báo, không sửa.
  - `62.4` (`vihāsi purisuttamo`): `tha-ap67:1.4` “vị tối thượng loài người đã sống ở đó.”; tôi viết “bậc tối thượng trong loài người đã trú ngụ.” (đổi từ cho khớp `vasantaṁ` ở `63.4`).
  - `72.3`, `72.4` (`Sammā dhāraṁ pavecchante, phalaṁ toseti kassakaṁ`): `tha-ap58:3.3`–`3.4` “được chăm sóc đúng đắn, cũng thu được quả bội thu.” và `tha-ap504:5.3`–`5.4` “người làm ruộng đúng thời vụ cũng thu được quả bội thu.”. Cả hai bỏ `dhāraṁ` (dòng mưa) và `toseti` (làm hài lòng); tôi dịch đủ cả hai từ để khớp đối xứng với `70.3`–`70.4` (`napi toseti kassakaṁ` “cũng không làm người nông phu hài lòng”). Không sửa hai bài kia (ngoài lát; chúng không thuộc phạm vi tôi được giao).
  - `3.1`–`3.4`, `5.4`: dùng đúng `ja493:17.1`–`17.4` và `ja528:30.1`–`30.4` (2/2 tiền lệ giống nhau). `ja452:7.1`–`7.4` cùng Pāli lại dịch “đừng mong quả của nó, vì kẻ bạn xấu thì khó dựa vào” — khác hẳn hai khoá kia và không khớp `na tassa sākhaṁ bhañjeyya` (“không nên bẻ cành”); báo, không sửa (ngoài lát).
  - `12.2` `nāpi sakko purindado` → “cũng chẳng phải Sakka Đấng Phá Thành;” theo `ja529:64.2`, `vv62:3.2` (tầng: “Đấng Phá Thành” 6 khoá — `ja529:63.2`, `ja529:64.2`, `pv17:11.2`, `vv62:3.2`, `tha-ap487:4.4`, `tha-ap487:7.2` — so với “Purindada” giữ Pāli 2 khoá `pv38:18.2`, `pv38:19.2`). `11.4` `purindadaṁ` → “Đấng Phá Thành” cùng quy ước.
  - Trùng nguyên văn **trong chính bài**: 66 cặp (sau khi bỏ dấu câu); 8 cặp có Việt khác, mỗi cặp có lý do: `13.4`/`19.4` (câu hỏi so với lời đáp), `16.4`/`17.4` (một bên là điều họ hỏi, một bên là điều tôi chỉ), `27.2`/`30.2`/`31.2` và `27.3`/`31.3` (khác người nói nên khác đại từ, cùng vị ngữ), `59.2`/`65.4` và `60.4`/`65.4` (ở `59`–`60` Aṅkura là tân ngữ bị vượt trội; ở `65` không có Aṅkura trong câu). Mọi cặp khác còn lại cùng Việt (kể cả `7.1`/`8.1`, `7.3`/`8.3`, `25`/`33`, `26`/`34`, `57.3`/`58.3`/`22.3`).

  **Thuật ngữ, kèm số đếm.**
  - `yakkha` → “dạ-xoa” (toàn tầng 332 lần “dạ-xoa”/“Dạ-xoa” so với 14 lần “dạ xoa”; riêng `kn` 130 lần “dạ-xoa”). `peta` → “ngạ quỷ” (210 lần toàn tầng).
  - `kāmada` → “ban điều mong muốn” (`kp8:10.2`, `cp22:7.4`, `mil6.3.10:13.2`); `varaṁ` → “điều ước” (`dn21:1.5.49`, `ja527:14.1`), còn “ân huệ” chỉ ở `ja480:16.1` (1 khoá) cho Pāli khác.
  - `vanibbaka` → “kẻ ăn xin” (14 lần trong `kn`); `yācaka`/`yācanaka` → “người cầu xin” (16 lần trong `kn`).
  - `sappurisa` → “bậc thiện nhân” (trong `kn`: 33 lần “thiện nhân” so với 19 lần “chân nhân”). `dussīla` → “kẻ phá giới” (trên các khoá Pāli có `dussīl`: 72 khoá “phá giới” so với 31 khoá “ác giới”; riêng `kn` 25 so với 5).
  - `tāvatiṁsūpago ahu` → “đã đến cõi Ba Mươi Ba” (`vv56:6.4`, `vv57:6.4`, `tha-ap547:13.4`; còn 4 khoá “cõi trời Ba mươi ba”). `tāvatiṁsānamissaro` → “vị chúa tể cõi Ba Mươi Ba” (`dn21:1.5.50`).
  - `Pāricchattaka` → “cây Pāricchatta” (24 lần; `mn134:2.11`, `an7.69`); “cây San Hô” viết thường chỉ 1 lần, còn “Cây San Hô” viết hoa chủ yếu là tên phẩm của `vv`.
  - `vatthasenāsanāni` → “y phục và chỗ ngồi nằm” (`thi-ap11:13.2`, `thi-ap29:12.2`, `ja350:4.2`; so với “chỗ nằm nghỉ” ở `pv16:9.4`, `sn3.24:7.2`): chọn nhóm đầu vì `senāsana` gồm cả chỗ nằm lẫn chỗ ngồi.
  - `papa` → “trạm nước uống” (`pv39:19.3`, `vv52:21.3`); `udapāna` → “giếng nước”; `dugge saṅkamanāni` → “lối bắc qua nơi hiểm trở” (`pv39:19.2` “lối đi ở chốn gian nan”).
  - `mahādāna` → “cuộc đại thí” (`cp6:3.4`, `cp9:23.3`, `cp9:24.4`, `cp9:26.3`; “đại thí” 27 lần so với “đại bố thí” 2 lần ở `kn`). `yañña` → “lễ cúng dường” (`an6.37:6.4`).
  - `ādhipacca` → “quyền thế” (`kp8:11.3`). `payirupāsanti` → “hầu hạ” (`iti104:2.4`, `iti104:2.8`). `kappaka` → “thợ cạo” (9 lần ở `kn`); `sūda` → “đầu bếp” (17 lần); `khattiya` → “sát-đế-lợi” (49 lần).
  - `yojana` → “do-tuần” (160 lần so với 9 lần “yojana” ở `kn`); “ngàn” 894 lần so với “nghìn” 132 lần ở `kn`.
  - `brahmacariya` (13.3, 19.3, 21.3) → “phạm hạnh” (1.776 lần toàn tầng), dù ở đây hành vi chỉ là chỉ đường cho người xin; nghĩa hẹp hơn nhưng Pāli dùng chữ này, không đổi.
  - Tên riêng giữ chữ Pāli có dấu: Aṅkura, Asayha, Aṅgīrasa, Sindhaka, Indaka, Anuruddha, Dvārakā, Roruva, Kamboja, Vessavaṇa, Sakka, Māgadha.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `9.1` `katakalyāṇo`: “đã được làm điều lành cho” (người từng được ơn) hay “đã làm điều lành” (người từng làm ơn). Cách đọc thứ nhất khớp bối cảnh khách–chủ, nhưng cách thứ hai là cách ba khoá `ja302`, `ja409` dùng; người biên tập cần phân xử.
  2. `8.4` `Adubbhapāṇī dahate mittadubbhiṁ` và `9.3` `Allapāṇihato poso`: dịch sát chữ “bàn tay không phản bội thiêu đốt kẻ phản bạn” và “người bị bàn tay ướt đánh gục”. `allapāṇi` chỉ có ở bài này (0 khoá khác ở tầng); nghĩa ẩn dụ (người ban ơn, tay còn ướt vì phục vụ) là suy đoán nên không đưa vào thân kinh.
  3. `11.1` `Pāṇi te sabbaso vaṇṇo`: `vaṇṇa` có thể là “sắc màu” hoặc “vẻ đẹp”, `sabbaso` “hoàn toàn”; dịch “hoàn toàn rực sắc” (không chốt “vàng”).
  4. `1.1`–`1.2` `Yassa atthāya gacchāma, kambojaṁ dhanahārakā`: đọc `yassa` là quan hệ với `ayaṁ … yakkho` ở `1.3` (“vì vị nào chúng ta lên đường … đây chính là dạ-xoa”); `dhanahāraka` “những người đi lấy của cải” (0 khoá khác ở tầng).
  5. `10.1`–`10.2` `Nāhaṁ devena vā manussena vā, issariyena vāhaṁ suppasayho`: đọc `issariyena` là “bởi quyền lực”, phủ định áp cho cả ba tác nhân.
