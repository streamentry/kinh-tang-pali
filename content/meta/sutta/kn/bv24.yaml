notes: |-
  Đợt 19, làn 78. Dịch từ Pāli root commit đã ghim, đủ 110/110 khoá (109 khoá mới; khoá kết `28.1` đã có sẵn từ lần trước, giữ nguyên sau khi kiểm lại: `dvāvīsatimo` = dvā 2 + vīsati 20 = 22, khớp thứ tự phẩm, bv3 = thứ nhất nên bv24 = thứ hai mươi hai), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ hai mươi hai của Buddhavaṃsa, về Đức Phật Kakusandha: sự chứng ngộ Pháp của bốn mươi ngàn koṭi và ba mươi ngàn koṭi, một kỳ hội chúng, tiền thân là vị Sát-đế-lợi Khema cúng dường và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.** `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn `bv16`, `bv17`, `bv18`, `bv20`, `bv27` (7/7 tiền lệ). `0.2` “24. Dòng Kế Thừa Của Đức Phật Kakusandha”: cùng khuôn với `bv18:0.2`, `bv20:0.2`, `bv27:0.2`. `28.1` giữ “Dòng kế thừa của Đức Thế Tôn Kakusandha là thứ hai mươi hai.”

  **Số Pāli, đã tự tính.** `cattārīsakoṭisahassa` = 40 × 1.000 koṭi = **bốn mươi ngàn koṭi** (3.3). `tiṁsakoṭisahassa` = 30 × 1.000 koṭi = **ba mươi ngàn koṭi** (4.3); đây là `koṭisahassa`, không phải cụm `Tiṁsakappasahassa` còn bỏ ngỏ, và ở đây không có chữ `kappa`. Thang lớn nhân cả số tích lũy: “ba mươi ngàn” = 30.000, không phải 1.030. Tiền lệ cùng cách đọc: `koṭisatasahassa` → “một trăm ngàn koṭi” (`bv20:3.3`). `cattālīsasahassa` = **bốn mươi ngàn** (7.1). `catuvassasahassa` = 4 × 1.000 = **bốn ngàn năm** (16.1). `samattiṁsasahassa` = **ba mươi ngàn** (17.1; xem bất định 6). `anūnaaṭṭhamāsa` = không thiếu + 8 = **đủ tám tháng** (18.3; `bv16:17.3` cùng chữ cùng nghĩa). `cattālīsaratana` = **bốn mươi ratana** (23.1). `dasayojana` = **mười do-tuần** (23.4). `cattālīsavassasahassa` = 40 × 1.000 = **bốn mươi ngàn năm** (24.1). `gāvuta` = **một gāvuta** (27.4; giữ nguyên đơn vị, không quy đổi). `tayo pāsāda` 3 (16.4) khớp ba tên ở `16.3`; `caturo nimitta` 4 (18.1); `eko samāgamo` 1 (6.2); `aṭṭhaṅga` 8 (26.1); `dasapāramī` 10 (12.4). Không có cụm `Tiṁsakappasahassa`, không có số nào dịch theo phỏng đoán.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã dịch (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 37 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 144 cặp, trong đó 28 cặp có Việt khác bản tôi viết; 34 trên 37 khoá dùng đúng nguyên văn một tiền lệ. 3 khoá không dùng đúng nguyên văn: `1.2` thêm “có” (“có bậc Chánh Đẳng Giác, …”) theo `bv18:1.2`, vì ở đây câu mở đầu thiếu động từ (tiền lệ `tha-ap11:2.2` là 1 cặp, không thêm “có”); `3.4` kết dấu chấm thay vì chấm phẩy theo Pāli từng khoá (tiền lệ `bv27:8.2`); `10.3` mở nháy đơn theo Pāli (5 tiền lệ dùng nháy kép hoặc không nháy, vì Pāli ở đó khác). Dạng nhiều nhất giữ nguyên: `6.3`–`6.4` (4 cặp), `12.1`–`12.4` (4–5 cặp), `16.4` (5), `17.2` (8/11), `18.1` (5), `19.1` (6), `19.3` (4), `20.2`, `21.2`, `22.2`, `22.4` (4 mỗi khoá), `24.4` (3/4), `25.4` (3), `13.4` (1) và `18.3` (1).
  - `10.3` “Trong hiền kiếp này” **không có số kiếp** nên lưu ý về “sau … kiếp nữa” (lời thọ ký tương lai, `bhavissati`, như `bv18:10.3`) không áp dụng ở đây; `10.4` “vị này sẽ trở thành Đức Phật” là tương lai, không đảo hướng.
  - Trùng trong chính bài: 2 nhóm Pāli trùng (`10.2`/`19.2` và `14.4`/`20.4`, mỗi nhóm 2 khoá); bản Việt trong từng nhóm giống hệt nhau ⇒ 0 cặp lệch. Hai nhóm cùng chỉ “Kakusandha” ở vị trí đồng cách (tên + danh hiệu `vināyako`; sở hữu cách `kakusandhassa satthuno`), nên dùng một bản dịch giống nhau.
  - Dấu lược: Pāli có `…pe…` ở đúng một khoá (`11.2`) → bản Việt một `…`; Pāli không có `…` ở khoá nào khác, bản Việt cũng không; Pāli không có `(…)` nên bản Việt không có.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá).
  - `vināyaka` → “bậc Điều Ngự” (8 trên 9 khoá chứa `vināyaka` trong bối cảnh Đức Phật: `bv28` 6, `tha-ap9`, `tha-ap31`; “bậc Hướng Dẫn” 1 ở `bv17:4.2`). `lokanāyaka` → “bậc Dẫn Đạo thế gian” (`bv18:17.2`, `tha-ap4`, `tha-ap6` và các khoá khác). `jina` → “bậc Chiến Thắng”. `muni` → “Mâu-ni”; `mahesi` → “Đại Ẩn Sĩ”; `mahāvīra` → “Đại Anh Hùng”; `naruttama` → “bậc tối thượng trong loài người”; `dvipaduttama` → “tối thắng giữa loài hai chân” (như `bv18`, `bv20`).
  - `sabbaññutā` → “Nhất Thiết Chủng Trí” (13.3): trong 28 khoá chứa `sabbaññutaṁ`, “Nhất Thiết Chủng Trí” 11, “Nhất Thiết Trí” 8, “toàn tri” 7, “toàn giác” 5 (các khoá có thể trùng nhiều dạng); chọn dạng nhiều nhất và cũng là dạng của `cp` cùng cụm `sabbaññutaṁ patthayāno`.
  - `yamakaṁ vikubbanaṁ` → “sự biến hóa song đôi” (4.2): “biến hóa” 5 trên 9 khoá có `vikubb-`; “song đôi” 15 trên 79 khoá có `yamaka-` (phần lớn tên phẩm hoặc người). `mil5.1.2:9.2` dịch `yamakapāṭihīra` là “thị hiện song đôi”; ở đây Pāli chỉ nói `vikubbana` không có `pāṭihāriya`, nên không thêm.
  - `abhisamaya` → “chứng ngộ” (như `bv18`, `bv20`, `bv27`; điểm yếu thuật ngữ đã nêu ở `bv18`). `dantabhūmi` → “cõi của bậc đã điều phục” (`sn22.76:10.3` cùng cụm `Dantabhūmimanuppattā` dịch “đã đạt tới cõi của bậc đã điều phục”; `mn125` dịch tên kinh “Điều Ngự Địa”). `āsavārigaṇakkhayā` → “do sự đoạn tận nhóm kẻ thù là các lậu hoặc”: cụm hợp chất chỉ xuất hiện một lần, `āsava` + `ari` (kẻ thù) + `gaṇa` (nhóm) + `khaya`, không có tiền lệ.
  - `khīṇāsava`, `vimala`, `santacitta`, `tādī` dùng đúng nguyên văn `bv16:6.3`–`6.4`, `bv17:5.3`–`5.4`. `appameyya` → “không thể đo lường”; `durāsada` → “khó tiếp cận” (`snp3.7:9.6` dịch `durāsadā` “khó tiếp cận”).
  - `koṭi` giữ nguyên chữ Pāli (15 bài, các dạng khác “triệu”, “câu-chi”; như `bv18`, `bv20`). `yojana` → “do-tuần”. `ratana` và `gāvuta` giữ nguyên chữ Pāli làm đơn vị đo (`ratana` 3 bài). `pāramī` → “ba-la-mật” (`bv20:13.3`, `cp35`).
  - `khattiya` → “Sát-đế-lợi” (449 khoá; “Sát-đế-lỵ” 2). `sambuddha` → “bậc Chánh Đẳng Giác”. `satthā` → “bậc Đạo Sư”. `janikā` → “người mẹ sinh ra” (`bv18:13.3`). `atrajo` → “người con ruột” (`bv18:15.4`). `pāsāda` → “lâu đài”. `rathayāna` → “xe” (cạnh `bv20:17.2` “xe voi”, `bv27:16.2` “ngựa”). `nāriyo samalaṅkatā` → “người nữ được trang sức đẹp đẽ” (8/11).
  - `āpaṇa` → “cửa hàng” (25.1): trong tầng, “cửa hàng” 9 và “chợ” 16 trên 205 khoá chứa `āpaṇ-`, hầu hết trong `mil`; chọn “cửa hàng” cho `dhammāpaṇa` vì Pāli nói chủ thể bày ra (`pasāretvā`) hàng hoá Pháp cho người mua. `sīhanāda` → “tiếng rống sư tử” (37 trên 112 khoá chứa `sīhanād-`; “sư tử” 94).
  - Tên riêng đã có tiền lệ trong tầng (số bài): `Vessabhū` 19, `Kakusandha` 14, `Khema` 9, `Kapila` 47, `Uttara` 27, `Sumana` 20, `Visākhā` 17, `Campā` 13, `Nandā` 8, `Vidhura` 7, `Sāmā` 7, `Sañjīva` 4, `Sunandā` 4, `Accuta` 2, `Aggidatta` 2, `Buddhija` 1. Chưa có tiền lệ: `Khemāvatī`, `Rocinī`, `Sirīsa` (cây), `Khemārāma`, `Kāma`, `Kāmavaṇṇa`, `Kāmasuddhi`: giữ dạng Pāli có dấu, như `bv18`.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `5.1` `Naradevassa yakkhassa`: đọc `naradeva` (vị trời giữa loài người) và `yakkha` (bậc đầy uy lực, nghĩa danh hiệu của Đức Phật như `mn56:29.59`, `āhuneyyassa yakkhassa`) đều là danh xưng, đồng vị ngữ với Đức Phật, và `tassa` ở `5.3` chỉ vị ấy. Cách đọc khác: dạ-xoa tên Naradeva là người được thuyết bốn chân lý (như bản Việt hiện hành của Bhikkhu Indacanda). Pāli không viết hoa và không có `nāma`; tôi chọn cách ít giả định nhất. Nếu đúng cách đọc kia thì `5.1`–`5.3` phải đổi.
  2. `4.3` `Tiṁsakoṭisahassānaṁ` đứng ở sở hữu cách nhưng `bodhesi devamānuse` ở khoá kế là mệnh đề chính có tân ngữ riêng; tôi bỏ chữ “của” ở `4.3` (khác `3.3`, nơi `Dhammābhisamayo ahu` nhận sở hữu cách đúng) để không áp khuôn “của … đã có”. Cách đọc khác: “trong số ba mươi ngàn koṭi, Ngài đã làm cho chư thiên và loài người giác ngộ”.
  3. `11.1` `Ahu kapilavhayā rammā`: `ahu` là quá khứ (`ahosi`), nhưng toàn đoạn `10.3`–`11.3` là lời thọ ký tương lai (`bhavissati`, `hessāma`), và dạng này chỉ bị che bởi `…pe…` ở `11.2`. Tôi dịch sát chữ (“Đã có nơi xinh đẹp mang tên Kapila”) vì không có chứng cứ độc lập để đổi thì. `kapilavhaya` → “nơi có tên Kapila” theo `bv29:13.4`, `thi-ap36:8.2` (2/2). **Cùng một khoá Pāli này nằm ở `bv2:62.1`, `bv21:14.1`, `bv22:13.1`, `bv23:16.1`, `bv25:13.1`, `bv26:17.1`** (các phẩm ấy chưa dịch tại thời điểm này): cần thống nhất cách dịch cho cả sáu.
  4. `9.2` `añjanaṁ madhulaṭṭhikaṁ`: `añjana` = thuốc bôi mắt (dịch “thuốc bôi mắt”, 0 tiền lệ trong tầng); `madhulaṭṭhikā` vừa là “cam thảo” vừa có thể là “mía”; tôi chọn “cam thảo”, bản Việt hiện hành của Bhikkhu Indacanda hiểu là “mật mía”. Pāli không phân xử được.
  5. `15.1` `Vasate tattha kheme pure`: `kheme` có thể là tính từ “an ổn” (cách tôi dịch) hoặc tên thành `Khema(vatī)` (bản Indacanda dịch “thành Khemā”); `13.1` cho thấy thành tên Khemāvatī. `15.3`–`15.4` `narānaṁ pavaraṁ seṭṭhaṁ jātimantaṁ mahāyasaṁ` đọc là các định ngữ của `mahākulaṁ` (cùng giống trung); cách đọc khác coi chúng chỉ Đức Phật.
  6. `17.1` `Samattiṁsasahassāni`: `sama` + `tiṁsa` đọc là “đủ ba mươi” (ba mươi ngàn); không có cách đọc khác cho con số, chỉ cho nghĩa của `sama` (đủ/tròn). Không xuất hiện trong tầng đã dịch nên không có tiền lệ.
  7. `16.3` `Kāmakāmavaṇṇakāmasuddhināmā`: đọc là ba tên lâu đài Kāma, Kāmavaṇṇa, Kāmasuddhi (khớp “ba” ở `16.4`). Bản Indacanda đọc là Ruci, Suruci, Rativaddhana (dị bản khác); Pāli ghim là bản tôi theo.
  8. `21.1` `Sāmā ca campānāmā ca`: `campānāmā` đọc là `Campā` + `nāmā` (“tên là Campā”); dịch “Sāmā và Campā”, không thêm chữ “tên”.
  9. `26.1`–`26.2` `Aṭṭhaṅgavacanasampanno, acchiddāni nirantaraṁ`: chủ ngữ của `acchiddāni nirantaraṁ` (giống trung số nhiều) không được nêu; bản Indacanda hiểu là “những phẩm chất không bao giờ khiếm khuyết”. Tôi giữ nguyên chữ, không thêm danh từ (“lời”, “phẩm chất”), và dịch `aṭṭhaṅgavacanasampanno` thành “đầy đủ lời nói tám chi phần” chứ không giải thích tám chi phần.
  10. `7.3` `Dantabhūmimanuppattānaṁ`: đọc sở hữu cách số nhiều của tính từ “đã đạt tới cõi của bậc đã điều phục”, đi với `Khīṇāsavānaṁ` ở nhóm kế; số bốn mươi ngàn ở `7.1` chỉ số vị. Không thêm chữ “vị” vì Pāli không có danh từ (cùng cách với `bv18`).
  11. `2.1` `Ugghāṭetvā sabbabhavaṁ`: `ugghāṭeti` là “mở tung, phá ra”; “bhava” dịch “hiện hữu” (như `bhavacchanda` “ham muốn hiện hữu” ở `bv27:7.2`); nghĩa đen “phá tung toàn bộ hiện hữu”, không thêm “vòng tái sinh”. `2.2` `cariyāya pāramiṁ gato` dịch “đã đạt ba-la-mật trong hạnh”; cách đọc khác: “đã đạt đến bờ bên kia trong hạnh”.
  12. `8.3`–`8.4` `Tathāgate jinaputte, dānaṁ datvā anappakaṁ`: hai sở hữu cách đồng vị với nhau; tôi đọc `jinaputta` là các vị đệ tử (con của bậc Chiến Thắng). `9.4` `paṭiyādemi varaṁ varaṁ`: lặp từ biểu thị từng thứ một; dịch “hết thứ ưu việt này đến thứ ưu việt khác”; giữ thì hiện tại của Pāli (“ta chuẩn bị”).
  13. `25.2` `naranārīnaṁ sadevake`: `sadevake` là định ngữ của `loke` ngầm hiểu; dịch “cho những người nam, người nữ, cùng chư thiên”, không thêm “thế gian” (cùng cách xử lý `bv18` ghi ở bất định 2 của phẩm ấy).
  14. `23.2`–`23.3` `accuggato mahāmuni` / `kanakappabhā niccharati`: `kanakappabhā` dịch “hào quang sắc vàng”; `accuggato` dịch “cao vút” theo `bv20:22.2` (1/1); Pāli không nói thêm hào quang của phần nào của thân, nên không thêm.
  15. `27.1`–`27.4`: `Khemārāma` giữ danh từ riêng (`ārāma` là “vườn/tu viện”, không tách); `ti` ở `27.4` là chữ đóng lời, nháy đóng nằm ở khoá này, nháy mở ở `1.1`, nên cả bài là một lời kể.

