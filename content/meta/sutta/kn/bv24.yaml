  Sửa lan 2026-10-13: khoá bv24:15.1–15.2 — Pāli `Vasate tattha kheme pure, sambuddhassa
  mahākulaṁ`: `vasate` là động từ, `mahākulaṁ` là chủ ngữ (đại gia tộc cư ngụ tại thành ấy), không
  phải vị ngữ “là đại gia tộc”. Trước: “Cư ngụ tại thành an ổn ấy, / là đại gia tộc của bậc Chánh
  Đẳng Giác;” → “Tại thành an ổn ấy cư ngụ, / đại gia tộc của bậc Chánh Đẳng Giác;”. Căn cứ: Pāli
  root, cùng cấu trúc `Vasate tattha nagare, sambuddhassa mahākulaṁ` ở bv25:16.3–16.4 (“Tại thành
  phố ấy cư ngụ, / đại gia tộc của bậc Chánh Đẳng Giác.”). Bất định 15.1 đã nêu ở các mục trên nay
  được phân xử theo tiền lệ này; điểm không đổi.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 7 khoá bất đồng nghĩa → sửa 0, giữ 4, bất định 3. Giữ: 3.4 (bản nguyên bài thêm lần thứ nhất, Pāli chỉ có dhammābhisamayo ahu); 5.1 (Naradevassa yakkhassa: bản nguyên bài hiểu là dạ-xoa tên Naradeva; trong Pāli đây là danh hiệu của Đức Phật khi tuyên bố bốn chân lý, yakkha cũng dùng cho bậc đáng cúng dường ở mn56:29.59; giữ bậc đầy uy lực); 16.3 (tên ba tòa lâu đài: bản nguyên bài là Ruci, Suruci, Rativaddhana; Pāli ghim là Kāma, Kāmavaṇṇa, Kāmasuddhi); 17.3 (tên người vợ: bản nguyên bài là Virocamānā; Pāli ghim là Rocinī). Bất định: 9.2 (madhulaṭṭhikaṁ: bản nguyên bài là mật mía, bản dự án là cam thảo; từ có thể chỉ cả hai); 11.1 (Ahu kapilavhayā rammā đứng riêng vì 11.2 là …pe…; bản nguyên bài đọc là rời khỏi nơi xinh đẹp tên Kapila, bản dự án đọc là đã có nơi xinh đẹp tên Kapila theo ahu; cả hai khả dĩ về ngữ pháp); 15.1 (kheme pure: tính từ an ổn hay tên thành Khema/Khemāvatī; bản nguyên bài hiểu là tên). Rà đối kháng lại số lượng (bốn mươi ngàn koṭi, ba mươi ngàn koṭi, bốn ngàn năm, ba mươi ngàn người nữ, tám tháng, bốn mươi ratana, mười do-tuần, bốn mươi ngàn năm, một gāvuta) với Pāli: khớp bản nguyên bài. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

