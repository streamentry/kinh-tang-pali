notes: |-
  Dịch từ Pāli root, 117 khoá, đủ khoá, đúng thứ tự Pāli; không có tầng tham khảo tiếng Anh hay tiếng Việt cho bài này nên triangulation chỉ dựa vào Pāli, các bài kệ trùng nguyên văn trong tầng Việt đã dịch (nhiều nhất là tha-ap401, cùng mẫu Đức Phật Sumedha và mái che bằng vàng, trùng 76 khoá Pāli) và ngữ cảnh Therāpadāna.
  Tên bài (khoá 0.3) lấy đúng giá trị translationTitle: Pāli 0.3 là Yasattheraapadāna, không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số). Kiểu tên: ở phạm vi tha-ap500 đến tha-ap600, Ký Sự Về X chiếm 27, Bài Kệ Tuyên Ngợ Về X 15 (cộng 1 Tuyên Ngợi); toàn tầng tha-ap thì ngược lại: Tuyên Ngợ 242, Tuyên Ngôn 134, Ký Sự 118, Tuyên Ngợi 10. Hai phạm vi cho hai đa số khác nhau; theo phạm vi gần nhất và các bài liền kề tha-ap551, tha-ap554, tha-ap555 thì dùng Ký Sự Về. Chữ Tuyên Ngợ không dùng vì chưa rõ gốc, vấn đề đó để biên tập phán một lượt cho cả cuốn. Khoá 0.2 Yasavagga dịch Phẩm Yasa (7 khoá so với 1 khoá Phẩm Danh Vọng).
  Khoá 29.1 dùng công thức Tôi nghe như vầy ... đã nói những bài kệ này (498 khoá của tầng dùng những bài kệ này, 2 khoá dùng số ít; ở phạm vi tha-ap500 đến tha-ap600 là 42 khoá, 0 khoá số ít; Pāli imā gāthāyo là số nhiều). Khoá 30.1 dùng Ký sự về Trưởng lão Yasa, thứ nhất, theo tha-ap551 và tha-ap554: trong các colophon paṭhamaṁ đã có, dạng Bài Kệ Tuyên Ngợ Về Trưởng lão X, thứ nhất 24 khoá, Tuyên Ngôn 13 khoá, Ký Sự Về 3 khoá (2 viết hoa, 1 viết thường); chọn dạng Ký sự cho khớp tên bài ở 0.3.
  Số Pāli: saṭṭhi 60 nhân sahassa 1000 là 60.000 nhạc cụ (7.1); soḷasa 16 nhân 1000 là 16.000 phụ nữ (7.3); aṭṭhārase kappasate là 18 nhân 100 bằng 1.800 kiếp (19.1); vasīsatasahassehi dùng satasahassa là 100.000 theo tiền lệ của tầng (13.3, một trăm ngàn bậc tự tại); sahassakkhattuṁ là một ngàn lần (19.3); pañcaṅgikehi là năm chi (14.1); sattaratana là bảy báu (5.3); tisso vijjā là ba minh (27.3); catasso là bốn (28.1); aṭṭhime là tám (28.2); chaḷabhiññā là sáu thắng trí (28.3). Tiṁsakappasahassamhi (21.1 và 25.1): theo quyết định của người biên tập tiṁsa là 30 nên là ba mươi ngàn kiếp (30 nhân 1000 là 30.000); brief phẩm tha-ap có ghi tiṁsa là 3 (ba nghìn kiếp) nhưng bài này không theo. Tiền lệ trong tầng cho đúng dòng Pāli này: 7 khoá Vào ba mươi ngàn kiếp trước đây, 1 khoá Trong ba mươi ngàn đại kiếp, 1 khoá Trong suốt ba nghìn kiếp, 1 khoá Từ ba trăm nghìn ấy. 21.1 là lời thọ ký tương lai nên dịch Sau ba mươi ngàn kiếp nữa (cùng cách với tha-ap401); 25.1 là quá khứ nên dịch Vào ba mươi ngàn kiếp trước đây. Hai khoá 21.1 và 25.1 là Pāli trùng nguyên văn trong chính bài nhưng Việt khác nhau vì khác thì (bhavissati ở 21.4, adadiṁ ở 25.2). 19.1 Aṭṭhārase kappasate đi với ramissati nên dịch thành khoảng thời gian: Trong một ngàn tám trăm kiếp (theo tha-ap401); tầng cũng có dạng Vào một ngàn tám trăm kiếp trước dành cho ngữ cảnh quá khứ, và bv15 đến bv17 dịch Sau một ngàn tám trăm kiếp nữa cho lời thọ ký của Đức Phật Gotama; cách đọc 19.1 là sau 1.800 kiếp hay trong 1.800 kiếp chưa phân xử được bằng Pāli một mình.
  Pāli trùng nguyên văn trong chính bài: hai nhóm khoá trùng thật và cả hai Việt giống nhau: 9.1 và 10.3 (Sambuddhaṁ abhivādetvā), 17.3 và 23.1 (Bhikkhusaṅghe nisīditvā); nhóm thứ ba 21.1 và 25.1 Việt khác như đã nói. So với tầng (các bài tha-ap và thi-ap đã dịch): đã dò 86 khoá Pāli có trùng nguyên văn ở bài khác (có cả 0.1 và 0.2); 82 khoá Việt giống một bản đã có, trong đó 73 khoá giống bản đa số; 4 khoá Việt khác bản đã có: 11.1 (Pāli có dấu phẩy chứ không có dấu hai chấm vì 11.2 là lời kể, nên dùng dấu phẩy), 11.4 (bỏ chữ này không có trong Pāli bhavanaṁ āgamissati), 12.3 (dịch cúng dường cho pūjayissāma ở 12.4 thay vì dâng lên, vì động từ nằm sau ở khoá kế), 20.4 (tassa chadanaṁ dhārayissati dịch mái che sẽ được mang theo, xem bất định); 31 khoá không có tiền lệ nguyên văn trong tầng.
  Ngôi kể: người kể ta (tầng 107 khoá ta, 43 khoá tôi, 3 khoá con cho dòng Kilesā jhāpitā mayhaṁ; phạm vi tha-ap500 đến tha-ap600 là 26 ta so với 16 tôi, 1 con); Đức Phật Sumedha nói ở 18 đến 23 xưng Ta viết hoa theo tha-ap401. Công thức 26 đến 28 theo tiền lệ đã đo (Bốn vô ngại giải 521 khoá; Sáu thắng trí đã chứng đắc 65 khoá; Thật lành thay sự đến của ta 109 khoá; đã làm tròn lời dạy của Đức Phật 135 khoá ở dạng không đóng nháy, 482 khoá ở dạng đóng nháy kép).
  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 28.4; nháy đơn mở ở 11.3 và đóng ở 12.4; nháy đơn mở ở 18.1 và đóng ở 23.4; Việt khớp Pāli từng khoá, 0 lệch trên 117 khoá. Pāli của bài không có …pe… và không có (…) trần nên Việt không có dấu lược nào.
  Bất định, không đưa vào thân kinh: tên chim giữ phiên âm (cakkavāka theo ja451, ravihaṁsa, tittira, pāvaka, jīvaṁjīvaka, kosiya, piṅgala); 4.4 pāvakā trong danh sách chim được hiểu là tên một loài chim, nhưng pāvaka thông thường nghĩa là lửa và 16 khoá dạng pāvak- ở các bài khác của tầng đều là lửa hoặc tên Pāvaka là lửa, tha-ap401:4.4 có pampakā ở chỗ tương ứng; 5.2 piṅgalā có thể là tính từ (vàng nâu); 2.1 mandāraka giữ phiên âm hoa mandāraka (tầng có mandārava là hoa cõi trời). 5.4 maṇimuttapavāḷikā dịch ngọc ma-ni, trân châu và san hô; tha-ap401:5.4 ở chỗ tương ứng là maṇimuttikavālukā (cát là ngọc ma-ni và trân châu), nên pavāḷikā có thể là dạng khác của vālukā (cát), và đây là chỗ có hai cách đọc; tầng có pavāḷa là san hô (ja454, pv18, mil7.3.10). 6.2 nānākhandhasameritā dịch với nhiều thân cây lay động (khandha là thân cây; sameritā là lay động); tha-ap401:6.2 và pv24:2.2 có nānāgandhasameritā (tỏa nhiều loại hương) nên đây có thể là dị bản, nhưng thân kinh theo Pāli của bài này. 17.1 Yaṁ vadeti sumedho so không có tiền lệ nguyên văn; tha-ap401:17.1 là Yaṁ vadanti sumedhoti (vị mà người ta gọi là Sumedha); ở đây vadeti là ngôi ba số ít nên dịch sát Pāli Điều mà Sumedha ấy nói ra, bậc tiếp nhận lễ vật hiến cúng, ngồi giữa Tăng đoàn đã nói những bài kệ này; câu có thể là dị bản hỏng của dạng ở tha-ap401, nên chưa phân xử được. 18.1 và 18.2 hiểu tappayi là ngôi ba số ít (người ấy đã làm hài lòng Ta và tất cả những vị này); tha-ap401:18.2 là tappayiṁ. 12.2 tavantike là ngôi hai số ít (gần bên ngươi) trong lời người kể nói với đoàn tùy tùng, chưa phân xử được. 12.1 lābhā amhaṁ suladdhā no, chữ no lặp nghĩa với amhaṁ nên không dịch riêng. 20.3 và 20.4 sabbasoṇṇamayaṁ tassa chadanaṁ dhārayissati dịch Toàn bằng vàng, của vị ấy, mái che sẽ được mang theo: động từ ngôi ba số ít không nêu chủ ngữ, tha-ap401 dịch vị ấy sẽ mang một mái che; cách đọc nào cũng bảo vệ được, chọn dạng ít giả định chủ ngữ; 23.3 và 23.4 dịch sẽ theo bối cảnh thọ ký (dhārenti là số nhiều, ḍayhatha đọc như ngôi ba số ít). 20.1 yoniṁ dịch nơi sinh; 20.1 upagacchati chủ ngữ là vị đã cúng dường ở 18.1. 24.1 sāmañña là đời sống sa-môn; 24.3 maṇḍape dịch trong lều (6 khoá so với 2 khoá mái che trong tầng); 24.4 santāso là nỗi kinh sợ (tầng mil5.2.3 dịch nỗi kinh sợ), khác santāpo ở tha-ap401:24.4 (nỗi nóng bức). 25.3 Duggatiṁ nābhijānāmi dịch Ta không còn biết đến đọa xứ theo 62 khoá ta của dạng đọa xứ (tầng còn có 98 khoá tôi cùng dạng, 51 khoá khổ xứ và 139 khoá Ta không biết mình rơi vào khổ đau); chữ không còn có trong tiền lệ nhưng nābhijānāmi trong Pāli chỉ là không biết. 15.3 và 15.4 bījanīyo pavāyanti ... bhikkhusaṅghaṁ anuttaraṁ dịch quạt đưa gió đến Tăng đoàn tỳ-kheo vô thượng (đối cách của Pāli); bījanī là quạt. 16.3 paccekadussayugale dịch mỗi vị một cặp vải (1 tiền lệ ở tha-ap401).
