  Lượt hoàn thiện theo lời phê chấm lại 2026-10-18 (score/pe3/pe5.md, §5.2 áp cho pe; Claude Opus 5.5): sửa 12 khoá, thêm 5 chú thích người đọc (37.2, 42.6, 42.7, 50.4, 50.5). (1) Lỗi nhỏ 50.4–50.5: «yāva patiṭṭhitaṁ» là dấu lược của lời trích sn12.64:2.1 («patiṭṭhitaṁ tattha viññāṇaṁ virūḷhaṁ», published), «tattha viññāṇaṁ» ở 50.5 thuộc câu trích, cả câu trích là sự định danh nguồn phát sinh (ne14:4.3–4.9 published «Ayaṁ pabhavapaññatti …»; BJT tipitaka.lk p128, TTPV 44 tr. 128 «patiṭṭhitaṁ. Tattha viññāṇaṁ –pe– pabhavapaññattiṁ paññapeti»; Indacanda tr. 129): «cho đến khi được an lập» / «Trong đó, thức được định danh là …» thành «cho đến: được an lập» / «ở đó, thức: [như vậy] được định danh là …» (một câu qua hai khoá; không thêm nháy hay dấu lược, theo quy ước của bài). (2) 42.6–42.7: chữ ghim thiếu chủ ngữ, BJT p124 chêm «(appamādo)», «(pamādo)» (TTPV tr. 124; Indacanda tr. 125): chỉ ghi ở chú thích, không đưa chủ ngữ vào lời kinh; chấm thành hỏi–đáp như 42.2–42.5 và BJT (bỏ dấu hỏi thứ hai). (3) 37.2 (locus §6.2, người chấm nêu đích danh): «rơi vào» là chữ đoán, nay đặt «[rơi vào]». (4) Câu vụng: 3.3 «ca» là liệt kê, không phải đẳng thức (như 19.4; BJT p108 «anugīti yā ca vicayo»): «Lời kệ nối theo ấy và sự khảo xét»; 32.1 «citte» là vị cách tuyệt đối lược «vutte», cùng khuôn 30.1 «Vuttamhi ekadhamme», 31.1–31.2: «khi tâm [được nói], sắc đã được nói» (Indacanda tr. 121 cùng hướng); 53.2 bỏ calque «mười giới thuộc sắc nào;»; 73.7 «anurūpassa» thuộc cách, đối tượng của «samugghātāya»: «sự nhổ tận gốc điều tương ứng». Cùng loại, ngoài danh sách: 53.3 (cùng khuôn 53.2; «viññāṇakkhandho ca» thành «cũng»), 27.2 («trong năm sắc xứ nào» thành «tức là trong năm sắc xứ»), 77.4 (yāva là dấu lược trích, «iti» đánh dấu nội dung của tri kiến: «Cho đến: đã giải thoát; có tri kiến» thành «Cho đến: có tri kiến rằng đã giải thoát»; BJT p144 «yāva vimuttamiti ñāṇadassanaṁ bhavati», như sn35.86:24.3 published). Không đổi: 19.4 («te» có trong chữ ghim, đọc là số nhiều chỉ cả cặp, «ấy» đứng sau cả cặp); các mảnh locus §6.2 khác (14.3, 37.1, 37.3, 37.4, 63.2, 69.x, 74.x) giữ theo §6.2; các chỗ lệch thuật ngữ với ne đã ghi (tham dục/dục ái, liền kề/kế tiếp, sinh/sanh) người chấm không đề nghị sửa. Status, quality, blocking_errors không đổi. Bảng: dec/polish_pe5.tsv. Chưa chạy validate/test/check.
  Rà lỗi còn sót 2026-10-18 (HUNT_BRIEF, Claude Opus 5.5): 537/537 khoá đã đọc với Pāli ghim, đối chiếu chỗ nghi với DPD, câu song song trong Pāli ghim, BJT (TTPV 44) và bản dịch Indacanda; sửa 0 khoá. Không sửa (NGHI-GIỮ): 73.14 «avacchedattho» «nghĩa đứt đoạn» (DPD avaccheda «cutting off» đúng chữ ghim; nhưng 73.2–73.3 của chính bài, ne18:5.1 published «Không đứt đoạn», BJT p142 «avicchedattho» và Indacanda tr. 143 «sự không gián đoạn» đòi nghĩa ngược lại — chỉ gỡ được bằng dị bản §5.6, ngoài phạm vi lượt này; ghi để người biên tập xét); 75.2 «na vattabbaṁ» (locus §6.2, «không cần»/«không nên» đều đọc được); 24.7 «samādhino» (thuộc cách lưỡng khả, Indacanda tr. 117 cùng cách đọc); 15.11, 51.4, 63.1, 73.10 (Indacanda cùng hướng hoặc nghĩa tương đương); 24.5, 50.3 (mệnh đề quan hệ đứng riêng theo đúng chữ ghim); 72.8 «sā» (cùng vấn đề locus 72.5). Status, quality, blocking_errors không đổi. Bảng: dec/hunt_pe5.tsv. Chưa chạy validate/test/check.
  Gỡ 73.14 2026-10-18 (tiền lệ E của hội đồng; §5.1, §5.6; điều phối viên theo uỷ quyền §6, Claude Opus 5.5): «avacchedattho» «nghĩa đứt đoạn» → «nghĩa không đứt đoạn». Chữ ghim (DPD avaccheda «sự cắt đứt») trái chính định nghĩa mà danh sách tóm lại (73.2 bj «avicchedo», 73.3 «avecchedo» = «sự không đứt đoạn»; 73.12 «na samucchijjati») và trái danh sách song song trong Pāli ghim ne18:5.1–5.2 «avupacchedattho/avupacchedo» (published «Không đứt đoạn»); BJT tipitaka.lk p142 / TTPV 44 tr. 142 «avicchedattho» (cước chú: avacchedattho – Ma; PTS không có chữ này); lớp variant tại commit ghim không ghi gì ở khoá này; DPD aviccheda «non-interruption; continuity»; Indacanda tr. 143 «sự không gián đoạn». Chú thích tại khoá. «anivattiattho» cùng khoá không đổi (§6.2). Status, quality, blocking_errors không đổi. Bảng: dec/fix_pe5.tsv. Chưa chạy validate/test/check.
