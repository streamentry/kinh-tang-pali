  Nghiên cứu nguồn ngoài 2026-10-16: Ñāṇamoli, The Piṭaka-Disclosure (Peṭakopadesa), PTS 1964, https://ancient-buddhist-texts.net/Reference/PTS/Nyanamoli-Pitaka-Disclosure.pdf (bản scan, đọc qua OCR của người làm; còn bản quyền PTS; chỉ làm bằng chứng nghĩa); Indacanda, Peṭakopadesa song ngữ, https://tamtangpaliviet.net/TTPV/ttpv_44_Pet.pdf (NOASSERTION; chỉ làm bằng chứng nghĩa; lưu ý Indacanda có chỗ nhận hiệu đính của Ñāṇamoli nên không hoàn toàn độc lập với PD); đã đối chiếu các khoá nêu trong blocker Pāli ghim hỏng với chú thích hiệu đính của Ñāṇamoli (cuối mỗi chương) và với Indacanda ở một số chỗ; chưa đọc song song toàn văn. Theo chính sách hội đồng (mục D) chỉ dùng nguồn để hiểu NGHĨA chữ ghim hỏng: không sửa Việt theo dị bản hay chữ Pāli suy đoán, không gỡ blocker Pāli hỏng; nghĩa các chữ ghim hỏng theo nguồn: `1.10` Ñāṇamoli đọc `pannasatividhe` theo Bb thay chữ ghim vô nghĩa và ghi tổng số mục chưa chắc; `15.7` đoạn hỏng, ý là chín loại mạn (Vbh 389–390) dẫn từ S i 16 (`navadvāraṁ`, `puṇṇaṁ`); `15.15`/`19.3` `bahussutavā` chắc chắn là chép sai; `36.5` `asitiṁ` hiểu là `a-sitiṁ`; `57.15`/`57.17`/`57.18`, `61.3`/`61.5`/`61.6`/`61.9`, `63.2` là đoạn chép lặp rối của người chép; sửa không có; bất định mọi khoá trong blocker.
