 là ái và kiến; «mattiko» không dịch). KHÔNG GỠ (63): 5.13, 13.10 (mạch 13.11–13.14 đòi «pacchā» nhưng không có câu song song), 13.13, 14.3, 15.3, 15.7, 15.15, 19.3, 24.11, 36.2, 36.5, 37.1–37.4, 39.2, 39.4, 39.5 (bj, pts «yaṁ vattabbaṁ» nhưng câu vẫn không đọc ra, thiếu điều kiện 3 của §5.1), 39.12, 42.8, 42.10, 43.15, 45.3, 49.5, 49.8, 49.10, 51.2, 51.13, 52.9, 57.2, 57.4, 57.6, 57.7, 57.13, 57.15, 57.18, 58.2, 58.7, 61.3, 61.5–61.7, 61.9, 62.1, 63.2, 65.3, 66.13, 68.3, 68.6, 68.7, 69.1, 69.2, 69.4, 69.5, 72.2, 72.3, 72.5, 73.2, 73.4, 73.5, 73.6, 73.8, 74.2–74.5, 75.2, 75.8, 76.1, 77.8, 77.10: đã thử cả ba cách; không có câu song song cùng câu trong Pāli ghim, lớp variant không ghi dị bản hoặc dị bản không làm câu đọc ra; căn cứ từng locus ở bảng thi hành. Riêng 73.2: chữ «abhicchedo» đủ §5.1 (bj «avicchedo», DPD aviccheda, 73.3, ne18:5.1) nên dịch «sự không đứt đoạn» thay «sự gián đoạn», nhưng «tatiyaṁ balaṁ nivatti» vẫn chưa phân xử nên locus chưa gỡ. Sửa khác: 1.10 «mười sáu loại hướng dẫn» và 74.3 «hướng dẫn gom góp» thành «phương thức» theo B5 của hội đồng (hai khoá còn sót). Vì còn locus chưa gỡ nên bài giữ draft, không chấm lại; blocking_errors, status và quality không đổi. Chưa chạy validate/test/check.
  Lượt hai §5.6 (BJT) 2026-10-17 (docs/editorial-decisions-2026-10-17.md §5.6; Claude Opus 5.5): đối chiếu 63 locus còn treo trong blocker với ấn bản Buddha Jayanti (tipitaka.lk, kèm cước chú BJT) và bản in lại trong Tam Tạng Pāli–Việt tập 44 của Bhikkhu Indacanda (Pāli BJT với cước chú Ma, Syā, PTS; bản dịch Việt ở trang lẻ kế tiếp). GỠ 17, mỗi khoá có chú thích người đọc nêu chữ ghim, cách đọc BJT (trang tipitaka.lk, trang TTPV), cước chú dị bản và nguồn giải nghĩa: 13.10 (pacchā; 13.11, snp5.2:7.1–8.4), 13.13 (vitakke ca, vitakkā āvilatāya; ne5:44.1), 36.5 (amatameva; ne9:12.2), 49.8 (rajaṁ; câu trích là ud3.1:4.2, dịch theo câu song song), 51.13 (aveccappasādehi; sn48.8), 57.6 (yathā), 57.13 (anatthemāni; DPD anattha 2), 57.18 (sattapaññattiyā viết liền; DPD sattapaññatti; câu chữ giữ nguyên), 58.2 (tayo gāthā … ārambhena bhāsīyanti), 58.7 (atthi tāva … abhāsitaṁ; 60.1), 61.3 (katapaññatti; câu chữ giữ nguyên), 61.5–61.7 (61.6 akampiyaṭṭhena, 61.7 seva sati; ne21:39.1, ps1.1:86.5; 61.5 giữ chữ ghim và câu chữ), 61.9 (guḷodaka; DPD), 62.1 (saṅgato ekattatā … dassetabbā), 68.6 (janeti), 73.5 (anupubbena), 73.6 (parisosaṁ); nguồn giải nghĩa kèm theo ở mọi khoá là bản dịch Việt của Indacanda cho đúng câu ấy (chỉ trích ngắn, không chép), cộng câu song song trong Pāli ghim khi có. KHÔNG GỠ 46: BJT trùng chữ ghim ở chỗ hỏng (5.13, 15.7, 19.3, 24.11, 36.2, 39.4, 39.12, 42.8, 42.10, 43.15, 49.5, 49.10, 51.2, 52.9, 57.2, 57.4, 57.7, 57.15, 66.13, 69.1, 69.2, 69.4, 72.2, 72.3, 72.5, 73.2, 73.8, 75.2, 77.10); BJT tự đánh dấu nghi đúng chỗ ấy bằng [?], (yā?) hay ngoặc kèm dấu hỏi (15.15, 37.1–37.4, 39.2, 63.2, 65.3, 68.3, 68.7, 69.5, 75.8, 76.1); BJT khác nhưng câu vẫn không đọc ra hay thiếu nguồn giải nghĩa (14.3, 15.3, 45.3, 73.4, 74.2–74.5, 77.8); 39.5 («yaṁ vattabbaṁ», BJT và PTS) đọc được nhưng BJT đặt cả đoạn 39.2–39.5 trong ngoặc kèm dấu hỏi và Indacanda phải chêm chữ, nên chưa gỡ. Ở 73.2 và 74.5 Indacanda hiệu đính theo Ñāṇamoli (santati phalaṁ nibbatti; nibbatta), không phải chữ BJT, nên không thuộc §5.6. Ngoài phạm vi locus, ghi để người biên tập xét: BJT đọc «ābhāsitāsu» ở 58.3, «na niddisitabbā» ở 58.6 và «attho na niddisitabbo» ở 60.2 (cước chú: không có «na» ở Ma, PTS), hợp mạch phương thức thanh tẩy hơn chữ ghim; bản Việt ba khoá ấy hiện dịch theo chữ ghim và chưa sửa. Còn 46 locus nên bài giữ draft, không chấm lại; status, quality và blocking_errors không đổi. Chưa chạy validate/test/check.
  Kiểm độc lập lượt hai §5.6 2026-10-17 (Claude Opus 5.5, người kiểm khác người làm): tự mở lại BJT (tipitaka.lk), TTPV 44, DPD và các câu song song cho cả 17 locus GỠ; 17 ĐÚNG, không hoàn nguyên. Sửa nhỏ ở chú thích: 51.13 (chữ ghim «aveccappasādeti» DPD tách máy được, nhưng không nối được vào câu), 57.13 (DPD tách máy «anatthe + imāni»), 61.7 («seva sati» là cách hiểu «sā eva sati», không phải phép nối chuẩn). Ngoài locus, theo đề nghị của người làm, kiểm lại phương thức thanh tẩy 58.2–60.7: chữ ghim 58.3 «avasiṭṭhāsu bhāsitāsu», 58.6 «gāthā niddisitabbā», 60.2 «attho niddisitabbo» tự mâu thuẫn với lý do ở 58.5, 58.7, 60.3 và với 60.4 («tadā»); BJT p132/p134, TTPV tr. 132/134 đọc «ābhāsitāsu» (= abhāsita, như BJT viết «so ābhāsito» ở 58.5), «na niddisitabbā», «attho na niddisitabbo» (cước chú: không có «na» ở Ma, PTS); nguồn giải nghĩa: 39.4 «abhāsitāhi gāthāhi aniddiṭṭho attho bhavati», ba bài kệ dhp21–23 trích trong đoạn, Indacanda tr. 133, 135. Đủ §5.6, nên ba khoá dịch theo BJT kèm chú thích, và 60.3 đọc lại theo chữ ghim thành câu trần thuật («Vì ở đó vẫn có phần còn lại:», cùng khuôn 58.7). Vẫn còn 46 locus treo nên bài giữ draft; status, quality, blocking_errors không đổi.
