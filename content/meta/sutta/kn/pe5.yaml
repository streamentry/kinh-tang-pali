notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pe/pe5_root-pli-ms.json` (537/537 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli). Đây là nền tảng thứ năm (`Hāravibhaṅgapañcamabhūmi`) của Peṭakopadesa, đoạn kết `78.1` gọi là "nền tảng thứ năm". Bài phân tích mười sáu hướng dẫn (`hāra`) theo thứ tự: đề ra (1), khảo xét (2–19), lý luận (20–24), nền tảng ứng với (25–28), đặc trưng (29–32), bốn phần (33–39), quy căn (40–44), phân loại (45), chuyển đổi (46), ngữ đồng nghĩa (47–49), định danh (50–51), dẫn đưa (52–57), thanh tẩy (58–60), áp dụng (61–63), trợ duyên (64–73), gom góp (74–77); `77.12` chốt "mười sáu hướng dẫn". Văn bản Pāli ghim ở nhiều chỗ hỏng hay cụt (xem phần bất định): bản Việt dịch sát chữ, không gỡ hộ, và không thêm giải thích vào lời kinh.

  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho pe5: tầng `english-sujato` chỉ có chín nhánh `cp dhp iti ja kp snp thag thig ud` dưới `sutta/kn/`, không có thư mục `pe`; manifest chỉ liệt kê tệp Pāli `kn/pe/pe5_root-pli-ms.json` cho pe5. Đây là `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` chưa có tệp nào cho `pe` (chỉ có `ne24`, `ne27`–`ne30`, `ne32`, `ne34`). Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú. Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.0 (≤ 8.0). Bài này dịch chỉ từ Pāli, từ tiền lệ thuật ngữ của chính tầng dự án (các bài Netti `ne3`–`ne19`, và `pe3`, `pe4`, `pe6`, `pe7`, `pe9`) và từ các bài kinh Nikāya mà bài trích lại hay song song (`dhp21`–`dhp23`, `dhp292`, `dhp293`, `sn1.23`, `sn1.29`, `an8.16`, `an7.36`, `mn12`, `an4.8`, `dn16`, `dn33`, `dn34`).
    Hệ quả: các khoá có Pāli hỏng ở phần bất định dưới đây không có cách đọc độc lập nào để đối chiếu; không tuyên bố bản này đã đối chiếu English hay Việt hiện hành.

  - Coverage English:
    Mẫu số = 323 khoá Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`, trên tổng 537 khoá). Sujato phủ 0/323 (0/537 khoá tổng); `english-project` 0; coverage English 0%, dưới ngưỡng, nên bài chưa thể `review`/`published`; `reference-gaps.yaml` có entry cũng không cứu được `published` (ngoài phạm vi lát này, không chạm).

  - Tiền lệ cùng bộ (`pe`, `ne`):
    `0.1` "Peṭakopadesa" dùng lại nguyên văn của `pe3`, `pe4`, `pe6`, `pe7`, `pe9`. `0.2` giữ số thứ tự "5." như `pe3:0.2`, `pe4:0.2`, `pe6:0.2`, tên "Nền Tảng Thứ Năm: Phân Tích Các Hướng Dẫn" theo nhịp `pe6:0.2` (`bhūmi` đầu bài → "nền tảng"). `78.1` theo nhịp `pe3:86.1`: "Nền tảng thứ năm trong Peṭakopadesa, tên là … của … Mahākaccāyana, vị cư ngụ ở rừng Jambu"; `suvīra` đứng trước tên được dịch "bậc rất anh dũng" (bài trước không có từ này; có thể là danh xưng, cũng có thể là tên riêng — chưa phân xử).
    Tên các hướng dẫn theo cách bộ Netti (`ne3`–`ne19`) đã dùng, đếm trong `ne`/`pe` theo số khoá Pāli có từ gốc (khoá dùng cách dịch được chọn / tổng khoá có từ gốc): `hāra` → "hướng dẫn" (53 khoá "hướng dẫn", 8 khoá "phương thức" ở `ne1`, `ne2`, `ne6:17.2`, `ne20`), `desanā` "đề ra", `vicaya` "khảo xét" (14/31; "tra xét" 2 khoá ở `ne3`), `yutti` "lý luận" (12/16), `padaṭṭhāna` "nền tảng ứng với" (139/158), `lakkhaṇa` "đặc trưng" (117/135), `catubyūha` "bốn phần" (9/9), `āvaṭṭa` "quy căn" (10/26; các khoá còn lại là `nandiyāvaṭṭa` và các từ ghép khác), `vibhatti` "phân loại" (5/8), `parivattana` "chuyển đổi" (7/7), `vevacana` "ngữ đồng nghĩa", `paññatti` "định danh" (57/60), `otaraṇa` "dẫn đưa" (47/56), `sodhana` "thanh tẩy" (9/9), `adhiṭṭhāna` "áp dụng" (7/7), `parikkhāra` "trợ duyên" (13/13), `samāropana` "gom góp" (16/19). Khác tiền lệ: tiêu đề `ne4`–`ne19` dịch "nhóm X hướng dẫn" vì có `vibhaṅga` ("nhóm"); bài này liệt kê trực tiếp các hướng dẫn nên dịch "hướng dẫn X", và `Tattha` đầu khoá dịch "Trong đó" theo `pe3`, `pe6`, `pe9` (các bài `ne` dịch "Ở đây").
    Các thuật ngữ đã đo (cùng cách đếm): `byañjana` "câu chữ" (24/39 trong `ne`/`pe`; "văn từ" 3); `nirutti` "định nghĩa" (11/12); `adhippāya` "mục đích" (18/19); `sandhi` "nối kết" (10/13); `ekattatā` "tính đồng nhất" (20/26); `ārambha` "việc khởi thành" (12/25); `nissanda` "dòng tuôn chảy" (36/36 trong `ne`/`pe`; 38/48 trên toàn tầng); trên toàn tầng: `anusaya` "tùy miên" (84/135, so với "khuynh hướng" 4), `pariyuṭṭhāna` "sự hiển hiện" (17/55, so với "ám ảnh" 12 và "xâm chiếm" 10; dạng quá khứ phân từ `pariyuṭṭha` dịch "bị … xâm chiếm"), `vipallāsa` "đảo lộn" (101/130, so với "điên đảo" 5), `kāmaguṇa` "năm dục" (56 khoá "năm dục", 11 khoá "năm dục lạc", trên 96 khoá có `pañca kāmaguṇā`/`pañcasu kāmaguṇesu`), `ahaṅkāra` "chấp tôi" (34/52) và `mamaṅkāra` "chấp của tôi" (34/51), `ariyasacca` "Thánh đế" (277/324), `vesārajja` "sự tự tin" (23/65), `passaddhi` "khinh an" (111/190), `vīmaṁsā` "thẩm xét" (7/141; chủ yếu "quán sát" ở nghĩa `iddhipāda`). Ngoài ra: `sacca` đứng riêng "đế" (như `pe6:59.5`), `sakkāyadiṭṭhi` "thân kiến", `kabaḷīkāra āhāra` "đoàn thực" (`ne14`, `ne36`), `puññābhisaṅkhāra`… "hành phước", "hành vô phước", "hành bất động", `mahāpadesa` "đại giáo pháp" (`dn16`), `sakkāyanirodhagāminī paṭipadā` "con đường đưa đến sự diệt của hữu thân" (`mn44`, `mn148`), `tathāgatabala` "năng lực của Như Lai" (`mn12`), `visamalobha` "tham lam bất chính" (`dn26`).
    Các chỗ khác tiền lệ hoặc có hai cách: (a) `rāga` ghép với dục, sắc, hữu, vô sắc, kiến dịch "tham dục", "tham sắc", "tham hữu", "tham vô sắc", "tham kiến" theo `pe6:46.3` ("tham dục") và để tách khỏi `taṇhā` "ái"; `ne7:2.1` (cùng chuỗi `padaṭṭhāna` này) dịch "dục ái", "sắc ái", "hữu ái" — ngoài phạm vi, không sửa; (b) `samanantarapaccaya`/`paramparapaccaya` và `samanantarahetu`/`paramparahetu` dịch "duyên liền kề"/"duyên gián tiếp"/"nhân liền kề"/"nhân gián tiếp" theo `pe4:6.4`, còn `ne18:3.7` dịch "nhân kế tiếp"/"nhân dây chuyền"; (c) `jāti` dịch "sinh" (đa số tầng và `pe3`, `pe6`), còn `ne17`, `ne18` viết "sanh"; (d) `vipariṇāmadukkhatā` "biến hoại khổ" (`ne5:15.7`, `ne36:59.12`) còn `pe9` viết "hoại khổ"; (e) `12.3` và `12.4` dịch từng dòng theo Pāli ("cách hành xử của họ, bậc minh mẫn" / "xin nói cho con khi được hỏi") còn `ne5:37.4` dồn "nói cho con" lên dòng trước (xem phần Pāli trùng); (f) `vīmaṁsā` "sự thẩm xét" (`ne4:28.2`), `pāmojja` "hân hoan", `byāpāda` "sân hận", `dosa` "sân", `āghātavatthu` "căn cứ hiềm hận" (`ne6:8.3`).
  - Pāli trùng nguyên văn:
    Dò Pāli của 537 khoá với toàn bộ Pāli đã ghim, so sau khi bỏ dấu câu, nháy, chữ hoa và thẻ: 53 khoá có Pāli trùng (độ dài chuẩn hoá hơn 12 ký tự) ở bài khác mà phía kia có bản Việt; trong đó 15 khoá Việt giống nguyên văn (`7.1`, `7.3`, `10.1`, `10.2`, `10.4`, `12.1`, `17.2`–`17.4`, `18.3`, `21.2`, `26.2`, `41.2`, `65.4`, `65.8`), 38 khoá Việt khác, thuộc bốn nhóm đều có chủ ý: (1) 13 khoá tiêu đề "Tattha katamo X hāro?" (`2.1`, `20.1`, `29.1`, `33.1`, `39.1`, `40.1`, `46.1`, `47.1`, `52.1`, `58.1`, `61.1`, `64.1`, `74.1`): "Trong đó, hướng dẫn X là gì?" thay cho "Ở đây, nhóm X hướng dẫn là gì?" của `ne5`–`ne19` — xem phần Tiền lệ; (2) 20 khoá trích kệ khác ở chữ hoa đầu dòng theo Pāli từng khoá, ở dấu nháy mở hoặc đóng mà Pāli có (`3.4`, `7.2`, `17.1`, `18.2`, `18.4`, `21.1`, `21.4`, `26.1`, `26.3`, `26.4`, `30.1`, `30.4`, `34.4`, `41.1`, `41.3`, `41.4`, `48.4`, `59.1`–`59.3`), hoặc ở chữ "ấy" ở `ne3`; (3) `12.2`–`12.4`: các bài song song (`sn12.31`, `snp5.2`, `ne5:37`) dồn "nói cho con" lên dòng trước, còn bài này dịch từng dòng theo Pāli; (4) `52.3`, `68.4` là câu hỏi ngắn, ngữ cảnh khác ("Vào sáu pháp nào?", "Bốn lý do nào?"). Trong chính bài: 5 nhóm Pāli trùng (`5.11`/`58.4`, `24.3`/`55.6`, `27.5`/`57.16`, `36.4`/`38.1`, `65.2`/`65.5`), 5 cặp, 0 cặp bản Việt khác.
  - Số Pāli:
    `soḷasa` = 16; `aṭṭhārasa padāni` = 18, trong đó `satta padāni` = 7 (khổ thuộc thân, khổ thuộc tâm, gặp gỡ điều không ưa, xa lìa điều yêu thích = 4, cộng ba điều hữu vi = 3); `navapadesu` 9, `sattasu` 7, `soḷasasu` 16, `ekādasa` 11 (`1.9`); `pannarasapadāni` 15, `dasasu` 10, `paññāsa` 50, `aṭṭhārasavidhesu` 18, `dasavidhesu` 10, `ekavīsatividhāya` 21 = eka 1 + vīsati 20 (`1.10`); `aṭṭha` 8 (`16.1`, `16.2`), `chahi` 6 (`16.3`), `sattahi` 7 (`19.2`), `nava` 9 (`19.3`); `ekādasahi aṅgehi` 11 (`35.2`: chín khéo về nghĩa, pháp, định nghĩa, ba giống, ba thời, cộng hai khoá `35.3` = 11); `ekasaṭṭhi` 61 = eka 1 + saṭṭhi 60 (`14.12`, `27.7`); `asīti` 80 (`36.5`, `39.2`, bài nghi ngờ hỏng); `bāvīsati indriyāni` 22 = bā 2 + vīsati 20 (`57.1`); `dvādasa indriyāni` 12 (`57.2`); `satta indriyāni` 7 = năm cảm thọ căn cộng nữ căn, nam căn (`57.13`); `aṭṭha indriyāni` 8 = năm căn tín–tuệ cộng ba căn vô lậu (`57.14`); `dasannaṁ` 10 (`57.15`, hỏng); `aṭṭhārasa dhātuyo` 18, `rūpī dasa dhātuyo` 10 = năm căn và năm cảnh sắc, `cha viññāṇakāyā manodhātusattamā` 6 nhóm thức với ý giới là thứ bảy, `dvādasannaṁ āyatanānaṁ` 12 (`53.1`–`53.6`); `tividho`/`catubbidho`/`duvidho paṭiccasamuppādo` 3/4/2 (`54.1`); `cattāro upādānā` 4, `nava vaṇamukhāni` 9, `tīṇi tikāni` 3 bộ ba (`15.4`–`15.7`); `dasa tathāgatabalāni` 10, `cattāri vesārajjāni` 4 (`69.1`); `aṭṭha micchattāni` 8 (`69.4`); `satta anusayā` 7 (`72.5`); `tatiyaṁ balaṁ` "sức mạnh thứ ba" (`73.2`); `pañcamā bhūmi` thứ năm (`78.1`). Cạm bẫy số đã tránh: không có thang lớn; "mười lăm", "hai mươi mốt", "sáu mươi mốt" viết đúng mốt/lăm.
  - Phần bất định (không thêm vào thân kinh):
    + Hầu hết các chỗ hỏng nằm ở phần giữa và phần trích dẫn (`14.3`, `15.15`, `36.2`, `37.1`–`37.4`, `39.2`–`39.5`, `57.x`, `61.x`, `62.1`, `63.2`, `68.3`, `68.7`, `69.1`, `73.x`, `74.x`, `75.x`, `76.1`): bản Việt dịch sát từng mảnh, hầu hết dịch đúng chữ mà không bảo đảm nghĩa mạch lạc.
    + `1.10` `pātubhāvacutilakkhaṇo cuto`: đọc "đã mất" là `cuto`; `sāsanappaṭṭhāna` "nền tảng giáo pháp", `suttavidheyya` "điều cần làm theo kinh" chưa có tiền lệ.
    + `5.8` `neti`: dịch "hay không" (đọc là "na iti"); `5.13` `sotaṁ nāma` dịch "dòng chảy, gọi là"; `8.2` `bahulādhivacanena` "bằng tên gọi số nhiều" (suy từ `sotāni`).
    + `13.10`, `13.13`: dịch sát chữ. `15.3` `bhagavā anumīyati` dịch "Đức Thế Tôn được suy ra". `15.7` `seyyenamhi paraso` đọc là mạn "ta hơn" đối với người khác (suy từ chín loại mạn), không chắc.
    + `23.2`: đọc `veyyākaraṇiyā` "không cần giải thích", `abyākaraṇaṁ kattabbaṁ` "cần làm điều không giải thích"; `23.4` `upādāpaccayatā` dịch "tính làm duyên nương tựa".
    + `27.2` `rūpesu āyatanesu` dịch "năm sắc xứ" (sắc nghĩa rộng là cảnh); `27.21` `vokāro` "sự sai biệt"; `27.24`–`27.25` `kāyikadoso`, `kāyikakāsāvo`: dịch "lỗi thuộc thân", "cặn bẩn thuộc thân"; có thể là `kasāva`.
