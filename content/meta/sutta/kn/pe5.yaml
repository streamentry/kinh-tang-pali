  Lượt ba §6.2–§6.3 (2026-10-18; Claude Opus 5.5): đối chiếu Indacanda TTPV 44 toàn bài: 78 đoạn (537 khoá) đọc cạnh bản dịch Việt của Bhikkhu Indacanda, TTPV 44 tr. 106–145 (Pāli BJT tr. chẵn, bản dịch tr. lẻ); mỗi chỗ khác nghĩa phân xử bằng Pāli ghim (DPD, ngữ pháp, câu song song), BJT chỉ dùng để dẫn cách ngắt câu/tách từ, không thay chữ ghim. Sửa 27 khoá. (a) Việc B, 15 lỗi thật ngoài locus (17 khoá): cách/chủ thể 5 (1.4 «ayaṁ gāthā» mở bài kệ chứ không phải chủ ngữ «bài kệ này là thiện…»; 8.2 [Ngài] được hỏi; 51.6 đại từ quan hệ chỉ lĩnh vực; 53.7 sắc uẩn đi với mười xứ, chỉ ý xứ mới chỉ ra bằng thức uẩn, theo khuôn 53.2–53.3; 57.3 «diṭṭhiyā» thuộc cách: nam căn là nền tảng của kiến và ái); nghĩa từ/tách từ 4 (28.1–28.2 «pada» là bàn chân trong ví dụ người bước đi, an9.35:1.4, giữ chữ ghim alabhanto; 44.1 «sati upaṭṭhānā» = niệm xứ; 64.2 «sa parikkhāro hāro» theo BJT; 73.11 vô minh là hạt giống của thức, 72.9); phủ định 1 (52.5–52.6 phủ định kép «không có … mà không thấy»); thể 1 (35.7 «không cần» → «không nên»); thêm ý 1 (5.4 «đi theo nhau» → «đi theo [nghĩa]»); câu song song 1 (73.1 theo ne18:3.3 «vô minh là nhân của vô minh», trái 67.2 trước đó); tối nghĩa 2 (57.6 «evaṁ itthī» người nữ cũng như vậy; 75.6 kiến là vô minh, ái là các hành, theo 75.7). (b) Trong locus, sửa cho sát chữ ghim hơn 6 khoá: 49.5 chữ bổ «[tên]»; 49.10 «nirutti» là ngôn ngữ (DPD nirutti 1), «Sabbaññū» là chủ ngữ; 69.4 chủ ngữ «tīṇi akusalāni»; 73.4 «na» phủ định «soseyya» (bản cũ đảo ý ví dụ); 74.2 «ugghaṭita» thu gọn (DPD); 74.4 ba cặp «X là Y». (c) Việc A, 46 locus trong blocker: gỡ mới 2 theo chữ ghim (§5.5, ngữ pháp): 43.15 (akusalā dhammā là chủ ngữ của pariyesitabbā ở 43.16, cùng khuôn 43.19; BJT p124 trùng chữ, chấm liền; Indacanda tr. 125; đổi ngắt câu 43.15–43.17) và 73.8 (taṇhāya là công cụ cách chỉ nguyên nhân: do ái mà không đi đến sự đoạn trừ ái; Indacanda tr. 141); phán «bất định có chú thích» theo §6.2 44 locus: 5.13, 14.3, 15.3, 15.7, 15.15, 19.3, 24.11, 36.2, 37.1–37.4, 39.2, 39.4, 39.5, 39.12, 42.8, 42.10, 45.3, 49.5, 49.10, 51.2, 52.9, 57.2, 57.4, 57.7, 57.15, 63.2, 65.3, 66.13, 68.3, 68.7, 69.1, 69.2, 69.4, 69.5, 72.2, 72.3, 72.5, 73.2, 73.4, 74.2–74.5, 75.2, 75.8, 76.1, 77.8, 77.10 — mỗi locus có chú thích người đọc tại khoá (chữ ghim; cách đọc BJT với trang tipitaka.lk và TTPV; vì sao không gỡ được; các cách hiểu khả dĩ kèm trích ngắn Indacanda, Ñāṇamoli chỉ dẫn tên cách đọc). 51.2: BJT tự dẫn so Dhp 342, Ñāṇamoli đọc là dhp342 «tasiṇāya purakkhatā pajā parisappanti», nhưng khác ba chữ nên không dịch theo (đoán lại chữ). 73.2: Ñāṇamoli/Indacanda hiệu đính «santati phalaṁ nibbatti» theo ne18:5.2, không theo. Giữ có ghi: 10.5, 13.12–13.13, 17.1 trùng bản published (snp5.2, ne5, an8.16); 1.9, 27.x, 31.3, 32.3–32.5 Indacanda theo chữ BJT/hiệu đính khác chữ ghim. Sau lượt này không còn locus «chưa phân xử» (2 gỡ, 44 phán §6.2); status, quality, blocking_errors không đổi (để điều phối viên xử theo §6.2 và chấm lại toàn bài theo §5.5/§6.3). Bảng: dec/pe3_pe5.tsv. Chưa chạy validate/test/check.
