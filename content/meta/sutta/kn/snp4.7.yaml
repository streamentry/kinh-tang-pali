notes: |-
  Lượt rà soát 2026-10-15 (lô G1, Claude Sonnet 5.5 (Claude Code)): `9.3`–`9.4` `na tena seṭṭho
  maññetha, sa ve nibbānasantike` — Pāli không có đại từ quan hệ; `maññetha` là thức cầu khiến và
  mnd7:69.3, 72.1 đã dịch "Không nên vì đó mà nghĩ mình là tối thắng"; `sa ve nibbānasantike` cùng cấu
  trúc dhp372:4 "vị ấy thật gần Niết-bàn". Bản cũ (theo Sujato) đọc thành mệnh đề điều kiện "Người
  không vì đó… thì đã đến gần Niết-bàn"; nay đọc theo Niddesa và Pāli ngắt hai vế. Cả hai cách đọc đều
  có thể bảo vệ về ngữ pháp; chọn cách đồng nhất với mnd7.
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 6.2 (`codito` DPD «accused; rebuked; blamed», chú giải Sn coi lời người khác là nindāvacana → «khiển trách» thay «chất vấn», như mnd7:45.2), 6.3 (`mahāgedho` DPD «great thicket; enormous tangle», chú giải Sn mahābandhana, Niddesa giải bằng rừng lớn, bụi rậm lớn → «mớ rối lớn» thay «cái bẫy lớn», như mnd7:45.3), 7.4 (`parikissati` DPD «is afflicted; is harassed», chú giải Sn parikilissati, Niddesa kissati parikissati parikilissati; Pāli không có chữ «dục vọng» → «chịu vất vả khổ sở», như mnd7:52.4); giữ 7.3 (Pāli `athāpi`, «Nhưng rồi lại dấn vào» đã cùng nghĩa với mnd7:52.3).
