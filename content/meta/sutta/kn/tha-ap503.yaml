notes: |-
  Bản dịch chỉ từ Pāli root; tầng Anh đã ghim không phủ tha-ap (giới hạn upstream). Đủ 161/161 khoá, thứ tự khoá đúng thứ tự Pāli, không khoá nào ngoài tập Pāli. Status bắt buộc draft vì blocker tầng tham khảo Anh.

  TÊN BÀI `:0.3`: Pāli bắt đầu bằng số (1 Tikaṇikārapupphiyattheraapadāna) nên giữ số thứ tự theo hình thức `N. `; translationTitle bằng đúng giá trị `:0.3`. Mẫu câu đo ở hai phạm vi cho hai đa số khác nhau: ở phạm vi gần (tha-ap480 đến tha-ap520) Bài Kệ Tuyên Ngợ 23, Ký Sự 16, Bài Kệ Tuyên Ngôn 1; ở phạm vi cùng phẩm (tha-ap503 đến tha-ap512) Ký Sự 6, Bài Kệ Tuyên Ngợ 3; toàn tầng Bài Kệ Tuyên Ngợ 255, Bài Kệ Tuyên Ngôn 138, Ký Sự 136. Chọn Ký Sự Về Trưởng Lão theo đa số cùng phẩm và theo bài liền kề tha-ap504; không dùng Tuyên Ngợ vì đó là dạng viết sai chính tả của Tuyên Ngôn, và phân kỳ Tuyên Ngợ/Tuyên Ngôn/Ký Sự trong cả cuốn cần người biên tập phán một lượt. Tên thầy giữ nguyên Pāli (Tikaṇikārapupphiya) như các bài pupphiya gần đó. `:0.1` Therāpadāna giữ Pāli (525 trên 536). `:0.2` Phẩm Hoa Kaṇikāra 9 trên 9. `:40.1` kết bằng thứ nhất, theo Pāli paṭhamaṁ, cùng dạng với tha-ap83 và tha-ap504.

  TIỀN LỆ: 115 trên 161 khoá có Pāli trùng nguyên văn (bỏ dấu câu và khoảng trắng) với các bài tha-ap khác, tổng 6068 lần xuất hiện đã dò; 100 khoá Việt giống một dạng đã có, trong đó 92 khoá giống dạng phổ biến nhất; 15 khoá khác chủ ý (đại từ ta thống nhất cả bài, và hai khoá ghi ở mục bất định). Trong chính bài có 102 cặp Pāli trùng (chủ yếu buddhapūjāyidaṁ phalaṁ và Labhāmi sabbamevetaṁ), cả 102 cặp có Việt giống nhau. Công thức lời kết: 39.1 dùng nhóm những bài kệ này (407 khoá), không dùng nhóm số ít. Các khối dùng lại: Kilesā jhāpitā mayhaṁ 176, Svāgataṁ vata me āsi 169, Paṭisambhidā catasso 535, kataṁ buddhassa sāsanaṁ 708.

  Duggatiṁ nābhijānāmi: phạm vi gần Ta không còn biết đến đọa xứ 15, Ta không biết mình rơi vào khổ đau 10; toàn tầng khổ đau 138, đọa xứ nào (tôi) 99, đọa xứ (ta) 69. Chọn đọa xứ vì sát duggati hơn và là đa số ở phạm vi gần.

  SỐ PĀLI (tự tính): bāttiṁsa = 32 (ba mươi hai tướng); saṭṭhiyojana ubbedha = 60 do-tuần cao, tiṁsayojana vitthata = 30 do-tuần rộng (tiṁsa = 30); sahassakaṇḍaṁ satabheṇḍu = nghìn tấm vách, trăm ngọn tháp; satasahassa niyyūha = 100 x 1000 = một trăm ngàn ban công; yojanasataṁ = 100 do-tuần; saṭṭhi turiyasahassāni = 60 x 1000 = sáu mươi ngàn nhạc cụ; satānaṁ pañcakkhattuṁ = năm trăm lần, satānaṁ tīṇikkhattuṁ = ba trăm lần; sattavassa = bảy tuổi; Tiṁsakappasahassamhi = tiṁsa 30 x sahassa 1000 = ba mươi ngàn kiếp (theo chỉ dẫn của người biên tập: tiṁsa là 30, không phải 3); đây là việc đã qua (yaṁ buddhamabhipūjayiṁ) nên dịch Vào ba mươi ngàn kiếp trước đây (13 trên toàn tầng, 3 ở phạm vi gần), không dùng dạng sau … kiếp nữa dành cho lời thọ ký tương lai. catasso = bốn, aṭṭhime = tám, chaḷabhiññā = sáu, tisso vijjā = ba.

  BẤT ĐỊNH đã ghi, không giấu:
  1. `1.4` himavantamupāgamiṁ có dạng ngôi thứ nhất, trong khi ngữ cảnh (1.1 đến 1.3, 2.1 đến 2.4) là Đức Phật đi vào Himavanta; bài song hành tha-ap558 viết upāgami ngôi thứ ba. Dịch không nêu chủ ngữ (đã đến núi Himavanta) để không chọn thay Pāli; có thể là dạng thêm niggahīta của ngôi thứ ba, chưa phân xử được.
  2. `12.2` đến `12.4`: tūlikā (nệm bông), vikati (dịch tấm phủ thêu hình, theo truyền thống chú giải về vikatikā), uddhalomi (lông dựng), ekanta (lông một phía), bibbohana (gối). Các thuật ngữ đồ nằm này không có tiền lệ cùng nghĩa trong tầng Việt nên chọn nghĩa từ, cần người biên tập tra lại.
  3. `11.4` yenicchakā yadicchakā dịch tùy theo điều mong muốn, tùy theo ý thích; `11.3` pallaṅka dịch ghế dài.
  4. `29.3` vevaṇṇiya dịch sự biến sắc; không có tiền lệ trong tầng Việt.
  5. `5.1` đến `5.2` vanaggā nikkhamitvāna buddharaṁsībhidhāvare: hiểu các tia sáng của Đức Phật là chủ thể của nikkhamitvāna và abhidhāvare.
  6. `15.1` đến `15.4` turiya dịch nhạc cụ theo tiền lệ tha-ap431 và tha-ap553, dù chủ ngữ của upaṭṭhahuṁ và parivārenti ở đây là ngôi thứ ba số nhiều không nêu danh từ; không thêm họ hay chúng vào bản Việt.
  7. `16.4` kāmakāmī dịch là người được toại các mong muốn.
  8. `18.5` padesarajja dịch vương quyền cai quản các vùng đất, theo dạng phổ biến hơn (16 trên 15).

  DẤU CÂU: Pāli mở ngoặc kép ở `1.1` và đóng ở `38.4`; khớp từng khoá, không khoá nào có nháy đơn hay ngoặc đơn. Không có dấu lược trong Pāli (không …pe…, không …). Pronoun dùng ta xuyên suốt, giữ tôi chỉ ở công thức lời kết `39.1`.

