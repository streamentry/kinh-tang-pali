notes: |-
  **Phạm vi: đủ 121/121 khoá của bài, không khoá nào ngoài danh sách.** Thứ tự khoá trong tệp
  bản dịch bằng đúng thứ tự Pāli (kiểm bằng phép so danh sách, không dùng phép cân tổng).

  **Nguồn và coverage — đo theo công thức khai ở `source/layers.yaml`
  (`substantivePaliMinChars: 40`, bỏ khối `:0`), tầng Anh tra qua manifest đã ghim:**
  · Độ dài Pāli lớn nhất của khoá thân bài là **29 ký tự**, toàn kệ ngắn ⇒ **mẫu số cổng = 0/118**.
    ⚠ Cổng coverage **không đo được gì** ở bài này; con số hiển thị không phải bằng chứng
    Sujato dịch đủ.
  · Đo thô thay thế, trên 118 khoá thân bài (`1.1`–`31.1`, bỏ ba khoá tiêu đề `0.1`–`0.3`): bản Anh
    Sujato đã ghim **có tệp** `thig13.5_translation-en-sujato.json` (manifest liệt kê tệp này), **116/118 khoá có chữ = 98,3%**;
    hai khoá để trống là `30.1` (colophon `… Subhā kammāradhītā therī ….`) và `31.1` (`Vīsatinipāto niṭṭhito.`).
    Bỏ riêng hai colophon thì 116/116 = 100%. Ba khoá `0.x` cũng có chữ. Cả hai số đều ≥ 0,80,
    không cần entry `reference-gaps`.
  · Tầng `english-project` **vắng** (không có tệp cho uid này, và không cần lấp vì không có khoá
    kệ nào Sujato bỏ trống ngoài hai colophon). Tầng `vietnamese-current` **vắng** (tại commit đã ghim
    thư mục Việt hiện hành chỉ có Pháp Cú). Bản Việt nguyên bài của SuttaCentral (Bhikkhu
    Indacanda, nhóm Hai Mươi, 13.5) chỉ là mục *Tra cứu toàn văn* ở cuối trang, không phải tầng
    store, nhưng đã đọc để đối chiếu cách đọc cú pháp. ⇒ `triangulation` **8,9**: Pāli + một tầng
    Anh đủ, không có tầng Việt phân đoạn, không có bản Anh độc lập thứ hai. Chỗ Sujato và bản Việt nguyên
    bài cùng khác Pāli ghim hoặc khác nhau đều được ghi ở mục bất định.

  **Tái dùng nguyên văn — dựng chỉ mục Pāli→Việt ở mức segment trên toàn tầng đã dịch (gồm `thig13.1`–`thig13.4`):**
  **13 khoá** của bài có Pāli trùng nguyên văn (chuẩn hoá chữ hoa, dấu câu, nháy) với khoá ở bài khác đã dịch
  (**13 khoá có cặp trùng ngoài bài đã dò**). **10 khoá giữ nguyên văn bản Việt cũ** (đã bỏ qua dấu câu và chữ hoa):
  `0.2` (*Bộ Hai Mươi Bài Kinh* — 10 nơi), `4.4` (*trong chánh pháp khéo tuyên thuyết* — `iti83:14.4`; viết hoa *Chánh pháp*
  theo quy ước tầng, xem Thuật ngữ), `13.1` và `13.2` (`thig13.4:18.3`, `thig13.4:18.4`), `14.2` (`thig3.3:3.2`), `23.4` (`thig3.3:2.4`),
  `25.1` (*không sầu, không bụi, an ổn* — 4 nơi), `27.4` (`thig4.1:3.2`), `28.2` (`thig7.2:1.2`, 3 nơi; chọn *tỳ-kheo-ni* theo dạng đa số của tầng),
  `28.4` (*đã làm xong việc cần làm, không còn lậu hoặc* — 7 nơi). **3 cặp bản Việt khác**, mỗi cặp có lý do: `1.3`
  (*với tôi, người không phóng dật ấy* — `thig5.4:4.1` là *Nhờ không buông lung như thế*, trong đó *như thế* trỏ về
  đoạn quán thân đứng ngay trước; ở đây không có đoạn đó, và *không phóng dật* là dạng đa số của tầng cho `appamatta`:
  **32** so với *không buông lung* **5**), `18.4` (*của sinh và của chết* — `thig13.4:4.2` là *khỏi sinh và tử* vì đi với `nissaraṇa`, ở đây đi
  với `pariyanta`), `28.3` (*đã thoát khỏi mọi trói buộc* — `snp3.9:53.3`, `dhp417:3` dùng *trói buộc* cho `visaṁyutta`; `thig5.5:5.3` có
  *Hoàn toàn thoát khỏi mọi trói buộc*, `thig1.4:1.3` có *đã lìa hết mọi ách*; chọn *trói buộc*: **3** so với *ách* **1**).

  **Năm phép kiểm (tự viết, in số kèm mẫu số):**
  · (1) `set(khoá Việt) == set(khoá Pāli)`: **121 / 121**, thiếu **0**, thừa **0**; thứ tự khoá khớp
    Pāli. Phép **có đo được**.
  · (2) Nháy kép và nháy đơn **khớp Pāli từng khoá**: lệch **0**. Pāli mở `“` ở **2 khoá** (`1.1`, `26.1`) và đóng `”` ở
    **2 khoá** (`25.4`, `28.4`); Việt cùng 2 + 2 khoá, cùng vị trí. Nháy đơn: Pāli **0** khoá, Việt **0**. Lời kể của Subhā
    mở ở `1.1` và đóng ở `25.4`; lời của Sakka mở ở `26.1` và đóng ở `28.4`; `29.1`–`29.4` là lời dẫn truyện, không có nháy trong Pāli.
    Dấu cuối khoá: Pāli kết `”.` ở `25.4`, `28.4`, Việt kết `.”`; các khoá còn lại đổi dấu `;`/`,`/`.` hoặc dùng `?`, `:` ở `10.2`, `12.2`, `5.2` theo cú pháp
    tiếng Việt, và đổi `.` thành `,` ở `3.4` vì câu còn tiếp.
  · (3) Pāli trùng nguyên văn trong bài: **4 nhóm** (8 khoá: `10.1`≡`12.1`, `10.2`≡`12.2`, `10.3`≡`12.3`, `11.3`≡`15.3`), bản Việt khác về nội dung **0 nhóm** (cả 4 nhóm Việt giống hệt).
    Phép **có đo được**. Khoá `10.4` và `12.4` có Pāli khác nhau nên Việt khác nhau.
  · (4) Dấu lược: Pāli có `…` ở **1 khoá** (`30.1`, **2** dấu); Việt cũng **2**, lệch **0**. Mở
    rộng lược (Pāli không có `…` mà Việt có): **0**. `… cho đến …`: **0**. `(…)` trần: Pāli **0**
    khoá, Việt **0** (ở bài này không có khoá nào mang `(…)`, nên điều khoản giữ nguyên `(…)` không
    áp dụng). Pāli kết `….` ở `30.1` ⇒ Việt kết ` ….`.
  · (5) Số Pāli, thêm NFC, khoá rỗng, khoảng trắng: chưa NFC **0**; khoá rỗng **0**; khoảng trắng
    thừa hoặc hai dấu cách **0**; Pāli lọt sang Việt chỉ là tên riêng (`Subhā`, `Uppalavaṇṇā`, `Sakka`, `Therīgāthā`), giữ nguyên có chủ đích. `0.1`
    (*Therīgāthā 13.5*) trùng nguyên văn Pāli có chủ đích, như các khoá `:0.1` khác trong tầng.
  · **Số Pāli** — tự tính, không dùng công cụ đo số chuẩn của kho vì không có cụm nào trong bài thuộc bộ cụm đã xác lập:
    `Vīsati` = 20 ⇒ *Hai Mươi* (`0.2`, `31.1`, theo `thig13.1:0.2`); `ajjaṭṭhamī` = ajja + aṭṭhamī, aṭṭha 8 ⇒ *ngày thứ tám* (`27.1`);
    `ariyaṭṭhaṅgika` = aṭṭha 8 + aṅga ⇒ *tám chi phần* (`25.2`); `tevijjā` = ti 3 + vijjā ⇒ *có ba minh* (`27.4`); `bahū`, `bahuṁ` (`18.2`, `19.3`)
    không phải số xác định nên giữ *nhiều*, *rất nhiều*; `kammakarāni`, `dāsa` không mang số.
  · Đọc cặp Pāli↔Việt từng khoá (121/121 in ra đọc đối kháng): không có khối nào mang nội dung của khối
    bên cạnh. Lượt lời: `1`–`25` Subhā nói với thân quyến và tự nhắc mình (`10`–`12` nói với thân quyến; còn lại độc thoại); `26`–`28` Sakka (lời của chư thiên, mở ở `26.1`
    và đóng ở `28.4`) nói về Subhā; `29` lời dẫn truyện; `30`–`31` colophon. Cách gán người nói ở `26`–`28` là cách đọc theo văn cảnh và theo Sujato; Pāli không ghi
    tên người nói ở đầu lời. `29.4` Pāli kết `-nti` (= `ti`, dấu kết lời), không có nháy, nên không đưa vào Việt.

