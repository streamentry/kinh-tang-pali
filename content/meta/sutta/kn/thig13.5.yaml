    Chọn *hữu thân* vì `sakkāya` là thân hiện hữu, không phải tà kiến về thân; `thân kiến` dịch `sakkāyadiṭṭhi`. Sujato *substantial reality*, bản Việt nguyên bài *bản ngã*.
