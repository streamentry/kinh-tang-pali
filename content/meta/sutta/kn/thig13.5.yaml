  · `māra` ⇒ *Ma vương* (`21.4`): *Ma vương* **189** so với *Ma Vương* **11** trên cả tầng; chọn *Ma vương*, như `thig4.1:3.4`.
  · `puthujjana` ⇒ *phàm phu* (**14**/14). `kammāradhītā` ⇒ *con gái người thợ rèn* (*thợ rèn* **14** khoá trên tầng).
