  · `rukkhamūla` ⇒ *gốc cây* (**51**); `jhāyati` ⇒ *thiền* (**78**); `nibbāna` ⇒ *Niết-bàn* (`23.4`, theo `thig3.3:2.4`); `saṅghāṭi` ⇒ *y tăng-già-lê* (**24** khoá).
  · Xưng hô: Subhā tự xưng *tôi*, gọi thân quyến là *các người* và *hỡi thân quyến*; Sakka và chư thiên gọi Subhā bằng ngôi thứ ba (*vị này*, *vị ấy*).

  **BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh:**
  · `24.1` `raṇaṁ karitvā kāmānaṁ`: dịch *Sau khi gây chiến với các dục*, theo cách đọc `kāmānaṁ` là thuộc cách đối tượng (chiến đấu với các dục), vì `22.3` gọi
    chính các dục là `raṇakarā` (*gây giao tranh*) và `24.2`–`24.4` là quyết tâm sống không phóng dật. Sujato dịch *Having once made strife for the sake of sensual pleasures*
    (đọc `kāmānaṁ` là *vì các dục*); bản Việt nguyên bài dịch *Sau khi vượt qua sự khuấy rối của các dục*. Ba cách đọc đều có chỗ dựa về ngữ pháp; tầng đã dịch không
    có khoá nào chứa `raṇaṁ karitvā` (**0** tiền lệ) để phân xử. Người biên tập nên tra thêm chú giải.
  · `23.1` `etādisaṁ katvā`: dịch *sau khi gây ra như thế … tai họa do nhân các dục*, dựa vào `katvā` là phân từ của `karoti`. Sujato *created so much ruination*; bản Việt nguyên bài *đã gây nên điều bất hạnh như thế ấy*. Không có tiền lệ nguyên cụm trên tầng.
  · `3.3`–`3.4` `ramaṇīye pamodite`: dịch *đáng ưa, đáng vui* như tính từ đi với `gāmakhettāni`, theo Sujato (*so delightful and pleasant*). Bản Việt nguyên bài hiểu là *các vật đáng yêu đã được vui thích*,
    tức một nhóm đối tượng riêng. Pāli chấp nhận cả hai; tôi giữ cách đọc ít thêm đối tượng nhất.
  · `5.1`–`5.4` `netaṁ assa patirūpaṁ … yo jātarūpaṁ … punarāgame`: dịch *Điều ấy sẽ không thích hợp, vì tôi ước mong sự không sở hữu: người nào, vàng và bạc, đã vứt bỏ rồi lại quay về*.
    Cả Sujato lẫn bản Việt nguyên bài đảo `yo` thành *tôi* (*it would not be appropriate to take back gold and currency*; *Việc này là không thích đáng đối với tôi*). Pāli có `yo` (*người nào*) và `patthaye` (cùng
    dạng với `pīhaye` ở `2.4`), nên tôi giữ cấu trúc quan hệ, không đổi thành ngôi thứ nhất.
  · `13.1` `uttiṭṭhapiṇḍo uñcho`: giữ *phần ăn thừa, đồ lượm nhặt* theo `thig13.4:18.3` để hai bài cùng nhóm không lệch nhau. Sujato *Leftovers as gleanings*; bản Việt nguyên bài *Đồ ăn do đã đứng (chờ đợi)*, tức
    `uttiṭṭha` hiểu là *đứng*. Nghĩa sát (đồ nhận khi đứng ở cửa khất thực, hay đồ thừa) không phân xử bằng chứng cứ trong tầng.
  · `7.3` `sāsaṅkaṁ`: dịch *đầy lo ngại*; Sujato *dubious*, bản Việt nguyên bài *có sự nguy hiểm*. `7.2` `rajavaḍḍhanaṁ`: *tăng thêm bụi nhơ*; `raja` giữ nghĩa *bụi* như *không bụi* ở `25.1`.
  · `11.4` `sapattā sallabandhanā`: dịch *kẻ đối địch, sự trói buộc bằng mũi tên*; Sujato *hostile forces that bind you to thorns*, bản Việt nguyên bài *những sự trói buộc vào các mũi tên (luyến ái, sân hận, si mê)*. Phần trong ngoặc là chú giải, không dịch. `salla` hiểu là *mũi tên*, như `salla` ở các bài khác; Sujato hiểu `salla` là *gai*.
  · `16.1`–`16.4`: `paripantho` ⇒ *chướng ngại*, `savighāto` ⇒ *đầy bức bách*, `gedho suvisamo` ⇒ *sự tham đắm, rất gồ ghề*, `mohanāmukho` ⇒ *cửa lớn của mê muội*. Tầng đã dịch không có khoá nào chứa `paripantha`, `savighāta`, `mohanāmukha` (**0** tiền lệ). Sujato *roadblock, threat … blind spot, uneven … great gateway to confusion*; bản Việt nguyên bài *sự trở ngại … sự ham muốn là vô cùng khập khiễng … nguyên nhân lớn tạo ra sự mê muội*.
  · `21.1` `ullapanā`: dịch *dụ dỗ*; Sujato *enticing*, bản Việt nguyên bài *tâng bốc*. `21.4` `oḍḍitaṁ`: *được Ma vương giăng ra*, giữ động từ *giăng ra* như `thag4.1:2.4` (*cạm bẫy của tử thần giăng ra*); Pāli không nêu danh từ (*bẫy*), nên tôi không thêm.
  · `22.2` `mahāvisā`: *chất độc lớn*; `22.4` `sukkapakkhavisosanā`: *làm khô héo phần thiện*. `sukkapakkha` là phần trắng (các pháp thiện); tầng có `thag6.8:2.2` cho `visosana` (*làm khô cạn*) nhưng **0** tiền lệ cho `sukkapakkha`. Sujato *withering bright qualities away*.
  · `27.1` `ajjaṭṭhamī pabbajitā`: dịch *Hôm nay là ngày thứ tám kể từ khi xuất gia*, theo cách đọc của Sujato (*It's just eight days since she went forth*) và bản Việt nguyên bài; không có khoá nào khác trên tầng chứa `ajjaṭṭhamī`.
  · `27.2` `saddhammasobhanā`: dịch *làm đẹp cho Chánh pháp*, đọc thuộc cách (tatpurisa), theo `thig13.4:20.2` (*bậc làm đẹp cho Tăng đoàn*). Sujato *grace of the true teaching*; bản Việt nguyên bài *có sự chói sáng của Chánh Pháp*, tức đọc là tính từ (*tỏa sáng nhờ Chánh Pháp*). Cả hai đều chấp nhận được.
  · `26.3` `anejaṁ upasampajja`: dịch *đạt đến sự không dao động*; `aneja` là *không còn `ejā`* (dao động, tham ái). Trên các khoá có `aneja` đã dịch, *dao động/lay động* **15** so với *bất động* **9**; chọn *không dao động* (dạng đa số) và để không lẫn với `acala` ở `14.4` (*an lạc bất động*).
  · `26.1` `dhammaṭṭhaṁ`: *an trú trong Pháp*; `dhp217:2` dịch *trú pháp*, `thag16.2:15.1` *an trú trong pháp*. Sujato *standing firm in the teaching*.
  · `29.1`–`29.4`: Pāli dùng thì hiện tại (`namassati`) cho hành động của Sakka; Việt không đánh dấu thì (*đến bên … đảnh lễ*), để không thêm quá khứ mà Pāli không nói. Sujato dùng quá khứ (*did … honor*). `bhūtapati` ⇒ *chúa tể muôn loài* (`ja488:21.2` dịch *chủ của muôn loài*).
  · `15.1` `māhaṁ kāmehi saṅgacchiṁ`: dịch *Mong tôi chớ gặp gỡ các dục*; `mā` + aorist có nghĩa cấm/nguyện; Sujato *May I not encounter*. `saṅgacchati` có thể là *kết giao, hòa hợp*; tôi chọn *gặp gỡ*, nghĩa rộng nhất.
  · `19.1`–`19.4` `bahuṁ ve paṭipajjanti`: `bahuṁ` là trạng từ *nhiều*, không phải chủ ngữ; Sujato đọc *So many walk the path*. Việt: *quả thật đã đi theo rất nhiều*. Hai cách đọc cùng chỉ việc nhiều người đi theo con đường đó, nên không đổi nghĩa lớn.
  · `2.2` `bhusaṁ aratimajjhagaṁ`: dịch *đã đạt đến sự không thích thú sâu xa* (`arati` là *không thích*, mức nhẹ hơn *chán ghét*); tầng có `ps3.6:11.2` (*bất mãn*) và `cp31:2.4` (*chán*) nhưng không đủ phân xử. Sujato *profoundly dispassionate*; bản Việt nguyên bài *sự không thích thú lớn lao*.
  · `18.1` `kāmapaṅkena sattā hi`: `satta` đọc là *bị mắc kẹt* (theo Sujato *Stuck in the swamp*), không đọc là *chúng sinh*; `hi` không dịch thành *vì* để câu khỏi mang nhân quả Pāli không nói rõ. Bản Việt nguyên bài đọc `satta` là *bị gắn bó*.
  · Tên: `Subhā`, `Uppalavaṇṇā`, `Sakka` giữ nguyên Pāli; không thêm tiểu sử vào thân kinh.

