  · `appamatta` ⇒ *không phóng dật* (`1.3`, `24.3`): **32** so với *không buông lung* **5**, *tinh cần* **4**.
  · `bhāvitindriya` ⇒ *các căn đã tu tập*; `bhikkhunī` ⇒ *tỳ-kheo-ni*: **32** so với *tỳ-kheo ni* **7** (trên các khoá có `bhikkhunī`).
