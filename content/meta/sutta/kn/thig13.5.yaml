  · `amitta` ⇒ *kẻ thù*: **30** so với *oan gia* **5**.
  · `nekkhamma` ⇒ *xuất ly* (`2.4`): **16** so với *xuất gia* **14**, *từ bỏ* **4**; chọn *xuất ly* vì Pāli nói `nekkhamma` chứ không nói `pabbajjā`, còn `pabbajita` (`4.1`, `10.3`, `12.3`) ⇒ *xuất gia*.
