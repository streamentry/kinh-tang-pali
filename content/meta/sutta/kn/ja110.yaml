  hỏng, chú giải CST và Indacanda đọc `bhāsati` "nói"; theo hội đồng mục D giữ bản dịch theo chữ ghim,
  chỉ ghi chú).
  Lượt hoàn thiện 2026-10-17: thống nhất thuật ngữ `sabbasaṁhāraka` (0.4, 1.1, 2.1): 1.1 "hương pha trộn mọi thứ" → "hương hỗn hợp đủ mọi thứ", cùng chữ "hương hỗn hợp" với tiêu đề; thêm 5 chú thích (1.1 nghĩa `sabbasaṁhāraka` theo chú giải; 1.2 `kaṅgu` là hương hoa piyaṅgu, `suddhaṁ` có thể là "chỉ"; 1.3 dị bản `bhāsatiyaṁ` "nói dối" so với chữ ghim `bhāyatiyaṁ`; 1.4 `saccamāha`/`saccamāhu`; 4.1 cách tách tên trong tóm lược chưa chắc, uddāna của chú giải khác hẳn). Các câu sau trong ghi chú cũ đã bị thay: "Khung: Ekakanipāta → Bộ Một Bài Kinh" (nay "Nhóm Một Kệ" theo C3); các câu "nên giữ draft" trong mục LỖ HỔNG TẦNG THAM KHẢO (bài nay ở `review` theo waiver `no-upstream-english`, blocker vẫn ghi trong hồ sơ); "triangulation giữ 6.6" (điểm hiện hành xem `quality`); bản dịch 1.2 "hạt kê sạch bị thổi bay" và "hạt kê thuần đang lan tỏa" (nay "chỉ thuần hương kaṅgu đang tỏa ra"); câu "Mục bất định (1) … vẫn đúng" ở lượt 2026-10-14 (bất định 1.2 về thể bị động đã phân xử ở lượt 2026-10-15); tiêu đề "Kinh Câu Hỏi Về Kẻ Gom Hết Tất Cả" (nay "Hương Hỗn Hợp").
  Chấm lại độc lập sau rà DPD + kiểm độc lập 2026-10-17: đọc cả 15/15 khoá (bài ngắn) đối chiếu chú giải CST (K10-JA/110), Indacanda tập 32, trang dịch Ānandajoti và DPD: LỖI-THẬT 0, BẤT-ĐỊNH 1 trọng yếu (1.3 bhāyatiyaṁ: chữ ghim 'sợ', chú giải in bhāsatiyaṁ 'nói'; bản dịch giữ chữ ghim theo hội đồng D, câu Việt trái mạch truyện). Gộp V7 (6 khoá, 1.3 lệch do chữ ghim) và DPD (15 khoá): không còn lỗi nghĩa nào ngoài 1.3. Không có bản Anh Sujato, không có Thích Minh Châu → triangulation 8,7. Lượt hoàn thiện: 'hương hỗn hợp' thống nhất đúng; 5 chú thích có nguồn, nhưng chú thích 1.3 nói Ānandajoti hiểu là 'kẻ nói dối' trong khi Ānandajoti dịch 'scared you with a lie' (đọc chữ ghim theo nghĩa gây sợ) → ambiguity 8,6, provenance 9,2. validate (scripts) pass; quality:check fail cho bài này vì lời kinh đổi sau lượt chấm đang áp → technical 9,2. Blocker vắng bản Anh thay bằng chuỗi đúng sự thật (chuỗi cũ ghi 'giữ draft').
  Sau lượt chấm độc lập 2026-10-17: sửa chú thích cho đúng nguồn (người chấm chỉ ra chú thích tóm sai).
  Lượt thi hành đề nghị còn mở sau chấm round 2 (2026-10-17): không đổi lời kinh và chú thích. Chú thích 1.3 đã mô tả đúng Ānandajoti (đọc chữ ghim theo nghĩa gây sợ, «scared you with a lie»); đề nghị đổi lời kinh 1.3 thành «dọa bằng lời dối trá» thuộc chữ ghim *bhāyatiyaṁ* (hội đồng D), để người biên tập. Câu sau trong ghi chú cũ đã bị thay: «tầng này không có chú giải kể sự tích» (lượt 2026-10-13; nay đã đối chiếu chú giải Jātaka, Rouse, Ānandajoti, Indacanda).
