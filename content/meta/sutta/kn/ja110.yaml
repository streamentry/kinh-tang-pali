notes: |-
  Đủ 15/15 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Khung: Ekakanipāta → Bộ Một Bài Kinh; Parosatavagga → Phẩm Parosata (7 bài so với 2 bài dùng Phẩm Hơn Trăm ở ja108/ja109); Tassuddānaṁ → Tóm lược:; `Parosatavaggo ekādasamo.` → Phẩm Parosata, thứ mười một.

  Bất định lớn nhất của bài, ghi rõ thay vì làm cho nó chắc:
  · `Alikaṁ bhāyatiyaṁ dhuttī, / saccamāha mahallikā` tôi dịch kẻ gian dối, kẻ lừa đảo, kẻ lớn lao, / ta nói thật, kẻ lớn lao ấy. Cả `dhuttī` và `mahallikā` đều là loại từ chỉ người/quan trọng, nên sự lặp là cố ý trong Pāli. Nhưng `dhuttī` cũng có thể là dạng từ giống cái đó và câu có thể đọc là kẻ lớn lao ấy chính là người duy nhất đã buông xả hết — nghĩa đảo ngược với hai kệ đầu. Tôi giữ cách lấy từng vế vì nó không thêm ý gì, nhưng đây là chỗ chưa chắc.
  · `suddhaṁ kaṅgu pavāyati` — tôi dịch đi khất thực với tay sạch. `kaṅgu` là tay (cánh tay), `pavāyati` là đi ăn xin, hai chữ đó đã có tiền lệ trong tầng.
  · Uddāna `Saparosatatāyitaverī puna, / Bhamacakkatha nāgasirivhayano; / Sukhakañca vata sippaka bāhiyā, / Kuṇḍapūva mahallikakā ca dasāti.` Tôi tách được ba tên khớp rõ với phẩm (Saparosata = ja101, Verī = ja103, Bāhiyā = ja108, Kuṇḍapūva = ja109) và giữ nguyên phần còn lại như tên vì không có căn cứ để cắt. `puna` là tiểu từ nhịp điệu, tôi dịch lại nữa và dùng nhất quán ở ja140:4.2. Cùng lý do với ja10, tôi không đoán nghĩa các tên còn lại.

  LỖ HỔNG TẦNG THAM KHẢO: Không có tầng tham khảo English Sujato tại commit đã ghim: đã duyệt .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ và không có tệp cho uid này (0/15 khoá có prose), và tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên Khuddaka Nikāya cũng không có bản Hòa thượng Thích Minh Châu; bài dịch chỉ từ Pāli, chưa đối chiếu được tầng tham khảo nào nên giữ draft. Mọi khoá Pāli đều dưới 40 ký tự nên mẫu số coverage rỗng, nhưng bài vẫn giữ draft vì không có tầng tham khảo nào để đối chiếu. Bản Việt hiện hành không có cho Jātaka — giới hạn bản chụp upstream.

  Kiểm thủ công trên TOÀN BỘ 15 khoá (kiểm() rỗng vì không khoá Pāli nào từ 40 ký tự): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược bằng Pāli (cả hai phía 0), nháy kép cân (mở ở 1.1, đóng ở 1.4), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.


  Lượt cải thiện 2026-10-13 (đọc đối kháng lại cả 15 khoá; đổi 8 khoá: 0.4, 1.1, 1.2, 1.3, 1.4, 2.1, 4.2, 4.3). Các nhận định ở mục trên về `kaṅgu` là "tay", `pavāyati` là "đi ăn xin", `dhuttī`/`mahallikā` là "kẻ lớn lao" và cách tách tên ở uddāna được thay bằng nhận định dưới đây, vì đã kiểm lại trên Pāli toàn tầng:
  · 1.2 (accuracy fix): bản cũ "vẫn còn đi khất thực với tay sạch" là sai từ vựng. `kaṅgu` là hạt kê (cnd23:243.3 liệt kê cùng sāli, vīhi, yava; tầng đã dịch "kê"), không phải "tay". `pavāyati` ở toàn tầng Pāli chỉ có nghĩa thổi/lan toả (mùi hương, danh tiếng), không có nghĩa đi khất thực. Nay dịch sát: "hạt kê sạch bị thổi bay". Điểm semantic_fidelity 8.9 → 8.0 vì bản trước đã chấm cao cho một khoá sai, và bản nay chỉ sát chữ chứ chưa phân xử được ý.
  · 1.1 (accuracy fix): `sabbasaṁhārako natthi` là "không có kẻ gom hết tất cả"; `saṁhāraka` có tiền lệ ở sn15.10:2.2 / iti24:2.1 (dịch "người gom nhặt lại"). Bản cũ "đã buông xả hết" không có căn cứ trong Pāli. Tiêu đề 0.4 và 2.1 (và translationTitle) đổi theo: "Kinh Câu Hỏi Về Kẻ Gom Hết Tất Cả", cùng khuôn với ja111 "Kinh Câu Hỏi Về Con Lừa".
  · 1.3–1.4 (accuracy fix): bản cũ dịch `Alikaṁ bhāyatiyaṁ dhuttī, saccamāha mahallikā` thành ba danh từ rồi "ta nói thật": sai ở ba chỗ. `bhāyati` là động từ "sợ" (cùng gốc `bhāyasī` ở ja105:1.3 đã dịch "sợ"); `āha` là ngôi thứ ba ("đã nói"), không phải "ta nói"; `mahallikā` là bà lão (mn28:7.3 mahallikāya = lớn/lâu dài; sn3.22 `mahallikā` = già; mil2:49.2 `mahallikā khohaṁ` = "ta đã già"), không phải "kẻ lớn lao". Nay: "Người đàn bà gian xảo này sợ điều dối trá, / bà lão đã nói sự thật." Điểm grammar_logic 9.0 → 8.4, terminology 9.0 → 8.8, vietnamese_clarity 9.0 → 8.6, ambiguity_integrity giữ 8.5 vì bất định dưới đây vẫn còn.
  · 4.2–4.3 (terminology fix): bỏ chỗ bản cũ đổi hình thức tên: `nāgasirivhayano` thành "Nāgasirivhāyana" (thêm dấu dài không có trong Pāli), và tách `Sukhakañca vata` thành "Sukha, Kaṅca, Vāta" (không có căn cứ; `vāta` không phải `vata`). Cách đọc uddāna đối chiếu với từ khoá kệ đầu của từng bài trong phẩm: Parosata (ja101), tāyitā (ja102:1.4), verī (ja103), cakka (ja104), nāga (ja105), `Sukhaṁ vata` (ja106:1.1), sippaka (ja107:1.1), Bāhiya (ja108), Kuṇḍapūva (ja109), mahallikā (ja110:1.4); nay giữ nguyên dạng Pāli của từng tên và dịch `atha` thành "rồi".
  Bất định còn lại (không phân xử được vì tầng này không có chú giải kể sự tích, không có bản Anh hay Việt hiện hành): (1) `suddhaṁ kaṅgu pavāyati`: `kaṅgu` thiếu dạng đối cách rõ, `suddhaṁ` có thể là tính từ hay trạng từ, và chủ ngữ của `pavāyati` có thể là hạt kê hoặc một chủ ngữ ngầm; (2) `bhāyatiyaṁ` được tách `bhāyati` + `iyaṁ` (đại từ cái, đi với `dhuttī`), cách tách khác như `bhāyati` + `yaṁ` không loại trừ được; (3) `dhuttī` dịch "gian xảo" nhưng tầng đã dịch `dhuttā` là "ăn chơi"/"cờ bạc" (dn31:12.2, dn17:1.6.13) và `adhuttī` là "không tiêu phá" (an8.46:14.1); nghĩa thật ở đây chưa chốt; (4) câu đố "kẻ gom hết tất cả" có đáp án gì thì kệ không cho thấy. triangulation giữ 6.6, các điểm còn lại giữ nguyên.
  Không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` ở lượt này nên technical_integrity giữ 9.6.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 8 khoá chênh lệch lớn nhất (cả 8 khoá khác biệt của bài) → khác nghĩa 3: sửa 1 (4.3: "Sukhakañca Vata" → "Sukhakañca vata": `vata` là tiểu từ đi cùng `sukhaṁ vata` mở kệ ja106, không phải tên riêng nên bỏ chữ hoa; bản mù bỏ hẳn `vata`, cũng không đúng), giữ 1 (1.3: `iyaṁ dhuttī` và `mahallikā` đều giống cái nên giữ "người đàn bà gian xảo"; bản mù đọc thành "kẻ lừa đảo" trung tính; ý "sợ điều dối trá" hai bản trùng), bất định 1 (1.2 `suddhaṁ kaṅgu pavāyati`: bản dự án "hạt kê sạch bị thổi bay", bản mù "tỏa hương"; `pavāyati` ở toàn tầng Pāli là nội động từ "thổi/lan tỏa" nên thể bị động "bị thổi bay" là phần suy thêm; Pāli không đủ để chọn giữa hai cách, giữ nguyên và ghi bất định). Các chênh còn lại (0.4, 2.1 tiêu đề; 4.1, 4.2, 4.4 danh sách tóm lược, bản mù tự đánh dấu chưa chắc) chỉ là cách đặt tên và phiên âm; cách tách `nāgasirivhayano` và `mahallikakā` thành tên riêng không phân xử được nên giữ dạng Pāli, ghi bất định. Review đối kháng cả 15 khoá: đủ khoá và thứ tự, nháy kép khớp Pāli từng khoá (1 mở ở 1.1, 1 đóng ở 1.4), dấu lược Pāli 0 và Việt 0 (phép chạy rỗng), không có số Pāli. Mục bất định (1) ở phần "Lượt cải thiện" phía trên vẫn đúng; thêm bất định về `pavāyati` như vừa nêu. Không có bản Anh hay bản Việt độc lập khác. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản Anh, bản Việt nguyên bài hay đoạn song song): sửa 1 khoá — `1.2`: bỏ thể bị động *"bị thổi bay"* mà lượt trước đã ghi là suy thêm; `pavāyati` ở toàn tầng là nội động từ *lan tỏa* (tiền lệ `vv50:3.3`, `vv84:14.4` đã dịch *lan tỏa*), `suddhaṁ` đọc là tính từ đi với `kaṅgu`: nay *"hạt kê thuần đang lan tỏa."*, không thêm *mùi/hương*. Giữ 14 khoá. Bất định còn lại (không đổi): `1.3` `alikaṁ bhāyatiyaṁ`: *sợ* với đối cách `alikaṁ` khó về ngữ pháp, và phép đối với `saccamāha` (*đã nói sự thật*) gợi một động từ *nói*; bản chụp đã ghim không có biến thể hay chú giải để kiểm, nên giữ *"sợ điều dối trá"* và ghi đây là bất định trọng yếu của bài; `suddhaṁ` có thể là trạng từ (*chỉ*); tên trong uddāna `4.1`–`4.4` như ghi trước.

  Kiểm toán 2026-10-15 (kiểm toán Jātaka chỉ có Pāli), Claude Sonnet 5.5 (Claude Code): Sửa 2/4 khoá kệ và tên bài. sabbasaṁhāraka là một loại hương gom/pha trộn mọi thứ (câu chuyện chú giải: người nữ ăn cắp tràng hạt nói mình ướp bằng sabbasaṁhāraka, người nghèo nói ướp bằng hương hoa piyaṅgu; nhà bán hương phân xử), không phải "kẻ gom hết tất cả"; tên bài và 2.1 đổi "Kẻ Gom Hết Tất Cả" thành "Hương Hỗn Hợp" (cả translationTitle). suddhaṁ kaṅgu pavāyati: pavāyati là tỏa hương (bản trước đã nhận), nên "thuần hương kaṅgu đang tỏa ra"; giữ kaṅgu không dịch vì vừa là hạt kê vừa là cây thơm trong chú giải. Khoá 1.3–1.4 giữ nguyên: alikaṁ bhāyatiyaṁ dhuttī là chữ đã ghim chưa phân xử được (bhāyati là sợ; chú giải Anh dịch "hù dọa bằng lời dối"); bất định, ghi để người biên tập xem. Không có bản Anh Sujato.

  Quyết định hội đồng biên tập 2026-10-16: C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").

