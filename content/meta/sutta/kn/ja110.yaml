  định 1.3 (`bhāyatiyaṁ`): Rouse hiểu người đàn bà gian xảo là kẻ nói dối, Ānandajoti hiểu là kẻ dọa
  người bằng lời dối, trong khi chữ ghim là `bhāyati` "sợ"; cả hai nguồn đều không coi bà ta là người
  sợ điều dối trá, nên "sợ điều dối trá" có thể lệch, nhưng không có bằng chứng từ chữ ghim để đổi;
  hương `kaṅgu` (Rouse để nguyên) và 1.1–1.2, 1.4 khớp cả hai nguồn.

