  NGUỒN-LỆCH 1. NGUỒN-LỆCH: `1.3` — chữ ghim (Ma) `alikaṁ bhāyatiyaṁ dhuttī`; Indacanda in `alikaṁ
  bhāsatayaṁ` ("cô gái vô lại này nói lời sai trái") và chú thích dị bản: Ma `bhāyatiyaṁ`, Syā
  `bhāsatiyaṁ`, PTS `bhāsati ’yaṁ`. Tức là điểm bất định đã ghi ở trên ("sợ điều dối trá" so với
  "nói dối") là chênh dị bản giữa các ấn bản, Rouse, Ānandajoti và Indacanda đều không hiểu bà ta
