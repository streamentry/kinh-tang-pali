notes: |-
  `Anusaṁsāvakattheraapadāna`,
  thứ 10 của `Citakapūjakavagga`. 43/43 khoá. Ba tầng tham khảo đều vắng (xem `blocking_errors`) ⇒
  `draft`, `triangulation` 7.5.

  **Tên phẩm:** `:0.1` giữ Pāli **“Therāpadāna”** (316/325, đo trước khi ghi lát này); `:0.3` theo đa số
  đo lại **167/325** = *“Bài Kệ Tuyên Ngợ Về Trưởng Lão …”*. `:0.2` `Citakapūjakavagga` → *“Phẩm Citakapūjaka”*:
  trong **đúng phẩm Citakapūjaka** tiền lệ **hòa 4–4** (`tha-ap294`/`295`/`297` dùng *Phẩm
  Citakapūjaka*; `tha-ap293`/`296`/`298` dùng *Phẩm Bậc Cúng Giàn Hỏa*), nên tôi chọn giữ Pāli cho
  khớp với `:0.3` — **ghi rõ là hòa giải, không phải đa số**.

  **Tiền lệ dùng lại nguyên văn:** `Pasannacitto sumano,` → *“Với tâm tịnh tín hân hoan,”*
  (**32/52**); `uttamatthassa pattiyā.` → *“với mong ước đạt đến mục đích tối thượng.”* (2/4);
  `Ekanavutito kappe,` → *“Từ chín mươi **mốt** kiếp trước,”* (**đã sửa 2026-10-05**: bản ghi trước
  ghi *chín*, tức 99 — sai); `Duggatiṁ nābhijānāmi,` →
  *“Tôi không còn biết đến đọa xứ nào,”*; `Paṭisambhidā catasso,`; `…pe…`; `kataṁ buddhassa
  sāsanaṁ”.`; `dvipadindassa tādino.` → *“đối với bậc hai chân đáng tôn kính ấy.”* (3/10);
  `gaṇitāyo vibhāvibhi.` → *“đã được các bậc sáng suốt tính đếm.”* (**5/5**); `gaṇitā atthadassibhi.`
  → *“đã được các bậc thông tuệ tính đếm.”* (2/3).

  **`Itthaṁ sudaṁ …` (5.1) giữ dạng Pāli:** Pāli là `anusaṁsāvako` nên tôi viết *“Tôn giả Trưởng
  lão Anusaṁsāvako”*; `:6.1` tiêu đề `…therassāpadānaṁ` cũng dùng *Anusaṁsāvako* để khớp Pāli khoá
  đó, còn `:0.3` giữ *Anusaṁsāvaka* như trong tiêu đề Pāli.

  **Bất định thật ở kệ 1.1–1.4, đã chọn và ghi.** Pāli: `Piṇḍāya caramānāhaṁ, vipassimaddasaṁ
  jinaṁ; Uḷuṅgabhikkhaṁ pādāsiṁ, dvipadindassa tādino.` `Uḷuṅgabhikkhaṁ` có thể (A) “vị tỳ-kheo
  đứng chống trên gót chân” với `pādāsiṁ` = *ta đã xin thực*, hoặc (B) “từ vị tỳ-kheo ấy”. Tôi theo
  (A): *“Ta đi xin thực khắp nơi, / gặp bậc Chiến Thắng đã thấy rõ quá khứ; / ta xin thực khi chống
  trên gót chân, / trước bậc hai chân đáng tôn kính ấy.”* — không có bản Anh đã ghim để phân xử, nên
  ghi rõ là **bất định đã chọn**, không phải kết luận chắc chắn. `vipassimaddasaṁ` → *đã thấy rõ quá
  khứ*.

  **`abhivādesahaṁ tadā;` / `Anusaṁsāvayiṁ buddhaṁ,` (2.2–2.3): 0 tiền lệ** → *“ta cùng dâng lễ
  lúc ấy;”* / *“ta tán thưởng Đức Phật,”*. `anusaṁsāvanā phalaṁ.` → *“đó là quả báo của sự tán
  thưởng ấy.”*

  **Uddāna 8 và vagguddāna 10–11 dịch đúng những gì Pāli liệt kê.** Tên thường bỏ tiếu tố chủ
  ngữ như `tha-ap182:9.x`: `pārichatto` → *Pārichatta*, `saddagosīsasantharaṁ` → *Saddagosī,
  Santhāra*, `pādo` → *Pāda*, `saṁsāvakopi` → *Saṁsāvaka*, `ālambaṇudakāsanaṁ` → *Ālambaṇudakāsana*,
  `sīsupadhānaṁ` → *Sīsupadhāna*, `paṇṇado` → *Paṇṇada*. `paṇṇado` và `pārichatto` lần lượt là
  trưởng lão mở đầu `Paṇṇadāyakavagga` (`tha-ap283`) và câu chuyện của `tha-ap303 Padumakesariya`
  — đã tra trong Pāli đã ghim trước khi khai tên.

  **`ukkhepaṁ` / `sīsupadhānaṁ` (10.4) không khớp phẩm nào** (`ukkhepa` = *ném lên*,
  `sīsupadhāna` = *nền của giường*; phẩm tương ứng là `Padumukkhipavagga` và
  `Suvaṇṇabibbohanavagga`). Đây là đặc thù bản in, tôi **không sửa**, dịch đúng chữ.

  **`gāthāyo ceva sabbaso;` (11.2) đứng sai chỗ trong câu uddāna** (ở đây đáng lẽ phải là một tên
  trưởng lão) và cả khối `11.1–11.4` chỉ liệt kê **9** tên cho **10** phẩm. Tôi dịch theo đúng Pāli:
  *“Paṇṇada, Citapūjī, / cùng tất cả những câu kệ nữa; / bốn trăm câu kệ, / lại cộng thêm năm câu
  nữa.”* và ghi ở đây — **không** tự chế thêm tên thứ mười.

  **Các câu đếm số câu kệ dịch theo nghĩa, KHÔNG tự cộng:** `Pañcavīsasatā sabbā, /
  dvāsattati taduttati taduttari;` → *“Năm trăm hai mươi lăm câu kệ, / lại hơn hai mươi hai câu
  nữa;”*; `Tisataṁ apadānānaṁ, / gaṇitā atthadassibhi.` → *“gồm ba mươi sự ký sự, / đã được các
  bậc thông tuệ tính đếm.”*

  **`Kaṇikāravaggadasakaṁ.` / `Tatiyasatakaṁ samattaṁ.`: 0 tiền lệ** → *“Phẩm Kaṇikāra — mười
  phẩm.”* / *“Tập thứ ba trăm đã hoàn tất.”*

  **Tên riêng bị chặn oan, đã tra chứng rồi khai vào bộ nhớ tiến trình:** `Anusaṁsāvaka`
  (`tha-ap302:0.3`), `Pārichatta`, `Saddagosī`, `Santhāra`, `Pāda`, `Saṁsāvaka`,
  `Ālambaṇudakāsana`, `Sīsupadhāna`, `Paṇṇada` (`:8.x`, `:10.x`, `:11.1`). Mỗi tên đều tra được
  trong Pāli đã ghim trước khi khai.

  **SỬA LỚP LỖI SỐ PĀLI (lỗi loại 2 của quality gate — sai *số lượng*), 2026-10-05.**
  - `tha-ap302:3.1` (`Ekanavutito kappe,`) = **91**: `eka` 1 + `navuti` 90 = 91.
    Bản dịch cũ *Từ chín mươi **chín** kiếp trước,* là **99** — sai. Đã sửa thành *Từ chín mươi **mốt** kiếp trước,*. Tiền lệ trong chính tầng: 86 khoá cùng `Ekanavutito` đã viết *chín mươi mốt* (= 91) và **0** khoá nào viết *một*; 21 khoá sai nằm ở 21 tệp này (chính là số đo trước khi sửa).
  - Vế trước/sau, dấu câu và mọi thứ khác trong câu giữ nguyên y như cũ.

