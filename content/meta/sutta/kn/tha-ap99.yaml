notes: |-
  Bản dịch chỉ từ Pāli root: tại commit đã ghim không có bất kỳ tệp Anh nào cho `tha-ap` (đo trên `source/upstream-manifest.json`). Giới hạn upstream, nên bài giữ `draft`.
  Bản song parallel TRÙNG PĀLI: **16** khoá Pāli trùng nguyên văn, **14** dùng lại y nguyên văn bản Việt cũ. Tiền lệ chính là cùng phẩm `tha-ap94/95/96/98/100`: `Therāpadāna` (278) · `Sudhāvagga` → Phẩm Sudhā (5) · `āhutīnaṁ paṭiggahaṁ` → xứng đáng đón nhận các phẩm vật cúng dường · `Osadhiṁva virocantaṁ` → Rực rỡ như sao mai lấp lánh (2) · `Vitti mamāhu tāvade` → Niềm hoan hỷ liền khởi lên trong ta · `Vanditvā satthuno pāde` → đảnh lễ dưới đôi chân bậc Đạo Sư · `pakkāmiṁ pācināmukho` → rồi cất bước quay về phương đông (tha-ap81) · `Catunnavutito kappe` → Vào chín mươi tư kiếp trước đây (16) · `Duggatiṁ nābhijānāmi` (83) · `Sattaratanasampannā` → Đầy đủ bảy món báu quý giá (12) · `cakkavattī mahabbalā` → là các Chuyển Luân Vương có đại oai lực (8) · `Paṭisambhidā catasso` (292) · `…pe…` → … (491) · `kataṁ buddhassa sāsanaṁ”.` (258).
  Hai chỗ cố ý viết khác kho, cả hai đều đo được. (1) `nisabhājāniyaṁ yathā;` có hai tiền lệ ngang nhau — *như con bò mộng dòng dõi cao quý* (tha-ap285:1.2) và *như chúa ngưu thuần chủng xuất chúng* (tha-ap324:1.2); chọn vế sau vì `nisabhājāniya` nghĩa là *không trộn với giống thường*, tức thuần chủng và đứng tách khỏi đàn. Người biên tập nên gộp một trong hai bài kia. (2) `pubbakammassidaṁ phalaṁ.` hai tiền lệ ngang nhau (mỗi 1); chọn *đây là quả báo của tiền nghiệp* vì `phalaṁ` trong cả tầng đã dùng **quả báo** nhiều hơn hẳn *quả báu*, còn `kamma` ở đây là nghiệp thuở trước nên *tiền nghiệp*.
  0 tiền lệ, đặt mới, ghi kèm lý do: `Vipine kānane disvā` → *Trong khu rừng Vipinā* · `appasadde nirākule` → *nơi ít tiếng động, không đông đúc* · `isinaṁ seṭṭhaṁ` → *vị cao quý nhất trong hàng sa-môn* · `Nibbutattaṁ mahānāgaṁ` → *Con voi lớn tên Nibbutatta* · `Vuṭṭhitassa samādhimhā` → *Nhờ thiền định đã viên mãn* · `ñāṇaṁ uppajji tāvade` → *tri kiến liền sinh khởi như vậy* · `devasaṅghanamassitaṁ` → *được các vị trời kính ngưỡng*.
  Bất định đã ghi nhận, không che, và đây là điểm yếu thật của bài. Cặp kệ `5.1–5.2`: `Madhu bhisehi savati, / bhojanamhi ca tāvade;` — `Madhu` là tên riêng, `bhisehi` là cách điện ngữ cách của số nhiều `bhisa` (rễ, gân, ngà voi), `savati` là `savati` (chảy, tràn). Ba từ này không tạo thành một câu có nghĩa trọn vẹn trong tiếng Việt, và bài không có tầng Anh để phân xử. Bản dịch giữ **nguyên văn mọi từ có nghĩa và chỉ nối cấu tốc** thành *Madhu từ chiếc ngà tràn ra, / cũng như cả thức ăn nữa;* — một cách đọc sát chữ nhất có thể, KHÔNG phải một nghĩa đã được xác nhận. Cách đọc thay thế (`bhisehi` là `bhāgehi`, *chia phần*; hoặc `Madhu` là thần tướng được dâng phẩm vật chứ không phải mật) cũng mở ra, nhưng không có bằng chứng nội bộ để chọn. Vì thế `ambiguity_integrity` đặt 9,0 và `semantic_fidelity` 9,3, không nâng lên để né việc này.
  Dấu lược: đúng một khoá lược (`8.2` = `…pe…` → `…`), đếm bằng `lược()` của `_hvi.py`.
