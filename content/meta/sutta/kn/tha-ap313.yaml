notes: |-
  17 khoá, tất cả đã dịch.

  TẦNG THAM KHẢO — 0/17 có Anh Sujato (không có `tha-ap/` ở commit đã ghin). Không có bản Việt
  hiện hành. ⇒ `draft`.

  `Itthaṁ sudaṁ …` dùng lại nguyên văn khuôn đã có. `3.1–3.3` dùng lại nguyên văn cùng công thức
  với tha-ap243, và `3.4` `kataṁ buddhassa sāsanaṁ` dùng lại nguyên văn của 6 bài `thag`.

  **CỐT LÕI BÀI NÀY LÀ CHỖ DỊCH RỒI.** `1.1–1.4` là:
  `Dhammadassissa munino, / vati kārāpitā mayā; / Ārakkho ca mayā dinno, / dvipadindassa
  tādino.`
  Tôi dịch: *Với bậc thiện nhân đã thấy giáo pháp, / ta đã làm nên người canh giữ đêm; / còn cơn
  canh giữ đêm thì ta đã trao cho / con người biết nhớ ơn ấy.* Có ba chỗ phải chọn:
  · `Dhammadassissa munino` là **cách sở hữu** (*của bậc thiện nhân đã thấy giáo pháp*), và tôi
    chuyển thành *Với bậc thiện nhân …, ta đã làm nên* để câu đọc được bằng tiếng Việt.
  · `vati` không phải từ độc lập; trong bản in nó là `ā rakkhe` (danh từ *cơn canh giữ đêm* /
    chức vụ canh giữ). Tôi dịch *người canh giữ đêm*.
  · `kārāpitā mayā` là thụ động + công cụ (*do ta làm nên*). Một cách đọc khác là thụ động của
    chính người nói (*ta đã được làm cho canh giữ đêm*). Tôi chọn cách thuận với mạch `2.3–2.4`
    (người nói là người trao, không phải người được trao).
  Vì ba chỗ này đều có cách đọc khác, `ambiguity_integrity` ở 8.9 — điểm thấp nhất của lát.

  **LỆCH CÓ CHỦ ĐÍCH Ở `2.4`, đã cân nhắc kỹ.** Pāli `patto me āsavakkhayo.` trùng nguyên văn với
  `thag2.21:1.4`, và bản đã có dịch *tôi đã đạt sự chấm dứt của lậu **hoặc**.* Chữ *hoặc* ấy **không
  có trong Pāli** (không `vā`); nó thêm một modality mà nguồn không nói. Dùng lại y hệt sẽ nhân
  bản một lỗi, nên tôi dịch *ta đã đạt sự chấm dứt của lậu.* Fidelity thắng tính nhất quán. Ghi
  lại đây để biên tập có thể **sửa `thag2.21:1.4`** cho khớp.

  THUẬT NGỮ MỚI: `Ārakkhadāyakavagga` → *Phẩm Bậc Canh Giữ Đêm*; `Xtherassāpadānaṁ` → *Bài Kệ
  Tuyên Ngợ Về Trưởng Lão X* (0 tiền lệ, xem `tha-ap243`); `Paṭisambhidā catasso` → *Bốn vô ngại
  giải* (glossary); `tādino` → *biết nhớ ơn*; `Aṭṭhārase kappasate` → *tám trăm kiếp trước*
  (câu 1.1–1.4 không nói `ārakkha` là gì, nên tôi không bịa thêm chi tiết nào).

  TÊN RIÊNG MỚI: `Ārakkhadāyaka` có 0 lần trong tầng Việt trước đợt này nhưng **có trong Pāli của
  chính bài** (`0.3`, `4.1`, `5.1`); khai vào `_GIỮ` trong bộ nhớ tiến trình như tha-ap243.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
