  `Gijjhavagga` và `Navakanipāta` **0 tiền lệ** trong tầng (cả 12 bài `ja427`–`ja438` đều chưa dịch). Chọn **Phẩm Hươu** vì đo trên 400 phẩm đã dịch: **239 dịch nghĩa so với 161 giữ nguyên Pāli**, và các phẩm tên loài vật đều dịch (Kulāvakavagga → *Phẩm Tổ Chim* 10/10 theo `BRIEF_VI3` §11, Kokilavagga → *Phẩm Chim Tu Hú* 6/6, Varuṇavagga → *Phẩm Cây Varuṇa* 5/5); `gijjha` là hươu. Chọn **Bộ Chín Bài Kệ** vì tầng `name/` đã ghim của SuttaCentral cho `ja-name:478.ja-navakanipata` → “The Book of the Nines”, và hai nipāta kề trong lớp `ja` đều dùng dạng *Kệ* (Sattakanipāta → *Bộ Bảy Bài Kệ* 12/12, Aṭṭhakanipāta → *Bộ Tám Bài Kệ* 5/5). Ghi rõ vì dạng *Bộ N Bài Kinh* chiếm đa số toàn tầng (349 so với 48 theo tầng `name/`) và người gộp lát có thể muốn thống nhất.
  Không khoá nào của 6 bài `ja` này có `…pe…` ở Pāli (đã kiểm 246/246 khoá), nên không có dấu lược nào để giữ và không chỗ nào bịa dấu lược che chỗ thiếu.
  Pāli mở/đóng ở từng câu kệ: 1.1/1.4, 2.1/2.4, 3.1/3.4, 4.1/4.4, 5.1/5.4, 6.1/6.4, 7.1/7.4, 8.1/8.4, 9.1/9.4; bản Việt giữ đúng chín cặp đó.
  Bản này là **Pūtimaṁsa**, bài thứ mười một của `Gijjhavagga` trong `Navakanipāta`, cũng là bài cuối của phẩm.
  Pāli trùng nguyên văn trong tầng đã có: **1 khoá duy nhất** — `:0.1` *Jātaka*, và tôi **dùng lại nguyên văn** (390/406 tệp ghi *Jātaka*, 16 tệp ghi *Chuyện Tiền Thân*; trong số 390 tệp khớp có cả `ja159`, tức là 3 bài `ja` có bản Anh đã ghim cũng dùng *Jātaka*). Ngoài ra 3 khoá tiêu đề `:0.2`/`:0.3` dùng chung với 4 bài kia của lát.
  **Bất định đã ghi, không bịa:** (1) `:3.3` `matālayaṁ` — là *nơi ở của mẹ* (`mā` + `alaya`) nhưng không có chủ ngữ và tân ngữ; tôi dịch *kẻ đã làm thành nơi ở cho mẹ mình*, và `:3.4` *lại không đúng lúc mà nhìn tôi* giữ `vipekkhasi` ở ngôi thứ hai. Đây là chỗ khó nhất của bài: bản chép Pāli có thể đã hỏng một từ. (2) `:2.3`–`:2.4` `Pajjhāyi paṭigacchantiṁ, āgataṁ meṇḍamātaraṁ` — `paṭigacchanti` là chủ động (“chúng quay về”) trong khi `āgataṁ Meṇḍamātaraṁ` lại là vô chủ ngữ; tôi để hai vế tách biệt và không thêm chủ ngữ cho vế sau. (3) `:9.3`–`:9.4` `Ārogyaṁ āḷino vajjaṁ, idheva vasa māgamā` — `āḷino` là cách sở hữu của `āḷi` (mỡ) trong khi `vajja` là “tinh túy”, nên mệnh đề nghe cộc; tôi dịch *sức khỏe là điều cốt lõi* và `māgamā` là tên họ (Maga) nên *những người họ Maga có quyền lực*, ghi rõ vì `māga` còn có nghĩa là con đường.
  Thuật ngữ theo tiền lệ đếm được: `veṇī` → dây leo / cây leo (không có tiền lệ, dịch nghĩa), `ummattikā` → giả dối (không có tiền lệ), `puṇṇapattaṁ` → một phần đầy đủ (không có tiền lê), `parivāra` → đoàn người hùng vĩ (không có tiền lệ). Tên riêng trong kệ đã có tiền lệ một phần: `Piṅgiyo` (12 nơi) và `Jambuka` (6 nơi) đã dùng đúng như tôi; `Māliyo` và `Caturakkho` **0 tiền lệ** — tôi giữ nguyên dạng Pāli có dấu để không sinh chữ không có trong nguồn. `Meṇḍamātara` **0 tiền lệ** ở dạng này (tầng chỉ có `Meṇḍaka`/`meṇḍaka` ở tiêu đề phẩm), tôi giữ Pāli.
