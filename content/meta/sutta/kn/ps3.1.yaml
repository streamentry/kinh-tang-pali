  Tầng tham khảo: english-sujato không có ps3.1 (manifest của commit đã ghim: sutta/kn chỉ có cp dhp iti ja kp snp thag thig ud, 0 tệp Sujato cho ps; đây là not-published-upstream, không phải not-synced; tệp duy nhất của Sujato nhắc đến bài là tệp tên phẩm, nhan đề Discussion of Great Wisdom, không phải kinh văn); english-project của dự án chưa có tệp ps nào; vietnamese-current (phantuananh) chỉ có Pháp Cú. Coverage English theo công thức của source/layers.yaml: mẫu số 368 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0) trên tổng 564 khoá, tử số 0 ⇒ 0/368 = 0%, dưới ngưỡng 0,8; 196 khoá còn lại (ngắn hơn 40 ký tự: tiêu đề, câu kết, các khoá lược) cổng không đo được gì. Bài chỉ có Pāli root, tiền lệ nội bộ của chính tầng Việt dự án (các bài ps đã dịch, các bài kn đã dịch như mnd8 và cnd cho đoạn Đức Phật; sn55.62–74 và an1.600–615 cho danh sách mười sáu loại tuệ) và không có đối chiếu English độc lập, nên triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft. Bản Việt nguyên bài ở mục tra cứu toàn văn cuối trang không được đọc để làm căn cứ cho bản này.

  Cấu trúc bài: 1–11 là ma trận bảy phép quán (vô thường, khổ, vô ngã, nhàm chán, ly tham, đoạn diệt, xả bỏ) làm viên mãn bảy loại tuệ, rồi tám, chín loại, rồi bốn vô ngại giải, lặp qua sắc, quá khứ vị lai hiện tại, và các pháp lược (thọ, tưởng, hành, thức, mắt … già chết); 12–14 là một lời trích ba đoạn bốn pháp (nháy mở ở 12.1, đóng ở 14.6); 15–40 (3.1.1) lần lượt định nghĩa mười sáu loại tuệ: đạt được (15), tăng trưởng (16), sung mãn (17), lớn (18), rộng khắp (19), rộng rãi (20), sâu thẳm (21), không kề cận (22–29), rộng lớn (30), dồi dào (31), mau chóng (32), nhẹ (33), hoan hỷ (34), nhanh (35–37), sắc bén (38), thấu suốt (39); 41–50 (3.1.2) so sánh từng cặp hai người đã đạt vô ngại giải, mỗi lần thêm một điều kiện. Ở 6.1–6.5, 11.1–11.5, 30.8–30.24, 30.30–30.46, 33.6–33.9, 34.6–34.20, 35.5–35.7, 36.2–36.6, 37.2–37.6, 38.8–38.26, 39.7–39.23 Pāli lược bằng …pe… hoặc … đứng riêng; bản Việt giữ đúng một … ở từng khoá và không thêm chữ vào chỗ lược (động từ bị lược chỉ xuất hiện ở khoá cuối dãy, nên các khoá giữa chỉ có tân ngữ).

  Dấu câu: Pāli có 6 khoá chứa nháy kép (12.1 mở, 14.6 đóng; 24.2 mở và đóng; 25.1 mở, 29.4 đóng; 31.3 bốn cặp quanh bốn chữ -bāhuliko) và không có nháy đơn nào; bản Việt khớp từng khoá về số nháy từng loại (0 lệch). Có 126 khoá Pāli chứa dấu lược (35 khoá có …pe…, 91 khoá chỉ có …), 0 khoá có (…) trần; bản Việt khớp từng khoá (0 lệch). Dấu gạch dài viết có khoảng trắng hai bên theo các bài ps3.2, ps3.6, ps3.9, ps3.10 (ps2.x dùng không khoảng trắng; chọn theo các bài gần nhất cùng phẩm).

  Thuật ngữ và tiền lệ (đo trên tầng Việt đã có): paññā → trí tuệ (glossary). anupassanā: quán vô thường, quán khổ, quán vô ngã (ps2.9); nibbidā → quán nhàm chán, virāga → quán ly tham, nirodha → quán đoạn diệt, paṭinissagga → quán xả bỏ (ps3.2:17.6–17.9, cùng dãy bốn này, và công thức quán vô thường, quán ly tham, quán đoạn diệt và quán xả bỏ ở mn37 ×5); với paṭinissaggānupassī/anupassanā tầng có 45 khoá: quán từ bỏ 16, quán buông bỏ 13, quán xả bỏ 7; riêng ps là từ bỏ 4 (ps2.9) và xả bỏ 1 (ps3.2); chọn xả bỏ để không trùng pajahati (từ bỏ, dùng ở 38.x) và để cùng dãy với ps3.2 và mn37. bhāvitā bahulīkatā → khi được tu tập, được làm cho sung mãn (499 khoá có cặp này, 360 khoá có làm cho sung mãn; khuôn mn118:15.2–15.4, sn54.16); paripūreti → làm viên mãn (215 trên 526 khoá có paripūr-, khuôn mn118:15.2–15.4). saṁvattati → đưa đến. Mười sáu loại tuệ: paññāpaṭilābha → sự đạt được trí tuệ, paññābuddhi → sự tăng trưởng trí tuệ (glossary, an1.76–81), paññāvepulla → sự sung mãn trí tuệ (an1.600–615), mahāpaññā → trí tuệ lớn (sn55.62, 15 khoá cùng dạng; mahāpañña ở nơi khác thường là đại trí 42, đại tuệ 21, là danh xưng của người), puthupaññā → trí tuệ rộng khắp (sn55.63, an1.600–615; dạng trí tuệ rộng 13 khoá chủ yếu ở bộ sáu tuệ của dn30, cnd15, mnd4, mnd8 — ở đây là danh sách mười sáu nên theo sn55 và an1), vipulapaññā → trí tuệ rộng rãi (an1.600–615; sn55.64 dịch dồi dào), gambhīrapaññā → trí tuệ sâu thẳm (sn55.65, an1.600–615; sâu thẳm 4, thâm sâu 7, sâu xa 3), asāmantapaññā → trí tuệ không kề cận (0 tiền lệ ngoài an1.600–615 dịch phi thường; chọn sát nghĩa đen ở 23.1–23.12 na santike na sāmantā), bhūripaññā → trí tuệ rộng lớn (25 trên 29 khoá có bhūripañña; sn55.67 dịch bao la), paññābāhulla → sự dồi dào trí tuệ (an1.600–615), sīghapaññā → trí tuệ mau chóng (sn55.69), lahupaññā → trí tuệ nhẹ (sn55.70, an1.600–615), hāsapaññā → trí tuệ hoan hỷ (19 trên 27 khoá, hỉ hả 2), javanapaññā → trí tuệ mau lẹ (19 khoá ở 5 bài: sn55.24, sn55.25, sn2.29, an1.600–615, mn111; trí tuệ nhanh 7 khoá ở dn30, mnd4, mnd8, cnd15, sn8.7, an1.600–615; nhanh nhạy 3 khoá gồm sn55.72; chọn mau lẹ theo đa số và theo an1.600–615 là danh sách mười sáu cùng bài, đồng thời tách khỏi sīghapaññā là mau chóng), tikkhapaññā → trí tuệ sắc bén (19 trên 19), nibbedhikapaññā → trí tuệ thấu suốt (11 trên 25 khoá, thông suốt 5, thấy thấu 3, quán triệt 2). paṭisambhidā → vô ngại giải, dạng nghĩa vô ngại giải, pháp vô ngại giải, ngữ từ vô ngại giải, biện tài vô ngại giải theo ps2.6 (nghĩa vô ngại giải 25, pháp vô ngại giải 11, biện tài vô ngại giải 13 khoá trong ps); sacchikatā phassitā paññāya → đã được chứng ngộ, đã được chạm đến bằng trí tuệ (ps2.6:73–77; chạm đến 39 trên 41 khoá); sotāpanna → Dự lưu (ps 15 trên 15; sn55.55–58 dịch Nhập lưu ở 22 khoá thuộc lát khác); sakadāgāmī → Nhất lai, anāgāmī → Bất lai (sn55.56–57); abhiññā → thắng trí (7 trên 9 khoá dạng danh từ; ps1.1 và ps2.6 dùng thắng tri cho abhiññeyya và cho phạm trù); pariggaṇhāti → nắm bắt (ps2.4:51.4; 13 trên 44 khoá có pariggaṇh-); sīlakkhandha … vimuttiñāṇadassanakkhandha → giới uẩn, định uẩn, tuệ uẩn, giải thoát uẩn, giải thoát tri kiến uẩn (tầng có 13 khoá dạng này: giải thoát tri kiến uẩn 4, tri kiến giải thoát uẩn 2 gồm sn47.13:5.5, giải thoát trí kiến uẩn 1 là dn34:1.6.103); ṭhānāṭṭhāna → điều có thể và không thể (ne21:18.2); vihārasamāpatti → sự an trú và chứng đạt (mn32:9.7); sāmaññaphala → quả sa-môn (dn33, dn34); paṭiccasamuppāda → duyên khởi và paṭiccasamuppanna → do duyên sinh (dn15:29; duyên sinh 5 khoá, duyên khởi 55); paṭivijjhati → thông suốt (ps2.2:14.5 dịch paṭivedha là thông suốt). Danh sách mười bốn cấu uế: kodha giận dữ, upanāha hằn học, makkha gièm pha, paḷāsa hơn thua, issā ganh tị, macchariya keo kiệt, māyā giả dối, sāṭheyya xảo trá (24 trên 59 khoá; gian xảo 12), thambha bướng bỉnh, sārambha hung hăng (27 trên 55; gây hấn 8), māna ngã mạn, atimāna ngạo mạn, mada tự mãn, pamāda phóng dật: đúng dãy của mnd8:65.3, cnd6:15.2, cnd7:60.4, cnd11:10.2; sabbe abhisaṅkhārā → mọi hành tạo tác, sabbe duccaritā → mọi ác hạnh, bhavagāmikamma → nghiệp dẫn đến hữu (0 tiền lệ cho dạng này). nādhivāseti pajahati vinodeti byantīkaroti anabhāvaṁ gameti → không chấp nhận, từ bỏ, loại bỏ, chấm dứt, làm cho không còn tồn tại (mn2:20.2); kāmavitakka, byāpādavitakka, vihiṁsāvitakka → ý nghĩ về dục, ý nghĩ sân hận, ý nghĩ gây hại (mn2:20.2). nibbijjhati padāleti → đâm thủng và phá tan, lobhakkhandha → khối tham (sn46.28:2.2–2.4 dịch khối tham ái, khối sân hận, khối si mê). paṇḍicca → sự hiền trí (pe3:30.3, 1 khoá). paccekasambuddha → bậc Độc Giác (dn16:5.12). khayadhammaṁ vayadhammaṁ virāgadhammaṁ nirodhadhammaṁ → có bản chất tiêu hoại, suy tàn, ly tham và đoạn diệt (dn15:29.1–29.3; mn74:11.1 dịch có tính tận, có tính hoại, có tính phai nhạt, có tính chấm dứt). Đoạn nói về trí của Đức Phật (24.1–29.6) dựa vào mnd8:78.15–83.4, cùng Pāli hoặc chỉ khác dấu câu và vài chữ, nên giữ nguyên cách dịch đã có: biết mà biết, thấy mà thấy, là bậc mắt, là bậc trí, là bậc pháp, là bậc Phạm thiên (mn138:7.3, mn133:9.3); cái đáng biết, trí lấy cái đáng biết làm giới hạn; nắp hộp; cá voi nuốt cá voi nuốt; kim sí điểu Venateyya; hiền trí Sát-đế-lợi … sắc bén như chẻ sợi tóc (dn1:2.26.6).

  Pāli trùng nguyên văn: trong chính bài 51 nhóm (149 khoá, gồm các khoá 3.x, 5.x, 7.x, 10.x, 2.8–2.10 lặp ở 4.5–4.7, 6.10–6.12, 9.15–9.17, các câu 12.2/13.4/14.3, 12.3/13.5/14.4, 26.7–26.11 lặp ở 26.14–26.18, 35.3–35.4 lặp ở 35.9–35.10 và 35.13–35.14, 41.3 mẫu lặp qua 42–49 …), 0 nhóm mà bản Việt khác. Đã dò cả tầng: 55 khoá của bài trùng nguyên văn Pāli với ít nhất một khoá đã dịch ở nơi khác, 49 khoá có bản Việt giống ít nhất một khoá ấy, 6 khoá khác: 6.1 và 11.1 (Nơi thọ …, theo ps1.1 và ps2.9 dùng thọ; sn22.131:2.2 và các khoá cùng Pāli dịch cảm thọ); 35.5 (Bất cứ thọ nào …, khác mn22:27.2 vì câu liền sau không còn ở đây); 36.2 và 37.2 (Thọ …, khác sn23.46:1.6 là cảm thọ); 12.1 (sn55.55:1.1 dịch đã được tu tập, đã được tăng cường, quả bậc Nhập lưu; ở đây theo khuôn ps và mn118: khi được tu tập, được làm cho sung mãn, quả Dự lưu).

  Số Pāli: satta 7, aṭṭha 8, nava 9 ở 2.8–2.10 (và 4.5–4.7, 6.10–6.12, 9.15–9.17): 2.1–2.7 liệt kê đủ bảy loại (nhanh, thấu suốt, lớn, sắc bén, rộng rãi, sâu thẳm, không kề cận); tám = bảy + sự hiền trí, chín = tám + trí tuệ rộng khắp; ở 9.x đếm đủ 7 mục nối với 14 cặp. cattāro dhammā 4 (12.3, 13.5, 14.4 liệt kê đủ bốn mục). soḷasa 16 ở 40.1–40.2: đếm đủ mười sáu loại ở các mục 15–39 (đạt được, tăng trưởng, sung mãn, lớn, rộng khắp, rộng rãi, sâu thẳm, không kề cận, rộng lớn, dồi dào, mau chóng, nhẹ, hoan hỷ, nhanh, sắc bén, thấu suốt), và 14.1–14.2 gồm 1 + 15 = 16 mệnh đề. 15.2: catunnaṁ 4 ×3 (trí về đạo, về quả, về vô ngại giải), channaṁ 6 (thắng trí), tesattatīnaṁ = te 3 + sattati 70 = 73, sattasattatīnaṁ = satta 7 + sattati 70 = 77. sattannaṁ sekkhānaṁ = bảy bậc hữu học (16.2, 17.2). 38.28: bốn thánh đạo, bốn quả sa-môn, bốn vô ngại giải, sáu thắng trí. 23.1–23.13: bảy bậc từ phàm phu thiện lành đến bậc Độc Giác rồi Như Lai. 41–50: mười hai điều kiện lần lượt cộng dồn (nỗ lực từ trước, đa văn, thuyết giảng, nương tựa bậc thầy, an trú, quán xét lại, vô học, viên mãn đệ tử), không có số lớn.

  Bất định, không thêm vào thân kinh: (1) asāmantapañña → không kề cận, bậc có trí tuệ không kề cận: nghĩa đen na santike na sāmantā ở 23.x; an1.600–615 dịch phi thường; 22.2–22.3 định nghĩa là không ai khác sánh kịp (abhisambhavituṁ dịch sánh kịp, 0 tiền lệ chắc chắn). (2) 25.5 attho: mnd8:79.5 và mnd8:34.10–34.12 dịch lợi ích cho cả dãy 15 mục; ở đây tách: năm mục đầu (attattho, parattho, ubhayattho, diṭṭhadhammiko, samparāyiko) là lợi ích, mười mục sau (uttāno … paramattho) là ý nghĩa, vì neyyo attho và nīto attho là cặp nghĩa cần giải thích, nghĩa đã giải thích (an2.24–25, ne5:54.6 dịch nghĩa cần dẫn giải, nghĩa đã rõ); khác nguyên văn mnd8:79.5 có chủ ý và có thể đổi lại. (3) pabhijjati (41.4 …): dịch trở nên phân tích rõ ràng, theo pabhinnañāṇo (có trí phân tích, mnd8:78.15) và paññāpabhedakusalo; 0 tiền lệ cho ñāṇaṁ pabhijjati. (4) pubbayogasampanno: dịch đầy đủ sự nỗ lực từ trước; có thể là sự tu tập đã làm trong đời trước; 0 tiền lệ. (5) garūpanissito: nương tựa bậc thầy; garū có thể số nhiều. (6) 31.2 okkhāyanabahulo, samokkhāyanabahulo, sampekkhāyanadhammo, vibhūtavihārī: dịch thường xuyên quán sát, thường xuyên quan sát kỹ, có bản chất xem xét kỹ, sống trong sự sáng tỏ; 0 tiền lệ cho các từ này (cnd22:53.1 chỉ có Pāli); các từ còn lại của dãy lấy theo cnd10:22.2 (taccarito sống theo điều ấy, tanninno hướng về điều ấy, tappoṇo nghiêng về điều ấy, tappabbhāro xuôi về điều ấy, tadadhimutto nghiêng hẳn về điều ấy, tadadhipateyyo lấy điều ấy làm chủ đạo); paññāsayo dịch có khuynh hướng trí tuệ theo mnd8:81.2 (āsaya là khuynh hướng); 31.3 bāhuliko dịch người nặng về …, bāhulla ở tiêu đề dịch sự dồi dào (hai cách đọc gần nhau, chưa có tiền lệ cho gaṇabāhuliko). (7) aṭṭhamaka → bậc thứ tám (đếm từ A-la-hán trở xuống: người ở đạo Dự lưu); 0 tiền lệ, giữ nghĩa đen; puthujjanakalyāṇaka → phàm phu thiện lành (0 tiền lệ ở lớp dịch; mnd6 chỉ có Pāli). (8) 39.3 bahimukho: dịch quay mặt đi; có thể là hướng ra ngoài. (9) 13.6 arahattamaggaphalasacchikiriyāya: dịch sự chứng ngộ đạo quả A-la-hán (magga và phala đều là A-la-hán); 13.3 chỉ có phala. (10) 15.2 mười từ lābho … upasampadā dịch sự có được, sự đạt được, sự đạt đến, sự thành tựu, sự chạm đến, sự chứng ngộ, sự chứng đạt; công thức này 0 tiền lệ. (11) 35.2 …: khippaṁ javati với aniccato/dukkhato/anattato dịch nhanh chóng lao tới … theo phương diện vô thường/khổ/vô ngại; Pāli không nêu chủ thể của javati nên không thêm; sự lao tới Niết-bàn (rūpanirodhe nibbāne, định vị cách) dịch lao tới Niết-bàn, sự đoạn diệt của sắc. (12) 19.6, 21.6 suññatamanupalabbha: dịch tính trống rỗng và sự không thể nắm bắt (có thể là hai điều hoặc một dạng ghép); 0 tiền lệ. (13) 18.11 mahantāni ṭhānāṭṭhānāni: dịch những điều có thể và không thể lớn; tính từ đứng cuối vì Pāli ghép lớn với cả nhóm. (14) 32.2 sīghaṁ sīghaṁ, 33.2 lahuṁ lahuṁ: lặp lại của Pāli dịch bằng rất mau chóng, rất nhẹ nhàng; có thể đọc là lần lượt từng việc một. (15) 29.3 upakkhittakā và 29.1 vobhindantā giữ theo mnd8:83.1–83.3. (16) 8.x–11.x atītānāgatapaccuppanne dịch thuộc quá khứ, vị lai và hiện tại, dùng như tính từ của sắc, già chết.

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (564 = 564), thứ tự giống Pāli; nháy kép: 6 khoá Pāli có nháy, 0 lệch, không có nháy đơn trong Pāli; dấu lược … khớp Pāli từng khoá (126 khoá có dấu lược, 0 lệch, 0 khoá (…) trần); số Pāli đã tự tính (41 chỗ có số từ trong Pāli, đối chiếu từng chỗ với bản Việt, 0 lệch); NFC, khoá rỗng, khoảng trắng thừa, Pāli lọt sang Việt (chỉ còn tên riêng Māra, Sāriputta, Paṭisambhidāmagga và Bhūri nguyên văn ở 30.48 và 30.51): 0 lỗi trên 564 khoá; đã đọc cặp Pāli với Việt của cả 564 khoá.

  Chưa chạy cổng kỹ thuật nên technical_integrity đặt 9,6: còn phải chạy npm run validate, npm test, npm run check, npm run build.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (dịch 2007, đọc từ dòng tác giả và chân trang của tệp). Đã so từng đoạn tương ứng cho cả 564 khoá, trong đó phần lớn khoá là công thức lặp mà bản nguyên bài đã lược; 6 chỗ bất đồng nghĩa → sửa 1 (ps3.1:30.51: trước là "Bhūri là trí sáng suốt, có tính dẫn dắt", sau là "Bhūri, trí thông tuệ, trí dẫn dắt": Pāli Bhūri medhā pariṇāyikā là ba danh xưng đồng nghĩa của paññā đặt liền nhau, không có hệ từ; bản trước gộp thành một vị ngữ, và cùng ba từ ấy ở mnd2:82.4 và cnd5:30.2 đã dịch rời thành trí rộng lớn, trí thông tuệ, trí dẫn dắt), giữ 4 (ps3.1:2.2, 8.x và các khoá lặp: bản nguyên bài có một chỗ đặt trí nhàm chán cho nibbedhikapaññā, trong khi cùng bản ở mục 3.1.1 lại dịch thông suốt và Pāli ở 2.2, 12–14, 39 đều là nibbedhika, nên giữ trí tuệ thấu suốt; ps3.1:30.3, 30.5, 30.7, 30.26: bản nguyên bài hiểu abhibhavitā như thể bị động, còn Pāli là danh từ tác nhân của abhibhuyyati nên giữ là người chế ngự; ps3.1:25.5: bản nguyên bài dịch mọi attho là ý nghĩa, còn ở đây năm mục đầu giữ là lợi ích, đúng với cách dùng quen thuộc của attattho, parattho, diṭṭhadhammiko attho, samparāyiko attho, như đã ghi ở bất định (2); ps3.1:3.2, 5.2, 7.2, 10.2: bản nguyên bài hiểu tassā atthavavatthānato là do tuệ ấy xác định, còn Pāli đặt tassā ở sở hữu cách đi với atthavavatthāna nên giữ là xác định nghĩa của trí tuệ ấy), bất định 1 (ps3.1:29.3 và 50.3: upakkhittakā, bản nguyên bài dịch là người hỗ trợ, bản này giữ theo mnd8 và mnd16 là được thu nhận; hapax, Pāli không đủ để phân xử, không đổi canonical). Phần khác biệt chỉ ở thuật ngữ, không đổi nghĩa (đổng tốc/mau lẹ, vi tiếu/hoan hỷ, phổ thông/rộng khắp, bao la/rộng lớn, bản tánh sáng suốt/hiền trí, hòa giải/dẫn dắt của anunetā theo mnd16:8.1 và dn31:34.19) không tính vào số bất đồng. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Lượt này đọc bản nguyên bài lần đầu, nên câu trước đó ghi rằng bản ấy không được đọc làm căn cứ chỉ nói về lúc dịch, không còn đúng cho trạng thái hiện tại; triangulation đã đối chiếu thật với Pāli và một bản Việt độc lập, không có bản Anh, nên có trần 8,8 và được chấm 8,5.
