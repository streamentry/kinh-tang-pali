  BẤT ĐỊNH ĐÃ PHÂN XỬ. `mil3.7.4:3.6` `Abhijānāsi nu tvaṁ, mahārāja, tattha kiñcideva
    karaṇīyaṁ karitvā saritā` bị cắt ngữ trong chính bản chụp (`saritā` = *đã đi tới* nhưng vế
    trước bị cắt). Tôi dịch theo cách đọc duy nhất còn đứng vững là *ngài có biết ở đó, do làm
    một việc gì mà đi tới không*, và ghi ở đây vì đó là cách đọc của tôi chứ không phải dữ kiện
    văn bản. Câu trả lời `Āma, bhante, sarāmī` (*vâng, con đã đi*) và câu khen `Lahuṁ kho tvaṁ…`
    (*ngài đi nhanh quá*) khớp với cách đọc đó.
