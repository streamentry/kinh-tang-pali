notes: |-
  KỸ THUẬT. Lượt này không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` (bị cấm, người điều phối chạy tập trung), nên không tuyên bố technical gate pass: `technical_integrity` chấm 9,6. Tôi đã tự kiểm thủ công cả 19 khoá: đủ khoá, không thừa/thiếu so với Pāli, đúng thứ tự Pāli, chuỗi NFC, không khoá rỗng, dấu nháy đơn/kép khớp Pāli từng khoá, không Pāli lọt sang bản Việt, không có dấu lược (Pāli của bài không có `…pe…` hay `(…)`).

  COVERAGE (đo lại 2026-10-12). Mẫu số = 9 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) trên 19 khoá; 0 khoá mang chữ Anh Sujato, vì bản chụp đã ghim không phát hành bài này; tầng `english-project` cũng chưa có cho bài. Tầng Việt hiện hành cũng vắng: tại commit đã ghim `translation/vi/` của bilara chỉ có Pháp Cú; `budsas.org` chỉ là tra cứu toàn văn, không có căn cứ alignment ở mức segment. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho. Cả ba tầng tham khảo vắng ⇒ `triangulation` ≤ 8,0 (chấm 7,0).

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ. `“Kallosi, bhante nāgasenā”ti.` → *“Khéo lắm, thưa tôn giả Nāgasenā.”* (nguyên văn dùng ở nhiều bài mil khác). `Milindapañha`, `Arūpadhammavavatthānavagga` → *Phẩm Xác Định Pháp Vô Sắc* (cùng mil3.7.2). `bhante nāgasena` → *Thưa tôn giả Nāgasena*; `mahārāja` → *Đại vương*; bare `bhante` → *bạch tôn giả* (mil3.7.2:2.2). `Āma` → *Vâng*. `yojana` → *do-tuần*. `iddhimā bhikkhu cetovasippatto` → *vị tỳ-kheo có thần thông, làm chủ được tâm*; `brahmaloka` → *cõi Phạm thiên*; `jambudīpe antarahito` → *biến mất khỏi Jambudīpa*; `samiñjitaṁ vā bāhaṁ pasāreyya` → *duỗi cánh tay đang co*. `kūṭāgāramattā` → *lớn bằng ngôi nhà lầu có mái chóp* theo `mil3.4.6:1.3` (*kūṭāgāramattopi pāsāṇo* → *một viên đá chỉ lớn bằng ngôi nhà lầu có mái chóp*). `Dvimattāni yojanasatāni` → *chừng hai trăm do-tuần* theo `mil3.7.5:2.5` (cùng công thức Pāli, *độ chừng hai trăm do-tuần*). `Alasanda` giữ nguyên dạng Pāli như `mil6.4.2:54.1`.

  SỐ PĀLI. `aṭṭhacattālīsayojanasahassāni` = aṭṭha (8) + cattālīsa (40) = 48 → 48 × 1.000 = bốn mươi tám ngàn do-tuần. `dvimattāni yojanasatāni` = chừng hai trăm do-tuần. `catūhi māsehi` = bốn tháng. Pāli không nêu phép nhân tổng quãng đường, nên bản Việt không tính tổng.

  GIẢI QUYẾT DRAFT 2026-10-12. Phân loại blocker của lượt chấm 2026-10-02:
  (A) Thiếu bản Anh Sujato tại commit đã ghim — GIỮ nguyên: đó là sự thật về upstream. 
  (B) "Coverage English dưới ngưỡng 0,8 mà reference-gaps.yaml chưa có mục" — GỠ: đó là chuyện ghi nhận mất mát ở tệp do công cụ sinh, không phải lỗi văn bản; tôi đã đọc đối kháng cả 9 khoá Pāli có nội dung trực tiếp từ Pāli (không dựa vào tầng Anh) và bản dịch sau sửa tự đứng vững. `triangulation` chấm 7,0 vì không có bản Anh độc lập.
  Lỗi văn bản thật đã sửa (6 khoá đổi nghĩa chính, 3 khoá đổi lời xưng hô/tiểu tiết, trên 19 khoá):
  (1) `1.3` bản cũ hiểu sai hoàn toàn *kūṭāgāramattā silā tamhā patitā … bhassamānā catūhi māsehi pathaviyaṁ patiṭṭhaheyya* thành "cao chừng một tấc, dài chừng một do-tuần … nếu đi bộ liên tục thì … có thể đi hết trên mặt đất". Pāli nói: một tảng đá lớn bằng ngôi nhà lầu có mái chóp, rơi từ cõi Phạm thiên xuống, mỗi ngày đêm rơi 48.000 do-tuần, thì phải bốn tháng mới chạm mặt đất. Đã dịch lại.
  (2) `2.3` bản cũ "phải đi mấy trăm do-tuần nữa" thêm chữ "nữa" và đổi cấu trúc; Pāli *evaṁ atisīghaṁ tāva bahūni yojanasatāni gacchissati* = vị ấy sẽ đi qua nhiều trăm do-tuần nhanh đến thế. Đã sửa.
  (3) `3.3` bản cũ xưng *Bạch Thế Tôn*; Pāli chỉ có *bhante* và người đáp là vua Milinda nói với trưởng lão Nāgasena ⇒ *Bạch tôn giả*. Đồng thời *dīpa* = hòn đảo (không phải núi).
  (4) `3.6`–`3.7` bản cũ đọc *sarati* thành "đi tới" và *saritā* thành "đã đi tới"; *abhijānāsi … karitvā saritā* / *sarāmi* là "ngài có nhớ … đã làm việc gì ở đó" / "con nhớ" (*sarati* = nhớ; cùng nghĩa ở `mil5.1.2:14.1` *nhớ đến*). Đã sửa ở cả hai khoá.
  (5) `3.8` bỏ chữ "mới" thêm vào ("mới hai trăm do-tuần"); Pāli *lahuṁ gatosi dvimattāni yojanasatāni* = ngài đã đi chừng hai trăm do-tuần thật nhanh.
  (6) `3.4`, `3.2`, `3.5`: lời thầy nói với vua dùng *Này Đại vương* (không *Thưa Đại vương*); *dvimattāni* thêm *chừng*.
  CÁC MỤC CŨ BỊ THAY THẾ. Các mục sau của ghi chú lượt 2026-10-02 bị thay thế hoàn toàn bằng mục này: (a) "`kūṭāgāra` = chiều cao một tấc, `silā` = thước dài một yojana", (b) "`alasando` = tên núi cổ, nay là Anurādhapura", (c) "`saritā` = đã đi tới", (d) tên phẩm *Brahmalokapañha* nay là *Câu hỏi về cõi Phạm thiên* (giữ), và (e) mục "bất định đã phân xử" về `3.6`. Cả bốn điều (a)–(c) đều không có căn cứ trong Pāli đã ghim và không được dùng.
  BẤT ĐỊNH CÒN LẠI. (i) `3.6` *saritā* đứng sau *karitvā*; cách đọc *ngài có nhớ đã làm … ở đó không* khớp câu đáp *sarāmi* và câu nhận xét `3.8`, nhưng hình thức *saritā* là chỗ khó về hình thái, nên đây là cách đọc của tôi, không phải dữ kiện chắc chắn. (ii) *Alasanda* (hòn đảo) giữ nguyên dạng Pāli, không đoán địa danh hiện đại. (iii) *mattā* ở `1.3` đọc là "bằng cỡ" theo `mil3.4.6:1.3`.
