notes: |-
  **Tự kiểm, vì `cần` RỖNG.** `kiểm()` của `_hvi.py` không chạy assertion nào cho bài này. Tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá `all`, NFC, **số dấu lược khớp Pāli từng khoá**, ngoặc kép cân trên cả bài, không Pāli lọt, không `(…)`, không trùng Pāli, `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte. Dấu lược `1.7` = `… Abhayo thero ….` → hai dấu, không mở rộng (BRIEF_VI3 §10.1).

  **`1.2`–`1.5` PĀLI TRÙNG Y HỆT `thag1.99`**, nên tôi dùng **cùng một nguyên văn** cho cả hai bài — kể cả sau khi review đối kháng sửa. Mọi khác biệt giữa hai bài nằm ở `1.1` (thấy sắc / nghe tiếng) và `1.6` (gốc của hữu / luân hồi), và tôi dịch hai chỗ đó **khác nhau**, vì Pāli khác.

  **Bốn lỗi review đối kháng đã bắt và đã sửa — ghi lại vì đây là bài học, không phải chi tiết.**
  (1) Bản nháp đầu viết `Tâm đầy dục ý **khiến** người ấy cảm nhận` cho `Sārattacitto vedeti` — thêm quan hệ nhân quả mà Pāli không có (`vedeti` chỉ là *cảm nhận*). Đã sửa thành *Người ấy cảm nhận với tâm đầy dục ý*.
  (2) `manasikaroto` là **trạng ngữ genitive** (*khi đang chú ý vào…*), bản nháp viết thành mệnh đề trần; đã sửa thành *khi chú ý vào một tướng khả ái*, khớp cả với English Sujato (*as you focus on a pleasant feature*).
  (3) Trong lúc review tôi cũng phát hiện và **không** sửa: `an6.170-649:1.16` ghi *để chứng ngộ bằng thắng trí* cho `abhiññāya` — đúng. Nhưng `thag16.5` (chưa dịch, ngoài lát) có cùng khuôn `Rūpaṁ disvā sati muṭṭhā, Piyaṁ nimittaṁ manasi karoto; Sārattacitto vedeti, Tañca ajjhosa tiṭṭhati` với **chính** `Sārattacitto vedeti` và `Tañca ajjhosa tiṭṭhati`, nên lát sau dịch `thag16.5` nên lấy lại nguyên văn hai vế đó. (Khác một chữ: `thag16.5` viết `manasi karoto` thành hai từ, bài này `manasikaroto` làm một.)

  **Tiền lệ, đếm được.** `sati muṭṭhā` → *thất niệm* (59 chỗ; `muṭṭhā` là chữ đảo của `muṭṭha` = *thất*, cùng gốc với *thất trí* `asammoha`). `Piyaṁ nimittaṁ` → *tướng khả ái* (4 chỗ; `an3.68:3.2` `Subhanimittan` → *Tướng khả ái*). `Sārattacitto` → *tâm đầy dục ý*: **0 tiền lệ riêng**, đặt mới — `sārattā` là *đầy dục ý* (`sārada` + `rāga`), và `pe8:194.2` dịch `Sārattacitto` là *có tâm ham thích*. `ajjhosa tiṭṭhati` → *chạy theo*: theo `ajjhosāna` → *sự chạy theo* (`an9.23:1.3`), tổng cộng 93 chỗ; các cách khác trong tầng là *chấp mắc và trụ vào* (`mn106:10.11`) và *bám chặt vào* (`mn38:30.3`) — tôi chọn *chạy theo* vì nó nối thẳng với chuỗi `āsava` mà vế `1.5`–`1.6` nói tiếp. `vaḍḍhanti āsavā` → *lậu tăng trưởng* (`mn2:3.4` *lậu hoặc đã sinh sẽ tăng trưởng*). `bhavamūla` → *gốc của hữu* (`bhava` → *hữu*, `an4.10:2.3`; chỉ **3**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: chỗ *gốc của hữu*, còn *gốc của luân hồi* là 0 — đếm lại lúc bàn giao là 4 chỗ *gốc của hữu*).

  **Bất định đã ghi.** `Bhavamūlopagāmino` — `bhavamūla` (*gốc của hữu*) là hướng mà lậu đưa tới; tôi dịch *hướng tới gốc của hữu*. Cách đọc cạnh tranh là *gốc của luân hồi*, cũng thường gặp, nhưng bài kế `thag1.99` dùng `saṁsāra` cho cùng vị trí và tôi giữ **hai** chữ khác nhau ở hai bài, nên `thag1.99` là *luân hồi* và bài này là *gốc của hữu*; đó là lý do tôi hạ `ambiguity_integrity` và `terminology` xuống dưới các bài kia.

  **Không có bản Việt tham khảo** tại commit đã ghim; `triangulation` là Pāli + English Sujato (10/11, thiếu dòng lược `1.7`).

  **`technical_integrity` 9,6** vì đợt này cấm `npm run validate|test|build`, và `kiểm()` rỗng với bài này.
