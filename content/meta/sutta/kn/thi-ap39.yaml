notes: |-
  Dịch trực tiếp từ Pāli root: tại commit đã ghim không có bản Anh Sujato, không có bản Việt hiện hành và không có lớp lấp English cho thi-ap39. Đối chiếu với tiền lệ của phẩm thi-ap và tha-ap trong tầng.
  Dùng lại nguyên văn bản dịch đã có cho 16/17 khoá có Pāli trùng nguyên văn với tầng: `Therīapadāna` (9/10), `Phẩm Khattiya` (1/1), `với tâm trong sáng;` (4/13), `Vào ba mươi mốt kiếp trước,` (14/53), `Đức Sikhī, bậc Lãnh Đạo tối thượng của thế gian;` (1/1), `Tất cả các lậu hoặc đã cạn kiệt,` và `nay không còn tái sanh nữa.` (3/4 mỗi khoá), `Bốn vô ngại giải,` (448/454), `…` cho ba khoá `…pe…` (615/615). Khác biệt duy nhất so với tiền lệ là `:9.1` (xem dưới). Ba khoá `…pe…` (`:14.2`, `:15.2`, `:16.2`) có Pāli trùng nhau trong bài và Việt trùng nhau, 0 cặp trùng nội bộ mà Việt khác. Dấu lược giữ đúng một `…` cho mỗi `…pe…`.
  NGÔI THỨ NHẤT: dùng `con` cho mọi câu ngôi thứ nhất, theo đúng cụm thi-ap có Pāli trùng (`Mọi phiền não của con đã bị thiêu rụi,` 4×, `Thật là đón mừng thù thắng thay cho con,` 4×, `con đã làm tròn lời dạy của Đức Phật.` 4×, `con sống đời thanh tịnh không còn lậu hoặc.` 4×) và theo đa số thi-ap (`con` ở 5 bài thi-ap2/3/4/12/13; `tôi` ở thi-ap5/6/16; thi-ap7 và thi-ap31 pha trộn). Vì vậy khi so với các bài tha-ap có cùng Pāli (dùng `ta` hay `tôi`) bản Việt khác có chủ đích theo giới của người kể.
  Tên bài (`:0.3`) theo quy tắc của phẩm: Pāli `:0.3` mở đầu bằng số (`9`) nên bản Việt giữ số, dạng `9. …`, và `translationTitle` bằng đúng giá trị `:0.3`. Dạng tên `Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni …` theo đa số phạm vi gần nhất: trong thi-ap, 9/9 tên đã dịch dùng `Tuyên Ngợ` và 0 dùng `Tuyên Ngôn` hay `Ký Sự`; trong tha-ap là Tuyên Ngợ 244 · Tuyên Ngôn 97 · Ký Sự 96 (đếm trên `:0.3`). `Tuyên Ngợ` vốn bị coi là sai chính tả so với `Tuyên Ngôn` nên được giữ để đồng nhất với tầng, chờ biên tập phán một lượt cho cả cuốn. Dòng kết `:18.1` theo mẫu `…, thứ chín.`; lời kết `:17.1` theo công thức đa số `đã nói những bài kệ này` (Pāli `imā gāthāyo` là số nhiều).
  Số Pāli: `Ekattiṁse` = eka 1 + tiṁsa 30 = 31 ⇒ `ba mươi mốt kiếp`; `Dasajātisahassāni` = dasa 10 × sahassa 1000 = 10.000 ⇒ `mười ngàn lần sinh`; `catasso` = 4 ⇒ `Bốn vô ngại giải`; `pāṇakoṭīhi` là số nhiều của koṭi (10^7) ⇒ `hàng chục triệu`. Dùng `ngàn` theo đa số thi-ap/tha-ap (103 `ngàn` so với 43 `nghìn`).
  Bất định, ghi rõ để biên tập phán:
  (1) `:1.1` `raṁsiphusitāveḷo`: hợp từ hiếm (raṁsi = tia sáng, phusita = được chạm/được rắc, āveḷa = vòng hoa, vòng trang sức, mũ). Dịch sát từng thành tố là `vòng hoa được các tia sáng chạm đến`; không có tiền lệ trong tầng và không có bản Anh để đối chiếu; chưa phân xử được nghĩa chính xác.
  (2) `:6.4` `tapassinī`: có hai nghĩa trong Pāli, `nữ khổ hạnh` và `người khốn khổ, đáng thương`. Ngữ cảnh (vừa chết khỏi địa ngục, rồi mười ngàn kiếp làm kỹ nữ) nghiêng về nghĩa thứ hai nên dịch `người nữ khốn khổ`; tiền lệ trong tầng chỉ có nghĩa `khổ hạnh` cho các dạng tapassī, nên đây là lựa chọn có chủ ý và cần xem lại.
  (3) `:10.1` `pāṇakoṭīhi`: hiểu là `hàng chục triệu sinh linh`; không dò được bản đối chiếu độc lập.
  (4) `:1.3` `bhaginī` dịch `chị em gái` (Pāli không nói chị hay em), theo tiền lệ của tầng (`chị em gái` ở mil, sn, ja).
  (5) `:8.4` `tidase pure` dịch `thành của chư thiên Tidasa`; Tidasa thường được đồng hoá với chư thiên Ba Mươi Ba nhưng bản dịch không nêu thêm điều đó, tránh đưa nội dung ngoài Pāli.
  (6) `:5.1–5.2` Pāli đặt nháy đơn đóng ngay sau `anācārā`, còn `jinasāsanadūsikā` đứng ngoài nháy nhưng đồng cách với câu mắng; giữ nguyên nhịp nháy của Pāli, và `vesikā` dịch `gái điếm` để khác với `gaṇikā` dịch `kỹ nữ` ở `:7.2`.
  (7) `:9.1` `Pacchime bhave sampatte`: tiền lệ duy nhất (tha-ap21:7.3) dịch `Khi đã thành tựu trong đời sau,`; bản này dịch `Khi đời sống cuối cùng đã đến,` vì `pacchima` là cuối cùng, và bhava ở đây là kiếp sống. Đây là 1/17 khoá có Pāli trùng mà Việt khác tiền lệ, có chủ ý.
  (8) `:13.4` `buddhaseṭṭhassa vāhasā` dịch `nhờ vào bậc Phật tối thượng`; không có tiền lệ cho nguyên cụm; `vāhasā` được hiểu là `nhờ vào` theo tiền lệ `tassa kammassa vāhasā` (`nhờ vào quả phước của nghiệp ấy`), và `buddhaseṭṭha` hiểu là bậc Phật tối thượng.
