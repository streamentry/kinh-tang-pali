notes: |-
  Bản dịch phủ đủ 28/28 khoá Pāli, thứ tự khoá y hệt Pāli gốc (`pali.pal('kn','tha-ap170')`).

  **Pāli trùng nguyên văn, dùng lại nguyên văn bản dịch** (chỉ mục Pāli→Việt dựng trên toàn
  tầng `content/translation/vi/project/`, 5.407 tệp Việt / 156.518 khoá Việt):
  - `Therāpadāna ` → `Therāpadāna` — 379 cặp cùng bản Việt, 9 cặp dùng `Trưởng Lão Ký Sự`.
  - `Supāricariyavagga ` → `Phẩm Phục Vụ Tốt` — 6/7 (bài đã có trong phẩm: tha-ap163, 165–169;
    tha-ap164 mới hơn dùng `Phẩm Supāricariya`). Đây là cùng phẩm nên theo 6/7.
  - `Catunnavutito kappe, ` → `Vào chín mươi tư kiếp trước đây,` — 40/95, nhóm lớn nhất;
    kế tiếp là `Vào chín mươi tư đại kiếp trước,` 13 và `Vào chín mươi tư kiếp trước,` 12.
  - `Duggatiṁ nābhijānāmi, ` → `Ta không biết mình rơi vào khổ đau,` — 124/349, nhóm lớn
    nhất; nhóm kế tiếp là `Tôi không còn biết đến đọa xứ nào,` 66 và
    `Tôi không còn biết đến khổ xứ,` 51. Chọn 124 vì luật Pāli trùng yêu cầu dùng lại nguyên
    văn bản đã có, và `khổ đau` vẫn là một cách dịch hợp lệ của `duggati`.
  - `Sattasaṭṭhimhito kappe, ` → `Vào sáu mươi bảy kiếp trước,` — 2/3 (tha-ap169:4.1,
    tha-ap290:4.1); tha-ap279:3.1 dùng `Vào kiếp thứ sáu mươi bảy,`.
  - `vehāsaṁ nabhamuggami. ` → `rồi bay vút lên bầu trời.` — 2/2.
  - `yaṁ dussamadadiṁ tadā; ` → có **1** cặp (tha-ap95:3.2) `khi tôi dâng cúng tấm vải ấy;`.
    Tôi dùng `ta` thay `tôi` để khớp `Ta` ở 4.3 ngay câu kế, vì cả hai đều là ngôi thứ nhất
    và trộn hai đại từ trong một câu kệ sẽ vỡ nhịp; ghi rõ ở đây là cố ý đổi, không phải
    lỗi so với tiền lệ.
  - `dussadānassidaṁ phalaṁ. ` → `đây là quả báo của việc cúng dường y.` — 1/1.
  - `Paṭisambhidā catasso, ` → `Bốn vô ngại giải,` — 396 cặp, chỉ 1 biến thể.
  - `…pe… ` → `…` — 665/665, đúng một dấu lược, không mở rộng.
  - `kataṁ buddhassa sāsanaṁ”. ` → `đã làm tròn lời dạy của Đức Phật”.` — 363/396.
  - `Itthaṁ sudaṁ … abhāsitthāti` → `Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ
    này.` — 421/453 (đếm bằng script trên toàn tầng; thêm 1 cặp rơi vào cách khác). Khoá `:7.1` đã có sẵn trên đĩa đúng nhóm này nên giữ nguyên.
  Tổng cộp 11 khoá dùng lại nguyên văn từ tiền lệ đếm được, 1 khoá đổi có chủ ý (4.2).

  **Không có tiền lệ cùng Pāli, tự dịch từ chữ nghĩa:** `pure ramme` (1.1),
  `rājaputtosahaṁ tadā` (1.2), `Paṇṇākāraṁ labhitvāna` (1.3), `upasantassadāsahaṁ` (1.4),
  `Adhivāsesi` (2.1), `vatthaṁ hatthena āmasi` (2.2), `Siddhattho adhivāsetvā` (2.3),
  `Buddhassa gacchamānassa / dussā dhāvanti pacchato` (3.1–3.2), `Tattha cittaṁ pasādesiṁ`
  (3.3), `buddho no aggapuggalo` (3.4), `cakkavattī tadā ahuṁ` (5.2), `Parisuddhoti nāmena`
  (5.3), `manujindo mahabbalo` (5.4).

  **Bất định, ghi ở đây chứ không giải thích trong thân kinh:**
  - `Tivarāyaṁ pure ramme,` (1.1) — chỗ khó nhất của bài. `Tivarāyaṁ` có hai tiền lệ cùng
    dạng: `“Tivarāyaṁ nivāsīhaṁ,` → `“Khi tôi sống tại kinh thành Tivarā,` (tha-ap105:1.1)
    và `tivarāyaṁ puruttame;` → `ở kinh thành Tivarā tối thượng;` (tha-ap242:1.2), nên dịch
    `Ở kinh thành Tivarā`. Còn `pure ramme` thì **không có tiền lệ nào**: cặp duy nhất
    `“Tivarāyaṁ pure ramme,` (tha-ap236:1.1) dịch `“Ở kinh đô Tivarā xinh đẹp,` — bỏ hẳn
    `pure` và đọc `ramme` như `xinh đẹp`. Tôi không theo cách bỏ chữ ấy; đọc `pure` là
    `trước kia` và `ramme` là tên vùng Ramme, dịch `trước kia ở nước Ramme`, và **ghi rõ là
    chưa phân xử được**: `ramme` cũng có thể là tính từ `ramma` = `đẹp`, và câu còn có thể
    nghĩa là thành Tivarā trước kia mang tên khác. Khi có chú giải Pāli sẽ quyết được.
  - `upasantassadāsahaṁ.` (1.4) — `upasantassa` là cách gọi Đức Thế Tôn (`bậc Tôn quý`,
    `bậc Đã Tỏ Ra`), không phải `bhagavā` như ở 2.1; dịch `Đức Thế Tôn` cho nhất quán về xưng
    hô trong cùng bài, đã ghi ở đây là chọn lựa.
  - `Siddhattho adhivāsetvā, vehāsaṁ nabhamuggami.` (2.3–2.4) — chủ ngữ không nêu. Đọc là
    vị trưởng lão: Đức Thế Tôn đã nhận lấy chỗ ngồi (2.1) nên ý ông đã thành, ông an tọa
    rồi bay vút lên trời; dịch `Đã được như ý, ông an tọa,`. Có thể đọc ngược lại là Đức Thế
    Tôn thì câu vẫn dịch được, nên đây là bất định về ngôi chứ không đổi nghĩa giáo nghĩa.
  - `dussā dhāvanti pacchato` (3.2) — chủ ngữ là `dussa` (những tấm vải), `pacchato` =
    phía sau; nghĩa là vải bay theo sau Đức Phật đang đi (thần thông của vị trưởng lão, vì
    câu 4.2 nói chính ông dâng vải 94 kiếp trước), dịch `những tấm vải chạy theo phía sau`.
  - `manujindo mahabbalo.` (5.4) — `manujinda` (chúa tể loài người) và `mahabbala` (có uy
    lực lớn) đều **0 tiền lệ** trong tầng; dựa trên `mahabbalo` ở `cakkavattī mahabbalo.`
    mà nhóm đa số dịch `có đại thần lực` (38/92) hoặc `có đại oai lực` (11/92), chọn
    `có đại oai lực`. Ghi ở đây vì đây là dịch từ chữ nghĩa chứ không phải dùng lại tiền lệ.
  - `Paṇṇākāraṁ labhitvāna` (1.3) — `paṇṇākāra` là cách/điều kiện thuận lợi, dịch `dịp
    thuận tiện`; không có tiền lệ cùng chữ.

  **Mệt hồi `ti` — đo ở phạm vi gần nhất rồi mới nới.** Trong cùng phẩm `tha-ap` có **0** khoá
  Pāli mang mệt hồi `ti` (đếm bằng script trên 5.407 tệp Việt), nên không đo được tỉ lệ tại
  chỗ; đo ở toàn tầng cho **22.682** khoá Pāli có `ti`: bản Việt **giữ** dấu ở **4** khoá,
  **bỏ** ở **22.678** khoá. Phe bỏ thắng tuyệt đối; kệ của bài này vốn không có `ti` nên không
  dính vào lựa chọn nào.

