notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja404 tại commit đã ghim, `vietnamese-current` tại commit đã ghim vắng với Jātaka.
  Pāli trùng nguyên văn: 3 khoá, dùng lại nguyên văn cả 3 — `:1.2` và `:1.3` theo ja103:1.2–1.3 (bậc trí không nên ở nơi ấy; dù chỉ một đêm hay hai đêm), `:6.3` và `:6.4` theo thag6.12:3.1–3.2 (Người ấy hành động vì lợi ích của cả hai; cho chính bản thân mình và cho cả người khác). Ngoài ra `:1.1` chỉ khác ja103:1.1 một chữ (nivasati so với nivisati) nên cũng dùng lại nguyên văn cho cả câu kệ.
  Bất định ghi rõ: `tidasānaṁva vāsavo` ở `:5.4` dịch theo nghĩa chữ là như gió tháng ba, không diễn giải thêm vì hình ảnh gió tháng ba ở đây không có tác giả nào giải thích trong tầng; `lahucittassa` ở `:2.1` dịch là kẻ nông dại; `parihārako` ở `:3.2` và `:4.2` là làm tổn hại, còn ở `:5.2` là làm người gìn giữ — giữ đúng sắc thái hai nghĩa của cùng một từ.
  Tên phẩm Sattakanipāta → Bộ Bảy Bài Kệ, Kukkuvagga → Phẩm Kukku, xem ghi chú chung của lát ở ja396. `verī` → kẻ thù, `yūtha` → bầy, `sakuṇa` → chim đều có tiền lệ ở tầng.
  Cổng kỹ thuật chưa chạy vì agent dịch không được chạy lệnh npm. Coordinator chạy bốn lệnh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code), kiểm lại từng khoá bằng Pāli đã ghim, PED và các bài Jātaka cùng công thức): sửa 21 khoá. Lỗi nghĩa thật: `diso` ở `:2.1` là kẻ thù (PED: diso, J iii.357), `anayo` ở `:2.4` là tai họa; `:3.1–3.4` là kẻ ngu tự cho mình khôn, đi theo ý tâm riêng, sẽ nằm xuống như con khỉ (bản cũ dịch số nhiều và `sacittassa vasaṁ gantvā` thành rơi vào tay kẻ bắt); `parihārako` ở `:3.2` và `:4.2` là người hộ vệ của bầy (không phải làm tổn hại — cùng một từ với `:5.2`); `cetako` ở `:4.4` là chim mồi (PED: cetaka, J iii.357), không phải mèo; `vāsavo` ở `:5.4` là Vāsava đối với ba mươi vị trời (tidasa), không phải gió tháng ba; `:6.2` là thấy nơi chính mình có giới, tuệ và sự học rộng; `:7.1–7.2` là tự cân nhắc bản thân về giới, tuệ, học rộng; `:7.4` là hoặc đi một mình. Còn bất định: `sīlapaññāsutāmiva` ở `:7.2` đọc như đối cách của giới-tuệ-học (`iva` không dịch riêng); `:2.1–2.2` đọc `diso` là chủ ngữ ẩn của kệ. Điểm: semantic_fidelity và grammar_logic hạ về mức bản đã sửa vì bản cũ sai nặng ở hơn một nửa số khoá kệ.

  Quyết định hội đồng biên tập 2026-10-16: C1 — `0.4`, `8.1` và translationTitle (tiêu đề giữ "Kinh X", bỏ đuôi "jātaka" hoặc "Chuyện Tiền Thân"; cùng tên Pāli thì cùng tên Việt); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
