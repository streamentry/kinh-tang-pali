notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Không khoá nào có …pe…; nháy kép mở ở 1.1 và đóng ở 1.4 đúng Pāli.

  Tiền lệ có đếm và dùng lại: Atthakāmavagga → Phẩm Mong Muốn Lợi Ích (9 ở ja41-ja49, không có cách dịch nào khác trong tầng, nên theo đa số tuy danh sách xung đột đang treo có ghi tên mục này); Jātaka → Jātaka (234), Ekakanipāta → Bộ Một Bài Kinh (296); Atthakāmavaggo pañcamo → Phẩm Mong Muốn Lợi Ích, thứ năm. Uddāna giữ tên Pāli nguyên văn, chỉ dịch vế nối mà Pāli thật sự có: Atha → Rồi tới, Tathā → rồi tới, ca puna → rồi nữa, dasāti → mười bài ấy. Một lượt review tự bắt được lỗi: bản nháp đầu để chữ Tathā nguyên văn ở 4.4 trong khi 4.2 đã dịch Tathā thành rồi tới, lệch nhịp trong cùng một tục lược; đã sửa 4.4 thành rồi tới Tāraka, Yaññavarena — mười bài ấy.

  0 tiền lệ, đặt mới: dummedha → kẻ ngu dốt; yaj → hiến tế; adhammika jana → kẻ phi pháp (phi pháp có 187 tiền lệ nên chỉ phần dummedha là mới). Paṭhamo paṇṇāsako → Quyển thứ nhất trong bộ năm mươi, cùng công thức với Majjhimo paṇṇāsako ở ja100.

  Kệ 1.1-1.4 giữ đủ hai vế của từng câu kệ: Dummedhānaṁ sahassena / yañño me upayācito → Ta đã dự định hiến tế, cả ngàn kẻ ngu dốt; Idāni khohaṁ yajissāmi / bahu adhammiko jano → giờ ta sẽ hiến tế nữa, cho đông đảo kẻ phi pháp. Chủ thể Ta của cả bốn vế được giữ, không đổi thành khái quát.

  Triangulation: có English Sujato đủ 16/16 khoá tại .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/ja50; khuôn câu kệ đã đối chiếu tay. Anh Sujato để trống tục lược và các lời kết nên ở 4.1-4.4 chỉ có Pāli và tiền lệ Việt để căn cứ. Không chạy được npm run validate|test|check|build theo lệnh phân công đợt này nên technical_integrity là 9.6.
