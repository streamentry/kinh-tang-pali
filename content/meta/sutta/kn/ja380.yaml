notes: |-
  Bài kệ ngắn: theo đúng công thức `source/layers.yaml` (≥ 40 ký tự, loại block `:0`) **mẫu số bằng 0**, nên coverage không đo được cho bài này — đã tự quét MỌI khoá từ đĩa thay vì tin ngưỡng.
  **10 khoá có Pāli trùng nguyên văn ở bài khác; 8 cặp dùng lại NGUYÊN VĂN (6 nguyên văn byte-for-byte, 2 chỉ chỉnh dấu câu).** `0.1` trùng `ja183:0.1` (*Jātaka*) · `0.3` trùng `ja379:0.3` (*Phẩm Avāriya*) · `2.4`/`3.6` trùng byte-for-byte `ja330:3.2` (*mong cầu có kết quả cũng đem lại an lạc*) · `6.1` trùng byte-for-byte `sn1.35:3.1` · `6.2` trùng byte-for-byte `sn1.35:3.2`.
  **Hai khoá trùng Pāli nhưng bị loại có lý do — ghi lại để người đọc lại không tưởng là bỏ sót:** (1) `0.2` trùng `thag6.9:0.2` (*Trưởng Lão Kệ Nhóm Sáu*) nhưng đó là bài khác; đo trên **giá trị Pāli tuyệt đối** `Chakkanipāta` cho 15/15 file trong lớp `ja` đều *Bộ Sáu Bài Kệ*, nên theo số đo. (2) `5.2` trùng `snp2.3:2.2` nhưng nghĩa khác hẳn (ở `snp2.3` nói về lời nói không đi kèm hành động; ở đây `yo mittesu pakubbati` là *lại nói với bạn bè*), nên dịch mới.
  **Tên tầng đo, không đoán:** `0.1` → *Jātaka* (381/397 file `ja`) · `0.2` *Chakkanipāta* → *Bộ Sáu Bài Kệ* (15/15) · `0.3` *Avāriyavagga* → *Phẩm Avāriya* (6 file: ja376–ja381) · `0.4` giữ mẫu *N. Kinh <tên Pāli>* như ja376/ja406/ja424. `rāja` → **vua** (96 lần) chứ không phải *đại vương* (13 lần) trong lớp `ja`.
  **Bất định chưa phân xử được, đã ghi thay vì bịa:** (1) `4.3` `Mālā sereyyakasseva` — `Mālā` có thể là tên một loài dây leo, `sereyyaka` là một loài chuột sóc; tôi giữ *Mālā* nguyên Pāli và dịch `sereyyaka` thành *con sóc chuột*, không khẳng định `Mālā` là gì. (2) `7.4` `vajāmahaṁ` = *ta sẽ đi vào nơi của ta*; tôi dịch theo nghĩa chữ, Sujato lược thành *let me go* nên không có gì để đối chiếu. (3) `8.1`–`8.4` `Etadeva hi me nāmaṁ / … Pitaraṁ āmantayāmahan` — không rõ đây là lời vị thiên đáp lại hay lời của chính cây leo; tôi giữ mạch đối thoại như Pāli, không chú thích trong thân kinh.
  **Lỗi bắt được ở lượt review đối kháng, đã sửa:** (1) `6.1` bản nháp có dấu nháy kép mở trong khi Pāli không có (`“` chỉ mở ở `1.1` và `4.1`, đóng ở `3.6` và `7.4`) — đã bỏ, nếu không sẽ hỏng `ngoặc kép không cân trên cả bài`. (2) `5.4` `sandhi tenassa jīrati` bản nháp dịch *nhạc nhòa*, sai nghĩa (`jīrati` = bị gặm nhấm/hủy hoại); đã sửa thành *danh dự của hắn ấy bị gặm nhấm*.
