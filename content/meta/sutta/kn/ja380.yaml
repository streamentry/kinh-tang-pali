notes: |-
  Bài kệ ngắn: theo đúng công thức `source/layers.yaml` (≥ 40 ký tự, loại block `:0`) **mẫu số bằng 0**, nên coverage không đo được cho bài này — đã tự quét MỌI khoá từ đĩa thay vì tin ngưỡng.
  **10 khoá có Pāli trùng nguyên văn ở bài khác; 8 cặp dùng lại NGUYÊN VĂN (6 nguyên văn byte-for-byte, 2 chỉ chỉnh dấu câu).** `0.1` trùng `ja183:0.1` (*Jātaka*) · `0.3` trùng `ja379:0.3` (*Phẩm Avāriya*) · `2.4`/`3.6` trùng byte-for-byte `ja330:3.2` (*mong cầu có kết quả cũng đem lại an lạc*) · `6.1` trùng byte-for-byte `sn1.35:3.1` · `6.2` trùng byte-for-byte `sn1.35:3.2`.
  **Hai khoá trùng Pāli nhưng bị loại có lý do — ghi lại để người đọc lại không tưởng là bỏ sót:** (1) `0.2` trùng `thag6.9:0.2` (*Trưởng Lão Kệ Nhóm Sáu*) nhưng đó là bài khác; đo trên **giá trị Pāli tuyệt đối** `Chakkanipāta` cho 15/15 file trong lớp `ja` đều *Bộ Sáu Bài Kệ*, nên theo số đo. (2) `5.2` trùng `snp2.3:2.2` nhưng nghĩa khác hẳn (ở `snp2.3` nói về lời nói không đi kèm hành động; ở đây `yo mittesu pakubbati` là *lại nói với bạn bè*), nên dịch mới.
  **Tên tầng đo, không đoán:** `0.1` → *Jātaka* (381/397 file `ja`) · `0.2` *Chakkanipāta* → *Bộ Sáu Bài Kệ* (15/15) · `0.3` *Avāriyavagga* → *Phẩm Avāriya* (6 file: ja376–ja381) · `0.4` giữ mẫu *N. Kinh <tên Pāli>* như ja376/ja406/ja424. `rāja` → **vua** (96 lần) chứ không phải *đại vương* (13 lần) trong lớp `ja`.
  **Bất định chưa phân xử được, đã ghi thay vì bịa:** (1) `4.3` `Mālā sereyyakasseva` — `Mālā` có thể là tên một loài dây leo, `sereyyaka` là một loài chuột sóc; tôi giữ *Mālā* nguyên Pāli và dịch `sereyyaka` thành *con sóc chuột*, không khẳng định `Mālā` là gì. (2) `7.4` `vajāmahaṁ` = *ta sẽ đi vào nơi của ta*; tôi dịch theo nghĩa chữ, Sujato lược thành *let me go* nên không có gì để đối chiếu. (3) `8.1`–`8.4` `Etadeva hi me nāmaṁ / … Pitaraṁ āmantayāmahan` — không rõ đây là lời vị thiên đáp lại hay lời của chính cây leo; tôi giữ mạch đối thoại như Pāli, không chú thích trong thân kinh.
  **Lỗi bắt được ở lượt review đối kháng, đã sửa:** (1) `6.1` bản nháp có dấu nháy kép mở trong khi Pāli không có (`“` chỉ mở ở `1.1` và `4.1`, đóng ở `3.6` và `7.4`) — đã bỏ, nếu không sẽ hỏng `ngoặc kép không cân trên cả bài`. (2) `5.4` `sandhi tenassa jīrati` bản nháp dịch *nhạc nhòa*, sai nghĩa (`jīrati` = bị gặm nhấm/hủy hoại); đã sửa thành *danh dự của hắn ấy bị gặm nhấm*.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.

  Sửa lan 2026-10-13 (accuracy fix; 1.1–5.4, 7.1–8.4 đổi; 0.x, 6.1–6.4 và 9.1 giữ nguyên). Mục này THAY «Bất định» (1)–(3) và các lập luận cũ về 2.4/3.6, 4.3 («sóc chuột»), 5.4 («gặm nhấm»), 7.4 và 8.1–8.4 ở trên. Trước → sau: 1.1–1.4 → dùng lại nguyên văn tha-ap8:65.1–65.4 (Pāli trùng byte-for-byte): «Có dây leo tên là Āsāvatī, / mọc ở rừng Cittalatā; / Cứ một ngàn năm, / nó mới sinh ra một trái» (trước: «mọc lên giữa rừng cây lá», «Trải qua hàng nghìn mùa mưa»; vassasahassena = một ngàn năm, 1 × 1.000, không phải «hàng nghìn»; Cittalatāvana là tên rừng); 2.1–2.2 → «Chư thiên hầu cận nó, / dù quả của nó ở xa đến thế» (tha-ap8:66.1–66.2); 2.3 «Hỡi vua, mong ngươi trổ quả» → «Tâu vua, ngài hãy cứ hy vọng» (āsīseva = hãy cứ hy vọng; không có «trổ quả»); 2.4/3.6 «mong cầu có kết quả cũng đem lại an lạc» → «hy vọng có kết quả là điều an lạc» (chữ «cũng» không có trong Pāli; ja330:3.2 cùng Pāli còn «cũng», ngoài phạm vi); 3.1–3.4 «con người kia… giữ cho tới khi điều ấy còn xa» → «Con chim ấy cứ hy vọng, / loài chim ấy cứ hy vọng; / và hy vọng của nó được thành tựu, / dù đã xa vời đến thế» (dijo = chim, như ja275:2.2, không phải «con người»); 4.1–4.4 «Lời nói ấy đã chạm tới ta… Điều này giống như Mālā với con sóc chuột» → «Bằng lời nói thì làm ta hài lòng, / nhưng bằng việc làm thì không; / như vòng hoa sereyyaka, / có màu sắc mà không có hương» (sereyyaka là loài hoa, đúng như tha-ap123:3.1 «hoa sereyyaka»; mālā = vòng hoa, không phải «Mālā» tên riêng; không có «con sóc chuột»); 5.1–5.4 «Lời nói không quả mà ngọt ngào, lại nói với bạn bè, cúng dường không cho, không ban phát, danh dự của hắn ấy bị gặm nhấm» → «Lời ngọt ngào không có quả, / kẻ nào dành cho bạn bè; / không cho đi, không san sẻ của cải, / thì tình bạn của kẻ ấy do đó mà mục nát» (sandhi = tình bạn, mối giao hảo; jīrati = mục nát, hao mòn; bhogaṁ = của cải, không phải «cúng dường»); 7.1–7.4 «Có lẽ sức lớn của ta đã cạn kiệt, và không còn thấy được lối ra; sợ rằng cả khoảng không gian nơi sinh sẽ ngăn chặn, thôi, giờ ta hãy đi vào nơi của ta» → «Lực lượng của ta quả thật đã hao mòn, / lương thực đi đường cũng không còn; / ta e ngại cho mạng sống bị tổn hại, / thôi, giờ ta xin đi đây» (pātheyyaṁ = lương thực đi đường, dhp235:4, ja516:29.4; pāṇūparodhāya = tổn hại mạng sống; vajāmahaṁ = ta đi, không phải «đi vào nơi của ta»); 8.1–8.4 «Chính điều ấy là tên của ta, bất cứ tên nào ta mang, hỡi bậc thiên tượng; Hỡi vua, hãy đến đây, hãy đến thăm viếng Pitara» → «Chính đó là tên của tôi, / cái tên mà tôi mang, hỡi bậc chiến xa đệ nhất; / Xin hãy khoan, tâu đại vương, / để tôi thưa với cha tôi» (āgamehi = hãy khoan, như ja482:5.1; rathesabha = bậc chiến xa đệ nhất, 41/51 khoá có rathesabha trong tầng dịch hiện có; pitaraṁ là «cha» (đối cách), không phải tên riêng «Pitara»; āmantayāmi = thưa với, như dn19:47.6). Ai nói với ai, suy từ truyện dẫn (bản Anh Jātaka tập III, Francis–Neil 1897, chỉ để biết người nói): 1–3 và 8 là lời Āsaṅkā, 4–7 là lời vua. Bất định, không đưa vào thân kinh: (a) sampesi (4.1) đọc «làm hài lòng» theo mạch truyện, chủ ngữ để trống như Pāli; (b) balaṁ (7.1) dịch «lực lượng» (có thể là quân hoặc sức); (c) yaṁ nāmasmi (8.2) đọc «cái tên mà tôi mang». Số Pāli: 1.000 năm (vassasahassa). Pāli trùng nội bộ: 2.3 = 3.5, 2.4 = 3.6, cả hai cặp cùng một bản Việt (trừ dấu nháy đóng ở 3.6 theo Pāli). Tiêu đề 0.4/9.1 «Kinh Āsaṅkajātaka» (đuôi jātaka thừa so với mẫu «Kinh <tên>») để nguyên, ngoài phạm vi. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại; technical_integrity giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: C1 — `0.4`, `9.1` và translationTitle (tiêu đề giữ "Kinh X", bỏ đuôi "jātaka" hoặc "Chuyện Tiền Thân"; cùng tên Pāli thì cùng tên Việt); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
