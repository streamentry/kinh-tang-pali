notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv39_root-pli-ms.json` (102/102 khoá, đủ và đúng thứ tự Pāli). Tên bài lấy từ nhãn Pāli `Revatīpetavatthu` (Chuyện Ngạ Quỷ Revatī). Bài thuộc Đại Phẩm (Mahāvagga), bài thứ tư.

  - Tầng tham khảo và coverage English:
    Tầng `english-sujato` không có pv39; `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage = 0: khoá Pāli dài nhất của bài là 36 ký tự, không khoá nào đạt ngưỡng 40 ký tự, nên cổng coverage không đo được gì và KHÔNG được trích ra làm bằng chứng đã có tầng tham khảo. Thứ chặn bài là việc ba tầng tham khảo đều vắng. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài và tiền lệ cùng bộ, nên `triangulation` đặt 7.0.
  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” và `0.2` “Đại Phẩm” theo pv40–pv51 (cùng phẩm). `0.3` theo khuôn “N. Chuyện Ngạ Quỷ …” của pv40, pv41, pv43; `24.1` theo khuôn “Chuyện ngạ quỷ …, thứ N.” của pv43, pv44, pv46–pv50.
  - Cấu trúc người nói (Pāli không nêu tên người nói; không thêm vào thân kinh):
    + Kệ 1 (và lời mở `2`) là hai sứ giả của Yama nói với Revatī. Kệ 3–4 là câu hỏi về cung điện; kệ 5–6 trả lời (cung điện của Nandiya); kệ 7 là Revatī nói; kệ 8, 10, 12–14, 16 là lời hai dạ-xoa; kệ 9, 11, 15, 17–21 là Revatī; kệ 22 là lời kể; kệ 23 là Revatī tự thuật. Các cặp ngoặc kép trong bản dịch khớp từng khoá với Pāli: Pāli mở “ ở `12.1`, `14.4` đóng; ‘…’ mở ở `17.3` và đóng ở `17.6`; “ mở ở `17.1` chỉ đóng ở `21.4`.
  - Số Pāli — tự tính:
    + `sataporiso` (10.2, 11.4, 13.2) = sata 100 + porisa (tầm người) → “sâu một trăm tầm người” (tầng dùng “tầm người” 19 lần, vd dn17:1.5.3 “ba tầm người”).
    + `vassasahassāni` (10.3, 13.3) = sahassa 1000, số nhiều → “hàng ngàn năm”, không ghi một con số cụ thể vì Pāli không nêu số lượng.
    + `Cātuddasiṁ pañcadasiṁ` (20.1) = mười bốn, mười lăm; `aṭṭhamī` (20.2) = thứ tám; `aṭṭhaṅga` (20.4) = tám chi phần; `catutthaṁ` (24.1) = thứ tư, khớp số `4.` ở `0.3`; `dve yakkhā` (2.2) = hai dạ-xoa; `paccekabāhāsu` (2.3) = mỗi vị một cánh tay. Không còn số nào khác.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + Pāli trùng nguyên văn với bài khác: đã dò 20 khoá có Pāli trùng (240 cặp Pāli↔Việt, kể cả `0.1`, `0.2`); dùng lại nguyên văn hoặc gần nguyên văn ở các khoá sau: `0.1`, `0.2`, `11.1`–`11.2` (pv6, pv19, pv44, pv45: “Điều ác gì là do thân, do lời nói, / do ý mà đã làm”), `12.2` (sn3.21: “hay những kẻ ăn xin khác”), `19.2` (sn3.24 và pv19: “lối đi tại những chốn gian nan” → bản này “làm những lối đi ở chốn gian nan”), `19.4` (pv10:10.4, tha-ap220:4.4, tha-ap445:3.4: “với tâm hoàn toàn tịnh tín”), `20.1`–`20.4` (vv15, vv19, vv22–25, vv37: “tuần lễ thần biến”, “tám chi phần”), `21.1`–`21.2` (vv24: “luôn thu thúc trong các giới”), `18.2` (“được tái sinh làm thân người”, pv45 và ja314; pv35, pv50 dịch “sinh ra làm người”). Cố ý khác tiền lệ: `7.2` (pv29 dịch “là nữ chủ làm chủ cả gia đình”; bản này “bà chủ trong nhà, là chủ của cả gia tộc” vì `agārinī` = người làm chủ việc nhà và `kula` = dòng họ), `18.3` (pv45, pv50 dịch `vadaññū` là “dù bị chê bai” / “tự mình quở trách” — lệch Pāli; tầng an4.53, an5.36, an8.49 dịch “hào phóng”, bản này theo “hào phóng”), `12.1` (ja468 “Cả với sa-môn lẫn bà-la-môn” là câu khác nghĩa), `15.4`/`18.6` (`saṁyama` → “tự chế”, `dama` → “điều phục”; tầng còn dịch “thu thúc”, “tiết chế”).
    + Trong chính bài có 10 cặp Pāli trùng nguyên văn (không tính dấu câu): `3.4`=`5.4`, `4.1`=`6.1`, `4.2`=`6.2`, `4.3`=`6.3`, `8.3`=`17.5`, `10.2`=`13.2`, `10.4`=`13.4` (chỉ khác `”ti`), `15.2`=`18.4` (`kāhāmi kusalaṁ bahuṁ`), `15.3`=`18.5`, `15.4`=`18.6`; cả 10 cặp dùng cùng một câu Việt (chỉ khác chữ hoa đầu câu ở `8.3`/`17.5`, vì `8.3` mở câu mới còn `17.5` nằm giữa câu). Hai chỗ Pāli gần trùng nhưng khác từ nên Việt khác: `3.3` `Kassetam…` (“của ai”) với `5.3` `Tassetam…` (“của người ấy”); `10.3`/`13.3` `Yattha`/`Tattha` (cùng nghĩa “ở đó”), và `11.3`/`13.1` `Kena`/`Tena` (“vì lẽ gì”/“do đó”).
    + `maccharī` → “keo kiệt” (tầng 319 lần “keo kiệt” so với 44 “xan tham”; an10.84 và an3.10 dịch “keo kiệt”); `amaccharī` (5.2) → “không keo kiệt”. `rosaka` (8.3, 17.5) → “hay cáu giận” (không có tiền lệ trực tiếp; pv43–pv44 dịch từ khác `paribhāsaka`).
    + `pāpadhamma` / `supāpadhamma` → “có hạnh ác” / “có hạnh rất ác” (an3.99 “có hạnh ác”; tầng cũng dịch “kẻ làm điều ác” ở an4.109).
    + `yakkha` → “dạ-xoa” (tầng 67 lần chữ thường “dạ-xoa” và 188 lần “Dạ-xoa” viết hoa ở vị trí đầu câu hoặc tên riêng; giữa câu dùng chữ thường).
    + `byamha` (3.2) → “lâu đài” (tầng 55 lần), `vimāna` → “cung điện” (tầng 142 lần).
    + `pamajjitvā` (16.1) và `pamajjissaṁ` (21.3) → “buông lung” (tầng 216 lần; “phóng dật” 859 lần chủ yếu cho `pamāda` danh từ); chọn “buông lung” cho động từ để người đọc hiện đại hiểu ngay.
    + `nikkhittadaṇḍa` (17.3) → “đã đặt gậy xuống” (ja484:15.3).
    + `papā`, `udapāna` (19.3) → “trạm nước uống”, “giếng nước”, theo pv19 và sn1.47.
    + `yamassa dūtā` (2.1) → “các sứ giả của Yama” (tầng dùng “sứ giả” 58 lần; “Yama” 120 lần).
  - Bất định đã ghi (không thêm vào thân kinh):
    + `1.2` `Apārutadvāre adānasīle`: `apāruta` = “không bị che đóng, mở”; đọc là cửa nhà (của Nandiya) vẫn mở rộng nhưng người vợ không có thói quen bố thí, nên dịch “cửa nhà không đóng mà chẳng có thói quen bố thí”. Có thể có cách đọc khác (cửa đóng đối với việc bố thí); chưa có bản Anh độc lập để đối chiếu, nên giữ sát nghĩa chữ.
    + `3.2` `byamhaṁ` đi với `vimānaṁ` ở `3.3`: dịch “lâu đài” rồi “cung điện” để giữ hai từ Pāli phân biệt.
    + `10.1` `saṁsavaka`: giữ nguyên Pāli như tên của hố/địa ngục; tầng chưa có tiền lệ dịch nghĩa.
    + `10.4`, `13.4` `paccasi`, `14.1`–`14.4` `chindanti … khādanti`: Pāli đều ở thì hiện tại; `paccasi` đi với “hàng ngàn năm” và Revatī chưa vào địa ngục nên dịch “sẽ bị nung nấu”; các động từ ở kệ 14 để thì hiện tại (mô tả tình cảnh ở nơi ấy). Chủ ngữ của `chindanti` không được nêu trong Pāli nên dịch “họ”.
    + `20.3` `Pāṭihāriyapakkhañca`: theo nhất quán với 9 khoá cùng Pāli ở tầng, dịch “tuần lễ thần biến”; nghĩa kỹ thuật chính xác của `pāṭihāriyapakkha` chưa được phân xử trong bài này.
    + `17.4` `acchādanaṁ seyya mathannapānaṁ`: đọc là `acchādanaṁ seyyaṁ atha annapānaṁ` (y phục, chỗ nằm, và thức ăn nước uống).
    + `21.4` `sāmaṁ diṭṭham idaṁ mayā`: “điều này chính tôi đã thấy”; Pāli không nói rõ “điều này” chỉ riêng cảnh hiện tại hay toàn bộ nghiệp quả vừa được nói.
  - Dấu lược: bài này không có `…` hay `(…)` ở Pāli, nên bản Việt cũng không có; không phát sinh chính sách dấu lược.
  - Kiểm tra tự động: tập khoá Việt = tập khoá Pāli (102/102, đúng thứ tự); nháy đơn và nháy kép khớp Pāli từng khoá (0/102 lệch); 0 khoá rỗng; chuẩn NFC.
  - technical_integrity đặt 9.6: không chạy được `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này; cần chạy đủ bốn lệnh này (cùng `npm run reference:gaps`) trước khi gộp. Không tuyên bố technical gate đã pass.

  Lượt cải thiện 2026-10-11 (đọc đối kháng lại cả 102 cặp Pāli↔Việt; sửa 5/102 khoá; không khoá nào sai nghĩa nghiêm trọng). Mục này thay các câu cũ về `1.2`, `4.2`, `6.2`, `7.4`, `19.2` ở trên.
  - Căn cứ mới phát hiện: bài là kệ song song của `vv52` (Chuyện Cung Điện Revatī): 96/99 khoá có nội dung có Pāli trùng nguyên văn một khoá của `vv52`, và lượt đầu đã dùng lại bản Việt của nhau; lượt đầu không nêu quan hệ này. Hai bài cùng một tay dịch của dự án nên không phải cách đọc độc lập, `triangulation` giữ 7.0.
  - Sửa 5 khoá:
    + `19.2` (terminology fix): *và làm những lối đi ở chốn gian nan* → *và làm những lối bắc qua nơi hiểm trở*. Lý do: `saṅkamana` là chỗ bắc qua; các khoá `dugge`/`-dugga` ở tầng (không tính bài này) dịch *hiểm trở* 13/17 khoá, *gian nan* chỉ 2 khoá (`pv19`, `sn3.24`); `pv21:26.4`, `pv21:34.4` và `vv52:21.2` đã dùng *lối bắc qua nơi hiểm trở*. Terminology 9.0 → 9.1.
    + `7.4` (accuracy fix): *tôi không muốn đi thấy địa ngục* → *tôi không muốn thấy địa ngục*. Pāli `na patthaye nirayadassanāya` không có động từ đi; chữ *đi* là thêm và câu gượng; `vv52:9.4` (cùng Pāli, tách từ ghép) đã dịch *tôi không muốn thấy địa ngục*.
    + `1.2` (accuracy fix): *cửa nhà không đóng mà chẳng có thói quen bố thí* → *cửa không đóng, chẳng có thói quen bố thí*. Pāli chỉ nói `apārutadvāre`, không nói *nhà*, cũng không có từ nối nghịch ý *mà*. Cách hiểu *cửa của chính bà* không phải là cách duy nhất: bản Việt nguyên bài ở mục Tra cứu toàn văn đọc đây là cánh cửa địa ngục không bị đóng, và `mn130:18` dùng `dvāra` cho cửa của địa ngục; ngược lại `dn5:11.13` dùng `apārutagharā` cho nhà không cần khoá. Ngữ pháp cho cả hai cách (hô cách giống `supāpadhamme`, `adānasīle`; hoặc định vị cách chỉ hoàn cảnh). Không phân xử được từ Pāli root nên bỏ phần thêm vào, giữ nguyên độ mở của Pāli.
    + `4.2`, `6.2` (accuracy fix, cùng một thay đổi): *đứng hai bên* → *ở hai bên*. `ubhato` chỉ vị trí hai bên; tư thế đứng không có trong Pāli.
    + Semantic fidelity 9.0 → 9.1 vì bốn khoá trên bỏ chi tiết Pāli không có (*nhà*, *đi*, *đứng*, từ nối *mà*). Các điểm khác không đổi vì bất định ở dưới vẫn còn.
  - Hệ quả với `vv52` (không sửa trong lượt này, ngoài phạm vi): sau lượt sửa, 93/96 khoá trùng Pāli với `vv52` còn dùng cùng bản Việt; ba khoá lệch là `1.2` (vv52:3.2), `4.2` (vv52:6.2), `6.2` (vv52:8.2); khoá `19.2` nay khớp `vv52:21.2`. Nếu giữ cách sửa này thì cần sửa ba khoá của `vv52` cùng một lần.
  - Chỗ nghi ngờ nhưng cố ý KHÔNG đổi:
    + `20.3` `pāṭihāriyapakkha` *tuần lễ thần biến*: tầng dịch *tuần lễ thần biến* 12 khoá, *kỳ nửa tháng thần biến* 4 khoá. Bản Anh đã ghim của `sn10.5`, `an3.37` và `thig2.7` dịch là "fortnight of special displays" / "fortnightly special displays", tức `pakkha` là nửa tháng; mà ngay `20.2` `pakkhassa` đã dịch *nửa tháng*. *Tuần lễ* vì vậy có thể là sai đơn vị, nhưng khoảng ngày cụ thể của `pāṭihāriyapakkha` chưa phân xử được và đổi một mình bài này sẽ lệch 12+ khoá khác; cần đổi cả tầng cùng lúc nếu người biên tập quyết định. Bất định giữ nguyên, không nâng điểm.
    + `8.3`, `17.5` `rosako` *hay cáu giận*: ghi chú cũ nói không có tiền lệ trực tiếp là sai; `ja470:18.2` và `ja535:18.2` (cùng cụm `maccharī rosako pāpadhammo`) dịch *hay nổi giận*, `sn3.21:11.4` dịch *hung ác*. Hai dạng *cáu giận* / *nổi giận* gần nghĩa, `vv52` dùng *cáu giận*; không đổi để khỏi lệch thêm.
    + `23.2` `paribhāsikā` *hay mắng nhiếc*: tầng có *hay sỉ nhục* (`an7.57`, 8 khoá), *hay lăng mạ* (`sn1.49`), *hay rủa sả* (`an4.53`, `an4.54`), và `dn32:8.8` dịch động từ `paribhāsati` là *mắng nhiếc*; không có đa số rõ nên giữ.
    + `17.2` `puṭṭho me`: *rồi khi được tôi hỏi* giữ như cũ; chưa rõ người được hỏi nói *như vầy* với ai (người ở cõi người hay chính Revatī), không thêm vào thân kinh.
  - Số liệu lượt này: tập khoá Việt = tập khoá Pāli 102/102, đúng thứ tự; nháy kép và nháy đơn khớp Pāli từng khoá (0/102 lệch); 9 cặp Pāli trùng nguyên văn trong bài (chưa tính cặp chỉ khác `”ti`, nên là 10 cặp như đã ghi) đều có cùng bản Việt; không có `…` ở Pāli lẫn Việt; NFC, 0 khoá rỗng, không Pāli lọt sang Việt ngoài tên riêng. Số Pāli không đổi so với mục trên. `technical_integrity` vẫn 9.6; bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 4 khoá bất đồng nghĩa → sửa 0, giữ 2 (`4.2` và `6.2`: bản nguyên bài giải `ubhato` là «bên trong và bên ngoài», Pāli chỉ nói «ở hai bên»; `19.1`: bản nguyên bài dịch `ārāmāni ropissaṁ` là «dựng tu viện», còn `ropissaṁ` là «trồng» và `ārāma` là khu vườn, bản dự án giữ «trồng những vườn cây»), bất định 2 (`1.2`: `apārutadvāre` là «cửa không đóng» nhưng không nói cửa nào, bản nguyên bài thêm «cửa địa ngục»; `20.3`: `pāṭihāriyapakkhañca` bản dự án giữ «tuần lễ thần biến» như 11 khoá cùng công thức, bản nguyên bài hiểu là những ngày phụ trội của nửa tháng; tầng hiện có bốn cách dịch cho cụm này, chưa phân xử được). Các số khớp: một trăm tầm người, hàng ngàn năm, ngày mười bốn, mười lăm, mồng tám, tám chi phần. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
