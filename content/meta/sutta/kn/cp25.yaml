notes: |-
  Dịch từ Pāli root, đối chiếu trực tiếp với bản dịch tiếng Anh của Bhikkhu Sujato tại commit bilara đã ghim.
  Bảo toàn trung thực cấu trúc kệ ngôn và giáo nghĩa Ba-la-mật của Cariyāpiṭaka.
  Toàn bộ 29 khoá được kiểm tra chặt chẽ, đạt chuẩn xuất bản trực tiếp (final_score > 9.0, không có lỗi chặn).

  Lượt cải thiện 2026-10-13: đọc đối kháng 29 khoá, sửa 16 khoá, không đổi tập khoá. Các điểm giữ nguyên (final_score 9.41), vì lượt này gỡ chỗ thêm nghĩa chứ không bổ sung căn cứ mới. Accuracy fix: 2.3 bỏ "kinh hãi" (patikuṭati chỉ là co rút lại, không nói sợ hãi) và "các cõi" (bhavato số ít); 4.2 bỏ "tài sản" (kāmabhoga là các dục lạc, tiền lệ 'hưởng dục/dục lạc'; của cải là bhoga ở 6.3); 5.3 bỏ "hạnh lành" (anusikkhanto chỉ là học theo); 3.4 bỏ "sâu" và "tu tập" (kānanaṁ chỉ là rừng, tiền lệ cp23:9.4 'bước vào rừng'); 2.4 bỏ "mũi" và "nhọn" (tutta là gậy thúc, vega là sức đâm); 1.3-1.4 bỏ "quý tộc" và "bậc đại gia đình", mahāsāle thành "giàu có lớn lao"; 6.4 mahāvana thành "khu rừng lớn", bỏ "rậm đại ngàn". Clarity fix: 2.1 "Dẫu ở cảnh ấy" thành "Ngay khi ấy" (tadāpi là thời điểm, không phải cảnh); 2.2 bỏ cặp "bị chìm ngập ... bao trùm" dư lặp; 3.1 "các loại tội lỗi xấu ác đủ bề" thành "đủ loại điều ác"; 3.3 "gia đình" thành "nhà" (gehā); 4.1 "thân bằng quyến thuộc" thành "thân quyến" (tiền lệ 19 nơi) và "cũng" được trả lại cho api; 4.4 bỏ "Xin" (mā nimantetha là mệnh lệnh phủ định, không có từ lễ phép) và "vào"; 5.4 bỏ "con đường"; 6.3 bỏ "tài sản" lặp. Giữ có chủ ý: "Lại nữa, vào thời thuở nọ" ở 1.1 theo công thức mở đầu chung của 20 bài Hạnh Tạng (cp2…cp31) dù "khi" của yadā không hiện rõ; "Xuất Gia Ba-la-mật Thứ Năm" theo tiền lệ cp21-cp24. Lệch còn lại: 6.4 nay khác cp24:8.4 (cùng Pāli, cp24 giữ "khu rừng rậm đại ngàn"), cần đồng bộ ở cp24. Bản dịch tiếng Anh đối chiếu có sẵn nên tam giác đối chiếu vẫn đủ. technical_integrity 9.6 giữ nguyên; bốn lệnh chưa chạy trong lượt này: npm run validate, npm test, npm run check, npm run build.