notes: |-
  Bản dịch tiếng Việt mới cho bài kinh tha-ap40 — trưởng lão Āyāgadāyako, bài thứ tám
  trong Kuṇḍadhānavagga. Tên bài nghĩa là vị trưởng lão đã làm sự thọ lễ.

  Tiền kiếp: khi bậc Lãnh Đạo thế gian nhập Niết-bàn, ông hân hoan đảnh lễ tối thượng các
  tháp; ông trò chuyện với bà chăn trâu và trao gốc của điều lành rồi làm cho sự thọ lễ được
  thành tựu. Tám kiếp sống nơi chư thiên không thể đếm, các kiếp còn lại luân hồi có thể đếm;
  không điều ác nào xâm nhập thân ông, mùa mưa theo ý ông mà tới, cả chư thiên cũng vào
  sự điều khiển của ông — tất cả là quả của công đức lành. Ông làm vua ba mươi lần, không ai
  đo đếm ông; vào ba mươi mốt kiếp trước ông làm sự thọ lễ.

  Bất định đã ghi lại, không sửa trong kinh:
  - `Udakehaṁ na miyyāmi` (4.3) dịch là dòng nước ấy không dây dứa ta. `udaka` trong câu
    này có thể là biển hay dòng sông tuỳ ngữ cảnh mà Pāli không nói rõ; giữ nghĩa gốc,
    không suy đoán thêm.
  - `abbokiṇṇaṁ vasiṁ` và `vokiṇṇaṁ saṁsariṁ` (3.2 và 3.4) là cặp đối xứng không thể đếm và
    có thể đếm; gốc là `kinn` nghĩa đếm, dùng đúng nghĩa gốc.
  - `āyāga` dịch là sự thọ lễ, dùng thống nhất ở 2.4, 4.4, 7.2 và 7.4 vì cùng một từ.
  - `Nibbute lokanāthamhi` dịch là khi bậc Lãnh Đạo thế gian đã nhập Niết-bàn, theo
    tha-ap48:1.1 với đúng công thức này; `sikhimhi` dịch là đang tu hành theo tha-ap230:1.2.
  - `vaḍḍhakīhi` (2.1) dịch là bà chăn trâu theo mil3.1.9 và mil3.3.13.
  - `Na maṁ kecāvajānanti` (6.3) dịch là không ai đo đếm ta; `āvajāna` là đo đếm, để ý.
  - Câu 1.3 và 2.3 cùng là `Haṭṭho haṭṭhena cittena` nên dịch giống hệt nhau, theo chín cặp
    tiền lệ tha-ap74, tha-ap94, tha-ap210.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của chính tầng Việt qua `_hvi.save_vi`: đủ 36/36 khoá, cân ngoặc kép trên cả bài, đúng số dấu lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10 tiêu chí, tính bằng script.
