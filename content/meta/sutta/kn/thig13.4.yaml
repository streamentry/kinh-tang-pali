  **BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh:**
  · `1.1`–`1.2` `khādamānā`: Pāli là phân từ hiện tại của `khādati` *ăn*; dịch *đã ăn*. Sujato đọc là *feeding* (cúng cho người chết ăn),
    bản Việt nguyên bài thêm *(bởi loài thú)* và biến thành bị động *bị nhai ngấu nghiến*. Pāli không nói người ăn là ai, không nói đó là cúng tế hay là
    loài thú; ba khoá `1.2`, `2.1`, `3.3` cùng dùng gốc `khād-`, tôi dịch cả ba bằng *ăn* để người đọc không bị dẫn tới cách hiểu nào.
    Người biên tập nên coi đây là chỗ cần tra thêm chú giải.
  · `2.2` `sataputtāni`: Pāli ghim ghi `sata-`, nên tôi dịch **một trăm người con**, đúng với bản Việt nguyên bài (*một trăm người con trai*). Sujato dịch **seven** ở
    chỗ này, tức là cách đọc `satta-`; không có bản Anh thứ hai trong tầng đã ghim để phân xử. Khoá `3.1` (`puttasatāni`, *nhiều trăm người con*) cùng
    nghĩa *trăm*. Không chọn con số theo Sujato vì Pāli authority ghi `sata`.
  · `6.2`/`8.2` `nagaraṁ mithilaṁ pati`: `pati` dịch *ở gần* khi không có động từ chuyển động (`6.2`) và *về phía* khi có `gamissāmi` (`8.2`). Sujato
    dịch `6.2` là *back at the city of Mithilā*, bản Việt nguyên bài *ở cạnh thành phố Mithilā*. Không thêm tiểu sử.
  · `14.4` `puṇṇapattaṁ`: dịch *một bát đầy* theo từng chữ (*bát* + *đầy*). Sujato *a full bowl as a gift*, bản Việt nguyên bài *một bình bát đầy*; `ja437:6.2`
    dịch *một phần đầy đủ*. Đây có thể là thành ngữ thưởng tin vui; Pāli ở đây không nói rõ, tôi không thêm *làm phần thưởng*.
  · `13.2`/`14.2` `sahassa`: dịch *một ngàn*, không thêm *đồng tiền*; Pāli không nói một ngàn gì. Sujato thêm *coins*, bản Việt nguyên bài thêm *(đồng tiền)*
    trong ngoặc.
