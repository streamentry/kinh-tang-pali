    có `thag16.7:2.2` (*phần vụn rơi trong bát xin ăn*). Bản Việt nguyên bài *đồ ăn do đã đứng (chờ đợi)*. Nghĩa sát (thức ăn nhận khi
    đứng ở cửa xin ăn, hay cơm thừa) không phân xử bằng chứng cứ trong tầng.
  · `18.5` `abhisambhontī`: dịch *chịu đựng được*; Sujato *make do with*, bản Việt nguyên bài *chịu đựng*. Giữ cách đọc *chịu đựng/đủ sức đảm nhận*.
  · `22.2` `harittacaṁ`: dịch *có làn da vàng*; tầng đã dịch không có khoá nào chứa `harittaca` (**0** tiền lệ). Sujato *sun-golden skin*, bản Việt nguyên bài *làn da màu vàng*.
  · `23`–`25` ai nói: Pāli mở nháy ở `23.1` và đóng ở `25.4`, tức xem cả `23`, `24`, `25` là một lượt lời. Ba khoá `24.1`–`24.4`
    là lời Sundarī tự nhắc tên mình (*Sundarī đảnh lễ dưới chân Ngài*), nên có chuyển ngôi trong cùng lượt nháy. Bản Việt giữ đúng ranh giới nháy của
    Pāli; Sujato đóng nháy tại `23.4` và mở lại tại `24.1`.
  · `24.2` `āgatā`: Pāli là nữ cách số ít, chủ ngữ là Sundarī (nêu ở `24.4`); bản Việt để `24.1`–`24.2` không chủ ngữ (*Rời khỏi Bārāṇasī, / đã đến chỗ Ngài;*).
  · `25.3` `orasā mukhato jātā`: dịch *con ruột, sinh ra từ miệng Ngài*; `Ngài` được bổ từ `tuyhaṁ` (`25.2`). Sujato *bosom daughter … born of your mouth*;
