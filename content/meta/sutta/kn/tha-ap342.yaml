notes: |-
  Bản dịch chỉ từ Pāli root, 70/70 khoá, đúng thứ tự Pāli. Không có tầng English hay Việt tham khảo nào cho bài này, nên bài giữ draft vì blocker tầng tham khảo, không vì chất lượng câu chữ.

  CÔNG THỨC DÙNG LẠI NGUYÊN VĂN. Trong tầng tha-ap đã dịch có 39 khoá Pāli trùng nguyên văn với khoá của bài này; 28 khoá dùng lại y hệt bản Việt sẵn có, 11 khoá khác (liệt kê dưới đây, mỗi chỗ có lý do). Một cặp trùng trong chính bài: 5.2 và 6.2 (`lokajeṭṭho narāsabho;`), cùng một bản Việt `bậc Trưởng Thượng thế gian, đấng Nhân Ngưu;` (39 khoá trong tầng).
  Giữ nguyên các công thức quen: `Bốn vô ngại giải,` (923 khoá), `…pe…` thành đúng một `…`, `đã làm tròn lời dạy của Đức Phật”.` (850), `Nhờ nghiệp lành khéo làm ấy,` (30), `cùng với tâm nguyện và chí hướng;` (37), `sau khi từ bỏ thân người,` (21), `tôi đã đến cõi trời Ba mươi ba.` (ngôi thứ nhất theo cả bài), `Vào một trăm ngàn đại kiếp trước,` (34), `khi tôi dâng cúng hoa ấy;` (28), `Tôi không còn biết đến đọa xứ nào,` (164 so với `khổ xứ` 51), `Các phiền não của tôi đã bị thiêu rụi,` và `tôi sống không còn lậu hoặc.` (hình có `tôi` ở tha-ap497, cùng phẩm), `mọi cõi hữu đều đã được nhổ sạch;` (37), `như thớt voi bẻ gãy mọi trói buộc,` (20), `Vương quốc rộng lớn ấy,` / `đếm không hết, vô tận;` / `đã khéo tạo từ thuở xa xưa.`, `Ở thành xứ Haṁsavatī,` (tha-ap497, 504), `Đức Chiến Thắng tên Padumuttara,`, `bậc đã vượt qua mọi pháp;` (8), `Ngài đã ngự đến nơi tôi ở.` (8), `Đấng Tự Tại, Đấng Dẫn Đạo thế gian;`, `Do oai lực của Đức Phật,`. Dòng kết dùng đúng nhóm `Tôi nghe như vầy: Tôn giả Trưởng lão … đã nói những bài kệ này.` (số nhiều, 407 khoá; nhóm số ít `đã từng nói bài kệ này` 21 khoá không dùng).

  ĐO TIỀN LỆ, KHÔNG PHẢI ĐOÁN.
  `:0.1` `Therāpadāna` giữ Pāli: 879 so với `Trưởng Lão Ký Sự` 22. `:0.2` `Gandhodakavagga` thành `Phẩm Gandhodaka` (7 khoá, tha-ap333·334·335·337 cùng phẩm).
  `:0.3` Pāli không bắt đầu bằng số nên không có số thứ tự (khớp chính sách KEEP chỉ khi Pāli có số). `translationTitle` bằng đúng giá trị `:0.3`, và `:16.1` là `:0.3` cộng `, thứ mười` (`dasamaṁ` = thứ mười). Phần `Tuyên Ngôn`: phạm vi gần nhất tha-ap320–350 cho `Tuyên Ngợ` 14 · `Tuyên Ngợi` 2 · `Tuyên Ngôn` 3 · `Ký Sự` 3; cả tầng tha-ap cho `Tuyên Ngợ` 234 · `Tuyên Ngợi` 10 · `Tuyên Ngôn` 97 · `Ký Sự` 96. Trong chính phẩm Gandhodaka, tha-ap335 và tha-ap337 dùng `Tuyên Ngôn`; `Tuyên Ngợ`/`Tuyên Ngợi` là hình viết sai chính tả không có gốc nghĩa, nên không theo đa số cục bộ. Hai phạm vi cho hai đa số khác nhau (và `Tuyên Ngôn` / `Ký Sự` gần ngang nhau ở cấp tầng), người biên tập nên phán một lượt cho cả cuốn.
  Phần tên riêng của `:0.3` giữ Pāli `Ukkhittapadumiya` (không dịch nghĩa), như `Punnāgapupphiya` (tha-ap335) và `Ekapadumiya` (tha-ap343).
  `:17.1` `catutiṁsatimo` = thứ ba mươi tư; `mươi tư` 125 khoá so với `mươi bốn` 26 trong tầng kn, nên theo `ba mươi tư`. Con số `catutālīsa` = 44 viết `bốn mươi bốn` (tầng không có tiền lệ cho `bốn mươi tư` hay `bốn mươi bốn`; chọn hình ít nhầm với số thứ tự).
  `:18.1` `Tassuddānaṁ` thành `Tóm tắt phẩm này:` (55 khoá trong tha-ap).

  SỐ PĀLI, PHÉP TÍNH.
  `satasahassehi` (2.3) = sata 100 × sahassa 1000 = 100.000 → một trăm ngàn vị. `Satasahassito kappe` (13.1) = 100.000 kiếp → một trăm ngàn đại kiếp (cách dịch của tầng). `Saṭṭhiyojana` (8.3) = saṭṭhi 60 → sáu mươi do-tuần; `tiṁsayojana` (8.4) = tiṁsa 30 → ba mươi do-tuần. `Sahassakkhattuṁ` (9.1) = 1000 lần. `Pañcasattatikkhattuñca` (9.3) = pañca 5 + sattati 70 = 75 → bảy mươi lăm lần (tha-ap497 `Sattasattati` = 77 → bảy mươi bảy). `catutiṁsatimo` = 34. Uddāna: `ekaṁ gāthāsataṁ` 100 + `catutālīsa` 44 (catu 4 + tālīsa 40) = 144 bài kệ; không có chứng cứ độc lập trong tầng cho tổng 144 nên giữ đúng hai số rời `một trăm` và `bốn mươi bốn`, như tha-ap432:19.3–19.4 (`một trăm … bảy mươi mốt`). Không gặp cụm `Tiṁsakappasahassa`.

  CHỖ KHÁC TIỀN LỆ (11 khoá) VÀ LÝ DO.
  (1) `:1.2` `māliko` — tầng có `tôi làm người kết hoa` (tha-ap105) và `ta là người làm vườn` (tha-ap419), mỗi hình 1 tệp. Dịch `người làm vườn`: không thêm nghĩa `kết` tràng hoa mà Pāli không nói.
  (2) `:2.3` — tha-ap337:2.3 viết `hàng trăm ngàn`; ở đó đi với `aṭṭha khīṇāsavehi`. Ở đây dùng con số đúng `một trăm ngàn` (100.000), thêm `vị` làm loại từ.
  (3) `:4.1` `Disvānahaṁ devadevaṁ` = disvāna + ahaṁ (tôi) + devadevaṁ (tân ngữ). Tiền lệ (tha-ap343:4.1, tha-ap443:3.1) viết `Thấy tôi, đấng thần của các thần,`, đọc được thành vị thần nhìn thấy người kể, ngược vai. Dịch `Tôi thấy đấng thần của các thần,`. Hai tệp kia có lẽ cần xem lại, ngoài lát này, nên chỉ báo.
  (4) `:4.2` khác tiền lệ (tha-ap343:4.2) đúng một dấu: tiền lệ kết bằng dấu phẩy dù Pāli kết bằng dấu chấm phẩy; ở đây giữ dấu chấm phẩy theo Pāli.
  (5) `:6.1` `Adhiṭṭhahi` — tha-ap123:4.1 viết `đã đứng lên`. Ở đây ngữ cảnh (6.3 `Buddhassa ānubhāvena`, 6.4 các đoá sen trụ trên đầu) là sự quyết định/chú nguyện (adhiṭṭhāna) chứ không phải đứng dậy. `quyết định` có 12 khoá trong tầng, `chú nguyện` 0 khoá. Đây là chỗ khó nhất, xem bất định (a).
  (6) `:8.1` — tiền lệ duy nhất (tha-ap501:4.1 `Ở đó tôi đã làm khéo làm bằng vàng,`) là câu hỏng, không dùng được; `byamha` (cung điện) có nhiều chỗ khác trong tầng cũng dịch `cung điện`.
  (7) `:8.4` `vitthata` — `rộng` (tha-ap452, 2 khoá) so với `dài` (tha-ap501, 1 khoá); theo đa số, và `rộng` đúng nghĩa `vitthata` hơn.
  (8) `:9.2`, `:9.4`, `:11.2` — đổi `ta` thành `tôi` cho khớp ngôi kể của cả bài (cùng cách làm tha-ap497); `:11.2` tiền lệ `anh đã thọ nhận được thành tựu` là một động từ hữu hạn, trong khi `anubhotvāna` là bất biến quá khứ nên dịch `sau khi thọ hưởng những thành tựu`.
  (9) `:11.3` — tiền lệ `Trong giáo pháp của …` / `Trong hàng đệ tử của …` luôn đi với dòng sau có `sāsane`; ở đây dòng sau là `dhammaṁ sacchikariṁ ahaṁ`, nên Gotamassa bhagavato chỉ có thể là sở hữu của dhammaṁ, dịch `Của Đức Thế Tôn Gotama,`, và không chen `giáo pháp` vào.

  BẤT ĐỊNH, KHÔNG THÊM VÀO THÂN KINH.
  (a) `:6.1` `adhiṭṭhahi` — hai cách đọc: quyết định/chú nguyện (chọn) hoặc đứng lên (tha-ap123:4.1). Đọc theo mạch thì cách thứ nhất đúng, nhưng chưa có tầng tham khảo nào độc lập để kiểm.
  (b) `:5.4` và `:6.4` `te` — có thể là `chúng` (chủ ngữ, nom. số nhiều) hoặc `của Ngài` (sở hữu), ở 5.3 đã có chủ ngữ `satapattā`. Đọc thành chủ ngữ, và `matthake` dịch `trên đầu Ngài` vì phải có chủ sở hữu trong tiếng Việt. Nếu đọc `te` là sở hữu thì nghĩa không đổi.
  (c) `:3.3` `vuddhiṁ samanvesaṁ` — 0 tiền lệ nguyên cụm. `vuddhi` = sự tăng trưởng/tiến bộ; chọn `sự tăng trưởng của tôi`, giữ nghĩa rộng, không thêm `về đạo đức` hay `về thiện pháp`.
  (d) `:8.2` `satapattanti vuccati` — dịch nghĩa tên cung điện thành `Sen Trăm Cánh` (viết hoa như tên riêng) để người đọc thấy cùng chữ `satapatta` ở 1.4 và 4.3; không có tiền lệ cho `satapatta` làm tên cung điện. Pāli không có dấu nháy ở khoá này nên bản Việt cũng không có.
  (e) `:2.4` `tādibhi` — `những bậc Như Vậy` theo tha-ap34:6.4 (1 khoá); nghĩa là bậc vững vàng, không dao động, vốn khó dịch gọn.
  (f) `:19.2`–`:20.4` bộ uddāna: Pāli kết 19.4 và 20.4 bằng dấu chấm, 19.2 và 20.2 bằng dấu chấm phẩy, 19.1/19.3/20.1/20.3 bằng dấu phẩy; bản Việt giữ đúng từng dấu. `piṇḍita` dịch `gộp lại` (tiền lệ duy nhất, tha-ap32:10.4, viết `đã được tính đếm`).
  (g) `:20.1` `ekapadumī` — tên viết `Ekapadumī` giữ Pāli, trùng với `Ekapadumiya` ở tên bài này; không xác lập được quan hệ chính xác trong uddāna.

  KIỂM TRA ĐÃ LÀM, kèm mẫu số. Tập khoá Việt bằng tập khoá Pāli, 70 trên 70, đúng thứ tự. Nháy `“”‘’` khớp Pāli từng khoá, 70 khoá, 0 lệch (Pāli chỉ có `“` ở 1.1 và `”` ở 14.3). Dấu lược: Pāli có `…pe…` ở 14.2, Việt đúng một `…` ở đó, 0 chỗ khác; Pāli không có `(…)` nên Việt cũng không có. Số Pāli: mọi số được tính tay ở mục trên, không có cụm chưa phân xử được. NFC, khoảng trắng thừa, khoá rỗng: 0 lỗi; không có Pāli lọt sang Việt ngoài tên riêng và `Therāpadāna`. Đã in 70 cặp Pāli và Việt ra đọc lại.

  Coverage English: mẫu số 2 khoá (colophon 15.1 và 16.1), Sujato phủ 0/2; ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng cho uid này. Phép đo này gần như không đo được gì ở thân kệ, vì 65 trên 67 khoá không phải khối `:0` dưới 40 ký tự.

