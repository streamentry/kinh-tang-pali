notes: |-
  Phạm vi: đủ 61/61 khoá Pāli root đã ghim, không khoá nào ngoài tập đó, thứ tự khoá bản Việt bằng
  thứ tự Pāli. Bài là đơn vị nguyên tử (không phải lát dở). Đã đọc hết 61/61 khoá Pāli rồi mới viết
  và đã in cặp PĀLI ↔ VIỆT ra đọc đối kháng một lượt sau khi ghi. Cấu trúc: 12 bài kệ bốn pāda
  (`:1.1`–`:12.4`; bài 8 có sáu pāda), dòng bìa `:12.5`, dòng kết bộ `:12.6`, khối uddāna
  `:13.0`–`:13.4`.

  ⚠ MẪU SỐ COVERAGE THEO CỔNG = 0 — CỔNG NÀY KHÔNG ĐO ĐƯỢC GÌ.
  `source/layers.yaml` đặt `substantivePaliMinChars: 40`, `excludeReferenceBlock: true`. Bài có 57
  khoá thân (bỏ bốn khoá `:0.1`–`:0.4`); khoá Pāli thân dài nhất chỉ **26 ký tự** ⇒ **0/57** đạt
  ngưỡng, vì Theragāthā mỗi pāda một khoá. Đó là "không đo được gì", không phải "không cần ghi
  nhận gap". Quy tắc kho đặt tỉ lệ bằng 1 khi mẫu số bằng 0; con số ấy KHÔNG phải bằng chứng đối
  chiếu và tôi không dùng nó làm căn cứ để publish.

  TẦNG THAM KHẢO — tra bản chụp đã ghim, không suy từ tên thư mục.
    · `english-sujato`: CÓ tệp cho bài này (`thag` có trong tầng). Đo thô, không qua ngưỡng 40
      ký tự: **54/61** khoá có prose (**50/57** khoá thân). Bảy khoá trống: `:12.5` (dòng bìa),
      `:12.6` (dòng kết bộ) và 5/5 khoá uddāna `:13.0`–`:13.4` — tầng Anh không phủ đúng các chỗ
      đó. Cấu trúc khoá Anh **khớp** Pāli từng pāda ở bài này (khác bài `thag12.1`), nên dùng
      được làm neo ở mức khoá. Đây là độ phủ thô để người biên tập tự phán, không phải coverage
      theo cổng.
    · `english-project`: không có tệp cho bài này.
    · `vietnamese-current`: vắng; lớp Bilara tiếng Việt tại commit ghim chỉ có 26 tệp Pháp Cú —
      đặc điểm của cả tầng ở `thag`, không phải thiếu sót của repo. Ba tầng không vắng hết nên
      không dính điều kiện ép `draft`; `triangulation` đặt 8.5 vì chỉ có MỘT tầng tham khảo độc
      lập và tầng đó sai ở một chỗ (xem dưới), cộng với 7 khoá không có Anh.

  SUJATO LỆCH PĀLI Ở BA CHỖ — Pāli thắng.
    · `:4.1` `byābhaṅgiṁ`: Sujato *flail* (cái đập). `byābhaṅgi` là **đòn gánh**; chính tầng đã
      dịch `asitabyābhaṅgiṁ` là *liềm và đòn gánh* (`mn96:10.13`) và *cái liềm và cái chày* ở
      `an5.7:1.2`. Tôi dịch *đòn gánh* (nghĩa theo `mn96`, không phải theo `an5.7`).
    · `:1.4` `pupphachaḍḍako`: Sujato *threw out the old flowers*. Root chỉ nói `puppha-chaḍḍaka`
      (người bỏ/đổ hoa), **không có "cũ/tàn"**; chữ "tàn" đến từ chú giải, không phải từ Pāli.
      Tôi dịch *người dọn bỏ hoa* và không thêm tính từ.
    · `:7.3` `Akāsiṁ satthu vacanaṁ`: Sujato *I have completed what the Teacher taught*; Pāli là
      aorist `akāsiṁ` = *tôi đã làm (theo)*, không có "hoàn tất". Tôi dịch *tôi đã làm theo lời*.

  ĐO TIỀN LỆ — Pāli trùng nguyên văn (chuẩn hoá bỏ dấu câu/khoảng trắng) ở các bài khác của tầng.
  Đã dò toàn tầng sutta (loại chính bài này): **25 khoá** của bài có Pāli trùng ở bài khác, tổng
  **234** dòng trùng. Bản Việt của tôi **giống** bản phổ biến nhất ở **13/25** khoá (gồm các cặp
  hòa 1–1) và **khác** ở **12/25** khoá: `:6.4`, `:8.2`, `:8.4`, `:8.6` chỉ khác ngôi (*ta*/*tôi*) hoặc từ
  gần nghĩa; `:6.2` *thương xót* thay *thương tưởng*; `:12.6` chỉ khác ở từ *đã khép lại*/*hoàn tất*;
  năm khoá còn lại (`:10.1`, `:12.2`, `:12.3`, `:5.4`, `:3.1`, `:2.3`) là quyết định có lý do nêu dưới.
    · `:10.1` `Namo te purisājañña` (**19** hit, nhưng `dn32` chiếm 8 hit chỉ là **một** bài):
      *bậc cao quý giữa loài người* (dn32, 1 bài) · *bậc tuấn mã giữa loài người / hỡi bậc tuấn mã*
      (`an11.9` ×3, `snp3.6`; 2 bài) · *bậc hiểu biết người đời* (`tha-ap` ×3) · *bậc tối thắng
      giữa loài người* (`tha-ap` ×2) · *bậc giống người thuần thục* · *bậc chân nhân*. Chọn
      *bậc tuấn mã giữa loài người* (đếm theo số **bài**, không theo số khoá; giữ đúng nghĩa
      `ājañña` = giống ngựa thuần chủng; `an11.9` là bài có khuôn gần nhất — chư thiên chào bậc
      đã đoạn tận lậu hoặc).
    · `:10.2` `namo te purisuttama`: *kính lễ Ngài, bậc tối thượng giữa loài người* — dùng lại
      **nguyên văn** (17 hit, 9 + 3 + 2 + … cùng khuôn).
    · `:12.1`–`:12.4` `Tapena brahmacariyena…`: trùng với `mn98:13.9–12` và `snp3.9:67.1–4`
      (2 bài). Dùng *khổ hạnh, phạm hạnh* + *đó là Bà-la-môn tối thượng* (cả hai bài cùng);
      `:12.2` dùng *thu thúc và điều phục* theo `snp3.9:67.2` (bài thơ, gần hơn) thay vì *chế ngự*
      của `mn98` (văn xuôi); `:12.3` dùng *nhờ đó mà thành Bà-la-môn* theo `snp3.9:67.3`.
    · `:3.2` / `:11.2` `…saṅghapurakkhataṁ`: *được hội chúng … vây quanh* (`:3.2`: 4 hit so với 2 hit
      *được chúng …*; `:11.2`: 2/2 hit). Sujato đọc `:3.2` là *at the fore* (đi trước), và một khoá của
      tầng (`thig5.9:2.4`) cũng dịch theo nghĩa *đi đầu*; tôi giữ nghĩa *vây quanh* theo đa số.
    · `:5.1` `Vanditvā satthuno pāde`: *đảnh lễ dưới đôi chân bậc Đạo Sư* (6/8 hit).
    · `:9.1` `Tato ratyā vivasāne`: *Rồi khi đêm chấm dứt* (3/4 hit).
    · `:13.4` `gāthāyo catuvīsatīti`: *có hai mươi tư câu kệ* (`thag8.3:9.4`, 1 hit, cùng bài kệ kết bộ).
    · `:2.3` `Nīcaṁ manaṁ karitvāna`: tầng có 1 hit (`thag10.6:3.1`, *Hạ mình thấp trong tâm*). **Khác có
      chủ ý**: *hạ thấp tâm mình* cùng nghĩa và đọc rõ hơn; không đổi nội dung.
    · Pāli trùng nguyên văn **trong chính bài**: **0 cặp** — phép này chạy rỗng, không phải "0 lỗi".

  ĐIỂM THUẬT NGỮ KÈM ĐẾM.
    · `āsūpasampadā` → *sự thọ đại giới* (`thag7.3:6.4`, `thig5.9:3.4`, 2/2).
    · `Ehi bhikkhū` → *Hãy đến, này tỳ-kheo!* (theo `mn86:6.20`, *Hãy đến, này tỳ-kheo!*; `thag7.3`
      có *Hãy đến đây, Bhadda!*).
    · `yāma` → *canh* (`thig7.1`, `thig5.11`, `thig6.8`, `dhp157`: *canh*).
    · `tamokhandha` → *khối tối tăm* (tầng 15 hit, không có dạng áp đảo: *khối u tối dày đặc* 5 hit,
      các dạng còn lại 1 hit; *khối tối tăm* có ở `thag2.4`, `thig3.8`, `thig5.11`; chọn dạng ngắn, sát Pāli).
    · `Dvādasakanipāta` → *Bộ Mười Hai Bài Kinh*: **9/9** hit đầu bộ cùng dạng; `:12.6` *đã khép lại* theo
      `thag8.3`/`thag9.1`/`thag10.7` (3 bài; `thag11.1` dùng *đã hoàn tất*).
    · `Tatruddānaṁ` → *Tóm tắt ở đây:* (10/11 hit).
    · `mahiddhika` → *có đại thần thông* (tầng: *có đại thần thông* 2 + *đại thần lực* 1).
    · Ngôi kể: *tôi* xuyên suốt, vì người nói tự kể thân phận thấp hèn và nhún mình; trong tầng
      `thag` từ nipāta 7 trở lên có *ta* 49 và *tôi* 34, tức hai cách đều phổ biến và tôi giữ nhất
      quán trong **một** bài.
    · Tên: `Sīlavā` (uddāna `:13.1`) giữ nguyên Pāli. Bài `thag12.1` đặt tên Việt *Sīlavattha*
      (theo đầu đề `Sīlavattheragāthā`) và dịch dòng bìa `Sīlavo thero` là *Trưởng lão Sīlavattha*;
      ba dạng `Sīlavā`/`Sīlavo`/`Sīlavattha` chỉ cùng một vị, nhưng tôi **không** tự thống nhất vì
      Pāli đã khác nhau. `Indo` → *Indra* (không đổi sang *Đế Thích* vì Pāli dùng `Indo` chứ không
      dùng `Sakko`); `brahmā` → *Phạm thiên* (Sujato *the Divinity*).

  SỐ PĀLI — tự tính, in phép ra.
    · `catuvīsati` (`:13.4`) = catu 4 + vīsati 20 = **24** → *hai mươi tư*. Đối chiếu nội bộ: bài
      `thag12.1` có **12** bài kệ (`:1`–`:12`), bài này có **12** (`:1`–`:12`) ⇒ 12 + 12 = **24** ✔.
    · `dvādasa` (đầu đề `:0.2`, `:12.6`, `:13.3`) = **12** ✔. `dve` (`:13.2`) = **2** vị trưởng lão ✔
      (Sīlavā và Sunīta, khớp `:13.1`). `paṭhama / majjhima / pacchima yāma` = canh **đầu / giữa /
      cuối** (3 canh) ✔. Không có `sattati`, `Tiṁsakappasahassa` hay số lớn nào khác trong bài.

  NĂM PHÉP KIỂM (kèm mẫu số).
    1. `set(khoá Việt) == set(khoá Pāli)`: **61 = 61**, thiếu 0, thừa 0, đúng thứ tự Pāli.
    2. Nháy đơn/kép **khớp Pāli từng khoá**: **0/61 lệch**; tổng `“` 1/1, `”` 1/1, `‘` 3/3, `’` 3/3.
       (Cấu trúc: `“` mở ở `:1.1`, nháy đơn lồng ở `:6.3`, `:10.1–10.4`, `:12.1–12.4` kết `’”`.)
    3. Pāli trùng trong chính bài: **0 nhóm** ⇒ **phép chạy rỗng**, không ghi "0 lỗi".
    4. Dấu lược: `…pe…` **0** khoá; `…` trần **1** khoá (`:12.5`, Pāli `… Sunīto thero …` → Việt
       `… Trưởng lão Sunīta …`, giữ **đúng hai** dấu lược, không chấm cuối vì Pāli không có chấm);
       `(…)` **0** khoá ở Pāli nên **0** ở Việt. Lỗi 0/61.
    5. Số Pāli: xem mục trên (24, 12, 2, 3 canh).
  Vệ sinh: JSON hợp lệ, 61/61 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa, 0 từ Pāli lọt vào thân
  Việt (ngoại lệ có chủ ý: `Theragāthā` ở `:0.1`, `Sīlavā` ở `:13.1`, đều là danh xưng giữ nguyên).

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, KHÔNG thêm vào thân kinh).
    · `:3.4` `magadhānaṁ puruttamaṁ` → *thành đô bậc nhất của người Magadha*. Tôi đọc `puruttama`
      là `pura` + `uttama` (thành bậc nhất, tức Rājagaha), làm tân ngữ của `pavisantaṁ` ở `:3.3`; Sujato
      cũng đọc *capital city*, và `cnd1:37.2` dùng cùng từ cho Sāvatthī. Cách đọc khác là
      `purisuttama` (bậc tối thượng giữa loài người) bị loại vì `:4.4` đã có `purisuttamo` là một từ
      riêng. Chưa có tra từ điển độc lập.
    · `:5.4` `sabbasattānamuttamaṁ`: tôi đọc là tân ngữ thứ hai của `āyāciṁ` (xin xuất gia **nơi** bậc tối
      thượng giữa mọi chúng sinh), như Sujato. Không đọc được như tính từ của `pabbajjaṁ` vì giống
      ngữ pháp không khớp (`pabbajjā` giống cái), nhưng đây là suy luận ngữ pháp, không phải chứng từ.
    · `:2.2` `vambhito` — từ hiếm (không có tiền lệ trong tầng; **0** hit). Tôi dịch *bị miệt thị*
      theo nghĩa "bị hạ nhục/khinh miệt" quen của từ, cặp với `paribhūto` = *bị khinh rẻ*. Hai từ gần
      nghĩa nên cặp dịch có thể chồng nghĩa; chưa phân xử trọn.
    · `:2.4` `vandissaṁ` — dạng động từ hiếm (có thể đọc như tương lai-điều kiện hoặc aorist thói quen).
      Ngữ cảnh kể quá khứ nên dịch *đã đảnh lễ*; sắc thái "vẫn thường" có thể có.
    · `:10.4` `mārisa` — hô ngữ kính trọng của chư thiên, dịch *thưa ngài* (tầng: *thưa Ngài*,
      *ngài*, *bạn hiền*). Chọn *thưa ngài* vì người được gọi là bậc đã đoạn tận lậu hoặc.
    · `:10.3` `Yassa te āsavā khīṇā`: tầng Anh dịch *Since* (nhân quả). Pāli chỉ có quan hệ đại từ
      liên hệ, không có liên từ nhân quả nên tôi dịch *Ngài, bậc có các lậu hoặc đã đoạn tận* (không
      thêm "vì").
    · `:11.1`–`:11.2` `maṁ … devasaṅghapurakkhataṁ`: `purakkhataṁ` hợp cách với `maṁ` (tôi) chứ không với
      `satthā`; tôi dịch *được hội chúng chư thiên vây quanh* gắn vào "tôi", đúng cú pháp. Sujato đọc
      *honored by the assembly of gods* (tôn kính) — một cách hiểu hợp lý của `purakkhata`.
    · `:11.4` `imamatthaṁ` dịch *lời này* theo tiền lệ tầng (1 hit); nghĩa sát chữ là "điều này/ý này".

