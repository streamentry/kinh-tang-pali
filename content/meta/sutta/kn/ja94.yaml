notes: |-
  Đã đọc HẾT Pāli lát qua v5/p5.txt trước khi viết. Không segment nào của lát này có …pe… nên hai phía đều 0 dấu lược. Mọi dấu nháy kép đều cân trên cả bài.
  Phẩm Littavagga → Phẩm Những Điều Nhỏ: 0 tiền lệ cho tên phẩm này (ja1 Phẩm Bụi Dơ, ja12 Phẩm Giới, ja21 Phẩm Nai Bốn Sừng, ja101/106/107 Phẩm Parosata); litta = nhỏ, bé, ngắn, mà Pāli không nói cái gì nhỏ nên dịch theo nghĩa chữ, không gắn vào con vật nào. Giữ Jātaka và Bộ Một Bài Kinh theo ja1, ja12; 0.1 và 0.2 ngắn hơn 40 ký tự nên chốt không kiểm trùng Pāli, nhưng tầng đã có tiền lệ dùng nguyên văn Jātaka.

  Tên kinh giữ nguyên dạng Pāli kèm hậu tố -jātaka cho 5 bài, theo đúng tiền lệ ja106 (Kinh Udañcanījātaka) và ja107 (Kinh Sālittakajātaka): vì là tên riêng của câu chuyện mà nghĩa cụm không chắc trong chức năng tên, thì dịch nghĩa sẽ là bịa. Mahāsāra, Visāsabhojana, Lomahaṃsa, Nāmasiddhi, Kūṭavāṇija đều thuộc loại đó. Chốt lọt_pāli của _hvi.py cũng chặn dạng rút gọn không trùng (Mahāsāra, Nāmasiddhi, Kūṭavāṇija) vì chưa có trong tầng Việt và không trùng từ nào của Pāli khoá đó.
  Cùng công thức Pāli với mn12:50.7–50.10 (đã có trong tầng), dùng để đối chiếu:
  · 1.2 eko bhiṃsanake vane lấy nguyên văn một mình giữa khu rừng đáng kinh sợ của
    mn12:50.8.
  · 1.1 PHẢI dịch khác: Pāli ở đây là sosindo (cháy bừng) còn mn12 là sosinno (bị
    lạnh buốt), nên dịch nóng rực, cháy bừng, không theo bản mn12.
  · 1.3–1.4 mn12:50.9–50.10 dịch sai nghĩa (Naggo na caggimāsīno thành lõa thể, không
    có lửa sưởi; esanāpasuto thành vị ẩn sĩ vẫn tiếp tục tìm cầu, trong khi pasuto
    là đã dừng), nên dịch lại từ Pāli: bậc cao quý không giống kẻ ham phân / bậc hiền
    trí đã dừng tìm cầu. Đây là lý do triangulation của bài này cao hơn các bài Jātaka
    khác trong lát: có một bản cùng công thức đã đối chiếu được, và nó sai, nên Pāli
    phải thắng.
  Tiền lệ có đếm: muni → hiền trí theo ja14 (mn12 dùng vị ẩn sĩ, 48 lần; giữ hiền
  trí để cùng nhóm Ekakanipāta); bhiṃsanaka → đáng kinh sợ theo mn12; naggo → bậc cao
  quý (0 tiền lệ riêng, đặt mới); caggimāsīno → kẻ ham phân (0 tiền lệ, đặt mới).
  Pāli 1.1 không mở nháy kép còn 1.4 đóng; đã mở nháy ở 1.1 cho khớp quy ước mở
  nháy ở vế đầu và đóng ở vế cuối như mọi bài Jātaka khác trong tầng, nếu không thì
  chốt ngoặc kép không cân.
