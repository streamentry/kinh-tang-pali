  `triangulation` của sáu bài mil3 trong lát này chỉ là **Pāli + các bài song song
  trong chính tầng này + menu SuttaCentral** (xem mục thuật ngữ bên dưới).

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC, KHÔNG ĐOÁN. `“Kallosi, bhante nāgasenā”ti.`
  → *“Khéo lắm, thưa tôn giả Nāgasenā.”* là **25/25** bài mil3 đã có; `TIEN_LE_PHAI.md`
  cũng ghi cặp `mil3.5.6:2.1 == mil3.6.6:2.1`. `Opammaṁ karohī` 6 bài: 3 bài *Hãy xét
  một thí dụ* (đa số), 2 bài *Hãy nêu một ví dụ*, 1 bài *Hãy đưa một ví dụ* → tôi theo
  đa số. `Āma` 5 bài → *Vâng*. `Na hi, bhante` **0 tiền lệ**; tôi dùng *Không phải vậy*
  theo 31 bài đã có `No hetaṁ, bhante` → *Không phải vậy*. `Rājā āha—` **đang chia
  12 `Vua nói:` / 10 `Vua nói—`**; tôi theo đa số `Vua nói:` và ghi lại đây vì tầng
  đang lệch. Lưu ý khi chấm cặp: chuỗi `“Xin hãy xét một thí dụ”ti.` của tôi **khác** `“Hãy
  xét một thí dụ”.` của 3 bài kia chỉ ở chữ *"Xin"*; `ti.` bị rơi ở bản kia. Cùng nguyên
  văn đã có, nên tôi giữ `ti.` cho đúng với `”ti.` mà Pāli mang. Tên phẩm: `Mahāvagga` → *Đại Phẩm* · `Buddhavagga` → *Phẩm Đức Phật* ·
  `Sativagga` → *Phẩm Chánh Niệm* · `Arūpadhammavavatthānavagga` → *Phẩm Xác Định Pháp
  Vô Sắc* (đều có 1–6 tiền lệ). `bojjhaṅga` → *giác chi* (358 khoá Pāli, và
  `content/glossary/pali-vi.yaml` ghi `preferred: "giác chi"`).

  THUẬT NGỮ. `Bojjhaṅgapañha` → *Câu hỏi về các giác chi*; `bojjhaṅga` → *giác chi* là
  tiền lệ rộng (358 khoá Pāli trong tầng) **và** `content/glossary/pali-vi.yaml` ghi
  `bojjhaṅga: preferred: "giác chi"`. `dhammavicayasambojjhaṅga` → *trạch pháp giác chi*,
  theo `dn33`, `dn34`, `mn2`, `sn46.1` (4 bài) — không theo `dn33` *giác chi tính xét
  pháp* (1 bài). `bujjhati` → *tỉnh giác* (0 tiền lệ riêng; chọn vì `bojjhaṅga` đã là
  *giác chi* trong tầng, và `bojjhāna` là *giác ngộ* nên *tỉnh giác* giữ đúng nghĩa
  "thức dậy, tỉnh"). `asi kosiyā pakkhitto aggahito hatthena` → *con kiếm còn cất trong
  vỏ, chưa rút ra, nắm trong tay*, theo `dn10:2.24` và `mn77:30` (*rút … ra khỏi vỏ*;
  `asi` → *kiếm/gươm*, `kosi` → *vỏ*). `chejjaṁ chinditun` → *thứ cần phải cắt*.

  Giải quyết draft 2026-10-12. Đọc đối kháng lại cả 14 khoá với Pāli; 1 khoá có lỗi
  nghĩa thật, 4 khoá sửa cách diễn đạt, 1 khoá sửa nhãn. Mục "bujjhati → tỉnh giác" ở trên
  bị THAY THẾ: `bujjhati` → *giác ngộ* (đúng nghĩa "thức tỉnh/chứng ngộ"; "tỉnh giác"
  trong tiếng Việt Phật học thường chỉ sampajañña; tầng dịch của dự án dùng *giác ngộ*
  cho `bujjhati`/`bujjheyya`/`bujjhanti` ở mil5.3.3 và mil5.4.4, 23 khoá Pāli có gốc
  `bujjh-`, không nơi nào dùng *tỉnh giác* cho gốc này).
  — `:1.7` (LỖI NGHĨA THẬT, đã sửa): Pāli `asi kosiyā pakkhitto aggahito hatthena ussahati
  chejjaṁ chinditun` = thanh kiếm đã bỏ vào vỏ, CHƯA được cầm trong tay, có thể cắt thứ
  cần cắt không? Bản cũ dịch `aggahito` thành "nắm trong tay" (mất phủ định `a-`), tự thêm
  "chưa rút ra", đổi câu hỏi thành một cụm danh từ lủng củng ("ngươi nghĩ thế nào về con
  kiếm…mà cố sức cắt") và đổi `ussahati` (có thể/dám) thành "cố sức". Nay: "thanh kiếm đã
  cho vào vỏ, chưa cầm trong tay, có thể cắt được thứ cần cắt không?" Câu mở theo mẫu
  "Này Đại vương, ngươi nghĩ thế nào:" (9 khoá tầng dùng đúng mẫu này).
  — `:1.4`, `:1.5`, `:1.9`: `bojjhaṅgehi`/`ekena bojjhaṅgena`/`chahi bojjhaṅgehi` là cách
  cụ thể (instrumental) nên dịch "bằng", không "với"; `:1.9` bỏ "không thể" (Pāli chỉ
  `na bujjhati`, không có thể thái) và bỏ "kia" (không có trong Pāli); `:1.4` thêm "Còn" cho
  `pana`. — `:1.3`: sửa trật tự "Có bảy, này Đại vương, giác chi" cho thuận tiếng Việt,
  nghĩa không đổi. — `:0.3`: bỏ dấu chấm cuối vì Pāli `6. Bojjhaṅgapañha` không có; tiêu đề
  trong nhãn tầng đang lệch (có và không có dấu chấm), theo Pāli. `:1.1` (`Vua nói:`) giữ
  như cũ, theo mẫu `Rājā āha—` đang chia 80 khoá của tầng.
  Số dùng lại: `Na hi, bhante` → *Không phải vậy, thưa tôn giả* (155 khoá Pāli trùng
  mẫu này trong mil, bản này khớp đa số); `Evameva kho, mahārāja` → *Cũng vậy, này Đại
  vương* (196 khoá Pāli, bản này khớp); `Kallosi…` giữ như cũ.
