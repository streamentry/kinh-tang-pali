  Sửa lan 2026-10-13: khoá `ja199:0.3` (`Ruhakavagga`): *Phẩm Dây Leo* → *Phẩm Ruhaka*. Căn cứ: bài đầu
  của phẩm là `ja191` `Ruhakajātaka`, tên bài đã dịch *Kinh Ruhaka* (tên riêng), `ja191:1.1` đọc `ruhaka`
  là hô ngữ *Này Ruhaka*; `jiyā` ở `ja191:1.2` là *dây cung* nên nghĩa *dây leo* không có căn cứ trong
  Pāli. Tiền lệ: `ja192`–`ja198:0.3` đều *Phẩm Ruhaka* (7/7 bài của phẩm đã sửa). BẤT ĐỊNH: nghĩa của
  `ruhaka` không phân xử được từ tầng Pāli đã ghim (không có bản Anh), nên chọn phiên âm để không khẳng
  định nghĩa. Ngoài lát này, `ja191:0.3`, `ja200:0.3` còn *Phẩm Dây Leo* và `ja200:3.2` còn *Phẩm Thằn
  Lằn thứ năm* — cần thống nhất.

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 6 khoá chênh lệch lớn nhất (trên 15 khoá) → khác nghĩa 2: sửa 0, giữ 1, bất định 1. Giữ 1: `2.3` `dve māse saṅgaraṁ katvā` (“lập lời hẹn hai tháng” và “hẹn ước hai tháng” cùng nghĩa). Bất định 1: `1.3` `yācāyaṁ koṭṭhamotiṇṇā` (bản mù đọc “việc xin xỏ này đã vào kho thóc” và đánh dấu không chắc; bản dự án đọc `yā ca ayaṁ` với `otiṇṇā` giống cái và tiền lệ `ja212:2.3`, như đã ghi ở trên, nên giữ “người nữ này”, nhưng không có bản đối chiếu độc lập nào phân xử được). Các khoá còn lại (`0.4`, `1.4`, `3.1`) chỉ khác diễn đạt hoặc tên. Không có bản Anh hay bản Việt độc lập khác nên `triangulation` chỉ 7,4.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản Anh, bản Việt nguyên bài hay đoạn song song): sửa 1 khoá — `2.2` `kadare appasmi jīvite`: cụm định vị cách tuyệt đối (*khi đời sống …*), bản cũ *"trong đời sống khốn khó và ngắn ngủi"* chọn nghĩa thời gian *ngắn ngủi* cho `appa`; trong mạch kệ (món nợ thịt bò gầy hẹn hai tháng, bị đòi trước hạn) `appa` đi với `kadara` nói cảnh thiếu thốn, nên dịch theo nghĩa gốc *ít ỏi*: *"khi đời sống khốn khó, ít ỏi,"*. Bất định: `jīvita` ở đây là *đời sống* hay *sinh kế* — giữ chữ chung. Giữ 14 khoá; bất định `1.3` `yācāyaṁ` (= `yā ca ayaṁ`) như ghi trước.

