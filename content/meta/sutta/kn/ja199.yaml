  BẤT ĐỊNH CÒN LẠI (không đưa vào thân kinh):
  - Pāli trong tầng chỉ có phần kệ, không có phần văn xuôi mở đầu; hoàn cảnh bài (ai là người
    nữ, ai là người nói, thịt bò già gầy dùng vào việc gì) KHÔNG suy được từ Pāli đã ghim, nên bản dịch
    giữ nguyên mức mơ hồ của kệ: `2.4` đặt cạnh `2.3` và `2.5` mà không khẳng định `maṁsaṁ` là vật
    đã hẹn hay vật bị đòi.
  - `kadare` đọc là vị trí cách của `kadara` (*khốn khó, tồi tệ*), cùng nhóm với `appasmi jīvite`.
    Không tìm được tiền lệ nào khác trong tầng (0 cặp có `kadare`/`kadara`; `kadariya` là *keo kiệt*
    ở 66 khoá, KHÔNG dùng ở đây vì dạng Pāli khác). Nghĩa chung của câu không đổi nếu đọc khác.
  - `yā cāyaṁ` có thể đọc `yañcāyaṁ` (dị bản PTS); đọc nào cũng ra *việc người nữ này đã vào kho*.
  - `codesi` mang nghĩa *thúc ép / đòi / quở trách* tuỳ bối cảnh; chọn *thúc ép* (trung tính).

