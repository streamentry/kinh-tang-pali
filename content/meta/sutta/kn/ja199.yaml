  các mục cũ ở trên về `gahapati` / `gāmapati` → *gia trưởng*, `jaraggava` → *gầy cơ*, đoạn bàn
  về `1.1–1.2` và `1.4` (*không xứng đáng*), và dòng `terminology` giữ nguyên; các mục về tầng tham
  khảo, tên phẩm/bộ do người điều phối biên tập (`0.2`, `0.3`) vẫn nguyên giá trị.

  LỖI NGHĨA THẬT trong bản cũ: 10/15 khoá (1.3, 1.4, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6 sai nghĩa hoặc đảo chủ
  thể/quan hệ; 0.4 và 3.1 là tên bài dịch bằng chữ Pāli). Cụ thể:
  - `1.3–1.4` `Yācāyaṁ koṭṭhamotiṇṇā, nāddasaṁ iti bhāsati`: bản cũ *«Nàng hay kiêu ngạo với người
    nào thì cứ nói ‘không xứng đáng’»* không có căn cứ trong Pāli. Đọc `yā cāyaṁ` (đại từ quan hệ
    giống cái `yā` + `ca` + `ayaṁ`), `otiṇṇā` giống cái: *người nữ này đã vào kho*; `koṭṭha` = kho,
    cùng nghĩa với `ja212:2.3` `koṭṭhamotiṇṇo`. `nāddasaṁ` = *ta/tôi đã không thấy* (ngôi thứ nhất,
    do người nữ nói), đóng bằng `iti bhāsati`: *nói rằng mình không thấy*. `ubhayaṁ` ở `1.1–1.2`
    chỉ hai việc: vào kho, và nói không thấy. Bản cũ biến cả hai thành một lời trách kiêu ngạo.
  - `2.1` `Taṁ taṁ gāmapati brūmi`: `gāmapati` là hô cách, *trưởng làng*, KHÔNG phải chủ ngữ
    *«Gia trưởng nói với từng người»* (bản cũ đảo người nói/người nghe) và `gāmapati` ≠ `gahapati`
    (gia chủ). `brū` có hai tân ngữ: *ta nói điều ấy với ông*.
  - `2.2` `kadare appasmi jīvite`: hai định ngữ cùng ở vị trí cách: *trong đời sống khốn khó và
    ngắn ngủi*; bản cũ *«Vì sao…»* thêm câu hỏi không có.
  - `2.3–2.5`: `Dve māse saṅgaraṁ katvā` = *đã lập lời hẹn hai tháng* (`saṅgara` = lời hẹn, như
    `ja513:4.3`, `mn131:3.11`); `appattakāle` = *khi chưa đến lúc*; `codesi` là ngôi thứ hai số ít
    (*ông đã thúc ép*). Bản cũ *«mới hai tháng đã trôi qua … ta chết trước khi đến thời hạn»*
    đảo chủ thể (người thúc ép thành người chết) và dịch `appattakāle codesi` thành *chết*, là sai
    nghĩa. `maṁsaṁ jaraggavaṁ kisaṁ` = *thịt bò già gầy* (`jaraggava` = bò già; đã đo tiền lệ:
    `pv8:1.4`, `ja352:1.4`, `thag20.1:9.4` đều *bò già*, `ja286:3.3` *trâu già*: 3 *bò già* / 1
    *trâu già*, không nơi nào *gầy cơ* hay *ta*); bản cũ *«thịt ta gầy cơ, run rẩy»* biến thịt
    bò thành thân người nói và thêm *run rẩy* không có.
  - `2.6` `tampi mayhaṁ na ruccatī`: *việc ấy ta cũng không ưa* (`tam pi` = cũng điều ấy).
  - `1.1–1.2` giữ ý cũ nhưng đổi thuật ngữ cho đúng tiền lệ: `na khamati` → *không chấp nhận
    được*, `na ruccati` → *không ưa* (`mn63:2.5` `na ruccati … nakkhamati` = *không vừa ý và không
    chấp nhận được*; `mn90:17.5` `ruccati ceva khamati ca` = *ưa thích và chấp nhận*).
  - Tên bài `Gahapatijātaka` → *Kinh Gia Chủ* (`0.4`, `3.1`; `translationTitle` khớp): `gahapati` đã
    quen dịch *gia chủ* (9/9 khoá ngoài bốn Nikāya đầu có dạng này; 0 dạng khác), tên cũ *Kinh
    Gahapati* chỉ chép chữ Pāli.

