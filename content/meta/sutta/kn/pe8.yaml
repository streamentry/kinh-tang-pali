    + `15.4` `kiñci vihiṁsati … ayaṁ vihiṁsāchando` dịch đúng chữ ("làm hại"), trong khi `15.5`–`15.9` nêu ý muốn không hại; khoá có vẻ thiếu `a-`/`na`.
