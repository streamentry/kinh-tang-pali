notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pe/pe8_root-pli-ms.json` (1653/1653 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli). Đây là nền tảng thứ tám (`Hārasampātabhūmi`) của Peṭakopadesa, thuộc Trưởng lão Mahākaccāyana (313.7): bài lần lượt áp mười sáu hướng dẫn (hāra) vào các bài kinh và kệ dẫn ra làm ví dụ (thiền ở 1–12; `Kāmesu sattā` ở 13–23; năm triền cái ở 24–37; `Manopubbaṅgamā dhammā` ở 38–54; kinh Mahānāma ở 55–70; `Uddhaṁ adho sabbadhi vītarāgo` ở 71–82; các giới và sự không hối hận ở 83–104; `Yassa selopamaṁ cittaṁ` ở 105–112; Sāriputta và `pathavīsama` ở 113–143; `Channamativassati` ở 143–163; bốn hạng người bóng tối và ánh sáng ở 163–187; `Na taṁ daḷhaṁ bandhanamāhu dhīrā` ở 188–204; `Yañca cetayitaṁ` ở 205–228; `Ayaṁ loko santāpajāto` ở 229–248; người đi xuôi dòng và ngược dòng ở 249–267; `Sotānugatā dhammā` ở 268–280; `Dadato puññaṁ pavaḍḍhati` ở 281–313). Bản Pāli đã ghim của bài này hỏng nặng: nhiều câu là mảnh không có động từ chính, nhiều khoá lặp lại cùng một khuôn mà đứt mạch, và đoạn 306.4–306.12 chen một đoạn kể về các vua Malla ở Kusinārā và hào quang của Đức Phật giống văn chú giải. Vì vậy bản Việt dịch sát chữ, từng mệnh đề, không điền chỗ hỏng bằng điều Pāli không nói.

  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho pe8: tầng `english-sujato` chỉ có chín nhánh `cp dhp iti ja kp snp thag thig ud` dưới `sutta/kn/` (755 tệp), không có thư mục `pe`; chỉ có tệp tên `pe-name_translation-en-sujato.json` (pe8 = "The Stage of Conveying Combined Meaning") không kèm prose của bài. Manifest chỉ liệt kê cho `kn/pe/pe8` đúng một tệp là Pāli root. Đây là `not-published-upstream`, không phải `not-synced`. Lớp `english-project` chưa có tệp nào cho `pe`. Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú. Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.0 (≤ 8.0). Bài này dịch chỉ từ Pāli và từ tiền lệ thuật ngữ của chính tầng dự án (pe1–pe7, pe9, ne1–ne36), cùng hai bài kinh Nikāya mà bài trích lại và đã có bản Việt (`an4.85`, `an4.191`).
  - Coverage English:
    Mẫu số = 1.051 khoá Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`). Sujato phủ 0/1.051 (0/1.653 khoá tổng); coverage English 0%, dưới ngưỡng, nên bài chưa thể `review`/`published`; `reference-gaps.yaml` có entry cũng không cứu được `published` (ngoài phạm vi lát này, không chạm). Không có cách đọc English độc lập nào cho bài này.
  - Tiền lệ cùng bộ (`pe`, `ne`):
    `0.1` "Peṭakopadesa" dùng lại nguyên văn `pe1`–`pe9:0.1`. `0.2` `Hārasampātabhūmi` → "Nền Tảng Hội Tụ Của Các Hướng Dẫn", không đánh số vì Pāli không có số (như `pe7`, `pe9`; `pe1`–`pe6` có số trong Pāli): `bhūmi` → "nền tảng" theo `pe1`–`pe6:0.2`, `hāra` → "hướng dẫn" theo `pe5`, `sampāta` → "hội tụ" (`ne21`–`ne35` dịch `hārasampāta` là "nhóm phương thức", `ne35:0.4` để nguyên Pāli `Samāropanahārasampāta`; không theo vì cả `pe5` lẫn `ne1`–`ne10` dùng "hướng dẫn"); tên Sujato "The Stage of Conveying Combined Meaning" khớp hướng "nền tảng / hướng dẫn / gộp lại". `313.7` kết cùng nhịp "tên chương, trong Peṭakopadesa của Trưởng lão" với `pe4:13.1` và `pe9:65.1`.
    Mười sáu hướng dẫn theo `pe5`: `desanā` "đề ra", `vicaya` "khảo xét", `yutti` "lý luận", `padaṭṭhāna` "nền tảng ứng với", `lakkhaṇa` "đặc trưng", `catubyūha` "bốn phần", `āvaṭṭa` "quy căn", `vibhatti` "phân loại", `parivattana` "chuyển đổi", `vevacana` "ngữ đồng nghĩa", `paññatti` "định danh", `otaraṇa` "dẫn đưa", `sodhana` "thanh tẩy", `adhiṭṭhāna` "áp dụng", `parikkhāra` "trợ duyên", `samāropana` "gom góp". Đo trên tầng `ne` và `pe` (trừ `pe8`): `hāra` → "hướng dẫn" 99/180 khoá so "nhóm" 37/180 (`ne1`–`ne10` và `pe5` dùng "hướng dẫn", `ne21`–`ne35` dùng "nhóm phương thức"); `padaṭṭhāna` → "nền tảng ứng với" 189/208; `paññatti` → "định danh" 76/79; `vevacana` → "ngữ đồng nghĩa" 49/60; `otaraṇa` → "dẫn đưa" 52/62.
  - Pāli trùng nguyên văn:
    Trong chính bài: 58 nhóm Pāli trùng nguyên văn (153 khoá thừa so với bản đầu tiên của mỗi nhóm, ngưỡng ≥ 15 ký tự), cả 58 nhóm bản Việt giống nhau; 0 cặp Việt khác. Ngoài bài: dò 1.653 khoá với toàn bộ Pāli đã ghim (`dn`, `mn`, `sn`, `an`, `kn`): 86 khoá (36 văn bản Pāli khác nhau, ngưỡng ≥ 15 ký tự) có Pāli trùng ở bài khác; 83 khoá trong đó có bản Việt ở phía kia, tổng 166 cặp, 96 cặp giống và 70 cặp khác. Với `pe1`–`pe7` (73 khoá): 0 cặp khác, dùng lại nguyên văn (`0.1`; các câu hỏi hướng dẫn của `pe5`; `61.8` với `pe1:139.8`; `6.1`, `70.1`, `229.1`, `299.1` với `pe2`/`pe5`; `120.1` và các "Một phương diện khác." với `pe6:63.1`). 68 cặp khác đều với `ne*`: `ne` dịch `Tattha katamo X hāro?` là "Ở đây, nhóm X hướng dẫn là gì?" và `cattāri saccāni` là "bốn sự thật", còn `pe5` và `pe1` dịch "Trong đó, hướng dẫn X là gì?" và "bốn chân lý" (`saccāni` → "chân lý" 27/59, "sự thật" 20/59 trên `ne`/`pe`); chọn theo `pe` vì cùng bộ. 2 cặp khác ở kệ: `281.1` với `ud8.5:23.1` và `47.3` với `sn10.2:4.1`, giữ theo `pe2:30.1` và `pe2:6.3` (cùng bộ, cùng Pāli của hai câu kệ).
