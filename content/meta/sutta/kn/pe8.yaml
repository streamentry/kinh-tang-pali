  - Số Pāli:
    `cattāri jhānāni` 4; `tayo vitakkā` 3; `pañca nīvaraṇā` 5 (28.2 `dasa bhavanti` 10); `pannarasa padāni` 15 (71.6, 71.10, 83.3, 236.4, 241.3) và `vīsativatthukā` 20 (71.10, 55.18 `vīsati`); `ekasaṭṭhi diṭṭhigatāni` 61 (28.7, 55.13); `dasa asekkhā arahattadhammā` 10 (90.7, 91.2, 250.20); `satta anusayā` 7 (221.3), `sattannaṁ saṁyojanānaṁ` 7 (254.1); `bāvīsatindriyāni` 22 (138.2); `chattiṁsa` 36 và `cha` 6 (50.18); `aṭṭhārasa manopavicārā` 18 (42.1) và `aṭṭhārasa dhātuyo` 18 (109.2); `ekādasa padāni` 11 (98.2, 102.2) và `sattahi upanisāsampattīhi` 7 (98.2); `asītihatthaṁ` 80 và `dvattiṁsa` 32 (306.11–306.12), `yojanasatiko` 100 (306.12); `pañcānisaṁsā` 5 (268.1, 291.3); `aṭṭha micchattāni`, `aṭṭha sammattāni` 8 (173.4–173.5, 303.3); `pañca verāni` 5 (303.3); `aṭṭha dānāni` 8 (311.2). Các số không khớp mục kèm theo ngay trong Pāli đã giữ đúng như Pāli: `87.2` `catubbidhā` (bốn loại) nhưng chỉ nêu ba mục (`asubhato dukkhato anattato`); `113.1` `dve pajāni` (hai điều) nhưng nêu ba điều; `188.4` `catūhi kāraṇehi` (bốn nguyên nhân) nhưng nêu năm mục; `268.4` `pañcannaṁ puggalānaṁ` (năm hạng người) nhưng nêu bốn hạng; `71.8` `pañcasatāni` ("năm trăm") trong khi `71.10`–`71.11` cộng được mười lăm với năm thành hai mươi, nên có thể là `pañca padāni`; dịch đúng chữ "năm trăm", không đổi. Bài không có số lớn; không có cụm cần phân xử.
  - Chỗ bất định (không thêm vào thân kinh):
    + `ajhāniyā jhāyino`/`ajhāniyajhāyī` (1.7, 11.8–11.10) dịch "người thiền theo lối không thuộc thiền" nhất quán 6 chỗ; `kalaṅkajjhāyī` "người thiền có vết nhơ" (11.7, 11.10). `1.11` `abhinisābhūmi` là từ chỉ gặp một lần, giữ nguyên Pāli. `4.4` `akammassa vihāritā` theo `pe2:33.5` ("không có nghiệp sự").
    + `6.5` `passavatā`/`apassavatā` đọc là "có/không có sự tuôn chảy" (nếu là `pa-sava`). `8.3` `pīti parajjato` "hỷ do bị nhiễm đắm" và `na palibodhadukkhatāya` giữ chữ `na` ("và không phải"), dù `9.5` nêu cùng bốn tính khổ mà không có `na`. `10.3` từ ghép `anudayamettājhānakalānudanukalāya` đọc rời từng thành phần, chưa chắc.
    + `15.4` `kiñci vihiṁsati … ayaṁ vihiṁsāchando` dịch đúng chữ ("làm hại"), trong khi `15.5`–`15.9` nêu ý muốn không hại; khoá có vẻ thiếu `a-`/`na`.
    + `18.3` `pāko` → "sự nung nấu", `18.5` `parimutto` → "đã hoàn toàn giải thoát" giữ đúng chữ dù ngữ cảnh gợi nghĩa ngược. `25.8` `kasathamī` không phân tích được, giữ nguyên chữ Pāli.
    + `29.7`–`29.8` cấu trúc câu (`ti` không có nháy mở) đọc như lời nghĩ của người nói; không thêm nháy. `36.8` `assādiyākindriyaṁ` dịch "căn đáng nếm vị", chưa chắc.
    + `52.4`, `52.12`, `54.2` là chuỗi mảnh không nối được, dịch từng mảnh. `55.18` `ko sakkāyādhīnā na niveso`; `56.1` `sotāpattaṅgamadukkhāyaṁ bhūmiyaṁ`; `56.6` `yatikena`.
    + `57.4` `assa bho kukkurā` dịch "này những con chó" đúng chữ. `71.15`, `75.10` câu dài đứt mạch.
    + `80.5` `te appahīyanti` dịch "không được đoạn trừ" đúng chữ, trong khi `79.2` có `tehi pahīyanti`; có thể là `te pahīyanti`.
    + `86.25` `pañcaṅgikaṁ tatiyaṁ jhānaṁ` giữ "năm chi" cho thiền thứ ba; `86.26` `parāvidhāna` "sắp đặt cho điều khác".
    + `87.12` `sopaniyāhārīni` "mang theo sự dẫn đến"; `88.1` `bujjhakāradhikaṁ`; `88.14` chuỗi `rahitehi aṅgehi … cakkhusamathapathaṁ`.
