 khoảng trống không chật hẹp; sn2.7:2.1–2.3, an9.42); `114.3` purisamedakathālikāsu (người nam và bát mỡ; an9.11:11.1, 12.1). Đổi 9 khoá (11.7, 11.8, 11.10, 15.4, 25.8, 57.4, 87.2, 114.3, 306.12); chú thích ở content/comment/vi/project/sutta/kn/pe8_comment-vi-project.json: thêm 11.8, 15.4, 25.8, 57.4, 87.2, 114.3, 306.12, nối vào 11.7, 11.10, cập nhật câu cuối 306.4. Không đổi status, quality, blocking_errors; còn locus chưa gỡ nên bài giữ draft, không chấm lại.
