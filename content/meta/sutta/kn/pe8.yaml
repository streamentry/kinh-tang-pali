    + `29.7`–`29.8` cấu trúc câu (`ti` không có nháy mở) đọc như lời nghĩ của người nói; không thêm nháy. `36.8` `assādiyākindriyaṁ` dịch "căn đáng nếm vị", chưa chắc.
