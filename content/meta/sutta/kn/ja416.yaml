  (`taṃ sākhamakampayi`) tôi **không biết** đó vẫn là ẩn dụ *cành cây* hay là **tên riêng**
  *Sākha* của một nhân vật. Tôi chọn phương án ít giả định nhất — giữ *cành cây* ở mọi nơi để
  bài nhất quán với `1.3` và không tự đặt tên riêng; hệ quả là `7.3` đọc thành *bỏ ta lại bằng
  những cành cây*, và đó là điểm tôi ít chắc nhất. Nếu `Sākha` là tên riêng thì `7.1`–`7.4` phải
  dịch khác. Đây là lý do bài giữ `draft`.
  (2) `2.1`–`2.2` `Bhīruyā nūna me kāmo, avidūre vasantiyā` — `kāmo` là *khoải ham* và `kāma`
