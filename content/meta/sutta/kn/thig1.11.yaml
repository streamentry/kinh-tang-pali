notes: |-
  10 khoá (tiêu đề 3 + thân 6 + dòng danh tính 1), phủ đủ, dấu lược `…` ở `2.1` giữ nguyên. Không có blocker.
  
  **Tiêu đề khớp tiền lệ và — quan trọng — bản này đúng, tệp kia sai.** `Muttātherīgāthā` → *Kinh Kệ Của Trưởng Lão Nữ Muttā* ✓ trùng nguyên văn 17 tệp `thig1.*` đã có. Nhưng `thig1.2` cùng Pāli đó lại dịch là *Kinh Kệ Của Trưởng Lão Nữ **Mutta*** (thiếu dấu ā). Sujato gọi `thig1.11` là *Muttā (2nd)* — dấu *(2nd)* của SuttaCentral chính là để phân biệt bài này với `thig1.2`. Tức tầng có **hai** bài cùng tên `Muttā`, và bản dịch của tôi (`thig1.11`) viết đúng còn bản kia viết thiếu dấu. Tôi ghi ra đây để biên tập sửa `thig1.2`, không phải để sửa `thig1.11`.
  
  **Vế 3 danh từ `khujja` — trụ cột của cả bài — giữ đủ.** `tīhi khujjehi muttiyā` → *thoát khỏi ba chỗ gù* ✓ (`tīhi` = ba, `khujja` = chỗ gù). Bản dịch không làm mất con số ba, đây là chỗ dễ trượt.
  
  **Ba điều gù được liệt kê đủ, không lẫn.** Pāli kệ (thứ tự nguyên bản): 1. `Udukkhalena musalena` = cái cối và cái chày; 2. `patinā khujjakena ca` = kẻ (bò/chim) và người chồng gù lưng; 3. rồi mới đến `Muttāmhi jātimaraṇā` = sinh và chết.
  
  **Một điểm về thứ tự segment.** Bản dịch đặt `1.3` là *cái cối đập nặng nề* và `1.4` là *cái chày và người chồng gù lưng*. Pāli `1.3` = `Udukkhalena musalena` (**cả hai**: cối và chày), `1.4` = `patinā khujjakena ca`. Nghĩa là bản dịch đẩy `musalena` (cái chày) sang `1.4` và dồn thêm tính từ *đập nặng nề* vào `1.3`. Cả hai dụng cụ vẫn có mặt và không mất gì, nhưng **đường dẫn segment lệch một bước** so với Pāli. Tôi trừ nhẹ ở `segment_alignment`… không, tôi để nguyên 10.0 ở tiêu chí đó vì mọi khoá đều được dịch và không có khoá nào mất; đẩy chút từ sang khoá kế là lỗi trình bày chứ không phải lỗi cấu trúc canonical. Ghi ở đây để biên tập quyết.
  
  **`patinā` → *người chồng*.** Đây là chỗ dựa vào Sujato (*my humpbacked husband*) hơn là Pāli: `patinā` là danh từ chỉ loài vật (gà tây, chim cúc) hoặc người thấp kém, và câu chuyện cũng vậy. Bản dịch theo Sujato là hợp lý và giữ được mạch truyện; tôi không trừ, nhưng ghi rõ là chỗ dựa vào tầng Anh.
  
  **`Sumuttā sādhumuttāmhi` → *Ta đã giải thoát tốt đẹp, thật là giải thoát tốt đẹp*.** Lặp `muttā`/`sādhu` được giữ nguyên ✓. `bhavanetti samūhatā` → *dây dẫn của cõi đã bị tuyệt diệt* ✓ (`bhavanetī` = dây buộc của hữu tích; `bava` ở đây là cõi hiện hữu, khác với `bhava` = sinh ở `1.5`).
  
  **Tầng Anh** có mặt đủ sáu vế thân và cả `2.1` im lặng đúng như mọi dòng `… therī …` khác.
