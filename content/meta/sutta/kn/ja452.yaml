notes: |-
  **Đo lại ba mệnh đề của lát.** `0.1` → **Jātaka** (400/416). `0.2`
  `Dasakanipāta` → *Bộ Mười Bài Kệ* (0 tiền lệ thật — xem `notes` của `ja439`). `0.3`
  `Catudvāravagga` → *Phẩm Bốn Cửa* (0 tiền lệ thật).
  Kinh tên: `bhūripaññā` có **6 tiền lệ** trong tầng, và cả sáu đều dịch theo nghĩa
  *trí tuệ rộng lớn* / *Đại Tuệ* / *bậc có trí tuệ rộng lớn*; tôi dùng *Kinh Trí Tuệ Rộng
  Lớn*. `11.1` theo 383 cặp đã có; `cuddasamaṁ` → *thứ mười bốn* nối theo `ekādasamaṁ`
  → *thứ mười một*.

  **Trùng nguyên văn — 9 khoá, và một chỗ phải chọn giữa hai tiền lệ mâu thuẫn.**
  - `9.1–10.4` là tám câu kệ giống hệt `ja351:4.1–5.4` **và** `ja332:3.1–4.4`. Hai bản
    này **khác nhau** ở cả tám câu, nên tôi phải chọn: tôi dùng nguyên văn **`ja351`**
    vì nó giữ đúng lặp `na sādhu` bốn lần cho bốn câu `… na sādhu` của Pāli và giữ đúng
    thứ tự, còn `ja332` đảo hai vế ở `4.2` và đổi `gāmaṁ` thành *muôn dân*. **Cảnh báo
    cho người gộp:** `ja332` hiện vẫn mang cách dịch khác ở đúng tám câu này; chỗ này
    đã có **2 cách cho cùng một Pāli** trong tầng và lát này không xử lý được vì
    `ja332`/`ja351` không thuộc lát tôi.
  - `6.1` `“Yena kenaci vaṇṇena,` → nguyên văn `ja406:4.1`.

  **Câu tôi phải tự quyết.**
  - `1.4` `Yo yavakaṁ bhuñjasi appasūpaṁ`: `yavaka` có tiền lệ trong tầng là *lúa
    mạch / cỏ yava*; `appasūpa` = *không hợp thể trạng*. Tôi dịch *sao ngươi lại ăn loại
    lương thực không hợp thì?*.
  - `2.1`–`2.2` `Sukhaṁ dukkhena paripācayanto / Kālā kālaṁ vicinaṁ chandachanno`: tôi
    hiểu là người kia trộn thứ khổ vào thứ ngọt và nhặt hạt mè, trộn cả dầu mỡ. Đây là
    cách đọc của tôi; `chandachanno` = *phủ dầu mỡ* thì chắc, nhưng mối quan hệ giữa hai
    vế thì không.
  - `3.2` `Mantehi`: tôi dịch *dùng tài trí* (ý nghĩa tích cực của *manta* = kế hoạch,
    cách làm), không phải *mẹo độc hại*.

  **Dấu lược:** 0/45 khoá có `…pe…`.

  **Không có tầng Anh.** 0/45; `ja452` không nằm trong 83 tệp `ja` đã ghim.

  **Giải quyết draft 2026-10-12.** *Mục này thay thế các mục "Câu tôi phải tự quyết" và
  "Trùng nguyên văn — 9 khoá" ở trên (các cách đọc `yavaka`/`appasūpa` = "không hợp thì",
  "nhặt hạt mè", "phủ dầu mỡ", "dùng tài trí" đều sai; riêng "Kinh Trí Tuệ Rộng Lớn" và
  tiêu đề/`11.1` giữ nguyên).* Đọc đối kháng toàn 45 khoá từ Pāli: **26/45 khoá có lỗi nghĩa
  thật** (1.1–1.4, 2.1–2.4, 3.1, 3.3, 3.4, 4.3, 4.4, 5.3, 5.4, 6.1, 7.1–7.4, 8.1–8.4, 9.4)
  và 8 khoá sửa nhẹ (5.1, 6.3, 6.4, 9.2, 9.3, 10.1, 10.2, 10.4); bản cũ có nhiều chỗ bịa
  nghĩa (*việc ngươi được huấn luyện*, *nhặt hạt mè*, *làm kẻ nhút nhát thêm nhút nhát*,
  *đừng mong quả của nó*, *bức pháp*…).
  - **1.3** `na tāyate bhāvavasūpanītaṁ`: đọc là `tāyate` + `abhāva-vasa-upanītaṁ` (nguyên âm `a`
    đầu bị lược theo sandhi `-e a-`) → *chẳng che chở được ngài, kẻ đã bị đưa vào tay cảnh thiếu
    thốn*, khớp `yo yavakaṁ bhuñjasi appasūpaṁ` (*ăn lúa mạch với ít canh*) và tiền lệ
    `pāsavasūpanītaṁ` (ja491:3.3, 4.3) = *đã bị đưa vào tay …*. `yavaka` = *lúa mạch* (sn35.248),
    `yavodana` = *cơm lúa mạch*, `sūpa` = canh/nước sốt. Hô cách `bhūripañña` (1.1) trước kia bị bỏ.
  - **2.1–2.4** `sukhaṁ dukkhena paripācayanto` = *dùng nỗi khổ làm cho an lạc chín muồi*;
    `avāpuranto` = *mở ra* (không phải "chẳng bước vào"); `dvārāni` = *cánh cửa* (khớp tên phẩm
    Catudvāra); `tenāhaṁ tussāmi yavodanena` = *vì thế ta hài lòng với cơm lúa mạch*.
  - **3.x** `mantehi atthaṁ paripācayitvā` = *dùng các kế sách làm chín muồi mục đích*;
    `vijambhissaṁ sīhavijambhitāni` = *ta sẽ vươn mình như sư tử vươn mình* (ngáp/vươn
    vai của sư tử, cf. dn24:2.6.5); `tāyiddhiyā dakkhasi maṁ punāpi` = *nhờ uy lực ấy, ngài sẽ
    lại thấy ta*.
  - **4.x** `sukhīpi heke … avaṇṇasaṁsaggabhayā puneke` = *có người dù an vui cũng không làm ác,
    có người vì sợ vướng lời chê trách*; `pahū samāno vipulatthacintī` = *có khả năng, nghĩ đến
    mục đích lớn lao* (bản cũ *tuy nhiều … tư tưởng rộng lớn* sai); `kiṅkāraṇā me na karosi
    dukkhaṁ` = *vì cớ gì ngài không làm cho ta khổ*.
  - **5.x** `chandā ca dosā na jahanti dhammaṁ` = *không bỏ pháp vì ưa thích hay sân hận*
    (chanda + dosa như hai thiên vị `agati`, pe9:15.1); `khalitāpi` = *vấp ngã* (ja486:7.1,
    thag1.45).
  - **6.1–6.4** `vaṇṇena` = *bằng cách* (không phải "duyên cớ"; khớp ja547:762.1 *Bằng bất cứ
    cách nào*); `uddhare dīnamattānaṁ` = *nên cứu lấy bản thân đang khốn khổ*.
  - **7.1–7.4** Pāli trùng nguyên văn **5 bài** (ja528:30, ja538:10, ja546:233, ja493:17,
    pv21:3), cả 5 đều dịch *Dưới bóng cây nào / người ta có thể ngồi hoặc nằm, / không nên bẻ cành
    của cây ấy, / vì kẻ phản bạn là kẻ xấu ác.* → dùng lại nguyên văn (0/5 khác).
  - **8.1–8.4** gần như trùng ja537:101 (`yasmā` ↔ `yassāpi`, còn lại giống): dùng cùng cách
    dịch *dẹp bỏ nghi hoặc*, *hòn đảo và nơi nương tựa* (`dīpa`, cả ja537:101.3, ja546:98.2,
    sn43.40), *chớ để tình bạn … bị hao mòn*; bản cũ *ngọn đèn/phương tiện*, *khó khổ với họ* sai.
  - **9.1–10.4** tám câu kệ trùng ja351:4–5, ja505:19–20, ja332:3–4 (3 bài, **3 cách dịch**, ja351 =
    ja505). Giữ ý của ja351/ja505 nhưng sửa những chỗ không có trong Pāli: `yo paṇḍito kodhano` =
    *bậc trí mà hay phẫn nộ* (bỏ "mang danh"), `nānisamma` = *chớ hành động khi chưa suy xét*
    (bỏ "hấp tấp"), `vaḍḍhati` = hiện tại *tăng trưởng* (bỏ "sẽ hằng"), `khattiya` = *Sát-đế-lợi*
    (718 tiền lệ; ja351/ja505 viết "quân vương" = thêm nghĩa), `yaso kitti` = *danh xưng và tiếng
    tăm* (an4.31, an4.34). **Cảnh báo cho người gộp:** ja351, ja505 và ja332 còn mang các chỗ
    lệch trên và 3 cách dịch khác nhau cho cùng Pāli; không thuộc lát này.
  - Đại từ: người nói không được nêu trong Pāli; giữ *ngài* cho `tvaṁ` và *ta* cho `ahaṁ`,
    *tâu đại vương* ở 10.3 (vocative `rāja`). Đây là lựa chọn lịch sự trung tính, không khẳng
    định địa vị hai người nói.

  **Bất định còn lại (không thêm vào thân kinh).**
  - `abhijīhanāya` (3.1): từ hiếm, không tìm được tiền lệ nào trong tầng Pāli (0 lần ở nơi khác);
    dịch *để vượt lên* theo ngữ cảnh (kế sách → thời điểm → vươn mình như sư tử); phổ nghĩa
    (vượt thắng / vươn lên / bật ra) đều tương hợp với cả câu nên không đổi ý kệ, nhưng chưa
    được xác nhận bằng nguồn ngoài.
  - `chandachanno` (2.2): đọc là *giấu kín ý muốn* (chanda = ý muốn, channa = che giấu, đa
    hợp); khả năng khác là *bị ý muốn che lấp*. `kālā kālaṁ vicinaṁ` đọc là *xét chọn thời cơ*
    (có thể là *kāla* + *akāla*, hoặc *từng lúc*); cả hai cho cùng ý.
  - `abhāva` ở 1.3 là phục dựng sandhi (xem trên); nếu đọc `bhāva` nguyên, câu mất nghĩa.
  - 4.4 *làm cho ta khổ*: người nói/ người nghe không nêu trong Pāli nên không xác định được
    ai chịu khổ do ai; giữ sát chữ.
  Các bất định này ở mức từ, không đổi giáo nghĩa; `ambiguity_integrity` 8.2,
  `grammar_logic` 8.6.

  **Blocker.** Đã gỡ blocker "`vietnamese-current` chỉ có Pháp Cú": đó là giới hạn của tầng tham
  khảo chứ không phải lỗi văn bản; vẫn ghi ở đây: không có bản Hòa thượng Thích Minh Châu cho bài
  này. Giữ blocker thiếu tầng Anh Sujato upstream (sự thật về bản chụp đã ghim; 0/45 khoá có English).
  Đối chiếu thực tế: Pāli + 5 bài trùng 7.x + ja537:101 + sn10.2/ja547:762 (`yena kenaci vaṇṇena`)
  + 0 bản Anh/Việt hiện hành ⇒ `triangulation` 7.4 (≤ 8.0). Số: 0/45 `…pe…`; tập khoá khớp Pāli
  45/45; dấu nháy kép `“”` khớp Pāli từng khoá.

  **Kiểm kỹ thuật.** `technical_integrity` 9.6: chưa chạy `npm run validate`, `npm test`,
  `npm run check`, `npm run build` trong lượt này.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 16 khoá chênh lệch lớn nhất → khác nghĩa 3: sửa 0, giữ 1 (1.3: bản mù đọc `bhāva` nguyên và dịch "(vậy mà) điều ấy chẳng che chở khi đã rơi vào quyền lực của hoàn cảnh"; Pāli `tāyatebhāvavasūpanitaṁ` phải tách `tāyate` + `abhāva-vasa-upanitaṁ` (sandhi -e a-), khớp `yo yavakaṁ bhuñjasi appasūpaṁ` ở 1.4, nên giữ "cảnh thiếu thốn"), bất định 2 (2.2 `kālā kālaṁ vicinaṁ chandachanno`: bản mù cũng đánh dấu không chắc và dịch "được che giấu bởi ý muốn"; 3.1 `abhijīhanāya`: bản mù "vươn lên", bản này "vượt lên"; cả hai là từ hiếm, không xác lập được; phổ nghĩa đều hợp cả câu). 13 khoá còn lại chỉ khác diễn đạt hoặc cách đặt tên (0.2, 0.4, 11.1: "Chương Mười"/"Chuyện Tiền thân" không khác nghĩa; `Dasakanipāta` giữ "Bộ Mười Bài Kệ" theo ja439). Đọc đối kháng lại toàn 45 khoá: không phát hiện lỗi mới (nháy kép khớp Pāli, không có `…pe…`, xưng hô "ngài/ta" nhất quán). Chưa chắc: 8.1–8.2 `yassāpi dhammaṁ … ye cassa kaṅkhaṁ vinayanti santo` (chủ ngữ số nhiều `ye` rồi `taṁ` số ít), giữ như ja537:101. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; đoạn song song ja332:3–4, ja351:4–5, ja537:101, pv21:3.3): sửa 3 khoá — 1.3, 1.4 "kẻ" → "người" (người hỏi tôn kính bậc trí, xưng "ngài"; "kẻ" lệch sắc thái), 1.4 bỏ dấu chấm thừa sau "?”" cho khớp 4.4; 8.1 `yassāpi dhammaṁ puriso vijaññā` "hiểu được pháp của vị nào" → "nhờ vị nào mà hiểu được pháp" (sở hữu cách chỉ nguồn học, như ja537:101.1 `yasmā` "nhờ ai mà hiểu"; bản cũ có thể đọc thành pháp thuộc về vị ấy).
  Giữ 4.4 "làm cho ta khổ": người hỏi nhiều khả năng là nhà vua, vì lời đáp 7.x (không bẻ cành cây đã cho mình bóng mát; phản bạn là ác) và 9–10 (`rāja`, `disampati`) đều nói với người đã che chở bậc trí — nên `me` hiểu là "cho ta" đứng được. Vẫn là suy từ ngữ cảnh, chưa có nguồn ngoài. Bất định còn lại như mục trước: 2.2 `chandachanno`, 3.1 `abhijīhanāya`, 8.1–8.2 số nhiều `ye`/số ít `taṁ`.
