notes: |-
  **Đo lại ba mệnh đề của lát.** `0.1` → **Jātaka** (400/416). `0.2`
  `Dasakanipāta` → *Bộ Mười Bài Kệ* (0 tiền lệ thật — xem `notes` của `ja439`). `0.3`
  `Catudvāravagga` → *Phẩm Bốn Cửa* (0 tiền lệ thật).
  Kinh tên: `bhūripaññā` có **6 tiền lệ** trong tầng, và cả sáu đều dịch theo nghĩa
  *trí tuệ rộng lớn* / *Đại Tuệ* / *bậc có trí tuệ rộng lớn*; tôi dùng *Kinh Trí Tuệ Rộng
  Lớn*. `11.1` theo 383 cặp đã có; `cuddasamaṁ` → *thứ mười bốn* nối theo `ekādasamaṁ`
  → *thứ mười một*.

  **Trùng nguyên văn — 9 khoá, và một chỗ phải chọn giữa hai tiền lệ mâu thuẫn.**
  - `9.1–10.4` là tám câu kệ giống hệt `ja351:4.1–5.4` **và** `ja332:3.1–4.4`. Hai bản
    này **khác nhau** ở cả tám câu, nên tôi phải chọn: tôi dùng nguyên văn **`ja351`**
    vì nó giữ đúng lặp `na sādhu` bốn lần cho bốn câu `… na sādhu` của Pāli và giữ đúng
    thứ tự, còn `ja332` đảo hai vế ở `4.2` và đổi `gāmaṁ` thành *muôn dân*. **Cảnh báo
    cho người gộp:** `ja332` hiện vẫn mang cách dịch khác ở đúng tám câu này; chỗ này
    đã có **2 cách cho cùng một Pāli** trong tầng và lát này không xử lý được vì
    `ja332`/`ja351` không thuộc lát tôi.
  - `6.1` `“Yena kenaci vaṇṇena,` → nguyên văn `ja406:4.1`.

  **Câu tôi phải tự quyết.**
  - `1.4` `Yo yavakaṁ bhuñjasi appasūpaṁ`: `yavaka` có tiền lệ trong tầng là *lúa
    mạch / cỏ yava*; `appasūpa` = *không hợp thể trạng*. Tôi dịch *sao ngươi lại ăn loại
    lương thực không hợp thì?*.
  - `2.1`–`2.2` `Sukhaṁ dukkhena paripācayanto / Kālā kālaṁ vicinaṁ chandachanno`: tôi
    hiểu là người kia trộn thứ khổ vào thứ ngọt và nhặt hạt mè, trộn cả dầu mỡ. Đây là
    cách đọc của tôi; `chandachanno` = *phủ dầu mỡ* thì chắc, nhưng mối quan hệ giữa hai
    vế thì không.
  - `3.2` `Mantehi`: tôi dịch *dùng tài trí* (ý nghĩa tích cực của *manta* = kế hoạch,
    cách làm), không phải *mẹo độc hại*.

  **Dấu lược:** 0/45 khoá có `…pe…`.

  **Không có tầng Anh.** 0/45; `ja452` không nằm trong 83 tệp `ja` đã ghim.
