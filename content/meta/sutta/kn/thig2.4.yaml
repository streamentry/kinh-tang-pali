notes: |-
  Đủ 14/14 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Tiêu đề theo đúng dạng Kinh Kệ Của Trưởng Lão Nữ + tên của thig2.5:0.3, thig2.9:0.3, thig2.3:0.3.

  Pāli trùng nguyên văn, dùng lại:
  · `kataṁ buddhassa sāsanan”ti.` → đã làm tròn lời dạy của Đức Phật”ti. (đúng nguyên văn mà TIEN_LE_PHAI.md chỉ định cho thag1.107 và ba bài anh em; ngoài ra còn trùng mn86:18.66 và thig2.6:2.6 trong chính lát này).
  · `Tisso vijjā sacchikatā,` và `kataṁ buddhassa sāsanan”ti.` trùng y hệt thag1.107:1.3–1.4; tầng đang có Tôi đã chứng ngộ tam-minh, (4 bài) và việc dạy của Đức Phật đã hoàn thành (mn86), tôi chọn chuỗi bốn bài vì khớp `sacchikatā` = đã chứng ngộ.
  · `sandhāveyyaṁ punappunaṁ` → hết lần này đến lần khác (đúng nguyên văn snp3.12:10.4).

  Bất định đã ghi nhận — đây là lý do chấm thấp hơn thig2.5 và thig2.6:
  · `nibbindañca virajjahaṁ` tôi tách thành ta cũng chán ngấm, và lình bỏ trần tục. Đây là cách đọc của Sujato (I became dispassionate) cộng với nghĩa chữ của virajjha là không còn bụi (trần tục). Nhưng `ahaṁ` có thể là tân ngữ của cả hai vế, nên còn một cách đọc là ta chán ngấm và được coi là vô lỗi. Tôi giữ cách đọc của Sujato vì nó hợp với lời cầu ở 2.3–2.4, và ghi rõ ở đây thay vì giấu.
  · `Yāva kāsijanapado, / suṅko me tatthako ahu` — Sujato đảo hai vế (The price for my services / amounted to the nation of Kāsi), tức Sujato cũng cho rằng đây là câu đề giá của Aḍḍhakāsi. Tôi dịch theo thứ tự Pāli: Từ Kāsi cho đến tận cùng xứ, / đó là giá công của ta. Sở dở còn lại là `yāva` là so sánh còn hay là phạm vi trả giá; tôi đọc là phạm vi.
  · `Taṁ katvā negamo agghaṁ` — Pāli lặp chữ aggha hai lần; tôi giữ nguyên sự lặp đó (Đặt giá ấy làm giá, ta đi không đòi giá) thay vì làm câu trôi hơn. Đây là lựa chọn có chủ ý, ghi lại để reviewer có thể bác.

  Đối chiếu tầng tham khảo: Sujato có 13/14 khoá, im lặng đúng khoá dòng kết (21 ký tự); vế 1.1 và 1.2 bị Sujato đảo trong tệp đã ghim (sujato:1.1 = Pāli 1.2, sujato:1.2 = Pāli 1.1), tôi đã đối chiếu từng cặp và theo Pāli. Mọi khoá Pāli dưới 40 ký tự nên mẫu số coverage rỗng, không cần ghi reference-gaps.yaml. Bản Việt hiện hành không có cho Trưởng Lão — giới hạn của bản chụp upstream, nên triangulation chỉ 8.6.

  Kiểm thủ công trên TOÀN BỘ 14 khoá (kiểm() rỗng vì không khoá Pāli nào từ 40 ký tự): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược khớp (khoá 3.1 có 2 ở cả hai phía), nháy kép cân (mở 1.1, đóng 2.6), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.
