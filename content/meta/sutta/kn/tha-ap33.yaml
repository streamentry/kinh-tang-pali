notes: |-
  Bản dịch tiếng Việt mới cho tha-ap33, Kuṇḍadhānattheraapadāna — bài kệ của trưởng lão Kuṇḍadhāna, bài thứ nhất của Kuṇḍadhānavagga. Đủ 69/69 khoá, thứ tự và tập khoá khớp Pāli.

  Nội dung: ở kiếp quá khứ, thời Đức Padumuttara, người kể hầu cận Ngài suốt bảy ngày Ngài độc cư; khi Ngài xuất khỏi độc cư thì dâng một buồng chuối lớn (1.1–2.4). Đức Thế Tôn thọ dụng rồi nói những bài kệ thọ ký (5.1–10.4, trong dấu nháy đơn): vị ấy mười một lần làm vua chư thiên, ba mươi bốn lần làm Chuyển Luân Vương; sau một trăm nghìn kiếp, trong giáo pháp của Gotama, sẽ là đệ tử tên Kuṇḍadhāna, và do quả báo của việc mắng nhiếc các sa-môn có giới hạnh, không còn lậu hoặc mà có được tên gọi ấy. Từ 11.1 là lời tự thuật của ngài ở kiếp cuối: nhận thẻ trước tiên (12.1–13.4) nên được Đức Thế Tôn đặt vào chỗ tối thượng (14.4), khớp với danh hiệu nhận thẻ đầu tiên ở an1.211.

  Tên bài và thể thức :0.3 — đo trước khi chọn:
  - translationTitle bằng đúng giá trị khoá :0.3 trong bản dịch. Pāli :0.3 (Kuṇḍadhānattheraapadāna) KHÔNG bắt đầu bằng số nên không giữ số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số); số thứ tự không có ở :0.3 lẫn translationTitle.
  - Hình thức đầu tên: đo trên các :0.3 đã dịch của phẩm tha-ap trong cây này, Tuyên Ngợ 236 (cộng 10 khoá Tuyên Ngợi), Tuyên Ngôn 105, Ký Sự 99; ở phạm vi gần nhất (Kuṇḍadhānavagga, tha-ap34 và tha-ap38–42) Tuyên Ngôn 3, Tuyên Ngợ 2, Ký Sự 1. Hai phạm vi cho đa số khác nhau. Chọn Tuyên Ngôn vì Ngợ/Ngợi là chính tả không có nghĩa (lỗi gõ), vì bài liền kề tha-ap34 cùng dùng Tuyên Ngôn, chứ không phải vì đa số đo được; con số của tôi lệch con số 128 do điều phối nêu, xin biên tập phán một lượt cho cả cuốn.
  - 0.2 Kuṇḍadhānavagga dịch Phẩm Kuṇḍadhāna, đúng 6/6 tiền lệ của chính phẩm này. 18.1 paṭhamaṁ dịch thứ nhất (45/45 khoá cùng công thức).

  Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti (17.1): dùng nhóm số nhiều đã nói những bài kệ này (455 khoá) thay vì đã từng nói bài kệ này (3 khoá), vì Pāli là số nhiều.

  Bất định đã ghi lại, không sửa trong kinh:
  - kadalīkaṇṇiṁ (2.3): dịch một buồng chuối lớn. Không có tiền lệ trong tầng (0 khoá cùng gốc kadalīkaṇṇikā), tầng Anh không phủ bài này. Pāli không nói rõ là bắp hoa hay buồng quả; buồng chuối bao cả hai nên không quyết hẳn. Cần người biên tập xét.
  - paṭisallīnaṁ, sattāhaṁ, vuṭṭhitaṁ (1.1, 2.1): paṭisallīnaṁ cùng cách accusative với sayambhuṁ nên dịch bậc đang độc cư (độc cư là dạng quen trong tầng: 10 khoá ở sn và an). sattāhaṁ có thể đi với paṭisallīnaṁ hoặc upaṭṭhahiṁ; câu Việt giữ vị trí mơ hồ như Pāli. vuṭṭhitaṁ không nêu thiền định nên dịch xuất khỏi độc cư, không thêm thiền định.
  - samitāro (5.1): không tra được tiền lệ. ja532:49.1 có Pāli gần giống (samītāro) nhưng tầng Anh không phủ ja532 và tầng Việt chưa có. Dịch những vị đang tụ hội, theo gốc samiti; nghĩa khác chưa loại trừ được.
  - bhūtabhabyāni (5.3): dịch chúng sinh đã sinh và sẽ sinh, theo dn1:2.5.2 (bhūtabhabyānaṁ ở dạng sở hữu cách; Sujato: those who have been born and those yet to be born; bản Việt của dn1 đã dịch đã sinh và sẽ sinh).
  - migarājaṁva kesariṁ (6.2): accusative đứng cùng buddhaṁ nên dịch như phép so sánh Đức Phật với sư tử chúa loài thú; cách hiểu khác (phụng sự theo cách phụng sự sư tử) kém khả dĩ hơn.
  - 9.4: Pāli không có chủ ngữ; thêm vị ấy theo mạch yo so (6.1). nāmadheyyaṁ labhissati dịch sẽ có được tên gọi; không thêm vào kinh lời giải thích chú giải về nguồn gốc tên Kuṇḍadhāna.
  - oraso dhammanimmito (10.2): dịch là con ruột, do giáo pháp tạo nên (theo dn27:9.4, con ruột … do Pháp tạo nên). Khác có chủ ý với 2 khoá cùng Pāli (tha-ap54:8.2, tha-ap61:9.2) vốn dịch sinh ra từ giáo pháp ấy và bỏ mất oraso; đề nghị biên tập cân nhắc chỉnh hai khoá đó.
  - jhāyī jhānarato ahaṁ (11.2): dịch tôi là người hành thiền, ưa thích thiền định. Khác có chủ ý với tha-ap54:10.2 (1 khoá cùng Pāli: chuyên tu thiền định, tôi ưa thích sự tịch lặng) vì khoá ấy bỏ jhāyī và thay jhānarato bằng tịch lặng.
  - salākaṁ gāhayī (12.4): dịch bậc Chiến Thắng đã cho nhận thẻ, theo an1.211 (nhận thẻ đầu tiên); Pāli không nêu thẻ dùng vào việc gì, không thêm.
  - dasasahassikampako (14.2): dịch bậc làm rung chuyển mười nghìn thế giới. Pāli chỉ viết dasasahassī; thế giới là phần hiểu ngầm (cụm mười ngàn thế giới có ở dn1, mn120, mn123 trong tầng Việt). Cần người biên tập xác nhận.
  - 15.1–15.2 dùng lại nguyên văn tha-ap20:14.1–14.2; 15.3–15.4 và 16.1–16.4 dùng lại nguyên văn cách dịch đa số của tầng.
  - Đại từ: phần kể dùng tôi xuyên suốt, lời thọ ký của Đức Phật dùng Ta (mama, mama bhāsato). Cùng Pāli viharāmi anāsavo (11.4) tầng có ta 90 khoá, tôi 6 khoá đúng dạng này; chọn tôi vì nội bộ bài và bài liền kề tha-ap34 đều dùng tôi.
  - Khoá ngoài lát, báo chứ không sửa: tha-ap501:6.1 (Catutiṁsatikkhattuñca, 34 lần) đang dịch Cả bốn mươi món báu quý giá và tha-ap501:5.3 (Ekasattatikkhattuñca, 71 lần) đang dịch Cả bảy món báu quý giá; số lần bị biến thành món báu. Đây là tiền lệ duy nhất cùng Pāli với 7.3 nên bài này không dùng lại.
  - Hoa thường: 5 khoá dùng lại nguyên văn nhưng viết hoa ở đầu dòng theo vị trí thơ (6.4, 8.3, 11.1, 12.3, 14.3); nội dung không khác.

  Số Pāli: ekādasa (7.1) = 11, dịch mười một; catutiṁsa (7.3) = catu 4 + tiṁsa 30 = 34, dịch ba mươi bốn; kappasatasahassa (8.1) = sata 100 × sahassa 1000 = 100.000, dịch một trăm nghìn kiếp; sattāha (1.1) = bảy ngày; dasasahassī (14.2) = mười nghìn; catasso (16.1) = bốn; aṭṭha (16.2) = tám; cha (16.3) = sáu. Pāli không có số nào khác.

  Dấu lược: Pāli không có … trong bài này và bản Việt cũng không có; không có (…) trần. Dấu nháy: mở “ ở 1.1 đóng ” ở 16.4 (chạy qua nhiều khoá); mở ‘ ở 5.1 đóng ’ ở 10.4; mỗi khoá khớp Pāli (69/69). Dấu ti ở 10.3 (Kuṇḍadhānoti nāmena) bỏ: trong 8 khoá cùng khuôn ở tầng, 6 khoá không đặt tên trong dấu nháy (2 khoá còn lại có nháy chỉ vì mở đoạn trích), khớp tha-ap34:11.3.

  Pāli trùng nguyên văn: 29/69 khoá có Pāli trùng với khoá ở bài tha-ap khác; 21 dùng lại đúng một bản Việt đã có, 5 chỉ khác hoa thường, 3 khác có chủ ý (7.3 vì tiền lệ lệch số, 10.2, 11.2). Trong chính bài có 1 cặp Pāli trùng (12.3 và 14.3), cùng bản Việt.

