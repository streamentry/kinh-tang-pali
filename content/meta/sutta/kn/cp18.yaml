notes: |-
  **Đây là bài thứ tám của phẩm `Hatthināgavagga`, `Sīlapāramī 8`, trong `Cariyāpiṭaka`.** 37 khoá, tất cả đã dịch. Người kể chuyện là một Dạ-xoa tên Dhamma (xem `3.1`: *Một Dạ-xoa tà ác, keo kiệt*), nên toàn bộ bài đọc ở ngôi thứ nhất như một bài tự thuật của bậc thần, đúng như Sujato (*a wicked, miserly spirit*).

  **Ba khoá dùng lại nguyên văn (đếm bằng script):** `0.1` ← `cp13`/`cp17` (*Hạnh Tạng*) · `0.2` ← `cp13`/`cp17` (*Phẩm Hatthināga*) · `1.1` ← `cp13`/`cp17`/`cp25`/`cp7` (*Lại nữa, vào thời thuở nọ,*). Riêng `1.1` có **5** cách trong bộ `cp` (`Lại nữa, vào thời thuở nọ,` 4 lần; `khi ta còn là` 2; `khi ta làm` 1; `khi ta là` 1; `vào thuở xưa` 1) — tôi theo 4/9. Cùng Pāli đó lặn ở `cp24:1.1` và `cp3:1.1`, cả hai cũng dùng nguyên văn y hệt, để `Cariyāpiṭaka` không tự mâu thuẫn.

  **Cấu trúc `0.1`–`0.4` và dòng kết — theo đa số bộ `cp`, đếm được.** `0.1` *Hạnh Tạng* 11/12 bài có `0.1` (bài lệch duy nhất là `cp34` giữ *Cariyāpiṭaka*) · `0.2` *Phẩm + tên phẩm* không lệch trong 6 bài cùng phẩm · `0.3` *<Tên ba-la-mật> Thứ <số chữ>* — `Sīlapāramī 3`/`7` → *Trì Giới Ba-la-mật Thứ Ba*/*Thứ Bảy*, tôi theo ⇒ *Trì Giới Ba-la-mật Thứ Tám*. **Chỗ kho đang lệch, giao biên tập:** `Dānapāramī 6` ở `cp6` ghi *Bố Thí Ba-la-mật 6* (không *Thứ Sáu*) và `Khānti 2` ở `cp34` ghi *Ba-la-mật Từ Ái 2*. Tôi không sửa hai tệp ngoài lát. · `0.4` và dòng kết đều viết *Hạnh Của …* hoa chữ **Của** ở `0.4` (12/12) nhưng *Hạnh của …* thường ở dòng kết (`cp13` *Hạnh của Long vương Campeyya, thứ ba.*, `cp21` *Hạnh của Thái tử Yudhañjaya, thứ nhất.*, `cp28` *Hạnh của đạo sĩ Chân Thật, thứ tám.*) — tôi giữ đúng phân tách đó. Số thứ tự `aṭṭhamaṁ` → *thứ tám* lấy từ `cp28` (cùng cách với `cp13` *thứ ba*, `cp21` *thứ nhất*, `cp5` *thứ năm*, `cp25` *thứ năm*, `cp28` *thứ tám*) — không phải trùng chuỗi Pāli, chỉ là cùng công thức.

  **`yakkho` → *Dạ-xoa*** (toàn tầng, ví dụ `dn20:7.1` *Bảy ngàn Dạ-xoa*; `dn32` dùng đồng nhất), và `pāpo kadariyo` → *tà ác, keo kiệt*. **Bốn cụm 0 tiền lệ, tôi tự dịch và ghi lại:** `kadari` (keo kiệt) · `anukampako` → *thương tưởng* (cùng họ với `anukampakā` mà tầng đã dùng *có lòng thương tưởng* ở `pv8:8.2`) · `paccanikā` → *chống đối* · `dhura` (cán xe) → *cán xe*. Vì bốn chỗ này không có tiền lệ nào trong 4.983 bài, `terminology` ở 9.0 và `ambiguity_integrity` ở 8.9 — mức thấp nhất của lát.

  **`0.4` và dòng kết — `devaputta` tôi KHÔNG dịch, giữ nguyên Pāli trong tên.** `Dhammadevaputtacariya` → *Hạnh Của Dạ-xoa Dhammadevaputta*. Lý do: `devaputta` 0 tiền lệ trong tầng, và đây là **tên riêng của một bậc thần**; dịch nó thành *hầu thần* hay *con thần* là bịa chức vụ không có nguồn. Tên riêng giữ Pāli cũng đúng mẫu `cp` (cp13 *Campeyya*, cp21 *Yudhañjaya*, cp32 *Sutasoma*). Nếu biên tập muốn có bản dịch chú thích thì đó là việc của `notes`/`glossary`, không phải của thân kinh.

  **Câu `6.2`: `yadi bhinde tapoguṇaṁ` → *nếu ta phá vỡ phép khổ hạnh*.** `tapoguṇa` có 2 tiền lệ trong tầng và cả hai đều là *một phương thức khổ hạnh* (`mn79:21.2`, `mn79:22.12`), nên tôi theo. `kuppeyyaṁ` → *nổi giận* theo `cp13:4.3`; `cp17:4.1` dùng *nổi lòng sân hận* — hòa 1–1, tôi theo `cp13` vì ngắn hơn và `cp13` cùng phẩm Hatthināga với bài này.

  **`8.3`–`8.4` là cảnh đất nứt nuốt kẻ ác — tôi không thêm gì.** Pāli `Vivaraṁ adāsi pathavī` / `pāpayakkhassa tāvade` (nguyên văn lặp `tāvade` = chính là đó). *Mặt đất mở ra, / nuốt chửng kẻ ác ấy ngay tại đó”ti.* Dấu `”ti.` khép lại lời kể mở ở `1.1`; đếm bằng script: Pāli 1 mở / 1 đóng, bản Việt 1 / 1.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root: `root/pli/ms/sutta/kn/cp/cp18_root-pli-ms.json`, 37 khoá. Bản Anh Sujato **có** tại commit đã ghim: `translation/en/sujato/sutta/kn/cp/cp18_translation-en-sujato.json` (36/37 khoá có bản dịch). Sujato im lặng đúng một khoá: `9.1` dòng kết — **một ô Anh rỗng không phải sự đồng thuận về cách dịch**, tôi dịch từ Pāli theo mẫu `cp`. Lớp lấp `english-project` không cần vì bài đã có tệp Anh đã ghim. Tầng `vietnamese-current` vắng: thư mục `translation/` không tồn tại trong checkout này, nên không có Hòa thượng Thích Minh Châu để đối chiếu. **Lưu ý về công thức coverage:** mọi khoá thân của bài này đều **dưới 40 ký tự** (kệ ngắn), nên theo đúng công thức `source/layers.yaml` bài có **0 khoá có nội dung ⇒ coverage 0/0**, và phép đo đó không phản ánh chất lượng tham khảo. Cả 12 bài `cp` đã `published` trong repo cũng ở tình huống này.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì BRIEF cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0: mọi chốt tự động của `_hvi.kiểm` đã xanh và 37/37 khoá của chính bài này, nhưng cổng `npm` chưa chạy.