notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 3.2, 4.1 — theo bản song song snp1.10:4.2, 5.1 (cùng Pāli, cùng bộ Kinh Tập, giữ «Gaṅgā» như bài này): «xé toạc tim … nắm chân … ném sang» → «làm cho tim … vỡ ra … nắm hai chân … ném qua» (`hadayaṁ vā phālessāmi`, `pādesu vā gahetvā`); 4.1 bỏ chuỗi «giữa loài người với sa-môn, bà-la-môn, chư thiên và loài người, người có thể» (lặp «loài người», lệch `sassamaṇabrāhmaṇiyā pajāya sadevamanussāya yo`) → «cùng đám đông sa-môn, bà-la-môn, chư thiên và loài người — có thể». Không theo sn10.3:2.8–2.9, sn10.12:1.23–1.24 (đa số 2/4) vì «sông Hằng», «bể tim» lệch cách gọi «Gaṅgā» và văn phong của bài.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt thứ hai): khoá 1.3 và 1.4 — «dạ-xoa Thô Nhám / dạ-xoa Lông Kim» → «dạ-xoa Khara / dạ-xoa Sūciloma» (cùng bài các khoá 1.2, 2.1, 2.3 và bản trùng `sn10.3:1.2–1.3` đều giữ tên Pāli của hai dạ-xoa; nhan đề vẫn dịch «Lông Kim»); giữ nguyên khoá 3.2, 4.1 (đã rà ở lượt trước, bản đa số lệch cách gọi «Gaṅgā»), 1.2 (`ṭaṅkitamañce` «tảng đá phẳng», `bhavane` «chỗ ở»), 2.1, 2.3 vì khác bản đa số chỉ ở văn phong và cách gọi Đức Thế Tôn/Đức Phật.
