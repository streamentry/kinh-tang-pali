notes: |-
  Dịch trực tiếp từ Pāli root (136 khoá); cả ba tầng tham khảo đều vắng ở bài này (đo và bằng chứng ở `blocking_errors`). Bài thuộc Paṁsukūlavagga (Phẩm Y Phấn Tảo), bài thứ mười và cuối phẩm: Trưởng lão Sālamaṇḍapiya nhớ lại việc dựng mái che bằng hoa sa-la trên đầu Đức Phật Piyadassī, lời thọ ký của Đức Phật về quả báo và về Đức Gotama, các đời làm chư thiên và Chuyển Luân Vương, rồi phần kết của bài, câu kết phẩm và bài tóm tắt phẩm (Tassuddānaṁ).
  `translationTitle` đặt BẰNG ĐÚNG khoá `:0.3`. Pāli `:0.3` là `Sālamaṇḍapiyattheraapadāna`, bắt đầu bằng chữ S nên KHÔNG có số thứ tự ở `:0.3` (đúng chính sách giữ số khi và chỉ khi Pāli bắt đầu bằng số); số thứ mười chỉ nằm ở khoá `:33.1` (dasamaṁ), đúng như hình thức các bài kề trong phẩm (tha-ap490, tha-ap493).
  Dạng tên bài: đo ở nhiều phạm vi. Toàn tầng tha-ap trong cây làm việc: Bài Kệ Tuyên Ngợ 244, Bài Kệ Tuyên Ngôn 136, Ký Sự 129 (và 10 khoá Tuyên Ngợi). Ở tha-ap480–499: Tuyên Ngợ 12, Ký Sự 6, Tuyên Ngôn 0. Cùng phẩm (tha-ap483–499): Tuyên Ngợ 9, Ký Sự 6, Tuyên Ngôn 0. Tôi theo đa số phạm vi gần nhất (Tuyên Ngợ) để cả phẩm đồng nhất, dù Tuyên Ngợ có vẻ là chính tả sai của Tuyên Ngôn; việc chọn một dạng cho cả cuốn là việc của người biên tập, để sửa hàng loạt một lượt. Tên riêng viết `Sālamaṇḍapiya` theo gốc Pāli ở `:32.1` và `:37.2` (không thêm âm cuối như cách viết `Pulinacaṅkamī` ở tha-ap482).
  Tiền lệ đếm được: 63 khoá Pāli của bài trùng nguyên văn với khoá đã dịch ở tầng tha-ap; 55/63 dùng lại đúng một bản Việt đã có (50/63 là bản phổ biến nhất trong số bản có sẵn), 8/63 cố ý khác: `:4.1`, `:6.4`, `:25.2`, `:27.3` chỉ đổi ngôi tôi sang ta cho cả bài; `:6.1` (tiền lệ duy nhất viết bảy ngày đêm, tôi viết bảy ngày vì sattāha là bảy ngày); `:19.4` (tiền lệ duy nhất vẫn thường xuyên có mặt cho vassate, tôi viết rơi vào mọi lúc vì động từ là mưa); `:20.1` (tiền lệ cho Aṭṭhārase kappasate là quá khứ Vào … kiếp trước; ở đây nằm trong lời thọ ký tương lai nên viết Sau … kiếp nữa, giống tha-ap486:22.1 và tha-ap553:21.1); `:23.2` (tiền lệ duy nhất ở tha-ap312 thuộc ngữ cảnh khác).
  Hai chỗ tôi bỏ bản phổ biến nhất của tiền lệ (có chủ ý): `:2.2` `sayambhū aggapuggalo`: tiền lệ 6 khoá viết tối thắng giữa loài hai chân, 4 khoá viết bậc tối thượng giữa loài người, 2 khoá viết bậc tối thượng giữa loài người; Pāli không có dvipada nên tôi theo nhóm không có hai chân (bậc Tự Tại, bậc tối thượng giữa loài người). `:26.2` `carimo vattate bhavo`: tiền lệ 3 khoá viết này là đời cuối cùng của ta (lặp y hệt `:26.1`), 2 khoá viết kiếp sống tối hậu đang diễn ra; tôi theo nhóm 2 khoá để pacchimako và carimo không bị dịch trùng một cụm. `:24.2` `devarajjamakārayiṁ` giữ tiền lệ ta đã làm ra vương quyền nơi chư thiên (6 + 4 khoá, so với 2 khoá ta đã cai trị cõi trời) dù cách nói hơi nặng, vì đó là cách đã thành quy ước của tầng.
  Pāli trùng trong chính bài: 7 nhóm (`:2.1` = `:9.1`; `:8.2` = `:10.2`; `:14.3` = `:16.1`; `:17.3` = `:25.3` = `:26.3`; `:18.4` = `:28.4`; `:20.1` = `:28.1`; ba khoá `…pe…` ở `:29.2`, `:30.2`, `:31.2`). 6/7 nhóm có bản Việt giống nhau; nhóm `:20.1`/`:28.1` cố ý khác (tương lai: Sau một ngàn tám trăm kiếp nữa; quá khứ: Vào một ngàn tám trăm kiếp trước).
  Số Pāli, mọi phép tính: `catudaṇḍe` bốn cây cọc (catu 4); `sattāhaṁ` bảy ngày (satta 7); `vasīsatasahassehi` một trăm ngàn bậc tự tại (sata 100 x sahassa 1000 = 100.000; tiền lệ tha-ap11:2.3 và tha-ap553:13.3); `aṭṭhārase kappasate` 18 x 100 = một ngàn tám trăm kiếp (tiền lệ 11 khoá Vào một ngàn tám trăm kiếp trước); `tiṁsakappāni` 30 kiếp (tiṁsa là 30, kappa là kiếp, KHÔNG có sahassa nên không phải ba mươi ngàn kiếp; tiền lệ tha-ap62:7.1 ba mươi kiếp); `saṭṭhi ca sattakkhattuñca` sáu mươi lần và bảy lần (60 và 7, có thể hiểu cộng là 67 lần theo mẫu cha ca saṭṭhi ca = 66 ở tha-ap352:9.5, nhưng bản dịch giữ nguyên hai số chứ không tự cộng); `paṭisambhidā catasso` bốn vô ngại giải; `dasamaṁ` thứ mười; `ekūnapaññāsamo` thứ bốn mươi chín (ekūna-paññāsa = 50 trừ 1; vị trí khớp phẩm trước tha-ap482 là thứ bốn mươi tám); `satāni dve` hai trăm; `ūnavīsati` mười chín (ūna + vīsati, hai mươi trừ một, cùng cấu tạo ekūnavīsati = 19 ở tha-ap192:9.1). Không có cụm Tiṁsakappasahassa ở bài này, nên không có điều bất định số kiếp.
  Lời thọ ký tương lai (động từ bhavissati, hessati, ramissati, pavassissati, āgamissati, dharissati, nibbāyissati, parivāressanti) dịch sẽ; `:20.1` dịch Sau một ngàn tám trăm kiếp nữa theo chỉ dẫn của người điều phối; `Aṭṭhārase kappasate` ở `:28.1` là quá khứ (đã cúng dường cách đây) nên viết Vào … kiếp trước.
  Ngôi và quy ước dấu: người kể dùng ta cho cả bài (khớp tha-ap490, tha-ap493); Đức Phật tự xưng Ta (viết hoa) ở `:12.1`–`:13.4`, theo cách tha-ap486 viết Ta cho lời Đức Phật. Công thức kết `:32.1` dùng Tôi nghe như vầy… những bài kệ này (nhóm 407 khoá của tầng, không dùng nhóm số ít). Ngoặc kép “ mở ở `:1.1` và đóng ở `:31.3`; nháy đơn ‘ mở ở `:11.1`, đóng ở `:11.4`; nháy đơn ‘ mở ở `:12.1`, đóng ở `:22.4`. Khớp Pāli từng khoá (136/136). `…pe…` ở `:29.2`, `:30.2`, `:31.2` thành đúng một `…` (3/3); Pāli của bài không có `(…)` hay `…` trần, nên Việt cũng không có.
  Bất định, ghi ở đây chứ không giải thích trong thân kinh: (1) `:13.1`–`:13.4` `Anokāsaṁ na passāmi … okāsova na sammati`: tôi hiểu Ta không thấy chỗ nào thiếu chỗ cho phước chín muồi, và chính khoảng trống ấy không hề chấm dứt; `sammati` có thể là từ gốc sam (chấm dứt) hoặc sammāti (chứa vừa), và tiền lệ duy nhất tha-ap405:21.4 `okāso so na sammati` dịch không đủ chứa; đây là khoá bất định lớn nhất của bài, nghĩa tổng thể (phước nghiệp nơi nào cũng có chỗ trổ quả) chắc nhưng chi tiết câu chữ thì chưa. (2) `:18.1`–`:19.4` nằm trong lời Đức Phật (nháy đơn mở ở `:12.1`, đóng ở `:22.4`) nhưng dùng ngôi thứ nhất maṁ và idaṁ phalaṁ như lời của vị trưởng lão kể; tôi giữ ta (viết thường) và không viết hoa, để không gán cho Đức Phật, cách đọc người viết lồng giọng vị trưởng lão vào lời thọ ký là suy đoán và không thêm vào thân kinh. (3) `:15.3` `sadā santo`: santo hiểu là phân từ hiện tại của atthi (đang ở), như tiền lệ tha-ap123:1.3 và tha-ap124:8.3 lược bỏ; một cách hiểu khác là an tịnh/bậc thiện, bản dịch không thêm. (4) `:15.4` `puññakammasamāhito` dùng lại đầy đủ phước nghiệp theo tha-ap25:9.2 và tha-ap25:14.2 (cùng cách dịch cho samaṅgino ở `:14.2`; samāhita có thể hiểu là vững vàng). (5) `:17.4` `dharissati` dịch được duy trì (nội động, như hessati ở `:26.4`); không rõ mái che là của người hay luôn hiện hữu. (6) `:5.1`–`:5.2` `Catudaṇḍe ṭhapetvāna, buddhassa uparī ahaṁ`: ahaṁ gộp vào chủ ngữ ta ở `:5.4` thay vì dịch rời. (7) `:4.3` `sunisinnaṁ samāpannaṁ` dịch đang ngồi ngay ngắn, đã nhập định (samāpanna là đã nhập định, củng cố bởi vuṭṭhahitvā samādhito ở `:7.2`). (8) `:7.4` `nisīdi` dịch đã ngồi theo tiền lệ tha-ap553:14.4 dù Đức Phật đã ngồi từ `:4.3`; không thêm đã ngồi dậy hay ngồi lại. (9) `:11.1` `bhagavā` dạng chủ cách dùng làm hô cách: dịch Bạch Thế Tôn. (10) `:11.1`–`:11.2` đặt dấu hỏi dù Pāli không có; chỉ để câu hỏi đọc đúng nghĩa. (11) `:28.3` `Duggatiṁ nābhijānāmi` giữ bản tiền lệ phổ biến nhất của chính bài kề trong phẩm (tha-ap490:13.3, 137 khoá: Ta không biết mình rơi vào khổ đau), dù đọa xứ/ác thú sát hơn với duggati (tiền lệ tha-ap470:2.3 và tha-ap252:3.3: 65 và 97 khoá); chọn dạng nhiều khoá nhất và thuộc cùng phẩm, để người biên tập phán một lượt. (12) `:37.4` `ūnavīsati` dịch mười chín (phép tính ở trên); tổng số khoá kệ của mười bài trong phẩm khớp ở mức xấp xỉ 219–221 nên khoá này không mâu thuẫn, nhưng tôi không có phép đếm kệ độc lập để xác nhận. (13) `:24.3` `Saṭṭhi ca sattakkhattuñca` giữ nguyên hai số, không tự cộng (xem phần số ở trên). (14) `:10.1` Anuruddha ở đây là thị giả của Đức Piyadassī, không phải Anuruddha thời Đức Gotama; bản dịch không thêm chú thích.
  Thuật ngữ đã đo: bậc Tự Tại cho sayambhū (tha-ap20, tha-ap340); Đức Chánh Đẳng Giác cho sambuddha ở `:2.3` (tha-ap474:1.3, tha-ap425:3.3: 2 và 1 khoá) và bậc Chánh Đẳng Giác ở `:4.1` (tha-ap421, tha-ap353); bậc Trưởng Thượng thế gian, đấng Nhân Ngưu cho lokajeṭṭho narāsabho (25 khoá); bậc Điều Ngự cho vināyaka (tha-ap31, tha-ap396); bậc Chiến Thắng cho jina (tha-ap486, tha-ap491); bậc Đại Mâu-ni cho mahāmuni (tha-ap490, tha-ap491); bậc Tối Thượng Nhân cho purisuttamo (tha-ap553:14.4, 2 khoá); hoa sa-la cho sāla (tha-ap141, tha-ap379, tha-ap400, tha-ap464: 22 khoá so với hoa sala 18 khoá, và sa-la theo Phẩm Hoa Sa-la ở tha-ap464:0.2); mái che cho maṇḍapa/chadana (tha-ap408, tha-ap400, tha-ap143); mỉm cười cho sitaṁ pātukarī/sitakamma (mn81:2.1, sn1.35:6.4; không có tiền lệ trong tha-ap); thị giả cho upaṭṭhāko (tha-ap12:11.4); bậc tự tại cho vasī (tha-ap11:2.3, tha-ap553:13.3); Chuyển Luân Vương cho cakkavattī (9 khoá); giàn hỏa cho citaka (tha-ap464:1.1 giàn hỏa táng); cơn mưa Pháp cho dhammavuṭṭhi (tha-ap332:1.4); giáo pháp/con ruột/kế thừa cho dhammesu dāyādo oraso dhammanimmito (16 và 14 khoá).
  Tự kiểm: tập khoá Việt bằng đúng tập khoá Pāli (136 = 136, đúng thứ tự); nháy đơn và nháy kép khớp Pāli ở 136/136 khoá; `…pe…` 3/3 thành đúng một `…`; mọi giá trị NFC, không rỗng, không khoảng trắng thừa; không Pāli lọt ngoài các tên riêng (Piyadassī, Varuṇa, Okkāka, Sālamaṇḍapiya và các tên trong bài tóm tắt phẩm); đã in cặp Pāli với Việt từng khoá để đọc đối kháng. Phép dò Pāli trùng trong bài đã chạy (7 nhóm), phép số Pāli đã tự tính (ở trên).
