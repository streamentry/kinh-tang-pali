  - Số Pāli:
    `sataṁ` (`12.1`–`12.4`) = một trăm (sata 100) cho voi, ngựa, cỗ xe và gác kho; `ekasataṁ` (`41.3`) = một trăm (không cộng thêm một vì `mn37:8.9` đã dịch `ekasataṁ niyyūhaṁ` là "một trăm tháp"; nếu truyền thống chú giải đọc 101, tức một trăm vua cùng vua Dhanañcaya, thì đây là chỗ bất định); `dasa` (`86.1`, `86.2`, `88.1`) = mười; `cha` (`86.3`) và `chacca` (`88.1`, cha + ca) = sáu; `pannarasa` (`86.3`) = mười lăm (pañca 5 + dasa 10); `catuddasa` (`86.4`) = mười bốn (catu 4 + dasa 10); `vīsati` (`87.1`, `87.2`) = hai mươi; `tiṁsati` (`87.4`) = ba mươi; `pannavīsati` (`88.2`) = hai mươi lăm (pañca 5 + vīsati 20); `parosahassa` (`83.1`) = hơn một ngàn; `itthisahassaṁ` (`189`, `193`, `204`, `207`) = một ngàn; `dāsisattasatāni` (`189.2`, `193.2`, `204.2`, `207.2`) = bảy trăm (satta 7 × sata 100); `sattarattena` (`210.1`) = trong bảy đêm; `tīhaṁ` (`118.3`, `119.1`, `199.1`, `237.1`) = ba ngày; `caturo` (`103.1`) = bốn hạng nô lệ, liệt kê đủ bốn ở `102.1`–`102.4`; `caturaṅgini` (`51.3`) = bốn binh chủng; `cattāro` (`77.3`) = bốn; `dutīyo` (`104.1`) = thứ hai; `navamaṁ` (`321.1`) = thứ chín. Ba dòng `86.3`–`86.4`: Pāli `cha piṅgalā pannarasa, haliddā ca catuddasa` không gắn số nào với tên màu một cách chắc chắn, nên giữ sát chữ "sáu vằn vàng nâu, mười lăm, và mười bốn vằn vàng nghệ" và không tự quyết `pannarasa` thuộc màu nào. Không có cụm thuộc loại `Tiṁsakappasahassa`.
