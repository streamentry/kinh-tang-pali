notes: |-
  `Buddhaaviheṭhakapañha`, câu hỏi thứ năm của `Santhavavagga`; 35 khoá, tất cả đã dịch. TẦNG THAM KHẢO — đo, không đoán. 0/7 bài `kn` của lát này có bản Anh Sujato tại commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud` (đếm trực tiếp trên đĩa: cp 35, dhp 26, iti 11, ja 83, kp 9, snp 5, thag 264, thig 73, ud 8 tệp) — **không có `mil`**, và `ja374/376/407/412` không nằm trong 83 tệp `ja` ấy. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit đã ghim có đúng 26 tệp và tất cả đều là `dhp*` (Pháp Cú). Lớp lấp `english-project` của dự án không có uid nào trong lát. Ba tầng tham khảo đều vắng ⇒ bài dịch chỉ từ Pāli root ⇒ blocker thật, và đây là **giới hạn upstream**, không phải lỗi của người dịch. Vì vậy `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng để né blocker, và `status` là `draft` vì `scripts/validate.ts` coi tệp Anh thiếu là **error** khi status là `review` hoặc `published`.

  `0.1` → *Milindapañha* (168 bài mil), `0.2` → *Meṇḍakapañha* và `0.3` → *Santhavavagga* **giữ nguyên Pāli**, theo `mil5.5.2`, `mil5.5.4`, `mil5.5.10` (3 bài mil5.5.* đã merge); `mil5.5.7` dịch *Phẩm Santhava* và `mil5.1.9` dịch *Phẩm Meṇḍakapañha* — 1/3 và 2/9, không đủ để đổi. Ghi lại để người điều phối gộp.

  VĂN XƯNG — chọn theo bầy lân cận và đếm được trên toàn tầng `kn`: `bhante nāgasena` → **bạch ngài Nāgasena** (đếm `bạch ngài` 105 lần, `bạch thầy` **0** lần) và `thưa ngài Nāgasena` ở vị trí mở lời (theo `mil5.5.2:1.1`, `mil5.5.4:1.1`, `mil5.5.10:1.1`); `mahārāja` → **tâu đại vương** (390 lần, mạnh hơn *thưa đại vương* 130 và *bạch đại vương* 5); `thero` → **Trưởng lão**; `āyasmā` → **Tôn giả**; `bhagavatā`/`tathāgato` → **Thế Tôn** / **Đấng Như Lai**; `ajjhayana` → **chinh phục**; `vipassana` → **thấy biết rõ ràng**.

  DÙNG LẠI NGUYÊN VĂN — ĐẾM ĐƯỢC 11/12 khoá có Pāli trùng. Đáng kể nhất: `1.3` `Puna ca bhaṇitaṁ—` → *Lại nữa, đã được nói rằng:* (y hệt `mil5.1.10:1.3`); `1.8` `Ayampi ubhato koṭiko pañho tavānuppatto, so tayā nibbāhitabbo”ti.` → *Đây là câu hỏi có hai đầu mối tiến thoại lưỡng nan đã đặt ra cho ngài, ngài phải tháo gỡ mối nghi ấy.”* (y hệt `mil5.1.9:1.8`); `4.2` `mahiṁ sāgarakuṇḍalaṁ;` và `4.3` `Na icche saha nindāya,` → y hệt `ja310:1.2`–`1.3`; `7.7` → y hệt `mil5.5.4:7.4`.

  **MỘT CHỖ DỊCH RIÊNG, CÓ LÝ DO.** `1.8` khớp `mil5.1.9:1.8` ở mọi chữ, **trừ** `tiến thoái` — bản đã có gõ nhầm `thoái`. Giữ chính tả đúng `thoại`, không chép lỗi.

  BỔ SUNG BỊ BỎ SÓT Ở LƯỢT ĐỌC ĐẦU. `5.1`, `6.2`, `7.5` đều có `candavatiyā rājakaññāya`; bản nháp đầu tiên chỉ dịch `candavatiyā` và **rơi mất** `rājakaññāya` (ham muốn lòng vua). Đã sửa thành *bị lòng yêu cuồng nhiệt vì ham muốn lòng vua làm cho loạn trí* ở cả ba khoá. Đây là lỗi nghĩa, không phải lỗi hình thức, và máy không bắt được — cả ba chốt tự động đều xanh trước và sau.

  `turitaturito` dịch *giấu mình sau tấm rèm* — đây là hình ảnh vua ngồi khuất sau rèm, đúng ngữ cảnh một vị vua ra lệnh giết. `oḷi` ở `6.1` là cây mắc mè (`Ricinus communis`, tức `eranda`), không giữ Pāli có dấu để tránh lọt Pāli; ghi lại vì đây là xác định thực vật chứ không phải suy đoán.

  `vinayanavasena` ở `3.3` đọc là *ham muốn trị phạt* — `vinayana` vừa là *sự cung kính* vừa là *sự trị phạt*; theo ngữ cảnh bảy người còn lại (sát hại vì tham, sân, si, kiêu, hám lam, tự vệ, trêu cười) thì *trị phạt* hợp hơn. Ghi lại là cách đọc.

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó — BRIEF cấm `npm run validate|test|build|check` trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6** vì mọi chốt tự động của `_hvi.kiểm` đã xanh (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên văn Pāli, không lọt Pāli, khớp số dấu lược) và 35/35 khoá của chính bài này; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.
