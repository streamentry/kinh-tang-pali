notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ps3.5.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các thuật ngữ cổ và đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 29 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 4.2 — ‘Có lòng tin giải thoát là hành bằng đức tin, …’ (`adhimuccanto` là ‘thắng giải’, không phải ‘giải thoát’; cấu trúc là phân từ + `carati`, ‘khi … thì hành bằng …’) và ‘các thiện pháp được đưa đến’ (`āyāpenti` là ‘gắng sức’) → theo ps1.4:61.2 (cùng Pāli). Giữ nguyên khoá 5.2 (‘… hành là của chánh …’, nhất quán với 3.1–3.8 trong bài; chỉ khác ps1.4:62.2 ở thứ tự từ).

  Quyết định hội đồng biên tập 2026-10-16: B8 — `5.2` (`āvajjana` = “hướng tâm”; `abhiniropana` = “gắn tâm”).
