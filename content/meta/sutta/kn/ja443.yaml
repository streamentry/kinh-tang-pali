notes: |-
  Đợt 17, lát n176. Dịch từ Pāli root commit 11c9d708 — không có tầng Anh, không có tầng Việt hiện
  hành, không có chú giải trong commit đã ghim; chỉ đọc từ Pāli.

  **Tiêu đề có tiền lệ.** `0.1` “Jātaka” giữ nguyên Pāli (đa số tệp ja); `0.2` “Bộ Mười Bài Kệ”
  (11 tiền lệ, đúng nghĩa `-nipāta`); `0.3` “Phẩm Bốn Cửa” (ja442 và ja445 cùng phẩm, đồng loạt);
  `0.4` “5. Kinh Cūḷabodhi” theo khuôn “N. Kinh <tên>” của ja442 “4. Kinh Bà-la-môn Saṅkha” và ja445
  “7. Kinh Nigrodha”, tên riêng Cūḷabodhi giữ nguyên Pāli đúng như cp14 “Hạnh Của Cūḷabodhi”;
  `14.1` “Kinh Cūḷabodhi thứ năm.” theo ja445:11.1 “Kinh Nigrodha thứ bảy.” (Pāli `pañcamaṁ`).

  **Thơ.** Giữ đúng bốn dòng mỗi kệ và thứ tự khoá Pāli. `kodho dummedhagocaro` lặp ở 6.4, 7.4, 8.4
  dịch nguyên một kiểu: “sân hận, bạn đồng hành của người ngu” (ba khoá giống hệt nhau). Cặp
  `kāḷapakkheva candimā` (12.4) và `sukkapakkheva candimā` (13.4) dịch đối xứng: “như trăng vào nửa
  tối” / “như trăng vào nửa sáng”.

  **Bất định — ghi lại, không tự xử trong thân kinh.**
  - `Rajaṁva vipulā vuṭṭhi` (2.3, 4.3, 5.3 — cùng một câu Pāli) dịch “như cơn mưa lớn dập bụi bay”
    theo nghĩa đen `raja` (bụi) + `vuṭṭhi` (mưa lớn): mưa lớn dập bụi, cũng như y ngăn điều ấy mau
    lẹ. Không có bản Anh hay chú giải trong commit đã ghim để phân xử cách đọc khác.
  - `balamhiva apassito` (3.2) dịch “như kẻ chẳng thấy sức mình”; `parakkare vipulañcāpi atthaṁ`
    (9.2) dịch “khi nỗ lực lại bỏ cả lợi ích to lớn” — hai chỗ này đọc theo ngữ nghĩa từ mà chưa đối
    chiếu được nguồn nào trong commit đã ghim.
  Vì ba chỗ bất định trên, `ambiguity_integrity` 9.0 và bài giữ `draft` (blocker không có tầng Anh
  thắng điểm số).

  Dấu nháy: `“` mở/đóng ở 1.1–1.4, 2.1–2.4, 3.1–3.4, 4.1–4.4, 5.1–5.4, và 6.1 đóng ở 13.4 đúng
  vị trí Pāli; đã kiểm số lượng từng khoá khớp Pāli. Không có dấu lược nào trong bài.

  Triangulation 7.0: không có tầng tham khảo nào ngoài Pāli root.

  technical_integrity 9.6: cổng kỹ thuật do coordinator chạy — npm run validate; npm test;
  npm run check; npm run build.

  Rà soát đợt 7, 2026-10-15 (Claude Sonnet 5.5 (Claude Code), đọc đủ 57 khoá Pāli↔Việt): sửa 13 khoá. Lỗi nghĩa thật: 2.1, 2.2, 4.1 (`uppajje/uppajji me na mucceyya/muccittha` có chủ ngữ là sân hận; bản cũ đọc "ước chi" và đảo chủ ngữ thành "ta chẳng thoát khỏi nó"), 3.1 (`vikatthittho` là khoác lác, không phải gào thét), 3.2 (`balamhiva apassito` là nương tựa vào sức mạnh, không phải "chẳng thấy sức mình"), 10.4 (bỏ "hỡi lửa", Pāli `yasmā so jāyate gini` không có hô cách), 13.1 (`dhūmaketu` là ngọn lửa, không phải "cột khói"), 9.3–9.4 (`bhīmaseno` là tính từ đồng vị với `kodho`, "có đạo quân đáng sợ", không phải tên riêng). Từ vựng: 6.4, 7.4, 8.4 `gocaro` dịch "nơi lui tới" thay "bạn đồng hành". Chưa phân xử: `muccati` + `me` có thể là "thoát khỏi ta" hoặc "buông ta" (giữ cách dịch trung tính); 9.2 `parakkare` là chữ hiếm không có tiền lệ trong kho (giữ nguyên bản dịch cũ, chưa chắc); 6.1–6.2 và 11.3 `sārambhā` giữ. Không có bản Anh hay Việt độc lập.

  Quyết định hội đồng biên tập 2026-10-16: C2 — `14.1` (dòng kết thêm dấu phẩy: "…, thứ N."); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
