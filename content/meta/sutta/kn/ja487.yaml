notes: |-
  Đợt 19, làn 55. Dịch từ Pāli root commit đã ghim, đủ 73/73 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem dưới).

  **Tiêu đề.** `0.2` “Bộ Tạp Tập” (`Pakiṇṇakanipāta`) và `0.3` “Phẩm Ruộng Lúa” (`Sālikedāravagga`) chưa có tiền lệ đã publish trong tầng (cả hai chỉ có ở `ja484`–`ja496`, vốn chưa dịch); chọn theo cách đặt tên của bài anh em cùng phẩm đang dịch cùng đợt (`ja490`), để cả phẩm thống nhất; người điều phối nên quyết một lần cho cả phẩm. `0.4` “4. Kinh Uddālaka” theo khuôn “N. Kinh <tên>” của `ja475:0.4`, `ja481:0.4`, giữ nguyên tên riêng. `17.1` “Kinh Uddālaka, thứ tư.” theo `ja475:14.1` (có dấu phẩy trước số thứ tự); số `4.` ở `0.4` khớp `catutthaṁ` = 4 ⇒ “thứ tư”.

  **Tiền lệ dùng lại nguyên văn.** Bốn khổ kệ đầu song song với `ja377:3`–`ja377:6` (Setaketujātaka). Dò toàn tầng: 36 cặp Pāli trùng nguyên văn (không tính dấu câu, hoa/thường) giữa bài này với bài khác đã có bản Việt; 31 cặp bản Việt giống nhau, 5 cặp khác ban đầu. Sau khi đo, `16.1` được đổi về “Cũng vậy trong loài người,” (2 khoá `ja334` dùng đúng dạng này; ba dạng còn lại mỗi dạng một khoá, không có đa số) ⇒ còn 1 cặp khác có chủ ý: `15.1`, bản này “Với những tấm vải nhuộm nhiều màu,” còn `snp2.7:5.1` dịch “Với những y phục nhuộm nhiều màu,” — ở đây `vatthehi` là vải phủ cung điện (`vimānaṁ chāditaṁ`), nên “y phục” sai ngữ cảnh. Các khoá dùng lại nguyên văn từ `ja377`: `1.1`, `1.3`, `1.4`, `2.2`, `2.3`, `2.4`, `3.1`–`3.4`, `4.1`–`4.4`; `11.1`–`11.2` (và `12.x`, `13.x` tương ứng) dùng đúng bản Việt của `ja362:4.1`–`4.2` và `ja474:8.1`–`8.2`. Hai chỗ lệch Pāli rất nhỏ so với `ja377` được coi là cùng nghĩa: `caraṇaññeva` (3.4, 4.2) = `caraṇameva`; `puṇāti` (4.4) = `puṇeti`; một chỗ lệch thật: `1.2` Pāli `ye mantaṁ jappanti` (số ít) khác `yeme jappanti mante` của `ja377:3.2`, nên viết lại câu, chỉ giữ “hình thù dơ dáy”. `3.3` giữ “Trẫm” như `ja377:5.3` vì trong chính bài này `2.1` gọi người nghe là `rāja` ⇒ người nói khổ 3 là nhà vua.

  **Trùng nguyên văn trong chính bài:** 10 nhóm Pāli trùng (sau khi nén khoảng trắng), 0 nhóm mà bản Việt khác nhau: `6.2`=`9.2`, `6.3`=`9.3`, `6.4`=`9.4`, `7.3`=`10.3`, `7.4`=`10.4`, `11.1`=`12.1`=`13.1`, `11.2`=`12.2`=`13.2`, `11.3`=`12.3`=`13.3`, `11.4`=`12.4`, `11.5`=`12.5`=`14.1`; cùng `2.3`=`3.1` (khác dấu mở nháy). Đã sửa một lỗi khi tự kiểm: bản nháp viết hoa không đều ở ba khoá `11.5`/`12.5`/`14.1`; đã thống nhất.

  **Số Pāli:** bài này không có số lượng nào cần tính. `sahassaveda` (2.3, 3.1) = “ngàn bộ Vệ-đà” theo `sahassa` = 1.000 và `ja377:4.3`; `4.` ở dòng tiêu đề = `catutthaṁ` = 4.

  **Thuật ngữ và tiền lệ đã đo:**
  - `kevalī` (6.2, 8.2, 9.2) → “bậc viên mãn”: cùng cách với `iti97:2.1` và `snp3.6:19.4` (37 khoá chứa `kevalī`, trong đó các bản đã dịch đều “viên mãn” hoặc “toàn vẹn”).
  - `parinibbāna`, `parinibbuta` → “nhập Niết-bàn”: cùng cách với `iti52:4.4`, `ud1.10:12.6`, `ud6.1:9.1` (38 khoá chứa `parinibbut…`, 13 khoá chứa `parinibbāna`; các khoá đã dịch đều “nhập Niết-bàn”).
  - `sītibhūta` → “đã mát lạnh”: `snp3.6:46.3`, `snp3.9:54.2` (54 khoá chứa `sītibhūt…`).
  - `khemī` → “bậc an ổn”: `dhp258:3` (“người an ổn”).
  - `soracca`, `sorata` → “nhu hòa”: `snp1.4:7.4`, `snp2.9:7.3`, `ja420:5.3` (32 khoá chứa `sorat…`/`soracc…`; riêng `ja421:8.2` dịch “giới hạnh”); `khanti` → “nhẫn nhịn” theo `ja421:8.2` (“nhẫn nhịn”).
  - `dhammaṭṭha` → “bậc đứng trong pháp”: `iti19:3.3` “đứng trong pháp” (25 khoá chứa `dhammaṭṭh…`; `ja475:13.3` dịch “vững nơi pháp”).
  - `amama`, `nirāsa` (10.1) → “không sở hữu”, “không mong cầu”: `snp3.4:21.2`, `snp1.12:14.2`; `ud3.6:6.2` dịch `amama` là “không ‘của ta’” (cách đọc khác, cùng nghĩa).
  - `bhavalobha` (10.2) → “tham hữu”: gần `sn4.24:3.3` (“tham đắm và khát cầu hữu”); tầng chỉ có 1 khoá khác chứa `bhavalobha`.
  - `sottiya` → “học giả” theo `snp3.6:36.1` (“bậc học giả”; `mn39:22.1` dịch “người tinh thông”, `thag3.1:3.4` “bậc thuộc lòng Veda”: 14 khoá chứa `sottiy…`, không đồng nhất).
  - `brahmañña` → “hạnh bà-la-môn”: `ud4.8:6.4` (“hạnh Bà-la-môn”, 89 khoá chứa `brahmañña…`, viết hoa “Bà-la-môn” ở `ud`, viết thường ở `ja`).
  - `caṇḍāla`, `pukkusa`: giữ nguyên Pāli theo `ja362:4.2`, `ja474:8.2`; `vessa` → “thương buôn”, `sudda` → “thợ thuyền” theo hai bài đó (tầng `mn` có “Thủ-đà” nhưng giữ theo `ja` để nhất quán nguyên văn).
  - `māṇava` → “thanh niên”: `ud5.9:1.3`, `snp3.5:1.3` (790 khoá chứa `māṇav…`).
  - `apāya` → “đọa xứ”: `kp6:11.1`, `ud8.6:8.1` (492 khoá chứa `apāy…`, gồm cả nghĩa “uống”).
  - `subbata` → “khéo trì giới”: `snp3.2:17.4` (39 khoá chứa `subbat…`; `snp1.12:14.2` dịch “giữ giới hạnh”).
  - `vimāna` → “cung điện” (217 khoá chứa `vimān…`, phần lớn là danh từ chung; `iti22:2.6` “Phạm cung”).

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá, lệch 0/73 khoá: Pāli mở nháy ở `1.1`, `2.1`, `3.1`, `4.1`, `5.1`, `6.1`, `7.1`, `8.1`, `9.1`, `10.1`, `11.1`, `12.1`, `13.1`, `15.1` và đóng ở `1.4`, `2.4`, `3.4`, `4.4`, `5.4`, `6.4`, `7.4`, `8.4`, `9.4`, `10.4`, `11.6`, `12.6`, `14.4`, `16.4`; riêng khổ 13 (`13.1`–`13.4`) Pāli mở nháy mà đóng ở `14.4`, và khổ 15 (`15.1`–`15.4`) mở nháy, đóng ở `16.4`; bản Việt đúng theo từng khoá như vậy. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (không có `(…)` trần trong bài này).

  **Coverage English (mục 7):** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng là 33 ký tự (< 40) nên 0/73 khoá có nội dung; các khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja487` (tra `source/upstream-manifest.json`, không suy từ tên thư mục); `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Không đụng `content/meta/reference-gaps.yaml`.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `Bhaccā mātā pitā bandhū, yena jāto sayeva so` (5.1–5.2): đây là chỗ khó nhất. Đọc ít giả định nhất: “mẹ, cha và thân quyến cần được nuôi dưỡng; người nào sinh ra mình, người ấy chính là bản thân mình”. `bhaccā` dịch theo nghĩa “cần được nuôi dưỡng / phụng dưỡng”; không xác định được chắc chắn `yena jāto` là “người sinh ra mình” (cha mẹ) hay “người do đó mà sinh ra” (con), nên câu Việt giữ cấu trúc song song với Pāli và không thêm “con”, “cha mẹ” ngoài chữ trong Pāli. Ý nghĩa có thể thay đổi nếu đọc kia: “cha mẹ và thân quyến phải được nuôi bởi người do họ sinh ra; chính người ấy [phải lo] điều đó”. Chưa có chứng cứ độc lập trong tầng (0 khoá khác chứa `bhaccā`).
  2. `Niraṅkatvā aggimādāya` (7.1): `niraṅkatvā` dịch “dọn sạch”; Pāli không nêu cái gì được dọn (có thể là nơi tế lễ, tro cũ…), nên không thêm vào thân kinh. Tầng có 0 khoá chứa `niraṅka…`.
  3. `Dhamme ṭhitaṁ tena amāpayiṁsu` (7.4, 10.4): `amāpayiṁsu` (< `māpeti`) dịch “đã xác lập”; nghĩa gốc có thể là “đã gọi/đã tuyên bố”; cả hai đều cùng sắc thái trong ngữ cảnh. `tena` dịch “do đó”. 0 khoá khác chứa `amāpay…`.
  4. `Panatthaṁ carasi brahmaññaṁ` (14.3): `panatthaṁ` đọc `pana` + `atthaṁ` (“vậy … để làm gì”); một cách đọc khác là “vô ích” (`na`+`attha`, nghĩa gần như nhau trong câu hỏi tu từ). 0 khoá khác chứa `panatthaṁ`. `sottiyākulavaṁsataṁ` (14.4) là danh từ trừu tượng (đuôi `-tā`) nên dịch “thân phận dòng dõi gia tộc học giả”.
  5. `Akhettabandhū` (10.1): dịch “không có ruộng đất và thân quyến”, đọc là dvandva `akhetta` + `bandhu`; một cách đọc khác là “không có thân quyến vì ruộng đất / vì tài sản” (karmadhāraya). 0 khoá khác chứa `akhettabandhū`. `Nillobhapāpo` (10.2): dịch “không tham, không ác”; cũng có thể là “không tham và không ác hạnh”. 0 khoá khác.
  6. `karetha` (2.1): dạng ngôi hai số nhiều; Việt dịch “Nếu làm các nghiệp ác” theo cách `ja377:4.1` hiểu `katvāna` (“Nếu tạo tác các nghiệp ác”), vì không thấy nghĩa mệnh lệnh phù hợp trong ngữ cảnh. Không có tiền lệ về chính dạng `karetha` (0 khoá cùng cấu trúc `Pāpāni kammāni karetha`).
  7. `so rāgo anupajjatha` (15.4): `rāga` đọc “màu” (nghĩa gốc `√raj` = nhuộm), không phải “tham ái”; `anupajjatha` đọc “thấm vào / lọt vào”. Câu 15.3–15.4 đọc: “bóng của những tấm vải ấy, màu ấy không thấm vào” — nghĩa là cái bóng không mang màu của từng tấm vải. Nếu đọc `rāga` là “tham ái”, nghĩa của cả khổ 15–16 sẽ khác hẳn; ngữ cảnh (vải nhuộm nhiều màu và hình ảnh thanh tịnh ở 16) ủng hộ “màu”.
  8. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1, 3, 5–6, 9, 11: nhà vua hoặc người hỏi; 2, 4, 7–8, 10: người đáp; 12–14: người đáp rồi chất vấn; 15–16: người đáp kết luận. Đây là suy luận từ nội dung, không ghi vào thân kinh; riêng 3.3 dùng “Trẫm” vì lý do nêu ở trên (2.1 gọi `rāja`).

  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
