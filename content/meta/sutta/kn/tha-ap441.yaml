notes: |-
  Review đối kháng: đọc p44.txt, đọc 38 khoá, tra tiền lệ trên toàn tầng kn. Ba khoá sửa, hai khoá là lỗi nghĩa nặng.
  LỖI ĐÃ SỬA. (1) :1.3 Vicaranto brahāraññe bị dịch thành đi khắp nơi trong nước lớn — arañña là rừng, không phải nước. Tôi tra được tiền lệ rất chắc trong tầng: dhp98:1 Gāme vā yadi vāraññe dịch là Dù ở làng hay ở rừng, ud2.4 và snp1.3 cũng vậy. Tôi sửa thành đi khảo trong rừng lớn. (2) :1.1 Hatthirājā tadā āsiṃ bị dịch thành Bấy giờ có vị vua với đạo quân trong tay, tức đọc nhầm h-attha-rājā thành một cụm nói về quân đội; hatthirājā là vua voi, danh xưng vua theo hình ảnh con voi. Bản dịch Anh xuất bản của chính bài này cũng đọc là elephant-king. Tôi sửa thành Bấy giờ có vị vua voi. (3) :3.2 paribhuñji tadā jino bị dịch thành bậc Chiến Thắng lúc ấy bèn dẫn tôi đi — paribhuñjati là ăn, nuốt, không phải dẫn đi; và câu kế tiếp là tusitaṃ upapajjahaṃ, tức sau khi Đấng Chiến Thắng ăn xong trái cây rồi tôi mới sinh lên Đâu-suất, nên cả chuỗi hành động là ăn chứ không phải đưa đi. Tôi sửa thành bậc Chiến Thắng lúc ấy đã ăn. Cùng Pāli này còn xuất hiện ở tha-ap446:5.2 nên tôi sửa cả hai nơi cho khớp.
  VÌ SAO HẠ ĐIỂM. Ba lỗi trên đều là lỗi nghĩa nặng theo tiêu chí 2 và 3 — sai danh từ, sai nghĩa động từ, sai đối tượng — nên tôi hạ semantic_fidelity xuống 8.9 và grammar_logic xuống 9.0 thay vì để mức của một bài sạch.
  CÒN GIỮ NGUYÊN. :5.2 upasanto nirūpadhi tôi dịch là đã quán chứng sự vắng mặt của các hình tướng, theo nghĩa chữ nghĩa của nirūpadhi; một bản dịch Anh xuất bản đọc là đã thành tựu xứ đã vắng mặt cho đi tái sinh. Tôi không đổi vì nghĩa chữ nghĩa có căn cứ từ điển và tôi không có tầng Anh trong store để phân xử.
  TIỀN LỆ ĐÃ TRA. Ekavihārivagga = Phẩm Sống Một Mình (đa số 4 tệp), cakkavattī = Chuyển Luân Vương, tusitaṃ = cõi Đâu-suất, Catunnavutito kappe = chín mươi tư kiếp, phaladāna = dâng cúng trái cây — đều theo đa số đo được.
  NHÓM KỆ 7.x, 8.x, 9.x TRÙNG NGUYÊN VĂN Ở CẢ SÁU BÀI THA-AP TRONG LÁT. Tôi dựng chỉ mục Pāli → Việt trên toàn bộ tầng kn đã có (1.675 tệp, loại tám uid của lát) rồi đối chiếu: trong lát không còn một Pāli chung nào mà sáu bài dịch khác nhau, và mọi Pāli chung với bài ngoài lát đều trùng khớp hoặc chỉ lệch dấu câu. Bốn câu kệ dùng chung giữ nguyên cách đã có trong kho: Kilesā jhāpitā mayhaṁ = Các phiền não của ta đã được thiêu rụi; viharāmi anāsavo = ta sống không còn lậu hoặc; Svāgataṁ vata me āsi = Thật lành thay sự đến của ta; Paṭisambhidā catasso = Bốn vô ngại giải; kataṁ buddhassa sāsanaṁ = đã làm tròn lời dạy của Đức Phật.
  CHÚ Ý VỀ Svāgataṁ vata me āsi — TÔI CỐ Ý KHÔNG SỬA. Đếm được 54 tệp trong kho dịch câu này thành Thật lành thay sự đến của ta (đa số áp đảo; nhóm kế cạnh là Thật là đón mừng thù thắng thay cho tôi 21 tệp). Nghe thì có vẻ là đọc nhầm: svāgataṃ ở đây là tiếng than thở tự vệ, không phải danh từ sự đến. Nhưng sửa sáu khoá trong lát này sẽ tạo ra thứ tự N+1, và BRIEF_VI3 §6 nói rõ phải dịch nhất quán theo bản Việt đã có. Tôi giữ nguyên và giao việc này lại cho người điều phối quyết định thay cả kho; nếu đổi thì phải đổi cả ~54 tệp, không được sửa lẻ.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Những gì tôi tự kiểm được và đều sạch: JSON hợp lệ, đúng 38 khoá mỗi bài, tập khoá khớp tuyệt đối với content/catalog/sutta/kn.json và với all trong vc/c44.json, không orphan, không rỗng, không còn stub dạng (…), toàn bộ NFC, số dấu lược không bao giờ vượt số dấu lược của Pāli và mỗi …pe… của Pāli còn đúng một dấu …, YAML parse sạch bằng thư viện yaml của kho.
