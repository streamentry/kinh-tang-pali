notes: |-
  ĐỌC HẾT p44.txt trước khi viết. 0.1 Therāpadāna giữ nguyên Pāli (291/300 khoá :0.1 của tầng tha-ap). 0.2 Ekavihārivagga = Phẩm Sống Một Mình (2/3 tệp). 0.3 và 11.1 có sẵn nguyên văn trong tầng: Bài Kệ Tuyên Ngợ Về Trưởng Lão Ambapiṇḍiya và …, thứ chín, nên tôi dùng lại nguyên văn (thứ chín 27/27 tệp).
  NHÓM KỆ 7.x, 8.x, 9.x trùng nguyên văn ở cả sáu bài tha-ap của lát này: một bản Việt cho mỗi Pāli, chọn theo đa số đo được (Các phiền não của ta đã được thiêu rụi 56/85 · ta sống không còn lậu hoặc 56/84 · Thật lành thay sự đến của ta 54/82 · đã làm tròn lời dạy của Đức Phật 60/82 · Bốn vô ngại giải 300/300 · đã làm tròn lời dạy của Đức Phật”. 270/299 · …pe… giữ đúng một dấu lược). Lưu ý tha-ap441 có thêm một khoá 5.4 cùng Pāli viharāmi anāsavo. với 7.3, tôi dùng cùng một bản Việt.
  KỆ KẾT 6.1-6.4: Catunnavutito kappe = Vào chín mươi tư kiếp trước đây (18/70 tệp) · yaṁ phalamadadiṁ tadā = khi ta dâng cúng trái cây ấy (5/11 tệp) · Ta không biết mình rơi vào khổ đau (93/278 tệp) · phaladānassidaṁ phalaṁ = đây là quả báo của việc dâng cúng trái cây (11/31 tệp). Cả bốn câu này trùng nguyên văn với tha-ap446:6.1-6.4, tôi dùng cùng bản dịch cho hai bài.
  CÁC KỆ GIỮA ĐÃ TRA. Padhānapahitattohaṁ = Tôi đã đi sâu vào tinh tấn và upasanto nirūpadhi = đã quán chứng sự vắng mặt của các hình tướng: hai câu này trùng nguyên văn với tha-ap347:7.1-7.2, tôi dùng lại nguyên văn. Sabbāsave pariññāya = Do đã hoàn toàn thấy rõ các lậu hoại (tha-ap347:7.3 cùng công thức, tôi theo) · adāsiṁ satthuno ahaṁ = dâng lên Bậc Đạo Sư (5 tệp) · Tattha cittaṁ pasādetvā = sau khi khiến tâm tịnh tín nơi đó (tha-ap520:3.3, nguyên văn) · tusitaṁ upapajjahaṁ = tôi được sinh về cõi Đâu-suất (tha-ap308:5.4, nguyên văn) · cakkavattī ahosahaṁ = tôi từng làm Chuyển Luân Vương (tha-ap347:4.2, nguyên văn) · addasaṁ lokanāyakaṁ = tôi nhìn thấy Đấng Dẫn Đạo thế gian (2 khoá) · Paṭiggaṇhi mahāvīro: dùng bậc Đại Anh Hùng như nhóm khuôn. 0 tiền lệ: Hatthirājā, īsāda (nghiêm trị), Ambapiṇḍa (giữ nguyên Pāli, trái xoài), ambapiṇḍa ở cả tầng.
  BẤT ĐỊNH ĐÃ GHI NHẬN. (1) Hatthirājā tôi dịch là vị vua với đạo quân trong tay, theo nghĩa chữ thay vì đặt tên riêng; không có tiền lệ trong tầng. (2) Mama nijjhāyamānassa tôi dịch là Khi tôi đang sống an nhàn; cụm này trùng nguyên văn với tha-ap446:5.1 nên hai bài dùng chung một cách dịch. (3) paribhuñji tadā jino tôi dịch là bậc Chiến Thắng lúc ấy bèn dẫn tôi đi; paribhuñji có thể là bắt đi hay tiếp dẫn đi, tôi chọn nghĩa tiếp dẫn vì câu kế là tái sinh, và ghi ở đây.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
