  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá). Bài kệ này là một tập ghép nhiều khúc. Nháy theo đúng từng khoá của Pāli: chỉ có 4 ký tự nháy ở Pāli (`“` ở `1.1`, `”` ở `40.4`, `‘` ở `34.1`, `’` ở `35.4`), Việt đúng 4 ký tự đó ở cùng 4 khoá. Pāli không đóng nháy ở `3.4`, `7.6`, `11.4`, `20.4` hay mở lại ở các kệ sau như Sujato chia lời, nên bản Việt không thêm nháy nào; `iti` ở `3.1` (`Paṅkoti`), `24.4` (`seyyoti`), `26.1`–`26.3` cũng không thêm nháy. Cấu trúc: kệ `1`–`3` Mahākassapa dạy về hội chúng, gia đình và lợi dưỡng (kệ `3` song song `thag8.1:2`); kệ `4`–`7` kể bữa ăn với người cùi (song song `mil7.5.6:2`–`4`) và bốn nhu yếu theo hạnh đầu-đà; kệ `8`–`11` Kassapa leo núi sau khất thực; kệ `12`–`20` ca ngợi những vách đá nơi ngài ở (một phần song song `thag1.13`, `thag1.113`, `thag11.1:5`); kệ `21`–`23` niềm vui thiền và việc không nên làm; kệ `24`–`29` về ngã mạn và sự tôn kính với bạn đồng phạm hạnh; kệ `30`–`31` về y phấn tảo (kệ `30`–`31` song song `thag15.1:9`–`10`); kệ `32`–`36` chư thiên kính lễ Sāriputta, Kappina mỉm cười; kệ `37`–`38` lời tự nhận về hạnh đầu-đà và gánh nặng đã đặt xuống (kệ `38` cùng Pāli với `thag15.1:15`, `thag17.3:37`); kệ `39`–`40` ca ngợi Đức Phật (Gotama).

