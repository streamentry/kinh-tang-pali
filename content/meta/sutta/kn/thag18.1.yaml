    · `Dhammasenāpati` → Tướng quân Chánh pháp (22 khoá chứa `dhammasenāpati`: `Tướng quân Pháp` và `Tướng quân Chánh pháp` mỗi dạng 3–4 khoá ở `mil7`, hòa; chọn `Chánh pháp` theo `mil7.2.5`, `mil7.6.10`); `brahmakāyika` → chư thiên Phạm Chúng (38 khoá chứa `brahmakāyik`, `dn33`/`dn34` viết `Phạm Chúng`); `devakāya` → hội chư thiên.
    · `purisājañña` → bậc tuấn mã giữa loài người (`sn22.79:15.1`, `an11.9:4.1`; 4/22 khoá, `Kính lễ Ngài, bậc cao quý giữa loài người` 8 khoá ở `dn32`); `purisuttama` → bậc tối thượng giữa loài người (20 khoá cùng Pāli); `pañjalīkata` → đứng chắp tay (`mn92:28.15`, `snp3.7:42.2`).
    · `vālavedhī` → người bắn xuyên sợi tóc (6 khoá chứa `vālavedhi`: `dn8:4.1`, `mn89:17.1`, `mn27:4.2`; `dn1:2.26.6` viết `chẻ sợi tóc`); `gocara` → cảnh giới (tầng không có khoá Pāli cùng dạng, 0); `buddhakhetta` → cõi Phật (tầng 0 khoá cùng dạng); `dhutaguṇa` → hạnh đầu-đà (3 khoá, `mil5.1.7:7.3`, `mil6.1.3:1.6`).
    · `karerī`, `umā`, `indagopaka` → giữ nguyên tên (`umāpuppha` 22 khoá viết `hoa umā`, `indagopaka` ở `ja482:3.3`, `kareri` không có tiền lệ trong tầng, 0 khoá); `pañcaṅgika turiya` → dàn nhạc năm loại (`dn17:1.6.11`, `an8.46:4.2`); `dija` → chim (`pv24:4.1`, `dn32:7.54`).
    · `satipaṭṭhāna` → niệm xứ; `nekkhamma` → xuất ly; `tibhava` → ba hữu; `mahāñāṇī` → bậc có đại trí (tầng 0 khoá cùng dạng).
    · `Paṭhamavagga` → Phẩm Thứ Nhất, `Cattālīsanipāta` → Bộ Bốn Mươi Bài Kinh, `Mahākassapattheragāthā` → Kinh Kệ Của Trưởng Lão Mahākassapa, theo khuôn `thag17.3:0.1`–`4`; `niṭṭhito` → đã khép lại (các khoá chứa `niṭṭhito` ở tầng: `kết thúc` 39, `hoàn tất` 16, `khép lại` 11, `chấm dứt` 2; trong chính các bộ thag dạng `Bộ … Bài Kinh` thì `đã khép lại` là khuôn đã dùng, như `thag17.3:37.6`, và chọn theo khuôn ấy); bìa `40.5` theo khuôn `… Trưởng lão X …` không chấm (`thag11.1:11.5`, `thag17.3:37.5`); `Tatruddānaṁ` → Tóm tắt ở đây.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `7.1` `Uttiṭṭhapiṇḍo āhāro`: tôi dịch `vắt cơm đứng khất thực` (`uttiṭṭha` đứng lên/đứng khất thực). Sujato dịch `leftovers` (đồ ăn thừa), bản Việt hiện hành (Indacanda) `vắt cơm do đã đứng (khất thực)`. Hai cách hiểu `đồ thừa` và `cơm khất thực đứng` khác nhau; tầng không có tiền lệ (0 khoá chứa `uttiṭṭhapiṇḍo`). Không phán.
    · `7.5` `Yassete abhisambhutvā`: `abhisambhoti` có thể là `vượt qua, đủ sức đối phó, làm chủ` hoặc `thọ dụng` (Sujato `makes use of`, Indacanda `thọ hưởng`). Bản Việt viết `kham nổi những điều này` (như `durabhisambhava` ở `mn4:2.8` `khó kham nổi`), giữ được cả hai cách đọc phần nào; không phán.
    · `13.2` `vārisītā sucindharā`: `sucindharā` ở Pāli của tầng không có tiền lệ độc lập (0 khoá); tôi dịch `suối trong trẻo` theo Sujato (`streams so clear`) và `thag1.13:1.2`; nghĩa chính xác chưa chắc. `13.3` `indagopaka` là loài bọ đỏ nhỏ (Sujato `ladybugs`, Indacanda `mối đỏ`), giữ tên Pāli.
    · `22.2` `na uyyame`: tôi dịch `không nên gắng sức`; Sujato `don't try to acquire things`, Indacanda `không nên gắng sức`; không rõ gắng sức làm gì; `thag8.1:1.2` dịch `đừng tìm tấm tìm tắm`, tôi không dùng vì không phản ánh được Pāli.
    · `23.2` `anattaneyyametaṁ`: tôi dịch `điều không đưa đến mục tiêu` theo Sujato (`what doesn't lead to the goal`), cách đọc `an-attha-neyya`; tầng không có tiền lệ độc lập.
    · `24.1` `Oṭṭhappahatamattena`: `chỉ nhờ mấp máy đôi môi` (Indacanda `chỉ với việc mấp máy đôi môi`); Sujato `merely reciting words` hiểu thành đọc tụng. Bản Việt giữ nghĩa đen, không thêm `đọc tụng`.
    · `24.4` `ahaṁ seyyoti maññati`: Sujato thêm `than them`; Pāli chỉ `ahaṁ seyyo` nên bản Việt viết `mình hơn`, không thêm `người khác`.
    · `26.1`–`26.4` `vidhāsu`: `vidhā` là các cách so đo (hơn, bằng, kém) của ngã mạn, bản Việt viết `các sự so đo`; câu dài trải hai kệ, đọc cả `26.1`–`27.4` mới trọn nghĩa.
    · `35.4` `vālavedhisamāgatā`: `samāgata` là `đã tụ hội` (Sujato `gathered here to split hairs`) hay `được trang bị` (Indacanda `được hội tụ sự (tinh tế như người bắn tên) xuyên thủng cọng tóc`). Bản Việt viết `dù là những người bắn xuyên sợi tóc đã tụ hội`, giữ cả hai; không phán.
    · `3.1` `Paṅkoti`: `paṅka` dịch `vũng bùn` (Sujato `bog`, Indacanda `bùn lầy`, `thag8.1:2.1` `bãi lầy`); không có tiền lệ độc lập đo được.
    · `5.3` `Ālopaṁ pakkhipantassa`: Pāli không nói `vào bát`, bản Việt viết `vào bát` theo `mil7.5.6:3.3` và Sujato; `aṅguli` ở `5.4` là ngón tay của người cùi (Pāli không nói `của người ấy`).
    · `8.3` `Tassa buddhassa dāyādo`: `tassa` đi với `buddhassa` (`của vị Phật ấy`), không phải `nơi ấy` như bản Việt hiện hành đọc; `8.6` `nơi ấy` là chữ thêm bắt buộc để tương ứng `yattha` ở `8.1`.
    · `39.1`–`39.6`: chủ ngữ của `nupalimpati` (`Gotamo`) đến ở `39.3`; `muḷālapupphaṁ` là hoa sen (Sujato `lotus flower`, `muḷāla` thường là ngó sen) và `ambunā` ở `39.5` dùng cho `vimalaṁva` ở `39.4`; bản Việt giữ thứ tự khoá Pāli (`bởi nước` ở `39.5`). Bản Việt hiện hành (Indacanda) không có khối này (thiếu kệ `39`).
    · `41.4` `cattālīsa duvepi cāti`: 40 + 2 = 42, lệch với số nhóm khoá 40 (xem phép 5); không sửa.

