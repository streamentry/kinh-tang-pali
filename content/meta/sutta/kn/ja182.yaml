notes: |-
  **Dịch từ Pāli một mình.** Không có Sujato ở commit đã ghim, cũng không có bản Việt Thích Minh Châu (xem mục chung). Những chỗ tôi phải tự phân xử, đều ghi dưới đây.

  **`khippa` mang hai nghĩa, và Pāli cố ý dùng cả hai — tôi giữ cả hai.** `2.1` `khippaṁ` là danh từ: *gông cây* (cùng loại với `paligha` = *gông sắc*, cái cọc sắt cắm giữ voi). `2.4` `khippaṁ pavisa` thì `khippa` là trạng ngữ: *thật nhanh*. Nếu gộp một nghĩa thì mất ngay phân biệt của Pāli.

  **`toraṇa` tôi dịch *hẻm chật*, dùng nhất quán ở `1.3` và `2.3`.** Từ điển tra cho ba nghĩa (hẻm, chỗ phục kích, địa ngục) và bài chỉ có hai chỗ, cùng một danh sách hiểm nguy với bóng tối. Sujato (bản `ja191` cũng không có) không giúp được. Tôi chọn *hẻm chật* vì `2.3` `Toraṇāni ca madditvā` là số nhiều, và `madditvā` (giẫm nát) hợp với địa ngục hơn là với bẫy rập.

  **`esikāni ca abbaha` — dịch *cả những dây cương nữa, vị ấy phá vỡ*.** Động từ `bhāsati/pavisa/madditvā` ở `2.3`–`2.4` không có chủ thể tường minh, chủ thể là con voi mà bài gọi tên ở `1.1` và `2.4` (`kuñjara`/`kuñjarā`); tôi đặt *vị ấy* ở `2.2`. `abbaha` tôi đọc là *phá vỡ* (PED `abbaha` = destroyed). Dây cương là của kẻ cưỡi voi mà nó đốt phá — câu kệ không nói rõ, tôi **không** thêm giải thích nào vào thân bài.

  **`Kiṁ nu` tôi dịch *tại sao*, và tôi dồn nó sang `1.4` cùng `paṭikkamasi kuñjara`.** Bản nháp đầu của tôi dịch `1.3` là *Hẻm chật bẫy rập ở đâu* — vừa trả lời sai câu hỏi *tại sao*, vừa cắt đôi vế Pāli. Đã sửa.

  **`0.2` `Dukanipāta` → *Tập Hai*, và đây là MÂU THUẪN CẦN BIÊN TẬP PHÁN XỬ.** Sáu tệp đã có (`ja195`–`ja198`, `ja201`, `ja218`) dùng *Tập Kẻ Đau Đớn* cho chính Pāli `Dukanipāta` — mà `duka` là *hai*, `nipāta` là *quyển*, tức *Bộ Hai*; *Tập Kẻ Đau Đớn* không ứng với chữ nào trong Pāli. Tôi dịch theo Pāli, **không** nhân lại lỗi của sáu tệp kia, vì AGENTS.md đặt Pāli làm authority cuối cùng. Hệ quả trung thực: hiện có hai cách cho cùng một Pāli, và tôi ghi đây để biên tập sửa nốt sáu tệp kia. Tôi **không** sửa chúng vì ngoài lát của tôi.

  **`0.3` `Asadisavagga` → *Phẩm Bất Bại* (0 tiền lệ).** `asadi` = không bị thắng; bài đầu của phẩm là `ja181 Asadisajātaka` với câu `Dhanuggaho asadiso` (*bậc chinh phục, bất bại*). Cùng dạng đặt mới như `Asadi` không có tiền lệ nào trong tầng.

  **`0.4` `Saṅgāmāvacarajātaka` → *2. Kinh Saṅgāmāvacara*.** Tôi phi chuyển danh từ vì đây là tên bài, và tầng có tiền lệ phi chuyển danh từ trong tiêu đề Jātaka (`ja198` *Kinh Rādha*, `ja218` *Kinh Kūṭavāṇija*). `sūro` → *dũng sĩ* (2 tiền lệ cho `mahāvīra`, `thag1.66:1.1`); `balavā` → *mạnh mẽ*; `vissuta` → *được tiếng là*; `paṭikkamasi` → *rơi vào*.

  **Tầng Việt hiện hành không có.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa 27 tệp Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế chỉ là Pāli + English Sujato.

  **Sàn coverage không kích hoạt, nhưng ô Anh trống KHÔNG phải đồng thuận.** Hàm `kiểm()` của `_hvi.py` lọc `cần = [k for k in p if len(p[k]) >= 40 …]`. Ở bài này mọi khoá Pāli ngắn hơn 40 ký tự, nên `cần` RỖNG và NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy. Tôi đã tự quét lại MỌI khoá bằng một lớp kiểm riêng áp đúng các quy tắc ấy lên toàn bài, và in ra từng cặp Pāli ↔ Việt để đọc đối kháng.

  **Ngoại lệ đã đo, không phải lỗi.** Khoá `:0.1` trùng nguyên văn Pāli là quy ước của tầng: 168/516 tệp `kn/*` có `:0.1` là chuỗi Pāli nguyên văn (đếm bằng script). Tương tự, tên riêng mang dấu Pāli trong tiêu đề là tiền lệ (`thag1.101` Belaṭṭhānika, `thag1.11` Cūḷavaccha, `thag1.15` Kuṇḍadhāna), và dấu lược trần `…` xuất hiện 446 lần trong tầng.

  **Tôi không chạy `npm run validate|test|check|build`** (đợt này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0 — đúng như `thag1.107` đã làm.
