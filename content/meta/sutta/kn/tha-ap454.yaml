notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `tha-ap`.
  Dùng lại nguyên văn 18/34 khoá có tiền lệ: `Phẩm Cúng Dường Bệ Nền` (4× cho `Jagatidāyakavagga`), `Với tâm tịnh tín hân hoan,` (24×), `cùng với tâm nguyện và chí hướng;` (3× cho `cetanāpaṇidhīhi ca;`), `mọi cõi hữu đều đã được nhổ sạch;` (2×), `nay không còn tái sanh nữa.` (1×), `Vào ba mươi mốt kiếp trước đây,` (9×), cụm kệ 6–8 như tha-ap384.
  Thuật ngữ chính của bài là `morahattha` — 0 khoá tiền lệ trong toàn tầng, và không có bản Anh để đối chiếu. Dịch `bàn chân công` (chân công = morahatta) và giữ nhất quán ở cả 5 khoá 1.1/1.4/2.1/3.3/5.4; nghĩa chính xác của vật này (đế tế hay bệ ngồi hình công) cần người biên tập có chú giải để chốt, chưa dám khẳng định trong thân kinh.
  `Nibbāyiṁsu tayo aggī` (2.3) và `Tiyaggī nibbutā mayhaṁ` (4.1) đều là ba ngọn lửa, giữ nguyên hình ảnh không chú giải thành tham sân/sân hận/ngã mạn.
  `Aho buddhā aho dhammā, / aho no satthusampadā;` (3.1–3.2) là tiếng thán từ của Trưởng lão sau khi thấy quả báo, dịch theo sắc thái hào hứng, không thêm nội dung.
  `…pe…` giữ một dấu lược; `Bốn vô ngại giải,` và bản đóng nháy dùng lại nguyên văn.
