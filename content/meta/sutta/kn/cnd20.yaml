notes: |-
  **Phạm vi: đủ 185/185 khoá của cnd20, không khoá nào ngoài tập khoá Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Piṅgiya (Pārāyana, câu hỏi thứ mười sáu, câu hỏi cuối), tức bài kệ `snp5.17`. Cấu trúc như `cnd6`, `cnd12`, `cnd13`: dẫn từng đoạn kệ rồi giải từng cụm; bốn đoạn kệ (`1`, `9`, `18`, `24`) mỗi đoạn được dẫn một lần không có nháy, rồi dẫn lại có nháy (`8`, `17`, `23`, `29`) sau lời giải. Pāli của bài **không có** `(…)`; có 16 khoá chứa `…pe…` (đều thành đúng một `…`) và 18 khoá có `…` trần (đều giữ `…`); `3.2` và `3.3` Pāli kết `…pe….` nên Việt kết ` ….`.

  **Cách trình bày lemma** theo `cnd6`/`cnd13`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. `Iccā` giữ nguyên Pāli ở `3.2` (như `cnd13:2.4`) vì lời giải nói về chính hình thức của từ ấy. `Rāhu` (`10.5`) là tên riêng. Hô cách `piṅgiyāti bhagavā` ở `9.2`, `17.2`, `24.2`, `29.2` dịch *(Này Piṅgiya, Đức Thế Tôn nói,)* theo `cnd13:7.2` và `cnd6:10.2`, vì chú giải `11.2`, `25.8` giảng riêng `Piṅgiyā` là Đức Thế Tôn gọi vị Bà-la-môn bằng tên; `snp5.17:2.2` dịch *(Đức Thế Tôn trả lời:)* và bỏ hô cách nên không dùng lại cho bốn khoá này.

  **Tầng tham khảo — đo, không đoán.** Sujato không có `cnd20`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; tệp `cnd20_translation-en-sujato.json` không tồn tại, chỉ có tệp tên `cnd-name` (nhãn tác phẩm, không phải văn bản kinh). Lớp `english-project` cũng không có cnd20. `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự, bỏ khối `:0`) là **67** khoá; Sujato phủ 0/67 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/67, `vietnamese-current` 0/67. Có hai chứng cứ độc lập trong chính corpus, nhưng đều là bản của **bài khác** nên không tính là đối chiếu English của cnd20: (a) bốn đoạn kệ (24 dòng) trùng Pāli với `snp5.17`, bài mà Sujato có dịch (*I am old, feeble, and pallid*, *my eyes unclear, my hearing faint*, *don't let me perish while still confused*, *those negligent folk are inflicted on account of forms*, *tormented, mired in old age*); (b) `mn13:14.3` (Sujato *porridge pot … beheaded*) cho danh sách hình phạt ở `10.5`, và công thức chú giải đã dịch ở `cnd6`, `cnd12`, `cnd13`.

  **Dùng lại tiền lệ.** Đã dò toàn tầng Việt (kể cả `cnd1`, `cnd3`, `cnd4`, `cnd6`, `cnd12`–`cnd15`): 66 khoá có Pāli (bỏ thẻ in đậm, khớp cả dấu câu) trùng nguyên văn với khoá ngoài bài này; dùng lại nguyên văn ở 62 khoá, khác ở 4 khoá (`9.2`, `17.2`, `24.2`, `29.2`: Pāli `(piṅgiyāti bhagavā)` trùng `snp5.17:2.2`, `4.2` dịch *(Đức Thế Tôn trả lời:)* và bỏ hô cách; ở đây theo `cnd13:7.2`, `cnd6:10.2` dịch *(Này Piṅgiya, Đức Thế Tôn nói,)* vì chú giải `11.2`, `25.8` giảng riêng `Piṅgiyā` là Đức Thế Tôn gọi vị Bà-la-môn bằng tên). Đo lại bằng cách bỏ dấu câu và chữ hoa/thường: 87 khoá trùng, 59 dùng lại nguyên văn, 28 khác; 28 khoá ấy gồm các cặp kệ so với lemma chỉ khác dấu câu hoặc chữ hoa (`1.1`, `2.6`, `3.5`, `4.6`, `5.5`, `9.1`, `9.5`, `10.8`, `11.4`, `14.6`, `15.5`, `16.5`, `17.2`, `18.1`, `24.1`, `25.6`, `25.10`, `26.7`, `27.6`, `28.1`; cùng nghĩa, cố ý theo từng ngữ cảnh), bốn khoá hô cách như trên, `10.5` (Pāli của `mn13:14.3` và `mn14:13.3` trùng nhưng hai bản ấy đặt tên hình phạt trong nháy đơn; ở đây theo `mn129:29.2`, `mn130:7.7`, xem dưới) và `13.3`–`13.6` (`mn112`, `mn144`, `mn147` trùng Pāli nhưng là cụm định vị *ở/trong tai* trong ngữ cảnh khác, còn ở đây là câu tuyệt đối *khi tai …*). Các khoá đã dùng lại gồm bốn đoạn kệ `snp5.17`, công thức `Vì thế, vị Bà-la-môn ấy đã nói—` / `Vì thế, Đức Thế Tôn đã nói—` (`cnd12`, `cnd13`), `Tham ái: ái sắc … ái pháp.` (`cnd6:13.2`), `Thế Tôn: đây là lời xưng hô tôn kính …` (`cnd6:12.2`, `cnd13:9.3`, `cnd14:16.10`), `Tôn giả: đây là lời thân ái ….` (`cnd12:2.6`, `cnd13:2.6`), `Sắc: bốn đại và sắc do bốn đại tạo thành` (`sn22.56:3.2`), `10.5` (`mn129:29.2`), nhãn và đoạn kết (`cnd6:28.1`, `cnd6:28.2`, `cnd6:28.6`, `cnd13:27.2`).

  **Trong chính bài:** 31 nhóm Pāli trùng nguyên văn (41 cặp, sau khi bỏ thẻ in đậm và dấu cách thừa); cả 31 nhóm bản Việt giống hệt (0 nhóm khác). Thêm các cặp chỉ trùng khi bỏ dấu câu/hoa thường (kệ so với lemma, ví dụ `1.1`/`2.6`, `1.3`/`4.6`, `1.5`/`6.5`, `9.4`/`15.5`); khác ở dấu câu hoặc dạng lemma, đều cố ý.

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `pamāda` → *phóng dật* (1.210 khoá chứa `pamād-`/`pamatt-`: *phóng dật* 765, *buông lung* 130); `appamatto` → *không phóng dật* theo `snp5.17:2.4` (812 khoá chứa `appamād-`/`appamatt-`: *không phóng dật* 466, *tinh cần* 169, *không buông lung* 77).
  - `ruppanti` → *bị thương tổn* theo `snp5.17:2.3` (cùng Pāli, 1/1 khoá); chuỗi `ruppanti kuppanti pīḷayanti ghaṭṭayanti, byādhitā domanassitā honti` chưa có tiền lệ (0 khoá) nên dịch *bị thương tổn, bị kích động, bị đè nén, bị cọ xát, trở nên đau bệnh, ưu phiền*. `sn22.79` dịch `ruppati` là *bị biến dạng* (của sắc, khác ngữ cảnh) và `mn105` *làm tổn thương*; không dùng vì kệ của chính bài này đã chốt *bị thương tổn*.
  - `santāpajāte jarasā parete` → *bị bức bách, bị già chi phối* theo `snp5.17:4.3` (`santāp-`: `ud3.10:4.1` *sự thiêu đốt*, kệ `snp5.17:4.3` *bức bách*); Sujato dịch *tormented*. Dùng *bức bách* cả ở kệ lẫn chú giải để lemma khớp kệ.
  - `kāmaguṇa` → *dục lạc* ở `14.2` (toàn tầng, cụm `pañca kāmaguṇ-`: *năm dục trưởng dưỡng* 67, *năm dục lạc* 14, *năm dục công đức* 13; ở bộ gần nhất `snp` 4 trong 6 khoá dùng *dục lạc*, gồm `snp1.9:21.1`, `snp2.7:2.3`, `snp1.3:16.3`, `snp1.3:17.3`); lệch khỏi đa số toàn tầng nhưng theo `snp`, vì *dục trưởng dưỡng* khó hiểu đối với người đọc hiện đại.
  - `jiṇṇo vuḍḍho mahallako addhagato vayoanuppatto` → *già nua, cao tuổi, uy lão, tuổi đã cao, đã đến giai đoạn cuối của đời* theo `mn82:30.4`, `mn82:38.11`, `mn91:2.1`, `mn91:26.x` (6 khoá cùng chuỗi); `uy lão` giữ vì tiền lệ đồng nhất ở 6 khoá, dù là dạng cổ (88 khoá chứa `mahallak-`, *uy lão* 12). `vīsavassasatiko` → *một trăm hai mươi tuổi* theo `mn91`.
  - `khattiyā … suddā` → *Sát-đế-lợi, Bà-la-môn, Phệ-sa, Thủ-đà* theo đa số (21 khoá có cả `vessā` và `suddā`: *Phệ-sa* 8, *Phệ-xá* 6; *Thủ-đà* 14, *Sát-đế-lợi* 15).
  - Danh sách hình phạt `10.5` theo `mn129:29.4`, `mn129:4.2`, `mn129:29.2`, `mn130:7.7` (*làm kiểu nồi cháo, kiểu cạo vỏ ốc, kiểu mỏ Rāhu, kiểu tràng hoa lửa, kiểu đuốc tay, kiểu vặn dây cỏ, … tạt dầu sôi; thả chó cắn; đóng cọc sống; chém đầu bằng kiếm*; 4 khoá); cách còn lại (`mn13:14.3`, `mn14:13.3`, `an2.1`, `an4.121`) dùng tên hình phạt trong nháy đơn hoặc tiền tố *hình*, không chọn vì Pāli ở đây không có nháy và vì `mn129`/`mn130` cùng dùng động từ `karonti`. Đếm danh sách: 26 mục Pāli = 26 mục Việt (3 roi/gậy + 3 tay/chân + 3 tai/mũi + 13 kiểu + 4 mục cuối).
  - `punapaṭisandhiko bhavo` → *hữu kết sinh lại*; `kāmadhātu`/`rūpadhātu`/`arūpadhātu`, `kāmabhava`/`rūpabhava`/`arūpabhava`, `saññābhava`… `nevasaññānāsaññābhava`, `ekavokāra`/`catuvokāra`/`pañcavokārabhava` theo `cnd13:15.16`–`15.27` (*dục giới / sắc giới / vô sắc giới*, *dục hữu / sắc hữu / vô sắc hữu*, *hữu tưởng / hữu vô tưởng / hữu phi tưởng phi phi tưởng*, *hữu một / bốn / năm uẩn*). `janeyya sañjaneyya nibbatteyya abhinibbatteyya` → *không sinh ra, không sinh khởi, không phát sinh, không phát sinh trọn vẹn* theo `cnd13:22.3` (cùng bốn động từ, nghĩa *làm sinh ra / làm sinh khởi / làm phát sinh / làm phát sinh trọn vẹn*); `bhavo na nibbatteyya` ở đầu chuỗi cũng *không phát sinh* cho cùng một động từ. `punagatiyā` (`28.5`; `16.4` tách `puna gatiyā`) → *trong việc lại đi vào một nẻo* (`puna` + `gati`, gần `cnd14:12.1` *lại đi đến một cảnh giới*), `vaṭṭe` → *vòng luân chuyển* theo `cnd14:12.1`. `idheva nirujjheyya vūpasameyya atthaṁ gaccheyya paṭippassambheyya` → *chấm dứt ngay tại đây, lắng dịu, biến mất, an tịnh* theo `cnd14:12.1`. Chuỗi `phuṭṭhe parete samohite samannāgate`, `jātiyā anugate jarāya anusaṭe … atāṇe aleṇe asaraṇe asaraṇībhūte` (`26.5`–`26.6`) theo `cnd14:9.1`, `9.2`, `18.1` (*chạm đến, bủa vây → chi phối, vây chặt, gắn liền; sinh bám theo, già lan khắp, bệnh áp đảo, chết đánh gục, không nơi che chở, không nơi nương náu, không chỗ quy y, trở thành không chỗ quy y*); `parete` giữ *chi phối* vì kệ `snp5.17:4.3` đã chốt *bị già chi phối*, khác *bủa vây* của `cnd14`. `anusaṭa` → *lan khắp* cả ở `25.3` và `26.6`.
  - Chuỗi `ācikkhāhi desehi paññapehi paṭṭhapehi vivarāhi vibhajāhi uttānīkarohi pakāsehi` theo `cnd12:10.4`, `cnd13:18.3`; cụm `ādikalyāṇaṁ … ariyaṁ aṭṭhaṅgikaṁ maggaṁ, nibbānañca nibbānagāminiñca paṭipadaṁ` theo `cnd12:10.4` (nguyên văn phần đầu). `jāneyyaṁ ājāneyyaṁ vijāneyyaṁ paṭivijāneyyaṁ paṭivijjheyyaṁ` theo `cnd13:17.9`, thêm ba động từ còn lại *đạt được, chạm đến, chứng ngộ* (0 tiền lệ cho `adhigaccheyyaṁ phasseyyaṁ`; `sacchikar-` 16 khoá, *chứng ngộ* 9, *chứng* 16 khoá chứa cả hai).
  - `jānitvā tulayitvā tīrayitvā vibhāvayitvā vibhūtaṁ katvā` theo `cnd6:5.1` (*đã biết, đã cân nhắc, đã thẩm xét, đã làm cho rõ ràng, đã làm cho sáng tỏ*), `10.7` đổi `jānitvā` thành `disvā passitvā` (*đã thấy, đã nhìn thấy*).
  - `ādīnavo pātubhūto` → *nguy hại đã hiện rõ* theo `mn13:19.4`… (6 khoá cùng Pāli); `yā sā purimā subhā vaṇṇanibhā sā antarahitā` → *vẻ đẹp trước kia ấy đã biến mất* theo cùng nơi.
  - `rūpahetu rūpappaccayā rūpakāraṇā` → *do sắc là nhân, do sắc là duyên, do sắc là nguyên cớ* (0 tiền lệ); `taṅkāraṇā taṁhetu tappaccayā taṁnidānā` → *vì nguyên cớ ấy, vì nhân ấy, vì duyên ấy, vì căn nguyên ấy* (0 tiền lệ, nhưng dùng lại đúng ba chữ *nhân / duyên / nguyên cớ* của `10.3`).
  - `sakkaccakārī sātaccakārī` → *người làm cẩn trọng, người làm liên tục* (0 tiền lệ ở tầng; các cnd khác chứa chuỗi này chưa dịch).
  - Nhãn: `Cūḷaniddesa` → *Tiểu Tập Kể Lược*, `Pārāyanavagganiddesa` → *Kể Lược Phẩm Bờ Kia*, `Pucchāniddesa` → *Kể Lược Các Câu Hỏi*, tên bài và colophon theo `cnd13:0.4`, `27.3` (*niddesa* → *Kể Lược*; người biên tập có thể đổi hàng loạt khi chốt tên).

  **Số Pāli.** `vīsavassasatiko` = vīsa 20 + vassasata 100 = **120** (*một trăm hai mươi tuổi*); `disā catasso vidisā catasso, uddhaṁ adho` = 4 + 4 + 2 = **10** (`dasa disā`, *mười phương*); `catasso` = 4, `cattāro mahābhūtā` = 4, `cattāro satipaṭṭhāne`/`sammappadhāne`/`iddhipāde` = 4/4/4, `pañcindriyāni`/`pañca balāni` = 5/5, `satta bojjhaṅge` = 7, `aṭṭhaṅgikaṁ` = 8 chi; `ekavokāra`/`catuvokāra`/`pañcavokāra` = 1/4/5; `anekapāṇasahassānaṁ` chỉ là *nhiều ngàn* (không có số cụ thể), dịch *nhiều ngàn người*. Các danh sách đã đếm khớp: 8 động từ ra lệnh ở `6.2`/`21.3`, 8 động từ ở `6.4`/`21.4`, 11 mục ở `14.2`, 8 hạng người ở `14.1`, 15 loại `attha` ở `20.1` (Việt 15 mục *lợi ích* + 1 ở mở đầu = 16 lần *lợi ích*), 21 mục ở `13.1`–`13.22` (`cakkhu`… `gilānapaccayabhesajjaparikkhāra`), 8 từ ở `25.3`, 8 từ ở `26.6`, 6 động từ giảm ở `13.1`/`13.22`, 6 từ ở chuỗi `ruppanti…domanassitā`. Không có số lớn, không có `sata`/`navuti`, không có cụm `tiṁsakappasahassa`; chỉ dùng cấu tạo từ tự tính tay, không có số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `13.1`, `13.22` `vemāne`: hapax trong phạm vi tầng (0 khoá chứa); dịch *sút kém* theo vị trí trong chuỗi `hīyamāne hāyamāne parihāyamāne vemāne vigacchamāne antaradhāyamāne` (suy giảm → hao mòn → tổn giảm → ?). Không có chứng cứ độc lập cho nghĩa chính xác.
  2. `20.1` `attattho … paramattho vā attho`: `attha` đa nghĩa; cả danh sách dịch *lợi ích* cho nhất quán, nhưng ở cặp `neyyo`/`nīto` thì `an2.24`, `an2.25` dùng *nghĩa* (*cần hiểu lại / đã rõ nghĩa*); chọn *lợi ích cần hiểu lại* và *lợi ích đã rõ nghĩa* giữ đúng cặp từ của tầng nhưng chưa chắc là cách đọc đúng của `uttāno/gambhīro/gūḷho/paṭicchanno attho`. Người biên tập có thể đổi cả danh sách sang *điều có ích/ý nghĩa*.
  3. `5.4` `diṭṭhiṁ` → *quan điểm*: ở đây là quan điểm của Đức Thế Tôn (cùng `dhamma`, `paṭipadā`, `magga`), không phải `diṭṭhi` theo nghĩa tà kiến; tầng thường dịch *kiến*. Chọn *quan điểm* để tránh đọc nhầm *tà kiến*.
  4. `14.2` cú pháp: `pamādo vattabbo kāyaduccaritena vā vacīduccaritena vā manoduccaritena vā pañcasu kāmaguṇesu cittassa vosaggo vosaggānuppadānaṁ kusalānaṁ vā dhammānaṁ bhāvanāya …`: đọc là ba cách nói về phóng dật (qua ác hạnh, qua buông thả tâm nơi dục lạc, qua việc tu tập pháp thiện làm không đủ), nhưng ranh giới giữa mục thứ nhất và thứ hai không chắc hoàn toàn. `vosaggānuppadānaṁ` dịch *sự tiếp tục buông thả ấy* (`anuppadāna` là tiếp thêm, tiếp nối); `ps3.10`, `ps3.4` dịch `vosagga` là *buông bỏ* nhưng ở đây `cittassa vosaggo` là tâm buông mình theo dục, nên chọn *buông thả*. `anaṭṭhitakiriyatā` → *làm không kiên định*, `olīnavuttitā` → *sống uể oải*, `nikkhittadhuratā` → *buông bỏ phận sự*: 0 tiền lệ.
  5. `25.3`, `26.5`, `26.6`: các chuỗi `taṇhānuge taṇhānugate taṇhānusaṭe`, `phuṭṭhe parete samohite samannāgate`, `jātiyā anugate jarāya anusaṭe` 0 tiền lệ; `anuga`/`anugata`/`anusaṭa` dịch *đi theo / bám theo / lan khắp*, `samohite` *vây chặt*, `samannāgate` *gắn liền* (theo `cnd14`; riêng `14.5` `iminā pamādena samannāgatā` dịch *mang sự phóng dật này* vì *gắn liền* hay *đầy đủ* đều sai sắc thái khi nói về điều xấu), sắc thái giữa các từ gần nghĩa chỉ phân biệt bằng chữ Việt khác nhau. `maraṇena abbhāhate` → *bị chết đánh gục* theo `snp3.8:8.1` (*bị đánh gục*, 1 khoá).
  6. `26.3` `diṭṭhibyasanena dukkhena santāpajāte ītijāte upaddavajāte upasaggajāte`: *sự suy hoại về kiến* cho `diṭṭhibyasana` (0 tiền lệ), *bị tai ương / bị tai họa / bị hoạn nạn* cho `ītijāta / upaddavajāta / upasaggajāta` (0 tiền lệ; viết song song với `santāpajāte` *bị bức bách*); sắc thái giữa ba từ không phân xử được bằng chứng độc lập.
  7. `16.4`, `28.4` `yathā te`: đọc `te` là *của ông / nơi ông* (hô cách ngầm là Piṅgiya); không chắc đây là đại từ chỉ riêng Piṅgiya hay chỉ người thực hành nói chung. `28.4` Pāli lược ngay sau `yathā te`, nên bản Việt chỉ viết *để nơi ông …*.
  8. `4.1`, `4.4` `asuddhā avisuddhā aparisuddhā avodātā`: bốn từ gần nghĩa áp vào mắt/tai, dịch *không trong sáng, không thanh sạch, không hoàn toàn trong sạch, không sáng tỏ* (0 tiền lệ); `avodāta` có thể là *không trong trắng/không sáng sạch*, chưa phân xử được.
  9. `13.1`…`13.22` dịch `cakkhusmiṁ … hīyamāne` là *khi mắt đang suy giảm …* (định vị tuyệt đối); các khoá `Sotasmiṁ …`, `ghānasmiṁ …` dịch *Khi tai …*, *khi mũi …*. Không theo *nơi* của `an7.96-614` vì đó là định vị nơi chốn của việc quán, không phải mệnh đề tuyệt đối. Hạng mục như `lạc`, `y áo`, `thuốc men và vật dụng cho người bệnh` cũng đọc được với *khi … đang suy giảm*.
  10. `3.1`, `3.5`, `1.2`: `iccāyasmā piṅgiyo` → *Tôn giả Piṅgiya nói*, theo `cnd13:2.3`, `snp5.17:1.2`, `cnd4:1.2`.
  11. Lỗi ngoài lát, báo chứ không sửa: không phát hiện lỗi ở những khoá của `snp5.17`, `cnd6`, `cnd12`, `cnd13` mà bài này dùng lại; chưa đọc đối kháng các khoá còn lại của các bài ấy. Lỗi đảo dòng ở `snp4.10:9.3`–`9.4` đã được `cnd13` báo từ trước, không liên quan đến bài này.

