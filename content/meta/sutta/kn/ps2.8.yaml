notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim (kn/ps/ps2.8_root-pli-ms.json), đủ 74/74 khoá; thứ tự khoá = thứ tự Pāli, không khoá thừa.

  Tầng tham khảo: tầng english-sujato không có ps2.8 (thư mục sutta/kn đã ghim chỉ có cp dhp iti ja kp snp thag thig ud, và manifest chỉ liệt kê tệp Pāli root cho uid này); lớp english-project của dự án chưa có; vietnamese-current (phantuananh) chỉ có Pháp Cú. Coverage English theo công thức của source/layers.yaml: mẫu số 2 khoá Pāli có nội dung (1.2 và 2.67), tử số 0 ⇒ 0/2; với 66 khoá còn lại (ngắn hơn 40 ký tự) cổng không đo được gì. Bản tra cứu toàn văn nguyên bài ở cuối trang (không phân đoạn, alignment: none) chỉ dùng để đối chiếu thuật ngữ, không phải tầng store và không cấp text cho bản này. Vì vậy triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft.

  Cấu trúc bài: khoá 2.2 đến 2.67 là cùng một khuôn "X-ti—lokuttarā" đổi vị ngữ, nên dùng một khuôn Việt duy nhất "Chúng … nên là xuất thế gian". Pāli không có dấu nháy ở các khoá này nên bản Việt cũng không thêm nháy.

  Thuật ngữ và tiền lệ: lokuttara → xuất thế gian (39 khoá Pāli có lokuttara đã dịch trong tầng: dạng xuất thế 19, trong đó xuất thế gian 18; siêu thế 15; chọn xuất thế gian vì khuôn loka-uttara cần chữ thế gian lặp lại để lộ cách giải nghĩa, vd mn117:8.1). nissaraṇa → xuất ly (vd sn35.18:2.1, dn25:10.13). vuṭṭhahati → xuất khỏi (vd mn44:18.2). paṭippassambhati → lắng dịu (7 khoá). sujjhati/visujjhati → thanh tịnh (93). pajahati → từ bỏ (126). iddhipāda → như ý túc (234 so với nền tảng thần thông 10). bojjhaṅga → giác chi, satipaṭṭhāna → niệm xứ, sammappadhāna → chánh cần (59), nibbāna → Niết-bàn. sāmaññaphala → sa-môn quả (ít tiền lệ, 2). Dạng ablative ba cách -ā, -to, -mhā được phân biệt bằng khỏi / từ / ra khỏi để đọc được trong Việt, nhưng đó chỉ là biến thể ngữ pháp tương đương của Pāli, không phải ba nghĩa khác nhau. Cách instrumental (lokena) ở nissaṭa, vippamutta, visaññutta là cách dùng thay ablative trong Pāli, dịch bằng đối với thế gian; ở limpati, saṁlitta, upalitta thì dịch bởi thế gian.

  Số Pāli: cattāro 4, pañca 5, satta 7, aṭṭhaṅgiko 8 (một chi lẻ tám), nên 1.2 gồm bốn niệm xứ, bốn chánh cần, bốn như ý túc, năm căn, năm lực, bảy giác chi, đạo tám chi, bốn Thánh đạo, bốn sa-môn quả. Đã đối chiếu với danh sách trong chính khoá 1.2; không có số lớn.

  Bất định, không thêm vào thân kinh: (1) visinenti và ussinenti (2.63, 2.64) không có tiền lệ trong tầng, nghĩa chưa phân xử được từ Pāli một mình; dịch trung tính tháo gỡ và không siết chặt, một cách đọc khác theo gốc sineha là làm hết quyến luyến thế gian và không nuôi quyến luyến thế gian. (2) vidhūpenti và sandhūpenti (2.65, 2.66): dịch dập tắt và không nhen lên theo nghĩa khói/lửa, có tiền lệ gần là vidhūpita ở sn1.25 (dứt sạch) và vidhūpayaṁ ở ud1.3 (đánh tan). (3) samucchinnattā và paṭippassambhitattā (2.52, 2.54): đọc là ablative của danh từ trừu tượng chỉ lý do (vì ở trạng thái đã …); cách đọc plural nominative khác khả dĩ. (4) apatha, agati, avisaya, asādhāraṇa (2.55 đến 2.58) dịch sát chữ, không thêm cách giải của chú giải. (5) visaññutta dịch tách rời, ít tiền lệ (một khoá sn36.7:8.4 dịch không bị trói buộc). (6) vivaṭṭanti dịch quay đi, 0 tiền lệ riêng cho dạng động từ này. (7) vamanti và paccāvamanti dịch nhả bỏ và không nuốt lại, nghĩa đen nôn ra và nuốt lại; sn45.153 có cặp tương tự.

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (74 = 74), thứ tự giống Pāli; nháy đơn, nháy kép và dấu lược … khớp Pāli từng khoá (0 lệch, không khoá nào có dấu nháy hay dấu lược); NFC đạt; 0 khoá rỗng; 0 cặp Pāli trùng nguyên văn trong chính bài nên phép đối chiếu nội bộ chạy rỗng, không phải đạt; không Pāli lọt sang Việt ngoài tên riêng Paṭisambhidāmagga ở khoá tiêu đề. Đã in và đọc đủ 74 cặp Pāli với Việt.

  Chưa chạy cổng kỹ thuật nên technical_integrity đặt 9,6: còn phải chạy npm run validate, npm test, npm run check, npm run build.

  Lượt cải thiện 2026-10-13: đọc đối kháng lại đủ 74 cặp Pāli với Việt, đo tiền lệ trên toàn tầng, sửa 14/74 khoá; tập khoá, thứ tự khoá, nháy và dấu lược không đổi (0 khoá có nháy hay dấu lược). Các câu về tiền lệ ở phần Thuật ngữ và Bất định phía trên được thay thế bởi những số đo sau.
  (a) Cặp visineti/ussineti và vidhūpeti/sandhūpeti (2.63 đến 2.66) có song song nguyên văn đúng thứ tự trong sn22.79 (12.3, 12.4, 14.1), kèm mnd1:81, mnd16:61, cnd8:106; bản Việt của cả bốn bài đều dịch tháo gỡ / chất chồng / làm tiêu tán / hun đốt, bản Anh sn22.79 dịch unmesh / enmesh / dissipate / get clouded. Trước đó 2.64 là không siết chặt, 2.65 là dập tắt, 2.66 là không nhen lên, và ghi nhầm rằng không có tiền lệ. Đã đổi 2.64 sang không chất chồng, 2.65 sang làm tiêu tán, 2.66 sang không hun đốt; 2.63 giữ tháo gỡ. Bất định (1) và (2) ở trên coi như đã giải quyết bằng song song; cách đọc theo gốc sineha chỉ còn là ghi chú lịch sử. Đổi nghĩa thật sự ở ba khoá, thuộc accuracy fix.
  (b) sāmaññaphala: danh sách bốn quả này có tiền lệ cùng khuôn là bốn quả sa-môn (dn33, dn34, mnd10, cnd22, pe6: 5 nơi) so với sa-môn quả (cnd23: 1 nơi); toàn tầng 96 khoá, quả sa-môn 74 so với sa-môn quả 14. Câu cũ ghi 2 tiền lệ là sai. Đã đổi 1.2 sang bốn quả sa-môn (terminology fix).
  (c) visaññutta (2.30 đến 2.35): tách lìa 10 khoá (dn33, dn34 cùng cách dùng khoá visaṁyuttaṁ với ablative) so với tách rời 3 khoá trên 202 khoá có visaṁyutta/visaññutta; đổi sang tách lìa ở sáu khoá (terminology fix).
  (d) asādhāraṇa (2.58): không chung với 34 trên 49 khoá (vd an4.124:1.6 không chung với phàm phu); đổi không phải thứ chung với thế gian thành không chung với thế gian (clarity fix).
  (e) 2.52 và 2.54: thêm chủ ngữ chúng như mọi khoá khác (Vì chúng ở trạng thái đã …), để câu không thiếu chủ thể trong Việt; không đổi cách đọc ablative của danh từ trừu tượng. 2.67: thêm dấu phẩy trước nên để tách vế đã vượt quá và chế ngự khỏi vế an trụ (clarity fix).
  Đã đo và giữ nguyên: lokuttara là xuất thế gian 46 so với siêu thế 53 trên 107 khoá toàn tầng, nên giữ xuất thế gian vì cả bài là chuỗi giải nghĩa loka và uttara, còn siêu thế sẽ làm mất chữ thế gian lặp lại; ở phẩm ps cả hai cách đều có. Khuôn câu hỏi 2.1 là Xuất thế gian nghĩa là gì—do ý nghĩa nào mà là xuất thế gian giữ theo họ ps (15 so với 3 khuôn khác trong ps), dù ngoài ps khuôn hai chấm có 18 khoá trong mnd và cnd; đó là phần thêm nhỏ nghĩa là gì so với Pāli. samatikkamati là hoàn toàn vượt quá dù toàn tầng dịch vượt qua 388 trên 511, vì tarati đã chiếm vượt qua và bài cần phân biệt ba động từ tarati, atikkamati, samatikkamati. Bộ ba na sajjati, na gayhati, na bajjhati có tiền lệ sn16.3 là không bị dính, không bị nắm giữ, không bị vướng; giữ không dính mắc, không bị nắm giữ, không bị trói buộc (bajjhati bị trói 7, trói buộc 2). samucchindati là đoạn tuyệt 28 so với đoạn trừ 98 và cắt đứt 56 toàn tầng; giữ đoạn tuyệt vì ps1.1 dùng đoạn tuyệt cho samuccheda. vamati và paccāvamati vẫn không có đa số: sn45.153 dịch chảy ra và chảy trở lại, ja69 dịch nuốt lại; giữ nhả bỏ và không nuốt lại.
  Điểm đổi: terminology 8.8 thành 9.2, vì năm nhóm thuật ngữ đã đưa về đa số hoặc song song và một câu tiền lệ sai đã được thay. Các tiêu chí khác giữ nguyên: semantic_fidelity và ambiguity_integrity không nâng vì bất định thật còn lại (vivaṭṭanti dịch quay đi vì chỉ có tiền lệ gần là ps1.1:324.6 và ps1.4:71.26; hai khoá -ttā ở 2.52 và 2.54; ba khoá instrumental dịch đối với; vamanti), triangulation không nâng vì vẫn không có bản Anh hay Việt hiện hành độc lập cho cả bài và sn22.79 chỉ đối chiếu được sáu khoá. final_score 8,95 thành 8,99. Blocker noEnglishEditionUpstream giữ nguyên, đó là sự thật về upstream; 0 cặp Pāli trùng nguyên văn trong chính bài nên phép đối chiếu nội bộ chạy rỗng. technical_integrity vẫn 9,6 vì chưa chạy npm run validate, npm test, npm run check, npm run build.
