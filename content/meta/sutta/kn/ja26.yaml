notes: |-
  9 khoá, phủ đủ, không thừa khoá. Không có blocker.
  
  **`nisamma` dịch thành *suy nghĩ kỹ* ở cả hai vế — đây là điểm trừ chính.** Pāli `nisamma` (tương lai của √sam, quán nghe) = **đã lắng nghe / đã nghe xét**. Bản dịch dùng *suy nghĩ kỹ* ở cả `1.1` (*Lời của bọn trộm cướp cũ đã suy nghĩ kỹ*) và `1.3` (*Lời của những bậc được tôn trọng đã suy nghĩ kỹ*). Sujato đọc cả hai là *hearing the speech of…* — tức **nghe**, không phải **nghĩ**. Vì hai vế tạo thành kép đối xứng, lệch này lặp hai lần nên đáng kể: đã trừ ở `semantic_fidelity` và `vietnamese_clarity`. Không chặn, vì người đọc vẫn hiểu ý và không có gì sai về chủ thể.
  
  **`Kuruṅgavagga` → *Phẩm Nai Bốn Sừng* ✓.** Đây là **tiền lệ chuẩn**: 9 tệp đã có (`ja21`–`ja29`) dùng đúng cụm này, và Sujato cũng dịch *The Four-horned Antelope*. `kuruṅga` là loài nai/antelope bốn sừng, và `Nai Bốn Sừng` giữ đúng cả hai thành phần. Không trừ.
  
  **`gajuttamo` → *bậc tôn quý nhất trong sở voi*.** `gajuttama` = "tối ưu trong loài voi"; `gaja` (voi) được dịch *sở voi* ✓ giữ đúng quan hệ loài. `sabbaguṇesu aṭṭhā` → *đứng vững trong mọi đức tánh* ✓.
  
  **Đối xứng `1.1`/`1.3` được giữ.** `Purāṇacorāna vaco nisamma` (nghe lời bọn trộm cướp) đối với `Susaññatānañhi vaco nisamma` (nghe lời bậc được tôn trọng) — bản dịch giữ đúng cặp *bọn trộm cướp cũ* / *những bậc được tôn trọng*. `corāna` (bọn cướp) và `susaññatā` (đáng tôn trọng) không bị lẫn.
  
  **`pothayamanvacārī` → *cứ lang thang, xa cách chúng*.** `ancavārī` = kẻ cướp đi lang thang; `pothayamana` = quấy rối. Bản dịch dùng *lang thang, xa cách chúng* — hơi lược bỏ *quấy rối* nhưng vẫn giữ nghĩa cốt lõi.
  
  **Ngoặc kép:** `1.1` mở `“`, `1.4` đóng `”ti.` ✓ cân.
  
  **Tầng Anh** có mặt đủ bốn vế và xác nhận `kuruṅgavagga` là *The Four-horned Antelope*.
  
