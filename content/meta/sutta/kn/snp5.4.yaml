notes: |-
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 1.5–1.6, 2.3–2.5, 3.3–3.4 (lệch ranh khoá và xưng hô: 'devatānaṁ' bị chuyển sang dòng 'Yaññamakappayiṁsu', 2.3 thêm 'thưa Puṇṇaka' trong lời Đức Phật — sai xưng hô theo skill §9, vocative 'puṇṇaka' thuộc 2.5 — và 3.3 thêm 'thưa Ngài' không có trong Pāli; lời giải cnd7:13.1–13.5 giải 'devatānaṁ' trong dòng 'Khattiyā brāhmaṇā devatānaṁ', cnd7:30–31 giải 'āsīsamānā' và 'puṇṇaka itthattaṁ' cùng một dòng; theo cnd2:12.5–14.4, như cnd2 notes đã báo); 4.4 'yājayogā' (sai nghĩa từ: 'bị mê đắm trong sự tế lễ' → 'chuyên tâm vào tế lễ'; lời giải cnd7:47.3 'yājayogesu yuttā payuttā āyuttā samāyuttā', DPD 'devoted to sacrifice; engaging in sacrifice', Sujato 'Devoted to sacrifice', khớp 5.1 'những người chuyên tế lễ'; 'mê đắm' trùng nghĩa 'bhavarāgarattā'; đồng bộ cnd7, cnd2:15.4).
