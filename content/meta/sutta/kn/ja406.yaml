notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja406 tại commit đã ghim, `vietnamese-current` tại commit đã ghim vắng với Jātaka.
  Pāli trùng nguyên văn: 3 khoá, dùng lại nguyên văn cả 3 — `:3.4` và `:5.4` theo ja319:2.4 (điều ác nghiệp chẳng làm hoen ố được), `:4.1` theo sn10.2:3.1 (Dù vì bất cứ duyên cớ nào). `:3.3` và `:5.3` cùng một Pāli `Dhammaṁ me bhaṇamānassa` nên dịch giống nhau trong cùng bài.
  Bất định ghi rõ: `Hitvā gāmasahassāni, paripuṇṇāni soḷasa` ở `:1.1`–`:1.2` có thể là hàng ngàn làng mà trọn mười sáu lần, cũng có thể là mười sáu ngàn làng; chọn cách đọc theo văn phong Pāli là hàng ngàn làng, trọn mười sáu lần, và ghi lại ở đây thay vì chọn một cách rồi im lặng.
  Thuật ngữ theo tiền lệ đếm được: `dhamma` → Pháp, `pāpa` → điều ác nghiệp, `ruppana` → của bạc, `susikkhita` → thành thụ, `koṭṭhāgāra` không có tiền lệ nên dịch là kho lưu thông, `susama` hết. Tên phẩm Gandhāravagga → Phẩm Gandhāra, theo đúng tiền lệ 4 tệp đã dùng chữ Gandhāra trong tầng (dn16, mn116).
