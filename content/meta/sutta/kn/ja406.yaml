notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja406 tại commit đã ghim, `vietnamese-current` tại commit đã ghim vắng với Jātaka.
  Pāli trùng nguyên văn: 3 khoá, dùng lại nguyên văn cả 3 — `:3.4` và `:5.4` theo ja319:2.4 (điều ác nghiệp chẳng làm hoen ố được), `:4.1` theo sn10.2:3.1 (Dù vì bất cứ duyên cớ nào). `:3.3` và `:5.3` cùng một Pāli `Dhammaṁ me bhaṇamānassa` nên dịch giống nhau trong cùng bài.
  Bất định ghi rõ: `Hitvā gāmasahassāni, paripuṇṇāni soḷasa` ở `:1.1`–`:1.2` có thể là hàng ngàn làng mà trọn mười sáu lần, cũng có thể là mười sáu ngàn làng; chọn cách đọc theo văn phong Pāli là hàng ngàn làng, trọn mười sáu lần, và ghi lại ở đây thay vì chọn một cách rồi im lặng.
  Thuật ngữ theo tiền lệ đếm được: `dhamma` → Pháp, `pāpa` → điều ác nghiệp, `ruppana` → của bạc, `susikkhita` → thành thụ, `koṭṭhāgāra` không có tiền lệ nên dịch là kho lưu thông, `susama` hết. Tên phẩm Gandhāravagga → Phẩm Gandhāra, theo đúng tiền lệ 4 tệp đã dùng chữ Gandhāra trong tầng (dn16, mn116).
  Cổng kỹ thuật chưa chạy vì agent dịch không được chạy lệnh npm. Coordinator chạy bốn lệnh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code), kiểm lại từng khoá bằng Pāli đã ghim, PED và bài cùng công thức `ja515`): sửa 24 khoá, trong đó hầu hết kệ bị dịch sai. Lỗi nghĩa thật: `:1.1–1.4` là bỏ mười sáu ngàn làng và kho lúa đầy rồi nay tích trữ (`sannidhi`), không phải mua bán; `:2.x` là bỏ xứ Gandhāra giàu của cải, đã rời việc cai trị mà nay lại cai trị (`pasāsanato nikkhanto` / `pasāsasi`); `vedeha` ở `:3.1` là hô ngữ Vedeha, không phải lệnh nghe; `ruppanaṁ` ở `:4.2` và `ruppatu` ở `:5.1` là bị tổn thương (PED: ruppati = to be vexed, hurt), không phải của bạc; `bhusaṁva` ở `:5.2` là như trấu; `:6.1–6.4` là nếu không có trí tuệ riêng hay kỷ luật học kỹ thì nhiều người lang thang như trâu mù trong rừng; `ācera` ở `:7.2` là bậc thầy (PED: ācera = contracted ācariya, J iv.248), `susamāhitā` ở `:7.4` là tâm định tĩnh tốt. Bất định: `:3.4` và `:5.4` giữ `pāpa` là điều ác như bản cũ; ai nói kệ nào chỉ suy từ nội dung (không có nhãn trong Pāli). Điểm: semantic_fidelity và grammar_logic hạ về mức bản đã sửa vì bản cũ sai ở khoảng bốn phần năm số khoá.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
