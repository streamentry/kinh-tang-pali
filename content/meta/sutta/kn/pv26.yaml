notes: |-
  **Phạm vi.** Đủ 92/92 khoá của pv26, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli, không khoá rỗng. Pāli của bài không có dấu lược nào (0/92 khoá có …pe… hay …), nên bản Việt cũng không có dấu lược.

  **Coverage English.** Mẫu số = 0: tổng 89 khoá không phải khối tham chiếu, khoá Pāli dài nhất chỉ 31 ký tự, không khoá nào đạt 40 ký tự, nên cổng coverage của `source/layers.yaml` không đo được gì (không phải 0% không đạt ngưỡng). Ba tầng tham khảo (`english-sujato`, `english-project`, `vietnamese-current`) đều vắng cho bài này; vì vậy `triangulation` chỉ 7.5 và không được hiểu là đã đối chiếu English. Khoảng mất mát này người điều phối cần ghi vào `content/meta/reference-gaps.yaml` bằng `npm run reference:gaps` (ngoài phạm vi lát).

  **Tiêu đề.** `0.1` Petavatthu và `0.2` Cūḷavagga giữ nguyên Pāli (đúng quy ước bộ: pv26–pv35 đều giữ). `0.3` theo khuôn *N. Chuyện Ngạ Quỷ X* đã có trong bộ; tầng tên `name/` đã ghim đặt tên bản Anh của bài là *Without Rippling* (`pv-name:29.pv26`), nên tên Việt là *Nước Không Gợn*. Câu kệ đầu `abhijjamāne vārimhi` tôi dịch sát chữ là *khi nước không bị rẽ ra* (abhijjamāna là hiện tại phân từ bị động phủ định của bhijjati, vỡ, rẽ ra); hai cách nói ấy cùng chỉ việc ngạ quỷ đi trên mặt nước mà nước không xao động, nhưng chúng không trùng chữ, ghi lại để người biên tập thống nhất nếu muốn. `:22.1` theo khuôn đóng bài *<tiêu đề>, thứ N.* (pv30:12.1, pv34:9.1).

  **Tiền lệ trùng nguyên văn đã dùng lại.** Đã dò Pāli của 92 khoá với toàn bộ tầng Việt của `kn`: 19 khoá trùng Pāli ở bài khác. Hai khoá tiêu đề `0.1`, `0.2` là tiêu đề dùng lại. 12 khoá `19.1`–`21.4` trùng nguyên văn `vv18:14.1`–`vv18:16.4` và được dùng lại đúng nguyên văn (12/12 giống). `9.3` ← `pv45:4.3`, `pv19:12.3`, `pv31:4.3` (*khi sẵn có những vật đáng bố thí*, 3/3). `8.2` và `7.4` dùng đúng bản `pv45:8.2`, `pv45:9.2` (*nằm dài trên mặt đất*, 2/2). Trong 19 khoá trùng có 3 khoá mà bản Việt khác tiền lệ, đều có lý do nêu dưới đây: `7.3` (`Chātā pamucchitā bhantā`), `9.4` (`dīpaṁ nākamha attano`) và `17.2` (`pallaṅke gonakatthate`). Ngoài ra `8.4` gần `pv7:4.4` nhưng Pāli không trùng byte nên không tính là cặp trùng.

  **Trùng nguyên văn trong chính bài.** 2 nhóm: `1.4` và `5.2` (`māladhārī alaṅkato`) giống nhau; `7.4` và `8.2` (`bhūmiyaṁ paṭisumbhitā`) giống nhau, chỉ khác dấu kết đúng như Pāli (chấm và chấm phẩy). 0 cặp trùng mà bản Việt khác.

  **Chỗ cố ý lệch tiền lệ (cần người biên tập xem).**
  - `7.3` `Chātā pamucchitā bhantā`: trùng nguyên văn `pv45:8.1`, nơi bản Việt là *Kiệt sức, bạch ngài, đã gục xuống*. Tôi cho rằng bản kia đọc nhầm `bhantā` (chủ cách số nhiều, bhanta là choáng váng, loạng choạng) thành `bhante` (hô cách *bạch ngài*): trong pv26 không có ai được xưng hô là ngài, và các động từ chung quanh đều ở chủ cách số nhiều. Tôi dịch *đói lả, ngất đi, choáng váng*; không sửa pv45 vì ngoài lát.
  - `9.4` `dīpaṁ nākamha attano`: tầng đang chia đôi (với đúng dạng này: hòn đảo 1 khoá `pv45:4.4`, ngọn đèn 3 khoá `pv45:10.4`, `pv50:3.4`, `ja314:1.4`; với dạng ngôi một số ít `nākāsimattano`: *hòn đảo* 2/2 ở `pv19:12.4`, `pv31:4.4`). Tôi chọn *hòn đảo* vì `dīpa` ở nghĩa chỗ nương tựa cho chính mình được tầng dịch là *hòn đảo* nhất quán ở `sn47.14` (attadīpā, 30 lần trở lên) và ở hai khoá Pāli gần nhất của chính bộ.
  - `8.4` `aggidaḍḍhāva ātape`: `pv7:4.4` dịch *trong hơi nóng*; tôi dịch *dưới nắng* vì `ātapa` ở `pv45:5.4` là *nắng*. Pāli hai khoá không trùng byte (khoá kia kết bằng ”ti).
  - `17.2` `pallaṅke gonakatthate` trùng nguyên văn `pv33:1.2`, nơi bản Việt là *trên nệm trải da bò*. Tôi dịch *trên giường trải len lông dài* theo `tha-ap45:5.2` (*trải thảm len lông dài*) và các bài `dn17`, `an7.64` (*tấm phủ bằng len có lông dài*): gonaka là tấm phủ bằng len dài lông, không phải da. Không sửa pv33 vì ngoài lát.
  - `18.3` `Dhātiyo upatiṭṭhanti`: `tha-ap122:6.1` dịch *Các yếu tố ở bên ta*. Trong pv26, `aṅkato aṅkaṁ gacchanti` (từ lòng này sang lòng khác) cho thấy `dhātiyo` là các vú nuôi; tiền lệ `dn14:1.34.1` dịch *vú nuôi*. Dùng *vú nuôi*. Nên xem lại `tha-ap122`, `tha-ap132` (ngoài lát).

  **Chỗ không chắc, ghi thay vì bịa nghĩa.**
  - `6.1` `sātunnavasanā`: hapax, 0 tiền lệ trong tầng và không tra được nơi nào khác trong Pāli đã ghim. Có thể tách thành sā + tunna (tunna là được khâu, chắp; `tunnavāya` là thợ may) nên tôi dịch *mặc y phục chắp vá*; đây là phỏng đoán có căn cứ hình thái, không phải tiền lệ. Ở đối lập với `kesanivāsanā` (lấy tóc làm y phục) cách hiểu ấy hợp mạch nhưng chưa được chứng thực.
  - `1.3` `pubbaddhapetova`: tôi hiểu pubba-addha (nửa thân trước; cf. `sīhapubbaddhakāya` ở `dn14`, `dn30`, `mn91`, *thân trước như sư tử*) + peta, dịch sát chữ *như ngạ quỷ nửa thân trước*. Cũng có thể là *như một ngạ quỷ ngày trước/nửa kia*; ghi bất định. Cũng lưu ý `1.3` nói trần truồng mà `1.4` lại nói đeo tràng hoa, được trang sức; tôi giữ nguyên hai ý trái nhau như Pāli, không hòa giải.
  - `3.4` `pītakañca yugaṁ`: pītaka là màu vàng, yuga là một cặp; Pāli không nói cặp gì, `5.1` `suvatthavasano` cho thấy là vải/y phục. Dịch *một cặp vải vàng*, không thêm nhiều hơn.
  - `4.2` `kappakassa adāpayi`: tân ngữ của adāpayi vắng trong Pāli (hiểu là bột, cơm và cặp vải ở `3.3`–`3.4`); bản Việt cũng để vắng. `4.4` `ṭhāne petassa dissatha` chủ ngữ của dissatha không có; dịch *điều ấy hiện ra* (kết quả của việc cho). `ṭhāne` hiểu là *ngay tại chỗ*, khớp `5.3` và `pv5:11.4` `ṭhānaso upakappati` (*trợ giúp ngay tại chỗ*).
  - `10.3` `sammaggate pabbajite`: dịch *vị xuất gia đã đi đúng đường* theo `iti89:8.3` (`sammaggataṁ`, *bậc đã đi đúng đường*). Cách đọc khác (sam + āgata, đến chỉnh tề) có thể có.
  - `11.3`–`11.4` `ālopapiṇḍadātāro paṭiggahe paribhāsimhase`: không rõ ai nhận và ai bị mắng (người cho, hay vị nhận khi nhận). Bản Việt *những người cho từng nắm cơm, khi họ nhận, chúng tôi đã mắng nhiếc* giữ nguyên mức mơ hồ ấy (`ālopa` là *nắm cơm* theo `mil7.5.6`).
  - `12.3` `te aññe paricārenti`: tân ngữ là các thứ ở `12.1`–`12.2`, hiểu như vậy; *hưởng dụng* cho paricārenti.
  - `13.1`–`13.4`: `veṇī` là nữ thuộc hạng thợ đan tre (venakula = *thợ đan tre* ở `sn3.21`, `mn96`, `an4.85`, nữ hóa), `rathakārī` là nữ thợ làm xe (*thợ làm xe* cùng nguồn), `caṇḍālī` giữ Caṇḍāla; `dubbhikā` không có tiền lệ, dịch *đói khổ* theo dubbhikkha (nạn đói); `avaññā` dịch *bị khinh rẻ*; `kappakā` (dạng giống đực) dịch *thợ cạo* (`thag2.25:1.2`), không tự thêm *nữ*.
  - `18.4` `sāyaṁ pātaṁ sukhesino`: `sukhesino` là giống đực số nhiều nên có thể chỉ những người được nuôi, không nhất thiết các vú nuôi; bản Việt *sớm chiều mong cầu an lạc* để mơ hồ về chủ thể, không thêm đối tượng.

  **Số Pāli.** Không có số lượng nào trong thân bài (0 khoá có từ chỉ số). Số thứ tự duy nhất là `0.3` (*1.*) và `22.1` (*thứ nhất*, paṭhamaṁ).

  **Dấu nháy.** Mở ở `1.1`, `2.1`, `9.1`; đóng ở `1.6`, `2.4`, `21.4`, đúng như Pāli từng khoá (92/92 khoá có cùng số nháy kép và đơn như Pāli). Khối `9.1`–`21.4` là một lời thoại liên tục của các ngạ quỷ.

  **Lỗi bản nháp đã bắt.** Bản nháp đầu viết `5.5` bằng thức mệnh lệnh *hãy bố thí* trong khi `dajjetha` là thức mong muốn/khuyến nghị; đã đổi thành *nên bố thí*. `2.2` nằm trong dấu nháy của `2.1`–`2.4` đúng theo Pāli (câu *ngạ quỷ ấy nói như vậy* đứng giữa lời trích); đã giữ.

  **Technical gate.** Bị cấm chạy cổng ở lát này nên không tuyên bố technical gate pass; `technical_integrity` đặt 9.6. Còn phải chạy `npm run validate`, `npm test`, `npm run check` và `npm run build`. Trạng thái `draft` là do blocker `noEnglishEditionUpstream`, không phải do điểm: điểm trung bình 8.97 một mình sẽ ở mức `review`.
