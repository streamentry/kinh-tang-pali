  CẤU TRÚC BÀI. Vua hỏi có thể chỉ ra hình tướng của Niết-bàn hay không. Nāgasena đáp hai bước: (1) hai thí dụ biển cả và chư thiên vô sắc, để nói rằng một pháp có thật vẫn có thể không chỉ ra được hình tướng; (2) mười thí dụ khoanh những đức tính mà Niết-bàn có chung với hoa sen 1, nước 2, thuốc giải 3, biển cả 4, thức ăn 5, hư không 10, ngọc báu 3, chiên-đàn đỏ 3, tinh chất bơ 3, đỉnh núi 5; sau cùng là lời kết của vua. Mười thí dụ ở mục 7 đến 16 dùng một khuôn Pāli (Yathā, evameva kho, Ayaṁ ... paṭhamo guṇo, Ime kho ... guṇā); tôi dịch cùng khuôn một cách nhất quán, chỉ đổi đúng chỗ Pāli đổi.

  SỐ PĀLI, ĐÃ TỰ TÍNH. Đã dò 69 số đếm và số thứ tự trong Pāli (eko 1, dve 2, tayo 3, cattāro 4, pañca 5, dasa 10; paṭhamo thứ nhất đến pañcamo thứ năm; dasamo thứ mười), 0 lệch. Khớp từng thí dụ: hoa sen 1 (7.4); nước 2 (8.4, 8.7); thuốc giải 3 (9.4, 9.7, 9.10); biển cả 4 (10.4, 10.7, 10.10, 10.13); thức ăn 5 (11.4, 11.7, 11.10, 11.13, 11.16); ngọc báu 3; chiên-đàn đỏ 3; tinh chất bơ 3; đỉnh núi 5 (16.4, 16.7, 16.10, 16.13, 16.16). Tổng ở 6.1: 1+2+3+4+5+10+3+3+3+5 = 39. Một chỗ Pāli tự không khớp: 12.1 và 12.4 nói ākāsassa dasa guṇā (mười), nhưng chuỗi ở 12.2 và 12.3 có 11 mục (na jāyati, na jīyati, na mīyati, na cavati, na uppajjati, duppasaho, acorāharaṇo, anissito, vihagagamano, nirāvaraṇo, ananto). Tôi dịch đủ 11 mục đúng như Pāli và giữ chữ mười ở 12.1, 12.4; không tự gộp hay bỏ mục nào cho khớp số.

  NHÁY. Đã đếm từng khoá so với Pāli: nháy kép mở 41 và đóng 41, nháy đơn mở 16 và đóng 16 ở cả Pāli lẫn Việt, 0 lệch trên 141 khoá. Ba chỗ cần ghi: (a) lời Nāgasena mở nháy kép ở 3.1 và đóng ở 4.2, nên 3.2 và 4.1 không có nháy; (b) 1.8 mở một nháy đơn bên trong mà chỉ đóng ở 1.9, và ở 1.9 nháy đơn đóng đứng sau cả vế thưa tôn giả, tôi sẽ trả lời người ấy như vậy, đúng như Pāli (dadeyyan rồi ’ rồi ”); (c) Pāli 4.2 kết bằng dấu chấm nhưng nội dung là câu hỏi (vua trả lời ngay ở 4.3), nên tôi dịch là câu hỏi có dấu hỏi.

  DẤU LƯỢC. Pāli của bài không có … (đo: 0 khoá) và không có (…) trần; bản Việt cũng 0.

  DÙNG LẠI NGUYÊN VĂN VÀ TIỀN LỆ. Có 5 khoá của bài mà Pāli trùng nguyên văn với nơi khác trong tầng Việt: 0.1 (245 khoá trùng), 0.2 (31), 0.3 (11), 4.5 (89), 16.18 (42). Bốn khoá dùng đúng bản phổ biến nhất (0.1, 0.2, 0.3, và 4.5 là Không phải vậy, thưa tôn giả với 64/89). Một khoá khác chỉ ở dấu câu: 16.18, tầng viết nhận”. 10 lần và nhận.” 8 lần (hầu như hòa); ở phạm vi gần nhất mil6 là nhận.” 4 so với nhận”. 1, và mil6.3 là nhận.” 3 (kể cả bài liền kề mil6.3.9:4.11), nên tôi chọn nhận.” và ghi cả hai số. Số cặp Pāli trùng nguyên văn ngay trong chính bài: 0.

  THUẬT NGỮ, CÓ SỐ ĐẾM. mahārāja khi Nāgasena nói: ở mil6, này Đại vương 265, thưa Đại vương 60, tâu 103, nên dùng này Đại vương như mil6.3.9. Bhante nāgasena khi vua nói (207 khoá có Pāli này trong mil): thưa tôn giả Nāgasena 97, bạch ngài Nāgasena 50, thưa ngài Nāgasena 16, nên dùng thưa tôn giả Nāgasena; riêng lời kết 16.18 dùng nguyên văn tiền lệ (thưa ngài Nāgasena, trẫm) vì Pāli trùng, còn các câu trước vua tự xưng tôi như mil6.3.9. pariḷāha dịch nhiệt não (mil5.1.1:9.11 dịch cặp nibbāpenti pariḷāhaṁ là làm lắng dịu nhiệt não; trong tầng nhiệt não 16 so với nóng bức 2). guṇa dịch đức tính (8 khoá, gồm mil4.6:1.5 mười đức tính của vị cư sĩ) thay vì công đức (26 khoá, thường là nghĩa phúc thiện) vì ở đây guṇa là đặc điểm của vật lấy làm thí dụ. sappimaṇḍa dịch tinh chất bơ (an10.91:22.3). lohitacandana dịch chiên-đàn đỏ (chiên-đàn đỏ 4, đàn hương đỏ 4, chiên đàn đỏ 2; hòa nên chọn dạng có gạch nối). maṇiratana dịch ngọc báu (ngọc 53 trong 55 khoá). agada dịch thuốc giải (8 trong 11 khoá). vibhavataṇhā dịch phi hữu ái (10 trong 14 khoá có chuỗi ba ái). na jāyati ... na cavati dịch không sinh, không già, không chết, không rơi xuống, theo an4.45. Puna caparaṁ, mahārāja dịch Lại nữa, này Đại vương (mil7: 105 so với Tiếp nữa 8). opamma dịch thí dụ (34 trong 48 khoá), kāraṇa dịch lý do (196 trong 298), amata dịch bất tử (185 trong 209), sacchikata dịch chứng ngộ (580 khoá). iddhimā cetovasippatto dịch có thần thông, đạt được sự chế ngự tâm (toàn tầng 21 khoá: chế ngự tâm 9, làm chủ tâm 6; ví dụ an4.191:2.6). ghammābhitatta kilanta tasita pipāsita lấy theo mn12:37.5 (mệt mỏi, khát, khô cổ, nóng bức). anunayappaṭighavippamutta dịch thoát khỏi tham luyến và sân hận (mil5.3.12:2.4, 2.5, cùng công thức). Tiền lệ mỏng: acorāharaṇa và nirāvaraṇa chỉ mỗi chữ 1 khoá (kp8:9.2, mil5.5.2:7.2); vihagagamana, anorapāra và chuỗi saṇṭhānaṁ vā ... vayaṁ vā có 0 tiền lệ trong tầng.

  BẤT ĐỊNH, GHI Ở ĐÂY CHỨ KHÔNG THÊM VÀO THÂN KINH. (1) vayaṁ trong chuỗi rūpaṁ, saṇṭhānaṁ, vayaṁ, pamāṇaṁ dịch tuổi. Ở tầng, vaya thường là sự diệt (an3.47), chỉ 12 trong 122 khoá dùng tuổi; nhưng trong chuỗi bốn thuộc tính hình tướng, hình dạng, ?, kích thước, nghĩa tuổi hợp hơn nghĩa suy diệt. Chưa phân xử được tuyệt đối, vì không có bản Anh hay bản Việt đối chiếu. (2) avibhatto lokakkhāyikehi ở 1.9 dịch chưa được các nhà thế luận phân định; ở tầng lokakkhāyikaṁ là chuyện thế gian (dn1:1.17.2, an10.69:1.3), nên tôi giữ nghĩa nhà thế luận, không đổi thành nhà thiên văn hay nhà địa lý. (3) appaṭibhāgaṁ ở 1.2 dịch không có gì sánh được; phép so sánh về đức tính ở các mục sau không mâu thuẫn, vì ở 5.3 Nāgasena nói về chính hình tướng thì không có, về đức tính thì có thể chỉ ra. (4) avisayo ở 2.2 dịch không thuộc phạm vi; tôi không thêm là phạm vi của ai. (5) atthidhamma dịch pháp có thật (mil6.2.5:10.1 dịch atthidhammaṁ là điều có thật). (6) anupaviṭṭha dịch có mặt trong, nghĩa là Niết-bàn cũng có chung đức tính ấy; tôi tránh đã đi vào vì dễ làm đảo chiều quan hệ. (7) guṇavaṇṇa ở 11.9 và 15.3 dịch vẻ đẹp của đức hạnh; vaṇṇa còn có thể là lời khen. (8) mahābhūta ở 10.9 dịch đại sinh linh, tránh đại chủng vì ở đây đi với arahantānaṁ và song song với mahantānaṁ bhūtānaṁ của biển cả. (9) 12.3 ariyagamanaṁ khác chữ với vihagagamano ở 12.2 (nơi loài chim đi qua so với nơi các bậc Thánh đi tới); tôi dịch đúng hai chữ khác nhau, không cân bằng cho giống. (10) kāmadada dịch ban cho điều mong muốn và ujjotattakara dịch tạo nên ánh sáng; cả hai 0 tiền lệ trong tầng. (11) ṭhapanīyo pañho dịch câu hỏi nên gác sang một bên (an4.42:1.6 dịch cùng chữ là đặt qua một bên). (12) sajjana ở 14.8 và 14.9 dịch người thiện lành; tôi không thêm ý khác.

  LỖI BẢN NHÁP ĐÃ BẮT KHI ĐỌC ĐỐI KHÁNG. (a) 4.2: bản nháp đầu dịch theo dấu chấm của Pāli thành câu trần thuật; đọc lại thấy vua đáp ngay ở 4.3 nên là câu hỏi, đã sửa. (b) 7.1: bản nháp đầu làm mất eko ở vế katamo padumassa eko guṇo; đã sửa thành một đức tính ấy ... là đức tính nào. (c) 1.9: phép đo nháy cho thấy nháy đơn đóng nên đứng ở cuối khoá, sau vế tôi sẽ trả lời; đã đặt đúng chỗ.

