notes: |-
  Dịch trực tiếp từ Pāli root tại commit bilara đã ghim, đủ 94 khoá, đúng thứ tự khoá Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh của Sujato, không có lớp english-project, tầng Việt hiện hành chỉ có Pháp Cú, nên chỉ có một tầng tham chiếu là Pāli; triangulation vì thế bị chặn.
  Đã tra tiền lệ trong tầng mil và các bài kn khác. `hīnāyāvattati` → quay về / trở lại đời sống thấp kém, theo mn67, mn63, ud3.2, snp3.6 (đa số "quay về đời sống thấp kém"; sn52.8 và sn35.244 dùng "hoàn tục trở về đời sống thấp kém", an6.60 dùng "lối sống hạ liệt"); chọn dạng thứ nhất vì trùng cả tên bài. `jinasāsana` → giáo pháp của Đấng Chiến Thắng (mil4.6, mil5.1.4, mil5.1.7, mil5.3.12). `sallakatta` → thầy thuốc giải phẫu (mil5.1.3, mil5.2.3, mil5.3.3, mil5.5.10). `maṇiratana kāmada` → ngọc ma-ni ban mọi điều ước, ngọc như ý ở mil6.1.3 và mil5.4.5. `sacetanā` → có ý thức (mil6.2.6). `mahāsamuddo na matena kuṇapena saṁvasati` → biển lớn không chung sống với xác chết, song song với mil5.3.12 (cùng cấu trúc nhưng Pāli không trùng nguyên văn).
  Văn xưng theo mil đã merge: Bạch ngài Nāgasena (113 lần ở 57 tệp, so với Thưa Đại đức Nāgasena 44 lần và Thưa ngài Nāgasena 34 lần), tâu đại vương viết thường giữa câu (330 so với 81) và Tâu đại vương ở đầu câu (238 so với 65); Như Lai cho tathāgata (297 lần ở 33 tệp). Dòng 0.2: đa số tầng dịch Câu hỏi về suy luận (20) so với giữ nguyên Anumānapañha (5); các bài liền kề 6.1.3, 6.1.4, 6.1.6, 6.1.8 giữ Pāli còn 6.1.1, 6.1.2, 6.1.7, 6.1.9 dịch, nên chọn theo đa số toàn tầng và ghi để người điều phối thống nhất. Dòng 0.3: Phẩm Đức Phật (10 lần) so với Phẩm Buddha (1) và giữ Buddhavagga (1). Tiêu đề 0.4 và lời kết 19.1 đặt mới theo dạng Câu Hỏi Về ... như các bài mil liền kề.
  0 tiền lệ, đặt mới có lý do: `bhūmimahantabhāva` / `jinasāsanabhūmi` → tính to lớn của nền tảng / nền tảng của giáo pháp (bhūmi có thể là cấp bậc hay địa vị; chọn nền tảng vì văn cảnh nói giáo pháp quá to lớn để người thiếu căn cơ giữ nổi, đã song song với quyền thống trị ở 9.2); `mahābhūtabhavana` → nơi cư ngụ của những sinh vật vĩ đại / những bậc vĩ đại, các A-la-hán (mahābhūta ở đây không phải bốn đại mà là bậc vĩ đại, theo văn cảnh biển lớn); `sabhāvaisibhattiko` → một lòng kính ngưỡng các bậc ẩn sĩ cách chân thật; `atakkiko` → không chỉ dựa vào suy đoán; `amoghadhuvasiddhakamma` → phép chữa không hư dối và luôn thành tựu; `anekathālipākasataṁ bhojanaṁ` → thức ăn nấu bằng nhiều trăm nồi; `anekasatena kammena` → tốn nhiều trăm công lao; `nibbaṇṇākārasīlā` → dáng vẻ và giới hạnh nhạt nhòa, không màu sắc; `papaṭikā` → bong tróc (chỗ thô ráp, bong vảy của ngọc); `kāyagatāsatibhojana` → món ăn là niệm thân; `vassikā` → hoa lài mùa mưa (hai tiền lệ ở dhp377 và một bài khác trong kho, bên cạnh hoa nhài); `eḷamūga` → câm ngọng; `catusaccappaṭivedha` → thấu triệt bốn Thánh đế (bốn Thánh đế 59 lần, bốn chân lý 11, bốn sự thật 8 ở toàn kho).
  Bất định đã phân xử và ghi lại: (a) `tāvatakaṁ` ở 1.1 nghĩa sát là chừng ấy / như thế; dịch "ngay như vậy" theo văn cảnh (cho xuất gia vội vàng khi chưa đạt quả vị nào), chưa có bản Anh độc lập để đối chiếu. (b) `bodhessasi` ở 4.4 là ngôi thứ hai trong khi các khoá song song 2.4 và 3.4 là `bodhessati` ngôi thứ ba; có thể là lỗi chép của tầng Pāli ghim; bản dịch dịch như ngôi thứ ba cho nhất quán với cấu trúc và nêu lại ở đây. (c) `kilesachātajjhattā` ở 4.3 hiểu là bị cơn đói phiền não thiêu đốt bên trong, tách `ajjhatta` thành bên trong; cách hiểu khác là đói phiền não ở nội tâm, cùng nghĩa. (d) `sacetanā budhā` hiểu là hai danh từ đồng vị: chúng sinh có ý thức, người trí. (e) `taṇhāsitova` ở 4.4 hiểu là còn khát ái (song song với chātova, sakilesova). (f) `kakkasā ... papaṭikā` ở 16.3 là so sánh với chỗ thô ráp của viên ngọc, không thêm chi tiết nào ngoài Pāli.
  Số trong bài: không có số thành lượng cần tính; các số đếm là năm (đức tính vô song, 8.1) và "nhiều trăm" (5.2, 7.1), đã dịch đúng theo Pāli.
  Pāli trùng nguyên văn trong chính bài: `6.4` và `7.4` (một cặp) dịch giống hệt; `Kiṅkāraṇaṁ?` mười khoá (9.3, 9.6, 10.3, 10.6, 11.3, 11.6, 12.3, 12.6, 13.3, 13.6) dịch cùng một câu. 0 cặp trùng trong bài mà bản Việt khác. Đã dò Pāli trùng nguyên văn từ 25 ký tự trở lên với các bài mil khác đã có bản Việt: 0 cặp, nên không có khoá nào dùng lại nguyên văn từ bài khác. Dấu lược: Pāli không có `…` nên bản Việt cũng không có; dấu nháy đơn và kép khớp Pāli từng khoá (0 lệch trên 94 khoá); NFC; không có Pāli lọt sang tiếng Việt ngoài tên riêng Nāgasena và tên giống lúa sāli, karumbhaka.
  technical_integrity 9.6 vì lát này không chạy cổng. Bốn lệnh cổng do người điều phối chạy trước khi publish: npm run validate, npm test, npm run check, npm run build.
