  - Ratanānaṭṭhapaññāsaṁ (5.1) = năm mươi tám ratana (aṭṭha 8 + paññāsa 50 = 58; ratana
    giữ nguyên như tha-ap536:5.1).
  - bāttiṁsavaralakkhaṇo (5.4) = ba mươi hai tướng tốt tuyệt hảo (22 khoá chứa gốc bāttiṁsa
    đều dịch ba mươi hai).
  - Vassasatasahassāni (6.1) = một trăm ngàn năm (sata 100 × sahassa 1000 = 100.000).
  - pañcasīle (3.4) = năm giới.
  - tāvatiṁsa (15.4) = cõi trời Ba mươi ba (ti 3 + tiṁsa 30 = 33; tiṁsa là 30, không phải 3).
  - paṭisambhidā catasso (54.1) = bốn vô ngại giải; nekakappesu (19.4) = nhiều kiếp.
  - Không có Tiṁsakappasahassa hay cụm số nào chưa phân xử được trong bài; phép kiểm số vì
    vậy chỉ đối chiếu các số trên, không có cụm nào chạm vùng chưa phân xử.

