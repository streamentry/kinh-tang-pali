  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - 12.1 Satasahassito kappe: ablative cùng bhavissati (12.4) và hessati (13.4) là thì
    tương lai, nên dịch Sau một trăm ngàn kiếp nữa. Đo ở các khoá cùng Pāli mà vế sau có
    bhavissati hoặc hessati trong 3 khoá kế tiếp: 20 khoá, trong đó 15 khoá Sau một trăm ngàn
    kiếp nữa (10 ở tha-ap, 5 ở thi-ap), 4 khoá Vào một trăm ngàn kiếp nữa, 1 khoá Vào một
    trăm ngàn đại kiếp trước (sai chiều thời gian; đã báo). Ở các khoá cùng Pāli không có
    vế tương lai (quá khứ), dạng đa số là Vào một trăm ngàn đại kiếp trước (32 khoá: 29 ở tha-ap, 3 ở thi-ap).
    Chữ đại không có trong Pāli (kappa, không phải mahākappa), không dùng.
  - 5.2 uggatova: va có thể là iva (như) hoặc eva (nhấn); bản Việt dịch bậc Đại Mâu-ni vươn
    cao, không thêm so sánh.
  - 20.3–20.4 Rañño suddhodanassāhaṁ dhītā āsiṁ aninditā: bản Việt giữ đúng Pāli (con gái
    của vua Suddhodana). Pāli không nêu mẹ.
  - 21.1 Siriyā rūpiniṁ disvā: siriyā là công cụ cách của siri (vẻ rạng ngời, phúc lộc), rūpiniṁ là
    đối cách nữ (có hình sắc); bản Việt thêm ta làm tân ngữ ngầm (Thấy ta có hình sắc với vẻ
    rạng ngời). Cách đọc khác: siriyā rūpiniṁ là hiện thân của Sirī; bản Việt chọn nghĩa ít giả
    định hơn. 21.4 sundaraṁ pavaraṁ ahu: chủ ngữ là nāmaṁ (21.3), dịch đã trở nên đẹp đẽ và
    cao quý.
  - 22.2 kalyāṇīti: kalyāṇī là danh hiệu (người nữ đẹp), iti không có dấu ngoặc ở Pāli;
    dịch nổi tiếng với tên gọi là Kalyāṇī, không thêm dấu ngoặc để khớp Pāli. 22.4 taṁ yasodharaṁ:
    đối cách của Yasodharā sau ṭhapetvā, dịch ngoại trừ Yasodharā ấy.
  - 23.2 pacchimo arahā tathā: pacchimo là người sau cùng; Pāli không nêu tên ai, ngữ cảnh
    (anh cả là Đức Phật, rồi đến Nanda ở 24.3) cho thấy người em út cũng là A-la-hán, nhưng
    bản Việt chỉ nói người sau cùng, không nêu tên. 23.4 paricoditā: dịch bị mẹ thúc giục
    (paricodita có thể là thúc giục hoặc quở trách).
  - 24.2 putte buddhānujā tuvaṁ: putte là hô cách (này con), buddhānujā là em gái của Đức Phật.
    24.3 Nandenapi vinā bhūtā: Nanda (nam, em của Đức Phật) khác với Nandā (nữ); dịch đã thiếu
    vắng cả Nanda.
  - 28.2 jarā samadhisessati: sam + adhi + sessati, nghĩa là nằm đè lên, phủ lên; dịch tuổi già
    sẽ đè lên con (con là tân ngữ ngầm). 28.3 kāruññe: đọc là hô cách nữ (hỡi người giàu lòng bi
    mẫn), song hành với anindite (28.4, hỡi người không bị chê trách, hô cách nữ như aninditā
    ở 20.4). Cách đọc khác: kāruññe là định cách (trong lòng bi mẫn, rời nhà trong lòng bi
    mẫn); chưa phân xử chắc, cần xem lại.
  - 30.1–30.4 Mahatā ca payattena, jhānajjhena paraṁ mama; kātuñca vadate mātā: đây là chỗ
    không phân xử chắc. jhānajjhena đọc là jhāna (thiền) + ajjhena (việc học, tụng), hoặc
    là dạng rút gọn của một danh từ đối cách là tân ngữ của kātuṁ; paraṁ đọc là hơn thế nữa;
    mama đọc là đối với ta. Bản Việt bám sát chữ từng khoá, không bảo đảm câu trọn nghĩa:
    mẹ bảo ta làm việc học thiền với nỗ lực lớn nhưng ta không hăng hái. Bản tra cứu toàn
    văn hiểu theo hướng này; Pāli không cho phép chắc hơn. Cần người biên tập xem lại.
  - 31.2 kāmalālasaṁ: lālasa là thèm khát; dịch thèm khát các dục. 31.3 nibbindanatthaṁ
    rūpasmiṁ: vì mục đích nhàm chán hình sắc (rūpa ở đây là hình sắc thân thể, theo ngữ cảnh
    25–26, không phải sắc uẩn nói chung).
  - 33.3–35.4 nháy đơn mở ở 33.3 (cintayiṁ ‘saphalaṁ meti) và đóng ở 35.4 (muhuttakaṁ’)
    theo Pāli, bao trùm cả lời nghĩ của Nandā, lời của Nandā với người nữ (34) và lời người
    nữ (35); bản Việt giữ đúng vị trí ‘ ’ như Pāli, không thêm dấu để tách người nói.
    33.4 nettalābhañca mānusaṁ: dịch cả việc có được đôi mắt loài người (ca là cả).
    34.1 Tamahaṁ ehi subhage: động từ nói (avocaṁ) bị lược trong Pāli, bản Việt thêm bảo (Ta
    bảo cô ấy: hãy đến đây).
  - 35.1 Na vañcakālo subhage: vañcakālo (Pāli đã ghim) không rõ nghĩa trực tiếp (vañca là sự
    lừa dối hoặc chỗ cong), nhiều khả năng là biến thể của pañhakālo (lúc hỏi han) vì người
    nữ đang trả lời lời hỏi tên, dòng họ ở 34.3–34.4; bản Việt theo ngữ cảnh: Không phải lúc
    để hỏi han. Cần xem lại với bản đối chiếu khác khi có.
  - 36.3–36.4 Tassā nalāṭe patitā, luddhā paramadāruṇā: chủ ngữ của patitā là danh từ nữ không
    nêu (tassā nipātena ở 37.1 cũng nữ); luddhā là hung tợn, độc ác. Bản tra cứu toàn văn hiểu
    là con nhện (lūtā), Pāli đã ghim chỉ có luddhā; bản Việt thêm chữ vật làm chủ ngữ tối
    thiểu (một vật hung tợn, vô cùng khủng khiếp) và không nêu nhện. Cần xem lại.
  - 39.1 paveditasabbaṅgī: pavedita là được báo cho biết; bản Việt dịch toàn thân run rẩy
    theo cách đọc pavedhita (run rẩy) hợp ngữ cảnh 39.2–39.4; cách đọc sát chữ là mọi chi
    thể đều bộc lộ (nỗi đau). Chưa phân xử chắc.
  - 40.1–45.4 một cặp nháy đơn bao trùm cả hai người nói theo Pāli (‘ mở ở 40.1, ’ đóng ở
    45.4): 40.1–40.4 là lời người nữ than với Nandā (tôi, hỡi bạn); 41.1–45.4 là lời Nandā với
    người nữ (te là của cô, 41.2 mũi cao của cô, 44.4 aho rūpamasassataṁ là lời Nandā); bản Việt
    phân biệt bằng đại từ (tôi, hỡi bạn / cô) và không thêm dấu ngoặc.
  - 41.3 Tambabimbavaroṭṭhaṁ: tamba là đỏ đồng, bimba là quả đỏ; giữ bimba nguyên chữ. 42.3
    Doḷālolāva: doḷā là chiếc võng hoặc cái đu, lola là lắc lư; va có thể là iva hoặc eva; bản
    Việt dịch đu đưa như chiếc võng. Cách đọc khác: nói về hoa tai đung đưa; chưa phân xử.
  - 43.1 Makuḷakhārakākārā: makuḷa là nụ hoa; khāraka bản Việt đọc là chồi non (không có tiền
    lệ, nghĩa chưa chắc), ākārā là hình dáng; dịch hình dáng như nụ hoa, như chồi non. Cần xem
    lại. 43.4 duṭṭhagandhittamāgatā: gandhitta là trạng thái bốc mùi; dịch đã đi đến trạng thái
    bốc mùi hôi thối.
  - 44.1–44.2 Vedimajjhāva sussoṇī, sūnāva nītakibbisā: vedimajjhā là eo thon (nghĩa quen
    dùng, nghĩa đen là eo như bệ thờ); sūnā là sưng; nītakibbisā chưa rõ (nīta với kibbisa là
    lỗi, ô uế; một cách đọc khác là nīlakibbisā, lở loét xanh sẫm); bản Việt dịch sưng phồng, đầy
    vết nhơ. Chưa phân xử chắc, cần xem lại.
  - 26.4 sirisaṅghāṭasannibhaṁ: saṅghāṭa là sự kết tụ, khối ghép; dịch tựa như khối kết tụ của
    vẻ rạng ngời; cách đọc khác: như một đôi (cặp) Sirī; chưa phân xử. 27.3 Puññānaṁ kittijananaṁ:
    dịch sinh ra danh tiếng của các phước báu (sở hữu cách giữ nguyên); không thêm công cụ
    cách (nhờ). 27.4 ukkākakula: dạng ukkāka của Pāli đã ghim là biến thể của okkāka (12.2); bản
    Việt dùng Okkāka cho nhất quán.
  - 38.4 pubbañcāpi sarīrakaṁ: dịch và thân xác cũng toàn mủ (pubba là mủ); sarīraka là dạng
    nhỏ của sarīra, dịch thân xác.
  - 46.2 bhātā me lokanāyako: Đức Phật là anh của Nandā theo Pāli của bài; bản Việt giữ đúng
    Pāli (là anh của ta).
  - 47.1 Āturaṁ kuṇapaṁ pūtiṁ: kuṇapa dịch như xác chết (thân bệnh, như xác chết, thối rữa).
    48.3 Duggandhaṁ pūtikaṁ vāti: vāti là bốc (mùi); dịch Nó bốc mùi hôi hám, thối rữa (chủ ngữ
    ngầm là etaṁ ở 48.1).
  - 49.4 abhinibbijjha dakkhasi: dịch sau khi thấu suốt, ngươi sẽ thấy (theo thig5.4:3.4
    abhinibbijjha dakkhisaṁ: sau khi thấu suốt, ta đã thấy rõ; thi-ap36:17.4 dịch vacchasi là an
    trú).
  - 50.3 Tatraṭṭhitāvahaṁ santī: dịch Ngay khi đang đứng tại chỗ ấy (tatra ṭhitā eva ahaṁ
    santī).
  - Bản tra cứu toàn văn nguyên bài trên SuttaCentral (giấy phép NOASSERTION; không phải
    tầng store, không căn lề theo khoá) đã được đọc để soát nghĩa ở các chỗ khó trên (30,
    35.1, 36.3–36.4, 39.1, 43–44); không chép vào bản dịch và không tính vào coverage hay
    triangulation; mọi cách dịch ở trên đều dựa vào Pāli root cùng các tiền lệ trong chính dự án.

