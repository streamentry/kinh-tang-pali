notes: |-
  Bài kinh thi-ap25 — Nandātherīapadāna, bài thứ năm của Phẩm Kuṇḍalakesī trong
  Therīapadāna. 218/218 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào
  ngoài tập khoá Pāli. Bài kể về tỳ-kheo-ni Nandā (Janapadakalyāṇī): thời Đức Phật
  Padumuttara, sinh trong gia đình triệu phú ở Haṁsavatī, nghe pháp, thỉnh Phật cùng Tăng
  đoàn thọ thực, ước nguyện chỗ tối thượng trong các tỳ-kheo-ni hành thiền và được thọ ký;
  qua nhiều đời làm hoàng hậu giữa chư thiên và loài người; đời cuối là con gái vua
  Suddhodana ở Kapila, nổi tiếng vì sắc đẹp, được mẹ thúc giục xuất gia nhưng còn say
  đắm sắc đẹp, rồi được Đức Phật tạo ra một người nữ đẹp hơn mình, người ấy bị bệnh
  rữa nát ngay trước mắt; nghe những bài kệ quán thân bất tịnh của Đức Phật (người anh),
  Nandā chứng A-la-hán và được xếp vào hàng đệ nhất trong những vị chuyên thiền.

