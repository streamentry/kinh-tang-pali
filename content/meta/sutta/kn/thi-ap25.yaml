    Pāli không số và Việt không số 389 tệp. Bài này rơi vào nhóm Pāli có số, giữ số.
  - Công thức tiêu đề: đo ở phạm vi gần nhất (32 tệp thi-ap đã có), Bài Kệ Tuyên Ngợ Về
    Trưởng Lão Ni có 30 tệp, Tuyên Ngôn 1 tệp, dạng khác 1 tệp. Toàn tầng tha-ap (552 tệp):
    Tuyên Ngợ 255, Ký Sự 152, Tuyên Ngôn 138, dạng khác 7. Hai phạm vi cùng cho Tuyên Ngợ là
    nhóm lớn nhất (đa số tương đối ở tha-ap), nên bài này giữ Tuyên Ngợ cho khớp các bài kề cận
