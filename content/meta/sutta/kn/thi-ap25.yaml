    hình thức N. : Giữ số. Trong 32 tệp thi-ap đã có: Pāli có số và Việt giữ số 9 tệp, Pāli
    có số mà Việt bỏ số 6 tệp, Pāli không số và Việt không số 17 tệp (không tệp nào thêm
