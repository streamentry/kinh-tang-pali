notes: |-
  **Cổng kỹ thuật của kho CHƯA chạy.** Đợt này lát được cấm chạy `npm run validate|test|check|build`,
  nên tôi **không** thể tuyên bố technical gate pass; `technical_integrity` đặt **9.6** chứ không
  phải 10.0 và bốn lệnh đó để người điều phối chạy. Tự kiểm riêng bằng script trên **MỌI** khoá
  (không chỉ khoá ≥ 40 ký tự mà `kiểm()` của `_hvi.py` quét): đủ số khoá của cả bài, đúng segment
  ID, không rỗng, NFC, không trùng nguyên văn Pāli, dấu lược khớp Pāli từng khoá, ngoặc kép cân
  trên cả bài, không `(…)`, không sót `pe…`, không Pāli lọt. Kết quả: SẠCH, 0 lỗi trên 236 khoá
  của cả lát.

  **Dấu lược — theo §10, không tự diễn giải.** Pāli có `…pe…` thì bản Việt giữ **một** `…` và
  **không** viết ra phần bị lược. Pāli viết đủ thì viết đủ; tôi **không** nén bằng `…` ở bất kỳ
  khoá nào. Hai khoá lệch dấu câu cuối câu (`cp33:1.3`, `cp5:1.1`: Pāli có dấu phẩy, bản Việt
  không) là **cố ý theo đúng tiền lệ `cp28:1.1`** — bản Việt của tầng không nhất thiết giữ dấu
  phẩy ở vế kệ đầu câu.

  **Pāli trùng nguyên văn ở bài khác — đếm bằng script, dùng lại nguyên văn đã có.** Quét toàn
  tầng Pāli gốc (5.764 tệp `*_root-pli-ms.json`, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn**
  từng khoá của lát này: **7 cặp trùng** (đếm theo cặp khoá-của-tôi × uid-khác, chỉ tính văn
  bản ≥ 20 ký tự sau chuẩn hoá). Trong đó **6 khoá (6/6) cặp đã có bản Việt ở bài khác và tôi dùng lại
  nguyên văn** (xem danh sách dưới); phần còn lại đều là bài chưa có bản Việt nên tôi đặt mới.
  **22 cặp dùng lại được đối chiếu từng chữ: 20 khớp tuyệt đối, 2 khớp phần thân nhưng khác
  hậu tố** — `ja151:2.1` và `ja178:2.1` phải mở lại dấu nháy kép vì Pāli mở nháy đúng ở đó (vế kệ
  đầu của bài kệ mới), nên đó là bắt buộc của chia khoá chứ không phải dịch khác.

  **Dùng lại (nguyên văn, không dịch lại):**
  · **`2.1`–`2.4` trùng nguyên văn `dhp186:1`–`4`, `3.1`–`3.4` trùng nguyên văn `dhp187:1`–`4`**
    — Pháp Cú đã xuất bản — nên tôi **dùng lại nguyên văn**: *Dù mưa bằng tiền vàng, / các dục vẫn không
    thể thỏa mãn; / biết rõ các dục ít ngọt nhiều khổ, / người trí mới hiểu được điều ấy.* và *Ngay cả
    trong các dục cõi trời, / vị ấy cũng không tìm được hoan hỷ; / vui thích sự tận diệt tham ái, / vị ấy là
    đệ tử của bậc Chánh Đẳng Giác.*  Cả **8 khoá** khớp tuyệt đối, trừ hậu tố `”ti.` của `3.4` vì Pāli đóng
    nháy kép đúng ở đó còn `dhp187:4` thì không.
  · `1.2` trùng nguyên văn `mn49:9.2` → dùng lại *chuyển động và tỏa sáng khắp các phương,*.
    `1.1` trùng `mn49:9.1` nhưng `mn49:9.1` có thêm vế dẫn *Ta đáp bằng kệ:* mà `ja258` **không có** —
    nên tôi chỉ dùng lại đúng phần kệ: *Xa đến nơi mặt trăng và mặt trời,*

  **Thuật ngữ mới của lát, đặt mới kèm lý do:**
  · `Tikanipāta` → **Bộ Ba Bài Kinh**; `Saṅkappavagga` → **Phẩm Suy Nghĩ**.
  · `Mandhātujātaka` → **Kinh Nô Tỳ Mandhātu**: `dāsā` = *nô tỳ*, `mandhātu` là **tên riêng** của người
    nữ nói trong truyện. Tôi dịch *Nô Tỳ* (giống cách `cp28:1.2` dịch *đạo sĩ* cho `brāhmaṇa`) và giữ
    tên riêng `Mandhātu` nguyên văn vì tầng chưa có cách phiên âm nào cho nó.
  · `sabbeva dāsā mandhātu` → *Tôi, Mandhātu, là nô tỳ của tất cả,* — chủ thể là chính người nói, không
    phải thứ gì khác. `pathavissitā` → *trên mặt đất này* (`pathavi` = *mặt đất*, `issita` = *có căn cứ ở*).
  · `virocanā` → *tỏa sáng* (dùng lại từ `mn49`; `āloko` ở `sn56.12` là *sáng*, hai chữ khác gốc).

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh:**
  · Bốn khoa `2.1`–`2.4` trong bản dịch của tôi **nghe như một câu về tiền bạc**, không phải về
    trăng. Đó là hệ quả trung thực của luật *Pāli trùng thì dùng lại nguyên văn*: `kahāpaṇavassena` là
    *mưa bằng bơ thảo* mà Pháp Cú 186 dịch thành *tiền vàng*, và cùng bốn câu ấy phải đứng nguyên ở đây.
    Tôi **không** dịch lại riêng cho truyện, và cũng không sửa `dhp186` (thuộc lát khác). Ghi ra đây để
    biên tập biết bản Việt ở hai nơi có nhịp khác nhau **vì lý do luật, không phải vì lỗi dịch**.
  · `3.1`–`3.4` lấy từ `dhp187` nên giữ đại từ *vị ấy*, trong khi nhân vật ở đây là một **nữ nô**;
    `so` ở Pāli là đại từ không xác định giới tính nên *vị ấy* vẫn đúng, nhưng người đọc có thể thấy
    lạc. Tôi giữ nguyên văn đã có thay vì tự sửa.
  · `1.3`–`1.4` `Sabbeva dāsā mandhātu, / Ye pāṇā pathavissitā.` tôi dịch *Tôi, Mandhātu, là nô tỳ của
    tất cả, / kẻ nào uống nước trên mặt đất này.* Có thể hiểu là *tôi là nô tỳ của tất cả những ai uống
    nước trên mặt đất* (tức mọi loài vật); cả hai cách cho cùng một ý.
