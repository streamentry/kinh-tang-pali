notes: |-
  kuruṅga-miga: Sujato đọc four-horned antelope cho cả tên phẩm và tên kinh → nai bốn sừng
    (0 tiền lệ trong tầng Việt). Không giữ nguyên dạng dấu Pāli vì chốt lọt-Pāli của _hvi.py
    chỉ khớp từng chữ trong khoá, mà kuruṅga nguyên dạng không xuất hiện ở khoá nào
    (chỉ có kuruṅgassa, Kuruṅgamigajātaka); đây là thỏa hiệp đã công khai, terminology 9.0.
    sepaṇṇi giữ nguyên vì khớp từng chữ Pāli ở đúng 1.2/1.3; không ưa 73 occ (na ruccati).
    1.2 siyyasi theo Sujato tosses fruit → rung cây cho rụng quả; ñātaṁ ở 1.1 dịch chủ động
    đã biết rõ, cùng điều kiện chân lý với cấu trúc sở hữu cách Pāli.
  Đối chiếu Pāli đã ghim với Anh Sujato ở 8/9 khoá; khoá kết 2.1 Sujato để trống
    (công thức tên kinh + số thứ tự), dịch từ Pāli theo tiền lệ ja1 đã published
    (Kinh Bụi Dơ thứ nhất). Không có tầng Việt hiện hành cho Jātaka trong snapshot
    đã ghim (tiếng Việt upstream chỉ có Pháp Cú) — giới hạn của bản chụp, không phải
    thiếu sót của repo. Không có dấu lược …pe… trong Pāli lát này nên hai phía đều 0.
