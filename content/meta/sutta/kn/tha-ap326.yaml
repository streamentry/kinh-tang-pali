  PĀLI TRÙNG NGUYÊN VĂN — 10 khoá trùng có bản Việt, dùng lại **nguyên văn cả 10**:
  `“Jātiyā sattavassohaṁ,` (tha-ap84:1.1) · `puṇṇamāyeva candimā.` (tha-ap389:1.2, tha-ap508:1.2) ·
  `Theyyā ca aticārā ca,` / `majjapānā ca ārati.` (vv25:8.3–8.4) ·
  `Buddhe cittaṁ pasādetvā,` (tha-ap27:4.3) · `Idaṁ vatvāna sabbaññū,` (tha-ap308:4.1) ·
  `lokajeṭṭho narāsabho;` (tha-ap69:5.2, tha-ap113:1.2, tha-ap117:1.2) ·
  `Tena cittappasādena,` (tha-ap68:5.1) · `tusitaṁ upapajjahaṁ.` (tha-ap308:5.4) ·
  `buddhasaññāyidaṁ phalaṁ.` (tha-ap75:2.4).

  MỘT CHỖ CỐ TÌNH **KHÔNG** DÙNG LẠI NGUYÊN VĂN — đã kiểm và cân nhắc, ghi lại để biên tập xét:
  `Ete dhamme bhāvayitvā,` (`:7.1`) trùng Pāli với iti22:6.1 và iti60:4.1, và bản Việt đã có của chúng là
  *Sau khi tu tập ba pháp ấy,*. Nhưng `ba` ở đó là của vế **kế tiếp** (`6.2 tayo sukhasamuddaye` = *ba
  suối niềm hạnh phúc*), không thuộc `6.1`; ở tha-ap326 trước `7.1` có **tám** pháp được kể (`5.1–6.2`).
  Dùng lại nguyên văn sẽ đưa một số không có trong Pāli khoá này. Tôi dịch *Sau khi tu tập những pháp ấy,*
  giữ nguyên phần chữ còn lại. Pāli là authority cuối cùng nên ở đây tôi nới luật dùng lại.

  THUẬT NGỮ, đếm được: `Therāpadāna` 327/336 · `Umāpupphiyavagga` → *Phẩm Umāpupphiya* — **6/7**
  (tha-ap325 dùng *Phẩm Bậc Rải Hoa Umā*; tôi theo đa số) · khuôn `Xtheraapadāna` → *Bài Kệ Tuyên Ngợ Về
  Trưởng Lão X* — nhiều nhất trong các `…theraapadāna` của tầng · `sabbasattahite rato` — 1 tiền lệ
  (tha-ap529:2.2 *Đấng luôn hân hoan mưu cầu hạnh phúc cho tất cả chúng sinh;* tôi theo cấu trúc đó) ·
  `Cullāsītisahassāni,` → *Tám mươi tư ngàn* (tha-ap113:3.1). Tên riêng `Yaññasāmika` **0 tiền lệ** trong
  tầng (đo bằng `grep` toàn bộ `content/translation/vi/project/sutta/`) ⇒ giữ dạng Pāli; tôi khai nó vào bộ
  nhớ tiến trình `_hvi._GIỮ` (không sửa `_hvi.py`) sau khi kiểm chứng nó có thật trong Pāli của chính bài này.

  BẤT ĐỊNH:
  (1) `yañño ussāhito mayā.` (1.4) — `yañño` vừa là *lễ hiến cúng* vừa là *Bà-la-môn*, và `ussāhita` là
      dạng bị động nên tôi đọc là *vị Bà-la-môn ấy do ta thúc ép*. Cách đọc còn lại (*lễ hiến cúng ấy do ta
      khởi động*) không có tiền lệ và làm `2.1–2.4` (bò mổ, ngựa từ phương Bắc) thành vòng lặp.
  (2) `Kulavattaṁ adhāresiṁ` (1.3) — đọc *Tôi giữ theo phép tục của tổ tiên*. `Kulavatta` chỉ xuất hiện đúng
      một lần trong toàn Pāli đã ghim, nên không có song ngữ đối chiếu; tôi không nêu tên riêng nào.
  (3) `bāhusaccaṁ kataññutā` (6.2) — đọc *là bậc đa học, dày lòng biết ơn*; `kataññutā` có thể là *nhớ nhận
      điều đã làm* thay vì *biết ơn*. Không có tiền lệ.
  (4) `Ete dhamme … / sabbasattahite rato;` (7.1–7.2) — chủ ngữ `Buddhe` ở `7.3` là Đức Phật, nên `7.2` tôi
      hiểu là Đấng ấy ham muốn phúc lợi cho chúng sinh; không nêu rõ chủ thể bằng lời Việt.
  (5) `Pubbe cittaṁ visodhetvā, / pacchā cittaṁ pasādayiṁ;` (9.1–9.2) — `visodheti` và `pasādayati` đều là
      *làm cho trong sạch*, Pāli cố ý lặp hai động từ; tôi dịch *Trước đã làm sạch tâm, / về sau lại làm cho
      tâm trong sạch;* và **không** bịa ra sự khác biệt vốn không có trong nguồn.

