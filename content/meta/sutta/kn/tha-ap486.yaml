notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng ở bài này. Đối chiếu tiền lệ chỉ với bản Việt của chính dự án cho cùng bộ `tha-ap`; hai bài gần nghĩa nhất là tha-ap133 và tha-ap134 (cùng mô-típ tán thán trí của Đức Phật bằng `ñāṇa`), tha-ap436 (Ñāṇatthavika, cùng mô-típ da thú một bên vai) và tha-ap490 (`Yato sarāmi attānaṁ`).
  Coverage English: mẫu số = 1 (chỉ `:31.1` đạt ngưỡng 40 ký tự theo `source/layers.yaml`, 63 ký tự; 116 khoá thân bài, mỗi vế kệ chỉ 18-26 ký tự), Sujato phủ 0/1. Với mẫu số nhỏ như vậy, cổng coverage gần như không đo được gì, và việc `content/meta/reference-gaps.yaml` chưa có entry cho uid này cần được coordinator xử lý bằng `npm run reference:gaps`; có entry cũng không cứu được `published`.
  Pāli trùng nguyên văn: 48 khoá có tiền lệ trong tầng `tha-ap` (8.523 chuỗi Pāli khác nhau đã dò), dùng lại nguyên văn bản Việt ở 37 khoá và cố ý khác ở 11 khoá. Trong chính bài có 4 nhóm Pāli trùng nguyên văn: `Na tveva tava sabbaññu,` ở `:12.3` `:14.3` (hai khoá dịch giống hệt; vật được đo `ñāṇaṁ`/`sīlaṁ` nằm ở khoá kế nên đặt ở `:12.4` `:14.4`, không đẩy vào khoá trước), `phalaṁ ñāṇassa thomane.` ở `:25.4` `:27.4` (giống hệt), `…pe…` ở `:28.2` `:29.2` `:30.2` (đều là một dấu `…`), và `Tiṁsakappasahassamhi,` ở `:22.1` `:27.1` (Việt khác có chủ ý: `:22.1` là lời thọ ký về tương lai "Sau ba mươi ngàn kiếp nữa", `:27.1` là hồi tưởng quá khứ "Vào ba mươi ngàn kiếp trước đây" theo 6 tiền lệ). Có 1 cặp trùng trong bài mà Việt khác, và đó là cặp có chủ ý này.
  Cố ý khác tiền lệ, có đo: (1) `Padesarajjaṁ vipulaṁ` ở `:20.3` dịch "Vương quyền cai quản các vùng đất rộng lớn" thay cho "Vương quốc rộng lớn ấy" (cả tầng 15 so với 7; phạm vi tha-ap440-540 là 5 so với 1), vì Pāli không có đại từ chỉ định "ấy" và `padesarajja` là quyền cai trị một vùng, không phải một nước. (2) `Catusaccaṁ pakāseti` ở `:3.3` dịch "làm sáng tỏ bốn sự thật" thay cho "tuyên thích bốn sự thật" (2 tiền lệ, từ "tuyên thích" không có nghĩa rõ). (3) `Lābhālābhena santuṭṭho` ở `:2.1` dịch "Biết đủ với được và mất" thay cho "được mất, tôi đều an lạc trong tâm" (1 tiền lệ, thêm "an lạc trong tâm" không có trong `santuṭṭha`). (4) `Tiyaggī nibbutā mayhaṁ` ở `:26.1` dịch "Ba ngọn lửa của ta đã tắt", bỏ "dần" của tiền lệ duy nhất (tha-ap454:4.1) vì Pāli không có. (5) `Duggatiṁ nābhijānāmi` ở `:27.3` dịch "Ta không còn biết đến đọa xứ": toàn tầng (415 khoá) "đọa xứ" 215, "khổ đau" 145, khác 55; phạm vi tha-ap440-540 "đọa xứ" 37 so với "khổ đau" 23; chọn "đọa xứ" vì `duggati` là cõi đi xấu và theo phạm vi gần nhất.
  Số Pāli: `Tiṁsakappasahassamhi` (`:22.1` `:27.1`) = tiṁsa 30 (không phải 3) x kappa x sahassa: "ba mươi ngàn kiếp" = 30.000 kiếp (theo chỉ dẫn của người biên tập; các tiền lệ tha-ap396:9.1 `Tiṁsa kappasahassamhi` và tha-ap109:10.1 cùng viết "ba mươi ngàn"; brief cũ ghi "ba nghìn" bị bỏ). `Sattasattati kappāni` (`:19.1`) = satta 7 + sattati 70 = 77, viết "Bảy mươi bảy". `Sahassakkhattuṁ` (`:19.3`) = 1.000 lần, viết "Một ngàn lần". `Anekasatakkhattuñca` (`:20.1`) = aneka + sata + khattuṁ, viết "nhiều trăm lần" (không đoán con số). `Aṭṭhavasse` (`:4.3`) = 8 năm. `Jātiyā sattavassena` (`:23.3`) = 7 tuổi. `Ekavīsatimaṁ bhāṇavāraṁ` (`:10.1`) = eka 1 + vīsati 20 = 21, viết "thứ hai mươi mốt" (đo: 12 khoá `bhāṇavāra` trong tầng, 8 dùng "Phần tụng đọc thứ ...", 4 dùng dạng khác; đã có tha-ap458:7.2 "thứ hai mươi" và tha-ap528:8.2 "thứ hai mươi ba"). `Chahi gāthāhi` (`:16.1`) = 6 bài kệ: đối chiếu thấy đúng sáu bài (bài 9.1-9.4 và năm bài 11-15), khớp. `Catusacca` 4, `Tiyaggī` 3, `Paṭisambhidā catasso` 4, `Tisso`, không có trong bài. Phép kiểm số trên toàn bản Việt: không có số nào khác ngoài các số này.
  Đại từ: "ta" cho vị trưởng lão tự thuật xuyên suốt; "Ta" viết hoa trong lời Đức Phật ở `:18.1` `:18.3` `:18.4` để phân biệt người nói (tiền lệ có cả "ta" và "Ta" cho `suṇātha mama bhāsato`, 9 so với 5). Đo ở phạm vi gần nhất tha-ap440-540, bài kề tha-ap485 chọn "ta"; chọn "ta" cho nhất quán. Lời kết `:31.1` dùng nhóm "những bài kệ này" (đo 407 khoá; nhóm số ít "bài kệ này" chỉ 21).
  `:0.3`: Pāli `:0.3` bắt đầu bằng số ("4 Ñāṇathavikattheraapadāna") nên giữ số theo hình thức "N. " như tha-ap482 ("10. ..."); `translationTitle` bằng đúng `:0.3`. Phần "Bài Kệ Tuyên Ngợ Về Trưởng Lão": phạm vi gần nhất tha-ap440-540 "Tuyên Ngợ" 56, "Ký Sự" 24, "Tuyên Ngôn" 2; cả tầng tha-ap "Tuyên Ngợ" 251, "Tuyên Ngôn" 132, "Ký Sự" 111. Hai phạm vi cùng cho "Tuyên Ngợ" là đa số; giữ để khớp bài kề (tha-ap485, 488, 490) và để biên tập phán một lượt cho cả cuốn. Tên `Ñāṇathavika` giữ nguyên Pāli như tha-ap436 giữ `Ñāṇatthavika` (hai tên Pāli khác nhau, không gộp); `Candavatī`, `Himavanta`, `Sumedha`, `Okkāka`, `Gotama` giữ Pāli theo tiền lệ. `:0.2` `Paṁsukūlavagga` = "Phẩm Y Phấn Tảo" (5/5 tiền lệ).
  Thuật ngữ: `ñāṇa` dịch "trí" (không "trí tuệ") để phân biệt với `paññā` "trí tuệ" ở `:13.3`, `:17.2`, `:21.4`; tiền lệ không thống nhất (tha-ap133 "tài trí", tha-ap134 "tri thức", tha-ap436 "trí tuệ"). `sīla` giới; `cakkhumā` bậc Có Mắt; `sabbaññu` bậc Toàn Tri; `lokanāyaka` bậc Dẫn Đạo Thế Gian (theo tha-ap490:2.4; tiền lệ khác của `santhaviṁ lokanāyakaṁ` ở `:8.4` viết "bậc Dẫn Dắt Thế Gian", "Đấng Dẫn Đạo thế gian", "bậc Dẫn Đạo Thế Gian"); `dvipaduttama` bậc Tối Thượng Loài Hai Chân (9 khoá tiền lệ, viết nhiều cách khác nhau: "bậc song chân tối thượng", "Đấng Lưỡng Túc Tối Thắng", "tối thượng giữa loài hai chân"); `devindo` chúa chư thiên (đa số trong tha-ap); `santuṭṭho` biết đủ; `amataṁ padaṁ` cảnh giới bất tử (tiền lệ); `punabbhavo` tái sinh.
  Bất định: (1) `:5.1` `Aggidāruṁ nīharitvā` hiểu là mang củi lửa ra ngoài am; `aggidāru` cũng có thể là que lấy lửa, chưa phân xử được. (2) `:8.2` `jinasāgaraṁ` là hợp từ ẩn dụ, dịch "bậc Chiến Thắng như biển cả"; chữ "như" là cách đọc của hợp từ, Pāli không có từ tương ứng. (3) `:9.2` `yūpo` dịch "cột trụ" (nghĩa gốc là cột tế lễ; tiền lệ tha-ap312:3.1 dịch "cột tế lễ"), `ketu` "cờ hiệu", `dhajo` "cờ phướn": ba hình ảnh gần nghĩa nhau, cách phân biệt chưa chắc. (4) `:11.1` `Nepuñño dassane vīro` dịch "thiện xảo trong cái thấy" giữ sát chữ; `dassana` có thể là tri kiến hay việc chỉ dạy. (5) `:11.3-11.4` `Natthañño tārako loke tavuttaritaro` hiểu "không có người cứu độ nào khác vượt trội hơn Ngài". (6) `:12.1` `theve` là từng giọt, vật bị đo là chất lỏng trong đại dương nhưng Pāli không nói "nước". (7) `:13.2` `dharetave` dịch "cân được" (cũng có thể là nâng giữ). (8) `:17.2` `bhūripaññaṁ sumedhasaṁ` dịch "bậc có trí tuệ rộng lớn, bậc có trí sáng suốt"; hai tính từ gần nghĩa nhau, phân biệt chưa chắc. (9) `:18.1` `pakittesi` dịch "ca ngợi" còn `:18.3` `kittayissāmi` dịch "tuyên thuyết" theo 11 tiền lệ; hai động từ cùng gốc `kitt` nhưng bản Việt dùng hai từ. (10) `:24.4` `cetanaṁ amanoramaṁ` dịch "ý nghĩ nào không vừa lòng"; `cetanā` có thể là tư/ý chí. (11) `:25.2` `sampattānubhaviṁ` dịch "đã hưởng các thành tựu"; tiền lệ tha-ap12:7.3 dịch "thọ hưởng sự phúc báo", tha-ap15:3.1 "thọ hai thành tựu". (12) `:16.1` thứ tự dòng Việt đảo nhẹ so với Pāli (phần "sau khi ca ngợi" nằm ở `:16.1`, đối tượng "bậc Toàn Tri" ở `:16.2`) để câu Việt tự nhiên; không thêm hay bớt nghĩa. (13) `:23.2` `pabbajissatikiñcano` hiểu là `pabbajissati akiñcano`, "xuất gia, không sở hữu gì".
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Chỉ xác minh được: JSON hợp lệ, đủ 119/119 khoá, đúng thứ tự Pāli, không khoá thừa, mọi giá trị NFC, dấu lược khớp Pāli từng khoá (3/3 khoá `…pe…` thành `…`), không có `(…)` ở Pāli hay Việt, nháy đơn và nháy kép khớp Pāli từng khoá (6 khoá có nháy: `:1.1` `:9.1` `:15.4` `:18.1` `:21.4` `:30.3`, nháy chạy qua ranh giới khoá), và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
