  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá, lệch 0/61 khoá: Pāli mở ở `1.1`, `2.1`, `4.1`, `5.1`, `6.1`, `12.1`, `13.1` và đóng ở `1.4`, `3.4`, `5.4`, `11.4`, `12.6`, `13.6` (và `4.4`); Pāli không mở nháy ở `3.1` nên `2.1`–`3.4` là một lời trích liền, `6.1`–`11.4` cũng vậy. Nháy đơn `‘’`: Pāli 1 cặp (`4.4`), Việt 1 cặp, lệch 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0. Một lỗi đã bắt khi tự kiểm: bản nháp đầu bỏ sót dấu mở nháy ở `2.1`; phép so dấu nháy từng khoá bắt được và đã sửa.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (tầng Pāli đã ghim không có). `1`–`3`: nhà vua nói với thiên nga; `4`: thiên nga; `5`: nhà vua; `6`–`11`: thiên nga (có các hô cách `rāja`, `rathesabha`, `raṭṭhavaḍḍhana`); `12`: nhà vua; `13`: thiên nga. Đây là suy luận từ nội dung và từ dấu nháy của Pāli, không được ghi vào thân kinh. Pāli không mở nháy mới ở `2.1` nên việc `2` có phải cùng người nói với `1` hay không là không chắc chắn.
  2. `Issarosi anuppatto yamidhatthi pavedaya` (1.3–1.4): dịch “ngươi đã đến như một bậc chủ nhân, điều gì có ở đây, hãy cứ nói ra”. `yamidhatthi` tách thành `yaṁ idha atthi`; có thể hiểu “hãy nói ra điều ngươi cần ở đây” hoặc “hãy nói điều gì đang có ở đây”; tôi giữ nguyên vẹn mơ hồ của Pāli, không thêm “cần/muốn”.
  3. `Kaccinnu me pīyasi dassanena` (2.4): tôi đọc `pīyasi` là `piyo asi` (nguyên âm dài do vần luật), song song với `piyo mesi` ở `3.1` (`piyo me asi`) và `bhiyyo cāgamma dassanaṁ` ở `3.2`: “phải chăng nhờ được thấy, ngươi đáng mến đối với ta?”. Cách đọc khác: `pīyasi` là một động từ nghĩa “ưa thích” (“ngươi có thích ta khi thấy ta không?”), đảo chiều chủ thể của sự quý mến. Không tìm được tiền lệ nào (0 khoá).
  3b. `bhiyyo cāgamma dassanaṁ` (3.2): [đã sửa ở lượt 2026-10-11, xem cuối ghi chú] `āgamma` + đối cách = “nhờ vào, do”, nên dịch “nhờ được thấy”, không còn vấn đề chủ ngữ của “đến”.
  4. `Evaṁ piyadassano me` (3.3): `piyadassana` dịch “có dáng vẻ đáng mến”; cũng có thể là “đáng mến khi nhìn”, cùng nghĩa gần như nhau.
  5. `Yaṁ me piyataraṁ tayā` (5.2): tôi đọc `yaṁ` quy về “việc uống rượu” (`majjapānaṁ`) và `piyataraṁ tayā` là “quý hơn ngươi”; câu có thể hiểu là lời tự trách của nhà vua (“khốn thay việc uống rượu, mà ta lại quý nó hơn ngươi”) hoặc là điều kiện giả định (“nếu nó quý hơn ngươi”); tôi giữ nguyên cú pháp Pāli, không thêm “nếu”/“lại”.
  6. `avidūre sahāpi so` (8.2) và `Santikepi hi so dūre` (8.3): dịch “người ấy vẫn không xa, như cùng chung sống” và “dù ở ngay bên cạnh, người ấy vẫn xa”. `sahāpi` có thể tách `saha` (“cùng”) + `api` hoặc là một từ khác; cách đọc “như cùng chung sống” theo mạch đối lập với `santikepi … dūre` và với `10.1`–`10.4`.
  7. `antopi` (9.1, 9.3): nghĩa đen “ở bên trong”; tôi dịch “ở ngay bên cạnh” theo mạch đối lập với `pāraṁ samuddassa` (“bên kia biển”) và với `santike` ở `8.3`. Nếu `anto` được hiểu “trong nhà/trong thành” thì nghĩa gần như không đổi.
  8. `Puna kayirāsi pariyāyaṁ` (12.6): dịch “xin hãy lại sắp đặt một lượt nữa”; `pariyāya` có nghĩa “lượt, phiên, dịp” và nghĩa này khớp với lời đáp ở `13.5`–`13.6` (“may ra chúng ta sẽ được thấy nhau khi những ngày đêm đã trôi qua”). Tôi không thêm “đến thăm”/“trở lại” vào thân kinh. 0 tiền lệ trong tầng.
  9. `Paricārakānaṁ sataṁ` (12.3): [đã sửa ở lượt 2026-10-11, xem cuối ghi chú: `sataṁ` không phải “hiền thiện” mà là “đang là”] `paricārakānaṁ sataṁ` = “trong khi chúng tôi là những người hầu cận”; `no` (12.4) = “của chúng tôi”. Người nói tự xưng là “người hầu cận” của thiên nga.
  10. `Evañce no viharataṁ` (13.1): `no` đọc là “của chúng ta”; `antarāyo` dịch “chướng ngại” (cũng có thể là “hiểm họa” gây tử vong). Không thêm “trong lúc sống” ngoài `viharataṁ` (= “đang sống”).

