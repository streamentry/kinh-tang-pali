  - `paduṭṭhacitta` (9.3, 9.4) → “ác tâm”: tầng có 4 khoá, ví dụ `dn32:9.8` dịch “ác tâm”.
  - `dhiratthu` (5.1) → “khốn thay”: 6 khoá trong `dn14` (ví dụ `dn14:2.2.13`) dịch “Ôi, khốn thay”.
  - `siṅgāla` (6.1) → “chó rừng”: 14 khoá trong `ja` dùng “chó rừng”, 0 khoá dùng cách khác trong các mẫu đã đo.
  - `sumano` (7.3) → “có thiện ý”, theo `ja478:5.3`.
  - `rathesabha` (10.2): [đã sửa ở lượt 2026-10-11, xem cuối ghi chú; câu “0 tiền lệ” ở lượt đầu là sai] nay dịch “bậc chiến xa đệ nhất”.
