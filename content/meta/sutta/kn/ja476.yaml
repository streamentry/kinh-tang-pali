  Hai tiêu chí thấp nhất trước lượt này, theo chính ghi chú cũ: `triangulation` 7,0 (không có tầng Anh nào; giữ nguyên, không thể nâng) và nhóm `semantic_fidelity`/`grammar_logic`/`ambiguity_integrity` 8,8 (một loạt cách đọc chưa phân xử).
  - `1.2` “được thấy ngươi, ta rất vui lòng” → “được thấy ngươi là điều ta quý mến”. Accuracy/terminology: `rất` không có trong Pāli (`piyaṁ`); cùng Pāli `piyaṁ me tava dassanaṁ` ở `ja484:14.4` đã dịch đúng câu này, `ja489:25.4` và `ja395:6.4` cùng hướng (3 tiền lệ, 0 tiền lệ có “rất”); “quý mến” cũng nối với “đáng mến” (`piya`) ở `2`–`3`.
  - `2.1`–`2.2` “Có người trở nên đáng mến nhờ nghe nói, còn với kẻ khác …” → “Với người này, có kẻ trở nên đáng mến nhờ nghe nói, còn với người kia, …”. Accuracy (ngữ pháp): `ekassa` ở `2.1` là số ít (người cảm nhận), song song với `panekassa … chando` ở `2.2`; bản cũ biến vế đầu thành “một hạng người”, rồi vế sau lại nói về người cảm nhận, nên hai vế lệch trục. Không có tiền lệ nội bộ để đếm (Pāli chỉ có ở bài này); nghĩa chung của đoạn không đổi.
  - `3.2` “khi đến được thấy” → “nhờ được thấy”. Terminology/clarity: `āgamma` + đối cách là “nhờ vào, do”; `sn42.11:4.4` (`dassanaṁ vā te … āgamma`) dịch “do đã thấy”, `an5.162:8.5` và `an10.103` dịch “nương vào”; “đến được thấy” là calque từ nghĩa “đến”. Nay song song với “Nhờ nghe nói” ở `3.1`.
  - `10.2` “bậc đứng đầu hàng chiến xa” → “bậc chiến xa đệ nhất”. Terminology fix, sửa một khẳng định sai của lượt trước (“0 tiền lệ”): trong `kn/ja` có 51 khoá chứa `rathesabha` đã dịch, **39 khoá / 11 bài** dùng “bậc chiến xa đệ nhất” (ví dụ `ja260:1.4`, `ja482:5.2`, `ja499:9.4`, `ja531:66.2`, `ja542:95.2`, `ja547:180.6`), 3 khoá “ưu việt giữa những người chiến xa”, 2 “ngự chiến xa”, còn lại lẻ.
