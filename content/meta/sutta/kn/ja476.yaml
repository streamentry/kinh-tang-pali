notes: |-
  Đợt 19, làn 43. Dịch từ Pāli root commit đã ghim, đủ 61/61 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem dưới).

  **Tiêu đề, theo khuôn của các bài cùng phẩm `ja474`, `ja475`, `ja478`, `ja481`.**
  - `0.2` “Bộ Mười Ba Bài Kinh” và `0.3` “Phẩm Xoài” dùng lại nguyên văn từ 4 bài anh em (cùng `Terasakanipāta` + `Ambavagga`): 8 cặp trùng Pāli, 0 cặp lệch.
  - `0.4` “3. Kinh Thiên Nga Javana”: `Javanahaṁsajātaka` = chuyện “thiên nga Javana”. `haṁsa` → “thiên nga” theo tiền lệ `ja77:0.4` (“Kinh Đại Thiên Nga”) và các khoá kệ `ja160:1.4`, `ja200:1.4`, `ja294:1.1`, `ja370:1.1` (4 khoá dùng “thiên nga”, so với tiêu đề `ja136:0.4` “Ngỗng Vàng” là ngoại lệ 1 khoá). `Javana` (nghĩa gốc “nhanh, mau lẹ”) giữ nguyên làm tên riêng theo cách `ja475` giữ “Phandana”, `ja478` giữ “Dūta”; không dịch nghĩa vì không có chứng cứ ngoài kệ cho thấy đó là tên hay là tính từ.
  - `14.1` “Kinh Thiên Nga Javana, thứ ba.” theo `ja474:14.1`, `ja475:14.1`, `ja478:14.1` (có dấu phẩy trước số thứ tự).

  **Tiền lệ dùng lại nguyên văn: 19 cặp Pāli trùng với bài khác trong tầng đã dò** (8 cặp tiêu đề nói trên + 11 cặp ở thân kệ).
  - `6.1`–`6.4` ↔ `ja478:4.1`–`4.4` và `7.1`–`7.4` ↔ `ja478:5.1`–`5.4` (Pāli trùng cả 8 dòng): dùng lại đúng bản Việt, chỉ thêm dấu mở nháy kép ở `6.1` vì Pāli `ja476:6.1` mở nháy còn `ja478:4.1` thì không.
  - `8.1` ↔ `ja68:1.1` (Pāli trùng `Yasmiṁ mano nivisati,`): dùng lại “Ở ai tâm định lại,” (bỏ nháy mở vì Pāli `ja476:8.1` không mở nháy).
  - `4.2` ↔ `ja343:1.2` (Pāli trùng `niccaṁ sakkatapūjitā;`): bản Việt **khác**, cố ý. `ja343:1.2` viết “luôn được cung kính tôn trọng tiếp đãi chu đáo”; “tiếp đãi chu đáo” không có trong Pāli (`sakkata` + `pūjita`), nên ở đây viết “luôn được cung kính, tôn trọng”. Người điều phối có thể muốn đồng bộ một lần cho cả hai khoá.
  - `11.3` ↔ `ja370:3.3` (Pāli trùng `Āmanta kho taṁ gacchāma,`): bản Việt **khác**, cố ý. `ja370:3.3` là “Thôi ta xin từ biệt bạn mà bay đi”, gắn với người nói là một con chim nói với bạn; ở đây người nói là thiên nga nói với nhà vua và số nhiều (`gacchāma`) nên viết “xin từ biệt ngài, chúng tôi xin đi”.
  - Tổng: 19 cặp, 2 cặp lệch nội dung (`4.2`, `11.3`), 1 cặp lệch chỉ ở dấu nháy (`6.1`); `raṭṭhavaḍḍhana` (`10.4`, `13.4`) ở `ja478:2.2`, `ja478:13.2` là “bậc làm giàu có cho xứ Kāsi”; ở đây Pāli không có `kāsīnaṁ` nên dùng “bậc làm giàu có cho xứ sở” (2 tiền lệ).

  **Trùng nguyên văn trong chính bài:** 61 khoá, 0 nhóm Pāli trùng nguyên văn (đã quét sau khi bỏ dấu nháy, dấu câu và nén khoảng trắng) ⇒ phép này chạy rỗng, không có gì để so; không tuyên bố “0 lỗi”.

  **Số Pāli:** bài này không có số lượng nào cần tính. Số `3.` ở dòng tiêu đề `0.4` và `tatiyaṁ` ở `14.1` = 3 ⇒ “thứ ba” (khớp với số trong tiêu đề). `Terasaka` (`0.2`) = 13 theo tiền lệ “Bộ Mười Ba Bài Kinh”.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `pasannacitta` (9.1, 9.2) → “tâm tịnh tín”: tầng có 11 khoá chứa `pasannacitto`, ví dụ `dn5:25.4`, `dn5:26.4`, `mn142:14.4` dịch “tịnh tín”.
  - `paduṭṭhacitta` (9.3, 9.4) → “ác tâm”: tầng có 4 khoá, ví dụ `dn32:9.8` dịch “ác tâm”.
  - `dhiratthu` (5.1) → “khốn thay”: 6 khoá trong `dn14` (ví dụ `dn14:2.2.13`) dịch “Ôi, khốn thay”.
  - `siṅgāla` (6.1) → “chó rừng”: 14 khoá trong `ja` dùng “chó rừng”, 0 khoá dùng cách khác trong các mẫu đã đo.
  - `sumano` (7.3) → “có thiện ý”, theo `ja478:5.3`.
  - `rathesabha` (10.2): 0 tiền lệ trong tầng; dịch “bậc đứng đầu hàng chiến xa” (`usabha` = “bò mộng/bậc tối thắng”, `ratha` = “xe/chiến xa”), không giả định chức danh.
  - `sakkatapūjitā` (4.2) → “cung kính, tôn trọng”: chỉ có 1 tiền lệ (`ja343:1.2`), xem trên.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá, lệch 0/61 khoá: Pāli mở ở `1.1`, `2.1`, `4.1`, `5.1`, `6.1`, `12.1`, `13.1` và đóng ở `1.4`, `3.4`, `5.4`, `11.4`, `12.6`, `13.6` (và `4.4`); Pāli không mở nháy ở `3.1` nên `2.1`–`3.4` là một lời trích liền, `6.1`–`11.4` cũng vậy. Nháy đơn `‘’`: Pāli 1 cặp (`4.4`), Việt 1 cặp, lệch 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0. Một lỗi đã bắt khi tự kiểm: bản nháp đầu bỏ sót dấu mở nháy ở `2.1`; phép so dấu nháy từng khoá bắt được và đã sửa.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (tầng Pāli đã ghim không có). `1`–`3`: nhà vua nói với thiên nga; `4`: thiên nga; `5`: nhà vua; `6`–`11`: thiên nga (có các hô cách `rāja`, `rathesabha`, `raṭṭhavaḍḍhana`); `12`: nhà vua; `13`: thiên nga. Đây là suy luận từ nội dung và từ dấu nháy của Pāli, không được ghi vào thân kinh. Pāli không mở nháy mới ở `2.1` nên việc `2` có phải cùng người nói với `1` hay không là không chắc chắn.
  2. `Issarosi anuppatto yamidhatthi pavedaya` (1.3–1.4): dịch “ngươi đã đến như một bậc chủ nhân, điều gì có ở đây, hãy cứ nói ra”. `yamidhatthi` tách thành `yaṁ idha atthi`; có thể hiểu “hãy nói ra điều ngươi cần ở đây” hoặc “hãy nói điều gì đang có ở đây”; tôi giữ nguyên vẹn mơ hồ của Pāli, không thêm “cần/muốn”.
  3. `Kaccinnu me pīyasi dassanena` (2.4): tôi đọc `pīyasi` là `piyo asi` (nguyên âm dài do vần luật), song song với `piyo mesi` ở `3.1` (`piyo me asi`) và `bhiyyo cāgamma dassanaṁ` ở `3.2`: “phải chăng nhờ được thấy, ngươi đáng mến đối với ta?”. Cách đọc khác: `pīyasi` là một động từ nghĩa “ưa thích” (“ngươi có thích ta khi thấy ta không?”), đảo chiều chủ thể của sự quý mến. Không tìm được tiền lệ nào (0 khoá).
  3b. `bhiyyo cāgamma dassanaṁ` (3.2): `āgamma` = “đến, nhờ vào”; dịch “khi đến được thấy” — nghĩa “càng đáng mến hơn khi thấy tận mắt” là điều chắc, còn chủ ngữ của “đến” có thể là nhà vua hay thiên nga.
  4. `Evaṁ piyadassano me` (3.3): `piyadassana` dịch “có dáng vẻ đáng mến”; cũng có thể là “đáng mến khi nhìn”, cùng nghĩa gần như nhau.
  5. `Yaṁ me piyataraṁ tayā` (5.2): tôi đọc `yaṁ` quy về “việc uống rượu” (`majjapānaṁ`) và `piyataraṁ tayā` là “quý hơn ngươi”; câu có thể hiểu là lời tự trách của nhà vua (“khốn thay việc uống rượu, mà ta lại quý nó hơn ngươi”) hoặc là điều kiện giả định (“nếu nó quý hơn ngươi”); tôi giữ nguyên cú pháp Pāli, không thêm “nếu”/“lại”.
  6. `avidūre sahāpi so` (8.2) và `Santikepi hi so dūre` (8.3): dịch “người ấy vẫn không xa, như cùng chung sống” và “dù ở ngay bên cạnh, người ấy vẫn xa”. `sahāpi` có thể tách `saha` (“cùng”) + `api` hoặc là một từ khác; cách đọc “như cùng chung sống” theo mạch đối lập với `santikepi … dūre` và với `10.1`–`10.4`.
  7. `antopi` (9.1, 9.3): nghĩa đen “ở bên trong”; tôi dịch “ở ngay bên cạnh” theo mạch đối lập với `pāraṁ samuddassa` (“bên kia biển”) và với `santike` ở `8.3`. Nếu `anto` được hiểu “trong nhà/trong thành” thì nghĩa gần như không đổi.
  8. `Puna kayirāsi pariyāyaṁ` (12.6): dịch “xin hãy lại sắp đặt một lượt nữa”; `pariyāya` có nghĩa “lượt, phiên, dịp” và nghĩa này khớp với lời đáp ở `13.5`–`13.6` (“may ra chúng ta sẽ được thấy nhau khi những ngày đêm đã trôi qua”). Tôi không thêm “đến thăm”/“trở lại” vào thân kinh. 0 tiền lệ trong tầng.
  9. `Paricārakānaṁ sataṁ` (12.3): `sataṁ` đọc là sở hữu cách số nhiều của `santa` (“những người hiền thiện”) bổ nghĩa `paricārakānaṁ` (“những người hầu cận”); `no` (12.4) = “của chúng tôi”. Câu có thể đọc nhấn vào người nói là nhà vua tự gọi mình là “người hầu cận”.
  10. `Evañce no viharataṁ` (13.1): `no` đọc là “của chúng ta”; `antarāyo` dịch “chướng ngại” (cũng có thể là “hiểm họa” gây tử vong). Không thêm “trong lúc sống” ngoài `viharataṁ` (= “đang sống”).

