  - Điểm đổi: `grammar_logic` 8,8 → 8,9 (`2.1`–`2.2`, `3.2`, `12.3` là ba lỗi ngữ pháp/logic cụ thể đã sửa); `terminology` 9,0 → 9,2 (`10.2` theo 39/51, `1.2`, `3.2` đều có số đếm); `vietnamese_clarity` 9,0 → 9,1 (`3.2`, `2.1`–`2.2`, `12.3`). Không đổi: `semantic_fidelity` 8,8 và `ambiguity_integrity` 8,8 vì bất định thật vẫn còn (xem trên: `2.4` `pīyasi` là hapax toàn tầng Pāli, 0 tiền lệ; `8.2` `sahāpi`; `9.1` `antopi`; `5.2`; `12.6` `pariyāya`; người nói ở `2` và `12` chỉ suy từ ngữ cảnh) ; `triangulation` 7,0; `source_provenance`, `segment_alignment`, `han_viet_balance`, `technical_integrity` giữ nguyên. Mean thô = 9,01.
