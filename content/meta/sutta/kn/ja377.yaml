  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 29 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Sửa lan 2026-10-13 (accuracy fix; đổi 5.3, 5.4, 6.2, 6.4). Trước → sau: 5.4 «chỉ có sự tự chế cùng đức hạnh chân thật mới là chân lý» → «chỉ có sự tự chế cùng đức hạnh mới là chân lý»; 6.2 «nhưng sự tự chế cùng đức hạnh chân thật mới là chân lý» → «chỉ có sự tự chế cùng đức hạnh mới là chân lý»; 6.4 «nhưng nhờ đức hạnh thuần hóa mà người ta chứng đắc sự tịch tịnh» → «nhưng người được điều phục nhờ đức hạnh thì chứng đắc sự tịch tịnh»; 5.3 «Trẫm nghĩ rằng» → «Tôi nghĩ rằng». Căn cứ: saccaṁ ở 5.4/6.2 là vị ngữ «là chân lý» (caraṇameva saccaṁ), tính từ «chân thật» gắn vào «đức hạnh» là thêm nghĩa; danto = người đã được điều phục (đúng cách đọc ở ja487:4.4, cùng cặp Pāli santiṁ puṇāti/puṇeti caraṇena danto), không phải «đức hạnh thuần hóa»; 6.2 và 6.3 dùng đúng cách dịch của ja487:4.2–4.3. 5.3: Pāli chỉ có maññāmi (tôi nghĩ), không có từ xưng vua; truyện dẫn (bản Anh Jātaka tập III, Francis–Neil 1897, chỉ để biết người nói) cho khổ này là lời Setaketu nói với vị tế sư, không phải vua, nên bỏ «Trẫm»; ja487:3.3 cùng Pāli còn «Trẫm», ngoài phạm vi bài này. Số Pāli: không có. Bất định: người nói ở 5.1–5.4 suy từ truyện dẫn, không đưa vào thân kinh. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại; technical_integrity giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
