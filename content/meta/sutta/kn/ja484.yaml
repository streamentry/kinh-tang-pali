notes: |-
  Đợt 19, làn 56. Dịch từ Pāli root commit đã ghim, đủ 75/75 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; vì vậy người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung kệ (xem bất định 6).

  **Tiêu đề.**
  - `0.2` `Pakiṇṇakanipāta` → “Bộ Tạp Tập” và `0.3` `Sālikedāravagga` → “Phẩm Ruộng Lúa”: dùng lại đúng cách của `ja490:0.2`, `ja490:0.3` (cùng bộ, cùng phẩm); tầng chưa có bài Pakiṇṇaka nào khác, nên tên bộ và tên phẩm vẫn chờ người điều phối quyết một lần.
  - `0.4` “1. Kinh Ruộng Lúa”: `sāli` (lúa) + `kedāra` (ruộng); khuôn “N. Kinh <tên>” theo `ja474:0.4`, `ja490:0.4`. Số `1.` ở `0.4` và `paṭhamaṁ` ở `18.1` đều là 1 ⇒ “thứ nhất” khớp; `18.1` “Kinh Ruộng Lúa, thứ nhất.” theo `ja474:14.1` (có dấu phẩy trước số thứ tự).

  **Pāli trùng nguyên văn trong chính bài (đã quét sau khi nén khoảng trắng): 75 khoá, 2 nhóm.**
  - `2.3` = `5.3` (“Bhutvā sāliṁ yathākāmaṁ,”): bản Việt giống hệt nhau “ăn lúa sāli tùy thích,” (0 lệch).
  - `7.6` = `12.4` (“evaṁ jānāhi kosiya”.”): bản Việt giống hệt nhau “hãy biết như thế, hỡi Kosiya”.” (0 lệch).
  Tổng cộng 2 nhóm, 0 nhóm lệch trong bản Việt.

  **Tiền lệ ngoài bài: đã dò 7 khoá có Pāli trùng nguyên văn với khoá đã dịch ở nơi khác trong tầng (`4.4`, `6.3`, `13.1`, `13.2`, `14.2`, `16.1`, `16.4`; tổng 16 cặp nguồn); dùng lại nguyên văn 4 khoá, 3 khoá khác bản có sẵn, có lý do.**
  - Dùng lại nguyên văn: `13.1` “Thật tốt lành thay con chim này,” và `13.2` “loài chim có giới hạnh tối thượng;” theo `ja384:2.1`, `ja384:2.2` (`ja236:1.1` dịch “Khéo là một con chim, bạn hiền,” là cách khác, 1/2 nguồn); `14.2` “cùng với toàn thể quyến thuộc bà con;” theo `ja398:7.2`, `ja399:7.2`, `ja429:9.2`, `ja430:9.2` (4/5 nguồn, `ja359:5.2` chỉ khác chữ hoa); `6.3` “được ta hỏi, này bạn, hãy nói:” theo `ja475:1.3`, `ja475:2.3`, `ja475:4.3` (3/4 nguồn; `ja400:8.3` dịch “Ta hỏi, bạn hãy nói cho ta,”).
  - Khác bản có sẵn, có lý do: `4.4` “tôi đã làm điều ác gì vậy”.” khác `ja439:1.4` “tôi đã làm điều ác gì?”.” chỉ ở dấu hỏi; chọn theo khuôn đã dùng ở `ja475:1.4` (“…gì vậy”.”) và `ja490:1.4` (cùng phẩm, kệ hỏi không dùng dấu hỏi vì Pāli không có). `16.1` “Hôm nay có điềm lành hiện đến với ta,” khác `ja391:5.1` ở ngôi (“tôi” → “ta”): người nói trong bài này là vị bà-la-môn Kosiya nói “ta” (`6.3`: “được ta hỏi”), không phải vị vua của `ja391`; `16.4` “ta sẽ làm các việc phước thiện không phải là ít”.” khác `ja378:2.4`, `ja391:5.4` (“trẫm sẽ làm …”) vì cùng lý do ngôi nói.

  **Số Pāli:** `eko` ở `2.1` → “một”; `eko` ở `4.3` → “chỉ mình”; `1.` và `paṭhamaṁ` = 1 → “thứ nhất”. Không có số lượng nào khác cần tính.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `suva` / `suvā` → “vẹt” (1.2, 5.2, 6.2, 14.3, 16.3): tầng có 0 tiền lệ cho dạng này với nghĩa chim vẹt (`ja429:2.2` `ja430:1.4` trùng chữ nhưng nghĩa khác, đã dịch “cây xoài”, một cách đọc khác của cùng từ trong bài ấy); chọn “vẹt” theo ngữ cảnh con chim ăn lúa. `suka` (`ja393:2.1`) giữ là tên riêng.
  - `kosiya` → giữ “Kosiya” (`ja130:1.4` “hỡi Kosiya”; 12 khoá chứa `kosiy-` trong `ja`, trong đó `ja226` dịch là “tên tắm” nghĩa chim cú/đồ vật, không phải tên người).
  - `brahme` (1.3) → “hỡi bà-la-môn”, theo `ja474:1.4`, `ja474:4.2`.
  - `sāli` → “lúa sāli” (tầng có `ja381:2.1`, `ja467:4.1` dịch “lúa”/“ruộng lúa”, 0 tiền lệ cho cách gọi riêng `sāli`); giữ Pāli `sāli` cho loại lúa để không làm phẳng thành “lúa” chung. `kedāra` → “ruộng” (`ja381:2.1`).
  - `Koṭasimbali` (7.4) → “Koṭasimbalī”: theo `ja412:0.4`, `ja412:2.4` (giữ tên riêng, dạng có `ī` dài).
  - `iṇa` → “nợ”; `iṇadāna` → “việc cho vay”, `iṇamokkha` → “việc trả nợ”, `muñcāmi`/`muñce` → “tôi trả (nợ)”, `dammi`/`dade` → “tôi cho (vay)”: tầng chỉ có 1 khoá (`ja469:5.3`) chứa `iṇ-` ở nghĩa “nợ”; đây là các lựa chọn theo Pāli, xem bất định 2.
  - `nidhi` / `nidhāna` → “kho báu”, “việc cất giữ kho báu”: 0 tiền lệ trong `ja`.
  - `dijo` / `dijānaṁ` (3.2, 13.2, 16.2) → “con chim”, “loài chim”: theo `ja384:2.2`; `ja223:2.3` dịch “người” cho `dijo`, nhưng ở đó nghĩa khác.
  - `paramadhammiko` (13.2) → “có giới hạnh tối thượng”: theo `ja384:2.2` (tầng có 5 khoá chứa `dhammiko`/`paramadhammiko`, đa số “chánh”/“phi pháp”; giữ cách đã dùng trong `ja384` vì Pāli trùng nguyên văn).
  - `dhammo` (13.4) → “lẽ phải”, không dịch “pháp” để khỏi lẫn với nghĩa kinh điển; xem bất định 4.
  - `nikkhittadaṇḍa` (15.3) → “những ai đã đặt gậy xuống”: theo `sn6.3:7.3` “đã đặt xuống gậy” (tầng có 1 khoá).
  - `mātāpitaro` + `jiṇṇe` / `bharassu` (15.4) → “phụng dưỡng cha mẹ già”: theo `vv75:4.3`, `vv76:4.3` (“phụng dưỡng cha mẹ già yếu”), `snp2.14:30.1`.
  - `vuddhā` / `jiṇṇakā` (10.1, 10.2) → “già yếu” / “cao tuổi”: tầng có 16 khoá chứa `vuddh-` (“già yếu”, “cao niên”, “bậc già”…); hai tính từ khác nhau nên dịch hai từ.
  - `puññatthiko` (11.3) → “vì cầu phước”: 0 tiền lệ.
  - `paṇḍitā` (11.4) → “các bậc trí”: tầng có 19 khoá chứa `paṇḍit-`, “hiền tri”/“trí giả” khác nhau; chọn “bậc trí” cho cách gọi chung.
  - `attamano udaggo` (17.1) → “vui lòng, phấn khởi”: `ja474:11.3` (“vui lòng”); `udagga` 0 tiền lệ trong `ja`.
  - `pasannacitto` (17.3) → “tâm tịnh tín”: đa số trong tầng (`an6.59:9.3`, `an9.20:8.7`, …).
  - `samaṇabrāhmaṇe` (17.4) → “các sa-môn và bà-la-môn”: theo `ja457:10.1`, `ja457:11.1`.
  - `vāḷapāsa` (3.1) → “dây bẫy bằng lông”: tầng có 1 khoá (`ja209:2.3`, ở dạng danh từ chỉ nghề, không giúp được).

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 10 dấu mở · 10 dấu đóng ở các khoá 1.1/2.4, 3.1/3.4, 4.1/4.4, 5.1/6.4, 7.1/7.6, 8.1/8.4, 9.1/12.4, 13.1/14.4, 15.1/15.4, 16.1/16.4; Việt cũng đúng 10/10 cặp, lệch 0/75 khoá. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0. `17.4` kết `cāti.` trong Pāli không có dấu mở nháy ở khổ 17, nên Việt không thêm nháy.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `sampannaṁ` (1.1): dịch “đã chín”; nghĩa rộng hơn là “đầy đủ, sung mãn”. Cách đọc “chín” theo ngữ cảnh lúa đang bị chim ăn.
  2. `Iṇaṁ muñcāmiṇaṁ dammi` (7.3), `muñce pubbakataṁ iṇaṁ` (10.4), `tasmā tesaṁ iṇaṁ dade` (9.4): dịch `iṇaṁ muñcāmi` là “tôi trả nợ” và `iṇaṁ dammi` / `dade` là “tôi cho vay”, đây là cách đọc của khổ 9–12 (nuôi con = cho vay, nuôi cha mẹ = trả nợ cũ). Thân kệ của Pāli root không nói rõ ai là chủ nợ; không thêm vào thân kinh.
  3. `Tesaṁ tuṇḍena hātūna` (10.3): dịch “dùng mỏ mang đến cho hai vị”; `hātūna` là dạng liên hệ với `harati` (mang đi); tân ngữ (thức ăn) không có trong Pāli nên không thêm. “hai vị” chỉ cha và mẹ (`mātā pitā`) ở 10.1.
  4. `ayaṁ dhammo na vijjati` (13.4): dịch “lẽ phải này không có”; `dhamma` ở đây có thể là “phẩm hạnh / bổn phận đúng đắn”; không chọn “pháp” để khỏi gán nghĩa giáo lý.
  5. `Nikkhittadaṇḍesu dadāhi dānaṁ` (15.3): “những ai đã đặt gậy xuống” là cách nói quen thuộc chỉ người/loài không dùng bạo lực; Pāli không nêu đối tượng cụ thể, bản dịch không nêu thêm.
  6. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1–2: người coi ruộng báo với bà-la-môn Kosiya (từ gọi `brahme`, `kosiya` ở 1.2–1.3); 3: Kosiya ra lệnh; 4: con vẹt; 5–6: Kosiya; 7: vẹt; 8: Kosiya; 9–12: vẹt; 13–14: Kosiya; 15: vẹt; 16: Kosiya; 17: lời kể. Đây là suy luận từ nội dung và từ gọi, không được ghi vào thân kinh.
  7. `Santappayi samaṇabrāhmaṇe cāti` (17.4): `ca` ở cuối dòng cùng `ti` kết thúc khổ; tôi coi `cāti` là kết thúc khổ và không dịch `ca` thành “cũng”, vì Pāli không nói rõ “cũng” (cùng với ai); có thể là chữ lấp vần.
  8. `vāḷapāsāni` (3.1): dịch “dây bẫy bằng lông” (`vāḷa` = lông); không có tiền lệ khớp trong tầng, giữ nghĩa sát chữ.

