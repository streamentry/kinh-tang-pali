  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (mục cũ nói không dùng bản Việt nguyên bài nào nay được thay bằng lượt này). Hai nhóm bất đồng nghĩa đã phân xử bằng Pāli và đều sửa: (1) 47.5 và 54.5 `dhammānudhammapaṭipattiyā`: trước 'thực hành đúng chánh pháp' (làm mất `anudhamma`), sau 'thực hành pháp và tùy pháp', vì Pāli là hợp từ dhamma + anudhamma và tầng đã dịch cụm này là 'thực hành pháp và tùy pháp' ở 16 khoá (mnd14, cnd21 và các bài khác); (2) 87.1, 87.2 và 88.1 `samatthañca paṭivijjhati`: trước 'thấu triệt năng lực', sau 'thấu triệt ý nghĩa của sự quân bình', vì chính Pāli ghim của ps1.3 (78.1–78.5, cùng công thức) giải thích `samaṁ` là sự quân bình của tâm và `attho` là ý nghĩa, và ps1.3 đã dịch như vậy; bất định 1 ở mục cũ nay đã giải quyết. Giữ bản dự án, bản nguyên bài khác Pāli hoặc chỉ khác cách diễn đạt: 13.3–13.11 và 15.3–16.4 (`-atthāya āvajjanāya` là 'vì mục đích hướng tâm', còn bản nguyên bài đọc như `-aṭṭhena`, 'theo ý nghĩa'); 41.1 (`ghanasaññā` là 'tưởng khối đặc', bản nguyên bài dịch 'tưởng về tiếp diễn'); 61.2 (`āyāpenti` giữ 'gắng sức', bản nguyên bài 'được thể hiện'; cnd23:18.27 và ps3.5:4.2 cùng dạng); 66.8 (`adhimatta`, `adhiṭṭhāna`, `patiṭṭhāpaka` là 'mạnh mẽ', 'kiên định', 'an lập', bản nguyên bài 'vượt trội', 'khẳng định', 'tạo lập'). Bất định mới, giữ cách dịch đã có: 3.9 `jhānavimokkhe` (bản dự án 'các thiền giải thoát', bản nguyên bài tách hai thành phần; Pāli cho phép cả hai); 103.1 `vipattisambhava`, `sampattisambhava` (bản dự án 'sự sinh khởi trong suy bại', bản nguyên bài 'đem lại sự bất hạnh'; vẫn 0 tiền lệ cho cả bốn hợp từ); 42.1, 73.x và 93.x `diṭṭhekaṭṭha`, `tadekaṭṭha` (bản dự án 'cùng một chỗ với', bản nguyên bài 'thuần về' và 'cùng ý nghĩa với', bất định 4 ở mục cũ vẫn còn). Các số đã khớp với bản nguyên bài và với Pāli: 15, 10, 4, 8 và 3 hạng người, 40, 25, 180, 20, 64 = 8 × 8, 14 trí Phật (8 chung và 6 riêng), 7, 8 và 10 phương diện của định, 9, 10 và 12 phương diện của tuệ quán, 50 phương diện, 1 đến 18 thế gian; bản nguyên bài không giải được hai điểm số đã nêu ở mục cũ (đếm các mệnh đề thoát ly chỉ được 97 so với 180, và 50) nên vẫn giữ nguyên văn Pāli. Bản nguyên bài là tổng hợp dài, nhiều đoạn rút gọn bằng dấu lược, nên các khối công thức lặp (1.4.2 đến 1.4.4) được so theo từng biến thể công thức chứ không so từng khoá; đối chiếu là ở mức đoạn, không phải mức khoá; không có bản Anh.
