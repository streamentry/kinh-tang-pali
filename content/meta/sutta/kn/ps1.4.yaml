  PĀLI TRÙNG NGUYÊN VĂN TRONG CHÍNH BÀI (đã đếm). Sau khi bỏ thẻ <b>, dấu câu, dấu lược và hạ chữ hoa, bỏ các khoá tiêu đề 0.x: 48 nhóm Pāli trùng, gồm 114 khoá, tương đương 91 cặp; cả 48 nhóm có bản Việt giống nhau về nghĩa và chữ (0 nhóm lệch), kể cả 7.4 so với 7.10 và 7.12 (`ime tayo puggalā bhāvitindriyā` ở 7.10 và 7.12 cùng dịch “ba hạng người này là người có các căn đã được tu tập”, khác 7.4 vì Pāli 7.4 không có chữ ime). Các khoá cùng công thức nhưng khác chỗ trống (tên căn, nhóm chi phần) khác nhau đúng ở chỗ đó và đã đối chiếu từng khoá.

  PĀLI TRÙNG NGUYÊN VĂN VỚI TẦNG ĐÃ DỊCH (đã dò). 79 khoá của bài có chuỗi Pāli trùng (chuẩn hoá như trên) ở tầng Việt của bài khác; 65 khoá trùng bản Việt đã có (sau chuẩn hoá dấu câu), 14 khoá khác có chủ ý: 44.5, 44.8, 44.11, 44.14, 44.17 (sn48.8 bỏ chữ `ca`, bài này dịch “Và này các tỳ-kheo …”), 44.6 và 44.10 (sn48.8 dịch “chi phần của nhập lưu” và “tấn căn”; ps tầng dùng “chi phần Dự lưu” và “tinh tấn căn”), 60.6 (ps3.5 “bốn thiền chứng”, đây “bốn thiền” theo sn48.8), 60.10 (ps3.5 “Ứng Cúng”, đây “A-la-hán”: tầng 340 khoá so với 3), 61.2 và 62.2 (ps3.5 dịch khác từ vựng cho cùng danh sách; đây dùng đúng danh sách thắng giải, nỗ lực, thiết lập, không tán loạn, thâu nhiếp, phát khởi, thanh tịnh của ps1.9 và ps3.3), 65.11 (“Tôn giả.” ở tầng, đây “đó là từ tôn giả” vì khoá là câu kết của gloss), 96.10 (khuôn khác dấu nháy), 104.8 (“Bốn loại thực:” ở tầng). Còn lại dùng lại nguyên văn, ví dụ 8.1 và 44.1 “Tại Sāvatthī.” (459/488 khoá), 66.1 “Dẫn nhập phần trước.” (ps1.8:1.1, ps2.2:1.1), 89.1 (ps1.0:55.1), 60.3–60.5, 60.7–60.9, 60.12, 61.1, 62.1 (ps3.5), 43.4 và 74.9 “Phần tụng thứ nhất/hai.” (ps1.10 cùng dạng “Phần tụng thứ …”).

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `ākāra` → “phương diện” (tầng 96/140 khoá có `ākārehi`, ps 71/71). `indriya` → “căn”; `vīriyindriya` → “tinh tấn căn” (tầng 54 khoá, bản “tấn căn” trần 26; ps 10 so với 4). `assaddhiya` “sự không tin” (tầng 8; “không tin” 10; “không có niềm tin” 12), `kosajja` “sự biếng nhác” (tầng 40/57; ps 18/19), `pamāda` “sự phóng dật” (485/724; ps 18/19), `uddhacca` “sự trạo cử” (123/251), `avijjā` “vô minh” (như ps1.10). `pariḷāha` “nhiệt não” (tầng 116; ps 5/5 cùng dạng). `assāda` “vị ngọt” (tầng 116 so với “sự thú vị” 37), `ādīnava` “sự nguy hại” (tầng 410; ps 7/7), `nissaraṇa` “sự thoát ly” (ps 37, “xuất ly” 23, “thoát khỏi” 3), `atthaṅgama` “sự diệt tận” (141 so với “chấm dứt” 139; sn48.6 và sn48.34 cùng dạng). `samudaya` của căn dịch “sự sinh khởi” (sn48.6, sn48.34; ps3.2:17.8 cũng “sự sinh khởi” cho `nirodhānupassanāya samudayassa`), còn `dukkhasamudaya` giữ “tập khởi của khổ” (ps 54 khoá), vì hai nghĩa khác nhau. `adhimokkha` “thắng giải” (ps 16/17), `paggaha` “nỗ lực” (ps 31/35), `upaṭṭhāna` “thiết lập” (ps 57/68; “an lập” dành cho `patiṭṭhāpeti`, ps 14/16), `avikkhepa` “không tán loạn” (ps 108/114), `dassana` “thấy”, `ādhipateyya` “làm chủ” (ps1.9, ps3.3), `saṁvara` “thu thúc”. `sotāpattiyaṅga` “chi phần Dự lưu” (tầng 38 khoá “chi phần” và 36 “Dự lưu”), `sotāpattimagga` “Dự lưu đạo” (ps 5/5), `ariyasacca` “Thánh đế” (207 so với “thánh đế” 57), `sammappadhāna` “chánh cần” (125). `pariyādiyati` “chấm dứt” (ps2.10:31.2; ps “chấm dứt” 7, “diệt trừ” 10, “làm cạn” 6). `adhiṭṭhāti`/`adhiṭṭhāna` “kiên định” (dn33:3.1.103 “kiên định tâm ấy”; tầng 58 khoá `adhiṭṭhāti`: “quyết định” 21, “an trú” 15, “kiên định” 4; ps3.10 dịch danh từ trong bộ ba `bhāvanā adhiṭṭhānaṁ jīvitaṁ` là “quyết tâm”, ps1.9 dịch `cittassa adhiṭṭhānāya` là “an định tâm”; ở đây dùng cho căn nên giữ một chữ). `parivajjayato … sevato bhajato payirupāsato` → “tránh xa … thân cận, giao du, hầu hạ” (iti104:2.8). `paccavekkhato` → “quán sát” (sn36.31). `muṭṭhassati`/`upaṭṭhitassati` → “thất niệm”/“có niệm hiện tiền” (dn34, dn33). `apparajakkha … paralokavajjabhayadassāvī` theo công thức Phật nhãn của dn14:3.6.2 và mn85:45.2 (“ít bụi trong mắt”, “căn sắc bén”, “phẩm chất tốt”, “dễ dạy”). `samantacakkhu` → “bậc nhìn khắp” ở kệ (thag21.1:57.2, cnd4:3.1) và “mắt nhìn khắp” ở phần gloss (vì `yaṁ samantacakkhu taṁ paññindriyaṁ` là danh từ trung tính). `sampahaṁsana` “làm vui tâm” (an6.85). `samathanimitta`/`paggahanimitta` “tướng của chỉ”/“tướng của nỗ lực” (dn33:1.9.27). Danh sách các quán (`aniccānupassanā …`): “quán vô thường, khổ, vô ngã, nhàm chán, ly tham, đoạn diệt, xả bỏ” theo ps3.2:17.2–17.9 và ps2.9:21; các quán còn lại (`khaya`, `vaya`, `vipariṇāma`, `animitta`, `appaṇihita`, `suññatā`, `adhipaññādhamma`, `yathābhūtañāṇadassana`, `ādīnava`, `paṭisaṅkhā`, `vivaṭṭanā`) theo ps1.0:6.1 (“biến hoại”), ps2.10:14.10 (“quán sự quay đi”), ps2.10 (“trống rỗng”) hoặc tự dịch sát chữ khi không có tiền lệ. `tadanuvattakakilesehi ca khandhehi ca … bahiddhā ca sabbanimittehi` → “các phiền não đi theo điều ấy và các uẩn … mọi tướng ở bên ngoài” (ps2.5:1.3, 5.2, 7.2, cùng cấu tạo 3/3). Thẻ <b>…</b> ở 38 khoá không đưa sang bản Việt; chỗ Pāli kết bằng `ti` được chuyển thành “X nghĩa là:” theo ps3.5 và ps3.10 (không dùng nháy vì Pāli không có nháy đơn).

  TÊN VÀ TIÊU ĐỀ. `:0.1` giữ Pāli “Paṭisambhidāmagga”, `:0.2` giữ Pāli “Mahāvagga” (bỏ chữ số “1”, như ps1.0, ps1.1, ps1.6–ps1.10), `:0.3` “1.4. Luận Bàn Về Căn” theo khuôn “Luận Bàn Về …”. Tiêu đề phần: “Phần Giải Thích Bài Kinh Thứ Nhất/Hai/Ba/Tư” theo ps2.2:2.0; `1.0` giữ đúng dạng Pāli không có dấu chấm sau “1.4.1”.

