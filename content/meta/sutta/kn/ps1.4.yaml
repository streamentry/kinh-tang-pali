  CẤU TRÚC BÀI (Indriyakathā, năm căn). 1.4.1 (1–7): kinh `Pañcimāni indriyāni`, hỏi đáp về năm căn: thanh tịnh bằng 15 phương diện (3 cho mỗi căn: tránh người đối nghịch, thân cận người thuận, quán sát một đề tài), tu tập bằng 10, khéo tu tập bằng 10, bốn thời điểm đạo–quả, tám hạng người tu tập căn và ba hạng người có căn đã tu tập. 1.4.2 (8–43): sa-môn Bà-la-môn không biết sự sinh khởi, diệt tận, vị ngọt, nguy hại, thoát ly của năm căn; sinh khởi bằng 40, diệt tận bằng 40, vị ngọt bằng 25, nguy hại bằng 25, thoát ly bằng 180 phương diện. 1.4.3 (44–65): kinh `Kattha ca saddhindriyaṁ daṭṭhabbaṁ`, bốn nhóm 4 × 5 = 20 phương diện thấy các căn (bốn chi phần Dự lưu, bốn chánh cần, bốn niệm xứ, bốn thiền, bốn Thánh đế), phần hành (cariyā), phần hành và trú (cāra–vihāra) với tám loại hành ba lần và các gloss. 1.4.4 (66–77): sáu ý nghĩa thấy các căn (làm chủ, làm thanh tịnh từ đầu, mạnh mẽ, kiên định, chấm dứt, an lập). 1.4.5 (78–105): hội tụ các căn, ba căn cuối của bậc học–vô học (tám nhóm tám = 64), bốn lậu hoặc, Phật nhãn và bậc nhìn khắp, 20 cách các căn nương nhau, năm cách thấy chúng sinh, thế gian (12 cách đếm), lỗi lầm; hết phần tụng thứ ba và hết bài.

