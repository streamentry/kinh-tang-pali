    1. `samatthañca paṭivijjhati` (87.1–88.1): `samattha` dịch “năng lực” (nghĩa “có khả năng”, như mil2:18.2 `samatthaṁ`), cách đọc khác là `sama + attha` “ý nghĩa đồng đẳng”; không có tầng Anh để phân xử.
    2. `asītisataṁ ākārehi` (12.9–12.10, 30.1–30.2, 43.1–43.2) giữ 180 theo cấu tạo `asīti` + `sata`; đếm các mệnh đề `nissaṭa` ở 31.1–42.1 chỉ được 97 (25 + 8 + 14 + 4 + 8 + 7 + 8 + 13 + 5 + 5), không khớp 180 và không tái lập được con số; giữ nguyên văn, không chữa. `paññāsāya` 50 (105.3) cũng không đếm lại được.
    3. 36.1–38.1: `pañcahindriyehi` đọc theo cách xuất xứ (“thoát ly khỏi năm căn”), đồng nhất với cấu trúc `nissaṭa` + cách xuất xứ ở 31.1 và 39.1; `samāpattiyā`, `anupassanāya` đọc theo cách vị trí (“ở …”). Cách đọc khác: cách công cụ (“bằng năm căn”) hoặc cả hai đều xuất xứ.
    4. `diṭṭhekaṭṭha`, `tadekaṭṭha` (42.1, 73.3, 73.11, 73.23, 93.7–93.9) dịch “cùng một chỗ với tà kiến”, “cùng một chỗ với nó”; không có tiền lệ ở tầng (0 khoá `diṭṭhekaṭṭh`), cách đọc khác “đồng loại”, “cùng một đối tượng”.
    5. `āyāpenti` (61.2) dịch “gắng sức”, đã so với ps3.5:4.2 “được đưa đến”; ở đây vế sau `āyatanacariyā` được hiểu theo lối chơi chữ `āyatana`–`āyatanti`, không thêm vào thân kinh.
    6. `vipattibhava`, `vipattisambhava`, `sampattibhava`, `sampattisambhava` (103.1) dịch “sự hiện hữu trong suy bại”, “sự sinh khởi trong suy bại”, “sự hiện hữu trong hưng thịnh”, “sự sinh khởi trong hưng thịnh”; 0 tiền lệ ở tầng.
    7. `patiṭṭhāpeti` (77.2–77.11): chủ ngữ của câu thứ hai (`saddhassa saddhindriyaṁ … patiṭṭhāpeti`, `yogāvacarassa pañcindriyāni … patiṭṭhāpenti`) là các căn, tân ngữ ngầm; giữ nguyên không thêm tân ngữ, cách đọc khác “các căn an lập người ấy”.
    8. `sayaṁ bhūtaṭṭhena` (7.9) “do ý nghĩa tự mình trở thành”; `appameyyaṭṭhena` “do ý nghĩa không thể đo lường”; `savanena buddho` “bậc giác ngộ nhờ lắng nghe”.
    9. Bốn từ đồng nghĩa trong gloss `addhā` (65.8): `niyoga` “nhất định”, `avatthāpana` “xác quyết” (0 tiền lệ); các từ `ekuddesa`, `samasikkhatā` (65.5) dịch sát chữ.
    10. `anupaṭṭhānakusala` dịch “thiện xảo trong sự không thiết lập”, và hai vế `upaṭṭhāna`/`anupaṭṭhāna` ở 84.x–86.x đi theo “theo cách …” cho `-to`; 84.6 và 84.7 `āyūhanānupaṭṭhāna`, `vipariṇāmūpaṭṭhāna` giữ đúng cấu tạo Pāli (không có `-to`).
    11. `abhisandana`, `pavattasantatādhipateyya`, `niyyānika`, `apacayagāmī` (91.1–92.3) dịch “sự thấm nhuần”, “sự làm chủ dòng tương tục đang vận hành”, “đưa đến giải thoát”, “đi đến sự tiêu giảm”; 0 tiền lệ ở tầng.
    12. `adhipaññādhammavipassanā` “tuệ quán các pháp tăng thượng tuệ”; `sārādānābhinivesa` “sự chấp trước do nắm lấy cái cốt lõi”; `ālayābhinivesa` “sự chấp trước do bám víu”; `khayānupassanā` “quán sự tiêu tận”, `vayānupassanā` “quán sự hoại diệt”; 0 tiền lệ cho các hợp từ này.
    13. `pubbabhāga` (36.1) “giai đoạn sơ khởi”; `ekattupaṭṭhāna`, `ekattaanupaṭṭhāna` “sự thiết lập tính đồng nhất”, “sự không thiết lập tính đồng nhất” (13–16; `ekatta` “tính đồng nhất” theo ps2.3:29.1); khoá 15.3 có chữ `vasena` thừa ở vế cuối so với 15.4–15.7 và được giữ nguyên.
    14. `puthujjanakalyāṇaka` (7.6) “phàm phu thiện”; 0 tiền lệ ở tầng cho dạng này.
    15. 59.1: `okappeyyuṁ` dịch “sẽ tin chắc” theo gloss 65.7 (`saddaheyyuṁ adhimucceyyuṁ`); `yathācarantaṁ yathāviharantaṁ` được đọc là tân ngữ “người hành như thế nào, trú như thế nào”.

