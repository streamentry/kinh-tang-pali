notes: |-
  Đã đọc HẾT Pāli lát qua v5/p5.txt trước khi viết. Không segment nào của lát này có …pe… nên hai phía đều 0 dấu lược. Mọi dấu nháy kép đều cân trên cả bài.
  Phẩm Littavagga → Phẩm Những Điều Nhỏ: 0 tiền lệ cho tên phẩm này (ja1 Phẩm Bụi Dơ, ja12 Phẩm Giới, ja21 Phẩm Nai Bốn Sừng, ja101/106/107 Phẩm Parosata); litta = nhỏ, bé, ngắn, mà Pāli không nói cái gì nhỏ nên dịch theo nghĩa chữ, không gắn vào con vật nào. Giữ Jātaka và Bộ Một Bài Kinh theo ja1, ja12; 0.1 và 0.2 ngắn hơn 40 ký tự nên chốt không kiểm trùng Pāli, nhưng tầng đã có tiền lệ dùng nguyên văn Jātaka.

  Tên kinh giữ nguyên dạng Pāli kèm hậu tố -jātaka cho 5 bài, theo đúng tiền lệ ja106 (Kinh Udañcanījātaka) và ja107 (Kinh Sālittakajātaka): vì là tên riêng của câu chuyện mà nghĩa cụm không chắc trong chức năng tên, thì dịch nghĩa sẽ là bịa. Mahāsāra, Visāsabhojana, Lomahaṃsa, Nāmasiddhi, Kūṭavāṇija đều thuộc loại đó. Chốt lọt_pāli của _hvi.py cũng chặn dạng rút gọn không trùng (Mahāsāra, Nāmasiddhi, Kūṭavāṇija) vì chưa có trong tầng Việt và không trùng từ nào của Pāli khoá đó.
  Tiền lệ có đếm: dhanapāla → tên canh giữ của cải (gìn giữ của cải, an5.33); duggata
  → vận rủi (4); punarāgata → quay trở lại (trở lại 289, quay lại 39); jīvaka → sinh
  vật (0 tiền lệ riêng cho jīvaka, đặt mới theo nghĩa chữ); pāpaka → kẻ ác (0 tiền
  lệ riêng, đặt mới).
  0 tiền lệ, đặt mới: panthaka → kẻ mở đường. Vì chữ có hậu tố tác nhân -ka và
  panthā là lối đi, kẻ mở đường giữ đúng nghĩa làm đường cho kẻ khác (Pāli hay dùng
  cho chuột); dịch kẻ đi đường sẽ mất mốt đó, nên chọn kẻ mở đường và giữ mūḷha là
  lạc.
  Ba vế đầu là một liệt kê ba người bị xem là điều xấu; vế 1.4 mới là nhân vật
  pāpako quay lại. Đã giữ đúng ba chủ thể và số ba, không gộp thành một.

  Kiểm toán 2026-10-15 (kiểm toán Jātaka chỉ có Pāli), Claude Sonnet 5.5 (Claude Code): Sửa 4/4 khoá kệ. Jīvaka, Dhanapāla, Panthaka, Pāpaka là bốn tên riêng (bài Nāmasiddhi: được tên mà không hợp với số phận); bản cũ dịch nghĩa chữ ("sinh vật", "tên canh giữ của cải", "kẻ mở đường", "kẻ ác") làm mất chủ đề của bài. duggataṁ = nghèo khổ, mūḷhaṁ = lạc/mê lầm. Tên phẩm Littavagga (khoá 0.3) đổi "Phẩm Những Điều Nhỏ" thành "Phẩm Litta" cho thống nhất với ja91; tên phẩm lấy từ tên bài đầu (Litta), bản cũ không có căn cứ Pāli. Chú giải Jātaka xác nhận. Không có bản Anh Sujato.

  Quyết định hội đồng biên tập 2026-10-16: C1 — :0.4, :2.1, translationTitle (bỏ đuôi jātaka, giữ phiên âm tên riêng); C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
