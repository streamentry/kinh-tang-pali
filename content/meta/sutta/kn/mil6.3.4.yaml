  **Số Pāli, tự tính.** `catunnaṁ petānaṁ tayo petā` = bốn hạng ngạ quỷ, ba hạng không nhận được; ba hạng được kể tên ở khoá `1.4` là `vantāsikā`, `khuppipāsino`, `nijjhāmataṇhikā` (đủ 3), nên hạng còn lại `paradattūpajīvino` là hạng thứ tư, 4 − 3 = 1, là hạng nhận được. `ekaṁ udakabindu` = một giọt nước (`7.2`). `dasapi dvādasapi yojanāni` = mười hay mười hai do-tuần, dasa 10 và dvādasa 12 (`7.2`, `8.2`). `Vassasatepi` = vassa 1 × sata 100 = một trăm năm (`10.3`). `ekena desena … ekena` = một phía … một phía (`10.1`). Không có cụm số nào chưa phân xử được.

  **Tiền lệ (đếm trên tầng vi hiện có, loại tệp này).**
  Pāli trùng nguyên văn với nơi khác trong tầng: đã dò 12 khoá có Pāli trùng (`0.1`, `0.2`, `0.3`, `2.11`, `3.3`, `5.2`, `5.5`, `5.8`, `7.1`, `7.4`, `8.3`, `11.4`), tổng 423 cặp (gộp theo nhóm), 108 cặp bản Việt khác bản của tôi. Dùng lại nguyên văn: `Milindapañha` (216 trong 227), `Anumānapañha` → `Câu hỏi về suy luận` (19 trong 25), `Vessantaravagga` → `Phẩm Vessantara` (7/7), `(…)` giữ (12 trong 15, 3 chỗ là `…`), `Na hi, bhante` → `Không phải vậy, thưa tôn giả` (41 trong 58), `Opammaṁ karohi` → `Xin hãy xét một thí dụ` (18 trong 33, cùng nghĩa với 9 dạng `Hãy xét một thí dụ`). Cố ý khác tiền lệ, ghi lại để biên tập xem lại: (a) `3.3` `Na hi, mahārājā` → `Không phải vậy, này Đại vương`: đa số 7/11 là `Không có, này Đại vương`; chọn `Không phải vậy` để giữ `na hi` cùng một cách dịch với `5.2`, `5.5`, `5.8` trong bài, và vì câu hỏi ở `3.2` hỏi quả báo có đến hay không chứ không hỏi sự hiện hữu; (b) `7.4`, `8.3` `Kena kāraṇena, mahārājā` → `Vì lý do gì, này Đại vương?`: 6/8 tiền lệ là `tâu đại vương` nhưng cả bài dùng `này Đại vương`, đổi lẻ một khoá sẽ vỡ nhất quán trong bài; (c) `11.4` `Sādhu, bhante nāgasena, evametaṁ tathā sampaṭicchāmi` → `Lành thay, thưa tôn giả Nāgasena, đúng là như vậy, tôi xin kính nhận`: cả 39 tiền lệ đều khác bản của tôi (dạng phổ biến nhất là `Lành thay, thưa ngài Nāgasena, đúng là như vậy, trẫm xin kính nhận`, 17 trên 39), nhưng vua tự xưng `tôi` xuyên suốt bài này theo phạm vi gần nhất (`mil6.3.*` loại bài này: `tôi` 20, `ta` 10, `trẫm` 5; đếm thô theo từ), nên giữ `tôi` cho thống nhất.
  Văn xưng đo ở hai phạm vi: `bhante nāgasena` → `thưa tôn giả Nāgasena` (`mil6.3.*` 37 so với `thưa ngài` 4 và `Bạch ngài` 2; toàn `mil` 218 so với `Bạch ngài` 127 và `thưa ngài` 57 ⇒ cùng hướng). `mahārāja` → `này Đại vương`: toàn `mil` 792 so với `tâu đại vương` 511 và `thưa đại vương` 272; ở `mil6.*` theo từng bài `này` trội ở 15 bài, `tâu` 6, `thưa` 4; nhưng ở `mil6.3.*` theo khoá thì `thưa đại vương` 63 so với `này Đại vương` 31 và `tâu đại vương` 11 (do `mil6.3.5`, `mil6.3.11`, `mil6.3.12` dùng `thưa`). Hai phạm vi cho đa số khác nhau; chọn `này Đại vương` theo toàn `mil`, theo đa số bài của `mil6`, và theo `mil6.3.3` cùng nhóm câu hỏi; khi Nāgasena nói với vua thì không đổi giữa bài.
  Thuật ngữ: `dāyaka` → `người bố thí` (toàn tầng: `người cho` 29, `người cúng` 21, `người bố thí` 20, `thí chủ` 3, và 22 khoá dùng cả `thí chủ` lẫn `người bố thí`; chọn `người bố thí` vì đi liền `dānaṁ datvā`, còn `người cho` dễ lẫn với động từ `cho`). `pubbapeta` → `người quá cố` (`mn97:12.1`, `12.2`, `22.1`, `22.3`, `22.4`…: 7 trên 16 khoá có từ này, `người đã khuất` 1); `peta` trong bốn hạng ở `1.4` → `ngạ quỷ` (`pettivisaya` → `ngạ quỷ` 91 trên 109 khoá). `ādisati` (hồi hướng) → `hồi hướng` (`dn16:1.31.7`, `ud8.6:23.2`; không có tiền lệ nào ngược). `tiracchānayoni` → `loài súc sinh` (toàn tầng `súc sinh` 51 và `súc sanh` 26 so với `bàng sinh` 12 và `bàng sanh` 13; `mil` 0 khoá). `vipāka` → `quả báo`. `uposatha` → `bố-tát` (15 so với `trai giới` 11 và `uposatha` 7). `yojana` → `do-tuần` (toàn tầng 31 so với `do tuần` 6 và `yojana` 6; `mil` 7/2/4). `Gaṅgā` → `sông Hằng` (67 so với `sông Gaṅgā` 60). `mahāsamudda` → `biển lớn` (82 so với `biển cả` 28 và `đại dương` 18). `pokkharaṇī` → `hồ sen` (76 trên 109 khoá, kể cả khoá có cả `ao`). `kassaka` → `nông dân` (10 trên 14). `luddo lohitapāṇi` → `hung bạo, tay vấy máu` (`mn86`, `mn41`…: 7 trên 17 khoá, `tay dính máu` 5). `paduṭṭhamanasaṅkappa` → `ý nghĩ độc hại` (`mn42`, `mn114`; 2 trên 18, cùng `ý định độc hại` 2 và `ý nghĩ ác` 2). `otāraṁ labhati` → `tìm được kẽ hở` (`mn119`…: 8 trên 25 khoá; `chỗ xâm nhập` 5, `cơ hội` 4). `uddhammukhā` → `chảy ngược lên` (`mil5.1.5:10.3`, 1 khoá). `khajjaka` → `bánh` (`an5.273-285:8.1` `bánh ăn`, `tha-ap165:1.4` `bánh ngọt`). `upāyana` → `lễ vật` (`mil6.1.2:5.1`, `5.2`, `5.3`; `cp5:2.2`). `sāmika` → `chủ nhân` (`mn54:20.5`; ở các khoá nghĩa chồng thì không áp dụng). `haṭṭho pahaṭṭho` → `vui tươi, hớn hở` (`mn89:12.10`, `12.13` có `vui tươi phấn khởi`); `vedajāta` → `tràn ngập xúc động` (`tha-ap317:3.2` `tràn ngập nỗi xúc động hoan hỷ`; `snp5.1:20.2` dịch `cảm thấy phấn chấn`). `saññāpehi` → `làm cho tôi hiểu`: toàn tầng 38 khoá, đa số dịch `thuyết phục` (24 trên 38) nhưng đó là bối