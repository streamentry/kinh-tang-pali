  **Đặt mới hoặc 0 tiền lệ, có lý do từ Pāli:** `vantāsika` → `ăn đồ nôn mửa`, `khuppipāsī` → `đói khát`, `nijjhāmataṇhika` → `bị khát ái thiêu đốt`, `paradattūpajīvī` → `sống nhờ vật người khác cho` (theo `paradattavutta` ở `mn89:12.10`): bốn dạng này không có Việt nào trong tầng, `nijjhāmataṇhika` chỉ có ở `mil6.3.4`, `mil6.3.6`, `mil6.4.2`. `paṭilīyati paṭikuṭati paṭivattati na sampasārīyati` → `co lại, rúm lại, quay lui, không giãn ra`: trong phần sutta của cây Pāli root đã ghim, `paṭilīyati` chỉ có ở một tệp (bài này) nên 0 tiền lệ; `tappati` → `bứt rứt`, `socati` → `sầu muộn`, `hāyati khīyati` → `suy giảm, hao mòn`, `pariyādiyati` → `tiêu hết`. `sobbha sara sarita sākhā kandara padara daha taḷāka udapāna pokkharaṇī` (`8.2`) → `hố nước, ao, sông, nhánh sông, khe núi, hẻm núi, đầm, hồ, giếng, hồ sen`: một dãy mười từ không có tiền lệ nguyên cụm (`mil6.1.9:3.1` và `mil7.7.6:5.1` có dãy tương tự nhưng dịch khác và lược bớt), nên gán mỗi từ một chữ riêng, không gộp. `udakanibbāhana` → `mương dẫn nước` (0 tiền lệ); `gabbha` → `gian phòng trong` (0 tiền lệ). `ghanamahāselapabbata` → `ngọn núi đá lớn, liền khối`. `vihesāpekkho` → `muốn quấy nhiễu`.

  **Bất định đã phân xử, ghi lại để biên tập xem lại.**
  (1) `kattāraṁyeva pariyādiyati` (`6.3`, `7.6`): `akusalaṁ` là chủ ngữ, `kattāraṁyeva` có thể là bổ ngữ của một động từ ngoại động (`chỉ làm hao mòn chính người làm`) hoặc chỉ chỗ tiêu tận của một động từ nội động (`chỉ tiêu hết nơi chính người làm`). `7.3` (`tattheva pariyādiyati`, giọt nước) và `11.1`–`11.3` (`tattheva pariyādiyati`) đều là nội động, và vế đối `kusalaṁ sadevakaṁ lokaṁ ajjhottharati` ở `6.3` là ngoại động; bản dịch chọn nội động cho thống nhất với các khoá `tattheva` và với kết luận `na sakkā saṁvibhajituṁ`, nhưng cách đọc ngoại động cũng có thể.
  (2) `pubbapetā`: dịch `người quá cố` theo `mn97`; trong cùng bài `petā` ở `1.4` là `ngạ quỷ` (bốn hạng). Nếu muốn phân biệt, nhan đề `Pubbapetādisapañha` có thể đọc là hồi hướng cho thân quyến đã mất từ trước; bản dịch không thêm chữ `thân quyến` vì Pāli không nói.
  (3) `2.7` `asati purato nikkhamanamukhe kena nikkhameyya`: dịch `ở phía trước không có lối ra; vậy người ấy sẽ ra bằng cách nào?` và đáp `Chỉ bằng chính lối đã vào` (`2.8` `Paviṭṭheneva`). Chữ `purato` (phía trước) được giữ; không thêm `nào khác`.
  (4) `4.2` `tampi maṁ tvaṁ pucchissasi`: đọc là hệ quả (`nếu vậy … Đại vương cũng sẽ hỏi tôi`), và `dvipadā` áp cho cả `manussā ca dijā ca` (`những người này và loài chim là loài hai chân`), `migā catuppadā` là thú bốn chân. Đây là bộ ba câu hỏi vô lý kinh điển ở `mil`, không có tiền lệ trong tầng.
  (5) `4.3` `‘kinti te otāraṁ na labheyyun’ti`: `te` là `bahū manussā … vāmagāmino vicakkhukā`; Pāli không nói họ tìm kẽ hở ở đâu hay để làm gì nên bản dịch giữ nguyên `tìm được kẽ hở`, không thêm `để công kích`. `vicakkhukā` dịch `mù lòa` (nghĩa đen `không có mắt`), `vāmagāmino` dịch `đi theo đường lệch lạc`; không thêm nghĩa bóng.
  (6) `4.4` `saha akatena ananumatena saha pāpaṁ kammaṁ saṁvibhajituṁ`: chữ `saha` lặp hai lần; dịch một lần `chia sẻ nghiệp ác với người không làm và không tán thành`. `ananumata` dịch `không tán thành` (0 tiền lệ).
  (7) `5.1` `udakanibbāhanena` và `nibbāhanena` là cùng một từ dùng hai lần; dịch `mương dẫn nước` và `mương ấy`, giữ phép so sánh (nước dời được bằng mương, núi thì không).
  (8) `3.1`–`3.2`: Pāli `3.1` là mệnh đề `yadi` kết bằng dấu chấm, câu hỏi nằm ở `3.2` (`Tena hi …`); bản dịch nối bằng dấu chấm phẩy để giữ cả hai khoá thành một câu hỏi, không đổi ranh giới khoá.
  (9) `1.4` `saramānāyeva`: đối tượng của `nhớ` không được nêu, bản dịch để trống (`khi họ nhớ`); không thêm `việc hồi hướng` hay `người thân`.
  (10) `10.3` `Vassasatepi ce`: đọc là vị trí thời gian (`dù trong một trăm năm`); cách đọc khác là `dù sau một trăm năm`.
  (11) `2.10` Pāli kết `vilomemāti.` không có dấu đóng nháy, và `2.11` là `(…)`; lời vua tiếp tục ở `3.1`. Giữ đúng cấu trúc, không thêm dấu.

  **Lỗi bản nháp đã bắt:** phép nháy bắt được ba khoá bản nháp đầu thiếu dấu mở `“` ở đầu lời thoại tiếp nối (`4.4`, `7.6`, `9.2`); sửa theo Pāli từng khoá. Bản nháp đầu viết `vui tươi hớn hở, tươi cười` (lặp `tươi`), đã đổi thành `vui tươi, hớn hở, mỉm cười`. Lần đọc đầu bản làm việc, tôi đã nhầm `4.4`, `7.6`, `9.2` là khoá không có nháy mở; phép đo đối chiếu Pāli từng khoá cho thấy cả ba đều có.

  `technical_integrity` 9.6 vì lát này không được chạy cổng. Bốn lệnh còn lại do coordinator chạy trước khi publish: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
