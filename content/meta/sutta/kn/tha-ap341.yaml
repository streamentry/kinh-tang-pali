notes: |-
  Bản dịch chỉ từ Pāli root, 76/76 khoá, đúng thứ tự Pāli. Không có tầng English hay Việt tham khảo nào cho bài này, nên bài giữ draft vì blocker tầng tham khảo, không vì chất lượng câu chữ. Bài kể một đạo sĩ bện tóc bay giữa trời bị chặn lại phía trên Đức Phật Padumuttara, nghe Ngài nói về vô thường, rồi đời sau nghe lại bài kệ `Aniccā vata saṅkhārā` mà đắc A-la-hán lúc bảy tuổi.

  CÔNG THỨC DÙNG LẠI NGUYÊN VĂN. Trong tầng tha-ap đã dịch (lấy bản Việt hiện có trên đĩa, trừ chính bài này) có 29 khoá Pāli trùng nguyên văn với khoá của bài này; 21 khoá dùng lại y hệt bản Việt sẵn có, 8 khoá khác (liệt kê dưới đây, mỗi chỗ có lý do). Một cặp trùng trong chính bài: 14.4 và 15.2 (`arahattamapāpuṇiṁ`, chỉ khác dấu cuối `.` / `;`), cùng một bản Việt `tôi đã đạt tới bậc A-la-hán` (2 khoá trong tầng). Giữ nguyên các công thức quen: `Đức Chiến Thắng tên Padumuttara,` (7), `bậc đã vượt qua mọi pháp;` (3), `ngay tại nơi ấy tôi đã mệnh chung.` (10), `Nhờ nghiệp lành khéo làm ấy,` (15), `tôi đã đến cõi trời Ba mươi ba.` (ngôi thứ nhất theo cả bài), `tôi đã hưởng thọ ở cõi trời;` (3), `tôi làm ra vương quyền nơi chư thiên.` (2), `tôi từng làm Chuyển Luân Vương;` (8), `Vương quốc rộng lớn ấy,` (10), `đếm không hết, vô tận.` (5), `Vào một trăm ngàn đại kiếp trước,` (19), `Tôi không còn biết đến đọa xứ nào,` (85, so với `Ta không biết mình rơi vào khổ đau` 135 là hình ngôi `ta`), `Bốn vô ngại giải,` (460), `…pe…` thành đúng một `…` (621), `đã làm tròn lời dạy của Đức Phật”.` (432), `lên bảy tuổi kể từ khi sinh ra,` (4), `ngồi trong một lần ngồi,` (1), `đã sinh ra rồi chấm dứt,` (1, tha-ap21), `bản chất là sinh, diệt;` (1, tha-ap21). Dòng kết dùng nhóm `Tôi nghe như vầy: Tôn giả Trưởng lão … đã nói những bài kệ này.` (số nhiều, 407 khoá; nhóm số ít `đã từng nói bài kệ này` 21 khoá không dùng).
  Chữ hoa đầu dòng 3 của mỗi tứ kệ: Pāli viết hoa (vd `Jātiyā`, `Uppajjitvā`, `Ekāsane`); đo trong tầng tha-ap, khi Pāli dòng 3 viết hoa thì Việt viết hoa 1.843 khoá, viết thường 578 khoá. Bài này viết hoa theo Pāli riêng ba khoá 13.3, 14.3, 15.1 giữ đúng chữ thường của tiền lệ để dùng lại nguyên văn.

  CHỖ KHÁC TIỀN LỆ (8 khoá) VÀ LÝ DO.
  (1) `:9.3` `Ekapaññāsakkhattuñca` — tiền lệ duy nhất (tha-ap428:6.1) viết `Lại thêm năm mươi lần nữa,`; Pāli là eka 1 + paññāsa 50 = 51, nên dịch `Và năm mươi mốt lần,` (bản kia thiếu một lần). Dòng liền trước ở tha-ap428:5.3 là `Paññāsakkhattuṁ` = 50, tức hai số khác nhau; tha-ap428:6.1 cần xem lại, ngoài lát này, chỉ báo.
  (2) `:11.2` `samaṇo bhāvitindriyo;` — tiền lệ (tha-ap189:8.2) `một bậc Sa-môn đã trau tập các căn;`; ở đây `một vị sa-môn đã tu tập các căn;` theo tha-ap256:1.4 (`tu tập các căn`) và theo cách viết thường `sa-môn` của tầng.
  (3) `:11.4` `aniccatamudāhari` — tiền lệ duy nhất (tha-ap21:3.4) `bèn tuyên ngợ về vô thường.` dùng chữ `tuyên ngợ` (không có gốc nghĩa; cùng họ với lỗi chính tả `Tuyên Ngợ` ở tên bài). Dịch `vị ấy đã nói lên tính vô thường.`; `aniccatā` là tính vô thường nên giữ `tính`, và `udāhari` là động từ quá khứ nên đứng một mình, chủ ngữ là vị sa-môn ở 11.2.
  (4) `:13.3`, `:14.3`, `:15.1` — chỉ khác chữ hoa đầu dòng, xem mục trên.
  (5) `:14.2` `pubbakammaṁ anussariṁ;` — tiền lệ (tha-ap416:6.2) `ta nhớ lại việc làm trước đời;`. Theo `Pubbakammaṁ saritvāna` → `Nhớ lại nghiệp quá khứ,` (2 khoá, tha-ap190) nên dịch `tôi nhớ lại nghiệp quá khứ;`, ngôi `tôi` theo cả bài.
  (6) `:16.4` `sakyaputtassa sāsane.` — tiền lệ `trong giáo pháp của Đức Phật.` (2 khoá trong tầng tha-ap, thêm thi-ap16:6.4). Giữ nguyên chữ của tiền lệ nhưng cuối là `?` vì `Kiṁ me karaṇīyaṁ ajja` (16.3) là câu hỏi; hai khoá còn lại không đứng sau một từ nghi vấn. Danh hiệu `sakyaputta` (người con dòng Sakya) tiêu chuẩn tầng quy về `Đức Phật`; bản Việt vì vậy không giữ chữ `con dòng Sakya`, xem bất định (g).
  Ngoài ra, các khoá không trùng nguyên văn nhưng có tiền lệ gần: `:1.3` `Catusaccaṁ pakāsento` — tầng có `bốn sự thật` (2), `bốn chân lý` (2), `Bốn Thánh Đế` (1); chọn `bốn chân lý` vì Pāli không có `ariya`. `:2.2` theo cp17:1.2 (`đạo sĩ bện tóc tu tập khổ hạnh mãnh liệt`). `:15.3` `upasampādayi` → `cho thọ cụ túc giới`, theo `thọ cụ túc giới` của snp3.6. `:12.4` `nibbānaṁ accutaṁ padaṁ` → `Niết-bàn, cảnh giới bất hoại`, theo thig5.7:1.4 (`cảnh giới bất hoại không đổi dời`) và snp1.11:12.4 (`trạng thái không hoại diệt`). `:13.1` `Aniccā vata saṅkhārā` → `Các hành quả thật vô thường,` (dn16:6.10.10), `:13.4` `sự lắng yên của chúng là an lạc.` (dn16, dn17, sn6.15 dùng `lắng yên` hoặc `tịch diệt` với `an lạc`; tha-ap21:4.4 dùng `lắng dịu … hạnh phúc` ở dạng có dấu nháy `’`, Pāli khác nên không phải cặp trùng). Pāli ở 13.1–13.4 không có dấu nháy nên bản Việt không có.

  ĐO TIỀN LỆ, KHÔNG PHẢI ĐOÁN.
  `:0.1` `Therāpadāna` giữ Pāli: 454 so với `Trưởng Lão Ký Sự` 11 trong số khoá trùng. `:0.2` `Gandhodakavagga` thành `Phẩm Gandhodaka` (6 khoá trong cùng phẩm).
  `:0.3` Pāli `9 Dhammasavaniyattheraapadāna` bắt đầu bằng số 9, nên theo chính sách giữ số thứ tự khi và chỉ khi Pāli có số (hình thức `N. `: 121 trên 139 tệp có số, 18 tệp viết `N ` không chấm): `9. Bài Kệ Tuyên Ngôn Về Trưởng Lão Dhammasavaniya`. `translationTitle` bằng đúng giá trị `:0.3`, kể cả `9. `. `:20.1` là `:0.3` bỏ số và thêm `, thứ chín` (`navamaṁ`), như tha-ap331 và tha-ap337.
  Phần `Tuyên Ngôn`: đo trên bản Việt hiện có của tầng tha-ap (467 tệp, trừ bài này): `Tuyên Ngợ` 237 · `Tuyên Ngợi` 10 · `Tuyên Ngôn` 112 · `Ký Sự` 99 · khác 9. Phạm vi gần nhất tha-ap331–351: `Tuyên Ngợ` 10 · `Tuyên Ngợi` 1 · `Tuyên Ngôn` 5. Trong chính phẩm Gandhodaka (tha-ap333–342, các bài đã có bản Việt): `Tuyên Ngôn` 4 (335, 337, 339, 342) · `Tuyên Ngợ` 1 · `Tuyên Ngợi` 1. Chọn `Tuyên Ngôn` vì `Tuyên Ngợ` và `Tuyên Ngợi` là hình viết sai chính tả không có gốc nghĩa, `Tuyên Ngôn` đa số trong chính phẩm và khớp tha-ap342 cùng phẩm. Hai phạm vi cho hai đa số khác nhau (tầng và gần nhất đều nghiêng về `Tuyên Ngợ` theo chuỗi), người biên tập nên phán một lượt cho cả cuốn. Tên riêng giữ Pāli `Dhammasavaniya` (không dịch nghĩa), bỏ đuôi `-o` của danh cách ở `:0.3` và `:20.1`, như tha-ap342 `Ukkhittapadumiya` và tha-ap21 `Sopāka`.
  `:19.1` dùng lại đúng khoá của tha-ap342 và tha-ap343 (số nhiều, `những bài kệ này`).

  SỐ PĀLI, PHÉP TÍNH.
  `Tiṁsakappasahassāni` (9.1) = tiṁsa 30 × sahassa 1.000 = 30.000 kiếp → `ba mươi nghìn kiếp` (tha-ap200:3.3 cùng Pāli, 2 khoá, dùng `Trong ba mươi nghìn kiếp,`). Đây là chỗ bất định, xem (a).
  `Ekapaññāsakkhattuñca` (9.3) = eka 1 + paññāsa 50 = 51 → `năm mươi mốt lần`. `Ekasattatikkhattuñca` (10.1) = eka 1 + sattati 70 = 71 → `bảy mươi mốt lần` (tha-ap501:5.3 cùng Pāli, `Và bảy mươi mốt lần,`). `Satasahassito kappe` (17.1) = sata 100 × sahassa 1.000 = 100.000 → `một trăm ngàn đại kiếp` (19 khoá). `sattavassa` (15.1) = 7 → `lên bảy tuổi`. `Tāvatiṁsa` (8.4) = ba mươi ba. `catusaccaṁ` = bốn chân lý; `catasso` (18.1) = bốn. Không có phép nhân thang lớn nào khác trong bài.

  BẤT ĐỊNH, KHÔNG THÊM VÀO THÂN KINH.
  (a) `:9.1` `Tiṁsakappasahassāni` — đọc `tiṁsa` = 30, nhân với `sahassa` = 1.000, ra 30.000 kiếp, theo phép đo tầng và theo tha-ap200:3.3, tha-ap115:10.3 (`ba mươi ngàn đại kiếp`). Một cách đọc khác coi `tiṁsa` là 3 (ba nghìn kiếp) và một khoá khác trong tầng ghi `ba trăm nghìn` (tha-ap109:10.1); tầng Anh đã ghim không có bản nào cho dạng này nên không có chứng cứ độc lập, cần người biên tập phán. Bản Việt giữ 30.000 và không tự quyết thêm.
  (b) `:4.1`–`:4.4` `Na me idaṁ bhūtapubbaṁ, iriyassa vikopanaṁ; Dake yathā ummujjitvā, evaṁ gacchāmi ambare.` — `iriyassa vikopanaṁ` (sự làm rối loạn cách đi) dịch `sự cản trở việc di chuyển`, đồng vị với `idaṁ` ở 4.1. Cặp `yathā … evaṁ` ở 4.3–4.4 (nổi lên trong nước; đi giữa trời) khó đọc: có thể là so sánh với việc đi dễ dàng trước đó (như người nổi lên trong nước), hoặc chỉ động tác trong nước. Dịch sát chữ `Như đã trồi lên trong nước, tôi đi như thế giữa bầu trời.` và không thêm nghĩa so sánh. Đây là chỗ khó nhất của bài.
  (c) `:5.1`–`:5.2` `Uḷārabhūto manujo, heṭṭhāsīno bhavissati;` — `bhavissati` ở đây là suy đoán (hẳn), không phải tương lai; `uḷārabhūta` dịch `đã trở nên cao cả`; không có tiền lệ trong tầng.
  (d) `:8.1` `Carime vattamānamhi,` — `carima` có thể là thời khắc cuối của đời đạo sĩ hay đời sống cuối cùng; dịch `thời khắc cuối cùng đang diễn ra`, theo tha-ap416:4.3 (`Vào thời khắc cuối cùng,` cho `Pacchime vattamānamhi`) nhưng giữ thêm `đang diễn ra` cho `vattamāna`, vì ngữ cảnh 8.2 (nhớ lại việc nghe pháp trước khi mệnh chung) hợp với lúc lâm chung.
  (e) `:11.1` `Pitugehe` — Pāli chỉ nói `nhà của cha`, không nói cha của ai; theo mạch (người kể, lên bảy tuổi) là nhà cha của người kể, nhưng bản Việt giữ đúng `nhà của cha` và không chèn `tôi`.
  (f) `:12.3` `Na koṭiṁ paṭivijjhāmi` — `koṭi` dịch `điểm tận cùng` (đầu mút, giới hạn); `nibbānaṁ accutaṁ padaṁ` ở 12.4 có thể là đồng vị với `koṭiṁ` (tận cùng ấy là Niết-bàn) hoặc một tân ngữ thứ hai. Bản Việt để dấu phẩy giữa hai khoá nên không chọn cách nào; không có tiền lệ cho `koṭiṁ paṭivijjhāmi`.
  (g) `:16.4` — danh hiệu `sakyaputta` quy về `Đức Phật` theo tiền lệ; nếu người biên tập muốn giữ danh hiệu thì phải đổi cả ba khoá trong tầng (tha-ap501:7.4, tha-ap518:6.4, thi-ap16:6.4), không riêng bài này.
  (h) `:1.3`–`:1.4` chủ ngữ của `pakāsento` và `santāresi` là Đức Phật Padumuttara ở 1.1; bản Việt chỉ nêu `Ngài` ở 1.4.
  (i) `:3.1`–`:3.4` `Buddhaseṭṭhassa upari` dịch `Phía trên Đức Phật tối thượng` (`buddhaseṭṭha` → `Đức Phật tối thượng`, 4 khoá trong tầng); `gantuṁ na visahāmi` và `gamanaṁ na labhāmi` là hai cách nói không thể đi tiếp, dịch `không thể đi qua` và `không đi tiếp được`.

  KIỂM TRA ĐÃ LÀM, kèm mẫu số. Tập khoá Việt bằng tập khoá Pāli, 76 trên 76, đúng thứ tự. Nháy `“”‘’` khớp Pāli từng khoá, 76 khoá, 0 lệch (Pāli chỉ có `“` ở 1.1 và `”` ở 18.3; Pāli không có nháy đơn nên Việt cũng không có). Dấu lược: Pāli có `…pe…` ở 18.2, Việt đúng một `…` ở đó, 0 chỗ khác; Pāli không có `(…)` nên Việt cũng không có. Số Pāli: mọi số được tính tay ở mục trên. NFC, khoảng trắng thừa, khoá rỗng: 0 lỗi; không có Pāli lọt sang Việt ngoài tên riêng và `Therāpadāna`. Dấu cuối từng khoá khớp Pāli, trừ 16.4 (`.` thành `?` vì câu hỏi ở 16.3). Đã in 76 cặp Pāli và Việt ra đọc lại.

  Coverage English: mẫu số 1 khoá (colophon 19.1; 20.1 chỉ 39 ký tự), Sujato phủ 0/1; ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng cho uid này. Phép đo này gần như không đo được gì ở thân kệ, vì 72 trên 73 khoá không phải khối `:0` dưới 40 ký tự.

