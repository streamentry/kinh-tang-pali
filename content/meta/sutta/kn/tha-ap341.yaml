  Sửa vì sai nghĩa hoặc thêm nghĩa (accuracy fix). `:10.3` `Padesarajjaṁ vipulaṁ` từ `Vương quốc rộng lớn ấy,` thành `Vương quyền cai quản các vùng đất rộng lớn,`: đo 37 khoá cùng Pāli dùng dạng sau so với 10 khoá dùng dạng đầu; `padesa` (vùng, miền) bị mất ở `vương quốc`, và `ấy` không có trong Pāli; lượt đầu ghi nhầm dạng thiểu số là công thức. `:1.4` `santāresi` (dạng sai khiến, đưa qua) từ `giúp đông đảo người vượt qua` thành `đưa nhiều người vượt qua` (đúng bản dịch của tha-ap429:1.4, cùng Pāli). `:4.2` `iriyassa vikopanaṁ` từ `sự cản trở việc di chuyển` thành `sự làm xáo trộn cách di chuyển`: `vikopana` là làm xáo trộn, tha-ap429:4.4 dịch `xáo trộn` cho `iriyāpathavikopanaṁ`; `iriyā` là cách đi đứng, cách hành xử (iti38, cnd5 dịch `cách`).
