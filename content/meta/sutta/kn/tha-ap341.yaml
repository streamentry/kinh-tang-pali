  Đo lại cặp Pāli trùng với toàn tầng (so sánh bỏ dấu câu, chữ hoa, và đổi `ta`, `con` thành `tôi`): 60 khoá của bài có Pāli trùng khoá khác đã có bản Việt, 52 khoá khớp một dạng sẵn có, 8 khoá lệch có chủ ý: `:2.3` (hai tiền lệ khác nhau, không có đa số), `:3.1` (xem trên), `:4.4`, `:6.1`, `:6.2`, `:6.3`, `:7.2`, `:11.4` (chỉ khác một từ như `khi` và `đang`, `nói` và `giảng`, `đi về` và `trở về`, không đổi nghĩa; giữ cách sát Pāli hơn). Một cặp trùng trong chính bài (`:14.4` và `:15.2`) vẫn cùng bản Việt, chỉ khác dấu cuối theo Pāli.
