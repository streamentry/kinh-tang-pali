  Sửa lan 2026-10-13: 2.4 `Saṁyamaṁ ajjhupāgamīti` "bước đến nơi tự chế." → "đi đến sự tự chế." (`saṁyamaṁ` là sự tự chế, tân ngữ — không phải "nơi"; Pāli trùng nguyên văn ja282:3.4 đã dịch "đi đến sự tự chế"). Tập khoá giữ nguyên; điểm cũ không đổi.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 7 khoá chênh lệch lớn nhất → khác nghĩa 3: sửa 2, giữ 0, bất định 1. Sửa 1.1: «Tay nghề cung thủ vô đối đẳng» → «Cung thủ vô đối đẳng» (dhanuggaho là người bắn cung và là chủ ngữ của cả khổ kệ, không phải «tay nghề»). Sửa 2.3: «Dù đã làm anh em trở nên an toàn» → «Sau khi làm cho người anh em được an toàn» (katvāna là tuyệt đối thức nối tiếp, Pāli không có ý nhượng bộ; bhātaraṁ là một người). Bất định 1.3: akkhaṇavedhī («trúng đích chính xác», tiền lệ 11 khoá, hay «trúng trong chớp mắt» như bản mù và ne13). Ngoài danh sách chênh lệch, đọc đối kháng toàn bài sửa thêm 2.1/2.2: «Dù đã coi mọi kẻ thù là kẻ thù, vẫn chẳng làm hại một ai» → «Sau khi giao chiến với mọi kẻ thù, mà chẳng làm hại một ai» (raṇaṁ katvā là giao chiến, amitte đã là kẻ thù). Lưu ý chưa thống nhất: 0.3 «Phẩm Bất Đối Đẳng» (khớp mười bài trong phẩm) khác 0.4/3.1 «Vô Đối Đẳng» dù cùng gốc asadisa. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản Anh, bản Việt nguyên bài; `2.4` trùng `ja282:3.4` đã dùng cùng câu): sửa 1 khoá — `1.2` `mahabbalo`: *"đầy sức lớn lao"* (vụng, lặp nghĩa) → *"là vị hoàng tử đại lực;"* theo tiền lệ Jātaka (`ja517:25.2`, `ja542:58.2`, `ja542:118.2` *đại lực*). Giữ 12 khoá còn lại. Bất định giữ: `1.3` `akkhaṇavedhī` (*trúng đích chính xác* hay *trúng trong chớp mắt*); `2.1` `raṇaṁ katvā` chỉ đọc theo nghĩa thường *giao chiến*. Lệch tên chưa sửa vì là việc chung của phẩm: `0.3` *Phẩm Bất Đối Đẳng* (10 bài `ja181`–`ja190`) khác `0.4`/`3.1` *Vô Đối Đẳng* — cần người biên tập chọn một cách cho `asadisa`.
