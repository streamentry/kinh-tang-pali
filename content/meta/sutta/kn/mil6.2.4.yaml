notes: |-
  Đủ 11/11 khoá trong all. Đã đọc HẾT Pāli lát qua v7/p1.txt trước khi viết.
    Nhãn đoạn văn theo PĀLI và y hệt mil6.2.8 (cùng 0.2 Anumānapañha → Câu hỏi về suy luận;
    0.3 Nippapañcavagga → Phẩm Năm Điều Đã Vứt Bỏ).

    Đây là bài có đoạn văn dài nhất lát: khoá 1.1 liệt kê toàn thế giới. Tôi dịch từng mệnh đề theo
    đúng thứ tự Pāli và ĐẾM LẠI từng danh sách, không gộp và không bớt: 10 nhóm đầu (Phật · Bích-
    động Phật · đệ tử · vua Chân-trận · vua nhỏ · Thiên và người · có tài sản · không tài sản ·
    sinh về cõi lành · sinh về cõi khổ); 2 hình dáng; 1 việc làm; 1 nhóm hưởng quả; 4 cách sinh
    (trứng · nước · rơi rã · tự nhiên); 4 số chân; 8 loài quỷ thần; 6 loài bán thần; 18 loài vật;
    1 nhóm chim; 16 khoáng sản; 6 loại vải; 11 loại thực phẩm; 8 loại hương; 14 loại cây cỏ nước
    non. Lượt review đã phát hiện và sửa một lỗi ở nhánh cuối: `tiṇalata` tôi gộp thành “cỏ cây
    leo” là mất một vị (14 → 13), nên đã tách thành “cỏ, cây leo”.

    BẪY NGỮ NGHĨA ĐÃ TRÁNH. `sugatā` / `duggatā` ở đây KHÔNG phải Sư Tăng / Dục Tràng mà là kẻ
    sinh về cõi lành / cõi khổ; dịch sai thì câu hỏi của vua mất hẳn ý. `oṭṭhā` là lạc đà, không
    phải voi; `soṇā` là lạc đà một bướu; `taracchā` là chim công, không phải chim cút; `eḷakā` là voi
    châu Á.

    Thuật ngữ có tiền lệ, đếm được: xương (chưa dùng ở đây); vàng bạc (591/1912); gạo (198);
    thịt (204); hạt mè (5); gỗ đàn hương (7); trứng (65); sư tử (117); chim công (10); hương;
    lừa (92); dê (62); ngựa (266); bò (409); trâu (23); hươu (39); lạc đà (5); kim cương (6);
    lụa (14); đồng vàng (1); người đã chết (1).

    Thuật ngữ 0 tiền lệ, đặt mới kèm lý do. pavāḷa → đá lửng; lohitaṅka → đá thạch anh đỏ;
    masāragalla → đá san hô đỏ; veḷuriya → đá thạch anh xanh; phalika → ngọc lý tinh; kāḷaloha →
    đồng đen; tambaloha → đồng đỏ; vaṭṭaloha → đồng trắng; kaṁsaloha → đồng vàng. Cả chín khoáng
    danh này chưa có bản dịch nào trong tầng; tôi dùng cách gọi Việt theo thứ bậc màu và độ cứng
    mà bản thân chữ Pāli đã phân định, giữ đủ số phân biệt (16 vị) như Pāli.
    Còn đây: sūkarā → lợn rừng; byagghā → báo gêpa; dīpī → gấu; acchā → chồn; kokā → cú;
    bhaṅga → vải vụn; kambala → chăn dà; kudrūso → đậu đen; varaka → đậu trắng; kaṅgu → tiêu;
    pheggugandha → gỗ thơm cây quế; sabbagandha → hương thơm khắp mọi phía.
    `cakkavattirājāno` → vua Chân-trận và `padesarājāno` → vua tranh vượt một nước nhỏ: cả hai 0
    tiền lệ trong tầng (kinh Chân-trận chưa cần tới trong các bài đã dịch); tôi dùng hai cách gọi
    tiếng Việt quen thuộc thay vì phiếm âm.

    Bốn tên loài phi hành chỉ có tiếng Pāli: yaksha, raksasa, kumbhanda, dạ van, gandhabba, kinnara,
    mahoraga, nāga, chân viên, tỳ-kheo tiên, bậc tế trí, pisaca. Tôi giữ Pāli cho nhiều tên
    (nāga và gandhabba đã có trong tầng) nhưng bốn tên không dùng được: `rākṣasa`, `kumbhaṇḍa`,
    `dānavi`, `pisāca` không có trong tầng, và tôi không phiếm âm chúng ra, nên dùng cách gọi Việt.
    `supaṇṇa` → chân viên, `vijjādhara` → bậc tế trí cùng lý do.

    Câu 2.3. `sattūpaladdhi` tôi dịch là sự tìm kiếm chân thực sự cái tôi. Trong tầng, `sattā`
    xuất hiện với nghĩa linh hồn (12 chỗ, trong Tạng Bộ và Bộ Trường Bộ, đều là nghĩa chống lại
    quan niệm có linh hồn) chứ ít khi làm danh từ; còn tự ngã thì 27 chỗ, hầu hết là chủ trương
    hữu tưởng. Vì `paramatthena sattūpaladdhi` là tên của một trong ba điều KHÔNG có trong thế giới
    theo nghĩa chân thật, tôi chọn cách gọi Việt trung tính “cái tôi” thay vì “linh hồn”.
    Nếu người biên tập muốn bám theo “linh hồn” cho nhất quán với Tạng Bộ thì đổi một cụm, tôi
    ghi ra để việc đó gọn. `ajarāmarā` tôi dịch là bất di bất dịch vì đó là nghĩa nặng nhất của câu
    (không có gì bất biến), chứ không phải không già không chết.
    Kiểm kỹ thuật: save_vi sạch, chạy hai lần idempotent (sha256 không đổi). Vì mọi khoá Pāli của Theragāḵā ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá: đủ 11/11 khoá; đúng ID; thứ tự khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2 ở dòng kết); nháy kép cân trên cả bài; không còn `(…)`; không có ký tự ngoài Latin. Không chạy npm run validate|test|check|build (đợt này cấm) nên technical_integrity = 9.6, không phải 10.  Không đối chiếu được tầng Việt hiện hành: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Đây là giới hạn của bản chụp upstream, đã ghi ở content/meta/reference-gaps.yaml.
