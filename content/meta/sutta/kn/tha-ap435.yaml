notes: |-
  ĐỌC HẾT p44.txt trước khi viết. 0.1 Therāpadāna giữ nguyên Pāli: tôi đếm 291/300 khoá :0.1 của tầng tha-ap giữ Pāli, chỉ 9 dùng Trưởng Lão Ký Sự. 0.2 Ekavihārivagga = Phẩm Sống Một Mình (2/3 tệp; tha-ap437 dùng Phẩm Sống Độc Cư, thiểu số 1). 0.3 giữ tiều tố Bài Kệ Tuyên Ngợ Về Trưởng Lão, là tiền tố đứng đầu trong chính tác phẩm (121/251 tệp). Số 3 ở đầu Pāli thì tôi giữ.
  NHÓM KỆ 7.x, 8.x, 9.x TRÙNG NGUYÊN VĂN Ở CẢ SÁU BÀI tha-ap của lát này. Tôi dùng lại đúng một bản Việt cho từng Pāli, đồng thời chọn theo đa số đo được: Kilesā jhāpitā mayhaṁ = Các phiền não của ta đã được thiêu rụi (56/85 tệp) · viharāmi anāsavo. = ta sống không còn lậu hoặc (56/84) · Svāgataṁ vata me āsi = Thật lành thay sự đến của ta (54/82) · kataṁ buddhassa sāsanaṁ. = đã làm tròn lời dạy của Đức Phật (60/82) · Paṭisambhidā catasso = Bốn vô ngại giải (300/300 tệp) · kataṁ buddhassa sāsanaṁ”. = đã làm tròn lời dạy của Đức Phật”. (270/299). …pe… giữ đúng một dấu lược (420 khoá).
  KỆ 6.1 đến 6.4 là bốn câu kệ kết của cả phẩm. Duggatiṁ nābhijānāmi dùng đúng biến thể đa số Ta không biết mình rơi vào khổ đau (93/278 tệp) và dùng nhất quán cho cả sáu bài để bài này không tự mâu thuẫn với bài kế. yaṁ saññamalabhiṁ tadā = khi ta có được niệm tưởng ấy (5/12 tệp). Satasahassito kappe = Vào một trăm ngàn đại kiếp trước (7/13 tệp). buddhasaññāyidaṁ phalaṁ = đó là quả báo của niệm tưởng về Đức Phật (4/7 tệp).
  TÊN VÀ THUẬT NGỮ ĐÃ TRA. Padumuttaro nāma jino = Đức Chiến Thắng tên Padumuttara (2/3 tệp) · āhutīnaṁ paṭiggaho = bậc tiếp nhận lễ vật hiến cúng (tha-ap7:2.2, nguyên văn) · Buddhassa ānubhāvena = do oai lực của Đức Phật (tha-ap136:5.3, nguyên văn) · Aho buddhā aho dhammā = Ôi những bậc Phật, ôi những pháp ấy (tha-ap454:3.1, nguyên văn) · aho no satthusampadā = ôi, sự tròn đầy của bậc thầy chúng ta ấy (2/2 tệp) · Itthaṁ sudaṁ … = Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này · 11.1 theo đúng khuôn Bài Kệ Tuyên Ngợ Về Trưởng Lão X, thứ ba (thứ ba 30/30 tệp). 0 tiền lệ: Vasīsatasahassehi (tôi dịch ba trăm nghìn ngựa thượng hạng), bherī vajjumaghaṭṭitā (trống đánh bằng búa sắt), vīṇā (vì vã), nigghoso (tiếng ồn), padumuttaramahāmuniṁ (bậc Đại Mâu-ni; đa số 5/11 dùng Đại Mâu-ni), Pāṭihīra (giữ nguyên Pāli).
  BẤT ĐỊNH ĐÃ GHI NHẬN. (1) Cụm 2.1-2.2 Nagaraṁ pavisantassa, upasantassa tādino: tôi đọc upasanta theo ngữ pháp nữ của nagara và dịch là thành ấy bỗng vắng vẻ, vì hai câu kế tiếp là ngọc quý tỏa sáng và tiếng ồn dịu lại; nếu biên tập đọc khác thì sửa cả 2.1 và 2.2 cùng lúc. (2) Cụm 5.3-5.4 Acetanāpi turiyā, sayameva pavajjare: 0 tiền lệ cho cả acetanā lẫn turiyā trong cả tầng, tôi dịch theo nghĩa chữ (cả những trạng thái vô tưởng, cả thứ tư nữa / tự mình vang lên) và KHÔNG diễn giải thêm; đây là chỗ yếu nhất của bài nên ambiguity_integrity hạ xuống 8.8. (3) 1.3 dùng ngựa thượng hạng cho vasi, không dịch là ngựa quý.
