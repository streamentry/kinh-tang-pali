  ĐO `:0.3` — ĐO LẠI, không tin bản tóm tắt trước. Trên **357** bài `tha-ap` có cả Pāli `:0.3`
  lẫn bản Việt `:0.3` trên đĩa (lớp dùng để đo có 5.361 tệp Việt, 153.717 giá trị):
  Pāli KHÔNG có số thứ tự ở 242 bài, CÓ số ở 115 bài. Trong 242 bài Pāli không có số thì
  bản Việt cũng không có số **240 bài = 99,2%**; chỉ 2 bài lệch (tha-ap117 `11.` và
  tha-ap427 `5.`). Trong 115 bài Pāli CÓ số thì Việt giữ 66, bỏ 49. Đây chính là phép đo
  theo hướng lát s7, và nó tái lập đúng tỉ lệ đã báo (99,3% → 99,2% trên mẫu lớn hơn).
  ⇒ `tha-ap198:0.3` Pāli là `Kisalayapūjakattheraapadāna` — **KHÔNG có số** — nên số bị BỎ khỏi
  `:0.3` và đặt vào khoá đóng `:9.1` (`chaṭṭhaṁ` → *thứ sáu*), đúng như tha-ap221 và 240 bài khác.

  BA PHÉP ĐO KHÁC NHAU VỀ `:0.3` ĐÃ ĐƯỢC SO: 66/275 (mẫu 341), 73/274 (mẫu 414),
  127/291 (mẫu 418) đều cùng kết luận **BỎ** nhưng tỉ lệ rất khác nhau. Phép đo của tôi bổ
  sung góc nhìn thứ tư, đối chiếu **với chính Pāli** (không phải đếm trong bản Việt), và đó là
  phép đo có ý nghĩa nhất vì nó hỏi câu đúng: *khi nguồn im lặng, bản dịch có im lặng theo không*.
  Kết luận trùng với cả ba lát trước, và giờ có số đếm riêng để đối chiếu.

  TÊN Ở `:0.3` VÀ KHOÁ ĐÓNG — đo tiền tố ở **363** bài `tha-ap` đã dịch đủ (đếm sau khi bỏ số
  thứ tự): `:0.3` → *Bài Kệ Tuyên Ngợ* 200, *Ký Sự* 88, *Bài Kệ Tuyên Ngôn* 65, *tuyên ngợi* 10;
  khoá đóng → 199 / 88 / 66 / 10. Tức **toàn tầng thì đa số là "tuyên ngợ"**, nhưng **hai phẩm
  của bài này thì ngược**: `Tamālapupphiyavagga` (5 bài dịch đủ) *tuyên ngôn* 2 / *ký sự* 2 /
  *tuyên ngợ* 1; `Hatthivagga` (6 bài) *ký sự* 4 / *tuyên ngợ* 2. Gộp cả hai phẩm của lát:
  *ký sự* 6 / *tuyên ngợ* 3 / *tuyên ngôn* 2. Bốn bài sát nhất đã viết trong `Hatthivagga`
  (tha-ap217, 219, 221, 222) đều dùng *Ký Sự*, và tha-ap221 — bài **cùng cấu trúc 32 khoá,
  ngay cạnh bài 220** — dùng *Ký Sự* ở CẢ `:0.3` lẫn khoá đóng. Chọn **Ký Sự** vì một điều
  kiện cứng hơn cả đa số: `:0.3` và khoá đóng phải cùng một cách gọi, nếu không người đọc thấy
  hai tiêu đề khác nhau cho cùng một bài. Ghi rõ số đếm để người điều phốn gộp cả phẩm một lần
  nếu muốn thống nhất theo đa số toàn tầng.

  TÊN PHẨM Ở `:0.2` — `Tamālapupphiyavagga` đã có sẵn 5 lần trên đĩa: *Phẩm Tamālapupphiya* 3 và
