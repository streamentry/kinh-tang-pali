  BẤT ĐỊNH CÒN LẠI, ghi ở đây chứ không giải thích trong thân kinh.
  `pādapānaṁ virohano` (`:1.4`) không có tiền lệ nào trong tầng; `pādapāna` là chỗ gốc cây
  (nơi người ta dựa nghỉ dưới gốc), nên dịch *nơi cây của tôi mọc lên* — giữ đúng chủ ngữ là
  cây, không thêm chi tiết nào không có trong Pāli. `Āhutīnaṁ` / `Naruttamaṁ` không có trong bài
  này. `Sabalena upatthaddho` (`:2.1`) cũng xuất hiện ở tha-ap191:2.3 theo cùng nguyên văn nhưng
  bài đó chưa dịch, nên không có tiền lệ dịch sẵn; dịch *Với chiếc quạt lá thốt nốt cất lên,*
  theo nghĩa chữ nghĩa của `upatthaddha` = dựng/cất lên.

  KHAI TỪ VỚI HARNESS (không sửa `_hvi.py`, chỉ bổ sung bộ nhớ tiến trình). `lọt_pāli()` chỉ truyền
