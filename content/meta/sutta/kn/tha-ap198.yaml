  `Setavyā` 15, `Sāvatthī` 12, `Rājagaha` 5, `Aruṇavatī` 3, `Kusinārā` 3 lần). Không khai bừa
  từ nào khác. Ngoài ra `:0.1` cố ý trùng nguyên văn Pāli `Therāpadāna` — đó là tiêu đề tuyển
  tập, 348/357 bài đã dịch giữ nguyên, và khoá này dưới 40 ký tự nên `kiểm()` không quét.

  REVIEW ĐỐI KHÁNG — bắt được 2 lỗi thật, đã sửa. (1) Bản nháp viết `cây aśoka` với chữ `ś`
  không có trong Pāli và không có trong tầng: tầng dùng `Asoka` không dấu (sn55.9:1.2 *Tỳ-kheo
  tên Asoka*, vv38:8.3 *vòng hoa Asoka*) ⇒ đã đổi thành *cây asoka*. (2) Bản nháp dùng
  `aśoka` và để `Dvāravatī` chưa khai, nên `lọt_pāli` sẽ coi là Pāli lọt ở lần chạy tiếp theo;
  đã khai hai từ kèm chứng cứ ở trên. Ngoài ra một chỗ **tự sửa vì phép đo**: bản nháp dịch
  `cakkavattī mahabbalo.` là *là Chuyển Luân Vương có đại uy lực* theo phẩm cục bộ
  (`Hatthivagga` *đại uy lực* 3), nhưng toàn tầng *đại thần lực* 31 > *đại oai lực* 11 >
  *đại uy lực* 9, và cả ba bài trong lát phải dùng chung một cách ⇒ đã dùng **đại thần lực**
  cho cả ba, và ghi lại ở đây vì đây là chỗ phải chọn giữa đa số cục bộ và đa số toàn tầng.

