  `Kisalayapūjaka` (tên Trưởng lão của chính bài, có thật ở `:0.3` *Kisalayapūjakattheraapadāna*,
  `:8.1` *kisalayapūjako*, `:9.1` *Kisalayapūjakattherassāpadānaṁ*) và `Dvāravatī` (địa danh ở
