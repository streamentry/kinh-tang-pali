notes: |-
  Đủ 14/14 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Tiêu đề phải đúng tên bài trong chính bài: `Mahākāḷattheragāthā` dịch theo đúng dạng Kinh Kệ Của Trưởng Lão + tên của thag2.1:0.4 (Uttara) và sáu bài thig2.x, không dịch bừa nghĩa của một tên khác.

  Pāli trùng nguyên văn, dùng lại:
  · `Yo ve avidvā upadhiṁ karoti, / Punappunaṁ dukkhamupeti mando; / Tasmā pajānaṁ upadhiṁ na kayirā,` trùng y hệt snp3.12:10.3–10.5. Tôi dùng lại nguyên văn: Ai là kẻ vô tri mà tạo sanh y, / kẻ ngu ấy lại đi đến khổ hết lần này đến lần khác; / vì vậy người hiểu biết chớ tạo sanh y. `upadhi` trong tầng đang có hai cách: sanh y (snp3.12, 4 khoá) và chấp thủ (snp5.5, 2 khoá); tôi chọn sanh y theo đa số, và chọn trọn bộ ba vế của snp3.12 để không trộn hai cách.
  · Dòng kết `… Mahākāḷo thero ….` giữ đúng hai dấu lược như Pāli. Về hình dạng: thag2.35:2.5 (cùng Phẩm Hai Bài Kinh, cùng công thức lược) dịch `… Sambulakaccāno thero ….` — tức giữ nguyên Pāli, còn sáu bài thig2.x dịch `… Trưởng lão nữ X ….`. Tôi chọn theo đa số sáu bài (Trưởng lão + tên) vì (i) đó là đa số trong tầng và (ii) giữ được bất biến của repo là không copy Pāli nguyên văn vào bản dịch — thag2.35:2.5 đang vi phạm điều này. Ghi ra đây để biên tập gộp; tôi không sửa bài ngoài lát.

  Bất định đã ghi nhận:
  · `satthi` — PED nghĩa chính là xương hông, nhưng Sujato dịch thigh-bones và vế kế `bāha` (xương cánh tay) thành cặp đùi/cánh tay. Tôi dịch xương đùi để giữ đúng cặp đùi–cánh tay mà chính Sujato dựng. Nếu biên tập chọn nghĩa hông thì phải sửa cả hai vế.
  · `sīsa` tôi dịch cái đầu (Sujato: skull), còn `bhinnasiro` ở 2.4 tôi dịch hộp sọ — giữ sự phân biệt vì 1.4 nói về hành động bẻ, 2.4 nói về cái giá phải trả.
  · `dhaṅkarūpā` tôi dịch có dáng vẻ dữ dằm. Sujato đọc là looks like a crow, nhưng `dhaṅka` là bộ mặt dữ dằm của yêu quái, không phải quạ; tôi theo Pāli.
  · `Māhaṁ puna bhinnasiro sayissan` là mệnh đề cầu nguyện (Mā + aorist), tôi dịch ước gì tôi đừng phải ..., không dịch thành mệnh đề khẳng định.

  Đối chiếu tầng tham khảo: Sujato có 13/14 khoá, im lặng đúng khoá dòng kết (17 ký tự). Vì mọi khoá Pāli của bài này đều dưới 40 ký tự nên không vào mẫu số coverage, coverage đo trên Pāli có nội dung là không có khoá nội dung, không cần ghi vào content/meta/reference-gaps.yaml (đúng như thig2.5 đã publish). Mọi vế kệ có bản Anh Sujato khớp đúng khoá và đã đối chiếu từng vế. Bản Việt hiện hành tại commit đã ghim không có cho Trưởng Lão, nên đây là giới hạn của bản chụp upstream.

  Kiểm thủ công trên TOÀN BỘ 14 khoá (kiểm() rỗng vì không khoá Pāli nào từ 40 ký tự): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn Pāli, dấu lược khớp từng khoá (khoá 2.5 có 2 ở cả hai phía), nháy kép cân (mở ở 1.1, đóng ở 2.4), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.
