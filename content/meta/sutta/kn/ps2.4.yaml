notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim (kn/ps/ps2.4_root-pli-ms.json), đủ 308/308 khoá; thứ tự khoá = thứ tự Pāli, không khoá thừa, không khoá thiếu.

  Tầng tham khảo: tầng english-sujato không có ps2.4 (thư mục sutta/kn đã ghim chỉ có cp dhp iti ja kp snp thag thig ud; manifest chỉ liệt kê tệp Pāli root cho uid này); lớp english-project của dự án chưa có; vietnamese-current (phantuananh) chỉ có Pháp Cú. Coverage English theo công thức của source/layers.yaml: mẫu số 197 khoá Pāli có nội dung (từ 40 ký tự trở lên, bỏ khối :0), tử số 0 ⇒ 0/197. Vì vậy triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft với blocker noEnglishEditionUpstream. Để so thuật ngữ, đã đọc thêm bản Việt nguyên bài (không phân đoạn) ở mục Tra cứu toàn văn của chính bài này; đó không phải tầng store, không cấp text cho bản này, và không được sao chép. Các bài an11.15, an8.1, dn33, dn34, an6.13, mn42, sn20.3, sn46.54 có English riêng nhưng là bài khác, chỉ dùng để so cách dịch công thức, không phải tầng tham khảo của ps2.4.

  Cấu trúc bài: mở đầu trích lại công thức mười một lợi ích của tâm giải thoát nhờ lòng từ (1.1–1.6, trùng Pāli an11.15), ba cách lan tỏa (không giới hạn năm phương diện, có giới hạn bảy, theo các phương mười: 2.1–5.32), tám phương diện của chữ từ và phần giải nghĩa từ–tâm–giải thoát (6.1–6.5), rồi bốn phần Căn, Lực, Giác chi, Chi đạo (6.0–36.13), mỗi phần có năm, năm, bảy, tám khối hỏi–đáp ngắn cộng bộ công thức āsevanā…patāpenti. Phần 37–52 lặp lại bộ ấy theo ba lượt rút gọn bằng dấu lược: đối tượng là những ai ở đọa xứ (37–38), chúng sinh ở phương trên (39–40), rồi những ai ở đọa xứ thuộc phương trên (41–52). Các khối Pāli giống nhau được dịch đúng một cách: 28 nhóm khoá trùng nguyên văn trong chính bài (95 khoá), 0 nhóm có bản Việt khác nhau.

  Dấu lược: Pāli có …pe… hoặc … ở các khoá rút gọn (3.3–3.5, 4.3–4.7, 5.3–5.10, 5.12–5.30, 37.1–37.10, 38.3, 39.1–39.9, 40.3, 41.1–41.19, 45.2, 47.2, 50.2, 52.2); bản Việt giữ đúng một … cho mỗi khoá, không bung ra chữ, và các khoá kết …pe… hoặc … thì Việt kết …. Pāli không có (…) trần ở khoá nào của bài này, bản Việt cũng không có. Các câu có ti nối với lời trích (6.1, 7.1…, 14.1…, 20.1…, 28.1…, 37.11, 39.10, 41.20…) không có dấu nháy ở Pāli nên bản Việt để câu trần, kết bằng gạch ngang giống Pāli; chỉ 1.2/1.6 (nháy kép lời mở và đóng) và 5 khoá công thức dài (13.3, 19.13, 27.13, 36.13, 52.5) có nháy kép “đây là an tịnh” đúng như Pāli.

  Thuật ngữ và tiền lệ: mettācetovimutti dịch tâm giải thoát nhờ lòng từ (24 khoá ngoài ps có mettācetovimutti hoặc mettāya cetovimuttiyā: 13 khoá dùng đúng dạng này, 4 khoá tâm giải thoát bằng lòng từ, 3 khoá tâm giải thoát bằng từ, 3 khoá giải thoát tâm và thương yêu); tiền lệ gần nhất là mn52:8.3, sn46.54, dn33:2.2.74, dn34:1.7.39, an6.13:1.7. Bảy vế bhāvitāya bahulīkatāya yānīkatāya vatthukatāya anuṭṭhitāya paricitāya susamāraddhāya dịch giống dn33, dn34 (được tu tập, được làm cho sung mãn, được dùng như cỗ xe, được làm nền tảng, được hành trì thường xuyên, được làm cho quen thuộc, được khéo thực hiện; 3 trong 4 khoá có cả mettā lẫn yānīkata dùng đúng dạng này), thêm āsevitāya dịch được thực hành theo an8.1:2.1. ākāra dịch phương diện (64 khoá có ākārehi: phương diện 33, hình thái 6, phương cách 4; dn5:16.1 mười phương diện). sattā dịch chúng sinh (ps đã dịch 14/14 khoá; toàn tầng 1.063 khoá chúng sinh, 106 hữu tình, 89 chúng sanh); pāṇā dịch loài có hơi thở và bhūtā dịch sinh vật theo mn76:13.7, puggalā dịch cá nhân (ps2.9:34.1), attabhāvapariyāpannā dịch những ai nằm trong sự hiện hữu cá thể (attabhāva là cá thể trong tầng, pariyāpanna là nằm trong ở sn22.78, sn55.54). itthiyo dịch người nữ, purisā dịch người nam (212 khoá itthi: người nữ 109, phụ nữ 48, đàn bà 27; an10.219:6.1 cùng cặp itthiyā vā purisena vā dịch người nữ hoặc người nam); ariyā dịch các bậc Thánh (113/157 khoá bậc Thánh); anariyā dịch những người không phải bậc Thánh (13 khoá dạng số nhiều: không thuộc bậc Thánh 5, phàm phu 5, phi thánh 3, không cao quý 2, không phải bậc Thánh 1; chọn dạng dịch sát chữ nhất); vinipātikā dịch những ai ở đọa xứ (170/508 khoá vinipāta có đọa xứ). averā abyāpajjā anīghā sukhī attānaṁ pariharantu dịch theo mn42:14.3 (không oán thù, không bị tổn hại, không phiền não, sống an vui và tự giữ gìn mình). Năm khoản pīḷana, upaghāta, santāpa, pariyādāna, vihesā dịch sự áp bức, sự tổn hại, sự thiêu đốt, sự làm cạn kiệt, sự quấy nhiễu (upaghāta: tổn hại 14/62; pariyādāna: cạn 40/96 khoá, mn72:19.18, mn140:24.7, mn152:9.10; vihesā: quấy nhiễu 26/113); avihesā ở dn33:2.1.113 dịch không hại, không dùng vì ở bài này có thêm upaghāta dịch tổn hại. sukhitattā dịch có tâm an vui (snp1.8:3.4, 5.4 và kp9:3.4, 5.4, bốn khoá, hai bài cùng một lời nguyện). mettāyati dịch khởi lòng từ đối với, cetayati dịch nghĩ đến, pariyuṭṭhāna dịch sự xâm chiếm (mn48:8.3 và 8.13 dịch xâm chiếm tâm; ở 40 khoá chứa pariyuṭṭhān tầng không có một cách duy nhất, còn có đầy tràn ở an10.86, ám ảnh ở mn22:20.5 và chi phối ở mn4:10.2, mn64:5.2). Căn, lực, giác chi, chi đạo theo đa số tầng và ps: tín căn 114/118 khoá, niệm căn 74/80, định căn 77/84, tuệ căn 134/144; tinh tấn căn 21/23 khoá ps; tấn lực 18 và tinh tấn lực 13 khoá ps (ps2.9 dùng tấn lực 16 khoá, ps2.5, ps2.7, ps1.10, ps3.3 dùng tinh tấn lực; chọn tinh tấn lực cho nhất quán với tinh tấn căn, tinh tấn giác chi, chánh tinh tấn); tín lực 33/33, niệm lực 33/33, định lực 33/33, tuệ lực 35/35 ở ps; niệm giác chi 17/17, trạch pháp giác chi 15/15, hỷ giác chi 15/15, khinh an giác chi 15/15, xả giác chi 17/17 ở ps; chánh kiến 81/81, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm, chánh định đều 100% ở ps. paribhāvita dịch được nuôi dưỡng bởi (dn16: 24 khoá; tổng 53 khoá chứa paribhāvit). adhimuccati trong saddhāya adhimuccati dịch thắng giải bằng đức tin theo ps3.4:6.5, 7.5, 8.5 (saddhādhimutto; trong cả tầng adhimuccati dịch quyết định 73/123 khoá ở các văn cảnh khác, nên đây là lựa chọn theo tiền lệ cùng tác phẩm). pariḷāhaṁ paṭippassambheti dịch làm lắng dịu sự nhiệt não (lắng dịu 35/51 khoá paṭippassambh); duṭṭhullaṁ dịch sự thô trọng (18/23 khoá). Các vế khác của khoản 6–7 dịch từ động từ: assaddhiye na kampati…avijjāya na kampati dịch không dao động trước…, theo ps2.9:20.10 và 21.19 (không dao động, không lay chuyển, không run rẩy trước trạo cử, trước vô minh). Các từ của danh sách 13.3: alaṅkāra dịch trang nghiêm và parikkhāra dịch trang bị theo dn33:3.1.96 (Cittālaṅkāracittaparikkhāratthaṁ); pakkhandanā, pasīdanā, santiṭṭhanā, vimuccanā dịch sự hướng đến, sự tịnh tín, sự an trú, sự giải thoát theo dn33:2.1.113 và dn34:1.6.53 (cùng chuỗi pakkhandati pasīdati santiṭṭhati vimuccati). Tiêu đề: Phẩm Song Hành (2. Phẩm Song Hành ở ps2.5, ps2.7, ps2.8, ps2.9); Luận Bàn Về Lòng Từ theo khuôn Luận Bàn Về … của các bài ps; vāra dịch Phần (2.4.1 Phần Căn … theo ps2.7: Phần Niệm Xứ, Phần Như Ý Túc); câu kết kathā niṭṭhitā dịch Luận bàn về … được hoàn tất (ps2.5, ps2.8, ps2.9). Sāvatthinidānaṁ dịch Tại Sāvatthī (442/462 khoá).

  Số Pāli: ekādasa 11 (mười một lợi ích; đếm danh sách 1.4 theo Pāli có 11 vế, cụm lửa hay độc hay dao là một vế); pañca 5, satta 7, dasa 10 (số phương diện ở 2.3, và đếm trực tiếp danh sách 3.2–3.6 gồm 5, 4.2–4.8 gồm 7, 5.2–5.11 gồm 10 phương); aṭṭha 8 (tám phương diện ở 6.2: năm điều tránh pīḷana, upaghāta, santāpa, pariyādāna, vihesā cộng ba điều mong averino, sukhino, sukhitattā); pañca balāni 5, satta bojjhaṅgā 7, aṭṭha maggaṅgā 8; danh sách 13.3 và bốn khoá tương ứng có 25 vế honti cộng ba động từ nibbattenti jotenti patāpenti. Không có số lớn.

  Pāli trùng với các bài đã dịch khác: dò bằng khớp nguyên văn từ 25 ký tự trở lên trên toàn tầng đã dịch, được 2 khoá trùng (1.2 trùng an11.15:1.1 trừ lời mở; 1.4 trùng an11.15:2.2), và cả hai khoá bản Việt khác nhau, có chủ ý: bản an11.15 dịch tuvaṭaṁ cittaṁ samādhiyati là tâm chuyên chú vào một điểm (trong khi mn152 dịch evaṁtuvaṭaṁ là lẹ làng), dịch asammūḷho kālaṁ karoti là không điên rồ cho đến chết, và uttari appaṭivijjhanto brahmalokūpago hoti là và lậu càng sâu thì sinh ra cõi Phạm thiên (Pāli không có lậu hay sâu; an8.1:2.3 dịch đúng ý nếu chưa thấu triệt hơn thì sinh về cõi Phạm thiên); khoá 1.1 của an11.15 dịch āsevitāya là đã được thọ nhận. Bản ps2.4 theo an8.1 và dn33 ở các vế này. Lỗi ở an11.15 nằm ngoài lát này nên chỉ báo, không sửa.

  Bất định, không thêm vào thân kinh: (1) anudisā: bản Việt dịch phương phụ phía đông, tây, bắc, nam theo thứ tự Pāli (puratthimāya, pacchimāya, uttarāya, dakkhiṇāya anudisāya), không khẳng định bốn phương phụ ấy là đông nam, tây bắc… vì Pāli ghi puratthimā anudisā chứ không ghi chữ đông nam; tầng chỉ có hai khoá anudisā, đều dịch phương xen giữa. (2) attabhāvapariyāpannā dịch những ai nằm trong sự hiện hữu cá thể; cách đọc khác là những ai có tự thân hay mọi loại hiện hữu có thân. (3) pāṇā dịch loài có hơi thở và bhūtā dịch sinh vật theo mn76; tầng dịch hai chữ này khác nhau tuỳ bài (mn60: pāṇā là sinh vật, bhūtā là chúng sinh; dn2:20.6: pāṇā là sinh mạng, bhūtā là sinh loại), không có đa số rõ. (4) parivāra dịch đoàn tùy tùng và suparivutā dịch được vây quanh chu đáo: tầng không có tiền lệ cho cặp này (parivāra 216 khoá, đa số là vây quanh), cách đọc khác là sự hộ tùng. (5) vodāpeti dịch làm cho trong sạch (trong sạch 18, thanh tịnh 39, thanh lọc 12 trên 72 khoá vodāp/vodān). (6) Các động từ ở vāra chi đạo không có tân ngữ (sammā abhiniropeti, pariggaṇhāti, samuṭṭhāpeti, upaṭṭhāpeti, samādahati) nên bản Việt không thêm tân ngữ; hai chữ sammā upaṭṭhāpeti (34.2) và sammā upaṭṭhāti (51.8) khác nhau ở Pāli nên Việt cũng khác nhau (thiết lập đúng đắn và được thiết lập đúng đắn; mn17:3.2 dịch upaṭṭhāti là được thiết lập). (7) Các khoá không có chủ ngữ ở Pāli (thắng giải bằng đức tin; nỗ lực tinh tấn…) để trống chủ ngữ, không thêm vị ấy. (8) saddhāya adhimuccati: xem thuật ngữ ở trên; cách đọc khác là quyết định bằng đức tin. (9) pariyādāna dịch sự làm cạn kiệt; cách đọc khác là sự huỷ diệt hay sự chiếm trọn (hủy 1 khoá, chiếm 14 khoá trong 96). pariyuṭṭhāna cũng không có đa số rõ, xem thuật ngữ ở trên. (10) Từ pāripūrī, saṁsaṭṭhā, susamuggatā không có tiền lệ đủ gần ở tầng, dịch sự viên mãn, hòa hợp, được khéo vươn lên.

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (308 = 308), thứ tự giống Pāli; nháy đơn và nháy kép khớp Pāli từng khoá (308 khoá đã đối, 0 lệch; Pāli chỉ có nháy kép ở 1.2, 1.6, 13.3, 19.13, 27.13, 36.13, 52.5, không có nháy đơn); dấu lược … khớp Pāli từng khoá (0 lệch, không còn chữ pe ở bản Việt); NFC đạt; 0 khoá rỗng, không khoảng trắng thừa; Pāli lọt sang Việt chỉ có tên Paṭisambhidāmagga và Sāvatthī. Đã in và đọc đủ 308 cặp Pāli với Việt.

  Chưa chạy cổng kỹ thuật nên technical_integrity đặt 9,6: còn phải chạy npm run validate, npm test, npm run check, npm run build.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 11 điểm bất đồng nghĩa → sửa 1, giữ 7, bất định 3. Sửa 1 (6.1, 37.11, 39.10, 41.20: *tránh sự áp bức để đến với sự không áp bức* … → *tránh sự áp bức bằng sự không áp bức* …, vì sao: năm cặp `pīḷanaṁ vajjetvā apīḷanāya`, `upaghātaṁ vajjetvā anupaghātena`, `santāpaṁ vajjetvā asantāpena`, `pariyādānaṁ vajjetvā apariyādānena`, `vihesaṁ vajjetvā avihesāya` cùng một cấu trúc, ba cặp đuôi `-ena` chắc chắn là cách công cụ nên cả năm đọc là cách công cụ, *bằng*, không phải cách chỉ mục đích *để đến với*; bản nguyên bài cũng viết *bằng*). Giữ 7: 6.4 `byāpāda` *sân hận* (bản nguyên bài *độc hại*; `byāpāda` là ác ý, sân hận là cách dịch chuẩn); 16.2/46.4 `pamāda` *phóng dật* và 17.2/46.5 `uddhacca` *trạo cử* (bản nguyên bài đặt chữ ngược lại *buông lung* và *phóng dật*, nhưng tầng dùng cặp phóng dật–trạo cử); 4.5/37.8/41.8 `anariyā` *những người không phải bậc Thánh* (bản nguyên bài *phàm nhân*, cùng ngoại diên nhưng bản dự án sát chữ hơn); 7.2/38.2/40.2/42.2 `saddhāya adhimuccati` *thắng giải bằng đức tin* (bản nguyên bài *cương quyết*; theo tiền lệ `ps3.4`); 13.3/19.13/27.13/36.13/52.5 các chữ `alaṅkāra`, `parikkhāra`, `parivāra`, `pāripūrī` (bản nguyên bài tô điểm, bảo trì, phụ trợ, toàn vẹn; bản dự án theo `dn33`); 3.2 và các khoá tương ứng `sukhitattā` *có tâm an vui* (bản nguyên bài *bản thân được an lạc*; theo tiền lệ `snp1.8`, `kp9`); 6.1 các khoản `santāpa`, `pariyādāna` *thiêu đốt*, *làm cạn kiệt* (bản nguyên bài *bực bội*, *hủy hoại*). Bất định 3: 5.6–5.9, 5.26–5.29, 39.5–39.8, 41.15–41.18 `anudisā` (bản nguyên bài đặt thành đông nam, tây bắc, đông bắc, tây nam, còn Pāli chỉ ghi `puratthimāya anudisāya`… không nêu tên hướng; bản dự án giữ *phương phụ phía đông…*, bất định số 1 ở trên vẫn đứng); 3.3–3.4 và các khoá tương ứng `pāṇā`, `bhūtā` (bản dự án *loài có hơi thở*, *sinh vật*; bản nguyên bài *sinh mạng*, *hiện hữu*); 3.6 `attabhāvapariyāpannā` (bản dự án *những ai nằm trong sự hiện hữu cá thể*; bản nguyên bài *hạng có bản ngã*). Rà đối kháng lại cả 308 khoá: không thấy lỗi nào khác ngoài điểm ngữ pháp đã sửa. Bản nguyên bài không phân đoạn và nén bằng dấu lược nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
