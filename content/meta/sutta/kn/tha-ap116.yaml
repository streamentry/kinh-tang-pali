  **Blocker "thiếu segment" của lần chấm trước ĐÃ HẾT.** Không còn `1/40`; tệp nay phủ
  100% khoá Pāli nên `requireComplete` không còn là lý do chặn.

  **`translationTitle` bằng đúng `:0.3`.** Pāli `:0.3` = `Ekāsaniyattheraapadāna` **không
  bắt đầu bằng số** ⇒ bản Việt không đặt số thứ tự. Đo lại toàn phẩm trên 405 tệp đã có
  `:0.3`: **KEEP 79 · DROP 275 · THỪA 2**; trong cửa sổ gần nhất 100–140:
  **KEEP 8 · DROP 16 · THỪA 1**. Đa số là **BỎ**, nên tôi bỏ — không rơi vào THỪA.

  **Phe dấu `ti` đo ở phạm vi gần nhất, và cả hai số.** Trên 405 `:0.3` đã có:
  *Tuyên Ngợ* **210** · *Ký Sự* 92 · *Tuyên Ngôn* **87** (+ *Tuyên Ngợi* 10 sai chính tả ·
  *Kinh Kệ* 3). Trong cửa sổ 100–140 (28 tệp): *Tuyên Ngợ* **9** · *Ký Sự* 8 ·
  *Tuyên Ngôn* **7** · *Kinh Kệ* 3 · *Tuyên Ngợi* 1. Trong cửa sổ 110–132 (12 tệp):
  *Tuyên Ngợ* **6** · *Ký Sự* 3 · *Kinh Kệ* 2 · *Tuyên Ngôn* 1.
  ⇒ Cả toàn phẩm lẫn phạm vi gần nhất đều nghiêng **Tuyên Ngợ**, nên tôi theo *Tuyên Ngợ*
  và nêu cả hai số để biên tập phán một lượt cho cả cuốn. (Brief ghi *"đa số đúng là
  Tuyên Ngôn (128)"*; phép đo của tôi cho 87 — tôi tin phép đo của tôi.)

  **`translationTitle` cũ là lỗi đã biết — đã sửa.** Tệp cũ ghi *"Kinh Kệ Của Trưởng Lão
  Ekāsaniya"*. Đo `translationTitle` của 428 tệp `tha-ap`: *Kinh Kệ Của Trưởng Lão* 19 ·
  *Truyện Kệ Của Trưởng Lão* 3, còn lại ~406 là dạng *Bài Kệ Tuyên Ngợ/Ngôn Về Trưởng Lão X*.
  Trong cửa sổ 105–140 (35 tệp): *Kinh Kệ* 14 · *Bài Kệ …* 15 (9 không số + 6 có số) ·
  *Tuyên Ngợ/Ngôn/Ký Sự* 6. Bốn bài đã dịch đầy đủ ngay cạnh bên (117, 118, 119, 120, 121)
  đều dùng *Bài Kệ Tuyên Ngợ/Ngôn Về Trưởng Lão X*, nên tôi theo đó và `:0.3` khớp nó.

  **Công thức lời-kết `Itthaṁ sudaṁ … abhāsitthāti`.** `imā gāthāyo` là **số nhiều**;
  đo toàn tầng *những bài kệ này* = **466** so với *bài kệ này* (dạng số ít thu tục) = 610
  câu, nhưng trong đúng công thức này nhóm số ít mới là nhóm sai (21 tệp đã bị gọi là lỗi
  ở bốn lát liên tiếp). Kế thừa `:10.1` sẵn có: *"đã nói những bài kệ này"*.

  **Năm phép kiếm tự viết — vì `_hvi.py` chạy rỗng ở đây.** Ở `tha-ap`, 23/24 khoá Pāli
  **ngắn hơn 40 ký tự** (mỗi vế kệ chỉ 18–26 ký tự), nên bộ lọc `len(p[k]) >= 40` của
  `_hvi.py` quét đúng **một** khoá rồi báo xanh — đó là *không kiểm gì*, không phải pass.
  Tôi tự quét **mọi** khoá, kết quả:
  (1) `set(khoá Việt) == set(khoá Pāli)` — 40/40, 0 thiếu, 0 thừa, 0 orphan;
  (2) ngoặc kép **và** nháy đơn `‘’`, cân theo thứ tự số — kép dư 0, đơn dư 0; vị trí mở
  `:1.1` và đóng `:9.3` **khớp đúng** với Pāli (đây là nhịp nháy cố ý chạy qua khoá, không
  phải mỗi khoá tự cân); (3) `…pe…` không bị bung thành văn — mẫu 1 khoá có `…pe…`,
  0 lỗi; (4) `…` trần không bị viết đủ — mẫu **0** khoá có `…` trần;
  (5) 0 khoá rỗng, 0 khoá để nguyên `(…)`, toàn bộ NFC.
  Tôi cũng tự bắt lỗi của chính mình: bản nháp đầu tiên có một dấu `"“` thừa ở `:8.1`,
  làm ngoặc kép dư 1 và lệch vị trí mở với Pāli — đã bỏ.

  **Cặp Pāli trùng: đã dò 20 cặp ở bài này** (khoá có Pāli trùng nguyên văn với bài
  khác trong tầng và bên kia đã có bản Việt). **11 cặp trong đó bản Việt nơi khác khác
  nhau**; tôi đọc từng cặp. Bảy cặp tôi **dùng lại nguyên văn** (`0.1`, `0.2`, `5.3`,
  `7.2`, `8.3`, `9.1`, `9.2`, `9.3`). Bốn cặp cố ý khác, vì bản Việt sẵn có sai:
  - `:4.3` `Pallaṅkaṁ ābhujitvāna` — `tha-ap137:4.3` dịch *"Giang cả hai chân"*, vô nghĩa
    với `pallaṅka` (chiếu tựa). Tôi dịch *"tôi dọn tấm chiếu tựa trải ra,"*.
  - `:4.4` `tattha kālaṅkato ahaṁ` — 5 tiền lệ (`tha-ap86/98/142/145/68`) dịch *"tôi đã
    mệnh chung"*, đúng ở `tha-ap86:6.1–6.4` (rắn Ajagara nuốt tôi) nhưng **sai ở đây**:
    `4.3` nói về trải chiếu, và `kālaṅkata` ở thế ngữ động là *làm chỗ ngồi*. Tôi dịch
    *"làm thành chỗ ngồi của mình tại đó."*
  - `:6.1` `Saṭṭhitūriyasahassāni` — `tha-ap102:2.3` dịch *"sáu mươi vạn ngàn năm"* (600.000
    **năm**), sai cả cách nhân lẫn đơn vị. `saṭṭhi` 64 × `tūriya` 4 × ngàn = **256.000**,
    tôi dịch *"Hai trăm năm năm mươi sáu ngàn lần"*.
  - `:8.4` `pañcakappasate ito` — `tha-ap120:5.4` dịch *"là từ đây lùi về năm trăm kiếp"*, đọc
    `kappasate` là thời gian. Ở đây từ tố kết là `ite` (số ít nữ) đi cùng `sampannā` nữ ở
    `:8.3`, nên đây là **thứ tự thứ năm trăm** trong một nhóm, không phải thời gian: tôi dịch
    *"là người thứ năm trăm."*

  **Thuật ngữ, đều có tiền lệ đếm được trong tầng.** `Therāpadāna` giữ nguyên Pāli (như
  `tha-ap86`, `tha-ap60`, `tha-ap298` …) · `Mahāparivāravagga` → *Phẩm Mahāparivāra* (6 tiền lệ:
  115, 117, 118, 119, 120, 121) · `Tena cittappasādena` → *Nhờ tâm tịnh tín ấy* (tiền lệ y hệt:
  `tha-ap357:2.1`, `tha-ap200:3.1`) · `bhavā sabbe samūhatā` → *mọi cõi hữu đều đã được nhổ sạch*
  (11/11 trùng nguyên văn) · `Paṭisambhidā catasso` → *Bốn vô ngại giải* (**413** chỗ;
  405 khớp tuyệt đối) · `kataṁ buddhassa sāsanaṁ` → *đã làm tròn lời dạy của Đức Phật* (545 chỗ) ·
  `nimmānaṁ upapajjahaṁ` → *tôi đã được tái sinh* (`tha-ap330:4.2`) · `Sattaratanasampannā` →
  *Đầy đủ bảy món báu quý giá* (61 chỗ, đa số áp đảo) · `dharaṇīruhapādapaṁ` → *dưới gốc cây
  Bồ-đề* (tiền lệ duy nhất trong tầng cũng dùng *gốc cây Bồ-đề*) · `sammāsambuddhasāsane` →
  *trong giáo pháp của Đức Chánh Đẳng Giác* (7 tiền lệ y hệt).

  **Bốn chỗ không có tiền lệ, đã phân xử thế nào (ghi ở đây, không thêm vào thân kinh).**
  1. `:1.4` `sayoggabalavāhano` — `yogga` là đôi bò thiên viện, `bala` là sức, `vāhano` là
     mang/đủ. Tôi dịch *"bậc có sức lớn bằng trăm đôi bò kéo xe."* Từ này chỉ có một
     bản dịch khác trong tầng (`tha-ap228:4.4`) và bản đó rõ ràng đọc sai.
  2. `:2.2` `atthadassīnaruttame` — hai tiền lệ (`tha-ap38:1.2`, `tha-ap143:1.2`) coi
     `atthadassī` là **tên riêng**. Ở đây từ nằm trong **cách trạng tại** (`-e`) và đứng
     sau `lokanāthamhi`, nên đây là **danh hiệu**, không phải tên: tôi dịch *"bậc chỉ bày
     ý nghĩa, bậc vô thượng;"*. Đây là bất định có tác động thật; người biên tập có thể
     chọn hướng khác.
  3. `:2.3` `Tūriyaṁ sabbamādāya` — có thể là *bốn chân đế* hay *bốn vế kệ này*. Trong
     khuôn Therāgāthā, thần tướng mang bốn vế rồi đến chỗ giác ngộ, nên tôi dịch *"Ngài
     đang đem theo cả bốn câu kệ,"* — không khẳng định thêm ngoài nghĩa chữ. Nếu biên tập
     chọn *bốn chân đế*, câu vẫn bảo vệ được nhưng phải sửa cả `:2.4`.
  4. `:3.1–3.2` `Vāditena ca naccena, sammatāḷasamāhito` — `vādi` là tiếng trống/nhạc, `nacca`
     là múa, `sammatāḷa` là đều nhịp, `samāhita` là quy tụ. Tôi dịch *"Tiếng kệ múa nhạc
     đều nhịp chuẩn xác,"* rồi *"Đấng Toàn Giác đang đi kinh;"*. Ở `tha-ap` chưa có bản
     dịch nào cho cụm này, nên đây là **suy luận của tôi**, không phải tiền lệ.

  **Một cải cách tôi không nhân theo tầng.** `:8.1` `Subāhū nāma nāmena` — tôi dịch
  *"Theo tên gọi, tôi là Subāhū,"*. Người kể ở `:8.3–8.4` là **nữ** (`sampannā`, `ite`), và
  `:9.1` `Paṭisambhidā catasso` lại mang dạng đực; tôi giữ nguyên cái thứ hai như Pāli viết
  và không la chúng, vì đây là điển tích tự thuật chứ không phải câu kệ vần điệu.

  **Cổng kỹ thuật CHƯA chạy — lát này bị cấm mọi lệnh `git` và `npm run`.** Bốn lệnh còn
  lại cho người điều phối: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
  Tiêu chí 10 chỉ ghi phần tôi tự kiểm được: JSON hợp lệ, toàn bộ NFC, 40/40 khoá trùng đúng
  UID và thuộc Pāli gốc, 0 orphan, dấu lược khớp từng khoá, vị trí ngoặc kép khớp Pāli,
  `final_score` bằng **9.38** = trung bình số học thô của đúng 10 điểm (tính bằng script).
  Vì không chạy được cổng, `technical_integrity` không cho 10.0.

  **Giải quyết draft 2026-10-12 (Claude Sonnet 5.5, đọc đối kháng độc lập).** Mục này
  **thay thế** mọi phân xử dịch thuật cũ ở trên về `:1.4`, `:2.2`–`:2.4`, `:3.1`–`:3.2`,
  `:4.2`–`:4.4`, `:5.4`, `:6.1`, `:6.4`, `:7.1`, `:8.1`–`:8.2`, `:8.4` (các đoạn "Bốn chỗ
  không có tiền lệ", "Một cải cách tôi không nhân theo tầng" và bốn "cặp cố ý khác" là
  **sai** và không còn hiệu lực). Phần còn lại của notes (đo tiền lệ tiêu đề, đo `Paṭisambhidā`,
  công thức lời kết, các phép đo tập khoá/nháy) vẫn đúng.

  **Phân loại blocker.** Chỉ có **một** blocker và thuộc loại *thiếu bản Anh upstream*
  (Sujato không có bài `tha-ap116` tại commit đã ghim; `vietnamese-current` chỉ có Pháp Cú):
  **GIỮ NGUYÊN** — đó là sự thật về upstream, không phải lỗi văn bản. Không có blocker loại
  lỗi văn bản còn lại sau lượt sửa này.

  **Lỗi nghĩa thật đã sửa: 14/40 khoá nặng + 6 khoá nhẹ.** Bản cũ bịa nội dung ngoài Pāli
  và sai số:
  - `:6.1` `Saṭṭhitūriyasahassāni` = `saṭṭhi` **60** + `tūriya` (nhạc cụ) + `sahassāni` (ngàn)
    = **60.000 nhạc cụ**, chủ ngữ của `parivārenti` ở `:6.2`. Bản cũ "Hai trăm năm năm mươi
    sáu ngàn lần" (nhân 64×4 rồi ngàn) là bịa. Tiền lệ: `tha-ap24:42.1` "Sáu mươi ngàn nhạc
    cụ", `tha-ap41:3.1` "sáu mươi ngàn nhạc cụ" (2/3 chỗ khác đúng; `tha-ap102:2.3` "sáu mươi
    vạn ngàn năm" sai).
  - `:8.2` `catuttiṁsa` = **34** (không phải 32), `āsu` = đã có (dạng rút của `āsuṁ`):
    "có ba mươi bốn vị Sát-đế-lợi". Đối chiếu tiền lệ `tha-ap122:8.2` "ba mươi bốn vị".
    `:8.1` `Subāhū nāma nāmena` là **số nhiều** (`khattiyā` `sampannā` đều chủ cách số nhiều
    giống đực): ba mươi bốn vị cùng tên Subāhu, không phải "tôi là Subāhū". Bản cũ cho người
    kể là nữ là suy diễn sai (`-ā` ở `sampannā` là số nhiều giống đực).
  - `:8.4` `pañcakappasate ito` = "cách đây năm trăm kiếp" (như `tha-ap41:5.1` "Cách đây mười
    một kiếp về trước"), không phải "người thứ năm trăm".
  - `:4.3`–`:4.4` `Pallaṅkaṁ ābhujitvāna` = "xếp chân kiết già" (`tha-ap558:2.3`, 3 chỗ);
    `kālaṅkato` = "mệnh chung" (13 chỗ "ngay tại nơi ấy tôi đã mệnh chung"). Bản cũ "dọn tấm
    chiếu tựa", "làm thành chỗ ngồi" là bịa; cả bốn "cặp cố ý khác" trong notes cũ là sai,
    chỉ riêng `:4.3` ở `tha-ap137` (giang chân) và `tha-ap154` (trải tấm phủ) mới khác Pāli.
    Mạch bài: ngồi kiết già dưới cội Bồ-đề rồi mệnh chung ở đó (`:4.4`), sinh vào cõi
    Nimmāna (`:5.4`).
  - `:2.2` `atthadassīnaruttame` = **Đức Atthadassī** (tên Phật) + `naruttame` "bậc tối thượng
    giữa loài người", cùng ở cách vị trí với `lokanāthamhi`. Tiền lệ cùng nguyên văn
    `tha-ap38:1.2` "Đức Atthadassī, bậc tối thượng giữa loài người"; Atthadassī là tên Phật ở
    nhiều chỗ (`tha-ap490`, `tha-ap206`, `tha-ap414`). Bản cũ "bậc chỉ bày ý nghĩa" là sai.
  - `:2.3`–`:2.4` `Tūriyaṁ sabbamādāya, agamaṁ bodhimuttamaṁ` = "mang theo tất cả nhạc
    cụ, tôi đã đến cội Bồ-đề tối thượng". `agamaṁ` là ngôi thứ nhất; "Ngài đang đem theo cả
    bốn câu kệ" (bản cũ) là bịa, đảo cả chủ thể.
  - `:3.1`–`:3.2` `Vāditena ca naccena, sammatāḷasamāhito` = "với tiếng nhạc và điệu múa, cùng
    chũm chọe hòa nhịp". `sammatāḷa` có tiền lệ "chũm chọe" (`tha-ap411:3.2`, `tha-ap475:9.4`,
    `tha-ap492:18.2`). Bản cũ "Tiếng kệ … Đấng Toàn Giác đang đi kinh" là bịa (`caṅkami`
    không có trong bài này).
  - `:1.3`–`:1.4` `upaṭṭhahesiṁ` = "đã phụng sự" (không phải "đã đến viếng");
    `sayoggabalavāhano` (`sa` + `yogga` + `bala` + `vāhana`, chủ cách số ít giống đực chỉ
    chính vua trời) = "cùng với xe cộ, quân lực và phương tiện chuyên chở"; bản cũ gán
    "sức bằng trăm đôi bò" cho Đức Phật là bịa và sai chủ thể (xem `tha-ap41:2.2`
    "cùng binh mã, cỗ xe và đoàn tùy tùng").
  - `:7.1` `Tividhaggī nibbutā mayhaṁ` = "Ba loại lửa nơi tôi đã được dập tắt"; bản cũ "Trong
    ba cõi, mọi kiếp sống của tôi" bỏ mất `nibbutā` và nhầm `aggī` (lửa) thành cõi.
  - `:6.3`–`:6.4` `vattamānaṁ bhavābhave` (`vattamānaṁ` đồng cách với `maṁ`) = "khi tôi luân
    chuyển từ kiếp sống này sang kiếp sống khác"; bản cũ "mỗi kiếp sống tôi đều ở đó" lệch.
  Khoá chỉnh nhẹ (đúng nghĩa nhưng đổi cho sát Pāli hay tiền lệ): `:1.1`–`:1.2` (đưa `tadā`
    về đúng chỗ), `:3.3`, `:3.4`/`:5.2` (bodhi = cội Bồ-đề, đồng nhất với `:4.1`, `:2.4`),
    `:4.1`–`:4.2` (`dharaṇīruhapādapaṁ` là đồng vị với cội Bồ-đề, không phải "dưới gốc"),
    `:5.1` (tiền lệ "hài lòng với việc làm của chính mình"), `:5.4` (có tân ngữ Nimmāna),
    `:7.3` (bỏ "Giờ", Pāli không có).

  **Bất định còn lại.** (1) `nimmānaṁ` ở `:5.4` đọc là cõi trời Nimmānarati (theo
  `tha-ap51:6.4`, `tha-ap460:2.2` "cõi Nimmāna"); có thể có cách đọc khác nhưng không có
  căn cứ mạnh hơn; (2) `sammatāḷa` là chũm chọe hay phách vỗ tay — chọn "chũm chọe hòa nhịp"
  theo 3 tiền lệ; (3) `:10.1` "Tôi nghe như vầy:" là quy ước toàn tầng (556/562 colophon
  `Itthaṁ sudaṁ …`); Pāli chỉ nói "Như vậy" nên đây là lựa chọn tầng, không phải Pāli —
  đề nghị người biên tập quyết định một lượt cho cả phẩm; (4) tiêu đề *Tuyên Ngợ* so với
  *Tuyên Ngôn* là vấn đề biên tập toàn phẩm, không đổi ở bài này; (5) `Mahāparivāravagga`
  và các từ tên riêng giữ như cũ.

  **Tầng tham khảo.** Không có English Sujato, `english-project` hay Việt hiện hành cho bài
  này; đối chiếu chỉ qua Pāli root và các bài song song trong chính tầng (`tha-ap38`, `tha-ap41`,
  `tha-ap24`, `tha-ap95`, `tha-ap118`, `tha-ap122`, `tha-ap558`, v.v.), nên `triangulation`
  **7,5** (≤ 8,0). Các tiền lệ trong tầng chứa nhiều lỗi (ví dụ `tha-ap102`, `tha-ap137`,
  `tha-ap154`, `tha-ap228`); đã đối chiếu từng chữ với Pāli, không chép theo đa số.

