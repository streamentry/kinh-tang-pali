notes: |-
  **Phạm vi: đủ 211/211 khoá của cnd21, không khoá nào ngoài tập khoá Pāli.** Bài là phần Cūḷaniddesa chú giải *Kệ Tán Thán Phẩm Bờ Kia* (Pārāyanatthutigāthā, mục thứ mười bảy và là mục cuối của Pārāyanavagganiddesa), tức là bài kệ `snp5.18` (cũng là `cnd3`). Cấu trúc như `cnd6`, `cnd12`, `cnd13`, `cnd20`: dẫn từng đoạn rồi giải từng cụm. Các đoạn dẫn có nháy là `4.1`, `9.1–9.3`, `17`, `23`, `29`, `35`, `43`, và `14.5` là câu hỏi trích dẫn. Pāli của bài **không có** `(…)` và **không có** `…` trần; có 16 khoá chứa `…pe…` (`2.2`, `8.6`, `8.8`, `14.4`, `16.2`, `19.3`, `22.4`, `25.7`, `26.2`, `31.1`, `32.2`, `34.1`, `37.2`, `38.2`, `42.3`, `42.5`), đều thành đúng một `…`. Không khoá nào Pāli kết `….`.

  **Cách trình bày lemma** theo `cnd6`/`cnd13`/`cnd20`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. `Iti` ở `42.5` giữ nguyên Pāli (như `Iccā` ở `cnd13:2.4` và `Iti` ở `cnd14:24.4`) vì lời giải nói về chính hình thức của từ ấy. Tên riêng giữ nguyên: Magadha, Pāsāṇaka, Bāvari (14/14 chỗ ở `snp5.*`, `cnd*` viết *Bāvari*), Piṅgiya, Ajita… Mogharāja.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `cnd21`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; tệp `cnd21_translation-en-sujato.json` không tồn tại, chỉ có tệp tên `cnd-name`. Lớp `english-project` không có `cnd21`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự sau khi gộp khoảng trắng, bỏ khối `:0`, chưa bỏ thẻ in đậm) là **83**/211 khoá; Sujato phủ 0/83 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/83, `vietnamese-current` 0/83. Không có bản Anh độc lập nào của chính bài này để đối chiếu. Chứng cứ trong chính corpus là bản của **bài khác**, nên không tính là đối chiếu English của `cnd21`: các lời kệ trùng Pāli với `snp5.18`, mà Sujato có dịch (đã đối chiếu `snp5.18:1.1`–`8.4`: *the seer of consummate conduct*, *Kinsman of the Sun*, *the supreme path*, *the Way to the Far Shore*, cho các lời kệ ở `12.2`, `24.2`, `36.2`, `36.4`), và các công thức chú giải đã dịch ở `cnd6`, `cnd12`, `cnd13`, `cnd15`, `cnd20`. Phần chú giải riêng của `cnd21` (lemma, định nghĩa `Buddho`, danh sách đồng nghĩa) không có bản Anh nào để đối chiếu.

  **Dùng lại tiền lệ.** Đã dò toàn tầng Việt (dn, mn, sn, an, kn): **54** khoá Pāli của bài (bỏ thẻ in đậm, gộp khoảng trắng) có cặp trùng nguyên văn với khoá ngoài bài; dùng lại nguyên văn ở **49** khoá (`snp5.18` 38, `cnd3` 3, `cnd12` 2, `cnd13` 2, `mn9` 2, `cnd4` 1, `dn33` 1); khác ở **5** khoá: `1.1` (`cnd3:1.1` thêm *du sĩ* sau *Bà-la-môn*, Pāli `paricārakasoḷasānaṁ brāhmaṇānaṁ` không có chữ nào là *du sĩ*; theo `snp5.18:1.2` là *Bà-la-môn hầu cận*, phần còn lại giữ nguyên `cnd3:1.1`), `20.4` (`mn50:28.6` là một câu khác ngữ cảnh, *đã trả lời đúng như thật*), `32.5` (`thag14.1:3.4` *như Đức Phật đã thuyết giảng*; ở đây giữ *đã dạy* để khớp `30.2`/`35.2` theo `snp5.18:7.2`), `36.4` và `42.6` (`snp5.18:8.4` và `cnd3:8.4` viết *“Bờ Kia”* có nháy, nhưng Pāli các khoá ấy **không có** nháy nên ở đây bỏ nháy; `5.3` Pāli có nháy nên giữ *“Bờ Kia”*).
  Các đoạn dùng lại gồm: bốn đoạn kệ (`10`–`12`, `18`, `24`, `30`, `36` theo `snp5.18:2`–`8`), công thức `Thế Tôn: đây là lời xưng hô tôn kính …` (`cnd13:9.3`, `cnd6:12.2`, `cnd14:16.10`), `Bậc Mâu-ni: sự hiền trí được gọi là trí …` (`cnd12:11.5`), `Đó là sự lắng dịu mọi hành …` (`cnd12:22.3`), `chánh kiến … chánh định` (`mn9:22.10`, 40 khoá cùng Pāli) và tám chi (`dn33:3.1.7`).
  **Trong chính bài:** 16 nhóm Pāli trùng nguyên văn (22 cặp, sau khi bỏ thẻ in đậm); cả 16 nhóm bản Việt giống hệt (0 nhóm khác). Thêm 29 nhóm chỉ trùng khi bỏ dấu câu và chữ hoa/thường (kệ so với lemma); 26 nhóm trong đó Việt cũng chỉ khác dấu câu, chữ hoa hoặc nháy; 3 nhóm Việt khác về từ, đều cố ý: (`18.2`, `20.4`, `23.2`) kệ dùng *câu hỏi khi được hỏi* theo `snp5.18:5.2` còn lemma giữ thứ tự Pāli *khi được hỏi câu hỏi*; (`30.1`, `31.3`, `35.1`) và (`30.2`, `32.5`, `35.2`) kệ dùng cách chia dòng của `snp5.18:7.1`–`7.2` (*nếu ai thực hành đúng theo / từng câu hỏi như Đức Phật đã dạy*) còn lemma giải từng cụm một.

  **Điều đáng báo cho người biên tập (ngoài lát, không sửa):** `snp5.18:1.3`, `cnd3:1.2` (và vì giữ nguyên văn, `cnd21:5.1`, `9.1`) dịch `Ekamekassa cepi pañhassa … gaccheyyeva` thành *Nếu ai hiểu rõ ý nghĩa và pháp của từng câu hỏi … sẽ đi đến bờ bên kia*; chữ `cepi` (*dù chỉ*) và `-eva` (*chắc chắn*) không có trong bản Việt (Sujato `snp5.18:1.3` cũng đọc *each of these questions … you may go right to the far shore*, không có *even*), trong khi lemma `6.1` của chính bài này nhấn `ekamekassa cepi` đối với từng câu hỏi trong mười sáu câu hỏi. Ở `6.1`/`6.2` tôi dịch *dù chỉ một câu hỏi*; lời kệ thì giữ nguyên văn để ba bài (`snp5.18`, `cnd3`, `cnd21`) khớp nhau. Đây là một lựa chọn cần người biên tập phán: nếu chốt thêm *dù chỉ*/*chắc chắn* thì nên sửa đồng thời cả ba.

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - Nhóm động từ giải thích `ācikkhi desesi paññapesi paṭṭhapesi vivari vibhaji uttānīkari pakāsesi` → *giải thích, giảng dạy, trình bày, an lập, khai thị, phân tích, làm cho hiển lộ, công bố* theo `cnd12:10.4`, `cnd13:18.3`; dạng danh từ (`ācikkhanena…pakāsanena`) → *bằng sự giải thích … bằng sự công bố*. `byākāsi` → *trả lời* (`snp5.18:1.2`); `pabyākāsi`, `veyyākaraṇa` → *giải đáp* (`snp5.18:5.1`, `5.3`).
  - Chuỗi *đã biết, đã cân nhắc, đã thẩm xét, đã làm cho rõ ràng, đã làm cho sáng tỏ* (`jānitvā tulayitvā tīrayitvā vibhāvayitvā vibhūtaṁ katvā`) theo `cnd6:5.1`, `cnd12:12.1`.
  - Năm hạng đồng nghĩa `agga seṭṭha viseṭṭha pāmokkha uttama pavara` → *tối thượng, tối thắng, thù thắng, dẫn đầu, tối cao, cao quý* theo `cnd6:7.1`, `cnd6:23.1` (2 khoá cùng chuỗi); `varapañña` ở lemma `28.1` → *ưu việt* (0 tiền lệ), còn *tuệ tối thắng* ở kệ theo `snp5.18:6.4`. Hệ quả: *tối thắng* dịch cả `seṭṭha` (`cnd6:7.1`) lẫn `uttama`/`vara` ở các dòng kệ theo `snp5.18`; chỗ lemma phải phân biệt thì dùng *tối cao* cho `uttama`.
  - `tosesi vitosesi pasādesi ārādhesi attamane akāsi` → *làm hài lòng, làm vô cùng hài lòng, làm cho hoan hỷ, làm vừa lòng, làm cho vui mừng*; *làm hài lòng* theo `snp5.18:5.4`, `cnd3:5.4` (2/8 khoá chứa `tosesi`), `mil5.4.10:2.2` dịch `ārādhesuṁ tosesuṁ pasādesuṁ` *hài lòng, hoan hỷ, tịnh tín*; các động từ còn lại 0 tiền lệ. `puṭṭho pucchito yācito ajjhesito pasādito` → *được hỏi, được hỏi han, được cầu xin, được khẩn thỉnh, được làm cho hoan hỷ* (0 tiền lệ); `ajjhiṭṭho` → *được thỉnh cầu* theo `snp5.18:1.2`.
  - `sammāpaṭipadaṁ anulomapaṭipadaṁ apaccanīkapaṭipadaṁ anvatthapaṭipadaṁ dhammānudhammapaṭipadaṁ` → *sự thực hành đúng đắn, thuận chiều, không đối nghịch, đúng nghĩa, pháp và tùy pháp* theo `cnd15:19.2` (1 khoá, cùng năm từ).
  - `tasmā taṅkāraṇā taṁhetu tappaccayā taṁnidānā` → *vì thế, vì nguyên cớ ấy, vì nhân ấy, vì duyên ấy, vì căn nguyên ấy* theo `cnd20:15.2`, `27.2`. `adhivacanaṁ` → *tên gọi* theo `cnd3:1.4`; chuỗi `saṅkhā samaññā paññatti vohāro nāmaṁ nāmakammaṁ nāmadheyyaṁ nirutti byañjanaṁ abhilāpo` theo `cnd6:3.6` (1 khoá).
  - `viharanto iriyanto vattento pālento yapento yāpento` → *trú, vận hành, tiếp diễn, duy trì, nuôi dưỡng, kéo dài* theo `cnd12:12.9` (*sống: sống, trú, vận hành, tiếp diễn, duy trì, nuôi dưỡng, kéo dài*, 1 khoá cùng sáu động từ). `paddho paddhacaro paricārako` → *người hầu cận, người theo hầu, người phục dịch* theo `cnd14:31.1`–`31.2`; `sisso` → *đệ tử*.
  - Công thức về Đức Phật ở `13.3`–`13.7`, `16.2`, `19.3`, `26.2`, `32.2`: không có công thức cùng Pāli trong tầng (0 khoá). `sayambhū` → *bậc Tự Tại* (48 khoá chứa `sayambhū`, 36 dịch *Tự Tại*, vd `tha-ap490:1.2`, `tha-ap62:5.2`), `sabbaññutā` → *toàn tri* (71 khoá chứa `sabbaññut-`: *toàn tri* 29, *nhất thiết* 27, *toàn giác* 8; vd `mil5.1.8:1.1`), `ananussutesu dhammesu` → *những pháp chưa từng được nghe trước đây* (58 khoá, 58 có *chưa từng*; vd `sn56.12:1.1`, `dn14:2.19.6`), `anuttaraṁ sammāsambodhiṁ abhisambuddho` → *giác ngộ Chánh Đẳng Giác vô thượng* (41 khoá, 27 có *Chánh Đẳng Giác*; vd `dn16:5.8.4`), `ñātisālohita` → *bà con quyến thuộc* (83 khoá, 57 có *bà con*; vd `dn14:2.10.11`), `pajā` → *chúng sinh* (202 khoá chứa `pajā`/`pajāya`: *loài người* 118, *chúng sinh* 49, *quần chúng* 41, *quần sinh* 2; trong những chỗ này `pajā` thường đứng cạnh `manussa`, nên ở `13.5` chọn *chúng sinh* cho `bodhetā pajāya`). Danh xưng 8 hạng thân thích ở `13.6` theo `mil5.5.8:10.1` (cùng chuỗi `netaṁ nāmaṁ mātarā kataṁ …`, 1 khoá), đổi *đã đặt* thành *do … đặt* để câu phủ định gọn; `mittāmacca` → *bạn bè và đồng liêu*.
  - Năm mắt: `maṁsacakkhu, dibbacakkhu, paññācakkhu` → *nhục nhãn, thiên nhãn, tuệ nhãn* (`dn33:1.10.113`, 2 khoá), `buddhacakkhu` → *Phật nhãn* (14/14 khoá, vd `dn14:3.6.1`), `samantacakkhu` → *nhãn nhìn khắp* theo `cnd4:3.1` (*bậc nhìn khắp*). `devadevo narāsabho` → *Đấng Thiên Trung Thiên, Đấng Nhân Ngưu* (`tha-ap45:6.2`, 2 khoá).
  - `gambhīre duddase duranubodhe sante paṇīte atakkāvacare nipuṇe paṇḍitavedanīye` → *sâu xa, khó thấy, khó hiểu, an tịnh, thù thắng, ngoài tầm suy luận, tinh tế, chỉ bậc trí mới cảm nhận được* theo `dn1:1.28.1` (cùng chuỗi, 3 khoá); `mn72:18.2`, `mn95:17.12` dịch *khó hiểu, an tịnh, cao thượng*, `dn14:3.1.4` *khó giác, tịnh lặng*; chọn theo `dn1`.
  - `brahmacariya` ở `27.1`–`27.2` theo `cnd6:11.6`–`11.7` (cùng Pāli đến `velāanatikkamo`; hai chữ thêm `viramaṇaṁ`, `setughāto`, xem bất định). `bhāvento āsevanto bahulīkaronto` → *tu tập, thực hành, làm sung mãn* theo `mn48:9.2` (*thực hành, tu tập, làm sung mãn* đúng thứ tự `āsevanto bhāvento bahulīkaronto`); `sīlasaṁvara` → *sự thu thúc giới* (9 khoá chứa `sīlasaṁvara`: *thu thúc* 6, *phòng hộ* 2), `indriyasaṁvara` → *sự phòng hộ các căn* (62 khoá: *phòng hộ các căn* 30; vd `dn10:2.2.10`, `dn10:2.5.1`); `jāgariyānuyoga` → *sự chuyên cần tỉnh thức* theo `cnd15:19.2`, `satta saddhammā` → *bảy pháp lành* theo `dn33:2.3.12`.
  - Nhãn: `Cūḷaniddesa` → *Tiểu Tập Kể Lược*, `Pārāyanavagganiddesa` → *Kể Lược Phẩm Bờ Kia* (`cnd4:0.1`, `cnd13:0.2`, 8 và 6 khoá), tên bài *Kệ Tán Thán Phẩm Bờ Kia* theo `snp5.18:0.2`, `cnd3:0.3`; colophon *… thứ mười bảy* theo `cnd20:30.7`, `cnd13:27.3`. `pārāyana` → *Bờ Kia* (`snp5.18`, `cnd3`: 2 khoá); `dhammapariyāya` → *pháp môn* (`snp5.18:1.4`, `cnd3:1.4`).

  **Số Pāli.** `soḷasa` = **16** (mười sáu Bà-la-môn; danh sách ở `6.1` đếm đủ 16 mục: Ajita, Tissametteyya, Puṇṇaka, Mettagū, Dhotaka, Upasīva, Nandaka, Hemaka, Todeyya, Kappa, Jatukaṇṇi, Bhadrāvudha, Udaya, Posāla, Mogharāja, Piṅgiya); `pañcahi cakkhūhi` = **5** (5 mục ở `25.6`: maṁsa, dibba, paññā, buddha, samanta); `ariyo aṭṭhaṅgiko maggo` = **8** (8 mục ở `27.3`); `cattāripi jhānāni` = **4**; `sattapi saddhammā` = **7**; `sattarasamo` = **17** (khớp số `17.` ở `0.3`). Các danh sách đã đếm khớp: 15 mục `buddho` ở `13.5` (15 *nên là Phật*), 6 mục `caraṇa` ở `14.2`, 6 hạng `caraṇa` ở `14.3`, 7 hạng `varapañña` ở `28.1`, 5 từ `tosesi…attamane akāsi` ở `22.2`, 5 động từ `upāgamiṁsu…paripañhiṁsu` ở `13.8` và 6 ở `16.3`, 8 động từ giải thích ở `20.3`/`32.4`, 9 ở `3.4`/`19.4`/`21.1`, 12 từ chỉ đường ở `40.1`–`40.4`, 10 từ ở `8.9`. Không có số lớn, không có `sata`/`navuti`, không có cụm `tiṁsakappasahassa`; không có số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `13.5` `abhiññeyyatāya buddho`: dịch sát chữ *vì đã thắng tri điều cần được thắng tri*; tầng chỉ có `mnd16` mang cùng dạng, không có văn bản song song để phân xử nghĩa chính xác của danh từ trừu tượng `abhiññeyyatā` ở đây. `visavitāya` → *đã nở rộ* (0 tiền lệ; `dn18:22.3` dịch `iddhivisavitāya` *phát triển* ở ngữ cảnh khác), `khīṇāsavasaṅkhātena`, `nirupalepasaṅkhātena` → *được gọi là bậc đã diệt tận lậu hoặc / không nhiễm dính* (0 tiền lệ). `ekāyanamaggaṁ gato` → *đã đi trên con đường trực tiếp* theo `mn10:2.1`, `dn22:1.7` (4/4 khoá chứa `ekāyano` dịch *trực tiếp*), nhưng chữ `eko` đứng liền sau cho thấy cũng có thể là *độc nhất*; chọn theo tầng.
  2. `13.7` `vimokkhantikametaṁ` → *thuộc về điểm cuối của giải thoát* (0 tiền lệ; hapax trong phạm vi tầng).
  3. `27.1` `setughāto` → *sự phá bỏ cây cầu* (0 tiền lệ; nghĩa ẩn dụ chưa chắc) và `viramaṇaṁ` → *sự dừng bỏ* (0 tiền lệ; `veramaṇī` ở `cnd6:11.6` là *sự từ bỏ*).
  4. `40.1`–`40.4` mười hai từ chỉ đường và phương tiện qua sông (`maggo pantho patho pajjo añjasaṁ vaṭumaṁ āyanaṁ nāvā uttarasetu kullo bhisi saṅkamo`): `vaṭumāyanaṁ` tách thành `vaṭumaṁ` + `āyanaṁ` theo sandhi; các từ `pantho`, `patho`, `pajjo`, `vaṭuma`, `uttarasetu`, `kullo`, `bhisi`, `saṅkama` đều 0 tiền lệ, chọn chữ Việt phân biệt được (*lối, nẻo, đường mòn, đường cái, cầu vượt, bè, phao, cầu bắc qua*) nhưng ranh giới nghĩa giữa các từ gần nhau không phân xử được. `ayana`/`āyana` → *đường đi* ở `8.7`, `42.4`, `40.2`.
  5. `14.1` `sīlācāranibbatti` → *sự phát sinh giới hạnh* (0 tiền lệ). `14.4` `isi … pe …`: đọc `vā` là lựa chọn thứ hai (*hoặc được các chúng sinh có uy lực lớn tìm cầu*), vì Pāli lược giữa hai vế.
  6. `7.1` `sveva pañho dhammo, visajjanaṁ attho`: dịch sát chữ *chính câu hỏi ấy là pháp, lời đáp là ý nghĩa*; lời giải này ở bản Pāli ghim là nghĩa của cặp `attha`/`dhamma` trong lời kệ.
  7. `13.2`, `19.2`, `22.3`, `25.2` `pārāyaniyā brāhmaṇā` → *Bà-la-môn của Bờ Kia*: đọc `pārāyaniya` là tính từ tạo từ tên phẩm; 0 tiền lệ. `2.1` `idaṁ pārāyanaṁ avoca` → *Ngài đã nói Bờ Kia này*.
  8. `6.1` `nandakapañha`: dịch *câu hỏi của Nanda* theo `snp5.18:2.4` (`nando`); `-ka` chỉ ở dạng lemma.
  9. `37.1`, `34.2` `abhisaṅkhārā` → *các sự tạo tác* (0 tiền lệ ở nghĩa này; `mn43:28.2` dịch `abhisaṅkhāro` *sự quyết định*, khác ngữ cảnh). `7.10` `adhiphasseyya` → *chạm đến* (như `phasseyya` ở `34.3`, `37.4`; 0 tiền lệ cho tiền tố `adhi-`).
  10. `20.2`, `3.3`, `15.2` `pasādito`, `pasādentā` → *được làm cho hoan hỷ*, *làm cho hoan hỷ*: chủ thể được làm hài lòng là Đức Thế Tôn (bởi người hỏi); 0 tiền lệ.
  11. `14.5` `kahaṁ buddho …`: thêm dấu hỏi vì Pāli dùng `kahaṁ` (nghi vấn), không có dấu hỏi trong Pāli.
  12. Lỗi ngoài lát, báo chứ không sửa: `cnd3:1.1` thêm *du sĩ* không có trong Pāli (xem mục dùng lại); `snp5.18:1.3`, `cnd3:1.2` thiếu `cepi`/`-eva` (xem trên); `snp5.18:8.4`, `cnd3:8.4` dùng nháy *“Bờ Kia”* ở khoá Pāli không có nháy (2 khoá). Chưa đọc đối kháng các khoá còn lại của các bài ấy.

