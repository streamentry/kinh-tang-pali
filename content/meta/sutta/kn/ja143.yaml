notes: |-
  Đủ 9/9 khóa. virocasi → tỏa sáng (tỏa sáng có 89 tiền lệ trong tầng Việt);
  ở đây là nói mỉa mai vì nhân vật nát nhừ: lasī nipphalitā là óc văng ra,
  matthaka padālita là đầu vỡ toác, phāsukā bhaggā là xương sườn gãy nát.
  Ngoặc đơn ‘tỏa sáng’ đánh dấu giọng mỉa, giải thích để ở đây chứ không
  đưa vào thân kinh. lasī đọc là óc theo ngữ cảnh đầu vỡ; nếu có bằng chứng
  từ điển khác sẽ sửa.
  Sujato trống cả 9 khóa, không có tầng Việt hiện hành cho Jātaka trong
  snapshot đã ghim → chỉ Pāli đơn tuyến, giữ draft.
