notes: |-
  Bài thi-ap29 — Therīapadāna, Phẩm Kuṇḍalakesī, ký sự thứ chín: mười ngàn tỳ-kheo-ni do
  Yasodharā dẫn đầu kể lại, trước mặt Đức Thế Tôn, lời nguyện từ thời Đức Phật Dīpaṅkara.
  62/62 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào ngoài tập Pāli.

  TÊN PHẨM, TIÊU ĐỀ — đo trước khi chốt, ghi cả hai số:
  - `:0.1` Therīapadāna giữ nguyên Pāli: tiền lệ 9/10 tệp thi-ap (tệp còn lại là thi-ap6, viết
    Trưởng Lão Ni Ký Sự).
  - `:0.2` Kuṇḍalakesīvagga viết theo công thức đã có của thi-ap là Phẩm + tên bỏ đuôi -vagga
    (Phẩm Sumedhā, Phẩm Ekūposathika, Phẩm Khattiya); chưa có tiền lệ riêng cho Kuṇḍalakesī.
  - `:0.3` bắt đầu bằng số (`9 Yasodharā…`) nên theo chính sách số thứ tự của phẩm Therāpadāna
    (giữ số khi và chỉ khi Pāli `:0.3` bắt đầu bằng số) bản Việt giữ `9. ` và
    `translationTitle` bằng đúng giá trị `:0.3`. Lưu ý cho biên tập: 4/4 tệp thi-ap đã có mà
    Pāli `:0.3` cũng bắt đầu bằng số (thi-ap2, thi-ap7, thi-ap12, thi-ap31) đều đang BỎ số ở
    `:0.3`; chính sách đo trên tầng tha-ap, nên chỗ này phân kỳ giữa hai nhóm và cần một phán
    quyết cho cả cuốn. Số thứ tự vẫn nằm ở khoá cuối (`:17.1`, thứ chín).
  - Từ chỉ thể loại `apadāna` ở `:0.3` và `:17.1`: đo trong các tệp `-ap` đã dịch, `Tuyên Ngợ`
    thi-ap 9 / tha-ap 244, `Tuyên Ngôn` thi-ap 0 / tha-ap 97, `Ký Sự` thi-ap 0 / tha-ap 96,
    `Kinh Kệ` tha-ap 5. Đa số theo số đếm là `Tuyên Ngợ`, nhưng đó là dạng sai chính tả của
    `Tuyên Ngôn`; bài này viết đúng chính tả `Tuyên Ngôn`, nên khác 9/9 tệp thi-ap đã có.
    Người biên tập cần phán một lượt cho cả cuốn rồi sửa hàng loạt.
  - `bhikkhunī` ở `:0.3` dịch đúng là Tỳ-kheo-ni (không đổi thành Trưởng Lão Ni như các tiêu đề
    thi-ap2…thi-ap31, vốn xuất phát từ `therī` trong tên tệp). Đo `tỳ-kheo-ni` 9 phiếu trong
    tầng, không phân biệt chữ hoa.

  SỐ PĀLI — tự tính, in phép:
  - `satasahassa` = sata 100 × sahassa 1000 = 100.000 → một trăm ngàn (cp1:2.1 đã dịch
    `Kappe ca satasahasse` là trăm ngàn kiếp). `caturo asaṅkhiye` = bốn kiếp vô lượng, dùng
    lại nguyên văn cp1:2.2.
  - `dasabhikkhunīsahassāni` = dasa 10 × sahassa 1000 = 10.000 → mười ngàn. Đơn vị lớn: toàn
    tầng `sahassa` cho `ngàn` 137, `nghìn` 73; nghiêng về `ngàn` ở cả hai phạm vi, nên dùng `ngàn`.
  - `Paṭisambhidā catasso` = bốn (448 tệp đã dịch Bốn vô ngại giải); `aḍḍhamāse` = nửa tháng
    (aḍḍha nửa + māsa tháng). Bài không chứa `Tiṁsakappasahassa` hay cụm số chưa phân xử.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò toàn tầng, dùng lại nguyên văn bản dịch:
  - Trong 62 khoá, 17 khoá có Pāli trùng byte với một khoá đã dịch ở bài khác: 0.1 (9 dạng
    giống nhau), 1.2 (cp1), 12.4, 13.3, 13.2·14.2·15.2 (dấu lược, 711 lần), 14.3 (đa số 103/135),
    15.1 (453/459), 15.3 (422/459) đều dùng lại nguyên văn.
  - 7 khoá trùng Pāli nhưng bản Việt có chủ ý khác, mỗi chỗ có lý do:
    1.1 `Kappe ca satasahasse` — cp1 dịch Trong cả trăm ngàn kiếp vì sau đó là `etthantare`
    (khoảng giữa); ở đây không có chữ ấy mà chủ ngữ là Đức Dīpaṅkara xuất hiện, nên mốc thời
    gian lùi về trước, dịch Cách đây một trăm ngàn kiếp.
    8.1 `Anekajātisaṁsāraṁ` — bản cũ gộp luôn động từ `sandhāvissaṁ` của Pháp Cú; ở đây là tân
    ngữ/trạng ngữ đứng trước `bahuṁ puññampi no kataṁ`, nên không dùng lại.
    9.1 `Pacchime bhave sampatte` — một tiền lệ tha-ap21 dịch Khi đã thành tựu trong đời sau;
    `pacchima` là cuối cùng chứ không phải sau, nên viết Khi đời cuối cùng đã đến (đồng nhất
    với cách thi-ap31 đã hiểu `pacchime`).
    11.2 `pabbajimhanagāriyaṁ` — bản thi-ap31 viết họ xuất gia; động từ `pabbajimha` là ngôi
    thứ nhất số nhiều, nên bài này viết chúng tôi xuất gia.
    11.4 `sabbā pattāmha nibbutiṁ` — bản thi-ap31 viết đã đạt đến mọi sự tịch diệt, gắn `sabbā`
    (nom. nữ số nhiều) vào `nibbutiṁ` (acc. số ít) là không khớp; `sabbā` thuộc chủ ngữ, nên
    viết tất cả chúng tôi đã đạt đến sự tịch diệt.
    13.1 `Kilesā jhāpitā amhaṁ` — bản thi-ap31 viết Các phiền não đã thiêu rụi chúng tôi; `jhāpitā`
    là quá khứ phân từ bị động và `amhaṁ` là cách sở hữu, nên viết Các phiền não của chúng
    tôi đã được thiêu rụi (đúng công thức `mayhaṁ` có 127/130 phiếu thiêu rụi ở phạm vi tha-ap
    và thi-ap).
    14.1 `Svāgataṁ vata no āsi` — bản thi-ap31 viết sự đến của ta; vì cả bài và 13.3 dùng
    chúng tôi cho tập thể mười ngàn vị, nên viết sự đến của chúng tôi (công thức `me` đo được
    của ta 84/125 ở phạm vi tha-ap và thi-ap).
  - Trong chính bài này có 3 nhóm Pāli trùng nguyên văn (6.4 với 7.4; 10.3 với 12.1; 13.2,
    14.2, 15.2 là dấu lược); cả ba đã lặp y nguyên trong bản Việt, 0 cặp lệch. Pāli 5.4
    `mahāmune` và 6.4·7.4 `mahāmuni` chỉ khác biến cách hô cách nên cũng cho cùng một câu.
  - Lỗi bản nháp đã bắt: 10.3 và 12.1 ban đầu lệch chữ hoa (Pāli trùng byte), đã thống nhất;
    1.4 ban đầu viết Dẫn Lộ rồi đổi theo đa số phạm vi gần (xem dưới).

  THUẬT NGỮ — kèm số đếm:
  - `lokanāyako` → bậc Dẫn Đạo Thế Gian. Phạm vi gần (tha-ap và thi-ap, 25 phiếu): Dẫn Đạo 9,
    Đạo Sư 5, Dẫn Lộ 3, Dẫn Dắt 3; chọn Dẫn Đạo theo đa số. `jino` → Đức Chiến Thắng tên …:
    19/20 phiếu cùng phạm vi viết Chiến Thắng.
  - `mahāvīro` → bậc Đại Anh Hùng (13 so với Đại Hùng 3 so với đại dũng sĩ 2, toàn tầng).
    `mahāmuni`/`mahāmune` → bậc Đại Mâu-ni (23 so với Đại Muni 7 so với Đại Ẩn Sĩ 6).
    `vināyako` → bậc Điều Ngự (1 tiền lệ, vv16:7.1).
  - `nibbuti` → sự tịch diệt: tầng phân tán (tịch diệt 3, Niết-bàn 2, lắng dịu 1, tịch lặng 1),
    chọn tịch diệt theo thi-ap31:8.4 và để nhất quán trong cùng phẩm.
  - `pariccatta` → được từ bỏ (từ bỏ 10 phiếu ở nơi khác trong tầng cho `pariccaj-`); `paribhoga`
    → sự thọ dùng theo thi-ap31:2.3 (đã cho vì sự thọ dùng).
  - `annapāna` → thức ăn, thức uống: tiền lệ kp7:2.1·5.1 và pv5:2.1·4.3 (`Pahūte annapānamhi`,
    4 khoá cùng một dạng); các khoá ja dùng đồ ăn uống hoặc thức ăn uống, nên chọn dạng có 4
    phiếu. `senāsana` → chỗ ngồi nằm, theo tha-ap100:0.3 (Chỗ Ngồi Nằm); `vattha` → y phục.
  - `accharā kāmavaṇṇinī` → những tiên nữ mang nhan sắc khả ái, theo vv16:3.3 (tiên nữ mang
    nhan sắc khả ái); đây là danh từ đồng vị với chủ ngữ, không thêm từ so sánh.
  - Tên riêng giữ Pāli: Dīpaṅkara, Sumedha, Sumittā, Yasodharā (0 tiền lệ trong tầng Việt).

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - Chủ ngữ của `passanto`, `vicaranto` ở 3.1–3.2 (số ít, nam tính). Có thể là Đức Dīpaṅkara
    vừa nêu ở 2.1–2.2, có thể là chính các tỳ-kheo-ni (chủ ngữ số nhiều của `amhe` ở 3.3);
    bản Việt để câu mở, không gán chủ ngữ, nhưng nhịp câu dẫn người đọc đi theo cách hiểu thứ hai.
  - 2.3 `sumittañca`: đuôi `-aṁ` dùng chung cho Sumitta (nam) và Sumittā (nữ). Dịch Sumittā theo
    truyền thống chú giải (người vợ của Sumedha trong thời Dīpaṅkara); Pāli đã ghim không
    cho phép phân xử giới tính.
  - 2.2–2.4 `viyākāsi … samānasukhadukkhataṁ`: đọc `samānasukhadukkhataṁ` là danh từ trừu tượng
    làm tân ngữ (sự cùng chia sẻ vui và khổ như nhau); không thêm chữ tiên đoán hay chú nguyện.
  - 5.1 `Dānaṁ sīlamayaṁ sabbaṁ`: `sabbaṁ` đọc gắn với `sīlamayaṁ` (tất cả những gì thuộc về giới
    hạnh); có thể đọc `sabbaṁ` gắn với cả `dānaṁ`, ý nghĩa tổng không đổi.
  - 3.4 và 4.2 `samāgamaṁ`/`anāgatasamāgame`: dịch hội ngộ cho cả hai chỗ; ở 4.2 mang nghĩa lần
    gặp lại trong tương lai.
  - Ngôi nói của bài trộn: lời hứa 4.x là lời gửi đến Sumedha ở thời Dīpaṅkara (ngài), còn 5.4,
    6.4, 7.4 gọi bậc Đại Mâu-ni hiện tại; bản Việt giữ nguyên cách gọi của Pāli, không giải thích.
  - Bài này chỉ có một khoá dấu nháy mở (1.1) và một khoá đóng (15.3); nháy chạy qua ranh giới khoá
    là cố ý theo Pāli.

