  KIỂM TRA — các phép tự viết, quét mọi khoá:
  - Tập khoá Việt = tập khoá Pāli (62 = 62), đúng thứ tự Pāli.
  - Nháy đơn, nháy kép khớp Pāli từng khoá: 2 khoá có nháy ở Pāli (1.1, 15.3), 0 lệch.
  - Dấu lược: 3 khoá `…pe…` (13.2, 14.2, 15.2) → mỗi khoá đúng một `…`; Pāli không có `(…)`.
  - NFC, khoá rỗng, khoảng trắng thừa, Pāli lọt sang tiếng Việt (ngoài tên riêng): 0 lỗi.
  - Bốn lệnh cổng kỹ thuật của kho là `npm run validate`, `npm test`, `npm run check` và
    `npm run build`; lát này không tự chạy nên `technical_integrity` đặt 9.6 và không tuyên bố
