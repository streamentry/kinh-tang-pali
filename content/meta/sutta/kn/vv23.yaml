  **HAI CHỖ CỐ Ý KHÔNG NHÂN BẢN TIỀN LỆ, VÌ BẢN SẴN CÓ DỊCH SAI.**
  (a) `:6.2` `senāsanaṁ padīpiyaṁ;` — `vv25:5.2` dịch là *chỗ ngủ và thức uống;*. Pāli chỉ có
      `senāsana` (chỗ ở) + `padīpiya` (xa xôi); **"thức uống" không có trong Pāli** và
      `padīpiya` bị mất. Tôi dịch *cùng chỗ ở tận xa xôi;* — đây là loại lỗi
      *hallucination / unsupported addition* mà `AGENTS.md` xếp blocking, nên không thể nhân
      bản để giữ nhất quán.
  (b) `:8.3` `Saññamā saṁvibhāgā ca,` — `vv25:7.3` dịch *cả việc sát sinh lẫn sự chia phần,*
      tức đọc `saññamā` như giới cấm giết người. Sai: `saññamā` là **phép cư không nói lỗi /
      không chê bai**, còn giới cấm giết đã nói ở `:9.1` `Pāṇātipātā` rồi. Tôi dịch
      *không nói lỗi và có phần chia sẻ,*. Cùng câu kệ này còn xuất hiện ở `vv15`, `vv19`,
      `vv22`, `vv37` — **0** bài nào trong số đó đã dịch, nên 0 tiền lệ cho cách mới này;
      ghi ra đây để coordinator biết là chỗ cần thống nhất khi dịch tiếp.

  **MỘT CHỖ LỆCH ĐA SỐ CÓ LÝ DO.** `:11.3` `Vaṇṇo ca me sabbadisā pabhāsatī”ti.` — đa số
  đo được cho **đúng khoá này** là *và sắc tướng tôi chiếu sáng khắp mọi phương”.* (17/40),
  nhưng Pāli ở `:3.4` và `:11.3` là **cùng công thức**, chỉ khác sở hữu từ (`te` / `me`); nếu
  dịch hai vế khác nhau thì bài tự mâu thuẫn. Tôi dùng chung dạng của `:3.4`:
  *và dung sắc tôi chiếu sáng khắp muôn phương”.* Kèm theo đó, hai tiền lệ dịch `me` thành
  *"của ngài"* (ngài = khoản đối diện) là **sai sở hữu từ**; tôi tránh.

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `Soṇadinnā` (`:0.4`, `:5.1`, `:12.1`) — **0 tiền lệ trong toàn tầng**. Tên nữ thiên trong
    `Vimānavatthu Saṃyutta`; giữ nguyên Pāli. Lưu ý: `Soṇḍinnā` là tên khác trong cùng bộ,
    không phải một tên.
  · `nāḷandāyaṁ` (`:5.2`) — **0 tiền lệ**. `Nāḷandā` là **làng** gần Rājagaha, khác với
    `rājagahasmiṁ` (*thành*) ở `vv25:4.2` và `vv26:4.2`, nên tôi dịch *ở nơi Nāḷandā* chứ
    không dịch *thành Nāḷandā*.
  · `vippasannena cetasā.` (`:6.4`) — 19 tiền lệ nhưng **tản ra 10 cách**, không có đa số
    dù đo được (dẫn đầu *với tâm hoan hỷ tịnh tín.* 4/19). Bản đo đó **thêm** *"hoan hỷ"*
    mà `vippasanna` không có. Tôi theo `vv25:5.4` (*với tâm trong sáng thanh tịnh.*) — cùng
    nghĩa với Pāli và cùng dòng với `:6.3`.
  · `saṁvibhāgaratā sadā.` (`:5.4`) — chỉ **2** tiền lệ, mỗi cách 1: *luôn sẵn lòng chia
    phần.* (`vv25:4.4`) và *luôn hoan hỷ trong việc bố thí sẻ chia.* (`vv26:4.4`). Tôi theo
    `vv26` vì `vv23` cùng phẩm `Cittalatāvagga`.
  · `yā ca pakkhassa aṭṭhamī;` (`:7.2`) — 9 tiền lệ, đa số 5 là *Và ngày thứ tám nửa tháng;*
    tôi dùng đúng câu đó (hạ chữ hoa đầu câu).
  · `Pāṭihāriyapakkhañca` (`:7.3`) — chỉ 3 tiền lệ: *tuần lễ thần biến* (2) và *kỳ phép nhiệm
    màu* (1). Tôi theo nhánh 2.
  · `majjapānā` (`:9.4`) và `Theyyā ca aticārā ca` (`:9.3`) — dùng lại nguyên văn `vv25`
    (*cũng không rượu chè say sưa.* / *cũng không trộm cắp, không làm quá đà;*). Bản ấy ngắn gọn
    hơn nghĩa đen của `aticāra`; ghi ra đây để người biên tập xem có muốn siết không.

  **DẤU LƯỢC.** `:11.2` là `…pe…` → **đúng một** `…`. Không mở rộng ở bất kỳ khoá nào.

