  **Lượt cải thiện 2026-10-11 (kiểm toán đối kháng độc lập; 17/48 khoá đổi).**
  Đọc lại từng cặp Pāli↔Việt; đối chiếu tiền lệ bằng đếm toàn tầng `kn` và bài cùng khuôn `vv24`/`vv37`. Bản trước TỰ NHẬN 9,10/`published` nhưng có **7 khoá sai nghĩa thật** và **10 khoá lệch/thêm nghĩa nhẹ**; điểm bị hạ cho khớp sự thật (9,10 → 8,72).
  *Sai nghĩa thật (accuracy fix, 7):*
  · `:3.1` `Pucchāmi taṁ devi mahānubhāve` — `devi`/`mahānubhāve` đều **hô cách** (gọi nữ thiên), không phải tân ngữ; bản cũ viết *Tôi hỏi ngài … về đại oai lực ấy* (ngài ≠ nàng, và biến hô cách thành "về oai lực"). Nay *Tôi hỏi nàng, này thiên nữ có đại oai lực:* (cùng `vv33:5.1`, 5 khoá).
  · `:6.2` `senāsanaṁ padīpiyaṁ` — `padīpiya` = **đèn/ánh sáng** (cùng dòng `padīpeyya` trong công thức "chỗ nằm, chỗ ở, đèn" ở `iti75`, `cnd7`); đo toàn tầng: `vv24`, `vv37`, `ja524` đều dịch đèn. Bản cũ *tận xa xôi* là **bịa nghĩa** — chính ghi chú cũ khẳng định `padīpiya` = "xa xôi", sai. Nay *chỗ ở và đèn sáng;*.
  · `:8.3` `Saññamā saṁvibhāgā ca` — `saññamā` = **sự tự chế/thu thúc** (ablative, "nhờ"), không phải "không nói lỗi" (ghi chú cũ bịa nghĩa từ điển). Nay *nhờ tự chế ngự và biết chia sẻ,* (như `vv24:7.3`; `vv37:8.3` *nhờ tự chế và chia sẻ*).
  · `:8.4` `vimānaṁ āvasāmahaṁ` — `āvasāmi` = **cư ngụ**, không phải "thừa hưởng". Nay *tôi cư ngụ trong cung điện này.*
  · `:9.1` `Pāṇātipātā viratā` — `pāṇa` = **sinh vật**, bản cũ *sát người* thu hẹp sai (giới thứ nhất là sát sinh). Nay *Tránh xa việc sát sinh,*.
  · `:7.3` `Pāṭihāriyapakkha` — `pakkha` = **nửa tháng**, không phải tuần. Đo: *tuần lễ thần biến* 11 khoá (kn) vs *nửa tháng thần biến* 1 (`vv24:6.3`); đa số **sai nghĩa Pāli** nên không theo. Nay *cùng cả nửa tháng thần biến,*.
  · `:2.2` `kena te idha mijjhati` — `mijjhati` = **thành tựu/đạt kết quả**, `idha` = ở đây; *có được nơi này* biến động từ thành tân ngữ. Nay *Do đâu ở nơi đây nàng được thành tựu;* (đã quyết ở vv7 theo hướng dẫn họ vv). Cùng lỗi *có được nơi này* còn ở `pv13:11.2` (20), `vv1:7.2` (15), `vv85:3.2`, v.v. — ngoài lát, chỉ báo.
  *Lệch/thêm nghĩa nhẹ (10):* `:4.2` *truy hỏi* → *được … hỏi* (`pucchitā` chỉ là "được hỏi"; 16 khoá `vv1` dùng *truy hỏi*, 2 khoá dùng *được hỏi*); `:5.2` bỏ phân loại *nơi* (loại địa danh không phân xử được); `:8.1` `sadā` thuộc `:8.2`, không thuộc `:8.1` (bản cũ để *Luôn* ở sai khoá); `:8.2` bỏ *trong sạch* (`saṁvutā` = thu thúc); `:9.3` *không làm quá đà* → *không tà hạnh* (bối cảnh năm giới; `aticāra` đứng ở giới thứ ba); `:9.4` `ārakā` = *xa lánh*; `:10.1` bỏ *Luôn … gìn giữ* (Pāli không có `sadā`; `ratā` = hoan hỷ); `:10.2` bỏ *nhiệm mầu* (thêm nghĩa; `kovidā` = thông tỏ); `:10.3`–`:10.4` `upāsikā` giữ giống cái *nữ cư sĩ* và nối sở hữu *của Đức Gotama* như `vv24:9.3–9.4`.
  *Điểm hạ và lý do:* `source_provenance` 9,5→8,5 (khẳng định nguồn từ vựng trong ghi chú cũ không kiểm lại được/sai); `semantic_fidelity` 9,0→8,7; `grammar_logic` 9,0→8,8 (hô cách, thì động từ, ablative đã sửa nhưng công thức `:4.4` vẫn rút gọn); `terminology` 9,2→8,8; `triangulation` 7,5→7,0 (không có bản Anh; đối chiếu chỉ bằng tiền lệ Pāli trong tầng, không có từ điển); `vietnamese_clarity` 9,2→8,8; `han_viet_balance` 9,2→9,0; `ambiguity_integrity` 8,8→8,0 (bản cũ nói chắc nghĩa bịa). `segment_alignment` 10,0 và `technical_integrity` 9,6 giữ. `final_score` 9,10→8,72 (mean thô).
  *Cố ý KHÔNG đổi dù nghi ngờ:* `:6.3` `ujubhūtesu` *những vị chân thành* (`ujubhūta` sát nghĩa là *ngay thẳng*; giữ vì 8 khoá `vv`/`pv` cùng dùng *chân thành*, đổi một bài sẽ lệch tiền lệ — gợi ý người biên tập thống nhất cả họ); `:10.3` *Đấng Có Mắt Tuệ* (`cakkhumā` = "bậc có mắt"; *Tuệ* là thêm nhẹ nhưng 12/12 khoá cùng dùng); `:4.4` `yassa kammassidaṁ phalaṁ` — *quả báo của nghiệp này là thế* bỏ mệnh đề quan hệ "của nghiệp nào" (công thức chung toàn tầng); `:1.4` `osadhī … tārakā` = *sao mai* theo tiền lệ; tiêu đề `Itthivimāna` = *Nữ Hư Không* (không có `ākāsa` trong Pāli; lặp ~51 tệp `vv`, không sửa riêng một tệp).
  *Blocker còn lại:* chỉ blocker upstream (không có tầng tham khảo tiếng Anh). Các lỗi nghĩa nêu trên đã sửa trong lượt này nên không ghi thêm blocker. Cổng kỹ thuật vẫn chưa chạy (`npm run validate` · `npm test` · `npm run check` · `npm run build`); do `final_score` 8,72 ≤ 9,0, trạng thái theo cổng là `review`, chờ công cụ chấm cập nhật.

  **Đối chiếu độc lập 2026-10-14:** với bản Việt nguyên bài của Bhikkhu Indacanda. 2 khoá bất đồng nghĩa → sửa 1 (`4.4` `yassa kammassidaṁ phalaṁ`: trước “quả báo của nghiệp này là thế” → sau “đây là quả báo của nghiệp nào”, vì `yassa kammassa` là đại từ quan hệ-nghi vấn “của nghiệp nào”, không phải chỉ định “này”; bản nguyên bài cũng hiểu “nghiệp nào”; khớp `vv4:4.4`, `vv12:3.4`, `vv55:4.4`; đây đảo quyết định giữ nguyên theo công thức tầng ở lượt 2026-10-11), giữ 1 (`7.3` `pāṭihāriyapakkha`: bản nguyên bài viết “những ngày phụ trội của nửa tháng”, bản dự án giữ nghĩa đen “nửa tháng thần biến”, theo `pakkha` = nửa tháng). Bản nguyên bài (theo bản đọc khác) có thêm một khổ hỏi ở giữa và một khổ kết mà Pāli ghim không có; đó là phần thừa của bản nguyên bài, không tính bất đồng. Số: 14, 15, thứ tám (7.1–7.2), năm giới (10.1), thứ sáu (12.1) đều khớp. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

