notes: |-
  **Đo lại ba mệnh đề của lát (không suy từ tên thư mục).**

  - `0.1` `Jātaka` → giữ **Jātaka**: 400/416 tệp `ja` đã có (16 tệp dùng *Chuyện Tiền
    Thân*, đa số mạnh tuyệt đối).
  - `0.2` `Navakanipāta` → *Bộ Chín Bài Kệ*: khớp Pāli tuyệt đối, **6/6** tệp `ja`
    (`ja431`, `ja433`–`ja437`). Không có mâu thuẫn.
  - `0.3` `Gijjhavagga` → *Phẩm Hươu*: **6/6** cùng bộ sáu tệp nói trên.

  **Kinh tên.** `Mahāsuvajātaka` / `Cūḷasuvajātaka`: 0 tiền lệ cho hai tên này trong tầng
  Việt, nhưng `suvajā` = cây xoài có tiền lệ gián tiếp mạnh — `Amba` đã dịch *Xoài*
  (ja101 *Kinh Parosata* không, nhưng ja105 *5. Kinh Gỗ Yếu* không dùng; tiền lệ đo được
  là `Amba` → *Xoài* trong `4. Ambajātaka`, `Xoài`, `Kinh Xoài`, `Kinh Xoài Abbhantara`).
  Tôi đặt *Kinh Xoài Lớn* / *Kinh Xoài Nhỏ* theo đúng cặp `Mahā-`/`Cūḷa-` của Pāli.
  `:0.4` theo khuôn *N. Kinh Tên* đã có, và `:11.1` theo đúng 383 cặp
  `<tên>jātakaṁ <số thứ>` đã dịch (*Kinh X thứ ….*), `tatiyaṁ` → *thứ ba* khớp 42/42.

  **Công thức trùng nguyên văn — dùng lại, không dịch lại.** Tôi đo trùng Pāli trên
  toàn tầng Việt đã có (426 tệp `ja`): **35 khoá trùng nội bộ lát** (chủ yếu `ja429` ↔
  `ja430` ở `5.1–6.4`, `9.1–9.4`, `10.2–10.4`, và `7.3–7.4` ↔ `8.3–8.4` trong chính
  `ja429`) và **33 khoá trùng với tệp đã dịch**, trong đó 8 khoá của `ja429`:
  - `6.2` `pattayāna vihaṅgama;` → nguyên văn `ja297:1.2` (*hỡi kẻ có cánh đang sải cánh
    bay;*).
  - `9.2` `saha sabbehi ñātibhi;` → nguyên văn `ja398:7.2` = `ja399:7.2`
    (*cùng với toàn thể quyến thuộc bà con;*).
  - `9.1` `Evaṁ sakka sukhī hohi` là công thức `ja398:7.1` với `yakkha` đổi thành `sakka`,
    nên tôi giữ nguyên cách dùng (*Như vậy, … ngươi hãy vui*) thay vì tự đặt.
  - `6.2` chỗ khác trong lát phải dùng lại **y hệt** `ja430:6.2`.

  **Hai chỗ tôi dịch lệch tiền lệ, và lý do — đây là chỗ cần người biên tập xử lý.**
  `Taṁ nussahe jīvikattho pahātuṁ` (`4.3`) có tiền lệ **sai chiều** ở `ja378:2.3`:
  *Vì cần kế sinh nhai trẫm không thể từ bỏ*. Pāli là mệnh lệnh *(ta) khuyên nó từ bỏ
  để giữ mạng*; bản có sẵn thêm “không thể” và đảo thành *ta không thể bỏ*. Tôi dịch
  đúng nghĩa (*Ta khuyên nó bỏ đi cho giữ mạng*) và **không** sao chép lỗi. `ja378`
  không thuộc lát này nên tôi không sửa được — đề nghị sửa `ja378:2.3` cho khớp.

  **Ba câu tôi phải tự quyết, và ghi rõ là tự quyết.**
  - `2.1` `māmari`: tôi hiểu là “kẻ đi tìm ăn”, dịch *hỡi kẻ đuôi đỏ tìm ăn*. Từ điển
    không xác nhận chắc; 0 tiền lệ trong tầng Việt cho `lohitatuṇḍa` lẫn `māmari`.
  - `2.4` `na riñcasi`: `riñcati` nghĩa chính là *phá hủy*, tôi dịch *sao ngươi không
    phá nát cây khô ấy*; cách đọc “bỏ rơi” cũng có thể, nhưng sẽ trùng nghĩa với `2.2`
    (`jhāyasi` = ngồi) nên tôi chọn nghĩa *phá hủy*.
  - `6.1` `So te suva varaṁ dammi`: Pāli tự nó lệch — `So` là ngôi 3, `dammi` là ngôi 1.
    Tôi bám `So` (*Người ấy ban cho ngươi*) vì `7.1` (`dadeyya`, ngôi 3, “Ước gì **ông**
    ban cho ta”) chứng tỏ lời này là của người thứ ba nói về người thứ ba.

  **Dấu lược:** không có `…pe…` nào trong 45 khoá của bài này (đếm trên tệp Pāli), nên
  bản Việt không có dấu lược nào — khớp với `_hvi.lược`.

  **Không có tầng Anh.** 0/45 khoá có Anh Sujato; `ja429` không nằm trong 83 tệp `ja`
  đã ghim. Vì vậy `triangulation` ở mức thấp của lát và bài để `draft`.
