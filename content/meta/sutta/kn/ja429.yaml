  `npm test`, `npm run check`, `npm run build` còn phải chạy trước khi coi tiêu chí 10 là
  đạt.

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 15/45 khoá chênh lệch lớn nhất → khác nghĩa 0 trong danh sách đó: giữ 15 (chênh lệch là tên bài/phẩm và diễn đạt, vd `5.4` *người hiểu biết* / *bậc trí*, `6.2` bản mù gộp `pattayāna vihaṅgama` thành một cụm còn bản dự án giữ hai thành tố theo tiền lệ `ja297:1.2`, `7.3`/`8.3` cùng nghĩa), bất định 6 (bản mù ghi không chắc ở `2.1`, `5.1`, `5.2`, `6.3`, `7.4`/`8.4`, `8.2`, đều đã nêu ở trên; riêng `5.1` bản mù đọc `sakkhi kataṁ` là *tình bạn đã được lập nên*, nhưng khoá này không có chữ nào cho *tình bạn* nên bản dự án giữ *đã được làm chứng*). Rà đối kháng toàn bài ngoài danh sách phát hiện và sửa 1: `4.3` `Taṁ nussahe jīvikattho pahātuṁ`: *Vì cần kế sinh nhai, tôi không thể bỏ nó* → *Tôi, người đang cần kế sinh nhai, không thể bỏ nó*; Pāli chỉ có `jīvikattho` ở danh cách đồng vị với chủ ngữ, không có từ nào chỉ nguyên nhân; chữ *Vì* đã tự thêm chiều nhân quả, trái với lời ghi ở trên rằng câu giữ mơ hồ như Pāli. Quan hệ nhượng bộ hay nguyên nhân vẫn để mở theo Pāli; tôi nghiêng về nhượng bộ (cây đã khô, nên cần sinh kế là lý do để rời đi) nhưng không đủ chắc để đặt chữ *dù* vào thân kinh, nên ghi ở đây. Khoá song song `ja378:2.3` còn dịch theo chiều nguyên nhân (ngoài phạm vi, chưa sửa). Hệ quả cho điểm: `ambiguity_integrity` hạ vì ghi chú cũ nói giữ mơ hồ trong khi câu Việt không mơ hồ. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; quét có hệ thống Pāli trùng toàn kho: 18 khoá, chủ yếu ja430:5.1–10.4, cùng ja297:1.2, ja378:2.3, ja480 ×6, pv15/pv16/ja359/ja398/ja484/ja492 cho 9.2): sửa 3 khoá, chỉ dấu câu/khuôn — 2.4 bỏ dấu chấm thừa sau "?”"; 10.4 dời dấu chấm ra sau nháy đóng theo Pāli; 11.1 thêm dấu phẩy theo khuôn "Kinh X, thứ ba." của các bài khác. Giữ: 4.3 khác ja378:2.3 ("vì cần kế sinh nhai") có lý do đã ghi ở lượt 2026-10-14; mọi dòng trùng ja430 dùng cùng một bản Việt. Bất định giữ nguyên: `māmari` (2.1), `sakkhi kataṁ` (5.1), `madhutthiko` (7.4/8.4), `sahāva … udumbarena` (8.2).
