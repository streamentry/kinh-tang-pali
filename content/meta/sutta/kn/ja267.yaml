  tầng tham khảo English.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt mặc định chỉ quét khoá Pāli từ 40
  ký tự trở lên; ở Jātaka mọi vế kệ đều ngắn hơn ngưỡng đó nên phần chốt đó về bản chất KHÔNG chạy.
  Tôi tự quét lại toàn bộ 238 khoá của lát bằng script riêng, đọc thẳng từ tệp đã ghi trên đĩa:
  đủ khoá và không thừa so với Pāli gốc, không rỗng, chuỗi NFC, số dấu lược khớp TỪNG KHOÁ (Pāli có
  …pe… thì Việt đúng một …, Pāli không có thì Việt không có), không có (…) đứng một mình, vị trí
  ngoặc kép mở và đóng khớp PĀLI TỪNG KHOÁ (không chỉ tổng số trên cả bài), ngoặc kép cân trên
  cả bài, không chữ phiên tự, không còn sót thẻ chữ Pāli. Kết quả 0 lỗi trên 238 khoá / 14 bài.

  TÊN PHẨM, ĐÃ ĐO THEO BẢNG CHỐT VÀ THEO TẦNG. Tikanipāta → Bộ Ba Bài Kinh: đếm trên toàn tầng
  Việt TRƯỚC khi lát này ghi, đã có 24 tệp Jātaka và 15 tệp thag3/thig3 dùng đúng cách này, và KHÔNG
  tệp Jātaka nào dùng cách khác; cách Phẩm Ba Pháp chỉ do 50 tệp iti50..iti99 dùng mà tôi không đụng
  tới. Sau khi lát này ghi, con số Jātaka là 37/37. Tôi theo đa số TRONG CHÍNH TÁC PHẨM ĐANG LÀM theo
  BRIEF_VI3 §11, và cũng vì nó khớp song song với hai mục đã chốt là Bộ Một Bài Kinh và Bộ Hai Bài
  Kinh. Người điều phối gộp có thể muốn thống nhất cả tầng iti sau này, nhưng đó không thuộc lát này.
  Saṅkappavagga → Phẩm Suy Nghĩ (trước lát này 7 tệp, không lệch; sau đó 8); Padumavagga → Phẩm Bông
  Sen (trước 1 tệp, không lệch; sau đó 9, và cả chín tệp trong phẩm đều giống nhau); Udapānavagga →
  Phẩm Nước Uống (trước 4 tệp, không lệch; sau đó 8). Dấu uddāna: trước lát này đã đếm 22 tệp có
  dạng Kinh <tên>, thứ <từ>. và 3 tệp không có dấu phẩy; tôi dùng dạng có dấu phẩy, và đã kiểm
  bằng script rằng số thứ tự trong uddāna khớp số đứng trước mặt trong 0.4 của cùng phẩm, không suy
  từ tên uid.

  PĀLI TRÙNG NGUYÊN VĂN, ĐÃ DỰNG CHỈ MỤC BẰNG SCRIPT VÀ ĐÃ DÙNG LẠI. Tôi nạp 5.764 tệp Pāli
  gốc trong cache (bỏ mọi thư mục *.apfs-orphan) và 4.038 tệp Việt dự án, ghép theo khoá, rồi so
  TRÙNG NGUYÊN VĂN có chuẩn hoá hoa thường, khoảng trắng và dấu câu biên. Riêng lát này: 102 khoá
  trùng ở nơi khác; 52 khoá trùng đó đã có bản Việt ở bài khác, và tôi DÙNG LẠI NGUYÊN VĂN 51 khoá
  (39 khoá tiêu đề, 12 khoá thân kệ). Một khoá trong 52 là ngoại lệ có chủ ý: ja264:3.1 trùng nguyên
  văn với sn1.50:11.1, nhưng bản Việt đã có mở ngoặc kép ở đầu khoá trong khi Pāli khoá này không mở,
  nên tôi chép phần chữ và bỏ ngoặc kép thay vì chép y nguyên. Ngoài ra có 8 cả ván bốn vế trùng nguyên
  văn ở bài khác, và cả tám đều chưa có bản Việt để mượn. Trong lát này có 3 khoá trùng
  nguyên văn, đều là ba vế mở đầu lặp lại trong ja265; tôi đã dùng lại đúng một cách dịch cho cả
  hai lần, và script tự kiểm bắt được chỗ lệch nếu có.

  TÊN RIÊNG CÓ DẤU PĀLI, CỐ Ý GIỮ, KHÔNG BỎ DẤU. Jātaka, Tikanipāta, Sakka, Panāda, Missībhāvitthi,
  kāḷi, Jātavedas, Gāṅgā, Yamunā, Kassapa — tất cả giữ đúng dấu Pāli như tầng đang làm; tôi không
  bỏ dấu ở bất kỳ tên nào, kể cả tên không có bản Việt nào để đối chiếu.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  STATUS. Có một blocking error thật (thiếu hẳn tầng tham khảo English Sujato tại commit đã ghim), nên
  bài đặt draft bất kể final_score. Tôi không nâng điểm để né blocker, và cũng không hạ điểm để tỏ ra
  thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có
  tầng tham khảo nào.

  BA VÁN ĐẦU TRÙNG NGUYÊN VĂN VỚI JA389 (1.1-1.3), và 2.2 trùng với ja547 và tha-ap23. Nhưng cả
  ja389 và ja547 chưa có bản Việt trong tầng, nên không có gì để mượn; tôi dịch từ Pāli và ghi con số
  này vào đây để người gộp lát biết là đã có tiền lệ Pāli, chỉ là chưa có tiền lệ Việt.

  CHỖ CHƯA CHẮC. (1) Siṅgīmigo ở 1.1 là danh xưng của con cua, tôi dịch là con cua và bỏ chữ Siṅgīmigo
  vì không có cách Việt nào giữ được; nếu người biên tập muốn giữ danh xưng thì có thể viết Con Cua
  Siṅgīmi. (2) 3.3 Tesaṁ tvaṁ vārijo seṭṭho: vārija là loài cây mọc dưới nước, cũng có thể là kẻ sống
  dưới nước; tôi dịch là bậc tối thượng trong số những loài sống dưới nước ấy, chọn cách nào cũng giữ
  được nghĩa là ngươi là bậc cao nhất. (3) 3.4 muñca rodantiyā patin: rodantiyā và patin là số nữ và
  trạng ngữ, tôi dịch trung tính là kẻ đang khóc, kẻ đang chìm, để không bịa giống tính của nhân vật.
  (4) 1.4 pāṇasamaṁ là hình dáng như bàn tay, tức cái càng; tôi dịch là lấy càng giáng vào ta, và ghi
  vì pāṇi ở bài này là càng chứ không phải tay như ở câu chuyện khác.

  LƯỢT CẢI THIỆN 2026-10-13. Đọc đối kháng từng khoá cho thấy bản trước SAI NGHĨA ở hầu hết các khoá kệ, và các đoạn "CHỖ CHƯA CHẮC" ở trên (mục 1.1, 3.4, 1.4) mô tả bản cũ, nay đã thay: đừng đọc chúng như bản hiện hành. Ghi chú nhóm ở trên (mười ba bài, tên Sakka, Panāda, Missībhāvitthi, Jātavedas, Kassapa…) là ghi chú chung của lát cũ và không nói về bài này.

  Người nói, theo trình tự kệ và theo bản Anh trong ấn bản PTS (Rouse, Cowell chủ biên) mà tôi chỉ đọc qua bản tóm lược trên mạng để xác định người nói, KHÔNG phải tầng đã ghim và không chép câu chữ: kệ 1 voi đực (bị con cua kẹp) nói với voi cái; kệ 2 voi cái đáp; kệ 3 voi cái nói với con cua. Trong chính Pāli: 1.4 sợ bị bỏ rơi, 2.1 đáp "ta sẽ không bỏ ngài", và 3.4 rodantiyā là số nữ, patiṁ là chồng.

  Khoá đã đổi (12/17; các khoá tiêu đề 0.x và 4.1 giữ nguyên):
  - 1.1 "Con cua có đôi càng dài như sừng" → "Con thú có sừng, mắt dài" (accuracy fix): Pāli chỉ mô tả, không nói "cua" và không nói "càng"; āyatacakkhunetto là mắt dài. Semantic_fidelity 8.7 → 8.9.
  - 1.2 "đứng bằng đầu, thân ngập nước đầy" → "da bằng xương, ở dưới nước, không lông": aṭṭhittaco là da bằng xương, vārisayo ở trong nước, alomo không lông; "đứng bằng đầu" không có trong Pāli.
  - 1.3 "Sợ hãi điều ấy, con rùa kêu lên" → "Bị nó khuất phục, ta khóc thảm thiết": abhibhūta là bị khuất phục, không có "rùa" và không có "sợ hãi"; kapaṇaṁ rudāmi giống ja518:4.4, 5.4, 10.4 (3/3 dùng "khóc thảm thiết").
  - 1.4 "sợ nó lấy càng giáng vào ta" → "xin đừng bỏ rơi ta, kẻ quý như mạng sống": jaheyya là bỏ rơi, không phải giáng; pāṇasama là "quý như mạng sống", 3/3 chỗ gần nhất (ja533:21.2, ja502:11.2, ja464:3.2) cùng nghĩa. Ghi chú cũ "pāṇasamaṁ là hình dáng như bàn tay" là bịa nghĩa từ và đã bỏ.
  - 2.1 "Bạn à, ta sẽ không bỏ điều ấy" → "Thưa ngài, ta sẽ không bỏ ngài": ayya là lời thưa kính trọng, taṁ là "ngài", không phải "điều ấy".
  - 2.2 "con voi cao sáu mươi doanh" → "voi chúa sáu mươi tuổi": saṭṭhihāyanaṁ là sáu mươi tuổi, không phải đơn vị chiều dài; Pāli trùng nguyên văn ở ja547:76.2, 77.2 và tha-ap23:14.2 (3/3 đã dịch đúng "voi chúa sáu mươi tuổi"), nên dùng lại nguyên văn.
  - 2.3–2.4 "trái đất vắt ngang tới bốn cõi; với ngươi, ta thấy còn đáng yêu hơn trước" → "Trên mặt đất khắp bốn phương, ngài rất thân yêu đối với ta": bỏ "hơn trước" (không có trong Pāli) và "ngươi" (người nghe là ayya, không phải tvaṁ như ở kệ 3). Bản cũ cũng đảo vế.
  - 3.1–3.2 "Những ai lội qua biển cả, sông Gāṅgā và sông Yamunā" → "Những con cua nào ở trong biển cả, ở sông Gaṅgā và sông Yamunā": kuḷīrā là cua; "lội qua" bịa; "Gāṅgā" là lỗi chính tả (trong lớp Jātaka: 9 chỗ "sông Gaṅgā", 7 chỗ "sông Hằng", chỉ khoá này viết "Gāṅgā"; toàn tầng 96 "sông Gaṅgā" và 111 "sông Hằng").
  - 3.3 thêm "kẻ sinh trong nước" cho vārijo và "Trong số ấy" cho tesaṁ.
  - 3.4 "buông ra, kẻ đang khóc, kẻ đang chìm" → "xin hãy thả chồng của người đang khóc": patiṁ là "chồng" (accusative của pati), KHÔNG phải trạng ngữ "đang chìm"; ghi chú cũ về "số nữ và trạng ngữ" sai ở điểm này.

  Điểm đổi: source_provenance 9.4 → 9.2 (ghi chú cũ nói sai về chính bài này); semantic_fidelity 8.7 → 8.9; grammar_logic 8.7 → 8.9; terminology 8.8 → 9.0; triangulation 6.8 → 7.0 (đối chiếu thêm Pāli song song trong tầng: ja389, ja357, ja547, tha-ap23, và đọc truyện khung ngoài tầng; vẫn không có bản Anh hay Việt đã ghim); vietnamese_clarity 9.0 → 9.1. Các điểm khác giữ nguyên. final_score 8.86 → 8.93. Không nâng thêm vì bất định thật vẫn còn (dưới đây).

  BẤT ĐỊNH CÒN LẠI. (1) siṅgīmigo: siṅgī là "có sừng" nhưng cũng là "vàng" (an3.70:38.3 siṅgī suvaṇṇaṁ); tên ja389 Suvaṇṇakakkaṭa gợi con cua vàng. Tôi dịch "thú có sừng" (nghĩa gốc) và không phân xử được. (2) 1.4 jaheyya là số ba, chủ ngữ vắng; tôi dịch "xin đừng bỏ rơi ta" theo người nghe là voi cái (kệ 2 đáp lại); "quý như mạng sống" đối với ai cũng không nói rõ. (3) 2.3–2.4 pathabyā cāturantāya có thể là so sánh ("hơn cả đất bốn phương") hoặc ở vị trí ("trên đất bốn phương"); tôi chọn cách thứ hai vì ít giả định hơn và khớp bản Anh ngoài tầng. (4) 3.3 vārijo có thể là đồng vị của "ngươi" hoặc "(bậc tối thượng) trong loài sinh trong nước"; hai cách cùng nghĩa "ngươi là bậc đứng đầu". (5) aṭṭhittaco: "da bằng xương" (nghĩa đen), không dịch thành "vỏ" để khỏi thêm diễn giải.

  ĐÃ ĐO TIỀN LỆ. "kuñjaraṁ saṭṭhihāyanaṁ" trùng nguyên văn 3 chỗ khác, 3/3 bản Việt "voi chúa sáu mươi tuổi", dùng lại 1/1 khoá. Trùng nguyên văn trong chính bài: 0 cặp. Số Pāli trong bài: "sáu mươi" (saṭṭhi = 60), "bốn" (catu- trong cāturanta); không có phép tính khác.

  CHƯA XỬ LÝ NGOÀI PHẠM VI. ja389:1.1–1.3 có cùng Pāli với ja267:1.1–1.3 và hiện mang cùng lỗi ("con cua có đôi càng dài như sừng, đứng bằng đầu…", "con rùa kêu lên") nên cần sửa đồng bộ; ghi chú ja389 cũng nhầm "rùa" thay cho cua. Hai khoá 1.1–1.3 của hai bài vì thế đang lệch nhau; ja267 là bản mới đúng hơn.

  KỸ THUẬT. technical_integrity giữ 9.6: các lệnh npm run validate, npm test, npm run check, npm run build không được chạy trong lượt này. Tập khoá khớp Pāli 17/17, dấu nháy kép khớp Pāli từng khoá, NFC, không khoá rỗng.
