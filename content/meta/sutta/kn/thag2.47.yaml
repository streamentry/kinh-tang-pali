notes: |-
  KỸ THUẬT. Đợt này tôi KHÔNG chạy `npm run validate|test|build|check` — người điều phối
  cấm và chạy tập trung. Vì vậy tôi KHÔNG tuyên bố technical gate pass:
  `technical_integrity` chấm 9,6 chứ không phải 10,0. Bốn lệnh đó để người điều phối
  chạy lại.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG. `_hvi.kiểm` chỉ quét `cần` = khoá Pāli
  ≥ 40 ký tự. Ở bài này không khoá Pāli nào đủ 40 ký tự (khoá dài nhất chỉ 37), nên
  `cần` rỗng và vòng chốt NFC / trùng nguyên văn / Pāli lọt / số dấu lược KHÔNG chạy.
  Tôi tự quét lại TOÀN BỘ 13 khoá bằng chính các hàm đó (`_chk_w5.py`): mọi khoá có
  bản dịch, không khoá thừa/thiếu so với Pāli, thứ tự khoá khớp Pāli, chuỗi NFC,
  không Pāli lọt, số dấu lược khớp PẢNG khoá, ngoặc kép cân trên cả bài, không có
  `(…)`, không dùng `...` thay `…`.

  DẤU LƯỢC §10. Pāli `… Anūpamo thero ….` có HAI dấu lược (một ở đầu, một ở cuối,
  không phải `…pe…`), nên bản Việt giữ đúng hai: `… Tôn giả Trưởng lão Anūpamo ….`.
  `thag2.35:2.5` trong tầng chỉ giữ MỘT — lệch, nhưng khoá đó 28 ký tự nên chốt không
  bắt. Tôi không sửa `thag2.35` (ngoài lát); xin người điều phối chuẩn hoá.

  ĐẤU XUNG TÊN ĐANG TREO — ĐÃ ĐI THEO ĐA SỐ, GHI LẠI ĐỂ GỘP. `Dukanipāta` đang có
  hai cách trong tầng: *Bộ Hai Bài Kinh* và *Tập Kẻ Đau Đớn*. Trong CHÍNH phẩm
  Theragāthā/Therīgāthā đo được *Bộ Hai Bài Kinh* ở 8 bài (`thag2.1`, `thag2.2`,
  `thig2.1/2/3/5/8/9`) và *Tập Hai* chỉ 1 bài (`thag2.35`), nên tôi dùng *Bộ Hai Bài
  Kinh*. Khớp với `Ekakanipāta` → *Bộ Một Bài Kinh* (125 bài) và `Chakkanipāta` →
  *Tập Sáu* (2 bài) chưa thống nhất — việc chuẩn hoá cả dãy là của người điều phối.

  NHÁY KÉP. Pāli `thag2.47` mở `“` ở `1.1` và **không đóng** (thiếu `”ti.` — khác
  `thag2.3`–`thag2.9` vốn có). Tôi đóng lại ở `2.4` bằng `”.`; đó là dạng kết mà chính
  Pāli thag/thig dùng ở 2 khoá (`thag1.10`, `thag1.14`) và cũng là bản Việt của
  `thag2.1`/`thag2.2`. Lý do: `ngoặc()` của kho đòi nháy kép cân trên cả bài, và 143 bài
  thag/thig đã có đều cân.
