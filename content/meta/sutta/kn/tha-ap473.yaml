notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này (đo và bằng chứng ở `blocking_errors`).
  `translationTitle` đặt BẰNG khoá `:0.3`. Quy tắc đã chốt của lát: **giữ số thứ tự khi và chỉ khi Pāli `:0.3` bắt đầu bằng chữ số**. Pāli `tha-ap473:0.3` = `Naḷamāliyattheraapadāna` — bắt đầu bằng chữ N, không có số ⇒ **bỏ số thứ tự**, khớp với đa số kho. Tên Trưởng lão giữ nguyên Pāli: `Naḷamāliya` đã có sẵn trong tầng (tha-ap109:12.1, thi-ap5:10.1 và thi-ap5:11.1 với bản nữ `Naḷamālikā`), và khuôn `Bài Kệ Tuyên Ngợ Về Trưởng Lão X` chiếm 187/187 trong 196 `:0.3` mở đầu bằng cụm đó.
  Pāli trùng nguyên văn ở 22/33 khoá, tôi dùng lại **nguyên văn cả 22**: `Therāpadāna` (348×) · `Naḷamālivagga` → “Phẩm Vòng Hoa Sậy” (6×, và cả 6 bài đã có trong đúng phẩm này — tha-ap476, 477, 478, 479, 480, 482 — đều dùng y hệt, nên tôi theo cả 6) · `Suvaṇṇavaṇṇaṁ sambuddhaṁ,` → “Lên Đức Phật Chánh Đẳng Giác màu vàng ròng,” và `Āhutīnaṁ paṭiggahaṁ;` → “Bậc xứng đáng nhận lãnh phẩm vật cúng dường;” (mỗi câu 5×, và cặp này trùng nguyên văn với `tha-ap507`, `tha-ap514`, `tha-ap517`, `tha-ap510` — cùng khuôn khổ kệ) · `oghat iṇṇamanāsavaṁ.` → “bậc đã vượt qua bộc lưu, không còn lậu hoặc.” (1×) · `Pasannacitto sumano,` → “Với tâm tịnh tín hân hoan,” (36×, đa số áp đảo) · `Ekatiṁse ito kappe,` → “Vào ba mươi mốt kiếp trước đây,” (11×) · `Duggatiṁ nābhijānāmi,` → “Ta không biết mình rơi vào khổ đau,” (121×) · `buddhapūjāyidaṁ phalaṁ.` → “đây là quả báo của việc cúng dường Đức Phật.” (28×) · cả khối kết 5.1–7.4 (12 khoá, giống hệt tha-ap443 và tha-ap493) dùng nguyên văn `tha-ap453:6.1–8.4` và `tha-ap483:6.1–8.4` — 73× / 7× / 3× / 74× / 2× / 2× / 7× / 86× / 357× / 21× / 29× / 324× · `:8.1` trùng nguyên văn tuyệt đối với `tha-ap109:12.1`: “Tôi nghe như vầy: Tôn giả Trưởng lão Naḷamāliya đã nói những bài kệ này.”
  Ngôi thứ nhất chọn `ta` cho **toàn bộ** bài, không đổi giữa các khối, vì khối kết đã bắt buộc `ta` (đó là cách đã công bố của 271+ bài) và `tha-ap494` là mẫu nhất quán sẵn có trong tầng.
  Cố ý dịch khác tiền lệ ở `:1.3`: `Vipinaggena gacchantaṁ` có đúng **một** tiền lệ (`tha-ap446:1.3`) dịch thành “vần vò bay,” — nhưng `vipinagga` là “rơi vã, tản tơi”, và `tha-ap446` đang nói về **Đức Phật** đi bước với vòng hoa rơi rớt (`Sālarājaṁva phullitaṁ`), nên “vần vò bay” lệch nghĩa. Tôi dịch “ta đi lang thang với vòng hoa rơi rớt,” và dùng nhất quán với `naḷamāla` ở `:2.1` và `:4.2`. Đây là cố ý lệch có lý do, không phải trôi dạt.
  Bất định, ghi ở đây chứ không giải thích trong thân kinh: (1) `:1.1`–`:1.2` tôi đọc `Suvaṇṇavaṇṇaṁ sambuddhaṁ, Āhutīnaṁ paṭiggahaṁ` là **tân ngữ** chứ không phải chủ ngữ, vì `Āhuti` là hành động của Đức Phật chứ không phải của người kể; đó cũng là cách đọc của `tha-ap387`, `tha-ap507`, `tha-ap514`, `tha-ap517`, `tha-ap510`. (2) `Naḷamāliya` tôi giữ nguyên Pāli, không dịch nghĩa chữ nghĩa, vì bản nữ `Naḷamālikā` của thi-ap5 và thi-ap16 cũng giữ nguyên Pāli trong `:0.3` và `:10.1`; dịch khác sẽ làm hai bài anh em lệch nhau. (3) `nikkhamanto` (không có tiền lệ trong tầng cho dạng động từ này) = “bước ra”, tôi dịch “ta bước ra, đúng lúc ấy;”. (4) `:3.3` `Dakkhiṇeyyaṁ mahāvīraṁ` là hai danh từ ghép, tôi dịch “Đấng Đại Anh Hùng xứng đáng cúng dường,” ghép `mahāvīra` (tiền lệ: “bậc Đại Anh Hùng”, “Đấng Đại Anh Hùng”) với `dakkhiṇeyya` (“xứng đáng cúng dường”); chưa có nơi nào trong tầng dịch đúng cặp ghép này. (5) `sabbalokānukampakaṁ` = 0 tiền lệ, dịch theo nghĩa chữ nghĩa “đấng thương xót toàn thế gian”. (6) `Tatthaddasāsiṁ sambuddhaṁ` có 3 tiền lệ rời rạc (“Tại đấy tôi thấy Bậc Chánh Đẳng Giác” / “Tại nơi ấy, tôi nhìn thấy Đức Toàn Giác” / “tại đó ta đã thấy bậc Chánh Đẳng Giác”); tôi ghép hai cách đã có: “tại đó ta thấy bậc Toàn Giác,”.
  `Phẩm Vòng Hoa Sậy` — tôi dùng nguyên văn đã công bố của 6 bài trong phẩm, không tự đặt cách thứ 7, dù `naḷamāla` ở `:2.1` và `:3.2` tôi dịch “vòng hoa sen / chùm hoa sen”. Hai cách này cùng chỉ `naḷa` nhưng khác ngữ cảnh: `:0.2` là tên phẩm đã đóng bản, nên tôi không sửa tệp đã có.
  Không khoá nào trong 33 khoá của bài này có `…pe…` hay `…` trần ở Pāli (đã kiểm 33/33), nên không có dấu lược nào phải giữ, và không có chỗ nào bịa dấu lược để che chỗ thiếu. Nhân vật lời đối thoại không có `(…)` đứng một mình.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được phép chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đúng 33/33 khoá trong `all`, `set(khoá Việt) == set(khoá Pāli)`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá (0 = 0), ngoặc kép cân trên cả bài (1 mở ở `:1.1`, 1 đóng ở `:7.4`), không Pāli lọt, không trùng nguyên văn Pāli ở khoá có nội dung, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.