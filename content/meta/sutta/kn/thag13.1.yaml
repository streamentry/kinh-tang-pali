  BẤT ĐỊNH CÒN LẠI (ghi ở đây, KHÔNG thêm vào thân kinh).
    · `:3.2` `bāhirāsassa` — hapax trong tầng đã dò (0 hit Pāli khác). Có thể là `bāhira` + `āsa`
      (*hướng/ước vọng ra ngoài*) hoặc một cách đọc khác của `āsa`. Tôi dịch *hướng ra bên ngoài*
      (không thêm "chỉ" như Sujato, vì Pāli không có tiểu từ hạn định). Chưa có từ điển độc lập để phân
      xử giữa *hướng ra ngoài* và *ước vọng ngoài giáo pháp*.
    · `:1.2` `paddhagū` — nghĩa sát chữ là "người đi bộ theo/phục dịch". Sujato *footman*; tôi dịch
      *người hầu cận*. Tầng có 1 hit khác (`snp5.11:4.4` *tay sai*, nghĩa xấu) không hợp ngữ cảnh.
    · `:6.4` `nibbānamabhihāraye` — cách đọc `nibbānaṁ` là đích đến (*đưa mình đến Niết-bàn*, như
      Sujato) hay tân ngữ của `abhihāra` (*đưa/dâng Niết-bàn đến*). Tôi chọn cách đầu và lấy `attānaṁ`
      ở `:6.3` làm tân ngữ ngầm. Cách đọc sau không bị loại hẳn.
    · `:8.1` `paṭipādesiṁ` — dạng sai khiến của `paṭipajjati`; dịch *đã thực hành* (Sujato
      *practicing*). Sắc thái "làm cho vận hành" có thể có.
    · `:1.1` `Yāhu` — tôi đọc là `yo ahu` (*người từng …*), như Sujato (*who was special*).
    · `:14.2` `ekoyeva` — *chỉ một vị* (trong bộ này); tầng chưa có tiền lệ.
    · `:5.1`–`:5.2` và `:12.2`: lựa chọn từ nêu ở mục đo tiền lệ; không đổi nghĩa.

