  56/63 = 0,889 ≥ 0,80 chỉ để người biên tập tham khảo. Các điểm còn dưới 9,0 là `triangulation` 8.6
  (một tầng tham khảo độc lập, lệch Pāli ở bốn chỗ, vắng Việt hiện hành ở mức segment) và
  `ambiguity_integrity` 8.9 (sáu bất định ngữ pháp/từ vựng, chưa có từ điển độc lập). Nếu người
  biên tập muốn thận trọng hơn thì hạ hai điểm đó thêm một chút là đủ để bài về `review`; việc đó là
  lựa chọn của biên tập, không phải việc tôi làm âm thầm.

  CỔNG KỸ THUẬT CHƯA CHẠY — lát này bị cấm chạy lệnh npm.
  Bốn lệnh còn lại để người biên tập chạy trước khi coi `technical_integrity: 9.6` là đạt và để xác
  nhận `status: published` không đỏ: `npm run validate`, `npm test`, `npm run check`,
  `npm run build`.
