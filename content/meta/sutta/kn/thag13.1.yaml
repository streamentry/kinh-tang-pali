notes: |-
  Phạm vi: đủ 67/67 khoá Pāli root đã ghim, không khoá nào ngoài tập đó, thứ tự khoá bản Việt bằng
  thứ tự Pāli. Bài là đơn vị nguyên tử (không phải lát dở). Đã đọc hết 67/67 khoá Pāli rồi mới viết
  và đã in cặp PĀLI ↔ VIỆT ra đọc đối kháng một lượt sau khi ghi. Cấu trúc: bốn khoá đầu đề
  (`:0.1`–`:0.4`), 13 bài kệ (`:1`–`:13`; bài 5 và bài 7 có sáu pāda, bài 13 có thêm dòng bìa
  `:13.5` và dòng kết bộ `:13.6`), khối uddāna `:14.0`–`:14.4`. Toàn bài kệ nằm trong MỘT cặp nháy
  kép (`“` mở ở `:1.1`, `”` đóng ở `:13.4`): vị trưởng lão nói; `:1` nhắc đến Soṇa ở ngôi thứ ba nên
  giữ nguyên tên *Soṇa*, các bài `:7`–`:8` ngôi thứ nhất dịch *tôi* (cùng ngôi với `an6.55:25.2`).

  ⚠ MẪU SỐ COVERAGE THEO CỔNG = 0 — CỔNG NÀY KHÔNG ĐO ĐƯỢC GÌ.
  `source/layers.yaml` đặt `substantivePaliMinChars: 40`, `excludeReferenceBlock: true`. Khoá Pāli
  dài nhất của bài chỉ **26 ký tự** ⇒ **0/63** khoá thân (bỏ bốn khoá `:0.1`–`:0.4`) đạt ngưỡng, vì
  Theragāthā mỗi pāda một khoá. Đó là "không đo được gì", không phải "không cần ghi nhận gap". Quy tắc
  kho đặt tỉ lệ bằng 1 khi mẫu số bằng 0; con số ấy KHÔNG phải bằng chứng đối chiếu và tôi không dùng
  nó làm căn cứ để publish. Căn cứ thay thế là độ phủ thô đo trực tiếp ở dưới.

  TẦNG THAM KHẢO — tra bản chụp đã ghim, không suy từ tên thư mục.
    · `english-sujato`: CÓ tệp cho bài này (`thag` có trong tầng). Đo thô, không qua ngưỡng 40
      ký tự: **56/63** khoá thân có prose (**60/67** tính cả bốn khoá đầu đề) = **0,889** (0,896).
      Bảy khoá trống: `:13.5` (dòng bìa), `:13.6` (dòng kết bộ) và 5/5 khoá uddāna `:14.0`–`:14.4`
      — tầng Anh không phủ đúng các chỗ đó. Tập khoá Anh **bằng** tập khoá Pāli (67 = 67) và cấu
      trúc pāda khớp từng khoá, nên dùng được làm neo ở mức khoá. Đây là độ phủ thô để người biên
      tập tự phán, không phải coverage theo cổng; 0,889 ≥ 0,80.
    · `english-project`: không có tệp cho bài này.
    · `vietnamese-current`: vắng ở mức segment (lớp Bilara tiếng Việt tại commit ghim chỉ có 26 tệp
      Pháp Cú — đặc điểm của cả tầng ở `thag`, không phải thiếu sót của repo). Bản Việt nguyên bài
      của SuttaCentral (không phân đoạn) chỉ được tra ở mục *Tra cứu toàn văn* để so thuật ngữ, không
      phải tầng store, không sao chép. Ba tầng không vắng hết nên không dính điều kiện ép `draft`;
      `triangulation` đặt 8.6 vì chỉ có MỘT tầng tham khảo độc lập ở mức segment và tầng đó lệch Pāli
      ở một số chỗ (xem dưới), cộng với 7 khoá không có Anh.

  SUJATO LỆCH HOẶC THÊM SO VỚI PĀLI — Pāli thắng.
    · `:9.3` `abyāpajjādhimuttassa`: Sujato *dedicated to kindness* (đọc theo hướng tích cực).
      `abyāpajja` là *không ác ý*; chính tầng đã dịch cùng khoá này ở `an6.55:18.3` là *đã hướng tâm
      đến không ác ý* (cả đoạn văn xuôi `an6.55:10.2`–`:13.4` cùng dạng). Tôi dịch *không ác ý*,
      không đọc thêm "từ ái".
    · `:10.2` `asammohañca cetaso`: Sujato *clarity of heart*; Pāli `asammoha` = *không mê lầm* (theo
      `an6.55:19.2`). Giữ nghĩa phủ định của Pāli.
    · `:8.1` `samathaṁ paṭipādesiṁ`: Sujato *serenity of mind*; Pāli chỉ có `samatha`, **không có**
      `cetaso`/*của tâm*. Tôi không thêm.
    · `:3.2` `bāhirāsassa`: Sujato *concerned only with externals* (thêm "chỉ"). Tôi chỉ dịch phần
      Pāli chắc chắn (xem bất định).

  ĐO TIỀN LỆ — Pāli trùng nguyên văn (chuẩn hoá bỏ dấu câu/khoảng trắng) ở các bài khác của tầng.
  Đã dò toàn tầng sutta (loại chính bài này): **40 khoá** của bài có Pāli trùng ở bài khác, tổng
  **864** dòng trùng (số lớn do hai khoá `:0.3` = 124 dòng và `:8.4` = 608 dòng). Bản Việt của tôi
  **trùng một bản đã có trong tầng** ở **38/40** khoá và **khác** ở **2/40**: `:5.1`, `:5.2`
  (lý do ngay dưới). Nguồn các khối trùng: `thag1.15`/`dhp370`/`sn1.5` (`:2`), `dhp292`–`dhp293`
  (`:4`–`:5`), `dhp379` (`:6.3`), `an8.30`/`tha-ap` (`:7.2`, `:7.6`), và `an6.55` — bài văn xuôi cùng
  câu chuyện Soṇa, có đúng khối kệ này — trùng **17 khoá** (`:9.2`–`:9.4`, `:10.2`–`:10.4`,
  `:11.1`–`:11.4`, `:12.1`–`:12.4`, `:13.1`, `:13.2`, `:13.4`).
    · `:5.1`–`:5.2` `Yesañca susamāraddhā, niccaṁ kāyagatā sati`: `dhp293` (1 hit) dịch *Những vị
      khéo an trú, thường niệm thân*. **Khác có chủ ý**: `susamāraddhā` hợp giống cái với `sati`
      (niệm), là *đã được khéo khởi sự*, không phải "an trú" của người; và cùng gốc `ārabh` với
      `accāraddhamhi` ở `:7.1` (tầng dịch `accāraddhavīriya` là *tinh cần quá độ* ở `mn128`, 9 khoá,
      *tinh tấn quá mức* ở `an6.55:7.1`). Dùng *khởi sự* ở cả hai chỗ giữ được tiếng vang trong
      bài. Sujato cũng đọc *properly undertaken*. Không đổi nghĩa so với `dhp293`, chỉ chính xác
      hơn về ngữ pháp; đây là *terminology/accuracy fix* cục bộ.
    · `:2.1`–`:2.4` (kệ vượt bộc lưu): `thag1.15` và `dhp370` (2 bài, cùng dạng) *Hãy cắt năm, bỏ
      năm / và tu tập thêm năm / tỳ-kheo đã vượt khỏi năm trói buộc / được gọi là người đã vượt bộc
      lưu*; `sn1.5` (1 bài) *Năm điều nên cắt… vượt qua năm ràng buộc… được gọi là đã vượt dòng lũ*.
      Chọn dạng `thag1.15` (cùng bộ Theragāthā, 2 bài so với 1).
    · `:11.1`: `an6.55:20.1` *Với vị ấy, đã chánh giải thoát* (1) so với `an6.45:27.1` *Với người đã
      giải thoát chân chánh ấy* (1) — hòa 1–1; chọn `an6.55` vì là bài chị em của chính khối kệ này.
    · `:12.2`: `an6.55:21.2` *không bị gió lay động* (1) so với `dhp81`, `mil7.4.5` *lay chuyển* (2):
      tầng nghiêng về *lay chuyển* (2 so với 1); tôi giữ *lay động* theo `an6.55` để cả khối bốn
      pāda `:12`–`:13` đồng nhất với bài chị em. Cùng nghĩa, chỉ khác từ.
    · `:7.2` `satthā loke anuttaro`: 3/3 hit (`an8.30`, `tha-ap78`, `tha-ap199`) là *bậc Thầy tối
      thượng trong đời* — dùng lại nguyên văn. (Ghi chú tiền lệ `satthā` rời: trong `thag` *Đạo Sư*
      8 · *Thầy* 4 · *Bậc Thầy* 1; toàn tầng khác *Đạo Sư* 269 · *Thầy* 77.)
    · `:11.2` `santacittassa bhikkhuno`: bốn dạng (*tâm an tịnh*, *đã cắt đứt tham hữu*, *đã đoạn tận
      ái đối với hữu*, *với tâm đã tịch tịnh*); hai dạng sau là các khoá khác nghĩa; dùng dạng
      `an6.55:20.2` (cùng bài chị em).
    · `:7.5` `Tassāhaṁ vacanaṁ sutvā`: 14 hit, 9 dạng *Nghe lời ấy của người ấy*; ở đây "người ấy" là
      bậc Đạo Sư nên dịch *nghe lời ấy của Ngài* (tiền lệ `tha-ap189:10.1`, *Nghe lời ấy của ngài*);
      `ahaṁ` (tôi) để dành cho `:7.6` như các bài kệ cùng khuôn.
    · `:14.4` `gāthāyo cettha terasāti`: 1 hit cùng khuôn (`thag10.7:11.6`, *và có bảy bài kệ tại
      đây*) — theo khuôn đó (*và có mười ba bài kệ tại đây*). `thag12.2:13.4` dùng *câu kệ*; đếm theo
      `:1`–`:13` là **13 bài kệ** nên giữ *bài kệ*.
    · Pāli trùng nguyên văn **trong chính bài**: **1 nhóm** (`:13.5` `… Soṇo koḷiviso thero …` và
      `:14.1` `Soṇo koḷiviso thero,`) — Việt khác nhau đúng ở dấu lược và dấu phẩy, vì Pāli khác nhau
      ở dấu lược (`:13.5` có `…` hai đầu, `:14.1` không); **không phải lệch khoá**.

  ĐIỂM THUẬT NGỮ KÈM ĐẾM.
    · `samatha` → *tịnh chỉ* (`cetosamatha`: *tịnh chỉ của tâm* 2 khoá; các dạng khác: *an định*,
      *định tĩnh*, *vắng lặng*, *lắng dịu* mỗi dạng 1–3 khoá; không dạng áp đảo). Chọn *tịnh chỉ* vì là
      từ kỹ thuật đối với `vipassanā` (*quán*) và có tiền lệ đúng nghĩa.
    · `cakkhumā` → *bậc có mắt* (dạng danh xưng: *bậc có mắt* 12 · *bậc Hữu Nhãn* 2; 59 khoá *có mắt*
      còn lại là nghĩa "người có mắt" trong ví dụ, không tính).
    · `vīṇā` → giữ *đàn vīṇā*: 11 khoá ở **5 bài** (`an6.55`, `dn21`, `ja62`, `sn4.23`, `vv35`) so với
      *đàn tỳ bà* 13 khoá ở **3 bài** (`sn35.246` ×11, `sn35.248`, `vv58`). Đếm theo bài thì *vīṇā*
      nhiều hơn (5 so với 3), đếm theo khoá thì *tỳ bà* nhiều hơn (13 so với 11, do một bài dồn 11
      khoá). Chọn *đàn vīṇā* theo `an6.55:4`–`:6` vì đó là chính ví dụ này, cùng câu chuyện Soṇa.
      `vīṇā` là danh từ riêng giữ nguyên, ngoại lệ có chủ ý của quét "không Pāli lọt vào Việt".
    · `accāraddhavīriya` → *tinh tấn đã khởi sự quá mức* (`an6.55:7.1` *tinh tấn quá mức*; `mn128`
      *tinh cần quá độ*); `unnaḷa` → *kiêu mạn*, `pamatta` → *phóng dật* (`dhp292:3`).
    · `visaññutta` → *không bị trói buộc* (`sn36.6`, `sn36.7`, 2 bài). `an6.55:22.3` ở cùng khối kệ
      lại đọc `vippamuttaṁ` (*đã giải thoát*) — **hai văn bản Pāli khác nhau ở pāda này**, không
      phải hai cách dịch một chữ; tôi dịch đúng `visaññuttaṁ` của bài này.
    · `Aṅga` → *xứ Aṅga* (9 khoá; *vua Aṅga* 1, *người Aṅga* 5) ⇒ *vua xứ Aṅga*.
    · `Soṇa Koḷivisa`: `an1.205:1.1` *ngài Soṇa Koḷivisa*; đầu đề và colophon theo khuôn *Trưởng lão
      …* của `thag12.2`/`thag14.1`.
    · `Terasanipāta` → *Bộ Mười Ba Bài Kinh*: 4/4 bài `thag` khác có khuôn *Bộ … Bài Kinh* (`thag10.7`,
      `thag12.1`, `thag12.2`, `thag14.1`); đây là bài `thag13` duy nhất nên không có tiền lệ cùng bộ.
      `:13.6` *đã khép lại* (5 bài `thag`: `thag7.5`, `8.3`, `9.1`, `10.7`, `12.2`) so với *đã hoàn tất* (3 bài: `thag2.49`, `4.12`, `11.1`). `Tatruddānaṁ` → *Tóm tắt
      ở đây:* (11/12 hit). `mahiddhika` → *có đại thần thông* (`thag12.2:13.2`).
    · Ngôi kể: *tôi* trong `:7`–`:8` (`an6.55:25.2`, `thag12.2`).

  SỐ PĀLI — tự tính, in phép ra.
    · `pañca` (`:2.1`–`:2.3`) = **5**, bốn lần: cắt 5 · bỏ 5 · tu thêm 5 · vượt 5 trói buộc ✔ (khớp
      `thag1.15`, `sn1.5`, `dhp370`).
    · `tisso vijjā` (`:8.3`) = **3** minh ✔ (tiền lệ *ba minh*).
    · `ekoyeva` (`:14.2`) = **một** vị ✔. `terasa` (`:14.4`, và `Terasa-nipāta`, `terasamhi` ở `:14.3`,
      `:13.6`, đầu đề `:0.2`) = **13**. Đối chiếu nội bộ: đếm bài kệ `:1`–`:13` trong chính bài = **13**
      ✔. Không có `sattati`, `Tiṁsakappasahassa` hay số lớn nào.

  NĂM PHÉP KIỂM (kèm mẫu số).
    1. `set(khoá Việt) == set(khoá Pāli)`: **67 = 67**, thiếu 0, thừa 0, đúng thứ tự Pāli.
    2. Nháy đơn/kép **khớp Pāli từng khoá**: **0/67 lệch**; tổng `“` 1/1, `”` 1/1, `‘` 0/0, `’` 0/0.
       (Cấu trúc: `“` mở ở `:1.1`, `”` đóng ở `:13.4`.)
    3. Pāli trùng trong chính bài: **1 nhóm** (`:13.5` ≡ `:14.1`) — Việt khác có lý do (trên), chạy
       không rỗng nhưng chỉ một cặp.
    4. Dấu lược: `…pe…` **0** khoá; `…` trần **1** khoá (`:13.5`, Pāli `… Soṇo koḷiviso thero …` →
       Việt `… Trưởng lão Soṇa Koḷivisa …`, giữ **đúng hai** dấu lược, không chấm cuối vì Pāli không có
       chấm); `(…)` **0** khoá ở Pāli nên **0** ở Việt. Lỗi 0/67.
    5. Số Pāli: xem mục trên (5 ×4, 3, 1, 13).
