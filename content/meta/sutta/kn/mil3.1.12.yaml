notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim (`11c9d708978cde8ba61096d8a75f7ddfb846f639`), bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  - |-
    **Ba tầng còn lại là Pāli root và bản Việt dự án; tầng Anh và tầng Việt hiện hành đều vắng ở bài này.** Vì vậy `triangulation` bị ép 6.5: tôi dịch từ Pāli một mình, không có lớp nào để đối chiếu nghĩa. Đây là hạn chế thật của bản dịch, không phải khiêm tốn hình thức.
  - |-
    **Mọi công thức hội thoại đã có tiền lệ và tôi theo nguyên văn.** `Rājā āha—` → *Vua nói:* (đa số 29/44 tệp `mil`); `“Kallosi, bhante nāgasenā”ti.` → *“Khéo lắm, thưa tôn giả Nāgasenā.”* (46/50); `bhante nāgasena` → *thưa tôn giả Nāgasena* (109 lần so với 14 lần *bạch tôn giả* trong `kn/mil`); `“Opammaṁ karohī”ti.` → *“Xin hãy xét một thí dụ”ti.* (đúng `mil3.2.7:2.1` và `mil3.2.8:2.1`); `“Na hi, bhante”ti.` → *“Không phải vậy, thưa tôn giả”ti.*; `“Na hi, mahārājā”ti.` → *“Không có, này Đại vương”ti.* (đúng `mil3.5.7:1.3`). `3.4` `Bhāsitampetaṁ, mahārāja, bhagavatā—` dùng nguyên văn `mil3.4.4:2.5` → *Điều này, này Đại vương, Đức Thế Tôn đã nói —*.
  - |-
    **`Bhiyyo opammaṁ karohī` 0 tiền lệ trong tầng.** Tôi dịch *“Xin hãy xét một thí dụ nữa”ti.*, giữ cấu trúc `lại nữa, xin…` của `Opammaṁ karohī`. `upatthambha` (0 tiền lệ) → *thúc đẩy / ghì lại*; `vīriya` → *tinh tấn* (theo `vīriyindriyaṁ` = *tinh tấn căn* ở `mn70:20.3`).
  - |-
    **Lượt review đối kháng bắt được ba chỗ, đã sửa.**
    (1) `1.3` và `2.3`, `3.3`: nháp đầu đặt *này Đại vương* ở cuối câu, sai thứ tự Pāli (`Upatthambhanalakkhaṇaṁ, mahārāja, vīriyaṁ`) — đã sửa `1.3` thành *“Này Đại vương, dấu hiệu của tinh tấn là: …”*; hai khoản còn lại Pāli đã đặt `evameva kho, mahārāja` trước nên giữ nguyên.
    (2) `2.2` `aññena dārunā upatthambheyya`: nháp đầu dịch *người khác ghì nặng, ngăn lại* — `ghì nặng` là động từ của vật nặng, không phải của người. Đã sửa thành *người khác ra sức ghì lại*.
    (3) `3.2` `anussāreyya anupeseyya`: nháp đầu bỏ mất hai động từ *xem xét, thẩm định*. Đã sửa thành *thì vua phải tự mình xem xét, thẩm định, và ban thêm sức lực của mình cho đạo quân nhỏ ấy*.
  - |-
    **`Suddhamattānaṁ pariharatī` là một chữ hợp (`suddham attānaṁ`)**, không phải `suddham attā` + `naṁ`. Tôi dịch *Vị ấy tự chăm sóc mình trong thanh tịnh* — giữ `pariharatī` (tự gìn giữ) chứ không nới thành *giữ mình thanh tịnh*, vì `suddham` là cách, còn `pariharatī` là việc làm.
  - |-
    **Tiêu đề theo khuôn của các bài `mil3.1` đã có**: `mil3.1.8:0.3` *8. Câu hỏi về dấu hiệu của việc khéo tác ý*, `mil3.1.16:0.3` *16. Câu hỏi về việc nhiều pháp khác nhau cùng thành tựu một việc*. `Vīriyalakkhaṇapañha` → *12. Câu hỏi về dấu hiệu của tinh tấn*; `lakkhaṇa` → *dấu hiệu* theo chính `mil3.1.8`. Số thứ tự `dvādasamo` → *thứ mười hai*, khớp số 12 của bài.
  - |-
    Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 5 khoá bất đồng nghĩa → sửa 5, giữ 0, bất định 0 (riêng 3.2 còn một chỗ bất định về hai động từ, nêu bên dưới). Sửa: 2.2 (trước: «có người khi đang rơi xuống hố thì người khác ra sức ghì lại … không bị rơi xuống cái hố ấy» → sau: «khi ngôi nhà đang sập, có người dùng một thanh gỗ khác để chống đỡ; được chống đỡ như vậy thì ngôi nhà ấy không sập»; Pāli `gehe patante aññena dārunā upatthambheyya` — `geha` là ngôi nhà, `dāru` là thanh gỗ, không có cái hố nào; lỗi nặng, đổi hẳn hình ảnh ví dụ); 1.3, 2.3, 3.3 (trước: «dấu hiệu của tinh tấn là: được tinh tấn thúc đẩy thì…» → sau: «tinh tấn có sự chống đỡ làm dấu hiệu; được tinh tấn chống đỡ thì…»; Pāli `upatthambhanalakkhaṇaṁ vīriyaṁ, vīriyūpatthambhitā`: nội dung của dấu hiệu chính là `upatthambhana` (chống đỡ), bản cũ để mất từ này và đổi «chống đỡ» thành «thúc đẩy»; ví dụ ngôi nhà ở 2.2 đòi cùng một từ; tầng đã dùng «nâng đỡ» cho `upatthambha` ở `mil6.1.4:5.1`, `mil6.4.2:47.1`, `mil7.8.3:2.2` và «chống đỡ» ở `pe6:6.12`; chọn «chống đỡ» vì ví dụ là vật chống nhà); 3.2 (trước: «một đạo quân nhỏ tiếp phản một đạo quân lớn, thì vua phải tự mình xem xét, thẩm định … rồi cùng với nó mà đánh» → sau: đạo quân lớn có thể đánh tan đạo quân nhỏ, vua cho nhắc nhở lẫn nhau, phái thêm quân đến, ban thêm sức mạnh liền theo cho đạo quân nhỏ của mình, nhờ đó đạo quân nhỏ ấy đánh tan đạo quân lớn; Pāli `parittakaṁ senaṁ mahatī senā bhañjeyya` — chủ ngữ là đạo quân lớn, tân ngữ là đạo quân nhỏ, bản cũ đảo; `anussāreyya anupeseyya` không có nghĩa «xem xét, thẩm định» và `tāya saddhiṁ` là «cùng với sức mạnh ấy», không phải vua ra trận). Bất định ở 3.2: `aññamaññaṁ anussāreyya anupeseyya` là hapax trong Pāli ghim (không có chỗ thứ hai để đối chiếu); bản nguyên bài hiểu «có người báo cho vua, vua cho đội binh khác tiếp ứng», bản dự án đọc `aññamaññaṁ` là «lẫn nhau» và không bịa thêm chủ thể; hướng chung (vua tiếp viện cho quân yếu) hai bản trùng. Lượt review đối kháng thấy thêm: `Bhāsitampetaṁ` (3.4) mất sắc thái «cũng» (-pi), theo quy ước đã đo ở `mil3.4.4:2.5` nên giữ. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
