  `Āturānaṁ sadukkhānaṁ` (1.3). `āturāna` là “của loài người”, KHÔNG phải “bệnh tật”: đối chiếu trực tiếp với `tha-ap425:6.2` `āturānaṁ tikicchako` trong cùng tập — “Tikicchaka, người trong loài người”, cùng cách dùng đó. Đọc thành “[khổ đau] của người đời khó chịu đựng”, mệnh đề danh tỉnh với chủ ngữ ngầm. Cách đọc thay thế (chủ ngữ ở 1.3 là vế thứ hai `mahājanasukhāvaho`) không đổi nghĩa bản Việt.

  `Asoko nāma nāmena, / upaṭṭhāko vipassino` (3.3–3.4) — BẤT ĐỊNH, ghi rõ thay vì giấu. Chủ thể của cả cụm 3.1–3.4 là “vị sa-môn” mà ông chữa (`samaṇo saṁvutindriyo` ở 3.2), nên `Asoko nāma nāmena` = “Người tên Asoka”, tức tên của vị sa-môn ấy, không phải vị trưởng lão. Còn `upaṭṭhāko` thì có hai cách: (a) danh từ “kẻ hộ trì, kẻ hầu hạ” — tôi theo cách này, dịch “kẻ hộ trì, bậc quán sát”; (b) tên riêng `Upaṭṭhāka` — có tiền lệ trong chính phẩm này: `tha-ap182:9.5` `Tikicchako upaṭṭhāko` đã dịch “Tikicchaka và Upaṭṭhāka”. Cách (b) không dùng được ở 3.4 vì `vipassino` (bậc thấy rõ) không phải tên; nhưng người đọc hai bài kề nhau có thể thấy hai cách xử lý khác nhau cho cùng một từ, nên để người biên tập phán. `vipassino` dịch “bậc quán sát” theo 3 mẫu đã có trong tầng cho `pajahanti vipassino`.

  `osadhamadāsahaṁ` (4.2) — `osadha` là thuốc men/thang thuốc say, `osadhamadāsa` là người cho dùng hoặc dùng loại thuốc ấy; tôi dịch “khi tôi cho ông dùng thuốc men”, theo tiền lệ tầng đã dùng “thuốc men” cho `bhesajja` (`tha-ap440:9.4`). Bất định nhỏ: không phân biệt được chủ thể là người cho hay người uống.

  `bhesajjassa idaṁ phalaṁ` (4.4) dịch “đây là quả báo của việc chữa bệnh bằng thuốc”; `idaṁ phalaṁ` là mệnh đề danh tỉnh với chủ ngữ ngầm (“đây là quả của thuốc”), tiền lệ `tha-ap440:9.4` dùng “đó là quả báo của việc trao thuốc men”.

  `sabbosadhasanāmako` (5.2) giữ tên vua ở dạng Pāli `Sabbosadha`, theo 11 mẫu `sanāmakā/sanāmake` đã có trong tầng (“có một vị tên là …”, “vị vua mang tên …”). `sabbosadha` cũng nghĩa là “không bệnh”, nhưng ở vị trí tên riêng thì không dịch nghĩa, đúng như tầng đang làm với `Samuddakappa`, `Mahānelasa`.
