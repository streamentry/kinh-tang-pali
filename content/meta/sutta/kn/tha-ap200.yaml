  **Chỉ mục Pāli → Việt toàn tầng.** Đã dò **3138 cặp Pāli trùng nguyên văn**
  (mỗi khoá của bài này đối chiếu mọi bài khác có cùng chuỗi Pāli).
  **12 khoá dùng lại nguyên văn bản dịch đã có**: `Therāpadāna`,
  `Phẩm Tamālapupphiya`, `bậc Trưởng Thượng thế gian, đấng Nhân Ngưu;`,
  `của bậc hai chân đáng tôn kính ấy;`, `Nhờ tâm tịnh tín ấy,`,
  `được khích lệ bởi cội nguồn thiện căn;`, `Trong ba mươi nghìn kiếp,`,
  `tôi không còn đọa vào khổ xứ.`, `Thành tựu bảy báu,`, `Bốn vô ngại giải,`,
  `…`, `đã làm tròn lời dạy của Đức Phật”.` 12 khoá còn lại là Pāli không trùng
  nguyên văn ở bài nào khác nên phải dịch mới.
  **Thuật ngữ, đếm được.** `bhagavā` → *Đức Thế Tôn* (tiền lệ `tha-ap`:
  `“Siddhattho nāma bhagavā` → *Đức Thế Tôn tên Siddhattha,*). `jino` →
  *bậc Chiến Thắng* (9 khoá `tha-ap` dùng *Đấng*/*Đức Chiến Thắng*, 2 dùng
  *bậc*; chọn *bậc* để khớp dấu chấm câu liệt kê). `lokajeṭṭho narāsabho` →
  *bậc Trưởng Thượng thế gian, đấng Nhân Ngưu* (Pāli trùng nguyên văn 11 khoá:
  9 dùng đúng câu này, 1 dùng *bậc Tối Thắng của thế gian, bậc Bất Động*, 1 dùng
  *bậc tối thượng giữa thế gian…*). `Paṭisambhidā catasso` → *Bốn vô ngại giải*
  (357 câu trùng nguyên văn; 357 dùng câu này, 8 thêm dấu cách cuối — bản Việt
  ở đây bỏ khoảng trắng cuối theo đa số). `Therāpadāna` → giữ nguyên Pāli
  (356 câu, so với 9 câu *Trưởng Lão Ký Sự*). `Sattaratanasampanno` →
  *Thành tựu bảy báu* (16 câu trùng nguyên văn; 26 câu dùng *Đầy đủ bảy món báu
  quý giá* — chọn theo phạm vi gần nhất: phẩm `tha-ap203-212` dùng *Thành tựu bảy
  báu* 3 lần, *Đầy đủ bảy báu quý* 1 lần). `duggatiṁ nupapajjahaṁ` →
  *tôi không còn đọa vào khổ xứ* (Pāli trùng 7 khoá: 2 câu *đọa vào khổ xứ*, 2 câu
  *rơi vào khổ xứ*, 1 câu *sanh vào khổ xứ*, 1 câu *rơi vào đọa xứ*, 1 câu *rơi vào
  khổ đau nữa*). `kappasate` → *trăm kiếp* (32 khoá, ví dụ
  `Aṭṭhārase kappasate,` → *Vào một ngàn tám trăm kiếp trước,*), nên
  `Tevīsatikappasate,` = 23 trăm = *Vào hai ngàn ba trăm kiếp trước,*.
  **Tiền lệ = 0, nên giữ Pāli — không bịa nghĩa.** (a) `girinelasa` (2.3):
  quét toàn tầng `content/translation/vi/project/sutta/` cho `girinelasa` và
  `Girinelasa` cho **0** tiền lệ; cũng không dám dịch là *kim châm* vì không xác
  minh được loài cây. Giữ nguyên `girinelasa` như tên riêng. (b) `khattiya`
  (4.2): `khan hiệu` = 0, `sát chúa` = 0, `khan tước` = 0; chỉ có **1** tiền lệ
  `ja415` dịch `Ambaṭṭhakulassa khattiya` là *người kỵ sĩ*, nên dùng *vị kỵ sĩ*.
  (c) `Pacchime` (1.3): 0 tiền lệ trong toàn tầng `tha-ap`; dịch *Ở đời cuối cùng*
  vì `pacchime` là địa từ của ngữ cảnh `bhave` bị lược. Ghi rõ là **bổ sung ngữ
  nghĩa**, không phải chữ có trong Pāli.
  **Hai điểm còn phải cân nhắc, tôi ghi ra thay vì giấu.**
  (1) `Tena cittappasādena sukkamūlena codito` (3.1-3.2) đã có **2** tiền lệ
  nguyên văn ở `tha-ap187` và `tha-ap350`, cả hai đều dịch *sukkamūlena* là *cội
  nguồn thiện căn*. Tôi dùng lại nguyên văn theo luật 2, nhưng `sukkamūla` nghĩa
  đen là *gốc trắng* (tức gốc lành), nên cách dịch ấy còn nhiều chỗ phải suy. Đây là
  mức độ chắc chắn, không phải sai nghĩa giáo lýc.
  (2) `abhāsitthāti` ở `tha-ap200:6.1` là ngôi bị động (được cho là đã nói) nhưng
  câu đã có sẵn trên đĩa dịch thành mệnh đề khẳng định *đã nói*. Tôi **giữ nguyên
  câu đó** vì nó là văn bản đã có của bài này và là nguyên văn đã `published` ở
  25 bài `tha-ap` khác; tự sửa một khoá trong bài sẽ làm bài tự mâu thuẫn.
  **Về `ti` — đo ở phạm vi gần nhất, ghi cả hai số.**
  `Tamālapupphiyavagga` → *Phẩm Tamālapupphiya*: phẩm `tha-ap193-202` có 8 bài,
