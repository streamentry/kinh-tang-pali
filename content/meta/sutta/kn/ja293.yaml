  điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp (6.6) vì không có
  tầng tham khảo nào.

  Giải quyết draft 2026-10-12: kiểm toán độc lập 12 khoá thân kệ ja293 từ Pāli, đối chiếu tiền lệ trong kho. Sửa lỗi nghĩa thật ở 2.1: bản cũ "Cái đẹp bị gọi là xấu" đảo ngược Pāli `ajaññaṁ jaññasaṅkhātaṁ` (cái không đẹp/không quý mà được kể là đẹp/quý; cùng nghĩa `jaññajaññaṁ` "quý đẹp" ở mn5:29.7, mn5:30.7), nay là "Cái không đẹp mà được kể là đẹp"; 2.2 đổi "bị coi" thành "được xem" cho đúng chiều `sucisammataṁ`. Sửa tiếp: 1.2 `rogena bāḷhaṁ dukhitassa ruppato` → "vì bệnh mà đau khổ dữ dội, bị giày vò" (`bāḷhaṁ` là trạng từ của `dukhitassa`, không phải "bệnh nặng"; `ruppato` → "giày vò" theo sn9.2:2.4 và thag17.1:19.2, 2 trên 3 nơi dùng); 1.1 thêm "nào đó" cho `aññatarena`; 1.3 "khô lại" → "khô héo" cho `parisussati`; 1.4 "đem phơi" → "bị để" cho `kataṁ`, tách `paṁsuni` (trong bụi) và `ātape` (dưới nắng); 2.3 `kuṇapa` không còn dịch "ô nhiễm" (trùng với `asuci` ở 2.2 và 3.2) mà là "thối rữa", theo tiền lệ "xác thối" của kuṇapa trong kho; 2.4 bản cũ "mà người đời không thấy hình dáng đẹp" thêm chủ ngữ "người đời" không có trong Pāli (`apassato` chỉ là sở hữu cách "của/đối với kẻ không thấy") và đọc `jaññarūpaṁ` thành thứ người ta không thấy, ngược mạch bài kệ; nay "mang hình dáng đẹp đối với kẻ không thấy" (`apassato` không có tân ngữ nên giữ nguyên chỗ lược); 3.1 "Ôi khổ thay" → "Khốn thay" (`dhiratthu`; cùng đề tài thân xác ở thag4.4:1.1, thag20.1:5.3), `āturaṁ pūtikāyaṁ` → "bệnh hoạn, thối rữa"; 3.2 `jegucchiyaṁ` → "đáng ghê tởm" (dn23:9.29), `byādhidhammaṁ` → "có bản tính bệnh tật" (dn14:2.6.8–9, "mang bản tính bệnh"); 3.3 `adhimucchitā` "mê muội" → "mê đắm" (thag16.2:7.4, ja529:22.2: đắm, mê mẩn; "muội" là si mê, không phải `mucchā`); 3.4 `hāpenti` "bỏ mất" → "bỏ bê" và `sugatūpapattiyā` nay có đủ nghĩa tái sinh: "con đường dẫn đến sự tái sinh vào cảnh giới lành". Giữ nguyên tiêu đề, 0.1–0.4, 4.1 và mọi ranh giới khoá; ngoặc kép mở ở 1.1 và đóng ở 3.4 khớp Pāli. Số lỗi nghĩa thật: 2.1 (đảo nghĩa), 2.4 (thêm chủ ngữ, lệch mạch), 1.2 (lệch trạng từ), 3.4 (thiếu nghĩa tái sinh) = 4 trên 12 khoá thân kệ; các khoá còn lại là chỉnh thuật ngữ/độ sát.
  Phân loại blocker: (A) "Thiếu tầng tham khảo English Sujato…" GIỮ NGUYÊN, là sự thật của bản chụp upstream (do người biên tập đặt waiver no-upstream-english xử lý). (B) "Coverage tầng Anh … 0 trên 0 … thấp hơn ngưỡng 0.8" ĐÃ GỠ: mẫu số là 0 (mọi vế kệ ngắn hơn 40 ký tự) nên cổng không đo được gì, đó không phải lỗi văn bản; Sujato không có bài này nên không có đoạn Sujato để trống nào cần Pāli tự đứng vững riêng. Các khoá 1.1–3.4 đã được đọc lại từ Pāli một mình. (C) Việt hiện hành vắng vì snapshot chỉ có Pháp Cú, ghi như giới hạn tham chiếu, không phải blocker.
  Bất định còn lại: 2.4 `jaññarūpaṁ apassato` là cụm duy nhất trong kho (không có song song ngoài `jaññajaññaṁ` ở mn5), tôi đọc `jaññarūpaṁ` là thân "mang dáng vẻ đẹp" và `apassato` là "đối với kẻ không thấy [sự thật]"; hướng đọc thay thế là "kẻ không thấy dáng đẹp" ít hợp mạch nhưng chưa loại hẳn, nên `ambiguity_integrity` hạ xuống 8.8. Giáo nghĩa cả bài kệ (thân xấu uế mà bị tưởng đẹp sạch; người buông lung bỏ bê đường tái sinh lành) không đổi theo cách đọc nào. `triangulation` 6.8, không có bản Anh độc lập, chỉ đối chiếu Pāli và các cặp song song trong kho. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này; `technical_integrity` giữ 9.6.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
