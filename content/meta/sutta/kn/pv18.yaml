notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv18_root-pli-ms.json` (86/86 khoá, đủ và đúng thứ tự Pāli). Bài chưa có bản dịch trước đó; đây là lần dịch đầu.

  - Tầng tham khảo:
    Tầng `english-sujato` không có pv18; `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Coverage English: mẫu số = 0 — không khoá Pāli nào đạt ngưỡng 40 ký tự (khoá dài nhất 28 ký tự), nên cổng coverage không đo được gì; một ô English rỗng không phải bằng chứng đồng thuận về cách dịch. Vì ba tầng đều vắng, `triangulation` đặt 7.5 (không quá 8.0) và bài giữ `draft` với blocker `noEnglishEditionUpstream`. Không có bản English độc lập nào được đối chiếu. Nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài, và các bản dịch Việt của dự án cho các bài có kệ trùng hoặc gần trùng (ja454 Kinh Bậc Hiền Trí Ghaṭa, pv8, ja352) — đây là bản dịch Việt của chính dự án, chưa phải bản English độc lập.
  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” giữ nguyên (36/36 tệp pv đã có cùng dạng). `0.2` “Ubbarivagga” giữ nguyên Pāli như pv14, pv20, pv22, pv23 (cùng phẩm).
    + `0.3` “6. Chuyện Ngạ Quỷ Kaṇha” theo khuôn “N. Chuyện Ngạ Quỷ …” của pv10, pv22, pv31 (tên riêng giữ dạng Pāli). `21.1` “Chuyện ngạ quỷ Kaṇha, thứ sáu.” (`chaṭṭhaṁ` = thứ sáu) theo khuôn colophon pv8, pv10, pv14.
  - Số Pāli — tự tính:
    + `chaḷaṅgaṁ` (13.2) = cha 6 + aṅga = sáu chi phần; `chaṭṭhaṁ` (21.1) = thứ sáu; số `6.` ở `0.3` do Pāli ghi sẵn. Không còn số nào khác.
  - Người nói và ngôi (suy từ chính Pāli, không từ chú giải):
    + Kệ 1: một người nói với Kaṇha (kệ 2 gọi là lời của Rohiṇeyya). Kệ 2: lời dẫn. Kệ 3–5, 7: Kaṇha nói với em; kệ 6, 8–15: người em nói (Ghaṭa, theo kệ 19–20); kệ 16–18: Kaṇha. Kệ 19–20: lời dẫn. Pāli chỉ nêu tên Ghaṭa ở 19.4 và 20.4, nên bản Việt không điền tên ở các kệ trước.
    + Dấu nháy kép khớp Pāli từng khoá: mở ở 1.1, 2.1, 6.1, 7.1, 8.1, 16.1; đóng ở 1.6, 5.4, 6.4, 7.4, 15.4, 18.4. Pāli mở nháy ở 2.1 mà không đóng, và không mở nháy ở 3.1; bản Việt giữ nguyên như vậy (không cân từng khoá, không thêm dấu).
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + Pāli trùng nguyên văn với khoá ở bài khác: 43 khoá (không tính `0.x` trừ khi trùng). Dùng lại nguyên văn bản dịch (bỏ dấu câu cuối): 31 khoá; số khoá bản Việt khác tiền lệ: 12 (2.2, 3.2, 3.3, 10.1–10.3, 12.1, 17.1, 17.2, 18.1, 18.2, 19.3), lý do ở các mục dưới.
    + `10.1`–`10.3` `Na mantā mūlabhesajjā, osadhehi dhanena vā; sakkā ānayituṁ`: ja454:10.1–10.3 dịch “Không bằng thần chú … có thể mang trở lại được” — phủ định `na` ở đầu không còn phủ định động từ `sakkā ānayituṁ`, đọc ra thành khẳng định. Bản này đặt phủ định lên động từ: “… đều không thể mang trở lại” (accuracy fix cho bản này, không sửa ja454 vì ngoài lát).
    + `sasa` → “thỏ” (ja454, 1/1 tiền lệ). `jappati` (1.6) → “lẩm bẩm” và `lapasi` (3.3) → “lảm nhảm”: giữ hai động từ khác nhau như Pāli. `ja454:1.6` điền tên “Ghaṭa” vì Pāli ja454 có `Ghaṭo`; Pāli pv18 không có nên bản này không điền.
    + `kiṁ nu ummattarūpova` (3.1) → “Sao ngươi như kẻ mất trí”: pv8:1.1 và pv51:1.1 (2/2) dùng “mất trí”, ja454:3.1 “phát điên” (1/1); chọn dạng đa số.
    + `khattiya` (11.2, 12.1) → “Sát-đế-lợi”: đo trên tầng, `kn` 47 khoá “Sát-đế-lợi” so với 11 khoá “quý tộc”; `sn`, `an`, `dn`, `mn` gần như toàn “Sát-đế-lợi” (37/50, 113/113, 129/132, 120/120). Pāli `raṭṭhavantopi khattiyā` dùng lại nguyên văn sn1.28:1.2 (1/1). `12.1` khác ja362:4.1, ja474:8.1, ja487:11.1–13.1 (5/5 dùng “Quý tộc, bà-la-môn, thương buôn”) ở đúng một chữ: để cùng một từ `khattiya` ở 11.2 và 12.1 trong cùng bài khỏi dịch hai cách. `12.2` dùng lại nguyên văn 5/5 tiền lệ (“thợ thuyền, cùng người hạ tiện caṇḍāla hay dọn rác pukkusa”).
    + `amacca` (20.2) → “đại thần”: đo `kn`, `sn`, `an`, `dn`, `mn` cho 40 khoá có `amacca`, “đại thần” chiếm đa số (kn 3/6, sn 4/12, an 1/5, dn 16/17); ja454:11.1 dùng “cận thần” (1/1) không theo. `paricāraka` → “người hầu cận” (ja455, ja476).
    + `ajarāmarā` (11.4, 12.4, 13.4): ja433:1.2 `ajarāmaro` → “không già, không chết”. Pāli `tepi no ajarāmarā` được hiểu là “họ cũng không phải là kẻ không già không chết” (`no` = phủ định). Ba khoá có Pāli trùng nguyên văn trong bài và dùng cùng một bản Việt.
    + `maṇimayaṁ` (4.1) → “bằng ngọc báu”, `lohamayaṁ` (4.2) → “bằng đồng” (ja449:3.2, ja454:4.2, snp3.10:22.1 3/3), `rūpiya` → “bạc”, `saṅkhasilāpavāḷamayaṁ` (4.3) dùng lại nguyên văn ja454:4.3.
    + `tapassī` → “vị khổ hạnh” (24 khoá có `tapassī` trong tầng; snp2.7:2.2, sn42.12:16.1, dn25:9.4 dùng “khổ hạnh”); `saññatatta` (14.2) → “tự chế, sống khổ hạnh” theo snp2.7:2.2 (Pāli trùng, 1/1). `bhāvitatta` (15.1) → “đã tu tập tâm” (iti68:3.3, iti84:5.2, iti104:3.3). `katakiccā anāsavā` (15.2) dùng lại nguyên văn tha-ap292:3.2 và thag1.120:3.2 (2/2). `puññapāpa` → “phước và tội” (snp3.6:20.1, sn3.22:4.4).
    + `Nikkhipanti imaṁ dehaṁ` (15.3) → “buông bỏ thân này”: sn35.87:13.9 và mn144:13.9 `nikkhipati kāyaṁ` → “buông bỏ thân” (4 khoá của tầng dùng “buông bỏ”/“xả bỏ”).
    + `17.2` `sokaṁ hadayanissitaṁ` → “nỗi sầu nương trong tim”: pv8:6.2 (1/1) dịch “cắm sâu trong tim”; chữ “sâu” không có căn cứ Pāli nên bỏ.
    + `18.1`–`18.2` `Svāhaṁ abbūḷhasallosmi, sītibhūtosmi nibbuto`: pv8:7.1–7.2 dịch “hết nỗi khó đau của mình … mát lạnh, đã tịch tịnh”; ja454:14.1 “đã được rút mũi tên ra”. Chọn “mũi tên” vì Pāli `salla` “mũi tên” (và `abbahī sallaṁ` ở 17.1).
    + `19.1`, `19.2` dùng lại nguyên văn ja454:15.1 và 15.2 (cùng ja352:8.1, pv8:8.1). `19.3` `Nivattayanti sokamhā` đổi “quay lại khỏi” thành “quay khỏi” cho tự nhiên.
    + `20.3` `Subhāsitena anventi` → “họ đi theo bằng lời khéo nói”: `anventi` “đi theo” (ud7.4:4.5, tha-ap138:2.4, vv16:1.4; 3/3). Vế sau `ghaṭo jeṭṭhaṁva bhātaraṁ` dùng lại như 19.4.
  - Trùng nguyên văn trong bài: 1 nhóm Pāli trùng (11.4 = 12.4 = 13.4, 3 khoá); 0 nhóm có bản Việt khác nhau. `3.4` và `5.4` khác nhau một chữ Pāli (`ī`) và cùng một câu Việt.
  - Bất định — ghi lại, không thêm vào thân kinh:
    + `Rohiṇeyya` (2.2): Pāli chỉ nêu tên; không xác định là ai. Bản dịch dùng “tức Rohiṇeyya” để nối đồng vị với `tassa` ở 2.1.
    + `vātā balīyanti` (1.5): “cơn gió … đang mạnh lên” theo nghĩa đen; có thể là cách nói y học cổ về chứng loạn tâm do gió (vāta), Pāli không giải thích trong bài. Giữ nghĩa đen như ja454:1.5.
    + `sako bhātā` (1.3), `bhātusoka` (2.4), `bhātika` (18.4): Pāli chỉ nói “anh/em”. “Em ruột”/“em trai” suy từ `jeṭṭhaṁ bhātaraṁ` (19.4, 20.4: Ghaṭa với anh cả).
    + `Kaṇhapetavatthu` (0.3, 21.1): hợp từ `Kaṇha` + `peta` + `vatthu` có thể đọc “chuyện ngạ quỷ Kaṇha” theo khuôn tiêu đề của bộ, hoặc “chuyện về người đã khuất (của) Kaṇha” vì `peta` ở 10.4 là “người đã chết”. Bản dịch theo khuôn tiêu đề bộ Petavatthu; không khẳng định Kaṇha là ngạ quỷ.
    + `chaḷaṅgaṁ brahmacintitaṁ` (13.2): “có sáu chi phần, do Phạm thiên nghĩ ra”; `brahma-` có thể là “Phạm thiên” hoặc “thiêng liêng/bà-la-môn”. Chọn nghĩa ít giả định nhất; tầng chỉ có mil5.3.7:6.1 và mil5.5.11:9.1 nhắc `chaḷaṅga` (Vệ-đà).
    + `ete caññe ca jātiyā` (12.3) và `… vijjāya` (13.3): đọc `jātiyā`/`vijjāya` là cách phân loại “theo dòng dõi”/“theo học thuật”; Pāli không có động từ riêng, nghĩa còn mở.
    + `yathaññamanusāsasi` (8.2): “như ngươi đang khuyên bảo người khác”; `yathā` có thể chỉ cách (như ngươi khuyên) hoặc chỉ sự so sánh; chọn cách đọc sát chữ.
    + `Subhāsitena anventi` (20.3): chủ ngữ `amaccā paricārakā`; tân ngữ “người chủ” không có trong Pāli, bản dịch không điền. “Bằng lời khéo nói” có thể gắn với `anventi` (đi theo/tìm đến) hoặc đọc là cách họ khuyên.
    + `jīvitaṁ madhuraṁ` (7.1–7.2): “đời sống ngọt ngào” theo nghĩa đen `madhura`; theo ja454.
    Vì các chỗ trên và thiếu bản Anh độc lập, `semantic_fidelity` 8.7 và `ambiguity_integrity` 8.7.
  - Kiểm tra: 86/86 khoá đúng tập và thứ tự Pāli; NFC, không khoá rỗng, không khoảng trắng thừa; nháy kép “ ” khớp Pāli từng khoá (12 khoá có dấu), nháy đơn 0/0; dấu lược `…` 0/0 (Pāli không có), `(…)` 0; không Pāli lọt vào thân bản dịch ngoài tên riêng và thuật ngữ giữ nguyên (Petavatthu, Ubbarivagga, Kaṇha, Kesava, Rohiṇeyya, Dvārakā, Ghaṭa, caṇḍāla, pukkusa). Đã đọc đối chiếu từng cặp Pāli↔Việt.
  - technical_integrity 9.6: cổng kỹ thuật do người điều phối chạy — npm run validate; npm test; npm run check; npm run build.
