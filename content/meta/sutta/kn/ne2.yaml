notes: |-
  Đã đọc HẾT vc/p74.txt trước khi viết. Bài này là cả phần `Uddesavāra` của Netti:
  16 `hārā`, lần lặp của chúng, 5 `nayā`, lần lặp của chúng, rồi 18 `mūlapadāni` và uddāna.

  TIỀN LỆ ĐÃ ĐO.
    · `:0.1` `Netti` giữ PĦLI: **17/17** tệp `ne` có khoá này.
    · `:0.2` `Paṭiniddesavāra` → *Phần Giải Thích* ở 17/18 tệp `ne` có `0.2` (chỉ `ne35` giữ
      PĦLI) ⇒ tôi theo khuôn *Phần …*. `Uddesavāra` có **0** tiền lệ nên *Phần Tuyên Chúng*
      là do tôi đặt; tầng `name` đã ghim đặt `ne-uddesavara` là *Specification Section*.
      Người biên tập có thể chọn *Phần Chỉ Định* nếu thích bám Sujato.
    · `hārasampāta` → *nhóm phương thức …* ⇒ `hārā` → *phương thức*; `Tattha katame X?` →
      *Ở đây, X là gì?* — đúng khuôn `ne22/ne23/ne25/ne26`.
    · `Niyutto X` → *X đã được vận dụng* (ne22–ne34).

  MƯỜI SÁU `HĀRĀ` — tôi lấy tên từ chính mười sáu tệp `hārasampāta` mà tầng đã dịch
  (ne22–ne35, đúng là cùng danh sách mười sáu mục), nên bài này khớp với chính tầng `ne`:
    desanā → *đề ra*; vicaya → *tích lũy*; yutti → *lý luận*; padaṭṭhāna → *nền tảng ứng với*
    (ne23); lakkhaṇa → *dấu hiệu* (ne24); catubyūha → *bốn phần* (ne25); āvaṭṭa → *quy căn*
    (ne26); vibhatti → *phân loại* (ne11/ne12); parivattana → *chuyển đổi* (ne28);
    vevacana → *diễn đạt bằng lời*; paññatti → *định danh* (ne30); otaraṇa → *dẫn đưa*
    (ne31 ghi *vượt bậc*); sodhana → *thanh tẩy* (ne32); adhiṭṭhāna → *áp dụng* (ne33);
    parikkhāra → *trợ duyên* (ne34); samāropa → *gom góp* (ne35 giữ PĦLI, 0 tiền lệ).
    `1.2` liệt kê đủ 16, và `3.1–4.4` lặp lại đúng 16 tên ấy — tôi dùng **y hệt** cả hai
    chỗ, không đổi một tên trong lần lặp.

  HAI CHỖ TẦNG THAM KHẢU SAI — tôi KHÔNG nhân bản, nhưng không sửa tệp ngoài lát.
    · `ne22:0.4` `Yuttihārasampāta` đang dịch *Nhóm Phương Thức Dấu Hiệu*, nhưng *dấu hiệu*
      là `lakkhaṇa` (đã dịch ở `ne24` và `ne8` là *Dấu Hiệu* / *Đặc Trưng*). `yutti` là *lý
      luận / lý do*. Đây là **lỗi ánh xạ** trong tầng tham chiếu.
    · `ne29:0.4` `Vevacanahārasampāta` đang dịch *Nhóm Phương Thức Dùng Ngữ Đồng Nghĩa*, nhưng
      *ngữ đồng nghĩa* là `sutamaya`; `vevacana` là *diễn đạt bằng lời*.
    Cả hai đều nằm ngoài lát c74 nên tôi chỉ ghi ở đây cho coordinator sửa.

  BẤT ĐỊNH — đã phán, đáng để người biên tập xem lại.
    · Năm `nayā` (`6.2`, `8.1–9.4`): `nandiyāvaṭṭo` → *tuyên thuật làm vui lòng*;
      `tipukkhalo` → *chất đống ba tầng*; `sīhavikkīḷito` → *đánh bóng như sư tử*;
      `disālocano` → *soi như gương*; `aṅkuso` → *cây gai đẩy*. **0 tiền lệ** cho cả năm;
      đây là dịch nghĩa theo tên gốc, không phải chuyển tự.
    · `11.3–11.4` `Satamekañca gāthānaṁ, navakañca taduttari` — `meka` không tra được nghĩa;
      tôi đọc `satameka`/`navaka` như số đếm (tám bài kệ, chín bài kệ) vì uddāna đếm của
      `Therāpadāna` (`14.3–14.4`: *bốn mươi hai bài kệ, và một nghìn bốn trăm bài*) cũng đếm
      bằng số. Đây là chỗ dễ sai nhất của bài, ghi rõ để người biên tập phán.
    · `13.2` `Kusalāni ca yāni tīṇi mūlāni` dịch *là những nền tảng thiện, ba gốc rễ*;
      không rõ `tīṇi mūlāni` ở đây chỉ ba cái nào.
    · `14.5` `Uddesavāro.` là dấu kết phần ⇒ *Hết phần Tuyên Chúng.*

  BỐN CHỖ ĐÃ SỬA SAU KHI ĐỌC LẠI TẦNG `ne` (lượt review đối kháng).
    Bản nháp dùng `Tứ Giác` cho `satipaṭṭhāna` và *vùng đất của giác quan* cho `indriyabhūmī`,
    nhưng đếm lại thì tầng đã có sẵn: `ne8:8.2` dịch `satipaṭṭhānesu` thành *bốn sát phạn*
    (3 lần) và `indriya` thành *căn* (`ne8:8.1` *căn sắc*, `ne8:9.2` *căn khỏe*,
    `ne24:2.2` *căn sáu*). Đã sửa thành *Bốn sát phạn* và *vùng đất của các căn* — bám tầng
    thay vì đặt từ mới. Tương tự, `vipallāsa` ở `ne8:8.2` là *đảo ngược* ⇒ `12.3` sửa thành
    *Bốn sự đảo ngược*.

  NHÁY KÉP. PĦLI của bài này có **0** dấu mở / **0** dấu đóng ⇒ bản Việt cũng không nháy kép.

  DẤU LƯỢC. 0/47 khoá có `…pe…`.

  CỔNG KỸ THUẬT CHƯA CHẠY — agent dịch không được chạy lệnh npm.
    Đã xác minh bằng script: JSON hợp lệ, đủ 47/47 khoá, 0 orphan, NFC, dấu lược khớp,
    ngoặc kép cân (0/0 = PĦLI), không PĦLI lọt. Bốn lệnh để coordinator chạy:
    `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  GIẢI QUYẾT DRAFT 2026-10-12 (thay thế các mục cũ nêu dưới đây; mục cũ giữ lại làm lịch sử).
    Đã đọc đối kháng toàn bài từ Pāli, đối chiếu tầng `ne` đã có (ne1, ne3, ne4, ne5, ne7, ne10, ne15, ne31, ne36, ne37).
    35/47 khoá đổi; trong đó 18 khoá là lỗi nghĩa thật, 17 khoá là chỉnh thuật ngữ/khuôn cho khớp tiền lệ.

    LỖI NGHĨA THẬT (18/47):
      · `1.2`, `3.1`: `vicaya` dịch *tích lũy* là sai (đó là `ācaya`/`upacaya`); `vicaya` = khảo xét/tra xét
        (ne1:4.1, ne3:3.4, ne5 tiêu đề). `1.2`, `4.1`: `vevacana` dịch *diễn đạt bằng lời* là sai; đó là *ngữ đồng nghĩa*
        (ne3:11.4, ne13, ne29: 5 tệp / 34 dòng). Mục cũ nói *ngữ đồng nghĩa là `sutamaya`* là sai và bị bỏ.
      · `5.3–5.4` `Etesañceva bhavati, vitthāratayā nayavibhatti`: bản cũ đọc *chúng cũng là chính những ấy, được chia thành
        các lối kể* — thiếu `vitthāratayā` (do khai triển rộng) và đọc `nayavibhatti` thành động từ; nay là *sự phân chia các lối*.
      · Tên năm `naya` (`6.2`, `8.1–8.4`, `9.1`, `9.3`): bản cũ tự đặt *tuyên thuật làm vui lòng / chất đống ba tầng /
        đánh bóng như sư tử / soi như gương / cây gai đẩy* và ghi "0 tiền lệ" — sai: ne3:18.4–22.4, ne4:27.1, ne36:9.11, 54.4, 63.1
        đã có *vòng xoay hoan hỷ / ba cánh sen / đùa giỡn của sư tử / nhìn khắp các phương / móc câu*, và khớp từ nguyên
        (`āvaṭṭa`, `pukkhala`, `vikkīḷita`, `disā-locana`, `aṅkusa`). Đã dùng lại đúng các tên ấy. `8.4` *được trang sức bằng
        các lối ấy* là sai; `nayalañjaka` đọc là *sự chỉ bày các lối* (xem bất định).
      · `10.3`, `12.1`: `taṇhā` dịch *tham* là sai; tiền lệ là *tham ái* (ne3, ne4, ne37:2.3). `lobho` là *tham*
        (ne5:18.2, ne7:1.6, ne10:12.5) nên `10.3`, `12.2` đổi *tham lam* thành *tham*; `moho` là *si* (ne5, ne10), không phải *si mê*.
      · `11.2`: `asubhasaññā` dịch *tưởng bất thiện* là sai nghĩa; đúng là *tưởng bất tịnh* (ne7:1.16, ne12:5.5).
      · `14.1–14.2`: *chín nền tảng kia là thiện, chín nền tảng kia hợp với phần bất thiện* — `kia` không có trong Pāli;
        `navahi padehi` ở cách công cụ (bằng chín nền tảng). Nay: *các thiện có chín nền tảng, và các phần bất thiện được
        kết hợp bằng chín nền tảng*.
    CHỈNH THEO TIỀN LỆ (đã đo): `samatha` → *chỉ* (34 dòng so với *định tĩnh* 20; ne3:18.2); `vipassanā` → *quán* (52 so với *tuệ quán* 6);
      `lakkhaṇa` → *đặc trưng* (8 tệp/64 dòng so với *dấu hiệu* 5 tệp/13 dòng); `vipallāsa` → *đảo lộn* (ne3:20.1, ne19, ne36:10.12);
      `saṅgahaṁ samosaraṇaṁ gacchati` → *quy tụ, hội nhập* (ne37:319.4, cùng công thức); `Tassānugīti` → *Lời kệ nối theo phần ấy*
      (ne3:3.2, ne5:54.2 dịch `anugīti` là *lời kệ nối theo*; *Sự lặp lại* chỉ xuất hiện ở chính bài này, 2 khoá);
      `Tatridaṁ uddānaṁ` → *Tóm tắt ở đây:* (`Tatruddānaṁ` 21 khoá cùng cách); `6.1` bỏ *kể*, *ấy* không có trong Pāli;
      `5.2` bỏ *rõ*, *lý* không có trong Pāli; cuối `1.2`/`6.2` `iti` → *— như vậy*.
    TIÊU ĐỀ `0.2`/`14.5`: `Uddesavāra` đổi *Phần Tuyên Chúng* thành *Phần Liệt Kê*. *Tuyên Chúng* không có căn cứ trong Pāli
      (`uddesa` là phần nêu danh mục, đối với `niddesa`/`paṭiniddesa` = *Chỉ Rõ*/*Giải Thích*); 0 tiền lệ cho cả hai cách.
      `translationTitle` đã đổi khớp. Người biên tập có thể chọn *Phần Chỉ Định* nếu thích bám tầng `name`.

    MỤC CŨ BỊ THAY THẾ / SỬA SỰ THẬT: (1) "Năm `nayā` … 0 tiền lệ" — sai, xem trên. (2) "`11.3–11.4` `Satamekañca gāthānaṁ…`" và
      "`14.3–14.4` uddāna của `Therāpadāna`" — Pāli của ne2 không có `11.4` và không có câu ấy; mục này mô tả văn bản khác,
      bỏ. (3) "ne8 dịch `satipaṭṭhānesu` là *bốn sát phạn*" — sai: ne8:8.2 là *bốn niệm xứ*; thân bài vẫn dùng *niệm xứ*.
      (4) "`vevacana` → *diễn đạt bằng lời*", "`vicaya` → *tích lũy*" — sai, xem trên. (5) "`14.5` → *Hết phần Tuyên Chúng*" — nay *Hết phần Liệt Kê*.
      (6) Lời "NHÁY KÉP / DẤU LƯỢC" vẫn đúng: 0 nháy kép, 0 `…pe…`, 0 `(…)`.

    BLOCKER ĐÃ GỠ: câu thứ hai ("`vietnamese-current` chỉ có Pháp Cú, không có Netti") — đây là giới hạn của tầng tham chiếu upstream,
      không phải lỗi văn bản; ghi lại ở đây, `triangulation` vì thế ≤ 8,0 (nay 7,0).
    BLOCKER GIỮ: câu thứ nhất (không có bản Anh Sujato cho `ne2` tại commit đã ghim, `not-published-upstream`) — sự thật về upstream,
      để cổng waiver `no-upstream-english` của người biên tập xử lý. Không có blocker loại (B): không có tầng English để đo coverage.

    BẤT ĐỊNH CÒN LẠI (không có bản Anh độc lập để phán):
      · `8.4` `nayalañjako`: đọc `lañjaka` là *chỉ bày, làm hiện rõ* (+ `naya`); chưa kiểm được qua nguồn thứ hai ⇒ đây là chỗ yếu nhất.
      · `14.2` `yujjanti` + `14.1` `navahi ca padehi kusalā`: đọc thiện và bất thiện cùng "chín nền tảng" (đúng với ne37:530 nói hai vùng
        đất mỗi bên chín mục); nghĩa chính xác của `yujjanti` (kết hợp / đối ứng) chưa phân xử.
      · `13.2` `Kusalāni ca yāni tīṇi mūlāni`: đọc là ba thiện căn (vô tham, vô sân, vô si) — khớp phép cộng 2 + 3 + 4 = 9 của uddāna.
      · `quy căn` (`āvaṭṭa`) giữ theo ne3:8.4, ne26 dù từ nguyên gần *xoay vòng*; đây là quy ước của tầng, không phải phán quyết ở bài này.
      · `hārā` = *phương thức* (ne1, ne20–ne34) còn ne3–ne19 dùng *hướng dẫn* — lệch trong tầng, bài này giữ *phương thức*.
    LỖI NGOÀI LÁT (chỉ báo): `ne22:0.4` dịch `Yuttihāra…` là *Dấu Hiệu* (đó là `lakkhaṇa`; `yutti` là lý luận); `ne37:531.1–2`
      dịch *chín nền tảng kia* có `kia` thừa (cùng Pāli với `ne2:14.1–14.2`); `ne2` và `ne37:531` chưa đồng nhất cách dịch.
    CHẤM LẠI: nguồn 9,5→9,5; nghĩa 9,1→8,8; ngữ pháp 9,2→8,9; thuật ngữ 9,0→8,9; đối chiếu 7,2→7,0; sáng rõ 9,0→8,8; Hán–Việt 9,1→9,0;
      bất định 8,4→8,6; căn khoá 10,0; kỹ thuật 9,6 (cổng chưa chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`).

  Lượt cải thiện 2026-10-13: đọc đối kháng lại 47/47 khoá từ Pāli, đo tiền lệ bằng số đếm; đổi 9/47 khoá, 38 khoá giữ nguyên.
    Căn cứ: Pāli của nhiều khoá trùng nguyên văn với tệp `pe1` và `pe9` (cùng bộ ba bài kệ mười sáu phương thức, năm lối, mười tám nền tảng).
    · `8.3` → *có tên là đùa giỡn của sư tử* (trùng Pāli `pe1:19.3`); `9.3` → *thứ năm có tên là móc câu* (trùng Pāli `pe1:20.3`);
      `9.1` → *Người ta gọi là nhìn khắp các phương* (trùng Pāli `pe1:20.1`; `ne3:19.4`, `ne3:21.4` cũng dịch `āhu` là *người ta gọi*). Bản cũ *gọi là* / *Họ gọi* lệch.
    · `12.2` → *tham, sân, và si nữa* (trùng Pāli `pe9:55.2`, `pe1:28.2` cùng cách); `12.4` → *là vùng đất của phiền não, chín nền tảng* và
      `13.4` → *là vùng đất của các căn, chín nền tảng* (trùng Pāli `pe9:55.4`, `pe9:56.4`; `pe1:28.4`, `pe1:29.4` cùng khuôn). Bỏ dấu gạch ngang tự đặt.
    · `14.3` → *đây là những nền tảng gốc*: bỏ *quả thật* cho `kho`. Đo `kho` trong tầng `ne`+`pe`: 143/148 khoá không dịch riêng; *quả thật* chỉ ở 5 khoá. Cũng khớp
      `ne37:531.3` (cùng Pāli, ghi *Đây là những nền tảng gốc*).
    · `14.1`, `14.2`: bản cũ *Các thiện có chín nền tảng* thêm động từ *có* không nằm trong Pāli. `navahi padehi` là cách công cụ, và `yujjanti` ở `14.2` gánh cả hai vế
      (cùng ý với `pe1:30.1`–`30.2`, `pe9:57.1`–`57.2` *được kết hợp bằng chín nền tảng*). Nay *Các thiện được kết hợp bằng chín nền tảng* / *và các phần bất thiện cũng được
      kết hợp bằng chín nền tảng*.
    Giữ nguyên dù có nghi ngờ (đã đo): *Ở đây, … là gì?* cho `Tattha katame` — tầng `ne` 127/127 dùng *Ở đây*, tầng `pe` 350/350 dùng *Trong đó*, bài này theo `ne`;
      *tham ái* cho `taṇhā` — `ne` 31 so với *ái* 5, toàn `kn` 204 so với 104; `tưởng tịnh` cho `subhasaññā` — `pe` 4 khoá, `ne7:1.7` dịch *tưởng sắc đẹp* (lệch, ngoài lát);
      `nayalañjako` → *sự chỉ bày các lối* — cùng Pāli, cùng cách dịch ở `pe1:20.2`, nhưng đó là tầng dự án, không phải nguồn độc lập nên bất định không giảm.
    Số cặp Pāli trùng nguyên văn đã dò: 21 khoá của bài trùng với tệp khác trong `ne`/`pe`/`mil`/`cnd`/`mnd`/`ps`; 11 khoá trong đó bản Việt từng khác, nay còn 4 khoá khác có lý do:
      `6.1`, `10.1` theo *Ở đây* của `ne`; `12.1` giữ *Tham ái và cả vô minh* theo `ne` (`pe9:55.1` ghi *Ái và vô minh*); `14.2` khác vì `ne37:531.2` chép thừa *kia*.
      Trùng trong chính bài: 1 cặp (`2.1`, `7.1`), bản Việt giống nhau.
    Bất định còn lại: `8.4` `nayalañjako`; `5.3`–`5.4` `Etesañceva bhavati, vitthāratayā nayavibhatti` (đọc `etesaṁ` là sở hữu, `bhavati` là *có*; không có nguồn thứ hai để phán);
      `13.2` `Kusalāni ca yāni tīṇi mūlāni` đọc là ba thiện căn theo phép cộng 2 + 3 + 4 = 9; `14.1`–`14.2` động từ ở `14.1` được bổ sung từ `yujjanti` và từ bài song song.
    Số Pāli: có `soḷasa`, `pañca`, `aṭṭhārasa`, `nava`, `caturo`; mười sáu mục ở `1.2` và `3.1`–`4.4` đếm đủ 16 (4 + 4 + 4 + 4), năm lối đủ 5, chín + chín = mười tám.
    Điểm tiêu chí đổi: nghĩa 8,8→8,9 (bỏ chữ *có* thêm vào); ngữ pháp 8,9→9,0 (vế tỉnh lược ở `14.1` giải bằng bài song song); thuật ngữ 8,9→9,1 (8 khoá về đúng tiền lệ);
      sáng rõ 8,8→8,9; các tiêu chí khác giữ. Tổng 8,91→8,96, vẫn `review` (không vượt 9,0). Blocker không có tầng tham khảo tiếng Anh giữ nguyên.
    Cổng kỹ thuật chưa chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự
  án; so 23 khoá chênh lệch lớn nhất (trên 47 khoá; đọc lại toàn bài từ Pāli, đếm lại: 16 phương thức, 5 lối, 9 + 9 nền
  tảng gốc, 9 thiện = 2 + 3 + 4, 9 bất thiện = 5 + 4) → khác nghĩa thật 0: sửa 0, giữ 19, bất định 4. Giữ: chênh lệch
  chủ yếu là tên các phương thức (bản mù chọn "cận nhân", "bố cục", "gán đặt", "tư trợ", "thể nhập"...; bản dự án giữ
  "nền tảng ứng với", "bốn phần", "gom góp", "trợ duyên", "dẫn đưa" theo các tệp ne khác; đây là lựa chọn thuật ngữ,
  không phải lỗi nghĩa); `14.1`–`14.2` bản mù đọc `navahi padehi` (cách công cụ, số nhiều) như chủ ngữ nên lệch ("chín
  cú là các pháp thiện"), bản dự án giữ "được kết hợp bằng chín nền tảng" theo `yujjanti`; `12.3` "đảo lộn" và bản mù
  "điên đảo" cùng nghĩa `vipallāsa` (trong các tệp ne: "đảo lộn" 62 lần, "điên đảo" 3 lần). Bất định: `8.4`
  `nayalañjako` (cả hai bản đều chưa chắc); `5.3`–`5.4` `etesañceva bhavati, vitthāratayā nayavibhatti`; `13.2`
  `kusalāni ca yāni tīṇi mūlāni`. Ghi nhận thêm: chữ `pada` và `padaṭṭhāna` đều dịch "nền tảng" trong bài này
  (`mūlapada` "nền tảng gốc", `padaṭṭhāna` "nền tảng ứng với"), dễ lẫn khi đọc; giữ vì khớp các tệp ne khác nhưng đã trừ
  điểm thuật ngữ và sáng rõ. Các tệp ne cũng chưa đồng bộ `hāra`: ne3–ne19 dùng "hướng dẫn" (54 khoá), ne1, ne2 và ne20
  trở đi dùng "phương thức" (26 khoá); ngoài phạm vi bài này, đã báo. Dấu lược, tập khoá và NFC của tệp khớp Pāli. Không
  có bản Anh hay bản Việt độc lập khác. Cổng kỹ thuật của kho (`npm run validate`, `npm test`, `npm run check`, `npm run
  build`) chưa chạy ở lượt này.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có đoạn song song hay bản
  nguyên bài): sửa 0 khoá; đọc lại 47 khoá, đối chiếu 16 tên hāra ở `1.2` với `3.1`–`4.4` (khớp từng
  tên), 9 + 9 nền tảng ở `10.2`–`11.2` với uddāna `12`–`13`. Bất định `13.2` `kusalāni ca yāni tīṇi
  mūlāni` thu hẹp được bằng chính bài: `11.2` đã liệt kê alobho, adoso, amoho và `12.2` đối ứng lobho,
  doso, moho, nên `tīṇi mūlāni` đọc là ba gốc thiện; vẫn giữ bất định cho `8.4` `nayalañjako` và
  `11.3`. Ghi nhận ngoài bài: `hāra` là *phương thức* ở ne2 nhưng *hướng dẫn* ở ne3–ne19, chờ người
  biên tập chốt chung.

  Nghiên cứu nguồn ngoài 2026-10-16: Ñāṇamoli, The Guide (Nettippakaraṇa), PTS 1962, bản scan https://archive.org/details/nettipakaranamofbhikkunanamoliptsroutledge_201_q (còn bản quyền PTS; chỉ làm bằng chứng nghĩa, không chép); Indacanda, Nettippakaraṇa song ngữ Pāli–Việt, https://tamtangpaliviet.net/TTPV/43_Net.pdf (không khai giấy phép: NOASSERTION; chỉ làm bằng chứng nghĩa; theo bản Ma/PTS-BJT, độc lập với Ñāṇamoli); đã đọc đối chiếu Pāli↔Việt↔Guide cho toàn bài (mọi khoá có nội dung), Indacanda dùng ở các khoá nêu và khi Guide hay Pāli bất định, không đọc song song toàn văn Indacanda; Guide n.2/2 và §3 xác nhận cách hiểu các khoá `5.3`–`5.4`, `8.4`, `13.2`; sửa không có (các khoá `5.3`–`5.4` `etesañceva bhavati … vitthāratayā nayavibhatti`, `8.4` `nayalañjako`, `13.2` ba gốc thiện được Guide đọc cùng hướng với bản Việt nên giữ); bất định không có khoá mới.
