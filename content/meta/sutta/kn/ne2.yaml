notes: |-
  Đã đọc HẾT vc/p74.txt trước khi viết. Bài này là cả phần `Uddesavāra` của Netti:
  16 `hārā`, lần lặp của chúng, 5 `nayā`, lần lặp của chúng, rồi 18 `mūlapadāni` và uddāna.

  TIỀN LỆ ĐÃ ĐO.
    · `:0.1` `Netti` giữ PĦLI: **17/17** tệp `ne` có khoá này.
    · `:0.2` `Paṭiniddesavāra` → *Phần Giải Thích* ở 17/18 tệp `ne` có `0.2` (chỉ `ne35` giữ
      PĦLI) ⇒ tôi theo khuôn *Phần …*. `Uddesavāra` có **0** tiền lệ nên *Phần Tuyên Chúng*
      là do tôi đặt; tầng `name` đã ghim đặt `ne-uddesavara` là *Specification Section*.
      Người biên tập có thể chọn *Phần Chỉ Định* nếu thích bám Sujato.
    · `hārasampāta` → *nhóm phương thức …* ⇒ `hārā` → *phương thức*; `Tattha katame X?` →
      *Ở đây, X là gì?* — đúng khuôn `ne22/ne23/ne25/ne26`.
    · `Niyutto X` → *X đã được vận dụng* (ne22–ne34).

  MƯỜI SÁU `HĀRĀ` — tôi lấy tên từ chính mười sáu tệp `hārasampāta` mà tầng đã dịch
  (ne22–ne35, đúng là cùng danh sách mười sáu mục), nên bài này khớp với chính tầng `ne`:
    desanā → *đề ra*; vicaya → *tích lũy*; yutti → *lý luận*; padaṭṭhāna → *nền tảng ứng với*
    (ne23); lakkhaṇa → *dấu hiệu* (ne24); catubyūha → *bốn phần* (ne25); āvaṭṭa → *quy căn*
    (ne26); vibhatti → *phân loại* (ne11/ne12); parivattana → *chuyển đổi* (ne28);
    vevacana → *diễn đạt bằng lời*; paññatti → *định danh* (ne30); otaraṇa → *dẫn đưa*
    (ne31 ghi *vượt bậc*); sodhana → *thanh tẩy* (ne32); adhiṭṭhāna → *áp dụng* (ne33);
    parikkhāra → *trợ duyên* (ne34); samāropa → *gom góp* (ne35 giữ PĦLI, 0 tiền lệ).
    `1.2` liệt kê đủ 16, và `3.1–4.4` lặp lại đúng 16 tên ấy — tôi dùng **y hệt** cả hai
    chỗ, không đổi một tên trong lần lặp.

  HAI CHỖ TẦNG THAM KHẢU SAI — tôi KHÔNG nhân bản, nhưng không sửa tệp ngoài lát.
    · `ne22:0.4` `Yuttihārasampāta` đang dịch *Nhóm Phương Thức Dấu Hiệu*, nhưng *dấu hiệu*
      là `lakkhaṇa` (đã dịch ở `ne24` và `ne8` là *Dấu Hiệu* / *Đặc Trưng*). `yutti` là *lý
      luận / lý do*. Đây là **lỗi ánh xạ** trong tầng tham chiếu.
    · `ne29:0.4` `Vevacanahārasampāta` đang dịch *Nhóm Phương Thức Dùng Ngữ Đồng Nghĩa*, nhưng
      *ngữ đồng nghĩa* là `sutamaya`; `vevacana` là *diễn đạt bằng lời*.
    Cả hai đều nằm ngoài lát c74 nên tôi chỉ ghi ở đây cho coordinator sửa.

  BẤT ĐỊNH — đã phán, đáng để người biên tập xem lại.
    · Năm `nayā` (`6.2`, `8.1–9.4`): `nandiyāvaṭṭo` → *tuyên thuật làm vui lòng*;
      `tipukkhalo` → *chất đống ba tầng*; `sīhavikkīḷito` → *đánh bóng như sư tử*;
      `disālocano` → *soi như gương*; `aṅkuso` → *cây gai đẩy*. **0 tiền lệ** cho cả năm;
      đây là dịch nghĩa theo tên gốc, không phải chuyển tự.
    · `11.3–11.4` `Satamekañca gāthānaṁ, navakañca taduttari` — `meka` không tra được nghĩa;
      tôi đọc `satameka`/`navaka` như số đếm (tám bài kệ, chín bài kệ) vì uddāna đếm của
      `Therāpadāna` (`14.3–14.4`: *bốn mươi hai bài kệ, và một nghìn bốn trăm bài*) cũng đếm
      bằng số. Đây là chỗ dễ sai nhất của bài, ghi rõ để người biên tập phán.
    · `13.2` `Kusalāni ca yāni tīṇi mūlāni` dịch *là những nền tảng thiện, ba gốc rễ*;
      không rõ `tīṇi mūlāni` ở đây chỉ ba cái nào.
    · `14.5` `Uddesavāro.` là dấu kết phần ⇒ *Hết phần Tuyên Chúng.*

  BỐN CHỖ ĐÃ SỬA SAU KHI ĐỌC LẠI TẦNG `ne` (lượt review đối kháng).
    Bản nháp dùng `Tứ Giác` cho `satipaṭṭhāna` và *vùng đất của giác quan* cho `indriyabhūmī`,
    nhưng đếm lại thì tầng đã có sẵn: `ne8:8.2` dịch `satipaṭṭhānesu` thành *bốn sát phạn*
    (3 lần) và `indriya` thành *căn* (`ne8:8.1` *căn sắc*, `ne8:9.2` *căn khỏe*,
    `ne24:2.2` *căn sáu*). Đã sửa thành *Bốn sát phạn* và *vùng đất của các căn* — bám tầng
    thay vì đặt từ mới. Tương tự, `vipallāsa` ở `ne8:8.2` là *đảo ngược* ⇒ `12.3` sửa thành
    *Bốn sự đảo ngược*.

  NHÁY KÉP. PĦLI của bài này có **0** dấu mở / **0** dấu đóng ⇒ bản Việt cũng không nháy kép.

