notes: |-
  Dịch từ Pāli root `vv83` (89/89 khoá, tiền tố `vv83:`, thứ tự khoá đúng Pāli). Bài thuộc `Purisavimāna`, `Sunikkhittavagga`, bài thứ chín; kệ kể chuyện người cha khóc con ở bãi thiêu gặp một thiên tử hiện thân chàng thanh niên khóc đòi bánh xe, rồi được dẫn đến quy y và thọ năm điều học.

  **Pāli song song.** Các khoá `1.1`–`21.4` trùng từng chữ với `pv17` (Chuyện Ngạ Quỷ Maṭṭhakuṇḍalī); nhiều khoá trong `8.1`–`10.4` và `2.1`–`7.2` còn trùng với phần kệ của `ja352`, `ja372`, `ja410`, `ja449`, `ja454`, `pv8`. Đã tra để giữ nhất quán thuật ngữ nhưng dịch từ Pāli của `vv83`, không chép lại. Bản Việt của `pv17` cùng một lát dịch với bài này nên **không** phải nguồn đối chiếu độc lập và không được tính vào `triangulation`.

  **Pāli trùng nguyên văn trong tầng Việt.** 30/89 khoá có Pāli trùng ở bài khác, tổng 63 cặp; dùng lại nguyên văn 5 khoá (`8.2`, `9.2`, `9.3`, `10.2`, `11.2`), 58 cặp lệch. Phần lớn lệch là ngôi xưng (Jātaka dùng *ta*/*ngươi*, bài này người cha là cư sĩ nói với một chàng trai nên dùng *tôi*/*cậu*) hoặc diễn đạt khác trên cùng nghĩa. Ba chỗ ghi riêng:
    - `11.1`, `11.2`, `11.3`, `11.4` khớp `vv62:2.1`–`2.4` về nghĩa; `11.2` dùng lại nguyên văn *hay chính là Sakka Đấng Phá Thành?*. `11.4` lệch đúng một dấu chấm: bản `vv62:2.4` kết `?”.`, bản này kết `?”` theo đa số trong bộ `vv` (30 so với 24 khoá câu hỏi có Pāli kết `”ti`).
    - `8.2` `ghatasittaṁva pāvakaṁ` dịch *như lửa được rưới bơ lỏng*, khớp `ja454:12.2`. Năm bài (`ja352:5.2`, `ja372:5.2`, `ja410:7.2`, `ja449:8.2`, `pv8:5.2`) viết *như cành cây khô bị lửa thiêu đốt* cho cùng Pāli; chữ ấy không có trong Pāli (`ghata` bơ lỏng, `sitta` rưới). Pāli thắng, không theo đa số 5/1; đề nghị người điều phối xem lại năm khoá ngoài lát này.
    - Ở `ja449`, `ja372`, `ja410`, `ja352` các khoá cùng Pāli với `8.3`, `8.4`, `9.1`, `9.3`, `9.4` cũng được dịch khác (ví dụ `ja449:8.3` *nước sóng vọt vào*, `ja449:9.1` *tôi đã đau đớn khổ sở*, trong khi `Abbahī vata me sallaṁ` là *đã nhổ mũi tên của tôi*). Bản này bám Pāli (`vārinā viya osiñcaṁ` — như người rưới nước; `daraṁ` — nỗi bức bối) và khớp `ja454:12.3`–`13.1`; các khoá Jātaka nằm ngoài lát nên chỉ báo, không sửa.
  Trùng nguyên văn **trong chính bài**: 1 nhóm (`12.4` = `15.4`, `Tidasānaṁ sahabyataṁ gato”ti.`), Việt giống hệt, 0 cặp lệch.

  **Thuật ngữ, kèm số đếm.**
    - `Tidasa` → *Tam Thập Tam*: toàn tầng 7 khoá *Tam Thập Tam* so với 4 khoá *Tam Thập*; trong bộ `vv` là 7/7 (vv41, vv82). Bài `pv17` cùng lát viết *Tam Thập*; hai bài nên được đối chiếu khi gộp.
    - `sahabyataṁ gato` → *đã đến chỗ sống chung với* (`vv24:14.5`).
    - `yakkha` → *dạ-xoa* (7 so với 2 *yêu quái* trong tầng); `devate` → *hỡi vị thiên*.
    - `adinnaṁ` → *của không cho* (9 so với 2 *vật không cho*).
    - `amajjapo` → *không uống chất say* theo `vv61:5.1` (1 tiền lệ duy nhất cho chữ này); không đổi sang *rượu*.
    - `Upemi saraṇaṁ` → *nương về* (`thig12.1:15.1`), `saraṇaṁ gacchāmi`/`vajāmi`/`vajāhi` → *quy y* (kp1, ud5.3); trong bài giữ hai động từ khác nhau như Pāli.
    - `anomapaññaṁ` → *trí tuệ vô song* (`snp2.12:2.1`, `snp2.12:11.4`; 2 so với 1 *không thấp kém* ở `ja441:5.1`).
    - `sikkhāya padāni pañca` → *năm điều học*, vì khác `sikkhāpada` (tầng viết *giới điều*/*học giới*) về hình thức Pāli; `akhaṇḍaphullāni` không có tiền lệ trong tầng, dịch *không sứt mẻ, tươi nở*.
    - Tiêu đề: `0.2` *Chuyện Cung Điện Nam Hư Không*, `0.3` *Phẩm Khéo Đặt Để* theo đa số bộ `vv`; `0.4` giữ nguyên danh xưng *Maṭṭhakuṇḍalī* như `vv85:11.3`.

  **Bất định.**
    - `1.1` `maṭṭhakuṇḍalī` hiểu là tính từ (*hoa tai bóng loáng*) vì chàng thanh niên xuất hiện đeo hoa tai bóng, còn bản Jātaka `ja449:1.1` dịch như danh xưng; cả hai đều khả dĩ trong Pāli, không đổi nghĩa toàn bài.
    - `6.2` `vaṇṇadhātu ubhayattha vīthiyā` dịch sát chữ *ánh sắc rạng rỡ ở cả hai lối đi*; `vīthi` (lối đi, con đường) ở đây có thể chỉ đường đi của nhật nguyệt hoặc con đường trước mặt hai người, bản dịch không chọn thêm chi tiết.

  **Dấu lược và nháy.** Pāli không có `…` hay `(…)` nên Việt không có. Nháy kép khớp Pāli từng khoá: mở ở `1.1`, `2.1`, `3.1`, `4.2`, `5.1`, `6.1`, `7.1`, `11.1`, `12.1`, `13.1`, `14.1`, `16.1`, `17.1`, `19.1`; đóng ở `1.4`, `2.4`, `3.4`, `4.4`, `5.4`, `6.4`, `10.4`, `11.4`, `12.4`, `13.4`, `15.4`, `16.4`, `18.4`, `21.4`; lời `7.1`–`10.4`, `14.1`–`15.4`, `17.1`–`18.4`, `19.1`–`21.4` chạy qua nhiều khoá như Pāli. Không có nháy đơn trong Pāli lẫn Việt. Không có số lượng Pāli trong bài ngoài `pañca` (*năm*) ở `17.3`.

  **Kiểm trước khi chốt.** 89/89 khoá Việt khớp 89/89 khoá Pāli về tập và thứ tự; 0 lệch nháy trên 89 khoá; 0 khoá rỗng hay khoảng trắng thừa; NFC đạt; không Pāli lọt sang bản Việt ngoài danh xưng.

