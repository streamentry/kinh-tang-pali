notes: |-
  Dịch trực tiếp từ Pāli root (97 khoá, đủ mọi khoá của bài, đúng thứ tự Pāli). Không có tầng Anh nào đã ghim cho tha-ap5 nên không tuyên bố đã đối chiếu English; thuật ngữ và công thức đối chiếu với 485 tệp tha-ap đã có trong tầng.
  Dùng lại nguyên văn: 24 khoá có Pāli trùng nguyên văn với bài khác trong tầng tha-ap, 21 khoá dùng lại đúng bản Việt đã có. Ba khoá khác bản đã có: 1.1 (bản cũ Đến Đức Thế Tôn Padumuttara là cách dịch cho động từ cho/dâng ở các bài kia, còn ở đây cùng các sở hữu cách đi với satthuno của câu cúng dường, nên bỏ chữ Đến), 4.1 (bản cũ Nghe lời lành của Ngài lệch nghĩa vì sādhūti te paṭissutvā là họ vâng lời nói rằng lành thay) và 21.1 (chỉ đổi thứ tự cho thuận tiếng Việt). Không có cặp Pāli trùng nguyên văn trong chính bài này (0 cặp) nên phép so cặp trùng nội bộ không đo được gì.
  Tiêu đề: Pāli :0.3 Mahākassapattheraapadāna không bắt đầu bằng số thứ tự nên không thêm số (khớp quy ước KEEP 119, DROP 255, THỪA 0 của phẩm). translationTitle bằng đúng giá trị :0.3 (Bài Kệ Tuyên Ngôn Về Trưởng Lão Mahākassapa). Dạng Tuyên Ngôn thay vì Tuyên Ngợ: toàn tầng tha-ap đo được Tuyên Ngợ 240, Tuyên Ngôn 123, Tuyên Ngợi 10, Ký Sự 104; ở phạm vi gần nhất (từ tha-ap1 đến tha-ap40) Tuyên Ngôn 18, Tuyên Ngợ 9, Tuyên Ngợi 2, và các bài liền kề tha-ap6, tha-ap9, tha-ap10, tha-ap11 đều dùng Tuyên Ngôn. Hai phạm vi cho hai đa số khác nhau; chọn Tuyên Ngôn vì Tuyên Ngợ là dạng sai chính tả. Cần người biên tập phán một lượt cho cả cuốn.
  0.1 Therāpadāna giữ nguyên (473 trên 485 tệp). 0.2 Buddhavagga là Phẩm Phật (5 tiền lệ, khớp tha-ap6). Lời kết 24.1 theo nhóm số nhiều Tôi nghe như vầy ... đã nói những bài kệ này, khớp tha-ap6, tha-ap9, tha-ap10, tha-ap11. Khoá 25.1 là tên bài kèm thứ tự, tatiyaṁ là thứ ba, giữ cách ghi như tha-ap6.
  Số Pāli đã tính: catubbīsaṁ 17.1 = catu 4 + vīsa 20 = 24 (hai mươi bốn); dvādasa 17.2 = 12; pañcasataṁ 18.1 = 5 x 100 = 500; tadaḍḍhakaṁ 18.2 = một nửa số đó (Pāli không nêu số, giữ là một nửa, không tự tính 250); paṇṇavīsati 19.2 = 5 + 20 = 25 (hai mươi lăm; tha-ap62:14.1 paṇṇavīsatito kappe cũng là 25); sahassa 9.1 và 10.1 = 1.000 (ngàn); satahattha 5.2 = 100 khuỷu tay; diyaḍḍhahattha 5.3 = một khuỷu tay rưỡi; saṭṭhikappasahassa 14.1 = 60 x 1.000 = sáu mươi nghìn kiếp (3 tiền lệ cùng dạng đều dịch sáu mươi nghìn); tiṁsakkhattuṁ 15.2 = 30 lần (tiṁsa = 30, tiền lệ tha-ap40:6.2 và chattiṁsakkhattuṁ = 36; bài này không có cụm tiṁsakappasahassa nên bất định đang treo về cụm đó không chi phối khoá nào); asītikoṭiyo 22.3 = 80 koṭi; sattabhūmaṁ 9.4 = bảy tầng; Sattaratana 16.1 = bảy món báu; catudīpa 16.2 = bốn châu lục; caturo disā 11.4 và catuddisā 7.4 = bốn phương; disā dasa 12.4 = mười phương; catasso 23.1 = bốn; aṭṭha 23.2 = tám; chaḷa 23.3 = sáu; tatiya 25.1 = thứ ba.
  BẤT ĐỊNH 5.1 đến 5.4: agghiya được dịch là cột trụ vì đã có tiền lệ Kañcanagghiyasaṅkāsa là cột/trụ vàng (6 tiền lệ), khớp số đo cao một trăm khuỷu tay, rộng một khuỷu tay rưỡi; không có chứng cứ độc lập cho nghĩa này của agghiya. Pāli viết hai danh từ liền nhau (agghiya và vimāna nabhamuggataṁ) không có chữ nối nên không phân xử được hai vật hay đồng vị; bản Việt giữ như một chuỗi liệt kê và không khẳng định thêm.
  BẤT ĐỊNH chủ ngữ 5.1 đến 6.4: pūjayuttamaṁ có thể đọc là pūjayuṁ uttamaṁ (ngôi thứ ba số nhiều, họ cúng dường) hoặc pūjayiṁ uttamaṁ (tôi). Các phân từ katvā, pasādetvā đi cùng chủ ngữ đó. Bản Việt bỏ trống chủ ngữ cho đúng độ mờ của Pāli, tức tiếp nối chúng ta ở 4.4; không thêm đại từ. hattha dịch là khuỷu tay (cubit); tầng có hai tiền lệ khác nhau là hà-tay (tha-ap50:2.3) và sải tay (mil6.1.9, mil7.3.4), sải tay là cả sải hai tay nên không khớp hattha.
  BẤT ĐỊNH 17.1 đến 17.2: Pāli không nêu đơn vị đo của hai mươi bốn và mười hai nên không thêm do-tuần; và dòng này có thể nói về nơi ở ở 16.3 hoặc về thành Rammaṇa. 18.1 đến 18.2 chiều dài năm trăm đi cùng so sánh với thành chư thiên nên nói về thành. Pāli ngắt câu ở 16.4 và 17.4 nhưng không có chủ ngữ ở 17.1, nên giữ không chủ ngữ.
  BẤT ĐỊNH 19.4 laṅkataṁ: đọc là alaṅkataṁ, được trang hoàng; hình ảnh hộp kim chật kín mà lại trang hoàng là nghĩa đen của Pāli, không giải thích thêm. 7.3 và 16.4 Indalaṭṭhī dịch là cây trụ của Thiên Chủ (tầng có hai tiền lệ khác nhau, tha-ap314:1.3 cây cột cờ của Thiên Chủ và tha-ap347:5.2 tháp Indalaṭṭhī; bỏ chữ cờ vì Pāli chỉ nói laṭṭhi là trụ, gậy); nghĩa của Indalaṭṭhī (trụ, trượng, hay hiện tượng trên trời) không được phân xử.
  BẤT ĐỊNH 22.3 đến 22.4: asītikoṭiyo giữ nguyên koṭi, không đổi thành số lớn. Theo cách tính thông dụng một koṭi là mười triệu nên 80 koṭi là tám trăm triệu (tha-ap431:7.1 đã ghi tám trăm triệu); tầng cũng có hai mươi koṭi ở tha-ap391:6.4. hiraññassāpi dịch là cả vàng bạc nữa, giữ nguyên độ mờ của api. 21.4 kulasampadā dịch là sự thành tựu về gia tộc, chưa có tiền lệ cho từ này; chưa tìm được cách tự nhiên hơn mà không thêm nghĩa. 8.4 tidasa dịch là cõi trời Tam Thập (tiền lệ snp3.11, bv29, mil5.1.4), khác cõi trời Ba Mươi Ba dùng cho Tāvatiṁsa.
  Phép kiểm: tập khoá Việt khớp tập khoá Pāli 97 trên 97 và đúng thứ tự; nháy kép và nháy đơn khớp Pāli từng khoá (0 lệch trên 97; Pāli chỉ có nháy kép mở ở 1.1 và đóng ở 23.4, 0 nháy đơn); dấu lược …pe… và (…): 0 trong Pāli, 0 trong Việt; NFC sạch, 0 khoá rỗng, 0 Pāli lọt sang tiếng Việt ngoài tên riêng và từ giữ nguyên (Mahākassapa, Rammaṇa, kiṁsuka, koṭi, Therāpadāna).
  Ba tầng tham khảo đều vắng: english-sujato không có tệp tha-ap, vietnamese-current chỉ có Pháp Cú, english-project không có entry; vì vậy triangulation đặt 7.5 và status draft với blocker noEnglishEditionUpstream. Mẫu số coverage chỉ là 1 khoá (24.1), nên cổng coverage không đo được gì ở phần kệ ngắn.
