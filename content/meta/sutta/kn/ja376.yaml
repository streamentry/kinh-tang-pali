notes: |-
  `Avāriyajātaka`, bài đầu của `Avāriyavagga` trong `Chakkanipāta`. 35 khoá, tất cả đã dịch. TẦNG THAM KHẢO — đo, không đoán. 0/7 bài `kn` của lát này có bản Anh Sujato tại commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud` (đếm trực tiếp trên đĩa: cp 35, dhp 26, iti 11, ja 83, kp 9, snp 5, thag 264, thig 73, ud 8 tệp) — **không có `mil`**, và `ja374/376/407/412` không nằm trong 83 tệp `ja` ấy. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit đã ghim có đúng 26 tệp và tất cả đều là `dhp*` (Pháp Cú). Lớp lấp `english-project` của dự án không có uid nào trong lát. Ba tầng tham khảo đều vắng ⇒ bài dịch chỉ từ Pāli root ⇒ blocker thật, và đây là **giới hạn upstream**, không phải lỗi của người dịch. Vì vậy `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng để né blocker, và `status` là `draft` vì `scripts/validate.ts` coi tệp Anh thiếu là **error** khi status là `review` hoặc `published`.

  TÊN BÀI VÀ TÊN PHẨM — theo bầy lân cận, đếm được: `Chakkanipāta` → *Bộ Sáu Bài Kệ* (12 bài `ja` đã có, không lệch); `Avāriyavagga` → *Phẩm Avāriya* (ja377/378/379/381); `0.1` → *Jātaka*; `0.4`/`8.1` giữ Pāli `Avāriya` theo mẫu `2. Kinh Setaketu` của `ja377`.

  BẢN KỆ LẶP TRONG CHÍNH BÀI — DÙNG LẠI NGUYÊN VĂN, ĐẾM ĐƯỢC 3 CẶP. `2.1`–`2.3` (`Gāme vā yadi vāraññe / ninne vā yadi vā thale / Sabbattha anusāsāmi`) trùng nguyên văn ở `5.1`–`5.3`; cả hai chuỗi dịch **một lần rồi dùng lại y hệt**, kể cả dấu câu. Ngoài ra `2.1`–`2.2` còn trùng `ja355:4.1`–`4.2` nên lấy y hệt của bài đó. Kiểm bằng script mục, không bằng mắt.

  MỘT CHỖ DỊCH RIÊNG, CÓ LÝ DO. `1.3` `Kuddhaṁ appaṭikujjhanto,` trùng nguyên văn với `sn11.4:10.3`/`sn7.2:5.3` (*ai không sân hận đáp lại kẻ sân hận*), nhưng ở đóy nói về **không đáp lại lời giận**, còn ở đây nói về **vua giận mà không giữ lời** — dùng lại sẽ đổi nghĩa. Dịch riêng: *Vua giận mà không giữ lời, / vị vua được cả nước tôn kính,*.

  ĐỌC `pitā` ĐÚNG CHỖ. `3.1` `Avāriyapitā nāma` — `pitā` là **cha**, không phải tính từ; câu chuyện nói vị vua trong truyện có người cha là kẻ lái đò ngu dốt. Vì vậy dịch *Có một người mà người cha là kẻ ngu dốt,* chứ không phải *có kẻ ngu dốt*. `7.3` `Migova jātarūpena` đọc là *Cái thai của Migo cũng rơi xuống như thế*, nối thẳng với `7.2` `Gabbho ca patito chamā`; đây là cách hiểu, `jātarūpena` còn có thể đọc theo nghĩa *lượng* — ghi lại để người điều phối phán nếu tìm được chú giải.

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó — BRIEF cấm `npm run validate|test|build|check` trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6** vì mọi chốt tự động của `_hvi.kiểm` đã xanh (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên văn Pāli, không lọt Pāli, khớp số dấu lược) và 35/35 khoá của chính bài này; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.

  Lượt rà soát 2026-10-15 (kiểm toán lại từng khoá bằng Pāli, Claude Sonnet 5.5 (Claude Code)). Mục
  này THAY các khẳng định cũ ở trên về «kujjha = giữ lời», «Avāriyapitā = người có cha là kẻ ngu»,
  «đòi tiền cướp đò», «Migo» và «ra lệnh». Sửa 24 khoá so với bản trước, trong đó 17 khoá sai nghĩa
  thật. 1.1–1.4 và 2.4, 5.4: `kujjha/kujjhittha` là «giận» (mā kujjha = chớ giận), không phải «giữ
  lời»; `kuddhaṁ appaṭikujjhanto` = không giận đáp lại kẻ đang giận. 2.3, 5.3, 6.1, 6.3:
  `anusāsāmi/anusāsanī` là khuyên dạy, không phải ra lệnh. 3.1: `Avāriyapitā nāma` là tên người lái đò
  (cha của Avāriya), không phải «người có cha ngu dốt». 3.3–3.4: `tāretvāna` chở qua sông, `yācati
  vetanaṁ` đòi tiền công (bản cũ «cướp đò» không có trong Pāli). 4.1–4.2: `atiṇṇaṁyeva yācassu,
  apāraṁ` = chỉ đòi khi chưa qua sông, chưa tới bờ bên kia; `tāta` là hô ngữ thân mật, không dịch «đứa
  con». 6.2: `gāmavaraṁ` = ngôi làng tốt đẹp; 6.4: `nāviko paharī mukhaṁ` = người lái đò đánh vào mặt
  (bản cũ «Đánh cho ta một cái!» bịa lời thoại). 7.1: `bhattaṁ bhinnaṁ` = cơm bị đổ/vỡ; 7.3–7.4:
  `migova jātarūpena, na tenatthaṁ abandhi` = như con thú với vàng, y không đạt được ích lợi gì từ đó
  (không còn «cái thai của Migo»). Người nói suy từ truyện dẫn (ancient-buddhist-texts.net, bản
  Francis–Neil, chỉ để biết người nói): 1–2 và 4–5 là vị ẩn sĩ (Bồ-tát) nói; 3, 6, 7 là Bậc Đạo Sư.
  Bất định, không đưa vào thân kinh: `migova jātarūpena` (so sánh con thú với vàng) đọc theo truyện
  dẫn; `sū` ở 7.4 là tiểu từ nhấn, không dịch. Điểm đặt lại theo bản đã sửa: semantic_fidelity và
  grammar_logic 8,9 (bản cũ sai hơn một nửa số khoá kệ); các điểm khác giữ nguyên. Cổng npm chưa chạy;
  technical_integrity giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
