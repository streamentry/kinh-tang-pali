notes: |-
  Tiền lệ đếm được: `visaññikarāṇī` → chất say (20 tiền lệ; say rượu chỉ 6); `acc` → nhảy múa (9 tiền lệ); `rudi` → khóc lóc (30 tiền lệ); `vānara` → khỉ (13 tiền lệ); `pabbajjā` → xuất gia (938 tiền lệ); `āyāma` → trở về.
  Chỗ dễ sai nhất của bài là 1.1 `Apāyimha`: tiền tố `a-` phủ định được gắn vào `pā` (uống) chứ không phải `āyā` (đi), vì vế sau là `anaccimha` / `agāyimha` / `rudimha` — tức múa, hát, khóc. Cowell 81 dịch một bộ vế KHÁC (We drank, we danced, we sang, we weep) nhưng cùng chủ đề, xác nhận chuỗi uống/múa/hát/khóc. Bản Việt dịch đúng bộ vế ở Pāli root, không theo Cowell.
  0.3 `Apāyimhavagga` 0 tiền lệ: phẩm lấy tên từ chính vế mở đầu của bài đầu phẩm này (`apāyimha` = chúng tôi không từng uống, ja81:1.1), nên dịch là Phẩm Chưa Từng Uống thay vì giữ chữ Pāli trần.
  1.3–1.4 để nguyên sự đối lập của Pāli: tiêu cực (không uống/múa/hát/khóc) rồi mới tới hậu quả. Tôi không thêm từ nối nào; sự đối lập do chính hai vế tạo ra.
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. 0.1 Jātaka giữ nguyên (58 bài đã có) và 0.2 Ekakanipāta → Bộ Một Bài Kinh (57 bài) theo tiền lệ đếm được. 1.1 mở nháy kép, 1.4 đóng nháy kép + dấu chấm, không giữ `ti.` (tiền lệ 51/57 bài; 10 bài mới hơn cũng bỏ). Dòng kết 2.1 dùng dấu phẩy (Kinh X, thứ N) theo làn sóng gần nhất ja108…ja119; kho còn 48 bài không dấu phẩy — ghi ở đây để biên tập chuẩn hoá sau, tôi không sửa bài ngoài lát. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Chú giải Jātaka-aṭṭhakathā bằng Pāli không truy cập được trong môi trường dịch này, nên bối cảnh lấy từ truyện E. B. Cowell, The Jātaka vol. I (bản 1895, tải từ archive.org); đây là lý do triangulation không lên cao. technical_integrity 10.0 căn cứ chốt _hvi.py đã pass và tự chạy lại script kiểm bổ sung (9/9 khoá khớp Pāli, NFC, ngoặc kép cân trên cả bài, không lệch dấu lược); npm run validate|test|build không chạy theo lệnh cấm của lát.
  Sửa lan 2026-10-13: `Apāyimhavagga` — tên phẩm lấy từ vế đầu của `ja81:1.1`, mà `apāyimha` là thức aorist ngôi thứ nhất số nhiều có tiền tố `a-` (*chúng tôi đã uống*), cùng dạng với `agāyimha` (*chúng tôi đã hát*) và `anaccimha` (= `a-` + `naccimha`, *chúng tôi đã nhảy múa*); dạng phủ định phải là `na`/`nā`. Bản cũ đọc `a-` là phủ định (*Chưa Từng Uống*). Tiền lệ đo trên tầng: ở `kn` các động từ aorist ngôi 1 số nhiều có `a-` (`agamimha`, `adāsimha`, `apucchimha`, `akarimha`… 20+ khoá) đều dịch khẳng định. Khoá `ja81:0.3`: *Phẩm Chưa Từng Uống* → *Phẩm Chúng Tôi Đã Uống* (cùng tên ở `ja81`…`ja90`, một tên phẩm cho cả phẩm; `ja90:4.1` giữ `Apāyimha` là tên trong bài tóm lược, không đổi). Khoá `ja81:1.1`–`1.2`: *Chúng tôi không uống, không nhảy múa, / không hát, cũng không khóc lóc* → *Chúng tôi đã uống, đã nhảy múa, / đã hát và đã khóc* (bản cũ còn dịch `rudimha ca` là *cũng không khóc lóc* trong khi Pāli không có phủ định ở đó, và tự mâu thuẫn với `1.3` *sau khi uống chất say*). Khoá `ja81:1.4` `diṭṭhā nāhumha vānarā`: *nhìn kìa, chúng tôi thành khỉ* → *chúng tôi được thấy là không thành khỉ* (`nāhumha` = `na ahumha`, có phủ định; bản cũ bỏ mất `na`). Độ chắc: `1.1`–`1.2` cao; `1.4` thấp hơn vì chưa đối chiếu được bản Anh độc lập hay chú giải (bản Anh của lớp dự án cho bài này vẫn theo cách đọc phủ định cũ, ngoài lát này). Phần ghi chú cũ ở trên về `Apāyimha` là phủ định và về 0.3 không còn hiệu lực. Điểm không đổi; giữ nguyên các khoá còn lại.
