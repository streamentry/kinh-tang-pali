notes: |-
  Bản dịch tiếng Việt mới cho bài kinh tha-ap308 — trưởng lão Sampasādako, bài thứ sáu
  và bài cuối của Padumakesaravagga trong Therāpadāna.

  Tiền kiếp: kẻ tội lỗi quỳ bái Đức Phật rồi xin nương tựa; Ngài giảng Tăng chúng tựa
  như biển sâu, dặn gieo hạt giống tốt lành nơi ruộng thanh tịnh; Ngài khuyên dạy rồi bay
  lên bầu trời. Chưa bao lâu ông gặp lại Đấng Toàn Giác, tuổi thọ tận cùng, sinh về cõi
  Đâu-suất; một kiếp ở chỗ cùng tận thiên. Vào chín mươi tư kiếp trước ông có được lòng
  tịnh tín ấy — đó là quả của nó.

  Bất định đã ghi lại, không sửa trong kinh:
  - `vīratthu` (1.1) dịch là bậc trừ oan địch, khác hai cặp tiền lệ ở sn2.9 và sn2.10 dịch
    bậc Anh Hùng. Lý do: `-atthu` là có mục đích tiêu diệt, dịch Anh Hùng là rơi mất vế
    đó; giữ nguyên văn Pāli quan trọng hơn số lượng tiền lệ khi hai cách không tương đương.
  - `Pavanā` giữ nguyên là tên địa danh vì đó là cách đọc theo Pāli của chính khoá; cùng
    dòng `Pavanā nikkhamma/abhinikkhamma` có ở tha-ap125, tha-ap163, tha-ap201, tha-ap202.
  - `viraje khette … anantaphaladāyake` xuất hiện hai lần (3.1–3.2 và 6.1–6.2) nên hai cặp
    dịch giống nhau, chỉ khác mạch từ bối cảnh nói với ai. `viraje khette` dịch là ruộng
    thanh tịnh theo an5.179 và an3.57.
  - Câu 2.1–2.2 là mệnh đề từ vựng rời trong Pāli; bản dịch giữ nguyên vị trí, không thêm
    chủ ngữ.
  - `subījaṁ vāpa ropaya` (3.4): hạt giống tốt lành. `tusitaṁ` dịch cõi Đâu-suất theo
    tha-ap323:3.4.
  - Tên phẩm `Padumakesaravagga` theo đa số trong chính phẩm này (304, 305, 307 dùng
    “Phẩm Bậc Nhị Hoa Sen”), và tầng `name/` đã ghim xác nhận dạng Padumakesariya.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của chính tầng Việt qua `_hvi.save_vi`: đủ 36/36 khoá, cân ngoặc kép trên cả bài, đúng số dấu lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10 tiêu chí, tính bằng script.
