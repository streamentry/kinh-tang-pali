notes: |-
  **Phạm vi.** Đủ 138/138 khoá của pv27, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli, không khoá rỗng. Pāli của bài không có dấu lược nào (0/138 khoá có …pe… hay …), nên bản Việt cũng không có dấu lược (0/138).

  **Coverage English.** Mẫu số = 0: 135 khoá không phải khối tham chiếu `:0`, khoá Pāli dài nhất chỉ 32 ký tự, không khoá nào đạt 40 ký tự, nên cổng coverage của `source/layers.yaml` không đo được gì (không phải 0% không đạt ngưỡng). Ba tầng tham khảo (`english-sujato`, `english-project`, `vietnamese-current`) đều vắng cho kinh văn của bài này; vì vậy `triangulation` chỉ 7.5 và không được hiểu là đã đối chiếu English. Khoảng mất mát này người điều phối cần ghi vào `content/meta/reference-gaps.yaml` bằng `npm run reference:gaps` (ngoài phạm vi lát).

  **Tiêu đề.** `0.1` Petavatthu và `0.2` Cūḷavagga giữ nguyên Pāli (đúng quy ước bộ). `0.3` theo khuôn *N. Chuyện Ngạ Quỷ X* của bộ. Tầng tên `name/` đã ghim đặt tên bản Anh là *The Monk from Mount Sāṇavāsī*; Pāli ở `1.2` chỉ có `sāṇavāsinivāsiko` (cư ngụ ở Sāṇavāsī) và không có chữ *núi*, nên bản Việt không thêm *núi*, chỉ giữ địa danh. Hợp từ `Sāṇavāsītherapetavatthu` không nêu quan hệ giữa ngạ quỷ và vị trưởng lão (trong thân bài là mẹ, cha và người anh em của vị ấy); theo khuôn `pv14:0.3` (*Chuyện Ngạ Quỷ Mẹ Của Trưởng Lão Sāriputta*) mà bỏ phần quan hệ, thành *Chuyện Ngạ Quỷ Của Trưởng Lão Sāṇavāsī*. `32.1` theo khuôn đóng bài *<tiêu đề>, thứ N.* (pv13:22.1). `translationTitle` không có số đầu (đa số các bài pv).

  **Tiền lệ trùng nguyên văn đã dùng lại.** Đã dò Pāli của 138 khoá với toàn bộ tầng Việt của `kn` (không tính chính pv27, chuẩn hoá bỏ hoa thường, dấu câu, ṁ/ṃ): 44 khoá trùng Pāli ở bài khác, trong đó 42 khoá có bản Việt giống ít nhất một tiền lệ (cùng nghĩa, chỉ khác hoa thường hay dấu câu), 2 khoá khác: `8.3` (`Tava dinnena dānena`) tiền lệ `pv16:17.1` là *Nhờ vật thí chàng đã dâng* và ở đây người nghe là vị trưởng lão nên đổi đại từ thành *ngài*; `31.4` (`bhante vanditumāgatā`) tiền lệ `pv13:21.4` *con*, `pv14:18.4` *tôi*, ở đây người nói là nhiều ngạ quỷ (`vanditumāgatā` số nhiều) nên *chúng tôi*. Các nhóm dùng lại: `12.1` (*Ngay khi vừa được hồi hướng*, 4/4 tiền lệ `pv14:9.1`, `pv10:7.1`, `pv16:11.1`, `pv13:8.1`); `17.1`–`18.4` theo `pv13:16.3`–`17.4` (vải của vua Nanda); `18.3`–`18.4` theo `pv13:18.1`–`18.2`; `19.2` ← `pv13:18.4`; `25.3`–`26.4` theo `pv13:19.3`–`20.4`; `12.4` ← `pv13:15.4`; `21.4` ← `vv8:2.2` (3/3); `23.1`–`23.2` ← `pv24:5.5`–`5.6`; `31.3` ← `pv14:18.3`, `pv13:21.3`, `vv21:10.3` (3/3); `14.4`/`20.2`/`24.2`/`29.2` ← `pv14:8.2` (*vị ấy dâng cho Tăng chúng bốn phương*); `11.5`–`11.6` và các lần lặp ← `pv5:3.5`–`3.6`, `kp7:4.1`–`4.2` (*thân nhân*); `16.3` ← `pv26:5.1`.

  **Chỗ cố ý lệch tiền lệ (cần người biên tập xem).** `2.2` và `6.2` (`duggatā yamalokikā`): Pāli trùng nguyên văn ở `pv45:2.2`, `pv44:2.2`, `pv6:2.2`, `pv31:2.2`, `pv31:11.2`, `pv31:12.4` và hai khoá nữa (8 khoá) mà bản Việt là *sinh về cõi khổ xa xôi, thuộc cõi của Yama*; chỉ `pv13:2.2` (1 khoá) là *đã rơi vào cảnh khổ, thuộc cõi của Yama*. Tôi theo `pv13:2.2` (đo 8 so với 1): `duggata` là du- (xấu, khó) + gata (đã đi tới), không có căn cứ hình thái cho *xa xôi* (dūra), và cụm *đã rơi vào cảnh khổ* ăn khớp cách tầng dịch `duggati` (*cõi dữ*, *khổ xứ*, *đọa xứ*). Không sửa tám khoá kia vì ngoài lát; nên xem lại.

  **Trùng nguyên văn trong chính bài.** 15 nhóm trùng (66 cặp): `2.2`–`2.4` với `6.2`–`6.4`; `3.1`–`3.4` với `7.1`–`7.4`; `4.4` với `16.4`; năm lần hồi hướng `11.4`/`15.2`/`20.4`/`24.4`/`29.4`, `11.5`/`15.3`/`20.5`/`24.5`/`29.5`, `11.6`/`15.4`/`20.6`/`24.6`/`29.6`; năm khoá `12.1`/`16.1`/`21.1`/`25.1`/`30.1`; bốn khoá `13.5`/`19.3`/`23.3`/`28.3`; bốn khoá `14.4`/`20.2`/`24.2`/`29.2`; bốn khoá `15.1`/`20.3`/`24.3`/`29.3`. Bản Việt giống hệt nhau ở 12 nhóm; ba nhóm còn lại chỉ khác ở hoa thường đầu khoá (`15.1` đầu câu viết hoa), dấu chấm so với chấm phẩy cuối khoá đúng như Pāli (`14.4` là chấm, ba khoá kia chấm phẩy), và dấu nháy đơn mở của `28.3` (Pāli có ‘). 0 cặp trùng mà bản Việt khác về nghĩa. `11.3` (`anvādisi`) và `15.1`, `20.3`, `24.3`, `29.3` (`anvādisī`) chỉ khác độ dài nguyên âm; Việt giống nhau.

  **Số Pāli.** `dvādasa` ở `9.2`: dvā 2 + dasa 10 = 12, dịch *mười hai tỳ-kheo khác*. `catukuṇḍiko` ở `4.3` có `catu` = bốn (bốn chi), và `cātuddise`/`caturo disā` = bốn phương/bốn phía; `ekapathekako` ở `4.2` có eka = một. `0.3` (*2.*) và `32.1` (*thứ hai*, dutiyaṁ). Không có số lớn, không có `sahassa`, `sata`, `tiṁsa`, không có phép nhân.

  **Dấu nháy.** Mở ở `5.4`, `10.2`, `11.5`, `13.3`, `15.3`, `17.1`, `20.5`, `22.1`, `24.5`, `27.3`, `28.1`, `29.5`, `30.3`; đóng ở `8.4`, `10.4`, `11.6`, `13.6`, `15.4`, `19.4`, `20.6`, `23.4`, `24.6`, `27.4`, `28.4`, `29.6`, `31.4`; nháy đơn ‘…’ chỉ ở `28.3`–`28.4` bên trong lời của `28.1`. Đúng như Pāli từng khoá (138/138 khoá có cùng số dấu “ ” ‘ ’ như Pāli).

  **Thuật ngữ, kèm số đếm (phạm vi `kn`, đếm theo khoá Pāli).** `ñāti` → *thân nhân* trong công thức hồi hướng (`kp7:4.1`–`4.2`, `pv4:3.4`, `pv5:3.5`–`3.6`), 18 khoá `thân nhân` trong `kn`, so với `bà con` 46 (phần lớn là Jātaka) và `họ hàng` 22; theo công thức pv. `anvādisi`/`ādisi` → *hồi hướng* (10 khoá, so với *dâng* 3). `kūṭāgāra` → *lầu gác* (18 khoá, so với *nóc nhọn* 7, *nhà có mái* 1). `naggo` → *trần truồng* (11 khoá, so với *trần trụi* 1, *khỏa thân* 1). `saṅghe cātuddise` → *Tăng chúng bốn phương* (3/3). `pānīya` → *nước uống* (15 khoá). `kusa` (cỏ) → *cỏ kusa* (29 lần trong toàn tầng). `sakkhara` → *sỏi* (`ja185:1.3`, `ja185:2.3`; *sỏi đá* ở `mil5.4.5:5.1`). `kurūra` → *tàn bạo/tàn ác* (4/4 khoá ở `mn`, `mn14`, `mn60`). `kilanta` → *kiệt sức* (`pv40:4.1`, `ja442:8.2`). `paṇṇakuṭi` → *túp lều lá*: tầng chỉ có 4 khoá có từ này, bản Việt là *chòi lá* 1, *túp lều* 1, *lều* 1, chưa có đa số; chọn *túp lều lá* (`ud3.3:5.2` *chòi lá*, `tha-ap261:2.2` *túp lều*). `bhātā` số ít → *người anh em* (tầng không chia anh hay em; `bhātaro` số nhiều là *anh em*), vì Pāli không nói anh hay em.

  **Chỗ không chắc, ghi thay vì bịa nghĩa.**
  - `3.1`, `7.1` `sūcikaṭṭā`: hapax, 0 tiền lệ trong toàn Pāli đã ghim (chỉ xuất hiện ở pv27). Tách sūci (kim) + kaṭṭa; dịch *bị đau như kim đâm* là phỏng đoán có căn cứ hình thái và ngữ cảnh đói khát, không phải tiền lệ.
  - `3.4`, `7.4`, `8.4` `kurūrino`: hapax ở dạng này; `kurūra` ở `mn14`, `mn60` là *tàn ác/tàn bạo*. Ở đây chỉ người đã khuất, không rõ nghĩa đạo đức (tàn ác) hay nghĩa hình dạng (dữ tợn, đáng sợ); dịch *những kẻ tàn bạo* theo tiền lệ `kurūra`, ghi bất định. Cũng lưu ý ở `8.4` người nói là người anh em, và chữ này chỉ chính những ngạ quỷ được nhắc (cha mẹ và ông), nên đổi nghĩa đạo đức sang nghĩa hình dạng cũng hợp lý.
  - `4.1` `vitaritvā`: 0 tiền lệ; hiểu vi + tar (vượt qua, băng ngang), tân ngữ vắng trong Pāli; dịch *sau khi băng ngang*, không thêm *con đường* hay *chỗ*. Cũng có thể hiểu theo vi + tvar (vội vã).
  - `4.2` `ekapathekako`: 0 tiền lệ; ekapatha (lối đi một người, đường độc đạo) + hậu tố; dịch *trên lối đi độc đạo*.
  - `4.3` `catukuṇḍiko`: 0 tiền lệ ở Pāli đã ghim; catu (bốn) + kuṇḍika (co người xuống), hiểu là bò bằng bốn chi (hai tay hai chân) và dịch *kẻ bò bằng bốn chi*.
  - `4.4` và `16.4` `therassa dassayītumaṁ`: hình thức này không có tiền lệ ở nơi khác (13.1 và 27.2 dùng `uddassayī`, `paṭidassayuṁ`). Tôi hiểu là động từ hữu hạn *đã hiện ra* (đối xứng với `5.1`–`5.2`: vị trưởng lão nghe thấy không để tâm); cách đọc khác là động từ nguyên mẫu mục đích *để hiện ra*. Hai cách cho nghĩa gần nhau, ghi lại.
  - `5.1` `thero cāmanasikatvā`: tách ca + amanasikatvā, dịch *còn vị trưởng lão không để tâm*. 0 tiền lệ ở dạng này (`amanasikārā` ở các bài dn là danh từ trừu tượng).
  - `5.4` `bhātā petagato ahaṁ`: Pāli không có `te` (của ngài); *của ngài* được bổ ngữ từ `4.1` (`tassa bhātā`) và `6.1`. `petagato` dịch *đã đi vào cảnh ngạ quỷ*; 0 tiền lệ cùng từ.
  - `9.4` `bhattavissaggakāraṇā`: hapax; bhatta (thức ăn, cơm) + vissagga (cho đi, chia ra) + kāraṇa (vì lý do); dịch *vì việc chia sẻ thức ăn*. Ở `10.2`–`10.3` vị trưởng lão bảo các vị đưa phần đã nhận để dâng bữa cho Tăng, ăn khớp cách hiểu này.
  - `11.1` `niyyādayiṁsu`: tân ngữ vắng (hiểu là những gì họ đã nhận ở `10.2`); bản Việt cũng để vắng.
  - `24.1` `karaṇaṁ pūretvā`: hapax; `karaṇa` có thể là việc làm hay vật chứa; theo ngữ cảnh (`23.4` xin nước uống, `25.2` nước uống phát sinh, ao hồ ở `25.3`) dịch *đổ đầy một cái bình*. Từ *bình* là suy đoán từ ngữ cảnh; Pāli không nói *nước*.
  - `29.1` `sipāṭikaṁ laddhā`: 0 tiền lệ; `sipāṭikā` dịch *dép* (vật đi chân, ăn khớp `27.4` chân đau nứt nẻ và `28.1`–`28.2` đi khập khiễng trên sỏi và gai). Pāli là số ít; bản Việt dùng *dép* không đếm số.
  - `28.4` `yānaṁ`: *xe cộ* (`30.2` `rathena`, `31.2` `yānadānena`); tầng dịch `yāna` là *xe* (`bv20:17.2` xe voi).
  - `31.2` `yānadānena cūbhayaṁ`: ca + ubhayaṁ (cả hai). Không rõ *cả hai* chỉ hai hành vi bố thí nước uống và xe, hay hai thứ cùng nhau với nhà; dịch *cả hai thứ* để giữ mức mơ hồ.
  - `26.1` `sītodikā` và `26.2` `sītā`: cùng gốc sīta (mát); lặp lại như Pāli (*nước mát* … *mát lạnh*).
  - `18.4` `tepākāsevalambare`: đọc te + ākāse + valambare, theo `pv13:18.2` (cùng Pāli), *lại còn treo lơ lửng giữa không trung*.
  - `1.1` `Kuṇḍināgariyo`: 0 tiền lệ; hiểu là người ở Kuṇḍināgara (-iya) nên dịch *người Kuṇḍināgara*, giữ nguyên tên Pāli. `Poṭṭhapāda` giữ nguyên.
  - `27.2` `paṭidassayuṁ`: số nhiều, quá khứ; dịch *họ hiện ra*; `paṭi-` không dịch riêng.

  **Lỗi bản nháp đã bắt.** Bản nháp đầu viết hoa đầu khoá theo chữ hoa của Pāli làm các khoá giữa câu thành *Cho mẹ…*, *Có trong lãnh thổ…*, *Ở khắp…* (mất chữ liền mạch); đã viết lại theo ranh giới câu của bản Việt.

  **Technical gate.** Bị cấm chạy cổng ở lát này nên không tuyên bố technical gate pass; `technical_integrity` đặt 9.6. Còn phải chạy `npm run validate`, `npm test`, `npm run check` và `npm run build`. Trạng thái `draft` là do blocker `noEnglishEditionUpstream`, không phải do điểm: điểm trung bình 8.95 một mình sẽ ở mức `review`.
