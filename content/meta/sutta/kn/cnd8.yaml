notes: |-
  **Phạm vi: đủ 787/787 khoá của cnd8, không khoá nào ngoài tập khoá Pāli, cùng thứ tự.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Mettagū (Pārāyana, câu hỏi thứ tư), tức bài kệ `snp5.5`. Cấu trúc như `cnd7`, `cnd9`, `cnd11`, `cnd16`: dẫn từng đoạn kệ rồi giải từng cụm bằng chuỗi từ đồng nghĩa. Ngoài công thức chung còn tám khối riêng của bài: (i) ba loại câu hỏi và các bộ ba (`2`–`9`, cùng khuôn `cnd7:17`–`24`); (ii) giải *vedagū bhāvitatto* qua bảy pháp được biết rõ, sáu chi xả, thân và tâm an trú trước sắc khả ái hay không khả ái, ‘cái được thấy chỉ là cái được thấy’ và sáu căn được điều phục, rồi bài kệ *Dantaṁ nayanti* (`11`–`27`); (iii) khổ do sinh, già, bệnh, chết kèm danh sách bệnh tật (`28.5`) và mười sanh y (`34`); (iv) ba sự hiền trí, sáu bậc Mâu-ni và các bài kệ về bậc Mâu-ni (`48`–`57`); (v) *visattikā* với chín lời giải từ nguyên (`64`), *nivesana*, *bhava*, *appamatta*, *mamatta* (`75`–`81`); (vi) *nāga* qua ba nghĩa ‘không làm điều tội lỗi, không đi, không đến’ (`93`–`97`); (vii) khối bốn mươi khoá *ṭhito* giải *tiṇṇo ca pāraṁ* (`106`); (viii) *khila*, *kaṅkhā*, *saṅga* và định nghĩa vị ly tham ái (`109`, `115`–`116`). Pāli của bài: 49 khoá chứa nháy kép, 0 nháy đơn, 12 khoá có ngoặc đơn (đều là lời dẫn người nói trong kệ, khớp từng khoá), 62 khoá có `…pe…` (đều thành đúng một `…`), 37 khoá có `…` trần (đều giữ đủ), `8.12` kết `….` nên Việt kết ` ….`, 0 khoá có `(…)` trần.

  **Cách trình bày lemma** theo `cnd9`, `cnd7`, `cnd16`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Khoá `10.1` của Pāli gộp cả lemma `Iccāyasmā mettagū` lẫn `iccāti padasandhi …pe…` nên Việt cũng ở một khoá (*Tôn giả Mettagū nói. Iccā: …*), `Iccā` giữ nguyên Pāli vì lời giải nói về chính hình thức của từ. Dòng kệ `(mettagūti bhagavā)` dịch *(Này Mettagū, Đức Thế Tôn nói,)* theo `cnd2:19.2`, `cnd2:22.2`, `cnd2:24.2` và các bài cnd khác; `(iccāyasmā mettagū)` dịch *(Tôn giả Mettagū nói,)* như `cnd2:18.2`; `(sabhiyāti bhagavā)` dịch *(Đức Thế Tôn nói với Sabhiya)* như 12 khoá ở `mnd4`, `mnd9`, `cnd9`.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `cnd8`: thư mục `kn` của tầng Anh đã ghim chỉ có cp 35, dhp 26, iti 112, ja 83, kp 9, snp 73, thag 264, thig 73, ud 80 tệp (755 tệp, đối chiếu manifest), tệp `cnd8_translation-en-sujato.json` không tồn tại, chỉ có tệp tên `cnd-name` (nhãn tác phẩm, không phải văn bản kinh). Lớp `english-project` không có `cnd8` (kn ở đó chỉ có dhp, iti, ja, mil, ne, pv, snp, thag, ud, vv). Tầng `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli từ 40 ký tự trở lên sau khi gộp khoảng trắng, tính cả thẻ in đậm như phép đo của kho, bỏ 4 khối `:0`) là **309** khoá (còn 280 khi bỏ thẻ in đậm; kết luận không đổi). Sujato phủ 0/309 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/309, `vietnamese-current` 0/309. Hai chứng cứ độc lập trong chính corpus, nhưng đều là bản của **bài khác** nên không tính là đối chiếu English của cnd8: (a) các kệ trùng nguyên văn Pāli với `snp5.5`, `snp3.6`, `dhp321`–`dhp323`, `dhp268`–`dhp269`, `an3.122`, `iti67` mà Sujato có dịch; (b) công thức chú giải đã dịch ở `cnd2`, `cnd5`–`cnd7`, `cnd9`–`cnd13`, `cnd16`, `cnd17`, `cnd19`, `cnd20`, `mnd1`, `mnd3`, `mnd4`, `mnd6`, `mnd9`. Đã đọc Sujato `dhp321`–`dhp323` để hiểu câu kệ *Dantaṁ nayanti*, không dùng làm tầng tham khảo của cnd8. Không có English độc lập cho các đoạn giải riêng của bài (mười sanh y, ba sự hiền trí, nāga, khối *ṭhito*, định nghĩa *khila* và *saṅga*).

  **Dùng lại tiền lệ.** Đã dò 787 khoá bằng chỉ mục Pāli toàn tầng bản Việt (bỏ thẻ in đậm, gộp khoảng trắng): **338** khoá của cnd8 có Pāli trùng nguyên văn với khoá đã dịch ở bài khác (2.319 cặp khoá-khoá); dùng lại nguyên văn ở **307** khoá, khác ở **31** khoá (265 cặp lệch, phần lớn vì một khoá Pāli có nhiều bản Việt khác nhau ở các bài khác, như *Vì thế, Đức Thế Tôn đã nói—* 126 lượt so với *Vì vậy …* 1 lượt). 449 khoá không có tiền lệ nguyên văn; phần lớn là lời giải dựng theo công thức gần nhất đã dịch: bộ ba câu hỏi ở `cnd7:17`–`24`, đoạn *Vedagū* ở `mnd4:40`–`41`, `mnd9:103`–`104`, danh sách khổ ở `cnd5:14`, công thức *Kittayissāmi te dhammaṁ … Tañcāhaṁ abhinandāmi* ở `cnd9:42`–`54`, *Yaṁ kiñci sampajānāsi … Uddhaṁ adho* ở `cnd9:55`–`59` và `cnd16:18`, *Etābhinandāmi … Sukittitaṁ* ở `cnd11:57`–`60`, *Sādhu viyākarohi* ở `cnd10:46`–`47` và `cnd16:13`–`14`, nāga ở `mnd9:91`–`95`, khối *ṭhito* ở `mnd1:80`–`82`, *Tiṇṇo/akiñcano* ở `cnd13:24`–`25`, *anīgho/nirāso* ở `cnd7:65`–`67`, *visajja* ở `mnd4:61`, *visattikā* ở `mnd1:29`, *mahesi* ở `cnd19:21`, bảy muni ở `mnd6:64`, *so vītataṇho* ở `cnd6:13`. 31 khoá khác gồm: (i) 4 khoá kệ `1.3`, `30.3`, `110.1`, `111.1` dịch *vedagū* thành *bậc đạt minh* thay *bậc thông suốt tri thức* của `cnd2:18.3`, `cnd2:28.1`, `snp5.5:1.3`, để kệ cùng một từ với lời giải *Vedo … vedagū* (`11`, `103`, `112`, theo `mnd4:40`, `mnd9:103`); `100.1` và `117.1` cũng đổi như vậy nhưng không nằm trong số 31 vì Pāli có dấu nháy mở; (ii) 3 khoá `31.4`, `36.4`, `36.1`: *sanh y làm nguồn gốc* thay *sanh y làm nhân* và *chỗ phát sinh của khổ* thay *nguồn gốc của khổ* (`cnd2:19.1`, `cnd2:19.4`) theo thuật ngữ trong bài (xem dưới); (iii) `46.4` *làm thế nào vậy* thay *như thế nào* của `mnd9:25.3` để cùng `46.2`; (iv) 8 khoá `52.1`–`52.3`, `53.1`–`53.3`, `55.2`, `56.2` dịch *muni* thành *bậc Mâu-ni* thay *hiền nhân* (`an3.122:4`) và *ẩn sĩ* (`iti67:3`, `dhp268`, `dhp269`), để cùng từ với `48.3`, `54.x`, `57.4`; (v) 3 khoá `72.4`, `72.5`, `78.4` (và lemma `75.1`) dịch *nivesana* thành *chỗ trú ngụ* thay *chấp trú*, và *panujja viññāṇaṁ* thành *hãy xua tan thức* thay *thức chớ trú*, vì lời giải `76.1`–`76.3` coi thức là điều bị xua tan; (vi) `100.3`, `110.3` *Thật vậy* thay *Chắc chắn* của `cnd2:28.3` để cùng `87.1`, `105.1` và lemma *addhā*; (vii) `111.2`, `117.2` *tháo gỡ* thay *buông bỏ* của `cnd2:29.2` vì `115.5`–`115.9` giải *visajja* là *tháo gỡ* (theo `mnd4:61.19`–`61.27`); (viii) `111.3`, `117.3` *không khổ não* thay *không khổ* (theo `cnd7:57.4`, `cnd11:14.2`); (ix) `16.5`, `17.2`, `18.2` *Nghe âm thanh bằng tai …* thay *Khi tai nghe âm thanh …* của `mn51:16.3` cho đồng bộ với `15.3`; (x) `85.2` dùng *cách nói … lời giảng … con thèm khát* như `cnd9:50.2` thay *lời phát ngôn … bài thuyết giảng … con khao khát* của `cnd11:59.2` cho đồng bộ với `67.2`–`67.3`; (xi) `59.1` chỉ khác dấu cuối khoá; (xii) `113.5` *vị ấy là bậc đạt minh* thay *bậc minh triết* của `snp3.6:31.5`.

  **Trong chính bài:** 94 nhóm Pāli trùng nguyên văn (272 cặp, không phân biệt hoa thường và dấu cuối khoá); bản Việt giống nhau (chỉ khác chữ hoa đầu khoá và dấu cuối) ở 89 nhóm, **khác ở 5 nhóm**, đều có lý do cú pháp: (1) `37.4` = `41.7` (kệ so với lời giải *người quán sát …*); (2) `43.4` = `59.4` so với `79.3` = `83.3` (*của sinh, già, sầu và bi thương?* là bổ ngữ của câu hỏi, còn *sinh, già, sầu và bi thương,* là tân ngữ của *pajaheyya*); (3) `60.5` = `66.4` so với `64.17` = `70.6` (*vị ấy vượt qua …* ở kệ, *vượt qua …* khi lặp lại lemma, đúng như `cnd9:42.5` so với `cnd9:47.6`); (4) `66.2` = `71.2` so với `68.36` (*pháp tối thượng ấy* so với *pháp tối thượng*, như `cnd9:49.2` so với `cnd9:51.8`); (5) `100.2` = `110.2` so với `104.11` (kệ so với lời giải *người không sở hữu gì …*). Sau khi đọc cặp Pāli↔Việt đã sửa: `14.3` đổi *đã được thắng tri …* thành *đã thắng tri …* theo `mnd1:80.6`; `77.10` tách chủ ngữ và vị ngữ theo cách của `80.2`; `115.5`–`115.9` thêm *mà* cho *vā visajja*; `116.2` sửa trật tự *tham ái này ở ai*; `34.3` tách mệnh đề cuối bằng dấu chấm phẩy.

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `upadhi` → *sanh y*: 117 khoá chứa `upadhi` đã dịch *sanh y* (`cnd1:17.6`, `cnd2:19.4`, `cnd11:60`, `snp3.12`), *chấp thủ* 2 khoá (`snp5.5:2.4`), *y sinh* 3 khoá. `nidāna` trong *upadhinidānā* → *lấy sanh y làm nguồn gốc* (`34.9`, kệ `31.4`, `36.4`) theo chuỗi mười từ `mūla … samudaya` ở `cnd7:2.7`, `cnd7:9.4` (chỉ có hai khoá cho cả chuỗi): *gốc, nhân, nguồn gốc, nguồn sinh, chỗ phát sinh, nơi khởi lên, thức ăn, đối tượng, duyên, tập khởi*, nên `pabhava` là *chỗ phát sinh* (`28.8`, `32.1`–`32.4`, `33.2`, `41.2`, kệ `31.1`, `36.1`, `37.4`, `42.4`); khác `cnd2:19.1`, `snp5.5:2.1` (*nguồn gốc của khổ*), `mnd12:41.2`, `mnd12:71.2` (*vì nguồn gốc gì*). Riêng công thức `taṅkāraṇā taṁhetu tappaccayā taṁnidānā` dùng *vì căn nguyên ấy* (`40.2`, theo `mnd1:75.2`, `mnd6:64.2`, `cnd16:23.2`, `cnd21:8.2`, 4 tệp).
  - `vedagū` → *bậc đạt minh*, `veda` → *minh*: trong 84 khoá chứa `vedag-`, *đạt minh* 16 khoá (`mnd4:40`, `mnd9:102`–`105`, `snp3.12:17.1`), so với *thông suốt tri thức* 6 khoá (`snp5.5` 3, `cnd2` 3, đều là kệ gốc).
  - `nivesana` → *chỗ trú ngụ*: 16 khoá *chỗ trú ngụ* (`mnd9:102.4`, `mnd9:108`, `mnd5:34`, `mnd5:37`, `snp3.4:22.1`), 23 khoá *trú ngụ*, so với *chấp trú* 2 khoá (`cnd2:24.4`, `snp5.5:7.4`).
  - `muni` → *bậc Mâu-ni*: 216 khoá *Mâu-ni*, 46 khoá *ẩn sĩ*, 1 khoá *hiền nhân* trong 307 khoá chứa `muni` (`cnd10:46.3`, `cnd13:23.2`, `mnd6:64`, `snp3.6:28.4`), `mona`/`moneyya` → *sự hiền trí* (`mnd6:64.4`–`64.8`); `kāyamoneyyaṁ …` → *sự hiền trí về thân, về lời, về ý*.
  - `anīgha` → *không khổ não* (`cnd7:57.4`, `cnd7:65`, `cnd11:14.2`): trong 81 khoá chứa `nīgh-`, *không khổ não* 15 và *không khổ* 15; chọn *khổ não* vì *phiền não* đã dành cho `kilesa`.
  - `khila` → *chướng ngại* (`cnd2:28.4`, `dn20:19.5`); *chai cứng* (`mn16`, `dn33`) là cách dịch của `cetokhila`/`khilajāta`. `kaṅkhā` → *nghi hoặc* (`cnd2:28.4`); `cnd9:23.9` dùng *nghi ngờ* cho cùng chuỗi `dukkhe kaṅkhā …`, nên `109.4` lệch một chữ có chủ ý.
  - `addhā` → *Thật vậy*: 5 khoá mở đầu bằng `Addhā hi/Addhāti` (`mnd1:9.2`, `cnd2:26.3`, `snp5.5:9.3`, `snp2.13:17.1`, `snp3.4:10.1`) so với *Chắc chắn* 3 khoá (`cnd2:28.3`, `snp5.5:11.3`, `ja280:1.1`); `visajja` → *tháo gỡ*, `vosajjetvā` → *buông bỏ* (`mnd4:61.19`–`61.27`; trong 101 khoá chứa `visajj-`: *tháo gỡ* 10, *buông bỏ* 5); `sahagata` → *câu hữu* (`cnd17:52.1`); `chandarāga` → *ham muốn và tham* (`sn35.232:10`, `sn22.57`); `mute` → *cái được cảm nhận* (`ud1.10`, `sn35.95`); `phoṭṭhabba` → *xúc chạm*, `sadda` → *âm thanh* (`cnd13:10.2`); `rūpārāmo …` và `dantaṁ guttaṁ rakkhitaṁ saṁvutaṁ` theo `mn75:8`; `rajanīye na rajjati …` theo `an5.81:2.3`; `anūpayo anapāyo anissito …` theo `mnd3:56`, `mn112:4`.
  - `nāga` giữ *nāga* trong lời giải (`mnd9:91`–`95`), *bậc long tượng* ở kệ (`cnd2:27.3`); `danta` ở kệ `22`–`24` dịch như `dhp321`–`dhp323` (*voi đã luyện*), xem bất định.
  - `visattikā` chín từ nguyên theo `mnd1:29` (8 khoá), riêng `visamā` không có tiền lệ.

  **Số Pāli.** `tisso pucchā` = *ba loại câu hỏi*: 14 khoá chứa `tisso`, tạo thành 12 bộ ba (`2.3`, `5.2`, `8.2`, `8.4`–`8.12`), mỗi bộ đúng ba mục Việt; `dasa upadhī` = *mười sanh y* (`34.2`): bảy sanh y đầu (tham ái, kiến, phiền não, nghiệp, ác hạnh, thức ăn, sân hận) + *bốn giới được chấp thủ* + *sáu xứ bên trong* + *sáu nhóm thức* = **10**; mệnh đề cuối `sabbampi dukkhaṁ dukkhamanaṭṭhena upadhi` đứng riêng sau dấu chấm phẩy, không tính là mục thứ mười một; `cha munino` = *sáu bậc Mâu-ni* (`54.2`), đếm lại ở `54.3`: tại gia, xuất gia, hữu học, vô học, Độc Giác, Mâu-ni của các Mâu-ni = **6**; `satta saṅgā` = *bảy sự trói buộc* (`115.3`), đếm lại ở `115.4` = **7**; `sattannaṁ dhammānaṁ` = *bảy pháp* (`11.9`, `101.2`), đếm lại ở `11.10`, `101.3` = **7** (thân kiến, nghi hoặc, giới cấm thủ, tham, sân, si, ngã mạn); `tīṇi moneyyāni` = *ba sự hiền trí* (`48.6`); `Vīsativatthukā sakkāyadiṭṭhi` = *hai mươi cơ sở* (`75.10`); `cattāro satipaṭṭhāne … satta bojjhaṅge` = *bốn niệm xứ, bốn chánh cần, bốn thần túc, năm căn, năm lực, bảy giác chi* (`61.2`); `catūhi kāraṇehi` = *bốn lý do* (`63.4`, `69.5`, `80.4`); `chaḷaṅgupekkhā` = *sáu chi xả* (`14.3`); `dve nivesanā`, `dve bhavā`, `dve kāmā`, `dve mamattā` = *hai*. Không có số lớn, không có `sahassa`/`sata`/`navuti`, không có cụm `tiṁsakappasahassa`.

  **Bất định (không thêm vào thân kinh).**
  1. `34.3` `dukkhamanaṭṭhena`: hợp từ không có tiền lệ và không phân tích được chắc chắn từ Pāli root; giữ nguyên `dukkhamana` trong Việt (*theo nghĩa dukkhamana*) thay vì đoán nghĩa.
  2. `22`–`24` `dantaṁ nayanti samitiṁ …`: Pāli chỉ nói `danta` (*vật/ người đã được điều phục*), không có danh từ; `dhp321`–`dhp323` (và Sujato) thêm *voi/ beast*. Dùng lại bản dhp để bài khớp `dhp321`–`dhp323`, ghi bất định này.
  3. `16.3`, `16.9` `alīnamanaso` → *ý không uể oải* (không có tiền lệ nguyên văn; `sn46.6:3.4` dịch `adīnamānaso` là *ý không buồn phiền*, `ja55:1.2` *có ý không bị vướng*); `maṅku` → *ủ rũ* (`mil2:64.1`, còn `sn46.6` *chán nản*).
  4. `54.5`, `54.8` `diṭṭhapadā` → *đã thấy cảnh giới* theo `tha-ap500:26.3`; `kp6:12.4` dịch *đã thấy Niết-bàn*, `an7.66:10.2` *đã thấy chân lý*; chưa phân xử được.
  5. `87.2` `nirodhavacanaṁ` → *lời nói chấm dứt*: `mnd1:9.2` đọc `niyogavacanaṁ` (*lời nói quyết định*); đây là dị bản của tầng Pāli đã ghim, dịch đúng từ có trong `cnd8`.
  6. `106.19` `Kathaṁ samādāya ṭhito?` → *An trú sau khi đã thọ trì như thế nào?*: `mnd1:81.15` có dạng `kaṭaṁ samādāya ṭhito` (*sau khi đã nắm lấy ván thắng*); cnd8 đọc `kathaṁ`, nên câu hỏi mở ra `106.20`, `106.21`; `106.20` `vimuttipaṭisevanatāya` → *thường nương theo sự giải thoát* theo `mnd1:81.16`.
  7. `64.7` `visamāti visattikā` → *vì bất chính* (không có trong chuỗi ở `mnd1:29`; `visama` dịch theo `visamalobho` *tham bất chính*, `visamaparihāra` *không giữ gìn đúng cách*).
  8. `80.8`, `80.12` `anuggaṇheyyaṁ` → *dùng tuệ trợ giúp* (không có tiền lệ); chuỗi *chando … appamādo* (`80.8`, `80.12`, `80.13`) 0 tiền lệ cho cả chuỗi; chỉ có tiền lệ rời (`cnd9:9.1`, `sn56.34:1.2`).
  9. `11.2` `paṭijānāmi` → *con xác nhận*; `103.3` `abhijaññā` → *được biết rõ … nên thắng tri*; `62.3`, `62.7` dùng *thiết thực hiện tại* cho `diṭṭhe dhamme` nhất quán với `cnd9:45.4`, `cnd9:45.8`.
  10. `46.5` `dhīrā paṇḍitā …` và `82.8`, `112.2` `vidvā vijjāgato …` là hai ánh xạ khác nhau của dãy từ trí tuệ (theo `cnd9:11.3` và `mnd4:40.2`); kệ `100.1`, `110.1` dùng *được biết rõ là* thay *được biết là* của `cnd2:28.1` cho khớp lemma `103.3`.
  11. `62.8` kết *thiết thực hiện tại: thiết thực hiện tại* vì Pāli lặp lại lemma sau `kathayissāmīti`.

