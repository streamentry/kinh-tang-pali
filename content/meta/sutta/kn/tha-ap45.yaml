notes: |-
  Dịch từ Pāli root đã ghim. Tại commit đã ghim không có bản Anh của Bhikkhu Sujato cho phẩm `tha-ap` (tệp thân kinh không tồn tại; manifest chỉ có 9 sub-collection của `kn`), không có bản Việt hiện hành (tầng `vietnamese-current` chỉ có Pháp Cú), và không có lớp lấp `english-project` cho uid này. Bản dịch vì vậy KHÔNG được đối chiếu English ở khoá nào; Pāli phải tự đứng vững.

  PHẠM VI. 72/72 khoá, khớp tập khoá Pāli và đúng thứ tự Pāli, không có khoá ngoài tập. Bài gồm tiêu đề (`:0.1`–`:0.3`), 16 khổ kệ (`:1`–`:16`), câu kết Itthaṁ sudaṁ (`:17.1`) và câu kết bài (`:18.1`).

  COVERAGE ANH, đo theo công thức của `source/layers.yaml` (khoá Pāli có nội dung từ 40 ký tự, bỏ khối `:0`): mẫu số = 2 (`:17.1` 78 ký tự, `:18.1` 54 ký tự; mọi khoá kệ đều ngắn hơn 40 ký tự), `english-sujato` phủ 0/2, ratio 0,0 dưới ngưỡng 0,8. Mẫu số chỉ là 2 nên cổng đo được rất ít, nhưng ở đây nó đo được và báo không đạt; tầng Anh không có chữ nào cho 72 khoá. Ba tầng tham khảo vắng hết nên triangulation đặt 7,5 và status `draft` kèm blocker, không nâng điểm để né blocker. Chưa có entry `tha-ap45` trong `content/meta/reference-gaps.yaml`.

  TIỀN LỆ, có số đếm (đo trên các bài `tha-ap` đã dịch trong tầng Việt, trừ bài này). Pāli trùng nguyên văn với khoá khác của tầng: 27 khoá của bài này có ít nhất một khoá Pāli trùng; 23 khoá dùng lại nguyên văn bản dịch đa số hoặc duy nhất, 4 khoá khác cố ý. Công thức dùng lại nguyên văn: `:0.1` Therāpadāna (446 so với 11 biến thể), `:0.2` Phẩm Upāli (5), `:6.1`/`:9.1` Đức Padumuttara, bậc hiểu rõ thế giới (10 so với 1), `:7.3`/`:8.3` Với tâm tịnh tín hân hoan (50; hoan hỷ 10), `:9.2` bậc tiếp nhận lễ vật hiến cúng (13 so với 2), `:9.4` đã nói những bài kệ này (11), `:13.4` được khích lệ bởi cội nguồn thiện căn (11 so với 3 dạng rễ trắng), `:13.6` sẽ làm môn đồ của bậc Thầy (3 so với 1 dạng đệ tử), `:15.2` bậc Toàn Tri, bậc Dẫn Đạo thế gian (1 trong bốn bản; ba bản kia ghi Đạo sư của thế gian, nhưng lokanāyaka ở các khoá khác của tầng là Dẫn Đạo thế gian nên theo nhóm đó), `:16.1` Bốn vô ngại giải (444), `:16.2` đúng một dấu lược (605), `:16.3` đã làm tròn lời dạy của Đức Phật (416), `:7.1` Đi ra nghênh đón Đức Chánh Đẳng Giác (1), `:10.3`/`:10.4` Ta sẽ tuyên thuyết về người ấy, hãy nghe lời ta nói (1 khoá mỗi câu), `:11.4` được các tiên nữ vây quanh (2), `:6.2` đấng Nhân Ngưu (lokajeṭṭho narāsabho đa số 18). Công thức câu kết `:17.1` theo nhóm Tôi nghe như vầy ... đã nói những bài kệ này (407 khoá), không dùng nhóm đã từng nói bài kệ này (21 khoá), vì imā gāthāyo là số nhiều.
  Trong chính bài có 4 nhóm Pāli trùng nhau (`:5.2`/`:10.2`, `:6.1`/`:9.1`, `:7.3`/`:8.3`, `:9.3`/`:15.3`); cả bốn nhóm Việt giống nhau tuyệt đối, 0 cặp lệch.
  Bốn khoá khác tiền lệ có chủ ý: `:2.4` nơi ruộng phước vô thượng (tiền lệ 1 khoá nơi phước điền vô thượng; chọn ruộng phước để khớp `:4.4` ruộng phước vô thượng, 1 khoá khác của tầng, cùng bài); `:3.2` tādino dịch bậc Vững Vàng (tiền lệ 1 khoá dịch bậc ham muốn điều ấy, không có căn cứ trong Pāli tādī; Vững Vàng/Bất Động mỗi cách 7 khoá trên toàn tầng); `:11.3` Sẽ thọ hưởng sự phúc báo (tiền lệ thọ hưởng sự phúc báo, thêm Sẽ vì Pāli là thì tương lai); `:12.3` năm mươi mốt lần (hai tiền lệ, một khoá là và thêm một lần nữa, một khoá là Lại thêm năm mươi lần nữa, cả hai sai số so với Pāli ekapaññāsa).

  TÊN BÀI `:0.3` VÀ KẾT BÀI. Pāli `:0.3` bắt đầu bằng số (3 Kāḷigodhāputtabhaddiyattheraapadāna) nên giữ số theo hình thức N. ; translationTitle bằng đúng giá trị `:0.3`. Chính sách số thứ tự trên tầng: 116 tệp có số, 333 tệp không. Tiền tố tên bài: đo ở phạm vi gần nhất (các bài tha-ap40 đến tha-ap59 đã dịch) cho Bài Kệ Tuyên Ngợ 9, Ký Sự 3, Bài Kệ Tuyên Ngôn 3; đo toàn tầng cho Tuyên Ngợ 244, Tuyên Ngôn 97, Ký Sự 96, khác 12. Tuyên Ngợ là chữ không có nghĩa (lỗi chính tả); chọn Bài Kệ Tuyên Ngôn Về Trưởng Lão vì Tuyên Ngợ không thể giữ, và bài kề `tha-ap49` đã dùng đúng dạng này. Hai phạm vi cho đa số khác nhau nếu tính Tuyên Ngợ là một cách riêng, nên đề nghị biên tập viên phán một lượt cho cả cuốn. Tên Kāḷigodhāputtabhaddiya ở `:0.3` giữ chữ Pāli ghép như tiền lệ Vajjīputta (tha-ap557) và Vaṅgantaputta (tha-ap19); ở `:17.1`/`:18.1` Pāli tách Bhaddiya và kāḷigodhāya putto nên dịch Bhaddiya, con trai của Kāḷigodhā.

  SỐ PĀLI, tự tính. `:11.1` Catusattatikkhattuṁ = catu 4 + sattati 70 = bảy mươi tư lần (khớp tha-ap228:4.1 và tha-ap331:8.1 bảy mươi tư kiếp). `:12.3` Ekapaññāsakkhattuñca = eka 1 + paññāsa 50 = năm mươi mốt lần (khớp tha-ap209:4.1 và tha-ap132:8.1 năm mươi mốt). `:12.1` sahassaṁ = 1.000 (một ngàn). `:5.1` Satasahassapallaṅkaṁ và `:8.1` Bhikkhūnaṁ satasahassaṁ: sata 100 × sahassa 1.000 = 100.000 (một trăm ngàn, theo tiền lệ satasahassa của tầng). Không có cụm Tiṁsakappasahassa trong bài.

  NHÁY. Pāli mở ngoặc kép ở `:1.1` và đóng ở `:16.3`; mở nháy đơn ở `:10.1` và đóng ở `:13.6`. Bản Việt khớp Pāli từng khoá (0 lệch trên 72 khoá). Dấu lược: Pāli có đúng một `…pe…` ở `:16.2`, Việt đúng một dấu lược; không có dấu lược nào khác. Đã in cặp Pāli↔Việt đọc từng khoá; kiểm NFC, khoá rỗng, khoảng trắng thừa, chữ Pāli lọt sang Việt (chỉ có các tên riêng) đều sạch.

  BẤT ĐỊNH ĐÃ GHI (không đưa vào thân kinh). (a) `:5.1` satasahassapallaṅkaṁ: đọc là chiếc ghế trị giá một trăm ngàn; đọc một trăm ngàn chiếc ghế bị loại vì `:5.2`, `:5.6`, `:10.1` đều số ít (một chỗ ngồi); chữ trị giá suy từ cấu tạo hợp từ, Pāli không có chữ giá. (b) `:5.2`–`:5.4` tên đồ trải: gonaka (thảm len lông dài), tūlikā (nệm bông), paṭalikā (tấm phủ len hoa văn), khoma (vải lanh), kappāsika (vải bông) là nghĩa từ điển; 0 tiền lệ trong tầng Việt cho gonaka, tūlikā, paṭalikā (khoma có hai tiền lệ là bột thọ ở tha-ap32 và tha-ap15, không hợp nghĩa nên không theo). (c) `:2.1` sattu và baddhaka giữ nguyên chữ Pāli vì nghĩa của baddhaka không chắc; 0 tiền lệ. (d) `:4.1` uyyojitā dịch được sai đi; `:4.3` kevalaṁ dịch toàn thể (không phải chỉ riêng), vì `:8.1` mời một trăm ngàn tỳ-kheo. (e) `:7.4` saṅgharaṁ đọc là nhà của mình (sa-ghara), suy từ pv37:53.1 và tha-ap430:11.2 cùng dạng, ở đó nghĩa nhà; chưa có bản Anh hay Việt đối chiếu; đại từ Ngài bổ sung theo `:7.1`. (f) `:12.1` padesarajjaṁ sahassaṁ: đọc một ngàn lần làm vua một vùng, suy từ 8 song song có dạng Pathabyā rajjaṁ aṭṭhasataṁ cộng vasudhaṁ āvasissati (tha-ap4, 12, 22, 36, 37, 43, 52, 61); khoá này thiếu chữ chỉ số lần nên vẫn là bất định. `:12.2` āvasissati dịch cư ngụ theo tha-ap61:6.4. (g) `:15.4` etadagge ṭhapesi maṁ: Pāli không nêu lĩnh vực nên chỉ dịch xếp tôi vào hàng đệ nhất và không thêm lĩnh vực nào; công thức này còn ở 12 bài tha-ap khác chưa có bản Việt nên chưa có tiền lệ. (h) `:13.1` bhavayonīsu dịch cõi tái sinh (0 tiền lệ). (i) `:14.2` pantasenanivāsahaṁ: phân tích hợp từ thành pantasenāsana (trú xứ hẻo lánh) cộng nivāsa cộng ahaṁ; không chắc chắn về tách từ. (j) `:14.4` cattaklesomhi dịch đã từ bỏ phiền não, không thêm chữ mọi.

