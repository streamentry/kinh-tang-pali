notes: |-
  **Sửa lan 2026-10-13** (cùng lỗi đã sửa ở cnd21:5.1 và cnd21:30.1–35.3; Pāli các khoá này trùng nguyên văn). (1) `snp5.18:1.3` — *Nếu ai hiểu rõ ý nghĩa và pháp của từng câu hỏi … người ấy sẽ đi đến bờ bên kia* → *… của dù chỉ một câu hỏi … người ấy chắc chắn sẽ đi đến bờ bên kia …* (thêm `cepi` *dù chỉ* và `-eva` của `gaccheyyeva` *chắc chắn*). (2) `snp5.18:7.1`–`7.3` — *Nếu ai thực hành đúng theo* / *từng câu hỏi như Đức Phật đã dạy,* / *người ấy thực hành như vậy,* → *Từng câu hỏi,* / *như Đức Phật đã dạy,* / *ai thực hành như vậy,* (bản cũ đặt *nếu ai thực hành* vào dòng của `ekamekassa pañhassa` rồi lặp lại *thực hành như vậy* ở dòng của `tathā yo paṭipajjeyya`; nay `yo paṭipajjeyya` ở đúng dòng của nó, `7.4` đã khớp cnd21:30.4). Hai chỗ thuật ngữ trong mô tả (*sự tạo tác* → *hành tạo tác*, *khẩn thỉnh* → *thỉnh cầu*) không có mặt ở bài này: bản Việt không chứa hai cụm đó (`1.2` đã là *thỉnh cầu*).
