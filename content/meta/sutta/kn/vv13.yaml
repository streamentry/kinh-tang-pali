notes: |-
  Dịch TRỰC TIẾP từ Pāli root — không có tầng Anh đã ghim cho vv13, xem blocking_errors.
  Chỉ mục Pāli và Việt toàn tầng: 31 khoá của bài này có Pāli trùng nguyên văn ở bài khác, 25 dùng lại NGUYÊN VĂN bản Việt đã có — nguồn chính vv1 và vv4 cho khung câu hỏi, lời dẫn, kết quả và lời dạy; vv26:1.1 cùng vv27:1.2–1.4 cho bốn câu mở đầu; vv28:5.1 cho câu thấy tỳ-kheo; vv4:6.2 và vv4:6.4 cho 6.2 và 6.4.
  0.4 Paṭhamasuṇisāvimānavatthu: tầng name/ đã ghim cho vv-name:15.vv13 bằng Daughter-in-Law Mansion. Cả tầng Việt có 0 tiền lệ cho suṇisā; theo tầng name và theo câu 5.2 (Suṇisā ahosiṁ sasurassa gehe, tôi là người dâu trong nhà chồng mình) thì dịch Nữ Dâu, đối xứng với vv14 là Thứ Hai. Đây là BẤT ĐỊNH.
  BẤT ĐỊNH 6.3–6.5: pūva và bhāgaḍḍhabhāga đều là phần ăn, Pāli lặp ý ở cả hai câu kệ. Để câu Việt không lặp, 6.3 dịch pūva là phần ăn (13 tiền lệ cho phần ăn) và 6.5 dịch bhāga là chia phần; KHÔNG bỏ ý nào.
  6.6 modāmi nandane vane có tiền lệ vv71:4.4 (nay con được hoan hỷ trong khu vườn Nandana) nhưng đổi con thành tôi vì người kể ở đây là nữ thiên chứ không phải thiên tử; chỉ khác đại từ, không khác nghĩa. GHI RÕ vì đây là điểm lệch có chủ đích so với vv71.
  Cổng kỹ thuật: npm run validate, npm test, npm run check do coordinator chạy; bài này draft nên không cần npm run build. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
  Kiểm toán độc lập 2026-10-11: đọc đối kháng cặp Pāli và Việt từng khoá, 19/37 khoá đổi, trong đó 10 khoá sai nghĩa thật. Sai nghĩa: 2.2 và 7.2 (idha mijjhati không phải "có được nơi này" mà là thành tựu được ở nơi đây); 3.1 (devi mahānubhāve là hô cách, không phải đối tượng "đại oai lực ấy", và nữ thiên là "nàng" chứ không phải "ngài"); 8.1 (bhikkhu mahānubhāva là hô cách); 8.2 và 8.3 (yamakāsi và Tenamhi do nữ thiên nói, chủ ngữ là "tôi", không phải "ngài"); 4.4 (yassa kammassidaṁ: về nghiệp mà đây là quả báo, không phải "quả báo của nghiệp này là thế"); 5.2 (sasurassa gehe là nhà cha chồng, không phải "nhà chồng"; suṇisā dịch con dâu); 6.3 (pūvaṁ là chiếc bánh, bản cũ bỏ mất và dịch thành "phần ăn", đồng thời bỏ tassa); 6.5 (Bhāgaḍḍhabhāgaṁ là nửa phần chia, bản cũ chỉ còn "chia phần trao đi"). Lỗi chữ hoặc sắc thái: 2.3 và 7.3 ("khưởi" là chữ vô nghĩa, sửa thành "khởi"); 4.2 ("truy hỏi" thêm sắc thái tra vấn, pucchitā chỉ là được hỏi); 4.3 (pañhaṁ puṭṭhā viyākāsi). Thêm nghĩa nhẹ đã gỡ: 1.2 ("nơi đây"), 6.1 ("thanh tịnh" lặp virajaṁ), 6.2 ("tâm ý": vippasannaṁ anāvilaṁ là tính từ của vị tỳ-kheo, như ở Dhp 413 và vv28:5.2, snp3.9:49.2), 8.4 (sắc tướng đổi dung sắc cho khớp 1.1 và 7.1), 6.4 (dấu câu). Dùng lại tiền lệ đã kiểm: vv15 cho 2.2, 3.1, 4.2 đến 4.4, 7.2, 8.1 đến 8.4; vv29:6.3 cho chiếc bánh; vv28:5.1 và 5.2 cho ly trần, trong sáng không vẩn đục.
  Ghi chú trên đây thay thế các nhận định cũ không còn đúng: "pūva là phần ăn" và "13 tiền lệ cho phần ăn" là sai (pūva là bánh); số liệu "25 dùng lại nguyên văn" của lượt trước nay không còn đúng nhiều khoá vì bản Việt của vv4 (và vv1:5.4) chứa chính các lỗi nêu trên; đại từ ở 6.6 vẫn giữ "tôi". Lỗi lan: các lỗi trên có mặt ở vv2 đến vv4, vv6, vv9, vv10, vv14, vv18, vv19, vv85 và nhiều tệp vv khác có cùng Pāli, chưa sửa ở lượt này.
  Bất định còn lại: Bhāgaḍḍhabhāgaṁ chọn nửa phần chia (cùng gốc với pv11:5.4, nơi tệp đó dịch khác); mối quan hệ giữa chiếc bánh ở 6.3 và nửa phần chia ở 6.5 không phân xử được từ Pāli một mình, nên giữ hai mệnh đề riêng. 2.4 và 7.4 (ye keci manaso piyā) giữ "dễ chịu với tâm" theo họ tệp, piya là thân thương, vừa ý, nên sắc thái hơi yếu. 0.2 Itthivimāna dịch "Nữ Hư Không" là sai (Pāli không có ākāsa), lặp ở khoảng 51 tệp vv; không sửa riêng một tệp để khỏi lệch cả bộ, cần sửa đồng loạt. 0.4 và 9.1 "Nữ Dâu" giữ theo họ tệp (vv14, vv17:10.3) dù tiếng Việt gượng. Điểm hạ: semantic_fidelity 9.2 xuống 8.6, grammar_logic 9.2 xuống 8.8, terminology 9.0 xuống 8.4, vietnamese_clarity 9.3 xuống 8.9, han_viet_balance 9.4 xuống 9.2, ambiguity_integrity 9.1 xuống 8.6; final_score 9.18 xuống 8.91, tức chưa vượt 9.0.
  Kiểm tra sau sửa: 37/37 khoá khớp Pāli, đúng thứ tự; nháy kép khớp từng khoá, 0 lệch; 1 cặp Pāli trùng nội bộ (2.4 và 7.4), Việt giống nhau; không có Pāli lọt sang Việt, NFC sạch. Cổng kỹ thuật: npm run validate, npm test, npm run check, npm run build chưa chạy trong lượt này, technical_integrity giữ 9.6.
  Lượt cải thiện 2026-10-13: đọc đối kháng lại cả 37 khoá, đo tiền lệ trên toàn tầng vv, đổi 3 khoá. (1) 6.6: bỏ "được" (modāmi là động từ chủ động; 21 khoá modāmi trong tầng KN dịch "hoan hỷ" trần, chỉ vv13 và vv14 thêm "được") và "khu vườn" thành "vườn" (16 so với 5 trong tầng vv; vv71:4.4 cũng "vườn Nandana"): "nay tôi hoan hỷ trong vườn Nandana". Sửa nghĩa nhẹ và thuật ngữ; semantic_fidelity 8.6 lên 8.7. (2) 8.4: "khắp mọi phương" thành "khắp muôn phương" cho khớp 3.4 (Pāli sabbadisā pabhāsatī trùng nguyên văn trong cùng bài) và đa số tiền lệ (28 so với 11 cho "mọi phương"); thêm dấu đóng ngoặc kép theo dạng đa số. (3) 4.3: "Được hỏi câu ấy" thành "Được hỏi câu hỏi" (pañhaṁ là câu hỏi, "ấy" không có trong Pāli; 10 so với 3 trong tầng KN). Điểm terminology 8.4 lên 8.7: nhất quán nội bài ở 3.4 và 8.4, thuật ngữ vườn Nandana theo đa số, và tiêu đề 0.2 "Thiên Cung Của Nữ Giới" nay đã được sửa đồng loạt ở 49 tệp vv (nhận định "Nữ Hư Không" ở trên không còn đúng). Không đổi: 0.4 và 9.1 "Nữ Dâu" (chỉ vv13 và vv14 dùng, gượng nhưng nhất quán đôi này; sửa phải làm cả hai tệp); 2.4 và 7.4 "dễ chịu với tâm" (36 khoá trong tầng, piya mạnh hơn "dễ chịu"); 1.4 "rực rỡ" (không có trong Pāli nhưng 19 so với 3 tiền lệ); 8.2 (phước báu mà tôi đã tạo, đúng quan hệ yaṁ). 6.5 Bhāgaḍḍhabhāgaṁ dịch "nửa phần chia" nay trùng pv11:5.4 (nhận định "tệp đó dịch khác" ở trên không còn đúng). Bất định còn lại: chủ ngữ của mijjhati ở 2.2 và 7.2; quan hệ giữa chiếc bánh 6.3 và nửa phần chia 6.5. triangulation giữ 7.5 vì vẫn không có tầng tham khảo nào. Sau sửa: 37/37 khoá khớp Pāli, đúng thứ tự; nháy khớp Pāli từng khoá; 1 cặp Pāli trùng nội bộ (2.4 và 7.4) Việt giống nhau, và 3.4 với 8.4 nay dùng cùng cụm "khắp muôn phương". Cổng kỹ thuật npm run validate, npm test, npm run check, npm run build chưa chạy trong lượt này; technical_integrity giữ 9.6.
