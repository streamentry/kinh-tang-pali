notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này (đo và bằng chứng ở `blocking_errors`). Bài thuộc phẩm Paṁsukūlavagga (Phẩm Y Phấn Tảo), kể truyện tiền thân rùa chở Đức Phật Atthadassī qua sông Vinatā.
  `translationTitle` đặt BẰNG ĐÚNG khoá `:0.3`. Pāli `:0.3` là `Taraṇiyattheraapadāna`, không bắt đầu bằng chữ số nên không có số thứ tự. Hai bài khác cùng tên Pāli là tha-ap206 và tha-ap272 đều giữ nguyên `Taraṇiya` trong tên, nên bài này giữ y vậy.
  Dạng tên bài: đo ở nhiều phạm vi, kết quả phân kỳ. Trong cây làm việc, toàn tầng tha-ap: Bài Kệ Tuyên Ngợ 234, Bài Kệ Tuyên Ngôn 97, Ký Sự 96, Bài Kệ Tuyên Ngợi 10. Ở nhóm 4xx: Tuyên Ngợ 41, Ký Sự 16, Tuyên Ngôn 3. Ở nhóm 460–499: Tuyên Ngợ 19, Ký Sự 7, Tuyên Ngôn 1. Hai bài liền kề cùng phẩm (tha-ap483, tha-ap488) đều Tuyên Ngợ. Trong cây chính, toàn tầng: Tuyên Ngợ 156, Tuyên Ngôn 73, Ký Sự 73. Tôi theo đa số phạm vi gần nhất (Tuyên Ngợ) để cả phẩm đồng nhất, dù Tuyên Ngợ có vẻ là chính tả sai của Tuyên Ngôn; việc chọn một dạng cho cả cuốn là việc của người biên tập, để sửa hàng loạt một lượt. Khoá cuối `:18.1` lặp đúng `:0.3` kèm `, thứ tám` (aṭṭhamaṁ).
  Tiền lệ đếm được: 33 khoá Pāli của bài trùng nguyên văn với khoá đã dịch ở tầng tha-ap; dùng lại nguyên văn bản Việt ở 25/33. Tám khoá cố ý khác tiền lệ: (1) `:0.3` đổi dạng tên bài theo phạm vi gần nhất (tiền lệ duy nhất là tha-ap206 Tuyên Ngôn); (2) `:1.1` tiền lệ (tha-ap206, 2 khoá) dịch tên thành bậc Thấy Biết Chân Lý, còn tôi giữ tên Atthadassī, vì đo cả tầng thì giữ nguyên tên 10 lần, dịch nghĩa 7 lần (Đã Thấy Pháp 5, Thấy Biết Chân Lý 2); (3) `:3.2` (tiền lệ duy nhất đang bị lệch tên, ghi Sobhita); (4) `:4.2` và `:6.2` (tiền lệ một khoá dịch nghĩa tên) đều thành Đức Atthadassī danh tiếng lớn, hai khoá giống nhau; (5) `:8.3`, xem dưới; (6) `:9.1` bỏ Ta vì chủ thể là ngôi ba; (7) `:12.1` tiền lệ hai khoá, mỗi khoá một cách; (8) `:10.4` xem dưới.
  Pāli trùng trong chính bài: 5 nhóm (`:4.2`=`:6.2`, `:8.3`=`:13.1`, `:10.3`=`:11.3`, `:12.4`=`:14.3`, và ba khoá `…pe…`); 4 nhóm Việt giống nhau, 1 nhóm Việt khác có chủ ý: `:8.3` Trong một ngàn tám trăm kiếp là lời tiên đoán tương lai (ramissati), còn `:13.1` Vào một ngàn tám trăm kiếp trước là lời tự thuật quá khứ (cùng dạng đã dùng 8 lần ở tầng).
  Số Pāli: `Aṭṭhārase kappasate` = 18 trăm kiếp = 1.800 kiếp, viết một ngàn tám trăm. Tầng đã dùng đúng dạng một ngàn tám trăm kiếp cho cụm này 13 lần (8 Vào…trước, 3 Từ…trước, 2 Vào…đại kiếp trước), không có cách khác. Cách hiểu `kappasate` là số nhiều trăm kiếp theo tiền lệ nội bộ, không có tầng Anh độc lập để đối chiếu.
  Ngôi: người kể là Trưởng lão (nguyên là rùa) dùng ta, khớp tha-ap493 và đa số công thức Kilesā (ta 80, tôi 22 + 9). Lời con rùa thưa với Đức Phật ở `:3.1–3.4` dùng con và Ngài (hai bên là người thưa và bậc được thưa). Lời Đức Phật ở `:7.1–10.4` dùng ta cho chính Ngài. Công thức kết `:17.1` dùng Tôi nghe như vầy… những bài kệ này (nhóm 407 khoá trong tầng), không dùng nhóm số ít.
  Thuật ngữ đã đo: Tự Tại cho sayambhū (39 so với Tự Chứng 7, Tự Hữu 6); Dẫn Đạo Thế Gian cho lokanāyaka (Dẫn Đạo 25, Lãnh Đạo 14, Đạo sư 8, Dẫn Dắt 8, Dẫn Lộ 6); Đại Mâu-ni cho mahāmuni (đa số so với Đại Muni, Đại Ẩn Sĩ); sông Hằng cho gaṅgā (87 so với Gaṅgā 66); tâm từ cho mettācitta (114 so với từ ái 9, từ bi 5); dòng nghi hoặc cho kaṅkhāsota (nghi hoặc 49 so với nghi ngờ 25); Chánh Đẳng Giác cho sammāsambuddha (14/14). Công thức `:13.3` Ta không biết mình rơi vào khổ đau (134 khoá), `:14.1` (80), `:15.1` (74) dùng nguyên văn tiền lệ.
  Khoá `:10.4` (phalaṁ toseti kassakaṁ) khác tiền lệ cũng ở tầng (hai khoá dịch cũng thu được quả bội thu): Pāli là phalaṁ (chủ, nominative) toseti kassakaṁ (tân, accusative), nghĩa là quả làm vui lòng người nông dân, đối xứng đúng với `:11.4` phalaṁ maṁ tosayissati (quả báo sẽ làm ta hoan hỷ). Tiền lệ đảo chủ-tân và thêm bội thu không có trong Pāli. Đây là accuracy fix; cần người biên tập rà các khoá tiền lệ cùng Pāli.
  Bất định, ghi ở đây chứ không giải thích trong thân kinh: (1) `:7.1–7.2` yāvatā vattate cittaṁ, gaṅgāsotaṁ tarāmahaṁ: cittaṁ không có chủ sở hữu trong Pāli; có thể là tâm Đức Phật (đủ sức vượt sông bằng ý muốn) hoặc tâm con rùa (đi bao xa tùy ý nó). Tôi dịch sát chữ, không chọn. Thêm nữa tarāmahaṁ là thì hiện tại còn tāresi ở `:7.4` là quá khứ, nên không giả định hai vế cùng thì. (2) `:10.3` và `:11.3` sammādhāre pavecchante: dhārā là trận mưa, sammā là đúng đắn, pavecchante là phân từ hiện tại của việc đổ xuống; tôi dịch khi mưa đổ xuống đúng mức. Hai khoá tiền lệ cùng công thức ở tha-ap504 và tha-ap58 dịch là người làm ruộng đúng thời vụ và được chăm sóc đúng đắn, hai cách không giống nhau và không cách nào dịch dhārā là mưa, nên tôi không dùng lại; đối chiếu với Pītidhāre pavassante (khi mưa hỷ lạc tuôn xuống) cùng tha-ap504 thì dhārā là mưa. (3) `:11.2` sammāsambuddhadesitaṁ: desita dịch chỉ dạy, không chọn nghĩa chỉ bày hay thuyết giảng. (4) `:12.1` padhānapahitattomhi: ghép padhāna (tinh tấn) và pahitatta (người tự thân đã hướng chí); hai tiền lệ mỗi cái một nghĩa, tôi dịch dốc chí tinh tấn. (5) `:9.3` ekāsane nisīditvā dịch sát chữ (một chỗ ngồi hoặc một lần ngồi); không thêm chỉ. (6) `:1.3` Vinatā tách riêng trong Pāli bilara; hai tiền lệ coi là tên sông (Vinatā nadī), tôi theo. (7) `:2.2` kacchapo vārigocaro là đồng vị của ahaṁ ở `:2.3` chứ không phải chủ thể riêng, nên dịch song song hai khoá. (8) `:5.4` phuṭṭhe pādatale là cách tuyệt đối không nêu tác nhân; tôi thêm Ngài vì ngữ cảnh (`:4.3`) xác định. (9) `:8.4` ramissati không có chủ ngữ; tôi dùng người ấy theo tiền lệ; tôi chưa thấy tiền lệ nào bảo vệ cách gọi con rùa tương lai. (10) `:13.2` yaṁ kammamakariṁ tadā dịch thiện nghiệp ấy theo đa số công thức (49 khoá) dù Pāli chỉ nói kamma.
  Quy ước dấu: ngoặc kép “ mở ở `:1.1` và đóng ở `:16.3`; nháy đơn ‘ mở ở `:3.1`, đóng ở `:3.4`; mở lại ở `:7.1`, đóng ở `:10.4`. Khớp Pāli từng khoá (66/66). `…pe…` ở `:14.2`, `:15.2`, `:16.2` thành đúng một `…` (3/3); không khoá nào có `(…)` trần.
  Tự kiểm: tập khoá Việt bằng đúng tập khoá Pāli (66 = 66, đúng thứ tự); nháy đơn và nháy kép khớp Pāli ở 66/66 khoá; dấu lược khớp 66/66; mọi giá trị NFC, không rỗng, không khoảng trắng thừa; không Pāli lọt ngoài các tên riêng Therāpadāna, Atthadassī, Vinatā, Taraṇiya; đã in cặp Pāli với Việt từng khoá để đọc đối kháng.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được phép chạy lệnh npm, nên `technical_integrity: 9.6` chưa phải xác nhận đạt. Bốn lệnh để người điều phối chạy trước khi coi cổng kỹ thuật là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
