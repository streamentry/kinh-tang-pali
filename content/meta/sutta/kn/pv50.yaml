  cho cả lát, và `triangulation` bị chặn ở 7.5 (≤ 8.0) cho **mọi** bài.

  PĀLI TRÙNG NGUYÊN VĂN — tự dựng chỉ mục bằng script, không tin bảng tiền lệ. Tôi nạp **mọi** tệp Pāli
  gốc trong cache (5.764 tệp / 284.708 khoá) và **mọi** tệp Việt dự án (4.038 tệp / 113.977 khoá), ghép
  theo chuỗi Pāli đã chuẩn hoá khoảng trắng. Lát này có **280 khoá**, trong đó **139 khoá trùng Pāli
  nguyên văn** với bài khác; riêng cụm `…pe…` đã có **1.152 bản rải trên 607 bài**, và `catasso` có
  **599 bản rải trên 598 bài**. Trong 139 khoá ấy, **59 khoá có bản Việt đã có để dùng lại** (132 khoá
  còn lại — 80 khoá — không có bản Việt nào ở bài khác, nên không có gì để dùng lại). Tôi dùng lại
  **nguyên văn cả 59 khoá ấy**, không dịch lần hai:
  · `Milindapañha` (5), `Opammakathāpañha` → *Câu hỏi về cách dùng dẫn với ví dụ* (5);
  · `Sīhavagga` → *Phẩm Sư Tử* (1, mil7.6.3–6), `Makkaṭakavagga` → *Phẩm Kẻ Nhắc Nhở* (2),
    `Kumbhavagga` → *Phẩm Bình Vò* (2);
  · `Petavatthu`, `Mahāvagga` → *Đại Phẩm* (pv47, pv50);
  · `Therāpadāna` (7);
  · `…pe…` (7) → **một** `…`, theo §10.1 BRIEF_VI3: 27 khoá Pāli cùng dạng đã có trong tầng cũng dịch
    là `…`; 152 khoá Việt trong tầng còn để nguyên `…pe…` là dạng **sai** (hai dấu lược), tôi không
    sao chép;
  · `Paṭisambhidā catasso,` → *Bốn vô ngại giải,* (tha-ap243:3.1, tha-ap313:3.1; cả hai cùng Pāli) và
    `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”.* (cùng hai bài kia);
  · `Duggatiṁ nābhijānāmi,` → *Ta không biết mình rơi vào khổ đau,* (tha-ap243:2.3) — dùng lại ở cả
    7 bài `tha-ap`;
  · `Ekanavutito kappe,` → *Từ chín mươi chín kiếp trước,* (tha-ap243:2.1) — dùng lại ở tha-ap207,
    tha-ap234;
  · `patto me āsavakkhayo.` → *ta đã đạt sự chấm dứt của lậu.* (tha-ap313:2.4) — tha-ap218:2.4;
  · `Itthaṁ sudaṁ āyasmā X thero imā gāthāyo abhāsitthāti.` → *Tôi nghe như vầy: Tôn giả Trưởng lão X
    đã nói những bài kệ này.* — khuôn có tiền lệ ở **90** khoá `tha-ap` trong tầng.
  Ngoài ra `Suddhā suddhehi saṁvāsaṁ …` (mil7.7.7:4.1–4.4) là cùng bốn vế kệ với `snp2.6:10.1–10.4`
  đã có bản Việt; tôi dùng lại **nguyên văn cả bốn vế** (script chỉ báo trùng ở 4.2 và 4.3 vì 4.1/4.4
  khác dấu câu), vì tác phẩm phải nhất quán trong một câu kệ.

  DẤU LƯỢC — theo §10. Cả 14 bài: 7 khoá Pāli có `…pe…`, bản Việt đều để **đúng một** `…` (2 phía = 1,
  khớp). Không khoá nào tôi mở rộng, không khoá nào tôi nén bằng `…`, không có `(…)` đứng một mình.
  Nhắc lại vì đây là bẫy đã có tiền lệ: ở `tha-ap*` cụm `Paṭisambhidā catasso, …pe…, kataṁ buddhassa
  sāsanaṁ` lược mất hai vế `vimokkhāpi ca aṭṭhime` và `Chaḷabhiññā sacchikatā`; tôi **không** mở
  chúng ra, vì §10.1 là luật fidelity.

  ĐỢT NÀY CẤM CHẠY CỔNG — theo chỉ đạo của người điều phối, tôi **không** chạy
  `npm run validate|test|check|build`, nên `technical_integrity` chấm **9.6 chứ không phải 10.0**, và tôi
  **không** tuyên bố technical gate pass. Bốn lệnh đó để **coordinator** chạy. Tôi đã tự quét TOÀN BỘ
  20 khoá từ đĩa (không dùng ngưỡng 40 ký tự, vì ngưỡng đó không chạy ở bài kệ ngắn và làm danh sách
  kiểm rỗng): đủ khoá, đúng exact segment ID, thứ tự khoá y hệt Pāli, không orphan, không thừa, không
  rỗng, mọi khoá NFC, số dấu lược khớp từng khoá, nháy kép cân trên cả bài, không có Pāli lọt. Script ghi
  tệp hai lần: sha256 không đổi một byte (idempotent).

  CHI TIẾT BÀI NÀY — REVIEW ĐỐI KHÁNG BẮT ĐƯỢC 1 LỖI, ĐÃ SỬA. `2.3` `Tathā hi pakataṁ pāpaṁ`: bản nháp tôi dịch
  *tội lỗi đã **phá vỡ*** — `pakata` nghĩa là *đã làm / đã phạm*, không phải *phá vỡ*; vế sau `tuyhaṁ
  mayhañca` mới là chủ ngữ của `pakataṁ pāpaṁ`. Đã sửa thành *Vì thế, tội lỗi đã làm*.

  BÀI NÀY LÀ PHIÊN BẢN CỦA JĀTAKA 314 — tôi tra `ja314` (Lohakumbhijātaka, phẩm Pucimandavagga) để
  đối chiếu, và nó xác nhận hai chỗ dễ sai:
  · `3.3` trong Jātaka là `Vijjamānesu bhogesu`, còn ở đây Petavatthu dùng `Santesu deyyadhammesu`.
    Tôi theo **Pāli của pv50** (*Dù có những điều đáng phát tặng*), không theo Jātaka.
  · `2.3` Jātaka ghi `Tadā hi`, pv50 ghi `Tathā hi`; `4.4` Jātaka là `kāhāmi` trong `ja314:4.4`,
    pv50 cũng `kāhāmi`. Tôi theo Pāli của pv50 cho cả hai.

  BẤT ĐỊNH (làm `ambiguity_integrity` ở 8.7):
  · `1.1` `Saṭṭhivassasahassāni` = `sahassāni` (nghìn) × `saṭṭhivassa` (sáu mươi năm) ⇒ 60.000
    năm. Tôi dịch *Hàng nghìn kỳ sáu mươi năm* để giữ nguyên cấu trúc nhân và không bị đọc thành *nghìn
    lẻ sáu mươi*; số 60.000 chỉ là hệ quả phép nhân, tôi không viết thẳng vào thân kinh. Cùng cụm này có
    ở `bv7:26.1`, `bv23:27.1`, `pe2:112.1`, `pe2:198.1`, `ne37:457.1` — không bài nào trong tầng đã
    dịch, nên không có tiền lệ để dùng lại.
  · `4.3` `Vadaññū sīlasampanno`. `vadaññū` có thể là *tự quở trách* (theo cốt truyện yêu quái hối
    hận và nguyện làm điều thiện khi sinh làm người) hoặc *khen tán*. Tôi chọn *tự mình quở trách*. Vế
    `sīlasampanno` → *giới hạnh tròn đầy* thì không có bất định.
  · `2.4` `mārisā`: tôi dịch *bạn hiền* theo tiền lệ `an4.191:4.9` (`mārisā` → *này bạn hiền*; đếm
    được **11** lần). Nhưng `dn14` dùng *các thiện hữu* (**12** lần) và `an3.37` dùng *chư Thiên* khi
    đang gọi chư thiên. Ở đây yêu quái gọi tôn giả, nên *bạn hiền* hợp; tôi ghi để người điều phối gộp
    nếu muốn thống nhất.

  XƯNG TỪ — Pāli đổi ngôi giữa `3.1–3.4` (`-mha` = chúng ta) và `4.1–4.4` (`ahaṁ` = ta); tôi giữ
  đúng: `3.x` dùng *chúng ta*, `4.x` dùng *ta*. Ở `3.2` `ye sante` không có chủ ngữ nên tôi dịch *dù có*,
  không bịa chủ ngữ.

  `0.3`/`5.1`: `Seṭṭhiputtapetavatthu` = *Con Nhà Thợ Mộc* (`seṭṭhi` = thợ mộc, tiền lệ *thợ mộc* ở
  dhp145:3, mn86:18.29; `putta` = con). Giữ khuôn *Chuyện ngạ quỷ X*.

  Lượt cải thiện 2026-10-11 (kiểm toán độc lập, đọc đối kháng từng khoá Pāli↔Việt; thay thế các mục cũ nêu bên dưới). Bản trước có lỗi nghĩa thật, nên điểm cũ cao hơn thực chất bản cũ; các điểm dưới đây chấm cho bản đã sửa. Đổi 18/20 khoá (chỉ 0.1, 0.2 giữ nguyên), trong đó 8 khoá sai nghĩa thật, 6 khoá sai thì/ngôi/liên từ, 4 khoá đưa về tiền lệ:
  · 0.3, 5.1 — `seṭṭhi` KHÔNG phải thợ mộc (`vaḍḍhakī`) mà là trưởng giả/triệu phú: tiền lệ `seṭṭhi` trong tầng 42 khoá "triệu phú", 26 khoá "trưởng giả", chỉ 3 khoá "thợ mộc" (pv50 và pv51 là hai trong số đó, đều sai). Tiêu đề thành "Con Trai Trưởng Giả" (cùng nhóm tiêu đề pv19 "Trưởng Giả Dhanapāla"; "con trai trưởng giả" không buộc số ít hay số nhiều); `translationTitle` đổi khớp. Mục cũ "seṭṭhi = thợ mộc" bị thay thế.
  · 1.1 — `saṭṭhivassasahassāni` = sáu mươi ngàn năm (`dn14:1.7.3` "60.000 năm", `an7.74:9.1`, `bv7:26.1`, `bv23:27.1`, `pe2:198.1`). "Hàng nghìn kỳ sáu mươi năm" là đọc sai nghĩa số lượng; mục BẤT ĐỊNH `1.1` cũ bị thay thế, không còn bất định.
  · 1.3 — `niraye paccamānānaṁ` = đang bị nung nấu trong địa ngục (`paccamāna` = đang bị nấu, `mn50:22.6`, `mn129:15.3`, `ja314:2.3`); bản cũ "đang đi tới địa ngục" sai hẳn động từ.
  · 2.1, 2.2 — bỏ "Địa ngục … chỗ nào" thêm vào; `anto` là sự chấm dứt, không phải "chỗ cuối"; `paṭidissati` = thấy hiện ra.
  · 2.3, 2.4 — `tathā hi` là liên từ giải thích ("vì … như vậy"), không phải "vì thế" (đảo quan hệ nhân quả); đổi "ngươi" thành "bạn" vì người nói gọi `mārisā` (này bạn hiền) và xưng "tôi" theo lệ ngạ quỷ/nữ thiên trong họ pv (`pv39:15.2`, `pv39:18.1`).
  · 3.1, 3.2 — `ajīvamha`, `dadamhase` là quá khứ ("đã sống", "đã không cho"), bản cũ để hiện tại; `dujjīvita` = cuộc sống tồi tệ (bản cũ "khó sống" lệch nghĩa).
  · 3.3, 3.4 — Pāli y hệt `pv26:9.3–4`, `pv19:12.3–4`, `pv15:18.3–4`, `pv31:4.3–4`: dùng lại "khi sẵn có những vật đáng bố thí" và "đã không tạo cho mình hòn đảo" (`dīpa` = hòn đảo nương tựa; 5 khoá pv "hòn đảo", chỉ `pv45:10.4` và bản cũ này đọc "đèn"). Mục cũ "thắp được ngọn đèn" sai. Ghi nhận ngoài lát: `pv45:10.4` (đèn, "bậc lành") và `ja314:1.4` ("ngọn đèn nương tựa") cùng Pāli nhưng khác dạng; `pv51:14.2` "con nhà thợ mộc" cũng sai seṭṭhi; `ja314:4.1` "Nếu ta … thoát ra" lệch (`gantvā` là "đi khỏi", không điều kiện).
  · 4.1–4.4 — `vadaññū` = hào phóng (53 khoá khác trong tầng, 27 khoá dịch "hào phóng", còn lại phần lớn "rộng rãi/rộng lượng"; `pv39:18.3`, `vv52:20.3` "là người hào phóng"), KHÔNG phải "tự quở trách". Mục BẤT ĐỊNH `4.3` cũ bị thay thế, vì nghĩa "tự quở trách" không có cơ sở và các bài song song đều là "hào phóng". `laddhāna mānusiṁ` dùng đúng tiền lệ "được tái sinh làm thân người" (4/6 khoá); `Sohaṁ nūna ito gantvā` theo `pv39:18.1` ("Tôi đây, chắc chắn, sau khi từ đây ra đi"); `ta` đổi thành "tôi"; `kāhāmi kusalaṁ bahuṁ` dùng đúng "tôi sẽ làm nhiều điều thiện" (`pv39:15.2`).
  · 1.2, 1.4 — chỉ chỉnh gần tiền lệ: `sabbaso` = "về mọi mặt" (cùng nhóm `ja529:41.2`, `tha-ap410:24.2`), `kadā anto bhavissati` giữ chủ ngữ "sự chấm dứt".
  Điểm đổi (cho bản đã sửa): semantic_fidelity 9.1→9.2, grammar_logic 9.1→9.2, terminology 9.0→9.2 (seṭṭhi, dīpa, vadaññū, paccamāna, số lượng đã đưa về tiền lệ đa số/đã đối chiếu); ambiguity_integrity 8.7→8.8 (hai bất định cũ đã giải quyết, còn bất định về người nói và `tathā hi`); triangulation giữ 7.5 (không có bản Anh độc lập); các tiêu chí còn lại giữ nguyên. final_score 9.07→9.12.
  Bất định còn lại: (a) ai nói từng đoạn (`1.1–2.4` là hỏi–đáp giữa hai ngạ quỷ hay một người kể lại; Pāli chỉ có một cặp nháy mở ở 1.1, đóng ở 4.4) — giữ đúng nháy, không thêm người nói; (b) `seṭṭhiputta` số ít hay số nhiều; (c) `ye sante` không có tân ngữ nên dịch "dù có", không bịa "của cải". Blocker "không có tầng tham khảo tiếng Anh" giữ nguyên (sự thật về upstream). technical_integrity giữ 9.6: bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
