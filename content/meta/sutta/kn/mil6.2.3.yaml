notes: |-
  TẦNG THAM KHẢO — 0 khoá trên 24 có Anh Sujato. Edition `translation/en/sujato` tại commit đã ghim
  (11c9d708978cde8ba61096d8a75f7ddfb846f639) không có thư mục `kn/mil/`; `source/upstream-manifest.json` liệt kê
  thư mục con của `sutta/kn/` trong edition đó là cp, dhp, iti, ja, kp, snp, thag, thig, ud — **không có mil**.
  Không có Việt hiện hành, không có lớp lấp `english-project`. ⇒ `draft`, `triangulation` 7.5.

  THUẬT NGỮ CHỌN THEO SỐ ĐẾM ĐƯỢC, KHÔNG ĐOÁN. Đây là bài thứ ba của `Nippapañcavagga`, ngay sau
  mil6.2.1 và mil6.2.2 đã có trên đĩa, nên tiền lệ rất sát. `Milindapañha` → “Milindapañha” (168/179 bài `mil`,
  đa số áp đảo; chỉ 8 dùng “Mi-lan-đà Vấn Đạo” và 3 “Mi-tiên Vấn Đáp”). `Anumānapañha` → “Câu hỏi về suy luận”
  (7/14, và cả ba anh em sát nhất mil6.2.4, mil6.2.6, mil6.2.7 đều vậy). `Nippapañcavagga` → “Phẩm Năm Điều Đã Vứt
  Bỏ” (7/9; mil6.2.2 dùng “Phẩm Không Trì Hoãn” — thiểu số 1).
  `bhante nāgasena` → “bạch ngài Nāgasena” theo chỉ đạo của điều phốn cho tầng `mil` (đếm trên toàn tầng `mil`:
  “bạch ngài” 30 lần, **“bạch thầy” 0 lần**; “bạch đại vương” 3 lần là của `mahārāja` chứ không phải của
  `bhante`). `mahārāja` → “này Đại vương” (504 lần toàn 5 tầng, 372 lần trong `kn`; đối chiếu “tâu Đại vương”
  119 lần và “thưa đại vương” 43 lần). `jina` → “Chiến Thắng” (tiền lệ 8 lần “bậc Chiến Thắng”, 5 “Đấng Chiến
  Thắng”). `sikkhāpada` → “giới hạnh tu học” và `yāvajīvaṁ anatikkamanīyaṁ` → “suốt đời không được vượt quá”
  (dùng lại đúng câu của mil hiện có trong tầng). `sabbaññū` → “toàn tri”, `chaḷabhiñño` → “có sáu thắng tri”,
  `vimutti` → “giải thoát”, `anavasesa` → “không còn sót lại”.

  Hai khoá dùng lại nguyên văn tiền lệ vì Pāli trùng: `“Na hi, mahārājā”ti.` → ““Không có, này Đại vương”ti.”
  (đúng y như mil3.5.1 và mil3.5.7). Còn `“Āma, mahārājā”ti.` thì tiền lệ duy nhất là mil6.1.6 (“Vâng, tâu Đại
  vương.”) — mình chỉ đổi “tâu” thành “này” cho khớp quy ước `mahārāja` đã chốt ở trên, và ghi lại ở đây.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `satisammosa` — chỉ có MỘT tiền lệ trong cả tầng (`So tamhā āsanā vuṭṭhahanto satisammosā pakireyya` →
  “khi người ấy rời khỏi chỗ ngồi mà mất niệm thì tất cả sẽ rơi rải”), theo đó dịch “sơ suất / mất niệm”.
  Vì vậy `Khīṇāsavasatisammosapañha` dịch “Câu Hỏi Về Sự Sơ Suất Của Bậc Lậu Tận”, **khác** mil6.2.2
  (`Khīṇāsavabhāvapañha` → “Câu Hỏi Về Bậc Lậu Tận”); hai tên khác nhau một chữ, tiêu đề cũng vậy.
  `sakavisayaṁ` (5.5) — thuật ngữ chuyên môn, không có tiền lệ trong tầng. Đọc theo gốc (sara = quả báo) thì
  “những điều thuộc về quả báo”; không dịch thành “các pháp” vì `dhamma` không có trong câu.
  `anādariya` (2.2, 2.3, 3.1) — “không tôn kính”, giữ đúng cặp với `ajānanena` → “không biết”, và giữ cả
  `anādariyena vā ajānanena vā` là hai nguyên nhân **hoặc–hoặc** chứ không phải cả hai.
  `ajānanena` (2.2) — “không biết” (vô minh), không dịch “không cố ý”: câu hỏi của vua là “vì không biết mà
  phạm tội hay vì không tôn kính mà phạm tội”, và `anādariya` đã gánh vế thứ nhất rồi.
  `maggopi tassa mahiyā anaññāto` (5.3) — `magga` ở đây là con đường giải thoát, không phải “đường sư”; dịch
  “con đường của vị ấy”.
  `bhūtagāmavikopanaṁ` (4.9) — “suy phá tài vật của muôn loài vật và loài người”; `bhūta` và `gāma` là hai nhóm
  sinh vật, không dịch “phá hủy vật chất” như một khối.
  `udake hassadhammaṁ` (4.10) — “vui vẻ cười đùa dưới nước”; không thêm “tắm” vì `udake` chỉ nói nơi chốn.
  `-kuṭikāre, sañcaritte, vikāle kālasaññāya, pavārite appavāritasaññāya, anatiritte atirittasaññāyā` (1.6) —
  bốn tình huống lệch pha giữa hành động và nhận thức; dịch theo đúng bốn vế, không gộp “đã hành xử / đã vượt
  giới hạn” thành một câu.
  `anaññātaṁ` (5.3) — “chưa từng biết”, giữ thì quá khứ vì tương lai `jāneyya` ở 5.4–5.6 mới là “biết”.

  DẤU LƯỢC — bài này **không có** `…pe…`, nên không dấu lược nào được phát sinh.

  Ngoặc kép đối chiếu từng khoá với Pāli: 1.1–1.6 và 3.1–3.2, 4.1, 5.7 là những nháy kép tự cân; 2.1 mở và
  2.3 đóng nháy kép bao quanh trích dẫn ‘…’ ở 2.2; 4.2 mở và 5.6 đóng, bao trọn đoạn hỏi–đáp không có nháy kép
  ở giữa. Tự đếm lại sau khi sửa: cân.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
