notes: |-
  **Tiền lệ, tự đo lại:** `Therāpadāna` giữ nguyên Pāli **316/325**; `Mahāparivāravagga`
  → *Phẩm Mahāparivāra* **2/2** (tha-ap117, tha-ap119, cùng phẩm); `:0.3` theo đa số
  *X. Bài Kệ Tuyên Ngợ Về Trưởng Lão N* **123/325**; `:11.1` theo *Bài Kệ Tuyên Ngợ Về
  Trưởng Lão N, thứ chín* (đa số trong 35 khoá `:11.1` đã dịch). Mười bốn khoá trùng nguyên
  văn (2 tiêu đề + 12 thân bài), tôi dùng lại nguyên văn: `Paṭisambhidā catasso` → *Bốn vô ngại giải,*
  (6 bài), `…pe…` → `…`, `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”.*
  (6 bài), `Mama saṅkappamaññāya` → *Nhờ thấu rõ ý định của ta,* (tha-ap451, tha-ap78,
  tha-ap498 ×2), `Mamuddharitukāmo so` → *Muốn cứu độ cho tôi* (tha-ap68, tha-ap271),
  `āgacchi mama santikaṁ.` → *Ngài đã ngự đến nơi tôi ở.*, `Pañcavasse paricariṁ,` →
  *Ta đã hầu hạ Ngài suốt năm năm,*, `Tena kammena dvipadinda` → *Nhờ vào nghiệp ấy,
  bạch Đấng Lưỡng Túc Tôn,*, `lokajeṭṭha narāsabha;` → *bậc Trưởng Thượng thế gian, đấng
  Nhân Ngưu;*, `Sampattiṁ anubhotvāna,` → *Sau khi thọ hưởng mọi quả báu tốt đẹp,*,
  `Sattaratanasampannā,` → *đầy đủ bảy món báu quý giá,*, `cakkavattī mahabbalā.` →
  *là những Chuyển Luân Vương có đại oai lực.*

  **Hai tên riêng phải khai vào bộ nhớ tiến trình của `_hvi.py`.** Chốt `lọt_pāli` chặn
  mọi từ mang dấu Pāli chưa từng xuất hiện trong tầng Việt. `Paccupaṭṭhānasaññaka`
  (0 chỗ) và `Sāgaro` (0 chỗ) đều là **tên riêng lấy từ Pāli của chính bài**:
  `tha-ap121:0.3` / `:11.1` / `:12.1` và `:3.2` (`sāgaro nāma sāvako`). Tôi đã thêm đúng
  hai tên này vào `_GIỮ` trong bộ nhớ tiến trình (`_tvd_62.py`), **không sửa `_hvi.py`**,
  và đây là cơ chế mà chính docstring của `_hvi.py` chỉ định.

  **Câu mở đầu `:1.1`–`:2.4` thì tối nghĩa nhất trong lát và tôi không dám làm cho nó
  sáng.** `nibbute samanantarā` tôi dịch *chấm dứt, không một ngoại lệ nào*; `duppabhātaṁ
  duruṭṭhitaṁ` → *khó khai sinh, khó giữ cho bền*; `Yaṁ me bhoge vijjamāne` →
  *Trong lúc ta còn phóng dật hưởng thụ*; `parinibbāyi cakkhumā` → *bậc mắt tuệ đã đưa ta
  đi vào Niết-bàn*. Riêng `parinibbāyi` có thể là chủ ngữ (bậc mắt tuệ *đưa ta đi*) hoặc
  tân ngữ, tôi chọn cách chủ ngữ. `Dhātuṁ sāsapamattampi` (`:5.3`) → *dù chỉ còn là phế
  tích trong cõi nguyên tố bé bằng hạt sương* cũng là cách đọc của tôi.

  **Không có tầng Anh.** 0/44; tầng `english-sujato` đã ghim **không có thư mục `tha-ap`**
