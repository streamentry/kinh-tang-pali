  · `4.1` ← `thag3.2:3.1` / `thag8.3:5.3` *"Tôi cứ sống như thế này,"* (**2** tiền lệ)
  · `4.2` ← `thag3.2:3.2` / `thag8.3:5.4` *"hãy nhìn sự tinh tấn nỗ lực ấy!"* (**2** tiền lệ)
  · `4.3` ← `thag3.2:3.3` *"Tôi đã chứng ngộ tam-minh,"*
  · `4.4` ← `thag3.2:3.4` / `thag7.1:7.4` *"đã làm tròn lời dạy của Đức Phật”ti."*
