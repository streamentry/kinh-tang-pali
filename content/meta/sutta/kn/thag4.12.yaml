  **BẤT ĐỊNH ĐÃ PHÂN XỬ — VÀ MỘT ĐIỂM LỆCH ĐO ĐƯỢC:**
  · `1.4` `daḷhavīriyo parakkamiṁ.` → *"cố sức với tinh tấn bền chắc."* Sujato dịch
    *"strong in effort"* (mạnh), và tôi kiểm lại bằng tiền lệ **cùng nghĩa** chứ không đoán:
    `thāmavā daḷhaparakkamo` đã dịch *"nỗ lực dẻo dai"* và *"nỗ lực kiên cường"*
    (`an5.135:3.7`, `an5.136:3.6`) ⇒ `daḷha` = **mạnh/bền**, không phải *yếu*. Đọc ngược
    lại ("yếu tinh tấn") sẽ trái cả câu kệ. Không thêm chú thích vào thân kinh.
  · `3.2` `vihārā ca na nikkhame;` — bản song song `thag3.2:2.2` ghi `vihārato na
    nikkhame;` ( Abl. `vihārato`), bản này ghi `vihārā` (`ca` đứng sau). Tôi dịch theo
    nghĩa và **dùng lại nguyên văn** của tiền lệ (*"cũng không bước ra khỏi tịnh xá;"*),
    không sửa Pāli. Đây là biến thể chính tả **của tầng Pāli**, ghi lại để người biên
    tập xem.
  · `4.1`–`4.3` `Tassa mevaṁ viharato … / Tisso vijjā anuppattā` — Pāli dùng **dạng
    nam** (`tasso`, `tisso`) cho người kể là **nữ** (Mudita). Tôi dịc theo ngôi thứ nhất
    ("Tôi cứ sống như thế này…"), khớp Sujato và khớp **hai** tiền lệ đã `published`
    (`thag3.2:3.1`, `thag8.3:5.3` — cùng Pāli, cũng dịch "Tôi"), và giữ cho mạch kệ
    `3.1`–`4.4` liền như lời kể của chính người nói. Tiếng Việt không phân giống nên
    không vướng; người biên tập xem nếu muốn chọn ngôi thứ ba.
  · `6.5`–`6.6`: **số trong uddān của tầng Pāli không khớp bộ sưu tập đã ghim, tôi vẫn dịch
    đúng số Pāli và KHÔNG tự sửa.** Đếm trên `content/catalog/sutta/kn.json`:
    `Catukkanipāta` có **12** bài (`thag4.1`–`thag4.12`), mỗi bài **4** câu kệ ⇒ **48**
    bài kệ và **12** vị trưởng lão. Nhưng `6.5` ghi `Gāthāyo dve ca paññāsa` (20) và
    `6.6` ghi `therā sabbepi terasāti` (13). `terasāti` = **mười ba** là cách đọc đã xác
    nhận của chính tầng (`Lohiccatevijjā terasāti.` → *"mười ba"*, `dn13:83.4`;
    `Terasamaṁ.` → *"Thứ mười ba."*, `sn32.55:1.8`), nên tôi dịch **mười ba** chứ không
    dịch *mười hai*. Đối chiếu: uddāna của `Tikanipāta` và `Sattakanipāta` thì khớp
    (`Aṭṭhatālīsa gāthāyo` = 48 = 15×3 + 3 ✔; `soḷasa` = 16 ✔; `pañcatiṁsatī` = 35 = 5×7 ✔),
    còn uddāna của `Pañcakanipāta` (`thag5.12:6.5` `Saṭṭhi ca pañca` = 65) cũng lệch
    (thực tế 12×5 = 60). Nghĩa là **số ở uddāna của Theragāthā không đáng tin** — đây là
    đặc thù của tầng Pāli tại commit đã ghim, tôi ghi ra đây chứ không sửa.
  · `6.1`–`6.2` `Bhavati candano thero, / dasete buddhasāvakā;` → *"Sẽ có vị Trưởng lão
    Candana, / mười vị đệ tử của Đức Phật;"*. Đọc lại thứ tự danh sách thì câu này **không
    lạc**: `5.1`–`5.4` liệt **tám** vị theo đúng thứ tự bài (Nāgasamāla `thag4.1` →
    Rāhula `thag4.8`), `6.1` đưa Candana (`thag4.9`, vị thứ chín), `6.3`–`6.4` đưa
    Dhammika (`thag4.10`), Sappaka (`thag4.11`), Mudita (`thag4.12`) ⇒ đủ **mười hai**
    vị, khớp `content/catalog/sutta/kn.json`. Nhưng `bhavati` (= *sẽ có*) là động từ rời,
    đọc thành một mệnh đề độc lập nghe lạ giữa danh sách tên; tôi **giữ** nó vì bỏ đi là
    bỏ một chữ của Pāli, và cũng vì Sujato để trống **toàn bộ** khối uddāna nên **không có
    bản Anh để đối chiếu** chỗ này. Người biên tập phán nếu thấy dịch khác; tôi không bịa
    thêm danh sách, không sửa Pāli, không chú thích vào thân kinh.

  **DẤU LƯỢC:** bài **không có** `…pe…`. Đúng một khoá có `…` trần là `4.5` với **hai**
  dấu lược; giữ đủ hai. `lược()` kiểm từng khoá và pass.

