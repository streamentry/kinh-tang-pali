notes: |-
  Tiền lệ đếm được: `litta` → trang sức (trang sức 49 tiền lệ) và giữ làm tên phẩm/tên bài; `tejasā` → ánh sáng (tối thượng 934 tiền lệ cho paramena); `bujjhati` → nhận ra; `gila` → lừa (con lừa 6 tiền lệ; lừa lợn 0 nên ghi đây); `pāpadhuttaka` → kẻ phạm tội (39 tiền lệ); `kaṭuka` → đắng khó (3 tiền lệ).
  BẤT ĐỊNH thật sự về cả bộ vế: Cowell 91 kể chuyện hoàn toàn khác (anh phụ thua bạc kẻ chơi tên Litta ăn mừa độc), còn bộ vế ở Pāli root nói về kẻ mặt lừa lợn. Không có tầng Anh cho bài này, nên tôi chỉ dịch chữ và ghi đây, không dùng truyện Cowell để định hướng nghĩa. 1.1–1.2 giữ sự đối lập của Pāli (đã trang sức rực rỡ mà không ai nhận ra kẻ mặt lừa lợn) và `Littaṁ` + `Gilamakkhaṁ` đều là tân ngữ, nên tôi hiểu `littaṁ` là tính từ trang sức chứ không phải tên riêng.
  1.3 `Gila re gila` là lời chửi thẳng, nhưng cả vế đã nằm trong nháy kép mở ở 1.1 nên tôi không thêm nháy kép lồng nhau — thêm vào sẽ làm ngoặc kép không cân trên cả bài.
  0.3 `Littavagga` 0 tiền lệ: phẩm lấy tên từ bài đầu phẩm này, `litta` là trang sức / đẹp, nên giữ Phẩm Litta cho khớp với tiêu đề.
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. 0.1 Jātaka giữ nguyên (58 bài đã có) và 0.2 Ekakanipāta → Bộ Một Bài Kinh (57 bài) theo tiền lệ đếm được. 1.1 mở nháy kép, 1.4 đóng nháy kép + dấu chấm, không giữ `ti.` (tiền lệ 51/57 bài; 10 bài mới hơn cũng bỏ). Dòng kết 2.1 dùng dấu phẩy (Kinh X, thứ N) theo làn sóng gần nhất ja108…ja119; kho còn 48 bài không dấu phẩy — ghi ở đây để biên tập chuẩn hoá sau, tôi không sửa bài ngoài lát. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Chú giải Jātaka-aṭṭhakathā bằng Pāli không truy cập được trong môi trường dịch này, nên bối cảnh lấy từ truyện E. B. Cowell, The Jātaka vol. I (bản 1895, tải từ archive.org); đây là lý do triangulation không lên cao. technical_integrity 10.0 căn cứ chốt _hvi.py đã pass và tự chạy lại script kiểm bổ sung (9/9 khoá khớp Pāli, NFC, ngoặc kép cân trên cả bài, không lệch dấu lược); npm run validate|test|build không chạy theo lệnh cấm của lát.
