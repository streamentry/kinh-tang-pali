    · `mahāñāṇī` → có đại trí (`tha-ap533:16.1`, `thi-ap35:7.3`); `mahābuddhi mahāmati` → có tuệ giác lớn, có hiểu biết lớn (tầng không có `mahābuddhi`; `mahāmati` dịch `đại trí` ở `tha-ap544`, nên đổi để khỏi trùng với `mahāñāṇī`; xem bất định).
