  CÁC CHỖ BẤT ĐỊNH (ghi ở đây, không đưa vào thân kinh).
    · `1.2` `yatasaṅkappajjhāyi`: Pāli root viết `yata-` (kiềm chế), dịch `ý nghĩ đã được kiềm chế`. Sujato đọc như `yathā-` (`diligent as per their intentions and meditation`); bản này theo Pāli đã ghim.
    · `1.1` `yathācārī yathāsato`: dịch `sống thế nào niệm thế ấy` theo cấu trúc `yathā…yathā…`; Sujato `mindful as per their conduct and mindfulness`. Nghĩa gần nhau, câu Việt hơi nén.
    · `6.3` `ubhayantarena nāhosi`: dịch sát chữ `đã không ở giữa cả hai`. Sujato `there's nothing between the two`; có cách hiểu khác là không bị lạc cũng không bị khổ nắm giữ (trung gian không khổ không lạc). Không phân xử được từ Pāli đã ghim; giữ cách dịch ít giả định nhất.
    · `6.4`/`7.4` `kena lokasmi kiṁ siyā`: dịch `ở đời, do điều gì mà có thể là gì?`; Sujato `what keeps you in the world? What would you become?`. Cách đọc (câu hỏi hay câu phản vấn) chưa phân xử được.
    · `7.1` `mā me kadāci pāpiccho`: `pāpiccho` ở nominative số ít; dịch `Mong tôi chẳng bao giờ gần gũi kẻ ác dục` theo Sujato (`have nothing to do with those of bad wishes`). Một cách đọc khác là `mā me … hotu` với chủ thể là chính người nói (`mong tôi chẳng bao giờ là kẻ ác dục…`); hai cách đọc khác nhau về người bị nhắc tới, chưa phân xử được; chọn cách đọc có hai nguồn English độc lập đồng thuận.
    · `8.4` `api muddhani tiṭṭhatu`: thành ngữ tôn kính `hãy để vị ấy đứng cả trên đỉnh đầu` (Sujato `let them stand at the head`).
    · `9.2` `mago`: hiểu là con thú (miga), như `thag17.1:10.4` `magā`; dịch `con thú thích thú trong hý luận` trong thế đồng vị với `kẻ nào`, không thêm `như`.
    · `13.1`–`13.4`: cấu trúc `nidhīnaṁva … yaṁ passe vajjadassinaṁ` dịch theo từng pāda; hơi gồ ghề so với dhp76 nhưng đúng chỗ.
    · `15.4` `atthiko`: dịch `mong cầu lợi ích`; `attha` cũng có nghĩa `nghĩa lý` (Sujato `to get the meaning`).
    · `24.1`–`24.2` `ubhayena midaṁ maraṇameva, nāmaraṇaṁ pacchā vā pure vā`: dịch `Về cả hai phía, điều này chỉ là cái chết; không có sự không chết, dù về sau hay về trước`; Sujato `Both what came before and what follows after are nothing but death, not freedom from death`. Chủ ngữ `idaṁ` và nghĩa chính xác của `ubhayena` chưa phân xử được.
    · `27.3` `appāsi`: hình thái hiếm, không có tiền lệ trong tầng; dịch `đã ngắt bỏ` theo Sujato (`plucks off`) và hình ảnh lá cây ở `27.4`; không chắc thì (aorist) và nghĩa gốc.
    · `28.1` `anāyāso`: dịch `không phiền muộn` (Sujato `free of despair`); `āyāsa` còn có thể là `nhọc nhằn`.
    · `29.3` `sādhūpi hutvā na asādhu honti`: Pāli đã ghim viết `na asādhu`, đọc sát chữ sẽ thành `không trở nên không tốt`, trái với đối cú `29.4`, với `na vissase` ở `29.1` và với Sujato (`Some who were good later become bad`). Dịch theo đối cú: `có người dù đã là người tốt rồi lại trở nên không tốt`. Không bình luận trên thân kinh; nếu Pāli ghim sai chính tả (`nāsādhu`/`na sādhu`) thì cách đọc này vẫn đúng.
    · `31.1`–`31.4` `appamādavihārino`: Sujato đọc `immeasurables` (`appamāṇa-`); Pāli ghim là `appamāda-`, dịch `vị sống không phóng dật`.
    · `32.2` `sukhumadiṭṭhivipassakaṁ`: dịch `quán chiếu bằng cái thấy vi tế`; có thể hiểu là `quán chiếu các tà kiến vi tế`. Giữ cách chung nhất.
    · `34.3` `pathavāpaggisamāno`: tách thành đất, nước, lửa theo Sujato (`earth, water, fire`); chưa kiểm chứng riêng bằng ngữ pháp.
    · `35.2` `mahābuddhi mahāmati`: hai từ đồng nghĩa gần; để không lặp, `mahāñāṇī` (`34.2`) dịch `đại trí` theo tiền lệ, hai từ này dịch `tuệ giác lớn` và `hiểu biết lớn`. Có thể có cách đặt khác.
    · `0.2` `Tiṁsanipāta`: bài thứ hai trong bộ ba mươi, số kệ 37 (xem phép 5).

