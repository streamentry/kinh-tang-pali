  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá). Bài gồm các lời nói liên tiếp của nhiều giọng (Pāli): `1.1`–`17.6` là một lời tự thuật dài của Trưởng lão (kệ 1–5 về tỳ-kheo biết đủ, kệ 6–7 câu hỏi `kena lokasmi kiṁ siyā`, kệ 8–10 về bậc học rộng và hý luận, kệ 11–12 về nơi A-la-hán ở, kệ 13–14 về người chỉ lỗi, kệ 15–17 về nghe Pháp và giải thoát); `18.1`–`20.4` là kệ nói về vị Upatissa (tên riêng của Sāriputta); `21.1`–`23.4` kệ về cái chết và tâm không ô nhiễm; `24.1`–`25.6` lời cảnh tỉnh các vị khác; `26.1`–`28.4` về vị an tịnh; `29.1`–`37.4` là lời nói liền một mạch cho đến kệ viên tịch. Các dấu nháy kép mở/đóng của bản Việt đúng bằng Pāli ở từng khoá: mở ở `1.1`, `18.1`, `21.1`, `24.1`, `26.1`, `29.1`; đóng ở `17.6`, `20.4`, `23.4`, `25.6`, `28.4`, `37.4`. Sujato đóng nháy ở `5.4` và mở lại ở `6.1`, Pāli thì không, nên bản Việt theo Pāli (không nháy ở khu `2`–`16`). Dòng bìa `37.5` theo khuôn `… Trưởng lão X …` (Pāli không có chấm sau dấu lược nên bản Việt cũng không có).

