  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `saṅghāṭipāruto` → khoác y tăng-già-lê (`thig13.5:12.4`, cùng cụm; 16 khoá chứa `saṅghāṭi-` trong tầng: `y ngoài` 6, `tăng-già-lê` 5, `áo ngoài` 1).
    · `papañca` → hý luận (36 khoá chứa `papañc-` trong tầng, 7 khoá viết `hý luận`; không dạng nào khác trong nhóm từ so sánh).
    · `uparato` → đã lắng dứt (6 khoá trong tầng; `mil5.1.1:9.3` `đã ngừng`, `mil6.3.6:23.4` `ngừng lại`; chọn một dạng nói trạng thái dừng, không thêm đối tượng).
    · `upasanta` → an tịnh (41 khoá chứa `upasant-`: `an tịnh` 28, `tịch tĩnh` 8, `yên lặng` 4, `tịch tịnh` 3).
    · `pubbenivāsa` → các đời sống quá khứ (28 khoá chứa `pubbenivās-`: `đời sống quá khứ` 20, `túc mạng` 2, `đời trước` 1; đa số rõ ràng); `dibbacakkhu` → thiên nhãn (đa số); `cetopariya` → biết tâm người khác (`thi-ap39:11.3`); `cutūpapāta` → sự chết và tái sinh (`thag16.9:18.3`, `26.1`).
