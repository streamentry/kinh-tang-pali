notes: |-
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 1.1 (nghĩa từ, bỏ chữ nội dung: `virajamāsīnaṁ` = `virajaṁ` + `āsīnaṁ` «không bụi, đang ngồi»; lời giải cnd17:2.5, 6.2, DPD deconstructor, cùng dòng `dhp386:1`; «không còn cầu mong» theo Sujato «rid of hopes» không có căn cứ trong Pāli); sửa 2.3 (`ubhayaṁ` là cả dục tham lẫn ưu não: lời giải cnd17:20.3 `kāmacchandassa ca domanassassa ca ubhinnaṁ`, Sujato; như cnd17:18.3); sửa 4.2, 5.2 (nghĩa từ: `vicāraṇa` «dao động» → «sự rong ruổi»; lời giải cnd17:34.1–34.2 `cāraṇaṁ vicāraṇaṁ … carati vicarati`, DPD «means of locomotion», Pj II `vicaraṇakāraṇaṃ`, Sujato «travel about»; như sn1.64, sn1.65, cnd2:77.2, 78.2). Giữ 7.1–7.2 đảo dòng theo Sujato; giữ «thắng trí» cho `aññāvimokkha` (1.6, 3.3) dù cnd17 dùng «chánh trí» (kho đang chia đôi, việc cấp kho).
