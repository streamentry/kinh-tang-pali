notes: |-
  Đủ 9/9 khóa. puppha → hoa, ratti → đêm; tên bài Kinh Đêm Hoa là đặt mới.
  Sāmā giữ tên nàng; Kattika giữ tên lễ hội tháng Kattika (không dấu Pāli
  nên không vướng chốt lọt). Cấu trúc na idaṁ dukkhaṁ aduṁ dukkhaṁ với hai
  vế yaṁ song song: vế một là con quạ đang mổ vào ta (vāyasa → quạ), vế hai
  là nàng Sāmā sẽ không được hưởng lễ Kattika (anubhossati → được hưởng).
  puppharatta đọc theo mặt chữ là đêm hoa (cách cụ thể là đêm hội hoa nào
  thì chưa rõ, đã ghi nhận). Sujato trống cả 9 khóa → Pāli đơn tuyến, draft.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): sửa 1.1–1.3, đảo nghĩa: nayidaṁ dukkhaṁ
  aduṁ dukkhaṁ là "đây không phải khổ, kia mới là khổ", trong đó việc con quạ mổ ta (idaṁ) không phải
  khổ, còn việc Sāmā không được hưởng lễ Kattika (aduṁ) mới là khổ; bản cũ dịch chính việc quạ mổ là
  khổ. Puppharatta là ratta ("nhuộm") chứ không phải ratti ("đêm"), nên đổi "đêm hoa" thành "nhuộm
  hoa" (0.4, 1.3, 2.1 và translationTitle). Một phần ba số khoá nội dung phải sửa nên hạ
  semantic_fidelity và grammar_logic.
