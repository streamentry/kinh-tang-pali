notes: |-
  Đủ 9/9 khóa. puppha → hoa, ratti → đêm; tên bài Kinh Đêm Hoa là đặt mới.
  Sāmā giữ tên nàng; Kattika giữ tên lễ hội tháng Kattika (không dấu Pāli
  nên không vướng chốt lọt). Cấu trúc na idaṁ dukkhaṁ aduṁ dukkhaṁ với hai
  vế yaṁ song song: vế một là con quạ đang mổ vào ta (vāyasa → quạ), vế hai
  là nàng Sāmā sẽ không được hưởng lễ Kattika (anubhossati → được hưởng).
  puppharatta đọc theo mặt chữ là đêm hoa (cách cụ thể là đêm hội hoa nào
  thì chưa rõ, đã ghi nhận). Sujato trống cả 9 khóa → Pāli đơn tuyến, draft.
