  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho mil7.4.4.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 26 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá mil7.4.4:5.4 — *Điều này đã được Thế Tôn, bậc Thiên
  Trung Thiên thuyết giảng trong kinh Tập* → *Tâu đại vương, điều này cũng đã được Thế Tôn, bậc
  Thiên Trung Thiên, thuyết giảng trong kinh Tập*: thêm lại `mahārāja` (*tâu đại vương* như các khoá
  trước của bài) và `-pi` (*cũng*, như mil7.2.4:1.5). Dạng đa số ở mil7.7.7:3.4 và mil7.8.1:1.5
  (*đấng Thiên Nhân*) sai: `devātideva` là *Thiên Trung Thiên*, và bỏ mất `mahārāja` — chưa sửa,
  ngoài lát.
