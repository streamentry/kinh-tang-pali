  "mẫu số cổng coverage"); phần còn lại giữ làm lịch sử.

  **Lỗi nghĩa thật: 30/52 khoá** (đã sửa; 22 khoá còn lại giữ hoặc chỉ chỉnh văn).
  · Đọc sai từ vựng: `māse`/`māsakhettaṁ` là **đậu** (*māsa*, ruộng đậu), không phải *tháng*/*mùa mưa*
    (`6.4`, `8.1`); `dhenuyo` là **bò cái** (từ thông dụng, có ở `ja515:31.3`, `ja536:40.3`,
    `mil5.1.6:3.2`, `dn17:2.5.12`…), không phải hapax — bản cũ bỏ mất (`6.2`); `samāraka` là
    **có Ma-vương**, không phải *chẳng thiên* (`11.1`); `kālakato` là *mệnh chung/đã chết*, bản cũ
    viết *tịch diệt* (nghĩa Niết-bàn, sai hẳn) (`9.4`); `taṁ` ở `10.4`/`11.4`/`12.4` là **ngài**
    (đối cách người nghe), bản cũ viết *điều ấy*; `anantaka` là **mảnh vải/giẻ** (Vimānavatthu), không
    phải *vô tận* (`7.4`, `9.2`); `turito` là *vội vã* (`8.1`, `8.4`), bản cũ lại hiểu *lang thang, không
    cố định* và `turitassa me sato` thành *lúc tôi đã ra đi*; `aṭṭomhi` = *khốn khổ* (`9.1`); `Dvayajja`
    = *dvayaṁ ajja* (`7.1`).
  · Đảo vai: `Tayā hi bhante anukampito bhusaṁ` là *tôi được ngài thương xót nhiều* (tôi là người
    nhận), bản cũ viết *chính vì lòng thương xót tôi sâu sắc* như thể ngài được tôi thương (`10.3`,
    `11.3`, `12.3`). `Añño … natthi tayānukampako` = *ngoài ngài, không có bậc Mâu-ni nào khác thương
    xót* (`tayā` là nghĩa "ngoài ngài") (`11.2`, `12.2`). Thì hiện tại bản cũ viết tương lai: `anubhomi`
    *đang hưởng* (`10.2`); `abhivādayāmi` *đảnh lễ* (`10.4`…).
  · Thêm nghĩa không có: *vô cùng hoan hỷ* → *hoan hỷ* (`5.1`); *đầy* vòng trang sức, *giữa trời* (`1.3`,
    `1.4`); *rực rỡ* → *rực sáng* (`jalita`, `4.3`).
  · `5.3` `yassa kammassidaṁ phalaṁ` = mệnh đề quan hệ *về nghiệp mà đây là quả báo*, không còn dạng
    câu tự đứng *quả báo của nghiệp này là thế*.
  · `4.1` `mahānubhāvo` = *đại oai lực* (không phải *đại uy danh*; cùng gốc với `4.3`).
  · Tiêu đề: `Gopāla` ở `0.4`/`13.1` là danh từ chung *người chăn bò* (bản cũ coi là tên riêng; chính
    bài chỉ có nghĩa ấy: `rakkhissaṁ paresaṁ dhenuyo`; tầng tên đã ghim ghi *Cow Herder's Mansion*).
    `translationTitle` đã khớp. Tiêu đề `Purisavimāna` (`0.2`) hiện dịch *Nam Hư Không* — không có
    `ākāsa` trong Pāli, sai; lặp ở cả họ `vv` nên **không** sửa riêng một tệp, chỉ ghi nhận.

  **Blocker đã gỡ.**
  · (D) "Bất định `vv80:6.2`" (`dhenuyo` bị coi là hapax, nghĩ có thể là lỗi chép `dhanuyo`): **giải
    quyết được** — `dhenu` là *bò cái* thông dụng, xuất hiện ở ít nhất 12 khoá Pāli khác (xem trên),
    mệnh đề `paresaṁ dhenuyo` = *bò cái của người khác* và mạch chuyện (người chăn bò, đàn bò vào
    ruộng đậu) khớp hoàn toàn; không còn lý do nghi lỗi chép.
  · (B) "Cổng coverage không đo được gì": đây là ghi chú về ngưỡng đo chứ không phải lỗi văn bản.
    Đã đo lại: ngoài khối `:0` có 48 khoá Pāli, dài nhất **38 ký tự** — **không** khoá nào ≥ 40 ký tự,
    nên mẫu số = 0 (câu "bài này có 3 khoá ≥ 40" ở bản cũ là **sai**). Bản Anh Sujato vắng cả bài (blocker
    thiếu bản Anh upstream, còn giữ). Các khoá được đọc đối kháng từ Pāli, bản dịch tự đứng vững từ
    Pāli nên không còn là lỗi văn bản; `triangulation` hạ xuống 7,0 vì không có bản Anh độc lập và
    bản Việt hiện hành vắng.
  **Blocker giữ.** (A) Không có bản Anh upstream (Sujato không có bài này tại commit đã ghim): giữ
  nguyên, là sự thật về upstream (xử lý bằng waiver của người biên tập). Tầng Việt hiện hành chỉ có
  Pháp Cú — chỉ là giới hạn tham chiếu.

  **Bất định còn lại (đã ghi, không đoán thêm vào thân kinh).**
  · `6.2` `saṅgamma` (*tụ họp lại*): không rõ ai tụ họp với ai (người chăn khác? bầy bò?); chỉ nghĩa
    chính (đã trông giữ bò cái của người khác) chắc chắn.
  · `7.1` `Dvayajja kiccaṁ ubhayañca kāriyaṁ`: đọc là *hôm nay có hai việc cần làm* (trông bò, cúng
    dường), cả hai đều phải làm; theo mạch chuyện, nhưng `ajja` chưa có song song để đối chiếu.
  · `7.3` `saññaṁ paṭiladdha yoniso` = *tỉnh trí lại một cách như lý*.
  · `8.2` `Purā ayaṁ bhañjati yassidaṁ dhanaṁ`: đọc *kẻo nó* (bầy bò) *phá hại của cải của người có
    ruộng*; chủ ngữ của `ayaṁ` không nêu rõ.
  · `7.4`/`9.2`–`9.3`: `anantaka` = mảnh vải; mạch chuyện suy ra vải gói món `kummāsa` ném cho vị
    tỳ-kheo, vị ấy tự tháo ra lấy — là suy luận từ ngữ cảnh, Pāli không nói rõ vải gói gì.
  · `10.2` `Sukhañca kammaṁ anubhomi attanā` = *tự thân tôi đang thọ hưởng lạc của nghiệp*.
  · `3.4` `pamodayanti` giữ cách dịch chung của họ `vv` (*vui đùa thỏa thích*), hơi thừa so với *hoan
    hỷ*, đã gặp ở vv72/vv73/vv67; không sửa riêng một tệp.

  **Số đo sau sửa.** Tập khoá Việt = tập khoá Pāli = 52, thiếu 0, thừa 0. Nháy kép khớp Pāli (mở `1.1`,
  `6.1`; đóng `4.4`, `12.4`), nháy đơn 0. Dấu lược: Pāli `…pe…` đúng 1 khoá (`5.2`) ↔ Việt đúng một
  `…`. Không có số Pāli trong bài (số `Aṭṭhaṭṭhakā` = 8×8 = 64 giữ nguyên). Cổng kỹ thuật chưa chạy
  tại đây: `technical_integrity` giữ 9,6; cần chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 4 khoá bất đồng nghĩa → sửa 0, giữ 2 (6.2: bản nguyên bài đọc `saṅgamma` là 'gom lại' đàn bò, còn bản dự án giữ 'tụ họp lại' vì tầng đã dịch `saṅgamma samāgamma` là 'tụ họp' ở 52 khoá như dn25, dn29, mn45, sn55.24; 7.3: bản nguyên bài dịch `saññaṁ paṭiladdha yoniso` là 'đạt được ý nghĩ đúng đắn', bản dự án giữ 'tỉnh trí lại một cách như lý', hai cách đọc gần nhau và đều theo `saññā`), bất định 2 (11.2 và 12.2: `añño muni natthi tayānukampako`; bản nguyên bài đọc so sánh 'không có bậc hiền trí nào … hơn ngài', bản dự án đọc `tayā` là 'ngoài ngài'; Pāli không có dạng so sánh nên giữ cách đọc đã có, ghi rằng nghĩa chung là không ai khác thương xót như ngài). Đã so từng khoá 1.1–13.1: câu hỏi của vị tỳ-kheo, bốn nhóm tám nàng (aṭṭhaṭṭhakā = 8 × 8 = 64), người chăn bò, bò vào ruộng đậu, hai việc phải làm, rắn đen cắn, vị tỳ-kheo tự tháo mảnh vải lấy món cháo, lời đảnh lễ biết ơn đều cùng nghĩa với bản nguyên bài, và `māse` là đậu, `dhenuyo` là bò cái, `samāraka` là có Ma-vương cũng được xác nhận. Lượt review đối kháng của bản dự án không tìm thêm lỗi. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
