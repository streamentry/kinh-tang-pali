  **Bài này KHÔNG phải bản song song của `vv19`** — đo được bằng script, không phải phỏng đoán.
  `vv19` thuộc `Itthivimāna` + `Cittalatāvagga` (bài #2, nữ thiên Lakhumā), `vv80` thuộc
  `Purisavimāna` + `Sunikkhittavagga` (bài #6, nam thần Gopāla). Cặp Pāli trùng nguyên văn giữa
  hai bài chỉ có **4** (`0.1` `Vimānavatthu`, `3.4`≡`4.4`
  `Vaṇṇo ca te sabbadisā pabhāsatī”ti.`, `4.4`≡`5.3` `yassa kammassidaṁ phalaṁ.`,
  `11.2`≡`5.2` `…pe…`), trong đó bản Việt khác **1** — và khác **đúng phải khác**: `nàng`
  (Lakhumā, nữ) ⟷ `ngài` (Gopāla, nam). Ba cặp kia dùng nguyên văn. Ngược ra, `vv80` trùng
  nguyên văn **dày** với những bài đã có tiền lệ: `vv72`/`vv73` (7 khoá: `2.2`, `2.4`, `3.1`–`3.4`),
  `vv75`/`vv76`/`vv82` (`4.1`–`4.4`), `vv30`/`vv48` (`10.1`, `10.2`), `vv85` (`4.4`, `5.1`, `5.3`).

