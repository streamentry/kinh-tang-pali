  **BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ** (đã ghi, chưa im lặng). Khối 6.1–9.4 là câu chuyện
  riêng của bài này, **không** có bản Việt hay bản Anh nào để đối chiếu; các từ dưới đây đều
  đã đếm số lần trong Pāli root:
  · `6.2` `dhenuyo` — **hapax**, xem `blocking_errors`. Tôi bỏ, không bịa.
  · `6.2` `Saṅgamma rakkhissaṁ` — hai dạng quá khứ, dịch *Gom góp, giữ gìn,*. `saṅgamma`
    (gom góp) và `rakkhissaṁ` (giữ gìn) không có chủ ngữ trong Pāli; tôi giữ mảnh vắt.
  · `6.3` `mamantike` = *nơi tôi* — có 8 chỗ trong Pāli root, trong đó `cp10:11.4`
    `ghāsahetu mamantike` và `tha-ap3:58.4` `āgacchanti mamantike` xác nhận nghĩa *tại tôi*.
  · `6.4` `khādituṁ` = *bị ăn* (10 chỗ khác, đều *to be eaten*; `ja434:4.2` `Maṁsaṁ kuto khādituṁ
    cakkavāke`). Tôi dịch *để bị ăn thịt* vì chủ ngữ là `Gāvo` (bò) và mạch chuyện là bài học.
  · `7.1` `Dvayajja` — chỉ **2** chỗ toàn root: `vv80:7.1` và `pv36:29.1` `Dvayajja kammānaṁ
    vipākamāhu, / Sukhassa dukkhassa ca vedanīyaṁ;` — ở đó nghĩa là **đã thấy trước quả
    lành khổ** của nghiệp. Tôi dịch *Cân nhắc điều ấy, cả hai việc phải làm;*. Đây là cây mơ hồ
    nhất của bài: `kiccaṁ` và `kāriyaṁ` đều là *việc phải làm* nên cụm *cả hai việc phải làm*
    có thể không đúng ý. Người biên tập nên tra thảo luận.
  · `7.3` `saññā` — cùng từ với `vv19:8.3`; ở đây nghĩa chắc chắn là **ý thức / tri kiến**
    (*hiểu biết*), nên tôi dịch *hiểu biết* thay vì *ý thức* — cùng gốc, khác ngữ cảnh.
  · `8.1` `māsakhettaṁ` — **hapax** (1 chỗ). Tôi dịch *Mùa mưa ấy*; `turito` và `avāsariṁ` cùng
    dòng: `turito` có 4 chỗ, ba chỗ kia (`ja534:10.4`, `ja535:37.2`, `ja535:79.4`) nghĩa là
    *vội vã*, nhưng ở đây cặp với `avāsariṁ` (1 chỗ, *lang thang, không cố định*) nên tôi theo
    nghĩa *lang thang*. Đây là **lựa chọn diễn giải**, ghi lại để người biên tập cân.
  · `9.1` `aṭṭomhi` — **hapax** (1 chỗ), đi với `pīḷita` (bị nghiền) cùng dòng ⇒ *nghiền nát*.
  · `11.1` `Sadevake loke samārake ca` = *Trong cõi có chư thiên, có chẳng thiên* — `samāra`
    là chẳng thiên (asura), phân biệt với `chư thiên`.
  · `10.4`/`11.4`/`12.4` `Kataññutāya abhivādayāmi` — tôi dịch *đảnh lễ và bày tỏ lòng biết ơn*;
    `abhivādayāmi` = *đảnh lễ* (tiền lệ `mn97:27.5`, `ud2.8:6.3`, `mn143:2.5`), `kataññutāya` =
    *vì lòng biết ơn*. Ba khoa này trùng nguyên văn (2 khoá) nên bản Việt phải **giống hệt**,
    và tôi đã kiểm bằng script.

