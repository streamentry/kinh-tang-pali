notes: |-
  VĂN XƯNG THEO BÀI LÂN CẬN. mil5.4.10 ngay sau bài này dùng Thưa Đại đức Nāgasena và Tâu Đại vương; mil5.4.1 và mil5.4.3 cũng vậy. Tôi theo bầy đó, khác với đa số chung của tầng mil là này Đại vương. Người điều phòng cũng chỉ định vậy cho lát này. Còn trong bài này chỗ không có tên, tôi dùng thưa tôn giả (7 tệp mil) cho bhante.

  CÔNG THỨC ĐÃ CÓ. 1.9 ubhato koṭiko → Đây là một câu hỏi hai đầu hiểm hóc đã đặt ra cho ngài, ngài hãy giải quyết nó, dùng lại nguyên văn của mil5.4.10:1.7 (cùng phẩm, cùng cách xưng hô; mil5.4.3:1.10 và mil5.3.7:3.5 dùng hai đằng khác). Na hi, bhante → Không phải vậy, thưa tôn giả. Bạch ngài Nāgasena cho Bạch ngài Nāgasena theo mil5.4.10:1.5. Tiêu đề 0.4 và 7.1 theo đúng công thức Câu hỏi về …, thứ … (301 khoá / 150 tệp mil).

  JINAVARA, CÒN BẤT ĐỊNH. 1.3, 1.8, 2.2 có jinavaraṁ pakkantāni; không có tiền lệ trong kho (0 tệp) và không có bản Anh. Tôi dịch là món quà tối bậu của Đức Thế Tôn theo nghĩa chữ (jinavara = điều tối bậu của bậc Giác ngộ), cố ý KHÔNG đoán đó là tấm vải hay món quà vật chất. Người biên tập xét lại được.

  BẢY HIỂM VỰC. sattanikāyapariyāpanna ở 5.1 tôi dịch là bị bao trùm trong bảy hiểm vực, không có tiền lệ trong kho; đây là cách nói chung cho sattānusaya.

  THÊN KÍCH 5.3. aṭṭhānamanavakāsatāya: tôi dịch là vì không có sự thong thả, không có khoảng trống trong tâm để chạm tới và thâm nhập, theo nghĩa chữ của aṭṭhāna và manavakāsatā, không có tiền lệ trong kho.

  NHÁY KÉP BỔ SUNG. Pāli mở nháy kép ở 1.1 và 2.1, đóng ở 1.9 và 3.1; nhưng lại có hai dấu đóng trần ở 4.1 và 6.2 mà không có dấu mở nào tương ứng. Tôi mở nháy ở 3.5 và 6.1 để câu nói của Trưởng lão khép lại đúng chỗ Pāli có dấu đóng. Đây là sửa chính tả của bản kinh, không thêm ý nghĩa.

  1.6 VÀ 1.7. Pāli cắt câu bằng …pe… giữa chỗ ‘nagare và chữ ānandan’ti; tôi giữ đúng một dấu lược ở 1.6 và 1.7 không có dấu lược, nên câu trích dẫn của vua bị cắt đúng như nguồn.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.

  STATUS. Hai blocking error ở trên là thật và đo được, nên bài đặt draft bất kể final_score.

  GIẢI QUYẾT DRAFT 2026-10-12. Đọc đối kháng toàn bài từ Pāli; bản dịch cũ sai nghĩa ở phần lớn các khoá nên đã viết lại toàn bộ 26 khoá thân bài và tiêu đề 0.4/7.1 (32/32 khoá giữ nguyên ID và thứ tự). Các mục cũ ở trên về JINAVARA, BẢY HIỂM VỰC, THÊN KÍCH 5.3 và NHÁY KÉP BỔ SUNG bị THAY THẾ bởi mục này; phần VĂN XƯNG, CÔNG THỨC ĐÃ CÓ (trừ ubhato koṭiko) và 1.6/1.7 vẫn đúng.

  LỖI NGHĨA THẬT ĐÃ SỬA (10 khoá lỗi nặng trên 32; thêm 16 khoá sửa nhẹ về từ ngữ/nhất quán). 1.3, 1.8, 2.2: dhanapālaka là tên con voi (Dhanapālaka), không phải voi giữ kho của thành; khīṇāsava là bậc lậu tận, không phải oán trạch; pañca khīṇāsavasatāni = năm trăm (5 x 100), bản cũ ghi năm; pariccajitvā jinavaraṁ pakkantāni = bỏ rời bậc Chiến Thắng tối thượng rồi tản đi (jinavara là danh xưng của Đức Phật, không phải món quà; pakkanta là bỏ đi, không phải mang đến); disāvidisaṁ = khắp các phương, các hướng; ekaṁ ṭhapetvā = chỉ trừ. 1.4: pātetukāma = muốn làm cho ngã xuống (bản cũ đọc thành chứng minh mười oai lực); vipula là rộng lớn, pāṭihāriya là thần biến (theo mil5.3.3 và mil6.3.7). 2.2: nāpi bhagavantaṁ pātetukāmatāya = cũng không phải vì muốn làm cho Đức Thế Tôn ngã xuống. 3.1: yena pana hetunā là mệnh đề quan hệ (bản cũ mở câu bằng Rồi với lý do gì); samucchinna = nhổ tận gốc (theo mnd15); khaṇantepi bhindantepi dhārentepi bản cũ đọc thành bị lay động, bị nâng giữ bởi biển núi, sai. 5.1: sattihatthā = tay cầm giáo (satti là giáo), upadhāvitvā tāseyyuṁ = chạy ào đến làm cho kinh sợ; bản cũ bịa ra bảy hiểm vực và tựa vào bậc A-la-hạn để tránh. 5.3: aṭṭhānamanavakāsatāya = vì là điều không thể có, không có cơ hội (công thức aṭṭhānametaṁ anavakāso, theo mn115). 6.1: bản cũ viết ngày mai, thành phố vua, vị đại thần đứng đợi, thân voi trắng đều không có trong Pāli; nay: bậc tối thắng trong hàng nhân loại ưu tú / ngưu vương giữa các bậc Chiến Thắng cao quý đã vào thành tuyệt hảo, con voi Dhanapālaka sẽ lao đến trên đường phố, upaṭṭhāko (thị giả) sẽ không bỏ rơi bậc Thiên Trung Thiên, guṇa = đức hạnh, pākaṭa = hiển lộ, kilesabandhanamokkha = sự thoát khỏi trói buộc của phiền não. 6.2, 6.3: pakkantā = đã tản đi (không phải mang đến), ānisaṁsa = lợi ích; suvibhatto pañho = câu hỏi đã được phân tích rõ ràng (bản cũ ghi rất khó, sai). Tiêu đề 0.4 và 7.1: abhāyana = không sợ hãi (bản cũ bỏ chữ không, đảo nghĩa); translationTitle đổi theo. Nháy: 1.8 bỏ nháy đơn thừa ở cả cụm dài (Pāli chỉ có nháy quanh vigatabhayasantāsā arahanto); 6.1 bỏ nháy kép mở thừa (Pāli mở nháy kép ở 1.1, 2.1, 3.5, 4.5, đóng ở 1.9, 3.1, 4.1, 6.2). Thuật ngữ: vigatabhayasantāsā = đã lìa sợ hãi và kinh sợ (bhaya = sợ hãi, santāsa/tāsa = kinh sợ, theo mil5.2.3 nỗi kinh sợ); hetu = nguyên nhân, kāraṇa = lý do; Na hi, bhante = Không phải vậy, thưa tôn giả (92 khoá); mahāpathavī = đại địa (46 khoá, trái đất 5); jinavara = bậc Chiến Thắng tối thượng (snp3.11, tha-ap89, tha-ap549). Ba cặp Pāli trùng nguyên văn trong bài (3.2 và 4.2, 3.3 và 4.3, 3.5 và 4.5) đều dịch giống hệt; 3.4 và 4.4 chỉ khác chủ ngữ. Số: một trăm ngàn thế giới (satasahassa = 100 x 1.000 = 100.000); năm trăm (5 x 100).

  BLOCKER ĐÃ GỠ. Blocker thứ hai (coverage tầng Anh 0/26 dưới ngưỡng 0,8): thuộc loại ghi nhận mất mát, không phải lỗi văn bản; nguyên nhân là tầng Sujato không phát hành bài này (đã nêu ở blocker còn lại), và độ phủ do kho tính, mất mát ghi ở content/meta/reference-gaps.yaml bằng npm run reference:gaps. Đã đọc kỹ cả 26 khoá thân bài trực tiếp từ Pāli; bản dịch tự đứng vững từ Pāli, triangulation giữ 6,5 (không cao hơn 8,0). Tầng Việt hiện hành chỉ có Pháp Cú nên bài này không có tham chiếu Việt truyền thống; đây là giới hạn của bản chụp upstream, không phải lỗi văn bản.

  BLOCKER GIỮ. Blocker đầu (không có bản Anh Sujato tại commit đã ghim, not-published-upstream) giữ nguyên, là sự thật về upstream; để quy trình waiver no-upstream-english của người biên tập xử lý.

  BẤT ĐỊNH CÒN LẠI (không đổi giáo nghĩa, không phải blocker). (1) 1.4 paññāyissati sakena kammenāti: ai là chủ của sakena kammena (nghiệp của chính mình) không rõ trong Pāli; bản dịch giữ nguyên mơ hồ, không thêm chủ thể. (2) 6.1 na heva ca tathāgataṁ samupagamissati hatthināgo: đọc là vế thứ hai của mệnh đề điều kiện (nếu tất cả không rời đi thì đức hạnh của Ānanda không hiển lộ, và voi chúa cũng không đến gần Như Lai); đây là cách đọc hợp mạch với câu sau nhưng không có bản đối chiếu để kiểm. (3) 6.1 naravarapavara và jinavaravasabha: là các danh xưng ghép của Đức Phật, dịch theo nghĩa chữ. (4) 3.1 và 4.1: chủ thể ngầm của khaṇante, bhindante, patante, dahante không nêu trong Pāli, dịch bằng dạng bị động trung tính. Điểm: semantic_fidelity 9,1 xuống 8,6 vì bản cũ sai nặng và bản mới còn các bất định trên; terminology và ambiguity_integrity giữ, grammar_logic 9,0 xuống 8,8. Cổng kỹ thuật do người điều phối chạy sau khi gộp: npm run validate, npm test, npm run check, npm run build; technical_integrity giữ 9,6.
