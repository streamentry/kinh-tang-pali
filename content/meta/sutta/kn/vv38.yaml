notes: |-
  **ĐỌC TOÀN BỘ PĀLI 48 KHOÁ TRƯỚC KHI VIẾT** (`vc/p79.txt`), in lại từng cặp Pāli↔Việt sau khi ghi.

  **TẦNG THAM KHẢO — không có tệp Anh đã ghim** ⇒ `draft`, `triangulation` 7,5.

  **BÀI SONG SINH VỚI `vv29`, `vv31`, `vv36`, `vv39`** (cùng phẩm `Pāricchattakavagga`).
  **13 khoá dùng lại nguyên văn bản dịch đã có**, đếm từng khoá:
  · `Vāti gandho disā sabbā,` + `rukkho mañjūsako yathā.` = *Gió thổi mùi thơm khắp mọi
    phương, / y như cây Mañjūsaka.* (`vv39:4.3–4.4`, 1) ·
  · `Ghāyase taṁ sucigandhaṁ,` + `rūpaṁ passasi amānusaṁ;` = *Hãy hít lấy mùi thơm dịu
    dàng ấy, / hãy nhìn vẻ dáng siêu tục ấy;* (`vv39:5.1–5.2`, 1) ·
  · `Devate pucchitācikkha,` đa số 2/3 là *Này nữ thiên, hãy nói lời hỏi:* ·
  · `kissa kammassidaṁ phalan”ti.` đa số 2/4 là *quả báo ấy là do nghiệp nào”ti.* ·
  · `Tāhaṁ kammaṁ karitvāna,` (2 tiền lệ, 1–1) và `Apetasokā sukhitā,` +
    `sampamodāmanāmayā”ti.` đi theo **cặp** `vv36:8.3–8.4` ·
  · `Tassuddānaṁ` → *Tóm lược:* (62/127) ·
  · `Vaggo tena pavuccatīti.` → *Phẩm ấy vì vậy được gọi tên là vậy.* (2/4) ·
  · danh sách tên trong uddāna giữ Pāli theo tiền lệ `vv28:9.1–9.6` (Dāsī, Lakhumā,
    Ācāmadāyikā, Caṇḍālī, Bhaddeyyī, Soṇḍinnā, Uposathā, Niddā, Suniddā — đều giữ Pāli).
  **Tên phẩm:** `Vimānavatthu` (49/51) · `Itthivimāna` → *Chuyện Cung Điện Nữ Hư Không*
  (25/26) · `Pāricchattakavagga` → *Phẩm Cây San Hô* (**3/3**, `vv29`, `vv31`, `vv36`) ·
  khuôn *N. Chuyện Cung Điện <tên>* và *Chuyện Cung Điện <tên>, thứ N.* đo trên **50** tệp `vv`.

  **MỘT CHỖ CỐ Ý KHÔNG NHÂN BẢN TIỀN LỆ, VÌ BẢN SẴN CÓ DỊCH SAI.** `:9.4`
  `sampamodāmanāmayā”ti.` — `vv39:8.4` dịch là *tôi chứng đắc thiên thần lực, có uy thế lớn
  lao”ti.*, tức là **lời của một khoá khác rơi nhầm vào đây**: cả cụm ấy dịch
  `Deviddhipattā mahānubhāve` (`vv31:2.3`), không phải `sampamodāmanāmayā`. Tôi theo
  `vv36:8.4` (*với tâm hân hoan hỷ phát đến”ti.*), cặp với `vv36:8.3` đúng cho
  `Apetasokā sukhitā`.

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `veṇīsu` (`:4.2`) — **0 tiền lệ cho câu này**. `veṇī` có hai nghĩa: *Veda* và *đàn Hương*
    (PED liệt kê cả hai; ở đây là số nhiều `veṇīsu`). Cảnh xung quanh đều là âm nhạc
    (`:2.3–:2.4` tiếng trời, `:4.4` và `:5.4` tiếng trống năm mặt, `:6.3–:7.2` mùi thơm và
    hình sắc), nên tôi dịch theo nghĩa *đàn* — *bà ấy nắm lấy cây đàn;*. Nếu coordinator chốt
    nghĩa *Veda* thì phải sửa cả lục bài cùng công thức.
  · `koviḷāre` (`:1.1`) — **0 tiền lệ**. `kaviḷā` = *cao lớn, thượng diệm*; tôi dịch *cao lớn*.
  · `Vivattamānā kāyena,` (`:4.1`) — `vivattamāna` = *vặn vẹn*, `kāyena` = *bằng thân*; tôi dịch
    *Khi đang vặn vẹn thân,* và để chủ tử *bà ấy* ở `:4.2` đúng như Pāli đặt nó ở đó.
  · `Pabhassaraṁ` (`:8.1`) — danh xưng **Mặt Trăng**; dịch theo tiền lệ `candima` →
    *Mặt Trăng* (`sn2.9:3.1`, `sn2.11:1.2`).
  · `vaṇṇagandhena saṁyutaṁ;` (`:8.2`) — `saṁyuta` (tân ngữ) = *thành tựu cùng*; `vaṇṇa` +
    `gandha` giữ thành *hương sắc* như vv11/vv29 đã làm cho `vaṇṇa`.
  · `Asokapupphamālāhaṁ` (`:8.3`) — **0 tiền lệ** cho `asoka` (cây thị / hoa thị). Tôi giữ
    Pāli: *vòng hoa Asoka*, theo đúng quy ước tên riêng của tầng (`Yama`, `Kaḷevara` trong
    `tha-ap56`), thay vì tự đặt một tên Việt mới.
  · `accimantaṁ` (`:8.1`) — `acciman` = *rực rỡ, tỏa sáng*; **0 tiền lệ**.
  · `mālā` (`:6.1`, `:8.3`) → *vòng hoa* (tiền lệ `tha-ap107:1.2`, ghi ở `cp4`).
  · `pañcaṅgike tūriye` (`:4.4`, `:5.4`) → *tiếng trống năm mặt*; `tūriya` là *trống* (đã có
    `vv36:4.3–4.4`, `vv39:3.3–3.4` dùng *tiếng trống*).

  **LỖI BẢN NHÁP ĐÃ BẮT VÀ SỬA TRONG REVIEW ĐỐI KHÁNG.**
  (a) `:4.2` — bản nháp đầu của tôi viết *cây đàn **Hương***. `veṇī` **không có** chữ
      *Hương* trong Pāli; đó là chỗ tôi tự thêm. Đã sửa thành *cây đàn*.
  (b) `:8.1` — bản nháp đầu viết *"**Chính là ta**, Mặt Trăng rực rỡ,"*. Pāli ở `:8.1–:8.2` đặt
      **tân ngữ** `Pabhassara` (Mặt Trăng), không có ngôi như xưng; ngôi như xưng chỉ xuất hiện
      ở động từ `upanāmayiṁ` ở `:8.4`. Đã sửa thành *Mặt Trăng rực rỡ sáng,*.

  **DẤU LƯỢC.** Không có `…pe…` ở bài này; mọi khoá đều viết đủ, không nén.

  **NGOẶC KÉP — giữ y hệt Pāli, tự đếm: cân.** `“` mở ở `:1.1` và `:8.1`, `”` đóng ở
  `:7.4` và `:9.4`. (Đếm: mở `“` 2 / đóng `”` 2.)

  **CHỐT `lọt_pāli` chặt** mười tên trong uddāna (`Ucchu`, `Guttila`, `Daddalla`, `Pesa`,
  `Visālakkhī`, `Uḷāra`, `Pallaṅka`, `Mallikā`, `Pāricchattaka`, `Latā`) — đều là danh riêng
  không có bản dịch Việt nào trong tầng; khai vào bộ nhớ tiến trình theo đúng hướng dẫn của
  `lọt_pāli`, KHÔNG sửa `_hvi.py`.

  Cổng kỹ thuật chưa chạy — lát này bị cấm `npm run validate|test|check|build|audit|reference:gaps`. Tiêu chí 10 bị chặn ở **9.6**; bốn lệnh để coordinator chạy: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  **Lượt cải thiện 2026-10-11 (kiểm toán đối kháng độc lập; lượt chấm 2026-10-05 tự chấm 9,03 và đã bị thay thế).**
  Đọc lại từng cặp Pāli↔Việt cho thấy **19/48 khoá có lỗi nghĩa thật** (35 khoá được sửa, gồm cả lỗi từ ngữ và nhất quán). Phân loại lỗi nghĩa:
  · **Chủ thể/ngôi sai (5):** `:1.4` *các nữ thiên hát* (Pāli `gāyantī sampamodasi` là ngôi hai số ít, nữ thiên một mình); `:2.1`, `:3.1` *bà ấy* (Pāli `tassā te` là ngôi hai, người hỏi nói với nữ thiên); `:4.3`, `:5.3` *họ* (`tesaṁ` chỉ đồ trang sức và vòng hoa, không chỉ người).
  · **Từ/vật sai nghĩa (8):** `:1.1` *cao lớn* (không có trong Pāli; `koviḷāre` là danh từ định vị, tên cây); `:1.3` *đệm* → *kết* (`ganthamānā`); `:4.2` *cây đàn* → *bím tóc* (`veṇī` ở đây là bím tóc, khớp `vv44:4.2`, `vv50:4.2`; **lỗi bản nháp "đàn" cũ và lời ghi chú "PED liệt kê Veda và đàn" ở trên không có căn cứ, nay bị thay thế**); `:4.4`, `:5.4` *trống năm mặt* → *nhạc năm phần* (`tūriya` là nhạc cụ nói chung, theo đa số `vv36`, `vv44`, `vv50`, `vv64`); `:5.2` *quét đi* → *làm rung chuyển* (`sampakampitā`); `:8.1` *Mặt Trăng* (`pabhassaraṁ accimantaṁ` là tính từ của vòng hoa: rạng ngời, rực rỡ; **ghi chú cũ "danh xưng Mặt Trăng theo `candima`" là sai và bị thay thế**); `:9.4` *với tâm hân hoan hỷ phát đến* → *hoan hỷ, không bệnh tật* (`sampamodāmi` + `anāmayā`; **ghi chú cũ chọn theo `vv36:8.4` là lan lỗi từ khoá đó**).
  · **Thức/hô cách sai (3):** `:7.1`, `:7.2` *hãy hít lấy*, *hãy nhìn* → *nàng ngửi*, *nàng thấy* (`ghāyase`, `passasi` là chỉ định ngôi hai, không phải mệnh lệnh); `:7.3` *hãy nói lời hỏi* → *được hỏi xin hãy nói* (`pucchitā ācikkha`).
  · **Thêm/mất đơn vị nghĩa (3):** `:5.1` mất chủ ngữ `vaṭaṁsakā`; `:6.3` thêm chủ ngữ *gió* (Pāli `gandho vāti`: hương lan toả); `:8.3` *hằng là* không có trong Pāli, `asokapupphamālā` là tân ngữ của `upanāmayiṁ`.
  Sửa thêm (không đếm lỗi nghĩa): `:2.2`, `:3.2` *tứ chi và khớp* → *từng chi phần* (`aṅgamaṅga`); `:2.3` bỏ *khắp nơi*; `:1.2`, `:2.4`, `:3.4`, `:6.2` *đáng ngợi ngơi*, *thơm ngon* → *làm đẹp lòng*, *hương trong sạch* (`manorama`, `sucigandha`); `:6.1` *ngài* → *nàng* (người nghe là nữ thiên); `:7.4` *ấy* → *đây là* (`idaṁ`); `:8.4` *ta* → *tôi* (nữ thiên tự xưng, khớp `:9.3`); `:9.1` thêm *tôi* (`tāhaṁ`); `:9.3` *sầu muốn* (lỗi gõ) → *sầu muộn*, *an ổn* → *an lạc*; `:6.4` *Mañjūsaka* → *mañjūsaka* (theo `vv44`, `vv50`). Cặp Pāli trùng trong bài (`:2.1=:3.1`, `:2.2=:3.2`, `:4.3=:5.3`, `:4.4=:5.4`) dịch giống nhau.
  Điểm đổi: source_provenance 9,5→9,0 (các khẳng định từ vựng trong notes cũ không có nguồn) · semantic_fidelity 8,9→8,2 · grammar_logic 8,9→8,5 · terminology 9,1→8,4 · vietnamese_clarity 9,2→8,8 · han_viet_balance 9,2→9,0 · ambiguity_integrity 8,4→8,0 · `final_score` 9,03→8,70. Các tiêu chí khác giữ nguyên (`segment_alignment` 10,0, `triangulation` 7,5, `technical_integrity` 9,6). Điểm 8,70 nằm dưới ngưỡng `published` (> 9,0).
  **Bất định thật còn lại.** (1) `:1.1` `Pāricchattake koviḷāre` — tôi đọc là hai danh từ định vị đồng vị (*cây San Hô, cây koviḷāra*); không có bản Anh pin để phân xử, giữ `koviḷāra` nguyên văn thay vì đặt tên Việt. (2) `:7.1–7.2` `ghāyase … passasi amānusaṁ` — đọc theo ngữ pháp là hai động từ ngôi hai số ít (người hỏi mô tả nữ thiên); `vv44`/`vv50` đọc thể bị động, tôi không theo vì `passasi` là chủ động ngôi hai. (3) `:5.1` `vaṭaṁsakā` — dịch *vòng hoa trang sức* (tiền lệ `cp9`, `thag9.1`), không khẳng định cài tai hay cài đầu như `vv44`/`vv50`. (4) `:4.4`, `:5.4` `pañcaṅgike tūriye` — *nhạc năm phần* theo đa số, nghĩa chi tiết của "năm phần" không phân xử được từ Pāli. (5) `:8.2` `saṁyutaṁ` → *đủ cả … lẫn …*, hiểu là vòng hoa có đủ hương và sắc.
  **Lỗi lan họ vv (ngoài tệp này, báo, không sửa):** `vv36:8.4` giữ nguyên *với tâm hân hoan hỷ phát đến* và `vv39:8.4` dịch sai hẳn (*tôi chứng đắc thiên thần lực…*) cho cùng Pāli `sampamodāmanāmayā`; `vv22`, `vv29`, `vv30`, `vv36`, `vv37`, `vv39`, `vv48` còn *hãy nói lời hỏi*/*hãy hỏi cho rõ* cho `pucchitācikkha`; `vv39:5.1–5.2`, `vv39:4.3` còn *hãy hít lấy*, *Gió thổi mùi thơm*; tiêu đề phẩm `Itthivimāna` dịch *Nữ Hư Không* là sai (không có `ākāsa`) và lặp ở ~51 tệp, **không sửa riêng một tệp**.
  Cổng kỹ thuật chưa chạy trong lượt này (cấm chạy lệnh): `npm run validate` · `npm test` · `npm run check` · `npm run build`; `technical_integrity` giữ 9,6. Chưa có phiên bản Anh độc lập nên blocker "không có tầng tham khảo tiếng Anh" giữ nguyên.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2011, theo ấn bản Buddha Jayanthi). 5 khoá bất đồng nghĩa → sửa 0, giữ 5 (1.1–1.4 `Pāricchattake koviḷāre … dibbamālaṁ ganthamānā`: bản nguyên bài hiểu là kết tràng bằng hoa pāricchattaka và koviḷāra (công cụ cách), Pāli ghim là vị trí cách số ít cùng với `ramaṇīye manorame`, chỉ nói chỗ nàng đang kết tràng, không nói chất liệu; 12.3 `daddallapesamallikā`: bản nguyên bài dịch `daddalla` thành tính từ “tỏa sáng rực rỡ” và `pesa` thành “Sesavatī”, trong khi tên bài vv34 là `Daddalla…`, vv35 là `Pesavatī…`, vv36 là `Mallikā…`, nên giữ ba tên riêng theo Pāli), bất định 0. Đã khớp với bản nguyên bài: ba cặp 2.1–3.4 lặp, năm bộ nhạc (4.4, 5.4), `mañjūsaka` (6.4), vòng hoa asoka dâng Đức Phật (8.3–8.4), mười thiên cung của phẩm (12.1–12.4 khớp mười tên). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt từng khoá, đối chiếu bản nguyên bài Bhikkhu Indacanda, đoạn song song vv37, vv44, vv34 và vv36/vv39/ne37): sửa 3 khoá, đều là nhất quán thuật ngữ/khuôn, không đổi nghĩa:
    - `7.3` "này nữ thiên, được hỏi xin hãy nói" → "Này nữ thiên, được hỏi, xin hãy cho biết," (`pucchitā ācikkha`, đúng khuôn đa số vv29/vv34/vv36/vv48).
    - `7.4` "đây là quả của nghiệp nào?" → "đây là quả báo của nghiệp nào?" (`phalaṁ`; Pāli trùng `vv37:3.6`, `vv44:7.4`, `vv34:7.4` đều "quả báo").
    - `10.1` "Chuyện Cung Điện Cây San Hô, thứ mười." → "Cung Điện Cây San Hô, thứ mười." (khoá kết `…vimānaṁ N-maṁ`: 38 tệp vv dùng "Cung Điện X", 6 tệp thêm "Chuyện"; khớp `vv35:13.1`, `vv36:9.1`).
    Giữ 5 chỗ khác với bản nguyên bài (`1.1`–`1.4`, `12.3`) như đã ghi 2026-10-14. Bất định giữ nguyên văn: `1.1` cú pháp `koviḷāre`, `4.2` `veṇīsu`, `5.1` `vaṭaṁsakā`.
    Lỗi chéo chờ người biên tập: `0.2` Itthivimāna; `12.5` "được gọi tên là vậy" (khuôn lặp ở vài tệp vv, vụng nhưng đúng nghĩa).

  Nghiên cứu nguồn ngoài 2026-10-16: Hellmuth Hecker, "Vimānavatthu – Wege zum Himmel" (Beyerlein &
  Steinschulte 1995, còn bản quyền; bản SuttaCentral/palikanon.de)
  https://suttacentral.net/vv38/de/hecker, kèm bản Nga của Леонид Шаповалов (dịch từ bản Anh
  Mahamevnawa, phổ biến miễn phí) https://suttacentral.net/vv38/ru/shapovalov, DPD https://dpdict.net,
  và PDF song ngữ Indacanda (chỉ đọc phần dị bản, https://tamtangpaliviet.net/TTPV/30_Vv_Pv.pdf; giấy
  phép NOASSERTION); đã đối chiếu cả 48 khoá (kệ 675–683 của Hecker); sửa 0 khoá; bất định 5.1
  `vaṭaṁsaka` (bản này "vòng hoa trang sức", Hecker "Ohrenschmuck", DPD "wreathed, garlanded"), 1.1
  `koviḷāra` (giữ Pāli).

  Rà từng chữ bằng DPD 2026-10-16: 48 khoá đã rà; sửa 1.1 (cách: `pāricchattake koviḷāre ramaṇīye
  manorame` là đối cách số nhiều chỉ hoa dùng để kết tràng, không phải định vị "ở nơi cây" — chú giải
  Vv-a https://www.tipitaka.org/romn/cscd/s0506a.att1.xml "pāricchattakanāmake koviḷārapupphe ādāya
  dibbamālaṃ ganthamānā", bản Nhật 関西パーリ語実習会 https://suttacentral.net/vv38/jpn/kansai cùng hướng, DPD
  `koviḷāra` 2 = coral tree nên hai chữ chỉ một loài hoa → "Bằng những hoa San Hô, hoa koviḷāra"); bất
  định 5.1 (`vaṭaṁsakā`: DPD `vaṭaṃsa` "wreath; garland; flower ornament" khớp "vòng hoa trang sức",
  còn Vv-a "ratanamayā kaṇṇikā" và bản Nhật "耳飾" hiểu là khuyên tai; giữ theo DPD).
  Lượt hoàn thiện 2026-10-17: thống nhất thuật ngữ `1.3` `mālā` «tràng hoa» → «vòng hoa» (như `6.1`, `8.3`). Giữ có lý do: `vimāna` «Thiên Cung» ở `0.2` và «Cung Điện» ở `0.4`, `10.1` (tên tập `Itthivimāna` dùng chung cho 50 bài vv, đổi phải đồng loạt, báo người biên tập); `vaṭaṁsaka` «vòng hoa trang sức» là chữ khác với `mālā`. Thêm 5 chú thích (`1.1`, `4.2`, `5.1`, `7.1`, `12.3`). Các câu sau trong ghi chú cũ đã bị thay: blocker và mục TẦNG THAM KHẢO ghi «⇒ `draft`, `triangulation` 7,5»: bài nay ở `review` theo waiver `no-upstream-english`, triangulation 8,8; ở mục đầu, «`Devate pucchitācikkha` … *Này nữ thiên, hãy nói lời hỏi*», «`Itthivimāna` → *Chuyện Cung Điện Nữ Hư Không*» và «`:9.4` … theo `vv36:8.4` (*với tâm hân hoan hỷ phát đến*)»: nay là «được hỏi, xin hãy cho biết», «Thiên Cung Của Nữ Giới», «hoan hỷ, không bệnh tật»; ở lượt 2026-10-11, «`koviḷāre` là danh từ định vị, tên cây» và bất định (1) «hai danh từ định vị đồng vị (cây San Hô, cây koviḷāra)»: đã thay bằng đối cách số nhiều chỉ hoa («Bằng những hoa San Hô, hoa koviḷāra») ở lượt rà DPD; mục «Lỗi lan họ vv» về `vv36:8.4` và tiêu đề «Nữ Hư Không», cùng «Lỗi chéo chờ người biên tập: `0.2` Itthivimāna» (lượt 2026-10-15): các chỗ ấy đã được sửa.
  Chấm lại độc lập sau rà DPD + kiểm độc lập 2026-10-17: bài ngắn, đọc hết 44 khoá có nội dung → KHỚP 44, LỖI-THẬT 0. 1.1 đã phân xử bằng Vv-a; mālā «vòng hoa» thống nhất đúng. Nguồn: Hecker, Shapovalov, Kansai, Vv-a CST, Indacanda, DPD; không có bản Anh → triangulation 8,7. Trừ văn phong ở 12.5 «được gọi tên là vậy», 7.2 «hình sắc phi nhân»; 5 chú thích có nguồn. Kỹ thuật: scripts/validate.ts pass, nhưng npm run validate/quality:check exit 1 vì assessment cũ của bài không còn khớp content_sha256 sau lượt hoàn thiện (hết khi ghi và áp lượt này); check.py OK; test/check/build không tự chạy. Blocker vắng bản Anh được thay bằng chuỗi đúng sự thật vì chuỗi cũ còn ghi «triangulation bị chặn»/«bắt buộc draft».
