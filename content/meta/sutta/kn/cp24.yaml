notes: |-
  **Bài thứ tư của phẩm `Yudhañjayavagga`, `Nekkhammapāramī 4`, trong `Cariyāpiṭaka`** — thứ tự **Xuất Gia**, sau `cp21` (*Xuất Gia Ba-la-mật Thứ Nhất*) và `cp25` (*Thứ Năm*) của cùng phẩm, nên `0.3` = *Xuất Gia Ba-la-mật Thứ Tư* là chuỗi duy nhất còn thiếu, không phải lựa chọn mới. 37 khoá, tất cả đã dịch. Người kể là thái tử xuất gia với cha mẹ và bảy em.

  **Bốn khoá dùng lại nguyên văn (đếm bằng script):** `0.1` ← `cp13`/`cp17` (*Hạnh Tạng*) · `0.2` ← `cp21`/`cp25` (*Phẩm Yudhañjaya*) · `1.1` ← `cp13`/`cp17` (*Lại nữa, vào thời thuở nọ,*) · `8.4` ← `cp25:6.4` (*và cùng nhau bước vào khu rừng rậm đại ngàn.*) — Pāli `pāvisimhā mahāvanan”ti.` giống hệt. `1.1` dùng chung nguyên văn với `cp18:1.1` và `cp3:1.1` để `Cariyāpiṭaka` không tự mâu thuẫn.

  **Xưng ngôi thống nhất trên toàn bài: *ta*.** `cp13` và `cp21` (hai bài đã `published` cùng tác phẩm) dùng *ta* xuyên suốt; bản nháp của tôi lúc đầu lẫn *tôi* và *ta* trong cùng bài, đã sửa hết về *ta* (kiểm bằng script: 0 khoá còn chữ *tôi*). Riêng `8.3` chọn **nguyên văn `cp21:6.3`** (*Mà vì Nhất Thiết Chủng Trí là điều quý báu nhất đối với ta*) thay vì `cp5:3.3` (*tôi thương yêu điều toàn biết*) vì bản `cp5` kết thúc bằng *tôi*, hòa đúng ngôi thứ nhất và còn dùng được chữ *Mà* nối liền `8.2`. Cả hai cách đều có 1 tiền lệ cho cùng Pāli `Sabbaññutaṁ piyaṁ mayhaṁ` — đây là **lựa chọn vì ngôi**, ghi rõ để biên tập biết.

  **`hirī` → *biết hổ thẹn* (125 khoá trong tầng), `gihīdhamma` → *pháp gia đình*, `gihībhāva` → *đời sống gia đình*.** Hai gốc khác nhau nên hai cách khác nhau là có chủ ý, không lệch. `gihīdhamma` 0 tiền lệ trong tầng nên *pháp gia đình* là đặt mới. `hirīsukkamupāgato` tôi dịch *sinh ra trọn vẹn với lòng biết hổ thẹn*; bản nháp đầu để *lòng hiền* là lỗi của chính tôi: trong tầng này **hiền giả = `āvuso`**, mà `āvuso` xuất hiện tới 8 lần trong đúng bài này, nên *hiền* sẽ đọc nhầm thành cách xưng hô. Đổi sang *biết hổ thẹn* (125 khoá trong tầng) là vừa đúng nghĩa vừa tránh đụng.

  **`atthakāma` → *mong muốn điều lợi lành cho họ*.** `atthakāmo hitesinaṁ` là một cụu (mong muốn điều lợi + mong muốn điều lành cho họ); bản nháp đầu viết lặp *mong muốn điều lợi, mong muốn điều lành cho họ*, đã rút còn một. Sujato dịch *wanting what is best* — ngắn hơn, nhưng `hitesin` là *mong muốn điều lành cho họ*, có đối tượng rõ ràng, nên tôi giữ.

  **Ba cụm 0 tiền lệ:** `puravaruttame` → *kinh thành … tối thượng* (theo Sujato *the capital citadel* + `pura` là thành đô) · `ukkhipantaṁ` → *từ chối* · `bhisā` (trong `Bhisacariya`) → *kẻ ăn thịt người*. `0.4` và dòng kết cùng dùng *Hạnh Của …* / *Hạnh của …* theo phân tách đã đo ở `cp` (xem `notes` của `cp18`); `catutthaṁ` → *thứ tư* theo cùng công thức số thứ tự.

  **`pāvisimhā` tôi dịch *bước vào*, không phải *bước tới*.** Đây là khoá dùng lại nguyên văn từ `cp25:6.4`; Sujato dịch *entered the great forest*. Tôi giữ nguyên văn của kho đã có.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root: `root/pli/ms/sutta/kn/cp/cp24_root-pli-ms.json`, 37 khoá. Bản Anh Sujato **có** tại commit đã ghim: `translation/en/sujato/sutta/kn/cp/cp24_translation-en-sujato.json` (36/37; Sujato im lặng đúng ở dòng kết `9.1` — **một ô Anh rỗng không phải sự đồng thuận về cách dịch**, tôi dịch từ Pāli theo mẫu `cp`). Tầng `vietnamese-current` vắng: thư mục `translation/` không tồn tại trong checkout này. **Lưu ý về công thức coverage:** mọi khoá thân đều **dưới 40 ký tự** (kệ ngắn), nên theo đúng `source/layers.yaml` bài có 0 khoá có nội dung ⇒ coverage 0/0; phép đo đó không phản ánh chất lượng tham khảo, và cả 12 bài `cp` đã `published` cũng vậy.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì BRIEF cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0: mọi chốt tự động của `_hvi.kiểm` đã xanh và 37/37 khoá của chính bài này, nhưng cổng `npm` chưa chạy.

  **Lượt cải thiện 2026-10-14 (đọc đối kháng cả 37 khoá; 20 khoá đổi). Phần này THAY các điều nói ở trên về `bhisā` → *kẻ ăn thịt người*, `8.4` → *khu rừng rậm đại ngàn*, *người chị*, và `Mà vì Nhất Thiết Chủng Trí` không còn áp dụng cho bài này.**
  - **Nặng (4 khoá): tên bài `0.4` và dòng kết `9.1`**: `bhisa` là *củ/ngó sen* (cùng từ ở `ja488`, nhan đề Bhisajātaka dịch *Kinh Củ Sen*; Sujato dịch tiêu đề là *Lotus-eaters*), không liên quan đến thịt người; *Hạnh Của Kẻ Ăn Thịt Người* là sai nghĩa nặng, đổi thành *Hạnh Củ Sen* / *Hạnh củ sen, thứ tư.* (không thêm *của* vì không phải tên người; cùng kiểu `cp35`). **`1.3` và `8.2`**: `bhaginī` là em gái (không phải *người chị*) vì `2.1` nói rõ `pubbajo āsiṁ` — ta là người sinh trước; *người chị* ngược quan hệ thứ bậc. **`7.4`**: lời của cha mẹ — `sabbeva pabbajāma bho` là kêu gọi *chúng ta*, còn bản cũ đặt *Bạch các ông … chúng con*, tức giọng con nói với bậc trên, sai người nói; đổi thành *Này các vị, tất cả chúng ta hãy cùng xuất gia!*.
  - **Vừa (6 khoá)**: `2.3` *Thấy quả khổ đau, ta sinh sợ hãi* → *Thấy sự hiện hữu là đáng sợ* (`bhavaṁ … bhayato`, khớp mẫu `cp35` *Thấy … là đáng sợ* và `cp25:2.3`); `3.1–3.2` bản cũ gán *cùng những người bạn* như người đi kèm, trong khi `sahāyā` là chủ ngữ được cha mẹ sai đến → *Được cha mẹ sai đến, / những người bạn cùng một lòng*; `3.3` bỏ *cùng* thừa (`kāmehi maṁ nimantenti`); `4.3–4.4` bản cũ cắt giữa cụm so sánh (*… khó khăn như / lưỡi cày…*) và thêm *nghe* không có trong Pāli → *Với ta, lời ấy thật khắc nghiệt, / tựa lưỡi cày đã nung nóng*; `2.4` và `6.4` `nekkhammābhirato` là *ưa thích xuất gia* (tiền lệ *ưa thích xuất ly* ở `mnd7`, `mnd14`), bản cũ dịch *mong muốn* trùng với `patthemi` ở `6.3`.
  - **Nhẹ (10 khoá)**: `1.4` `nibbattā` số nhiều → *cùng sinh ra*; `2.2` `upāgato` là *đạt đến*, không phải *sinh ra* → *đạt đến sự trong sạch của lòng biết hổ thẹn* (`sukka` = *trong sạch* ở `ja6`, *pháp trắng* ở `cp22`, `iti42`); `4.1–4.2` `gihīdhamme` định vị cách → *về pháp gia đình*; `5.4` bỏ *muốn* và *thì* thừa; `8.3` *bỏ bê* → *buông bỏ* (`chaḍḍayitvā`, cùng `cp25:6.3` đã sửa); `8.4` *khu rừng rậm đại ngàn* → *khu rừng lớn* (`mahāvana`; Pāli giống hệt `cp25:6.4`, giữ cùng cách dịch); `4.1`, `4.2` chỉnh nhịp theo đó.
  - **Bất định còn lại**: (1) `6.2` `atthakāmo hitesinaṁ` — `hitesinaṁ` có thể là sở hữu cách số nhiều (*mong điều lợi cho những người mưu cầu điều lành cho ta*) hoặc cụm với `atthakāmo`; không có tiền lệ đồng cấu trúc trong tầng nên GIỮ *người mong muốn điều lợi lành cho họ*; (2) `2.2` `hirīsukka` — *trong sạch* hay *pháp trắng* (cp22: *pháp trắng của lòng hổ thẹn*); chưa phân xử; (3) `0.4` `bhisa` — *củ sen* theo `ja488` (`ja488` có 16 khoá *củ sen*) hay *ngó sen* (30 khoá kn, phần lớn `tha-ap485`); chọn *củ sen* để nhan đề trùng `ja488`, cùng câu chuyện; (4) `1.4` `sotthiya` *có học vấn* giữ theo `ja537` (*dòng họ có học vấn*), nghĩa sát hơn là *thông thạo thánh điển Bà-la-môn*.
  - **Điểm đổi**: `semantic_fidelity` 9.2 → 9.0, `grammar_logic` 9.2 → 9.1, `triangulation` 9.2 → 9.0, `vietnamese_clarity` 9.3 → 9.2, `ambiguity_integrity` 9.0 → 8.9 (hạ vì bản cũ có sai nghĩa thật mà điểm trước không phản ánh, và bất định kể trên còn nguyên); các tiêu chí khác giữ. `final_score` 9.33 → 9.26. `technical_integrity` giữ 9.6; bốn cổng `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
  - **Lỗi ngoài phạm vi, chỉ báo**: `cp14:1.3` có cùng Pāli `Bhavaṁ disvāna bhayato` nhưng dịch *Thấy quả khổ đau, ta sinh sợ hãi* — lệch với cách đã sửa ở đây.

  Quyết định hội đồng biên tập 2026-10-16: B15 — 0.3 (`nekkhamma` ba-la-mật = "xuất ly", hành động rời nhà giữ "xuất gia").
