notes: |-
  **Bài thứ tư của phẩm `Yudhañjayavagga`, `Nekkhammapāramī 4`, trong `Cariyāpiṭaka`** — thứ tự **Xuất Gia**, sau `cp21` (*Xuất Gia Ba-la-mật Thứ Nhất*) và `cp25` (*Thứ Năm*) của cùng phẩm, nên `0.3` = *Xuất Gia Ba-la-mật Thứ Tư* là chuỗi duy nhất còn thiếu, không phải lựa chọn mới. 37 khoá, tất cả đã dịch. Người kể là thái tử xuất gia với cha mẹ và bảy em.

  **Bốn khoá dùng lại nguyên văn (đếm bằng script):** `0.1` ← `cp13`/`cp17` (*Hạnh Tạng*) · `0.2` ← `cp21`/`cp25` (*Phẩm Yudhañjaya*) · `1.1` ← `cp13`/`cp17` (*Lại nữa, vào thời thuở nọ,*) · `8.4` ← `cp25:6.4` (*và cùng nhau bước vào khu rừng rậm đại ngàn.*) — Pāli `pāvisimhā mahāvanan”ti.` giống hệt. `1.1` dùng chung nguyên văn với `cp18:1.1` và `cp3:1.1` để `Cariyāpiṭaka` không tự mâu thuẫn.

  **Xưng ngôi thống nhất trên toàn bài: *ta*.** `cp13` và `cp21` (hai bài đã `published` cùng tác phẩm) dùng *ta* xuyên suốt; bản nháp của tôi lúc đầu lẫn *tôi* và *ta* trong cùng bài, đã sửa hết về *ta* (kiểm bằng script: 0 khoá còn chữ *tôi*). Riêng `8.3` chọn **nguyên văn `cp21:6.3`** (*Mà vì Nhất Thiết Chủng Trí là điều quý báu nhất đối với ta*) thay vì `cp5:3.3` (*tôi thương yêu điều toàn biết*) vì bản `cp5` kết thúc bằng *tôi*, hòa đúng ngôi thứ nhất và còn dùng được chữ *Mà* nối liền `8.2`. Cả hai cách đều có 1 tiền lệ cho cùng Pāli `Sabbaññutaṁ piyaṁ mayhaṁ` — đây là **lựa chọn vì ngôi**, ghi rõ để biên tập biết.

  **`hirī` → *biết hổ thẹn* (125 khoá trong tầng), `gihīdhamma` → *pháp gia đình*, `gihībhāva` → *đời sống gia đình*.** Hai gốc khác nhau nên hai cách khác nhau là có chủ ý, không lệch. `gihīdhamma` 0 tiền lệ trong tầng nên *pháp gia đình* là đặt mới. `hirīsukkamupāgato` tôi dịch *sinh ra trọn vẹn với lòng biết hổ thẹn*; bản nháp đầu để *lòng hiền* là lỗi của chính tôi: trong tầng này **hiền giả = `āvuso`**, mà `āvuso` xuất hiện tới 8 lần trong đúng bài này, nên *hiền* sẽ đọc nhầm thành cách xưng hô. Đổi sang *biết hổ thẹn* (125 khoá trong tầng) là vừa đúng nghĩa vừa tránh đụng.

  **`atthakāma` → *mong muốn điều lợi lành cho họ*.** `atthakāmo hitesinaṁ` là một cụu (mong muốn điều lợi + mong muốn điều lành cho họ); bản nháp đầu viết lặp *mong muốn điều lợi, mong muốn điều lành cho họ*, đã rút còn một. Sujato dịch *wanting what is best* — ngắn hơn, nhưng `hitesin` là *mong muốn điều lành cho họ*, có đối tượng rõ ràng, nên tôi giữ.

  **Ba cụm 0 tiền lệ:** `puravaruttame` → *kinh thành … tối thượng* (theo Sujato *the capital citadel* + `pura` là thành đô) · `ukkhipantaṁ` → *từ chối* · `bhisā` (trong `Bhisacariya`) → *kẻ ăn thịt người*. `0.4` và dòng kết cùng dùng *Hạnh Của …* / *Hạnh của …* theo phân tách đã đo ở `cp` (xem `notes` của `cp18`); `catutthaṁ` → *thứ tư* theo cùng công thức số thứ tự.

  **`pāvisimhā` tôi dịch *bước vào*, không phải *bước tới*.** Đây là khoá dùng lại nguyên văn từ `cp25:6.4`; Sujato dịch *entered the great forest*. Tôi giữ nguyên văn của kho đã có.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root: `root/pli/ms/sutta/kn/cp/cp24_root-pli-ms.json`, 37 khoá. Bản Anh Sujato **có** tại commit đã ghim: `translation/en/sujato/sutta/kn/cp/cp24_translation-en-sujato.json` (36/37; Sujato im lặng đúng ở dòng kết `9.1` — **một ô Anh rỗng không phải sự đồng thuận về cách dịch**, tôi dịch từ Pāli theo mẫu `cp`). Tầng `vietnamese-current` vắng: thư mục `translation/` không tồn tại trong checkout này. **Lưu ý về công thức coverage:** mọi khoá thân đều **dưới 40 ký tự** (kệ ngắn), nên theo đúng `source/layers.yaml` bài có 0 khoá có nội dung ⇒ coverage 0/0; phép đo đó không phản ánh chất lượng tham khảo, và cả 12 bài `cp` đã `published` cũng vậy.

