  Tôn giả Moggallāna ở `1–2` và câu trả lời của nữ thiên ở `3–4` là hai lần lặp CÙNG
  MỘT CÔNG THỨC, chỉ khác đại từ `te` / `me`. Tôi dịch hai lần khác nhau đúng một đại
  từ: `1.1` + `3.1` = `ngươi` / `tôi`, `2.1` + `4.1` = `ngươi` / `tôi`. Ngược lại
  `3.2–3.4` trùng `1.2–1.4` TUYỆT ĐỐI (không có đại từ) nên bản Việt phải trùng tuyệt
  đối, và nó trùng đã được kiểm bằng script.

