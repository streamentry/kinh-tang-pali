    · `Etassācāmadānassa` (7.5, 8.5, 9.5, 10.3) là "của sự bố thí váng cơm này" (sở hữu cách
      của sự so sánh với "một phần mười sáu"), KHÔNG phải "bố thí của người đã bày món ăn dâng
      ấy". Cũng đảo chủ ngữ: cái "không đáng một phần mười sáu" là hoàng hậu/xe/voi/quyền
      chủ tể, chứ không phải món bố thí.
    · `2.1`, `4.1` `adāsi` do người nữ dâng cho vị Trưởng lão: "đã dâng cho ngài/tôi", không phải
      "bày cho ngươi". `te` ở `1.1`, `2.1` gọi một vị khất thực (`piṇḍāya carantassa`) là
      "ngài", không phải "ngươi".
    · `2.3`, `4.3`: đại từ `sā` chỉ người nữ đã mất, nói ở ngôi thứ ba về một người đã khuất:
      "Người ấy" thay cho "Nàng" (xưng hô ngôi thứ hai không có trong Pāli); và "thân người"
      thay cho "thân xác người" (`mānusaṁ dehaṁ`).
    · `2.4` `kaṁ nu sā disaṁ gatā` = "đã đi về phương nào?" (`disā` = phương/hướng).
    · `4.4` `vippamuttā ito cutā` = "đã được giải thoát, từ đây mệnh chung"; "hoàn toàn tự do, đã
      từ bỏ cõi này" thêm "hoàn toàn" và đổi `cutā` ("mệnh chung") thành "từ bỏ".
    · `6.3` `parābhatena dānena` = "với vật thí do người khác mang đến", KHÔNG phải "bố thí bị
      tước đoạt" (không có nghĩa tước đoạt trong `para + ābhata`).
    · `6.4` `ijjhittha vata dakkhiṇā` = "quả thật sự cúng dường đã thành tựu", không phải "dường
      như dầu quá đã tràn đổ" (`dầu quá` là chữ vô nghĩa, không có trong Pāli).
    · `7.1` `Yā mahesittaṁ kāreyya` = "Người nào có thể giữ ngôi hoàng hậu": "làm nên ngọn núi
      lớn" là SAI nặng. `mahesitta` ở `thi-ap8:11.2`, `thi-ap11:8.2`, `thi-ap9:13.2` (34 chỗ) =
      "ngôi hoàng hậu"; `mahesittamakārayiṁ` = "tôi đã giữ ngôi hoàng hậu". Lỗi này cũng có ở
      `vv43:6.1`.
    · `7.4` `bhattu cānomadassikā` = "và có dung nhan không chút kém cỏi trong mắt chồng";
      `anoma` là "không thấp kém", không phải "không chút tì vết".
    · `8.1` THIẾU `nikkhā`: bản cũ bỏ mất "một trăm nikkha". Nay: "Trăm nikkha, trăm con ngựa";
      `nikkha` giữ nguyên như `ja506:9.2`, `ja543:44.3`, `ja501:27.1` ("một trăm nikkha").
    · `8.2` `assatarīrathā` = "cỗ xe do la kéo" (`sn10.8:2.2`, `ja546:12.2` = "xe do la kéo",
      "cỗ xe do la kéo"); "cỗi xe lắp đủ bánh" là bịa, và "cỗi" là chữ sai chính tả.
    · `8.4` `āmuttamaṇikuṇḍalā` = "đeo hoa tai ngọc" (18 khoá khớp trong tầng, trong đó `pv21:51.2`, `ja506:8.2`, `tha-ap24:43.4`); bản
      cũ "đẹp nhất trong những người đeo vòng tai" thêm nghĩa so sánh cao nhất mà Pāli không có.
    · `9.1` `hemavatā nāgā` = "voi vùng Hy Mã Lạp"; bản cũ "có vóc bằng vàng" sai (không có
      "vàng" ở dòng này).
    · `9.2` `īsādantā urūḷhavā` = "ngà như cán cày, thân hình to khỏe" (`tha-ap20:1.4`,
      `tha-ap563:1.4`, `mn66:10.1`); "bước đi uy nghi" không có trong Pāli.
    · `9.3` `suvaṇṇakacchā mātaṅgā` = "những con voi có đai bằng vàng" (6 chỗ: `ja539`, `ja529`,
      `ja547`, `tha-ap409/410/413`); "Đeo dây vàng quanh ngực" sai/lệch.
    · `9.4` `hemakappanavāsasā` = "khoác trang cụ bằng vàng" (6 chỗ ở `ja`, 3 ở `tha-ap`) thay vì
      "mặc áo dệt bằng vàng" (không có "dệt").
    · `10.1–10.2` `catunnamapi dīpānaṁ issaraṁ yodha kāraye` = "Đối với cả bốn châu lục, ai ở đây
      có thể làm chúa tể"; "cầm quân đánh trận" là bịa hoàn toàn. Lỗi này cũng có ở `vv43:9.2`.
    · Hậu quả thêm: bỏ "bậc … kia" ở `7.2` (`cakkavattissa rājino` = "của vua Chuyển Luân",
      không có "kia"), và "cũng không đạt được" → "cũng không đáng giá" (`agghati` = đáng
      giá, theo `sn10.8:2.6`).
    · Khoá cũ giữ nguyên hoặc chỉ sửa nhẹ: `0.1–0.4`, `5.3` ("an vui"), `11.1`, `2.2`/`4.2`
      ("với tâm tịnh tín bằng chính đôi bàn tay mình", 16 chỗ trong tầng; chỉ đổi dấu `.` thành
      `;` cho khớp Pāli).
    · Khoá giữ nguyên: `0.1`, `0.3`, `0.4`, `3.1`, `8.3`, `11.1`, và tiêu đề `0.2` (xem bất định (6)).

  CHƯA PHÂN XỬ ĐƯỢC HẲN (ghi lại, không làm blocker):
    (1) `7.4` `anomadassikā`: có thể hiểu "vẻ ngoài không kém cỏi trong mắt chồng" hoặc "nhìn
      chồng bằng ánh mắt thiện" (bản nguyên bài ở mục Tra cứu toàn văn nghiêng về nghĩa "được chồng
      quý", chỉ để hiểu cách đọc, không chép câu chữ). Chọn cách bám Pāli, ít giả định.
    (2) `6.3` `parābhata` có thể là "do người khác mang đến" hoặc "nhận từ người khác"; chọn cách
      hẹp hơn, bám `para + ābhata`.
    (3) `nikkha` là một đơn vị vàng (xem `mn120:18.9`, `sn2.29:9.1` là `nikkhaṁ jambonadaṁ`);
      bản dịch giữ nguyên danh từ như tiền lệ `ja`, không quy đổi.
    (4) `Hemavata` và `Himavā` là cùng gốc; bản dịch dùng "Hy Mã Lạp" như `dn14:1.35.2`.
    (5) Người nói ở khối 6–10 không được Pāli nêu (khối mở ngoặc mới); không thêm danh tính.
    (6) Tiêu đề phẩm `Itthivimāna` = "Chuyện Cung Điện Nữ Hư Không" (`0.2`) là lỗi đã biết của cả
      bộ vv (không có `ākāsa` trong Pāli); lặp ở ~51 tệp nên KHÔNG sửa riêng ở đây để khỏi lệch
      bộ. Tương tự `0.3` `Phẩm Cây Hoa Cittalatā` ("Cây Hoa" không có trong Pāli) lặp ở 7 tệp.

  LỖI NƠI KHÁC (chỉ báo, không sửa): `vv43` có cùng các khoá sai `6.1`, `6.4`, `7.2`, `7.4`,
  `8.1–8.4`, `9.1–9.2` với bản cũ này; `tha-ap93:3.1–3.2` cùng Pāli với `10.1–10.2`; `tha-ap321:1.4`.

