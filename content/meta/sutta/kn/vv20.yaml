      ngữ cảnh `Yā te adāsi ācāmaṁ` / `Etassācāmadānassa` thì `ācāma` là thứ đem dâng,
      nên `món ăn dâng` giữ đúng chức năng ngữ cảnh mà không bịa thêm nghĩa gì. Đây là
      chỗ tôi đặt nghĩa, nên `ambiguity_integrity` bị trừ.
    · `parāgāra` → `nhà bên cạnh` (hapax: chỉ 2 chỗ, đều ở `vv20:1.4` và `3.4`).
    · `parābhata` → `bị tước đoạt` (0 chỗ ngoài `vv20:6.3`).
    · `dakkhiṇā` → `dầu quá` (0 chỗ ngoài `vv20:6.4`; các chỗ `dakkhiṇa` khác trong Pāli
      root đều là `padakkhiṇa` = hành động đi nhiễu, không liên quan).

  BẤT ĐỊNH:
    (1) `varākiya` ở `6.1` là HAPAX TOÀN PẢI ROOT — 0 chỗ, không có ở bản Pāli nào khác
      để đối chiếu, và không có tầng Anh đã ghim cho `vv` nên cũng không có Sujato. Tôi
      dịch `cao quý` vì ngữ cảnh ép nghĩa khen ngợi (`Aho dānaṁ … suppatiṭṭhitaṁ … kassape`
        trùng công thức `ud3.7:4.2`), và vì `cao quý` là cách dùng phổ biến (318 chỗ)
        hơn `tối thượng` (1.235 chỗ, nhưng `paramadāna` mới là `tối thượng`). Tôi KHÔNG
        bịa thêm chi tiết nào cho hapax này và ghi nó ở đây để người đọc phán xử; đây là
        lý do `semantic_fidelity` không lên 9.5.
    (2) `5.1` `Nimmānaratino nāma` — `Nimmānarati` có 8 chỗ trong Pāli root; 6 chỗ
      `Nimmānaratino devā` đã được tầng dịch thành `chư thiên Hóa Lạc` (`sn5.7:2.3`,
      `iti95:3.3`, `thig8.1:2.3` …). Ở đây Pāli là `Nimmānaratino nāma` + `santi devā
      mahiddhikā`, tức có thể đọc là (a) TÊN một cung điện, hoặc (b) tên một loại thiên
      rồi kể tiếp `santi devā`. Tôi chọn (a) vì bài này thuộc loại `vimānavatthu` (truyện
      cung điện) và vì `santi devā mahiddhikā` đã là một vế độc lập nói về các vị thiên
      đang cư ngụ nơi đó; nếu chọn (b) thì phải dịch `Nimmānaratino` thành `chư thiên
      Hóa Lạc` và câu 5 sẽ thành `Chư thiên Hóa Lạc tên là …, có những vị thiên đại oai
      lực` — vô nghĩa. Cách đọc (a) giữ được câu, nhưng đây là chỗ bất định thật, nên
      `ambiguity_integrity` bị trừ.
    (3) Bài này ở commit đã ghim không có `tassuddānaṁ` (phần tóm lược danh sách tên ở
      cuối phẩm) và cũng không có phần `(Anantaraṁ …)` như `vv54:10.1`. Tôi dịch đúng
      những gì Pāli có, không bịa phần vắng.

