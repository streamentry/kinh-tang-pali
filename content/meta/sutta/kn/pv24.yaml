notes: |-
  Đợt 19, làn 68. Dịch từ Pāli root commit đã ghim, đủ 91/91 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là kệ đối thoại: người kể (xưng "ta") đến cõi ngạ quỷ, thấy một nữ ngạ quỷ sống trong cung điện huy hoàng nhưng nửa đêm lại bị con chó cụt tai ăn thân thể (1–12); bà ấy kể nghiệp quả ngoại tình rồi thề dối (13–17), cảm tạ và mời ông ở lại (18–19); ông xin được đưa trở lại (20). Pāli ghim dùng ngoặc kép bao các lượt lời (`1.1`–`12.5`, `13.1`–`19.4`, `20.1`–`20.4`) và nháy đơn cho lời chồng (`14.3`–`14.4`) và lời thề (`15.3`–`16.4`); bản Việt khớp từng khoá. Không có `…pe…` lẫn `…` trần nên bản Việt cũng không có dấu lược nào.

  **Coverage English, đo thật.** Mẫu số: khoá Pāli có nội dung (từ 40 ký tự trở lên, bỏ khối `:0`) = 0/91, khoá dài nhất 32 ký tự. Cổng `englishCoverage.floor` của `source/layers.yaml` không đo được gì ở bài này, khác với "0% không đạt ngưỡng". `english-sujato` không có tệp (xem blocker), `english-project` không có, `vietnamese-current` không phủ. Mục `content/meta/reference-gaps.yaml` nếu có chỉ thừa nhận mất tầng và không cứu được `published`; tệp đó ngoài phạm vi lát này.

  **Tiêu đề.** `0.1` Petavatthu và `0.2` Ubbarivagga giữ nguyên chữ Pāli theo `pv23` và `pv22`. `0.3` `Kaṇṇamuṇḍapetivatthu` → "12. Chuyện Ngạ Quỷ Chó Cụt Tai", theo khuôn "Chuyện Ngạ Quỷ …" của 40 tiêu đề `pv` đã có. `21.1` dùng khuôn "…, thứ mười hai" như `pv23:8.1` ("thứ mười một"); `dvādasamaṁ` = 12.

  **Số Pāli, đã tự tính.** `pañca dāsisatā` (6.1) = 5 × `sata` 100 = **500** "năm trăm nữ tỳ". `satteva vassasatāni` (17.3) = 7 × 100 = **700** "bảy trăm năm" (cùng số với `pv23:4.1` `Satta tuvaṁ vassasatā`; `pv23:5.1` `Satteva vassāni` là bảy năm, không phải bảy trăm). `dvādasamaṁ` = thứ **12**. `caturo disā` (5.6) = bốn phía. Không có cụm số chưa phân xử được (không có `Tiṁsakappasahassa`).

  **Trùng nguyên văn với tầng (số đo lại 2026-10-13, thay số của lượt dò đầu).** Dò toàn tầng Việt (so Pāli sau khi bỏ chữ hoa và dấu câu, loại chính bài này, loại hai tiêu đề `0.1`–`0.2`): 23 khoá của bài có Pāli trùng khoá đã dịch ở bài khác. 10 khoá khớp nguyên văn (không kể dấu câu) với mọi bản trùng: `1.2` (`ja546:70.2`, `vv44:11.4`), `1.4` (`vv38`, `vv44`, `vv50`), `2.3` (`vv44`, `vv81`), `2.4` (`vv44`, `vv81`), `3.1` (`vv81:6.3`), `3.2` (`vv44`, `vv81`), `4.1` (`ja546`, `thag18.1`), `6.4` (`pv34:2.6`), `9.1` (`ja529:7.1`), `12.3` (15 khoá trùng, ở `pv6`, `pv7`, `pv13`, `pv15`, `pv16`, `pv19`, `pv22`, `pv31`, `pv33`, `pv34`, `pv35`, `pv43`–`pv45`, `pv51`; cả 15 cùng cách dịch). 13 khoá có ít nhất một bản trùng dịch khác, mỗi chỗ có lý do: `2.2` (`tha-ap407` 2 khoá "đủ loại hương thơm lan tỏa", `tha-ap401` "tỏa nhiều loại hương thơm"; giữ "được … lan tỏa" vì `sameritā` là phân từ bị động và để song song với `2.1` "Phủ kín bởi"); `5.5` (`pv27:23.1` giống hệt, `ja541` 2 khoá bỏ chủ ngữ "Chúng"; giữ "Chúng" theo `pv27`); `5.6` (4/6 khớp: `vv8` 2 khoá, `vv78`, `pv27`; `dn20:9.46` và `tha-ap5:11.4` dịch "bốn phương" ở ngữ cảnh khác); `6.2`, `6.3` (`ja511:29.2` "ngài", `pv34:2.4`–`2.5` "của ngài", "các nàng ấy"; ở đây người kể gọi bà ấy là "nàng" nên dùng "những người hầu hạ nàng" và "Họ" để không nhầm với bà ấy); `8.2` (`ja519:8.4`, `ja489:23.4`, `thi-ap27:52.4` "đầy đủ mọi điều ước muốn", giữ cụm đó, thêm chủ ngữ "nàng" vì `1.x` là `tvaṁ`; `vv29:3.2` "thành tựu đủ mọi điều mong muốn" là câu khác); `10.5` (`ne37:115.3` giống hệt; `vv6:1.3`, `vv8:1.3` "lội xuống", `vv7:1.3` "đi xuống", cùng nghĩa; giữ "xuống" theo `ne37`); `12.1`, `12.2` (16/17 và 15/16 khớp, chỉ `pv33` dịch khác; `12.1` không có nháy mở vì Pāli mở nháy từ `1.1`); `13.2` (`pv22`, `pv33` "là một cư sĩ có đức tin", `pv32` "cận tự"; bỏ "một" vì `13.1` đã có "một gia chủ" và gia chủ với cư sĩ là cùng một người; `upāsaka` → "cư sĩ" vẫn là dạng đa số); `13.3` (`thi-ap27:48.1` "Ta đã là vợ của ông ấy", chỉ khác đại từ; đã thêm "đã" ở lượt 2026-10-13); `15.1` (`pv6:8.1`, `pv7:10.1` bỏ `ca … ca`; giữ "cả … lẫn" vì `15.2` mở bằng `musāvādañca`); `17.2` (`pv6:9.2`, `pv7:11.2` khớp; `pv29:5.2` thêm "của" trước "cả hai"; `kamma` và `musāvāda` là hai sở hữu cách ngang hàng).
  Trong chính bài: 1 cặp Pāli trùng (`5.4` và `7.2` `sovaṇṇarūpiyāmayā;`), bản Việt giống hệt nhau ⇒ 0 cặp lệch. Pāli lặp công thức `aṅgamaṅgāni khādati` ở `10.2` và `17.6`, `kāyena uda cetasā` ở `15.4` và `16.2` (khác dấu câu), bản Việt giữ cùng cách dịch, chỉ đổi ngôi (nàng ↔ tôi) vì người nói đổi.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có). `upāsaka` → "cư sĩ": 45/49 khoá ngắn có từ này; "nam cư sĩ" 17; "cận tự" 3 (đã nêu). `gahapati` → "gia chủ": 14/28, "cư sĩ" 7; "gia chủ" là dạng đứng đầu. `pañjalikata` → "chắp tay": 5/5. `akutobhaya` → "không sợ hãi từ đâu": dạng "không sợ hãi từ đâu" ở `ja492:3.4` đúng cặp `asoko akutobhayo`, `pv14:18.2` đúng cặp `modāmi akutobhayā`; `asokā` → "không sầu muộn" theo `ja492:3.4`. `dukkaṭa` → "ác": 11/28 khoá có từ này. `sapatha` → "lời thề" (`pv6:8.1`, `pv7:10.1`). `sabbakāmasamiddhinī` → "đầy đủ mọi điều ước muốn" (3 khoá `pv`). `pañjalīkatā yācāmi` → "chắp tay cầu xin". `bahukāra` → "giúp ích rất nhiều" ("có ích lợi lớn lao" ở `iti16:3.3` cho `bahukāro`; ở đây là lời cảm tạ một người nên dùng "giúp ích"). `daddallamānā` → "chói lòa" (`pv28:5.1` "rực rỡ", `vv8` dịch lệch thành "hiện ra như những dãy thềm" nên không lấy). `cakkavāka` → "vịt trời" (`ja434`). `koñca` → "sếu" (`ja479`, `vv11` "hạc", `ja202` "diệc"; 3 dạng, chọn "sếu" theo `ja479`, bất định nhỏ). `haṁsa` → "ngỗng trời" (`ja202`). `sopānaphalaka` → "ván bậc thang" (`vv84:17.2` "những tấm ván bậc thang" cho `Pāsādasopānaphalūpapanno`, `pv37:17.2` "thang bậc và ván sàn"). `sogandhikā` → "hoa súng thơm" (0 tiền lệ ở khoá này, dịch theo cấu tạo `su-gandha`). `gonaka` → "thảm len lông dài" theo `tha-ap45:5.2` (`pv33:1.2` viết "da bò"; chỉ 3 khoá có từ, chọn dạng đúng cặp `sovaṇṇaṁ gonakatthataṁ`). `kadalimiga` → "da hươu kadali": 0 tiền lệ; `miga` là hươu, nai hoặc thú rừng nói chung; giữ chữ `kadali` nguyên, không đoán loài. `pallaṅka` → "giường" (xem Lượt cải thiện 2026-10-13).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `kaṇṇamuṇḍa` (`0.3`, `10.1`, `12.4`, `16.3`, `17.5`, `18.3`): không có tiền lệ nào trong kho (0 khoá). Bản Việt dịch theo cấu tạo `kaṇṇa` (tai) + `muṇḍa` (cụt, cạo, cắt) thành "chó cụt tai", dùng như một danh từ ở `18.3` nơi Pāli không có `sunakho`. Cách đọc khác: đó là tên riêng của con chó (Kaṇṇamuṇḍa). Không phân xử được bằng bằng chứng của tầng; nếu là tên riêng thì phải sửa năm khoá và tiêu đề.
  2. `deva` (`18.1`, `19.1`, `19.4`): vốn có nghĩa chung là "bậc đáng tôn", "vua", "chư thiên". Pāli không nói rõ người nghe là vua; dịch "tâu đại vương" theo `ja306`, `ja358` (cùng nghĩa xưng hô với vua). Nếu người nói là một vị thiên chứ không phải vua thì "đại vương" thành thêm nghĩa. Người kể không xưng danh trong Pāli.
  3. `3.1` `Surabhiṁ sampavāyanti`: chủ ngữ ẩn trong Pāli (các đoá sen ở `2.3`–`2.4`); bản Việt dùng "Chúng" để không chọn một danh từ nào.
  4. `aticārinī` (`13.4`), `aticaramānāya` (`14.1`), `aticarāsi` (`14.4`), `aticarāmi` (`15.3`, `16.1`): dịch "ngoại tình" cho danh từ ở `13.4`, và "phản bội" cho động từ ở bốn chỗ còn lại để giữ cả nghĩa "vượt khỏi giới hạn với người kia". Chỉ có tiền lệ `aticārā` → "làm quá đà" ở `vv`, mà `vv24` dịch cùng cụm là "tà hạnh", nên không lấy.
  5. `17.3`–`17.4` `Satteva vassasatāni, anubhūtaṁ yato hi me`: đọc "kể từ khi tôi đã chịu quả ấy là đúng bảy trăm năm"; `yato` có thể là "vì" hoặc "kể từ khi". Bản Việt giữ nghĩa thời gian vì khớp con số "bảy trăm năm".
  6. `Netaṁ channaṁ patirūpaṁ` (`14.3`): `channa` hiếm, hiểu là "thích hợp" (tương đương `patirūpa`); dịch hai chữ "phù hợp, xứng đáng" để giữ cả hai từ Pāli.
  7. Thì động từ ở `1`–`12`: Pāli xen hiện tại (`gacchasi`, `khādati`, `hoti`) với aorist (`ṭhāsi`, `āyāsi`); bản Việt không thêm chữ chỉ thì nào, nên đọc như cảnh lặp lại mỗi đêm cũng như cảnh đã xảy ra đều hợp.

  **Lượt review đối kháng, đã bắt trong bản nháp.** (1) `5.1`–`5.2` bản đầu tách "thứ như thế" khỏi "thành nào" nghe như hai ý, đã gộp lại thành "Trong loài người không có thành nào như thành này". (2) `14.1` bản đầu viết "phản bội như vậy" (thêm chữ "như vậy" không có trong Pāli), đã sửa thành "phản bội ông ấy". (3) `6.3` bản đầu dùng "Các nàng" theo `pv34`, đã đổi "Họ" vì trùng với đại từ "nàng" chỉ bà ngạ quỷ. (4) `12.1` bản đầu có nháy mở “ như ở `pv6:5.1`; Pāli `pv24:12.1` không có nháy mở (nháy đã mở từ `1.1`), đã bỏ để khớp từng khoá.

  **Tự kiểm của lát.** Tập khoá Việt = tập khoá Pāli (91 = 91); nháy đơn ‘’ và ngoặc kép “” khớp Pāli từng khoá (0 khoá lệch trên 91 khoá); không khoá rỗng; NFC; không khoảng trắng thừa; không Pāli lọt sang bản Việt ngoài tiêu đề `0.1`, `0.2` và tên riêng Kimilā. Phép đối chiếu Pāli trùng trong chính bài chạy trên 1 cặp (xem trên).

  `technical_integrity` chỉ 9,6 vì bị cấm chạy cổng: còn lại `npm run validate`, `npm test`, `npm run check`, `npm run build`. Trạng thái `draft` là do blocker `noEnglishEditionUpstream`, không phải do điểm.

  **Lượt cải thiện 2026-10-13.** Đọc đối kháng cả 91 khoá (cặp Pāli↔Việt), đo tiền lệ toàn tầng. Đổi 4 khoá, giữ nguyên tập khoá và mọi ID.
  1. `7.1` "chiếc ghế dài" → "chiếc giường" (accuracy/terminology). `pallaṅka` ở đây cùng công thức với `7.2`–`7.4`: `sovaṇṇarūpiyāmayā` + `kadalimiga-` + `gonaka-`. Tầng dịch đúng bộ này là "giường": `mn12:41.5`, `an3.35:3.3`, `an7.64:2.5`, `an5.44:7.3` (4/4 khoá có `gonaka-` và `kadalimiga-`), và `dn17` ("tám mươi bốn ngàn giường" vàng, bạc, có `gonakatthatāni`, `kadalimigapavarapaccattharaṇāni`; `sn22.96:4.4`, `pv31:8.4` cũng "giường"). "Ghế dài" ở tầng chỉ gặp khi `pallaṅka` đứng trong danh sách đồ ngồi (`dn1`, `dn2`, `tha-ap503`) hoặc không có bộ trải ấy. Ghi chú cũ "0 tiền lệ" sai, đã sửa. Giữ "da hươu kadali" ở `7.3` vì `dn17` dịch `kadalimigapavarapaccattharaṇa` là "tấm trải quý bằng da hươu kadalī".
  2. `6.1` "tỳ nữ" → "nữ tỳ" (terminology). `dāsī`/`dāsisata` ở tầng dịch "nữ tỳ" 15 khoá (`ja546` 4, `ja542` 2, `vv37`, `vv33`, `vv18`, `vv50`, `pv15`, `pv26`, `pv47`, `thi-ap28`, `thi-ap30`), "tớ gái" 7 khoá (`ja512`, `ja456`, `ja547`), "nữ nô" 2; "tỳ nữ" 0 khoá ngoài bài này. Số 500 giữ nguyên.
  3. `13.3` "Tôi là vợ" → "Tôi đã là vợ" (grammar). `āsiṁ` là quá khứ; không có chữ chỉ thì, câu của một ngạ quỷ đang chịu quả dễ đọc thành hiện tại. Khớp `thi-ap27:48.1`.
  4. `16.3` "thì xin để" → "thì hãy để" (modality). `khādatu` là mệnh lệnh ngôi ba ("hãy để nó ăn"); "xin" thêm sắc thái van cầu mà Pāli không có và người thề không van xin con chó.
  Điểm đổi: `semantic_fidelity` 8.8 → 8.9 (`7.1` sai nghĩa vật dụng; bỏ "xin" thêm vào), `grammar_logic` 8.8 → 8.9 (thì ở `13.3`, thức ở `16.3`), `terminology` 8.9 → 9.1 (`pallaṅka`, `dāsī` theo tiền lệ đã đo). Các tiêu chí khác giữ. `final_score` 8,92 → 8,96 (mean thô của mười điểm).
  Hiệu đính ghi chú của lượt trước (không đổi bản dịch): số khoá trùng là 23 (không phải 13) và 10 khoá khớp nguyên văn (không phải 5); `1.4` nay khớp `vv38`, `vv44`, `vv50` ("hương trong sạch, làm đẹp lòng"); `pv23:5.1` là bảy năm, số 700 cùng với `pv23:4.1`; `12.1`–`12.3` trùng ở 17, 16, 15 khoá, `pv34` cùng cách dịch ở `12.3`; `17.2` khớp `pv6`, `pv7`; `sopānaphalaka` có tiền lệ `vv84:17.2`; `daddallamānā` → "chói lòa, tỏa sáng" ở `ja541:90.1`, `ja541:143.3`, `pv27:23.1`; `vv6`, `vv7`, `vv8` nay dịch `pokkharaṇī` là "hồ sen" nên không còn lệch ở `10.5`. Trạng thái do công cụ chốt: blocker `noEnglishEditionUpstream` được miễn bằng waiver `no-upstream-english`, không phải bài bị `draft`.
  Bất định thêm: `kaṇṇamuṇḍā` còn một chỗ nữa trong root, `an7.66:6.3`, nằm giữa tên các hồ lớn (Anotatta, Sīhapapāta, Rathakāra, …, Kuṇāla, Chaddanta, Mandākinī) và là tên hồ. Đó là cùng chữ, khác vật; không đủ để phân xử chó "cụt tai" hay tên riêng, nên bất định số 1 giữ nguyên. Đã cân nhắc và không đổi: `deva` → "tâu đại vương" (24 khoá tầng dịch vậy, nhưng ở các bài ấy người nghe là vua rõ ràng; bài này không nói; bất định số 2 giữ); `14.1` "Khi tôi phản bội ông ấy" (`maṁ` có thể là "với tôi" của lời chồng; "ông ấy" là đối tượng ngầm của `aticarati`; không đổi nghĩa); `17.3`–`17.4` (cấu trúc `yato`, xem bất định số 5); `1.3` `sogandhiyā` (tầng: `snp3.10:8.8` "Sen Thơm" là tên địa ngục, `ja536:12.1` để nguyên chữ; giữ "hoa súng thơm" theo cấu tạo). Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` vẫn chưa chạy, nên `technical_integrity` giữ 9,6.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 4 vị trí bất đồng nghĩa → sửa 0, giữ 3, bất định 1. Giữ: 13.1 (bản nguyên bài viết Kimbilā, Pāli ghim là Kimilāyaṁ); 3.3–3.4 (haṁsa, koñca, cakkavāka: bản nguyên bài dịch thiên nga, cò, hồng hạc, bản dự án dịch ngỗng trời, sếu, vịt trời, khác loài chim cụ thể nhưng không đổi nghĩa cảnh trí); 7.1 (pallaṅka là giường theo tiền lệ dn17, mn12 cùng bộ đồ trải kadali và gonaka, bản nguyên bài dịch ghế dài). Bất định: 18.3 Sumuttāhaṁ kaṇṇamuṇḍassa, cùng tên bài ở 0.3 và 21.1: bản nguyên bài đọc Kaṇṇamuṇḍa là tên hồ (an7.66:6.3 có Kaṇṇamuṇḍā là tên hồ trong danh sách bảy hồ lớn), bản dự án đọc là con chó cụt tai vì kaṇṇamuṇḍo sunakho ở 10.1, 12.4, 16.3, 17.5 là con chó và khoá 18.3 bỏ danh từ; cả hai cách đọc hợp ngữ pháp, giữ theo bản dự án và ghi bất định. Các số (năm trăm nữ tỳ ở 6.1, bảy trăm năm ở 17.3) khớp bản nguyên bài. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
