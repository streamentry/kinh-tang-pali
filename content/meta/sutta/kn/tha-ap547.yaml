  SỐ PĀLI, TỰ TÍNH. (1) satasahassa = sata 100 x sahassa 1.000 = 100.000, dịch một trăm ngàn ở 1.3 (Ito satasahassamhi: cách đây một trăm ngàn kiếp, dùng lại nguyên văn tha-ap544:1.3), 11.1 (satasahassito kappe trong lời thọ ký về Đức Gotama: vào một trăm ngàn kiếp nữa, dùng lại nguyên văn tha-ap544:8.1 vì Pāli ở đây là tương lai) và 19.1 (Satasahasse kataṁ kammaṁ: nghiệp đã làm cách đây một trăm ngàn kiếp, dùng lại nguyên văn tha-ap544:16.1). (2) pañcamaṁ ở 24.1 = thứ năm. (3) Satāni pañcanūnāni ở 18.1: BẤT ĐỊNH, chưa phân xử được. Cấu tạo đọc được là pañca (5) + ūnāni (thiếu, kém) bám vào satāni (các trăm): hoặc chỉ gần năm trăm (nay chọn: Gần năm trăm vị), hoặc đúng năm trăm theo lối nói tròn số. Cụm này chỉ xuất hiện thêm ở thi-ap27:54.1 (Pāli trùng chữ, ngữ cảnh khác: năm trăm vị Độc Giác), toàn tầng Pāli chỉ hai chỗ, không có tầng Anh nào ghim cho tha-ap hay thi-ap để đối chiếu, nên không có chứng cứ độc lập. Không thêm giải thích vào thân kinh; cần biên tập phán. (4) tāvatiṁsa ở 13.4 là tên cõi trời, dịch cõi Ba Mươi Ba theo quy ước tầng (dùng lại nguyên văn 2 khoá tha-ap cùng Pāli tāvatiṁsūpago ahaṁ). Theo yêu cầu điều phối ghi bất định: giá trị tiṁsa = 30 là theo đo tầng (xem chứng cứ ở các bài tha-ap khác); ở đây tiṁsa chỉ nằm trong tên riêng nên không có phép tính số lượng nào để phân xử. Bài này không có cụm Tiṁsakappasahassa.

  NĂM PHÉP KIỂM, MỖI PHÉP IN MẪU SỐ. (1) Tập khoá: Việt 90 = Pāli 90, thừa 0, thiếu 0, thứ tự y hệt Pāli. (2) Nháy kép và nháy đơn khớp Pāli từng khoá: Pāli có 4 dấu (mở kép ở 1.1, mở đơn ở 10.3, đóng đơn ở 12.4, đóng kép ở 22.3), Việt đúng 4 dấu ở đúng 4 khoá; lệch 0/90 khoá. Nhịp nháy chạy qua khoá là cố ý của Pāli. (3) Pāli trùng nguyên văn TRONG CHÍNH bài: 1 nhóm duy nhất là …pe… (20.2, 21.2, 22.2), ba bản Việt giống nhau là một dấu lược; ngoài ra 0 nhóm trùng, nên phép này gần như chạy rỗng. (4) Dấu lược: Pāli có 3 khoá …pe…, Việt 3 khoá đúng một …, lệch 0; không có khoá (…) trần và không có khoá …  nào Pāli không có. (5) Số Pāli: xem mục trên. Phụ: NFC 90/90; khoá rỗng 0; khoảng trắng thừa 0; từ Pāli lọt sang Việt ngoài tên riêng 0 (chỉ còn Therāpadāna ở 0.1, Bhaddiya ở 0.2, Nandaka, Padumuttara, Okkāka, Gotama, Sāvatthī, Jeta).

  TIÊU ĐỀ. 0.3 = Ký Sự Về Trưởng Lão Nandaka và translationTitle BẰNG ĐÚNG giá trị đó. Số thứ tự: Pāli 0.3 là Nandakattheraapadāna, không bắt đầu bằng chữ số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số; bài không thuộc nhóm THỪA). Phe dịch apadāna ở phạm vi gần nhất (tha-ap540 đến tha-ap570, 9 tệp có tên dạng ttherassāpadānaṁ): Ký Sự Về 5, Ký sự về (chữ thường) 2, Tuyên Ngợ 2; toàn tầng tha-ap: Tuyên Ngợ 227, Tuyên Ngôn 119, Ký sự về chữ thường 69, Ký Sự Về chữ hoa 42. Hai phạm vi cho hai đa số khác nhau và Tuyên Ngợ là sai chính tả theo brief; theo phạm vi gần nhất và bài cùng phẩm tha-ap544 dùng Ký Sự Về. 0.1 giữ Therāpadāna (nguyên Pāli, 473 khoá của tầng). 0.2 Bhaddiyavagga dịch Phẩm Bhaddiya, khớp 1/1 tiền lệ tha-ap544 cùng phẩm. 24.1 dùng Ký Sự Về Trưởng Lão Nandaka, thứ năm (chữ hoa theo 0.3; trong colophon toàn tầng chữ thường nhỉnh hơn nhưng phạm vi gần nhất chữ hoa nhiều hơn); Pāli pañcamaṁ = thứ năm.

  LỜI KẾT 23.1: dùng nhóm số nhiều Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này, đo trong tầng tha-ap 481 khoá so với 2 khoá số ít (đã từng nói bài kệ này); Pāli imā gāthāyo là số nhiều.

  DÙNG LẠI NGUYÊN VĂN. Dò toàn tầng kn đã có: 40 khoá Pāli của bài này có Pāli trùng nguyên văn ở bài khác, tổng 4.689 cặp Pāli trùng đã dò; 4.102 cặp bản Việt trùng chữ với bản của bài này, 587 cặp khác (phần lớn khác ở ngôi kể ta/tôi hoặc là các biến thể diễn đạt). 39/40 khoá dùng lại nguyên văn một bản đã có (gồm 0.1, 0.2, 1.1, 1.2, 1.3, 1.4, 10.4, 11.1, 11.2, 11.3, 11.4, 12.1, 12.2, 12.4, 13.1, 13.2, 13.3, 13.4, 14.1, 14.3, 14.4, 15.2, 15.4, 16.2, 16.3, 18.4, 19.1, 19.2, 19.3, 19.4, 20.1, 20.2, 20.3, 21.1, 21.2, 21.3, 22.1, 22.2, 22.3); 1 khoá khác: 4.4 (patto sambodhimuttamaṁ, đa số tầng 5 khoá viết ta đã đạt giác ngộ tối thượng, nhưng ở đây chủ thể là Đức Chiến Thắng ở ngôi thứ ba nên bỏ chữ ta). Số cặp Pāli trùng trong chính bài mà Việt khác: 0. Ngôi kể: người kể xưng tôi suốt bài; 20.1 và 20.3 (đa số tầng viết ta: 99 và 100 khoá) theo nhóm tôi (18 và 15 khoá cùng chữ) và bài liền kề tha-ap544 để nhất quán trong bài. 11.1: 32/34 khoá cùng Pāli trong tầng dịch vào một trăm ngàn kiếp trước (dùng cho nghĩa quá khứ), chỉ 1 khoá dịch nữa (tha-ap544); ở bài này ngữ cảnh là lời thọ ký nên giữ nữa.

  BẤT ĐỊNH, KHÔNG BỊA, KHÔNG ĐƯA VÀO THÂN KINH. (1) 18.1 pañcanūnāni: xem mục số Pāli. (2) 2.2 đến 2.4: atthāya (vì phúc lợi), hitāya (vì lợi ích), sukhāya (vì an lạc) là ba từ gần nghĩa; dịch ba chữ khác nhau để khỏi lặp. paṭipanno sadevake dịch đã thực hành trong thế giới cùng chư thiên, nghĩa đen; sadevake là vị trí, atthāya là mục đích. (3) 3.1 đến 3.2 yasaggapatto sirimā: sirimā dịch đầy vinh quang; kittivaṇṇabhato dịch mang đầy tiếng tăm và lời tán dương (bharati là mang, kitti là danh tiếng, vaṇṇa là lời xưng tán); không có tiền lệ trực tiếp trong tầng. (4) 4.1 đến 4.2 vicikicchā dịch nghi hoặc (khớp 28 khoá tầng), kathaṅkathā dịch phân vân để không gộp hai từ thành một. (5) 7.3 đến 7.4 nimugge là tân ngữ cùng với pāṇine: dịch đang chìm trong đầm lầy dục, Ngài cứu vớt các chúng sinh; samuddharati là hiện tại. kāmapaṅka dịch đầm lầy dục theo 1 tiền lệ (Kāmapaṅko duraccayo). (6) 8.3 đến 8.4 vaṇṇayaṁ etadaggamhi: dịch khi tán thán vị ấy trong hạng tối thắng, bậc Đại Mâu-ni đã tuyên bố; chủ ngữ ngầm của vaṇṇayaṁ là Đức Phật. (7) 14.3 đến 14.4 iddhe phīte mahaddhane có thể bổ nghĩa kinh thành (pure) hoặc gia đình (seṭṭhikule); dùng lại nguyên văn tiền lệ cho cả hai khoá, không phân xử. (8) 15.1 đến 15.3 purappavese, vimhitamānaso, jetārāmapaṭiggāhe: dịch khi bậc Thiện Thệ vào thành, trông thấy Ngài với tâm tràn đầy kinh ngạc, vào dịp tiếp nhận tu viện Jeta; Jetārāma dịch tu viện Jeta (0 tiền lệ cho Jetārāma; ārāma là tu viện, Jeta là tên). (9) 16.3 đến 16.4 sāsito sabbadassinā: dịch được Đấng Thấy Khắp giáo huấn (sabbadassī đã dịch Đấng Thấy Khắp 2 khoá). (10) 17.1 đến 17.2 dhammakathaṁ paṭipucchākariṁ: dịch về bài pháp thoại cho các tỳ-kheo-ni, tôi đã đặt câu hỏi ngược lại; nghĩa kỹ thuật (vừa nêu câu hỏi vừa giảng) không rõ, không thêm. (11) 18.2 mahāhito dịch bậc đại lợi ích (0 tiền lệ). (12) 10.3 sukhī bhavassu dīghāvu dịch ngươi hãy được an lạc, trường thọ; dīghāvu là lối gọi người trường thọ (dīghāyu), 0 tiền lệ trực tiếp.

  SỬA BẢN NHÁP ĐÃ BẮT. (a) Bản nháp đầu viết chữ đầu dòng thường ở các vế thứ ba; sửa theo quy ước tầng (đo toàn tầng tha-ap: vế thứ ba viết hoa 2.126 khoá so với 1.275 viết thường; Pāli vế thứ ba của bài này đều viết hoa) trừ các vế 20.3 đến 22.3 theo Pāli. (b) Bản nháp đầu dùng thành phố cao quý Sāvatthī ở 14.3 và cõi trời Ba mươi ba ở 13.4; đổi sang dùng lại nguyên văn tiền lệ cùng Pāli (Tại kinh thành Sāvatthī tuyệt hảo, cõi Ba Mươi Ba). Không có lỗi cổng nào được bắt vì không được chạy cổng.

