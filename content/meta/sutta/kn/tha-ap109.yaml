notes: |-
  **Bốn mươi tám khoá của lát + một khoá có sẵn.** Lát giao 48 khoá; bài có 49 khoá Pāli.
  Khoá `tha-ap109:12.1` (`Itthaṁ sudaṁ …`) không thuộc lát này nhưng đã có sẵn trên đĩa,
  tôi **giữ nguyên byte** và không sửa. Tệp đích ghi đủ 49 khoá, đúng thứ tự Pāli. Hàm ghi
  của tôi nạp tệp cũ rồi hợp nhất, không xoá khoá nào.

  **`translationTitle` BẰNG ĐÚNG `:0.3`** — `Ký Sự Về Trưởng Lão Naḷamāliya`, không thêm số
  thứ tự, vì Pāli `:0.3` (`Naḷamāliyattheraapadāna`) **không** bắt đầu bằng số. Cả hai khoá
  này tôi đặt bằng tay và kiểm bằng script, không để coordinator sửa thay.

  **Vì sao chọn *Ký Sự* cho `:0.3` — đo ở cả hai phạm vi, nêu cả hai số.** Phạm vi gần nhất
  (9 bài cùng phẩm `tha-ap103–112` đã có `:0.3`): *Ký Sự* **3**, *Kinh Kệ Của Trưởng Lão*
  **3**, *Bài Kệ Tuyên Ngợ* **2**, *Bài Kệ Tuyên Ngôn* **1**. Toàn tầng `tha-ap` (418 tệp có
  cả Pāli lẫn Việt): *Bài Kệ Tuyên Ngợ* **214**, *Bài Kệ Tuyên Ngôn* **94**, *Ký Sự* **92**,
  *Bài Kệ Tuyên Ngợi* **10**, *Kinh Kệ Của Trưởng Lão* **9**. Tôi chọn *Ký Sự* vì nó thắng
  ở phạm vi gần nhất (3/9, đồng hạng cao nhất) và là dạng thứ hai lớn toàn tầng, **đồng thời
  không nhân bản hai dạng mà brief đã gọi là lỗi**: *Bài Kệ Tuyên Ngợ* là **sai chính tả**
  (đúng là *Tuyên Ngôn*), còn *Kinh Kệ Của Trưởng Lão* / *Truyện Kệ Của Trưởng Lão* là dạng
  agent trước sinh ra.

  **Một điểm người điều phối nên phán một lượt cho cả phẩm:** `tha-ap473` là `apadāna` thứ
  hai của **cùng thera Naḷamāliya** này, và `:0.3` của nó dùng *Bài Kệ Tuyên Ngợ Về Trưởng
  Lão Naḷamāliya*; lục kết `tha-ap473:9.1` cũng vậy. Nên có hai lựa chọn hợp lý cho `tha-ap109`
  — theo bản cùng thera (*Bài Kệ Tuyên Ngợ*) hoặc theo đa số phạm vi gần (*Ký Sự*). Tôi chọn
  *Ký Sự* vì không sinh thêm một lần sai chính tả đang ở 214 tệp. **Hai bản dùng chung tên
  riêng nên cần biên tập gộp, tôi không tự sửa tệp của lát khác.** Ngược lại `:12.1` của tôi
  **khớp byte-for-byte** với `tha-ap473:8.1` cùng công thức — đó là bằng chứng mạnh rằng lời-kết
  đang đúng và không phải sáng tạo mới.

  **Số thứ tự ở `:0.3`: PĀLI KHÔNG CÓ SỐ ⇒ BỎ.** Đo toàn tầng 428 tệp `tha-ap` hiện trên đĩa:
  **KEEP 0 · DROP 411 · THỪA 17** (17 tệp thừa số: 104, 113, 115, 117, 125, 130, 136, 137,
  143, 174, 185, 19, 212, 225, 443, 512, 54 — không phải tệp của lát này, tôi không đụng).
  Ba con số này khác brief ghi (KEEP 119 · DROP 255) vì đo trên trạng thái đĩa hiện tại, đã có
  nhiều lát ghi thêm; ở `tha-ap` không bài nào có `:0.3` bắt đầu bằng số nên KEEP = 0 là đúng
  và bài này rơi vào DROP. `:13.1` có `sattamaṁ` trong Pāli nên giữ *thứ bảy*; `:13.2`
  `Sattamabhāṇavāraṁ` thành *Phần tụng đọc thứ bảy* (đo `bhāṇavāra` toàn tầng: *Phần tụng đọc
  thứ N* **6**, *Lần thứ N* **2**, *Tụng phẩm thứ N* **1**).

  **Ba quy ước tầng đã đo, không sửa nhầm.** `(…)`: bài này **không có** khoá nào chứa `(…)`.
  `nevasaññānāsaññāyatana`: không xuất hiện. `….`: Pāli kết `….` ở **0** khoá (chỉ một `”.`
  ở `:11.3`), nên quy ước ` ….` không phát sinh ở đây.

  **NHỊP NHÁY: khớp PĀLI TỪNG KHOÁ, không tự cân.** Pāli mở `“` ở `:1.1` và đóng `”` ở
  `:11.3` — nháy kép **cố ý chạy qua 10 khoá**. Nháy đơn `‘…’` có hai cặp: `:4.1–4.4` và
  `:7.1–8.4`. Bốn loại dấu, mỗi loại 49 lần, **lệch 0**. Nếu tôi cân mỗi khoá riêng thì sẽ
  sai ngay ở `:1.4`, `:2.4` và `:6.4`.

  **SỐ PĀLI — tự tính và in phép, không tin bản dựa.** Đây là phần dễ sai nhất của bài, nên
  ghi lại từng phép:

  - `Kappasatasahassa` (`:9.3`) = `kappa` 100 × `sata` 100 × `sahassa` 1000 =
    **10.000.000** ⇒ *mười triệu*. Công thức trùng khớp từng vế với `tha-ap108:4.3–4.4`
    (`Kappasatasahassampi, duggatiṁ nupapajjati`), tức tôi dịch đúng một vế kệ đã dùng.
  - `Tiṁsakappasahassa` (`:10.1`) = `tiṁsa` 3 × `kappa` 100 × `sahassa` 1000 =
    **300.000** ⇒ *ba trăm nghìn*.
  - `aṭṭhatiṁsa` (`:10.2`) = `aṭṭha` 8 + `tiṁsa` 30 = **38** ⇒ *ba mươi tám*.
  - `Ekūnatiṁsasahassa` (`:10.3`) = `ekūna` trừ-một bám số liền kề `tiṁsa` 30 ⇒ 29,
    × `sahassa` 1000 = **29.000** ⇒ *hai mươi chín nghìn*.
  - `aṭṭha` (`:10.4`) = **8** ⇒ *tám*.

  **Ba chỗ tôi CỐ Ý lệch tầng đã có, và lý do.**

  1. `:10.1` — bốn khoá cùng công thức trong tầng đang viết *Vào ba mươi ngàn kiếp trước
     đây* (`tha-ap47:4.1`, `tha-ap450:8.1`), *Trong ba mươi ngàn đại kiếp* (`tha-ap115:10.3`),
     *Trong suốt ba nghìn kiếp* (`tha-ap151:3.1`). Cả bốn đều ở **ngữ cảnh đếm kiếp**
     (`kappe`, `duggatiṁ nupapajjahaṁ`). `:10.1` của bài này không có `ki`/`kappe` nào, và vế
     kế tiếp `subbatā aṭṭhatiṁsa te` (“trong đó có ba mươi tám … trắng”) chỉ có nghĩa khi
     đang **đếm quả trứng**. Song song trực tiếp là `tha-ap187:5.1–5.2`
     (`Cattālīsamhi sahasse, kappānaṁ aṭṭhatiṁsa te`) — cùng cấu trúc, cùng `aṭṭhatiṁsa`,
     cũng đếm trứng. Phép tính ra 300.000 nên tôi dịch *Từ ba trăm nghìn ấy*. **Tôi không thêm
     chữ “kiếp” vì Pāli không có.**
  2. `:9.3` — `tha-ap108:4.3` dịch *Dù trong trăm nghìn kiếp*, tức bỏ mất một thừa số 100
     (`sata`). Phép tính của tôi ra 10.000.000, nên tôi dịch *mười triệu*. Đây là điểm cần
     biên tập phán: cùng một vế kệ, hai tệp trong **cùng phẩm**, hai cách đếm.
  3. `:3.4` `imaṁ gāthaṁ abhāsatha` — năm khoá cùng công thức trong tầng đang viết *bậc Đạo Sư
     **đã** nói lên bài kệ này:* (4 khoá, gồm `tha-ap108:3.4`, `tha-ap129:5.4`). `abhāsatha`
     là **mệnh lệnh** (thứ hai số nhiều, nói với các vị trời ở `:5.1–5.4`), không phải thì
     quá khứ, và không có chủ thể *bậc Đạo Sư*. Tôi dịch *xin hãy nói lên bài kệ này.* —
     đây là **sai sót đã nhân bản ở 5 tệp**, tôi báo ở đây chứ không sửa tệp của lát khác.

  **Bốn khoá trùng nguyên văn đã dùng lại đúng y vụng dụng (không dịch lại từ đầu).**
  Quét 563 bài `tha-ap`: **24/49** khoá của bài này có Pāli trùng byte với bài khác, tổng
  **2.732** cặp, **1.928** cặp có bản Việt để so ⇒ **1.820 khớp, 108 khác**. Đã dùng lại:
  `Paṭisambhidā catasso` → *Bốn vô ngái giải* (**422/422** khớp); `…pe…` → `…` (**563/563**);
  `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”* (**392 khớp**; 29 lệch
  chỉ vì 22 tệp thêm *tôi* và 3 tệp viết hoa *Đã*, tôi theo đa số); `Therāpadāna` (**413**);
  `Phẩm Bhikkhadāyi` (**8/9**); `Mama saṅkappamaññāya` (**9**); `Tena kammāvasesena` →
  *Nhờ phần dư của công đức ấy* (**1**, khớp byte `tha-ap59:5.1`); `sukkamūlena codito` →
  *được khích lệ bởi cội nguồn thiện căn* (**5** khớp / 6 khác); `imā gāthā abhāsatha` →
  *đã nói những bài kệ này* (**6/6**). **Trong chính bài này không có cặp Pāli trùng byte nào**
  (`:7.1` khác `:9.1` vì có/không nháy `‘`), nên không có mâu thuẫn nội bộ.

  **Thuật ngữ, kèm số đếm.** `Therāpadāna` giữ nguyên Pāli (**409/418** giữ nguyên).
  `:0.2` → *Phẩm Bhikkhadāyi* theo **8/9** bài cùng phẩm, khớp cả với `tha-ap112:8.1`
  (*Phẩm Bhikkhadāyi là phẩm thứ mười một*). `Paṭisambhidā` → *vô ngại giải* (**422**).
  `bhāṇavāra` → *Phần tụng đọc thứ N* (**6**). `nāma nāmena` → *tên là* (**12/14**).
  `devasaṅghapurakkhato` → *được … vây quanh*, theo **17** khoá `…saṅghapurakkha…` đã có.
  `lokanāyako` → *đấng Lãnh Đạo Thế Gian* (khớp `tha-ap473:1.4`). `Paṭiggahetvā sambuddho` →
  *Sau khi tiếp nhận* (tiền lệ ở `tha-ap288`, `tha-ap372`, `thi-ap12`). `lokanāyako`,
  `pariḷāho na vijjati`, `Tiṇatthare`, `vananissitā`, `Sossāma`, `sammānavipulena`,
  `subbatā aṭṭhatiṁsa te`, `Ekūnatiṁsasahasse`, `aṭṭha mālutanāmakā`, `Sattamabhāṇavāraṁ`
  là **hapax** trong toàn bộ 6.904 bài Pāli đã ghim ⇒ dịch từ Pāli, không có tiền lệ đối chiếu.

  **Bốn bất định, ghi thẳng vào notes thay vì bịa.**

  1. `sammānavipulena` (`:9.2`) — **hapax toàn Pāli root**. Tôi đọc là `sammāna` (chân
     chính) + `vipula` (rộng lớn) ⇒ *và vì sự chân chính rộng lớn*. Chưa loại trừ được rằng đây
     là biến thể chép của một từ khác; tôi **không** bịa thay thế nào. Người đọc cần coi đây là
     bản dịch có thể phải phán lại khi có chú giải.
  2. `Naḷamāla` (`:2.1`) — ba bài khác (`tha-ap473:2.1`, `thi-ap16:2.3`, `thi-ap5:2.3`) dịch
     *một chùm hoa sen*, và ở hai bài `thi-ap` đó kèm theo `naḷamālapūjayiṁ` (“dâng vòng
     hoa sen”) nên nghĩa *vòng hoa sen* là đúng bối cảnh. Ở bài này vế kế `bandhitvā bījaniṁ`
     (“bọc những hạt giống lại”) buộc `Naḷamāla` là **quả trứng có tên**, không phải vòng
     hoa. Tôi giữ **tên riêng không dịch** (*Cầm lấy Naḷamāla*) để không thêm chữ nào, và
     đánh dấu đây là chỗ lệch tiền lệ có chủ ý.
  3. `sukkamūlena` (`:8.2`) — `sukka` là *trắng* hay *thiện*? Tầng đang đứng 10 / 5 theo
     *cội nguồn thiện căn* (7) và *cội rễ trắng* (3). Tôi theo đa số. Nhưng ngữ cảnh có
     `subbatā` (“trắng”) và nhân vật tên **Subbato**, nên cách đọc *trắng* cũng có lý;
     đây là chỗ nên phán một lượt cho cả `tha-ap`.
  4. Danh từ bị lược ở `:10.1–10.2` — Pāli đếm cái gì thì không nói (chỉ `:2.2` có `bījani`).
     Tôi **không** thêm “quả trứng” vào `:10.1` (chỉ “ấy”), nhưng ở `:10.2` dịch `subbatā`
     thành *quả trắng* vì `subbata` là danh từ chỉ vật, không chỉ người. Nếu biên tập muốn
     thống nhất thì đây là chỗ cần nói rõ.

  **Coverage English: mẫu số = 1, không phải 0.** Đo theo đúng công thức kho
  (`source/layers.yaml`: `substantivePaliMinChars: 40`, `excludeReferenceBlock: true`): bài có
  49 khoá, bỏ 3 khoá block `:0`, và **chỉ đúng 1 khoá** đạt ≥ 40 ký tự — `tha-ap109:12.1`.
  ⇒ **0/1 = 0%**, Sujato phủ **0 tệp** trong 563 bài `tha-ap`. Độ dài Pāli dài nhất 62 ký tự,
  trung vị 21 — mỗi vế kệ chỉ 18–26 ký tự, nên **ngưỡng 40 ký tự của `_hvi.py` và của chính
  cổng coverage không đo được gì ở phẩm này**. Tôi không coi đó là “không cần ghi nhận”.

  **Vì sao `draft`, không phải `published`** — hai lý do, đều đo được, không phải do chất
  lượng câu dịch, và điểm cao không cứu được blocker:

  1. *Không có tầng tham khảo đã ghim.* `source/upstream-manifest.json` (tầng
     `english-sujato`, 4.291 tệp) chỉ có **một** đường dẫn `tha-ap` là tệp **tên**
     `name/sutta/tha-ap-name_…`, **không phải thân kinh**; thư mục `kn` của tầng ấy chỉ có
     755 tệp thuộc 9 sub-collection (cp, dhp, iti, ja, kp, snp, thag, thig, ud). Đây là
     `not-published-upstream`, **không** phải `not-synced`. `vietnamese-current` ở commit này có
     đúng 26 tệp, toàn bộ là Pháp Cú. Lớp lấp `english-project` không có entry cho
     `tha-ap109`. `scripts/validate.ts` coi tệp Anh đã ghim thiếu là **error** khi status là
     `review` hoặc `published`.
  2. *Gap tham khảo chưa được ghi.* Cần `npm run reference:gaps` để cập nhật
     `content/meta/reference-gaps.yaml`; lát này bị cấm sửa tệp đó.

  **Vì sao `triangulation` = 7.5 và không cao hơn.** Ba tầng tham khảo đều vắng ⇒ bài chỉ dịch
  được từ Pāli root, **không** có một lượt đọc Anh độc lập nào để đối chiếu. Tôi hạ xuống
  7.5 (≤ 8.0) đúng như các scorecard cùng loại trong `content/meta/assessments/kn/` (vv7,
  mil5.4.8, tha-ap318, tha-ap292), thay vì giữ 8.8 như ghi chú cũ của chính tệp này. Đây là
  **đặc điểm của bản chụp upstream** đã đo được, không phải thiếu sót của bản dịch.

  **Năm phép tự viết — `_hvi.py` ở đây sẽ chạy rỗng** (nó lọc `len(p[k]) >= 40`, mà 48/49 khoá
  của bài này ngắn hơn), nên tôi tự quét **mọi** khoá và in mẫu số:

  1. *Tập khoá* — mẫu số 49: thiếu **0**, orphan **0**, thứ tự trong tệp đúng như Pāli.
  2. *Nháy kép và nháy đơn khớp Pāli từng khoá* — mẫu số 49; `“=49 ”=49 ‘=49 ’=49`;
     lệch **0**. (Chốt `_hvi.py` chỉ đếm ngoặc kép, không đếm nháy đơn.)
  3. *Dấu lược* — mẫu số 1 khoá có `…pe…` (`:11.2`) → Việt đúng một `…`, sai **0**; `…` trần:
     **0** khoá.
  4. *Pāli trùng byte ⇒ Việt phải trùng* — 24/49 khoá có bản trùng; 2.732 cặp dò, 1.928 cặp
     so được, 1.820 khớp / 108 khác (đã đọc và phân loại ở trên).
  5. *NFC và dấu cuối* — mẫu số 49: không-NFC **0**; Pāli kết dấu chấm/nháy mà Việt không có:
     **0**; khoá rỗng **0**; tệp kết bằng newline. Cả 49 khoá đều **bỏ** khoảng trắng thừa
     cuối mà Pāli có — đo toàn tầng: Pāli kết khoảng trắng 11.849 khoá, Việt giữ **188** /
     bỏ **11.661**, tức bỏ là chuẩn (98.4%), không phải lỗi.

