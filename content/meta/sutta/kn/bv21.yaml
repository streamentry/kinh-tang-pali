notes: |-
  Đợt 19, làn 98. Dịch từ Pāli root commit đã ghim, đủ 158/158 khoá (tệp trước đó chỉ có khoá `38.1`, lời kết; khoá này được kiểm lại và giữ nguyên chữ), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ mười chín của Buddhavaṃsa, về Đức Phật Vipassī: ba lần chứng ngộ và ba kỳ hội chúng, tiền thân vua rồng Atula dâng ghế vàng và được thọ ký (lời thọ ký kéo dài từ `13.3` đến `22.3`, nói về đời Đức Gotama), gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các phẩm anh em (24/24 tiền lệ).
  - `0.2` “21. Dòng Kế Thừa Của Đức Phật Vipassī”: `vipassībuddhavaṁsa`; số “21.” là số ghi trong tiêu đề Pāli, còn thứ tự phẩm là thứ mười chín (xem `38.1`). Phương án khác: “Phần Về Đức Phật Vipassī”.
  - `38.1` “Dòng kế thừa của Đức Thế Tôn Vipassī là thứ mười chín.”: `ekūnavīsatimo` = 20 trừ 1 = 19; khớp thứ tự phẩm (`bv22:29.1` thứ hai mươi, `bv19:29.1` thứ mười bảy).

  **Số Pāli, đã tự tính.** `tayo` 3 (7.1 ba kỳ hội chúng khớp ba con số ở `8.1`, `8.3`, `9.1`; ba lần chứng ngộ khớp ba khoá `3.4`, `4.4`, `6.4` = thứ nhất, thứ hai, thứ ba; 25.4 ba lâu đài khớp ba tên ở 25.3). `caturāsītisahassa` = 4 + 80 = 84, rồi × 1.000 = **84.000** (4.3 và 5.1; khớp “84.000 người” ở `dn14:2.16.1`, `dn14:3.17.1`). `aṭṭhasaṭṭhisatasahassa` = (8 + 60) × 100 × 1.000 = 68 × 100.000 = **6.800.000 (sáu triệu tám trăm ngàn)** (8.1; khớp “6.800.000 vị tỳ-kheo” ở `dn14:1.10.1`). `bhikkhusatasahassa` = 100 × 1.000 = **100.000** (8.3; khớp `dn14:1.10.1`). `asītibhikkhusahassa` = 80 × 1.000 = **80.000** (9.1; khớp `dn14:1.10.1`). `ekanavutito kappe` = 1 + 90 = **91 kiếp** (13.3). `dasapāramī` 10 (23.4). `aṭṭhavassasahassa` = 8 × 1.000 = **8.000 năm** (25.1). `ticattārīsasahassa` = 3 + 40 = 43, rồi × 1.000 = **43.000** người nữ (26.1; cùng cách với `bv11:20.1`, `bv12:21.1`, `bv17:15.1`, 3/3). `caturo` 4 (27.1 bốn dấu hiệu). `anūnaaṭṭhamāsa` = không thiếu + 8 = **đủ tám tháng** (27.3; khớp `bv24:18.3`). `asītihattha` 80 hattha (32.1; khớp `bv3:27.1`, `bv15:23.3`). `sattayojana` **7** do-tuần (32.4 hào quang; 37.4 bảo tháp). `asītivassasahassa` = 80 × 1.000 = **80.000 năm** (33.1; khớp “80.000 năm” ở `dn14:1.7.1`). `vassasata` **100 năm** (21.5, tuổi thọ Đức Gotama trong lời thọ ký). Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt hiện có (draft và published; so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 88 khoá của bài có Pāli trùng với khoá bài khác, tổng 2.019 cặp (1.049 cặp thuộc `22.2` `…pe…`, trong đó 6 cặp khác chỉ ở dấu cách hoặc dấu nháy), trong đó 279 cặp có Việt khác bản tôi viết (122 ở `13.3`, cố ý). Riêng phạm vi `bv` (phẩm anh em gần nhất): 723 cặp, 33 cặp khác. 51 khoá dùng đúng nguyên văn một tiền lệ (`0.1`, `1.4`, `2.3`, `3.3`, `3.4`, `4.1`, `6.4`, `7.1`, `7.3`, `7.4`, `8.3`, `9.1`, `10.2`, `10.3`, `13.1`, `13.2`, `14.1`, `17.4`, `18.1`, `18.2`, `18.4`, `19.1`, `19.2`, `19.5`, `19.6`, `20.3`, `20.4`, `21.3`, `22.3`, `23.3`, `23.4`, `25.1`, `25.2`, `25.4`, `26.1`, `27.1`–`27.3`, `28.1`, `28.3`, `28.4`, `29.2`, `30.2`, `31.2`, `31.4`, `33.2`, `33.3`, `35.3`, `35.4`, `36.3`, `36.4`).
  - `13.3` **cố ý khác** 122/122 tiền lệ. Tiền lệ đều là người kể nhìn ngược về quá khứ (“Vào chín mươi mốt kiếp trước”, 41; “Từ chín mươi mốt kiếp trước”, 38; “… trước đây”, 17; “… đại kiếp trước”, 10; và các dạng còn lại). Ở `13.3`–`13.4` là lời thọ ký tương lai (`ayaṁ buddho bhavissati`), nên hướng đếm đảo lại: 91 kiếp **sau** thời Vipassī là thời Gotama. Viết “Sau chín mươi mốt kiếp nữa,” cùng dạng với `bv19:13.3`, `bv20:9.3`, `bv16:11.3`, `bv22:12.3`. Pāli ở `13.3` không có chữ chỉ hướng; hướng lấy từ động từ ở `13.4`.
  - `7.2`, `24.4`, `29.4` (`vipassissa mahesino`, 14 cặp mỗi khoá, 14 khác): tiền lệ dùng “Đức Vipassī, bậc Đại Ẩn Sĩ” (3), “của Đức Đại Ẩn Sĩ Vipassī” (1), “của Đức Vipassī bậc Đại Ẩn Sĩ” (1) và các dạng khác; viết “Vipassī, bậc Đại Ẩn Sĩ” không “Đức”, như phẩm anh em (`bv19:16.4` “của Tissa, bậc Đại Ẩn Sĩ.”, `bv22:15.4`, `bv6:7.2` “nơi Sumedha, bậc Đại Ẩn Sĩ;”). `7.2` kết `;` và đứng sau `7.1` nên viết “nơi”; `24.4`, `29.4` kết `.` nên viết “của”.
  - `12.2`, `28.2`, `32.2` (`vipassī lokanāyako` / `vipassiṁ lokanāyakaṁ`; 4 + 6 + 6 cặp, đều khác): tiền lệ viết “Đức Phật Vipassī, bậc Dẫn Đạo Thế Gian” (3), “Đức Vipassī, bậc Dẫn Lộ Thế Gian” (2), “bậc Dẫn Dắt Thế Gian”, “Đạo Sư Thế Gian”; chọn “Vipassī, bậc Dẫn Đạo thế gian” theo `bv18:17.2` và `bv6:18.2` (“bậc Dẫn Đạo thế gian”: `lokanāyaka` có 179 khoá, “Dẫn Đạo” thế gian 126, “Đạo sư” 12, “Dẫn Dắt” 8, “Dẫn Lộ” 7).
  - `21.6` (`gotamassa yasassino.`, 13 cặp, 10 khác): “của Đức Gotama lẫy lừng danh thơm.” giống 3 tiền lệ có “của”; 6 tiền lệ không có “của” vì câu trước khác (`vv`). `21.5` không dịch riêng `tassa`, vì `tassa gotamassa` cùng chỉ một người và đã nằm trong “của Đức Gotama”.
  - `23.1` (`Tassāhaṁ vacanaṁ sutvā`, 20 cặp, 17 khác): chọn “Nghe lời ấy của vị ấy,” theo `bv22:14.1`, `bv23:17.1`, `cp26:9.1` (3 cặp giống); các tiền lệ khác (“của người ấy” 10) là cùng Pāli nhưng người được nghe không phải một Đức Phật; ở đây “vị ấy” là Đức Phật Vipassī (`bv22` cùng cách).
  - `19.4`, `20.2` (`aggā hessanti sāvakā/sāvikā`): tiền lệ `tha-ap491:4.2`, `tha-ap491:5.2` viết “hai vị đệ tử thượng thủ”, “hai vị nữ đệ tử thượng thủ” (1 cặp mỗi khoá, 1 khác). Pāli không có chữ “hai”, chỉ có số nhiều; viết “các đệ tử thượng thủ”, “các nữ đệ tử thượng thủ” theo 21/21 tiền lệ `ahesuṁ aggasāvakā` của tầng, để không thêm số đếm ngoài Pāli. Hai tên được kể ở `19.3` và `20.1` nên số hai vẫn rõ qua tên.
  - `20.6` (`assatthoti pavuccati.`) khác tiền lệ `tha-ap491:6.4` chỉ ở nháy đóng ’ (khoá ấy là hết lời thọ ký; ở đây Pāli không có ’, nháy đóng ở `22.3`). `22.1` (`Idaṁ sutvāna vacanaṁ,`) khác `tha-ap491:7.1` chỉ ở dấu phẩy cuối theo Pāli. `14.4` (`katvā dukkarakārikaṁ.`) khác `tha-ap491:3.2` chỉ ở dấu cuối (Pāli ở đây `.`). `18.3` (`Pitā suddhodano nāma,`) khác `tha-ap491:2.3` chỉ ở chữ hoa đầu khoá. `14.3` (`Padhānaṁ padahitvāna,`) 20 cặp, 1 khác.
  - `10.1` (`Ahaṁ tena samayena,`) 23 cặp, 4 khác (“Vào lúc ấy tôi,” 2, “Vào lúc ấy, ta” 1, “Vào thời ấy, ta” 1): chọn “Vào lúc ấy, ta,” vì người kể là Đức Phật Gotama, như các phẩm cùng loạt.
  - Trùng trong chính bài: 5 nhóm Pāli trùng, tổng 7 cặp. `19.1`/`20.3` và `19.2`/`20.4` (`anāsavā vītarāgā`, `santacittā samāhitā`): Việt giống hệt, 2 cặp, 0 khác. `20.5`/`30.3` (`bodhi tassa bhagavato`): Việt giống hệt, 1 cặp. `28.2`/`32.2` (`vipassī lokanāyako`): Việt giống hệt, 1 cặp. `7.2`/`24.4`/`29.4` (`vipassissa mahesino`): 3 cặp, trong đó 2 cặp khác (`7.2` khác `24.4` và `29.4` ở “nơi”/“của” và dấu cuối theo Pāli từng khoá), `24.4` và `29.4` giống hệt.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có, trừ chính bài này; số khoá chứa chữ Pāli đó).
  - `sambuddha` → “bậc Chánh Đẳng Giác” (225 trên 342 khoá; “Toàn Giác” 49). `mahesi` → “Đại Ẩn Sĩ” (143 trên 202; “Đại Tiên” 8, “Đại Hiền” 6). `lokajeṭṭha` → “bậc Trưởng Thượng thế gian” (68 trên 98; “tối thượng thế gian” 17). `dhammarāja` → “bậc Pháp Vương” (22 trên 71; “Vua Pháp” 12). `mahāvīra` → “Đại Anh Hùng” (theo `bv19`, `bv22`). `khattiya` → “Sát-đế-lợi” (173 trên 198). `nāyaka` → “bậc Dẫn Đạo” (46 trên 51).
  - `bandhana` → “trói buộc” (163 trên 367; “ràng buộc” 19). `puñña` → “phước” (510 trên 660; “công đức” 125, “phúc” 10): dịch `puññavanto` là “có phước đức”, `puññavara` là “phước đức tối thượng”. `padakkhiṇaṁ katvā` → “đi nhiễu bên phải” (“bên phải” 112, “nhiễu” 99 trên 154 khoá; “đi vòng” 21). `amataṁ padaṁ` → “cảnh giới bất tử” (16 trên 23 khoá; “con đường bất tử” 3, “đạo lộ bất tử” 2). `maggāmagga` → “đường và không phải đường” (theo `dn13:8.0`, `mn98:11.32`; 12 khoá chứa chữ này: dạng “đường và không/chẳng phải đường” 7, “con đường và …” 5). `pāyāsa` → “cháo sữa” (dò được 7 khoá khớp, trong đó 3 khoá là `upāyāsa` không liên quan; còn 4 khoá thật, “cháo sữa” 2, “cháo” 2). `atirocati` → “chói sáng vượt trội” (`sn8.11:1.2`, `sn8.11:1.5`; 21 khoá chứa chữ này, “vượt trội” 14).
  - `abhisamaya` → “chứng ngộ”, `sannipāta` → “kỳ hội chúng”, `samāgama` → “cuộc tụ hội”, `khīṇāsava` → “đã đoạn tận lậu hoặc”, `vimala` → “không cấu uế”, `santacitta` → “tâm an tịnh”, `tādī` → “bất động như vậy”: dùng lại nguyên văn các phẩm anh em. `gaṇanāya na vattabbo` → “Không thể nói bằng cách đếm” (4/4). `jina` → “bậc Chiến Thắng”. `pāramī` → “ba-la-mật”; `dasapāramipūriyā` → “để hoàn thành mười ba-la-mật” (19/19; giữ “mười ba-la-mật”, theo tiền lệ).
  - `maṇi` → “ngọc”, `muttā` → “ngọc trai”, `ratana` → “báu vật” ở `12.3`; `suvaṇṇapīṭha` → “ghế vàng” (không tiền lệ). `jutindhara` → “mang ánh sáng rực rỡ” (8 khoá: “mang ánh sáng” 2, “rạng rỡ quang minh” 2; chọn dạng tách `juti` “ánh sáng rực rỡ” + `dhara` “mang”). `dibbaturiya` → “nhạc cụ cõi trời” (`bv6:16.3` “nhạc cụ cõi trời của loài rồng”). `lakkhaṇa` → “tướng” (`bv22:23.4`). `kusumita` → “nở hoa” (cùng hình ảnh `bv19:8.4` `pupphita`).
  - `bodhi` → “Cây Bồ-đề”; cây `assattha` giữ chữ Pāli viết thường theo `bv27:20.1`, `tha-ap491:6.4`; cây `pāṭali` viết thường theo `dn14:1.8.1` “cây pāṭali” (`bv` thường viết hoa tên cây, nhưng cùng Đức Phật Vipassī, `dn14` đã dịch “cây pāṭali”, nên theo `dn14`).
  - Tên riêng (đếm số khoá chứa chữ viết, trừ chính bài này): `Vipassī` (dn14 và các phẩm anh em), `Bandhumatī` 57, `Bandhumā` 28, `Khaṇḍa` 27, `Tissa` nhiều, `Asoka` 14, `Atula` 2, `Kolita` 8, `Nandamātā` 6, `Uttarā` 18, `Candā` 10, `Sunanda` 6, `Nanda` 288, `Sirimā` 15, `Nerañjarā` 24, `Ajapāla` 10, `Sudassanā` 2. Chưa có tiền lệ trong tầng: `Candamittā`, `Punabbasumitta`, `Samavattakkhandha`, `Sumittārāma`, `Hatthāḷavaka` (chỉ `bv27:19.1`); giữ dạng Pāli có dấu. `Nāga` ở `31.1` là tên một vị thị giả (Punabbasumitta và Nāga), không phải danh từ “rồng”. `Sirimā` ở `25.3` là tên một lâu đài và ở `31.3` là tên một nữ thị giả, cùng chữ viết. `Samavattakkhandha` giữ đúng chữ Pāli của tầng ghim (hai chữ `t`), khác `samavaṭṭakkhandha` (tính từ “thân mình tròn đều”) ở `dn14:1.32.26`, `dn30:2.4.6`; ở đây là tên người con (`nāma atrajo`).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `14.1` `ahu kapilavhayā rammā`: `ahu` là quá khứ (`hoti`), nhưng cả đoạn `13.3`–`22.3` là lời thọ ký tương lai (`bhavissati`, `upehiti`, `bujjhissati`, `hessati`). Giữ nguyên văn tiền lệ “Đã có nơi xinh đẹp mang tên Kapila,” (4/4: `bv22:13.1`, `bv23:16.1`, `bv24:11.1`, `bv25:13.1`; ở các khoá ấy dòng kế là `…`). Nhưng ở đây dòng kế `14.2` có `nikkhamitvā tathāgato`, nên cách đọc khác khả dĩ là `kapilavhayā rammā` là cách xuất xứ (“từ Kapila xinh đẹp”, Đức Như Lai ra đi từ đó) với `ahu` là chữ lệch. Pāli không cho phân xử; không thêm “từ”, không đổi thì. Người biên tập nên cân nhắc nếu sửa cả các phẩm `bv22`–`bv25`.
  2. `16.2` `pāyāsaṁ ada so jino`: tôi đọc `ada` là dạng của động từ ăn (`adati`), nên “bậc Chiến Thắng ấy sẽ dùng cháo sữa”, hợp ngữ cảnh Đức Phật nhận cháo của Sujātā rồi tới cây Bồ-đề. Cách đọc khác: `adā` “đã cho”, không hợp, vì người dâng cháo không phải bậc Chiến Thắng. Không có tiền lệ trong tầng.
  3. `5.3` `tesamārāmapattānaṁ`: `ārāma` đọc là “khu vườn” (`dn14:3.14.7`, `dn14:3.18.3`: “vườn hươu Khema”, nơi 84.000 người ấy đến), không phải “tu viện”. `ārāma` trong tầng: “tu viện” 16, “vườn” 7, “tịnh xá” 4, “công viên” 4 trên 40 khoá, nhưng đa số là tên riêng chứa `ārāma`. Cách đọc khác: “tu viện”. `5.4` `dhammaṁ desesi cakkhumā` giữ “bậc có mắt” theo `bv8:7.2`.
  4. `3.2` `ubho bodhesi nāyako`: “cả hai” không có tên trong Pāli; `dn14:1.9.1`, `dn14:3.13.1` cho biết đôi đệ tử tối thắng của Vipassī là Khaṇḍa và Tissa (xem `29.1`), nên có thể là hai vị này, nhưng đó là chú giải từ `dn14`, không thêm vào thân kinh; Việt chỉ nói “cả hai”.
  5. `6.1`–`6.3` `sabbākārena bhāsato, sutvā upanisādino; tepi dhammavaraṁ gantvā`: `upanisādino` (người ngồi gần, ngồi chầu bên) là chữ ít gặp, không có tiền lệ trong tầng (0 khoá); tôi đọc là những người ngồi gần nghe Pháp, `tepi` “họ cũng”, nên lần chứng ngộ thứ ba thuộc về những người này. Cách đọc khác: `tepi` chỉ các vị xuất gia ở `5.1`–`5.2`. `gantvā` đọc là “đạt đến”, không phải “đi đến” theo nghĩa địa điểm.
  6. `11.1`–`11.2` `nekānaṁ nāgakoṭīnaṁ parivāretvānahaṁ`: gerund `parivāretvā` chủ động, nhưng ngữ cảnh là Atula được các rồng vây quanh khi đến yết kiến; dịch “được nhiều koṭi rồng vây quanh” (cùng cách với `bv19:12.1` “được bốn giai cấp vây quanh”). `11.3` `vajjanto`: đọc là “trong khi tấu” (chủ ngữ là Atula, như `bv6:16.3`). `11.4` `lokajeṭṭhaṁ upāgamiṁ`: “tiến đến”, không phải “đến gần” để khỏi trùng với `12.1` `upasaṅkamitvā`. Nhiều rồng “koṭi” giữ nguyên chữ `koṭi`, không quy đổi.
  7. `12.3`–`12.6` cú pháp: `maṇimuttaratanakhacitaṁ sabbābharaṇavibhūsitaṁ` là hai tính từ giống trung ở đối cách, bổ nghĩa cho `suvaṇṇapīṭhaṁ` (“ghế vàng”) ở `12.6`, nên viết “Được khảm …, được trang hoàng …” đặt trước, danh từ ở cuối như Pāli. `12.5` `nimantetvā dhammarājassa`: `dhammarājassa` ở sở hữu/tặng cách; tôi dịch “thỉnh mời bậc Pháp Vương”, người nhận ghế vẫn là vị ấy; không thêm “dâng cho”.
  8. `17.1`–`17.4`: `padakkhiṇaṁ katvā` đọc là “đi nhiễu bên phải” quanh `bodhimaṇḍa` (đạo tràng Bồ-đề); `anuttaro` là danh xưng của Đức Phật, đứng sau tân ngữ ở `17.2`, nên Việt giữ thứ tự “đạo tràng Bồ-đề, bậc Vô Thượng”. `17.3` `sambodhiṁ bujjhissati`: đối cách cùng gốc (“giác ngộ giác ngộ hoàn toàn”), viết “sự giác ngộ hoàn toàn … sẽ giác ngộ”.
  9. `21.5`–`21.6`: tuổi thọ Đức Gotama là một trăm năm, đúng với `bv27:21.1`; Pāli không có động từ, Việt cũng không thêm.
  10. `22.1`–`22.3` `…pe…`, `hessāma sammukhā imaṁ’`: đoạn lược che mất phần giữa, nên không xác định được “chúng ta” là ai. Giữ một dấu `…` theo Pāli, dịch sát chữ, không thêm người nói; nháy đơn của lời thọ ký mở ở `13.3`, đóng ở `22.3` theo Pāli từng khoá.
  11. `26.4` `samavattakkhandho nāma atrajo`: tên người con (xem phần tên riêng). `29.1` `Khaṇḍo ca tissanāmo ca`: `tissanāmo` là “người tên Tissa”, viết “Khaṇḍa và người tên Tissa” để giữ chữ `nāma`.
  12. `34.1`–`34.4`: `bandhanā parimocayi` “đã giải thoát khỏi trói buộc” (cùng cách với `bv19:5.3`); `avasesaputhujjane` “những phàm phu còn lại”, nghĩa là những người chưa được nêu ở trên; không có tiền lệ cho `avasesa-` ghép với `puthujjana`. `35.1`–`35.2` `ālokaṁ dassayitvāna, desetvā amataṁ padaṁ`: `ālokaṁ` không kèm tính từ ở Pāli nên không thêm “rộng lớn” như `bv18:23.1`.
  13. `36.2` `lakkhaṇañca kusumitaṁ`: `kusumita` là “đã nở hoa” (phân từ quá khứ); ý hình ảnh là các tướng của Đại Nhân đã rực nở. Viết “tướng đã nở hoa”, giữ nguyên hình ảnh, không giải thích. `36.1` `iddhivaraṁ puññavaraṁ`: `vara` hai lần dịch “tối thượng” theo `jinavara` ở `37.1`.
  14. `1.1` `Phussassa ca aparena`: `ca` dịch là “Và” (“Và sau Phussa,”); các phẩm anh em không có `ca` ở câu này (19/19 tiền lệ “Sau X,”), nên đây là chỗ khác tiền lệ có lý do: giữ chữ có trong Pāli. `1.2`–`1.4`: không thêm “đã có” ở `1.2` vì động từ `uppajji` (“đã xuất hiện”) đã nằm ở `1.4`.

  **Coverage English (mục 7):** mẫu số = **1** khoá có nội dung (`38.1`, 41 ký tự sau khi nén khoảng trắng, đạt ngưỡng `40`; mọi khoá còn lại dưới 40). Sujato: 0 tệp cho `bv21` (`english-sujato` chỉ có chín tiểu bộ cp dhp iti ja kp snp thag thig ud; chỉ có tệp tên phẩm `bv-name`), nên phủ 0/1; `english-project`: 0 (không có tệp bv nào trong `content/translation/en/project/sutta/kn/`, không có `content/meta/en/kn/bv21.yaml`); `vietnamese-current`: 0 tầng segment (chỉ Pháp Cú); bản nguyên bài của tầng tra cứu toàn văn (HTML) không cấp text. Mẫu số chỉ có một khoá là colophon nên cổng đo gần như không đo được gì về nội dung bài, cũng không nên đọc 0/1 là "thiếu một khoá nội dung". Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Không đụng `content/meta/reference-gaps.yaml`. Đối chiếu duy nhất ngoài Pāli là tiền lệ nội bộ của tầng Việt, gồm `dn14` (cùng Đức Phật Vipassī, do cùng dự án dịch, không phải tham khảo độc lập).

  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`. `final_score` là trung bình số học thô của đúng 10 tiêu chí.

  **Lượt cải thiện 2026-10-13: đọc đối kháng lại cả 158 khoá, không đổi khoá nào, giữ nguyên điểm.** Đã in lại từng cặp Pāli và Việt, soát người nói, phủ định, số lượng, ranh giới khoá, nghĩa thêm hoặc thiếu, thuật ngữ so với tiền lệ. Không tìm được lỗi nào có căn cứ để sửa. Các phép đo lại: đủ 158/158 khoá, thứ tự khoá đúng thứ tự Pāli, nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch), NFC, không khoá rỗng, không chữ Pāli ngoài tên riêng và đơn vị đo giữ nguyên (`koṭi`, `hattha`, `assattha`, `pāṭali`); Pāli trùng nguyên văn trong chính bài: 5 nhóm, trong đó chỉ nhóm `7.2`/`24.4`/`29.4` có Việt khác nhau, đúng như đã giải thích ở trên.
  - Đối chiếu lại tiền lệ bằng số đếm trên toàn tầng Việt hiện có (không tính chính bài này): `17.1`–`17.2` (`Tato padakkhiṇaṁ katvā, bodhimaṇḍaṁ anuttaro`) giống nguyên văn 2/2 tiền lệ (`bv2:65`, `bv26:20`); `14.1`–`14.2` giống nguyên văn 2/2 tiền lệ có dòng kế `nikkhamitvā tathāgato` (`bv2:62`, `bv26:17`), 4/4 tiền lệ có dòng kế là `…pe…`; `16.3` 2/2; `11.3` và `10.4` khớp cách dịch `jutindhara` ở `tha-ap545:4.2` (“mang ánh sáng rực rỡ”); `26.4` 18/18 khoá `nāma atrajo` trong `bv` dịch “người con ruột”; `32.1` 5/5 khoá `asītihattha…` trong `bv` dịch “cao tám mươi hattha”; `koṭi` giữ chữ Pāli trong 15/15 khoá `bv` có `koṭīnaṁ`; `36.3`–`36.4` 15/15 tiền lệ. Không có chỗ nào lệch đa số cần sửa.
  - Hai chỗ đã cân nhắc kỹ và quyết định không đổi. `14.1`: đọc `kapilavhayā rammā` là cách xuất xứ (“từ Kapila xinh đẹp”) có thể làm câu liền mạch hơn, nhưng `ahu` đứng đầu khoá chống lại cách đọc đó, và đổi sẽ làm bài lệch 2 bài anh em đã dịch cùng cách; Pāli ở đây không cho phép phân xử, nên giữ bất định ở mục 1 phần trên. `11.1`–`11.2`: `parivāretvā` chủ động mà Việt dịch bị động; chưa có tiền lệ nào của riêng `parivāretvāna` trong `bv` (0 khoá), nên giữ cách đọc theo ngữ cảnh đã ghi ở mục 6.
  - Điểm: không tiêu chí nào đổi, không có cải thiện cụ thể nào đứng sau để nâng, và không phát hiện lỗi mới nghiêm trọng để hạ. `final_score` vẫn 8,85 (88,5/10). `triangulation` vẫn 7,0 vì ba tầng tham khảo vắng; `semantic_fidelity`, `grammar_logic` và `ambiguity_integrity` giữ vì các bất định ở mục 1, 5, 6 và 14 phần trên vẫn còn nguyên. Blocker `noEnglishEditionUpstream` giữ nguyên, đó là sự thật về upstream. `technical_integrity` 9,6: bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy ở lượt này.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 9 khoá bất đồng nghĩa → sửa 0, giữ 6, bất định 3. Giữ: 5.3 `ārāma` (bản nguyên bài "tu viện", bản dự án "khu vườn", cả hai nằm trong nghĩa `ārāma`); 6.2 `upanisādino` ("những người ngồi gần" so với bản nguyên bài "an trú vào"); 13.3 `ekanavutito kappe` ("sau chín mươi mốt kiếp nữa" so với "trong chín mươi mốt kiếp tính từ thời điểm này", cùng một mốc 91 kiếp); 26.3 `sudassanā` (bản nguyên bài "Sutanā" theo dị bản; Pāli ghim là Sudassanā); 12.3–12.4 `maṇimuttaratanakhacitaṁ`, `sabbābharaṇavibhūsitaṁ` (tính từ trung tính đi với `suvaṇṇapīṭhaṁ` ở 12.6; bản nguyên bài nói rõ là chiếc ghế; bản dự án để hai dòng không nêu danh từ, không sai nghĩa nhưng chưa tường minh; giữ vì thêm danh từ là thêm chữ). Bất định: 11.1–11.2 `parivāretvānahaṁ` (bản nguyên bài hiểu là ta vây quanh Đức Phật cùng nhiều koṭi rồng, bản dự án hiểu là ta được rồng vây quanh; hai cách đều khả dĩ); 14.1 `ahu kapilavhayā rammā` (bản nguyên bài bỏ `ahu` và đọc là "rời khỏi thành xinh đẹp Kapila"; bản dự án giữ nguyên văn tiền lệ 7/7 khoá cùng Pāli ở bv2, bv21–bv26; cách đọc xuất xứ của bản nguyên bài là bằng chứng độc lập cho khả năng mà notes trên đã ghi, nhưng không đủ để đổi một khoá của cả họ). Các số đã tính lại và khớp bản nguyên bài: 84.000, 6.800.000 (68 × 100.000), 100.000, 80.000, 91 kiếp, 8.000 năm, 43.000, 8 tháng, 80 hattha, 7 do-tuần, 80.000 năm, thứ 19. Review đối kháng cùng lượt: không tìm thấy lỗi cần sửa. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đối chiếu bản nguyên bài Bhikkhu Indacanda, tiền lệ bv2, bv26, tha-ap562:1.3): sửa 1 khoá. `35.3` `Jalitvā aggikkhandhova` “Sau khi cháy rực như một khối lửa lớn,” thay “Tỏa sáng tợ như…”: `jalitvā` là gerund (cùng chuỗi `dassayitvāna`, `desetvā` ở 35.1–35.2, chủ ngữ của `nibbuto` 35.4), bản cũ biến thành động từ hiện tại; dùng lại nguyên văn tiền lệ duy nhất `tha-ap562:1.3`. Giữ: `1.2` không thêm “có” (động từ ở 1.4); `16.2` `ada` “sẽ dùng” (bản nguyên bài cũng “thọ thực”); `17.1`–`17.4` giữ khuôn calque đồng nhất với `bv2:65`, `bv26:20`; các mục giữ của lượt 2026-10-14 không đổi. Bất định 1 (`ahu kapilavhayā`), 5 (`upanisādino`), 6 (`parivāretvāna`), 13 (`kusumitaṁ`) vẫn mở; không tìm thấy sai nghĩa trọng yếu mới.
