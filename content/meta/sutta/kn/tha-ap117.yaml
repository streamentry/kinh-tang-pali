notes: |-
  Đã đọc HẾT p49.txt (40 khoá) trước khi viết. Đối chiếu tha-ap311 — cùng hình
  dạng 11 khoá có `…pe…` ở `4.2` — và bản tổng kê 307 bài `tha-ap` đã dịch trọn.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ (đếm được trên 307 bài): `:0.1` `Therāpadāna` giữ Pāli
  (298); `:0.3` và `:11.1` theo hình `Bài Kệ Tuyên Ngợ Về Trưởng Lão <X>` (135, đa
  số so với `Tuyên Ngôn` 57 và `Ký Sự` 63); `Paṭisambhidā catasso` → `Bốn vô ngại
  giải,` (313); `… kataṁ buddhassa sāsanaṁ”.` → `đã làm tròn lời dạy của Đức
  Phật”.` (279); `Itthaṁ sudaṁ āyasmā <X> thero imā gāthāyo abhāsitthāti` →
  `Tôi nghe như vầy: Tôn giả Trưởng lão <X> đã nói những bài kệ này.` (346, gần
  như nhất quán toàn tầng). `lokajeṭṭho narāsabho` → `bậc Trưởng Thượng thế gian,
  đấng Nhân Ngưu` (tha-ap146:1.2). `dvipadindassa tādino` → `của bậc hai chân đáng
  tôn kính ấy` (tha-ap249:1.4). `tusitaṁ upapajjahaṁ` → `tôi được tái sinh lên cõi
  Đâu-suất` (tha-ap308:5.4). `Ekanavutito kappe` → `Từ chín mươi chín kiếp trước`
  (tha-ap176:2.1). `cakkavattī mahabbalā` → `là … Chuyển Luân Vương có đại thần
  lực` (tha-ap136:7.4). `nibbatta/abhiropayiṁ` → `tôi dâng lên Đức Phật` (tha-ap161:2.4).
  `Duggatiṁ nābhijānāmi` → `Tôi không còn biết đến đọa xứ nào,` (50; bản nháp đầu
  viết `không biết mình rơi vào khổ đau` theo biến thể 93 lần nhưng câu ấy đi kèm
  đại từ `Ta`, còn kệ này là ngôi `tôi`).

  DẤU LƯỢC: `:9.2` là `…pe…`; theo luật 10.1 tôi giữ **đúng một** `…`, không viết
  `…pe…`.

  BẤT ĐỊNH ĐÃ GHI. (1) `:0.2` `Mahāparivāravagga` — **0 tiền lệ dùng được**: tầng
  Pāli có 11 bài cùng phẩm này (tha-ap113–122), nhưng trong đó 4 bài
  (tha-ap113, 115, 117, 121 — 117 là của lát này) chưa có tệp Việt, còn 7 bài còn
  lại đều là tệp dịch dở nên khoá `:0.2` của chúng để trống; tôi không sửa tệp ngoài
  lát. Phẩm này đặt theo tên vị trưởng lão `Mahāparivāraka` (`tha-ap113:0.3`), nên
  tôi dịch `Phẩm Mahāparivāra`, theo đúng hình `Phẩm <tên Pāli>` quen thuộc trong
  `tha-ap` (`Phẩm Paṇṇadāyaka`, `Phẩm Ārakkhadāyaka`, `Phẩm Sakacintaniya`). (2) `nemisammatanāmakā` (8.2) — 0 tiền lệ; giữ tên làm
  `có danh hiệu là Nemi-sammata`, không dịch `sammata` vì đó là tên riêng. (3)
  `Vittisañjanano tesaṁ … diṭṭhadhammasukhāvaho` (4.3–4.4) — `diṭṭhadhammasukhāvaho`
  chỉ có 2 tiền lệ (`tha-ap469:3.2` `mang theo sự an lạc của điều đã thấy biết`);
  tôi theo nó và dịch `mang theo sự an lạc của điều Pháp rõ ràng`. Bản nháp đầu
  đặt `tesaṁ` vào khoá 4.4 thành `chúng hoa ấy`, làm vế đệ ngữ đứt; đã sửa để `bốn
  đóa hoa ấy` nằm ở 4.3. (4) `Pāmojjaṁ janayitvāna, sakaṁ bhavanupāgamiṁ` (5.3–5.4)
  — đổi chủ từ sang ngôi `tôi` cho khớp `sakaṁ bhavanupāgamiṁ`; `subbataṁ` (5.2) 0
  tiền lệ, dịch `lời lành lành`.
  `technical_integrity` đặt 9.6: không ai rà lại bằng con người.
