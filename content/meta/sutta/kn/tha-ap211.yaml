notes: |-
  **Bài này.** `tha-ap211` · phẩm `kaṇikārapupphiyavagga` · thứ chín trong phẩm (lục kết `6.1` tự xác nhận) · vị trưởng lão Ādhāradāyaka. Bài có 20 khoá Pāli; bản dịch phủ đủ 20/20.

  **Công thức lặp rất dày ở tập này, và tôi đo trước khi chọn.** Dựng chỉ mục Pāli→Việt toàn tầng `content/translation/vi/project/`, rồi với mỗi segment của lát này đếm số bản Việt đã có ở nơi khác có Pāli **giống hệt**: 3316 cặp đã dò (không tính 4 tệp của lát), 1856 cặp trùng về lời, 10 khoá của bài này khớp nguyên văn ít nhất một bản đã có. Ba khoá có tiền lệ áp đảo nên tôi DÙNG LẠI NGUYÊN VĂN chứ không dịch lại: `2.1` (76 bản đã có cùng lời), `2.2` (10), `3.4` (14), `4.1` (374), `4.2` (655), `4.3` (341), `0.1` (365).

  **Năm phép kiểm, số do script in ra — không có số nào tôi tự đặt.**
  (1) set(khoá Việt) == set(khoá Pāli): thiếu 0, thừa 0. Lưu ý: có 19/20 khoá Pāli ngắn hơn 40 ký tự — chốt `_hvi.py` bỏ sót đúng nhóm này, nên nó sẽ chạy rỗng ở bài kệ và báo pass trong khi im lặng.
  (2) ngoặc kép `“”` và nháy đơn `‘’` so từng khoá: 20 khoá đã so, 0 khoá lệch. Cân trên cả bài: ngoặc kép Pā li 2 / Việt 2; nháy đơn Pā li 0 / Việt 0. Pā li mở nháy ở `1.1` và đóng ở `4.3`, bản dịa y hệt.
  (3) Pā li trùng nguyên văn TRONG CHÍNH bài: 0 cặp, trong đó bản Việt khác 0 cặp — bài này không lặp Pā li với chính nó, nên không có gì để mâu thuẫn.
  (4) Dấu lược: Pā li có `…pe…` 1 khoá, `…` trần 0 khoá; bản dịch có tổng 1 dấu `…`; lệch 0.
  (5) NFC, khoá rỗng, ký tự Pāli lọt: 0 vấn đề. Ba từ có ký tự Pāli trong bản dịch — `Kaṇikāra` (tên phẩm ở `0.2`), `Samantavaraṇa` (tên vua ở `3.3`) — đều có mặt trong chính Pā li của bài này.

  **Bất định, đã ghi thay vì giấu.**
  `1.1 Ādhārakaṁ mayā dinnaṁ`: `ādhārakaṁ` là tân ngữ (người được cho), còn `dinnaṁ` là tính từ trung tính cần một tân ngữ trung tính mà Pā li không nói ra. Tôi điền *chỗ ngồi* — dựa vào tên riêng của chính vị trưởng lão, Ādhāradāyaka = bậc cho chỗ ngồi, xác nhận ở `0.3` và `6.1`. Đây là từ do bối cảnh và tên riêng ép, không phải thêm ý; tôi ghi ra vì nó là chỗ duy nhất trong bài mà tôi phải cung cấp danh từ.
  `1.2 sikhino lokabandhuno`: 6 bản đã có ở nơi khác, 6 lời khác nhau, không lời nào trộn được với `ādhārakaṁ` ở `1.1`. Tôi ghép *bậc Đang Tu Hành, Đức Sikhī, bậc Thân Hữu của thế gian* — tiền lệ `tha-ap318` cũng dịch `ādhāraka` thành *bậc đang tu hành*.
  `2.3`: 19 bản đã có ở nơi khác, đông đảo nhất mới 3 bản, và ngôi kể trong tầng chia làm *tôi* lẫn *ta*. Tôi giữ *ta* để nhất quán với `1.1`, `1.3`, `2.1`, `2.2` trong cùng bài; đây là lệch có chủ ý, không phải lỗi quên.

  **Tên riêng giữ nguyên dạng Pā li** — `Ādhāradāyaka` là danh xưng tôn giáo, không dịch nghĩa. Pā li ở khoá kệ dạng Nom. sg. `ādhāradāyako` (`5.1`), ở `0.3` và `6.1` có sandhi `ādhāradāyakattheraapadāna` / `ādhāradāyakattherassāpadānaṁ`; bản dịch bỏ dấu hiệu Nom. như 33 tiền lệ cùng tập đã làm (`atichattiyo`→*Atichattiya*, `maggasaññako`→*Maggasaññaka*).

  **Chính sách `:0.3` — đo rồi mới chọn.** Quy tắc áp dụng: giữ số **khi và chỉ khi** Pā li `:0.3` bắt đầu bằng số. Ở phạm vi gần nhất (427 tệp `tha-ap*.yaml` có metadata) tôi đo: **KEEP 15 · DROP 297 · LỆCH 115**; riêng số bài mà Pā li `:0.3` bắt đầu bằng số là 130, nhưng chỉ 8 tệp viết số vào `translationTitle`, và cả 8 đều khớp đúng số Pāli với hình thức `N. `. Bài này Pā li `:0.3` = `Ādhāradāyakattheraapadāna` **không bắt đầu bằng số** ⇒ **BỎ số**, và `translationTitle` đặt **bằng đúng** giá trị `:0.3` là *Bài Kệ Tuyên Ngợ Về Trưởng Lão Ādhāradāyaka*, đúng như khoá dịch `0.3`. `tests/unit/tha-ap-title.test.ts` **không tồn tại** trong kho nên tôi không chạy được chốt đó, phải tự đếm như trên.

  **Tiền lệ `ti`, đo ở phạm vi gần nhất — ghi cả hai số.** Trong 427 tệp `tha-ap*.yaml`: *Bài Kệ Tuyên Ngợ Về* 191 · *Ký Sự Về* 88 · *Bài Kệ Tuyên Ngôn Về* 65 · *Kinh Kệ Của* 39 · *Truyện Kệ Của* 14 · *Tự Thuật Của* 14. Tôi theo nhóm đông nhất. Trước khi sửa, `translationTitle` của bài này là *Kinh Kệ Của Trưởng lão Ādhāradāyaka*; tôi đổi sang *Bài Kệ Tuyên Ngợ Về Trưởng Lão Ādhāradāyaka* để `0.3` và `translationTitle` trùng nhau đúng như 361 tiền lệ, và để ba bài `tha-ap` của lát này dùng chung một hình thức.

  **Tầng tham khảo — đo manifest, không đoán.** Tại commit 11c9d708978cde8ba61096d8a75f7ddfb846f639 tầng `english-sujato` có 4291 tệp nhưng thư mục con `sutta/kn/` chỉ gồm cp, dhp, iti, ja, kp, snp, thag, thig, ud — **không có `tha-ap`**, nên bài này có 0 tệp Anh và 0 segment Anh. Tầng `vietnamese-current` tại cùng commit chỉ có 26 tệp, toàn bộ là Pháp Cú ⇒ không có bản Hòa thượng Thích Minh Châu cho `tha-ap`. Lớp lấp `english-project` cũng không có tệp cho bài này. Mẫu số coverage = 1 khoá Pāli ≥ 40 ký tự (bỏ khoá `:0`) nên Sujato phủ 0/1 — đây là **hạn chế của bản chụp upstream**, không phải thiếu sót của kho, và `reference-gaps.yaml` **đã có** entry cho `tha-ap211`, nên với `review`/`published` nó không còn là lỗi chặn.

  **Vì sao `published`.** Không còn blocker: bản dịch phủ 20/20 khoá, 0 orphan, 0 lệch dấu lược, 0 lệch nháy, và khoảng trống tầng tham khảo đã được `reference-gaps.yaml` ghi nhận. `final_score` = 9.42 (trung bình số học thô của 10 tiêu chí) > 9.0.

  **Cổng kỹ thuật KHÔNG chạy được — lát này bị cấm.** `technical_integrity` = 9,6, không phải 10. Bốn lệnh còn lại thuộc cổng của người điều ph��: `npm run validate` · `npm test` · `npm run check` · `npm run build`. Tôi chỉ tự kiểm được: JSON hợp lệ, NFC, khoá trùng Pāli gốc và đúng thứ tự Pāli, không khoá rỗng, dấu lược khớp từng khoá, nháy khớp từng khoá, YAML parse sạch bằng thư viện `yaml` của kho.
