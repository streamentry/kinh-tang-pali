notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Netti. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ dùng lại. Khoá 2.1 có Pāli trùng nguyên văn với bảy bài Netti khác; dùng nguyên văn Do vậy, với
  người có tâm được phòng hộ, chánh tư duy là cảnh giới, đó là bài kệ. Sáu mệnh đề còn lại dùng nguyên văn
  từ ne23 và ne30: Chánh tư duy là cảnh giới, Chánh kiến là bảo hộ, Đã hiểu rõ cả khi sinh cả khi diệt,
  Tỳ-kheo có mặt ở cả sự nhợt nhạt và sự nửa chừng, Bỏ hết mọi kẻ xấu. Saccāni → bốn sự thật; saccani
  là chữ thường dùng trong tầng.
  Thuật ngữ đặt mới, chưa có tiền lệ cho Netti, tôi đặt và ghi lý do ở đây:
  Āvaṭṭa → quy căn. Tầng chỉ quen āvaṭṭa ở nghĩa xoáy nước (an4.122), hoàn toàn khác ngữ cảnh. Trong
  sampāta này āvaṭṭa là chỗ dựa vào, và câu 2.7 xác nhận đó là tứ đế, nên tôi dịch là quy căn để không đụng
  với nghĩa xoáy nước đã có.
  Dukkhapariññā → sự biết trọn vẹn khổ; pariññā là biết trọn vẹn, không phải biết sơ qua, nên tôi giữ
  trọn vẹn thay vì dịch rút gọn thành sự biết khổ.
  Samudayapahāna → sự phá bỏ nguyên nhân, theo ne30:2.5 đã có (sự phá bỏ hữu dư của nguyên nhân).
  Nirodho → sự chấm dứt, tiêu chuẩn của tầng.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0. Nháy kép: mỗi khoá 2.x là một cặp riêng; cân trên cả bài.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
