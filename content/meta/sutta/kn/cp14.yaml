notes: |-
  Dịch từ Pāli root, đối chiếu bản dịch tiếng Anh của Bhikkhu Sujato tại commit bilara đã ghim. Tại commit đã ghim không có bản Việt hiện hành cho Khuddaka Nikāya (`translation/vi/phantuananh/` chỉ có 26 chương Pháp Cú), nên không có tầng Việt truyền thống để so.

  Coverage Anh, đo lại bằng đúng công thức của `src/lib/canon/reference.ts`: **substantive = 0**, nên `ratio = 1` và bài qua cổng coverage một cách rỗng — cổng này không phát hiện được tầng Anh vắng hẳn, vì cả 49 khoá Pāli đều ngắn hơn 40 ký tự (ngự ngâm). Đo thủ công trên tệp Anh đã ghim: **44/45 khoá thân bài có chữ Anh**, chỉ `:12.1` (câu kết) bị Sujato bỏ trống — cùng đối xứng với `cp13:12.1` và `cp17:12.1`.

  Tên phẩm, có số đếm, VÀ SỐ NÀY KHÁC SỐ ĐƯỢC BÁO TRƯỚC. Đếm lại từ đầu, chỉ trên 23 tệp `cp` **có sẵn trước khi lát này ghi** (không theo lời kể): `Cariyāpiṭaka` ở khoá `:0.1` được dịch **"Hạnh Tạng" ở 20 tệp** (cp2, cp3, cp4, cp5, cp6, cp7, cp11, cp12, cp13, cp17, cp18, cp21, cp23, cp24, cp25, cp27, cp28, cp30, cp32, cp33) và giữ nguyên Pāli **ở 1 tệp** (`cp34`). Hai tệp `cp1` và `cp35` có khoá `:0.1` rỗng nên không tính. Tức là phép đo của tôi là **20 / 1**, không phải 17 / 1 như đã báo trước; tôi theo phép đo của mình và dùng "Hạnh Tạng". **Sau khi cp14, cp15, cp19 của lát này đã ghi thì toàn tầng là 23 "Hạnh Tạng" / 1 "Cariyāpiṭaka" trong 26 tệp cp** — người đối chiếu nên dùng con số 23/1. `Hatthināgavagga` → *Phẩm Hatthināga* (cp12, cp13, cp17, cp18: 4/4). `Sīlapāramī 4` → *Trì Giới Ba-la-mật Thứ Tư*, theo đúng khuôn cp11 (Thứ Nhất), cp12 (Thứ Hai), cp13 (Thứ Ba), cp18 (Thứ Tám). `Cūḷabodhicariya` → *Hạnh Của Cūḷabodhi*, theo khuôn "Hạnh Của X" (chữ C của "Của" hoa) với tên đạo sĩ giữ Pāli — cp2 *Hạnh Của Saṅkha*, cp28 *Hạnh Của Đạo Sĩ Chân Thật*. Câu kết → *Hạnh của Cūḷabodhi, thứ tư.* theo cp13/cp17.

  DÙNG LẠI NGUYÊN VĂN BÀN DỊCH ĐÃ CÓ, đo bằng script `_c80_dup.py` trên 5.271 bài Việt: 9 khoá trùng Pāli ở bài khác và được dùng lại nguyên văn — `:0.1 :0.2` (cp13), `:1.1` (9/16 bài cp dùng đúng câu này), `:1.3` (cp24:2.3), `:6.2` (cp23:3.4), `:10.3` (cp13:6.3 và cp12:8.3), `:10.4` (cp21:5.4), `:11.3` (cp3/cp21/cp23, 3/4).

  Thuật ngữ, có số đếm. `dutiyikā` → *người vợ* (ud1.8 và sn9.6 dịch `purāṇadutiyikā` là "người vợ cũ"; Sujato dịch "partner"). `vaṭṭa` → *luân hồi* (172 lần; `vòng sanh` chỉ 5). `nipakā` → *tỉnh giác* (717; theo an5.27:1.1). `rājuyyāna` → *ngự uyển của vua* (7 tệp, vd tha-ap417:1.2, tha-ap526:1.2). `antepuraṁ` → *cung vua* (16; theo an10.45:10.1). `sīlabbata` → *giới hạnh và thề nguyện* (theo cp13:1.4). `sabbaññuta` → *Nhất Thiết Chủng Trí*. `bodhi` → *giác ngộ*.

  BẤT ĐỊNH ĐÃ GHI. (a) `:4.3` `Nirākule appasadde` dịch *Ở nơi trống trải, chúng ta không bị xâm phạm* — `nirākula` là "không có gia đình hay tập thể" (nghĩa từ), `appasadda` là "không ai tới gần / không bị xâm phạm"; Sujato chỉ "Quiet and undisturbed" nên không có gì để phân xử thêm. (b) `:8.1` `Odapattakiyā mayhaṁ` dịch *Bà ấy đã trở thành người của ta nhờ lễ chạm nước* — `oda-pattakiya` là người đã dâng nước theo lễ (định hôn Ấn-Độ), Sujato dịch "touching a water-jar"; giữ "lễ chạm nước" vì đó là mốc pháp lý của câu chuyện chứ không phải bình gốm. (c) `:7.1` `sārattagadhito` dịch *mê mệ nàng ấy đến mức* — `gadhita` là bám víu, `sārattā` là mãnh liệt; Sujato chỉ "Infatuated with her". (d) `:2.2` `kanakasannibhā` dịch *có làn da vàng* — `sannibha` là "tựa như", `kanaka` là vàng; tránh dịch thành "tựa vàng" vì bài này còn có `odapattakiyā` (lễ chạm nước) và "tựa" sẽ dễ đọc nhầm thành động từ chạm.

  Cặp nháy kép: Pāli mở `“` ở `:1.1`, đóng `”` ở `:11.4`; các nháy đơn `‘…’` ở `:5.4 :6.3 :6.4` tự cân theo Pāli. Cơ chốt `_hvi.py` chạy sạch với 49 khoá.