notes: |-
  **Phạm vi: đủ 147/147 khoá của cnd12, không khoá nào ngoài tập khoá Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Hemaka (Pārāyana, câu hỏi thứ tám), tức bài kệ `snp5.9`. Cấu trúc như `cnd6`: dẫn từng đoạn kệ rồi giải từng cụm; phần chú giải là các chuỗi từ đồng nghĩa mang tính công thức. Pāli của bài **không có** `(…)`; có 20 khoá chứa `…pe…` (đều thành đúng một `…`) và 8 khoá có `…` trần (đều giữ `…`); khoá `2.6` Pāli kết `…pe….` nên Việt kết ` ….`.

  **Cách trình bày lemma** theo `cnd6`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. `Iccā` giữ nguyên Pāli ở `2.4`–`2.5` (như `cnd6:3.2`–`3.3`) vì lời giải nói về chính hình thức của từ ấy; `visattikā` ở `13.3`/`25.3` dịch *sự đắm say* và **không** giữ được lối chơi chữ `visaṭā vitthatā` → `visattikā` trong Pāli (chữ Việt không thể hiện lại); người đọc đối chiếu cột Pāli.

  **Tầng tham khảo — đo, không đoán.** Sujato không có `cnd12`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; tệp `cnd12_translation-en-sujato.json` không tồn tại, chỉ có tệp tên `cnd-name` (nhãn tác phẩm, không phải văn bản kinh). Lớp `english-project` cũng không có cnd12. `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự, bỏ khối `:0`) là **52** khoá; Sujato phủ 0/52 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/52, `vietnamese-current` 0/52. Có hai chứng cứ độc lập trong chính corpus, nhưng đều là bản của **bài khác** nên không tính là đối chiếu English của cnd12: (a) kệ ở `1`, `8`, `9`, `14`, `15`, `20`, `21`, `26` trùng Pāli với `snp5.9` mà Sujato có dịch; (b) công thức chú giải đã dịch ở `cnd6` và các đoạn Pāli trùng ở `dn22:19`, `an3.65`, `mn146`, `dn14`.

  **Dùng lại tiền lệ.** Đã dò 38 khoá có Pāli (đã bỏ thẻ in đậm) trùng nguyên văn với khoá đã dịch ở tầng: dùng lại nguyên văn ở 28 khoá, khác ở 10 khoá. Mười khoá khác gồm: (i) `1.4`, `8.4` chỉ khác dấu chấm/phẩy so với `cnd4:5.3` (Pāli kết bằng phẩy); (ii) `15.2`, `15.3`, `20.1`–`20.3`: `snp5.9:3.1`–`3.3` dịch theo thứ tự câu của Sujato (dồn *Sự xua tan dục và tham* lên dòng 3.1 và *đối với những hình tướng khả ái* xuống 3.3) nên lệch một dòng so với Pāli từng khoá; ở đây dịch đúng thứ tự Pāli từng khoá để mỗi khoá chỉ mang nội dung của chính nó (nội dung và chữ dùng đều lấy từ `snp5.9`); (iii) `21.2`, `26.2` trùng Pāli với `mn130:30.16`, `an3.36:22.2`, `an6.23:5.2` (mỗi nơi dịch khác nhau) nhưng dùng câu của `snp5.9:4.2` vì cùng bài kệ (Pāli chỉ khác chữ hoa); (iv) `26.4` Pāli trùng `sn1.35:5.4` nhưng dịch *sự đắm say* theo `snp5.9:4.4` (xem thuật ngữ).

  **Trong chính bài:** 16 nhóm Pāli trùng nguyên văn (`1.2=8.2`, `1.3=8.3`, `1.4=8.4`, `1.5=8.5`, `1.6=8.6`, `7.3=13.7`, `9.3=14.3`, `12.4=22.7`, `13.2=25.2`, `13.3=25.3`, `15.2=20.2`, `15.3=20.3`, `19.4=25.7`, `21.2=26.2`, `21.3=26.3`, `21.4=25.6`); bản Việt giống nhau ở cả 16 nhóm, 0 nhóm khác. Các cặp `1.1`/`8.1`, `1.7`/`8.7`, `9.4`/`14.4`, `15.4`/`20.4` Pāli chỉ khác dấu nháy và đuôi `ti` nên Việt chỉ khác dấu nháy.

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `visattikā` → *sự đắm say*: tầng có 36 khoá chứa `visattik`; *đắm say* 6 khoá (**cả 6** đều là kệ Pārāyana `snp5.5`, `snp5.6`, `snp5.9`), *dính mắc* 15, *bám víu* 3, *chấp trước* 3. Chọn *đắm say* theo đúng kệ `snp5.9` mà cnd12 chú giải (gần nhất: 2/2 ở `snp5.9:2.4`, `4.4`), dù đa số toàn tầng là *dính mắc*; `sn1.35:5.4` có cùng Pāli với `26.4` nhưng ở bài kệ khác.
  - `aññāya`/`viditvā` → *liễu tri* (theo `snp5.9:4.1`, `2.3` và `cnd6`); `viditaṁ katvā` → *làm cho biết* để khác với `jānitvā` → *đã biết* (cnd6) và `vibhāvayitvā` → *làm cho rõ ràng*, `vibhūtaṁ katvā` → *làm cho sáng tỏ*. `sayamabhiññātaṁ` ở `5.1` → *tự mình thắng tri*: trong 1.339 khoá chứa `abhiññ-`, *thắng tri* 449 và *liễu tri* 95; `aññāya` (khác từ) vẫn dịch *liễu tri* theo `snp5.9:4.1` và `cnd6`.
  - `pañcindriyāni` → *năm căn*: 91/99 khoá chứa `pañcindriyāni`, 0 khoá *năm quyền*. `sammappadhāne` → *chánh cần*: 12/14, 0 *chánh tinh cần*. `satta bojjhaṅge` → *bảy giác chi* 99/99.
  - `kāmacchando` → *dục tham*: 32/37; `kāmogho` → *dòng lũ dục* (2/2, `dn33`, `dn34`); `kāmayogo` → *ách dục*; `kāmupādānaṁ` → *dục thủ*; `kāmacchandanīvaraṇaṁ` → *triền cái dục tham*. Các từ còn lại của chuỗi `kāma-` (`kāmarāgo` *tham dục*, `kāmanandī` *dục hỷ*, `kāmataṇhā` *dục ái*, `kāmasineho` *dục luyến*, `kāmapariḷāho` *dục nhiệt não*, `kāmamucchā` *dục mê*, `kāmajjhosānaṁ` *dục chấp mắc*) theo `mn36`, `mn100`, `an4.10`; không có bản gộp nào của cả chuỗi 12 từ trong tầng.
  - `sabbasaṅkhārasamatho` → *sự lắng dịu mọi hành*: 28 khoá; *lắng dịu* 4, *lắng tĩnh* 2 (còn lại diễn đạt khác); `sabbūpadhi` → *sanh y* (`dn14`, `mn64`).
  - `vitakka` → *tầm*: 186 khoá chứa `vitakko`; *tầm* 67, *suy nghĩ* 44, *tưởng* 52; chọn *tầm* theo `dn22:19.55`–`19.60` (cùng chuỗi `rūpavitakko loke…`) và `dn33`. `vicāra` → *tứ*. `piyarūpaṁ sātarūpaṁ` → *đáng yêu, dễ chịu* và các mục `cakkhu loke…` theo đúng `dn22:19.5`–`19.66` (44 khoá chứa `piyarūpaṁ sātarūpaṁ`).
  - `apāyaloke` → *cõi đọa xứ* (`apāya`: *đọa xứ* 132, *ác thú* 151, *cõi khổ* 14 trên 339 khoá; chọn *đọa xứ* vì đi với `loka` là *cõi*, không phải *ác thú*), `khandhaloke`/`dhātuloke`/`āyatanaloke` → *thế giới các uẩn/giới/xứ* (0 tiền lệ).
  - `jina` → *bậc Chiến Thắng* (147/248). `Bāvarī` → *Bāvari* theo `snp5.1` và `cnd1` (tầng viết ngắn).
  - `kenaṭṭhena` → *do ý nghĩa nào mà là…* theo `ps1.9:1.1`/`ps2.8:2.1`.
  - Nhãn: `Cūḷaniddesa` → *Tiểu Tập Kể Lược*, `Pārāyanavagganiddesa` → *Kể Lược Phẩm Bờ Kia*, `Pucchāniddesa` → *Kể Lược Các Câu Hỏi*, tên bài và colophon theo `cnd6:0.1`–`0.4`, `28.7` (*niddesa* → *Kể Lược*; người biên tập có thể đổi hàng loạt khi chốt tên).

  **Số Pāli.** `cattāro` ×3 = 4 (*bốn niệm xứ*, *bốn chánh cần*, *bốn thần túc*); `pañca balāni`/`pañcindriyāni` = 5; `satta bojjhaṅge` = 7; `aṭṭhaṅgikaṁ` = 8 chi (*Thánh đạo tám chi phần*); `catūhi kāraṇehi` ×2 = 4 (*bốn lý do*; ở `12.7`/`22.11` Pāli chỉ nêu mục đầu `kāye…` rồi lược `…pe…`, nên bản Việt không liệt kê đủ bốn, khác `cnd6:13.6`–`13.7` nêu đủ). Không có số lớn, không có `sahassa`/`sata`/`navuti`, không có cụm `tiṁsakappasahassa`; phép kiểm số chạy trên các số nhỏ nêu trên và đều khớp cấu tạo từ.

  **Bất định (không thêm vào thân kinh).**
  1. `3.1` `huraṁ`/`paraṁ`/`pure`/`paṭhamataraṁ gotamasāsanā`: bốn trạng từ đi với ablative. `huraṁ` dịch *trước* theo `snp5.9:1.3`; `pure` *xưa trước*; `paṭhamataraṁ` *sớm hơn*; riêng `paraṁ` dịch *ngoài* (nghĩa gốc *bên kia, ngoài*), vì chú giải xếp nó làm đồng nghĩa của `huraṁ` mà nghĩa *sau* sẽ ngược hẳn câu kệ. Bốn cụm `buddhasāsanā jinasāsanā tathāgatasāsanā arahantasāsanā` ở cuối là các tên khác của `gotamasāsanā`, dịch thành danh sách *giáo pháp của…* không thêm chữ *trước*.
  2. `23.1`–`23.6` `diṭṭhadhammābhinibbutā`: kệ (`21.2`, `26.2`) dùng lại `snp5.9:4.2` (*đã tịch tĩnh ngay trong đời này*, `diṭṭhadhamme`), nhưng chính chú giải ở `23.2` tách `diṭṭhadhammā` thành *những vị đã thấy/biết/cân nhắc… pháp* (bahubbīhi), nên ở các khoá lemma `23.1`, `23.6` bản Việt theo cách đọc của chú giải (*đã thấy pháp, đã hoàn toàn tịch tĩnh*). Hai cách đọc cùng một cụm Pāli được giữ riêng ở hai chỗ, không hoà vào nhau; người biên tập quyết định có muốn thống nhất không.
  3. `6.1` `amarāvitakka` → *tầm về sự bất tử*: không có tiền lệ trong tầng và tầng Anh không có bản nào; nghĩa kỹ thuật (nghĩ về cõi bất tử / mong bất tử) chưa phân xử được, nên dịch sát chữ.
  4. `6.1` `anavaññattipaṭisaṁyutta` → *gắn với việc không bị khinh miệt* (`an3.101:2.3` dịch *gắn với danh vọng*, không sát chữ); `parānudayatā` → *lòng thương xót người khác*.
  5. `23.5`, `24.2` chuỗi `santattā samitattā vūpasamitattā nijjhātattā nibbutattā vigatattā paṭippassaddhattā` + `santā upasantā vūpasantā nibbutā paṭippassaddhā`: 0 tiền lệ trong tầng; dịch theo gốc từ (*làm yên lặng, làm an hòa, làm lắng dịu, làm tiêu mòn, làm tịch tĩnh, làm biến mất, làm dịu xuống*). `nijjhātattā` → *làm tiêu mòn* là cách đọc chưa chắc, và sắc thái giữa các từ gần nghĩa chỉ phân biệt được bằng chữ Việt khác nhau, không có chứng cứ độc lập.
  6. `11.5` `monaṁ vuccati ñāṇaṁ`: `mona` dịch *sự hiền trí* theo `moneyya` (`dn33:1.10.126`, `an3.122`); `saṅgajāla` → *lưới ràng buộc*.
  7. `12.9` `caranto viharanto iriyanto vattento pālento yapento yāpento` (0 tiền lệ): *sống, trú, vận hành, tiếp diễn, duy trì, nuôi dưỡng, kéo dài* theo nghĩa gốc.
  8. `13.5`, `25.5` `loke vesā visattikā loke vetaṁ visattikaṁ`: `vesā` = `vā esā`, `vetaṁ` = `vā etaṁ` (*hoặc… này, hoặc… ấy*); dịch *này… hay… ấy*. `patareyyaṁ` → *vượt ra*, `nitthiṇṇā` → *đã vượt thoát* là cách đọc theo gốc từ.
  9. `19.1` `tāṇapadaṁ leṇapadaṁ saraṇapadaṁ` → *trạng thái che chở, nương náu, nương tựa* theo `dn3:1.21.4` và `mn35:14.4`.
  10. `1.2`, `8.2` `(iccāyasmā hemako)` dịch *(Tôn giả Hemaka nói,)* đúng `snp5.9:1.2`; `27.2` không có nháy trong Pāli nên bản Việt cũng không có (`cnd6:28.6` có nháy vì Pāli của nó có).
  11. `10.2` `Tvan ti bhagavantaṁ bhaṇati`: dịch *Ngài: nói với Đức Thế Tôn* (`bhaṇati` ngôi ba, ý là người nói đang xưng hô với Đức Thế Tôn).

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (147/147, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` và dấu lược `…` khớp Pāli từng khoá (0/147 lệch; 20 khoá có `…pe…`, đều thành đúng một `…`; 8 khoá có `…` trần, đều có `…`); không có `(…)` ở Pāli nên không có ở Việt; 0 khoá rỗng; NFC; không khoảng trắng thừa; Pāli lọt sang Việt chỉ gồm tên riêng (`Bāvari`) và lemma `Iccā`.
