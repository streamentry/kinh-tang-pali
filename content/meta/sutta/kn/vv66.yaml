  Bản dịch chỉ từ Pāli root do commit đã ghim không có bản Anh upstream (giới hạn upstream).
  Đầy đủ 10 tiêu chí scorecard; status bắt buộc draft do blocker tầng tham khảo Anh; technical_integrity 9.6.

  Kiểm toán độc lập 2026-10-11 (lượt cải thiện; thay thế điểm tự chấm 2026-10-03)
  Đọc đối kháng cặp Pāli↔Việt cả 23 khoá. Đã sửa 18 khoá; không đổi segment ID hay tập khoá. Lỗi nghĩa thật ở 9 khoá, còn lại là thêm chữ ngoài Pāli, đổi tiêu đề và đồng bộ tiền lệ.
  Sửa nghĩa thật: 1:1 `vanaṁ cittalataṁ` bản cũ "khu vườn Cittalata" (đảo `vana` = rừng thành vườn; ngự uyển là `uyyāna` ở 1:2) và thêm "rực rỡ"; nay "khu rừng Cittalatā tỏa sáng". 1:2 bản cũ bỏ mất `uttama`, chỉ có "tối thắng" cho `seṭṭha`; nay "ưu việt, tối thượng", `tidasa` = "Tam Thập" (bám Pāli như vv65; tầng hiện có 9 khoá "chư thiên Tam Thập" so với 10 "chư thiên Tam Thập Tam" nên chưa phải đa số rõ). 2:1 `mahānubhāvo` bản cũ "đại uy danh" (6 khoá lan trong bộ) — `anubhāva` là oai lực, không phải danh tiếng; nay "có đại oai lực". 3:3 `yassa kammassidaṁ phalaṁ` bản cũ "quả báo của nghiệp này là như thế" (đại từ quan hệ bị đọc thành chỉ định, mất mệnh đề quan hệ; lan 52+ khoá trong bộ); nay "về nghiệp mà đây là quả báo", khớp vv65 và các bài vv đã kiểm toán. 4:1 `bhariyā ca` bản cũ "vợ con" (thêm "con" = con cái, Pāli chỉ có vợ); nay "cùng với vợ mình". 4:3–4:4 `annañca pānañca pasannacittā` bản cũ bỏ cơm ăn nước uống khỏi 4:3, đẩy sang 4:4 "vật thực và đồ uống dồi dào", lại thêm "hoan hỷ"; nay 4:3 "Cơm ăn và nước uống, với tâm tịnh tín", 4:4 "bố thí rộng rãi" (`vipulaṁ`). 5:1 `tena` bản cũ "Do nhân duyên ấy" (thêm nghĩa), nay "Nhờ vậy" (47 khoá).
  Bỏ chữ không có trong Pāli: 1:4 "rực rỡ"; 3:1 "vô cùng"; 4:2 "cho mọi người"; 5:3 "rực rỡ"; 2:3 "mà … được … dường ấy" gọn lại "Do đâu ngài có oai lực rực rỡ như thế" (8 khoá, `jalita` giữ "rực rỡ"). 4:1 "cõi người" giữ; xưng hô "Con"→"Tôi" (người nói là thiên tử đáp Tôn giả; 47 khoá dùng "tôi" ở 5:1, và 4:4 "chúng tôi"). 2:2 "làm phước đức" (9 khoá). 2:4 "khắp bốn phương"→"khắp muôn phương" (`sabbadisā`, đa số rõ).
  Thuật ngữ: `vimāna` đổi "thiên cung/tòa thiên cung" thành "cung điện" ở 0:4, 1:3, 6:1 (tầng: 363 "cung điện/Cung Điện" so với 15 "thiên cung/Thiên Cung"). 0:4 và 6:1 `agāriya` = "người tại gia" giữ (khớp vv65). 0:2 `Purisavimāna` giữ "Thiên Cung Của Nam Giới" — đúng, không có `ākāsa`; không chạm vào dạng "Nam Hư Không" lan ở 390 khoá vv.
  Giữ bất định, KHÔNG phân xử được: 4:2 `opānabhūtā` = "như một nơi cấp phát nước uống" (nghĩa gốc: giếng, chỗ múc nước uống chung; giữ như vv65 để hai bài cùng Pāli không lệch; bản cũ "giếng nước công cộng cho mọi người" có "cho mọi người" ngoài Pāli nên không giữ). 1:4 `tiṭṭhati` = "đang chiếu sáng", không thêm "lơ lửng" (tầng 4 khoá "lơ lửng" so với 2 khoá "rực rỡ chiếu sáng"; "lơ lửng" thêm nghĩa nên không theo). 1:1 `cittalataṁ` (a ngắn) coi là tên khu rừng Cittalatā theo tiền lệ vv18, thig14.1, tha-ap8; có thể là tính từ "dây leo muôn màu" — Pāli không phân xử.
  Chấm lại: semantic_fidelity 9.3 → 9.0; terminology 9.2 → 9.0; ambiguity_integrity 9.2 → 9.0; vietnamese_clarity 9.3 → 9.2 (3:3 nay đứng riêng sau `…`, hơi lửng); các tiêu chí khác giữ nguyên; triangulation 7.5 vì không có bản Anh độc lập. Điểm cũ cao hơn bản cũ có lỗi nghĩa nên bị hạ về ngang vv65 sau sửa. final_score 9.23 → 9.15 (trung bình số học thô). Blocker tầng tham khảo Anh giữ nguyên (giới hạn upstream).
  Kiểm: tập khoá 23/23 khớp Pāli, thứ tự khớp; nháy kép khớp Pāli từng khoá (23 khoá đo, 0 lệch; không có nháy đơn); `…pe…` → một `…` (2/2 khoá); NFC; Pāli trùng nguyên văn trong bài: 1 cặp (3:2 và 5:2, đều `…pe…`) và Việt giống nhau; không Pāli lọt sang bản Việt. technical_integrity 9.6; các lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
