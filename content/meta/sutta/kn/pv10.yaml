notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv10_root-pli-ms.json` (66/66 khoá, đủ và đúng thứ tự Pāli).

  - Tầng tham khảo:
    Tầng `english-sujato` không có pv10; `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Coverage English: mẫu số = 0 — mọi khoá Pāli của bài đều ngắn hơn 40 ký tự (dài nhất 29), nên cổng coverage không đo được gì; đây không phải bằng chứng đồng thuận về cách dịch. Vì ba tầng đều vắng, `triangulation` đặt 7.5 (không quá 8.0) và bài giữ `draft` với blocker `noEnglishEditionUpstream`. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài và tiền lệ cùng bộ.
  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” giữ nguyên như các bài pv khác; `0.2` Uragavagga → “Phẩm Rắn” (pv1–pv9, pv11 và các bài cùng phẩm).
    + `0.3` “10. Chuyện Ngạ Quỷ Nữ Khallāṭiya” theo khuôn “N. Chuyện Ngạ Quỷ …” của pv8, pv9, pv11; `Khallāṭiyā` (người đàn bà hói) giữ nguyên làm tên riêng, không dịch nghĩa. `16.1` “Chuyện ngạ quỷ nữ Khallāṭiya, thứ mười.” (Pāli `dasamaṁ`), theo khuôn colophon của pv9.
  - Số Pāli — tự tính:
    + `catūhi māsehi` (12.1) = 4 tháng (catu 4); `catukkaṇṇaṁ catudvāraṁ` (13.1) = bốn góc, bốn cửa; `yojanasataṁ` (14.3) = 100 do-tuần (sata 100), cùng cách với tha-ap59:4.3 và tha-ap6:8.1; `dasamaṁ` (16.1) = thứ mười. Không còn số nào khác.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + `dakkhiṇā` → “phần cúng dường” / “vật cúng dường”: pv4:4.1, pv5:11.1, kp7:12.1 (3/3). `dakkhiṇaṁ ādisati` (5.2, 6.4, 7.1 `anuddiṭṭhe`) → “hồi hướng”: pv20:8.3 và ja288:2.2 dùng cách khác nhau; chọn “hồi hướng” vì nghĩa chuyển phần cúng dường cho người đã khuất.
    + `Devate` → “nữ thiên”: 11 khoá so với “thiên nữ” 16 khoá toàn tầng, nhưng ở nhóm cùng công thức `Devate pucchitācikkha` (vv29, vv30, vv36, vv38, vv48) đa số là “nữ thiên”; theo phạm vi gần nhất. Cụm `pucchitācikkha` dịch “được hỏi xin hãy nói” (vv47:3.3 “được hỏi hãy nói rõ”), không theo “hãy nói lời hỏi” của vài bài vv vì làm lệch nghĩa Pāli (pucchita “được hỏi” + ācikkha “hãy nói”).
    + `kissa kammassidaṁ phalaṁ` (9.4) → “đây là quả báo của nghiệp nào?”: vv47:3.4 “đây là quả báo của nghiệp gì?”; các bài khác của vv dịch “quả báo ấy là do nghiệp nào” (9 khoá cùng Pāli, hai cách).
    + `ujubhūta` (10.3) → “chân thành”: 6 khoá so với “chánh trực” 4 khoá, “ngay thẳng” 1 khoá; theo vv19, vv23, vv25 là các bài cùng công thức `Adāsiṁ ujubhūtesu`.
    + `vippasannena cetasā` (10.4) → “với tâm hoàn toàn tịnh tín”: tha-ap445:3.4, tha-ap220:4.4 (2/3 tiền lệ cùng Pāli).
    + `caramāna` (10.1) → “đang đi đó đây”: Pāli chỉ nói bhikkhu caramāna, không có `piṇḍāya` (khác vv29:5.3 `piṇḍāya caramānassa`), nên không thêm “khất thực” vào lời kinh.
    + `aṭṭīyāmi harāyāmi` (2.1) → “ngượng ngùng, hổ thẹn”; thig6.3:2.3 `aṭṭiyāmi harāyāmi` đã dịch “kinh tởm và hổ thẹn” (1 tiền lệ), nhưng ở đây ngữ cảnh là hổ thẹn vì trần truồng nên chọn “ngượng ngùng”.
    + `Kāsi` → “vải Kāsi” (kāsikuttama, 8.2): tên xứ Kāsi giữ nguyên như ja282:2.4; “thượng hạng” cho `uttama`.
    + `yojana` → “do-tuần” (tha-ap6, tha-ap59, ja399).
  - Trùng nguyên văn trong bài: 2 cặp (1.3 = 3.5, 1.4 = 3.6), cả hai bản Việt giống hệt nhau, 0 cặp Việt khác. Trùng với bài khác trong tầng: 9 khoá (0.1, 0.2, 4.4, 9.3, 9.4, 10.3, 10.4, 11.1, 14.3); 0.1, 0.2 dùng lại nguyên văn; các khoá còn lại dùng lại ý theo tiền lệ nhưng khác chữ vì cú pháp liền kề khác (ghi lý do ở mục thuật ngữ).
  - Bất định — ghi lại, không thêm vào thân kinh:
    + `doṇinimmajjaniṁ` (10.2): hapax trong toàn tầng Pāli root của kinh tạng ngoài vv33:89 (nhan đề `Doṇinimmajjanidāyikāvimānavatthu`, bài này chưa có bản Việt). Cấu tạo `doṇi` “cái máng, chậu” + `nimmajjanī` (gốc `nimmajjati` “cạo, chà sạch”, dn23:9.8) → dịch sát cấu tạo là “dụng cụ cọ rửa máng”. Đồng thời vv33:89–100 liệt kê các vật dụng dâng cho tỳ-kheo (đai, quạt, dù, dép…) nên đây có vẻ là một vật dụng, không phải phần ăn. Không có chú giải hay bản dịch độc lập trong tầng đã ghim để xác định rõ vật gì và dùng ra sao; người biên tập có thể sửa khi có nguồn. Vì chỗ này `semantic_fidelity` 8.8 và `ambiguity_integrity` 8.7.
    + `Esetthupāsako` (4.3): đọc là `esa ettha upāsako` “vị cư sĩ này ở đây”; Pāli không nói rõ vị ấy là ai trong đoàn thương nhân. `etaṁ` (5.1) hiểu là chỉ vị cư sĩ này, vì 6.1–6.3 nói các thương nhân tắm rửa, xoa hương, khoác y cho `taṁ` (vị ấy) rồi hồi hướng cho nàng.
    + Người nói: Pāli không ghi người nói ở các kệ 1, 3, 9 (đoàn thương nhân hỏi) và 2, 4–5, 10–15 (ngạ quỷ nữ đáp); canonical text không thêm nhãn người nói. Dấu nháy mở ở 4.1 và đóng ở 5.4, mở ở 10.1 và đóng ở 15.4 là của Pāli, giữ khớp từng khoá.
    + `dīghamantaraṁ` (11.2) hiểu là trạng ngữ thời gian cho `anubhomi` (“hưởng suốt một quãng dài”); `tañca dāni parittakaṁ` (11.4) không có chủ ngữ rõ nên để nguyên “nay chỉ còn ít ỏi” (có thể là phần quả còn lại hoặc quãng thời gian còn lại), nối với 12.1–12.2 (còn bốn tháng).
    + `Uddhaṁ catūhi māsehi` (12.1) → “Sau bốn tháng nữa”: `uddhaṁ` “quá, sau” chỉ mốc thời gian từ nay.
    + `sabbakāmasamiddhinī` (5.4) → “đầy đủ mọi điều ước muốn”: tiền lệ vv29:3.2 dịch khác (“làm cho mọi ham muốn được thành tựu”), chọn cách bám sát hình thái `samiddhinī` “đầy đủ, thịnh vượng”.
    Vì các chỗ trên và thiếu bản Anh độc lập, `ambiguity_integrity` 8.7.
  - Kiểm tra: 66/66 khoá đúng tập và thứ tự Pāli; NFC, không khoá rỗng, không khoảng trắng thừa; nháy kép “ ” khớp Pāli từng khoá (12 khoá có nháy: 1.1, 1.4, 2.1, 2.4, 3.1, 3.6, 4.1, 5.4, 9.1, 9.4, 10.1, 15.4), nháy đơn 0/0; dấu lược `…` 0/0 (Pāli không có); `(…)` 0; không Pāli lọt vào thân bản dịch ngoài tên riêng và thuật ngữ giữ nguyên (Petavatthu, Khallāṭiya, Kāsi). Đã đọc đối chiếu từng cặp Pāli↔Việt.
