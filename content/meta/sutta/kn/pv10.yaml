  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” giữ nguyên như các bài pv khác; `0.2` Uragavagga → “Phẩm Rắn” (pv1–pv9, pv11 và các bài cùng phẩm).
    + `0.3` “10. Chuyện Ngạ Quỷ Nữ Khallāṭiya” theo khuôn “N. Chuyện Ngạ Quỷ …” của pv8, pv9, pv11; `Khallāṭiyā` (người đàn bà hói) giữ nguyên làm tên riêng, không dịch nghĩa. `16.1` “Chuyện ngạ quỷ nữ Khallāṭiya, thứ mười.” (Pāli `dasamaṁ`), theo khuôn colophon của pv9.
  - Số Pāli — tự tính:
    + `catūhi māsehi` (12.1) = 4 tháng (catu 4); `catukkaṇṇaṁ catudvāraṁ` (13.1) = bốn góc, bốn cửa; `yojanasataṁ` (14.3) = 100 do-tuần (sata 100), cùng cách với tha-ap59:4.3 và tha-ap6:8.1; `dasamaṁ` (16.1) = thứ mười. Không còn số nào khác.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + `dakkhiṇā` → “phần cúng dường” / “vật cúng dường”: pv4:4.1, pv5:11.1, kp7:12.1 (3/3). `dakkhiṇaṁ ādisati` (5.2, 6.4, 7.1 `anuddiṭṭhe`) → “hồi hướng”: pv20:8.3 và ja288:2.2 dùng cách khác nhau; chọn “hồi hướng” vì nghĩa chuyển phần cúng dường cho người đã khuất.
    + `Devate` → “nữ thiên”: 11 khoá so với “thiên nữ” 16 khoá toàn tầng, nhưng ở nhóm cùng công thức `Devate pucchitācikkha` (vv29, vv30, vv36, vv38, vv48) đa số là “nữ thiên”; theo phạm vi gần nhất. Cụm `pucchitācikkha` dịch “được hỏi xin hãy nói” (vv47:3.3 “được hỏi hãy nói rõ”), không theo “hãy nói lời hỏi” của vài bài vv vì làm lệch nghĩa Pāli (pucchita “được hỏi” + ācikkha “hãy nói”).
    + `kissa kammassidaṁ phalaṁ` (9.4) → “đây là quả báo của nghiệp nào?”: vv47:3.4 “đây là quả báo của nghiệp gì?”; các bài khác của vv dịch “quả báo ấy là do nghiệp nào” (9 khoá cùng Pāli, hai cách).
    + `ujubhūta` (10.3) → “chân thành”: 6 khoá so với “chánh trực” 4 khoá, “ngay thẳng” 1 khoá; theo vv19, vv23, vv25 là các bài cùng công thức `Adāsiṁ ujubhūtesu`. [Đã thay ở lượt kiểm toán 2026-10-11: số đếm này sai, xem mục cuối; nay dùng “ngay thẳng”.]
    + `vippasannena cetasā` (10.4) → “với tâm hoàn toàn tịnh tín”: tha-ap445:3.4, tha-ap220:4.4 (2/3 tiền lệ cùng Pāli).
    + `caramāna` (10.1) → “đang đi đó đây”: Pāli chỉ nói bhikkhu caramāna, không có `piṇḍāya` (khác vv29:5.3 `piṇḍāya caramānassa`), nên không thêm “khất thực” vào lời kinh.
    + `aṭṭīyāmi harāyāmi` (2.1) → “ngượng ngùng, hổ thẹn”; thig6.3:2.3 `aṭṭiyāmi harāyāmi` đã dịch “kinh tởm và hổ thẹn” (1 tiền lệ), nhưng ở đây ngữ cảnh là hổ thẹn vì trần truồng nên chọn “ngượng ngùng”.
    + `Kāsi` → “vải Kāsi” (kāsikuttama, 8.2): tên xứ Kāsi giữ nguyên như ja282:2.4; “thượng hạng” cho `uttama`.
    + `yojana` → “do-tuần” (tha-ap6, tha-ap59, ja399).
  - Trùng nguyên văn trong bài: 2 cặp (1.3 = 3.5, 1.4 = 3.6), cả hai bản Việt giống hệt nhau, 0 cặp Việt khác. Trùng với bài khác trong tầng: 9 khoá (0.1, 0.2, 4.4, 9.3, 9.4, 10.3, 10.4, 11.1, 14.3); 0.1, 0.2 dùng lại nguyên văn; các khoá còn lại dùng lại ý theo tiền lệ nhưng khác chữ vì cú pháp liền kề khác (ghi lý do ở mục thuật ngữ).
  - Bất định — ghi lại, không thêm vào thân kinh:
    + `doṇinimmajjaniṁ` (10.2): hapax trong toàn tầng Pāli root của kinh tạng ngoài vv33:89 (nhan đề `Doṇinimmajjanidāyikāvimānavatthu`, bài này chưa có bản Việt). Cấu tạo `doṇi` “cái máng, chậu” + `nimmajjanī` (gốc `nimmajjati` “cạo, chà sạch”, dn23:9.8) → dịch sát cấu tạo là “dụng cụ cọ rửa máng”. Đồng thời vv33:89–100 liệt kê các vật dụng dâng cho tỳ-kheo (đai, quạt, dù, dép…) nên đây có vẻ là một vật dụng, không phải phần ăn. [Lập luận này đã bị bác ở lượt kiểm toán 2026-10-11: vv33:80–88 trước mục 89 là các món ăn (kể cả cháo xoài ở 88), nên vị trí 89 không chứng minh được “vật dụng”; nay bỏ “dụng cụ”, xem mục cuối.] Không có chú giải hay bản dịch độc lập trong tầng đã ghim để xác định rõ vật gì và dùng ra sao; người biên tập có thể sửa khi có nguồn. Vì chỗ này `semantic_fidelity` 8.8 và `ambiguity_integrity` 8.7.
    + `Esetthupāsako` (4.3): đọc là `esa ettha upāsako` “vị cư sĩ này ở đây”; Pāli không nói rõ vị ấy là ai trong đoàn thương nhân. `etaṁ` (5.1) hiểu là chỉ vị cư sĩ này, vì 6.1–6.3 nói các thương nhân tắm rửa, xoa hương, khoác y cho `taṁ` (vị ấy) rồi hồi hướng cho nàng.
    + Người nói: Pāli không ghi người nói ở các kệ 1, 3, 9 (đoàn thương nhân hỏi) và 2, 4–5, 10–15 (ngạ quỷ nữ đáp); canonical text không thêm nhãn người nói. Dấu nháy mở ở 4.1 và đóng ở 5.4, mở ở 10.1 và đóng ở 15.4 là của Pāli, giữ khớp từng khoá.
    + `dīghamantaraṁ` (11.2) hiểu là trạng ngữ thời gian cho `anubhomi` (“hưởng suốt một quãng dài”); `tañca dāni parittakaṁ` (11.4) không có chủ ngữ rõ nên để nguyên “nay chỉ còn ít ỏi” (có thể là phần quả còn lại hoặc quãng thời gian còn lại), nối với 12.1–12.2 (còn bốn tháng).
    + `Uddhaṁ catūhi māsehi` (12.1) → “Sau bốn tháng nữa”: `uddhaṁ` “quá, sau” chỉ mốc thời gian từ nay.
    + `sabbakāmasamiddhinī` (5.4) → “đầy đủ mọi điều ước muốn”: tiền lệ vv29:3.2 dịch khác (“làm cho mọi ham muốn được thành tựu”), chọn cách bám sát hình thái `samiddhinī` “đầy đủ, thịnh vượng”.
    Vì các chỗ trên và thiếu bản Anh độc lập, `ambiguity_integrity` 8.7.
  - Kiểm tra: 66/66 khoá đúng tập và thứ tự Pāli; NFC, không khoá rỗng, không khoảng trắng thừa; nháy kép “ ” khớp Pāli từng khoá (12 khoá có nháy: 1.1, 1.4, 2.1, 2.4, 3.1, 3.6, 4.1, 5.4, 9.1, 9.4, 10.1, 15.4), nháy đơn 0/0; dấu lược `…` 0/0 (Pāli không có); `(…)` 0; không Pāli lọt vào thân bản dịch ngoài tên riêng và thuật ngữ giữ nguyên (Petavatthu, Khallāṭiya, Kāsi). Đã đọc đối chiếu từng cặp Pāli↔Việt.
  - technical_integrity 9.6: cổng kỹ thuật do người điều phối chạy — npm run validate; npm test; npm run check; npm run build.
  - Kiểm toán độc lập 2026-10-11 (đọc đối kháng 66/66 khoá, đối chiếu Pāli từng khoá, đo tiền lệ toàn tầng):
    + Phát hiện chính: `doṇinimmajjaniṁ` (10.2). Bản trước chọn “dụng cụ cọ rửa máng”, tức đọc đuôi `-anī` là danh từ chỉ công cụ rồi suy đó là “vật dụng” từ vị trí của vv33:89. Cách đó không vững: (a) trong vv33, mục 89 nằm giữa các món ăn (80–88, có cháo xoài ở 88) và các vật dùng (90 trở đi), nên vị trí không phân xử được; (b) bản Việt nguyên bài ở mục Tra cứu toàn văn (Bhikkhu Indacanda, dựa bản BJT) đọc cả hai chỗ pv10 và vv33:89 là một món bánh làm từ mè (2/2), tức nghĩa “thứ vét/ép ra từ máng” chứ không phải dụng cụ; (c) trong pv10, bản trước cũng chép nguyên một giả định “vật dụng” vào lời kinh. Chỉ dùng bản đó để hiểu cách đọc, không chép câu chữ. Vì vậy canonical text nay dịch sát cấu tạo mà không khẳng định công cụ hay món ăn: “thứ vét từ máng” (`doṇi` “máng, chậu”; `nimmajjanī` thứ được cọ/vét sạch). Bất định còn nguyên: Pāli root, toàn tầng Pāli (hapax, chỉ có pv10:10.2 và vv33:89.1) và tầng đã ghim không đủ để chọn giữa “dụng cụ” và “món ăn bằng mè”; chưa có chú giải hay từ điển trong kho để kiểm. Người biên tập có thể sửa khi có nguồn; nếu xác nhận nghĩa “bánh mè” thì vv33:89 cũng cần đổi theo.
    + Khoá đã sửa (7/66): 2.4 bỏ “quá” (appakaṁ chỉ là “ít”, không có sắc thái “quá”); 5.1 “khoác y” → “khoác y phục” (cùng `acchādayitvāna` ở 6.3, tránh hiểu như y của tăng sĩ; người được khoác là một cư sĩ); 9.1–9.2 bỏ chữ “là” làm “hình dạng” thành chủ ngữ của “cung điện” (Pāli `sucittarūpaṁ ruciraṁ` là hai tính từ của `vimānaṁ`), `sucittarūpa` → “nhiều màu rực rỡ” theo ja526:37.2 (“nhiều màu, rực rỡ”, 1/1); 10.2 như trên; 10.3 `ujubhūta` → “ngay thẳng”; 15.3 thêm “và” cho `ca` của `phalañca` (bản trước bỏ mất `ca`).
    + Đo lại tiền lệ `ujubhūta`: toàn tầng 39 khoá chứa dạng này; trong đó “ngay thẳng” 17, “chánh trực” 9, “chân thành” 9 (đều thuộc các bài vv/tha-ap cùng công thức), “chân chính” 1, “cao thượng” 1. Con số 6/4/1 ở mục thuật ngữ cũ không tái lập được. “Chân thành” là sắc thái khác (thành thật) so với `ujubhūta` “trở nên ngay thẳng”; các bài nikāya (sn, an) dùng “ngay thẳng/chánh trực” (26 khoá) nên theo đa số. Các bài vv22, vv23, vv24, vv19, vv37 và tha-ap248, tha-ap504 còn “chân thành” — ngoài phạm vi, chưa sửa.
    + Số cặp Pāli trùng nguyên văn với bài khác trong tầng: 35 khoá của pv10 (không phải 9 như ghi cũ), trong đó 0.1, 0.2, 3.1, 5.2, 5.4, 7.1–7.4, 8.1–8.2 (4 bài pv cùng công thức), 12–14 (pv19, pv38), 15.1–15.2 dùng lại nguyên văn hoặc gần nguyên văn; các chỗ Việt khác: 4.1 (pv16 “chàng”, người được nói đến khác), 4.4, 6.3 (pv15 dạng phân từ nhiều người), 9.3 và 9.4 (các vv không thống nhất, mỗi dạng ≤ 5 khoá; không chép), 11.1 (pv32, pv33, ja415 dùng “Do nghiệp thiện ấy” vì cú pháp liền kề khác; ở đây `kammassa kusalassa` là sở hữu cách của `vipākaṁ` ở 11.2 nên giữ “Quả của nghiệp thiện ấy”), 12.2, 14.1–14.4 (mn129/mn130 và ja530 cùng công thức, khác nhẹ vì ngữ cảnh). Không có cặp trùng trong chính bài mà Việt khác (1.3=3.5, 1.4=3.6).
    + Đã kiểm và giữ nguyên dù nghi: `13.2` “đo đạc đều đặn” (3 bài pv/ja dùng lại; Pāli `bhāgaso mitaṁ` “đo theo phần”, “đều đặn” hơi diễn giải nhưng đã là tiền lệ 2/3 khoá cùng Pāli); `14.4` chủ thể của “lan tỏa” không nêu (theo mn129:16.10, giữ “lan tỏa khắp”); `0.3` `Khallāṭiya` giữ tên riêng (khác pv1–pv9 vốn dịch nghĩa danh hiệu như pv9 “Thợ Dệt Vải Lớn”; `khallāṭa` “hói” nhưng ở 2.3 nàng được tóc che thân, nên không dịch nghĩa); `4.1` “ngài” (người nữ gọi người thương nhân).
    + Chấm lại: `source_provenance` 9.4 → 9.2 (số đếm tiền lệ và lập luận “vật dụng” trong ghi chú cũ không kiểm lại được); `semantic_fidelity` 8.8 → 8.6 (bản trước khẳng định một nghĩa có khả năng sai ở 10.2 và bỏ `ca`, thêm “quá”; đã sửa nhưng danh từ ở 10.2 vẫn chưa phân xử được); `terminology` 8.8 → 8.7 (`ujubhūta` lệch đa số, số đếm sai; 10.2 chưa chốt); `triangulation` 7.5 → 7.7 (nay đã đối chiếu thêm một bản Việt độc lập ở mục Tra cứu toàn văn và các bài pv cùng công thức, vẫn không có bản Anh nào nên không vượt 8.0). Các tiêu chí khác giữ nguyên. Điểm cuối 8.98: dưới 9.0 nên nếu công cụ tính lại theo bảng ở docs/quality-assessments.md thì bài thuộc `review`; blocker `noEnglishEditionUpstream` giữ nguyên (sự thật về upstream).
    + Kiểm sau sửa: 66/66 khoá đúng tập và thứ tự Pāli; nháy kép khớp Pāli từng khoá (12 khoá), nháy đơn 0/0; không có dấu lược; NFC; không khoá rỗng; không Pāli lọt vào thân bản dịch ngoài tên riêng. technical_integrity vẫn 9.6: cổng kỹ thuật do người điều phối chạy (npm run validate; npm test; npm run check; npm run build).
