notes: |-
  `Dhutaṅgapañha`, câu hỏi thứ hai của `Anumānavagga` (phẩm thứ tư của `Anumānapañha`). 131 khoá Pāli, đã dịch đủ 131/131 (dịch mới toàn bài), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài có ba phần: kệ dẫn (`1.1`–`3.4`), lời hỏi của Milinda và lời đáp dài của Nāgasena (nháy kép mở ở `12.1`, đóng ở `62.1`), rồi lời cảm tán và hai dòng kết (`63.1`–`65.1`).

  **Coverage English (đo thật, không đoán).** Mẫu số = số khoá Pāli có nội dung theo `source/layers.yaml` (từ 40 ký tự, chuẩn hoá khoảng trắng, bỏ khối `:0.x`) = **104** trên 131 khoá. Chữ English có ở tầng đã ghim = **0** nên ratio = 0.0000, dưới ngưỡng floor 0.8. Cả ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng cho uid này, nên bài không được tuyên bố đã đối chiếu English hay Việt hiện hành ở bất kỳ khoá nào; mọi chỗ khó phải tự đứng trên Pāli, ngữ cảnh trong chính bài và tiền lệ nội bộ của tầng Việt đã dịch. Đây là lý do `draft` (xem `blocking_errors`).

  **Tiêu đề và ba đầu 0.x.** `0.1` `Milindapañha` giữ nguyên Pāli (227/238 khoá `Milindapañha` trong tầng kn). `0.2` `Anumānapañha` → "Câu hỏi về suy luận" (22/28 khoá cùng Pāli; 5 khoá giữ Pāli). `0.3` `Anumānavagga` → "Phẩm Suy Luận": 0 tiền lệ cho đúng chuỗi này, dịch theo khuôn "Phẩm …" của các phẩm mil6.x kề bên (mil6.2.x "Phẩm Năm Điều Đã Vứt Bỏ", mil6.3.x "Phẩm Vessantara") và theo tầng tên `mil-name:201.mil-anumanavagga` "Inference" (suy luận). `0.4` `2. Dhutaṅgapañha` → "2. Câu Hỏi Về Hạnh Đầu-đà", cùng khuôn viết hoa chữ đầu từng từ với `mil6.3.12:0.4`; tầng tên có "The Voluntary Austerities" (`mil-name:203.mil6.4.2`). Hai dòng kết: `64.1` "Câu hỏi về hạnh đầu-đà, thứ hai." và `65.1` "Phẩm Suy Luận, thứ tư." theo khuôn `mil6.3.12:8.1`/`:9.1` ("…, thứ mười hai." / "…, thứ ba.").

  **Số Pāli, đã tự tính từng cụm.** `pañcakoṭimattā` = chừng 5 koṭi (`8.1`); `sattapaṇṇāsasahassāni` = 7 + 50 = 57 ngàn và `tīṇi ca satasahassāni` = 3 trăm ngàn (`8.1`), viết đúng hai phần rời nhau như Pāli, cộng lại 57.000 + 300.000 = 357.000 (không nhân thành một số). `paññāsasahassāni tīṇi ca satasahassāni` = 50.000 + 300.000 = 350.000 (`9.1`). `vīsati` 20 koṭi (`8.2`); `navuti` 90, `cuddasa` 14, `asīti` 80 (hai lần), `aṭṭhārasa` 18, `tiṁsa` 30 koṭi (`9.1`). `caturāsīti` = 4 + 80 = 84, nên 84.000 mỗi cuộc gặp (`10.2`, `sahassa` = 1.000); `soḷasa` 16 đại quốc, `tīsu maṇḍalesu` 3 vùng. `koṭisata` = 100 koṭi, `koṭisahassa` = 1.000 koṭi, `koṭisatasahassa` = 100.000 koṭi (`5.1`), cùng thang với "một trăm ngàn koṭi" đã dùng ở `mil5.1.3`, `bv17`, `bv18`, `bv20`. `aṭṭhavīsati` 8 + 20 = 28, `aṭṭhārasa` 8 + 10 = 18, `dasa` 10, `terasa` 3 + 10 = 13, `tiṁsa` 30, `aṭṭhattiṁsā` 8 + 30 = 38 (`52.1`). `satayojanike` 100 do-tuần (`49.1`). `dasasahassilokadhātu` "mười ngàn thế giới" (`61.1`, cùng cách với `mn120`, `mn123`). Các danh sách được đếm lại bằng cách tách mục: 28 đức (`12.3`), 18 đức (`13.3`), 10 hạng (`14.3`), 13 hạnh (`53.3`), 30 đức (`60.2`), và hai danh sách song song 30 / 30 ở `48.1` / `48.2` khớp từng mục với nhau (nước↔làm nảy mầm hạt giống sa-môn hạnh … quyền chủ tể↔làm chủ trọn vẹn các pháp của bậc Thánh).

  **Dùng lại nguyên văn.** Dò toàn tầng kn (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 5 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 296 cặp, trong đó 0.1 (227 giữ Pāli), 0.2 (22/28 "Câu hỏi về suy luận"), `12.2` `Katame aṭṭhavīsati?` (1 tiền lệ `mil5.1.9:4.2` "Thế nào là hai mươi tám?" → dùng lại), `14.2` `Katame dasa?` (2 tiền lệ khác nhau: `mil6.3.2:15.2` "Mười hạng nào?" nói về hạng người, `mil6.1.6:2.2` "Mười pháp ấy là gì?" nói về pháp → chọn "Mười hạng nào?" vì bài này hỏi về hạng người), `50.2` `Kiṁ kāraṇā?` (toàn tầng: "Vì cớ gì?" 23, "Vì lý do gì?" 2, "Vì cớ sao?" 1; riêng mil6: "Vì lý do gì?" 2, "Vì cớ sao?" 1, "Vì cớ gì?" 1; hai phạm vi cho đa số khác nhau, nhưng mẫu mil6 chỉ 4 khoá nên theo toàn tầng "Vì cớ gì?"). Trùng nguyên văn trong chính bài: 1 nhóm (`18.2` và `19.2`), và bản Việt của hai khoá giống hệt nhau, nên không có cặp trùng nội bộ nào mà Việt khác. Hai đoạn công thức không trùng nguyên văn nhưng rất gần nhau trong bài nên được giữ cùng một lời: câu "những người tại gia … chứng ngộ" ở `15.1`/`16.2`/`17.2`, và đoạn mười ba hạnh "đã được thường làm … làm cho viên mãn" ở `53.3`/`54.2`/`55.2`/`56.2`/`59.2`; chỉ khác chỗ Pāli khác (`15.1` `tattha`, `16.2` `tattheva` "chính ở đó").

  **Văn xưng.** `bhante nāgasena` → "thưa tôn giả Nāgasena": trong mil6 "Thưa tôn giả" 161, "Bạch ngài" 35, "Thưa Đại đức" 19, "Bạch tôn giả" 16, "Thưa ngài" 10; toàn mil: 503 / 238 / 101 / 103 / 72; theo đa số cả hai phạm vi. `mahārāja` → "này Đại vương": trong mil6 "Này Đại vương" 242, "Tâu đại vương" 70, "Thưa Đại vương" 66, "Bạch đại vương" 6; toàn mil 953 / 643 / 128 / 21; riêng mil6.3 là 133 "Này" / 66 "Thưa" / 14 "Tâu", và bài kề `mil6.3.12` dùng "thưa Đại vương" theo `mil6.3.11` ở bài kề nó; tôi theo đa số của cả hai phạm vi chứ không theo bầy kề. `bhante` của Upasena nói với Đức Phật → "Bạch Thế Tôn".

  **Thuật ngữ, đã đo trên tầng.**
  - `dhutaṅga`/`dhutaguṇa`/`dhutaguṇavara` → "hạnh đầu-đà": tầng kn viết "đầu-đà" 5 và "đầu đà" 10 (toàn bộ nikāya: 7 so với 18), nên đa số toàn tầng là không gạch nối; nhưng ở mil6.1.3 (câu hỏi đôi của bài này, `dhutaguṇasamādānaṁ` và `terasasu dhutaguṇesu`) cả hai chỗ đều "hạnh đầu-đà", cùng `tha-ap551` "hạnh đầu-đà", chỉ `mil7.3.10` và `ud4.6` viết "đầu đà". Tôi theo mil6.1.3 vì cùng đề tài, cùng người hỏi và cùng Pāli; đây là chỗ phạm vi gần nhất và phạm vi tầng cho đa số khác nhau, ghi để người biên tập quyết định thống nhất.
  - `sacchikaroti` (với `nibbānaṁ`) → "chứng ngộ": 21/21 khoá trong mil (20 ở mil6). `santaṁ paramatthaṁ nibbānaṁ` → "Niết-bàn an tịnh, mục đích tối thượng": 0 tiền lệ cho cả cụm; `paramattha` → "mục đích tối thượng" theo `snp5.19`, `thag16.3` ("mục đích tối thượng") và `snp1.12`/`snp1.3` ("mục đích tối hậu"/"mục tiêu tối hậu").
  - `dhammābhisamayo` → "sự giác ngộ Chánh pháp": 19/20 khoá trong mil; `abhisamiṁsu` cùng gốc → "đã giác ngộ Chánh pháp".
  - `jinasāsana` → "giáo pháp": 38/43 khoá trong mil. `devātideva` → "Thiên Trung Thiên" theo `mil5.4.7` (prose), `mil5.1.8:11.1` cho đúng khuôn `devātidevena … varalañchake`. `naradammasārathi` → "bậc điều phục những người đáng được điều phục" theo `mil5.1.3`.
  - `khattiya` → "Sát-đế-lợi" (mil có 7 lần "Sát-đế-lợi" so với 2 lần "kshatriya"); `abhisiñcati` → "làm lễ quán đảnh" (mil có `mil3.7.1` "xức dấu làm vua", ít khoá, nên theo tiếng Việt Phật học thông dụng).
  - Mười ba hạnh đầu-đà (`53.3`): `paṁsukūlika`→"mặc y phấn tảo", `tecīvarika`→"chỉ dùng ba y", `piṇḍapātika`→"chỉ ăn khất thực" theo `ud4.6`; `āraññika`→"sống trong rừng", `abbhokāsika`→"sống ngoài trời" theo `mn40:5.6`; các tên `an5.184`–`an5.190` làm đối chiếu tên ngắn.
  - `sallekhitācāra` → "hạnh kiểm đoạn giảm", theo `mil6.1.3:6.3` ("sống đời thanh tịnh đoạn giảm") và `mil5.5.9:10.3` ("hạnh đoạn giảm"). `pāpiccho` → "ác dục" (`mil7.5.7`), `appiccho` → "ít muốn" (`mil6.1.3`), `saddhāpabbajita` → "xuất gia vì lòng tin" (`an1.210`, `an5.7`, `sn12.22`), `pahitatta` → "tinh cần" (`mn100`).
  - Hình phạt ở `50.1`: dùng lại cách đặt tên của `mn129` (cả ba khoá `mn129:4.2`, `29.2`, `29.4`) — "kiểu nồi cháo, kiểu cạo vỏ ốc, kiểu mỏ Rāhu, kiểu tràng hoa lửa, kiểu đuốc tay, kiểu vặn dây cỏ, kiểu y vỏ cây, kiểu hình con nai, kiểu móc thịt, kiểu đồng tiền, kiểu muối chua, kiểu xoay then, kiểu nệm rơm"; tầng có hai cách khác ở `mn13`/`mn14` và `an2.1`, chọn cách của `mn129` vì được ba khoá dùng. `pheṇuddehakaṁ paccati` → "sùng sục trong bọt nhớt" (`mn129`, `mn130`, `an7.72`); `aṭṭassaraṁ karoti` → "kêu la đau đớn" (`sn19`).
  - `bhisakko sallakatto` → "thầy thuốc giải phẫu" (mil5.1.3, 5.2.3, 5.3.3, 5.5.10, 6.1.5); `navaṅge buddhavacane` → "chín phần lời dạy của Đức Phật" (3 trên 5 khoá mil dùng "chín phần …"); `saṁyuttanikāyavaralañchake` (`mil5.1.8:11.1`) làm khuôn cho `61.2` "phần mang dấu ấn cao quý của Tăng Chi Bộ"; địa danh `Sāvatthī` 125 lần trong kn, `Rājagaha` 40, `Bārāṇasī` 11; "Isipatana … vườn Lộc Uyển" theo `mn`.

  **Nháy.** Pāli đặt dấu nháy kép mở ở `1.1` (đóng ở `3.4`, lời của người kể chuyển sang lời vua); `4.2`, `5.1`, `6.1` mỗi khoá tự đóng; `6.2` mở và đóng ở `10.3`; `11.1` mở và đóng ở `11.10`; `12.1` mở và đóng ở `62.1` (lời Nāgasena dài 86 khoá); `63.1` tự đóng. Nháy đơn: `51.1`, `57.2` tự đóng; `58.1` mở nháy đơn cùng một nháy kép lồng bên trong và đóng ở `58.2`; `62.1` mở nháy đơn và đóng cả nháy đơn lẫn nháy kép của `12.1`. Đã kiểm khớp Pāli từng khoá cho cả bốn loại nháy `“ ” ‘ ’`: 0 khoá lệch trên 131 khoá.

  **Dấu lược.** Pāli có ba khoá `…pe…` (`50.4`, `52.2`, `55.2`), cả ba giữ đúng một `…`, không mở rộng; không khoá nào có `(…)` trần. Phần mở rộng ở khoá sau (`50.5`, `52.3`, `55.3`) giữ đủ nội dung như Pāli. `50.4` và `52.2` lược nội dung đã nêu đủ ở `49.1`/`51.1` trong cùng bài (đúng nghĩa peyyāla); `55.2` lược nội dung đã nêu đủ ở `53.3`/`54.2` trong cùng bài.

  **Lỗi bản nháp bắt được khi đọc đối kháng.** (1) `61.1` và `57.1` mở bằng `Nanu` — bản nháp đầu dịch "Chẳng phải … hay sao?" thành câu hỏi ngay giữa đoạn kể làm ngắt mạch, nên đổi sang "Quả vậy, này Đại vương, …" (`nanu` ở đây là tiểu từ khẳng định). (2) `12.2`, `14.2`, `50.2` ban đầu tự diễn đạt ("Hai mươi tám đức nào?", "Mười hạng người nào?", "Vì lý do gì?"), sau khi đo tiền lệ đã đổi về cách đa số.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `1.3` `gihī` và `1.4` `ṭhite` được đọc là đối cách số nhiều ("vua lại thấy những người tại gia đã an trú trong quả Bất lai"). Cách đọc khác `gihī rājā` "vua tại gia" không có chứng cứ trong bài, và `ṭhite` sẽ không còn danh từ để bổ nghĩa.
  2. `3.1`–`3.4`: câu `so me kaṅkhaṁ vinessatī` dùng `me` (ngôi thứ nhất) ngay sau hai câu nói về vua ở ngôi thứ ba; giữ nguyên chuyển ngôi của Pāli, dịch "cho ta" và đóng nháy ở `3.4`.
  3. `8.1` `pañcakoṭimattā ariyasāvakā …`: đọc là "có chừng năm koṭi thánh đệ tử cư sĩ", rồi "năm mươi bảy ngàn và ba trăm ngàn vị đã an trú trong quả Bất lai" (động từ `patiṭṭhitā` ở cuối câu). Pāli không có "trong số ấy" nên bản Việt cũng không thêm; cũng có thể đọc 5 koṭi và 357.000 là hai con số cho hai nhóm khác nhau; bản Việt giữ cấu trúc của Pāli, không giải. `9.1` có cấu trúc liệt kê không có động từ (`abhisamiṁsu` chỉ xuất hiện ở cuối); bản Việt để động từ "đã giác ngộ Chánh pháp" ở mục cuối, đúng thứ tự Pāli, và không gán rõ cho mục đầu (350.000 thánh đệ tử ở Rājagaha).
  4. `12.3` hai mục `ārakkhā` ("có sự hộ vệ") và `saṁvarahitaṁ` ("có lợi cho sự thu thúc"): 0 tiền lệ, dịch sát chữ; `khamanaṁ` → "nhẫn nại".
  5. `14.3` danh sách mười tính từ dưới nhãn "mười hạng người": giữ đúng như Pāli, không chèn chữ "người" vào từng mục; `atthavasī` → "biết sống theo lợi ích" (0 tiền lệ); `anujjhānabahulo` → "ít bắt bẻ" (theo `sn1.35` `ujjhānasaññī` "hay bắt bẻ").
  6. `27.1` `manoharasamaṁ` → "viên ngọc vừa ý": `manohara` đứng riêng, nhưng cùng bài `47.1`/`51.1` dùng `manoharamaṇiratanaṁ`, nên chọn "ngọc".
  7. `6.2` `sallekhitācārappaṭipattidhutavaraṅgaguṇanissitā` và `6.4` `…dhutaṅgaguṇadharanissitā` là hai dạng tổ hợp hơi khác nhau của cùng một ý; dịch `6.2` "nương vào hạnh kiểm đoạn giảm, sự thực hành và các đức của chi phần đầu-đà cao quý", `6.4` "… và người giữ các đức đầu-đà" (theo `dhara`). `6.4` `sampādake sati` → "khi có người làm cho thành tựu": 0 tiền lệ, nghĩa sát chữ.
