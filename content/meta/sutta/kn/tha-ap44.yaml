notes: |-
  Dịch trực tiếp từ Pāli root, đủ 120/120 khoá, đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài này không có tầng Anh đã ghim nên không có đối chiếu English độc lập; xem blocking_errors. Cấu trúc: lời kể của Soṇa về tiền kiếp dâng lối kinh hành và tòa nhà dài cho Đức Phật Anomadassī (1 đến 5, nháy kép mở ở 1.1), lời thọ ký của Đức Phật (6 đến 25, nháy đơn mở ở 6.1 và đóng ở 25.4), lời tự thuật của Soṇa ở đời cuối (26 đến 29, nháy kép đóng ở 29.3), lời kết (30) và lời kết bài (31). Người kể ahaṁ dịch tôi; Đức Phật tự xưng trong lời thọ ký dịch ta (6.2, 6.3, 6.4).

  Tiền lệ: dựng chỉ mục Pāli sang Việt trên toàn tầng tha-ap hiện có (501 bài ngoài bài này). 48/120 khoá có Pāli trùng (bỏ dấu câu, không phân biệt hoa thường) với khoá của bài khác; tổng 2.731 cặp trùng đã dò, 400 cặp trong đó chuỗi Việt khác với bản ở đây (kể cả khác chỉ dấu câu hoặc chữ hoa đầu dòng, vì tầng không đồng nhất dấu cuối dòng). 25/48 khoá có Việt trùng đúng dạng đa số của tầng. Các khoá khác đa số có lý do: 1.4 (1 tiền lệ tha-ap50 dịch lối đi lát bằng; chọn lối kinh hành vì caṅkama là thuật ngữ đi kinh hành, các tiền lệ tha-ap222 và tha-ap482 cũng chỉ dịch lối đi); 1.1 (1 tiền lệ tha-ap26 dịch Của bậc Mâu-ni vì cùng genitive nhưng ở đó động từ nằm ngay khoá sau, ở đây chủ thể cho ai được làm rõ bằng Vì); 3.1 (20 tiền lệ nhưng không dạng nào chiếm đa số, nhiều dạng thêm chữ ngoài Pāli như cung kính; dịch sát chữ Sau khi chắp tay lên); 3.4 (1 tiền lệ dịch từ tế, không có nghĩa; niyyādesiṁ ở tầng 2 khoá dịch dâng hiến nên theo dạng đó); 4.1 (31 tiền lệ, 14 ta, 13 tôi; bài này người kể là tôi nên chọn tôi, còn lời Đức Phật dịch ta); 7.2 (3 tiền lệ, 2 ghi đầy đủ phước nghiệp; thêm người để nối với chủ thể ở 7.1); 9.3 (1 tiền lệ đầy đủ lầu gác tuyệt hảo và 1 tiền lệ ngôi nhà nóc nhọn; kūṭāgāra giữ nghĩa nóc nhọn theo tiền lệ tha-ap18 và khoá Kūṭāgārasahassāni); 12.1 dùng lại nguyên văn 4/4 tiền lệ Đã thọ hai thành tựu; 14.1 (7 tiền lệ, 5 ghi Vào vô lượng kiếp trước, 2 ghi Sau vô lượng kiếp kể từ nay; các tiền lệ ghi trước là câu kể quá khứ, ở đây bhavissati ở 14.4 là tương lai nên dùng dạng 2/7 theo chỉ dẫn của người điều phối là lời thọ ký tương lai dịch sau … kiếp nữa); 20.4 (19/19 tiền lệ dịch okkākakulasambhavo là sinh ra trong dòng họ Okkāka vì ở đó chủ ngữ là Đức Phật Gotama; ở đây đứng sau bhedo nên giữ phát sinh từ dòng họ Okkāka, xem bất định); 22.1 (3 tiền lệ khác nhau, dùng Sau khi mệnh chung từ thân ấy theo tha-ap51); 24.1 (3 tiền lệ, 2 ghi Tôi, 1 ghi Vị ấy; ở đây là lời thọ ký nên Vị ấy); 24.4 (14 tiền lệ, 7 ghi sẽ vô lậu mà đi vào Niết-bàn, 7 ghi sẽ nhập Niết-bàn, không còn lậu hoặc, trong đó tha-ap36 và tha-ap43 cùng phạm vi; chọn dạng thứ hai); 25.4 (2 tiền lệ ghi sẽ đặt vào chỗ tối thượng; đổi thành sẽ đặt vị ấy vào vị trí tối thượng cho khớp đối tượng ở 24, giữ chữ tối thượng đúng với aggaṭṭhāna); 28.2 (2 tiền lệ khác nhau, dạng đa số không có; tha-ap97 dịch abhijātaṁva kesariṁ là tựa chúa sư tử dòng dõi tôn nghiêm nên dùng như sư tử dòng dõi cao quý). Trong chính bài có 2 cặp Pāli trùng (5.3 với 28.3, 8.2 với 22.2), cả hai Việt khớp nhau; khác biệt chỉ ở dấu câu cuối dòng theo Pāli.

  0.3 và 31.1: Pāli 0.3 là 2 Soṇakoḷivisattheraapadāna, BẮT ĐẦU bằng số thứ tự nên giữ số theo hình thức N. (đo trên các khoá 0.3 có số ở Pāli trong tầng tha-ap: giữ số 128, bỏ số 18; tha-ap43 và tha-ap45 cùng phẩm cùng giữ số); translationTitle bằng đúng giá trị 0.3. Tên bài nhận khuôn Bài Kệ Tuyên Ngôn Về Trưởng Lão cộng tên. Ba dạng đo được trên khoá 0.3 của tầng tha-ap (ngoài bài này): toàn tầng Tuyên Ngợ 251, Tuyên Ngôn 132, Ký Sự 111, Tuyên Ngợi 10; ở phạm vi gần nhất tha-ap36 đến tha-ap52 Tuyên Ngôn 10, Tuyên Ngợ 3, Ký Sự 3; ở phẩm Upāli (tha-ap43 đến tha-ap52) Tuyên Ngôn chiếm đa số. Toàn tầng cho đa số Tuyên Ngợ nhưng đó là dạng sai chính tả; phạm vi gần nhất cho Tuyên Ngôn, nên chọn Tuyên Ngôn như tha-ap43 và tha-ap45. Người biên tập nên phán một lượt cho cả cuốn. 31.1 kết thứ hai (dutiyaṁ = thứ 2). Tên Soṇakoḷivisa giữ liền như Pāli ở 0.3 và 31.1 theo tha-ap45; ở lời kết 30.1 tách Soṇa Koḷivisa theo soṇo koḷiviso. Công thức lời kết 30.1 theo nhóm Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (497/501 khoá cùng công thức; chỉ 2 khoá ghi số ít). 0.1 Therāpadāna giữ nguyên Pāli theo 490/501 tiền lệ; 0.2 Upālivagga dịch Phẩm Upāli theo 9/9 tiền lệ.

  Số Pāli, tự tính: tiṁsakappasahassāni (10.1) = tiṁsa 30 x sahassa 1.000 = 30.000, dịch ba mươi nghìn kiếp; tiṁsa là 30 chứ không phải 3, vì ở tha-ap26:8.1 tiṁsakkhattuñca được dịch ba mươi lần, và 5/5 tiền lệ cùng Pāli ở tầng đều ghi ba mươi nghìn kiếp; pañcavīsati kappāni (10.3) = pañca 5 + vīsati 20 = 25, dịch hai mươi lăm kiếp; sattasattatikkhattuñca (11.1) = satta 7 + sattati 70 = 77, dịch bảy mươi bảy lần (cả 3 tiền lệ cùng Pāli đều ghi bảy mươi bảy); aṭṭhavīsatikappamhi (12.3) = aṭṭha 8 + vīsati 20 = 28, dịch sau hai mươi tám kiếp nữa (tiền lệ ekavīsatikappamhi ở tha-ap18 dịch Sau hai mươi mốt kiếp; locative kappamhi cũng có thể là trong kiếp thứ hai mươi tám, xem bất định); soḷasitthisahassānaṁ (15.1) = soḷasa 16 x sahassa 1.000 = 16.000, dịch mười sáu ngàn phụ nữ; nava putte (15.4, 16.1) = 9 người con trai; dve sampattī (12.1) = 2; sahassayutta (7.3) = 1.000 (tha-ap26:6.3 dịch thắng một ngàn); caturaṅgula (26.1) = 4 ngón tay (khớp thag19.1:47.1 caturaṅgule tiṇe, bản Sujato dịch cỏ cao bốn inch); catasso (29.1) = 4. Cụm Tiṁsakappasahassa là cụm số duy nhất từng bị nghi ngờ trong tầng (3.000 hay 30.000 kiếp); ở đây chốt theo chỉ dẫn của người điều phối là tiṁsa = 30, kèm 5/5 tiền lệ nêu trên.

  Thuật ngữ: caṅkama lối kinh hành (xem trên); sudhā vôi vữa (1 tiền lệ vôi trắng); dīghasālā tòa nhà dài (0 tiền lệ trong tầng; không dịch thành giảng đường hay hội trường vì Pāli chỉ nêu sālā dài); vitāna tán che (0 tiền lệ); tādī bậc Vững Vàng kiên định ở 1.2 (10/19 tiền lệ cùng Pāli, gồm tha-ap36, tha-ap50, tha-ap52, tha-ap53 cùng phạm vi), và bậc Như Thị ở 26.3 nơi tādino đứng với payutta; byamha cung điện (tầng quen dùng cung điện, thiên cung); pavara cao quý; mahāraha vô cùng quý giá; Vissakamma giữ nguyên; paṭisambhidā bốn vô ngại giải (487/500 khoá cùng Pāli); cakkavattī Chuyển Luân Vương; devarājā vua chư thiên (tha-ap33, tha-ap43); sukkamūla cội nguồn thiện căn (24/30 tiền lệ); sakyapuṅgava bậc ưu việt của dòng Sakya (3/3 tiền lệ); mahānāga bậc Đại Long Tượng (tha-ap51); Aṅgīrasa giữ nguyên tên (tha-ap52 và tha-ap54); etadagge ṭhapesi vị trí tối thắng (4 tiền lệ); pabbājeti trục xuất; jātibheda dòng dõi bị phá vỡ; khattiyānī nữ Sát-đế-lợi; kaññā thiếu nữ; Koḷiya và Okkāka giữ nguyên tên dòng.

  BẤT ĐỊNH (không thêm vào thân kinh): (1) 26.1 đến 26.4 là chỗ chưa chắc nhất của bài, và chỉ xuất hiện đúng một lần trong toàn Pāli root đã ghim (hapax cả khoá). Ngôn từ gần với kệ Soṇa ở thag19.1:47.1 (vuṭṭhamhi deve caturaṅgule tiṇe) nhưng ở đây khác hẳn về cú pháp: caturaṅgulamhi đứng tách khỏi tiṇe; anileritaaṅgaṇamhi tôi đọc là anila-erita-aṅgaṇa (sân bị gió lay động), không có phủ định; ṭhatvāna đi với genitive yogassa payuttatādino không nêu chủ ngữ rõ; pāramatā đọc theo pāra (bờ bên kia) như tiền lệ pāramiṁ gato (tha-ap4:15.2, 20.4), có thể còn nghĩa sự tối thượng. Dịch sát chữ, không giải thích thêm; cần người biên tập có chuyên môn Pāli xem lại. (2) 8.4 sampatte kusalabbhave: kusalabbhave không phân giải chắc được (có thể là kusala + abbhava với nghĩa sinh khởi, hoặc một dạng khác); dịch khi sự sinh khởi của điều thiện đã đến, chưa phân xử được chủ thể (người ấy hay quả thiện). (3) 17.4 và 18.1 pabbājayissati và pabbājitā: động từ có thể nghĩa là cho xuất gia hoặc trục xuất; dịch trục xuất theo mạch jātibhedabhayā ở 18.3 và việc các hoàng tử phải sống cùng các chị em, nhưng nếu đọc theo nghĩa xuất gia thì câu đổi. (4) 20.3 và 20.4 bhavissati tadā bhedo, okkākakulasambhavo: không rõ okkākakulasambhavo bổ nghĩa cho bhedo (sự phân tách sinh từ dòng Okkāka) hay chỉ người con cháu; dịch phát sinh từ dòng họ Okkāka, giữ mơ hồ. (5) 12.3 aṭṭhavīsatikappamhi: locative có thể đọc sau hai mươi tám kiếp hoặc trong kiếp thứ hai mươi tám; theo chỉ dẫn của người điều phối và tha-ap18 dịch Sau hai mươi tám kiếp nữa. (6) 11.3 yasodharasanāmā te: dịch Tất cả đều mang tên Yasodhara theo 4 khoá sanāmā te ở tầng (ví dụ Tất cả đều mang tên Isimugga); ở đây te và sabbepi ekanāmakā lặp ý nên 11.4 dịch tất cả cùng chung một tên. (7) 16.4 mahesittaṁ karissati: chủ ngữ có thể là thiếu nữ (sẽ làm chánh hậu) hoặc vua Okkāka (sẽ lập nàng làm chánh hậu); chọn chủ ngữ là thiếu nữ vì kaññā đứng ở danh cách ngay trước. (8) 25.3 visesaññū: dịch bậc biết rõ sự thù thắng, không có tiền lệ cùng từ trong tầng. (9) 7.3 sahassayuttassaratho là dạng nối âm của sahassayutto ratho hoặc sahassayuttassa ratho; cả hai đều cho nghĩa cỗ xe thắng một ngàn, không thêm ngựa vì Pāli không nêu. (10) 21.3 và 21.4 anubhossatinappakaṁ: tách thành anubhossati nappakaṁ (sẽ hưởng không ít); chủ thể người ấy (Soṇa tương lai) suy từ 21.1 đến 23. (11) 19.3 Mā no jāti pabhijjīti không có dấu nháy trong Pāli nên không thêm dấu nháy ở Việt; iti dịch bằng Với ý nghĩ.

  Phép kiểm tự viết, mẫu số ghi kèm: tập khoá Việt bằng tập khoá Pāli 120/120 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 120/120 (4 khoá có dấu nháy: 1.1 mở kép, 6.1 mở đơn, 25.4 đóng đơn, 29.3 đóng kép); dấu lược 1/120 khoá có (29.2 …pe… dịch đúng một …; không có (…) và không có … trần, nên các phép kiểm đó chạy rỗng); cặp Pāli trùng trong bài 2 cặp, cả hai Việt giống nhau; không khoá rỗng, không khoảng trắng thừa; NFC đủ; không chữ số trong thân kinh (chỉ chữ số thứ tự 2. ở 0.3 theo quy ước); không Pāli lọt sang tiếng Việt ngoài tên riêng và nhan đề Therāpadāna. Đã in và đọc đối kháng 120 cặp Pāli với Việt.

  Coverage English: mẫu số = 1 khoá Pāli có nội dung (tha-ap44:30.1, 65 ký tự; 31.1 chỉ 38 ký tự; 118 khoá còn lại là tiêu đề và các vế kệ ngắn dưới 40 ký tự), Sujato phủ 0/1: tầng english-sujato đã ghim chỉ có 9 sub-collection của kn và tệp tha-ap duy nhất là tệp tên, không phải thân kinh; english-project 0 entry; vietnamese-current 0 (tầng này chỉ có Pháp Cú). Mẫu số nhỏ như vậy nghĩa là cổng coverage gần như không đo được gì: đây không phải sự đồng thuận về cách dịch mà là việc không có bản Anh nào để đối chiếu. Entry trong reference-gaps.yaml, nếu có, không cứu được published.

  Kỹ thuật: chưa chạy được các cổng trong lát này, technical_integrity đặt 9.6. Còn phải chạy: npm run validate, npm test, npm run check, npm run build.
