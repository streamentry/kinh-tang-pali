notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho `tha-ap`, xem `blocking_errors`.
  ĐO `tha-ap :0.3` theo hướng lát s7 (so với Pāli, KHÔNG so theo chuỗi Việt): 357 tệp Việt có khoá `:0.3`; Pāli `:0.3` KHÔNG có số thứ tự ở 242 tệp, và 240/242 (99,2%) bản Việt cũng không có — xác nhận con số của s7 (289/291 = 99,3%). Chiều ngược lại thì kho còn lệch: Pāli `:0.3` CÓ số ở 115 tệp mà bản Việt chỉ giữ 71 (61,7%), tức 44 tệp đang thêm số ở chỗ Pāli không có. Ba bài trong lát này đều có Pāli `:0.3` không số (`Bhisadāyakattheraapadāna`, `Gandhamāliyattheraapadāna`, `Pallaṅkadāyakattheraapadāna`) ⇒ BỎ số ở `:0.3`, đặt số ở khoá đóng, nơi Pāli thật sự có (`pañcamaṁ` / `dasamaṁ`). Mẫu tiêu đề: `Bài Kệ Tuyên Ngợ Về Trưởng Lão …` 203/357 so với `Ký Sự Về Trưởng Lão …` 89/357 và `Bài Kệ Tuyên Ngôn …` 65/357. Mẫu phẩm ở `:0.2`: `Phẩm X` 469 lần, giữ nguyên Pāli chỉ 9 lần.
  `…pe…` của Pāli giữ đúng MỘT dấu lược `…` theo 606/606 tiền lệ có số đếm trong tầng; không mở rộng ở bất kỳ khoá nào. `Therāpadāna` ở `:0.1` giữ nguyên Pāli (348/357).
  ĐỐI CHIẾU TIỀN LỆ ĐẾM ĐƯỢC (46 khoá trong bài có Pāli trùng nguyên văn ở bài khác; 23/46 dùng lại đúng nguyên văn): `Therāpadāna` 345; `Phẩm Sakacintaniya` 9 (trùng nguyên văn `tha-ap72:0.2`); `với tâm tịch tín bằng chính đôi tay mình.` cho `pasanno sehi pāṇibhi.` 7/17 (đa số cục bộ, chưa có mốc nào trong kho); `mọi cõi hữu đều đã được nhổ sạch;` cho `bhavā sabbe samūhatā;` 7; `Bốn vô ngại giải,` cho `Paṭisambhidā catasso,` 362; `…` 603; `đã làm tròn lời dạy của Đức Phật”.` 329. Còn lại chọn theo nghĩa và tiền lệ gần nhất: `Vào ba mươi mốt kiếp trước đây,` (14/47 của `Ekattiṁse ito kappe,`; hai cách khác 15 và 13 nên gần như hòa, giữ); `khi tôi làm thiện nghiệp ấy;` cho `yaṁ kammamakariṁ tadā;` (nhóm `…thiện nghiệp ấy;` 18/39 — `kammamakariṁ` không có `kusala`, nhưng 4.4 nói `kusalaṁ ropitaṁ mayā` nên `thiện nghiệp` là chứng từ trong chính bài); `Tôi không còn biết đến đọa xứ nào,` cho `Duggatiṁ nābhijānāmi,` — cụm này có 325 bản nhưng bản đa số chỉ 119 (36,6%), nên giữ dạng đã có trong hai bài anh em cùng phẩm `tha-ap72:5.3` và `tha-ap217:4.3`; `là những vị Chuyển Luân Vương có đại uy lực.` cho `cakkavattī mahabbalā.` (47 bản: `đại oai lực` 29 vs `đại uy lực` 25, gần như hòa; giữ `uy lực` cho nhất quán với `tha-ap152:4.4` cùng lát); `bậc Chấn Hòa` cho `buddhasantikaṁ` — 0 tiền lệ trong kho (bản `tha-ap142:3.2` bỏ hẳn danh từ), chọn theo nghĩa `santika` = người chấn hòa và để tránh lẫn với `Anāgāra` mà dân gian gọi là An Tịnh; `trong hàng các bậc giảng` cho `isīnaṁ tatiyo ahu;` (hapax trong phẩm, 0 tiền lệ).
  SỬA 7 LỖI TÌM ĐƯỢC TRONG TỆP DỊCH CÓ SẴN (3 tệp của lát này do agent trước để lại, không có metadata):
    (1) `6.1–6.2` LỆCH KHOÁ + SAI NGHĨA — bản cũ đẩy `soḷasa` (Pāli ở 6.2) lên 6.1 và làm `Samodhānā` thành TÊN ĐỊA ĐẠI (`Tại Samodhāna có mười sáu vị vua,`); hậu quả là 6.2 mất hẳn `mười sáu` và câu thành nghĩa sai. Đã sửa thành `Samodhāna cùng các vị vua,` / `mười sáu vị chúa tể của loài người;`.
    (2) `3.4` THÊM PHỦ ĐỊNH — bản cũ `cũng chẳng ngang bằng hay hơn thế.`; `samaṁ tena kutottariṁ.` không có phủ định nào, và `nābhijānāmi` ở 3.3 đã phủ định rồi. Đã bỏ `cũng chẳng`.
    (3) `2.1` THÊM CHI TIẾT KHÔNG NGUỒN — bản cũ `bó cỏ bùn lầy`; `Bhisamuḷālaṁ gaṇhitvā,` không có `bùn lầy` (5.4 mới nói `bhisadāna` = cho cỏ). Đã bỏ, còn `Tôi đã cầm lấy bó cỏ,` khớp `5.4` `việc cho bó cỏ ấy`.
    (4) `3.1–3.2` BỎ `Karaṇa` VÀ SAI TRƯỜNG HỢP — bản cũ `từ bậc giảng Vessabhū` dùng `từ` (cách) trong khi Pāli kết `-nā` (công cụ), lại làm Vessabhū thành người dâng quà, trái với `2.1` (`Tôi đã cầm lấy`). Đã sửa theo cách đọc ghi ở `blocking_errors` thứ hai.
    (5) `2.2` THUẬT NGỮ — `bậc An Tịnh` → `bậc Chấn Hòa` (xem tiền lệ ở trên).
    (6) `2.3` LÀM RÕ CHỦ NGỮ — bản cũ `dâng lễ dưới đôi chân Đức Phật,` bỏ hẳn chủ ngữ trong khi `Tañca` (`và cả…`) đòi có chủ thể tường minh, và `2.1` đã nói `Tôi đã cầm lấy`. Đã sửa `Tôi dâng lễ dưới đôi chân Đức Phật,`; ngôi thứ nhất là của người kể, đúng như `2.1`.
    (7) `1.1` GIỮ NGUYÊN có chủ đích — `“Có một vị tên là Vessabhū,`; cụm `Có một vị` không có tiền lệ trong kho (2/119), nhưng `Vessabhū nāma nāmena` không có chủ ngữ và 1.2 (`là bậc thứ ba…`) cần chủ ngữ, nên thêm là bối cục tiếng Việt chứ không đổi nghĩa. Ghi lại để người gộp không tưởng là lỗi sót.
  BẤT ĐỊNH (ghi ở đây, KHÔNG giải thích trong thân kinh): `Karaṇa ca pāramatṭho, vessabhūvarabuddhinā;` (3.1–3.2) là cặp hapax toàn Pāli root. Cách đọc đã chọn: `karaṇa` là công cụ của `kara` (bàn tay) nên dịch `đã dâng lên bằng tay`; `vessabhūvarabuddhinā` kết `-nā` nên là công cụ của chủ thể, và vì `1.1` giới thiệu Vessabhū là bậc thứ ba trong hàng các bậc giảng — tức nhân thứ ba, không phải chính người kể — nên đọc là `khiến tôi vượt bậc giảng Vessabhū, vị A-la-hán`. Cách đọc cạnh tranh: món quà tối thượng do chính Vessabhū dâng — sai mạch, vì `2.1` nói người kể đã cầm lấy. Cụm `khiến tôi vượt` là DIỄN GIẢI để câu đọng được, không phải chứng từ từ điển; vì vậy đã nâng thành blocker thứ hai thay vì giả vờ chắc chắn.
  Còn lại: `Hatthināgena santena` (4.3) dịch `con voi thuần phục` (`santena` = thuần phục, `hatthi` = voi); `Kappamhi cuddase āsuṁ` (6.3) dịch `Trong kiếp thứ mười bốn ấy` — `cuddase` là thứ mười bốn, `kappe` dịch `kiếp` như phần lớn tệp khác của tầng. Bài dùng ngôi `tôi` xuyên suốt.
