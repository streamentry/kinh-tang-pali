    Lỗi nghĩa thật ở 11/32 khoá (`1.2`, `2.1`, `2.2`, `2.3`, `3.1`, `3.2`, `3.3`, `3.4`, `4.3`, `5.4`, và `6.1`–`6.3` một phần), cộng chỉnh nhẹ ở `1.1`, `1.3`, `1.4`, `4.1`, `5.2`, `6.4`; tổng 19 khoá đổi, 13 khoá còn lại giữ nguyên:
    (a) `2.1`, `5.4` — `bhisa`+`muḷāla` = ngó sen và củ sen, KHÔNG phải "bó cỏ"; tiền lệ trong tầng: `tha-ap365:2.3` `Bhisamuḷālaṁ paggayha` → "ngó sen và củ sen"; `tha-ap485` dịch `bhisadānassidaṁ phalaṁ` → "quả báo của việc dâng cúng ngó sen". Tên bài Bhisadāyaka cũng là "người dâng ngó sen". Lỗi "bó cỏ" ở bản cũ lan sang `5.4`; đã sửa cả hai.
    (b) `1.2` — `isīnaṁ` = "của các ẩn sĩ" (tiền lệ 22 khoá `isi`/`isisattama` dịch "ẩn sĩ"; Đức Phật cũng được gọi `isi` ở `tha-ap133:4.2`, `tha-ap108:2.4`), không phải "bậc giảng".
    (c) `2.2` — `buddhasantikaṁ` = "đến trước/chỗ Đức Phật" (tiền lệ `agamuṁ buddhasantikaṁ` → "đi đến chỗ Đức Phật"); "bậc Chấn Hòa" là bịa, không có trong Pāli. THAY mục (5) cũ.
    (d) `2.3` — `pādāsiṁ` = `pa`+`adāsiṁ` = "đã dâng"; `Tañca` = "và thứ ấy" (chỉ ngó sen). Bản cũ "dâng lễ dưới đôi chân" bịa. THAY mục (6) cũ.
    (e) `3.1`–`3.2` — `Karena ca parāmaṭṭho, vessabhūvarabuddhinā` = "và tôi đã được bàn tay chạm đến bởi Vessabhū, bậc có trí tuệ tối thắng"; chủ thể `parāmaṭṭho` là "tôi" (`Sukhāhaṁ` ở `3.3` = `sukhaṁ` + `ahaṁ`). Bản cũ "món quà tối thượng ấy đã dâng lên bằng tay, khiến tôi vượt bậc giảng Vessabhū, vị A-la-hán" hoàn toàn không có trong Pāli (không có "quà", "vượt", "A-la-hán"). THAY mục (4) cũ và toàn bộ đoạn BẤT ĐỊNH cũ về `karaṇa`/`pāramatṭho`.
    (f) `3.3`–`3.4` — `Sukhāhaṁ nābhijānāmi` = "tôi không biết có an lạc nào" (`sukha` = an lạc, không phải "cõi"); `samaṁ tena kutottariṁ` = "ngang bằng với điều ấy, huống chi hơn thế" (`kuto` = huống chi, từ đâu mà có).
    (g) `4.3`–`4.4` — `Hatthināgena santena, kusalaṁ ropitaṁ mayā`: `santena` ở đây là "đang là", không phải "thuần phục"; cùng khuôn với `tha-ap65:4.3` `Vihaṅgamena santena, subījaṁ ropitaṁ mayā` (khi còn là một loài chim). Vậy "Khi là một con voi, tôi đã gieo trồng điều thiện" — khớp mạch kể: người kể khi ấy là một con voi đưa ngó sen cho Đức Phật.
    (h) `1.1`, `1.3`, `1.4`, `4.1`, `5.2`, `6.4`: bỏ chỗ thêm nghĩa — `Có một vị` → `Vị có tên là` (Pāli không có từ hiện hữu); `rừng Kānana` → "khu rừng rậm" (`kānana` là danh từ chung, tiền lệ 7 khoá, 5/7 dịch "rừng rậm"); `ở đó` ở `1.4` bỏ (`vihāsi` = đã an trú, tiền lệ "từng an trú"); `4.1` dịch theo tiền lệ `carimo vattate bhavo` (8/15 "đang diễn ra"); `5.2` bỏ "thiện" (Pāli chỉ `kamma`; `kusalaṁ` ở `4.4` là khoá khác); `6.4` giữ "đại uy lực" (`mahabbalā` — 25 oai lực / 16 uy lực, giữ theo `tha-ap152:4.4`).
    (i) `6.1`–`6.3` — bản cũ tách `Samodhāna` thành một nhân vật đứng cùng các vua; đọc lại `Samodhānā ca rājāno, soḷasa manujādhipā` thành nhóm vua tên Samodhāna (dạng số nhiều, đồng vị với `rājāno`); bỏ "ấy" thừa ở `6.3` (`kappamhi cuddase` = "trong kiếp thứ mười bốn"). Số: `ekattiṁse` = 31, `soḷasa` = 16, `cuddase` = 14, `catasso` = 4 — đều đã tính lại từ Pāli.
    Đã đọc đối kháng và GIỮ: `0.1`, `0.2`, `0.3`, `2.4`, `4.2`, `4.4`, `5.1`, `5.3`, `7.1`–`7.3`, `8.1`, `9.1`. Tiêu đề `Tuyên Ngợ` theo quy ước 203/357 của tầng; câu kết `Tôi nghe như vầy:` ở `8.1` theo quy ước 562/563 khoá `Itthaṁ sudaṁ` (Pāli không có `evaṁ me sutaṁ`, đây là quy ước toàn tầng — không đổi riêng một bài; đề nghị người biên tập quyết định ở cấp tầng).
    BẤT ĐỊNH CÒN LẠI (không đủ để thành blocker, vì không đổi nghĩa chính của câu kệ): (1) `Samodhānā` ở `6.1` là tên nhóm vua hay nghĩa khác — chỉ xuất hiện một lần trong toàn bộ `tha-ap`, không có song song; (2) `varabuddhinā` ở `3.2` hiểu là "trí tuệ tối thắng" (buddhi) hay biến thể của `buddha` — cả hai đều chỉ Vessabhū; (3) `isīnaṁ tatiyo` ở `1.2` — "thứ ba trong các ẩn sĩ" dịch sát chữ, không xác định thêm nhóm nào. `triangulation` giữ 7,5 (không cao hơn 8,0): không có bản Anh độc lập nào, chỉ Pāli + các bài song song cùng khuôn trong kho.
