  BẤT ĐỊNH (ghi ở đây, KHÔNG giải thích trong thân kinh): `Karaṇa ca pāramatṭho, vessabhūvarabuddhinā;` (3.1–3.2) là cặp hapax toàn Pāli root. Cách đọc đã chọn: `karaṇa` là công cụ của `kara` (bàn tay) nên dịch `đã dâng lên bằng tay`; `vessabhūvarabuddhinā` kết `-nā` nên là công cụ của chủ thể, và vì `1.1` giới thiệu Vessabhū là bậc thứ ba trong hàng các bậc giảng — tức nhân thứ ba, không phải chính người kể — nên đọc là `khiến tôi vượt bậc giảng Vessabhū, vị A-la-hán`. Cách đọc cạnh tranh: món quà tối thượng do chính Vessabhū dâng — sai mạch, vì `2.1` nói người kể đã cầm lấy. Cụm `khiến tôi vượt` là DIỄN GIẢI để câu đọng được, không phải chứng từ từ điển; vì vậy đã nâng thành blocker thứ hai thay vì giả vờ chắc chắn.
  Còn lại: `Hatthināgena santena` (4.3) dịch `con voi thuần phục` (`santena` = thuần phục, `hatthi` = voi); `Kappamhi cuddase āsuṁ` (6.3) dịch `Trong kiếp thứ mười bốn ấy` — `cuddase` là thứ mười bốn, `kappe` dịch `kiếp` như phần lớn tệp khác của tầng. Bài dùng ngôi `tôi` xuyên suốt.
