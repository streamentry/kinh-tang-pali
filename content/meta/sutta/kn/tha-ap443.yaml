notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này (đo và bằng chứng ở `blocking_errors`).
  `translationTitle` đặt BẰNG khoá `:0.3`. Quy tắc đã chốt của lát: **giữ số thứ tự khi và chỉ khi Pāli `:0.3` bắt đầu bằng chữ số**. Pāli `tha-ap443:0.3` = `1 Vibhītakamiñjiyattheraapadāna` — bắt đầu bằng `1` ⇒ giữ, thành `1. Bài Kệ …`. Đo lại trên 1.559 tệp `:0.3` đã có trong tầng: trong 121 tệp mà Pāli `:0.3` bắt đầu bằng số, kho **giữ số 51 và bỏ 70**. Tôi theo quy tắc đã chốt của lát chứ không theo đa số của kho, và ghi con số này để người điều phối gộp. Mẫu tiền lệ khớp nhất là `tha-ap298` (Pāli `6 Pādapūjakattheraapadāna` → `6. Bài Kệ Tuyên Ngợ Về Trưởng Lão Pādapūjaka`) và `tha-ap103` (Pāli `1 Bhikkhadāyakattheraapadāna` → `1. Bài Kệ …`).
  Pāli trùng nguyên văn ở 20/33 khoá, tôi dùng lại **nguyên văn cả 20**: `Therāpadāna` (348×) · `Vibhītakavagga` → “Phẩm Cây Vibhītaka” (7×; riêng trong phẩm này 7 bài dùng cách này — 444, 445, 446, 448, 449, 450, 451 — và chỉ `tha-ap447` dùng “Phẩm Quả Vibhītaka”) · `sabbadhammāna pāragū;` → “bậc đã vượt qua mọi pháp;” (3×, trùng tuyệt đối với `ja305:4.2`) · `Disvānahaṁ devadevaṁ,` → “Thấy tôi, đấng thần của các thần,” (trùng tuyệt đối với `tha-ap343:4.1`) · `Dakkhiṇeyyassa vīrassa,` → “bậc anh hùng xứng đáng nhận sự cúng dường,” (trùng tuyệt đối với `tha-ap442:2.3`) · `Imasmiṁyeva kappamhi,` → “Ngay trong chính đại kiếp này,” (2×) · `Duggatiṁ nābhijānāmi,` → “Ta không biết mình rơi vào khổ đau,” (121×) · cả khối kết 5.1–7.4 (12 khoá, giống hệt tha-ap473 và tha-ap493) dùng nguyên văn `tha-ap453:6.1–8.4` và `tha-ap483:6.1–8.4` — 73× / 7× / 3× / 74× / 2× / 2× / 7× / 86× / 357× / 21× / 29× / 324×.
  Ngôi thứ nhất chọn `ta` cho **toàn bộ** bài, không đổi giữa các khối. Lý do: khối kết đã bắt buộc `ta` (đó là cách đã công bố của 271+ bài), và `tha-ap494` — cùng họ công thức, dùng `ta` từ đầu bài tới cuối — là mẫu nhất quán sẵn có trong tầng.
  Cố ý dịch khác tiền lệ ở một chỗ: `vippasannena cetasā` có 11 cách trong tầng, phần lớn thêm từ không có trong Pāli (`với tâm tịnh tín rõ ràng`, `với tâm ý hoan hỷ, trong sáng`, `với tâm hồn vô cùng thanh tịnh`), nên tôi dịch đúng nghĩa cường tính của `vippasanna`: “với tâm ý trong sạch tột bậc;”.
  Bất định, ghi ở đây chứ không giải thích trong thân kinh: (1) `Kakusandho mahāvīro` tôi đọc là **chủ ngữ danh định** chứ không phải tân ngữ, vì khi `mahāvīro` là tân ngữ thì `sabbadhammāna pāragū` ở khoá sau không còn chủ ngữ; và `agamāsi` là thì quá khứ ngôi thứ ba (dạng 1 ngôi số một là `agamāsiṃ`), nên `so` và `agamāsi` cùng chỉ một chủ thể — tức ngài Kakusandha. Tôi dịch `:1.3` bằng “Ngài” để giữ rõ ngôi thứ ba ấy. (2) `Gaṇamhā vūpakaṭṭho` — `vūpakaṭṭha` là quá khứ thể đã nhổ bật/san phẳng, `Gaṇamhā` là công cụ của `gaṇa`; tôi dịch “đám đông như núi” để giữ hình ảnh `pabbata` mà chính Pāli dùng ở `:2.4`, nhưng cách dịch này không có tiền lệ nào trong tầng (`vūpakaṭṭha` = 0 lần). (3) `Bījamiñjaṁ` là hapax toàn tầng (`miñja` = vòng hoa, `bīja` = hạt); tôi dịch “một vòng hạt” và dùng nhất quán ở `:2.1`, `:3.4`, `:4.2`, `:4.4`, nhưng không thêm chữ giải thích. (4) `latāya āvuṇiṁ` — `āvuṇi` có thể là phủ hay trang sức; vì kế tiếp là `:3.4` “dâng lên”, tôi chọn nghĩa phủ và dịch “phủ kín bằng dây leo”. (5) `Jhāyate pabbatantare` — `pabbatantare` có 25 nơi trong tầng với 6 cách (“khe núi” 5, “núi rừng” 2, còn lại rải rác); tôi theo đa số “giữa khe núi”.
  Tên riêng `Vibhītakamiñjiya` chưa tồn tại trong tầng nên `lọt_pāli` sẽ báo Pāli lọt ở `:8.1`; tôi khai tên này vào bộ nhớ tiến trình đúng theo cơ chế mà docstring của `lọt_pāli` nêu, **không** sửa `_hvi.py` trên đĩa. Lý do hợp lệ: đây là tên riêng của chính bài, chỉ không có dưới dạng token tách vì Pāli gộp (`Vibhītakamiñjiyattherassāpadānaṁ`) — cùng tình huống `tha-ap453` đã gặp với `Jagatidāyakattherassāpadānaṁ` → `Jagatidāyaka`.
  Không khoá nào trong 33 khoá của bài này có `…pe…` hay `…` trần ở Pāli (đã kiểm 33/33), nên không có dấu lược nào phải giữ, và không có chỗ nào bịa dấu lược để che chỗ thiếu. Nhân vật lời đối thoại không có `(…)` đứng một mình.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được phép chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đúng 33/33 khoá trong `all`, `set(khoá Việt) == set(khoá Pāli)`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá (0 = 0), ngoặc kép cân trên cả bài (1 mở ở `:1.1`, 1 đóng ở `:7.4` — đúng quy ước danh sách xuyên suốt bài của SuttaCentral), không Pāli lọt, không trùng nguyên văn Pāli ở khoá có nội dung, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.