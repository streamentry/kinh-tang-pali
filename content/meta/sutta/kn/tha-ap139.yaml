notes: |-
  TẦNG THAM KHẢO — 0 khoá trên 2 có Anh Sujato; không có thư mục `kn/tha-ap/` trong edition
  `translation/en/sujato` tại commit đã ghim. Không có Việt hiện hành, không có lớp lấp `english-project`.
  ⇒ `draft`, `triangulation` 7.5.

  TIỀN LỆ ĐẾM ĐƯỢC. `Therāpadāna` giữ Pāli (262/262, 1 cách). `Sobhitavagga` → “Phẩm Sobhita” (3 nơi,
  1 cách). `Paṭisambhidā catasso` → “Bốn vô ngại giải” (275 nơi, dùng nguyên văn). `…pe…` → `…`.
  `Itthaṃ sudaṃ āyasmā X thero imā gāthāyo abhāsitthāti.` và `…therassāpadānaṃ N.` theo tha-ap138/tha-ap140.
  `tevijjā` → “tam-minh” (tiền lệ `mn`/`an`: “Bà-la-môn tam-minh”, “thông tam-minh Veda”); `chaḷabhiññā` →
  “có sáu thắng tri”; `mahiddhikā` → “có thần thông lớn”; `Khīṇāsavaṃ` → “đã tận lậu” (tiền lệ dhp420, ud1.6,
  snp1.4 đều “tận lậu”); `lokanāyaka` → “Đạo sư của thế giới”; `bhikkhusaṅghapurakkhataṃ` → “được hội chúng
  tỳ-kheo vây quanh” (tiền lệ tha-ap259:1.4 đúng câu này). `Sattaratanasampanno` → “Đầy đủ bảy món báu quý
  giá,” (25 lần, đa số đã đếm, và cùng lựa chọn với tha-ap192:5.3 trong lát này);
  `cakkavattī mahabbalo` số ít → “là Chuyển luân vương có đại thần lực.” (25 lần; khác tha-ap136:7.4
  `mahabbalā` số nhiều là “là những Chuyển luân vương có đại thần lực.” — khác nhau vì Pāli khác nhau).

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `Visālamāḷe āsīno, addasaṃ lokanāyakaṃ` (1.1–1.2) — `māḷa` là đồng cỏ / thảo trường; dịch “Ngồi giữa thảo
  trường rộng lớn”. `Visālamāḷa` còn là tên một vị trưởng lão trong `ṬA`, nhưng ở đây là danh từ vì đi kèm
  `āsīno` (ngồi); chọn nghĩa danh từ và ghi lại vì không có tầng Anh để đối chiếu.
  `ñāṇe upanidhā yassa, na vijjati sadevake` (3.1–3.2) — `upanidhā` = đã đặt xuống, nên trí tuệ ấy **có sẵn**
  không phải do học; dịch “Trí tuệ của Ngài là sẵn có, / không vắng mặt trong cõi trời và người”.
  `Dhammakāyañca dīpentaṃ, kevalaṃ ratanākaraṃ` (4.1–4.2) — `dhammakāya` là **thân pháp** của bậc Chánh Đẳng
  Giác (không phải thân thể); dịch “làm cho thân pháp sáng ngời / sáng rực suốt thời gian làm đầy báu”.
  `nāradovhayavacchalo` (5.2) — `dodhaya` = tiến công, `vacchala` = dũng cảm; dịch “không gianh sực với tán
  tổng quân”. Câu này do người thứ ba nói về người tán dương Đức Phật, nên giữ “với” để thấy đối tượng.
  `Tena cittappasādena` (6.1) — tiền lệ có **8** cách khác nhau (đếm được); không có cách nào chiếm ưu thế,
  chọn “Nhờ tâm tịnh tín ấy,” là cách ít thêm chữ nhất. `cittappasāda` là **lòng tin thanh tịnh**, không phải
  “yên lặng trong tâm”.
  `Kappānaṃ satasahassaṃ` (6.3) — tiền lệ 2 cách (“Trong suốt một trăm ngàn kiếp” / “Suốt một trăm ngàn đại
  kiếp”); chọn “Trong suốt một trăm ngàn kiếp”. `duggatiṃ nupapajjahaṃ` (6.4) — tiền lệ 4 cách, chọn “tôi
  không còn rơi vào khổ xứ.”
  `Ito tiṃsakappasate` (7.1) — `tiṃsakappasate` không có tiền lệ; dịch “Từ ba mươi kiếp trước đây,” theo
  hình “Từ … kiếp trước” đã có trong tầng.
  `sumitto nāma khattiyo` (7.2) — `khattiyo` là tầng lớp quân tộc, không phải nông dân hay hiệu trưởng;
  `Sumitta` giữ Pāli (chưa có tiền lệ trong tầng).

  DẤU LƯỢC — `:8.2` là `…pe…`; bản Việt giữ **đúng một** `…`. Đã khớp từng khoá khi ghi.

  Ngoặc kép: 1.1 mở “ và 8.3 đóng ”; 9.1 và 10.1 ngoài nháy kép. Tự đếm lại: cân.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
