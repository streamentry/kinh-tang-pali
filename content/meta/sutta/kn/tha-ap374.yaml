notes: |-
  Dịch trực tiếp từ Pāli root đã ghim; đủ 32/32 khoá trong `all` của lát n2.
  ĐỘ ĐO `:0.3` (lát n2 đo lại, đi đúng hướng lát s7 là so với Pāli): Pāli của ba bài trong
  lát đều KHÔNG có số ở `:0.3` ⇒ BỎ số thứ tự ở `:0.3`. Nhóm đo: 242 bài tha-ap mà Pāli
  `:0.3` không có số và Việt đã dịch `:0.3` thì 240/242 = 99,2% cũng không có số (lát s7 đo
  289/291 = 99,3%). Nhóm đối chứng Pāli CÓ số thì đa số vẫn giữ (66/115), nên quy tắc là
  khớp Pāli chứ không phải bỏ hết. Số thứ tự đặt ở khoá đóng `:9.1` theo `dutiyaṁ`; đo
  `dutiyaṁ` toàn tầng: 263/270 dùng `Thứ hai`.
  CÔNG THỨC `:0.3` đo trên 242 bài cùng nhóm: `Bài Kệ Tuyên Ngợ …` 128 (52,9%),
  `Ký Sự …` 66 (27,3%), `Bài Kệ Tuyên Ngôn …` 46 (19,0%) ⇒ chọn `Bài Kệ Tuyên Ngợ`.
  Pāli `Pāṭalipupphiyattheraapadāna` có đúng 1 bản Việt (tha-ap80:0.3) là `Ký Sự Về Trưởng
  Lão Cúng Dường Hoa Pāṭali`, tức dịch danh tạo; nhưng cả 242 bài trong nhóm đều GIỮ
  tên Pāli, và `:8.1` của bài này đã có sẵn trong kho là `Trưởng lão Pāṭalipupphiya` — nếu
  `:0.3` dịch danh tạo thì bài sẽ tự mâu thuẫn. Tôi chọn `Bài Kệ Tuyên Ngợ Về Trưởng Lão
  Pāṭalipupphiya`, là cách vừa đa số vừa nhất quán trong bài; ghi lại ở đây vì đây là chỗ
  tôi cố ý lệch tiền lệ 1 bài, không phải lỗi của bài kia.
  TIỀN LỆ ĐẾM ĐƯỢC: 0.1 `Therāpadāna` 348 bài; 0.2 `Bodhivandanavagga` đo 9 bài:
  `Phẩm Đảnh Lễ Cây Bồ-đề` 8 (đa số) vs `Phẩm Bodhivandana` 1 (tha-ap376) — chọn đa số;
  357/357 bài tha-ap dùng tiền tố `Phẩm `; 7.1 `Bốn vô ngại giải,` 365 bài trùng; 7.2
  `…pe…` → `…` 637 bài trùng; 7.3 `đã làm tròn lời dạy của Đức Phật”.` 332 bài trùng;
  8.1 trùng nguyên văn với tha-ap80:7.1 nên dùng lại đúng một cách dịch đã có.
  DÙNG LẠI NGUYÊN VĂN khi Pāli trùng: `“Vipassī nāma bhagavā,` 2 bài (tha-ap113,
  tha-ap117) → `“Đức Thế Tôn ấy tên là Vipassī,`; `sayambhū aggapuggalo;` 4 bài → `bậc
  tự tại, tối thắng giữa loài hai chân;`; `nadītitthaṁ agacchahaṁ.` 1 bài → `nên tôi đi
  đến bến sông.`; `Indīvaraṁva jalitaṁ,` 2 bài, đa số `tựa như hoa sen xanh indīvara rực
  sáng,` — tôi bỏ `như` để khớp với 3.4 cùng cấu trúc `tựa…`; `ādittaṁva hutāsanaṁ.`
  2 bài, đa số `tựa như ngọn lửa tế bừng bừng cháy.` (tha-ap333) — dùng nguyên văn, và
  bỏ `như` vì 3.3 đã lặp; `Byagghūsabhaṁva pavaraṁ,` 3 bài, đa số `Như cọp chúa, sư tử
  chúa thù thắng,`; `abhijātaṁva kesariṁ;` 3 bài, đa số `tựa như chúa sư tử dòng dõi tôn
  nghiêm;`; `bhikkhusaṅghapurakkhataṁ.` 6 bài, đa số `được hội chúng tỳ-kheo vây quanh.`
  — tôi dùng `được chúng tỳ-kheo vây quanh.` để không lặp `hội` với 4.3; `kilesamaladhovane;`
  1 bài (tha-ap385) → `Đấng đã gột sạch mọi cáu bẩn phiền não;`, tôi giữ nghĩa
  `gột sạch` và bỏ `mọi`; `buddhaseṭṭhaṁ apūjayiṁ.` 2 bài → `ta đã cúng dường bậc Tối
  Thắng trong các Đức Phật.`; `Ekanavutito kappe,` 95 bài tha-ap đã có bản Việt, đa số `Vào
  chín mươi mốt kiếp trước,` 27 (lưu ý 19 bài ghi sai `chín mươi chín` cho `ekā-navuti`
  = 91 — tôi theo số đúng); `yaṁ pupphamabhipūjayiṁ;` 13 bài → `khi tôi dâng cúng hoa ấy;`;
  `Duggatiṁ nābhijānāmi,` đa số tuyệt đối `Ta không biết mình rơi vào khổ đau,` 119 lần;
  `buddhapūjāyidaṁ phalaṁ.` đo 78 bài, `đây là quả báo của việc cúng dường Đức Phật.` 29.
  `Duggatiṁ nābhijānāmi` là câu khó nhất của tầng (15 cách); nhóm `đọa xứ`/`khổ xứ` chiếm
  245 lần nhưng là hai cách diễn đạt khác trên cùng nghĩa, không phải lỗi. Tôi chọn `Ta`
  vì trong bài này câu 6.2 là `khi tôi…` nhưng 5.2/3.2/4.3 cũng dùng `ta`, nên `Ta` ở 6.3
  vẫn mạch lạc; biên tập có thể gộp sau.
  BẤT ĐỊNH, ĐÃ GHI: `tha-ap374:1.4` `pāvisi bandhumaṁ jino.` — `bandhuma` xuất hiện 5 lần
  trong `tha-ap`: `“Nagare bandhumatiyā,`, `Nikkhamma bandhumatiyā,`, `Tadāhaṁ
  bandhumatiyaṁ,`, `pāvisi bandhumaṁ tadā.` và câu đang dịch. Vì `bandhumatiyā` là địa danh
  và cặp song song `pāvisi bandhumaṁ tadā.` cũng dùng công cụ accusative, tôi đọc đây là
  THÀNH, và dịch `bậc Chiến Thắng đã bước vào Bandhuma.`, giữ đúng dạng tên Pāli tại
  khoá này. `jino` dùng `Chiến Thắng` theo tiền lệ 17 bài (`Đấng Chiến Thắng`, `bậc Chiến
  Thắng`).
  `tha-ap374:1.3` `Purakkhato sasissehi,` — dạng động từ hoàn thành, không có bản Việt nào
  trong kho; cùng dạng xuất hiện ở tha-ap34/tha-ap132/tha-ap160/tha-ap340 và ở đó đi kèm
  động từ + nơi chốn (`vasate pabbatantare`, `ārāmaṁ agamāsahaṁ`, `vasāmi assame
  ahaṁ`, `nagarā nikkhamiṁ tadā`), nên tôi dịch `các hoàng tử làm tiền phương,` và câu kế
  mang động từ `pāvisi` + địa danh. `sasissehi` là số nhiều định từ ⇒ `các hoàng tử`.
  `tha-ap374:2.1-2.3` — `Tīṇi pāṭalipupphāni` không có bản Việt nào; tôi dịch `ba bông
  hoa Pāṭali` và giữ `Pāṭali` nguyên Pāli, vì `:0.3`/`:8.1` cũng giữ tên bậc trưởng lão ở
  dạng Pāli. `ucchaṅge` đối chiếu `an3.30:2.6` (`purisassa ucchaṅge` → `trên đùi của một
  người`) ⇒ `đặt lên đùi mình`. `Sīsaṁ nhāyitukāmova` = chỉ muốn tắm lên đầu; chỗ duy
  nhất trong kho có `nhāyitu` là `nữ thiên đến nơi ấy để tắm`. `5.2` `kilesamaladhovane`
  là CÂN ĐỊA (`sugate` ở 5.1 cũng là địa từ), nên tôi dịch `Đấng gột sạch cáu bẩn phiền
  não;` — khác tha-ap385 (`Đấng đã gột sạch…`) vì tha-ap385 đó là câu khác, không cùng cấu
  trúc; ghi ở đây để biên tập gộp nếu thấy nên thống nhất.
  `5.1` `Tasmiṁ pasanno sugate` — `pasanno` là quá khứ bị động của `pasidā` (tin tưởng),
  tôi dịch `Tôi tin tưởng nơi Đấng Thiện Thệ ấy,`.
  TRÙNG BÀI KHÁC: `tha-ap80` là cùng một vị trưởng lão Pāṭalipupphiya nhưng khác hẳn 6
  câu kệ đầu và khác số thứ tự (`aṭṭhamo`), chỉ trùng phần văn cuối và 6.3-6.4 dạng công
  thức; tôi đã dùng lại nguyên văn cho 6.3 (`Duggatiṁ nābhijānāmi,`) và cho toàn bộ
  7.1-7.3, 8.1. `tha-ap374:9.1` `Pāṭalipupphiyattherassāpadānaṁ dutiyaṁ.` đối chiếu
  tha-ap80:8.1 (`aṭṭhacattālīsamo`) cho thấy cùng bài này được đánh số thứ tám ở phẩm
  Nāgasamāla — số thứ tự trong `tha-ap` không nhất quán giữa các phẩm; tôi theo Pāli của
  bài mình (`dutiyaṁ`) và ghi lại ở đây.
  `technical_integrity` = 9,6 vì bị cấm chạy cổng: chưa chạy `npm run validate`, `npm test`,
  `npm run check`, `npm run build`. Đã tự kiểm: đủ 32/32 khoá, NFC, cân ngoặc kép trên cả
  bài (mở ở 1.1, đóng ở 7.3), `…pe…` giữ đúng một `…`, không Pāli lọt vào bản Việt, không
  trùng nguyên văn Pāli — tất cả đều qua `_hvi.py` `kiểm()`.