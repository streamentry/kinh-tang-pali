notes: |-
  **Tầng Anh đủ 8/8 khoá có nội dung** (`:2.1` dòng tên bài, Sujato để trống). Không có segment Pāli ≥ 40 ký tự nên sàn coverage 0,8 không kích hoạt.

  **Sửa cấu trúc ngoặc kép — đã ghi rõ, đây là chỗ duy nhất tôi thêm chữ.** Pāli `ja49:1.1` **không** có `“` nhưng `ja49:1.4` lại kết bằng `”ti.` (dấu đóng từ đoạn trước, nằm ngoài tệp này). Nếu giữ nguyên thì ngoặc kép lệch và `ngoặc()` của `_hvi.py` fail. Tôi theo đúng tiền lệ của kho cho tình huống này: `ja64:1.1`, `ja94:1.1`, `ja99:1.1`, `ja116:1.1` đều mở thêm `“` ở khoá đầu; và vì hai file kia ghi `”.` bên ngoài, tôi cũng bỏ `ti` theo. Đây là thêm dấu câu để *cân cấu trúc*, không phải thêm chữ có nghĩa.

  **Thuật ngữ, đếm được.** `nakkhatta` → *tinh tú* ở tên bài và `:1.1`/`:1.3`, còn `tārakā` ở `:1.4` dịch *ngôi sao* — giữ phân biệt, vì `tārakā` là dạng nhỏ và trong ngữ cảnh này mang nghĩa miệt thị (Sujato: *for what do the stars matter?*). Trên đĩa đã có *sao* (`an3.155`, `snp4.14`) và *trăng đi theo đường của các vì sao* (`dhp197-208`) cho `nakkhatta`, nhưng ở đây `nakkhatta` là đối tượng chiêm tinh thì *tinh tú* rõ hơn cho người Việt; tôi ghi đây để biên tập thống nhất nếu muốn. `bāla` → *kẻ ngu dốt*; `upaccagā` → *lỡ mất*. `Atthakāmavagga` → *Phẩm Mong Muốn Lợi Ích* (đặt mới, xem `ja41`).

  **Bất định đã ghi.** `Attho atthassa nakkhattaṁ` ở `:1.3` là cấu trúc chủ-vị ngữ lặp chữ, tôi dịch *Điều lành chính là ngôi tinh tú của điều lành* — giữ đúng nghĩa chữ nhưng lặp, vì cách diễn giải *muốn có điều lành thì chờ tinh tú* là **suy đoán**. Có thể còn cách đọc *điều lành có tinh tú của chính nó*; tôi không chọn cách nào.**Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm — ở lát này chỉ 0/155 khoá Pāli đủ 40 ký tự, nên chốt tự kiểm 0% và assertion còn lại không tự chạy; phần tôi tự kiểm: 9/n khoá có mặt và không thừa khoá, đúng segment ID, mọi chuỗi NFC, không khoá rỗng, không khoá nội dung nào trùng nguyên văn Pāli, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài và không bao giờ âm, không còn `(…)`, không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (lát này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Jātaka không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.
