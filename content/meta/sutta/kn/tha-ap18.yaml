notes: |-
  Dịch trực tiếp từ Pāli root, 76 khoá của lượt này cộng khoá :19.1 đã có từ lượt trước (giữ nguyên); đủ 77/77 khoá, đúng thứ tự Pāli. Bài này không có tầng Anh đã ghim nên không có đối chiếu English độc lập; xem blocking_errors.
  
  Tiền lệ: dựng chỉ mục Pāli sang Việt trên toàn tầng tha-ap (448 tệp ngoài bài này). 27/76 khoá có Pāli trùng (bỏ dấu câu, không phân biệt hoa thường) với khoá của bài khác; tổng 1.766 cặp trùng đã dò, 300 cặp trong đó bản Việt của tầng khác với bản ở đây. 17 khoá dùng lại NGUYÊN VĂN một cách dịch đã có (0.1, 0.2, 1.2, 3.4, 5.1, 6.2, 12.2, 12.3, 12.4, 13.2, 15.4, 17.3, 17.4, 18.1 đến 18.4). 10 khoá khác tiền lệ có lý do: 1.1 (tiền lệ ghi Đến Đức Thế Tôn, 4/4, nhưng ở đây động từ là santhariṁ trải, còn sở hữu cách chỉ người thụ hưởng, nên dịch Vì); 2.1 (tiền lệ Cùng hàng nghìn vị; ở đây tạo cách chỉ tác nhân của parikiṇṇo nên dịch Được hàng ngàn vị, và dùng ngàn theo tầng: sahassa 69 ngàn so với 35 nghìn); 2.4 (4 tiền lệ nguyên văn bậc hai chân, đấng Nhân Ngưu, chỉ khác dấu cuối vế); 3.3 (chỉ khác chữ hoa đầu dòng); 4.3 và 4.4 (tiền lệ dùng Ngài và tôi trong lời kệ khác; ở đây người nói là Đức Phật nên dùng ta, và tam tương liên với yena nên chỉ người cúng dường, dịch vị ấy chứ không phải Ngài); 7.3 (làm chủ bốn phương, chiến thắng theo dn17:1.3.4, cùng Pāli cāturanto vijitāvī); 7.4 (chỉ khác cách viết hoa Chuyển Luân Vương, 120 so với 73 viết thường); 12.1 (tiền lệ Trong số một trăm nghìn kỳ: kappa dịch kiếp ở toàn tầng, 145 so với kỳ 2, và Trong số không có căn cứ trong Pāli, nên dịch Sau một trăm ngàn kiếp); 13.3 (tiền lệ là diễn giải Trong hàng đệ tử, Pāli chỉ có sở hữu cách Gotamassa bhagavato đi với atrajo, nên dịch sát Của Đức Thế Tôn Gotama). Trong chính bài 0 cặp Pāli trùng, nên phép dò nội bộ chạy rỗng.
  
  0.1 Therāpadāna: 433/444 tiền lệ giữ nguyên tên Pāli. 0.2 Sīhāsaniyavagga dịch Phẩm Sīhāsaniya theo 5/5 tiền lệ cùng Pāli trong phẩm.
  
  0.3 và 20.1: Pāli 0.3 là Rāhulattheraapadāna, KHÔNG bắt đầu bằng số thứ tự nên không thêm số; translationTitle bằng đúng giá trị 0.3. Tên bài nhận khuôn Bài Kệ Tuyên Ngôn Về Trưởng Lão cộng tên. Hai dạng chính tả đo được trên khoá 0.3 của tầng tha-ap (ngoài bài này): toàn tầng Tuyên Ngợ 234, Tuyên Ngôn 97, Ký Sự 96, Tuyên Ngợi 10; ở phạm vi gần nhất (tha-ap6 đến tha-ap30) Tuyên Ngợ 6, Tuyên Ngôn 3, Tuyên Ngợi 2; trong phẩm Sīhāsaniya (tha-ap13 đến tha-ap21) Tuyên Ngợ 3, Tuyên Ngôn 2. Cả ba phạm vi cho đa số Tuyên Ngợ, nhưng đó là dạng sai chính tả; chọn Tuyên Ngôn theo hướng dẫn của người điều phối và tiền lệ tha-ap13, tha-ap15, tha-ap20. Người biên tập nên phán một lượt cho cả cuốn. 20.1 dùng lại đúng tên của 0.3 kèm thứ sáu (chaṭṭhaṁ = thứ 6; bài thứ sáu của phẩm vì tha-ap13 là thứ nhất), theo khuôn tha-ap15:10.1. Khoá 19.1 là công thức lời kết giữ nguyên từ lượt trước, thuộc nhóm Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (407 khoá), không phải nhóm số ít đã từng nói bài kệ này (21 khoá).
  
  Số Pāli, tự tính: catusaṭṭhikkhattuṁ (6.1) = catu 4 + saṭṭhi 60 = 64 lần, đối chiếu tiền lệ chattiṁsakkhattuṁ = ba mươi sáu lần; sahassakkhattuṁ (6.3) = 1.000 lần; ekavīsati (7.1) = eka 1 + vīsati 20 = 21; tīṇi sataṁ (8.3) = 3 x 100 = 300, không có đơn vị trong Pāli nên không thêm đơn vị; sattabhūma (1.3) = 7 tầng; sattaratana (9.4) = 7; dasa (10.1) = 10; aṭṭhayojanaṁ (11.4) = 8 do-tuần; kappasatasahassa (12.1) = sata 100 x sahassa 1000 = 100.000, một trăm ngàn; catasso (18.1) = 4; aṭṭhime (18.2) = 8; chaḷabhiññā (18.3) = 6; chaṭṭhaṁ (20.1) = thứ 6. Cụm Tiṁsakappasahassa không có trong bài này nên không phát sinh bất định về tiṁsa (3 hay 30).
  
  Thuật ngữ đo được trên tầng tha-ap, điều kiện theo Pāli: mahāmuni dịch Đại Mâu-ni 17, Đại Muni 4, Đại Ẩn Sĩ 5 trên 28 khoá; narāsabha dịch Nhân Ngưu 53 trên 83 khoá; dvipadinda dịch bậc hai chân 15, Lưỡng Túc Tôn 15, chúa tể loài hai chân 4 trên 42 khoá; cakkavattī Chuyển Luân Vương 120, Chuyển luân vương 73 trên 211 khoá; sahassa ngàn 69, nghìn 35 trên 113 khoá; kappa kiếp 145, kỳ 2; khattiya Sát-đế-lợi 20 trên 38 khoá; pāsāda lầu 4, lâu đài 2 trên 6 khoá; sattaratana bảy món báu 90, bảy báu 37 trên 137 khoá; yojana dịch do-tuần (140 lần so với yojana giữ nguyên 12 lần trên toàn tầng Việt); veḷuriya ngọc lưu ly (37 lần so với lưu ly trần 85 lần trên toàn tầng Việt, khoá cùng Pāli duy nhất ở tha-ap cũng ghi ngọc); tusita dịch cõi Đâu-suất (6/6 khoá tusitaṁ upapajjahaṁ đã kiểm ở tha-ap đều dịch vậy); kūṭāgāra dịch nhà nóc nhọn theo sn20.8, sn36.8, sn56.45 (nóc nhọn 15 lần trên toàn tầng Việt); Dasasaddāvivittaṁ dịch không vắng mười loại âm thanh theo dn17:1.3.10 và dn16; gandhakuṭi dịch hương thất theo thag5.11:1.4 (tiền lệ duy nhất cùng Pāli ở tha-ap172:1.3 ghi quả thơm là đọc nhầm nên không theo); Vissakamma giữ nguyên tên theo dn17 (10 lần); Therāpadāna, Rāhula, Gotama, Okkāka, Padumuttara, Sudassana giữ nguyên dạng Pāli; Vimala, Reṇuvatī chưa có tiền lệ ở tầng. Người nói Pāli ahaṁ: tầng có tôi 222, ta 187; phạm vi gần nhất (tha-ap6 đến tha-ap30) tôi 53, ta 35; nhưng khoá 17.4 có 81 tiền lệ nguyên văn dùng ta so với 27 dùng tôi, nên cả bài dùng ta (người dẫn chuyện) cho nhất quán trong bài, và Đức Phật ở khoá 4 cũng ta; hai tầng nháy lồng nhau tách bạch người nói.
  
  BẤT ĐỊNH (không thêm vào thân kinh): (1) 1.4 ādāsaṁ santhariṁ và 4.1 đến 4.2 jotitā seyyā, ādāsova susanthato: dịch sát chữ, tấm gương được trải và chiếc giường được làm cho sáng rực như tấm gương trải khéo; chưa rõ tấm gương là vật trải giường hay phủ nền, nên không giải thích thêm. seyyā dịch giường theo nghĩa thông dụng. (2) 6.4 bhavissati anantarā: dịch sẽ kế tiếp liền sau đó; có thể là kế tiếp liền sau kiếp chúa chư thiên hoặc liên tục nối nhau, chưa phân xử được. (3) 7.1 và 12.1 kappamhi (vị trí cách số ít): dịch Sau hai mươi mốt kiếp và Sau một trăm ngàn kiếp theo ngữ cảnh lời thọ ký; vì Pāli không có ito, không dùng Vào ... kiếp trước của tiền lệ quá khứ; có thể hiểu là trong khoảng hay tại thời điểm đó. (4) 8.3 āyāmato tīṇi sataṁ: chiều dài ba trăm, Pāli không nêu đơn vị. (5) 10.1 đến 11.4 taṁ và tassa: đọc là thành Reṇuvatī theo hòa hợp giống trung (dasasaddāvivittaṁ, vijjādharasamākulaṁ, nagaraṁ), không đọc là tòa lầu Sudassana (giống nam); nếu đọc khác thì đối tượng của rực sáng đổi. (6) 16.1 đến 16.2 kikī và cāmarī: kikī là một loài chim chưa xác định được loài, giữ nguyên tên chim kikī; cāmarī dịch bò yak cái theo nghĩa từ điển, vāladhi là cái đuôi có lông. (7) 16.4 mahāmuni: đọc là hô cách, thưa bậc Đại Mâu-ni; nếu là tân ngữ (giữ gìn bậc Đại Mâu-ni) thì nghĩa đổi; rakkhiṁ không có tân ngữ nên không thêm giới. Bản Việt giữ nghĩa chưa rõ vật được giữ gìn. (8) 14.3 aṭṭhānametaṁ yaṁ tādī ... ajjhagā: đoạn vị ngữ aorist trong mệnh đề yaṁ, dịch là điều không thể xảy ra rằng bậc như thế lại tìm thấy niềm vui. (9) 15.2 subbato: đọc tính từ chủ ngữ có hạnh nguyện tốt vì tên Rāhula đã nêu riêng ở 15.3 (Rāhulo nāma nāmena); tha-ap109:7.3 dùng Subbato như tên riêng ở chỗ khác. (10) 9.3 kūṭāgāravarūpeto: kūṭāgāra dịch nhà nóc nhọn, vara là tuyệt hảo, upeta là đầy đủ. (11) 5.4 ye keci manaso piyā: dịch bất kỳ tòa nào vừa lòng; Pāli không nêu người ưa thích. (12) 10.2 vijjādhara: dịch vị trì minh chú; tiền lệ duy nhất tha-ap366:1.1 ghi tiên minh chú, thêm tiên so với Pāli nên không theo.
  
  Phép kiểm tự viết, mẫu số ghi kèm: tập khoá Việt bằng tập khoá Pāli 77/77 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 77/77 (Pāli mở nháy kép ở 1.1 và đóng ở 18.4; nháy đơn mở ở 4.1 và đóng ở 15.4, chạy qua ranh giới khoá); dấu lược 0/77 khoá có (không có …pe… và không có … trần nên phép kiểm dấu lược chạy rỗng); không khoá rỗng; NFC đủ; không chữ số trong thân kinh; không Pāli lọt sang tiếng Việt ngoài tên riêng và nhan đề Therāpadāna. In và đọc đối kháng 77 cặp Pāli với Việt.
  
  Coverage English: mẫu số = 1 khoá Pāli có nội dung (tha-ap18:19.1, 58 ký tự; 76 khoá còn lại, kể cả 20.1 dài 32 ký tự, ngắn hơn ngưỡng 40), Sujato phủ 0/1: tầng english-sujato đã ghim chỉ có 9 sub-collection của kn (cp, dhp, iti, ja, kp, snp, thag, thig, ud) và tệp tha-ap duy nhất là tệp tên name/sutta/tha-ap-name, không phải thân kinh; english-project 0 entry; vietnamese-current 0 (tầng này chỉ có Pháp Cú). Mẫu số nhỏ như vậy nghĩa là cổng coverage gần như không đo được gì: đây không phải sự đồng thuận về cách dịch mà là việc không có bản Anh nào để đối chiếu. Entry trong reference-gaps.yaml, nếu có, không cứu được published.
  
