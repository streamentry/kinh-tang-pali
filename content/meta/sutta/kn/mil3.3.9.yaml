notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli so git-hash với manifest (khớp). Đo bằng npm run store: 5 segment Pāli có nội dung, English coverage 0%, sàn 0,8 không đạt và reference-gaps.yaml chưa ghi nhận → draft.
  Khung đối đáp giữ nguyên một cách dịch với mil3.4.9, mil3.5.4, mil3.5.6, mil3.6.6, mil3.7.13: Vua nói— (Pāli mang gạch dài nên giữ gạch dài, khớp mil3.5.6 và mil3.6.6), thưa tôn giả Nāgasena, này Đại vương, và câu chốt Khéo lắm, thưa tôn giả Nāgasenā. Câu chốt đó nằm trong TIEN_LE_PHAI.md với nguyên văn bắt buộc, lấy từ mil3.5.6:2.1 và mil3.6.6:2.1. Colophon có dấu phẩy trước số thứ tự như cả 5 bài Milinda đã có.
  Vicāravagga: 0 tiền lệ, đặt mới Phẩm Khảo Sát, cùng lý do với mil3.3.4.
  Thuật ngữ: lakkhaṇa → đặc trưng (có 6 tiền lệ) chứ không phải dấu hiệu, vì câu hỏi hỏi đặc tính phân biệt của cảm thọ. vedayita = được cảm nhận; anubhavana = sự chứng nghiệm (có 50 tiền lệ), thực nghiệm thì 0. Opammaṁ karohī: 0 tiền lệ, đặt mới Hãy nêu một ví dụ; dùng cùng một cách ở mil3.6.9 vì Pāli trùng nguyên văn.
  Hai ví dụ: rañño adhikāraṁ kareyya là làm nhiệm vụ cho vua, rājā tuṭṭho adhikāraṁ dadeyya là nhà vua hài lòng ban một chức vụ; 0 tiền lệ cho adhikāra, đặt mới. pañcahi kāmaguṇehi samappito samaṅgibhūto dịch theo nguyên văn đã có của dn1:3.20.2, dn2:35.6, dn23:9.23 là đầy đủ và trọn vẹn sở hữu năm thứ dục lạc; paricareyya là hưởng thụ chúng. 3.1 có dibbehi là năm thứ dục lạc được ban cho, giữ vị ngữ này. kāyassa bhedā paraṁ maraṇā dịch là khi thân hoại mạng chung (365 tiền lệ). sugatiṁ saggaṁ lokaṁ dịch là cõi lành, cõi trời, một thế giới, giữ đủ ba chữ; thiện thú và cõi trời có tiền lệ ở dn6.
  Bố cục nháy kép: Pāli mở nháy ở 2.2 và đóng ở 3.2 (Evaṁ kho … cā ti.), nên 3.1 tiếp lời không mở nháy mới và 3.2 chỉ đóng. Lỗi này chốt _hvi.py bắt được ngay lần chạy đầu và đã sửa.
  Không có bản Việt hiện hành ở commit đã ghim; không có Anh Sujato đã ghim và tôi không đọc english-project nên không tuyên bố đã đối chiếu English.
