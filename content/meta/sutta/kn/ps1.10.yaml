  CẤU TRÚC BÀI. (1) Lời Phật: phạm hạnh là việc uống `maṇḍa`; khi bậc Đạo Sư hiện diện, `maṇḍa` có ba loại: thuyết giảng, tiếp nhận, phạm hạnh. (2–4) Định nghĩa ba loại: thuyết giảng là sự chỉ dạy về các phẩm trợ đạo và Thánh đạo tám ngành; tiếp nhận là bốn chúng, chư thiên, loài người và bất cứ ai hiểu được; phạm hạnh là Thánh đạo tám ngành. (5–8) Bốn nhóm công thức “tinh túy X là Y, cặn bã là Z; vứt bỏ cặn bã Z rồi uống tinh túy X của Y, đó là việc uống tinh túy”: năm căn (5), năm lực (6), bảy giác chi (7), tám chi đạo (8). (9–12) Cùng bốn nhóm theo khuôn “có tinh túy, có thứ để uống, có cặn bã”; thứ để uống là vị của ý nghĩa, vị của Pháp, vị của giải thoát. (13–16) Bốn nhóm lược lại bằng dấu `…`. (17) Câu tổng kết: hai mươi chín mục “do ý nghĩa X, Y là tinh túy”; hết bài, hết tụng phẩm thứ tư, hết Đại Phẩm thứ nhất. (18) Kệ tóm lược mười bài của phẩm.

