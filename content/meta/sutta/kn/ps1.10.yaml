  PĀLI TRÙNG NGUYÊN VĂN TRONG CHÍNH BÀI (đã đếm). 205 khoá không kể tiêu đề 0.x; sau khi bỏ thẻ <b>, dấu câu và hạ chữ hoa có 26 nhóm Pāli trùng, gồm 121 khoá, tương đương 923 cặp. Cả 26 nhóm có bản Việt giống hệt nhau (0 nhóm lệch), kể cả công thức `yo tattha attharaso dhammaraso vimuttiraso—` / `idaṁ peyyaṁ.` ở 9–12 (lặp 25 lần), `maṇḍapeyyaṁ.` ở 5–8 (lặp 25 lần) và các khoá đầu nhóm như 5.1 ≡ 9.2 và 6.1 ≡ 10.1. Các khoá có cùng công thức nhưng chỗ trống khác nhau (tên căn, lực, giác chi, chi đạo) khác nhau đúng ở tên đó và đã đối chiếu từng khoá với bảng ở 5–8.

  PĀLI TRÙNG NGUYÊN VĂN VỚI TẦNG ĐÃ DỊCH (đã dò). 8 khoá Pāli của bài có chuỗi Pāli trùng (chuẩn hoá như trên) ở tầng Việt của bài khác; 2 khoá dùng lại nguyên văn: 17.5 `Tassuddānaṁ` (384/515 khoá ở tầng là “Tóm lược:”) và 17.4 `Mahāvaggo paṭhamo.` (1/1 khoá ở tầng: “Đại Phẩm, thứ nhất.” ở mil3.1.16:5.1; các biến thể khác của tầng gồm “Phẩm Lớn” 5 khoá và “Phẩm Đại/Đại Phẩm” 8 khoá ứng với Pāli có số thứ tự khác); 6 khoá khác có chủ ý: 2.4–2.7 (`catunnaṁ iddhipādānaṁ …` và ba khoá cùng khuôn) ở mn118:14.2–14.5 dịch “bốn như ý túc …” là một vế của câu khác, còn ở đây các khoá này là vế của danh sách “sự chỉ dạy … của X …” nên cần chữ “của”; 4.2 `Ayameva ariyo aṭṭhaṅgiko maggo, seyyathidaṁ—` (33 khoá ở tầng; dạng nhiều nhất “Chính là Thánh đạo tám ngành này, tức là—” 9 khoá, “Chính Thánh đạo tám ngành này, tức là—” 6 khoá): dùng đúng chữ của dạng nhiều nhất, chỉ khác dấu cách trước dấu gạch (xem mục dấu câu); 4.3 danh sách tám chi đạo (18 khoá ở tầng, dạng “… chánh niệm và chánh định.” 7, “… chánh niệm, chánh định.” 5, dạng kết bằng dấu gạch 1): giữ không có “và” vì Pāli không có chữ ca, và giữ dấu gạch cuối khoá như Pāli.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `maṇḍa` → “tinh chất” (tiền lệ dn9:52 `sappimaṇḍo` “tinh chất bơ”; không dùng “tịnh thủy”, “phần trong” hay “váng” vì ít tiền lệ); `kasaṭa` → “cặn bã” (mn40:3.3, mn40:7.3 “cặn bã của sa-môn”, an4.20:3.4 “phần bã”); `peyya` → “thứ để uống” và `maṇḍapeyya` → “việc uống tinh chất”. `pamāda` → “sự phóng dật” (tầng: “phóng dật” 302/422 khoá có `pamād`, “buông lung” 64; ps3.3:13.5 cũng “phóng dật”; ps1.9:10.1 dịch “sự thất niệm” 1 lần, khác ở đây có chủ ý để `pamāda` và `uddhacca` không trùng chữ). `uddhacca` → “sự trạo cử” (tầng 24/96 khoá `uddhacc`, ps1.9 cùng dạng; “phóng dật” 5 khoá nhưng đã dành cho `pamāda`). `kosajja` → “sự biếng nhác” (tầng: 11 so với “lười biếng” 4; ps3.3 “biếng nhác”; ps1.9:10.1 “lười biếng”, khác ở đây). `assaddhiya` → “sự không tin” (tầng: “không có niềm tin” 6, “không tin” 4; ps1.9 “sự không tin”). `vīriyindriya`/`vīriyabala` → “tinh tấn căn”/“tinh tấn lực” (tầng: tinh tấn căn 41 so với tấn căn 19; tinh tấn lực 6 so với tấn lực 4; `vīriyasambojjhaṅga` “tinh tấn giác chi” 34/39; `sammāvāyāma` “chánh tinh tấn” 116/116; ps1.9 dùng “tấn căn”, “tấn lực”). `passaddhisambojjhaṅga` → “khinh an giác chi” (34/39); `dhammavicaya` “trạch pháp”. `pariḷāha` → “nhiệt não” (tầng 57 khoá, so với “thiêu đốt” 11, “nóng nảy” 10, “bức bách” 8). `duṭṭhulla` → “sự thô trọng” (mn128:21.3, 21.5, 22.8, 23.8). `appaṭisaṅkhā` → “sự không suy xét” (mn46:18.7, mn14:20.3). `adhimokkha` “thắng giải”, `paggaha` “nỗ lực”, `upaṭṭhāna` “thiết lập”, `avikkhepa` “không tán loạn”, `akampiya` “bất động”, `abhiniropana` “hướng tâm đến”, `pariggaha` “thâu nhiếp”, `samuṭṭhāna` “phát khởi”, `vodāna` “thanh tịnh”, `pharaṇa` “biến mãn”, `paṭisaṅkhāna` “suy xét”, `upasama` “an tịnh”: theo ps1.9 và ps3.3 (cùng danh sách). `indriya` → “căn”, `bala` → “lực”, `bojjhaṅga` → “giác chi”. `aṭṭhaṅgika magga` → “Thánh đạo tám ngành” (tầng: “tám ngành” 205 khoá, “bát chánh đạo” 141, “tám chi” 30; ps1.9 có “chi đạo” cho `maggaṅga`). `ācikkhanā desanā paññāpanā paṭṭhapanā vivaraṇā vibhajanā uttānīkammaṁ` → “sự chỉ dạy, thuyết trình, thiết lập, khai mở, phân biệt, trình bày rõ ràng”: dùng lại nguyên văn mn141:2.2, 3.1, 4.2, 8.2 (8/8 khoá Pāli trùng ở tầng, bản Việt giống hệt). `attharaso dhammaraso vimuttiraso` → “vị của ý nghĩa, vị của Pháp, vị của giải thoát” (mil5.4.2:1.6). Danh sách 17.1: theo ps1.9:11.1 và ps3.3:13.7–13.8 (“do ý nghĩa làm chủ”, “bất động”, “xuất ly”, “như thật”, “quán chiếu”, “đồng một vị”, “không vượt quá nhau”, “đoạn tuyệt”, “hội tụ”, “quy tụ”, “đứng đầu”, “vượt trội”, “cốt lõi”, “cứu cánh”, “Niết-bàn nhập vào bất tử” — tầng 71 khoá `amatogadh` dùng “nhập vào bất tử”). `Tassuddānaṁ` → “Tóm lược:” (384/515). `Catutthabhāṇavāro` → “Phần tụng thứ tư” (cùng dạng “Phần tụng thứ …” ở dn14, dn16). `X niṭṭhitā` → “… đã hoàn tất”, đúng khuôn của ps1.7 và ps1.8.

  TÊN VÀ TIÊU ĐỀ. `:0.1` giữ Pāli “Paṭisambhidāmagga”. `:0.2` giữ Pāli “Mahāvagga”, bỏ chữ số “1” đứng trước (đúng như các bài ps đã dịch). `:0.3` dịch “1.10. Luận Bàn Về Việc Uống Tinh Chất” theo khuôn “Luận Bàn Về …” của ps1.

  DẤU CÂU. Nháy khớp Pāli từng khoá: 208/208 khoá khớp số lượng của `“`, `”`, `‘`, `’`, `(`, `)` (0 lệch). Pāli có 1 nháy mở `“` (khoá 1.1) và 1 nháy đóng `”` (khoá 1.3); nháy mở ở 1.1 chạy qua 1.2 đến 1.3 (khớp Pāli từng khoá, không phải mỗi khoá tự cân). Pāli không có nháy đơn, không có ngoặc đơn. Dấu lược: một khoá có `…pe…` (2.2) → đúng một `…` ở cuối khoá; 26 khoá còn lại có `…` trần ở Pāli (2.3–2.7, 13.1–13.7, 14.1–14.6, 15.1–15.4, 16.1–16.4), Việt cũng giữ một `…` ở đúng các khoá đó; 27 khoá có `…` ở Pāli, 27 khoá ở Việt (0 lệch); không có `(…)` ở Pāli nên Việt cũng không có. Dấu gạch cuối khoá Pāli (—) giữ thành ` —` (có dấu cách trước): đo ở tầng thì Việt kết bằng “—” không dấu cách 2.304 khoá, bằng “ —” có dấu cách 758 khoá; đo riêng ở các bài ps thì có dấu cách 25, không dấu cách 12. Chọn theo phạm vi gần nhất (ps) và khớp ps3.9; ghi cả hai số để người biên tập gộp nếu muốn thống nhất cả tầng. Thẻ <b>…</b> ở 2.1, 3.1, 4.1 không đưa sang bản Việt. NFC 208/208, 0 khoá rỗng, 0 khoảng trắng thừa; Pāli lọt sang Việt: chỉ `Paṭisambhidāmagga` và `Mahāvagga` ở 0.1–0.2 (tên sách và tên phẩm, dùng lại nguyên văn).

  SỐ PĀLI. `tidhatta` (1.2) “ba loại”; `catunnaṁ` 2.2–2.4 “bốn” (bốn Thánh đế, bốn niệm xứ, bốn chánh cần, bốn như ý túc); `pañcannaṁ` 2.5–2.6 “năm” (năm căn, năm lực); `sattannaṁ` 2.7 “bảy” (bảy giác chi); `aṭṭhaṅgika` “tám ngành” (2.8, 4.2); `pañcamā` 18.2 “thứ năm” (vimokkha là chủ đề thứ năm: ñāṇa 1, diṭṭhi 2, assāsa 3, indriya 4, vimokkha 5); `dasa` 18.4 “mười” (mười chủ đề: ñāṇa, diṭṭhi, assāsa, indriya, vimokkha, gati, kamma, vipallāsa, magga, maṇḍa = 10); `catuttha` 17.3 “thứ tư”; `paṭhama` 17.4, 18.5 “thứ nhất”. Không có `sata`, `sahassa`, `navuti`, `tiṁsa…`. Chữ số chỉ ở tiêu đề 0.3 (“1.10.”), giữ.

  BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:
    1. `maṇḍa`: nghĩa gốc là phần trong, phần tinh hoa nổi lên trên một chất lỏng (kem, váng, phần trong của bơ lỏng hay rượu), đối lập với `kasaṭa` là cặn lắng. Chọn “tinh chất” theo tiền lệ dn9:52 và chọn “cặn bã” cho `kasaṭa`; cách đọc khác “phần trong” / “phần tinh túy” và “cặn”. Giữ cùng một chữ “tinh chất” xuyên suốt, kể cả ở `maṇḍapeyya`, để người đọc thấy được cấu trúc công thức.
    2. `tidhattamaṇḍo` (1.2) là câu cụt, không có động từ. `tidhatta` hiểu là “gồm ba mặt / ba loại” (`tidhā` + hậu tố trừu tượng); không phân xử được thêm vì không có tầng Anh. Câu 1.3 nêu đúng ba loại nên dịch “ba loại”.
    3. `desanāmaṇḍo`, `paṭiggahamaṇḍo`, `brahmacariyamaṇḍo` là hợp từ; dịch “tinh chất thuyết giảng / tiếp nhận / phạm hạnh” (hợp từ đồng vị: tinh chất ấy chính là sự thuyết giảng, v.v.). Cách đọc khác “tinh chất của sự thuyết giảng”. Cùng cách xử lý cho 5–8: `adhimokkhamaṇḍo` = “tinh chất thắng giải”; chỗ có sở hữu cách (`saddhindriyassa adhimokkhamaṇḍaṁ`) dịch “tinh chất thắng giải của tín căn”.
    4. `paṭiggaha` (3.x) dịch “tiếp nhận” (nhóm người tiếp nhận lời dạy); không dịch “thọ nhận” để khỏi gợi nghĩa thọ giới.
    5. 6, 10, 15: `assaddhiye akampiyamaṇḍo` dịch “tinh chất bất động trước sự không tin” (`assaddhiye` là vị trí cách: “đối với / trước”). Cách đọc khác: “tinh chất không lay chuyển ở chỗ không tin”.
    6. `pavicaya` (7.4 …) dịch “trạch pháp” theo ps1.9 và ps3.3, trùng chữ với `dhammavicaya` (“trạch pháp giác chi”); Pāli dùng hai chữ khác nhau, nghĩa gần nhau. Cách đọc khác “khảo sát”.
    7. `pariḷāha` (7.10, 11.10) dịch “nhiệt não” theo đa số tầng; cách đọc khác “sự bức bách / sự nung nấu”.
    8. `satisambojjhaṅgā` ở 7.1 là dạng số nhiều / cách khác của `satisambojjhaṅgo` ở 11.1; hai khoá nghĩa trùng nhau, dịch giống nhau (“niệm giác chi”); không sửa Pāli.
    9. `vimokkha` (17.1, 18.2) và `vimutti` (17.1, 9.3…) cùng dịch “giải thoát” như ps3.3:13.7; hai chữ Pāli khác nhau nhưng tầng không có cách phân biệt đủ ổn định. `muttaṭṭhena` dịch “thoát khỏi”, `pariccāgaṭṭhena` “xả ly”.
    10. `amatogadhaṁ nibbānaṁ` (17.1) dịch “Niết-bàn nhập vào bất tử” theo 71 khoá `amatogadh` ở tầng (đa số “nhập vào bất tử”), cách đọc khác “Niết-bàn lấy bất tử làm nơi thể nhập”.
    11. `assāsā` (18.1) dịch “hơi thở vào” (nghĩa đen của `assāsa`); ở đây dùng làm nhãn cho chủ đề hơi thở (ps1.3), có thể đọc là “(niệm) hơi thở”. `gati` (18.3) dịch “cảnh giới” theo tiêu đề ps1.6 đã dịch.
    12. `Esa nikāyadharehi ṭhapito` (18.5): `nikāyadhara` dịch “các vị thọ trì các bộ kinh” (0 tiền lệ ở tầng); `pavaro varavaggo` dịch “cao quý, là phẩm tuyệt hảo”; `asamo` “vô song”.

  technical_integrity đặt 9,6 vì lát này cấm chạy cổng, nên tôi không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
