notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Bốn khoá 2.2, 3.1, 4.1, 5.1 có …pe… ở Pāli, bản Việt giữ đúng MỘT dấu lược ở mỗi khoá theo lược() của _hvi.py; không mở rộng và không nén thêm. Bốn khoá này đều dài hơn 40 ký tự nên assertion có chạy và đã pass.

  Bốn khối 2, 3, 4, 5 là cùng một danh sách tám phần tử đổi động từ, nên phải dùng đúng một bộ thuật ngữ cho cả bốn: nekkhamma → ly dục, abyāpāda → không sân hận, ālokasaññā → nhận biết ánh sáng, avikkhepa → không hồi huyễn, dhammavavatthāna → lời giảng giải pháp, ñāṇa → sự biết, pāmojja → sự hân hoan, paṭhamajjhāna → sơ thiền. Vế bị chấn trừ lần lượt là kāmacchanda → dục tham, byāpāda → sân hận, thinamiddha → hôn trầm và buồn ngủ, uddhacca → chấp thủ, vicikicchā → nghi hoặc, avijjā → vô minh, arati → lân cận, nīvaraṇa → các triền cái. Sáu thuật ngữ đầu theo glossary content/glossary/pali-vi.yaml (kāmacchanda, byāpāda, thīnamiddha, vicikicchā, avijjā, nīvaraṇa) và đều có tiền lệ đếm được; ālokasaññā theo mn51:19.4 và mn107:9.5.

  0 tiền lệ, đặt mới: sammā samuccheda → chấn trừ triệt để (samuccheda 0, chấn trừ 0; chọn vì phải phân biệt với diệt tận ở khối kế và vì Hán–Việt quen thuộc hơn chém bỏ); anupaṭṭhānatā → sự không hiện hữu (0 tiền lệ, dùng để dịch na upaṭṭhāti ở khối 4); avikkhepa → sự hồi huyễn (0 tiền lệ; hồi huyễn là cách dịch cổ của avikkhepika, giữ vì đối xứng với avikkhepena là một trong tám phần tử); arati → lân cận (chỉ 2 tiền lệ và đều không phải nghĩa triền cái, đặt mới); dhammavavatthāna → lời giảng giải pháp (3 tiền lệ); pāmojja → sự hân hoan (90); nekkhamma → ly dục (152) chứ không phải xuất gia (968), vì ở đây nó là tác nhân chứ không phải hành động xuất gia. Đây là lý do terminology hạ xuống 8.8: tám thuật ngữ đầu bảy cái mới.

  Danh sách mười ba môn đồ ở 6.2 giữ đủ mười ba và đủ cả vế nhân quả, không rút còn một danh sách vô danh. 0 tiền lệ riêng, đặt mới: sīsa → môn đồ (môn đồ 9, học trò 111, đệ tử 1320 nhưng glossary đã dùng đệ tử cho sāvaka nên tránh trùng); palibodha → cầu dây (0); vinibandhana → trói buộc (648); vikkhepa và avikkhepa → hồi huyễn; adhimokkha → phát nguyện (0); paggaha → cần dụng (0, tinh tấn đã dành cho vīriya ngay sau nên không lấy); pavatta → vận hành (18); jīvitindriya → thọ mạng (83); gocara → tu tập, phân biệt với cảnh giới của ne27; saṅkhāra → nghi lễ (34).

  Quyết định về markup: bỏ thẻ b trong Pāli vì trong 3.954 tệp của tầng Việt không có tệp nào dùng thẻ này, và phần định nghĩa vẫn đọc được qua vế ti: Sīsan, Sammā samucchede, Nirodhe, Anupaṭṭhānatā, Saman — năm khoá mở đầu đều dịch dạng X nghĩa là. Đây là lý do ambiguity_integrity hạ xuống 8.7: năm khoá tiêu đề-mở-đầu của bài đều dựa vào đó.

  Pāli trùng nguyên văn, đã đếm và báo cáo: toàn bộ khoá 6.2 và bốn khoá có …pe… trùng nguyên văn với ps1.1 (Yuganaddha-paṭisambhidā, khoá 472.12, 473.9, 475.9, 476.1-476.2). ps1.1 chưa có bản dịch Việt trong tầng nên không có nguyên văn nào để dùng lại; hai lát sau dịch tới ps1.1 thì phải theo đúng các cách dịch ở đây. Riêng ps1.1:476.1 <b>Sīsan</b>ti terasa sīsāni trùng với ps3.7:6.1.

  Triangulation: không có English Sujato cho uid này tại commit đã ghin (đã dò cache, 0 tệp), nên dịch chỉ từ Pāli. Đây là bài khó nhất lát này. Không chạy được npm run validate|test|check|build theo lệnh phân công đợt này nên technical_integrity là 9.6.
