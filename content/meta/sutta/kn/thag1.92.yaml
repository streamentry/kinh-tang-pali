notes: |-
  **Cảnh báo cho biên tập — hai bài `published` có Pāli trùng y hệt bài này nhưng bị LỆCH MỘT VẾ.** `1.1`–`1.6` của bài này trùng `dhp93:1`–`dhp93:6` (chỉ `1.6` khác: Pāli kết bằng `”ti.` thay cho `ṁ.`). Bản `published` `dhp90-99` đặt nghĩa **sai một vế** từ `dhp93:3` trở đi: `dhp93:3` Pāli `Suññato animitto ca,` mà bản Việt là *cảnh giới của vị ấy là giải thoát* (đó là nghĩa của `1.4`); `dhp93:4` Pāli `vimokkho yassa gocaro;` lại dịch *với không và vô tướng* (đó là nghĩa của `1.3`); `dhp93:5` và `dhp93:6` cũng lệch theo. `dhp92` cùng lỗi. Tôi **không** sửa `dhp90-99` (ngoài lát), nhưng cũng **không sao chép** lỗi ấy: tôi dịch theo Pāli, và English Sujato xác nhận đúng thứ tự của tôi (`:1.3` *whose range is the liberation* / `:1.4` *of the signless and the empty*; `:1.5` *their track is hard to trace* / `:1.6` *like birds in the sky*). Người đọc nên biết hai bài này đang hiện nghĩa lệch nhau trên cùng nguyên văn.

  **Tự kiểm, vì `cần` RỖNG.** Mọi vế kệ bài này ngắn hơn 40 ký tự nên `kiểm()` của `_hvi.py` không chạy assertion nào. Tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá, NFC, số dấu lược khớp Pāli từng khoá, ngoặc kép cân, không Pāli lọt, không `(…)`, không trùng Pāli, `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Dấu lược theo BRIEF_VI3 §10.1.** `1.7` = `… Vijayo thero ….` → hai dấu lược giữ nguyên, không mở rộng thành *Bạch Thế Tôn, … đã từng nói bài kệ này*.

  **Tiền lệ, đếm được.** `Ekakanipāta` → *Bộ Một Bài Kinh* (160). `Dasamavagga` → *Phẩm Thứ Mười* (24, `thag1.96`/`97`). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>* (66). `anissito` → *không nương tựa vào vật thực* (đúng nguyên văn `dhp93:2` cho cùng Pāli). `gocaro` → *cảnh giới* (`ne28:2.1` *chánh tư duy là cảnh giới*, `ud4.2:5.2` *lấy chánh tư duy làm cảnh giới*; `mn106:2.5` cũng *cảnh giới*). `suññato` → *tánh không* — chọn *tánh không* chứ không phải *định không* (`dn33:1.10.123`) vì ở đây nó là *thuộc tính của cái được đạt*, không phải một loại định; `animitta` → *vô tướng* (44 chỗ ở thời điểm đo, `sn40.9:1.4`). `parikkhīṇā` → *cạn tận*: **0 tiền lệ riêng**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm:, đặt mới theo `āsava` + `pari-kkhīṇa` (đã cạn) và theo `khīṇāsava` → *lậu tận* (`sn1.28:3.5`).

  **Không có bản Việt tham khảo.** Tại commit đã ghim `translation/vi/` của bilara chỉ có 26 tệp Pháp Cú; `triangulation` là Pāli + English Sujato (10/11 khoá, thiếu đúng dòng lược `1.7`).

  **Bất định đã ghi.** `Ākāseva sakuntānaṁ, padaṁ tassa durannayan` — thứ tự ẩn dụ trong Pāli là *như chim trong trời* đứng trước (tôi dịch đúng thứ tự Pāli), trong khi Sujato đảo thành *their track is hard to trace, like birds in the sky*. Cả hai cách đều đúng về nghĩa; tôi theo Pāli. Không nhập chú giải vào thân kinh.
