notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `tha-ap`.
  21/30 khoá Pāli trùng nguyên văn tha-ap400 (1.1-1.4, 2.1-2.4, 3.1-3.4, 4.1-4.4,
  5.1-5.3, 6.1-6.3, 7.1-7.3) nên mượn nguyên văn dịch sẵn, KHÔNG dịch lại.
  Khác tha-ap400 đúng một thứ: đại từ ngôi thứ nhất `ahaṁ` đổi thành ta, khớp
  tha-ap555 (Gayākassapa, cùng Phẩm Yasa, cũng nói về chính mình). tha-ap400 tự
  trộn con (1.3-1.4) với ta (5.3, 6.1); 556 giữ ta xuyên suốt cho nhất quán.
  Tiền lệ đếm được: Therāpadāna giữ Pāli; `Yasavagga` → Phẩm Yasa 4 (tha-ap554/555/559/561)
  đối với Phẩm Danh Vọng 1 (tha-ap557, chữ sai — `Yasavagga` là Yasadeva);
  bỏ số thứ tự ở 0.3 vì 260/269 bài tha-ap bỏ số so với 9 giữ; tên phẩm theo
  tha-ap554/555/557 (Ký Sự Về Trưởng Lão) là họ đứng ngay cạnh 556.
  Tiền lệ chung trong tầng: Cụm Kilesā jhāpitā mayhaṁ (46), viharāmi anāsavo (46),
  Svāgataṁ vata me āsi (46), kataṁ buddhassa sāsanaṁ (49), Paṭisambhidā catasso (264),
  Itthaṁ sudaṁ āyasmā … thero (351) — tất cả dùng nguyên văn đã có.
  Ghi nhận bất định: 1.1 Pāli chỉ có `kakusandhamhi`, không có chữ Đức Phật;
  mượn nguyên văn tha-ap400 vì Pāli trùng, và `Nibbute kakusandhamhi` + `brāhmaṇamhi
  vusīmati` cùng chỉ một chủ thể (vị Bà-la-môn tự thuật). 1.2 `vusīmati` là tính từ
  (đã viên mãn) chứ không phải động từ; dịch theo tha-ap400 thành câu 'đã sống viên
  mãn phạm hạnh' là diễn đạt, ghi lại đây để người đọc biết.
  `…pe…` ở 5.2, 6.2, 7.2 giữ đúng MỘT dấu lược; nháy kép là danh sách xuyên suốt bài
  (mở ở 1.1, đóng ở 7.3) đúng như Pāli.
