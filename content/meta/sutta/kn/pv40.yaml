notes: |-
  Đã đọc HẾT p49.txt (40 khoá) trước khi viết. Đối chiếu bài kề CÙNG ĐẠI PHẨM
  pv41 (thứ sáu) và pv43 (thứ tám) — cùng cấu trúc hội thoại với một vị tỳ-kheo:
  `:0.1` `Petavatthu` giữ Pāli (15 bài pv đã merge), `:0.2` `Đại Phẩm` (pv41, pv43,
  pv44, pv46–pv50), `:0.3` và `:10.1` theo hình `N. Chuyện Ngạ Quỷ …` của pv41/pv43.

  KHOÁ NGƯỜI NÓI: `bhante` / `bhadante` trong tầng `pv` đo được `Bạch ngài` 5/6 khoá
  (≠ hướng `tôn giả` của mil), nên bài này dùng **bạch ngài** cho đúng tầng. Câu hỏi
  `…kissa ayaṁ vipāko` theo pv9:1.2 `đây là quả báo của việc gì?`. `”ti` cuối
  khoá giữ nguyên theo quy ước pv (24 khoá). Cặp tên nhân vật 8.1–8.4 và 9.1–9.4 là
  **lặp có chủ đích** trong Pāli (`So ca taṁ paccāsanto` / `So ca taṁ abhaṇantaṁ`,
  rồi `Teneva tvaṁ …` / `Teneva so …`); tôi dịch hai cặp theo cùng cách nhưng
  đổi chủ từ và động từ, và giữ nguyên bốn vế `thấy mãn nguyện, tươi vui, nhảy
  múa, reo hỉ, hân hoan` ở cả hai nơi.

  BẤT ĐỊNH ĐÃ GHI. (1) `Idaṁ mama ucchuvanaṁ mahantaṁ` (1.1) — `ucchuvana` không có
  tiền lệ từ điển trong tầng; tôi đọc là cơn khát của người khát, dịch `Cơn khát
  lớn của tôi này`, vì `1.3` (`Taṁ dāni me na paribhogameti`) nói rõ quả phước ấy
  nay không hưởng được. (2) `Svāhaṁ chinnathāmo kapaṇo lālapāmi` (2.3) — cổng bài
  kinh; `chinnathāmo` là tự tay chém đứt, `kapaṇo` là gầy, `lālapāmi` là lẩm bẩm.
  Bản nháp đầu tôi dịch `nằm lăn lê la bá lẹn bá lơn` là **sang chuyện không có ở
  Pāli**; đã sửa thành `Tôi đã tự tay chém đứt thân mình, tôi gầy guộc, tôi lẩm
  bẩm`. (3) `ucchuparibhogaṁ` (4.4) — dịch `thổ phần của loài ngạ quỷ khát`, giữ
  mạng lưới nghĩa với 1.1.

  DẤU LƯỢC: bài này KHÔNG có `…`, nên không phát sinh chính sách dấu lược.
  `technical_integrity` đặt 9.6: không ai rà lại bằng con người.

  Kiểm toán độc lập 2026-10-11 (THAY THẾ toàn bộ mục "BẤT ĐỊNH ĐÃ GHI" ở trên và
  các câu nói về `ucchuvana` là cơn khát, `chinnathāmo`/`kapaṇo`/`lālapāmi` và
  `ucchuparibhogaṁ` là thổ phần ngạ quỷ khát; những câu ấy sai). Đọc đối kháng
  40 khoá Pāli↔Việt, đổi 38/40 khoá (chỉ 0.1, 0.2 giữ nguyên); trong đó lỗi nghĩa
  thật ở khoảng 30 khoá, còn lại (5.1, 5.2, 5.4, 6.2, 8.2 …) là chỉnh xưng hô,
  dấu câu, từ nhẹ. Chia loại:
  (a) Tiêu đề bị đọc sai: `ucchu` là MÍA, không phải khát; `0.3` và `10.1` đổi
  thành `Chuyện Ngạ Quỷ Mía` (đã đổi `translationTitle`).
  (b) Đảo chủ thể ở 9.1–9.4: `so` là chính ngạ quỷ đi lấy mía theo lời dạy, bản
  cũ đọc `piṭṭhito` thành "người đi theo phía sau" nên kể ngược lại người trong
  tiền thân; nay dịch `piṭṭhito` là "từ phía sau" đồng nhất ở 6.2, 7.3, 8.1, 9.1.
  (c) Từ vựng bịa/đọc sai: 1.1 `ucchuvanaṁ`=vườn mía (không phải cơn khát);
  2.1 `haññāmi khajjāmi` là thể bị động (bị đánh, bị ăn), bản cũ dịch chủ động
  "giết, ăn, cướp"; 2.3 `chinnathāmo kapaṇo lālapāmi`=sức lực bị cắt đứt, khốn
  khổ, than van (bản cũ "tự tay chém đứt thân mình, gầy guộc, lẩm bẩm"); 3.1
  `vighāto`, 3.2 `vāricarova`=như con cá (cũ: "quẩn quanh trong khổ đau", bỏ mất
  ví dụ cá; tiền lệ ja500:6.4 "như con cá giữa nắng nóng"); 4.1 `chāto`=đói (cũ
  bỏ sót, thêm "khô cổ"); 4.2 `santassito` (cũ "chỗ mát mát"); 4.4
  `ucchuparibhogaṁ`=sự thụ hưởng mía (cũ bịa "thổ phần của loài ngạ quỷ khát");
  6.3 `paccāsanto`=trông mong; 7.1 `ayāci`=xin (cũ "tiếp xúc cầu xin"); 7.2
  `Dehayya ucchun`=thưa ông, xin cho mía (cũ bịa "hãy bỏ phần mía của ngươi
  đi"); 8.4/9.4 bỏ "nhảy múa" không có trong Pāli, giữ `haṭṭho udaggo pamodito`
  = vui mừng, phấn khởi, hoan hỷ.
  (d) Thêm nghĩa/bỏ sót: bỏ "của ngươi" thừa ở 7.4, bỏ "ấy" thừa sau `ucchuṁ`,
  thêm `payāto` (đi) ở 6.1, thêm `taṁ` (ngài) ở 4.3; 5.3 `vadāmi` là hiện tại
  ("ta nói", không phải "sẽ nói"); `anappakaṁ`=không nhỏ (cũ "không tính kể bao
  nhiêu").
  (e) Xưng hô: ngạ quỷ nói với vị tỳ-kheo xưng "con", gọi "bạch ngài" cho cả
  `bhante` lẫn `bhadante` (tiền lệ pv: `Bạch ngài, con` ở pv6, pv7, pv13, pv31,
  pv36, pv43, pv44, pv51; `tôi` ở pv19, pv22, pv25); vị tỳ-kheo xưng "ta", gọi
  "ngươi" như pv43. 1.4 và 3.4 có Pāli trùng nguyên văn nên Việt giống hệt (2/2
  cặp trùng trong bài, 0 cặp khác).
  Đo: tập khoá Việt = Pāli 40/40, thứ tự khoá = thứ tự Pāli, nháy “ ” ‘ ’ khớp
  Pāli từng khoá (4 khoá có “ ”, 1 khoá có ‘ ’), NFC, không Pāli lọt sang Việt.
  Bài không có số Pāli, không có `…`.
  Bảng điểm: semantic_fidelity 9.3→8.8, terminology 9.3→9.0, vietnamese_clarity
  9.2→8.8, ambiguity_integrity 8.9→8.8 (các lỗi nghĩa nêu trên đã bị bản trước
  chấm quá cao); các tiêu chí khác giữ nguyên; triangulation giữ 7.2 vì không
  có bản Anh độc lập. final_score 9.15→9.02.
  Bất định còn lại (không phân xử được, chưa có bản Anh): (1) `khajjāmi` — bị
  ăn bởi ai/cái gì Pāli không nói, giữ nguyên thể bị động; (2) `santassito` —
  đọc là run sợ theo từ điển, có thể thuộc nhóm nghĩa khác trong ngữ cảnh đói
  khát; (3) `piṭṭhito` ở 7.3 — "cho từ phía sau" có thể là đưa qua vai không
  nhìn lại (cách hiểu chú giải) nhưng Pāli chỉ nói `piṭṭhito`, nên giữ nguyên
  chữ; 8.1/9.1 `piṭṭhito gaṇheyyāsi/aggahesi` có thể chỉ nơi chốn (phía sau)
  hoặc cách thức, giữ nguyên nghĩa đen; (4) `Dehayya` đọc là `dehi ayya` (suy
  từ sandhi, không có bản đối chiếu); (5) 9.1/9.3 `so` dịch "kẻ ấy" để khỏi lẫn
  với "người ấy" ở 6–7 (tiền lệ pv43 dùng "kẻ ấy" cho ngạ quỷ).
  Kỹ thuật: `technical_integrity` giữ 9.6; bốn lệnh `npm run validate` ·
  `npm test` · `npm run check` · `npm run build` chưa chạy trong lượt này.
