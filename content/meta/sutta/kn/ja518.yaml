    `Tiṁsa` (0.2) = 30 → "Ba Mươi" (khớp tên bộ ở `ja512`/`ja517`/`ja519`); `tiṇṇaṁ` (9.1) = 3 → "ba kẻ" (vị sa-môn, kim sí điểu, chính rồng, đúng ba bên nêu ở `9.3`); `tatiyo` (12.2) = thứ ba → "người thứ ba" (sau cha và mẹ); `ubho` (33.2) = 2 → "cả hai"; `tayo` (26.2) = 3 → "ba người con", khớp ba loại nêu ở `26.3` (`antevāsī`, `dinnako`, `atrajo`); `sattadhā` (38.4) = satta 7 + dhā → "bảy mảnh" (theo `snp5.1:8.4`, `ja489:3.4`); `aṭṭhamaṁ` (40.1) = thứ 8 → "thứ tám", khớp "8." ở `0.4`. Bài không có số đếm nào khác.
