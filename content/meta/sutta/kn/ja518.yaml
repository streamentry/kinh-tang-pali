  - Chỗ bất định (không thêm vào thân kinh):
    + `3.1`–`3.4` `Nānumitto garuṁ atthaṁ…sumitto ca asambuddhaṁ, sambuddhaṁ vā anatthavā`: chưa phân xử được dứt khoát. `anumitta` dịch "bạn xã giao" (đối lập `sumitto` "bạn tốt"); `asambuddhaṁ`/`sambuddhaṁ` đọc theo `17.1` (`guyhamatthaṁ asambuddhaṁ` = "việc kín mà kẻ kia chưa hiểu rõ") là "chưa/đã được hiểu rõ"; `anatthavā` đọc "kẻ chẳng đem lợi ích"; khổ này không có động từ cho hai dòng sau, nên tôi để câu tương tự Pāli, không điền động từ.
    + `1.2` `aparicakkhitāraṁ`: dịch "không biết xét kỹ" (hình thái hiếm, chưa có tiền lệ); `4.1` `Vissāsamāpajjimahaṁ` → "đặt lòng tin cậy" (`ja324:2.2`); `4.2` và `10.1`–`10.2` `sammato`/`sammatatto`/`bhāvitatto`: đọc "được xem là bậc đã tu tập" (4.2, theo `iti89:4.2`), ở `10.1` giữ "được tôn trọng" cho `sammatatto`, ở `10.2` `manasā bhāvitatto` dịch "tự thân đã tu tập trong tâm"; cũng có thể đọc `manasā` là "trong lòng tôi" (người ấy được tôi kính trọng trong tâm).
    + `5.1` `brahme`: dịch "hỡi Bà-la-môn" (tiền lệ chia đôi: `cnd4:3.4`, `ja268:2.1`, `ja356:4.3`, `ja402:1.4` "Bà-la-môn" vs `ja372:4.1`, `ja405:2.4` "Brahma/Phạm Thiên"); chưa xác định người được gọi. Động từ bị lược ở `5.1` (`Tassāhaṁ paramaṁ… guyhaṁ`), tôi thêm "đã nói" theo `4.3` (`akkhiṁ`).
    + `6.4` `pallatthito` dịch "bị đảo lộn" (nghĩa gốc "bị lật ngược"); `7.1` `tirokkhavāco` dịch "nói lời lén lút" (hình thái hiếm, đọc theo gốc `tirokkha` "che giấu"); `7.3` `dummukho` → "miệng ác"; `7.4` `saṁyame` → "nên giữ mình thật xa", có thể đọc nghĩa "tự chế".
    + `9.2` `pāṇabhū` dịch "giữa các sinh linh" để nối cú pháp với `9.1`; cũng có thể là danh xưng hô gọi `nāgarāja`.
    + `11.2` `Paññāvidhā natthi na ninditabbā`: cú pháp chưa chắc (`paññāvidhā` giống cái; có thể đọc "cách vận dụng trí tuệ" như đã chọn hoặc "hạng người trí"); `11.4` `Alabbhamabyāharatī`: đọc `alabbhaṁ` ("điều không thể đạt được") làm tân ngữ của `abyāharati`, "không thốt ra"; cách đọc "thốt ra điều không thể có" cũng có thể.
    + `12.2` `Nāssa tatiyo anukampakatthi`: "người ấy không có người thứ ba nào thương xót" (sau cha và mẹ); `14.1` `Bhariyā ce purisaṁ vajjā`: đọc "nếu người vợ nói với chồng", câu không có vế sau rõ ràng; `14.2` `komārī` → "từ thuở thiếu nữ".
    + `20.2` `bhaddasālaṁ` dịch "có nhà cửa tốt đẹp" (có thể là "bằng gỗ sāla tốt"); `20.4` `me` → "của ta" nếu người nói là kim sí điểu như đã suy ra.
    + `21.2`–`21.4` `Āsīvisā vā riva sattusaṅghā`: đọc "kẻ thù lánh xa họ như (người ta) lánh rắn độc"; nghĩa so sánh chưa chắc hoàn toàn.
    + `22.3`–`22.4` `Tamhi nu kho`, `apaggatamhā`: "nơi người ấy, quả thật tôi đã mở bày…", "nên chúng tôi đã rời xa lợi ích và pháp" (`vivariṁ` ngôi nhất số ít, `apaggatamhā` ngôi nhất số nhiều; Pāli trộn ngôi, tôi giữ "tôi" và "chúng tôi" như Pāli); tương tự `34.4` `piyamhā` → "chúng tôi".
    + `23.2` `vattaṁ` → "phận sự"; `25.2` `Samphassatā…phareti` → "bằng sự xúc chạm, thấm khắp cả thân" (nghĩa sát chữ, chưa có tiền lệ).
    + `26.1` `muñca vadhā`: đọc `muñca` là mệnh lệnh nghĩa "hãy thoát", đối chiếu `27.3` `Muttajja`; `26.4` `Rajjassu`: chỉ có một dạng này trong toàn tầng Pāli; tôi dịch "hãy hoan hỷ" (mệnh lệnh của `rajjati`); cách đọc "hãy cai quản" cũng có thể, chưa phân xử được.
    + `27.1`–`27.2` `visajjī`: đọc là "thả" với tân ngữ `dujivhaṁ`, cũng có thể là "nói" với `vākyaṁ`; câu Việt giữ cả hai thành phần ("vừa nói lời ấy… đã thả").
    + `29.2` `jalābuja` đọc "kẻ sinh từ thai" (gọi rồng) và `aṇḍajena` "loài sinh từ trứng" (kim sí điểu); `31.1`–`31.4` `tyamhi`, `Niccayattena`, `disabbhi`: nghĩa sát nhất tôi đọc được, `disabbhi` dịch "giữa kẻ thù" (chưa tra được hình thái); `32.2` `Asaṅkito saṅkito ca` dịch "vừa không nghi ngại, vừa nghi ngại" (có thể đọc là thể bị động "không bị nghi / bị nghi").
    + `33.2` `sujayā` dịch "thắng lợi tốt đẹp" (hình thái chưa chắc); `33.4` `assavāhāva nāgā` dịch "như kỵ mã và voi" — ở đây `nāga` đọc là voi, khác `nāga` "rồng" ở nơi khác trong bài; chưa phân xử được.
    + `35.2` `Asaṁsayaṁ paṇḍarakena saccaṁ` dịch "không còn nghi ngờ, đối với Paṇḍaraka, điều ấy là thật" (cú pháp chưa chắc, không điền thêm).
    + `39.3`–`39.4` `Āsittasatto`, `saṁvaro`: tôi coi cả hai là tên riêng (nhân vật kể trong kệ kết, bị giết vì phản bạn); `saṁvaro` có thể là danh từ chung "sự phòng hộ"; không tra được tiền lệ trong tầng (`sn11.10:6.2` viết `sambaro asurindo`, hình thái khác); đây là điểm chưa phân xử được.
