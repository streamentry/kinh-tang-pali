    Dò Pāli của 163 khoá với toàn bộ Pāli đã ghim có bản Việt (kho chính cộng các bài đã dịch ở worktree; 5.993 tệp bài đã quét, so sau khi bỏ dấu nháy, dấu câu cuối, khoảng trắng): 32 khoá có ít nhất một dạng trùng ở bài khác. Dùng lại nguyên văn 25/32: `0.2`, `0.3`, `14.3` (`ja502:18.3`: "đầy đủ con cái, sắc đẹp và danh tiếng"), `15.1`–`19.4` (`ja508:18.1`–`22.4`, 20 khoá: cùng cụm kệ về việc giữ kín), `29.4` (`ja465:1.4`), `36.2` (`ja461:11.2`), `38.3` ("Với lời tuyên thệ chân thật này", `cp30:7.1`, `ja463:13.5`, `ja499:23.5`, `ja519:27.5`). Cố ý khác tiền lệ 7/32: `29.1`–`29.3` và `30.1`–`30.3` so với `ja165:1.1`–`1.3` và `ja165:2.1`–`2.3`, vì bản Việt ở `ja165` ở các khoá ấy lệch khỏi Pāli (ví dụ `Sandhiṁ katvā` "lập hòa ước/kết hòa" bị dịch "Dệt lưới", `Saṅketheva` "hãy nghi ngại" bị dịch "Trong rừng"); tôi giữ theo Pāli và báo lỗi ở ja165 chứ không sửa ngoài lát. `36.3` so với `sn3.11:9.3` (cùng Pāli `Susaññatānañhi viyañjanena`, ở đó dịch "vì những kẻ không tự chế ngự" — `susaññata` là "tự chế tốt", không phải "không tự chế"): giữ theo Pāli, báo ở `sn3.11`.
    Trong chính bài: 6 nhóm Pāli trùng nguyên văn: `1.4`=`2.4` ("như kim sí điểu đuổi theo rồng Paṇḍaraka"); `4.3`=`10.3`; `4.4`=`5.4`=`10.4` ("việc đã qua mất, tôi khóc thảm thiết"); `12.3`=`13.3`; `12.4`=`13.4`=`14.6`; `23.3`=`24.3`. 5/6 nhóm dịch giống hệt (chỉ khác dấu nháy ở nhóm có khoá đóng); nhóm `23.3`/`24.3` chỉ khác chữ hoa đầu câu ("Vị"/"vị") vì `23.3` mở câu mới sau dấu hỏi còn `24.3` nối tiếp bằng dấu chấm phẩy. Việt khác về nội dung: 0 cặp.
