    Tầng Pāli ghim chỉ có kệ, nên người nói tôi suy ra từ cách xưng hô trong kệ. Dấu nháy kép mở/đóng đúng từng khoá theo Pāli (không dùng nháy đơn vì Pāli không có): mở ở `1.1`, `9.1`, `10.1`, `11.1`, `22.1`, `24.1`, `25.1`, `26.1`, `27.3`, `29.1`, `30.1`, `34.3`, `35.1`, `36.1`, `39.1`; đóng ở `8.4`, `9.4`, `10.4`, `21.4`, `23.4`, `24.4`, `25.4`, `26.4`, `28.4`, `29.4`, `32.4`, `34.4`, `35.4`, `38.4`, `39.4` (khoá `39.4` Pāli kết `”ti.` → Việt `”.`). Phân chia theo suy luận: `1.x`–`8.x` rồng Paṇḍaraka nói (xưng "tôi", gọi `supaṇṇa` ở `8.4`); `9.x` hỏi Paṇḍaraka ("hỡi vua rồng"); `10.x` Paṇḍaraka đáp; `11.x`–`21.x` lời của kim sí điểu nói với rồng (`dujivha` ở `21.2`; "ta" ở `20.4`); `22.x`–`23.x` rồng hỏi kim sí điểu; `24.x` kim sí điểu đáp; `25.x` rồng nói; `26.x` kim sí điểu nói (gọi `dujivha`, có "ba người con"); `27.1`–`27.2` dẫn truyện; `27.3`–`28.x` kim sí điểu; `29.x`–`32.x` lời răn về kẻ từng là thù; `33.x` dẫn truyện; `34.x` Paṇḍaraka nói với vị lõa thể; `35.x` vị lõa thể đáp; `36.x`–`38.x` lời quở trách; `39.x` kệ kết. Với `29.x`–`32.x` và `36.x`–`39.x` Pāli không nêu người nói; tôi để "ta"/"ngươi" ở `36.x`–`38.x` theo giọng quở trách và không điền tên người nói vào thân kinh.
