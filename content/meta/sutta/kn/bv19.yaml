notes: |-
  Đợt 19, làn 81. Dịch từ Pāli root commit đã ghim, đủ 114/114 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ mười bảy của Buddhavaṃsa, về Đức Phật Tissa: ba lần chứng ngộ và ba kỳ hội chúng, tiền thân Sujāta xuất gia và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các phẩm anh em (9/9 tiền lệ).
  - `0.2` “19. Dòng Kế Thừa Của Đức Phật Tissa”: `tissabuddhavaṁsa`; cùng khuôn với `bv18:0.2`, `bv20:0.2`; số “19.” là số ghi trong tiêu đề Pāli, còn thứ tự phẩm là thứ mười bảy (xem `29.1`). Phương án khác: “Phần Về Đức Phật Tissa”.
  - `29.1` “Dòng kế thừa của Đức Thế Tôn Tissa là thứ mười bảy.”: `sattarasamo` = 17, khớp thứ tự phẩm (`bv18:25.1` thứ mười sáu, `bv20:26.1` thứ mười tám).

  **Số Pāli, đã tự tính.** `catu` 4 (12.1 bốn giai cấp; 19.1 bốn dấu hiệu). `tayo` 3 (6.1 ba kỳ hội chúng khớp ba con số ở `7.1`, `7.3`, `8.1`; ba lần chứng ngộ khớp ba khoá `4.3`, `5.1`, `5.2` = thứ nhất, thứ hai, thứ ba; 17.4 ba lâu đài khớp ba tên ở 17.3). `koṭisatāni` (4.3): dạng số nhiều “các trăm koṭi”, dịch “hàng trăm koṭi”, không quy thành đúng 100 koṭi. `navutikoṭi` 90 koṭi (5.1). `saṭṭhikoṭi` 60 koṭi (5.2; `saṭṭhi` = 60 là số đã xác lập). `khīṇāsavasatasahassa` = 1 × 100 × 1.000 = **một trăm ngàn** bậc đã đoạn tận lậu hoặc (7.1; `satasahassa` = 100.000, như `bv18:22.3`). `navutisatasahassa` = 90 × 100.000 = **9.000.000 (chín triệu)** (7.3). `asītisatasahassa` = 80 × 100.000 = **8.000.000 (tám triệu)** (8.1). Cùng cách đọc `X-sata-sahassa` thành “X triệu” như `bv20:4.1`, `bv20:4.3` (tiền lệ cùng cấu tạo, 1/1 mỗi dạng). `dvenavute` 2 + 90 = **92** (13.3; `navuti` = 90, `dve` = 2; khớp `bv20:9.3`). `sattavassasahassa` 7 × 1.000 = **7.000 năm** (17.1). `samatiṁsasahassa` (18.1): đọc `sama` là “tròn, đủ” nên là 30 × 1.000 = **30.000** người nữ; đây là điểm chưa phân xử được, xem bất định số 1. `anūnaaṭṭhamāsa` = không thiếu + 8 = **đủ tám tháng** (19.3; khớp `bv16:17.3`). `saṭṭhiratana` **60** ratana (24.1; cùng số với `bv18:21.1`). `vassasatasahassa` 100 × 1.000 = **100.000 năm** (25.3). `tīṇiyojana` 3 do-tuần (28.4; khớp `bv17:25.4`, bảo tháp của Dhammadassī cũng ba do-tuần). `dasapāramī` 10 (15.4). `sattarasamo` 17 (29.1). Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt hiện có (draft và published; so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 51 khoá của bài có Pāli trùng với khoá bài khác, tổng 1.247 cặp (962 cặp thuộc `14.2` `…pe…`, trong đó 935 giữ đúng một `…`), trong đó 111 cặp có Việt khác bản tôi viết (27 ở `14.2`, chỉ khác dấu cách hoặc dấu nháy mở đầu; 84 ở các khoá còn lại trên 285 cặp). 48 khoá dùng đúng nguyên văn một tiền lệ (`0.1`, `2.1`, `3.4`, `6.1`, `6.3`, `6.4`, `7.2`–`8.3`, `9.1`, `11.1`–`11.3`, `13.1`, `13.3`–`15.4`, `17.2`, `17.4`, `18.2`, `19.1`–`19.4`, `20.1`, `20.3`, `21.2`, `22.2`, `22.3`, `23.2`, `23.4`, `25.1`, `25.3`, `25.4`, `26.3`, `26.4`, `27.4`, `28.3`, `28.4`).
  - Chỗ viết **khác** tiền lệ, có lý do: `1.4` và `20.2` (`tisso lokagganāyako`, 5 cặp, 5 khác): tiền lệ bỏ tên hoặc đọc `tisso` thành “ba” (“vị giáo chủ của ba cõi” 2, “bậc dẫn thế gian theo ba lối” 1, “bậc Đạo Sư tối thượng giữa thế gian” 1, “bậc giáo chủ thế gian, bậc dẫn đầu thế gian” 1); ở đây `tisso` là tên Đức Phật (nominative của Tissa, như `tisse` ở 6.2, `tissaṁ` ở 12.2, `tissassa` ở 16.4, 21.4), nên viết “Tissa, bậc Dẫn Đạo tối thượng của thế gian” theo khuôn `bv20:1.4` và `bv20:18.2` (`phusso lokagganāyako`). `10.2` (4 cặp, 4 khác): hai dạng “Dẫn Đạo” và hai dạng “Lãnh đạo”, chọn “Dẫn Đạo” theo cả phẩm; dạng “bậc Dẫn Đạo thế gian đã xuất hiện” chỉ khác dấu cuối với một tiền lệ.
  - `13.3` **cố ý khác** 44/45 tiền lệ. Tiền lệ đều là người kể nhìn ngược về quá khứ (“Vào chín mươi hai kiếp trước” 18, “… trước đây” 10, “Từ chín mươi hai kiếp trước” 9, “Vào chín mươi tư kiếp trước” 2, và các dạng còn lại). Ở `13.3`–`13.4` là lời thọ ký tương lai (`bhavissati`), nên hướng đếm đảo lại: 92 kiếp **sau** thời Tissa là thời Gotama. Viết “Sau chín mươi hai kiếp nữa,” đúng nguyên văn `bv20:9.3` (1/45) và cùng dạng với `bv16:11.3`, `bv18:10.3`. Pāli ở `13.3` không có chữ chỉ hướng; hướng lấy từ động từ ở `13.4`.
  - `11.3` 12 cặp, 9 khác: “Nâng lên bằng cả hai tay,” 3 (dạng viết hoa đầu, như ở đây), “nâng lên bằng cả hai tay,” 2 (chỉ khác chữ hoa), “Tôi nâng hoa bằng cả hai tay,” 3 (thêm “hoa”, “Tôi”). Dùng dạng đa số theo chữ. `9.1` 9 cặp, 4 khác (“Vào lúc ấy, ta,” 5; “Vào lúc ấy tôi,” 2): chọn “ta” vì người kể là Đức Phật Gotama, cùng ngôi với `bv18:8.1`, `bv20:8.1`. `18.2` 13 cặp, 3 khác (10 giống). `15.2` 7 cặp, 2 khác chỉ ở dấu cuối. `7.2` 4 cặp, 2 khác dấu cuối (tiền lệ `.`, Pāli ở đây `;`); `8.2` 3 cặp, 1 khác dấu cuối. `3.4` 3 cặp, 2 khác (một thiếu “Ngài đã”, một kết `;`).
  - `19.4` cùng chữ `padhānaṁ padahī jino` với `tha-ap200:1.4`, nhưng tiền lệ ấy viết “nỗ lực chung thức cuối cùng” — “chung thức” không có trong Pāli và có vẻ là lỗi; dùng “đã nỗ lực tinh tấn” (3/4). **Lỗi ngoài lát, báo chứ không sửa** (đã nêu ở `bv18`).
  - Trùng trong chính bài: 4 nhóm Pāli trùng (`1.4`/`20.2`, `6.3`/`8.3`, `16.4`/`21.4`, `26.4`/`27.4`; mỗi nhóm 2 khoá), 4 cặp, trong đó 1 cặp Việt khác chỉ ở dấu cuối (`1.4` kết `.`, `20.2` kết `;`, theo Pāli từng khoá); 3 cặp giống hệt.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá, đếm số khoá).
  - `nāyaka`/`lokagga-` → “bậc Dẫn Đạo tối thượng của thế gian” (khuôn `bv20`). `jina`/`jinavara` → “bậc Chiến Thắng”, “bậc Chiến Thắng tối thượng” (`jinavara`: 7/13 khoá có “Chiến Thắng”, `bv29:1.1`; `bv20:25.1`). `mahāvīra` → “Đại Anh Hùng” (60 trên 83 khoá; “Đại Hùng” 16). `mahesi` → “Đại Ẩn Sĩ” (74 trên 96; “Đại Tiên” 6, “Đại Hiền” 4). `cakkhumā` → “bậc có mắt” (38 “bậc có mắt”, 107 “có mắt” trên 162 khoá). `mahāyasa` → “danh tiếng lớn” (24 trên 42). `amitayasa` → “danh tiếng vô lượng” (`bv15:2.1`, `bv15:23.1`, `vv16:4.2`). `anantateja` (không tiền lệ) → “uy lực vô biên”, `teja` → “uy lực” (`bv18`). `anukampaka` → “có lòng thương xót” (`dn31:21.2`, `mn137:22.1`; “bậc từ mẫn” `mn103:2.10`).
  - `asama` → “vô song”, `appaṭipuggala` → “không ai sánh bằng” (`bv18:22.2`). `anūpama` (tính từ) → “không thể ví sánh” (`bv20:1.3`; 5 khoá, 1 tính từ). `asadisa` → “vô đối” (`ja181:1.1`; 3 khoá, “không gì sánh bằng” 2, “vô đối” 1; chọn “vô đối” để tách khỏi `appaṭipuggala` ở cùng bài). `atula` → “không thể cân lường” (`bv18`).
  - `iddhi` → “thần thông” (39 trên 43 khoá; “thần lực” 4). `sīla` “giới”, `samādhi` “định”. `pāramī` → “ba-la-mật” (13 trên 21). `pāramiṁ gantvā` → “đạt ba-la-mật” (`bv20:13.3`, `cp35`). `sabbattha` → “ở mọi phương diện” (khoá duy nhất có tiền lệ `tha-ap16:19.2` viết “ở mọi nơi”; chọn cách nói tự nhiên hơn, xem bất định 4).
  - `abhisamaya`/`abhisameti` → “chứng ngộ” (theo `bv18`, `bv20`). `dhammadesanā` → “thuyết Pháp” (39 trên 69 khoá). `bandhana` → “trói buộc” (36 trên 84; “ràng buộc” 8). `pamocesi` → “giải thoát” (3 khoá, quá ít để đếm). `satta` → “chúng sinh” (771 trên 1.037). `naramarū` → “loài người và chư thiên” (`tha-ap491:7.3`, 1/1).
  - `sannipāta` → “kỳ hội chúng”, `samāgama` → “cuộc tụ hội” (`bv16`, `bv18`, `bv20`). `khīṇāsava` → “đã đoạn tận lậu hoặc”. `vimala` → “không cấu uế”. `santacitta` → “tâm an tịnh”. `tādī` → “bất động như vậy”. Bốn cụm trên dùng lại nguyên văn (5/5 tiền lệ).
  - `pupphita`+`vimutti` → “nở hoa nhờ giải thoát”: giữ hình ảnh, cùng hình ảnh `bv18:23.2` (`pupphāpetvāna` → “làm cho nở hoa”). `isipabbajā` (không tiền lệ) → “xuất gia theo lối ẩn sĩ”. `pabbajita` → “xuất gia” (15/15). `mahābhoga` → “của cải lớn” (34 khoá: “của cải” 22, “tài sản” 19). `chaḍḍayitvā` → “từ bỏ” (`bv20:8.3`, `tha-ap551:9.3`).
  - `catuvaṇṇa` → “bốn giai cấp” (`dn27:5.0`, 1/1). `parivuta` → “được … vây quanh” (`tha-ap340:4.3`). `upāgamiṁ` → “đến gần” (18 trên 49; “tiến đến” 10). `dhunamāna` → “lay động” (`ud3.1:4.2` dùng “gột rửa” cho nghĩa khác, không áp dụng). `matthake dhārayiṁ` → “nâng giữ trên đầu” (`tha-ap363:2.2` “che … trên đảnh”, `thi-ap8:7.4` “giữ ở trên đầu”). `pīti` → “niềm hỷ” (`tha-ap5:2.4`). `saddaṁ` → “danh hiệu” (xem bất định 5).
  - `upaṭṭhāka` → “thị giả” (24 trên 48), `agg-upaṭṭhaka/-ikā` → “thị giả hàng đầu / nữ thị giả hàng đầu” (6/6 cho `ahesuṁ aggupaṭṭhakā/-ikā`). `aggasāvaka/-ikā` → “đệ tử thượng thủ / nữ đệ tử thượng thủ” (6/6). `bodhi` → “Cây Bồ-đề” (5/6). `nāri` → “người nữ” (38 trên 64). `atraja` → “người con ruột” (8 trên 16). `nimitta` → “dấu hiệu” (24 trên 31). `padhāna` → “nỗ lực tinh tấn” (nỗ lực 34, tinh tấn 38 trên 57). `anūna` → “đủ”.
  - `valāhaka` “đám mây”, `anila` “cơn gió”, `padīpa` “ngọn đèn”, `andhakāra` “bóng tối”. `ussava` → “sương”: dạng đầy đủ `ussāva` là “sương”, tiền lệ trong tầng viết “hơi ẩm” (2 khoá, `dn14:1.34.4`, `an3.39:1.6`, đều trong chuỗi “lạnh, nóng, cỏ, bụi” nên khác ngữ cảnh); ở đây là hình ảnh so sánh với mặt trời nên chọn “sương”, xem bất định 6.
  - Tên riêng (đếm số khoá chứa chữ viết, không đo xem cùng một người): `Tissa` 131 khoá/48 tệp, `Sujāta` 14/8, `Khemaka` 43/4, `Janasandha` 4/2, `Padumā` 3/3, `Nisabha` 5/4, `Subhaddā` 17/3, `Ānanda` 3.248/227, `Brahmadeva` 11/2, `Udaya` 19/8, `Sirimā` 7/4, `Kisāgotamī` 15/7, `Sambala` 1/1, `Himavā` 14/5, `Yasavatī` 3/1, `Asana` 2/1. Chưa có tiền lệ trong tầng: `Guhāsela`, `Nārisaya`, `Samaṅga`, `Phussā`, `Sudattā`, `Upasenā`, `Nandārāma`; giữ dạng Pāli có dấu. `Phussā` ở 22.1 là tên nữ đệ tử, khác `Phussa` (tên Đức Phật ở `bv20`).
  - Ghi chú về `ratana` (24.1) và `koṭi` giữ nguyên chữ Pāli, như `bv18` và `bv20`.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `18.1` `samatiṁsasahassāni`: tôi đọc `sama` là “tròn, đủ” rồi 30 × 1.000 = 30.000 (viết “Đủ ba mươi ngàn”, cùng cách với `bv24:17.1`, nơi `samattiṁsasahassāni` được dịch “Đủ ba mươi ngàn”). Cách đọc khác: `samatiṁsa` = 33 (khớp `bv15:17.1` `tettiṁsasahassāni` 33.000 và `bv16:16.1` `tettiṁsañca sahassāni` 33.000, cùng vị trí đếm người nữ). Dạng `samatiṁsa` còn ở `bv5:20.1` (chưa dịch); dạng `samattiṁsa` ở `bv24:17.1` đã dịch “Đủ ba mươi ngàn” (cùng cách đọc của tôi, không phải chứng cứ độc lập); tầng Anh không có. **Không phân xử được, người biên tập cần xác nhận.** Khoá này không làm đổi nghĩa phần còn lại của bài.
  2. `7.1`, `7.3`, `8.1` số người ba kỳ hội: tính theo cấu tạo thì 100.000, 9.000.000, 8.000.000 (như `bv20:4.1`, `bv20:4.3` cùng cấu tạo `X-sata-sahassa`). Cách đọc khác: `navuti`/`asīti` đi với `sahassa` (90.000, 80.000) hoặc cả ba đều tính theo koṭi như ở `bv18:7.1`–`7.2`. `7.1` `khīṇāsavasatasahassa` có kèm `khīṇāsava` nên tôi giữ danh từ “bậc đã đoạn tận lậu hoặc”; `7.3`, `8.1` chỉ có số nên Việt chỉ có số, như tiền lệ. Chênh lệch giữa 100.000 và 9.000.000 là khác thường nhưng Pāli không có chữ nào để sửa.
  3. `4.1` `dasasahassimhi`: tôi đọc là “trong mười ngàn thế giới” (`dasasahassī` là cách nói tắt của `dasasahassī lokadhātu`, như ở `dn1:3.74.6`, `dn14:1.17.7`, `bv16:2.4`); Pāli ở đây không có chữ `lokadhātu`, nên “thế giới” là bổ nghĩa từ tiền lệ. `4.3` `koṭisatāni`: số nhiều, không đoán đúng một con số.
  4. `3.3` `sabbattha pāramiṁ gantvā`: “ở mọi phương diện” hay “ở mọi nơi” (`tha-ap16:19.2`). Dịch sát chữ là “mọi nơi”, nghĩa là “trong mọi việc”; tôi chọn cách nói thứ hai cho dễ hiểu. `4.2` `viññāpesi giraṁ suciṁ`: `viññāpeti` là sai khiến của `jānāti`; dịch “làm cho thấu hiểu lời nói thanh tịnh”, Pāli không nêu người nghe nên Việt cũng không nêu.
  5. `10.3` `Buddhoti saddaṁ sutvāna`: `ti` là dấu dẫn lời nên là “tiếng/từ ‘Buddha’”; Pāli ở khoá này không có dấu nháy, nên Việt không thêm nháy, viết “danh hiệu Phật”. Cách đọc khác: “tiếng ‘Phật’”. `10.1` `pabbajite sante`: “khi ta đã xuất gia”; `9.4` `isipabbajaṁ`: “xuất gia theo lối ẩn sĩ” (sự xuất gia của ẩn sĩ, không phải xuất gia vào Tăng đoàn Phật).
  6. `27.2` `ussavo`: đọc là `ussāva` “sương” (vần ngắn vì thể kệ); cách đọc khác `ussava` “lễ hội” không hợp với phép so sánh với mặt trời. `27.1` `valāhakova anilena`: “như đám mây bởi cơn gió”, Pāli không có động từ riêng, ý “tan” lấy từ `nibbuto` ở `27.4` nên Việt không thêm động từ.
  7. `11.4`–`12.2` cú pháp: `upāgamiṁ` (11.4) đòi tân ngữ, và `tissaṁ lokagganāyakaṁ` (12.2) là tân ngữ chỉ vào “bậc được bốn giai cấp vây quanh” (12.1); Pāli ngắt câu bằng dấu chấm ở 11.4 nhưng ý liền với 12.1–12.2, nên Việt kết 11.4 bằng dấu phẩy. `12.4` `matthake dhārayiṁ jinaṁ`: tân ngữ của `dhārayiṁ` là hoa (`pupphaṁ`, 12.3); `jinaṁ` ở đây đóng vai sở hữu cách của vị trí (“trên đầu bậc Chiến Thắng”). `12.1` `catuvaṇṇa`: “bốn giai cấp”; cách đọc khác “bốn hạng chúng”.
  8. `20.4` `yasavatiyamuttame`: `yasavatiyaṁ` + `uttame`, tôi đọc là “ở Yasavatī tối thượng” (cùng khuôn `bv18:5.2` `vebhāre so puruttame`). Cách đọc khác: `Yasavatī` là tên thành và `uttame` là danh xưng riêng của nơi, hoặc `uttame` bổ nghĩa cho Đức Phật.
  9. `17.3` `Guhāsela nārisaya nisabhā`: ba tên lâu đài (khớp “ba” ở 17.4). `nārisaya` có thể là danh từ thường (“chỗ nằm của nữ nhân”); không có tiền lệ nên giữ nguyên làm tên riêng.
  10. `2.3` `anukampako mahāvīro`: không có chữ “của”; hai tính từ cùng bổ nghĩa cho bậc “có mắt” ở 2.4. `1.2`: tôi thêm “đã có” để câu 1.1–1.4 không bị đọc thành “Siddhattha là bậc vô song” (Pāli chỉ để động từ `uppajji` ở 2.4 chi phối); đây là thêm một động từ tồn tại cho mạch câu, theo tiền lệ `bv18:1.2` (“có bậc Dẫn Đạo…”) và `bv20:1.2` (“đã có bậc Đạo Sư…”).
  11. `24.1`–`24.2` `so buddho saṭṭhiratano ahu uccattane jino`: “có sáu mươi ratana / chiều cao của bậc Chiến Thắng”; Pāli lặp “ratana” và “uccattana” (chiều cao), Việt tách để khỏi lặp “cao”. Không quy đổi `ratana` ra mét. `24.4` `himavā viya dissati`: “trông như núi Himavā”.
  12. `22.1` `Phussā` tên nữ đệ tử thượng thủ; Pāli viết `Phussā ceva sudattā ca`. Không nhầm với Đức Phật Phussa ở `bv20`. `22.4` `asanoti`: `ti` là dấu đóng lời, “Asana” là tên cây.
  13. `26.1`–`26.2` `uttamaṁ pavaraṁ seṭṭhaṁ … mahāyasaṁ`: ba tính từ trung tính đi với `mahāyasaṁ` (đại danh tiếng), nên “tối thượng, cao quý, tối thắng” bổ nghĩa cho danh tiếng chứ không phải bổ nghĩa cho Đức Phật; Việt giữ nguyên thứ tự và ngắt dòng như Pāli.

