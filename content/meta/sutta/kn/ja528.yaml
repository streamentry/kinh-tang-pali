    + `1`: người hỏi gọi người nghe là `brāhmaṇa` (`1.4`), hỏi vì sao mang gậy, da, dù, dép, móc, bát, y mà trông vội vã; `2`: người ấy đáp (đã sống mười hai năm bên người hỏi, `2.1`); `3`: người nói tiếp (vẫn chưa xác định `Svāyaṁ` chỉ ai, xem phần bất định); `4`: người được thưa đáp lại, mời ở lại; `5`–`13`: một lời của người ra đi (nháy mở ở `5.1`, đóng ở `13.4`, xưng "chúng tôi" ở `13.3`–`13.4`); `14`: người ở lại cầu xin (nháy riêng `14.1`–`14.6`); `15`: lời đáp (nháy mở ở `15.1` và chỉ đóng ở `59.4`, nên `15`–`59` nằm trong một khối nháy kép liên tục); `16`–`33`: người nói gọi người nghe là `bhoto` (`17.3`, `18.4`) và tự nhận đã giết một con khỉ (`vānaro`, `17.4`); người nghe là người chủ trương các học thuyết bị dẫn; `34`–`59`: lời phản bác và lời dạy về phép trị nước (không có đại từ xưng hô). Dịch bhoto và tvaṁ cùng là "ngài" (cùng một người nghe). Nháy đơn ‘ ’ chỉ có ở `29.3` và `29.6` (lời của hạng khattavidā).
  - Pāli trùng nguyên văn:
    Dò Pāli của 275 khoá với toàn bộ Pāli đã ghim (mọi bộ) có bản Việt (dedup theo khoá): 43 khoá có dạng trùng ở bài khác. Gồm 526 + 1 + 1 cặp ở `0.1`–`0.3`, 534 cặp ở `62.1`, và 39 khoá nội dung với 86 cặp trong đó bản Việt khác ở 41 cặp (đều do người nói, ngữ cảnh hoặc quote khác, hoặc do hai tiền lệ khác nhau mà tôi chọn một). Dùng lại nguyên văn: `13.1`–`13.4` và `14.1`–`14.6` và `15.1`–`15.2` (`ja476:11.1`–`13.2`; ở `13.3` còn `ja370:3.3` dịch "Thôi ta xin từ biệt bạn mà bay đi" vì người nói là chim; ở `15.6` có `ja458:9.4` "khi những ngày đêm đã trôi qua" và `sn3.1:11.4` "sau nhiều ngày đêm trôi qua", chọn dạng `ja458`); `30.1`–`30.4` (`ja493:17.1`–`17.4`, `ja516:45.4`; `ja452:7.1`–`7.4` khác vì bối cảnh không phải lời khuyên về bạn); `26.2` (`ja461:4.2`; `snp3.8:5.2` dịch "kẻ ngu và người trí"); `45`–`48` (`ja334:1.1`–`4.6`; `an4.70` dịch cùng stanza khác: "con bò đực", "huống chi là quần chúng còn lại"); `4.3` (`thag15.1:1.1` "Tôi càng thêm tịnh tín", bỏ nháy mở vì Pāli không có; `cnd4:17.1` và `snp5.19:17.1` dịch "Con càng thêm tịnh tín").
    Một ngoại lệ có chủ ý ở `46.4` và `48.4`: Pāli trùng nguyên văn (`pageva itarā pajā`) nhưng `ja334:2.4` dịch "thì quần chúng còn tệ hại hơn nhiều" còn `ja334:4.4` dịch "thì quần chúng sẽ noi theo chánh đạo" (hai cách khác nhau cho cùng một câu Pāli); `an4.70:4.4`/`6.4` dịch giống nhau ở cả hai chỗ ("huống chi là quần chúng còn lại"). Chọn dạng giống nhau cho cả hai khoá, vì Pāli trùng nguyên văn và nghĩa "huống chi" đúng ở cả hai ngữ cảnh.
    Trong chính bài: 25 nhóm Pāli trùng nguyên văn (sau khi bỏ dấu câu); bản Việt khác ở 3 nhóm, chỉ khác dấu câu hoặc từ nối do ngữ pháp câu: `17.4`/`20.4`/`23.4`/`27.4`/`32.4` có "thì" còn `31.4` không (vế trước ở `31.3` không phải mệnh đề "nếu"); `19.4`/`41.2`/`42.2` (cùng `kammaṁ kalyāṇapāpakaṁ`, nối khác nhau theo câu); `29.2` kết bằng dấu hai chấm còn `35.2`/`38.2`/`40.2` kết bằng dấu chấm phẩy (sau `29.2` là lời trích).
  - Số Pāli:
    `dvādasa` (`2.1`) = dvā 2 + dasa 10 = 12 ("Mười hai năm"); `vassasataṁ` (`43.1`) = vassa 1 + sata 100 = "một trăm năm"; `catunnaṁ` (`25.1`) = 4 ("bốn thứ"; ngữ cảnh học thuyết đoạn diệt gợi bốn yếu tố lớn, nhưng Pāli không nêu nên không thêm vào thân kinh); `paṇṇāsa` (`0.2`, `61.1`) = 50 ("Năm Mươi", khớp tên SuttaCentral "The Book of the Fifties"); `tatiyaṁ` (`60.1`) = thứ ba, khớp "3." ở `0.4` và `63.3`; `paṭhamo`/`dutiyo`/`tatiyo` (`63.1`–`63.3`) = thứ nhất/hai/ba; `tīṇi` (`63.4`) = 3 ("ba bài"). Không có cụm nào thuộc loại chưa phân xử được, và không có `Tiṁsakappasahassa`.
