  - Chỗ bất định (không thêm vào thân kinh):
    + `1.1`–`1.4`: `kiṁ nu daṇḍaṁ kimajinaṁ …` dịch "Gậy để làm gì, …" (cũng có thể là "Sao ngài lấy gậy …"); `aṅkusa` → "móc" (không xác lập được là móc hái quả hay móc voi); `1.5` `hāsi` đọc là `āsi` ("trông như"). `1.6` `patthayase` → "mong hướng về".
    + `2.3`–`2.4`: `soṇena piṅgalena` → "con chó vàng hung" (`soṇa` là "chó"; cũng có thể là hai tên riêng); `abhikūjitaṁ` → "sủa vào mình" (nghĩa gốc "kêu vào", tân ngữ "mình" lấy từ mạch). `3.1` `Svāyaṁ` (nó, người này) → "con chó ấy" theo `2.3`–`2.4`; không phân xử được là chó thật hay người bị ví; `3.3`–`3.4` `tava sutvā sabhariyassa vītasaddhassa maṁ pati`: `tava … vītasaddhassa` đọc là cùng chỉ "ngài", và `maṁ pati` là "nơi tôi"; cũng có thể đọc `tava sutvā` là "nghe từ ngài" (lời của ngài).
    + `4.1` `ahu esa kato doso` → "Lỗi ấy đã được gây ra" (không rõ lỗi của ai); `4.3` `esa` (ở dạng `eso` "người này") đọc là "tôi" theo `thag15.1:1.1`. `5.1`–`5.4` không có chủ ngữ ở "toàn trắng … loang lổ … đỏ" (không rõ nói về điều gì: lòng tin, thái độ hay sự việc); dịch giữ nguyên vô chủ. `6.1`–`6.4` đọc là "tôi" ở vị trí bên trong, giữa, ngoài (nhóm thân tín), giữ vô chủ ở `6.1`–`6.2`.
    + `7.2` `udapānaṁvanodakaṁ` đọc `udapānaṁ va nodakaṁ` ("như giếng không nước"; cách đọc `vanodakaṁ` "nước rừng" không hợp mạch). `10.4` `migo sākhassito` → "con thú nương nơi cành cây" (nghĩa gốc "thú ở nơi cành", có thể chỉ con khỉ, gợi `vānaro` ở `17.4`); `10.3` `manussapāpiṭṭho` → "xấu ác nhất trong loài người" (so sánh tối thượng). `9.3` `asappurisadhammo` → "thói của kẻ phi thiện nhân" (cũng có thể là "pháp của …").
    + `11.3`/`12.4` `mittā jīranti` → "tình bạn hao mòn" (Pāli là số nhiều "những người bạn"). `12.2` `cirāciraṁ` → "khi lâu khi mau": không xác lập được nghĩa (lâu rồi mới đến, hay lúc lâu lúc mau không đều).
    + `14.1`–`14.6`: dùng lại `ja476:12`; `pariyāya` → "một lượt nữa" (cũng có thể là "cách sắp đặt", "lúc nào đó"); người nói không xác định.
    + `16.1`–`16.2` `udīraṇā ce saṅgatyā bhāvāya manuvattati`: ngữ pháp không chắc; đọc `udīraṇā` ("sự thúc đẩy"), `saṅgati` ("hoàn cảnh"), `bhāva` ("bản tính") là ba nguyên nhân (theo `mn60:21.7` `niyatisaṅgatibhāvapariṇatā`), `manuvattati` "hành động theo". `16.6`/`22.6`/`26.4` `kvidha` đọc `kva idha` ("ở đời này sao lại"), có thể là "ở đâu"; dịch thành câu hỏi tu từ.
    + `17.1` `so` ("điều ấy") không có tiền ngữ rõ trong các bài kệ còn lại; dịch giữ nguyên chung. `17.4` `suhato` → "bị giết một cách chính đáng" (nghĩa gốc "giết khéo"); `vānaro` → "con khỉ" (không rõ là khỉ thật, như `ja` thường dùng, hay một người bị gọi là khỉ).
    + `19.1`–`19.6`: `kappeti` → "sắp đặt"; `issaro tena lippati` → "chính đấng tối cao vì thế bị nhiễm ô" (đảo ngược cho người chỉ làm theo mệnh lệnh).
    + `22.1`–`22.6`: `pubbekatahetu` → "nghiệp quá khứ đã làm" (`mn101:22.3`); `iṇaṁ` → "món nợ" (nghĩa bóng của nghiệp cũ).
