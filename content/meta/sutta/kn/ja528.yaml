  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja528_root-pli-ms.json` (275/275 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ (59 bài kệ cùng bốn dòng tiêu đề, dòng kết, dòng kết phẩm và bài kệ tóm lược); phần văn xuôi của Jātaka không nằm trong tầng Pāli đã ghim, nên người nói ở từng bài kệ chỉ được suy từ lời xưng hô, nháy kép và mạch của chính các bài kệ. Phần lớn bài là một cuộc tranh luận về các học thuyết vô nhân, đấng tối cao tạo tác, nghiệp quá khứ, đoạn diệt và khattavijjā, rồi lời dạy về phép trị nước; dịch sát chữ, không thêm giải thích vào thân kinh.

