notes: |-
  Bản dịch chỉ từ Pāli root do commit đã ghim không có bản Anh upstream (giới hạn upstream).
  Đầy đủ 10 tiêu chí scorecard; status bắt buộc draft do blocker tầng tham khảo Anh; technical_integrity 9.6.

  Sửa lan 2026-10-13: bản Việt cũ của `tha-ap140:1.3`–`4.4` không khớp Pāli (14 khoá; nội dung như của một bài khác: "tám mươi ngàn đệ tử", "rực sáng như một khối lửa… bay lên giữa hư không", "Đạo sư Sobhita"), nên viết lại đúng theo Pāli root. Trọng yếu nhất: `4.1` `Sattarase kappasate` *chín mươi tư kiếp* → *một ngàn bảy trăm kiếp* (sattarasa = 17, kappasate = hàng trăm kiếp: 17 × 100 = 1.700). `1.3`–`1.4` `Kusalākusalaṁ esaṁ, agamaṁ buddhasantikaṁ` → *Tìm điều thiện và điều bất thiện, tôi đã đến trước Đức Phật* (`esaṁ` đọc là phân từ hiện tại "đang tìm"; đây là cách đọc ít giả định nhất nhưng không có bản Anh để đối chiếu — bất định nhỏ). `2.1`–`2.4`: Đức Phật Atthadassī có tâm từ, có lòng bi, an ủi chúng sinh, bậc Có Mắt thuyết Pháp (tiền lệ `tha-ap551:5.1`, `tha-ap414:26.2`, `tha-ap490:3.2`). `3.1`–`3.4`: tịnh tín, chắp tay trên đầu, đảnh lễ bậc Đạo Sư, ra đi mặt hướng về phương đông (như `tha-ap127:11.4`, `tha-ap37:3.2`). `4.2`–`4.4`: có vị vua, chúa tể của cõi đất, tên Amittatāpana, Chuyển Luân Vương có đại lực (như `thi-ap27:30.4`, `tha-ap111:8.4`). Cùng lỗi `Sattarase kappasate` → *chín mươi tư kiếp* còn ở `tha-ap143:3.1` (ngoài lát). Điểm số, status và waiver giữ nguyên; lưu ý lượt chấm 2026-10-03 đã không phát hiện lỗi này, nên bài cần một lượt chấm độc lập mới.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 24/24 khoá Pāli↔Việt. Bản sau sửa lan không còn lỗi nghĩa nghiêm trọng; số `Sattarase kappasate` kiểm lại: sattarasa = 17, × kappasata (100 kiếp) = 1.700 → *một ngàn bảy trăm kiếp* đúng. Đổi 5/24 khoá: `1.4` *đến trước Đức Phật* → *đến bên Đức Phật* (*đến trước* đọc được thành "đến sớm hơn"; tiền lệ nguyên văn `tha-ap197:1.4`); `1.3` *Tìm điều thiện và điều bất thiện* → *Tìm hiểu điều thiện và điều bất thiện* (`esaṁ` là phân từ hiện tại của `esati` "tìm kiếm"; *tìm điều bất thiện* dễ hiểu thành đi tìm điều ác); `2.4` *thuyết Pháp* → *thuyết giảng Pháp* (Pāli trùng nguyên văn: 10/10 khoá trong tầng `tha-ap`/`thi-ap`); `4.4` *Chuyển Luân Vương có đại lực* → *Chuyển luân vương có đại thần lực* (Pāli trùng nguyên văn: 58/124 khoá, cùng nghĩa *đại thần lực* 73/124; phạm vi gần `tha-ap127`–`tha-ap199` cũng đa số như vậy — thay cho dạng *đại lực* mà lượt sửa lan đã chọn); `4.3` viết hoa đầu nửa kệ cho đồng nhất với `1.3`, `2.3`, `3.3`. Kiểm: 24/24 khoá khớp tập và thứ tự Pāli; nháy kép khớp Pāli từng khoá 24/24; 0 cặp Pāli trùng nguyên văn trong chính bài (phép rỗng); `…pe…` → đúng một `…` (1 khoá), không có `…` ngoài Pāli; NFC sạch. Bất định giữ lại: (a) `esaṁ` cũng có thể đọc là đại từ sở hữu số nhiều, nhưng không hợp cú pháp câu, nên chọn phân từ; (b) `rājā āsi` là ngôi ba về hình thái, truyền thống Apadāna thường đồng nhất vị vua với chính Trưởng lão — giữ *có vị vua* trung tính, không thêm *tôi*; (c) `kesavo` là tên gọi khác hay tên dòng họ thì không phân xử được từ Pāli (song song `ja539:140.2` dùng `kassapo`, tên dòng họ). Không có bản Anh, không có bản Việt hiện hành; chỉ đối chiếu được Pāli và tiền lệ nội bộ (`ja539:140.1`–`140.2` cho câu mở đầu). Điểm: semantic_fidelity 9.3 → 9.1, grammar_logic 9.3 → 9.1, vietnamese_clarity 9.3 → 9.1, han_viet_balance 9.4 → 9.3, ambiguity_integrity 9.2 → 9.0 — điểm cũ chấm trên bản có 14 khoá sai nội dung nên bị thổi phồng; điểm mới chấm trên bản hiện tại, còn bất định (a)–(c). triangulation giữ 7.5 vì không có tầng tham khảo nào. final_score 9.23 → 9.14. technical_integrity 9.6 vì lượt này không chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`. Lỗi số cùng loại ngoài bài này (chưa sửa): `tha-ap143:3.1` (*chín mươi tư* thay vì 1.700), `tha-ap135:8.1` (`Catuddase` = 1.400), `tha-ap136:7.1` (`Ekārase` = 1.100), `tha-ap145:4.1` (`Soḷaseto` = 1.600), `tha-ap188:3.1` (`Pannarase` = 1.500), `tha-ap192:5.1` (`Teraseto` = 1.300), `tha-ap56:7.1` (`Aṭṭhavīse` = 2.800); hướng sai cho `pācināmukho` (phương đông) ở `tha-ap86:4.4` và `tha-ap160:3.4`.

  Quyết định hội đồng biên tập 2026-10-16: C5 — 0.3, 7.1 (tiêu đề và dòng kết theo "Ký Sự Về"; bỏ "Bài Kệ Tuyên Ngôn").
