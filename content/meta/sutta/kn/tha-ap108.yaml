notes: |-
  **Nguồn đã đo, không suy đoán.** Pāli root lấy từ `.cache/upstream/suttacentral`
  theo commit đã ghim `11c9d708978cde8ba61096d8a75f7ddfb846f639` (`source/upstream-manifest.json`, tầng `pali`). Ba tầng tham
  khảo: `english-sujato` **không phủ `tha-ap`** — trong tầng này chỉ có 9 sub-collection của
  `kn` (cp 35 · dhp 26 · iti 112 · ja 83 · kp 9 · snp 73 · thag 264 · thig 73 · ud 80 =
  755 tệp); tệp `tha-ap` duy nhất trong cả tầng là
  `name/sutta/tha-ap-name_translation-en-sujato.json`, tức **tệp tên**, không phải thân
  kinh. `vietnamese-current` 26 tệp, toàn bộ Pháp Cú, không có `tha-ap`. `english-project`
  không có entry cho bài này.

  **Vì sao `draft`, không phải `published`** — một lý do, đo được: tầng Anh đã ghim không
  phủ `tha-ap`. Điểm cao không cứu được blocker. `content/meta/reference-gaps.yaml` **đã có**
  entry cho bài này (`substantiveSegments: 1`, `coverage: 0`) — nhưng có entry không đứng
  được `published`, và tôi bị cấm sửa tệp đó.

  **Cổng kỹ thuật chưa chạy.** Lát này bị cấm `git` và cấm `npm run validate|test|check|build`.
  Bốn lệnh còn lại thuộc cổng của người điều phối: `npm run validate` · `npm test` ·
  `npm run check` · `npm run build`. Tiêu chí 10 vì vậy là **9,6**, không phải 10,0 — tôi không
  tuyên bố technical gate pass.

  **Năm phép kiểm tự viết, quét MỌI khoá** (ngưỡng 40 ký tự của `_hvi.py` ở đây bỏ sót gần
  hết bài nên không dùng):

  1. `set(khoá Việt) == set(khoá Pāli)`: đúng bằng 32/32, **0 orphan**, 0 thiếu, 0 thừa.
  2. Dấu nháy: đếm cả **nháy kép** `“”` lẫn **nháy đơn** `‘’`, và so **theo khoá** với Pāli —
     khớp tuyệt đối. Bản Việt cố ý **không** tự cân mỗi khoá, vì Pāli cũng vậy: `“` mở ở
     `:1.1` và `“` đóng ở `:7.3`; `‘` mở ở `:4.1` và `‘` đóng ở `:4.4`. Lũy kế về cuối
     bài: kép = 0, đơn = 0.
  3. `…pe…`: đúng 1 khoá mỗi bài (`:7.2` / `:5.2`), giữ **đúng một** `…`, không mở rộng.
  4. `…` trần: **không có** khoá nào chỉ chứa `…` trần — dấu lược duy nhất trong bài chính
     là `…pe…` ở điểm 3. Mẫu số phép này = 0 khoá riêng.
  5. Cặp Pāli trùng nguyên văn **trong chính bài**: **0 cặp** trên 32 khoá (mẫu số 32 khoá,
     và cả 32 chuỗi Pāli đều khác nhau), nên không có cặp nào mà Việt bắt buộc phải khác.
     Thay vào đó tôi dò **chéo cả phẩm**: **53** dòng Pāli của ba bài này cũng xuất hiện ở
     bài `tha-ap` khác; **35** dòng tôi viết đúng bằng chuỗi đa số đang có trong kho,
     **18** dòng không.

  **Mười tám dòng không trùng đa số — phân loại, để không ai tưởng tôi tự ý làm khác:**

  - **4 chỗ chỉ khác ở đại từ Ta/Tôi** (`Mama saṅkappamaññāya` ×1, `Duggatiṁ
    nābhijānāmi` ×2, `yaṁ saññamalabhiṁ tadā` ×1). Kho đang có *Ta không biết mình rơi vào
    khổ đau,* 124 chỗ so với *Tôi không biết mình rơi vào khổ đau,* 3 chỗ. Tôi giữ **Tôi**
    vì trong chính ba bài này người kể là *tôi* (`Tôi đã tự tay nâng nước lên,` ở
    `tha-ap108:2.1`; `Tôi cầm lấy hoa Nāga …` ở `tha-ap112:2.3`; `tôi ở trong thung lũng
    núi;` ở `tha-ap130:1.2`), và sáu bài lân cận 103–106, 111, 113 cũng dùng *tôi*. Đổi
    riêng một dòng sang *ta* là tự phá vỡ chính bài mình.
  - **2 chỗ chỉ khác ở Từ/Vào** (`Ekanavutito kappe` ×2): kho đang có *Vào chín mươi mốt
    kiếp trước,* 32 chỗ và *Từ chín mươi chín kiếp trước,* 20 chỗ (cộng 6 biến thể nữa).
    Cả hai đều là **91**. Tôi giữ *Từ …* vì đúng hai bài gần nhất dùng nó
    (`tha-ap102:3.1`, `tha-ap113:8.1`).
  - **12 chỗ còn lại là lựa chọn bám Pāli**; ở ba chỗ sau, tiền lệ đang làm sai và tôi
    **không** nhân:

    - `tha-ap112:1.2` `Sataraṁsiṁva bhāṇumaṁ;` — `tha-ap87:2.2` dịch *như mặt trời tỏa ra
      **trăm ngàn** tia sáng*. Pāli không có `ngàn` (`sataraṁsi` = trăm tia). Tôi viết *tựa
      như mặt trời tỏa trăm tia sáng trên mặt đất* để giữ cả `bhāṇumaṁ`. **Xin sửa
      `tha-ap87:2.2` theo; tôi không được sửa tệp ngoài lát.**
    - `tha-ap130:1.1` `Pabbate himavantamhi,` — đa số gần nhất (6 chỗ) viết *Ở nơi vùng núi
      Himavanta*; `tha-ap87:1.1` và `tha-ap260:1.1` lại dịch thành *Tuyết Sơn* / *Tuyết Lãnh*.
      Tôi giữ *Giữa núi Himavanta* (tên chuẩn `Himavanta` có 17 chỗ trong tầng `kn`). Cả ba
      cách đều đang tồn tại nên ghi ở đây.
    - `tha-ap112:2.4` `vipassissābhiropayiṁ.` — `tha-ap65:2.4` dịch Vipassi thành *Dữ Kiến*,
      tức lấy tên một vị Đại Vĩ ở bài khác. Tôi giữ *Vipassi*.

  **Thuật ngữ, đếm được trong `content/translation/vi/project/sutta/kn/`:** `Paṭisambhidā`
  → *Bốn vô ngại giải* (380 chỗ, khớp cả glossary `content/glossary/pali-vi.yaml`);
  `Itthaṁ sudaṁ āyasmā … thero imā gāthāyo abhāsitthāti` → *Tôi nghe như vầy: … đã nói
  **những** bài kệ này* — trong `tha-ap` đo được **409** bản dùng số nhiều so với **19**
  bản dùng *bài kệ này* (toàn tầng: 424 so với 45). `Therāpadāna` giữ nguyên (389);
  `…pe…` → `…` (533/533); `bài kệ` (470) so với `câu kệ` (8).

  **`translationTitle` khớp đúng chính sách ở `:0.3`** — dùng hình thức `N. ` khi và chỉ
  khi Pāli `:0.3` **bắt đầu bằng số**; hình thức này có 11 chỗ tiền lệ so với 7 chỗ viết
  `N ` trần trong 428 tệp `tha-ap`.

  **Tên riêng đã đối chiếu ba nơi trong chính bài:** `Udakapūjaka` ở tiêu đề
  `:0.3` (`Udakapūjakattheraapadāna`), ở lời-kết `:8.1` (`āyasmā udakapūjako thero`) và ở
  lục kết `:9.1` (`Udakapūjakattherassāpadānaṁ`) — khớp cả ba; giữ nguyên dạng Pāli. Cùng
  cách ấy ở `tha-ap108:10` không có, nhưng trong uddāna của `tha-ap112:10.3` tên ông hiện
  dạng rút gọn `Udakado`, và tôi giữ đúng dạng Pāli của uddāna đó.

  **`dakadānena` (`:4.1`) là `udaka`-dāna, không phải `daka` = mười.** Đây là chỗ tôi
  đã tra thay vì đoán. Ba parallel **trong chính Pāli đã ghim**:
  `thi-ap10:12.2` `yaṁ dakaṁ adadiṁ tadā` / `thi-ap10:12.4` `dakadānassidaṁ phalaṁ` (bài
  của vị tỳ-kheo nữ tên `Udakadāyikā` — người dâng nước), `tha-ap208:3.2`
  `udakaṁ yamadāsahaṁ` / `:3.4` `dakadānassidaṁ phalaṁ`, và `tha-ap499:3.2–3.3` (cùng
  cặp, bài `Udakadāyakattheraapadāna`). Ba bài đó đều là người dâng **nước**; `dakadāna`
  là dạng rút gọn mất `u`. Nên tôi dịch *Với tấn lòng dâng nước này,* — không phải *dâng mười
  cái gì*. (Ghi lại vì `dakadāna` chỉ xuất hiện 4 lần toàn Pāli root và dễ bị đọc thành
  *daka* = mười.)

  **`Kappasatasahassampi` (`:4.3`) = một trăm nghìn kiếp, không phải ba nghìn.** `kappe` =
  nghìn, `sata` = trăm ⇒ 100 × 1000. Có thang tăng dần ngay trong Pāli đã ghim:
  `sn15.5:2.7` liệt kê `nekaṁ kappasataṁ … nekaṁ kappasahassaṁ … nekaṁ
  kappasatasahassaṁ`. Tôi viết *Dù trong trăm nghìn kiếp,*.

  **`Pañcasaṭṭhikappasate` (`:6.3`) — bất định đã ghi, và đây là con số duy nhất tôi phải
  chọn cách hiểu.** Cấu trúc `X`-`kappasate` khớp `Paṇṇatālīsito kappe` (`tha-ap112:4.1`,
  bốn mươi lăm) và `Ekasaṭṭhimhito kappe` (`tha-ap208:4.1`). Với tiền tố `Xsaṭṭhi`,
  chính tầng này đã có tiền lệ **đọc sai**: `tha-ap208:4.1` và `tha-ap320:7.1` dịch
  `Ekasaṭṭhimhito kappe` thành *bảy mươi bảy*, trong khi `ekasaṭṭhi` = 1 + 60 = **61**.
  Tôi **không** nhân phép đo sai đó. Theo cùng phép, `pañcasaṭṭhi` = 5 + 60 = **65**, và
  `kappasate` = *trăm kiếp* ⇒ 65 trăm kiếp. Tôi viết *Vào kiếp thứ sáu mươi lăm trăm,*
  (nói thẳng 65 trăm, không nhân gộp thành 6.500 để tránh hàm ý đã làm rõ hơn Pāli).
  Cách đọc thay thế là `pañcasat` = năm trăm, nhưng hình thức Pāli là `pañcasaṭṭhi`, không
  phải `pañcasat`; tôi theo chính chữ. Số lượng này không mang ý nghĩa giáo lý, nên tôi
  để `ambiguity_integrity` ở 9,2 thay vì nâng blocker.

  **Hai ẩn dụ lửa (`:1.3–1.4`).** `Ghatāsana` = lửa lễ ở bờ sông; `Ādittaṁva hutāsanaṁ`
  có **đúng cùng công thức** ở `tha-ap333:2.4` (`ādittaṁva hutāsanaṁ`), nên tôi giữ nghĩa
  *lửa được nhóm lên* chứ không nâng thành *lễ đàn*. Cả hai ẩn dụ chỉ nói Đức Phật không bị
  dập tắt, nên để thành lửa bừng cháy là bám Pāli nhất.

  **Còn lại:** `Sampaṭicchi mahāvīro` = chủ ngữ là **Đức Phật** đã tiếp nhận (`sampaṭicchi`
  là chủ động số 3, không phải tôi dâng), nên `Tôi đã tự tay nâng nước lên,` ở `:2.1` là
  người kể và `bậc Đại Hùng đã tiếp nhận,` ở `:2.3` là Đức Phật — hai chủ thể phải tách,
  và tôi đã tách. `hitvā jayaparājayaṁ` dịch *đã buông bỏ cả thắng lẫn bại* theo tiền lệ
  (`tha-ap442:3.4`, `tha-ap554:2.4`, `tha-ap64:3.4`, `tha-ap70:7.4`). `ṭhito satthā` ở `:3.1`
  dịch *Bậc Đạo Sư đứng giữa hư không* theo đúng hai chỗ tiền lệ có cùng dòng Pāli
  (`tha-ap115:2.3`, `tha-ap69:3.3`); `ākāse` ở `:2.2` dịch *hư không* theo `tha-ap84:2.2` và
  `tha-ap92:2.2`.

  **Vì sao `triangulation` = 8,6.** Ở đây **không có tầng Anh đã ghim nào** và cũng không
  có bản Việt hiện hành cho Khuddaka (tầng `vietnamese-current` chỉ có Pháp Cú). Tôi có
  tra một bản dịch Anh công khai trên SuttaCentral (Jonathan S. Walters, 2017, bản dịch
  Apadāna) **để phân xử hai chỗ hiểu ngữ**: `dakadāna` và `Uḷurāja`. Đó là tư liệu nghiên
  cứu, **không phải tầng tham khảo đã ghim**, và tôi không tuyên bố bài này đã đối chiếu
  English theo nghĩa của `reference-gaps.yaml`. Mọi câu tiếng Việt đều viết lại từ Pāli.

  **Nguồn cho mọi khẳng định đếm được trong ghi chú này:**
  `npm run store -- tha-ap108` (khoá đủ 32/32) · `npm run audit:store` ·
  `npm run audit:reference` · `npm run verify:store` — bốn lệnh này thuộc cổng của người
  điều phối, tôi bị cấm chạy; số đếm ở trên tôi lấy bằng cách đọc trực tiếp
  `.cache/upstream/suttacentral` và `content/`.
