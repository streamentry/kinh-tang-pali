notes: |-
  Tiền lệ đếm được: `kalyāṇin` → người thiện; `pāpika` → kẻ ác (25 tiền lệ); `tappati` → sầu khổ (53 tiền lệ); `muñc`/`mokkha` → thả (thả 249 tiền lệ).
  Đây là bài khó nhất lát: bộ vế ở Pāli root khác hẳn bộ vế mà Cowell 88 dịch (Speak kindly, revile not your fellow…), và `muñc` nghĩa gốc là thả/buông chứ không phải giết. Tôi giữ nghĩa chữ — thả người thiện, đừng thả kẻ ác, thả người thiện là điều tốt lành, kẻ ác được thả thì sầu khổ — và không suy ra nghĩa giết, dù đọc theo hướng đó sẽ hợp với câu chuyện báo thù hơn. Vì không có tầng Anh nào cho bài này, đây là lựa chọn cứu vãn chưa kiểm được; đó là lý do điểm thấp nhất lát.
  `Mokkho` ở 1.3 là danh từ cùng gốc với `muñc`; tôi dịch cả hai bằng một chữ thả, để 1.1 và 1.3 không lệch nghĩa với nhau.
  0.3 `Apāyimhavagga` dùng chung tên phẩm với ja81…ja89 (một tên phẩm cho cả phẩm, không dịch khác nhau từng bài). 0.4/2.1: `Sārambha` là tên con bò mà Bồ tát thọ theo trong truyện Cowell 88, nên đặt Kinh Con Bò Sārambha theo kiểu Kinh Con Nai Nigrodha (ja12) và Kinh Con Công (ja159).
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. 0.1 Jātaka giữ nguyên (58 bài đã có) và 0.2 Ekakanipāta → Bộ Một Bài Kinh (57 bài) theo tiền lệ đếm được. 1.1 mở nháy kép, 1.4 đóng nháy kép + dấu chấm, không giữ `ti.` (tiền lệ 51/57 bài; 10 bài mới hơn cũng bỏ). Dòng kết 2.1 dùng dấu phẩy (Kinh X, thứ N) theo làn sóng gần nhất ja108…ja119; kho còn 48 bài không dấu phẩy — ghi ở đây để biên tập chuẩn hoá sau, tôi không sửa bài ngoài lát. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Chú giải Jātaka-aṭṭhakathā bằng Pāli không truy cập được trong môi trường dịch này, nên bối cảnh lấy từ truyện E. B. Cowell, The Jātaka vol. I (bản 1895, tải từ archive.org); đây là lý do triangulation không lên cao. technical_integrity 10.0 căn cứ chốt _hvi.py đã pass và tự chạy lại script kiểm bổ sung (9/9 khoá khớp Pāli, NFC, ngoặc kép cân trên cả bài, không lệch dấu lược); npm run validate|test|build không chạy theo lệnh cấm của lát.
  Lượt cải thiện 2026-10-13: sửa lỗi nghĩa ở cả bốn khoá 1.1–1.4. Lượt trước đọc `kalyāṇiṁ`/`pāpikaṁ`/`kalyāṇiyā` là "người thiện/kẻ ác" và `muñceyya` là "thả"; đọc lại thì cả ba dạng đều là giống cái, cùng kiểu `pāpikaṁ vācaṁ` (mn21:6.4, mnd4:22.6 — đã dịch "lời ác") và `vācaṁ muñceyya/pamuñce`, `giraṁ pamuñce` (mnd16:257.2, ja518:19.2, ja478:7.4 — đã dịch "thốt lời"), nên `vācā` được hiểu ngầm: "thốt lời lành, đừng thốt lời ác". Bài chép thành "thả người thiện, đừng thả kẻ ác" là thêm chủ thể "người" mà Pāli không có và đổi hẳn nghĩa bài kệ; lượt trước đã tự nhận chưa kiểm được, nay có căn cứ để sửa. Khoá đổi: 1.1 "Chỉ nên thả người thiện" → "Chỉ nên thốt ra lời lành"; 1.2 "đừng bao giờ thả kẻ ác" → "đừng bao giờ thốt ra lời ác"; 1.3 "thả người thiện là điều tốt lành" → "thốt lời lành là điều tốt lành"; 1.4 "kẻ ác mà được thả thì sầu khổ" → "thốt lời ác rồi thì sầu khổ" (`mutvā` là phân từ bất biến, chủ thể là người nói, không phải kẻ bị thả). 4/9 khoá đổi. Đối chiếu độc lập (không thuộc tầng đã ghim, chỉ để hiểu cách đọc, không chép câu chữ): chú giải Pāli của bài, như một trang tham khảo ngoài trích, gloss `kalyāṇiṁ` là lời nói không có bốn lỗi khẩu, `muñceyya` là nói/đáp, `mutvā` = `muñcitvā` (đã nói), `tappati` là hối tiếc, khổ não; và đoạn mở bản truyện Chalmers (lời nói ái ngữ đối lại lời mắng nhiếc) cùng hướng. Tiền lệ đếm: "lời ác" 38/43 khoá (so "lời xấu" 5) ở Trung Bộ + Tiểu Bộ; "thốt lời/thốt ra lời" dùng cho `muñc`+`vācā`/`giraṁ` ở 3/3 chỗ đối chiếu trên. Điểm đổi: semantic_fidelity 8.8 → 8.9 (trước đó điểm cao hơn thực tế vì chưa thấy lỗi giống; nay đã sửa nhưng khoá 1.3 `mokkho` còn hai cách đọc), grammar_logic 8.5 → 9.0 (hoà hợp giống, chủ thể của `mutvā` đã đúng), terminology 8.6 → 8.2 (dùng chung tên phẩm "Phẩm Chưa Từng Uống" của ja81–ja90: `apāyimha` là động từ aorist ngôi thứ nhất số nhiều của `pibati` — "chúng tôi đã uống" — nên "Chưa Từng Uống" nhiều khả năng là sai; không sửa ở bài này vì tên phẩm dùng chung 10 bài và bài ja81 còn khoá 1.1 liên quan, để biên tập chỉnh hàng loạt), triangulation 7.0 → 7.5 (thêm đối chiếu với năm chỗ song song trong kho Pāli ghim, vẫn không có bản Anh/Việt ghim), vietnamese_clarity 9.0 → 9.2 (bài kệ nay đọc thuận nghĩa), ambiguity_integrity 8.4 → 8.8 (đã ghi rõ lý do bỏ cách đọc "thả người"), technical_integrity 10.0 → 9.6 (không chạy được `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này). Bất định còn lại: `mokkho` ở 1.3 được dịch "thốt lời lành" theo chú giải; nghĩa gốc "giải thoát/buông ra" rất gần `muñc` nên chỉ phân xử được bằng đọc chú giải, không bằng bản Anh ghim. Chữ `tappati` giữ "sầu khổ" theo 53 tiền lệ dù chú giải nghiêng về "hối tiếc"; không đổi để khỏi lệch tiền lệ. Chỗ phần ghi cũ nói "thả người thiện" ở trên (đoạn thứ hai và thứ ba của ghi chú đầu) đã bị lượt này thay thế.
  Sửa lan 2026-10-13: `Apāyimhavagga` — tên phẩm lấy từ vế đầu của `ja81:1.1`, mà `apāyimha` là thức aorist ngôi thứ nhất số nhiều có tiền tố `a-` (*chúng tôi đã uống*), cùng dạng với `agāyimha` (*chúng tôi đã hát*) và `anaccimha` (= `a-` + `naccimha`, *chúng tôi đã nhảy múa*); dạng phủ định phải là `na`/`nā`. Bản cũ đọc `a-` là phủ định (*Chưa Từng Uống*). Tiền lệ đo trên tầng: ở `kn` các động từ aorist ngôi 1 số nhiều có `a-` (`agamimha`, `adāsimha`, `apucchimha`, `akarimha`… 20+ khoá) đều dịch khẳng định. Khoá `ja88:0.3`: *Phẩm Chưa Từng Uống* → *Phẩm Chúng Tôi Đã Uống* (cùng tên ở `ja81`…`ja90`, một tên phẩm cho cả phẩm; `ja90:4.1` giữ `Apāyimha` là tên trong bài tóm lược, không đổi). Điểm không đổi; giữ nguyên các khoá còn lại.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 4 khoá chênh lệch lớn nhất → khác nghĩa 2: sửa 0, giữ 1 (1.4: bản mù dịch `tappati` là "hối hận", bản này giữ "sầu khổ" theo 53 tiền lệ của tầng; cả hai bản đều đọc `mutvā` là người nói đã thốt lời ác nên chủ thể không khác), bất định 1 (0.3: bản mù giữ nguyên `Apāyimha`; bản này đọc `apāyimha` là aorist ngôi 1 số nhiều "chúng tôi đã uống" như đã ghi ở mục sửa lan; Pāli ghim chỉ cho xác nhận về hình thái, không có chú giải ghim để kiểm). Hai khoá còn lại (0.4, 2.1) chỉ khác cách đặt tên bài ("Kinh Con Bò Sārambha" so với "Chuyện Tiền thân Sārambha"), giữ theo khuôn "Kinh <Tên>" của tầng. Bản mù cũng đọc 1.1–1.4 là lời nói (thốt ra lời lành/lời ác), cùng hướng với bản này; vì cùng họ công cụ nên đó không phải bằng chứng độc lập. Đọc đối kháng lại toàn 9 khoá (nháy, dấu cuối khoá, thuật ngữ): không phát hiện lỗi mới; bất định về `mokkho` (1.3) và `tappati` đã ghi ở trên vẫn còn. Không có bản Anh hay bản Việt độc lập khác.
