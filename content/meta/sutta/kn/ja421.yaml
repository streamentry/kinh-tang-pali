  Pāli trùng nguyên văn trong tầng đã có: 3 khoá. **2 khoá dùng lại NGUYÊN VĂN** — `:0.1` (390/406 tệp) và `:6.1` theo `vv3:5.1` (*Tôi từng tưởng quả báo của việc ấy*; cùng câu kệ nguyên vẹn, chỉ khác bối cảnh kể trước). Trong lát này: `:1.3` = `:2.3` và 16 khoá tiêu đề dùng chung *Jātaka*, tất cả đều giống hệt nhau.
  **Bất định đã ghi, không bịa:** (1) `:3.3` `Atthā hi vividhā rāja` — `atthā` là danh từ ("mục đích/điều") hay là dạng thay đổi của `attho` ("vậy") chưa chắc; tôi đọc là danh từ và dịch *bởi các mục đích đa dạng*, nếu đọc `attho` thì câu phải dịch khác. (2) `:7.2` `nhāpitakumbhakārabhāvaṁ` — `kumbhakāra` là bánh xe người làm gốm (cũng là hình phạt ở cõi địa ngục), nên `nhāpita` là “bị xoay”; dịch theo nghĩa hình phạt nhưng thán. (3) `:8.1` `‘amma’` — `amma` là từ gọi thân mật của “mẹ”, nhưng bài kệ này không có phần văn xuôi nào trong chính bản Pāli đã ghim để xác nhận người gọi là ai; tôi dịch *Mẹ ơi* và giữ nguyên dấu nháy cong theo Pāli, không bịa thêm ai đang nói. (4) `:9.3` `Eso hi atari aṇṇavaṁ` — `atari` (vượt qua) + `aṇṇava` (đại dương); dịch theo nghĩa *dòng ngược bờ bên kia của cõi chết* thay vì khẳng định đây là một địa danh.
  Thuật ngữ theo tiền lệ đếm được: `Gaṅga` → sông Hằng (`mil5.4.5:5.1`), `kukkuḷa` → đầu sọ (không có tiền lệ, dịch nghĩa), `brahmacariya` → phạm hạnh (`an3.18:1.2`), `sukhavihāri` không có tiền lệ. `atthi` → có, `attho` → vậy, `api` → cũng.
  Lỗi bắt được ở lượt review đối kháng, đã sửa: (1) `:6.1` bản nháp tự viết *Ta đã nghĩ về quả báo của việc làm ấy:* — đã thay bằng nguyên văn của `vv3:5.1`; (2) `:1.3`/`:2.3` bản nháp dịch `Atha` là *Nối*, sai sắc thái, đã sửa thành *Đống xác chết ấy chất lại*; (3) `:9.2` bản nháp dịch `Muna` là *bậc xuất gia* (nghĩa là đã xuất gia), trong khi `muni` là bậc tu sĩ — đã sửa thành *bậc tu sĩ* cho khớp với `khaṇa` ở `mil5.4.8`.
