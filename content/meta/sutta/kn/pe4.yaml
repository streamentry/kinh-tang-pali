notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pe/pe4_root-pli-ms.json` (111/111 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli). Đây là nền tảng thứ tư (`Suttavicayacatutthabhūmi`) của Peṭakopadesa, thuộc Trưởng lão Mahākaccāyana (13.1).

  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho pe4: tầng `english-sujato` chỉ có chín nhánh `cp dhp iti ja kp snp thag thig ud` dưới `sutta/kn/`, không có thư mục `pe`; chỉ có tệp tên `pe-name_translation-en-sujato.json` (pe4 = "The Fourth Stage: Investigation of Discourses") không có prose của bài. Đây là `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` chưa có tệp cho pe4. Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú. Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.0 (≤ 8.0). Bài này dịch chỉ từ Pāli và từ tiền lệ thuật ngữ của chính tầng dự án (pe7, ne6, ne11, mn2, mn12, sn9.3, dn16, an4.180).
  - Coverage English:
    Mẫu số = 73 khoá Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`). Sujato phủ 0/73 (0/111 khoá tổng); coverage English 0%, dưới ngưỡng, nên bài chưa thể `review`/`published`; `reference-gaps.yaml` có entry cũng không cứu được `published` (ngoài phạm vi lát này, không chạm). Không có cách đọc English độc lập nào cho bài này.
  - Tiền lệ cùng bộ (`pe`, `ne`):
    Chỉ có pe7 đã dịch trong nhóm `pe`; `0.1` "Peṭakopadesa" dùng lại nguyên văn của pe7:0.1. `0.2` giữ số thứ tự "4." như `ne1:0.2`, `ne2:0.2` (cả hai giữ số) và `mil`, `vv` (số giữ ở mọi trường hợp đã đo: `an` 1.393, `sn` 1.819, `ja` 494). "Nền Tảng Thứ Tư" cho `catutthabhūmi` theo `bhūmi` → "nền tảng" của `ne6` (tên Sujato là "The Fourth Stage"); "khảo xét kinh" cho `suttavicaya` theo `vicaya` → "khảo xét" của `ne6`. `13.1` đặt cùng nhịp với `pe7:11.1`: tên chương rồi tên tác giả.
  - Pāli trùng nguyên văn:
    Dò Pāli của 111 khoá với toàn bộ Pāli đã ghim: 6 khoá có Pāli trùng ở bài khác (`0.1` trùng `pe1`–`pe9`; `6.6` trùng 13 khoá `mil`; `7.1` trùng `pe2:178.1`, `ne37:485.1`; `8.2`, `8.3` trùng `sn9.3:4.2`, `4.3`; `11.1` trùng `pe1:9.1`). Số cặp trùng mà phía kia đã có bản Việt: 16 cặp (`0.1` với `pe7:0.1`; `6.6` với 13 khoá `mil`; `8.2` và `8.3` với `sn9.3`); 0 cặp bản Việt khác. Dùng lại nguyên văn 4 khoá (`0.1`, `6.6` "Vì lý do gì?" trùng cách `mil` đã dịch, `8.2`, `8.3`). `8.1` và `8.4` gần như nguyên văn `sn9.3:4.1`, `4.4`: `8.1` thêm nháy mở theo Pāli bài này; `8.4` bỏ chữ "vốn" vì Pāli bài này không có `hi` (`cakkhu tassa`, không phải `cakkhu hissa`). Trong chính bài: 0 cặp Pāli trùng nguyên văn (phép chạy rỗng, không phải 0 lỗi).
  - Thuật ngữ (đếm trên tầng Việt hiện có, cùng Pāli):
    + `kilesa` → "phiền não" (55 so "ô nhiễm" 2); `saṅkilesa` → "ô nhiễm" để tách khỏi `kilesa`; `pahāna` → "đoạn trừ"; `kusalā/akusalā dhammā` → "các pháp thiện/pháp bất thiện" (136/162).
    + `ariyadhamma` → "pháp của bậc Thánh" (18 so "Thánh pháp" 6, "pháp Thánh" 2); `ariyamagga` → "Thánh đạo".
    + `upaparikkh-` → "xem xét" (6 khoá; tầng rất phân tán: "khảo sát" 20, "suy xét" 12, "quán xét" 11); `vīmaṁs-` → "thẩm sát" (13 khoá, và `pe7` dùng "thẩm sát" cho `vīmaṁsāsamādhi`; "suy xét" 22, "khảo sát" 10); `vicaya`/`vicinitabba` → "khảo xét" theo `ne6`. Ba chữ giữ ba cách Việt khác nhau trong cùng bài để không gộp.
    + `yujjati` → "hợp lý" (`ne6:2.8`, `ne6:8.2`, `ne6:11.5`, `mil3.3.6`); `yojanaṁ deti` → "cho sự phối hợp"; `gahetabba` → "thu nhận" (`ne6:2.8`); `apakaḍḍhati` → "kéo ra" (`dn9:6.21`, `6.23`; "rút ra" 0 tiền lệ và dễ lẫn nghĩa "rút ra kết luận").
    + `paṭipakkha` → "đối nghịch" (pe7); `ākāra` → "phương diện", `pakāra` → "cách"; `mahāpadesa` → "đại y" theo `ne6` (`an4.180` 5, "đại giáo pháp" `dn16` 5: tầng chia đôi).
    + `paccaya` → "duyên" (519/612), `hetu` → "nhân", `nissanda` → "dòng tuôn chảy" (`mil5.1.4:11.2` `dānanissanda`; 0 khoá nào khác có `nissanda` ở tầng đã dịch), `phala` → "quả".
    + `mudu/majjha/adhimatta` → "yếu/vừa/mạnh" (`adhimatta` "mạnh" 61/158; `mudu` ở các nơi khác dịch "mềm" cho nghĩa vật lý, không dùng ở đây).
    + `byākaraṇa` → "giải đáp" (98 so "giải thích" 48); `niddisati` → "chỉ ra" (pe7; tầng: "chỉ rõ" 4, "trình bày" 3, "chỉ ra" 1); `dassana` → "thấy biết" (`mn2:4.1`, 4/4 khoá có `dassanā pahātabbā`); `paṭisevanā` → "sử dụng", `vinodanā` → "loại bỏ" (cả hai theo `mn2:4.1`); `diṭṭhi` → "kiến" (220 so "tà kiến" 12).
    + `sāvaka` → "đệ tử" (794/833, "Thanh văn" 0); `gocara` → "phạm vi" (40; "hành xứ" 1); `dasabala` → "Bậc Mười Lực" (13, so "mười lực" 13); `bhāgineyya` → "người cháu" (7); `anāgāmī` → "bậc Bất lai" (28/37); `orambhāgiya saṁyojana` → "hạ phần kiết sử" (127/180) và `uddhambhāgiya` → "thượng phần"; `saṅkaro` → "hỗn tạp", `sambheda` → "pha trộn" (`dn3:1.15.11`); `uddānagāthā` → "bài kệ tóm lược" (`thi-ap40:22.1` "kệ tóm lược"; `dn23:35.0` "Tóm lược").
    + `vāsanābhāgiya` → "thuộc phần nuôi dưỡng tâm" theo `ne11` (4 khoá: `2.1`, `2.3`, `3.1`, `3.2`): đó là chỗ người dịch `ne11` tự đặt và đã ghi để người biên tập xét lại, nên ở đây đi theo để hai bài `ne`/`pe` khớp nhau; nếu người biên tập đổi ở `ne11` thì đổi cả ở đây (`10.2`, `10.6`, `12.3`). `dassanabhāgiya` → "thuộc phần thấy biết", `bhāvanābhāgiya` → "thuộc phần tu tập", `asekkhabhāgiya` → "thuộc phần vô học": 0 tiền lệ, đặt theo quy tắc `-bhāgiya` → "thuộc phần" của `ne11`.
    + `anantariya` → "nghiệp vô gián"; `iddhipāṭihīra` → "thần thông biến hóa" (`dn24:1.4` "thần thông"); `ṭhānaso hetuso` → "theo nền tảng … theo nhân" (`mn12:11.1`, `sn52.16:1.1` dịch "nền tảng và nguyên nhân"; ở đây `hetu` khắp bài đã là "nhân" nên viết "nhân"); `indriyabalavemattañāṇa` → "trí về sự sai khác của các căn và lực" (`mn12:15.1` dịch `indriyaparopariyatta` là "căn cơ mạnh yếu").
  - Số Pāli:
    `catutthabhūmi` 4; `ekena ariyamaggena` 1; `dve tīṇi vā taduttari vā kilesā` 2, 3 hoặc hơn; `dve vā kilesā ekena ariyadhammena … dvīhi vā ariyadhammehi eko vā kileso` 2/1/2/1; `tividho paccayo` 3 (đúng ba mục ở `6.3`: yếu, vừa, mạnh); `duvidho paccayo` 2 (đúng hai mục ở `6.4`); `pañcannaṁ indriyānaṁ` 5; `dasabalo`/`dasabalānaṁ` 10 lực; `satta āsavā` 7 (bảy cách đối trị lậu hoặc ở `mn2`); `dasa pajjote` 10; `pañcavidhaṁ suttaṁ` 5 (đúng năm mục ở `10.2`); `ubho kilesā` 2 (`3.27`); `catutthabhūmi` ở `0.2` và `13.1` đều là 4. Bài không có số lớn; không có cụm cần phân xử.
  - Chỗ bất định (không thêm vào thân kinh):
    + `2.2` `saha adhisannaṭṭhehi`: không phân giải được. Có thể là `adhi + sanna + ṭṭha` hoặc `adhisanna + atthehi`; dịch "những bài đã được an lập" theo nghĩa `adhiṭṭhāna` ở `6.10`, `6.12` (`suttādhiṭṭhāne`), chưa chắc.
    + `3.5`–`3.6`: hai mệnh đề rời của một câu điều kiện (`3.4` có `;`, `3.5` có `.`, `3.6` có `.`); giữ đúng ranh giới khoá.
    + `3.7` `yadi kilesā apakaḍḍhiyantā`: câu điều kiện không có vế sau; dịch đúng Pāli.
    + `3.8` `Ye vā na denti`: không có tân ngữ; dịch "những gì không đem lại điều ấy", ngầm theo `yojanaṁ deti` ở `3.11`, `3.14`.
    + `3.11`, `3.14` `yojanaṁ deti`: "cho sự phối hợp"; `yojanā` có thể là "sự ghép nối" hoặc "sự áp dụng".
    + `3.15` `paramparāya vā piṭakasampadānena vā`: "truyền thống" và "sự truyền trao của Tạng" (`an3.65`, `an4.193`: "truyền thống" 8, "truyền thừa" 4; `piṭakasampadāna` "kinh sách" 8, "học rộng trong Tạng" 4); chọn nghĩa "truyền trao" của `sampadāna`. `attho ca nattho ca`: dịch "cái gì là nghĩa, cái gì không phải nghĩa"; thêm "cái gì" vì Pāli chỉ có hai danh từ.
    + `3.21` `paṭhamo uttilo`: `uttilo` không gặp ở đâu khác trong Pāli root đã ghim, không phân giải được; giữ nguyên dạng Pāli `uttila` (không bịa nghĩa). `paṭhamo` là "điều thứ nhất".
    + `3.23` `aparipakkhitabbā`: từ hiếm; đọc là `a + paripakkha(ṭipakkha) + itabba`, "không nên được xem là phía đối nghịch". Cách đọc khác là sai chính tả của `apakaḍḍhitabbā` (như `3.24`).
    + `3.25` `anāgāmikilesappahānaṁ`: "sự đoạn trừ các phiền não của bậc Bất lai"; cũng có thể là "những phiền não mà bậc Bất lai đoạn trừ" hoặc "phiền não thuộc quả Bất lai".
    + `4.2` `Kileso maṁ`: `maṁ` không giải thích được trong câu (có thể là sai chép); không dịch, chỉ giữ phần còn lại.
    + `4.3` `Kira`: dịch "Nghe nói"; cũng có thể là tiểu từ hỏi nhấn mạnh.
    + `4.8`–`4.9`: `4.9` có `na` (phủ định) nhưng `4.8` không; `4.8` dịch đúng khẳng định như Pāli ("vì coi là phiền não, nó đi đến đoạn trừ nhờ kinh"), có thể một chữ `na` đã mất ở `4.8` (khuôn như `3.26`, `4.7`). `Na sutto dhammo` dịch "pháp của kinh" (đọc `sutto` như `suttadhammo`); cũng có thể là `sutto` "đã nghe".
    + `5.2`: câu kết bằng `.` nhưng là mệnh đề phụ, vế chính ở `5.3`; Việt dùng dấu phẩy.
    + `5.6` `tena vā ariyadhammā`: `ariyadhammā` xuất cách (hoặc đại từ cách) đứng sau `tena`; dịch "nhờ chính pháp của bậc Thánh ấy".
    + `5.7` `bhāvanāya bhūmi vā dhammā bhāvanāya pahātabbā`: dịch "hoặc các pháp thuộc nền tảng cần được đoạn trừ bằng tu tập"; ý của `bhūmi vā` chưa rõ.
    + `5.8` `asaṅkhatadassanāya vimuttiyā`: dịch "giải thoát nhằm thấy vô vi"; `dassanāya` (cách bốn) có thể đọc riêng, "nhờ giải thoát, để thấy vô vi". `uddhambhāgiyaṁ` ngầm là thượng phần kiết sử.
    + `5.10` `patisevanā` (đáng ra `paṭisevanā`), `yāva satta āsavā kātabbā, yāvaññathā`: dịch sát chữ; "bảy lậu hoặc" chỉ bảy cách đối trị của `mn2`, nhưng Pāli không nói rõ.
    + `5.12` `Yadi ayaṁ dhammo pariyesato`: văn bản có vẻ lệch, dịch sát chữ, không gỡ hộ.
    + `6.5` `mudutena byādhimattaṁ`: `byādhimattaṁ` có thể là `ca adhimattaṁ`; dịch "theo mức yếu và theo mức mạnh".
    + `6.9`–`6.11` `nissanda`: "dòng tuôn chảy" là kết quả tuôn ra của một pháp; `6.11` lập luận pháp yếu không đi với dòng tuôn chảy mạnh (và ngược lại).
    + `6.13`, `6.14`, `6.15`, `6.16`: `anurūpanti` rồi `rūpantipi`; `icchāva hoti`; `gopālakopame sutte` (kinh ví dụ người chăn bò) cạnh `majjhimanikāye vitakko`: tôi không xác định được kinh nào, không thêm tên kinh vào thân bài. Dịch sát chữ.
    + `7.5` `dasabalo gocaraṁ deseti`: `dasabalo` cách một; theo mạch `7.6` (`sāvako`, vị đệ tử thuyết phạm vi của các Bậc Mười Lực) đọc như `dasabalassa`, dịch "phạm vi của Bậc Mười Lực". `anotāretvā` dịch "không đi vào cho trọn vẹn".
    + `7.6` `puggalaparo parañca taṁ ajānanto sati uttarikaraṇīye uppādito`: dịch sát chữ "đã được làm cho sinh khởi"; `uppādito` có thể là đã khiến sinh khởi (một cảnh giới thấp) khi còn việc cần làm thêm, và câu có vẻ chỉ chuyện Sāriputta với vị Bà-la-môn (`mn97`), nhưng Pāli ghim không nói rõ chủ thể nên không thêm.
    + `7.7` `anantariyasamannāgato` dịch "có nghiệp vô gián"; `aṅguliyo adīpetvā` dịch "không làm các ngón tay sáng lên"; `bhāgineyyaṁ` "người cháu" (không nói là cháu con của chị hay em).
    + `8.1`–`8.4`: bài kệ trùng `sn9.3:4` (lời vị thiên nữ nói với tôn giả Kassapagotta) dù ở đây đặt sau Mahākassapa; dịch theo `sn9.3`, không đổi người nói.
    + `9.1` `sattamanusāsati`: tách `sattaṁ anusāsati` "chỉ dạy chúng sinh"; `sesānugo`, `aññātakaṁ ghosaṁ`: dịch sát chữ ("người theo sau những vị còn lại", "lời tuyên bố chưa từng biết").
    + `10.3` `aññaṁ ārādheyya`: không có chủ ngữ; dịch "có thể làm thành tựu điều này mà thuyết điều khác".
    + `10.8`: `adhimattesu suttesu` dịch "trong những kinh thuộc loại mạnh".
    + `12.3` `vāsanāsaddhi`: hoặc `vāsanā saddhiṁ` ("cùng với sự nuôi dưỡng tâm") hoặc `vāsanā suddhi`; chọn cách đầu.
    + `1.1` đến `10.10`: bài dùng cả `vīmaṁsitabba` lẫn `upaparikkhitabba` cạnh nhau như gần đồng nghĩa; bản Việt giữ hai chữ khác nhau.
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 111/111, cùng thứ tự.
    2. Nháy kép `“”`, nháy đơn `‘’` và ngoặc `()` khớp Pāli từng khoá: 0/111 lệch (Pāli chỉ có `“` ở `8.1` và `”` ở `8.4`, bản Việt giữ nguyên cả hai).
    3. Pāli trùng nguyên văn trong chính bài: 0 cặp (phép chạy rỗng).
    4. Dấu lược `…`: Pāli 1/111 khoá có (`2.2`, một `…pe…`); Việt đúng một `…` ở đó, 0 khoá khác có `…`. Không có `(…)`.
    5. Số Pāli: xem trên; không có số lớn.
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang Việt: `Peṭakopadesa` ở `0.1` và tên riêng `Sāriputta`, `Mahākassapa`, `Mahākaccāyana`, cộng `uttila` ở `3.21` (không phân giải được, xem trên).
