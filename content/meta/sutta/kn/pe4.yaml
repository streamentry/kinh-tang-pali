  Thí điểm gỡ chỗ Pāli ghim hỏng 2026-10-17 (Claude Opus 5.5; §5.5 của `docs/editorial-decisions-2026-10-17.md`, thứ tự: chữ ghim → câu song song → dị bản §5.1): 7 locus trong blocker, gỡ 3, không gỡ 4. GỠ: (a) `5.7` `bhāvanāya bhūmi vā`: đọc được theo chữ ghim, câu danh từ "vô minh ấy thuộc nền tu tập, hoặc thuộc các pháp cần được đoạn trừ bằng tu tập", khái niệm `bhāvanābhūmi` của `ne5:27.5`, `ne10:15.6`, `ne4:28.4` (published, "nền tu tập"); bản trước gán sai `bhūmi` cho `dhammā`, đã sửa. (b) `7.6` `puggalaparo parañca`: nối đúng các chữ ghim là `puggalaparoparañca`; đủ ba điều kiện §5.1: chữ tách như ghim không đọc được (DPD không có `puggalaparo`), lớp variant tại commit ghim ghi bj `puggalaparopariyaṁ ca`, pts-vp-pli1 `puggalo paroparañca`, đọc ra được (DPD `paropara`) và có song song `an7.68:1.3`, `an6.44:5.1`; dịch "sự hơn kém giữa các hạng người". (c) `7.6` `uppādito`: đọc theo chữ ghim (DPD "được làm cho sinh khởi"), chủ thể là vị Bà-la-môn theo mạch và câu song song `mn97:36.4`–`36.5` (cùng cụm `sati uttarikaraṇīye`), dịch "đã được đưa đến tái sinh"; `sati uttarikaraṇīye` dùng lại lời Việt của `mn97` đã published; `so … apasādito` viết "vị Tôn giả ấy" theo `mn97:38.4`. Indacanda (Tam Tạng Pāli–Việt tập 44, tr. 100, 104; chỉ làm bằng chứng nghĩa) đọc cùng cách ở cả ba chỗ. Chú thích người đọc ở `5.7`, `7.6`. KHÔNG GỠ: `2.2` `adhisannaṭṭhehi` (hapax; DPD chỉ có phân tách máy; không câu song song, không dị bản trong lớp variant ghim; Indacanda in cùng chữ, không ghi dị bản); `3.21` `uttilo` (DPD không có; chỉ gặp trong `Guttila`, không liên quan; không song song, không dị bản; `3.21` vẫn còn chữ Pāli "uttila" trong lời Việt); `4.2` `maṁ` (DPD chỉ cho "tôi" (cách bốn) hoặc tiểu từ "tốt lành", không chức năng nào hợp câu; đọc thành `imaṁ` là suy đoán; `4.3`–`4.4` chỉ giải thích "cả hai phía", không phải câu song song cùng câu); `6.5` `mudutena byādhimattaṁ` (không có trong lớp variant ghim; bản BJT do Indacanda in đọc `mudu tena vemattataṁ`, Ma và PTS như chữ ghim, nhưng đó là ấn bản ngoài lớp variant và nguồn giải nghĩa duy nhất là chính người in bản ấy, nên chưa đủ §5.1). Blocker và điểm không đổi ở lượt này; bài còn locus chưa gỡ nên giữ draft, không chấm lại.
  Lượt hai §5.6 (BJT) 2026-10-17 (Claude Opus 5.5; ấn bản Buddha Jayanti qua tipitaka.lk và bản in lại trong Tam Tạng Pāli–Việt tập 44 của Bhikkhu Indacanda): 4 locus còn treo trong blocker, gỡ 1, không gỡ 3. GỠ: `6.5` chữ ghim `mudutena byādhimattaṁ` (cả hai không có mục từ DPD, chỉ phân tách máy); BJT `p102` (TTPV tr. 102) đọc `so paccayo mudu tena vemattataṁ pariyesitabbaṁ`, cước chú ghi `byādhimattaṁ` là của Ma (machasaṁ) và PTS; đọc ra được theo DPD (`mudu` yếu, `tena` do đó, `vemattatā` sự sai khác); nguồn giải nghĩa: câu song song trong Pāli ghim nối ba bậc yếu/vừa/mạnh với `vemattatā` (`ne21:35.2` published, `pe2:34.4`, `pe4:7.6`) và bản dịch Việt của Indacanda (TTPV tr. 103) đọc cùng cách; Việt mới "Duyên ấy yếu, do đó cần tìm sự sai khác."; chú thích người đọc ở `6.5`. KHÔNG GỠ (BJT trùng chữ ghim): `2.2` `adhisannaṭṭhehi` (BJT `p98`, TTPV tr. 98, không cước chú); `3.21` `uttilo` (BJT `p98` in `uttilo [?]`, tức chính ban biên tập BJT đánh dấu nghi; TTPV tr. 98 không cước chú); `4.2` `maṁ` (BJT `p100`, TTPV tr. 100, không cước chú cho chữ này; BJT chỉ khác ở trật tự `ye vā kira` đầu `4.3`, không thuộc locus). Blocker, điểm và trạng thái không đổi; bài còn locus chưa gỡ nên giữ draft, không chấm lại.
