notes: |-
  Bài kinh thi-ap31 — bài đầu tiên của Phẩm Khattiya trong Therīgātha. 53/53 khoá,
  thứ tự khoá khớp đúng thứ tự PāLi.

  TÊN PHẨM VÀ TIÊU ĐỀ — đo trước khi chốt, ghi cả hai số:
  - `:0.1` Therīapadāna giữ nguyên PāLi: tiền lệ 8/8 tệp thi-ap trong kho.
  - `:0.2` Khattiyāvagga dùng đúng công thức thi-ap là Phẩm + tên bỏ đuôi -vagga.
    Đo được 5 tệp viết Phẩm Sumedhā (từ Sumedhāvagga) và 3 tệp viết Phẩm
    Ekūposathika (từ Ekūposathikavagga), tức 8/8 theo một công thức. Chữ Phẩm
    Khattiya chưa có tiền lệ nào, nhưng được sinh ra đúng từ công thức đó.
  - translationTitle và khóa colophon `:14.1`: đo theo yêu cầu — số tệp
    content/meta/sutta/kn/thi-ap*.yaml đã có là 8, cả 8/8 viết theo mẫu
    Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni ...; đa số 8/8 trùng đúng số đo theo tệp,
    nên giữ mẫu ấy. Lớp kế cận dùng Bài Kệ Tuyên Ngôn hay Ký Sự Về Trưởng Lão,
    nhưng đó là tha-ap và thig, KHÔNG phải thi-ap, nên không lấy theo.
  - Ở `:0.3`, cả 8 tệp thi-ap đã có đều BỎ số thứ tự đứng đầu trong PāLi và đặt
    số thứ tự ở khóa colophon cuối cùng; bài này làm y vậy (paṭhamaṁ → thứ nhất).

  SỐ PĀLI — tự tính, in phép:
  - `aṭṭhārasa` = aṭṭha 8 + rasa 10 = 18. Chứng cứ tầng: 33 khoá PāLi đã dịch có
    `aṭṭhārasa` và cả 33 đều dịch là mười tám (mn115:4.9, an3.61:9.5,
    sn36.22:2.16, mn137:3.1 viết Mười tám). Lớp PāLi ghim cũng tự xác nhận:
    thi-ap30:0.3 và thi-ap30:1.1 cùng nói mười tám nghìn tỳ-kheo-ni.
  - `aṭṭhārasasahassāni` = 18 × sahassa 1000 = 18.000 → mười tám ngàn. Chứng cứ
    `sahassa` = 1000: sn22.96:3.2 `caturāsītinagarasahassāni` đã dịch là tám mươi
    bốn ngàn thành phố (catu 4 + aṭṭhāsi 80 = 84, nhân 1000); tha-ap56:5.3
    `Kaññāsatasahassāni` đã dịch là hàng trăm nghìn (sata 100 nhân 1000).
  - Đơn vị lớn: đo `ngàn` 553 khoá so với `nghìn` 212 khoá toàn tầng; riêng lớp
    tha-ap cho `sahassa` là `ngàn` 21 so với `nghìn` 15. Hai phạm vi cùng nghiêng về
    `ngàn`, nên dùng mười tám ngàn.
  - `Paṭisambhidā catasso` = bốn; `vimokkhāpi ca aṭṭhime` = tám; `Chaḷabhiññā` = sáu;
    `Tisso vijjā` = ba. Bài không có số kiếp nào, nên máy kiểm số PāLi không có gì
    để đo cho bài này; dòng hiệu chuẩn chín chữ khóa của máy vẫn 9/9 OK.

  PÁI TRÙNG NGUYÊN VĂN — đã dò toàn tầng và dùng lại nguyên văn bản dịch:
  - Tầng Việt đã có 155.623 khoá, 16.748 chuỗi PāLi trùng byte, 73.386 lần rơi
    vào chuỗi trùng. Trong 53 khoá của bài này có 12 khoá trùng byte với tầng đã
    dịch; trong 12 nhóm ấy thì 10 nhóm bản Việt hiện có đang lệch nhau, 2 nhóm
    (0.1 và 5.1) chỉ có một dạng. Đã chọn dạng đa số ở cả 12:
    0.1 (8 hit / 1 dạng), 5.1 (2/1), 9.1 (3/2, lấy dạng hoa chữ đầu 2 phiếu),
    9.2 (2/2, hoá đẳng 1–1, xem bên dưới), 10.2 (22/6, 15 phiếu),
    11.2 (9/4, 6 phiếu), 11.3 (36/10, 14 phiếu), 11.4 (123/8, 92 phiếu cho bản
    kết dấu chấm), 12.1 (433/2, 425 phiếu), 12.2 (52/4, 35 phiếu),
    12.3 (54/5, 43 phiếu), 12.4 (433/5, 392 phiếu).
  - Riêng 9.2 `paccayaṁ sayanāsanaṁ;` có 2 hit và 2 dạng khác nhau: pv22:8.2 viết
    chỗ ngồi, chỗ nằm để dựa; còn iti107:4.2 viết nhận được y phục, vật dụng, — dạng
    sau lỡ dấu phẩy và làm mất `sayanāsana`. Hoá đẳng 1–1 nên chọn dạng khớp cả
    nghĩa lẫn dấu chấm phẩy với PāLi.
  - Thêm một khoá không trùng byte nhưng cùng công thức: 11.1 `Svāgataṁ vata no āsi,`
    chưa có bản dịch nào ở tầng (117 khoá `Svāgataṁ vata` đều là dạng `me āsi`, 0
    khoá `no āsi`); dùng đa số 73/117 vì `no` và `me` đều là của ta.
  - Cùng công thức nhưng khác cách: 10.1 `Kilesā jhāpitā amhaṁ,` cũng chưa có bản
    dịch (121 khoá `Kilesā jhāpitā` đều là `mayhaṁ`; đa số 79/121 viết Các phiền
    não của ta đã được thiêu rụy,). Vì `amhaṁ` là tân ngữ chứ không phải cách sở
    hữu như `mayhaṁ`, dịch theo nghĩa chủ động: Các phiền não đã thiêu rụi chúng
    tôi, — KHÔNG dùng lại y nguyên.
  - Trong chính bài này có 2 cặp PāLi trùng nguyên văn (2.3 với 3.3, 2.4 với 3.4);
    cả hai đã lặp y nguyên trong bản Việt, 0 cặp lệch.
  - Đối chiếu thêm với thi-ap30 (cùng phẩm, chưa có bản dịch): 19/53 khoá của bài
    này trùng byte với thi-ap30, trong đó khối 9.1–12.4 gần như y hệt. Đó là lý do
    chọn bản dịch ở 9.1–12.4 khớp với công thức đã thành quy ước trong tầng.

  THUẬT NGỮ — kèm số đếm:
  - `mahāvīra` → Đại Anh Hùng. Cả tầng Đại Anh Hùng 15 so với Đại Hùng 14; riêng
    phạm vi gần (tha-ap, thi-ap) là Đại Anh Hùng 13 so với Đại Hùng 3.
  - `mahāmuni`/`mahāmune` → Đại Mâu-ni. Riêng phạm vi gần (tha-ap, thi-ap), đúng
    dạng `mahāmuni` cho Đại Mâu-ni 9, Đại Ẩn Sĩ 5, Đại Muni 3. Chọn Đại Mâu-ni để
    phân biệt với `mahāvīra` đã lấy Đại Anh Hùng.
  - `paccekabuddha` → Độc Giác Phật: 3 tiền lệ, mn116:3.2 năm trăm vị Độc Giác Phật
    và ud5.3:11.2 một vị Độc giác Phật dùng đúng dạng này; mil5.5.2:4.5 dùng bậc
    Tự Thắng Thức Giác nhưng nằm trong một danh sách danh xưng dài.
  - `sāvakā` → đệ tử; `patthita` → hạnh nguyện, theo tha-ap7:4.3 `Manasā patthitaṁ`
    → điều tâm ngươi đã hạnh nguyện.
  - `Pacchime` → đời cuối cùng. Tiền lệ tha-ap206:5.1 `Pacchime ca bhave asmiṁ` →
    Trong đời cuối cùng này; tha-ap21:7.3 `Pacchime bhave sampatte` → Khi đã
    thành tựu trong đời sau. Cả hai dạng đều có; chọn đời cuối cùng cho khớp với
    `pacchime kāle` ở dn16 dịch là vào lúc cuối cùng.
  - `agāramhā` → đời gia đình; `pabbajimhanagāriyaṁ` → xuất gia sống đời không nhà.
    Tiền lệ của công thức `pabbajiṁ anagāriyaṁ`: thi-ap16:6.2 rồi xuất gia sống
    đời không nhà, tha-ap433:7.4 ta xuất gia sống đời không nhà.
  - `nibbuti` → sự tịch diệt. Tầng có 20 khoá PāLi đã dịch chứa `nibbuti` và cách
    dịch phân tán (lắng dịu, tịch lặng, đình chỉ, Niết-bàn, tịch tĩnh, tịch diệt),
    nên không có đa số rõ; chọn tịch diệt vì snp4.14:3.4 và thag6.8:2.4 dùng từ ấy
    cho `nibbuti`, và vì khoá liền kề 10.4 là viharāma anāsavā, sống không lậu hoặc.
  - 0 tiền lệ ở tầng Việt, đã dịch theo nghĩa PāLi và ghi lý do ở đây: `Uccanīca` →
    ưu việt nhất; `Uccākula` → dòng họ cao sang; `Mānusika` → cõi người;
    `Katipāha` → một khoảng thời gian ngắn; `Rūpavatī` và `bhogavatī` → có sắc
    đẹp, có nhiều của cải; `lābhasakkārapūjitā` → được tôn kính bằng lợi và sự
    kính trọng; `sakkatapūjitā` → được cung kính tôn trọng; `Upanenti bahū amhe`
    → nhiều người dâng cho chúng tôi; `sabbā pattāmha` → chúng tôi đã đạt đến;
    `Nibbinditvā` → chán ngấy; `Nāgīva` → như con rắn. `Kaññā` và `Yasavatī` giữ
    PāLi vì là tên riêng mà tầng chưa có tiền lệ nào cho chúng. `Uccanīcamayaṁ
    kammaṁ` và `Uccākulaparikammaṁ` là hapax của toàn bộ PāLi ghim — mỗi cụm chỉ
    xuất hiện đúng một lần, ở chính bài này, nên không có chứng cứ so sánh nào khác.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - `bhavā` ở 1.1, 1.2 và 10.2: đọc là cõi hữu. Cùng từ trong 10.2 đã có 22 bản dịch
    ở tầng, 15 phiếu dùng mọi cõi hữu đều đã được nhổ sạch, nên 1.1 và 1.2 dịch
    cùng cách cho nhất quán.
  - 10.1 `jhāpitā amhaṁ` đọc theo nghĩa chủ động. Nếu đọc `amhaṁ` là cách sở hữu
    thì câu sẽ là các phiền não của ta đã bị thiêu rụy; PāLi gốc không có dấu
    hiệu nào để chọn, nên giữ cách đọc tân ngữ.
  - 8.1 `agāramhā` mang nghĩa công cụ, từ trong đời gia đình; dịch Do chán ngấy
    đời gia đình, rồi 8.2 mới sang xuất gia, không thêm nhân quả nào ngoài PāLi.
  - 6.1–6.2 `Uppatte ca kate kamme, jātiyā vāpi ekato` là một câu hỏi nối tiếp câu
    hỏi ở 2–4; dịch theo hai vế, không thêm điều kiện nào.
  - 5.2 `coditā kammasampadā` dịch là được thúc giục hoàn thành nghiệp lành. Chỗ
    này tầng dịch `sukkamūlena codito` theo hai hướng, cội nguồn thiện căn 7 phiếu
    và cội rễ trắng thúc giục 4 phiếu; bài này bám hướng thứ hai để khớp với 5.1,
    vốn dùng đúng bản dịch dùng chung cho cả tha-ap129:7.1 và tha-ap136:6.1.
  - Đại từ ngôi thứ nhất trong bài trộn hai dạng theo đúng PāLi: `amhaṁ` và `pattāmha`
    là tân ngữ nên dịch là chúng tôi, còn `no` và `mama` là cách sở hữu nên dịch là
    của ta. Không có tiền lệ đủ dữ liệu để chọn một đại từ duy nhất cho cả thi-ap.

