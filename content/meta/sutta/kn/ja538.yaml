  - Sửa lan 2026-10-13: khoá `7.2`, `8.2` (`sakko purindado`): "Sakka Đấng Phá Thành" → "Sakka Purindada", theo cách phiên âm danh hiệu này ở các bài khác của tầng (`ja522`, `ja535`, `ja547`, `vv37`, `vv64`, `vv83`, `pv17`, `pv38`, `bv17`); Pāli giữ nguyên danh hiệu.

