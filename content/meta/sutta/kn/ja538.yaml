notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja538_root-pli-ms.json` (499/499 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ: bốn dòng tiêu đề `0.1`–`0.4`, 122 bài kệ (`1`–`122`; 119 bài bốn dòng, riêng `11`, `37`, `38` có sáu dòng) và dòng kết bài `123.1`; phần văn xuôi khung truyện không nằm trong tầng Pāli đã ghim, nên người nói được suy từ xưng hô, nháy và mạch của chính các bài kệ. Nội dung chính (suy từ kệ): một vị thiên nữ khuyên hoàng tử xứ Kāsi giả làm kẻ ngu (`1`–`2`); người đánh xe đào hố để chôn chàng trong rừng, chàng nói mình không điếc, không câm, không què, nêu các lợi ích của người không phản bạn, rồi nhớ lại kiếp trước làm vua phải chịu địa ngục nên sợ ngôi vua (`3`–`42`); người đánh xe xin cùng xuất gia, được dặn quay về (`43`–`48`), báo tin cho hoàng hậu (`49`–`63`); nhà vua sai thắng xe, cùng đoàn tùy tùng đến (`64`–`74`); hai bên hỏi thăm, nhà vua mời chàng trở lại ngôi, chàng từ chối vì tuổi trẻ cũng phải chết (`75`–`122`). Phần này không được đối chiếu với văn xuôi nào, nên các dòng tả cảnh và xác định người nói dựa hoàn toàn vào kệ.

  - Tầng tham khảo:
    Tầng English của Sujato không có ja538 (ja chỉ có 83 tệp: ja1–79, ja126, ja159, ja466, ja534; đây là not-published-upstream, không phải not-synced); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Có 38 trong 403 khoá có Pāli từ 12 ký tự chuẩn hoá trở lên trùng nguyên văn với một khoá ở bài khác có bản English Sujato (`1.1`–`1.4` và `2.1`, `2.3`, `2.4` trùng `cp26:7`–`8`; `30`–`31`, `41`–`42` trùng `ja8:1`; `39.1`–`39.2`, `106.4`, `119` trùng `snp3.8`; `91.1`–`91.3` trùng `sn1.10:4`; `105` trùng `sn1.66:2`; `121.2`–`121.4` trùng `mn133`, `mn134`; `113.1`–`113.2` trùng `snp3.1:16` và vài khoá lẻ); các bản English ấy là bản dịch của bài khác, nên chỉ dùng để kiểm cách hiểu của từng dòng trùng, không tính là bản English của ja538. Tiền lệ Việt trong tầng do cùng một nhóm dịch, nên không phải đối chiếu độc lập; tôi không dùng bản tóm lược hay bản dịch ngoài tầng đã ghim làm câu chữ hay đối chiếu. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
  - Coverage English:
    Mẫu số = 0: trong 499 khoá, không khoá nào có Pāli từ 40 ký tự trở lên theo `source/layers.yaml` (dòng dài nhất 28 ký tự, toàn vế kệ ngắn), nên cổng coverage không đo được gì ở bài này. Điều đó không có nghĩa là không cần ghi nhận gap; entry `reference-gaps.yaml` cũng không cứu được `published`. Sujato phủ 0/499 khoá, `english-project` 0/499, `vietnamese-current` 0/499.
  - Phân loại & tiêu đề:
    `0.1` "Jātaka"; `0.2` "Bộ Lớn" (Mahānipāta; dùng lại nguyên văn `thag21.1:0.2` và `thig16.1:0.2`, 2/2, cùng khuôn "Bộ Hai Bài Kinh", "Bộ Tám Mươi Bài Kinh" của các nipāta trước trong ja; bản tên của Sujato ghi *The Great Book*); `0.3` "Phẩm Mūgapakkha" (Mūgapakkhavagga; Sujato ghi tên phẩm *Mūgapakkha the Wise*); `0.4` "1. Kinh Mūgapakkha" (giữ phiên âm tên riêng như `cp26:1.3` và `an6.54:14.1`; số thứ tự "1." theo khuôn `ja532:0.4`, `ja535:0.4`); `123.1` "Kinh Mūgapakkha, thứ nhất." theo khuôn "Kinh <Tên>, thứ n" của `ja533:89.1`, `ja534:104.1`, `ja535:99.1`; `paṭhamaṁ` = thứ nhất khớp "1." ở `0.4`.
