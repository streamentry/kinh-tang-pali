    + `1` thiên nữ nói với hoàng tử (gọi `amma` ở `2.3`); `2` hoàng tử đáp; `3` hoàng tử hỏi người đánh xe; `4` người đánh xe; `5`–`6` hoàng tử (nháy mở ở `5.1`, đóng ở `6.4`); `7` người đánh xe; `8`–`21` hoàng tử (nháy mở ở `8.1`, đóng ở `21.4`; `8`–`9` tự giới thiệu, `10`–`21` kệ về người không phản bạn); `22` và `24`–`27` người đánh xe (`24`–`27` một nháy kéo dài); `23` hoàng tử; `28`–`31` hoàng tử; `32` người đánh xe; `33`–`42` hoàng tử (một nháy kéo dài, gồm cả `34`–`38` kể kiếp trước); `43` và `45`–`46` người đánh xe; `44` và `47`–`48` hoàng tử; `49`–`50` và `53` lời kể; `51`–`52` và `54`–`55` hoàng hậu; `56` người đánh xe; `57` hoàng hậu; `58`–`63` người đánh xe (nháy mở ở `58.1`, đóng ở `63.4`); `64`–`68` nhà vua (nháy mở ở `64.1`, đóng ở `68.4`); `69` lời kể kèm lời tâu của các người đánh xe (nháy mở và đóng trong `69.4`); `70` các người đánh xe giải thích chọn ngựa; `71`–`72` nhà vua (nháy mở giữa `71.4`, đóng ở `72.4`); `73`–`74` lời kể; `75`, `77`, `79`, `81` hoàng tử hỏi; `76`, `78`, `80`, `82` nhà vua đáp; `83`–`85` hoàng tử; `86`–`87` nhà vua (hai nháy liền nhau); `88`–`91` hoàng tử; `92`–`96` nhà vua; `97`–`103` hoàng tử; `104` nhà vua; `105`–`108` hoàng tử; `109`–`115` nhà vua; `116`–`122` hoàng tử (nháy đóng ở `122.4`, kèm `ti`).
    + Xưng hô chọn theo người nói, vì Pāli không có đại từ riêng: hoàng tử xưng "ta" và gọi người đánh xe là "ngươi" (`3`–`48`), gọi cha là "cha" và xưng "con" khi gọi `tāta` (`75`, `77`, `79`, `81`), xưng "tôi" khi gọi `rāja`/`mahārāja` (`83`–`91`, `97`–`122`); người đánh xe xưng "tôi" và gọi hoàng tử là "ngài"; nhà vua xưng "cha" và gọi hoàng tử là "con"; hoàng hậu gọi người đánh xe là "ngươi" và gọi hoàng tử là "chàng" khi nhắc đến; lời kể gọi hoàng tử là "chàng".
    + Nháy đặt đúng từng khoá theo Pāli: `69.4` mở và đóng nháy trên cùng một dòng, `71.4` mở nháy ở giữa dòng và `72.4` đóng; `4.4` nhắc lệnh của nhà vua nhưng Pāli không có nháy lồng trong, nên chỉ dùng dấu hai chấm, không thêm nháy đơn; tương tự `37.3`–`37.5` (lệnh xử án) và `99.2` (lời bập bẹ của đứa trẻ).
  - Pāli trùng nguyên văn:
    Dò Pāli của 499 khoá với toàn bộ Pāli đã ghim (mọi bộ) có bản Việt, loại các khoá dưới 12 ký tự chuẩn hoá: 130 khoá có dạng trùng ở bài khác, tổng 320 cặp, trong đó bản Việt giống hệt (bỏ dấu câu) ở 200 cặp và khác ở 120 cặp (67 khoá). Dùng lại nguyên văn: `1.1`–`1.4` từ `cp26:7.1`–`7.4`; `2.1`, `2.3`, `2.4` từ `cp26:8.3`, `8.5`, `8.6`; `3.3` (4/5 khoá: `ja400:8.3`, `ja475:1.3`, `2.3`, `4.3`); `7.1`–`7.4` và `8.1`–`8.3` từ `ja529:63`–`64`; `10.1`–`10.4` (đa số khoá; `ja452:7` dịch khác vì nghĩa khác); `14.2`, `21.1`–`21.2` từ `tha-ap406:17.2`, `16.1`–`16.2`; `14.1` và `21.3` theo `tha-ap406:17.1`, `16.3` (Pāli gần trùng); `26.1`–`26.2` và `67.1`–`67.2` theo cặp `ja520:8.1`–`8.2` ("Người cưỡi voi, quân hộ vệ" / "kẻ cưỡi xe và kẻ đi bộ"; Pāli `ja520:8.1` là `anikaṭṭhā`, khác một dấu dài); `30.1`–`30.3`, `41.1`–`41.3` từ `ja8:1.1`–`1.3`; `31.2`, `42.2` từ `ja521:38.4`; `35.3`, `60.3` từ `bv21:33.1`; `39.1`–`39.2` từ `snp3.8:1.3`–`1.4`; `49.4` từ `ja534:40.2`; `62.1`–`62.2` từ `tha-ap530:4.1`–`4.2`; `64.1` từ `ja531:76.1`; `64.2` theo `ja498:6.3` (Pāli gần trùng, `nāgāna` so với `nāgānaṁ`); `69.2` từ `tha-ap410:18.4`; `71.2` từ `ja530:3.2`; `72.1` từ `ja530:4.3`; `83.1`–`83.2` từ `ja494:5.1`–`5.2`, `ja532:43.1`–`43.2`; `91.1`–`91.3` từ `sn1.10:4.1`–`4.3`, `91.4` theo `sn1.10:4.4` (Pāli gần trùng, thêm `ti`); `105.1`–`105.2` từ `sn1.66:2.1`–`2.2`; `106.4` từ `snp3.8:4.4`; `117.1`–`117.2`, `118.4` từ `ja498:13.1`–`13.2`, `14.4`; `119.1`–`119.3`, `120.1`–`120.4` từ `ja461:5`–`6`; `121.2`–`121.4` từ `mn132:3.11`–`3.13`.
    Cặp mà bản Việt khác có lý do: đổi ngôi theo người nói (`22.1`–`22.4` người đánh xe nói với hoàng tử nên dùng "tôi/ngài" thay vì "ta/ngươi" của `ja472:11`; `94.4`, `96.3`–`96.4`, `111.4`, `113.3`–`113.4`, `115.3`–`115.4` nhà vua nói với con nên dùng "con"; `117.3`–`117.4`, `118.2`, `122.2`, `98.4` hoàng tử nói với vua nên dùng "tôi" thay vì "ta" của `ja498:13`–`14`, `ja529:36.4`; `55.4`, `104.4` dùng "ta hỏi", "cha hỏi" thay vì "tôi hỏi" của `ja401:1.6`, `3.6`, `5.6`); `7.4` (`ja382:1.4` và các khoá cùng dạng dịch "nàng" vì người được hỏi là nữ nhân, ở đây là hoàng tử nên "ngài" theo `ja529:63.4`); `19.2` (`ja261:2.2`, `sn5.9:5.2` bỏ chủ ngữ, ở đây thêm "thứ" vì `vuttaṁ` là danh từ hoá của cái đã gieo); `107.3` (`ja460:7.3` dịch "Người đời vẫn còn như thế", khá lỏng so với `evamāyu manussānaṁ`); `119.1`, `119.3`, `119.4` (`snp3.8:3` dịch khác ở ba khoá; chọn câu chữ `ja461:5` cho cả bài kệ cho đồng bộ); `17.3` dùng lại `thag4.7:4.3`; còn lại là các khoá có hai ba cách dịch khác nhau trong tầng (ví dụ `13.2`, `26.1`, `49.2`, `84.2`, `86.3`) nơi tôi chọn cách khớp bối cảnh hoặc cách có nhiều khoá hơn.
    Trong chính bài: 64 nhóm Pāli trùng nguyên văn (sau khi bỏ dấu câu), tổng 165 cặp; bản Việt giống nhau ở 155/165 cặp, khác nhau ở 10 cặp. Mười cặp đó đều khác vì đổi ngôi hoặc người nói: `22.3`/`22.4` với `94.4`, `96.3`, `96.4`, `111.4`, `113.3`, `113.4`, `115.3`, `115.4` (người đánh xe nói với hoàng tử so với nhà vua nói với con); `32.4`/`61.4` ("ngài" so với "chàng"); `55.4`/`104.4` (hoàng hậu hỏi người đánh xe so với nhà vua hỏi con). Các nhóm chính: `5.3`–`5.4`/`6.3`–`6.4`/`9.3`–`9.4`/`11.5`–`11.6` (điệp khúc "Adhammaṁ sārathi kayirā, mañce tvaṁ nikhaṇaṁ vane"), `12.4`/`13.4`/…/`21.4` (điệp khúc "yo mittānaṁ na dubbhati", 10 khoá), `30`/`41` và `31`/`42` (bài kệ "Api ataramānānaṁ" lặp lại nguyên văn), `35`/`60`, `34`/`59`, `25.1`–`25.2`/`66.1`–`66.2`, `26.1`–`26.2`/`67.1`–`67.2`, `27.2`/`68.2`, `84.2`/`88.2`, `88.4`/`89.4`, `92`–`96`/`109`–`113`.
  - Số Pāli:
    `vīsati` (`35.1`, `60.1`) = 20; `asīti` + `sahassa` (`35.3`, `60.3`, `Asītivassasahassāni`) = 80 × 1.000 = 80.000 năm, khớp tiền lệ "tám mươi ngàn" (11/15 khoá có `asītivassasahassa`; `bv21:33.1`); `ekaṁ` (`37.3`–`37.5`) = một người, ba lần theo từng loại hình phạt; `ekaṁ` ở `50.2`, `53.2` = một mình; `eko`, `ekaseyyā`, `ekakampi`, `ekoraññe` = một mình; `ekapokkhara` (`64.4`) là tên loại trống, giữ phiên âm; `nava` ở `100.3` là "non" (`navavaṁsakaḷīra` = mầm tre non), không phải số 9; `paṭhamaṁ` (`123.1`) = thứ nhất. Không có số lớn khác, và không có cụm thuộc loại chưa phân xử được, kể cả `Tiṁsakappasahassa`.
  - Thuật ngữ (có đếm trên tầng):
    + `sārathi` → "người đánh xe" (7/8 khoá `ja` có `sārathi`; 157 khoá toàn tầng); `rājaputta` → "hoàng tử" (17/18 khoá `ja`); `khattiya` → "Sát-đế-lợi" (51 khoá `ja` dùng "Sát-đế-lợi"/"sát-đế-lợi", 9 giữ "khattiya"; riêng lời hô `105.4` "hỡi khattiya" theo `ja472:14.4`); `isī` → "ẩn sĩ" (6 so với 3 "đạo sĩ" trong khoá `ja`); `itthāgāra` → "hậu cung" (17/22 khoá, so với 3 "cung nữ" và 2 "nội cung"); `orodhā` → "các cung phi" (không có tiền lệ cho riêng `orodha`; `cp21:4.1` dịch `sahorodhe` là "các bậc hoàng hậu nội cung"); `maccu` → "tử thần" (19/28 khoá `ja`), `antaka` → "thần chết" (`ja498:14.3`); `mittadubbha`, `dubbhati` → "phản bạn" (8 so với 3 "phản bội" trong 17 khoá); `pabbajjā` → "xuất gia", `brahmacariya` → "phạm hạnh" (20/23 khoá `ja`); `nigama` → "thị trấn" (7/9 khoá `ja`); `abhiseka` (`rajjābhisecayuṁ`, `rajjebhisiñcasi`) → "quán đảnh" theo quy ước tầng (`dn19:58.2`); `yobbana` (`116.3`) → "tuổi xuân" còn `komāraka` (`102.4`) → "tuổi trẻ" (trong 17 khoá `yobbana`: "tuổi trẻ" 5, "thanh xuân" 5, "tuổi xuân" 4); `vesiyānā` → "thương nhân" (1/1, `tha-ap394:5.2`); `khārāpatacchika` → "cạo da bằng chất kiềm" (`mn14:13.3`); `puṇṇapatta` → "bát đầy" (`thig13.4:14.4`; `ja437:6.2` dịch "một phần đầy đủ"); `nettiṁsa` → "gươm" (`ja530:61.2`); `sindhava` → "ngựa xứ Sindhu" (`tha-ap410:18.4`); `deva` (`69.4`) → "tâu bệ hạ" (`dn2:9.2`, cùng ngữ cảnh người hầu báo xe đã sẵn sàng); `siri` (`18.3`) → "thịnh vượng", theo lựa chọn ở `ja535`; `majja`/`surā` (`77`–`78`) → "chất say"/"rượu" (`dn31:8.1`, `dn31:14.17`); `Kāsi` → "xứ Kāsi" (`ja529:64.3`); `mahāsena maccu` → "tử thần cùng đại quân" (6/6 khoá `mn132`, `mn133`); tên riêng `Temiya`, `Mūgapakkha`, `Sakka`, `Sindhu`, nhạc cụ `paṇava`, `bherī`, `dundubhī`, `ekapokkhara`, và gạo `sālī` giữ phiên âm theo tiền lệ (`ja346:3.1`, `ja506:24.1`, `tha-ap431:8.4`).
  - Chỗ bất định (không thêm vào thân kinh):
    + `4.3`–`4.4` `Somhi raññā samajjhiṭṭho, puttaṁ me nikhaṇaṁ vane`: đọc `puttaṁ me nikhaṇaṁ vane` là lời nhà vua ra lệnh ("hãy chôn con trai của ta trong rừng"), nhưng Pāli không có dấu nháy lồng trong.
    + `9.2` `sammūpajīvasi`: "nương nhờ để sống cho đúng đắn" (`sammā` có thể bổ nghĩa cho cách nương nhờ hoặc chỉ nhấn mạnh).
    + `20.1` `darito`: đọc là "từ vực sâu" (`dari`/`dara`); cách đọc khác: "từ hang". `21.1`–`21.3`: giữ cấu trúc của `tha-ap406:16`, hình ảnh "cây đa trước gió" có thể là bên bị tấn công hoặc bên so sánh.
    + `24.1`–`24.4`: `puṇṇapatta` dịch "bát đầy" (phần thưởng khi báo tin vui); `ito gato` và `tayī gate` dịch "rời khỏi nơi này" và "đã đi" mà không nêu hướng đi; ngữ cảnh gợi là trở về cung, nhưng Pāli không nói.
    + `28.1`–`28.3` `catto` đi với sở hữu cách `pitu mātu`, `raṭṭhassa nigamassa`, `sabbakumārānaṁ`: đọc là bị các bên ấy từ bỏ. `29.1` `matyā` (có thể là `mātarā`) và `29.2` `pitarā mahaṁ`: dịch "mẹ cho phép", "cha ta … từ bỏ ta hoàn toàn"; hai vế có vẻ ngược nhau nhưng Pāli không giải thích.
    + `30.2` `phalāsāva`: theo `ja8:1.2` (Sujato: *one who hopes for the fruit succeeds*); `31.2` `sammadattho` theo `ja521:38.4`.
    + `33.1`–`33.3` `asandhitā`, `asotatā`, `ajivhatā`: đọc là "vì không có khớp nối, tai, lưỡi".
    + `34.4` `pāpatthaṁ` (và `59.4` `pāpattha`): hình thái không có tiền lệ trong tầng; đọc là "đã rơi vào" theo `tha-ap545:27.4` `pāpatiṁ nirayaṁ bhusaṁ`.
    + `37.1`–`37.6`: `atthānusāsati` (xử việc nước hay ra lệnh), `khārāpatacchikaṁ` (hình phạt rạch và xát chất kiềm, theo `mn14:13.3`), `iccassa manusāsati` (`assa` chỉ nhà vua): dịch "ông ra lệnh như vậy". `38.6` `samparipluto` dịch "ngập chìm".
    + `39`–`40` `Komaṁ jīvitamāgamma`: tách thành `ko` + `imaṁ`, "ai … đã có mạng sống này"; hai khoá `39.3`–`39.4` và `40.3`–`40.4` trùng nguyên văn nên dịch giống nhau. `40.1`–`40.2` cách cách nhân quả ("vì không đạt trí tuệ, vì không thấy Pháp") đứng trước câu hỏi; có thể đọc là lý do khiến người ta gây thù oán, và là điểm giáo lý nên ghi chú.
    + `43.3` `avhāyassu`: "xin hãy gọi tôi" (cách đọc khác: "xin hãy mời tôi cùng đi").
    + `45.1`–`45.4`: `tyāhaṁ` = `te ahaṁ`; hai vế đối xứng "tôi đã làm theo lời ngài / xin ngài làm theo lời tôi".
    + `51.4` `pathabyā bhūmivaḍḍhano`: dịch "bậc làm hưng thịnh quốc độ trên cõi đất", theo `ja529:64.4`.
    + `55.1`–`55.2` `kathaṁ hatthehi pādehi mūgapakkho vivajjayi`: `vivajjayi` dịch "tránh né" (theo `vivajjetvā` ở `70.3`); có thể đọc "thoát ra, né tránh" hoặc "cử động"; `54.3`/`55.3` `nihaññamāno bhūmiyā` dịch "bị đánh gục xuống đất" (cách đọc khác: "bị giết trên đất").
    + `58.3`–`58.4` `kira … akarā ālaye bahū`: "nghe nói … đã làm nhiều điều ở nơi ở của mình" (`ālaya` hiếm: nơi ở hoặc sự gắn bó; không phân xử được).
    + `62.3` `pañño`: "có trí tuệ" đi với `visaṭṭhavacano`.
    + `65.4`, `66.4`, `67.4`, `68.4` `gacchaṁ puttanivedako`: đọc `puttanivedaka` là người báo tin về con (người đánh xe, được đặt đi trước ở `73.2`) và `gacchaṁ` là chủ ngữ của nó ("khi … lên đường"); cách đọc khác: `gacchaṁ` chỉ chính nhà vua.
    + `70.1`–`70.4`: `hāyanti` dịch "kém về", `saṁsaṭṭhā` dịch "hỗn hợp" (loại vừa, không quá béo hay quá gầy).
    + `72.3` `Upādhī rathamāruyha`: `upādhī` không có tiền lệ cho nghĩa này, dịch "các vật dụng" (cách đọc khác: đồ trang bị của xe hay vật dụng vương giả); `72.4` `alaṅkatā` giống cái nên chỉ các nàng.
    + `83.3`–`83.4` `pallaṅka` dịch "chỗ ngồi" và `nisakkati` như `nisīdati`.
    + `85.2` `randhaṁ rāja aloṇakaṁ`: "đã nấu chín, không muối". `87.1`–`87.2`: `ekakampi rahogataṁ` không rõ chỉ ai (đọc là chính người đang bị hỏi, ở một mình nơi vắng).
    + `89.1`–`89.2` `nettiṁsabandhā rājarakkhā`: "những người đeo gươm", "những vệ binh hoàng gia", đọc như hai danh sách nối nhau.
    + `95.1`–`95.2` `Paṭirājūhi te kaññā ānayissaṁ alaṅkatā`: "từ các vua đối địch, những thiếu nữ cho con, cha sẽ đón về, trang sức lộng lẫy". `95.4` `pabbajissasi` dịch như quyền cho phép ("có thể xuất gia").
    + `100.4` `paluggaṁ jīvitakkhayaṁ`: "gãy đổ, mạng sống chấm dứt".
    + `103.3`, `104.3`, `105.3` `amogha`, `kāyo`: dịch "không hề vô ích", và `kāyo` (hình thái hiếm) như đại từ nghi vấn giống cái số nhiều chỉ các đêm; không phân xử được hơn.
    + `106.1`–`106.3` `tante vitate … vetabbaṁ`: "tấm dệt đã căng trên khung", "sợi nào được dệt vào", "phần còn phải dệt".
    + `107.2`, `107.4` `gacchannupanivattati`: tách theo sandhi là `gacchaṁ na upanivattati` ("đã đi thì không quay trở lại"), khớp hình ảnh dòng nước và đời người; nếu không có `na` thì nghĩa đảo ngược, nên đây là chỗ cần người biên tập đọc lại bản in.
    + `115.1`–`115.2` `gomaṇḍala`, `dāsisaṅghapurakkhato`: "đàn bò vây quanh", "có đoàn nữ tỳ hầu cận".
    + `121.1` `ātapaṁ`: đọc như `ātappaṁ` ("tinh cần") theo `mn132:3.10`.
    + `122.1` `Corā dhanassa patthenti`: dịch sát nghĩa đen "kẻ trộm mong cầu của cải"; mối liên hệ với dòng sau không được nêu.
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 499/499, cùng thứ tự.
    2. Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá: 0/499 lệch.
    3. Pāli trùng nguyên văn trong chính bài: 64 nhóm, 165 cặp; Việt khác ở 10 cặp có lý do, xem trên. Pāli trùng với bài khác: 130 khoá, 320 cặp; Việt khác ở 120 cặp, có lý do hoặc có hai cách dịch trong tầng, xem trên.
    4. Dấu lược `…pe…`, `…` trần và `(…)`: Pāli 0/499 khoá, Việt 0/499 (phép chạy rỗng).
    5. Số Pāli: xem trên; không có cụm chưa phân xử được.
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng, tên nhạc cụ và gạo giữ phiên âm có ghi chú (`Jātaka`, `Mūgapakkha`, `Kāsi`, `Temiya`, `Sakka`, `Sindhu`, `paṇava`, `ekapokkhara`, `bherī`, `dundubhī`, `sālī`). Đã in cặp Pāli↔Việt ra đọc toàn bài (499 cặp) và sửa sau lượt đọc: `87.3` đổi sang số nhiều ("những người dùng món như thế") vì `bhuñjamānānaṁ` là sở hữu cách số nhiều; `64.3` bỏ chữ "và và" liền nhau; `76.3` thêm "và" cho khớp `75.3` (cùng Pāli `Sabbā ca rājakaññāyo`); `63.3` đổi "đưa bà đi" thành "đưa bà tới" để `63.4` và `73.4` dịch cùng một câu; `26.1`, `67.1` đổi sang "Người cưỡi voi, quân hộ vệ" theo cặp `ja520:8`; `19.2` thêm "thứ" cho `vuttaṁ`.
