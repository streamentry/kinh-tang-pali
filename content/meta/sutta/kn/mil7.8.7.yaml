notes: |-
  TẦNG THAM KHẢO — đo, không đoán. Không có bản Anh Sujato cho bài này (0/17 khoá Pāli có nội dung; 73 khoá toàn bài), không có `english-project`, không có `vietnamese-current`. `triangulation` đặt 7.5 (≤ 8.0), status `draft` kèm blocker `noEnglishEditionUpstream`, theo luật của lát. Không nâng điểm để né blocker. Mọi chỗ dưới đây vì thế tựa vào Pāli root và các tiền lệ đã publish trong chính tầng Việt của dự án.

  SỐ PĀLI — bài không có số lượng lớn. Chỉ có: `cattāri` = bốn (1.1, hai lần), `paṭhamaṁ` / `dutiyaṁ` / `tatiyaṁ` / `catutthaṁ` = thứ nhất / hai / ba / tư (1.4, 2.3, 3.42, 4.3 — đủ bốn phần, khớp số `cattāri`), `ubho pāde` = hai chân, `dve hatthe` = hai tay, `cha dvārā` = sáu cửa, `sattamo` = thứ bảy (7.1 và 8.1). Không có thang lớn nào cần nhân.

  TIỀN LỆ — đo trên toàn tầng Việt dự án. Có 38 khoá của bài có Pāli trùng nguyên văn với khoá ở bài khác; chỉ 6 khoá trong số đó có bản Việt để dùng lại, và cả 6 được dùng lại đúng nguyên văn dạng đa số: `Milindapañha` (216/227 bản trùng), `Opammakathāpañha` → *Câu hỏi về cách dùng dẫn với ví dụ* (42/66), `Kumbhavagga` → *Phẩm Bình Vò* (14/16), `Tassuddānaṁ` → *Tóm lược:* (357/476), `Bhāsitampetaṁ … sāriputtena dhammasenāpatinā—` → *Trưởng lão Sāriputta, Tướng quân Pháp, đã nói:—* (6/14; hai dạng khác 3/14 và 3/14 dùng "Tướng quân Chánh pháp"), và `Tatheva buddhaputtopi,` → *Cũng vậy, đệ tử của Phật,* (1/1, từ mil7.8.3:5.1). 32 khoá còn lại (3.5–3.25, 3.27–3.36, 8.1) có Pāli trùng ở Niddesa/Paṭisambhidāmagga nhưng không có bản Việt nào để dùng lại. Trong chính bài: 0 cặp Pāli trùng nội bộ, nên phép so này chạy rỗng.

  QUY ƯỚC GIỌNG MIL7.8 — bốn bài liền kề cùng phẩm (mil7.8.1, 4, 5, 6) mở bằng "Thưa tôn giả Nāgasena, tôn giả đã dạy rằng '…thì phải nắm lấy … phần'", đáp bằng "Này Đại vương" (28 lần, 0 lần "tâu") và gọi `yogī yogāvacara` là "người hành trì" (9 khoá so với 3 khoá "hành giả" trong mil7.8; toàn tầng mil: 89 so với 85, gần như hòa). Tôi theo phạm vi gần nhất (cùng phẩm) và giữ "này Đại vương … người hành trì"; tiêu đề theo mẫu "Câu hỏi về phần của …". `issāsa` → *cung thủ* (mil5.5.10 cùng dịch như vậy). `sāyaṁ pātaṁ` → *chiều và sáng* (dn17, 24 khoá). `bhattavetana` → *lương thực và tiền lương* (dn5:11.10, 11.16). `satipaṭṭhāna` → *niệm xứ* (279 khoá). `ādīnava` → *nguy hiểm* (dn16, và "nguy hại" ở mn26).

  DANH SÁCH 3.4–3.40 — danh sách dài này (Niddesa, Paṭisambhidāmagga) chưa có bản Việt nào trong tầng; chỉ đoạn đầu `aniccato … palokato` có tiền lệ, đo trên 11 khoá đã dịch (mn64, mn74, sn22.122–123, an4.124–126): `sallato` → *mũi tên* (8/11, so với *mũi nhọn* 3/11); `palokato` → *tan rã* (7/11, so với *hoại đổ* 3/11 và *hoại diệt* 1/11); `parato` → *xa lạ*; `suññato` → *trống rỗng*; `ābādhato` → *tật ách* (sn22.123); mỗi mục tôi chọn một từ riêng để không trùng nhau trong danh sách. Các mục chưa có tiền lệ là lựa chọn mới của tôi, đối chiếu Pāli: `ītito` *tai ương*, `upaddavato` *tai nạn*, `bhayato` *đáng sợ*, `upasaggato` *tai họa*, `calato` *dao động*, `pabhaṅguto` *dễ vỡ nát*, `addhuvato` *không bền vững*, `rittato` *trống vắng*, `tucchato` *hư rỗng*, `asārato` *không có cốt lõi*, `aghamūlato` *gốc rễ của khốn khổ*, `vadhakato` *kẻ sát hại*, `vibhavato` *vô hữu*, `mārāmisato` *mồi của Ma*. Khuôn `-dhammato` theo mn26: *phải sinh, phải già, phải bệnh, phải chết, phải chịu sầu, phải ô nhiễm* (cùng cách dịch ở mn26:5.4 và 12.2), thêm *phải than khóc* và *phải ưu não* cho `paridevadhammato` và `upāyāsadhammato`. Mỗi `-to` dịch là *xem là …*, đúng ý cách `upāsitabbaṁ` kéo theo cả danh sách.

  DẤU LƯỢC — `3.4` Pāli có `…pe…`, bản Việt giữ đúng một `…` (và đứng sau *bệnh*, đúng vị trí `rogato`). Các khoá `3.5`–`3.40` (36 khoá) Pāli kết bằng `…` trần; Việt cũng kết bằng ` …`. Tổng 37 khoá Pāli có dấu lược, 37 khoá Việt có đúng một `…`. Không có `(…)` trong Pāli nên Việt không có `(…)`.

  BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh.
  · `āḷaka` (2.1, 2.2 `satipaṭṭhānaāḷaka`): trong toàn Pāli root, từ độc lập `āḷaka` (không phải `āḷakamandā`) chỉ xuất hiện ở hai khoá này, nên không có tiền lệ Việt hay Anh nào để đối chiếu. Bản Việt hiểu theo ngữ cảnh `ujukaraṇāya` ("để làm cho ngay thẳng") là *dụng cụ nắn thẳng*; tên và hình dạng cụ thể của dụng cụ không kiểm chứng được. Cùng cụm xuất hiện ở 2.2 để đối xứng với 2.1.
  · `jaṇṇuavekallaṁ karoti` (1.2) và `khantisoraccaṁ avekallaṁ kātabbaṁ` (1.3): `avekalla` dịch *không khiếm khuyết* ở cả hai chỗ để giữ đối xứng giữa đầu gối và nhẫn nại. Nghĩa cụ thể của tư thế đầu gối không có tham chiếu độc lập.
  · `dve hatthe sandhiṭṭhānaṁ āropeti` (1.2): *đặt hai tay vào chỗ khớp nối*, dịch sát chữ; không rõ khớp nối ấy là chuôi cung hay chỗ lắp tên.
  · `nimittaṁ ujuṁ karoti` (1.2): *làm cho điểm ngắm thẳng*; `nimitta` hiểu là điểm ngắm.
  · `kāḷāyaso` (10.1, uddāna): dịch *sắt đen* (kāḷa + ayasa). Bài mil7.8.2 đã publish (lát trước) dịch cùng từ ấy thành *ngựa đen* trong tiêu đề và thân bài; tôi không sửa tệp ngoài lát, nhưng nhắc để người biên tập xem lại mil7.8.2 — gốc `ayasa` là sắt, không phải ngựa.
  · `vuttaṁ dāni vidūhīti` (10.4): *nay đã được các bậc trí nói*; `iti` cuối đóng câu, không có lời trích.

  ĐỢT NÀY CẤM CHẠY CỔNG — theo chỉ đạo, tôi không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên `technical_integrity` chấm 9.6 chứ không phải 10.0, và không tuyên bố technical gate pass. Bốn lệnh đó để người điều phối chạy. Tôi tự quét toàn bộ 73 khoá (không dùng ngưỡng 40 ký tự): đủ khoá, đúng segment ID, thứ tự khoá y hệt Pāli, không orphan, không thừa, không rỗng; mọi khoá NFC; nháy đơn và nháy kép khớp Pāli từng khoá (73/73); số dấu lược khớp; không có Pāli lọt sang (chỉ còn tên riêng Milindapañha, Nāgasena, Sāriputta).
