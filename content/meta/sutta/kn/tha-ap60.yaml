  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (dòng đầu tệp ghi tác giả; dịch 2008). 4 khoá bất đồng nghĩa → sửa 2 (2.3 và 2.4: trước `Trong sạch bên trong, trong sạch bên ngoài,` / `đã giải thoát, không lậu hoặc.` đứng không có chủ thể giữa hai câu, đọc như tả người nói hay chiếc lá; sau `Bậc trong sạch bên trong, trong sạch bên ngoài,` / `bậc đã giải thoát, không lậu hoặc,` nối sang `Đức Chánh Đẳng Giác` ở 3.1; vì `antosuddhaṁ bahisuddhaṁ adhimuttamanāsavaṁ` là các tính từ đối cách số ít bổ nghĩa `sambuddhaṁ` ở 3.1, `adhimutta` và `anāsava` chỉ hợp bậc giải thoát, bản nguyên bài cũng gán cho vị Toàn Giác, và `tha-ap373:2.3` đã dịch là bậc; loại accuracy fix về ngữ pháp, không đổi từ), giữ 1 (9.3 `Paññāsasatasahasse`: bản nguyên bài ghi năm mươi ngàn kiếp, bỏ mất `sata`; Pāli là 50 × 100 × 1.000 = 5.000.000 kiếp, khớp `bv12:6.3`, `bv14:9.3`, `bv20:6.3`), bất định 1 (1.2 `bodhiyā pādaputtame`: bản nguyên bài hiểu `uttama` là phần chóp đỉnh của cây và treo cờ ở đó, bản này dịch dưới gốc cây Bồ-đề tối thượng; 7 khoá khác cùng Pāli trong tầng cũng dịch không thống nhất, nên chưa phân xử). Mục bất định cũ ở trên về 2.3 và 2.4 (không rõ bổ nghĩa cho ai) nay đã phân xử như vừa nêu; các mục khác giữ nguyên. Lượt review đối kháng riêng đọc lại 44 cặp: không đổi thêm khoá nào. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Điểm đổi: semantic_fidelity 8.8 → 8.9, grammar_logic 9.1 → 9.2, triangulation 7.5 → 8.4, ambiguity_integrity 8.3 → 8.4.
