notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ của bài kệ dưới 40 ký tự, nên assertion không tự chạy). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Dòng lược kết `:1.5` giữ nguyên hai dấu lược.** Pāli là `… <tên> thero …. `; tôi viết `… Trưởng lão <tên> ….`, đúng dạng `thag1.98`, `thag1.101`, `thag1.106` đã có trên đĩa, và **không** mở rộng thành *Bạch Thế Tôn, vị trưởng lão … đã từng nói bài kệ này* như nhóm `thig1.10`–`1.16` đang làm — BRIEF_VI3 §10.1 nói thẳng Pāli có dấu lược thì bản Việt giữ lược, mở rộng là thêm chữ KHÔNG ĐÁNH DẤU. Tên ở `:1.5` tôi dùng **dạng gốc** cho khớp tên ở `:0.4`, đúng cách 20 tệp thag/thig đã làm, dù Pāli dùng dạng chủ cách.

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Ekakanipāta` → *Bộ Một Bài Kinh* (160 chỗ trên đĩa, thắng *Phẩm Một Pháp* của 27 tệp `iti`). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>*. `Tatiyavagga` → *Phẩm Thứ Ba* (`iti21`–`iti26`), `Catutthavagga` → *Phẩm Thứ Tư* (`iti80`–`iti85`), `Pañcamavagga` → *Phẩm Thứ Năm* (`iti90`–`iti92`), `Sattamavagga` → *Phẩm Thứ Bảy* (`thag1.66`). Với `Chaṭṭhavagga`, `Aṭṭhamavagga`, `Navamavagga` chưa có tiền lệ nào trong tầng, tôi đặt mới *Phẩm Thứ Sáu* / *Thứ Tám* / *Thứ Chín* theo đúng công thức số thứ tự của loạt `Phẩm Thứ Hai`…`Thứ Mười Hai`. `Theragāthā 1.N` giữ **số** như `thag1.42`, `thag1.101`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có Pháp Cú), nên `triangulation` là Pāli + English Sujato. Bản Anh đã ghim có prose ở **8/9** khoá của mỗi bài; khoá trống duy nhất là `:1.5`, tức dòng lược — đúng như BRIEF_VI3 §10.1 nói, chỗ đó Pāli phải tự đứng vững.
  **Không có vế nào trùng bài khác** — tôi đã quét Pāli của toàn bộ tầng Việt sẵn có.

  **Nhịp ba vế `sādhu` tôi giữ nguyên ba lần, không lược.** `Sādhu sutaṁ sādhu caritakaṁ, / Sādhu sadā aniketavihāro;` — chữ `sādhu` lặp ở đầu vế một và vế hai, và lặp lần nữa ở đầu vế ba; đó là công thức liệt kê của thơ Pāli, mất nó thì ba vế trông giống ba mệnh đề độc lập. Tôi dịch *Lành thay* (tiền lệ 151 chỗ), không phải *Tốt là* hay *Hay lắm*.

  **Thuật ngữ đặt mới, kèm số tiền lệ.** `aniketavihāro` → *đời sống không cố định* (**0 tiền lệ** cho `aniketa` hay `aniketavihāra` trong tầng; tôi đặt mới. `aniketa` = *không có chỗ bám*, và trong ý bài là đời sống không định cư của người xuất gia; tôi tránh *đời sống lang thang* vì Sujato đọc là *the life without abode* — tức *không có tựa trú*, không phải *lang thang*, và *đi lang thang* đã có 8 chỗ trong tầng với nghĩa khác). `caritakaṁ` → *đời sống đã thực hiện* (**0 tiền lệ** cho dạng `caritaka`; `carita` thì có tiền lệ dạng *thân hành / khẩu hành / ý hành* cho `sucaritaṁ`, nhưng `caritaka` ở đây là danh từ trung tính *đời sống đã thực hành* theo Sujato *living well*). `sutaṁ` → *điều đã nghe*. `atthapucchanaṁ` → *hỏi về nghĩa* (**0 tiền lệ**, đặt mới). `padakkhiṇakammaṁ` → *việc đảnh lễ tôn kính* (tiền lệ: `dn2:56.1`, `an6.33:1.7`, `mn86:13.11` đều dịch `padakkhiṇaṁ katvā` là *đảnh lễ* / *lễ bái*; `sāmañña` → *hạnh sa-môn* có 53 chỗ). `akiñcana` → *không có gì* (tiền lệ `ud2.6:8.3` *hãy xem người có sở hữu bị khổ não* cho `Sakiñcanaṁ passa`; *không có gì* có 113 chỗ trong tầng).

  **Tên riêng.** `Kumāputta` giữ nguyên dạng Pāli ở `:0.4` và `:1.5` (Pāli `:1.5` dùng dạng chủ cách `Kumāputto`, tôi dùng dạng gốc cho khớp tên bài kệ, đúng cách `thag1.101` đã làm và đã ghi trong notes của bài đó).
  **Những lỗi bản đầu tôi tự bắt khi đọc đối kháng (đã sửa hết, ghi lại để người đọc scorecard biết điều gì đã qua):** `1.2` bản đầu bỏ sót `sadà`, làm mất *luôn luôn* — Sujato cũng có *always*; đã trả lại.
