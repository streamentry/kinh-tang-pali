notes: |-
  **Phạm vi: đủ 178/178 khoá của cnd14, không khoá nào ngoài tập khoá Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Kappa (Pārāyana, câu hỏi thứ mười), tức bài kệ `snp5.11`. Cấu trúc như `cnd6`, `cnd12`, `cnd13`: dẫn từng đoạn kệ rồi giải từng cụm. Khác ba bài kia ở chỗ có hai đoạn dài riêng: đoạn giảng *khởi điểm và điểm cuối của luân hồi* (`3`–`7`, gồm chuỗi 28 bậc đếm đời, năm, kiếp và đoạn dẫn kinh `6.2`–`6.4`), và đoạn giảng *Ma vương* (`30`–`31`). Pāli của bài **không có** `(…)`; có 13 khoá chứa `…pe…` (đều thành đúng một `…`) và 0 khoá có `…` trần; hai khoá `7.8`, `7.9` Pāli kết `…pe….` nên Việt kết ` ….`.

  **Cách trình bày lemma** theo `cnd6`/`cnd12`/`cnd13`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Có ba chỗ giữ nguyên chữ Pāli vì lời giải nói về chính hình thức của từ ấy: `Iccā` ở `7.8` (như `cnd6:3.2`–`3.3`, `cnd12:2.4`, `cnd13:2.4`), `Iti` ở `24.4`–`24.5` (nguyên văn lời giải của `cnd6:3.2`), và `vāna` ở `24.1`, `24.3` (`vānaṁ vuccati taṇhā` là cách giải từ nguyên của `nibbāna`; chữ Việt không giữ được lối chơi chữ nên để nguyên `vāna`). `koṭi` ở các bậc đếm cũng để nguyên (xem mục Số Pāli).

  **Tầng tham khảo — đo, không đoán.** Sujato không có `cnd14`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; tệp `cnd14_translation-en-sujato.json` không tồn tại, chỉ có tệp tên `cnd-name` (nhãn tác phẩm, không phải văn bản kinh). Lớp `english-project` cũng không có `cnd14`. `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự, bỏ khối `:0`) là **88** khoá (90 nếu tính cả thẻ in đậm); Sujato phủ 0/88 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/88, `vietnamese-current` 0/88. Cổng coverage vì vậy chặn bài này, và entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Có hai chứng cứ độc lập trong corpus, nhưng đều là bản của **bài khác** nên không tính là đối chiếu English của cnd14: (a) các khối kệ `1`, `13`, `14`, `20`, `21`, `26`, `27`, `32` trùng Pāli với `snp5.11`, bài mà Sujato có dịch; (b) công thức chú giải đã dịch ở `cnd6`, `cnd12`, `cnd13`.

  **Dùng lại tiền lệ.** Đã dò 57 khoá có Pāli (đã bỏ thẻ in đậm; khớp cả dấu câu) trùng nguyên văn với khoá đã dịch ở tầng ngoài bài này: dùng lại nguyên văn ở 55 khoá, khác ở 2 khoá (`14.2`, `20.2`: Pāli `(kappāti bhagavā)` trùng `snp5.11:2.2` *(Đức Thế Tôn trả lời:)* nhưng bản ấy bỏ hô ngữ `kappa`, trong khi lời giải `16.8`–`16.9` giảng đó là tên Đức Thế Tôn gọi vị Bà-la-môn; theo `cnd13:13.2` viết *(Này Kappa, Đức Thế Tôn nói,)*). Đo thêm bằng cách bỏ dấu câu và chữ hoa/thường: 79 khoá trùng, 75 dùng lại, 4 khác (`7.11`, `16.11` khác vì Pāli của khoá ấy không có ngoặc đơn như dòng kệ `snp5.11:1.2`/`2.2`; và `14.2`, `20.2`). Các kệ `1`, `13`, `14`, `20` lấy `snp5.11:1.1`–`2.5` từng dòng (bỏ nháy kép đầu/cuối ở chỗ Pāli không có); `21`, `26` lấy `snp5.11:3.1`–`3.4`; `27`, `32` lấy `snp5.11:4.1`–`4.4`. Mười khoá lời giải `28.1`, `28.2`, `28.3`, `28.6`, `28.7`, `28.9`, `28.10`, `29.1`, `29.2`, `29.5` lấy từ `cnd12:22.1`–`23.6` (cùng Pāli); `22.7`, `24.2` lấy `cnd12:13.2`; `7.9`, `16.10`, `33.1`, `33.2` lấy `cnd13`/`cnd12`; `6.4` lấy nguyên văn `sn15.1:1.15`.

  **Trong chính bài:** 20 nhóm Pāli trùng nguyên văn (32 cặp), cả 20 nhóm có bản Việt giống hệt. Đo thêm bằng cách bỏ dấu câu và chữ hoa/thường: 25 nhóm (89 cặp), 24 nhóm giống, 1 nhóm khác (`27.2`, `29.5`, `32.2`: `diṭṭhadhammābhinibbutā`, trong kệ là *đã tịch tĩnh ngay trong đời này*, trong lời giải `29.1`/`29.5` là *những vị đã thấy pháp, đã hoàn toàn tịch tĩnh*; khác có chủ ý, theo đúng cặp `cnd12:21.2`/`26.2` với `23.1`/`23.6`). Các khoá `8`/`17` giống hệt, `9.1`+`9.2` gộp thành `18.1` đúng như Pāli.

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `saṁsāra` → *luân hồi* (145 khoá chứa `saṁsār-`: *luân hồi* 127, *tái sinh* 2, *sinh tử* 2). `purimā koṭi`/`pubbā koṭi` → *khởi điểm* (`sn15.19:1.3`, `ne20:6.14`, `sn48.50:5.3`: *khởi điểm/điểm khởi đầu*), `pacchimā koṭi` → *điểm cuối* (0 tiền lệ). `anamataggo` → *không có khởi đầu được biết đến* (`sn15.19:1.6`; 5 khoá).
  - `vaṭṭa` → *vòng luân chuyển* (`dn15:22.6`, `dn15:32.11` viết *vòng luân hồi*; `dn14` viết *vòng quay*; chọn *luân chuyển* để khác *luân hồi* của `saṁsāra`, vì `12.1` liệt kê cả hai: `bhave vā saṁsāre vā vaṭṭe vā`); `vattati`/`vatti`/`vattissati` → *vận hành* (theo `dn15:22.6`). `hevaṁ natthi` → *không có chuyện như vậy* (0 tiền lệ); không dùng nháy cho lời trích sau `iti` vì Pāli của khoá không có nháy.
  - `taṇhā` → *tham ái* (trong 41 khoá của `cnd*`: *tham ái* 38, *khát ái* 0, khác 3). Riêng cụm `taṇhāsaṁyojana` ở `6.2` tầng đang thiên về *khát ái* (33 khoá: *khát ái* 21, *tham ái* 6, *ái* 2, khác 4; `sn15.19:1.3` viết *khát ái*), nhưng vì cả lời giải của bài này dùng *tham ái* cho `taṇhā` (`22.6`, `24.1`, `28.3`) nên giữ *tham ái* cho nhất quán trong bài. `avijjānīvaraṇa` → *vô minh che lấp* (35 khoá: *vô minh che* 28); `sandhāvati saṁsarati` → *trôi lăn và luân chuyển* (82 khoá chứa các dạng này: *lưu chuyển* 25, *trôi lăn* 20, *chạy* 15, *luân chuyển* 13; theo `sn15.19:1.3`). `kaṭasī` → *nghĩa địa* (`sn15.19:1.8`; chỉ 3 khoá, 3 cách dịch khác nhau).
  - `ogha` → *dòng lũ* (`snp5.11:1.3` trùng Pāli, `cnd12:18.2` *dòng lũ dục*); toàn tầng 117 khoá chứa `ogh-`: *bộc lưu* 29, *dòng lũ* 12, *dòng nước* 3, *lũ* 2 (còn lại là từ ghép), nên đây là chọn theo kệ trùng Pāli chứ không theo đa số tầng. `mahabbhaya` → *khủng khiếp* ở `8.2`/`17.2` để khớp với kệ `snp5.11:1.3` (*dòng lũ khủng khiếp*), dù lời giải `8.2` liệt kê bốn loại sợ hãi.
  - `sara` ở kệ → *dòng nước* theo `snp5.11:1.1`; lời giải `2.1` nói thẳng *dòng nước được gọi là luân hồi*. `ṭhita` → *đứng* (149 khoá: *đứng* 130), `patiṭṭhita` → *đứng vững* (123 khoá: *an trú* 39, *đứng vững* 12; chọn *đứng vững* để hai từ liền nhau không trùng chữ). Bộ ba `allīna`/`upagata`/`ajjhosita` → *bám vào, đến với, chấp chặt* theo `mn35:21.2` và `mn35:21.6` (*bám vào khổ, đi đến với khổ, chấp chặt khổ*); `ajjhosita` toàn tầng 36 khoá: *bám chấp* 8, *bám víu* 6, *chấp chặt* 4. `adhimutta` → *nghiêng hẳn về*: 0 tiền lệ cho nghĩa này (53 khoá chứa `adhimutt-`: *quyết* 26, *chú tâm* 6, *hướng* 5), xem bất định.
  - `bhavābhava` → *hữu này hữu kia* (`dn33:1.11.133`; 87 khoá chứa `bhavābhav-`); `cuti ca upapatti ca` → *sự chết, sự tái sinh* (`dn33:1.10.142`, 28 khoá chứa `cutūpapāt-`: *chết và tái sinh*/*sinh tử*); `punagati` → *việc lại đi đến một cảnh giới*, `paṭisandhi` → *kết sinh* (theo `cnd13:24.9`), `upapatti` → *tái sinh* (theo `dn33`). `kāmadhātu`/`rūpadhātu`/`arūpadhātu` → *dục giới / sắc giới / vô sắc giới*, `kāmabhava`… `nevasaññānāsaññābhava` → *dục hữu … hữu phi tưởng phi phi tưởng* (quy ước 168 khoá), `ekavokāra`/`catuvokāra`/`pañcavokārabhava` → *hữu một / bốn / năm uẩn*: đều theo `cnd13:15.19`–`15.27` (cùng chuỗi Pāli).
  - `dīpa` → *hòn đảo* (`snp5.11`, `an7.64:16.4`, `sn43.40:1.2`, `pv45:4.4`). Chuỗi `dīpaṁ tāṇaṁ leṇaṁ saraṇaṁ gatiṁ parāyanaṁ`: `tāṇa` → *nơi che chở* (29 khoá chứa `tāṇ-`: *che chở* 11), `leṇa` → *nơi nương náu* (19 khoá: *trú ẩn* 7, *hang* 6, *nương náu* 5), `saraṇa` → *chỗ quy y* (361 khoá: *quy y* 291; theo `mn35:14.4` *tìm chỗ quy y*), `gati` → *nơi đến*, `parāyana` → *cứu cánh* (12 khoá: *cứu cánh* 7, *nơi nương* 3; theo `sn43.44:4.3`–`4.4`, nơi chuỗi này cũng đứng cạnh *hòn đảo*). Chuỗi chín động từ `brūhi ācikkhāhi desehi paññapehi paṭṭhapehi vivarāhi vibhajāhi uttānīkarohi pakāsehi` theo `cnd12:10.4` (cùng chuỗi Pāli); các dạng `-mi` ở `19.1`, `24.6` đổi ngôi thành *Ta nói, Ta giải thích, …*.
  - `kiñcana` → *sở hữu*, `ādāna` → *nắm giữ* (theo kệ `snp5.11:3.1` và `cnd13:24.2`; xem bài `cnd13` về `dn33:1.10.70`). `aggo seṭṭho viseṭṭho pāmokkho uttamo pavaro` → *tối thượng, cao quý, thù thắng, đứng đầu, tối cao, ưu tú* (xem bất định).
  - Lời giải `Māra`: `Māra` → *Ma vương* (1795 khoá chứa `Māra`/`Māro`: *Ma vương* 152, *Ác Ma* 216, *Māra* giữ nguyên 319; chọn theo `snp5.11:4.3`–`4.4` trùng Pāli và `thag5.5:2.3`). `namuci` → *Namuci* (4 khoá, 3 khoá giữ *Namuci*); `pamattabandhu` → *thân quyến của kẻ phóng dật* (`sn5.1:4.3`; 5 khoá); `antagū` → *kẻ đi đến tận cùng* (17 khoá chứa `-antagū`, đều của `lokantagū`/`vedantagū` dịch *đến tận cùng*); `kaṇho` → *kẻ đen tối*; `adhipati` → *chúa tể*. `paddhagū` → *tay sai* ở kệ (`snp5.11:4.4`); `paddhā paddhacarā paricārikā` → *người hầu cận, người theo hầu, người phục dịch* (`thag13.1:1.2`, `ja444:9.6`: *hầu cận*).
  - `abhibhuyya abhibhavitvā ajjhottharitvā pariyādiyitvā madditvā` → *chế ngự, khuất phục, áp đảo, làm cạn kiệt, nghiền nát* (0 tiền lệ cho cả chuỗi; `pariyādiyitvā` 7 khoá, đều nghĩa *nắm giữ/thiêu hết*). `caranti viharanti iriyanti vattenti pālenti yapenti yāpenti` → *sống, trú, vận hành, tiếp diễn, duy trì, nuôi dưỡng, kéo dài* theo `cnd12:12.9` (cùng chuỗi Pāli). Chín từ ghép `māra-`: `māra`, `pakkha`, `pāsa`, `baḷisa`, `āmisa`, `visaya`, `nivāsa`, `gocara`, `bandhana` → *Ma vương, phe, bẫy, lưỡi câu, mồi, lãnh địa, nơi trú ngụ, nơi lui tới, sự trói buộc* (9 mục Pāli = 9 mục Việt; 0 tiền lệ cho cả chuỗi).
  - Nhãn: `Cūḷaniddesa` → *Tiểu Tập Kể Lược*, `Pārāyanavagganiddesa` → *Kể Lược Phẩm Bờ Kia*, `Pucchāniddesa` → *Kể Lược Các Câu Hỏi*, tên bài và colophon theo `cnd12:0.1`–`0.4`, `27.3` và `cnd13`.

  **Số Pāli.** Chuỗi đếm ở `3`–`5`, `7.3`–`7.4`: `sata` = 100, `sahassa` = 1.000, `satasahassa` = 100 × 1.000 = 100.000; `koṭi` = 10.000.000 (`vv24:14.2` `tisso vassakoṭiyo` = *ba mươi triệu năm* = 3 × 10⁷; `thag1.96:1.2` `asīti vassakoṭiyo` = *tám trăm triệu năm* = 80 × 10⁷). Do đó `koṭisata` = 10⁹, `koṭisahassa` = 10¹⁰, `koṭisatasahassa` = 10¹². Việt ghi *trăm* (10²), *ngàn* (10³), *trăm ngàn* (10⁵), *koṭi* (10⁷), *trăm koṭi*, *ngàn koṭi*, *trăm ngàn koṭi*: thang lớn `koṭi` là đơn vị riêng, không nhân với *ngàn* như trong *ba mươi ngàn*; tên đơn vị giữ nguyên `koṭi` (không đổi ra *triệu*) vì trong 129 khoá của tầng chứa dạng số của `koṭi` (`-koṭiyo`, `-koṭisata`, `-koṭisahassa`, `-koṭīnaṁ`…), 118 khoá giữ `koṭi` (như `bv23:6.4`, `bv19:5.2`, `bv13:8.4`, `dn17:2.5.13`, `tha-ap82:15.1` *một trăm ngàn koṭi*, `mil5.1.3:4.5`, `mil5.1.3:5.2` *trăm ngàn koṭi kiếp*), 8 khoá đổi ra *triệu* (như `vv24:14.2`, `sn22.96:3.13`), 3 khoá khác; nơi đổi ra *triệu* là chỗ Pāli có hệ số cụ thể, còn ở đây không có hệ số cụ thể. Chuỗi `3.2`–`3.10`, `4.1`–`4.8`, `5.1`–`5.8` gồm 3 đơn vị (đời, năm, kiếp) × 8 bậc (4 bậc không `koṭi`, 4 bậc có `koṭi`) = 24 dòng đếm; `3.9` là câu kết tách riêng khỏi `3.8`. Đã đối chiếu đủ 24 dòng đếm với Pāli: đúng đơn vị, đúng bậc. Chuỗi 20 bậc ở `7.4` = 5 nhóm × 4 bậc (`jātikoṭi`, `vassa`, `vassakoṭi`, `kappa`, `kappakoṭi`), Việt có 20 cụm *chừng ấy …*. Chuỗi `7.3` có 3 bậc (`jātisata`, `jātisahassa`, `jātisatasahassa`), Việt có 3. `bốn loại sợ hãi` ở `8.2` (sinh, già, bệnh, chết) = 4 mục Pāli = 4 mục Việt; bốn dòng lũ ở `8.1` (`kāma`, `bhava`, `diṭṭhi`, `avijja`) = 4; chín động từ ở `10.1`, `11.3`, `19.1`, `24.6` = 9 mỗi nơi; bảy sở hữu ở `22.3` (`rāga`, `dosa`, `moha`, `māna`, `diṭṭhi`, `kilesa`, `duccarita`) = 7; sáu tính từ ở `23.3` = 6; bốn lý do chánh niệm ở `28.7` được dẫn bằng `…`; sáu động từ liễu tri ở `28.4`, `28.5` (`aññāya jānitvā tulayitvā tīrayitvā vibhāvayitvā vibhūtaṁ katvā`) = 6 mục Việt; sáu danh từ + năm tính từ ở `29.4` (`santattā samitattā vūpasamitattā nijjhātattā nibbutattā paṭippassaddhattā` = 6; `santā upasantā vūpasantā nibbutā paṭippassaddhā` = 5): Việt có 6 và 5, bản này **không có** `vigatattā` nên bỏ mục *làm biến mất* mà `cnd12:23.5` có (Pāli của `cnd12:23.5` có 7 mục, Pāli của `29.4` chỉ 6). Không có `navuti`, `tālīsa`, `tiṁsakappasahassa`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `2.3`, `7.5`, `15.3`, `16.6` `adhimuttā` → *đã nghiêng hẳn về*: không tìm được tiền lệ cho nghĩa *thiên hướng* của `adhimutta` đi với `sattā` trong luân hồi (53 khoá, đa số *quyết*, *chú tâm*). Câu Việt kết ở *về* không có tân ngữ, đúng như Pāli không có tân ngữ.
  2. `2.1`, `15.1` `kālaṁ` → *thời gian*: đây là một mục trong chuỗi từ đồng nghĩa với `saṁsāra`, không có tiền lệ; có thể là *thời* (đoạn thời gian của một đời) hoặc *cái chết*, chưa phân xử được.
  3. `12.1` `na janeyya na sañjaneyya na nibbatteyya nābhinibbatteyya`: dịch như nội động *không sinh ra, không phát sinh, không hiện khởi, không hiện ra*; `janeyya`/`sañjaneyya` là dạng của động từ ngoại động `janeti` nên cũng có thể hiểu chủ ngữ là *khổ* đang *làm sinh ra* thứ khác; chọn cách đọc nội động theo `8.1` `jāte sañjāte nibbatte abhinibbatte`, chưa chắc chắn. `punapaṭisandhikaṁ dukkhaṁ` → *khổ có tái kết sinh* (0 tiền lệ).
  4. `6.3` `tibbaṁ paccanubhūtaṁ` → *nỗi đau gay gắt đã được trải qua*: `tibbaṁ` là tính từ trung tính, Pāli không nêu danh từ; chữ *nỗi đau* là phần bổ nghĩa của người dịch để câu Việt thành câu. `sn15.19:1.8` viết *đã trải qua gay gắt* (không danh từ). Thể bị động *khổ đã được trải qua* khác `sn15.19:1.8` (*các ngươi đã trải qua khổ*) vì khoá này không có `vo`.
  5. `23.3` `aggo seṭṭho viseṭṭho pāmokkho uttamo pavaro` → *tối thượng, cao quý, thù thắng, đứng đầu, tối cao, ưu tú*: sáu từ gần nghĩa, chỉ phân biệt được bằng chữ Việt khác nhau. Tầng có chuỗi năm từ gần nhất ở `dn30:1.20.3` (*thượng thủ, tối thượng, cao cả, tối thắng, vi diệu nhất*) nhưng không có `viseṭṭha` và thứ tự khác; không theo để tránh gán nhầm cặp.
  6. `30.2` `antagū` đặt cạnh `māro kaṇho adhipati`: 17 tiền lệ đều là `lokantagū`/`vedantagū` (*đến tận cùng*), nơi `-gū` là *người đã đi đến* một cứu cánh. Dịch *kẻ đi đến tận cùng* cho `antagū` của Ma vương là sát chữ, nhưng nghĩa gốc có thể là *kẻ làm cho chấm dứt* (cái chết); không phân xử được. Cả công thức `māro kaṇho adhipati antagū namuci pamattabandhu` không có tiền lệ trong tầng.
  7. `31.1`, `31.2` `siyā`: dạng khả năng/nguyện ước. Việt dùng thì trực tiếp *họ không phải là … ; họ là …*, không thêm *có thể/sẽ*; chưa chắc `siyā` ở đây thuần mô tả hay mang sắc thái *nên*.
  8. `30.4` chuỗi năm động từ và chín từ ghép `māra-` không có tiền lệ nào trong tầng; `ajjhottharitvā`, `pariyādiyitvā`, `madditvā` dịch sát nghĩa gốc từ. `māragocara` → *nơi lui tới* (không *cảnh giới*) để khác `visaya` → *lãnh địa*.
  9. `10.1`, `11.3` `dīpaṁ … brūhi` và `19.1`: Pāli đặt các danh từ trước, chuỗi động từ sau; Việt giữ thứ tự ấy, ngăn bằng dấu chấm phẩy, giống cách `cnd12:10.4` đặt các danh từ trước chuỗi động từ.
  10. `3.2`–`5.8` `ettakā jātiyo vaṭṭaṁ vatti`: không chắc `jātiyo` (số nhiều, cách 1 hoặc 4) là thời lượng hay chủ ngữ phụ; chọn nghĩa thời lượng *vòng luân chuyển đã vận hành chừng ấy đời*, cùng nghĩa với `ettakāni vassāni`, `ettakāni kappāni`. `jāti` dịch *đời* ở chuỗi đếm (theo `dn2:93.2`, `dn10:2.30.2`: *một đời, hai đời … một trăm ngàn đời*) nhưng *sinh* ở `2.1`.
  11. Lỗi ngoài lát, báo chứ không sửa: `mil5.4.7:28.4` (Pāli `sattapaññāsavassakoṭiyo saṭṭhi ca vassasatasahassāni`) đang viết *ba trăm năm mươi ngàn năm cùng sáu mươi ngàn năm*. Theo phép tính ở mục Số Pāli, `sattapaññāsa` = 57 và `koṭi` = 10⁷ cho 570.000.000 năm; `saṭṭhi vassasatasahassāni` = 60 × 100.000 = 6.000.000 năm; tổng 576.000.000 năm. Bản Việt hiện tại sai cả hai số. Phát hiện khi dò chuỗi `koṭi` ở tầng.

