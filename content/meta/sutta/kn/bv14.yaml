notes: |-
  Đợt 19, làn 95. Dịch từ Pāli root commit đã ghim, đủ 146/146 khoá (146 khoá mới; tệp bản dịch chưa có từ trước), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ mười hai của Buddhavaṃsa, về Đức Phật Sujāta: ba lần chứng ngộ (khi mới thuyết Pháp, khi an cư giữa chư thiên, khi đến bên cha), ba kỳ hội chúng, tiền thân là vị Chuyển luân vương trên bốn châu lục dâng cả vương quốc cho Đức Phật rồi xuất gia và được thọ ký, học kinh luật rồi sinh lên cõi Phạm thiên, gia thế, ra đi bằng xe ngựa, chuyển bánh xe Pháp, các đệ tử và thị giả, cây bồ-đề Mahāveḷu, thân lượng, hào quang, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các phẩm anh em (23/23 tiền lệ).
  - `0.2` “14. Dòng Kế Thừa Của Đức Phật Sujāta”: cùng khuôn `bv13:0.2`, `bv15:0.2`; số “14.” là số ghi trong tiêu đề Pāli.
  - `37.1` “Dòng kế thừa của Đức Thế Tôn Sujāta là thứ mười hai.”: `dvādasamo` = 12, khớp thứ tự phẩm (`bv13:32.1` thứ mười một, `bv15:28.1` thứ mười ba).

  **Số Pāli, đã tự tính.** `tayo`/`tīṇi` 3 (7.1 ba kỳ hội chúng khớp ba số ở `8.3`, `9.3`, `10.3`; 21.4 ba lâu đài khớp ba tên ở 21.3 là Sirī, Upasirī, Nanda; ba lần chứng ngộ khớp `4.3`, `5.3`, `6.3`, nhưng xem bất định 12). `asītikoṭī` = **tám mươi koṭi** (4.3). `sattatiṁsasatasahassa` = (7 + 30) × 100 × 1.000 = 37 × 100.000 = **ba triệu bảy trăm ngàn** (5.3). `saṭṭhisatasahassa` = 60 × 100.000 = **sáu triệu** (6.3, 8.3). `paññāsasatasahassa` = 50 × 100.000 = **năm triệu** (9.3). `catūhi satasahassehi` = 4 × 100.000 = **bốn trăm ngàn** (10.3). `catudīpa` **bốn** châu lục (11.2, 13.1). `satta ratana` **bảy** báu (13.2). `dasasahassī` **mười ngàn** thế giới (15.2). `dasapāramī` **mười** ba-la-mật (17.4). `navaṅga` **chín** phần (18.2). `navavassasahassa` 9 × 1.000 = **chín ngàn năm** (21.1). `tevīsatisahassa` = 3 + 20 = 23 × 1.000 = **hai mươi ba ngàn** (22.1; cùng khuôn `bv9:19.1`). `caturo` **bốn** dấu hiệu (23.1). `anūnanavamāsa` = không thiếu + 9 tháng = **đủ chín tháng** (23.3; cùng khuôn `bv9:20.3` “Đủ mười tháng”, `bv16:17.3` “Đủ tám tháng”). `paññāsaratana` = **năm mươi** ratana (31.1; giữ nguyên chữ ratana như `bv9:25.1`, `bv13:26.1`). `navutivassasahassa` 90 × 1.000 = **chín mươi ngàn năm** (33.1). `tīṇigāvuta` = **ba** gāvuta (36.4; giữ nguyên đơn vị như `bv24:27.4`). `dvādasama` **mười hai** (37.1). Thang lớn nhân cả số đã tích lũy, không nhân riêng chữ số đứng trước.
  - `Tiṁsakappasahassamhi` (15.3) là cụm **chưa phân xử được**: cấu tạo đầy đủ tiṁsa 3 × kappa 100 × sahassa 1.000 = 300.000, còn cách đọc “ba mươi ngàn kiếp” coi `kappasahassa` là “ngàn kiếp”. Tầng Anh đã ghim không có bản nào và toàn tầng Pāli chỉ có một dạng này, nên không có chứng cứ độc lập. Tôi dịch theo ngữ cảnh “Sau ba mươi ngàn kiếp nữa,”: đây là lời thọ ký tương lai (`ayaṁ buddho bhavissati`), nên dùng “sau … nữa” như `bv13:13.3`, `bv15:12.3`, `bv16:11.3`, `bv9:14.3`, chứ không dùng “trước đây” (dạng này ở các khoá hồi tưởng quá khứ của `tha-ap`). Đo toàn tầng (trừ chính bài): 25 khoá trùng Pāli, trong đó 5 khoá “Sau ba mươi ngàn kiếp nữa” (4 khoá thọ ký tương lai ở `tha-ap` cộng `bv13:13.3`), 16 khoá “Vào ba mươi ngàn kiếp trước (đây)” (toàn ở khoá hồi tưởng quá khứ), 1 khoá “Trong ba mươi ngàn kiếp”, 1 “Trong ba mươi ngàn đại kiếp”, 1 “Trong suốt ba nghìn kiếp” (`tha-ap151:3.1`) và 1 “Từ ba trăm nghìn ấy” (`tha-ap109:10.1`). Tôi chọn đúng nghĩa thời (tương lai) và theo đa số số “ba mươi ngàn”, nhưng **không** tuyên bố đã xác lập giá trị; người biên tập cần phán nếu muốn chọn 3.000, 30.000 hay 300.000.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã publish và draft (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 65 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 1.765 cặp, trong đó 153 cặp có Việt khác bản tôi viết; 62 khoá dùng đúng nguyên văn một tiền lệ.
  - Dùng lại đúng nguyên văn một tiền lệ: 62 khoá — `0.1`, `1.1`, `1.4`, `3.2`, `3.4`, `4.4`, `5.3`, `5.4`, `6.3`, `6.4`, `7.1`, `7.3`, `7.4`, `8.1`, `9.3`, `9.4`, `11.1`–`11.4`, `12.2`, `13.4`, `15.1`, `15.3`, `15.4`, `16.1`–`16.3`, `17.1`, `17.3`, `17.4`, `18.1`–`18.4`, `19.1`–`19.4`, `21.1`, `21.2`, `21.4`, `22.1`, `22.2`, `23.1`, `23.2`, `23.4`, `24.1`, `24.3`, `25.2`, `26.2`, `26.3`, `30.2`, `30.4`, `33.1`–`33.4`, `34.1`, `35.1`, `35.3`, `35.4`.
  - 65 − 62 = 3 khoá trùng Pāli nhưng tôi cố ý khác tiền lệ: `10.4` (tiền lệ duy nhất kết `;` còn Pāli ở đây kết `.`, nên giữ `.`; nội dung “đã đến gần bậc Chánh Đẳng Giác” giống hệt), `14.4` (7 cặp: 4 cặp “chỗ ngồi, chỗ nằm để dựa” hiểu `paccaya` là chỗ nương tựa, 2 cặp “vật dụng” là `tha-ap397:22.2` “vật dụng, chỗ nằm chỗ ngồi;” và `iti107:4.2`, 1 cặp “vật liệu tu sửng và chỗ ở”; tôi chọn “vật dụng, chỗ nằm chỗ ngồi” vì `paccaya` ở ngữ cảnh dâng cúng Tăng đoàn là vật dụng cần thiết, kết `.` theo Pāli; cách đọc đa số là một lựa chọn khác có thể bảo vệ), `17.2` (2 tiền lệ khác nhau: “tôi càng sinh thêm niềm hoan hỷ.” và “càng sinh thêm hoan hỷ.”; chọn “ta càng sinh thêm hoan hỷ;” theo ngôi của cả phẩm bv và dấu kết theo Pāli).
  - Cặp khác tập trung ở `11.4` (128 cặp, 66 khác: 62 khoá “Chuyển luân vương có đại thần lực” cùng bản tôi, còn lại khác chữ hoa hoặc dịch khác như “bậc vua Chuyển Luân vĩ đại” 12; chọn dạng đa số nhất), `16.2` (970 cặp, 27 khác: dạng `…` của `…pe…` là 943/970, 21 khoá có dấu cách thừa, 6 khoá có nháy mở thừa; giữ đúng một `…` như đa số), `15.3` (25 cặp, 24 khác; xem mục số Pāli), `14.4` (7 cặp, 7 khác), `3.4` (8 cặp, 4 khác, chỉ khác chủ ngữ “Ngài đã” và dấu cuối), `11.1` (22 cặp, 4 khác), `11.2` (4 cặp, 3 khác: 3/4 cùng chữ “là vua trên bốn châu lục”, trong đó 2 khoá chỉ khác dấu cuối `.` so với `;`, còn 1 khoá dịch “làm chúa tể trên bốn châu đảo”), còn lại là các khoá lẻ khác dấu cuối hoặc có đúng 1 tiền lệ lệch.
  - Trùng nguyên văn **trong chính bài**: 1 nhóm — `sujātassa mahesino` (`7.2`, `20.4`, `25.4`). `20.4` và `25.4` cùng Việt “của Sujāta, bậc Đại Ẩn Sĩ.”, riêng `7.2` là “nơi Sujāta, bậc Đại Ẩn Sĩ;” vì đứng sau `Sannipātā tayo āsuṁ` (cùng khuôn `bv13:7.2`, `bv16:6.2` “nơi … bậc Đại Ẩn Sĩ;”) còn hai khoá kia chỉ sở hữu của cha mẹ và thị giả (cùng khuôn `bv13:18.4`, `bv13:23.4`, `bv19:16.4`, `bv19:21.4`). Số cặp trùng trong bài mà Việt khác: 1 (`7.2`), vì khác vị trí cú pháp như trên.

  **Thuật ngữ, kèm số đếm.**
  - `narāsabha` → “đấng Nhân Ngưu” (10.1): toàn tầng 70 khoá “đấng Nhân Ngưu” so với 13 khoá “bậc Nhân Ngưu”; gần nhất (các phẩm bv) 5 so với 4; chọn đa số tầng.
  - `issara` → hai nghĩa theo chủ thể: 11.2 `catudīpamhi issaro` → “là vua trên bốn châu lục” (3/4 khoá trùng Pāli ở tầng, chủ thể là vị Chuyển luân vương); 15.2 `dasasahassimhi issaro` → “bậc chúa tể trong mười ngàn thế giới” (chủ thể là Đức Phật; cùng cách `bv9:12.4` “chúa tể”, `mn92:16.20` “chúa tể xứ Jambu”). Không dùng cùng một chữ vì chủ thể khác nhau.
  - `sīhahanusabhakkhandha` (1.3) → “quai hàm như sư tử, vai như bò mộng”: `sīhahanu` → “quai hàm như sư tử” (`dn30:2.25.5`, `dn14:1.32.28`), `usabhakkhandha` → “vai như bò mộng” (`bv3:6.1`).
  - `guṇa` → “đức tính” (31.4, 35.2): trong 71 cặp Pāli chứa `guṇ-` (khoá ngắn hơn 60 ký tự), Việt có “đức tính” 19, “đức hạnh” 15, “phẩm đức” 12, “phẩm chất” 8, “công đức” 2 (một khoá có thể chứa nhiều dạng); chọn “đức tính” vì `guṇāni … atuliyāni` nói về các tính chất của Đức Phật, không phải về hạnh kiểm.
  - `sabbākāravarūpeta` → “đầy đủ mọi phẩm tính thù thắng” (31.3): cùng gốc `sabbākāravarūpet-` có 3 khoá ở tầng (`dn16:6.10.26`, `thag16.10:10.3` cùng “đầy đủ mọi phẩm tính thù thắng”; `sn6.15:8.3` “đầy đủ mọi tướng tốt tối thượng”); theo dạng 2/3.
  - `dasasahassī` → “mười ngàn thế giới” (15.2), `bv17:21.4`, `bv19:4.1`, `bv23:5.4` (dạng `dasasahassī sadevake`).
  - `cetiya` → “bảo tháp” (36.3): `bv12:31.3`, `bv15:27.3`, `bv19:28.3` (dạng Chính tại nơi ấy, bảo tháp …).
  - `niyyādayitvāna` → “sau khi dâng hiến” (13.3): `niyyādesiṁ` → “dâng hiến” ở `tha-ap20:3.4`, `tha-ap44:3.4`.
  - Tên riêng giữ chữ Pāli có dấu: Sujāta, Maṇḍa, Sumaṅgala, Sumaṅgaluyyāna, Uggata, Pabhāvatī, Sirī, Upasirī, Nanda, Sirinandā, Upasena, Sudassana, Sudeva, Nārada, Nāgā, Nāgasamālā, Mahāveḷu, Sudatta, Citta, Subhaddā, Padumā, Silārāma (cùng khuôn `bv13:22.4` “Sudassanuyyāna”). `ratana`, `koṭi`, `gāvuta` giữ nguyên đơn vị, không quy đổi.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `15.3` `Tiṁsakappasahassamhi`: xem mục số Pāli ở trên.
  2. `5.2` `Deve vassaṁ upāgami`: `deve` có thể đọc là “giữa chư thiên” (dạng chỉ nơi của `deva`) hay “ở cõi trời”; dịch “vào an cư mùa mưa giữa chư thiên” (cùng khuôn `bv17:6.2` “vào an cư mùa mưa ở Saraṇa”). Không thêm tên cõi hay tên người được thuyết Pháp vì Pāli không nêu.
  3. `8.1`–`8.4`: `Abhiññābalappattānaṁ appattānaṁ bhavābhave` và `Saṭṭhisatasahassāni … sannipatiṁsu te`: hai vế sở hữu cách đứng trước chủ ngữ danh cách; dịch giữ cú pháp “Của những bậc … / … Sáu triệu, / họ đã tụ hội lần thứ nhất.” Cách đọc khác: “sáu triệu trong số những bậc ấy”. `appattānaṁ bhavābhave` dịch “không đạt đến hữu này hay hữu khác” (cùng khuôn `bv7:2.4` “hữu này hay hữu khác”); cách đọc khác là “không còn rơi vào / không bị trói vào các hữu”; Pāli ghim không phân xử và không thêm “chưa” hay “còn”.
  4. `9.1`–`9.2` `tidivorohaṇe jine`: định vị tuyệt đối “khi bậc Chiến Thắng từ cõi trời giáng xuống”; `tidiva` dịch “cõi trời” (tầng có “cõi trời thứ ba”, `an5.34:9.3`, nhưng không có tiền lệ cho dạng ghép này). Không thêm tên cõi hay tên chỗ giáng xuống.
  5. `10.1`–`10.4` `Upasaṅkamanto narāsabhaṁ, tassa yo aggasāvako; catūhi satasahassehi, sambuddhaṁ upasaṅkami`: dịch “Khi đến gần đấng Nhân Ngưu, / vị đệ tử thượng thủ của Ngài; / cùng bốn trăm ngàn, / đã đến gần bậc Chánh Đẳng Giác.” Chủ ngữ là vị đệ tử thượng thủ (`yo aggasāvako`), `tassa` chỉ Đức Phật; Pāli không nêu tên và không nêu danh từ sau số `satasahassehi`, nên không thêm tên (Sudassana ở 25.1 là tên hai vị đệ tử thượng thủ, không suy ra cho 10.2) và không thêm “vị”.
  6. `12.3` `Upagantvāna vandiṁ so`: `vandiṁ` là cách chia ngôi thứ nhất, nên chủ thể “ta” (cùng các khoá “ta đã … ” liền trước và sau); `so` không dịch riêng vì không rõ nó là đại từ chỉ chính người kể, lặp lại chủ ngữ, hay chỉ là chữ đệm vần. Toàn tầng Pāli chỉ có một khoá có dạng này, nên không có đối chiếu.
  7. `14.1`–`14.4` `Ārāmikā janapade, uṭṭhānaṁ paṭipiṇḍiya; upanenti …`: `ārāmikā` dịch “những người phục vụ tịnh xá” (cũng có thể là “người trông coi vườn”); `uṭṭhāna` dịch “thu hoạch” (cũng có nghĩa “nỗ lực, công sức”; cách đọc khác “gom góp công sức”); `paṭipiṇḍiya` “sau khi gom góp”. Tầng Việt không có tiền lệ cho ba từ này (0 khoá khác). `upanenti` là hiện tại, dịch trung tính “đem dâng”, không gán thời quá khứ.
  8. `27.1`–`27.4`: `ghanakkhandha` dịch “thân chắc đặc”; `acchiddo hoti pattiko` dịch “không có lỗ hổng, có lá” (cách đọc khác: `acchidda` là “không thủng, không khuyết”, `pattika` là “có lá”); `Uju vaṁso brahā hoti` dịch “Tre thẳng, to lớn” vì cây bồ-đề là Mahāveḷu (`veḷu` là tre); `vaṁsa` còn có nghĩa “thân/dòng”, nên cách đọc khác là “thân thẳng, to lớn”. `dassanīya manorama` dịch “đáng ngắm, đẹp lòng”, cùng `29.4`.
  9. `28.3` `morahattho`: dịch “bó lông công” (cách đọc khác: “chiếc quạt/phất trần lông công”); `subaddha` “buộc chắc”.
  10. `29.3` `Vitthiṇṇasākho aviralo`, `29.4` `sandacchāyo`: dịch “Cành lan rộng, rậm rạp” và “bóng mát dày”; không có tiền lệ độc lập (0 khoá khác).
  11. `32.1`–`32.4`: `asamasamā` (giống cái, hợp với `pabhā`) dịch “vô song”; `appamāṇo atuliyo … anūpamo` (giống đực) là về Đức Phật nên mở bằng “Vô lượng”, không thêm đại từ. `opammehi anūpamo` dịch “không thể ví sánh bằng các ví dụ”.
