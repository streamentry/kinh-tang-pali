  Lượt cải thiện 2026-10-14 (rà soát đối kháng lần ba): đổi 1/17 khoá (2.2), phân loại terminology/clarity fix nhẹ, không phải sai nghĩa trọng yếu. 2.2 "thắt chặt khố" → "thắt chặt đai lưng" cho gāḷhaṁ kacchaṁ bandhitvā. Lý do: kaccha đi với bandh- là dây đai buộc quanh thân; đo trên tầng, cùng thành ngữ kacchaṁ nāgānaṁ bandhatha ở ja538:64.2 và ja498:6.3 đều dịch "buộc đai bụng cho các con voi", Kacchāya baddhamānāya ở ja547:720.3 dịch "khi đai bụng đang được buộc" — tức tầng dùng "đai", 0 khoá nào dùng "khố" cho kaccha; "khố" thu hẹp nghĩa thành một loại y phục cụ thể mà Pāli không nói. Điểm các tiêu chí không đổi vì chỗ đổi chỉ là một cụm trong một khoá và nghĩa "đai/dây buộc quanh thân" vẫn là suy từ thành ngữ chứ chưa có ví dụ kaccha mặc vào người.
  Đã đọc lại cặp Pāli↔Việt cả 17 khoá và đo thêm, không thấy lỗi nghĩa nào khác: (1) mahāmegho abhippavasseyya → "một cơn mưa lớn đổ xuống": dn23:23.19 "mưa to đã sa xuống", mn88:19.2 "cơn mưa lớn đổ xuống" (cùng uparipabbate mahāmegho, cùng ubhato kūlāni saṁvissandantī "tràn lan cả hai bờ"); khớp. (2) yathāninnaṁ pavattamānaṁ pabbatakandarapadarasākhā paripūretvā: sn55.38:1.1, sn12.23:7.1, an3.95:6.1, an10.61:4.1, an10.62:4.1 cùng "chảy theo dốc lấp đầy các hang hốc, khe nứt và lạch suối trên núi"; khớp. (3) yogāvacara → "hành giả": 96 khoá "hành giả" so với 10 khoá "bậc" trong tầng mil. (4) sotāpattiphale → "quả Dự lưu": 59 so với "nhập lưu" 35; arahatte vā → "A-la-hán" 29/29. (5) mahārāja → "này Đại vương": 1.329 khoá so với "tâu đại vương" 817 trong mil, và mil3.1.8, 12, 13, 14, 15, 16 đều "này Đại vương" (chỉ mil3.1.9 dùng "tâu đại vương"); giữ. (6) Thero āha → "Trưởng lão nói—": 21 khoá dạng gạch nối so với 5 khoá dạng dấu hai chấm trong mil; bài này không chứa khoá Thero āha hay Rājā āha nên không bị ảnh hưởng. (7) athaññataro puriso → "một người khác": toàn tầng "một người" 15, "một người khác" 5 (mil3.1.11:2.2, mil5.1.3:11.2, mil5.2.3:13.2, mil5.3.2:10.1, dn26:12.5), "một người nào đó" 4; giữ vì aññatara gốc từ añña, và ở đây người ấy đối lập với đám đông đứng trên bờ — không thêm nghĩa. (8) "lòng tin" ở vế kệ 3.1 so với "đức tin" ở lời thường: 3.1–3.4 dùng lại nguyên văn sn10.12:5.1–5.4 (Pāli trùng, chỉ khác độ dài nguyên âm taratī/tarati và dấu nháy); snp1.10:9.1 lại dịch "nhờ tín"; giữ theo luật dùng lại nguyên văn, ghi nhận sự không đồng nhất "lòng tin"/"đức tin" trong cùng bài là hệ quả của luật đó chứ không phải nhầm. (9) Số: 5.1 ekādasamo → "thứ mười một", khớp tiêu đề 0.3 "11."; không có số nào khác. (10) Pāli trùng trong chính bài: 1 cặp (1.3 và 2.4), Việt giống hệt trừ dấu nháy đóng ” ở 1.3 theo đúng Pāli; 1.2 và 2.3 khác ở "Yathā"/"evameva" nên không phải cặp trùng nguyên văn nhưng Việt cùng chuỗi nội dung. Nháy “ ” ‘ ’ khớp Pāli 17/17 khoá; NFC;