  Sửa lỗi nghĩa thật: 9/17 khoá đổi (0.3, 1.1, 1.2, 1.3, 2.2, 2.3, 2.4, 2.5, 5.1); riêng 1.2, 2.2, 2.3 là lỗi nặng, còn lại là đổi theo thuật ngữ và dấu nháy. (1) yogāvacaro → "hành giả" (bản cũ "bậc đã đạt tới" ngược nghĩa: yogāvacara là người đang thực hành; tầng mil dùng "hành giả" cho yogāvacara ở mil3.1.13, mil3.2.3, mil7.7.8). (2) sampakkhandati/sampakkhandana → "lao vào" (bản cũ "thành tựu trọn vẹn"; cùng động từ ở 2.2 là pakkhanditvā "lao mình vào mà lội qua" nên một từ gốc phải một cách dịch; tiền lệ ps1.5:61.2 "tâm lao vào giới"; mil3.1.10 dịch "tiến tới hăng hái", khác nhưng không phải tiền lệ đa số). (3) appattassa pattiyā anadhigatassa adhigamāya asacchikatassa sacchikiriyāya → "để đạt điều chưa đạt, đến điều chưa đến, chứng điều chưa chứng", dùng lại nguyên văn dn33:3.1.14/dn34 (bản cũ "để thấy suốt điều chưa thấy suốt" bịa nghĩa "thấy suốt"; "của một người chưa được như thế" là thêm nghĩa). (4) vimuttaṁ → "đã giải thoát" bỏ "hoàn toàn" (thêm nghĩa); aññesaṁ số nhiều → "những người khác". (5) sotāpattiphale/sakadāgāmiphale/anāgāmiphale/arahatte → "quả Dự lưu/Nhất lai/Bất lai/A-la-hán" theo tầng (đếm: sotāpattiphal "Dự lưu" 55 so với "nhập lưu" 41; sakadāgāmiphal "Nhất lai" 57 so với "nhập lưu một lần" 3, tức cách cũ sai nghĩa; anāgāmiphal "Bất lai" 66 so với "bất tái" 2). (6) Kathaṁ ... → "là thế nào?" (cũ "là gì?"), theo mil3.1.10:1.4. (7) Ví dụ 2.2: yathāninnaṁ pavattamānaṁ → "chảy theo dốc" (bản cũ "chảy đầy tràn theo phương hướng"; tầng sn55.38, an3.95, an10.61… đều "chảy theo dốc"); pabbatakandarapadarasākhā → "hang hốc, khe nứt và lạch suối trên núi" (sn55.38, sn12.23, an3.95, an10.61 cùng cụm này; bản cũ "khe núi và hốc đất" bỏ mất sākhā); saṁvissandantī → "tràn" (mn88:19.2 "tràn lan cả hai bờ"); "bờ xa" → "bờ" (tīre không có "xa"; bản cũ thêm); uttānataṁ vā gambhīrataṁ vā → "nông hay sâu"; gāḷhaṁ kacchaṁ bandhitvā → "thắt chặt khố" (bản cũ "làm một bến sâu" sai hẳn: kaccha ở đây là khố/vạt quấn, "gird up the loins", bandhitvā là buộc); attano thāmañca balañca → "sức bền và sức mạnh của chính mình" theo cnd23:313.3; pakkhanditvā → "lao mình vào". (8) Dấu nháy: Pāli 2.4 là saddhāti. KHÔNG có nháy đóng (lời Trưởng lão kéo dài qua 2.5 và 3.1–3.4, nháy đóng nằm ở 3.4 ’”ti); bản cũ thêm ” ở 2.4 nên một cặp nháy bị đóng hai lần — đã bỏ ” ở 2.4, nay 1.3 và 3.4 mới đóng. (9) 2.5: thêm "cũng" cho -pi của Bhāsitampetaṁ (theo mil3.1.9:5.4) và dịch vara thành "tôn quý" (mil7.6.1; bản cũ bỏ mất saṁyuttanikāyavare…vara).
  Khoá giữ nguyên: 2.1, 3.1–3.4, 4.1 (3.1–3.4 là lại nguyên văn sn10.12:5.1–5.4, 4.1 là công thức "Khéo lắm" 54 tệp mil). Pāli trùng trong chính bài: 1.2 và 2.3 (lặp công thức), 1.3 và 2.4 — 2 cặp, bản Việt của mỗi cặp nay trùng nhau, ngoài ra duy nhất dấu nháy đóng ở 1.3 mà 2.4 không có, đúng theo Pāli.
