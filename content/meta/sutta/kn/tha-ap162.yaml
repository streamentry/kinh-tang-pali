  như vầy:* (không lời hô).

  **Hai chỗ tôi cố ý KHÔNG sao chép tiền lệ.**
  1. `Padumuppalasañchanno,` — tôi dịch **Đáy hồ trải kín hoa sen đỏ và sen xanh**. `Padumuppala`
     là **dwandva** (paduma + uppala = sen đỏ + sen xanh), không phải một loài. Tầng xác nhận
     `uppala` = xanh, `paduma` = đỏ/hồng.
  2. `upanesiṁ mahesino;` — chủ thể là **người kể**, không phải Đức Thế Tôn. Vế kế
     `Mama saṅkappamaññāya` là *thấu rõ ý định **của ta***, nên người trao quà là người kể và
     `mahesino` là **người nhận**. Tôi dùng đúng nguyên văn tiền lệ n=1 ở cùng cấu trúc câu:
     **tôi đem dâng lên bậc Đại Ẩn Sĩ;**

  **Một chỗ tôi cố ý lệch tiền lệ n=1, và nói rõ.** `mahājātassaro ahu;` có tiền lệ n=1
  (`tha-ap78:1.2`) dịch *có một hồ nước lớn;*, bỏ mất `mahājāta`. `Jātassarassāvidūre` ở
  `:3.3` cùng gốc với nó (hồ của rừng **tếch**), nên `mahājāta` là nghĩa không được bỏ. Tôi
  dịch **có một hồ lớn giữa rừng tếch;** và **Không xa hồ trong rừng tếch,**. Đây là lựa chọn
  ưu tiên nghĩa Pāli hơn tiền lệ đơn lẻ; nếu biên tập muốn khớp tiền lệ thì phải sửa **cả
  hai** khoá cùng lúc.

  **Nhịp nháy.** Pāli mở `“` ở `:1.1` và đóng `”` ở `:7.3`; bài này **không** có nháy đơn.
  Tôi làm **khớp Pāli từng khoá**, không cho mỗi khoá tự cân: 2 khoá tự mất cân, đúng như Pāli;
  đọc liền cả bài thì `“=1 ”=1`.

