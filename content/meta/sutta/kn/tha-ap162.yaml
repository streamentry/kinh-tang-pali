  **Công thức lời-kết: đã sửa sang nhóm đông.** `imā gāthāyo` là **số nhiều**. Đo tầng:
  `đã nói những bài kệ này` **424** so với `đã từng nói bài kệ này` **28** (riêng phẩm
  `tha-ap`: 416 so với 12); riêng `Bandhujīvakavagga` là 8 so với 2. Khoá `:8.1` của bài này
