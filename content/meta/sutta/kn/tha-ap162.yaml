  **Bất định đã ghi, không giấu.**
  1. `Sīlavā buddhisampanno,` (`:2.3`) — chủ ngữ có thể là **con chim** Kukuttha ở vế trước
     hoặc Đức Thế Tôn ở vế sau; Pāli dùng cùng dạng danh từ cho cả hai và không có dấu hiệu
     rõ. Tôi giữ **đầy đủ giới hạnh, thành tựu giác ngộ,** theo nghĩa của chính từ, không
     thêm chủ thể nào mà Pāli không nói.
  2. `cumuda`/`puṇḍarīka` (`:1.4` và `:4.1`) — hai từ gần nghĩa nhau, tầng này dịch cả hai
     là **sen trắng**, nên trong bài có hai chỗ cùng một cách dịch cho hai từ khác nhau. Tôi
     giữ theo tầng; nếu biên tập muốn phân biệt thì phải sửa **cả cuốn** chứ không riêng đây.
  3. Khối `uddāna` `:12.1`–`:12.6` là kệ liệt kê danh hiệu hoa của các vị trong phẩm, không có
     tiền lệ ở tầng `tha-ap`. Tôi giữ **tên và danh hiệu hoa ở dạng Pāli** và chỉ thêm dấu
     câu Việt, vì đây là danh xưng của các bậc A-la-hán; `chappaññāsa pakittitāti` tôi dịch
     **được người học thuộc tụng đọc thuần thục** theo nghĩa gerundive, không suy diễn thêm.

