notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim (`11c9d708978cde8ba61096d8a75f7ddfb846f639`), bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  - |-
    **Bài này không có khoá số thứ tự, nên kiểm uddāna không kích hoạt.** Khoá cuối `3.5` là dòng chữ ký `… Abhibhūto thero ….`, không phải `Paṭhamaṁ`/`Dutiyaṁ`. Tôi vẫn kiểm phần `Tikanipāta` (`0.2`): số của kệ này là 13, nằm trong `Paṭhamavagga` của `Tikanipāta`, và phẩm không ghi vần tục lược cho từng bài nên không có chỗ nào phải đối chiếu số.
  - |-
    **8/12 vế kệ đã có bản Việt trùng nguyên văn ở tệp khác, tôi dùng lại nguyên văn.**
    Chỉ mục Pāli↔Việt dựng bằng script (6136 bài Pāli trong cache × 4038 tệp Việt dự án, ghép theo khoá) cho **78 cặp trùng trong lát**. Ở bài này:
    `2.2–2.4` và `3.1–3.3` lấy nguyên văn từ `sn/sn6.14:6.2–6.4` và `:7.1–7.3` — đây chính là bài kệ Abhibhū nói trong Phạm Thiên giới, cùng một văn bản;
    `3.4` lấy từ `thag1.84:1.4` (`dukkhassantaṁ karissatī”ti.` trùng nguyên văn) → *chấm dứt khổ đau được”ti.*;
    `1.2` lấy từ `dhp/dhp334-359:dhp337:2` (`yāvantettha samāgatā;`) → *tất cả những ai đã tụ họp ở đây;*;
    `1.4` lấy từ `dhp/dhp146-156:dhp153:4` → *sanh đi sanh lại thật khổ.*
  - |-
    **Ba chỗ phải tự phán, tôi ghi lại vì người đọc có thể thấy khác.**
    (1) `1.1–1.2`: Pāli có `sabbe` ở `1.1` và `yāvantettha` ở `1.2`. Bản `dhp337` đưa *tất cả* vào `2.2`; tôi làm y hệt, nên `1.1` là *Hãy nghe, các người con của tôi,* và `1.2` là *tất cả những ai đã tụ họp ở đây;*. Không mất chữ nào.
    (2) `1.3–1.4`: `Dhammaṁ vo desayissāmi, / dukkhā jāti punappunaṁ.` là cú nhảy của kệ — vị từ không có tân ngữ. Tôi đặt dấu hai chấm ở `1.3` để câu đọc được là *Ta sẽ giảng cho các ngươi pháp: sanh đi sanh lại thật khổ*. Bản Anh đã ghim dịch *"I'll teach you Dhamma! / Painful is birth again and again"* — không có nối từ, nhưng bản Anh không phải authority.
    (3) `ñātayo` = "người con của tôi" (Đức Thế Tôn gọi đệ tử là con). **0 tiền lệ** trong tầng Việt dự án; bản Anh dịch *my relatives*. Tôi chọn *người con của tôi* vì đúng nghĩa gốc.
  - |-
    **Tiêu đề và chữ ký.** `:0.4` `Abhibhūtattheragāthā` → *Kinh Kệ Của Trưởng Lão Abhibhūta* theo đúng mẫu đã có ở ~90 bài `thag1`/`thag2`/`thag3` (*Kinh Kệ Của Trưởng Lão X*); `Abhibhūtattheragāthā` chưa có tiền lệ riêng nhưng khuôn thì có. `:3.5` `Abhibhūto thero` → *… Tôn giả Trưởng lão Abhibhūto ….* — dạng `-o` của câu kệ, giữ nguyên dấu, theo `thag3.14:3.5` (*… Tôn giả Trưởng lão Gotamo ….*). `Tikanipāta` → *Bộ Ba Bài Kinh* theo đa số 87 tệp `iti50–155`, khớp bảng tên đã chốt ở `BRIEF_VI3` §11.
  - |-
    **Tầng Anh.** 16/17 khoá có prose Sujato, im lặng ở `3.5` (đúng như dự đoán: Sujato không dịch dòng chữ ký). Nhưng ở `3.1–3.2` Sujato **đảo thứ tự**: *Whoever shall meditate diligently / in this teaching and training* trong khi Pāli là `Yo imasmiṁ dhammavinaye, / appamatto vihassati` — nếu dịch vòng qua English sẽ ra câu sai trật tự. Tầng Anh ở bài này chỉ hữu ích cho tiêu đề và nghĩa chung, không phải cho cú pháp; đó là lý do `triangulation` chỉ 8.9.
