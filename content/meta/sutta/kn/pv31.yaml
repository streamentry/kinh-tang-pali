notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv31_root-pli-ms.json` (71/71 khoá, đủ và đúng thứ tự Pāli).

  - Tầng tham khảo:
    Tầng `english-sujato` không có pv31; `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Coverage English: mẫu số = 0 — mọi khoá Pāli có nội dung của bài đều ngắn hơn 40 ký tự (dài nhất 29, ở 13.1), nên cổng coverage không đo được gì; đây không phải bằng chứng đồng thuận về cách dịch, và cũng không phải bằng chứng đã có English. Vì ba tầng đều vắng, `triangulation` đặt 7.5 (không quá 8.0) và bài giữ `draft` với blocker `noEnglishEditionUpstream`. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài và tiền lệ cùng bộ.
  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” giữ nguyên; `0.2` “Cūḷavagga” giữ nguyên (pv28, pv29, pv30, pv32, pv33, pv34, pv35: 7/7 giữ Pāli).
    + `0.3` “6. Chuyện Ngạ Quỷ Seriṇī” theo khuôn “N. Chuyện Ngạ Quỷ …” của các bài cùng phẩm (pv28 đến pv35); `Seriṇī` là tên riêng, giữ nguyên, không dịch nghĩa (không có tiền lệ trong tầng; Pāli không nói rõ đây là tên người hay tên nơi). Với dạng `-petivatthu`, đa số bỏ chữ “Nữ” (pv28, pv44, pv6, pv7, pv22: 5 bài) so với giữ “Ngạ Quỷ Nữ” (pv9, pv10: 2 bài); theo đa số. `16.1` “Chuyện Ngạ Quỷ Seriṇī, thứ sáu.” (Pāli `chaṭṭhaṁ`), theo khuôn colophon của pv30, pv33, pv34 (viết hoa “Ngạ Quỷ”, dạng “…, thứ N.”).
  - Số Pāli — tự tính:
    + `Cattārisatasahassāni` (8.3, 13.3) đọc là `cattāri` 4 + `satasahassāni` (sata 100 × sahassa 1000 = 100.000), tức 4 × 100.000 = 400.000, viết “bốn trăm ngàn” (400 × 1000 = 400.000, không nhân sai thang). Cùng cách đọc `satasahassa` = 100.000 với dn14:1.10.1 `aṭṭhasaṭṭhibhikkhusatasahassaṁ` = 6.800.000 (68 × 100.000). Pāli chỉ nói số, không nói đơn vị tiền, nên bản Việt cũng không thêm đơn vị. Bất định còn lại: không có bản English độc lập để xác nhận. Đã đo ở lượt cải thiện: trong toàn Pāli root, số 40 viết `cattārīsa-` với ī dài ở 76 dạng và không có ngoại lệ, còn `cattārisata-` (ī ngắn) chỉ có đúng cụm này (pv31:8.3, 13.3, tha-ap82:14.1), nên cách đọc `cattāri` 4 hợp hơn cách đọc `cattārīsa` 40 (sẽ thành 4.000.000); nhưng thể thơ không phân xử được (cụm 9 âm tiết) nên bất định vẫn ghi lại. tha-ap82:14.1 cùng Pāli dịch “Bốn trăm ngàn”, khớp.
    + `aḍḍhamāsakaṁ` (4.2) = nửa māsaka; `māsaka` là một đơn vị tiền nhỏ, giữ nguyên Pāli “māsaka” (tầng chưa có tiền lệ; pv45:4.2 dịch “nửa đồng tiền”). `chaṭṭhaṁ` (16.1) = thứ sáu. Không còn số nào khác.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch, kể cả các bài cùng lát đã ở worktree):
    + `Ahaṁ bhadante petīmhi` (2.1) → “Bạch ngài, con là ngạ quỷ nữ”: 4/4 trong tầng hiện tại (pv6, pv7, pv13, pv44; “tôi” ở pv6, pv7, “con” ở pv13, pv44). Bản đầu của bài này ghi “con là ma” dựa trên tiền lệ cũ; tiền lệ đã đổi, và `petī` ở 15.3 vốn đã dịch “ngạ quỷ nữ”, nên “ma” làm một từ Pāli có hai cách dịch trong cùng bài. Giữ “con” ở 2.1 nên toàn bộ lời ngạ quỷ nữ giữ “con”, người nghe là “ngài”.
    + `duggatā yamalokikā` → “đã rơi vào cảnh khổ, thuộc cõi của Yama”: 4/7 khoá cùng Pāli trong tầng (pv13:2.2, pv27:2.2, pv27:6.2, pv44:2.2) so với “khốn khổ, thuộc cõi của Yama” 3/7 (pv6, pv7, pv45); dùng ở 2.2, 7.4, 11.2, 12.4. Bản đầu viết “sinh về cõi khổ xa xôi” — chữ “xa xôi” không có trong Pāli (`duggata` là “đi vào cảnh khổ, bất hạnh”) và không còn là đa số; đã bỏ.
    + `Pāpakammaṁ karitvāna` → “đã tạo nghiệp ác”: 6/6 (pv6, pv7, pv43, pv44, pv45, pv51); dùng lại ở 2.3, 7.5, 11.3, 12.5.
    + `petalokaṁ ito gatā` → “đã từ đây đi đến cõi ngạ quỷ”: đo lại ở lượt cải thiện, các khoá cùng Pāli trong tầng (không kể pv31) dịch `petaloka` “cõi ngạ quỷ” 15 so với “thế giới của người đã chết” 7 (pv13, pv27, pv44); theo đa số, và khớp “ngạ quỷ nữ” ở 2.1, 15.3. 3.4 trùng nguyên văn pv15:3.4. Ở 7.6, 11.4, 12.6 chủ thể là người con gái được nhắc đến ở ngôi ba nên bỏ “con” (không thêm “cô ấy” vào lời kinh); ở 3.4 thành câu hỏi, đổi “con” thành “ngươi”.
    + `Kiṁ nu kāyena vācāya, manasā dukkaṭaṁ kataṁ` → “Điều ác gì là do thân, do lời nói, do ý mà đã làm”: 10/10 và 9/9 (một số bài cùng phẩm pv33, pv34, pv35 dịch “Điều gì ngươi đã làm bằng thân, bằng lời”; theo đa số 7 so với 3 ở 3.1); `Kissa kammavipākena` → “Do quả báo của nghiệp nào”: 10/10.
    + `Anāvaṭesu titthesu` → “Khi các bến nước không bị ngăn chặn”: pv45:4.1 (1/1); `anāvaṭa` “không bị đóng, ngăn” cũng ở dn5:13.6 `anāvaṭadvāro` “cửa luôn rộng mở”. `titthesu` giữ nghĩa đen “bến nước” vì 5.1–5.2 tiếp tục hình ảnh sông; không ép thành “nơi phước điền” (nghĩa chú giải, thuộc comment).
    + `Santesu deyyadhammesu` → “khi sẵn có những vật đáng bố thí”: dùng lại nguyên văn 6/6 khoá cùng Pāli trong tầng (pv15:18.3, pv19:12.3, pv26:9.3, pv45:4.3, pv45:10.3, pv50:3.3).
    + `dīpaṁ nākāsimattano` → “không tạo cho mình hòn đảo”: dhp25:3 `dīpaṁ kayirātha` “tạo cho mình hòn đảo”; pv45:4.4 (cùng nghĩa, số nhiều) cũng dịch “hòn đảo”; `dīpa` vừa là đảo vừa là đèn, ở đây theo dhp25 và pv45, không thêm nghĩa.
    + Khuôn mở đầu 1.1–1.3 (Pāli trùng nguyên văn pv13, pv14, pv15, và biến thể ở pv6, pv7, pv19, pv45): dùng lại “dáng vẻ xấu xí” (4/5 cho `dubbaṇṇarūpāsi`), “gầy guộc, gân nổi chằng chịt” (4/5 cho `kisā dhamanisanthatā`; ja496 và ja516 dịch “gân mạch lộ rõ” cho dạng `dhamanisanthataṁ`, cùng nghĩa), “hỡi người sườn lòi, ốm yếu” (3/3 cho `Upphāsulike kisike`). Bản đầu dịch khác (“hình dạng xấu xí”, “gân mạch lộ rõ”, “xương sườn nhô ra, gầy yếu”) mà không có lý do riêng nên đã đồng bộ.
    + `arahāmi` (6.3) → “con đáng phải chịu”: arahati “xứng đáng, đáng được” (dn16:6.24.4 `arahāmi` “tôi xứng đáng”, ja446:5.4 `arahāmi` “con phải”); pv45:6.3 (số nhiều) dịch “đáng phải chịu điều này”, khớp.
    + `dakkhiṇaṁ anudicchatu` / `dakkhiṇamādisī` (9.4, 14.4, 15.2) → “hồi hướng phần cúng dường”: dn16:1.31.7 `dakkhiṇamādise` “hồi hướng phần cúng dường”, ud8.6:23.2 “hồi hướng phước”; pv10 (cùng lát, worktree) cũng chọn “hồi hướng”.
    + `jīvikā` → “sinh kế”: mn89:18.1 “kế sinh nhai”, an10.48:3.1 “sinh kế”; `sujīvikā` → “sinh kế tốt đẹp”.
    + `pallaṅka` (8.4, 13.4) → “giường”: dn17:2.9.2 `sovaṇṇamayaṁ pallaṅkaṁ` “chiếc giường vàng”, dn17:2.5.4 “giường”.
    + `sabbakāmasamiddhinī` (9.6, 14.6) → “đầy đủ mọi điều ước muốn”: tiền lệ vv29:3.2 dịch “làm cho mọi ham muốn được thành tựu”, sn9.6:2.4 “mọi điều mong ước đều viên mãn”; chọn cách bám sát hình thái `samiddhinī` “đầy đủ, thịnh vượng”, cùng cách với pv10:5.4 cùng lát.
    + `“Sādhū”ti so paṭissutvā` (10.1) → “Tốt lắm”, người ấy vâng lời: các khoá cùng Pāli trong pv13:7.1, pv16:9.1, tha-ap3:158.1 dịch “vâng lời, nói rằng tốt lắm” (3/3 ở nhóm pv và tha-ap; dn23 dùng “đáp lời ‘được vậy’” ở bối cảnh khác). Khoá này có nháy kép trong Pāli nên giữ nháy; chọn “Tốt lắm” và “vâng lời” theo nhóm pv.
    + `samādapesi` (12.1) → “thúc giục”: tầng dịch “khuyến khích” ở mil5.4.5 và vv82:7.2, “khích lệ” ở dn10:1.5.4; ở đây là người con gái giao việc nên chọn “thúc giục”, nghĩa nhẹ hơn “dặn dò”.
  - Trùng nguyên văn: đo lại ở lượt cải thiện trên tầng hiện tại, 38 khoá Pāli trùng (chuẩn hoá bỏ nháy và dấu cuối câu, không tính tiêu đề) với bài khác; 26 khoá dùng lại nguyên văn bản Việt, 12 khoá khác (2.4, 4.4, 9.5, 14.5: “con” thay “tôi” theo người nói của bài này; 7.6, 11.4, 12.6: ngôi ba nên bỏ đại từ; 8.3, 13.3: hoa/thường và dấu cuối; 10.1, 14.6: nháy theo Pāli từng khoá; 15.2: “cô ấy” thay “người kia/nàng ấy” cho đúng người được nhắc ở 15.1–15.4). Trùng trong chính bài: 14 nhóm; 12 nhóm bản Việt giống hệt hoặc chỉ khác dấu nháy / dấu lược `(…)` / chữ hoa đầu câu theo Pāli, 2 nhóm khác có chủ đích do khác người nói (2.4 so với 3.4: ngạ quỷ nữ trả lời so với người hỏi; 7.2 so với 12.2: lời nhờ trực tiếp “ngài hãy nói với mẹ của con” so với bản thuật lại “hãy nói với mẹ của cô ấy”, vì ở 12.2 người đang nói với bà mẹ là người đi nhắn; giữ lựa chọn này, không chắc tuyệt đối, vì Pāli 12.2 y hệt 7.2 và chuyển ngôi là một quyết định biên tập).
  - Bất định — ghi lại, không thêm vào thân kinh:
    + Người nói: Pāli không ghi người nói ở các kệ (1 và 3 là người đi đường hỏi, 2, 4 đến 9 là ngạ quỷ nữ đáp, 10 là phần kể, 11 đến 14 là người ấy thuật lại cho bà mẹ). Canonical text không thêm nhãn người nói. “Ngài” cho người nghe là theo `bhadante`; không rõ người ấy là tu sĩ hay cư sĩ.
    + Dấu nháy là của Pāli và được giữ khớp từng khoá: kép mở ở 1.1, 2.1, 3.1, 4.1, 10.1, 11.1; đóng ở 1.4, 2.4, 3.4, 9.6, 10.1, 14.6; đơn mở ở 7.3, 12.3, đóng ở 7.6, 14.6. Nháy kép 11.1 mở không đóng ở 11.4 và 12.6 vì Pāli để lời kể chạy qua ranh giới khoá đến 14.6; nháy đơn 12.3 mở đóng ở 14.6, cũng vậy.
    + `Hatthiniṁ puraṁ` (7.1, 10.2): hiểu là tên thành `Hatthinī` (viết hoa “Hatthinī”, giữ nguyên Pāli). Bản Pāli viết thường nên cũng có thể đọc là danh từ chung; tầng chưa có tiền lệ (0 khoá). Không thêm chú giải vào thân kinh.
    + `Upphāsulike` (1.3): hiếm gặp, các dạng cùng gốc ở pv19:1.3 và pv45:1.3 (dạng khác về số và giống) dịch “sườn nhô ra”. Hiểu là “có xương sườn nhô ra”, dịch “sườn lòi” theo ba khoá cùng Pāli (pv13, pv14, pv15); bản dịch của các bài này không phải căn cứ độc lập, nên nếu nghĩa chính xác khác thì chỉ chỗ này cần xem lại (semantic_fidelity 8.9).
    + `rittakā parivattati` (5.2) và `ātapo parivattati` (5.4): `parivattati` là “xoay, đổi chiều”; ở 5.2 là “trở nên trống cạn”, ở 5.4 để trung tính “xoay chuyển” vì Pāli không nói nắng xoay về phía ai. pv45:5.2, 5.4 (số nhiều) dịch giống hệt (“trống cạn”, “ánh nắng xoay chuyển”); không phải căn cứ độc lập về nghĩa.
    + `aññañca pāpakaṁ tato` (6.4): hiểu là “và còn điều xấu ác khác, ngoài điều ấy”, với `arahāmi` ở 6.3 làm động từ chung cho cả hai tân ngữ; không chắc `tato` mang nghĩa so sánh “hơn thế nữa” hay chỉ “ngoài điều ấy”, nên chọn cách trung tính.
    + `Tato me dānaṁ dadatu` (9.1, 14.1): chủ ngữ của `dadatu` không nói; hiểu là người mẹ (ngôi ba, `me mātā` ở 9.3), và dịch “hãy để bà bố thí vì con”. `tassā ca hotu jīvikā` (9.2): “tassā” hiểu là bà mẹ, `hotu` là “hãy là” nên “hãy là sinh kế của bà”; chủ ngữ ngầm là số tiền ở 8.3. Cách đọc này cũng khớp 15.4 `tassā cāsi sujīvikā` (bà mẹ có sinh kế tốt đẹp).
    + `viciniṁ aḍḍhamāsakaṁ` (4.2): dịch sát “đã đi tìm nửa đồng māsaka”; Pāli chỉ nói tìm, không nói tìm để làm gì. Cách đọc này có thể là ý nói bà chỉ lo nhặt nhạnh trong khi bến nước bố thí rộng mở; bản Việt không thêm điều đó.
    + `Sā maṁ tattha samādapesi, (…)` (12.1): `(…)` là dấu lược của chính tầng Pāli ghim (có đúng ở 12.1 và 14.4, đã kiểm trên 71/71 khoá), giữ nguyên ở hai khoá đó. Phần bị lược không có trong Pāli ghim nên không bổ sung.
    + `…pe…` và `…` trần: Pāli không có (0/71), nên bản Việt không có dấu lược nào ngoài hai khoá `(…)`.
    Vì các chỗ trên và thiếu bản English độc lập, `ambiguity_integrity` 8.6.
  - Kiểm tra: 71/71 khoá đúng tập và thứ tự Pāli; NFC, không khoá rỗng, không khoảng trắng thừa; nháy kép “ ” và đơn ‘ ’ khớp Pāli từng khoá (0 lệch trên 71 khoá; 11 khoá có nháy kép, 4 khoá có nháy đơn); `(…)` khớp Pāli 2/2 (12.1, 14.4); không Pāli lọt vào thân bản dịch ngoài tên riêng và thuật ngữ giữ nguyên (Petavatthu, Cūḷavagga, Seriṇī, Hatthinī, māsaka, Yama). Đã đọc đối chiếu từng cặp Pāli↔Việt cả 71 khoá.
  - Lượt cải thiện 2026-10-11: đọc đối kháng lại 71 khoá, đo lại tiền lệ trên tầng hiện tại (nhiều tiền lệ trích ở bản trước đã đổi). 15 khoá đổi (accuracy/terminology fix, không đổi tập khoá): 2.2, 7.4, 11.2, 12.4 (bỏ “xa xôi” không có trong Pāli; theo đa số 4/7); 2.1 (“ma” thành “ngạ quỷ nữ”, 4/4, khớp 15.3); 2.4, 3.4, 7.6, 11.4, 12.6 (`petaloka` thành “cõi ngạ quỷ”, 15 so với 7); 1.1, 1.2, 1.3 (đồng bộ khuôn mở đầu với pv13, pv14, pv15); 10.1 (“Tốt lắm”, vâng lời, 3/3 nhóm pv); 15.1 (“Rồi bà ấy đã bố thí”, theo `Tato hi so/sā` ở pv21:35.1, pv36:53.1). Điểm đổi: semantic_fidelity 8.8 sang 8.9 (bỏ chữ thêm), terminology 8.8 sang 9.0 (hết một từ Pāli hai cách dịch trong bài, bám đa số), ambiguity_integrity 8.6 sang 8.8 (số `cattārisata-` đã đo bằng dạng viết ī dài/ngắn, vẫn ghi bất định). Không đổi: source_provenance, grammar_logic, segment_alignment, triangulation (vẫn không có English độc lập), vietnamese_clarity (5.4 “ánh nắng xoay chuyển” vẫn tối nghĩa và không có căn cứ để diễn thêm), han_viet_balance, technical_integrity. Chưa phân xử được và giữ nguyên: `ātapo parivattati` (5.4), `hatthiniṁ puraṁ` tên thành hay danh từ chung, `tato` ở 6.4, nghĩa chính xác của `upphāsulika`, `samādapesi` ở 12.1 giữa “thúc giục” và “khuyến khích”.
