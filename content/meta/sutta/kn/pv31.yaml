notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv31_root-pli-ms.json` (71/71 khoá, đủ và đúng thứ tự Pāli).

  - Tầng tham khảo:
    Tầng `english-sujato` không có pv31; `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Coverage English: mẫu số = 0 — mọi khoá Pāli có nội dung của bài đều ngắn hơn 40 ký tự (dài nhất 29, ở 13.1), nên cổng coverage không đo được gì; đây không phải bằng chứng đồng thuận về cách dịch, và cũng không phải bằng chứng đã có English. Vì ba tầng đều vắng, `triangulation` đặt 7.5 (không quá 8.0) và bài giữ `draft` với blocker `noEnglishEditionUpstream`. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài và tiền lệ cùng bộ.
  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” giữ nguyên; `0.2` “Cūḷavagga” giữ nguyên (pv28, pv29, pv30, pv32, pv33, pv34, pv35: 7/7 giữ Pāli).
    + `0.3` “6. Chuyện Ngạ Quỷ Seriṇī” theo khuôn “N. Chuyện Ngạ Quỷ …” của các bài cùng phẩm (pv28 đến pv35); `Seriṇī` là tên riêng, giữ nguyên, không dịch nghĩa (không có tiền lệ trong tầng; Pāli không nói rõ đây là tên người hay tên nơi). Với dạng `-petivatthu`, đa số bỏ chữ “Nữ” (pv28, pv44, pv6, pv7, pv22: 5 bài) so với giữ “Ngạ Quỷ Nữ” (pv9, pv10: 2 bài); theo đa số. `16.1` “Chuyện Ngạ Quỷ Seriṇī, thứ sáu.” (Pāli `chaṭṭhaṁ`), theo khuôn colophon của pv30, pv33, pv34 (viết hoa “Ngạ Quỷ”, dạng “…, thứ N.”).
  - Số Pāli — tự tính:
    + `Cattārisatasahassāni` (8.3, 13.3) đọc là `cattāri` 4 + `satasahassāni` (sata 100 × sahassa 1000 = 100.000), tức 4 × 100.000 = 400.000, viết “bốn trăm ngàn” (400 × 1000 = 400.000, không nhân sai thang). Cùng cách đọc `satasahassa` = 100.000 với dn14:1.10.1 `aṭṭhasaṭṭhibhikkhusatasahassaṁ` = 6.800.000 (68 × 100.000). Pāli chỉ nói số, không nói đơn vị tiền, nên bản Việt cũng không thêm đơn vị. Bất định nhỏ: không có bản English độc lập để xác nhận cách tách `cattāri satasahassāni` (4 × 100.000) so với một cách tách khác; tầng chưa có bản dịch nào của cụm này (tha-ap82:14.1 chưa dịch).
    + `aḍḍhamāsakaṁ` (4.2) = nửa māsaka; `māsaka` là một đơn vị tiền nhỏ, giữ nguyên Pāli “māsaka” (tầng chưa có tiền lệ; pv45:4.2 dịch “nửa đồng tiền”). `chaṭṭhaṁ` (16.1) = thứ sáu. Không còn số nào khác.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch, kể cả các bài cùng lát đã ở worktree):
    + `Ahaṁ bhadante petīmhi` (2.1) → “Bạch ngài, con là ma”: 3/3 (pv6, pv7, pv44); giữ nguyên dù chữ “ma” khác chữ “ngạ quỷ” ở nhan đề, vì đó là cách dịch đã thành quy ước ở cả 3 chỗ cùng Pāli (pv45:2.1 `petāmhā` dịch “ngạ quỷ” nhưng là số nhiều, Pāli khác). Vì giữ “con” ở 2.1 nên toàn bộ lời ngạ quỷ nữ giữ “con” (không đổi giữa chừng sang “tôi” như pv6/pv7), và người nghe là “ngài”.
    + `duggatā yamalokikā` → “sinh về cõi khổ xa xôi, thuộc cõi của Yama”: 4/4 (pv6, pv7, pv44, pv45), dùng lại nguyên văn ở 2.2, 7.4, 11.2, 12.4. Cần ghi: `duggata` nghĩa là “đi vào cảnh khổ, bất hạnh”, chữ “xa xôi” không có trong Pāli; tôi giữ để đồng bộ tầng và đề nghị người biên tập sửa đồng loạt cả 5 bài nếu muốn, không sửa lẻ ở bài này.
    + `Pāpakammaṁ karitvāna` → “đã tạo nghiệp ác”: 6/6 (pv6, pv7, pv43, pv44, pv45, pv51); dùng lại ở 2.3, 7.5, 11.3, 12.5.
    + `petalokaṁ ito gatā` → “đã từ đây đi sang thế giới của người đã chết”: 5/6 khoá trong tầng dùng đúng cách này (pv7:2.4, pv44:2.4, pv44:5.4, pv45:2.4, pv45:3.4), riêng pv6:2.4 dịch “nên đã từ cõi này sang cõi loài người” là lệch nghĩa so với Pāli; 2.4 dùng lại nguyên văn pv44:2.4. Ở 7.6, 11.4, 12.6 chủ thể là người con gái được nhắc đến ở ngôi ba nên bỏ “con” (không thêm “cô ấy” vào lời kinh); ở 3.4 thành câu hỏi, đổi “con” thành “ngươi”.
    + `Kiṁ nu kāyena vācāya, manasā dukkaṭaṁ kataṁ` → “Điều ác gì là do thân, do lời nói, do ý mà đã làm”: 10/10 và 9/9 (một số bài cùng phẩm pv33, pv34, pv35 dịch “Điều gì ngươi đã làm bằng thân, bằng lời”; theo đa số 7 so với 3 ở 3.1); `Kissa kammavipākena` → “Do quả báo của nghiệp nào”: 10/10.
    + `Anāvaṭesu titthesu` → “Khi các bến nước không bị ngăn chặn”: pv45:4.1 (1/1); `anāvaṭa` “không bị đóng, ngăn” cũng ở dn5:13.6 `anāvaṭadvāro` “cửa luôn rộng mở”. `titthesu` giữ nghĩa đen “bến nước” vì 5.1–5.2 tiếp tục hình ảnh sông; không ép thành “nơi phước điền” (nghĩa chú giải, thuộc comment).
    + `Santesu deyyadhammesu` → “khi sẵn có những vật đáng bố thí”: dùng lại pv45:4.3 (3 khoá cùng Pāli: pv45:4.3, pv45:10.3, pv50:3.3 mỗi cái một cách).
    + `dīpaṁ nākāsimattano` → “không tạo cho mình hòn đảo”: dhp25:3 `dīpaṁ kayirātha` “tạo cho mình hòn đảo”; pv45:4.4 thêm “che chở” và pv45:10.4, pv11:11.4 dịch “ngọn đèn” (`dīpa` vừa là đảo vừa là đèn); ở đây theo dhp25, không thêm nghĩa.
    + `dhamanisanthatā` (1.2) → “gân mạch lộ rõ”: dhp395:2 `dhamanisanthataṁ` “gân mạch lộ rõ”, mn89:12.2 `dhamanisanthatagatte` “gân nổi khắp mình”. pv45:1.2 dịch “mùi thối khinh khỉnh”, không có căn cứ Pāli.
    + `arahāmi` (6.3) → “con đáng phải chịu”: arahati “xứng đáng, đáng được” (dn16:6.24.4 `arahāmi` “tôi xứng đáng”, ja446:5.4 `arahāmi` “con phải”); pv45:6.3 dịch “chúng tôi đã tới nơi này”, hiểu khác, nên không theo.
    + `dakkhiṇaṁ anudicchatu` / `dakkhiṇamādisī` (9.4, 14.4, 15.2) → “hồi hướng phần cúng dường”: dn16:1.31.7 `dakkhiṇamādise` “hồi hướng phần cúng dường”, ud8.6:23.2 “hồi hướng phước”; pv10 (cùng lát, worktree) cũng chọn “hồi hướng”.
    + `jīvikā` → “sinh kế”: mn89:18.1 “kế sinh nhai”, an10.48:3.1 “sinh kế”; `sujīvikā` → “sinh kế tốt đẹp”.
    + `pallaṅka` (8.4, 13.4) → “giường”: dn17:2.9.2 `sovaṇṇamayaṁ pallaṅkaṁ` “chiếc giường vàng”, dn17:2.5.4 “giường”.
    + `sabbakāmasamiddhinī` (9.6, 14.6) → “đầy đủ mọi điều ước muốn”: tiền lệ vv29:3.2 dịch “làm cho mọi ham muốn được thành tựu”, sn9.6:2.4 “mọi điều mong ước đều viên mãn”; chọn cách bám sát hình thái `samiddhinī` “đầy đủ, thịnh vượng”, cùng cách với pv10:5.4 cùng lát.
    + `paṭissutvā` (10.1) với `“Sādhū”ti` → “Được vậy”, người ấy nhận lời: dn23:6.19 `sādhūti paṭissutvā` “đáp lời ‘được vậy’”.
    + `samādapesi` (12.1) → “thúc giục”: tầng dịch “khích lệ” ở dn10:1.5.4 và “khuyến tấn” ở dn14:3.13.2; ở đây là người con gái giao việc nên chọn “thúc giục”, nghĩa nhẹ hơn “dặn dò”.
  - Trùng nguyên văn: với bài khác trong tầng, 28 khoá có Pāli trùng (không tính tiêu đề), 17 khoá dùng lại nguyên văn bản Việt (gồm 4.3 theo pv45:4.3 và 2.4 theo pv44:2.4), 11 khoá khác (1.1, 1.2, 1.4, 3.4, 5.2, 5.4, 6.2, 6.4, 7.6, 11.4, 12.6: lý do ở mục thuật ngữ và bất định; riêng 1.1 và 1.4 trùng pv6:1.1, pv7:1.1, pv6:1.4, pv7:1.4: bản có sẵn bỏ mất `naggā` “trần truồng” ở 1.1 và `kā` “ai” ở 1.4 — tôi dịch đủ cả hai; đó là lỗi của bài khác, báo không sửa). Trùng trong chính bài: 16 nhóm; 14 nhóm bản Việt giống hệt hoặc chỉ khác dấu nháy / dấu lược `(…)` / chữ hoa đầu câu theo Pāli, 2 nhóm khác có chủ đích do khác người nói (2.4 so với 3.4: ngạ quỷ nữ trả lời so với người hỏi; 7.2 so với 12.2: lời nhờ trực tiếp “ngài hãy nói với mẹ của con” so với bản thuật lại “hãy nói với mẹ của cô ấy”, vì ở 12.2 người đang nói với bà mẹ là người đi nhắn).
  - Bất định — ghi lại, không thêm vào thân kinh:
    + Người nói: Pāli không ghi người nói ở các kệ (1 và 3 là người đi đường hỏi, 2, 4 đến 9 là ngạ quỷ nữ đáp, 10 là phần kể, 11 đến 14 là người ấy thuật lại cho bà mẹ). Canonical text không thêm nhãn người nói. “Ngài” cho người nghe là theo `bhadante`; không rõ người ấy là tu sĩ hay cư sĩ.
    + Dấu nháy là của Pāli và được giữ khớp từng khoá: kép mở ở 1.1, 2.1, 3.1, 4.1, 10.1, 11.1; đóng ở 1.4, 2.4, 3.4, 9.6, 10.1, 14.6; đơn mở ở 7.3, 12.3, đóng ở 7.6, 14.6. Nháy kép 11.1 mở không đóng ở 11.4 và 12.6 vì Pāli để lời kể chạy qua ranh giới khoá đến 14.6; nháy đơn 12.3 mở đóng ở 14.6, cũng vậy.
    + `Hatthiniṁ puraṁ` (7.1, 10.2): hiểu là tên thành `Hatthinī` (viết hoa “Hatthinī”, giữ nguyên Pāli). Bản Pāli viết thường nên cũng có thể đọc là danh từ chung; tầng chưa có tiền lệ (0 khoá). Không thêm chú giải vào thân kinh.
    + `Upphāsulike` (1.3): hiếm gặp, tầng chỉ có pv45:1.3 (dịch “mụn mủ phủ kín”, không có căn cứ). Tôi hiểu là “có xương sườn nhô ra”, dịch “xương sườn nhô ra”; nếu nghĩa chính xác khác thì chỉ chỗ này cần xem lại (semantic_fidelity 8.8).
    + `rittakā parivattati` (5.2) và `ātapo parivattati` (5.4): `parivattati` là “xoay, đổi chiều”; ở 5.2 là “trở nên trống cạn”, ở 5.4 để trung tính “xoay chuyển” vì Pāli không nói nắng xoay về phía ai. pv45:5.2, 5.4 (số nhiều) dịch “quay lưng” ở cả hai chỗ, là cách hiểu khác, chưa có căn cứ để xác lập.
    + `aññañca pāpakaṁ tato` (6.4): hiểu là “và còn điều xấu ác khác, ngoài điều ấy”, với `arahāmi` ở 6.3 làm động từ chung cho cả hai tân ngữ; không chắc `tato` mang nghĩa so sánh “hơn thế nữa” hay chỉ “ngoài điều ấy”, nên chọn cách trung tính.
    + `Tato me dānaṁ dadatu` (9.1, 14.1): chủ ngữ của `dadatu` không nói; hiểu là người mẹ (ngôi ba, `me mātā` ở 9.3), và dịch “hãy để bà bố thí vì con”. `tassā ca hotu jīvikā` (9.2): “tassā” hiểu là bà mẹ, `hotu` là “hãy là” nên “hãy là sinh kế của bà”; chủ ngữ ngầm là số tiền ở 8.3. Cách đọc này cũng khớp 15.4 `tassā cāsi sujīvikā` (bà mẹ có sinh kế tốt đẹp).
    + `viciniṁ aḍḍhamāsakaṁ` (4.2): dịch sát “đã đi tìm nửa đồng māsaka”; Pāli chỉ nói tìm, không nói tìm để làm gì. Cách đọc này có thể là ý nói bà chỉ lo nhặt nhạnh trong khi bến nước bố thí rộng mở; bản Việt không thêm điều đó.
    + `Sā maṁ tattha samādapesi, (…)` (12.1): `(…)` là dấu lược của chính tầng Pāli ghim (có đúng ở 12.1 và 14.4, đã kiểm trên 71/71 khoá), giữ nguyên ở hai khoá đó. Phần bị lược không có trong Pāli ghim nên không bổ sung.
    + `…pe…` và `…` trần: Pāli không có (0/71), nên bản Việt không có dấu lược nào ngoài hai khoá `(…)`.
    Vì các chỗ trên và thiếu bản English độc lập, `ambiguity_integrity` 8.6.
  - Kiểm tra: 71/71 khoá đúng tập và thứ tự Pāli; NFC, không khoá rỗng, không khoảng trắng thừa; nháy kép “ ” và đơn ‘ ’ khớp Pāli từng khoá (0 lệch trên 71 khoá; 11 khoá có nháy kép, 4 khoá có nháy đơn); `(…)` khớp Pāli 2/2 (12.1, 14.4); không Pāli lọt vào thân bản dịch ngoài tên riêng và thuật ngữ giữ nguyên (Petavatthu, Cūḷavagga, Seriṇī, Hatthinī, māsaka, Yama). Đã đọc đối chiếu từng cặp Pāli↔Việt cả 71 khoá.
  - technical_integrity 9.6: cổng kỹ thuật do người điều phối chạy — npm run validate; npm test; npm run check; npm run build.
