notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Không khoá nào có …pe…; ba cặp nháy kép ở 2.1, 2.2, 2.3 cân trên cả bài.

  Pāli trùng nguyên văn — cặp bắt buộc phải dùng lại nguyên văn có sẵn: 2.1 Tasmā rakkhitacittassa, sammāsaṅkappagocaro ti gāthā trùng với ne27:2.1 và ne32:2.1 (hai bài nằm trong bảng TIEN_LE_PHAI.md) và còn trùng với ne23, ne24, ne25, ne30, ne34. Đã đếm được 9 bài Netti trùng chuỗi này, tất cả đều đã có trong tầng với cùng một cách dịch, nên 2.1 dùng lại nguyên văn cũ: Do vậy, với người có tâm được phòng hộ, chánh tư duy là cảnh giới, đó là bài kệ. 2.2 lặp lại chính vế kệ không có ti gāthā thì lặp lại nguyên văn ấy.

  Tiêu đề và khung theo đúng họ Netti đã có: Netti, Phần Giải Thích (11), Nhóm + số, Nhóm Phương Thức + tên; Tattha katamo… → Ở đây, nhóm phương thức… là gì?; Niyutto … hārasampāto → Đã vận dụng nhóm phương thức…. 0 tiền lệ, đặt mới: otaraṇa → vượt bậc; otaraṇā → là vượt bậc so với; phương diện có 156 tiền lệ nhưng ở đây otaraṇa là so sánh theo bậc nên dùng vượt bậc cho rõ.

  0 tiền lệ, đặt mới: vijjā → minh theo đúng cặp đối xứng mà glossary ghi (vijjā = minh, avijjā = vô minh); paṭiccasamuppādena → theo duyên sinh khởi; bhavaṅga → các cõi hiện hữu (cõi có 1511 tiền lệ); āyatana → xứ, phân biệt rõ với indriya là căn, theo đúng cách phân biệt đã có ở dn14:2.18 với sáu xứ; purekkhāra → bảo hộ phía trước, ghép với bảo hộ có 161 tiền lệ. Lưu ý phải báo: ne34:0.4 dịch Parikkhārahārasampāta thành Nhóm Phương Thức Trợ Duyên, mà parikkhāra là trang bị chuẩn bị chứ không phải trợ duyên; đó là tệp lát khác nên không sửa.

  Giữ nguyên dãy so sánh của bài vì đó là cả nội dung: vượt bậc so với các căn, rồi các uẩn, rồi các giới, rồi các xứ — bốn vế, không lược vế nào.

