notes: |-
  Đã đọc HẾT p84.txt (912 dòng, cả 6 bài của lát) trước khi viết chữ nào. Bài này
  50 khoá, và ĐẶC BIỆT: theo đúng công thức `src/lib/canon/reference.ts` với
  `source/layers.yaml` (`substantivePaliMinChars: 40`, `excludeReferenceBlock: true`),
  substantive = 0, vì câu kệ dài nhất của cả bài chỉ 37 ký tự sau nén (dài nhất là
  `:12.1`). Công thức quy định `substantiveSegments === 0 ? 1 : …`, nên coverage
  báo 1.0000 — DÙ VẬY bài này vẫn không có tầng Anh đã ghim (đã kiểm
  `source/upstream-manifest.json`: `kn/pv/` không có tệp nào trong `english-sujato`,
  0 tệp cho uid này) và tầng `vietnamese-current` cũng vắng (chỉ có 26 tệp Pháp Cú).
  Coverage bằng 1.0000 ở đây là HỆ QUẢ CÔNG THỨC trên câu kệ, không phải tầng tham
  khảo tồn tại; không để scorecard ám chỉ rằng đã đối chiếu được. Đây là lý do
  `draft`.

  TIÊU ĐỀ — ĐA SỐ ĐO ĐƯỢC, CÓ SỐ ĐẾM. `:0.1` `Petavatthu`: 24/24 bài `pv*` giữ nguyên
  Pāli ⇒ giữ. `:0.2` `Cūḷavagga`: 5/5 (pv26–pv34) giữ nguyên Pāli ⇒ giữ (đối lập:
  `Uragavagga` đã dịch thành `Phẩm Rắn` 7 lần và `Mahāvagga` thành `Đại Phẩm` 10 lần —
  mỗi phẩm có cách riêng, nên theo đúng phẩm của mình). `:0.3` đi theo khuôn đã có
  của chính `pv`: pv32:0.3 `7. Migaluddakapetavatthu` → `7. Chuyện Ngạ Quỷ Bắn Hươu`.

  BÀI NÀY GẦN NHƯ TRÙNG pv32 — VÀ ĐÓ LÀ LÝ DO CHÍNH CỦA CHẤT LƯỢNG CAO Ở ĐÂY. Đo
  bằng script (so từng khoá sau khi cắt khoảng trắng): 31/50 khoá trùng NGUYÊN VĂN
  Pāli với pv32 — cụ thể là 4.1–4.3, 5.1–5.2, 5.5–5.6 và 6.1–11.4. Tôi dùng lại
  NGUYÊN VĂN cách dịch Việt của pv32 cho đúng các khoá ấy, để hai bài không tự mâu
  thuẫn nhau (đợt trước đã có 87 khoá cùng Pāli bị dịch theo hai cách vì agent không
  được báo là dùng chung công thức). Chỉ 13 khoá phải dịch mới: `:0.1–0.3`, 1.1–3.4,
  4.4, 5.3, 5.4, 12.1.

  LỖI CỦA BẢN ĐÃ CÓ, ĐÃ SỬA Ở ĐÂY (KHÔNG SAO CHÉP). `pv32:10.4` kết thúc bằng `”."`
  — có DẤU CHẤM THỪA sau dấu nháy kép, trong khi Pāli là `…asaṅkhatan”ti.` Khoa
  `pv33:11.4` tôi viết `”ti.` đúng theo Pāli, không chép lỗi. Đồng thời `:11.4` còn là
  khoá đóng nháy kép cho cả bài (`:4.1` mở), nên dấu thừa ở bản cũ cũng làm lệch cân
  nháy kép.

  NHÁY KÉP: Pāli `“`=2 `”`=2, `‘`=2 `’`=2; bản Việt cân đúng. `:1.1` mở `“` thì
  `:3.4` đóng; `:4.1` mở thì `:11.4` đóng; `:6.1` mở `‘` thì `:6.4` đóng; `:8.3` mở
  `‘` thì `:8.4` đóng. Không có dấu lược nào trong bài (đếm bằng `lược()` = 0).

  DÙNG LẠI NGUYÊN VĂN NGOÀI pv32. `Tato ratyā vivasāne` trùng nguyên văn
  thag8.3:8.1 và snp3.11:32.1 (`Rồi khi đêm chấm dứt,`) ⇒ dùng lại. `sūriyuggamanaṁ
  pati` trùng nguyên văn thag8.3:8.2 (`khi mặt trời sắp mọc;`) ⇒ dùng lại.
  `Kiṁ nu kāyena vācāya` trùng nguyên văn pv34:4.1 (`Điều gì ngươi đã làm bằng thân,
  bằng lời,`) ⇒ dùng lại. `Kissa kammavipākena` trùng nguyên văn pv43:3.3, pv22:6.3,
  pv7:5.3, pv45:3.3 (`Do quả báo của nghiệp nào`) ⇒ dùng lại. `Pañcaṅgikena turiyena`
  trùng nguyên văn thig6.3:1.3 (`Với dàn nhạc ngũ âm tấu khúc,`) ⇒ dùng lại.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `susānasmiṁ` → `nghĩa địa` (thag6.4:1.3, snp1.11:8.3,
  thag5.1:1.3 đều `bị quăng bỏ nơi nghĩa địa`); `vivasāne` → `khi đêm chấm dứt`;
  `aṭṭhamo` → `thứ tám` (29 khoá); `dutiya` → `Lần Thứ Hai` (287 khoá có `dutiya`,
  trong đó `vv14:0.4` đã dùng `… Thứ Hai` cho `dutiya` trong tiêu đề);
  `gotamasāvako` → `môn đồ của Đức Gotama` (`Gotama` đã có 127 lần trong tầng).

  BẤT ĐỊNH ĐÃ GHI. (1) `:1.1–1.2` `Kūṭāgāre ca pāsāde, / pallaṅke gonakatthate` —
  0 tiền lệ cho `kūṭāgāra` và `gonaka`; tôi dịch “nhà có mái” và “nệm trải da bò”
  theo nghĩa thường dùng, không nêu gì thêm. (2) `:4.4` `luddo cāsimasaññato` — 0
  tiền lệ; `cāsimā` là nhát gan, tôi dịch “ra vẻ nhát gan”, đối lập với pv32
  `lohitapāṇi dāruṇo` (“tay dính máu, hung dữ”) ở cùng vị trí. (3) `:5.3`
  `kulupako` — 0 tiền lệ; đọc là người cùng tộc, tôi dịch “vị tỳ-kheo cùng tộc”.

  `technical_integrity` đặt 9.6 vì không ai rà lại bằng con người.