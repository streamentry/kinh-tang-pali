notes: |-
  Đã đọc HẾT p84.txt (912 dòng, cả 6 bài của lát) trước khi viết chữ nào. Bài này
  50 khoá, và ĐẶC BIỆT: theo đúng công thức `src/lib/canon/reference.ts` với
  `source/layers.yaml` (`substantivePaliMinChars: 40`, `excludeReferenceBlock: true`),
  substantive = 0, vì câu kệ dài nhất của cả bài chỉ 37 ký tự sau nén (dài nhất là
  `:12.1`). Công thức quy định `substantiveSegments === 0 ? 1 : …`, nên coverage
  báo 1.0000 — DÙ VẬY bài này vẫn không có tầng Anh đã ghim (đã kiểm
  `source/upstream-manifest.json`: `kn/pv/` không có tệp nào trong `english-sujato`,
  0 tệp cho uid này) và tầng `vietnamese-current` cũng vắng (chỉ có 26 tệp Pháp Cú).
  Coverage bằng 1.0000 ở đây là HỆ QUẢ CÔNG THỨC trên câu kệ, không phải tầng tham
  khảo tồn tại; không để scorecard ám chỉ rằng đã đối chiếu được. Đây là lý do
  `draft`.

  TIÊU ĐỀ — ĐA SỐ ĐO ĐƯỢC, CÓ SỐ ĐẾM. `:0.1` `Petavatthu`: 24/24 bài `pv*` giữ nguyên
  Pāli ⇒ giữ. `:0.2` `Cūḷavagga`: 5/5 (pv26–pv34) giữ nguyên Pāli ⇒ giữ (đối lập:
  `Uragavagga` đã dịch thành `Phẩm Rắn` 7 lần và `Mahāvagga` thành `Đại Phẩm` 10 lần —
  mỗi phẩm có cách riêng, nên theo đúng phẩm của mình). `:0.3` đi theo khuôn đã có
  của chính `pv`: pv32:0.3 `7. Migaluddakapetavatthu` → `7. Chuyện Ngạ Quỷ Bắn Hươu`.

  BÀI NÀY GẦN NHƯ TRÙNG pv32 — VÀ ĐÓ LÀ LÝ DO CHÍNH CỦA CHẤT LƯỢNG CAO Ở ĐÂY. Đo
  bằng script (so từng khoá sau khi cắt khoảng trắng): 31/50 khoá trùng NGUYÊN VĂN
  Pāli với pv32 — cụ thể là 4.1–4.3, 5.1–5.2, 5.5–5.6 và 6.1–11.4. Tôi dùng lại
  NGUYÊN VĂN cách dịch Việt của pv32 cho đúng các khoá ấy, để hai bài không tự mâu
  thuẫn nhau (đợt trước đã có 87 khoá cùng Pāli bị dịch theo hai cách vì agent không
  được báo là dùng chung công thức). Chỉ 13 khoá phải dịch mới: `:0.1–0.3`, 1.1–3.4,
  4.4, 5.3, 5.4, 12.1.

  LỖI CỦA BẢN ĐÃ CÓ, ĐÃ SỬA Ở ĐÂY (KHÔNG SAO CHÉP). `pv32:10.4` kết thúc bằng `”."`
  — có DẤU CHẤM THỪA sau dấu nháy kép, trong khi Pāli là `…asaṅkhatan”ti.` Khoa
  `pv33:11.4` tôi viết `”ti.` đúng theo Pāli, không chép lỗi. Đồng thời `:11.4` còn là
  khoá đóng nháy kép cho cả bài (`:4.1` mở), nên dấu thừa ở bản cũ cũng làm lệch cân
  nháy kép.

  NHÁY KÉP: Pāli `“`=2 `”`=2, `‘`=2 `’`=2; bản Việt cân đúng. `:1.1` mở `“` thì
  `:3.4` đóng; `:4.1` mở thì `:11.4` đóng; `:6.1` mở `‘` thì `:6.4` đóng; `:8.3` mở
  `‘` thì `:8.4` đóng. Không có dấu lược nào trong bài (đếm bằng `lược()` = 0).

  DÙNG LẠI NGUYÊN VĂN NGOÀI pv32. `Tato ratyā vivasāne` trùng nguyên văn
  thag8.3:8.1 và snp3.11:32.1 (`Rồi khi đêm chấm dứt,`) ⇒ dùng lại. `sūriyuggamanaṁ
  pati` trùng nguyên văn thag8.3:8.2 (`khi mặt trời sắp mọc;`) ⇒ dùng lại.
  `Kiṁ nu kāyena vācāya` trùng nguyên văn pv34:4.1 (`Điều gì ngươi đã làm bằng thân,
  bằng lời,`) ⇒ dùng lại. `Kissa kammavipākena` trùng nguyên văn pv43:3.3, pv22:6.3,
  pv7:5.3, pv45:3.3 (`Do quả báo của nghiệp nào`) ⇒ dùng lại. `Pañcaṅgikena turiyena`
  trùng nguyên văn thig6.3:1.3 (`Với dàn nhạc ngũ âm tấu khúc,`) ⇒ dùng lại.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `susānasmiṁ` → `nghĩa địa` (thag6.4:1.3, snp1.11:8.3,
  thag5.1:1.3 đều `bị quăng bỏ nơi nghĩa địa`); `vivasāne` → `khi đêm chấm dứt`;
  `aṭṭhamo` → `thứ tám` (29 khoá); `dutiya` → `Lần Thứ Hai` (287 khoá có `dutiya`,
  trong đó `vv14:0.4` đã dùng `… Thứ Hai` cho `dutiya` trong tiêu đề);
  `gotamasāvako` → `môn đồ của Đức Gotama` (`Gotama` đã có 127 lần trong tầng).

  BẤT ĐỊNH ĐÃ GHI. (1) `:1.1–1.2` `Kūṭāgāre ca pāsāde, / pallaṅke gonakatthate` —
  0 tiền lệ cho `kūṭāgāra` và `gonaka`; tôi dịch “nhà có mái” và “nệm trải da bò”
  theo nghĩa thường dùng, không nêu gì thêm. (2) `:4.4` `luddo cāsimasaññato` — 0
  tiền lệ; `cāsimā` là nhát gan, tôi dịch “ra vẻ nhát gan”, đối lập với pv32
  `lohitapāṇi dāruṇo` (“tay dính máu, hung dữ”) ở cùng vị trí. (3) `:5.3`
  `kulupako` — 0 tiền lệ; đọc là người cùng tộc, tôi dịch “vị tỳ-kheo cùng tộc”.

  `technical_integrity` đặt 9.6 vì không ai rà lại bằng con người.

  Kiểm toán độc lập 2026-10-11 (THAY THẾ các mục cũ nói bài này "gần như trùng pv32, dùng lại nguyên văn pv32 nên chất lượng cao", mục "THUẬT NGỮ ĐÃ TRA" về `susānasmiṁ`/`gotamasāvako`, mục "BẤT ĐỊNH ĐÃ GHI" cũ, và điểm 9.11): đọc đối kháng từng khoá Pāli↔Việt cho thấy việc dùng lại bản pv32 đã chép sang cả những lỗi nghĩa của pv32, nên tiền lệ nội bộ đó KHÔNG đáng tin. Đã viết lại 43/50 khoá; ước tính khoảng 24 khoá mang lỗi nghĩa thật ở bản cũ.

  Lỗi nghĩa thật đã sửa. (a) Đảo chủ thể/thì: `7.3` `nākāsiṁ` là "tôi đã không làm" (bản cũ "Ngươi sẽ không làm"); `9.1–9.4`, `10.2–10.4` là lời ngạ quỷ kể về chính mình (bản cũ đổi chủ ngữ sang "ngươi", đổi sang tương lai "sẽ ngủ yên", "sẽ được", "sẽ phóng tới"). (b) Từ vựng bịa/sai: `paricāremi` (9.3) là vui hưởng, không phải "ngủ yên lành" (đối chiếu mn82:40.8 "vui hưởng"); `rattiṁ amānusiṁ` (10.2) không phải "một đêm không có bọn đàn ông" mà là đêm không thuộc loài người — `amānusa` ở nơi khác dịch "phi nhân"/"vượt khỏi (mắt) người", không có nghĩa "không có đàn ông"; `ramasi` (1.4) là vui thú, không phải "say trong giấc ngủ"; `nivāresi` (5.6) là ngăn cản, không phải "giữ ta an toàn"; `luddo cāsimasaññato` (4.4) = `luddo ca asiṁ asaññato`, "hung bạo, không tự chế" (bản cũ "ra vẻ nhát gan" là đọc sai `asiṁ` thành `cāsima`; `asaññato` 23 khoá ở tầng đều là "không tự chế"); `kulupako` (5.3) là vị tỳ-kheo thường lui tới gia đình người ấy, không phải "cùng tộc"; `bhūrisumedhaso` (8.1) là bậc trí tuệ rộng lớn, sáng suốt (bản cũ "tinh tấn tuệ biết" bịa); `saṁyame nivesayi` (8.2) là đặt vào sự tự chế. (c) Tên riêng bịa từ danh từ chung: `Migaluddo` (4.3) là "thợ săn hươu", không phải "người tên Bắn Hươu"; `giribbaje`/`rājagahe` (4.1–4.2) là địa danh Rājagaha, Giribbaja (bản cũ "khu vườn vua... ngọn núi thú thỉnh"); tiêu đề `Migaluddaka` đổi "Bắn Hươu" → "Thợ Săn Hươu" (đổi `translationTitle` cho khớp; `pv32:0.3` và `pv32:11.1` còn dùng "Bắn Hươu" — báo, không sửa ở đây). (d) Hô cách/người nói: `mā tāta duggatiṁ agā` (6.2) là lời vị tỳ-kheo nói với người thợ săn — "này con thân mến" (precedent dn21 `tāta` = "thân mến"), không phải "hỡi cha"; trong lời vị tỳ-kheo dùng "con", ngạ quỷ xưng "tôi" (bản cũ "ta", gọi người nghe "ngươi" lẫn lộn với lời ngạ quỷ). (e) `kūṭāgāre`/`pallaṅke gonakatthate` (1.1–1.2): "ngôi nhà mái nhọn" (mn77:9.11), "ghế dài", "tấm phủ len lông dài" (dn1:1.15.2, dn17); bản cũ "nhà có mái... nệm trải da bò" (gonaka không phải da bò). (f) `duggatiṁ` (6.2) = "cõi khổ" (32 khoá) thay "đọa xứ" (585 khoá, thường dành cho cụm `apāyaṁ duggatiṁ vinipātaṁ`); `sugata` = "bậc Thiện Thệ" (420 khoá) thay "Thiện Thế" (5); `gotamasāvako` = "đệ tử của Gotama" (13 khoá, 0 khoá "Đức Gotama"); `pañcaṅgikena turiyena` = "dàn nhạc năm loại" (thag18.1:21.1; bản cũ "ngũ âm tấu khúc" thêm "tấu khúc"). (g) `11.3–11.4`: bản cũ "với ngươi, đó là bất tử trọn vẹn... phía bên kia bất tử" đảo nghĩa: Pāli là "tôi nghĩ họ chứng trọn vẹn bất tử, đạt đến cảnh giới vô vi".

  Lượt cải thiện 2026-10-11 (điểm tiêu chí đổi, vì sao): `semantic_fidelity` 9.3 → 8.8 (bản cũ bị chấm cao là SAI: có ~24 khoá sai nghĩa; sau sửa, bản mới đã đúng nghĩa nhưng còn hai bất định thật bên dưới); `grammar_logic` 9.2 → 9.0 (nhiều khoá ghép liên khoá tự nhiên theo cú pháp Pāli — `8.1` kết ở "lại" nối sang `8.2`, `7.1–7.4` một câu dài); `segment_alignment` 10.0 → 9.6 vì cùng lý do; `terminology` 9.2 → 9.0 (nhiều thuật ngữ đã sửa theo số đếm nhưng `amānusiṁ` còn là cách dịch tạm); `vietnamese_clarity` 9.2 → 8.6 (vài chỗ giữ sát Pāli nên hơi cứng: `7.2`, `8.1`); `han_viet_balance` 9.3 → 9.2; `ambiguity_integrity` 8.8 → 8.6. `source_provenance` 9.5, `triangulation` 7.0 (không có tầng Anh độc lập), `technical_integrity` 9.6 giữ nguyên. `final_score` 9.11 → 8.89 (trung bình số học thô của 10 điểm = 88.9/10).

  Bất định còn lại, KHÔNG phân xử được, ghi ở đây chứ không thêm vào thân kinh. (1) `10.3` `Divā paṭihatāva kukkurā`: `paṭihata` còn nghĩa "bị đánh/bị kích động/giận dữ" tuỳ ngữ cảnh; toàn tầng Pāli đã ghim chỉ có hai nơi dùng dạng này (cả hai là pv32/pv33, 0 tiền lệ ngoài), không có tầng tham khảo nào nên không xác minh được; dịch "những con chó như bị kích động" là cách đọc tạm, có thể là "đàn chó như bị xua đuổi/giận dữ". (2) `10.2` `rattiṁ amānusiṁ`: dịch sát "đêm không phải của loài người"; Pāli không nói thẳng là cảnh trời, nên không thêm nghĩa "thiên giới/thần diệu". (3) `5.1–5.6`: `Tassa me sahāyo…` và `Sopi maṁ anukampanto`: đọc `Sopi` là vị tỳ-kheo (chủ ngữ cận nhất, và lời `‘Mākāsi…’` tiếp theo do vị này nói, `8.1 So…bhūrisumedhaso` cùng chủ ngữ); cách đọc `Sopi` = người bạn cư sĩ cũng khả dĩ về cú pháp nhưng kém hợp ngữ cảnh. (4) `6.4` `asaṁyamā` dịch "sự thiếu tự chế" (ablative thứ hai sau `pāṇavadhā`), cách đọc "những việc không phòng hộ" của bản cũ là thêm nghĩa nên bỏ. (5) Người hỏi ở `1.1–3.4` không được Pāli nêu tên nên dùng "ngươi" cho ngạ quỷ theo tiền lệ nhóm Petavatthu (pv31:1.1 "Ngươi trần truồng…"), không gán danh tính người hỏi.

  Ghi chú đối chiếu: số khoá giữ nguyên 7/50 (`0.1`, `0.2`, `2.1`, `2.2`, `2.3`, `3.3`, `10.1`): đều có tiền lệ đúng nghĩa (`thag8.3:8.1–8.2`, `snp1.11:8.3`, `pv22:6.3` "Do quả báo của nghiệp nào"). Không có cặp Pāli trùng nguyên văn trong chính bài. Số: không có số đếm Pāli trong bài. Nháy `“”` và `‘’` khớp Pāli từng khoá (50/50), không có dấu lược. `technical_integrity` giữ 9.6: chưa chạy lại bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build`.
