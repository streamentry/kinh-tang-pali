notes: |-
  Dịch trực tiếp từ Pāli root (snapshot SuttaCentral/Bilara đã ghim). Bài: Paññattipañha, câu hỏi thứ nhất của Mahāvagga (Milindapañha): vua Milinda hỏi tên Tôn giả Nāgasena; Tôn giả đáp rằng `Nāgasena` chỉ là cách gọi, không tìm thấy cá nhân nào; vua phản biện (ai thọ dụng, ai giữ giới, ai sát sinh, ai có thầy); Tôn giả hỏi lại vua về cỗ xe đã đi đến bằng cách tách từng bộ phận, rồi đối chiếu với năm uẩn và dẫn kệ của tỳ-kheo-ni Vajirā. 108/108 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập khoá Pāli.

  TẦNG THAM KHẢO (đo, không đoán): bản Sujato không có cho bài này. Thư mục `kn/` của edition `translation/en/sujato` tại commit đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud (755 tệp), không có `mil`; đây là `not-published-upstream`, không phải `not-synced`. Tầng `vietnamese-current` cũng vắng (bilara tại commit ghim chỉ phân phối Pháp Cú). Lớp `english-project` của dự án chưa có tệp cho bài này (cả bản dịch lẫn metadata). Coverage English theo công thức của `source/layers.yaml` (Pāli có nội dung từ 40 ký tự sau nén khoảng trắng, bỏ khối :0.x): 0/33 = 0%, dưới ngưỡng 0,80. Ba tầng tham khảo đều vắng nên bài chỉ được đối chiếu với Pāli root, bài giữ `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7,5 (không quá 8,0). Đây là giới hạn của snapshot, không phải lỗi dịch.

  TIỀN LỆ ĐÃ ĐO: (a) Kệ Vajirā ở 8.1-8.3 (`Yathā hi aṅgasambhārā, hoti saddo ratho iti; evaṁ khandhesu santesu`) dùng lại nguyên lời dịch sn5.10:5.1-5.3 (`Cũng như nhờ tụ họp các bộ phận` / `mà có tiếng gọi là cỗ xe` / `cũng vậy, khi các uẩn hiện hữu`); 8.4 `hoti satto ti sammuti` có thêm nháy kép quanh `satto` nên không trùng byte với sn5.10:5.4, dịch `có sự quy ước gọi là “chúng sinh”` (sn5.10 dùng `chúng sanh`; toàn tầng `chúng sinh` 983 so với `chúng sanh` 81; sammuti -> quy ước 8 so với 1 khác). (b) `bhante` -> thưa tôn giả: toàn tầng mil `thưa tôn giả` 324, `bạch tôn giả` 54, `thưa Đại đức` 35, `bạch ngài` 90; chọn `thưa tôn giả Nāgasena` như mil3.1.7 và đa số tầng. (c) `mahārāja` -> này Đại vương: toàn tầng mil `này Đại vương` 679, `tâu đại vương` 386, `tâu Đại vương` 81; chọn `này Đại vương` như mil3.1.2 và mil3.1.7 (mil3.1.3 dùng `tâu đại vương`). (d) `Na hi, bhante` -> Không phải vậy, thưa tôn giả: dùng lại nguyên văn của đa số (45/67 khoá Pāli trùng ở các bài mil khác); 11 khoá của bài. (e) `Na hi, mahārājā` -> Không phải vậy, này Đại vương: 12 khoá Pāli trùng ở bài khác, 7 khoá dịch `Không có, này Đại vương` nhưng cả 7 là câu hỏi có/không về sự tồn tại hay hành động (mil3.5.1:1.3 ‘ông đã từng thấy Đức Phật chưa?’); ở đây câu hỏi là câu hỏi đồng nhất (`có phải tóc là Nāgasena?`), nên chọn `Không phải vậy` như mil6.3.4:3.3 và mil5.1.5:2.3 (đã đọc vế trước từng nơi). (f) `Atha kho āyasmā nāgaseno milindaṁ rājānaṁ etadavoca—` (4.1) dùng lại nguyên văn mil3.1.2:2.2. (g) `sabrahmacārī` -> đồng phạm hạnh (291 trên 389 khoá có từ này). (h) `puggala` -> cá nhân (542 so với `người` 964 và `hạng người` 310 ở toàn tầng; chọn `cá nhân` vì đây là thuật ngữ trung tâm của bài, theo glossary `ekapuggala` = một cá nhân duy nhất). (i) `sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā ekamantaṁ nisīdi` -> trao đổi những lời thân thiện và đáng ghi nhớ rồi ngồi xuống một bên (dn4:9.2; `ngồi xuống một bên` 250 so với `ngồi một bên` 47). (j) `Evaṁ vutte` -> Khi được nói vậy (69 so với 37 `Khi được nói như vậy`). (k) Ba mươi hai thể trược (3.11-3.40, 7.2): tóc, lông, móng, răng, da, thịt, gân, xương, tủy xương, thận, tim, gan, cơ hoành, lá lách, phổi, ruột, màng treo ruột, thức ăn chưa tiêu, phân, mật, đờm, mủ, máu, mồ hôi, mỡ, nước mắt, chất nhờn, nước bọt, nước mũi, dịch khớp, nước tiểu, não; đo trên 15 khoá danh sách của tầng: kilomaka `cơ hoành` 5 (ngang `màng` 5), antaguṇa `màng treo ruột` 7, udariya `thức ăn chưa tiêu` 12, semha `đờm` 10, vasā `chất nhờn` 6, kheḷa `nước bọt` 10, lasikā `dịch khớp` 10. (l) `cīvarapiṇḍapātasenāsanagilānappaccayabhesajjaparikkhāra` -> y phục, thức ăn khất thực, chỗ ở, thuốc men và vật dụng cho người bệnh, đúng công thức mn6:5.1, mn21:10.3. (m) `kāmesumicchācāra` -> tà dâm (trên 226 khoá Pāli có từ này: `tà dâm` 126, `tà hạnh trong các dục` 61, `tà hạnh trong dục` 41, `tà hạnh` 4), vì ở 3.5 nó đứng trong danh sách năm giới cùng sát sinh, lấy của không cho, nói dối, uống rượu; `kāyaviññāṇa` -> thức thân (dn33, mn9; công thức sáu thức); `sacchikaroti` -> chứng ngộ (571 trên 614 khoá), `adinnādāna` -> lấy của không cho (82), `majjapāna` -> uống rượu (55 so với `rượu` 220 trong danh sách giới), `pāṇātipāta` -> sát sinh (534). (n) `sukatadukkaṭānaṁ kammānaṁ phalaṁ vipāko`: tầng dịch `các nghiệp thiện và bất thiện` 38, `nghiệp thiện và nghiệp ác` 18, `các nghiệp lành dữ` 7; ở 3.5 cùng một khoá có thêm `kusalākusalānaṁ kammānaṁ` nên không dùng cùng hai chữ cho hai từ Pāli khác nhau: kusalākusala -> thiện và bất thiện, sukatadukkaṭa -> lành và dữ (đa số 38 để lại cho kusalākusala). (o) `ācariya` -> thầy (301), `upajjhāya` -> thầy tế độ (15), `upasampadā` -> thọ cụ túc giới (74). (p) `khattiya` -> Sát-đế-lợi (487 trên 547). (q) `Yonaka` giữ nguyên, theo mn93:6.5-6.6 (`xứ Yonaka`, 2 khoá); không đổi thành Hy Lạp vì Pāli không nói. (r) Tên phẩm: 0.2 Mahāvagga -> Đại Phẩm (15/15 khoá Pāli trùng); 0.1 Milindapañha giữ Pāli (226 so với 8 `Mi-lan-đà Vấn Đạo` và 3 `Mi-tiên Vấn Đáp`). Khung tiêu đề `Câu hỏi về …, thứ nhất.` theo mil3.2.1 và các bài cùng phẩm.

  PĀLI TRÙNG NGUYÊN VĂN: trong chính bài có 3 nhóm khoá Pāli y hệt (2.1/3.4/6.1; 3.8/3.10/3.41/3.43/3.45/3.47/3.49/3.51/3.53/3.55/3.58; 4.5/4.7/4.9/4.11/4.13/4.15/4.17/4.19/4.21/4.23/4.26), 113 cặp, bản Việt giống hệt nhau ở cả 113 cặp. Với phần còn lại của tầng mil: 25 khoá của bài có Pāli trùng khoá của bài khác, 1181 cặp; 419 cặp bản Việt khác, trong đó 23 khoá có ít nhất một cặp khác; khác biệt nằm ở công thức xưng hô và lời đáp (thưa tôn giả / bạch tôn giả / thưa Đại đức / tâu đại vương / này Đại vương / không có / không hề), nằm trong các lựa chọn (b)-(e) đã ghi, không phát hiện cặp nào khác nghĩa.

  SỐ PĀLI (tính lại, không chép): pañcasatā 5 × satā 100 = 500 -> năm trăm người Yonaka (3.2, 4.27, 5.1); asītisahassā 80 × sahassa 1000 = 80.000 -> tám mươi ngàn tỳ-kheo (3.2, 4.27), cùng thang ngàn như tầng (chaḷasītisahassāni 86 ngàn ở tha-ap474:11.1); pañcānantariya 5 -> năm nghiệp vô gián (3.5); paṭhamo 1 -> thứ nhất (10.1, và `1.` ở 0.3). Không có cụm số nào thuộc loại chưa phân xử được.

  DẤU LƯỢC: Pāli có 30 khoá mang `…` (3.11 và 3.39 và 7.2 là `…pe…`, 27 khoá 3.12-3.38 là `…` trần); bản Việt giữ đúng một `…` ở đủ 30 khoá, không mở rộng thành văn. Pāli không có `(…)` trần nào.

  BẤT ĐỊNH ghi lại:
    1. 4.4-4.22: các bộ phận của cỗ xe: `īsā` -> càng xe, `akkha` -> trục xe, `cakka` -> bánh xe, `rathapañjara` -> thùng xe, `rathadaṇḍaka` -> cán xe, `yuga` -> ách xe, `rasmi` -> dây cương, `patodalaṭṭhi` -> roi thúc. Tầng có dn16:2.16.1 (trục, bánh, ách) và dn4:26.12 (`cây roi điều khiển`); `īsā`, `rathapañjara`, `rathadaṇḍaka` có 0 tiền lệ trên tầng (0 khoá). Chưa xác minh độc lập: `rathadaṇḍaka` (cán xe; có thể là cột hay cán cờ của xe) và `rathapañjara` (thùng hay khung xe).
    2. 3.52 và 4.20: `rūpavedanāsaññāsaṅkhāraviññāṇaṁ` và `īsāakkhacakka…patodā` là hợp từ số ít đứng làm một vị ngữ; bản Việt thêm `gộp lại` để lộ ra rằng đó là một khối; Pāli không có từ riêng cho `gộp`. 3.54 và 4.22 `aññatra` -> ở ngoài.
    3. 9.1: `aticitrāni pañhapaṭibhānāni visajjitāni` dịch `những cách giải đáp vô cùng đặc sắc đã được đưa ra` (đọc `aticitrāni` là định ngữ của `pañhapaṭibhānāni`; mn56:15.2 dịch `vicitrāni pañhapaṭibhānāni` là `những cách giải đáp phong phú`). Lát mil3.1.2:2.6 dịch cùng đoạn Pāli (khoá không trùng byte, chỉ trùng phần đầu) là `Những lời giải đáp cho câu hỏi của tôi đã trọn vẹn, vượt xa sự đo lường`; hai cách khác nhau, chưa thống nhất; nên đọc lại cả hai cùng lúc.
    4. 5.1: `sādhukāraṁ datvā` dịch `tán thưởng`, không thêm chữ `lành thay` vì Pāli không nêu lời nói ở chỗ đó (tầng có 1 khoá `tán thán` cho `sādhukāra`).
    5. 3.5: `pañcānantariyakammaṁ` dịch `nghiệp thuộc năm nghiệp vô gián`: Pāli số ít `kammaṁ`; 0 tiền lệ trên tầng cho `anantariya` (0 khoá); `ko … karoti` dịch `ai tạo`. `carahi` -> vậy thì, `tasmā` -> vì thế.
    6. 3.5: `natthi tassāpi pāṇātipāto` dịch `người ấy cũng không có sự sát sinh` (không thêm chữ `tội`); `ācariya` ở đây là thầy nói chung, không phải chức vụ.
    7. 2.3 và 3.3: `na hettha` (= `na hi ettha`) dịch bỏ `hi`, câu nối bằng dấu chấm phẩy; cả hai khoá cùng Pāli `na hettha puggalo upalabbhatī` nên cùng lời dịch `ở đây không tìm thấy cá nhân nào`. `saṅkhā samaññā paññatti vohāro nāmamattaṁ` dịch `cách gọi, danh xưng, sự chế định, cách nói thông dụng, chỉ là cái tên` ở 2.3, 6.2, 7.2: `samaññā` -> danh xưng (31 so với `tên gọi` 28 ở tầng); `paññatti` -> sự chế định (0 tiền lệ, `paññāpana` thường là chỉ định); `vohāra` 0 tiền lệ.
    8. 6.2 và 7.2: `pavattati` dịch `đang được dùng` (ở mil3.1.2 là `vận động` vì chủ thể là bóng và số đếm); bài này chủ thể là một cách gọi nên chọn nghĩa `được dùng`; `paṭicca` -> nhờ vào (`nhờ` 33; `do duyên` 48 ở các công thức duyên khởi như mn148:6.3).
    9. 4.2: `khattiyasukhumālo` dịch `bậc Sát-đế-lợi yếu mềm` (sukhumāla = mềm yếu, được nuông chiều); `tassa te … pādenāgacchantassa` đọc như khẳng định chung ở thì hiện tại nên dịch bằng `khi … thì …`; `dukkhasahagataṁ` -> câu hữu với khổ (32 `câu hữu` ở sahagata).
    10. 3.2 và 4.27: `bhonto` dịch `các ngài`: đọc năm trăm Yonaka và tám mươi ngàn tỳ-kheo là những người được gọi, không phải chủ ngữ của `lắng nghe`. LỖI NGOÀI LÁT (báo, không sửa): mil3.8:2.1 có Pāli `Yonakā evamāhaṁsu` đang được dịch `Các người thị nữ nói`; `Yonakā` là người Yonaka (đúng như bài này), 1 khoá.
    11. 3.1 `evamāha` -> nói như sau (không thêm `rằng`), khác với `etadavoca` -> nói với … rằng; cả bài 4 khoá `etadavoca` + 1 khoá `etadavocuṁ` đều dịch `rằng`.

  KIỂM MÁY (không chạy cổng của kho vì không được phép trong lát này): khoá Việt = khoá Pāli, 108 = 108, thứ tự khớp; số dấu nháy kép “ ” và nháy đơn ‘ ’ khớp Pāli từng khoá, 108/108 khoá, 0 lệch; NFC đạt; không khoá rỗng; không Pāli nguyên văn lọt sang Việt ngoài tiêu đề `:0.1` (cố ý, theo 226 khoá của tầng); dấu lược `…` khớp Pāli từng khoá (30/30 khoá, 0 lệch); không có chữ số trong bản Việt ngoài `1.` ở tiêu đề. Còn phải chạy bốn lệnh sau và technical_integrity 9,6 là điểm tạm cho tới khi chúng đạt: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  SAU KHI GỠ BLOCKER: khi có bản Anh độc lập cho Milindapañha tại một commit ghim mới, đối chiếu lại các bất định 1, 3, 5, 7 và 9.
