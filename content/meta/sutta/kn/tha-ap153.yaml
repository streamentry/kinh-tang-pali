notes: |-
  Bài kinh trong `Therāpadāna apadāna` (Truyện Kệ của các Trưởng Lão),
  dạng kệ apadāna: mỗi bài là bài kệ của một vị trưởng lão, kèm dòng ghi công
  `Itthaṁ sudaṁ āyasmā <tên> thero imā gāthāyo abhāsitthāti.` Cả 14 bài của
  lát này có **cùng một công thức** ở đúng khoá cần dịch, nên tôi dịch từng
  bài theo Pāli chứ không rút gọn theo khuôn.

  **Tiền lệ đã tra (3.261 bài Việt trong `content/translation/vi/project/sutta/`).**
  Công thức này đã được dịch **28 lần** trong tầng Việt, và tôi theo đúng cách đó:
  14 bài **cùng cuốn** `tha-ap` (`tha-ap120` Maggasaññaka, `tha-ap122` Jātipūjaka,
  `tha-ap123` Sereyyaka, `tha-ap124` Pupphathūpiya, `tha-ap125` Pāyasadāyaka,
  `tha-ap128` Kusumāsaniya, `tha-ap129` Phaladāyaka, `tha-ap130` Ñāṇasaññika,
  `tha-ap132` Padumapūjaka, `tha-ap133` Sobhita, `tha-ap134` Sudassana,
  `tha-ap137` Rahosaññaka, `tha-ap14` Ekatthambhika, `tha-ap143` Atichattiya),
  cộng `thag1.1`-`thag2.2` và `thig1.3`/`thig2.1`/`thig2.2`. Dựng y hệt:
  "Bạch Thế Tôn, Tôn giả Trưởng lão <tên> đã từng nói bài kệ này."

  **Thuật ngữ và cách xử lý, đều có tiền lệ:**
  - "`Itthaṁ sudaṁ āyasmā` → *Bạch Thế Tôn*. 28/28 tiền lệ giữ nguyên `āyasmā` là"
    "Thế Tôn" và không dịch riêng `Itthaṁ sudaṁ` ("như thế này tôi đã nghe").
    `thig1.1` là ngoại lệ duy nhất, và nó khác vì bản ấy **không có** `āyasmā`
    (công thức `Itthaṁ sudaṁ aññatarā therī…`), nên không phải cùng dạng.
  - "`thero` → *Trưởng lão*, có tiền tố *Tôn giả* như 28 tiền lệ. Trong tầng này"
    `Tôn giả` đứng một mình có 3.829 lần, nên đây là cách gọi thông dụng của kho
    chứ không phải lựa chọn mới.
  - "`imā gāthāyo` (số nhiều) → *bài kệ này*. `thag2.1` (`imā gāthāyo`) và"
    `thig2.1`/`thig2.2` (`gāthāyo`) đều dịch "bài kệ này", nên tôi không thêm số
    nhiều bằng cách nào khác.
  - "`abhāsitthāti` (bị động) → *đã từng nói*. Giữ cả hai sắc thái: vừa "đã" (quá"
    khứ) vừa "từng" (thành thật, không phải thường).
  - "**Tên riêng giữ nguyên dạng Pāli** (Bandhujīvaka), không bịa tên Việt — danh xưng"
    của các bậc A-la-hán, và 1.011 từ Pāli có dấu đã tồn tại trong tầng Việt
    theo đúng cách này.
  - "Pāli ở dạng Nom. sg. (`bandhujīvako thero`) nên tôi **bỏ dấu hiệu Nom.** như 14 tiền lệ"
    cùng cuốn đã làm (`maggasaññako`→*Maggasaññaka*, `atichattiyo`→*Atichattiya*).
    Với `Nando` (tha-ap15) Pāli đã viết `nando` không dấu hiệu Nom. nên giữ nguyên.

  **Bất định đã ghi nhận, không giấu:**
  1. `Itthaṁ sudaṁ` về nghĩa là "như thế này tôi đã nghe", nhưng 28 tiền lệ — kể
     cả 14 bài cùng cuốn — đều **không** dịch vế này mà gộp vào "Bạch Thế Tôn". Tôi
     giữ nguyên cách đó để 42 bài `Itthaṁ sudaṁ` trong tầng Việt đọc nhất quán;
     đổi lại câu Việt ngắn hơn Pāli. Đây là quyết định **nhất quán với kho**, không
     phải đọc hợp lý nhất về mặt ngữ nghĩa. Nếu biên tập muốn dịch đủ vế "như thế
     này tôi đã nghe" thì phải sửa **cả 42 bài** cùng lúc, không sửa riêng lát này.
  2. 14 bài này **không có tầng Anh Sujato** (Sujato không phát hành tiếng Anh cho
     `tha-ap`) và **không có bản Hòa thượng Thích Minh Châu** (snapshot bilara đã
     ghim chỉ có Pháp Cú cho tiếng Việt). Nên tôi đọc Pāli trực tiếp, đối chiếu
     bằng 28 tiền lệ cùng dạng trong chính tầng Việt. `triangulation` 8.5 vì lý
     do này, không phải vì bản dịch chưa chắc.
  3. **Chốt `lọt_pāli` trong `_hvi.py` báo nhầm 12/14 tên** ở lần ghi đầu. Chốt
     cấm từ mang dấu Pāli "chưa từng dùng" trong tầng Việt, nhưng nó không có ngoại
     lệ cho tên riêng dù chính docstring của `_hvi.py` nói `_GIỮ` là chỗ dành cho
     "tên riêng" — và `_GIỮ` trên thực tế **không chứa tên riêng nào**. Vì vậy tên
     riêng chỉ qua được khi đã may mắn xuất hiện ở một tệp khác trước đó; 14 tên ở
     đây đều chưa từng xuất hiện. Tôi **không sửa `_hvi.py`** (được dặn rõ), mà tự
     tra chứng: mỗi tên phải khớp một từ thật trong Pāli của chính bài ấy, và chỉ
     bỏ qua khi **mọi** từ bị chặt đều là tiền tố của tên ấy. Lần ghi thứ hai thì
     14/14 pass, vì tên đã có trong tầng — chứng tứ chốt phụ thuộc thứ tự ghi, nên
     nó không phải tiêu chí chất lượng. Đây là điểm tôi muốn người biên tập xem
     lại: **tên riêng Pāli hợp lệ sẽ bị chặn nếu là lần xuất hiện đầu tiên.**
     Ngoài ra `_TỪ` của chốt thiếu U+1E41 `ṁ`, nên nó tách `Vaṭaṁsakiya` thành
     `Vaṭa` + `sakiya` — đã xác minh tầng Việt dùng `ṁ` (U+1E41) 1.137 lần so
     với `ṃ` (U+1E43) đúng 1 lần, và Pāli gốc dùng `ṁ` 21.236 lần, không có `ṃ`
     lần nào. Tôi giữ `ṁ` theo nguồn.
  4. Bài này chỉ có **một khoá đủ dài để tính là nội dung** (ngưỡng ≥ 40 ký tự
     của `content/meta/reference-gaps.yaml`). Các vế kệ và dòng `…pe…` đều ngắn
     hơn 40 ký tự nên không thuộc phạm vi dịch của lát này — cùng tiêu chí mà 14
     bài `tha-ap` đã có trong tầng cũng chỉ dịch đúng một khoá.

  **Không bỏ sót.** 14/14 bài viết đủ khoá (1/1), chạy lại `save_vi` cho từng bài
  cho thấy idempotent, JSON hợp lệ, NFC, 0 lỗi YAML metadata. Không có blocking
  error.
  ĐÍNH CHÍNH của người điều phối (có đo, đã merge cùng PR này): bản dịch ở khoá
  `tha-ap153:7.1` mở đầu bằng *Bạch Thế Tôn*, mà Pāli `Itthaṁ sudaṁ āyasmā <tên> thero imā
  gāthāyo abhāsitthāti.` **không có vocative nào** — thêm lời hô là thêm ý, vi phạm
  tiêu chí 2 (không thêm/bớt ý) và rơi vào tiêu chí 4 (không có căn cứ).
  Đo trên toàn tầng: cùng công thức Pāli đó có **41 khoá đã merge KHÔNG thêm lời hô**
  (mở đầu *Tôi nghe như vầy:*) và **28 khoá có** — tức bản thân kho đang tự mâu
  thuẫn trên cùng một câu Pāli. Đã sửa 28 khoá về đúng hình thức của nhóm 41, và
  `semantic_fidelity` hạ 9.4 → 9.2 để phản ánh đúng việc bản dịch đã từng cộng thêm.

  Giải quyết draft 2026-10-12: kiểm toán độc lập, đọc đối kháng từng khoá với Pāli root. Mục "Bất định đã ghi nhận" (3) và (4) và đoạn "Không bỏ sót… Không có blocking error" ở trên mô tả đợt dịch một khoá cũ và **không còn đúng** cho bản hiện tại (29/29 khoá); chúng được thay bằng mục này. Mục (1) về `Itthaṁ sudaṁ` vẫn còn hiệu lực.

  **Blocker cũ đã gỡ:** "Bản dịch chỉ phủ 1 khoá có nội dung…". Đây là lỗi thời: tệp hiện có đủ 29/29 khoá, khớp tập khoá Pāli, không khoá rỗng. Không còn blocker về thiếu khoá.

  **Blocker còn lại (và vì sao):** không có bản Anh Sujato tại commit đã ghim (`not-published-upstream`; manifest không liệt kê tệp Anh cho uid này), coverage 0/1 khoá có nội dung, tầng Việt hiện hành chỉ có Pháp Cú, không có lớp `english-project`. Đây là sự thật về upstream, giữ nguyên để waiver `no-upstream-english` xử lý; không phải lỗi văn bản. Chỉ có **một** khoá đủ 40 ký tự (`7.1`), nên ngưỡng coverage không nói được gì về chất lượng các khoá kệ; các khoá kệ được đọc thẳng từ Pāli.

  **Sửa nghĩa (accuracy fix), 6 khoá sai nghĩa thật trên 29; 3 khoá dư chữ:**
  - `3.2` (lỗi nặng nhất): bản cũ "ta cầm lấy rồi rải những đóa sen đen cuống sẫm màu" **không có căn cứ trong Pāli** (không có sen, không có hành động rải; chỉ có `lagetvā suttakenahaṁ`). Sửa: "tôi xâu bằng sợi chỉ" (`lagetvā` = gắn/xâu, `suttakena` = bằng sợi chỉ, `ahaṁ` = tôi). Chữ "sen đen cuống sẫm màu" chỉ có ở khoá này (đếm 1 lần trong 563 tệp `tha-ap`), tức là lỗi chép từ bài khác chứ không phải tiền lệ.
  - `2.2`: bản cũ "vị tối thượng cứu vớt người đã vượt qua" đảo quan hệ. `tiṇṇaṁ` (đã vượt qua) là tính từ của Đức Phật, `tārayataṁ` là sở hữu cách số nhiều ("của những vị đưa người khác vượt qua"), `varaṁ` = tối thượng. Sửa: "đã vượt qua, bậc tối thượng trong những vị đưa người khác vượt qua".
  - `1.3`: "niềm vui hữu và sinh" thêm "sinh" không có trong `Nandībhavaparikkhīṇaṁ`. Đọc `nandī-bhava` = hoan hỷ đối với hữu, đúng với cách Sujato đọc cùng dòng ở `dhp413:3` (nghĩa là "hết thích thú với tái sinh") và `mn98:11.73`. Sửa: "đã đoạn tận hoan hỷ đối với hữu". (Đoạn bản dịch "hữu và sinh" cũng xuất hiện ở `snp3.9:49.3`; không sửa vì ngoài phạm vi, chỉ báo.)
  - `1.2`: `vippasannamanāvilaṁ` bản cũ có "tâm ý", Pāli không có. Sửa "trong sáng, không vẩn đục" (khớp với `dhp413:2` trong tầng Việt: "trong sáng, không vẩn đục").
  - `2.1`: `Nibbāpayantaṁ janataṁ` bản cũ "dẫn dắt quần chúng đến cõi Niết-bàn" thêm "dẫn dắt", "cõi" và đổi động từ. `nibbāpeti` là sai khiến của `nibbāyati` (làm cho nguội, làm dập tắt). Sửa "làm cho quần chúng được nguội mát". Bất định: Pāli không nêu cái bị dập tắt (phiền não, nóng bức); không thêm vào thân kinh.
  - `5.4`: `mahabbalo` = "có sức mạnh lớn" (`mahā` + `bala`), không phải `mahiddhi` (đại thần lực). Sửa "có đại lực". Tiền lệ đa số trong `tha-ap` ("đại thần lực", 75 khoá có Pāli `mahabbalo`) là cách đọc sai nghĩa, nên không theo.
  - Dư chữ: `3.3` "dâng cúng" → "đã dâng" (`abhiropayiṁ`); `4.3` bỏ "còn" (Pāli không có), giữ "đọa xứ" theo tiền lệ (khoảng 150 khoá); `5.2` bỏ "một".
  - `5.1`: `sattamake kappe` là số thứ tự ("kiếp thứ bảy"), bản cũ "Cách đây bảy kiếp" đổi thành số đếm. Sửa "Vào kiếp thứ bảy trước đây" (cùng hình thức với `4.1` "Vào ba mươi mốt kiếp trước đây", là tiền lệ của các bài `Ký Sự` đã kiểm).
  - `3.4`: `lokabandhu` = "thân quyến của thế gian" (`bandhu` = bà con, không phải `mitta`/thân hữu). Sửa thành "bậc thân quyến của thế gian". Chỗ này còn bất định về từ vựng (tầng có hai cách), nhưng "thân hữu" nghiêng sang bạn bè hơn là Pāli.
  - `4.2`: "nghiệp mà tôi đã làm khi ấy" (`yaṁ kammamakariṁ tadā`) giữ đủ `yaṁ` và `tadā`; bản cũ bỏ `tadā`.
  - Tiêu đề: `0.3` và `8.1` đổi về hình thức của các bài `tha-ap` đã kiểm ("Ký Sự Về Trưởng Lão …", "Ký sự về Trưởng lão …, thứ nhất"). "Bài Kệ Tuyên Ngôn" không có căn cứ cho `apadāna` (là truyện/ký sự về hạnh nghiệp); `translationTitle` đã đổi khớp `0.3`. Giữ tên `Bandhujīvaka` (tên hoa, đồng thời là tên Trưởng lão; hình thức này đã có ở các tiêu đề `Veyyāvacca`, `Sela`).
  - Giữ nguyên: `1.1`, `1.4`, `2.3`, `2.4`, `4.1`, `4.4`, `6.1`–`6.4`, `7.1`, `0.1`, `0.2`.

  **Đối chiếu nguồn thật:** các dòng `1.1`–`1.3` trùng Pāli với `dhp413:1`–`3` (và `mn98:11.71`–`73`), nên đã đối chiếu với Sujato của hai bài này ("Pure as the spotless moon, clear and unclouded, ended relish for rebirth"); phần còn lại (`2.x`–`6.x`) không có song song Anh nên chỉ dựa Pāli, ngữ pháp và tiền lệ trong tầng Việt. Vì vậy `triangulation` = 7.5 (≤ 8.0), không cao hơn.

  **Số Pāli:** `Ekattiṁse` = 31 (một + ba mươi, `ekatiṁsa`) → "ba mươi mốt" đúng; `sattamake` = thứ bảy; `catasso` = bốn, `aṭṭha` = tám, `chaḷ` = sáu. Không có số nào phải suy.

  **Thuật ngữ và công thức:** `7.1` giữ "Tôi nghe như vầy:" theo hình thức đã được người điều phối quyết định cho công thức `Itthaṁ sudaṁ` (558 khoá `tha-ap` đang theo); đây vẫn là bất định (Pāli không có lời hô, "như vầy" gần với `itthaṁ` hơn "tôi nghe"), nên nếu đổi phải đổi cả tầng một lần, không sửa riêng bài này. `Bốn vô ngại giải`, `sáu thắng trí`, `tám giải thoát`, `đã làm tròn lời dạy của Đức Phật` đều là hình thức đã ổn định của tầng (đếm 559, 92, 84, 756 khoá). Dấu nháy: `“` ở `1.1` và `”` ở `6.4` khớp Pāli; không có `…`.

