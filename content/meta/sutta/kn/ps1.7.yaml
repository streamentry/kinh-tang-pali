notes: |-
  Đã đọc hết Pāli (62 khoá, 59 khoá ngoài khối tiêu đề `:0`) trước khi viết. Bài là một ma trận hình thức gồm ba thì (đã / hiện / sẽ) × có–không, lặp lại cho nghiệp nói chung, nghiệp thiện, nghiệp bất thiện, rồi bảy tính chất khác của nghiệp (có tội, không có tội, đen, trắng, dẫn đến an lạc, dẫn đến khổ, cho quả an lạc) được lược bằng …pe… và nghiệp cho quả khổ được viết đủ. Vì cả bài là một khuôn lặp, mọi khoá cùng khuôn dùng đúng một bộ chữ; đã in cặp Pāli↔Việt cả 62 khoá ra đọc đối chiếu.

  COVERAGE ENGLISH ĐO ĐƯỢC. Mẫu số = 40 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) trên 59 khoá; Sujato phủ 0/40. Tầng english-sujato tại commit đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud dưới kn/, không có ps ⇒ not-published-upstream (không phải not-synced); lớp english-project không có uid này; tầng vietnamese-current chỉ có Pháp Cú. Bài dịch chỉ từ Pāli nên triangulation đặt 7.0 và status giữ draft theo blocker noEnglishEditionUpstream. Không tuyên bố đã đối chiếu tầng tham khảo nào.

  THÌ ĐẢO NGỮ ĐẾM ĐƯỢC. `ahosi` → "đã có" (tầng: 28 khoá "đã có", 9 "đã là"); `nāhosi` → "đã không có" (giữ nguyên thì quá khứ, vì `na ahosi`); `atthi`/`natthi` → "hiện có"/"hiện không có" để phân biệt với thì tương lai và với "đã", vì ba thì này chính là trục của ma trận (khối 1 là nghiệp quá khứ, khối 2 hiện tại, khối 3 vị lai theo các nhãn trong ngoặc ở :1.7, :2.5, :3.3); `bhavissati`/`na bhavissati` → "sẽ có"/"sẽ không có". Các nhãn `Atītakammaṁ`, `Paccuppannakammaṁ`, `Anāgatakammaṁ` giữ nguyên ngoặc đơn và dịch "(Nghiệp quá khứ)", "(Nghiệp hiện tại)", "(Nghiệp vị lai)" — quá khứ 371 khoá, hiện tại 269 khoá, vị lai 177 khoá so với tương lai 106 khoá trong tầng.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `vipāka` → "quả báo" (tầng: "quả báo" 611 khoá; riêng `kammavipāka` dùng "quả báo của nghiệp" ở pv22, pv33, pv43 và "quả nghiệp" ở mn86:18.49, sn36.21; tôi chọn dạng đủ chữ "quả báo của nghiệp" vì phải dịch song song `kusalassa kammassa vipāko` = "quả báo của nghiệp thiện"). `kusala`/`akusala kamma` → "nghiệp thiện"/"nghiệp bất thiện" (nghiệp thiện 2, nghiệp lành 1 trong tầng; chọn "thiện" cho khớp cặp `akusala` = "bất thiện"). `sāvajja` → "có tội" (22 khoá, "có lỗi" 8, "đáng trách" 7; theo an3.10:3.3, an3.40 "điều có tội"); `anavajja` → "không có tội" (11 khoá, đối xứng với "có tội"; "không có lỗi" 35 khoá nhưng ở các khoá ấy tiêu điểm là vật dụng như y, chỗ ở). `kaṇha`/`sukka` → "đen"/"trắng" (126/110 khoá; dn33:1.11.154 "nghiệp đen"). `sukhudraya`/`dukkhudraya` → "dẫn đến an lạc"/"dẫn đến khổ" (`udraya` → "dẫn đến" 25 khoá, "đưa đến" 3 khoá). `sukhavipāka`/`dukkhavipāka` → "cho quả an lạc"/"cho quả khổ" (mn61:9.3, 9.9 "cho quả khổ"). Khoá :10.8–:10.13 và :11–:12 giữ đúng khuôn "nghiệp cho quả khổ, … quả báo của nghiệp cho quả khổ", nên chữ "cho quả khổ" lặp hai lần trong cùng khoá; đó là cấu trúc của Pāli `dukkhavipākaṁ kammaṁ … dukkhavipākassa kammassa vipāko`, không phải lỗi lặp.

  TÊN VÀ TIÊU ĐỀ, ĐO ĐƯỢC. `:0.1` giữ Pāli "Paṭisambhidāmagga" (5/5 bài ps đã có: ps1.1, ps1.8, ps1.9, ps3.5, ps3.7). `:0.2` giữ Pāli "Mahāvagga", bỏ chữ số "1" đứng trước (3/3 bài trong Mahāvagga đã có: ps1.1, ps1.8, ps1.9 đều giữ Pāli và bỏ số). `:0.3` dịch "1.7. Luận Bàn Về Nghiệp" theo đúng khuôn "Luận Bàn Về …" của ps1.1 và ps1.8 ("1.1. Luận Bàn Về Tri Kiến", "1.8. Luận Bàn Về Nghịch Đảo") và giữ số thứ tự như hai bài ấy; ps1.9 giữ Pāli "9. Maggakathā" nên tầng ps chưa nhất quán, tôi theo khuôn đa số 2/3. Colophon `:12.3` dịch "Luận bàn về nghiệp đã hoàn tất." theo ps1.8:8.10 (ps1.9 và ps3.5 dùng "được hoàn tất", ps3.7 dùng "đã kết thúc": 3 cách trong 4 bài, tôi chọn dạng của ps1.8, bài kề trong cùng Mahāvagga).

  PĀLI TRÙNG NGUYÊN VĂN. Trong chính bài: 0 cặp trùng (đã dò 62 khoá, kể cả so không phân biệt hoa thường; các khoá :10.2–:10.7 khác nhau ở tính từ, các khoá khác nhau ở động từ thì và ở tính từ nghiệp) nên phép kiểm trùng nội bộ rỗng. Với tầng: 0 khoá Pāli của bài này trùng nguyên văn với khoá đã dịch ở tầng Việt dự án (đã dò toàn bộ 62 khoá), nên không có bản dịch nào để dùng lại nguyên văn.

  DẤU LƯỢC. Bảy khoá :10.1–:10.7 có …pe… ở Pāli (không có chấm cuối), bản Việt giữ đúng MỘT dấu `…` ở mỗi khoá, đặt sau một dấu cách và không thêm chấm, đúng dạng " …" của tầng (an8.64:7.4). Không có `(…)` trần ở Pāli bài này; các dấu ngoặc ở :1.7, :2.5, :3.3 là nhãn có chữ, giữ nguyên ngoặc. Không có dấu nháy kép hay nháy đơn ở Pāli nên bản Việt cũng không có (đã kiểm từng khoá, 0 lệch). Không có số Pāli.

  BẤT ĐỊNH ĐÃ GHI (không thêm vào thân kinh). (1) `atthi` có thể đọc là "đang có" thay vì "hiện có"; chọn "hiện có" vì ngắn hơn và hợp với "nghiệp hiện tại" ở nhãn. (2) :10.1–:10.7 là bảy đầu đề được lược; đoạn đầy đủ ở mỗi đầu đề (ma trận ba thì) không có trong bản chụp Pāli, nên không mở rộng, đúng luật …pe… → …. (3) `dukkhavipākaṁ kammaṁ` dịch "nghiệp cho quả khổ"; trong chuỗi :10.7 `sukhavipākaṁ kammaṁ` ở dạng lược dịch "nghiệp cho quả an lạc", cùng khuôn. (4) `nāhosi` = `na ahosi`: tầng Việt dự án có 16 khoá Pāli chứa dạng `nāhosi…` đã dịch (mn70:24 và an5.5:1.3 là "không có"; dn9:49.8 là "không phải là không tồn tại"), đều không nằm trong thế đối ứng ba thì như bài này. Tôi giữ "đã không có" để phân biệt với `natthi` = "hiện không có".

  technical_integrity đặt 9.6 vì không chạy được npm run validate, npm test, npm run check và npm run build trong lượt làm việc này; đây không phải tuyên bố rằng cổng kỹ thuật đã pass.
