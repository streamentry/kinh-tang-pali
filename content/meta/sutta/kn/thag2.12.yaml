notes: |-
  Tầng tham khảo: có bản Anh Sujato tại commit đã ghim, tệp có đủ 15/15 khoá (đếm bằng script trên cache đã ghim .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/). Sujato chỉ có chữ ở khối 0.x và phần đầu bài, các khoá từ 2.x trở đi để trống, nên phần đóng góp của tầng Anh có hạn và triangulation chấm vừa phải, không chấm cao. Không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya trong bản chụp upstream; đây là giới hạn của bản chụp, không phải thiếu sót của repo.

  Đủ 15/15 khoá. Đã đọc hết Pāli lát f120.pali.txt trước khi viết.

  Tên phẩm theo bảng đã chốt ở BRIEF_VI3 §11: Dukanipāta → **Bộ Hai Bài Kinh** (đúng như
  `thag-name:134` và `iti-name:32` của tầng `name`, *The Book of the Twos*; 40 tệp kn đã có
  cùng cách này). Dutiyavagga → “Phẩm Thứ Hai” theo đa số trong chính Theragāthā (15 tệp
  `thag2.*` đã có), phân biệt với Dukanipāta như bảng §11 đã cảnh báo.

  Tam giác: Sujato có chữ ở 1.x–2.4 (*People who act harshly… they’re treated in the same
  way; their deeds don’t vanish*). Chỗ tôi giữ khác Sujato có chủ ý: `veṭhamissena` là
  “khốn khổ ngươi” (Sujato *attacking people* đã lược mất tân ngữ “ngươi”), `nānattena` là
  “bằng chính việc làm của họ”, `pharusūpakkamā janā` là “những kẻ dữ dội, làm điều dữ
  dội”, `dāyādo` là “kẻ thừa kế”. `dāyādo` tôi dịch “kẻ thừa kế” chứ không phải “người
  thừa tự”, vì hệ từ với `tassa tasseva` (chính người ấy) thì “kẻ thừa kế” đọc tự nhiên hơn.

  Bất định đã ghi nhận. `nānattena` có thể đọc là “một cách hèn hạ” (tính từ) thay vì “bằng
  chính việc làm của họ”; tôi chọn cách đọc thứ hai vì `ca kammunā` đứng ngay sau và cả hai
  cùng nói về việc làm, còn `Tepi tattheva kīranti` (chính họ cũng bị đối xử y như thế) chỉ
  có nghĩa nếu hành động của họ đã bị trả lại y như vậy. `pharusūpakkamā` tôi dịch “làm điều
  dữ dội” cho cả hai vế, không lặp lại “dữ dội” ba lần.

  Dấu lược: khoá 2.5 là `… Jotidāso thero …. ` — hai dấu lược ở Pāli nên bản Việt giữ đúng
  HAI dấu `…`, không mở rộng (mẫu `thag2.11:2.5`, `thag2.13:2.5`).

  Kiểm kỹ thuật: save_vi chạy sạch; vì mọi khoá Pāli ở lát này ngắn hơn 40 ký tự (khoá dài nhất 39) nên tập `cần` trong _hvi.kiểm rỗng và các assertion NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy, tôi tự quét lại MỌI khoá bằng chính các hàm đó (pal, lược, lọt_pāli, ngoặc, _TỪ): đủ 15/15 khoá, đúng ID, thứ tự khoá y hệt Pāli, không rỗng, không thừa, mọi chuỗi NFC, không trùng nguyên văn Pāli (trừ 0.1 là tên bộ Kinh, đúng như tiền lệ), số dấu lược khớp Pāli từng khoá, nháy kép cân trên cả bài và khớp đúng số mở/đóng của từng khoá Pāli, không còn (…), toàn bộ chữ cái là script Latin. Đợt này cấm chạy cổng nên technical_integrity = 9.6, KHÔNG phải 10.0; bốn lệnh npm run validate | test | check | build để người điều phối chạy.
