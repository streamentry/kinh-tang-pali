notes: |-
  TẦNG THAM KHẢO CÓ. `source/upstream-manifest.json` liệt kê
  `sutta/kn/thag/thag6.14_translation-en-sujato.json`; tệp có đủ 41/41 khoá, 28 khoá có chữ
  (13 khoá im lặng là dòng tên tác giả 6.5 và dải uddāna 7.0–7.10, Sujato không dịch phần này).
  Coverage theo `source/layers.yaml`: bài này KHÔNG có khoá Pāli nào dài ≥ 40 ký tự (mọi dòng
  kệ ngắn hơn), nên mẫu số bằng 0, cổng coverage không chặn và không cần entry
  reference-gaps. Tầng `vietnamese-current` vắng, lớp lấp `english-project` không có.

  TÊN PHẨM ĐO ĐƯỢC.
  :0.1 giữ Pāli `Theragāthā 6.14` (thiên hướng 0.1 của brief): 200/223 tệp thag viết dạng
  Theragāthā + số, 12 tệp bỏ số, 11 tệp dùng Trưởng Lão Kệ.
  :0.2 `Chakkanipāta`: trong chính thag6 thì Trưởng Lão Kệ Nhóm Sáu = 12/13. Trong toàn thag,
  khuôn Bộ N Bài Kính mới là đa số (Bộ Một Bài Kinh 120, Bộ Hai 49, Bộ Ba 15…). Vì tên phẩm
  này chưa nằm trong bảng tên đã chốt ở BRIEF_VI3 §11, tôi theo đa số TRONG CHÍNH TÁC PHẨM
  đang làm (thag6) → Trưởng Lão Kệ Nhóm Sáu. Người biên tập nếu muốn thống nhất theo bảng tên
  thì phải sửa cả 12 tệp thag6 kia, không chỉ tệp này.
  :0.3 `Paṭhamavagga` → Phẩm Thứ Nhất, 209/224 tệp thag.
  :0.4 `Xtheragāthā` → Kinh Kệ Của Trưởng Lão X, 175/224 tệp thag.
  :0.4, 6.5 và 7.8 dùng một chữ: Sabbakāmi. Pāli ở 6.5 là `Sabbakāmitthero` (tên gọi), ở 7.8 là
  `sabbakāmī` (số nhiều/cách gọi) — tôi chuẩn hoá một chữ trong cả bài, giống cách repo đã
  chuẩn hoá `Vaḍḍho` → Vaḍḍha ở thag5.12:6.3.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ (Pāli trùng tuyệt đối) — 12 khoá.
  1.3 (Đầy ắp các tử thi khác nhau), 3.1 (sắc, thanh, vị, hương), 3.2 (và xúc, những thứ làm
  đẹp lòng), 3.3 (Năm dục công năng ấy), 4.3 (họ làm cho sự ghê rợn của bãi tha ma tăng trưởng),
  5.2 (như người dùng chân né đầu rắn), 5.3 (với sự dính mắc trong cõi đời), 5.4 (người ấy với
  chánh niệm vượt qua), 6.1 (Thấy rõ nguy hại trong các dục), 6.6 (Tập Sáu viên mãn), 7.0 (Tóm
  tắt ở đây:), và 9 khoá còn lại lấy y hệt từ thag5.12 / thag1.120.
  Bản nháp đầu ghi đạp đầu rắn và nơi cõi đời — lệch đúng một chữ so với tiền lệ; lượt
  review đối kháng đã sửa về y nguyên (và `né` cũng đúng nghĩa `sappasseva` hơn là `đạp`).
  6.3 `Nissaṭo sabbakāmehi` có MỘT tiền lệ trùng Pāli là tôi đã đạt được — rõ ràng lệch
  khoá (câu trước đó ở bài khác), nên coi là trùng Pāli giả và dịch lại thành Đã ra khỏi
  mọi dục. Đây là lý do có 23/93 khoá trùng Pāli mà tôi không dùng lại nguyên văn.
  6.4 `patto me āsavakkhayo”ti.` có 5 tiền lệ rời nhau; chọn cách giữ chủ ngữ `me` như Pāli.
  7.1–7.10 theo đúng công thức uddāna đã published ở thag5.12:6.0–6.4 và :7.1–7.4 (giữ nguyên
  tên riêng Pāli, giữ cấu trúc Tám mươi bốn bài kệ / mười bốn vị trưởng lão). 7.2 có tiền lệ
  riêng trong thag6 là thero → vị trưởng lão.

  TÊN RIÊNG KHAI VÀO BỘ NHỚ TIẾN TRÌNH: `Sabbakāmi` (0.4, 6.5, 7.8) là tên riêng Pāli thật
  của bài nhưng chưa có ở tầng Việt; khai vào `_TỪ_VI` theo cơ chế `lọt_pāli(pāli_riêng=…)`,
  không sửa `_hvi.py`. Đo trên tầng Việt TRƯỚC lát 54 thì đúng 3 khoá cần khai.

  BẤT ĐỊNH ĐÃ PHÂN XỬ.
  (1) 6.5 là `… Sabbakāmitthero ….` với HAI dấu lược — giữ đúng hai, y như thag6.1:6.5 và
  thag6.13:6.5. KHÔNG mở rộng.
  (2) `Vānaraṁ viya lepena` (2.3): Sujato đọc tar; `lepa` là chất dính, dịch keo.
  (3) `kaṭasiṁ` (4.3) dùng nguyên văn đa số là bãi tha ma — `kaṭasa` là đống xác.
  (4) `nekkhammaṁ daṭṭhu khemato` (6.2): xuất giao là chỗ trú an toàn — `nekkhamma` giữ dạng
  rút gọn quen thuộc của xuất giao, không kéo dài thành sự xuất giao.

  TẦNG THAM KHẢO ĐÃ ĐO.
