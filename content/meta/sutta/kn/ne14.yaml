notes: |-
  Đợt 19, làn 95. Dịch từ Pāli root commit đã ghim, đủ 143/143 khoá (0.1–0.4, 1.1–29.7), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. `ne14` là `Paṭiniddesavāra`, `Vibhaṅga 11`, nhóm `paññattihāra` (hướng dẫn về các cách định danh). Không có tầng Anh cho uid này (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Pāli của bài mang thẻ đánh dấu đậm `<b>` ở 25.1–25.9 và 27.1–27.3, 27.6–27.8: không chép thẻ vào bản Việt (các bài `ne` đã đăng cũng không chép).

  **Khuôn tên bài và công thức (dùng lại nguyên văn bản Việt đã có).** Đo trên 29 tệp `ne*` đã có: `Ở đây, nhóm X hướng dẫn là gì?` 10 khoá; `Nhóm X hướng dẫn đã được vận dụng` 10 khoá; `Bởi vậy, Tôn giả Mahākaccāyana nói:` 7 khoá (`Trưởng lão Mahākaccāyana` 1 khoá). `0.1` Netti và `0.2` Phần Giải Thích dùng lại nguyên văn (29/29 và 25/26 cặp trùng giống nhau; cặp lệch là `ne35:0.2` còn để nguyên Pāli). `0.3` Vibhaṅga 11 → Nhóm 11 và `0.4` → Nhóm Định Danh Hướng Dẫn theo khuôn `ne8`, `ne11`, `ne12`, `ne13`, `ne16`. `Tenāha bhagavā` → `Bởi vậy, Đức Thế Tôn nói:` (7/8 khoá; 1 khoá `Vì vậy`, `ne17:15.3`).

  **`paññatti` → định danh.** Đo trong các tệp `ne*`: 13 khoá chứa `paññatti` hoặc `nikkhepa`, 12 khoá viết `định danh` (`ne2:1.2`, `ne2:4.1`, `ne3:25.2`, `ne4:32.2`, `ne4:34.2`, `ne4:36.1`, `ne30:1.1`, `ne30:2.2`–`2.6`), 1 khoá viết `sự chế định` (`ne17:9.3`, ở một bối cảnh không phải nhóm này). Chọn đa số; `paññattihāra` → `nhóm định danh hướng dẫn` (`hāra` → `hướng dẫn` ở mọi nhóm vibhaṅga đã có; `ne30` dùng `phương thức` cho dạng sampāta, không dùng ở đây). Cấu trúc `X-paññatti Y-ssa` đọc là `sự định danh X đối với Y`. Dạng hai vế dùng chung một sở hữu cách (`vevacanapaññatti ca Z pariññāpaññatti ca`, 25.1–25.4, 27.6, 29.1–29.3) đọc là `…là sự định danh A và cũng là sự định danh B đối với Z`.

  **Các từ ghép của `paññatti`, có số đếm.** `nikkhepa` → `đặt xuống` (`ne30:2.4` `việc đặt xuống`, 1 tiền lệ); `pariññā` → `hiểu cho trọn` (`sn56.12` `đã được hiểu cho trọn`, cùng bộ ba `pariññeyya`/`pariññāta` ở 18.1/20.1); `pahāna` → `từ bỏ`; `bhāvanā` → `tu tập`; `sacchikiriyā` → `chứng ngộ`; `nirodha` → `diệt tận`; `samudaya` → `tập khởi`; `vevacana` → `đồng nghĩa`; `paṭivedha` → `thấu triệt`; `desanā` → `thuyết giảng`; `pavattanā` → `chuyển vận`; `abhiññā` → `thắng tri`; `paṭisambhidā` → `vô ngại giải` (`an7.38`); `dhammacakka` → `bánh xe Pháp` (`sn56.11`). `dukkhanirodhagāminī paṭipadā` → `con đường đưa đến diệt tận của khổ`: 55 khoá dùng dạng này, đa số rõ trong các dạng đã đo (`đưa đến sự diệt khổ` 27, `đưa đến việc diệt tận khổ` 16). `cattāri saccāni` → `bốn sự thật` (`ne4:30.2`, `ne26:2.7`; `ne20:7.5` `hai sự thật`; 1 khoá `các chân lý` ở `ne7:2.8`). `taṇhā` → `tham ái` (`ne6`, `ne7`, `ne17`, `ne18`); `yathābhūtaṁ pajānāti` → `biết rõ như thật` (232 khoá, so với `biết như thật` 12). `sutamayī`/`cintāmayī`/`bhāvanāmayī paññā` → `tuệ do nghe`/`tư duy`/`tu tập sinh` (`ne4:28.2`–`28.4`, `29.1`–`29.3`, 6 khoá). `dassanabhūmi`/`bhāvanābhūmi` → `nền thấy biết`/`nền tu tập` (`ne4:28.4`). `sotāpattiphala` → `quả Dự lưu` (42 khoá tầng). `kiñcana` → `vướng mắc` (`mn43:36.1`; dạng khác: `vướng bận` ở `dn33:1.10.70`, `cái gì đó` ở `sn41.7:6.6`). `nibbānadhātu` → `Niết-bàn giới` (46 khoá), `saṅkhāradhātu` → `hành giới` (`sn22.54:4.5`). `jantu` → `con người` (`ne4:13.1`), `yogī` → `hành giả` (`ne4:38.1`). `vinaya` → `điều phục`. `cakkhusamphasso` → `xúc mắt` (154 khoá, `nhãn xúc` 6), `manosamphasso` → `xúc ý` (162 khoá). `āsava` → `lậu hoặc` (1.559 khoá). `kāyagatā sati` → `niệm thân` (114 khoá).

  **Phần dùng lại nguyên văn từ bài khác trong tầng.** 3.1–3.6, 4.4–4.8, 5.1–5.6 và 6.4–6.8 lấy nguyên văn `sn12.64` (4.3 và 6.3 dựng theo `sn12.64:3.3`). 28.3 lấy nguyên văn `iti43:2.3`/`ud8.3:3.3`; 28.1–28.2 theo `iti43:2.1`–`2.2`. 24.1–24.2 lấy nguyên văn `sn4.21:4.1`–`4.2`; 26.1–26.4 lấy nguyên văn `ud7.10:5.1`–`5.4`. 22.1–22.4 theo `sn51.10:18.1`–`18.4`. 8.1 `Này các tỳ-kheo, hãy tu tập định.` giống `sn35.160:1.11` và `sn35.99:1.14`; 8.4/9.5 theo khuôn `sn35.100:1.4`; 8.7/9.9 theo `sn35.100:1.8` (đổi `cũng vô thường` thành `cũng là vô thường`, một chữ).
  Pāli trùng với bài khác trong tầng: 43 khoá của bài, 235 cặp, trong đó 181 cặp bản Việt giống nguyên văn và 54 cặp khác; 30 khoá giống mọi cặp. Cặp khác nằm ở 13 khoá: `0.2` (1 cặp, `ne35:0.2` chưa dịch); `8.1` (1 cặp, chỉ khác viết hoa `sn56.1:1.7`); `8.3` (`Kiñca yathābhūtaṁ pajānāti?`, 5/6 cặp khác; chọn `Và biết rõ như thật cái gì?` giống đúng `sn56.1:1.5`; `Biết rõ như thật cái gì?` 2 cặp, `Biết rõ như thật sự điều gì?` 2 cặp, `Biết rõ như thật điều gì?` 1 cặp); `9.2`/`9.3`/`9.4` (`ghānaṁ …`/`jivhā …`/`kāyo …`: 9/11, 6/8, 6/7 cặp khác, vì các bài `sn35` viết `với mũi …`/`với lưỡi …`/`với thân …` ở bối cảnh có giới từ, còn đây là dãy danh từ liền sau `Sotaṁ …`, nên viết `mũi …`/`lưỡi …`/`thân …`); `11.3` (`Thọ …` giống `mn138:20.8`, 3/4 cặp khác) và `11.4` (`tưởng …` là dạng đa số, 60 khoá, 14/44 cặp khác); `22.1` (4/4 cặp khác, xem bất định 6; cặp `sn51.10:18.1` chỉ khác dấu cuối `,` thay `—`); `22.2`, `22.3`, `22.4` (mỗi khoá 1 cặp khác là `ud6.1:17.2`/`17.3`/`17.4`); `26.6` (2/2 cặp khác, xem bất định 5).
  Pāli trùng nguyên văn trong chính bài: 13 nhóm, 13 cặp (3.2–3.6 với 4.4–4.8; 5.2–5.6 với 6.4–6.8; 4.1 với 6.1; 4.2 với 6.2; 11.2 với 11.6), bản Việt giống hệt nhau ⇒ 0 cặp lệch.

  **Số Pāli.** Chỉ một chỗ có số, `2.5`: `pañcannaṁ khandhānaṁ` = 5 → `năm uẩn`; `channaṁ dhātūnaṁ` = 6 → `sáu giới`; `aṭṭhārasannaṁ dhātūnaṁ` = aṭṭha 8 + dasa 10 = 18 → `mười tám giới` (2/2 khoá tầng viết `mười tám giới`); `dvādasannaṁ āyatanānaṁ` = 12 → `mười hai xứ`; `dasannaṁ indriyānaṁ` = 10 → `mười căn`. Không có số lớn, không có `Tiṁsakappasahassa`.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. Sở hữu cách trong `X-paññatti Y-ssa`: đọc là `định danh X đối với Y` (X là tên gọi áp cho Y). Cách đọc khác `định danh X của Y` không loại trừ được. Chưa có bản Anh để đối chiếu.
  2. `nikkhepapaññatti` → `đặt xuống`: nghĩa kỹ thuật (đặt vào nền, an lập, đặt đề mục) chưa phân xử; chỉ có 1 tiền lệ (`ne30:2.4`).
  3. `15.1` `āhaṭanāpaññatti āsāṭikānaṁ`: `āsāṭikā` dịch `trứng ruồi` theo `mn33` và `an11.17` (16 khoá, `āsāṭikaṁ hāretā` → `gỡ trứng ruồi`), nên `āhaṭanā` → `gỡ bỏ`. Hình ảnh ẩn dụ (tư duy bất thiện đã sinh) không viết vào thân kinh. `abhinighāta` → `đập tan`: 0 tiền lệ.
  4. `abhinibbidā` → `xuyên phá`, `padālanā` → `tách vỡ`, `upādāna` (23.8) → `nắm lấy`, `apacaya` (25.7) → `tiêu giảm`, `upanayana` (29.2) → `dẫn đưa`, `jotanā` (29.3) → `làm sáng tỏ`, `ārambha` (15.1) → `khởi sự`, `okāsa` (15.1) → `cơ hội`, `niyyānika` (29.4) → `dẫn đến giải thoát`: 0 tiền lệ trong tầng cho dạng này; chọn theo gốc từ.
  5. `26.5` `Assirī viya khāyati` → `dường như không có vẻ huy hoàng`: `sirī` → `huy hoàng` (`dn19:44.4` `sirimā` → `vẻ huy hoàng`), còn `ja500` dịch `sirī` là `thịnh vượng`. Không có tiền lệ cho dạng phủ định `assirī`. `26.6` `passato natthi kiñcanaṁ` dịch `không có vướng mắc nào`, khác `ud7.10:5.6` và `ud8.2:3.4` (`không có gì cả`), vì `27.8` định nghĩa `kiñcana` là tham, sân, si và cần giữ cùng một chữ.
  6. `26.2` `bhabbarūpova dissati` dùng lại `ud7.10:5.2` (`mà dường như có vẻ hợp lý`); nghĩa của `bhabba` (đáng giá, khả dĩ, hợp lý) chưa chắc. `22.1` `tulamatulañca sambhavaṁ`: theo `sn51.10:18.1` tách ba vế (đo được, không đo được, sanh khởi), phù hợp 23.1–23.2 (`tulaṁ` = `saṅkhāradhātu`, `atulaṁ` = `nibbānadhātu`); hai khoá `dn16:3.10.4` và `an8.70:10.4` dịch `Cân nhắc cái vô song với sự sanh khởi`, còn `ud6.1:17.1` dịch `So sánh cái vô song`. Giữ `sanh khởi` ở lời kệ để khớp nguyên văn tiền lệ; phần văn xuôi viết `sinh khởi`.
  7. Kệ `24` và các đoạn trích rời ở `25.1`–`25.9`: đây là chú giải từng lời của kệ, nên `25.1` `Yo dukkhan` dịch `Kẻ nào, khổ` và `25.7` `Tesaṁ satīmā` dịch `Của chúng, người có niệm` là các mảnh rời; `tesaṁ` có thể thuộc `satīmā` hoặc `vinayāya`, không phân xử. `jantu` → `con người`. `24.3` `Kāmā hi …` giữ `hi` bằng `quả là` (nhấn mạnh/nguyên nhân).
  8. `25.13` `oramattikāya asantuṭṭhiyā` → `không thỏa mãn với điều nhỏ nhoi` (`oramattaka` → `nhỏ nhoi` ở `dn16:1.7.10`); cú pháp tính từ hay trạng từ không phân xử được. `25.6` `pāvakakappā` → `giống như lửa` (`kappa` = `giống`) và `papātauragopamā` → `vực thẳm và như rắn`: 0 tiền lệ cho cả bốn hình ảnh `aṅgārakāsū`/`maṁsapesī`/`pāvaka`/`papāta`.
  9. `27.3` `icchāvacarānaṁ` → `những phạm vi của ham muốn xấu ác` (`mn5` 10 khoá `phạm vi của ham muốn xấu`); `pariyuṭṭhāna` → `ám ảnh` (`mn22:20.5`; `mn48:8.3` dịch `xâm chiếm`); `kicca` → `chức năng`: không phân xử. `27.4` `balava` → `sức mạnh`, `27.5` `virūhanā` → `tăng trưởng` (theo `virūḷha` ở `sn12.64`).
  10. `17.1` thiếu dấu phẩy sau `paññāya` trong Pāli; Việt thêm dấu phẩy theo `19.1`. `anaññātaññassāmītindriya` → `căn sẽ biết điều chưa biết` (`dn33:1.10.111`), `aññindriya` → `căn biết rõ`, `aññātāvindriya` → `căn của người đã biết rõ`; không đặt trong nháy vì Pāli không có nháy.
  11. Dấu nháy: `20.3` Pāli chỉ có nháy đóng (thiếu nháy mở) nên Việt chỉ có nháy đóng; `16.3`, `18.3`, `18.4`, `20.4` bắt đầu bằng chữ thường theo Pāli. `16.1`–`16.4` đặt nháy quanh đúng cụm mà Pāli đặt (`Đây là “khổ”`), khác `18.x`/`20.x` đặt nháy quanh cả mệnh đề, theo Pāli.
  12. Câu vắt qua ranh giới khoá: `28.1`–`28.2` (mệnh đề điều kiện ở 28.1, hệ quả ở 28.2), `25.10`–`25.11` (`Yadā hi …` / `So …`), `4.1`–`4.2` và `6.1`–`6.2` (`Phasse ce …pe…` / `manosañcetanāya ce, bhikkhave, āhāre`). Không thêm `thực là` vào 4.1/6.1 vì Pāli ở khoá đó không có `āhāre`.
  13. `11.2` `nibbānaṁ` không có động từ; Việt thêm `có` (`mà có Niết-bàn`). `11.1`: `vikīḷaniyaṁ karotha` → `làm cho không còn là đồ chơi` (khác `sn23.2:2.4` `làm cho không thể chơi`); `taṇhakkhaya` → `đoạn tận tham ái` (`sn23.2` dịch `khát ái`).
  14. `12.1` `nirodhapaññatti nirodhassa` giữ lặp `diệt tận … diệt tận`; không phân xử vế thứ nhất có chỉ cùng một thứ với vế thứ hai hay không. `25.5` `paccatthikato` → `như kẻ thù`.

  **Phép đo (kết quả).** Khoá Việt = khoá Pāli: 143 = 143, cùng thứ tự. Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá: 143 khoá quét, 0 lệch (Pāli bài này chỉ có nháy kép). Dấu lược: 14 khoá Pāli có `…` (4.1, 6.1, 9.1–9.4, 11.3, 11.4, 16.2, 16.3, 18.2, 18.3, 20.2, 20.3), Việt cũng đúng 14 khoá và mỗi khoá đúng số `…`; Pāli không có `(…)` nên Việt không có; khoá Pāli kết `….` (16.3) → Việt kết ` ….`. NFC, khoá rỗng, khoảng trắng thừa: 0 lỗi. Pāli lọt sang Việt: chỉ tên riêng Rādha (11.1) và Mahākaccāyana (29.6).

