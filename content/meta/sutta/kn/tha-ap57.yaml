  **SỬA `:0.3` — ĐẶT LẠI SỐ THỨ TỰ CÓ NGUỒN.** Lát này sửa đúng `1` khoá
  (`:0.3`) của tệp này — Pāli `:0.3` = `5 Opavayhattheraapadāna` — có số thứ tự, còn bản Việt cũ
  **đã bỏ mất số đó** ⇒ mất thông tin có nguồn ngay ở tiêu đề phẩm.
  Đã đặt lại thành: `5. Bài Kệ Tuyên Ngợ Về Trưởng Lão Opavayha`

  **QUY TẮC ĐÃ ĐO, KHÔNG ĐO THEO ĐA SỐ.** `:0.3` giữ số thứ tự khi và chỉ khi
  Pāli `:0.3` bắt đầu bằng số. Đo tại thời điểm sửa trên **367** tệp `tha-ap`
  có khoá `:0.3`: Pāli có số ⇒ giữ **56/116**, Pāli không số ⇒ bỏ **249/251**;
  bám Pāli **305/367 = 83,1%**. Hình thức: chữ số + dấu chấm **51** so với số
  viết bằng chữ **5**, và **0/56** tệp mang cả hai — nên chọn **chữ số**.

  `semantic_fidelity` **hạ 0,3** (mất thông tin có nguồn ở khoá tiêu đề: lỗi
  semantic, không phải văn phong). `translationTitle` nằm ngoài lát này nên
  để nguyên — **coordinator hợp nhất nếu muốn tiêu đề trang khớp `:0.3`.**

  **Lượt cải thiện 2026-10-11.** Đọc đối kháng 44 khoá Pāli↔Việt, đo tiền lệ trên toàn tầng rồi sửa **29/44 khoá** (còn 15 khoá giữ nguyên: tiêu đề, `1.1`, `4.3`, `8.3`, `8.4`, `9.3`, `9.4`, `2.4`, công thức kết bài). Bản trước chứa nhiều lỗi thật mà thang điểm cũ không bắt được; điểm cũ **không** được coi là chuẩn so sánh.

  *Lỗi chính xác (accuracy fix), có căn cứ ngữ pháp + tiền lệ:*
  · `7.1` `Aṭṭhavīsatikkhattuṁhaṁ` = aṭṭha 8 + vīsati 20 = **28** lần (`aṭṭhavīsati` → *hai mươi tám*, `mil5.1.9:4.1`; tầng cũng có `Catutiṁsatikkhattuñca` → *ba mươi bốn lần*, `tha-ap33:7.3`). Bản trước ghi *trăm sáu mươi* và thêm *người lái xe* — **sai số lượng và thêm nghĩa ngoài Pāli**. Mới: *Tôi đã hai mươi tám lần, / làm vua có đại thần lực*. Ghi chú cũ «aṭṭhavīsati = 160» là sai, thay bằng 28.
  · `6.1` `Lābhaṁ tesaṁ suladdhaṁva` — `lābha` là danh từ *lợi lạc*, **không phải tên vua**. Cùng công thức `Lābhā tesaṁ suladdhañca` → *Thật lợi lạc cho họ, thật khéo đạt được* (`tha-ap474:15.1`; thêm `tha-ap450:5.1`, `tha-ap401:12.1`, `tha-ap405:7.1`: đều là câu mừng, không có tên riêng). `6.2` `ye labhantupasampadaṁ` = *những ai được thọ cụ túc giới* (`tha-ap21:9.4`, `thi-ap21:43.4`); bản trước *cho những ai thành tựu họ* vô nghĩa. `6.3–6.4` `Punapi payirupāseyyaṁ … sace bhave` = *Tôi sẽ lại thân cận, nếu có một vị Phật ở thế gian* (`sace bhave` → *nếu có*, `thi-ap19:4.2`); bản trước bỏ phần điều kiện.
  · `1.2` `ājānīyamadāsahaṁ` = `ājānīyaṁ` + `adāsiṁ` + `ahaṁ` (*Tôi đã dâng con ngựa thuần chủng*): `…madāsahaṁ` là *đã dâng + tôi*, không phải số; `ājānīya` → *ngựa thuần chủng* (`mn65`, `mn107`, `mnd10`). Bản trước *món vô lượng* không có căn cứ. `1.3` `Niyyādetvāna sambuddhe` = *Sau khi dâng cúng lên bậc Chánh Đẳng Giác* (`niyyādetvāna` → *dâng cúng xong*, `tha-ap339:6.2`; `sambuddhe` → *bậc Chánh Đẳng Giác*, `tha-ap51:2.1`, `tha-ap472:4.1`); bản trước *hộ trì chứng ngộ* là lỗi.
  · `3.1–3.4` viết lại hoàn toàn: *Người mặc y phục / điều ấy không nên hỏi / … xin Ngài ban cho con được thấy* không có căn cứ. Mới theo Pāli: `sapattabhāro` (`sa-` + `patta` + `bhāra`; cùng gốc `sapattabhārova` ở `dn2:66.3`, `mn51:15.2`…) = *có bình bát làm hành trang*; `ājāneyyo na kappati` = *ngựa thuần chủng không được phép* (`na kappati` → *không được phép*, `mn94:33.5`); `Tava saṅkappamaññāya` = *Thấu rõ ý định của ngài*; `adhivāsesi cakkhumā` = *bậc Có Mắt đã nhận lời* (nguyên văn `tha-ap393:53.4`). Song song cấu trúc: `tha-ap20:1–2` (voi dâng Đức Padumuttara, rồi `agghāpetvāna taṁ sabbaṁ` — định giá thay vì dâng vật không hợp với tỳ-kheo).
  · `4.1–4.2` `Agghāpetvā vātajavaṁ, sindhavaṁ sīghavāhanaṁ` = *Sau khi cho định giá con ngựa nhanh như gió, / ngựa xứ Sindhu chuyên chở nhanh chóng* (`agghāpetvāna` → *cho định giá*, `tha-ap20:2.3`; `sīghavāhana` → *chuyên chở nhanh chóng*, `ja538:69.2`, `tha-ap410:18.4`; `vātajava` → *nhanh như gió*, `tha-ap297:2.1`, `ja546:47.4`). Bản trước *Lần theo gió lừng về… biển cả* là bịa. Ghi chú cũ «`vātajavaṁ` 0 tiền lệ trong toàn tầng» là sai: đo lại có **6** khoá ngoài bài này (`pe8:39.15`, `ja546:47.4`, `ja514:11.4`, `ja514:20.4`, `tha-ap297:2.1`, `tha-ap406:20.1`).
  · `4.4` `khamanīyamadāsahaṁ` và `5.3`: `khamanīya` → **dễ chịu** ở **mọi** khoá còn lại của tầng (`dn16`, `dn17`, `mn143`, `mn128`, `sn22.88`, `cp22:10.3`…; không có chỗ nào mang nghĩa *không sao chịu nổi*). Bản trước *không sao chịu nổi* **đảo cực** nghĩa; đã sửa.
  · `8.2` `carimo vattate bhavo` = *kiếp sống tối hậu đang diễn ra* (8/13 khoá cùng Pāli). Bản trước *này là đời cuối cùng của Ngài* gán sai chủ thể; `bhavo` là *kiếp sống*, không phải *của Ngài*. (Lỗi tương tự còn ở `tha-ap460:5.2` — ngoài lát này, chỉ báo.)
  · `7.3–7.4` `Cāturanto vijitāvī` → *Làm chủ bốn phương, bậc chiến thắng* (4–6/13 khoá cùng Pāli, ví dụ `tha-ap5:14.3`, `tha-ap475:7.3`); `jambusaṇḍassa issaro` → *chúa tể xứ Jambu* (3/4 khoá cùng Pāli). Bản trước *thắng trận bảo vệ* là thêm nghĩa.
  · `9.2` `mahātejosi khattiyo` → *tôi là vị Sát-đế-lợi có đại uy lực*: `khattiya` → *Sát-đế-lợi* ở **62/73** khoá `tha-ap` có `khattiya` (`tha-ap5`, `tha-ap124`, `tha-ap123`, `tha-ap177`, `tha-ap329`); *bậc thượng lương* **0** lần ở nơi khác. Ghi chú cũ «ở tha-ap đó là cách cũ» là sai. `9.1` thêm *kiếp* — xem bất định bên dưới.

  *Thuật ngữ / tiền lệ (terminology fix):* `2.1` `Devalo` → *Devala* (dạng gốc như `Sumana`, `Padumuttara` ở `tha-ap329:9.1`; `Tên là …` theo `tha-ap329:9.1`). `2.2` `satthuno aggasāvako` → *là đệ tử thượng thủ của bậc Đạo Sư* (`aggasāvaka` → *đệ tử thượng thủ* ở 35/36 khoá cùng gốc từ ngoài bài này; *học trò ưu tú nhất* 0 lần; ngoại lệ duy nhất là *học trò tối thượng*, `tha-ap86:1.2`). `2.3` `Varadhammassa dāyādo` → *Người thừa tự Pháp cao quý* (`varadhamma` → *Pháp cao quý*, `tha-ap403:25.1`; `dāyādo` → *thừa tự*, `thi-ap27:64.1`); bản trước *đạo hạnh chân chánh* không đúng chữ. `5.1–5.2` dùng lại nguyên văn *Dù sinh vào cảnh giới nào, / dù làm chư thiên hay làm người* (20/23 và 23/30 khoá cùng Pāli); bản trước *Dù ở đâu tôi sinh ra / chư thiên hay làm người* lệch tiền lệ và cú pháp.

  *Đại từ ngôi thứ nhất:* bản trước trộn *ta* và *tôi* trong cùng một bài. Đo trên **563** tệp `tha-ap`: *tôi* chiếm đa số **273**, *ta* **256**, lẫn **34** — gần ngang, nên chọn **một** cách cho cả bài: *tôi* (khớp `2.4`: 8/9 khoá cùng Pāli có dạng `nơi … ở` dùng *tôi*). `8.1` thành *của tôi* (`tha-ap4:18.1`).

  *Tên phẩm `:0.2` — cập nhật số đo.* Ghi chú cũ nói `Bījanivagga` → *Phẩm Hạt Giống* «cố ý lệch tiền lệ». Đo lại: trong **9** khoá `Bījanivagga` khác, *Phẩm Hạt Giống* chiếm **6**, *Phẩm Cái Quạt* **2** (`tha-ap55`), *Phẩm Bījanivagga* **1** (`tha-ap56`); bài này giờ **thuộc đa số**, không còn lệch. Ngoài lát: `tha-ap55`/`tha-ap56` nên gộp về *Phẩm Hạt Giống* (chỉ báo).

  *Đã đo và quyết định KHÔNG đổi dù có nghi vấn:* `2.4` giữ *đã ngự đến nơi tôi ở* (tiền lệ lẫn: trong 15 khoá cùng Pāli, *ngự* 6 và *đến* 9; Pāli `āgacchi` không phân biệt — lựa chọn văn phong, không phải lỗi). `0.3`/`12.1`/`11.1`/`10.x` đã khớp đa số (11.1: 542/550 khoá `Như vậy, Tôn giả Trưởng lão … đã nói những bài kệ này`; `:0.3` số thứ tự có trong Pāli nên giữ). Đối chiếu Pāli trùng nguyên văn: **20/44** khoá có khoá cùng Pāli ở bài khác (3.652 cặp); trong bài, `1.1`/`4.3` là cặp trùng duy nhất và hai bản Việt khớp (chỉ khác dấu `“`).

  *Điểm — trước → sau:* source_provenance 9.5 → 9.5 · semantic_fidelity 8.7 → **8.7** (giữ: còn bất định thật ở `3.1`, `4.4`, `5.3–5.4`, `9.1`) · grammar_logic 9.1 → **9.2** (sửa số lượng, vị ngữ, mệnh đề điều kiện, chủ thể `8.2`) · segment_alignment 10.0 → 10.0 · terminology 9.0 → **9.3** (`ājānīya`/`sindhava`/`sīghavāhana`/`khamanīya`/`khattiya`/`aggasāvaka`/`upasampadā` đều đưa về tiền lệ đã đo) · triangulation 7.5 → 7.5 (không có tầng Anh/Việt độc lập; song song trong kho **không** thay thế bản Anh độc lập) · vietnamese_clarity 9.1 → **9.2** (bỏ sáu dòng vô nghĩa; còn `4.4`, `5.4` hơi khó) · han_viet_balance 9.1 → 9.1 · ambiguity_integrity 8.4 → 8.4 (giữ vì bất định thật vẫn còn; đã sửa các khẳng định sai trong ghi chú cũ) · technical_integrity 9.6 → 9.6. `final_score` 9.00 → **9.05** (trung bình thô 90.5/10).

  *Bất định còn lại — ghi ở đây, KHÔNG đưa vào thân kinh:*
  · `4.4` / `5.3`: vật được dâng là `khamanīya` (*dễ chịu*) nhưng Pāli không nêu danh từ; không phân xử được đó là gì (vật thay ngựa sau khi `agghāpetvā`, hay một loại vật dụng hợp lệ cho tỳ-kheo). Dịch sát chữ *món dễ chịu*; không bịa danh từ.
  · `5.3–5.4`: đọc `khamanīyaṁ vātajavaṁ cittaṁ` là ba chữ trung tính cùng chỉ *tâm* (*tâm dễ chịu, nhanh như gió*) — cú pháp đơn giản nhất, lặp lại đúng hai tính từ của quả báo với vật đã dâng. Cách đọc khác: hai tính từ nói về một vật lược danh từ và `citta` là *lộng lẫy*; không có chú giải/bản song song độc lập trong kho để phân xử.
  · `3.1–3.4`: Pāli không có dấu nháy trong; coi là lời của Devala nói với nhà vua (`tava` = *của ngài*) nên Việt không thêm nháy. `sapatta-` đọc là *bình bát* (ngữ cảnh Đức Thế Tôn), không phải *cánh*. Chưa tìm được chú giải trong kho để xác nhận.
  · `9.1` `Catutiṁsasahassamhi`: *kiếp* được bổ sung theo **4** công thức song song cùng kiểu (`tha-ap123:8`, `tha-ap124:14`, `tha-ap177:4`, `tha-ap329:25`, nơi `kappānaṁ`/`kappe` nằm ngay dòng sau); trong bài này Pāli không nêu danh từ. Số **34.000** (catu 4 + tiṁsa 30, nhân `sahassa` 1000) chắc chắn; đơn vị là suy từ công thức song song.
  · `6.3` `payirupāseyyaṁ` có thể là điều kiện (*sẽ thân cận nếu*) hoặc ước nguyện (*mong được thân cận*); chọn điều kiện vì đi cùng `sace bhave`. `9.2` `asi` đọc là `asiṁ` (ngôi thứ nhất, như `āsiṁ` ở `7.2`); nếu là ngôi thứ ba thì chủ thể `9.2–9.4` là một vị vua khác.

  *Blocker:* giữ nguyên blocker «không có tầng tham khảo tiếng Anh» (giới hạn của bản chụp upstream, không phải lỗi dịch). Không có blocker `unresolvedTerm` nào để giữ/xoá; các bất định trên **không** làm đổi giáo nghĩa. Bản cũ có các lỗi loại *sai số lượng* (`7.1`), *thêm nghĩa không căn cứ* (`7.1`, `4.1–4.2`, `6.1`) và *đảo cực* (`4.4`) — đã sửa ở khoá, không còn.

