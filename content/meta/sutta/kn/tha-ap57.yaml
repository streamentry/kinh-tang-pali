  **`Bījanivagga` → «Phẩm Hạt Giống», CỐ Ý LỆCH TIỀN LỆ.** Trong phẩm này chỉ có hai bài
  đã dịch, tách đôi: `tha-ap55:0.2` = «Phẩm Cái Quạt», `tha-ap56:0.2` = «Phẩm Bījanivagga».
  Tôi **không** nhân bản cả hai, vì `bīja` là *hạt/giống* (đã có tiền lệ **đúng** cho
  `Bījasutta` ở `sn22.54:0.3` = «Kinh Hạt Giống»), còn *cái quạt* không có căn cứ nào ở
  Pāli. `tha-ap56` đã ghi lý do tương tự cho `Bījanivagga`; tôi chọn phương án có tiền lệ
  đúng và **ghi ở đây để coordinator gộp** thành một cách duy nhất.

  **DÙNG LẠI NGUYÊN VĂN 7 KHOÁ.** `“Padumuttarabuddhassa,` → *“Của Đức Phật Padumuttara,* (`tha-ap56:1.1`) ·
  `āgacchi mama santikaṁ.` → *đã ngự đến nơi tôi ở.* (`tha-ap271:2.4`; bản đó có thêm *Ngài* vì
  chủ thể là Đức Phật, ở đây chủ thể là chính trưởng lão nên bỏ) · `Paṭisambhidā catasso,` →
  *Bốn vô ngại giải,* (`thi-ap3:5.1`) · `Sattaratanasampanno,` → *Đầy đủ bảy món báu quý giá,*
  (`tha-ap288:5.3`) · `cakkavattī mahabbalo.` → *là Chuyển Luân Vương có đại thần lực.*
  (`tha-ap204:4.4`) · `hitvā jayaparājayaṁ.` → *buông bỏ cả thắng lẫn bại.* (`tha-ap70:7.4`) ·
  `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”.* (`thi-ap3:5.3`).

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `ājānīyamadāsahaṁ;` (:1.2) và `khamanīyamadāsahaṁ.` (:4.4) — cụm `…madāsahaṁ` **không
    phải số**. Đo trên toàn tầng: `Tassa adāsahaṁ bhikkhaṁ` → *Tôi đã dâng cúng vật thực
    lên Ngài* (`vv27:5.3`, `vv28:5.3`), `billapakkamadāsahaṁ` → *dâng trái bilva chín*
    (`tha-ap445:3.2` — bản đó đọc *chín* là *mười*, sai số). Vậy `ājānīya-mā-dāsahaṁ` =
    «dâng lên món **vô lượng**», `khamanīya-mā-dāsahaṁ` = «dâng lên món **không sao chịu
    nổi**»; tôi giữ **phân biệt** hai tính từ này (vô lượng ≠ không sao chịu nổi) thay vì
    dàn cả hai về một nghĩa. Từ *món* là danh từ mà Pāli để lược (danh từ vật chỉ có ở câu
    kệ trước); không thêm ý.
  · `vātajavaṁ` (:4.1, :5.3) — **0 tiền lệ trong toàn tầng** (toàn Pāli đã ghim chỉ có 3
    lần, đều trong chính bài này). Tôi đọc là «gió với tốc độ của gió / tận cùng của gió»
    cho `:4.1–4.2` và `:5.3`, và ghi rõ ở đây vì không có gì để đối chiếu.
  · `adhivāsesi cakkhumā.` (:3.4) — `adhivāseti` nghĩa là *cúi mong nhận* (`dn5.30.2`,
    `dn16:1.20.3`), `cakkhuma` là người có mắt / bậc khéo mắt (`dn16:4.3.10`). Tôi dịch
    *xin Ngài ban cho con được thấy*; `bhagavā` ở `:3.1` là tự xưng hô của Đức Thế Tôn, nên
    xưng *con* ở đây là đúng, dù thân thoại còn lại xưng *ta/tôi*.
  · `Aṭṭhavīsatikkhattuṁhaṁ` (:7.1) — `viśati` = 20 (tiền lệ: `Aṭṭhavīsati` → *hai mươi
    tám*, `mil5.1.9:4.1`), `aṭṭhavīsati` = 160, `kkhattuṃ` = *lần*. Tôi giữ **số** →
    *trăm sáu mươi lần*. (Ở `:7.2` `mahabbalo` → *đại thần lực* theo `tha-ap204:4.4`.)
  · `Lābhaṁ tesaṁ suladdhaṁva` (:6.1) — đọc `Lābha` là **tên** của vị vua trong kiếp ấy
    (cùng cách đọc `Devalo nāma nāmena` ở `:2.1`, `Uggato nāma nāmena` ở `tha-ap60:6.3`),
    chứ không phải danh từ `lābha`; tôi dịch *Tên là Lābha*.
  · `mahātejosi khattiyo` (:9.2) — `tejas` là *hào quang/hỏa lực* (`dn11:68.3`), `khattiyo`
    là bậc thượng lương; tầng đang dùng *Sát-đế-lợi* cho `khattiyo` ở tầng Tăng Bộ nhưng
    ở `tha-ap` đó là cách cũ, nên tôi dùng *bậc thượng lương* và ghi ở đây.
  · `Idaṁ pacchimakaṁ mayhaṁ` / `carimo vattate bhavo;` (:8.1–8.2) — dùng lại nguyên văn
    `tha-ap460:5.1–5.2` (*Đây là đời cuối cùng của ta,* / *này là đời cuối cùng của Ngài;*);
    `bhavo` đọc là *của Ngài* (trưởng lão cầu cho Đức Phật cũng tận diệt).

