notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv19_root-pli-ms.json` (84/84 khoá, đủ và đúng thứ tự Pāli). Tên bài lấy từ tầng tên đã ghim: *The Rich Man Dhanapāla*.

  - Tầng tham khảo và coverage English:
    Tầng `english-sujato` không có pv19; `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage = 0: khoá Pāli dài nhất của bài là 35 ký tự (`20.1`), không khoá nào đạt ngưỡng 40 ký tự, nên cổng coverage không đo được gì và KHÔNG được trích ra làm bằng chứng đã có tầng tham khảo. Thứ chặn bài là việc ba tầng tham khảo đều vắng. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài và tiền lệ cùng bộ, nên `triangulation` đặt 7.0.
  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” và `0.2` “Ubbarivagga” giữ nguyên Pāli như pv14, pv20, pv22, pv23 (cùng phẩm). `0.3` theo khuôn “N. Chuyện Ngạ Quỷ …” của pv10, pv14, pv22; `20.1` theo khuôn “Chuyện Ngạ Quỷ …, thứ N.”.
    + `seṭṭhi` → “trưởng giả”: đo trên tầng, “trưởng giả” 17 và “phú hộ” 18 lần nhưng “phú hộ” hầu hết đi với “đại phú hộ” (dn33, an7.66, an8.35, dạng gộp theo giai cấp), còn “trưởng giả” dùng cho một cá nhân (thig6.5, ud5.3, dhp49:0 “Chuyện trưởng giả Macchariya”). Nên chọn “trưởng giả”.
  - Số Pāli — tự tính:
    + `asīti` = 80 → “tám mươi cỗ xe” (`sakaṭavāha` là lượng một xe chở; `asīti` = 80 như ud8.8:5.3 “tám mươi điều thân thương”).
    + `pañcapaṇṇāsavassāni` (10.1) = pañca 5 + paṇṇāsa 50 = 55 → “Năm mươi lăm năm”. Chứng cứ từ tầng: `pañcapaññāsakappamhi` → “năm mươi lăm kiếp” (tha-ap14:9.3), `pañcapaññāsa gāthāyo` → “năm mươi lăm bài kệ” (tha-ap232:9.5). `pv22:3.1` (Pāli trùng nguyên văn) hiện cũng dịch “Năm mươi lăm năm”, khớp bài này.
    + `catūhi māsehi` (13.1) = 4 tháng; `catukkaṇṇaṁ catudvāraṁ` (14.1) = bốn góc, bốn cửa; `yojanasataṁ` (15.3) = 100 do-tuần (sata 100; “do-tuần” 144 lần ở tầng); `sattamaṁ` (20.1) = thứ bảy, khớp số `7.` ở `0.3`. Không còn số nào khác.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + Pāli trùng nguyên văn với bài khác (đo lại ngày 2026-10-11, bỏ khoá ngắn dưới 8 ký tự sau khi chuẩn hoá dấu câu): 46 khoá có Pāli trùng và có bản Việt (267 cặp, 69 cặp bản Việt khác); 37/46 khoá trùng nguyên văn ít nhất một bản Việt có sẵn, 9 khoá không trùng bản nào — `1.4`, `2.1`, `2.4`, `3.4`, `14.2`, `18.3` là cố ý (xem dưới), `8.6`, `17.1`, `17.3` chỉ khác một chữ nối hoặc đại từ so với tiền lệ. Trong chính bài có 2 cặp Pāli trùng: `2.4` và `3.4` (`petalokaṁ ito gato”.`) cố ý khác vì một câu kể (ngạ quỷ trả lời), một câu hỏi (người hỏi); `11.1` và `11.4` (`yo saṁyamo so vināso`) cùng một câu Việt, chỉ khác dấu câu.
    + Dùng lại: `1.1` (pv14:1.1), `1.2` (ja516:6.2 `kiso dhamanisanthato`; cụm “gân nổi chằng chịt” cũng ở pv13–pv15, pv45), `2.3` (15/17 khoá Pāli trùng dịch “đã tạo nghiệp ác”), `3.1`–`3.3` (pv6, pv7, pv22, pv43; chỉ hạ chữ “Do” đầu `3.3` thành “do” cho khớp các dòng kế), `5.4` (6/8 bản dịch “nhiều ngọc trai và ngọc lưu ly”: ja493, ja499, ja534, ja539, ja547, thi-ap21), `7.2` và `7.3`–`7.4` (pv38:22.4, pv38:23.1–2), `8.1`–`8.2` (pv38:24.1–2), `12.3` (pv31:4.3, pv45:4.3), `13.1`–`13.4`, `14.1`, `14.3`, `14.4`, `15.1`–`15.4`, `16.1`, `16.2`, `16.3`, `16.4` (pv10, pv38), `17.4` (ud5.4:4.4), `17.3` (ud5.4:4.3, ne37:35.3, pe2:56.3, pe2:65.3 “chớ làm việc ác”, bỏ chữ “thì” vì bài này không có “nếu”), `18.2` (ud5.4:5.2), `18.1` gần ud5.4:5.1, `18.4` (ud5.4:5.4 `uppacca` “bay lên”), `8.6` (pv21:26.4, vv52:21.2 “lối bắc qua nơi hiểm trở”), `9.4` (pv14:2.4), `10.3`–`10.4` (pv22:3.3–4), `0.1`, `0.2`.
    + Lựa chọn lệch tiền lệ hoặc cần người biên tập xem (số đếm đo lại ngày 2026-10-11; bản ghi trước ghi sai một số con số này, đã sửa):
      * `2.2` `duggato yamalokiko`: tầng có 14 khoá `duggata/duggato yamalokika/yamalokiko` — “đã rơi vào cảnh khổ, thuộc cõi của Yama” 5 khoá (pv13, pv27 ×2, pv43, pv44), “khốn khổ” 4 khoá (pv6, pv7, pv45, pv51), “sinh về cõi khổ xa xôi” 4 khoá (đều ở pv31). Bản này theo dạng nhiều nhất; không phải lệch tiền lệ. `duggata` là “khốn khổ / rơi vào cảnh khổ”, Pāli không có chữ nào cho “xa xôi”.
      * `14.2` `bhāgaso mitaṁ`: 6 khoá Pāli trùng (pv10:13.2, pv38:37.2, ja539 ×2, ja541 ×2) dịch “đo đạc đều đặn”, bản này “được đo đạc” vì `đều đặn` không có trong Pāli. Đây là chỗ DUY NHẤT bản này lệch cả 6 tiền lệ trùng nguyên văn mà không có căn cứ ngoài Pāli; nếu muốn thống nhất cả tầng thì sửa cả 6 chỗ kia, không chỉ bài này.
      * `2.1`, `2.4`, `12.4` đổi “con” thành “tôi”: pv43 và pv51 (Pāli trùng ở `2.1`) dùng “con”; bài này một ngạ quỷ nói xuyên suốt, và ở kệ 4–19 người ấy nói với cả đám đông (`vo`) chứ không chỉ với vị tỳ-kheo, nên dùng “tôi” cho cả bài để không đổi ngôi giữa chừng. pv22 cũng dùng “tôi”.
      * `2.3`, `17.3`, `18.1` (ác nghiệp / nghiệp ác / việc ác): đo ở phạm vi gần nhất, `Pāpakammaṁ karitvāna` trùng nguyên văn 17 khoá → “đã tạo nghiệp ác” 15, “sau khi làm / tạo nghiệp ác” 2; không khoá nào dùng “ác nghiệp”. `Mākattha pāpakaṁ kammaṁ` (17.3) trùng nguyên văn ud5.4:4.3, ne37:35.3, pe2:56.3, pe2:65.3 → “thì chớ làm việc ác”, và `Sace ca pāpakaṁ kammaṁ` (gần 18.1) → “Nếu các ngươi làm việc ác” ở ud5.4, ne37, pe2, thig12.1, sn10.5. Vì vậy 2.3 → “đã tạo nghiệp ác”, 17.3 → “chớ làm việc ác” (bỏ “thì” vì bài này không có “nếu”), 18.1 → “Nếu các vị làm việc ác ấy”. `16.3` giữ “quả của ác nghiệp” vì Pāli trùng nguyên văn pv38:41.3 và gần pv10:15.3. Ba cách nói (nghiệp ác, việc ác, ác nghiệp) tương ứng ba cấu trúc Pāli khác nhau và đều là cách tầng đang dùng ở đúng cấu trúc đó.
      * `2.4`/`3.4` `petalokaṁ ito gato`: 2 khoá Pāli trùng — pv51:2.4 “đi đến cõi ngạ quỷ” (cùng bản này), pv43:2.4 “đi sang thế giới của người đã chết”; pv6:2.4 (`gatā`) cũng “đến cõi ngạ quỷ”. Bản này “cõi ngạ quỷ”.
      * `10.3`–`10.4`: Pāli trùng nguyên văn pv22:3.3–3.4, hiện dịch giống hệt bản này.
      * `7.1`–`7.2` `maccharī` / `kadariyo paribhāsako`: `kadariyo paribhāsako` trùng pv38:22.4, pv38:35.4, pv44:4.4 “keo kiệt, hay mắng nhiếc”, và an4.53/an4.54 “keo kiệt và hay rủa sả”, pv43:4.4 “bủn xỉn và hay mắng nhiếc”. Với `maccharī` tầng dịch “keo kiệt” 22/35 khoá ở các văn kệ Tiểu Bộ và 11/16 ở pv/vv, “bỏn xẻn” 7/35 (snp1.7:21.2, snp4.10, ja450) và 0/16 ở pv/vv; bản này chọn “bỏn xẻn” để hai chữ cạnh nhau không trùng nhau, chấp nhận lệch số đông ở `7.1`. Cách khác (an7.57:2.4 `assaddho maccharī kadariyo paribhāsako` → “bất tín, keo kiệt, bủn xỉn, hay sỉ nhục”) đặt `maccharī` = “keo kiệt”, `kadariya` = “bủn xỉn”; không có căn cứ Pāli để phân xử hơn cách nào.
      * `17.1` và `18.3`: Pāli trùng nguyên văn `17.1` ở ja516:20.3 (“vì thế tôi nói với ngài, chúc ngài được an lành”), thag6.5:4.1, ja475:12.1; `18.3` ở ud5.4:5.3, ne37:36.3 (“các ngươi không thoát khỏi khổ”) — các đại từ ở thag6.5, ud5.4 là “ngươi” (lời Đức Phật); ở đây một ngạ quỷ nói với đám đông nên dùng “các vị”. `bhaddaṁ vo` → “chúc … được an lành” theo ja516:20.3 và `bhaddamatthu te` → “cầu mong ngài được an lành” (pv38:42.4, pv38:46.4).
    + `saṁyama` (8.2, 11, 12.1) → “tự chế”: ud2.1:5.4 dùng “tự chế”; ở tầng, `saṁyama` còn dịch “thu thúc” (snp2.9:3.3) và “tiết chế” (kp8:6.2). Chọn “tự chế” và giữ nhất quán cả bài. `vināsa` → “hủy hoại”.
    + `pettivisaya` (9.3) → “cõi ngạ quỷ” (iti93:5.3 “ngạ quỷ”; pv14:2.3 `Upapannā pettivisayaṁ` → “sinh vào cõi ngạ quỷ”).
    + `khuppipāsasamappito` (9.4) → “bị đói khát bủa vây”, theo pv14:2.4.
    + `bhadante` (2.1) → “Bạch ngài” (ở pv 16/17 khoá `bhadante` dịch “bạch ngài”); `mārisa` (1.4) → “hỡi bạn”: đa số tầng dịch “thưa ngài” khi nói với bậc đáng kính (hàng chục khoá ở cnd, mil, pv25, pv35, tha-ap…), và ja539:139.4, ja540:43.4/44.4 (Pāli trùng `ko nu tvamasi mārisa`) dịch “thưa vị đáng kính, ngài là ai?”; nhưng ở đây vị tỳ-kheo (người hỏi) nói với ngạ quỷ, bản dịch chọn “hỡi bạn” để không đẩy ngạ quỷ lên vị trí bậc đáng kính khi ngay ở 1.1 người hỏi gọi người kia là “ngươi”. Có tiền lệ cùng thể loại và cùng cách xưng hô: pv45:1.4 `ke nu tumhettha mārisā` → “hỡi các bạn hiền”, tha-ap500:13.4 “… với ngươi, hỡi bạn”.
    + `ropite` (8.4), `papā` (8.5): `pokkharaññā` → “hồ sen” (dn17:1.22 dùng “hồ sen”), `udapāna` → “giếng nước” (ud7.9, ja271), `papā` → “trạm nước uống” (pv21:26.3, pv39:19.3, vv52:21.3 và ja541 đều “trạm nước uống”). `saṅkamana` (8.6) → “lối bắc qua” (pv21:26.4 ×2, vv52:21.2 “lối bắc qua nơi hiểm trở”; pv39:19.2 và sn3.24:6.4 dịch “lối đi”; ja541 “cầu”): chọn dạng đa số ở các bài cùng thể loại, và `dugga` → “nơi hiểm trở” theo cùng các khoá.
    + `dīpa` (12.4) → “hòn đảo”: pv31:4.4 và pv15:18.4 (2/2 tiền lệ); nghĩa gốc cũng có “chỗ nương tựa”.
    + `dukkhaṁ vedissa vedanaṁ` (16.2) → “sẽ chịu cảm thọ khổ đau” (theo pv10:15.2) — `vedissa` là thì tương lai; không hóa thành thì quá khứ.
    + `Matteyyā hotha petteyyā … jeṭṭhāpacāyikā … sāmaññā … brahmaññā` (19.1–19.3): theo an3.36:1.6 và an3.37:1.2 (“hiếu với mẹ, hiếu với cha, kính sa-môn, kính bà-la-môn, tôn trọng bậc trưởng thượng trong gia tộc”). dhp332 dịch `matteyyatā` “phụng dưỡng mẹ”; chọn “hiếu với” (7 lần ở tầng) cho cả `matteyya` và `petteyya`.
  - Dấu nháy và người nói: Pāli có nháy kép “ ” ở 8 khoá — `1.1`/`1.4` (lời hỏi), `2.1`/`2.4` (ngạ quỷ đáp), `3.1`/`3.4` (hỏi tiếp), `4.1` mở và `19.4` đóng (toàn bộ lời kể từ kệ 4 đến kệ 19). Bản Việt khớp Pāli từng khoá, nháy đơn 0/0, dấu lược `…` 0/0 (Pāli không có `…` nào, cũng không có `(…)`).
  - Bất định — ghi lại, không thêm vào thân kinh:
    + `paṇṇānaṁ` (4.1): hiểu là sở hữu cách số nhiều “của người Paṇṇa”; Pāli không giải thích thêm và tên này không có tiền lệ trong tầng, nên giữ nguyên Paṇṇa, không đoán vùng đất khác. `Erakaccha` (4.2) cũng thấy ở thig15.1:36.1 (`Nagaramhi erakacche`).
    + `asīti sakaṭavāhānaṁ hiraññassa` (5.1–5.2): “xe chở đầy” là cách hiểu `vāha` “lượng một xe chở”; `hirañña` dịch “vàng bạc” (snp2.7, snp4.1) còn `jātarūpa` (5.3) dịch “vàng” — hai chữ này đứng gần nhau nên có thể chồng nghĩa; không phân xử được từ Pāli.
    + `ropite` (8.4): hình thái nam tính số nhiều cạnh `ārāmāni` trung tính; dịch “những vườn cây đã được trồng” (phân từ quá khứ bị động của `ropeti`), có thể đọc là “khi được trồng”.
    + `saṁyamo so vināso, yo vināso so saṁyamo` (11.1–11.4): đảo ngữ có chủ ý trong Pāli, dịch sát chữ; nghĩa “tự chế” ở đây — lúc nhà giàu không bố thí vì “giữ gìn tài sản” (12.1–12.2) — là cách hiểu theo ngữ cảnh kế bên, không phải chữ của Pāli.
    + `karontānaṁ` (7.3): đứng cạnh `dadantānaṁ` nhưng không có tân ngữ; dịch “đang làm phước”, thêm tân ngữ ngầm theo ngữ cảnh bố thí ngay trước — đây là chỗ duy nhất bản dịch bổ sung một tân ngữ ngầm, nên ghi ở đây.
    + `uppaccāpi palāyataṁ` (18.4): “dù có bay lên mà chạy trốn” — `uppacca` là tuyệt đối từ “bay lên / nhảy lên”; theo ud5.4:5.4 (`upeccapi`, cùng khuôn).
    + `taṁ vo vadāmi` (17.1): `taṁ` đọc là “vì thế”; có thể là “điều ấy”. Không đổi nghĩa chính của kệ.
    Vì các chỗ trên và thiếu bản Anh độc lập, `semantic_fidelity` 9.0 và `ambiguity_integrity` 8.6.
  - Lượt cải thiện 2026-10-11 (đọc đối kháng lại cả 84 khoá, đo lại tiền lệ trên toàn tầng): đổi 6/84 khoá, đều là sửa thuật ngữ theo tiền lệ Pāli trùng nguyên văn, không đổi nghĩa.
    + `2.3` “sau khi tạo ác nghiệp,” → “đã tạo nghiệp ác,” (15/17 khoá Pāli trùng, 0 khoá dùng “ác nghiệp”).
    + `5.4` “ngọc trai và ngọc lưu ly cũng nhiều.” → “nhiều ngọc trai và ngọc lưu ly.” (6/8 khoá Pāli trùng; bỏ chữ “cũng” không có trong Pāli).
    + `8.6` “và các lối đi tại những chốn gian nan.” → “và các lối bắc qua nơi hiểm trở.” (`saṅkamana` là chỗ bắc qua / cầu; pv21 ×2 và vv52 dùng “lối bắc qua nơi hiểm trở”, ja541 “cầu”).
    + `17.1` “chúc các vị được tốt lành” → “chúc các vị được an lành” (ja516:20.3 Pāli trùng; pv38:42.4, pv38:46.4 `bhaddamatthu te` → “an lành”).
    + `17.3` “chớ tạo ác nghiệp,” → “chớ làm việc ác,” (4/4 khoá Pāli trùng ud5.4, ne37, pe2 ×2).
    + `18.1` “Nếu các vị làm ác nghiệp ấy,” → “Nếu các vị làm việc ác ấy,” (cấu trúc `Sace ca pāpakaṁ kammaṁ` ở ud5.4, ne37, pe2, thig12.1, sn10.5 đều “nếu … làm việc ác”).
    + Điểm: `terminology` 9.0 → 9.2 (sáu khoá đưa về tiền lệ và các số đếm cố ý lệch được đo lại, sửa hai con số tiền lệ ghi sai ở bản ghi trước). Các tiêu chí khác giữ nguyên: không có thay đổi nghĩa nên `semantic_fidelity`/`grammar_logic` không đổi; các bất định dưới đây chưa phân xử được nên `ambiguity_integrity` giữ 8.6; không có bản Anh độc lập nên `triangulation` giữ 7.0. `final_score` 8.97 → 8.99, vẫn thuộc mức review.
    + Đã nghi nhưng giữ nguyên: `14.2` (“được đo đạc” lệch 6 tiền lệ “đều đặn”, lý do ở trên), `7.1` “bỏn xẻn”, `1.4` “hỡi bạn”, `17.1` “Vì thế” (có thể là “Điều ấy” — ja409, ja516:45, tha-ap3 dịch “điều ấy”), `3.1` (“Điều ác gì là do thân…” 15/17 theo tiền lệ dù hơi nặng nề), `5.2` “chở đầy” (không có tiền lệ cho `sakaṭavāha` trong tầng).
  - Kiểm tra: 84/84 khoá đúng tập và thứ tự Pāli; NFC, không khoá rỗng, không khoảng trắng thừa; nháy kép khớp Pāli từng khoá (8 khoá có nháy / 84), không Pāli lọt vào thân bản dịch ngoài tên riêng và thuật ngữ giữ nguyên (Petavatthu, Ubbarivagga, Dhanapāla, Erakaccha, Paṇṇa, Yama). Đã đọc đối chiếu từng cặp Pāli↔Việt.
  - technical_integrity 9.6: cổng kỹ thuật do người điều phối chạy — npm run validate; npm test; npm run check; npm run build.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 9 khoá bất đồng nghĩa → sửa 0, giữ 5, bất định 4. Giữ: 4.1 `nagaraṁ atthi paṇṇānaṁ` (bản nguyên bài đọc "xứ Dasanna" theo dị bản; Pāli ghim là `paṇṇānaṁ`); 5.2 `hiraññassa` ("vàng thô" so với "vàng bạc" của bản dự án theo 15/29 khoá `hirañña` trong tầng); 5.4 `veḷuriyā` (bản nguyên bài "ngọc bích"; bản dự án "ngọc lưu ly" đúng nghĩa `veḷuriya`); 8.1, 8.2 (bản nguyên bài đặt hai câu trong ngoặc như lời ông nói với người đang bố thí; Pāli không có `iti` nên bản dự án không thêm nháy). Bất định: 11.1, 11.2, 11.4, 12.1 `saṁyama` (bản dự án nhất quán "tự chế"; bản nguyên bài dịch "thu thúc" ở 8.2 nhưng "đeo níu" ở 11–12; Pāli dùng `saṁyama` theo nghĩa kìm giữ không cho hay tự chế đạo đức, không phân xử được từ chính bài). Các số đã tính lại và khớp bản nguyên bài: tám mươi cỗ xe (5.1), năm mươi lăm năm (10.1), bốn tháng (13.1), bốn góc bốn cửa (14.1), một trăm do-tuần (15.3). Review đối kháng cùng lượt: không tìm thấy lỗi cần sửa. Ghi chú xưng hô: notes cũ ghi "dùng tôi cho cả bài" nhưng 2.1 và 2.4 hiện là "con" (sau lượt rà quy tắc ngạ quỷ thưa với `bhadante`), còn 4.3–16.4 là "tôi" (lời kể cho cả đám đông, `vo` ở 17.1); đó là hiện trạng, ghi chú cũ lỗi thời, không đổi nghĩa. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Quyết định hội đồng biên tập 2026-10-16: B17 — 11.3 (`kira` đã có "quả thật" nên bỏ "nghe nói" thừa (hai trợ từ cho một `kira`)).
