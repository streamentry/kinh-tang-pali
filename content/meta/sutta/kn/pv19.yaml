notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv19_root-pli-ms.json` (84/84 khoá, đủ và đúng thứ tự Pāli). Tên bài lấy từ tầng tên đã ghim: *The Rich Man Dhanapāla*.

  - Tầng tham khảo và coverage English:
    Tầng `english-sujato` không có pv19; `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage = 0: khoá Pāli dài nhất của bài là 35 ký tự (`20.1`), không khoá nào đạt ngưỡng 40 ký tự, nên cổng coverage không đo được gì và KHÔNG được trích ra làm bằng chứng đã có tầng tham khảo. Thứ chặn bài là việc ba tầng tham khảo đều vắng. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài và tiền lệ cùng bộ, nên `triangulation` đặt 7.0.
  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” và `0.2` “Ubbarivagga” giữ nguyên Pāli như pv14, pv20, pv22, pv23 (cùng phẩm). `0.3` theo khuôn “N. Chuyện Ngạ Quỷ …” của pv10, pv14, pv22; `20.1` theo khuôn “Chuyện Ngạ Quỷ …, thứ N.”.
    + `seṭṭhi` → “trưởng giả”: đo trên tầng, “trưởng giả” 17 và “phú hộ” 18 lần nhưng “phú hộ” hầu hết đi với “đại phú hộ” (dn33, an7.66, an8.35, dạng gộp theo giai cấp), còn “trưởng giả” dùng cho một cá nhân (thig6.5, ud5.3, dhp49:0 “Chuyện trưởng giả Macchariya”). Nên chọn “trưởng giả”.
  - Số Pāli — tự tính:
    + `asīti` = 80 → “tám mươi cỗ xe” (`sakaṭavāha` là lượng một xe chở; `asīti` = 80 như ud8.8:5.3 “tám mươi điều thân thương”).
    + `pañcapaṇṇāsavassāni` (10.1) = pañca 5 + paṇṇāsa 50 = 55 → “Năm mươi lăm năm”. Chứng cứ từ tầng: `pañcapaññāsakappamhi` → “năm mươi lăm kiếp” (tha-ap14:9.3), `pañcapaññāsa gāthāyo` → “năm mươi lăm bài kệ” (tha-ap232:9.5). LƯU Ý: `pv22:3.1` có Pāli trùng nguyên văn nhưng dịch “năm mươi năm” — sai số lượng (thiếu 5 năm); đã báo, không sửa ngoài lát.
    + `catūhi māsehi` (13.1) = 4 tháng; `catukkaṇṇaṁ catudvāraṁ` (14.1) = bốn góc, bốn cửa; `yojanasataṁ` (15.3) = 100 do-tuần (sata 100; “do-tuần” 144 lần ở tầng); `sattamaṁ` (20.1) = thứ bảy, khớp số `7.` ở `0.3`. Không còn số nào khác.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + Pāli trùng nguyên văn với bài khác: đã dò 38 khoá có Pāli trùng và có bản Việt (111 cặp); dùng lại nguyên văn hoặc gần nguyên văn ở 22 khoá, cố ý khác ở 16 khoá (xem dưới). Trong chính bài có 2 cặp Pāli trùng: `2.4` và `3.4` (`petalokaṁ ito gato”.`) cố ý khác vì một câu kể (ngạ quỷ trả lời), một câu hỏi (người hỏi); `11.1` và `11.4` (`yo saṁyamo so vināso`) cùng một câu Việt, chỉ khác dấu câu.
    + Dùng lại: `1.1` (pv14:1.1), `1.2` (thag15.1:11.2 `kiso dhamanisanthato`), `3.1`–`3.3` (pv6, pv7, pv22, pv43; chỉ hạ chữ “Do” đầu `3.3` thành “do” cho khớp các dòng kế), `12.3` (pv31:4.3, pv45:4.3), `13.1`–`13.4`, `14.1`, `14.3`, `14.4`, `15.1`–`15.4`, `16.1`, `16.2` (pv10:12–15), `17.4` (ud5.4:4.4), `18.2` (ud5.4:5.2), `18.4` (ud5.4:5.4 `uppacca` “bay lên”), `8.6` (sn3.24:6.4), `9.4` (pv14:2.4), `0.1`, `0.2`.
    + Cố ý lệch tiền lệ — CẦN NGƯỜI BIÊN TẬP XEM:
      * `2.2` `duggato yamalokiko`: pv6, pv7, pv31, pv43, pv51 (5/5 tiền lệ) dịch “sinh về cõi khổ xa xôi”. `duggata` là “rơi vào cảnh khổ / khốn khổ”; không có chữ nào cho “xa xôi” trong Pāli. Bản này dịch “đã rơi vào cảnh khổ, thuộc cõi của Yama”.
      * `14.2` `bhāgaso mitaṁ`: pv10:13.2 dịch “đo đạc đều đặn” — `đều đặn` không có trong Pāli; bản này “được đo đạc”.
      * `2.1`, `2.4`, `12.4` đổi “con” thành “tôi”: bài này một ngạ quỷ nói xuyên suốt, và ở kệ 4–19 người ấy nói với cả đám đông (`vo`), nên dùng “tôi” cho cả bài để không đổi ngôi giữa chừng. pv20 và pv22 cũng dùng “tôi”.
      * `2.1` `petomhi`: pv43 và pv51 dịch “ma” (2/2); toàn bài này và tầng tên dùng “ngạ quỷ” (“cõi ngạ quỷ” 96 lần ở tầng).
      * `2.3` “ác nghiệp” so với pv6/pv7/pv31 “nghiệp ác”: tầng có “ác nghiệp” 329 lần và “nghiệp ác” 156 lần; chọn dạng đa số, và dùng nhất quán trong bài (2.3, 16.3, 17.3, 18.1).
      * `2.4`/`3.4` `petalokaṁ ito gato`: pv43/pv51 dịch “thế giới của người đã chết”; pv6 “cõi này sang cõi loài người” (nghĩa ngược Pāli). Bản này “cõi ngạ quỷ”.
      * `10.3`–`10.4` `Nābhijānāmi bhuttaṁ vā, pītaṁ vā pana pāniyaṁ`: pv22:3.3–3.4 dịch “Tôi không biết ăn uống gì, chỉ biết nước” — thêm “chỉ biết nước” mà Pāli trùng không có; bản này “tôi không nhớ mình đã ăn, hay đã uống thức uống nào”.
      * `7.2` `kadariyo paribhāsako`: pv43/pv44 (“tàn nhẫn và mắng nhiếc người khác”) lệch Pāli; an4.53 “keo kiệt và hay rủa sả”. Chọn “keo kiệt” (tầng 316 lần) cho `kadariya` và “bỏn xẻn” cho `maccharī` (7.1) để hai từ cạnh nhau không trùng; “hay mắng nhiếc” cho `paribhāsaka` (snp1.7:21.1 “mắng nhiếc”).
      * `17.1` và `18.3`: Pāli có tiền lệ gần ở dhp337:1, thag6.5:4.1 và ud5.4:5.3, nhưng các đại từ ấy là “ngươi” (lời Đức Phật); ở đây một ngạ quỷ nói với đám đông nên dùng “các vị”.
    + `saṁyama` (8.2, 11, 12.1) → “tự chế”: ud2.1:5.4 dùng “tự chế”; ở tầng, `saṁyama` còn dịch “thu thúc” (snp2.9:3.3) và “tiết chế” (kp8:6.2). Chọn “tự chế” và giữ nhất quán cả bài. `vināsa` → “hủy hoại”.
    + `pettivisaya` (9.3) → “cõi ngạ quỷ” (iti93:5.3 “ngạ quỷ”; pv14:2.3 `Upapannā pettivisayaṁ` → “sinh vào cõi ngạ quỷ”).
    + `khuppipāsasamappito` (9.4) → “bị đói khát bủa vây”, theo pv14:2.4.
    + `bhadante` (2.1) → “Bạch ngài” (223 so với “bạch tôn giả” 63 ở tầng); `mārisa` (1.4) → “hỡi bạn”: đa số tầng dịch “thưa Ngài” khi nói với bậc đáng kính (snp4.7, snp5.x), nhưng ở đây vị tỳ-kheo (người hỏi) nói với ngạ quỷ, bản dịch chọn “hỡi bạn” để không đẩy ngạ quỷ lên vị trí bậc đáng kính khi ngay ở 1.1 người hỏi gọi người kia là “ngươi”.
    + `ropite` (8.4), `papā` (8.5): `pokkharaññā` → “hồ sen” (dn17:1.22 dùng “hồ sen”), `udapāna` → “giếng nước” (ud7.9, ja271), `papā` → “trạm nước uống” (không có tiền lệ trực tiếp; `papā` là chỗ cấp nước uống dọc đường).
    + `dīpa` (12.4) → “hòn đảo”: pv31:4.4 (1/1 tiền lệ); nghĩa gốc cũng có “chỗ nương tựa”.
    + `dukkhaṁ vedissa vedanaṁ` (16.2) → “sẽ chịu cảm thọ khổ đau” (theo pv10:15.2) — `vedissa` là thì tương lai; không hóa thành thì quá khứ.
    + `Matteyyā hotha petteyyā … jeṭṭhāpacāyikā … sāmaññā … brahmaññā` (19.1–19.3): theo an3.36:1.6 và an3.37:1.2 (“hiếu với mẹ, hiếu với cha, kính sa-môn, kính bà-la-môn, tôn trọng bậc trưởng thượng trong gia tộc”). dhp332 dịch `matteyyatā` “phụng dưỡng mẹ”; chọn “hiếu với” (7 lần ở tầng) cho cả `matteyya` và `petteyya`.
  - Dấu nháy và người nói: Pāli có nháy kép “ ” ở 8 khoá — `1.1`/`1.4` (lời hỏi), `2.1`/`2.4` (ngạ quỷ đáp), `3.1`/`3.4` (hỏi tiếp), `4.1` mở và `19.4` đóng (toàn bộ lời kể từ kệ 4 đến kệ 19). Bản Việt khớp Pāli từng khoá, nháy đơn 0/0, dấu lược `…` 0/0 (Pāli không có `…` nào, cũng không có `(…)`).
  - Bất định — ghi lại, không thêm vào thân kinh:
    + `paṇṇānaṁ` (4.1): hiểu là sở hữu cách số nhiều “của người Paṇṇa”; Pāli không giải thích thêm và tên này không có tiền lệ trong tầng, nên giữ nguyên Paṇṇa, không đoán vùng đất khác. `Erakaccha` (4.2) cũng thấy ở thig15.1:36.1 (`Nagaramhi erakacche`).
    + `asīti sakaṭavāhānaṁ hiraññassa` (5.1–5.2): “xe chở đầy” là cách hiểu `vāha` “lượng một xe chở”; `hirañña` dịch “vàng bạc” (snp2.7, snp4.1) còn `jātarūpa` (5.3) dịch “vàng” — hai chữ này đứng gần nhau nên có thể chồng nghĩa; không phân xử được từ Pāli.
    + `ropite` (8.4): hình thái nam tính số nhiều cạnh `ārāmāni` trung tính; dịch “những vườn cây đã được trồng” (phân từ quá khứ bị động của `ropeti`), có thể đọc là “khi được trồng”.
    + `saṁyamo so vināso, yo vināso so saṁyamo` (11.1–11.4): đảo ngữ có chủ ý trong Pāli, dịch sát chữ; nghĩa “tự chế” ở đây — lúc nhà giàu không bố thí vì “giữ gìn tài sản” (12.1–12.2) — là cách hiểu theo ngữ cảnh kế bên, không phải chữ của Pāli.
    + `karontānaṁ` (7.3): đứng cạnh `dadantānaṁ` nhưng không có tân ngữ; dịch “đang làm phước”, thêm tân ngữ ngầm theo ngữ cảnh bố thí ngay trước — đây là chỗ duy nhất bản dịch bổ sung một tân ngữ ngầm, nên ghi ở đây.
    + `uppaccāpi palāyataṁ` (18.4): “dù có bay lên mà chạy trốn” — `uppacca` là tuyệt đối từ “bay lên / nhảy lên”; theo ud5.4:5.4 (`upeccapi`, cùng khuôn).
    + `taṁ vo vadāmi` (17.1): `taṁ` đọc là “vì thế”; có thể là “điều ấy”. Không đổi nghĩa chính của kệ.
    Vì các chỗ trên và thiếu bản Anh độc lập, `semantic_fidelity` 9.0 và `ambiguity_integrity` 8.6.
  - Kiểm tra: 84/84 khoá đúng tập và thứ tự Pāli; NFC, không khoá rỗng, không khoảng trắng thừa; nháy kép khớp Pāli từng khoá (8 khoá có nháy / 84), không Pāli lọt vào thân bản dịch ngoài tên riêng và thuật ngữ giữ nguyên (Petavatthu, Ubbarivagga, Dhanapāla, Erakaccha, Paṇṇa, Yama). Đã đọc đối chiếu từng cặp Pāli↔Việt.
  - technical_integrity 9.6: cổng kỹ thuật do người điều phối chạy — npm run validate; npm test; npm run check; npm run build.
