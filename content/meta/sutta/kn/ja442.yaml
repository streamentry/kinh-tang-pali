notes: |-
  **Đo lại ba mệnh đề.** `0.1` Pāli `Jātaka` → giữ Pāli (410/426 tệp `ja`, đối chiếu
  16 tệp *Chuyện Tiền Thân*). `0.2` `Dasakanipāta` → *Bộ Mười Bài Kệ* **5** so với
  *Bộ Mười Bài Kinh* **4**; cả bốn tệp sau đều nằm ở `thag10.2/.4/.5/.6`, tức
  Theragātha, còn năm tệp *Bộ Mười Bài Kệ* đều là `ja449/451/452/453` — trong chính
  Jātaka là đồng loạt, nên theo đa số và theo đúng nghĩa `-nipāta` (bộ mười bài kệ).
  `0.3` `Catudvāravagga` → *Phẩm Bốn Cửa* 5/5 (`ja449/451/452/453` + `ja451`), đồng loạt.

  **Tiêu đề.** `0.4` Pāli `4. Saṅkhajātaka`; tầng `name/` đã ghim (`ja-name:497.ja442`)
  đặt *The Brahmin Saṅkha*. `ja:0.4` trong tầng Việt là *N. Kinh <tên>* 392/426, nên tôi
  dùng *4. Kinh Bà-la-môn Saṅkha*, và `:11.1` theo mẫu `<tên> thứ tư.` (`ja104:2.1`,
  `ja114:2.1`, `ja124:2.1`). Tên riêng `Saṅkha` giữ nguyên Pāli theo đúng nguồn; tầng Việt
  cũng dùng `Saṅkha` cho bản dịch Việt hiện hành của Tiểu Bộ (đối chiếu ngoài kho).

  **Nguồn đọc thêm — nói thẳng là ngoài commit đã ghim.** 0 tiền lệ Pāli trùng nguyên văn
  ở bài khác cho `ja442` (khác `ja428`), và bài này toàn là hội thoại giữa Bà-la-môn
  Saṅkha với một nữ thần nên nhiều từ chỉ có nghĩa khi đọc chú giải. Tôi đã đọc chú giải
  `Jātaka-aṭṭhakathā` (bản chép `442.Saṅkhajātakavaṇṇanā`) để phân xử, và ghi rõ chỗ nào
  dựa vào nó. Tầng đã ghim **không** có chú giải, nên đây là bằng chứng ngoài provenance;
  vì vậy source_provenance và ambiguity_integrity bị hạ.

  **Chỗ dựa vào chú giải, từng chỗ.**
  - `2.1` `Subbhū subhā suppaṭimukkakambu`: chú giải tách ba từ thành ba danh từ
    (`subhamukhā` = có khuôn mặt đẹp; `pāsādikā uttamarūpadharā` = dáng dẻi đẹp cao quý;
    `paṭimukkasuvaṇṇālaṅkārā` = đeo trang sức vàng đã hoàn toàn giải thoát), nên tôi dịch
    thành một câu ba vế thay vì giữ `Subbhū` như tên riêng. Bản `sya1ed/sya2ed` còn đọc
    `subbhā`, `pts-vp` đọc `subbhu` — cả ba đều là dạng từ kêu với danh từ, không phải
    tên, nên cách tôi chọn là nhất quán với chú giải.
  - `1.3` `Athakkhaṇe dassayase vilāpaṁ`: chú giải đọc `vilāpa` ở đây là câu nói cụ thể
    (“ta là kẻ giữ ngày trai”), nhưng Pāli căn chỉ nói *bày tỏ một lời thoại*; tôi giữ
    nghĩa chung và không thay bằng câu cụ thể, vì thay là sẽ đưa nội dung chú giải vào
    thân kinh.
  - `7.1` `yiṭṭhañca hutañca`: chú giải tách rõ — `yiṭṭha` = cho qua bàn thí, `huta` =
    cho qua bữa khách. Tôi dịch *dù qua bàn thí hay bữa khách*.
  - `2.4` `Saddhāvittā` (bản `bj` và `pts-vp` đọc `saddhācittā`): chú giải nói `saddhā` là
    lòng tin và `cittā` là `tuṭṭhacittā`, tức tâm thoải mái; tôi dịch *với lòng tin và tâm
    hoan hỷ*.
  - `5.3` `Anukampikā no ca paduṭṭhacittā`: chú giải đọc là *có lòng thương xót và không có
    tâm ý xấu xa*; tôi dịch *ta có lòng thương xót, lại có tâm trong sạch*, giữ đúng
    lượng từ `ca`.

  **Ba chỗ phải tự quyết.**
  - `1.2` `Diṭṭhā tayā samaṇabrāhmaṇā ca`: chú giải giải bằng nghĩa *đã đãi các Sa-môn
    Bà-la-môn*, nhưng chữ `diṭṭhā` nghĩa đen là *đã thấy*, và tôi giữ nghĩa đen để
    không đưa nghĩa chú giải vào thân kinh.
  - `9.1` `phalakūpapannā`: 0 tiền lệ trong tầng Việt. Tôi dịch *hùng hăng bức hiếm*;
    `phalakū` là kẻ cưỡi lên người khác, ép nhận. `9.2` `erakavātayuttā` tôi dịch *bị xóa
    vào cày* theo nghĩa gốc (bò bị xóa vào cày).
  - `10.4` `Upānayī nagaraṁ sādhuramman`: `Upānayī` là ngôi thứ ba số ít của thể bị động
    tương lai nên tôi dịch *sẽ đưa tôi vào thành, đến gần bên ngài*; nếu đọc là chủ ngữ
    thì phải đổi sang *nàng ấy sẽ được đưa vào thành*. Cốt truyện bản chép cho thấy nữ thần
    là người được đưa đi, nên tôi giữ cách đọc thứ nhất và ghi bất định ở đây.

  **Thuật ngữ — tiền lệ đếm được trong chính tầng Việt.** `brāhmaṇa` → *Bà-la-môn*
  (452 lần); `samaṇa` → *Sa-môn* (57); `pañjali` → *chắp tay* (46); `devī` → *thiên nữ*
  (42, vd. `vv25:1.2`, `vv27:1.2`, `vv28:1.2`, `vv42:1.2`) thay vì *nữ thần* (1);
  `upāhana` → *dép* (5, vd. `tha-ap` “một cây lọng và một đôi dép”); `yakkha` → *yêu quái*
  (7, vd. `pv46:1.2` “ngươi là ngạ quỷ, yêu quái, người hay chư thần”, `pv3:3.4`,
  `tha-ap121:1.3`). Lưu ý: ở `ja392`/`ja398` từ `yakkha` đứng như từ xúc phạm thì tầng
  dịch *dạ-xoa*, nhưng ở đây `yakkha` là câu hỏi về loài (`Devī nusi tvaṃ uda mānusī nu`)
  nên không dùng cách gọi ấy.

  **Dấu lược:** 0/46 khoá có `…pe…`; bản Việt không có dấu lược nào. Nháy kép mở ở
  `1.1, 2.1, 3.1, 4.1, 5.1, 7.1, 8.1, 9.1, 10.1` và đóng ở `1.4, 2.5, 3.4, 4.4, 6.4,
  7.4, 8.4, 9.4, 10.4` — đúng y hệt vị trí trong Pāli đã ghim, kể cả việc trích dẫn lời
  nói ở `2.3` và `4.2` dùng nháy cong bên trong.

  **Triangulation:** không có tầng Anh đã ghim cho uid này nên bài chỉ dịch từ Pāli đã
  ghim cùng commit (`11c9d708978cde8ba61096d8a75f7ddfb846f639`). Không chạy được
  `npm run validate|test|check|build` theo lệnh phân công đợt này, nên technical_integrity
  là 9.6.