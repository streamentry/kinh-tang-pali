  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 13 khoá chênh lệch lớn nhất → khác nghĩa 4: sửa 0, giữ 2, bất định 2. Không có bản Anh hay bản Việt độc lập khác.
  - Giữ: `2.1` `suppaṭimukkakambu` (bản mù giữ chữ `kambu`; bản dự án "vòng vàng" theo tiền lệ `kambukāyūradharā` ở `pv24:6.3`, `ja506:31.1`); `7.2` `sabbassa no issarā tvaṁ sugatte` (bản mù bỏ `no`, bản dự án giữ "đối với chúng tôi").
  - Bất định: `1.3` `athakkhaṇe` (đọc `atha khaṇe` "ngay lúc này" hay `atha akkhaṇe` "vào lúc không phải thời"; Pāli chưa phân xử, bản dự án giữ "ngay lúc này"); `9.2` `erakavātayuttā` (loại gió `eraka` chưa rõ, giữ chữ Pāli).
  - Chín khoá còn lại (`0.2`, `0.4`, `2.2`, `6.2`, `6.3`, `9.1`, `10.2`, `10.4`, `11.1`) chỉ khác diễn đạt. Rà đối kháng toàn bài (nháy, số, xưng hô tôi/ngài/nàng, thuật ngữ): không có lỗi mới.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; quét có hệ thống Pāli trùng toàn kho: 2.2 ja524:24.2, 3.4 = 4.4): sửa 6 khoá, chỉ dấu câu/khuôn — 1.4, 3.4, 4.4, 7.4 bỏ dấu chấm thừa sau "?”"; 10.4 dời dấu chấm ra sau nháy đóng theo Pāli; 11.1 thêm dấu phẩy theo khuôn "Kinh X, thứ tư.". Không thấy lỗi nghĩa mới; 2.2 khớp ja524. Bất định giữ nguyên: `athakkhaṇe` (1.3, "ngay lúc này" hay "không phải lúc"; cũng nghĩa `vilāpaṁ` là than van hay nói một mình, vì người hầu không thấy vị thiên nữ), `erakavātayuttā` (9.2).

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
