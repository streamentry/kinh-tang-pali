notes: |-
  `Varuṇavagga` → "Phẩm Cây Varuṇa" (đúng 1 tiền lệ ja79, còn lại 0). `Asaṅkiyajātaka` là
  tên phẩm, không phải tên riêng, nên dịch "Kinh Không Hề Ngờ"; Sujato dịch "Unsuspecting" và
  tên tại SuttaCentral là "Fearlessness" (ja-name:85.ja76). `Asaṅkiyomhi` = "ta còn ngây thơ",
  `asaṅkiya` = không biết ngờ, chưa từng cảnh giác. `samārūḷha` = đã lên, đã bước lên (thì), dịch
  "Ta đi thẳng vào con đường ngay thắng" — giữ `ujum` = ngay thắng và `maggam` = con đường.
  `mettāya karuṇāya ca` là hai danh từ đứng ngang nên dịch "với lòng từ bi và lòng trắc ẩn"; tầng
  dùng "thương yêu" cho `mettā` ở Tăng Bộ và "trắc ẩn" cho `karuṇā`, tôi theo đúng phân vai ấy vì
  hai chữ Hán–Việt đó quen thuộc và sắc.
  Vì `cần` RỖNG, tôi tự quét MỌI khoá — sạch. Không chạy npm (đợt này cấm) nên technical_integrity
  = 9.6.
