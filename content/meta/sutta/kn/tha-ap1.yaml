notes: |-
  Dịch từ Pāli root tại commit đã ghim; đủ 336 khoá, thứ tự và tập khoá khớp Pāli, không có khoá ngoài Pāli. Đây là bài mở đầu của Therāpadāna, không có phần giới thiệu hay kệ khai đề riêng: 0.1 đến 0.3 là tiêu đề, 1.1 là câu kính lễ, 2.1 đến 5.4 là đoạn dẫn nhập (Ānanda hỏi, Đức Phật đáp và bắt đầu kể), 6.1 đến 6.4 là lời mời lắng nghe, 7.1 đến 83.4 là lời Đức Phật tự thuật việc phát nguyện thời quá khứ, 84.1 là lời kết, 85.1 là dòng chốt. Người nói là Đức Phật từ 3.3 đến 83.4 nên đại từ ngôi thứ nhất dịch là Ta; câu hỏi của Ānanda (2.3 đến 2.4) là khối nháy kép riêng. Bài không có bản Anh Sujato, không có bản Việt phân đoạn và chưa có lớp english-project, nên không có đối chiếu English độc lập theo tầng; bản dịch dựa trên Pāli, tiền lệ cùng tầng (tha-ap2 là bài liền kề có cùng khuôn dẫn nhập, cp35 và bv có cùng công thức ba-la-mật) và một tham chiếu phụ nêu ở mục Coverage English.

  Tên bài và tên phẩm. 0.3 và translationTitle là cùng một chuỗi, Bài Kệ Tuyên Ngôn Về Các Vị Phật, theo tha-ap2 (Bài Kệ Tuyên Ngôn Về Các Vị Phật Độc Giác). Pāli ở 0.3 (Buddhaapadāna) không bắt đầu bằng số nên bản Việt không thêm số thứ tự. Kiểu mở đầu tên: đo ở phạm vi gần (tha-ap2 đến tha-ap60 đã có) là Bài Kệ Tuyên Ngôn 34, Bài Kệ Tuyên Ngợ 20, Ký Sự Về 3; đo toàn nhóm tha-ap đã có (558 tệp) là Bài Kệ Tuyên Ngợ 255, Ký Sự Về 154, Bài Kệ Tuyên Ngôn 141, Kinh Kệ 5. Hai phạm vi cho hai đa số khác nhau: bài này theo đa số gần (Tuyên Ngôn), vì Tuyên Ngợ là chính tả sai; cần người biên tập phán một lượt cho cả cuốn. 0.1 giữ Therāpadāna (547 trên 558 tệp). 0.2 là Phẩm Phật theo 9 khoá tha-ap cùng Pāli Buddhavagga (Phẩm Đức Phật 17 khoá và Phẩm Buddha 1 khoá đều là các bài mil); tầng tên của SuttaCentral ghi Chapter Beginning With the Buddha. 85.1 đọc lại tên bài ở 0.3 rồi thêm đã hoàn tất, theo tha-ap2:60.1. 1.1 theo 12 trên 14 khoá có Pāli này (Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác); 2 khoá còn lại dùng Đức Thế Tôn cho Bhagavato. 6.1 dịch buddhāpadānāni là những bài kệ tuyên ngôn về các vị Phật, đồng nhất với cách dịch apadāna ở tên bài và ở tha-ap2:1.1.

  Lời kết 84.1. Itthaṁ sudaṁ dịch Tôi nghe như vầy theo công thức của nhóm tha-ap (hơn 570 khoá Tôi nghe như vầy cho Tôn giả hay Trưởng lão; cp35:18.1, bài duy nhất có cùng công thức dhammapariyāya, dịch Nghe thế này). Pāli là dhammapariyāyaṁ số ít nên Việt là một pháp môn, không viết những bài kệ như công thức imā gāthāyo; abhāsitthāti dịch đã nói, không thêm đã từng (nhóm đã từng nói từng bị gọi là lỗi ở nhiều lát). Buddhāpadāniya là tên pháp môn nên giữ nguyên Pāli như một tên riêng và không đặt trong nháy, vì Pāli ở 84.1 không có nháy.

  Số Pāli: tiṁsapāramisampuṇṇā (6.3) là tiṁsa 30 nên ba mươi pháp ba-la-mật (viết pháp ba-la-mật để không bị đọc thành ba mươi ba); dasaṅgulī (7.3) là mười ngón tay; dasavidhā (70.1) là mười phương; dasasahassi (46.4) là mười ngàn, đọc là mười ngàn thế giới theo lokadhātu (72.1); sattaratana (14.4) là bảy thứ báu theo tha-ap24:9.1; pañcavaṇṇika (48.4) là năm màu; caturo (13.3) là bốn; catuddisā (41.1) là bốn phương; duve (56.1) là hai; paṭhamā (11.1) là thứ nhất; tidasa (50.4) là cõi trời Tam Thập, còn tāvatiṁsa (55.4) là Ba mươi ba theo tiền lệ; bahūnekasatā (18.1) và anekasate (26.1) chỉ là nhiều hàng trăm, không có số cụ thể; anekasahassiyo (33.4) là hàng ngàn. Không có cụm Tiṁsakappasahassa, sahassa đi với kappa hay lời thọ ký về số kiếp: Pāli của bài không có kappe hay kappa ngoài kapparukkha (cây ước ở 27.1) và không có bhavissati. Phần hướng về tương lai trong bài chỉ nằm ở các dạng nguyện hontu, bhavantu, tiṭṭhantu, passantu, suṇantu (37 đến 53, 72 đến 74) và hai dạng bhave ở 57.4 và 71.4; các dạng nguyện dịch là Nguyện, còn bhave dịch bằng sẽ. Không có phép tính số nào cần nhân thang lớn.

  Nháy và dấu lược: Pāli chỉ có hai khối nháy kép (mở ở 2.3 đóng ở 2.4; mở ở 3.3 đóng ở 83.4), không có nháy đơn và không có dấu ti; bản Việt khớp Pāli từng khoá, 0 lệch trên 336 khoá (mẫu số 336 khoá nhân bốn loại dấu), tổng mỗi loại dấu là 2 mở và 2 đóng, 0 nháy đơn ở cả hai bên. 2.4 Pāli kết ”. còn Việt kết ?” vì là câu hỏi; 83.4 Pāli kết ”. còn Việt kết .”. Pāli không có … hay (…) ở khoá nào nên bản Việt cũng không có; phép lược chạy với mẫu số 336 khoá và cho 0 khoá có dấu lược ở cả hai bên.

  Tái dùng tầng: 44 khoá có Pāli trùng nguyên văn với các bài khác (972 cặp đã dò); 37 khoá dùng đúng bản Việt của ít nhất một bản đã có, 7 khoá khác có chủ ý (2.1, 7.2, 7.4, 23.2, 27.2, 55.4, 76.2): 2.1 bỏ nháy mở của tha-ap2:2.1 vì Pāli ở bài này không có nháy; 7.2 và 23.2 dịch số nhiều các bậc Dẫn Đạo thế gian cùng Tăng đoàn vì sasaṅghe lokanāyake là đối cách số nhiều (các bản cũ dịch số ít); 7.4 dịch Ta đã cúi đầu đảnh lễ (abhivādayiṁ: 46 khoá tha-ap, 40 khoá đảnh lễ, 2 khoá lễ bái); 27.2 không theo sn4.4:4.2 vì ở đó ye dibbā ye ca mānusā bổ nghĩa cho danh từ khác (lưới); 55.4 dùng Ta vì người nói là Đức Phật (bản cũ ta 36, tôi 15, con 5 tùy người nói); 76.2 theo tinh thần cp35:12.2 (đã nỗ lực tinh tấn tối thượng) vì Pāli không có đại từ. Pāli trùng trong chính bài: 10 nhóm gồm 44 khoá (5.4 với 6.4; 7.2 với 23.2; 25.4 với 26.4; 37.4 với 38.4; 44.4 với 47.4; lặp ba dòng đầu ở 59 đến 67 mỗi dòng 9 khoá; 75.4 đến 78.4; 79.4 đến 81.4); mọi nhóm có bản Việt giống hệt nhau, 0 cặp có bản Việt khác. Hai dòng 25.3 và 26.3 khác Pāli ở số (vattamānā và vattamāne) nhưng dịch cùng nghĩa. Dòng chốt 59 đến 67 chỉ khác nhau ở vế thứ tư.

  Thuật ngữ và số đếm. lokanāyaka dịch bậc Dẫn Đạo thế gian (toàn tầng Dẫn Đạo 162, Lãnh Đạo 17 trên 213 khoá; nhóm tha-ap Dẫn Đạo 118, Lãnh Đạo 17). mahesī là Đại Ẩn Sĩ (69 trên 82 khoá của nhóm tha-ap). dhammarājā là Pháp Vương (24 khoá Pháp Vương, 12 khoá vua Pháp trên 74 khoá). sotāpanna là Nhập Lưu (toàn tầng Nhập Lưu 133, Dự Lưu 82 trên 223 khoá; nhóm tha-ap chỉ có 1 khoá là Dự Lưu ở tha-ap535, nên hai phạm vi cho hai đa số khác nhau; cần người biên tập phán). pāsāda là lâu đài (toàn tầng lâu đài 78, cung điện 74, tòa lầu 10; nhóm tha-ap 8, 5, 3), còn bhavana (25.4, 26.4, 42.4) là cung điện (nhóm tha-ap nơi ở 12, cung điện 8; chọn cung điện vì đi với động từ bước lên và vì cùng là tòa nhà đã dựng). sahassa là ngàn (toàn tầng ngàn 1077, nghìn 236; nhóm tha-ap 315, 56). nekkhamma là xuất ly (toàn tầng xuất ly 187, xuất gia 17, ly dục 31 trên 254 khoá; riêng cp xuất gia 10 trên 10): bài này theo đa số toàn tầng và nghĩa chính xác hơn; cp35:11.3 dùng ba-la-mật xuất gia, hai phạm vi cho hai đa số khác nhau, cần người biên tập phán. abhiññā là thắng trí (569 trên 1399 khoá). cakkavāḷa là cõi thế giới (bv29:12.4). pallaṅka là ghế ở 24.3, 46.1 (nhóm tha-ap ghế 13), là thế kiết già ở 31.4 (kiết già 89, kiết-già 34). tidasa là Tam Thập (nhóm tha-ap Tam Thập 7, Ba mươi ba 7). acintiya là không thể nghĩ bàn theo tha-ap549:14.4, vv84:19.3, thag17.1:19.4 (ba khoá cùng thể kệ; 8 khoá bất khả tư nghì thuộc mil, pv37 và vv44). ratana là châu báu (nhóm tha-ap 31 khoá châu báu). kapparukkha giữ Pāli theo tha-ap42 (3 khoá giữ Pāli, 0 khoá cây như ý); karavīka giữ Pāli (5 giữ, 5 ca-lăng-tần-già); bherī và vīṇā giữ Pāli kèm trống và đàn (trống 15 trên 15 khoá bherī). masāragalla, Kāsi, Pattuṇṇa, dukūla, Jambonada, Sineru, indagopaka giữ Pāli như tên chất liệu hay tên riêng (indagopaka theo ja482:3.3, masāragalla theo tha-ap24:5.3, Pattuṇṇa theo bv25:11.1). satta là chúng sinh. saññino và asaññino là có tưởng và không có tưởng (có tưởng 23 khoá; hữu tưởng 0). pāramī là ba-la-mật (cp1 đến cp5 và bv).

  Bất định (không thêm vào thân kinh). (1) 5.3 và 5.4 manasāyeva hutvāna, dhammarājā asaṅkhiyā: dịch sát chữ (chỉ bằng ý mà đã thành; các Pháp Vương vô số kể); cú pháp của hai dòng không có động từ xác định, và 5.4 lặp 6.4; hiểu 5.3 là thành tựu quả vị chỉ bằng ý (cả bài là cúng dường bằng ý ở 8.4, 19.4, 54.1), cách hiểu khác là chưa loại trừ. (2) 18.1 na naṁ bahūnekasatā: na naṁ không giải được trong Pāli ghim (có vẻ là dạng văn bản hỏng hay lược); dịch theo mạch nhiều hàng trăm (giường làm bằng pha lê, bạc, ngọc, hồng ngọc, masāragalla ở 18.2 đến 18.4). (3) 10.4 kontacchattehi: konta là ngọn giáo hay không chắc; dịch chung là lọng che. (4) 15.1 olokamayā padumā: oloka hiểu là ô sáng hay ô thoáng; dịch hoa sen nơi những ô cửa sáng; không có tiền lệ cho cả cụm. (5) 15.2 vāḷavihaṅgasobhitā: dịch thú dữ và chim muông; không xác định là hình vẽ hay hình chạm. (6) 11.2 vimalabbhasamā: dịch sát chữ là mây không vết bẩn; cách hiểu khác là bầu trời không mây. (7) 12.1 pavāḷaṁsā: aṁsā hiểu là phần; cách đọc khác chưa loại trừ. (8) 20.4 dhārayantā sutiṭṭhare: chủ ngữ bị lược trong Pāli; dịch giữ ẩn (đang cầm giữ, đứng thật vững vàng) thay vì thêm người hay đuốc. (9) 29.1 dibbavatthasamā: đọc sát chữ là giống như y phục cõi trời; cách đọc khác là dibbacakkhu (thiên nhãn); chưa phân xử được, và 29.1 đến 29.4 là một câu mà chủ ngữ ở 30.2. (10) 32.1 và 32.2 gocaraṁ sabbabuddhānaṁ, jhānaratisamappitā: đọc là các vị đắm trong niềm vui thiền thuộc cảnh giới của chư Phật. (11) 34.2 sabbaññumālayaṁ: đọc là nơi trú của bậc Toàn Tri; ālaya còn nghĩa là sự bám chấp. (12) 42.3 sayañca pupphā muñcitvā: chủ ngữ của muñcitvā không rõ (cây hay hoa); dịch giữ hoa tự buông rời. (13) 44.3 saṅgīti: đọc là buổi hòa tấu; nghĩa khác là buổi tụng đọc chung. (14) 50.4 tidase sukataṁ kataṁ: tidase là vị trí cách, dịch đã khéo làm, hướng đến cõi trời Tam Thập; từ hướng đến là cách đọc theo mạch, không có từ tương ứng trực tiếp trong Pāli. (15) 57.4 và 71.4 bhave: đọc là dạng nguyện hay giả định, dịch bằng sẽ để phân biệt với các động từ hiện tại homi, bhavāmi ở 57.1 và 57.2. (16) 69.4 bhavāmahaṁ: dịch Ta sẽ là Đức Phật, hiểu là lời nguyện lúc làm các việc ở 69.1 đến 69.3; cách đọc hiện tại (Ta là Đức Phật ở đời) chưa loại trừ. (17) 2.1 và 2.2: tathāgataṁ ở đối cách là đối tượng của apucchi; Việt giữ y như tha-ap2 (Đức Như Lai đang ngự tại rừng Jetavana, rồi Bậc hiền giả xứ Videha, thân cúi mình, đã hỏi) để thống nhất, nên cấu trúc nhờ ngữ cảnh. (18) 84.1 sambhāvayamāno dịch đề cao (hạnh Phật của chính Ngài); từ này chỉ có một tiền lệ là cp35:18.1 (làm hiện ra), và nghĩa tán dương hay làm rõ cũng chưa loại trừ. (19) 21.1 esikā thambhā dịch cột trụ, không thêm cổng; 21.3 sāramayā dịch bằng lõi gỗ. (20) 46.4 dasasahassiparamparā: thêm thế giới theo mạch (72.1 ettake lokadhātumhi); Pāli ở 46.4 không nêu. (21) 17.2 haripiñjaraṁ dịch vàng nâu; 17.1 mañjeṭṭhakaṁ dịch đỏ thẫm. (22) 82.2 sabbaso dịch tất cả; nghĩa đen là trọn vẹn, mọi mặt. (23) 23.4 nimminitvā là phân từ nhưng dịch thành động từ đã hóa hiện để câu có vị ngữ, vì chủ ngữ phân từ (Ta) và các động từ ở 24 (các vị) khác nhau.

  Coverage English: mẫu số là 2 khoá (Pāli có nội dung từ 40 ký tự, bỏ khối :0): 1.1 (47 ký tự, câu kính lễ) và 84.1 (107 ký tự, lời kết); 334 khoá còn lại gồm tiêu đề và các vế kệ ngắn dưới 40 ký tự, nên cổng coverage hầu như không đo được gì. english-sujato tại commit đã ghim chỉ có 9 nhóm cp, dhp, iti, ja, kp, snp, thag, thig, ud (755 tệp) và không có tệp thân kinh tha-ap nào (tệp tha-ap duy nhất là tệp tên, mà các mục tha-ap1 trong đó để trống), nên Sujato phủ 0 trên 2; vietnamese-current chỉ có Pháp Cú; english-project chưa có entry cho bài này. Tham chiếu phụ, không phải tầng: bản Việt toàn văn không phân đoạn của Bhikkhu Indacanda (dùng để tra cứu, không phải tầng store) được đọc để hiểu mạch lạc; không sao chép câu chữ, và không tính vào coverage; cp35 và bv có cùng công thức ba-la-mật và cũng không tính vào coverage. content/meta/reference-gaps.yaml chưa có entry cho tha-ap1; vì mẫu số là 2 và cả hai khoá là công thức nên chưa cần ghi nhận gap, người điều phối vẫn cần chạy npm run reference:gaps.

  Lỗi ngoài lát (báo, không sửa): cp35:18.1 dịch Itthaṁ sudaṁ thành Nghe thế này và abhāsitthāti thành đã từng nói, và đặt tên pháp môn là Tiều Tích Của Đức Phật, khác cách bài này và nhóm tha-ap (đã nói; Tôi nghe như vầy; giữ Buddhāpadāniya).

  Cổng kỹ thuật chưa chạy (bị cấm trong lát này) nên technical_integrity đặt 9.6, người điều phối cần chạy: npm run validate, npm test, npm run check, npm run build.
