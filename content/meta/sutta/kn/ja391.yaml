notes: |-
  Bản dịch dựng từ Pāli root (content/catalog/sutta/kn.json → .cache/upstream, 33/33 khoá), không có tầng Anh đã ghim để đối chiếu — xem blocking_errors. Cổng coverage đo được là **0/0**, tức mẫu số bằng 0: bài truyện ngắn, khoá dài nhất 35 ký tự, không khoá nào đạt ngưỡng 40 ký tự của `source/layers.yaml`.
  Điểm ít tin cậy nhất: `:0.3` là tên phẩm `Kharaputtavagga`. Người biên tập giao rằng mỗi truyện một tên riêng và 0 tiền lệ thì phải ghi rõ. Đo lại trên 449 tệp `ja` đã có bản dịch: tên phẩm này có tiền lệ **10/10** tệp dùng "Phẩm Kharaputta" (đo sau khi ghi lát này; trước đó 9 tệp lân cận ja386–ja394, nay thêm ja391). Vì vậy KHÔNG phải 0 tiền lệ; dùng đa số đo được "Phẩm Kharaputta". Ghi rõ con số 10/10 để người điều phối gộp. (Tầng tên `name/sutta/ja-name_translation-en-sujato.json` đã ghim không chứa `Kharaputtavagga` — nó chỉ khớp `pancakanipata` và `chakkanipata` — nên không thể chốt bằng bảng tên của SuttaCentral cho tên phẩm này.)
  `:0.2` Chakkanipāta → "Bộ Sáu Bài Kệ": đo 17/17, một cách duy nhất, không có đối chứng. `:0.4` và cột bài `:8.1` theo mẫu "Kinh X, thứ N." như ja372 và ja383.
  Bối cảnh đọc được từ Pāli: bài này là hội thoại giữa một Bà-la-môn xấu xí và Đức Thế Tôn. Người Bà-la-môn ở 1.1–1.4 (`Dubbaṇṇarūpaṁ tuvam ariyavaṇṇī`, "kẻ dáng vẻ thảm hại, còn ngươi quân phong cao sang") đang ra lệnh cho bậc quân phong cao sang phải lễ bái mình; ở 2.3–2.4 (`Sakkohamasmī tidasānamindo`) thì chính người nói câu đó tự xưng là Sakka, chúa tể ba mươi ba vị trời. Nghĩa là hai nhân vật lớn của truyện cùng nói một dòng kệ, và khoá 1.1 cứ gọi người nghe là "quân phong cao sang" trong khi lời ra lệnh thì do chính người xấu xí nói. Đã dịch theo đúng nghĩa từng khoá; không dàn cảnh để làm câu trôi.
  Song ngữ ở 1.4 (`Nāmaṁ parassattano cāpi brūhi`, "hãy nói cả tên kẻ kia lẫn tên ngươi") và 5.3 (`tuvañca sakka`) là điểm dịch khó nhất: Pāli ở 1.4 yêu cầu tên của *cả hai* người, còn ở 5.3 người nói lại gọi đối thoại là "ngươi, Sakka". Đã giữ đủ hai vế trong từng khoá.
  Bản nháp trải qua một vòng review đối kháng và đã bắt được sáu lỗi của chính bản nháp, kể lại vì tất cả đều là loại lỗi mà harness không báo: (1) 1.1 lặp chữ "ngươi" hai lần trong cùng một câu với hai chủ thể khác nhau; (2) 1.4 chỉ dịch một tên trong khi Pāli đòi cả hai (`Nāmaṁ parassattano cāpi`); (3) 3.2 và 4.2 thêm chữ "đều" vào câu trong khi Pāli `Yo ... namassati` là số ít, không có nghĩa số nhiều — cùng một lỗi lặp ở hai khoá; (4) 4.3 thêm "đều" theo diễn giải của 3.2, kéo theo luôn; (5) 5.2 dịch `vāsavaṁ` thành "là bậc chúa trời", tức thêm một vị danh mà Pāli không có ở khoá đó — `Vijjādhara` mới là "mang điện", và tên truyện ở `:0.4` đã giữ Pāli, nên bản dịch phải nhất quán với tên đó; (6) 7.3–7.4 gộp `abhivādayissaṁ` (ta sẽ bái lễ) vào 7.4 và bỏ mất vế gọi `devinda` (ông chúa chư thiên) như một địa chỉ riêng.
  Thuật ngữ, kèm số đếm trên tầng Việt đã có: `Sakka` giữ nguyên Pāli (đo 15 lần). `tidasānamindo` dịch "chúa tể của ba mươi ba vị trời" (`tida` = ba; `devānaṁ` dịch "chư thần" ở ja429 và ja430, ở đây dùng "vị trời" cho khớp câu kệ). `bhikkhu` dịch "tỳ-kheo" (đo 12 lần), `pañjaliko namassati` dịch "chắp tay lễ kính" (`chắp tay` đo 9 lần). `puññāni anappakāni` dịch "những việc phước thiện không phải là ít" — dùng lại đúng nguyên văn của ja378:2.4, vì PĀLI `Kāhāmi puññāni anappakāni` ở 5.4 **trùng nguyên văn** với ja378:2.4. `Diṭṭheva dhamme` dịch "ngay trong đời này", cũng theo tiền lệ ja37:1.3 và ja393:1.3. `mānaṁ` dịch "lòng kiêu mạn" (đo 2 lần `kiêu mạn`, 1 lần `kiêu ngạo`). `devarājetamatthaṁ` (3.3) dịch "một điều về vua chư thiên"; đây là cách đọc của tôi, `devarāja` còn có thể là "vua chư thiên" theo nghĩa ghép, ghi lại vì không có tầng Anh để đối chiếu.
  Bài trùng nguyên văn: câu `Sakkohamasmī tidasānamindo` còn xuất hiện ở ja512:30.4, nhưng **ja512 chưa được dịch** (tệp Việt chỉ có 1 trên 129 khoá) và nằm ngoài lát này nên không đụng tới; ghi lại để người điều phối gộp khi làm tới ja512.
  Dấu lược: PĀLI của cả ba bài trong lát này **không có** `…pe…` lẫn `…` trần (đo: 0/99 khoá), nên quy tắc `…pe…` của BRIEF_VI3 §10.1 không phát sinh ở lát này; `_hvi` xác nhận dấu lược cân bằng trên cả ba bài. Dấu `”ti` cuối bài: đo 222 bỏ vs 207 giữ trên các khoá PāLI kết bằng `”ti.` trong bộ `ja`, đa số là bỏ, nên bỏ (như ja372 và ja383).
