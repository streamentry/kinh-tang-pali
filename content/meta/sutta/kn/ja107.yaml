notes: |-
  Không có bản Anh ở commit ghim (0/9 khoá): dịch từ Pāli một mình. Tiền lệ: bốn phương 68; què có 6 chỗ trong kho (dạng liệt kê tật), khañja đọc là người què.
  Bất định đã ghi: (1) sālittaka nghĩa không chắc — giữ toàn dạng Pāli ở tiêu đề/kết; (2) khañjappahārena chỉ dịch là cú đánh của người què, không suy ra ném đá dù tên chuyện gợi ý; (3) laddhā gāmā đọc thẳng là được các làng, không thêm chủ thể chiếm đoạt.

  Quyết định hội đồng biên tập 2026-10-16: A13 — :1.4 (bỏ dấu chấm thừa sau ngoặc kép); C1 — :0.4, :2.1, translationTitle (bỏ đuôi jātaka, giữ phiên âm tên riêng); C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
