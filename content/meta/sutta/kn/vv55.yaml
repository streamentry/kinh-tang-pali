notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho vv55.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 27 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Kiểm toán độc lập 2026-10-11: đọc đối kháng cả 27 khoá theo cặp Pāli↔Việt; sửa 12/27 khoá (1.1, 1.2, 2.1, 2.3, 2.4, 3.1, 3.3, 4.3, 4.4, 5.2, 5.4, 6.3); 15 khoá còn lại giữ nguyên. Điểm cũ (9.23) quá cao: bản trước không ghi bất định nào, và câu "đối chiếu chú giải" ở trên không kiểm chứng lại được trong kho nên không dùng làm căn cứ chấm.
  Đã sửa: `1.1` "cao vút bằng cột ngọc báu" (cú pháp rối, như thể cung điện cao nhờ cột) thành "cao vút, có cột bằng ngọc báu" (`uccaṁ ... maṇithūṇaṁ`, hai tính từ của vimāna); `1.2` "chu vi rộng mười hai do-tuần" thành "rộng mười hai do-tuần khắp bốn phía" (`samantato` là mọi phía; "chu vi" là một cách đọc khác về kích thước, không có trong Pāli; 7/10 khoá cùng Pāli dùng "khắp bốn phía"); `2.1` bỏ "vui chơi" (Pāli chỉ có `acchasi pivasi khādasi`: ngồi/ở, uống, ăn); `2.3` "Hương vị" thành "Vị" (`rasā`, không có `gandha`) và thêm `ettha` ("ở nơi đây"); `2.4` bỏ "múa lượn quanh chàng" (không có trong Pāli); `2.1`/`3.1` "chàng" thành "ngài" (người hỏi là Tôn giả Moggallāna nói với thiên tử; 9/11 khoá cùng Pāli dùng "ngài"); `3.3`/`6.3` "sắc tướng" thành "dung sắc" cho đúng một từ `vaṇṇo` đã dịch "dung sắc" ở `3.1`/`6.1` ngay trong cùng đoạn (đa số 24+ khoá toàn tầng); `4.3` bỏ "liền" và "giải thích" thành "giải đáp" (`viyākāsi`, 5/7 khoá cùng Pāli); `4.4` "quả báo của nghiệp này là thế" thành "rằng đây là quả của nghiệp nào": `yassa` là đại từ quan hệ/nghi vấn của mệnh đề gián tiếp do `viyākāsi` đòi, không phải "này" (lỗi dạng lan ở ~41 khoá khác trong họ; chỉ `vv12:3.4` đọc đúng); `5.2` "được ca ngợi bằng lời nói, suy tưởng trong tâm" thành "được xướng lên bằng lời, do tâm khởi vận" (`abhigīta` không có sắc thái "ca ngợi" bắt buộc, `pavattita` là "được vận hành, được khởi lên", không phải "suy tưởng"); `5.4` bỏ "thọ hưởng trọn vẹn mọi" thành "đầy đủ các" (`samaṅgibhūto`).
  Điểm đổi: semantic_fidelity 9.3 thành 8.8 (lỗi `4.4` và `5.2` là đọc sai quan hệ ngữ pháp, nay sửa nhưng `5.2` còn bất định); grammar_logic 9.3 thành 9.0; terminology 9.2 thành 8.8 (đã đồng nhất `vaṇṇo`, nhưng tiêu đề họ còn sai); vietnamese_clarity 9.3 thành 9.0 (`5.2` còn tối nghĩa vì bám sát Pāli); han_viet_balance 9.4 thành 9.3; source_provenance 9.5 thành 9.2; ambiguity_integrity 9.2 thành 8.4 (bản trước không nêu bất định nào dù có ba chỗ chưa phân xử). Không đổi: segment_alignment 10.0 (27/27 khoá khớp Pāli, đúng thứ tự), triangulation 7.5 (không có bản Anh độc lập), technical_integrity 9.6. final_score 9.23 thành 8.96.
  Bất định còn lại, không phân xử được: `5.2` `Vācābhigītaṁ manasā pavattitaṁ` là hapax trong toàn tầng Pāli đã ghim, không có đối chiếu; không rõ tính từ này bổ nghĩa cho `āyu` ("tuổi thọ được xướng bằng lời, khởi vận bằng tâm") hay chỉ việc làm phước đã nêu, nên chỉ dịch sát chữ. `1.4` `rucakatthatā` dịch "trải thảm vàng": cả "thảm" lẫn "vàng" đều là suy diễn (`rucaka` có thể là vàng hay đồ trang sức), giữ nguyên vì không phân xử được. `5.3` `puññakammo` là ngôi thứ ba trong lời thiên tử tự thuật; hiểu là tự chỉ mình, giữ "Người làm phước". `5.1` `dibbaṁ ... vassasahassam`: "cõi trời" có thể thuộc "ngàn năm" hoặc "tuổi thọ", bản dịch giữ nguyên tính mơ hồ của Pāli.
  Chưa sửa, lệch cả họ: `0.2` `Purisavimāna` dịch "Nam Hư Không" (Pāli không có `ākāsa`) và `0.3` "Phẩm Cỗ Xe Lớn"; không sửa riêng một tệp vì sẽ lệch cả bộ.
  Kiểm tra tay: 27/27 khoá đúng tập khoá và thứ tự Pāli; nháy kép khớp Pāli từng khoá (0 lệch); `3.2` và `6.2` cùng Pāli `…pe…` đều là "…" (1 cặp trùng, 0 lệch); NFC sạch, không Pāli lọt sang Việt. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Lượt cải thiện 2026-10-13: đọc đối kháng lại 27/27 khoá, đo tiền lệ trong 84 bài cùng họ Vimānavatthu (Pāli trùng nguyên văn), sửa 6/27 khoá (1.4, 2.2, 2.4, 3.3, 4.2, 6.3); 21 khoá còn lại giữ nguyên.
  `1.4` "cột lưu ly trải thảm vàng rực rỡ tuyệt đẹp" thành "cột bằng ngọc lưu ly, trải thảm rực rỡ tươi đẹp" (accuracy/terminology fix): chữ "vàng" là suy diễn về `rucaka` (hapax, chỉ có trong chính họ này, không có đối chiếu) và lại chồng với "rực rỡ" cho cùng một từ; 8/10 khoá cùng Pāli đọc đúng dạng mới. `2.2` "tiếng đàn trời tấu lên dịu dàng êm ái" thành "đàn hạc cõi trời tấu lên êm dịu" (terminology fix): `vīṇā` là "đàn hạc" ở 8 khoá toàn tầng, "cõi trời" cho `dibba` ở 9/9 khoá cùng Pāli và ở 2.3, 5.1, 5.4 trong chính bài (trước đó 2.2 là "trời"); "dịu dàng êm ái" là hai chữ cho một từ `vaggu`. `2.4` "trang điểm bằng vàng" thành "phủ vàng" (accuracy fix): `channa` là "được phủ/che", "trang điểm" thêm nghĩa làm đẹp không có trong Pāli; "phủ vàng" có tiền lệ ở 5 khoá toàn tầng. `4.2` "hỏi thăm" thành "hỏi" (accuracy fix): `pucchito` là "được hỏi", còn "hỏi thăm" trong tiếng Việt hiện đại thường là hỏi sức khỏe, lệch ngữ cảnh gạn hỏi về nghiệp. `3.3` và `6.3`: "mọi phương" thành "muôn phương" (terminology, theo đa số 41/59 và 26/54 khoá cùng Pāli) và dấu kết `?”.` thành `?”`, `”.` thành `.”` (style-only; đo toàn tầng ở khoá Pāli kết `”ti.`: `.”` 1.989 so với `”.` 497, `?”` 212 so với `?”.` 34).
  Điểm đổi: semantic_fidelity 8.8 thành 8.9 (bỏ ba chỗ thêm nghĩa ở 1.4, 2.4, 4.2; vẫn còn hapax `5.2` và `rucakatthatā` chưa phân xử nên không nâng nhiều); terminology 8.8 thành 9.0 (đồng nhất `dibba`, `vīṇā`, `sabbadisā` theo tiền lệ). Không đổi: vietnamese_clarity 9.0, grammar_logic 9.0, ambiguity_integrity 8.4 (bất định vẫn như trên, nay `1.4` chỉ còn một suy diễn "thảm"), triangulation 7.5 (không có bản Anh độc lập), technical_integrity 9.6. final_score 8.96 thành 8.99, mean thô của 10 điểm. Số Pāli: `dvādasa` 12, `sattasatā` 7 × 100 = 700, `vassasahassa` 1.000, đúng với bản dịch (0 lệch). Kiểm tay sau sửa: 27/27 khoá đúng tập khoá và thứ tự Pāli; nháy khớp Pāli từng khoá (0 lệch); 1 cặp Pāli trùng nguyên văn trong bài (`…pe…` ở 3.2/6.2), 0 lệch; NFC sạch. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (dịch 2011, đọc từ dòng tác giả và chân trang của tệp). Bản nguyên bài là văn xuôi, theo đúng thứ tự các khổ kệ, nên so được từng khổ ở mức đoạn, cả 27 khoá; ở 3.2 và 6.2 Pāli ghim chỉ có dấu lược `…pe…` còn bản nguyên bài viết đủ câu lặp, nên hai khoá ấy không có gì để so ngoài việc cùng khuôn với 3.1 và 6.1. Số: `dvādasa` mười hai, `sattasatā` bảy trăm, `vassasahassa` một ngàn đều khớp. 3 khoá bất đồng nghĩa → sửa 0, giữ 1, bất định 2. Giữ: 5.3 `ettāvatā ṭhassati puññakammo`: bản nguyên bài hiểu là chỉ với chừng ấy việc làm (chừng ấy là phương tiện) thì người làm phước tồn tại; bản này giữ “an trú chừng ấy thời gian” (chừng ấy là thời gian), vì liền sau 5.1 `vassasahassamāyu` (tuổi thọ ngàn năm) nên chừng ấy tự nhiên là chừng ấy tuổi thọ; Pāli của `ettāvatā` mơ hồ cả hai nghĩa, hai cách đọc cùng cho ý chính (người làm phước sống ở cõi trời chừng ấy). Bất định: 1.4 `rucakatthatā`: bản nguyên bài đọc `rucaka` là vàng (được trải lót bằng vàng); bản này viết “trải thảm rực rỡ” theo khuôn chung của họ (9 khoá cùng Pāli ở vv54, vv56–59, vv67, vv77, vv79, vv85, riêng vv70 giữ chữ Pāli). Chữ “thảm” là suy diễn đã ghi ở bất định trên, và nay có thêm một cách đọc độc lập nghiêng về vàng; không đổi canonical ở bài lẻ để khỏi lệch cả họ, nhưng người điều phối nên chốt một cách cho cả 10 khoá cùng Pāli; 5.2 `vācābhigītaṁ manasā pavattitaṁ`: bản nguyên bài thêm chữ “do” để thành nguyên nhân của tuổi thọ (do việc đã thưa bằng lời, đã vận hành bằng ý), bản này dịch sát chữ như hai tính từ đặt cạnh `āyu`; hapax, Pāli ghim không có dòng song song, nên giữ đúng chữ và ghi nhận cả hai cách đọc. Các khác biệt khác chỉ ở cách gọi (ngài và ngươi, tiên nữ và phụ nữ, đàn hạc và đàn vīṇā, người gác cổng và người giữ cửa…) không đổi nghĩa nên không tính. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Review đối kháng lại 27 cặp Pāli↔Việt, không thấy lỗi mới, không đổi khoá nào. Không gỡ blocker nào.

  Lượt rà soát 2026-10-15 (đợt 2, lô G5, Claude Sonnet 5.5 (Claude Code)): sửa 2.4: nāriyo "tiên nữ"
  đổi "nữ nhân" khớp vv54, vv77, vv79, vv85. Khoá 4.4 "quả của nghiệp nào" chưa đổi, giữ để người biên
  tập xem.

  Quyết định hội đồng biên tập 2026-10-16: A16 — 4.4 (`yassa kammassidaṁ phalaṁ` = "về nghiệp mà đây là quả báo" như 79 khoá cùng công thức).
