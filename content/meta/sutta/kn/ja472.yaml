  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dịch của dự án; so 12 khoá chênh lệch lớn nhất → khác nghĩa 0: sửa 0, giữ 12, bất định 2. Giữ vì bản mù khác diễn đạt hoặc sai: 6.4 (`anumajjhaṁ samācare`: “hãy hành xử theo lối trung dung” so với “hãy thực hành ở giữa”, cùng nghĩa), 2.3 (`sakaṇṭakaṁ`: “món còn xương gai” so với “vật có gai”), 7.4 (`na … arahasi`: “chớ … mà giết” và “không nên giết” trùng ý), 8.4 (`taṁ` là hoàng tử, “ném nó xuống ngay”, hai bản trùng), 3.1–3.2, 5.2–5.3, 12.3, 1.3. Bất định (c), cả hai bản đều ghi hoặc đều không chắc: 5.3 (`attaṁ mahante ṭhapetuṁ`, “đặt mình vào vị trí lớn”) và 8.3–8.4 (`tenāhaṁ paṭipajjissaṁ`). Ngoài phép so, đo lại tiền lệ `khattiya` trên toàn tầng: trong 858 khoá Pāli có chứa `khattiy-` (mọi biến cách) bản Việt đã có, “sát-đế-lợi” xuất hiện ở 728 khoá, “khattiya” ở 50, “sát-đế-lỵ” ở 10, “quý tộc” ở 16; số đếm ở mục Thuật ngữ trên (“khattiya” 28 + “Khattiya” 11 so với “sát-đế-lỵ” 3) là sai. Sửa 2 khoá về thuật ngữ: 2.1 “Và vị khattiya nào” → “Và vị sát-đế-lợi nào”; 14.4 “hỡi khattiya” → “hỡi sát-đế-lợi” (cùng cách ở ja527:58.2, ja542:46.4, ja499:22.2). Không có bản Anh hay bản Việt độc lập khác.

