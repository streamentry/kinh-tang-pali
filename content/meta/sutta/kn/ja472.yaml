notes: |-
  Đợt 19, làn 49. Dịch từ Pāli root commit đã ghim, đủ 67/67 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka này chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem phần Bất định). Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề, theo khuôn của bài anh em cùng phẩm `ja471`.**
  - `0.2` “Bộ Mười Hai Bài Kinh” và `0.3` “Phẩm Cūḷakuṇāla” dùng lại nguyên văn từ `ja471:0.2`, `ja471:0.3` (cùng `Dvādasakanipāta` + `Cūḷakuṇālavagga`); `0.1` “Jātaka” giữ nguyên.
  - `0.4` “9. Kinh Mahāpaduma”: tên giữ nguyên Pāli theo cách `ja475` (“Kinh Phandana”) và `ja478` (“Kinh Dūta”) giữ tên riêng; số thứ tự “9.” khớp `navamaṁ` ở `16.1`. `16.1` “Kinh Mahāpaduma, thứ chín.” theo khuôn `ja471:13.1` và `ja474:14.1` (dấu phẩy trước số thứ tự).

  **Số Pāli.** `navamaṁ` (16.1) = 9 ⇒ “thứ chín”, khớp số “9.” ở `0.4`. `ekato` (8.1) = một phía; `ekikā` (8.2) = một mình (chỉ một người nữ). `anekatāla` (9.1) không có số xác định, chỉ nói sâu hơn một tầm cây thốt nốt ⇒ dịch “sâu cỡ nhiều cây thốt nốt” (đã đổi từ “nhiều tầm cây thốt nốt” ở lượt cải thiện 2026-10-11, xem dưới), không bịa con số. Không có số lớn (`sahassa`, `sata`, `navuti`...) nào trong bài.

  **Tiền lệ dùng lại nguyên văn.** Quét toàn tầng Việt hiện có (173.170 khoá, bỏ khối `:0.`) tìm Pāli trùng byte hoặc trùng sau khi bỏ dấu câu và chữ hoa với 67 khoá của bài này: 13 khoá trùng, thuộc 3 khoá của bài này.
  - `13.4` `taṁ me akkhāhi pucchito”.` trùng 11 khoá ở bài khác (`ja401:1.6`, `ja401:3.6`, `ja401:5.6`, `ja435:2.4`, `ja439:9.4`, `vv78:8.4` cùng một bản Việt “xin hãy nói cho tôi biết điều ấy, tôi hỏi”; `ja348:1.4`, `ja306:1.4`, `ja386:4.4` mỗi khoá một bản khác; `ja543:46.4`, `ja530:9.4` chưa có bản Việt). Tôi cố ý lệch cả 9 bản đã có: người nói ở đây là nhà vua (xưng “ta”, như ở `8.3`, `11.1`, `13.4`), còn “tôi hỏi” là cách đọc `pucchito` thành người hỏi tự nói; `pucchito` là phân từ của người được hỏi ⇒ “khi được hỏi”. Đề nghị người điều phối quyết một lần cho công thức này nếu muốn thống nhất.
  - `4.1` `Yo ca etāni ṭhānāni,` trùng `ja468:12.1` (bản Việt kia dịch cả cụm “Còn kẻ nào thực hành”, không so được từng chữ); giữ cách đọc `ṭhānāni` là “vụ việc” theo ngữ cảnh xét xử.
  - `1.2`/`4.2` `aṇuṁthūlāni sabbaso;` trùng `dhp265:2` (“dù nhỏ hay lớn, hoàn toàn,”); tôi dịch `sabbaso` là “về mọi mặt” (không dùng “hoàn toàn” vì ở đây nó bổ nghĩa cho việc xem xét lỗi, không phải kết quả); 0 xung đột trong nội bộ bài.

  **Trùng nguyên văn trong chính bài.** 1 cặp: `1.2` và `4.2` (`aṇuṁthūlāni sabbaso;`, khác nhau chỉ ở chữ hoa). Hai khoá đều dịch giống hệt nhau “dù nhỏ hay lớn, về mọi mặt;” ⇒ 0 cặp trùng mà bản Việt khác.

  **Thuật ngữ và tiền lệ, đã đo.**
  - `baḷisa` (12.1, 13.1, 13.3 qua `ubbhataṁ`, 14.1, 14.3) → “lưỡi câu”: tầng có 5 khoá chứa `baḷisa` đứng riêng (`sn17.10:5.1`, `sn35.230:1.1`, `sn35.230:4.2`, `sn35.230:5.3`, `sn17.2:1.3`); 4 khoá dịch “lưỡi câu”, 1 khoá (`sn17.2:1.3`) dịch “bẫy gai”. Chọn “lưỡi câu”.
  - `issaro` (1.3) → “bậc chủ tể” (xem Lượt cải thiện 2026-10-11).
  - `khattiya` (2.1, 2.2, 14.4) → giữ “khattiya”: các bản Việt trong tầng có “khattiya” 28 khoá + “Khattiya” 11 khoá, “quý tộc” 16, “vương tộc” 7, “sát-đế-lỵ” 3 (đây là số đếm phía bản Việt, không phải số Pāli); `ja420:7.1`, `ja420:8.1` cũng dùng “Khattiya” cho vocative `khattiya`.
  - `nāga` (10.1, 15.3) → “rồng nāga”: tầng có 3 khoá dịch “rồng” (`ja253:3.3`, `ja405:6.2`...), 1 khoá giữ “nāga” (`ja105:1.3`); “rồng nāga” gộp hai cách để khỏi lẫn với “voi” (`an4.114` dịch `nāga` là “voi naga”).
  - `devatā` (15.4) → “vị thiên”: cùng cách với `an3.70:16.3` (“các vị thiên”).
  - `Ciñcamāṇavikā` (15.1) → “nàng Ciñcamāṇavikā”: theo `dhp176:0` (“Chuyện nàng Ciñcamāṇavikā”).
  - `naraka` (9.1) → “vực” (không phải địa ngục), như `ja474:10.2`; `baḷisa`, `ubbhata`, `salohita` ⇒ “lưỡi câu”, “đã kéo ra”, “cùng với máu”.
  - `sakaṇṭaka` (2.3) → “món còn xương gai” và `samakkhika` (2.4) → “món lẫn ruồi”: hợp từ `sakaṇṭaka` và `samakkhika` có 0 khoá trong tầng; gốc `kaṇṭaka` được dịch “gai” ở `sn17.4:1.3`, `sn35.244:4.2`; nghĩa “xương” cho `kaṇṭaka` là suy từ ngữ cảnh người mù nuốt nhầm.
  - `voharati` (4.4, dạng `voharitu`) → “xét xử”: tầng có hơn 20 khoá chứa gốc `vohar-`, nhưng đa số là nghĩa “tuyên bố / nói” (`mn22:3.19`, `mn38:3.11`, `mn74:6.6`, `sn1.25:2.6` “dùng các ngôn từ thông thường”); nghĩa “xét xử / xử việc” của `vohāra` ở đây là chọn theo ngữ cảnh kệ (không phải tiền lệ trực tiếp); cách đọc khác là “tuyên phán”.
  - `anumajjhaṁ` (6.4) → “lối trung dung”: 0 tiền lệ trong tầng.
  - `ratto` (7.1) → “đang đắm say”, `duṭṭho` (7.2) → “đang sân hận”: cùng gốc `rāga`/`dosa` đã dịch “tham”/“sân” trong tầng, nhưng ở đây là tính từ về người nói nên dịch thuận chiều tâm trạng.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 9 dấu mở · 9 dấu đóng (đóng ở 7.4, 8.4, 9.4, 10.4, 11.4, 12.4, 13.4, 14.4 và `15.6` dạng `”ti.`), Việt cũng 9/9, lệch 0/67 khoá. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 ⇒ phép này chạy rỗng, không có gì để so, không tuyên bố “0 lỗi”. Dấu cuối khoá khớp Pāli, trừ `9.4` và `11.4` nơi Pāli kết bằng chấm nhưng câu là câu hỏi nên Việt kết bằng dấu hỏi.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1–7: hoàng tử (Bồ-tát) nói với vua cha; 8–9: vua; 10: hoàng tử; 11: vua; 12: hoàng tử; 13: vua; 14: hoàng tử; 15: Đức Phật (lời nhận diện tiền thân). Đây là suy luận từ nội dung; xưng hô “ta/ngươi” (vua) và “tôi” (hoàng tử) là lựa chọn của người dịch, Pāli chỉ có `ahaṁ`, `me`, `taṁ`, `tvaṁ` trung tính.
  2. `parato` (1.1): đọc là “của người khác” (lỗi nằm ở người khác); cũng có thể là “do kẻ khác (tố)”, tức lời kẻ khác, vì có `sāmaṁ` (tự mình) đối lập ở 1.4.
  3. `Nekantamudunā … ekantatikhiṇena vā; attaṁ mahante ṭhapetuṁ` (5.1–5.3): đọc `na` dùng chung cho cả hai vế (“chỉ bằng sự hoàn toàn mềm mỏng thì không thể, hay chỉ bằng sự hoàn toàn khắc nghiệt”); `attaṁ` đọc là `attānaṁ` (bản thân); `mahante` là vị trí lớn (địa vị).
  4. `veravā` (6.2): “chuốc thù oán” (người quá khắc nghiệt gây ra/nhận lấy thù oán); không phân biệt được chắc chắn giữa “gây thù” và “bị thù”.
  5. `Tenāhaṁ paṭipajjissaṁ` (8.3): đọc “vì thế ta sẽ hành xử theo đó” (theo điều người nữ nói, cả thế gian một phía, một mình bà ta một phía). Cách đọc này là suy luận ngữ cảnh; từ `tena` không nêu rõ điều gì được làm theo.
  6. `anekatāle narake` (9.1): `tāla` là cây thốt nốt, đơn vị đo độ sâu theo chiều cao cây; không có con số, nên chỉ ghi “sâu cỡ nhiều cây thốt nốt”; tiền lệ cùng đơn vị đo `ja506:42.2` `tālamattā` → “cao bằng cây thốt nốt”.
  7. `girisānujo` (10.2): “sinh ở sườn núi”; cũng có thể là “ở nơi sườn núi” (nơi cư ngụ), nghĩa gần như nhau.
  8. `bhaddante` (11.3): đọc là `bhaddaṁ te` (điều tốt lành cho ngươi) ⇒ “chúc ngươi an lành”.
  9. `hatthiassaṁ` (14.2): hợp từ `hatthi` + `assa` = voi và ngựa; dịch “voi ngựa”, không thêm “của cải/quân binh” là ẩn dụ chú giải ngoài Pāli.
  10. `cattaṁ ahaṁ ubbhataṁ brūmi` (14.3): `catta` (đã bỏ) đọc là “sự từ bỏ”.
  11. `devatā` (15.4): “vị thiên”; không phân biệt được thiên thần hay thần linh nhỏ; `mātā` (15.1) chỉ “mẹ”, không thêm “mẹ ghẻ/mẹ kế”.

  **Lượt cải thiện 2026-10-11.** Đọc đối kháng lại 67 khoá cặp Pāli↔Việt; đổi 5 khoá, không đổi tập khoá, thứ tự khoá, nháy, dấu cuối khoá.
  - `1.3` (terminology fix): “bậc cầm quyền chớ ban hình phạt” → “bậc chủ tể chớ áp dụng hình phạt”. `issaro` trong tầng Jātaka có 19 khoá; các khoá dịch “chủ tể” ở `ja527:57.4`, `ja492:20.4`, `ja543:158.1`, `ja543:159.1`, `ja543:160.1`, `ja505:21.1` (“bậc chủ tể”), còn “cầm quyền” chỉ có ở `ja420:3.3`, nơi nó dịch cả cụm `daṇḍadhāro … issaro`. Khoá `ja505:21.1` cùng công thức `daṇḍaṁ paṇayeyya issaro` và dịch “áp dụng hình phạt”, nên `paṇaye daṇḍaṁ` cũng chuyển từ “ban” (nghĩa cho/ban phát, lệch với hình phạt) sang “áp dụng”. `terminology` 9.0 → 9.1.
  - `5.1`–`5.3` (clarity fix, cùng nghĩa): “Chỉ bằng sự hoàn toàn mềm mỏng thì không thể, / hay chỉ bằng sự hoàn toàn khắc nghiệt; / mà đặt mình vào vị trí lớn,” → “Không thể chỉ bằng sự hoàn toàn mềm mỏng, / hay chỉ bằng sự hoàn toàn khắc nghiệt; / mà đặt mình vào vị trí lớn,”. Bản trước đặt “thì không thể” giữa hai vế rồi mới tới “mà đặt mình…”, người đọc phải quay lại để ghép `na … sakkā … ṭhapetuṁ`; bản mới đưa phủ định `na` lên đầu và để nó bao cả hai vế `ekantamudunā … ekantatikhiṇena vā` (không đổi cách đọc ở BẤT ĐỊNH 3). Dấu cuối từng khoá vẫn khớp Pāli.
  - `9.1` (clarity fix): “nhiều tầm cây thốt nốt” → “sâu cỡ nhiều cây thốt nốt”. “Tầm” là đơn vị đo riêng của tiếng Việt (khoảng một sải), dễ bị đọc là một đơn vị chiều dài chứ không phải cây thốt nốt làm chuẩn đo; `tālamattā` ở `ja506:42.2` đã dịch bằng “cao bằng cây thốt nốt” (cây làm chuẩn). Vẫn không có số xác định (`anekatāla`).
  - `vietnamese_clarity` 9.0 → 9.1 (cho `5.1`–`5.3` và `9.1`). `terminology` 9.0 → 9.1 (cho `1.3`). Hai mức tăng đều nhỏ vì mỗi chỗ chỉ là một cụm; `final_score` 8,98 → 9,00, và 9,00 **không** lớn hơn 9,0 nên không đủ ngưỡng `published`.
  - Các tiêu chí không đổi: `semantic_fidelity` 8,8, `grammar_logic` 8,8, `ambiguity_integrity` 9,0 và `triangulation` 7,0 giữ nguyên vì các bất định ở dưới vẫn còn (người nói không có văn xuôi khung; `8.3` “theo đó”; `veravā`; `sakaṇṭaka`) và không có bản Anh để đối chiếu.
  - Đã đo và cố ý giữ nguyên:
    - `11.1`–`11.4` trùng nguyên văn `ja538:22.1`–`22.4`, và `ja538:22.1` dịch cùng “trở về”, `22.2` cùng “hỡi hoàng tử, về chính nhà của …”, `22.3` cùng “hãy cai trị vương quốc, chúc … an lành” (khác chỉ ở đại từ “ngươi/ngài”, theo người nói); giữ để khỏi tạo cặp trùng Pāli mà Việt khác. `bhaddante` đối chiếu thêm `sn10.5:11.1` “chúc con được lành mạnh”.
    - `13.4` `taṁ me akkhāhi pucchito` giữ “khi được hỏi”. Đo lại công thức này trên toàn tầng: 22 khoá có đúng chuỗi `taṁ me akkhāhi pucchito` hoặc `akkhāhi me pucchito`; khoảng 17 khoá dịch “tôi/ta/con hỏi” hay “khi tôi hỏi”, 5 khoá dịch “(khi) được hỏi” (`sn1.42:1.6`, `vv78:8.4`, `vv81:13.4`, `ja306:1.4`, `ja386:4.4`). Đa số là “tôi hỏi”. Tôi không theo đa số vì `pucchito` là phân từ bị động chủ cách, chỉ người **được hỏi** (người nghe, chủ ngữ của `akkhāhi`), chứ không phải người hỏi; cách đọc “tôi hỏi” đúng nếu `me` được hiểu là tác nhân của `pucchito`, nhưng đây là một lựa chọn chứ không phải điều Pāli buộc. Cần quyết một lần cho cả công thức nếu muốn thống nhất (đã báo ở trên).
    - `6.4` `anumajjhaṁ` giữ “lối trung dung”: tầng chỉ có `anumajjhato majjhakaṁ` (`ja470:2.2`, `ja535:2.2`, dịch “có mức vừa thì cho mức vừa”) cho thấy gốc `majjha` = giữa/vừa, phù hợp nghĩa “ở giữa hai thái cực” của 6.1–6.3; không có tiền lệ cho dạng `anumajjhaṁ` làm trạng từ.
    - `2.3`–`2.4` “món còn xương gai” / “món lẫn ruồi”, `4.1` “vụ việc”, `4.3` “răn dạy”: vẫn là lựa chọn theo ngữ cảnh, ghi thêm vào BẤT ĐỊNH 12–14 bên dưới.
  - Bất định bổ sung (không có căn cứ phân xử thêm, giữ nguyên):
    12. `sakaṇṭakaṁ … samakkhikaṁ` (2.3–2.4): đối tượng bị nuốt không có danh từ trong Pāli; “món” là phần bổ nghĩa theo ngữ cảnh người mù nuốt nhầm; “xương” là suy từ `kaṇṭaka` (gai) trong ngữ cảnh ăn; `samakkhika` chỉ có một khoá khác trong tầng (`mil7.7.1:1.3`, nghĩa khác) nên không có tiền lệ.
    13. `ṭhānāni` (4.1): có thể là “vụ việc” (nghĩa xét xử, theo cách đọc `voharitu` ở 4.4) hoặc chỉ “những điểm / những điều” như `ja515:39.1` (“những điều này”) và `ja468:12.1`; cả hai cách đều không đổi ý chính của kệ.
    14. `anusāseyya` (4.3): tầng dịch `anusās-` phần lớn là “chỉ dạy / dạy bảo / cai trị / ra lệnh”; “răn dạy” là lựa chọn ở giữa, có thể là “chỉ dạy, xử trị” theo cách đọc của người xét xử.

