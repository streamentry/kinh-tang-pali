notes: |-
  Đợt 16, lát f205. Không có bản Anh upstream và không có bài song song trong corpus
  ngoài các tiền lệ nhỏ: `:8.4` `apaccatha` → *bị nung đốt* (đúng `mn50:24.2` "nơi Dūsī
  bị nung đốt"); `:10.4` `isimāsajja` → *xúc phạm vị đạo sĩ* (cùng khuôn `mn50:24.3`
  "sau khi xúc phạm Vidhura"); `:4.2` `bhanteti` = `bhante"ti` (tiền lệ `vv80:7.4`).
  `:0.2` Mahāvagga → *Đại Phẩm* (theo `pv51`).
  **Ba chỗ bất định thật, ghi nhận để người soát phân xử:**
  (a) `:7.1` `Chaḷeva caturāsīti, vassāni navutāni ca` — `chaḷeva` = *sáu* (riêng lẻ
  trong corpus, `an7.74:9.2` "chỉ có sáu chứng bệnh"); các bản dịch ngoài đọc là
  "84.000 năm và 90.000" (PT/Tamil) hay "86.000 và 90.000" (Đức) — suy ra `nghìn`
  nhưng Pāli không có `sahassāni`, nên tôi giữ nguyên ba số *sáu / tám mươi bốn /
  chín mươi năm*, không tự thêm lũy thừa;
  (b) `:4.2` `laddhā bhanteti cābravi` = "[nhận được] rồi thưa: Bạch ngài, [ngài] đã
  nhận được [đồ khất thực] chưa" — theo cách đọc của `vv80`, nhưng `laddhā` không có
  tân ngữ trong Pāli nên để trần, không thêm vật;
  (c) `:10.1–10.2` `appaduṭṭhappadosinaṁ` — tôi theo nghĩa *cho người chẳng ác chẳng
  giận* (người vô tội bị xúc phạm), có thể đọc ngược là tính từ chỉ kẻ làm ác.
  `:5.2` `[ha hả]` trong ngoặc vuông là tầng đệm tối thiểu cho `hasamāno` (cười),
  Pāli không có từ này — có thể gỡ nếu người soát muốn tối giản.
  Lượt cải thiện 2026-10-11 (đọc đối kháng 56 khoá, sửa 42 khoá; các ghi chú (a)–(c) ở trên là của lượt đầu và được thay/chỉnh bởi mục này).
  1) Lệch ranh khoá — lượt đầu chấm segment_alignment 10.0 nhưng có 4 chỗ lệch, đã sửa: `:1.1`/`:1.2` (`vipāko` thuộc `:1.2`, bản cũ kéo "Quả của" lên `:1.1`); `:6.1`/`:6.2` (hai chữ "quả" cho một `vipāko`); `:7.3`/`:7.4` và `:9.3`/`:9.4` (`niraye` thuộc `:7.4`/`:9.4`, bản cũ đặt "trong địa ngục" ở dòng trước). segment_alignment 10.0 → 9.8 (còn đảo trật tự từ trong khoá ở `:11.4`, không lệch ranh).
  2) Sai nghĩa/ngữ pháp đã sửa: `:11.1` `so tattha` = "kẻ ấy ở đó" (bản cũ "Vì ở đó" thêm quan hệ nhân quả không có); `:11.4` `peto āsi tato cuto` = chết từ nơi ấy rồi thành ngạ quỷ (bản cũ đảo thứ tự); `:13.1` `pāsaṁso` = đáng được khen ngợi (không phải "đã được"; tiền lệ `ja429:5.4`, `ja430:5.4`); `:1.2` `mathaye` (khả năng) = "có thể khuấy động"; `:12.4` `anuvattaye` = "nên" (cũ "hãy"); `:5.3` "Con là … ta" lệch ngôi trong một lời nói → "Ta là con vua Kitava"; `:2.3` `uyyāne` là danh từ chung, cũ viết như tên "vườn Uyyāna" (tiền lệ `bv11:2.4`, `ja525:39.1` "khu vườn"); `:5.1` `thaṇḍile` = đất trần, không có nghĩa "đá" (6/6 tiền lệ KN: "đất trần"); `:10.3` `paccanti` = bị nung đốt (cũ "nếm chịu", mất hình ảnh nung, cùng gốc `paccittha`/`apaccatha` ở `:8`); `:9.2` thêm `pūgāni` bị bỏ sót; `:10.4` `subbataṁ` không có "thanh tịnh" → "có hạnh nguyện tốt" (`tha-ap536:23.2`); gỡ `[ha hả]` (`:5.2`), `[năm]` (`:7.1`) và "đồ khất thực" (`:4.2`) vì là chữ thêm — ghi chú (b) cũ nói không thêm vật nhưng bản cũ đã thêm; `:6.3` `vedesi` = "phải gánh chịu" (`ja313:4.3`); `:8.2` `vāmadakkhiṇo` = nghiêng trái phải.
  3) Tiền lệ đã đếm: `isi` → "ẩn sĩ" 156/187 khoá, "đạo sĩ" 10 (đổi `:3.1`, `:10.4`); `khattiya` → "sát-đế-lợi" theo glossary và `pv21:55.2` (`:4.4`, cũ "hoàng tử"); `bhikkhu` → "tỳ-kheo" 710/729 (`:5.4`, cũ "nhà sư"); `uñche pattagate rataṁ` theo `thag16.7:2.2`, `thag2.18:1.4`, `thag20.1:1.2`; `hatthikkhandhato oruyha` → "Xuống khỏi lưng voi" (`pv38:14.1`, `ja547:18.1`, `ja547:734.1`); `nirayamhi samappito` → "bị giam vào địa ngục" (`snp2.10:3.6`; ba nơi dùng ba chữ khác nhau, không có đa số); `ratiṁ` → "thích thú" (22 khoá, "vui thú" 1); `appicchaṁ` → "ít ham muốn" (6) so với "thiểu dục" (2); `samāhitaṁ` giữ "đã chuyên nhất" theo hai khoá Pāli trùng nguyên văn `tha-ap432:1.2`, `tha-ap8:123.2` dù "định tĩnh" chiếm 71/126; `12.1–12.3` khớp `pv41:7.1–7.3`; `:13.4` "sinh lên cõi trời" khớp 6 khoá (`iti31`, `iti33`, `iti65`, `iti71`, `ne37:112.6`, `ja515:40.4`).
  4) Pāli trùng nguyên văn: 12 khoá có Pāli trùng với bài khác (không tính tiêu đề), 8 khoá dùng đúng nguyên văn tiền lệ, 4 khoá Việt khác có lý do (`:4.3` "cầm lấy" vì lấy bát khỏi tay, tiền lệ `thi-ap` là "nhận lấy"; `:6.2` không chép "khôn cùng … đã đến" của `ja313:4.2` vì Pāli chỉ có `kaṭuko ahu`; `:13.3`–`:13.4` chia ranh `sappañño`/`so` khác `pv41:7.5–7.6`, giữ đúng ranh khoá Pāli). Trong chính bài: 2 cặp Pāli trùng (`:7.3`=`:9.3`, `:7.4`=`:9.4`), bản cũ ở `:7.3`/`:9.3` khác nhau, nay giống hệt.
  5) Điểm: grammar_logic 9.0 → 9.3 (sáu lỗi ở mục 2: ngôi, thì, thể thức, nhân quả, thứ tự); segment_alignment 10.0 → 9.8 (mục 1); terminology 9.1 → 9.4 (mục 3); vietnamese_clarity 9.2 → 9.3 (bỏ chữ thêm, bỏ "thưởng hưởng", "đầy đức hổ thẹn", "giao phó", "Vì ở đó"); triangulation 7.0 → 7.5 (đối chiếu thêm bản Việt nguyên bài ở mục Tra cứu toàn văn của Bhikkhu Indacanda để hiểu cách đọc — không chép câu chữ — và tám bài song song/tiền lệ trong kho; vẫn không có bản Anh nên không vượt 8.0); các tiêu chí còn lại giữ nguyên. semantic_fidelity giữ 8.9 và ambiguity_integrity giữ 8.3 vì bất định thật ở mục 6 chưa phân xử được. Tổng 9.08 > 9.0 chỉ vượt 0.08, phụ thuộc triangulation và terminology.
  6) Bất định còn lại (chưa phân xử): (a) `:7.1–7.2` `chaḷeva caturāsīti, vassāni navutāni ca` — `navutāni` xuất hiện đúng 1 lần trong toàn Pāli root đã ghim (hapax), `chaḷeva` 1 lần, không có `sahassāni`; giữ ba số đúng chữ (sáu, tám mươi bốn, chín mươi, đơn vị năm), không tự nhân lũy thừa. Bản Việt nguyên bài đọc thành sáu lần tám mươi bốn ngàn năm — theo bản in khác, không kiểm chứng được từ root đã ghim nên không chép; nếu đọc nhân lên thì thời gian ở `:7` là hàng trăm ngàn năm chứ không phải vài chục năm, chênh lệch lớn, cần người soát phân xử. Các tuyên bố về bản dịch ngoài (ghi "PT/Tamil" và "Đức") ở ghi chú (a) cũ chưa được kiểm lại nên bản canonical không dựa vào chúng. (b) `:10.2` `appaduṭṭhappadosinaṁ`: chọn [appaduṭṭha + padosin] "kẻ hại người không lỗi" theo `dhp125:1`, `ja367:5.1`, `snp3.10:14.1` (`appaduṭṭhassa narassa dussati`); cách đọc [appaduṭṭha + appadosin] (chỉ vị ẩn sĩ chẳng ác chẳng giận) là cách lượt đầu chọn, sandhi cho phép cả hai. (c) `:11.3` `nāma` dịch "quả thật"; có thể đọc "tên là Khuppipāsahata", kho không có tiền lệ (0 khoá `nāma` + peta). (d) `:4.2` `laddhā` không tân ngữ, để trần. (e) `:5.3` `kitava` giữ như tên vua; từ này ở `ja545:60.4`, `ja521:17.3` nghĩa là kẻ cờ bạc. (f) `:9.2` `pūgāni` → "khối" (`vassapūgāni` ở `ja532`, `ja547` được dịch lỏng "năm tháng") và `nahutāni` → "vạn" (`ja467:11.2` "mười ngàn", `tha-ap3:151.4` "muôn").
  Cổng kỹ thuật CHƯA chạy — cần đủ bốn lệnh trước khi coi `technical_integrity: 9.6` là đạt:
