notes: |-
  LÁT NÀY KHÔNG CÓ TẦNG THAM KHẢO NÀO, ĐÃ ĐẾM KHÔNG SUY. Với mười ba bài Jātaka này:
  source/upstream-manifest.json tại commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639 ghi tầng translation/en/sujato có 4.291
  tệp, trong đó thư mục sutta/kn/ja/ chỉ có 83 tệp, không có tệp nào chứa khoá của bài này; hàm
  upstreamPublishes của kho trả false cho cả mười ba, tức SuttaCentral không phát hành bản Anh nào
  phủ chúng. Tầng translation/vi/phantuananh tại cùng commit chỉ có đúng 26 tệp và toàn bộ là Pháp Cú
  (dhp1-20 … dhp383-423), nên KHÔNG có bản Hòa thượng Thích Minh Châu cho bất kỳ bài Jātaka nào ở đây —
  đây là đặc điểm của bản chụp upstream đã ghi ở chính source/layers.yaml, không phải thiếu sót của
  kho, và cũng không phải lý do để tôi né việc chấm điểm. Bài chỉ đối chiếu được với Pāli root một
  mình, nên triangulation chấm thấp và bài đặt draft.

  COVERAGE KHÔNG PHẢI LÝ DO BLOCK, VÀ TÔI ĐÃ TÍNH LẠI CHO ĐÚNG. Trong mười ba bài này mọi vế kệ
  Jātaka đều ngắn hơn ngưỡng 40 ký tự khai ở source/layers.yaml, và mọi khoá tiêu đề nằm trong khối
  tham chiếu, nên substantiveSegments = 0. Hàm englishCoverageFor trả ratio = 1 khi
  substantiveSegments = 0, và cả validate lẫn tests/unit/translation-store.test.ts đều bỏ qua bài có
  substantiveSegments = 0. Tôi đã chạy hàm đó cho cả mười ba: đều ratio 1.000. Vì vậy tôi KHÔNG ghi
  blocker coverage dưới ngưỡng — ghi thì sẽ là một lỗi đo sai. Blocker thật, duy nhất, là mất hẳn
  tầng tham khảo English.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt mặc định chỉ quét khoá Pāli từ 40
  ký tự trở lên; ở Jātaka mọi vế kệ đều ngắn hơn ngưỡng đó nên phần chốt đó về bản chất KHÔNG chạy.
  Tôi tự quét lại toàn bộ 238 khoá của lát bằng script riêng, đọc thẳng từ tệp đã ghi trên đĩa:
  đủ khoá và không thừa so với Pāli gốc, không rỗng, chuỗi NFC, số dấu lược khớp TỪNG KHOÁ (Pāli có
  …pe… thì Việt đúng một …, Pāli không có thì Việt không có), không có (…) đứng một mình, vị trí
  ngoặc kép mở và đóng khớp PĀLI TỪNG KHOÁ (không chỉ tổng số trên cả bài), ngoặc kép cân trên
  cả bài, không chữ phiên tự, không còn sót thẻ chữ Pāli. Kết quả 0 lỗi trên 238 khoá / 14 bài.

  TÊN PHẨM, ĐÃ ĐO THEO BẢNG CHỐT VÀ THEO TẦNG. Tikanipāta → Bộ Ba Bài Kinh: đếm trên toàn tầng
  Việt TRƯỚC khi lát này ghi, đã có 24 tệp Jātaka và 15 tệp thag3/thig3 dùng đúng cách này, và KHÔNG
  tệp Jātaka nào dùng cách khác; cách Phẩm Ba Pháp chỉ do 50 tệp iti50..iti99 dùng mà tôi không đụng
  tới. Sau khi lát này ghi, con số Jātaka là 37/37. Tôi theo đa số TRONG CHÍNH TÁC PHẨM ĐANG LÀM theo
  BRIEF_VI3 §11, và cũng vì nó khớp song song với hai mục đã chốt là Bộ Một Bài Kinh và Bộ Hai Bài
  Kinh. Người điều phối gộp có thể muốn thống nhất cả tầng iti sau này, nhưng đó không thuộc lát này.
  Saṅkappavagga → Phẩm Suy Nghĩ (trước lát này 7 tệp, không lệch; sau đó 8); Padumavagga → Phẩm Bông
  Sen (trước 1 tệp, không lệch; sau đó 9, và cả chín tệp trong phẩm đều giống nhau); Udapānavagga →
  Phẩm Nước Uống (trước 4 tệp, không lệch; sau đó 8). Dấu uddāna: trước lát này đã đếm 22 tệp có
  dạng Kinh <tên>, thứ <từ>. và 3 tệp không có dấu phẩy; tôi dùng dạng có dấu phẩy, và đã kiểm
  bằng script rằng số thứ tự trong uddāna khớp số đứng trước mặt trong 0.4 của cùng phẩm, không suy
  từ tên uid.

  PĀLI TRÙNG NGUYÊN VĂN, ĐÃ DỰNG CHỈ MỤC BẰNG SCRIPT VÀ ĐÃ DÙNG LẠI. Tôi nạp 5.764 tệp Pāli
  gốc trong cache (bỏ mọi thư mục *.apfs-orphan) và 4.038 tệp Việt dự án, ghép theo khoá, rồi so
  TRÙNG NGUYÊN VĂN có chuẩn hoá hoa thường, khoảng trắng và dấu câu biên. Riêng lát này: 102 khoá
  trùng ở nơi khác; 52 khoá trùng đó đã có bản Việt ở bài khác, và tôi DÙNG LẠI NGUYÊN VĂN 51 khoá
  (39 khoá tiêu đề, 12 khoá thân kệ). Một khoá trong 52 là ngoại lệ có chủ ý: ja264:3.1 trùng nguyên
  văn với sn1.50:11.1, nhưng bản Việt đã có mở ngoặc kép ở đầu khoá trong khi Pāli khoá này không mở,
  nên tôi chép phần chữ và bỏ ngoặc kép thay vì chép y nguyên. Ngoài ra có 8 cả ván bốn vế trùng nguyên
  văn ở bài khác, và cả tám đều chưa có bản Việt để mượn. Trong lát này có 3 khoá trùng
  nguyên văn, đều là ba vế mở đầu lặp lại trong ja265; tôi đã dùng lại đúng một cách dịch cho cả
  hai lần, và script tự kiểm bắt được chỗ lệch nếu có.

  TÊN RIÊNG CÓ DẤU PĀLI, CỐ Ý GIỮ, KHÔNG BỎ DẤU. Jātaka, Tikanipāta, Sakka, Panāda, Missībhāvitthi,
  kāḷi, Jātavedas, Gāṅgā, Yamunā, Kassapa — tất cả giữ đúng dấu Pāli như tầng đang làm; tôi không
  bỏ dấu ở bất kỳ tên nào, kể cả tên không có bản Việt nào để đối chiếu.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  STATUS. Có một blocking error thật (thiếu hẳn tầng tham khảo English Sujato tại commit đã ghim), nên
  bài đặt draft bất kể final_score. Tôi không nâng điểm để né blocker, và cũng không hạ điểm để tỏ ra
  thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có
  tầng tham khảo nào.

  BA KHOÁ ĐÃ CÓ BẢN VIỆT ĐỂ DÙNG LẠI. 1.4 asmiṁ loke paramhi ca trùng nguyên văn ở 19 khoá khác
  (an8.15, dhp168, sn1.32 …) và đã có bản Việt là ở thế giới này và ở thế giới kia, nên tôi dùng lại
  nguyên văn. 3.2 mantabhāṇī anuddhato trùng với dhp363:2 và thag1.2:1.2, đã có bản Việt là nói lời
  chín chắn, không dao động; 3.3 Atthaṁ dhammañca dīpeti trùng với dhp363:3, đã có là giảng giải nghĩa
  và pháp. Cả ba tôi chép nguyên văn.

  CHỖ CHƯA CHẮC. (1) 3.1 Tasmā sakhilavācassa và 3.4 madhuraṁ tassa bhāsitan đứng cạnh nhau mà
  nghĩa có vẻ ngược nhau — lời thô kệch lại có lời nói ngọt ngào. Tôi đọc là với kẻ lời lẽ thô kệch,
  khi đã nói đúng điều cần nói và không dao động thì người ấy giảng giải nghĩa và pháp, và lời nói
  của người ấy ngọt ngào; cũng có thể sakhilavācassa là sở hữu của kẻ lời thô kệch theo nghĩa
  khách, thì câu sẽ gần nghĩa 1.3 hơn. (2) 2.1 kāḷi: đây là tên con chim, tôi giữ nguyên dấu Pāli kāḷi
  chứ không dịch, vì toàn tầng Pāli chỉ có mười hai khoá chứa kokila và không có bản Việt nào để xác
  định nghĩa chính xác; kokila tôi dịch là chim cu gáy. (3) 2.2 tilakāhataṁ: tôi dịch là có vạch sẹo
  đánh dấu, lấy tilaka là vạch; cũng có thể là vết vuốt của chim cu gáy, thì câu sẽ nói về dấu vuốt.

  LƯỢT CẢI THIỆN 2026-10-11 (đọc đối kháng từng khoá; ghi đè các nhận định cũ ở trên khi chúng mâu thuẫn). Đã đổi 10/17 khoá; 7 khoá còn lại (0.1–0.4, 3.2, 3.3, 4.1) giữ nguyên.
  (1) LỖI NGHĨA TRỌNG YẾU ĐÃ SỬA, loại accuracy fix. Bản cũ đảo nghĩa kệ: 1.3 kharavācā dịch "lời thô kệch cũng đáng được yêu" và 3.1 sakhilavācassa dịch "kẻ lời lẽ thô kệch". Đo trên toàn Pāli root: sakhila xuất hiện ở 30 khoá và luôn mang nghĩa hòa nhã, thân thiện (dn30, an5.38, sn11.11–13, pv36, ja522, ja458, ja382, ja546, ja89 …); ở tầng Việt, sakhila dịch hòa nhã ở 11 khoá và thân thiện ở khoảng 5 khoá, không nơi nào dịch thô. Vì vậy 3.1 đổi thành "người lời lẽ hòa nhã" (khoá 3.2–3.3 là công thức trùng dhp363, giữ nguyên bản đã dùng: nói lời chín chắn, không dao động; giảng giải nghĩa và pháp). Ở 1.1–1.3, "na hi … piyā hoti" phủ định vế piyā hoti, còn vaṇṇena sampannā / mañjukā / piyadassanā là phần nhượng bộ; vậy nghĩa là người dù đủ sắc đẹp, duyên dáng, nhìn dễ mến mà lời lẽ cộc cằn thì không được yêu mến. Đây là cách đọc duy nhất khớp với 2.1–2.4 (con chim xấu màu mà được yêu nhờ lời dịu dàng) và với 3.4 (lời của người hòa nhã thì ngọt ngào). Điểm: grammar_logic 8,9 → 9,0 (phủ định và scope đúng, quan hệ sở hữu ở 3.1 đúng); semantic_fidelity giữ 9,0 vì bản cũ đã được chấm 9,0 trong khi mang một lỗi đảo nghĩa, nên điểm đó chỉ nay mới thực sự đạt.
  (2) THUẬT NGỮ, loại terminology fix, có đếm. kharavācā: toàn tầng chỉ có đúng khoá này (ja270:6.4 chỉ là tên phẩm). pharusavācā đã được dịch là lời thô ác (hàng chục khoá), nhưng khara khác pharusa, nên chọn cộc cằn, đã có tiền lệ ở mn41:9.4 (aṇḍakā kakkasā dịch cộc cằn, gay gắt). kokilaṁ 2.3: đổi chim cu gáy thành chim tu hú — tầng Việt dùng chim tu hú ở 53 khoá và chim cu gáy chỉ ở đúng khoá này; cu gáy trong tiếng Việt còn là loài bồ câu, không phải kokila. asmiṁ loke paramhi ca 1.4: đổi ở thế giới này và ở thế giới kia thành ở đời này và đời sau, vì trong 21 khoá cùng Pāli, 18 khoá dịch đời này … đời sau (kể cả các biến thể hay, lẫn, cõi) và chỉ 3 khoá dịch thế giới này … thế giới kia. Nhận định cũ trong notes rằng cách thế giới này … thế giới kia trùng ở 19 khoá là SAI (đúng là 3/21, không phải 19); lỗi này nằm ở notes, đã bị phát hiện và sửa ở đây. saṇhavācena 2.3: dịu dàng, giữ cách đã dùng ở ja89 (saṇhā dịu dàng) và tách khỏi sakhila hòa nhã ở 3.1 để hai từ không bị dồn làm một. Điểm: terminology 8,9 → 9,1.
  (3) CHÚ THÍCH KHOÁ 2.1 VÀ 2.2, loại clarity fix và accuracy fix. nanu … sao: dịch chẳng phải … sao, theo tiền lệ dn16, dn24 (nanu = câu hỏi chờ đáp xác nhận); bản cũ dịch Này …, bỏ nanu. kāḷiṁ: bản cũ để nguyên kāḷi như tên riêng chưa dịch, trong khi toàn tầng chỉ có Kāḷī là tên người ở mn21, mn50 và dn9/dn13 là tính từ chỉ màu da (kāḷī vā sāmā vā); ở đây kāḷiṁ đứng đồng vị với kokilaṁ và đi cùng dubbaṇṇaṁ, nên dịch là con chim đen. tilakāhataṁ: lốm đốm, vì tilakāhata ở tầng Việt được dịch là đốm, nốt, rỗ (mn13, mn130 đốm nâu; sn7.10 mặt rỗ; ja547 nốt ruồi) — bản cũ vạch sẹo đánh dấu thêm ý vết sẹo mà Pāli không nói. 2.4 pāṇinaṁ: nhiều sinh vật; bản cũ thêm loài chim, Pāli chỉ nói pāṇa. 3.4 bỏ chữ lại thêm vào (madhuraṁ tassa bhāsitaṁ không có từ ứng với lại), theo tiền lệ dhp363:4. Điểm: vietnamese_clarity 9,1 → 9,2.
  (4) TIỀN LỆ TRÙNG TRONG BÀI VÀ TOÀN TẦNG. Pāli trùng nguyên văn trong chính bài: 0 cặp (17 khoá đều khác nhau), nên phép này rỗng. Khoá 3.2 trùng dhp363:2, thag17.2:26.2, thig13.2:11.2 đều dịch nói lời chín chắn, không dao động; 3.3 trùng dhp363:3 đều giảng giải nghĩa và pháp: giữ nguyên.
  (5) BẤT ĐỊNH CÒN LẠI, GIỮ NGUYÊN. (a) kāḷiṁ vẫn có thể là một con chim cái hay chim non màu sẫm chứ không chỉ là chim đen; không có tầng Anh hay tầng Việt hiện hành để phân xử, nên giữ cách đọc bám tính từ chỉ màu. (b) tilakāhataṁ: lốm đốm là cách đọc rộng nhất, chấm hay vạch đều chưa kiểm chứng được. (c) Các đối chiếu ở trên chỉ là đối chiếu nội Pāli (sakhila, nanu, tilakāhata, kāḷī …), không có bản dịch độc lập nào của bài này, nên triangulation chỉ nâng 6,9 → 7,0 và vẫn dưới 8,0 như luật. (d) Phần văn xuôi mở bài (câu chuyện nền) không có trong bản Pāli đã ghim nên không đối chiếu được ai là người nói 2.1; giữ ngươi như bản cũ. ambiguity_integrity 8,7 → 8,8 vì đã nêu đúng các bất định thật và sửa nhận định sai ở notes.
  (6) KHÔNG ĐỔI: source_provenance 9,5, segment_alignment 10,0, han_viet_balance 9,1, technical_integrity 9,6 (vẫn chưa chạy npm run validate, npm test, npm run check, npm run build). Blocker thiếu hẳn tầng tham khảo English giữ nguyên vì đó là sự thật về upstream. final_score = 90,3 / 10 = 9,03.
