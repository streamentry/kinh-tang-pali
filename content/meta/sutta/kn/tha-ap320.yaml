notes: |-
  Bản dịch tiếng Việt mới cho bài kinh tha-ap320 — trưởng lão Tiraṁsiyo, bài thứ tám
  trong Ārakkhadāyakavagga.

  Tiền kiếp: bậc Thành Tựu giữa vùng núi sâu sáng rực như sư tử mới sinh và như đống lửa
  lớn trên núi. Ông thấy ba nguồn sáng — mặt trời, trăng và ánh sáng của Đức Phật — dẹp bóng
  tối của thế gian; vắt da thú lên vai bước đến; tán thán công hạnh của Đức Phật rồi hưởng
  một kiếp ở chỗ cùng tận thiên. Vào chín mươi tư kiếp trước là quả của sự tán thán; vào bảy
  mươi bảy kiếp trước ông làm Chuyển Luân Vương.

  Bất định đã ghi lại, không sửa trong kinh:
  - `sāvakuttamaṁ` (3.2) đọc nguyên văn là bậc Tối Thượng trong hàng đệ tử. Ngữ cảnh có
    thể còn là Đức Phật tự phụ vị đệ tử ưu nhất. Không đủ chứng để chọn, nên giữ cách đọc
    nguyên văn và ghi ở đây thay vì thêm chú thích vào thân kinh.
  - `eko ñāṇadharo ahu` (7.2) xuất hiện đúng một lần trong toàn bộ Pāli đã ghim. Dịch là
    có một bậc mang tri thức theo nghĩa từ; không dám coi đây là tên riêng của một vị vua,
    vì là vậy sẽ bịa thêm danh tính không có nguồn.
  - `Vimānaṁ sapabhassaraṁ` (5.4) dịch là cung điện bay có ngàn cánh tay. `sabha-ssara` là
    có cánh, nên hình ảnh là cung điện bay chứ không phải ngai đá.
  - `Kesariṁ abhijātaṁva` (1.1) dịch là như vừa sinh ra từ bậc sư tử; `Obhāsentaṁ disā
    sabbā` dịch theo tha-ap138:1.3 là soi sáng khắp mọi phương trời.
  - `Ekaṁsaṁ ajinaṁ katvā` dịch là vắt tấm da thú lên một bên vai, y hệt tha-ap356:1.3
    và snp5.1:52.3.
  - `Ekasaṭṭhimhito kappe` là bảy mươi bảy kiếp, khớp hai cặp tiền lệ tha-ap195 và
    tha-ap236.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của chính tầng Việt qua `_hvi.save_vi`: đủ 36/36 khoá, cân ngoặc kép trên cả bài, đúng số dấu lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10 tiêu chí, tính bằng script.

  Sửa lan 2026-10-13 (cơ học, toàn tầng): khoá tha-ap320:6.3 — `duggatiṁ nābhijānāmi` trước dịch “Ta
  không biết mình rơi vào khổ đau,”, đảo nghĩa (Pāli: không còn biết đến, tức không còn rơi vào, đọa
  xứ nào) → “Ta không còn biết đến đọa xứ,”; giữ nguyên xưng hô của bài. Cùng công thức đã dịch đúng ở
  đa số khoá trong tầng.

  Sửa lan 2026-10-13: khoá tha-ap320:7.1 — `Ekasaṭṭhimhito kappe` *Vào bảy mươi bảy kiếp trước,* →
  *Vào sáu mươi mốt kiếp trước,*. Căn cứ: `ekasaṭṭhi` = eka (1) + saṭṭhi (60) = 61; 77 là
  `sattasattati` (`tha-ap195:4.1` `Sattasattatikappamhi`), nên ghi chú trước viện dẫn `tha-ap195`
  làm tiền lệ cho `Ekasaṭṭhimhito` là nhầm cụm. Thay thế dòng ghi chú trước *Ekasaṭṭhimhito kappe là
  bảy mươi bảy kiếp*. Phép tính: 1 + 60 = 61 → *sáu mươi mốt* (*mốt*, không phải *một*, sau hàng
  chục).

  Quyết định hội đồng biên tập 2026-10-16: C6 — 2.4, 5.2, 6.3 (xưng hô theo mục 9: người kể xưng "tôi").
