notes: |-
  **Bài này.** `tha-ap154` — phẩm `Bandhujīvakavagga` (`Phẩm Bandhujīvaka`), bài thứ
  **hai** trong phẩm, vị trưởng lão **Tambapupphiya** (rải hoa điều thụ). Kệ mở
  ngoặc kép ở `:1.1` và đóng ở `:8.3` — nhịp nháy **cố ý chạy qua khoá**, nên tôi so
  khớp từng khoá với Pāli chứ không làm mỗi khoá tự cân.

  **`translationTitle` bằng đúng `:0.3`.** Pāli `:0.3` = `Tambapupphiyattheraapadāna`
  **không bắt đầu bằng số** ⇒ theo luật "giữ số khi và chỉ khi Pāli `:0.3` bắt đầu bằng
  số", bản dịch không có số thứ tự, và `translationTitle` viết **y hệt** giá trị
  `:0.3`. Đây là lỗi từng mắc 4 lần ở 4 đợt (nơi agent đặt số vào `:0.3` rồi quên
  sửa `translationTitle`; ở đây ngược lại — Pāli không có số nên tôi không thêm).

  **Phe dấu `ti` — đo lại ở phạm vi gần nhất, hai con số đều nêu.**
  Cùng phẩm `tha-ap153`–`tha-ap162`: **Tuyên Ngôn 6 · Tuyên Ngợ 2 · Ký Sự 1** ⇒ đa số
  gần nhất là **Tuyên Ngôn**, tôi theo. Toàn tầng `tha-ap` (405 tệp có `:0.3`): **Tuyên
  Ngợ 220 · Ký Sự 95 · Tuyên Ngôn 87**. Hai phạm vi cho hai đa số khác nhau — đúng như
  `BRIEF_THAP` cảnh báo, nên tôi nêu cả hai và theo **phạm vi gần nhất**.

  **Tên phẩm `:0.2`.** Cùng phẩm: `Phẩm Bandhujīvaka` 4 · `Phẩm Bậc Bandhujīvaka` 1 ·
  `Phẩm Hoa Dâm Bụt` 3. Ba tệp `Phẩm Hoa Dâm Bụt` (`tha-ap157/158/161`) là lỗi đã
  biết — `Dâm Bụt` không có gốc trong Pāli; đa số đúng là **`Phẩm Bandhujīvaka`**, tôi
  theo. (Toàn tầng không có đa số cho phẩm này vì tên đã bị chia.)

  **Tiền lệ, đếm được.** Tầng Việt `kn` có **2.263 bài / 31.495 khoá Pāli trùng nguyên
  văn đã có bản Việt**. Trong 35 khoá tôi dịch:
  - **13 khoá** tìm thấy tiền lệ ở nơi khác trong tầng, quét **2.640 cặp Pāli trùng**.
  - **1 khoá** ghi **nguyên văn** y hết một bản Việt đã có: `:8.2` (`…pe…` → `…`).
  - **12 khoá** có tiền lệ nhưng tôi **viết khác**, và đều là chỗ khác có lý do:
    `:0.1` (tên bộ Pāli, 414 tiền lệ; chỉ 9 tệp sai — xem cuối), `:0.2` (đa số đo được ở
    trên), `:3.3` (xem dưới), `:5.2` (`vippasannena cetasā` có 13 tiền lệ với 9 cách viết
    khác nhau; tôi dùng *với tâm hoàn toàn thanh tịnh* cho cả lát để 2 bài nhất quán),
    `:6.1` (10 tiền lệ nhưng **3 tiền lệ sai số** — *chín mươi chín*; `Ekanavuti` =
    1 + 90 = 91 nên tôi dùng *Chín mươi mốt kiếp về trước* như 7 tiền lệ đúng),
    `:6.2` (13 tiền lệ; tôi giữ vế `pupphama` = *lần đầu* mà 12/13 tiền lệ bỏ),
    `:6.3` (xem dưới), `:6.4` (`idaṁ` = *đây*, tiền lệ dùng *đó*; tôi theo Pāli),
    `:7.3` (11 tiền lệ; đa số *Đầy đủ bảy món báu quý giá*), `:7.4` (12 tiền lệ; đa số
    *Chuyển luân vương có đại thần lực*), `:8.1` và `:8.3` (tiền lệ đồng nhất).
  - **0 cặp Pāli trùng nguyên văn trong chính bài** ⇒ không có chỗ nào phải viết khác vì
    bài tự mâu thuẫn.

  **`Duggatiṁ nābhijānāmi` — đo lại, hai con số.** Toàn tầng: *đọa xứ* 171 · *khổ đau* 131
  · *khổ xứ* 51 (n=357). Riêng cùng phẩm: *khổ xứ* 4 · *đọa xứ* 1 · *khổ đau* 1. Riêng
  cùng phẩm kế bên của bài kia (`tha-ap203`–`212`): *đọa xứ* 4 · *khổ xứ* 3. Hai phạm vi
  gần nhất **trái nhau**, nên tôi theo đa số **toàn tầng** (*đọa xứ* 171) — cũng là cách
  sát `duggati` (cõi xấu) hơn — và dùng y hệt ở cả hai bài của lát.

  **`Pallaṅkaṁ ābhujitvāna,` (`:3.3`) — tiền lệ SAI, tôi không theo.** Cùng Pāli này có 5
  nơi: `tha-ap116:4.3` = *ta dọn tấm chiếu tựa trải ra* (đúng) và `tha-ap137:4.3` =
  *Giang cả hai chân* (**sai** — đọc nhầm `ābhuj` thành *hai chân*). Tra toàn Pāli root
  5.764 tệp: `pallaṅka` + `ābhuj` là **thành ngữ ngồi xuống** (`dn25:16.13`,
  `dn10:2.5.3`, `dn2:67.3` đều *"nisīdati pallaṅkaṁ ābhujitvā"* = ngồi xuống sau khi
  trải tấm phủ), và `dn1:1.15.2` liệt `pallaṅka` cùng nhóm chiếu ghế. Tôi dịch
  *Trải tấm phủ xong,* theo nghĩa thành ngữ. **Báo coordinator:** `tha-ap137:4.3` cần sửa.

  **Ba chỗ dịch theo nghĩa vì Pāli lưỡng nghĩa — đã ghi, không che.**
  1. `pāṭaliṁ pādaputtamaṁ;` (`:3.2`) — **hapax toàn Pāli root** (đếm bằng regex trên
     5.764 tệp: 1 kết quả, chính khoá này). Tôi đọc `pāṭali` = bệ ngồi ván, `pādaputtama`
     = bậc tối thượng **của loài cây** (theo `pādapala` = tán cây), dịch *thành một bệ
     ngồi, bậc tối thượng của loài cây*. Cách đọc thứ hai (`pada` = chân / bệ cao) cho
     *bậc tối thượng các loại bệ*; tôi không chọn vì nó lặp `pāṭali` ngay trước.
  2. `susaṅñato` (`:7.2`) — **hapax** (`susaṅñata` 0 kết quả trong Pāli root). Đọc
     `saṅñāta` = được nâng đỡ / vững chắc, nên `rājā susaṅñato ahaṁ` = *tôi làm vua, an
     nhàn vững chắc*. Tôi cố ý **hạn chế mức chắc chắn** thay vì dịc thẳng.
  3. `Anekatāle papatiṁ,` (`:5.3`) — `anekataāle` có đúng 2 nơi: `ja472:9.1` *"Anekatāle
     narake"* (thời gian) và khoá này. Tôi chọn nghĩa **quãng đường** vì nó đi kèm nơi
     chốn `giridugge` ở vế kế, dịch *Bay lên cao, xa nhiều do-tuôn*. `do-tuôn` (yojana)
     có **0 tiền lệ** trong tầng (cả `do-tuôn` lẫn `công xa` đều 0), nên tôi ghi rõ là
     lựa chọn của tôi chứ không phải khuôn có sẵn. Vế `5.4` (`giridugge bhayānake`) tôi
     không thêm động từ nào vì `papati` ở `5.3` đã chiếu hết.

  **Hai chỗ tôi chủ động làm rõ chủ thể, không thêm ý.** `:1.3` `Vanantaṁ abhidhāvissaṁ`
  không có tân ngữ trong Pāli; tôi dịch *Tôi đã gặp vị ấy giữa rừng,* — `Vanantaṁ` là
   cách bối sắc của chỗ chốn ("ở rừng", đúng như `tha-ap470:1.1` `Vanantare buddhaṁ
   disvā`), `abhidhāvati` = gặp phải, và chủ ngữ là `ahaṁ` của cả bài. `Vananta` không
   phải tên riêng ở đây (đếm `Vanantaṁ` trong Pāli root: chỉ 2 kết quả, đều là cách bối
   sắc chỗ chốn).

  **`piṇḍibandhaṁ sunimmitaṁ;` (`:2.2`) — hapax.** `piṇḍi` = đi xin ăn, `bandha` = bó,
   nên nó là **tân ngữ** cho vị trì xin ăn; tôi dịch *vị trì xin ăn, gói lương đựng chỉnh
   chu* và giữ cả hai vế. `sunnimita` cũng hapax nhưng thành phần rõ (`su` + `nimita`).

  **`Tambapupphaṁ gahetvāna,` (`:2.3`).** `tambapuppha` cũng là hapax trong Pāli root, và
   nó vừa là tên cây vừa là gốc tên vị trưởng lão. Tôi **giữ nguyên dạng Pāli**
  (*hoa tambapuppha*) thay vì bịa tên cây Việt, vì tầng đã làm đúng như vậy cho cây
  trong cùng phẩm: `tha-ap153:3.1` *Những đóa hoa bandhujīvaka*, `dn16:3.30.2` *Như hoa
  kaṇikāra màu vàng*. Cùng lý đó tôi giữ `Tambapupphiya` có dấu Pāli.

  **Khoá `9.1` — ngoài lát, tôi KHÔNG sửa, và nói rõ.** `:9.1` nằm trong `all` nhưng
  **không** nằm trong `keys` của lát, và tệp đã có sẵn câu *Tôi nghe như vầy: Tôn giả
  Trưởng lão Tambapupphiya đã từng nói bài kệ này.* Câu đó dùng **số ít** *bài kệ này*
  trong khi Pāli `imā gāthāyo` là **số nhiều** — đúng nhóm 21 khoá mà `BRIEF_THAP` đã
  gọi là lỗi ở 4 lát liên tiếp; nhóm đa số là 407 khoá *"…đã nói **những** bài kệ này"*
  (bài anh em cùng phẩm `tha-ap153:7.1` và `tha-ap155:7.1` đều dùng nhóm này). Tôi **không
  tự sửa** vì ngoài phạm vi lát, nhưng **báo coordinator sửa một lượt cho cả nhóm 21**.
  Trong `tha-ap212:7.1` cùng công thức thì đã đúng số nhiều.

  **Lỗi tìm được ngoài lát — chỉ báo, không sửa.** (a) **9 tệp** đặt `:0.1` = *Trưởng Lão
  Ký Sự* trong khi Pāli `Therāpadāna` là **tên bộ**: `tha-ap76`, `183`, `193`, `223`,
  `263`, `293`, `353`, `373`, `463` (tìm bằng cách so Pāli `:0.1` với VI của cả tầng).
  Đây là tên của *một bài kinh* đặt nhầm vào *tên bộ*. (b) `tha-ap137:4.3` sai như đã nói.

  **`…pe…`.** `:8.2` Pāli = `…pe…`; bản Việt giữ **đúng một** `…`, không mở rộng — theo
  `BRIEF_VI3` §10.1 và đúng như 100+ tiền lệ trong tầng.

  **Năm phép kiểm tự viết (`_hvi.py` chạy rỗng ở `tha-ap`).** Ở phẩm này 35/36 khoá Pāli
  ngắn hơn 40 ký tự, nên bộ lọc `len(p[k]) >= 40` của `_hvi.py` không quét khoá nào và
  báo xanh — đó **không phải pass**. Tôi tự quét **mọi khoá**: (1) tập khoá
  `set(VI) == set(Pāli) == set(all)` → 36/36, không thừa, không orphan; (2) ngoặc kép
  `“”` **và** nháy đơn `‘’` so **từng khoá** với Pāli (không phải mỗi khoá tự cân) → 0 lệch,
  tổng còn dư = 0; (3) dấu lược: 1 khoá Pāli có `…pe…`, giữ đủ 1 `…`, không mở rộng chỗ
  nào → 0 lệch; (4) rỗng / `(…)` chưa dịch → 0; (5) NFC + không trùng nguyên văn Pāli
  (trừ `:0.1` là tên bộ) + thứ tự khoá bằng Pāli → 0 lỗi. Ngoài ra: **0 cặp Pāli trùng
  trong chính bài**. Ghi lại 2 lần cho idempotent, byte-for-byte không đổi.

