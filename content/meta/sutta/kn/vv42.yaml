notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho vv42.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 26 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Kiểm toán độc lập 2026-10-11 (đọc đối kháng từng khoá Pāli↔Việt; bản trước tự chấm 9.23):
  - Lỗi nghĩa thật đã sửa: (1) vv42:3.3 `yassa kammassidaṁ phalaṁ` là mệnh đề quan hệ ("nghiệp mà đây là quả"), bản cũ đọc thành mệnh đề chỉ định "quả báo của nghiệp này là thế" → "về nghiệp mà đây là quả báo" (tiếp nối động từ giải đáp bị lược ở 3.2; cùng lỗi lan ở khoảng 40 tệp vv khác, chưa sửa ở đây). (2) vv42:5.2 `kummāsapiṇḍiyā` là "nắm bánh kummāsa", bản cũ dịch thành "phần cúng dường", làm mất vật được dâng → "nắm bánh mạch kummāsa". (3) vv42:4.1 `Ahañca bārāṇasiyaṁ`: "Ahañca" là chủ ngữ ("Và tôi") còn `bārāṇasiyaṁ` là vị trí cách; bản cũ biến thành "tôi ở thành…" và thêm "Thuở trước" không có trong Pāli → "Và tôi, ở thành Bārāṇasī," (4.3 nối thành "đã dâng…").
  - Thêm nghĩa/thừa chữ đã gỡ: 1.2 "nơi đây" (Pāli không có `idha`), 5.1 "Chỉ… ấy", 5.3 "nàng… thế này", 5.4 "các việc phước lành" (puññaṁ số ít → "tạo phước").
  - Thuật ngữ: `vaṇṇo` ở 2.3 và 6.3 bản cũ dịch "sắc tướng" trong khi 1.1, 2.1, 6.1 dịch "dung sắc" cho cùng từ → thống nhất "dung sắc" (đa số 234 khoá vv dùng "dung sắc", 29 khoá dùng "sắc tướng"). `sukkhakummāsa` bản cũ "bánh cháo khô" (cháo khô tự mâu thuẫn) → "bánh mạch kummāsa khô", theo tiền lệ "nắm bánh mạch kummāsa" ở vv14:6.5 và vv71:4.3.
  - Tiêu đề 0.4/7.1 và `translationTitle`: bỏ "Nữ" thừa ("Alomā" đã là tên; vv39–vv48 không thêm "Nữ").
  - Không đổi, đã nghi ngờ: tiêu đề 0.2 "Chuyện Cung Điện Nữ Hư Không" sai gốc (`Itthivimāna` = cung điện của các nữ thiên, không có `ākāsa`), lặp ở khoảng 51 tệp vv nên không sửa riêng một tệp. 1.4 "rực rỡ tựa như sao mai": chữ "rực rỡ" là phần diễn đạt thêm nhẹ nhưng đã là quy ước 22 tệp.
  - Bất định còn lại: `Alomaṁ` ở 5.3. Tên Alomā có trong bảng tóm lược cuối vv50 và tên cung điện, nên giữ làm tên riêng (đối cách giống cái), nhưng không phân xử được vì sao người nói tự gọi mình bằng tên ở ngôi thứ ba, hay chữ này mang nghĩa khác; không có tầng tham khảo nào để đối chiếu. 5.1–5.2: `sukkhāya aloṇikāya` là tính từ của `kummāsapiṇḍiyā`, nên giữ dạng đoạn "Khô và không có muối," để bám trật tự Pāli.
  - Số khoá đổi: 12/26 (0.4, 1.2, 2.3, 3.3, 4.1, 4.3, 5.1, 5.2, 5.3, 5.4, 6.3, 7.1). Lỗi nghĩa thật: 3 khoá đã sửa (3.3, 4.1, 5.2) + 1 khoá chưa sửa do lỗi họ (0.2); còn lại là thêm nghĩa/thuật ngữ nhẹ.
  - Điểm: semantic_fidelity 9.3→8.7, grammar_logic 9.3→8.9, terminology 9.2→8.6, vietnamese_clarity 9.3→9.0, ambiguity_integrity 9.2→8.6; các tiêu chí khác giữ; triangulation giữ 7.5 vì vẫn không có tầng tham khảo độc lập. `final_score` 9.23→8.98.
  - Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; `technical_integrity` giữ 9.6.

  Lượt cải thiện 2026-10-11 (lượt hai, đọc đối kháng lại 26 khoá Pāli↔Việt và đo tiền lệ toàn tầng vv): không đổi khoá nào, không đổi điểm nào, vì không tìm thêm lỗi thật có căn cứ để sửa.
  - Tiền lệ đã đo, cách dịch hiện tại khớp đa số: 1.4 "rực rỡ tựa như sao mai" 20/24 cặp Pāli trùng (3 cặp bỏ "rực rỡ", 1 cặp khác hẳn); 1.3 "Chiếu sáng khắp mọi phương trời" 14/15; 3.1 "Nữ thiên ấy hoan hỷ" 43/43; 3.3 "về nghiệp mà đây là quả báo" 32/68 là dạng đa số tương đối (25/68 là "quả báo của nghiệp này là thế", dạng đã bị lượt trước xác định là đọc sai quan hệ `yassa … idaṁ`); 4.4 "với tâm tịnh tín bằng chính đôi tay mình" 11/12; 6.1 "Nhờ vậy tôi có được dung sắc như thế này" 57/63; 2.1 "Do đâu nàng có được dung sắc như thế" 30/41.
  - Chỗ chưa thể thống nhất theo đa số: `sabbadisā` ở 2.3 và 6.3 dịch "khắp mọi phương" (ở các cặp Pāli trùng nguyên văn, cả hai dạng "khắp muôn phương" và "khắp mọi phương" đều xuất hiện nhiều, không dạng nào áp đảo). Hai dạng cùng nghĩa, không có đa số rõ, nên giữ và đồng bộ với 1.3 "mọi phương trời" trong cùng bài.
  - Đã nghi và quyết định không đổi: 4.2 `buddhassādiccabandhuno` đứng trước động từ `adāsiṁ` ở 4.3, "đối với Đức Phật" hơi gượng nhưng khớp 2/4 tiền lệ và không thêm nghĩa; 0.2 `Itthivimāna` vẫn là lỗi họ (48 trong 85 tiêu đề 0.2 của tầng vv dùng "Nữ Hư Không", không có `ākāsa` trong Pāli), chưa sửa riêng một tệp.
  - Bất định còn lại: `Alomaṁ` ở 5.3. Quét Pāli root: chỉ có 4 nơi (`vv42:0.4`, `vv42:5.3`, `vv42:7.1`, `vv50:34.2` "Alomākañjikadāyikā" trong bảng tóm lược, nơi `Alomā` là một mục tên riêng) cùng `Alomahaṭṭho` ở ja541:6.5 (nghĩa khác, "không dựng tóc gáy"). Không có căn cứ phân xử nghĩa khác, nên giữ "Alomā" là tên riêng; không có tầng tham khảo nào để đối chiếu thêm.
  - Điểm không đổi: semantic_fidelity 8.7, ambiguity_integrity 8.6, triangulation 7.5 (vẫn không có tầng tham khảo độc lập). `final_score` 8.98 (trung bình số học thô của 10 điểm).

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 0 khoá bất đồng nghĩa → sửa 0, giữ 0, bất định 0. Mọi khoá có nội dung cùng nghĩa với bản nguyên bài (các khoá …pe… ở 2.2, 3.2, 6.2 bản nguyên bài bung thành văn nên không so được). Bản nguyên bài cũng hiểu `Alomā` ở 5.3 là tên riêng, khớp bản dự án, nhưng đó vẫn chỉ là một nguồn Việt; bất định đã ghi ở trên về `Alomaṁ` không đổi. Cụm `yassa kammassidaṁ phalaṁ` (3.3) khớp 48 khoá cùng Pāli trong tầng. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Quyết định hội đồng biên tập 2026-10-16: A13 — 2.3 (bỏ dấu chấm thừa sau dấu kết lời thoại (`?”.`/`.”.` thành `?”`/`.”`)).
