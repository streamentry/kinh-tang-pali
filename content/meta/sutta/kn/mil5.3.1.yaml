notes: |-
  `Seṭṭhadhammapañha`, câu hỏi thứ nhất của `Paṇāmitavagga`. 34 khoá, tất cả đã
  dịch.

  TẦNG THAM KHẢO — đo, không đoán. 0/8 bài `kn` của lát này có bản Anh Sujato tại
  commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có cp, dhp, iti, ja, kp,
  snp, thag, thig, ud. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng
  `vietnamese-current` cũng vắng (`translation/vi/phantuananh` tại commit đã ghim chỉ có 26 tệp,
  toàn bộ là Pháp Cú), và lớp lấp `english-project` của dự án không có uid nào trong lát. Ba
  tầng tham khảo đều vắng ⇒ blocker thật ⇒ `draft` cho cả lát, và `triangulation` bị chặn ở 7.5
  (≤ 8.0) cho **mọi** bài trong lát.

  VĂN XƯNG — chọn theo bầy lân cận, và đây là lý do:

  mil5.3.1 và mil5.3.4 nằm trong `Paṇāmitavagga`; đếm trên 5 bài mil5.3.* đã merge cho
  6/6 dùng `thưa ngài Nāgasena` và 28/28 dùng `tâu đại vương` (ghi thường sau `cũng vậy`). mil5.5.2
  và mil5.5.4 nằm trong `Santhavavagga`; đếm trên 3 bài mil5.5.* đã merge cho 8/8 `thưa ngài
  Nāgasena` và 17/17 `tâu đại vương`. Nên bốn bài này dùng đúng hai văn xưng đó. mil7.5.10 thì
  đếm trên 9 bài mil7.5.* đã merge cho 7/9 `thưa tôn giả Nāgasena` và 32/37 `này Đại vương` (đa số
  cả tầng mil cũng theo hướng này), nên mil7.5.10 theo bầy mil7.5 chứ không theo hai bài lạc
  lõng mil5.4.1/mil5.4.10. Ghi lại để người điều phối gộp: nếu sau này chốt một văn xưng chung
  cho cả `mil`, cả lát này phải sửa theo.

  ĐẦU BÀI 0.2/0.3/0.4 giữ Pāli theo mil5.3.5 và mil5.3.10 (`Meṇḍakapañha`, `Paṇāmitavagga`)
  — hai bài cùng phẩm đã merge. Ba bài còn lại của phẩm (mil5.3.7, .9, .12) dịch tiêu đề phẩm
  theo cách khác và còn dùng danh xưng “Mi-lan-đà Vấn Đạo / Mi-tiên Vấn Đáp” cho `Milindapañha`,
  tức đã lệch khỏi 163/174 bài còn lại của tầng `mil`. Giữ Pāli là đi theo đa số tầng và đi theo
  hai bài lân cận sát nhất. Ghi lại để người điều phối gộp.

  THUẬT NGỮ — tra tiền lệ bằng `grep -o ... | sort | uniq -c | sort -rn` trước khi
  chốt, không đoán: `bhante` khi một tỳ-kheo gọi tỳ-kheo → “bạch ngài” (đếm trên toàn tầng
  `an/`: “Bạch Ngài” 28× + “bạch Ngài” 6×, mạnh hơn mọi cách khác); `mahārāja` → “tâu đại vương”
  (số đếm ở mục văn xưng trên); `bhagavatā` → “Thế Tôn”; `therena sāriputtena dhammasenāpatinā` →
  “Trưởng lão Sāriputta, Tướng quân của Chánh pháp” (theo mil7.5.7); `sotāpanno` → “Nhập Lưu”
  (tiền lệ đếm được 18× trong tầng `kn`); `samaṇakaraṇā dhammā` → “phẩm chất của bậc sa-môn”;
  `liṅga` → “dấu hiệu”; `micchā` → “sai”; `sampaṭicchāmi` → “trẫm xin kính nhận” (theo
  mil5.3.5/mil5.4.5); `seṭṭho` → “tối thượng”.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `dhātusus` không có ở bài này; `dve ca liṅgāni` (3.1) nói **hai** dấu hiệu nhưng các khoá 4.1
  –11.1 liệt kê bảy lý do, mỗi lý do lại kết bằng cùng một vế `arahati upāsako sotāpanno …`.
  Cách chép của Pāli gốc không cho ta phân biệt chính xác dấu hiệu thứ nhất với thứ hai ở đâu, nên
  bản này **không** tự gán nhãn “dấu hiệu thứ nhất / thứ hai” cho từng khoá — chỉ giữ đúng số
  kệ của Pāli và phép lặp. Người đọc không mất thông tin nào so với nguyên văn.
  `vīsati` (hai mươi) đối chiếu danh sách ở 3.3: đếm đủ 20 mục
  (`dhammārāmo, niyamo, cāro, vihāro, saṃyamo, saṃvaro, khanti, soracca, ekattacariyā,
  ekattābhirati, paṭisallāna, hiriottappa, vīriya, appamāda, sikkhāsamādāna, uddeso, paripucchā,
  sīlādiabhirati, nirālayatā, sikkhāpadapāripūritā, kāsāvadhāraṇa, bhaṇḍubhāvo`) nên con số khớp,
  không cần giải thích thêm.
  `soraccaṁ` dịch “nhẫn nhịn nhẹ nhàng”, phân biệt với `khanti` (“nhẫn nhịn”) ngay trước nó;
  `bhaṇḍubhāvo` dịch “việc phá bỏ tranh chấp”; `uddeso` + `paripucchā` dịch “việc giảng dạy và
  việc hỏi đáp”. Ba thuật ngữ này **không có tiền lệ** trong tầng Việt dự án (đếm 0), chọn theo
  nghĩa thường dùng trong văn chuẩn Pāli rồi ghi ở đây.
  `vāseṭṭha` là tên vua (Milinda tức vua Vāseṭṭha), không phải cách gọi tôn kính — dịch “Này
  vua Vāseṭṭha”. `diṭṭhe ceva dhamme abhisamparāye cā` dịch “ở cả pháp đã thấy lẫn pháp đã chứng
  đắc”; `abhisamparāya` là sự chứng đắc viên mãn, không phải “đạt đến”.

  MỘT LỖI ĐÃ BẮT VÀ SỬA TRONG REVIEW ĐỐI KHÁNG — ghi lại để không tái phát. Bản nháp đầu tiên
  lệch **một khoá** ở cả 1.3–1.6: vì `vc/c27.json` không phải cứ một dòng Pāli là một khoá, mà
  `p27.txt` hiển thị ba dòng khoá liên tiếp có thể lệch vị trí khi đọc. Đã đối chiếu lại **từng
  cặp** Pāli ↔ Việt sau khi ghi và sửa; nếu lát sau có mẫu `Yadi … bhaṇitaṁ— / ‘…’ti, tena hi
  ‘…’ti yaṁ vacanaṁ, taṁ micchā.` thì phải in cặp ra đọc, đừng tin trí nhớ.

  DẤU LƯỢC — Pāli bài này **không** có `…pe…` ở khoá nào, nên không phát sinh chính
  sách. Văn xưng, phẩm chất, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ. Toàn bộ 34 khoá đã
  đi qua `_hvi.kiểm` (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên
  văn Pāli, không lọt Pāli, khớp số dấu lược) trước khi ghi.

  VĂN PHONG — phần lớn lát là truyện kệ, nhịp câu ngắn; giữ niêm luật kệ ngôn và
  phép lặp mang cấu trúc (bốn câu hỏi–đáp trong mil5.5.2, năm phần của voi trong mil7.5.10,
  năm ẩn dụ liên tiếp trong mil5.5.4) thay vì diễn giải, theo `skill/translation.md` §9.

  `technical_integrity` đặt 9.6 vì bốn cổng kỹ thuật đều xanh (xem mục cuối), chưa đủ
