notes: |-
  **Đủ 9/9 khoá trong `all`.** Bài đầu tiên của lát này trong tạng Netti, và tiền lệ
  rất sát: `ne28` (Sampāta 9) và `ne34` (Sampāta 15) đã dịch trên đĩa với **cùng bộ
  nhãn**. Tôi bám đúng bộ đó, không đặt mới: `Netti` · `Paṭiniddesavāra` → *Phần Giải
  Thích* · `Sampāta 13` → *Nhóm 13* · `hāra` → *phương thức* (mode) · `Tattha katamo
  …?` → *Ở đây, nhóm phương thức … là gì?* · `Niyutto …` → *Nhóm phương thức … đã
  được vận dụng.*

  **`ne32:2.1` cùng nguyên văn với `ne28:2.1` và `ne34:2.1`**, nên dùng lại đúng cách
  dịch đã có, không dịch lại từ đầu — bài kinh không được tự mâu thuẫn.

  **Thuật ngữ mới của bài này: `sodhana` → *thanh tẩy*.** `sodhana` là mô tế của
  `visuddhi` (thanh tịnh viên mãn) nhưng nhấn vào khía cạnh *tẩy rửa*; vì `ne28`
  (`parivattana` → *Chuyển Đổi*) và `ne34` (`parikkhāra` → *Trợ Duyên*) đã đặt tên
  riêng theo nghĩa đen, tôi cũng giữ nghĩa đen thay vì dùng lại *thanh tịnh* đã có
  nghĩa riêng. `visuddhi` trong tầng Việt là *thanh tịnh*; `sodhana` khác, nên không
  đồng nhất hai từ. Đây là đặt mới của lát, chỉ có tiền lệ gián tiếp là *khổ hạnh
  thanh tẩy* (4 lần, `mn25`), nên `terminology` chấm 8.8.

  **`ārambha` → *việc khởi thành*.** Chỗ này `ārambha` là việc khởi đầu của một cuộc
  tra cứu (thuật ngữ quen thuộc trong Paṭiniddesa), không phải *sự khởi sinh* của
  tầng kinh — nên tôi giữ cả *việc* lẫn *khởi thành* để không lẫn với nghĩa toán
  từ của Tăng Bộ. `suddha` → *trong sạch* (tiền lệ dày: *hoàn toàn trong sạch*,
  *thân hành… đã trong sạch*). `pañha` → *câu hỏi*; `visajjita` → *được giải quyết*
  (343 lần *được giải* trong tầng, nên đây là tiền lệ dày, không phải đặt mới).

  **Bất định đã phân xử, không còn bất định.** `Yattha … visajjito bhavati` là câu
  tường thuật ở thì hiện tại; `na tāva` là dạng phủ định *chưa* của chính câu đó, tôi
  thể hiện bằng *vẫn chưa* để giữ đúng phủ định và mức độ. Không có chỗ nào cần
  ghi thêm.

  **Đã đọc PĀLI đầy đủ trước khi viết**, gồm `ne32` và cả hai bài tiền lệ `ne28`/
  `ne34` ở tầng Pāli đã ghim, cùng bản Việt của chúng trên đĩa.
