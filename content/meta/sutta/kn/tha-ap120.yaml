notes: |-
  Bản dịch phủ đủ 28/28 khoá Pāli, thứ tự khoá y hệt Pāli gốc (`pali.pal('kn','tha-ap120')`).
  Đây là bản viết lại từ Pāli: tệp trên đĩa trước lát này chỉ có 1 khoá (`:7.1`) và khoá đó còn dùng
  nhóm công thức sai (số ít) — đã sửa theo luật của lát, xem dưới.

  **Pāli trùng nguyên văn, dùng lại nguyên văn bản dịch** (chỉ mục Pāli→Việt dựng trên
  toàn tầng `content/translation/vi/project/`, 5.407 tệp Việt / 156.518 khoá Việt):
  - `Therāpadāna ` → `Therāpadāna` — 379 cặp cùng bản Việt, 9 cặp dùng `Trưởng Lão Ký Sự`.
  - `Mahāparivāravagga ` → `Phẩm Mahāparivāra` — 5/5.
  - `“Padumuttarabuddhassa, ` → `“Của Đức Phật Padumuttara,` — 7/10.
  - `Tena kammena dvipadinda, ` → `Nhờ vào nghiệp ấy, bạch Đấng Lưỡng Túc Tôn,` — 4/6.
  - `lokajeṭṭha narāsabha; ` → `bậc Trưởng Thượng thế gian, đấng Nhân Ngưu;` — 4/5.
  - `Jātiyā sattavassohaṁ, ` → `lên bảy tuổi kể từ khi sinh ra,` — 2/3.
  - `arahattamapāpuṇiṁ. ` → `vị ấy đã đạt tới bậc A-la-hán.` — 1/1.
  - `Sattaratanasampannā, ` → `Đầy đủ bảy món báu quý giá,` — 19/37 (thêm 6 cặp viết thường chữ
    đầu câu, cộng 25; nhóm còn lại dùng `bảy báu` 8 cặp).
  - `Paṭisambhidā catasso, ` → `Bốn vô ngại giải,` — 396 cặp, chỉ 1 biến thể.
  - `…pe… ` → `…` — 665/665, đúng một dấu lược, không mở rộng.
  - `kataṁ buddhassa sāsanaṁ”. ` → `đã làm tròn lời dạy của Đức Phật”.` — 363/396.
  - `Itthaṁ sudaṁ … abhāsitthāti` → `Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ
    này.` — 421/453 (đếm bằng script trên toàn tầng; thêm 1 cặp rơi vào cách khác); nhóm 31 cặp viết `đã từng nói bài kệ này` (số ít) chính là nhóm mà lát
    n33/n34/n35/n37 đã bị gọi là lỗi, nên không dùng.
  Tổng cộp 12 khoá dùng lại nguyên văn từ tiền lệ đếm được.

  **Hai khoá còn lại phải tự dịch từ Pāli, không có tiền lệ cùng Pāli:** `pañcakappasate ito.`
  dịch theo đúng hình thức của tiền lệ gần nhất `sattakappasate ito` → `là từ đây lùi về bảy
  trăm kiếp;` (tha-ap121:9.2, 1 cặp), nên dịch `là từ đây lùi về năm trăm kiếp.`; và
  `Sacakkhū nāma nāmena,` → `Tên là Sacakkhū,` theo hình thức `nāmena` quen dùng trong phẩm.
  `pañcakappasate` nói chung có 39 cặp cùng hình thức nhưng đều với số khác, không có cặp nào
  với `pañcakappasate ito`.

  **Bất định, ghi ở đây chứ không giải thích trong thân kinh:**
  - `Vippanaṭṭhā brahāraññe, / andhāva anusuyyare.` (1.3–1.4) — `vippanaṭṭhā` dùng đúng y như
    `vippanaṭṭhā mahāvane` ở 2.4 (chủ ngữ vô danh là nhóm đệ tử), nên dịch `họ tỏa sáng…`.
    `brahāraññe` dịch `rừng thiêng liêng` để giữ cạnh song song với `mahāvane` = `rừng vĩ đại`
    ở 2.4; cũng có thể đọc là `cõi trời`. `andhāva` lấy theo nghĩa danh từ `tối tăm`, không
    dịch `mù`.
  - `Tassa te munino puttā,` (2.3) — `puttā` ở đây dịch `con cái` theo nghĩa gốc, không ép
    thành `đệ tử`; `Tassa te munino` = `của Ngài, của bậc hiền tri`.
  - `Bhavanā oruhitvāna,` (3.1) — `bhavanā` là biệt thự các tầng (thường là nơi các vị giác ngộ
    hiện ra), dịch `các lầu các bậc`; tiền lệ gần nhất `Abbhato oruhitvāna` →
    `Từ trên cao rơi xuống,` (tha-ap78:3.3) không có `bhavana` nên không dùng được.
  - `sāvakā vanacārino` (1.2) — `vanacārī` = người sống nơi rừng; trong tầng này chỉ có
    `mahiṁso pavanacārako` (cp15:1.2), không phải cặp cùng nghĩa, nên dịch `sống trong rừng`.

  **Mệt hồi `ti` — đo ở phạm vi gần nhất rồi mới nới.** Trong cùng phẩm `tha-ap` có **0** khoá
  Pāli mang mệt hồi `ti` (đếm bằng script trên 5.407 tệp Việt), nên không đo được tỉ lệ tại
  chỗ; đo ở toàn tầng cho **22.682** khoá Pāli có `ti`: bản Việt **giữ** dấu ở **4** khoá,
  **bỏ** ở **22.678** khoá. Phe bỏ thắng tuyệt đối; kệ của ba bài này vốn không có `ti` nên
  không dính vào lựa chọn nào.

  **`translationTitle` bằng đúng giá trị `:0.3`**, kể cả việc không đặt số thứ tự: đo trên 4567
  tệp có `:0.3`, KEEP 177 / DROP 4390; riêng dạng `Bài Kệ …` thì **235/235 bỏ số thứ tự**, và
  mẫu câu đa số là `Bài Kệ Tuyên Ngợ Về Trưởng Lão` (168) so với `Tuyên Ngôn` (51). Số thứ tự
  đặt ở khoá đóng `:8.1` như 390 cặp tiền lệ (`:8.1` có số thứ tự 390 / không có 13).

  **Năm phép kiểm tự viết (không dùng `_hvi.py`, vì ở phẩm `tha-ap` nó quét rỗng).** Số dưới
  đây do script in ra, không ước lượng:
  1. `set(khoá Việt) == set(khoá Pāli)`: 28/28, thiếu 0, thừa 0, thứ tự khoá khớp Pāli.
  2. Dấu câu so **từng khoá** với Pāli: lệch 0. Nháy đơn `‘’`: 0 cả hai bên. Ngoặc kép mở 1 /
     đóng 1 và cân trên cả bài; Pāli cố ý mở ở `:1.1` và đóng ở `:6.3` nên mỗi khoá đều
     lệch một bên — bản Việt lệch **y hệt**, không phải lỗi.
  3. Pāli trùng nguyên văn **trong chính bài**: 0 cặp, 0 cặp Việt khác (không có hai khoá nào
     trùng nhau trong một bài).
  4. Dấu lược: `…pe…` của Pāli → đúng MỘT `…` ở `:6.2`; lỗi = 0; không có `… cho đến …`, không
     còn `(…)` khoá nào chưa dịch.
  5. NFC 0 lỗi, 0 khoá rỗng, 0 orphan.
  **Coverage tầng Anh, đo bằng script:** khoá Pāli ≥ 40 ký tự = **1** (loại 3 khoá block `:0`,
  còn 24 khoá Pāli ngắn hơn 40 ký tự nên nằm ngoài tập đo); tầng `english-sujato` phủ
  **0/1 = 0%**. Thư mục `content/translation/en/sujato/sutta/kn/` không có thư mục con nào, và
  tệp `tha-ap` duy nhất trong tầng Anh là **tệp tên** (không phải tệp bài) nên không đo được tầng
  này cho bài. Mẫu số = 1 là rất nhỏ: đây là số đo được, không phải số 0 — nhưng kết luận
  `tha-ap` không có bản Anh đã ghim thì đúng và đã là blocker.

