notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ja358.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các thuật ngữ cổ và đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 29 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Lô H3 2026-10-15: kiểm 4.1-5.4, Claude Sonnet 5.5 (Claude Code); không sửa. `ye na vadanti rājānaṁ`
  (cũng ở ja544:138.3, 139.3) nghĩa đen là "những kẻ không nói với nhà vua", đi sau `na hi nūnimassa
  rañño ... vijjare`; bản Việt bỏ `na` và thêm "có thể". Không có bản Anh ở commit đã ghim, và hai phủ
  định liền nhau không phân xử được từ chữ ghim: đọc nguyên văn thì mâu thuẫn với ý lời than (nhà vua
  không có ai can ngăn), nên giữ nguyên bản hiện có và coi là bất định, đề nghị người biên tập xem.

  Quyết định hội đồng biên tập 2026-10-16: C1 — 0.3 (tên phẩm thống nhất với các bài cùng phẩm: cùng tên Pāli thì cùng tên Việt); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
