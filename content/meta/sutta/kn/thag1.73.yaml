notes: |-
  Khung bốn khối tiêu đề giữ y hệt các bài thag1 đã có: 0.1 giữ Pāli kèm số,
  0.2 Bộ Một Bài Kinh (258 bài), 0.3 tên phẩm theo thứ tự, 0.4 Kinh Kệ Của Trưởng Lão
  với chữ Lão hoa (89 bài; bốn bài lẻ dùng lão thường). Dòng kết 1.5 giữ HAI dấu lược
  như Pāli (BRIEF_VI3 §10.1, không mở rộng), mở nháy kép ở 1.1 và đóng ở 1.4 y hệt Pāli.
  1.1 và 1.2: Pāli gộp ba tính ngạo vào 1.1, jiṇña, dukhita, byādhita, rồi mới sang mata ở
  1.2. Bản nháp tôi đẩy byādhita sang 1.2 cho câu đỡ nặng; tự soát từng cặp thì thấy sai,
  và đã sửa để cả ba tính ngạo nằm ở 1.1 đúng như Pāli. Đây là lỗi tôi tự bắt được, không
  phải lỗi máy bắt, vì máy chỉ đếm khoá chứ không đọc trật tự nội dung trong khoá.
  byādhita tôi dịch bệnh tật, dukhita tôi dịch khổ não theo dhp15:3, jiṇña tôi dịch già
  yếu. gatamāyusaṅkhaya tôi dịch đã tới hạn tuổi thọ; māyusaṅkhaya là hạn của tuổi thọ.
  Sujato dịch come to the end of life, tức tới hạn sống, nên tôi thêm chữ tuổi cho rõ.
  nikkhamitūna pabbaji: pabbajita có tiền lệ an10.45:2.4 vị đã xuất gia, nên tôi dịch làm
  kẻ xuất gia. nikkhamitūna không có tiền lệ, tôi dịch bước ra. kāmāni manoramānī dịch
  các thụ dục dễ chịu; Sujato dịch the pleasures of the senses, tức dục thú của các căn. Tôi
  KHÔNG thêm của các căn vì Pāli không có āyatana ở vế này. Đó là chỗ tôi cố ý lệch bản
  Anh, và là lý do semantic_fidelity 9.3 chứ không cao hơn.

  Kỹ thuật: 9/9 khoá, không rỗng, thứ tự khớp Pāli, NFC, số dấu lược bằng Pāli từng
  khoá, nháy kép cân trên cả bài, không còn (…). save_vi sạch, chạy lại hai lần
  idempotent. Vì mọi khoá Pāli của Trưởng Lão ngắn hơn 40 ký tự nên cần trong kiểm()
  rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá bằng script riêng. Không
  chạy npm run validate|test|check|build (lát này cấm) nên technical_integrity 9.5.
  Tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên không có bản Hòa thượng
  Thích Minh Châu cho Trưởng Lão; bản Anh Sujato có mặt và tôi đã đọc ở tất cả tám bài
  này. Ô English trống ở dòng kết không phải sự đồng thuận, mà là chỗ Pāli phải tự đứng
  vững.
