notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên. Không tìm thấy lỗi nghĩa.
  
  **Cấu trúc văn bản.** Kệ nói: thấy người già, thấy người bệnh, thấy xác — **nhìn thấy ba thứ** — rồi từ đó xuất gia. Bản dịch giữ cả ba vế và cả mối nhân quả (*Từ đó*): `1.1` → *Thấy người già yếu, thấy kẻ khổ não, bệnh tật*, `1.2` → *thấy kẻ chết đi, đã tới hạn tuổi thọ*, `1.3` → *Từ đó tôi bước ra*. ✓
  
  **`Jiṇṇañca disvā dukhitañca byādhitaṁ` → *Thấy người già yếu, thấy kẻ khổ não, bệnh tật*.** `byādhita` (bệnh tật) giữ nguyên, không bị lẫn với `dukhita` (khổ não). ✓
  
  **`gatamāyusaṅkhayaṁ` → *đã tới hạn tuổi thọ*.** `māyusaṅkhaya` = "tiêu hao mệnh", tức đã tới hạn sống; cách dịch này đúng và tự nhiên.
  
  **`nikkhamitūna pabbajiṁ` → *bước ra, làm kẻ xuất gia*.** `pabbajī` (đã xuất gia, đã từ bỏ gia cảnh) là chủng điệu, đưa vào mệnh đề *làm kẻ xuất gia* là đúng vai trò. Sujato dịch *I went forth, becoming a wanderer* — cũng vậy.
  
  **`manoramānī` → *dễ chịu*.** `manorama` = "thích ngắm / dễ chịu / làm thích thú". `manoramānī` là tạp sở nữ của `kāmāni` (thụ dục) → *các thụ dục dễ chịu*. Dịch gọn là *dễ chịu* nhưng vẫn trong sắc thái của Pāli; không có thêm ý.
  
  **Ngôi một ở `1.3` là `tôi`** (`ahaṁ`), khớp tiền lệ `thag6.2:6.3` và `thag1.103:1.1`. Xem ghi chú `thag1.21` về việc lô này dùng lẫn *Ta* và *tôi* cho cùng ngôi một — ở đây *tôi* theo đa số tầng.
  
  **Tên riêng:** `Māṇava` giữ dấu ở `0.4`; `1.5` dùng dạng Pāli *Māṇavo* ✓ đúng biến cách (danh từ + hậu tố trạng thư). Đây là chi tiết đúng mà ít bản dịch để ý.
  
  **Tầng Anh** có mặt đủ bốn vế và xác nhận ba tầng thấy.
