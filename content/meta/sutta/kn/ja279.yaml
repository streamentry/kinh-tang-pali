    `kakaṇṭako` ở `ja170` là **gai** (gai đâm vào móng), **không phải *con
    rắn*** — `ahi` mới là rắn. `vinīla` ở `ja160` là **chim xanh**, **không phải
    *thiên nga*** vì `haṁsa` mới là thiên nga và hai từ đứng cạnh nhau trong
    `1.4`. `muttā` ở `ja256` là **ngọc trai**, `veḷuriya` là **đá quý**, và ba
    dạng kim loại `ayasa`/`loha`/`tipusī` là **thiếc / sắt / đồng vàng**, không
    gộp làm *đồng*. `mora` ở uddāna `ja160` là **con côc** (Sujato dịch
