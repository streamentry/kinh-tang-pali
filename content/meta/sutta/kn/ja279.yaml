  - >-
    **48 cặp khoá có Pāli trùng ở bài khác — đã đếm bằng script, và đã dùng lại
    nguyên văn.** Quét toàn tầng Pāli gốc (5.764 file, bỏ thư mục
    `*.apfs-orphan`) so **chính nguyên văn** của từng khoá của lát này: **45 cặp
    trùng byte-for-byte**, thêm **3 cặp** trùng sau khi chuẩn hoá dấu câu và
    nháy kép = **48 cặp**. Trong đó **35 cặp** đã có bản Việt ở bài khác và tôi
    **dùng lại nguyên văn** (28 cặp khớp từng chữ; 7 cặp còn lại được nêu riêng
    dưới đây), **13 cặp** chưa bài nào trong kho có bản Việt thì tôi đặt mới.
    Không có cặp nào tôi dịch khác mà không ghi lý do.
  - >-
    **Nhịp và hình thức — không lặp khuôn.** Bốn bài Tăng Bộ là `peyyāla` thuần:
    mỗi mục phải phát lại đúng công thức của Pāli, nên sự lặp ở đây là **bắt
    buộc của nguồn**, không phải lỗi khuôn. Mười bài Jātaka thì mỗi bài một bài
    kệ riêng, nhịp khác nhau; tôi không dùng chung một công thức dịch cho cả
    mười bài.
  - >-
    **Từ đa nghĩa: đã giữ đúng nghĩa theo ngữ cảnh từng câu, và nhắc lại vì đây
    đúng là loại nhầm đã có tiền lệ ở lát khác.** `nāgo` ở `ja190` là **gọi lớn
    lên** (lời cầu xin), **không phải *rồng*** và cũng không phải *con voi* — đó
    là hai nghĩa của `nāga` đang có trong tầng. `rājāna` ở `ja160`/`ja170` là
    **các vị hoàng tử** (số nhiều của `rājan`), **không phải *các vua***.
    `kakaṇṭako` ở `ja170` là **gai** (gai đâm vào móng), **không phải *con
    rắn*** — `ahi` mới là rắn. `vinīla` ở `ja160` là **chim xanh**, **không phải
    *thiên nga*** vì `haṁsa` mới là thiên nga và hai từ đứng cạnh nhau trong
    `1.4`. `muttā` ở `ja256` là **ngọc trai**, `veḷuriya` là **đá quý**, và ba
    dạng kim loại `ayasa`/`loha`/`tipusī` là **thiếc / sắt / đồng vàng**, không
    gộp làm *đồng*. `mora` ở uddāna `ja160` là **con côc** (Sujato dịch
    *peacock*), **không phải *con gấu***.
  - >-
    **Hai khoá trùng byte-for-byte với `iti75` — dùng lại nguyên văn.** `2.1` →
    *Cũng vậy, ở đây một hạng người,* (`iti75:10.1`) · `2.2` → *là hạng người
    như thế;* (`iti75:10.2`). Đây là công thức mở đầu `iti` quen thuộc, dùng lại
    đúng chữ.
  - >-
    **Một ngoặc kép duy nhất mở ở `1.1` và đóng ở `3.4`, giữa chừng Pāli không
    có `”`.** Pāli cho `1.6`, `2.2`, `2.4`, `3.2` kết `.` hoặc `;` nhưng không
    đóng ngoặc; tôi giữ nguyên số ngoặc từng khoá thay vì đóng cho cân, vì đóng
    thêm sẽ là thêm dấu không có trong nguồn.
  - >-
    **`atthakāma` / `anatthakāma` là cặp nghĩa suy ra từ ngữ cảnh, không phải
    *điều thiện* theo nghĩa luận lý.** Câu kệ nói người đi đường **nhìn chiếc lá
    bảy** rồi đoán người, và bài kinh là đại ý *đừng đoán bề ngoài*. Tôi dịch
    *điều lành / điều không lành* vì đó là cặp đối xứng của `attha` mà chính
    Pāli dùng; `satapatta` → **chiếc lá bảy** (`sapatti` = lá, bảy lá) ·
    `siṅgāliṁ vanagocariṁ` → **con sói rừng** (không phải *sói rừng hoang*;
    `vanagocari` = đi lang thang trong rừng) · `ukkaṁsayanti` → **chê bai**
    (không phải *phỉ báng*).
  - >-
    **Tên phẩm theo đa số (phần mới).** `Tikanipāta` → **Bộ Ba Bài Kinh** (0
    tiền lệ). `Udapānavagga` → **Phẩm Nước Uống** (0 tiền lệ; `udapāna` = nơi
    lấy nước, chứ không phải *Phẩm Udapāna* có dấu Pāli). `Satapattajātaka` →
    **Kinh Bảy Lá**; `4.1` `navamaṁ` → **thứ chín**.
  - >-
