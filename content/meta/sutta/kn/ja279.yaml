  - >-
    Đợt này bị cấm chạy `npm run validate|test|check|build` theo lệnh lát, nên
    `technical_integrity` đặt **9.6** chứ không phải 10.0: tệp JSON hợp lệ, đủ
    khoá, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài,
    không Pāli lọt — tất cả đã quét bằng script riêng trên **mọi** khoá, không
    chỉ khoá ≥ 40 ký tự — nhưng cổng kỹ thuật của repo thì chưa chạy, nên không
    thể tuyên bố là đã pass.
  - >-
    **Sửa lan 2026-10-13 (accuracy fix), thay cho các mục `atthakāma` /
    `satapatta` / tên bài ở trên.** Khoá đổi, trước → sau: `0.4` «9. Kinh Bảy
    Lá» → «9. Kinh Chim Gõ Kiến»; `4.1` «Kinh Bảy Lá, thứ chín.» → «Kinh Chim Gõ
    Kiến, thứ chín.» (`translationTitle` khớp); `1.1` «Như người đi trên đường,»
    → «Như chàng thanh niên trên đường,» (māṇavaka); `1.2` «gặp phải con sói
    rừng;» → «con chó rừng cái lang thang trong rừng,» (siṅgālī: chó rừng cái —
    các khoá Pāli có siṅgāl- đã dịch «chó rừng» ở 59 khoá, «sói» ở 8); `1.3` «kẻ
    nói lời điều lành,» → «mong lợi ích mà báo cho biết,»; `1.4` «lại bị coi là
    điều không lành;» → «lại nghĩ là kẻ mong điều bất lợi;»; `1.5` «còn chiếc lá
    bảy của điều không lành,» → «còn chim gõ kiến, kẻ mong điều bất lợi,»; `1.6`
    → «lại nghĩ là kẻ mong lợi ích.»; `2.3` «lời lẽ điều lành,» → «Khi được nói
    lời có lợi,»; `2.4` «kẻ nào lại nắm lấy điều bất lành.» → «lại tiếp nhận
    theo chiều ngược lại.» (paṭigaṇhāti vāmato); `3.1` «Còn kẻ nào khen ngợi
    nó,» → «Còn những ai khen ngợi người ấy,»; `3.2` «hoặc vì sợ hãi mà chê
    bai;» → «hoặc vì sợ hãi mà tán dương;»; `3.3` → «thì người ấy coi họ là
    bạn,»; `3.4` «chỉ vì chiếc lá bản”vậy.» → «như chàng thanh niên với chim gõ
    kiến.”». Căn cứ: satapatta là một loài chim (chim gõ kiến), không phải
    «chiếc lá bảy» — câu kệ đối xứng «chó rừng cái nói điều lợi mà bị cho là
    hại; chim gõ kiến nói điều hại mà bị cho là lợi»; ukkaṁseti là tâng bốc, tán
    dương (đối chiếu an4.28:1.4 «tự tâng bốc», an3.72:6.2 «tán dương»), không
    phải «chê bai» — vế 3.2 nói người ta khen ngợi hoặc tán dương vì sợ, nên
    người ấy coi là bạn; cách «chê bai» làm 3.3 mất lô-gích. atthakāma /
    anatthakāma dịch theo tiền lệ «mong lợi ích» / «muốn điều bất lợi»
    (dn22:18.28, dn22:18.31, cnd1:11.2). Đối chiếu thêm bản Anh của Jātaka này
    trên ancient-buddhist-texts.net (nguồn tham khảo ngoài, không phải tầng đã
    ghim). Chưa chắc: hitehi ở 2.3 — tôi đọc «lời có lợi» (hita = lợi ích),
    không thêm «bạn bè / người thương» vào thân kinh; nếu đọc là công cụ cách số
    nhiều («do những người thiện chí») thì nghĩa đoạn không đổi.
  - >-
