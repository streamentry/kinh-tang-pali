notes: |-
  Đủ 9/9 khóa. siṅgāla → chó rừng theo tiền lệ dn24 (con chó rừng già,
  rú theo lối chó rừng). durājāna → khó hiểu; matasāyika → nằm như kẻ đã
  chết; mệnh đề tuyệt đối yassa te kaḍḍhamānassa đọc là trong khi ngươi bị
  kéo lê đi, với hatthā daṇḍo na muccati là cây gậy không rời khỏi tay.
  Chủ thể xưng ngươi nhất quán cả bốn vế, phủ định đúng Pāli.
  Sujato trống cả 9 khóa, không có tầng Việt hiện hành cho Jātaka trong
  snapshot đã ghim → chỉ Pāli đơn tuyến, giữ draft.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
