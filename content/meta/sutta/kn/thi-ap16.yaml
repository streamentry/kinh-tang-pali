notes: |-

  Bản dịch tiếng Việt mới cho bài kinh thi-ap16 — trưởng lão nữ Naḷamālikā, bài thứ sáu
  trong Ekūposathikavagga. Đây là CÙNG một vị trưởng lão nữ với `thi-ap5` (bài thứ năm),
  nên tiền lệ rất dày và nhiều khoá trùng nguyên văn.

  Tiền kiếp: bên bờ sông Candabhāgā, lúc ấy tôi là một nàng tiên nữ kinnara. Tôi đã trông
  thấy Đức Phật ly trần, bậc Tự Tại không ai đánh bại. Với tâm thanh tịnh hoan hỷ, chắp tay
  cúng một chùm hoa sen lên Đấng Tự Tại. Nhờ nghiệp lành khéo làm ấy cùng với tâm nguyện và
  chí hướng, sau khi từ bỏ thân người tôi đã đến cõi trời Ba mươi ba. Ở đó tôi tôn vinh sáu
  mươi vị trời và các vua chúa cùng mười vị Chuyển Luân Vương; những điều tâm tôi mong muốn
  đều trở thành đúng như ý. Chán ngấy rồi, tôi vẫn luân hồi trong các cõi. Ta có thiện đức
  ấy, rồi xuất gia sống đời không nhà; tôi hôm nay là bậc cho cúng dường trong giáo pháp
  của Đức Phật. Tâm tôi nay đã thanh tịnh, không còn chán ghét, không ác ý; tất cả các lậu
  hoặc đã cạn kiệt, nay không còn tái sanh nữa. Vào chín mươi tư kiếp trước đây, khi tôi cúng
  dường lên Đức Phật, tôi không biết mình rơi vào khổ đau — đó là quả báo của việc dâng cúng
  hoa sen. Các phiền não của tôi đã bị thiêu rụi, tôi sống không còn lậu hoặc. Thật lành
  thay sự đến của tôi, bốn vô ngại giải đã làm tròn lời dạy của Đức Phật.

  PÁI BẢN DÙNG LẠI NGUYÊN VĂN:
  - 1.1–2.4 trùng nguyên văn `thi-ap5:1.1–2.4` (cùng người, cùng dòng sông, cùng cảnh
    dâng hoa sen) — dùng lại y nguyên bản đã có.
  - 3.1–3.2 trùng `thi-ap5:3.1–3.2`; 3.3 trùng `tha-ap497:3.3` (5 tiền lệ); 3.4 đa số 6/6.
  - 4.1 trùng `thi-ap5:4.1`; 4.2 và 5.2 trùng `thi-ap5:4.2`/`:4.4` — Pāli lặp đúng hai
    lần (`mahesittamakārayiṁ`) nên bản Việt lặp y nguyên, không diễn giải khác đi.
  - 5.1 trùng `thi-ap5:4.3`; 6.1 trùng `tha-ap518:6.1`; 6.2 trùng `thi-ap5:4.6`;
    6.4 trùng `tha-ap518:6.4`; 7.3–7.4 trùng `thi-ap5:5.3–5.4`; 8.1 trùng `thi-ap5:6.1`.
  - 9.1, 9.3, 10.1, 10.3, 11.1, 11.3 và 8.3 dùng ĐÚNG những bản đã chọn cho `tha-ap501`
    trong cùng lát, vì đây là cùng một công thức Pāli. Mẫu thi-ap trong tầng Việt chỉ có
    6 tệp (thi-ap2, 3, 4, 5, 12, 13) và chúngngãy loang thoáng giữa `tôi`, `ta`, `con`;
    đo cục bộ thi-ap không đủ dữ liệu để chọn, nên lấy đa số của cả lớp `tha-ap`+`thi-ap`
    để một Pāli chỉ có một cách dịch. Nêu rõ ở đây vì đây là điểm đã đo lại, không phải mặc
    định.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - `4.3`–`4.4`, `5.3`–`5.4`, `6.3`, `7.1`–`7.2`, `8.4` không có tiền lệ Pāli trùng nguyên
    văn trong tầng Việt. `Manasā patthitaṁ mayhaṁ` + `nibbattati yathicchitaṁ` là một câu:
    điều tâm tôi mong muốn thì trở thành đúng như ý — dịch hai khoá theo hai vế, không
    thêm nhân quả nào ngoài Pāli. `apetamanapāpikā` là hai vế `apetamana` (không chán ghét)
    và `anapāpikā` (không ác ý), nên dịch đủ hai, không gộp thành một.
  - `4.1` `Chattiṁsadevarājūnaṁ` — SỬA CẢ HAI BÊN. Tiền lệ `thi-ap5:4.1` dịch là
    `sáu mươi vị trời và các vua chúa,`; đó là SAI: `Chattiṁsa` là ba mươi ba, không
    phải sáu mươi. Đo lại trong Pāli đã ghim, `devarājū` là danh từ đếm được và luôn
    đi kèm chư thiên — `Sattatidevarājūnaṁ` (thi-ap8:11.1), `Catusaṭṭhi devarājūnaṁ`
    (thi-ap11:8.1), `Asīti devarājūnaṁ` (thi-ap9:13.1, thi-ap15:13.1),
    `Tiṁsānaṁ devarājūnaṁ` (thi-ap6:8.1), `Paññāsaṁ devarājūnaṁ` (thi-ap10:5.1);
    còn `sn11.23:2.2` `devarāja sujampati` là cách gọi chính Thần Indra. Nghĩa của cụm
    vì thế là MỘT nhóm `chư thiên Ba Mươi Ba`, không phải hai nhóm và không phải sáu
    mươi. Theo luật `trùng thì khớp, trừ khi bản tham chiếu sai thì sửa cả hai`: đã sửa
    ở `thi-ap16:4.1` và ở `thi-ap7:3.3` (cùng Pāli, cùng một cách sửa).
    CẦN NGƯỜI BIÊN TẬP XỬ LÝ RIÊNG: `thi-ap5:4.1` và `thi-ap5:4.3` vẫn còn cách dịch
    cũ — tệp ngoài lát của tôi nên không sửa; sửa thì phải sửa cả hai bài cùng lúc.
  - `12.1`: Pāli ở đây là `bhikkhunī`, còn `thi-ap5:10.1` là `therī` — hai Pāli khác nhau
    nên không dùng chung một cách dịch. Theo đúng tiền lệ của công thức `bhikkhunī`
    (5/5 tệp) thì `Tỳ-kheo-ni Naḷamāliká`; giữ `Naḷamālikā` đúng chính tả.
  - Dấu lược: `9.2`, `10.2`, `11.2` là `…pe…` ở Pāli, giữ đúng MỘT `…` mỗi khoá.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và
  `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên
  `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của
  chính tầng Việt qua `_hvi.save_vi`: đủ 46/46 khoá, cân ngoặc kép trên cả bài, đúng số dấu
  lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung
  bình số học thô của đúng 10 tiêu chí, do `_meta71.ghi` tính.
