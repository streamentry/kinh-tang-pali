notes: |-
  **Phạm vi: đủ 413/413 khoá của cnd7, không khoá nào ngoài tập khoá Pāli, cùng thứ tự.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Puṇṇaka (Pārāyana, câu hỏi thứ ba), tức bài kệ `snp5.4`. Cấu trúc như `cnd9`, `cnd11`, `cnd16`–`cnd18`: dẫn từng đoạn kệ rồi giải từng cụm bằng chuỗi từ đồng nghĩa. Ngoài công thức chung còn bốn khối riêng của bài: (i) giải *mūladassāvī* qua ba gốc bất thiện, ba gốc thiện và các đoạn trích kinh về nguồn gốc của nghiệp (`3`–`9`); (ii) giải *devatā* và danh sách lễ vật, người cúng tế, bậc đáng được cúng dường (`13`–`16`); (iii) mười hai bộ ba loại câu hỏi (`17`–`23`); (iv) giải *vidhūmo* qua khói, giận dữ, định nghĩa giận dữ và thang mười ba mức (`60`–`64`). Pāli của bài: 25 khoá chứa nháy kép, 0 nháy đơn, 12 khoá có ngoặc đơn (đều là lời dẫn người nói trong kệ, khớp từng khoá), 41 khoá chứa `…pe…` (40 khoá thành đúng một `…`; `35.2` kết `…pe….` nên Việt kết ` ….`), 2 khoá có `…` trần (`60.2`: 4 dấu trần cộng 1 `…pe…`; `60.4`: 16 dấu, đều giữ đủ), 0 khoá có `(…)` trần.

  **Cách trình bày lemma** theo `cnd9`, `cnd11`, `cnd16`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Khoá `10.1` của Pāli gộp cả lemma `Iccāyasmā puṇṇako` lẫn `iccā ti padasandhi …pe…` nên Việt cũng ở một khoá (*Tôn giả Puṇṇaka nói. Iccā: …*), `Iccā` giữ nguyên Pāli vì lời giải nói về chính hình thức của từ. Dòng kệ `(puṇṇakāti bhagavā)` dịch *(Này Puṇṇaka, Đức Thế Tôn nói,)* theo cách của chín bài cnd khác cùng bộ (`cnd6:10.2`, `cnd10:10.2`, `cnd11:27.2`, `cnd13:7.2`, `cnd14:14.2`, `cnd16:16.2`, `cnd17:18.2`, `cnd18:20.2`, `cnd20:9.2`); `snp5.4` có *(Đức Thế Tôn trả lời:)*. Khi `puṇṇakāti bhagavā` nằm giữa câu (`27.6`, `45.5`) dịch *… này Puṇṇaka, Đức Thế Tôn nói* không đặt ngoặc, vì Pāli ở đó không có ngoặc.

  **Tầng tham khảo — đo, không đoán.** Sujato không có `cnd7`: thư mục `kn` của tầng Anh đã ghim chỉ có cp 35, dhp 26, iti 112, ja 83, kp 9, snp 73, thag 264, thig 73, ud 80 tệp; tệp `cnd7_translation-en-sujato.json` không tồn tại, chỉ có `cnd-name` (nhãn tác phẩm, không phải văn bản kinh). Tầng Pāli đã ghim có 23 tệp cnd, tầng Anh 0 tệp cnd, `vietnamese-current` 0 tệp cnd. Lớp `english-project` không có `cnd7`. Bản Việt nguyên bài (tra cứu toàn văn) cũng không có thư mục `cnd`. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự sau khi gộp khoảng trắng, tính cả thẻ in đậm như phép đo của kho, bỏ khối `:0` gồm 4 khoá) là **203** khoá (còn 189 khi bỏ thẻ in đậm; kết luận không đổi); Sujato phủ 0/203 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/203, `vietnamese-current` 0/203. Có hai chứng cứ độc lập trong chính corpus, nhưng đều là bản của **bài khác** nên không tính là đối chiếu English của cnd7: (a) 52 khoá (kệ và dòng người nói) trùng nguyên văn Pāli với khoá của các bài kệ `snp`, chủ yếu `snp5.4`, mà Sujato có dịch; (b) công thức chú giải đã dịch ở `cnd6`, `cnd9`–`cnd18`, `cnd20`. Đã đọc Sujato `snp5.4` để hiểu cú pháp các câu kệ; không dùng làm tầng tham khảo của cnd7. Không có English độc lập cho các đoạn giải riêng của bài (ba gốc bất thiện, `devatā`, các bộ ba câu hỏi, định nghĩa giận dữ).

  **Dùng lại tiền lệ.** Đã dò toàn tầng bản Việt bằng chỉ mục Pāli (bỏ thẻ in đậm, gộp khoảng trắng): **108** khoá của cnd7 có Pāli trùng nguyên văn với khoá đã dịch ở bài khác (656 cặp khoá-khoá); dùng lại nguyên văn ở **73** khoá, khác ở **35** khoá (101 cặp lệch, phần lớn vì một khoá Pāli có nhiều bản Việt khác nhau ở các bài khác). 305 khoá không có tiền lệ nguyên văn; phần lớn là lời giải mới, dựng theo công thức gần nhất đã dịch (chuỗi `ye kecī` ở `cnd11:18.2`, `Iccā …` ở `cnd11:2.8`, `Bhagavā … sacchikā paññatti` ở `cnd15:8.2`/`cnd11:22.5`, `Mārisā` ở `cnd11:42.2`, bộ `Pucchāmi taṁ … brūhi metaṁ` ở `cnd9:2.6`–`2.10`, `Atthi pañhena āgamaṁ` ở `cnd17:14.1`–`14.3`, `Anejo`/`ejā` ở `cnd16:3.5`–`3.9`, chuỗi `santattā … paṭippassaddhattā` ở `cnd12:23.5`, `cnd14:29.4`, `cnd15:27.2`, `Nātariṁsu jātijaranti brūmi` ở `cnd11:33.1`). 35 khoá khác gồm: (i) 14 khoá kệ `1.5`, `1.6`, `25.5`, `25.6`, `26.3`–`26.5`, `33.3`–`33.5`, `34.3`, `34.4`, `39.3`, `39.4`: `snp5.4` dịch dồn `devatānaṁ` và `puṇṇaka` sang dòng kế (`snp5.4:2.3`–`2.5`) còn lời giải `13.1`, `14.1`, `28.7`, `30.1` giải từng từ riêng, nên bản ở đây dịch đúng từng dòng của khoá (`các Sát-đế-lợi và Bà-la-môn, cho chư thiên,` / `đã dâng lễ tế, thật nhiều ở đời,`) để cặp Pāli trùng trong bài (7 khoá `Khattiyā brāhmaṇā devatānaṁ`) không lệch và để khớp lemma `29.1`; (ii) 6 khoá `(puṇṇakāti bhagavā)` như đã nêu; (iii) `57.4`, `67.4` `anīgho` → *không khổ não* thay *không khổ* của `snp5.4:6.4` (xem thuật ngữ); (iv) chỉ khác dấu cuối khoá: `1.3`, `25.3` (`;` ở `cnd17:1.5`, `.` ở `snp5.4:1.3`), `3.1`, `4.10` (Pāli kết `—`); (v) `4.3` (*Thế nào là ba?* 48 lượt so với *Ba loại nào?* 2 lượt), `4.4` thêm *các* (*của các nghiệp*) để khớp `4.2` trong cùng bài và `an3.34:1.3`, `4.5` viết *chư thiên* thay *chư Thiên* của `an6.39:1.10`; (vi) `32.13`, `48.5`, `66.8` (*Vì thế* 62 lượt so với *Vì vậy* 1 lượt, dùng đa số); (vii) `57.3`, `67.3` và `67.5` theo `snp5.4:6.3`, `6.5` còn `an3.32:6.2`, `an4.41:6.2`, `snp5.5:12.4` dịch khác.

  **Trong chính bài:** 58 nhóm Pāli trùng nguyên văn (259 cặp, tính không phân biệt hoa thường và dấu cuối khoá); bản Việt giống nhau (chỉ khác chữ hoa đầu khoá và dấu cuối) ở 56 nhóm, **khác ở 2 nhóm**: (1) `40.4` = `49.4` (*Bị mê đắm trong sự tế lễ, say đắm trong hữu,*, dùng lại `snp5.4:4.4` vốn bỏ *họ* vì dòng kế `40.5` đã có *họ không vượt qua*) so với `47.7` (*họ bị mê đắm …*, lời giải nhắc lại chủ ngữ `te`); (2) `50.1` = `56.1` (*Nếu những người chuyên tế lễ ấy*, dùng lại `snp5.4:5.1` vì `50.3` mang *không vượt qua*) so với `51.3` (*… ấy không vượt qua.*, lời giải nhắc lại cả `nātariṁsu`). Sau khi đọc cặp Pāli↔Việt và dò lại tiền lệ đã sửa: `30.1` bỏ sót `Āsīsamānā`; `13.4` lặp *chư thiên là chư thiên* nên đổi `deva` thành *thiên thần*; `11.6` chuyển sang dạng bổ ngữ của `alamatto`; `59.2`, `59.5`, `59.6` đổi theo `cnd13:10.3`, `mnd4:62.4`, `cnd9:32.3`; `30.2`, `41.2`, `45.1`, `46.1` đổi *thanh, hương, xúc* thành *âm thanh, mùi, xúc chạm* theo `cnd13:10.2`; và các khoá kệ lệch ranh giới như mô tả ở trên.

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `nidāna` → *nguồn gốc*, `samudaya` → *tập khởi*: 1.047 khoá Pāli chứa `nidān-` đã dịch, *nguồn gốc* 206 khoá, *nhân duyên* 45, *duyên nguồn* 42 (`an3.34`); câu trích `4.2` trùng `an6.39:1.1` (*nguồn gốc … tập khởi*). Chuỗi mười từ `mūla`–`samudaya` (`2.7`, `9.4`) không có tiền lệ cho cả chuỗi: *gốc, nhân, nguồn gốc, nguồn sinh, chỗ phát sinh, nơi khởi lên, thức ăn, đối tượng, duyên, tập khởi*; riêng `pabhava` *chỗ phát sinh* theo `dn21:2.2.5`, `āhāra` *thức ăn* (341/735 khoá chứa `āhār-`), `ārammaṇa` *đối tượng* (108/192).
  - `avijjāmūlakā avijjāsamosaraṇā avijjāsamugghātā` → *lấy vô minh làm gốc, quy về vô minh, đưa đến chỗ tận diệt của vô minh*, `appamādamūlakā appamādasamosaraṇā` → *lấy không phóng dật làm gốc và quy về không phóng dật*: theo `sn20.1:1.5`, `sn46.31:1.1`; `akusalabhāgiyā akusalapakkhikā` theo `an1.56:1.1`.
  - `attabhāva` → *tự thân* (`cnd9:59.4`; tầng: *tự thân* 8 khoá, *thân hiện có* 5 khoá ở `dn33`, *cá thể* 28 khoá, trong 112 khoá chứa `attabhāv-`); `attabhāvapaṭilābha` → *sự đạt được tự thân*, `paṭilābha` → *sự đạt được* (108/348 khoá), `attabhāvābhinibbatti` → *sự phát sinh của tự thân*.
  - `vimati` → *hoài nghi* (tầng: *hoài nghi* 32 khoá, *phân vân* 32 khoá trong 50 khoá chứa `vimati`): theo bộ bốn `saṁsayapucchā vimatipucchā dveḷhakapucchā anekaṁsapucchā` ở `cnd10:23.2`, `cnd11:3.4`, `cnd11:22.2` (*nghi ngờ, hoài nghi, phân vân, không dứt khoát*); khác `cnd9:2.3` (*cắt đứt sự phân vân*), nên `17.3`, `19.1`, `19.5` dịch *cắt đứt hoài nghi* để một từ Pāli luôn là một từ Việt trong bài (`19.2`, `36.2`).
  - `lakkhaṇa` → *đặc tính* (15 khoá, *đặc tướng* 5 khoá; `mil1:9.1` *câu hỏi về đặc tính*); `vibhūta` → *sáng tỏ*, `vibhāvita`/`vibhāvana` → *rõ ràng*, theo `cnd6:5.1` (`vibhāvayitvā` *làm cho rõ ràng*, `vibhūtaṁ katvā` *làm cho sáng tỏ*); `pakatiyā` → *vốn dĩ*; `tulana`/`tīraṇa` → *cân nhắc*/*thẩm xét* theo `cnd6:5.1`.
  - `dakkhiṇeyya` → *bậc đáng được cúng dường* (82 khoá *đáng được cúng dường*, 40 *đáng cúng dường*, 29 *đáng được hiến*, trong 134 khoá); `deyyadhamma` → *vật bố thí* (`sn55.39:3.6`); `yañña` → *lễ tế*, `yājaka` → *người cúng tế*; danh sách lễ vật theo `an8.86`, `dn33:3.1.98`, `mn129:48.3` (*y áo, đồ ăn khất thực, chỗ ở, thuốc men và vật dụng cho người bệnh, thức ăn, thức uống, y phục, xe cộ, hoa hương bột xức, chỗ nằm, chỗ trú và đèn sáng*).
  - `āsīsanti thomayanti abhijappanti juhanti` → *cầu nguyện, tán thán, khẩn vái, tế lễ* (`snp5.4:4.1`), `āsīsamānā` → *cầu mong*; lời giải `thomenti kittenti vaṇṇenti pasaṁsanti` → *tán thán, xưng tụng, ca ngợi, khen ngợi* (chuỗi bốn từ: 0 tiền lệ). `rūpa/sadda/gandha/rasa/phoṭṭhabba` → *sắc, âm thanh, mùi, vị, xúc chạm* theo `cnd13:10.2` (*xúc chạm* 161 khoá trong 411 khoá chứa `phoṭṭhabb-`); `Cātumahārājika … Brahmakāyika` → *chư thiên Tứ Đại Thiên Vương … chư thiên Phạm Chúng* theo `an6.10:7.2`, `an11.11:8.2`.
  - `nissita` hai cách: *nương tựa* ở câu hỏi `kiṁ nissitā` (`snp5.4:1.4`), *gắn bó với* ở `jaraṁ sitā` (`snp5.4:2.6`) và ở chuỗi `jātinissitā … vaṭṭanissitā` (`32.1`–`32.11`); `gati`/`upapatti`/`paṭisandhi`/`bhava`/`saṁsāra`/`vaṭṭa` → *cảnh giới, tái sinh, kết sinh, hữu, luân hồi, vòng luân chuyển* theo `cnd16:20.1`; `allīnā upagatā ajjhositā adhimuttā` → *đã bám vào, đã đến với, đã chấp chặt, đã nghiêng hẳn về* theo `cnd14:2.3`.
  - `anīgha`/`nīgha` → *không khổ não*/*khổ não* theo `cnd11:14.2`–`14.3` (cùng lý do: tránh trùng *phiền não* của `kilesa`); dòng kệ trùng Pāli ở tầng là *không khổ* (`snp5.4:6.4`, `pv36:34.1`) và *không đau khổ* (`an3.32:6.3`, `an4.41:6.3`), nên `57.4`, `67.4` lệch một chữ. `kodha` → *giận dữ* (`cnd11:10.2`) kể cả kệ `61.2` (dù `sn7.9:14.2` dịch *sân hận*), còn `māna` ở kệ `61.1` giữ *kiêu mạn* của `sn7.9:14.1` trong khi danh sách `60.4` theo `cnd11:10.2` là *ngã mạn*; hai cách này là lệch có chủ ý theo tiền lệ từng nơi.
  - Chuỗi phiền não `60.4`: `makkho` *gièm pha*, `paḷāso` *hơn thua*, `thambho` *bướng bỉnh*, `sārambho` *hung hăng*, `māno` *ngã mạn*, `atimāno` *ngạo mạn*, `mado` *tự mãn*, `pamādo` *phóng dật* theo `cnd11:10.2`; chuỗi `santattā …` (`60.2`) → *yên lặng, an hòa, lắng dịu, tiêu mòn, tịch tĩnh, biến mất, dịu xuống* theo `cnd12:23.5`.
  - `Ājīvaka`, `Nigaṇṭha`, `Supaṇṇa`, `Aviruddhaka`, `Vāsudeva`, `Baladeva`, `Puṇṇabhadda`, `Maṇibhadda` giữ Pāli (0 tiền lệ cho ba tên cuối); `jaṭila` *đạo sĩ tóc bện*, `tāpasa` *đạo sĩ khổ hạnh*, `paribbājaka` *du sĩ* theo `cnd11:2.4`, `cnd11:18.4`; `nāga`, `asura`, `gandhabba` → *Nāga, A-tu-la, Càn-thát-bà* theo `dn21:2.1.2`; `yakkha` → *Dạ-xoa*.
  - Chuỗi mười lăm từ `sakkaccakārino … tadadhipateyyā` (`36.10`, `47.3`): chỉ có tiền lệ rời (`anolīnavuttiko` *không lười nhác* ở `mn30:9.7`, `tadadhimutto tabbahulavihārī` *để tâm nơi đó, thường tu tập nơi đó* ở `an4.125:1.5`, `sakkaccakārī`/`sātaccakārī` ở `sn34.53:1.2`); chuỗi đầy đủ 0 tiền lệ. Định nghĩa giận dữ `62.3` (26 mục, trong đó `doso` và `byāpatti` mỗi từ lặp hai lần và dịch như nhau) và thang mức độ `63.2`–`63.13`: 0 tiền lệ.

  **Số Pāli.** `tīṇi akusalamūlāni`/`kusalamūlāni` = *ba gốc* (`3.1`, `4.10`); `tīṇimāni … nidānāni`, `Katamāni tīṇi` = *ba* (`4.2`–`4.3`); `tisso pucchā` = *ba loại câu hỏi*: 14 khoá chứa `tisso`, tạo thành 12 bộ ba (`17.3`, `20.2`, và mười bộ `23.2`–`23.20`), mỗi bộ đúng ba mục Việt; `cha ajjhattikāni`/`cha bāhirāni āyatanāni` = *sáu xứ bên trong*/*bên ngoài* (`58.6`); `tiṇṇaṁ vedānaṁ` = *ba Veda* (`44.2`), `itihāsapañcamānaṁ` = *môn thứ năm*; `dasahākārehi` = *mười nguyên do* (`62.1`), đếm lại ở `62.2`: ba (đã làm, đang làm, sẽ làm điều bất lợi cho tôi) + ba (cho người thương mến) + ba (điều lợi ích cho người không thương mến) + một (`aṭṭhāne`) = **10**; `13.4`: 5 loại đệ tử (`sāvakānaṁ`) + 22 loại giữ hạnh (`vatikānaṁ`) = 27 mục, Việt có đúng 22 chữ *giữ hạnh* và 28 chữ *chư thiên* (27 mục + câu kết). Thang giận dữ `63.2`–`63.13`: 12 khoá nối nhau thành 13 mức (`cittāvilakaraṇa` … `sabbacāgapariccāgāya saṇṭhito`). Không có số lớn, không có `sahassa`/`sata`/`navuti`, không có cụm `tiṁsakappasahassa`.

  **Bất định (không thêm vào thân kinh).**
  1. `4.6`, `5.4` mệnh đề cuối `attabhāvābhinibbattiyā` (cách dative): dịch *cho sự phát sinh của tự thân ở địa ngục, ở loài súc sinh, ở cõi ngạ quỷ* (`4.6`) và *… ở chư thiên và loài người* (`5.4`); câu trích song song ở `an6.39:1.11` dừng ở `duggatiyo` nên không có tiền lệ cho phần đuôi, và quan hệ giữa `duggatiyo` với cụm đứng sau chưa phân xử được.
  2. `2.7`, `9.4`: ánh xạ mười từ `mūla … samudaya` (đặc biệt `sambhava` *nguồn sinh*, `samuṭṭhāna` *nơi khởi lên*, `āhāra` *thức ăn*) là lựa chọn của bài vì chưa có tiền lệ cho cả chuỗi.
  3. `13.4`: `devatā` được dịch *chư thiên* nhất quán với lemma `devatānaṁ` (`13.1`) dù các đối tượng là voi, ngựa, lửa, phương hướng…; câu `devavatikānaṁ devo devatā` dịch *giữ hạnh thiên thần thì thiên thần là chư thiên* để khỏi lặp từ.
  4. Kệ `26.5`, `33.5` `Āsīsamānā puṇṇaka itthattaṁ`: `itthatta` hiểu là *trạng thái hiện hữu này* theo `snp5.4:2.5`, còn lời giải `31.1` đọc nó qua `ettha attabhāva…` (*ở đây … tự thân*); Sujato dịch *longing for this place*. Giữ gần Pāli, không tự quyết một trong hai.
  5. `62.2` `aṭṭhāne` → *vô cớ*; `63.3` `mukhakulānavikulāna` → *làm mặt mày nhăn nhó, méo mó* (hợp từ khó, 0 tiền lệ); `63.13` `sabbacāgapariccāgāya saṇṭhito` → *quyết định từ bỏ, xả bỏ tất cả* (chưa phân xử được là *quyết bỏ hết* hay *sẵn sàng bỏ hết*).
  6. `58.3`–`58.9` `oraṁ`/`paraṁ` → *bên này*/*bên kia*, kèm *tự thân của mình/của người khác*, *sáu xứ bên trong/bên ngoài*, *cõi người/cõi trời*, *dục giới/sắc giới và vô sắc giới*: 0 tiền lệ; kệ `paroparāni` giữ *cao thấp* của `snp5.4:6.1`.
  7. `42.3` `viceyya` → *sau khi cân nhắc* (`an8.37:1.3` dịch *có lựa cọ và bỏ bớt*); `dinnaṁ` dịch *đã cho*; `dadaṁ cittaṁ pasāditaṁ` → *khi đang cho thì tâm đã được tịnh tín*.
  8. `11.5`–`11.6`: Pāli ngắt câu sau `alamatto`, còn `cnd17:14.3` nối liền; ở đây `11.6` dịch *Để nói ra, giải đáp điều con đã hỏi; xin hãy mang gánh nặng ấy—*, coi `kathetuṁ visajjetuṁ` là bổ ngữ của `alamatto`.
  9. `47.1` kết bằng dấu hai chấm (Pāli không có dấu cuối khoá) vì lemma tiếp tục ở các khoá `47.2`–`47.7`.
  10. `62.2` Pāli không có nháy, nên các câu `anatthaṁ me acari` được viết thành *giận dữ sinh khởi khi nghĩ rằng người ấy đã làm điều bất lợi cho tôi*; chủ ngữ *người ấy* là chủ ngữ ngầm của động từ, không có từ riêng trong Pāli.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (413/413, cùng thứ tự); nháy kép `“”` khớp Pāli từng khoá (0/413 lệch; 25 khoá có nháy kép, Pāli không có nháy đơn nên Việt cũng không có); dấu lược `…` khớp Pāli từng khoá (0/413 lệch; 41 khoá `…pe…` đều thành đúng một `…`, 2 khoá có `…` trần đều giữ đủ số dấu); Pāli không có `(…)` nên Việt cũng không có; ngoặc đơn `( )` khớp từng khoá (12/12); 0 khoá rỗng; NFC; không khoảng trắng thừa; Pāli lọt sang Việt chỉ gồm lemma `Iccā` (2 khoá: `10.1`, `52.2`) và tên riêng/loại hình (`Puṇṇaka`, `Ājīvaka`, `Nigaṇṭha`, `Supaṇṇa`, `Aviruddhaka`, `Vāsudeva`, `Baladeva`, `Puṇṇabhadda`, `Maṇibhadda`, `Yāma`, `Tusita`, `Veda`, `Nāga`, `Inda`, `Māra`); đã in và đọc đối chiếu đủ 413 cặp Pāli↔Việt.

  **Lượt cải thiện 2026-10-13** (đọc đối kháng lại đủ 413 cặp Pāli↔Việt, rồi dò lại tiền lệ bằng chỉ mục Pāli→Việt toàn tầng). Đổi **4/413 khoá**, đều là sửa rõ ràng (*clarity fix*) ở chỗ tiếng Việt gượng hoặc mơ hồ, không đổi nghĩa Pāli, không chạm tập khoá. (1) `14.8`, `15.1`, `16.1` (`Kathaṁ yaññā vā ete puthū?` và hai câu song song): *Thế nào là những lễ tế này thì nhiều?* → *Những lễ tế này nhiều như thế nào?*, tương tự *Những người cúng tế này nhiều như thế nào?* và *Những bậc đáng được cúng dường này nhiều như thế nào?*; câu cũ ghép *Thế nào là …* (khuôn của `Katamā`) với *thì nhiều* nên đọc không thành câu hỏi; `Kathaṁ` hỏi *bằng cách nào, ra sao*; 0 tiền lệ nguyên văn ở các bài khác (đã dò), và các câu đáp `14.9`–`14.10`, `15.2`–`15.3`, `16.2`–`16.3` giữ nguyên. (2) `63.15` (`Yassa so hoti kodho pahīno …`): *Vị nào có giận dữ ấy đã được đoạn trừ* → *Ở vị nào giận dữ ấy đã được đoạn trừ*; câu cũ có thể đọc ngược thành "vị nào còn giận dữ thì giận dữ ấy đã đoạn trừ"; cách mới theo `mnd10:18.15` (cùng đoạn Pāli, chỉ thiếu `hoti`) và theo cách nói của chính bài ở `65.2`, `66.3` (*ở vị nào*). Điểm đổi: `vietnamese_clarity` 8.6 → 8.7 (chỉ nâng 0,1 vì chỉ sửa bốn khoá); `final_score` 8.92 → 8.93. Các tiêu chí khác **giữ nguyên**, vì đọc lại không tìm thấy lỗi nghĩa, phủ định, chủ thể, số lượng hay ranh khoá nào cần sửa, và bất định thật vẫn còn nguyên (không nâng `semantic_fidelity`, `ambiguity_integrity`; `triangulation` vẫn 8.0 vì không có bản Anh độc lập).

  Dò tiền lệ trong lượt này: 207 khoá của cnd7 có Pāli (đã bỏ chữ hoa/dấu câu) trùng với khoá đã dịch ở bài khác (đủ 12 ký tự trở lên); bản Việt hiện tại giống ít nhất một bản tiền lệ ở **202/207**, khác ở **5** khoá (`4.4`, `47.7`, `51.3`, `57.4`, `67.4`), đều đã giải thích ở trên và đều có lý do cục bộ. Các mẫu công thức nặng (`62.3` 26 mục như `mnd10:17.15`, `mnd11:36.2`, `cnd23:297.10`; thang `63.2`–`63.14` như `mnd10:18.2`–`18.14`; `24.1`, `24.4`, `11.1`–`11.6`, `44.2`, `16.2`) khớp tiền lệ từng chữ; không sửa các chỗ ấy.

  **Chỗ nghi ngờ nhưng quyết định KHÔNG đổi (ghi để người sau biết, vì tiền lệ tầng một chiều).** (a) `34.5`, `36.1`, `36.21`, `39.5` `kaccisu … appamattā` dịch *nếu họ không phóng dật …*: `kacci(ssu)` là tiểu từ nghi vấn (lời giải `36.2`, `36.4` của chính bài ghi là *câu hỏi*, *liệu có*), nên *nếu* có thể đọc thành điều kiện chứ không phải câu hỏi; nhưng cả 12/12 nơi `kaccisu`/`kaccissu` đi với *te bhagavā* trong tầng (`snp5.4:3.5`, `snp5.8:3.6`, `cnd2:14.5`, `cnd2:48.6`, `cnd11:17.1`, `cnd11:22.1`, `cnd11:22.11`, `cnd11:26.1` và bốn khoá của cnd7) đều dùng *nếu … liệu*; đổi riêng bài này sẽ lệch các bài đã có, nên giữ và ghi bất định; các khoá `kacci` không có `-su` ở nơi khác (ví dụ `dn3:2.14.2`, `dn2:10.4`) được dịch thành câu hỏi *… chứ?* / *… có … không?*. (b) `yājayogā` dịch hai cách trong cùng bài: *bị mê đắm trong sự tế lễ* (`40.4`, `47.1`, `47.3`, `47.4`, `47.7`, `48.1`, `48.4`, `49.4`) và *những người chuyên tế lễ* (`50.1`, `51.1`, `51.3`, `56.1`); cả hai đúng theo `snp5.4:4.4` / `5.1` và `cnd2:15.4` / `16.1` (4/4 tầng); lời giải `47.3` chỉ nói *gắn bó, gắn chặt, chuyên chú*, không nói *mê đắm*, nên *mê đắm* có thể hơi nặng hơn Pāli `yoga` và trùng nghĩa với *say đắm* của `bhavarāgarattā`; không đổi vì sẽ lệch hai bài đã có. (c) `48.2`, `51.2` (*bị sinh đeo bám, bị già lan tràn, bị bệnh chế ngự, bị chết đánh gục*): tầng có ba cách dịch chuỗi `jātiyā anugatā … maraṇena abbhāhatā` (*đeo bám/lan tràn/chế ngự/đánh gục* ở `cnd11:33.1`, `cnd11:41.4`; *theo kịp/tràn khắp/áp đảo/giáng xuống* ở `mnd15:41.2`, `cnd5:14.4`, `cnd8:28.6`; *sinh bám theo/già lan khắp/bệnh áp đảo/chết đánh gục* ở `cnd14:9.2`, `cnd14:18.1`), không có đa số rõ; bài này theo `cnd11` (cùng khuôn lời giải). Không có bất định mới nào làm đổi nghĩa trọng yếu, nên không thêm blocker; blocker `noEnglishEditionUpstream` giữ nguyên.

  Tự kiểm sau sửa: tập khoá bản Việt = tập khoá Pāli (413/413, cùng thứ tự); nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá (0/413 lệch; Pāli không có nháy đơn); ngoặc đơn khớp từng khoá (0 lệch); dấu lược `…` khớp từng khoá (0 lệch, không còn `…pe…`); 58 nhóm Pāli trùng nguyên văn trong bài, Việt khác ở đúng hai nhóm đã nêu ở trên (`40.4`/`47.7`/`49.4` và `50.1`/`51.3`/`56.1`, khác nhau chỉ ở việc có hay không có *họ* / *không vượt qua* tùy khoá liền kề); NFC; 0 khoá rỗng; không khoảng trắng thừa. Lượt này cũng **không** chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; `technical_integrity` giữ 9.6.
  Sửa lan 2026-10-13 (lượt L539): khoá cnd7:68.3, “Bạch ngài, Đức Thế Tôn là Bậc Đạo Sư …” → “Bạch Thế Tôn, Thế Tôn là Bậc Đạo Sư …” (bhante gửi tới Đức Thế Tôn); căn cứ: skill/translation.md mục xưng hô và cùng công thức đã sửa ở cnd19:68.2. Các bài cnd khác còn "Bạch ngài, Đức Thế Tôn …" cùng công thức (cnd8, 9, 10, 12, 17, 18, 20) nằm ngoài lượt này.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 89 khoá chênh lệch lớn nhất → khác nghĩa 3: sửa 0, giữ 2 (`1.6` `puthūdha loke`: bản mù *nhiều người ở đời này*, bản dự án *thật nhiều ở đời* giữ mơ hồ vì lời giải `14.7` của chính bài cho ba cách đọc: lễ tế nhiều, người cúng tế nhiều, bậc đáng cúng dường nhiều; `57.1` `paroparāni`: bản mù *cái bên này và bên kia*, bản dự án *cao thấp*, trong khi lời giải `58.3`–`58.9` dùng `ora`/`para` là *bên này/bên kia*, nên cách đọc *cao thấp* của câu kệ vẫn là cách đã có từ lượt trước), bất định 1 (`40.4` `yājayogā` hai cách dịch trong bài, đã ghi). Phần còn lại là khác hình thức hoặc thuật ngữ (thẻ đậm, `kappa`, `paṭisandhi` *kết sinh*/*tục sinh*, `vessa`/`sudda`, `isayo` *ẩn sĩ*/*đạo sĩ*, `āsīsanti` *cầu nguyện*/*mong cầu*). Review đối kháng toàn bài (ngoài danh sách chênh lệch) tìm thấy 1 lỗi thật, đã sửa: `6.2` `avijjāsamugghātā` *đưa đến chỗ tận diệt của vô minh* → *và cùng bị nhổ tận gốc với sự nhổ tận gốc vô minh*; câu cũ đảo hướng (pháp bất thiện không đưa đến sự diệt vô minh; chính khi vô minh bị nhổ thì chúng bị nhổ theo), khớp `6.3` `sabbe te samugghātaṁ gacchanti` (tất cả đều đi đến chỗ bị nhổ bỏ). Cùng lỗi còn ở `sn20.1:1.5` (ngoài lát, chưa sửa). Bản mù không bắt được lỗi này, nên mức đối chiếu chỉ ở mức một lần dịch lại cùng họ công cụ. Không có bản Anh hay bản Việt độc lập khác.
  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt đủ 413 khoá, đoạn song song snp5.4, cnd2, cnd11, cnd12, mnd10/11/13/14, cnd23; không có bản nguyên bài): sửa 4 khoá — (1) `6.3` `samugghātaṁ gacchanti` *đi đến chỗ tận diệt* → *đi đến chỗ bị nhổ tận gốc*, cho khớp `6.2` `avijjāsamugghātā` đã sửa lượt trước (ghi chú cũ nói đã khớp nhưng văn bản chưa đổi); (2) `62.3` `dussanā dussitattaṁ` *sự làm hại, trạng thái bị làm hại* → *sự sân hận, trạng thái sân hận*: **sai nghĩa** — `dussati` là nội động từ (khởi sân), `dussita` không phải bị động *bị làm hại*; cùng calque còn ở `mnd10:17.15`, `mnd10:87.2`, `mnd11:36.2`, `mnd14:165.6`, `cnd23:297.10` (ngoài lô, chưa sửa); (3) `58.11` `nissaraṇato` *thoát ly* → *xuất ly* (6/8 khoá tầng, khớp `cnd5:58.43`); (4) `63.14` chủ ngữ là `kodho`: *Khi giận dữ, sau khi giết người khác…* (đọc được thành người đang giận) → *Khi giận dữ giết người khác rồi giết chính mình…*. Giữ: `48.2`/`51.2` *bị sinh đeo bám…* theo cnd11 (tầng có 3 dạng, dạng *theo kịp* đa số 5/9 — đề nghị người biên tập thống nhất); `60.2` *yên lặng* cho `santo` trong chuỗi, lemma *an tịnh*, theo mnd13:126.2, cnd12:23.5. Bất định cũ (`kaccisu`, `yājayogā`, `itthatta`, `63.3`, `63.13`) giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: B3 — `23.16` (`iddhipāda` = “như ý túc”); B19 — `60.2` (`santo` = “an tịnh”, `upasanto` = “yên lặng”).

  Nghiên cứu nguồn ngoài 2026-10-16: bản Việt song ngữ Pāli–Việt của Tỳ khưu Indacanda,
  Cūḷaniddesapāḷi - Tiểu Diễn Giải (Tam Tạng Song Ngữ Pāli–Việt, Sri Lanka 2018),
  https://tamtangpaliviet.net/TTPV/36_Nidd_II.pdf (Tiểu Diễn Giải, tập 36); đã tải toàn văn và đối
  chiếu phần tương ứng; nguồn độc lập với dự án, giấy phép không khai (NOASSERTION), chỉ dùng làm bằng
  chứng nghĩa, không chép. Đã đối chiếu: căn chỉnh theo đoạn 68 nhóm đoạn của bài với Indacanda (41
  nhóm khớp từ vựng và không lệch phủ định hay số đếm, 3 nhóm trùng chữ với nhóm đã so ở bài khác, 24
  nhóm bị cờ; nhóm bị cờ mới quét theo danh sách cờ, chưa đọc từng nhóm); đọc từng nhóm kệ trích (6
  nhóm) cạnh Indacanda và Sujato; so 74 mục từ đầu đoạn với mục từ của Indacanda; kệ trích còn so với
  Sujato snp5.4 (78 khoá có Pāli trùng chữ với kho `snp`, 52 khoá có Việt trùng chữ, 26 khoá khác, đã
  xem mẫu: phần lớn do ngắt dòng, chấm câu hoặc do Niddesa tự đọc kệ khác Sujato). Phần lời giải
  Niddesa chỉ có Indacanda làm nguồn độc lập (Sujato không có bài này); phần kệ trích có thêm Sujato.
  Sửa: không có khoá nào. Bất định/ghi nhận: không phát sinh bất định mới.
