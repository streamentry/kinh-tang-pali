  VẾ 2 VÀ VẾ 3 TRÙNG NGUYÊN VĂN VỚI JA262, đã dùng lại đúng nguyên văn như đã nói ở bài kia.

  CHỖ CHƯA CHẮC — BÀI NÀY LÀ CHỖ TÔI ÍT TỰ TIN NHẤT LÁT. (1) Abhijjamāne vārismiṁ ở 1.1: tôi dịch là
  Khi trận võ sĩ đang phân định, lấy abhijjamāna là đang tranh phân định và vārismi là võ sĩ; từ vārismi
  chỉ xuất hiện đúng hai khoá trong toàn tầng Pāli và không có bản Việt nào để đối chiếu, nên đây là
  suy đoán của tôi chứ không phải tiền lệ. (2) Missībhāvitthi ở 1.3 là tên riêng, tôi giữ nguyên dấu
  Pāli; tôi không suy đoán thêm nó là ai. (3) saṁsīdasi ở 1.4 là ngôi hai số ít, tôi dịch trung tính
  là chìm mất trong dòng nước lớn; nếu phải giữ ngôi thì câu là ngươi đã chìm mất. (4) Āvaṭṭanī mahāmāyā
  ở 2.1: tôi dịch là một bức thành dày sức màu vời vĩ đại, lấy āvaṭṭanī là bức thành và mahāmāyā là sức
  màu vời; cũng có thể āvaṭṭanī là chỗ nương tựa thì câu sẽ là nơi nương tựa lớn của sức màu vời. Hai
  vế 2.1-2.2 tôi hiểu là hai danh xưng cho cùng một nhân vật, nên dịch thành hai vế nối nhau.
