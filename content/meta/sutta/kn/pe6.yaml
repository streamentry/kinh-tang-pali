  - Số Pāli:
    Năm uẩn (1.8), mười xứ thuộc sắc (1.3, `dasa` 10: năm căn và năm đối tượng đúng như liệt kê), sáu nhóm thọ, tưởng, tư, thức (1.4–1.7), mười tám giới (3.1, 3.3), mười hai xứ (4.1–4.4, 6 + 6), hai loại liễu tri (4.7), bốn Thánh đế (5.1), ba mươi bảy pháp trợ giác ngộ (6.1, 6.2: 4 niệm xứ + 4 chánh cần + 4 thần túc + 5 căn + 5 lực + 7 giác chi + 8 chi đạo = 37), bảy giác chi, tám chi đạo, ba uẩn (7.5–7.8: 3 + 3 + 2 = 8), mười mục (`7.10` `dasa padāni`: không phân xử được), bốn mũi tên (8.4: sân, tham, si, kiến), ba thọ, ba giới; bốn chấp thủ (9.12), ba hữu (9.13); chín nền tảng bất thiện (11.1: hai phiền não gốc + ba gốc bất thiện + bốn đảo lộn = 9; `23.1`–`23.9` liệt kê đúng chín: vô minh, ái, tham, sân, si, tưởng thường, tưởng lạc, tưởng ngã, tưởng tịnh); bốn đảo lộn × ba loại = mười hai (21.4, `21.5` còn lại câu "sáu nhóm mười hai, và có bốn đảo lộn" không phân xử được); bốn cơ sở của tự thân (22.1–22.6: 5 uẩn gom thành 4); chín nền tảng thiện (24.1, `37.1`–`37.9` đúng chín: chỉ, quán, vô tham, vô sân, vô si, bốn tưởng); `35.2` `satta saṅkhārā asubhā` dịch "bảy hành là bất tịnh": có thể là `sabbe`, có thể là "bảy"; không phân xử được; tám pháp thế gian (32.4); mười một pháp lấy giới làm gốc (45.1: không hối hận, hoan hỷ, hỷ, khinh an, lạc, định, tri kiến như thật, nhàm chán, ly tham, giải thoát, tri kiến giải thoát = 11; đúng với `45.2`–`45.12`); bốn bánh xe (44.1); ba + ba + hai = tám chi đạo gắn với ba gốc thiện (28.7, 29.7, 30.7, 31.1); bốn quả Sa-môn (46.1); ba kiết sử (47.2: thân kiến, nghi hoặc, giới cấm thủ); năm kiến đoạn kiến + mười lăm kiến thường kiến = hai mươi kiến chấp của thân kiến (49.1–49.3; `pañca` + `pannarasa` = 5 + 15); sáu mươi hai kiến chấp (49.4); ba pháp đáng mong ước (50.4, 50.6: thứ hai, thứ ba); năm hạ phần kiết sử (57.1) và năm thượng phần kiết sử (58.1); bốn thông đạt (53.2); bốn việc của chỉ quán song hành (55.1, 55.4, 55.6, 55.8: bốn việc mỗi ví dụ); hai Niết-bàn giới (59.4); chín chứng đạt tuần tự (60.1, 60.2: 4 thiền + 4 vô sắc + diệt = 9, `60.7`); năm triền cái (61.27; ở `61.5` hỏi `pañca` rồi nêu bảy tên vì `thinamiddha` và `uddhaccakukkucca` là hai cặp); năm loại nghi hoặc (61.25 liệt kê đúng năm); ba trú (64.2); năm chi, bốn chi, năm chi, bốn chi của bốn thiền (61.2, 66.2, 67.1, 68.1, 69.1: 5, 4, 5, 4; `67.1` đếm bốn chi `caturaṅga` gồm cả `pītisukha` thành hai: hỷ và lạc). Bài không có số lớn; không có cụm cần phân xử về số.
