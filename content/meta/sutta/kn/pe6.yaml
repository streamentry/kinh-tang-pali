h), 27.7–27.8, 61.12–61.15, 9.19, 2.2/3.4/4.6/4.8 «saññā», 34.3, 45.4, 50.4/50.6 ākaṅkhiya «đáng mong ước» (DPD, sn55.7:11.6). 26 khoá lời kinh đổi, 20 chú thích mới, 3 chú thích viết lại (9.17, 52.4, 74.1). Bảng: pe3_pe6.tsv. Không đổi status, quality, blocking_errors.
  Quyết định của người biên tập (uỷ quyền) 2026-10-18: 42.1 «bốn trí» → «bốn thiền» theo tiền lệ E (42.2 «catūsu jhānesu», ne7:2.7 «tassa jhānāni padaṭṭhānaṁ») và §5.1 (BJT «cattāri jhānāni»); chú thích tại khoá giữ chữ ghim.
  Lượt hoàn thiện theo lời phê chấm lại 2026-10-18 (score/pe3/pe6.md): viết lại chú thích 42.1 cho người đọc (bỏ câu cũ «giữ chữ ghim “bốn trí”» mâu thuẫn lời Việt và các ký hiệu nội bộ; nêu chữ ghim ñāṇāni, BJT p164 jhānāni với cước chú Ma, PTS, câu kinh dẫn 42.2 = sn48.8:1.13–1.15, khuôn 39–43, ne7:2.7, Indacanda tr.165, vì sao giữ atītā ở 40.2/41.2); dòng «bốn trí» trong mục Chỗ bất định ở trên là ghi chép lịch sử, lời Việt hiện là «bốn thiền». Thuật ngữ: 42.1 ekagga «nhất điểm» → «nhất tâm» (ne7:2.7 published); 10.14 uparodha «cắt đứt» → «chấm dứt» (như 27.11, 59.2; «cắt đứt» dành cho upaccheda ở 9.19); 57.1 «vị ấy là Thánh đệ tử Bất lai» → «vị Thánh đệ tử trở thành bậc Bất lai» (hoti như 56.2, bhavati 58.2; chú thích 56.2); 48.3, 52.7 ākāraparivitakka «sự suy tư theo cách» → «sự suy luận theo lý lẽ» (mn95:14.5, mn101:11.4, sn12.68). Câu khó: 28.2 «Vô tham thuộc bản chất nào:» (đọc như câu hỏi) → «Vô tham có bản chất là …» kèm chú thích; 59.1 câu đồng nhất «có» → «là» kèm chú thích; 67.1 «hỷ lạc» → «hỷ, lạc» (đủ bốn chi, pītisukha là cặp); 28.6 «nó» → «vô tham ấy» (so = alobho, như 29.5, 30.5; Indacanda tr.161); 22.12–22.13 nối câu để «“bất tịnh là tịnh”» không treo giữa hai câu (viharato → «khi sống…», chủ ngữ «vị ấy» ở 22.13); 52.3 paricarissāmi «hầu cận» → «vui thú» (DPD paricarati 3, đi cùng kīḷissāmi ramissāmi). Chú thích mới: 2.2 (kèm 3.4, 4.6, 4.8: saññā, đề nghị suññaṁ của Ñāṇamoli theo cước chú Indacanda tr.147), 9.19 (BJT khandhānaṁ … nikkhepo), 28.2, 50.4 (kèm 50.6: ākaṅkhiya, Indacanda đọc phủ định), 59.1 (BJT arahattaphalaṁ ca / Ma, PTS arahanto ca), 60.6 (virāgino), 61.11 (nioṭṭhānā, BJT vitthāro), 61.13 (kèm 61.15: BJT đảo thân/tâm giữa middha và thina); bổ sung 16.2 (dị bản acchadanaṁ). Không đổi lời Việt ở locus §6.2; không đổi chữ ghim nào ngoài 42.1 đã có.
  Lượt hoàn thiện thứ hai theo lời phê còn lại 2026-10-18 (score/pe3/pe6.md, phần lượt một chưa xử lý; Claude Opus 5.5 (Claude Code)): sửa calque ở 8 khoá ngoài locus: 22.2–22.5 cặp quan hệ yo … so «X uẩn nào, đó là Y» → «X uẩn là Y, cơ sở của tự thân» (nghĩa đồng nhất giữ nguyên, như 22.1, 22.6); 26.2 «như thật,» đứng trơ như một mục của chuỗi → «sự tìm tòi như thật» (yathābhūtaṁ là trạng từ trước vicayo, DPD; BJT tr.158); 55.6 sītaṁ pariyādiyati «làm cạn cái lạnh» → «đẩy lùi cái lạnh» (DPD pariyādiyati 1 «overcomes; overpowers»; 55.8 giữ «làm cạn nhiên liệu»); 66.3 «sự chứng ngộ» chen sau cụm → bốn danh từ liền nhau như 69.2 (BJT tr.178 cùng khuôn ở hai chỗ); 66.4 «Vị ấy sống sau khi làm phát sinh» → «Sau khi làm phát sinh năm chi này, vị ấy an trú» như 67.1, 68.1. Không xử lý: «nghĩa phân cách tham» (3.8), «nghĩa bao quanh» (73.2) và ngoặc vuông (chỉ ở 3.11, 9.2, 48.2) vì là locus §6.2, viết lại là chọn hộ một cách hiểu; «nền tảng» cho pada/padaṭṭhāna/bhūmi giữ thống nhất với ne2:10.2, ne7:2.7 và tiêu đề pe3 đã published; «dòng tuôn chảy» (nissanda) giữ như pe3:6.1, 8.5 đã published; 60.6, 61.11, 28.2 không có lỗi nghĩa sửa được trong lời Việt (đối chiếu lại DPD, BJT, Indacanda): lời Việt theo chữ ghim, cách đọc khác đã nêu ở chú thích lượt một, đổi lời kinh là đoán. Không đổi chú thích, chữ ghim hay locus nào.
  Rà lỗi còn sót 2026-10-18: 415/415 khoá đã đọc (Pāli ghim cạnh bản Việt; locus §6.2 chỉ kiểm câu Việt còn sát chữ ghim, không phán lại); sửa 23.2 (nghĩa từ sai: piyarūpasātarūpaṁ «sắc khả ái, sắc dễ chịu» → «cái đáng ưa, cái dễ chịu»; -rūpa là hậu tố tính từ theo DPD piyarūpa «agreeable», không phải «sắc», bản cũ thu hẹp nền tảng của ái về sắc pháp; dùng lại lời ne7:1.5 đã published cho cùng câu, khớp công thức ps1.1:193.4–6 «cái gì trong đời là đáng yêu, dễ chịu… mắt…»; Indacanda TTPV 44 tr. 157 đọc «sắc» nhưng ở câu Netti cùng chữ, TTPV 43 tr. 47, đọc «vẻ»); không sửa 51.5 «sự không đi đến chỗ an lập» (phủ định có trong chữ ghim: adhiṭṭha + agamanaṁ theo DPD, BJT anadhiṭṭhānaṁ tr. 170), 9.6 «về bốn đại và về sắc nương vào các đại» (khác cách phân tích cách, tổng nội dung không đổi, Indacanda tr. 151), 62.2 sabbato kusalapakkhikā (đọc tân ngữ hợp ngữ pháp, nghĩa không đổi), 10.1 bỏ «Tattha» (từ nối), 6.11 asādhāraṇaṁ kassa (đã ghi dịch sát chữ). Bảng: dec/hunt_pe6.tsv. Không đổi status, quality, blocking_errors.
  Lượt sửa 2026-10-18: 9.6 «sự chế định về sắc nương vào bốn đại» (bỏ «và», gắn catunnaṁ mahābhūtānaṁ với upādāyarūpassa theo ne17:9.3, Indacanda tr. 151); chú thích đã thêm.
