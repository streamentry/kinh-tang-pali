    + Phân xử lại danh sách blocker Pāli hỏng: grep toàn bộ Pāli đã ghim (dn, mn, sn, an, kn) cho `pāṇasajjesu`, `apasacchāgamanaṁ`, `alañcanā`, `samanantarāyikā`, `saṁvattisantikā`, `gatapaṭṭho`, `parividaṭṭho`, `satimapaccavekkhato`, `rucivimutti`, `sūrāapaṭikkhepana`, `atītā cattāro sammappadhānā/satipaṭṭhānā`, `dasannaṁ piyā` chỉ cho kết quả ở chính pe6 (0 đoạn song song); `jarā` ở `ne7:3.13` có `upadhiparipākalakkhaṇā` (so `pe6:10.13` `upanayaparipākalakkhaṇā`), cho thấy `upanāho`/`upanaya` ở `9.17`/`10.13` vẫn là cách đọc khác của Pāli ghim, không phải bằng chứng sửa. Cột Việt hiện hành và bản Việt nguyên bài đều không có cho pe6. Colophon `74.1` so với `pe2:210.1`, `pe8:313.7`, `pe9:65.1` (`… nāma … bhūmi samattā`) không giải thích được `saṁvattisantikā`.
    + Chỉ có một điểm tiến triển, chưa đủ để gỡ khoá: `38.1` `satimapaccavekkhato`, `agatimapaccavekkhato` là sandhi `-ṁ + apaccavekkhato` (cùng dạng với `nānādhātuanekadhātuvinibbhogamapaccavekkhato` ngay trong câu: `vinibbhogaṁ apaccavekkhato`), nên dạng chữ không hỏng và phủ định "không quán xét" ở bản Việt đúng; nhưng nghĩa của `sati` và `agati` (có thể liên quan "tính liên tục" và "oai nghi") vẫn không phân xử được từ Pāli ghim. Giữ khoá `38.1` trong blocker.
    + Không có khoá nào trong danh sách blocker được phân xử có căn cứ; giữ nguyên toàn bộ 22 khoá. Không sửa `35.2` `satta saṅkhārā asubhā`: ba tưởng song song `32.2`–`34.2` mở bằng `sabbe`/`sabbesu`, và `29.2` có `sattesu vā saṅkhāresu vā`, nên `satta` có thể là `sabbe` hoặc `sattā`; cũng chưa đủ căn cứ để đổi chữ Pāli ghim.
    + Bất định thêm: `61.20` `alañcanā vilañcanā` có thể là biến dạng của `luñcati` ("nhổ, xé") đi cùng `vilekho` ("cào xé") ở cùng khoá, chưa kiểm được; giữ "sự dằn vặt, sự giày vò".
    + Lỗi chéo (không sửa theo brief): không gặp cụm `tare loke visattikaṁ`, `adurāgataṁ`; tiêu đề `0.2` theo tiền lệ `pe3`/`pe4`.

  Quyết định hội đồng biên tập 2026-10-16: B3 — `6.7` (`iddhipāda` = “như ý túc”); B12 — `52.3` (`vata`/`sīlabbata` bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”).

  Nghiên cứu nguồn ngoài 2026-10-16: Ñāṇamoli, The Piṭaka-Disclosure (Peṭakopadesa), PTS 1964, https://ancient-buddhist-texts.net/Reference/PTS/Nyanamoli-Pitaka-Disclosure.pdf (bản scan, đọc qua OCR của người làm; còn bản quyền PTS; chỉ làm bằng chứng nghĩa); Indacanda, Peṭakopadesa song ngữ, https://tamtangpaliviet.net/TTPV/ttpv_44_Pet.pdf (NOASSERTION; chỉ làm bằng chứng nghĩa; lưu ý Indacanda có chỗ nhận hiệu đính của Ñāṇamoli nên không hoàn toàn độc lập với PD); đã đối chiếu các khoá nêu trong blocker Pāli ghim hỏng với chú thích hiệu đính của Ñāṇamoli (cuối mỗi chương) và với Indacanda ở một số chỗ; chưa đọc song song toàn văn. Theo chính sách hội đồng (mục D) chỉ dùng nguồn để hiểu NGHĨA chữ ghim hỏng: không sửa Việt theo dị bản hay chữ Pāli suy đoán, không gỡ blocker Pāli hỏng; nghĩa các chữ ghim hỏng theo nguồn: `4.12` đọc `dubbaṇṇakāro` theo Bb và chú giải; `4.13` chú giải tách `kāmakilesa` và `kammakilesa`; `9.2` `vitthārena` không rõ nghĩa; `9.17` `upanayaparipāko` có thể hỏng (gợi ý `upadhiparipāko`); `16.2` đoạn đầy chữ hỏng; `21.5` đọc theo gợi ý về `vipallāsa`; `35.2` xoá các chữ chép lặp; `38.1` hỏng, so Vism 640; `40.1`–`41.2` `atītā` sai, đọc `atthitāya`; `52.4`/`52.7` hỏng nặng, đoạn song song ngay dưới giúp xác định ý (nói về `sīlabbataparāmāsa`); `61.20` `alañcanā vilañcanā` không có trong PED; `61.25` đọc `samantantarāyikā`; sửa không có; bất định mọi khoá trong blocker, đặc biệt `16.2`, `52.4`.
  Thí điểm gỡ chỗ Pāli ghim hỏng 2026-10-17 (docs/editorial-decisions-2026-10-17.md §5.5; Claude Opus 5.5 (Claude Code)): thử từng locus trong blocker «Pāli root đã ghim … chưa phân xử được» theo thứ tự đọc chữ ghim (DPD, ngữ pháp), câu song song trong Pāli ghim, dị bản §5.1 (lớp variant tại commit ghim). 22 locus, GỠ 6, KHÔNG GỠ 16. GỠ: `3.10` theo chữ ghim (ekanta + pakati + attha; 3.11 minh họa bằng pakatiyā, pakaticakkhudhātu), bỏ «nên» không có trong Pāli; `7.10` theo chữ ghim («mười mục» đúng chữ, câu lược …pe…, không điền), không đổi; `40.1` theo chữ ghim (DPD sūra + apaṭikkhepana), không đổi; `40.2`, `41.2` theo chữ ghim, nội dung chính xác nhận bởi `ne7:2.5`, `ne7:2.6` (không có atītā), giữ «đã qua»; `52.7` theo chữ ghim: DPD paccāgacchati 2 (+đối cách, cách -to: «xem là») như `an6.55` «sīlabbataparāmāsaṁ sārato paccāgacchanto», nên «visucito vimuttito» là «là sự thanh tịnh, là sự giải thoát» chứ không phải «từ thanh tịnh, từ giải thoát mà quay trở lại» (sửa); `72.2` theo dị bản §5.1: gatapaṭṭho không đọc ra được, bj «vigataṭṭho» (pts «appaṭṭho»), DPD vigata 1 và `ps2.10:9.3` («sắc đã mất đi … trống rỗng»), «nghĩa đã đi» → «nghĩa đã mất đi». Mỗi khoá GỠ có chú thích ở `content/comment/vi/project/sutta/kn/pe6_comment-vi-project.json`. KHÔNG GỠ: `3.8` (rāga «tham» hay «màu» không quyết được), `3.11` («piyā» không hợp; tách «pi yā» thì kho không bao giờ viết «-ṁ pi»), `4.12`–`4.13` gāvā, `5.2` (`27.5`, `27.7`, `pe9:46.2` cho khổ = danh và sắc nhưng không giải thích chữ ghim, và `pe2:38.8` có cặp kāyika/mānasika cạnh tranh), `9.2`, `9.17` (công thức già chuẩn `ps1.1:182.1` không có hai chữ ấy), `16.2` (variant bj apasaṭṭhāgamanaṁ cũng không đọc ra được), `21.5`, `35.2` (ít nhất ba cách dựng lại), `38.1` (chỉ Vism gỡ được, không có trong Pāli ghim), `48.2` (variant avattito không gỡ được), `52.4`, `61.20` (`cnd17:22.5` không có alañcanā vilañcanā), `61.25`, `73.2`, `74.1`: không có cách đọc theo chữ ghim, không song song, không variant đủ §5.1. Lỗi khác đã sửa: `52.7` sīlavata «giới và hạnh» → «giới và cấm hạnh» (B12 của hội đồng, cùng `52.3`). Bài còn locus chưa phân xử nên giữ draft và không chấm lại (§5.5); không đổi status, quality, blocking_errors.
  Lượt hai §5.6 (BJT) 2026-10-17 (docs/editorial-decisions-2026-10-17.md §5.6; Claude Opus 5.5 (Claude Code)): đối chiếu 16 locus còn treo với ấn bản Buddha Jayanti (tipitaka.lk kn-petk-6, trang p146–p178) và bản in lại trong Tam Tạng Pāli–Việt tập 44 của Bhikkhu Indacanda (tr. 146–179, cước chú Ma, PTS). GỠ 2 locus trọn: `5.2` theo BJT «khandhasarīraṁ mānasaṁ ca» (Ma dhammācariyaṁ; DPD sarīra 1, mānasa 2; Indacanda «thể xác và tinh thần»; 27.5, 27.7 danh và sắc), «thầy dạy pháp và ý» → «thân xác và tâm»; `74.1` theo BJT «Peṭakopadese suttatthasamuccayo nāma chaṭṭhamabhūmi samattā» (Ma, PTS như chữ ghim; cùng khuôn pe2:210.1), → «Nền tảng thứ sáu trong Peṭakopadesa, tên là Tập Hợp Nghĩa Kinh, đã hoàn tất.». Gỡ một phần, locus vẫn treo: `9.17` BJT không có pavivittaṁ (Ma thêm; công thức già sn12.2:3.2), bỏ «sự tách biệt», còn upanāho BJT vẫn giữ; `52.4` khung câu theo BJT «yā tathābhūtassa khanti rucī vimutti … passanā, ayaṁ sīlassa sīlabbataparāmāso» (Ma yathābhūtadassananti, asantussitassa; song song 48.3, 52.7; Indacanda đọc cùng cách) → «Sự chấp nhận, sự ưa thích, sự giải thoát, … của người như vậy; đây là giới cấm thủ thuộc về giới», còn «rāgo rāgaparivattakā diṭṭhi rūpanā» BJT trùng chữ ghim và rūpanā không có trong DPD. KHÔNG GỠ vì BJT trùng chữ ghim: `3.8` (tipitaka.lk «vacaccheda» là lỗi số hoá, bản in như chữ ghim), `4.12`–`4.13` (gāvā), `9.2`, `9.17` upanāho, `21.5`, `35.2` (BJT chỉ viết liền «sattasaṅkhārā»; Indacanda «các hành của chúng sanh»; khác cách tách từ không được coi là khác chữ, như pe3:30.2), `38.1`, `48.2` (chỉ khác anuggāho), `61.20`, `61.25`, `73.2`. KHÔNG GỠ vì cách đọc BJT không đủ điều kiện 3: `3.11` (BJT «dassanampi yā ca» nhưng Indacanda dịch «trong số mười», không có nguồn giải nghĩa), `16.2` (BJT «apasaṭṭhāgamanaṁ» không có trong DPD, Indacanda đọc theo apasacca-; asampajjagāho chỉ khác g/gg). Mỗi khoá đã sửa có chú thích ở content/comment/vi/project/sutta/kn/pe6_comment-vi-project.json. Bài còn locus treo nên giữ draft và không chấm lại (§5.5); không đổi status, quality, blocking_errors.
  Lượt hai §5.6, bổ sung theo quyết định điều phối 2026-10-17: `35.2` GỠ theo chữ ghim với cách tách từ của BJT «sattasaṅkhārā» (tipitaka.lk p162, TTPV tập 44 tr.162; Indacanda tr.163 «các hành của chúng sanh»), vì cách tách từ là việc của người biên tập ấn bản và trong bài không có «bảy hành» nào (32.2–34.2 nói mọi hành/mọi pháp, 36.1 gắn tưởng bất tịnh với sắc uẩn); «bảy hành» → «các hành của chúng sinh», có chú thích.
