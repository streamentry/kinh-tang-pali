notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pe/pe6_root-pli-ms.json` (415/415 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli). Đây là nền tảng thứ sáu (`Suttatthasamuccayabhūmi`) của Peṭakopadesa, đoạn kết `74.1` gọi là "nền tảng của Tạng". Bài là bản trình bày tập hợp nghĩa của kinh theo ba hàng: uẩn, giới, xứ (1.1–4.15); bốn Thánh đế (5); ba mươi bảy pháp trợ giác ngộ (6–7); chuỗi mười hai chi duyên khởi với đặc trưng và nền tảng ứng với từng chi (9–10); chín nền tảng bất thiện (11–23) và chín nền tảng thiện (24–37); các căn, bốn bánh xe, mười một pháp lấy giới làm gốc (38–45); bốn nền của bậc Thánh và ba kiết sử đoạn trừ khi nhập lưu (46–59); chín chứng đạt tuần tự, năm triền cái (60–69); bốn nghĩa vô thường, khổ, không, vô ngã (70–73). Văn bản Pāli ghim nhiều chỗ hỏng hay cụt (xem phần bất định): bản Việt dịch sát chữ, không gỡ hộ.

  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho pe6: tầng `english-sujato` chỉ có chín nhánh `cp dhp iti ja kp snp thag thig ud` dưới `sutta/kn/` (755 tệp), không có thư mục `pe`; chỉ có tệp tên `pe-name_translation-en-sujato.json` (pe6 = "The Sixth Stage: Compendium of Discourse Meaning") không kèm prose của bài. Đây là `not-published-upstream`, không phải `not-synced` (manifest chỉ liệt kê tệp Pāli `kn/pe/pe6_root-pli-ms.json` cho pe6). Lớp lấp `english-project` chưa có tệp nào cho `pe` (chỉ có `ne24`, `ne27`–`ne30`, `ne32`, `ne34`). Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú (26 tệp). Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.0 (≤ 8.0). Bài này dịch chỉ từ Pāli, từ tiền lệ thuật ngữ của chính tầng dự án (`pe3`, `pe4`, `pe7`, `pe9` và các bài Netti `ne7`, `ne17`, `ne19`, `ne20`, `ne23`) và từ các bài kinh Nikāya mà bài trích lại hay song song (`dn22`, `dn33`, `dn34`, `mn9`, `mn141`, `sn41.2`).
    Tên Sujato dịch `Suttatthasamuccayabhūmi` là "Compendium of Discourse Meaning"; bản này dịch "Tập Hợp Nghĩa Kinh" (`samuccaya` "tập hợp", `suttattha` "nghĩa của kinh").
  - Coverage English:
    Mẫu số = 285 khoá Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`). Sujato phủ 0/285 (0/415 khoá tổng); coverage English 0%, dưới ngưỡng, nên bài chưa thể `review`/`published`; `reference-gaps.yaml` có entry cũng không cứu được `published` (ngoài phạm vi lát này, không chạm). Không có cách đọc English độc lập nào cho bài này.
  - Tiền lệ cùng bộ (`pe`, `ne`):
    `0.1` "Peṭakopadesa" dùng lại nguyên văn của `pe3:0.1`, `pe4:0.1`, `pe7:0.1`, `pe9:0.1`. `0.2` giữ số thứ tự "6." như `pe3:0.2` ("3."), `pe4:0.2` ("4."), tên "Nền Tảng Thứ Sáu: Tập Hợp Nghĩa Kinh" theo nhịp `pe4`, `pe3` (`bhūmi` đầu bài → "nền tảng"). `74.1` đi cùng nhịp "tên chương" của `pe3:86.1`, `pe4:13.1`; `saṁvattisantikā` không phân giải được (xem bất định), nên không thêm tác giả như `pe4:13.1` (Pāli ở đây không nêu tên tác giả).
    Phần song song Netti: `10.1`–`10.18` (chuỗi đặc trưng và nền tảng ứng với từng chi duyên khởi) đối chiếu với `ne7:3.2`–`3.18`, cùng mô hình `lakkhaṇa` → "có đặc trưng là" và `padaṭṭhāna` → "nền tảng ứng với" (84/103 khoá `padaṭṭhāna` trên toàn tầng); Pāli khác nên không dùng lại nguyên văn. Hai chỗ `ne7` khác bài này: `jāti` → "sanh" ở `ne7` còn bài này viết "sinh" (cùng `pe3` và đa số tầng), `maraṇa` → "tử" ở `ne7:3.13`–`3.14` còn bài này viết "chết" (`jarāmaraṇa` → "già chết" như tầng); `ne7:3.8` và `ne7:3.9` dịch đảo chiều "nền tảng ứng với" so với Pāli (ngoài phạm vi lát này, không sửa).
    Bài không có tên `hāra` hay `naya`, nên không dùng "phương thức" hay "lối".
  - Pāli trùng nguyên văn:
    Dò Pāli của 415 khoá với toàn bộ Pāli đã ghim (dn, mn, sn, an, kn), so sau khi bỏ dấu câu, nháy và chữ hoa: 11 khoá có Pāli trùng ở bài khác mà phía kia có bản Việt, tổng 324 cặp (phần lớn là câu hỏi ngắn lặp lại ở nhiều bài, như `Katame cattāro?`); trong đó 21 cặp Việt giống sau khi bỏ dấu câu, 303 cặp khác. Riêng với `pe`/`ne`: 8 cặp, 5 giống (`0.1` với `pe3`, `pe4`, `pe7`, `pe9`; `54.2` với `pe4:6.6`), 3 khác (`9.1` và `9.5` "Trong đó" so `ne17:16.2` và `ne17:9.2` "Ở đây", vì `tattha` ở các bài `pe` đều dịch "Trong đó"; `10.9` so `ne7:3.9` đã nêu trên). Với các cặp ngoài `pe`/`ne`: `Katame cattāro?` (`6.4`) dùng "Thế nào là bốn?" theo 161/241 khoá; `Kiṁ kāraṇā?` (`55.2`) dùng "Vì cớ gì?" theo 25/29 khoá, `Kiṅkāraṇaṁ?` (`54.2`) dùng "Vì lý do gì?" theo 14/15 khoá; `manodhātu dhammadhātu manoviññāṇadhātu` (`3.2`) dùng "ý giới, pháp giới, thức ý giới" theo `sn41.2:3.11` (tầng chia 3 "giới thức ý" so 1 "thức ý giới", 0 "ý thức giới"; `3.1` đi cùng "thức nhãn giới"); `Katamesaṁ tiṇṇaṁ?` và `Katamesaṁ dvinnaṁ?` (`29.6`, `30.6`, `28.7`) đáp án trên tầng là "Thế nào là ba?" (5/6) và "Hai lậu ấy là gì?" (10/14), nhưng đó là hỏi về ba lậu/ba pháp ở bối cảnh khác; ở đây hỏi về chi phần của đạo nên dịch "Ba chi nào?", "Hai chi nào?".
    Trong chính bài: 6 nhóm Pāli trùng nguyên văn sau khi bỏ dấu câu (`2.2`/`4.6`; `11.2`/`24.2`; `13.3`/`15.1`/`17.1`/`28.4`/`29.3`/`30.3`; `32.3`/`33.3`/`35.3`; `55.7`/`55.9`; `63.1`/`64.1`/`65.1`), bản Việt giống nhau ở cả 6 nhóm (`55.7` và `55.9` chỉ khác ở chỗ `…` và ` ….` theo dấu chấm cuối của Pāli); 0 cặp bản Việt khác. Hai cặp Pāli gần trùng nhưng cố ý khác: `55.1` và `55.5` (khác ở chữ `Tattha`/`evameva`).
