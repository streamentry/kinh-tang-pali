notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh cho `pv23` ở commit đã ghim. Tầng `vietnamese-current` cũng vắng: manifest tại commit đã ghim chỉ có 26 tệp, toàn bộ là Pháp Cú.
  Đã đọc Pāli của bài trước khi viết chữ, và đọc cả hai bài kề cùng phẩm `pv22` (đã dịch) và `pv24` (chưa dịch) để bám nhịp. Cả 32 khoá đã dịch; không có khoá nào bỏ trống, kể cả mọi khoá dưới 40 ký tự.
  Số đo mẫu: tổng 32 khoá; Pāli ≥ 40 ký tự = 0 (khoá dài nhất 37 ký tự); `english-sujato` không có tệp ⇒ coverage đo được 0/0 ⇒ cổng coverage KHÔNG đo được gì, khác hẳn 0% không đạt ngưỡng. `vietnamese-current` không phủ.
  Tiền lệ đo được và đã dùng lại nguyên văn: `2.2` `Anekacittaṁ naranārisevitaṁ` trùng nguyên văn `vv11:1.4` nên dùng lại bản dịch sẵn có (tâm tư đa dạng, có nam nữ hầu hạ); `3.4` trùng `5.4` ngay trong bài nên hai khoá giống nhau. Khuôn đóng bài theo `pv22:11.1` và `pv46:4.1`: Chuyện Ngạ Quỷ …, thứ mười một.
  0.1 `Petavatthu` giữ nguyên theo đa số 25×; 0.2 `Ubbarivagga` giữ nguyên theo 2× (pv20, pv22) — không dịch thành Phẩm, dù `Uragavagga` và `Mahāvagga` trong cùng bộ đã được dịch; ghi ở đây để người biên tập thống nhất. 0.3 `Suttapetavatthu` không có tiền lệ: đây là phần Ngạ Quỷ thuộc Kinh Tương (phân biệt với phần văn xuôi và phần Rừng), nên dịch là Chuyện Ngạ Quỷ Kinh Tương; đây là chỗ bất định đã ghi, không phải chỗ đã chắc. Mọi số đếm trong tệp này là ảnh chụp lúc đo, đo SAU khi loại ba tệp của lát s3 khỏi tầng Việt; các agent khác vẫn đang ghi vào cùng tầng nên số có thể đã tăng.
  `kāhaṁ puññāni nayayyāmi` không có tiền lệ (`kāhaṁ` và `nayayyāmi` 0 khoá trong kho) nên dịch theo nghĩa: tôi sẽ tạo phước đức rồi dâng lên. `pārupāmi` cũng 0 tiền lệ; giữ cả hai lần `ca … ca` thay vì gộp. `vihaññanti` chỉ có 1 tiền lệ ở nghĩa khác (ud2.9) nên dịch theo nghĩa đúng ở đây là bị tiêu diệt.
  Bất định đã ghi: `Suttaṁ adāsiṁ upasaṅkamma yācitā` — `yācitā` không thuộc ngữ pháp với `Suttaṁ` (tân ngữ số ít, danh từ số nhiều), nên bản Việt giữ đủ ba ý theo thứ tự Pāli (tôi đã trao, đi đến, xin và cầu) mà không chọn lựa một cách hiểu nào; đây là chỗ thiếu chắc chắn, ghi vào đây thay vì bịa nghĩa cho từ. Cụm `Kiṁ tattha gantvāna ito karissasī` và `Vajjesi aññampi janaṁ idhāgataṁ` ràng buộc chủ thể chưa rõ trong bản Việt vì chính Pāli cũng ràng buộc lỏng; giữ nguyên mức độ chắc chắn, không thêm chủ thể nào.
  Lượt review đối kháng tự làm bắt được 4 lỗi trong bản nháp: (1) `6.4` lúc đầu có thêm cụm không có trong Pāli (hãy bảo họ) — đã bỏ; (2) `6.3` lúc đầu dịch `Vajjesi` thành mệnh lệnh của người kể, đã đổi thành câu mong nguyện cho người nghe; (3) `2.3` lúc đầu vót chữ không có trong Pāli (đủ sức), đã bỏ; (4) `3.1` lúc đầu dịch `anvayā` thành Đi theo sau, nghe như kế tiếp theo thời gian, đã đổi thành Ngay sau để giữ đúng nghĩa nối tiếp của quả báo.
  0 khoá nào có dấu lược, vì Pāli của pv23 không có `…pe…` lẫn `…` trần.
  `technical_integrity` chỉ 9,6 vì bị cấm chạy cổng: còn lại `npm run validate`, `npm test`, `npm run check`, `npm run build`. Trạng thái `draft` là do blocker ở trên, không phải do điểm.
