notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh cho `pv23` ở commit đã ghim. Tầng `vietnamese-current` cũng vắng: manifest tại commit đã ghim chỉ có 26 tệp, toàn bộ là Pháp Cú.
  Đã đọc Pāli của bài trước khi viết chữ, và đọc cả hai bài kề cùng phẩm `pv22` (đã dịch) và `pv24` (chưa dịch) để bám nhịp. Cả 32 khoá đã dịch; không có khoá nào bỏ trống, kể cả mọi khoá dưới 40 ký tự.
  Số đo mẫu: tổng 32 khoá; Pāli ≥ 40 ký tự = 0 (khoá dài nhất 37 ký tự); `english-sujato` không có tệp ⇒ coverage đo được 0/0 ⇒ cổng coverage KHÔNG đo được gì, khác hẳn 0% không đạt ngưỡng. `vietnamese-current` không phủ.
  Tiền lệ đo được và đã dùng lại nguyên văn: `2.2` `Anekacittaṁ naranārisevitaṁ` trùng nguyên văn `vv11:1.4` nên dùng lại bản dịch sẵn có (tâm tư đa dạng, có nam nữ hầu hạ); `3.4` trùng `5.4` ngay trong bài nên hai khoá giống nhau. Khuôn đóng bài theo `pv22:11.1` và `pv46:4.1`: Chuyện Ngạ Quỷ …, thứ mười một.
  0.1 `Petavatthu` giữ nguyên theo đa số 25×; 0.2 `Ubbarivagga` giữ nguyên theo 2× (pv20, pv22) — không dịch thành Phẩm, dù `Uragavagga` và `Mahāvagga` trong cùng bộ đã được dịch; ghi ở đây để người biên tập thống nhất. 0.3 `Suttapetavatthu` không có tiền lệ: đây là phần Ngạ Quỷ thuộc Kinh Tương (phân biệt với phần văn xuôi và phần Rừng), nên dịch là Chuyện Ngạ Quỷ Kinh Tương; đây là chỗ bất định đã ghi, không phải chỗ đã chắc. Mọi số đếm trong tệp này là ảnh chụp lúc đo, đo SAU khi loại ba tệp của lát s3 khỏi tầng Việt; các agent khác vẫn đang ghi vào cùng tầng nên số có thể đã tăng.
  `kāhaṁ puññāni nayayyāmi` không có tiền lệ (`kāhaṁ` và `nayayyāmi` 0 khoá trong kho) nên dịch theo nghĩa: tôi sẽ tạo phước đức rồi dâng lên. `pārupāmi` cũng 0 tiền lệ; giữ cả hai lần `ca … ca` thay vì gộp. `vihaññanti` chỉ có 1 tiền lệ ở nghĩa khác (ud2.9) nên dịch theo nghĩa đúng ở đây là bị tiêu diệt.
  Bất định đã ghi: `Suttaṁ adāsiṁ upasaṅkamma yācitā` — `yācitā` không thuộc ngữ pháp với `Suttaṁ` (tân ngữ số ít, danh từ số nhiều), nên bản Việt giữ đủ ba ý theo thứ tự Pāli (tôi đã trao, đi đến, xin và cầu) mà không chọn lựa một cách hiểu nào; đây là chỗ thiếu chắc chắn, ghi vào đây thay vì bịa nghĩa cho từ. Cụm `Kiṁ tattha gantvāna ito karissasī` và `Vajjesi aññampi janaṁ idhāgataṁ` ràng buộc chủ thể chưa rõ trong bản Việt vì chính Pāli cũng ràng buộc lỏng; giữ nguyên mức độ chắc chắn, không thêm chủ thể nào.
  Lượt review đối kháng tự làm bắt được 4 lỗi trong bản nháp: (1) `6.4` lúc đầu có thêm cụm không có trong Pāli (hãy bảo họ) — đã bỏ; (2) `6.3` lúc đầu dịch `Vajjesi` thành mệnh lệnh của người kể, đã đổi thành câu mong nguyện cho người nghe; (3) `2.3` lúc đầu vót chữ không có trong Pāli (đủ sức), đã bỏ; (4) `3.1` lúc đầu dịch `anvayā` thành Đi theo sau, nghe như kế tiếp theo thời gian, đã đổi thành Ngay sau để giữ đúng nghĩa nối tiếp của quả báo.
  0 khoá nào có dấu lược, vì Pāli của pv23 không có `…pe…` lẫn `…` trần.
  `technical_integrity` chỉ 9,6 vì bị cấm chạy cổng: còn lại `npm run validate`, `npm test`, `npm run check`, `npm run build`. Trạng thái `draft` là do blocker ở trên, không phải do điểm.
  Giải quyết draft 2026-10-12 (kiểm toán độc lập, đọc đối kháng cả 32 khoá; bản dịch cũ sai nghĩa gần như toàn bài, đã viết lại; mục này THAY THẾ các mục cũ nói về `Suttapetavatthu` = Kinh Tương, về bất định `yācitā`, về `Vajjesi`, về `nayayyaputta` và về lượt review tự làm ở trên).
  Tiêu đề: `suttaṁ` ở 1.2 là sợi chỉ (vật được dâng), nên `Suttapetavatthu` là Chuyện Ngạ Quỷ Sợi Chỉ, không phải Kinh Tương; `translationTitle` và `:0.3`/`:8.1` đã đổi cho khớp. `:0.1` `Petavatthu` và `:0.2` `Ubbarivagga` giữ như cũ.
  Lỗi nghĩa thật trong bản cũ: 22/32 khoá (0.3, 1.1, 1.2, 1.4, 2.1, 2.2, 2.3, 3.2, 3.4, 4.1–4.4, 5.4, 6.1–6.4, 7.1, 7.2, 7.4, 8.1); các khoá còn lại chỉ sửa từ ngữ cho sát Pāli hoặc sáng hơn. Chia loại: (a) `nayayyaputta maṁ` = `naya ayyaputta maṁ` ("xin hãy đưa tôi đi, thưa anh/chàng"), không phải "hỡi con trai", và không có "dâng lên" (3.4, 5.4); (b) `Satta tuvaṁ vassasatā idhāgatā` do người đối thoại nói với nữ thiên ("nàng đã đến đây bảy trăm năm"), bản cũ đọc thành hô cách "Hỡi ngươi" và dựng câu "tất cả thân nhân kể cả người đã qua đời cũng sẽ ở nơi ấy" (4.1, 4.3, 4.4); (c) 6.1–6.4: `pasayha bāhāyaṁ` = cưỡng ép nắm cánh tay, `paccānayitvāna` = đưa trở về, `theriṁ sudubbalaṁ` = bà lão rất yếu ớt, `vajjesi` = "hãy nói" (đã có tiền lệ pv31:7.2, pv31:12.2 "hãy nói"), không phải "dạy dỗ trưởng lão nữ khó chinh phục", "làm vợ chồng", "bị bác bỏ", "ngươi sẽ đạt an lạc"; (d) `vihaññanti` = khổ não (gốc `vihaññ-` có 62 khoá trong kho, các bản dịch dùng "khổ não / làm khổ / dày vò"), không phải "bị tiêu diệt"; `akatena sādhunā` = do không làm việc lành, bản cũ gắn nhầm thành "việc ấy làm chưa cho đàng hoàng" (7.1–7.2); `ṭhitā pajā` = chúng sinh an trú trong lạc, không phải "tái sinh" (7.4); (e) 2.3 `bhuñjāmi ca pārupāmi ca` bản cũ thành "ăn bao nhiêu tuỳ ý, cũng ăn bao nhiêu tuỳ ý" (chữ bịa, và bỏ mất `pārupāmi` = khoác/mặc: 39 khoá có gốc `pārup-`, đều là mặc/khoác/trùm); 2.1 "thơm ngát" không có trong Pāli; 2.4 `Pahūtavittā na ca tāva khīyati` = của cải dồi dào mà chưa cạn; (f) `sātaṁ` = dễ chịu (không phải "thỏa mãn"; an10.66 "sự lạc, sự dễ chịu"); `samappitāya` = được cung ứng đầy đủ (dn14, dn21, dn23 cùng gốc: "được cung ứng đầy đủ"); `vipāko` = quả báo (pv36 3 khoá); `sukhavedanīyaṁ` = cảm quả lạc (mn136, mn101: "nghiệp cảm quả lạc"); (g) 1.1–1.4: `bhikkhuno … yācitā` bản cũ nói "vừa xuất gia, đi đến xin và cầu" (thêm "cầu", đổi chủ thể); bản mới tách rõ vị tỳ-kheo đến và tôi được xin; `vatthakoṭiyo` = nhiều koṭi vải vóc, giữ `koṭi` theo tiền lệ pv38:39.4, bv13:8.4, bv13:11.3, cnd14, thi-ap28 (các khoá có `koṭi` đều giữ nguyên chữ `koṭi`), không đổi thành "triệu". Bản cũ 2.2 "tâm tư đa dạng" sai (`citta` ở đây là màu sắc, trang trí): đổi thành "muôn màu muôn vẻ" đúng nguyên văn vv11:1.4 (Pāli giống hệt; vv64:5.1 cùng gốc, "đủ thứ màu sắc").
  Phép đo: tập khoá Việt = tập khoá Pāli (32/32), đúng thứ tự Pāli; nháy kép “ ” và nháy đơn ‘ ’ khớp Pāli từng khoá; Pāli của bài không có dấu lược nên Việt không có `…`. Pāli trùng nguyên văn trong chính bài: `3.3`=`5.3` và `3.4`=`5.4`, cả hai cặp đều giống nhau ở bản Việt (0 cặp lệch). Số Pāli: `satta vassasatā` = 700 năm (7 × 100) ở 4.1 và `satteva vassāni` = 7 năm ở 5.1; Pāli không nói "năm cõi người" hay "năm cõi trời" nên bản Việt không thêm.
  Bất định còn lại, đều ghi ở đây, không đưa vào thân kinh: (1) `ayyaputta` (3.4, 5.4) là xưng hô; Pāli không nói người nghe là chồng hay công tử; dịch "anh" theo tiền lệ `ayyaputta` ở mn87:22.5, an8.21:5.7, an8.22:5.7, sn41.10:3.1 (đều "anh"), không khẳng định quan hệ; (2) `ramitaṁ` (2.1) dịch "đáng vui thích", sắc thái "được vui thích / đáng ưa" chỉ có hai cách hiểu gần nhau, không đổi nghĩa; (3) `vipākamanvayā` (3.1) dịch "theo sau quả báo của chính nghiệp ấy"; (4) `idhāgataṁ` (6.3) "đã đến đây": Pāli không nói rõ "đây" là cõi người hay cõi trời nên giữ nguyên "đây"; (5) `pajā` (7.4) dịch "chúng sinh"; (6) 6.1–6.2 là lời kể, vế "vị ấy nói" không có trong Pāli nên bản Việt chỉ đặt dấu hai chấm trước lời trích ở 6.2; chủ thể "vị ấy" (So) là người đối thoại với nữ thiên, theo cấu trúc nháy của chính Pāli (lời trích mở ở 6.3 và đóng ở 7.4), nên `mayā` ở 7.1 là của người ấy.
  Blocker đã gỡ: "Coverage Anh không đo được gì" — không phải lỗi văn bản: cả 32 khoá Pāli đều ngắn hơn 40 ký tự (khoá dài nhất 37 ký tự), nên mẫu số coverage bằng 0 và cổng coverage không có gì để so với ngưỡng 0,80; không có đoạn nào "Sujato để trống" vì Sujato không có tệp cho bài. Đọc đối kháng cả 32 khoá từ Pāli, bản dịch tự đứng vững từ Pāli, `triangulation` ≤ 8,0. Blocker giữ nguyên: "Không có tầng tham khảo tiếng Anh tại commit đã ghim" — đúng sự thật về upstream, đã giữ nguyên câu.
  Giới hạn tham chiếu: tầng `vietnamese-current` vắng ở bài này (chỉ có Pháp Cú); bản Việt nguyên bài ở mục Tra cứu toàn văn chỉ được dùng để đối chiếu cách đọc, không chép câu chữ. Chấm lại: source_provenance 9,4 · semantic_fidelity 9,0 · grammar_logic 9,0 · segment_alignment 10,0 · terminology 9,0 · triangulation 7,8 · vietnamese_clarity 9,0 · han_viet_balance 9,2 · ambiguity_integrity 9,0 · technical_integrity 9,6 (trước: 9,6 · 9,2 · 9,2 · 10,0 · 9,2 · 7,5 · 9,3 · 9,3 · 8,9 · 9,6 = 9,18; điểm cũ cao hơn vì bản cũ chưa bị đọc đối kháng).
