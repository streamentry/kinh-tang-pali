  BẤT ĐỊNH 1 — NGÔI KỂ 2.3–2.4: `Tuvaṁsi ajjhupagatā yasassinī, / Obhāsayaṁ tiṭṭhasi pubbadevatā` đổi từ ngôi một (`Ṭhānaṁ mamaṁ` ở 1.4) sang ngôi hai, trong khi 2.1–2.2 vẫn là lời người kể. Theo quy ước đo được của tầng `vv` (`yā tvaṁ tiṭṭhasi devate;` → `nàng đang đứng nơi đây, này thiên nữ;` 6/7), tôi dịch ngôi hai bằng `nàng` và giữ nguyên ngôi của từng câu: `đã tiến đến nàng, / nàng tỏa sáng y như các nữ thiên trước.` KHÔNG chọn một giọng kể trong thân kinh.
  BẤT ĐỊNH 2 — 5.1–5.2: `Yametaṁ sakka anupucchase mamaṁ` có `anupucchase` ở ngôi hai, tức người nói là chính nữ thiên đang trả lời Sakka; nhưng `‘Kuto cutā tvaṁ idha āgatā’ti` lại là câu hỏi của Sakka được dẫn lại. Dịch `“Chỗ này của ta, hỡi Sakka, ngài hỏi ta: / rằng ‘Từ đâu mà ngươi đến đây?’;` — giữ đúng cả hai vế thay vì chọn.
  BẤT ĐỊNH 3 — `Kesakārī`: tên riêng của nữ thiên, GIỮ NGUYÊN chứ không dịch nghĩa. Đã tra thử: 0 lần xuất hiện trong tầng `vietnamese-project`, 0 kết quả tra web cho nghĩa của từ, nên không dám thêm chú giải `nữ làm rượu` hay `nữ nấu dầu` (hai cách đọc thường được nêu cho từ này) khi không có chứng từ nào để đứng vững.
  BẤT ĐỊNH 4 — `Sasī` (3.1): `Sasī adhiggayha` (3.1) dịch `Nữ thiên cầm trăng`; `Sasī` là mặt trăng. 0 tiền lệ cho cả cụm.
