  KẾT LUẬN: bản cũ có 21/42 khoá sai nghĩa thật; 11 khoá chỉnh độ chính xác/đại từ/thuật ngữ; 10 khoá giữ nguyên (0.1–0.4, 2.2, 8.1, 9.1, 10.1, 10.5, 11.1). Tổng 32 khoá đã sửa. Điểm cũ không đứng vững nên được hạ.
  LOẠI LỖI NGHĨA THẬT (21): (a) bịa/thêm nghĩa không có trong Pāli, 7 khoá: 1.2 (`không ngừng kiên cố` cho `satataṁ sunimmitaṁ`, nhẹ), 3.1 (`Nữ thiên cầm trăng`: `sasī` là mặt trăng, `adhiggayha` là át/trội hơn, không có nữ thiên nào), 4.3–4.4 (`chẳng vị nào sánh được`, `từng hầu bên`: Pāli nói chư thiên Tam Thập Tam cùng Indra không chán nhìn Phạm thiên, và `chúng tôi` không chán nhìn nàng), 5.1 (`Chỗ này của ta`: `yametaṁ` là `điều này mà`), 6.2 (`hoà nhất` cho `ekantagatā`), 10.4 (`sirimā` là tên Sirimā, bị đọc thành `rực rỡ nhất`; `kesakārikā` bị biến thành số nhiều); (b) sai cấu trúc/vai ngữ pháp, 10 khoá: 2.3–2.4 (`tuvaṁsi ajjhupagatā` = `nàng đã đến`; bản cũ đảo thành `đã tiến đến nàng` và thêm so sánh `y như`), 3.2–3.3 (`adhiggayha` bị mất: trăng/vua tinh tú/nàng ÁT đám sao/đám tiên nữ, bị đọc thành `cùng` và `giữa`), 4.1 (`anomadassane` là hô cách `dung mạo vô song`, bị đọc thành tên `Anomadassana` rồi bịa `Dị Thường Tướng`), 5.3 (`Bārāṇasī nāma puratthi kāsinaṁ` = `có thành tên Bārāṇasī của dân Kāsi`, bị đọc thành `ta vốn là người xứ Bārāṇasī`), 6.3 (`akhaṇḍasikkhāpadā āgatapphalā` bị trộn thành `quả của nền học tập không gián đoạn`), 7.3–7.5 (ba dòng hô cách `pasannamānase… asaṁsaye… akhaṇḍasikkhāpade… āgatapphale` — đang nói về chính nữ thiên — bị đọc như trạng ngữ `Với…` gắn vào câu hoan hỷ của Sakka); (c) sai từ vựng, 4 khoá: 6.4 và 7.6 (`niyatā` = chắc chắn, không phải `được dẫn vào`; `anāmayā` = không bệnh tật, không phải `không lệch lạc`), 10.2 (`dīpatiladakkhiṇā dve` = Dīpa và Tiladakkhiṇā, hai; bản cũ `Dâng Hạt Nành` sai `tila` = mè và bỏ mất `dīpa`), 10.3 (`uttarā` là Uttarā, bị đọc `Bậc Trên`).
  11 KHOÁ CHỈNH NHẸ: 1.1 (`pabhassaraṁ` = chói sáng, không phải `sáng rõ`), 1.3 (`motthataṁ` = phủ, không phải `vây quanh`; bỏ `ròng`), 1.4, 2.1 (`accharā` = tiên nữ), 3.4 (`yasasā` = danh tiếng, không phải `uy nghi`), 4.2 (thêm lại `upapannā` = sinh lên), 5.2 (thêm lại `cutā` = mạng chung), 5.4, 6.1, 7.1 (`svāgataṁ te` = chào mừng nàng), 7.2.
  ĐẠI TỪ: Sakka nói 1–4 và 7 (`mamaṁ`, `bhavanaṁ mamaṁ`, `anupucchase`, `abhinandāmase`), nữ thiên đáp 5–6. Sakka gọi nàng bằng `nàng` (tiền lệ tầng `vv`: 6/7 cho dạng `yā tvaṁ tiṭṭhasi devate`); nữ thiên gọi Sakka `ngài`, tự xưng `tôi` (tiền lệ `tôi` 137 vs `ta` 23 đã đo ở bài trước); số nhiều `tappāmase`/`abhinandāmase` → `chúng tôi` (tiền lệ pv37:13.4, vv84:13.4). Bản cũ trộn `tôi`/`ta` cho cùng một người nói và gọi nữ thiên là `ngài` ở 3.3, 4.1, 4.4 nhưng `nàng` ở 2.3–2.4.
  TIỀN LỆ ĐÃ ĐO (tầng `vietnamese-project`, không kể bài này): `saṅghe` → `Tăng` 18 vs `Tăng chúng` 9 vs `Tăng đoàn` 8 vs `hội chúng` 2 ⇒ `Tăng`; `ekantagata` → `nhất hướng` 15/16; `accharā` → `tiên nữ` 40 vs `nữ thiên/thiên nữ` 16 ⇒ `tiên nữ`; `tidasa` trong `vv` → `Tam Thập Tam` 16 vs `Ba Mươi Ba` 3 ⇒ `Tam Thập Tam`; `yasasā` → `danh tiếng` (vv40, vv21, vv34, pv21); `akhaṇḍa` → `không đứt đoạn` (sn55.15, sn55.44); `sikkhāpada` → `giới điều` (vv15, vv19, vv22–vv26, vv37; dạng `Pañcasikkhāpade`); `niyatā … sambodhiparāyaṇā` → `chắc chắn hướng đến giác ngộ` (sn55.39, sn55.52); `āgataphalo` → `đã đạt quả` (an6.10); `anāmayaṁ` → `không bệnh tật` (ja502, ja532–534); `ruciraṁ pabhassaraṁ` → `rực rỡ, chói sáng` (pv39:3.1, vv52:5.1) vs `đẹp mắt, sáng ngời` (vv64:6.2); `satataṁ` → `luôn luôn/thường xuyên` (vv53:20.3, tha-ap532:27.3); `sataṁ sahassāni` → `một trăm ngàn` (ja481:8.1); `svāgataṁ te` → `chào đón` (ja529:68.1); `Tassuddānaṁ` giữ nguyên tên Pāli trong dòng tóm lược như vv28 và vv38.
  SỐ PĀLI: `sataṁ sahassāni` = 100 × 1.000 = 100.000 (`một trăm ngàn`); `pañca pīṭhā` 5 + `tayo nāvā` 3 + `dīpatiladakkhiṇā dve` 2 + `pati dve` 2 + (`suṇisā` 2, ngầm theo `dve` và theo hai bài vv13–vv14) + `uttarā` 1 + `sirimā` 1 + `kesakārikā` 1 = 17, khớp tên đề mục `17.`; `sattarasamaṁ` = thứ mười bảy.
  CÒN LẠI / BẤT ĐỊNH (ghi tại đây, không thêm vào thân kinh): (1) 2.3–2.4 `pubbadevatā`: đọc là đối cách số nhiều đi với `obhāsayaṁ` (nàng chiếu sáng át các nữ thiên đi trước, song song với `accharāsaṅgaṇaṁ imaṁ` ở 3.3 và với `purimaccharā` ở 2.1); cách đọc khác là hô cách/chủ cách số ít (`hỡi nữ thiên thuở trước`) — hình thức Pāli của `devatā` cho phép cả hai, chưa phân xử được dứt khoát; (2) 7.1 `tantyābhinandāmase`: hiểu là `taṁ` + `abhinandāmase` (chúng tôi hoan hỷ đón nàng); hình thái nối `tyā` chưa tra được dạng song song trong kho; (3) `anāmayā` 6.4/7.6: giữ nghĩa đen `không bệnh tật`; nghĩa bóng (không còn phiền não/bệnh khổ) có thể được nhắm tới nhưng không tự thêm vào thân kinh; (4) `Kesakārī`/`kesakārikā`: `kesa` = tóc chắc chắn, `-kārikā` là danh từ chỉ người nữ làm/thực hiện; nghề cụ thể không phân xử được nên giữ nguyên Pāli làm tên (ở 5.4 là danh từ chỉ nghề, ở nhan đề là tên cung điện), không dịch thành `thợ làm tóc` hay `nữ làm rượu`; (5) 1.2 `satataṁ` gắn với `sunimmitaṁ` (`luôn luôn được tạo tác khéo léo`) hay với `vimānaṁ` không phân xử được; (6) 10.2–10.3: `Pati` trong tóm lược là viết tắt của `Patibbatā` (nhan đề vv11–vv12), giữ nguyên dạng Pāli; `Suṇisā` không có `dve` riêng trong Pāli nên không thêm `hai` vào thân kinh; (7) `Tam Thập Tam` cho `tidasā` theo quy ước tầng `vv`, dù nghĩa đen `tidasa` là ba mươi.
  LỖI HỆ THỐNG CHƯA SỬA (lan nhiều tệp vv, không sửa riêng một tệp): 0.2 và 11.1 `Itthivimāna` → `Cung Điện Nữ Hư Không` sai vì Pāli không có `ākāsa`; `itthivimāna` là `cung điện của các nữ nhân`. Hai khoá này còn sai nghĩa ở nhan đề phẩm; cũng cần sửa chung toàn bộ vv. Ngoài ra nhan đề vv10 (`Dâng Hạt Nành`, `tila` = mè) và vv11–vv12 (`Gả Chồng`, `patibbatā` = người vợ trung thành với chồng) cũng đáng xem lại, ghi ở đây chứ không sửa.
