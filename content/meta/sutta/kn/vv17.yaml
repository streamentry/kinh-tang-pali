notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho vv, xem `blocking_errors`.
  BA MỆNH ĐỀ ĐANG TÁCH ĐÔI — đã đo cục bộ trong tầng `vv` (40 tệp, 1.177 segment), cả hai hướng đều ghi ở đây:
    · ngôi kể: `tôi` 137 lần vs `ta` 23 lần ⇒ chọn `tôi`. Riêng `Tena metādiso vaṇṇo,`: `Nhờ vậy tôi …` 20 vs `Nhờ vậy ta …` 4 vs `… con …` 5.
    · `mahānubhāva`: `đại oai lực` 18 vs `uy thế lớn lao` 12 ⇒ chọn `đại oai lực` (đúng vv1+vv4). Bài này không có `mahānubhāva`.
    · `sabbadisā`: dạng `me` (`Vaṇṇo/Vaṇṇo ca me`) → `mọi phương` 18 vs `muôn phương` 10 vs `bốn phương` 2 ⇒ `mọi phương`; dạng `te` (`Vaṇṇo ca te`) → `muôn phương` 13 vs `mọi phương` 7 vs `bốn phương` 5 ⇒ `muôn phương`. Bài này không có cục nào, nhưng vv25 và vv46 có và đã theo đúng phép này.
  TIỀN LỆ: `Vimānavatthu` giữ nguyên Pāli 39/40; `Itthivimāna` → `Chuyện Cung Điện Nữ Hư Không` 16 lần; `Pīṭhavagga` → `Phẩm Pīṭha` 8 lần; `Tassuddānaṁ` → `Tóm lược:` 302 lần; `Vaggo tena pavuccatīti` → `phẩm ấy vì vậy được gọi tên là vậy.` (tiền lệ có sẵn); mẫu tiêu đề `17. Chuyện Cung Điện …` và mốc đóng `…, thứ mười bảy.` theo vv1/vv3/vv4/vv10–vv14; `Tiladakkhinā` → `Người Dâng Hạt Nành` (vv10:0.4) và `Suṇisā` → `Nữ Dâu` (vv13/14:0.4) dùng cho `10.2` và `10.3`; `Bārāṇasī` đã có 54 lần trong kho.
  BẤT ĐỊNH 1 — NGÔI KỂ 2.3–2.4: `Tuvaṁsi ajjhupagatā yasassinī, / Obhāsayaṁ tiṭṭhasi pubbadevatā` đổi từ ngôi một (`Ṭhānaṁ mamaṁ` ở 1.4) sang ngôi hai, trong khi 2.1–2.2 vẫn là lời người kể. Theo quy ước đo được của tầng `vv` (`yā tvaṁ tiṭṭhasi devate;` → `nàng đang đứng nơi đây, này thiên nữ;` 6/7), tôi dịch ngôi hai bằng `nàng` và giữ nguyên ngôi của từng câu: `đã tiến đến nàng, / nàng tỏa sáng y như các nữ thiên trước.` KHÔNG chọn một giọng kể trong thân kinh.
  BẤT ĐỊNH 2 — 5.1–5.2: `Yametaṁ sakka anupucchase mamaṁ` có `anupucchase` ở ngôi hai, tức người nói là chính nữ thiên đang trả lời Sakka; nhưng `‘Kuto cutā tvaṁ idha āgatā’ti` lại là câu hỏi của Sakka được dẫn lại. Dịch `“Chỗ này của ta, hỡi Sakka, ngài hỏi ta: / rằng ‘Từ đâu mà ngươi đến đây?’;` — giữ đúng cả hai vế thay vì chọn.
  BẤT ĐỊNH 3 — `Kesakārī`: tên riêng của nữ thiên, GIỮ NGUYÊN chứ không dịch nghĩa. Đã tra thử: 0 lần xuất hiện trong tầng `vietnamese-project`, 0 kết quả tra web cho nghĩa của từ, nên không dám thêm chú giải `nữ làm rượu` hay `nữ nấu dầu` (hai cách đọc thường được nêu cho từ này) khi không có chứng từ nào để đứng vững.
  BẤT ĐỊNH 4 — `Sasī` (3.1): `Sasī adhiggayha` (3.1) dịch `Nữ thiên cầm trăng`; `Sasī` là mặt trăng. 0 tiền lệ cho cả cụm.
  SỐ KHOÁ TRÙNG PĀLI: 3/42 khoá trùng nguyên văn trong lát (`0.1`, `0.2`, `11.1`); toàn lát dùng lại 61 cặp, 0 lệch.
  LƯỢT KIỂM TOÁN 2026-10-11 (đọc đối kháng từng khoá Pāli↔Việt; phần BẤT ĐỊNH 1, 2, 4 ở trên là của bản cũ và đã được thay bởi mục này): bản trước chấm 9,14 nhưng có lỗi nghĩa thật ở 17/42 khoá, nên điểm bị HẠ về 8,85.
  Khoá đã đổi: 34/42 (còn lại là tiêu đề, dòng đóng, `Tóm lược:`, 10.5 và 11.1 giữ nguyên theo tiền lệ).
  LỖI NGHĨA THẬT ĐÃ SỬA (khoá: trước → sau, vì sao):
    · 3.1 `Sasī adhiggayha`: `Nữ thiên cầm trăng` → `Như vầng trăng vượt trội mà tỏa sáng`. `sasī` là mặt trăng, đây là so sánh với `nakkhattarājā` ở 3.2, không có nữ thiên nào cả.
    · 2.3 `Tuvaṁsi ajjhupagatā`: `đã tiến đến nàng` → `nàng … đã đến với họ`. Bản cũ đảo chủ thể: `tvaṁ` ở chủ cách là người đến, các tiên nữ không đến nàng.
    · 4.1 `anomadassane`: giữ làm tên riêng `Anomadassana` và 4.4 dịch thành `Dị Thường Tướng` → đây là hô cách tính từ `dung mạo tuyệt hảo` (cùng gốc `anomavaṇṇaṁ` → `vẻ đẹp tuyệt hảo` ở pv37/vv84).
    · 4.3–4.4 `Brahmaṁva … sahindakā … na tappāmase dassanena taṁ`: `cả ba mươi ba vị thiên, từng hầu bên … chẳng vị nào sánh được với ngài` → so sánh với Phạm thiên, `na tappāmase` là ngôi một số nhiều `chúng tôi không chán khi nhìn nàng`; `sahindakā` = `cùng Thiên chủ` (dn18 `tāvatiṁsā sahindakā`), không phải `từng hầu bên`.
    · 5.1 `Yametaṁ sakka anupucchase mamaṁ`: `Chỗ này của ta, hỡi Sakka, ngài hỏi ta` → `Điều ngài hỏi tôi, hỡi Sakka`. `yametaṁ` = `yaṁ etaṁ` (điều mà), không phải `chỗ này`; đồng thời bỏ `ta` để người đáp là nữ thiên nói `tôi` (nhất quán 5.4, 6.x).
    · 5.3 `Bārāṇasī nāma puratthi kāsinaṁ`: `Ta vốn là người xứ Bārāṇasī` → `có một thành tên Bārāṇasī của dân xứ Kāsi` (`puratthi` = `pura atthi`; thêm nghĩa `người xứ` không có trong Pāli).
    · 6.2/7.4 `Saṅghe ca ekantagatā`: `với hội chúng, hoà nhất` → `nhất hướng nơi Tăng` (`ekantagato` → `nhất hướng` ở sn48.50, sn55.25, an6.30; `saṅghe` → `Tăng` ở vv/pv).
    · 6.3/7.5 `Akhaṇḍasikkhāpadā āgatapphalā`: `đạt quả của nền học tập không gián đoạn` (đọc sai hợp từ) → `giữ gìn học giới không sứt mẻ, đã đạt quả` (`āgataphalo` → `đã đạt quả` an6.10).
    · 6.4/7.6 `Sambodhidhamme niyatā anāmayā`: `được dẫn vào pháp giác ngộ, không lệch lạc` → `chắc chắn trong pháp giác ngộ, không bệnh` (`niyato sambodhiparāyaṇo` → `chắc chắn hướng đến giác ngộ` ở dn/mn; `anāmaya` là `không bệnh`, không phải `không lệch lạc`).
    · 7.1 `Tantyābhinandāmase svāgatañca te`: `Ta hân hoan tán thán sự đến đàng lành của ngài` → `Chúng tôi hoan hỷ với nàng, và chào mừng nàng đã đến`. `abhinandāmase` là ngôi một SỐ NHIỀU; `svāgataṁ te` → `chào mừng` (đo được ở dn17, dn26, mn77).
    · 10.2 `dīpatiladakkhiṇā dve`: `hai nữ Dâng Hạt Nành` làm mất `dīpa` (đèn) → `hai chuyện: đèn và dâng hạt mè`; `tila` là mè (mn119, sn7.10), không phải nành.
    · 10.3 `Pati dve suṇisā uttarā`: `hai vị Paṭi, hai nữ Dâu Bậc Trên` gộp `suṇisā uttarā` thành một cụm và ghi sai dấu `Paṭi` → `hai chuyện chồng, chuyện dâu, và Uttarā` (vv11/12 là `patibbatā`, vv13/14 `suṇisā`, vv15 `Uttarā`).
    · 10.4 `sirimā kesakārikā`: `những nữ thiên Kesakārī rực rỡ nhất` (đọc `sirimā` như tính từ `rực rỡ nhất`) → `Sirimā và Kesakārī` (`Sirimā` là vv16, `Kesakārī` là vv17).
    · 10.1 `Pañca pīṭhā tayo nāvā`: để nguyên Pāli `Năm Pīṭha, ba Nāvā` → `Năm cái ghế, ba chiếc thuyền` (`pīṭha` = ghế theo người biên tập; `nāvā` = thuyền, vv `Nāvāya tiṭṭhamānāya`).
  SỬA NHỎ: 1.2 `không ngừng kiên cố` → `luôn được tạo dựng khéo léo` (`sunimmitaṁ` là `khéo tạo`, không phải `kiên cố`); 1.3 bỏ `ròng` thêm vào và `vây quanh` → `bao phủ` (`otthataṁ`); 2.1 `nữ thiên` → `tiên nữ` (`accharā`, thống nhất với 3.3 và vv khác); 3.3 `ngài`/`lấp lánh ấy` → `nàng`/`này`; 3.4, 7.2 `uy nghi` → `danh tiếng` (`yasasā`); 4.2 `đã đến nơi` → `đã tái sinh vào` (`upapannā`); 5.2 `ngươi` → `nàng`, thêm `mệnh chung` (`cutā`); 5.4, 6.3 ngôi `ta` → `tôi`.
  ĐỒNG NHẤT NGÔI: Sakka (1–4, 7) xưng `tôi`/`chúng tôi` và gọi nữ thiên là `nàng`; nữ thiên (5–6) xưng `tôi` và gọi `ngài`. Chưa có bản Anh hay Việt hiện hành độc lập để đối chiếu, nên việc gán người nói 1–4 và 7 cho Sakka dựa vào chính Pāli: `ṭhānaṁ mamaṁ`, `bhavanaṁ mamaṁ idaṁ` ở 4.2 là lời người chủ cung điện, còn 5.1 gọi `sakka` là người đã hỏi.
  BẤT ĐỊNH CÒN LẠI: (a) `pubbadevatā` (2.4) — dịch sát nghĩa `nữ thiên thuở trước`; tiền lệ an4.63/iti106 là `chư thiên thuở trước`/`chư thiên cổ`, tha-ap538 `vị thiên nhân thuở trước`, nhưng ở đây chưa phân xử được đó là một so sánh (`như các nữ thiên đi trước`), một hô cách, hay một đồng vị; (b) `kesakārikā` (5.4) — tên riêng hay nghề (`người làm tóc`); giữ nguyên Pāli như tên riêng khi chưa có chứng từ; (c) `satataṁ` (1.2) — `luôn` hay `liên tục`; (d) `adhiggayha` (3.1) — chọn `vượt trội`, chưa có tiền lệ trong tầng; (e) `suṇisā` ở 10.3 có thể chỉ hai chuyện vv13–14 chia số `dve` với `pati`, giữ nghĩa sát chữ, không thêm số.
  NGOÀI PHẠM VI BÀI NÀY, GHI ĐỂ XỬ LÝ CẢ BỘ: `Itthivimāna` → `Nữ Hư Không` (0.2, 11.1) không có `ākāsa` trong Pāli, lặp ở ~51 tệp; `Pīṭhavagga` → `Phẩm Pīṭha` (0.3, lặp 17 tệp) trong khi `pīṭha` là cái ghế; `Tiladakkhiṇā` → `Người Dâng Hạt Nành` (vv10) sai vì `tila` là mè; 10.5 `phẩm ấy vì vậy được gọi tên là vậy` giữ theo tiền lệ 4/5 dù lặp nghĩa. Các tên này giữ nguyên trong bài để không lệch cả bộ.
  Lượt cải thiện 2026-10-11: điểm đổi — semantic_fidelity 9.2 → 8.6 (17 khoá sai nghĩa thật, đã sửa nhưng còn bất định); grammar_logic 9.0 → 8.8 (đọc sai hợp từ, đảo chủ thể, số ít/nhiều); terminology 9.2 → 8.6 (`ekantagata`, `akhaṇḍa…`, `yasasā`, tên uddāna lệch, tiêu đề lặp sai); triangulation 7.5 → 7.0 (không có bản đối chiếu độc lập, lỗi lọt qua chỉ bằng Pāli); vietnamese_clarity 9.2 → 8.8; han_viet_balance 9.4 → 9.2; ambiguity_integrity 8.8 → 8.4; source_provenance 9.5, segment_alignment 10.0 và technical_integrity 9.6 giữ. final_score 9,14 → 8,85 (trung bình số học thô của mười điểm). Số cặp Pāli trùng nguyên văn trong bài: 0; cổng kiểm tra nhanh của lát đạt, nhưng chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 6 chỗ bất đồng nghĩa → sửa 0, giữ 4, bất định 2. Giữ: 2.2 `Sataṁ sahassāni` (bản nguyên bài "hàng trăm ngàn"; `sata` số ít nhân `sahassa` là một trăm ngàn, và tầng Việt dùng "trăm ngàn" cho cùng cụm); 4.3–4.4 (bản nguyên bài để chư thiên Ba Mươi Ba làm chủ ngữ riêng, còn `tappāmase` là ngôi một số nhiều nên "chúng tôi" của bản dự án đúng); 6.2 và 7.4 `Saṅghe ca ekantagatā` (bản nguyên bài kéo "tịnh tín" sang cả Tăng và đọc `ekantagatā` là "dứt khoát"; thành ngữ `ekantagato` luôn đi với danh từ ở vị trí cách nơi, như sn55.25 và sn48.50, nên giữ "nhất hướng nơi Tăng"); 10.3 (bản nguyên bài thêm "hai" cho cả hai chuyện dâu; Pāli chỉ một `dve`, chữ "chuyện dâu" của bản dự án không nói số nên giữ nguyên, dù tiêu đề vv13–vv14 là hai chuyện Nữ Dâu và tổng 5+3+2+2+2+1+1+1 = 17 khớp). Bất định: 2.3 (`sakena kammunā` ở 2.2 gắn với các tiên nữ đi trước, như bản dự án, hay với nàng như bản nguyên bài "nhờ vào nghiệp của mình"; `ajjhupagatā` không có tân ngữ nên Pāli cho phép cả hai); 7.1 `Tantyābhinandāmase svāgatañca te` (`taṁ` là "nàng" như ở 4.4 `dassanena taṁ`, bản nguyên bài đọc là "việc đến tốt đẹp ấy"). Cách xưng của Sakka: bản nguyên bài dùng "ta", bản dự án giữ "tôi" theo đa số tầng vv (137 so 23). Các lỗi nghĩa mà lượt sửa trước đã bắt được ở 3.1 (`sasī` là mặt trăng), 4.1 (`anomadassane` là hô cách), 4.3–4.4 (so sánh với Phạm thiên, ngôi một số nhiều) và 5.3 (`Bārāṇasī` là thành, không phải người xứ) đều được bản nguyên bài xác nhận độc lập. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
