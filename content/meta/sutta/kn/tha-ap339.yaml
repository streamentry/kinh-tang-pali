notes: |-
  Bản dịch chỉ từ Pāli root, đối chiếu tiền lệ tầng Việt của chính dự án (tha-ap), vì commit đã ghim không có bản Anh upstream (giới hạn upstream, không phải lỗi người dịch).
  Số Pāli: ekāhaṁ = một ngày; Tidaṇḍake = ba cây cột (ti = 3); sahassakaṇḍaṁ = nghìn tấm vách, satabheṇḍu = trăm ngọn tháp; satasahassa-niyyūhā = một trăm ngàn ban công (sata 100 × sahassa 1.000 = 100.000, sata và sahassa ở dạng ghép nên không nhân nhau, theo tiền lệ Kappānaṁ satasahassaṁ là một trăm ngàn); tāvatiṁsa = Ba mươi ba; Ekanavutito = eka 1 + navuti 90 = chín mươi mốt (86 khoá tầng đã viết chín mươi mốt); catasso = bốn.
  Bất định đã nêu, không bịa: (1) 1.4 `parabhattaṁ apassito` — apassita hiểu là nương tựa, dựa vào (cùng cấu tạo với `sakakammaṁ apassito` ở tha-ap52:10.4 và `tapokammamapassito` ở tha-ap431:1.4), nên dịch là sống nương nhờ cơm của người; cách hiểu phủ định (không nương nhờ cơm người khác) không loại trừ hẳn. Cùng cặp Pāli `Parakammāyane yutto, parabhattaṁ apassito` đã có ở tha-ap321:1.3-1.4, được dịch là chăm lo nghề làm ruộng, chưa từng thấy ai đem đến; hai chỗ đó không bám Pāli (ruộng không có trong gốc, apassito bị đọc như passati phủ định) nên không dùng lại, và nên được người biên tập xem lại. (2) 2.4 `adhikāro` dịch là việc phụng sự (việc làm cúng dường Phật); tiền lệ trong tầng chỉ có nghĩa quyền hành, chức vụ ở văn xuôi Milinda, không hợp ngữ cảnh. (3) 3.2 `khaṇo me paṭipādito` dịch cơ hội đã được đem đến cho tôi. (4) 4.2 và 6.4 `kammasāmiṁ` dịch ông chủ thuê (chủ của công việc). (5) 4.3 `Ekāhaṁ kammaṁ yācitvā` có hai cách hiểu: xin nghỉ việc một ngày, hoặc xin một ngày làm việc cho riêng mình; bản dịch giữ sát chữ là xin một ngày làm việc và không chốt, 6.3-6.4 cho thấy người này trong ngày ấy trở về gặp chủ. (6) 5.3 `Tidaṇḍake` hiểu là ba cây cột (cũng có thể là giá ba chân); tiền lệ trong tầng là 0. (7) 6.2 `niyyādetvāna` dịch dâng cúng; tiền lệ duy nhất (tha-ap, Niyyādetvāna sambuddhe là sau khi hộ trì chứng ngộ) lệch khỏi gốc nên không dùng. (8) 7.4 `kuṭikāya sunimmitaṁ` hiểu là được hóa hiện tuyệt đẹp nhờ túp lều, còn 8.1-8.2 (accusative sahassakaṇḍaṁ…haritāmayaṁ) hiểu là mô tả thiên cung, 8.3-8.4 các niyyūha hiện ra trong thiên cung. (9) 8.3 `niyyūhā` dịch ban công (pinnacle, turret, balcony); tiền lệ trong tầng là 0 và nghĩa kiến trúc chính xác chưa chốt được. (10) 9.4 `pāsādo upatiṭṭhati` dịch lâu đài hiện đến bên tôi. (11) 10.3 `Tāsaṁ mama na jānāmi` hiểu tāsa là nỗi hoảng sợ, không phải đại từ. (12) 12.1 `bhūtā` dịch quỷ thần theo tiền lệ Passanti vanabhūtāni; cũng có thể là sinh linh. (13) 14.3-14.4 `Gotamassa bhagavato, dhammaṁ sacchikariṁ ahaṁ` giữ thứ tự và tách khoá theo Pāli (của Đức Thế Tôn Gotama, tôi đã chứng ngộ Pháp), không thêm trong giáo pháp. Cùng cặp này còn ở tha-ap342:11.3-11.4 và 8.1-8.4 còn ở tha-ap503:10 và tha-ap558:10, chưa dịch tại thời điểm làm bài này; cần đối chiếu khi các bài ấy được dịch.
  Tiền lệ đã đo trong tầng: Nagare bandhumatiyā là tại kinh thành Bandhumatī (10 trên 12); Tena kammena sukatena là nhờ nghiệp lành khéo làm ấy (14 trên 16); Yaṁ yaṁ yonupapajjāmi là dù sinh vào cảnh giới nào (9 trên 13); mama saṅkappamaññāya là nhờ thấu rõ ý định của tôi (17 trên 21 với đại từ ta và tôi gộp); Ekanavutito kappe là vào chín mươi mốt kiếp trước (36) so với từ chín mươi mốt kiếp trước (38) — giữ dạng vào theo hai tệp liền kề tha-ap335 và tha-ap337; Duggatiṁ nābhijānāmi với ngôi tôi là đọa xứ (81) so với khổ xứ (51); Paṭisambhidā catasso là bốn vô ngại giải (448); …pe… giữ một dấu lược (704); công thức kết Itthaṁ sudaṁ dùng nhóm số nhiều những bài kệ này (407) chứ không dùng nhóm số ít (21); Sahassakaṇḍo satabheṇḍu là nghìn tấm vách, trăm ngọn tháp (hai tệp tha-ap350 và tha-ap523) và dhajālu haritāmayo là cờ hiệu trang điểm, làm bằng vàng xanh. Pāli trùng nguyên văn trong tầng đã dò 21 khoá, dùng lại nguyên văn bản Việt cho 14 khoá, 7 khoá khác bản đã có (1.3, 1.4, 2.2, 7.2, 7.3, 14.2, 14.3) vì bản đã có sai hoặc khác ngôi/khác ngữ cảnh. Trong bài có một nhóm Pāli trùng nguyên văn (10.4, 11.4, 12.4, 13.4, 15.4: tiṇakuṭikāyidaṁ phalaṁ), dịch giống hệt nhau; không có cặp trùng nào mà Việt khác. Dấu lược: 16.2 Pāli …pe… giữ một dấu …; không có (…) trần. Nháy kép khớp Pāli từng khoá (mở ở 1.1, đóng ở 16.3), không có nháy đơn.
  Tên phiên: `:0.3` Pāli (Tiṇakuṭidāyakattheraapadāna) không bắt đầu bằng số nên không có số thứ tự, translationTitle bằng đúng giá trị `:0.3`. Cách viết Tuyên Ngôn chọn theo hai tệp liền kề đã sửa chính tả (tha-ap335, tha-ap337), không dùng dạng Tuyên Ngợ: đo trong phạm vi tha-ap300 đến tha-ap380 thì Tuyên Ngợ 49 (và Tuyên Ngợi 2, chưa tính các tệp có số đầu), Ký Sự 9, Tuyên Ngôn 8; toàn tầng Tuyên Ngợ 220, Tuyên Ngôn 105, Ký Sự 99 — hai phạm vi phân kỳ về cách viết, người biên tập cần phán một lượt cho cả cuốn. Tên phẩm Gandhodakavagga dịch Phẩm Gandhodaka theo ba tệp liền kề.
  Chưa chạy được các cổng của kho trong lượt này: npm run validate, npm test, npm run check, npm run build; technical_integrity 9.6. Status bắt buộc draft do blocker tầng tham khảo Anh.
