notes: |-
  Dịch từ Pāli root của tha-ap407 (251 khoá, thứ tự khoá như Pāli, không có khoá ngoài Pāli). Không có bản Anh Sujato, không có bản Việt hiện hành ở tầng store, không có lớp lấp english-project. Trang Việt không phân đoạn của kho sc-data (mục Tra cứu toàn văn, Bhikkhu Indacanda, giấy phép NOASSERTION) chỉ được đọc để kiểm cách hiểu một số từ khó; đó không phải tầng store, không căn lề theo khoá, và không có câu nào được chép từ đó. Status bắt buộc draft do blocker noEnglishEditionUpstream.

  Tên bài (:0.3): Pāli 5 Upasivattheraapadāna bắt đầu bằng số nên bản Việt giữ số theo hình thức N. ; translationTitle bằng đúng giá trị khoá :0.3 (5. Ký Sự Về Trưởng Lão Upasiva). Đo trên 556 tệp tha-ap đã có bản Việt: Pāli có số và Việt có số 164, không có số cả hai 392, Việt có số mà Pāli không có 0. Kiểu tên: toàn tầng Tuyên Ngợ (chính tả đáng ngờ) 255, Ký Sự 154, Tuyên Ngôn 140, khác 7; phạm vi gần nhất tha-ap395–420 Ký Sự 25 trên 25; phẩm Metteyya (9 tệp đã có) Ký Sự 9 trên 9. Hai phạm vi cho hai đa số khác nhau; chọn Ký Sự theo phạm vi gần nhất và theo cùng phẩm, khớp với lời kết 63.1. Đề nghị người biên tập phán một lượt cho cả cuốn. Tên riêng giữ dạng Pāli Upasiva theo Pāli của bài.

  :0.1 Therāpadāna giữ nguyên Pāli (490 trên 501 khoá cùng Pāli). :0.2 Metteyyavagga dịch Phẩm Metteyya theo tiền lệ cùng phẩm (2 khoá cùng Pāli, cả hai Phẩm Metteyya).

  Số Pāli, tự tính: 53.1 Tiṁsakappasahassāni = tiṁsa 30 × sahassa 1000 = ba mươi ngàn kiếp (thời lượng sẽ vui chơi ở cõi trời; tiṁsa là ba mươi, không phải ba; tha-ap396:8.3 Tiṁsa kappasahassāni cũng dịch ba mươi ngàn kiếp; 12 khoá cùng Pāli: ba mươi ngàn 6, ba mươi nghìn 6; toàn tầng tha-ap dùng ngàn 363 khoá, nghìn 64 khoá nên chọn ngàn); 53.3 sahassakkhattuṁ = một ngàn lần; 54.1 ekasattati = eka 1 + sattati 70 = 71 (bảy mươi mốt; 2 khoá cùng Pāli đã dịch bảy mươi mốt lần, 1 khoá dịch sai thành bảy món báu nên không theo); 55.1 kappasatasahassa = sata 100 × sahassa 1000 = một trăm ngàn kiếp, dịch theo lời thọ ký tương lai là Sau một trăm ngàn kiếp nữa (7 khoá cùng Pāli dịch đúng chữ này; 5 khoá Sau một trăm nghìn kiếp, 5 khoá Vào một trăm ngàn kiếp nữa); 7.4 aḍḍhayojana = nửa do-tuần; 33.1 yugamatta = một tầm cày (theo tha-ap484 Nhìn phía trước một tầm cày); 57.3 tisso vijjā = ba minh; 61.1 catasso = bốn; 63.1 pañcamaṁ = thứ năm (số 5 ở :0.3 giữ theo Pāli). Bài không có thang lớn nào khác.

  Dùng lại tiền lệ nguyên văn: 62 khoá Pāli trùng một khoá khác của tầng kn; 56 khoá bản Việt dùng đúng chữ của một bản dịch tiền lệ; 6 khoá khác (10.4, 14.2, 43.1, 46.1, 53.1, 55.1), đều có lý do: 10.4 bỏ ngọt lành vì Pāli phārusakaphalāni ca không có; 14.2 không theo cây bàng cũng chín, cả cây mít nữa (1 khoá, thêm chữ cũng chín không có trong Pāli) mà dịch cây đa và cây kapitthana; 43.1 và 46.1 để câu liền mạch với khoá kế (danh từ panasaṁ nằm ở 46.2); 53.1 ngàn thay nghìn như đo ở trên; 55.1 theo chỉ dẫn lời thọ ký sau … kiếp nữa. Trong chính bài có 12 nhóm Pāli trùng (19 cặp): 3.1=23.3, 3.3=24.1, 9.3=20.3, 18.4=20.4, 42.1=48.1, 42.2=48.2, 50.1=58.1, 50.2=58.2, 57.4=60.3, 8.6=15.4, và bốn khoá vasanti mama assame (29.4, 31.4, 32.6, 33.4); 0 cặp mà bản Việt khác. 3.2 và 23.4 chỉ khác dấu cuối khoá nên bản Việt chỉ khác dấu cuối.

  Ngôi kể và thuật ngữ, có đếm: dùng ta (tha-ap404 cùng phẩm và đa số công thức chung): Kilesā jhāpitā mayhaṁ ta 134, tôi 56, con 3; viharāmi anāsavo ta 149, tôi 64, con 2; Svāgataṁ vata me āsi ta 134, tôi 49, con 3. Lời Đức Padumuttara (49–56) viết Ta hoa theo tha-ap396. Lời kết 62.1: nhóm những bài kệ này (551 khoá) so với bài kệ này số ít (2 khoá). 54.3 Padesarajjaṁ vipulaṁ = Vương quyền cai quản các vùng đất rộng lớn (toàn tầng 29, so với Vương quốc rộng lớn ấy 15; phạm vi gần tha-ap395–430: 13 so với 3). 50.1 và 58.1 Gāme vā yadi vāraññe giữ Dù ở trong làng mạc hay trong rừng sâu theo đa số 3 trên 4 khoá dù chữ sâu không có trong Pāli. 42.1/48.1 Padumuttaro lokavidū = Đức Padumuttara, bậc hiểu rõ thế giới (16 trên 17 khoá). vināyaka = bậc Điều Ngự (tha-ap396:4.4). nipako = khôn ngoan; ātāpī nipako = nhiệt tâm, cẩn trọng (tha-ap12). acchakokataracchakā = gấu, chó sói, linh cẩu (tha-ap339). kamaṇḍaludharā = mang theo bình nước (tha-ap484). ajinuttaravāsanā = đắp y bằng da linh dương (tha-ap294, tha-ap87). Harītakā āmalakā = chiêu liêu, me rừng; ambajambuvibhītakā = xoài, mận, bàng hôi; Kolā bhallātakā billā = táo gai, đào lộn hột, ba-la (tha-ap284, tha-ap440). Tên cây và thú không có tiền lệ rõ giữ dạng Pāli (hoa mandālaka theo ja494; ketaka, bandhujīva, campaka, kuṭaja theo tha-ap).

  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 61.3, mở nháy đơn ở 49.1 và đóng ở 56.5, cố ý chạy qua khoá; đối chiếu từng khoá cho 0 lệch trên 251 khoá (nháy kép và nháy đơn đều khớp Pāli). Pāli không dùng ti. Dấu lược: ba khoá …pe… (59.2, 60.2, 61.2) đều là đúng một dấu …; khoá 56.3 Pāli là (…) nên bản Việt giữ nguyên (…), không mở rộng; không có dấu lược trần nào khác.

  BẤT ĐỊNH, để người biên tập phán, không thêm vào thân kinh:
  1. Tên thực vật và động vật hiếm (khoảng 50 từ) giữ dạng Pāli vì tầng không có tiền lệ đủ chắc: 4.2 khuddamālaka; 5.2 tiṇasūla; 6.x ajjuna, atimutta, mahānāma, madhugandhī; 7.x pāṭalikā, piyaṅguka, bimbijālaka; 8.x mātaggāra, sattali, sinduvāraka, aṅkolaka, tālakuṭṭhi, seleyyaka; 11.x labuja; 12.x ambāṭaka (tầng có hai cách: ambāṭaka và cóc rừng), sapāriya; 14.2 kapitthana; 14.4 kaṇḍupaṇṇa, hariya; 16.3 ālaka, tālaka; 21.1–2 ambagandhi, nayita; 22.2 setavārī; 24.2 papaṭaka; 24.3 ravihaṁsa; 25.x dindibha, pampaka, kalandaka, ukkusa, uddhara; 26.x koṭṭhaka, tuliya, camara, kāreniya, tilaka; 29.3 aggika, jotika; 30.3 majjārika (có thể là tên chim, không dịch mèo); 30.4 poṭṭhasīsaka.
  2. 4.3 Punnāgā giripunnāgā dịch mù u, mù u núi theo tha-ap161 (Punnāgapupphiya, hoa mù u); một số bản đọc khác là nguyệt quế.
  3. 2.3 Anūpatitthe: anūpa chỉ vùng nước ven bờ; dịch bến nước ven bờ.
  4. 3.2 và 23.4 muñjarohitā là một từ ghép; dịch tách cá muñja, cá rohita (tách hay không đều có thể đọc được).
  5. 13.3 avaṭā pakkabharitā: không rõ là tên hay tính từ; đọc là tính từ, dịch phủ kín, trĩu nặng quả chín.
  6. 19.2 kesarī dịch có tua nhụy; 19.3 opupphapattā dịch cánh hoa rũ xuống.
  7. 22.3–4 kumbhilā susumārā gahakā: ba loài thuộc nhóm cá sấu; dịch cá sấu kumbhila, cá sấu susumāra, và để gahaka nguyên dạng.
  8. 23.1 uggāhakā ajagarā: uggāhaka dịch săn mồi (tính từ), ajagara dịch trăn.
  9. 29.2 pasadā khuddarūpakā: có thể đọc nai đốm nhỏ bé hoặc nai đốm và những loài nhỏ bé; chọn cách sau.
  10. 34.3 sabalehi upatthaddhā: sa-bala dịch chính sức mạnh của mình, đồng nghĩa với sakaṁ balaṁ ở 37.4.
  11. 35.3 sayañca upasampannā dịch tự thân đều đầy đủ; Pāli không nói thứ gì đầy đủ (mạch trước là nước và củi).
  12. 36.1 lohadoṇi dịch chiếc máng sắt (loha có thể là sắt hay kim loại nói chung).
  13. 38.3–4 sabbesaṁ pakkamantānaṁ uggatejāna tādinaṁ: sở hữu cách đứng độc lập, dịch Khi tất cả cùng ra đi, những bậc uy lực rực rỡ, bất động như vậy.
  14. 39.3 Edisā te mahāvīra: te có thể là đại từ chỉ họ hay đại từ ngôi hai; dịch hỡi bậc Đại Anh Hùng và không thêm đại từ ngôi hai. Giọng người kể chuyển sang nói với Đức Phật ở 39–41 nhưng vẫn giữ ngôi ta cho cả bài.
  15. 44.2 jalajuttamanāyakaṁ dịch bậc Dẫn Đạo tối thượng tựa hồng sen theo tiền lệ jalajuttamanāmako (tha-ap336, tha-ap337, tha-ap343); đây có thể là một danh hiệu của Đức Padumuttara.
  16. 50.2 và 58.2 pabbhāra dịch hang núi, guhā dịch hang động; tầng dịch pabbhāra là hang đá hoặc hang núi (4 chỗ), nên hai chữ này gần nghĩa nhau.
  17. 47.2 anulimpahaṁ (thoa trầm hương): Pāli không nêu đối tượng được thoa, bản Việt không thêm.
  18. 51.2 upapanno ayaṁ naro dịch người này được tái sinh (quá khứ phân từ trong lời thọ ký tổng quát).

