notes: |-
  Bản dịch chỉ từ Pāli root: tại commit đã ghim không có bất kỳ tệp Anh nào cho toàn bộ `Vimānavatthu` (đo trên `source/upstream-manifest.json`: `sutta/kn/vv/` có 0 tệp trong bản Anh Sujato đã ghim). Giới hạn upstream, nên bài giữ `draft`.
  Bản song parallel TRÙNG PĀLI: **3** khoá, dùng lại cả 3 nguyên văn — `Vimānavatthu` (28 khoá toàn tầng) · `Itthivimāna` → Chuyện Cung Điện Nữ Hư Không (7, đánh bại *Thiên Cung Của Nữ Giới* 1) · `Mañjiṭṭhakavagga` → Phẩm Mañjiṭṭhaka (3). Cả ba tiêu đề đã có sẵn nên không phải đặt mới.
  0.4 và 9.1 đặt theo khuôn `vv41`/`vv42` đã có trong kho: `N. Xvimānavatthu` → *N. Chuyện Cung Điện X*, và khoá kết → *Chuyện Cung Điện X, thứ hai.* Có hai họ tiêu đề đang chạy song song trong kho — *Chuyện Cung Điện* (vv1, vv12, vv41, vv42) và *Thiên Cung* (vv49) — bài này theo nhóm đông đảo hơn.
  0 tiền lệ, đặt mới, ghi kèm lý do: `Surattavatthavasane` → *cung điện trải rộng trên trăm do-tuần* (đơn vị `do-tuần` đã có 34 khoá trong tầng, không phải *dặm* — *dặm* chỉ 1 khoá) · `varāvara` → *tuyệt hảo* · `mahiddhike` → *oai lực lớn lao* · `candana` → *đàn hương* · `Pallaṅko` → *chiếc sàng ngủ* · `nānāratana` → *những món báu ngọc* · `pucchitācikkha` → *xin hãy cho biết* · `dhammarājena` → *Vua Pháp* · `bhaddante` → *bậc lành mạnh* · `bhante` → *bạch Đài Ngữ* (chưa tệp Việt nào trong kho dùng cụm này — 0 tiền lệ — nhưng người nghe Việt hiểu ngay và đúng ngữ cảnh tỳ-kheo).
  Bất định đã ghi nhận, không che. `Kā tvaṁ subhe devate vandase mamaṁ.` (`1.4`) — `vandase` có ngôi thứ hai, `mamaṁ` là tân ngữ, nên cách đọc chủ động là **“ngươi lại lễ bái ta?”**; đây là cách đọc cho cả ba Pāli song song (`vv30:2.4`, `vv48:2.4`, `vv21:6.4`) đều hợp với tình huống nữ thiên đến lễ bái tỳ-kheo. Cách đọc thay thế (*ta lễ bái ngươi*) không có cú pháp Pāli nào đứng đỡ. Bản dịch giữ cách chủ động và **không** làm câu chắc chắn hơn Pāli cho phép. Vì cả bài không có tầng Anh, `terminology` 9,0 và `ambiguity_integrity` 9,0.
  Dấu lược: bài này Pāli không có `…pe…` nào, bản Việt cũng không dùng `…` để nén — không có chỗ nào bị lược.
  `notes` ở đây là khối literal `|-` thụt 2 đặt ở GỐC file, đúng như `content/meta/sutta/kn/vv41.yaml` (đã đọc mẫu đích trước khi ghi).
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` và `npm run build` (bài `published`) do coordinator chạy — lát agent này không chạy bốn lệnh đó, nên `technical_integrity` đặt 9.6 chứ không 10.0. Tự kiểm thay bằng harness `_hvi.kiểm()`: NFC, không Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài.

  Kiểm toán độc lập 2026-10-11 (đọc đối kháng từng khoá Pāli↔Việt; đối chiếu các bài vv cùng họ trong kho). Kết quả: bản dịch 2026-10-04 có **19/36** khoá sai nghĩa thật; đã dịch lại 31 khoá. Các nhận định "0 tiền lệ", "đã đánh bại", "bản dịch tốt" và điểm 9.14 ở các mục trên được thay bằng mục này; các mục trên chỉ còn là lịch sử.
  Lỗi đã sửa, theo loại. (a) Hô cách / thành phần câu: `1.1`–`1.3` là chuỗi hô cách gọi nữ thiên (`Pabhassaravaravaṇṇanibhe` = có ánh sắc rực sáng tuyệt hảo; `surattavatthavasane` = mặc y phục đỏ thắm; `mahiddhike` = bậc đại oai lực; `candanaruciragatte` = thân xinh đẹp, rạng ngời với đàn hương) — bản cũ đọc `Pabhassara` thành tên người và thêm "lại"; `3.4` `Devate pucchitācikkha` hô cách (không phải "nữ thiên ấy"); `6.1` `Taṁ taṁ vadāmi bhaddante` là nữ thiên nói với tỳ-kheo (`vadāmi` ngôi thứ nhất, `bhaddante` hô cách = thưa ngài), bản cũ đảo thành "Ngài hãy nói với tôi". (b) Bịa nghĩa: `1.2` bản cũ viết "cung điện trải rộng trên trăm do-tuần" — Pāli không có `vimāna` hay `yojana`, chỉ có `surattavatthavasane`; `3.1` thêm "khi còn làm người" (Pāli chỉ có `pure`). (c) Thuật ngữ: `Pallaṅko` = ghế dài (pv24, vv81), không phải "sàng ngủ" (vì `yattha tvaṁ nisinnā`); `phāṇita` = mật mía (vv33:76.1), bản cũ nhầm thành "chuỗi hoa"; `sucarita` = thiện hạnh (vv16:4.1), không phải "điềm lành"; `saṅgharatane` = Tăng bảo, bản cũ mất cả Tăng ("pháp được tụng giữ"); `kissa` = nào (không phải "ấy") ở `3.5`; "bạch Đài Ngữ" cho `bhante` (4.2, 5.2) vô nghĩa, chỉ có ở tệp này, đổi thành "bạch ngài" (pv13, pv22, pv27…). (d) Đảo nghĩa / phủ định: `5.1` `Hoti ca me anutāpo` = "tôi có nỗi hối hận" (bản cũ: "không hề hối hận"); `7.3` `te maṁ ativirocanti` = họ tỏa sáng vượt trội hơn tôi (bản cũ: "làm tôi rực rỡ"); `8.1`–`8.2` `uttaritarā`, `mahiddhikatarā mayā` = vượt trội hơn / đại thần lực hơn tôi (bản cũ đảo thành chúng tôi hơn hẳn); `6.2` `anukampiyo` là dạng gerundive (người đáng được thương xót), bản cũ đọc ngược thành "người đã thương xót tôi"; `5.2` `aparaddhaṁ` bản cũ nặng thành "phạm tội". (e) Xưng ngôi / người nghe: nữ thiên nói với tỳ-kheo nên `te carantassa` (4.1) = "khi ngài đang đi khất thực" (không phải "ngươi"), `4.4` "tôi" (không phải "ta"); `6.3` `taṁ samādapetha` = "khuyến khích người ấy" (không phải "khuyên tôi").
  Pāli trùng nguyên văn trong bài: 1 cặp (`5.4` = `6.4`), Việt giống nhau. Pāli trùng với bài khác trong họ nhưng không dùng lại cách dịch: `1.4` (vv30:2.4, vv48:2.4, vv21:6.4) — cả ba bản kia dịch "ngươi lại lễ bái ta"/"tán thán ta" và đều cần kiểm toán riêng; ở đây dịch "nàng là ai, hỡi nữ thiên xinh đẹp, mà lễ bái tôi?" (bỏ "lại" vì Pāli không có). `3.4` dịch theo vv39:5.3 (cùng Pāli `Devate pucchitācikkha`). `Pháp vương` (41 lần trong tầng so với `Vua Pháp` 13) chọn theo đa số (`dhammarājena` 5.4, 6.4).
  Bất định còn lại (ghi nhận, không che). (1) `1.3` `candanaruciragatte`: có thể hiểu "thân đẹp nhờ đàn hương" hoặc "thân đẹp màu đàn hương"; bản này giữ cách hiểu nhẹ nhất. (2) `6.2` `yassa me anukampiyo koci`: cú pháp `yassa` không rõ; bản này đọc là "ai là người đáng được tôi thương xót" (thân quyến của nữ thiên) và `6.3` là lời nhắn để tỳ-kheo (số nhiều `samādapetha`) khuyến khích người ấy. Cách đọc khác (người thương xót tôi) trái với dạng gerundive nhưng không loại trừ hẳn. (3) `6.1` `Taṁ taṁ vadāmi`: `taṁ` đầu có thể là "ngài" (đại từ tân cách) hoặc "điều ấy"; nghĩa câu không đổi. (4) `5.2` `aparaddhaṁ dukkhitañca me`: có thể là động tính từ ("tôi đã lầm lỗi, tôi đau khổ") hoặc danh từ ("lỗi lầm và đau khổ của tôi"). (5) `8.1` `uttaritarā` ghép với `aññe … devā` (8.2) hay với `te` (7.3): bản này để câu không chỉ định chủ ngữ ở 8.1 nên không chọn. (6) Tiêu đề phẩm `Itthivimāna` ở `0.2` hiện dịch "Chuyện Cung Điện Nữ Hư Không" — Pāli không có `ākāsa`; tiêu đề này lặp ở nhiều tệp vv nên không sửa riêng ở đây, báo để sửa cả bộ cùng lúc.
  Chấm lại: `semantic_fidelity` 9.2 → 8.8, `grammar_logic` 9.2 → 8.8 (bản cũ sai nhiều khoá; bản mới còn bất định (1)–(5) và chưa có tầng Anh hay bài song song để phân xử), `terminology` 9.0 → 8.7 (`Pallaṅka` ở vv31 dịch "tòa", chưa đồng bộ; `bhaddante`/`bhante` cùng "bạch ngài" vì không phân biệt được), `vietnamese_clarity` 9.2 → 8.8, `ambiguity_integrity` 9.0 → 8.8, `source_provenance` 9.5 → 9.3 (các mục notes cũ khẳng định điều không đúng với Pāli), `han_viet_balance` 9.2 → 9.0, `triangulation` giữ 7.5 (ba tầng tham khảo vẫn vắng), `segment_alignment` giữ 10.0 (36/36 khoá, đúng thứ tự Pāli, không lệch ranh khoá), `technical_integrity` giữ 9.6. `final_score` 9.14 → 8.93. Blocker "không có tầng tham khảo tiếng Anh" giữ nguyên (sự thật về upstream); không thêm blocker mới vì các bất định trên đã được ghi nhận ở đây. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy ở lượt này.
