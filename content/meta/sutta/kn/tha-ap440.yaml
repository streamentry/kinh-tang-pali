  TÊN PHẨM `:0.3` — đo lại trên 341 bài `tha-ap` đã có `:0.3`: KEEP số thứ tự 66 / DROP 275.
  Ngược với 62/49 của lát trước, nên theo phép đo của lát này: BỎ số thứ tự. Mẫu câu đủ ba
  hướng đã đo: *Bài Kệ Tuyên Ngợ Về Trưởng Lão* 192/341, *Ký Sự Về Trưởng Lão* 84/341,
  *Bài Kệ Tuyên Ngôn Về Trưởng Lão* 65/341. Phẩm cục bộ của bài này là *Phẩm Sống Một
  Mình* (`Ekavihārivagga`), đo được *Tuyên Ngợ* 6/6 — cùng hướng với đa số toàn tầng, nên
  `:0.3` và `:14.1` cùng dùng *Bài Kệ Tuyên Ngợ Về Trưởng Lão*.

  `:0.1` `Therāpadāna` giữ nguyên Pāli: 332/341. `:0.2` *Phẩm Sống Một Mình* 6/7 trong
  chính phẩm (lựa chọn này thay cho *Phẩm Sống Độc Cư* 1/7).

  DẢI TRÁI CÂY — dùng lại nguyên văn có sẵn, nhưng hai chỗ đáng ngờ, xin người điều phối
  xem lại. `Harītakaṁ āmalakaṁ`, `ambajambuvibhītakaṁ`, `Kolaṁ bhallātakaṁ billaṁ` trùng
  nguyên văn với `tha-ap284:2.1–2.3`, đã có bản Việt: *Trái chiêu liêu và trái me rừng* /
  *xoài, mận, và trái bàng hôi* / *Táo gai, đào lộn hột, trái ba-la*. Tôi giữ nguyên văn đó
  vì cùng Pāli phải dịch nhất quán, nhưng hai từ `vibhītaka` (trái bàng hôi) và `bhallātaka`
  (đào lộn hột) không có tiền lệ nào khác trong 3.359 bài Việt và cũng không có bản Anh đã
  ghim để đối chiếu, nên tôi KHÔNG khẳng định hai nghĩa ấy là đúng.

  TIỀN LỆ còn lại: `sayambhussa adāsahaṁ` 1; `Idaṁ vatvāna sambuddho` 1; `sayambhū
  aparājito` 4/11; `haṁsarājāva ambare` 1; `Ayaṁ pacchimako mayhaṁ` 1; `Tisso vijjā
  sacchikatā` 1; `Catunnavutito kappe` 26/81. Ba khối kệ chung cho cả bốn bài `tha-ap` của
  lát: `Kilesā jhāpitā mayhaṁ` 69; `viharāmi anāsavo` 68; `Svāgataṁ vata me āsi` 67;
  `kataṁ buddhassa sāsanaṁ` 81; `Paṭisambhidā catasso` 341; `Duggatiṁ nābhijānāmi` 110/315.

  BẤT ĐỊNH đã ghi, không giấu:
  1. `carimo vattate bhavo` — 2/2 tiền lệ dịch *của Ngài*, nhưng vế trước là `Ayaṁ pacchimako
     mayhaṁ` = *của ta* và người kệ nói về chính mình. Tôi giữ *của ta* để không tự mâu
     thuẫn trong một câu kệ.
  2. `6.1` `sambuddho` và `6.2` `sayambhū` đều là *Tự Chứng*; tách thành *bậc Tự Tại Giác* /
     *Đấng Tự Chứng* để tránh lặp, theo đúng tiền lệ của hai Pāli này.
  3. `Khādamattamhi bhesajje` — đọc là *dù chỉ lấy thức ăn làm thuốc*, nên câu kệ là lời ngợi
     khen việc trị bệnh chỉ bằng thức ăn. Không có tiền lệ cho Pāli này.
  4. `Harāmahā` ở `:1.4` dịch *tự ăn lấy*; không có tiền lệ.

  DẤU LƯỢC: Pāli có `…pe…` ở `:10.2`, `:11.2`, `:12.2`; bản Việt giữ **đúng một** `…` mỗi khoá.
  Ngoặc cong đơn `‘…’` mở ở `:4.3` và đóng ở `:5.4`, đúng như Pāli. 50/50 khoá đã dịch.

