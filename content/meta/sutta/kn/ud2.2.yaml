notes: |-
  Giải quyết draft 2026-10-12: đọc đối kháng 22/22 khoá với Pāli, bản Anh Sujato và tiền lệ trong kho.
  Blocker cũ (cắt ngắm tại ud2.2:3.2, 2026-09-13) là tồn dư: bản dịch hiện hành không còn dấu lược `…` nào (0/22 khoá), khoá 3.2 dịch đủ toàn bộ câu hỏi của 1.4 (Pāli 3.2 trùng 1.4, bản Việt trùng khớp). Đã gỡ.
  Sửa 7/22 khoá (ud2.2:1.4, 2.3, 3.2, 4.1, 4.2, 6.3, 6.4): (1) 6.3/6.4 — bản cũ đảo vế qua ranh giới khoá: Pāli 6.3 là `taṇhakkhayasukhassete` (những điều ấy, so với an lạc do tham ái đoạn diệt) còn `kalaṁ nāgghanti soḷasiṁ` ở 6.4; bản cũ để "không đáng một phần mười sáu" ở 6.3 và "của an lạc…" ở 6.4. Nay 6.3 = "cả hai điều ấy, so với an lạc do tham ái đoạn diệt," và 6.4 = "không đáng một phần mười sáu." (khớp pe2:172 và ne37:345, nơi cùng kệ). `ete` chỉ hai thứ (lạc dục ở đời, lạc cõi trời) nên dùng "cả hai điều ấy", bỏ "tất cả cũng". (2) 1.4/3.2 — `mahiddhikataro` nói về vua: "nhiều thần thông hơn" gợi thần thông siêu nhiên, sai ngữ cảnh; đổi "nhiều thế lực hơn" (iddhi = uy thế; Sujato "might"); `mahānubhāvataro` giữ "oai lực" (123 khoá). Tiền lệ "thần thông" cho mahiddhika là 95 khoá, đa số ở ngữ cảnh chư thiên/A-la-hán, không áp cho vua. (3) 2.3 — thêm "vừa rồi" cho `etarahi` (tiền lệ dn1:1.4.2, dn9, dn14, dn25). (4) 2.3, 4.1, 4.2 — "các ngươi" đổi "các ông" cho `vo/tumhe` khi Phật nói với tỳ-kheo (đa số 406 khoá "các ông" so với 45 "các ngươi" trên các câu có bhikkhave + vo/tumhe; 157 "các thầy"); lưu ý các bài anh em ud3.8, ud3.9 còn "các ngươi".
  Giữ nguyên có chủ ý: 5.1 "sau khi thắng tri ý nghĩa ấy" cho `etamatthaṁ viditvā` là quy ước tầng (78/87 khoá dùng "thắng tri"; 9 khoá "biết rõ/hiểu rõ"); `viditvā` sát nghĩa hơn là "biết rõ" — bất định về quy ước chung, ngoài phạm vi bài này. `upaṭṭhānasālā` = "giảng đường" (24 khoá; "nhà hội chúng" 11 khoá). `kāmasukha` = "lạc thú giác quan" (pe2:172, 207). Số: `soḷasi` = một phần mười sáu (16), không có số lớn khác trong bài.
  Coverage English: mẫu số 12 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0); Sujato phủ 10/12 (0,83 ≥ 0,80). Sujato để trống 3.2 và 3.3 (tóm lược ở 3.1 "the mendicants told him…"), đã đọc từ Pāli: 3.2 trùng nguyên văn 1.4 (bản Việt dùng lại đúng câu hỏi), 3.3 là `ayaṁ kho no, bhante, antarākathā vippakatā, atha bhagavā anuppatto` (tiền lệ dn1:1.4.9, dn14:1.14.13, mn123:2.17), nên tự đứng vững từ Pāli; triangulation 8,8 (không cao hơn vì thiếu tầng Việt hiện hành và hai khoá không có Sujato). Tầng `vietnamese-current` chỉ có Pháp Cú tại commit đã ghim — giới hạn tham chiếu, không phải lỗi văn bản.
  Kiểm tra: 22/22 khoá khớp Pāli, thứ tự khoá đúng, nháy đơn/kép khớp Pāli, không có `…` nào, không có chữ Pāli lọt vào bản dịch ngoài tên riêng.
  Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này; technical_integrity đặt 9,6.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud2.2:5.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

