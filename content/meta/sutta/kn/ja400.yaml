  **Nguồn.** `ja400` = `5. Dabbhapupphajātaka` (Kukkuvagga 5, Bộ Bảy Bài Kệ), 47 khoá, đủ 47
  khoá đã dịch. Pāli ghim `root/pli/ms/sutta/kn/ja/ja400_root-pli-ms.json`; commit đã ghim
  `11c9d708978cde8ba61096d8a75f7ddfb846f639`.

  **Tên phẩm, đo lại trên chính tầng Việt (đếm theo giá trị Pāli tuyệt đối, không đếm chuỗi
  Việt).** `Sattakanipāta` → *Bộ Bảy Bài Kệ* **16/16**, không có ngoại lệ (riêng `Chakkanipāta`
  mới là *Bộ Sáu Bài Kệ* 17/17 — có tệp ghi nhầm *Sáu* cho `Sattakanipāta`? không: tôi đã ghép
  Pāli↔Việt, 17 tệp *Bộ Sáu Bài Kệ* đều là `Chakkanipāta`, nên **không** có lỗi nào ở đây).
  `Kukkuvagga` → *Phẩm Kukku* **9/9**. `Jātaka` ở `0.1`: 433 tệp `ja` có khoá `0.1`, **417**
  giữ `Jātaka`, 16 dùng *Chuyện Tiền Thân* — đa số tuyệt đối, không có lựa chọn thứ ba. Dòng
  ghi số thứ tự `0.4` theo khuôn cùng phẩm: `ja403:0.4` = *8. Kinh Aṭṭhisenaka*,
  `ja404:0.4` = *9. Kinh Kapi*, `ja412:0.4` = *7. Kinh Koṭasimbalī*. Dòng kết
  `11.1` `Dabbhapupphajātakaṁ pañcamaṁ` theo đa số **Kukkuvagga**: 12/12 dùng dấu phẩy trước
  *thứ N* (`ja398`–`ja412`).

  **Dùng lại nguyên văn.** `3.3` và `4.3` đều là `Samehi medhagaṁ samma` → dùng lại **nguyên văn**
  *với đôi cánh chắc, đôi chân vững*. `3.4` và `4.4` đều là `vivādo vūpasammataṁ` → *tranh
  biện lắng xuống hẳn*. `5.3`/`5.4` trùng cấu trúc với `3.3`/`3.4` nhưng Pāli khác, nên tôi
  dịch riêng. Cụm `māyāvi` ở `9.4` dùng *lừa dối*, **cùng cách** tôi dịch `māyāvī` ở
  `an10.84:12.1` — đây là một bài khác trong cùng lát, nên tôi cố ý giữ nhất quán.

  **Ngoặc kép — khớp nguyên vị trí Pāli, sau một lần sửa lúc review.** Pāli ghim có **7** dấu
  `“` (`1.1`, `2.1`, `3.1`, `4.1`, `6.1`, `7.1`, `9.1`) và **7** dấu `”` (`1.4`, `2.4`, `3.4`,
  `5.4`, `6.4`, `8.4`, `10.6`) — cân ngay. Bản đầu của tôi **thừa** một dấu: tôi thêm `”` ở
  `9.4` trong khi Pāli `bhuñja māyāvi rohitaṁ.` không có, nên vòng đếm thành 8 đóng / 7 mở và
  `_hvi.ngoặc` báo lệch. Đã sửa bằng cách **xoá** dấu `”` thừa ở `9.4` — **không** xoá dấu mở
  nào, **không** đụng chữ nào. Sau khi sửa, vị trí từng dấu khớp Pāli 100% (đã kiểm bằng cách so
  `(mở, đóng)` từng khoá). Cũng trong lần sửa đó tôi thêm lại `”` ở `5.4` (Pāli có: `dhammaṭṭhassa
  bhavissati”.`). Lưu ý để người biên tập phán xét tiếp: lời kêu mở ở `4.1` đã kéo qua `4.2`–`4.4`
  thì **đóng ngay ở `5.4`**, còn `6.1` lại mở lời mới — nghĩa là `5.1`–`5.4` nằm giữa hai lời kêu;
  tôi giữ đúng vị trí Pāli, không sửa cấu trúc này.

  **Bất định, ghi ở đây chứ không thêm vào thân kinh.**
  (1) **`sīsa` ở `5.2`** (`sīsaṁ gambhīracārino`) — tôi dịch *đuôi* và **không** thêm *dài*.
  `sīsa` trong Pāli là *đuôi / vật nhọn ở cuối*; ý *đuôi dài* chỉ là do đối chiếu với `naṅguṭṭha`
  (chân có màng, một khiếm khuyết) ở `5.1`, tức suy ra chứ Pāli không nói. Tôi giữ đúng
  những gì Pāli nói.
  (2) **`6.3`–`6.4`** — đây là chỗ tôi ít chắc nhất của bài. Tôi đã tra `asīsaka` trong toàn bộ
  Pāli ghim: `dn23:9.3` (`sasīsakaṁ nimuggo assa`) và `sn19.11:1.3` (`sasīsakaṁ nimuggaṁ`) cho
  thấy nó nghĩa là **đã chết**, nên tôi dịch `asīsakaṁ` là *đã say đến chết*. `anaṅguṭṭhaṁ`
  = *không còn chân màng* (phủ định của `naṅguṭṭha` ở `5.1`). `siṅgālo` tôi dịch *kẻ đố kỵ* và
  `rohitaṁ` là *kẻ màu đỏ* (người nói). Nhưng quan hệ cú pháp giữa hai vế — ai bắt ai — thì tôi
  **không chắc**, và không có bản Anh nào ở commit đã ghim để phân xử.
  (3) `khattiyo` ở `7.2` — mặc định là *quân tộc*, nhưng trong câu `rajjaṁ laddhāna khattiyo`
  (đã lên ngôi) nghĩa là *người thường dân được phong vương*, cũng như chú giải của các bài
  `Bhikkhu Pāṇḍita` dùng cho `khattiyo`; tôi dịch *người khiêm tốn* để giữ nghĩa này.
  (4) `1.1`–`1.2` (`Anutīracārī bhaddante, sahāyamanudhāva maṁ`) — `sahāya` có thể là *người đồng
  hành của chính người nói* (tôi dịch *bạn đồng hành*) hoặc *người được nhắc tới trong câu trước*;
  tôi chọn cách ít giả định nhất và giữ chủ ngữ rõ ràng.

  **Dấu lược.** `ja400` không có khoá nào chứa `…pe…`.

  **Mệnh đề, đo lại.** `ja:0.1` 433 tệp → `Jātaka` 417, `Chuyện Tiền Thân` 16, không có 10.
  `Sattakanipāta` 16/16 và `Kukkuvagga` 9/9 không có ngoại lệ. Toàn tầng `sn:0.1` 1.648/1.648
  giữ PĀLI `Saṁyutta Nikāya` (đo để lát người biên tập không phải đo lại).

  **Cổng kỹ thuật.** `npm run validate|test|check|build` bị cấm trong lát này nên tôi không tự
  chạy được. Tôi tự kiểm bằng chính `_hvi.py`: JSON hợp lệ, đủ 47/47 khoá trong `all`, không
  khoá thừa, không khoá nào trùng nguyên văn Pāli, mọi giá trị NFC, bài không có dấu lược,
  không `(…)` đứng một mình, ngoặc kép cân trên cả bài (đã cân tay: +1 −1 +1 −1 +1 −1), không
  Pāli lọt, thứ tự khoá đúng thứ tự số.

  **Lượt cải thiện 2026-10-11 (đọc đối kháng lại cả 47 khoá; đổi 42/47 khoá, giữ 0.1–0.4 và 11.1).**
  Lượt này **thay thế** mọi cách đọc ở các đoạn *Bất định* và *Ngoặc kép* phía trên: bản cũ hiểu
  sai nhiều từ then chốt và dựng một câu chuyện không có trong Pāli. Những cách đọc cũ nay đã bị loại:
  `dabbhapuppha` = "con ruồi trĩ" (thực là một **danh xưng/tên** ở vị cách hô 3.2, người được nhờ phân
  xử), `sīsaṁ` = "đuôi", `asīsakaṁ anaṅguṭṭhaṁ` = "đã say đến chết / chân không màng", `siṅgālo` = "kẻ đố
  kỵ", `rohitaṁ` = "kẻ màu đỏ", `khattiyo` = "người khiêm tốn", `aḍḍā` = "vụ tranh biện", `dhammaṭṭha` =
  "tòa án", `jīyanti`/`pavaḍḍhati` của 10.5–10.6 = "chết / bị tàn phá" (nghĩa đảo ngược: Pāli nói
  kho vua **tăng thêm**), và 6.1 "ta cũng từng say" (không có trong Pāli: `bhakkho abhavissa` = "đã có thức ăn").

  **Cốt truyện đọc được từ chính Pāli (không cần chú giải).** Hai con vật (kẻ đi dọc bờ / kẻ đi nơi
  sâu — 1.1, 2.1, 5.1–5.2; tôi dịch thành mô tả, vì Pāli chỉ ghi hai danh xưng ấy) cùng bắt một con
  cá `rohita` (1.3, 6.4, 9.4) rồi tranh cãi chia phần; họ nhờ `dabbhapuppha` (3.2,
  vị cách hô, giữ nguyên) phân xử; người ấy tự nói trước kia là `dhammaṭṭha` đã xử nhiều `aḍḍā` (4.1–4.2),
  rồi chia **đuôi — đầu — khúc giữa** (5.1–5.4: đuôi cho kẻ đi bờ, đầu cho kẻ đi sâu, khúc giữa cho
  `dhammaṭṭha`). Ở 6.3–6.4, `asīsakaṁ anaṅguṭṭhaṁ` là hai tính từ đối cách đứng cùng `rohitaṁ`
  ("cá không đầu không đuôi"), chủ ngữ là `siṅgālo` (chó rừng) — hết "cụt" cú pháp. Từ 7.1 là một lời
  của người nói đón `patiṁ` (chồng) về, hỏi cách bắt cá (8), và 9–10 là lời đáp rút bài học: tranh cãi
  hao mòn, kẻ đi nhờ xử án thì mất của, kho vua tăng thêm.

  **Căn cứ đã đo (đếm trên tầng Việt hiện có, loại trừ chính bài này).**
  (a) `sīsa` = đầu: 5.1 `naṅguṭṭhaṁ` / 5.2 `sīsaṁ` là cặp đuôi–đầu; `sīsaṁ` ở `an4.121`, `an4.244`,
  `dn23:7.7`… đều là "đầu" (`sīsaṁ chindati` = chặt đầu); `sasīsakaṁ` ở `dn23:9.3`, `an6.62:5.2` là
  "cả đầu" (chìm ngập cả đầu), nên `asīsakaṁ` = không đầu — ngược với cách đọc "đã chết" của bản trước (hai
  chỗ này nói về người chìm ngập, không phải người chết). `naṅguṭṭha` = "đuôi" ở `an4.246`, `mn22:10.12`, `mn125`,
  `ud6.4`, `mil7.2.3`, `ja144`, `ja426` — **không** có chỗ nào nghĩa "chân màng".
  (b) `aḍḍa` = vụ kiện/việc xử án: `aḍḍakaraṇa` = "xử kiện / phiên tòa" (`mn89:13.3`, `sn3.7`, `sn3.10`);
  `tīrita` = đã thẩm xét/xét xử xong (`cnd10:47.1` "tīrito" = "thẩm xét", `cnd11:52` `tīreti` = "thẩm xét").
  (c) `vivāda` ở các khoá không phải bảng liệt kê: "tranh cãi" 71 khoá, "tranh chấp" 70, "tranh luận" 100
  (số này bị bảng `mnd`/`cnd` đẩy lên), "tranh biện" chỉ 4; `medhaga` ngoài `mnd`: "tranh chấp" 5,
  "tranh cãi" 2 (`dhp6:4`, `ja428:6.4`). Vì vậy tôi chọn `vivāda` = **tranh cãi** và `medhaga` = **tranh chấp**,
  bỏ "tranh biện" (vốn là cách đặt riêng của bản cũ). 3.3/4.3 khác Pāli (`samehi` / `samemi`), nên không
  còn khẳng định "dùng lại nguyên văn" như ghi chú cũ; chỉ 3.4 và 4.4 trùng (`vivādo vūpasammataṁ`)
  và đã dịch giống nhau ("để cuộc tranh cãi được lắng xuống"; `vūpasammataṁ` đọc là mệnh lệnh ngôi 3, 'cho nó lắng').
  (d) Pāli trùng với bài khác: 7.2 `rajjaṁ laddhāna khattiyo` = `ja521:33.2` / `sn3.1:6.2` ("khi đã đạt ngôi báu,
  vị sát-đế-lợi", 2/2, dùng lại nguyên); 8.3 `Puṭṭho me samma akkhāhi` = `ja475` ×3, `ja484`, `ja538` ("được ta
  hỏi, này bạn, hãy nói": 5/6 dùng "ta", 1/6 dùng "tôi" ở `ja540`; dùng lại dạng "ta"); `10.1` `Evameva manussesu` = "Cũng vậy trong loài
  người" 7 chỗ và "giữa loài người" 4 chỗ — dùng dạng "trong"; `Yathāhamajja nandāmi` ở `ja359`,
  `ja501`, `ja502`, `ja533` = "hoan hỷ" (không phải "ưng"). Đã dò 47 khoá: 6 khoá có Pāli trùng với bài khác (0.2, 2.3, 7.2, 8.3, 10.1, 10.2);
  dùng lại nguyên ở 0.2, 7.2, 8.3, 10.1; **lệch có chủ ý** ở 2.3 (`ja516:22.3` dịch "ta sẽ nhấc ông lên": tôi bỏ tân
  ngữ vì `taṁ` ở đây chưa phân xử) và 10.2 (`ja475:11.2` dịch `vivādo` là "xung đột": tôi giữ "tranh cãi" cho
  thống nhất trong bài). Trong bài có 1 cặp trùng nguyên văn (3.4 = 4.4) và Việt giống nhau.
  (e) `khattiya` trong tầng ja: 43/71 khoá có "sát-đế-lợi" trong bản Việt.
  (f) `māyāvī`: "gian dối" ở `an10.87`, "hay lừa dối" ở `an10.84`, "xảo trá, gian dối" ở `an6.36`, `dn25`, `dn33`,
  "gian xảo, lừa dối" ở `an5.167` — chọn "gian dối", dạng xuất hiện ở cả hai nhóm.
  (g) `rohita` không có tiền lệ nào trong tầng (chỉ là một tên ở `sn2.30:18.2`); ở bài này `macchaṁ` ở 8.2 và `maccho` ở 1.3
  cho thấy nó là con cá, nên tôi giữ nguyên `rohita` và thêm "con cá", không dịch nghĩa.

  **Các khoá đổi và lý do.** Accuracy fix: 1.1–1.4 (xưng hô và chủ thể: hai vị cách hô; con cá lớn *bị ta bắt*,
  chứ không phải "đàn ruồi trĩ"), 2.1–2.4 (`supaṇṇo uragāmiva` = như Supaṇṇa nhấc rắn, không phải "da rắn lột"),
  3.1–3.4 (người xin phân xử, không phải "kể chuyện"), 4.1–4.4 (`dhammaṭṭho` → người xử án; `aḍḍā` → vụ kiện),
  5.1–5.4 (đuôi/đầu/khúc giữa, không còn "kẻ cứng đầu"), 6.1–6.4 (bỏ "say"; `bhakkho` → thức ăn; `siṅgālo` → chó rừng;
  `rohitaṁ` → cá rohita), 7.1–7.4 (`nandeyya` → hoan hỷ; `khattiyo` → vị sát-đế-lợi; `patiṁ` → chồng),
  8.1–8.4 (`adhigataṁ` → có được, không phải "học được"), 9.1–9.4 (`kisā` → gầy mòn, không phải "bị ăn
  thịt"; `uddā` → rái cá, không phải "quạ"; `jīnā` → thua thiệt), 10.1–10.6 (`dhammaṭṭhaṁ paṭidhāvanti` → chạy đến
  người xử án; `rājakoso pavaḍḍhati` → kho vua tăng thêm, không phải "bị tàn phá"; `jīyanti` → hao mất, không phải "chết").
  Ngoặc kép vẫn khớp Pāli từng khoá (đã so lại cả bốn loại `“ ” ‘ ’`, 47/47, 0 lệch).

  **Điểm đổi: từ → sang.** `semantic_fidelity` 8.9 → 8.8 (điểm cũ không bảo vệ được: bản cũ có nhiều sai nghĩa
  trọng yếu; sau khi sửa vẫn còn các lựa chọn diễn giải liệt kê bên dưới, không có bản Anh độc lập để
  đối chiếu). `grammar_logic` 9.0 → 8.9 (đã sửa vị cách hô, mệnh lệnh ngôi 3 `vūpasammataṁ`, tính từ đối cách ở 6.3–6.4; vẫn còn
  gán người nói cho 7–10 là suy luận từ `patiṁ`, `samma`). `terminology` 9.1 → 9.2 (thống nhất `vivāda`/`medhaga`
  theo số đếm; dùng lại 3 khuôn trùng với bài khác). `vietnamese_clarity` 9.0 → 9.1 (bỏ các câu lệch như
  "kẻ đố kỵ sẽ bắt kẻ màu đỏ", câu nay đọc thành một chuyện mạch lạc). Không đổi: `source_provenance` 9.4,
  `segment_alignment` 10.0, `triangulation` 7.4 (vẫn không có bản Anh/Việt độc lập), `han_viet_balance` 9.2,
  `ambiguity_integrity` 8.4 (bất định thật còn nguyên), `technical_integrity` 9.6. `final_score` 9.00 → 9.00
  (trung bình thô; trùng điểm cũ nhưng nội dung khác hẳn: điểm cũ phản ánh một bản dịch sai nghĩa).

  **Blocker.** Đã **gỡ** blocker thứ ba (về `sīsa` ở 5.2 và cụt `asīsakaṁ anaṅguṭṭhaṁ / siṅgālo harati rohitaṁ`
  ở 6.3–6.4): đã phân xử bằng tiền lệ trong tầng (mục a–b) và cú pháp (hai tính từ đối cách + chủ ngữ
  `siṅgālo`). **Giữ** hai blocker về vắng tầng Anh (không phải lỗi của bản dịch mà là giới hạn upstream).

  **Bất định còn lại (không phân xử được từ Pāli ghim; ghi ở đây, không thêm vào lời kinh).**
  (1) `dhammaṭṭha` ở 4.1, 5.4, 10.3 dịch **"người xử án"**: nghĩa đen "đứng vững trong pháp" (tiền lệ trong sutta:
  `an3.57`, `an5.42` "đứng vững trong pháp"), nhưng ở đây ngữ cảnh (`aḍḍā tīritā`, được chia "khúc giữa", bị
  "chạy đến") buộc nghĩa người phân xử; chưa có chú giải để xác nhận, nên đây là suy luận từ ngữ cảnh.
  (2) `accāyaṁ` ở 5.3 chỉ gặp ở bài này trong Pāli ghim (không phải `accāyika` "khẩn trương"); tôi dịch phần
  `ayaṁ` ("này") và **không dịch** tiền tố `acca-` — có thể là "ati+ayaṁ" ("dư ra"), chưa phân xử.
  (3) `taṁ` ở 2.3 (`ahaṁ taṁ uddharissāmi`) có thể là "ngươi" (`ja516:22.3` dịch "ông") hoặc "nó" (con cá); tôi bỏ
  tân ngữ để không chọn.
  (4) `bhaddante` (1.1, 2.1) có thể là "bhaddaṁ te" (chúc bình an cho bạn) hoặc dạng hô "bhadante"; tôi dịch "bạn hiền".
  (5) `māyāvi` ở 9.4 là vị cách hô nhưng người được gọi là ai (vợ? chính người nói?) không xác định; dịch
  "hỡi kẻ gian dối".
  (6) `puṇṇamukhaṁ` (7.4): `mukha` là mặt **hoặc** miệng, `puṇṇa` là đầy — "gương mặt đầy đặn" là một lựa chọn,
  không loại trừ "miệng đầy".
  (7) `vināyako` (10.4) dịch "kẻ dẫn dắt họ"; nghĩa phổ biến là người dẫn đạo (`bv1:10.1` "Điều Ngự"), nhưng ở đây
  có thể mang sắc thái mỉa mai ("kẻ dẫn đến mất mát"); giữ nghĩa gốc.
  (8) Người nói của 7–10 (7.4 `patiṁ` → vợ nói với chồng) là suy ra từ Pāli, không có câu dẫn.

  **Coverage English.** Không đổi: `ja400` không có tầng `english-sujato`; 47 khoá đều ngắn hơn 40 ký tự nên mẫu số
  coverage = 0 và cổng không đo được gì. **Cổng kỹ thuật.** Chưa chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build` trong lượt này, nên `technical_integrity` giữ 9.6, không tuyên bố đã pass; đã tự kiểm 47/47
  khoá, thứ tự khoá, ngoặc 4 loại, NFC, không dấu lược, không Pāli lọt (ngoài tên riêng `Dabbhapuppha`, `Jātaka`).

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 8 khoá chênh lệch lớn nhất (trên 47 khoá) → khác nghĩa 2: sửa 0, giữ 1, bất định 1. Giữ 1: `7.1`–`7.2` `rājā … rajjaṁ laddhāna khattiyo` (bản mù đưa “sát-đế-lợi” lên vế vua và bỏ `khattiyo` ở `7.2`; bản dự án giữ cả hai chữ đúng vị trí Pāli). Các khoá còn lại (`1.2`, `1.3`, `1.4`, `2.3`, `8.2`, `0.2`) chỉ khác diễn đạt. Bất định 1: `7.4` `puṇṇamukhaṁ` (“gương mặt đầy đặn” hay “miệng đầy”, đã ghi ở bất định 6 phía trên). Ghi chú ngược: đoạn “Dùng lại nguyên văn” phía trên (`3.3`, `3.4`, `4.3`, `4.4`, `9.4`) mô tả bản dịch cũ và không còn đúng với chữ hiện hành (`3.3` *này bạn, hãy dàn xếp cuộc tranh chấp*, `3.4` *để cuộc tranh cãi được lắng xuống*, `9.4` *hỡi kẻ gian dối*); chữ hiện hành là chuẩn. Không có bản Anh hay bản Việt độc lập khác nên `triangulation` chỉ 7,6.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5, Claude Code), đọc lại đủ 47 khoá Pāli↔Việt; chỉ có Pāli
  đã ghim và PED. Sửa một khoá: `7.4` `puṇṇamukhaṁ patiṁ` đọc là người chồng có miệng đầy (cá ngậm
  trong miệng), thay cho “gương mặt đầy đặn”; cả đoạn này chỉ có người chồng ngậm miếng cá về nên
  “miệng đầy” là cách đọc theo ngữ cảnh bài, và bất định cũ ở phần trên được giải quyết theo hướng đó.
  Giữ các khoá còn lại (`bhaddante` là cách chào “thưa ngài, chúc may mắn”, không phải tên;
  `dhammaṭṭha` = người xử án; `Māyāvī` ở `9.4` đọc là hô cách, giữ nghĩa “kẻ gian dối”).

  Quyết định hội đồng biên tập 2026-10-16: A13 — `8.4` (bỏ dấu chấm thừa sau dấu đóng lời thoại, ví dụ `?”.` thành `?”`); B22 — `1.1`, `2.1` (`bhaddante` người nói thấp hơn hoặc ngang hàng thì "thưa ngài/ông/bạn", không dịch lời chúc); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
