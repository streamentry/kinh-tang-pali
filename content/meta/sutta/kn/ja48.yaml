notes: |-
  Bản dịch phủ đủ 9 khoá, ngoặc kép cân, không thừa khoá.
  
  **`Anupāyena yo atthaṁ` xử lý tốt.** Pāli đưa cả "bằng cách phi chân chính" vào vế đầu, bản dịch tách nó ra đặt ở đầu vế sau (*Kẻ nào muốn có của cải / bằng cách không chân chính, người ấy khổ não*). Đây là dịch lại cấu trúc chứ không thêm ý: Sujato cũng tách (*Who wishes to profit by inappropriate means / is tormented*). `Icchati so vihaññati` → *người ấy khổ não* — `vihaññati` là "bị giày vò", *khổ não* hơi nặng nhưng chấp nhận được.
  
  **`byasanamajjhagūti` là calque thẳng** (*đi đến chỗ huỷ diệt*) theo nghĩa đen của `byasanamajjhagā` "rơi vào giữa sự huỷ diệt". Sujato đọc tự do hơn (*all fell into ruin*). Bản dịch đúng nhưng gượng; đã trừ nhẹ ở `vietnamese_clarity`.
  
  **Tên riêng:** Pāli `Cetā` (giống Ceta, số nhiều) được viết hoa thành *Ceta*. `Vedabba` giữ nguyên dấu. Đều nhất quán với cách giữ danh tên Pāli trong tầng.
  
  **Thuật ngữ phẩm:** `Atthakāmavagga` → *Phẩm Mong Muốn Lợi Ích*. Đây là **đa số** của tầng (3 tệp: `ja41`, `ja48`, `ja49`), và cũng sát Sujato (*Wanting to Help*) hơn. Xem `ja43` cho cách dịch cạnh tranh trong cùng lô.
  
  **Tầng Việt**: không có Thích Minh Châu cho Tăng Bộ ở commit đã ghim.
