notes: |-
  TRÔI DẠT TIÊU ĐỀ CHƯA GIẢI ĐƯỢC — GHI LẠI ĐỂ BIÊN TẬP QUYẾT. Atthakāmavagga đang
  có NĂM cách trong tầng: Phẩm Cầu Điều Lành 2 bài, Phẩm Mong Muốn Lợi Ích 2 bài,
  Phẩm Atthakāma 2 bài, Phẩm Mong Điều Lành 1 bài, Phẩm Lời Nói Tử Tế 1 bài. Bản
  nháp tôi viết Phẩm Muốn Giúp Người, theo gloss của Sujato là Wanting to Help. Tôi
  đã đổi sang Phẩm Mong Muốn Lợi Ích vì nó đã có sẵn hai bài, vì sát chữ hơn (attha là
  lợi ích, kāma là mong muốn), và vì tôi không thêm cách thứ sáu cho một phẩm đã loạn.
  Nhưng đây là hòa ba, không phải đa số, nên phẩm này CẦN một quyết định cho cả mười
  bài. Tôi không tự quyết vì người biên tập phải chọn, và mỗi lần chọn lại là một lần
  sửa hàng loạt.
  anupāya không có tiền lệ trong tầng. Sujato dịch inappropriate means; tôi dịch bằng
  cách không chân chính. attha ở đây nghĩa là lợi lộc, tôi dịch của cải. vihaññati có
  tiền lệ dhp15:3 Nó sầu, nó khổ não nên tôi dùng khổ não. Cetā là tên bộ tộc, không
  có tiền lệ bản Việt; tôi dịch Những người Ceta, giữ chữ Ceta nguyên văn. Pāli ở
  thân kệ viết vedabbaṁ còn ở tiêu đề viết Vedabbajātaka, tôi giữ nguyên cả hai
  dạng theo Pāli và ghi lại ở đây. byasanamajjhagū dịch đi đến chỗ huỷ diệt; byasa
  là huỷ diệt, majjhagū là đi tới chỗ.
  NHÁY KÉP — LỆCH CÓ CHỦ Ý. Pāli mở “ ở 1.1 rồi KHÔNG đóng ở bất kỳ khoá nào, tức
  Pāli để hở, cân = 1. Tôi đóng lại ở 1.4. Đây không phải tôi thêm dấu tùy tiện: 211 bài
  đã có trong tầng có Pāli để hở và bản Việt đóng lại, ví dụ an5.186:1.1, an7.87:1.1,
  an9.55:1.1, vì ngoặc kép phải cân trên cả bài thì mới đọc được. Ghi ra đây để không ai
  tưởng tôi lệch. Lựa chọn khác là bỏ nháy kép ở 1.4, nhưng như thế câu 1.4 không còn
  gắn vào lời kể và cả bài mất cân.
  Kỹ thuật: 9/9 khoá, không rỗng, thứ tự khớp Pāli, NFC, không dấu lược. save_vi sạch
  và idempotent. Không chạy npm run validate|test|check|build nên technical_integrity 9.5.
