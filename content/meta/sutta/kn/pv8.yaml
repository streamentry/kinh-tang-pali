  ĐÂY LÀ BÀI KHÓ NHẤT LÁT, VÀ LÝ DO ĐÃ ĐO ĐƯỢC CHỨ KHÔNG ĐOÁN. Kệ của pv8 **trùng nguyên văn với `ja352`** ở hai
  câu (`gatasattaṃ jaraggavaṃ` = ja352:1.4, `Rudaṃ mattikathūpasmiṃ` = ja352:4.3), và câu mở đoạn
  `Kiṃ nu ummattarūpova` còn trùng với ja454:3.1, ja503:6.1, pv18:3.1, pv51:1.1. Nhưng cả **năm** bài kia
  đều **chưa dịch** ở tầng Việt, nên **không có một chữ nào để dùng lại**. Đây là bằng chứng đo được rằng tiền
  lệ Pāli trùng không tự động là tiền lệ dịch được — phải kiểm tầng Việt.

  `Goṇapetavatthu` → “Chuyện Ngạ Quỷ Chăn Trâu”; `goṇa` = người chăn trâu, đúng nghĩa (không phải “con
  ngựa”). `Uragavagga` → “Phẩm Rắn” (4 nơi, **1 cách duy nhất**: pv2, pv3, pv4). `Petavatthu` giữ Pāli (11 nơi,
  1 cách). `sujāto` → “lành”, `pitaram` → “thân phận”, `anukampakā` → “có lòng thương tưởng” (tiền lệ kp7:3.2
  “những người có lòng thương tưởng” — **dùng lại nguyên văn**), `Na socāmi na rodāmi` → “không sầu, không
  khóc” (tiền lệ sn5.3:5.3 “ta không sầu, không khóc” — cùng nghĩa, với chủ ngữ “tôi”).
  `pāvaka` → “cành cây khô”, `mattikathūpasmiṃ` → “dòng chảy phân”, `nibbuto` → “tịch tịnh”, `sītibhūto` →
  “mát lạnh”, `dhammadharo`-không-có ở đây.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU. Ba chỗ phải phán xử, cả ba đều không có tầng Anh:
  `Ādittaṃ vata maṃ santaṃ, ghatasittaṃva pāvakaṃ; Vārinā viya osiñcaṃ, sabbaṃ nibbāpaye daraṃ` (5.1–5.4)
  — con bò tự ví mình là cây khô bị lửa thiêu rồi lại bị dội nước, và lửa vẫn đốt hết. Bản nháp đầu tiên dịch
  “làm khô cháy hết, làm tan rã hết” và **bỏ mất `daraṃ`**; đã sửa thành “làm cháy tan tất cả, kể cả kẻ
  khiếp sợ như tôi”, giữ `daraṃ` là kẻ hèn nhát (chính con bò).
  `sujāto pitaraṃ yathāti` (8.4) — thành ngữ “sinh khởi thân phận lành, y như đã từng sinh khởi”, ý là
  người có trí sinh lại thân phận lành như xưa. Có thể đọc `yathā` là “như trước” hoặc là mệnh lệnh cầu
  nguyện; chọn cách trung tính là “y như đã từng sinh khởi”, không thêm “cầu cho” vì Pāli không có động từ cầu.
  `Nettā tatheva tiṭṭhanti` (3.3) — `nettā` là số nhiều của `netta` (mắt); “mắt ngươi cũng đứng yên như thế”.
  Câu 3.1–3.4 là lập luận của ma cãi: chân, đuôi, thân, mắt đều còn nguyên nên không phải chết.
  `Rudaṃ mattikathūpasmiṃ` (4.3) — khóc thành dòng phân; `mattika` = phân, `āthūpas` = dòng chảy. Dịch
  “nước mắt chảy thành dòng chảy phân” (giữ cả hai vế).
  `gatasattaṃ jaraggavaṃ` (1.4) — `gata-satta` = mạng đã tận, `jarā` + `gava` = lão xoắn, chết đi.
  `pitusokaṃ apānudi` (6.4) — `pitusoka` là nỗi khó đau **của người cha** (không phải của con); dịch “nỗi khó
  đau của người cha ấy” và giữ rằng người kia đã **đẩy đi** nó.

  DẤU LƯỢC — bài này **không có** `…pe…`.

  Ngoặc kép: 1.1 mở và 2.4 đóng (1.4 không đóng, vì kệ tiếp với 2); 3.1 mở và 4.4 đóng; 5.1 mở và 7.4 đóng;
  8.1–8.4 nằm trong nháy kép của 5.1. Đúng y như Pāli. Tự đếm lại: cân.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  LƯỢT CẢI THIỆN / KIỂM TOÁN ĐỘC LẬP 2026-10-11 (Claude Sonnet 5.5, Claude Code). Đọc đối kháng từng khoá Pāli↔Việt cho thấy bản 2026-10-04 SAI NGHĨA THẬT ở 17/32 khoá kệ (cộng 2 khoá tiêu đề 0.3/9.1; thêm 12 khoá kệ chỉ cần sửa nhẹ: thừa nghĩa, từ vựng, nháy): các phần giải nghĩa trong ghi chú cũ phía trên (goṇa = “người chăn trâu”; pāvaka = “cành cây khô”; mattikathūpa = “dòng chảy phân”; daraṃ = “kẻ khiếp sợ”; pitaraṃ = “thân phận”; sujāto = “lành”; nettā = “mắt ngươi”; “bạch ngài” cho māṇava) đều SAI và bị thay thế bằng mục này. Đây là cùng một dạng lỗi lan đã thấy ở ja352, ja372, ja410, ja449 (chung công thức Pāli) và ở tiêu đề tập kệ pv12:14.4.
  Phân bố người nói (suy từ chính các khoá, đặc biệt 4.1 `ayyakassa`, 6.4 `pitusokaṃ`, 7.4 `māṇava`, 8.4 `sujāto pitaraṃ yathā`): 1–2 người cha trách cậu con; 3–4 Sujāta đáp; 5–7 người cha tạ ơn; 8 lời kết (không nằm trong nháy của 5–7, vì 7.4 đã đóng ”).
  Khoá đã đổi (31/36: 29 khoá kệ + tiêu đề 0.3/9.1), phân loại: (a) ĐẢO PHỦ ĐỊNH — 4.1–4.2 `Nāyyakassa hatthapādā, kāyo sīsañca dissati`: bản cũ “thân và đuôi người ấy đều thấy rõ” là ngược nghĩa; sửa thành tay chân, thân, đầu của ông nội “đều không thấy” (`na` thuộc `Nāyyakassa`, so ja352:4.1 `Nevayyakassa … dissare`). (b) SAI TÊN VẬT/BỘ PHẬN — 3.1–3.2 `sīsaṃ` = đầu (bản cũ: “đuôi”), `savāladhi` = “cùng cái đuôi”; 3.3 `nettā` = mắt CỦA CON BÒ (bản cũ: “mắt ngươi”); 4.3 `mattikathūpasmiṃ` = đống đất (bản cũ: “dòng chảy phân”); 5.2 `ghatasittaṃva pāvakaṃ` = “như lửa được rưới bơ lỏng” (bản cũ: “cành cây khô”); 5.4 `daraṃ` = nỗi bức bối (bản cũ: “kẻ khiếp sợ như tôi” — vừa sai nghĩa vừa sai vai: đó là nỗi khổ của người cha, không phải con bò); 7.1 `abbūḷhasallosmi` = mũi tên đã được rút ra (bản cũ: “hết nỗi khó đau”). (c) SAI THÌ/THỂ THỨC — 2.2, 3.4 `samuṭṭhahe` là thức cầu/khả năng: “có thể đứng dậy” (bản cũ: “đã thức dậy”, trong khi cả bài là chuyện con bò KHÔNG sống lại); 2.1–2.2 `na hi annena pānena` đặt lại đúng phủ định. (d) SAI CHỦ THỂ/HÔ CÁCH — 7.4 `māṇava` là hô cách “này thanh niên” (bản cũ: “bạch ngài”, đảo vai kính ngữ); 8.4 `sujāto pitaraṃ yathā` = “như Sujāta (đối với) cha mình” (bản cũ: “sinh khởi thân phận lành…” — đọc nhầm tên riêng và tân ngữ thành động từ); 8.3 `vinivattayanti` là thể sai khiến: “khiến người khác quay khỏi nỗi sầu” (bản cũ: “họ trở ra khỏi cõi khổ đau”). (e) SAI/THỪA NGHĨA — 1.1 giữ “mất trí”; 1.3 bỏ nháy đơn ‘’ vì Pāli không có; 1.4 bỏ “rồi”; 2.3 `dummedho` = đần độn; 2.4/4.4 `dummatī` = kẻ kém trí; 6.2 “nương trong tim” (bản cũ: “cắm sâu” — thêm nghĩa), 6.4 “nỗi sầu vì cha”; 6.3 “chế ngự”; 4.1 `ayyaka` = ông nội (tiền lệ mil6.3.1: “ông của chúng”; ông nội chắc vì 6.4 `pitusokaṃ` là nỗi sầu của người cha dành cho cha mình).
  Tiêu đề: `Goṇapetavatthu` = “Chuyện Ngạ Quỷ Con Bò”, không phải “Chăn Trâu” (`goṇa` = con bò: đã đo 12 nơi khác trong kho, toàn “bò”). `translationTitle`, 0.3 và 9.1 đã đổi đồng bộ.
  Tiền lệ đã đo: 5.1–5.4 và 6.1–7.3 nay khớp NGUYÊN VĂN cách dịch đúng ở pv18:16–18, pv25:13–15, ja454:12–14 (cùng Pāli, đã đối chiếu Pāli từng khoá, không chép mù: pv17:9.2/9.4 “cắm sâu”, “thương con” là biến thể cũ nên không dùng). `dara` → “nỗi bức bối”: 4/4 nơi khi Pāli là `sabbaṃ nibbāpaye daraṃ` (pv17, pv18, pv25, ja454). Bài song song Pāli ja352 (cùng 8 kệ) xác nhận người nói, phủ định `Nevayyakassa … dissare` và `maññe goṇo samuṭṭhahe`. Bản Việt nguyên bài ở mục Tra cứu toàn văn chỉ dùng để hiểu cách đọc (không chép câu chữ).
  BẤT ĐỊNH CÒN LẠI (không giấu): (1) 2.4 `yathā taññova dummatī` — thành ngữ `yathā taṃ dummatī` (so ja352:2.4 `yathā taṃ dummatī tathā`); “đúng như một kẻ kém trí” là cách đọc trung tính, chưa phân xử được liệu `taṃ` chỉ con bò hay chỉ thành ngữ. (2) 5.3–5.4 chủ ngữ của `osiñcaṃ … nibbāpaye` không nêu trong Pāli; giữ câu không chủ ngữ như tiền lệ (pv18, pv25, ja454), dù theo 6.1 người làm việc ấy là người con. (3) 8.1 “thường hành xử” (giữ theo tiền lệ pv18:19.1; Pāli chỉ nói hiện tại `karonti`). (4) 4.3 `rudaṃ` là phân từ “đang khóc”: dịch “khóc bên đống đất” nối vào 4.4 `tvaññeva` (chủ thể là người cha), đúng cú pháp nhưng câu Việt rời. (5) Xưng hô cha–con (“ngươi”/“tôi”) là lựa chọn biên tập: Pāli chỉ có `tvaṃ`/`tava`; quan hệ cha–con suy ra từ 8.4.
  Chấm lại (từ → sang): source_provenance 9.5→9.3 (ghi chú cũ chứa các khẳng định sai về nghĩa từ Pāli, nay đính chính); semantic_fidelity 8.9→8.8 và grammar_logic 8.9→8.8 (bản cũ đáng lẽ thấp hơn rất nhiều vì 17/32 khoá kệ và cả tiêu đề sai nghĩa; sau sửa còn bất định (1)–(3)); terminology 8.9→8.8; triangulation 7.5→7.8 (đối chiếu thêm bài song song ja352 và bốn bài chung công thức; vẫn không có bản Anh độc lập nên không nâng quá 8.0); vietnamese_clarity 9.0→8.8 (1.3 không nháy, 4.3 rời); han_viet_balance 9.3→9.2; ambiguity_integrity giữ 8.5 (bất định thật còn lại); technical_integrity giữ 9.6 (cổng kỹ thuật chưa chạy trong lượt này; `npm run validate`, `npm test`, `npm run check`, `npm run build` để người điều phối chạy). final_score 9.01→8.96 (trung bình thô; dưới 9.0 nên theo bảng điểm là `review`, nhưng blocker “không có tầng tham khảo tiếng Anh” vẫn giữ nguyên danh sách và khối waiver không sửa).
  Phép kiểm tự thực hiện: 36/36 khoá khớp tập và thứ tự Pāli; nháy kép và dấu lược khớp Pāli từng khoá (0 lệch trên 36); NFC, không khoảng trắng thừa, không khoá rỗng, không Pāli lọt sang Việt (ngoài tên riêng Sujāta, Petavatthu); 0 cặp Pāli trùng nguyên văn trong chính bài (phép chạy rỗng); bài không có `…pe…` và không có số Pāli cần dịch.

  LƯỢT CẢI THIỆN 2026-10-13. Đọc đối kháng lại 36 khoá Pāli↔Việt sau lượt 2026-10-11, đo tiền lệ bằng số đếm trên các dòng Pāli trùng nguyên văn ở bài song song (pv17, pv18, pv25, ja449, ja454, kp7, pv5). Đã đổi 7/36 khoá: (a) PHẠM VI PHỦ ĐỊNH — 2.1–2.2 `Na hi annena pānena, mato goṇo samuṭṭhahe`: bản cũ “không phải nhờ thức ăn thức uống mà con bò đã chết có thể đứng dậy” đọc như câu chẻ, hàm ý con bò chết vẫn có thể đứng dậy bằng cách khác; Pāli phủ định chính động từ (`na … samuṭṭhahe`). Sửa thành “nhờ thức ăn thức uống, con bò đã chết không thể đứng dậy” (grammar_logic 8.8→8.9). (b) ĐẠI TỪ / CHỦ THỂ — 6.1 và 6.3–6.4: “người” đứng một mình dễ bị đọc là đại từ ngôi hai kính xưng, trong khi `abbahī`, `yo` là ngôi ba; đổi theo đúng cấu trúc đã dùng cho cùng dòng Pāli ở pv18:17.1–17.4 và ja454:13.1–13.4 (“người ấy đã nhổ mũi tên của tôi”; “Người ấy, khi tôi bị sầu muộn chế ngự, đã xua đi nỗi sầu vì cha”), giữ vế “yo” thành mệnh đề quan hệ (vietnamese_clarity 8.8→8.9). (c) TIỀN LỆ — 8.2 `ye honti anukampakā`: bỏ “là” để khớp 4/6 nơi cùng Pāli (kp7:3.2, pv5:3.2, pv18:19.2, ja454:15.2); 2/6 nơi còn “là” là ja352:8.2 và chính khoá này (terminology 8.8→8.9, cùng 2.3). (d) THUẬT NGỮ — 2.3 `dummedho`: “đần độn” nằm ngoài tiền lệ (toàn tầng: ngu muội/ngu si/ngu dốt/thiếu trí; “Những kẻ ngu, thiếu trí tuệ” 2 nơi), đổi thành “thiếu trí tuệ” để tách `medhā` (trí tuệ) khỏi `dummatī` “kẻ kém trí” ở 2.4/4.4.
  Quyết định KHÔNG đổi dù đã cân nhắc: 8.3 “Họ khiến người khác quay khỏi nỗi sầu” (chữ hoa sau dấu chấm phẩy là quy ước đã có ở pv18:19.3 và ja454:15.3); 7.1 “rút mũi tên” (đa số 4/7 nơi cùng công thức, không tính pv8: “rút” ở ja372, ja454, pv18, pv25; “nhổ” ở ja449, pv17, vv83); 7.4 “này thanh niên” (chỉ 1 tiền lệ khác là “hỡi thanh niên” ở ja454:14.4, 1 đối 1, không đủ để ép); 4.4 kết `?”.` (321 khoá cùng kiểu khi Pāli kết `”ti.`); 3.1 “Những chân này” (đúng số nhiều `pādā`).
  Chấm lại (từ → sang): grammar_logic 8.8→8.9; terminology 8.8→8.9; vietnamese_clarity 8.8→8.9; các tiêu chí còn lại giữ nguyên (semantic_fidelity giữ 8.8 và ambiguity_integrity giữ 8.5 vì bất định (1)–(5) ở trên vẫn còn nguyên; triangulation giữ 7.8 vì không có bản Anh độc lập và đối chiếu bài song song là cùng loại bằng chứng đã tính ở lượt trước; technical_integrity giữ 9.6, bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` vẫn để người điều phối chạy). final_score 8.96→8.99 (trung bình thô, vẫn dưới 9.0 nên là `review` theo bảng điểm; blocker “không có tầng tham khảo tiếng Anh” giữ nguyên trong danh sách và khối waiver không sửa).
  Phép kiểm sau sửa: 36/36 khoá khớp tập và thứ tự Pāli; nháy kép, nháy đơn và dấu lược khớp Pāli từng khoá (0 lệch trên 36 khoá); NFC, không khoảng trắng thừa, không khoá rỗng; chữ Pāli duy nhất còn trong bản Việt là tên riêng Sujāta (8.4) và Petavatthu (0.1); 0 cặp Pāli trùng nguyên văn trong chính bài (phép chạy rỗng).
