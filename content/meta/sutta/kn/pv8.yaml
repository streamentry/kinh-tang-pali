notes: |-
  TẦNG THAM KHẢO — không có tệp Anh Sujato cho uid này ở commit đã ghim (xem `blocking_errors`).
  0 segment Pāli có nội dung trên 36 khoá ⇒ cổng coverage không chặt, nhưng tệp Anh vắng thì `validate` vẫn lỗi
  với `review`/`published` ⇒ `draft`. Không có Việt hiện hành ⇒ `triangulation` 7.5.

  ĐÂY LÀ BÀI KHÓ NHẤT LÁT, VÀ LÝ DO ĐÃ ĐO ĐƯỢC CHỨ KHÔNG ĐOÁN. Kệ của pv8 **trùng nguyên văn với `ja352`** ở hai
  câu (`gatasattaṃ jaraggavaṃ` = ja352:1.4, `Rudaṃ mattikathūpasmiṃ` = ja352:4.3), và câu mở đoạn
  `Kiṃ nu ummattarūpova` còn trùng với ja454:3.1, ja503:6.1, pv18:3.1, pv51:1.1. Nhưng cả **năm** bài kia
  đều **chưa dịch** ở tầng Việt, nên **không có một chữ nào để dùng lại**. Đây là bằng chứng đo được rằng tiền
  lệ Pāli trùng không tự động là tiền lệ dịch được — phải kiểm tầng Việt.

  `Goṇapetavatthu` → “Chuyện Ngạ Quỷ Chăn Trâu”; `goṇa` = người chăn trâu, đúng nghĩa (không phải “con
  ngựa”). `Uragavagga` → “Phẩm Rắn” (4 nơi, **1 cách duy nhất**: pv2, pv3, pv4). `Petavatthu` giữ Pāli (11 nơi,
  1 cách). `sujāto` → “lành”, `pitaram` → “thân phận”, `anukampakā` → “có lòng thương tưởng” (tiền lệ kp7:3.2
  “những người có lòng thương tưởng” — **dùng lại nguyên văn**), `Na socāmi na rodāmi` → “không sầu, không
  khóc” (tiền lệ sn5.3:5.3 “ta không sầu, không khóc” — cùng nghĩa, với chủ ngữ “tôi”).
  `pāvaka` → “cành cây khô”, `mattikathūpasmiṃ` → “dòng chảy phân”, `nibbuto` → “tịch tịnh”, `sītibhūto` →
  “mát lạnh”, `dhammadharo`-không-có ở đây.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU. Ba chỗ phải phán xử, cả ba đều không có tầng Anh:
  `Ādittaṃ vata maṃ santaṃ, ghatasittaṃva pāvakaṃ; Vārinā viya osiñcaṃ, sabbaṃ nibbāpaye daraṃ` (5.1–5.4)
  — con bò tự ví mình là cây khô bị lửa thiêu rồi lại bị dội nước, và lửa vẫn đốt hết. Bản nháp đầu tiên dịch
  “làm khô cháy hết, làm tan rã hết” và **bỏ mất `daraṃ`**; đã sửa thành “làm cháy tan tất cả, kể cả kẻ
  khiếp sợ như tôi”, giữ `daraṃ` là kẻ hèn nhát (chính con bò).
  `sujāto pitaraṃ yathāti` (8.4) — thành ngữ “sinh khởi thân phận lành, y như đã từng sinh khởi”, ý là
  người có trí sinh lại thân phận lành như xưa. Có thể đọc `yathā` là “như trước” hoặc là mệnh lệnh cầu
  nguyện; chọn cách trung tính là “y như đã từng sinh khởi”, không thêm “cầu cho” vì Pāli không có động từ cầu.
  `Nettā tatheva tiṭṭhanti` (3.3) — `nettā` là số nhiều của `netta` (mắt); “mắt ngươi cũng đứng yên như thế”.
  Câu 3.1–3.4 là lập luận của ma cãi: chân, đuôi, thân, mắt đều còn nguyên nên không phải chết.
  `Rudaṃ mattikathūpasmiṃ` (4.3) — khóc thành dòng phân; `mattika` = phân, `āthūpas` = dòng chảy. Dịch
  “nước mắt chảy thành dòng chảy phân” (giữ cả hai vế).
  `gatasattaṃ jaraggavaṃ` (1.4) — `gata-satta` = mạng đã tận, `jarā` + `gava` = lão xoắn, chết đi.
  `pitusokaṃ apānudi` (6.4) — `pitusoka` là nỗi khó đau **của người cha** (không phải của con); dịch “nỗi khó
  đau của người cha ấy” và giữ rằng người kia đã **đẩy đi** nó.

  DẤU LƯỢC — bài này **không có** `…pe…`.

  Ngoặc kép: 1.1 mở và 2.4 đóng (1.4 không đóng, vì kệ tiếp với 2); 3.1 mở và 4.4 đóng; 5.1 mở và 7.4 đóng;
  8.1–8.4 nằm trong nháy kép của 5.1. Đúng y như Pāli. Tự đếm lại: cân.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  Kiểm toán độc lập 2026-10-11 — bản 2026-10-04 BỊ HẠ ĐIỂM (9.01 → 8.87). Phần "ĐÂY LÀ BÀI KHÓ NHẤT LÁT…" và các phân tích từ nguyên ở trên được thay thế bởi mục này; các khẳng định sau của bản cũ là SAI và không còn hiệu lực: `goṇa` = người chăn trâu (đúng: con bò đực, bò thiến — `mato goṇo` = con bò đã chết, 2.2/3.4); `pāvaka` = cành cây khô (đúng: lửa, `ghatasittaṃva pāvakaṃ` = như lửa được rưới bơ lỏng); `mattikathūpasmiṃ` = dòng chảy phân (đúng: trên gò đất sét, mattikā = đất sét, thūpa = gò, đống); `daraṃ` = kẻ khiếp sợ (đúng: nỗi bức bối, tiền lệ pv17:8.4, pv18:16.4, pv25:13.4); `abbūḷhasallo` = hết nỗi khó đau (đúng: đã được nhổ mũi tên); `nettā` = mắt của "ngươi" (đúng: mắt của con bò).

  Lỗi nghĩa thật đã sửa — 19/36 khoá (0.3, 2.2, 2.4, 3.1, 3.2, 3.3, 3.4, 4.1, 4.2, 4.3, 4.4, 5.2, 5.3, 5.4, 7.1, 7.4, 8.3, 8.4, 9.1) có lỗi nghĩa thật; thêm 8 khoá chỉnh từ ngữ/tiền lệ/đại từ không đổi nghĩa (2.1, 2.3, 5.1, 6.1, 6.2, 6.3, 6.4, 7.3); tổng 27 khoá đổi chữ, 9 khoá giữ nguyên. Chia loại lỗi nghĩa thật: (1) ĐẢO PHỦ ĐỊNH, 4.1–4.2: `Nāyyakassa` = na + ayyakassa, "không thấy tay chân của ông, thân và đầu" — bản cũ dịch thành "tay chân, thân và đuôi người ấy đều thấy rõ", đảo hẳn lập luận của Sujāta (con bò còn nguyên nên có thể dậy; ông thì không còn thấy nữa — vậy ai ngu hơn?); (2) THỂ OPTATIVE bị đọc thành quá khứ, 2.2 và 3.4 `samuṭṭhahe` = có thể đứng dậy, không phải "đã thức dậy"; (3) TỪ VỰNG SAI, 5.2 pāvaka = lửa, 5.4 daraṃ, 3.2 `savāladhi` = có đuôi (bản cũ "còn đầy đủ sức lực"), 4.3 mattikathūpa, 7.1 `abbūḷhasallo`, tiêu đề goṇa; (4) CHỦ THỂ/NGƯỜI NÓI, 3.3 mắt của con bò chứ không phải mắt người đối thoại, 7.4 `māṇava` là hô cách ("này thanh niên", theo dn10; bản cũ đọc thành "bạch ngài"), 6.1–6.3 người ấy nhổ tên (ngôi ba, bản cũ gộp "người"); (5) CHỮ VÔ NGHĨA, "chết khốn" (2.2, 2.4, 3.4, 4.4), "nước sóng vọt vào", "làm cháy tan tất cả", "sinh khởi thân phận lành y như đã từng sinh khởi" (8.4: `sujāto` là TÊN RIÊNG Sujāta, người con trong Sujātajātaka (ja352), `pitaraṃ yathā` = như (Sujāta đối với) cha mình — bản cũ biến tên riêng thành tính từ "lành" và `pitaraṃ` thành "thân phận": đây là lỗi "tên riêng bịa từ danh từ chung" ngược chiều). Khoá giữ nguyên: 0.1, 0.2, 1.1–1.4, 7.2, 8.1–8.2 (đã đối chiếu, đúng); 3.1 lỗi vì `sīsaṃ` = đầu bị dịch thành "cái đuôi" ở bản cũ; 8.3 lỗi vì `vinivattayanti` là nguyên nhân cách (khiến quay khỏi) bị đọc thành "họ trở ra".

  Bối cảnh đã xác minh bằng Pāli root của ja352 (cùng bộ kệ, có lời dẫn thể kể): người cha khóc cha mình (`pitusokaṃ` = nỗi sầu vì cha, tức ông của Sujāta); Sujāta đem bò chết ra "cho ăn cỏ" để người cha tự nhận ra mình đang khóc vô ích bên gò đất. Vì vậy 1.1–2.4 là LỜI NGƯỜI CHA hỏi con; 3.1–4.4 là LỜI SUJĀTA đáp; 5.1–7.4 là lời người cha cảm tạ (3 kệ này giống nguyên văn pv17:8–10, pv18:16–18, pv25:13–15; đã dùng lại cách dịch đã có, chỉ đổi chủ ngữ/hô cách theo Pāli từng bài). Kệ 8 là lời kết của người kể. Việc xác định người nói dựa trên cấu trúc Pāli ja352 chứ không có lời dẫn trong pv8, nên không đưa tên vào thân kinh.

  BẤT ĐỊNH CÒN LẠI. (a) 2.4 `yathā taññova dummatī`: `yathā taṃ` là thành ngữ "như vẫn thế đối với…" (dn21, dn24, dn33), nhưng `taññova` có thể tách `taṃ + eva` hoặc `taṃ + añño + va`; ja352:2.4 đọc `yathā taṃ dummatī tathā`. Đã dịch trung tính "đúng như kẻ kém trí vẫn thế"; không phân xử được thêm vì tầng Anh (Sujato) không có pv8 lẫn ja352 ở commit ghim. (b) 3.3 `nettā` là số nhiều của `netta` (mắt), còn ja352:3.3 đọc `sotā` (tai) — hai bài khác chữ, không phải lỗi; giữ "đôi mắt". (c) 7.1 `Svāhaṃ` = so'haṃ (so + ahaṃ). (d) `ayyaka` dịch "ông" (ông nội/ông); Pāli không nói nội hay ngoại. (e) Tên bài: nghĩa `goṇapeta` — thân kệ không có ngạ quỷ nào; tiêu đề chỉ theo tên Pāli (bò + ngạ quỷ), không suy thêm; chưa kiểm được lời dẫn chú giải ở tầng ghim. (f) Việc `ja352` trong kho (Việt) có cùng lỗi (4.1–4.2, 5.2, 5.4, 6.x, 8.4 và các chữ "chết khốn", "dòng chảy phân") là NGOÀI PHẠM VI lượt này: báo để lượt riêng; không dùng ja352 Việt làm tiền lệ.

  ĐIỂM. Hạ `source_provenance` 9.5 → 9.0 (notes cũ khẳng định từ nguyên sai như thể đã kiểm); `semantic_fidelity` 8.9 → 8.7 (sau sửa còn 1 bất định 2.4 và việc gán người nói suy từ ja352, đồng thời bản đã publish trước đó sai nghĩa nặng nên không nâng); `grammar_logic` 8.9 → 8.8; `terminology` 8.9 → 8.8 (tiền lệ daraṃ/sallaṃ/māṇava đã theo đa số: daraṃ 3/3 pv, māṇava "này thanh niên" 219 khoá, `ghatasittaṃva pāvakaṃ` 3/3 "lửa được rưới bơ lỏng"); `vietnamese_clarity` 9.0 → 8.8; `han_viet_balance` 9.3 → 9.2; `ambiguity_integrity` 8.5 → 8.3; `segment_alignment` 10.0, `triangulation` 7.5 và `technical_integrity` 9.6 giữ nguyên. Tập khoá 36/36 khớp Pāli, thứ tự khớp, ngoặc kép khớp Pāli từng khoá, không `…`, NFC sạch, 0 cặp Pāli trùng nội bộ nên phép "Pāli trùng ⇒ Việt giống" rỗng. Điểm trung bình thô 8.87 (< 9.0) ⇒ không đủ để `published` theo cổng; `status` để công cụ xử lý (không sửa tay), blocker "không có tầng tham khảo tiếng Anh" giữ nguyên. Bốn lệnh cổng kỹ thuật `npm run validate`, `npm test`, `npm run check`, `npm run build` vẫn do điều phối chạy.
