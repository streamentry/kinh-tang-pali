notes: |-
  **Vì sao `draft`.** `ja401` không có tầng tham khảo nào ngoài Pāli: tầng `english-sujato` đã
  ghim có **83** tệp `ja` (ja1–ja79 cộng ja126, ja159, ja466, ja534 — tôi đếm lại từ
  `.cache/upstream/suttacentral/translation/en/sujato`), `ja401` không có mặt;
  `translation/vi/phantuananh/` tại commit đã ghim chỉ chứa Pháp Cú. `triangulation` vì thế
  chặn ở 7.5, đúng như phần lớn bài `ja` đã có (`ja300`–`ja412` đều 7.5 và đều `draft`).
  **Ghi rõ:** bài này `substantiveSegments = 0` (45 khoá đều là câu kệ ngắn hơn 40 ký tự), nên
  ngưỡng coverage 0.8 của `scripts/validate.ts:242` không chặn và `record-reference-gaps` không
  sinh entry — tức là `validate` sẽ không đỏ, nhưng mất tầng Anh là thật. Tôi đặt `draft` theo lệnh
  giao việc và để người điều phối quyết định giữa lấp `english-project` và ghi nhận vào
  `content/meta/reference-gaps.yaml`. Tôi không sửa tệp gap.

  **Mệnh đề, đo lại.** `ja:0.1` 433 tệp → `Jātaka` 407, `Chuyện Tiền Thân` 16, không có 10 ⇒
  `Jātaka`. `cp:0.1` 20 tệp → *Hạnh Tạng* 17, `Cariyāpiṭaka` 1 (`cp34`), không có 2 ⇒ ngoại lệ
  lạt là `cp34`.

  **Tên phẩm — đo theo giá trị Pāli tuyệt đối.** `Sattakanipāta`: **17/17** tệp đã dịch đều viết
  *Bộ Bảy Bài Kệ*, không có ngoại lệ, nên dùng nguyên văn. `Kukkuvagga`: **8/8** *Phẩm Kukku*.
  `0.4` không có bản nào trùng Pāli, tôi theo khuôn *N. Kinh X* (389/422 tệp `ja`, đo được), và
  tên `Paṇṇaka` có tiền lệ ở `ja405:11.3` (*Lại nữa Paṇṇaka, Senaka, Yācanako*) cùng là bài
  cuối cùng của chính Kukkuvagga này.

  **Pāli trùng nguyên văn: 6/45 khoá.** Dùng lại nguyên văn ở: `0.1`, `0.2`, `0.3`,
  `3.6` và `5.6` (hai khoá này có **cùng** một Pāli `taṁ me akkhāhi pucchito”.`; có 5 bản dịch
  khác nhau, tôi lấy của `ja435`/`ja439` — *xin hãy nói cho tôi biết điều ấy, tôi hỏi”.*, 2 bài
  nhiều nhất).
  **Một chỗ không có đa số, tôi phải tự chọn và ghi rõ:** `6.2` `appaṁ vā yadi vā bahuṁ;` có
  đúng ba bản dịch, mỗi bản một nơi (*ít hay nhiều,* ở an3.34; *dẫu ít ỏi đạm bạc hay nhiều ê
  hề;* ở ja346; *dù ít hay nhiều,* ở thag1.80). Tôi lấy *dù ít hay nhiều,* vì ngắn và không thêm
  chữ nào ngoài Pāli (*appaṁ* = ít, *bahuṁ* = nhiều).

  **Dấu lược và ngoặc.** `ja401` không có khoá nào chứa `…pe…`. Ngoặc kép bám Pāli từng khoá: mở ở
  `1.1`, `2.1`, `3.1`, `5.1`, `6.1`, `7.1` và đóng ở `1.6`, `2.6`, `3.6`, `4.6`, `5.6`, `6.6`, `7.4`.

  **Bất định, ghi ở đây chứ không thêm vào thân kinh — đây là bài dễ sai nhất của lát.** Bài này
  không có một bản Anh nào để đối chiếu, nên mọi chỗ dưới đây là **lựa chọn của tôi từ Pāli**:
  (1) `1.1`–`1.3` `Paṇṇakaṃ tikhiṇadhāraṃ … Parisāyaṃ puriso gilati`: tôi hiểu là *một viên đá
  mài sắc lẻm, một thanh kiếm vừa khít cỏn, người ta cũng nuốt vào* — nghĩa là việc khó gì cũng có
  thể làm. `tikhiṇadhāra` tôi dịch *sắc lẻm* (lưỡi sắc), `sampannapāyina` dịch *vừa khít cỏn*
  (cỏn kiếm vừa khít chuôi); `parisāya` tôi **không** dịch là *độc* vì không chắc, mà để nguyên
  nghĩa chung là vật nuốt vào — nếu cần, người điều phối nên cho lấp `english-project` rồi sửa lại
  khoá này. (2) `2.3`–`2.4` `Yo ca vajjā dadāmīti`: *đã cho rồi lại hối hận* — `vajjā` là hối
  hận, không phải *vay mượn*. (3) `4.1`–`4.2` `Na vācamupajīvanti, aphalaṃ giramudīritaṃ`: tôi dịch
  *không ai sống nhờ lời nói, lời nói ra khỏi miệng là vô ích*. Đây là chỗ tôi ít chắc nhất: có thể
  `vāca` ở đây là *sự sống bằng lời nói* theo nghĩa giới hạn, tôi giữ nghĩa khẳng định của Pāli và
  **không** thêm lời giảng nào vào thân kinh. (4) `7.2` `pukkusaporiso`: `pukkusa` là tiếng chê
  *hèn hạ*, `porīsa` là *kẻ đày ốc* (người bỏ đạt tông cộng) — tôi dịch *kẻ hèn hạ, kẻ đày ốc*;
  `atho` là *nếu không thì*, nên câu là cách buộc người kia phải trả lời, và tôi giữ đúng cách đó.
  (5) `āyuro` ở `3.1` và `7.1` tôi dịch *bậc tu sĩ*: tôi đã đếm *A-tu-si* trong tầng và có **0**
  tiền lệ, nên không tự đặt.

  **Cổng kỹ thuật.** Agent dịch không được chạy lệnh npm. Tôi tự kiểm: JSON hợp lệ, đủ 45/45
  khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp (bài không có lược), không
  `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không khoá nào trùng nguyên văn
  Pāli, thứ tự khoá đúng thứ tự số.