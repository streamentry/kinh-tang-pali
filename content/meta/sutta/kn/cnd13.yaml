notes: |-
  **Phạm vi: đủ 165/165 khoá của cnd13, không khoá nào ngoài tập khoá Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Todeyya (Pārāyana, câu hỏi thứ chín), tức bài kệ `snp5.10`. Cấu trúc như `cnd6` và `cnd12`: dẫn từng đoạn kệ rồi giải từng cụm; phần chú giải là các chuỗi từ đồng nghĩa mang tính công thức. Pāli của bài **không có** `(…)`; có 15 khoá chứa `…pe…` (đều thành đúng một `…`) và 30 khoá có `…` trần (đều giữ `…`); khoá `2.6` Pāli kết `…pe….` nên Việt kết ` ….`.

  **Cách trình bày lemma** theo `cnd6`/`cnd12`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. `Iccā` giữ nguyên Pāli ở `2.4`–`2.5` (như `cnd6:3.2`–`3.3`, `cnd12:2.4`–`2.5`) vì lời giải nói về chính hình thức của từ ấy. Hai khoá `15.1` và `21.3` là chỗ Pāli lược `…pe…` ngay trong một chuỗi lemma (`sadde …pe…`), nên bản Việt dẫn `nơi âm thanh …` rồi để các khoá sau (`15.2`–`15.30`, `21.4`) mang từng mục còn lại.

  **Tầng tham khảo — đo, không đoán.** Sujato không có `cnd13`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; tệp `cnd13_translation-en-sujato.json` không tồn tại, chỉ có tệp tên `cnd-name` (nhãn tác phẩm, không phải văn bản kinh). Lớp `english-project` cũng không có cnd13. `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự, bỏ khối `:0`) là **42** khoá; Sujato phủ 0/42 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/42, `vietnamese-current` 0/42. Có hai chứng cứ độc lập trong chính corpus, nhưng đều là bản của **bài khác** nên không tính là đối chiếu English của cnd13: (a) tám khối kệ ở `1`, `6`, `7`, `13`, `14`, `19`, `20`, `26` trùng Pāli với `snp5.10`, bài mà Sujato có dịch (`free of hope, or are they still in need of hope`, `still forming wisdom`, `has nothing, unattached to sensual life`); (b) công thức chú giải đã dịch ở `cnd6` và `cnd12`.

  **Dùng lại tiền lệ.** Đã dò 51 khoá có Pāli (đã bỏ thẻ in đậm; khớp cả dấu câu) trùng nguyên văn với khoá đã dịch ở tầng ngoài bài này: dùng lại nguyên văn ở 45 khoá, khác ở 6 khoá. Sáu khoá khác gồm: (i) `3.2`, `10.5` trùng Pāli với `snp4.10:9.4` nhưng khoá ấy đang mang chữ của dòng Pāli kế (*để đi đến hữu hay phi hữu* cho `Bhavāya vibhavāya vā`) nên không dùng lại; (ii) `7.2`, `13.2` trùng `snp5.10:2.2` (*(Đức Thế Tôn trả lời:)*) nhưng bản ấy bỏ hô ngữ `todeyyā`, trong khi chính chú giải `9.2` giảng đó là tên Đức Thế Tôn gọi vị Bà-la-môn; theo `cnd6:10.2` viết *(Này Todeyya, Đức Thế Tôn nói,)*; (iii) `26.1` trùng `snp5.10:4.1` nhưng bản ấy dịch `na ca āsasāno` là *không còn tạo cầu mong*, trong khi `āsasāno` là *đang cầu mong* (đối xứng với `āsīsati` ở `15.1`, `15.31`, `21.2`), nên viết *và không đang cầu mong*; (iv) `15.4` giữ `nơi xúc chạm …` theo `cnd12` và `sn35.14:1.15`, khác `sn35.20:1.6` (`nơi xúc …`). Đo thêm bằng cách bỏ dấu câu và chữ hoa/thường: 76 khoá trùng, 60 dùng lại, 16 khác; trong 16 khoá khác có 7 khoá khác về chữ (`7.2`, `9.4`, `13.2`, `15.4`, `20.1`, `21.6`, `26.1`; phần lớn thuộc các lý do (ii)–(iv) ở trên) và 9 khoá chỉ khác dấu câu, ngoặc kép hoặc chữ hoa (`1.1`, `2.2`, `2.8`, `7.1`, `8.8`, `14.1`, `15.32`, `20.4`, `25.2`; kệ so với lemma). Các kệ `14`, `19`, `20`, `26` lấy `snp5.10:3.1`–`4.4` từng dòng; `20.4`/`26.4` khớp `snp5.5:11.2` (cùng Pāli `akiñcanaṁ kāmabhave asattaṁ`).

  **Trong chính bài:** 26 nhóm Pāli trùng nguyên văn (36 cặp); 25 nhóm có bản Việt giống hệt, 1 nhóm khác (`1.5` với `5.2`: Pāli trùng, nhưng `1.5` là câu cuối của kệ hỏi nên kết bằng dấu hỏi, còn `5.2` là lời nhắc lại để đóng lemma nên kết bằng dấu chấm). Thêm 11 nhóm chỉ trùng khi bỏ dấu câu/hoa thường (kệ so với lemma, ví dụ `1.3`/`3.2`/`6.3`/`10.5`); khác ở dấu câu hoặc ở dạng câu hỏi, đều cố ý. Các cặp `1.1`/`8.1` và `1.2`/`2.3` Pāli chỉ khác đuôi `ti` và dấu câu, nên bản Việt chỉ khác dấu câu và hình thức lemma.

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `kathaṅkathā` → *nghi hoặc* (theo `snp5.10:1.4`, `2.4`); `vicikicchā` ở `11.1` → *hoài nghi*, **không** viết *nghi hoặc* để câu `kathaṅkathā vuccati vicikicchā` khỏi thành *nghi hoặc được gọi là nghi hoặc*. Đo: 92 khoá chứa `vicikicchā`, trong đó *nghi hoặc* 79, *nghi ngờ* 7, *hoài nghi* 6 (nên đây là lệch khỏi đa số có lý do); 9 khoá chứa `kathaṅkathā` (*nghi ngờ* 5, *phân vân* 5, *nghi hoặc* 4). `kaṅkhā` ở `11.2` → *nghi ngờ* (63 khoá: *hoài nghi* 29, *phân vân* 26, *nghi ngờ* 25) để không trùng với *hoài nghi* của `vicikicchā`.
  - `sakka` → *bậc Thích-ca* theo `snp5.10:3.3`. Lối chơi chữ `sakko` / `sakyakulā` / `sakko` (khả năng) ở `17.2`–`17.8` **không** giữ được trong tiếng Việt; `sakyakulā` dịch *dòng Sakya* theo 38 khoá chứa `sakyakulā` ở tầng (`dn4`, `dn5`, `dn6`…), nên người đọc phải đối chiếu cột Pāli để thấy cùng một chữ `sakko`.
  - `dhana` ở `17.4`–`17.7` → *tài sản* theo `dn33:2.3.5` và `dn34:1.8.4` (`saddhādhanaṁ` ở 14 khoá: *tài sản* 7, *của cải* 6, *tín tài* 1; chọn *tài sản* theo `dn33` và `dn34`, là hai khoá có đủ cả bộ bảy); `aḍḍho` → *giàu có*, `mahaddhano` → *nhiều của cải*, `dhanavā` → *có tài sản* (theo `dn5:13.4`, `mn129:48.2`). Đếm danh sách: 16 mục Pāli = 16 lần *tài sản* ở Việt.
  - `sabbaññutañāṇaṁ` → *trí toàn tri* (36 khoá chứa `sabbaññutañāṇ-`: *toàn tri* 16, *nhất thiết trí* 9; theo `mil5.1.2`, `mil6.3.1`). `samantacakkhu` → *bậc nhìn khắp* (18 khoá chứa `samantacakkhu`: *nhìn khắp* 11, *thấy khắp* 1, *toàn nhãn* 1; theo `snp5.10:3.4`, `cnd4:3.1`).
  - `senāsana` → *chỗ ở* (278 khoá: *chỗ ở* 175, *chỗ ngồi nằm* 36, *sàng tọa* 21); `āvāsa` → *trú xứ* để khác với `senāsana`. `gilānapaccayabhesajjaparikkhāra` → *thuốc men và vật dụng cho người bệnh* (55 khoá, 13 khoá đúng dạng này; `an8.86:12.1`, `an8.86:13.1`).
  - `kāmadhātu`/`rūpadhātu`/`arūpadhātu` → *dục giới / sắc giới / vô sắc giới* (bộ ba này: `dn33:1.10.29`, `dn34:1.4.35`; `mn115:8.4` dịch *giới dục, giới sắc, giới vô sắc*). `kāmabhava`/`rūpabhava`/`arūpabhava` → *dục hữu / sắc hữu / vô sắc hữu* theo `dn33`, `mn9`, `mn43`, `sn12.2` (19 khoá chứa `kāmabhav-`, 9 khoá dùng *dục hữu*). `saññābhava`… `nevasaññānāsaññābhava` → *hữu tưởng, hữu vô tưởng, hữu phi tưởng phi phi tưởng* theo `ps1.1:38.7`–`38.9` (quy ước *phi tưởng phi phi tưởng*, 168 khoá).
  - `ekavokārabhava`/`catuvokārabhava`/`pañcavokārabhava` → *hữu một / bốn / năm uẩn*: tiền lệ duy nhất là `ps1.1:38.10` (`ekavokārabhavo` → *hữu một trói buộc*, 1/1 khoá, không có `catuvokāra`/`pañcavokāra`). Không theo *trói buộc* vì `vokāra` ở đây là đơn vị đếm uẩn của một cõi hữu (cách hiểu truyền thống của chính loại `bhava` này); đây là lệch có lý do khỏi tiền lệ duy nhất, không có tầng Anh nào để kiểm.
  - `punabbhava` → *tái hữu* ở `24.9`, `24.10` (không phải *tái sinh*: trong 157 khoá chứa `punabbhav-`, *tái sinh* 104, *tái hữu* 9) vì ở đây là một loại `bhava` đứng cạnh `kammabhava` (*nghiệp hữu*); `paṭisandhiko` → *kết sinh* (0 tiền lệ cho `kammabhava`; `paṭisandhik-` ở 44 khoá, 42 khoá dịch *tái sinh*).
  - `kiñcana` → *sở hữu* theo kệ (`akiñcanaṁ` → *không sở hữu gì*, 21/37 khoá chứa `akiñcan-` dùng *không sở hữu*; `snp5.5:11.2` cùng Pāli và cùng cách dịch); `dn33:1.10.70` dịch `kiñcanaṁ` là *vướng bận* (1 khoá), không theo vì cả bài này giảng `akiñcana` bằng `kiñcana`.
  - `diṭṭhasutamutaviññātabbe dhamme` → *các pháp nên thấy, nên nghe, nên cảm nhận, nên biết* (4 khoá chứa `diṭṭhasutamutaviññātabb-`, 3 khoá dùng đúng dạng này: `sn35.95`, `an4.24`).
  - `āsīsati` → *cầu mong* (khớp `nirāsaso`/`āsasāno` ở kệ), `icchati` → *mong muốn*, `sādiyati` → *chấp nhận* (23 khoá chứa `sādiyati`, đều nghĩa *nhận/chấp nhận*), `pattheti` → *ước muốn*, `piheti` → *khao khát*, `abhijappati` → *thầm cầu* (0 tiền lệ). `sataṇho` → *người còn tham ái* (đối xứng với `nittaṇho` → *không còn tham ái*).
  - `sūro vīro vikkanto abhīrū acchambhī anutrāsī apalāyī`: bốn từ sau theo `sn3.24:2.3` và `sn11.3:12.2` (*không nhút nhát, không run sợ, không hoảng sợ, không bỏ chạy*); `pahīnabhayabheravo` → *đã đoạn tận sợ hãi và khiếp đảm* (6 khoá, `mn92`, `snp3.7`); `vigatalomahaṁso` → *không còn sởn tóc gáy* (`sn6.13:4.4`).
  - Lệnh dạy (`18.3`) theo `cnd12:10.4`: *giải thích, giảng dạy, trình bày, an lập, khai thị, phân tích, làm cho hiển lộ, công bố*. `tiṇṇo uttiṇṇo nitthiṇṇo atikkanto samatikkanto vītivatto` theo `cnd12:25.5`. Chuỗi `natthi na atthi na saṁvijjati nupalabbhati … ñāṇagginā daḍḍhā` theo `cnd6:4.2`, `cnd6:13.3`; `visaññutto vimariyādikatena cetasā` theo `cnd6:6.1`.
  - Nhãn: `Cūḷaniddesa` → *Tiểu Tập Kể Lược*, `Pārāyanavagganiddesa` → *Kể Lược Phẩm Bờ Kia*, `Pucchāniddesa` → *Kể Lược Các Câu Hỏi*, tên bài và colophon theo `cnd12:0.1`–`0.4`, `27.3` (*niddesa* → *Kể Lược*; người biên tập có thể đổi hàng loạt khi chốt tên).

  **Số Pāli.** `dve kāmā` = 2 (*hai loại dục*) và `dve bhavā` = 2 (*hai loại hữu*); chuỗi ái ở `10.2` có 6 mục (`rūpa`, `sadda`, `gandha`, `rasa`, `phoṭṭhabba`, `dhamma`) và Việt có 6; `aṭṭhasamāpatti` = 8 (*tám thiền chứng*), `pañcābhiññā` = 5 (*năm thắng trí*); `ekavokāra`/`catuvokāra`/`pañcavokāra` = 1/4/5 (*một/bốn/năm uẩn*); `rāga`… `duccarita` ở `24.2` có 7 mục và Việt có 7; danh sách 12 tính từ ở `17.8` (`bhaya` + `bherava` gộp một cụm) khớp 12 cụm Việt. Không có số lớn, không có `sahassa`/`sata`/`navuti`, không có cụm `tiṁsakappasahassa`; phép kiểm số chạy trên các số nhỏ nêu trên và đều khớp cấu tạo từ.

  **Bất định (không thêm vào thân kinh).**
  1. `14.2`, `16.1`–`16.4`, `20.2`, `22.1`–`22.4`, `26.2` `paññakappī`: kệ dùng lại `snp5.10:3.2`, `4.2` (*đang tạo trí biết*, khớp Sujato *still forming wisdom*); nhưng chú giải `16.3`/`22.3` giảng `kappī` là người *dựng nên* `taṇhākappa` hay `diṭṭhikappa` nhờ trí (tám thiền chứng, năm thắng trí, tà trí). Bản Việt dịch chú giải bằng *tạo dựng sự tạo dựng của tham ái/của kiến* để người đọc thấy cùng gốc `kapp-` với *tạo* ở kệ; chưa chắc *tạo trí biết* ở kệ đã nói đúng cùng cách đọc ấy. Người biên tập quyết định có thống nhất cả `snp5.10` và `cnd13` không. Tầng không có tiền lệ nào cho `taṇhākappa`/`diṭṭhikappa`.
  2. `20.1`, `26.1`, `21.1`, `21.6` `na ca āsasāno` → *không đang cầu mong*, **khác** `snp5.10:4.1` (xem mục dùng lại tiền lệ). Không sửa `snp5.10` (ngoài lát).
  3. `18.2` `yaṁ pasādemi` → *điều con khẩn cầu*: 0 tiền lệ; `pasādeti` có nhiều nghĩa (làm cho trong sáng, làm cho hoan hỷ, nài xin) và chuỗi này là bốn động từ xin; chọn nghĩa *nài xin* theo vị trí trong chuỗi `pucchāmi yācāmi ajjhesāmi pasādemi`, không chắc.
  4. `11.2` `chambhitattaṁ cittassa manovilekho`: `manovilekha` 0 tiền lệ; dịch sát chữ *sự xáo trộn trong ý*. `chambhitattaṁ` giữ đúng chữ của Pāli ghim (69 khoá chứa `chambhitattaṁ` ở tầng, đa số dịch *sợ hãi/khiếp*), dù trong công thức hoài nghi này dạng gốc có thể là `thambhitattaṁ`.
  5. `5.1` `kiṁsaṇṭhito kiṁpakāro kiṁpaṭibhāgo icchitabbo`: 0 tiền lệ cho ba từ đầu; `icchitabbo` (11 khoá) dịch *cần được mong đợi*. Nghĩa của `kiṁpaṭibhāgo` (*giống với cái gì*) chưa phân xử được bằng chứng độc lập.
  6. `24.9`, `24.10` `kammabhavo`, `paṭisandhiko punabbhavo`: 0 tiền lệ; dịch *nghiệp hữu*, *tái hữu kết sinh* (xem thuật ngữ).
  7. `25.1` `asattaṁ alaggaṁ alaggitaṁ apalibuddhaṁ`: 0 tiền lệ; chỉ nửa sau `nikkhantaṁ nissaṭaṁ vippamuttaṁ visaññuttaṁ vimariyādikatena cetasā` có tiền lệ (`cnd6:6.1`). Bốn từ đầu dịch *không dính mắc, không bị dính vào, không bị vướng vào, không bị cản trở* theo nghĩa gốc từ.
  8. `17.8` `pahu visavī alamatto sūro vīro vikkanto`: sáu từ đầu ít tiền lệ (`visavī` 1 khoá, `alamatto` *đủ sức* ở `mn82:38.5`); dịch gần nghĩa *có khả năng, có quyền năng, đủ sức, anh dũng, dũng mãnh, quả cảm*, sắc thái giữa `sūro`, `vīro`, `vikkanto` chỉ phân biệt được bằng chữ Việt khác nhau, không có chứng cứ độc lập.
  9. `12.2` `Yena vimokkhena vimucceyya vimutto so`: dịch sát (*nhờ sự giải thoát nào mà có thể được giải thoát, người ấy đã giải thoát*), hơi nặng nhưng không thêm chữ để làm rõ.
  10. `2.1`, `8.7` `na saṁvasanti na āvasanti na parivasanti`: bốn động từ `vasati` có tiền tố khác nhau (`saṁ-`, `ā-`, `pari-`); dịch *trú ngụ, cùng trú ngụ, cư ngụ, lưu trú*; sắc thái tiền tố chưa phân xử được.
  11. Lỗi ngoài lát, báo chứ không sửa: `snp4.10:9.3`–`9.4` (Pāli `Bhavāya vibhavāya vā` / `taṇhā yassa na vijjati`) đang mang chữ Việt đảo chỗ — `9.3` là *khát ái của vị ấy không còn*, `9.4` là *để đi đến hữu hay phi hữu*; hai dòng cần hoán đổi. Phát hiện qua việc `3.2`, `10.5` ở bài này trùng Pāli với `snp4.10:9.4`.

