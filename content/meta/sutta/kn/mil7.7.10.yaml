  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 29 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.4 — bỏ dấu *:* thừa trước *—* (Pāli kết bằng một dấu gạch `—`); giữ *Thiên Trung Thiên* cho `devātideva` (modal *đấng Thiên Nhân* ở `mil7.7.7:3.4` và `mil7.8.1:1.5` là nghĩa khác) và *Này Đại vương* cho `mahārāja`.

  Quyết định hội đồng biên tập 2026-10-16: B6 — mil7.7.10:4.4 (sati ở Milinda = “niệm” hoặc “trí nhớ”, “chánh niệm” chỉ cho sammāsati).
