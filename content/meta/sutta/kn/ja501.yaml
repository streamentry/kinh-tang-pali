notes: |-
  Đợt 19, làn 86. Dịch từ Pāli root commit đã ghim, đủ 121/121 khoá (0.1–0.4, 1.1–29.4, 30.1), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung (xem bất định 1).

  **Tiêu đề.**
  - `0.1` “Jātaka”, `0.2` “Bộ Hai Mươi Bài Kinh”, `0.3` “Phẩm Mātaṅga”: dùng lại nguyên văn. `0.2` trùng Pāli với 17 khoá đã dịch (17/17 giống), `0.3` trùng với 7 khoá (7/7 giống: `ja497`, `ja498`, `ja502`, `ja504`, `ja508`, `ja509`, `ja510`). `0.1`: đo 502 cặp, 486 giống “Jātaka”, 16 khác (“Chuyện Tiền Thân”, nhóm bài cũ); chọn “Jātaka” theo đa số áp đảo và theo bảy bài cùng phẩm.
  - `0.4` “5. Kinh Nai Rohaṇa” và `30.1` “Kinh Nai Rohaṇa, thứ năm.”: tên bài `Rohaṇamiga-jātaka` = nai + tên riêng `Rohaṇa` (giữ phiên âm). Tầng có 8 tiêu đề dạng `…miga-jātaka`: “Nai …” 4 (`ja11` “Nai Lakkhaṇa”, `ja14`, `ja21`, `ja206`) · “Con Nai …” 3 (`ja12`, `ja16`, `ja359`) · giữ nguyên Pāli 1 (`ja483`). Chọn “Nai Rohaṇa” theo đa số và theo `ja11` (cùng khuôn “tên riêng + nai”). Số thứ tự: `0.4` ghi `5.` và `30.1` ghi `pañcamaṁ` (thứ năm) khớp nhau. Dấu phẩy trước số thứ tự ở `30.1`: trong các tiêu đề kết thúc Jātaka đã dịch, kiểu “…, thứ N” chiếm 269 · kiểu không phẩy 232 (từ `ja490` trở đi: 11 · 2), nên dùng có phẩy như `ja502`, `ja504`.

  **Pāli trùng nguyên văn trong chính bài (đã quét sau khi nén khoảng trắng): 39 khoá, 13 nhóm, 0 nhóm có bản Việt khác.** Cụ thể: `1.3`=`3.3`=`5.3`=`7.3`; `1.4`=`3.4`=`5.4`=`7.4`; `2.1`=`4.1`=`6.1`=`8.1`; `2.2`=`4.2`=`6.2`=`8.2`; `2.3`=`6.3`; `2.4`=`4.4`=`6.4`=`8.4`; `3.1`=`7.1`=`13.1`; `3.2`=`7.2`=`13.2`; `4.3`=`8.3`; `11.4`=`12.4`; `14.4`=`15.4`; `17.2`=`18.2`=`19.2`; `17.3`=`18.3`. Mọi nhóm đều giữ cùng một bản Việt, kể cả khi người nói khác nhau (`3.1`–`3.2` là lời Rohaṇa, `13.1`–`13.2` là lời một người anh em đang cầu xin; Pāli dùng chung một công thức). Phần đầu khổ (`2.1`–`2.2`) lặp nguyên với `4.1`, `6.1`, `8.1`; khổ `2` và `6` giống hệt nhau cả bốn dòng, khổ `4` và `8` cũng vậy.

  **Pāli trùng với khoá đã dịch ở nơi khác trong tầng.** Đã dò toàn tầng (so Pāli sau khi nén khoảng trắng, hạ chữ hoa, bỏ dấu câu): 549 cặp ở 8 khoá của bài, trong đó 526 cặp thuộc 3 tiêu đề `0.1`–`0.3` (510 giống, 16 khác, cả 16 đều ở `0.1`; đã nêu ở trên) và 23 cặp thuộc thân kệ (`15.1`, `15.2`, `15.3`, `21.3`, `23.2`; 15 giống, 8 khác). Tổng 549 cặp: 525 giống, 24 khác.
  - Dùng lại nguyên văn: `15.1` “Mong rằng bác thợ săn cũng được hoan hỷ như thế” ← `ja359:5.1`, `ja502:13.1`; `15.2` “cùng với toàn thể quyến thuộc bà con” ← `ja359:5.2`, `ja502:13.2` và 7 khoá khác (9/10 giống); `15.3` “như chính tôi ngày hôm nay hoan hỷ” ← `ja502:13.3` (cặp khác duy nhất là `ja359:5.3`, vì ở đó người nói là nữ: “thiếp”).
  - Cặp khác có chủ ý: `15.1` khác `ja399:7.1` (“Ngươi tham lam, hãy vui mừng thế này”): đó là lời nói với một người thợ săn tham lam, bối cảnh khác; ở đây là lời chúc của nai nói với người đã tha cho mình. `21.3` “Thế nhưng vì cớ sao” ← `ja392:2.3`, `ja394:1.3`, `ja394:4.3` (3/3 trong nhóm Jātaka gần nhất; `ja321:1.3` “Thế nhưng do bởi cớ sự làm sao” và `ja458:3.3`, `sn9.14:3.3` là cặp khác). `23.2` “đáng kinh ngạc, làm dựng tóc gáy” theo `thig11.1:1.4` “đáng kinh ngạc, rợn da gà” và `thag6.1:2.4` “thật kinh ngạc, dựng tóc gáy bàng hoàng” (2 cặp, đều khác chữ vì khuôn câu khác nhau).

  **Số Pāli** (tự tính, không chép từ bản khác): `pañca` (13.3) = 5 → “năm”; `dve` (28.1) = 2 → “hai”; `sata` (27.1 `nikkhasataṁ`, 28.2 `gavaṁ sataṁ`) = 100 → “một trăm” hai chỗ; `muhuttaṁ` (10.1) = “một lát”; `ekamātukā` (12.2) = “chung một mẹ”; `0.4` ghi `5.` và `30.1` `pañcamaṁ` = 5. Trong thân kệ không có số lượng nào khác cần tính.

  **Thuật ngữ và tiền lệ, đã đo (không đo bằng mẫu, đếm toàn tầng):**
  - `subhāsita` (17.3, 18.3, 19.3): 162 khoá chứa gốc này, “khéo nói” 70 · “nói hay” 40 · “nói tốt” 8 (riêng Jātaka: “nói hay” 5 · “khéo nói” 4, gần như bằng nhau); chọn “khéo nói” theo đa số toàn tầng (`snp3.3` “Kinh Khéo Nói”). `kaṇṇasukha` (17.1…): 22 khoá, “êm tai” 9 · “dễ nghe” 7 · “dịu tai” 1; `hadayaṅgama` (17.2…): 23 khoá, “thấm” 9 · “đi vào” 7 · “thấu” 4 → “êm tai”, “thấm vào tim” (theo `ja492:8.1`). `hadayassita` (17.2): 0 tiền lệ; dịch “nương nơi tim”, cách đọc khác: “gắn với tim”.
  - `luddaka`/`ludda`: 17 khoá chứa gốc này, 12 khoá có “thợ săn” (trong đó 3 khoá “bác thợ săn”: `ja359:3.2`, `ja359:5.1`, `ja502:13.1`, cả ba là lời loài vật nói với thợ săn). Dùng “bác thợ săn” ở lời các con nai gọi thợ săn (`12.1`, `13.4`, `15.1`), “hỡi thợ săn” ở lời vua gọi (`21.1`, `24.1`, `27.1`, `28.4`, `29.2`), “người thợ săn” khi nhắc đến ông ấy ở ngôi ba (`9.1`, `16.4`, `19.4`, `20.1`).
  - `mātāpettibhara` (14.2, 26.3): 10 khoá, “phụng dưỡng” 6 · “nuôi dưỡng” 4; cả 3 khoá cùng dạng đối cách (`mātāpettibharaṁ jantuṁ`, sn11) dịch “phụng dưỡng cha mẹ” → “phụng dưỡng cha mẹ”.
  - `sādisī`/`sādisiyo` (28.1): 8 khoá chứa gốc này, “đồng đẳng” 4 (cả 4 là `dn19`, `cattārīsā bhariyā sādisiyo`) · “xứng đôi” 2 (`ja502:18.1`, `ja502:19.1`) · khác 2; hai phạm vi cho đa số khác nhau. Chọn “xứng đôi” theo phạm vi Jātaka gần nhất; “đồng đẳng” là cách của dn19, ngữ cảnh khác (vợ của một quan Bà-la-môn).
  - `nikkha` (27.1): danh từ này trong Jātaka đã dịch 4 khoá: giữ phiên âm “nikkha” 3 (`ja478:10.3`, `ja478:13.3`, `ja494:14.2`) · “đồng vàng” 1 (`ja89:1.4`, cùng hợp từ `nikkhasataṁ` → “trăm đồng vàng”). Giữ “nikkha” theo 3/4, vì nó là đơn vị vàng, không chắc là đồng tiền. `maṇikuṇḍala` (27.2): 33 khoá, “hoa tai ngọc” 14 → “hoa tai ngọc” (dùng cho một chiếc vì Pāli số ít). `thūla` (27.2) “lớn”.
  - `dhammika` (24.2, 26.2): 236 khoá chứa gốc `dhammik-`, “đúng pháp” 33 · “chân chánh” 21 · “hành đạo” 1 → “sống đúng pháp” (con nai theo pháp). `bhīru` (5.1, 10.3): 6 khoá Jātaka, “nhút nhát” 5 → “người nhút nhát”.
  - `mahāmiga` (14.4, 15.4): 8 khoá, “nai chúa” 3 · “chúa loài nai” 1 (`ja359`) → “nai chúa”; `migarāja` (22.3) → “chúa loài nai ấy” (nai Rohaṇa cụ thể; tầng dịch `migarāja` là “chúa loài thú” ở `ja492:6.1`, nơi nó chỉ sư tử).
  - `deva` (26.1, 26.3, vocative thợ săn gọi vua): 16 khoá Jātaka, “tâu đại vương” 7 · “tâu vua” 1 · “bạch ngài” 1; dùng “tâu đại vương” như `ja498:3.3`.
  - `iṇadāna` (29.1): “cho vay” 2/3 (`ja484:8.1`, `ja484:12.1`). `kasi-vāṇijjā` (29.1): “cày cấy, buôn bán”.
  - `dāra`/`dārehi` (20.2, 29.3): “vợ” theo `ja498:13.3` “Con cái và vợ” (8 khoá, đều “vợ”). `jīvitassapi kāraṇā` (11.4, 12.4): “dù vì mạng sống” theo `jīvitahetupi` ở `ud5.5:20.2`, `ud5.5:20.3`, `mil4.6:1.4` (3 khoá, cùng khuôn “dù vì mạng sống”).
  - `jahissāmi`/`hissāmi` (2.3, 2.4, 4.3, 23.4): 0 khoá khác chứa dạng này; dịch “bỏ bạn”, “bỏ mạng” (cùng động từ `hā`).
  - `saṁvego` (23.1): 4 khoá khác, bốn cách (“kinh cảm sâu sắc” `thig5.6:3.1` Pāli gần nhất `Tassā me ahu saṁvego` · “xúc cảm kinh sợ” `thag6.1:2.3` · “hối hải” `thag8.3:1.3` · “ghê tởm” `thig11.1:1.3`), không có đa số; chọn “nỗi xúc động” cho gọn, đã gắn với `abbhuto lomahaṁsano` ở dòng kế.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 24 dấu mở và 24 dấu đóng, Việt đúng như vậy, lệch 0/121 khoá. Nháy đơn `‘’`: Pāli 1 cặp ở `21.2`, Việt 1 cặp ở `21.2`. Pāli không đóng nháy theo từng khổ ở ba chỗ (mở `17.1` đóng ở `19.4`; mở `22.1` đóng ở `23.4`; mở `27.1` đóng ở `29.4`) vì lời nói kéo dài qua nhiều khổ; giữ nguyên như vậy, không thêm nháy để làm cân. Dấu lược `…` và `(…)`: Pāli 0, Việt 0.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói và xưng hô (mọi khổ): chỉ suy ra từ nội dung kệ. Cách đọc đã dùng: `1.1`–`1.4`, `3`, `5`, `7` Rohaṇa (đang bị bẫy) nói với `Cittaka` và với “người nhút nhát” (`5.1`); `2`, `4`, `6`, `8` người ở lại đáp (gọi `rohaṇa`); `9` một trong những người ở lại; `10` kể về người đã quay lại (`sā`, giống cái; ngôi ba, vì `upanivattatha` là ngôi ba như `nivattatha` ở `ja504:22.3`, không ghi rõ là Rohaṇa hay thợ săn kể); `11` thợ săn hỏi Rohaṇa; `12` Rohaṇa đáp; `13` một người anh em cầu xin thợ săn; `14` thợ săn; `15` người anh em; `16` cha mẹ hỏi Rohaṇa (`putta`); `17`–`19` Rohaṇa kể; `20` cha mẹ; `21`, `24`, `27`–`29` vua; `22`–`23`, `25`–`26` thợ săn. Các con nai xưng “tôi” và gọi nhau “bạn” theo trung tính (như `ja502`), vì Pāli chỉ nói `bhātaro` (anh em) mà không nói ai là anh, ai là em; không gán thứ bậc vào thân kinh. `Cittaka` (1.2, 17.4) và `Sutanā` (18.4) được đọc là tên riêng theo song song với `cittako` ở `17.4`; `sutanā` cũng có thể là tính từ giống cái; chọn tên riêng vì khuôn lặp `17`–`19`.
  2. `patiyanti` (1.1): 0 tiền lệ; không rõ gốc từ (có thể liên quan `paṭi-` “trở lại”). Dịch “rút chạy” theo `bhītā maraṇassa` (“sợ cái chết”); cách đọc khác: “đang quay trở lại”.
  3. `jīvissanti tayā saha` (1.4…): chủ ngữ “họ” là cha mẹ mù hay cả đàn, chưa chắc; `3.1`–`3.2` gợi là cha mẹ (`andhā apariṇāyakā`). Dịch “họ”, không ghi rõ.
  4. `avakassati` (2.2): 0 tiền lệ; “bị giằng kéo”, cách đọc khác: “bị kéo xuống / thắt lại”.
  5. `kūṭe … āyase` (5.2) và `kūṭapāsa` (16.4, 22.2): 0 tiền lệ cho `kūṭapāsa` (tầng có 257 khoá chứa `kūṭ-` với nghĩa khác: búa, đỉnh, lừa đảo); dịch “cái bẫy sắt” và “cạm bẫy”. Không rõ `kūṭapāsa` là loại bẫy nào.
  6. `Pañcannaṁ jīvitaṁ dehi` (13.3): “năm” chưa xác định là ai; Pāli không liệt kê. Dịch “năm kẻ”; không thêm danh sách (cha, mẹ, hai anh em…) vào thân kinh.
  7. `So vo ahaṁ pamokkhāmi` (14.1): `vo` đọc là “cho các ngươi”; cách đọc khác: “của các ngươi”. `Sohaṁ` ở `ja494:13.1` dịch “Ta đây”, làm theo.
  8. `āhariṁ` (21.2): thì aorist ngôi nhất; không biết lời thợ săn là “đã mang” hay “sẽ mang”; dịch không đánh dấu thì (“Tôi mang da nai về”). `nāhari` (21.4) “không mang về”.
  9. `hatthatthaṁ` (22.1): 0 tiền lệ; “tầm tay”. `Abajjhi taṁ migarājaṁ` (22.3): dạng động từ không rõ chủ thể (cạm bẫy trói, hay thợ săn trói, hay bị động); dịch bị động “đã bị trói”, trung tính về tác nhân. `muttā upāsare` (22.4, 11.2): “những kẻ đã thoát ở bên nó”.
  10. `ajja hissāmi jīvitaṁ` (23.4): đọc là “hôm nay tôi sẽ bỏ mạng” (điều kiện: nếu giết con nai này); không giải thích thêm lý do.
  11. `catussada` (27.3): không dịch; tầng có 1 khoá khác (`ja488:7.1`, `catussadaṁ gāmavaraṁ` → “dồi dào bốn thứ”), nghĩa ở đây có thể là “có bốn phần nổi / bốn mặt”; số `catu` = 4 giữ nguyên trong chữ phiên âm. `pallaṅka` (27.3) → “ghế dài”: tầng chỉ có nghĩa “ngồi kiết già” (`ud5.10:1.3`…), 0 tiền lệ cho nghĩa vật dụng; cách đọc khác: giường ghế dài, ngai. `umāpupphasarinnibha` (27.4) “giống như hoa umā”: `umā` là hoa gì chưa kiểm (có thể hoa lanh), 0 tiền lệ; không thêm “xanh” vào thân kinh.
  12. `na te so abhihārituṁ` (26.4): “không được mang nó đến cho ngài”. “Không được” cố ý mơ hồ giữa “không thể” và “không nên”; `so` số ít đối với `migā` số nhiều ở `26.1`–`26.3` (đọc là con nai Rohaṇa).
  13. `kāressaṁ` (28.3): dịch “sẽ cai trị”; có thể là “sẽ khiến (người khác) cai trị”. `uñchācariyā` (29.2): “sống nhờ mót nhặt”, 0 tiền lệ cho hợp từ; tầng chỉ có `uñchāpattāgate` (“phần vụn rơi trong bát xin ăn”), khác ngữ cảnh.
  14. `bāḷhaṁ kho ne pasaṁsasi` (24.4): “hết lời khen ngợi”, `bāḷhaṁ` là “mạnh, nhiều”; chữ “hết lời” là cách diễn đạt tiếng Việt cho mức độ ấy, không thêm nghĩa.

