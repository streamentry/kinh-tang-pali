notes: |-
  **Nguồn.** Pāli root từ snapshot bilara đã ghim `11c9d708978cde8ba61096d8a75f7ddfb846f639`,
  đường dẫn `kn/cp/cp23_root-pli-ms.json`. Bản Anh tham khảo là Bhikkhu Sujato cùng commit,
  **44/45 khoá có chữ**, khoá rỗng duy nhất là `:11.1` (dòng ghi số thứ tự) — như mọi bài `cp`.
  `translation/vi/phantuananh/` chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để
  đối chiếu.

  **Coverage: `substantiveSegments = 0`** — cả 45 khoá đều là câu kệ ngắn hơn 40 ký tự, nên
  ngưỡng 0.8 của `scripts/validate.ts:242` và `scripts/queue.ts:86` không áp dụng, và
  `record-reference-gaps` cũng bỏ qua bài này. Không cần entry trong
  `content/meta/reference-gaps.yaml`. Tầng Anh ở đây vẫn **có đủ** (44/45). Ba bài Jātaka của
  lát (ja354, ja401, ja416) mới là chỗ thật sự mất tầng Anh — xem `notes` của chúng.

  **Mệnh đề `cp:0.1`** đo lại: 20 tệp `cp` → **17** *Hạnh Tạng*, **1** `Cariyāpiṭaka` (`cp34`),
  2 không có. `cp23:0.1` trùng nguyên văn với **21** bài (kể cả `cp11` vừa ghi trong lát này),
  nên luật dùng lại nguyên văn sẽ ra `Cariyāpiṭaka`; tôi theo số đông *Hạnh Tạng* như đã nêu ở
  `cp11`. `cp23:0.2` `Yudhañjayavagga` trùng 9 bài, tất cả đều *Phẩm Yudhañjaya* ⇒ dùng lại.
  `cp23:0.3` theo khuôn `cp21` (Thứ Nhất) và `cp24` (Thứ Tư) ⇒ *Xuất Gia Ba-la-mật Thứ Ba*.

  **Pāli trùng nguyên văn: 10/45 khoá.** Dùng lại nguyên văn ở: `0.1`, `0.2`, `1.1` (14 bài,
  trong đó 9 viết *“Lại nữa, vào thời thuở nọ,* — cp12/cp13/cp17/cp18/cp2/cp3/cp5/cp6/cp7),
  `3.3` (18 bài, 7 cách; lấy *ta giơ hai tay lễ rồi,* — 4 bài, nhiều nhất), `9.1` (cp2:8.1 —
  *Sau khi đã suy nghĩ như vậy,*), `9.3` (8 bài, 5 cách; lấy *như thớt voi bẻ gãy mọi trói
  buộc,* — 4 bài, nhiều nhất), và **cả cụm `10.1`–`10.4` trùng nguyên văn `cp21:6.1–6.4`**.
  Vì vậy `10.1`–`10.4` của tôi chép lại y hệt, kể cả cách `cp21` đóng ngoặc bằng `”` mà bỏ `ti`
  — đó cũng là quy ước đa số của tầng, không phải lỗi riêng của tôi.
  Riêng `10.3` có hai cách: `cp21:6.3` viết *Mà vì Nhất Thiết Chủng Trí là điều quý báu nhất đối
  với ta,* (2 bài) còn `cp3:8.3`/`cp5:3.3` viết *tôi thương yêu điều toàn biết,* — tôi lấy của
  `cp21` vì cùng bộ và cùng phẩm.

  **Dấu lược và ngoặc.** `cp23` không có khoá nào chứa `…pe…`. Pāli mở `“` ở `1.1`, đóng `”` ở
  `10.4`; lời của vua cha (`2.1`–`2.4`) và lời của chính bậc Bồ-tát với bản thân (`4.1`–`4.4`
  rồi lại `8.4`) được Pāli đặt trong `'` nên tôi dùng nháy cong `‘…’`.

  **Bất định đã phân xử, ghi ở đây chứ không thêm vào thân kinh.** (1) `6.1`
  `Pūtikuṇapasampuṇṇā` = đầy mùi xác thối của thai nhi; `pūti` là *thối*, `kuṇa` là mùi hôi
  tanh, nên tôi dịch *lòng tôi đầy mùi thối ươm* thay vì chép sát *xác chết* của Sujato — Sujato
  dịch quá mạnh (`carcass`), còn Pāli nói về mùi. (2) `5.1`–`5.2` `Idaṁ loke uttariyaṁ` là
  mệnh đề chủ, tôi dịch *là điều chưa từng có ở thế gian này* chứ không dịch `uttariyaṁ` như
  một danh từ riêng. (3) `4.3` `nirārakkhā sake gehe` = không có chỗ tựa che chở trong chính
  nhà mình; tôi giữ *nơi tựa để che chở* thay vì rút gọn thành *không có nơi che chở*, để không
  mất chủ *chính nhà mình*. (4) `10.2` `mahāyasa` tôi dịch *danh vọng lớn lao* — đây là nguyên
  văn của `cp21` nên tôi không tự sửa, dù *danh vọng lớn* sẽ bớt nặng nề hơn; ghi ra đây để
  biên tập biết đó là hệ quả của luật dùng lại nguyên văn. (5) `:0.4` giữ tên riêng `Ayoghara`
  như `cp21` giữ `Yudhañjaya`, còn trong thân bài `ayoghara` dịch *nhà sắt* theo Sujato.

  **Cổng kỹ thuật.** Agent dịch không được chạy lệnh npm. Tôi tự kiểm: JSON hợp lệ, đủ 45/45
  khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp (bài không có lược), không
  `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không khoá nào trùng nguyên văn
  Pāli, thứ tự khoá đúng thứ tự số.