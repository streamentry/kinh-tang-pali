notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Kuṇḍadhāna trong phẩm Dutiyavagga.

  **Bốn vế trùng nguyên văn `dhp370:1-4`** — Pháp Cú đã `published` trong chính tầng này, khác ở chỗ
  `dhp370:4` có dấu nháy quanh `oghatiṇṇo`. Tôi theo lại đúng công thức đó (Hãy cắt năm, bỏ năm, …
  được gọi là người đã vượt bộc lưu) theo BRIEF_VI3 §6.

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1): 10 bản trên đĩa mở rộng,
  5 bản giữ lược. Xem `thag1.112.yaml`. Cả hai đều giữ 2 dấu lược như Pāli.

  **Thứ tự khoá tiêu đề: theo PĀLI** (`0.3` = phẩm, `0.4` = tên bài kệ); 12 bản thag đã publish đặt
  ngược, tôi không sửa chúng.

  **Không đối chiếu được tầng Việt hiện hành** (bilara chỉ có Pháp Cú). Sujato có 8/9 khoá, trống
  đúng dòng kết lược; mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments = 0`, `ratio = 1`.

  **Thuật ngữ, đếm được.** `Pañca saṅgātigo bhikkhu` → *tỳ-kheo đã vượt khỏi năm trói buộc*
  (sn1.5:3.3 dịch *Vị tỳ-kheo vượt qua năm ràng buộc*; dhp370:3 dịch *tỳ-kheo đã vượt khỏi năm trói
  buộc* — tôi theo vế khớp nguyên văn của dhp370). `chinde`/`jahe` → *cắt* / *bỏ*. `cuttari` →
  *thêm*; `bhāvaye` → *tu tập*. `ogha` → *bộc lưu*; `oghatiṇṇo` → *đã vượt bộc lưu*.

  **Bất định đã ghi.** Kệ nói *năm* ba lần nhưng **không liệt kê năm sợi trói buộc** — Pāli không
  cho danh sách, nên tôi không thêm, dù Tăng Bộ có danh sách năm `saṅgāti` quen thuộc. Sujato cũng
  không liệt kê. Nếu người biên tập muốn có chú thích, đó là chỗ dành cho `notes` của kinh, không
  phải thân kệ. Cũng lưu ý `ne37:391.4` và `dhp370:3` là cùng công thức này — tôi đã đối chiếu.

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2); ngoặc kép cân; không chữ ngoài
  Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này cấm) →
  `technical_integrity` = **9.6**.

  **Danh xưng giữ nguyên dạng Pāli** (Kuṇḍadhāna).
