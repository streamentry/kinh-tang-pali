  **Giải quyết draft 2026-10-13 (vòng 2).** Đọc đối kháng lại cả 20 khoá từ Pāli; **0/20** khoá lỗi nghĩa thật;
  **1** khoá tinh chỉnh độ sát chữ.
  - `3.4` `cakkavattī mahabbalā`: `mahā + bala` là *đại lực*; *oai* là nghĩa thêm so với Pāli. Đo trên 80 khoá
