    *là các Chuyển Luân Vương có đại lực.* Cần người điều phối quy một dạng cho cả họ.
  - Giữ nguyên các khoá còn lại sau khi đối chiếu từng chữ: `1.3`–`1.4` (`ārohatthāya pāsādaṁ` = để đi lên lầu
