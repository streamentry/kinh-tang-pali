notes: |-
  **Bài.** `tha-ap174` — `Therāpadāna apadāna`, phẩm `Kumudavagga`, thứ hai
  (`6.1` tự xác nhận). Bài có 20 khoá Pā li; bản dịch phủ **20/20**.

  **Năm phép kiếm, số đo bằng phép tính, không chép tay.**
  (1) `set(khoá Việt) == set(khoá Pāli)`: thiếu **0**, thừa **0**.
  (2) ngoặc kép `“”` và nháy đơn `‘’` so **từng khoá**: 20 khoá đã so, lệch **0**; cân cả bài
  ngoặc kép Pā li 1 / Việt 1, nháy đơn Pā li 0 / Việt 0.
  (3) Pā li trùng nguyên văn **trong chính bài**: **0** cặp, nên 0 cặp Việt khác.
  (4) dấu lược: 20 khoá đã so, lệch **0**. Pā li có **1** khoá `…pe…` (`4.2`) và **0** `…` trần;
  Việt có **0** `…pe…` và **1** `…` trần — đúng luật `…pe…` → đúng một `…`.
  (5) chỉ mục Pā li→Việt toàn tầng: **12** cặp Pā li trùng nguyên văn đã dò, dùng lại nguyên văn
  **11** khoá (`0.1`, `0.2`, `1.2`, `2.1`, `2.2`, `2.3`, `2.4`, `3.4`, `4.1`, `4.2`, `4.3`),
  **1** khoá cố ý khác — xem mục dưới.

  **Tra tiền lệ kèm đếm.**
  `Therāpadāna` → *Therāpadāna* **352**/361.
  `lokajeṭṭhassa tādino;` (Pā li trùng nguyên văn **12** bài) → *bậc tối thượng thế gian, bậc Vững
  Vàng kiên định;* **5**; các cách khác 2+1+1+1+1.
  `Tena cittappasādena,` (22 chỗ trùng) → *Nhờ tâm tịnh tín ấy,* **11**.
  `anubhotvāna sampadā;` → *anh đã thọ nhận được thành tựu;* **2/2**.
  `Dhāremi antimaṁ dehaṁ,` (10 chỗ trùng) → *Tôi đang mang thân xác cuối cùng này,* **2**; tôi chọn
  dạng này vì `Dhāremi` là ngôi 1 và dạng đó đã có tiền lệ **2** trong 10.
  `sammāsambuddhasāsane.` → *trong giáo pháp của Đức Chánh Đẳng Giác.* **5**/7.
  `cakkavattī mahabbalā.` (bản số nhiều, 49 chỗ trùng) → *là các Chuyển Luân Vương có đại oai
  lực.* **14**, đứng đầu và cũng khớp số nhiều của `mahabbalā`.
  `Paṭisambhidā catasso,` → *Bốn vô ngại giải,* **361**/369. `…pe…` → *…* **642/642**.
  `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”.* **328**/369.
  `ito aṭṭha janā ahuṁ;` (`tha-ap146:5.2`) → *có tám vị xuất hiện từ kiếp đó;* **1**; tôi theo
  đúng khuôn đó cho `3.2`.

  **Một khoá cố ý KHÁC tiền lệ.**
  `1.1 “Koṇḍaññassa bhagavato,` — tiền lệ duy nhất là `tha-ap276:1.1` dịch *“Lên Đức Thế Tôn
  Koṇḍañña,*. Chữ *Lên* ở đó không đứng vững về nghĩa. Ở bài này `bhagavato` là cách sở hữu và
  vế sau `Ārohatthāya pāsādaṁ,` là cách bổ nghĩa cho *để Ngài đi lên*, nên cả cụm là tân ngữ;
  tôi dịch *“Cho Đức Thế Tôn Koṇḍañña,*. Đây là chỗ tôi **không** chép nguyên văn tiền lệ, và
  ghi ra đây để người điều phốn xem lại.

  **Ngôi kể.** `1.1`–`1.4` là người hành hương kể việc mình làm lầu đài và bậc thang cho Đức Thế
  Tôn Koṇḍañña (`mayā` ở `1.4` là ngôi 1). `2.2` dùng `anubhotvāna` với chủ ngữ hạn định nên tôi
  theo tiền lệ *anh*, còn `2.3` `Dhāremi` là ngôi 1 nên tôi viết *Tôi*. `3.1`–`3.4` nói về ba
  nghìn vị, nên `3.2` giữ số và `3.3`–`3.4` dùng số nhiều cho khớp `mahabbalā`.

  **Tên phẩm `Kumudavagga` — tầng không có đa số, tôi nói rõ thay vì đoán.**
  Có **3** bài cùng phẩm đã dịch và **3** cách, mỗi cách **1**: *Phẩm Bậc Cho Sen* (`tha-ap176`),
  *Phẩm Hoa Sen Trắng* (`tha-ap177`), *Phẩm Kumuda* (`tha-ap182`). Tôi chọn *Phẩm Hoa Sen
  Trắng* vì `kumuda` nghĩa gốc là sen trắng, và vì bài cùng phẩm `tha-ap177` đã dùng cách đó;
  `tha-ap182:7.1` lại giữ *Phẩm Kumuda*, nên phẩm này hiện đọc theo hai cách và cần người điều
  phốn quy một tên cho cả phẩm.

  **Tiêu đề `0.3`.** Pā li `2 Nisseṇidāyakattheraapadāna` **có** số thứ tự. Đo trong `tha-ap`
  (121 bài có số trong Pā li và đã có bản Việt): **giữ 72 : bỏ 49** ⇒ đa số GIỮ, nên `0.3` viết
  *2. …*. Con số 66/275 trong `BRIEF_VI3` đo theo tiêu chí khác (gộp cả bài Pā li vốn không có
  số vào phe BỎ); tôi ghi **cả hai** số ở đây. Dạng tiêu đề: *Bài Kệ Tuyên Ngợ Về Trưởng Lão*
  **215** : *Tuyên Ngôn* 72 : *Ký Sự* 92 — theo nhóm 215 cho cả `0.3` và `6.1`.

  **Bất định đã ghi nhận.**
  1. `Ārohatthāya pāsādaṁ, / nisseṇī kāritā mayā.` — `pāsāda` ở đây là bệ thềm nhiều tầng và
     `nisseṇī` là bậc thang. Tôi dịch *lầu đài* vì tầng đã dịch `pāsāda` thành *lầu*, *lầu
     tháp*, *cung điện* (`an3.39`, `sn3.21`, `mn37`), nhưng trong ngữ cảnh này người hành hương
     dựng một bệ thềm cho Đức Thế Tôn đi lên, nên *lầu đài* là cách **chọn**, không phải cách duy
     nhất. `nisseṇī` không có tiền lệ nào (0 chỗ trùng Pā li) — tôi dịch *bậc thang*, và đây là
     lựa chọn của tôi.
  2. `Sambahulā nāma rājāno,` — *có những vị vua tên là Sambahulā,* theo khuôn *có những vị vua
     tên là …* đã có 1 tiền lệ (`tha-ap` dịng tương ứng). Cụm này là hapax trong Pā li đã ghim
     (chỉ 1 chỗ trong 5.764 tệp), nên không có mẫu song song để đối chiếu.

  **Coverage tầng Anh.** Mẫu số (Pā li ≥ 40 ký tự, bỏ `:0`) = **1** khoá (`5.1`); Sujato phủ
  **0/1**; ba tầng tham khảo đều **không có**: Sujato 0 tệp, `english-project` 0 tệp,
  `translation/vi/phantuananh/` 26 tệp Pháp Cú. Mất mát đã ghi nhận trong
  `content/meta/reference-gaps.yaml` (`uid: tha-ap174`, coverage 0). `triangulation` 8,4.

  **Cổng kỹ thuật chưa chạy.** Bị cấm `git`/`gh` và `npm run validate|test|check|build`. Bốn lệnh
  còn lại: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Phần tự kiểm được:
  JSON hợp lệ, NFC, thứ tự khoá y hệt Pā li, 0 orphan, 0 lỗi lược, ngoặc cân, YAML parse sạch.
  `technical_integrity` **9,6**.

  **Giải quyết draft 2026-10-12.** Đọc đối kháng lại cả 20 khoá từ Pāli; **5/20** khoá lỗi nghĩa thật
  hoặc ngữ pháp, 2 khoá tiêu đề đổi theo.
  - `3.1`–`3.2` (lỗi số, nặng nhất): `Ekattiṁsamhi … sahassamhi` là một số tách đôi, cùng cách
    locative, nghĩa **31.000 kiếp** (cùng khuôn `Catutiṁsasahassamhi` ở `tha-ap57:9.1` và
    `Pannarasasahassamhi / kappānaṁ aṭṭha āsu te` ở `tha-ap177:4.1`, đều dịch *… nghìn kiếp*).
    Bản cũ *ba mươi mốt kiếp* thiếu hàng nghìn, và `tayo` là *ba* (số lượng vị vua), không phải
    *ba nghìn vị*. Nay: *Vào ba mươi mốt nghìn kiếp trước, / đã có ba vị;*. Còn bất định: nghìn
    thứ ba mươi mốt hiểu là 31.000 kiếp hay ước lệ quanh con số đó; tôi theo khuôn 2 bài song song.
  - `3.3`: bỏ chữ *có* lặp, *các vị vua tên là Sambahulā,* (`rājāno` là chủ ngữ của `ahuṁ` ở `3.2`).
  - `1.3`–`1.4`: `Ārohatthāya pāsādaṁ` là *để (Ngài) đi lên lầu đài* (`pāsādaṁ` là bổ ngữ của
    `ārohatthāya`), `nisseṇī kāritā mayā` là *bậc thang đã được tôi cho làm* (bị động sai khiến);
    bản cũ *tôi làm lầu đài* đảo ý (người này làm thang, không làm lầu) và thêm *cũng*.
  - `2.2`: `anubhotvāna` là danh phân từ bất biến, chủ ngữ là `ahaṁ` của `2.3`; *anh* sai và là dạng
    lan trong tầng (đo 7 chỗ, 3 chỗ *anh đã thọ nhận được thành tựu* gồm bài này và `tha-ap202:3.2`;
    4 chỗ còn lại dùng *tôi/sau khi … thọ hưởng*). Nay *sau khi đã thọ hưởng các thành tựu;* theo `tha-ap474:18.2`.
  - `0.3`, `6.1`: *Tuyên Ngợ* không phải từ tiếng Việt (222 chỗ trong tầng, so với *Ký Sự Về* 169 và
    *Tuyên Ngôn* 138); `Apadāna` là *ký sự*, nên đổi theo `tha-ap182:0.3`. Đây là lỗi lan trong tầng,
    chỉ sửa trong bài này, cần người điều phối xử lý chung.
  - Blocker về cổng kỹ thuật chưa chạy: **gỡ**, vì đó là giới hạn của phiên làm việc chứ không phải lỗi
