notes: |-
  17 khoá, tất cả đã dịch.

  TẦNG THAM KHẢO — 0/17 có Anh Sujato: `kn/` của edition đã ghim có `thag` và `thig` nhưng
  **không có `tha-ap/`**. Không có bản Việt hiện hành. ⇒ `draft`.

  `Itthaṁ sudaṁ āyasmā … thero imā gāthāyo abhāsitthāti.` dùng lại **đúng nguyên văn** khuôn đã
  có ở 67 tệp `tha-ap` trong tầng: *Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ
  này.*

  `3.1–3.4` trùng nguyên văn `kataṁ buddhassa sāsanaṁ` với 6 bài `thag` đã có (`thag1.24`,
  `thag1.66`, `thag1.107`, `thag1.108`, `thag1.112`, `thag1.117`) → dùng lại đúng nguyên văn
  *đã làm tròn lời dạy của Đức Phật*. Ở `tha-ap` khác, cụm này được lược bằng `…pe…`; ở đây Pāli
  viết đủ nên tôi dịch đủ (theo §10.1, không bao giờ mở rộng, và không nén vì công thức đủ ở ngay
  đó).

  THUẬT NGỮ MỚI — đặt mới, 0 tiền lệ cho tất cả:
  · `Therāpadāna` giữ nguyên (tên tác phẩm, đúng như `Milindapañha`, `Netti`, `Petavatthu`).
  · `Tuvaradāyakavagga` → *Phẩm Bậc Cho Cỏ*. `tuvarā` là một loài cỏ; tôi giữ *tuvarā* làm tên
    cây (như tên riêng Pāli khác) và dịch phần còn lại theo nghĩa chữ.
  · `Xtherassāpadānaṁ` → *Bài Kệ Tuyên Ngợ Về Trưởng Lão X*. Khung này **chưa bài nào trong tầng
    dịch** (0/67 tệp `tha-ap` có khoá `0.2`/`0.3`), nên tôi đặt mới theo nghĩa: `āpadāna` = tuyên
    ngợ, kể lại công đức của bậc thầy.
  · `Migaluddo` → *con nai bị săn đuổi*; `Ekanavutito kappe` → *chín mươi chín kiếp trước*.
  · `Paṭisambhidā catasso` → *Bốn vô ngại giải*: **glossary bắt buộc**
    (`paṭisambhidā` → preferred *vô ngại giải*), dù tầng chưa có bài nào dịch cụm này.
    `vimokkhāpi ca aṭṭhime` → *tám sự giải thoát*; `Chaḷabhiññā sacchikatā` → *sáu trí thức đã
    chứng nghiệm* (1 tiền lệ cho *sáu trí thức* ở mil7.7.9:3.3).

  TÊN RIÊNG MỚI: `Tuvaradāyaka` có 0 lần trong tầng Việt trước đợt này, nhưng **có trong Pāli của
  chính bài này** (`0.3`, `4.1`, `5.1`). `lọt_pāli()` của `_hvi.py` chỉ nhận `pāli_riêng` theo
  TỪNG khoá, nên ở những khoá không chứa tên (ví dụ `1.3` chỉ có `tuvaramādāya`) chữ *Tuvaradāyaka*
  sẽ bị báo lọt oan ở lần dùng đầu — đúng trường hợp docstring mô tả. Tôi khai tên vào bộ nhớ
  tiến trình (`_GIỮ`) chứ **không** sửa `_hvi.py`, và không sửa bất kỳ tệp nào ngoài lát.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
  
