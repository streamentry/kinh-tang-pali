    * `Lokajeṭṭha` → `Trưởng Thượng thế gian` · `tādino` → `Như Thật` (tha-ap554:1.2) ·
      `narāsabho` → `Nhân Ngưu` · `dvipadindo` → `hai chân` · `devadevaṁ` → `Thiên Trung Thiên`
      (tha-ap54:2.2 và 2 khoá nữa) · `atthadassī` → `Đã Thấy Pháp` (tha-ap68:2.1, tha-ap135:2.1)
      · `rakkhaso` → `dạ-xoa` (47 lần trong tầng).
    * `Sattaratanasampannā` → `Đầy đủ bảy món báu quý giá,` (65 khoá) ·
      `catudīpamhi issarā` → `là vua trên bốn châu lục.` (2 khoá) ·
      `cakkavattī mahabbalā` → `là các Chuyển Luân Vương có đại oai lực.` (22 khoá) ·
      `janādhipā` → `chúa tể muôn dân` (tha-ap41:5.2) · `…nāmenā/te` → `Đều mang tên gọi là …`
      (tha-ap41:5.3 `Đều mang tên gọi là Sahassarāja,`).
    * Số đếm `kappasahassa`: `Satta kappasahassamhi` (7 × 1.000) → `bảy nghìn kiếp` ·
      `Saṭṭhi kappasahassamhi` (60 × 1.000) → `sáu mươi nghìn kiếp` (tiền lệ
      `Saṭṭhikappasahassamhi` ở tha-ap54:11.1 và 2 khoá nữa) · `Pañca kappasahassamhi` → `năm
      nghìn kiếp`. Ở lát này không có `Tiṁsakappasahassamhi` nên không dính lỗi *ba mươi ngàn
      kiếp* — nhưng tôi vẫn thấy lỗi đó còn tồn tại ở `tha-ap54:6.3`
      (`Tiṁsakappasahassāni` → `Trong ba mươi nghìn kiếp,`), thuộc lát khác; `tiṁsa` = 3 và
      `kappasahassa` = nghìn nên phải là *ba nghìn kiếp*. Báo để người điều phối xử.
    * `caturo X nāmakā` → `có bốn vị mang tên là …;` (tiền lệ `caturo rāmanāmakā` ở
      tha-ap54:11.2) · `Sattaratanasampannā` như trên.

  BÀI NÀY (tha-ap15) — GHI RIÊNG. Đây là bài thứ ba của Sīhāsaniyavagga; lời kết của Đức Phật
  Padumuttara đoán về trưởng lão Nanda, rồi Nanda xuất gia và đoạt A-la-hán.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG BỊA.
    * `:6.4` `upacelā catujjanā` — xem blocker thứ ba. `catujjanā` là hapax toàn Pāli root đã
      ghim (đo: 1/10.093 tệp) và không có trong bảng số Pāli. Chỉ có một chú giải tra được
      (Pāli–Myanmar qua wisdomlib) đọc `catu+jana` là `người ở lần thứ tư`, đọc đó không khớp
      câu kệ đang đếm số người, và tôi cũng không có nguồn nào cho `năm mươi`. Tôi KHÔNG chọn
      một con số; bản Việt bỏ mệnh đề số, chỉ giữ nghĩa `upacelā` (thêm nữa) — `lại có thêm
      những người nữa.` Đây là bỏ chứng từ + ghi nhận, đúng cách xử lý khi thiếu thông tin;
      nếu biên tập có nguồn (chú giải Paramatthadīpanī) thì sửa một khoá này là xong.
    * `:3.3` `Gotamassa bhagavato,` — Pāli để trống danh từ mà `kaniṭṭho` ở khoá sau lấy làm
      chủ ngữ. Cặp kệ có nghĩa: `ngươi sẽ là kẻ trẻ nhất` trong `hàng đệ tử của Đức Thế Tôn
      Gotama`. Tôi cung cấp `hàng đệ tử` để câu tiếng Việt có chủ ngữ; đó là danh từ Pāli
      ngầm hiểu (`sāvaka`), không phải ý mới. Hai tiền lệ cùng Pāli `:3.3` đều dịch theo hướng
      này nhưng lệch nhau (`các đệ tử của` 1 khoá, `Trong giáo pháp của` 1 khoá) và khoá
      `tha-ap347:6.4` cho thấy `sāsanebhiramissati` mới là nơi câu `Trong giáo pháp của` khớp
      — ở đây không có mệnh đề tương ứng nên tôi không dùng.
    * `:1.4` `Sayambhussa mahesino.` → `cho vị Đại Ẩn Sĩ, bậc Tự Tại.` Tôi thêm `cho` để câu
      tiếng Việt có tân ngữ, vì `:1.1–:1.2` và `:1.4` là danh từ chỉ cùng một Đức Phật mà Pāli
      lặp chứ không có giới từ nào. Đây là chỗ DUY NHẤT trong bài tôi thêm một từ nối, ghi lại
      để biên tập đọc.
    * `4.1` `Rāgaratto sukhasīlo` → `Mê dắt lục dục mà sống đời thong dong`:
      `sukhasīlo` nghĩa là `sống dễ chịu / an nhàn`, không phải `giới hạnh thánh thiện`; tôi giữ
      nghĩa nhẹ của `sukha` vì nó nối với `kāmesu gedhamāyuto` ở vế sau ( mê mãi thế giới
      dục ). `4.3` `Buddhena codito santo` → `Người lành, được Đức Phật khuyên dạy`: tôi đảo
      thứ tự trong câu để tiếng Việt không bị lủng củng, nhưng giữ đủ hai vế (`santo` và
      `Buddhena codito`).
    * `khoma` dịch `bột thọ` là theo tiền lệ tha-ap32, nhưng `vattha` là `vải`; tôi ghép thành
      `một tấm vải bột thọ` để giữ cả hai vế nghĩa thay vì chọn một và bỏ một.

  MỘT LỖI CHIẾT ĐƯỢC Ở BÀI KHÁC, KHÔNG SỬA, CHỈ BÁO. `ghorarūpo mahabbalo` ở tha-ap86:6.2
  dịch `dạng rốn ráo, có đại thần lực;` — `ghora` là `dữ / đáng sợ`, không phải `rốn ráo`. Tôi
  không nhân bản sai số này (cùng Pāli ở tha-ap423:4.4 chưa dịch nên chưa có mâu thuẫn), dịch
  theo nghĩa. Nếu lát của tha-ap86 sửa thì tôi cũng cần sửa theo; thuộc lát khác nên tôi không
  đụng.
