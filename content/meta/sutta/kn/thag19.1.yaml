  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá). Bài kệ là lời trưởng lão Tālapuṭa tự nói với tâm mình (`citta`): kệ `1`–`16` là chuỗi ước nguyện mở đầu bằng "bao giờ" (kadā) và kết bằng điệp khúc `taṁ nu kadā bhavissati` hoặc `tadidaṁ kadā me`; kệ `17`–`20` trách tâm đã từng nài xin mình xuất gia; kệ `21`–`22` nhắc lời Đức Phật về tâm như khỉ và các dục; kệ `23`–`30` kể lại những lời tâm từng thúc giục (`itissu maṁ citta pure niyuñjasi`); kệ `31`–`39` trách tâm đã khiến mình luân hồi và phản bội; kệ `40`–`44` tuyên bố sẽ chế ngự tâm (kệ `40` cùng Pāli với `dhp326` và `thag1.77`); kệ `45`–`54` là lời hứa về sự an trú nơi núi rừng và việc điều phục tâm; kệ `55` là lời kết. Nháy theo đúng từng khoá của Pāli: 26 ký tự nháy ở Pāli (`“` ở `1.1`, `”` ở `55.4`, và các cặp `‘ ’` ở `17.2`, `18.2`, `21.3`–`21.4`, `23.1`–`23.3`, `24.1`–`24.3`, `25.1`–`25.3`, `26.1`–`26.3`, `27.1`–`27.3`, `28.1`–`28.3`, `29.1`–`29.3`, `30.1`–`30.3`, `34.1`–`34.2`), Việt đúng 26 ký tự đó ở cùng các khoá. Ở `18.2` Pāli đóng nháy ngay sau `Giribbaje citrachadā vihaṅgamā`, các dòng `18.3`–`18.4` ngoài nháy; bản Việt giữ đúng như vậy và dịch `18.4` trung tính (`người đang thiền định`) vì người nói lời ấy ở `18.4` và `46.4` khác nhau (cùng Pāli).

