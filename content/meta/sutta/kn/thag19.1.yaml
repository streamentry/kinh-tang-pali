    · `citta` (vocative) → này tâm, `tvaṁ` → ngươi (`thag5.9:1.1` `Ta sẽ giam giữ ngươi, này tâm kia`, 1 khoá duy nhất; người nói trong bài là trưởng lão nên dùng `tôi`).

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `36.3` `Ajjhattasambhavo kataññutāya te`: Pāli của tầng ghim viết `kataññutāya` (biết ơn). Sujato dịch `because of your ingratitude`, Indacanda dịch `là nhờ vào lòng biết ơn của ngươi`. Cách đọc `akataññutāya` (a- bị lược sau `-o`) khớp mạch cả đoạn (tâm vô ơn dù tôi đã làm theo lời nó, và đã khiến tôi luân hồi), nên bản Việt chọn `do sự vô ơn của ngươi`. Đây là điểm bản Việt khác nghĩa đen `kataññutāya`; không có tiền lệ (0 khoá) để phân xử. Không phán chắc.
    · `48.3` `Na tāhaṁ kassāmi yathā atandito`: dòng có `na` (phủ định) nhưng mạch cả hai kệ `48`–`49` (`Tathā tu kassāmi yathāpi issaro`) là lời quyết làm tâm mềm dẻo như túi da mèo (Sujato `I'll make you as supple as a tireless worker makes a cat-skin bag`, Indacanda `ta sẽ hành động đối với ngươi, giống như đối với cái túi da mèo`). Bản Việt đọc theo mạch (`tôi sẽ làm ngươi như người không biếng nhác`), không dịch `na`. Cần người biên tập phán nếu Pāli thật sự có phủ định.
    · `20.1` `Mameva etaṁ na hi tvaṁ paresaṁ`: ngữ nghĩa mơ hồ (`etaṁ` là việc xuất gia hay là tâm; `tvaṁ paresaṁ` là `ngươi không thuộc về người khác`); Sujato `This is mine alone, it doesn't belong to others`, Indacanda `Việc này chỉ liên quan đến ta, do đó không có ngươi và các thứ khác`. Bản Việt giữ cả hai vế, `Điều này chỉ riêng của tôi, ngươi không thuộc về người khác`.
    · `37.2` `rājadasī`: tầng ghim viết `rājadasī`; Sujato và Indacanda đều hiểu là ẩn sĩ vua chúa (`royal seer`, `ẩn sĩ của hoàng gia`, tức `rājisi`). Bản Việt viết `bậc ẩn sĩ hoàng gia`; không có tiền lệ độc lập (0 khoá).
    · `45.2` `Pabbhārakuṭṭe`: không rõ `kuṭṭa`/`kūṭa` (đỉnh) hay khác; Sujato `mountain peak`, Indacanda `dốc núi và chóp đỉnh`; bản Việt viết `dốc núi và đỉnh núi`.
    · `53.2` `gāmaṇḍalaṁva`: Indacanda `đứa trẻ làng quê`, Sujato `a bull in a pit`; không có tiền lệ (0 khoá). Bản Việt theo Indacanda; không phán chắc.
    · `54.4` `parā bhavissasi`: `parā` + `bhū` (parābhava) là sự suy bại; Sujato `you'll perish`, Indacanda `ở lại bên kia`. Bản Việt `ngươi sẽ suy bại`; không phán chắc.
    · `7.3`–`7.4` `na taṁ giribbaje, Atthatthiyaṁ taṁ`: `taṁ` ở `7.3` không có chức năng rõ; bản Việt không dịch nó riêng. `atthatthiyaṁ` hiểu là người đang cầu mục đích (đối cách, đồng vị với `maṁ`), Sujato `focus on my heart's goal`, Indacanda `không tốt cho mục đích`. Không phán chắc.
    · `35.4` `āvamituṁ`: cả Sujato và Indacanda hiểu là `nuốt lại` thứ đã nôn; tôi theo, dù gốc `vam` thường là nôn.
    · `18.3`, `46.3` `ghosatthanitābhigajjino`: hiểu là `kêu vang đáp lại tiếng sấm rền` (Sujato `greeting the thunder`); `Mahinda` giữ nguyên tên (Indacanda `Thần Inda vĩ đại`). `14.2` `pātālakhittaṁ vaḷavāmukhañca`: `nơi quăng xuống vực thẳm` và `Vaḷavāmukha` giữ nguyên tên, không giải thích thêm.
    · `22.4` `nirākatā` dịch `bị quăng vào`; `23.2` `purakkhato` dịch `vây quanh` (Sujato `adorned by`, Indacanda `được tôn vinh`): `purakkhata` có hai nghĩa `được vây quanh` và `được tôn trọng`, tôi chọn nghĩa ít giả định hơn.
    · `27.3` `Manovicāre uparundha cetaso`: `manovicāra` dịch `những dạo động của ý` (Indacanda `các sự lang thang của ý`).
    · `44.1` `Dhitipparaṁ`: dịch `kẻ lấy kiên định làm tối thượng` (Sujato `someone who has made the ultimate commitment`).
    · `10.2` `vimano na hessaṁ` xem mục thuật ngữ.
