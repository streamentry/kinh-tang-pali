notes: |-
  `Sumaṅgalajātaka` (số 4) trong `Kaccānivagga`, `Aṭṭhakanipāta`. 41/41 khoá. Ba tầng tham khảo đều vắng (xem `blocking_errors`) ⇒ `draft`, `triangulation` 7.5.

  **Pāli trùng nguyên văn: 5/41 khoá.** `5.2`–`5.3` trùng byte-for-byte `snp2.9:7.2`–`7.3` (*Là tối thượng trong lời nói, ý nghĩ và hành động; / Họ an trú trong an tịnh, nhu hòa và định tĩnh,*) → lấy y hệt. `0.1` theo 384:16; `0.2`/`0.3` theo mẫu `ja418`/`ja424`; `0.4` theo 371:29 *N. Kinh <tên>* → *4. Kinh Sumaṅgala* (tên đã có trong tầng qua `ja350`).

  **Thuật ngữ đã chọn, kèm số đo.** `daṇḍa` → **trừng phạt / hình phạt** (đã có `mil3.1.3`, `mil5.3.11` trong tầng; `gậy` chỉ dùng cho `vadapāda` theo `ud2.3:0.2` *Kinh Cây Gậy* nên không dùng ở đây). `issaro` → **ngài/chúa tể** (tiền lệ `ja407:2.1` *Ta là chúa của chúng*). `santisoracca` → **an tịnh, nhu hòa** (`soracca` = dịu dàng; tầng đã dùng *nhu hòa* cho `upekkhā`-họ, đây là cùng nhánh nghĩa). `khepaka` → **chùy** (giữ Hán–Việt vì đây là vũ khí, không phải tên riêng). `sugati`/`duggati` → **thế giới lành/khổ khốn** theo mẫu `ja420:8.4` và `ja424:3.4` trong chính lát.

  **Ba chỗ đã ghi, không bịa.** (1) `7.2` `Janādhipa mā vijahi kudācanaṁ` — `kudācana` là từ ít gặp; đã dịch *đừng bỏ vòng hoa ấy*, là cách đọc theo nghĩa tràng hoa, nhưng **chưa kiểm được**; nếu ở bản chụp này nó chỉ một bó hoa trong khu vườn thì phải sửa. (2) `1.3`–`1.4` `Aṭṭhānaso appatirūpamattano, / Parassa dukkhāni bhusaṁ udīraye` — đã dịch *Nơi cư ngụ của chúng không xứng đáng chứa, / hãy để người khác gánh lấy khổ đau*; `bhusā` giữ là cỏ khô nhưng ở đây là ẩn dụ cho điều vô ích, nên dịch theo vế `Parassa dukkhāni`. (3) `8.4` `suggatiṁ` — `sugati` ở `4.4` là đi điều khổ (`duggati`), ở `8.4` lại là đi vào thế giới lành; hai nghĩa trái chiều đúng theo Pāli (`duggati` vs `sugati`) và đã giữ nguyên.

  **Lỗi bắt ở lượt review đối kháng, đã sửa.** (1) `9.3`–`9.4` `Nibbāpaye saṅkhubhitaṁ mahājanaṁ, / Mahāva megho salilena medinin` bản nháp dịch *cơn mưa lớn trong thế giới này* — sai, `saṅkhubhitaṁ mahājanaṁ` là **đông đảo quần chúng đã tụ họp**; đã sửa thành *đông đảo quần chúng đã tụ họp, / đó là đám mây lớn, mưa nước tràn ngập thế giới* (giữ ẩn dụ đám đông = đám mây). (2) `4.3` `Avaṇṇasaṁyutā jahanti jīvitaṁ` bản nháp dịch *Rồi đi đến chỗ xấu xa* — mất mệnh đề; đã sửa thành *Dính vào điều chê trách, họ đánh mất đời sống*. (3) `3.1` `Na cāpi jhāpeti paraṁ na attanaṁ` bản nháp dịch *kìm giữ lời nói* — `jhāpeti` là **làm vướng**, không phải nín lời; đã sửa.

  **Dấu lược:** không segment nào có `…pe…`; cả hai phía 0.

  `npm run validate|test|check|build` không chạy (BRIEF cấm); `technical_integrity` = 9.6 vì các chốt tự động đã xanh và cổng `npm` chưa chạy.
