notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ja351.
  Đối chiếu văn cảnh tích truyện Jātaka và chú giải Atthakathā để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 25 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Sửa lan 2026-10-13: khoá 4.2, 4.3, 4.4, 5.1, 5.2, 5.3, 5.4 — tám vế kệ chung với ja452:9.1–10.4, ja332:3.1–4.4, ja505:19.1–20.4 (Pāli trùng nguyên văn), nay dùng đúng bản Việt của ja452:9.1–10.4 (accuracy fix). Trước → sau: 4.2 «Bậc xuất gia» → «người xuất gia»; 4.3 «Vị vua» → «vị vua»; 4.4 «Kẻ mang danh hiền trí mà hay phẫn nộ cũng không tốt.» → «bậc trí mà hay phẫn nộ, điều ấy không tốt.» (paṇḍito là «bậc trí», «mang danh» là thêm nghĩa); 5.1 «Bậc quân vương nên suy xét kỹ trước khi hành động,» → «Bậc Sát-đế-lợi nên suy xét rồi mới hành động,» (khattiya); 5.2 «chớ hành động hấp tấp mà không suy xét, hỡi đấng chúa tể bốn phương;» → «chớ hành động khi chưa suy xét, hỡi chúa tể các phương;» («hấp tấp» là thêm nghĩa; disampati = chúa tể các phương); 5.3 «Với» → «với»; 5.4 «danh tiếng và vinh quang sẽ hằng tăng trưởng.”» → «danh xưng và tiếng tăm tăng trưởng.”» (vaḍḍhatī là hiện tại, «sẽ hằng» là thêm nghĩa; yaso kitti). Về «Sát-đế-lợi» cho khattiya: giữ, vì đo trên ja* có 90 khoá dịch Sát-đế-lợi (hoa/thường) + 7 khoá Sát-đế-lỵ so với 1 khoá «quân vương», và ja452:10.1 cũng dùng như vậy. 4.1 giữ nguyên (đã trùng ja452:9.1).
