notes: |-
  PHẠM VI LÁT NÀY. Bài `tha-ap189`, 52 khoá Pāli, dịch đủ 52 khoá. Lát giao 51 khoá để dịch; khoá `tha-ap189:13.1` đã có sẵn từ đợt trước và được **giữ nguyên nguyên văn** — không sửa lại vì nó đúng, xem mục lời-kết bên dưới. File JSON nạp sẵn khoá cũ rồi mới thêm, nên không mất khoá nào; kiểm bằng cách ghi hai lần và so SHA-256 — hai lần trùng khớp `4c9f0165e41a3207f8c0fc2e9bfc0f0ad030d75168a7c3335ecf4519454902b8`.

  `translationTitle` BẰNG ĐÚNG `:0.3`: cả hai đều là *Bài Kệ Tuyên Ngôn Về Trưởng Lão Ekacintika*. Chính sách số thứ tự ở `:0.3`: **bỏ** số, vì Pāli `:0.3` = `Ekacintikattheraapadāna` **không bắt đầu bằng số**; hình thức nếu có phải là `N. `. Đối chiếu cùng phạm vi: `tha-ap185:0.3` Pāli `3 Koṭumbariyattheraapadāna` (có số) nên giữ *3.*; `tha-ap194:0.3` Pāli `2 Tiṇasanthārakattheraapadāna` (có số) mà bản Việt bỏ số. Bài này rơi vào nhóm BỎ.

  NGHỊCH PHÂN KỲ CẦN NGƯỜI ĐIỀU PHỐI PHÁN MỘT LƯỢT CHO CẢ CUỐN — đo ba phạm vi, ba kết quả khác nhau, nêu đủ cả ba. (a) Chuỗi thô toàn tầng `kn`: *Tuyên Ngợ* **443** lần / 233 tệp, *Tuyên Ngôn* **188** / 96 tệp, *Tuyên Ngợi* **20** / 10 tệp. (b) Chỉ riêng khoá `:0.3` của phẩm `tha-ap` (419 tệp có bản Việt): *Tuyên Ngợ* **206**, *Tuyên Ngôn* **92**. (c) Phạm vi gần nhất `tha-ap175`–`tha-ap205`: *Tuyên Ngôn* **14**, *Tuyên Ngợ* **8**. Hai phạm vi cho hai đa số khác nhau. Tôi chọn *Tuyên Ngôn* vì hai lý do đo được: phạm vi gần nhất nghiêng về nó, và *ngợ* không phải từ tiếng Việt (ngôn = lời, ngữ) nên *Tuyên Ngợ* là lỗi chính tả — nên nói theo phạm vi gần nhất trong khi toàn cuốn vẫn còn lỗi đó ở 206 tệp.

  `Tuyên Ngợ` / `Tuyên Ngôn` không phải chuyện duy nhất đang phân kỳ ở `:0.3`: còn *Ký Sự Về Trưởng Lão X* (**15** toàn tầng), *Bài Kệ Tuyên Ngợi* (**10**), *Kinh Kệ Của Trưởng Lão X* (**5**), và một loạt biến thể *Cúng Dường …* theo nghĩa tên riêng. Bài này không dùng bất kỳ loại nào trong số đó.

  BA QUY ƯỚC TẦNG — đo trước khi kết luận, và ở bài này không có dạng nào phát sinh. (1) `(…)` là dấu lược của tầng Pāli ghim, phải giữ nguyên: bài này **không có** khoá nào chứa `(…)` ở Pāli, nên không có `(…)` nào được ghi — 0/0, không phải đã xoá. (2) `nevasaññānāsaññāyatana` → *xứ phi tưởng phi phi tưởng*: bài này không có từ này, 0 khoá. (3) Pāli kết `….` → Việt kết ` ….`: bài này **không có** khoá Pāli nào kết `….`; số dấu lược chỉ có đúng một khoá `:12.2` = `…pe…`, và bản Việt giữ **một** `…` như luật 10.1 của `BRIEF_VI3` — không mở rộng. Cả ba đã được kiểm bằng phép riêng, không phải bằng mắt.

  NHỊP NHÁY CỐ Ý CHẠY QUA RANH GIỚI KHOÁ. Pāli mở `“` ở `:1.1`, đóng `”` ở `:12.3`; mở `‘` ở `:2.1`, đóng `’` ở `:5.4`. Điều kiện đúng là **khớp Pāli từng khoá**, không phải mỗi khoá tự cân. Bản Việt vì thế cũng có `“` chỉ ở `:1.1` và `”` chỉ ở `:12.3`; cân toàn văn: mở 1 / đóng 1 cho cả hai loại, khớp Pāli. Câu 6.3–6.4 không có dấu nháy nào ở Pāli nên bản Việt cũng không thêm — không chêm dấu hông vào chỗ nguồn không có.

  SỐ PĀLI — tự tính, in phép ra, không tin bản có sẵn. (1) `14.1` `sattamaṁ`: `satta` = 7, cộng hậu tố thứ tự `maṁ` ⇒ **7** → *thứ bảy*. Tôi kiểm chéo thêm bằng chuỗi lục kết của cùng phẩm: `tha-ap183` *paṭhamaṁ*, 184 *dutiyā*, 185 *tatiyā*, 186 *catutthā*, 187 *pañcamā*, 188 *chaṭṭhā*, **189 *sattamā***, 190 *aṭṭhamā*, 191 *navamā*. 189 là hạng 7, khớp. (2) `11.3` `Kappānaṁ satasahassaṁ`: `sata` = 100, `sahassa` = 1000 ⇒ 100 × 1000 = **100.000** → *một trăm ngàn kiếp*. Đây là chỗ dễ sai nhất của lát này: `tiṁsa-kappa-sahassa` (3 ngàn kiếp) là công thức khác, đã sai ở 4 tệp, không được lẫn vào đây. (3) `12.1` `Paṭisambhidā catasso`: `catu` = 4 ⇒ **4** → *Bốn vô ngại giải*. (4) `1.3` `Tayo saddā`: `tina` = 3 ⇒ **3** → *ba tiếng*. Tiền lệ của tầng cho (2): *trăm ngàn kiếp* **21** khoá / 21 tệp, *trăm nghìn kiếp* **15** khoá / 14 tệp — hai cách viết **cùng số 100.000**, không cách nào sai số.

  TÊN RIÊNG. Giữ nguyên dạng Pāli có dấu, không dịch nghĩa ra tiếng Việt — danh xưng tôn thánh. Tên đối chiếu hai chỗ trong chính bài: `:0.3` `Ekacintikattheraapadāna` và lục kết `:14.1` `Ekacintikattherassāpadānaṁ`; cả hai đều cho `Ekacintika`. Ba tên còn lại — `Sumana`, `Padumuttara`, `Therāpadāna`, `Kuṭaja` — đều lấy từ chính Pāli bài này, không bịa. Nghĩa tên bài này (`eka-cintika` = *Người chỉ suy nghĩ một việc*) suy ra từ cấu tạo tên; bài không có câu nào giải nghĩa nó, nên **không** đưa vào thân kinh.

  ĐỐI CHIẾU CÙNG CÔNG THỨC PĀLI Ở BÀI KHÁC — đây là tầng đối chiếu duy nhất có thật cho bài này, vì không có tầng Anh. Tôi dựng chỉ mục **toàn bộ** Pāli của phẩm `kn` (2774 bài, mọi khoá khác `:0`) rồi tra từng vế kệ. Phần lớn vế kệ của bài này **có** tiền lệ đã dịch: `12.1` *Bốn vô ngại giải* (**428** khoá / 428 tệp), `12.3` *đã làm tròn lời dạy của Đức Phật”* (**441** / 441), `12.2` `…` (**658**), `11.3` *một trăm ngàn kiếp* / *trăm ngàn đại kiếp* (**22** + **22** khoá), `11.4` *không còn đọa/rơi vào khổ xứ* (**9**), `8.3` *muốn cứu độ cho tôi* (**5**), `8.4` *đã ngự/đã đến nơi tôi ở* (**8**), `10.4` *ngay tại nơi ấy tôi đã mệnh chung* (**8**). Toàn cụm `1.1`–`6.4` còn xuất hiện nguyên văn trong `iti83:12`–`18` và đã có bản Việt — tôi đọc song song rồi **viết lại**, không sao chép: bản `iti83` dịch `ehi` thành *hãy trở lại*, điều đó sai; `ehi` là mệnh lệnh của `eti` = *hãy đi tiếp*. Bản Việt ở đây theo Pāli. Cùng cơ chế cho `3.1`: `iti83:14.1` dịch `niviṭṭhāssa` thành *Mong … được an lập*, thêm cả *Mong* không có trong Pāli; bản ở đây bỏ.

  HAI CHỖ TÔI CỐ TÌNH LỆCH TIỀN LỆ, VÌ TIỀN LỆ SAI HOẶC THÊM CHỮ. (1) `11.4` `nupapajjahaṁ`: tiền lệ dùng *không còn* (9 khoá) — nhưng `nu…aṁ` là phủ định quá khứ, không mang nghĩa *không còn nữa*; tôi viết *tôi không đọa vào khổ xứ*. (2) `8.4` `āgacchi`: tiền lệ dùng *ngự đến* (6 khoá) — `āgacchi` chỉ là *đến*, `ngự` mới mang nghĩa cưỡi; ở đây chủ thể là một `samaṇa` người phàm, nên *đã đến nơi ta ở* mới đúng. Hai chỗ này là lựa chọn dịch, không phải lỗi; nếu biên tập muốn phẳng theo đa số thì cả hai đều sửa được ở đây mà không ảnh hưởng bài nào khác.

  THUẬT NGỮ ĐÃ ĐO TRÊN TẦNG (`kn`, 49282 khoá Việt, đo tại thời điểm ghi) — số là **số khoá**, sau là số tệp: *ngươi* 1071/371 · *chư thiên* 288/154 · *đảnh lễ* 262/145 · *tinh tấn* 147/82 · *an trú* 130/91 · *Sa-môn* 62/32 · *đệ tử của* 59/46 · *hổ thẹn* 55/28 · *khuyến khích* 37/21 · *cõi lành* 38/27 · *dũng mãnh* 31/26 (đã chọn để bỏ *dũng sĩ* 11/8) · *lòng thương tưởng* 22/16 · *trăm ngàn kiếp* 22/22 · *mệnh chung* 20/14. *điện lành* = **0**, nên loại. Hai thuật ngữ **không có tiền lệ nào** trong tầng trước lát này: `bho` → *hỡ bạn* (chỉ *này ông* 2 và *bạch thầy* 1) và `sahabyata` → *thuộc cùng loài người* (0; Pāli `kn` có 19 khoá chứa `sahabyata`, tầng Việt mới dịch 2 — `iti83:13.2` dịch là *đến cõi loài người*). Hai chỗ đó tôi dịch theo nghĩa; nếu biên tập muốn theo `iti83` thì sửa `2.2` thành *đến cõi loài người* được ngay.

  `sukkamūla` ở `:11.2` — BẤT ĐỊNH ĐÃ GHI, KHÔNG BỎ. `sukkamūla` xuất hiện 48 khoá trong Pāli `kn`, và dạng song song `iti42:3.3` `Vokkantā sukkamūlā te` cho thấy nó là danh xưng *có gốc rễ trắng*, mạo danh cho người có `hirī`–`ottappa` (hổ thẹn và ghê sờ), không phải mô tả tóc bạc. Tầng Việt có ba cách: *được cội nguồn thiện căn* (**2** khoá / 2 tệp), *được cội rễ trắng thúc giục* (**2** / 2, cộng khoá của bài này thành 3) và *bị mái tóc bạc thúc giục* (**1** / 1). Cách *cội nguồn thiện căn* không đúng: `thiện căn` không có trong Pāli ở đây. Tôi chọn *được cội rễ trắng thúc giục*. Đây là danh xưng hiếm và bài không giải nghĩa nó, nên **không** nâng lên `blocking_errors`; nhưng nếu biên tập cho rằng `sukkamūla` ở đây là một danh xưng riêng cần phiên dịch, thì đó là việc phán cho cả 42 khoản `sukkamūlena codito` trong tầng, không chỉ khoá này.

  CỔNG KỸ THUẬT CHƯA CHẠY — lát này bị cấm mọi lệnh `git` và bị cấm `npm run validate|test|check|build`, nên tôi **không** tuyên bố technical gate pass. Bốn lệnh còn lại thuộc cổng của người điều phối: `npm run validate` · `npm test` · `npm run check` · `npm run build`. Vì vậy `technical_integrity` = **9,6**, không cho 10.0.

  NĂM PHÉP TỰ VIẾT, quét **mọi** 52 khoá (không lọc độ dài Pāli — `_hvi.py` lọc `len ≥ 40` nên ở bài này nó sẽ quét **đúng 1 khoá** và báo xanh vô nghĩa): (P1) tập khoá Việt = tập khoá Pāli: thiếu 0, orphan 0, rỗng 0. (P2) ngoặc kép **và nháy đơn**, từng khoá, đối chiếu Pāli: lệch 0; cân toàn văn `“`1/`”`1/`‘`1/`’`1 khớp Pāli. (P3) dấu lược: lệch 0; đúng 1 khoá có `…pe…` và giữ nguyên một `…`. (P4) dấu chấm: lệch 0. (P5) rò ký tự Pāli vào bản Việt (trừ danh xưng đã đối chiếu), lặp từ liền kề, NFC: lỗi 0. Tổng 0 lỗi trên 52 khoá. Ngoài ra: **không có cặp Pāli trùng nguyên văn trong chính bài** (0 cặp), nên không có cặp nào mà bản Việt khác — không có gì để đối chiếu ở phạm vi bài, và đây là phép đo rỗng, không phải phép đạt. Sang phạm vi bài khác trong cùng phẩm: **3072** cặp Pāli trùng nguyên văn đã dò, trong đó **2034** cặp có bản Việt để so; mọi vế kệ đã dịch đều dùng lại đúng cách dịch có sẵn.

  LỖI BẢN NHÁP BẮT ĐƯỢC TRONG LẦN NÀY. (1) `5.4` ban đầu tôi viết *… phạm hạnh.’* (dấu chấm **trong** nháy đóng) theo đúng tiền lệ `iti83:17.4`; nhưng Pāli là `nivesaya’.` — dấu chấm **sau** nháy đóng. Đo toàn tầng: Pāli kết `’.` thì Việt kết `’.` **50** so với `.’` **12** ⇒ đa số phản ánh Pāli; đã sửa thành `… phạm hạnh’.` (2) Chính phép P5 của tôi lúc đầu báo 13 lỗi *rò Pāli* trên các từ *o*, *xong*, *lo*, *cho* — đó là **lỗi của phép**, không phải của bản dịch: tập ký tự dấu tôi ghi lẫn cả `o` và `n` chữ thường. Đã sửa phép, chạy lại, còn 2 cảnh báo cũng là tên riêng cố ý giữ (`Therāpadāna`, `Kuṭaja`). Nói thẳng: nếu tôi tin phép sai đó thì lát này đã bị tôi "sửa" 13 khoá đúng thành sai.

  VÌ SAO `draft`. Chỉ còn **một** lý do, và là lý do đo được chứ không phải chất lượng câu dịch: tầng Anh đã ghim không phủ `tha-ap` (xem `blocking_errors`). Trước đó bài còn bị chặn vì thiếu 51 khoá; lý do đó **đã hết** sau lát này và đã gỡ khỏi `blocking_errors`, `segment_alignment` nâng từ 6.5 lên 10.0. Với `draft` thì `validate` không bật `requireComplete`, nên 52/52 khoá là đủ để giữ trạng thái này mà không cần blocker về segment.
