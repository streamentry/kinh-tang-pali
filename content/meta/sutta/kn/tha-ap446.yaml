notes: |-
  ĐỌC HẾT p44.txt trước khi viết. 0.1 Therāpadāna giữ nguyên Pāli (291/300 khoá :0.1 của tầng tha-ap). 0.2 Vibhītakavagga = Phẩm Cây Vibhītaka (5/6 tệp; chỉ tha-ap447 dùng Phẩm Quả Vibhītaka). 0.3 giữ số 4 ở đầu vì Pāli có; 11.1 thứ tư (27/34 tệp).
  NHÓM KỆ 7.x, 8.x, 9.x trùng nguyên văn ở cả sáu bài tha-ap của lát này: một bản Việt cho mỗi Pāli, chọn theo đa số đo được (Các phiền não của ta đã được thiêu rụi 56/85 · ta sống không còn lậu hoặc 56/84 · Thật lành thay sự đến của ta 54/82 · đã làm tròn lời dạy của Đức Phật 60/82 · Bốn vô ngại giải 300/300 · đã làm tròn lời dạy của Đức Phật”. 270/299 · …pe… giữ đúng một dấu lược).
  KỆ KẾT 6.1-6.4 trùng nguyên văn với tha-ap441:6.1-6.4, tôi dùng cùng bản dịch cho cả hai: Vào một ngàn tám trăm kiếp trước (3/9 tệp) · khi ta dâng cúng trái cây ấy · Ta không biết mình rơi vào khổ đau (93/278 tệp) · đây là quả báo của việc dâng cúng trái cây (11/31 tệp).
  CÁC KỆ GIỮA ĐÃ TRA. Anukampako kāruṇiko = Là bậc đầy lòng trắc ẩn từ bi (tha-ap271:2.1, nguyên văn) · Mama saṅkappamaññāya = Nhờ thấu rõ ý định của ta (2 tệp) · padhānapahitattohaṁ / upasanto nirūpadhi / Sabbāsave pariññāya: trùng nguyên văn tha-ap347:7.1-7.3, dùng lại nguyên văn · Tattha cittaṁ pasādetvā = sau khi khiến tâm tịnh tín nơi đó (tha-ap520:3.3) · paṇṇasanthara = tấm thảm lá (tha-ap100:1.2) · buddhaseṭṭhassadāsahaṁ = ta dâng lên Đức Phật tối thượng (3/8 tệp) · atthadassī theo tha-ap38:1.2 và tha-ap50:3.2. 0 tiền lệ: Suvaṇṇavaṇṇa (sắc vàng ròng), Vipinaggena (tỏa lan), Sālarāja (vua xoan hậu), Tiṇatthara (chiếu cói), orūhi mama assame (đi xuống ngang bậc tôi), vāhasā, Bhallātaka.
  BẤT ĐỊNH ĐÃ GHI NHẬN. (1) 1.1 Suvaṇṇavaṇṇaṁ sambuddhaṁ: đa số trong tầng là Lên Đức Phật Chánh Đẳng Giác màu vàng ròng (5/13 khoá) nhưng chữ Lên ở đầu câu là lỗi dán, nên tôi dịch Đức Chánh Đẳng Gác sắc vàng ròng và ghi lý do; tha-ap186:3.1 có biến thể Đức Chánh Giác sắc vàng chói lọi cũng gần nghĩa. (2) 5.1 Mama nijjhāyamānassa trùng nguyên văn tha-ap441:3.1, tôi dùng cùng cách dịch Khi tôi đang sống an nhàn. (3) 2.3-2.4 là lời cầu xin trong nháy đơn của Pāli; tôi giữ nháy đơn, ngoặc kép của bài vẫn cân.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
