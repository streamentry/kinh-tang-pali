notes: |-
  **Tên, đo được:** `0.1` `Jātaka` → *Jātaka* (**422×**, đối lập *Chuyện Tiền Thân* 16×) · `0.2` `Ekādasakanipāta` → *Bộ Mười Một Bài Kinh* (2×: **ja460, ja462** — dùng lại nguyên văn) · `0.3` `Mātuposakavagga` → *Phẩm Voi Hiếu Mẹ* (2×: **ja460, ja462** — dùng lại nguyên văn) · `0.4` `3. Dhammadevaputtajātaka` → *3. Kinh Dạ-xoa Dhammadevaputta*, theo khuôn *<n>. Kinh <Tên>* (447 tệp `ja` có `:0.4`) và theo **`cp18:0.4`** `Dhammadevaputtacariya` → *Hạnh Của Dạ-xoa Dhammadevaputta* — `cp18` chính là truyện cùng nhân vật, nên cách gọi *Dạ-xoa* đã có tiền lệ và dùng lại · `12.1` → *Kinh Dạ-xoa Dhammadevaputta thứ ba.* theo khuôn `ja460:12.1` *Kinh Yudhañcaya thứ sáu.* và `ja462:12.1` *Kinh Saṁvara thứ tám.*

  **Truyện này có bản kể lại trong `Cariyāpiṭaka`, và tôi đã dùng nó làm tiền lệ.** `cp18` (`Dhammadevaputtacariya`, `Sīlapāramī 8`) kể cùng nhân vật: `Dhammo nāma mahāyakkho` → *tên là Dhamma, một Dạ-xoa lớn lao*; `sabbalokānukampako` → *thương tưởng cả thế gian*; `Dhure dhuraṁ ghaṭṭayantā` → *Xô nhau bằng cả hai cán xe*. Nhờ vậy `devaputta` → *Dạ-xoa* và tên `Dhamma` giữ nguyên Pāli theo quy ước của bộ Jātaka trong tầng này, không phiên dịch thành *Pháp*.

  **Dấu nháy kép khớp Pāli TỪNG KHOÁ (đếm bằng script, không đếm tay):** `“` mở ở `1.1`, `2.1`, `3.1`, `4.1`, `5.1`, `8.1`; `”` đóng ở `1.4`, `2.4`, `3.4`, `4.4`, `7.4`, `11.5` (giữ `ti`); nháy đơn `‘…’` của lời thoại ở `8.3` tự mở tự đóng đúng như Pāli. Tổng 6/6 và 1/1. Cảnh báo cho lát sau: **tệp `vc/p87.txt` hiển thị sai dấu nháy kép của Pāli** — nó in `Adhammayānaṁ daḷhamāruhitvā,` cho `ja457:2.1` trong khi Pāli thật là `“Adhammayānaṁ daḼhamāruhitvā, `; tôi đã bị điều này một lần và phải đối chiếu lại với `pal()`.

  **BẤT ĐỊNH — bài không có tầng Anh nào để đối chiếu, nên các chỗ sau tôi đọc từ Pāli và ghi lại thay vì im lặng.**
  1. `Yasokaro` (`1.1`) chỉ xuất hiện **đúng một lần trong toàn bộ snapshot Pāli đã ghim** (đã dò bằng script trên `.cache/upstream/suttacentral/root/pli/ms/sutta`). Tôi đọc là danh từ chủ ngữ — *“Tôi là Yasoka, kẻ gieo phước,* — nhưng cách đọc còn lại là gọi tên người nghe (gọi `Dhammo` ở `1.4`). Người rà soát nên phán một lần. Việc người kể chuyện có mở đầu bằng tên người nghe là chuyện thường gặp ở Jātaka, nên cách gọi tên cũng không vô lý.
  2. Xác định người nói. Pāli đổi người nói không có dấu hiệu: `1.1`–`1.3` tự xưng là kẻ gieo phước, `1.4` xưng hô `Dhamma`, `2.1`–`2.4` đáp lại, `3.1`–`3.4` kể chuyện, `4.1`–`4.4` thách tranh, `5.x`–`7.x` tự khen rồi hứa, `8.1`–`8.4` là lời kẻ bất thiện, `9.x`–`11.5` là lời kết của người kể. Tôi **không ghi tên người nói vào bản dịch** vì Pāli không ghi; chỉ giữ đúng các xưng hô mà Pāli có (`Dhamma`, `tôi`, `ngươi`).
  3. `7.3`–`8.4` là điều kiện, không phải lời hứa. `Maggañca te dammi` (`dammi`, không có dấu `ā`) đứng trong chuỗi `Sace tuvaṁ …` và sau đó `8.3`–`8.4` là lời nói *nếu không được tranh đấu thì ta bị đánh bại đến thế thôi*. Tôi dịch `7.3` là *ta cũng sẽ trao cho ngươi con đường* (tương lai, theo mệnh đề lệnh); cách đọc khác là thì hiện tại. Đây là chỗ dễ sai nhất của bài.
  4. `9.3` `Pāyāsi vitto abhiruyha sandanaṁ` và `11.5` `Yathāpi dhammo abhiruyha sandanan` dùng chung `abhiruyha sandanaṁ`. Tôi dịch cả hai là *đã đến nơi tranh đấu*, giữ đúng sự song song mà Pāli dựng ra. Nhưng `sandanaṁ` còn có thể là *bước nhảy*, và `9.1`–`9.2` (`Khantībalo … vijetvā, Hantvā adhammaṁ nihanitva bhūmyā`) đã mô tả thắng trận bằng sức nhẫn rồi mới sang câu `Pāyāsi`, nên đọc `9.3` là chủ thể khác hay chính nhân vật ấy vẫn chưa chắc.

  **0 tiền lệ cho các cụm sau, dựng từ Pāli, ghi lại để lát sau không phát minh thêm cách:** `maggāraho` → *tự xưng là Đạo sư* · `puññakaro` → *kẻ gieo phước* (`iti71:6.1` dịch `puññakaro` là *làm phước*) · `Asantasanto` → *không gì sánh bằng* (`asanta` = không gì bằng, thấy `Sīhova saddesu asantasanto` ở snp1.3 và cnd23) · `santāna` → *vĩnh cửu* · `sammānita` → *được tôn kính* (*tôn kính* 517 khoá) · `avaṁsiro` → *nhục nhã* (*nhục nhã* 5 khoá) · `patito uddhapādo` → *chân chạm đất* (0 tiền lệ) · `adaḷha` ở `2.1` → *thủng lỗ* · `yo ṭhāso viya` ở `6.4` → *hòn đá mạ vàng* · `piyāppiya` → *thân thiết hay không thân thiết* · `Vācāduruttāni` → *lời nói cay nghiệt* (0 tiền lệ). **Có tiền lệ và đã dùng lại:** `devamanussapūjito` → *được chư Thiên và loài người tôn thờ* (`pv30:6.1`, nguyên văn) · `adhamma` → *bất thiện* (**1259** khoá; *phi pháp* chỉ 192) · `samaṇabrāhmaṇā` → *sa-môn và bà-la-môn* · `niraya` → *địa ngục* (624) · `sugati` → *cảnh lành* (34) · `kāyassa bhedā` → *sau khi thân hoại mạng chung* · `saccanikkamo` → *chân thật tuyệt đối* (`snp3.6:46.4` *có sức mạnh chân thật* cho `Dhitimā saccanikkamo`).

