notes: |-
  **Tên, đo được:** `0.1` `Jātaka` → *Jātaka* (**422×**, đối lập *Chuyện Tiền Thân* 16×) · `0.2` `Ekādasakanipāta` → *Bộ Mười Một Bài Kinh* (2×: **ja460, ja462** — dùng lại nguyên văn) · `0.3` `Mātuposakavagga` → *Phẩm Voi Hiếu Mẹ* (2×: **ja460, ja462** — dùng lại nguyên văn) · `0.4` `3. Dhammadevaputtajātaka` → *3. Kinh Dạ-xoa Dhammadevaputta*, theo khuôn *<n>. Kinh <Tên>* (447 tệp `ja` có `:0.4`) và theo **`cp18:0.4`** `Dhammadevaputtacariya` → *Hạnh Của Dạ-xoa Dhammadevaputta* — `cp18` chính là truyện cùng nhân vật, nên cách gọi *Dạ-xoa* đã có tiền lệ và dùng lại · `12.1` → *Kinh Dạ-xoa Dhammadevaputta thứ ba.* theo khuôn `ja460:12.1` *Kinh Yudhañcaya thứ sáu.* và `ja462:12.1` *Kinh Saṁvara thứ tám.*

  **Truyện này có bản kể lại trong `Cariyāpiṭaka`, và tôi đã dùng nó làm tiền lệ.** `cp18` (`Dhammadevaputtacariya`, `Sīlapāramī 8`) kể cùng nhân vật: `Dhammo nāma mahāyakkho` → *tên là Dhamma, một Dạ-xoa lớn lao*; `sabbalokānukampako` → *thương tưởng cả thế gian*; `Dhure dhuraṁ ghaṭṭayantā` → *Xô nhau bằng cả hai cán xe*. Nhờ vậy `devaputta` → *Dạ-xoa* và tên `Dhamma` giữ nguyên Pāli theo quy ước của bộ Jātaka trong tầng này, không phiên dịch thành *Pháp*.

  **Dấu nháy kép khớp Pāli TỪNG KHOÁ (đếm bằng script, không đếm tay):** `“` mở ở `1.1`, `2.1`, `3.1`, `4.1`, `5.1`, `8.1`; `”` đóng ở `1.4`, `2.4`, `3.4`, `4.4`, `7.4`, `11.5` (giữ `ti`); nháy đơn `‘…’` của lời thoại ở `8.3` tự mở tự đóng đúng như Pāli. Tổng 6/6 và 1/1. Cảnh báo cho lát sau: **tệp `vc/p87.txt` hiển thị sai dấu nháy kép của Pāli** — nó in `Adhammayānaṁ daḷhamāruhitvā,` cho `ja457:2.1` trong khi Pāli thật là `“Adhammayānaṁ daḼhamāruhitvā, `; tôi đã bị điều này một lần và phải đối chiếu lại với `pal()`.

  **BẤT ĐỊNH — bài không có tầng Anh nào để đối chiếu, nên các chỗ sau tôi đọc từ Pāli và ghi lại thay vì im lặng.**
  1. `Yasokaro` (`1.1`) chỉ xuất hiện **đúng một lần trong toàn bộ snapshot Pāli đã ghim** (đã dò bằng script trên `.cache/upstream/suttacentral/root/pli/ms/sutta`). Tôi đọc là danh từ chủ ngữ — *“Tôi là Yasoka, kẻ gieo phước,* — nhưng cách đọc còn lại là gọi tên người nghe (gọi `Dhammo` ở `1.4`). Người rà soát nên phán một lần. Việc người kể chuyện có mở đầu bằng tên người nghe là chuyện thường gặp ở Jātaka, nên cách gọi tên cũng không vô lý.
  2. Xác định người nói. Pāli đổi người nói không có dấu hiệu: `1.1`–`1.3` tự xưng là kẻ gieo phước, `1.4` xưng hô `Dhamma`, `2.1`–`2.4` đáp lại, `3.1`–`3.4` kể chuyện, `4.1`–`4.4` thách tranh, `5.x`–`7.x` tự khen rồi hứa, `8.1`–`8.4` là lời kẻ bất thiện, `9.x`–`11.5` là lời kết của người kể. Tôi **không ghi tên người nói vào bản dịch** vì Pāli không ghi; chỉ giữ đúng các xưng hô mà Pāli có (`Dhamma`, `tôi`, `ngươi`).
  3. `7.3`–`8.4` là điều kiện, không phải lời hứa. `Maggañca te dammi` (`dammi`, không có dấu `ā`) đứng trong chuỗi `Sace tuvaṁ …` và sau đó `8.3`–`8.4` là lời nói *nếu không được tranh đấu thì ta bị đánh bại đến thế thôi*. Tôi dịch `7.3` là *ta cũng sẽ trao cho ngươi con đường* (tương lai, theo mệnh đề lệnh); cách đọc khác là thì hiện tại. Đây là chỗ dễ sai nhất của bài.
  4. `9.3` `Pāyāsi vitto abhiruyha sandanaṁ` và `11.5` `Yathāpi dhammo abhiruyha sandanan` dùng chung `abhiruyha sandanaṁ`. Tôi dịch cả hai là *đã đến nơi tranh đấu*, giữ đúng sự song song mà Pāli dựng ra. Nhưng `sandanaṁ` còn có thể là *bước nhảy*, và `9.1`–`9.2` (`Khantībalo … vijetvā, Hantvā adhammaṁ nihanitva bhūmyā`) đã mô tả thắng trận bằng sức nhẫn rồi mới sang câu `Pāyāsi`, nên đọc `9.3` là chủ thể khác hay chính nhân vật ấy vẫn chưa chắc.

  **0 tiền lệ cho các cụm sau, dựng từ Pāli, ghi lại để lát sau không phát minh thêm cách:** `maggāraho` → *tự xưng là Đạo sư* · `puññakaro` → *kẻ gieo phước* (`iti71:6.1` dịch `puññakaro` là *làm phước*) · `Asantasanto` → *không gì sánh bằng* (`asanta` = không gì bằng, thấy `Sīhova saddesu asantasanto` ở snp1.3 và cnd23) · `santāna` → *vĩnh cửu* · `sammānita` → *được tôn kính* (*tôn kính* 517 khoá) · `avaṁsiro` → *nhục nhã* (*nhục nhã* 5 khoá) · `patito uddhapādo` → *chân chạm đất* (0 tiền lệ) · `adaḷha` ở `2.1` → *thủng lỗ* · `yo ṭhāso viya` ở `6.4` → *hòn đá mạ vàng* · `piyāppiya` → *thân thiết hay không thân thiết* · `Vācāduruttāni` → *lời nói cay nghiệt* (0 tiền lệ). **Có tiền lệ và đã dùng lại:** `devamanussapūjito` → *được chư Thiên và loài người tôn thờ* (`pv30:6.1`, nguyên văn) · `adhamma` → *bất thiện* (**1259** khoá; *phi pháp* chỉ 192) · `samaṇabrāhmaṇā` → *sa-môn và bà-la-môn* · `niraya` → *địa ngục* (624) · `sugati` → *cảnh lành* (34) · `kāyassa bhedā` → *sau khi thân hoại mạng chung* · `saccanikkamo` → *chân thật tuyệt đối* (`snp3.6:46.4` *có sức mạnh chân thật* cho `Dhitimā saccanikkamo`).

  **Dấu lược: Pāli 0 `…pe…` ↔ Việt 0 `…`.** Chốt `_hvi.py` sạch: 51/51 khoá, khoá thừa 0, NFC OK, ngoặc kép cân.

  **Lượt cải thiện 2026-10-11 (đọc đối kháng từng khoá; thay thế các kết luận cũ nêu ở trên khi mâu thuẫn).** Bản trước đọc sai cấu trúc câu ở nhiều chỗ và đã bị sửa: đổi 46/51 khoá (0.4, 1.1–1.4, 2.1–2.4, 3.1–3.4, 4.1–4.4, 5.1–5.4, 6.1–6.4, 7.1–7.4, 8.1–8.4, 9.1–9.4, 10.1–10.5, 11.1–11.5, 12.1); giữ nguyên 0.1–0.3 và tập khoá.
  1. **Sửa lỗi nghĩa (accuracy).** `Yasokaro puññakaro` (1.1) là hai tính từ đồng cách với `ahaṁ`, không phải tên riêng *Yasoka* (`1.4` có `Dhammo ahaṁ`, nên người nói là Dhamma) → *người tạo danh tiếng, người tạo phước*. `Sadātthuto` (1.2) → *luôn được … tán dương* (bản cũ *đúng như … mong muốn*). `maggāraho` (1.3) = *đáng được nhường đường* (cùng cấu trúc `mn135:15.2` `maggārahassa na maggaṁ deti`, Việt *người đáng được nhường đường*), không phải *Đạo sư*. `adhamma` ở 1.4 là hô cách: *hỡi Adhamma, hãy nhường đường* (bản cũ ghép nhầm thành *trao … con đường bất thiện*). `Adhammayānaṁ daḷhamāruhitvā` (2.1) = *đã vững vàng lên cỗ xe phi pháp* (`yāna` là cỗ xe; bản cũ *chiếc thuyền thủng lỗ*, sai hẳn); `Asantasanto` (2.2) = *không kinh sợ* (đo: `snp1.3:37.1`, `snp1.12:7.3`, `tha-ap2:46.1` đều *không kinh sợ*; bản cũ *không gì sánh bằng*, lặp sai với `atulyo`); `adinnapubbaṁ` + hô cách `dhamma` (2.4) = *hỡi Dhamma, con đường chưa từng được nhường* (bản cũ *chưa từng học được từ Dhamma*). `Uyyāhi … kaniṭṭha maggā` (3.4) là mệnh lệnh *hãy rời khỏi con đường* gọi *kẻ nhỏ hơn* (bản cũ đảo thành *kẻ nhỏ hơn đẩy bậc lớn hơn*). 4.1–4.2 là ba vế phủ định (`na yācanāya napi pātirūpā na arahatā`), không phải *bậc A-la-hán trao*. 5.2 `amitayaso` = *danh tiếng vô lượng* (đo 15 nơi trong tầng; bản cũ *không biết mệt*), `atulyo` = *vô song* (`snp3.11:5.1`, `snp1.5:3.3`). 6.4 *hòn đá mạ vàng* là bịa, không có trong Pāli → *sắt sẽ đáng nhìn như vàng*. 8.2 `avaṁsiro patito uddhapādo` = *đầu chúi xuống, rơi xuống, chân chổng lên* (đo: `ja522:23.2`, `pv39:22.4`, `vv52:24.4`, `ja530:20.2`; bản cũ *nhục nhã, chân chạm đất* — sai). 9.1 `Khantībalo` là chủ ngữ *bậc lấy nhẫn nhục làm sức mạnh* (đo `snp3.9:35.3`, `dhp399:3`), không phải *bằng sức nhẫn nại*. 9.3 `Pāyāsi vitto abhiruyha sandanaṁ` = *hoan hỷ lên cỗ xe và ra đi* (`sandana` = cỗ xe, đo `ja535:34.2`, `ja530:3.2`, `vv64:1.2`; bản cũ *đến nơi tranh đấu* và chú thích bất định *bước nhảy* đều sai). 9.4 `saccanikkamo` → *có sự nỗ lực chân thật* (dùng lại `ja535:31.2`; bản cũ *chân thật tuyệt đối*, và đã dẫn nhầm `snp3.6:46.4`).
  2. **Thuật ngữ (terminology 8.8 → 9.0).** `Dhamma`/`Adhamma` giữ nguyên làm tên hai nhân vật xuyên suốt (bản cũ lẫn *Chánh pháp* với *Dhamma* và dịch *bất thiện*; đo chặt: token `adhammo/adhamma` trong tầng được dịch *phi pháp* ~100 lần, *bất thiện* 0 lần; ghi chú cũ nói *bất thiện 1259* là đếm nhầm từ `akusala`). `maggaṁ deti` → *nhường đường* (đo `mn135:15.2`, `mn135:16.2`, `cp18:7.4` *nhường lối đi*). Cặp đại từ thống nhất *ta*/*ngươi* (bản cũ trộn *tôi*/*ta*). `sugatiṁ` → *cõi lành* (đo: 152 so với 35 khoá *cảnh lành*, riêng bộ `ja` 11 so với 1; chỗ *cảnh lành* trong ghi chú cũ lấy từ `mn`). `kāyassa bhedā` đứng riêng, không có `param maraṇā` → *khi thân hoại*, bỏ *mạng chung* (đo `ja535:16.4`, `ja535:17.4`). `guṇa` → *đức tính* (87 khoá). `Idheva nikkhippa sarīradehaṁ` (10.3, 11.3) dùng lại nguyên văn `ja535:16.3`/`ja535:17.3` *bỏ lại thân xác ngay tại đây*. `duruttāni` → *lời nói thô bạo* (đo `mn2:18.2`); `khamāmi` → *chịu đựng* (đo `mn2:18.2`). `yuddha` (sự kiện) → *trận chiến*, `yuddhabala` → *sức mạnh chiến đấu*. `sanantano` → *cổ xưa* (đo `mn128:6.20`).
  3. **Tên bài.** `devaputta` được dịch *thiên tử* ở 221 khoá và *Dạ-xoa* chỉ ở 2 chỗ (`cp18` và bài này); *Dạ-xoa* là từ của `cp18:1.3` (`mahāyakkho`), không có trong tên Pāli của bài này. Đổi `0.4` và `12.1` thành *Kinh Dhammadevaputta* / *Kinh Dhammadevaputta thứ ba.* theo khuôn *Kinh <Tên Pāli>* (đã dùng ở `ja460`, `ja462`) và meta `translationTitle` theo. **Lỗi ngoài phạm vi, không sửa:** `cp18:0.4` và `cp18:9.1` cũng ghi *Dạ-xoa Dhammadevaputta* cho `devaputta`.
  4. **Người nói.** Đọc lại: `1`, `3`, `5`–`7` là Dhamma; `2`, `4` là Adhamma; `8`–`11` là lời kể. Cách đọc này khớp `cp18` (Dhamma tự nhường đường; Adhamma bị mặt đất nuốt). Không ghi tên người nói vào thân kinh.
  5. **Điểm.** `semantic_fidelity` 9.0 → 8.8 (bản cũ chấm 9.0 trên một bản có ≥ 25 lỗi nghĩa nêu trên; bản sau khi sửa vẫn còn các bất định dưới đây nên không nâng); `terminology` 8.8 → 9.0 (theo mục 2); `technical_integrity` 9.8 → 9.6 vì lượt này không chạy được cổng — chưa chạy `npm run validate` · `npm test` · `npm run check` · `npm run build` sau khi sửa; `grammar_logic` 8.9, `vietnamese_clarity` 9.0, `ambiguity_integrity` 8.8, `triangulation` 7.0 (không có tầng Anh/Việt độc lập), `han_viet_balance` 9.2, `segment_alignment` 10.0 và `source_provenance` 9.5 giữ nguyên. Kiểm bằng tay: 51/51 khoá, 0 khoá thừa/thiếu, thứ tự khoá = thứ tự Pāli, nháy `“”‘’` và `…` khớp Pāli từng khoá (0 lệch / 51), NFC, 0 khoá rỗng, 0 chữ số. 2 cặp Pāli trùng nguyên văn trong bài (`10.1`/`11.1`, `10.3`/`11.3`), 0 cặp mà Việt khác.
  **Bất định CÒN LẠI sau lượt này (không phân xử được, không đoán):** (a) `Yasokaro` là hapax trong snapshot đã ghim; đọc là tính từ (*người tạo danh tiếng*) vì `1.4` đã có `Dhammo ahaṁ`, nhưng không loại hẳn khả năng là tên riêng. (b) `vitto` ở 9.3: đọc là *hoan hỷ* (`vitta` nghĩa *vui mừng*); không có tiền lệ trong tầng (0 khoá `vitto` độc lập), chưa loại khả năng khác. (c) `piyāppiyena` ở 7.3: *dù ưa hay ghét* — chủ thể ưa/ghét không rõ; không có bản song song để phân xử. (d) `arahatā` ở 4.2 đọc là *sự xứng đáng* (đối ứng `maggāraho` ở 1.3), không phải *bậc A-la-hán*. (e) `Adhammayānaṁ` ở 2.1 có thể là danh từ riêng *xe của Adhamma* hoặc tính từ *cỗ xe phi pháp*; đã dịch *cỗ xe phi pháp*. (f) `7.3` `dammi` là hiện tại *ta … nhường đường*, mệnh lệnh nhượng bộ; cách đọc khác là tương lai. (g) `8.3` là lời của ai (Adhamma tự nghĩ) — Pāli không nói; chỉ giữ nháy đơn. (h) `6.4` `dassaneyyaṁ`: *đáng nhìn* theo `cnd19:5.4`, `dn30:1.18.8`; ý *sắt sẽ được ưa chuộng như vàng* là lập luận phản chứng, đọc đúng nhưng không có song song để kiểm.
