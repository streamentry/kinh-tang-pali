notes: |-
  Dịch trực tiếp từ Pāli root, 90/90 khoá; không có tầng tham khảo nào để đối chiếu (đo và chứng cứ ở `blocking_errors`).
  `translationTitle` đặt BẰNG ĐÚNG khoá `:0.3`. Pāli `:0.3` là `Maṇipūjakattheraapadāna`, không bắt đầu bằng chữ số, nên không có số thứ tự (quy tắc: giữ số khi và chỉ khi Pāli bắt đầu bằng số). Hình thức `Bài Kệ Tuyên Ngợ Về Trưởng Lão X` theo phạm vi gần nhất: cả 9 bài cùng Phẩm Vòng Hoa Sậy đã có trong kho (tha-ap473, 475-482) đều dùng `Tuyên Ngợ`; tha-ap440-500 là 41 `Tuyên Ngợ` · 10 `Ký Sự` · 2 `Tuyên Ngôn`; toàn tầng tha-ap 240 `Tuyên Ngợ` · 123 `Tuyên Ngôn` · 104 `Ký Sự` · 10 `Tuyên Ngợi`. Tôi đi theo `Tuyên Ngợ` vì phạm vi gần nhất áp đảo, dù ngờ rằng đây là lỗi chính tả (đa số có thể phải là `Tuyên Ngôn`); xin người biên tập phán một lượt cho cả cuốn, sửa hàng loạt chứ không sửa riêng bài này. Cả `:0.3` lẫn `:24.1` dùng cùng hình thức. Tên Trưởng lão giữ Pāli là `Maṇipūjaka` (cùng cách giữ tên ở tha-ap180:0.3 và `:6.1` của bài đó); lưu ý tha-ap180 cũng là Trưởng lão Maṇipūjaka, thứ tám của Phẩm Kumuda, nên đây là bài thứ hai cùng tên trong tầng, không phải bài trùng uid. `:24.1` `dutiyaṁ` = `thứ hai`, khớp thứ tự trong phẩm (tha-ap473 thứ nhất, tha-ap475 thứ ba).
  Pāli trùng nguyên văn trong tầng `tha-ap` và `thi-ap` đã dịch: 47/90 khoá có cặp trùng; dùng lại nguyên văn bản dịch đã có ở 38 khoá, khác ở 9 khoá, mỗi chỗ có lý do. Các khoá dùng lại gồm `Therāpadāna` (473×) · `Naḷamālivagga` → `Phẩm Vòng Hoa Sậy` (9/9) · `Padumuttaro nāma jino,` (11/12) · `sabbadhammāna pāragū;` (6/8) · `Padumuttaro lokavidū,` (13/14) · `āhutīnaṁ paṭiggaho;` (16/18) · `Antalikkhe ṭhito satthā,` (6/7) · `jalajuttamanāmako;` (6/7) · `Sakaṁ cittaṁ pasādetvā,` (8/13) · `Mama saṅkappamaññāya,` (11/26) · `Yaṁ yaṁ yonupapajjāmi,` (12/16) · `devattaṁ atha mānusaṁ;` (10/17) · `pattomhi acalaṁ padaṁ.` (3/3) · `Satasahassito kappe,` → `Vào một trăm ngàn đại kiếp trước,` (23/34; phạm vi tha-ap440-500 là 7/13) · `Chaḷasītisahassāni,` (2/2) · `Kilesā jhāpitā mayhaṁ,` (99/154) · `viharāmi anāsavo.` (100/146) · `Svāgataṁ vata me āsi,` (93/147) · `kataṁ buddhassa sāsanaṁ.` (116/150) · `kataṁ buddhassa sāsanaṁ”.` (459/499) · `ādittaṁva hutāsanaṁ.` (2/3) · `addasaṁ lokanāyakaṁ;` (1/6) · `devarajjamakārayiṁ;` (3/9) · `cakkavattī ahosahaṁ.` (6/9) · `mahājātassaro ahu;` (2/3) · `Paṭisambhidā catasso,` (496/502) · ba khoá `…pe…` → `…` (698/698) · và `:23.1` dùng nguyên văn tha-ap180:6.1 (Pāli trùng tuyệt đối, cùng Trưởng lão).
  Cố ý khác tiền lệ ở 9 khoá: (a) `:19.3` `Duggatiṁ nābhijānāmi,` chọn `Ta không còn biết đến đọa xứ,` (toàn tầng 54 trên 416 khoá cùng Pāli, cộng `Tôi … đọa xứ nào` 93; phạm vi tha-ap440-500 là 25) thay vì `Ta không biết mình rơi vào khổ đau,` (toàn tầng 139, phạm vi gần 17), vì `duggati` là đọa xứ chứ không phải khổ đau. (b) `:4.4` `avandiṁ satthuno ahaṁ.` bỏ `cúi đầu` của 2 tiền lệ (tha-ap271:3.4, tha-ap321:5.4) vì Pāli chỉ nói `đảnh lễ`; thêm `ta` theo `ahaṁ` tường minh. (c) `:6.4` `imaṁ gāthaṁ abhāsatha.` chọn `đã nói lên bài kệ này:` (1 tiền lệ, tha-ap111:5.4) thay vì `bậc Đạo Sư đã nói lên bài kệ này:` (4 tiền lệ) vì Pāli không lặp `satthā` ở khoá này (`:6.3` đã có `Bậc Đạo Sư`). (d) `:3.3` `Indīvaraṁva jalitaṁ,` bỏ tên `indīvara` mà 2 tiền lệ giữ nguyên Pāli, dịch `hoa sen xanh`. (e) `:1.3` `Vivekakāmo sambuddho,` mỗi tiền lệ 1 khoá cho một cách khác nhau (`nơi tĩnh lặng`, `hạnh viễn ly`); tôi dùng `Đức Chánh Đẳng Giác ưa thích sự viễn ly`. (f) `:9.3` `Anekasatakkhattuñca,` 1 tiền lệ dịch `Và sau cả trăm lần nữa,`; tôi dịch `Và hàng trăm lần,` sát `aneka-sata-kkhattuṁ`. (g) `:15.2` `ye labhanti upassutiṁ;` tha-ap450:5.2 dịch `được nghe pháp`; Pāli không có `dhamma`, tôi dịch `có được cơ hội lắng nghe`. (h) `:18.2` `anubhotvāna sampadā;` các tiền lệ chủ yếu là `anh đã thọ nhận được thành tựu` (3) thuộc bài khác ngôi; tôi dùng dạng phân từ `sau khi đã thọ hưởng các thành tựu` như tha-ap342:11.2. (i) `:2.1` `Avidūre himavantassa,` 1 tiền lệ dịch `Từ chỗ xa trên núi ấy`, lệch nghĩa `avidūre` (không xa), nên dịch `Không xa núi Himavanta`; `:3.1` `Bhavanā abhinikkhamma,` dùng `nơi ở` (bhavana: 4 tiền lệ `nơi ở`, 2 tiền lệ `nơi cư ngụ`) nhất quán với `:2.3`; `:12.3` thêm chủ ngữ `Họ` vì động từ `Parivārenti` là ngôi ba số nhiều.
  Pāli trùng nguyên văn trong chính bài: 4 nhóm (`:5.3`/`:7.3`, `:12.4`/`:19.4`, `:16.4`/`:18.4`, và ba khoá `…pe…` ở `:20.2`/`:21.2`/`:22.2`), cả 4 nhóm đều cho bản Việt giống hệt nhau, 0 cặp Việt khác. Hai chỗ có ngữ cảnh khác nhưng không phải trùng Pāli: `:5.3` và `:7.3` đứng ở hai bên của lời nói của Đức Padumuttara (cúng dường rồi nguyện; lời chúc đáp lại), vẫn cùng một cách dịch vì Pāli y hệt.
  Ngôi thứ nhất chọn `ta` cho toàn bài, theo các bài cùng phẩm (tha-ap473, 475-482), khối kết `ta sống không còn lậu hoặc` và `:9.2` `ta đã làm ra vương quyền nơi chư thiên;`. Riêng `:23.1` dùng đúng nhóm `…đã nói những bài kệ này` (số nhiều, khớp `imā gāthāyo`; đo 407 khoá nhóm này, 21 khoá nhóm số ít `…đã từng nói bài kệ này`).
  Số và thuật ngữ: `chaḷasīti` = cha 6 + asīti 80 = 86, viết `Tám mươi sáu ngàn` (2 tiền lệ tha-ap485:13.1, tha-ap560:13.1 cùng chữ); `saṭṭhi` = 60 (`sáu mươi kiếp`, theo mẫu `Suốt ba mươi kiếp` của tha-ap459:6.1); `satasahassa` = 100 × 1000 = 100.000 (`một trăm ngàn`); `anekasata` = nhiều trăm, không phải số cụ thể, nên không tự đặt số. Cụm `Tiṁsakappasahassa` không xuất hiện ở bài này; nhắc rằng `tiṁsa` = 30 theo đo tầng nhưng cụm ghép `tiṁsakappasahassa` vẫn chưa phân xử được và không liên quan đến bài này. `bhavana` = `nơi ở`; `lokanāyaka` = `Đấng Dẫn Đạo thế gian` (nhất quán với tha-ap485/560); `nāyaka` đứng một mình = `Đấng Dẫn Đạo`; `maṇi` = `ngọc`/`viên ngọc`, `lohitaṅga` = `hồng ngọc` (tha-ap449:3.2 dịch `đá quý`, 1 tiền lệ, mơ hồ hơn Pāli); `duggati` = `đọa xứ` còn `vinipāta` (`:16.3`) = `nơi đọa lạc` để không dùng cùng một chữ cho hai thuật ngữ khác nhau (tha-ap336:8.4 dịch `đọa xứ`, tha-ap343:7.4 dịch `khổ đau`); `saṅkappa` ở `:14.3` giữ `ý định` theo 23 tiền lệ, còn `:7.1` là lời chúc nên dùng `ý nguyện`.
  Bất định, ghi ở đây chứ không giải thích trong thân kinh: (1) `:4.2` `pūjayissanti` có thể là ngôi ba số nhiều (`họ sẽ cúng dường`) hoặc là `pūjayissaṁ` + dấu `ti` đã hợp âm (`ta sẽ cúng dường`; thi-ap8:4.4 dùng dạng `pūjayissaṁ … ’`); tôi dịch trung tính `để cúng dường Đấng Dẫn Đạo`, không chọn ngôi. (2) `:12.1` `Aḷārapamhā` (0 tiền lệ trong tầng) dịch `mi cong`, và `susaññā` (0 tiền lệ) dịch `dáng người cân đối`; cả hai đều là cách đọc từ điển, chưa có bản Anh đã ghim để đối chiếu. (3) `:11.2` `pariggahā` có thể là `quyến thuộc` hoặc `hầu thiếp, hậu cung`; tôi dịch `quyến thuộc` cho rộng. (4) `:13.4` `yadicchasi` là động từ ngôi hai số ít (`ngươi muốn`), không phải `yadicchakaṁ` như ở `:14.4`; tôi giữ ngôi hai đúng chữ, tức đọc là `tùy theo điều ngươi muốn` (ngôi hai phiếm chỉ), và `bhaṇḍā` là `vật dụng`, `piḷandhanā` là `trang sức`; có thể đây là biến thể chép sai của `yadicchasi` → `yadicchakaṁ`. (5) `:14.1` `gahārammā` đọc là `gahā` (nhà) + `rammā` (xinh đẹp), `kūṭāgārā` = `lầu gác` (tha-ap20:7.2, tha-ap563:7.2). (6) `:15.1`-`:15.4` `upassutiṁ` + `puññakkhettaṁ manussānaṁ, osadhaṁ sabbapāṇinaṁ`: cú pháp lỏng; tôi không nói rõ đối tượng của `lắng nghe` hay bổ ngữ của `ruộng phước`/`phương thuốc` (có thể chỉ Đức Phật). (7) `:7.4` `mahāyasaṁ` có thể là `danh tiếng lớn` hoặc `tùy tùng lớn` (yasa); tôi chọn `danh tiếng lớn lao` theo `mahāyaso` (`danh tiếng lớn`, tha-ap485:5.4). (8) `:8.4` `yattha cittaṁ paṇīhitaṁ` đọc là `nơi tâm Ngài đã hướng tới`, chưa có tiền lệ trong tầng. (9) `:10.2` `devabhūtassa me sato` đọc là `khi ta đang là chư thiên`. (10) `:19.2` `yaṁ maṇiṁ abhipūjayiṁ` đọc là mệnh đề thời gian `khi ta đã cúng dường viên ngọc ấy` theo mẫu `yaṁ pupphamabhipūjayiṁ` → `khi tôi dâng cúng hoa ấy` (tha-ap157:3.2, tha-ap161:3.2).
  Dấu lược: 3 khoá `…pe…` (`:20.2`, `:21.2`, `:22.2`) → đúng một `…` mỗi khoá, khớp Pāli 3/3; Pāli không có `…` trần và không có `(…)`. Ngoặc kép mở ở `:1.1`, đóng ở `:22.3`; nháy đơn mở ở `:7.1`, đóng ở `:7.4`; cả bốn dấu khớp Pāli từng khoá (0 lệch trên 90 khoá). Đã đọc đối chiếu từng cặp Pāli với Việt cả 90 khoá.
  Cổng kỹ thuật CHƯA chạy vì không được phép chạy lệnh npm. Chỉ xác minh được: JSON hợp lệ, `set(khoá Việt) == set(khoá Pāli)` (90/90, đúng thứ tự), NFC, không khoá rỗng, dấu lược và dấu nháy khớp Pāli từng khoá, không Pāli lọt sang bản Việt ngoài tên riêng, YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
