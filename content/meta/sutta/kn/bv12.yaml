notes: |-
  Đợt 19, làn 89. Dịch từ Pāli root commit đã ghim, đủ 126/126 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ mười của Buddhavaṃsa, về Đức Phật Padumuttara (`32.1` `dasamo` = thứ mười, khớp thứ tự: `Sau Nārada`, xem `bv9`–`bv10` cùng khuôn): kiếp Maṇḍa, ba lần chứng ngộ và ba kỳ hội chúng, tiền thân là viên quan xứ Jaṭila dâng vải và thức ăn rồi được thọ ký, việc các ngoại đạo quy y, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các phẩm anh em (16/16 tiền lệ).
  - `0.2` “12. Dòng Kế Thừa Của Đức Phật Padumuttara”: cùng khuôn `bv9:0.2`, `bv19:0.2`; số “12.” là số ghi trong tiêu đề Pāli, còn thứ tự phẩm là thứ mười (xem `32.1`).
  - `32.1` “Dòng kế thừa của Đức Thế Tôn Padumuttara là thứ mười.”: `dasamo` = 10; khớp `bv10:30.1` (Paduma thứ tám), `bv9:30.1` (Anomadassī thứ bảy) và thứ tự `Nārada` → `Padumuttara`.

  **Số Pāli, đã tự tính.** `catu` 4 (22.1 bốn dấu hiệu). `tayo` 3 (8.1 ba kỳ hội chúng khớp ba khoá `8.4`, `9.4`, `10.4` = thứ nhất, thứ hai, thứ ba; ba lần chứng ngộ khớp `3.4`, `4.4`, `6.4`; 20.4 ba lâu đài khớp ba tên ở `20.3`). `koṭisatasahassa` (3.3, 8.3) = koṭi × 100.000, dịch “một trăm ngàn koṭi” (11/11 tiền lệ). `sattatiṁsasatasahassa` (4.3) = 37 × 100 × 1.000 = **3.700.000 (ba triệu bảy trăm ngàn)** (`sattatiṁsa` = 7 + 30; cùng cách đọc `X-sata-sahassa` thành “X triệu” như `bv16:8.1` 78 × 100.000 = “bảy triệu tám trăm ngàn”). `paññāsasatasahassa` (6.3) = 50 × 100.000 = **5.000.000 (năm triệu)**. `navutikoṭisahassa` (9.3) = 90 koṭi × 1.000 = “chín mươi ngàn koṭi” (3/3 tiền lệ, `bv8:5.3`). `asītikoṭisahassa` (10.3) = 80 koṭi × 1.000 = “tám mươi ngàn koṭi” (2/2 tiền lệ). `dasavassasahassa` (20.1) 10 × 1.000 = **10.000 năm**. `ticattārīsasahassa` (21.1) = 3 + 40 = 43 × 1.000 = **43.000** người nữ. `sattāha` (22.3) 7 ngày. `aṭṭhapaṇṇāsaratana` (27.1) = 8 + 50 = **58** ratana (4/4 tiền lệ). `dvattiṁsavaralakkhaṇa` (27.4) 32. `dvādasayojana` (28.4) và `dvādasubbedhayojana` (31.4) = **12** do-tuần. `vassasatasahassa` (29.1) 100 × 1.000 = **100.000 năm** (9/9 tiền lệ). `satasahassito kappe` (12.3) = **một trăm ngàn kiếp**. `dasapāramī` (14.4) 10. Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt hiện có (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 69 khoá của bài có Pāli trùng với khoá bài khác, tổng 1.494 cặp (938 cặp thuộc `13.2` `…pe…`, trong đó 911 giữ đúng một `…`), trong đó 143 cặp có Việt khác bản tôi viết (27 ở `13.2`, chỉ khác dấu cách hoặc dấu nháy mở đầu; 116 ở các khoá còn lại trên 556 cặp). 44 khoá dùng đúng nguyên văn một tiền lệ (`0.1`, `3.3`, `6.3`, `6.4`, `7.1`–`7.3`, `8.1`, `8.3`, `9.3`, `10.3`, `11.3`, `12.1`, `12.2`, `13.3`, `14.1`, `14.4`, `17.2`–`17.4`, `18.1`, `18.3`, `20.1`, `20.2`, `20.4`, `21.1`, `22.1`–`22.4`, `23.1`, `23.3`, `24.2`, `25.2`, `26.2`, `26.4`, `27.1`, `27.2`, `29.1`–`29.3`, `30.3`, `30.4`, `31.2`). Riêng trong các phẩm `bv` (57 khoá, 437 cặp) chỉ 23 cặp Việt khác.
  - `12.3` **cố ý khác** 54/54 tiền lệ. Tiền lệ đều là người kể nhìn ngược về quá khứ (“Vào một trăm ngàn đại kiếp trước” 31, “… kiếp trước đây” 9, “… kiếp trước” 5, và các dạng còn lại). Ở `12.3`–`12.4` là lời thọ ký tương lai (`bhavissati`), nên hướng đếm đảo lại: một trăm ngàn kiếp **sau** thời Padumuttara là thời Gotama. Viết “Sau một trăm ngàn kiếp nữa,” theo `tha-ap539:14.1` (cùng dạng `satasahassito kappe` trong lời thọ ký, “Sau một trăm ngàn kiếp nữa”), cùng dạng với `bv9:14.3`, `bv16:11.3`, `bv18:10.3`, `bv19:13.3`. Pāli ở `12.3` không có chữ chỉ hướng; hướng lấy từ động từ ở `12.4`.
  - `1.3` 25 cặp, 19 khác: chỉ khác dấu nháy mở đầu (18 “Đức Chiến Thắng tên Padumuttara,”) hoặc “tên là”; ở đây Pāli không có nháy mở nên không thêm (nháy mở đã ở `1.1`). `1.2` 6 cặp, 2 khác: hai tiền lệ bỏ “có”; dùng dạng có “có” theo `bv9:1.2`, `bv24:1.2` (4/6) vì ở đây câu 1.1–1.4 cần động từ tồn tại cho mạch câu. `3.1` 8 cặp, 8 khác: tiền lệ là `Padumuttarassa bhagavato` ở `tha-ap` trong cấu trúc khác (“Đến Đức Thế Tôn…”); ở đây là sở hữu cách trong cấu trúc “của … trong lần thuyết Pháp đầu tiên, của một trăm ngàn koṭi, đã có chứng ngộ”, viết “Nơi Đức Thế Tôn Padumuttara,” theo khuôn `bv19:6.2`, `bv9:8.2` (“nơi … bậc Đại Ẩn Sĩ”). `3.2`, `3.4`, `4.4`, `8.4`, `9.4`, `10.4`, `27.4`: chỉ khác dấu cuối (`;`/`.`); theo Pāli từng khoá. `8.2`/`19.4` (cùng Pāli, 2 khoá trong bài, 1 cặp Việt khác): `8.2` “nơi bậc Đạo Sư Padumuttara;” (đi với `8.1` “Đã có ba kỳ hội chúng,”), `19.4` “của bậc Đạo Sư Padumuttara.” (thuộc về người mẹ ở `19.3`, theo `bv9:17.4`, `bv16:14.4`). `11.1` 16 cặp, 4 khác (“Vào lúc ấy tôi,” 2, “Vào lúc ấy, ta” 1, “Vào thời ấy, ta” 1): chọn “ta” vì người kể là Đức Phật Gotama (12 trên 16). `13.1` 13 cặp, 1 khác chỉ ở nháy mở. `17.1` 6 cặp, 1 khác (“Bậc Lòng Từ bi mẫn,”, dạng không tự nhiên). `21.2` 20 cặp, 3 khác (17 giống). `7.4`/`29.4` 13 cặp, 1 khác (“cứu vớt đông đảo chúng sanh.”, cùng nghĩa, khác cách viết): chọn dạng 12/13. Trùng trong chính bài: 3 nhóm Pāli trùng (`3.3`/`8.3`, `7.4`/`29.4`, `8.2`/`19.4`; mỗi nhóm 2 khoá), 3 cặp, trong đó 2 cặp giống hệt và 1 cặp Việt khác (`8.2`/`19.4`, xem trên).
  - `11.3`–`11.4`: Pāli đặt tân ngữ (`Sambuddhappamukhaṁ saṅghaṁ`) trước động từ; Việt giữ trật tự đó, nối bằng dấu phẩy theo Pāli.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá, đếm số khoá).
  - `mahāvīra` → “Đại Anh Hùng” (79 trên 108 khoá; “Đại Hùng” 20). `mahesi` → “Đại Ẩn Sĩ” (117 trên 177). `jina` → “bậc Chiến Thắng”. `vināyaka` → “bậc Điều Ngự” (20 trên 36 khoá; “Hướng …” 10, “Dẫn …” 13; `bv24:10.2`, `bv28:1.2`). `satthā` → “bậc Đạo Sư”. `cakkhumā` → “bậc có mắt”.
  - `nātho` (16.3) → “bậc Hộ Chủ”: 5 trên 74 khoá có “Hộ Chủ” (`tha-ap544:3.3`, `tha-ap433:6.1`, `tha-ap547:10.1`); 29 khoá dùng “nơi nương tựa” nhưng đó là `attā hi attano nātho`, nghĩa khác; ở đây `saraṇaṁ` (16.4) đã là “nơi nương tựa”, nên tránh lặp. Cách đọc khác: “đấng che chở” (`tha-ap395:11.2`, 1 khoá).
  - `amatadundubhi`, `amatabheri` → “trống bất tử” (`tha-ap9:15.4`, chữ thường; `mn26:25.21`, `mn85:49.22` viết “Bất tử”; chọn chữ thường theo phẩm). `dhammavuṭṭhi` → “mưa Pháp” (`bv9:6.2`). `tappayante` → “làm cho … được thỏa mãn” (`bv9:7.2`; “no đủ” 9 trên 27 là nghĩa vật thực, khác ngữ cảnh). `viññāpaka` → “bậc làm cho hiểu rõ”, `ovādaka` → “bậc giáo giới” (`tha-ap539:2.1`).
  - `titthiya` → “ngoại đạo” (`tha-ap539:3.3`, `tha-ap539:4.2`, cùng hai dòng với `17.3`, `18.2` ở đây). `pañcasīla` → “năm giới”. `vasībhūta` → “đã tự tại” (`tha-ap539:4.4`); `tādī` → “bất động như vậy” (20 trên 628 khoá; `tha-ap539:4.4` viết “Vững Vàng” 21 khoá, nhưng toàn phẩm `bv` dùng “bất động như vậy”, chọn theo phẩm).
  - `nāma khattiyo` → “vị Sát-đế-lợi tên là” (39 trên 46). `janikā` → “người mẹ sinh ra” (13 trên 28). `atraja` → “người con ruột” (15 trên 25). `nāriyo samalaṅkatā` → “người nữ được trang sức đẹp đẽ” (17 trên 20). `uyyāna` → “vườn” (49 trên 63) nhưng với tên riêng ghép (`mithiluyyāna`, 23.4) giữ nguyên chữ Pāli theo `bv8:20.4` (`sudhammuyyāna`) và `bv10:20.4` (`dhanañcuyyāna`).
  - `kappa` → “kiếp” (`maṇḍakappa` → “kiếp Maṇḍa”, 2/2 tiền lệ `bv16:1.1`, `bv17:1.1`). `yojana` → “do-tuần” (115 trên 960 khoá chứa chữ này). `ratana` giữ nguyên chữ Pāli như `bv9`, `bv18`, `bv19`. `koṭi` giữ nguyên.
  - Tên riêng: `Padumuttara`, `Nārada`, `Ānanda` (vua cha), `Sujātā`, `Haṁsavatī`, `Vasudattā`, `Uttama`, `Devala`, `Sujāta`, `Sumana`, `Amitā`, `Asamā`, `Vitiṇṇa`, `Tissa`, `Haṭṭhā`, `Vicittā`, `Nandārāma`, `Vebhāra`, `Jaṭila`, `Salala`. Chưa có tiền lệ trong tầng cho `Naravāhana`, `Yasa`, `Vasavattī`, `Mithiluyyāna`; giữ dạng Pāli có dấu.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `5.1`–`5.4` `ānandaṁ upasaṅkami / pitusantikaṁ upagantvā`: `Ānanda` ở đây là vua cha (`19.2` `ānando nāma khattiyo`) và `pitusantikaṁ` cũng chỉ vào ngài; Pāli hai lần nêu (tên và quan hệ), Việt giữ cả hai (“Ānanda”, “cha”) và không gộp. Pāli không nói trống bất tử được đánh ở đâu hay vì sao (so `bv16:5.2` `desesi pitusantike` “đã thuyết giảng ở bên cha”).
  2. `2.1`–`2.4`: `maṇḍakappova so āsi` “kiếp ấy chính là kiếp Maṇḍa” (`-va` nhấn mạnh); `ussannakusalā janatā` đọc `ussanna` là “dồi dào”, `kusala` là “thiện lành”; “căn lành” (tiền lệ `mil5.1.6:11.2` cho `ussannakusalamūlā`) không dùng vì Pāli ở đây không có `mūla`. Cách đọc khác: “dân chúng giỏi về điều thiện”.
  3. `4.3`, `6.3`: số người chứng ngộ tính theo cấu tạo `X-sata-sahassa` thành 3.700.000 và 5.000.000. Cách đọc khác: `sattatiṁsa` và `paññāsa` đi với `sahassa` (37.000, 50.000). Pāli không có chữ nào để sửa; tầng Anh không có.
  4. `9.1` `asamasamo`: “ngang bằng với bậc vô song” (khuôn `bv18:22.1`); cách đọc khác: “bậc vô song giữa những bậc vô song”.
  5. `10.1`–`10.2`: `gāmanigamaraṭṭhato` là sở cách (ablative); Pāli không nói gì đi từ đó hay ai đến từ đó, Việt giữ như Pāli. “khi Ngài đã lên đường du hành” (`pakkante`) là sở cách tuyệt đối (locative absolute), chủ ngữ lấy từ `9.1` `buddho`.
  6. `11.2` `raṭṭhiko`: “viên quan xứ” (`-ika` “thuộc về”, `raṭṭha` “xứ”; tiền lệ `an6.17:3.3` “một quan được bổ nhiệm”, `an5.58:5.2` “quan lại”). Cách đọc khác: “quan cai quản xứ”. `Jaṭilo nāma` đọc `Jaṭila` là tên (vì có `nāma`), không phải “người bện tóc”. `11.4` `dussaṁ` “vải” (tiền lệ `tha-ap424:18.2`, `tha-ap95:3.2` “tấm vải”), `sabhattaṁ` “cùng vật thực”; Pāli không nói số tấm vải nên Việt không nêu số.
  7. `14.2`–`14.3`: `uggadaḷhaṁ dhitiṁ` “ý chí mãnh liệt, vững chắc” (`ugga` “mãnh liệt, dữ dội”, `daḷha` “vững chắc”, `dhiti` “ý chí, nghị lực”); không tiền lệ trong tầng cho cụm này (0/0). `14.2` `vatamadhiṭṭhahiṁ` “quyết tâm giữ lời nguyện” (`cp26:18.4`), `uttariṁ` “thêm” (`bv16:13.3`).
  8. `15.1`–`15.4`: `byāhatā` dịch “bị đánh gục” (nghĩa gốc “bị đánh trúng, bị đập”); Pāli không nói ai đánh hay bằng cách nào, Việt không nêu; không tiền lệ trong tầng. `vimanā dummanā` hai từ gần nghĩa, giữ cả hai (“mất tinh thần”, “buồn bã”). `nicchubhanti te`: dạng chủ động ở ngôi thứ ba số nhiều, đọc nghĩa bị động “họ bị đuổi” (giống `ja432:8.3` `nicchubhati` “đuổi ra khỏi nhà”, nhưng ở đó có tân ngữ); cách đọc khác: “[người ta] đuổi họ khỏi xứ”.
  9. `16.1`–`16.4`: Pāli không có dấu nháy dù là lời thỉnh cầu, Việt không thêm nháy. `hohi` thức mệnh lệnh, Việt thêm “xin” để giữ lễ khi nói với Đức Phật; đây là sắc thái lịch sự, không có trong Pāli. `mahāvīra`, `cakkhuma` là hô cách, dịch bằng “hỡi”.
  10. `18.2` `taṁ`: đại từ trung tính chỉ nơi hoặc cảnh trước đó; Việt dịch “nơi ấy”, cách đọc khác “cảnh ấy”. Bản `tha-ap539:4.2` (`ca`) không có `taṁ` và dịch “và vắng bóng”.
  11. `20.3` `naravāhano yaso vasavattī`: đọc là ba tên lâu đài (khớp “ba” ở `20.4`). `yaso` cũng có thể là danh từ thường “danh tiếng” và `naravāhano` có thể là tính từ (“do người mang, kéo”). Không có tiền lệ trong tầng nên giữ cả ba làm tên riêng.
  12. `23.4` `mithiluyyānamuttame`: `mithila` + `uyyāna` + `uttame`, đọc “Mithiluyyāna tối thượng”, theo `bv8:20.4`, `bv10:20.4`. Cách đọc khác: “vườn ở Mithilā” (`mithila` là tên thành).
  13. `25.4` `salaloti`: `ti` đóng lời gọi tên, “Salala” là tên cây Bồ-đề (cùng khuôn `bv19:22.4` `asanoti`).
  14. `26.1` `vitiṇṇo ceva tisso ca`: đọc `Vitiṇṇa` là tên (có `tisso` đối ứng); `vitiṇṇa` cũng có thể là tính từ “đã vượt qua”. `26.3` `haṭṭhā ceva vicittā ca` tương tự (`haṭṭhā` “hoan hỷ”, `vicittā` “rực rỡ”): giữ làm tên.
  15. `28.1`–`28.4`: `kuṭṭā kavāṭā bhittī ca`: “tường, cửa và vách” (`kuṭṭa` “tường” `sn12.63:4.2`; `bhitti` “tường vách” `an3.109:2.1`; `kavāṭa` không tiền lệ); `nagasiluccayā` “núi và khối đá” (`siluccaya` `tha-ap405:22.2` “khối núi đá”). `na tassāvaraṇaṁ atthi` “đối với Ngài không có gì ngăn che”; Pāli không nêu cái gì bị ngăn (thân, tầm nhìn hay hào quang), Việt không thêm. `samantā dvādasayojane` “xung quanh, trong mười hai do-tuần”. Ngữ cảnh gần (`bv2:105.1`, chưa dịch) có cùng chuỗi `kuṭṭā kavāṭā selā ca`.
  16. `30.1`–`30.2` `santāretvā bahujanaṁ`: “nhiều người” (`bv20:24.2` `bahū jane`, `tha-ap471:2.2` `bahuṁ janaṁ`); khác `7.4`/`29.4` `janataṁ bahuṁ` “đông đảo mọi người” (13/13 tiền lệ), vì ở đây Pāli dùng hợp từ `bahujana`.
  17. `1.4` `akkhobbho sāgarūpamo`: “không lay chuyển, như biển cả” (`cp5:2.4` cho cùng cặp từ ở đối cách). `mn8:17.9` dùng “đại dương” cho `sāgarūpama`; chọn “biển cả” theo cặp với `akkhobbha`.

