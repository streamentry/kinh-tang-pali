  - `3.2` `yaṁ sappimadadiṁ tadā`: `yaṁ` là quan hệ + `tadā` = *khi ấy*, `adadiṁ` = *tôi đã dâng*. Bản cũ "nơi tôi đã dâng" (đọc `yaṁ` như chỗ chốn) là sai. Cùng khuôn `tha-ap215:4.2`.
