  **Số Pāli:** `Dvenavute` = `dve` + `navute` = 92 (đúng với Phussa Buddha ở kiếp thứ 92 trước, truyền thống và cùng dòng trong 32/37 khoá); `Chappaññāse` = 56 (`chaḷ` + `paññāsa`, đối chiếu `Tepaññāse` = 53 ở `tha-ap234:3.1` và `Chabbīsamhi` = 26 ở `tha-ap215:5.1`); `catasso` = bốn; `chaṭṭhaṁ` = thứ sáu. Ghi chú cũ nêu khả năng `dvenavute` = 180 trở lên là suy đoán sai: dạng `dve` + `navute` nhập thành 92 theo cách nhập số Pāli (`ekanavuti` = 91, `dvenavuti` = 92).

  **Bất định còn lại (không giấu, không đưa vào thân kinh):** (1) `taṁ pattaṁ` — bát của ai, Pāli không nói; (2) `sappitela` có thể là một danh từ ghép (*dầu bơ*) hoặc hai vật (*bơ lỏng và dầu*); chọn theo tiền lệ `tha-ap405`/`tha-ap393`; (3) `samodako` ở `4.2` là danh xưng theo `tha-ap182:3.2`, không có tiền lệ nào khác, chưa chắc; (4) `nibbāpento` không nêu cái được làm dịu (phiền não, nóng bức…); (5) tầng vắng bản Anh/Việt nên không có đối chiếu ngoài Pāli và tiền lệ.

