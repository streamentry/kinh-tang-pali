notes: |-
  BÀI NÀY thuộc lát n37 (4 bài `tha-ap`, 92 khoá được giao). Lần ghi này bổ sung
  TOÀN BỘ 24 khoá của bài — tệp bản dịch trước chỉ có đúng 1 khoá `:6.1` — nên hai
  blocking error cũ (thiếu segment bắt buộc; chưa ghi nhận tầng tham khảo) đã hết hiệu
  lực. Xem "ĐÃ SỬA" ở cuối.

  **Bối cảnh đo (chụp lúc đọc, không phải con số vĩnh viễn).** Tầng Pāli gốc đã ghim:
  284.708 segment. Tầng Việt dự án lúc đo: **156.283** segment. Các lát khác vẫn chạy song
  song nên con số tầng Việt đã tăng trong lúc tôi làm (155.826 → 156.000 → 156.283); mọi
  tỉ lệ dưới đây là của đúng cái chụp 156.283 đó, và sẽ đổi nếu đo lại.

  **Năm phép kiếm tự chạy, in số** (`_n37_check.py`, chạy sau khi ghi):
  1. `set(khoá Việt) == set(khoá Pāli)`: 4/4 bài 24/24, thiếu 0, thừa 0, thứ tự khoá
     khớp đúng thứ tự Pāli, 0 khoá sai NFC. Phép này phải tự viết vì ngưỡng ≥ 40 ký tự
     của chốt cũ loại hết lát này: ngoài `:6.1` **không có khoá Pāli nào ≥ 40 ký tự**.
  2. Nháy đơn `‘’` và ngoặc kép, so **từng khoá**: 0 lệch ở cả 4 bài. Cả 4 bài có đúng
     1 `“` (khoá `1.1`) và 1 `”` (khoá `5.3`) — Pāli cố ý để nháy chạy qua nhiều khoá và
     tôi giữ y hệt, không dời. Nháy đơn: 0 ở cả hai vế, trùng Pāli 0/0.
  3. Pāli trùng nguyên văn TRONG CHÍNH bài mà Việt khác: **0 nhóm** — không bài nào
     có cặp Pāli lặp nội bộ.
  4. Dấu lược: mỗi bài đúng 1 khoá `…pe…` và 0 khoá `…` trần; cả 4 khoá lược giữ
     **đúng một** `…`, không khoá nào có `… cho đến …`, không khoá nào thêm `…` khi Pāli
     không có. Tổng lỗi của 5 phép: **0**.
  5. Mọi số nêu trong `notes` này đều do script in ra.

  **Chỉ mục Pāli→Việt toàn tầng.** Dựng trên 284.708 segment Pāli × 156.283 segment
  Việt. Trong 96 khoá của lát: **52/96** khoá có Pāli trùng nguyên văn ở nơi khác, tổng
  **9.569** cặp trùng đã dò. **40/96 khoá dùng lại NGUYÊN VĂN** bản dịch đã có (10 khoá
  mỗi bài × 4 bài); 56/96 khoá hoặc không có tiền lệ trùng, hoặc có mà tôi chọn cách
  khác — lý do từng khoá ghi ở mục "Bất định" bên dưới.

  **Thuật ngữ, đều kèm số đếm (đo trên 156.283 segment Việt).**
  - `Therāpadāna` (`:0.1`) → giữ nguyên `Therāpadāna`: 368 khoá `:0.1` giữ nguyên, 9 khoá
    dùng *Trưởng Lão Ký Sự*; đối chiếu chính xác trên cụm Pāli `Therāpadāna ` thì
    **364/373**. Đây là **tên sách**, và tầng đang làm y hệt với `Jātaka` (427 khoá `:0.1`),
    `Milindapañha` (211), `Vimānavatthu` (61), `Petavatthu` (27), `Theragāthā` (12),
    `Therīapadāna` (8). Nói thẳng: `AGENTS.md` có câu "không copy Pāli vào translation
    JSON", nên giữ nguyên ở đây là **đọc câu đó theo hẹp**. Tôi chọn theo tầng vì đổi ra sẽ
    tự mâu thuẫn với 364 tệp đã có; người biên tập nên ra một lệnh cho cả sách `tha-ap`.
  - `paṭisambhidā` → *Bốn vô ngại giải*: **381/381, nhất quán tuyệt đối**, không biến thể.
  - `…pe…` → `…`: **653/653, nhất quán tuyệt đối.**
  - `kataṁ buddhassa sāsanaṁ` → *đã làm tròn lời dạy của Đức Phật*: 348/381 (4 biến thể;
    20 khoá thêm "tôi", 9 khoá hoa chữ đầu).
  - `sattaratanasampanno` → *Đầy đủ bảy món báu quý giá*: 27/65 (10 biến thể).
  - `cakkavattī mahabbalo` → *là Chuyển Luân Vương có đại thần lực*: 84 cặp, 11 biến thể;
    `đại thần lực` 45/84 là đa số. Hoa/thường thì **hai phạm vi cho hai đa số khác nhau**:
    toàn tầng "Chuyển Luân Vương" (hoa) 199 so với "Chuyển luân vương" (thường) 122, nhưng
    riêng cụm PāLI này thì ngược lại (thường 39 so với hoa 33). Tôi theo phạm vi rộng
    (hoa 199) và **ghi ra đây** là chỗ hai phạm vi không thống nhất. Bản số nhiều `cakkavattī
    mahabbalā` → *là các Chuyển Luân Vương có đại thần lực*: 55 cặp, 13 biến thể, số "các"
    là đa số.
  - `duggatiṁ nābhijānāmi` → *Tôi không biết điều lành dữ ấy*: 338 cặp trùng, **14 biến
    thể, không có đa số**; biến thể đứng đầu 124 lần (*Ta không biết mình rơi vào khổ đau*)
    **thêm động từ "rơi vào" mà Pāli không có** và đổi ngôi kể. Tôi chọn cách giữ đủ tân
    ngữ + phủ định, và dùng ngôi thứ nhất cho khớp hậu tố `-mi`.
  - Số kiếp: `Dvenavute` → *chín mươi hai* 32/37; `Ekanavutito` → *chín mươi mốt* 73/99;
    `Catunnavutito` → *chín mươi tư* 67/89. Ba cụm này **không thống nhất về mặt phiên
    bản** — xem "Bất định" 1 của `tha-ap168`.
  - `buddhapūjāyidaṁ phalaṁ` → *đây là quả báo của việc cúng dường Đức Phật*: 31/84. Cả
    tầng: *quả báo* 553 so với *quả báu* 94; *quả báo của việc* 232 so với *quả báu của
    việc* 65 — tôi theo *quả báo*.
  - `Pasannacitto sumano` → *Với tâm tịnh tín hân hoan*: 39/59.
  - `āhutīnaṁ paṭiggaho;` → 9 cặp trùng, 2 biến thể, **8/9** đọc *bậc tiếp nhận lễ vật hiến
    cúng* — cách đọc **sai**; xem "Bất định" 4 của `tha-ap168`.
  - `nadikā` → *dòng nước nông*: 4/4 cặp trùng, và đó là **tiền lệ ĐK đã phát hành**
    (dn16:4.24.3, dn16:4.24.4, dn16:4.25.3, dn16:4.25.6).
  - `dharaṇīruhaṁ` → *mọc từ lòng đất*: 4/4 (tha-ap356:2.2, tha-ap373:1.2, tha-ap427:4.2,
    tha-ap495:4.2).
  - `sappi` / `sappitela` → *bơ sữa*: 4 khoá trùng (dn5:18.5, dn5:20.9, snp2.7:13.2,
    ja394:1.2), cùng dạng liệt kê với `dn5` đã phát hành. Toàn tầng chữ *bơ* 152 lần.
  - `sayambhū` → *bậc tự tại* (13 lần trong tầng: tha-ap30, tha-ap281, tha-ap358, tha-ap483,
    tha-ap526 cộng 8 chỗ khác); `mahesino` → *Đại Ẩn Sĩ* (50); `mahāmuni` → *bậc Đại Muni*
    (6); `narāsabha` → *Nhân Ngưu* (34); `devadeva` → *Thiên Trung Thiên* (19).
  - `kuṭaja` giữ nguyên tên hoa (*hoa kuṭaja*): 2 khoá (tha-ap519:3.1, thag1.115:1.2).
  - `aṅkola` giữ nguyên tên hoa (*hoa aṅkola*): 3 khoá (tha-ap367:2.1, tha-ap232:9.3,
    tha-ap202:9.3).
  - `ocinitvāna` → *hái*: tiền lệ tha-ap367:2.2 → *ta đã hái xuống*.
  - `vihāra`/`vasate` → *trú ở*, theo quy ước chung của tầng cho `viharati` (ví dụ
    sn46.14:1.2, dn21:1.1.2).

  **`:0.3` và `:7.1` — đo ở phạm vi gần nhất, ghi cả hai số.** Hai khoá mang cùng một hợp
  thành Pāli (`<Tên>theraapadāna` ở `:0.3`, `<Tên>therassāpadānaṁ` ở `:7.1`) nên tôi dùng
  MỘT cụm tiếng Việt cho cả hai khoá trong cùng một bài. Số đo ở phạm vi gần nhất
  (377 tệp `tha-ap` có `:0.3` với `theraapadāna`, 110 tệp có `:7.1` với `therassāpadānaṁ`):
  - `:0.3`: *Bài Kệ Tuyên Ngợ Về Trưởng Lão* **159** / *Ký Sự Về Trưởng Lão* 91 /
    *Bài Kệ Tuyên Ngôn Về Trưởng Lão* 49 (78 khoá khác mẫu vì có số thứ tự ở đầu).
  - `:7.1`: *Bài Kệ Tuyên Ngôn Về Trưởng Lão* **63** / *Bài Kệ Tuyên Ngợ Về Trưởng Lão* 43
    (4 khoá khác mẫu).
  Tức **hai khoá có hai đa số khác nhau**. Tôi chọn *Tuyên Ngợ* cho cả hai vì (1) cùng
  một hợp thành Pāli thì phải cùng một cách nói, (2) *tuyên ngợ* đúng nghĩa "tuyên ngợ
  bài kệ" hơn, (3) mẫu lớn hơn (377 so với 110) cũng nghiêng về *Tuyên Ngợ*.
  **CẦN NGƯỜI BIÊN TẬP PHÂN XỬ** sự lệch này một lượt cho cả cuốn, vì nó làm tiêu đề và
  lục kết của cùng một bài đọc khác nhau. `tha-ap168:0.3` còn có **tiền lệ trùng Pāli
  chính xác** là `tha-ap221:0.3` → *Ký Sự Về Trưởng Lão Sappidāyaka* (1 cặp); tôi **không**
  dùng lại, vì làm vậy thì bài này lệch với ba bài kia trong cùng lát và với 159/377 của
  kho — tôi ghi ra đây để người biên tập biết là có một ngoại lệ này.
  Vị trí số thứ tự trong `:7.1` giữ `thứ <từ>` + dấu chấm: 109/110 khoá (1 khoá dùng
  "thứ bốn"). Số thứ tự ở `:0.3` có 75/377 khoá giữ nguyên chữ số ở đầu; tôi giữ theo Pāli.

