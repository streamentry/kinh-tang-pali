  **NỘI DỤNG RIÊNG CỦA BÀI NÀY** (đọc Pāli từng vế, không rút từ khuôn chung): vị
  trưởng lão tên Phusso dâng bơ sữa cho Đức Phật — 1.1–1.2 người này tự xưng rồi xin Đức
  Thế Tôn nhận lễ vật; 1.3–1.4 người tráng kiện bước đi trên đường lớn, xua đuổi đám
  đông; 2.1–2.2 Ngài từng bước đến bên ông; 2.3–2.4 Ngài cầm cái bát có bơ sữa. Sau đó
  ông dâng món bơ sữa ấy, và ít kiếp sau sinh ra làm một vị tên Samodaka, đủ bảy báu,
  làm bậc Chuyển Luân Vương, và có bốn vô ngại giải.
  Đây cũng là vị trưởng lão **Sappidāyaka** của `tha-ap221` — cùng tên, cùng tiêu đề
  `Sappidāyakattheraapadāna` ở `:0.3` — nên tôi đối chiếu hai bài để dựng nghĩa `sappi` cho
  nhau: `tha-ap221:2.3` `Sappitelaṁ mayā dinnaṁ` đúng là cảnh dâng bơ sữa này.

  **Bất định đã ghi nhận, không giấu.**
  1. `Dvenavute` (`3.1`) và `Chappaññāse` (`4.1`) là **số kiếp**, và tầng đang hiểu không
     thống nhất về mặt phiên bản. (a) `Dvenavute` = `dve` + `navute`: 32/37 khoá trùng đọc
     *chín mươi hai* (tức 2 + 90) và tôi theo. Nhưng `navute` theo cách đọc phổ biến
     trong chú giải Therāgāthá là "90", nên `dve` + 90 có thể là **180+**, không phải 92.
     Cùng logic áp cho `Ekanavutito` (73/99 đọc *chín mươi mốt*) và `Catunnavutito`
     (67/89 đọc *chín mươi tư*) — cả ba cụm đều theo kiểu "số + 90". Tôi giữ quy ước của
     tầng vì nó nhất quán và vì lệch nó sẽ phải sửa hàng trăm khoá ngoài lát này. (b)
     `Chappaññāse` **không có tiền lệ nào**; tôi suy từ `tha-ap234:3.1` `Tepaññāse ito
     kappe` → *Từ năm mươi ba kiếp trước* (1/1), tức `paññāse` = 50 và số đứng trước được
     cộng vào ⇒ **56**. Đây là **suy luận từ một tiền lệ duy nhất**, không phải điều đã
     biết; nếu người biên tập có cách đọc khác thì sửa `4.1` được và `4.4` phải sửa theo.
  2. `eko āsi samodako` (`4.2`): `samodaka` ở Jātaka nghĩa là "mọc hay đứng trong nước"
     (4 chỗ trong Pāli gốc), còn ở đây là danh xưng. Tôi dịch *có một vị tên là Samodaka*,
     theo tiền lệ **trong chính cuốn** `tha-ap182:3.2` `sattevāsuṁ samodakā` → *có bảy vị
     vua mang tên Samodaka*. Tôi **không** dịch *con nai* cho `1.3` vì Pāli không nói vậy.
  3. `vīro` (`1.3`) là danh từ số ít và Pāli **không nói** đó là Đức Phật hay người đang
     nói. Tôi dịch *Người tráng kiện*, giữ ngôi thứ ba và không thêm chủ thể. Đây là chỗ tôi
     **cố ý không phân xử**.
  4. `āhutīnaṁ` (`1.2`) là cách sở hữu, còn mệnh lệnh `paṭiggaho` không có tân ngữ tường
     minh. Tiền lệ 8/9 đọc *bậc tiếp nhận lễ vật hiến cúng* — **sai**, vì `paṭiggaho` là
     mệnh lệnh thứ hai số (*xin hãy nhận*), không phải danh từ. Tôi dịch *xin hãy nhận lấy
     những lễ vật của con*, giữ cả mệnh lệnh lẫn cách sở hữu; "của con" là cách diễn đạt
     tự nhiên nhất cho cách sở hữu ấy trong tiếng Việt.
  5. `nibbāpento mahājanaṁ` (`1.4`) trùng nguyên văn `tha-ap61:1.4` → *làm cho đại chúng
     thoát khổ*, nhưng ở bài 61 ngữ cảnh là giải thoát cho đám đông, còn ở đây là dọn
     đường. Tôi dịch *xua đuổi đám đông lớn* — **cố ý khác tiền lệ**, vì nghĩa khác nhau;
     cùng một chuỗi Pāli không bắt buộc phải cùng một nghĩa.
  6. `Phusso` giữ nguyên dạng Pāli (danh xưng). `tha-ap365:1.1` `Phusso nāmāsi sambuddho`
     được dịch *Đức Chánh Đẳng Giác tên là Phussa* — tức hiểu `sambuddho` làm chủ ngữ;
     ở bài này `bhagavā` là **từ xưng hô** còn `nāmāsi` là **ngôi thứ nhất** (*con tên là*),
     nên tôi dịch khác. Ghi ra vì cùng một tên `Phusso` mà hai bài đang đọc khác nhau.
  7. `chaṭṭhaṁ` (`7.1`) là số thứ tự **trong phẩm**: uddāna của `Supāricariyavagga` ở
     `tha-ap172:10.1–10.6` liệt kê 5 tên, còn `chaṭṭhaṁ` ở đây là thứ sáu — tức số thứ tự
     phẩm, và uddâna ấy chỉ có 5 tên vì `tha-ap172` bị cắt cụt ở `:10.6`. Tôi dịch *thứ sáu*
     theo Pāli, không suy ra từ uddâna.
  8. `translators` đổi từ *Kinh Tạng Pāli Project* sang tên công cụ thật, vì 23/24 khoá
     nay do tôi viết; tôi không ghi tên công cụ vào trường nào khác.
  9. `2.4` đổi *cầm theo tay món bơ sữa* thành *với món bơ sữa trong tay* — cụm cũ khó
     đọc; `mādāsa` = "cầm trong tay", `saha` = "cùng với". Đây là lượt rà soát đối kháng
     đầu tiên sau khi ghi, không phải lỗi tiền lệ.

  **ĐÃ SỬA so với lần ghi trước.** (1) Tệp bản dịch chỉ có 1/24 khoá → nay 24/24, nên
  blocker "thiếu segment bắt buộc" hết hiệu lực. (2) `6.1` đang là *… đã từng nói bài kệ
  này* (số ít `bài kệ` + thêm "từng") trong khi 41 khoá cùng công thức `Itthaṁ sudaṁ āyasmā
  <tên> thero imā gāthāyo abhāsitthāti` đã merge ở dạng *Tôi nghe như vầy: … đã nói
  **những** bài kệ này* → nay sửa theo đúng dạng đó (bỏ "từng", sửa số nhiều của `imā
  gāthāyo`). (3) `translationTitle` đổi cho khớp với `:0.3`. (4) `assessed_at` cập nhật.
  Blocker còn lại chỉ là cổng kỹ thuật chưa chạy.
