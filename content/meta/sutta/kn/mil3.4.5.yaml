notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này.
  Pāli trùng nguyên văn: 21 khoá, dù lại nguyên văn 18 khoá. Nguồn trùng quan trọng nhất là `sn2.22` — cùng bốn câu kệ 5–7 của bài này đã có sẵn trong tầng.
  Dù lại nguyên văn: `:0.1` (174/185) · `:1.1` `Rājā āha—` → “Vua nói:” (40/66) · `:1.6` `Thero āha—` → “Trưởng lão nói—” (9/16) · `:2.1`, `:4.1` `“Opammaṁ karohī”ti.` (12/27) · `:2.3`, `:3.3`, `:4.3` `“Na hi, bhante”ti.` → ““Không phải vậy, thưa tôn giả”ti.” (11/21) · `:3.1`, `:4.1` `“Bhiyyo opammaṁ karohī”ti.` (8/13) · `:5.2`–`:5.4` theo `sn2.22:5.2–5.4` · `:6.3`, `:6.4` theo `sn2.22:6.3–6.4` · `:7.1`, `:7.2` theo `sn2.22:7.1–7.2` · `:8.1` `“Kallosi, bhante nāgasenā”ti.` (62/71).
  Cố ý dịch khác `sn2.22` ở ba khoá, vì tiền lệ lệch nghĩa: `:5.1` `Paṭikacceva taṁ kayirā` bản `sn2.22:5.1` dịch thành “Hãy làm. ngay từ trước,” (vỡ câu), tôi dịch “Chính khi đã đến lúc phải làm, hãy làm điều ấy,” · `:6.1`–`:6.2` bản `sn2.22` đảo `maṭṭhaṁ` (6.1) với `mahāpathaṁ` (6.2) nên thành “rời bỏ đường lớn / đường bằng phẳng, khéo đắp cao”, tôi dịch theo đúng thứ tự Pāli: “Như người đánh xe đã rời bỏ / con đường lớn bằng phẳng;” · `:7.3` `Maccu` vốn là thần chết, bản `sn2.22:7.3` dịch “kẻ ngu khi rơi vào miệng thần chết”, tôi dùng “kẻ ngu chui vào miệng thần chết”.
  Thuật ngữ theo tiền lệ đếm được: `sākaṭika` → người đánh xe (sn2.22:5.3, mil5.4.4:3.3); `pabbajjā` → xuất gia (an3.60:1.6); `udapāna` → giếng nước (ud7.10:6.4); `sāyaṁ pātaṁ` → sáng chiều (sn7.21:1.2); `vāyāma` → nỗ lực (an3.70:5.2). `akiccakaro`/`kiccakaro` không có tiền lệ, dịch “không công”/“có công” theo nghĩa chữ nghĩa; `sikkh` (thiền tập) → “tập”.
  Bất định: `:1.5` `Kiṁ paṭikacceva vāyamitena, nanu sampatte kāle vāyamitabban` là câu hỏi của vua; `Kiṁ` ở đây không rõ là gì, tôi giữ dạng câu hỏi “chứ sao” và không thêm chủ thể nào. `:5.1` `Paṭikacceva taṁ kayirā` cũng không có tiền lệ sạch (xem trên).
  Không khoá nào trong 8 bài này có `…pe…` ở Pāli (đã kiểm 296/296 khoá), nên không có dấu lược nào để giữ, và không có chỗ nào bịa dấu lược che chỗ thiếu. Dấu nháy: `:4.4` mở, `:7.4` đóng kèm `’”ti`; các khoá 5.1 và 5.2 không mở nháy kép vì Pāli chỉ dùng nháy đơn `‘…’` cho lời Đức Thế Tôn, đã giữ nguyên.
  Đo lại trên đĩa, hai con số coordinator nêu ở mục (4) của prompt KHÔNG khớp: `bhante` trong tầng `mil` dùng **“thưa tôn giả” 149 lần / 71 tệp**, “bạch ngài” chỉ 37 lần / 23 tệp, “bạch thầy” = 0 (giữ nguyên phần đúng của bạn); `mahārāja` dùng **“này Đại vương” 395 lần / 101 tệp**, còn “tâu đại vương” chỉ 169 + “tâu Đại vương” 79 = 248 lần / 32 tệp. Cả 9 bài lân cận mil3.1.12/.14 và mil7.3.1/.9 đều dùng “này Đại vương”, nên lát này theo đo được, không theo con số bạn đưa.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đủ 37/37 khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không trùng nguyên văn Pāli, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
