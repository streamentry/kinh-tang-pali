  Đủ 15/15 khoá. Đã đọc hết Pãli lát f120.pali.txt trước khi viết.

  Sativagga → “Phẩm Chánh Niệm” (tiền lệ `mil3.6.9`, `mil3.6.11`). Số thứ tự:
  `Cirakatasaraṇapañho dasamo` là thứ mười, khớp chuỗi phẩm và uid.

  Bản nháp dùng “Vua nói—”; đếm trong tầng `kn` thì “Vua nói:” chiếm 30 tệp so với 14 tệp
  dùng “Vua nói—” (và “Vua nói:” cũng là cách `mil3.1.16` dùng cho đúng khoá Pāli `Rājā āha—`
  này), nên đã sửa sang “Vua nói:”.

  `Āma, bhante`ti. giữ “Vâng, thưa tôn giả”ti. vì toàn tầng đếm được 12 chỗ “Vâng, thưa tôn
  giả” so với 3 chỗ “Vâng, bạch tôn giả”; `Kallosi` thì ngược lại, 46 chỗ dùng dấu chấm
  trong ngoặc kép nên tôi theo 46.

  Bất định đã ghi nhận. `kiñcideva karaṇīyaṁ katvā pamuṭṭhan` tôi dịch “một việc phải làm
  nào đó” — nghĩa chữ `karaṇīya` là việc cần làm, `pamuṭṭhan` là đã quên; cách đọc khác là
  “đã lỡ làm rồi mà quên”, nhưng vậy thì câu hỏi `Kiṁ nu kho tvaṁ … acittako ahosī` ở 1.7 không
  ăn khớp, nên tôi chọn cách đọc thứ nhất. `cittena sarati, no satiyā` tôi dịch “nhớ bằng tâm
  chứ không phải bằng ký ức”; đây là cặp từ mà cả bài đang xoay quanh nên tôi giữ nguyên ở cả
  1.4 và 1.10.

  Dấu lược: bài không có `…pe…`; hai phía đều 0.

  Kiểm kỹ thuật: save_vi chạy sạch; vì mọi khoá Pāli ở lát này ngắn hơn 40 ký tự (khoá dài nhất 39) nên tập `cần` trong _hvi.kiểm rỗng và các assertion NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy, tôi tự quét lại MỌI khoá bằng chính các hàm đó (pal, lược, lọt_pāli, ngoặc, _TỪ): đủ 15/15 khoá, đúng ID, thứ tự khoá y hệt Pāli, không rỗng, không thừa, mọi chuỗi NFC, không trùng nguyên văn Pāli (trừ 0.1 là tên bộ Kinh, đúng như tiền lệ), số dấu lược khớp Pāli từng khoá, nháy kép cân trên cả bài và khớp đúng số mở/đóng của từng khoá Pāli, không còn (…), toàn bộ chữ cái là script Latin. Đợt này cấm chạy cổng nên technical_integrity = 9.6, KHÔNG phải 10.0; bốn lệnh npm run validate | test | check | build để người điều phối chạy.
