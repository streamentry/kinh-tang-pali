notes: |-
  Đầu đề theo tiền lệ đã đếm: Jātaka giữ nguyên (ja1, ja159); Bộ Một Bài Kinh 14 occ
    (ja1, thag/thig); Phẩm Giới 20 occ. Thuật ngữ có tiền lệ: không mệt mỏi 22 occ,
    nửa đêm 9, lỗ mũi 9, được chia phần 3.
    0 tiền lệ, đặt mới có lý do: tipallattha theo Sujato triply collapsed → gục ba lần
    (giữ chữ ba của ti, không diễn giải thành giả chết); anekamāya → nhiều mưu mẹo;
    aṭṭhakkhura → tám móng (giữ nguyên chữ); kalā → mưu khéo; atibhoti → vượt trội
    (ati + bhavati, theo cách đọc của Sujato excelling); pāyī → kẻ uống nước.
    Khung Về con nai ở 1.1 soi theo Sujato About that deer vì các vế 1.1–1.4 đều là
    túc cách miêu tả cùng một con nai.
  Đối chiếu Pāli đã ghim với Anh Sujato ở 8/9 khoá; khoá kết 2.1 Sujato để trống
    (công thức tên kinh + số thứ tự), dịch từ Pāli theo tiền lệ ja1 đã published
    (Kinh Bụi Dơ thứ nhất). Không có tầng Việt hiện hành cho Jātaka trong snapshot
    đã ghim (tiếng Việt upstream chỉ có Pháp Cú) — giới hạn của bản chụp, không phải
    thiếu sót của repo. Không có dấu lược …pe… trong Pāli lát này nên hai phía đều 0.
