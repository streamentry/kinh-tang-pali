notes: |-
  Bài này. `tha-ap11` · phẩm `Buddhavagga` · thứ chín trong phẩm · Trưởng lão Khadiravaniya Revata ·
  69 khoá Pāli (`:0.1`–`:0.3`, kệ `:1.1`–`:16.4`, câu kết `:17.1`, câu chốt `:18.1`). Dịch mới từ Pāli root
  đã ghim, đủ 69/69 khoá, thứ tự khoá đúng thứ tự Pāli, không khoá nào ngoài tập khoá của bài.

  NỘI DUNG (đã đọc Pāli, không suy từ khuôn chung). Revata kể lại kiếp trước thời Đức Padumuttara: ngài là
  người lái đò trên sông Hằng (Bhāgīrathī), gom nhiều thuyền lại, làm mái che và chờ đón Đức Phật cùng một
  trăm ngàn bậc tự tại (`:1`–`:3`); Đức Phật bước lên thuyền, đứng giữa dòng nước nói các bài kệ (`:4`).
  Lời thọ ký nằm trong nháy đơn từ `:5.1` đến `:12.4`: người đưa Phật và Tăng đoàn qua sông sẽ vui ở cõi
  trời, có cung điện hình chiếc thuyền với mái hoa trên không (`:5`–`:6`); làm Chuyển Luân Vương tên Tāraka
  rồi Cammaka (`:7`–`:8`); sau một trăm ngàn kiếp, thời Đức Gotama, sinh làm Revata dòng Bà-la-môn, xuất gia,
  đoạn tận lậu hoặc (`:9`–`:12`). `:13`–`:16` là lời nhận của chính ngài: thân cuối cùng, nghiệp cũ trổ quả,
  được Đức Thế Tôn tuyên bố là bậc tối thắng trong các tỳ-kheo sống ở rừng, đủ bốn vô ngại giải, tám giải
  thoát, sáu thắng trí. Đổi ngôi trong Pāli giữ nguyên: ở `:5` nói về `yo so` (ngôi ba), ở `:6.1` là `te`
  (ngôi hai, nên dịch `của ngươi`), từ `:7` trở đi lại ngôi ba.

  SỐ PĀLI, TỰ TÍNH. `Aṭṭhapaññāsakappamhi` (`:7.1`) = aṭṭha 8 + paññāsa 50 = 58 → kiếp thứ năm mươi tám.
  `Sattapaññāsakappamhi` (`:8.1`) = satta 7 + paññāsa 50 = 57 → kiếp thứ năm mươi bảy. `Vasī satasahassehi`
  (`:2.3`) = sata 100 × sahassa 1.000 = 100.000 → một trăm ngàn. `Kappasatasahassamhi` (`:9.1`) = 100 × 1.000 =
  100.000 kiếp → một trăm ngàn kiếp. `Satasahasse` (`:14.1`) = 100.000 (tự khớp với `:9.1`: thời Đức Padumuttara
  cách thời Đức Gotama một trăm ngàn kiếp). `catasso` (`:16.1`) 4, `aṭṭhime` (`:16.2`) 8, `chaḷabhiññā` (`:16.3`) 6,
  `navamaṁ` (`:18.1`) = thứ chín. Không có cụm `Tiṁsakappasahassa` trong bài. Thang lớn: `ngàn` nhân cả số đứng trước
  (một trăm ngàn = 100 × 1.000), không có chữ số nào trong thân kinh.

  TIÊU ĐỀ `:0.3`. Pāli `Khadiravaniyarevatattheraapadāna` KHÔNG bắt đầu bằng số thứ tự nên `:0.3` không thêm số;
  `translationTitle` trong tệp metadata này BẰNG ĐÚNG giá trị `:0.3` (kiểm bằng cách so chuỗi). Khuôn
  `Bài Kệ Tuyên Ngôn Về Trưởng Lão <tên>` theo hai bài cùng phẩm đã dịch trước (tha-ap10, tha-ap20). Đo hai dạng
  chính tả trong khoá `:0.3` của tầng `tha-ap` hiện có (hơn 460 tệp bản dịch): toàn tầng `Tuyên Ngợ` 247, `Tuyên Ngôn` 106,
  `Ký Sự` 99, `Kinh Kệ` 5; ở phạm vi gần nhất (tha-ap1 đến tha-ap30) `Tuyên Ngợ` 8, `Tuyên Ngôn` 6. Cả hai phạm vi
  đều nghiêng về `Tuyên Ngợ`, nhưng `Ngợ` là dạng sai chính tả; tôi chọn `Tuyên Ngôn` và KHÔNG tự quyết thay người biên
  tập: cần một lượt phán chung cho cả cuốn. `:0.2` `Buddhavagga` → `Phẩm Phật` (3/3 tiền lệ). `:18.1` dùng lại đúng tên của
  `:0.3` kèm `thứ chín`, theo khuôn tha-ap10:17.1 và tha-ap20:17.1.
  Tên người: `Khadiravaniya` ở `:17.1` và `:0.3` là danh hiệu kèm tên (Khadiravaniya = người ở rừng cây khadira, keo); tôi giữ
  nguyên Pāli, không dịch nghĩa vào thân kinh.

  TIỀN LỆ, ĐO ĐƯỢC. Dựng chỉ mục Pāli sang Việt trên hơn 460 tệp `tha-ap` đã có. 29/69 khoá của bài có Pāli trùng với khoá ở nơi khác (so không phân biệt hoa thường và dấu cuối dòng; so chặt từng byte thì 26 khoá),
  tổng 1.778 cặp trùng (1.628 cặp nếu so chặt; phần lớn là khoá khuôn `:0.1` 457 cặp và nhóm `:16.1`–`:16.4`).
  24 khoá dùng lại NGUYÊN VĂN một bản đã có (`:0.1` `:0.2` `:4.4` `:5.3` `:5.4` `:7.3` `:7.4` `:9.1`–`:9.4` `:11.2` `:11.3` `:12.1` `:12.3` `:12.4`
  `:13.1`–`:13.4` `:16.1`–`:16.4`). 5 khoá có Pāli trùng nhưng bản Việt khác mọi tiền lệ, mỗi chỗ có lý do:
  `:8.1` (5+1 cặp cũ viết `Vào năm mươi bảy kiếp trước (đây)`, là quá khứ, trong khi động từ ở `:8.4` là `jotissati`, tương lai;
  tôi viết `Vào kiếp thứ năm mươi bảy`, không thêm hướng thời gian); `:10.2` (1 cặp cũ viết `ngươi sẽ đạt tới phẩm người`,
  nhưng chủ ngữ ở đây là `so` (ngôi ba) nên bỏ `ngươi`; `phẩm người` đổi thành `thân phận làm người` cho dễ hiểu);
  `:10.4` (1 cặp cũ, tha-ap10:12.2, viết `vị ấy sẽ là người dòng Bà-la-môn;`; tôi bỏ `vị ấy` vì chủ ngữ đã nêu ở `:10.1`, phần còn lại giữ nguyên);
  `:11.4` (1 cặp cũ viết `vị ấy sẽ xuất gia` và đẩy `sāsane` sang khoá trước; tôi giữ `trong giáo pháp` ở đúng khoá `:11.4`
  và dùng bản `Của Đức Thế Tôn Gotama,` đã có ở `:11.3`, nên hai khoá cộng lại cho đủ nghĩa mà không lệch khoá);
  `:14.3` (2 cặp cũ, tha-ap350:6.3 và tha-ap523:5.3, viết `Tuy đã thoát kiếp, vẫn rùng rình`, không có căn cứ trong
  `sumutto saravegova`; KHÔNG dùng lại, và báo ra đây để người biên tập sửa hai khoá kia, không đụng vào tệp ngoài bài).
  Pāli trùng ngay TRONG chính bài: 0 nhóm, nên phép dò nội bộ chạy rỗng (không có gì để so), không phải 0 lỗi.

  THUẬT NGỮ, ĐO ĐƯỢC. `narāsabha` → `đấng Nhân Ngưu` (31/55 khoá `tha-ap` có từ này; `bậc trượng phu tối thượng` 7, `Ngưu Vương` 4).
  `Gaṅgā` → `sông Hằng` (4/6 khoá `tha-ap`; toàn tầng `kn` 27/46, còn lại `Gaṅgā`/`sông Gaṅgā`). `khattiya` → `Sát-đế-lợi` (19/29 khoá `tha-ap`
  có `khattiyo`, còn lại `vua`, `quân tộc`). `satthā` → `bậc Thầy` (12/27 khoá `tha-ap`, so với `Đạo Sư` 10: hai dạng sát nhau, không có đa số rõ; chọn `Thầy` vì `:9.4` có 4 tiền lệ cùng Pāli) và dùng nhất quán cả `:4.3`
  và `:9.4`. `sambuddho` → `bậc Chánh Đẳng Giác` (28/52 khoá `tha-ap`). `trăm ngàn` (51 dòng) so với `trăm nghìn` (11) ở bản dịch `tha-ap`: dùng `ngàn`.
  `mahabbalo` → `đại thần lực` (72/113 khoá `cakkavattī mahabbalo` trong `tha-ap`). `brahmabandhu` → `người dòng Bà-la-môn` (tha-ap10:12.2, 3/5 khoá toàn tầng
  có `Bà-la-môn`). `sukkamūlena codito` → `được khích lệ bởi cội nguồn thiện căn` (12/18 khoá, cùng Pāli). `tidasa` → `cõi trời Ba Mươi`
  (toàn tầng `kn` 11 khoá: `Ba Mươi` 5, `Ba Mươi Ba` 3, `Tidasa` 1). `cavitvāna` → `mệnh chung` (3/9, kèm `Rơi khỏi` 8; chọn theo tha-ap34:10.1 vì `rơi khỏi` sai nghĩa với `cavati`).
  `kilesa` → `phiền não` (tha-ap224:3.2). `vasī` → `bậc tự tại` (tha-ap471:3.1). `āsava` → `lậu hoặc` (163/180 khoá `tha-ap` có từ này). `yogakkhema` → `an ổn khỏi ách` (22/27 khoá có `an ổn`).

  BẤT ĐỊNH, GHI RÕ VÀ KHÔNG ĐƯA VÀO THÂN KINH. (1) `orime ca tariṁ ahaṁ` (`:1.4`): `orime` là định cách, `bờ bên này`; `tariṁ` là `tarati`
  (qua sông). Không có tiền lệ trong `tha-ap`; có thể hiểu `tôi đã đưa người qua sông ở bờ gần`, tôi giữ nghĩa trực tiếp, không thêm túc từ.
  `kutitthe` (`:1.3`) `ku`+`tittha` = bến xấu/khó đi: dịch `bến sông xấu`, không thêm lý do. (2) `Vasī satasahassehi` (`:2.3`): bản Pāli ghim viết hai chữ rời; ba tiền lệ
  (tha-ap46:2.3, tha-ap435:1.3, tha-ap471:3.1) viết liền `Vasīsatasahassehi` và dịch `trăm nghìn vị tôn túy` hoặc `trăm ngàn bậc tự tại`. Tôi hiểu như
  hợp từ: một trăm ngàn bậc tự tại (các vị A-la-hán đi cùng). Nếu tách đúng như bản ghim thì `vasī` là danh xưng của Đức Padumuttara và `satasahassehi`
  thiếu danh từ; số 100.000 vẫn chắc. (3) `vaḍḍhakīhi susaṅkhataṁ` (`:3.2`): `susaṅkhataṁ` là trung tính số ít, không rõ bổ nghĩa cho nhóm thuyền ghép hay
  cho cả chiếc thuyền sau khi làm mái che; tôi dịch `được các thợ mộc dựng nên khéo léo`, để ngỏ. `paṭimāniṁ` (`:3.4`) = chờ đón, không thêm chi tiết nghi lễ. (4) `Aṭṭhapaññāsakappamhi`
  và `Sattapaññāsakappamhi` (`:7.1`, `:8.1`): là định cách, theo `bhavissati` (tương lai); cách đếm kiếp (từ lúc nói, hay đếm ngược về thời Đức Gotama) không phân xử
  được: thứ tự 58 rồi 57 ngụ ý đếm lùi nhưng Pāli không nói. Dịch trung tính `kiếp thứ năm mươi tám/bảy`. Hai số chắc chắn. (5) `kataṁ kammaṁ ... satasahasse` (`:14.1`): `kappa`
  không có trong Pāli khoá này; `kiếp` được bổ sung từ ngữ cảnh (`:9.1` cùng con số một trăm ngàn kiếp, thời Padumuttara). Rủi ro: nếu `satasahasse` chỉ một khoảng khác kiếp thì sai
  đơn vị; số 100.000 chắc. (6) `Sumutto saravegova` (`:14.3`): `sumutto` hiểu là `khéo buông` (mũi tên), `saravega` = tốc lực của mũi tên; cách hiểu khác là `sumutto` chỉ chính người nói
  (khéo giải thoát, nhanh như mũi tên). Chọn cách ít giả định, không thêm chủ ngữ. (7) `dhārayissati` (`:6.4`): chủ ngữ là `byamhaṁ` (cung điện); dịch `nâng giữ`. `nāvasaṇṭhitaṁ` = có hình dáng chiếc thuyền.
  (8) `nibbāyissatināsavo` (`:12.4`): tiền lệ có hai dạng, `vô lậu mà đi vào Niết-bàn` (tha-ap20) và `nhập Niết-bàn, không còn lậu hoặc` (tha-ap10); lấy dạng tha-ap20 vì trùng nguyên văn,
  đã đo 2/2. (9) `disvā ... paññapesi` (`:15.2`–`:15.4`): `maṁ` ở `:15.1` là túc từ của cả `disvā` lẫn `paññapesi`; dịch `đã được bậc Mâu-ni ... nhìn thấy` (bị động) và `Là bậc tối thắng...` để giữ đúng thứ tự khoá,
  không đổi nghĩa. (10) `brahmabandhu` (`:10.4`): nghĩa từ điển là người thuộc dòng Bà-la-môn theo huyết thống, có lúc mang sắc thái miệt thị; chọn `người dòng Bà-la-môn`.

  NHÁY. Pāli `“` 1 (mở ở `:1.1`), `”` 1 (đóng ở `:16.4`), `‘` 1 (mở ở `:5.1`), `’` 1 (đóng ở `:12.4`). Khớp Pāli từng khoá: 0 khoá lệch trên 69 khoá. Không có dấu lược `…`
  trong bài (Pāli 0, Việt 0) và không có `(…)`. Dấu cuối dòng mỗi khoá khớp Pāli (`,` `;` `,` `.`), trừ `:0.x` không có dấu.

  COVERAGE ENGLISH, ĐO THẬT. Mẫu số là Pāli có nội dung từ 40 ký tự trở lên, bỏ khối `:0`: chỉ 2 khoá (`:17.1` 72 ký tự, `:18.1` 44 ký tự); 67/69 khoá còn lại dưới ngưỡng
  (mọi vế kệ 18–26 ký tự) nên cổng coverage gần như không đo được gì. Sujato phủ 0/2 (tầng `english-sujato` đã ghim chỉ có 9 sub-collection của `kn`: cp, dhp, iti, ja, kp, snp, thag, thig, ud; không có
  tệp thân kinh nào cho `tha-ap`, chỉ có tệp tên); `vietnamese-current` 0 (26 tệp, toàn Pháp Cú); `english-project` không có uid này. `content/meta/reference-gaps.yaml` chưa có mục cho `tha-ap11`
  (tệp đó sinh trước khi bài này có metadata) và dù có cũng KHÔNG cứu được `published`; cần chạy lại `npm run reference:gaps` để ghi nhận. Vì cả ba tầng tham khảo vắng nên `triangulation` đặt 7,0
  (không quá 8,0) và `status` giữ `draft` kèm blocker. Điểm cao không cứu được blocker.

  KIỂM TRA ĐÃ LÀM. Tập khoá Việt bằng tập khoá Pāli (69 = 69), thứ tự khoá đúng Pāli, NFC, không khoá rỗng, không khoảng trắng thừa, không chữ số trong thân kinh, không dấu nháy thẳng, không Pāli lọt vào thân
  (chỉ còn tên riêng Bhāgīrathī, Tāraka, Okkāka và nhan đề Therāpadāna). Đã in cặp Pāli-Việt từng khoá và đọc đối kháng; lượt rà bắt được hai chỗ sửa: `:15.3` thêm `Là` để vị ngữ rõ, `:10.3` viết hoa theo đầu dòng.
  Mọi số Pāli đã tính lại ở trên.

  `technical_integrity` đặt 9,6 vì chưa chạy cổng kỹ thuật của kho. Bốn lệnh còn lại cần chạy trước khi chốt: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
