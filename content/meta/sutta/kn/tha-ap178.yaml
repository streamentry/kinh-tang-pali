notes: |-
  **Bài.** `tha-ap178` — `Therāpadāna apadāna`, phẩm `Kumudavagga`, thứ sáu
  (`6.1` tự xác nhận). Bài có 20 khoá Pā li; bản dịch phủ **20/20**.

  **Năm phép kiếm, số do script in ra.**
  (1) `set(khoá Việt) == set(khoá Pāli)`: thiếu **0**, thừa **0**.
  (2) ngoặc kép `“”` và nháy đơn `‘’` so **từng khoá**: 20 khoá đã so, lệch **0**; cân cả bài
  ngoặc kép Pā li 1 / Việt 1, nháy đơn Pā li 0 / Việt 0.
  (3) Pā li trùng nguyên văn **trong chính bài**: **0** cặp, nên 0 cặp Việt khác.
  (4) dấu lược: 20 khoá đã so, lệch **0**. Pā li **1** khoá `…pe…` (`4.2`), **0** `…` trần; Việt
  **0** `…pe…`, **1** `…` trần.
  (5) chỉ mục Pā li→Việt toàn tầng: **9** cặp Pā li trùng nguyên văn đã dò, dùng lại nguyên văn
  **9** khoá (`0.1`, `0.2`, `1.1`, `1.4`, `2.3`, `3.4`, `4.1`, `4.2`, `4.3`), khác **0**.

  **Tra tiền lệ kèm đếm.**
  `Therāpadāna` → *Therāpadāna* **352**/361.
  `“Anomadassī bhagavā,` → *“Bậc Vô Tỳ Nhiễm, Đức Thế Tôn,* **1** (`tha-ap70:1.1`), Pā li trùng
  nguyên văn nên dùng lại y nguyên.
  `narāsabho` → *Nhân Ngưu*: có **9** bài `tha-ap` dịch `lokajeṭṭho narāsabho;` thành *bậc Trưởng
  Thượng thế gian, đấng Nhân Ngưu;*, nên tôi lấy *đấng Nhân Ngưu* cho `dvipadindo narāsabho;`.
  `abbhokāsamhi caṅkami.` → *đã đi đến gần núi ấy.* **2/2**, dùng lại y nguyên (Pā li không có
  chủ ngữ nên tôi không thêm *tôi*).
  `Pasannacitto sumano,` (57 chỗ trùng) → *Với tâm tịnh tín hân hoan,* **37**.
  `cakkavattī mahabbalā.` (49 chỗ trùng) → *là các Chuyển Luân Vương có đại oai lực.* **14**.
  `Paṭisambhidā catasso,` → *Bốn vô ngại giải,* **361**/369. `…pe…` → *…* **642/642**.
  `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”.* **328**/369.
  `vanditvā` → *sau khi đảnh lễ* (tiền lệ `tha-ap177:3.2` *sau khi đảnh lễ cội Bồ-đề tối thượng* và
  `tha-ap204:2.2` *đảnh lễ bậc có trí tuệ tối thượng*). `rải hoa` có **9** chỗ trong `tha-ap`
  (*…đã rải hoa khắp xung quanh* ở `tha-ap` và *Phẩm bậc rải hoa …* ở các lục kết).
  `Diṭṭhadhamma` → *hiện hữu* / *ngay hiện tại* (`an8.75:5.1` *Vì mục đích là điều lành hiện hữu*;
  `mn8:4.5` *hiện tại lạc trú*).

  **Dòng công thức `Itthaṁ sudaṁ` — đo lại trên 428 khoá `tha-ap`.** Mở đầu **428/428** *Tôi nghe
  như vầy:*; `imā gāthāyo` → *những bài kệ này* **407** : *bài kệ này* **21**; `abhāsitthāti` →
  *đã nói* **407** : *đã từng nói* **21**. Khoá `5.1` sẵn có trên đĩa đã đúng dạng đa số nên tôi
  giữ nguyên. (Nhóm 21 chỗ lệch là nơi lát trước ở `tha-ap159` dịch số ít; tôi đã sửa khoá đó
  trong bài kia.)

  **Tên phẩm `Kumudavagga`.** Cùng lý do và cùng số đo như ở `tha-ap174`: **3** bài cùng phẩm đã
  dịch cho **3** cách khác nhau, mỗi cách **1** (*Phẩm Bậc Cho Sen* 1, *Phẩm Hoa Sen Trắng* 1,
  *Phẩm Kumuda* 1). Tôi chọn *Phẩm Hoa Sen Trắng* cho cả hai bài của lát này để chúng không tự
  mâu thuẫn, và ghi ở đây để người điều phốn quy một tên cho cả phẩm.

  **Tiêu đề `0.3`.** Pā li `Maggadattikattheraapadāna` **không** có số thứ tự nên tôi không thêm
  số. Đo `:0.3` của `tha-ap`: 121 bài có số trong Pā li và đã có bản Việt thì **giữ 72 : bỏ 49**;
  xét 373 tệp đã dịch thì 74 có / 299 không — tôi ghi **cả hai số**, vì con số 66/275 trong
  `BRIEF_VI3` dùng tiêu chí khác. Dạng tiêu đề: *Bài Kệ Tuyên Ngợ Về Trưởng Lão* **215** : *Tuyên
  Ngôn* 72 : *Ký Sự* 92.

  **Bất định đã ghi nhận.**
  1. `Uddhate pāde pupphāni, / sobhaṁ muddhani tiṭṭhare;` — cụm này là hapax trong Pā li đã ghim
     (chỉ 1 chỗ trong 5.764 tệp), **không** có mẫu dịch nào ở tầng Việt để đối chiếu. Tôi dịch
     *Hoa được dâng lên dưới chân,* / *toả sáng giữa đám đông;* theo nghĩa chính của `uddhate`
     (được nâng lên, ở đây là hoa dâng lên dưới chân) và `muddhani` (giữa đám đông). Tôi
     **không** thêm giải thích nào về chỗ các bông hoa nở.
  2. `Diṭṭhadhammasukhatthāya,` — `sukha` ở đây là niềm vui, không phải "chỗ ở". Tôi dịch *để
     được an vui trong pháp hiện hữu,*; đây là cách ghép của tôi, tiêu chí 6 chỉ đối chiếu được
     tới mức này vì không có bản Anh.
  3. `Pupphacchadaniyā nāma,` và `Maggadattika` là tên riêng, tôi giữ nguyên dạng Pā li như
     cách tầng đã làm với danh xưng các bậc A-la-hán và các vị vua có tên riêng (`Puppha`,
     `Devuttara`, `Sudhaja`).

