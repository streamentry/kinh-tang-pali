  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 0 khoá bất đồng nghĩa → sửa 0, giữ 0, bất định 0. Cả 20 khoá đã đặt cạnh các đoạn tương ứng của bản nguyên bài và cùng nghĩa ở mọi điểm kiểm: Đức Phật Anomadassī kinh hành ngoài trời vì sự thoải mái trong hiện tại, người nói đảnh lễ rồi rải hoa, hoa ở bàn chân được nhấc lên và ở trên đầu, hai mươi ngàn kiếp trước (20 × 1.000), năm Chuyển Luân Vương cùng tên, làm tròn lời dạy; bản nguyên bài chỉ khác ở diễn giải trong ngoặc và cách gộp câu. Rà đối kháng lại cả bản dự án (nghĩa, ngữ pháp, nháy, dấu lược, thuật ngữ): không thấy lỗi mới. Bất định cũ ở `2.1–2.2` (`sobhaṁ`, định vị cách) vẫn giữ nguyên, bản nguyên bài không phân xử được thêm vì chỉ nêu ý chung. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
