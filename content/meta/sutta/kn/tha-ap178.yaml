  Lỗi nghĩa đã sửa:
  `1.1` *Bậc Vô Tỳ Nhiễm* → *Đức Thế Tôn Anomadassī* (`Anomadassī` là danh hiệu Đức Phật, không có
  nghĩa "vô tỳ nhiễm"; phần lớn tầng giữ nguyên danh hiệu, ví dụ `tha-ap4:1.1`, `tha-ap3:69.1`; dạng sai là một chuỗi chép
  lan còn ở `tha-ap70`, `tha-ap398`, `tha-ap481`, ngoài lát này, đề nghị rà).
  `1.2` thêm `-indo`: *bậc chúa tể loài hai chân* (tiền lệ **2** chỗ khác của `dvipadindo narāsabho`).
  `1.3` `Diṭṭhadhammasukhatthāya` = *vì sự an lạc ngay trong hiện tại* (`diṭṭhadhamma` là đời hiện tại,
  không phải "pháp hiện hữu").
  `1.4` `abbhokāsamhi caṅkami` = *đã kinh hành ngoài trời* — *đã đi đến gần núi ấy* là lỗi chép lan
  (**2** khoá `tha-ap178`, `tha-ap350`; **2** khoá khác đúng: `tha-ap459`, `tha-ap523`); Pāli không có
  "núi", không có "đến gần". `tha-ap350:1.4` ngoài lát này, đề nghị sửa.
  `2.1–2.2` bản cũ *dâng lên dưới chân … giữa đám đông* là bịa: `muddhani` = *trên đầu* (không phải
  "giữa đám đông"), `uddhate pāde` = *bàn chân được nhấc lên*. Dịch lại: *Trên bàn chân được nhấc
  lên, những đóa hoa / toả sáng, lưu lại trên đầu;*. Hai cách đọc ngữ pháp đều hợp lệ (định
  vị cách nơi chốn song song với `muddhani`, hoặc định vị cách tuyệt đối "khi chân nhấc lên"); tôi
  chọn định vị cách nơi chốn vì mạch kể (người nói rải hoa lên bậc đang kinh hành) và vì hai vế `uddhate
  pāde` / `muddhani` cùng là định vị cách; không nêu chủ sở hữu của "đầu".
  `3.1–3.2` `ito` đã bị bỏ ở 3.1 và hiểu sai ở 3.2 (*xuất hiện từ kiếp đó*): `Vīsakappasahassamhi ito` =
  *vào hai mươi ngàn kiếp trước đây* (số: `vīsa` 20 × `sahassa` 1.000 = **20.000**), `ito pañca janā ahuṁ` =
  *đã có năm người*. Tiền lệ `ito … kappe` = *… kiếp trước (đây)* **gần như toàn bộ** các khoá đo được.
  Cùng dạng lỗi *có tám vị xuất hiện từ kiếp đó* ở `tha-ap146:5.2`, ngoài lát này.
  Chỉnh độ chính xác: `2.4` `mokiriṁ` là quá khứ: *tôi đã rải hoa*; `3.3` bỏ *đều* thừa, `nāma` =
  *có tên là*; `3.4` `mahabbalā` = *có đại lực* (`bala` = sức mạnh; *đại oai lực* là cách dịch của
  `mahānubhāva`, khác từ — tầng hiện lẫn nhiều cách: thần lực 61+, uy lực 27+, oai lực 41, đại lực
  khoảng 5); `0.2` `Kumudavagga` → *Phẩm Kumuda* (**6**/10 bài cùng phẩm; *Phẩm Hoa Sen Trắng* chỉ
  **3**/10, *Phẩm Bậc Cho Sen* **1**/10); `0.3` và `6.1` *Tuyên Ngợ* → *Tuyên Ngôn* — *Ngợ* là chữ vô nghĩa
  (tầng có **474** khoá dùng *Tuyên Ngợ* so với **275** *Tuyên Ngôn*, cần người điều phối quy một dạng).
