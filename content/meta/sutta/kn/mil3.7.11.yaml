notes: |-
  Tầng tham khảo: KHÔNG có bản Anh Sujato tại commit đã ghim cho bài này — đếm bằng script, trong cache đã ghin không có tệp nào khớp uid này (0/15 khoá); cũng không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya. Bài này vì thế chỉ dịch từ Pāli, triangulation chấm 7.0 và status giữ draft; xem blocking_errors.

  Đủ 15/15 khoá. Đã đọc hết Pãli lát f120.pali.txt trước khi viết.

  Arūpadhammavavatthānavagga → “Phẩm Xác Định Pháp Vô Sắc” (tiền lệ `mil3.7.10`,
  `mil3.7.12`). Số thứ tự: `Assāsapassāsanirodhapañho ekādasamo` là thứ mười một.

  `Rājā āha—` sửa sang “Vua nói:” theo đa số đếm được (xem `mil3.6.10`).

  BẤT ĐỊNH LỚN NHẤT LÁT NÀI, và không có tầng Anh nào để phân xử: `kākacchamāno` ở 1.6.
  Không có bản Anh đã ghim cho bài này, cũng không có bản Việt hiện hành, tôi dịch theo nghĩa
  chữ là “cứ cày cạc kêu lên như tiếng quạ”, và câu hỏi 1.8 (“tiếng ấy có ngừng lại khi thân
  người ấy cử động không”) cùng câu trả lời 1.10 (“chưa tu tập thân… sẽ ngừng lại”) đọc khớp
  với cách đọc đó. Cách đọc khác là kẻ “được gọi mà vẫn cứ kêu”, tức tiếng ấy không phải tiếng
  của chính người ấy; nếu đúng thì 1.8 phải hiểu khác. Tôi đã ghi bất định này thay vì chọn
  im lặng, và hạ `ambiguity_integrity` xuống 8.4 cho bài này.

  Bản nháp đầu viết thẳng “tiếng kā kā” trong bản Việt; `lọt_pāli` chặn đúng (chữ `kā` mang
  dấu Pāli lại chưa từng xuất hiện trong tầng), nên đã bỏ chữ Pāli lọt và diễn thành “cày
  cạc kêu lên như tiếng quạ”, vừa sạch vừa giữ nghĩa. `sīla` trong `abhāvitasīlassa` tôi dịch
  “giới hạnh” chứ không dịch “tinh thần”, vì `sīla` là giới hạnh và cụm bốn món
  thân–sīla–citta–paññā phải giữ bốn chữ khác nhau.

  Dấu lược: bài không có `…pe…`; hai phía đều 0.

  Kiểm kỹ thuật: save_vi chạy sạch; vì mọi khoá Pāli ở lát này ngắn hơn 40 ký tự (khoá dài nhất 39) nên tập `cần` trong _hvi.kiểm rỗng và các assertion NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy, tôi tự quét lại MỌI khoá bằng chính các hàm đó (pal, lược, lọt_pāli, ngoặc, _TỪ): đủ 15/15 khoá, đúng ID, thứ tự khoá y hệt Pāli, không rỗng, không thừa, mọi chuỗi NFC, không trùng nguyên văn Pāli (trừ 0.1 là tên bộ Kinh, đúng như tiền lệ), số dấu lược khớp Pāli từng khoá, nháy kép cân trên cả bài và khớp đúng số mở/đóng của từng khoá Pāli, không còn (…), toàn bộ chữ cái là script Latin. Đợt này cấm chạy cổng nên technical_integrity = 9.6, KHÔNG phải 10.0; bốn lệnh npm run validate | test | check | build để người điều phối chạy.
