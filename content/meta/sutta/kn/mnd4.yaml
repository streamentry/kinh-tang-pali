notes: |-
  **Phạm vi: đủ 408/408 khoá của mnd4, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải kinh `snp4.4` (Suddhaṭṭhakasutta, Kinh Tám Kệ Về Thanh Tịnh), thuộc phẩm Aṭṭhakavagga. Cấu trúc giống `mnd5` và các bài Cūḷaniddesa: dẫn từng đoạn kệ, giải từng cụm, nhắc lại cả đoạn kệ (kệ in đậm ở `2`, `9`, `16`, `30`, `37`, `46`, `58`, `65`; nhắc lại trong ngoặc kép ở `8`, `15`, `29`, `36`, `45`, `57`, `64`, `71`, mỗi lần mở đầu bằng *Vì thế, Đức Thế Tôn đã nói—*; riêng kệ ma quân `49`–`52` được dẫn bằng *Điều này đã được Đức Thế Tôn nói—* ở `48.1`, và kệ Sabhiya `18`, `41` có dòng `(sabhiyāti bhagavā)`). Pāli có 112 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 52 khoá chứa dấu lược `…`: 13 khoá có `…pe…` (`32.3`, `38.3`, `38.5`, `47.3`, `55.3`, `55.4`, `59.3`, `59.4`, `59.11`, `59.12`, `62.2`, `62.5`, `66.13`, đều thành đúng một `…`), 39 khoá có `…` trần (`13.6`–`13.13`, `42.8`–`42.15`, `42.19`–`42.26`, `42.29`, `42.30`, `42.33`, `42.34`, `42.37`–`42.39`, `61.9`–`61.16`, mỗi khoá giữ đúng một dấu), 0 khoá có `(…)`, 0 khoá kết `….`. Hai khoá có ngoặc đơn của Pāli là `18.2` và `41.2` `(sabhiyāti bhagavā)`, bản Việt giữ cặp ngoặc đơn *(Đức Thế Tôn nói với Sabhiya)* theo `snp3.6:19.2` và 5 khoá khác của `snp3.6`. Pāli có 24 khoá mang nháy kép `“”` (`5.3`, `8.1`, `8.4`, `13.5`, `13.6`, `13.14`, `15.1`, `15.4`, `22.4`, `22.7`, `29.1`, `29.4`, `36.1`, `36.4`, `45.1`, `45.4`, `49.1`, `52.4`, `57.1`, `57.4`, `64.1`, `64.4`, `71.1`, `71.4`) và không khoá nào mang nháy đơn `‘’`; bản Việt khớp từng khoá.

  **Tên bài.** `0.1` Mahāniddesa → *Đại Tập Kể Lược*, `0.2` Aṭṭhakavagga → *Kể Lược Phẩm Tám Kệ*, `0.3` và `72.1` → *Kể Lược Kinh Tám Kệ Về Thanh Tịnh, thứ tư*, theo `mnd5:0.1`–`0.3` và `60.1` (tên kinh theo `snp4.4:0.2`).

  **Cách trình bày lemma** theo `mnd5`, `cnd6`, `cnd9`, `cnd12`, `cnd13`, `cnd16`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Các câu nhắc lại dòng kệ ở cuối từng đoạn lời giải (như `4.3`, `5.4`, `6.3`, `10.3`, `11.2`, `12.4`, `26.5`, `27.6`, `31.8`, `32.6`, `33.8`, `34.4`, `38.6`, `39.9`, `43.5`, `53.3`, `54.7`, `55.14`, `59.16`, `60.2`, `62.6`, `69.4`) giữ cùng chữ với dòng kệ.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd4`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho mnd1–mnd16 và tệp tên `mnd-name` (tiêu đề mnd4 là *Exposition of the Eight on Purity*). Lớp `english-project` không có `mnd4`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **157** khoá (171 nếu đếm cả thẻ); Sujato phủ 0/157, `english-project` 0/157, `vietnamese-current` 0/157. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.4` (bài kệ chứa đúng tám đoạn kệ này) có trong tầng đã ghim nhưng là bản của **bài khác**, nên không tính là đối chiếu English của mnd4; nó chỉ cho thấy cách parse các dòng kệ, và đã được dùng để hiểu nguồn gốc của `snp4.4:2.4` *phản bội* (xem bất định 1). Chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.4`, `snp3.6`, `snp3.2`, `mn78`, `mnd5` và công thức chú giải ở `cnd6`, `cnd9`, `cnd11`, `cnd12`, `cnd15`, `cnd16`, `cnd17`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: 130 khoá có tiền lệ; dùng lại 117 (sau khi bỏ dấu câu và chữ hoa/thường; nguồn nhiều nhất, đếm theo khoá của bài: `mnd5` 50, `snp4.4` 42, `cnd16` 18, `cnd11` 18, `cnd9` 16, `cnd15` 11, `cnd6` 10, `cnd14` 10, `cnd18` 10, `cnd12` 9), khác 13. Các khoá khác tiền lệ, kèm lý do:
  - `9.4` (trùng `snp4.4:2.4`) → *vì chính tri kiến tuyên bố về người ấy, kẻ nói như vậy*, và `15.4`, `13.1`, `13.15` theo đó (xem bất định 1);
  - `46.1` (trùng `snp4.4:6.1`) → *Vị ấy đã thoát khỏi các đạo quân nơi mọi pháp*, và `57.1`, `47.1`, `53.3` theo đó; `46.3` (trùng `snp4.4:6.3`) → *Chính bậc có cái thấy ấy, sống không còn bị che phủ*, và `57.3`, `54.1`, `54.7` theo đó (xem bất định 2);
  - `42.12`, `42.13` (trùng `sn12.35:3.8`, `sn12.68:2.4`, `2.5`) → *tham ái*, *thọ*; `42.19`–`42.25` (trùng `sn12.68:4.3`–`4.9`, `sn12.70:19.6`–`19.11`) → *nên … diệt tận* thay vì *mà … diệt tận*, và *thọ*, *tham ái* thay vì *cảm thọ*, *khát ái*: tầng `kn` (cnd, mnd, ne, ps, pe) dùng *tham ái* 346 lần so với *khát ái* 2, *thọ* 306 so với *cảm thọ* 18, và `ne15:4.1` dùng *do thọ diệt tận nên tham ái diệt tận*.
  Các khoá còn lại dùng lại nguyên văn (kể cả các dòng kệ `snp4.4:1.1`–`1.4`, `2.1`–`2.3`, `3.1`–`3.4`, `4.1`–`4.4`, `5.1`–`5.4`, `6.2`, `6.4`, `7.2`–`7.4`, `8.1`–`8.4`; kệ ma quân theo `cnd11:11.1`–`13.6`; kệ Sabhiya theo `cnd9:18.1`–`18.5` và `snp3.6:31.1`–`31.4`; các công thức *Cái nào là tham, tham đắm …*, *Tạo tác: có hai loại tạo tác—*, *Ở đời: cõi đọa xứ … thế giới các xứ—*, *Ở người ấy: ở bậc A-la-hán …* theo `mnd5`, `cnd6`, `cnd9`, `cnd16`). Đã dò **29 nhóm Pāli trùng nguyên byte trong chính bài** (36 khoá lặp thêm): 0 nhóm có bản Việt khác. Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 44 nhóm, chỉ 1 nhóm có bản Việt khác ngoài dấu câu và chữ hoa/thường (`37.3`, `45.3` *Nhưng bậc hiểu biết …* so với `42.45` *bậc hiểu biết …*: chữ *Nhưng* chỉ thuộc dòng kệ, không thuộc lemma).

  **Thuật ngữ, kèm số đếm.** `diṭṭha, suta, muta` → *được thấy, được nghe, được nhận thức*, `viññāta` → *được nhận biết* (mnd5; tầng khác dùng *cảm nhận* cho `muta`, nhưng cả `snp4.4:3.2` lẫn `mnd5` dùng *nhận thức*). `sīlabbata` (đi liền) → *giới luật và khổ hạnh*, riêng `sīlabbataparāmāso` trong danh sách bảy pháp, kiết sử và nút thắt → *giới cấm thủ* (`cnd9:17.4`, `ps2.1:13.2`, `ne36`). `upadhi` → *sanh y* trong 103 / 109 khoá của tầng có chứa `upadhi` (33 tệp), nhưng `sopadhīko` ở dòng kệ giữ *kẻ còn chấp thủ* theo `snp4.4:2.3` (xem bất định 3). `suddhi, visuddhi, parisuddhi` → *sự thanh tịnh, sự thanh tịnh hoàn toàn, sự thanh tịnh trọn vẹn*; `mutti, vimutti, parimutti` → *sự giải thoát, sự giải thoát hoàn toàn, sự giải thoát trọn vẹn* (`mnd5:5.8`). `cakkhuviññāṇa` → *thức mắt* (`cnd12:17.4`, `mil3.3.2`). `aggaṁ … pavaraṁ` → *tối thượng, cao nhất, tối thắng, thù thắng, dẫn đầu, tối cao, cao quý* (`mnd5:3.3`, `11.4`). `ñāṇa` ở dòng kệ → *tri kiến* (`snp4.4`), ở lời giải → *trí*. `kappa` → *tạo tác* (`mnd5:44.2`, `48.2`, `cnd16:5.2`); `purekkhāra` → *sự đề cao* (`mnd5:49.2`); `vikappayeyya` → *phán đoán* (`mnd5:44.14`, `snp4.4:6.4`). `ejā` → *dao động* (`cnd16:3.5`, `cnd18:9.1`); `saṅga` → *trói buộc*, `gantha` → *nút thắt* (`snp4.4:7.3`; `mnd5:15.1` dùng *trói buộc* cho `gantha` của `snp4.5`, nhưng ở đây *trói buộc* đã dành cho `saṅga`), `kāyagantha` → *kết thân* (`ne36:11.9`, `ne36:14.1`, `dn33:1.11.170`: tham muốn, sân hận, giới cấm thủ, chấp chặt rằng đây là sự thật). `ādānagantha` → *nút thắt chấp thủ* (khớp `cnd16:17.2` *tham ái chấp thủ*). `saññasatta` → *bị tưởng trói buộc* (`snp4.4:5.2`) và chuỗi *bị dính mắc, bị đắm chìm, bị bám chặt, bị mắc vào, bị vướng vào, bị ràng buộc* theo `cnd16:26.3`–`26.4` (`39.7`, `39.8`); `kāmasaññā, byāpādasaññā, vihiṁsāsaññā` → *tưởng dục, tưởng sân, tưởng hại* . `uccāvacaṁ gacchati` → *đi đến chỗ cao thấp* (`snp4.4:5.2`), lời giải *đi từ vị thầy này đến vị thầy khác …* (`satthā` *vị thầy*, `dhammakkhāna` *lời giảng pháp*, `gaṇa` *hội chúng*, `paṭipadā` *đường lối thực hành*, `magga` *con đường* theo `mnd5:5.1`). `veda` → *minh*, `vedagū` → *bậc đạt minh* (`snp4.4:5.3` *các minh*, `snp3.6:31.1`; *đạt minh* cho `vedagū` ở `an8.85:1.3`, `an8.85:2.3`, `snp3.12:17.1`, `snp3.12:40.4`). `bhūripañña` → *trí tuệ rộng lớn*, *Bhūri được gọi là đất* (nguyên văn `cnd15:13.3`). `visenibhūta` → *đã thoát khỏi các đạo quân* (`cnd11:10.1` *Sau khi phá tan các đạo quân*), `mārasenā` → *đạo quân của Ma* (`cnd11:10.2`), `kodho` → *giận dữ*, `upanāho` → *hằn học* (`cnd11:10.2`; *hằn học* 17 lần trong `kn`). `sīmā` → *ranh giới*, `saṁyojana` → *kiết sử*, `anusaya` → *tùy miên*, `rūparāgo, arūparāgo` → *sắc ái, vô sắc ái*, `oḷārika` → *thô thiển*, `anusahagata` → *vi tế* (`ps2.1:13.2`–`13.17`). `māno` → *ngã mạn* trong danh sách bảy pháp, bảy trói buộc và các câu *còn ngã mạn* (`cnd9:17.4`, `mnd5:56.15`), *mạn* trong danh sách kiết sử và tùy miên (`ps2.1:13.14`, `mnd5:44.7`) — cả hai dạng đều có tiền lệ cục bộ. các nẻo đi ở `55.11` theo `mnd5:44.11`. `rāgarattā` → *kẻ say đắm tham ái*, `virāgarattā` → *kẻ đắm nhiễm ly tham* (`snp4.4:8.3`); `rattā giddhā gadhitā mucchitā ajjhosannā` → *tham đắm, say mê, bị trói buộc, mê muội, chấp trước* (`ud7.3:1.3`). `kāmaguṇa` → *dục lạc* (`cnd20:14.2`, `pe6`). `ñāṇagginā daḍḍhā` và công thức *đã được đoạn trừ, nhổ tận gốc, làm lắng dịu, làm an tịnh, không thể sinh khởi nữa, bị lửa trí tuệ thiêu cháy* theo `mnd5:31.2`; *cắt tận gốc rễ, làm thành như gốc cây thốt nốt bị chặt, làm cho không còn hiện hữu, khiến không thể sinh khởi trong tương lai* theo `cnd9:17.2` (cho `26.3`, `68.4`). `tedhātuka` → *ba giới* (`ne5:27.7`, `ne15:3.3`); `puññābhisaṅkhāra, apuññābhisaṅkhāra, āneñjābhisaṅkhāra` → *hành phước, hành phi phước, hành bất động* (`cnd17:52.1`). `vimariyādikatena cetasā` → *với tâm không còn giới hạn* (`cnd6:6.1`, `cnd10:15.9`, `cnd13:25.1`). `iddhipāda` → *thần túc* (8 lần trong cnd/mnd so với 1 lần *như ý túc* ở `mnd5:16.2`); `aṭṭhaṅgika magga` → *Thánh đạo tám chi* (10 lần trong cnd/mnd); `phassāyatana` → *sáu xứ xúc* (82 lần so với 17 lần *sáu xúc xứ* trong toàn tầng); `upādānakkhandha` → *năm thủ uẩn* (331 lần). *Inda* giữ tên (`mnd5:10.11`), *dạ-xoa*, *kim sí điểu*, *a-tu-la*, *càn-thát-bà* theo `mnd5:10.11`; *Vāsudeva, Baladeva, Puṇṇabhadda, Maṇibhadda* giữ tên (0 tiền lệ); *theo hạnh bò, hạnh chó* theo `ne21:33.6` và `mn57`.

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `sattannaṁ dhammānaṁ` 7 → *bảy pháp* (`17.3`, `40.5`, `66.12`), rồi bảy mục ở `17.4` (7/7) và `40.6` (7/7); `catūhi dhammehi` 4 → *bốn pháp* (`22.4`, `22.7`), `katamehi catūhi` → *Thế nào là bốn?* (`22.5`) rồi 4 mục (`22.6`, 4/4); `catasso sīmāyo` 4 → *bốn ranh giới* (`66.2`), `paṭhamā … catutthā` → *thứ nhất, hai, ba, tư* (`66.4`, `66.6`, `66.8`, `66.10`); `catūhi ariyamaggehi` 4 → *bốn Thánh đạo* (`53.1`, `66.11`), `catūsu maggesu` → *bốn đạo* (`40.3`); `cattāro ganthā` 4 → *bốn nút thắt* (`61.2`), 4 mục ở `61.3` (4/4); `dve kappā` 2 → *hai loại tạo tác* (`55.2`, `59.2`), `dve purekkhārā` 2 → *hai sự đề cao* (`59.10`); `pañcasu kāmaguṇesu` 5 → *năm dục lạc* (`68.2`); `Pañcamī … aṭṭhamo` → *Thứ năm, thứ sáu, thứ bảy, thứ tám* (`50.1`–`50.4`) nối vào *thứ nhất, thứ hai, thứ ba, thứ tư* ở `49.1`–`49.4` (8 đạo quân, 8/8); `suddhaṭṭhakasuttaniddeso catuttho` → *thứ tư* (`72.1`); *catuttho* khớp `0.3` *4.*. Danh sách: `paramaṁ … pavaraṁ` 7 mục / 7 Việt (`5.3`, `67.4`, `69.3`); 8 mục *tāṇappattaṁ … nibbānappattaṁ* ở `3.3` (8/8) và 11 cặp `antagato … nibbānappatto` ở `40.4` (11/11); 6 cặp thanh tịnh–giải thoát (`4.2`, `10.2`, 6/6 + 6/6; `19.2`, `20.12`, `21.11`, `22.2`, `22.8`, `23.4`, `24.4`, 6/6); 7 mục `aññatra …` ở `12.2` và `19.2` (7/7); 8 mục `sarāgo … saupādāno` ở `12.3` (8/8); 10 mục `20.6` (10/10), 15 mục `20.9` (15/15), 10 mục `21.5` (10/10), 12 mục `21.8` (12/12), 22 mục `vatikā` ở `23.2` (22/22), 14 mục `vata` ở `38.3` (14/14), 12 mục `24.2` (12/12); 6 mục `satthā … magga` ở `31`, `33`, `39`, `43` (6/6 từng khoá); 7 mục `rāgasaṅga … duccaritasaṅga` ở `32.5` (7/7); 9 mục `mārasenā` ở `47.3` (9/9); 8 mục `rāga … anusaya` ở `55.7` (8/8) và 8 mục `ratto … thāmagato` ở `55.8` (8/8); 10 mục nẻo đi ở `55.11` (10/10); 6 mục `loka` ở `55.13` (6/6); 6 mục ở `59.15` (6/6, kèm 6 vế *không … làm cờ / biểu kỳ / chủ đạo*); 5 mục `chadana` ở `54.4` (5/5); 8 mục `carantaṁ … yāpentaṁ` ở `54.6` (8/8); 10 mục `ganthe … bandhane` ở `61.21` và `61.26` (10/10); 8 mục `ratta … palibuddha` ở `68.2` và `68.3` (8/8); 12 khâu duyên khởi ở `42.6`–`42.27` (11 khâu thuận + 11 khâu nghịch, mỗi khâu 1/1). Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi` làm số; `koṭigato` ở `40.4` là *điểm cực hạn*, không phải số; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `9.4`, `15.4`, `13.1`–`13.3`, `13.15` `diṭṭhī hi naṁ pāva tathā vadānaṁ`: `pāva` = `pāvadati` (lời giải `13.2` *Sāva diṭṭhi taṁ puggalaṁ pāvadati*), nên dịch *tuyên bố về người ấy*; `snp4.4:2.4` ghi *vì tri kiến đã phản bội nó*, trùng với *betrays* của tầng Anh (cách đọc mượn từ English, không phải nghĩa đen của `pāvadati`). Không sửa `snp4.4`, báo để người biên tập quyết; `13.3` `iti vāyaṁ puggalo …` dịch *rằng người này có tà kiến, có cái thấy đảo ngược* (0 tiền lệ, không phân xử được `iti vā`).
  2. `46.1`, `47.1`, `53`, `57.1` `visenibhūto`: lời giải `47.2` và `53.1` nói rõ `senā` là `mārasenā` nên dịch *đã thoát khỏi các đạo quân*; `snp4.4:6.1` ghi *đã rũ bỏ mọi lưới độc đối với tất cả các pháp* và `snp4.13:20.1` ghi *đã lìa xa mọi pháp* (tầng Anh đọc *remote from all things*), cả hai không khớp lời giải này. `46.3`, `54`, `57.3` `tameva dassiṁ vivaṭaṁ carantaṁ`: lời giải `54.2` giải `dassī` là *suddhadassī* (bậc có cái thấy thanh tịnh), nên dịch *Chính bậc có cái thấy ấy, sống không còn bị che phủ*; `snp4.4:6.3` ghi *nhìn thấy vị ấy sống rộng mở*. Không sửa `snp4.4`, `snp4.13`; báo để người biên tập.
  3. `9.3`, `12.1`, `12.3`, `12.4`, `15.3` `sopadhīko` → *kẻ còn chấp thủ* theo `snp4.4:2.3` (nguyên văn dòng kệ), trong khi `upadhi` là *sanh y* ở 103 / 109 khoá của tầng; ở `12.3` còn dẫn tới danh sách cuối cùng *còn chấp thủ* (`saupādāno`), nên hai từ khác nhau (`sopadhīko`, `saupādāno`) cùng được dịch *chấp thủ*. Chưa thống nhất, để người biên tập quyết.
  4. `30.1`, `31.8`, `36.1` `sitāse` → *chúng nắm lấy cái sau* theo `snp4.4:4.1`, nhưng lời giải `31.2`–`31.7` dùng `nissitā` → *đã nương vào* (`mnd5:17.2`); hai cách dịch cùng một nghĩa, chỉ khác sắc thái.
  5. `1.1`, `2.1`, `3.1`–`3.4`, `8.1` `suddhaṁ` → *một vị thanh tịnh* (theo `snp4.4:1.1`; lời giải `3.3` *paramaṁ ārogyappattaṁ …* nói về một người), nhưng `6.2` `yo suddhaṁ passati` → *Người nào thấy sự thanh tịnh*, vì `suddhānupassī` đã dịch *kẻ quán sát sự thanh tịnh* (`snp4.4:1.4`); Pāli không phân xử được đối tượng của `suddhaṁ` là người hay là phẩm chất.
  6. `4.2`, `6.2`, `10.2`, `11.1` `cakkhuviññāṇaṁ rūpadassanena`: dịch *nhờ thức mắt thấy sắc* (và *tin rằng thức mắt thấy sắc là tri kiến*); `cakkhuviññāṇaṁ` đứng trực tiếp với `rūpadassanena` mà không có từ nối, 0 tiền lệ nguyên cụm. `6.2` `maggo, patho, niyyānaṁ` → *con đường, lối đi, sự xuất ly*: 0 tiền lệ cho bộ ba; `niyyānika` → *dẫn đến xuất ly* (`mnd5:4.9`).
  7. Danh sách điềm lành / điềm xấu (`20.5`–`20.10`, `21.4`–`21.9`, `24.2`): `abhimaṅgalagatāni` → *điềm lành tột bậc*, `kālato vuṭṭhahitvā` → *thức dậy đúng thời*, `cāṭakasakuṇa` → *chim cātaka*, `rohitamaccha` → *cá rohita*, `gokapila` → *bò vàng nâu*, `phussa` → giữ nguyên *phussa* (8 lần ở `20.6`, `21.5`, `24.2`: *cây gậy tre phussa*, *tiếng phussa*, *hạt mè / dầu / tăm xỉa răng / đất sét / vải / khăn đội đầu phussa*), `takkaghaṭa` → *bình sữa bơ*, `naṭa` → *người diễn kịch*, `ekayuttayāna` → *xe chỉ thắng một con vật*, `kuṇī` → *người tay co quắp*, `tilavāha` → *xe chở mè*, `phāla` → *lưỡi cày*; không tiền lệ nào trong tầng (0 khoá), và nghĩa `phussa` (sao Phussa hay loại vật) chưa phân xử được. `21.5` `vaḍḍhā … sirīvaḍḍhā` có thể là tên người hoặc tiếng gọi; dịch theo nghĩa từng chữ (*tăng trưởng, đang tăng trưởng, đầy đủ, phussa, không sầu, hảo ý, tinh tú tốt, cát tường, may mắn, may mắn tăng trưởng*), `21.8` tương tự (*chặt, đập vỡ, đốt cháy, mất, không có*).
  8. `22.3`–`22.7`: dùng lại `mn78:5` (*sa-môn bất khả chiến thắng, thành tựu thiện pháp, tối thắng thiện pháp, chứng đắc mục đích tối thượng*); khác `mn78:5.1` ở chỗ dịch `dhammehi` là *bốn pháp* thay vì *bốn phẩm chất*, và `22.5` dịch *Thế nào là bốn?* (72 khoá trong tầng) thay vì *Bốn phẩm chất nào?*. `ayojjaṁ` giữ *bất khả chiến thắng*.
  9. `60.1` `akiriyadiṭṭhi` → *kiến vô tác*, `saṁsārasuddhi` → *sự thanh tịnh nhờ luân hồi*, `sassatavāda` → *thuyết thường hằng* (tầng có *thuyết thường hằng*): 0 tiền lệ cho hai cụm đầu.
  10. `61.4`–`61.6` `āghāto appaccayo` → *sự phẫn nộ, sự bất mãn*: 0 tiền lệ cho cụm; `61.21`, `61.26` `phoṭayitvā` → *phá tung*; `61.23` `vayhaṁ vā rathaṁ vā sakaṭaṁ vā sandamānikaṁ vā sajjaṁ visajjaṁ karonti vikopenti` → *tháo rời, gỡ ra, làm cho tan rã một cỗ xe có người kéo, hay một cỗ xe ngựa, hay một cỗ xe bò, hay một cỗ xe lăn nhỏ*: 0 tiền lệ cho `vayha`, `sandamānikā`, `sajjaṁ visajjaṁ`; nghĩa từng loại xe chưa phân xử được.
  11. `66.3`, `66.5`, `66.7`, `66.9` `tadekaṭṭhā ca kilesā` → *các phiền não đồng loại với chúng*: 0 tiền lệ; `66.11` `sīmātigo` → *bậc đã vượt qua ranh giới*. `65.1`, `66.1`, `67.3`, `67.5`, `71.1` `sīmātigo brāhmaṇo tassa natthi, ñatvā va disvā va samuggahītaṁ` → *Bà-la-môn ấy đã vượt qua ranh giới, không còn giới hạn, sau khi biết và sau khi thấy, vị ấy không nắm giữ gì* (nguyên văn `snp4.4:8.1`–`8.2`); *không còn giới hạn* là cách `snp4.4` đọc `tassa natthi`, trong khi lời giải `67.4`, `69.1` gắn `natthi` với `samuggahītaṁ` / `paramuggahītaṁ`.
  12. `40.2` `vijjāgato` → *bậc đã đạt tri thức*, `vibhāvī` → *bậc sáng suốt*, `medhāvī` → *bậc thông tuệ* (cnd9:11.3, cnd13:16.2); `40.3` `vīmaṁsā` → *sự khảo xét*, `vipassanā` → *tuệ quán* (75 lần *tuệ quán* so với 23 lần *minh sát* trong toàn tầng); `catūsu maggesu` gắn với cả danh sách *trí … chánh kiến* chứ không chỉ `sammādiṭṭhi`.
