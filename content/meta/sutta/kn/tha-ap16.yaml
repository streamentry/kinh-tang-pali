  SỐ PĀLI, TỰ TÍNH. (1) Pañcavīsatikappāni 8.1 = pañca 5 + vīsati 20 = 25, dịch hai mươi lăm kiếp (tiền lệ tha-ap17:6.1, tha-ap262:4.1). (2) Catuttiṁsatikkhattuñca 8.3 = catu 4 + tiṁsati 30 = 34, dịch ba mươi bốn lần (tiền lệ tha-ap33:7.3 Catutiṁsatikkhattuñca = ba mươi bốn lần). Chứng cứ tiṁsati = 30 trong chính tầng: tha-ap418:8.3 Ekatiṁsatikkhattuñca = ba mươi mốt lần; tha-ap432:7.3 Tiṁsatikkhattuṁ = ba mươi lần. BẤT ĐỊNH GHI THEO YÊU CẦU: giá trị tiṁsa/tiṁsati = 30 được lấy theo đo tầng; cụm Tiṁsakappasahassa (ba nghìn hay ba mươi nghìn kiếp) KHÔNG xuất hiện trong bài này nên không phải phân xử ở đây. (3) Aṭṭhārasavasso 13.1 = aṭṭha 8 + dasa 10 = mười tám tuổi. (4) Kappasatasahassamhi 10.1 = 100 x 1.000 = một trăm nghìn kiếp (tiền lệ tha-ap10:11.1, 3 khoá cùng chữ). (5) Dve bhātaro 12.1 = hai anh em. Các số công thức 20.1 đến 20.3 (bốn vô ngại giải, tám giải thoát, sáu thắng trí) dùng lại nguyên văn tầng; không có số nào khác. Lỗi ngoài lát, chỉ báo, không sửa: tha-ap501:6.1 dịch Catutiṁsatikkhattuñca thành Cả bốn mươi món báu quý giá, sai nghĩa và sai số (Pāli là ba mươi bốn lần).

  NĂM PHÉP KIỂM, MỖI PHÉP IN MẪU SỐ. (1) Tập khoá: Việt 85 = Pāli 85, thừa 0, thiếu 0, thứ tự y hệt Pāli. (2) Nháy kép và nháy đơn khớp Pāli từng khoá: Pāli có 4 dấu (mở kép ở 1.1, mở đơn ở 7.3, đóng đơn ở 12.4, đóng kép ở 20.4), Việt đúng 4 dấu ở đúng 4 khoá; lệch 0/85 khoá. Nhịp nháy chạy qua khoá là cố ý của Pāli. (3) Pāli trùng nguyên văn TRONG CHÍNH bài: 0 nhóm trùng, nên phép này CHẠY RỖNG, không đo được gì; không ghi 0 lỗi như thể đã kiểm. (4) Dấu lược: Pāli có 0 khoá chứa dấu lược (kể cả dạng …pe… và ba chấm trần), Việt 0 khoá chứa; lệch 0/85; không có khoá (…) trần. (5) Số Pāli: xem mục trên, 4 số tự tính. Phụ: NFC 85/85; khoá rỗng 0; khoảng trắng thừa 0; từ Pāli lọt sang Việt ngoài tên riêng 0 (chỉ còn Therāpadāna ở 0.1, Sīhāsaniya ở 0.2, Cūḷapanthaka, Padumuttara, Himavanta, Okkāka, Gotama, Panthaka).

  TIÊU ĐỀ. 0.3 = 4. Bài Kệ Tuyên Ngôn Về Trưởng Lão Cūḷapanthaka và translationTitle BẰNG ĐÚNG giá trị đó (kể cả số thứ tự). Số thứ tự: Pāli 0.3 bắt đầu bằng chữ số (4 Cūḷapanthakattheraapadāna) nên giữ số theo hình thức N. ; đo lại toàn tầng tha-ap trên 476 tệp có 0.3: KEEP 143, DROP 333, THỪA 0. Phe dịch apadāna: toàn tầng Tuyên Ngợ 247, Tuyên Ngôn 110, Ký Sự 101; phạm vi gần nhất (các bài tha-ap 8 đến 25, 12 tệp) Tuyên Ngôn 8, Tuyên Ngợ 3. Hai phạm vi cho hai đa số khác nhau và Tuyên Ngợ là sai chính tả; dùng Tuyên Ngôn, cùng cách ở 0.3 và 22.1 để bài không tự mâu thuẫn. Cần biên tập phán một lượt cho cả cuốn. 0.1 Therāpadāna giữ nguyên Pāli (465/476 tệp, 11 tệp dịch khác); xung đột với bất biến không chép Pāli vào bản dịch đã được các bài trước nêu, ở đây không tự phá một trong hai. 0.2 Phẩm Sīhāsaniya khớp 8/8 tiền lệ.

  LỜI KẾT 21.1: dùng nhóm số nhiều Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này, đo trong tầng tha-ap 493 khoá so với 2 khoá số ít (đã từng nói bài kệ này); Pāli imā gāthāyo là số nhiều. 22.1 theo khuôn thứ tư của các bài cùng phẩm.

  DÙNG LẠI NGUYÊN VĂN. Dò 5.390 tệp Việt đã có: 38 khoá Pāli của bài này có Pāli trùng nguyên văn ở bài khác, tổng 1.917 cặp Pāli trùng đã dò; 1.639 cặp bản Việt trùng chữ với bản của bài này, 278 cặp khác. 25 khoá trùng chữ với ít nhất một bản đã có (0.1, 0.2, 1.1, 1.2, 3.2, 4.3, 5.1, 7.4, 8.2, 8.4, 9.2, 10.1 đến 10.4, 11.1, 13.2, 13.4, 16.1, 19.3, 19.4, 20.1 đến 20.4); ở 8.2 và 10.1 bản chọn là dạng đông nhất trong các dạng khác nhau. 13 khoá có tiền lệ mà KHÔNG dùng nguyên văn: 1.3, 2.1, 2.4, 4.1, 14.3, 15.1, 15.2, 15.3, 16.2, 16.3, 16.4, 17.1, 18.4, lý do ở mục dưới (đa số vì ngôi kể, vì sửa lỗi của tiền lệ, hoặc vì tiền lệ nằm ở thể có dấu nháy khác). Các vế 20.1 đến 20.4 là công thức bốn vô ngại giải, dùng lại nguyên văn (số cặp trùng chữ trên số cặp Pāli trùng: 20.1 484/490, 20.2 54/64, 20.3 57/68, 20.4 452/490). 19.4 viharāmi anāsavo có 141 cặp Pāli trùng, chỉ 12 trùng chữ với bản của bài này; phần lớn còn lại khác ở ngôi kể (trong riêng tha-ap có 99 khoá dùng ta). Bài này dùng tôi cho người kể và Ta cho Đức Phật để hai tiếng nói không lẫn nhau; theo đó 19.4 là tôi sống không còn lậu hoặc (khớp 10 tiền lệ). Số cặp Pāli trùng trong chính bài mà Việt khác: 0 (không có cặp trùng nội bộ).

  CÁC KHOÁ TRÙNG PĀLI VỚI thag10.4, ĐỌC KỸ VÀ SỬA CÓ CHỦ ĐÍCH. Bài kệ thag10.4 của cùng vị trưởng lão có 9 khoá trùng Pāli với 14.3, 15.1 đến 15.3, 16.1 đến 16.4 và 17.1 của bài này. Bản Việt thag10.4 dùng ta và có ba chỗ tôi không sao chép: (a) thag10.4:1.3 dịch bhātā là người em; Pāli chỉ nói bhātā; tiếng Việt buộc phải chọn anh hay em, và truyền thống (không có trong Pāli của bài này) nói người đuổi là anh Mahāpanthaka, tên cūḷa là nhỏ; bài này dùng người anh và coi đây là bất định đã ghi; ghi để lát phụ trách thag10.4 xem lại. (b) thag10.4:4.1 dịch anukampāya me satthā là Để thương lượng cho ta, bậc Thầy Tạng, sai nghĩa; anukampā = lòng thương tưởng (tiền lệ ud3.3:6.2). (c) thag10.4:2.1 dịch paṇāmito là Bị từ chối, trong khi paṇāmeti = đuổi đi (ud3.3:6.2 đã dịch paṇāmitā là đã đuổi). Pāli sāmaññasmiṁ apekkhavā ở 15.4 dịch hướng về đời sống sa-môn theo thag3.4 (3 khoá).

  BẤT ĐỊNH, KHÔNG BỊA. (1) 18.2 sariṁ kokanadaṁ ahaṁ: sariṁ là nhớ (cp32:1.4, tha-ap341:8.2, cùng khuôn sariṁ + tân ngữ); kokanada là sen hồng (an5.195:3.1). Tôi dịch và nhớ đến đóa sen hồng, theo nghĩa đen; nếu sariṁ là đi đến (từ gốc sar) thì câu thành đi đến chỗ sen hồng. Không có chú giải đã ghim để phân xử; nghĩa kokanada ở đây có thể là hình ảnh nhưng không xác lập được. (2) 9.3 đến 9.4 abbhokāse patiṭṭhantaṁ padumaṁ dhārayissati: patiṭṭhantaṁ có thể bổ nghĩa cho padumaṁ (đóa sen đứng giữa trời trống, vị ấy sẽ nâng giữ) hoặc cho người (khi vị ấy đứng giữa trời trống, sẽ nâng giữ đóa sen). Chọn cách thứ nhất vì không cần thêm đại từ; đối xứng với 6.3 đến 6.4 Ākāse dhārayantassa padumacchattamuttamaṁ. (3) 7.1 đến 7.2 adāsi tāpaso mama: mama là cách dành cho (cho tôi) của chính Đức Phật, vì 7.3 mở nháy và là lời Ngài (cấu trúc tha-ap10:8.1 đến 8.4: nêu người dâng ở ngôi thứ ba rồi Ta sẽ tuyên thuyết về người ấy). Nên dịch vị đạo sĩ đã dâng cho Ta; dấu nháy mở ở 7.3 giữ đúng như Pāli. (4) 17.3 Evaṁ suddhaṁ adhiṭṭhehi: bài song hành thag10.4:4.3 đọc etaṁ (tấm lau sạch này), bài này đọc evaṁ; giữ evaṁ (như thế) và thêm chữ vật vì suddhaṁ là trung tính và 17.2 vừa nêu tấm lau chân. 17.4 ekamantaṁ: có thể là sang một bên hoặc chuyên nhất (bản Anh Sujato của thag10.4:4.3 đến 4.4 dùng exclusively); dịch trọn vẹn. Không đẩy thành giải thích trong thân kinh. (5) 3.3 đến 3.4 samādhiṁ samāpajjantaṁ antarāyamakāsahaṁ: dịch khi Ngài đang nhập định, tôi đã gây trở ngại, nghĩa đen. Đây là nghiệp đời trước làm trí tuệ chậm chạp (14.1 Dandhā mayhaṁ gatī āsi), nhưng chữ nối nhân quả không có trong Pāli nên không thêm. (6) 2.3 đến 2.4: acirāgataṁ mahāvīraṁ và lokanāyakaṁ cùng chỉ một vị, cùng là tân ngữ của upesiṁ; để nguyên hai dòng bổ ngữ như Pāli. (7) 13.3 visesa dịch sự thù thắng, 0 tiền lệ trực tiếp cho cụm này. (8) 14.1 gatī dịch bước đi (theo thag10.4:1.1, nghĩa đường đi, tiến bộ). (9) 5.2 đến 5.4 chủ ngữ ngầm của sādhukāraṁ pavattesuṁ là các vị trời; anumodissati là tương lai, vì các vị trời nói điều đó trước khi đến (6.1 Idaṁ vatvāna).

  SỬA BẢN NHÁP ĐÃ BẮT. (a) Bản nháp đầu viết chữ đầu dòng thường ở các vế thứ ba (5.3, 6.3, 13.3, 14.3, 15.3, 18.3); sửa theo quy ước tầng (vế thứ ba viết hoa đầu dòng). (b) Phép đo tiền lệ nhóm Pāli trùng ban đầu chỉ quét tha-ap nên bỏ sót thag10.4; đã quét lại toàn bộ tầng Việt. Không có lỗi cổng nào được bắt vì không được chạy cổng.

