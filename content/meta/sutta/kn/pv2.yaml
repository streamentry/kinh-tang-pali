notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Pāli có hai nháy kép mở ở 2.1 và 2.2 nhưng chỉ đóng một lần ở 3.4, tức nguồn lệch; bản Việt mở ở 2.1 và đóng ở 3.4, bỏ nháy thừa của 2.2, cân trên cả bài.

  Tiền lệ có đếm và dùng lại: Petavatthu → Petavatthu (2); Uragavagga → Phẩm Rắn (3, đã có sẵn trong tầng nên theo); peti → ngạ quỷ (55, theo khuôn Chuyện ngạ quỷ Akkharukkha của pv48 và Chuyện ngạ quỷ Thâu Góp Của Cải của pv49); Sūkaramukhapetavatthu → Chuyện ngạ quỷ Có Miệng Dễ Chịu theo đúng khuôn đó; dutiyaṁ → thứ hai.

  0 tiền lệ, đặt mới: sūkaramukha → miệng dễ chịu; sabbasovaṇṇa → rực rỡ toàn sắc vàng; obhāsate disā → làm sáng mọi phương trời.

  Giữ đúng hai bên đối thoại và mức độ châm biếm có trong kinh: 1.1-1.4 là người hỏi chê miệng ngươi miệng heo rừng và hỏi ngươi đã làm điều gì trước đây; 2.1-2.4 là Nārada đáp vì ta làm chủ bằng thân và lời nói nên mới có sắc đẹp; 3.1-3.4 là ta nói lại rằng chính ngươi đã thấy, ngươi đã làm điều ác bằng miệng, nên đã có miệng dễ chịu. Không dịch nhẹ đi lời trách, không thêm lời giải thích nào cho điều mỉa mai ở 1.3 và 3.4.

  Triangulation: không có English Sujato cho uid này tại commit đã ghin (đã dò cache, 0 tệp), nên dịch chỉ từ Pāli. Trong tầng chỉ có pv1, pv14, pv48, pv49 nên đây là bài thứ hai có thân văn đầy đủ sau pv48. Không chạy được npm run validate|test|check|build theo lệnh phân công đợt này nên technical_integrity là 9.6.
