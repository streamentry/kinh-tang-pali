notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Pāli có hai nháy kép mở ở 2.1 và 2.2 nhưng chỉ đóng một lần ở 3.4, tức nguồn lệch; bản Việt mở ở 2.1 và đóng ở 3.4, bỏ nháy thừa của 2.2, cân trên cả bài.

  Tiền lệ có đếm và dùng lại: Petavatthu → Petavatthu (2); Uragavagga → Phẩm Rắn (3, đã có sẵn trong tầng nên theo); peti → ngạ quỷ (55, theo khuôn Chuyện ngạ quỷ Akkharukkha của pv48 và Chuyện ngạ quỷ Thâu Góp Của Cải của pv49); Sūkaramukhapetavatthu → Chuyện ngạ quỷ Có Miệng Dễ Chịu theo đúng khuôn đó; dutiyaṁ → thứ hai.

  0 tiền lệ, đặt mới: sūkaramukha → miệng dễ chịu; sabbasovaṇṇa → rực rỡ toàn sắc vàng; obhāsate disā → làm sáng mọi phương trời.

  Giữ đúng hai bên đối thoại và mức độ châm biếm có trong kinh: 1.1-1.4 là người hỏi chê miệng ngươi miệng heo rừng và hỏi ngươi đã làm điều gì trước đây; 2.1-2.4 là Nārada đáp vì ta làm chủ bằng thân và lời nói nên mới có sắc đẹp; 3.1-3.4 là ta nói lại rằng chính ngươi đã thấy, ngươi đã làm điều ác bằng miệng, nên đã có miệng dễ chịu. Không dịch nhẹ đi lời trách, không thêm lời giải thích nào cho điều mỉa mai ở 1.3 và 3.4.

  Triangulation: không có English Sujato cho uid này tại commit đã ghin (đã dò cache, 0 tệp), nên dịch chỉ từ Pāli. Trong tầng chỉ có pv1, pv14, pv48, pv49 nên đây là bài thứ hai có thân văn đầy đủ sau pv48. Không chạy được npm run validate|test|check|build theo lệnh phân công đợt này nên technical_integrity là 9.6.

  Lượt cải thiện 2026-10-11 (đọc đối kháng từng khoá Pāli↔Việt; thay thế các mục cũ nói về "miệng dễ chịu", "làm chủ bằng thân và lời nói" và "ngươi đã làm điều ác bằng miệng" ở trên, vì các mục ấy mô tả những chỗ dịch sai):
  - Tiêu đề (0.3, 4.1, translationTitle): sūkaramukha là "miệng heo" (sūkara = heo, mukha = miệng), không phải "miệng dễ chịu"; đổi thành "Có Miệng Heo", cùng khuôn "Có Miệng Thối" của pv3.
  - 1.1: bỏ "rực rỡ" không có trong Pāli; sabbasovaṇṇo = toàn sắc vàng (sovaṇṇa = bằng vàng/sắc vàng, cùng gốc với sabbasovaṇṇamaya "toàn bằng vàng" ở dn17:1.27.2 và 2.9.2, đã đối chiếu Pāli và bản Anh Sujato của dn17). Đây là cách hiểu có căn cứ, không còn là đặt mới.
  - 1.3: sūkarasseva có iva, nên "giống miệng heo", bỏ "heo rừng" thêm vào.
  - 1.4: kiṁ kammamakarī pure là câu hỏi "ngươi đã làm nghiệp gì trước kia?"; bản cũ "như điều gì ngươi đã làm" vô nghĩa.
  - 2.1-2.2: saññato/asaññato đối nghĩa: thân thì tự chế, lời nói thì không tự chế (bản cũ dịch cả hai thành "làm chủ"; lời nói thành tự chủ là ngược nghĩa). "Tự chế" theo tiền lệ pv33 (saññato, asaññato).
  - 2.3: me trong metādiso là "của tôi" (me ediso), nên dung sắc là của người nói; bản cũ đổi chủ thể thành "ngươi có sắc đẹp". 2.4: yathā passasi là "như ngài thấy"; bản cũ "như điều ngươi thấy ở ta" thêm nghĩa.
  - 3.3-3.4: mākāsi là mā akāsi (cấm đoán: "chớ làm"), mā kho sūkaramukho ahū là "chớ trở nên kẻ miệng heo"; bản cũ dịch thành lời khẳng định quá khứ "ngươi đã làm điều ác... nên đã có miệng dễ chịu", đảo ngược nghĩa lời khuyên. Đây là lỗi nghĩa nặng nhất.
  - Đại từ: Nārada hỏi ngạ quỷ nên gọi "ngươi"; ngạ quỷ đáp xưng "tôi" và gọi Nārada là "ngài", theo cách đã dùng ở pv33 và pv40 (bản cũ để ngạ quỷ xưng "ta" và gọi Nārada "ngươi").
  - Tổng cộng 13/16 khoá đổi (0.3, 1.1, 1.3, 1.4, 2.1, 2.2, 2.3, 2.4, 3.1, 3.2, 3.3, 3.4, 4.1); 0.1, 0.2 và 1.2 giữ ("làm sáng mọi phương trời" trùng đúng bản dịch của vv9 và thag10.3 cho cùng Pāli sabbā obhāsate disā). Không có khoá trùng nguyên văn trong chính bài.
  - Điểm: các điểm cũ (9.22) được ghi cho bản có nhiều lỗi nghĩa nên không phản ánh bản cũ; sau khi sửa, bản hiện tại đạt đúng mức điểm đó nhưng không cao hơn, nên giữ nguyên từng tiêu chí và final_score 9.22. triangulation giữ 7.0 vì không có tầng English hay Việt hiện hành độc lập. Bất định còn lại rất nhỏ: dung sắc ở 2.3 (vaṇṇo) có thể gồm cả sắc vàng của thân lẫn khuôn mặt heo; "kẻ miệng heo" ở 3.4 giữ sát Pāli sūkaramukho mà không thêm "ngạ quỷ". Bốn lệnh npm run validate, npm test, npm run check, npm run build chưa chạy ở lượt này nên technical_integrity vẫn là 9.6.
