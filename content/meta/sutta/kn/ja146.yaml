notes: |-
  Đủ 9/9 khóa. samudda → biển, kāka → con quạ (có tiền lệ kn); tên bài Kinh
  Quạ Biển là đặt mới. hanukā santā → hàm mỏi rã rời; mukhaṁ parisussati →
  miệng khô khốc; pūrati eva mahodadhi → đại dương cứ đầy mãi.
  Hai bất định đã ghi nhận: api nu là tiểu từ nghi vấn, bản Việt đọc thành
  câu trần thuật tả cảnh kiệt sức (có thể là câu hỏi tu từ, chưa chắc); oraṁ
  āma na pārema đọc là kẹt lại bờ này không qua được bờ bên kia (ora là bờ
  này, pāra hàm ý từ pāreti). Chưa có bản Anh để đối chiếu nên giữ draft.
