notes: |-
  **Bài.** Maṭṭhakuṇḍalīpetavatthu (Chuyện Ngạ Quỷ Maṭṭhakuṇḍalī), bài 5 của Phẩm Ubbarī, Petavatthu: 88 khoá = 3 khoá tiêu đề `:0` + 21 nhóm kệ (`1.x`–`21.x`, mỗi nhóm 4 pāda, 21 × 4 = 84) + 1 khoá kết `22.1`. Cấu trúc đối thoại theo dấu nháy của chính Pāli: người cha hỏi (1, 3, 5), người trẻ đáp (2; 4 mở bằng một dòng dẫn truyện `4.1` không nháy, lời bắt đầu ở `4.2`; 6), người cha nói một mạch từ `7.1` đến `10.4` (Pāli chỉ đóng nháy ở `10.4`, các khoá `7.4`, `8.x`, `9.x` không có nháy), người cha hỏi vị thiên (11), vị thiên đáp (12), người cha hỏi nghiệp (13), vị thiên kể (14 mở nháy, chỉ đóng ở `15.4`), người cha thốt lên và quy y (16), vị thiên khuyên (17 mở nháy, đóng ở `18.4`), người cha đáp (19 mở nháy, chỉ đóng ở `21.4`). Bản Việt giữ đúng các chỗ Pāli không đóng nháy (`7.4`, `14.4`, `19.4`), không tự sửa. Nhóm kệ 1.1–21.4 trùng từng chữ với Vimānavatthu vv83 (84/84 khoá, sau khi bỏ dấu nháy và dấu cuối câu), và nhóm kệ 1–10 trùng phần lớn với Jātaka ja449; tên người cha và người con không có trong Pāli của bài này nên không đưa vào thân kinh.
  **Năm phép tự chạy (không dùng chốt cũ, vì bài ngắn nên chốt cũ có thể chạy rỗng).** (1) Tập khoá Việt so với Pāli: 88 = 88, thiếu 0, thừa 0, thứ tự khớp. (2) Nháy kép và nháy đơn khớp Pāli từng khoá: mẫu số 352 phép đếm (88 khoá × 4 loại dấu `“` `”` `‘` `’`), lệch 0; Pāli có 0 nháy đơn nên phần nháy đơn chạy rỗng. (3) Pāli trùng nguyên văn trong chính bài: 1 nhóm (`12.4`/`15.4` `Tidasānaṁ sahabyataṁ gato”ti.`), dịch giống hệt; số cặp trùng trong chính bài mà Việt khác: 0. (4) Dấu lược: Pāli có `…` ở 0 khoá, Việt 0 khoá; không có `…pe…`, không có `(…)`, nên phép này chạy rỗng. (5) NFC 0 lỗi, khoá rỗng 0, khoảng trắng thừa 0, Pāli lọt sang Việt: chỉ các tên riêng và `Petavatthu`, `Ubbarivagga`, `Maṭṭhakuṇḍalī`. Khoá Pāli dài nhất 35 ký tự, 0 khoá đạt ngưỡng 40. Đã in cặp Pāli và Việt của cả 88 khoá ra đọc đối chiếu.
  **Số Pāli.** `pañca` (`17.3` `sikkhāya padāni pañca`) = năm; `pañcamaṁ` (`22.1`) = thứ năm, khớp `5.` ở `0.3`; `Tidasa` là tên nhóm chư thiên, không tính thành số (xem mục bất định). Không có `sahassa`, `sata`, `navuti` hay số lượng nào khác.
  **Chỉ mục Pāli sang Việt toàn tầng.** Dựng từ Pāli root của 5 bộ với các bản Việt đã có. Số khoá pv17 có Pāli trùng nguyên văn với khoá bài khác đã dịch: 32 khoá (105 cặp). Dùng lại nguyên văn: 6 khoá: `0.1` (37/37), `0.2` (5/5), `9.2` (pv8), `10.2` (pv8), `11.2` và `11.4` (vv62). Pāli trùng mà Việt cố ý khác: 26 khoá (57 cặp lệch), chia theo lý do. (a) Tiền lệ sai Pāli, Pāli thắng: `8.2` `ghatasittaṁva pāvakaṁ`, 5/6 cặp (ja352, ja372, ja410, ja449, pv8) dịch *như cành cây khô bị lửa thiêu đốt*, trong khi `ghata` là bơ lỏng, `sitta` là rưới, `pāvaka` là lửa, không có *cành cây khô*; chỉ ja454 đúng (*như lửa được rưới bơ lỏng*), nên theo ja454; `8.3` `vārinā viya osiñcaṁ`, 5/6 cặp *nước sóng vọt vào như vậy*, theo ja454 *như rưới nước lên*; `8.4` `daraṁ`, 4/6 cặp *kể cả kẻ khiếp sợ như tôi*, 1 *quá kinh khủng*, 1 (ja454) *nỗi bức bối*: `dara` là nỗi bức bối, không chỉ một người, theo ja454; `9.3` `sokaparetassa`, 3/6 cặp *kẻ đã gây nỗi buồn cho ta*, theo pv8 và ja454 *bị sầu muộn vây phủ*; `9.4` `puttasokaṁ apānudi`, 3/4 cặp *đẩy nỗi khó đau của người con ấy đi xa*, theo ja454 *xua đi nỗi sầu vì con* (và khuôn pv8:6.4); `10.1` `Svāhaṁ abbūḷhasallosmi`, 1 cặp trùng nguyên văn (pv8:7.1 *Giờ thì tôi đã hết nỗi khó đau của mình*, bỏ mất *mũi tên*; dạng `Sohaṁ` gần nhất ở ja352 và ja410 cũng dịch như vậy), theo ja372 *đã được rút mũi tên ra*, đổi *rút* thành *nhổ* cho khớp `9.1` (đo toàn tầng trên các dạng abbahī, abbūḷha: *nhổ* 36, *rút* 12). (b) Phần lớn các khoá còn lại thuộc ja449 (Pāli song song của nhóm 1–10): `1.1` `maṭṭhakuṇḍalī` ja449 hiểu là tên (*Maṭṭhakuṇḍalī xinh đẹp*), ở đây hiểu là tính từ chỉ người trẻ đang khóc (*hoa tai bóng loáng*); `1.2` ja449 *thoa son vàng khắp mình* thêm *son* mà Pāli không có (`haricandana` là chiên-đàn vàng, an5.194 *gỗ đàn hương vàng*), theo ja353 và ja358 dùng *chiên-đàn*; `2.2` ja449 *tấm vòm che* (1 tiền lệ) đổi thành *khung xe*; `4.3`, `5.2`, `5.3`, `6.1`, `7.1`–`7.3`, `10.4`: cùng nghĩa, đổi xưng hô (ja449 dùng *ngươi/ta/tao*, ở đây *cậu/tôi* theo ngữ cảnh người cha lịch sự hỏi người trẻ), `7.3` và `7.4` bỏ cách hiểu *thèm vầng trăng đã khuất cho tới ngày tận thế* vì Pāli không có *tận thế* và `abhipatthayiṁ` là thì quá khứ; (c) `10.3`: Pāli trùng 6/6, Việt giống chữ *tôi không sầu, không khóc* chỉ khác chữ hoa đầu vì dòng nối tiếp; (d) `19.1`–`19.3` theo pv46:2.1–2.3, đổi *yêu quái/ngươi/ta* thành *dạ-xoa/ngài/tôi* (xem thuật ngữ). Năm khoá ja ngoài lát (ja352:5.2, ja372:5.2, ja410:7.2, ja449:8.2, pv8:5.2) mang cùng lỗi `ghatasittaṁva pāvakaṁ`, kèm ja352:5.3, ja372:5.3, ja410:7.3, ja449:8.3, pv8:5.3 và các khoá `daraṁ`; báo để người biên tập xử, không sửa.
  **Thuật ngữ, kèm số đếm (căn theo Pāli).** `sikkhāpada` → *học giới* (123 khoá, so với *điều học* 4): `sikkhāya padāni` ở `17.3` là hai từ rời, 0 tiền lệ đúng cụm, nên theo `sikkhāpada` thành *năm học giới*; `abbahī`/`abbūḷha` → *nhổ* (36, so với *rút* 12); `tidasa` → *Tam Thập* (21, so với *Ba Mươi Ba* 8; chọn dạng sát nghĩa gốc *ba mươi*, không thêm *ba*); `yakkha` → *dạ-xoa* (190, so với *yêu quái* 7 và *dạ xoa* 14); `sugata` → *Thiện Thệ* (387); `tathāgata` → *Như Lai* (2.022); `pasannacitta` → *tịnh tín* (126, so với *thanh tịnh* 23); `añjali` → *chắp tay* (244); `devaloka` → *cõi trời* (26); `anomapañña` → *trí tuệ vô song* (2, so với *không thấp kém* 1); `ācariya` → *thầy* (261); `uposathakamma` → *thực hành Bố-tát* (3 khoá mil6.3.3 và mil6.3.4 dùng *thực hành*, chỉ mil6.3.4:9.2 có *Bố-tát*; không có tiền lệ nào khác); `lohitaka` → *hồng ngọc*, theo `lohitaṅka` ở dn17 (21 khoá *hồng ngọc*; *san hô* 10 khoá thuộc từ khác); `maṇi` → *ngọc báu* (ja449:3.1); `māṇava` → *thanh niên* (179 khoá có `māṇava,`); `kālakata` → *đã qua đời* (ja318, ja461, pv23); `gandhabba`, `sakko purindado` theo vv62:2.1–2.2 (*càn-thát-bà*, *Sakka Đấng Phá Thành*); `abbahī` ở đây khác pv8 chỉ ở đại từ (*cậu* thay *người*). Tên bài `Maṭṭhakuṇḍalīpetavatthu` → *Chuyện Ngạ Quỷ Maṭṭhakuṇḍalī*, theo khuôn pv16 *Chuyện Ngạ Quỷ Nandā* và pv31 *Chuyện Ngạ Quỷ Seriṇī* (tên người giữ Pāli); `22.1` theo khuôn pv16:19.1 `<tiêu đề>, thứ N.`. `translationTitle` không có số đầu theo đa số các bài `pv` đã có; thân kinh `0.3` giữ `5.` vì Pāli có.
  **Cách xưng hô, đo từ chính bài.** Người cha gọi người trẻ là *cậu* và tự xưng *tôi* trước khi biết thân phận; sau khi người trẻ nói mình đã sinh lên cõi trời, người cha gọi *ngài* (khớp vv62:2.1–2.4 *Ngài là chư thiên…*). Vị thiên gọi người cha là *ông*. `3.3` `bhaddamāṇava` dịch *này thanh niên tốt lành*.
  **Coverage English, mẫu số bằng 0.** Công thức `source/layers.yaml`: Pāli có nội dung từ 40 ký tự trở lên, bỏ khối `:0`; pv17 có 0 khoá như vậy (dài nhất 35), nên Sujato phủ 0/0 và cổng không đo được gì (không phải *không cần ghi nhận*). Tầng `english-sujato` vắng toàn bộ `pv` ở commit đã ghim (kn chỉ có 9 sub-collection cp, dhp, iti, ja, kp, snp, thag, thig, ud = 755 tệp), `english-project` vắng (không có tệp dịch lẫn tệp metadata cho pv17), `vietnamese-current` bilara chỉ có Pháp Cú nên vắng. Pāli song song vv83 và ja449 cùng các bản Việt đã có của ja449, ja454, pv8 là tầng Việt của dự án, không phải bản English độc lập, nên không tuyên bố đã đối chiếu English hay Việt hiện hành theo từng khoá; chúng chỉ được dùng để đo tiền lệ và dò lỗi.
  **BẤT ĐỊNH ghi lại, không thêm vào thân kinh.** (1) `1.1` `maṭṭhakuṇḍalī`: đọc là tính từ *hoa tai bóng loáng* (maṭṭha là nhẵn bóng); ja449 hiểu là tên; có thể vừa là tính từ vừa là tên gọi, và tên bài giữ Pāli. (2) `2.2` `rathapañjara`: dịch *khung xe*; chỉ 1 tiền lệ (ja449 *tấm vòm che*), mil3.1.1 kê `rathapañjara` cạnh trục và bánh nhưng chưa có bản Việt; nghĩa chặt hơn là thân hay thùng xe. (3) `2.4` `jahāmi jīvitaṁ`: *tôi đang bỏ mạng sống*, thì hiện tại, không diễn thành *không thèm sống nữa*. (4) `3.2` `lohitaka` dịch *hồng ngọc*, loại đá chưa chắc. (5) `4.2`–`4.4` và `6.1`–`6.2`: Pāli không nói mặt trăng và mặt trời là *cặp bánh xe*, nên bản Việt không nói; `6.2` `vaṇṇadhātu ubhayattha vīthiyā` dịch *ánh sắc rạng rỡ ở cả hai lối đi*, 0 tiền lệ đúng cụm (ja449 *mặt trời soi sáng hai bên con đường* thêm ý). (6) `7.4` `abhipatthayiṁ` là quá khứ ngôi thứ nhất (*tôi đã mong cầu*), khác dạng `abhipatthaye` của ja449; `peto` ở `6.3`, `7.4` dịch *người đã khuất* (người chết), không phải ngạ quỷ. (7) `8.3`–`8.4` `osiñcaṁ`, `nibbāpaye`: chủ ngữ hiểu là người trẻ (*cậu*) theo `9.1`, `9.4`; `nibbāpaye` là dạng nguyện cách, đọc như việc đã hoàn tất vì `10.1`–`10.2` nói đã mát lạnh. (8) `14.2` `āturarūpomhi`: dịch *đang ở trong cảnh bệnh tật*, hiểu `rūpa` là tình trạng. (9) `14.3` `vigatarajaṁ`: *đã lìa bụi nhơ*; vv21 *đã lìa xa rối loạn* (1 tiền lệ) không khớp nghĩa `raja` là bụi nhơ. (10) `15.3` `Tāhaṁ`: có thể là `taṁ ahaṁ` hay `so ahaṁ`; dịch *sau khi làm nghiệp thiện ấy* không đổi nghĩa. (11) `16.2` `añjalikammassa` dịch *việc chắp tay*; vv5 và vv78 (2 tiền lệ) viết *nghiệp cúi chắp tay*, ở đây bỏ *cúi* vì Pāli không có. (12) `17.4` `akhaṇḍaphullāni`: *không sứt mẻ, tươi nở*; `phulla` nghĩa gốc là nở hoa. (13) `18.3`, `21.3` `amajjapo`: *chớ uống rượu*, tức không là người uống `majja`. (14) `20.3` `naradeva`: *vị Trời giữa loài người*, hiểu là Đức Phật, theo cách đọc quen thuộc, tha-ap80 dịch *Thiên Nhân Tôn* (1 tiền lệ); Pāli ở đây không nêu tên. (15) `tidasa`: *Tam Thập* theo đa số 21/29; vv18, vv35, vv41, vv65 và ja391 dùng *Ba Mươi Ba*, không lẫn với `Tāvatiṁsa`. (16) `19.2` `devate` dịch *hỡi vị thiên* (hô cách giống cái của `devatā`), không đổi thành *chư thiên* số nhiều. (17) `4.1` `tassa` dịch *ông ấy* (người cha), Pāli không nêu tên.
  **Lỗi bản nháp đã bắt.** Bản nháp đầu dịch `4.1` là *nói với ông* làm người đọc có thể hiểu nhầm người nói; sửa thành *ông ấy*. Bản nháp thêm *đây* ở `12.3` (không có trong Pāli) và dịch `6.2` là *sắc sáng* (tối nghĩa); đã sửa. Phép đối chiếu nháy từng khoá không phát hiện lệch (0/352) vì đã dò bản Pāli trước khi viết. Một số tiền lệ tầng (ghatasittaṁva pāvakaṁ, daraṁ, sokaparetassa) sai Pāli nên không chép.
  **Cổng kỹ thuật chưa chạy trong lượt này, ghi để không tuyên bố technical gate pass:** `npm run validate`; `npm test`; `npm run check`; `npm run build`. Không chạy `npm run audit:*` hay `npm run reference:gaps`; vì thế `technical_integrity` đặt 9.6, không cao hơn.
