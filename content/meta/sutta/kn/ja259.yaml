notes: |-
  LÁT NÀY KHÔNG CÓ TẦNG THAM KHẢO NÀO, ĐÃ ĐẾM KHÔNG SUY. Với mười ba bài Jātaka này:
  source/upstream-manifest.json tại commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639 ghi tầng translation/en/sujato có 4.291
  tệp, trong đó thư mục sutta/kn/ja/ chỉ có 83 tệp, không có tệp nào chứa khoá của bài này; hàm
  upstreamPublishes của kho trả false cho cả mười ba, tức SuttaCentral không phát hành bản Anh nào
  phủ chúng. Tầng translation/vi/phantuananh tại cùng commit chỉ có đúng 26 tệp và toàn bộ là Pháp Cú
  (dhp1-20 … dhp383-423), nên KHÔNG có bản Hòa thượng Thích Minh Châu cho bất kỳ bài Jātaka nào ở đây —
  đây là đặc điểm của bản chụp upstream đã ghi ở chính source/layers.yaml, không phải thiếu sót của
  kho, và cũng không phải lý do để tôi né việc chấm điểm. Bài chỉ đối chiếu được với Pāli root một
  mình, nên triangulation chấm thấp và bài đặt draft.

  COVERAGE KHÔNG PHẢI LÝ DO BLOCK, VÀ TÔI ĐÃ TÍNH LẠI CHO ĐÚNG. Trong mười ba bài này mọi vế kệ
  Jātaka đều ngắn hơn ngưỡng 40 ký tự khai ở source/layers.yaml, và mọi khoá tiêu đề nằm trong khối
  tham chiếu, nên substantiveSegments = 0. Hàm englishCoverageFor trả ratio = 1 khi
  substantiveSegments = 0, và cả validate lẫn tests/unit/translation-store.test.ts đều bỏ qua bài có
  substantiveSegments = 0. Tôi đã chạy hàm đó cho cả mười ba: đều ratio 1.000. Vì vậy tôi KHÔNG ghi
  blocker coverage dưới ngưỡng — ghi thì sẽ là một lỗi đo sai. Blocker thật, duy nhất, là mất hẳn
  tầng tham khảo English.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt mặc định chỉ quét khoá Pāli từ 40
  ký tự trở lên; ở Jātaka mọi vế kệ đều ngắn hơn ngưỡng đó nên phần chốt đó về bản chất KHÔNG chạy.
  Tôi tự quét lại toàn bộ 238 khoá của lát bằng script riêng, đọc thẳng từ tệp đã ghi trên đĩa:
  đủ khoá và không thừa so với Pāli gốc, không rỗng, chuỗi NFC, số dấu lược khớp TỪNG KHOÁ (Pāli có
  …pe… thì Việt đúng một …, Pāli không có thì Việt không có), không có (…) đứng một mình, vị trí
  ngoặc kép mở và đóng khớp PĀLI TỪNG KHOÁ (không chỉ tổng số trên cả bài), ngoặc kép cân trên
  cả bài, không chữ phiên tự, không còn sót thẻ chữ Pāli. Kết quả 0 lỗi trên 238 khoá / 14 bài.

  TÊN PHẨM, ĐÃ ĐO THEO BẢNG CHỐT VÀ THEO TẦNG. Tikanipāta → Bộ Ba Bài Kinh: đếm trên toàn tầng
  Việt TRƯỚC khi lát này ghi, đã có 24 tệp Jātaka và 15 tệp thag3/thig3 dùng đúng cách này, và KHÔNG
  tệp Jātaka nào dùng cách khác; cách Phẩm Ba Pháp chỉ do 50 tệp iti50..iti99 dùng mà tôi không đụng
  tới. Sau khi lát này ghi, con số Jātaka là 37/37. Tôi theo đa số TRONG CHÍNH TÁC PHẨM ĐANG LÀM theo
  BRIEF_VI3 §11, và cũng vì nó khớp song song với hai mục đã chốt là Bộ Một Bài Kinh và Bộ Hai Bài
  Kinh. Người điều phối gộp có thể muốn thống nhất cả tầng iti sau này, nhưng đó không thuộc lát này.
  Saṅkappavagga → Phẩm Suy Nghĩ (trước lát này 7 tệp, không lệch; sau đó 8); Padumavagga → Phẩm Bông
  Sen (trước 1 tệp, không lệch; sau đó 9, và cả chín tệp trong phẩm đều giống nhau); Udapānavagga →
  Phẩm Nước Uống (trước 4 tệp, không lệch; sau đó 8). Dấu uddāna: trước lát này đã đếm 22 tệp có
  dạng Kinh <tên>, thứ <từ>. và 3 tệp không có dấu phẩy; tôi dùng dạng có dấu phẩy, và đã kiểm
  bằng script rằng số thứ tự trong uddāna khớp số đứng trước mặt trong 0.4 của cùng phẩm, không suy
  từ tên uid.

  PĀLI TRÙNG NGUYÊN VĂN, ĐÃ DỰNG CHỈ MỤC BẰNG SCRIPT VÀ ĐÃ DÙNG LẠI. Tôi nạp 5.764 tệp Pāli
  gốc trong cache (bỏ mọi thư mục *.apfs-orphan) và 4.038 tệp Việt dự án, ghép theo khoá, rồi so
  TRÙNG NGUYÊN VĂN có chuẩn hoá hoa thường, khoảng trắng và dấu câu biên. Riêng lát này: 102 khoá
  trùng ở nơi khác; 52 khoá trùng đó đã có bản Việt ở bài khác, và tôi DÙNG LẠI NGUYÊN VĂN 51 khoá
  (39 khoá tiêu đề, 12 khoá thân kệ). Một khoá trong 52 là ngoại lệ có chủ ý: ja264:3.1 trùng nguyên
  văn với sn1.50:11.1, nhưng bản Việt đã có mở ngoặc kép ở đầu khoá trong khi Pāli khoá này không mở,
  nên tôi chép phần chữ và bỏ ngoặc kép thay vì chép y nguyên. Ngoài ra có 8 cả ván bốn vế trùng nguyên
  văn ở bài khác, và cả tám đều chưa có bản Việt để mượn. Trong lát này có 3 khoá trùng
  nguyên văn, đều là ba vế mở đầu lặp lại trong ja265; tôi đã dùng lại đúng một cách dịch cho cả
  hai lần, và script tự kiểm bắt được chỗ lệch nếu có.

  TÊN RIÊNG CÓ DẤU PĀLI, CỐ Ý GIỮ, KHÔNG BỎ DẤU. Jātaka, Tikanipāta, Sakka, Panāda, Missībhāvitthi,
  kāḷi, Jātavedas, Gāṅgā, Yamunā, Kassapa — tất cả giữ đúng dấu Pāli như tầng đang làm; tôi không
  bỏ dấu ở bất kỳ tên nào, kể cả tên không có bản Việt nào để đối chiếu.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  STATUS. Có một blocking error thật (thiếu hẳn tầng tham khảo English Sujato tại commit đã ghim), nên
  bài đặt draft bất kể final_score. Tôi không nâng điểm để né blocker, và cũng không hạ điểm để tỏ ra
  thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có
  tầng tham khảo nào.

  RIÊNG BÀI NÀY, NHỮNG CHỖ TÔI KHÔNG CHẮC VÀ ĐÃ GHI. (1) Tên bài Tirīṭavacchajātaka: tirīṭa có hai
  nghĩa — nước trong đã lọc, và bùn nhão. Vì câu kệ có con hạc đối đáp với con cua trong bùn, tôi
  chọn nghĩa bùn và dịch tên là Kinh Hạc Vùng Bùn; nếu người biên tập chọn nghĩa kia thì tên sẽ là
  Kinh Hạc Lọc Nước, còn 17 khoá thân kệ không phải sửa. (2) 1.4 tedaṇḍiko bhuñjati aggapiṇḍaṁ:
  tôi dịch là khối than cháy nuốt chửng hắn, tức cái xác bị nướng; nhưng câu 2 của bài nói người nói
  không có sức và bị bỏ một mình nơi trống trải, nên cũng có thể tedaṇḍika là bản thân người nói.
  Tôi giữ cách đọc thứ nhất vì nó khớp với hành động. (3) 2.2 Ekassa katvā vivanasmi ghore là
  chỗ tôi đọc yếu nhất lát này: tôi dịch là đã bị bỏ một mình giữa nơi trống trải đáng sợ, lấy
  vivanasmi ghore là nơi trống trải đáng sợ và Ekassa katvā là bị bỏ một mình; cũng có thể Ekassa
  katvā nghĩa là đã làm một việc, thì câu phải hiểu khác. Tôi không bịa thêm chi tiết nào để làm câu
  trôi. (4) 3.2 Vesāyino visayā jīvaloke: tôi dịch là hỡi những kẻ đi lang thang, hỡi cõi các loài
  sống, giữ cả hai cụm như hai tế từ; nhưng có thể visayā jīvaloke chỉ là một tế từ (cõi các loài
  sống), thì câu sẽ ngắn hơn. (5) 3.1 và 3.3 đổi xưng: 3.1 nói hắn, 3.3 nói ngươi; tôi giữ đúng
  sự đổi đó vì Pāli đổi (hắn rồi ngươi), không tự thống nhất.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 14 khoá chênh lệch lớn nhất → khác nghĩa 12: sửa 13 khoá (12 trong tệp chênh lệch, thêm `1.2` khi đọc cả bài): tên bài `0.4` và `4.1` "Kinh Hạc Vùng Bùn" → "Kinh Tirīṭavaccha" (`tirīṭa` là vỏ cây, tầng Pāli ghim có 10 khoá liệt kê `tirīṭānipi dhāreti` giữa các loại y vỏ cây (dn8:14.11, dn25:8.9, mn12:45.7, mn45:5.8, mn51:8.7, mn94:10.8, an3.93:2.1, an3.156:4.1, an4.198:4.1, mnd15:69.2), bản Việt dịch là vỏ cây; `tedaṇḍika` là người mang ba cây gậy, `tha-ap411:10.3`; bản cũ đọc `tirīṭa` là "bùn" rồi bịa ra con hạc và con cua, trong Pāli không có chữ nào nói tới hạc); `1.1` "Ta chẳng biết gì cả về hắn" → "Người này chẳng có chút gì do học vấn mà thành" (`vijjāmaya`, `imassa` là của người này); `1.2` "hắn cũng chẳng phải bạn của ta" → "chẳng phải thân quyến, cũng chẳng phải bạn của ngài" (`bandhavo` là thân quyến, `te` là "của ngươi", không phải "của ta"); `1.3`–`1.4` "khối than cháy ấy nuốt chửng hắn" → "người mang ba cây gậy, lại được ăn phần cơm đầu tiên?" (`tedaṇḍiko bhuñjati aggapiṇḍaṁ`; bản cũ bịa ra cái xác bị nướng); `2.1`–`2.4` bản cũ đảo vai (người chạy trốn tự vươn tay, "đầy khổ đau lẽo láo") → `yuddhaparājitassa` là bị thua trận, `pasārayī … pāṇiṁ` là vị kia đưa tay ra với người lâm nạn (`kicchagatassa` đồng cách với `me` ở `2.1`), `tenūdatāriṁ` là "nhờ đó ta vượt qua"; `3.1`–`3.4` "hỡi hạc, ngươi đã được lợi … sẽ dâng cho hắn của cải và món ngon nhất" → `lābhāraho` "xứng đáng được lợi lộc", `dethassa` và `yajatha` là hai mệnh lệnh số nhiều "hãy cho vị ấy của cải, và hãy cử hành lễ tế"; giữ 1 (`0.3` "Phẩm Suy Nghĩ": tầng có 9 khoá `Saṅkappavagga` cùng cách, bản mù "Phẩm Tư Duy" chỉ khác diễn đạt); bất định 3, không phân xử được bằng Pāli và tầng ghim: `2.2` `ekassa katvā` (đọc là "chỉ còn một mình", cũng có thể `katvā` có chủ ngữ khác), `3.2` `Vesāyino visayā jīvaloke` (bản cũ "hỡi những kẻ đi lang thang" không có căn cứ; đọc "từ cương vực của Vesāyin" là cách thận trọng, `Vesāyin` có thể là tên riêng hoặc hô ngữ, 0 chỗ khác trong tầng), `1.1` `vijjāmaya` (0 tiền lệ). Người nói suy ra từ `te` ở `1.2` và `tāta` cùng hai mệnh lệnh số nhiều ở `3.3`–`3.4`: `1.1`–`1.4` là lời một người nói với vị vua, `2.1`–`3.4` là lời vị vua; không chắc. Các nhận định (1), (2) và (4) trong phần "RIÊNG BÀI NÀY" ở trên thuộc bản cũ và bị mục này thay thế (tên bài, cách đọc `tedaṇḍiko` và `Vesāyino visayā`). Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài, không có
  đoạn song song trùng nguyên văn; tiền lệ aggapiṇḍa ở mn5:15.2, mn99:19.6): sửa 3 khoá: 1.4 aggapiṇḍa
  "phần cơm đầu tiên" → "món ăn thượng hạng" (sai nghĩa: agga ở đây là tốt nhất, không phải thứ tự
  thời gian; tầng dịch aggapiṇḍa là thức ăn tốt nhất / món ăn thượng hạng); 2.4 "nhờ đó ta đã vượt
  qua, dù khổ đau bao trùm" → "nhờ đó ta, kẻ bị khổ đau bao trùm, đã vượt qua" (dukhasampareto là
  trạng thái của chủ ngữ, Pāli không có quan hệ nhượng bộ "dù"); 3.3 tāta "này con" → "này các con" vì
  hai mệnh lệnh 3.4 dethassa, yajatha là số nhiều. Bất định 2.2, 3.2, 1.1 giữ như đã ghi.

  Quyết định hội đồng biên tập 2026-10-16: C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").

  Nghiên cứu nguồn ngoài 2026-10-16: Rouse (Cowell chủ biên, PTS 1897),
  https://obo.genaud.net/dhamma-vinaya/pts/kd/jat/jat.2/jat.2.259.rous.pts.htm; Ānandajoti, bản dịch
  kệ và chú giải Jātaka,
  https://ancient-buddhist-texts.net/Texts-and-Translations/Jatakagathavannana/259.htm; đã đối chiếu
  1.1–1.4, 2.1–2.4, 3.1–3.4; sửa không có khoá nào; bất định 3.2 `Vesāyino visayā`: chú giải cho
  `vesāyī` là Yama (vua cõi chết), bản Việt giữ tên "Vesāyin"; 1.1 `vijjāmaya`: chú giải coi `maya` là
  chữ đệm.

  Nguồn thứ hai 2026-10-16: Bhikkhu Indacanda, Tam Tạng song ngữ Pāli–Việt tập 32 (Jātakapāḷi I,
  Buddhist Cultural Centre, Sri Lanka, 2016; bản dịch Việt độc lập của các kệ, không phải bản
  nguyên bài; không có tuyên bố giấy phép máy đọc nên NOASSERTION; chỉ dùng làm bằng chứng nghĩa,
  không chép câu nào), https://tamtangpaliviet.net/TTPV/32_Ja_I.pdf, kệ 382–384; đối chiếu 16/17
  khoá (bỏ 0.1); KHỚP 14, LỆCH-THẬT 0, NGUỒN-LỆCH 2. NGUỒN-LỆCH: `3.2` `Vesāyino visayā` —
  Indacanda "khỏi phạm vi của Thần Chết", bản này giữ tên `Vesāyin` (chú giải Jātaka nói `Vesāyī`
  là Yama; để thành chú thích, không thêm vào thân kinh); `3.3` `tāta` — Indacanda "Này con" số
  ít, bản này "này các con" vì `dethassa`, `yajatha` là mệnh lệnh số nhiều. Các khoá `1.1`–`2.4`,
  `3.1`, `3.4` khớp (`āpāsu` "cảnh hiểm nghèo", "chỉ còn một mình", "đã đưa tay ra", "vượt lên",
  `tedaṇḍika` ba cây gậy). triangulation 8,8→9,2 (8,8 + 0,6 × 16/17 = 9,36, chặn ở 9,2).

  Rà từng chữ bằng DPD 2026-10-16: 17 khoá đã rà; sửa 3.3 (`tāta` hô cách số ít: chú giải CST `rājā
  puttaṁ āmantetvā: Tāta…`, còn `dethassa`, `yajatha` số nhiều vì vua bảo cả con, quan và dân `tvañca
  amaccā ca nāgarā cāti sabbe pi tumhe`,
  https://ancient-buddhist-texts.net/Buddhist-Texts/K10-JA/259.htm; Indacanda "Này con" → "này con";
  căn cứ mới so với lượt 2026-10-15); bất định 2.2 (`katvā` chưa có tương ứng; chú giải `anukampaṁ
  karitvā`, thêm "thương xót" là theo chú giải nên không đưa vào lời kinh).
