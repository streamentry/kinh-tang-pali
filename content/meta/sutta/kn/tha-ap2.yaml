notes: |-
  Dịch từ Pāli root tại commit đã ghim; đủ 237 khoá, thứ tự và tập khoá khớp Pāli, không có khoá ngoài Pāli. Bài không có bản Anh Sujato, không có bản Việt phân đoạn và chưa có lớp english-project, nên không có đối chiếu English độc lập theo tầng; bản dịch dựa trên Pāli, tiền lệ cùng tầng và hai tham chiếu phụ nêu ở mục Coverage English.

  Tên bài và tên phẩm. 0.3 và translationTitle là cùng một chuỗi, Bài Kệ Tuyên Ngôn Về Các Vị Phật Độc Giác. Pāli ở 0.3 (Paccekabuddhaapadāna) không bắt đầu bằng số nên bản Việt không thêm số thứ tự. Kiểu mở đầu tên: đo ở phạm vi gần (tha-ap1 đến tha-ap60 đã có) là Bài Kệ Tuyên Ngôn 29, Bài Kệ Tuyên Ngợ 18, Bài Kệ Tuyên Ngợi 2, Ký Sự Về 3; đo toàn nhóm tha-ap đã có (501 tệp) là Bài Kệ Tuyên Ngợ 241, Bài Kệ Tuyên Ngôn 132, Ký Sự Về 111, Bài Kệ Tuyên Ngợi 10, Kinh Kệ 5. Hai phạm vi cho hai đa số khác nhau: bài này theo đa số gần (Tuyên Ngôn), vì Tuyên Ngợ là chính tả sai; cần người biên tập phán một lượt cho cả cuốn. 0.1 giữ Therāpadāna (490 trên 501 tệp). 0.2 là Phẩm Phật, theo 8 tệp tha-ap cùng Pāli Buddhavagga (Phẩm Đức Phật 17 khoá là các bài mil, không cùng nhóm). 1.1 theo thi-ap1:2.1 (Bây giờ, hãy lắng nghe …), số ít vì Pāli là paccekabuddhāpadānaṁ. 60.1 đọc lại tên bài ở 0.3 rồi thêm đã hoàn tất, theo tha-ap563:23.1 (Therāpadāna đã hoàn tất). Dấu ti ở 59.4 bỏ và để dấu chấm trong ngoặc: toàn tầng Pāli kết ”ti. có bản Việt kết .” là 8.764 khoá, kết ”. là 1.517 khoá.

  Số Pāli: cātuddiso (17.1) là catu 4 nên bốn phương; pañcāvaraṇāni (41.1) là pañca 5 nên năm chướng ngại; duve (23.3) là hai; dutīyena (24.1) là người thứ hai; eko là một mình, khaggavisāṇa là một sừng. Không có cụm Tiṁsakappasahassa, sahassa hay sata trong bài nên không có bất định về số lớn. Bài không có lời thọ ký về số kiếp (không có kappe hay bhavissati): các khoá 2–8 và 51–59 là lời Đức Phật trả lời câu hỏi của Tôn giả Ānanda (3.2 nêu rõ Ānanda, vedehamunī ở 2.2 theo sn16.10 dịch là bậc hiền giả xứ Videha) và dùng thì hiện tại hay quá khứ đúng như Pāli.

  Dấu lược: Pāli không có … hay (…) ở khoá nào nên bản Việt cũng không có. Nháy: Pāli mở ngoặc kép ở 2.1 và đóng ở 59.4; nháy đơn mở ở 2.3 và đóng ở 2.4, mở ở 3.3 và đóng ở 6.4, đóng lẻ ở 10.4, mở ở x.1 và đóng ở x.4 của mỗi khổ 11 đến 50; bản Việt khớp Pāli từng khoá với bốn loại dấu, 0 lệch trên 237 khoá (mẫu số 237).

  Tái dùng tầng: 76 khoá có Pāli trùng nguyên văn với các bài khác (616 cặp); 63 khoá giống ít nhất một bản đã có, 13 khoá khác có chủ ý (54 cặp có bản Việt khác). Lý do từng nhóm: 9.1 và 10.1 chúng sinh thay loài hữu tình (snp1.3:1.1 dùng chúng sinh, 1 cặp snp2.14:20.3 là cặp duy nhất); 20.2 và 21.2 bỏ chú tâm vì Pāli chỉ có sādhuvihāri và dhīra (hai ý), các bản đã có thêm ý thứ ba; 23.2 con trai người thợ rèn (kammāraputta: 49 khoá có Pāli này, 45 khoá dịch thợ rèn, 3 khoá thợ khác; thợ vàng không có trong Pāli); 23.3 cánh tay (bhuja) thay cổ tay; 24.2 xem mục bất định; 25.2 đủ mọi hình thức thay khác lạ (virūparūpena); 26.2 mũi tên thay mũi lao (salla: 243 khoá có Pāli này, 97 khoá mũi tên, 1 khoá mũi lao, 7 khoá mũi khác); 28.2 dịch đúng dòng của mình vì snp1.3:19.1 và 19.2 bị lệch một dòng; 29.3 lời của thay lời dạy (vaco); 30.2 sự chắc chắn thay chánh định (niyāma); 48.2 bỏ không gián đoạn vì Pāli không có. Khoá 47.3 theo thag2.11 và sn6.13 (trú xứ xa vắng), không theo snp1.3. Pāli trùng trong chính bài: 9.1 với 10.1, 9.2 với 10.2, và dòng điệp Eko care khaggavisāṇakappo’. ở 39 khoá (10.4, 11.4 đến 19.4, 22.4 đến 50.4); mọi nhóm có bản Việt giống hệt nhau, 0 cặp có bản Việt khác (9.4 khác Pāli ở chỗ không có nháy đóng nên bản Việt cũng không có). Dòng điệp dùng lại đúng cách dịch đã có ở 39 khoá của snp1.3 (Hãy sống một mình như tê giác một sừng); 21.4 là voi chúa giữa rừng theo snp1.3:12.4.

  Thuật ngữ và số đếm. Phật Độc Giác: toàn tầng Độc Giác Phật 24 lần ở 5 bài (cộng 2 lần Độc giác Phật), Phật Độc Giác 4 lần ở 3 bài, bậc Độc Giác 20 lần ở 7 bài; ở phạm vi gần (nhóm tha-ap) chỉ có Phật Độc Giác (tha-ap12, tha-ap358) và bậc Độc Giác (tha-ap370, tha-ap371), nên bài này theo Phật Độc Giác. Hai phạm vi cho hai đa số khác nhau, cần người biên tập phán một lượt. Đại Mâu-ni cho mahāmuni (59 khoá có Pāli này: 40 khoá Đại Mâu-ni, 7 Đại Ẩn Sĩ, 3 Đại Hiền, 9 khác); Đại Ẩn Sĩ cho mahesi (91 khoá: 69 Đại Ẩn Sĩ, 2 Đại Mâu-ni, 20 khác) và mahāisi (10 khoá, cả 10 là Đại Ẩn Sĩ). Bậc Tự Tại cho sayambhū (85 khoá: 64 Tự Tại, 21 khác). Bậc Toàn Tri cho sabbaññū. Đệ tử cho sāvaka, kiết sử cho saṁyojana, chúng sinh cho bhūta, yêu mến cho sneha (dùng nhất quán ở 11.1 đến 11.3 và 41.3), vợ cho dāra (13.2 và 35.1). Giữ hoa thành Pāli: koviḷāra (19.2) và pārichatta (39.2) là tên cây, giữ nguyên như snp1.3.

  Bất định (không thêm vào thân kinh). (1) 8.3 jiya phanditāni: jiya đọc là dạng gerund của ji (thắng), như abhivijiya trong tầng (đã chiến thắng những dao động); cách đọc khác là jiyā dây cung (dao động như dây cung rung), 0 tiền lệ cho cả cụm. (2) 54.3 parattha idha: đọc là ở đời sau và ở đời này; cách đọc khác là para-attha (vì lợi ích người khác) rồi idha (ở đây). (3) 54.4 hitāme và 55.4 satatappitāme: đọc là hitā me (lượt cải thiện 2026-10-11 đổi từ thân ái đối với ta sang đem lại lợi ích cho ta, bám nghĩa hita theo glossary) và satataṁ appitā me (luôn được ta quý mến); hai dòng này có thể là cặp song song và hướng nghĩa chưa chắc đồng nhất; appita không có tiền lệ Việt; bản Việt toàn văn tham khảo hiểu cả hai là được quý trọng. (4) 54.2 paccantasattesu patippacārā: paccanta là biên địa, patippacārā đọc là đi lại; không có tiền lệ cho patippacāra. (5) 59.2 vikubbitāni: dịch trung tính là những biểu hiện (không là thần thông hay lời kệ); không có tiền lệ cho vikubbita. (6) 59.3 saṁvegasaṅgamativaḍḍhanatthaṁ: đọc là saṁvega, asaṅga, ati-mati (niềm xúc động, sự không dính mắc, trí tuệ vượt bậc); cách tách khác chưa loại trừ được. (7) 24.1 và 24.2 evaṁ dutīyena sahā mamassa, vācābhilāpo abhisajjanā vā: đọc là chuyện trò hoặc sự vướng mắc; snp1.3:15.1 và 15.2 dịch lời nịnh hót hoặc lời xúc phạm (theo cách đọc abhisajjanā là chửi rủa trong bản Anh Sujato). Bài này khác snp1.3 vì abhilāpa là lời nói chứ không là nịnh hót; cần người biên tập phán một lượt cho cả hai bài. (8) 39.2 sañchannapatto (ngược với 19.2 sañchinnapatto): giữ như snp1.3:30.2 là lá rụng của cây pārichatta, dù channa nghĩa đen là phủ kín. (9) 51.4 vijaññā đọc là thức tuỳ nguyện (nên nhận biết); cách đọc khác là danh từ (bậc hiểu biết). (10) 19.2 và 39.2 koviḷāra, pārichatta chỉ dịch giữ nguyên tên cây. (11) 3.1 và 5.4: mahesi dịch Đại Ẩn Sĩ, mahāmuni dịch Đại Mâu-ni theo tiền lệ tầng. (12) 17.1 cātuddiso: giữ an nhiên khắp bốn phương theo snp1.3:8.1, nghĩa đen là một người cho bốn phương.

  Coverage English: mẫu số là 0 khoá (mọi khoá Pāli đều dưới ngưỡng 40 ký tự, dài nhất 34 ký tự ở 1.1, hoặc là khối :0); cổng coverage không đo được gì ở bài này. english-sujato tại commit đã ghim chỉ có 9 nhóm cp, dhp, iti, ja, kp, snp, thag, thig, ud và không có tệp thân kinh tha-ap nào (tệp tha-ap duy nhất là tệp tên); vietnamese-current chỉ có Pháp Cú; english-project chưa có entry cho bài này. Tham chiếu phụ, không phải tầng: (a) các khổ 10 đến 50 (164 khoá) có Pāli trùng hoặc gần trùng snp1.3, trong đó 148 khoá trùng nguyên văn Pāli và 16 khoá dị bản chính tả hay sandhi; bản Anh Sujato của snp1.3 được đọc làm tham chiếu song song cho các khổ này, không tính vào coverage; (b) bản Việt toàn văn không phân đoạn (Bhikkhu Indacanda) dùng để tra cứu, không phải tầng store. Các khoá 2 đến 8 và 51 đến 59 (khoảng 100 khoá) không có tham chiếu English nào. content/meta/reference-gaps.yaml chưa có entry cho tha-ap2; vì mẫu số là 0 nên chưa cần ghi nhận gap, người điều phối vẫn cần chạy npm run reference:gaps.

  Lỗi ngoài lát (báo, không sửa): snp1.3:19.1 và 19.2 bị lệch một dòng (Việt ở 19.1 mang ý của Pāli 19.2, Việt ở 19.2 mang ý của Pāli 19.1); snp1.3:1.4 Pāli kết nháy kép đóng nhưng bản Việt không có.

  Cổng kỹ thuật chưa chạy (bị cấm trong lát này) nên technical_integrity đặt 9.6, người điều phối cần chạy: npm run validate, npm test, npm run check, npm run build.

  Lượt cải thiện 2026-10-11: đọc đối kháng lại cả 237 khoá và đo tiền lệ bằng số đếm trên toàn tầng; đổi 8 khoá, giữ nguyên tập khoá và thứ tự (237/237), nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch trên 237), NFC đạt, không có Pāli lọt vào bản Việt ngoài tên cây koviḷāra ở 19.2. Các khoá đổi: (1) 2.2 thêm Ngài sau đã hỏi: Pāli apucchi nhận Tathāgataṁ ở 2.1 làm tân ngữ, mà bản trước để 2.1 và 2.2 đứng cạnh nhau như hai danh xưng, người đọc có thể hiểu nhầm ai hỏi ai (sửa ngữ pháp; grammar_logic 8.8 sang 8.9). Cùng lỗi này còn ở tha-ap1:2.2, ngoài phạm vi lượt này. (2) 8.1 đối tượng của tham sang cơ sở của tham: vatthu đã dịch cơ sở ở 7.3 (virāgavatthu) trong cùng bài; toàn tầng, các khoá có Pāli kết bằng -vatthu: 106 khoá có cơ sở, 12 khoá nền tảng, 0 khoá đối tượng (sửa thuật ngữ; terminology 8.8 sang 8.9). (3) 41.2 ô nhiễm sang cấu uế cho upakkilese: toàn tầng 46 khoá có upakkilese, 34 khoá cấu uế, 5 khoá ô nhiễm, và glossary đặt cấu uế làm dạng ưu tiên; cnd23:294.2 và snp1.3:32.2 vẫn giữ ô nhiễm, bài này khác có chủ ý. (4) 59.1 lòng thương xót thế gian sang lòng thương tưởng thế gian cho lokānukampā: toàn tầng 65 khoá, 61 khoá thương tưởng, 2 khoá thương xót; glossary ghi đúng cụm này. (5) 47.1 và 47.2: bản trước dịch Rājā migānaṁ abhibhuyya cārī thành Như vua của các loài thú, bậc chiến thắng tự tại. Hai lỗi: chữ Như đặt vế đồng vị sīho (sư tử cũng là vua các loài thú, không phải so sánh thứ hai), và tự tại là nghĩa không có trong cārī, lại trùng với Tự Tại dùng cho sayambhū (toàn tầng 58 khoá có sayambhū, 46 khoá tự tại). Nay 47.1 là Như sư tử có nanh khỏe, dùng sức mạnh áp đảo (pasayha; toàn tầng 48 khoá: 9 khoá cưỡng, 5 khoá chế ngự, 3 khoá áp đảo, không có đa số rõ) và 47.2 là Vua của các loài thú, sống sau khi đã chế ngự (abhibhuyya; 153 khoá: 99 khoá chế ngự). Chú giải trong cnd23:335.1 giải cārī bằng carati, viharati nên dùng sống; cnd23:334.1 đến 337.2 và snp1.3:38.1 đến 38.2 vẫn giữ cách cũ, ngoài phạm vi lượt này. (6) 54.4 thân ái đối với ta sang đem lại lợi ích cho ta: hita theo glossary là lợi ích, thân ái là suy thêm; vẫn là bất định (xem mục 3 ở trên). (7) 11.1 Người đã sinh giao du sang Người đã có giao du thì sinh ra những yêu mến: sinh giao du là calque khó đọc của saṁsaggajāta, bhavanti dịch thành sinh ra, vẫn giữ số nhiều snehā và yêu mến cho sneha như ở 11.2, 11.3, 41.3 (sửa độ sáng rõ). Số khoá giống hay khác các bản trùng Pāli ở đoạn Tái dùng tầng nói đến trạng thái trước lượt này; nay thêm 41.2, 47.1 và 47.2 khác có chủ ý với cnd23 và snp1.3.

  Điểm đổi và không đổi trong lượt này: grammar_logic 8.8 sang 8.9 (mục 1 và 5); terminology 8.8 sang 8.9 (mục 2, 3, 4, 5 và 6; mức chỉ +0.1 vì patippacāra, vikubbita, appita và các từ hiếm khác vẫn chưa phân xử được). Giữ nguyên semantic_fidelity 8.8, vietnamese_clarity 9.0 (còn vài câu gượng như 22.1 sự thành tựu về bạn đồng hành, 23.1 đến 23.3 và chỗ 3.4 chấm câu rồi 4.1 mới có vị ngữ, vì Pāli cũng chấm ở 3.4), ambiguity_integrity 8.6 (mười hai bất định vẫn còn), triangulation 7.5 (không có bản Anh độc lập; không nâng) và technical_integrity 9.6 (bốn lệnh của kho vẫn chưa chạy, xem đoạn trên). final_score là trung bình thô 9.0 (tổng 90.0, phép chia dấu phẩy động cho 8.999999999999998); chưa vượt 9.0 nên không đủ ngưỡng publish và giữ review. Đã xem nhưng quyết định không đổi dù nghi ngờ: 28.2 ưa hoa sen cho padumī (chú giải cnd23:198.2 dùng padumī cho voi và cho Độc Giác Phật mà không nêu nghĩa, tầng có 5 khoá cùng dịch); 8.3 jiya phanditāni; 17.1 an nhiên khắp bốn phương; 23.2 thợ rèn; 59.3 saṁvegasaṅgamativaḍḍhanatthaṁ (cách tách ba mục vẫn là cách đọc đã nêu ở bất định 6, chưa loại trừ được cách tách khác).

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 7 khoá bất đồng nghĩa → sửa 1 (32.3 sayaṁ na seve: Chớ thân cận → Tự mình chớ thân cận, vì bản trước bỏ mất sayaṁ là tự mình mà Pāli có, chú giải cnd23:225.1 cũng giải sayaṁ là tự mình), giữ 2 (28.2 padumī: bản nguyên bài có đốm hoa sen, bản dự án ưa hoa sen theo chú giải cnd23:198.2; 30.2 niyāma: bản nguyên bài quy luật, bản dự án sự chắc chắn, 5 khoá cùng Pāli), bất định 4 (35.3 yathodhikāni; 54.2 paccantasattesu patippacārā, nơi bản nguyên bài đọc khác hẳn; 54.3 parattha idha; 54.4 và 55.4 hitāme, satatappitāme). Ngoài ra lượt rà đối kháng tìm thêm một lỗi mà bản cũ và bản nguyên bài cùng mắc, nên không lộ ra từ đối chiếu: 39.2 Như lá rụng của cây pārichatta → Như cây pārichatta, lá phủ dày. Lý do: Pāli đã ghim đọc sañchannapatto (lá phủ kín), khác sañchinnapatto (lá bị cắt, rụng) ở 19.2; chú giải Niddesa trong chính tầng Pāli đã ghim (cnd23:280.1) giải pārichattaka là cây lá dày, bóng rợp, và cnd23:282.2 dịch đúng Pāli này là lá phủ dày. Các ấn bản khác có thể đọc sañchinna, nhưng đã ghim thì theo Pāli đã ghim. Lỗi ngoài lát: snp1.3:30.2 (cùng Pāli) còn dịch lá rụng, và snp1.3:23.3 cùng cnd23:221.3 và cnd23:226.3 còn bỏ sayaṁ. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

