notes: |-
  **Bài.** `ja254` — Jātaka 254, phẩm `Saṅkappavagga` (Tikaṇipāta), thứ tư. Bài có 17 khoá
  Pā li; bản dịch phủ **17/17**, đủ cả khoá `4.1` mà lát trước đã ghi.

  **Năm phép kiếm, số do script in ra, không chép tay.**
  (1) `set(khoá Việt) == set(khoá Pāli)`: thiếu **0**, thừa **0**.
  (2) ngoặc kép `“”` và nháy đơn `‘’` so **từng khoá**: 17 khoá đã so, lệch **0**; cân cả bài
  ngoặc kép Pā li 2 / Việt 2, nháy đơn Pā li 0 / Việt 0.
  (3) Pā li trùng nguyên văn **trong chính bài**: **0** cặp, nên 0 cặp Việt khác.
  (4) dấu lược `…pe…` và `…` trần so từng khoá: 17 khoá đã so, lệch **0**. Bài này Pā li
  **không có** khoá lược nào (0 `…pe…`, 0 `…` trần) và bản Việt cũng **không có** `…` nào.
  (5) chỉ mục Pā li→Việt toàn tầng: **4** cặp Pā li trùng nguyên văn đã dò, dùng lại nguyên văn
  **4** khoá (`0.1`, `0.2`, `0.3`, `2.2`), Việt khác **0**.

  **Tra tiền lệ kèm đếm (tầng Việt, 5.407 tệp / 155.826 khoá).**
  `Jātaka` → *Jātaka* **427**, *Chuyện Tiền Thân* 16. `Tikanipāta` → *Bộ Ba Bài Kinh* **123/123**
  (cùng cách ở `iti50`…`iti69`). `Saṅkappavagga` → *Phẩm Suy Nghĩ* **8** (`ja251`, `ja252`,
  `ja253`, `ja255`…`ja259`) và *Phẩm Saṅkappa* **1** (`ja260`) — tôi theo nhóm 8, cùng phẩm với
  bài này. `jātiyā vinayena vā;` → *bằng dòng dõi hay giới hạnh;* **1** (`ja304:2.2`), Pā li
  trùng nguyên văn nên dùng lại y nguyên.

  **Ngôi kể và ngoại động từ — đọc cả bài trước khi chốt.** `1.1`–`1.4` là lời chàng chăn
  nói với con rắn, Pā li `te` → *ngươi*; `2.1`–`2.4` là lời con rắn đáp lại, `mahābrahme` là
  từ xưng hô giữa bài nên tôi dịch *Đại Bà-la-môn* và giữ `“` mở ở `2.1` theo đúng Pā li; `3.1`–`3.4`
  lại là lời chàng chăn: `pajānāsi` là ngôi 2 (*ngươi đã biết ta*) còn `bhakkhāmi` ở `3.4` là
    ngôi 1 (*tao không cho ngươi ăn*), nên hai vế này phải đổi chiều.

  **Dấu `ti`: đo ở phạm vi gần nhất rồi mới chọn.** Pā li kết bằng `”ti.`/`’ti.` thì trong
  `ja` tầng Việt **giữ 212 : bỏ 122 : lạc dạng 100**, và bài anh em kề `ja253:3.4`, `ja255:3.4`
  đều giữ — nên `3.4` tôi viết *…nữa”ti.*, GIỮ.

  **Bất định đã ghi nhận, không che.**
  1. `yādisāyaṁ hayuttamo` (`3.2`) — tôi đọc `hayu` là *lửa*, dịch *ngọn lửa trong ngươi hung
  dữ thế nào*. Cụm này **không có** tiền lệ nào trong tầng (0 khóa Pā li trùng khác `3.4`), và
  cách phân tích `hayuttamo` là của tôi, không phải của từ điển đã tra; tôi ghi kèm ở đây thay vì
  bịa một thuật ngữ Hán–Việt cho chắc chắn hơn.
  2. Tên `Kuṇḍakakucchi` — khoá `4.1` đã có sẵn trên đĩa là *Kinh Rắn Kucchi, thứ tư.* Tôi
  giữ nguyên và làm `0.4` khớp (*4. Kinh Rắn Kucchi*) để không tự gây mâu thuẫn trong cùng một
  tệp; nhưng phần `Kuṇḍaka-` **không** được dịch. Đây là hạn chế tôi thừa nhận, và là lý do
  `terminology` chỉ 9,0. `sindhava` tôi dịch theo **nghĩa loại** là *rắn*, khớp cảnh nāga ăn
  cỏ trong chính bài, chứ không phiên âm.
  3. `tiṇaparighāsa` và `ācāmakuṇḍaka` tôi giữ nguyên dạng Pā li (loài cỏ) vì tầng Việt không có
  tên đã tra cho hai từ này; `ācāmakuṇḍaka` dùng cùng một cách ở `1.2` và `2.4`.

  **Coverage tầng Anh — mẫu số bằng 0, tức là KHÔNG ĐO ĐƯỢC GÌ, không phải đạt.** Đo bằng
  Pā li ≥ 40 ký tự, bỏ khoá tham chiếu `:0`: `ja254` có **0** khoá thoả (các vế kệ ngắn nhất),
  nên cổng coverage của bài này không đo được gì. Ba tầng tham khảo đều **không có**: Sujato
  0 tệp (tầng `kn` của Sujato ở commit đã ghim chỉ có `cp dhp iti ja kp snp thag thig ud`,
  tổng 755 tệp, và trong 83 tệp `ja` không có `ja254`), `english-project` 0 tệp,
  `translation/vi/phantuananh/` 26 tệp toàn Pháp Cú nên không có bản Hòa thượng Thích Minh Châu
  cho bài này. Vì vậy `triangulation` để **8,4**: tôi dịch từ Pā li root và đối chiếu bằng tiền lệ
  trong chính tầng, đây là đặc điểm của bản chụp upstream đã đo được, không phải thiếu sót của
  bản dịch. `ja254` không có mục trong `content/meta/reference-gaps.yaml` vì bài không có khoá
  Pā li có nội dung nào để ghi nhận — đó là *cổng không đo được*, không phải *không cần ghi nhận*.

  **Cổng kỹ thuật chưa chạy.** Lát này bị cấm `git`/`gh` và cấm `npm run validate|test|check|build`,
  nên tôi **không** tuyên bố technical gate pass. Bốn lệnh còn lại thuộc cổng của người điều
  phối: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Phần tôi tự kiểm được:
  JSON hợp lệ, NFC, thứ tự khoá y hệt Pā li, 0 orphan, 0 khoá lược lệch, ngoặc cân, YAML parse
  sạch bằng `yaml@2.9.0` của kho. `technical_integrity` vì thế là **9,6**, không phải 10,0.

  **Giải quyết draft 2026-10-12 (thay thế các mục cũ về ngôi kể, tên bài và bất định `hayuttamo`/`Kuṇḍakakucchi`/`sindhava` ở trên).**
  Đọc đối kháng toàn bài từ Pāli, bản đã chấm 2026-10-05 sai nghĩa ở gần như mọi khoá nội dung. Số khoá lỗi nghĩa thật: **13/17**
  (`0.4` `1.1` `1.2` `1.3` `1.4` `2.1` `2.2` `2.3` `2.4` `3.1` `3.2` `3.3` `3.4`; `4.1` đổi theo tên bài; `0.1`–`0.3` giữ).
  Các lỗi nghĩa chính: (a) `sindhava` là *ngựa (xứ Sindhu)*, không phải *rắn* — đây là chuyện con ngựa quý, nên toàn bài
  trước đó là *rắn ăn cỏ* sai hẳn; `hayuttamo` = *tuấn mã tối thượng* (haya = ngựa, uttama = tối thượng), không phải *ngọn lửa*
  (`hayu` không có nghĩa đó); `kucchi` = *bụng*, đổi tên bài thành *Kinh Ngựa Sindhu Bụng Cám* (khớp `translationTitle`, `0.4`, `4.1`;
  tiền lệ `sindhava` = *ngựa xứ Sindhu* ở `ja529:46.4`, `ja538:69.2`, `ja539`). (b) `mahābrahme` ở `2.3` là hô cách của
  *Mahābrahmā* (*hỡi Đại Phạm thiên*), không phải *Bà-la-môn*. (c) `na te bhakkhāmi` (`3.4`) là *ta không ăn cám của ngài* —
  bản cũ viết *ta không cho ngươi ăn*, đảo chủ thể và động từ; `bhuñjasi` (`1.4`) là *ngươi (không) ăn*, `āsi` (`1.3`) quá khứ
  *đã là*. (d) `kuṇḍaka` = *cám* (không phải *cỏ non*), `ācāma` = *nước cơm đóng váng* (tiền lệ: `mn51:8.6` *nước cơm đóng váng*,
  `kaṇa` *cám gạo*); `ācāmakuṇḍaka` dịch *cám và nước cơm đóng váng*, giữ chung một cách ở `1.2` và `2.4`, bỏ chữ *non* tự thêm và
  bỏ phiên âm `ācāmakuṇḍaka`/`tiṇaparighāsa`/`kuṇḍaka` trong thân kệ. (e) `2.1`–`2.2` Pāli trùng nguyên văn `ja304:3.1`–`3.2`
  (`Yattha posaṁ na jānanti, jātiyā vinayena vā;`): dùng lại *Nơi người ta không nhận biết một người bằng dòng dõi hay giới hạnh*
  — 1 cặp trùng liên bài đã dò, Việt khác 0 sau khi sửa (trước đó `2.1` lệch tiền lệ). (f) `3.1`–`3.4`: `pajānāsi maṁ`
  *ngài biết ta*; `yādisāyaṁ hayuttamo` = *yādiso ayaṁ hayuttamo* (*bậc tuấn mã tối thượng này là hạng thế nào*);
  `jānanto jānamāgamma` = *là kẻ biết, đã đến với người biết*.
  **Xưng hô.** Người đáp (con ngựa) gọi người hỏi là *Đại Phạm thiên* nên dùng *ngài* ở `3.1`/`3.4`; người hỏi dùng *ngươi* ở `1.3`–`1.4`.
  Pāli trùng nguyên văn trong chính bài: 0 cặp (phép này chạy rỗng).
  **Blocker đã xử lý.** (A) Thiếu bản Anh Sujato upstream: GIỮ NGUYÊN câu blocker; đây là sự thật về bản chụp đã ghim
  (Sujato không có `ja254`), do waiver `no-upstream-english` của người biên tập xử lý. (D→gỡ) Blocker "bốn cổng kỹ thuật không
  chạy được" là thủ tục của lát cũ, không phải lỗi văn bản: gỡ khỏi `blocking_errors`; lát này cũng không chạy cổng, nên
  `technical_integrity` giữ **9,6** và bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` thuộc cổng CI/người điều phối.
  **Bất định còn lại (ghi, không che).** (1) `tiṇaparighāsa` (`1.1`): `parighāsa` là phần ăn thừa/nhặt nhạnh; dịch *cỏ thừa*, nghĩa
  chính xác của `parighāsa` trong tổ hợp này không phân xử được từ tầng đã ghim (0 tiền lệ trong tầng). (2) `ācāmakuṇḍaka` có thể
  là *cám trộn với nước cơm đóng váng* (một món) hơn là hai vật liệt kê; bản dịch giữ trung tính bằng *cám và nước cơm đóng váng*.
  (3) `kucchi` trong tên bài có thể là biệt danh *bụng cám* của con ngựa hay *bụng chứa cám*; dịch *Bụng Cám*. (4) Người hô *mahābrahme*
  (vua, người chăn ngựa hay người hầu) không xác định được từ nguyên kệ, nên không gán danh phận; `jānanto jānamāgamma` đọc theo cách
  *ta là kẻ biết đến với người biết*, một cách đọc khả dĩ chứ không duy nhất. (5) Coverage tầng Anh: mẫu số vẫn bằng 0 (không có khoá Pāli
  ≥ 40 ký tự) nên cổng không đo được gì, và không có Sujato/`english-project`/`vietnamese-current`; do đó `triangulation` hạ xuống **7,6**
  (không có bản Anh độc lập nào), `semantic_fidelity` **8,6**, `terminology` **8,6**; `final_score` 8,98 là trung bình thô, không làm tròn.

  **Giải quyết draft 2026-10-13 (vòng 2).** Đọc đối kháng lại toàn bài từ Pāli; thay thế các mục cũ nói `mahābrahme` là *Đại Phạm thiên* và các mục cũ ở đầu notes về *ti* ở `3.4` (nay bản dịch bỏ `ti` như `ja253:3.4`, `ja255:3.4`).
  **Khoá đổi: 1/17 (`2.3`).** `mahābrahme` trước đó dịch *hỡi Đại Phạm thiên*; đo tiền lệ trong tầng Việt cho `mahābrahme` ở 7 khoá (`ja467:10.3`, `ja480:1.3`, `ja483:16.4`, `ja520:33.1`, `ja431:1.1`, `ja547:327.1`, `ja547:365.1`): *Đại Bà-la-môn*/*bà-la-môn lớn* **6**, *Đại Phạm Thiên* **1**. Trong Jātaka đây là lời xưng hô tôn kính với một người (ở `ja547:365.1` là người bà-la-môn đến nơi), không phải gọi vị trời; gán *Phạm thiên* cho người đối thoại là thêm danh phận không có căn cứ, nên đổi thành *hỡi Đại Bà-la-môn*. 16 khoá còn lại đọc lại, không đổi: `1.1`–`1.4` (`bhutvā` hai lần là hai động từ bất biến *sau khi ăn*; `etaṁ te bhojanaṁ āsi` *đó đã là thức ăn của ngươi*), `2.1`–`2.2` dùng lại nguyên văn `ja304:3.1`–`3.2`, `3.1`–`3.4` (`tvañca kho maṁ pajānāsi` *nhưng ngài thì biết ta*; `na te bhakkhāmi kuṇḍakan` *ta không ăn cám của ngài*). Pāli trùng nguyên văn trong chính bài: 0 cặp.
  **Blocker đã xử lý.** Loại (A): blocker cũ nói đúng một sự thật (Sujato không có `ja254`) nhưng viết dài và lẫn thủ tục của lát cũ; đã kiểm lại trực tiếp: thư mục `translation/en/sujato/sutta/kn/ja` tại commit đã ghim có 83 tệp, không có tệp nào cho `ja254`, và `source/upstream-manifest.json` chỉ liệt kê tệp Pāli root của bài này. Viết lại thành một blocker duy nhất, ngắn, đúng sự thật (`noEnglishEditionUpstream`); tầng Việt hiện hành cũng vắng (chỉ có Pháp Cú) và không có lớp `english-project` cho bài. Không còn blocker nào khác: không có lỗi văn bản chưa phân xử đang bị che trong chuỗi đó; các bất định ngữ nghĩa nằm ở mục dưới, và không phải blocker vì không làm sai nghĩa câu nào.
  **Bất định còn lại.** `parighāsa` trong `tiṇaparighāsa` (`1.1`), nghĩa *cỏ thừa* không phân xử chắc được (0 tiền lệ trong tầng); `ācāmakuṇḍaka` là một món hay hai vật; `kucchi` trong tên bài; ai là người được gọi *Đại Bà-la-môn* (tiền lệ tầng nghiêng về *Bà-la-môn* chứ không chắc tuyệt đối). `triangulation` giữ **7,6** (không có bản Anh độc lập nào; mẫu số coverage bằng 0, cổng không đo được gì). Điểm giữ nguyên; `final_score` 8,98 là trung bình thô. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` thuộc cổng CI/người điều phối.

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 3 khoá chênh lệch lớn nhất (`0.3`, `2.2`, `2.4`) → khác nghĩa 0 chỗ: sửa 0, giữ 3, bất định 0 mới. Giữ 3: `0.3` *Phẩm Suy Nghĩ* so với *Phẩm Saṅkappa* (chỉ khác cách xử lý tên phẩm); `2.2` `jātiyā vinayena vā` *bằng dòng dõi hay giới hạnh* so với *theo dòng dõi hay theo sự rèn luyện* (cùng nghĩa); `2.4` `api ācāmakuṇḍakaṁ` (bản mù *cả cám cơm cũng đã nhiều* bỏ `api` và chuyển `ācāma`; bản dự án *cả cám và nước cơm đóng váng* giữ đủ từng thành phần). Các bất định đã ghi ở trên (`tiṇaparighāsaṁ`, `ācāmakuṇḍaka`, ai được gọi *Đại Bà-la-môn* ở `2.3`) vẫn còn nguyên, bản mù không giải thêm được. Đọc đối kháng lại 17 cặp Pāli↔Việt, không thấy lỗi mới. Không có bản Anh hay bản Việt độc lập khác; đối chiếu chỉ bằng Pāli, ngữ cảnh bài và tiền lệ trong tầng dự án.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài, không có
  đoạn song song): sửa 2 khoá: 3.1, 3.4 ngựa tự xưng "ta" trong khi gọi người nghe là "ngài" (lệch cặp
  xưng hô trong cùng lời thoại) → "tôi" (cặp ngài/tôi, cùng cách đã dùng ở ja265, ja267, ja273). Không
  đổi nghĩa. Bất định tiṇaparighāsa, ācāmakuṇḍaka, Đại Bà-la-môn giữ nguyên.
