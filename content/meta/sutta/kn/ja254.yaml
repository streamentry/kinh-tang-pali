notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Tra tiền lệ (đếm được):** dòng kết `<Tên> jātakaṁ catutthaṁ` → *Kinh <Tên>, thứ
  tư* (`ja1:3.1` "Kinh Bụi Dơ thứ nhất."; `ja159:5.1` "Kinh Con Công, thứ chín."; cụm
  *thứ tư* đã có sẵn ở `an10.144:1.10` "Phẩm Lành, thứ tư." và `an10.40:3.8`).
  **0 tiền lệ, đặt mới, ghi kèm lý do — đây là khoá khó nhất về thuật ngữ của lát:**
  (1) `Kuṇḍakakucchi` là **tên riêng** của nāga, và tầng Việt chưa có tên nào cho nó
  (0 tiền lệ; từ vựng tầng Việt có `Kuṇḍikā`, `Kuṇḍali`, `Kuṇḍalakesī` nhưng không có
  từ nào khớp). Tôi chỉ giữ phần đặc trưng **Kucchi** và **không bịa cách phiên âm**
  Việt cho phần `Kuṇḍaka-`, vì tự chế một cách viết tên riêng còn tệ hơn là giữ một
  phần tên. (2) `sindhavajātaka` là nhãn nhóm của Tăng Bộ (nhóm kể trong hội trường
  rắn-nāga), không phải một chữ có nghĩa thường; tôi dịch theo **nghĩa loại** là *rắn*
  thay vì phiên âm `Sindhava` ra tiếng Việt. Ai muốn đổi sang giữ nguyên tên Pāli thì
  được, nhưng phải thêm chữ vào danh mục từ trước, không sửa lúc này.
  **Bối cảnh đã đọc trước khi dịch:** `1.1`–`3.4` nói chuyện nāga sống bằng cỏ
  `kuṇḍaka` và câu *tiṇaparighāsa* / *ācāmakuṇḍaka* (bụi cỏ, lội cỏ non) — khớp
  nghĩa "rắn", nên nghĩa loại tôi chọn có căn cứ ngay trong bài chứ không phải suy từ
  ngoài.
  **Điểm `terminology` 8,4 là cố ý**: tôi thừa nhận chỉ dịch được một phần tên riêng.
