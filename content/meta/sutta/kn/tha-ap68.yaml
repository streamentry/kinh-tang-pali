notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `tha-ap`/`thi-ap`.
  Bài này kể một con sư tử ở núi rừng gặp Đức Phật, nên văn phong văn xuôi 1.1-4.4 giữ
  ngôi kể thứ nhất của chính vị trưởng lão, không đổi thành ngôi khách.
  Tiền lệ đếm được: 14/40 khoá có Pāli trùng nguyên văn trong tầng.
  0.1 `Therāpadāna` giữ nguyên Pāli (291/300 tệp tha-ap). 0.2 `Sakacintaniyavagga` →
  Phẩm Sakacintaniya (4/4; dùng chung cho tha-ap66 và 70 trong lát). 0.3 và 11.1 →
  Bài Kệ Tuyên Ngợ Về Trưởng Lão X, thứ N. (0.3: 162/305 nhóm Tuyên Ngợ; 11.1: 140/305
  đúng dạng này). Pāli 0.3 không có số thứ tự nên không thêm số vào 0.3.
  Công thức dùng lại nguyên văn: `Atthadassī tu bhagavā` → Nhưng Đức Thế Tôn, bậc Đã
  Thấy Pháp (tha-ap69); `Mamuddharitukāmo so` → muốn cứu độ cho tôi (tha-ap271);
  `Bhagavā tamhi samaye` → Vào lúc ấy Đức Thế Tôn; `Anumodi mahāvīro` → Bậc Đại Anh
  Hùng đã tùy hỷ (tha-ap267); `Tena cittappasādena` → Nhờ tâm tịnh tín ấy;
  `tattha kālaṅkato ahaṁ` → ngay tại nơi ấy tôi đã mệnh chung (5 cặp, cùng tha-ap354);
  `cittassa paṇidhīhi ca` → cùng với những tâm nguyện thanh tịnh (tha-ap107, tha-ap69);
  `Pannarase kappasate` → Rồi từ chín kiếp trước (tha-ap188); `devaloke ramiṁ ahaṁ` →
  tôi đã hưởng thọ ở cõi trời (tha-ap347); `Avasesesu kappesu` → Trong suốt những kiếp
  còn lại; `Duggatiṁ nābhijānāmi` → Tôi không còn biết đến đọa xứ nào.
  Ghi nhận bất định: (a) 1.1 `Giriduggacaro āsiṁ` đọc là Ta là kẻ đi lang thang giữa
  núi khó lội; `giridugga` là đèo núi hiểm nên giữ hình ảnh đi lội, khác với 5.2
  `giriduggaṁ pavisiṁ ahaṁ` (tôi đã đi qua núi khó lội) vốn là hành động đã hoàn thành.
  (b) 1.2 `kesarī` dịch bầu sư tử, giữ nghĩa con sư tử; `mil7.6.1` dịch sư tử có bờm
  tóc đẹp nên nếu đọc theo nghĩa chữ từng chữ thì câu cũng đứng vững. (c) 2.2 `sabbaññū
  vadataṁ varo` dịch bậc Tất Trí, bậc Đạo Sư đã tuyên thuyết, ghép `sabbaññū` (tất trí)
  với `varo` (bậc tôn sư, dùng như Đạo Sư ở 4.2 trong chính bài này); chỉ ghép như vậy vì
  `vadataṁ` là động từ đi kèm. (d) 8.2 `dīghāyunāmakā` không có tiền lệ; `dīghāyu` là
  danh xưng riêng nhưng nằm trong một từ ghép, nên dịch nghĩa chữ là có danh là dài xa,
  song song với 8.4 `varuṇanāmakā` mà ta giữ tên Varuṇa; đây là chỗ không nhất quán có chủ
  ý vì hình thức Pāli chỉ là một. (e) 4.4 `nibbāpento mamaṁ tadā` dịch làm cho tôi được
  lập tức chấm dứt khổ; `nibbāpenta` là làm dập tắt, dịch theo nghĩa chữ, không thêm
  chữ Niết-bàn vì Pāli không nói.
  Tên `Sucintito` chứng thực trong chính Pāli bài này ở 10.1.
  `…pe…` ở 9.2 giữ đúng một dấu lược; nháy kép mở ở 1.1, đóng ở 9.3.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do
  coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`,
  `npm run build`.

  Sửa lan 2026-10-13. (1) `tha-ap68:6.3` `Pannarase kappasate`: *Rồi từ chín kiếp trước* → *Vào một ngàn năm trăm kiếp trước* (`pannarasa` = 15, `kappasata` = trăm kiếp ⇒ 1.500; cùng cấu tạo `Pañcadasakappasate` → *một ngàn năm trăm kiếp* ở `tha-ap146:5.1`, `Pañcavīse kappasate` → *hai ngàn năm trăm* ở `tha-ap487:16.1`; mục ở trên dẫn `tha-ap188` cho *chín kiếp* là bản trước khi sửa). Cùng nhóm số kiếp trong bài: `8.1` `Aṭṭhattiṁsamhi kappamhi` *tám mươi kiếp* → *ba mươi tám kiếp* (`aṭṭhattiṁsa` = 38, như `tha-ap124:15.4`, `tha-ap187:5.2`); `8.3` `Saṭṭhimhito kappasate` *sáu mươi kiếp* → *sáu ngàn kiếp* (60 × trăm, như `Pañcasaṭṭhikappasate` → *sáu ngàn năm trăm* ở `tha-ap108:6.3`). Bỏ tiếng *Rồi từ* thêm vào ở `6.3`, `8.3`. (2) Các lỗi Pāli rõ trong cùng bài, sửa theo tiền lệ cùng Pāli: `1.2` `abhijātova kesarī` *sinh ra ở đó như một bầu sư tử* → *như sư tử dòng dõi cao quý* (`tha-ap44:28.2`); `2.1` `Atthadassī tu bhagavā` *Nhưng Đức Thế Tôn, bậc Đã Thấy Pháp* → *Đức Thế Tôn Atthadassī* (tên một Đức Phật, `tha-ap490:1.1`, `tha-ap206:1.1`); `2.2` `vadataṁ varo` *bậc Đạo Sư đã tuyên thuyết* → *bậc tối thượng giữa những người thuyết giảng* (`tha-ap536:20.4`, `tha-ap552:1.4`, `thi-ap1:9.4`); `3.1`–`3.4` bản cũ đảo chủ thể (*vị ấy tìm đến chỗ tôi để xin ăn*, *tôi đến gặp*), Pāli là tôi giết nai đốm (`pasada`, như `tha-ap408:1.3`) và đến để ăn, còn `bhikkhamāno upāgami` do Đức Thế Tôn đi khất thực mà đến gần → *Sau khi giết một con nai đốm, tôi đã đến để ăn; Vào lúc ấy, Đức Thế Tôn đang đi khất thực, đã đến gần*; `4.1` `Varamaṁsāni` *đám hoa tối thượng* → *phần thịt thượng hạng* (`maṁsa` = thịt, khớp `maṁsadānena` ở `6.1`, `7.3`; bản cũ nhầm hoa); `8.2` `dīghāyunāmakā` *có danh là dài xa* → *có danh là Dīghāyu* (tên riêng, như `varuṇanāmakā` ở `8.4`). Còn chưa sửa: xưng hô lẫn *Ta*/*tôi* ở `1.1`–`1.4`; `4.4` `nibbāpento` và `5.2` `giriduggaṁ pavisiṁ` cần soát. Lưu ý: nhiều lỗi nghĩa ở một bài đã `published` cho thấy `semantic_fidelity` cũ (9.3) có thể cao hơn thực tế; điểm và status giữ nguyên chờ một lượt chấm đầy đủ.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan). Đọc đối kháng đủ 40/40 khoá, Pāli↔Việt từng cặp. Đổi 21/40 khoá:
  (1) Xưng hô: Trưởng lão kể tiền kiếp cho thính chúng nên giữ "tôi" suốt bài (`skill/translation.md` §9); bản trước lẫn "Ta"/"ta" ở `1.1`, `1.4` → "tôi".
  (2) Thêm nghĩa / sai nghĩa: `1.3` `Migasaṅghaṁ vadhitvāna` *bắn trúng đàn thú* → *Sau khi giết hại bầy thú* (Pāli không có "bắn"); `4.4` `nibbāpento mamaṁ tadā` *làm cho tôi được lập tức chấm dứt khổ* → *khi ấy làm cho tôi được dịu mát* (`tadā` là "khi ấy", không phải "lập tức"; "chấm dứt khổ" là diễn giải; tiền lệ `nibbāpento` → *được dịu mát* 3/4 ở `bv18:2.4`, `tha-ap215:1.4`); `5.2` `giriduggaṁ pavisiṁ` *đi qua núi khó lội* → *đi vào vùng núi non hiểm trở* (`pavisati` = đi vào; "lội" là lội nước); `1.1` `Giriduggacaro` cùng chữ `giridugga` → *rong ruổi giữa núi non hiểm trở* (như `sn9.3:2.1` *núi non hiểm trở*; tiền lệ duy nhất cùng Pāli `tha-ap199:1.1` *đi đường núi khó đi* lặp chữ nên không theo); `2.4` `pabbatuttamaṁ` *núi chí tôn cao nhất* → *ngọn núi tối thượng* (tiền lệ duy nhất cùng chữ); `6.2` `cittassa paṇidhīhi ca` bỏ *thanh tịnh* (Pāli không có; đa số 3/5 thêm chữ này, theo Pāli và 1/5 *và nhờ những tâm nguyện*); `6.1`, `7.3` `maṁsadānena` *món quà dâng* → *sự cúng dường thịt* (bản trước bỏ mất "thịt"; `Etena` "này" khác `Teneva` "chính … ấy"); `6.4` `ramiṁ` *hưởng thọ* → *vui chơi* ("hưởng thọ" là sống tới tuổi, không phải `ramati`; như `tha-ap70:5.2`).
  (3) Thời gian: `6.3` `Pannarase kappasate` *Vào một ngàn năm trăm kiếp trước* → *Trong một ngàn năm trăm kiếp* — Pāli không có `ito`, và `7.1` `Avasesesu kappesu` ("trong những kiếp còn lại") cho thấy đây là thời lượng ở cõi trời, cùng cấu trúc `tha-ap70:5.1`–`5.3`; số 1.500 (15 × 100) giữ nguyên.
  (4) Theo tiền lệ đếm được: `2.1` `Atthadassī tu bhagavā` thêm *Nhưng* cho `tu` (2/5 *Nhưng Đức Thế Tôn Atthadassī*, đa số tương đối); `2.3` `Mamuddharitukāmo so` → *Ngài ấy muốn cứu độ cho tôi* (4/10, đưa `so` về đúng khoá); `3.3` `Bhagavā tamhi samaye` → *Vào lúc ấy Đức Thế Tôn,* (15/18); `8.2`, `8.4` `-nāmakā` *có danh là* → *mang tên* (14/28 khoá `-nāmakā` ở `tha-ap`); viết hoa đầu `1.3`, `5.3` theo Pāli.
  (5) Tên: `0.3`, `10.1`, `11.1`, `translationTitle` *Sucintito* → *Sucintita* — dạng gốc chiếm 477/537 khoá lời-kết `tha-ap` (52 giữ đuôi -o); phạm vi gần (phẩm Sakacintaniya `tha-ap63`–`70`) 4 gốc / 3 đuôi -o; chính `Sucintitattheraapadāna` ở bài trùng tên trong tầng cũng dịch *Sucintita*.
  Phép kiểm: tập khoá 40/40 khớp Pāli; nháy “”‘’ khớp Pāli 40/40 khoá; `…pe…` 1/1 → đúng một `…`; NFC, khoá rỗng, khoảng trắng: 0 lỗi; Pāli trùng nguyên văn trong chính bài: 0 cặp (phép rỗng); Pāli trùng nguyên văn trong tầng: 18 khoá dò, 13 khớp đa số, 5 lệch có lý do nêu trên (`0.3` theo đa số tầng *Ký Sự Về* 417/563; `1.1`, `6.2`, `6.3`, `6.4`).
  Số Pāli: `6.3` pannarasa (15) × kappasata (100) = 1.500; `8.1` aṭṭhattiṁsa = 38; `8.2` aṭṭha = 8; `8.3` saṭṭhi (60) × kappasata (100) = 6.000; `8.4` duve = 2; `9.1` catasso = 4.
  Bất định còn lại (không đoán): (a) `8.3` `Saṭṭhimhito kappasate` dịch 6.000 theo cấu tạo như `Pannarase kappasate` (1.500) ngay trong bài và `Soḷaseto kappasate` (1.600, 2/3 tiền lệ); nhưng `tha-ap206:3.1` đặt Đức Phật Atthadassī ở 1.800 kiếp trước, nên 6.000 kiếp trước lại sớm hơn việc cúng dường — mâu thuẫn niên đại này không phân xử được khi không có bản Anh hay bản Pāli khác; giữ 6.000, không đổi thành 160. (b) `1.2` `abhijātova kesarī` giữ *như* sư tử (cả hai tiền lệ `tha-ap44:28.2`, `tha-ap448:1.4` là phép so sánh); Pāli không nói thẳng người kể là sư tử hay người thợ săn, nên mục ghi chú cũ "bài này kể một con sư tử" là cách hiểu, không phải nguyên văn. (c) `3.2` `bhakkhituṁ samupāgamiṁ` không nói rõ đến gần cái gì; dịch *đã đến để ăn*.
  Sửa ghi chú cũ: các dẫn chứng ở mục đầu (*Rồi từ chín kiếp trước*, *có danh là dài xa*, *Ta là kẻ…*, *Duggatiṁ nābhijānāmi* — câu này không có trong bài) mô tả bản trước, không còn đúng với văn bản hiện tại.
  Điểm (trước → sau): source_provenance 9.5 → 9.0 (ghi chú cũ có dẫn chứng sai); semantic_fidelity 9.3 → 8.8 và grammar_logic 9.2 → 8.8 (đã sửa thêm nghĩa và thời gian, nhưng bất định số `8.3` vẫn còn; điểm cũ không bắt được các lỗi chủ thể, số kiếp và "hoa"/"thịt"); terminology 9.2 → 9.0; vietnamese_clarity 9.3 → 9.0; han_viet_balance 9.3 → 9.2; ambiguity_integrity 9.1 → 8.8; segment_alignment 10.0, triangulation 7.5 (ba tầng tham khảo đều vắng, chỉ đối chiếu bài song song trong tầng Pāli), technical_integrity 9.6 giữ nguyên. final_score 9.2 → 8.97.
