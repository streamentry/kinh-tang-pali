  Quyết định hội đồng biên tập 2026-10-16: A4 — `228.4`, `229.5` (chín thể loại kinh theo mn22, bỏ “kinh khất đàm, kinh khế tùng…”); A5 — `95.2`, `96.4` (`abhijānamāno` là “thắng tri”, không phải “liễu tri”; `agadhito`/`anajjhosanno` là “không bị buộc chặt”/“không chấp chặt”); A10 — `325.3`, `325.4` (`vibhūta vibhāvita` theo thứ tự Pāli; `dhunātha` là “đánh tan”, không phải “chặn đứng”); B1 — 15 khoá (`8.2` … `78.2`) (`visattikā` = “sự vướng mắc ở đời”; `tare` = “có thể vượt qua”); B8 — `19.3` (`āvajjana` = “hướng tâm”; `abhiniropana` = “gắn tâm”).

  Nghiên cứu nguồn ngoài 2026-10-16: bản Việt song ngữ Pāli–Việt của Tỳ khưu Indacanda,
  Cūḷaniddesapāḷi - Tiểu Diễn Giải (Tam Tạng Song Ngữ Pāli–Việt, Sri Lanka 2018),
  https://tamtangpaliviet.net/TTPV/36_Nidd_II.pdf (Tiểu Diễn Giải, tập 36); đã tải toàn văn và đối
  chiếu phần tương ứng; nguồn độc lập với dự án, giấy phép không khai (NOASSERTION), chỉ dùng làm bằng
  chứng nghĩa, không chép. Đã đối chiếu: căn chỉnh theo đoạn 356 nhóm đoạn của bài với Indacanda (186
  nhóm khớp từ vựng và không lệch phủ định hay số đếm, 18 nhóm trùng chữ với nhóm đã so ở bài khác,
  152 nhóm bị cờ; nhóm bị cờ mới quét theo danh sách cờ, chưa đọc từng nhóm); đọc từng nhóm kệ trích
  (37 nhóm) cạnh Indacanda và Sujato; so 241 mục từ đầu đoạn với mục từ của Indacanda; kệ trích còn so
  với Sujato snp1.3 (374 khoá có Pāli trùng chữ với kho `snp`, 337 khoá có Việt trùng chữ, 37 khoá
  khác, đã xem mẫu: phần lớn do ngắt dòng, chấm câu hoặc do Niddesa tự đọc kệ khác Sujato). Phần lời
  giải Niddesa chỉ có Indacanda làm nguồn độc lập (Sujato không có bài này); phần kệ trích có thêm
  Sujato. Sửa: không có khoá nào. Bất định/ghi nhận: 325.3–325.4 `vibhūta vibhāvita` đã đúng thứ tự
  Pāli (quyết định A10 đã thi hành); 322.2, 324.1–324.6 `aneḷamūgo` «không câm điếc»: lời giải 324.2
  giải bằng «có trí, có tuệ…», Sujato «clever», chưa tra từ điển nên giữ.
  Thống nhất cấp kho 2026-10-17: công thức (y)assa te honti atthakāmā/anatthakāmā… dịch «những người mong muốn … cho một người» (assa = cho một người, te = những người ấy), bỏ «đối với người nào những vị…» (kính ngữ «vị» gồm cả người muốn hại, «nào» gắn sai chỗ); cùng cấu trúc với dn22:18.28/18.31, ps1.1:189.2/190.2.
  Thống nhất cấp kho 2026-10-17: paṭipassaddhi/paṭippassaddha/paṭippassambhati thống nhất «dịu xuống» ở 2.15, 127.2, 216.3, 218.6, 279.3 (DPD calming down/subsiding; «an tịnh» va chạm santi theo B19, «lắng dịu» va chạm vūpasama), như các chuỗi santo … paṭipassaddho đã dùng (dec/corpus_rest.tsv).
  Thống nhất cấp kho 2026-10-17 (lời phê vietnamese_clarity/terminology của mnd14, mnd16): (`102.2`, `102.3`, `102.5`, `102.7`, `103.6`, `103.8`, `103.9`) lời Phật trích từ sn35.151 (santevāsiko/sāntevāsiko sācariyako): «có đệ tử ở nhà, có giáo sư» → «có đệ tử nội trú, có thầy». Căn cứ: antevāsika DPD «apprentice; student; lit. who lives with», Sujato «resident pupil», HT. Thích Minh Châu «đệ tử nội trú»; «nội trú» giữ lối chơi chữ với anto vasanti «cư trú bên trong», còn «đệ tử ở nhà» dễ hiểu thành đệ tử tại gia; ācariya là «thầy» (DPD sācariyaka «together with one's teacher», Sujato «teaching master»; kho đã dùng «không có thầy» cho anācariyako), «giáo sư» là chức danh hiện đại. Thêm «thì» trước «sống trong khổ/sống an lành» để «có thầy» không bị đọc thành chủ ngữ của «sống». Đồng bộ sn35.151, mnd1, mnd14, mnd16, cnd23.
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17 (164 dòng kệ snp1.3 so với dòng dẫn, lemma, dòng nhắc lại và lời giải): sửa 186.3, 189.1, 189.2, 190.3 abhisambhavitvā «chịu đựng được» → «chế ngự» (nghĩa từ trái lời giải ngay sau ở 189.1 abhibhavitvā ajjhottharitvā pariyādiyitvā madditvā; DPD «having overcome»; như tha-ap2:27.3); 227.3, 232.1, 232.2, 233.3 atthāni «ý nghĩa» → «các lợi ích» (nghĩa từ trái lời giải 232.1 attatthaṁ paratthaṁ ubhayatthaṁ…; Pj II attatthaparatthaubhayattha…); 191.2, 198.1, 198.2, 198.4, 200.2 padumī «ưa hoa sen» → «mang dấu hoa sen» (nghĩa từ; 198.2 padumī nhờ bảy hoa giác chi, DPD «having lotuses; (voi) with lotus markings», Pj II padumasadisagatta); 322.2, 324.1, 324.2, 324.6, 328.2 aneḷamūgo «không câm điếc» → «không đần độn» (nghĩa từ; lời giải 324.2 paṇḍito paññavā…, DPD «not a drooling fool», Pj II paṇḍito byatto, Sujato snp1.3 «clever»; thay ghi nhận «chưa tra từ điển nên giữ» của lượt 2026-10-16). Hai dòng sau cùng sửa ở snp1.3. Giữ: 81.1 āmantanā, 93.3/118.1 sahitā, 299.3/301.x samatha «an tịnh»/«chỉ», 256.3/269.1 anavassuto «không ô nhiễm» (DPD «undefiled») — khác thuật ngữ, không phải lỗi nghĩa.
