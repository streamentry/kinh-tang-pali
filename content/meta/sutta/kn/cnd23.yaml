  *cấu uế* như `tha-ap2:41.2` (`upakkilesa` là *cấu uế* ở `an1.49`–`an1.52`,
  `an10.99`; mục thuật ngữ *`upakkilesa` → ô nhiễm* ở trên được thay bằng *cấu uế*;
  `301.4` `vigatūpakkilesā` *lìa mọi ô nhiễm* giữ nguyên vì cùng khoá có `anaṅgaṇā`
  đã là *không cấu uế*). (b) Kệ `Sīho yathā dāṭhabalī pasayha, rājā migānaṁ
  abhibhuyya cārī; sevetha pantāni senāsanāni` (`334`, `337` và lời giải `335`,
  `336`) theo cách dịch mới của `tha-ap2:47.1`–`47.3`: bản cũ *chế ngự* (gần như bỏ
  `pasayha`), *Như vua của các loài thú, bậc chiến thắng tự tại* (sai: `rājā
  migānaṁ` đồng vị với `sīho`, `cārī` là *sống/đi*), *Hãy thường lui tới những chỗ
  trú ngụ xa xôi* → *dùng sức mạnh áp đảo*, *Vua của các loài thú, sống sau khi đã
  chế ngự*, *Hãy thân cận những trú xứ xa vắng* (`mil7.6.3:3.1`, `thag2.11:2.1` cùng
  cách). `snp1.3:38.1`–`38.3` (ngoài phạm vi lát) còn mang bản cũ. Các mô tả khác
  (*sự tạo tác → hành tạo tác*: bài đã dùng *hành tạo tác* ở `296.1`) không có thêm
  chỗ cần sửa. Điểm số giữ nguyên.

  **Đối chiếu bản dịch mù độc lập 2026-10-14:** một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 386 khoá chênh lệch lớn nhất (đã đọc hết, gộp theo Pāli trùng) → khác nghĩa 1: sửa 1 (`174.2` `Tamenaṁ rājāno gahetvā…`: *Nhà cầm quyền* → *Các vua*, vì `rājāno` là số nhiều của *vua*, không phải "nhà cầm quyền" nói chung; cùng loại với `mnd7:56.5`), giữ 10 (`46.2` bản mù ra *như lửa* vì lệch dòng, `182.1`–`182.4` bản mù đảo mệnh đề, `64.4` `visamā` bản mù *không đồng đều* còn Việt hiểu `visama` là bất chính (cùng chữ với `visamalobho` ở `63.3`), hai cách đều khả dĩ nên giữ, `148.3` `nippesikatā` bản mù *chê bai* trong khi Pāli là hạ người khác để cầu lợi, `79.3` `jāgu`/`indagu` bản mù đoán nghĩa từ chữ nên giữ Pāli, `311.2`–`311.14` bản mù lặp *tôi sẽ không rời khỏi* ở từng khoá còn bản Việt để phủ định của `311.1` chạy qua dấu lược đúng như Pāli, `202.2` `yāvatānanda` bản mù *chừng nào* cùng nghĩa với cách đọc theo `mn122:3`, `161.5`/`162.3` `itibhavābhavakathaṁ` hai cách dịch có tiền lệ ngang nhau trong tầng, `307.3` *nằm nghiêng xuống nữa* theo tiền lệ `mnd3:18.3`, `thag4.12:3.3`, `351.1`–`356.5` các cụm kết bài cùng nghĩa), bất định 5 (`173.2` `abhivaggenapi omaddanti`: Việt *bị lực lượng mạnh hơn nghiền nát* theo `mn13:13.2`, bản mù *cửa đập*, không phân xử được bằng Pāli; `145.3`/`150.1` `ete aladdhā anavajjabhojī` hai bản cùng không chắc ai là chủ ngữ; `118.1` nghĩa `ārādhitā`; `355.2` `brāhmaṇānaṁva sāsanaṁ` có thể là *lời dạy của* hoặc *lời dạy dành cho* các Bà-la-môn; `272.7` bản Pāli ghim đảo `adhibhū anadhibhūto`, cả hai bản dịch đều sát chữ). Review đối kháng toàn bài thêm: `170.2`, `170.3` (`rājāno`: *vua quan* → *các vua*, `quan` không có trong Pāli) và chính tả cho nhất quán trong bài, theo cách viết chiếm đa số trong bài (*sinh khởi* 26 khoá so với *sanh khởi* 4 khoá; `14.1` *tái sanh* → *tái sinh*; `270.3`, `270.6`, `273.3`, `273.6` *sanh khởi* → *sinh khởi*). Không có bản Anh hay bản Việt độc lập khác; bản mù cùng họ công cụ nên triangulation vẫn giữ ở mức thấp, không nâng.

  **Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bộ 2018 khoá; không có bản nguyên bài độc lập; đoạn song song `mnd16`, `cnd22`, `mnd14`, `mn128`, `snp1.3`, `tha-ap2`, `ps1.4`, `sn47.18`):** sửa 25 khoá.
  (1) `8.2`: `mahāpadhānaṁ padahanto` *nỗ lực chánh cần lớn lao* → *nỗ lực tinh tấn lớn lao* (không có `samma-`; theo `mnd16:41.2`); `anabhāvaṅgamesi` *làm cho không còn trở lại* → *làm cho không còn hiện hữu*, và `taṇhājāliniṁ visaritaṁ visattikaṁ` → *tham ái giăng lưới, lan rộng, đắm say* (bản cũ bỏ nghĩa giăng lưới, lệch `visattikā` = *sự đắm say* của chính bài).
  (2) `134.2`, `139.2`, `140.2`, `144.2`: bỏ *chú tâm* — thêm ý, Pāli `sādhuvihāri dhīraṁ` chỉ có hai từ và lời giải `136`/`142` cũng chỉ giải hai từ.
  (3) `157.1`, `158.1`, `161.7`, `164.1`: `Evaṁ dutīyena sahā mamassa` *Nếu ta có một người bạn đồng hành như vậy* → *Cũng vậy, nếu ta có người thứ hai bên mình* — `evaṁ` nối với ví dụ hai vòng vàng ở kệ trước, không bổ nghĩa cho người bạn (theo `tha-ap2:24.1`); *người thứ hai* khớp `161.2` *người thứ hai của một người*.
  (4) `161.2`, `266.1`: `uddhato` *tâm phóng dật* → *tâm xao động* (sai thuật ngữ: `uddhacca` là xao động/trạo cử, `pamāda` mới là phóng dật; theo `mnd14:128.2`, `mnd16:241.1`).
  (5) `221.3`, `224.1`, `225.1`, `225.2`, `226.3`: `Sayaṁ na seve pasutaṁ pamattaṁ` *Chớ thân cận kẻ phóng dật, buông lung* → *Tự mình chớ thân cận kẻ mải mê, phóng dật* — bản cũ bỏ `sayaṁ` và dịch `pasuta` thành *phóng dật*, mâu thuẫn với lời giải `224.2` (*Mải mê*) và `225.1` (*kẻ mải mê và kẻ phóng dật*).
  (6) `241.1`, `242.1`, `242.7`, `245.1`: `dāraṁ` *vợ chồng* → *vợ* (lời giải `242.4`: `dārā vuccanti bhariyāyo`; theo `tha-ap2:35.1`).
  (7) `347.1`, `348.1`, `348.2`, `352.1`: `kāraṇatthā` *vì mục đích của mình* → *vì có mục đích* — lời giải `348.1` kể cả `paratthakāraṇā`, `ubhayatthakāraṇā`, nên *của mình* trái với chính chú giải.
  (8) `232.1`: *có thể trừ sạch, nên trừ khử* → *nên trừ sạch, …* cho đồng nhất thức `vineyya paṭivineyya…`.
  Giữ: `28.6` *trộm cắp nơi nhà vắng* (theo `mnd15:3.8`, khác cách nói của `174.1` nhưng đều có tiền lệ); `307.2` *tịnh xá* (kệ dùng lại `mnd3:18.2`); `14.1`–`14.2`, `113.2`–`113.3` sắp ý giữa hai dòng kệ theo `sn47.18`, `mnd14`.
  Bất định: `178.2`/`183.2`/`185.2` `bhayañca metaṁ` dịch *nỗi sợ của ta* (đọc `me etaṁ`); cũng có thể `m` chỉ là phụ âm nối (*và đây là nỗi sợ*), chưa phân xử. Ngoài lát, báo người biên tập: `snp1.3:11.2`, `12.2` có *chú tâm* thừa; `snp1.3:23.3`, `26.1`, `41.1` và `tha-ap2:32.3`, `50.1` mang các lỗi (5)–(7) ở trên.

