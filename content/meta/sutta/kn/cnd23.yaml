notes: |-
  **Phạm vi: đủ 2018/2018 khoá của cnd23, không khoá nào ngoài tập khoá Pāli.** Bài là phần Cūḷaniddesa chú giải *Kinh Tê Giác* (Khaggavisāṇasutta, tức `snp1.3`, 41 bài kệ), mục thứ mười chín của Cūḷaniddesa (colophon `352.6` `ekūnavīsatimo` = 19, tức eka-ūna-vīsati, hai mươi trừ một). Cấu trúc mỗi bài kệ: dẫn từng dòng kệ (`«…»`), giải từng cụm bằng danh sách đồng nghĩa hoặc định nghĩa, kết bằng câu `eko care khaggavisāṇakappo`, rồi nhắc lại nguyên bài kệ trong nháy `“…”ti`; bốn phẩm khép bằng `133.5`, `204.5`, `282.5`, `352.5`, và bốn kệ cuối (`353`–`356`) liệt kê mười sáu Bà-la-môn Pārāyana. Pāli của bài có 136 khoá chứa `…pe…` và 157 khoá chứa dấu lược (cả `…pe…` lẫn `…` trần); mọi dấu lược khớp Pāli từng khoá, `…pe…` thành đúng một `…`; ba khoá `75.1`, `76.1`, `77.1` kết `….` nên Việt kết ` ….`. Không có `(…)` trong Pāli của bài. Ngoặc đơn chỉ có ở `202.7` (`gaṇārāmataṁ anuyutto`), giữ nguyên.

  **Cách trình bày lemma** theo `cnd6`/`cnd13`/`cnd21`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi nhắc lại cụm ở khoá kế. Nháy `“”` và `‘’` khớp Pāli từng khoá (132 khoá có `“`, 15 khoá có `‘`): chỗ Pāli không có nháy thì Việt không thêm, kể cả tên các hình phạt ở `31.3`, các câu chơi chữ `eko` ở `5.2`–`17.1` và lời tự nhủ ở `257.3`. Kệ nguyên (dòng dẫn và dòng nhắc lại) lấy theo `snp1.3` ở chỗ Pāli trùng; những chỗ khác `snp1.3` được nêu trong mục bất định.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `cnd23`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; không có tệp cnd nào ngoài nhãn tác phẩm. Lớp `english-project` không có `cnd23`; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự sau khi gộp khoảng trắng, bỏ khối `:0`, chưa bỏ thẻ in đậm) là **794**/2018 khoá; Sujato phủ 0/794 (`not-published-upstream`), `english-project` 0/794, `vietnamese-current` 0/794. Ba tầng vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Chứng cứ trong chính corpus là bản của bài khác, nên không tính là đối chiếu English của `cnd23`: các dòng kệ trùng Pāli với `snp1.3` (Sujato có dịch; đã đọc đối chiếu các khoá kệ) và các công thức chú giải đã dịch ở Mahāniddesa (`mnd1`, `mnd3`, `mnd5`–`mnd9`), Cūḷaniddesa (`cnd3`, `cnd5`, `cnd7`, `cnd8`, `cnd10`, `cnd13`, `cnd15`–`cnd17`, `cnd19`, `cnd20`) và `ps1.3`, `ps1.4`. Phần chú giải riêng của `cnd23` (danh sách tà mạng `148.3`, ba trường hợp xảo trá `212`–`216`, các loại biện tài `229`–`231`, các đoạn về vị ở `284`) không có bản Anh nào để đối chiếu.

  **Dùng lại tiền lệ.** Đã dò toàn tầng Việt (dn, mn, sn, an, kn): **568** khoá Pāli của bài (bỏ thẻ in đậm, gộp khoảng trắng) có cặp trùng nguyên văn với khoá ngoài bài, tổng cộng **4.624** cặp (nhiều khoá ngắn lặp lại ở hàng trăm bài). Dùng lại nguyên văn bản dịch có sẵn ở **497** khoá; có **1.510** cặp mà bản Việt trong tầng khác với bản ở đây, phần lớn là các câu ngắn lặp (`Taṁ kissa hetu?` có 563 khoá, 13 cách dịch trong tầng) hoặc khác văn cảnh; tôi giữ cách dịch của bài gần nhất cùng công thức (`mnd1`, `mn13`, `mn129`, `sn35.243`, `dn10`, `cnd10`). Nguồn dùng lại nhiều nhất: `mnd1:48`–`65` (hiểm nguy, ba kẻ thù bên trong), `mn129` (địa ngục), `mn13` (nguy hại của dục), `sn35.243` (thấm nhiễm), `dn10` (hộ trì các căn), `mnd3:18`–`20` (lời nguyện tinh tấn), `mnd7:24`–`25` (xuất gia, độc cư), `cnd8:64` (sự đắm say), `ps1.4:60`–`62` (tám hành). **Trong chính bài:** 195 nhóm Pāli trùng nguyên văn (2.713 cặp, sau khi bỏ thẻ in đậm); cả 195 nhóm bản Việt giống hệt (0 nhóm khác). Những chỗ bản Việt ở đây khác tiền lệ có chủ ý: `130.4` (`dhīro` là *bậc trí*, không phải *anh hùng* của `cnd15:3.4`), `63.3` (Pāli bớt hai từ `mārāmisaṁ`, `māragocaro` so với `cnd5:13.2`), `171.1` (Pāli bớt `bhātāpi bhātarā vivadati` so với `mn13:11.1`), `272.7` (xem bất định).

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `paccekasambuddha` → *Độc Giác Phật* (17 khoá cùng chữ trong tầng; *bậc Độc Giác* 8, *Phật Độc Giác* 3); `paccekabodhi` → *giác ngộ Độc Giác* theo `pe2`, `kp8`.
  - `eko` → *một mình*; chơi chữ `X-ti eko` (`5.2`, `12`, `13`, `15`–`17`) dịch sát chữ *… nên là một mình*, không giải thích thêm. `khaggavisāṇakappo` → *như tê giác một sừng* theo `snp1.3`.
  - `iddhipāda` → *như ý túc* (305 khoá tầng; `thần túc` 85; trong cnd/mnd/ps: 42 so với 30); `aṭṭhaṅgiko maggo` → *Thánh đạo tám chi* (cnd/mnd: 30 so với 1 *tám ngành*; toàn tầng: 105 so với 199, nên đây là phạm vi gần nhất); `sammappadhāna` → *chánh cần* (172 khoá).
  - `nīvaraṇa` → *triền cái*; `āvaraṇa` (kệ `294.1`) → *chướng ngại*; `saṁyojana` → *kiết sử*; `upakkilesa` → *ô nhiễm*.
  - `sneha` → *yêu mến* (nhất quán trong bài, kể cả kệ `294.3`/`297.1`); `makkha` → *chê bai* (theo kệ; `mnd1:49.2` dịch *gièm pha*); `visattikā` → *sự đắm say* (`cnd8:64`); `kasāva` → *cáu bẩn*; `loluppa` → *sự thèm thuồng*.
  - `nipaka` → *sáng suốt* (vd `sn6.13:3.2`, `sn1.23:2.3`); trong danh sách đồng nghĩa có cả `nipaka` lẫn `buddhimā` (`135.1`, `138.1`, `141.1`) thì `buddhimā` dịch *có giác tuệ* để khỏi trùng; ở danh sách không có `nipaka` (`79.2`, `136.10`, `324.2`) giữ *sáng suốt* theo `cnd13:22.2`.
  - `kuhana` → *xảo trá*, `kuhanavatthu` → *trường hợp xảo trá*; `lapana` → *nịnh hót*, `nemittikatā` → *gợi ý để cầu lợi*, `nippesikatā` → *hạ người khác để cầu lợi* theo `dn28:12.2`.
  - `tiracchānakathā` → *chuyện phù phiếm* (24 khoá trong tầng, vd `dn25`).
  - `tasā`/`thāvarā` → *loài run sợ*/*loài vững chãi* (`snp3.9`, `dhp405`, `mn98`); `tasitataṇhā` → *tham ái run sợ* (0 tiền lệ).
  - `saṁsagga` → *giao du*; `santhava` → *sự thân cận*; `apekkhā` → *sự quyến luyến*; `serī` → *tự do*; `paṭibhāna` → *biện luận/tài biện luận*, `paṭibhānapaṭisambhidā` → *vô ngại giải về biện tài*; `niyāma` → *sự chắc chắn* (`tha-ap2:30`), không phải *chánh định* của `snp1.3:21.2`.
  - Bạn: `mitta` *bạn bè*, `sandiṭṭha` *người quen*, `sambhatta` *bạn thân thiết*, `sahāya` *bạn đồng hành* theo `mnd7:42.2`; trong kệ `sahāya` giữ *bạn bè* như `snp1.3`.

  **Số Pāli.** `soḷasānaṁ` = **16** (`355.1`: mười sáu Bà-la-môn; `353`–`354` liệt kê đủ 16 tên: Ajita, Tissametteyya, Puṇṇaka, Mettagū, Dhotaka, Upasīva, Nanda, Hemaka, Todeyya, Kappa, Jatukaṇṇi, Bhadrāvudha, Udaya, Posāla, Mogharāja, Piṅgiya); `aṭṭhasataṁ taṇhāvicaritaṁ` = **108** (8 + 100, `25.6`); `vīsativatthukā` = **20**, `dasavatthukā` = **10**, `dvāsaṭṭhi` = **62** (60 + 2; `26.2`–`26.3`, `206.1`, `206.7`); `sataṁ vā sahassaṁ vā satasahassaṁ vā` = **100**, **1.000**, **100.000** (`30.3`); `yojanasataṁ` = **100** do-tuần (`36.3`); `catukkaṇṇo catudvāro` = 4 góc, 4 cửa (`35.1`); `sattaratano … aṭṭharatano` = **7** hoặc **8** `ratana` (`198.1`, đơn vị giữ nguyên Pāli); `ekūnavīsatimo` = **19** (`352.6`); `dasa saṁyojanāni` = **10** và danh sách `252.2` đếm đủ 10; `dasasu disāsu` = **10** hướng (8 + trên + dưới, `340.10`); `bāttiṁsa tiracchānakathā` = **32** (`162.1`, xem bất định). Các danh sách đã đếm khớp: 19 bộ phận cơ thể ở `23.7`, 30 phương cách tà mạng ở `148.3`/`149.2` (cùng số mục ở hai khoá), ba lần tám hành (`18.2`, `18.21`–`18.30`, `19.2`–`19.9`), 10 ví dụ về dục ở `248.3`, 24 trò chơi thân ở `86.5`, 9 mục kinh ở `229.5`. Không có `navuti`, `tiṁsakappasahassa`; không có cụm số chưa phân xử được ngoài `162.1`.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `162.1`: Pāli nói `bāttiṁsa tiracchānakathā` (32) nhưng danh sách dẫn ở `161.5` (và `dn1`) chỉ có 27 mục; Việt dịch đúng chữ *ba mươi hai*, không đếm khớp.
  2. `272.7`: bản Pāli ghim đọc `adhibhū anadhibhūto` (đảo so với `sn35.243:5.18` đọc `adhibhūto, anadhibhū`) ở đoạn nói về người bị thấm nhiễm; dịch sát chữ *là kẻ chế ngự, không phải kẻ bị chế ngự*, nghĩa tự mâu thuẫn trong ngữ cảnh. `275.7` (người không thấm nhiễm) đọc đúng.
  3. `284.8` `akuṭakaṁ` (có vẻ lỗi chép của `akaṭukaṁ`) dịch theo nghĩa *không cay*; `284.2`, `284.12` vị `lambika` không phân xử được (0 tiền lệ), giữ Pāli.
  4. Từ hiếm, 0 tiền lệ, chọn nghĩa gần nhất: `korajika` (`216.1`, giữ nguyên Pāli), `pīṭhamaddikatā` *thói khúm núm hầu hạ* (`148.3`), `cāṭukamyatā` *lời ton hót*, `muggasūpyatā` *lời nói quanh co như canh đậu*, `pāribhaṭyatā` *dỗ dành bế ẵm trẻ con* (theo `mil7.2.5`), `āyoga` *dây đeo* (`215.11`), `uddaṇḍa` *lều*, `aḍḍhayoga` *nhà nửa mái*, `māḷa` *nhà tròn* (`215`, `266`), `dhammakaraṇa` *ống lọc nước* (`122.1`, `215.6`), `madanabhaya` *nỗi sợ say sưa* (`60.2`), `khettaja` *con sinh trong ruộng* (`4.4`), `jāgu`, `indagu` giữ Pāli, tên nhạc cụ ở `87.2` (`bherī`, `ālambara`, `ḍiṇḍima`, `calimaka`, `kerakā`, `daddarī`) giữ Pāli; `masāragalla`, `kudrūsaka`, `varaka` giữ Pāli.
  5. `23.8`/`24.4` `abhinandati abhivadati abhipattheti anuppādeti anubandhati rāgabandhanaṁ`: dịch *rāgabandhanaṁ* là tân ngữ của `anubandhati` (*đeo bám sự trói buộc của tham*); cũng có thể đọc là một danh xưng đứng riêng.
  6. `150.1` `ete aladdhā anavajjabhojī`: đọc `ete` là các bạn đồng hành, `anavajjabhojī` là người độc hành (khớp `snp1.3`); `118.1` chuỗi `sahitā ārādhitā ajjhottharitā pariyāditā paṭinissatā` dịch *đã chịu đựng, đã chinh phục, đã áp đảo, đã chiếm ngự, đã dứt bỏ* (nghĩa `ārādhitā` ở đây không chắc).
  7. `ekāyanamaggaṁ gato` (`5.2`, `13.1`) → *đã đi trên con đường trực tiếp* theo `mn10`, `dn22`, `cnd21`, dù `eko` đứng liền sau cho thấy cũng có thể là *độc nhất*.
  8. `281`/`278.2`: `sañchannapatto yathā pārichattako` (lá phủ dày) khác `sañchinnapatto … koviḷāro` (lá rụng) ở `126.2`; `snp1.3:30.2` dịch cả hai thành *lá rụng*. Bài này theo Pāli từng khoá.
  9. `202.2`, `202.7`: `yāvatānanda` (đọc như `so vatānanda` của `mn122`), dịch theo `mn122:3`–`4`.
  10. `213.2` `pāpiccho icchāpakato` → *có ác dục, bị ham muốn chi phối*; `213.14` `dhutavādo` → *chủ trương hạnh đầu đà* (0 tiền lệ).

  **Điều đáng báo cho người biên tập (ngoài lát, không sửa).** (a) `snp1.3:19.1`–`19.2`: bản Việt của `snp1.3` đặt nội dung của `sañjātakhandho padumī uḷāro` (*thân hình to lớn, ưa hoa sen, cao quý*) vào dòng 19.1 và nội dung của `nāgova yūthāni vivajjayitvā` (*đã từ bỏ cả đàn*) vào dòng 19.2: hai dòng bị hoán vị. (b) `snp1.3:15.2` dịch `vācābhilāpo abhisajjanā vā` là *lời nịnh hót hoặc lời xúc phạm*, trong khi lời giải của `cnd23` (`162`) định nghĩa là *ba mươi hai chuyện phù phiếm* và *vướng mắc thuộc tham ái và kiến*; ở đây dùng *chuyện trò hoặc sự vướng mắc* (như `tha-ap2:24.2`). (c) `snp1.3:21.2` *chánh định* cho `niyāmaṁ`, `snp1.3:32.3` *luyến ái* cho `sneha` (trái *yêu mến* ở `snp1.3:2`), `snp1.3:35.1` *thiền chỉ* cho `jhāna`: ba chỗ khác cách chú giải. (d) `mnd1:49.2` dịch `makkho` là *gièm pha* còn `snp1.3:22.2` là *chê bai*. Chưa đọc đối kháng các khoá còn lại của các bài ấy.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (2018/2018, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` và ngoặc đơn khớp Pāli từng khoá (0/2018 lệch); dấu lược `…` khớp Pāli từng khoá (0/2018 lệch; 136 khoá `…pe…`; ba khoá Pāli kết `….`); 0 khoá rỗng; NFC; không khoảng trắng thừa; không thẻ HTML trong bản Việt; Pāli lọt sang Việt chỉ gồm tên riêng, tên loài/vật phẩm (`nāga`, `koviḷāra`, `pārichatta`, `Verambhā`, `ratana`, `harītakī`, `masāragalla`, `sāli`, `kudrūsaka`, `varaka`) và lemma chơi chữ.

