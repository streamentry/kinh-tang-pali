  Tiêu đề: `:0.3` Vibhaṅga 16 → "Nhóm 16"; `:0.4` Samāropanahāravibhaṅga → "Nhóm Gom Góp Hướng Dẫn" theo bảng `X-hāravibhaṅga` → "Nhóm X Hướng Dẫn" (`ne7`, `ne8`, `ne11`–`ne13`, `ne16`, `ne18`); `samāropana` → "gom góp" theo danh sách mười sáu phương thức `ne2:1.2` và `ne2:4.4` (2/2 khoá). `ne35:1.1` và `ne35:3.6` dịch cùng từ là "gán ghép" (2 khoá); không lấy theo vì `ne35` cũng dịch `hārasampāta` là "tương hợp hành tướng", lệch khỏi khuôn "Nhóm Phương Thức X" của `ne20`–`ne34`.
  Tiền lệ dùng lại: Pāli trùng nguyên văn với phần còn lại của tầng gồm 8 khoá (`:0.1`, `:0.2`, `:4.1`, `:4.2`, `:5.2`, `:8.8`, `:8.14`, `:13.1`); `:4.1` và `:4.2` trùng cả `dhp183:1`–`:2` lẫn `dn14:3.28.6`–`:7`. `:0.1`, `:0.2`, `:8.8`, `:8.14` giống bản đã có ("Netti"; "Phần Giải Thích" ở `ne7`, `ne8`, `ne11`; "Do nguyên nhân nào?" ở `ne8:2.3`, `ne8:3.3`). `:13.1` dùng nguyên văn `ne35:4.1`; trong khi 6 tệp Netti khác (`ne7`, `ne8`, `ne12`, `ne13`, `ne16`, `ne18`) mở bằng "Bởi vậy, Tôn giả … nói" — đây là điểm lệch nhỏ giữa `ne35` và phần còn lại, ghi nhận ở đây. `:4.1` theo `dhp183:1` và `dn14:3.28.6` ("Không làm mọi điều ác"); `:4.2` theo `dhp183:2` ("thành tựu các thiện pháp"), còn `dn14:3.28.7` dịch cùng Pāli là "thành tựu các điều lành" (khác, 1 cặp). `:4.3` và `:4.4` có Pāli khác `dhp183:3`/`:4` ở chính tả (`Sacittapariyodāpanaṁ` so với `Sacittapariyodapanaṁ`; `sāsanan”ti` so với `sāsanaṁ`), nên dịch riêng nhưng giữ cùng cách nói. `:5.2` `Tīṇi sucaritāni` trùng `dn33:1.10.10`, nơi dịch "Ba thiện hành:" (khác, 1 cặp); `sucarita` → "thiện hạnh" (92/211 khoá có từ; "hành thiện" 13, "diệu hạnh" 8, "thiện hành" 7). Tổng số khoá Pāli trùng đã dò ngoài bài: 8; bản Việt khác ở 2 (`:4.2` so với `dn14:3.28.7`; `:5.2` so với `dn33:1.10.10`).
