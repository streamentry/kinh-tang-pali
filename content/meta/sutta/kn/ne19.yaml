  Thuật ngữ đã đo: `padaṭṭhāna` → "nền tảng ứng với" (57 khoá ở `ne2`, `ne7`, `ne23`, `ne30`; chỉ "nền tảng" ở 10 khoá `ne7`, `ne11`, `ne35`) — dùng "nền tảng ứng với" khi có sở hữu cách đi kèm (`:5.1`, `:6.1`, `:2.1`–`:2.3`, `:3.1`, `:6.16`) và "nền tảng" trơn khi chỉ là lời chốt `idaṁ padaṭṭhānaṁ` (`:5.4`, `:5.8`, `:5.9`, `:5.10`, `:6.5`, `:6.8`, `:6.11`, `:6.14`), theo `ne7:4.3`. `vevacana` → "ngữ đồng nghĩa" (`ne13`, `ne29`). `bhāvanā` → "tu tập"; `pahāna`/`pajahati`/`pahīno` → "từ bỏ" (`ne11:2.3` "giới hạnh từ bỏ", `ne12:2.1`–`:2.10` "đã được từ bỏ"; toàn tầng `pajahati` → "từ bỏ" 145/156 khoá, "đoạn trừ" 4); không dùng "đoạn trừ" như `ne28:2.2` để cùng một gốc từ không bị tách đôi trong một bài. `vipallāsa` → "sự đảo lộn" (28/53 khoá; `ne7:1.4`, `ne20`, `an4.49`; "điên đảo" 2, "đảo ngược" 2). `taṇhā` → "tham ái" (theo `ne7`, `ne18`, `ne20`). `vanaṁ`/`vanatho` → "rừng"/"bụi rậm" (`dhp283:3` "rừng và bụi rậm ái dục"; `sn14.16:9.1`, `iti78:6.1` "bụi rậm"; `thag5.5:4.4`, `thig9.1:4.4`, `thig9.1:5.4` dịch "vướng mắc" nhưng đó là nghĩa phái sinh). `pañca kāmaguṇā` → "năm dục" (142 khoá). `nimittaggāha` → "nắm giữ tướng" (49 khoá); `anubyañjanaggāha` → "nắm giữ chi tiết" theo `mn33:7.2`, `sn35.235:1.4` ("tướng phụ" 2 khoá). `saṁyojana` → "kiết sử" (406/804 so với "trói buộc" 331). `sīlakkhandho`/`samādhikkhandho`/`paññākkhandho` → "giới uẩn / định uẩn / tuệ uẩn" (toàn tầng 27/53, 18/28, 19/30 khoá); phạm vi gần nhất (`ne18:6.1`, `ne31:4.2`) ghi "uẩn giới / uẩn chánh định / uẩn trí tuệ" (2 tệp) — chọn dạng đa số toàn tầng vì `samādhikkhandha` là "định uẩn" chứ không phải "chánh định". `samatha`/`vipassanā` → "sự định tĩnh"/"sự quán" (`ne2:11.2`, `ne2:13.1`, `ne23:2.3`–`:2.4`, `ne26:2.2`–`:2.3`; `ne28:2.2` có "chỉ và quán"; toàn tầng "chỉ" 13 / "định tĩnh" 6 trên 102 khoá). `cetovimutti` → "tâm giải thoát" (259/432), `paññāvimutti` → "tuệ giải thoát" (93/239). `sekkhaphala`/`asekkhaphala` → "quả hữu học"/"quả vô học"; `anāgāmiphala` → "quả Bất lai" (32/44 khoá); `arahattaṁ` → "quả A-la-hán" (`dn33:1.11.117`, `dn34:1.5.43`). `tedhātu` → "ba giới" theo bộ ba `kāmadhātu`/`rūpadhātu`/`arūpadhātu` ở `dn34:1.4.35`, `dn33:1.10.29` ("dục giới, sắc giới, vô sắc giới"). `indriya` → "tinh tấn căn / tuệ căn / niệm căn / định căn" (`sn48.51`). `paññābala` → "tuệ lực" (9/61), `adhipaññāsikkhā` → "tăng thượng tuệ học" (`dn33:1.10.115` "học tập về tăng thượng tuệ"), `dhammavicayasambojjhaṅga` → "trạch pháp giác chi" (44/49), `upekkhāsambojjhaṅga` → "xả giác chi" (113/121), `hirī` → "sự hổ thẹn" (48/55 khoá). `bodhipakkhiya` → "trợ giác ngộ" (`sn48.51`, `dn27:30.1`). `bhāvanāpāripūriṁ gacchanti` → "đi đến sự viên mãn của tu tập" (`mn118:30.2`–`:34.2`). `kāye kāyānupassī viharati ātāpī sampajāno satimā vineyya loke abhijjhādomanassaṁ` → "sống quán thân nơi thân, nhiệt tâm, tỉnh giác, có niệm, gạt bỏ tham muốn và ưu phiền đối với đời" (`dn16:2.12.5`, `dn22:1.9`, `dn34:1.5.8` — cùng công thức; 105 khoá có "kāye kāyānupassī viharati"). Chuỗi bốn nhóm ở `:9.2`–`:12.1`: `upādāna` → "dục thủ / kiến thủ / ngã luận thủ" và `kāyagantha` → "kết thân" ("tham muốn", "sân hận", "giới cấm thủ", "chấp thủ 'chỉ có chân lý này'") theo `dn33:1.11.170`, `dn33:1.11.172`, `sn45.173:1.3`, `sn45.174:1.3`; `yoga` → "ách dục / ách hữu / ách kiến / ách vô minh" (`dn33:1.11.166`, `dn34:1.5.23`, `sn45.172:1.3`; "ách" 174/564 khoá); `āsava` → "dục lậu / hữu lậu / kiến lậu / vô minh lậu" (`dn33:1.10.43`); `anāsavo` → "không còn lậu hoặc" (140/175); `ogha` → "dòng lũ dục / hữu / kiến / vô minh" (`dn33:1.11.164`, `dn34:1.5.19`; toàn tầng "dòng lũ" 63 / "bộc lưu" 73); `salla` → "mũi tên" (129/292); `visaṁyutto` → "thoát khỏi" (10/58); `āhāra` → "đoàn thực / xúc thực / thức thực / ý tư thực" (`dn33:1.11.121`, `sn12.63:2.1`; `manosañcetanā` → "ý tư" theo `dn33`); `viññāṇaṭṭhiti` → "trú xứ của thức" (`dn15:33.1`); `rūpadhātu`/`vedanādhātu`/`saññādhātu`/`saṅkhāradhātu` → "sắc giới / thọ giới / tưởng giới / hành giới" (`sn22.53:3.1`, `sn22.3:5.5`–`:5.6`); `pariññā` → "liễu tri" (248/407); `chandāgati`/`dosāgati`/`mohāgati`/`bhayāgati` → "đi theo thiên vị vì ưa thích / sân hận / si mê / sợ hãi" (`dn31:5.3`; `dn33:1.11.128` có "hành động thiên lệch"). `anusaya` → "tùy miên" (33/63 khoá) và `pariyuṭṭhāna` → "sự hiển hiện" theo `ne18:3.5`, `ne18:5.1` (nhóm Netti gần nhất dịch cặp này là "tiềm ẩn"/"hiển hiện" ở 3 khoá; toàn tầng `pariyuṭṭhāna` → "ám ảnh" 10/31, "xâm chiếm" 2, "đầy tràn" nhiều khoá ở `an10.84`, `an10.86`). `muni` → "bậc Mâu-ni" (77/265 khoá, "ẩn sĩ" 48). `mahākaccāyano` → "Tôn giả Mahākaccāyana" (`ne7`, `ne8`, `ne12`, `ne13`, `ne16`, `ne18`, `ne35`; có tệp viết `Mahākaccāyano`; "Trưởng lão" ở `ne11:7.4`). `Tenāha bhagavā` → "Bởi vậy, Đức Thế Tôn nói" theo `ne16:4.5`, `ne16:7.3`, `ne16:11.2`, `ne20:7.10`.
  Dấu lược: Pāli không có `…`, `…pe…` hay `(…)` ở khoá nào của bài (0/81), nên Việt cũng không có. Dấu nháy khớp Pāli từng khoá: 0/81 khoá lệch (nháy kép “ ” ở `:1.2`, `:4.1`/`:4.4`, `:6.6`, `:6.7`, `:6.15`, `:8.2`, `:9.2`–`:12.1`, `:14.1`/`:14.4`); không có nháy đơn. Các khoá có lemma dạng `Xti` không nháy ở Pāli (`:8.3`–`:8.6`) nên Việt cũng không thêm nháy. Bốn nội dung đảo lộn viết "bất tịnh là tịnh", "khổ là lạc", "vô thường là thường", "vô ngã là ngã" khớp `ne20:4.2`, `:5.1`–`:5.4`, `:5.7`, `:5.8`; riêng `:12.1` `idaṁsaccābhinivesakāyagantha` không có nháy ở Pāli nên viết "kết thân cố chấp rằng chỉ có điều này là chân lý" (không dùng nháy như `dn33:1.11.170`).
  Số Pāli: Vibhaṅga 16 → "Nhóm 16"; `catubbidhā` = 4 ("bốn loại", liệt kê đúng 4 mục: nền tảng ứng với, ngữ đồng nghĩa, tu tập, từ bỏ); `tīṇi sucaritāni` = 3 ("ba thiện hạnh", liệt kê thân–lời–ý); `pañca kāmaguṇā` = 5; `cha ajjhattikabāhirāni āyatanāni` = 6 ("sáu nội xứ và ngoại xứ"); `catunnaṁ indriyānaṁ` = 4 (tinh tấn, tuệ, niệm, định ở `:8.3`–`:8.6`); `cattāro satipaṭṭhānā` = 4; `catūsu` = 4; `cattāro sammappadhānā` = 4; `cattāro iddhipādā` = 4; `pañcindriyāni` = 5; `tedhātu` = ba giới; năm chi ở `:6.7` (mắt, tai, mũi, lưỡi, thân). Không có số lớn, không có `tiṁsa`/`sahassa`.
  Bất định đã ghi nhận (không thêm vào thân kinh): (1) `:1.2`, `:14.1` `yaṁmūlā` — quan hệ `yaṁ`…`te` đọc theo mạch `:2.1`–`:2.2` là "những pháp nào có chung một gốc"; chữ "một" là cách hiểu của người dịch từ tính tương liên của `yaṁ`, không có số từ riêng ở Pāli. (2) `:2.1` `Ekasmiṁ padaṭṭhāne yattakāni padaṭṭhānāni otaranti` — `otaranti` dịch "đi vào" (nghĩa "được bao hàm"); tầng chưa có dạng `otarati` trong ngữ cảnh Netti (`ne2:1.2` dịch `otaraṇo` là "dẫn đưa", `ne31` là "vượt bậc"). (3) `:2.2` `āvaṭṭe hāre` dịch "nhóm quy căn hướng dẫn" theo `ne2:1.2` ("quy căn") và khuôn `X-hāra` → "nhóm X hướng dẫn". (4) `:6.7` `aho cakkhu…` là lời thán, dịch "ôi mắt, ôi tai…" mà không thêm tính từ khen. (5) `:7.11` danh sách đồng nghĩa của `paññā` có `tīraṇā`, `santīraṇā`, `hirī` — hiếm và lạ trong chuỗi này (`ne13:6.4` dịch `tīraṇā` là "bến bờ bên kia", có vẻ nhầm với `tīra`); ở đây dịch "sự thẩm xét", "sự thẩm xét kỹ" và "sự hổ thẹn" theo nghĩa từ vựng, không chắc đúng nghĩa trong bối cảnh này; `sabbaṁ, idaṁ vevacanaṁ` đọc là "tất cả những điều này là ngữ đồng nghĩa" (sabbaṁ bổ nghĩa `idaṁ vevacanaṁ`). (6) `:10.1` `bhavūpādāna` — tên gọi này lệch bộ bốn thủ thường gặp (`kāma`, `diṭṭhi`, `sīlabbata`, `attavāda`); ở đây dịch "hữu thủ" theo từng thành tố, và `:11.1` không còn `sīlabbatupādāna` mà thay bằng `diṭṭhupādāna` (đúng như Pāli). (7) `:9.2`–`:12.1` `rūpūpikā viññāṇaṭṭhiti` — dịch "trú xứ của thức có sắc làm chỗ dính mắc" theo `sn22.53:1.3` ("lấy sắc làm nơi dính mắc"); `rūpūpikā` không có dạng sẵn trong tầng. (8) `:9.2`–`:12.1` `rūpadhātu` v.v. dịch "sắc giới", "thọ giới", "tưởng giới", "hành giới" theo `sn22.53:3.1` — ở đây là yếu tố thuộc uẩn chứ không phải cõi, dù cùng tên với "sắc giới" của ba cõi. (9) `:6.13` `pariyuṭṭhānaṁ` dịch "sự hiển hiện" theo `ne18` (đối cặp với "tùy miên"); có cách dịch khác là "ám ảnh" (xem trên). (10) `:14.6` `hāravibhaṅgo` dịch "phần phân tích các hướng dẫn" (khác với tiêu đề `:0.3` dịch `vibhaṅga` là "Nhóm", theo khuôn đã có ở `ne7:0.3`). (11) `:6.6`–`:6.7` `nimittaggāho "itthī"ti vā "puriso"ti vā` dịch "tướng “người nữ” hay “người nam”" — chủ ngữ là sự nắm giữ tướng, không thêm ý "tướng chung".
