notes: |-
  Không có bản Anh ở commit ghim (0/9 khoá): dịch từ Pāli một mình. Tiền lệ: nơi nương tựa 68, kêu than (ja145:1.3).
  Bất định đã ghi (lý do ambiguity 8.6): (1) dubbhi đọc là động từ hãm hại/phản bội, suy từ dubbhati và văn cảnh, không có chỗ nào khác để kiểm; (2) người nói là nữ, suy từ sā (1.3) và dukkhaphuṭṭhāya giống cái; (3) pitā đọc là cha, tāyitā là đấng che chở — hai vai trong cùng một người. Tên chuyện giữ toàn dạng Pāli Paṇṇikajātaka ở tiêu đề/kết vì nghĩa paṇṇika (người bán rau?) không chắc trong chức năng tên.

  Quyết định hội đồng biên tập 2026-10-16: A13 — :1.4 (bỏ dấu chấm thừa sau ngoặc kép); C1 — :0.4, :2.1, translationTitle (bỏ đuôi jātaka, giữ phiên âm tên riêng); C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
