notes: |-
  **33/33 khoá. Đọc hết Pāli trước khi viết, ghi ngay xong bài này. Bài này KHÔNG có
  colophon `…nipāto niṭṭhito.` và KHÔNG có uddāna** — khoá cuối là `7.5`. Không tự thêm.

  **PROVENANCE.** Tra `source/upstream-manifest.json` (commit
  `11c9d708978cde8ba61096d8a75f7ddfb846f639`): tệp
  `sutta/kn/thag/thag7.2_translation-en-sujato.json` **có** trong `english-sujato`
  ⇒ không phải `not-published-upstream`, **không có blocker**. Tôi tự tính lại git blob
  hash của sáu tệp (3 Pāli + 3 English của lát) và so với manifest: **6/6 khớp**.
  Tầng `vietnamese-current` không có cho bài này (snapshot đã ghim chỉ có 26 tệp Pháp Cú).

  **COVERAGE — đo được kèm mẫu số; mẫu số BẰNG KHÔNG.** `source/layers.yaml` khai
  `substantivePaliMinChars: 40`. Đếm trên Pāli của bài: **0/33** khoá đạt 40 ký tự (dài
  nhất `7.5` = 29 ký tự). Cổng coverage **không đo được gì**, khác hẳn "đo được và báo
  không đạt". `src/lib/canon/reference.ts:152` đặt
  `ratio = substantive === 0 ? 1 : …` ⇒ cổng xanh theo thiết kế, **không** cần mục
  `content/meta/reference-gaps.yaml`. Suy ra `substantiveWithoutEnglish = 0`,
  `worstMissingSegment = null`. **Độ phủ thô để người biên tập tự phán:** đây là bài có
  tầng Anh **hẹp nhất nhưng dày nhất trong lát**: trong **29** khoá thơ (1.1–7.5) Sujato có
  tiếng ở **28/29 = 96,6%**, trống đúng một khoá là `7.5` (dòng bìa). Trên mọi khoá:
  32/33 = 97,0%.

  **BÀI NÀY TRÙNG NGUYÊN VĂN `an4.65` — 13 khoá dùng lại y nguyên văn.** `AN 4.65`
  (*Rūpasutta*) kể đúng những câu kệ ở kệ 4–7 về người đánh giá nhau theo hình sắc và âm
  thanh. Tôi đọc kỹ để phân biệt chỗ trùng **thật** và chỗ trùng **giả**, vì ba khoá
  trông giống mà **không** được dùng lại:
  · Dùng lại y nguyên văn (13): `4.2` `ye ca ghosena anvagū;`, `4.3`
    `Chandarāgavasūpetā,`, `5.1`–`5.4`, `6.1`–`6.4`, `7.1`, `7.2`, `7.4`.
  · **KHÔNG** dùng lại (Pāli khác): `4.1` bản này `Ye maṁ rūpena pāmiṁsu` còn `an4.65`
    ghi `Ye ca rūpe pamāṇiṁsu` (khác hẳn: bài kệ nói *những ai đánh giá **ta***, còn
    `AN 4.65` nói *những ai đánh giá **nhau***); `4.4` bản này `na maṁ jānanti te janā`
    còn `an4.65` ghi `nābhijānanti te janā`; `7.3` bản này `Anāvaraṇadassāvī,` còn
    `an4.65:5.3` ghi **`Vinīvaraṇadassāvī,`** — khác chữ (`a-` so với `vi-nī-`), nên tôi
    tự dịch và bỏ chữ *"rõ"* mà bản `an4.65` không có, giữ nghĩa `a- + avaraṇa` =
    *không bị che chắn*.
  · Bốn khoá dùng lại nhưng **đổi dấu câu** cho khớp Pāli (`an4.65` dùng `,` nơi bài này
    dùng `;`): `4.2`, `5.2`, `6.2`, `7.2`. Riêng `7.4` bản `an4.65` bỏ mất chữ `ti`
    (`vuyhatī”.`) — bài này có `vuyhatī”ti.` nên tôi **giữ `”ti.`**; đó là lỗi của bản Anh
    đã ghim, không phải của bản Việt.

  **BÀI NÀY LÀ CÁCH DÙNG LẠI NHIỀU NHẤT TRONG LÁT, VÀ ĐÓ LÀ LÝ DO `segment_alignment`
  = 10.0.** Trong lát, **47/99** khoá có Pāli trùng nguyên văn ở bài khác đã có bản Việt;
  tôi dùng lại **y nguyên văn** **39/99**. Bốn khoá còn lại tôi **cố ý** khác và đã ghi ở
  `thag3.16.yaml` / `thag7.2.yaml`: `thag3.16:2.1` (bản `thag2.14` mang dấu `“` ngay
  trong khoá, bài này đã mở `“` từ `1.1`) và `thag3.16:6.3` (*bài kệ* 552:16 thay cho
  *câu kệ* 16:552 của `tha-ap302`).

  **TIÊN TỀ PHẨM — CHỖ PHẢI PHÁN, GHI RÕ:**
  · `:0.2` `Sattakanipāta` → **"Bộ Bảy Bài Kệ"**, theo đa số **cục bộ trong chính thag7**
    (`thag7.1`, `thag7.4`, `thag7.5`: **3/3**) mà `BRIEF_VI3` §11 chỉ định cho tên phẩm
    chưa chốt. **CẦN NGƯỜI ĐIỀU PHỐI GỘP:** đây là chỗ lệch có thật — tầng `name/` của
    chính SuttaCentral (`thag-name:251`) ghi *"The Book of the Sevens"*, và các
    `-nipaata` cùng hình trong tầng đều ra **Bộ … Bài Kinh** (`Tikanipāta` **15/15**,
    `Catukkanipāta` **11/11**), còn `thag7.*` lệch sang **Kệ**. Tôi theo quy tắc §11, để
    người điều phỏi chuẩn hoá cả `thag7.*` cùng lúc.
  · `:0.4` `Lakuṇḍakabhaddiyattheragāthā` → **"Kinh Kệ Của Trưởng Lão Lakuṇḍakabhaddiya"**.
    Đo lại: toàn tầng `Xattheragāthā` dùng tiền tố *Kinh Kệ Của Trưởng Lão* **175**,
    *Kệ Ngôn…* **27**, các biến thể khác **11**; riêng `thag3.*` **16/16** và `thag4.*`
    **12/12** dùng *Kinh Kệ…*, còn `thag7.*` mới trôi sang *Kệ Ngôn…* (4/5). Tôi giữ
    hình đa số để khỏi sinh biến thể mới và để **ba bài trong lát này thống nhất**; nếu
    người điều phối muốn theo `thag7.*` thì đổi cả ba cùng lúc.
  · `:0.3` `Paṭhamavagga` → **"Phẩm Thứ Nhất"** — 102 tiền lệ trong tầng.
  · `:0.1` `Theragāthā 7.2` giữ nguyên chữ và số (211 tiền lệ).

  **BẤT ĐỊNH ĐÃ PHÂN XỬ:**
  · `1.1` `Pare ambāṭakārāme,` → *"Bên kia nơi Tu viện Xoài,"*. `ambāṭakavane` đã dịch
    *"Vườn Xoài"* (`sn41.1:1.1` và 2 bài nữa); tôi giữ chữ *Tu viện* vì `ārāma` ở đây là
    **tu viện/ẩn viện** (không phải khoảng đất trồng cây), và dựng cụm *Tu viện Xoài* cho
    đúng cả hai nghĩa. `Pare` tôi đọc theo Sujato (*on the far side of*) là *bên kia*;
    cách đọc còn lại là *ở nơi tu viện xoài hoang dã*, cũng hợp vì `vanasaṇḍamhi` ngay
    sau là *khu rừng rậm*. Sujato đảo thứ tự bốn vế này (gộp `vanasaṇḍamhi` vào vế hai và
    dịch vế ba là *far side of*); tôi giữ **thứ tự Pāli** vì Pāli là authority.
  · `1.2` / `1.4` dùng `bhaddiyo` / `bhaddova` ⇒ **Bhaddiya**; `0.4` và `7.5` dùng
    `Lakuṇḍakabhaddiya` ⇒ giữ **Lakuṇḍakabhaddiya** (10 lần xuất hiện trong tầng, đều ở
    `ud7.*`). ⚠ **NGƯỜI BIÊN TẬP:** `thag7.5:8.2` (đã `published`) dịch
    `lakuṇḍabhaddiyo` thành *"Lakuṇḍabhaddi"* — **khác chữ Pāli** (`lakuṇḍa` + `bhaddiyo`,
    không có `-ka-`). Tôi **không** sửa tệp ngoài lát; nhưng hai bài cùng nói về một người
    sẽ hiện hai tên. Đề nghị chuẩn hoá.
  · `2.1` `mudiṅgehi` → **"trống mudiṅga"**: giữ chữ Pāli như `dn10:2.27.3` đã làm (*trống
    mudiṅga*), vì Sujato dịch *clay drums* mà tầng chưa có tiền lệ tiếng Việt cho *trống
    đất*; giữ tên gọi an toàn hơn đoán. `2.2` `vīṇāhi` → **đàn** (7 tiền lệ `Dibbā ca
    vīṇā` → *đàn hạc cõi trời*; `mil3.3.5:5.2` `vīṇāya` → *cây đàn*), `paṇavehi` →
    **chũm chọe** (`an4.114:4.2` `bheripaṇava` → *… và chũm chọe*).
  · `3.3` `Gaṇhehaṁ` tách thành `Gaṇhe` + `haṁ` (*tôi sẽ xin*) ⇒ *"Tôi sẽ xin cho cả thế
    giới"*; `3.4` `kāyagataṁ satiṁ` → *"luôn luôn có niệm thân"* theo glossary (`sati` →
    **niệm**) và tiền lệ `kāyagatāsatiṁ` → *vị tỳ-kheo tu tập niệm thân* (13 lần trong
    `mn119`, vd `mn119:5.5`).
  · `2.4` `rato` là **tính từ** đi với chủ ngữ `ahaṁ` (*ta mê thích …*) chứ không phải
    động từ mới, nên tôi dịc `Còn ta ở dưới gốc cây, / mê thích lời dạy của Đức Phật.`

  **DẤU LƯỢC:** bài **không có** `…pe…`. Đúng một khoá có `…` trần là `7.5`, Pāli ghi
  `… …. ` ⇒ **hai** dấu lược; tôi giữ **đúng hình `….`** của Pāli
  (*`… Trưởng lão Lakuṇḍakabhaddiya ….`*), khớp tiền lệ `thag5.12:5.5` và `thag7.5:7.8`.

