notes: |-
  Đã đọc HẾT p66.txt (959 dòng, cả 7 bài) trước khi viết chữ nào. Lát gồm 7 bài / 315 khoá;
  mỗi bài dịch trọn vẹn đúng số khoá trong `all`, không có khoá `(…)`.
  
  MỆNH ĐỀ ĐO LẠI (đều có số đếm, không đoán).
  `mil` `:0.1` giữ Pāli: đo trên **200** tệp `mil*` đã có khoá `:0.1` → `Milindapañha`
  **189**, `Mi-lan-đà Vấn Đạo` 8, `Mi-tiên Vấn Đáp` 3. Chọn 189.
  `:0.2` `Arūpadhammavavatthānavagga` → `Phẩm Xác Định Pháp Vô Sắc`: trong **14** bài
  `mil3.7.*` đã có bản Việt thì **13** dùng đúng câu này (chỉ `mil3.7.5` dùng khác), và
  `mil3.7.1` cùng `mil3.7.3` chưa có tệp. Đây cũng là câu dùng cho `mil3.7.16:0.2`.
  `:0.3` → `3. Câu hỏi về sự nỗ lực đoạn tận khổ.` và `:6.1` → `Câu hỏi về sự nỗ lực
  đoạn tận khổ, thứ ba.`, theo đúng hình 14 bài anh em: `Vāyāmakaraṇapañha` → `Câu Hỏi Về
  Sự Nỗ Lực` (`mil3.4.5:0.3`), `Dīghaṭṭhipañho dasamo.` → `Câu hỏi về thời gian dài, thứ
  mười.` (`mil3.7.10:4.1`); trong 14 khoá `:0.3` của `mil3.7.*`, **9** có dấu chấm câu và
  **5** không, nên giữ dấu chấm. `vāyāma` dịch `nỗ lực` và `pahāna` dịch `đoạn tận`.
  
  `bhante` VÀ `mahārāja` — ĐO RIÊNG, GHI CẢ HAI SỐ.
  `bhante`: lấy ở mức **khoá** (khoá Pāli có `bhante` và bản Việt không rỗng). Trong chính
  `mil3.7` (10 bài cùng phẩm) → `tôn giả` **47** / `ngài`-`bạch` **5**; toàn tầng `mil` →
  `tôn giả` **393** / `ngài` **203**. Đa số rõ ràng, dùng `thưa tôn giả` và `bạch tôn giả`
  (một lát khác đo ra *thưa tôn giả* 215+37 — con số đó là đếm chuỗi `thưa tôn giả` thô
  trong cả tầng, hiện là **348**; còn đếm ở mức khoá thì `tôn giả` vẫn đa số).
  `mahārāja` → `Đại vương`: **1.352** lần so với `Đại đức` **93** trong toàn tầng `mil`
  (trong riêng `mil3.7`: 51 so với 11) — ghi cả hai số vì có hai cách đang cùng tồn tại.
  
  TIỀN LỆ DÙNG LẠI (Pāli trùng nguyên văn, đếm được).
  `Rājā āha—` → `Vua nói:` (44 lần trong `mil`; riêng `mil3.7` 11 so với 2).
  `Thero āha—` → `Trưởng lão nói—` (12; `mil3.7` hòa 2:2 nên lấy đa số toàn tầng).
  `“Na hi, mahārājā”ti.` → `“Không có, này Đại vương”ti.` (4, `mil3.5.1:1.3`).
  `“Bhiyyo opammaṁ karohī”ti.` → `“Xin hãy xét một thí dụ nữa”ti.` (18, `mil3.1.12:3.1`).
  `“Āma, bhante, atthī”ti.` → `“Vâng, thưa tôn giả, có”ti.` (`mil3.6.2:1.6`).
  `“Kallosi, bhante nāgasenā”ti.` → `“Khéo lắm, thưa tôn giả Nāgasenā.”` (65).
  Toàn bộ `mil3.4.5` là tiền lệ gần nhất và **song song** với `mil3.7.3` mục 3–4: cùng
  thí dụ giếng nước (`mil3.4.5:2.2`), cùng thí dụ đói (`mil3.4.5:3.2`), cùng cách đào hào /
  xây thành / cổng thành / tháp canh / thu lương thực và tập voi – ngựa – xe – cung – giáo
  (`mil3.4.5:4.2`) — nên `:2.6` và `:2.8` dùng lại nguyên văn bản Việt đó, chỉ khác ở
  `pākāraṁ cināpeyyātha` (đắp thành bằng đất thay vì `kārāpeyyāsi` xây thành) và ở
  `:4.2` (`sāliṁ vapāpeyyāsi` gieo thay vì `ropāpeyyāsi` gieo, `dhaññaṁ` không có trong bản
  này).
  
  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  (1) `:2.13`, `:3.7`, `:4.7` — Pāli trùng nguyên văn `“Natthi, bhante”ti.` có **5** bản
  Việt đã có, tất cả đều là `“Thưa không, bạch ngài.”`. Tôi theo **hình câu** đó nhưng đổi
  `ngài` → `tôn giả`, vì đo được `tôn giả` đa số 47:5 ngay trong `mil3.7` (xem trên). Nếu
  người biên tập muốn dính hẳn với tiền lệ thì phải sửa cả 5 tệp kia, không sửa riêng lát
  này.
  (2) `:2.4` `paṭirājāno paccatthikā paccāmittā paccupaṭṭhitā` — **0 tiền lệ** trong tầng
  Việt; bốn từ này là bốn loại kẻ thù theo độ gần với thành. Tôi dịch `xâm lấn biên cương`,
  `láng giềng`, `thù địch`, `đã dồn tới bên cạnh`. `paccatthikā` trong `iti88` được dịch
  `đối thủ bên trong` (theo nghĩa nội tâm), nên ở đây phải đọc theo nghĩa ngoại đạo.
  (3) `paṭibāhanatthāyā` / `paṭibāhanatthāya` (`:2.11`, `:2.14`, `:3.5`, `:3.8`, `:4.5`,
  `:4.8`) — **0 tiền lệ**; dịch `để ngăn chặn`. `paṭibāhana` là chặn giữ, khác
  `pahāna` = đoạn tận, nên hai động từ này cố ý khác nhau trong bản Việt.
  (4) `asanta` + `anāgata` (`:2.3`, `:2.14`, `:3.8`, `:4.8`) — `asanta` = cái không có,
  `anāgata` = cái chưa đến; tôi dịch `chưa có, chưa đến`. Riêng `:2.11`/`:2.12`/`:3.6`/
  `:4.6` chỉ có `anāgata` nên dịch `của thời vị lai`, theo `mil3.2.9:1.3` (`quá khứ …
  vị lai … hiện tại`).
  (5) `atipaṇḍitā` (`:2.3`, `:2.14`, `:3.8`, `:4.8`) — dịch `hết sức hiểu biết`; 0 tiền lệ
  cho cụm này.
  (6) `kinti` (`:1.10`) — dịch `làm sao cho …`, theo `mil3.4.5:1.3` (`kinti imaṁ dukkhaṁ
  nirujjheyya` → `làm sao cho khổ này được chấm dứt`). `etadatthāya vāyamāmā` → `đó là lý
  do ngươi nỗ lực`, cùng cách với `mil3.4.5:1.4` (`Đó là lý do chúng tôi xuất gia`).
  (7) `pokkharaṇi` (`:3.2`) — dịch `cái ao`; bản song song `mil3.4.5:2.2` không có mệnh đề
  này nên không có tiền lệ.
  `technical_integrity` đặt 9.6 vì không có ai rà lại bằng con người.
