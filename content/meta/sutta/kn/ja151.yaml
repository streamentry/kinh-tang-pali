notes: |-
  **Cổng kỹ thuật của kho CHƯA chạy.** Đợt này lát được cấm chạy `npm run validate|test|check|build`,
  nên tôi **không** thể tuyên bố technical gate pass; `technical_integrity` đặt **9.6** chứ không
  phải 10.0 và bốn lệnh đó để người điều phối chạy. Tự kiểm riêng bằng script trên **MỌI** khoá
  (không chỉ khoá ≥ 40 ký tự mà `kiểm()` của `_hvi.py` quét): đủ số khoá của cả bài, đúng segment
  ID, không rỗng, NFC, không trùng nguyên văn Pāli, dấu lược khớp Pāli từng khoá, ngoặc kép cân
  trên cả bài, không `(…)`, không sót `pe…`, không Pāli lọt. Kết quả: SẠCH, 0 lỗi trên 236 khoá
  của cả lát.

  **Dấu lược — theo §10, không tự diễn giải.** Pāli có `…pe…` thì bản Việt giữ **một** `…` và
  **không** viết ra phần bị lược. Pāli viết đủ thì viết đủ; tôi **không** nén bằng `…` ở bất kỳ
  khoá nào. Hai khoá lệch dấu câu cuối câu (`cp33:1.3`, `cp5:1.1`: Pāli có dấu phẩy, bản Việt
  không) là **cố ý theo đúng tiền lệ `cp28:1.1`** — bản Việt của tầng không nhất thiết giữ dấu
  phẩy ở vế kệ đầu câu.

  **Pāli trùng nguyên văn ở bài khác — đếm bằng script, dùng lại nguyên văn đã có.** Quét toàn
  tầng Pāli gốc (5.764 tệp `*_root-pli-ms.json`, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn**
  từng khoá của lát này: **3 cặp trùng** (đếm theo cặp khoá-của-tôi × uid-khác, chỉ tính văn
  bản ≥ 20 ký tự sau chuẩn hoá). Trong đó **3 khoá (3/3) cặp đã có bản Việt ở bài khác và tôi dùng lại
  nguyên văn** (xem danh sách dưới); phần còn lại đều là bài chưa có bản Việt nên tôi đặt mới.
  **22 cặp dùng lại được đối chiếu từng chữ: 20 khớp tuyệt đối, 2 khớp phần thân nhưng khác
  hậu tố** — `ja151:2.1` và `ja178:2.1` phải mở lại dấu nháy kép vì Pāli mở nháy đúng ở đó (vế kệ
  đầu của bài kệ mới), nên đó là bắt buộc của chia khoá chứ không phải dịch khác.

  **Dùng lại (nguyên văn, không dịch lại):**
  · `2.1`–`2.3` trùng **nguyên văn** `dhp223:1`–`3` (và `2.4` cũng trùng `dhp223:4`) — Pháp Cú đã
    xuất bản — nên tôi **dùng lại nguyên văn**: *Lấy không sân thắng sân, / lấy lành thắng không lành,
    / lấy bố thí thắng xan tham, / lấy chân thật thắng dối trá.* Ba cặp `2.1`–`2.3` khớp **tuyệt đối**;
    `2.4` cũng vậy, chỉ khác dấu nháy kép vì Pāli mở nháy đúng ở `2.1` (vế kệ đầu của bài kệ mới).
    Đây là lý do `sādhu` / `asādhu` ở `1.3`–`1.4` tôi dịch *lành / không lành* — **khớp đúng `dhp223:2`
    ngay trong cùng một bài**.

  **Thuật ngữ mới của lát, đặt mới kèm lý do:**
  · `Dukanipāta` → **Tập Kẻ Đau Đớn**: đa số **52/80** bài `Dukanipāta` đã có trong tầng, chốt
    theo đa số. ⚠ Cách đa số này **không nhất quán với `Ekakanipāta`** (142/142 đều là *Bộ Một Bài Kinh*) —
    hệ quả tất yếu của việc theo đa số mỗi mục một cách, tôi không tự chuẩn hoá. 11 bài ghi *Bộ Hai Bài
    Kinh* và 2 bài ghi *Tập Hai* đều là thiểu số, tôi không theo.
  · `Daḷhavagga` → **Phẩm Tàn Tật** (8/9 bài đã có).
  · `Rājovādajātaka` → **Kinh Lời Vua**: `rājovāda` là *lời của vua / lời đàn hặc vua*. Tôi dịch nghĩa
    chữ thay vì phiên âm `Rājovāda`, vì đây là **tên bài tựa** (khác `Mahāgovinda` hay `Sāma` là tên
    riêng) — cùng lựa chọn mà `cp5` đã có với `Akitti`.
  · `Daḷha` → **người nghèo** (không giữ dấu Pāli trong thân bài, nhưng `Daḷhavagga` ở `0.3` thì giữ
    nghĩa *Tàn Tật* theo đa số).

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh:**
  · **Hai câu đầu khó nhất của cả lát, tôi dịch theo mặt chữ và ghi thẳng ra đây.**
    `Daḷhaṁ daḷhassa khipati` (1.1): `khipati` là *vội vã / sai nhanh*, nhưng **tân ngữ của nó không
    hiện ra** trong câu — không rõ là gửi, cho hay tới. Tôi đọc là *người nghèo vội vã tới bên người
    nghèo*, vì đó là cách đọc khớp với hai câu kế tiếp (kẻ yếu tìm bạn kẻ yếu, kẻ mềm tìm bạn kẻ mềm).
    Đó là **suy luận của tôi, không phải chữ của nguồn**, và bài không có bản Anh để đối chiếu.
    `balliko mudunā muduṁ` (1.2) là dạng câu **không đủ dấu câu** trong Pāli (`mudunā muduṁ` lặp hậu tố
    nơi chốn nhưng tân ngữ thứ hai vắng mặt); tôi dựng lại thành *kẻ yếu tìm bạn kẻ yếu, kẻ mềm tìm
    bạn kẻ mềm*.
  · `Sādhumpi sādhunā jeti` (1.3) dịch là *người lành cũng bị người lành chinh phục*. Mặt chữ `jeti` là
    *chinh phục / thắng*, và dấu phủ định ở câu kế làm cho câu này thành **bị chinh phục bởi người cùng
    loại**. Có thể ý là *người lành cần một người lành để chinh phục*; tôi giữ mặt chữ vì đó là chữ.
  · `maggā uyyāhi sārathī` (1.6, 2.6): `sārathī` là *kẻ cầm cương*, `maggā` là *ra khỏi đường*; tân ngữ
    bị bỏ. Tôi dịch *kẻ cầm cương hãy đuổi hắn ra khỏi đường*. Nháp tôi ghi *ổng* — giọng thiếu lịch
    sự, không hợp kinh văn — đã sửa thành *hắn*.
  · Vì không có bản Anh, mọi chỗ ở trên chỉ đối chiếu được bằng chính bài này và bằng `dhp223`; đó là lý
    do `triangulation` 7.8 và `ambiguity_integrity` 8.4.

  VIỆC BIÊN TẬP của người điều phối (PR sau lát này): khoá `ja151:0.2` mang Pāli
  `Dukanipāta` được đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên**
  của chính SuttaCentral tại commit đã ghim (`source/upstream-manifest.json` →
  `english-sujato`, **123** tệp `name/`) ghi `ja-name:167.ja-dukanipata` →
  *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai**
  trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`;
  song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of the Ones"*.
  Tầng trước đợt sửa có **17** cách cho `Dukanipāta`. Lát này đã theo đa số cục bộ
  (52/80) nên không tự sinh cách mới — nhưng đa số đó sai theo tầng tên. `terminology`
  giữ nguyên: đây là chuẩn hoá, không phải lỗi riêng của bài.
