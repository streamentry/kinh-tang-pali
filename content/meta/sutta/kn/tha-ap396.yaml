notes: |-
  Dịch trực tiếp từ Pāli root vì tầng tham khảo tiếng Anh (Sujato) không có tệp cho tha-ap396 tại commit đã ghim, và không có bản Việt hiện hành cho uid này. Chỉ Pāli làm chứng cứ; các điểm dưới đây là chỗ Pāli cho phép hơn một cách hiểu hoặc chưa có tiền lệ trong tầng.
  Tên bài `:0.3`: Pāli `Madhudāyakattheraapadāna` không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli bắt đầu bằng số); `translationTitle` bằng đúng giá trị `:0.3`. Mở đầu tên: đo toàn tầng tha-ap thấy Bài Kệ Tuyên Ngợ/Ngợi khoảng 233, Bài Kệ Tuyên Ngôn 118, Ký Sự 101 (Tuyên Ngợ là lỗi chính tả); ở phạm vi gần (tha-ap370–420) Tuyên Ngợ/Ngợi 15, Ký Sự 12, Tuyên Ngôn 1. Hai phạm vi cho đa số khác nhau; chọn Ký Sự vì đây là cách dịch đúng của apadāna, không mang lỗi chính tả, và các bài liền kề (tha-ap390, tha-ap391, tha-ap400, tha-ap404) dùng đúng dạng này. Cần biên tập phán một lượt cho cả cuốn. Tên phẩm `Phẩm Pilindavaccha` theo tha-ap400. Tên riêng Madhudāyaka giữ dạng Pāli (tiền lệ tầng: 95 tên giữ dạng Pāli của -dāyaka, 38 tên dịch nghĩa).
  Số đếm tự tính: `tiṁsa` = 30 (khớp `Sattatiṁsati` = 37), `sahassa` = 1000, nên `Tiṁsa kappasahassāni` = 30 × 1000 kiếp = ba mươi ngàn kiếp (8.3); `Tiṁsa kappasahassamhi` và `Tiṁsakappasahassamhi` cùng quy về ba mươi ngàn kiếp (9.1, 17.1). Tiền lệ tầng cho nhóm này: ba mươi (ngàn/nghìn) 16 khoá, ba nghìn 3 khoá, ba trăm nghìn 1 khoá. Bất định cần biên tập phán: hướng dẫn của đợt dịch từng ghi `tiṁsa` = 3 (tức ba nghìn kiếp), trái với phép đo trên tầng; bài này theo `tiṁsa` = 30. Tính nhất quán nội bộ ủng hộ 30: tha-ap79 đặt Phật Sumedha ở `Tiṁsakappasahassamhi`, và bài này cũng đặt việc dâng cúng Phật Sumedha (17.1) lẫn lời thọ ký Gotama (9.1) ở cùng mốc ba mươi ngàn kiếp. `caturaṅgule` = catu 4 + aṅgula = bốn ngón tay (15.1); `catutthaṁ` = thứ tư (22.1).
  Bất định: (1) 3.1 `uppātagamane` dịch diễn tiến của điềm lạ, coi `gamana` là sự diễn ra; cũng có thể hiểu là sự bay lên hoặc đi lại, Pāli không phân xử được. (2) 1.4 `itihāsaṁ salakkhaṇaṁ` dịch truyền thống lịch sử cùng các tướng, theo tiền lệ dn (`itihāsa` = truyền thống lịch sử) và tiền lệ `lakkhaṇa` = tướng; `salakkhaṇaṁ` là cùng với đặc tướng của nó. (3) 12.2 `kucchiyā ca suduttarā` dịch khỏi bụng mẹ, nơi rất khó vượt qua; `suduttarā` là rất khó vượt qua (ja504:16.4 `nadī suduttarā`), ngữ pháp không rõ nó bổ nghĩa cho `kucchiyā` hay là mệnh đề riêng; `ca` không dịch riêng. (4) 15.2 `sañchanne` (phủ kín) không rõ phủ cái gì; dịch giữ nguyên mơ hồ. (5) 15.3 `maṇḍaparukkha` đọc là `maṇḍapa` + `rukkha`, giữ `maṇḍapa` không dịch vì không có tiền lệ về loại cây hay cây có mái che. (6) 16.1–16.2 `majjhe mahante hīne ca bhave` hiểu là ba tính từ đi với `bhave` (mọi cõi hữu trung, cao, thấp), nên đặt `bhave` ở 16.2. (7) 10.1 `tassa dhammesu dāyādo` hiểu `tassa` là Đức Gotama, và người kế thừa là người dâng mật (chủ ngữ bị lược trong Pāli). (8) 12.3 `tatrāpi` dịch ngay cả ở đó. (9) 9.1 locative `Tiṁsa kappasahassamhi` trong lời thọ ký tương lai dịch trong ba mươi ngàn kiếp nữa; chữ nữa thể hiện thì tương lai của `bhavissati`. (10) 10.4 dấu `ti` của `nibbāyissatināsavo’` không dịch riêng, theo đa số tầng; dạng dịch còn lại trong tầng là vô lậu mà đi vào Niết-bàn (4 khoá), chọn dạng sát Pāli hơn.
  Đại từ: người kể là vị trưởng lão nói tôi; lời Đức Phật ở 7–10 dùng Ta; nhóm đệ tử là họ.
  Công thức kết `Itthaṁ sudaṁ … abhāsitthāti` dịch theo nhóm đa số (những bài kệ này) thay vì nhóm số ít (bài kệ này). Các khoá lược `…pe…` (19.2, 20.2) giữ đúng một `…`; Pāli không có `(…)` ở khoá nào. Các công thức 18.x, 19.x, 20.x dùng lại nguyên văn bản dịch đã có của tầng (Bốn vô ngại giải; tôi đã làm tròn lời dạy của Đức Phật; nay không còn tái sinh nữa; mọi cõi hữu đều đã được nhổ sạch; Tất cả các lậu hoặc đã đoạn tận).
  Đã dò tiền lệ cho 41 khoá có Pāli trùng nguyên văn với tầng tha-ap: 34 khoá dùng lại nguyên văn bản Việt, 7 khoá khác (cùng nghĩa hoặc khác bối cảnh). Trong chính bài có 3 cặp Pāli trùng nguyên văn (13.4 và 17.4; 16.4 và 18.4; 19.2 và 20.2), cả 3 cặp Việt giống nhau. Đã kiểm 83/83 khoá khớp tập khoá và thứ tự Pāli, nháy đơn ‘ ’ và nháy kép “ ” khớp Pāli từng khoá (nháy kép mở ở 1.1, đóng ở 20.3; nháy đơn mở ở 7.1, đóng ở 10.4), NFC, không khoảng trắng thừa, không Pāli lọt sang bản Việt ngoài tên riêng và từ maṇḍapa.
  Lệnh còn phải chạy ở môi trường có quyền chạy cổng: `npm run validate`, `npm test`, `npm run check`, `npm run build`; vì vậy technical_integrity đặt 9.6 và chưa tuyên bố technical gate pass.
