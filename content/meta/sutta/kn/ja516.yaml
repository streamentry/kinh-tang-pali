notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja516_root-pli-ms.json` (189/189 khoá, đúng thứ tự Pāli). Bài gồm 4 khoá tiêu đề, 46 khổ kệ bốn dòng (`1.x`–`46.x`) và khoá chốt `47.1`; tầng Pāli đã ghim không có phần văn xuôi.
  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho thân bài ja516 (`ja516_translation-en-sujato.json` vắng mặt; tầng `english-sujato` chỉ có 83 tệp `ja`: ja1–79, ja126, ja159, ja466, ja534), nên đây là `not-published-upstream`, không phải `not-synced`. Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú. Lớp lấp `english-project` của dự án chưa có tệp cho bài này. Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.5 (≤ 8.0). Tầng `name/` của Sujato chỉ có tiêu đề: `ja516` "The Monkey Betrayed", `ja407` "The Great Monkey", `ja-kimchandavagga` "What Is Your Desire?", `ja-timsanipata` "The Book of the Thirties"; tôi chỉ dùng chúng để đối chiếu tên bộ, tên phẩm và tên bài (không phải thân kinh). Không dùng bản tóm lược tiếng Anh hay bản dịch bên thứ ba nào khác; người nói và bối cảnh suy ra từ chính kệ.
  - Coverage English:
    Mẫu số = 0: không khoá nào của bài đạt ngưỡng 40 ký tự theo `source/layers.yaml` (khoá dài nhất 27 ký tự; bài toàn kệ dòng ngắn, bỏ khối `:0`). Cổng coverage vì vậy không đo được gì ở bài này; đó không phải "không cần ghi nhận". Sujato phủ 0 khoá, `english-project` 0 khoá, `vietnamese-current` 0 khoá; cả 189 khoá dựa vào Pāli một mình, kèm tiền lệ Việt của kho và bối cảnh trong chính bài. Vì vậy không tuyên bố đã đối chiếu English cho bài này.
  - Phân loại & tiêu đề:
    + `0.1` "Jātaka"; `0.2` "Bộ Ba Mươi Bài Kinh" và `0.3` "Phẩm Mong Muốn Gì" dùng lại nguyên văn `ja511`–`ja514` (Tiṁsanipāta, Kiṁchandavagga; khớp tên Sujato "The Book of the Thirties", "What Is Your Desire?").
    + `0.4` "6. Kinh Mahākapi" và `47.1` "Kinh Mahākapi, thứ sáu." giữ nguyên dạng phiên âm của `ja407:0.4` ("2. Kinh Mahākapi") vì Pāli tiêu đề giống hệt (`Mahākapijātaka`); hai bài là hai truyện khác nhau (ja407 là truyện về cầu khỉ; ja516 là truyện khỉ cứu người), phân biệt bằng số thứ tự và uid. Số 6 khớp `chaṭṭhaṁ` ở `47.1` và vị trí thứ 6 trong phẩm (sau `ja515` là thứ 5, trước `ja517` là thứ 7). Khuôn "Kinh X, thứ sáu." theo `ja517:35.1`, `ja511:33.1`.
  - Người nói và nháy:
    Tầng Pāli ghim chỉ có kệ, nên người nói suy từ cách xưng hô trong kệ: vua Bārāṇasī (không nêu tên) hỏi vị Bà-la-môn bệnh tật ở `3.4`–`8.4` (nháy kép mở ở `3.4`, đóng ở `8.4`); người Bà-la-môn kể lại từ `9.1` đến hết bài (nháy kép mở ở `9.1`, đóng ở `46.4` bằng `”ti.` của Pāli, bỏ `ti`); bên trong lời kể, lời con khỉ nói ở `32.1`–`37.4` nằm trong nháy đơn `‘…’` (mở ở `32.1`, đóng ở `37.4`). Các đoạn con khỉ nói ở `18.3`–`19.2`, `22.1`–`22.4`, `25.3`–`26.4` Pāli không đặt nháy nên Việt cũng không đặt; ai nói thì nhận ra từ cách xưng hô. Quy ước xưng hô: người Bà-la-môn xưng "tôi" và gọi con khỉ "ngài"; con khỉ xưng "ta"; ban đầu gọi người ấy "ông" (`18.3`–`19.2`, `32.1`–`32.4`) rồi "ngươi" từ `33.1` (`re purisa`, lời trách) đến hết lời nói; vua gọi Bà-la-môn "ngươi" và xưng "ta" ở `3.4`–`8.4` (`5.4` `passāmi`).
  - Pāli trùng nguyên văn:
    Dò 188 khoá có Pāli đủ dài (≥ 8 ký tự sau khi bỏ dấu câu, nháy, khoảng trắng) với toàn bộ Pāli `kn` đã ghim có bản Việt (73.729 khoá trong kho chính cộng các bài đã dịch ở worktree, không tính chính bài này): 21 khoá có ít nhất một dạng trùng ở bài khác. Dùng lại nguyên văn (13): `0.2`, `0.3` (`ja511`–`ja514`), `1.2` (`ja478:13.2`, "bậc làm giàu có cho xứ Kāsi"), `2.4` (`dhp395:2`, `ja496:9.2`), `6.2` (`pv19:1.2`, `thag15.1:11.2`), `9.1`–`9.2` (`ja515:35.1`–`35.2`, cùng câu nói "Taggha te ahamakkhissaṁ, yathāpi kusalo tathā"), `11.4` (`pv19:9.4`), `19.4` (`cp10:11.2` dạng "ta đã nói lời này" đổi ngôi thành "tôi"), `26.1` (`tha-ap339:11.1`, `tha-ap521:17.1`), `42.4` (`tha-ap486:6.2`), `45.2` (`ja409:7.2`, `ja514:6.2`), `45.4` (`ja493:17.4`). Cố ý khác tiền lệ (8/21): `15.2` ("đầu chúi chân ngược" lấy từ `ja40:1.2`, bỏ phần "ta ngã nhào" vì Pāli khoá này không có); `19.2` (`ja489:19.4` là lời thưa với bậc tôn kính, ở đây con khỉ nói với người đang bị nạn); `20.3` (`dhp337:1`, `pv19:17.1`, `ja475:12.1` nói với nhiều người, ở đây chỉ một người nghe nên dùng "ngài"); `22.3` (`ja400:2.3` "ta sẽ nhấc nó lên", đổi tân ngữ thành "ông" vì người được nhấc là người); `23.1` (`cp11:4.1`, `cp19:4.1`, `cp22:11.3` "Nghe lời nói ấy", thêm "của nó" cho đủ chủ thể); `44.3` (`tha-ap297:1.3`, `tha-ap330:4.3`, `tha-ap342:10.3` viết "thọ hưởng nghiệp lành"; ở đây quả xấu nên dùng "nếm trải" cho `anubhomi`); `44.4` (`pv41:3.4` là lời nói của nhiều người, ở đây là việc xấu của một người); `45.1` (`ja409:7.1` "Điều ấy ta nói với các ngươi, hỡi các bậc", đổi ngôi người nói).
    `ja452:7.3`–`7.4` (Pāli `Na tassa sākhaṁ bhañjeyya, mittadubbho hi pāpako`) hiện được dịch "đừng mong quả của nó / vì kẻ bạn xấu thì khó dựa vào" khác hẳn `ja493:17.3`–`17.4` ("không nên bẻ cành của cây ấy, vì kẻ phản bạn là kẻ xấu ác") và khác Pāli (`sākhaṁ bhañjeyya` = bẻ cành; `mittadubbho` = kẻ phản bạn); đây là lỗi ngoài lát, chỉ báo, không sửa.
    Trong chính bài: 2 nhóm Pāli trùng nguyên văn: `21.4` = `25.2` (`nisabho etadabravi`) và `22.4` = `24.4` (`giriduggata vegasā`). Cả hai nhóm dịch giống nhau, 0 cặp Việt khác (chỉ khác dấu câu cuối `.` / `;` theo đúng Pāli).
  - Số Pāli:
    `sattāhaṁ` (11.3) = satta 7 + aha "ngày" = 7 → "bảy ngày"; `dasa rattiyo` (16.4) = 10 → "mười đêm" (với `anūnā` = "đủ", theo `anūnadasamāsāni` → "Đủ mười tháng" ở `bv3:21.3`, `bv4:28.3`); `Ekaṁ … dutiyaṁ` (14.1–14.2) = 1, thứ 2 → "một quả … quả thứ hai"; `satta vassāni` (44.2) = 7 → "bảy năm"; `Eko` (10.1) = 1 → "một mình"; `Tiṁsa` (0.2) = 30 → "Ba Mươi"; `chaṭṭhaṁ` (47.1) = 6th → "thứ sáu", khớp "6." ở `0.4`. Không có số lớn, không có cụm số chưa phân xử.
  - Thuật ngữ (có đếm trên tầng):
    + `dhamanisanthata`: 2.4 "gầy gò, gân mạch lộ rõ" (3/11 khoá, gồm `dhp395:2`, `ja496:9.2`) và 6.2 "gầy gò, gân nổi chằng chịt" (6/11, gồm `pv19:1.2`, `thag15.1:11.2`), mỗi khoá dùng dạng khớp đúng Pāli trùng của nó.
    + `kilāsin`/`kilāsī` → "bạch biến" (`tha-ap338:13.1`, `tha-ap423:7.1`, `tha-ap530:9.1` "Bệnh cùi, nhọt, và bạch biến"); `kuṭṭhī` → "người cùi" (3/3 khoá có `kuṭṭhī`/`kuṭṭhaṁ` dịch "cùi").
    + `yakkha` → "dạ-xoa" (62/77 khoá `kn` có `yakkh-`; các dạng khác: "quỷ" 2, "ma" 2, "yaksha" 1).
    + `giriduggasmi` → "chốn núi non hiểm trở" (`ja472:9.3` viết "chốn núi non hiểm trở", `ja483:7.1` và `ja502:24.3` viết "núi non hiểm trở"; 3/4 khoá có `giriduggasm-`); `giriduggata` (22.4, 24.4) → "ra khỏi chốn núi non hiểm trở".
    + `khuppipāsasamappito` → "bị đói khát bủa vây" (3/4, `pv14:2.4`, `pv14:14.4`, `pv19:9.4`); `pubbalohita` → "mủ và máu" (4/7, `pv14:5.1`, `thag16.2:11.1`); `pariḷāha` → "nhiệt não" (13/27; 9 khoá viết "nóng"; `dhp90:4`); `ayoniso` → "một cách không như lý" (7/8, `tha-ap538:18.4`); `mittadubbho`/`mittaddu` → "kẻ phản bạn" (`ja493:17.4`; trong 6 khoá có `mittadubbh-`/`mittaddu`: 2 "phản bạn", 2 "phản bội bạn", 2 khác); `dubbhati` → "phản bội" (9/39 khoá có `dubbh-` viết "phản bội", 2 "hãm hại").
    + `kapi`/`vānara` → "khỉ" (21/30 khoá có `kapi`/`vānara`/`gonaṅgula`). Riêng `gonaṅgulo` (17.2, appositive đi sau `kapi` ở `17.1`) dịch "con voọc" để phân biệt với `kapi`; các khoá `thag1.113:1.2`, `thag11.1:5.2`, `thag18.1:20.2` (3/3) viết "khỉ" trong danh sách "khỉ và hươu nai", nơi không có `kapi` đứng cạnh. Cách đọc `gonaṅgula` = loài voọc (langur) theo nghĩa thông dụng của từ; trong tầng chưa có khoá nào dịch "voọc" (0 tiền lệ), nên đây là lựa chọn mới, chỉ giữ cho khoá này.
    + `nisabha` (21.4, 25.2) → "bậc ngưu vương" (`dhp422:1` dịch `usabha` là "bậc ngưu vương"; `tha-ap185:2.2` "chúa ngưu"); dạng ẩn dụ "bò đực đầu đàn", không thêm chữ "khỉ" vào chỗ Pāli chỉ nói `nisabho`.
    + `tinduka` giữ phiên âm "tinduka" (`ja503:13.1`); `beluva` → "bael" (`ja322:2.1`); `koviḷāra` giữ phiên âm vì không tra được tên thông dụng trong tầng (chỉ 1 khoá có từ này: `vv38:1.1` dịch cả cụm `Pāricchattake koviḷāre` là "cây San Hô cao lớn", không tách riêng `koviḷāra`).
    + `kāruñña` → "thương xót" (`cp16:7.1`); `kantāra` → "vùng hoang vắng" (`ja493:2.1`); `pātheyya`/`sambala` → "lương thực" (`dhp235:4`, `thag12.1:9.1–9.2`); `kicchagata` → "lâm vào khốn khổ" (`ja483:16.1` "lâm nạn"); `bhaddante` (voc.) → "thưa ngài"/"các vị" (`ja322:1.1` "thưa ngài", `ja409:7.1`); `irīṇe vivane` → "rừng hoang, nơi cằn cỗi, vắng vẻ" (`tha-ap318:1.3` "rừng hoang"; `ja220:1.2`, `ja483:16.2` "vắng/hoang vu").
    + Tên riêng giữ dạng Pāli: `Bārāṇasī` (9/9 khoá dùng dạng này), `Kāsi`, `Migājina`, `Mahākapi`.
  - Chỗ bất định (không thêm vào thân kinh):
    + `1.4` `migājinaṁ`: tôi đọc là tên một chỗ (nơi vua đi đến, ăn khớp `2.1` `Tattha` "ở đó"). Nghĩa đen là "da nai"; dạng này còn có ở `ja537:113.2` và `ja539:145.1` trong ngữ cảnh khác (tầng Việt chưa có khoá nào dịch chúng, 0 tiền lệ); chưa kiểm chứng được "Migājina" là tên một nơi cụ thể nên giữ phiên âm, không thêm chữ "khu săn" hay "rừng".
    + `2.3` `viddhasta` dịch "tàn tạ" (hư hại); `5.1` `vaṭṭanāvaḷi`: dịch "chuỗi vòng tròn" theo từ nguyên (vaṭṭa = tròn, āvaḷi = chuỗi, hàng), không có tiền lệ trong tầng (`vaṭṭan-` chỉ có ở `ja375:5.4`, `thig14.1:30.1` với nghĩa khác); `5.3` `kāḷapabba` dịch "cây đốt đen" theo từ nguyên (kāḷa = đen, pabba = đốt/khớp), chưa tra được loài cây nào, cũng có thể đọc là tính từ "có khớp đen" nói về `aṅgā`.
    + `3.3` `byamhito`: "bối rối" (nghĩa bối rối, lúng túng); `6.1` `ugghaṭṭapādo`: "chân trầy xước" (ugghaṭṭa = bị chà xát) và `tasito` = "khát" (có tiền lệ `cp4:3.1` "khát nước"; cũng có nghĩa "hoảng sợ" như `cp16:6.3`, chọn "khát" vì đi liền `chāto` "đói" ở `6.3`); `6.3` `ātattarūpo` "trông như bị nung nóng" (ātatta = bị nung); `7.1` `appakāro` "hình dạng tồi tàn": nghĩa chưa chắc.
    + `10.2` `mūḷho accasariṁ`: "mê lạc, đi quá xa" (accasariṁ từ atisarati "vượt quá"); `12.3` `abhilambanta` "chồm ra"; `13.1` `vātassita` "bị gió làm rụng" (cách đọc: quả rơi xuống do gió; vì người kể ăn quả rồi mới trèo lên cây ở `13.3` vì "chưa no"); `16.2` `na samapajjisaṁ` "không bị tổn hại" (samāpajjati = rơi vào trạng thái nào đó; cùng động từ ở `40.4` `samapajjatha` dịch "hóa ra"); `27.3` `pāpikaṁ diṭṭhiṁ` "quan điểm xấu ác" (diṭṭhi ở đây là ý nghĩ cụ thể ở `28.1`–`28.4`, không phải tà kiến giáo lý).
    + `21.3` `Silāya yoggaṁ katvāna`: "dùng tảng đá để thử sức", tôi đọc `yogga` theo nghĩa "luyện tập/thử" vì con khỉ cầm tảng đá nặng đi quanh núi trước khi bảo người trèo lên lưng (`21.1`–`21.2`). `ja483:8.2` dịch cụm gần giống (`Silāya yoggaṁ sarabho karitvā`) là "lấy tảng đá làm phương tiện"; nghĩa chưa phân xử được từ Pāli một mình, nên không tuyên bố chắc.
    + `27.1` `Evaṁ me parittātūna`: "Nhờ tôi canh giữ như vậy" (`me` = người kể; `parittā` = che chở/canh giữ): hình thái `parittātūna` hiếm, cách đọc theo ngữ cảnh `25.3`–`26.4` (con khỉ nhờ canh giữ rồi ngủ).
    + `32.1` `Māyyomaṁ kari`: tách `Mā ayyo imaṁ kari` ("xin ông đừng làm điều này") dù `kari` là hình thái quá khứ ngôi 3 dùng sau `mā`; `32.2` `tvañca nāmedisaṁ kari` nối tiếp thành "thế mà chính ông lại làm điều như thế"; `32.3` `dīghāvu`: đọc là vocative "hỡi người trường thọ", cũng có thể đọc "kẻ (nhờ ta) còn sống lâu"; `33.2` `tāvadukkarakāraka`: "kẻ đã làm việc khó làm đến thế" là lời mỉa (`ja513:33.4` dùng `dukkarakārako` theo nghĩa khen), chưa phân xử được mức mỉa.
    + `35.1`–`35.4` `Mā heva`: dịch "chớ để", giữ ở dạng cảnh báo, không đẩy thành lời nguyền; `39.1` `abhisatto` (bị nguyền) cho thấy người kể hiểu lời con khỉ như lời nguyền, nhưng chính Pāli ở `35.x` vẫn là hình thức cầu mong ngược; không thêm chữ "nguyền" vào `35.x`.
    + `36.4` `dissamānova santike`: "luôn ở gần, trong tầm mắt ta" (cách đọc theo ngữ cảnh `36.1`; chữ "luôn" lấy từ `-va`); `37.2` `mānusiṁ padaṁ` "nơi của loài người" (`pada` có thể là "chỗ/lối/dấu chân").
    + `40.1`–`40.4`: `santatto` cùng `rahado` là chủ ngữ "hồ nước" (nóng như lửa nung, nhuốm máu); `sabbo me samapajjatha` dịch "đối với tôi, toàn bộ đều hóa ra như vậy" (chủ ngữ ngầm hiểu là nước hồ).
    + `43.3` `Okkitā` "bị … xộc vào": hình thái hiếm, đọc là chủ ngữ số nhiều `itthiyo purisā ca` (đàn bà đàn ông bị mùi thối xộc vào); `43.4` giữ dạng lời quát không có nháy vì Pāli không đặt nháy.
    + `46.4` `nirayaṁ sopapajjatī`: "sinh vào địa ngục" (`so upapajjati`).
  - Phép kiểm tra:
