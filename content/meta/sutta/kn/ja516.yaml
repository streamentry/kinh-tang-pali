  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 63 khoá chênh lệch lớn nhất → khác nghĩa 0: sửa 0, giữ 57, bất định 6 khoá. Giữ sau khi phân xử bằng Pāli: 15.3–15.4 và 46.1–46.2 (bản mù đảo ranh dòng, cùng nghĩa), 6.1 `tasito` (khát nước, đi cặp với `chāto` đói; bản mù đọc "run rẩy"), 3.3 `byamhito` (bối rối/kinh ngạc, cùng nghĩa), 5.1 `Vaṭṭanāvaḷi` ("chuỗi hạt" theo `mn36:28.7`), 5.3 `Kāḷapabba`, 8.2 `avajjhaṁ aghātayi` ("giết hại" so "sai giết", cùng nghĩa), 21.3 `yoggaṁ katvāna` ("thử sức" so "tập cho quen", cùng hướng luyện tập), 25.1–25.2 `santo`, `nisabho`, 12.3–12.4, 16.2 (cùng nghĩa). Bất định: (a) 1.4 `migājinaṁ`: bản dự án đọc là tên nơi chốn, bản mù đọc là "đi săn thú"; từ này chỉ xuất hiện một lần trong snapshot đã ghim và không có truyện khung nên không phân xử được; (b) 22.4, 24.4 `giriduggata vegasā`: `vega` là sức mạnh hay tốc độ (tầng dùng "mạnh/sức" ở `ja359:2.2`, `ja400:1.4`; bản mù "nhanh chóng"), và `giriduggata` là cách tách (dạng `-to` kéo vì vần) hay hô cách (bản mù đọc hô cách; ở 24.4 chỉ đọc được là cách tách nên 22.4 giữ cùng); (c) 33.2 `tāvadukkarakāraka`: mức mỉa mai chưa phân xử (bản mù cũng đánh dấu chưa chắc); (d) 32.1 và 45.1 `bhaddante` ("thưa ngài" hay lời chúc), như đã ghi ở trên. Review đối kháng toàn bài (189 khoá): đã đọc từng cặp Pāli↔Việt, kiểm nháy, số (`sattāhaṁ` 7 ngày, `anūnā dasa rattiyo` đủ 10 đêm, `satta vassāni` 7 năm), xưng hô (`ta` của con khỉ khác `tôi` của người kể), thuật ngữ trong bài; không có lỗi nghĩa nào buộc phải sửa. Không có bản Anh hay bản Việt độc lập khác.

