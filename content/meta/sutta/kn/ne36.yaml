notes: |-
  Đợt 19, lát 114. Dịch trọn 293/293 khoá từ Pāli root đã ghim; không có khoá nào ngoài tập khoá Pāli. Bài là phần 5, Nayasamuṭṭhāna (nguồn khởi của các lối), của Netti: giải lại hai hạng người tính kiến và tính tham ái qua mười nhóm bốn (thực, đảo lộn, chấp thủ, ách, kết thân, lậu hoặc, dòng lũ, mũi tên, trú xứ của thức, thiên vị) và các đối nghịch của chúng, rồi ba cửa giải thoát, ba hạng người, hai hạng người. Không có Sujato và không có lớp english-project, nên đối chiếu độc lập chỉ có Pāli root cộng tiền lệ trong chính tầng Việt (các bài ne1–ne35 đã dịch, pe4, pe7, pe9; dn33, dn34, mn7, sn12, sn25, an4). Không có bản Việt hiện hành theo khoá; bản nguyên bài ở mục Tra cứu toàn văn không cấp text theo khoá, không dùng làm nguồn đối chiếu theo khoá.

  **Coverage English (đo thật).** Mẫu số 222 khoá Pāli có nội dung (từ 40 ký tự, bỏ các khoá tiêu đề :0); Sujato phủ 0/222; english-project 0; vietnamese-current vắng. Blocker noEnglishEditionUpstream là thật, không bù được bằng điểm; triangulation đặt 7,0.

  **Tiền lệ và Pāli trùng nguyên văn.** Đã dò toàn tầng Việt (khoảng 224 nghìn khoá): 16 khoá của bài có Pāli trùng nguyên văn với khoá ngoài bài, tạo 255 cặp. 180 cặp có bản Việt giống hệt; 75 cặp khác, gồm: các cụm lược `4.2`–`4.4` và `6.2`–`6.4` (Thọ …, tưởng …, các hành …) khác ở chữ đứng trước vì ngữ cảnh khác (sn22, mn44 có động từ đi kèm); `56.3` dùng lại pe9:30.3 và đổi "Trong đó" thành "Ở đây" theo khuôn các bài ne (142 khoá "Ở đây" so với 5 khoá "Trong đó"; pe4, pe7, pe9 dùng "Trong đó"); `59.24`, `59.28`, `59.30`, `59.32`, `59.38`, `59.42` chỉ khác dấu gạch ngang so với dấu hai chấm của dn33 và dn34, vì Pāli của bài này kết bằng gạch ngang (theo ne19:5.2 và ne21:37.6); `59.26` theo ne19:5.2 ("thiện hạnh") thay vì "thiện hành" của dn33; `59.29` chọn "tầm xuất ly" (dn33:1.10.15 và đa số tầng: 90 khoá "xuất ly" so với 20 "ly dục") thay vì "tầm ly dục" của pe7:3.2. Trong chính bài có 5 nhóm Pāli trùng nguyên văn (`3.2`, `5.5`, `6.16`; `4.2`, `6.2`; `4.3`, `6.3`; `4.4`, `6.4`; `4.5`, `6.5`), bản Việt giống hệt nhau ở cả 5; 0 cặp trùng nội bộ mà bản Việt khác.

  **Thuật ngữ, kèm số đếm.** hāra và vibhaṅga không xuất hiện trong thân bài. `naya` → "lối" (ne3, pe9); tên các lối: "vòng xoay hoan hỷ", "ba cánh sen", "đùa giỡn của sư tử", "nhìn khắp các phương", "móc câu" (ne3:18–22, pe9). `samuṭṭhāna` → "nguồn khởi" (pe9:63.1); tên chương `0.2` theo khuôn "N. …" của ne1–ne3 và pe4. `bhūmi` → "nền tảng" (ne6, pe4; ne3 và pe9 dịch "đất nền/vùng đất", không theo). `Tattha` → "Ở đây" (ne: 142 so với 5). `taṇhā` → "tham ái" (trong các bài ne: 94 khoá "tham ái" so với 13 "ái"; "hữu ái" cho bhavataṇhā theo pe9:1.1 và ne10:9.5). `attā` → "ngã" (trong ne/pe: 14 khoá "ngã" so với 1 "tự ngã"; toàn tầng 481 so với 513, nên theo phạm vi gần). `diṭṭhicarita`, `taṇhācarita` → "người/hạng người tính kiến", "tính tham ái" (pe9, ne4, ne21). `ugghaṭitaññū`, `vipañcitaññū`, `neyya` → "liễu tri tức thì", "liễu tri khi được giảng rộng", "cần được giáo đạo" (ne4, an4.133; pe9:30.5 dịch "cần được dẫn dắt", không theo). `dandhābhiññā`, `khippābhiññā` → "thắng trí chậm/nhanh" (pe9, pe7, dn33: 21 khoá); ne4 và an4 (57 khoá) dịch "tuệ chậm/nhanh" nhưng abhiññā không phải paññā nên không theo. `paṭipadā` → "thực hành", "lối thực hành" (48 trên 54 khoá). `attakilamathānuyoga` → "sự tự hành hạ ép xác" (sn42.12, sn56.11); `kāmasukhallikānuyoga` → "sự đắm say hưởng lạc (trong các dục)" (sn42.12, sn56.11, pe9). `saṅkilesa` → "ô nhiễm" (92 trên 152 khoá); `vodāna` → "sự trong sạch" (ne9:44.3; toàn tầng "thanh tịnh" 20 so với "trong sạch" 7, theo phạm vi gần); `upakkilesa` → "tùy phiền não" (mn128; để phân biệt với saṅkilesa và kilesa). `saṁsārapavatti`, `nivatti` → "sự tiếp diễn", "sự dừng lại của luân hồi" (ne9:44.4). `vaṭṭa`, `vivaṭṭa` → "vòng luân chuyển", "sự thoát khỏi vòng luân chuyển" (ne21:23.8–9). `niddisitabba` → "cần được chỉ rõ" (ne9, ne21, ne27). `āhāra` → "loại thực" (dn33, dn34) với đoàn thực, xúc thực, ý tư thực, thức thực (sn12.12, mn9); `vipallāsa` → "sự đảo lộn" (an4.49, pe9); `upādāna` → "chấp thủ" (ne7, pe9); `yoga` → "ách"; `gantha` → "kết thân"; `ogha` → "dòng lũ" (dn33, pe9); `āsava` → "lậu hoặc"; `salla` → "mũi tên"; `viññāṇaṭṭhiti` → "trú xứ của thức" (dn33, an7.44); `agatigamana` → "sự đi theo thiên vị" (ne10:13, pe9; dn33 dịch "thiên lệch", an4.17 "đi vào phi nghĩa", không theo). `adhiṭṭhāna` trong danh sách bốn → "sự quyết định" (dn33:1.11.150); ở `54.2` → "sự an lập" (pe4:6.10). `appamāṇā` → "vô lượng"; `vihāra` → "sự an trú"; `acchariyā abbhutā dhammā` → "pháp hy hữu vi diệu" (an4); `chandasamādhi` → "định do dục" (dn33 và đa số tầng). `sabbūpadhipaṭinissagga` → "sự từ bỏ mọi sanh y" (41 khoá); `tapo` → "khổ hạnh" (pe9 và tầng); `sallekha` → "đoạn giảm" (68 trên 96 khoá); `sammattaniyāma` → "con đường chắc chắn" (66 trên 75 khoá); `ālayasamugghāta` → "sự nhổ tận gốc luyến ái" (an4.34). `vimokkhamukha` → "cửa giải thoát" với "vô nguyện", "không", "vô tướng" (ne21:8.1). `puggala` → "hạng người" (29 trên 46 khoá trong ne/pe).

  **Số Pāli (tự tính).** `vīsativatthukā` = 20 (vīsati); `dvāsaṭṭhi` = 62 (dvā 2 + saṭṭhi 60; ne21:24.4 viết "sáu mươi hai"); `tecattālīsaṁ` = 43 (te 3 + cattālīsa 40; tiền lệ cattālīsa = 40); `aṭṭha vimokkhā` = 8; `dasa kasiṇāyatanāni` = 10; `dasa vatthuke`, `dasannaṁ suttānaṁ` = 10 (đã đếm: mười nhóm ở `10.12` và mười mục ở `32.1`, `39.1`); `cattāro`, `catasso`, `cattāri` = 4; `tayo`, `tisso`, `tīṇi` = 3; `dve` = 2; `eko attho` = một. Bốn thành ba (`58.4`) rồi ba thành hai (`60.1`). Không có số nào cần nhân hay cộng ngoài ba cụm đầu.

  **Bất định đã ghi, không giấu.**
  - `12.5` `attānaṁ kappiyaṁ upādiyati`: `kappiya` có thể là "được dựng nên/được hình dung" hoặc "thích hợp"; dịch "cái ngã được dựng nên", chưa phân xử.
  - `9.10` `rattavāsiniyā`: `ratta` có thể là "đêm" hoặc "nhiễm đắm"; dịch "trú trong sự nhiễm đắm", chưa phân xử. `catukkamagga` dịch "con đường theo nhóm bốn"; `avaṭṭanatthaṁ` dịch "để không bị xoay vòng".
  - `2.4` `tadabhiññā santā`: dịch "Với cái biết ấy"; cách đọc khác là "dù biết điều ấy". `ugghātanigghātaṁ` dịch "bị nâng lên rồi dìm xuống".
  - `9.1`: Pāli kết bằng dấu hỏi nhưng gộp cả câu hỏi và phần đáp ("tassa hi …"); tách thành câu hỏi và câu đáp bằng dấu chấm, không thêm ý.
  - `30.3` `Te lokā tīhi vimokkhamukhehi`: đọc `lokā` là cách xuất xứ (từ thế gian), động từ lấy từ `30.2`. `31.1` `Tatridaṁ niyyānaṁ—` dịch "Đây là sự thoát ra ở đó—".
  - `36.1` ghi `bhavādhiṭṭhānaṁ` trong khi `34.4` và `40.1` ghi `cāgādhiṭṭhānaṁ` cho phương thứ hai; dịch đúng chữ Pāli ghim ("sự quyết định về hữu") ở `36.1` và "sự quyết định về xả bỏ" ở `34.4`, `40.1`, `49.1`; đây là lệch của chính tầng Pāli, báo lại không sửa.
  - `47.1` mở đầu bằng `Yattha` (không phải `Tattha` như các khoá song song `43.1`–`52.1`); dịch "Ở nơi mà …", không sửa Pāli.
  - `54.2` `indriyādhiṭṭhānaṁ`, `vipariyāsānadhiṭṭhānañca`: dịch "sự an lập nơi các căn", "sự an lập nơi các sự đảo lộn" theo cặp với `54.3` (cảnh giới của chánh pháp, cảnh giới của phiền não); nghĩa của `adhiṭṭhāna` ở đây khác với danh sách bốn quyết định, chưa phân xử chắc.
  - `54.6` là câu trích dở của bài kệ (`veyyākaraṇesu hi ye kusalākusalā`); dịch sát, không thêm vế còn lại.
  - `4.8`–`4.10`, `6.9`–`6.11`: dấu lược thay phần `upagacchanti`; chỉ bổ "ngã" (và "chấp" ở `6.9`–`6.11`) theo công thức ngay trước, vẫn giữ đúng một dấu lược.
  - `8.2` `sikkhā` dịch "sự học tập"; `buddhi` (`34.6`, `37.1`) dịch "trí tuệ" để phân biệt với `paññā` (tuệ); `anvaye ñāṇaṁ` dịch "trí suy luận" (sn12.33:8.2). `13.3` `pāpikā diṭṭhi` dịch "ác kiến". `59.22` `ācāravipatti` dịch "sự hỏng cách hành xử" (không có tiền lệ trong tầng).
  - `1.2`, `7.4`: giữ "hữu ái" cho bhavataṇhā và "tham ái" cho taṇhā trong cùng khoá, đúng chữ Pāli.

  **Phép kiểm đã chạy, kèm mẫu số.** Tập khoá Việt = tập khoá Pāli, 293 = 293, đúng thứ tự Pāli. Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá: 0 lệch trên 293 khoá (Pāli có nháy kép ở 21 khoá, không có nháy đơn; bản Việt không có `"` hay `'` thẳng). Dấu lược: 13 khoá Pāli có `…`; mọi `…pe…` (5 khoá: `4.2`, `4.8`, `6.2`, `6.9`, `53.2`) thành đúng một `…`; `…` trần ở `4.3`, `4.4`, `6.3`, `6.4`, `4.9`, `4.10`, `6.10`, `6.11` giữ đúng một `…`; Pāli không có `(…)` nên bản Việt không có; 0 khoá lệch. Pāli lọt sang Việt: 0 từ. NFC đạt; 0 khoá rỗng; 0 khoảng trắng thừa.

