notes: |-
  Đợt 19, lát 74. Dịch trọn 102/102 khoá từ Pāli root đã ghim; không có khoá nào ngoài tập khoá Pāli. Bài là phần *Nhóm 3* (`Yuttihāravibhaṅga`) của *Phần Giải Thích* trong Netti. Không có Sujato và không có lớp `english-project`, nên đối chiếu độc lập chỉ có Pāli root cộng tiền lệ trong chính tầng Việt của dự án (các bài song song `sn1.66`, `sn22.84`, `an4.180`, `dn34` và các bài `ne` đã dịch). Không có bản Việt hiện hành theo khoá cho bài này; bản Việt nguyên bài ở mục Tra cứu toàn văn không cấp text theo khoá, không dùng làm nguồn đối chiếu theo khoá.

  **Coverage English (đo thật).** Mẫu số 68 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); Sujato phủ 0/68; `english-project` 0; `vietnamese-current` vắng. Blocker `noEnglishEditionUpstream` là thật, không bù được bằng điểm; `triangulation` đặt 7,0 vì mọi khoá chỉ có Pāli tự đứng vững cộng đối chiếu tiền lệ Việt trong tầng.

  **Tiền lệ và Pāli trùng nguyên văn.** Đã dò 17 khoá có Pāli trùng nguyên văn với khoá đã dịch ở tầng ngoài bài (70 cặp); 61 cặp dùng bản Việt y nguyên, 9 cặp khác (đều có lý do bên dưới). Dùng lại y nguyên: `4.1`–`4.4` và `6.1`–`6.4` từ `sn1.66:1`–`:2` (8 khoá, cùng cặp hỏi–đáp "Cái gì đánh ngã thế gian?" / "Tử thần đánh ngã thế gian"); `3.8` từ `ne8:1.5`; `11.2` từ `ne8:1.6` và `ne13:1.4` ("Như Đức Thế Tôn đã nói—"); `10.4` từ `ne13:2.4`; `0.2` theo đa số của bộ `ne` ("Phần Giải Thích" 11/12, chỉ `ne35` giữ Pāli). Cố ý khác: `2.2` ("Vào bốn Thánh đế.") khác `an5.15:1.17` vì ở đó là phần nối của một câu có gạch ngang; `6.2`, `6.3` khác `thag6.13:2.2`–`2.3` vì đó là câu kệ của một vị trưởng lão, khác ngữ cảnh. `10.1`–`10.3` khác `ne13:2.1`–`2.3` và một phần `sn7.18:5.3` (xem mục bất định). Trong chính bài chỉ có 1 nhóm Pāli trùng nguyên văn (`7.12` = `12.2`, cặp duy nhất), bản Việt giống hệt nhau; 0 cặp trùng nội bộ mà bản Việt khác.

  **Thuật ngữ, kèm số đếm.** `mahāpadesa` → "đại y" (`an4.180`, 7 khoá có chữ này). `padabyañjana` → "chữ nghĩa" (12 khoá toàn tầng, so với "từ ngữ" 9). `dhammatā` → "pháp tánh" (56/90 khoá toàn tầng; 15 khoá dịch "bản chất"). `paṭiccasamuppāda` → "duyên khởi" (24/25). `vinaya` trong chuỗi `rāgavinaya`/`dosavinaya`/`mohavinaya`/`kilesavinaya` → "điều phục" (cùng nghĩa với `chandarāgavinaya` → "sự điều phục", `mn109:12.8`); tôi giữ "điều phục" cả ở `1.5` và `17.1` để chuỗi định nghĩa `2.3`–`2.4` nhất quán, dù `an4.180` dịch `vinaya` là "giới luật". `hāra` → "phương thức" khi đứng độc lập (`ne1:3.1`, `ne2:1.1`, `ne20:1.1`) và "nhóm … hướng dẫn" ở tên chương (khuôn của `ne7`, `ne8`, `ne11`, `ne12`, `ne16`, `ne19`). `yutti` → "lý luận" theo `ne2:1.2`; `ne22:0.4` dịch `Yuttihārasampāta` là "Nhóm Phương Thức Dấu Hiệu" (trùng nguyên văn với `ne24:0.4` là `Lakkhaṇahārasampāta`) và `ne11:4.5` dịch `yuttihārena` là "phương thức dấu hiệu hợp lý": hai khoá có vẻ lệch, báo lại, không sửa vì ngoài lát. `vicaya`/`vicinitvā` → "khảo xét" (`ne2:1.2` dịch `vicayo` là "tích lũy", chỉ 1 khoá, và `ne11:4.5` dịch rất rộng; ở đây chọn nghĩa Pāli đen "khảo xét"). `ajjhosāna` → "sự bám chặt" (44/114 khoá toàn tầng; `ne7:1.5`, `ne7:3.9` dịch "chấp thủ", trùng với `upādāna`, nên ở đây không theo). `visattikā` → "sự dính mắc" (13/34), `pipāsā` → "khát khao" (khuôn `sn22.84:3.10`), `āsā` → "hy vọng" (4/17 khoá toàn tầng; "mong" 9/17, "khát" 2/17 là cách của `ne13`). `saṅkhatalakkhaṇa` → "tướng hữu vi", `ṭhitassa aññathattaṁ` → "sự biến dịch khi đang tồn tại" (`sn22.38`, `an3.47`). `visesabhāgiya`/`hānabhāgiya` → "thù thắng"/"suy giảm" (`dn34:1.2.1`). `cittaṁ pariyādāya` → "chiếm ngự tâm" (62/89 khoá có cụm này, khuôn `dn34:1.7.37`). `vihesā` → "sự hại", `arati` → "sự không vui", `nimittānusāri viññāṇa` → "thức chạy theo tướng", `vicikicchākathaṅkathāsalla` → "nghi hoặc … mũi tên lưỡng lự" (`dn34:1.7.37`–`1.7.68`). `abhinīhāra` → "dẫn dắt" (`sn34:7`), `kallatā` → "sự khỏe khoắn" (khuôn `akallatā` ở `ne20:7.2`, `ne33:2.10`). `saññāmanasikārā … sahagatā` → "các tưởng và tác ý đi kèm với …" (34/41 khoá, `an9.34`, `an9.41`). Bốn vô sắc: "không vô biên xứ", "thức vô biên xứ", "vô sở hữu xứ", "phi tưởng phi phi tưởng xứ" (134/215 khoá có chữ này, so với "xứ phi tưởng phi phi tưởng" 65/215). `āghātavatthu` → "căn cứ hiềm hận" (`an9.29`); `kodha`/`upanāha` → "giận dữ"/"oán hận" (`mn3`). `rāga` → "tham" (cách phổ biến toàn tầng; 86 trên 890 khoá có chữ này dịch "tham ái"); `dn34:1.7.54` dịch "tham ái" là cách khác, không theo vì ở bài này phải phân biệt `rāga` với `taṇhā`. `Mahākaccāyana` giữ không đuôi `-o` (đa số trong bộ `ne`: 7 trên 9; `ne7`, `ne18` giữ `-o`); "Bởi vậy, Tôn giả … nói" theo `ne8:10.2`, `ne12:5.10`, `ne13:17.2`.

  **Số Pāli (tự tính).** `cattāro mahāpadesā` = 4 ("Bốn đại y", đúng bốn mục ở `1.4`: Phật, Tăng, nhiều trưởng lão, một trưởng lão); `cattāri`/`tīṇi`/`dve`/`ekaṁ padāni` ở `3.3`–`3.6` = 4/3/2/1; `cattāri padāni` ở `5.1` = 4, `tayo pañhā` ở `5.2` = 3; `dve saṅkhatalakkhaṇāni` = 2 (già, chết); `dvīhi nāmehi` = 2; `navasu āghātavatthūsu` = 9; `navasuttantā` = 9; `catūsu ariyasaccesu` = 4. Bốn thiền theo thứ tự `paṭhama`/`dutiya`/`tatiya`/`catuttha` = thứ nhất/thứ hai/thứ ba/thứ tư. Không có số nào cần tính cộng hay nhân.

  **Bất định đã ghi, không giấu.**
  - `5.2` `te tayo pañhā`: Pāli nói "ba câu hỏi" trong khi `5.1` nêu bốn từ. Đọc theo mạch `7`–`8`: `jarā`/`maraṇa` khác nghĩa nên thành hai câu hỏi, còn `salla`/`dhūpāyana` cùng nghĩa nên gộp một; vậy bốn từ cho ba câu hỏi. Đã dịch "ba câu hỏi ấy", không thêm chú giải vào thân kinh.
  - `7.9` `yobbanaṭṭhāpi`: dịch "những người đang ở tuổi trẻ" (`yobbana` + `ṭṭha` = đứng trong tuổi trẻ), theo mạch phản chứng (nếu tham ái giống già chết thì những người chưa già cũng sẽ hết tham ái). Cách đọc "đã qua tuổi trẻ" cũng khả dĩ về hình thái nhưng làm lập luận mất ý; chọn cách đầu.
  - `7.10` `na ca siyā taṇhā dukkhassa samudayo`: dịch là hệ quả phi lý của giả thiết ("và tham ái sẽ không còn là tập khởi của khổ"), rồi `na hi jarāmaraṇaṁ …` bác lại; Pāli không có chữ "như vậy" hay "còn".
  - `10.1`–`10.3`: bài kệ trùng với `ne13:2.1`–`2.4` nhưng `ne13` dịch `āsā` là "khát" (hai khoá, `ne13:2.1`, `3.1`), trùng với `pipāsā` ("khát khao", `sn22.84:3.10`, và ở chính bài này `9.3`, `11.3`). Để không có hai chữ Việt cho một chữ Pāli trong cùng bài, tôi dịch `āsā` "hy vọng", `pihā` "mong muốn" (`ne13:2.1`), `abhinandanā` "hoan hỷ", và `pajappitā` "những lời cầu khẩn" theo `sn7.18:5.3`. `sarā patiṭṭhitā` (`10.2`) là chỗ bất định thật: hiểu `sarā` là "dòng chảy" (gốc `sar`) vì `saritā` ở `9.3` cùng gốc, nhưng cũng có thể hiểu khác; `ne13` bỏ qua chữ này. `10.4` dùng lại y nguyên `ne13:2.4`. Đề nghị người biên tập phán xử chung `ne13:2` và `10`.
  - `13.4` `sukhaṁ vā paṭipadaṁ dandhābhiññaṁ sukhaṁ vā paṭipadaṁ khippābhiññaṁ`: Pāli ghim lặp `sukhaṁ` ở cả hai mệnh đề (khuôn chuẩn là `dukkhā … dandhābhiññā`, `sukhā … khippābhiññā`); dịch đúng chữ Pāli ("đường hành trì lạc" cả hai) theo `dn28:10.4`, không sửa khuôn.
  - `13.3`–`13.4`: `13.3` là mệnh đề điều kiện còn dở (Pāli kết bằng dấu chấm), `13.4` mới có mệnh đề kết; giữ ranh giới khoá, nối bằng dấu phẩy.
  - `13.7` `yāvatikā ñāṇassa bhūmi`: không có động từ; dịch "Cho đến hết mức độ của trí" (khuôn câu đóng của `ne11:4.5`, ở đó dịch rất rộng).
  - `17.1` `navasuttantā`: dịch đúng "chín bài kinh"; Pāli không nói là chín bài nào, và tôi không suy ra.
  - `17.2`: câu trích `sabbesaṁ hārānaṁ yā bhūmi yo ca gocaro tesaṁ` là dòng kệ gốc của Netti; chữ `tesaṁ` đứng cuối (ngắt bởi dấu nháy), dịch "của chúng". `bhūmi` ở đây ("nền tảng") và ở `13.7` ("mức độ") là hai nghĩa theo ngữ cảnh.
  - `14.4` `upekkhāvihārissa sato rāgo …`: Pāli đối lập xả với `rāga` (ở `dn34:1.7.54` cũng là `rāgo`); giữ nguyên, không sửa theo khuôn thông thường (xả đối lập với sân).
  - `7.4`–`7.6`: các khẳng định "bào thai cũng chết", "chư thiên chết mà thân không già", "già có thể chữa, chết không thể chữa trừ phạm vi thần thông" là lập luận của chính Pāli; dịch sát, không thêm chú giải truyền thống.

  **Phép kiểm đã chạy, kèm mẫu số.** Tập khoá Việt = tập khoá Pāli, 102 = 102, đúng thứ tự Pāli. Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá: 0 khoá lệch trên 102 khoá; Pāli của bài không có nháy đơn, không có `"` hay `'` thẳng ở bản Việt. Dấu lược `…` và `(…)`: Pāli của bài không có dấu lược nào (0 khoá), bản Việt không có `…` nào: phép này chạy rỗng, nói thẳng. Pāli lọt sang Việt: 1 từ, `Mahākaccāyana` ở `17.2`, là tên riêng, chủ ý. NFC đạt; 0 khoá rỗng; 0 khoảng trắng thừa.

