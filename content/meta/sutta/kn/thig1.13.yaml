notes: |-
  **Phạm vi: đủ mọi khoá trong `all` (8 khoá/bài, 80 khoá cả lát).** Mọi khoá Pāli của
  lát này đều ngắn hơn 40 ký tự nên chốt nội dung của `_hvi.py` không bắt từng khoá, nhưng tôi
  vẫn ghi đủ cả 8 khoá mỗi bài, đúng segment ID, không thêm khoá nào.

  **Tầng Anh đủ cho toàn bộ nội dung kệ, thiếu đúng khoá kết bài.** 7/8 khoá mỗi bài có tiếng
  Anh Sujato tại commit đã ghim; khoá còn thiếu là dòng kết *… X thero/therī ….*, vốn là dạng
  lược của công thức quy kết *Itthaṁ sudaṁ … gāthaṁ abhāsitthāti* đã có nguyên văn đầy đủ
  trong cùng tạng (*thig1.1:2.1*, *thig1.2:2.1*, *thag1.2:1.5*). Tôi mở rộng dòng kết theo đúng
  công thức của 20 bản thag/thig đã `published` trên đĩa (*Bạch Thế Tôn, … đã từng nói bài kệ
  này*), không đặt công thức mới. Đây là mở rộng công thức stock đã chứng thực trong cùng
  tạng, không phải viết chữ vào chỗ Pāli lược nội dung giáo lý.

  **Không đối chiếu được tầng Việt hiện hành.** Tại commit đã ghim, `translation/vi/` của
  bilara chỉ chứa Pháp Cú, nên Thera/Therīgāthā không có bản Hòa thượng Thích Minh Châu. Đây
  là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là
  Pāli + English Sujato cho nội dung kệ, Pāli + tiền lệ trong tầng cho dòng kết.

  **Danh xưng hô cách viết theo dạng chủ cách.** Kệ gọi tên bằng hô cách (*Upasame*, *Tisse*,
  *Dhīre*, *Cāle*) nhưng bản Việt viết *Upasamā*, *Tissā*, *Dhīrā*, *Cālā* để thống nhất với
  tên bài kệ và toàn tầng — đúng cách 20 bản thag/thig đã làm.

  **Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tự kiểm các
  cờ tương đương review đối kháng: đủ khoá, đúng segment ID; ngoặc kép mở ở khoá kệ đầu và
  đóng trước *ti* ở khoá kệ cuối, cân trên cả bài; mọi chuỗi đã NFC; số dấu lược bằng Pāli
  (*thag1.42:1.1* giữ *(…)* như Pāli, các khoá còn lại không có dấu lược ở cả hai bên). Tôi
  **không** chạy `npm run validate|test|check|build` (đợt này cấm; người điều phối chạy tập
  trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Thuật ngữ, đếm được.** *Buddhasāsana* → *lời Phật dạy*: 6 tiền lệ trong tầng.
  *Ekamante nisīdatha* → *ngồi sang một bên*: đúng nghĩa đen *ngồi một bên*; Sujato thêm
  *to meditate* nhưng Pāli không có chữ thiền nào ở đây nên tôi **không** thêm — thêm vào là
  đưa giải thích vào lời kinh.

  **Bất định đã ghi.** Kệ dùng mệnh lệnh số nhiều (*karotha*, *nisīdatha*) trong khi dòng kết
  quy cho một vị ni (Visākhā) — có thể là lời vị ấy dạy lại chúng, không phải tự sự; tôi giữ
  nguyên mệnh lệnh mà không gán đối tượng nghe, đúng như Pāli không nói. *Yaṁ katvā
  nānutappati* là mệnh đề quan hệ (*việc mà đã làm thì…*), tôi viết *đã làm việc ấy sẽ không
  hối tiếc* cho câu xuôi, giữ đúng quan hệ điều kiện-kết quả.
