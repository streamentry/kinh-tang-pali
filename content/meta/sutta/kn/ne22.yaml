notes: |-
  Đủ 14/14 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Bài này là một vòng lặp trên đúng câu kệ và đúng bốn vế đã có sẵn trong tầng — đo được, không phải trí nhớ:
  · `“Tasmā rakkhitacittassa, sammāsaṅkappagocaro”ti gāthā` là câu dẫn mở của ne24, ne27, ne28, ne32 và được TIEN_LE_PHAI.md liệt kê (ne27:2.1 == ne32:2.1). Tôi dùng lại nguyên văn của chúng: Do vậy, với người có tâm được phòng hộ ...
  · Năm vế còn lại (2.2–2.6) trùng nguyên văn y hệt ud4.2:5.2–5.6, đã có sẵn: lấy chánh tư duy làm cảnh giới; lấy chánh kiến làm người dẫn đầu; biết rõ sự sinh diệt; tỳ-kheo vượt thắng hôn trầm và thụy miên; sẽ từ bỏ mọi đường dữ.
  · `sabbā duggatiyo jahe”ti.` có hai cách đã có trong tầng: sẽ từ bỏ mọi ác đạo (an3.34:14.4) và sẽ từ bỏ mọi đường dữ (ud4.2:5.6, iti40:5.4). Tôi chọn đường dữ theo đa số 2:1, và vì cùng câu kệ ở ud4.2 đã dùng đường dữ.
  · Khung bốn khối tiêu đề theo đúng ne24/ne27/ne28/ne32: Netti; Phần Giải Thích; Nhóm + số; Nhóm Phương Thức + tên. `Lakkhaṇahārasampāta` ở ne24:0.4 đã dịch là Nhóm Phương Thức Dấu Hiệu, nên `Yuttihārasampāta` ở đây dùng đúng chuỗi đó.
  · `Niyutto ...sampāto.` → ... đã được vận dụng (cả bốn bài kia đều vậy).

  Bất định đã ghi nhận:
  · `yujjati` không có tiền lệ nào trong tầng (đã đếm, 0 khoá), tôi đặt mới làm hợp lý và giữ nguyên ý hệt từng vế của `yujjati` (bốn lần ở 3.1, một lần ở 3.2). Chỗ này là lý do terminology 9.1 chứ không cao hơn.
  · 3.2 có `sabbāni ...` — số nhiều — nên tôi dịch mọi hiểm nguy thay vì hiểm nguy, còn 3.1 vốn đã là số nhiều ở Pāli (`sabbā duggatiyo`) nên giữ mọi đường dữ.

  Kiểm thủ công trên TOÀN BỘ 14 khoá (kiểm() chỉ soi 2 khoá từ 40 ký tự): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược bằng Pāli (cả hai phía 0), nháy kép cân (mở/đóng ở 2.1–2.6 và ở 3.1), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.
