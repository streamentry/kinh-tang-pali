notes: |-
  **Đo lại ba mệnh đề của lát.** `0.1` → **Jātaka** (400/416). `0.2`
  `Dasakanipāta` → *Bộ Mười Bài Kệ* (**0 tiền lệ thật**, 1 lần xuất hiện và tệp đó để
  trống — xem lý do suy luận ở `notes` của `ja439`). `0.3` `Catudvāravagga` → *Phẩm Bốn
  Cửa* (cũng 0 tiền lệ thật, `ja450` để trống; dựa trên `catudvāra` đã dịch *bốn cửa*
  hai lần trong tầng).

  **Tên riêng chưa có tiền lệ: khai vào bộ nhớ tiếp trình, và đó là một ngoại lệ có chủ
  đích.** `Maṭṭhakuṇḍalī` có **0 tiền lệ** trong tầng Việt. Chốt `lọt_pāli` của
  `_hvi.py` sẽ fail nếu tôi viết dấu Pāli cho một từ chưa từng xuất hiện ở `0.4` và
  `11.1`, nên tôi khai `Maṭṭhakuṇḍalī` vào `_hvi._từ_vi()` trong chính `_tvd_65.py`, sau
  khi xác chứng tên này **có thật** trong Pāli của bài (`ja449:1.1` `Alaṅkato
  maṭṭhakuṇḍalī`). Tôi giữ tên Pāli trong tiêu đề theo tiền lệ của chính lớp `ja`
  (*8. Kinh Cakkavāka*, *4. Kinh Sumaṅgala*, *Kinh Paṇṇikajātaka*). Hệ quả phải nói:
  người đọc Việt không hiểu `Maṭṭhakuṇḍalī` là gì — `maṭṭha` = tóc búi, `kuṇḍalā` =
  vòng tay, tức là *xuyến tay bện tóc*. Nếu biên tập muốn có tên dịch, đề nghị chọn một
  cách và áp cho mọi bài.

  **Trùng nguyên văn — 10 khoá, tôi dùng lại cả cụm.** `8.1–8.4` và `9.1–10.3` là bài
  thơ *khóc* trùng nguyên văn ở `ja410:7.1–7.4` + `ja410:8.4` + `ja410:9.1–9.3`, và ở
  `ja352:5.1–5.4` + `ja352:6.1–6.3` + `ja352:7.1–7.3`; hai bản này **khớp nhau từng
  câu**, nên tôi dùng lại nguyên văn và không tự tạo cách thứ ba. `9.4`
  `puttasokaṁ apānudi.` dùng nguyên văn `ja410:8.4` (*người con*) — chỗ này tôi **không**
  dùng `ja352:6.4` (*người cha*), vì Pāli khác (`pitusokaṁ`) và cảnh cốt truyền cũng
  khác.
  `11.1` theo 383 cặp `<tên>jātakaṁ <số thứ>` đã có; `ekādasamaṁ` → *thứ mười một*
  khớp **1/1** tiền lệ (`Kinh Pūtimaṁsa, thứ mười một.`), và tôi nối theo cùng cách cho
  `mười ba`, `mười bốn`, `mười sáu` ở `ja451`–`ja453`.

  **Câu tôi phải tự quyết, ghi rõ là tự quyết.**
  - `1.1` `Alaṅkato`: tôi hiểu câu này là lời kể của vị thần, nên dịch *Maṭṭhakuṇḍalī
    xinh đẹp* (danh từ + tính từ), không phải xưng hô. Nếu đọc là cách gọi thì câu này
    thành lời hỏi của người khác — nghĩa kệ `1.3`–`1.4` (*…sao ngươi lại buồn khóc
    giữa rừng?*) ủng hộ cách đọc của tôi.
  - `6.2` `Vaṇṇadhātu` tôi hiểu là *mặt trời* (cái gai đánh sắc da), `7.4`
    `kālikatā` tôi hiểu là *ngày tận thế*. Cả hai đều là cách đọc của tôi, không phải điều
    từ nên xác nhận.

  **Dấu lược:** 0/45 khoá có `…pe…`.

  **Không có tầng Anh.** 0/45; `ja449` không nằm trong 83 tệp `ja` đã ghim.
