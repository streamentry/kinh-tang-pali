notes: |-
  **Đo lại ba mệnh đề của lát.** `0.1` → **Jātaka** (400/416). `0.2`
  `Dasakanipāta` → *Bộ Mười Bài Kệ* (**0 tiền lệ thật**, 1 lần xuất hiện và tệp đó để
  trống — xem lý do suy luận ở `notes` của `ja439`). `0.3` `Catudvāravagga` → *Phẩm Bốn
  Cửa* (cũng 0 tiền lệ thật, `ja450` để trống; dựa trên `catudvāra` đã dịch *bốn cửa*
  hai lần trong tầng).

  **Tên riêng chưa có tiền lệ: khai vào bộ nhớ tiếp trình, và đó là một ngoại lệ có chủ
  đích.** `Maṭṭhakuṇḍalī` có **0 tiền lệ** trong tầng Việt. Chốt `lọt_pāli` của
  `_hvi.py` sẽ fail nếu tôi viết dấu Pāli cho một từ chưa từng xuất hiện ở `0.4` và
  `11.1`, nên tôi khai `Maṭṭhakuṇḍalī` vào `_hvi._từ_vi()` trong chính `_tvd_65.py`, sau
  khi xác chứng tên này **có thật** trong Pāli của bài (`ja449:1.1` `Alaṅkato
  maṭṭhakuṇḍalī`). Tôi giữ tên Pāli trong tiêu đề theo tiền lệ của chính lớp `ja`
  (*8. Kinh Cakkavāka*, *4. Kinh Sumaṅgala*, *Kinh Paṇṇikajātaka*). Hệ quả phải nói:
  người đọc Việt không hiểu `Maṭṭhakuṇḍalī` là gì — `maṭṭha` = tóc búi, `kuṇḍalā` =
  vòng tay, tức là *xuyến tay bện tóc*. Nếu biên tập muốn có tên dịch, đề nghị chọn một
  cách và áp cho mọi bài.

  **Trùng nguyên văn — 10 khoá, tôi dùng lại cả cụm.** `8.1–8.4` và `9.1–10.3` là bài
  thơ *khóc* trùng nguyên văn ở `ja410:7.1–7.4` + `ja410:8.4` + `ja410:9.1–9.3`, và ở
  `ja352:5.1–5.4` + `ja352:6.1–6.3` + `ja352:7.1–7.3`; hai bản này **khớp nhau từng
  câu**, nên tôi dùng lại nguyên văn và không tự tạo cách thứ ba. `9.4`
  `puttasokaṁ apānudi.` dùng nguyên văn `ja410:8.4` (*người con*) — chỗ này tôi **không**
  dùng `ja352:6.4` (*người cha*), vì Pāli khác (`pitusokaṁ`) và cảnh cốt truyền cũng
  khác.
  `11.1` theo 383 cặp `<tên>jātakaṁ <số thứ>` đã có; `ekādasamaṁ` → *thứ mười một*
  khớp **1/1** tiền lệ (`Kinh Pūtimaṁsa, thứ mười một.`), và tôi nối theo cùng cách cho
  `mười ba`, `mười bốn`, `mười sáu` ở `ja451`–`ja453`.

  **Câu tôi phải tự quyết, ghi rõ là tự quyết.**
  - `1.1` `Alaṅkato`: tôi hiểu câu này là lời kể của vị thần, nên dịch *Maṭṭhakuṇḍalī
    xinh đẹp* (danh từ + tính từ), không phải xưng hô. Nếu đọc là cách gọi thì câu này
    thành lời hỏi của người khác — nghĩa kệ `1.3`–`1.4` (*…sao ngươi lại buồn khóc
    giữa rừng?*) ủng hộ cách đọc của tôi.
  - `6.2` `Vaṇṇadhātu` tôi hiểu là *mặt trời* (cái gai đánh sắc da), `7.4`
    `kālikatā` tôi hiểu là *ngày tận thế*. Cả hai đều là cách đọc của tôi, không phải điều
    từ nên xác nhận.

  **Dấu lược:** 0/45 khoá có `…pe…`.

  **Không có tầng Anh.** 0/45; `ja449` không nằm trong 83 tệp `ja` đã ghim.

  **Giải quyết draft 2026-10-12.** Đọc đối kháng lại toàn bài từ Pāli, đối chiếu với hai đoạn kệ song song của cùng câu chuyện (`pv17`, `vv83`: cùng lời thoại người cha–chàng thanh niên, 28 khoá Pāli trùng chữ với các bài khác trong tầng) và `ja454:4.1–4.2`, `ja454:12–14`. Mục này **thay thế** các mục cũ sau của `notes` ở trên: "Tên riêng chưa có tiền lệ" (nay có tiền lệ: `pv17:0.3`, `vv83`, `mil6.4.2:10.2`), "Trùng nguyên văn — 10 khoá" (cách dịch cũ của `ja352`/`ja410` ở các khoá `8.x`–`10.x` là sai, không còn dùng), và "Câu tôi phải tự quyết" (cả ba cách đọc `1.1`, `6.2`, `7.4` đều sai, xem dưới).

  **Khoá đổi (khoảng 21/45 khoá có lỗi nghĩa thật, 5 khoá tiêu đề/đầu đề không đổi).** Bản cũ mất nghĩa nặng nhất ở:
  - `1.1`–`1.2`: `Alaṅkato maṭṭhakuṇḍalī` là lời người cha hỏi chàng thanh niên (*được trang sức, hoa tai bóng loáng*), không phải tên riêng cộng "xinh đẹp"; `haricandanussado` là *xức nhiều chiên-đàn vàng*, không phải "thoa son vàng khắp mình".
  - `2.2`: `rathapañjaro` là *khung xe*, không phải "tấm vòm che"; `2.4` bỏ "không thèm sống nữa" (thêm nghĩa), giữ *tôi đang bỏ mạng sống*.
  - `3.3`–`3.4`: `Pāvada` là mệnh lệnh *hãy nói đi*; `paṭipādayāmi` là *cung cấp*; bản cũ có "Tao", "bền chắc", "lắp ... cho đúng" đều không có trong Pāli.
  - `4.1`–`4.4`: `pāvadi` là *nói* (không phải "làm bền chắc"); `4.3`–`4.4` là lời chàng thanh niên (*xe của tôi bằng vàng, nhờ cặp bánh xe ấy mà rực rỡ*), không có "thế mà"; "lấp lánh" của cặp bánh xe là lệch chủ ngữ.
  - `6.2`: `Vaṇṇadhātu` là *ánh sắc rạng rỡ* (của nhật nguyệt) ở cả hai lối đi, không phải "mặt trời soi sáng hai bên con đường"; `6.4`: `Ko nu kho kandataṁ bālyataro` là *trong những người đang khóc, ai ngu hơn?*, không phải "tiếng khóc là của kẻ nào".
  - `7.4`: `kālakatābhipatthaye` là *mong cầu người đã khuất, đã qua đời* (`petaṁ kālakataṁ`), không phải "ngày tận thế" (không có trong Pāli).
  - `8.2`–`8.4`, `9.1`–`9.4`, `10.1`: bản cũ lấy nguyên từ `ja352`/`ja410` (*như cành cây khô bị lửa thiêu*, *nước sóng vọt vào*, *đau đớn khổ sở*, *nỗi buồn đã ăn vào lòng ngươi*) đều sai: `ghatasittaṁva pāvakaṁ` là *như lửa được rưới bơ lỏng*; `osiñcaṁ` + `nibbāpaye daraṁ` là *như người rưới nước lên, cậu đã dập tắt mọi nỗi bức bối*; `Abbahī vata me sallaṁ` là *cậu đã nhổ mũi tên của tôi*; `yamāsi hadayassitaṁ` là *mũi tên từng găm trong tim*; `puttasokaṁ apānudi` là *xua tan nỗi sầu thương con*; `abbūḷhasallosmi` là *đã được nhổ mũi tên*. Dùng lại nguyên văn các cách dịch của `pv17` (cậu/tôi) và `ja454` cho các khoá Pāli trùng chữ.
  - Cách xưng hô thống nhất theo `pv17`/`vv83` (cùng một câu chuyện): người cha tôi/cậu, chàng thanh niên tôi (lời kệ không có đại từ gọi người cha); bỏ "ta/ngươi/tao".
  - Khoá còn lại giữ nghĩa, chỉ đổi cách xưng hô cho khớp.

  **Phân loại blocker.** (A) Không có bản Anh Sujato đã ghim ở commit đã pin: **giữ nguyên**, đó là sự thật về upstream (công cụ waiver của người biên tập sẽ xử lý). (C) "Tầng `vietnamese-current` chỉ có 26 tệp Pháp Cú": **đã gỡ** khỏi `blocking_errors`; đó là giới hạn của tầng tham khảo, không phải lỗi văn bản (mọi bài `kn` đã `published` ngoài Pháp Cú đều thiếu tầng này). Không có blocker loại (B) hay (D) (không hapax chưa giải, không thiếu khoá, không đoạn nghĩa chưa phân xử được).

  **Giới hạn tham chiếu còn lại.** Không có bản Anh Sujato và không có bản Hòa thượng Thích Minh Châu cho bài này; đối chiếu chỉ có Pāli đã ghim, cùng các bản dịch dự án của hai đoạn song song `pv17`/`vv83`/`ja454` (không độc lập với bài này, vì cùng tầng dự án). Vì vậy `triangulation` giữ 7,6 (không cao hơn 8,0).

  **Bất định còn lại (không đưa vào thân kinh).**
  - `4.2` `Candasūriyā ubhayettha bhātaro`: dịch sát chữ *mặt trăng và mặt trời, ở đây cả hai là anh em*; bản song song `pv17:4.2` đọc khác (`dissare`, *đều hiện thấy ở đây*), nên nghĩa chính xác của `bhātaro` (anh em, tức hai bánh xe như cặp) chưa phân xử được bằng bản Anh.
  - `6.2` `Vaṇṇadhātu ubhayettha vīthiyo`: dạng số nhiều `vīthiyo` khác `pv17:6.2` (`vīthiyā`); giữ cách hiểu *ở cả hai lối đi*.
  - `2.2` `rathapañjaro` dịch *khung xe* theo `pv17`/`vv83` (hai nơi) trong khi `mil3.1.1` dịch cùng chữ là *thùng xe* (4 nơi); hai cách đều chấp nhận được, giữ cách trùng chữ với bản song song.
  - `1.2` `haricandana`: `pv17`/`vv83` dịch *chiên-đàn vàng* (2 khoá), các Jātaka khác dịch *đàn hương vàng* (5 khoá `ja527`, `ja534`, `ja539`); giữ cách của khoá Pāli trùng chữ.
  - `7.4` động từ ở dạng cầu khiến `abhipatthaye`, dịch ở thời hiện tại (khác `pv17` dùng quá khứ `abhipatthayiṁ`).

  **Số đo.** Dấu lược: 0/45 khoá. Số Pāli: không có. Nháy kép: khớp Pāli từng khoá (45/45). Khoá thừa/thiếu: 0/0. `technical_integrity` giữ 9,6; bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
