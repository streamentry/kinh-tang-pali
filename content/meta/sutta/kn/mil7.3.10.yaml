notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này.
  Pāli trùng nguyên văn: 6 khoá, dù lại nguyên văn cả 6. `:0.1` (174/185) · `:0.2` `Opammakathāpañha` (40/62, và 6/9 trong chính `mil7.3`) · `:0.3` `Samuddavagga` → “Phẩm Biển” (6/9, và 6/9 trong chính `mil7.3`) · `:4.4` `Bhāsitampetaṁ, mahārāja, bhagavatā devātidevena—` (3/3) · `:10.1` `Tassuddānaṁ` → “Tóm lược:” (290/372) · `:11.6` `vaggo tena pavuccatīti.` (8/17).
  Câu hỏi mở đầu `:1.1` theo đúng khuôn của `mil7.3.1:1.1` và `mil7.3.9:1.1` (“Thưa tôn giả Nāgasena, tôn giả đã dạy rằng ‘…’; phần ấy là phần nào cần phải nắm lấy”ti?), và khoá `:1.4`, `:2.3`, `:3.3`, `:4.3`, `:6.3` theo đúng khuôn `Idaṁ, này Đại vương, là phần thứ … cần phải nắm lấy của …` của chính 9 bài anh em trong `mil7.3`.
  Uddāna `:11.1`–`:11.5` liệt kê chín tên của chín câu hỏi còn lại; tôi dịch theo đúng tiêu đề `0.4` của từng bài anh em đã có: `:11.1` cây leo (`mil7.3.1`) và hoa sen (`mil7.3.2`) · `:11.2` hạt giống sālakalyāṇikā (`mil7.3.4`) · `:11.3` thuyền (`mil7.3.5`) và bến thuyền (`mil7.3.6`) · `:11.4` cái giếng (`mil7.3.7`) và người hoa tiêu (`mil7.3.8`) · `:11.5` kẻ làm công (`mil7.3.9`) và cõi biển (bài này). Tên riêng `sālakalyāṇikā` giữ nguyên Pāli vì nó là tên cây và là từ Pāli của chính khoá này.
  Thuật ngữ theo tiền lệ đếm được: `appiccha` → thiểu dục (an1.63:1.1); `santuṭṭhi` → tri túc (an1.65:1.1); `dhutavāda` → tán thán hạnh đầu đà (ud4.6:2.1); `paṁsukūlika` → mặc y phấn tảo (ud4.6:2.1); `kalyāṇamitta` → bạn lành (an1.71:1.1); `lajji` → biết hổ thẹn (an3.70:19.2); `kammakāro` → kẻ làm công (mil7.3.9:1.2); `rājaseṭṭha` → bậc vua tối thắng (ja111:1.2); `subhāsitena` → lời nói hay (an5.48:9.1). Tên năm con sông theo đúng cách tầng đã dùng ở `mil1`: sông Hằng, sông Lam, sông Aciravatī, sông Sarabhū, sông Mahī — `Sārabhū` có dấu sắc mà không phải token nào trong Pāli khoá này (Pāli viết liền `aciravatīsarabhūmahīādīhi`) và cũng chưa có trong tầng, nên `lọt_pāli` báo lỗi; tôi theo cách viết của tầng là “Sarabhū”.
  Bất định, đã ghi ở đây chứ không thêm vào thân kinh: (1) `:1.3` là một danh sách dài `rāga-dosa-moha-māna-diṭṭhi-makkhapālāsa-issā-macchariya-māyā-sāṭheyyakuṭila-visama-uccarita-kilesa`; các mục chưa có tiền lệ trong tầng dịch theo nghĩa chữ nghĩa, trong đó `macchariya` dịch “hối tiệc” và `visama`/`uccarita` dịch “hành vi không ngay thẳng”/“hành vi kiêu ngạo”. (2) `:6.2` danh sách `uddesa-paripucchā-savana-dhāraṇā-vinicchaya-abhidhamma-vinaya-gāḷha-suttanta-viggha-padanikkhapa-padasandhi-padavibhatti-navaṅgajina-sāsana-vara` cũng dịch theo nghĩa chữ nghĩa; `navaṅgajina` không có tiền lệ và nghĩa chưa chắc, tôi dịch rộng là “giáo pháp mới của bậc thắng trí” chứ không khẳng định điều gì thêm. (3) `:3.1` `mahantehi mahābhūtehi` không có tiền lệ, dịch “những sinh vật lớn, những vật dữ dội”. (4) `:6.4` `sutasomajātake` là tên một bài kệ trong tập kinh, tôi giữ “Kinh Suta-soma” vì không có tiền lệ và không suy đoán thêm.
  Không khoá nào trong 8 bài này có `…pe…` ở Pāli (đã kiểm 296/296 khoá), nên không có dấu lược nào để giữ, và không có chỗ nào bịa dấu lược che chỗ thiếu.
  Đo lại trên đĩa, hai con số coordinator nêu ở mục (4) của prompt KHÔNG khớp: `bhante` trong tầng `mil` dùng **“thưa tôn giả” 149 lần / 71 tệp**, “bạch ngài” chỉ 37 lần / 23 tệp, “bạch thầy” = 0 (giữ nguyên phần đúng của bạn); `mahārāja` dùng **“này Đại vương” 395 lần / 101 tệp**, còn “tâu đại vương” chỉ 169 + “tâu Đại vương” 79 = 248 lần / 32 tệp. Cả 9 bài lân cận mil3.1.12/.14 và mil7.3.1/.9 đều dùng “này Đại vương”, nên lát này theo đo được, không theo con số bạn đưa.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đủ 37/37 khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không trùng nguyên văn Pāli, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
