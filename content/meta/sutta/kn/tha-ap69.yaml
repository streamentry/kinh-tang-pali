notes: |-
  **ĐỌC TOÀN BỘ Pāli TRƯỚC KHI VIẾT.** 36 khoá, in lại cặp Pāli↔Việt sau khi ghi.

    **TẦNG THAM KHẢO — 0/1 khoá có Anh Sujato** ⇒ `draft`, `triangulation` 7.5.

    **DÙNG LẠI NGUYÊN VĂN 8/11 KHOÁ PĦI TRÙNG.** `dvipadindassa tādino.` → của bậc hai chân
    đáng tôn kính ấy. (2); `cittassa paṇidhīhi ca;` → và nhờ những tâm nguyện thanh tịnh; (1);
    `lokajeṭṭho narāsabho;` → bậc Trưởng Thượng thế gian, đấng Nhân Ngưu; (4); `pakkāmi
    uttarāmukho.` → ta quay về hướng Bắc cất bước ra đi. (1, chỉ khác đại từ); `Ākāse chadanaṁ
    hoti,` → Má che mọc lên giữa hư không, (1); `Sattaratanasampanno,` (19); `cakkavattī
    mahabbalo.` (24); `Paṭisambhidā catasso,` (287); `…pe…` (406); `kataṁ buddhassa sāsanaṁ”.`
    (257); `Itthaṁ sudaṁ …` (374/376).

    **3 KHOÁ LỆCH ĐA SỒ.**
    (a) `Addasaṁ virajaṁ buddhaṁ,` — 24 tiền lệ chia làm 12 kiểu, đa số trần là *Tôi đã thấy Đức
        Phật ly trần,* (3). Tôi dùng **ta** cho cả câu kệ. Đây là lệch đại từ, giữ nhất quán với
        `Ta không biết mình rơi vào khổ đau,` mà tôi dùng lại nguyên văn ở `:7.3`.
    (b) `Bhave nibbattamānamhi,` — 4 tiền lệ, mỗi kiểu **1 lần**, không có đa số: *Khi tái sinh
        trong các cảnh giới* / *Trong khi ngươi sanh vào các kiếp* / *Trong các kiếp sinh tử tái sinh*
        / *Khi tái sinh trong các kiếp sống*. `bhave` là điều kiện “dù ở cảnh giới nào”, nên tôi
        dịch **Dù tái sinh trong cảnh giới nào,** để giữ được điều kiện — hai cách kia làm mất nó.
    (c) `Tassuddānaṁ` — bài này không có khoá này.

    **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU — HAI CHỖ, ĐÂY LÝ DO HẠ ĐIỂM.**
    · `Pakkhijāto` (`:1.1`) — tôi đã tra **toàn bộ** Pāli đã ghim (5.764 tệp): cụm `…akkhijāta`
        xuất hiện **đúng 2 lần**, đều ở hai bài của lát này (`tha-ap69:1.1` và `tha-ap86:3.1`), và
        **không có ở đâu khác**, nên không có tầng nào để tra nghĩa. Có thể là *sinh ra trong vòng
        mười bốn ngày* (gốc `pakkhin` = nửa tháng), cũng có thể là *sinh ra từ trứng*. Tôi **không
        dịch từ đoán** — chỉ dịch `tadā āsiṁ` là *Khi ấy ta sinh ra,* và ghi bất định ở đây. Nếu
        người biên tập xác nhận nghĩa `pakkhin`, hai khoá này cần sửa cùng một lượt.
    · `Aruṇavā satta janā` (`:7.1`) — `aruṇa` = đỏ sẫm/rám nắng; có thể là mô tả da người, cũng có
        thể là TÊN (giống `Aruṇavā` ở các bài khác của Apadana là tên vị vua Aruṇa). Không có tiền
        lệ trong tầng. Tôi dịch trung tính **Bảy vị người sắc đỏ,**. Nếu đó là tên thì phải sửa.
    · `supaṇṇo garuḷādhipo` / `Jahitvā garuḷavaṇṇaṁ` (`:1.2`, `:2.1`) — cả hai câu nói về sắc
      màu, nên `garuḷa` = rám nắng/sẫm; tôi dịch *nâu da, sắc màu rám nắng;* và *Từ bỏ sắc màu
      rám nắng ấy,*. `dussaṁ` (`:3.1`) dịch **cây gỗ** xem `tha-ap42`.

    **DẤU LƯỢC.** `:8.2` là `…pe…` → **đúng một** `…`.

    **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:8.3`; **thêm** nháy cong `‘` mở ở `:4.1` và `’`
    đóng ở `:4.4`. Tự đếm lại: cân.

