notes: |-
  Tầng tham khảo: KHÔNG có bản Anh Sujato tại commit đã ghim cho bài này — đếm bằng script, trong cache đã ghin không có tệp nào khớp uid này (0/15 khoá); cũng không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya. Bài này vì thế chỉ dịch từ Pāli, triangulation chấm 7.0 và status giữ draft; xem blocking_errors.

  Đủ 15/15 khoá. Đã đọc hết Pãli lát f120.pali.txt trước khi viết.

  Opammakathāpañha → “Câu hỏi về cách dùng dẫn với ví dụ”; Makkaṭakavagga → “Phẩm Kẻ Nhắc
  Nhở” (tiền lệ `mil7.7.1`, `mil7.7.2`, `mil7.7.9`). `cittakadharakumma` tôi dịch “con khỉ
  cầm que đếm”: `citta` là que đếm, `dharaka` là kẻ cầm, `kumma` là khỉ; đã tra “que đếm” trong
  tầng (0 chỗ) nên đây là cách đặt mới, đã ghi ở đây.

  BẤT ĐỊNH VỀ SỐ THỨ TỰ, ĐÃ GHI NHẬN CHỨ KHÔNG TỰ SỬA. Pāli ở khoá 3.1 là
  `Cittakadharakummaṅgapañho catuttho` — “thứ tư” — trong khi 0.4 của chính bài này ghi
  `3.`. Đọc số trước và số sau trong cùng phẩm cho thấy đây là lỗi trùng số của bản chụp:
  `mil7.7.2` kết bằng `dutiyo`, còn `mil7.7.4` (Pavanaṅgapañha) CŨNG kết bằng `catuttho`. Tôi
  dịch đúng chữ `catuttho` thành “thứ tư” và không sửa Pāli, không sửa tiêu đề, cũng không bịa
  số thứ ba cho khớp uid — vì sửa một trong hai sẽ che mất lỗi ở nguồn.

  Cặp Pāli trùng nguyên văn đã xem, nhưng cố ý KHÔNG dùng lại. 2.2 và 2.3 trùng nguyên văn
  `an4.37:8.2` và `an4.37:8.3`; bản `an4.37` dịch `pamāde bhayadassi vā` thành “thấy có sự
  nguy hiểm trong sự phóng dật”, mất hẳn vị từ `vā` (hoặc) và đọc lạng, nên tôi giữ cách dịch
  sát nghĩa chữ của mình. Đây là chỗ tôi chọn lệch khỏi bản đã có; người điều phối nên biết.

  `guṇavisesa` tôi dịch “ưu điểm” (điều lành hơn) thay vì “điều lành cùng điều dở” của bản
  nháp, vì `guṇa` là điều lành và `visesa` là sự vượt trội, không phải cặp đối xứng. Lỗi đã bắt
  ở lượt review đối kháng.

  Dấu lược: bài không có `…pe…`; hai phía đều 0.

  Kiểm kỹ thuật: save_vi chạy sạch; vì mọi khoá Pāli ở lát này ngắn hơn 40 ký tự (khoá dài nhất 39) nên tập `cần` trong _hvi.kiểm rỗng và các assertion NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy, tôi tự quét lại MỌI khoá bằng chính các hàm đó (pal, lược, lọt_pāli, ngoặc, _TỪ): đủ 15/15 khoá, đúng ID, thứ tự khoá y hệt Pāli, không rỗng, không thừa, mọi chuỗi NFC, không trùng nguyên văn Pāli (trừ 0.1 là tên bộ Kinh, đúng như tiền lệ), số dấu lược khớp Pāli từng khoá, nháy kép cân trên cả bài và khớp đúng số mở/đóng của từng khoá Pāli, không còn (…), toàn bộ chữ cái là script Latin. Đợt này cấm chạy cổng nên technical_integrity = 9.6, KHÔNG phải 10.0; bốn lệnh npm run validate | test | check | build để người điều phối chạy.
