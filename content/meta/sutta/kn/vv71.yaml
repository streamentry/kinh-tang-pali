notes: |-
  Bản dịch chỉ từ Pāli root do commit đã ghim không có bản Anh upstream (giới hạn upstream).
  Đầy đủ 10 tiêu chí scorecard; status bắt buộc draft do blocker tầng tham khảo Anh; technical_integrity 9.6.
  
  Kiểm toán độc lập 2026-10-11 (bổ sung, không xoá mục trên; mục "Đầy đủ 10 tiêu chí scorecard…" ở trên được thay bằng bảng điểm mới của mục này):
  Đọc đối kháng 22 khoá Pāli↔Việt; đổi 16/22 khoá (6 khoá còn lại là tiêu đề Pāli và ba dấu lược `…` giữ nguyên). Lỗi nghĩa/ranh khoá thật: 8 khoá. Gồm: (a) 4.1/4.2 bị đảo vế — bản cũ đặt `pasanno sehi pāṇibhi` ("tâm tịnh tín… tự tay") vào 4.1 và `tassa adāsahaṁ bhāgaṁ` ("đã dâng… phần") vào 4.2, lại thêm "của mình", "vật thực"; nay 4.1 = "Tôi đã dâng cho vị ấy một phần", 4.2 = "với tâm tịnh tín, bằng chính đôi tay mình" (2 khoá). (b) 3.4 `vippasannamanāvilaṁ` bị dịch "Thanh tịnh, lắng dịu và không ô nhiễm" (thêm "lắng dịu") → "trong sáng, không vẩn đục" (khớp sn35.132, dhp413; `-m-` là phụ âm nối `vippasannaṁ anāvilaṁ`, không có chữ "tâm ý"). (c) 2.3 `yassa kammassidaṁ phalaṁ` là mệnh đề quan hệ "về nghiệp mà đây là quả báo", bản cũ dịch như câu độc lập "quả báo của nghiệp này là như thế" (đứt khỏi động từ viyākāsi ở 2.2 lược). (d) 4.3 `kummāsapiṇḍaṁ` "nắm bánh mạch kummāsa" — "bánh mạch" không có trong Pāli → "nắm cháo thô" theo tiền lệ Trung Bộ (`kummāsa` = cháo thô: mn81, mn82; 9 khoá `ābhidosikaṁ kummāsaṁ`/`odanakummāsaṁ` đều "cháo thô"). (e) 0.4, 3.2, 6.1 `yavapālaka`: "đồng đại mạch" thêm "đồng" không có chữ `khetta`; `yava` = "lúa mạch" (sn35.248, an8.10, mnd1) → "người giữ lúa mạch". Lỗi lệch cách xưng/giọng: 3.1, 3.3, 4.x, 5.x người nói dùng "con" (không có trong Pāli) → "tôi" (theo công thức vv đã kiểm toán: vv13, vv14, vv58, vv79); người hỏi vẫn "ngài" ở 1.3. Bỏ thêm nghĩa không có trong Pāli: "vô cùng" (2.1), "rực rỡ" (1.3, 5.3), "vút" (1.1), "muôn" → "mọi" (sabbadisā), "ly trần thoát bụi" lặp nghĩa → "ly trần" (3.3), "một" (3.3), "nhân duyên" (5.1; `tena` → "Nhờ vậy"), "khu", "được" (4.4). Đối chiếu: các bản kề vv66, vv68, vv70, vv72 trong cùng phẩm còn mang chính các lỗi này nên không dùng làm tiền lệ; dùng Pāli làm chuẩn.
  Điểm đổi: semantic_fidelity 9.3 → 9.2; terminology 9.2 → 9.0 (hai bất định dưới); các tiêu chí khác giữ; final_score 9.23 → 9.20. Không nâng điểm nào.
  Bất định còn lại (giữ, không phân xử được): (1) `kummāsa` — "cháo thô" theo tiền lệ Trung Bộ nhưng `kummāsapiṇḍa` là "nắm/cục", có thể là thứ đặc hơn cháo (vv14 và tha-ap477/561 dịch "bánh"); chưa có bản Anh hay chú giải trong kho để quyết. (2) `yavapālaka` — dịch sát "người giữ lúa mạch"; không xác định được từ Pāli ở đây là người canh ruộng lúa mạch hay người giữ kho lúa mạch. (3) `bhāgaṁ` — "một phần" (của vật thực), Pāli không nói phần của ai. (4) Người hỏi/đáp ở các khoá lược 1.2, 2.2, 5.2 không đọc được từ tầng đã ghim; 1.3, 2.1 giữ cấu hình hỏi-đáp chuẩn của phẩm (ngài Moggallāna hỏi, thiên tử đáp).
  Tiêu đề phẩm/loại 0.2 (`Purisavimāna`) giữ "Thiên Cung Của Nam Giới" (tiêu đề `Itthivimāna` ở các tệp khác hiện dịch "Nữ Hư Không", sai vì không có `ākāsa`, nhưng không sửa riêng một tệp). Blocker không có tầng tham khảo tiếng Anh giữ nguyên (giới hạn upstream); `triangulation` ≤ 8,0.
  Cổng kỹ thuật: technical_integrity 9.6; chưa chạy `npm run validate` · `npm test` · `npm run check` · `npm run build` trong lượt này.
