notes: |-
  **Tầng Anh đủ cho toàn bộ nội dung kệ, thiếu đúng khoá kết bài.** 8/9 khoá mỗi bài có tiếng Anh Sujato tại commit đã ghim; khoá còn thiếu là dòng kết *… X thero ….* (`:1.5`), vốn là dạng lược của công thức quy kết *Itthaṁ sudaṁ … gāthaṁ abhāsitthāti*. Tôi **không** mở rộng dòng kết: BRIEF v6 §10.1 nói thẳng *Pāli có dấu lược thì bản Việt giữ nguyên, không bao giờ mở rộng* — mở rộng là thêm chữ KHÔNG ĐÁNH DẤU, và đã có tiền lệ sai thật (ba ngọn lửa `rāgagginā…` bị nhân sang `sn35.29:1.15`). Tiền lệ có sẵn trên đĩa làm đúng như vậy: *thig1.7/1.8/1.9* và *thag1.14* (`… Trưởng lão nữ Vīrā ….`). Nhóm khác (*thag1.42*, *thig1.10–1.16*) thì mở rộng thành *Bạch Thế Tôn, … đã từng nói bài kệ này*; tôi **không** theo nhóm đó, và ghi ra đây để biên tập phán xử nếu muốn thống nhất. Số dấu lược của mọi khoá `:1.5` khớp Pāli (2 = 2). **Không đối chiếu được tầng Việt hiện hành.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Theragāthā không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato. **Đặt kinh theo thứ tự khoá trong lát này** (`0.1` = Theragāthā + số · `0.2` = Ekakanipāta · `0.3` = vagga · `0.4` = tên bài kệ) — cùng thứ tự với `thag1.42`, bài đã `published` và có đúng dạng dòng kết này. `Ekakanipāta` → *Bộ Một Bài Kinh* (83/84 bản kn trên đĩa; chỉ `thag1.1:0.2` viết *Tập Một*). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>* (25 lần, so với 4 lần *Bài Kệ…*). `Theragāthā 1.N` giữ **số** như `thag1.42:0.1`. **Tên riêng giữ nguyên dạng Pāli** — cả 11 tên đều xác minh được trong Pāli đã ghim, không phải đặt mới. Ở `:1.5` Pāli dùng dạng chủ cách (*Belaṭṭhāniko*, *Setuccho*…); bản Việt dùng dạng gốc để thống nhất với tên bài kệ, đúng cách 20 bản thag/thig đã làm. **Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm (mọi khoá của 11 bài này đều ngắn hơn 40 ký tự, nên chốt không bắt): đúng 108/108 khoá, đúng segment ID; mọi chuỗi đã NFC; số dấu lược bằng Pāli; ngoặc kép mở ở khoá kệ đầu và đóng trước *ti* ở khoá kệ cuối, cân trên cả bài; không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (đợt này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Thuật ngữ của bài, đếm được.** `pāmojja` → *niềm vui*; `pāmojjabahulo` →
  *tràn đầy niềm vui*. `bhikkhu` → *tỳ-kheo* (danh xưng tôn sư, giữ Hán–Việt theo
  quy ước). `dhamme buddhappavedite` → *trong các pháp do Đức Phật tuyên thuyết*
  (`tuyên thuyết` 11 lần). `adhigacche` → *hãy chứng ngộ* (mệnh lệnh, không phải
  *hãy đạt tới*). `padaṁ santaṁ` → *bậc thánh tịch tịnh* — tôi ghép hai từ vì
  `pada` là *bậc/địa* và `santa` là *tịch tịnh*, còn Sujato chỉ có *the peaceful
  state*; giữ *bậc Thánh* (64 lần trong tầng) vì đó là từ chuẩn cho bậc tu hành và
  không dùng *bậc tịch tịnh* một mình. `saṅkhārūpasama` → *sự an ổn thuần phục các
  hành*; `sukha` → *sự an lạc*.

  **Bất định đã ghi.** `sukhan` là danh từ (*sự an lạc*), tôi giữ *"sự an lạc"* chứ
  không đổi thành *"an lạc"* để không mất dấu hiệu danh từ; `saṅkhārūpasamaṁ` tôi
  dịch *"sự an ổn thuần phục các hành"* — `ūpasama` là *thuần phục/lắng xuống* (4 lần
  *lắng xuống* trong tầng, cho `tūram`). Không có gì cần chú thích thêm.
