notes: |-
  Dịch trực tiếp từ Pāli root cho đủ 108 khoá; commit đã ghim không có bản Anh cho phẩm tha-ap, nên không tuyên bố đã đối chiếu English.
  Tiền lệ đếm được trong tầng (mọi bài kn đã dịch, dựng chỉ mục Pāli ↔ Việt): 59/107 khoá (trừ :0.3) có Pāli trùng nguyên văn với bài khác,
  tương ứng 3.570 bản ghi; 46 khoá dùng lại nguyên văn một dạng đã có, 13 khoá khác (12 khác thật, 1 chỉ khác chữ hoa đầu câu).
  12 khoá khác thật, kèm lý do:
  2.2 `amataṁ padaṁ` → cảnh giới bất tử (6 khoá; đạo lộ bất tử 1, bước đạo bất tử 1);
  2.4 chỉ khác đại từ ta/tôi; 3.4 bỏ chữ tận không có trong Pāli;
  5.2 `lokagganāyako` → bậc Dẫn Đạo tối thượng của thế gian (bv20: 3 khoá; dạng giáo chủ: 2);
  8.1 `Kappasatasahassamhi` → Sau một trăm ngàn kiếp nữa (lời thọ ký tương lai theo chỉ đạo của lát; ngàn theo đa số);
  10.1 nhận ra tiếng nói → hiểu rõ lời (aññāya là hiểu); 10.2 xem bất định;
  13.1 `cavitvāna` → mệnh chung (12 khoá cavitvāna dùng mệnh chung, 11 khoá dùng rơi khỏi, trong đó 10 khoá là cùng một Pāli; chọn mệnh chung để nhất quán với 14.1 trong chính bài và vì rơi khỏi dễ đọc thành bị đuổi khỏi cõi trời);
  16.1 bỏ chữ bậc; 22.1, 22.2 bỏ các chữ ấy không có trong Pāli; 22.4 `duggatiṁ` → đọa xứ cho nhất quán với 6.4 và với cụm `Duggatiṁ nābhijānāmi` (227 khoá đọa xứ, 51 khoá khổ xứ).
  Trùng trong chính bài: 3 nhóm (1.1 = 20.3, 1.2 = 20.4, 9.3 = 23.3), cả 3 nhóm Việt giống nhau (chỉ khác dấu nháy hoặc dấu cuối dòng).
  0.1 `Therāpadāna` giữ nguyên Pāli (đa số tầng: 492 khoá, 11 khoá dịch Trưởng Lão Ký Sự).
  0.2 `Umāpupphiyavagga` → Phẩm Umāpupphiya (8 khoá; 1 khoá Phẩm Bậc Rải Hoa Umā).
  0.3 Pāli không có số thứ tự nên bản Việt không có số (đo 502 tệp tha-ap đã dịch: khớp có/không số 502/502, không tệp nào thêm số); translationTitle bằng đúng giá trị :0.3.
  Hình thức tiêu đề 0.3 và 26.1: Bài Kệ Tuyên Ngôn Về Trưởng Lão X. Đo ở phạm vi gần nhất (tha-ap320–339, 19 tệp): Tuyên Ngợ 7, Tuyên Ngôn 7, Ký Sự 3, Tuyên Ngợi 2;
  toàn tầng tha-ap (502 tệp): Tuyên Ngợ 242, Tuyên Ngôn 133, Ký Sự 110, Tuyên Ngợi 10, Kinh Kệ Của 5. Tuyên Ngợ và Tuyên Ngợi là chính tả sai, không có nghĩa; đã chọn Tuyên Ngôn.
  Hai phạm vi phân kỳ về đa số chuỗi (chính tả sai chiếm số đông toàn tầng) nên cần người biên tập phán một lượt cho cả cuốn.
  25.1 dùng công thức nhóm số nhiều: đã nói những bài kệ này (498 khoá; dạng số ít đã từng nói bài kệ này chỉ 2 khoá).
  27.1 tettiṁsatimo → thứ ba mươi ba (tiền lệ cùng dạng ở phẩm kề: Ārakkhadāyaka thứ ba mươi hai). 28.1 Tassuddānaṁ → Tóm tắt phẩm này (35 khoá toàn tầng; phạm vi gần nhất hòa 2:2 với Tóm lược).
  Chọn lọng cho `chatta` (34 khoá so với dù 13, tầng kn); đại kiếp (29 khoá) không dùng vì Pāli chỉ có kappa; 20.1 dùng Vào một trăm ngàn kiếp trước (4 khoá).
  Số Pāli, tự tính: sattakkhattuṁ 7 lần; bāttiṁsa 32 (tha-ap312:4.1 đã dịch ba mươi hai); chattiṁsa 36 (5 khoá đã dịch ba mươi sáu); kappasatasahassa và satasahassa là sata 100 nhân sahassa 1000 = 100.000 (một trăm ngàn);
  sattakappasata = 7 nhân 100 = 700; sattavassa = 7 tuổi; catasso = 4; tettiṁsatimo = 33; sattasatuttarā = 7 + 100 = 107 (cùng kiểu pañcuttarasatā = 5 + 100 = 105).
  Hiệu chuẩn kiểu 105: phẩm tha-ap123–132 đếm được đúng 105 nhóm kệ khớp với pañcuttarasatā; các phẩm tha-ap313–322 (57), tha-ap303–312 (51), tha-ap113–122 (90) đếm khớp đúng số trong tóm lược.
  Bất định, không thêm vào thân kinh:
  (1) 29.6 Pāli nói 107 bài kệ, nhưng đếm các nhóm kệ của mười bài trong phẩm này (mỗi bài kệ ba dòng có …pe… tính một) ra 106; không sửa theo số đếm, dịch đúng số Pāli.
  (2) Pāli nêu lời thọ ký ở 7.3 Bāttiṁsakkhattuñca rājā (32 lần làm vua) nhưng lời tự thuật ở 13.3 nói Chattiṁsakkhattuṁ cakkavattī (36 lần Chuyển Luân Vương); hai số khác nhau ngay trong Pāli, giữ nguyên cả hai.
  (3) 4.1–4.4: Pāli không có chủ ngữ; đọc là chiếc lọng được tung lên (3.4) bay về và dừng trên đầu Đức Phật; so sánh ví như cỗ xe được điều khiển khéo và bậc đệ tử tối thắng đã được điều phục (dantova sāvakuttamo). Chưa có tiền lệ nào trong tầng cho hai vế so sánh.
  (4) 10.2 vācāsabhimudīritaṁ đọc là vācā + āsabhiṁ + udīritaṁ, lời nói được cất lên bằng giọng hùng dũng của bậc Ngưu Vương (đã có tiền lệ lời nói hùng dũng ở tha-ap127 và tha-ap9). Trong tầng cụm này còn có các cách dịch khác nhau, không thống nhất.
  (5) 13.4 sattakappasatamhito đọc là kappasata + mhi + ito, trong bảy trăm kiếp kể từ đó; không có tiền lệ trong tầng, và cách tách -mhito chưa được phân xử độc lập.
  (6) 16.1–17.3: Sunanda được đọc là một Bà-la-môn khác với người nói (Pāli dùng ngôi ba so ở 16.4, và 17.3 tassa chỉ lời tùy hỷ của Sāriputta). Pāli không có động từ ở 16.4; chữ dâng được bổ sung từ cách sở thuộc sāvakaggassa (người nhận) và từ anumodi ở 17.1. Nếu Sunanda chính là người nói thì 16.4 và 17.3 phải đổi chủ ngữ.
  (7) 17.2 mahākathī dịch là bậc hùng biện (không có tiền lệ trong tầng; nghĩa đen là nhà thuyết giảng lớn).
  (8) 12.3 `saññaṁ paṭilabhiṁ` dịch là nhận ra (không có tiền lệ trong tầng).
  (9) 14.2 tidasaṁ puraṁ dịch theo tiền lệ duy nhất tidasapure ở tầng: thành của chư thiên Tam Thập.
