notes: |-
  Bản dịch chỉ từ Pāli root: tại commit đã ghim không có bất kỳ tệp Anh nào cho `tha-ap` (đo trên `source/upstream-manifest.json`, `sutta/kn/` của bản Anh chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud). Đây là giới hạn upstream, nên bài giữ `draft`.
  Bản song parallel TRÙNG PĀLI, dùng lại nguyên văn: **15** khoá Pāli trùng nguyên văn với bài đã dịch, **14** dùng lại y nguyên văn bản Việt cũ. Nguồn: `sn12.61` không liên quan; tiền lệ chính là các bài cùng phẩm `tha-ap84/85/87/88/89/90/91` — `Therāpadāna` (278 khoá toàn tầng) · `Bāttiṁsavaralakkhaṇaṁ` → đầy đủ ba mươi hai tướng tốt tuyệt hảo (4) · `ākāse ukkhipiṁ ahaṁ` → tôi rải giữa hư không cúng dường (tha-ap84) · `Pabbajitvāna kāyena` → Xuất gia rồi, bằng thân (snp3.1) · `Vacīduccaritaṁ hitvā` → Từ bỏ lời nói xấu ác (snp3.1) · `Dvenavute ito kappe` → Vào chín mươi hai kiếp trước (9) · `yaṁ pupphamabhiropayiṁ` → khi tôi dâng cúng hoa ấy (7) · `Duggatiṁ nābhijānāmi` → Ta không biết mình rơi vào khổ đau (83) · `buddhapūjāyidaṁ phalaṁ` → đây là quả báo của việc cúng dường Đức Phật (22) · `Paṭisambhidā catasso` → Bốn vô ngại giải (292) · `…pe…` → … (491) · `kataṁ buddhassa sāsanaṁ”.` → đã làm tròn lời dạy của Đức Phật”. (258) · `Tassuddānaṁ` → Tóm lược: (290).
  Một chỗ cố ý viết khác kho, đếm được: `pabbajiṁ anagāriaṁ.` có hai tiền lệ ngang nhau — con đã xuất gia, rời bỏ đời sống tại gia (sn8.12:3.4) và ta xuất gia sống đời không nhà (thig5.7:2.4), cả hai đều ngôi thứ ba. Bài này chọn **tôi xuất gia sống đời không nhà** vì khoá ngay trước `2.2` là `ākāse ukkhipiṁ ahaṁ` — Pāli tự nó chuyển sang ngôi thứ nhất, nên theo tiền lệ ngôi thứ ba sẽ tự mâu thuẫn trong chính bài.
  Tên phẩm CÓ CHIA, cần người biên tập gộp: `Timiravagga` đang có **Phẩm Timira** (4: tha-ap84/85/87/91) và **Phẩm Hoa Timira** (3: tha-ap88/89/90). Lát này theo đa số 4 ⇒ *Phẩm Timira*. Tên bài theo đa số đo được trên toàn tầng: **Bài Kệ Tuyên Ngợ Về Trưởng Lão** (109 khoá ở `0.3`, 223 khoá ở khoá kết) so với *Bài Kệ Tuyên Ngôn…* (46/105) và *Ký Sự Về Trưởng Lão…* (80/111).
  0 tiền lệ, đặt mới, ghi kèm lý do: `āṭṭhatālīsamāsisuṁ` → *bốn mươi mối tháng* (Pāli `aṭṭha` = 8 + `tālīsa` = 33, cộng như quy tắc số Pāli; không bản nào trong kho dịch cụm này) · `Pokkharavana` → *hồ Pokkharavana* · `pavissaṁ` không có, ở đây `phussaṁ` → *Đức Phật Phussa* theo đúng 4 tiền lệ tha-ap88/89/90/183 · `ājīvaṁ parisodhayiṁ` → *làm trong sạch cách nuôi mạng* (0 tiền lệ cho đoạn này; cụt `làm trong sạch` đã có 8 khoá trong tầng) · `manasā saṁvutena` → *với tâm ý tiết chế* (`tiết chế` 23 khoá) · `Padumābhāsanāmā` → *Có tên là Padumābhāsa*.
  Bất định đã ghi nhận, không che. (1) Ứng nghiệm `11.1–11.5` là uddāna nén tên các bài trong phẩm (`Timiranaṅgalīpuppha, nippannañjaliko adho / Dve raṁsisaññī phalado, saddasaññī ca secako / Padmapupphī`), không phải mô tả; giữ nguyên các tên riêng có dấu, dịch vị từ nối, y hệt cách `tha-ap192` và `tha-ap382` đã làm. (2) `chappaññāsa pakittitā` đọc là **sáu mươi** và dịch *là những bài kệ gồm sáu mươi câu* theo khuôn hai bài uddāna đã có; con số này là số ký của uddāna nguồn, không khớp số câu kệ đếm được trong phẩm, và bản dịch không tự sửa con số của nguồn. (3) `aṭṭhatālīsamāsisuṁ` không có bản Anh để đối chiếu nên `ambiguity_integrity` không vượt 9,0.
  Dấu lược: đúng một khoá lược (`6.2` = `…pe…` → `…`), đếm bằng `lược()` của `_hvi.py`; không mở rộng bất kỳ `…pe…` nào.
  `notes` ở đây là khối literal `|-` thụt 2 đặt ở GỐC file, đúng như `content/meta/sutta/kn/tha-ap84.yaml` và `sn/sn12.61.yaml` (đã đọc mẫu đích trước khi ghi).
