notes:
  - >-
    **ĐÃ TỰ TRA LẠI MỆNH ĐỀ `cp`, và kết quả nghiêng về phía kho đang lệch.** `cp` là `Cariyāpiṭaka`. Trong `content/translation/vi/project/sutta/kn/` có **19** tệp `cp`, **18** tệp có khối `:0.1`: **16** viết *Hạnh Tạng*, **1** (`cp34`) viết `Cariyāpiṭaka`, và 2 tệp (`cp1`, `cp35`) không có `:0.1`. Đa số 16/18 = *Hạnh Tạng* — và đó cũng là tên Việt đúng của `Cariyāpiṭaka` (`cariya` = hạnh, `piṭaka` = tạng), nên `cp34` mới là ngoại lệ lạt. Suy ra tên tạng phẩm từ tiền tố tệp là cách đo sai, đã đo thay.
  - >-
    `0.2` `Akittivagga` → *Phẩm Akitti* (5/5: cp2, cp3, cp5, cp6, cp7). `0.3` `Dānapāramī 4` → *Bố Thí Ba-la-mật Thứ Tư* (cp2 *Thứ Hai*, cp3 *Thứ Ba*, cp5 *Thứ Năm*). `0.4` `Mahāsudassanacariya` → *Hạnh Của Đại Sudassana* (khuôn cp: *Hạnh Của Saṅkha*, *Hạnh Của Vua Nimi*).
  - >-
    **Coverage tầng Anh: 0 Pāli có nội dung.** Cả 43 khoá của cp4 đều ngắn hơn 40 ký tự (đây là truyện ngự Phật ngâm), nên `substantiveSegments = 0` và tỷ lệ được coi là 1 theo đúng công thức của `src/lib/canon/reference.ts` (`substantive === 0 ? 1 : …`). Bản Anh đã ghim `cp4_translation-en-sujato.json` CÓ mặt và đủ 43 khoá (chỉ `cp4:10.1` để trống), nên tầng tham khảo Anh có thật — nhưng vì không có Pāli có nội dung nào thì cổng coverage không đo được gì cho bài này, và đó là giới hạn của phép đo chứ không phải của tầng.
  - >-
    **Thuật ngữ, có số đếm.** `mahīpati` → *đại vương* (`cp6:1.3`; `cp32:1.2` dùng *chúa đất*). `cakkavattī` → *vua Chuyển luân* (kho dùng cả *Chuyển luân vương* lẫn *vua Chuyển luân*). `vejja` → *thầy thuốc* (kn=6 mn=20). `yācaka` và `vanibbaka` đều → *người cầu xin* (`cp3:4.1` *Khi người cầu xin đến với ta* cho `yācake`; hai từ này là từ đồng nghĩa trong chính bài nên dùng chung một cách). `mahādāna` → *đại bố thí* (`cp6:3.4` *cuộc đại thí*). `māla` → *vòng hoa* (tha-ap107:1.2).
  - >-
    **Bất định đã ghi.** `:3.1` `ko chātako ko tasito` dịch *Ai cần dù, ai khát nước* theo cách đọc của bản Anh đã ghim (*Who needs an umbrella? Who is thirsty?*); theo nghĩa thường của `chātaka` thì là *khát*. `:3.3`–`:3.4` `Nānārattāni vatthāni, ko naggo paridahissati` được dàn lại thành *Người nào đang trần truồng, / sẽ mặc áo nhiều màu?* vì Pāli đặt động từ sau danh từ (`vatthāni` là tân ngữ của `paridahissati`).
  - >-
    **Nhặc kép giữ y hệt Pāli:** mở `“` ở `:1.1`, nháy đơn `‘…’` ở `:2.3`–`:4.2`, đóng `”` ở `:9.6`. **Không đối chiếu được tầng Việt hiện hành** (tại commit đã ghim chỉ có 26 chương Pháp Cú).
