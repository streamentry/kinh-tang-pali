notes: |-
  Đã đọc hết Pāli (81 khoá, 77 khoá ngoài khối tiêu đề `:0`) trước khi viết. Bài là Mẫu đề (mātikā) của Paṭisambhidāmagga: bảy mươi ba mục, mỗi mục một khoá `:1.1` … `:73.1`, theo một khuôn duy nhất "[điều kiện], paññā [loại] ñāṇaṁ", rồi một khối tổng kết `:74.1`–`:74.4`. Đã in cặp Pāli↔Việt cả 81 khoá ra đọc đối chiếu. Mọi mục dùng cùng một khuôn Việt "…, trí tuệ là trí …"; các mục mở đầu bằng danh từ không có định vị cách (:12.1, :33.1, :36.1, :39.1, :50.1) dùng dấu gạch dài thay cho "Trong …" để không biến danh cách thành định vị cách.

  COVERAGE ENGLISH ĐO ĐƯỢC. Mẫu số = 38 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) trên 77 khoá; Sujato phủ 0/38. Tầng english-sujato tại commit đã ghim có 755 tệp dưới kn/ và 0 tệp ps ⇒ not-published-upstream (không phải not-synced); lớp english-project không có uid này; tầng vietnamese-current chỉ có Pháp Cú. Bản dịch chỉ từ Pāli nên triangulation đặt 7.0 và status giữ draft theo blocker noEnglishEditionUpstream. Không tuyên bố đã đối chiếu tầng tham khảo nào. reference-gaps không cứu được published.

  SỐ PĀLI ĐÃ TỰ TÍNH. `tesattati` = te 3 + sattati 70 = 73 (khớp 73 mục `:1.1`–`:73.1` đếm được); `sattasaṭṭhi` = satta 7 + saṭṭhi 60 = 67 (tầng: 5/5 khoá chứa dạng này đã viết "sáu mươi bảy"); `cha` = 6; 67 + 6 = 73 khớp tổng, và sáu mục không chung với đệ tử là :68–:73 đúng sáu mục. `catusaṭṭhi` = catu 4 + saṭṭhi 60 = 64 (tầng: tha-ap10:10.2 và tha-ap62:7.3 đã viết "sáu mươi bốn"). `soḷasa` = 16 (113/114 khoá tầng "mười sáu"), `nava` = 9, `dvīhi` = 2, `tayo` = 3, `tiṇṇannaṁ` = 3. Không có thang lớn (nghìn, vạn).

  PĀLI TRÙNG NGUYÊN VĂN. Trong chính bài: 0 cặp trùng (đã dò 81 khoá) nên phép kiểm trùng nội bộ rỗng. Với tầng: 3 khoá Pāli của bài này trùng nguyên văn với khoá đã dịch ở tầng Việt dự án (đã dò toàn bộ 81 khoá, đối chiếu không phân biệt hoa thường): `:0.1` (7 cặp, 7/7 giữ Pāli "Paṭisambhidāmagga"), `:0.2` "1 Mahāvagga" (3 cặp, 3/3 giữ "Mahāvagga", bỏ số), `:0.4` lời kính lễ có chữ hoa "Bhagavato Arahato Sammāsambuddhassa" (9 cặp chữ hoa y hệt ở pv1, ja1, ja521, cp1, ne1, vv1, mil1, thag1.1, thig1.1: 8/9 viết "Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác."; 1/9 là thig1.1:1.0 "Kính lạ Đức Thế Tôn…" có vẻ lỗi gõ, báo chứ không sửa vì ngoài lát). Dùng lại nguyên văn dạng 8/9. Cả ba khoá dùng lại nguyên văn.

  TIÊU ĐỀ VÀ KẾT. `:0.3` "1.0 Mātikā" dịch "1.0. Mẫu Đề", giữ số thứ tự như ps1.1, ps1.7, ps1.8 (ps1.9 giữ nguyên Pāli). Mātikā không phải một "kathā" nên không dùng khuôn "Luận Bàn Về …"; tầng dịch mātikā là "mẫu đề" (an6.51), "bản mẫu" (an3.20), "đề mục" (mn33, 2 khoá), "bản tóm lược" (an5.156), giữ Pāli (dn16, an10.11); chọn "Mẫu Đề" là thuật ngữ gọn và quen thuộc. Colophon `:74.4` "Mẫu đề đã hoàn tất." theo ps1.7:12.3 và ps1.8:8.10.

  KHUÔN CÂU VÀ SỰ LỆCH VỚI PS1.1. Cùng công thức "… paññā … ñāṇaṁ" ps1.1 (18 khoá, như ps1.1:1.1) dịch "sự biết của trí tuệ …", ps3.7:1.1 cũng "Sự biết của trí tuệ"; bài này dịch "trí tuệ là trí …". Lý do: trong tầng Việt, ñāṇa ở cấp tên gọi dịch "trí" (463 khoá) nhiều hơn "sự biết" (79 khoá), và đúng hình thức "dukkhe ñāṇaṁ …" đã là "trí về khổ" ở dn33:1.11.105, dn22:21.5, mn141:24.2 (3/4, riêng sn56.18:1.5 dịch "sự biết khổ"). Hai khuôn cùng nghĩa nhưng người biên tập nên thống nhất ở ps1.1 khi cần.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `vavatthāna` → "xác định" (tầng 21/26 khoá "xác định"). `pariggaha` → "nắm bắt" (tầng: "chấp" 14, "nắm" 5; chọn "nắm bắt" để tách khỏi "xác định"). `nānatta` → "sự sai biệt" (115 khoá "sai biệt" so với "đa dạng" 41). `cariyā` → "hành" (ps3.5: oai nghi hành, trí hành, định hành; tầng chung: "hạnh" 1.356 khoá so với "hành" 545, nhưng ở ps chọn "hành" như ps3.5 vì cùng bộ); hệ quả là :17.1 "các hành" (cariyā) đứng gần :9.1 "các hành" (saṅkhāra), cùng chữ cho hai từ Pāli khác nhau. `abhiññā` → "thắng tri" (444 khoá, và ps1.1). `pariññā` → "hiểu rõ tột cùng" theo ps1.1:3.1 (cần được hiểu rõ tột cùng); toàn tầng "liễu tri" chiếm 248 khoá so với "hiểu rõ tột cùng" 23, nên đây là lựa chọn theo phạm vi gần nhất. `pahāna` → "trừ diệt" (ps1.1:4.1). `sacchikiriyā` → "chứng ngộ" (182 khoá). `paṭisambhidā` → "vô ngại giải" (493/516 khoá), nghĩa → "nghĩa vô ngại giải", pháp → "pháp vô ngại giải", `nirutti` → "ngữ từ" (an5.86, an5.95; an4.172 dùng "từ định nghĩa"), `paṭibhāna` → "biện tài" (an5.86, an5.95). `vipassanā` → "minh sát" (tầng: "quán" 93, "tuệ quán" 47, "minh sát" 17; chọn "minh sát" để :7.1 khỏi lặp "trí tuệ … tuệ quán"). `udayabbayānupassana` → "quán thấy sinh diệt" (dn33:1.11.44, dn34 "quán sát sự sinh diệt"). `ādīnava` → "nguy hại" (dn15:34.10). `vuṭṭhāna` → "xuất khỏi" (mn12:16.1, mn44:18). `sammasana` → "dò xét" (sn12.66, 3 khoá; an4.147:1.3 dùng "liễu tri"). `paccavekkhaṇa` → "quán xét lại" (tầng: "phản tư", "soi xét", "phản tỉnh" mỗi dạng vài khoá, không có đa số). `paṭisaṅkhā` → "suy xét". `vihāra`/`samāpatti` → "trú"/"chứng đạt" (ps1.1:39.9 "sự chứng đạt …"). `samucchede` → "đoạn tuyệt" (9 khoá, "đoạn trừ" 4) kèm "triệt để" cho `sammā`; ps3.7 dịch cùng gốc là "chấn trừ triệt để", tôi giữ "triệt để" nhưng không theo "chấn trừ" vì tầng không có tiền lệ nào khác. `samasīsa` → "ngang hàng" theo ps3.7 (3/3 khoá). `anupaṭṭhānatā` → "không hiện hữu" theo ps3.7:4.1. `pariyādāna` → "làm cạn" (tầng: "cạn" 40 khoá). `parinibbāna` → "bát-niết-bàn" (42 khoá so với "niết-bàn" 65 và "viên tịch" 9; chọn dạng đủ chữ vì không phải danh từ riêng của một vị). `sallekha` → "làm mòn" (ps1.1:28.2). `vīriyārambha` → "sự phát khởi tinh tấn" (dn33:2.3.21, dn34:1.8.53). `dassanavisuddhi` → "kiến thanh tịnh" (2 khoá). `pariyogāhaṇa` → "thâm nhập" (7 khoá). `sotadhātu` → "giới tai" (ps1.1:36.4). `dibbacakkhu` → "thiên nhãn" (45/45). `iddhividha` → "thần thông" (70/70). `āsavānaṁ khaya` → "đoạn tận các lậu hoặc" (228 khoá "đoạn tận"). `suññata` → "tánh không" (7 khoá). `tathaṭṭha` → "như thật" (34 khoá). `vosagga` → "xả bỏ" (tầng: "xả" 7, "từ bỏ" 5, "buông bỏ" 3); `pariccāga` → "từ bỏ" để tách hai từ. `sāvaka` → "đệ tử" (dn25, dn33). `indriyaparopariyatta` → "căn cơ mạnh yếu" (mn12:15.1, sn52.20:0.3 và 7 khoá). `anāvaraṇa` → "không bị che chắn" (thag7.2:7.3, snp5.1:30.1). `sabbaññutā` → "toàn tri" (50 khoá). `nirodhasamāpatti` → "sự chứng đạt diệt" (tầng: "diệt thọ tưởng" cho `saññāvedayitanirodha`, không cùng từ). `pāṭihīra` → "thị hiện" (dn33:1.10.145). `ñāṇacariyā`/`samādhicariyā` → "trí hành"/"định hành" (ps3.5:2.4–2.5).

  TÊN GỌI KHÔNG CÓ TIỀN LỆ HOẶC TIỀN LỆ MỎNG. `Mātikā` xem trên. `gotrabhuñāṇa` → "trí chuyển tộc" (tầng: gotrabhū chỉ có 3 khoá và dịch "chuyển tánh" ở mn142:8.1 trong nghĩa hạng người, "hạng … hành giả" ở an9.10, an10.16; không có tiền lệ cho tên gọi ñāṇa). `dhammaṭṭhiti` → "sự an trụ của pháp" (dn9:31.10 "tính ổn định của Pháp"; ps1.1:8.1 "phần an trụ"). `yamakapāṭihīra` → "thị hiện song đôi" (yamaka không có tiền lệ trong tầng; "Song thông" là tên quen thuộc nhưng không tìm thấy trong tầng nên không dùng). `āsaya` → "khuynh hướng" (tầng chỉ có `ajjhāsaya` "chí nguyện", dn25).

  BẤT ĐỊNH ĐÃ GHI (không thêm vào thân kinh). (1) `chinnavaṭumānupassane` (:13.1): `vaṭuma` toàn tầng chỉ có 2 khoá (ja415:9.2 "theo đuổi", mil5.1.7:5.1 trong từ ghép `parivaṭumakata`), không có tiền lệ; tôi dịch "con đường đã bị cắt đứt" theo nghĩa thông dụng "đường, lối" và không tuyên bố chắc chắn. (2) `saṅkhārupekkhāsu` (:9.1) là số nhiều định vị; bản Việt "sự xả đối với các hành" không phản ánh số nhiều. (3) `santiṭṭhanā` (:9.1) dịch "sự an trụ"; nghĩa chính xác có thể là "đứng yên trụ" trong ngữ cảnh xả. (4) `tīraṇaṭṭhe` (:21.1) dịch "ý nghĩa thẩm định", `tīraṇa` toàn tầng chỉ có một khoá (ne13:6.4) nên không có tiền lệ. (5) `padesavihāre` (:43.1) dịch "trú ở một phần": `padesa` có thể là "một phần" hay "một khu vực". (6) `ceto-vivaṭṭa` (:45.1) và `citta-vivaṭṭa` (:46.1) cùng dịch "sự quay đi của tâm", mất khác biệt `ceto`/`citta`; tầng cũng dịch cả hai là "tâm". (7) `vivaṭṭa` dịch "quay đi" ở :10.1, :11.1, :44–:49; tầng dùng `vivaṭṭ` 90 khoá, phần lớn nghĩa thế giới co lại/giãn nở, không có tiền lệ cho nghĩa này. (8) :38.1 `asallīnattapahitattapaggahaṭṭhe`: `pahitatta` dịch "sự dốc chí" và `paggaha` "sự nâng đỡ"; cấu trúc ghép ba từ có thể đọc khác. (9) :50.1: hai đối cách `sukhasaññañca lahusaññañca` đi cùng `ekavavatthānatā`; tôi đọc "xác định thân và tâm là một, cùng với tưởng lạc và tưởng nhẹ"; cách đọc khác là xác định cả tưởng lạc và tưởng nhẹ là một. (10) :52.1 `tiṇṇannaṁ cittānaṁ` "ba tâm" Pāli không nói ba tâm gì; tôi không thêm. (11) :55.1 `tiṇṇannaṁ indriyānaṁ` "ba căn" Pāli không nói ba căn gì; không thêm. (12) :41.1 `khantiñāṇa` dịch "sự chấp nhận"; tầng "nhẫn" 44 khoá, "chấp nhận" 61 khoá, không có cách chọn dứt khoát theo ngữ cảnh. (13) `viditattā`, `phuṭṭhattā`, `adhipatattā` (:41–:44) dịch bằng "do tính đã được …" / "do tính chủ đạo" cho đúng đuôi -ttā; một cách đọc ngắn hơn là "do đã biết", "do đã chạm đến".

  DẤU LƯỢC VÀ NHÁY. Không có `…pe…`, `…` hay `(…)` ở Pāli bài này nên bản Việt cũng không có (đã kiểm từng khoá, 0 lệch). Không có dấu nháy đơn hay kép ở Pāli nên bản Việt cũng không có (đã kiểm từng khoá, 0 lệch). Dấu `—` ở :12.1, :33.1, :36.1, :39.1 là dấu tách của bản Việt giữa chủ đề danh cách và vị ngữ; Pāli không có dấu câu tương ứng. `:74.2` giữ dấu chấm phẩy cuối khoá như Pāli.

  technical_integrity đặt 9.6 vì không chạy được npm run validate, npm test, npm run check và npm run build trong lượt làm việc này; đây không phải tuyên bố rằng cổng kỹ thuật đã pass.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 5 khoá bất đồng nghĩa → sửa 1 (ps1.0:45.1: `cetovivaṭṭe` “sự quay đi của tâm” → “sự quay đi của tâm ý”, vì `ceto` và `citta` là hai thuật ngữ khác nhau trong chính danh sách sáu “quay đi”, bản cũ dịch trùng chữ với 46.1 `cittavivaṭṭe`; theo ps1.5:136–137 dịch `ceto` là “tâm ý”, bản nguyên bài cũng tách hai thuật ngữ), giữ 2 (ps1.0:13.1: bản nguyên bài hiểu `vaṭuma` là phiền não, còn Pāli `vaṭuma` là đường, lối, cũng được dn14 dịch “dòng trôi”; giữ “con đường”; ps1.0:68.1: bản nguyên bài thêm “của người khác”, Pāli `indriyaparopariyatta` chỉ nói các căn cao thấp, không có “người khác”), bất định 2 (ps1.0:31.1 `vihārasamāpatti` là “các sự an trú và chứng đạt” hay “sự chứng đạt trú”, bản này theo ps1.1:439.1; ps1.0:36.1 `samasīsa` bản nguyên bài hiểu theo nghĩa “pháp đứng đầu được tịnh lặng”, bản này giữ “ngang hàng” theo ps1.1:472 và ps3.7, khác pe2:36.6 và ne37:522.3 dịch “đồng đỉnh”). Các mục 1–59 và 62–73 của bản nguyên bài đánh số trùng số mục của Pāli (bản nguyên bài không có hai mục 60–61), nên đối chiếu được ở mức mục. Mọi số đã khớp: bảy mươi ba trí, sáu mươi bảy và sáu, sáu mươi bốn phương diện, mười sáu trí hành, chín định hành. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt cả 81 khoá, đối chiếu lại bản
  nguyên bài Bhikkhu Indacanda theo từng mục 1–59 và 62–73, đoạn song song `mil1:1.1`, `kp1:1.1`,
  `bv1:1.1` cho `0.4`): sửa 0 khoá, không thấy lỗi nghĩa, phủ định, số lượng hay chủ thể. Kiểm lại ba
  chỗ nghi: `36.1` `anupaṭṭhānatā` "không hiện hữu" giữ vì `ps3.7:4.1` giải chính từ này bằng "không
  hiện hữu" (khác `8.1` `upaṭṭhāna` "hiện khởi" nhưng là hai từ, hai ngữ cảnh); `68.1`
  `indriyaparopariyatta` "căn cơ mạnh yếu" khớp `mn12:15.1`–`15.2`, `ps2.6:76.1`, `ps2.6:76.5`
  (ps1.4:96.17 và ps2.9:34.1 dịch "hơn kém", "cao thấp" là cách diễn đạt khác, cùng nghĩa); `0.4` "Đức
  Phật" so "Đức Thế Tôn" ở `mil1`, `kp1`: tầng chia 14 so 11 khoá, giữ theo đa số, không phải sai
  nghĩa. Giữ nguyên các bất định đã ghi (`13.1` `vaṭuma`, `31.1` `vihārasamāpatti`, `36.1`
  `samasīsa`); không có bản Anh, điểm giữ.

  Lô G4 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): sửa ps1.0:49.1, saccavivaṭṭe dịch sự thật nay
  thành chân lý, khớp ps1.1 (501.1–503.13) và ps1.5 (136.2–137.4) nơi saccavivaṭṭa luôn là sự quay đi
  của chân lý. Không có English độc lập nên triangulation giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: B9 — `21.1`, `56.1` (`pariññā`/`parijānāti` = “liễu tri”); B10 — `22.1`, `57.1` (họ `pahāna`/`pahīna` = “đoạn trừ”, `pajahati`/`pahātabba` = “từ bỏ”, bỏ “trừ diệt”).
