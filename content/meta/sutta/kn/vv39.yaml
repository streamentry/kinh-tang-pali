notes: |-
  Dịch từ Pāli root — không có tầng Anh đã ghim cho `kn/vv`, xem `blocking_errors`.
  Đối chiếu bằng tiền lệ trong chính bộ: `vv1`, `vv12`, `vv26`, `vv27`, `vv28`, `vv41`, `vv42`, `vv49`, và bằng **Pāli song song** `vv38`, `vv44`, `vv50` (cùng phẩm Mañjiṭṭhaka, cùng thứ tự khoá) để đọc ba câu kệ `Ghāyase…` và `…rukkhho mañjūsako yathā` khi bản Việt chưa có.
  **Dùng lại nguyên văn 5 khoá có Pāli trùng**: `Vimānavatthu` (29 bài), `Chuyện Cung Điện Nữ Hư Không` cho `Itthivimāna` (8 bài; bỏ `Thiên Cung Của Nữ Giới` 1× của vv49), `Phẩm Mañjiṭṭhaka` (3 bài), `“Thuở trước giữa loài người tôi là một phụ nữ,` (`vv1`/`vv27`/`vv28` — bỏ hai cách `Khi ta còn làm người…` của vv12 và `Khi con còn là…` của vv49), `với tâm tịnh tín bằng chính đôi tay mình.` (5 bài).
  **0 tiền lệ cho phần lớn bài** — thuật ngữ chính lần đầu xuất hiện: `soṇṇavālukasanthate` → *nền phủ cát vàng đẹp đẽ* · `Pañcaṅgikena tūriyena` → *chiếc tựa ngọc quý năm mặt* · `suppavādi` → *chỗ tựa* (đọc theo `vv50:1.4` `naccasi suppavādite`, nơi nàng nhảy múa trên chính thứ ấy, và `tūriye pañcaṅgike` của `vv50:4.4`/`5.4`) · `Ogāhasi sālavanaṁ` → *áo dệt ngọc quý* · `pupphitaṁ sabbakālikaṁ` → *rực rỡ mọi thời khắc* · `mañjūsako` → giữ Pāli *Mañjūsaka* (tên cây) · `sampamodāmanāmayā` → *chứng đắc thiên thần lực, có uy thế lớn lao* (theo `vv41:3.1`/`vv12:2.1`, 7 + 9 lần trong kho).
  **BẤT ĐỊNH (1.3–1.4, không có tầng Anh nào để phân xử).** `Pañcaṅgikena tūriyena, ramasi suppavādite.` — `tūriya` có thể là *chiếc tựa/ghế trang ngọc* hoặc *ngọc quý năm mặt*; `suppavādi` là danh từ chỉ chỗ tựa. Dịch theo cách đọc của `vv50` (xem trên): *với chiếc tựa ngọc quý năm mặt, / nàng ngồi thỏa thích*. Cách đọc thay thế (*nàng cưỡi thỏa thích trên lưng kỳ lân*) **không** được chọn vì `suppavādi` ở `vv50` đi cùng `naccasi` (nhảy múa), không phải `ramasi` (cưỡi).
  **BẤT ĐỊNH (3.1–3.4, câu hỏi của Tôn giả Moggallāna).** `Yassa yasseva sālassa, mūle tiṭṭhasi devate; So so muñcati pupphāni, onamitvā dumuttamo.` — đây là một **bài đố** hàm ý, và cả bốn câu đều là ẩn dụ: `mūle tiṭṭhasi` (đứng trên nền tảng), `muñcati pupphāni` (rải thải hoa), `onamitvā dumuttamo` (cúi đầu bái, không ai sánh bằng). Giữ sát nghĩa ẩn dụ, **không** giải thích trong thân kinh. Đọc được việc nữ thiên 6.1–8.4 kể lại (là nữ nô, dâng phẩm vật, đảnh lễ Đức Phật bằng đôi tay hoa ngọc) là câu trả lời của chính bài, không phải do người dịch thêm.
  **BẤT ĐỊNH (4.1–4.2).** `Vāteritaṁ sālavanaṁ, ādhutaṁ dijasevitaṁ` — bản nháp đầu dịch *bị gió từng giật vặt…* lặp `gió` ở câu sau, nơi Pāli không có chủ ngữ. Đã sửa thành *bị cuốn lấn, bị vạt áo lôi kéo*.
  Nháy kép: `1.1` mở và `5.4` đóng (câu hỏi Moggallāna), `6.1` mở và `8.4` đóng (lời đáp của nữ thiên) — cân trên cả bài, đúng như Pāli.
  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|check`; coordinator cần chạy đủ bốn lệnh sau trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, và `npm run build`.
  Lượt cải thiện 2026-10-11 (kiểm toán đối kháng độc lập; THAY THẾ các mục "thuật ngữ" và "BẤT ĐỊNH" ở trên, vốn dựa trên cách đọc sai): đọc từng cặp Pāli↔Việt phát hiện bản trước sai nghĩa thật ở 22/33 khoá kệ (1.3, 1.4, 2.2, 2.3, 2.4, 3.1–3.4, 4.1–4.3, 5.1–5.4, 6.2, 6.4, 7.1, 7.2, 8.3, 8.4); bản cũ đọc đây là "bài đố" và bịa nghĩa ẩn dụ. Đã dịch lại 30/37 khoá (gồm 0.4), tập khoá và thứ tự giữ nguyên. Loại lỗi: (a) chủ thể/ngữ pháp — `Ogāhasi sālavanaṁ` (nàng đi vào rừng sa-la, không phải "mặc áo dệt ngọc quý"), 3.1–3.4 (cây sa-la nào nàng đứng nơi gốc, cây ấy cúi xuống thả hoa; không phải "người nào… cúi đầu bái"), 4.1–4.2 (`sālavanaṁ` là rừng bị gió lay động có chim lui tới, không phải "áo dệt"), 4.3 (`gandho` là chủ ngữ của `vāti`: mùi hương lan, không phải "gió thổi"); (b) vai nói — 5.3 `pucchitā` là nữ thiên "được hỏi", không phải nữ thiên đi hỏi; 5.4 là câu hỏi; (c) từ/vật sai nghĩa — `tūriya` là nhạc (không phải "chiếc tựa ngọc"), `suppavādite` là "khi nhạc được tấu hay" (không phải "ngồi thỏa thích"), `sālapupphehi okiriṁ` là rải hoa sa-la (không phải "đảnh lễ bằng đôi tay đeo ngọc", cùng cụm ở `tha-ap407:44.4`), `vaṭaṁsaka` là vòng hoa cài, `ayirakule` là danh từ (nhà chủ nhân, không phải tên "A-yira"), `anāmayā` là không bệnh (không phải "chứng đắc thiên thần lực"; cách đọc `sampamodām' anāmayā`, đối chiếu `ja382:7.4` `homi anāmayā`), `apetasokā` là không còn sầu muộn. Khoá 0.4 bỏ "Thứ Nhất" (Pāli 0.4 không có `paṭhamaṁ`; từ ấy thuộc 9.1) cho khớp `vv44`, `vv50`; `translationTitle` sửa theo. Đo tiền lệ: `Ahaṁ manussesu manussabhūtā` có 17 nơi dịch "Khi tôi/ta còn làm người giữa loài người" so với 3 nơi "Thuở trước giữa loài người tôi là một phụ nữ" (vv1, vv27, vv28; bản vv39 cũ theo nhóm ba) — đổi theo đa số, `manussabhūtā` không có ý "phụ nữ". `Ghāyase`/`passasi` đọc theo bị động ("được ngửi thấy / được nhìn thấy") như `vv44`, `vv50`, vì Pāli không có đuôi mệnh lệnh (`ghāyassu`); `vv38` và `vv39` bản cũ dịch mệnh lệnh. `pucchitācikkha`: đa số `vv24`, `vv34`, `vv47` và `pv10` dịch "được hỏi, hãy cho biết".
  Điểm tiêu chí (từ → sang): semantic_fidelity 9.0 → 8.8 · grammar_logic 9.0 → 8.8 · segment_alignment 10.0 → 9.6 · terminology 8.8 → 8.5 · vietnamese_clarity 9.0 → 8.8 · han_viet_balance 9.3 → 9.2 · ambiguity_integrity 8.8 → 8.6; source_provenance, triangulation, technical_integrity giữ nguyên. Điểm hạ nhẹ chứ không giữ cao vì bản trước đã sai nặng mà tự chấm 9.04, còn bản sửa chỉ do một người đọc, không có tầng Anh đối chiếu độc lập; không thêm blocker mới vì mọi lỗi đã tìm được đều đã sửa trong lượt này.
  Bất định còn lại: (1) `ayirakule` — chủ nhân (`ayya`) hay "nhà quyền quý" (`pv47:4.3` `ayyakulesu` dịch "nhà quyền quý"); (2) `vaṭaṁsaka` — vòng hoa cài đầu hay cài tai (`tha-ap229:1.3` dịch "vòng hoa cài tai"); (3) `Mañjiṭṭhaka` giữ như tên cung điện, không dịch nghĩa gốc (`mañjiṭṭha`, màu thiên thảo); (4) `anāmayā` đọc là không bệnh, chưa có tầng Anh để phân xử; (5) `Ghāyase`/`passasi` đọc bị động, chưa có tầng Anh để phân xử; (6) `Pañcaṅgikena tūriyena` dịch "dàn nhạc năm phần" (`vv44`, `vv50` dịch "nhạc năm phần"); (7) tiêu đề phẩm `Itthivimāna` hiện dịch "Nữ Hư Không" ở 0.2 (Pāli không có `ākāsa`) — lặp cả bộ nên không sửa riêng một tệp, cần sửa đồng loạt. Lỗi ngoài tệp: `vv36:8.4` và `vv38:9.4` (`sampamodāmanāmayā`) dịch "với tâm hân hoan hỷ phát đến" cùng lỗi đọc như bản vv39 cũ; `vv36:8.3`/`vv38:9.3` có chữ "sầu muốn" (nghi lỗi gõ, nên là "muộn"); `vv38:7.1–7.2` dịch `Ghāyase`/`passasi` theo mệnh lệnh.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 3 khoá bất đồng nghĩa → sửa 1 (vv39:5.1–5.2: trước *mùi hương … được ngửi thấy, hình dáng … được nhìn thấy* → sau *nàng ngửi mùi hương … nàng thấy hình dáng phi nhân*, vì `ghāyase` và `passasi` là động từ ngôi hai chủ động, người ngửi và người thấy là vị nữ thiên được hỏi, bản trước biến thành câu bị động mất chủ thể), giữ 2 (vv39:6.2: `ayirakule` giữ *gia đình chủ nhân*, bản nguyên bài hiểu là gia đình người chồng nhưng `ayira` trong Pāli chỉ *chủ/quý nhân*, không nói chồng; vv39:1.1: giữ tên riêng *Mañjiṭṭhaka* thay vì dịch nghĩa *màu đỏ tía* của bản nguyên bài, theo cách xử lý tên cung điện trong tầng), bất định 0. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
