  Đối chiếu Pāli + Anh Sujato (7/8 khoá; khoá 2.1 Sujato để trống). Không có bản Việt hiện hành — giới hạn upstream.
  Tiền lệ: xuất gia vì lòng tin theo sn4.22:4.1; tu tập các pháp thiện (mn14); an ổn khỏi ách cho yogakkhema (nhiều chỗ); hãy vui thích (ud3.2, snp3.11); bạn lành (an7.34, dhp78). mittaratā 0 tiền lệ exact: mitte là bạn bè (số nhiều), bhava là hãy, giữ chơi chữ Mittā/bạn bè như Sujato (appreciate your spiritual friends, Mittā).
  Khoá 2.1 giữ đúng hai dấu … theo Pāli, không mở rộng.
