notes: |-
  Dịch trọn 111/111 khoá của `Niddesavāra` (phần tóm lược bằng kệ): lời dẫn `1.1`, 17 kệ về mười sáu hướng dẫn (`2`–`17`), 6 kệ về năm lối (`18`–`23`), 4 kệ đếm mười hai mục (`24`–`27`), cộng ba dòng tiêu đề nhỏ `2.0`, `18.0`, `24.0`. Không khoá nào ngoài tập khoá Pāli. Dịch chỉ từ Pāli root đã ghim, đối chiếu tiền lệ đếm được trong các bài `ne` đã có (nhất là các khoá trích lại chính những bài kệ này ở `ne7:1.2`, `ne8:1.2`, `ne8:1.4`, `ne11:1.2`, `ne13:1.2`, `ne16:1.2`, `ne17:1.2`, `ne19:1.2`, `ne19:14.1`–`14.2`). Thẻ `<b>…</b>` trong Pāli (đánh dấu tên từng hướng dẫn và lối) không đưa sang bản Việt, đúng như toàn tầng (0 khoá Việt có thẻ HTML).

  **Coverage English: không đo được.** Mẫu số = 0 khoá Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`): mọi dòng kệ của bài đều dưới ngưỡng (dài nhất 37 ký tự, ở `25.2`). Vậy cổng coverage không đo được gì, và chuyện đó không phải sự đồng thuận về cách dịch. Độc lập với cổng, thực tế là: Sujato 0 khoá, `english-project` 0 khoá, `vietnamese-current` 0 khoá. Không có entry nào trong `reference-gaps.yaml` cứu được bài, và có entry cũng không cứu được `published`.

  **Blocker thứ hai là thật.** Bộ thuật ngữ Netti ở tầng Việt chưa nhất quán (đo ở các bài `ne` đã dịch): `hāra` là *hướng dẫn* ở 29 khoá (`ne6`–`ne19`, dạng *nhóm … hướng dẫn*) nhưng *phương thức* ở 39 khoá (`ne1`, `ne2`, `ne20`–`ne35`). Bài này theo *hướng dẫn* theo yêu cầu người điều phối, nên các chỗ có chữ `hāra` lệch `ne1`, `ne2` và `ne20`–`ne35`. Cần người biên tập chọn một cách cho cả bộ.

  **Chỗ bài này cố ý khác `ne2`** (Pāli thắng; đã đo tiền lệ):
  - `vicaya`: bài này dịch *tra xét*; `ne2` dịch *tích lũy* (0 nơi khác dùng *tích lũy* cho `vicaya`). Pāli `3.3` tự định nghĩa nó là `pavicaya` của bài kinh (*sự tra xét*), nên *tích lũy* không có căn cứ ở đây.
  - `vevacana`: *ngữ đồng nghĩa* (32 khoá trong `ne`, gồm `ne13:1.1`) thay *diễn đạt bằng lời* (2 khoá, `ne2`); Pāli `11.1`–`11.2` nói thẳng là nhiều `vevacanāni` cho cùng một pháp.
  - `lakkhaṇa`: *đặc trưng* (60 khoá, gồm `ne8:1.2`, `ne8:1.4` trích đúng câu này) thay *dấu hiệu* (5 khoá, gồm `ne2`, `ne24`).
  - `otaraṇa`: *sự đi vào*, theo động từ `otaranti` đã dịch *đi vào* ở `ne19:2.1`, `ne19:2.2`; `ne2` dịch *dẫn đưa*, `ne31` dịch *vượt bậc*. Ba cách khác nhau cho một tên, không cách nào có đa số.
  - `naya`: *lối* (không thêm *kể* như `ne2:5.4`, `ne2:6.1`; Pāli `naya` là lối, phương pháp, không có nghĩa kể).
  - Tên năm lối: `nandiyāvaṭṭa` → *vòng xoay hoan hỷ* (`nandī` + `āvaṭṭa`); `sīhavikkīḷita` → *đùa giỡn của sư tử*; `disālocana` → *nhìn khắp các phương*, theo `21.3`, `22.1`, `23.2` (`disā viloketvā`); `aṅkusa` → *móc câu*. `ne2:6.2`, `ne2:8.3`, `ne2:9.1` dịch *đánh bóng như sư tử* và *soi như gương* (không có căn cứ ở `vikkīḷita`, `disā` và `locana`), *cây gai đẩy*, *tuyên thuật làm vui lòng*. 0 tiền lệ ngoài `ne2` cho cả năm tên.
  - `dvādasapada` (`24.0`): *mười hai mục*; `ne1:2.1` dịch `dvādasa padāni suttaṁ` là *bộ kinh mười hai câu kệ*. `pada` trong `25.3`, `26.2`, `26.3`, `27.1` là mục đếm được (6 + 6, 3 + 6, 9), không phải câu kệ.

  **Chỗ khác ne2 đã không đổi.** `catubyūha` *bốn phần*, `āvaṭṭa` *quy căn* (6 khoá), `vibhatti` *phân loại*, `parivattana` *chuyển đổi*, `paññatti` *định danh*, `sodhana` *thanh tẩy*, `adhiṭṭhāna` *áp dụng* (8 khoá), `parikkhāra` *trợ duyên*, `samāropana` *gom góp*, `padaṭṭhāna` *nền tảng ứng với* (65 khoá), `yutti` *lý luận*; `nirutti` *định nghĩa* (`ne25:2.2`), `adhippāya` *mục đích* (`ne25:2.3`–`2.4`).

  **Tiền lệ tái dùng nguyên cụm.** `5.1` theo `ne7:1.2` (*Bậc Chiến Thắng thuyết giảng pháp*); `6.1` theo `ne8:1.2`, `6.2` theo `ne8:1.4` (*cùng có một đặc trưng*); `14.1` theo `ne16:1.2` (*Với câu hỏi đã được giải quyết*); `15.1`–`15.2` theo `ne17:1.2` (*tính đồng nhất*, *tính khác biệt*); `17.1`–`17.2` theo `ne19:14.1`–`14.2` (*có chung một gốc*, *bậc Mâu-ni tuyên bố là cùng một nghĩa*); `17.3` theo `ne19:2.1` (*cần được gom góp*). Pāli trùng nguyên văn từng byte với khoá đã dịch ở bài khác: 0 cặp (các bài kia trích kệ trong dấu nháy và có `ti`), nên không có cặp nào để đối chiếu từng byte; trùng nội dung 8 khoá, cả 8 khoá dùng đúng bản Việt đã có. Trùng nguyên văn trong chính bài: 0 cặp (phép đo rỗng, không phải kết quả sạch).
  Đã chọn theo tầng: `bhagavā` *Đức Thế Tôn*; `taṇhā` *tham ái* (`ne20:5.6`); `avijjā` *vô minh*; `samatha`/`vipassanā` *chỉ*/*quán* (`ne28:2.2`); `vipallāsa` *đảo lộn* (18 khoá, so với *đảo ngược* 2 khoá); `kusala`/`akusala` *thiện*/*bất thiện*; `pahīna` *từ bỏ* (15 khoá); `bhāvita` *tu tập*; `paṭiccuppāda` *duyên khởi*; `ākāra` *phương diện* (`ne17:10.1`); `gocara` *cảnh giới* (`ne23:2.1`, `ne29:2.1`); `bhūmi` *đất nền* (`ne11:1.2`); `asādhāraṇa` *không chung* (`ne18:2.6`); `saddhamma` *chánh pháp* (0 tiền lệ trong `ne`); `assādādīnavatā` *vị ngọt và nguy hại* (`ne20:7.11`).

  **BẤT ĐỊNH — ghi lại, không giấu.**
  - `tipukkhala` (`19.4`) dịch *ba cánh sen* bằng cách đọc `ti` + `pukkhala` (sen). Đây là chỗ không kiểm chứng được: không có bản Anh, không có tiền lệ Việt (`ne2` dịch *chất đống ba tầng*, cũng 0 chứng cứ độc lập). Có thể `pukkhala` không có nghĩa là sen ở đây.
  - `15.3` `te na vikappayitabbā` dịch *không nên bị phân tách theo cách khác*. Tiền lệ ở `ne17:2.1` (*phải được ghi nhớ đúng như vậy*) cho thấy ý là giữ nguyên như đã chỉ ra, nên tôi tránh chữ có nghĩa mạnh (*phân biệt*, *nghi ngờ*). Động từ `vikappati` không có tiền lệ trong tầng Việt (0 khoá).
  - `25.4` `attho kammañca niddiṭṭhaṁ`: `kamma` ở đây không phải nghiệp mà là *việc làm, tác dụng* của lời giảng; dịch *việc làm*, không thêm giải nghĩa. Không chắc nó chỉ rõ việc gì.
  - `22.2` `ukkhipiya yaṁ samāneti`: tôi dịch `yaṁ` như đại từ quan hệ gắn với lối `aṅkusa` (*nhấc lên và gom lại … lối này gọi là móc câu*), không dịch riêng chữ `yaṁ`. Cách đọc `yaṁ` là tân ngữ của `samāneti` cho cùng ý.
  - `20.1`–`20.2` đọc theo trật tự chéo (`vipallāsehi` → `kilese`; `indriyehi` → `saddhamme`). Pāli không nối các cặp bằng `ca`, nên cũng có thể đọc cả hai cặp là một nhóm.
  - `16.3` `hetumavakaḍḍhayitvā` dịch *sau khi rút nhân ra*; `avakaḍḍhati` không có tiền lệ (0 khoá).
  - `8.2` chủ ngữ ngầm của `pariyesati` là hành giả hay người giảng; dịch *người ấy*.
  - `27.4` `tettiṁsā ettikā nettīti` dịch *Netti chỉ có chừng ấy: ba mươi ba*; câu không nêu chủ thể đếm.
  - `9.3`–`9.4`: Pāli cắt đôi từ `asādhāraṇe` qua ranh giới khoá (`asādhā-` / `raṇe`), nên bản Việt cũng cắt đôi *không-* / *chung*, giữ dấu gạch nối như Pāli.

  **Số Pāli.** Đã tính từng số: `soḷasa` 16 (`23.1`); `tīhi` 3 (`23.4`); `dvādasa` 12 (tiêu đề `24.0`); `chaṭṭha` thứ sáu, và danh sách ở `24.1`–`24.3` có đúng 6 mục (akkhara, pada, byañjana, nirutti, niddesa, ākāra); `25.1`–`25.2` liệt kê 6 mục của nghĩa (saṅkāsanā, pakāsanā, vivaraṇā, vibhajanā, uttānīkamma, paññatti); `chahi` 6 (`25.3`); `tīṇi` 3 và `chappadāni` 6 (`26.1`, `26.2`) cộng thành `navahi padehi` 9 (`26.3`); `navappadāni` 9 và `catubbīsa` 24 (`27.1`, `27.2`) cộng thành `tettiṁsā` 33 (`27.4`): 9 + 24 = 33, khớp; 6 + 6 = 12 khớp `dvādasa`. Không có số lớn.

  **Dấu lược và nháy.** Pāli không có `…`, `(…)`, nháy kép hay nháy đơn ở khoá nào; bản Việt cũng không có (đo từng khoá, 0 lệch trên 111 khoá).

