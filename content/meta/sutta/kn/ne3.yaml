  - Còn một chỗ cần người biên tập ở cấp cả tầng, nhưng KHÔNG phải lỗi riêng của bài này nên không giữ làm blocker: `hāra` là *hướng dẫn* ở `ne3` và `ne4`–`ne19` (các bài trích lại đúng những bài kệ này, như `ne4:39.4` lặp `2.4`) nhưng là *phương thức* ở `ne1`, `ne2` và `ne20`–`ne35`. Bài giữ *hướng dẫn* như yêu cầu ban đầu của người điều phối; nếu cả bộ đổi sang *phương thức*, chỉ cần sửa 18 khoá có chữ này ở `ne3`.
  - Chấm lại: `semantic_fidelity` 8.8 → 8.9, `grammar_logic` 8.8 → 8.9, `terminology` 8.5 → 8.9, `vietnamese_clarity` 8.7 → 8.8; `triangulation` giữ 6.8 (không có bản Anh độc lập, trần 8.0); `technical_integrity` giữ 9.6 vì cổng kỹ thuật (`npm run validate`, `npm test`, `npm run check`, `npm run build`) chưa chạy ở bước này. Trung bình thô 8.9.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 48 khoá chênh lệch lớn nhất → khác nghĩa 0 được xác nhận: sửa 0, giữ 46 (hầu hết là tên mười sáu hướng dẫn và các lối: bản mù giữ nguyên tên Pāli (`Padaṭṭhāna`, `Aṅkusa`, …) hoặc dịch `padaṭṭhāna` là “cận nhân”, bản dự án dịch thành tiếng Việt theo tiền lệ đã đo ở trên; đây là khác nhau về chọn thuật ngữ, không phải khác nghĩa; ngoài ra `nirutti` “định nghĩa” so với “từ nguyên”, `anugīti` “lời kệ nối theo” so với “sự tụng lại”, `bhūmi gocaro` “đất nền, cảnh giới” so với “phạm vi, lãnh vực hoạt động”: đều cùng trường nghĩa), bất định 2 (ne3:15.3 `te na vikappayitabbā` và 25.4 `attho kammañca niddiṭṭhaṁ`: bản mù cũng tự đánh dấu không chắc, trùng với bất định đã ghi ở trên; giữ nguyên). Đọc đối kháng lại toàn bài theo Pāli: đã đếm lại 16 kệ hướng dẫn (2–17), ba lối (18–20) cùng `disālocana` và `aṅkusa`, các số 12, 6 + 6, 3 + 6, 9 + 24 = 33; khớp, không đổi khoá nào. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; đoạn song song ne20:1.2,
  ne35:5.2): sửa 0 khoá; đọc lại 111 khoá, cộng lại 6 + 6 = 12, 3 + 6 = 9, 9 + 24 = 33 khớp. Giữ 1 chỗ
  khác đoạn song song: `23.2` *nhìn khắp các phương* so với ne20:1.2 *nhìn khắp các hướng*, cùng nghĩa
  `disā viloketvā`. `26.3`–`26.4` `bhagavato … vacanassa attho`: bản Việt tách `bhagavato` khỏi
  `vacanassa` theo ranh giới khoá, nghĩa đúng nên giữ. Bất định cũ (`15.3`, `25.4`, `22.2`) còn
  nguyên. Ghi nhận ngoài bài: `hāra` là *hướng dẫn* ở ne3 nhưng *phương thức* ở ne2, chờ người biên
  tập.

  Quyết định hội đồng biên tập 2026-10-16: B5 — 19 khoá (`2.0` … `23.1`) (`hāra` = “phương thức”; tiêu đề `-vibhaṅga` không dịch là “nhóm”).
