  `Jātassare gavesanto, / dakajaṁ pupphamuttamaṁ` (2.1–2.2) — BẤT ĐỊNH LỚN NHẤT CỦA LÁT, ghi rõ. `dakaja` là hapax toàn tầng Pāli đã ghim (chỉ xuất hiện ở đúng khoá này), nên không có bản song ngữ nào để đối chiếu. Tôi dịch theo cách đọc có cơ sở từ chính câu kệ: `Jātassara` là cây/thực vật được tìm hái (đối chiếu `tha-ap245:1.1` `Jātassarassa vemajjhe` — “ở giữa cây Jātassara”; `tha-ap343:2.3` và `tha-ap397:5.3` `Jātassaraṁ samogayha` — “nắm lấy Jātassara”), `dakaja` là hoa hái được từ đó, và `pupphamuttamaṁ` là “hoa tuyệt nhất”. Câu 2.1–2.4 đọc thành: ông tìm ở cây Jātassara lấy đóa hoa Dakaja tuyệt đẹp nhất, cùng những đóa hoa Bandhujīvaka, rồi lúc ấy ông trông thấy bậc sa-môn. Cách đọc thay thế (chưa loại trừ được): `dakaja` là tên cây và `Jātassara` là hoa, tức đảo hai vị trí; hoặc `Jātassare` là địa danh. Chỗ này tôi đã hạ `semantic_fidelity` xuống 9,2 và `ambiguity_integrity` xuống 9,1 thay vì bịa một nghĩa chắc chắn cho `dakaja`; hai tên thực vật được giữ nguyên dạng Pāli nên không có chữ nào bịa thêm.

  Tên riêng giữ dạng Pāli, không dịch nghĩa: `Siddhattha` (1.1, 3.4), `Bandhujīvaka` (2.3), `Samuddakappa` (5.3), `Jātassara`, `Dakaja`. Ở 2.3 tôi viết `hoa Bandhujīvaka` chữ hoa, vì `Bandhujīvaka` là tên hoa đã được dùng như danh xưng ở `:0.3` và lục kết; ba tệp khác trong tầng vẫn viết thấp `hoa bandhujīvaka` — đã báo, không tự sửa ngoài lát.

  `Ubho hatthehi paggayha` (3.1) — tầng có 3 mẫu “Tôi nâng hoa bằng cả hai tay”, 2 mẫu “nâng lên bằng cả hai tay”, 1 mẫu “Chắp hai bàn tay nâng lên”. Ở đây chủ thể là vị trưởng lão đang kể, không phải “tôi”, nên dùng lại nguyên văn sẽ sai ngôi kể: tôi dịch “Ông nâng hoa bằng cả hai tay”, giữ nguyên lõi `nâng hoa bằng cả hai tay` mà đổi chủ thể. Đây là ví dụ loại BRIEF_VI4 §3 nói: Pāli trùng mà bản Việt phải khác.

  `sayambhū` dịch “tự tại” (6 mẫu) thay vì “Tự Chứng” (4 mẫu). `sabbi vaṇṇito` dịch “được tất cả ca ngợi”, không thêm “thế gian” vào `sabhi`. `Samādhiṁ so samāpanno` dịch “Ngài đã nhập vào định” theo mẫu `tha-ap287:1.3`. `nisīdi pabbatantare` dịch “ngồi giữa khe núi” cho cùng phẩm với `tha-ap185:1.2` (`nisinnaṁ pabbatantare`), theo đa số 4/7 của cụm Pāli này.

  `sukkhato` (không có) — bỏ.

  `eko āsiṁ janādhipo` (5.2) dịch `chỉ có một vị chúa tể muôn dân;` theo đúng mẫu có sẵn ở tầng (2 mẫu “chỉ có một vị chúa tể muôn dân”, cộng 3 mẫu “chúa tể của dân chúng”). Tôi bỏ chữ “chỉ” ở bản đầu rồi thêm lại khi đối chiếu tiền lệ, vì `eko` nghĩa là “chỉ một”.

  `Ito cātuddase kappe` (5.1) không có tiền lệ nào trong tầng (`cātuddase` chỉ xuất hiện ở đúng khoá này). Tôi dịch “Vào mười bốn kiếp trước đây,” cho khớp `4.1` ngay trên (`Vào chín mươi tư kiếp trước đây,` — 41/95 toàn tầng và 4/4 phạm vi gần nhất) và cho đúng sắc thái “từ đây về trước” của `Ito`.

  BA CHỖ CỐ Ý KHÁC TIỀN LỆ, đã dò từng cặp: `tha-ap184:2.3` (tiền lệ `tha-ap153:3.1` viết `Những đóa hoa bandhujīvaka,` chữ thường — tôi viết hoa vì đây là danh xưng vị trưởng lão ở `:0.3` và lục kết, và vì tầng đã quyết `Phẩm Bandhujīvaka` cho `Bandhujīvakavagga`); `tha-ap184:3.1` (3 mẫu “Tôi nâng hoa bằng cả hai tay” — sai ngôi kể, xem trên); `tha-ap185:3.3` (tiền lệ đa số là “Tôi dâng lên Đức Phật,”/“Ta dâng lên Đức Phật,” — ngôi “tôi”; ở đây `upāgacchiṁ` ở 2.4 đã là ngôi “ông”, nên 3.3 phải giữ ngôi “ông” và tôi bỏ cả chủ từ để khỏi lặp). `tha-ap185:3.4` và `tha-ap185:2.2` khác tiền lệ ở chữ thường/hoa và ở việc giữ `yathā`, đã ghi ở trên.
