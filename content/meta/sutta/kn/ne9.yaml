notes: |-
  Đợt 19, lát 100. Dịch trọn 168/168 khoá từ Pāli root đã ghim; không có khoá nào ngoài tập khoá Pāli. Bài là phần *Nhóm 6* (`Catubyūhahāravibhaṅga`) của *Phần Giải Thích* trong Netti, và là nơi Netti giải thích nhóm "định nghĩa, mục đích, nguyên do, sự nối kết trước sau" bằng chuỗi kệ trích (Dhammapada, Udāna, Saṁyutta, Theragāthā, Suttanipāta) cùng phần bàn về bốn loại nối kết (nghĩa, câu chữ, lời giảng, sự chỉ rõ). Không có Sujato và không có lớp `english-project`, nên đối chiếu độc lập chỉ có Pāli root cộng tiền lệ trong chính tầng Việt của dự án (các bài `ne` đã dịch và các bài kệ song song `ud2.3`, `ud7.4`, `ud7.7`, `sn4.6`, `sn4.11`, `sn1.12`, `thag16.4`, `dhp21`, `dhp285`, `dhp346`). Không có bản Việt hiện hành theo khoá cho bài này; bản Việt nguyên bài ở mục Tra cứu toàn văn không cấp text theo khoá, không dùng làm nguồn đối chiếu theo khoá.

  **Coverage English (đo thật).** Mẫu số 62 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`); Sujato phủ 0/62; `english-project` 0; `vietnamese-current` vắng. Blocker `noEnglishEditionUpstream` là thật, không bù được bằng điểm; `triangulation` đặt 7,0 vì mọi khoá chỉ có Pāli tự đứng vững cộng đối chiếu tiền lệ Việt trong tầng.

  **Tiền lệ và Pāli trùng nguyên văn.** Đã dò 50 khoá có Pāli trùng nguyên văn với khoá đã dịch ở tầng ngoài bài (94 cặp); 33 cặp dùng bản Việt y nguyên (23 khoá), 61 cặp khác (đa phần chỉ khác dấu nháy mở/đóng vì khoá kệ ở đây nằm trong một trích dẫn, hoặc khác có chủ ý). Dùng lại y nguyên: `3.1`–`3.4` từ `ne4:15` (cùng bài kệ "Dhammo have rakkhati", cũng có ở `ja447`, `ja510`, `thag4.10`); `7.1`–`7.3` từ `ud2.3:3` / `dhp131`; `11.2`–`11.3` từ `dhp21`; `14.1`–`14.2` từ `sn1.12:2`; `18.1`–`18.3` từ `sn4.11:3`; `19.3`–`19.4` từ `sn4.6:6`; `21.1` từ `dhp345`; `23.2` từ `dhp346`; `27.2`–`27.3` từ `dhp285`; `30.1`–`30.2`, `30.5` từ `ud7.4:4`; `0.1`–`0.2` theo khuôn của bộ `ne`. Cố ý khác tiền lệ: `9.1`–`9.4` (kệ "Middhī yadā hoti") giữ `yadā` là "khi" và `nivāpapuṭṭho` là "vỗ béo bằng cám" thay vì "lợn rừng nhồi đầy cơm" (`thag1.17`) hay "nuôi bằng cám" (`dhp325`), vì cả hai bản đều bỏ một đơn vị nghĩa; `14.3`–`14.4`, `16.1`–`16.4` đổi `upadhi` thành "sanh y" (97/102 khoá toàn tầng có `upadhi` dùng "sanh y", chỉ `snp1.2` dùng "chấp thủ") và giữ `socati` là "sầu" (không phải "khổ" như `sn1.12`); `21.2` "dây cỏ" theo `sn3.10:4` (`dhp345` dịch "dây thừng"); `21.3` thêm "hoa tai" cho `kuṇḍala` (`dhp345`, `ja201`, `thag2.34` đều bỏ chữ này); `30.4` "miệng rọ" theo `thag4.8:3`; `30.6` thêm "đi theo" cho `anventi` (`ud7.4` bỏ); `34.1`–`34.3` tách `ṭhiti` ra khỏi `papañca` (`ud7.7:3.1` gộp thành "hý luận tồn tại"). Với câu hỏi `Idha bhagavato ko adhippāyo?` (`4.1`, `6.1`, `8.1`, `10.1`, `12.1`) Pāli trùng `ne25:2.3`; tôi bỏ chữ "chính" của `ne25` vì Pāli không có chữ đó, nên 1 cặp (5 khoá) khác. Trong chính bài có 5 nhóm Pāli trùng nguyên văn (`4.1`/`6.1`/`8.1`/`10.1`/`12.1`; `20.2`/`22.2`/`24.2`/`26.2`; `26.1`/`28.1`; `29.2`/`31.3`/`36.6`; `36.4`/`37.3`/`38.5`), bản Việt giống hệt nhau ở cả 5 nhóm; 0 cặp trùng nội bộ mà bản Việt khác (`20.2` "Yathā cāha" và `29.2` "Yathāha" khác Pāli nên khác nhau ở chữ "Và").

  **Thuật ngữ, kèm số đếm.** `nirutti` → "định nghĩa" (`ne3:7.1`, `ne3:24.2`, `ne4:36.2`, `ne25:2.2`: 4 khoá); riêng `janapadaniruttiyo` (`1.6`) tôi dịch "lối diễn đạt của các địa phương" vì "định nghĩa của địa phương" là vô nghĩa. `adhippāya` → "mục đích" (`ne3:7.1`; `ne25` dịch "mục đích chính"). `nidāna` → "nguyên do" (`ne3:7.2` "nguyên do của lời giảng"; `ne14` dịch "nguồn gốc" nhưng đó là `yatonidāna`, một cụm khác). `pubbāparasandhi` → "sự nối kết trước sau" (`ne3:7.3`). `byañjana` → "câu chữ", `akkhara` → "âm tiết", `pada` → "từ", `ākāra` → "phương diện", `niddesa` → "sự chỉ rõ", cùng sáu mục của nghĩa ("bày tỏ, phổ bày, mở ra, phân chia, làm cho sáng rõ, định danh") theo `ne4:32`–`ne4:36` (6/6 khớp). `desanā` → "lời giảng" (`ne3:7.2`), không dịch "đề ra" vì đó là tên của hướng dẫn thứ nhất. `catubyūha` → "bốn phần" (`ne25`, `ne3:7.4`); tên nhóm `Nhóm Bốn Phần Hướng Dẫn` theo khuôn `ne8`, `ne11`, `ne12`, `ne16` (hậu tố "Hướng Dẫn" cho `-hāravibhaṅga`) và khác `ne25` (`-hārasampāta` là "Nhóm Phương Thức Bốn Phần"). `hāra` → "hướng dẫn" (đúng theo quy ước đã chọn cho bộ `ne`). `papañca` → "hý luận" (59/136 khoá toàn tầng có chữ này; `ud7.7`). `anusaya` → "tùy miên" (37/86 khoá; `ne18` dịch "tiềm ẩn", 2 khoá). `upadhi` → "sanh y" (97/102). `pariyuṭṭhāna` → "sự hiển hiện" theo `ne18:3.5`, `ne18:5.1`, `ne19:6.13` (3 khoá, đối lập với `anusaya`); nghĩa gốc là sự bộc phát/ám ảnh. `taṇhā` → "tham ái" (cách của `ne17`, `ne18`, `ne19`, `ud7.4`); toàn tầng "khát ái" 305/955 khoá có `taṇhā`, "tham ái" 177/955, riêng bộ `ne` thì "tham ái" chiếm ưu thế nên tôi theo bộ gần nhất. `taṇhāvicarita` → "dòng chảy của tham ái" (khuôn `an4.199`, 10 khoá). `vipassanā` → "quán" (114/132). `saupādisesā`/`anupādisesā nibbānadhātu` → "Niết-bàn giới còn dư y"/"không còn dư y" (`dn16:3.20`, `an8.70:21`; 30 khoá có `anupādisesā`; `iti44` dịch "còn dư tàn", `ne35` dịch "Vô Dư Y"). `kilesakāma` → "dục phiền não" (0 tiền lệ). `ponobhavikā` → "đưa đến tái hữu" (`ne17:4.3`). `Mahākaccāyana` giữ không đuôi `-o` (13/15 khoá trong bộ `ne`; `ne7` và `ne18` giữ `-o`) và "Bởi vậy, Tôn giả … nói" (8 khoá, theo `ne8:10.2`). `vipassakā kusalesu dhammesu`, `jāgariyānuyoga`, `pubbarattāpararattaṁ`, `guttadvārā`, `bhojane mattaññuno` theo khuôn `an5.56`/`an6.17` ("quán sát các pháp thiện", "chuyên cần tỉnh thức", "đêm đầu và đêm sau", "hộ trì các căn", "biết chừng mực trong ăn uống"). `diṭṭhadhammavedanīya`/`upapajjavedanīya`/`aparāpariyāyavedanīya` → "chịu quả ngay trong đời này / ở đời kế tiếp / ở những đời sau nữa" (cách của `mn101`, `an3.100` cho `diṭṭhadhammavedanīya`; 23 khoá có một trong ba chữ này). `lobhapakataṁ kammaṁ` → "nghiệp được tạo bởi tham" (`an3.34:2.1`). `jhāyati` + `nissāya` → "thiền định dựa vào" (khuôn `an11.9:3.13`, giữ nguyên chuỗi đất–nước–lửa–gió–bốn xứ–đời này–đời sau). Công thức `sadevake loke samārake sabrahmake …` theo `dn14:1.17` (95 khoá có `sadevamanussāya`). Cặp `ahirikena anottappena` → "không biết hổ thẹn và không biết ghê sợ tội lỗi" (`an2.190-194` dịch "không biết sợ hối", tôi không theo vì sai nghĩa `ottappa`). `asaddhammassavana` → "việc nghe phi Chánh Pháp" (`an10.61`). `dovacassa` → "khó dạy" (`dn33:1.9.9` "khó khuyên dạy"). `sassatadiṭṭhi` → "thường kiến" (`sn22.81:10.8`). `aṭṭīyati` → "bất an" theo `mn61:17.6`, `mn145`, `sn35.88`, `sn54.9` (4 khoá).

  **Số Pāli (tự tính).** `catubyūho` = 4 phần (đúng bốn mục ở `1.3`: định nghĩa, mục đích, nguyên do, nối kết trước sau); `catubbidho` ở `39.1` = 4 loại (nghĩa, câu chữ, lời giảng, chỉ rõ); `chappadāni` ở `40.1` và `41.1` = 6 mục, đếm đủ 6 mục mỗi nơi; `chattiṁsa` = cha 6 + tiṁsa 30 = 36 (`35.3`, `37.4`); `tividhaṁ`/`tidhā` ở `36.1`, `36.5`, `37.4` = 3; `44.2`–`44.14` = 13 cặp đối nghịch (nissitacittā/anissitacittā). Không có số nào cần nhân hay cộng ngoài `chattiṁsa`.

  **Bất định (ghi lại, không thêm vào thân kinh).** (1) `1.4` `niruttipadasaṁhitā`: tôi hiểu là "sự kết hợp các từ định nghĩa"; không có tiền lệ trong tầng và có thể đọc là "sự gom các từ ngữ nguyên". (2) `1.6` `evaṁ sabbāni kātabbāni janapadaniruttāni`: dịch sát chữ "cần được thực hiện"; đối tượng của `kātabbāni` không rõ. (3) `10.2` `aṭṭiyitukāmā`: "muốn thấy bất an trước già và chết" bám sát chữ (`-tukāma` + `aṭṭīyati`) dù nghe nghịch; nghĩa gốc là ước muốn bị chấn động bởi già chết. (4) `25.2` `dehanissitaṁ`: 0 tiền lệ trong tầng, dịch "nương nơi thân". (5) `36.1` `pariyuṭṭhānasaṅkhārā`: đọc là hợp từ đẳng lập "các sự hiển hiện và các hành" (vì `37.4` tách `pariyuṭṭhānaṁ` và `saṅkhārā`); cách đọc khác là một danh từ ghép. (6) `37.1` `Yañce bālo …pe…`: đoạn lược; không đối chiếu được với bài kinh song song vì tầng Anh vắng, nên chỉ giữ một dấu `…` đúng như Pāli. (7) `42.3` `ubhayamantarena`: "giữa hai đời" theo `mn144:11.8`, `sn35.87:11.8`, `ud8.4:3.6` (3 khoá) nhưng khoá song song `an11.9:3.13` không có chữ này. (8) `34.1`/`35.2` `ṭhiti` → "sự trụ lại" và `44.8` `ayoniyā` → "điều không đúng căn nguyên": 0 tiền lệ. (9) `32.1`–`32.4`, `33.3`: `attha` ở bài kệ là "điều lợi ích" nhưng ở `1.5` là "nghĩa"; Pāli dùng cùng một chữ, tôi tách theo ngữ cảnh. (10) `44.2`–`44.14` `nissitacitta` → "tâm nương tựa": 0 tiền lệ, và `vodāna` → "sự trong sạch", `saṁsārappavatti`/`saṁsāranivatti` → "sự tiếp diễn"/"sự dừng lại của luân hồi" đều do tôi chọn. (11) Dấu nháy: `18.4` không đóng nháy vì bài kệ trích dẫn trải sang `19.4` ở Pāli; `32.1` mở nháy và `32.4` đóng nháy theo đúng từng khoá của Pāli.

  **Dấu lược.** Pāli có 7 dấu lược: `37.1` có 1 `…pe…`, `42.2` có 1 `…pe…` và 5 `…` trần; Việt giữ đúng 7, khoá nào Pāli không có thì Việt không có, và không có `(…)`.

  Kiểm kỹ thuật: tập khoá Việt = tập khoá Pāli = 168, đúng thứ tự Pāli; nháy kép khớp Pāli từng khoá (27 mở, 27 đóng; 0 nháy đơn); không khoá rỗng, đều NFC; chữ có dấu Pāli duy nhất còn lại là tên riêng (`Gijjhakūṭa`, `Rādha`, `Māra`, `Mahākaccāyana`). Cổng kỹ thuật CHƯA chạy — cần chạy đủ bốn lệnh trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
