    - Tiêu đề và phân loại:
      + `0.2` Cattālīsanipāta = "Bộ Bốn Mươi Bài Kinh" và `0.3` Tesakuṇavagga = "Phẩm Ba Loài Chim": dùng lại nguyên văn `ja521`, `ja522`, `ja523` (cùng Pāli; `0.2` còn trùng `thag18.1:0.2`).
      + `0.4` "4. Kinh Saṅkhapāla" và `53.1` "Kinh Saṅkhapāla, thứ tư.": theo khuôn "Kinh <Tên>" / "Kinh <Tên>, thứ n" của `ja521`–`ja523`; `catutthaṁ` = 4, khớp số "4." ở `0.4`. Tên giữ phiên âm; `cp20` (Hạnh của Saṅkhapāla) dùng cùng tên và gọi nhân vật là "Long vương Saṅkhapāla".
    - Người nói (Pāli không ghi tên; suy từ xưng hô và bối cảnh):
      + `1`: lời vua hỏi người xuất gia; `2`–`50`: lời người xuất gia tên Aḷāra kể cho vua (vua được gọi `naradeva`, `raṭṭhādhipa`, `janinda`, `rāja` ở `2.1`, `4.1`, `5.1`, `2.4`), trong đó có lời trích lồng của thợ săn (`6`–`7`, `9`), của Aḷāra nói với thợ săn (`5.3`–`5.4`, `8`), với Long vương (`12`, `27`–`28`, `30`, `35`–`36`, `40`, `42`–`43`, `45`, `47`) và lời của chính Long vương (`15`–`17`, `22`, `26`, `29`, `31`–`34`, `37`–`39`, `41`, `44`, `46`, `48`); `51`: lời vua; `52`: lời Aḷāra; `0.x` và `53.1` là phần biên soạn.
      + Việc gán các khổ kệ cho từng người suy từ nội dung hỏi–đáp (`27.3`: Aḷāra hỏi; `29.1`: Long vương đáp) và từ vocative `nāga`, `aḷāra`; Pāli không đánh dấu người nói. Dấu nháy của Pāli (nháy kép mở ở `4.1`, đóng ở `50.4`; nháy đơn cho từng lời trích lồng) được giữ đúng từng khoá.
      + Quy ước xưng hô do người dịch chọn (Pāli dùng `tvaṁ`/`bhavaṁ`): vua nói với người xuất gia "ngài", tự xưng "ta"; Aḷāra nói với vua "tâu đại vương", tự xưng "tôi"; Aḷāra và Long vương gọi nhau "ngài"/"tôi" (Long vương gọi Aḷāra bằng `bhavaṁ` ở `22.3`); thợ săn gọi Aḷāra "ông", Aḷāra gọi thợ săn "các anh".
    - Pāli trùng nguyên văn:
      Dò Pāli của 217 khoá với toàn bộ Pāli đã ghim (mọi bộ): 42 khoá có dạng trùng (từ 12 ký tự trở lên, bỏ dấu câu) ở bài khác đã có bản Việt, tổng 108 cặp khoá. Dùng lại nguyên văn (chỉ khác chữ hoa/dấu câu) ở 27/42 khoá: `0.2`, `0.3`, `11.4` (= `ja505:5.2`), `15.5`/`34.4` (= `ja466:4.1`, chỉ đổi chữ hoa đầu câu), `32.1`–`32.2` (= `vv61:5.3`–`5.4`, đại từ "tôi" theo `vv11:6.4`), `33.3` (= `vv52:19.4`), `41.3`–`41.4`, `42.2`–`42.3`, `43.2`, `43.4`, `44.2`–`44.4` (= `ja506:36.3`–`39.4`), `49.2` (= `an8.5:2.4`), `49.3` (= `ja488:17.3`), `50.1` (= `thag16.4:20.1`), `50.2` (= `ja510:10.2`), `50.4` (= `thag16.4:20.4`), `51.1`–`51.2`, `51.4`, `52.1`–`52.2` (= `ja506:40.1`–`40.4`). Khác ở 15/42 khoá:
      + chỉ đổi đại từ "ngươi" thành "ngài" so với `ja506` (5 khoá: `40.4`, `42.1`, `42.4`, `43.1`, `43.3`): ở `ja506` vua nói với Long vương, ở bài này Aḷāra (người xuất gia) nói với vị Long vương đã tiếp đãi mình như bậc cha mẹ nên dùng "ngài" cho nhất quán trong cả bài;
      + `3.3` (3 tiền lệ `ja438:4.4`, `ja456:6.3`, `ja505:7.3` cũng khác nhau về cách diễn đạt; chọn dạng sát Pāli); `6.3` (`ja389:5.3` dịch thành "thịt dê, thịt chim ưng", không khớp Pāli `sāduñca thūlañca muduñca maṁsaṁ`; không theo); `16.1` (`vv6:8.1`, `vv7:8.1`, `vv8:9.1` dịch "ở từng phần đất, đều mang một hình dạng", không rõ nghĩa; không theo); `24.2` (`ja442:2.2` là câu khác về cấu trúc); `28.3` (`ja506:38.3` "ta hỏi ngươi" → "tôi hỏi ngài" vì người nói là Aḷāra); `30.1`, `30.2` (`ja447:1.1`–`1.2`, `pv30:7.2` dịch `vataṁ` là "sống" và `vipāko` kèm "hạt giống", không theo; dùng "điều thực hành" theo `ja521`); `33.1` (`ja453:8.2` "cả tràng hoa" nằm giữa danh sách; ở đây đầu câu nên bỏ "cả"); `34.2` (`pv30:10.2` khác cấu trúc); `50.3` (`thag16.4:20.3` "thưa nhà vua" → "tâu đại vương": 28/80 khoá ja có `rāja` vocative dịch "tâu đại vương", "hỡi vua" 16, "tâu vua" 10).
      Trong chính bài: 8 nhóm Pāli trùng nguyên văn từ 12 ký tự (`2.4`/`49.4`, `6.2`/`8.2`, `15.5`/`34.4`, `27.4`/`28.4`, `28.3`/`43.3`, `35.3`/`36.3`, `51.1`/`52.1`, `51.2`/`52.2`); bản Việt cùng nghĩa cả 8 nhóm, chỉ khác chữ hoa và dấu câu theo vị trí khoá (0 cặp khác nội dung).
    - Số Pāli (tự tính):
      `cattālīsa` (`0.2`) = 40; `catutthaṁ` (`53.1`) = 4, khớp `0.4`; `cātuddasiṁ` (`38.1`) = 14 và `pañcadasiṁ` = 15 (hai ngày, "mười bốn và mười lăm"); `soḷasa` (`8.3`, bò đực) = 16 và `soḷasa` (`38.3`, người con của Bhoja) = 16 ("mười sáu"); `tisatā` (`26.1`) = ti 3 + sata 100 = 300; `sahassa` (`20.3`, `sahassathambhaṁ`) = 1.000 ("lầu ngàn cột"); `dasa` (`11.4`, `dasaṅguliṁ`) = 10; `saṁvaccharaṁ`/`saṁvaccharo` (`27.1`, `45.1`) = một năm; `catuddisaṁ` (`17.2`) = bốn phương; `ekā`/`aññā`/`aparā` (`21.1`, `23.1`, `24.1`) = một người nữ / một người nữ khác / một người nữ nữa. Không gặp `Tiṁsakappasahassa` hay cụm số nào chưa phân xử được.
    - Thuật ngữ (có đếm trên tầng):
      + `nāga` → "rồng" (kn/ja: 9/14 khoá chứa `nāga` được dịch có "rồng"; 1 khoá "rắn", 1 khoá "voi"), `nāgarāja` → "Long vương" (theo `cp20`, `ja506:38.3`), `uraga`/`mahoraga`/`pannaga` → "rắn"/"đại xà"/"loài rắn" (theo `snp1.1`, `thag10.5:10.2`); hai nhóm từ này chỉ cùng một sinh vật trong Pāli, bản Việt giữ hai chữ vì Pāli dùng hai từ.
      + `rāja` vocative → "tâu đại vương" (28/80 khoá ja, đa số; "hỡi vua" 16, "tâu vua" 10); `janinda` → "chúa tể loài người" (19/36 khoá ja có `janinda`; còn lại "chúa loài người" 4, "nhân chủ" 2); `naradeva` → "vị trời giữa loài người" (theo `bv24:5.1`, `pv17:20.3`); `raṭṭhādhipa` → "chủ quốc độ" (theo `ja510:3.2`); `bhārata` → "bậc dòng Bharata" (0 tiền lệ vocative).
      + `uposatha` → "ngày trai giới" (`cp10:4.1`, `ja489:14.5`; trong kn/ja `uposatha` còn dịch "Bố-tát" ở tên `ja441`, "Bát quan trai" 2 khoá `ja300:1.4`, `cp13:2.2`); `bhojaputta` → "người con của Bhoja" (0 tiền lệ, giữ phiên âm `Bhoja`; `luddā` ở `39.2` và `luddehi` ở `12.3` dịch "thợ săn", nên các người con của Bhoja đồng nhất với thợ săn qua mạch); `videhaputta` → "người con xứ Videha" (0 tiền lệ); `opānabhūta` → "như một giếng nước" (theo `ja444:6.3`); `vimānaseṭṭha` → "cung điện tuyệt hảo" (theo `ja506:44.2`); `mahānubhāva` → "đại oai lực" (theo `ja506:38.1`; 96 khoá trong kn); `vanibbaka` → "kẻ khốn khó" (`iti75:3.2`, `iti75:10.5` dịch "kẻ ăn xin"; ở đây Aḷāra dùng để gọi bọn thợ săn, nên chọn nghĩa "khốn khó"); `jambu` → "cây jambu" (theo `ja521`); `vetasa` giữ phiên âm "cây vetasa" (0 tiền lệ); `kāmaguṇa` → "ngũ dục" (`ja488:17.3`, `mn82:42.49`) so với "các dục lạc" (`snp1.3:16.3`, `thag16.4:19.3`): chọn theo `ja488`; `apaṇṇaka` → "chắc chắn" (theo `thag16.4:20.4`).
      + `Masakkasāra` và `Vāsava` giữ phiên âm (0 tiền lệ trong tầng); Pāli không giải thích, bản Việt không thêm.
    - Chỗ bất định (không thêm vào thân kinh):
      + `1.1` `Ariyāvakāso`: dịch "có dáng vẻ cao quý"; nghĩa chính xác của `avakāsa` ở đây (dáng vẻ, cơ hội) không xác lập được.
      + `4.1`–`4.2`, `5.4`: `bhojaputta` = "người con của Bhoja"; không rõ `Bhoja` là tên người hay tên dòng/tầng lớp.
      + `6.4`, `9.4`: `videhaputta` đọc là "người con xứ Videha"; không loại trừ cách đọc khác coi `Videha` là tên riêng của một người.
      + `7.2` `satthāni vikopayitvā`: dịch "cầm dao rạch xẻ"; nghĩa của `vikopayitvā` ở đây (làm hư, xáo trộn, rạch xẻ) không xác lập được từ Pāli một mình.
      + `10.2` `Yaṁ natthuto paṭimokkassa pāse`: dịch "khỏi dây xỏ mũi, khỏi thòng lọng đã buộc vào"; nối với `39.1` (thợ săn đâm thủng mũi, luồn dây thừng) nhưng `paṭimokkassa` (buộc vào, mang vào) và vai trò của `yaṁ` không xác lập chắc.
      + `11.2` `Puṇṇehi nettehi`: dịch "đôi mắt đầy ắp"; Pāli không nêu "đầy" cái gì (`ja516:31.3` có `assupuṇṇehi nettehi` "mắt đầy lệ"); không thêm "lệ".
      + `14.2` `Dibbena me pāturahuṁ`: `dibbena` không có danh từ đi kèm; dịch "với dáng vẻ cõi trời"; `pāturahuṁ` là dạng ngôi thứ ba số nhiều dù chủ ngữ `nāgo` số ít.
      + `16.1`–`16.4`: chủ từ của `taṁ ... upetarūpaṁ` được hiểu là khu nơi ở (`nivesanāni`, `15.4`); `pāsādikā yattha jahanti sokaṁ` không nêu chủ từ của `jahanti`, dịch "người ta".
      + `17.3` `pesī`: dịch "trái non"; nghĩa ("non", "mềm", "mọng") không xác lập được (0 tiền lệ cho nghĩa danh từ/tính từ trong tầng).
      + `19.1`–`19.4`: chủ từ của `maṇīmayā soṇṇamayā uḷārā anekacittā` không nêu (số nhiều, giống cái); dịch không gán danh từ.
      + `21.1`–`21.4`: `ādāya veḷuriyamayaṁ mahagghaṁ; subhaṁ maṇiṁ jātimantūpapannaṁ ... āsanamabbhihāsi` — cấu trúc không rõ ràng giữa "cầm lấy viên ngọc" và "dâng chiếc ghế bằng ngọc"; `22.1`–`22.2` xác nhận có một chiếc ghế được dâng. Bản Việt giữ chỗ để ngỏ.
      + `25.3` `Tatuttariṁ maṁ nipatī mahantaṁ`: dịch "chiêu đãi tôi thật hậu hĩnh"; nghĩa của `nipatī` ở đây (đổ xuống, chiêu đãi, cúi mình) không xác lập chắc; `bhattu` ở `25.2` hiểu là "chủ" (của các người nữ, tức vị Long vương).
      + `26.2` `Sabbattamajjhā padumuttarābhā`: `sabbattamajjhā` không tra được ở nơi khác trong tầng; dịch "tất cả đều thanh tú" (đoán từ mạch, giữ nghĩa rộng) và `padumuttarābhā` "rạng rỡ như sen tuyệt hảo". Đây là chỗ cần người biên tập xét.
      + `35.1`–`35.2` `taṁ ... hanti`: dịch "hại" thay vì "giết" vì trong bài vị Long vương không chết.
      + `35.4`, `36.4`: `vanibbakānaṁ` dịch "những kẻ khốn khó"; `kilesamāpajji` dịch "chịu khổ nhục" (không dịch `kilesa` là "phiền não" vì ở đây không mang nghĩa giáo lý).
      + `36.2` `Tejo nu te nānvagaṁ dantamūlaṁ`: dịch "uy lực của ngài đã không lên đến gốc răng nanh"; nghĩa "uy lực" (nọc độc, lửa) không nêu rõ.
      + `37.2` `Tejo na sakkā mama tehi hantuṁ`: đọc là "uy lực của tôi không thể bị bọn họ hủy diệt"; cách đọc ngược lại (uy lực của tôi không thể được dùng để giết họ) không loại trừ hoàn toàn; chọn cách đọc nối được với `37.3`–`37.4`.
      + `37.3`–`37.4` `Satañca dhammāni sukittitāni, Samuddavelāva duraccayāni`: `duraccaya` = khó vượt qua, khó vi phạm; "như bờ biển" giữ ngắn, không thêm giải thích "biển không vượt bờ".
      + `39.4` `Uposathaṁ appaṭikopayanto`: dịch "không làm tổn hại ngày trai giới"; cách đọc `paṭikopa` là "oán trả" (không đáp trả) không loại trừ.
      + `40.1`: `addasaṁsu` ngôi thứ ba số nhiều không nêu chủ từ; hiểu là các người con của Bhoja; `ekāyane ... pathe` dịch "con đường độc đạo".
      + `45.4` `janinda`: cùng chữ với `5.1`, `14.2`, `23.3` (gọi vua) nhưng ở đây nằm trong lời Aḷāra nói với vị Long vương (`45.3` `nāga`); giữ cách dịch "chúa tể loài người" cho nhất quán, dù người được gọi nhiều khả năng là Long vương.
      + `46.1`–`46.4`: đọc là lời của Long vương, nói với người nhà mình ("hãy hầu hạ vị này", `upatiṭṭhatha`) rồi hỏi Aḷāra có ai mắng nhiếc ngài không; cách đọc khác coi `puttā dārā anujīvino` là người nhà của Aḷāra không loại trừ hoàn toàn nhưng `upatiṭṭhatha` (số nhiều, mệnh lệnh) khớp hơn với người nhà của Long vương.
      + `48.1` `lohitaṅko`: dịch "viên ngọc đỏ" (`lohitaṅka` là tên một loại ngọc đỏ, không chắc là hồng ngọc); `48.4` `maṇimossajassu` dịch "hãy buông bỏ viên ngọc ấy" (có thể là "trả lại", "cho đi").
      + Quy ước tên: `Aḷāra` đọc là tên riêng của người xuất gia (được gọi ở `9.3`, `15.1`, `15.4`, `26.1`, `26.3`, `38.1`, `41.2`, `44.1`, `46.4`, `51.3`), giữ phiên âm.
