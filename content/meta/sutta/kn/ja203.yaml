notes: |-
  Lát c14. 25/31 khoá trùng nguyên văn — mức cao nhất của 4 bài Jātaka — vì 24
  vế kệ của bài này trùng Y HỆT với AN 4.67 (Mettā Sutta, “Kinh Từ Bi”). Đã dùng lại đúng
  nguyên văn đã có: `“Virūpakkhehi me mettaṁ` → ““Tôi có lòng từ với loài Virūpakkha,”
  … `Namo sattannaṁ sammāsambuddhānan”ti.` → “đảnh lễ bảy vị Chánh Đẳng Giác.”” (an4.67:5.1
  –10.6). Vì vậy khoá 1.1 mở nháy kép và khoá 6.4 đóng, đúng như an4.67; tôi KHÔNG dịch lại
  từ đầu, vì dịch lại sẽ khiến cùng một câu kệ có hai cách dịch trong tầng.

  Hai khoá không có bản trùng vì Pāli ở đây viết gộp chữ (`Ahivicchikasatapadī,` thay vì
  `Ahivicchikā satapadī,`) nên tôi ghép lại từ an4.67:10.1-10.2: “Rắn, bọ cạp, rít trăm
  chân,” / “nhện, thằn lằn, và chuột.”

  Tiền lệ tên phẩm theo BRIEF_VI3 §11 (tầng `name/` của chính SuttaCentral):
  `Dukanipāta` → “Bộ Hai Bài Kinh” (178 bản, đa số áp đảo); `Nataṁdaḷhavagga` → “Phẩm Bó
  Lúa” (9/9); `Jātaka` → “Jātaka” (358 so với “Chuyện Tiền Thân” 16).

  0 tiền lệ cho tên phẩm: `Khaṇḍajātaka` không có bản Việt nào trong tầng (grep = 0; chỉ
  có `Khaṇḍa` là tên riêng ở tha-ap77 và vua tử Khaṇḍa trong cp-không liên quan). Tôi giữ
  nguyên dạng Pāli “Kinh Khaṇḍajātaka” theo đúng tiền lệ `Kinh Paṇṇikajātaka`,
  `Kinh Verijātaka`, `Kinh Mittavindakajātaka` của các bài chưa có tên Việt — KHÔNG tự
  đặt tên dịch, vì đặt tên cho truyện mà mình chưa đọc cốt truyện là bịa.

  Tầng tham khảo: KHÔNG có Sujato tại commit đã ghim cho ja203 ⇒ `draft`.

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  Giải quyết draft 2026-10-12: đọc đối kháng 31 khoá từ Pāli. 3 khoá lỗi nghĩa thật đã sửa, đều là các khoá dùng lại nguyên văn từ an4.67 nhưng bản dùng lại có lỗi: (1) `ja203:4.1` — “tất cả chúng sanh, tất cả chúng sinh” dịch `sattā` và `pāṇā` thành cùng một từ viết hai kiểu chính tả; `pāṇā` đổi thành “loài có hơi thở” (cùng tiền lệ mn76:13.7), chính tả “sinh” theo toàn dự án; (2) `ja203:5.4` — `sarīsapāni` bị dịch “các loài rắn”, trùng với `ahi` ở `5.5` và mâu thuẫn tiền lệ của tầng (`sarīsapa` = “bò sát” ở dn29, mn2, mn13, mn14, mn125…); đổi thành “các loài bò sát”; (3) `ja203:6.3` — `namo` bị dịch “cúng dường đảnh lễ”, thêm “cúng dường” (Pāli không có `pūjā`/`pūjeti`; tiền lệ `namo bhagavato` ở pv38:57.3, pe8:53.4 là “kính lễ”); đổi thành “đảnh lễ”, khớp `6.4`.
  Bản dùng lại ở an4.67:8.1, 9.4 và 10.5 (Pāli y hệt) vẫn mang ba lỗi trên; ngoài phạm vi tệp này, báo để sửa đồng bộ.
  Blocker đã giữ nguyên: thiếu bản Anh Sujato upstream cho uid này (loại thiếu-upstream, đã kiểm lại: tệp ja203 không có trong edition đã ghim). Giới hạn đi kèm: `vietnamese-current` cũng không có bài này. Không blocker nào khác để gỡ; không có blocker độ phủ English (mẫu số 0 vì không bản Anh).
  Tham khảo gián tiếp: bản Anh Sujato của an4.67 (cùng Pāli kệ 5.1–10.6) khớp các sửa trên (“sentient beings, living things”; “reptiles”; “I revere”), nên `triangulation` nâng từ 7.5 lên 8.0 (trần cho bài không có bản Anh riêng); không cao hơn.
  Đã đọc và giữ: `4.3` “chỉ thấy những điều lành” (Pāli không có `eva`, nhưng Sujato cũng dịch “only” và câu kế `4.4` đối lập; giữ theo tiền lệ an4.67:8.3); `6.1` “phép hộ niệm … phép bảo hộ” (`rakkhā`, `parittā`, giữ theo an4.67:10.3); dấu “!” rồi chữ thường ở `3.1`–`3.4` (kiểu câu giữ theo an4.67:7.x, không đổi nghĩa). Số: `satapadī` = rít trăm chân; `sattannaṁ` = bảy.
  Bất định còn lại: `ja203:0.3` “Phẩm Bó Lúa” (9/9 khoá `:0.3` của ja201–ja210 trong tầng) không thấy căn cứ từ `Nataṁdaḷhavagga` — tên phẩm lấy từ lời đầu của kệ ja201 (“na taṁ daḷhaṁ …”); chưa sửa vì đổi một tệp sẽ làm lệch cả phẩm, nên báo để xử lý đồng bộ. Tiêu đề `0.4` giữ dạng Pāli “Khaṇḍajātaka”, như ja202, ja204.

  Giải quyết draft 2026-10-13 (vòng 2): thay thế mục "Giải quyết draft 2026-10-12" ở các điểm sau, phần còn lại của mục đó vẫn đúng. Đọc đối kháng lại 31 khoá từ Pāli; 4 khoá đổi, 3 là lỗi nghĩa/thuật ngữ thật, 1 là bỏ chữ thêm: (1) `ja203:4.2` — `bhūtā` bị dịch “các loài” (chỉ còn là “mọi loài” lặp `kevalā`); tiền lệ của tầng dịch `sabbe bhūtā` là “sinh vật” (mn60:21.7, mn60:22.8, mn60:23.6, mn60:26.6, mn76:13.7, mn76:14.5, ps2.4:3.4: 7 khoá; dn2:20.6 “sinh loại”, sn24.7:1.8 “loài vật” là lệch cách khác); đổi thành “tất cả sinh vật, không sót loài nào” (`kevalā` = trọn vẹn, không sót); (2) `ja203:6.2` — `bhūtāni` đổi “các loài” thành “các sinh vật” cho cùng một từ Pāli một cách dịch với `4.2`; (3) `ja203:6.1` — `rakkhā` bị dịch “phép hộ niệm”: “hộ niệm” trong tiếng Việt Phật học là việc trợ niệm cho người lâm chung, Pāli không có nghĩa đó; `parittā` mới là phép hộ trì (cách gọi quen của `paritta`); đổi thành “sự bảo hộ” / “phép hộ trì”, tách rõ hai từ (tầng có đúng 2 khoá `katā me rakkhā katā me parittā`: an4.67:10.3 và ja203:6.1, cả hai từng dùng cách dịch cũ); (4) `ja203:4.3` — bỏ “chỉ” trong “chỉ thấy những điều lành”: Pāli `sabbe bhadrāni passantu` không có `eva` hay `ca`, bản mới đọc “cầu mong họ thấy những điều lành”, phần đối lập đã nằm sẵn ở `4.4`. Mục 2026-10-12 nói giữ “chỉ” theo an4.67:8.3; nay đổi vì Pāli đứng trước tiền lệ, và việc đối lập đã có ở `4.4`.
  Blocker: loại thiếu bản Anh upstream, đã kiểm lại từ edition đã ghim: tệp ja203 không có trong `translation/en/sujato` (83 tệp trong ja, không có ja203), `vietnamese-current` cũng vắng. Chuỗi blocker cũ lẫn nhiều câu giải thích; đã viết lại thành một blocker ngắn đúng sự thật, bắt đầu bằng `noEnglishEditionUpstream:`. Không có bất định hay lỗi văn bản nào từng nằm trong chuỗi đó; không có blocker thứ hai. Mẫu số coverage = 0 (không bản Anh nên cổng độ phủ không đo được gì, không phải “đạt”).
  Điểm: `semantic_fidelity` 9.3 → 9.4 vì đã gỡ 3 điểm thuật ngữ/nghĩa; `triangulation` giữ 8.0 (không có bản Anh độc lập riêng, chỉ có bản Anh Sujato của an4.67 cho cùng kệ); các tiêu chí khác giữ nguyên; trung bình thô 9.29. Technical gate: `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa được chạy ở lượt này, nên `technical_integrity` giữ 9.6.
  Các khoá Pāli trùng nguyên văn với an4.67 (24 vế kệ) nay có 7 khoá lệch giữa hai bài: `4.1` (“sanh/sinh”), `4.2`, `4.3`, `5.4`, `6.1`, `6.2`, `6.3` (và an4.67:10.5 còn “cúng dường đảnh lễ”); báo để sửa an4.67:8.1, 8.2, 8.3, 9.4, 10.3, 10.4, 10.5 đồng bộ, ngoài phạm vi tệp này.
  Đã đọc và giữ: `3.1`–`3.4` (dấu “!” rồi chữ thường, kiểu câu giữ theo an4.67:7.x, không đổi nghĩa); `5.4` “nhưng” (Pāli không có từ đối lập, nhưng cấu trúc `appamāṇo … pamāṇavantāni` tự đối lập; Sujato cũng thêm “but”); `0.3` “Phẩm Bó Lúa” vẫn chưa có căn cứ từ `Nataṁdaḷhavagga` (xem mục trước, báo để xử lý đồng bộ cả phẩm). Bất định thật còn lại: `parittā` trong `6.1` không có tiền lệ thứ hai trong tầng; chọn “phép hộ trì” theo cách gọi quen của paritta, không đoán thêm.
