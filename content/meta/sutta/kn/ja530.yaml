    - Chỗ bất định (không thêm vào thân kinh):
      + `1.4`–`2.1` `yassāsi anukampako`: đọc là mệnh đề quan hệ ("vị mà ngài thương xót") đứng trước `Saṅkiccāyaṁ anuppatto`; bản Pāli ngắt bằng dấu chấm sau `1.4`, nên một cách đọc khác là câu độc lập; nghĩa không đổi nhiều. Chủ ngữ của `paṭivedesi` không nêu tên.
      + `4.1` `kakudhāni` → "biểu hiệu vương quyền" (năm vật ở `4.3`–`4.4`); `5.2` `paṭicchada` → "phục sức" (`ja509:2.4` dùng cho áo vỏ cây; có thể là đồ trang bị hay tùy tùng); `5.3` chỉ Saṅkicca (xem trên); `8.1` `pucchāma` số nhiều dịch "tôi" vì `9.3` có `mayā`; `8.4` `purakkhataṁ` → "tôn vinh" (có thể là "vây quanh"); `9.3` `aticiṇṇo` → "vi phạm".
      + `11.4` `maggeyya` → "tìm đến" theo `ja520:13.4`; `11.1`–`12.4`: chủ ngữ của `kayirā` là người đi lạc/người đi vào phi pháp (đối cách theo `tassa`).
      + `14.3`–`14.4` `yaṁ gatiṁ` … `niraye te`: đọc là "cảnh giới" (nẻo) mà họ đi đến chính là các địa ngục ấy. `16.3` `luddakammehi` → "những kẻ làm điều tàn bạo" (cách đọc khác: "bởi nghiệp tàn bạo"). `16.4` `ussada`: tầng không có tiền lệ; không giải thích trong thân kinh (có thể là các địa ngục phụ hoặc phần nhô lên).
      + `17.1` `kadariyatāpanā` → "thiêu đốt kẻ keo kiệt" (có thể hiểu là nơi hành hạ kẻ keo kiệt); `19.4` `phuṭā` → "bị lan phủ" (chủ ngữ là các địa ngục; `pv10:14.4` dùng `pharitvā tiṭṭhati`).
