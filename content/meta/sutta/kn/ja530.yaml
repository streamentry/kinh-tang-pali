notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Tra tiền lệ (đếm được):** `nānutappeyya` → *không hối hận* (68 chỗ "hối hận" trong
  tầng Việt; `dhp67:2` "khi làm xong thì hối hận" và `dhp68:2` "khi làm xong không hối
  hận" — khớp đúng cặp nghĩa của `vippaṭisārā`/`avippaṭisārā` trong Pháp Cú, nên đây là
  tiền lệ mạnh chứ không phải dịch đoán); `suciṇṇa` → *chu đáo* (23 chỗ,
  `an5.33:11.2` "sắp đặt người hầu hạ chu đáo", `an4.180:1.7` "lắng nghe và suy nghĩ
  chu đáo" — nghĩa là làm cẩn thận, đúng nghĩa của `suciṇṇa` ở `65.2` *suciṇṇenidha
  kammunā*); `pacchā` → *sau này*; `rāja` (ngữ vực) → *ngài*.
  **Sở hữu ngữ kiểm tra lại:** `66.3` là `Tathā rāja carāhi dhammaṁ` — nói **với** vua
  bằng ngôi thứ hai — nên ở `66.4` phải là *ngài* (kính ngữ), không phải *ông*.
  **`”ti.` giữ nguyên theo đúng quy ước kho**: 961 chỗ trong tầng Việt kết bằng `”ti.`
  (ví dụ `ja159:4.6` "con côc an trú tại đó”ti."). Pāli khoá này chỉ có **nửa** cặp
  (`”` đóng, không có `“` mở vì `66.1` không đủ 40 ký tự), nên tôi dùng `’` cho dấu
  đóng: `chu đáo’ti.` Hình thức `’ti.` cũng đã có sẵn trong tầng Việt (10 chỗ). Đây là
  cùng một quyết định như ở `ja353` và `ja539` — xem ghi chú ở `ja353`.
