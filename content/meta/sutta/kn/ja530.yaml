  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja530_root-pli-ms.json` (281/281 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ (66 bài kệ cùng bốn dòng tiêu đề, dòng kết bài, dòng kết bộ và năm dòng kệ tóm lược); phần văn xuôi của Jātaka không nằm trong tầng Pāli đã ghim, nên người nói ở từng bài kệ chỉ được suy từ lời xưng hô, nháy kép và mạch của chính các bài kệ. Nội dung chính: Saṅkicca trả lời vua Brahmadatta về nẻo đi của người sống phi pháp, kể tám địa ngục và nghiệp đưa đến từng nơi, rồi khuyên vua thực hành Pháp. Bài có nhiều từ hiếm hoặc chỉ gặp một lần (xem mục bất định), dịch sát chữ, không thêm giải thích vào thân kinh.

