  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 90 khoá chênh lệch lớn nhất (khoảng một phần ba chênh chỉ vì bản mù ngắt dòng kệ khác nên chữ trượt sang khoá bên cạnh, không phải khác nghĩa) → khác nghĩa 9: sửa 0, giữ 5, bất định 4. Giữ: `50.2` `cakkhumāpi hi cakkhūhi … jīyati`, bản dự án *cũng mất đôi mắt vì mùi hôi ấy*, bản mù *cũng bị mùi ấy làm hại* (`jīyati` với `cakkhūhi` là mất mắt); `11.4` `nāssa maggeyya kaṇṭako`, *gai không tìm đến người ấy* so với *gai sẽ không cản bước* (`maggeyya` gốc *tìm*; bản mù thêm nghĩa); `27.1`–`27.4` `Kisaṁ … vacchaṁ`, bản dự án đọc tên Kisavaccha theo `ja522`, bản mù tách thành *vị gầy ốm Kisa* và *Vaccha*; `26.1` `atikāyo`, bản dự án là tính từ (*thân hình khổng lồ*), bản mù đọc tên riêng Atikāya; `48.2` `atikāyā ayomukhā` dùng cùng chữ làm tính từ; `21.1` `bhūnahuno`, *kẻ phá hoại sự tăng trưởng* theo tiền lệ `mn75`, `ja543:142.2`, so với *kẻ sát hại*. Bất định: `30.4` `hīnatto pattapariyāyaṁ` (bản mù cũng ghi không chắc), `42.4` `jivhaṁ vibhajja vighāsaṁ salohitaṁ` (bản mù cũng không chắc), `43.3` `ratī hi nesaṁ dukhino panītare` (hai bản đọc cú pháp khác hẳn: *niềm vui của chúng là những kẻ khổ đau bị dẫn đến* so với *niềm vui của chúng, còn những kẻ kia thì đau khổ*), `59.2` `nibbahanti sabandhanaṁ` (*cùng chỗ gắn liền* so với *cùng dây trói*). Đọc đối kháng lại toàn bài 281 khoá: số (tám địa ngục, mười sáu `ussada`, một trăm do-tuần, mười sáu ngón tay, một trăm tầm người, sáu mươi ngàn là một trăm ngàn năm cõi trời), nháy, 9 nhóm Pāli trùng trong bài (chỉ `5.3`/`8.3`/`10.3` khác nhau theo ngữ cảnh), không thêm lỗi nào. Không có bản Anh hay bản Việt độc lập khác. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bài 281 khoá; không có bản Việt nguyên bài, không có đoạn song song đã published nào ngoài các tiền lệ đã ghi): sửa 5 khoá, không khoá nào sai nghĩa — `22.3`–`22.4` (`Nirayā nādhigacchanti, dvāraṁ nikkhamanesino`) viết lại cho khỏi calque "họ không tìm thấy, từ địa ngục, cánh cửa" → "từ địa ngục, họ không tìm ra / một cánh cửa, dù đang tìm lối thoát."; `55.4` `dīghaṁ jagganti sabbadā` → "luôn luôn thức suốt thời gian dài" (bỏ "trong", gọn hơn). Giữ: `9.4` "tôi hỏi" cho `pucchito` (khuôn phổ biến của tầng: `ja401`, `ja435`, `ja439`, `ja440`, `ja543`, `ja547`, `thag17.1`; `vv78`, `vv81` dùng "khi được hỏi"); `6.3` theo `tha-ap394:69.3`; `33.2` theo `thag2.12:1.4`; `36.1`–`36.2` giữ "một trăm ngàn năm cõi trời" trọn ở `36.2` vì `sataṁ` nằm ở dòng ấy. Tra PED (Rhys Davids–Stede, bản DSAL): `16.4`/`64.4` `ussada` dịch thành "địa ngục phụ" thay cho phiên âm (PED nghĩa 1 dùng cho địa ngục, *ussadanirayā*, dẫn J v.266, chính bài Saṅkicca; nghĩa đen "chỗ nhô ra"; đây là cách hiểu theo chú giải, ghi bất định); PED cũng xác nhận `4.1` `kakudha` = biểu hiệu vương quyền (năm món, J v.264), `5.2` `paṭicchada` = y phục che thân, `42.4` `vighāsa` = thức ăn thừa. Bất định còn mở (`30.4`, `42.4` cú pháp, `43.3`, `59.2`), không có bằng chứng mới.

  Quyết định hội đồng biên tập 2026-10-16: B21 — `4.2`, `10.2` (`raṭṭhavaḍḍhana` = bậc làm hưng thịnh xứ sở (DPD)); C3 — `0.2`, `68.1`, `70.1` (tên nipāta "Nhóm N Kệ").

