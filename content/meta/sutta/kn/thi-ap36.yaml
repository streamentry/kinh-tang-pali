  - english-project không có entry cho uid này; vietnamese-current không có tệp
    nào cho thi-ap (tầng ấy chỉ có 26 tệp Pháp Cú). Cả ba tầng tham khảo đều vắng.
  - Có hai chỗ song song bằng chữ Pāli giống nhau với bản Sujato đã ghim: thig5.4
    (khổ kệ 15–19 gần như giống từng chữ) và thag6.4 (15.1–15.4); đã đọc để hiểu
    cú pháp. Chỉ khoảng 20/102 khoá có đối chiếu English độc lập kiểu đó, nên bài
    không được tuyên bố đã đối chiếu English cho toàn bài; triangulation đặt 7.8 chứ
    không đạt trên 8.0.
  - Có bản tra cứu toàn văn nguyên bài của Bhikkhu Indacanda trên SuttaCentral
    (giấy phép NOASSERTION; không phải tầng store, không căn lề theo khoá). Bản đó
    dịch theo kệ của một bản truyền thống khác nên có khổ kệ không khớp Pāli ghim
    (thêm các câu về tám giải thoát và sáu thắng trí ở khổ kệ cuối). Đã đọc để hiểu
    mạch kể và đối chiếu nghĩa chỗ khó; không chép vào bản dịch, và nó không được
    tính vào coverage hay triangulation.

  Bốn lệnh cổng kỹ thuật của kho là npm run validate, npm test, npm run check và
  npm run build; lát này không tự chạy vì brief cấm, nên technical_integrity đặt 9.6
  chứ không phải 10 và không tuyên bố technical gate pass. Các phép kiểm tự viết đã
  chạy trên 102/102 khoá: đủ khoá và đúng thứ tự Pāli (102 so với 102); dấu nháy
  đơn và ngoặc kép khớp Pāli từng khoá (5 khoá Pāli có dấu: 1.1, 10.4, 15.1, 17.4,
  25.3; 0 lệch); 1 nhóm Pāli trùng nguyên văn trong chính bài, 0 cặp lệch;
  …pe… → đúng một … ở 3/3 khoá, và Pāli không có … thì Việt không có; NFC, khoá
  rỗng, khoảng trắng thừa, chữ số lọt vào nội dung và Pāli lọt sang tiếng Việt
  (ngoài tên riêng) đều 0 lỗi. final_score là trung bình số học thô của đúng 10
  tiêu chí.
