  - Công thức 20.x–22.x, 23.1–25.3: dùng đúng bản dịch dùng chung của tầng (kệ
    thần thông và lời kết), cùng dạng với thi-ap37:11–16.
  - Trong chính bài này có 1 nhóm Pāli trùng nguyên văn: ba khoá …pe… (23.2, 24.2,
