  THUẬT NGỮ — kèm số đếm:
  - nāyaka/lokanāyaka → bậc Dẫn Đạo / Dẫn Đạo Thế Gian: 62 khoá Dẫn Đạo, 8 Dẫn Dắt,
    7 Dẫn Lộ trên các khoá lokanāyaka.
  - mahāvīra → Đại Anh Hùng (15 khoá Đại Anh Hùng, 9 khoá Đại Hùng trong toàn tầng);
    mahāmune → Đại Mâu-ni (theo thi-ap37 và các khoá trùng).
  - naruttama → bậc tối thượng giữa loài người (đa số trong 23 khoá naruttama);
    nibbute → đã nhập Niết-bàn.
  - sīlesu saṁvutā → thu thúc trong các giới (vv15:7.2 luôn thu thúc trong các giới).
  - yāvajīvaṁ → suốt đời: 8 khoá suốt đời, 1 khoá cả đời, 1 khoá trọn đời.
  - cutā → mệnh chung: 10 khoá mệnh chung, 1 khoá qua đời.
  - accharā → tiên nữ: 21 khoá tiên nữ, 13 khoá thiên nữ trên các khoá có accharā;
    chọn tiên nữ theo thi-ap10, thi-ap37.
  - rūpa, sadda → sắc, thanh (snp2.14:13.1 Sắc, thanh, vị, hương); vaṇṇa → dung sắc
    (ud5.3, vv21 dịch dung sắc); yasa → danh tiếng; sukha → an lạc.
  - ādhipateyya → quyền uy: không có tiền lệ trực tiếp trong tầng (3 khoá ādhipateyya
    đều là hợp từ khác nghĩa), dịch theo nghĩa Pāli là quyền chủ tể; chọn quyền uy
    cho gọn, ghi lại như bất định ở dưới.
  - dasahi ṭhānehi → mười phương diện (thi-ap10:4.3 dịch Dasaṭṭhānehi là về mười
    phương diện).
  - yobbanappattā → khi đã đến tuổi thanh xuân (thi-ap26:10.1, 1 tiền lệ).
  - ovāda → lời giáo giới: phạm vi gần nhất (thi-ap26:15.3) dịch lời giáo giới;
    toàn tầng 7 khoá khuyên dạy, 1 khoá giáo giới. Hai phạm vi cho đa số khác nhau;
    chọn giáo giới vì cùng ngữ cảnh tỳ-kheo-ni đến nhận lời dạy.
  - Kapilavhaye → ở nơi có tên Kapila (bv29:13.4 nơi có tên Kapila).
  - Không có tiền lệ, dịch theo nghĩa Pāli: Muttacāgā → hào phóng trong bố thí;
    kantisūcaka → dấu hiệu của vẻ yêu kiều; lāvaṇṇa → vẻ duyên dáng;
    gabbitā → kiêu hãnh; bhīrutā → sợ; maggakovida → tinh thông đạo lộ;
    susaṁvigga → vô cùng xúc động; bhavanibbindā → nhàm chán sự hiện hữu.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - 1.3 cārudassano: có thể là diện mạo dễ nhìn hoặc cái nhìn thu hút; dịch có diện
    mạo đáng mến, không chọn thêm.
  - 6.2 sesake: Pāli không nói rõ những ai còn lại (những vị chư thiên khác); bản
    Việt giữ những vị còn lại, không thêm chư thiên hay các cô khác.
  - 6.2 và 7.4 adhibhotvāna / adhigayha: hai gerund gần nghĩa (lấn át, vượt trội);
    dịch lấn át ở 6.2 và vượt trội ở 7.4, không gộp.
  - 7.3 ādhipateyya: có thể là quyền thống trị hay quyền uy; chọn quyền uy.
  - 9.1–9.2 abhirūpasampadampi … kantisūcakaṁ: có thể hiểu là chính danh xưng
    Abhirūpa (nghĩa tuyệt sắc) là dấu hiệu của vẻ yêu kiều, hoặc sự đầy đủ sắc đẹp
    là dấu hiệu. Bản Việt giữ Cả sự đầy đủ sắc đẹp tuyệt trần, đối với ta, đã là dấu
    hiệu của vẻ yêu kiều, không quyết giữa hai cách hiểu.
  - 10.3–10.4: tāto là cha (tāta còn là lời gọi thân mật); dịch cha. ti ở ’ti chỉ
    đóng lời trích, không dịch thành chữ; dấu nháy đơn giữ đúng như Pāli (mở khoá
    15.1, đóng khoá 17.4; 10.4 trọn vẹn trong một khoá; dấu mở ngoặc kép ở 1.1
    đóng ở 25.3).
  - 11.1–11.3 tathāgataṁ rūpadessiṁ naruttamaṁ … sutvāna nopagacchāmi: tathāgata
    có thể là tân ngữ của sutvāna (nghe về Như Lai) hoặc của nopagacchāmi (không
    đến gần Như Lai). Bản Việt để Như Lai đứng riêng không có giới từ, sau khi
    nghe, ta không đến gần, giữ được cả hai cách hiểu.
  - 11.2 rūpadessiṁ: dessī nghĩa ghét hoặc không ưa; dịch vị không ưa sắc đẹp, không
    thêm chỉ trích hay chê trách mà Pāli không nói.
  - 12.3 upāyena: phương tiện, không thêm thiện xảo hay khéo léo.
  - 13.1–13.4 Tissitthiyo … accharārūpasadisaṁ taruṇiṁ jaritaṁ mataṁ: các tính
    từ đều số ít còn tissitthiyo số nhiều; có thể hiểu ba người, hoặc một người
    giống tiên nữ trẻ cùng người già và người chết. Bản Việt giữ giống hình dạng tiên
    nữ ở khoá riêng và người trẻ, người già, người đã chết ở khoá sau, không phân
    phối rõ.
  - 14.2 virattāse: có thể tách virattā + āse hoặc virattā + se; dịch ta đã ly tham
    đối với thân xác. 14.3 Aṭṭhāsiṁ: đã đứng hay đã đứng vững, an trú; dịch đã đứng
    yên.
  - 17.4 abhinibbijjha vacchasi: vacchasi là vị lai ngôi hai của vasati (an trú),
    nên dịch ngươi sẽ an trú; còn khả năng đây là biến thể của dakkhasi (sẽ thấy)
    vì thig5.4:3.4 có abhinibbijjha dakkhisaṁ ở cùng khổ kệ. Pāli của bài này đọc
    vacchasi nên giữ an trú, không đổi theo thig5.4.
  - 18.1–18.2 appamattāya vicarantiyā yoniso: yoniso dịch như lý; vicarantiyā dịch
    đang sống, không lấy thig5.4:4.2 (vicinantiyā) làm căn cứ vì chữ khác.
  - Công thức lời kết 26.1 Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti: imā gāthāyo
    là số nhiều nên dịch những bài kệ này, theo nhóm đa số (407 khoá những bài kệ
    này so với 21 khoá bài kệ này, theo đo của phẩm).
  - Đại từ ngôi thứ nhất: dùng ta cho người kể xuyên suốt, khớp thi-ap37, 38, 39,
    và công thức chung của tầng ở các khoá 21–25; 26.1 Tôi nghe như vầy là lời người
    kể kết bài, không phải ngôi của vị ni. Khi lời Đức Phật xưng với Nandā (15–17)
    dùng ngươi ở khoá cuối cùng và không dùng đại từ ở các khoá còn lại, theo Pāli.
  - 21.4 tái sanh: theo dạng đa số của khoá trùng (11 khoá tái sanh so với 9 khoá tái
    sinh); các chỗ sinh khác trong bài giữ dạng sinh. Người biên tập có thể chuẩn
    hoá một lượt toàn tầng.

  LỖI NGOÀI LÁT — BÁO, KHÔNG SỬA:
  - thig5.4:1.1–1.2, thig2.1:1.1–1.2 và thag6.4:2.1–2.2: Pāli khoá thứ nhất là
    āturaṁ asuciṁ pūtiṁ (tính từ) và khoá thứ hai là passa … samussayaṁ (hãy nhìn
