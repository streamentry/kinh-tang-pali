notes: |-
  Bài kinh thi-ap36 — Abhirūpanandātherīapadāna, bài thứ sáu của Phẩm Khattiya trong
  Therīapadāna. 102/102 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào
  ngoài tập khoá Pāli. Bài kể về Nandā, con gái Khemaka dòng Sakya, từng cúng dường
  lọng vàng lên bảo tháp xá-lợi của Đức Vipassī, sinh lên cõi trời Ba mươi ba, đến
  đời cuối được cha cho xuất gia vì cuộc tranh chấp giữa những người Sakya về nàng;
  vì kiêu hãnh về sắc đẹp nên tránh gặp Đức Phật, được Ngài dùng phương tiện đưa
  đến và cho thấy ba người nữ trẻ, già, chết; nàng nhàm chán thân xác, nghe lời dạy
  quán bất tịnh rồi chứng quả.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt:
  - :0.1 Therīapadāna giữ nguyên Pāli, đúng dạng thi-ap37, thi-ap38, thi-ap39.
  - :0.2 Khattiyāvagga → Phẩm Khattiya, đúng dạng của thi-ap31, thi-ap37 và các
    bài kề cận cùng phẩm.
  - translationTitle bằng đúng giá trị :0.3 từng ký tự, kể cả số thứ tự và dấu chấm.
  - Số thứ tự ở :0.3: Pāli :0.3 là 6 Abhirūpanandātherīapadāna, bắt đầu bằng số, nên
    giữ số theo hình thức N. (quy tắc chung của phẩm: giữ số khi và chỉ khi Pāli có
    số). Đo ở phạm vi gần nhất: trong 12 tệp thi-ap đã có mà Pāli :0.3 có số, 6 tệp
    giữ số và 6 tệp bỏ số; các bài liền kề cùng phẩm (thi-ap37, 38, 39, 40) đều giữ
    số. Phạm vi tha-ap: 128 giữ số, 18 bỏ số. Bài này giữ số theo quy tắc chung và
    theo các bài kề cận; nếu người biên tập muốn thi-ap thống nhất theo một lối thì
    cần sửa một lượt cho cả nhóm.
  - Công thức tiêu đề: đo ở phạm vi gần nhất, 19/21 tệp thi-ap đã dịch :0.3 dùng
    Tuyên Ngợ, 1 tệp Tuyên Ngôn, 1 tệp lối khác. Toàn tầng tha-ap và thi-ap trong
    cây hiện tại: Tuyên Ngợ 270 tệp, Tuyên Ngôn 132 tệp, Ký Sự 110 tệp. Hai phạm vi
