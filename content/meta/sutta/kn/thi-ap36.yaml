  SỐ PĀLI — tự tính:
  - Ekanavutito = eka 1 + navuti 90 = 91 → chín mươi mốt kiếp. Dạng Ekanavutito kappe
    đã có 96 khoá trong tầng ở ba dạng chính: Vào chín mươi mốt kiếp trước 41,
    Từ chín mươi mốt kiếp trước 38, Vào chín mươi mốt kiếp trước đây 17; chọn dạng
    đa số Vào chín mươi mốt kiếp trước.
  - dasahi ṭhānehi → mười phương diện; đếm đủ mười mục trong 6.3–7.3: rūpa, sadda,
    gandha, rasa, phusana (5 giác quan) cộng āyu, vaṇṇa, sukha, yasa, ādhipateyya
    (5) = 10.
  - Tissitthiyo = tisso itthiyo → ba người nữ (13.1); tāvatiṁsa → Ba mươi ba (cõi
    trời Ba mươi ba, 5.4); catasso → bốn (25.1); chaṭṭha → thứ sáu (27.1) và 6 ở
    :0.3. Bài không có phép nhân lớn nào, không có cụm Tiṁsakappasahassa hay cụm số
    chưa phân xử được. Máy kiểm số Pāli của kho vì vậy gần như không có gì để đo ở
    bài này — chỉ phép tự tính ở trên, không phải một phép kiểm tự động đã pass.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò toàn tầng, dùng lại nguyên văn bản dịch:
  - Trong 102 khoá, 42 khoá có Pāli trùng byte với tầng đã dịch (không tính chính
    bài này; riêng ba khoá …pe… đã chiếm phần lớn số cặp); 36/42 khoá dùng đúng một
    dạng đã có, 6/42 khoá khác dạng có chủ ý.
  - 6 khoá khác dạng có chủ ý:
    * 1.2 vipassī nāma nāyako: tiền lệ duy nhất bv28:16.2 dịch có động từ đã có
      bậc Dẫn Đạo tên là Vipassī; ở bài này động từ Uppajji nằm ở khoá 1.3 nên 1.2
      chỉ giữ cụm danh xưng, 1.3 mang động từ.
    * 5.4 tāvatiṁsūpagā ahaṁ: tiền lệ duy nhất ở tha-ap dùng ngôi tôi; bài này dùng
      ta cho người kể, như phần còn lại của bài và thi-ap37, 38.
    * 15.2 passa nande samussayaṁ: hai tiền lệ (thig2.1:1.2 và thig5.4:1.2) mang nội
      dung của khoá 15.1 (tính từ bệnh, bất tịnh, thối rữa) chứ không phải của khoá
      này, vì các tệp đó đảo nội dung hai khoá đầu; xem mục lỗi ngoài lát. Bài này
      giữ nội dung đúng khoá: 15.1 là tính từ, 15.2 là này Nandā, hãy nhìn thân xác
      này.
    * 17.1 Evametaṁ avekkhantī: tiền lệ thig5.4:3.1 có dấu mở “ vì là lời nói mới;
      ở bài này Pāli không có dấu đó nên bỏ dấu, giữ nguyên chữ.
    * 19.2 ajjhattañca virajjahaṁ: tiền lệ thig5.4:5.2 dịch bên trong tâm hoàn toàn
      ly tham, thêm tâm và hoàn toàn không có trong Pāli; bài này dịch và ta ly tham
      ở bên trong.
    * 19.3 Appamattā visaṁyuttā: tiền lệ thig5.4:5.3 dịch dứt mọi hệ lụy, thêm mọi
      mà Pāli không có; bài này dịch thoát khỏi trói buộc, theo dạng visaṁyutta đã
      có ở snp3.9:33.3.
  - 3.2 vipassiṁ lokanāyakaṁ dùng nguyên văn tiền lệ tha-ap298:2.2 (Đức Phật Vipassī,
    bậc Dẫn Đạo Thế Gian); tiền lệ kia (tha-ap98:3.2) khác dạng nên không theo.
  - 15.3 Uggharantaṁ paggharantaṁ và 15.4 bālānaṁ abhinanditaṁ dùng lại nguyên
    thag6.4:2.3 và 2.4 (rỉ chảy, ứa chảy ra / là niềm vui của kẻ ngu); 16.1, 16.3,
    16.4, 17.3, 17.2, 18.3, 18.4, 19.1 theo thig5.4 (cùng khổ kệ, Pāli giống nhau
