notes: |-
  Dịch trực tiếp từ Pāli root, vì tầng tham khảo tiếng Anh (Sujato) không có tệp cho tha-ap398 tại commit đã ghim và không có bản Việt hiện hành cho uid này. Chỉ Pāli làm chứng cứ, đối chiếu với tiền lệ tầng tha-ap; các điểm dưới đây là chỗ Pāli cho phép hơn một cách hiểu hoặc tầng chưa có tiền lệ. Chưa có entry cho tha-ap398 trong content/meta/reference-gaps.yaml (đã tra, 0 dòng); mẫu số coverage chỉ là 1 khoá nên cổng không đo được gì, và entry cũng không cứu được published khi tầng Anh vắng.
  Tên bài `:0.3`: Pāli `6 Bākulattheraapadāna` bắt đầu bằng số nên giữ số theo hình thức `N. ` (toàn tầng tha-ap: Pāli bắt đầu bằng số thì Việt viết `N. ` 137 khoá, `N ` 18 khoá); `translationTitle` bằng đúng giá trị `:0.3`. Mở đầu tên: ở phạm vi gần (tha-ap380–419, không tính bài này) Ký Sự 20, Bài Kệ Tuyên Ngợ 6, Bài Kệ Tuyên Ngợi 1; toàn tầng tha-ap Bài Kệ Tuyên Ngợ 244, Bài Kệ Tuyên Ngôn 136, Ký Sự 129, Bài Kệ Tuyên Ngợi 10, Kinh Kệ Của 5. Hai phạm vi cho đa số khác nhau; chọn Ký Sự theo phạm vi gần và theo các bài cùng phẩm (tha-ap395, 396, 399, 400) vì Tuyên Ngợ/Tuyên Ngợi là lỗi chính tả. Cần biên tập phán một lượt cho cả cuốn. Tên phẩm `Phẩm Pilindavaccha` theo 5 tiền lệ cùng Pāli. Câu kết `:35.1` viết thường `Ký sự về Trưởng lão ..., thứ sáu` theo đa số toàn tầng (81 khoá `Ký sự`, 55 khoá `Ký Sự`) và các bài cùng phẩm tha-ap396, tha-ap400; ở phạm vi gần tha-ap380–419 là 11 khoá `Ký Sự`, 9 khoá `Ký sự` nên hai phạm vi nghiêng khác nhau; thứ tự `thứ sáu` theo Pāli `chaṭṭhaṁ`.
  Số đếm tự tính: `Kappasatasahassāni` (16.1) = sata 100 × sahassa 1000 = 100.000 kiếp, dịch Suốt một trăm ngàn kiếp theo tha-ap424:8.3 và tha-ap425:12.3 (cùng Pāli). `Sahassakkhattuṁ` (17.3) = 1.000 lần, một ngàn lần làm vua. `Pañcapaññāsakappamhi` (18.1) = pañca 5 + paññāsa 50 = 55, năm mươi lăm kiếp. `Sattaratana` (19.1) = bảy báu. `Cāturanto` (18.3) = bốn phương. `Tāvatiṁsa` (19.3) là tên cõi trời, cõi trời Ba mươi ba (33 khoá cùng nghĩa trong tầng tha-ap trên 38 khoá có Tāvatiṁsa). `Paṭisambhidā catasso` (33.1) = bốn vô ngại giải. Bài không có cụm Tiṁsakappasahassa nên điểm chưa phân xử được về tiṁsa (30 hay 3) không phát sinh ở đây. Số kiếp tương lai: 18.1 dịch Sau năm mươi lăm kiếp nữa và 21.1 dịch Sau vô lượng kiếp kể từ nay vì đó là lời thọ ký của Đức Phật (vị lai: bhavissati, tarissati, kārayissati, ṭhapessati); 30.1 là quá khứ nên Vào vô lượng kiếp trước. Tiền lệ tầng cho 18.1 là Vào năm mươi lăm kiếp trước đây (2 khoá), đó là lời kể quá khứ nên không dùng lại ở đây.
  Bất định: (1) 2.1 `Maṇḍapā` có thể là cây (tha-ap396:15.3 dịch cây maṇḍapa) hoặc là mái che/lều (tha-ap400:1.4, tha-ap556:1.4 dịch mái che); bản dịch giữ nguyên tên maṇḍapa, không chọn. Các tên cây không có tiền lệ Việt ổn định giữ nguyên Pāli: sinduvāraka (0 tiền lệ trong tầng), jīvajīvaka (tha-ap401:4.4 giữ nguyên; tha-ap390:2.2, tha-ap509:2.2 dịch trái cây nuôi sống, không áp dụng), nigguṇḍi (tha-ap329, tha-ap207 giữ nguyên), phārusaka (tha-ap284, tha-ap387 giữ nguyên), āḷaka, mahānāma, ajjuna, piyaṅgu, kapittha (tha-ap514 giữ nguyên), kapitthana (sn46.39 giữ nguyên), kosamba (tha-ap515 giữ nguyên), beluva (tha-ap445 giữ nguyên). Tên có tiền lệ Việt: badara dịch táo ta (không có tiền lệ trực tiếp; khác kola dịch táo gai ở tha-ap440:1.3), āmalaka dịch me rừng (tha-ap440:1.1, tha-ap284:2.1), alābu dịch bầu (tha-ap432), puṇḍarīka dịch sen trắng (tha-ap281; ở danh sách cây này cũng có thể là một loài cây, Pāli không nói rõ), kadalī dịch chuối (tha-ap33:2.3), mātuluṅgaka dịch thanh yên (tha-ap508:0.3), nimba dịch sầu đâu (ja311:3.5), nigrodha dịch đa (sn46.39:1.3), saḷala dịch sala (tha-ap372:2.1). (2) 7.3–7.4 `Khaṇena … vātābādho samuṭṭhahi` dịch bệnh gió đã khởi lên (mil5.5.3:6.1 dịch cùng sự việc là bệnh gió trong bụng; Pāli ở đây không nói trong bụng nên không thêm); 13.3 `vāto` dịch chứng gió, giữ thuật ngữ gió. (3) 9.3–9.4 `Asaṁsayañhi buddhassa, byādhi no udapajjatha`: tiểu từ `no` không có tiền lệ rõ trong tầng; hiểu là tiểu từ nhấn (không phải phủ định, vì 7.4 đã nói bệnh khởi lên) và không dịch riêng; 9.1 `Iriyañcāpi` dịch cả dáng vẻ (iriyā: dáng điệu, cách cử động; tầng không có tiền lệ). (4) 11.4 `satthugāravatā mama` có hai cách hiểu (kính trọng thầy là tôi, hoặc lòng kính trọng của tôi đối với thầy); chọn cách thứ nhất vì chủ ngữ của 11.2–11.3 là các đệ tử và `mama` là thầy của họ. (5) 12.2 `sabbosadhamahāsahaṁ` tách là sabbosadhaṁ + ahāsiṁ ahaṁ (cùng cách tách như `akāsahaṁ`, `adāsahaṁ` trong tầng); `sabbosadha` dịch thuốc từ mọi loại dược thảo, vì không rõ đây là tên một chế phẩm riêng hay chỉ mọi thứ thuốc; 26.3 dùng lại cùng cách dịch. 12.3 `pānīyayogaṁ` dịch pha chế thành thức uống. (6) 26.3 `tappesiṁ` dịch làm Ngài no đủ theo tha-ap395:22.2, 22.4 (5 trên 10 khoá có tappeti dịch no đủ). (7) 19.3 `khobhetvā` dịch làm chấn động; 19.4 `issaraṁ kārayissati` dịch người ấy sẽ làm chúa tể theo tha-ap395:19.4 (cùng Pāli; tha-ap10:10.1 dịch Sẽ thi hành quyền thống trị). (8) 20.3 `pariggahaṁ` dịch sự chấp giữ theo dn15:12.1–12.4 (tầng dịch chấp giữ); có thể hiểu hẹp hơn là sở hữu, tầng tha-ap chưa có tiền lệ. (9) 23.2 `taṇhāsotaṁ` dịch dòng ái (0 tiền lệ trong tầng). (10) 25.3 `Vivekānuvilokento` dịch đang tìm kiếm sự viễn ly (viễn ly 11 trên 16 khoá viveka trong tha-ap; anuviloketi chưa có tiền lệ); 6.3 `paṭisallānaṁ` dịch độc cư (1 khoá trong tha-ap, dn14 và nhiều bài dịch độc cư). (11) 16.3 `Vādite tūriye tattha` hiểu là câu vị trí cách tuyệt đối: khi nhạc cụ được tấu lên ở đó. (12) 27.2–27.3 `sukhette bījasampadā … Khepetuṁ neva sakkomi`: 27.2 dùng lại nguyên văn tha-ap55:2.2; `khepetuṁ` không có tân ngữ trong Pāli, dịch làm cạn nó với đại từ chỉ nghiệp ở 27.1 (không thêm tên quả báo). (13) 28.1 `Lābhā mama suladdhaṁ me` dịch Thật là lợi ích cho tôi, thật là may mắn cho tôi theo dn16:4.42.5, dn29:4.5 (cùng cặp lābhā/suladdhaṁ). (14) 28.2 `yohaṁ addakkhi nāyakaṁ` dịch tôi là người đã được thấy bậc Lãnh Đạo, giữ quan hệ từ yo; nāyaka đơn dịch Lãnh Đạo theo tha-ap425:6.4 (khác lokanāyaka dịch Đấng Dẫn Đạo thế gian). (15) 13.4 `sugatassa mahesino` và 7.3 `lokanāthassa` đứng sở hữu cách; dịch nơi … (7.3 Đấng Bảo Hộ thế gian: lokanātha trong 32 khoá tầng dịch Lãnh Đạo 13, Bảo Hộ 9, Hộ Trì 4, cứu độ 1, khác 5; chọn Bảo Hộ để không trùng nāyaka là Lãnh Đạo ở 28.2). (16) 24.4 `etadagge ṭhapessati` dịch theo 2 tiền lệ cùng Pāli (sẽ đặt vị ấy vào vị trí tối thắng) và 29.4 theo 3 trên 6 khoá (đã đặt tôi vào vị trí tối thắng); Pāli không nêu lĩnh vực của vị trí tối thắng nên không thêm. (17) 28.3 `Tena kammāvasesena` dịch Nhờ phần nghiệp còn lại ấy; tiền lệ cùng Pāli là Nhờ phần dư của công đức ấy (2 khoá: tha-ap59:5.1, tha-ap109:8.1) và Do phần nghiệp còn sót lại ấy (thi-ap37:5.1, 1 khoá): chọn từ nghiệp vì 27.1 đã dùng nghiệp cho kamma trong cùng bài (accuracy). (18) 8.3 `Upagantvāna sambuddhaṁ` dịch Đi đến gần Đức Chánh Đẳng Giác; tiền lệ cùng Pāli là Đi đến gần Đức Toàn Giác 4 khoá và Tiến lại gần Đức Chánh Đẳng Giác 2 khoá; chọn Chánh Đẳng Giác theo đa số toàn tầng cho sambuddha (159 trên 231 khoá, Toàn Giác 45, Chánh Giác 14) và theo các bài cùng phẩm (tha-ap396, 399); 6.1 và 25.1 `Anomadassī bhagavā` dùng lại Bậc Vô Tỳ Nhiễm, Đức Thế Tôn (4 khoá cùng Pāli, kể cả khi bỏ nháy mở: tha-ap70:1.1, tha-ap178:1.1, tha-ap481:1.1, tha-ap481:5.1; 1 khoá giữ tên Anomadassī ở tha-ap4:1.1; toàn tầng 11 khoá có Anomadassī: Vô Tỳ Nhiễm 6, giữ tên 5), nên bài không còn tên Anomadassī ở thân kinh — đây là chỗ cần biên tập phán. (19) Ngôi và xưng hô: người kể là vị trưởng lão nói tôi (cùng phẩm tha-ap396, 399, 395); lời Đức Phật ở 15–24 là Ta; các tiền lệ cùng Pāli dùng ta ở 1.3, 8.2, 27.1 được đổi sang tôi vì ngôi kể của phẩm, không phải khác nghĩa. (20) 1.4 `sakasissehi māpito` dịch do chính các đệ tử của tôi tạo dựng (saka: của chính mình).
  Lượt thuật ngữ (đếm trên tầng tha-ap, không tính bài này): Đấng Dẫn Đạo thế gian cho `lokanāyaka` (Dẫn Đạo 91 trên 135 khoá, Lãnh Đạo 15, Dẫn Lộ 6); bậc Tự Tại cho `sayambhū` (60 trên 77, Tự Chứng 7, Tự Hữu 6); bậc Có Mắt cho `cakkhumā` (33 trên 47, Hữu Nhãn 8); bậc Đại Anh Hùng cho `mahāvīra` (46 trên 57); bậc Toàn Tri cho `sabbaññu` (10 trên 15); Sát-đế-lợi cho `khattiya` (47 trên 62); bậc Đại Ẩn Sĩ cho `mahesi` (48 trên 59); Đấng Thiện Thệ cho `sugata` (11 trên 12); thiện căn cho `sukkamūla` (31 trên 37); xứ Jambumaṇḍa (3 trên 3); dòng họ Okkāka (29 trên 29).
  Công thức kết `Itthaṁ sudaṁ … abhāsitthāti` dịch theo nhóm đa số (những bài kệ này: 522 khoá, số ít bài kệ này: 2 khoá trong tầng tha-ap). Hai khoá lược `…pe…` (32.2, 33.2) giữ đúng một `…`; Pāli không có `(…)` ở khoá nào và không có `…` trần. Dấu nháy: nháy kép mở ở 1.1 và đóng ở 33.3; nháy đơn mở ở 15.1 và đóng ở 24.4 (lời thọ ký của Đức Phật).
  Đã dò tiền lệ cho 64 khoá có Pāli trùng nguyên văn với tầng tha-ap: 54 khoá dùng lại nguyên văn bản Việt của tầng, 10 khoá khác (1.3, 8.2, 27.1 đổi ta sang tôi; 6.2 và 25.2 theo đa số từng thuật ngữ thay vì dạng một khoá duy nhất bậc Tự Tại, bậc Dẫn Đạo Thế Gian; 8.3 và 28.3 giải thích ở trên; 13.4 dùng nơi vì cú pháp sở hữu cách; 18.1 vì thì tương lai; 20.1 chỉ khác chữ hoa đầu dòng). Trong chính bài có 6 cặp Pāli trùng nguyên văn (6.1 với 25.1; 6.2 với 25.2; 6.4 với 25.4; 24.2 với 29.2; 24.3 với 29.3; 32.2 với 33.2); cả 6 cặp Việt giống nhau, 0 cặp lệch. 32.3 và 33.3 chỉ khác nháy đóng nên không tính là trùng. Đã kiểm 135/135 khoá khớp tập khoá và thứ tự Pāli, nháy đơn ‘ ’ và nháy kép “ ” khớp Pāli từng khoá, NFC, không khoảng trắng thừa, không khoá rỗng, không Pāli lọt sang bản Việt ngoài tên riêng và tên cây.
