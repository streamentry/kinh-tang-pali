  48 khoá, đủ 48/48 — trong đó có **15 khoá** ở `:12.1`–`:15.4` (dòng đóng phẩm + uddāna) mà nhiều bài
  `tha-ap` trong tầng không có. Dấu lược: `:7.2`, `:8.2`, `:9.2` là `…pe…` ⇒ mỗi khoá **một** `…`, khớp 2
  phía, không mở rộng. Nháy kép: 1 cặp, `:1.1` mở / `:9.3` đóng — đúng như Pāli.

  PĀLI TRÙNG NGUYÊN VĂN — bài này gần như là bản thứ hai của tha-ap469: **34/48 khoá trùng Pāli nguyên
  văn** với tha-ap469 và 20/48 với tha-ap384; tôi dùng lại **nguyên văn toàn bộ**. Trong đó có cả
  `Nāḷikeraphalaṁ gayha` chỉ khác `Labujaṁ phalamādāya` ở tha-ap469 nên dịch mới *Cầm trái dừa trên tay,*
  theo tiền lệ tha-ap165:1.3 `Nāḷikerañca pādāsiṁ` → *Tôi đã cúng dường trái dừa,*.
  Các khoá còn lại dùng lại từ chính tha-ap469/tha-ap384: `Ekanavutito kappe,` `yaṁ phalaṁ adadiṁ tadā;`
  `Duggatiṁ nābhijānāmi,` `Kilesā jhāpitā mayhaṁ,` `viharāmi anāsavo.` `Svāgataṁ vata me āsi,`
  `kataṁ buddhassa sāsanaṁ.` `Paṭisambhidā catasso,` `kataṁ buddhassa sāsanaṁ”.`.

  DÒNG ĐÓNG PHẨM VÀ UDDĀNA — `:12.1` `Kaṇikāravaggo ekapaññāsamo.` theo khuôn đã có (tha-ap352:7.1
  *Phẩm Ekapadumiya là phẩm thứ ba mươi lăm.*) ⇒ *Phẩm Hoa Kaṇikāra là phẩm thứ năm mươi.* ·
  `:13.1` `Tassuddānaṁ` dùng lại nguyên văn *Tóm tắt phẩm này:* (tha-ap252:8.1, tha-ap142:11.1) ·
  `:14.1–14.4` là uddāna nén tên riêng thành phiên âm: `Kaṇikārekapattā ca` → *Hoa Kaṇikāra và Ekapattá*…
  Tôi **không** tách mới từng tên nếu Pāli đã nén (`Kaṇikārekapattā` = *Hoa Kaṇikāra và Ekapattā*) và giữ
  dấu Pāli cho các tên riêng; `Pādañca` có **d** răng nên tôi dịch *Pāda*, không phải *Pāḍa* (đã kiểm bằng
  regex tách từ của `_hvi.py`). `:15.3–15.4` `Ekaṁ gāthāsataṁ hoti, ūnādhikavivajjitaṁ.` tôi dịch *có
  tổng cộng là / một trăm bài kệ, không vượt quá.* — con số 100 là của Pāli, không phải do tôi đếm.

  THUẬT NGỮ, đếm được: `Therāpadāna` 327/336 · `Kaṇikāravagga` → *Phẩm Hoa Kaṇikāra* — **7/7** ·
  số thứ tự ở `:0.3` giữ theo đo **KEEP 62 / DROP 49** ở tầng `tha-ap` (xem `tha-ap115.yaml`) ·
  `Nāḷikeraphaladāyaka` **0 tiền lệ** trong tầng ⇒ giữ dạng Pāli, khai vào bộ nhớ tiến trình `_hvi._GIỮ`
  sau khi kiểm chứng.

  BẤT ĐỊNH — chỉ hai, và cả hai đã có tiền lệ nên tôi ghi lại cho người đọc scorecard:
  (1) `vippasannena cetasā` (3.4) dùng *với tâm thanh tịnh tinh khiết* theo tha-ap469/tha-ap384, không dùng
      *với tâm ý vô cùng trong sáng* của tha-ap28, vì bài này phải khớp bản đã có cùng cụm kệ.
  (2) `Uppajjateva ratanaṁ, / nibbattassa tahiṁ tahiṁ.` (4.3–4.4) là cặp kệ không có tiền lệ nào trong tầng;
      tôi dùng lại nguyên văn của tha-ap469/tha-ap384 và ghi nhận `tahiṁ tahiṁ` ở đây được hiểu là *mỗi bước
      lại thêm một chút* theo cả hai bài đã có.

  CỔNG KỸ THUẬT CHƯA CHẠY — xem `blocking_errors`. `technical_integrity` 9.6, không tuyên bố technical gate
  pass. Bốn lệnh để coordinator chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
  Sửa lan 2026-10-13: tha-ap512:3.1 Vittisañjanano mayhaṁ «đã liếm sạch vết thương của ta» → «sinh khởi niềm hoan hỷ cho ta» (vitti = hoan hỷ: tha-ap315:2.3, tha-ap99:3.1 «Niềm hoan hỷ…», tha-ap402:3.3, tha-ap12:3.4; sañjanana = làm sinh khởi); tha-ap512:3.2 diṭṭhadhammasukhāvaho «mang theo sự an lạc của điều đã thấy biết» → «mang đến an lạc ngay trong hiện tại» (diṭṭhadhammasukha = an lạc hiện tại: «hiện tại lạc trú», «an lạc hiện tại» ở nhiều khoá của mn, an, dn). Bất định ghi nhận: chủ ngữ của 3.1–3.2 (Đức Phật hay hành động cúng dường) không phân xử được từ Pāli nên bản Việt để trống chủ ngữ; 2.4 mahāyaso «bậc cao lớn» chưa sửa, nghĩa là «bậc có danh tiếng lớn». 2 khoá đổi trên 48, tập khoá và thứ tự không đổi. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại; điểm và status giữ nguyên.

  Sửa lan 2026-10-13 (cơ học, toàn tầng): khoá tha-ap512:5.3 — `duggatiṁ nābhijānāmi` trước dịch “Ta
  không biết mình rơi vào khổ đau,”, đảo nghĩa (Pāli: không còn biết đến, tức không còn rơi vào, đọa
  xứ nào) → “Ta không còn biết đến đọa xứ,”; giữ nguyên xưng hô của bài. Cùng công thức đã dịch đúng ở
  đa số khoá trong tầng.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan; đọc đối kháng đủ 48 khoá, đổi 18 khoá, tập khoá và thứ tự không đổi). Các mục này thay thế những chỗ cũ trong notes nếu mâu thuẫn.
  (1) 1.2 `ārāmiko ahaṁ tadā` «dân làng ở đó» → «người phục vụ vườn tu viện» — «dân làng» sai nghĩa (ārāmika = người trông nom vườn/tu viện); theo tha-ap182:1.2 và đa số các khoá có ārāmika trong tầng («người phục vụ/làm công tu viện, tịnh xá»; «dân làng» chỉ ở ba bài này). tha-ap469:1.2 và tha-ap384:1.2 còn «dân làng», chưa sửa vì ngoài lát này.
  (2) 2.4 `mahāyaso` «bậc cao lớn» → «bậc danh tiếng lớn» (đa số áp đảo trong tầng: các khoá có mahāyasa- đều dịch «danh tiếng lớn» hoặc «đại danh xưng»; «cao lớn» chỉ ở tha-ap469/512/384).
  (3) 3.1–3.2 trả về dạng đa số «làm sinh khởi niềm hoan hỷ nơi ta» / «đem lại an lạc ngay trong hiện tại» (tha-ap129:4.3–4.4, tha-ap117:4.3–4.4, tha-ap469, tha-ap384) để Pāli trùng nguyên văn thì Việt giống nhau; bất định về chủ ngữ (Đức Phật, vì vittisañjanano là danh cách giống đực cùng cách với mahāyaso, hay chính việc dâng cúng) vẫn chưa phân xử được từ Pāli nên bản Việt không thêm chủ ngữ.
  (4) 4.1–4.2 `Adhigacchiṁ tadā pītiṁ` / `vipulañca sukhuttamaṁ` — trước đây `pītiṁ` (hoan hỷ) nằm ở khoá 4.2 còn 4.1 chỉ có «đã đạt được» (lệch ranh khoá); nay 4.1 «Lúc ấy ta đã đạt được niềm hoan hỷ,» · 4.2 «rộng lớn và an lạc tối thượng;». Hệ quả: bài khác có cùng Pāli (tha-ap469, tha-ap384) còn kiểu cắt cũ.
  (4b) 4.3–4.4 `Uppajjateva ratanaṁ, nibbattassa tahiṁ tahiṁ` «Quý báu ấy đơn thuần là hiện khởi thôi, mỗi bước lại thêm một chút» → «Báu vật quả thật hiện khởi, ở mỗi nơi ta sinh ra.» — bản cũ thêm nghĩa không có trong Pāli (`tahiṁ tahiṁ` = ở mỗi nơi, đối chiếu tha-ap540:11.4 «ở mỗi nơi con sinh ra»; `nibbattassa` = của người sinh ra, không phải «thêm một chút»). Bất định còn lại: `ratanaṁ` là «của quý/báu vật» hay «ngọc báu» cụ thể không phân xử được nên giữ «báu vật».
  (5) 6.2 `samādhikusalo ahaṁ` thêm «ta» (trước thiếu `ahaṁ`; 3/4 khoá cùng Pāli có đại từ).
  (6) 0.3 và 11.1 (cả `translationTitle`) «Nāḷikeraphaladāyaka» → «Cúng Dường Trái Dừa» theo bài liền kề cùng cấu trúc tên (tha-ap511 «Cúng Dường Quả Thốt Nốt», tha-ap508 «Cúng Dường Trái Thanh Yên»); tên riêng ở 10.1 vẫn giữ dạng Pāli như tha-ap511:7.1 và tha-ap508:7.1. Quyết định trước «giữ dạng Pāli» không còn đứng vững.
  (7) 12.1 `Kaṇikāravaggo ekapaññāsamo` «thứ năm mươi» → «thứ năm mươi mốt» (ekapaññāsa = 51; ghi chú cũ «thứ năm mươi» sai; phẩm trước `Kiṅkaṇipupphavaggo paññāsamo` là 50, sau `Phaladāyakavaggo dvepaññāsamo` là 52).
  (8) Uddāna: 14.1 «Ekapattā» → «Ekapatta»; 14.2 `tathāvaṭā` = tathā + avaṭā, tên là Avaṭa (tha-ap506 Avaṭaphaliya), không phải «Vaṭā»; 14.4 `ajelīmodameva` = Ajelī + amodaṁ + eva, tên là Amoda (tha-ap510 Amodaphaliya), không phải «Modama». 15.2 bỏ «hãy nghe» (Pāli không có; `gāthāyo gaṇitā viha` theo `gaṇitā iha` → «các bài kệ ở đây đã được đếm»). 15.3–15.4 `Ekaṁ gāthāsataṁ hoti` / `ūnādhikavivajjitaṁ`: con số «một trăm bài kệ» nằm ở 15.3 chứ không phải 15.4 (ranh khoá lệch); `ūnādhika` = thiếu và thừa nên «không thiếu, không thừa» thay «không vượt quá» (chỉ nửa nghĩa).
  Không đổi dù nghi ngờ: 3.4 `vippasannena cetasā` «tâm thanh tịnh tinh khiết» (đa số phân tán, 22 khoá, nhiều cách dịch phân tán; giữ theo tha-ap469/384); 1.4 «đang ngự giữa bầu trời lộng gió» (đa số 6/6); 2.1 «Cầm trái dừa trên tay» (có «trên tay» thêm nhưng nhẹ); chữ hoa đầu 3.1 theo Pāli nhưng Việt viết thường vì tiếp câu 2.4.
  Chấm lại: semantic_fidelity 9.4 → 9.2 (bản chấm cũ bỏ sót các lỗi nghĩa ở 1.2, 2.4, 4.3–4.4, 14.2, 14.4, 15.4 mà nay đã sửa; còn bất định chủ ngữ 3.1–3.2 và ratanaṁ); segment_alignment 10.0 → 9.8 (hai chỗ lệch ranh khoá cũ ở 4.1/4.2 và 15.3/15.4; đã sửa nhưng điểm cũ không đứng vững). Các tiêu chí khác giữ nguyên. final_score 9.24 → 9.20. Blocker không có tầng tham khảo tiếng Anh giữ nguyên. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại.

  Quyết định hội đồng biên tập 2026-10-16: C6 — 14 khoá (1.2, 1.3, 2.2, 3.1, 3.3, …) (xưng hô theo mục 9: người kể xưng "tôi").
