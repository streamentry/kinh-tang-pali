notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Milindapañha. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ dùng lại: Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc · Rājā āha— → Vua nói: ·
  Kallosi → Khéo lắm, thưa tôn giả Nāgasenā · apuñña → nghiệp ác (mil3.7.8) · vippaṭisārī → có hối tiếc
  (an5.142) · dãy pāmojjaṁ jāyati … pajānāti dùng nguyên văn theo an3.95:5.3 cho các mắt xích hoan hỷ,
  hỷ, thân khinh an, cảm thọ lạc, tâm định. Chênh lệch chỉ ở chỗ an3.95 dịch passaddhakāyo sukhaṁ vediyati
  là cảm thọ lạc, còn đây Pāli là vedeti; tôi dịch cảm thọ dễ chịu và giữ nguyên chuỗi với dn10:2.12.4 và
  dn2:74.4.
  Bất định đã ghi nhận và đã phân xử bằng parallel. Ekanavutikappāni thoáng tưởng là lá sen, nhưng thi-ap13:3.3
  có đúng cụm này đứng cạnh Ekanavutikappāni vinipātaṁ nagacchahaṁ (thiện nghiệp cho nên không bị diệt tận),
  và dn14:1.16 cùng sn42.9:4.5 dùng ekanavutikappe làm mốc chín mươi mốt kiếp. Vậy kappā ở đây là kiếp chứ
  không phải lá, nên tôi dịch là chín mươi mốt kiếp. Nếu tôi dịch lá sen thì câu thành vô nghĩa.
  Vinipāta trong câu này là đi đến chỗ diệt tận; cùng chữ trong danh sách apāya duggati vinipāta niraya thì tầng
  dịch là sự thống khổ, nên đây tôi chọn nghĩa diệt tận theo ngữ cảnh.
  Puñña và apuñña trong bài này tôi dịch là công đức và nghiệp ác, không dịch là lành và ác, để khớp với mil3.7.8
  và với câu hỏi ở khoá 1.2.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0.
  Ngoặc kép: Pāli mở ở 1.5 và đóng ở 1.8, kèm nháy cong lồng ở 1.5 và 1.8; tôi giữ nguyên, nên 1.6 và 1.7 là
  tiếng nói của Trưởng lão chứ không phải tường thuật. Cân trên cả bài.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
