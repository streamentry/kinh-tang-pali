notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.1, 2.3, 2.5, 2.7 — `abhisambuddha` “thắng tri” → “đã được Như Lai giác ngộ”: “thắng tri” là cách dịch của `abhiññā` (và vẫn đúng ở 7.1, `abhiññāya`), còn `abhisambuddha` ở `mn139`, `sn56.11`, `dn34` là “giác ngộ”; khoá 3.1 (cùng `abhisambuddhaṁ`) đổi theo để cả bài nhất quán. Khoá 4.1 — `anupādisesāya nibbānadhātuyā` “ở cõi Niết-bàn không còn dư tàn” → “trong Niết-bàn giới không còn dư y” (dạng của `dn16`, `dn29:29.3`, `cnd18:31.3`); “dư tàn” không có căn cứ cho `upādisesa`. Giữ nguyên “thế gian” cho `loka` (dạng chuẩn của kho; `an4.23` dùng “thế giới” là cách khác chứ không hơn), “nguồn gốc” và “đoạn diệt” cho `samudaya`/`nirodha` vì nhất quán trong bài.
