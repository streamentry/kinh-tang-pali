  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá), nên đối chiếu được ở mức khoá. Hai chỗ Sujato nối câu khác trật tự Pāli: (a) `6.1`–`6.4`, `7.1`: Sujato đặt thành một câu Not to gain nor loss … the wise cling to nothing, tức động từ `limpanti` của `7.1` chi phối cả bốn khoá `6.x`; bản Việt giữ nguyên trật tự và ranh giới Pāli, dịch `6.x` thành chuỗi vị trí cách (không ở nơi …) rồi dùng dấu gạch ngang ở cuối `6.4` để nối sang `7.1`, không thêm động từ nào vào `6.x`. (b) `2.3`–`2.4`: Sujato thêm đại từ this is the teaching of the noble ones for living creatures; bản Việt giữ `ariyadhammova pāṇinaṁ` thành vế riêng không thêm đại từ.

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 67 = Pāli 67, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
