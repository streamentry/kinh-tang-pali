  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `viññū` → người có trí (đo trên tầng: 143 khoá, so bậc trí 25, bậc hiểu biết 14, người trí 33); `dhīra` → bậc trí (67 khoá; so hiền trí 10, kiên định 9). Giữ hai từ Việt khác nhau cho hai từ Pāli khác nhau: `7.3` dhīra là bậc trí, `9`–`10` viññū là người có trí.
    · `bāla` → kẻ ngu (271 khoá). `appabuddhi` → kẻ ít hiểu biết và `dummedha` → kẻ thiếu trí: cả hai không có tiền lệ trực tiếp ở dạng này (`dummedha` có thiếu trí ở `mn86:18.52`, thiếu trí tuệ ở `sn2.22:2.1`); tôi giữ ba bậc kém trí khác nhau để không đồng nhất ba từ Pāli. Chọn của tôi, ghi ở bất định.
    · `adhammika`/`adhammena` → phi pháp (164 khoá; so bất nghĩa 7, bất chính 2); `dhammika`/`dhammena` → đúng pháp. Với `dhammika`, đo trên tầng: theo pháp 64, hợp pháp 57, đúng pháp 44, chính đáng 38 (đếm theo chuỗi con, các nhóm giao nhau). Tôi chọn đúng pháp thay hợp pháp vì hợp pháp thiên về nghĩa pháp luật, và vì đối cực của nó đã chốt là phi pháp. Khuôn bài dùng cả hai thế đối lập lābha/alābha, yasa/ayasa, pasaṁsā/garahā, jīvita/maraṇa.
    · `lābha`/`alābha` → được lợi/mất lợi (`dn34:2.1.36`, `dn33:3.1.141`). `yasa` → danh tiếng (40 khoá, so danh 65) và `kitti` → tiếng tốt (32 khoá, so danh tiếng 35) để hai từ Pāli của `6.2` khác nhau; `ayasa` → mất danh tiếng (`dn34` dùng mất danh). `nindā` → chê bai, `pasaṁsā` → khen ngợi (`6.3`), `garahā` → chê trách (`10`).
    · `sibbinī` → bà thợ dệt (10 khoá, toàn ở `an6.61`; so thợ may 2 khoá ở `snp5.3`). `indakhīla` → cột trụ Inda (`sn56.39`, `sn56.40` dịch cột trụ của Inda; so Indra 1 khoá ở `kp6:8.1`, Đế Thích 1 khoá ở `snp2.1:8.1`; bản này bỏ chữ của cho ngắn). `udabindu pokkhare` → như giọt nước trên lá sen (`snp4.6:9.1`, `dhp336:4`). `sabbattha aparājitā` → ở mọi nơi đều không bị thua bại (`snp2.4:13.2`).
    · `bhavābhava` → hữu này hữu khác (4 khoá `snp4.2:5.4`, `snp4.3:7.2`, `snp5.5:12.2`, `snp5.6:8.5`; so hữu và phi hữu 6 khoá ở `ud2.10`, `iti49`, `iti58`, `snp1.1`, `snp4.11`). Lấy nghĩa này vì Pāli ở đây là `bhavābhave`, vị trí cách, đi với `santacittā`, và Sujato đọc rebirth in this or that state.
    · `kopa` → giận dữ (58 khoá; so sân hận 47). `sukhita` → an vui (10 khoá; so an lạc 8, hạnh phúc 4); tôi chọn an vui để không trùng với lạc của `sukha`. `mahiddhika` → có đại thần lực (22 khoá; so đại thần thông 12). `pāṇi` → chúng sinh (19 khoá). `anāsava` → không còn lậu hoặc. `parinibbanti` → nhập Niết-bàn, theo `thag14.1:14.3` cùng cặp với `dhp126:4` (bậc vô lậu nhập Niết-bàn); `sn35.136:9.4` dịch đi vào Niết-bàn.
    · `viveka` → viễn ly (114 khoá, so độc cư 10). `kāmamayika` → của dục: dùng giới từ của, không dịch `maya` thành do dục tạo thành vì Pāli ở đây chỉ nói dục lạc, không nói nguồn gốc.
    · `saṁyuga` → ách; `dhura` → ách (`1.2`) và gánh (`1.2`, `dhurassaho` kham nổi gánh nặng); `atibhāra` → gánh quá nặng. `nātivattati` → không rời bỏ (ách).
    · `Cuddasakanipāta` → Bộ Mười Bốn Bài Kinh (khuôn thag đã dịch: Bộ N Bài Kinh, `thag14.1:0.2`). `Paṭhamavagga` → Phẩm Thứ Nhất. `0.4` theo khuôn Kinh Kệ Của Trưởng Lão X (190/241 khoá `:0.4` của thag). `14.6` `niṭṭhito` → đã khép lại (4 khoá ở `thag7.5`–`thag10.7`; so đã hoàn tất 3 khoá ở `thag2.49`, `thag4.12`, `thag11.1`).

  KHÁC BIỆT ĐÃ PHÂN XỬ (đối chiếu Sujato).
    (1) `3.1`: Sujato gộp `kāle kālavasaṁ pattā` thành the sway of time; bản Việt giữ cả hai thành phần (kāle lúc, thời; kālavasa sức chi phối của thời gian) thành Đến lúc, rơi vào sức chi phối của thời gian. `kāla` ở đây có thể là thời gian lẫn thời điểm chết; xem bất định.
    (2) `4.3`–`4.4`: Sujato viết this pair destroys the fool who doesn't see things as they are; bản Việt giữ `adassino` là tính từ của `bālā` (những kẻ không thấy như thật) thay vì mệnh đề quan hệ.
    (3) `8`–`12`: tất cả có cấu trúc `X … và Y …: X thì tốt hơn Y`. Sujato đặt There's X, and there's Y; bản Việt không thêm chữ có, giữ danh từ trần theo Pāli.
    (4) `12.4` `yañce jīve adhammikaṁ`: động từ `jīve` là hình thái giả định (nếu sống); bản Việt dịch sống phi pháp mà không thêm nếu, vì ba khoá song song `8.4`, `10.4`, `11.4` đều là danh từ trần, và Sujato cũng dịch than life without principles.
    (5) `15.1`: Revato ở kệ tóm tắt là Revata của `thag14.1` (tiêu đề Pāli Khadiravaniyarevata); bản Việt viết Revata cho khớp Pāli, không thêm Khadiravaniya vì Pāli ở đây không có.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `3.1` `kāle kālavasaṁ pattā`: `kāla` vừa là thời gian vừa là cái chết (kāla = chết ở nhiều nơi), và `kāle` có thể là đúng lúc. Tôi theo cách đọc của Sujato (time) và giữ nguyên hai lần xuất hiện của từ, không quyết nghĩa chết. Tầng không có tiền lệ trực tiếp để phân xử; đổi sang cái chết chỉ sửa một khoá.
    · `3.4` `māṇavā`: dịch những người trẻ ấy theo Sujato (young men). Có thể là cách gọi chung chỉ con người (đồng nghĩa với `narā` ở `3.3`); tầng không có kệ nào dùng `māṇavā` dạng này để đối chiếu. Giữ trẻ vì là nghĩa gốc của từ.
    · `2.4` `ariyadhammova pāṇinaṁ`: Sujato dịch this is the teaching of the noble ones for living creatures, tôi dịch chính là pháp của bậc Thánh đối với chúng sinh. `pāṇinaṁ` là sở hữu cách số nhiều (của chúng sinh/đối với chúng sinh); chưa phân xử trọn vẹn giữa dành cho chúng sinh và thuộc về chúng sinh. Chọn đối với chúng sinh vì cách đọc trung tính hơn.
    · `2.1` `tittā`: dịch no đủ. Tầng không có tiền lệ trực tiếp ở vế trí tuệ; `dn16:5.16` dịch `atitta` là chưa thỏa mãn. Chọn no đủ vì Sujato full of wisdom và vì thỏa mãn đứng cạnh biển với nước dễ gây hiểu thành bằng lòng với trí tuệ, ngược nghĩa khen.
    · `4.1`/`4.2`/`5.4` `unnata`/`onata`: dịch phấn chấn/chùng xuống (Sujato elated/downcast). Hai từ gốc nghĩa là nâng lên và hạ xuống, tầng không có tiền lệ trực tiếp. Tôi tránh vênh lên vì hàm ý kiêu mạn mà Pāli không nói.
    · `4.3` `haññanti`: dịch bị đánh gục (Sujato destroys). Nghĩa gốc là bị đánh/bị giết; đánh gục là cách chọn mức độ giữa bị đánh và bị giết, không có tiền lệ trực tiếp (`an4.39`, `snp2.7` đều là nghĩa giết hại vật).
    · `6.1`–`6.4`: bốn khoá dịch thành vị trí cách không có động từ, nối với `7.1` bằng gạch ngang. Đọc độc lập chúng có thể bị hiểu là họ không ở trong khổ và lạc; ý đúng là họ không bị dính ở đó, được `limpanti` ở `7.1` xác định. Đây là chỗ bản Việt rủi ro hiểu sai nhất bài nếu bị cắt rời khỏi khoá kế.
    · `13.3` `asitā`: dịch không nương tựa. `sita` có nghĩa bị trói/y cứ (`mn137` dịch `gehasita` là y cứ tại gia), Sujato dịch unattached. Giữ không nương tựa theo gốc từ, không đồng nhất với không bị dính ở `7.1`.
    · `13.4` `piyāpiya`: dịch điều ưa thích hay không ưa thích; tầng không có tiền lệ trực tiếp cho dạng ghép `piyāpiya`.

