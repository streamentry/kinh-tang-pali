notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Pārāpariya trong phẩm Dvādasamavagga.

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1): 10 bản trên đĩa mở rộng,
  5 bản giữ lược (thag2.35, thag6.2, thig1.7, thig1.8, thig1.9). Xem `thag1.112.yaml`. Cả hai đều giữ
  2 dấu lược như Pāli.

  **Thứ tự khoá tiêu đề: theo PĀLI** (`0.3` = phẩm, `0.4` = tên bài kệ); 12 bản thag đã publish đặt
  ngược, tôi không sửa chúng (ngoài lát).

  **Không đối chiếu được tầng Việt hiện hành** (bilara chỉ có Pháp Cú). Sujato có 8/9 khoá, trống
  đúng dòng kết lược; mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments = 0`, `ratio = 1`,
  không rơi ngưỡng 80%.

  **Thuật ngữ, đếm được.** `Chaphassāyatane` → *sáu căn* (21 bản trong tầng; `phassāyatana` còn có
  cách dịch *xúc xứ* ở mn140:9.3 nhưng đó là khi ghép với từng căn). `guttadvāro` → *các cửa đã
  gác giữ*; kho dùng *hộ trì các cửa giác quan* 7 lần (mn53:6.2) và *hộ trì các căn* 23 lần (an3.16)
  cho `indriyesu guttadvāro`, ở đây Pāli không có `indriyesu` mà có `dvāra` nên tôi giữ *cửa*.
  `susaṁvuto` → *khéo khép kín*. `Aghamūlaṁ` → *gốc rễ của sầu khổ* (sn22.31:0.3 dịch đúng tên
  kinh là *Kinh Gốc Rễ Của Sầu Khổ*; `agha` = sầu khổ ở sn22.31:1.5). `vamitvāna` → *nhổ bỏ*.
  `patto me āsavakkhayo` → *tôi đã chứng ngộ sự cạn lậu* (`āsavakkhaya` → *cạn lậu*: an5.70:0.3, sn48.20:0.3).

  **Bất định đã ghi.** Pāli pha ngôi: `Chaphassāyatane hitvā` là thứ hai sở hữu ngầm (người nghe),
  còn `patto me` là thứ nhất sở hữu (*của tôi*). Tôi giữ nguyên: vế 1–3 không chủ ngữ như Pāli, và
  chỉ vế 4 có *tôi*. Sujato cũng thêm *I/my* vào cả bốn vế — tôi không làm thế.

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2); ngoặc kép cân; không chữ ngoài
  Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này cấm) →
  `technical_integrity` = **9.6**.

  **Danh xưng giữ nguyên dạng Pāli** (Pārāpariya).
