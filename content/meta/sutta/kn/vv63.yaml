notes: |-
  Dịch trực tiếp từ Pāli root cho cả 141 khoá (đúng tập khoá và thứ tự Pāli); không có bản Anh của Sujato cho vv63 tại commit đã ghim.
  Coverage English theo công thức của `source/layers.yaml`: mẫu số = 0 (đoạn Pāli dài nhất chỉ 34 ký tự, không đoạn nào đạt ngưỡng 40 ký tự; có 137 khoá ngoài khối :0), nên cổng coverage không đo được gì ở bài này; thiếu cả ba tầng tham khảo nên vẫn là blocker nêu trên.
  Đối chiếu tiền lệ trong tầng: kệ song song pv18 (khoá 11–15 của pv18 ứng với 13, 15, 16, 17, 18 của bài này), vv83 (kệ quy y và năm giới), vv79 (rừng Nandana), tha-ap326 (kệ "Ahiṁsā"), ja503 (nước mát từ hang núi). 45 khoá của bài có Pāli trùng nguyên văn ở bài khác (139 cặp); 50 cặp khác byte, trong đó phần lớn chỉ khác dấu câu hoặc nháy biên; khác thật ở 15 khoá: 8.3–8.4 và 9.2–9.4 (nối song song với tha-ap326 nhưng giữ `ārati` mà tha-ap326 bỏ), 15.1 (giữ "Sát-đế-lợi" cho nhất quán với khoá 13.2 và pv18; tầng ja có 5 khoá viết "Quý tộc"), 25.1 (giữ "nương về" theo vv83), 26.3 (giữ "chất say" theo vv83, vv61; pv17 viết "rượu"), 32.4, 33.3 (đã đổi về "thân người" theo đa số), 34.1–34.4 (vv79, vv78 bỏ sót "chim" của `dija` và "múa hát" của `naccagīta` nên dịch lại cho đủ nghĩa Pāli). Trong chính bài có 3 nhóm Pāli trùng (13.4/15.4/16.4; 21.2/24.2; 24.4/25.4), cả ba nhóm bản Việt giống nhau.
  Số Pāli: `sahassa` = 1000 (khoá 27.1 "ngàn tia", 23.3 `yojanāni sahassāni` "hàng ngàn do-tuần", 30.2 "ngàn con vật kéo xe"); `pañcahi māsehi` = năm tháng (10.2); `yojanasattamāyato` đọc là bảy do-tuần theo hướng satta + âm nối m + āyata (27.4); `terasamaṁ` = thứ mười ba (35.1). Không có phép nhân thang lớn.
  Quy ước: tên phẩm "Phẩm Cỗ Xe Lớn" và nhãn "Chuyện Cung Điện Nam Hư Không" theo các bài cùng phẩm đã dịch (9 tệp dùng đúng nhãn này, 2 tệp giữ `Purisavimāna`); `bhante` = "thưa tôn giả" (15 so với 1 khoá "Bạch thầy" trong nhóm vv); `parinibbuto` = "bát-niết-bàn"; `tapassino` = "khổ hạnh"; `mahāmuni` = "Đại Mâu-ni"; `jina` = "bậc Chiến Thắng"; `purisājañña` = "bậc tuấn mã giữa loài người"; `aticāra` = "làm quá đà" (8 khoá tiền lệ). Nháy kép khớp Pāli từng khoá: Pāli mở nháy ở 2.1, 8.1, 12.1 và chỉ đóng ở 3.4, 10.4, 18.4 nên bản Việt giữ đúng như vậy (lời của vị tỳ-kheo trải qua nhiều khổ kệ).
  Bất định, giữ nguyên trong bản dịch theo cách ít giả định nhất: (1) `nisārassa` ở 1.1 — dịch "mũi tên" theo nghĩa suy ra từ ngữ cảnh cây cung, chưa có chứng cứ độc lập trong tầng Pāli đã ghim; (2) `subhaṭṭhena` ở 19.3 — đọc là lời nói khéo, đồng nghĩa với `subhāsitā` của 19.1; (3) `urassa` ở 28.2 — dịch "ngực xe", chưa phân xử được; (4) `viddhastā sassatīsamā` ở 14.4 — dịch "tiêu vong từ muôn năm", tiền lệ duy nhất ja381:3.4 không giúp phân xử; (5) `sahassavāhano` ở 30.2 — `vāhana` giữ nghĩa chung "vật kéo xe", không thêm "ngựa"; (6) `samuyyuto` ở 33.2 — dịch "với lòng chuyên chú", hapax trong tầng đã đối chiếu; (7) `Ārati` ở 9.1 — giữ nghĩa "kiêng tránh" theo Pāli ghim, trong khi tha-ap326:6.1 song song đọc `Rati` (ưa thích); (8) `sarīraṁ satthuno` ở 32.2 — dịch "xá-lợi của bậc Đạo Sư" theo ngữ cảnh Đức Phật đã bát-niết-bàn. Các điểm này nên được người biên tập hoặc chú giải xác nhận khi có tầng tham khảo.
  Pāli không có `…`, không có `(…)`; bản Việt không có `…`. technical_integrity = 9.6 vì chưa chạy bốn lệnh còn lại: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
  Lượt cải thiện 2026-10-11 (kiểm toán độc lập theo họ vv, đọc đối kháng cả 141 khoá): đã soi các lỗi lan của họ vv — hô cách đọc thành tân ngữ (không có ở đây: `mahāpuñña` 4.1, `rājaputta` 5.3/10.3/12.4, `mahāmuni` 6.2/19.2, `isinisabha` 7.2, `kumāra` 8.2, `yasavanta` 30.3, `sujāta` 32.3 đều là hô cách và được dịch đúng là lời gọi), đảo người nói (không có: lời hỏi 1/4/7/21/27–30 và lời đáp 2–3/6/11/19/31–34 đúng người; 31.3 "ngài" là vị tỳ-kheo), nữ thiên xưng "ngài" (không áp dụng: người đáp là nam thiên Sujāta), tên vật/đá quý (`lohitaka` = hồng ngọc, `veḷuriya` = lưu ly, `rūpiya` = bạc, `muttā`/`maṇi` đúng), `pāṇātipātā viramāmi` 26.1 = "tránh sát sinh" đúng, số Pāli đã kiểm lại (năm tháng, ngàn, bảy do-tuần, thứ mười ba). Lỗi nghĩa thật tìm thấy và đã sửa: 5 khoá trên 141 (2 lỗi nghĩa/thì-đại từ, 3 lỗi diễn đạt hẹp hoặc thêm nghĩa). (1) 22.3 `Tatthāsi` là quá khứ `āsi`: "Ở đó có" → "Ở đó đã có" (đối lập thì với `parinibbuto` ở dòng sau; tầng có 7 khoá khác dùng `tatthāsi`/`tatthāsiṁ` và dịch "có", nhưng đa số là ngôi nhất `tatthāsiṁ` hoặc cảnh tả tức thời, nên không theo số đông mà theo thì của Pāli). (2) 8.2 `amhāka` = "của chúng tôi", lời vị tỳ-kheo nói với vương tử; "chúng ta" trong tiếng Việt gồm cả người nghe nên đã kéo vương tử săn bắn vào hàng ưa thích điều không hại: "chúng ta" → "chúng tôi". (3) 1.2 `olubbha` = tựa/chống vào (cùng gốc `daṇḍamolubbha` "chống gậy", 11 khoá khác trong tầng đều là "chống/tựa"), không phải "nắm": "tay nắm cây cung" → "tựa vào cây cung". (4) 1.4 `vanecaro` chỉ là "người đi rừng"; "lang thang" là nghĩa thêm: "kẻ đi săn lang thang trong rừng" → "kẻ đi săn trong rừng". (5) 4.4 `pāde pakkhālayassu te` là "hãy rửa chân của ngài" (trung thái, `te` = của ngài), không phải "rửa cho ngài": → "mà rửa chân của ngài". Điểm không đổi vì các sửa này chỉ đưa 5 khoá về đúng Pāli, không giải được bất định nào còn lại.
  Còn tồn tại, KHÔNG sửa riêng bài này vì lệch cả họ: (a) 4.2 `atho te adurāgataṁ` — `adurāgata` là "không phải đến một cách không đáng đón" (đối ứng `svāgata`), không phải "không khó nhọc"; cách dịch "chẳng có gì khó nhọc" lặp nguyên văn ở ít nhất 7 khoá trong tầng dự án (pv38:16.2, ja538:83.2, ja532:43.2, ja503:12.4, ja494:5.2, ja540:47.2, ja540:107.2), cần sửa đồng loạt chứ không riêng một tệp. (b) 0.2 `Purisavimāna` dịch "Nam Hư Không" — Pāli không có `ākāsa`; cùng lỗi với tiêu đề `Itthivimāna` "Nữ Hư Không" ở họ vv, cần sửa đồng loạt toàn bộ. (c) 8.3 `aticārā` dịch "làm quá đà" mơ hồ trong danh sách năm giới (vv24 dịch "tà hạnh"); 15.2 `suddā` dịch "thợ thuyền" lệch với "Thủ-đà-la" ở sn3.25/sn7.7; cả hai là tiền lệ chung của tầng (vv15/22/23/25/37, pv18, ja362/474/487) nên giữ để nhất quán. (d) 1.1 `daḷhadhammā` ở các bài khác (mn12:62.7, sn2.26, an4.45) là chủ ngữ "người cầm cung mạnh", còn bản này dịch "có cây cung cứng": nghĩa gần nhưng `nisārassa` vẫn chưa phân xử được (hapax), nên mô tả "mũi tên" vẫn là suy đoán đã nêu ở mục bất định (1). Không có bất định nào khác được giải; không có lỗi nghiêm trọng (đảo người nói, hô cách, phủ định, số) trong bài này. Đính chính ghi chú cũ: nhóm Pāli trùng 21.2/23.2/24.2 (tính cả khác hoa-thường) có hai bản Việt, không phải một: 23.2 thêm "là" vì câu điều kiện "Nếu Đức Phật còn tại thế, là bậc Đạo Sư…" cần mệnh đề nối, hai khoá còn lại giống nhau; hai nhóm 13.4/15.4/16.4 và 24.4/25.4 giống nhau. Chấm lại: giữ nguyên cả 10 điểm; blocker không có tầng tham khảo tiếng Anh giữ nguyên.
