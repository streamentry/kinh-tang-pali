  SỐ PĀLI — tự tính:
  - sahassa = 1000: 9.1 sahassadevarājūnaṁ = của một ngàn vị thiên vương; 9.3
    sahassacakkavattīnaṁ = của một ngàn vị Chuyển Luân Vương; 12.3 nārīsahassa = một
    ngàn người nữ.
  - 16.1 ekattiṁse = eka 1 + tiṁsa 30 = 31 kiếp (ba mươi mốt; tiền lệ 54 khoá cùng
    Pāli đều là ba mươi mốt).
  - 13.3 sattamī = thứ bảy (đêm thứ bảy); 17.1 dve = hai; 13.4 catu = bốn (bốn chân lý);
    25.1 catasso = bốn (bốn vô ngại giải); 27.1 tatiyaṁ = thứ ba.
  - Pāli không có Tiṁsakappasahassa hay bất kỳ cụm số nào chưa phân xử được. Máy kiểm
    số của kho chỉ nhận chín từ khoá đã xác lập; không từ nào trong số đó có mặt ở bài
    này, nên phép đó chạy rỗng (hiệu chuẩn OK, 0 cần, 0 đo được), không phải pass.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò toàn tầng kn đã dịch:
  - Trong 102 khoá, 62 khoá có Pāli trùng byte với một khoá khác đã dịch trong tầng
    (không tính bài này); 46/62 dùng lại đúng một bản Việt đã có; 16/62 khác dạng, hầu
