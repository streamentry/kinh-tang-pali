  - Có bản tra cứu toàn văn nguyên bài của Bhikkhu Indacanda trên SuttaCentral (giấy
    phép NOASSERTION; không phải tầng store, không căn lề theo khoá). Đã đọc để hiểu
    mạch kể và đối chiếu nghĩa chỗ khó; không chép vào bản dịch, và nó không được tính
    vào coverage hay triangulation. Bản đó dựa trên bản Buddha Jayanti nên khác văn bản
    Pāli root ở nhiều dòng (chẳng hạn 1.4, 2.3–2.4, 7.3, 13.3 và 15.2 của bài này);
    đối chiếu chỉ ở mức nội dung.
  - Bài song hành thi-ap6 (cùng mô-típ vị phu nhân xin vua một vị sa-môn) được đọc làm
    chứng cứ phụ, không thay cho bản Anh của chính uid này nên không tính vào coverage
    hay vào triangulation.

  Bốn lệnh cổng kỹ thuật của kho là npm run validate, npm test, npm run check và
  npm run build; lát này không tự chạy vì brief cấm, nên technical_integrity đặt 9.6
  chứ không phải 10 và không tuyên bố technical gate pass. Các phép kiểm tự viết đã
  chạy trên 102/102 khoá: đủ khoá và đúng thứ tự Pāli; dấu nháy và ngoặc kép khớp Pāli
  từng khoá (6 khoá Pāli có dấu mở hoặc đóng: 1.1, 2.3, 3.4, 5.1, 5.4, 25.3; 0 lệch); 2 nhóm
  Pāli trùng nguyên văn trong chính bài, 0 cặp lệch; …pe… → đúng một … ở 3/3 khoá, và
  Pāli không có … thì Việt không có; NFC, khoá rỗng, khoảng trắng thừa, chữ số lọt vào
  nội dung và Pāli lọt sang tiếng Việt (ngoài tên riêng) đều 0 lỗi. final_score là
  trung bình số học thô của đúng 10 tiêu chí.
