    nên không thêm số (quy tắc chung của phẩm: giữ số khi và chỉ khi Pāli có số).
    Trong 22 tệp thi-ap đã có (kể cả các tệp cùng đợt), tệp mà Pāli :0.3 bắt đầu bằng
    số: 7 giữ số, 6 bỏ số; 0 tệp thêm số ở chỗ Pāli không có.
  - Công thức tiêu đề: đo ở phạm vi gần nhất (các tệp thi-ap đã có, không tính bài
    này), Tuyên Ngợ 38 khoá / 19 tệp, Tuyên Ngôn 2 khoá / 1 tệp, Ký Sự 1 khoá / 1 tệp.
    Toàn phẩm tha-ap: Tuyên Ngợ 459 khoá / 241 tệp, Tuyên Ngôn 258 khoá / 132 tệp,
    Ký Sự 166 khoá / 121 tệp. Hai phạm vi cùng cho Tuyên Ngợ là đa số nên bài này giữ
    Tuyên Ngợ cho khớp; đó nhiều khả năng là lỗi chính tả của Tuyên Ngôn, và nếu người
    biên tập xác định như vậy thì cần sửa hàng loạt cả cuốn chứ không sửa riêng bài này.
  - Tên vị ni Uppaladāyikā giữ dạng Pāli (thi-ap3, 7, 10, 13, 14 cũng giữ Pāli ở cùng
