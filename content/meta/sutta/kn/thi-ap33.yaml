notes: |-
  Bài kinh thi-ap33 — Uppaladāyikātherīapadāna, bài thứ ba của Phẩm Khattiya trong
  Therīapadāna. 102/102 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào
  ngoài tập khoá Pāli. Bài kể về một người vợ của vua Aruṇa ở thành Aruṇavatī, ngồi
  nơi thanh vắng nhận ra mình chưa làm điều thiện nào để mang theo, xin vua một vị
  sa-môn, dâng món ăn thượng vị cùng dầu thơm và một tấm vải lớn; sinh lên cõi trời
  Ba mươi ba, làm hoàng hậu của một ngàn vị thiên vương và một ngàn vị Chuyển Luân
  Vương; đời cuối sinh trong dòng họ Thích-ca, xuất gia, chứng bốn chân lý rồi đắc các
  vô ngại giải.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt:
