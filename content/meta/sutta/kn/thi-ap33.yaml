  - 16.3 Duggatiṁ nābhijānāmi: tầng 425 khoá cùng Pāli; Ta không biết mình rơi vào khổ
    đau 139, Tôi không còn biết đến đọa xứ nào 97, Ta không còn biết đến đọa xứ 57, Tôi
    không còn biết đến khổ xứ 51, bất kỳ đọa xứ nào 21, Ta không hề biết đến đọa xứ 12.
    Trong thi-ap, đa số là đọa xứ nào (tôi 6 khoá, con 3 khoá) và dạng khổ đau chỉ 2 khoá
