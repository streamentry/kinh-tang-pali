    (3.4, 5.4 kết bằng nháy đơn rồi dấu chấm đúng như Pāli). Các chỗ khác thực chất:
    - 1.3 bhariyā: thi-ap6 dịch chánh hậu, thi-ap8 dịch vợ; chọn vợ (Pāli nói vợ, không
      nói chánh hậu).
    - 2.1 rahogatā nisīditvā: thi-ap6 thêm Một hôm (không có trong Pāli); bản này bỏ.
    - 6.4 paramannena: thi-ap6 dịch món cơm sữa thượng hạng (cơm sữa là suy từ chú
      giải); bản này dịch món ăn thượng vị, theo 9 khoá thượng vị, 1 khoá thượng
      hạng và 4 khoá dạng khác trong 14 khoá có paramanna. Cũng bỏ cơm sữa ở 7.1 vì Pāli chỉ nói món ăn.
    - 14.4, 16.4, 17.4, 18.4 piṇḍapātassidaṁ phalaṁ: tầng có ba dạng, mỗi dạng 1 khoá
      (đó là quả báu của việc cúng cơm khất thực; đây là quả báo của việc cúng dường một
      vắt cơm; đó là quả báo của việc cho ăn khẩu thực). Chọn đây là quả báo của món ăn
      khất thực, bám Pāli (piṇḍapātassa idaṁ phalaṁ, quả của món ăn khất thực) và không
      thêm cúng dường hay vắt cơm; dùng đúng một dạng cho cả bốn khoá.
  - Trong chính bài này có 2 nhóm Pāli trùng nguyên văn: bốn khoá piṇḍapātassidaṁ phalaṁ
    (14.4, 16.4, 17.4, 18.4) và ba khoá …pe… (23.2, 24.2, 25.2); cả hai nhóm Việt giống
    hệt nhau trong từng nhóm, 0 cặp lệch. 9.2 và 9.4 chỉ khác nhau ở dấu cuối khoá
    (; và .) nên không tính là trùng.

  NGÔI THỨ NHẤT: người kể dùng ta xuyên suốt, theo thi-ap37 và thi-ap38 liền kề và theo
