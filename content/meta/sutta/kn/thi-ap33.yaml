  - Aruṇavatī → thành phố Aruṇavatī (3 khoá cùng Pāli: Ở thành phố 2, Tại thành 1).
  - 16.1 Ekattiṁse ito kappe: tầng 54 khoá cùng Pāli, gồm Từ ba mươi mốt kiếp trước 19,
    Vào ba mươi mốt kiếp trước đây 15, Vào ba mươi mốt kiếp trước 15, Kể từ 3, Ba mươi
    mốt kiếp về trước 2. Chọn Vào ba mươi mốt kiếp trước, theo khoá cùng Pāli ở thi-ap39
