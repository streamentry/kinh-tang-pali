  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - 1.4 ekajjhaṁ cārayāmahaṁ: ekajjhaṁ là cùng một chỗ, cārayāmi là dạng sai khiến của
    car; thi-ap6 cùng Pāli dịch sống cùng một chỗ với ngài, dùng lại. Cũng có thể hiểu
    là ta cho người đưa ta đi lại; Pāli không nêu đối tượng nên giữ cách tiền lệ.
  - 2.3–2.4 Kusalaṁ me kataṁ natthi, ādāya gamiyaṁ mama: gamiyaṁ là dạng cần-làm của
    gam; ghép với ādāya thành điều phải mang theo mà đi. Song hành thi-ap6 2.3–2.4
    (ādāya gamanīyaṁ hi, kusalaṁ natthi me kataṁ) dịch hành trang mang theo khi ra đi;
    bản này giữ đúng ý đó nhưng theo thứ tự câu Pāli của khoá.
  - 4.2 pahaṁsetvāna mānasaṁ: dịch làm cho tâm hoan hỷ; không có tiền lệ trong tầng.
  - 5.2 purisānittarā ahu: ghép purisānaṁ + ittarā (ittara là thấp kém, nhỏ nhoi) nên
    dịch thấp kém hơn đàn ông; ahu là thì quá khứ nhưng ở đây nêu tình trạng chung nên
    không thêm đã từng. Chưa có tiền lệ để đối chiếu (0 khoá cùng Pāli); cần xem lại.
  - 5.4 bhojayissāmi: dịch thiếp sẽ cúng dường thức ăn (đối tượng là vị sa-môn ở 5.3;
    Pāli không nêu tân ngữ). thi-ap6 dùng để thiếp được cúng dường thức ăn; bỏ chữ để vì
    Pāli là động từ tương lai chia ngôi, không phải mệnh đề mục đích.
  - 6.1–6.4: samaṇaṁ (6.2) là tân ngữ của adāsi (6.1); tân ngữ của gahetvāna là pattaṁ
    (6.3). Bản Việt giữ đúng ranh giới khoá, 6.1 kết ở ban cho ta và 6.2 mở bằng một vị
    sa-môn.
  - 7.2 sugandhalepanaṁ: lepana là điều dùng để thoa; dịch dầu thơm để thoa, không
    nói thoa lên ai hay ở đâu vì Pāli không nêu.
  - 7.3 mahācelena chāditvā: ghép mahā + cela (vải); dịch tấm vải lớn. Bản tra cứu toàn
    văn nguyên bài ghi thêm giá trị một ngàn (đặc điểm của một dị bản); root Pāli của
    bài không có, nên không đưa vào.
  - 10.3–10.4: nānāvidhaṁ bahuṁ aññaṁ, tassa kammaphalaṁ tato là hai nửa của một câu;
    tato có thể là từ đó hay rồi sau đó; dịch từ đó mà có để giữ tính chất là quả.
  - 11.3 itthisabbaṅgasampannā: sabbaṅga là mọi chi phần; không giới hạn thêm là nét đẹp.
  - 12.3–12.4 nārīsahassapāmokkhā suddhodanasutassahaṁ: sutassa là cách sở hữu (của con
    trai Suddhodana), ahaṁ là chủ ngữ; Pāli không nêu rõ quan hệ (vợ), nên bản Việt
    cũng không nêu.
  - 13.3 sattamīrattisampattā: sampattā là đến, đạt tới; dịch khi đã đến đêm thứ bảy.
    Bản tra cứu toàn văn nguyên bài (dựa trên Buddha Jayanti) có ghi dạng khác theo
    hướng chưa đến; root Pāli đã ghim ghi sampattā nên theo root, không theo dị bản.
  - 15.2 sarase: dạng ngôi thứ hai số ít (Ngài nhớ); dịch bạch bậc Mâu-ni, Ngài nhớ,
    không thêm xin hay dấu hỏi vì Pāli không có.
  - 15.4 paricattaṁ bahuṁ mayā: paricatta là xả bỏ, từ bỏ; dịch ta đã xả bỏ rất nhiều,
    không nói xả bỏ cái gì.
  - 17.1–18.3: pajānāmi (biết) và na jānāmi (không biết) đối ứng nhau; Pāli có ngụ ý
    chỉ có hai cảnh giới và chỉ có gia tộc cao sang, nhưng không có từ chỉ; bản Việt giữ
    nguyên văn biết / không biết, không thêm chỉ.
  - 18.1 ucce kule pajānāmi: ucce kule ở cách vị trí; dịch Ta biết gia tộc cao sang theo
    nghĩa tham chiếu, không thêm sinh vào.
  - 19.4 somanassakataṁ phalaṁ: hợp từ somanassa + kata, dịch quả của việc đã làm với
    tâm hoan hỷ; kata có thể là đã làm hoặc đã tạo ra.
  - 26.1 bhagavato sammukhā: có thêm trước mặt Đức Thế Tôn, khác thi-ap37/38 (không có
    ở Pāli của hai bài đó); giữ đúng Pāli của bài này.

