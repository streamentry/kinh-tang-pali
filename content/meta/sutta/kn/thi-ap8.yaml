notes: |-
  Bản dịch tiếng Việt mới cho bài thi-ap8 — trưởng lão ni Sattuppalamālikā, bài thứ tám trong Sumedhāvagga. 82/82 khoá, thứ tự khoá theo Pāli.

  Nội dung: tiền kiếp là vợ của vua Aruṇa ở thành Aruṇavatī, bà cầm bảy vòng hoa sen xanh hương trời, nghĩ rằng thà dâng lên trí tuệ của bậc Phật tối thượng còn hơn đội trên đầu; chờ ở cửa, thấy Đức Phật cùng Tăng chúng đi trên đường phố, bà mở cửa và dâng hoa; bảy bông sen xanh vây quanh giữa không trung, tạo thành tấm che trên đầu Ngài. Quả báo: sinh lên cõi trời Ba mươi ba, có tấm che mahānela trên đầu, tỏa hương trời, giữ ngôi hoàng hậu của bảy mươi vị thiên vương và sáu mươi ba vị Chuyển Luân Vương; ba mươi mốt kiếp trước đây bà không còn biết đến đọa xứ, nay các lậu hoặc đã cạn.

  TIÊU ĐỀ VÀ SỐ THỨ TỰ: Pāli `:0.3` là `Sattuppalamālikātherīapadāna` — không bắt đầu bằng số nên bản Việt không đặt số thứ tự; `translationTitle` bằng đúng giá trị `:0.3` của bản Việt. Công thức đầu tiêu đề dùng `Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni`: ở phạm vi gần nhất (14 tệp thi-ap đã có trong tầng) dạng này đứng 12 so với `Tuyên Ngôn` 1, một tệp còn là bản chép Pāli chưa dịch; toàn tầng tha-ap + thi-ap là `Tuyên Ngợ` 221 + 12 (cùng 9 tệp `Tuyên Ngợi`) so với `Tuyên Ngôn` 115 và `Ký Sự` 99. Hai phạm vi cho cùng một đa số, nhưng `Ngợ` rất có thể là chính tả sai của `Ngôn`; ghi để biên tập phán một lượt cho cả cuốn, bài này không tự đổi. Tên Sattuppalamālikā giữ nguyên Pāli (tương tự Kaṭacchubhikkhādāyikā ở thi-ap7).

  DẤU NHÁY: Pāli mở `“` ở `1.1`, đóng `”` ở `20.3`; lời tự nhủ mở `‘` ở `3.1`, đóng `’` ở `3.4`; lời hứa mở `‘` ở `4.3`, đóng `’` ở `4.4`. Bản Việt khớp Pāli từng khoá (82/82 khoá, 0 lệch).

  SỐ PĀLI: `Sattatidevarājūnaṁ` (11.1) = satta 7 + ti + `devarājūnaṁ`, đọc `sattati` = 70, tức bảy mươi vị thiên vương (cùng cấu tạo với `Tiṁsānaṁ devarājūnaṁ` ở thi-ap6, `Paññāsaṁ devarājūnaṁ` ở thi-ap10; `Tesattati` = 73 ở tha-ap62, tha-ap244). `Tesaṭṭhi` (12.1) = te 3 + saṭṭhi 60 = 63 (cùng tha-ap80, tha-ap219, tha-ap273 đều dịch sáu mươi ba kiếp). `Ekatiṁse ito kappe` (17.1) = eka 1 + tiṁsa 30 = 31, ba mươi mốt kiếp (22 khoá cùng Pāli ở tầng đều dịch ba mươi mốt). Mọi số khác (bảy vòng hoa, bảy bông sen) là `satta` = 7.

  CHỖ DỊCH THEO TẦNG MÀ CÓ LÝ DO LỆCH:
  - `mahesittamakārayiṁ` (11.2, 12.2) dịch `tôi đã giữ ngôi hoàng hậu`, theo thi-ap10:5.2 và 5.4. Tầng còn có cách `tôi đã tôn vinh Đại Ẩn Sĩ` ở thi-ap5:4.2, 4.4, thi-ap16:4.2, 5.2 (bốn khoá) và thi-ap7:3.4, 4.2 (hai khoá, lời Đức Phật tiên tri), tức sáu khoá so với hai khoá. Tôi không theo đa số vì `mahesittaṁ` là danh từ trung tính chỉ ngôi vị hoàng hậu (mahesī + tta), còn `mahesi` (Đại Ẩn Sĩ) không thể làm tân ngữ của `kar-` như thế; và cụm `Sattatidevarājūnaṁ mahesittamakārayiṁ` (đối với bảy mươi vị thiên vương) không đọc được là tôn vinh một vị Đại Ẩn Sĩ. Bản nháp theo đa số sẽ cho câu vô nghĩa. Đề nghị biên tập rà sáu khoá kia một lượt; bài này không sửa chúng.
  - `vedajātā` (8.2) dịch `niềm hân hoan sinh khởi`; thi-ap5:2.2 dùng `với lòng kính trọng` (hai khoá cùng Pāli). `veda` là hỷ/phấn khởi, không có nghĩa kính trọng; tầng còn có bốn khoá dịch theo hướng hân hoan/xúc động. Lệch tiền lệ trực tiếp có chủ ý.
  - `bhariyā` (1.3) dịch `vợ`, không dịch `chánh hậu` như thi-ap6:1.3: `mahesī`/`mahesitta` mới là ngôi hậu, `bhariyā` chỉ là vợ.
  - `iddhipāda` dịch `như ý túc`: 57 tệp so với `thần túc` 12 tệp trong tầng.
  - `buddhapūjāyidaṁ phalaṁ`: ít nhất 75 khoá cùng Pāli ở tầng, dạng `đây là quả báo của việc cúng dường Đức Phật` đứng 46, `đó là …` 18, `đó là … của sự …` 11; ở phạm vi thi-ap (các vế kết `phalaṁ`) `đó là` 4, `đó chính là` 4, `đây là` 2. Hai phạm vi cho hai đa số khác nhau; bài này theo khoá trùng nguyên văn (46) để cả bốn khoá 13.4, 14.4, 15.4, 17.4 giống nhau.
  - Đại từ ngôi thứ nhất: `tôi` (thi-ap5, 6, 7, 10 dùng `tôi`; thi-ap12 dùng `con`).
  - Công thức kết `Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti` (21.1): dịch `đã nói những bài kệ này` (số nhiều, đúng `imā gāthāyo`), theo nhóm đa số của tầng (407 khoá), không theo nhóm `đã từng nói bài kệ này`.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - `1.4` `vāritaṁ vārayāmahaṁ`: không có tiền lệ trong tầng (0 khoá). Dịch sát chữ `tôi ngăn giữ điều đã bị ngăn cấm`. Cách hiểu cụ thể (ngăn việc gì, ngăn ai) không xác lập được từ Pāli đã ghim; không thêm nội dung nào.
  - `3.3`–`3.4` `Varaṁ me buddhaseṭṭhassa ñāṇamhi abhiropitaṁ`: `ñāṇamhi` ở vị trí cách nơi chốn; tầng có hai khoá `ñāṇamhi` (tha-ap134:4.1, tha-ap138:3.3) cho hai cách hiểu khác nhau. Dịch `tốt hơn là nơi bậc Phật tối thượng, điều được dâng lên trí tuệ của Ngài`; cấu trúc câu Pāli có chủ ngữ ngầm, đọc ít giả định nhất.
  - `5.1` `Kakudho vilasantova`: `kakudha` được dịch ba cách trong tầng (`ngọn núi thiêng`, `đỉnh núi`, `cây kakudha nở hoa`; các khoá cùng dạng `Kakudhaṁ vilasantaṁva` ở tha-ap126 và tha-ap515, không có đa số rõ). Bài này giữ `cây kakudha` (Terminalia arjuna theo từ điển), không tuyên bố đã phân xử.
  - `9.1`, `10.4` `mahānela`: nghĩa chưa xác lập được (không có tiền lệ trong tầng; `Mahānelasa` ở tha-ap185:5.2 là tên người). Giữ nguyên Pāli làm danh từ, không bịa nghĩa; `chādanaṁ` dịch `tấm che`.
  - `2.4` `cintesi`: dạng ngôi thứ ba về mặt hình thức nhưng ngữ cảnh là lời kể ngôi thứ nhất (`mama muddhani`, `ahuṁ`); dịch `tôi nghĩ`, đây là cách đọc ít giả định nhất.
  - `7.4`, `9.2` `dhārayanti/dhārenti` chủ ngữ: `7.4` là chính bảy bông sen (`te`); `9.2` không nêu chủ ngữ nên dịch bị động.
  - `10.3`–`10.4`: `Yāvatā … mahānelaṁ dharīyati` dịch theo tương quan `tới đâu … tới đó`, hàm ý của cấu trúc `yāvatā`, không phải chữ thêm.
  - `12.4` `ādeyyavacanā` dịch `lời nói của tôi đã được chấp nhận`; không có tiền lệ.
  - `15.2` `samādhijhānagocarā` dịch `lấy định và thiền làm cảnh giới` (`gocara` là cảnh giới/lãnh vực; tầng có cả `cảnh giới` lẫn `lãnh vực`).
  - `…pe…` ở 18.2, 19.2, 20.2 giữ đúng MỘT `…` mỗi khoá; Pāli bài này không có `(…)` trần.

  ĐỐI SOÁT: tập khoá Việt khớp Pāli 82/82; nháy `“”‘’` khớp Pāli từng khoá, 0 lệch trên 82 khoá; `…` khớp 3/3 khoá; 3 nhóm Pāli trùng nguyên văn trong bài (11.2=12.2; 13.4=14.4=15.4=17.4; 18.2=19.2=20.2) bản Việt đều giống nhau, 0 nhóm khác; NFC, 0 khoá rỗng, 0 khoảng trắng thừa; Pāli lọt sang Việt chỉ là tên riêng `Therīapadāna`, `Sattuppalamālikā` và danh từ `mahānela`/`kakudha` đã nêu trên. Đã in đủ 82 cặp Pāli và Việt ra đọc đối chiếu.

  COVERAGE ENGLISH: mẫu số rất nhỏ vì mỗi vế kệ chỉ 18–26 ký tự, dưới ngưỡng 40 của `source/layers.yaml`; Sujato phủ 0 khoá (thân bài), `english-project` không có entry, `vietnamese-current` không phủ bài này. Cổng coverage không đo được gì, và bài không đối chiếu English cho bất kỳ khoá nào.

  CỔNG KỸ THUẬT: bài này dịch trong môi trường bị cấm chạy cổng; `technical_integrity` đặt 9.6 chứ không phải 10. Bốn lệnh còn lại phải chạy trước khi gộp: `npm run validate`, `npm test`, `npm run check` và `npm run build`. `final_score` là trung bình số học thô của đúng 10 tiêu chí.
