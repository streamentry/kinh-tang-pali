notes: |-
  **Phạm vi: đủ 545/545 khoá của mnd9, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải kinh `snp4.9` (Māgaṇḍiyasutta, Kinh Māgaṇḍiya), thuộc phẩm Aṭṭhakavagga. Cấu trúc như `mnd4`, `mnd5`, `mnd8`, `mnd12`: dẫn từng đoạn kệ (13 đoạn kệ in đậm ở `2`, `7`, `8`, `21`, `28`, `40`, `49`, `57`, `62`, `69`, `89`, `102`, `111`; đoạn `7` là lời Māgaṇḍiya hỏi, không có phần giải), giải từng cụm, rồi nhắc lại cả đoạn kệ trong nháy kép (12 lần: `6`, `20`, `27`, `39`, `48`, `56`, `61`, `68`, `88`, `101`, `110`, `117`). Lời dẫn nhập: 10 lần *Vì thế, Đức Thế Tôn đã nói—* (`5`, `19`, `38`, `55`, `60`, `67`, `87`, `100`, `109`, `116`) và 2 lần *Vì thế, vị Bà-la-môn ấy đã nói—* (`26`, `47`). Đoạn `70`–`86` là cuộc đối thoại Hāliddakāni – Mahākaccāna chú giải câu kệ `69` (song song `sn22.3`); `92` trích kệ của Sabhiyasutta (`snp3.6`), `104` trích kệ `Vedāni viceyya` (cũng `snp3.6`). Pāli có 159 khoá mang thẻ in đậm, bản Việt không mang thẻ. Dấu lược `…`: 66 khoá (30 khoá có `…pe…`, đều thành đúng một `…`; 36 khoá có `…` trần), mỗi khoá giữ đúng số dấu của Pāli, trong đó `18.2` và `36.2` có 19 dấu, `37.5` có 31, `98.11` có 30, `115.5` có 5; 0 khoá có `(…)`; 1 khoá Pāli kết `….` là `42.1` nên bản Việt kết ` ….`. Nháy: Pāli có 35 khoá chứa “ và 35 khoá chứa ”, 8 khoá chứa ‘ và 8 khoá chứa ’, 12 khoá chứa ngoặc đơn; bản Việt khớp Pāli từng khoá (0/545 lệch, cả bốn loại nháy và ngoặc đơn).

  **Tên bài.** `0.1`, `0.2`, `0.3`, `1.1`, `118.1` theo `mnd4`, `mnd5`, `mnd8` (*Đại Tập Kể Lược*, *Kể Lược Phẩm Tám Kệ*, *Giờ đây, sẽ nói phần Kể Lược Kinh …—*, *Kể Lược Kinh …, thứ …*); tên kinh *Kinh Māgaṇḍiya* theo `snp4.9:0.2`.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd9`: thư mục `kn` của tầng Anh đã ghim chỉ có cp 35, dhp 26, iti 112, ja 83, kp 9, snp 73, thag 264, thig 73, ud 80 (755 tệp); manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho `mnd9`; tệp `mnd9_translation-en-sujato.json` không tồn tại. Lớp `english-project` không có `mnd9`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **197** khoá (218 nếu đếm cả thẻ); Sujato phủ 0/197, `english-project` 0/197, `vietnamese-current` 0/197. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.9` (bài kệ mà bài này chú giải) có trong tầng đã ghim nhưng là bản của **bài khác**, nên không tính là đối chiếu English của mnd9; chỉ dùng để đọc cú pháp của chính các dòng kệ. Chứng cứ độc lập còn lại là các bản Việt đã dịch: `snp4.9`, `snp3.6`, `sn22.3`, `mn14`, `mn72`, `mn89`, `mn117`, `dn1`, `dn2`, `dn15`, `an9.11`, `ud6.8`, `mil6.4.2`, `mnd4`, `mnd5`, `mnd7`, `mnd8`, `mnd12`, `cnd5`, `cnd6`, `cnd7`, `cnd9`–`cnd16`, `cnd18`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: 188 khoá có tiền lệ, dùng lại nguyên văn 127, khác 61 (bỏ dấu câu và chữ hoa/thường: 256 khoá có tiền lệ, dùng lại 167, khác 89). Nguồn dùng lại nguyên văn, đếm theo khoá của bài này: `sn22.3` 44 khoá (đoạn Hāliddakāni `70`–`86` và các dòng kệ `71`, `85`, `88`), `snp4.9` 40, `cnd5` 12 (lời dẫn *Vì thế, Đức Thế Tôn đã nói—* và *Vì thế, vị Bà-la-môn ấy đã nói—*), `mnd4` 6 (`0.1`, `0.2`, `103.2`, `104.1`, `104.3`, `104.5`), `cnd6` 5, `mnd7` 4, `snp3.6` 4, `mnd5` 2, `cnd14` 2, `cnd9` 2, `cnd7` 2, `mnd8` 1 (`58.3`), `cnd15` 1, `cnd12` 1, `ud6.8` 1 (`114.5`). 61 khoá Pāli trùng mà bản Việt khác, kèm lý do:
      - `2.2`, `2.3`, `6.1`–`6.3`, `7.3`, `20.1`, `57.1`, `57.2`, `57.4`, `61.1`, `61.2`, `62.1`, `62.2`, `62.4`, `68.2`, `39.1`, `48.1` (18 khoá): dòng Việt của `snp4.9` bị xếp lệch so với dòng Pāli cùng khoá (ví dụ `snp4.9:1.2` Pāli `Nāhosi chando api methunasmiṁ;` nhưng Việt là *bất lạc và tham đắm,* thuộc dòng 1) hoặc mang nháy đơn lồng khi Pāli không có nháy; bài này căn lại theo từng dòng Pāli, giữ chữ của `snp4.9` ở những chỗ dòng khớp; thêm *vị ấy* ở `62.2`, `62.4`, `68.2` vì Pāli có `so`, `sa`; `7.1` dùng *ngài* thay *ngươi* vì Māgaṇḍiya nói với Đức Thế Tôn (như `snp4.9:4.3`);
      - `28.3`–`28.5`, `39.3`–`39.5`, `40.3`–`40.5`, `48.3`–`48.5` (12 khoá): `snp4.9:5.3`, `5.5` dịch `sīlabbata` và `abbatā` là *giới cấm thủ*; lời giải `31.2`–`31.4` tách `sīlabbata` thành giới + khổ hạnh, `32.9`–`32.13` coi giới và khổ hạnh (tám hạnh đầu-đà) là điều *cần có*, nên đây không thể là *giới cấm thủ* (`sīlabbataparāmāsa` ở `103.5` dịch *giới cấm thủ*, 9/9 khoá toàn mnd/cnd); dịch *giới và khổ hạnh*; `28.4`, `28.5` dịch sát chữ *cũng không do không có kiến … cũng không do điều ấy* (xem bất định 1);
      - `28.1`, `29.1`, `29.6` (3 khoá): trùng `cnd11:7.1`, `8.1`, `8.5` *Không phải do kiến, không phải do nghe, không phải do trí*, nhưng ở đó dòng này bổ nghĩa cho `muni`, còn ở đây chi phối `na suddhimāha` ⇒ dịch *Không nói thanh tịnh là nhờ kiến, nhờ nghe, nhờ trí*;
      - `8.3`, `11.1`, `11.6`, `20.3` (4 khoá): `dhammesu niccheyya samuggahītaṁ` đọc phủ định (*không có điều nào được nắm giữ sau khi quyết định giữa các pháp*) như `snp4.9:3.3`, vì đứng sau `na tassa hoti` ở `8.1` và lời giải `11.4`–`11.5` có `natthi` (*thì không có …*); khác `mnd5:38.1`, `38.5` và `snp4.3:6.2`, `snp4.13:13.2` (đọc không phủ định, vì ở đó phủ định nằm ở dòng trước);
      - `21.4`, `27.4` (2 khoá): bỏ nháy đơn của `snp4.9:4.4` (Pāli không nháy), dịch `iti` là *gọi là*;
      - `57.3`, `61.3` (2 khoá): `tīsu vidhāsu` → *ba loại phân biệt* theo `dn33:1.10.48` (khác `snp4.9:8.3` *ba phân biệt* và `sn1.20:23.3` *ba cách phân biệt*);
      - `69.4` (1 khoá): `snp4.9:10.4` dịch `kathaṁ` là *sao còn*; lời giải `83.1`–`84.5` (`kathaṁ viggayha janena kattā hoti`) và `sn22.3:2.4` hiểu là *lời nói* ⇒ *chẳng nói lời tranh cãi với người đời* (cũng dùng ở `71.4`, `85.4`, `88.4`);
      - `89.1`, `89.2`, `101.2` (3 khoá): `vivitto` + tác cách là *tách biệt khỏi* (lời giải `90.3` *ritto vivitto pavivitto … khỏi ác hạnh về thân*, theo `mnd7:77.2`), không phải *nhờ đó* như `snp4.9:11.1`; thêm *những pháp ấy* cho `tāni`, *sẽ* cho thức optative `vicareyya`, `vadeyya`;
      - `92.1` (1 khoá): `snp3.6:22.1` *điều ác*; ở đây lời giải `91.2`–`91.8` chơi chữ `āguṁ na karoti` ⇒ *điều tội lỗi* như `cnd16:6.3`; `92.5` cho `nāgo` giữ *nāga* như `cnd16:6.3`, còn các dòng kệ `89.2`, `101.2` giữ *bậc long tượng* của `snp4.9:11.2`;
      - `102.1`, `102.2`, `102.4`, `110.2` (4 khoá): `vedagū` → *bậc đạt minh* (như `mnd4:40.5`, `41.5`; lời giải `103.4` giải `veda` là trí, tuệ trong bốn đạo), khác `snp4.9:12.1` *đạt Vệ-đà*; `mutiyā` → *điều đã nhận thức* (như `mnd5:41.1`; 29/29 khoá mnd/cnd có `muta`), khác *tưởng* (vì `saññā` ở `111.1`–`114.2` là *tưởng*); `nivesana` → *chỗ trú ngụ* (`mnd5:37.1`–`40.3`; 11/20 khoá mnd/cnd/snp, so với *trú xứ* 2/20), khác `snp4.9:12.4`; `102.2` và `110.2` tách `sa mānameti na hi tammayo so` thành *mà đi đến ngã mạn, vì vị ấy không do điều ấy mà thành* để khớp `106.3`;
      - `117.4` (1 khoá): `ghaṭṭayantā` → *gây va chạm*, khác `snp4.9:13.4` *gây xung đột*, vì lời giải `114.2`–`115.5` giải `ghaṭṭenti` là va chạm và `viggaha` đã dịch *xung đột* (22/23 khoá mnd/cnd, ở `58.2`, `66.2`, `115.1`); `vicaranti` → *du hành* theo `90.7`;
      - `64.3`, `64.4`, `66.3`, `66.4`, `115.2`, `115.3` (6 khoá): `mnd12:10.3`, `10.4`, `40.3`, `40.4`, `111.6`, `111.7` dịch *Ông không hiểu pháp và luật này … hoặc hãy tự gỡ ra, nếu ông có thể!*; bài này dùng *Ông không biết Pháp và Luật này … hoặc hãy tự gỡ ra nếu ông có thể!* để khớp nguyên văn đầy đủ ở `58.3` (trùng `mnd8:59.2`; cùng dạng `dn1:1.18.2`, `dn2:53.2`) và `83.3`, `84.3`, `84.4` trong chính bài; đo cụm *Ông không biết/hiểu Pháp và Luật này*: *biết* 3 khoá (`dn1`, `dn2`, `mnd8`), *hiểu* 7 khoá (`mnd12:10.3`, `40.3`, `111.6`, `sn22.3:14.3`, `15.3`, `dn33:1.6.3`, `mn104:2.3`), cần người biên tập thống nhất;
      - `81.5`, `81.6`, `82.5`, `82.6` (4 khoá): `mn132:6.3`, `6.4` dịch *mong rằng tôi sẽ có tưởng như vậy …*; ở đây cả cụm `81.3`–`81.7` theo `sn22.3:12.3` (*Mong rằng trong tương lai, ta có sắc như thế này …*) với ngôi *ta*.
      Đã dò **66 nhóm Pāli trùng nguyên byte trong chính bài** (112 khoá lặp thêm): 3 nhóm có bản Việt khác, đều có lý do: `29.5`/`41.5` và `31.4`/`43.4` (cùng Pāli `nāha na kathesi na bhaṇasi na dīpayasi na voharasi`; `29`, `31` là lời giải kệ của Đức Thế Tôn nên để vô chủ ngữ, `41`, `43` là lời Māgaṇḍiya nói với Đức Thế Tôn nên dùng *ngài*, xem bất định 4), và `46.4`/`63.5` (cùng `“asassato loko …pe…`, khác khung câu: `46` là *nhờ kiến rằng “…”, tin vào …*, `63` là *về điều “…”, vị Bà-la-môn còn nói gì …*). Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 92 nhóm (168 khoá lặp thêm), 5 nhóm có bản Việt khác ngoài dấu câu: ba nhóm trên và hai nhóm chỉ khác chức năng (dòng chú thích người nói trong ngoặc *(Đức Thế Tôn nói với Māgaṇḍiya)*, *(Māgaṇḍiya nói)* so với câu đóng lời giải *này Māgaṇḍiya, Đức Thế Tôn nói.*, *Māgaṇḍiya nói như vậy.*).

  **Thuật ngữ, kèm số đếm.** `diṭṭhigata` → *kiến chấp* (47/51 khoá mnd/cnd); `ādīnava` → *nguy hại* (17/21 khoá mnd/cnd, 47/54 khi thêm snp, ne, mil, so với *tai họa* 5/21 và 6/54); `dvāsaṭṭhi diṭṭhigatāni` → *sáu mươi hai kiến chấp* (`mnd5:31.2`, `50.2`, `cnd6:21.2`); `suddhi visuddhi parisuddhi mutti vimutti parimutti` → *thanh tịnh, thanh tịnh hoàn toàn, thanh tịnh trọn vẹn, giải thoát, giải thoát hoàn toàn, giải thoát trọn vẹn* và `vadanti kathenti bhaṇanti dīpayanti voharanti` → *nói, thuyết, tuyên bố, làm sáng tỏ, diễn đạt* theo `mnd8:3.2` (`mnd4` dùng *trình bày, gọi* ở `4:25.2`, `mnd5:5.10`); `kalaha bhaṇḍana viggaha vivāda medhaga` → *cãi vã, tranh chấp, xung đột, tranh luận, tranh cãi* và `kareyya`/`karonti` → *gây …* theo `mnd8:59.1` (4 khoá); `ghaṭṭeti` → *va chạm* (7 trong 14 khoá mnd/cnd có `ghaṭṭ`); `taṇhā` → *tham ái* (212/238 khoá mnd/cnd có `taṇh`; `sn22.3:5.2` dịch *khát ái* nhưng ở `74.2`, `74.7` giữ *tham ái* cho cả bài; tên người con gái của Ma vương `Taṇhā` → *Khát Ái* theo `snp4.9:1.1`, viết hoa cả ba tên *Khát Ái, Bất Lạc, Tham Đắm* vì lời giải `3.2` nói `māradhītaro`); `māno` → *ngã mạn* (18/27 khoá mnd/cnd có `mān`), `omāno` → *hạ mạn* (0 tiền lệ); `pariḷāha` → *nóng bức* trong các danh sách `sabbapariḷāhānaṁ` (`cnd9:43.2`, `mnd7:77.25`; 13 khoá mnd/cnd), *nhiệt não* ở `79.2`, `80.2` theo `sn22.3:10.2` (79 khoá toàn tầng), *nóng bỏng* ở công thức `sapariḷāhaṁ` của `13.1`, `14.1` theo `mn72:14.1` (cả ba chỗ là ba bối cảnh khác nhau); các danh sách `kodha upanāha makkha paḷāsa issā macchariya māyā sāṭheyya thambha sārambha māna atimāna mada pamāda` → *giận dữ, hằn học, gièm pha, hơn thua, ganh tị, keo kiệt, giả dối, xảo trá, bướng bỉnh, hung hăng, ngã mạn, ngạo mạn, tự mãn, phóng dật* theo `cnd9:43.1`–`43.2`, `mnd7:77.8`–`77.21`; `ucchinnamūlā tālāvatthukatā anabhāvaṅkatā āyatiṁ anuppādadhammā` → *cắt tận gốc rễ, làm thành như gốc cây thốt nốt bị chặt, làm cho không còn hiện hữu, khiến không thể sinh khởi trong tương lai* theo `mnd4:26.3`, `cnd11:53.10`, `mn72:20.5` (19 khoá, so với dạng *làm như gốc chà là* của `sn22.3:5.2` ở nhóm khoảng 17 + 14 khoá); dùng một dạng cho cả bài kể cả `74.2`, `74.7`, `76.2`, `76.8`; `pahīnaṁ samucchinnaṁ vūpasantaṁ paṭipassaddhaṁ abhabbuppattikaṁ ñāṇagginā daḍḍhaṁ` theo `mnd5:38.4`; `sīla`/`vata`/`sīlabbata` → *giới luật*/*khổ hạnh*/*giới và khổ hạnh* (`mnd5:51.7`; `cnd11` dùng *giới và hạnh*, 10 khoá), còn `sīlabbataparāmāso` → *giới cấm thủ* (9/9); `vedagū` → *bậc đạt minh* (3 khoá, so với *đạt Vệ-đà* 6 và *bậc minh triết* 2 trong 15 khoá mnd/cnd/snp có `vedagū`); `nāgo` → *bậc long tượng* ở dòng kệ (`snp4.9:11.2`, `cnd16:6.1`) và *nāga* ở lời chơi chữ (`cnd16:6.2`–`6.3`); `muta` → *nhận thức* (29/29); `nivesana` → *chỗ trú ngụ* (11/20); `oka` → *trú xứ* (`sn22.3`); `upāyupādānā` → *cầu cạnh, chấp thủ* (`sn22.3:5.2`), `upayā` → *cầu cạnh* ở `108.2`–`108.7`; `kaṇhapakkhikā dhammā` → *pháp thuộc phía đen tối*: 0 tiền lệ (`cnd7:6.2` dịch `akusalapakkhikā` *thuộc về phía bất thiện*); `atammayatā` → *tính không bị tác thành bởi* (`mn113`, 6 khoá); `sādiyati` → *chấp nhận* ở `cnd9:4.1` nhưng ở `4.5` dịch *ưng thuận* cho dễ đọc trong chuỗi 5 động từ; `abhijappati` → *thầm cầu* (`cnd15:4.8`, `cnd16:5.8`); `patthayati`, `pihayati` → *ước muốn*, *khao khát* (`cnd15:4.8`); `gaṇhāti parāmasati abhinivisati` → *nắm giữ, bám víu, chấp trước* (`mnd4:38.4`); `ñāṇī vibhāvī medhāvī` → *hiểu biết, thông tuệ, thông minh* (`cnd13:16.2`); `paṇḍita paññavā buddhimā` → *có trí, có tuệ, sáng suốt*; `dhīra` → *bậc kiên định* (`snp4.9:4.5`).

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `dvāsaṭṭhi` = dve 2 + saṭṭhi 60 = 62 → *sáu mươi hai* (`11.2`, `22.2`, `24.2`, `105.1`: 4/4); `tisso vidhā`, `tīsu vidhāsu` = 3 → *ba loại phân biệt* (`57.3`, `59.1`, `59.2` hai lần, `59.4`, `61.3`: 6/6); `dasavatthukā sammādiṭṭhi` = 10 → *mười cơ sở* (`32.3`, 10/10 mục ở `32.4`: bố thí, cúng tế, lễ vật, quả của nghiệp, đời này, đời sau, mẹ, cha, hóa sinh, sa-môn bà-la-môn); `sattannaṁ dhammānaṁ` = 7 → *bảy pháp* (`63.2`, `103.5`: 2/2); `dve` = 2 → *hai* (`37.1`, `99.2`, `99.7`, `108.2`: 4/4, mỗi chỗ đủ 2 mục); `aṭṭha dhutaṅgāni` = 8 → *tám hạnh đầu-đà* (`32.12`, 8/8 mục ở `32.13`); `catūsu maggesu` = 4 → *bốn đạo* (`103.4`); bốn đạo `sotāpatti sakadāgāmi anāgāmi arahatta` (`95.3`–`95.6`: 4/4); `navamo` = 9 → *thứ chín* (`118.1`; `0.3` ghi *9.*). Danh sách: `18.2`, `36.2` 23/23 mục (tham, sân, si, giận dữ … mọi hành tạo tác bất thiện); `32.6` 10/10 (lời từ người khác + chín thể loại kinh); `32.8` 4/4 loại trí; `37.5`, `98.11` 6 căn/trần … `ekavokāra`, `catuvokāra`, `pañcavokāra` → *một uẩn, bốn uẩn, năm uẩn* (`37.5` 31 dấu lược, `98.11` 30 dấu lược); `94.3` 12 mục (4 thiên vị + 8 sức chi phối) và 4 động từ *dẫn đi, đưa đi, cuốn đi, mang đi*; `98.5` 8/8 mục `-vādo`; `114.3` 13/13 cặp tranh cãi (vua, Sát-đế-lợi, Bà-la-môn, gia chủ; mẹ–con, con–mẹ, cha–con, con–cha; anh em trai–anh em trai, chị em gái–chị em gái, anh em trai–chị em gái, chị em gái–anh em trai; bạn bè); `65.2` 3/3 loại mạn. Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
      1. `28.4`, `28.5`, `32.1`, `33.1`, `33.4`, `39.4`, `39.5`, `40.4`, `40.5`, `44.1`, `44.3`, `48.4`, `48.5` `adiṭṭhiyā assutiyā añāṇā, asīlatā abbatā nopi tena`: dịch sát chữ *cũng không do không có kiến, không có nghe, không có trí, không có giới, không có khổ hạnh; cũng không do điều ấy*; lời giải `33.2` hiểu là *không phải chỉ nhờ … mà đạt đến an tịnh nội tâm; cũng không phải không có những pháp này*, nên `nopi tena` có thể là *cũng không chỉ nhờ vậy*; `snp4.9:5.4`–`5.5` bỏ `nopi tena`; 0 tiền lệ cho `nopi tena`.
