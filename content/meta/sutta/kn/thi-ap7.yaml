notes: |-

  Bản dịch tiếng Việt mới cho bài kinh thi-ap7 — trưởng lão nữ Kaṭacchubhikkhādāyikā, bài
  thứ bảy trong Sumedhāvagga.

  Tiền kiếp: lúc đi khất thực, tôi lấy lời dạy của vị đạo sư tên ấy, dâng cho vị tỳ-kheo-ni
  tên Kaṭacchu và dâng cho Đấng Tối Thượng Trong Các Phật. Đức Chánh Đẳng Giác, vị giáo chủ
  của ba cõi, bậc đạo sư vững trên con đường, đã tiếp nhận và làm cho lòng cảm tạ của ta
  không còn điểm dứt. Ngài dạy: sau khi trao cho vị tỳ-kheo-ni Kaṭacchu, ngươi sẽ đi đến
  cõi trời Ba mươi ba; chư thiên Ba Mươi Ba sẽ tôn vinh làm Đại Ẩn Sĩ, và năm mươi vị
  Chuyển Luân Vương cũng sẽ tôn vinh làm Đại Ẩn Sĩ; điều tâm ngươi đã hạnh nguyện đều sẽ
  được đầy đủ. Khi đã thọ hưởng sự thành tựu ấy, bậc mang sắc vàng đã rời bỏ thế gian;
  hiểu rõ toàn bộ lậu hoặc, bậc ấy sẽ đoạn tận luân hồi, không còn lậu hoặc. Nói xong,
  Đức Chánh Đẳng Giác đã cúi đầu như vị vua hạc trên mặt hồ. Món quà ưu việt của tôi là
  một đại lễ trọn vẹn được sắp xếp chu đáo; sau khi trao cho vị tỳ-kheo-ni Kaṭacchu, tôi đã
  đạt được bước chân không lay. Vào chín mươi hai kiếp trước đây, khi tôi trao món quà bố
  thí ấy, tôi không biết mình rơi vào khổ đau — đó là quả báo của việc dâng cho vị tỳ-kheo.
  Các phiền não của tôi đã bị thiêu rụi, tôi sống không còn lậu hoặc. Thật lành thay sự đến
  của tôi, bốn vô ngại giải đã làm tròn lời dạy của Đức Phật.

  DÁU NHÁY — CÓ TIỀN LỆ, ĐÃ ĐO:
  - Pāli mở `“` ở `1.1` và đóng `”` ở `11.3`; lời thoại của Đức Phật mở `‘` ở `3.1` và đóng
    `’` ở `5.4`. Đây là hai lớp nháy lồng nhau, khác hẳn 6 tệp `thi-ap` đã dịch (chỉ có
    một lớp `“` … `”`). Bản Việt giữ y nguyên cả hai lớp, không thêm dấu nháy nào, nên
    ngoặc kép vẫn cân trên cả bài.

  SỬA CẢ HAI BÊN Ở `3.3`:
  - `Chattiṁsadevarājūnaṁ` trùng nguyên văn `thi-ap5:4.1`, và bản tham chiếu dịch là
    `sáu mươi vị trời và các vua chúa,` — SAI, vì `Chattiṁsa` là ba mươi ba. Đo lại Pāli đã
    ghim: `devarājū` là danh từ đếm được, luôn đi kèm chư thiên — `Sattatidevarājūnaṁ`
    (thi-ap8:11.1), `Catusaṭṭhi devarājūnaṁ` (thi-ap11:8.1), `Asīti devarājūnaṁ`
    (thi-ap9:13.1, thi-ap15:13.1), `Tiṁsānaṁ devarājūnaṁ` (thi-ap6:8.1), `Paññāsaṁ
    devarājūnaṁ` (thi-ap10:5.1); và `sn11.23:2.2` `devarāja sujampati` chính là Thần
    Indra. Nghĩa của cụm là MỘT nhóm `chư thiên Ba Mươi Ba`. Đã sửa ở `thi-ap7:3.3` và
    `thi-ap16:4.1`.
    CẦN XỬ LÝ RIÊNG: `thi-ap5:4.1` và `thi-ap5:4.3` còn cách dịch cũ, nằm ngoài lát này.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - `1.1`–`8.4` gần như không có tiền lệ: `Nabhaṁ abbhuggamī` xuất hiện ở chín khoá Pāli
    khác (`tha-ap23:44.3`, `tha-ap43:11.3`, `tha-ap221:4.3`, `tha-ap336:11.3`,
    `tha-ap424:12.3`, `tha-ap425:15.3`, `tha-ap440:6.3` và `tha-ap49:2.4` với `uggamī`)
    nhưng KHÔNG khoá nào đã được dịch, và cả tầng Việt không có tiền lệ cho `abbhuggamī`.
    Vì vậy `6.3` dịch theo nghĩa đen của cụm danh từ `nabhaṁ abbhuggamī` là
    `bậc hùng mạnh nâng bầu trời`, không suy diễn thêm ẩn dụ nào (ví dụ nhặt ngón chân).
    `6.4` giữ `như vị vua hạc trên mặt hồ` theo đúng `haṁsarājāva ambare`.
  - `2.4` `akā me anumodanaṁ`: chủ ngữ vắng mặt trong Pāli; đọc là tiếp mạch `2.1`–`2.3`
    (chính Đức Phật đã tiếp nhận và đã làm cho lòng cảm tạ của người nói không còn điểm
    dứt) nên dịch chủ động. Đây là cách đọc ít giả định nhất; không thêm nhân quả nào.
  - `5.4` `nibbāyissasināsavā`: dùng ngoặc vuông `[luân hồi]` để chỉ đối tượng mà Pāli
    để ngầm (thân mạng chung thì đoạn tận). Không dịch thêm điều kiện nào.
  - `4.4` `paṭilacchasi` = `đều sẽ được đầy đủ`; `abhadhaṃ` không có trong câu này nên
    không thêm chữ `được đầy đủ mọi phương diện`.
  - `Kaṭacchubhikkhādāyikā` và `Kaṭacchu` giữ nguyên theo Pāli (là tên riêng từ chính
    `0.3` và `12.1` của bài, cũng như `1.3`, `3.1`, `7.3`); tầng Việt chưa có tên này nên
    tự đặt tên Hán–Việt sẽ là bịa. Cả hai đã khai vào bộ nhớ tiến trình của
    `_hvi.lọt_pāli` sau khi tra chứng, đúng cách mô tả trong chính hàm đó.
  - Dấu lược: `9.2`, `10.2`, `11.2` là `…pe…` ở Pāli, giữ đúng MỘT `…` mỗi khoá.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và
  `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên
  `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của
  chính tầng Việt qua `_hvi.save_vi`: đủ 46/46 khoá, cân ngoặc kép trên cả bài, đúng số dấu
