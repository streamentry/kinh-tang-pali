notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Không khoá nào có …pe…; mỗi khoá đối thoại tự chứa một cặp nháy kép, cân trên cả bài.

  Tiền lệ có đếm và dùng lại: Nibbānavagga → Phẩm Niết-bàn (6, y hệt mil3.4.6 và mil3.4.9); nibbāna → Niết-bàn theo glossary; nibbānaṁ sacchikaroti → chứng ngộ Niết-bàn theo glossary; Imasmiṁ vagge dasa pañhā → Trong phẩm này có mười câu hỏi, dùng lại nguyên văn mil6.2.10:5.1; Pāli trùng nguyên văn 2.1 Kallosi bhante nāgasenā ti (xem TIEN_LE_PHAI.md và mil3.1.7, mil3.3.4) — dùng lại nguyên văn. Nibbānavaggo catuttho → Phẩm Niết-bàn, thứ tư.

  Cân nhất quán trong bài: tiêu đề 0.3, thân kệ và lời kết 3.1 đều dùng cùng một cách dịch cho sukhaṁ nibbānaṁ, tức Niết-bàn là hạnh phúc, theo glossary (sukha → hạnh phúc). Bản nháp đầu để tiêu đề là biết sự an lành của Niết-bàn trong khi thân bài dùng hạnh phúc; một lượt review tự bắt lỗi lệch này và đã sửa cả hai vế.

  Bất định đã ghi nhận trong notes chứ không sửa Pāli: ở 1.5 chữ nacchinnā, tức không bị cắt, đọc theo nghĩa đen thì câu hỏi vô lý — kẻ chưa bị cắt tay chân thì biết sự khổ của việc bị cắt tay chân thế nào. Đã dịch là đã bị cắt đứt tay chân vì đó là dạng acchinnā mà câu hỏi đòi hỏi, đồng thời 1.8 dùng chinnahatthapādānaṁ (dạng có acch-) cho những kẻ khác nên hai vế khớp nhau. Vì đây là chỗ sửa một dạng chữ của bản đã ghin nên ambiguity_integrity hạ xuống 9.1.

