    (83), `romaso nāma pabbato;` (2), `Buddhopi sambhavo nāma,` (1), `abbhokāse vasī tadā.` (1),
    `Himavantassāvidūre` → “Không xa dãy Himavanta, (3).

    **3 KHOÁ LỆCH ĐA SỐ, LỆCH CÓ LÝ DO.**
    (a) `“Migaluddo pure āsiṁ,` — đa số tiền lệ là *“Trước kia ta thành con nai bị săn đuổi,*
        (2) và 5 biến thể. **Cách đó hiểu sai `uddha` thành *bị săn đuổi*.** `Migaluddo` là TÊN
        của con nai (`miga` = nai, `uddha` = tên), và nó xuất hiện ở khoá này. Tôi dịch
        *“Trước kia ta là con nai Migaluddo,* — giữ tên riêng Pāli như tầng đang làm với
        `Abhibhū`, `Ajagara`, `Romasa`, `Sambhava`. Tương tự, `Vātamigaṁ gavesanto,` tôi dịch *Ta
        đi tìm con nai Vātamiga,* thay vì cách cũ *con nai Gió nương rừng sâu,* (1, ở `ja14`) vốn
        trộn hai từ.
    (b) `Ekatiṁse ito kappe,` — 5 cách, đếm lại: *Từ ba mươi mốt kiếp trước,* 13 lần,
        *Vào ba mươi mốt kiếp trước đây,* 12, *Vào ba mươi mốt kiếp trước,* 12. Tôi dùng
        đa số tuyệt đối *Từ ba mươi mốt kiếp trước,* (tha-ap482 và tha-ap522).
    (c) `Tassuddānaṁ` (:10.1) — *Tóm tắt phẩm này:* theo đa số trong tha-ap (11/15), lệch đa số
        toàn tầng *Tóm lược:* (295). Xem bảng dùng chung; **cần coordinator gộp.**

    **TÊN PHẨM.** `Naḷamālivagga` → **Phẩm Vòng Hoa Sậy**: 5/5 bài đã có trong phẩm (tha-ap476–480)
    dùng đúng một cách này, không có cách nào cạnh tranh.

    **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
    · `sugatassa sirīmato.` (:2.4) — `sirīmat` là danh từ (có ánh sáng), nên vế này là VÀ dạng
      danh từ, không phải tính ngữ: *bậc Tối Lành rực rỡ*. Câu không có tân ngữ tường minh ở
      Pāli (chủ ngữ là `ahaṁ` ở :2.2), nên tôi không thêm.
    · `Vātamiga` (:1.3) — có thể là tên riêng của một con nai, cũng có thể là danh từ chung
      *nai gió*. Tôi giữ như tên riêng vì nó đứng song song `Migaluddo` và Pāli viết hoa ở giữa
      câu (`Vātamigaṁ`).
    · `Pulinacaṅkamo` (:12.2) trong uddāna là dạng Nom. của chính vị trưởng lão của bài
      (`Pulinacaṅkamiya`), nên tôi dùng lại họ tên đó chứ không tạo tên thứ mười một.

    **DẤU LƯỢC.** `:4.2`, `:5.2`, `:6.2` là `…pe…`; bản Việt giữ **đúng một** `…` mỗi khoá,
    khớp theo `lược()`.

    **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:6.3`. Tự đếm lại: cân.

