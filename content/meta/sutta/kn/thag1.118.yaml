notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Kimbila trong phẩm Dvādasamavagga.

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1): 10 bản trên đĩa mở rộng,
  5 bản giữ lược. Xem `thag1.112.yaml`. Cả hai đều giữ 2 dấu lược như Pāli.

  **Thứ tự khoá tiêu đề: theo PĀLI** (`0.3` = phẩm, `0.4` = tên bài kệ); 12 bản thag đã publish đặt
  ngược, tôi không sửa chúng.

  **Không đối chiếu được tầng Việt hiện hành** (bilara chỉ có Pháp Cú). Sujato có 8/9 khoá, trống
  đúng dòng kết lược; mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments = 0`, `ratio = 1`.

  **Thuật ngữ, đếm được.** `Abhisatto` → *ập xuống* (nghĩa đen: bị đánh trúng, bị ập). `vayo` → *tuổi
  già* (7 bản trong tầng dùng *tuổi già*; `vayo` ở an3.47:1.3 được dịch *sự diệt* — khác ngữ cảnh).
  `rūpaṁ` → *thân*. `aññam iva` → *tựa như của người ta*. `sato` → *nhớ*. `avippavasato` → *không rời
  bỏ*. `sarāmi` → *tự thấy mình*.

  **Bất định đã ghi, và đây là chỗ tôi dịch lệch vị trí.** Chủ ngữ `vayo` (tuổi già) nằm ở khoá
  `:1.2`, nhưng tiếng Việt không có câu vô chủ ngữ ở vế đầu, nên tôi đưa *Tuổi già* lên `:1.1`. Sujato
  làm đúng như vậy (*Old age falls…*). Tôi ghi rõ vì đây là **sai lệch nhỏ về ranh giới khoá**; nội
  dung không mất. Nếu người biên tập muốn giữ chủ ngữ ở `:1.2`, `:1.1` sẽ phải thành *Ửng phà cứ
  ập xuống* — tôi chọn cách hiện tại vì người Việt đọc hiểu ngay.

  **Thuật ngữ 0 tiền lệ, đặt mới:** `Abhisattova` chỉ xuất hiện **1 lần** trong toàn tầng Pāli đã
  ghim (chính khoá này), `aññamiva` 3 lần, `avippavasato` 1 lần — không có bản Việt nào để bám, nên
  tôi dựa vào nghĩa từng chữ và vào Sujato.

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2); ngoặc kép cân; không chữ ngoài
  Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này cấm) →
  `technical_integrity` = **9.6**.

  **Danh xưng giữ nguyên dạng Pāli** (Kimbila).
