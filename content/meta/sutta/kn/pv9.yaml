notes: |-
  Bản dịch chỉ từ Pāli root do commit đã ghim không có bản Anh upstream (giới hạn upstream).
  Đầy đủ 10 tiêu chí scorecard; status bắt buộc draft do blocker tầng tham khảo Anh; technical_integrity 9.6.

  Lượt cải thiện 2026-10-11 (đọc đối kháng cặp Pāli↔Việt từng khoá; 22 khoá, đổi 16):
  - 0.3 và 5.1 (tiêu đề): `Mahāpesakārapetī` là hợp từ sở hữu "ngạ quỷ nữ của người thợ dệt lớn" (người chồng nói ở 3.1 "bhariyā mamesā" — đây từng là vợ con — nên chồng là thợ dệt); bản cũ "Ngạ Quỷ Nữ Thợ Dệt Vải Lớn" biến danh từ chung thành tên riêng của chính ngạ quỷ và thêm chữ "Vải" không có trong Pāli. translationTitle đổi theo. Chưa phân xử được `mahā` ở đây là "lớn/giàu có/cầm đầu" hay chỉ là biệt hiệu; giữ nghĩa đen "lớn".
  - 1.2 (bỏ "lấy" thêm vào), 1.4 (`lohitapubbabhakkhā` = lấy máu và mủ làm thức ăn, thay "ăn nuốt"), 2.3 (bỏ "tấm … nhám thô ráp" thừa chữ, "người nữ này" cho `imissā`), 2.4 (dấu `?”` theo đa số 47 so với 20 ở các khoá Pāli kết `”ti.` trong nhóm pv), 4.6 (`idhāgatā` = đã đến đây, bản cũ thêm "sinh về"; `khādati` = ăn, bỏ "nuốt lâu dài").
  - 2.2: `mudūni suddhāni ca lomasāni` = mềm mại, sạch sẽ, có lông tơ; bản cũ đặt "mịn màng" không có trong Pāli và dịch `suddha` (nói về vải) là "thanh tịnh".
  - 3.2: `adāyikā` = không bố thí (bỏ "chịu" thêm vào), thêm dấu phẩy giữa `maccharinī` và `kadariyā`; 3.3/3.4: đưa `Sā` (nàng ấy) về đúng khoá 3.3 và bỏ "buông lời" không có trong `akkosati`.
  - 4.1/4.2: bản cũ lặp động từ "Hãy ăn … ăn nuốt"; Pāli chỉ có `paribhuñja` ở 4.2 nên 4.1 chỉ còn cụm danh từ. Lời nguyền của người vợ gọi chồng bằng "ông" (không "chàng"), vì đây là lời mắng. 4.3: `hotu` = "nguyện … thuộc về", `paralokasmiṁ` = "ở đời sau" (đa số trong tầng kn: 30/35 khoá chứa `paraloka*` dịch "đời sau", 4 khoá dịch "thế giới bên kia/khác"; giữ đa số). 4.4/4.5: `bhavantu` = "hãy giống như", `caritvā` = "sau khi làm" (bỏ "do").
  - Điểm: semantic_fidelity 9.3→9.4, grammar_logic 9.3→9.4, vietnamese_clarity 9.3→9.4; các tiêu chí khác giữ nguyên. final_score 9.23→9.26. `triangulation` giữ 7.5 vì không có tầng tham khảo độc lập.
  - Bất định còn lại (giữ nguyên, không đoán): `kitaka` (2.3, 4.4) chỉ gặp ở bài này trong toàn tầng, dịch tạm "vải thô nhám" theo ngữ cảnh đối lập với vải mới, mềm; `lomasa` dịch "có lông tơ" (nghĩa gốc "nhiều lông") chưa có bài song song để xác nhận ý nói sợi len mịn hay vải rậm lông; chưa phân định `mahā` ở tiêu đề.
  - Blocker "không có tầng tham khảo tiếng Anh" giữ nguyên (giới hạn upstream). technical_integrity 9.6; chưa chạy bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build`.
