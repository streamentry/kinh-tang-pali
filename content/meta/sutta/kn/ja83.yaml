notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli so git-hash với manifest (khớp). Bài không có segment Pāli ≥ 40 ký tự nên kiểm() không tự chạy assertion; tôi tự kiểm đủ 11 khoá.
  Tiền lệ có đếm: Apāyimhavagga → Phẩm Chưa Từng Uống, đo được trên 8 tệp cùng nguyên văn Pāli (ja81, ja82, ja84–ja89). CẢNH BÁO CẦN NGƯỜI BIÊN TẬP: apāyimha nghĩa là vô liêm/trơ trẽn, còn Chưa Từng Uống là Surāpāna — tức tên phẩm khác. Tám tệp đã publish ở trên dùng tên phẩm khác với nghĩa Pāli của chính nguyên vân chúng mang. Tôi dùng lại để không phá tính nhất quán trong cùng phẩm, nhưng ghi bằng chữ ở đây để người biên tập quyết, chứ không lan nhiễm trong im lặng. Colophon có dấu phẩy, khớp cả 8 tệp cùng phẩm.
  Thuật ngữ: mitto (người bạn) và sahāyo (bạn đồng hành) là hai danh xưng khác nhau, giữ là hai chữ khác nhau thay vì gộp thành một. kāḷakaṇṇi là quạ tai đen; đặt tên theo ja146 (Samuddakākajātaka → Kinh Quạ Biển) cùng cách dịch loài vật. ñāti giữ là đã được biết. 0 tiền lệ riêng: mười hai ngày, người cùng huyết thống.
  Bài không có bản Anh Sujato tại commit đã ghim (manifest không có file en/sujato) nên dịch chỉ từ Pāli; có tầng english-project của dự án nhưng tôi không đọc và nó chưa publish, nên scorecard này không tuyên bố đã đối chiếu English (triangulation 7.0).
  Sửa lan 2026-10-13: `Apāyimhavagga` — tên phẩm lấy từ vế đầu của `ja81:1.1`, mà `apāyimha` là thức aorist ngôi thứ nhất số nhiều có tiền tố `a-` (*chúng tôi đã uống*), cùng dạng với `agāyimha` (*chúng tôi đã hát*) và `anaccimha` (= `a-` + `naccimha`, *chúng tôi đã nhảy múa*); dạng phủ định phải là `na`/`nā`. Bản cũ đọc `a-` là phủ định (*Chưa Từng Uống*). Tiền lệ đo trên tầng: ở `kn` các động từ aorist ngôi 1 số nhiều có `a-` (`agamimha`, `adāsimha`, `apucchimha`, `akarimha`… 20+ khoá) đều dịch khẳng định. Khoá `ja83:0.3`: *Phẩm Chưa Từng Uống* → *Phẩm Chúng Tôi Đã Uống* (cùng tên ở `ja81`…`ja90`, một tên phẩm cho cả phẩm; `ja90:4.1` giữ `Apāyimha` là tên trong bài tóm lược, không đổi). Cảnh báo ở phần ghi chú trên (`apāyimha` nghĩa là vô liêm/trơ trẽn, tên phẩm dịch khác nghĩa Pāli) nay được giải quyết theo hướng khác: `apāyimha` là aorist khẳng định của `pibati`, tên phẩm sửa như trên. Điểm không đổi; giữ nguyên các khoá còn lại.

  Kiểm toán 2026-10-15 (kiểm toán Jātaka chỉ có Pāli), Claude Sonnet 5.5 (Claude Code): Sửa 6/6 khoá kệ và tên bài. sattapadena = bằng bảy bước chân (không phải bảy ngày); māsaḍḍhamāsena = một tháng hoặc nửa tháng; tatuttariṁ attasamo hoti = quá thời ấy thì thành như chính mình; jaheyyaṁ (khả năng cách của jahati) = bỏ, vậy câu cuối là "sao có thể bỏ", bản cũ dịch ngược nghĩa ("cớ gì phải giữ"). kāḷakaṇṇī (DPD: người xúi quẩy) là tên/biệt danh của người bạn, không phải con quạ; tên bài đổi từ "Quạ Tai Đen" thành "Kinh Kāḷakaṇṇi" ở khoá 0.4, 2.1 và translationTitle. dvādasakena "mười hai ngày" theo chú giải (Pāli chỉ có "mười hai"). Ghi chú cũ ở trên về "quạ tai đen" không còn đúng.
