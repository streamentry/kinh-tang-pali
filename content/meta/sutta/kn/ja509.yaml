notes: |-
  Đợt 19, làn 79. Dịch từ Pāli root commit đã ghim, đủ 109/109 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện (khoá 1–19 là các bài kệ đối thoại, 20 là kệ tường thuật, 21–26 là lời của người nữ cùng điệp khúc `Accenti kālā…`, 27 là colophon), nên người nói không được ghi vào thân kinh; chỉ suy từ nội dung kệ và ranh giới dấu nháy (xem BẤT ĐỊNH, mục 1). Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề và colophon.**
  - `0.1` “Jātaka”: giữ nguyên chữ Pāli, theo 478/494 khoá `:0.1` đã có bản Việt trong `ja` (16 khoá dịch “Chuyện Tiền Thân”), và theo `ja508`, `ja510` cùng phẩm.
  - `0.2` “Bộ Hai Mươi Bài Kinh” và `0.3` “Phẩm Mātaṅga”: dùng lại nguyên văn `ja497:0.2`, `ja497:0.3` (cùng Pāli, cùng bộ, cùng phẩm).
  - `0.4` “13. Kinh Hatthipāla” (`Hatthipālajātaka`): “Kinh” + tên, theo `ja508`, `ja510`. Giữ nguyên tên Pāli `Hatthipāla` (hatthi + pāla), vì root không có văn xuôi để xác định tên người hay tên nơi, và 0 tiền lệ dịch nghĩa ghép. Số `13` khớp `terasamaṁ` (13) ở `27.1`.
  - `27.1` “Kinh Hatthipāla, thứ mười ba.”: có dấu phẩy trước số thứ tự, theo `ja508` (“…, thứ mười hai.”) và `ja510` (“…, thứ mười bốn.”) cùng phẩm.

  **Tiền lệ dùng lại nguyên văn.** Đã dò 553 cặp (khoá của bài × khoá khác trong tầng Pāli ghim, Pāli trùng sau khi bỏ dấu câu, và khoá kia đã có bản Việt); 497 cặp trong đó chỉ là khoá `:0.1`, 56 cặp còn lại thuộc 19 khoá. 20 khoá của bài có ít nhất một cặp: 14 khoá dùng lại nguyên văn (`0.1`, `0.2`, `0.3`, `1.4` theo `ja496:9.4`, `3.4` theo `dn19:44.15`, `9.1` theo `ja378:1.1`, `17.2` theo `ja484:4.2`, `20.4` theo `thig13.3:11.4`, và `24.1`–`26.2` theo `sn1.4:2.1`–`2.2`), 6 khoá khác có chủ ý:
  - `2.2` “vị ẩn sĩ say mê đức hạnh của Chánh pháp”: theo `ja431:6.2` (cùng Pāli) nhưng đổi “bậc thiền hiền” thành “ẩn sĩ” cho `isi`; đo trên 26 khoá `ja` có `isi`: “ẩn sĩ” 10, “đạo sĩ” 5, các dạng “hiền…” 7.
  - `3.1` “Chỗ ngồi, nước, nước rửa chân”: `dn19:44.12` dịch `pajja` là “dầu thoa chân”, nhưng `ja337:3.3` (cùng Pāli, cùng bộ) và nghĩa từ điển của `pajja` (nước rửa chân) cho “nước rửa chân”; đây là cặp khác có lý do.
  - `3.3` “chúng tôi xin thưa hỏi ngài về lễ vật tiếp đãi”: `dn19:44.14` dịch “xin cho chúng tôi được dâng lễ tiếp đãi”, nghĩa là diễn giải `pucchāma` thành lời xin; ở đây giữ `pucchāma` là “hỏi” và `bhavantaṁ` là “ngài”, còn `3.4` mới là lời xin nhận lễ vật (dùng lại nguyên văn `dn19:44.15`).
  - `20.1` “Nói xong điều ấy, vị đại vương,”: theo `ja282:3.1`, đổi chủ ngữ cho đúng `mahārājā` ở bài này.
  - `23.4`, `25.4` “bỏ lại các dục lạc cho tới mức ấy”: theo `ja408:6.4` và `snp1.3:26.3` (cụm “cho tới mức ấy”), chỉ khác dạng gerund (“bỏ lại” so với “sau khi bỏ”/“đã từ bỏ”) và dấu nháy. Pāli của `23.4` và `25.4` cũng trùng với `ja535:21.4`, `tha-ap2:35.3`, `cnd23:245.3` nhưng các bài đó chưa có bản Việt.
  Không có khoá nào có cặp trùng bản Việt mà dịch khác ngoài sáu khoá trên.

  **Trùng nguyên văn trong chính bài (có kết quả):** 10 nhóm khoá Pāli trùng nguyên văn (27 cặp), cả 10 nhóm đều dịch giống hệt nhau (0 cặp lệch): `1.1`/`2.1`; `5.4`/`6.2`; `6.4`/`7.4`; `21.1`/`22.1`/`23.1`; `21.2`/`22.2`/`23.2`; `22.3`/`23.3`/`24.3`/`25.3`/`26.3`; `22.4`/`24.4`; `23.4`/`25.4`; `24.1`/`25.1`/`26.1`; `24.2`/`25.2`/`26.2`. Một điểm đã cân nhắc: `6.4` và `7.4` có Pāli trùng nhau (`Passeyyuṁ taṁ vassasataṁ arogaṁ`) nhưng ở `6` có thể là lời mong, ở `7` là hệ quả của vế điều kiện; dùng đúng một cách dịch “họ có thể thấy ngài sống trăm năm không bệnh” (nghĩa khả năng của `passeyyuṁ`), để không gán thêm nghĩa nguyện cầu mà Pāli không nói rõ.

  **Số Pāli:** `terasamaṁ` (27.1) = 13, khớp số `13.` ở `0.4`; `vīsati` (0.2) = 20, theo `ja497:0.2`; `vassasataṁ` (6.4, 7.4) = `vassa` + `sata` = 100 năm, theo `sata` = 100 (`Kappānaṁ satasahassaṁ` → “một trăm ngàn”). `ekā` (22.3, 23.3, 24.3, 25.3, 26.3) là “một mình” (nữ tính), không phải số. Không có cụm số nào chưa phân xử được (không gặp `Tiṁsakappasahassa`).

  **Thuật ngữ và tiền lệ đã đo (khoá `ja` đã có bản Việt, trừ bài này):**
  - `maccu`, `antaka` → “Tử thần”: 13/14 khoá chứa `maccu` dịch “Tử thần” (`ja510` và các bài cùng phẩm), 0 khoá dịch “thần Chết”; `maccudheyyā` (9.2) → “lãnh địa của Tử thần” (tầng sn/snp/an dịch `maccudheyya` là “cõi/lãnh địa của thần Chết”, nên giữ nghĩa “lãnh địa” và dùng “Tử thần” theo `ja`).
  - `kāma` → “dục”/“dục lạc”: 71 khoá `ja` có `kāma`, 55 chứa “dục”, 38 chứa “các dục”, 11 chứa “dục lạc”; `kāmā` (9.1) dùng lại “Các dục” của `ja378:1.1`; `kāmāni manoramāni`/`yathodhikāni` → “các dục lạc khả ái”/“các dục lạc cho tới mức ấy” (`manorama` → “khả ái”: `snp5.1:38.4`, `ja465:5.2`).
  - `isi` (2.2) → “ẩn sĩ” (xem trên); `muni` (4.4) → “bậc hiền sĩ”: chỉ 3 khoá `ja` có `muni`, trong đó `ja467:12.2` dịch “bậc hiền sĩ”, còn `ja2:1.3`, `ja94:1.4` dịch “bậc hiền trí”; chọn “hiền sĩ” để tránh lẫn với `paṇḍita`, `dhīra` (“bậc trí”, 12.4).
  - `rāja` (vocative: 7.1, 11.2, 11.4, 18.3) và `deva` (14.4) → “tâu đại vương”: 13/52 khoá `rāja` ở `ja` dịch “tâu đại vương” (2 khoá “tâu vua”), 5/14 khoá `deva` vocative dịch “tâu đại vương”.
  - `haṁsā` (16.2) → “đàn ngỗng”: trong 11 khoá `ja` có `haṁsa`, “ngỗng” 4 (kể cả “Ngỗng Vàng”), “thiên nga” 4; chọn “ngỗng”.
  - `vede` (4.1) → “Vệ-đà” (7/9 khoá `ja`); `vitta` → “của cải” (2/4 khoá, 0 “tài sản”); `pāraṁ` (9.4) → “bờ bên kia” (3/8).
  - `paṅko ca kāmā palipo ca kāmā` (9.1): `ja378:1.1` là khoá duy nhất có `palipa` trong `ja`, dịch “đầm lầy lún sụt”; giữ nguyên.
  - `saṅga` (26.4) → “ràng buộc”: `saṅgātigo`/`saṅgātigassa` ở `mn56:29.25`, `sn1.5:2.3`, `sn1.5:3.3` dịch “ràng buộc” (0 khoá `ja` dùng); `mn98:11.9`, `mn116:7.3` dịch “trói buộc”.
  - `sītibhūtā` (26.4) → “đã trở nên mát lạnh”: theo `mn26:25.17` (“nguội lạnh”), `sn6.3:6.4` (“mát lạnh”), `snp3.6:46.3` (“mát lạnh”).
  - `disampati` (20.2): giữ nghĩa “chúa tể các phương”, không viết như tên riêng (ở `dn19:29.1` `Disampati` là tên vua, nhưng ở đây đứng cạnh `esukārī` và `mahārājā` như một danh hiệu).
  - `nāga` (20.4) → “voi”, theo `thig13.3:11.4`.
  - `Esukārī`, `Vāseṭṭhī`, `Pañcālī` giữ nguyên tên Pāli; 0 tiền lệ dịch.

  **Dấu câu (khớp Pāli từng khoá).** Nháy kép `“`/`”`: Pāli 14/14, Việt 14/14, lệch 0/109 khoá. Nháy đơn `‘`/`’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0, nên không có gì để cân (không có `…pe…`, không có `(…)` trong bài này). Cấu trúc nháy của Pāli: lời trích mở ở `1.1` và đóng ở `3.4`; `4`, `5`, `6` mỗi bài một lời trích (mở ở `.1`, đóng ở `.4`); `7.1`–`8.4` một lời trích; `9.1`–`10.4`; `11.1`–`12.4`; `13.1`–`14.4`; `15`; `16`; `17.1`–`18.4`; `19`; `21`; và `22.1`–`26.4` là một lời trích dài (không đóng ở `22.4`–`25.4`). Một lỗi đã bắt khi tự kiểm: bản nháp đầu bỏ sót dấu mở nháy kép ở `17.1` (Việt 13/14); phép so từng khoá bắt được và đã sửa. Không thêm nháy đơn vào chỗ Pāli có `iti` mà không có dấu nháy (`12.1`, `12.3`, `7.3`).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói không có trong tầng Pāli đã ghim; chỉ có ranh giới nháy. Đại từ trong Việt chỉ theo ngôi của Pāli (`mayhaṁ`, `me`, `maṁ`, `tvaṁ`, `tava`…), không gán danh tính. `10`: `me` dịch “ta”, không rõ người nói. `15` người nói nói với `Vāseṭṭhi` (vợ): “ta”. `16` người nữ (`ekā`, `patī`): “tôi”. `17`–`18` nằm trong cùng một lời trích (mở `17.1`, đóng `18.4`) và `18.3` gọi `rāja`, nên `me` ở `17.4` dịch “tôi” chứ không “ta”; nếu có văn xuôi khung truyện cho thấy `17` là lời một người khác (ví dụ nhà vua), phải đổi. `22`–`26`: “ta” cho người nữ nói với dân chúng.
  2. `Aghasmi` (16.1): dịch “trên không trung”, hiểu `agha` là khoảng không (đi với `koñcā` bay lúc hết mùa lạnh); không xác nhận được từ tầng đã ghim (0 tiền lệ). Cách đọc khác: `agha` là “khốn khó”, nên “những con sếu trong cảnh khốn khó”.
  3. `koñca` (16.1) → “sếu” (0 tiền lệ trong `ja`); cũng có thể là diệc/cò.
  4. `Orundhiyā` (10.3): dịch “bằng cách giam lại” (gốc `orundhati` “nhốt lại, chặn lại”); cách đọc khác là “bằng nội cung/những người canh giữ” (`orodha`). Không phân xử được.
  5. `Mattūpamaṁ` (13.2): dịch “dáng như người say”; cách đọc khác “như voi cái đang động dục”. `ketakapupphanettaṁ` → “mắt như hoa ketaka”, giữ tên hoa, 0 tiền lệ.
  6. `Sāmo kusumbhaparikiṇṇamassu` (14.2): `sāma` dịch “da ngăm” (cũng có thể là “sẫm/vàng sẫm”); `kusumbha` (hồng hoa) giữ nguyên chữ Pāli vì không rõ là hoa hay thuốc nhuộm; 0 tiền lệ. Các nhánh nominative ở `14.1`–`14.3` mô tả chủ thể của `pabbajissāmi` (`14.4`), nên không thêm đại từ ở đầu.
  7. `Paṭikacca gehaṁ` (14.3): dịch “bỏ nhà từ sớm”, `paṭikacca` là “từ trước, sớm”; nếu là “sau khi lo liệu trước” thì nghĩa khác.
  8. `Hiyyoti hiyyati poso, Pareti parihāyati` (12.1–2): đọc `iti` là dấu thời gian (“hôm qua”, “ngày sau”): mỗi ngày qua đi thì con người hao mòn; cách đọc khác là lời của kẻ trì hoãn (“hôm qua… ngày sau…”). Vì Pāli không có dấu nháy ở đây nên Việt không đặt nháy.
  9. `Anāgataṁ netamatthīti` (12.3): “điều chưa đến thì không hiện hữu”; chưa có chú giải để xác nhận nghĩa “không chắc có”.
  10. `Passāmi vohaṁ` (13.1): `vo` hiểu là tiểu từ nhấn mạnh (“quả thật”), theo `ja51:1.3`, `ja52:1.3` (“Passāmi vohaṁ attānaṁ” dịch “Giờ ta thấy rõ chính mình”, Sujato “Now I truly see”). Cách đọc khác: `vo` là “các vị”.
  11. `Evaṁ naṭṭho esukārī mamattho` (11.3): `esukārī` đọc là vocative (gọi vua, theo `rāja` ở `11.2`, `11.4`); cách đọc khác là chủ cách. `mamattho` dịch “mục đích của tôi”.
  12. `Ye ca bhutvāna vamiṁsu, te me hatthattamāgatā` (17.3–4): `ye` đọc là tân ngữ (“những thứ chúng đã ăn rồi nôn”), `te` là “những thứ ấy”; cách đọc khác coi `ye`/`te` là người. Câu liền sau (`18.1`–`18.2`, `avamī … paccāvamissasi`) ủng hộ cách đọc về vật bị nôn.
  13. `pahīnaputtassa mamajja bhoti` (15.3): `bhoti` đọc là động từ (“là”, với `kālo` ở `15.4`); cách đọc khác là vocative “thưa bà”. `19.3` thì `bhoti` chắc chắn là vocative (“thưa nàng”) vì `udatāri` đã là động từ.
  14. `Vedā na saccā na ca vittalābho` (5.1): vế sau tỉnh lược `saccā`; dịch “được của cải cũng không phải” (chân thật).
  15. `Khāridharaṁ` (1.3): “mang gánh”; `khāri` là gánh đồ dùng, nhưng không thêm “đồ dùng” vào thân kinh; tiền lệ liên quan chỉ có `sn7.9:14.1` (`khāribhāro` “gánh nặng”) và `ja324:3.1`.
  16. `Muccanamāhu santo` (5.3): “bậc hiền thiện nói đến sự thoát khỏi hương và vị”; `muccana` dịch “sự thoát khỏi”, không thêm “mới là giải thoát”. `santo` theo `ja372:3.4`, `ja410:5.4`.
  17. `Adhicca vede pariyesa vittaṁ, putte gahe tāta patiṭṭhapetvā` (4.1–2): `gahe` đọc là “trong nhà”; `tāta` là “này con” (42 khoá `ja` có `tāta` nhưng dịch rất phân tán: “hỡi ngươi”, “con ơi”, “người ơi”, “bạn”…), chọn “này con” vì người nói khuyên đi theo con đường gia chủ rồi mới vào rừng.
  18. `Hīnattarūpā` (9.4): “bản chất thấp kém”, đọc `hīna` + `attā` + `rūpa`; 0 tiền lệ.
  19. `Taṁ` ở `6.4`/`7.4` đều dịch “ngài”, dù ở `7` người nói có thể là người nhận lời ở `6`; không phân xử được.

  **Coverage English (mục 7):** mẫu số = 0. Sau khi nén khoảng trắng, dòng Pāli dài nhất ở các khoá khác `:0` chỉ 35 ký tự (< 40), nên không khoá nào có nội dung; các khoá `:0.*` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja509` (tầng Sujato chỉ có 83 bài Jātaka); `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng, nên `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Các dòng Pāli song hành đã đối chiếu để kiểm tra nghĩa: `sn1.4`, `sn2.27`, `snp1.3`, `thig13.3`, `dn19`, `ja378`, `ja408`, `ja431`, `ja496` (đều có bản Việt trong tầng; Sujato có ở `sn1.4`, `sn2.27`, `snp1.3`, `dn19`). Không đụng `content/meta/reference-gaps.yaml`.

