notes: |-
  Đợt 19, làn 78. Dịch từ Pāli root commit đã ghim, đủ 109/109 khoá (0.1–0.4, 1.1–26.4, 27.1), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung (xem bất định 1). Bài song hành `ja534` (Mahāhaṁsajātaka) trùng Pāli ở 39 dòng kệ (1.1–1.4, 2.1–2.3, 3.1–3.4, 4.2–4.4, 6.4, 8.1–8.3, 10.2–10.3, 14.1–19.4 từng phần) nhưng tầng Sujato của `ja534` rỗng ở mọi khoá của kệ (chỉ `ja534:23.2` không rỗng, là một chú thích của người dịch chứ không phải bản dịch kệ, và không thuộc các dòng trùng) và `ja533`/`ja534` chưa có bản Việt, nên không cung cấp được tầng tham khảo nào cho bài này; vì vậy `triangulation` vẫn thấp.

  **Tiêu đề.**
  - `0.1` “Jātaka”, `0.2` “Bộ Hai Mươi Bài Kinh”, `0.3` “Phẩm Mātaṅga”: dùng lại nguyên văn. `0.2` trùng Pāli với 12 khoá đã dịch (12/12 giống, gồm `ja497`, `ja504`, `ja508` và các bài `thag16.*`, `thig13.*`), `0.3` trùng với 3 khoá (`ja497`, `ja504`, `ja508`, 3/3 giống). `0.1`: đo 498 cặp, 482 giống “Jātaka”, 16 khác (“Chuyện Tiền Thân”, nhóm bài cũ `ja334`–`ja370`); chọn “Jātaka” theo đa số áp đảo và theo ba bài cùng phẩm.
  - `0.4` “6. Kinh Thiên Nga Nhỏ” và `27.1` “Kinh Thiên Nga Nhỏ, thứ sáu.”: `haṁsa` → “thiên nga”: đo trên các khoá Việt đã dịch chứa `haṁs…` có chữ chỉ loài chim: “thiên nga” 24 · “ngỗng” 6 (kể cả `ja476:0.4` “Kinh Thiên Nga Javana”; `ja136:0.4` “Kinh Ngỗng Vàng” là một trong số ít dùng “ngỗng”). `Cūḷa-` ở tiêu đề: “Nhỏ” 3 (`ja193`, `ja263`, `ja430`) · “Tiểu” 2 (`ja52`, `ja301`) · giữ phiên âm “Cūḷa” 7 (`ja4`, `ja222`, `ja358`, `ja374`, `ja443`, `ja464`, `ja477`); chọn “Nhỏ” vì tên chim đã được Việt hóa nên phần “Cūḷa” cũng Việt hóa. Số `6.` ở `0.4` và `chaṭṭhaṁ` ở `27.1` đều là 6 ⇒ “thứ sáu” khớp. Khuôn `27.1` theo `ja504:26.1` “Kinh Bhallātiya, thứ tám.”

  **Tiền lệ dùng lại nguyên văn và Pāli trùng nguyên văn với tầng.** Đã dò toàn tầng đã dịch (so Pāli sau khi nén khoảng trắng, hạ chữ hoa, bỏ dấu câu): 537 cặp Pāli trùng ở 14 khoá của bài, trong đó 24 cặp thuộc thân kệ (11 khoá: `7.1`–`7.4`, `9.2`, `10.3`, `13.1`–`13.3`, `19.4`, `22.2`; còn lại là tiêu đề ở trên). Trong 24 cặp thân kệ: 12 giống, 12 khác.
  - Dùng lại nguyên văn (12 cặp giống): `9.2` “loài chim ấy bay đi” ← `ja484:4.2`; `13.1` “Mong rằng bác thợ săn cũng được hoan hỷ như thế” ← `ja359:5.1`; `13.2` “cùng với toàn thể quyến thuộc bà con” ← 8 khoá (`pv16:17.4`, `ja492:3.2`, `ja430:9.2`, `ja429:9.2`, `ja484:14.2`, `ja399:7.2`, `ja398:7.2`, `ja359:5.2`); `22.2` “bằng dòng dõi hay giới hạnh” ← `ja254:2.2`, `ja304:3.2` (2/2). `9.1` “Những con kia ăn rồi uống rồi” theo `ja484:4.1` (Pāli không trùng byte).
  - Khác có chủ ý (12 cặp khác, đã đọc từng cặp): (a) `7.1`–`7.4` ↔ `ja164:2.1`–`2.4` và `ja399:5.1`–`5.4` (7 cặp): hai bài kia dịch `poso jīvitasaṅkhaye` thành “kẻ đã tự bỏ mạng mình thì đi” và `āsajjāpi na bujjhati` thành “dù tận tâm cũng không tìm thấy”. Pāli không nói vậy: `poso` = người, `jīvitasaṅkhaye` = lúc mạng sống cạn, `āsajja` = đã đến sát/chạm phải; và chính hai bài ấy dịch `āsajjāpi na bujjhasi` ở `ja164:1.4` và `ja399:4.4` là “dù chạm vào ngươi cũng chẳng nhận ra”. Bản này theo Pāli và theo `ja164:1.4`; đây là chỗ bản Việt của hai bài kia lệch Pāli nội bộ (xin người điều phối xem lại `ja164:2.2`, `ja164:2.4`, `ja399:5.2`, `ja399:5.4`; không thuộc lát này, không đụng). “suy vong” cho `parābhava`: đo 65 khoá, “suy vong” 10 · “suy việt” 2. (b) `10.3` ↔ `ja430:3.3` “chim sẻ bỏ rơi nó”: `sakuṇā` ở đó là một loài trong truyện khác; ở đây là bầy chim nói chung. (c) `13.1` ↔ `ja399:7.1` “Ngươi tham lam”: `luddaka` là xưng hô nên dịch “thợ săn” (đo 19 khoá chứa `luddak…`, “thợ săn” 10). (d) `13.2` ↔ `ja455:7.4` “cùng tất cả người thân”: một cách nói khác của cùng nghĩa; theo đa số 8/9. (e) `13.3` ↔ `ja359:5.3` “Như chính thiếp…”: người nói là con nai cái ở đó, ở đây là Sumukha xưng “tôi”. (f) `19.4` ↔ `tha-ap171:3.2` “ham theo lòng mong của Ngài”: ngữ cảnh khác hẳn (apadāna về việc dâng cúng); bản Việt ở đó đọc `mama` “của tôi” thành “của Ngài”, trái với `mama`; ở đây là lời của vua nói về vợ mình nên giữ “của ta” (xin xem lại `tha-ap171:3.2`; không thuộc lát này, không đụng).

  **Trùng nguyên văn trong chính bài:** 109 khoá, 9 nhóm Pāli trùng (sau khi nén khoảng trắng, hạ chữ hoa, bỏ dấu câu): (1.1 = 8.1), (1.2 = 8.2), (1.3 = 8.3), (1.4 = 3.4), (2.4 = 10.4), (16.2 = 17.2), (16.4 = 17.4), (18.2 = 19.2), (18.3 = 19.3). Bản Việt của cả 9 nhóm giống hệt nhau về chữ; khác biệt duy nhất là dấu nháy/chấm/dấu hỏi theo Pāli từng khoá (`1.1` mở “, `3.4` đóng ”, `8.1` mở “, `10.4` đóng ” kèm dấu hỏi, `16.4` kèm dấu hỏi còn `17.4` kết dấu chấm). Cặp gần trùng nhưng khác nội dung, đã đọc: `1.4` ≠ `8.4` (câu kết khác hẳn: `kāmaṁ sumukha pakkama` và `tvaññeva avahiyyasi`); `14.x` / `15.x` chỉ khác `kacci bhoto` (hỏi) và `atho` (đáp), `manusāsasi` (ngôi hai) và `manusāsahaṁ` (ngôi một); `18.x` / `19.x` chỉ khác `te`/`me` và `tava`/`mama`.

  **Số Pāli.** `Satameko` (21.1) = sataṁ 100 + eko 1 = **một trăm lẻ một** (xem bất định 5; không có song song trong tầng để kiểm). `ekaṁ` (2.2) = “một mình”, `eko` (2.4, 10.4, 9.4 `tvaññeveko`) = “riêng mình”. `6.` ở `0.4` và `chaṭṭhaṁ` ở `27.1` đều là 6. Không có số lớn nào khác (không có `sahassa`, `navuti`, `tiṁsa…`).

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên công cụ đo):**
  - `haṁsa` → “thiên nga”: 24 · “ngỗng” 6 (chỉ khoá Việt đã dịch có `haṁs…` và chữ chỉ loài chim). `dijo`/`dijādhipa`/`vihaṅgama`/`sakuṇa` → “chim”/“loài chim”/“vua loài chim”: 14/29 khoá chứa `dijo/dijā` có “chim”. `vakkaṅga` (1.2, 8.2, 9.3) → “kẻ thân cong”: không có tiền lệ (0 khoá); xem bất định 2.
  - `pāsa` → “bẫy”, `jāla` → “lưới”: tầng cho `pāsa` “bẫy” 25 khoá; theo `ja164:1.3` “lưới và bẫy”.
  - `ñātigaṇa` (2.1) → “đoàn bà con”: `ñāti` “bà con” 107 · “quyến thuộc” 51 · “thân quyến” 50 · “người thân” 22; ở `13.2` giữ “quyến thuộc bà con” vì trùng nguyên văn.
  - `luddaka`/`nesāda` → “thợ săn”, `bhariyā` → “vợ” (137/145 khoá), `amacca` → “đại thần” (33 khoá), `raṭṭha` → “vương quốc”: đo “quốc độ” 22 · “nước” 30 · “vương quốc” 14 trên toàn tầng; chọn “vương quốc” theo phạm vi gần nhất (`ja504:1.2` “bỏ lại vương quốc”, cùng phẩm).
  - `sakhā`/`mitta`/`sahāya` → “bạn”: 45/69 khoá chứa `sakhā/sakhi` có “bạn”.
  - `dhammena manusāsati` → “cai trị bằng đúng pháp”: “đúng pháp” 84 · “bằng pháp” 26 · “chánh pháp” 25 trên 309 khoá chứa `dhammena`. `kicca` (21.3) → “bổn phận”: “bổn phận” 35 · “việc cần làm” 15 · “việc nên làm” 6 trên 174 khoá. `medhāvī` (26.3) → “bậc trí”: “bậc trí” 22 · “người trí” 10. `bījaṁ` → “hạt giống”: 42/73.
  - `anīgha` (3.3) → “không hoạn nạn”: tầng dịch `anīgha` “không phiền não” 10/32 khoá, nhưng ở đây `anīghāya` là cách ở (đích) của `hāpesi` và nói về chuyện thoát nạn của chính người nghe; xem bất định 3.
  - `sujāta` (20.2) → “dòng dõi tốt”: theo `dn4:5.6` “có dòng dõi tốt” và các khoá cùng mẫu (đo 92 khoá chứa `sujāt…`). `ācārasīla` (25.3) → “đạo hạnh và giới hạnh”: theo `ja415:5.3` “đạo hạnh cùng giới hạnh”.
  - `sīdati` (22.4, 24.4) → “chìm”: 12 khoá. `uṭṭhātā` (25.2) → “nỗ lực” (tầng 1 khoá “siêng”).
  - `sammodanti` (20.4) → “hòa hợp vui vẻ”; `tato tato` → “ở khắp nơi”: không có tiền lệ cho cả cụm (0 khoá).
  - `assavā` (18.2, 19.2) → “biết vâng lời”: tầng không có tiền lệ (các khoá chứa `assava…` thuộc nghĩa khác, `dn5` “biết nghe lệnh”). `piyabhāṇinī` → “nói lời dễ mến”.
  - `vijjā` (26.2) → “các môn học”: ở đây là học thuật thế gian chứ không phải “minh” (tam minh) nên không dịch “minh”.
  - `sarabha` (24.3) → giữ phiên âm “sarabha”: tầng không có tiền lệ chỉ con vật (các khoá chứa `sarabh…` là tên sông Sarabhū và tên người), giữ phiên âm như `ja504` giữ `kimpurisa`.
  - Không đụng `content/glossary/pali-vi.yaml`.

  **Dấu câu.** Nháy khớp Pāli từng khoá: 109/109 khoá khớp số lượng cả `“`, `”`, `‘`, `’`, `…`, `(`, `)` (0 lệch). Tổng Pāli “ 18 · ” 18 · ‘ 2 · ’ 2, bản Việt đúng bằng. Nháy đơn: `4.1` (`‘dukkhapareto’`), `5.4` (`‘patatetaṁ’`). Pāli mở nháy kép ở `1.1`, `4.1`, `5.1`, `6.1`, `7.1`, `8.1`, `11.1`, `12.1`, `13.1`, `14.1`–`21.1`, `22.1`; chạy qua nhiều khoá: `1.1`→`3.4`, `8.1`→`10.4`, `22.1`→`26.4` — đúng là *khớp Pāli từng khoá*, không phải mỗi khoá tự cân. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (phép so “…pe…” chạy rỗng vì Pāli không có lược; không có `(…)` trần ở khoá nào). NFC: 109/109 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa; Pāli lọt sang Việt chỉ là tên riêng (`Jātaka`, `Mātaṅga`, `Dhataraṭṭha`, `Sumukha`; kiểm 4 khoá, đều là tên riêng). Chữ số chỉ có ở `0.4` (“6.”).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ nội dung chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). Cách đọc đã dùng: 1–3 vua thiên nga Dhataraṭṭha nói với Sumukha; 4 Sumukha; 5 Dhataraṭṭha; 6 Sumukha hỏi lại; 7 Dhataraṭṭha đáp; 8–10 người thợ săn; 11 Sumukha; 12 người thợ săn; 13 Sumukha nói với người thợ săn; 14, 16, 18, 20 một con thiên nga hỏi vị vua loài người; 15, 17, 19, 21 vị vua đáp; 22–26 con thiên nga dạy. Các câu hỏi–đáp 14–21 đoán từ cấu trúc `kacci … / atho …`, và từ song song `ja534:76`–`81` (cùng hình thức); thân kinh không ghi tên người nói. Hai lớp vua (`Dhataraṭṭha` là vua thiên nga, người được hỏi là vua loài người) chỉ phân biệt được từ ngữ cảnh nên `rājā` (11.1, 12.4) được dịch “vua”/“nhà vua” theo nội dung từng khoá.
  2. `vakkaṅgā` (1.2, 8.2, 9.3): dịch “kẻ thân cong” theo nghĩa gốc (`vakka` “cong” + `aṅga` “thân”); có thể là tên gọi quen của thiên nga (“cong cổ”). Giữ nghĩa gốc, không đoán thêm. Tương tự `harittaca` (1.3, 8.3) “da vàng lục” (`harita` có thể là vàng hoặc xanh lục) và `hemavaṇṇa` “sắc vàng kim”.
  3. `3.3` `Mā anīghāya hāpesi`: nghĩa của `hāpeti` + dạng cách `anīghāya` không chắc; bản Việt “đừng để lỡ mất sự không hoạn nạn” giữ đúng hai thành tố (“mất/lỡ” và “không hoạn nạn”). Cách đọc khác: “đừng bỏ [bạn] vì mong yên ổn”.
  4. `4.1` `Nāhaṁ ‘dukkhapareto’ti`: chủ thể của `dukkhapareto` không nêu. Bản Việt để nguyên không chủ thể: “nghĩ rằng ‘đang bị khổ đau chế ngự’”. Có thể đọc là chính Sumukha (song song `ja534:4.1` `dukkhaparetopi` nói về người nói) hoặc Dhataraṭṭha.
  5. `21.1` `Satameko ca me puttā`: dịch “một trăm lẻ một” (`sataṁ` 100 + `eko` 1); không có khoá song song trong tầng để kiểm. `21.2` `mayā sutā` đọc `suta` “con” (do `su` “sinh”) + `mayā` “bởi tôi” ⇒ “do ta sinh ra”; cách đọc khác `suta` “đã nghe” không hợp với `mayā` + `puttā`.
  6. `5.4` `‘patatetaṁ’ avassajiṁ`: đọc `patata` “hãy bay” + `etaṁ` + `avassajiṁ` “tôi đã buông/thốt ra”; dịch “đã thốt ra lời ‘hãy bay đi’ ấy”. Cách đọc khác: “đã buông [họ ra] bằng lời ‘hãy bay đi’”; không thêm đối tượng vào thân kinh.
  7. `6.1` `Apadena padaṁ yāti`: dịch sát chữ “không có chân mà vẫn đi được đường”; nghĩa ẩn dụ (đường bay không để lại dấu chân) không được khẳng định.
  8. `11.4` `yāva kālassa pariyāyaṁ`: “cho đến khi đến lượt của thời gian”; `kāla` ở đây có thể là “cái chết”, `pariyāya` “lượt/vòng”. Giữ nghĩa thông thường, không viết “cái chết” vào thân kinh.
  9. `16.4`/`17.4` `chāyā dakkhiṇatoriva`: dịch sát chữ “như bóng râm ở phía nam”; không phân xử được ý hình ảnh (kẻ thù xa như bóng, hay bóng ở hướng nam). Cũng có thể `dakkhiṇato` là “bên phải”.
