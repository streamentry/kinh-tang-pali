notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của harness gần như không kiểm gì ở bài này, nên tôi tự quét toàn bộ khoá từ đĩa.** Mọi vế kệ ngắn hơn 40 ký tự nên bộ lọc `substantivePaliMinChars: 40` trong `source/layers.yaml` không thấy segment nào; tôi đọc Pāli thật của từng khoá từ `.cache/upstream/suttacentral/` theo `sourcePath` trong catalog, đối chiếu tay với bản Việt, rồi quét máy: tập khoá Việt bằng đúng tập khoá Pāli (17/17, đúng exact ID, không orphan), mọi giá trị NFC và không rỗng, ngoặc kép cong cân trên cả bài, không có `(…)`, dấu lược khớp Pāli từng khoá.
  - |-
    **Không thể tuyên bố technical gate pass.** Đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tiêu chí 10 bị chặn ở 9.6: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, NFC, ngoặc kép cân cả bài và YAML sạch. Người biên tập phải chạy lại bốn lệnh trên trước khi đổi trạng thái.
  - |-
    **Tính nhất quán đạt được và đây là điều đáng ghi nhất của bài.** Tôi đã đối chiếu từng khoá: `thag3.15:1.1` đến `:3.4` trùng **nguyên văn** với `thag3.3:1.1` đến `:3.4` (mười ba vế, khác ở dấu câu thôi), và bản Việt dịch **giống hệt từng vế**. Đây là kết quả mong muốn: cùng một Pāli thì phải có cùng một cách dịch, nếu không bài kinh tự mâu thuẫn. Hệ quả bắt buộc: lỗi ở `1.3` của `thag3.3` cũng là lỗi ở `1.3` của bài này, và phải sửa ở cả hai cùng lúc.
  - |-
    **Một mất nghĩa thật, đã ghi, không sửa.** `1.3` `Sukhā so dhaṁsate ṭhānā` — `Sukhā` và `ṭhānā` đều là số nhiều địa phương, cả vế là *những trạng thái hạnh phúc bị thiêu đốt*. Bản Việt viết *vô ích, người ấy bị thiêu đốt* — bỏ tân ngữ *trạng thái hạnh phúc* và thêm từ *vô ích* không có trong Pāli. Bản Anh đã ghim giữ được mạng nghĩa (*has lost the causes for happiness*). Tôi hạ `semantic_fidelity` vì lý do này và không nâng điểm chỗ khác để bù.
  - |-
    **Hai dạng khác nhau, và cả hai hợp lý.** `Susukhaṁ vata nibbānaṁ` dịch *Nibbāna tịch diệu biết bao*: `vata` là tiếng cảm thán mà *biết bao* chuyển được sắc thái nhưng không còn dạng kêu; `Susukhaṁ` gộp thành *tịch diệu* là gom hai vế của Pāli (`susukha` là hai mệnh đề) thành một. Cả hai đều là lựa chọn biên tập, không phải lỗi; tôi ghi để người đọc biết là lựa chọn.
  - |-
    **Bốn khoá tiêu đề.** `:0.1` để nguyên *Theragāthā 3.15* như 139 tiêu đề Theragāthā khác trong tầng; `Tikanipāta` → *Bộ Ba Bài Kinh* (18 lần trong tầng, không có cách thứ hai) và `Paṭhamavagga` → *Phẩm Thứ Nhất*. Đây là tên đã chốt theo chuỗi *The Book of the Ones* / *The Book of the Twos* mà tầng tên SuttaCentral cung cấp.
  - |-
    **Tầng Anh.** 12/13 khoá nội dung có prose Sujato, im lặng ở `3.5` dòng bảng hiệu. Bản Anh ở `2.3–2.4` đảo chiều (`The wise will recognize` ở `2.3`, `one who talks without doing` ở `2.4`), bản Việt theo Pāli và dịch đúng chiều.
