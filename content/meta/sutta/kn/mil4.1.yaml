  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ: :4.4 dhammarājassa sāsane → trong giáo pháp của bậc Pháp
  vương, lấy nguyên văn thag6.3:3.4 (Pāli y hệt). Cùng cặp ý nghĩa với :8.2 và :8.3
  (arahāmahaṁ rahassakaṁ suṇituṁ sumantane upagate) trong bài này, tôi dùng nhất quán
  một cách diễn đạt cho cả ba, kể cả khi Pāli lặp lại đúng nguyên văn ở :8.3.

  THUẬT NGỮ. Visamaṭṭhāna → chỗ gồ ghề, theo mil3.4.5:6.3 và sn2.22:6.3 đã có (con
  đường gồ ghề). paṭicchanna → bị che phủ (an2.16:3.2, an3.13:4.5 đã có dùng che giấu /
  che phủ). mahāpathavī nikkhepaṁ → quả đất được đất lên gò (0 tiền lệ; giữ hình ảnh
  gốc vì cả câu ẩn dụ đòi hỏi nó). devevisitta/devanissita → chỗ của chư Thiên, chỗ
  chư Thiên trú. mettābhāvanā → tu tập tình thương, iriyāpatha → dáng đi ngay thẳng.

  BẤT ĐỊNH ĐÃ GHI. (a) :7.1 pabhātāya rattiyā uddhaste aruṇe sīse: Pāli ghi sīse là mặt
  trăng, nhưng đặt trong câu sớm hôm (pabhātāya rattiyā) và nối với uddhaste (vừa mọc
  lên) thì chỉ hợp lý với mặt trời; tôi dịch mặt trời đỏ vừa mọc lên và ghi lại ở đây
  thay vì giải thích trong thân kinh. (b) :2.4 tipeṭaka (0 tiền lệ): thường dịch là tài
  xế, tôi dùng tên tài xế; trong mạch truyện đây người kể là người hành quân của Nāgasena.
  (c) :1.1 vetaṇḍī (0 tiền lệ): tôi dịch giọng nói trong vắt. (d) :3.1 Navaṅgaṁ
  anumajjanto (0 tiền lệ, không song bản ở đâu trong corpus): tôi dịch Ta lần theo chín
  phần; không xác định được chín phần nào là gì, nên không diễn giải thêm. (e) :7.2 imaṁ
  sattāhaṁ mayā na rājattho anusāsitabbo: câu bị động và chủ ngữ bị lược (không có ai để
  làm việc mà ta không được dạy dỗ); tôi dịch ta không phải việc của một bậc vua để đi
  dạy dỗ, giữ đúng hướng bị động mà không thêm chủ thể nào.

