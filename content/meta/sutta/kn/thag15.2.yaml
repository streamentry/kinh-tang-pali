    THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
      · `nāga` → giữ nguyên nāga, không dịch (theo `an6.43`, bài song song cùng tầng: nāga là tên gọi chung và là điều Đức Thế Tôn định nghĩa lại; đo toàn tầng: `nāga` được dịch voi khi nghĩa voi rõ như `ud4.4`, `ud4.5`, dịch rồng khi nghĩa rắn rõ như `ud2.1`, `snp2.14`, và giữ nguyên ở những chỗ là tên gọi chung hay danh hiệu như `ud8.7`; ghi chú thuật ngữ của `an6.43` có danh sách đầy đủ hơn). `mahānāga` → đại nāga (`6.3`, `15.3`), theo `an6.43:10.3`, `19.3`. Sujato dịch giant; Hòa thượng Thích Minh Châu dịch voi cho mọi chỗ; không theo cách nào, để không thêm nghĩa mà Pāli không nói.
      · `āgu` → điều tội lỗi (`5.2`, theo `an6.43:9.2`; Sujato monstrous). `sampajañña` → tỉnh giác (`6.1`; `dn34:1.3.3`, `dn33:1.9.21` Niệm và tỉnh giác). `soracca` → ôn hòa; `avihiṁsā` → không hại (theo `an6.43:9.3`). `upekkhā` → xả. `saddhā` → đức tin. `vīmaṁsā` → sự quán xét. `dhammacintanā` → suy xét về Pháp. `viveka` → viễn ly (114 khoá, so độc cư 10, theo `thag14.2`).
      · `anavajja`/`sāvajja` → không đáng chê/đáng chê (theo `an6.43:14.1`–`14.2`, `kp5:7.3`). `sannidhi` → chứa trữ (theo `an6.43:14.4`, `dn1`, `dn2`). `anapekkha` → không luyến tiếc (theo `an6.43:15.4`, `dn25:13.16`). `saṁyojana` → kiết sử (`3.1`, `11.1`; tầng đã dịch kiết sử cho `saṁyojana`: `snp1.9`, `snp2.13`, `snp3.9`, `dhp397`, riêng `thag6.8:1.3` dịch sợi dây trói buộc; theo đa số 4/5). `bandhana` → trói buộc. `nekkhamma` → xuất ly (theo `an6.43:7.3`). `jhāyī` → bậc hành thiền. `assāsa` → hơi thở (xem bất định). `samāhita` → định tĩnh (`8.2`–`9.2`; `an4.30:9.2` được định tĩnh, `an6.43:12.2`–`13.2`). `saṁvuta` → thu thúc.
      · `puṇḍarīka` → hoa sen trắng (`tha-ap162:1.4`, `tha-ap196:2.3`, `tha-ap281`), `paduma` → hoa sen (theo `an6.43:17.4`). `loke jāto` → sinh ra trong đời; `buddho` → bậc Giác Ngộ (`13.2`, theo `an6.43:17.2`). `upalippati` → bị làm lấm nhiễm (theo `an6.43:16.3`, `17.3`).
      · `anāhāra` → không còn nhiên liệu (theo `an6.43:18.2`), `aṅgāra` → than hồng, `santa` → lắng tắt, `nibbuta` → đã tắt (theo `an6.43:18.4`; `nibbuta` đặt cạnh `parinibbissati` ở `16.4` dịch nhập Niết-bàn như `thag14.2:14.4` và `an6.43:20.4`). `viññū` → các bậc trí (theo `an6.43:19.2`; tầng ngoài bài đó có đa số người có trí, xem `thag14.2`, nhưng cùng câu kệ giữ cách dịch của bài song song). `anāsava` → không lậu hoặc (theo `an6.43:20.2`, `20.4`). `vīta-` (`rāga`/`dosa`/`moha`) → đã lìa tham, đã lìa sân, đã lìa si. `sarīra` → thân.
      · `Soḷasakanipāta` → Bộ Mười Sáu Bài Kinh (khuôn thag đã dịch: Bộ N Bài Kinh, `thag14.2:0.2`, `thag14.1:0.2`). `Paṭhamavagga` → Phẩm Thứ Nhất. `0.4` theo khuôn Kinh Kệ Của Trưởng Lão X (194/245 khoá `:0.4` của thag đã dịch). `16.6` `niṭṭhito` → đã khép lại (7/14 khoá `niṭṭhito` của thag đã dịch, `thag7.5` đến `thag14.2`; đã hoàn tất 3 khoá, mỗi dạng còn lại 1 khoá). `17.0` `Tatruddānaṁ` → Tóm tắt ở đây (13/14 khoá `Tatruddānaṁ` của thag đã dịch; ngoại lệ `thag2.49:4.0`). `mahiddhika` → có đại thần thông (bốn kệ tóm tắt thag cùng công thức, xem phép 3; toàn tầng đa số khác là đại thần lực 83 so 42).

    KHÁC BIỆT ĐÃ PHÂN XỬ (đối chiếu Sujato và `an6.43`).
      (1) `4.1` `Sa ve accaruci nāgo`: bài `an6.43:8.1` đọc `Sabbe accarucī nāgo`; Pāli bài này là `Sa ve`, không có `sabbe`. Sujato dịch That giant outshines all (thêm chữ all). Bản Việt dịch vị nāga ấy quả thật chói sáng vượt trội, không thêm chữ tất cả; vật so sánh được nêu ở `4.2` (các núi đá khác) và `4.3` (trong tất cả những vị mang tên nāga).
      (2) `4.2` `himavāvaññe siluccaye`: tách `himavā` + `aññe` (vị trí cách, giữa những ngọn đồ sộ khác). Bản Việt dịch như Himavān giữa các núi đá khác; `an6.43:8.2` đọc `himavāññe` dịch vượt trên các núi đá khác, chỉ khác ở động từ so sánh, đã có ở `accaruci`.
      (3) `6.1`–`6.2`: Pāli bài này là `Sati ca sampajaññañca, caraṇā nāgassa tepare`, còn `an6.43:10.1`–`10.2` là `Tapo ca brahmacariyañca, caraṇā nāgassa tyāpare` (khổ hạnh và phạm hạnh). Sujato bài này dịch Mindfulness and awareness. Hai cặp chân khác nhau giữa hai bài, nên dịch riêng.
      (4) `7.3` `Dhammakucchisamāvāso`: `an6.43:11.3` đọc `Dhammakucchisamātapo` (khác chữ cuối). Sujato dịch giống y ở cả hai bài (the sacred hearth of the Dhamma), nên Sujato không phân biệt hai chữ. Tôi dịch theo chữ Pāli của bài này: `samāvāsa` là nơi ở chung, nơi cư ngụ (từ `vāsa`), thành bụng là nơi Pháp cư ngụ; không dùng lò lửa của bài `an6.43` vì `samāvāso` không có chữ lửa. Xem bất định.
      (5) `9.1` `Sayaṁ samāhito nāgo`: `an6.43:13.1` đọc `Seyyaṁ`. Bản Việt dịch khi nằm cho đủ bốn tư thế (đi, đứng, nằm, ngồi); xem bất định.
      (6) `13.1` `Tatheva ca loke jāto`: `an6.43:17.1` đọc `loke sujāto` (khéo sinh ra). Pāli bài này không có `su-`, nên dịch bậc sinh ra trong đời, không thêm khéo.
      (7) `14.1`–`14.3`: Pāli bài này là `Mahāgini pajjalito, anāhāropasammati; Aṅgāresu ca santesu`, `an6.43:18.1`–`18.3` là `Mahāginīva jalito, anāhārūpasammati; Saṅkhāresūpasantesu`. Sujato bài này dịch the coals have gone out (đúng chữ `aṅgāra`); `an6.43` dịch các hành. Bản Việt theo chữ Pāli bài này: than hồng đã lắng tắt, không dùng các hành.
      (8) `16.4` `Parinibbissatyanāsavo”ti`: chỉ khác `an6.43:20.4` ở sandhi (`-ssatyanāsavo` và `-ssati anāsavo`); dùng lại cách dịch.

    BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
      · `7.3` `Dhammakucchisamāvāso`: `samāvāsa` có thể là nơi ở chung (cùng cư ngụ) hoặc nơi trú ngụ. Tôi dịch nơi cư ngụ; Hòa thượng Thích Minh Châu (theo ghi chú ở `an6.43`) dịch bụng là chỗ chứa pháp, gần cách này. Sujato giữ the sacred hearth. Chưa phân xử trọn vẹn; đổi sang chỗ chứa Pháp chỉ sửa một khoá.
      · `9.1` `Sayaṁ samāhito nāgo`: `sayaṁ` thường là chính mình (tự mình); nhưng ở vị trí giữa `gacchaṁ` (đi), `ṭhito` (đứng), `nisinno` (ngồi) thì đọc là nằm (liên hệ `seyyaṁ`; `an6.43:13.1` viết `seyyaṁ`), và Sujato dịch lying down. Giữ khi nằm; nếu `sayaṁ` đúng là chính mình thì câu thành nāga tự mình định tĩnh, nhưng khi ấy bốn tư thế thiếu một. Tầng không có tiền lệ trực tiếp cho `sayaṁ` ở dạng này.
      · `2.2` `sabbadhammāna pāraguṁ`: đo trên tầng, 7 khoá cùng Pāli: vượt qua (có hoặc không chữ bờ kia) 5, đến hoặc đạt đến bờ kia 2 (`an6.43:6.2`, `tha-ap513:1.4`). Tôi theo `an6.43:6.2` vì cùng câu kệ. Hai cách cùng nghĩa (đi đến bờ kia của mọi pháp); nghiêng sang đa số vượt qua chỉ là chọn từ, không đổi nghĩa.
      · `3.2` `vanā nibbanamāgataṁ`: chơi chữ `vana` (rừng, nghĩa bóng là tham ái) và `nibbana` (không còn rừng, gần `nibbāna`). Tôi dịch sát chữ từ rừng rậm đã đến nơi không còn rừng rậm (theo `an6.43:7.2`); Sujato dịch escaped from entanglements; `tha-ap103:1.4` dịch từ chốn rừng sâu đi đến nơi tịch tịnh. Không đưa Niết-bàn vào thân kinh.
      · `4.1` `accaruci`: dạng quá khứ/không xác định của `ati-ruc` (chói sáng vượt). Không có tân ngữ trong Pāli bài này; vật được vượt là các núi (`4.2`) và những vị cùng tên (`4.3`). Tôi dịch chói sáng vượt trội, thì hiện tại nghĩa tự nhiên, như Sujato (outshines). Tầng không có tiền lệ trực tiếp cho dạng này.
      · `8.1` `assāsarato`: `assāsa` là hơi thở (Sujato breath) nhưng cũng có nghĩa là sự an ủi, sự nhẹ nhõm. Theo hơi thở như `an6.43:12.1`.
      · `2.4` `iti me arahato sutaṁ`: `arahato` có thể là từ bậc A-la-hán (xuất xứ) hay về bậc A-la-hán; theo `an6.43:6.4`, từ bậc A-la-hán (Sujato so I've heard from the perfected one).
      · `15.4` `nāgaṁ nāgena desitaṁ`: bậc nāga do nāga thuyết giảng, giữ cả hai cách hiểu (nāga là đối tượng được nói đến, nāga là người nói), như `an6.43:19.4`.
      · `13.4` `toyena padumaṁ yathā`: thứ tự Pāli đặt `toyena` trước `paduma`; dịch như hoa sen không bị nước làm lấm nhiễm, lấy động từ của `13.3` làm chung cho cả vế so sánh. Không thêm chữ nào ngoài động từ đó.
      · `17.1` `Koṇḍañño`: viết Koṇḍañña theo Pāli; vị này là Aññāsikoṇḍañña của bài `thag15.1` (tiêu đề Pāli `Aññāsikoṇḍaññattheragāthā`), nhưng Pāli ở đây chỉ nói `Koṇḍañño`, nên không thêm chữ Aññāsi.

