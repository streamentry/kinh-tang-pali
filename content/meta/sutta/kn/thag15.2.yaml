  Phạm vi: đủ 75/75 khoá của bài (4 khoá `:0` tiêu đề, 64 khoá kệ `1.1`–`16.4`, `16.5` dòng bìa, `16.6` dòng kết bộ, `17.0` tiêu đề kệ tóm tắt, `17.1`–`17.4` kệ tóm tắt), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã đọc đối chiếu cả 75 cặp Pāli↔Việt, không đọc mẫu.

    ⚠️ MẪU SỐ COVERAGE THEO CỔNG = 0 — CỔNG NÀY KHÔNG ĐO ĐƯỢC GÌ. `source/layers.yaml` đặt `substantivePaliMinChars: 40` và bỏ khối `:0`. Khoá Pāli dài nhất của bài chỉ 26 ký tự (mỗi pāda một khoá), nên 0 khoá đạt ngưỡng. Đây là "không đo được gì", không phải "không cần ghi nhận gap". Tôi không dùng nó làm căn cứ publish mà đo thô riêng như dưới đây.

    COVERAGE ENGLISH THÔ (do người biên tập tự phán) — tra tầng đã ghim, không suy từ tên thư mục. `english-sujato` có tệp cho bài này (manifest có `sutta/kn/thag/thag15.2_translation-en-sujato.json`), cùng đúng 75 khoá ID với Pāli, cùng thứ tự. Trên 70 khoá thân (bỏ 4 khoá `:0.x` và khoá `17.0`), Sujato có prose ở 64/70 = 0,914; trên mọi 75 khoá: 68/75 = 0,907. Ngưỡng 0,80 của kho đạt trên phép đo thô này. Bảy khoá Sujato để trống: `16.5` (dòng bìa), `16.6` (kết bộ), `17.0`–`17.4` (cả khối kệ tóm tắt `Tatruddānaṁ`). Khối `17.x` do đó chỉ có Pāli và tiền lệ các bài thag cùng bộ làm chỗ dựa, không có bản Anh nào để đối chiếu. `english-project`: không có tệp cho bài này (không cần lấp, vì phần Sujato để trống là dòng bìa và kệ tóm tắt, không phải thân kệ). `vietnamese-current`: vắng tại commit đã ghim (bilara chỉ có Pháp Cú), đặc điểm của cả tầng ở `thag`. Bản Việt nguyên bài của sc-data chỉ dùng tra cứu toàn văn, không căn lề theo khoá, nên không được tính là tầng tham khảo. Không có entry trong `reference-gaps.yaml`; mẫu số bằng 0 nên cổng không có gì để ghi nhận.

    BÀI SONG SONG TRONG TẦNG. Mười sáu bài kệ của bài này (`1.1`–`16.4`) là bài kệ Tôn giả Udāyī đọc ở `an6.43:5.1`–`20.4`, với một số khác biệt chữ Pāli (liệt kê dưới). Bài `an6.43` đã có bản Việt trong tầng; với những khoá Pāli trùng nguyên văn (bỏ khác biệt dấu câu và hoa thường), bản này dùng lại cách dịch đó để cùng một câu kệ không có hai bản Việt. Với những khoá Pāli khác chữ, tôi dịch riêng theo chữ của bài này (liệt kê ở mục khác biệt). Tính theo toàn tầng (kn, sn, an, dn, mn): 55 khoá của bài có tiền lệ Pāli trùng nguyên văn, 212 cặp, trong đó 179 cặp bản Việt trùng với bản này (sau khi bỏ dấu câu và hoa thường) và 33 cặp khác, đã phân xử bên dưới. Hai quyết định thuật ngữ dùng lại từ `an6.43` mà tầng ngoài bài đó có đa số khác: `nāga` giữ nguyên không dịch (xem thuật ngữ) và `pāraguṁ` (`2.2`) dịch đến bờ kia của mọi pháp (xem thuật ngữ).

    CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá), nên đối chiếu được ở mức khoá. Sujato dịch `nāga` là giant; bản Việt giữ nguyên nāga vì lý do thuật ngữ chung với `an6.43` (người đọc đã thấy chữ nāga được Đức Thế Tôn định nghĩa lại ở đó; ở đây không có lời dẫn, và dịch voi hay giant hay rồng đều thêm hoặc làm hẹp nghĩa mà Pāli không nói). Hai chỗ Sujato nối câu khác trật tự Pāli: (a) `6.1`–`6.2`: Sujato đặt Mindfulness and awareness are his two other feet; bản Việt giữ đúng ranh giới khoá và để `caraṇā nāgassa tepare` thành vế riêng ở `6.2`. (b) `7.1`–`7.2`: Sujato nối `paññā` với `vīmaṁsā dhammacintanā` bằng dấu gạch ngang; bản Việt giữ dấu gạch ngang ở cuối `7.1` đúng như tiền lệ `an6.43:11.1`–`11.2`, vế `7.2` đứng làm đồng vị của tuệ.

    NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
      1. Tập khoá: Việt 75 = Pāli 75, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
      2. Nháy đơn và kép khớp Pāli từng khoá: 0/75 lệch. Tổng: `“` 1/1, `”` 1/1, `‘` 0/0, `’` 0/0. Lời kệ mở nháy kép ở `1.1`, đóng ở `16.4` (Pāli `”ti`). Bài không có lời nói lồng nào.
      3. Pāli trùng nguyên văn TRONG CHÍNH bài: 0 nhóm trùng (khoá thân, bỏ `:0.x` và dấu câu), nên phép này chạy rỗng, không phải "đạt". Các khối `8.3`–`9.2` có cấu trúc song song (đi, đứng, nằm, ngồi) nhưng từng khoá Pāli khác nhau; tôi đọc riêng chuỗi bốn tư thế và giữ một khuôn `khi X, nāga định tĩnh`. Pāli trùng nguyên văn ở bài khác (xem mục bài song song): 55 khoá có tiền lệ, 212 cặp, 33 cặp bản Việt khác. Phân xử 33 cặp khác: 13 cặp ở `0.3` `Paṭhamavagga` (11 bài thag đặt tên trưởng lão ở `0.3`, 2 bài ghi thêm số thứ tự đầu dòng; bài này theo Pāli và khuôn của `thag12.1`, `thag14.1`, `thag14.2`: `0.3` là tên phẩm); 6 cặp `2.2` `sabbadhammāna pāraguṁ` (5 bài dịch vượt qua ... pháp, trong đó 2 có chữ bờ kia, và 2 bài dịch đến/đạt đến bờ kia, gồm `an6.43:6.2`: tôi theo `an6.43` vì là cùng câu kệ; không đủ chứng cứ chọn một trong hai, ghi ở bất định); 2 cặp `1.2` (`pv42:3.2`, `tha-ap432:1.2` dịch tự chế ngự, đã chuyên nhất) và 1 cặp `1.3` (`tha-ap432:1.3`, thêm chữ con): tôi theo `an6.43:5.2`–`5.3`; 2 cặp `6.1` (khác hoa thường/thêm chữ chánh hay là); 2 cặp `8.2` (`thag4.2:2.4`, `an4.30:9.2`, khác trật tự); 1 cặp `3.2` (`tha-ap103:1.4`, từ chốn rừng sâu đi đến nơi tịch tịnh: tôi theo `an6.43:7.2`, sát chữ vana/nibbana hơn); 1 cặp `11.1` (`dhp31:3`, vế mở của một câu khác, Pāli chỉ trùng ở một pāda); 1 cặp `12.4` (`dhp58:4`, thơm sạch và đẹp lòng người: theo `an6.43:16.4`); 2 cặp `16.4` (`thag1.100:1.4`, `thag5.11:5.4`: tôi theo `an6.43:20.4` và `thag14.2:14.4` cùng vế nhập Niết-bàn; `thag5.11:5.4` dịch hoàn toàn tịch diệt, ngữ cảnh riêng); 1 cặp `17.0` (`thag2.49:4.0`, ngoại lệ so với 13/14 khoá thag dịch Tóm tắt ở đây); 1 cặp `17.2` (`thag14.2:15.2` dịch đại thần lực; bài này theo `thag12.2:13.2` đại thần thông, cùng Pāli nguyên văn; đo ở phạm vi gần nhất, các câu thag có `mahiddhika` đã dịch: `thag2.10:3.6`, `thag2.20:3.6`, `thag12.2:13.2`, `thag13.1:14.2` đều là đại thần thông, 4 khoá, so 1 khoá đại thần lực ở `thag14.2:15.2`; toàn tầng (kn, sn, an, dn, mn) cho đa số khác: đại thần lực 83, đại thần thông 42, dạng khác 20. Chọn phạm vi gần nhất vì đây là công thức kệ tóm tắt của riêng bộ thag; xin người biên tập cân nhắc đồng bộ `thag14.2:15.2` về đại thần thông, hoặc ngược lại).
      4. Dấu lược: Pāli có `…` ở 1 khoá (`16.5`), Việt có đúng khoá đó; `…pe…` đầy đủ 0; `(…)` trần 0 ở Pāli nên 0 ở Việt. Lỗi = 0/75. Khoá bìa `16.5` giữ hai dấu lược `… Trưởng lão Udāyī …` không có dấu chấm cuối, vì Pāli `… Udāyī thero …` không có dấu chấm cuối (khác `thag15.1:16.5` có `….`); đúng tiền lệ `thag14.2:14.5`.
      5. Số Pāli (tự tính): `Soḷasa` (`0.2` `Soḷasakanipāta`, `16.6` `Soḷasakanipāto`, `17.3` `Soḷasamhi`) = 16 (cùng tiền lệ `thag14.2` dịch `Cuddasa` = 14 thành Bộ Mười Bốn Bài Kinh) ⇒ Bộ Mười Sáu Bài Kinh. `dve ca tiṁsa` (`17.4`) = `dve` 2 + `tiṁsa` 30 = 32 ⇒ ba mươi hai bài kệ. Đối chiếu độc lập: bài này có 16 kệ đánh số `1.x`–`16.x`, bài `thag15.1` có 16 kệ đánh số `1.x`–`16.x`; 16 + 16 = 32, khớp. `dve` (`17.2`) = 2 ⇒ hai vị trưởng lão (Koṇḍañña và Udāyī). `duve` (`5.4`, `pādā nāgassa te duve`) = 2 ⇒ hai chân; `tepare` (`6.2`) = `te` + `apare` ⇒ hai chân kia; hai cặp chân (4 chân của nāga) khớp. Không có số nào khác trong thân kệ.
