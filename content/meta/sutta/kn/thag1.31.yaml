notes: |-
  9 khoá, dấu lược `…` ở `1.5` giữ nguyên, bản dịch phủ đủ.
  
  **Lần nữa, bản dịch bám Pāli ở chỗ Sujato lệch.** Sujato đặt `1.3` = *one should mindfully endure* và `1.4` = *like an elephant at the head of the battle*, cũng **đảo** so với Pāli (`Nāgo saṅgāmasīseva` = "như voi ở đầu trận", `sato tatrādhivāsaye` = "hãy chánh niệm mà cư trú"). Bản dịch đặt đúng: `1.3` → *Như con voi đứng đầu trận*, `1.4` → *hãy chánh niệm mà cư trú nơi ấy*. Đây là lần thứ hai trong lô thấy Sujato lệch chiều ở Trưởng Lão; tôi ghi lại vì nó là bằng chứng cho việc Pāli root phải là authority, không phải Sujato.
  
  **Hai tầng nghĩa của `tatrādhivāsaye` giữ cả hai.** `adhivāsa` vừa là động từ "cư trú ở" vừa có sắc thái mệnh lệnh khuyên nhủ; bản dịch dùng *hãy … cư trú* là đúng cả hai. Đây là điểm tinh tế và bản dịch không làm phẳng.
  
  **`Phuṭṭho ḍaṁsehi makasehi` → *Bị ruồi muỗi hàm hạ*** ✓ — `ṭaṃsa` (bọn, hạt rụng) và `makasa` (muỗi) là hai loài khác nhau và cả hai đều có mặt; không gộp thành một.
  
  **`araññasmiṁ brahāvane` → *trong rừng hoang, khu rừng vút cao***. `brahāvana` = "rừng lớn, rừng rộng lớn". Chữ *vút* thêm vào là hơi thừa (Pāli không có ý cây cao vút), nhưng là cách nói tự nhiên và không đổi nghĩa; tôi trừ nhẹ ở `semantic_fidelity` và `vietnamese_clarity`.
  
  **Tên riêng:** `Gahvaratīriya` giữ nguyên dấu, khớp cả `0.4` và `1.5`.
  
  **Tầng Anh** có mặt đủ bốn vế thân. `Catutthavagga` → *Phẩm Thứ Tư* khớp 2 tệp cùng phẩm.
  
  **Tầng Việt**: không có Thích Minh Châu cho Trưởng Lão ở commit đã ghim.
