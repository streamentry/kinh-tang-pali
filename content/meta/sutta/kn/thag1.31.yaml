notes: |-
  Khung bốn khối tiêu đề giữ y hệt các bài thag1 đã có: 0.1 giữ Pāli kèm số,
  0.2 Bộ Một Bài Kinh (258 bài), 0.3 tên phẩm theo thứ tự, 0.4 Kinh Kệ Của Trưởng Lão
  với chữ Lão hoa (89 bài; bốn bài lẻ dùng lão thường). Dòng kết 1.5 giữ HAI dấu lược
  như Pāli (BRIEF_VI3 §10.1, không mở rộng), mở nháy kép ở 1.1 và đóng ở 1.4 y hệt Pāli.
  Ba vế 1.1-1.3 trùng nguyên văn với thag3.9:2.1-2.3 và thag15.1:12.1-12.3. Hai bài kia
  CHƯA có bản Việt, nên tôi không có nguyên văn để dùng lại; khi chúng được dịch, ba
  nơi phải khớp. Tôi ghi nghĩa mình chọn ở đây để lát sau dùng lại.
  araññasmiṁ brahāvane có hai tiền lệ và chúng lệch nhau: an5.40:2.2 dịch trong rừng
  hoang, khu rừng vút cao, còn an3.48:3.2 dịch giữa rừng rậm cây xanh. Tôi theo an5.40 vì
  cùng gom hai danh từ vào một vế, khớp hình dạng câu kệ hơn.
  Nāgo ở 1.3 là voi, không phải rồng. Tầng đang dùng cả hai nghĩa cho chữ này: an3.70
  dịch rồng là naga, còn nhiều bài dịch nāga là voi, ví dụ hẳn là dấu của một con voi
  đực lớn. Ở đây saṅgāmasīseva nghĩa là làm đầu trận, chỉ voi mới hợp, nên tôi dịch voi
  và giữ nguyên trong đó. Đây là chỗ tôi cố ý chọn nghĩa theo ngữ cảnh.
  Phuṭṭho ḍaṁsehi makasehi dịch Bị ruồi muỗi hàm hạ; np4.16:10.3 đã dùng ruồi muỗi.
  sato tatrādhivāsaye dịch hãy chánh niệm mà cư trú nơi ấy; Sujato dịch theo hướng
  mindfully endure, tức chịu đựng, còn tôi theo Pāli vì adhivās là cư trú.
  Bất định đã ghi: Sujato đảo hai vế, đặt sato tatrādhivāsaye ở 1.3 và Nāgo ở 1.4,
  nên bản Anh không còn là trật tự Pāli. Tôi giữ đúng thứ tự Pāli.
  Kỹ thuật: 9/9 khoá, không rỗng, thứ tự khớp Pāli, NFC, số dấu lược bằng Pāli từng
  khoá, nháy kép cân trên cả bài, không còn (…). save_vi sạch, chạy lại hai lần
  idempotent. Vì mọi khoá Pāli của Trưởng Lão ngắn hơn 40 ký tự nên cần trong kiểm()
  rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá bằng script riêng. Không
  chạy npm run validate|test|check|build (lát này cấm) nên technical_integrity 9.5.
  Tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên không có bản Hòa thượng
  Thích Minh Châu cho Trưởng Lão; bản Anh Sujato có mặt và tôi đã đọc ở tất cả tám bài
  này. Ô English trống ở dòng kết không phải sự đồng thuận, mà là chỗ Pāli phải tự đứng
  vững.

