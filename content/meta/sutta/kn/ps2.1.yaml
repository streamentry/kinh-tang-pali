  Cấu trúc bài: 1.x duyên khởi tại Kosambī, Tôn giả Ānanda gọi các tỳ-kheo; 2.x–7.x lời tuyên bố của Tôn giả về bốn con đường (chỉ đi trước quán, quán đi trước chỉ, chỉ và quán song hành, tâm bị trạo cử về pháp chi phối), mỗi con đường theo khuôn: đạo phát sinh, thực hành, tu tập, làm cho sung mãn, các kiết sử được đoạn trừ, các tùy miên tiêu tan; 8–13 giải thích con đường thứ nhất (khoá 8.x–13.x là bản đầy đủ, 14–17 là bản lược cùng khuôn, nên Pāli đã có nhiều khoá trùng nguyên văn); 18–20 con đường thứ hai; 21–35 con đường thứ ba với mười sáu phương diện (từ đối tượng đến tánh không); 36–39 phần trạo cử về pháp (ánh sáng và chín điều tiếp theo); 40–44 kệ; 45 kết luận và lời kết bài.

  Số Pāli, tự tính từ danh sách trong chính bài: soḷasa (21.2, 35.12) = 16. Danh sách ở 21.3 liệt kê 17 mục (đối tượng, phạm vi, từ bỏ, xả bỏ, xuất khỏi, quay đi, an tịnh, thù thắng, giải thoát, vô lậu, vượt qua, vô tướng, vô nguyện, tánh không, nhất vị, không vượt quá, song hành); các phần 22–35 chỉ giảng 14 mục đầu, ba mục sau (nhất vị, không vượt quá, song hành) hiện ra ở câu kết lặp của từng phần. Con số 16 là của Pāli ghim, bản Việt giữ 16 và không tự sửa thành 17. Số nhỏ khác đã đối chiếu từng khoá: bốn con đường (catūhi maggehi, 2.1, 2.2, 7.1) = bốn mục ở 3–6; ba kiết sử (tīṇi 13.3) = thân kiến, nghi hoặc, giới cấm thủ; hai tùy miên (13.5) = kiến, nghi; hai kiết sử (dve 13.7, 13.11) = dục ái, sân; hai tùy miên (13.9, 13.13) = dục ái, sân; năm kiết sử (pañca 13.15) = sắc ái, vô sắc ái, mạn, trạo cử, vô minh = 5; ba tùy miên (tayo 13.17) = mạn, hữu ái, vô minh = 3; bốn sự tu tập (catasso, mọi khoá có bhāvanā) = bốn mục ở 8.8; mười điểm (dasa 42.1, 45.1): ánh sáng cộng chín điều ở 37.1 (trí, hỷ, khinh an, lạc, thắng giải, nỗ lực, thiết lập, xả, ưa thích) = 10; bốn điểm (catūhi ṭhānehi 45.1) = bốn cặp kệ 43–44. Không có số lớn.

  Thuật ngữ và tiền lệ (số đếm trên tầng; khi hai phạm vi cho đa số khác nhau thì nêu cả hai):
  - samatha → chỉ, vipassanā → quán, yuganaddha → song hành: theo ps2.9 (lực chỉ, lực quán) và tên phẩm Song Hành ở ps2.5, ps2.8, ps2.9; an4.170 dịch cùng công thức thành thi định đi trước quán, quán đi trước thi định, song song đồng hành (chưa dùng làm chuẩn vì dạng thi định lạ trong tầng). anupassanā → quán (quán vô thường, theo ps2.9:21.2 và ps3.8): vì vậy câu aniccato anupassanaṭṭhena vipassanā thành do ý nghĩa quán là vô thường, đó là quán; ở các phần 22–35 (anupassanaṭṭhena vipassanā không có aniccato) dịch do ý nghĩa quán sát, quán …
  - pubbaṅgama → đi trước (tầng chỉ có 5 khoá, cả 5 là an4.170 và ne6:13.4: an4.170 viết đi trước, ne6 viết có tuệ quán đi trước); samathapubbaṅgamaṁ vipassanaṁ bhāveti → tu tập quán có chỉ đi trước.
  - saññojana → kiết sử (119 trên 291 khoá có saññojana-/saṁyojana-; trói buộc 158, kết trói 16); anusaya → tùy miên (44 trên 93 khoá); byantīhonti → tiêu tan (theo an4.170, bốn khoá cùng công thức anusayā byantīhonti; an5.57 dịch tiêu trừ; trên toàn tầng 152 khoá có byanti- thì chấm dứt 70 · tiêu tan 26 · tiêu trừ 6, nhưng phần lớn ở ngữ cảnh khác); pahīyanti → được đoạn trừ (mn2:11.2, an5.57; đoạn trừ 4 · từ bỏ 5 · được đoạn 4 trên 9 khoá).
  - kāmarāgasaññojana → dục ái kiết sử, paṭighasaññojana → sân kiết sử, oḷārika → thô thiển, anusahagata → vi tế: theo ps2.5 và ps1.9 cùng công thức (6 khoá trong tầng ps); tầng ngoài ps viết kāmarāga là dục tham 22 · tham dục 20 · dục ái 7 trên 68 khoá, paṭigha là sân 36 · đối ngại 31 · va chạm 14 trên 119 khoá. rūparāga → sắc ái và arūparāga → vô sắc ái, cùng dạng với dục ái (tầng: tham sắc 6 · sắc ái 2 trên 13; tham vô sắc 3 · vô sắc ái 1 trên 4); bhavarāga → hữu ái. sakkāyadiṭṭhi → thân kiến (57 trên 68), vicikicchā → nghi hoặc (172 trên 218), sīlabbataparāmāsa → giới cấm thủ (19 trên 19); uddhacca → trạo cử (46 trên 172, ps2.9); māna → mạn; avijjā → vô minh.
  - sotāpatti/sakadāgāmi/anāgāmi/arahatta + magga → Dự lưu đạo, Nhất lai đạo, Bất lai đạo, A-la-hán đạo (ps2.5, ps1.9). maggo (số ít, đạo đang phát sinh) → đạo; catūhi maggehi (2.1, 7.1, bốn cách tu tập) → bốn con đường, để khỏi lẫn với bốn Thánh đạo. sañjāyati → phát sinh (phát sinh 4 · sanh ra 4 · sinh khởi 2 · sanh khởi 5 trên 17 khoá), chọn phát sinh để khác uppajjati → sinh khởi.
  - āsevati → thực hành (18 trên 28, tùy hành 10), bhāveti → tu tập, bahulīkaroti → làm cho sung mãn (176 trên 234; thường xuyên 16, làm cho nhiều 8, cùng dạng với ps3.4). Khuôn bốn sự tu tập ở 8.8, 14.9 dùng lại nguyên văn bản dịch ps3.8:3.2, 5.2, 14.2 (không vượt quá, nhất vị, chuyên chở sự tinh tấn thích ứng với chúng, thực hành).
  - ekaggatā → nhất tâm (22 trên 22), avikkhepa → không tán loạn (47 trên 53), samādhi → định; công thức santiṭṭhati sannisīdati ekodi hoti samādhiyati → an trú ngay bên trong, lắng xuống, nhất tâm và vào định (mn20, 23 khoá); āvuso → hiền giả (4.242 trên 4.754; các bạn 127); Evaṁ me sutaṁ → Tôi nghe như vầy (397 trên 456); Ghositārāma → tu viện Ghosita (25 · tinh xá Ghosita 9 trên 35).
  - mười lăm cách ở 10.2, 11.2, 12.2: āvajjati → hướng tâm đến; paccavekkhati → quán xét lại (ne17:15.1); adhiṭṭhahati → quyết định tâm (quyết định 21 · an trú 15 · kiên trì 4 trên 58, theo ps2.9 lực quyết định); adhimuccati → thắng giải bằng niềm tin (adhimokkha → thắng giải 15 trên 16, ps3.3, ps1.9; dạng động từ có quyết định 73 · tin tưởng 19 trên 123, chọn thắng giải để cùng gốc với adhimokkha ở 37.1); paggaṇhāti → phát khởi tinh tấn (nỗ lực 118 · phát khởi 69 trên 255); upaṭṭhāpeti → thiết lập niệm (thiết lập 30 · an lập 10 trên 104); samādahati → định tâm (định tâm 21 · an định 15 trên 51); pajānāti → biết rõ; abhijānāti → thắng tri, parijānāti → liễu tri (an6.61:3.5); pajahati → từ bỏ (223 trên 240); sacchikaroti → chứng ngộ (709 trên 961). Dạng danh từ paggaha → nỗ lực, upaṭṭhāna → thiết lập (ps3.3:13.6, ps1.9:10.2).
  - 9.2 và các khoá tương tự: dassana → thấy, abhiniropana → hướng tâm đến, pariggaha → thâu nhiếp, samuṭṭhāna → phát khởi, vodāna → thanh tịnh, paggaha → nỗ lực, upaṭṭhāna → thiết lập, avikkhepa → không tán loạn, theo ps2.5:1.3 và 3.1–3.7 (cùng tám nghĩa, cùng tám chi đạo). Chi đạo: chánh kiến, chánh tư duy (65 trên 65 khoá), chánh ngữ, chánh nghiệp, chánh mạng (131 trên 142), chánh tinh tấn, chánh niệm, chánh định.
  - ārammaṇa → đối tượng, gocara → phạm vi (ps2.5, ps3.3 nirodhagocara → có sự diệt làm phạm vi); pahāna → từ bỏ; pariccāga → xả bỏ (từ bỏ 18 · xả 6 · buông bỏ 2 · xả bỏ 1 trên 52 khoá; chọn xả bỏ để khác pahāna và vosagga); vuṭṭhāna → xuất khỏi (ps2.9:35.1); vivaṭṭana → quay đi (quay 12 trên 106; ps1.0:10.1); santa → an tịnh (236 trên 1.355); paṇīta → thù thắng (198 · cao quý 90 · tinh tế 57 · vi diệu 50 trên 636); vimutta → giải thoát; anāsava → vô lậu; taraṇa → vượt qua (30 · vượt 39); animitta → vô tướng (74 trên 285); appaṇihita → vô nguyện (10 · không hướng 9 trên 21); suññata → tánh không (không 45 · trống không 10 · tánh không 4 · tính không 4 trên 53, chọn tánh không ở danh từ và trống không ở tính từ suñña); ekarasa → nhất vị; anativattana → không vượt quá (ps3.8). sahagata → câu hữu (câu hữu 35 · tương ưng 11 · đi cùng 5 · đi kèm 2 trên 51), abhinivesa → chấp trước (25 trên 44), paṇidhi → ước nguyện (nguyện 42 · ước nguyện 3 trên 115). kāmāsava → dục lậu, avijjāsava → vô minh lậu; rāgavirāgā cetovimutti, avijjāvirāgā paññāvimutti → tâm giải thoát do ly tham, tuệ giải thoát do ly vô minh (ne19:5.9, ne19:7.x).
  - manasikaroto → tác ý (67 trên 108; chú tâm 19); yathābhūtaṁ nappajānāti → không biết như thật (162 trên 173); nirodha → diệt. Mười điều của trạo cử về pháp: obhāsa → ánh sáng, ñāṇa → trí, pīti → hỷ (722 trên 788), passaddhi → khinh an (97 · an tịnh 35 trên 170), sukha → lạc, adhimokkha → thắng giải, paggaha → nỗ lực, upaṭṭhāna → thiết lập, upekkhā → xả (446 trên 457), nikanti → sự ưa thích (tầng chỉ có nikanti nằm trong từ ghép; an7.49 dịch jīvitanikanti là sự ham muốn đời sống). ṭhāna → điểm (86 · chỗ 50 · phương diện 46 · nơi 39 · trường hợp 26 trên 480 khoá); kampati/pavedhati → dao động/run rẩy (dao động 23 · run rẩy 23 · chấn động 19 · rung động 18 trên 77), vikampati → rung động; sammoha → mê muội (12 · mê lầm 8 · si mê 2 trên 72); kilissati → ô nhiễm; saṅkhepa → thu rút (co rút, theo cách tầng dịch tâm co rút ở niệm xứ; tầng chỉ có 6 khoá chứa saṅkhepa); paricita → quen thuộc.
  - tiêu đề: Suttantaniddesa → Giải Thích Theo Kinh, Dhammuddhaccavāraniddesa → Giải Thích Phần Trạo Cử Về Pháp (theo ps3.2:7.0 và ps3.4:5.0, niddesa → giải thích; vāra → phần theo ne); kathā niṭṭhitā → được hoàn tất (ps2.9:40.26).

  Bất định, ghi ở đây mà không thêm vào thân kinh:
  (1) 18.3–18.4 và 19.2, 20.8: Pāli 18.3 kết bằng avikkhepo rồi 18.4 mở bằng Samādhi, nên câu ekaggatā avikkhepo samādhi bị cắt đôi qua ranh giới khoá; bản Việt giữ cắt như Pāli: 18.3 kết bằng dấu phẩy và 18.4 mở bằng là định. Cấu tạo vosaggārammaṇatā (sự lấy buông bỏ làm đối tượng của các pháp sinh khởi trong đó) dịch bám chữ; cách hiểu sát hơn là sự nhất tâm lấy buông bỏ làm đối tượng, chưa phân xử được từ Pāli một mình.
  (2) 9.2, 15.2, 15.3: sammādiṭṭhi và maggo cùng ở chủ cách; dịch đạo phát sinh là chánh kiến (và các chi khác). Cách hiểu khác là chánh kiến phát sinh làm đạo; nghĩa không đổi nhưng thứ tự chữ khác.
  (3) 36.3, 37.3, 38.4, 39.13, 39.14: aniccato upaṭṭhānaṁ dịch sự hiện khởi là vô thường (sự hiện ra của pháp dưới dạng vô thường), khác với upaṭṭhāna → sự thiết lập ở danh sách mười điều (37.1) và ở chi đạo (9.2) để giữ cách ps3.3, ps1.9; nếu người biên tập muốn thống nhất một từ thì đổi ở các khoá này. Tầng thiết lập 45 · sự thiết lập 14 · hiện khởi 1 trên 166 khoá có upaṭṭhān-.
  (4) 40–41: kệ liệt kê 11 mục (ánh sáng, trí, hỷ, khinh an, lạc, thắng giải, nỗ lực, thiết lập, upekkhāvajjanā, xả, ưa thích) trong khi 42.1 nói mười điểm và 37.1 chỉ nêu 9 mục cộng ánh sáng; upekkhāvajjanā (sự hướng tâm đến xả) dịch bám chữ, không tự nhập vào danh sách mười. Chủ ngữ của vikampati, kampati, pavedhati chỉ có ở 40.4 (cittaṁ); bản Việt thêm tâm ở 40.2 và 41.2.
  (5) 42.2: pariccitā dịch quen thuộc (đọc như paricitā) và thêm với chúng để thành câu; 42.3 dhammuddhaccakusalo dịch thiện xảo trong sự trạo cử về pháp.
  (6) 43.3–44.2: Pāli ghim có hai dòng Vikkhipati na kilissati giống hệt (43.3 và 44.1), nhưng một đằng bhāvanā parihāyati và một đằng bhāvanā na parihāyati; bản Việt dịch đúng chữ cả hai (tán loạn nhưng không ô nhiễm, tu tập suy giảm; tán loạn nhưng không ô nhiễm, tu tập không suy giảm) và không sửa. Hai câu như vậy mâu thuẫn nhau nên có thể văn bản đã lệch một chữ (nghi na hoặc vikkhipati ở 44.1); chưa có bản độc lập trong tầng để xác nhận. cavati cittabhāvanā dịch sự tu tập tâm rơi mất.
  (7) 45.1: cittassa saṅkhepavikkhepaviggahitaṁ dasa ṭhāne sampajānāti; bản Việt đọc là biết rõ mười điểm của tâm khi bị thu rút và tán loạn chi phối; có thể đọc saṅkhepavikkhepaviggahitaṁ là tân ngữ riêng (biết rõ cả sự chi phối của thu rút và tán loạn lên tâm, và biết rõ mười điểm).
  (8) 21.2/35.12: soḷasa (16) khác số mục ở 21.3 (17); xem phần số Pāli ở trên.
  (9) 2.1, 7.1: sabbaso catūhi maggehi etesaṁ vā aññatarena dịch thì hoàn toàn nhờ bốn con đường, hoặc nhờ một trong số đó; sabbaso có thể là toàn bộ (thành tựu A-la-hán hoàn toàn) hoặc tất cả bốn con đường, và cặp vā aññatarena có nghĩa nhờ ít nhất một trong bốn; giữ chữ, không giải thích thêm. an4.170 có công thức tương ứng khác chữ (sabbo so imehi catūhi maggehi), không dùng làm chuẩn.
  (10) 8.3 và các khoá song song: tattha jāte dhamme (đối cách số nhiều) dịch là tân ngữ của quán: do ý nghĩa quán các pháp sinh khởi trong đó là vô thường; hai mục sau (khổ, vô ngã) giữ dạng tỉnh lược như Pāli. 14.3 paṭinissaggānupassī assāsavasena paṭinissaggānupassī passāsavasena dịch theo ps2.9:19.3 (ở vị quán từ bỏ, theo hướng hơi thở vào, và theo hướng hơi thở ra).
  (11) 36.2: obhāso dhammoti obhāsaṁ āvajjati dịch cho rằng ánh sáng là pháp, vị ấy chú ý đến ánh sáng; Pāli không có dấu nháy ở khoá này nên bản Việt không thêm. 37.1, 38.2, 39.10: “nikanti dhammo”ti có dấu nháy kép trong Pāli, bản Việt giữ nháy kép.
  (12) 6.1–6.2: khoá 6.1 kết bằng dấu chấm phẩy trong Pāli, bản Việt giữ; dhammuddhaccaviggahitaṁ mānasaṁ dịch tâm bị sự trạo cử về pháp chi phối (an4.170 dịch tâm bị xao động về pháp chi phối; trạo cử chọn theo ps2.9 và đa số uddhacca). mānasa và citta đều dịch tâm.
  (13) Khuôn mười lăm mục thì thực hành ở 10.2, 11.2, 12.2 (…anto āsevati) dịch bằng cấu trúc phân từ + thì (hướng tâm đến thì thực hành), theo cách ps3.8:2.8 dịch aniccato anupassanto niccasaññaṁ pajahati (quán là vô thường thì từ bỏ tưởng thường); không thêm chữ khi.

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (301 = 301), thứ tự giống Pāli; nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch; 34 khoá có dấu nháy trong Pāli, nháy kép “ ”, 0 khoá có nháy đơn); dấu lược … khớp Pāli từng khoá (0 lệch; 38 khoá có dấu lược, kể cả …pe… và … trần); không khoá nào là (…) trần và Pāli không có (…); không khoá nào Pāli kết ….; NFC đạt; 0 khoá rỗng; không Pāli lọt sang Việt ngoài tên riêng Paṭisambhidāmagga ở khoá tiêu đề, Kosambī ở 1.2 và Ānanda. Pāli trùng nguyên văn trong chính bài: 41 nhóm, 137 khoá, bản Việt giống hệt nhau (0 lệch). Pāli trùng nguyên văn với tầng ngoài bài: 55 khoá, 1.346 cặp đã dò, 46 khoá có bản Việt khác (chủ yếu do an4.170 dịch thi định, con đường, bạn; Evaṁ me sutaṁ có 28 chỗ viết Tôi được nghe; Tena vuccati ở ps3.2 viết có khoảng trắng trước dấu gạch; các khoá thọ, tưởng, hành, thức ở mn/sn dịch trong cấu trúc khác như xem, nơi); không sửa phía tầng. Đã in và đọc đủ 301 cặp Pāli với Việt.

