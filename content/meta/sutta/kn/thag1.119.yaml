notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Vajjiputta trong phẩm Dvādasamavagga.

  **Bốn vế này TRÙNG NGUYÊN VĂN `sn9.5:2.1-2.4`** — bài đã `published` trong chính tầng này
  (khác ở chỗ `thag1.119` có thêm tiểu từ `ca` ở vế 3). Tôi theo lại đúng công thức đó:
  *đã đặt Niết-bàn vào trong lòng* · *hãy thiền định đi, này Gotama, đừng phóng dật* ·
  *Chuyện ồn ào huyên náo có ích gì cho ngươi*. Đây là luật BRIEF_VI3 §6: cùng một công thức Pāli
  thì phải dịch nhất quán.

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1): 10 bản trên đĩa mở rộng,
  5 bản giữ lược. Xem `thag1.112.yaml`. Cả hai đều giữ 2 dấu lược như Pāli.

  **Thứ tự khoá tiêu đề: theo PĀLI** (`0.3` = phẩm, `0.4` = tên bài kệ); 12 bản thag đã publish đặt
  ngược, tôi không sửa chúng.

  **Không đối chiếu được tầng Việt hiện hành** (bilara chỉ có Pháp Cú). Sujato có 8/9 khoá, trống
  đúng dòng kết lược; mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments = 0`, `ratio = 1`.

  **Một chỗ tôi CỐ Ý không bám tiền lệ, và ghi ra để biên tập xem.** `sn9.5:2.1` dịch
  `Rukkhamūlagahanaṁ pasakkiya` là *Vị ấy đã vào khu rừng rậm dưới gốc cây* — **ngôi thứ ba**; ở
  `thag1.119` tôi dịch **ngôi thứ hai** (*Ngươi đã lao vào rừng gốc cây*) vì bốn vế đây đi nhất quán
  ngôi thứ hai (`Jhāya gotama` mệnh lệnh, `Kiṁ te… karissatī` hỏi về *ngươi*), và Sujato cũng dùng
  ngôi thứ hai (*You've left for the jungle*). Trộn ngôi thứ ba vào nửa bài thì tệ hơn là lệch nhẹ với
  một bài song song. Lý do hạ `grammar_logic` xuống 9.2 là ở đây.

  **Bất định đã ghi.** `gotama` là cách xưng hô: ở `sn9.5` đó là vị thiên trú gọi Tôn giả Ānanda, còn
  ở đây dòng kết quy kết bài cho Trưởng lão Vajjiputta. Pāli không nói rõ ai đang nói với ai, nên tôi
  **giữ nguyên cách xưng hô** (*này Gotama*) và không suy diễn thêm. `biḷibiḷikā` chỉ có 2 chỗ trong
  tầng Pāli (chính khoá này và `sn9.5`) → *tiếng ồn ào* (Sujato *hullabaloo*).
  `mā ca pamādo` → *và đừng phóng dật* (tiểu từ `ca` có thật, tôi giữ).

  **Thuật ngữ, đếm được.** `rukkhamūla` → *gốc cây* (rất nhiều bản kn: mn89:4.1, mn107:8.2, mn113:15.1…).
  `Nibbāna` → *Niết-bàn* (894 bản trong tầng). `opiya` → *đặt … vào*. `pasakkiya` → *lao vào* (3 chỗ
  trong tầng Pāli: `sn9.5:2.1`, `thag2.3:1.2`, và khoá này).

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2); ngoặc kép cân; không chữ ngoài
  Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này cấm) →
  `technical_integrity` = **9.6**.

  **Danh xưng giữ nguyên dạng Pāli** (Vajjiputta, Gotama).
