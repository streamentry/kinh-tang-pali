  **Bất định (không thêm vào thân kinh).**
    1. `62.2`, `63.1`, `63.9`, `68.2` `muni pubbāpare idha`: dịch *bậc Mâu-ni ở đây, trước cũng như sau*, tức là xét cả trước lẫn sau; `snp4.7:8.2` đọc *sự sa đọa khỏi trạng thái trước kia ở đời* (cũng hợp với lời giải `63.2`: *etaṁ sampattiṁ vipattiñca*). Không chọn được hẳn một trong hai; người biên tập cân nhắc nếu muốn thống nhất lại với `snp4.7`.
    2. `20.2` `amarāvikkhepadhammo`: dịch *pháp quanh co ngụy biện* (`amarāvikkhepa` là lối nói quanh co như lươn); trong lời giải về sự thực hành sai lạc, nghĩa chính xác chưa chắc.
    3. `9.10`–`9.13` `tadekaṭṭhehi ca kilesehi`: dịch *các phiền não cùng nhóm với chúng* (0 tiền lệ; `ps2.5` dùng `tadanuvattakakilesehi` → *các phiền não đi theo điều ấy*, là từ khác).
    4. `45.3`, `47.1`–`47.3` `mahāgedho`: dịch *cái bẫy lớn* theo `snp4.7:6.3`; Pāli `gedha` thường là *tham đắm*, trong khi lời giải `47.2` liệt kê rừng, bụi rậm, hoang địa, bùn lầy, trói buộc; chưa phân xử được từng sắc thái, nhưng đồng nhất với kệ ở `snp4.7`.
    5. `10.11` `dhammadesanaṁ upādāya dhammadesanaṁ sāvento`: dịch *lấy lời thuyết pháp làm căn cứ, trong khi làm cho người khác nghe lời thuyết pháp*; không có chủ ngữ hay đối tượng rõ.
    6. `49.11`, `49.20` `vinidhāya diṭṭhiṁ … bhāvaṁ`: dịch *che giấu quan điểm, sự chấp nhận, sự ưa thích, tưởng, ý hướng*; `bhāva` → *ý hướng* và `saññā` → *tưởng* (0 tiền lệ); cách đọc của chuỗi này có thể khác.
    7. `10.10` `sikkhitasikkho` → *đã hoàn tất sự tu học* và `pakatiyā` → *vốn*: 0 tiền lệ.
    8. `46.20` `karoti saṅkaroti janeti sañjaneti nibbatteti abhinibbatteti` → *làm, làm ra, sinh ra, làm phát sinh, tạo thành, tạo thành trọn vẹn*: 0 tiền lệ.
    9. `27.2` `ārohanaka` → *người ngồi trên xe*, `vahacchinna` (`41.3`) → *đã được tháo khỏi gánh*, `sandhisamalasaṅkaṭira` → *khe nối, cống rãnh và đống rác*: 0 tiền lệ.
    10. `32.7`, `32.8`: các khoá này không có dấu câu cuối trong Pāli; bản Việt thêm dấu phẩy để câu liền mạch sang `32.8`.
    11. `17.6` theo `an4.6`/`an7.68`: *kinh khất đàm* cho `sutta` là cách của hai bài đó (2 bài), không chắc đúng; `an6.51` dùng *khế kinh*. Giữ theo nhóm đông hơn.
    12. Lỗi ngoài lát, báo chứ không sửa: `snp4.7:10.1`–`10.4` Việt lệch dòng và dịch `pihayanti` là *ganh tị* (xem trên; 1 bài, 4 khoá); `snp4.7:7.4` thêm *dục vọng*; `snp4.7:8.2` đọc `pubbāpare` khác `mnd7` (bất định 1).

