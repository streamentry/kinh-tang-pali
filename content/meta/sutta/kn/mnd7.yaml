  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 121 khoá chênh lệch lớn nhất → khác nghĩa 2 nhóm: sửa 1, bất định 1; giữ 115 khoá (còn lại chỉ khác diễn đạt: `Vighāta` "tai họa" so "tổn hại", `satthāni` "lưỡi dao" so "vũ khí", `anāriya` "phi thánh" so "không cao thượng", `maṅku`, `jhāyati`, `Bhagavā`…). Sửa: 13.2 và 22.2 `(metteyyāti bhagavā)`: bản dự án dịch "(Đức Thế Tôn đáp lời Metteyya,)" làm mất hô cách `Metteyyā`, trong khi lời giải `16.1` giải đúng chữ ấy là "Đức Thế Tôn gọi vị trưởng lão ấy bằng dòng họ" và `16.23` dịch "Này Metteyya, Đức Thế Tôn nói" → "(Này Metteyya, Đức Thế Tôn nói,)" theo `cnd6:10.2` (`snp4.7:2.2` còn câu cũ; ngoài lát). Bất định: 45.3, 47.1, 47.3, 51.3 `mahāgedho`: giữ "cái bẫy lớn" theo `snp4.7:6.3`, bản mù đọc "mối đắm say lớn"; `gedha` là "tham đắm" ở mọi chỗ khác trong tầng (hơn 40 khoá) còn lời giải `47.2` liệt kê rừng, bụi rậm, bùn lầy, trói buộc, không phân xử được. Giữ có chủ ý: 32.5 và mọi chỗ `kitti` "uy tín" (bản mù "danh tiếng") theo `snp4.7:4.1`; đo thấy tầng có cả "danh tiếng" và "tiếng tăm" cho `kitti`, nên chưa buộc đổi. Review đối kháng riêng trên toàn bài (491 khoá) sửa thêm hai chỗ mà bản mù không báo: (i) 9.11, 9.12: `oḷārikā` / `anusahagatā` đồng cách với cả `kāmarāgasaṁyojanā` lẫn `paṭighasaṁyojanā` (và cả hai `-anusayā`), nhưng bản dịch chỉ gắn "thô thiển" / "vi tế" cho dục ái, khiến sân kiết sử và sân tùy miên đọc như bị đoạn hết ở bậc Nhất lai; sửa thành "dục ái kiết sử và sân kiết sử thô thiển, dục ái tùy miên và sân tùy miên thô thiển" (và tương tự với "vi tế" ở bậc Bất lai), theo `ps1.5:9.4`, `mnd16:276.12` (cùng công thức còn lệch ở `mnd2:12.11`–`12.12`, `mnd14:9.11`–`9.12`; ngoài lát); (ii) 42.3 `tassa te, āvuso, alābhā, tassa te dulladdhaṁ`: "ông đã lãng phí điều quý báu" thêm "quý báu" không có trong Pāli → "thật là bất lợi cho ông, thật là không may cho ông" theo `dn29:5.4`. Bốn khoá này không đổi số khoá hay ranh dòng. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bài, đoạn song song `snp4.7`, `dhp372`, `mnd10:127.2`, `mnd15:66.2`, `ud2.4`; không có bản Việt nguyên bài): sửa 10 khoá. (i) Sai thức (modality): `69.3`, `72.1`, `72.3`, `75.3` `na tena seṭṭho maññetha` là cầu khiến (optative `maññetha` có `na`), lời giải `72.2` cũng giải bằng *na kareyya* → *không nên*, nhưng bản cũ đọc thành câu điều kiện *Người không vì đó mà nghĩ … thì …*; sửa *Không nên vì đó mà nghĩ mình là tối thắng*. (ii) `69.4`, `73.1`, `73.3`, `75.4` `sa ve nibbānasantike`: bỏ *thì … đã đến* (Pāli không có động từ hoàn thành; lời giải `73.2` chỉ nói *ở gần*), dùng lại nguyên văn `dhp372:4` *vị ấy thật gần Niết-bàn*. (iii) `34.5` `etampi disvā` *thấy vậy* → *thấy điều ấy* cho khớp lemma `31.3`/`34.1`. (iv) `42.5` `maṅku hoti` thêm *hổ thẹn* cho cùng cách dịch với `40.4`, `42.1`, `42.8`. Ngoài lát, không sửa: `snp4.7:9.3`–`9.4` còn cách đọc điều kiện cũ. Giữ: `32.3` (*y, vật thực, sàng tọa, thuốc men trị bệnh*, theo `ud2.4:1.3`, `ud1.10:1.3`, khác `16.14` vì `16.14` là danh xưng *bhāgī*). Bất định thêm: `28.3` `puthu satthārānaṁ mukhullokikā` có thể đọc *ngước nhìn mặt nhiều vị đạo sư* (`puthu` bổ cho `satthārānaṁ`); giữ *nhiều người …* theo `mnd10:127.2` để hai bài khớp. `41.2` `samohito samannāgato` → *bị tụ họp, bị gắn đầy* vẫn vụng; `mnd15:66.2` dùng chuỗi khác, chưa thống nhất.

