notes: |-
  **Phạm vi: đủ 491/491 khoá của mnd7, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải kinh `snp4.7` (Tissametteyyasutta, Kinh Tissa Metteyya), thuộc phẩm Aṭṭhakavagga. Cấu trúc giống `mnd4`, `mnd5`, `mnd8` và các bài Cūḷaniddesa (`cnd6`, `cnd9`, `cnd10`, `cnd12`, `cnd13`, `cnd16`, `cnd20`, `cnd21`): dẫn từng đoạn kệ, giải từng cụm, nhắc lại cả đoạn kệ trong ngoặc kép. Mười đoạn kệ: kệ của Tissa Metteyya (`2`, nhắc lại `12`) và chín kệ của Đức Thế Tôn (`13`, `23`, `31`, `40`, `45`, `52`, `62`, `69`, `76`), mỗi kệ nhắc lại ở `22`, `30`, `39`, `44`, `51`, `61`, `68`, `75`, `81`, mở đầu bằng *Vì thế, Đức Thế Tôn đã nói—* (9 lần) và *Vì thế, trưởng lão Tissa Metteyya đã nói—* (1 lần, `11.1`). Pāli có 126 khoá mang thẻ in đậm, bản Việt không mang thẻ. Dấu lược: Pāli có 52 khoá chứa `…`: 17 khoá có `…pe…` (`26.2`, `27.4`, `35.2`, `36.6`, `53.3`, `54.5`, `54.8`, `55.2`, `63.7`, `66.2`, `70.4`, `70.10`, `77.3`, `77.29`, `78.3`, `78.4`, `79.5`, đều thành đúng một `…`) và 35 khoá có `…` trần (`35.3`–`35.4`, `46.12`–`46.18`, `49.13`–`49.15`, `77.4`–`77.26`, mỗi khoá giữ đúng một dấu); 0 khoá có `(…)`, 0 khoá kết `….`. Các khoá có ngoặc đơn của Pāli là `2.2`, `12.2`, `13.2`, `22.2` (lời dẫn nhân vật), bản Việt giữ cặp ngoặc đơn.

  **Tên bài.** `0.1` Mahāniddesa → *Đại Tập Kể Lược*; `0.2` Aṭṭhakavagga → *Kể Lược Phẩm Tám Kệ* (đúng như `mnd4`, `mnd5`, `mnd8`); `0.3`, `1.1`, `82.1` → *Kể Lược Kinh Tissa Metteyya* (tên kinh theo `snp4.7:0.2`; tệp tên của tầng Anh cho tiêu đề *Exposition of the Discourse with Tissa Metteyya*), cùng khuôn *Kể Lược Kinh Pasūra, thứ tám* ở `mnd8:86.1`.

  **Cách trình bày lemma** theo `cnd6`, `cnd9`, `cnd12`, `cnd13`, `mnd5`: *Từ được giải: lời giải*, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế (chữ thường). Dùng lại nguyên văn các khối Pāli trùng ở `cnd6:3.2`–`3.7` (*Iccā …*, *Tissa*, *Metteyya*, `5.1`–`5.8`), `cnd9:5.1` (*Sau khi nghe lời nói, cách nói, …*, `7.2`), `cnd9:6.2`–`6.4`, `6.11`–`6.26` (ba học pháp, `34.6`–`37.3`, `70.9`–`70.12`), `cnd9:11.2` (*Ở đây: trong quan điểm này, …*, `63.8`), `cnd10:40.3` (*vượt qua lưới ràng buộc*, `63.7`, `77.29`), `cnd10:15.6` (*sau khi từ bỏ, trừ diệt, làm cho tiêu tan, đưa đến không còn*, `78.6`), `cnd11:60.3` (*Sanh y được gọi là các phiền não, các uẩn và các hành tạo tác*, `10.2`), `cnd12:22.3` (*Đó là sự lắng dịu mọi hành, …*, `10.4`), `cnd15:4.11` (chuỗi *xả dục, nhả dục, … sống với tự thân đã trở thành Phạm*, `78.6`), `cnd20:10.5` (hình phạt, `56.6`), `cnd21:13.6`–`13.7` (danh xưng Thế Tôn, `16.21`–`16.22`), `mnd8:11.2` (các cặp cãi vã, `3.6`, `14.6`), `an5.5:1.3` (*không có niềm tin nơi các pháp thiện …*, `42.4`), `an8.54:3.4` (*Làm sao để tài sản của ta …*, `59.2`), `an10.176:10.2` (lời làm chứng, `48.3`–`48.9`), `sn56.42:2.5` (*rơi vào vực thẳm tái sinh, …*, `27.10`) và `ps2.5` (thuật ngữ kiết sử và tùy miên của bốn bậc, `9.10`–`9.13`).

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd7`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho mnd1–mnd16 và tệp tên `mnd-name` (chỉ có tiêu đề các bài); tệp `mnd7_translation-en-sujato.json` không tồn tại. Lớp `english-project` không có `mnd7`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **198** khoá (199 nếu đếm cả thẻ); Sujato phủ 0/198, `english-project` 0/198, `vietnamese-current` 0/198. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.7` (bài kệ chứa đúng mười đoạn kệ này) có trong tầng đã ghim nhưng là bản của **bài khác**, nên không tính là đối chiếu English của `mnd7`; chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.7`, `cnd6`, `cnd9`, `cnd10`, `cnd11`, `cnd12`, `cnd15`, `cnd20`, `cnd21`, `mnd4`, `mnd5`, `mnd8`, `ps2.5`, `an5.5`, `an8.54`, `an10.176` và các công thức chú giải trong Niddesa.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa) trùng nguyên dấu câu với khoá đã dịch ngoài bài này (gồm `mnd4`, `mnd5`, `mnd8`, `cnd7` đang chờ vào nhánh chính): 94 khoá có tiền lệ, tổng 764 cặp; 708 cặp có bản Việt trùng với bản của bài này (sau khi bỏ dấu câu và chữ hoa/thường), 56 cặp khác, nằm ở 26 khoá. Các khoá khác, kèm lý do:
    - `21.1`, `29.1`, `38.1`, `43.1`, `50.1`, `60.1`, `67.1`, `74.1`, `80.1` (*Tenāha bhagavā—*): giữ *Vì thế, Đức Thế Tôn đã nói—* (65 khoá trong tầng) thay vì *Vì vậy …* (`ne21:22.4`, 1 khoá);
    - `13.2`, `22.2` `(metteyyāti bhagavā)`: dùng lại `snp4.7:2.2` *(Đức Thế Tôn đáp lời Metteyya,)* để kệ ở `mnd7` và `snp4.7` khớp nhau; `cnd6:10.2` (2 khoá) là *(Này Metteyya, Đức Thế Tôn nói,)*, còn nhắc lại bằng lời giải ở `16.23` theo `cnd6:12.3`;
    - các dòng kệ `2.1`–`2.5`, `13.1`–`13.5`, `23.1`–`23.4`, `31.1`–`31.4`, `40.1`–`40.4`, `45.1`–`45.4`, `52.1`–`52.2`, `62.4`, `69.1`–`69.4` (kể cả các lần nhắc lại) dùng lại nguyên văn `snp4.7`, chỉ bỏ hoặc thêm dấu nháy cho khớp Pāli từng khoá; ở `69.3` bỏ nháy kép quanh *tối thắng* vì Pāli khoá này không có nháy (như `mnd5` ở các khoá tương tự). Các khoá kệ khác với `snp4.7` có lý do riêng:
    - `52.3`–`52.4` (`Sa cāpi methune yutto, mandova parikissati`): Pāli khác `snp4.7:7.3` (`Athāpi methune yutto`); `snp4.7:7.4` *bị dục vọng kéo lôi như kẻ ngu si* thêm *dục vọng* và *kéo lôi* mà `mandova parikissati` và lời giải `56.x` (*kissati parikissati parikilissati* qua hình phạt, đường biển, mất của) không có, nên dịch *chịu vất vả khổ sở như kẻ ngu si*;
    - `62.2`–`62.3`: `snp4.7:8.2` đặt *bậc Mâu-ni* sang dòng `8.3`, trong khi `muni` nằm ở khoá `62.2` của Pāli và lời giải `63.5`–`63.7` giải riêng *Munī*; để mỗi khoá có đủ từ của nó, `62.2` mang *bậc Mâu-ni* và `62.3` bỏ chữ đó, nhưng giữ *hãy kiên định thực hành hạnh sống một mình* và `62.4` nguyên văn. Cụm `pubbāpare` dịch *trước cũng như sau* (xem bất định 1); `62.1` giữ *Biết được tai họa này* của `snp4.7:8.1` (1 khoá) dù câu Pāli đó ở `snp3.12` (8 khoá) là *Biết rõ sự nguy hại này*, `thag2.17`/`iti95`/`iti105` (4 khoá) là *Biết sự nguy hiểm ấy*;
    - `76.1`–`76.4`: Việt `snp4.7:10.1`–`10.4` đảo thứ tự theo cú pháp Anh nên không còn khớp từng dòng Pāli (*Rittassa munino carato* mang chữ *Những người bị trói buộc vào dục lạc ganh tị với*); dịch lại theo từng dòng: *Vị Mâu-ni trống rỗng đang du hành, / không mong cầu các dục; / họ thèm khát bậc đã vượt qua dòng lũ, / đám người đắm nhiễm trong các dục.* `pihayanti` là *thèm khát* theo `cnd9:4.1` (`pihayāmi` → *con thèm khát*) và lời giải `79.4` (người mắc nợ thèm khát sự không nợ), không phải *ganh tị*; `kāmesu anapekkhino` theo `iti45:3.4` *không mong cầu các dục*;
    - `34.7`, `35.4`, `45.2`: dùng cách diễn đạt của `cnd9:6.3` (*học giới tăng thượng, …*), *thiền thứ ba …* (9 khoá) thay vì *tam thiền …* (5), và *chất vấn* cho `codito` như `snp4.7:6.2`;
    - `56.5`, `56.6`: lấy theo `cnd20:10.4`–`10.5` (không dùng *‘ ’* quanh tên các hình phạt, vì Pāli các khoá này không có nháy), khác `an2.1:3.3` (có nháy) và `mn13:14.2`.
    Đã dò **53 nhóm Pāli trùng nguyên byte trong chính bài** (74 khoá lặp thêm): 0 nhóm có bản Việt khác. Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 2 nhóm Việt khác, đều là câu nhắc lại lời giải bên cạnh dòng kệ (`13.2`, `22.2` và `16.23`; `23.3`, `30.3` và `27.12`), khác nhau có chủ ý (cách nhắc lại lời giải theo `cnd6:12.3`; bỏ chữ *thì* khi nhắc lại một cụm đứng riêng).

  **Thuật ngữ, kèm số đếm.** `viveka` → *viễn ly* (747 lần xuất hiện; `kāyaviveko`, `cittaviveko` → *thân viễn ly*, *tâm viễn ly*, 3 lần mỗi dạng); `upadhi` → *sanh y* (271 lần xuất hiện; `cnd11:60.3`); `upadhiviveko` → *sanh y viễn ly*. `methunadhamma` → *pháp dâm dục*, `methuna` → *dâm dục* (`snp4.7`); `methunaka` → *một đôi* (theo `mithu` → *từng đôi* ở `mnd8:11.2`). `kalaha`, `bhaṇḍana`, `bhassa`, `vivāda`, `adhikaraṇa`, `vādī`, `sallāpaka` → *cãi vã, tranh chấp, cãi nhau, tranh luận, kiện tụng, tranh biện, đối đáp* (`mnd8:11.2`, 1 khoá); `an5.212` dùng *đấu tố* cho `kalaha` nên không theo. `ratta sāratta avassuta pariyuṭṭhita pariyādinnacitta` → *say đắm, hết sức say đắm, bị thấm đẫm, bị xâm chiếm, tâm bị thâu nhiếp* (`pariyādinnacitta` → *tâm bị … thâu nhiếp* theo `an3.53`, `an3.54`; các từ còn lại không có tiền lệ cùng nghĩa). `vighāta` và `ādīnava` đều ra *tai họa* ở dòng kệ (`snp4.7:1.3`, `8.1`), `upaghāta pīḷana ghaṭṭana upaddava upasagga` → *sự tổn hại, sự bức bách, sự va chạm, tai ương, tai nạn* (0 tiền lệ). `mārisa` → *bạch Ngài* (`snp4.7:1.3`, vì người nói là tỳ-kheo thưa Đức Phật); `cnd7`, `cnd11`, `cnd14` dùng *thưa Ngài* cho người tại gia, nên không theo. `sāsana` → *giáo huấn* ở lời thưa của Tissa (`snp4.7:1.4`) và *giáo pháp* ở nghĩa chung (`snp4.7:2.3`, 783 lần *giáo pháp* trong tầng); `pariyattisāsana` → *giáo pháp học tập*, `paṭipattisāsana` → *giáo pháp thực hành* (0 tiền lệ). `bhaggarāgo … bhaggakilesoti bhagavā` → *vị đã phá vỡ tham … phá vỡ phiền não là Thế Tôn* (0 tiền lệ cho cả chuỗi; *phá vỡ* 127 lần trong tầng), `bhaggadiṭṭhi` → *tà kiến* (một trong các phiền não), `kaṇḍaka` → *gai nhọn*; `bhāgī` → *có phần về*; `anupubbavihārasamāpatti` → *sự chứng đạt phép sống tiếp nối* (`an9.33`); `kasiṇasamāpatti` → *sự chứng đạt biến xứ* (*biến xứ* 68 lần); `saññābhāvanā` → *sự tu tập tưởng*; `vesārajja` → *vô úy* (7 lần); `tathāgatabala` → *Như Lai lực* (1 lần). `puthujjana` → *phàm phu* (281 lần); `puthu` trong lời giải → *nhiều* (0 tiền lệ cho từng mệnh đề của `28.3`). `bhanta yāna` → *xe chệch hướng* (theo `snp4.7:3.3`), `vibbhantaka` → *kẻ đã hoàn tục* (0 tiền lệ; `vibbhanto` ở `46.10` → *đã hoàn tục*), `visama` → *gồ ghề*, `papāta` → *vực thẳm* (`sn56.42`). `kāyaduccarita`, `vacīduccarita`, `manoduccarita` → *ác hạnh về thân, về khẩu, về ý*: *ác hạnh về thân* 12 lần, nhưng *thân ác hạnh* 21 lần và *ác hạnh về khẩu* 2 lần, *ác hạnh về lời* 13 lần, *ác hạnh của khẩu* 14 lần; chọn dạng *về …* và *khẩu* để cùng dạng *khẩu nghiệp* (50 lần), *dao khẩu* (2 lần) và để không trộn *lời/khẩu* trong cùng khoá `46.6`. `satthāni` → *lưỡi dao* ở kệ, *dao thân, dao khẩu, dao ý* ở lời giải. `mosavajja` → *sự nói dối* (`snp4.7:6.4`), `musāvāda` → *nói dối* hoặc *lời nói dối*, `sampajānamusā` → *cố ý nói dối* (`an10.176`, 1 khoá). `mahāgedha` → *cái bẫy lớn* (`snp4.7:6.3`; xem bất định 4). `diṭṭhi` → *quan điểm* trong chuỗi che giấu (`49.11`, `49.20`) và trong `63.8` (`cnd9:11.2`), *tà kiến* trong `16.7`; `khanti` → *sự chấp nhận*, `ruci` → *sự ưa thích* (`mnd5`, `cnd9:11.2`). `codeti` → *chất vấn* ở mọi chỗ (54 lần *chất vấn* so với 154 lần *quở trách* trong tầng, nhưng ở đây là người khác hỏi cho ra lẽ rồi kẻ ấy nói dối, và theo `snp4.7:6.2`). `palibodha` → *chướng ngại* (256 lần), `sannidhi` → *tích trữ*, `akiñcanabhāva` → *trạng thái không sở hữu gì*, `pabbajjāsaṅkhāta` → *điều được xem là xuất gia*, `gaṇāvavassagga` → *sự rời bỏ đoàn thể* (0 tiền lệ). `yaso kitti` → *danh tiếng và uy tín* (`snp4.7:4.1`); `ayaso akitti` → *mất danh tiếng và mất uy tín*; `sampatti vipatti` → *sự thành tựu và sự suy sụp*. Công thức *paṇḍito viyatto medhāvī bahussuto cittakathī kalyāṇapaṭibhāno* theo `an5.50`/`dn23` (*bậc trí, thạo việc, thông tuệ, nghe nhiều, thuyết giảng hay, khéo ứng đối*); các hạnh đầu-đà `suttantika … yathāsanthatika` → *vị thông kinh, trì luật, thuyết pháp, sống trong rừng, chuyên khất thực, mặc y phấn tảo, chỉ dùng ba y, khất thực tuần tự từng nhà, từ chối thức ăn sau bữa, không bao giờ nằm, ngủ nơi chỗ trải sẵn* theo `an5.162`–`an5.189`, `an6.59`, `dn25`. Chuỗi mười hai mệnh đề *đã gắn bó, đã gắn chặt, đã dấn vào, đã dấn sâu, … lấy điều ấy làm chủ* theo `mnd8:17.2` và `cnd7:36.10`. `jhāyati pajjhāyati nijjhāyati apajjhāyati` → *ủ ê, nghĩ ngợi, trầm ngâm, nghiền ngẫm* (ba từ sau như `an11.9:2.10`, từ đầu theo `snp4.7:5.2` *ủ ê*). `momūha` → *mù quáng* (`an5.141`), `mando` → *ngu si* ở kệ (`snp4.7`) và ở lời giải để khỏi lệch. `kapaṇo` → *kẻ khốn khổ*. `kissati parikissati parikilissati` → *chịu vất vả, chịu vất vả nhiều bề, chịu khổ sở thảm hại* (0 tiền lệ). `aggaṁ seṭṭhaṁ visiṭṭhaṁ pāmokkhaṁ uttamaṁ pavaraṁ` → *tối thượng, tối thắng, thù thắng, dẫn đầu, tối cao, cao quý*: nhóm đông hơn (5 khoá ở `cnd6`, `cnd21`) so với *tối thượng, cao quý, thù thắng, đứng đầu, tối cao, ưu tú* (3 khoá ở `cnd10`, `cnd14`); `uttamaṁ` ở dòng kệ là *tối thượng* theo `snp4.7:9.2`. `paccekabuddha` → *Độc Giác Phật* (26 lần, so với 25 lần *Phật Độc Giác*). `suttaṁ geyyaṁ … vedallaṁ` (`17.6`) theo `an4.6`/`an7.68` (*kinh khất đàm, kinh khế tùng, …*, 2 bài); cách này của `an6.51` là *khế kinh, ứng tụng, …*. `palāsapuñja` → *đống lá* (Pāli của bài này viết `palāsa`, khác `palāla` → *đống rơm* ở `an10.99:22.2`). Bốn bậc thánh: *bậc Dự lưu, Nhất lai, Bất lai, A-la-hán* (`ps2.5`); `sakkāyadiṭṭhi` → *thân kiến* (104 lần), `vicikicchā` → *nghi hoặc* (434 lần, so với *hoài nghi* 200 lần), `sīlabbataparāmāsa` → *giới cấm thủ* (63 lần), `saṁyojana` → *kiết sử* (528 lần), `anusaya` → *tùy miên* (227 lần, so với *khuynh hướng ngầm* 62 lần). Chuỗi mười bốn phiền não ở `77.x`: *giận dữ, hằn học, gièm pha, hơn thua, ganh tị, keo kiệt, giả dối, xảo trá, bướng bỉnh, hung hăng, ngã mạn, ngạo mạn, tự mãn, phóng dật* theo `mnd5:54`, `mnd5:56`. Địa danh trên đường biển (`57.1`, 35 tên) giữ nguyên dạng Pāli như tên riêng, theo `mil6.4.2:54.1`; *Rāhu* ở `56.6` và *Pātimokkha* ở `34.9` giữ nguyên như ở `cnd20:10.5` và `an10.17`. Chỉ có các từ này (tên riêng và `Iccā` ở `5.2`–`5.3`, `46.2`–`46.3` là lemma) còn dấu Pāli trong bản Việt.

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `tayo vivekā` 3 → *ba loại viễn ly* (`8.2`, `70.2`), đủ 3 mục (`8.3`, `70.3`); `tisso sikkhā` 3 → *ba học pháp* (`34.6`, `70.9`), đủ 3 mục; `tīṇi satthāni` 3 → *ba lưỡi dao* (`46.4`), đủ 3 mục; `tividhaṁ … catubbidhaṁ … tividhaṁ` 3·4·3 → *ba loại … bốn loại … ba loại* (`46.6`); `dvīhi kāraṇehi` 2 → *hai lý do* (`17.2`, `24.2`, `54.2`, `64.2`), mỗi lần đủ 2 mục; `dve kāmā` 2 → *hai loại dục* (`78.2`); `tīhākārehi` 3, `catūhākārehi` 4, `pañcahākārehi` 5, `chahākārehi` 6, `sattahākārehi` 7, `aṭṭhahākārehi` 8 → *ba, bốn, năm, sáu, bảy, tám cách* (`49.1`, `49.6`, `49.7`, `49.12`, `49.13`–`49.16`, `49.21`); ở `49.20` có 5 điều che giấu (*quan điểm, chấp nhận, ưa thích, tưởng, ý hướng*) cộng 3 ý nghĩ ở `49.17`–`49.19` là 8. Danh sách ở `16.x`: 7 mục `bhagga-` (`16.3`–`16.9`, 7/7), `catunnaṁ jhānānaṁ` 4, `catunnaṁ appamaññānaṁ` 4, `catunnaṁ arūpasamāpattīnaṁ` 4, `aṭṭhannaṁ vimokkhānaṁ` 8, `aṭṭhannaṁ abhibhāyatanānaṁ` 8, `navannaṁ anupubbavihārasamāpattīnaṁ` 9, `dasannaṁ saññābhāvanānaṁ` 10, `dasannaṁ kasiṇasamāpattīnaṁ` 10, `catunnaṁ satipaṭṭhānānaṁ` 4, `catunnaṁ sammappadhānānaṁ` 4, `catunnaṁ iddhipādānaṁ` 4, `pañcannaṁ indriyānaṁ` 5, `pañcannaṁ balānaṁ` 5, `sattannaṁ bojjhaṅgānaṁ` 7, `dasannaṁ tathāgatabalānaṁ` 10, `catunnaṁ vesārajjānaṁ` 4, `catunnaṁ paṭisambhidānaṁ` 4, `channaṁ abhiññānaṁ` 6, `channaṁ buddhadhammānaṁ` 6 → các số tương ứng đã viết (*bốn thiền, bốn vô lượng, bốn thiền chứng vô sắc, tám giải thoát, tám thắng xứ, chín sự chứng đạt …, mười sự tu tập tưởng, mười sự chứng đạt biến xứ, bốn niệm xứ, bốn chánh cần, bốn thần túc, năm căn, năm lực, bảy giác chi, mười Như Lai lực, bốn vô úy, bốn vô ngại giải, sáu thắng trí, sáu pháp của Phật*). `18.2`: `cattāro satipaṭṭhānā` 4, `cattāro sammappadhānā` 4, `cattāro iddhipādā` 4, `pañca indriyāni` 5, `pañca balāni` 5, `satta bojjhaṅgā` 7, `ariyo aṭṭhaṅgiko maggo` 8 → *tám chi phần*. Các danh sách khác: `4.2`, `15.2`: 4 + 8 = 12 mệnh đề (12/12); `27.2`: 7 loại x