notes: |-
  Dịch trọn 160 khoá (3 khoá tiêu đề :0.x; 33 khổ kệ 1 đến 33, tức 132 vế, cùng 12 khoá số thứ tự đoạn :4.0, :7.0, :10.0, :15.0, :17.0, :19.0, :21.0, :23.0, :25.0, :27.0, :28.0, :29.0 chép nguyên chữ số vì Pāli chỉ có số; lời kết 34.1, hai dòng kết 35.1 và 36.1, khoá 37.1, hai khổ tóm tắt 38 và 39 gồm 8 vế, khoá 40.1) trực tiếp từ Pāli root. Không có bản Anh của Sujato cho tha-ap392 (xem blocker), không có lớp english-project và không có bản Việt hiện hành tại commit đã ghim. Đối chiếu tên phẩm và tên bài với các bài cùng phẩm và liền kề (tha-ap383 đến tha-ap391, tha-ap395 đến tha-ap400), và đối chiếu từng khoá với toàn tầng tha-ap đã dịch qua Pāli trùng nguyên văn. Đây là bài kể về nghiệp quá khứ của chính Đức Phật (Buddhāpadāna) đặt ở cuối phẩm, nên giọng kể là Đức Phật tự nói và dùng ngôi Ta.
  Tên bài `:0.3`: Pāli `10 Pubbakammapilotikabuddhaapadāna` bắt đầu bằng số nên giữ số ở dạng `10. `; `translationTitle` bằng đúng giá trị `:0.3`. Dạng tên: bài khác các Ký Sự thông thường ở chỗ không có chữ thera (trưởng lão) mà là buddhāpadāna, nên viết Ký Sự Của Đức Phật; tên riêng Pubbakammapilotika giữ nguyên Pāli. Về mở đầu tên bài trong tầng tha-ap: Bài Kệ Tuyên Ngợ 255, Bài Kệ Tuyên Ngôn 138, Ký Sự 136 (toàn tầng); ở phạm vi gần (tha-ap360 đến tha-ap410) Tuyên Ngợ 24, Ký Sự 19, Tuyên Ngôn 1; trong phẩm Avaṭaphala Ký Sự 5, Tuyên Ngợ 4. Hai phạm vi cho đa số khác nhau; chọn Ký Sự vì là cách dịch đúng của apadāna, không mang lỗi chính tả (Tuyên Ngợ), và bài liền trước tha-ap391 cùng nhiều bài trong phẩm dùng dạng này; cần biên tập phán một lượt cho cả cuốn. Tên phẩm `Phẩm Trái Avaṭa` theo đa số cùng phẩm (8 trên 9 bài đã dịch). Tầng tên của Sujato chỉ có tiêu đề phẩm (Chapter Beginning With Avaṇṭaphaladāyaka), không có mục cho bài này.
  Tiền lệ đã đo: 157 khoá (không kể :0.x); 29 khoá có Pāli trùng nguyên văn (bỏ dấu câu và hoa thường) với khoá đã dịch ở nơi khác trong tầng, tổng 620 cặp trùng; 27 khoá dùng lại nguyên văn một dạng đã có, gồm Do quả báo của nghiệp ấy (3 trên 3), Do phần nghiệp còn lại ấy, tại đây trong kiếp sống cuối cùng, Đã đoạn tận phước và tội, thoát khỏi mọi nhiệt não, trước Tăng chúng, tại hồ lớn Anotatta, rực rỡ với nhiều loại châu báu, ở những kiếp khác trước đây (một trong hai dạng), Trông thấy Đức Phật Độc Giác, vì nghiệp không bao giờ hoại diệt, đã được các bậc sáng suốt tính đếm (8 trên 8). 2 khoá khác tiền lệ có chủ ý: 19.2 bỏ chữ hướng về vì ở đây Pāli là tân ngữ của khoá 19.3 và 19.4 (2 tiền lệ ở tha-ap370 và tha-ap371 đều có động từ hướng về); 33.3 viết bậc đã đạt mọi thắng trí và sức mạnh theo 1 tiền lệ, thêm chữ bậc vì Pāli là danh từ đồng vị với Đấng Chiến Thắng.
  Ngôi kể dùng Ta cho Đức Phật (toàn bộ lời nói 3.1 đến 32.4). Lời kết 34.1 khác công thức thông thường: Pāli Itthaṁ sudaṁ bhagavā attano pubbacaritaṁ kammapilotikaṁ nāma buddhāpadānadhammapariyāyaṁ abhāsitthāti có chủ ngữ là Đức Thế Tôn và tân ngữ là pháp môn Ký Sự, không phải những bài kệ; giữ mở đầu Tôi nghe như vầy theo công thức (533 khoá dùng; 2 khoá bài kệ này, 3 khoá khác), dịch abhāsittha là đã nói, và dịch kammapilotikaṁ nāma là tên Kammapilotika. Khoá 36.1 dạng Phẩm Trái Avaṭa là phẩm thứ ba mươi chín (đa số 31 khoá là phẩm thứ, 11 khoá thứ, 10 khoá là thứ); ekūnacattālīsamo là ekūna (kém một) cộng cattālīsa 40 là 39. Khoá 37.1 Tóm tắt phẩm này (41 trên 52, còn lại 9 Tóm lược và 2 Tóm lược phẩm ấy). Tên trong khổ tóm tắt 38 và 39 giữ nguyên Pāli, đúng theo các khổ tóm tắt cùng phẩm.
  Dấu lược: Pāli không có dấu lược nào (0 khoá có …pe… hoặc …), bản Việt cũng 0. Nháy: Pāli chỉ có nháy kép mở ở 3.1 và đóng ở 32.4 (một cặp, chạy qua 30 khổ kệ); bản Việt khớp đúng, 0 lệch trên 160 khoá; Pāli không có nháy đơn. Dấu ti: khoá 33.4 (mahāsareti) không dịch, theo tiền lệ anotatte mahāsareti. Đối chiếu 160 khoá với Pāli: đủ khoá, đúng thứ tự, NFC sạch, không khoá rỗng, không khoảng trắng thừa; chữ Pāli trong bản Việt chỉ là tên riêng và tên phẩm (Therāpadāna, Avaṭa, Munāḷi, Sundarikā, Sabbābhibhū, Ciñcamāṇavikā, Nāḷāgiri, Viḍūḍabha, Verañjā, Jotipāla, Uruvelā, các tên trong khổ tóm tắt) cùng chữ sāli. Có 7 nhóm Pāli trùng nguyên văn trong chính bài (4.4 và 11.4; Tena kammavipākena ở 11 khoá 5.1, 14.1, 16.1, 18.1, 20.1, 21.3, 24.1, 26.1, 27.3, 28.3, 30.1; 5.2 và 8.2; 6.1 và 9.1; 6.2 và 18.2; 6.4 và 14.4; 12.2 và 13.4), tổng 61 cặp, 0 cặp Việt khác nhau (12.2 và 13.4 chỉ khác dấu câu, đúng theo Pāli). Đã đọc cặp Pāli với Việt của cả 160 khoá.
  Số Pāli, mỗi phép tính đã kiểm: dasavassasahassāni là dasa 10 nhân sahassa 1.000 là mười ngàn năm (8.1); pañcasate là pañca 5 nhân sata 100 là năm trăm (10.3) và pañca bhikkhusatā cũng năm trăm tỳ-kheo (14.2); pañcābhiñño là năm thắng trí (11.2); chabbassa là cha 6 cộng vassa là sáu năm (30.3); temāsaṁ là ti 3 cộng māsa là ba tháng (26.2); ekanavuti là eka 1 cộng navuti 90 là 91 (39.3, 129 trên 129 khoá có ekanavuti trong tầng đều dịch chín mươi mốt); ekūnacattālīsamo là 39 (36.1); dasamaṁ là thứ mười (35.1); cuddasamaṁ là cuddasa (catu 4 cộng dasa 10) là mười bốn (40.1); bahūvassasahassāni là nhiều ngàn năm, không có số cụ thể (5.3). Không có tiṁsa hay cụm tiṁsakappasahassa trong bài này (0 lần), nên không có số cần phân xử. Số 91 ghi ở 39.3 đúng theo Pāli nhưng không đếm khớp với số khổ kệ trong bài (33 khổ kệ chính cộng 2 khổ tóm tắt) và không phân xử được; ghi nhận, không sửa.
  Bất định và lựa chọn cần người biên tập lưu ý: (1) 4.3 surabhiṁ dịch như tên riêng của vị Phật Độc Giác (Surabhi) theo truyền thống chú giải; trong Pāli surabhi cũng là tính từ thơm, và khoá này không nêu tên nào khác; 7.1 Sabbābhibhū cũng viết như tên riêng của một vị Phật. (2) 7.3 taṁ hiểu là vị đệ tử Nanda ở 7.2 (Ta vu khống vị ấy), không phải Đức Phật Sabbābhibhū; 7.2 āsi dạng ngôi ba, hiểu là có vị đệ tử tên Nanda. (3) 3.3 Pilotikassa kammassa dịch Của nghiệp Pilotika ấy, giữ tên Pilotika, không dịch nghĩa (piloti là mảnh vải cũ); chủ ngữ của vipaccati dịch ngầm là quả của nghiệp ấy chín muồi. (4) 11.1 bhīmo dịch đáng sợ như tính từ; có thể là tên riêng (Bhīma), không phân xử được. (5) 12.4 anumodiṁsu dịch tán đồng (có thể là hoan hỷ tùy hỷ). (6) 13.2 bhikkhamānaṁ ở dạng đối cách số ít (không phải chủ cách số nhiều bhikkhamānā); dịch khi đi khất thực từng nhà và gắn với các thanh niên ở 13.1 theo ngữ cảnh; cách hiểu khác là chỉ vị ẩn sĩ đang khất thực. (7) 17.4 sakalikaṁ và 22.2 sakalaṁ đều dịch mẩu sỏi (theo mil5.1.8:2.2, bàn chân Thế Tôn bị mẩu sỏi làm thương tổn); sakalaṁ ở 22.2 cũng có thể là tính từ toàn bộ; 22.3 pāde chaviṁ pakappesi dịch làm rách da ở bàn chân, pakappesi là kappeti (cắt) và chưa phân xử được mức độ. (8) 16.3 và 16.4 đảo trật tự so với Pāli để đưa động từ về cuối; piṁsayī dịch nghiền nát như ở 15.4 apiṁsayiṁ. (9) 19.4 āsādesiṁ dịch dùng voi xông vào, trung tính, không dịch tấn công hay xúc phạm. (10) 21.2 sattiyā dịch ngọn giáo; satti có thể là giáo, lao hoặc kiếm ngắn. (11) 24.3 sakkā dịch những người Sakya (không phải sakka có thể); 24.4 viṭaṭūbho viết Viḍūḍabha theo tầng (11 khoá Viḍūḍabha, 0 khoá Viṭaṭūbha). (12) 27.2 mallaputtaṁ dịch một chàng đô vật; có thể hiểu là con trai người Malla, nibbuddha dịch cuộc đấu vật. (13) 29.1 Jotipāla viết như tên riêng; 29.3 kuto nu bodhi muṇḍassa dịch như câu hỏi tu từ. (14) 30.2 dukkaraṁ dịch khổ hạnh; 30.3 chabbassānuruvelāyaṁ dịch sáu năm tại Uruvelā, anu- không dịch riêng. (15) 31.1 đến 31.4: etena maggena và kummaggena hiểu cùng chỉ con đường khổ hạnh sai lạc; gavesissaṁ là dạng tương lai nhưng ngữ cảnh là quá khứ nên dịch đã tìm kiếm; nāhaṁ pāpuṇiṁ dịch Ta đã không đạt được và đảo trật tự để giữ nghĩa phủ định. (16) 33.3 sabbābhiññābalappatto dịch bậc đã đạt mọi thắng trí và sức mạnh (theo tiền lệ), có thể là sức mạnh của mọi thắng trí. (17) 6.4 và 14.4 kāraṇā dịch vì; 6.3 laddhaṁ, 14.3 labhuṁ dịch đã nhận. (18) abbhācikkhati và abbhakkhāna (4.4, 6.3, 8.4, 9.3, 11.4, 14.3, 7.3) cùng một gốc, dịch nhất quán vu khống (tầng: vu khống 17, vu cáo 4, xuyên tạc 60, phỉ báng 118; phỉ báng và xuyên tạc đếm thô, gồm cả từ Pāli khác, nên chọn vu khống vì nghĩa tố cáo sai sự thật rõ nhất). (19) 25.3 và 25.4 là lời mắng nhiếc của chính Ta, Pāli không có nháy nên không đặt nháy; 12.1, 25.2, 29.2 dùng dấu hai chấm trước lời nói mặc dù Pāli là dấu phẩy hoặc chấm phẩy; 12.2, 29.3 và 29.4 là lời nói gián tiếp hoặc tự thuật, không nháy. (20) 20.2 bhanto dịch cuồng loạn; 23.4 somanassakaṁ dịch niềm hoan hỷ, không giữ sắc thái -ka. (21) 4.2 chọn một trong hai tiền lệ khác nhau của cùng Pāli (ở những kiếp khác trước đây, 1 khoá; trong những kiếp sống trước kia, 1 khoá) vì dạng đầu giữ chữ aññāsu (khác).
  Lưu ý ngoài lát (không sửa): tha-ap32:10.3 Pañcāsītisataṁ đã dịch thành năm mươi tám, trong khi pañcāsīti là 85 (và sataṁ là 100); nên rà lại.
