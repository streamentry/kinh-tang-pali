notes: |-
  Dịch từ Pāli root tại commit đã ghim; đủ 190 khoá, thứ tự và tập khoá khớp Pāli, không có khoá ngoài Pāli. Không có bản Anh Sujato, bản Việt phân đoạn hay english-project cho bài này, nên không có đối chiếu English độc lập; bản dịch dựa trên Pāli, ngữ cảnh bài và tiền lệ đếm được của nhóm tha-ap.

  Tên bài. 0.3 và translationTitle là cùng một chuỗi: Ký Sự Về Trưởng Lão Ekachattiya. Pāli ở 0.3 (Ekachattiyattheraapadāna) không bắt đầu bằng số nên bản Việt không có số thứ tự. 49.1 đọc lại tên đó rồi thêm thứ hai (Pāli dutiyaṁ; tầng đa số thứ hai). Kiểu mở đầu tên: đo ở phạm vi gần (tha-ap400–449, trừ bài này) là Ký Sự Về 24, Bài Kệ Tuyên Ngợ 13, Bài Kệ Tuyên Ngôn 7; đo toàn nhóm tha-ap (547 bài đã dịch, trừ bài này) là Bài Kệ Tuyên Ngợ 238, Ký Sự Về 146, Bài Kệ Tuyên Ngôn 138. Tuyên Ngợ là chính tả sai, còn Tuyên Ngôn không phải nghĩa của apadāna; bài này theo Ký Sự Về Trưởng Lão như các bài cùng phẩm tha-ap413, tha-ap415 đến tha-ap420. Hai phạm vi cho hai đa số khác nhau, nên để người biên tập phán một lượt cho cả cuốn. Tên người giữ dạng gốc Ekachattiya (Pāli 48.1 là ekachattiyo ở cách thứ nhất): trong các khoá Itthaṁ sudaṁ có tên kết thúc bằng o, bản Việt bỏ o ở 469 khoá, giữ o ở 53 khoá. Trong tầng còn một bài Ký sự cùng tên Ekachattiya ở vị trí thứ bảy của phẩm khác; bài này là bài thứ hai của Phẩm Bhaddāli. 0.1 giữ Therāpadāna (536 trên 547 bài đã dịch làm vậy). 0.2 là Phẩm Bhaddāli (9 trên 9 khoá cùng Pāli dịch như vậy).

  Số Pāli, tự tính. Sattasattatikappāni (38.1): sattasattati là satta 7 cộng sattati 70 là 77, nên bảy mươi bảy kiếp (tầng có 2 khoá Sattasattati kappāni dịch Suốt bảy mươi bảy kiếp và Bảy mươi bảy kiếp). Sattasattatikkhattuñca (39.1): 77 lần, nên bảy mươi bảy lần (3 khoá dịch Và bảy mươi bảy lần, 1 khoá dịch lại thêm bảy mươi bảy lần nữa; giữ dạng 3 khoá). Sahassakkhattuṁ (38.3): một ngàn lần (5 khoá dịch Và một ngàn lần làm vua). Aṭṭhārase kappasate (40.1): aṭṭhārasa 18 nhân sata 100 là 1.800, nên một ngàn tám trăm kiếp. Dvattiṁsavaralakkhaṇo (30.2): dvattiṁsa là dvi 2 cộng tiṁsa 30 là 32, nên ba mươi hai tướng cao quý (khoá cùng Pāli ở tầng dịch đúng như vậy). Bài này không chứa cụm tiṁsakappasahassa nên không có bất định về số kiếp lớn nào chưa phân xử được. Catusaccaṁ (28.3, 33.3): bốn chân lý. Paṭisambhidā catasso (47.1): bốn vô ngại giải. Chaḷaṅgaṁ (27.4): sáu chi phần. Yugamattaṁ (22.1): một tầm cày. Ekāhaṁ (34.3): một ngày (xem bất định 8). Hướng thì của lời thọ ký: 40.1 là lời Đức Atthadassī nói về tương lai (uppajjissati ở 40.4), nên dịch Sau một ngàn tám trăm kiếp nữa (tầng có 2 khoá Sau một ngàn tám trăm kiếp nữa, ở tha-ap409 và tha-ap492, cùng là lời thọ ký về Đức Gotama; dạng Vào một ngàn tám trăm kiếp trước, 14 khoá, là lời kể lại quá khứ). 38.1 đến 39.4 và 41.1 đến 41.4 giữ thì tương lai sẽ (ramissati, bhavissati, karissati, viharissati) và gọi người cúng lọng là người ấy.

  Dấu lược và nháy. Ba khoá 45.2, 46.2, 47.2 có Pāli …pe… nên bản Việt mỗi khoá là đúng một …; Pāli không có … hay (…) ở khoá nào khác nên bản Việt cũng không có. Nháy: Pāli mở ngoặc kép ở 1.1 và đóng ở 47.3; nháy đơn mở ở 30.1 và đóng ở 30.4, mở ở 36.1 và đóng ở 41.4; bản Việt khớp Pāli từng khoá, 0 lệch trên 190 khoá (đo từng khoá, không đo cân tổng). Pāli không có nháy ở Sādhūti (31.3) nên bản Việt không đặt nháy ở nói rằng lành thay (tầng có 2 khoá Sādhūti dịch nói rằng lành thay, không nháy).

  Tái dùng nguyên văn tầng và phạm vi đã dò: tra từng khoá Pāli của bài trên 547 bài tha-ap khác đã dịch (không tính ba khoá …pe…, mỗi khoá có 780 cặp trùng); 64 khoá (kể cả ba khoá tên 0.1, 0.2, 0.3) có Pāli trùng nguyên văn với bài khác, 2.975 cặp Pāli trùng đã dò; 59 khoá có bản Việt trùng với một cách dịch đã dùng, 54 trùng đúng cách dịch phổ biến nhất của tầng (kể cả hai khoá hòa 1 với 1). Năm khoá có Pāli trùng mà bản Việt là cách mới có chủ ý: 0.3 (tên bài, xem phần tên), 27.2 (đã đến bên ta, ngôi ta theo cả phẩm; tiền lệ 1 khoá dịch ngài đã đến bên tôi, không khớp ngôi và người nói với bài này), 34.3 (Sau khi giương suốt một ngày: ekāhaṁ là một ngày, hai tiền lệ viết một ngày một đêm, đêm không có trong Pāli), 34.4 (ngôi ta, tiền lệ 1 khoá dùng tôi), 37.4 (quả báo của việc dâng lọng: lọng 17 khoá, dù 12, chòm 8 trong các khoá có chatta ở tầng; tiền lệ cùng Pāli 2 khoá dịch chiếc chòm, 1 khoá dịch quả báu của việc dâng lọng, nên theo lọng và quả báo). Năm khoá trùng một cách dịch của tầng nhưng không phải cách phổ biến nhất: 26.2 và 28.2 (Đức Atthadassī, bậc Đại Mâu-ni: hòa 1 với 1, khoá kia dịch là Đạo sư Sobhita, Chúa tể thế gian là sai tên so với Pāli atthadassī), 35.1 (Nhưng Đức Thế Tôn Atthadassī, 1 khoá, so với Nhưng Đức Thế Tôn, bậc Đã Thấy Pháp 3 khoá; giữ tên riêng vì 26.2, 28.2 và 33.2 đã giữ Atthadassī), 36.2 (có dấu phẩy sau tịnh tín, 4 khoá, bằng dạng không phẩy, 4 khoá), 40.1 (xem phần số). Các lựa chọn đáng ghi: 14.1 đến 14.3 dùng lại nguyên văn Chiêu liêu, me rừng, xoài, mận, bàng hôi, táo gai, đào lộn hột, ba-la của ba bài có cùng Pāli (tha-ap3, tha-ap407, tha-ap412; đã sửa ở lượt cải thiện 2026-10-11); 3.2 karavīkā dịch chim ca-lăng-tần-già theo karavīkaruta (3 khoá ở tầng), sāḷikā dịch chim sáo (1 khoá dindibha, sāḷikā); 5.2 gấu, chó sói, linh cẩu (3 khoá cùng cụm acchakokataracchakā, 2 khoá chó sói, linh cẩu, 1 khoá sói và linh cẩu); 5.1 Sư tử, hổ và heo rừng (varāha; tiền lệ Sīhā byagghā ca dīpī ca là Sư tử, hổ và báo); 2.3 Có đầy cá và rùa (tầng có Macchakacchapasañchannā dịch Cá và rùa phủ kín, còn đây là sampannā); 20.2 rải đầy (ākiṇṇā theo 1.3); 44.2 bậc Như Thật (tādino sau Atthadassissa, 2 khoá; cụm lokajeṭṭhassa tādino, 20 khoá, dịch bậc Vững Vàng kiên định 11 khoá là Pāli khác nên không áp dụng); sobhayanti ở nhiều khổ dịch làm đẹp am thất của ta (tiền lệ duy nhất sobhayanto dịch làm đẹp). Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti dùng dạng Như vậy, Tôn giả Trưởng lão X đã nói những bài kệ này (nhóm số nhiều), không dùng dạng số ít. Ngôi kể dùng ta ở mọi khổ của người kể (cùng phẩm, tha-ap413 và tha-ap415); Đức Atthadassī tự xưng Ta viết hoa ở 36.1, 36.3, 36.4 (36.4 trong tầng: Ta 15 khoá, ta 14 khoá). Dòng thứ nhất và thứ ba của mỗi khổ viết hoa chữ đầu theo Pāli. 39.4 đếm không hết, vô tận theo 23 khoá cùng Pāli. Đoạn kệ liệt kê 1.1 đến 20.4 giữ tên cây, hoa, cá và thú ở dạng Pāli khi tầng không có cách dịch ổn định hoặc không có tiền lệ (xem bất định 1).

  Pāli trùng trong chính bài: 13 nhóm Pāli trùng (2.2 và 15.2; 3.4, 4.4, 5.4, 6.4, 8.4, 13.4 và 20.4; 5.3 và 6.3; 7.4, 9.4, 10.4, 11.4, 12.4, 17.4, 18.4, 19.4, 21.4 và 24.4; 9.3, 11.3, 12.3, 18.3 và 19.3; 21.2 và 32.2; 22.4 và 23.4; 26.1 và 33.1; 26.2 và 28.2; 26.3 và 40.3; 28.3 và 33.3; 28.4 và 33.4; ba khoá …pe… 45.2, 46.2, 47.2), mọi nhóm có bản Việt giống hệt nhau, 0 cặp mà bản Việt khác. Hai khoá gần trùng chỉ khác nháy mở (28.1 và 30.1) mang đúng nháy của Pāli từng khoá.

  Bất định (không thêm vào thân kinh). (1) Tên thực vật, cá và thú ở 3.1 đến 20.3: uddālaka, campaka, pāṭalī, sinduvāraka, atimuttā, aṅkola, yūthikā, sattalī, bimbijālikā, kaṇikāra, nāga, sāla, saḷala, ajjuna, asana, mahānāma, kaṅgu, tilaka, nimba, sālakalyāṇī, kapiṭṭha, girimālā, isimugga, nayitā, ambagandhī, ketaka, mandālaka, opattakaṇṇikā, pāṭhīna, pāvusa, balaja, muñjarohita, eṇī, sarabha, bheraṇḍa đều giữ dạng Pāli, không gán tên loài; asoka giữ dạng Pāli theo tiền lệ cây asoka (2 khoá); sāla (9.1, 10.3) chưa có tiền lệ nhất quán và phân biệt với saḷala (9.1). 13.1 kadalī là chuối và 13.2 isimugga giữ dạng Pāli (tầng có hai cách khác nhau cho isimugga). (2) 9.2 puṇḍarīkettha pupphitā: dịch sen trắng ở đây đang nở, dù nằm giữa danh sách cây; cách đọc khác coi puṇḍarīka là một loài cây. (3) 6.2 bheraṇḍā sūkarā bahū: bheraṇḍa giữ Pāli (có thể là chó rừng); sūkarā là heo, bahū áp cho cả cụm. 16.1 đến 16.4: gabbhaṁ gaṇhanti padumā là sen kết nụ; kesarī là có nhị hoa; opattakaṇṇikā giữ Pāli, chưa xác định được nghĩa (có thể là hoa có cánh và đài); 0 tiền lệ cùng Pāli. (4) 20.3 opupphā pupphitā senti: đọc là hoa rũ xuống, đã nở, nằm đó; cách đọc khác coi opupphā là tên một loài, hoặc là hoa rải xuống; tầng có 3 khoá opuppha trong ngữ cảnh sen (ja543:23.3, ja547:90.3, tha-ap407:19.3) đều dịch rũ hoặc cúi xuống, nên chọn rũ xuống, nhưng 20.3 nói về bãi cát nên chưa chắc. (5) 29.2 dhammantaragatāsayo: đọc là tâm ý đã đi vào trong Pháp; cách đọc khác coi dhammantara là một giáo pháp khác (từ bỏ pháp cũ để theo Pháp mới); 0 tiền lệ; āsaya dịch tâm ý theo tiền lệ. 31.2 sadhamme pāramiṁ gatā: dịch đã đến bờ bên kia trong pháp của mình, đọc sa- là của mình (cách đọc khác sad- là Chánh pháp; chưa chọn vì nhóm ấy chưa nghe Pháp của Đức Phật); tiền lệ chaḷaṅge pāramiṁ gatā dịch đã đến bờ kia ở sáu chi phần. 31.1 ovādapaṭikarā: dịch họ vâng làm theo lời khuyên dạy; 0 tiền lệ. (6) 27.1 đến 28.4: Pāli không có nháy, nên 28.1 đến 28.4 là lời kể không dấu ngoặc (người nói chưa nêu rõ trong Pāli; cách đọc khác coi đây là lời người đệ tử); bản Việt không thêm người nói. 27.3 mante ajjhetukāmo và 27.4 chaḷaṅgaṁ nāma lakkhaṇaṁ: theo tiền lệ tha-ap405 (môn tướng pháp gọi là sáu chi phần). (7) 37.3 dhāressati sadā chattaṁ: Pāli chủ động không nêu chủ thể; dịch bị động chiếc lọng sẽ luôn được giương lên để không thêm chủ thể không có trong Pāli. (8) 34.3 ekāhaṁ: một ngày, không dịch thêm đêm. 34.2 buddhaseṭṭhassa dhārayiṁ: giương lên cho Đức Phật tối thượng (cùng cụm 34.4); chatta dịch lọng. 42.1 đến 42.4: yato ahaṁ kammamakaṁ là kể từ khi ta tạo nghiệp; 42.3 và 42.4 setacchattaṁ adhāritaṁ dịch chiếc lọng trắng nào đã không được giương lên, không thêm có lúc nào. 43.3 và 43.4 chattadhāraṇamajjāpi vattate niccakālikaṁ: đọc là việc giương lọng vẫn luôn tiếp diễn ngay cả hôm nay; niccakālika dịch luôn; 0 tiền lệ cùng Pāli. (9) 22.3 kāmabhoge anapekkhā: dịch không màng đến sự hưởng dục lạc (kāmabhogī tầng dịch người hưởng dục lạc, 3 khoá); 23.1 và 23.2 parūḷhakacchanakhalomā paṅkadantā rajassirā: lông nách, móng và lông thân mọc dài; răng cáu bẩn; đầu dính bụi bặm; 3 khoá cùng Pāli ở tầng dịch như vậy, và bản Anh của snp5.1:5.2 (paṅkadanto rajassiro) cũng hiểu là răng bẩn, nên paṅkadanta không dịch là bùn. 25.4 jhānasamappito: dịch luôn đắm mình trong thiền; tiền lệ -samappito là đầy đủ hoặc bị bao trùm, 0 tiền lệ với jhāna. (10) 4.1 mañjubhāṇī: đọc là giọng dịu dàng (tính từ của chim tu hú); cách đọc khác coi là một loài chim; 1 tiền lệ gần nhất (ja547:345.2, kokilā mañjubhāṇikā) cũng hiểu là tính từ. 5.3 và 6.3 nādenti dịch kêu vang cho cả loài ăn thịt lẫn loài hươu; không phân biệt gầm và kêu. (11) 48.1 Pāli kết bằng dấu chấm phẩy (abhāsitthāti;), bản Việt kết bằng dấu chấm theo mọi tiền lệ cùng công thức, vì không có khoá nào ở tầng giữ chấm phẩy.

  Coverage English: mẫu số là 1 khoá có nội dung (48.1 là 63 ký tự, câu kết; 189 khoá còn lại là kệ ngắn dưới ngưỡng 40 hoặc khối :0, kể cả 49.1 dài 36 ký tự); Sujato phủ 0 trên 1; english-sujato tại commit đã ghim chỉ có 9 nhóm cp, dhp, iti, ja, kp, snp, thag, thig, ud và không có tệp thân kinh tha-ap nào (tệp tha-ap duy nhất là tệp tên); vietnamese-current chỉ có Pháp Cú; english-project chưa có entry cho bài này. Cổng coverage hầu như không đo được gì ở bài này. Việc content/meta/reference-gaps.yaml có hay chưa có entry cho tha-ap414 chưa được kiểm; người điều phối cần chạy npm run reference:gaps. Entry ở đó không thay đổi việc bài này giữ draft.

  Cổng kỹ thuật chưa chạy (bị cấm trong lát này) nên technical_integrity đặt 9.6, người điều phối cần chạy: npm run validate, npm test, npm run check, npm run build.

  Lượt cải thiện 2026-10-11: đọc đối kháng lại cả 190 khoá và đo lại tiền lệ trên toàn tầng KN, không chỉ nhóm tha-ap. Đổi 15 khoá, giữ nguyên tập khoá và thứ tự (190 trên 190). Sửa độ chính xác: 23.2 paṅkadantā rajassirā từ răng dính bùn, đầu phủ bụi thành răng cáu bẩn, đầu dính bụi bặm (3 khoá cùng Pāli ở tầng dịch như vậy, và bản Anh của snp5.1:5.2 hiểu là răng bẩn, đầu đầy bụi; ghi chú cũ viết 0 tiền lệ là sai). 20.3 opupphā từ hoa rải xuống thành hoa rũ xuống (ghi chú cũ viết 0 tiền lệ là sai, xem bất định 4; nghĩa vẫn chưa chắc). Sửa thuật ngữ theo số đếm: 4.1 chim cu thành chim tu hú (kokila ngoài các khoá tên: 15 khoá tu hú, 4 khoá chim cu; ja547:345.2 cùng cặp kokilā mañjubhāṇikā dịch tu hú); 6.1 hươu sarabha thành nai sarabha (9 khoá dịch nai sarabha, 0 khoá dịch hươu sarabha); 31.4 tầm cầu thành tìm cầu (57 khoá gavesī và gavesanta dịch tìm cầu, 0 khoá dịch tầm cầu; 32.3 cùng bài đã là tìm cầu); 9.3, 11.3, 12.3, 18.3, 19.3 Đang tỏa hương trời thành Tỏa ra hương trời (11 khoá cùng Pāli ở tha-ap3 và tha-ap412, bản cũ ghi tái dùng nguyên văn nhưng thực tế lệch); 14.1 đến 14.3 bỏ chữ trái, dùng nguyên văn của 3 bài cùng Pāli (ghi chú cũ viết mỗi từ 1 đến 2 khoá là đo sai); 16.2 dùng lại nguyên văn tha-ap407:19.2; 49.1 viết Ký sự về Trưởng lão X, thứ N theo đa số (315 khoá so với 75 khoá viết hoa mọi chữ trên cả tầng; 36 so với 22 trong tha-ap380 đến tha-ap450; riêng 7 bài cùng phẩm Bhaddāli là tha-ap413 và tha-ap415 đến tha-ap420 viết hoa, nên điểm này cần người biên tập phán một lượt cho cả phẩm). Sửa ghi chú: công thức kết 48.1 đúng là Như vậy, Tôn giả Trưởng lão X đã nói những bài kệ này, không phải dạng Tôi nghe như vầy ghi ở phần cũ; các mục bất định (4), (9), (10) và phần lựa chọn đáng ghi đã cập nhật theo các khoá trên.

  Điểm cũ sang mới: terminology 8.8 sang 9.0 (tám nhóm lệch tiền lệ đã sửa); triangulation 7.6 sang 7.8 (đối chiếu thêm bản Anh của các bài song song cho từng cụm: snp5.1:5.2 răng bẩn; snp3.1:6.4 và mn91:10.9 một tầm cày; kp8:12.1 và iti22:3.4 padesarajja là quyền cai trị một vùng; thag21.1:54.1 abhiññāpāramippatto; sn20.9:3.3 và sn56.41:1.4 bhisamuḷāla là củ và thân sen; chỉ snp5.1:5.2 làm đổi chữ, các cụm còn lại xác nhận bản đang có; bài vẫn không có bản Anh độc lập nên triangulation không vượt 8.0). Giữ nguyên: semantic_fidelity 8.7 và ambiguity_integrity 8.5 vì các bất định (1) đến (11) vẫn còn; technical_integrity 9.6 vì cổng kỹ thuật chưa chạy. final_score 8.98 sang 9.02, tức vượt 9.0 chỉ 0.02, hệ quả của hai tiêu chí trên chứ không phải điểm được chọn để qua ngưỡng.

  Đo lại tiền lệ (toàn tầng KN, không tính ba khoá …pe…): 113 khoá, kể cả ba khoá tên, có Pāli trùng nguyên văn với bài khác, 3.723 cặp trùng đã dò; 86 khoá có bản Việt trùng một cách dịch đã dùng, 79 khoá trùng cách phổ biến nhất. 26 khoá còn lệch khỏi mọi tiền lệ: 19 khoá do ngôi kể ta thay cho tôi (cả tầng tha-ap kể cả bài này: 262 bài đa số ta, 286 bài đa số tôi; trong tha-ap380 đến tha-ap450: 47 bài đa số ta, 23 bài đa số tôi); 22.4 và 23.4 thêm họ, 24.1 thêm Họ để rõ chủ thể; 0.3 giữ Ekachattiya; 15.1 hồ sen (tiền lệ 1 khoá là một cái hồ, bỏ mất pokkharaṇī); 34.3 suốt một ngày; 37.4 lọng và quả báo. Trong chính bài: 13 nhóm Pāli trùng, 43 khoá, 0 nhóm có bản Việt khác (đo lại sau lượt sửa). Nháy: 0 lệch trên 190 khoá; …pe… đúng một … ở 3 khoá; NFC, không khoá rỗng, không khoảng trắng thừa, không chữ số lọt vào bản Việt.

  Nghi ngờ còn lại, không đổi: 39.3 các vùng đất rộng lớn là cách dịch của 34 trên 49 khoá padesarajjaṁ vipulaṁ ở tầng, nhưng thêm số nhiều và chữ đất không có trong Pāli, còn bản Anh của kp8:12.1 chỉ nói quyền cai trị một vùng; đổi riêng ở bài này sẽ phá nhất quán 49 khoá, nên chỉ ghi nhận cho người biên tập xử lý một lượt toàn tầng. 9.2 puṇḍarīka: tha-ap3, tha-ap407, tha-ap412 và tha-ap398:3.4 (puṇḍarīkā ca pupphitā) đều dịch sen trắng, ủng hộ cách đọc hiện tại nhưng vị trí giữa danh sách cây vẫn để bất định như đã ghi. 16.3 opattakaṇṇikā: tha-ap407:19.4 dịch kaṇṇikā là gương sen, nhưng 16.3 là hoa đang nở nên không áp dụng; giữ dạng Pāli. 6.2 bheraṇḍa: ja530:63.1 dịch bheraṇḍaka là chó rừng nhưng ngữ cảnh đó là danh sách loài ăn xác, nên chưa dùng; giữ dạng Pāli. Các chỗ nghi nhưng giữ vì tiền lệ gần: 27.1 đến 28.4 chưa rõ người nói, 29.2 dhammantara, 31.2 sadhamme, 20.2 jalasevitā (chưa có tiền lệ; đọc là có nước lui tới, nghĩa chưa chắc).

