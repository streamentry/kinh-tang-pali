  **Chỉ mục Pāli → Việt toàn tầng.** Đã dò **3701 cặp Pāli trùng nguyên văn**.
  **13 khoá dùng lại nguyên văn bản dịch đã có**: `Therāpadāna`,
  `Phẩm Hoa Kaṇikāra`,
  `tâm ý sáng trong không chút ô nhiễm;`, `Vào chín mươi tư kiếp trước đây,`,
  `Tôi không còn biết đến đọa xứ,`,
  `đó chính là quả báo của việc cúng dường nước uống.`,
  `Vào bảy mươi bảy kiếp trước,`, `Thành tựu bảy báu,`,
  `là Chuyển luân vương có đại thần lực.`, `Bốn vô ngại giải,`, `…`,
  `đã làm tròn lời dạy của Đức Phật”.`,
  `Tôi nghe như vầy: Tôn giả Trưởng lão Udakadāyaka đã nói những bài kệ này.`
  11 khoá còn lại là Pāli không trùng nguyên văn ở bài nào khác nên phải dịch mới.
  **Bài này có hai tiền lệ CỰC KỲ gần — cùng một vị trưởng lão.** `tha-ap499` (tệp
  đầy đủ 26 khoá, cùng bộ `kn`) kể đúng vị Udakadāyaka này, bản dài hơn, trong phẩm
  `Kiṅkaṇipupphiyavagga`. Tôi đọc toàn bộ và dùng lại: `dakadānassidaṁ phalaṁ.` →
  *đó chính là quả báo của việc cúng dường nước uống.* (trùng nguyên văn);
  `Yadā pānīyamicchāmi,` → *Bất cứ khi nào tôi muốn có nước uống,* xác nhận
  cách hiểu `icchāmi` = muốn có. `tha-ap499` cũng xác nhận cách dịch `siddhatthassa`
  và `Duggatiṁ nābhijānāmi`. Nhờ vậy bài này **không** phải dịch mù.
  **Một chỗ Pāli tôi đọc lại, và lý do.** `udakaṁ yamadāsahaṁ;` (3.2) đọc theo nghĩa
  đen sẽ thành *tôi đã cho uống nước để thuần phục*, rất khó hiểu và không có tiền lệ.
  Nhưng đây là sandhi của `udakaṁ yaṁ adāsahaṁ`: *nước mà tôi đã dâng*. Tôi dịch
  *tôi đã dâng nước ấy lên*, giữ đúng chủ thể (tôi), đúng tân ngữ và đúng mốc
  thời (`adāsahaṁ` là thì hoàn thành). Ghi ra vì đây là chỗ dễ sai nhất của bài.
  **Thuật ngữ, đếm được.** `samaṇa` → *sa-môn* (9 khoá toàn tầng, ví dụ
  `ud1.8:2.3` *Này sa-môn, hãy nuôi đứa con nhỏ này của ngài.*). `vippasannamanāvilaṁ`
  → *tâm ý sáng trong không chút ô nhiễm* (Pāli trùng nguyên văn 8 khoá: 6 câu
  này, 2 câu *tịch tịnh thanh khiết không chút bợn nhơ*). `Catunnavutito kappe` →
  *Vào chín mươi tư kiếp trước đây* (toàn tầng `tha-ap` 30 câu, phạm vi gần nhất
  `tha-ap193-202` cũng 2 câu). `Ekasaṭṭhimhito kappe` → *Vào bảy mươi bảy kiếp
  trước,* (trùng nguyên văn 1 khoá `tha-ap320`). `Sattaratanasampanno` →
  *Thành tựu bảy báu* (16 câu; phạm vi gần nhất `tha-ap203-212` 3 câu). `homa` →
  *lễ tế* (29 câu toàn tầng). `Duggatiṁ nābhijānāmi` → *Tôi không còn biết đến đọa
  xứ,* — cần nói rõ là **tầng đang tách làm nhiều cách**: 122 câu *Ta không biết mình
  rơi vào khổ đau,* / 62 *Tôi không còn biết đến đọa xứ nào,* / 45 *Tôi không còn biết
  đến đọa xứ,* / 45 *Ta không còn biết đến đọa xứ,* / 20 *Tôi không còn biết đến bất kỳ
  đọa xứ nào,* / 12 *Ta không hề biết đến đọa xứ,*; phạm vi gần nhất
  `tha-ap203-212`: 3 câu *Tôi không còn biết đến khổ xứ*. Tôi chọn câu trung tính
  nhất (không thêm *bất kỳ… nào*, không đổi ngôi kể giữa chừng) và dùng **nhất quán
  cho cả lát** ở `tha-ap209` và `tha-ap214`. Đây là số đo, không phải đa số cục bộ.
  **Tiền lệ = 0, nên ghi rõ thay vì bịa.** `khīṇasaṁsaya` (2.2) không có tiền lệ
  nào trong `tha-ap`; `uất nghiệp` và `hoang nghi` đều 0 lần trong toàn tầng. Tôi dùng
  *hoang nghi* vì người Việt hiện đại hiểu ngay. `ghaṭena` (1.3) 0 tiền lệ ⇒ *bình*.
  **Về `ti` — đo ở phạm vi gần nhất, ghi cả hai số.**
  `Kaṇikārapupphiyavagga` → *Phẩm Hoa Kaṇikāra*: phẩm `tha-ap203-212` có 10 bài,
  **3** câu *Phẩm Hoa Kaṇikāra* vs **1** *Phẩm Kaṇikārapupphiya* vs **1** *Phẩm Bậc Rải
  Hoa Kaṇikāra*. `theraapadāna` (0.3 và 7.1) → *Bài Kệ Tuyên Ngôn Về Trưởng Lão …*:
  toàn tầng `tha-ap` đo được **372** câu ghi *Bài Kệ Tuyên Ngợ* (sai chính tả) vs
  **128** câu ghi *Bài Kệ Tuyên Ngôn*. Tôi chọn **Ngôn** vì *ngợ* không phải từ tiếng
  Việt. Số lệch 372/128 là **sự lệch thật của tầng**, cần một lượt sửa đồng loạt cho cả
  nhóm `tha-ap`; tôi không tự sửa vì ngoài lát của mình.
  **Câu 2.3-2.4 — mức chắc chắn, không phải sai nghĩa.** `Bhave nibbattamānamhi, /
  phalaṁ nibbattate mama.` đọc là *dù tái sanh ở đâu, quả của ta vẫn trổ ra*; tôi dịch
  *Dù tái sanh trong cõi đời nào, / quả lành của ta sẽ trổ ra.* `nibbattate` là
  ngôi thứ ba, không phải ngôi thứ nhất, nên câu phải để *của ta* chứ không *tôi*.
  `phalaṁ` ở đây là quả lành, khác với `phalaṁ` ở `tha-ap200` — cùng một chữ Pāli
  nhưng hai ngữ cảnh khác nhau, nên hai bản dịch khác nhau là đúng.
