notes: |-
  **Đo lại ba mệnh đề, không tin số đưa.** `0.1` Pāli `Jātaka` → **Jātaka**:
  đếm trên toàn tầng, 410/426 tệp `ja` giữ Pāli, 16 tệp dùng *Chuyện Tiền Thân* →
  theo đa số, giữ Pāli. `0.2` `Navakanipāta` → *Bộ Chín Bài Kệ* 8/9 (tệp lạ là
  *Bộ Chín Bài Kính* ở `thig9.1`). `0.3` `Gijjhavagga` → *Phẩm Hươu* 8/8. Cả ba khớp
  tuyệt đối với `ja429`, `ja430` nên dùng chung một cách ghi.

  **Tiêu đề.** `0.4` Pāli `2. Kosambiyajātaka`: tầng `name/` đã ghim (`ja-name:481.ja428`)
  đặt tên bản Anh là *The Incident at Kosambī*; `ja:0.4` trong tầng Việt là *N. Kinh <tên>*
  392/426 (nhóm *N. Chuyện Tiền Thân* chỉ 34, và đó là một loạt riêng của ja150-ja373),
  nên tôi dùng *2. Kinh Sự Tích Ở Kosambī*; `:11.1` theo mẫu `<tên> thứ hai.`
  đã có ở `ja102:2.1`, `ja112:2.1`, `ja122:2.1`.

  **Tra tiền lệ kèm đếm trước khi chốt từng câu.** 24/46 khoá có Pāli trùng nguyên văn
  ở bài khác của chính tầng, nên dùng lại nguyên văn bản Việt đã có:
  `3.1–3.4` trùng `ja371:4.1–4.4`; `4.1–4.2` trùng `ja371:4.1–4.2`; `4.3` trùng
  `ja371:5.3`; `4.4` trùng `ja371:5.4`; `5.1–5.3` trùng `ja371:6.1–6.3`; `2.2` trùng
  `ud5.9:3.2` (*nói lời vượt khỏi phạm vi*); `2.3` trùng `ud5.9:3.3` (*chúng nói theo ý
  thích*); `6.1` trùng `thag8.1:5.1`; `6.2–6.4` trùng `thag4.3:1.2–1.4`; `8.2` trùng
  `snp1.3:11.2`, `8.3` trùng `snp1.3:11.3`, `9.2` trùng `snp1.3:11.2`, `9.3` trùng
  `snp1.3:12.3`. Ở `8.1` và `9.1` cùng công thức `Sce/No ce labhetha nipakaṁ sahāyaṁ`
  của `snp1.3:11.1`/`12.1` (*người bạn đồng hành sáng suốt*) — Pāli hai bên chỉ khác
  dấu nháy mở đầu, nên tôi dùng lại cùng cách dịch nhưng không mang dấu nháy sang,
  vì nháy kép đã mở ở `1.1` và phải đóng đúng ở `10.4`. `9.4` cũng lấy nguyên văn của
  `snp1.3:12.4` (*hãy sống một mình như voi chúa trong rừng*).

  **Dấu lược `”ti.`** — đo trên tầng `ja`: giữ `”ti.` 197, chỉ để `”.` 120, còn lại 107
  viết kiểu khác. Theo đa số tôi giữ `”ti.` ở `10.4`.

  **Bốn chỗ phải tự quyết, ghi rõ là chọn.**
  - `1.4` `nāññaṁ bhiyyo amaññaruṁ`: câu chú giải Jātaka (bản chép trong tra cứu, không
    phải tầng đã ghim) hiểu là “đừng ai nghĩ ‘tôi là kẻ dài’, và khi Tăng chia rẽ thì
    đừng ai nghĩ một lý do khác: ‘Tăng chia rẽ vì tôi’”. Tôi dịch theo hướng đó:
    *đừng để ai nghĩ rằng đó là vì một lý do khác*. Cách đọc cũ của Francis–Neil dịch
    gọn là *let them not think it is a small thing*, tức chiều ngược với
    `bhiyyo`; tôi chọn theo văn bản chú giải vì Pāli là authority.
  - `2.4` `yena nītā na taṁ vidū`: câu chú giải nói rõ `yena bhaṇḍanena imaṃ
    nillajjabhāvaṃ nītā`, nên tôi dịch *họ không biết cơn tranh cãi nào đã dẫn đến sự
    suy đồi ấy* — thêm “tranh cãi” và “suy đồi” là hai danh từ có trong chú giải, không
    phải tự thêm nghĩa.
  - `7.1` `Aṭṭhicchinnā pāṇaharā`: chú giải giải đạt là “chân tay bị cắt, tay bị bắt
    đi”, nên tôi dịch *Cắt đứt chân tay, bắt giữ người ta*. Từ `pāṇahara` nghĩa đen
    là “kẻ bắt giữ tay người ta”; tôi dịch theo nghĩa thực tế (bắt làm tù) chứ không
    dịch chữ “tay” hai lần.
  - `7.4` `saṅgati`: chú giải nói nghĩa là cùng ăn chung một bát, tức quan hệ giao hữu;
    tôi dịch *giao hữu* để phủ đủ, không thu hẹp thành riêng “cùng ăn”.

  **`mātaṅgarañña`** — chú giải tách rõ `mātaṅgo` = voi (hatthī) và `arañña` = rừng, nên
  `mātaṅgaraññeva nāgo` là “voi ở rừng”. Tôi dùng *voi chúa trong rừng* để khớp nguyên
  văn `snp1.3:12.4` đã có trong tầng.

  **Dấu lược:** 0/46 khoá có `…pe…`; bản Việt không có dấu lược nào. Nháy kép mở ở
  `1.1`, đóng ở `10.4`, đúng như Pāli.

  **Triangulation:** không có tầng Anh đã ghim cho uid này nên bài chỉ dịch từ Pāli đã
  ghim cùng commit (`11c9d708978cde8ba61096d8a75f7ddfb846f639`). Không chạy được
  `npm run validate|test|check|build` theo lệnh phân công đợt này, nên technical_integrity
  là 9.6.