notes: |-
  **Đo lại ba mệnh đề, không tin số đưa.** `0.1` Pāli `Jātaka` → **Jātaka**:
  đếm trên toàn tầng, 410/426 tệp `ja` giữ Pāli, 16 tệp dùng *Chuyện Tiền Thân* →
  theo đa số, giữ Pāli. `0.2` `Navakanipāta` → *Bộ Chín Bài Kệ* 8/9 (tệp lạ là
  *Bộ Chín Bài Kính* ở `thig9.1`). `0.3` `Gijjhavagga` → *Phẩm Hươu* 8/8. Cả ba khớp
  tuyệt đối với `ja429`, `ja430` nên dùng chung một cách ghi.

  **Tiêu đề.** `0.4` Pāli `2. Kosambiyajātaka`: tầng `name/` đã ghim (`ja-name:481.ja428`)
  đặt tên bản Anh là *The Incident at Kosambī*; `ja:0.4` trong tầng Việt là *N. Kinh <tên>*
  392/426 (nhóm *N. Chuyện Tiền Thân* chỉ 34, và đó là một loạt riêng của ja150-ja373),
  nên tôi dùng *2. Kinh Sự Tích Ở Kosambī*; `:11.1` theo mẫu `<tên> thứ hai.`
  đã có ở `ja102:2.1`, `ja112:2.1`, `ja122:2.1`.

  **Tra tiền lệ kèm đếm trước khi chốt từng câu.** 24/46 khoá có Pāli trùng nguyên văn
  ở bài khác của chính tầng, nên dùng lại nguyên văn bản Việt đã có:
  `3.1–3.4` trùng `ja371:4.1–4.4`; `4.1–4.2` trùng `ja371:4.1–4.2`; `4.3` trùng
  `ja371:5.3`; `4.4` trùng `ja371:5.4`; `5.1–5.3` trùng `ja371:6.1–6.3`; `2.2` trùng
  `ud5.9:3.2` (*nói lời vượt khỏi phạm vi*); `2.3` trùng `ud5.9:3.3` (*chúng nói theo ý
  thích*); `6.1` trùng `thag8.1:5.1`; `6.2–6.4` trùng `thag4.3:1.2–1.4`; `8.2` trùng
  `snp1.3:11.2`, `8.3` trùng `snp1.3:11.3`, `9.2` trùng `snp1.3:11.2`, `9.3` trùng
  `snp1.3:12.3`. Ở `8.1` và `9.1` cùng công thức `Sce/No ce labhetha nipakaṁ sahāyaṁ`
  của `snp1.3:11.1`/`12.1` (*người bạn đồng hành sáng suốt*) — Pāli hai bên chỉ khác
  dấu nháy mở đầu, nên tôi dùng lại cùng cách dịch nhưng không mang dấu nháy sang,
  vì nháy kép đã mở ở `1.1` và phải đóng đúng ở `10.4`. `9.4` cũng lấy nguyên văn của
  `snp1.3:12.4` (*hãy sống một mình như voi chúa trong rừng*).

  **Dấu lược `”ti.`** — đo trên tầng `ja`: giữ `”ti.` 197, chỉ để `”.` 120, còn lại 107
  viết kiểu khác. Theo đa số tôi giữ `”ti.` ở `10.4`.

  **Bốn chỗ phải tự quyết, ghi rõ là chọn.**
  - `1.4` `nāññaṁ bhiyyo amaññaruṁ`: câu chú giải Jātaka (bản chép trong tra cứu, không
    phải tầng đã ghim) hiểu là “đừng ai nghĩ ‘tôi là kẻ dài’, và khi Tăng chia rẽ thì
    đừng ai nghĩ một lý do khác: ‘Tăng chia rẽ vì tôi’”. Tôi dịch theo hướng đó:
    *đừng để ai nghĩ rằng đó là vì một lý do khác*. Cách đọc cũ của Francis–Neil dịch
    gọn là *let them not think it is a small thing*, tức chiều ngược với
    `bhiyyo`; tôi chọn theo văn bản chú giải vì Pāli là authority.
  - `2.4` `yena nītā na taṁ vidū`: câu chú giải nói rõ `yena bhaṇḍanena imaṃ
    nillajjabhāvaṃ nītā`, nên tôi dịch *họ không biết cơn tranh cãi nào đã dẫn đến sự
    suy đồi ấy* — thêm “tranh cãi” và “suy đồi” là hai danh từ có trong chú giải, không
    phải tự thêm nghĩa.
  - `7.1` `Aṭṭhicchinnā pāṇaharā`: chú giải giải đạt là “chân tay bị cắt, tay bị bắt
    đi”, nên tôi dịch *Cắt đứt chân tay, bắt giữ người ta*. Từ `pāṇahara` nghĩa đen
    là “kẻ bắt giữ tay người ta”; tôi dịch theo nghĩa thực tế (bắt làm tù) chứ không
    dịch chữ “tay” hai lần.
  - `7.4` `saṅgati`: chú giải nói nghĩa là cùng ăn chung một bát, tức quan hệ giao hữu;
    tôi dịch *giao hữu* để phủ đủ, không thu hẹp thành riêng “cùng ăn”.

  **`mātaṅgarañña`** — chú giải tách rõ `mātaṅgo` = voi (hatthī) và `arañña` = rừng, nên
  `mātaṅgaraññeva nāgo` là “voi ở rừng”. Tôi dùng *voi chúa trong rừng* để khớp nguyên
  văn `snp1.3:12.4` đã có trong tầng.

  **Dấu lược:** 0/46 khoá có `…pe…`; bản Việt không có dấu lược nào. Nháy kép mở ở
  `1.1`, đóng ở `10.4`, đúng như Pāli.

  **Triangulation:** không có tầng Anh đã ghim cho uid này nên bài chỉ dịch từ Pāli đã
  ghim cùng commit (`11c9d708978cde8ba61096d8a75f7ddfb846f639`). Không chạy được
  `npm run validate|test|check|build` theo lệnh phân công đợt này, nên technical_integrity
  là 9.6.

  **Giải quyết draft 2026-10-12.** Đọc đối kháng toàn bài từ Pāli, đối chiếu bài song song `mn128:6.1–6.41` (cùng các kệ, có bản Anh Sujato và bản Việt trong kho) và các kệ `dhp3–6`, `dhp328–330`, `ud5.9`. Có **40/46 khoá** đổi chữ; trong đó khoảng 17 khoá là lỗi nghĩa thật của bản cũ, phần còn lại là thống nhất với tiền lệ. Mục “Bốn chỗ phải tự quyết”, mục `mātaṅgarañña`, ý `0.3` → *Phẩm Hươu* ở mục “Đo lại ba mệnh đề”, và danh sách khoá “dùng lại nguyên văn” ở mục “Tra tiền lệ” (với các khoá đã đổi dưới đây) **bị thay thế** bởi mục này; nhận xét về dấu lược `”ti.` ở trên không còn áp dụng (bản Việt kết bằng `.”` như `mn128:6.41`).
  - `0.3` `Gijjhavagga` là *Phẩm Kền Kền* (`gijjha` = kền kền; `ja430:0.3` đã ghi đúng, và `ja427:0.4` là `Gijjhajātaka`), không phải “Phẩm Hươu”. Mười một bài `ja427`–`ja438` khác còn ghi “Phẩm Hươu” là lỗi cùng loại, chưa sửa vì ngoài phạm vi bài này.
  - `1.1` bỏ “Hãy để tập thể hiểu rõ điều này” (Pāli là `puthusaddo samajano`, mô tả đám đông ồn ào, không phải mệnh lệnh); `1.2` `na bālo koci maññatha` là “chẳng ai nghĩ mình là kẻ ngu”; `1.4` bỏ ý “một lý do khác”, dịch sát `nāññaṁ bhiyyo amaññaruṁ`.
  - `2.1` `parimuṭṭhā paṇḍitābhāsā` là hai tính từ chỉ người (“mê muội, giả dạng bậc trí”), không phải “lời của bậc trí đã được nâng cao”; `2.4` bỏ “tranh cãi”, “suy đồi” là hai chữ chỉ có trong chú giải, không có trong Pāli.
  - `3.1–4.4` thống nhất với `mn128:6.9–6.16` (Pāli trùng nguyên văn), thay cho phần “Kẻ ấy/niềm oán hận ấy”; `5.1–5.4` thống nhất với `mn128:6.17–6.20`, bỏ “Chỉ có tình thương”, “pháp luật tự xưa xa” vì không có trong Pāli (`averena` là “không hận thù”, `sanantano` là “cổ xưa”).
  - `6.1–6.4` theo cách đọc `yamāmase` = “chúng ta phải tự chế” (`dhp6`, `mn128:6.22`, `thag8.1:5.2`: 3 nơi), thay cho “đang bị tiêu hoại”. Cách đọc “đang đi đến tiêu vong” (chú giải Pháp Cú, và còn ở `thag4.3:1.2`) cũng có người theo; đã chọn cách đa số tiền lệ và Sujato, ghi bất định.
  - `7.1` `pāṇahara` là “kẻ đoạt mạng” (`pāṇa` = mạng sống; `hara` = kẻ lấy), không phải “bắt giữ người ta”; `7.2` `gavāssa dhanahārino` là “kẻ cướp bò, ngựa, tài sản”, không phải “tài sản của bò”; `7.3` `vilumpamānānaṁ` là “cướp phá”, không phải “xé rách”; `7.5` `tumhāka` là “các vị” (hô cho người nghe, tệp này không có khung kể nên dùng từ trung tính), không phải “các ngươi”.
  - `8.2/9.2` thống nhất với `dhp328:2`/`dhp329:2` (`sādhuvihāri dhīra` = “người trí khéo sống”), bỏ “chú tâm” vì Pāli không có chữ đó; `8.4` `tena` chỉ một người bạn (số ít), không phải “bọn họ”; `9.3–9.4` dịch `mātaṅgaraññeva nāgo` là “voi trong rừng” (theo `dhp329:4`, `dhp330:4`), bỏ “chúa” vì không có chữ tương ứng.
  - `10.2` “kẻ dài” là chữ vô nghĩa, sửa thành “kẻ ngu” (`bāle`); `10.3–10.4` bỏ “không hề gặp nạn” (`appossukko` là “ít bận tâm/không vướng bận”).
  - Giữ chỗ chưa chắc: (a) `1.4` `aññaṁ bhiyyo` có hai cách đọc — “nghĩ thêm điều gì khác” (chọn) hoặc “nghĩ ai hơn người kia” (Sujato ở `mn128:6.4`); (b) `2.2` `vācāgocarabhāṇino` giữ “nói lời vượt khỏi phạm vi” theo tiền lệ `mn128:6.6`/`ud5.9:3.2`, cách đọc “chỉ nói trong phạm vi của lời nói” cũng có thể; (c) `6.2` như trên.
  - Phân loại blocker: câu thứ nhất (không có bản Anh Sujato cho uid này tại commit đã ghim) giữ nguyên, đó là sự thật về upstream. Câu về `vietnamese-current` chỉ có Pháp Cú đã **gỡ**: đó là giới hạn của tầng tham khảo (mọi bài Jātaka đều thiếu tầng này), không phải lỗi văn bản; bài này chỉ có Pāli + bản Anh song song của `mn128` để tham khảo, không có bản Hòa thượng Thích Minh Châu.
  - Coverage English: mẫu số là các khoá Pāli có nội dung của uid này, tầng `english-sujato` phủ 0 khoá (uid không có tệp), nên cổng English không đo được gì; `triangulation` chấm 7.5 (≤ 8.0) vì chỉ có bản Anh của bài song song `mn128`, không phải bản Anh độc lập cho chính uid này. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` nên `technical_integrity` giữ 9.6.
