notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho vv77.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 28 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.
  Kiểm toán độc lập 2026-10-11 (lượt cải thiện): đọc đối kháng 28 khoá với Pāli, đổi 20/28 khoá; 5 khoá sai nghĩa thật, 3 khoá tiêu đề còn để nguyên Pāli, 12 khoá nhỏ thêm nghĩa đã gọt. Lượt chấm 2026-10-04 (9.23) bỏ sót các lỗi dưới đây; các mục cũ ở trên về việc "dịch trực tiếp từ Pāli" và phân đoạn vẫn đúng, riêng nhận định "đã kiểm tra cẩn thận" bị thay thế.
  Lỗi nghĩa thật (đã sửa): (1) 2.3 `kāmaguṇettha pañca` — `kāmaguṇa` là 'dục lạc' (năm dục lạc), bản cũ 'năm dục công đức' sai thuật ngữ; `ettha` là 'ở đây', bản cũ thiếu; `rasā` chỉ là 'vị', bỏ 'ngon'. (2) 3.3 và 6.3 `vaṇṇo ca te/me sabbadisā pabhāsatī` — `vaṇṇo` là 'dung sắc' (chính từ đã dịch 'dung sắc' ở 3.1, 6.1), không phải 'hào quang'; bản cũ cùng một từ trong một bài mà hai nghĩa; bỏ 'rực rỡ' (Pāli chỉ `pabhāsatī`). 3.3 kết bằng dấu hỏi vì cả 3.1–3.3 là câu hỏi của người hỏi thiên tử. (3) 4.3 `yassa kammassidaṁ phalaṁ` — mệnh đề quan hệ 'về nghiệp mà đây là quả báo' (động từ `viyākāsi` bị lược ở 4.2), bản cũ 'đã giải thích quả báu của nghiệp ấy' thêm động từ và đảo quan hệ. (4) 5.3 `Ārāmarukkhāni ca ropayissaṁ` — `ārāma` là 'vườn' (song song `ārāmaropā vanaropā setukārakā` ở sn1.47: người trồng vườn, trồng rừng, làm cầu), bản cũ 'khuôn viên tu viện' và 'hàng cây bóng mát' là thêm nghĩa; `ropayissaṁ` dùng như quá khứ nên 'đã trồng'. (5) 0.2–0.4, 7.1 — bản cũ để nguyên Pāli ở tiêu đề (0.2, 0.3, 0.4), nay dịch theo họ vv75–vv81: 0.3 Phẩm Khéo Đặt Để, 0.4 Chuyện Cung Điện Cột Ngọc Châu (số 3 giữ như tiêu đề vv55/58/61), 7.1 bỏ chữ 'lâu đài' để khớp 'Cung Điện' của cả họ.
  Khoá nhỏ đã gọt (thêm nghĩa): 1.2 bỏ 'xung quanh' (đã có 'khắp bốn phía' cho `samantato`); 2.1 bỏ 'thỏa thích', sửa thứ tự theo Pāli `pivasi khādasi` thành 'uống và ăn'; 2.2 bỏ 'khúc nhạc'; 2.4 bỏ 'lượn bay' và 'khoác trang sức', 'tiên nữ' thành 'các nữ nhân phủ vàng' (Pāli `nāriyo ... suvaṇṇachannā`, khớp vv79); 3.1 và 6.1 bỏ 'sắc diện dung nhan' (hai chữ cho một `vaṇṇo`), 6.1 `tena` là 'nhờ vậy' (8/20 trong họ) thay 'do nghiệp ấy'; 4.1 bỏ 'vô cùng' (`attamano` đã là hoan hỷ); 5.2 bỏ 'qua lại' (`saṅkamana` là 'cầu'), `vivane` là 'nơi hoang vu'; 5.4 bỏ 'vô cùng', `Piyā ca me sīlavanto ahesuṁ` đảo lại đúng chủ thể: những bậc có giới đức là người thân quý của tôi (bản cũ làm tôi thành người quý mến); 5.5–5.6 bỏ 'phẩm vật phong phú dồi dào' (Pāli `dānaṁ vipulaṁ`), theo tiền lệ 'Với cơm ăn và nước uống, cùng tâm tịnh tín … đã cung kính bố thí rộng rãi' của vv61, vv72, vv73.
  Chưa phân xử, giữ bất định: 1.4 `rucakatthatā` — `rucaka` chỉ có trong công thức này (11 tệp vv), nghĩa 'vàng' hay 'rực rỡ' chưa phân xử được, giữ 'trải thảm rực rỡ' theo họ; 5.3 `ārāma` có thể là vườn công cộng hoặc khu vườn của tinh xá, giữ 'vườn' trung tính; 2.2 `vīṇā` giữ 'đàn hạc' theo họ vv54–vv59, vv79, vv85 (vv58 'tỳ-bà', vv64 giữ nguyên Pāli). Không sửa riêng một tệp: 0.2 `Purisavimāna` dịch 'Nam Hư Không' theo họ — Pāli không có `ākāsa`, cần sửa đồng loạt cả bộ (vv70, vv71 dùng 'Thiên Cung Của Nam Giới'); 1.1 'cao vút' và 1.3 'nguy nga tráng lệ' giữ theo họ vì nghĩa không lệch (`ucca`, `uḷārā`).
  Điểm: semantic_fidelity 9.3 → 8.8, grammar_logic 9.3 → 8.9, terminology 9.2 → 8.4, ambiguity_integrity 9.2 → 8.6; các tiêu chí còn lại giữ nguyên (triangulation vẫn 7.5 vì không có bản Anh độc lập). final_score 9.23 → 9.0 (đúng 9.0, không vượt ngưỡng 9.0 nên không đủ để xuất bản trực tiếp). Hạ điểm vì bản cũ có 5 khoá sai nghĩa thật và 3 tiêu đề chưa dịch mà lượt chấm 2026-10-04 bỏ sót.
  Không đổi `status`; blocker upstream (không có tầng tham khảo tiếng Anh) giữ nguyên. technical_integrity 9.6 vì lượt này không chạy gate; bốn lệnh gate do người điều phối chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
  Lượt cải thiện 2026-10-11 (lần hai, đọc đối kháng lại 28 khoá sau lượt trước): đổi 5/28 khoá, đều là sửa thuật ngữ/rõ nghĩa, đo tiền lệ bằng số đếm. (1) 1.1 `vimānaṁ` — bản trước 'Tòa lâu đài'; trong tầng vv, `vimāna` ở thân kệ dịch 'cung điện' 141 khoá, 'thiên cung' 12, 'lâu đài' chỉ 10, và chính bài này đã dùng 'Cung Điện' ở 0.4, 7.1; đổi thành 'Cung điện này cao vút, có cột bằng ngọc châu' (khoá khớp cấu trúc vv55). (2) 2.3 `dibbā rasā` — bản trước 'Những vị cõi trời' dễ bị đọc là các vị thiên (người), không phải vị (rasa); đổi thành 'Hương vị cõi trời', không thêm 'ngon' (Pāli chỉ `rasā`). `kāmaguṇa` giữ 'dục lạc' (23 tệp dùng 'năm dục lạc', 13 tệp dùng 'dục công đức'; cả hai đều có tiền lệ, chọn cách đã giữ ở bài này). (3) 3.1 `Kena tetādiso vaṇṇo` — bản trước 'Do nhân gì … như thế này' thêm 'nhân'; công thức này ở tầng vv dịch 'Do đâu … có được dung sắc như thế' (20/20 khoá đã dò), đổi theo. (4) 5.4 `Piyā ca me sīlavanto ahesuṁ` — 'những bậc có giới đức … người thân quý' đổi thành 'những người có giới đức đã là thân thương đối với tôi' theo vv74–vv76 (3/3 khoá); 'bậc' là thêm tôn xưng không có trong Pāli. (5) 0.2 `Purisavimāna` — 'Chuyện Cung Điện Nam Hư Không' không có căn cứ trong Pāli (không có `ākāsa`; `purisa` là nam nhân) và đây là tiêu đề phần chứ không phải tên một chuyện; đổi thành 'Thiên Cung Của Nam Giới', đúng cách vv51, vv66, vv70, vv71 đã dùng cho cùng dòng Pāli. Lưu ý lệch tiền lệ chủ ý: 27 tệp vv còn mang 'Nam Hư Không' (và 2 tệp để nguyên Pāli); cần sửa đồng loạt ở một đợt riêng, không sửa lẻ ngoài tệp này.
  Điểm lượt này: terminology 8.4 → 8.7 (khoá 1.1, 3.1, 5.4, 0.2 theo tiền lệ đã đo); vietnamese_clarity 9.3 → 9.4 (khoá 2.3, bỏ chỗ có thể hiểu nhầm 'vị' là các vị thiên); các tiêu chí còn lại giữ nguyên. semantic_fidelity giữ 8.8 vì `rucakatthatā` ở 1.4 vẫn chưa phân xử: 'thảm' là suy đoán về vật được trải (Pāli chỉ `atthatā` 'được trải' và `rucaka` chỉ gặp trong công thức này, 11 tệp vv), giữ 'trải thảm rực rỡ' theo họ. ambiguity_integrity giữ 8.6 vì các bất định đã nêu (1.4 `rucaka`, 5.3 `ārāma`, 2.2 `vīṇā`) chưa có căn cứ mới. final_score 9.0 → 9.04 (trung bình số học thô của 10 điểm). Blocker upstream không có tầng tham khảo tiếng Anh giữ nguyên; waiver giữ nguyên. technical_integrity 9.6, bốn lệnh gate do người điều phối chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Sửa lỗi nghĩa 2026-10-16: vv77:1.4 `rucakatthatā` — "trải thảm rực rỡ" → "được trải vàng" (`rucaka` là vàng/cát vàng, `atthata` là được trải, không có chữ nào cho "thảm"; căn cứ https://www.wisdomlib.org/definition/rucaka (PED: rucaka = vàng/cát vàng, "suvaṇṇa-vālikā"); Vv-a ad Vv 35 (https://www.tipitaka.org/romn/cscd/s0506a.att1.xml): "rucakupatiṇṇanti suvaṇṇavālikāhi okiṇṇaṅgaṇaṃ"; Indacanda "được trải lót bằng vàng" (https://www.tamtangpaliviet.net/VHoc/30a/Vv_03.htm)).
