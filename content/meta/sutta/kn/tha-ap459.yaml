  BẤT ĐỊNH đã ghi, không giấu:
  1. `Satānaṁ pañcakkhattuñca` (`:6.3`) — không có tiền lệ cùng Pāli trong 3.359 bài Việt và
     không có bản Anh đã ghim. Tôi dịch *Cũng cả trăm món báu cùng năm món quý*, giữ đúng hai
     số lượng của Pāli (`satānaṁ` và `pañcakkhattu`) mà không gán tên vật cụ thể, vì không
     có nguồn để xác nhận. Người điều phối nên tra lại.
  2. `carimo vattate bhavo` — 2/2 tiền lệ dịch *của Ngài*, nhưng vế trước là `Ayaṁ me
     pacchimā jāti` = *đời cuối cùng của ta* và người kệ nói về chính mình. Tôi giữ *của ta*.
  3. `Marīciyotthaṭā bhūmi` / `aṅgārāva mahī ayaṁ` (`:3.1–3.2`) — đọc là mặt đất bị nắng
     thiêu, chỉ còn như than; không có tiền lệ. `Upahanti mahāvātā` (`:3.3–3.4`) chủ ngữ là
     *gió lớn*, nên tôi để *Gió lớn thổi tới / hành hạ cả thân thể lẫn sinh mệnh*.
  4. `Sītaṁ uṇhaṁ vihanantaṁ` / `vātātapanivāraṇaṁ` (`:4.1–4.2`) — cặp khổ–nóng và ý cầu
     được che chở; không có tiền lệ.
  5. `padumuttaro bhagavā` (`:1.3`) và `padumuttaro mahāyaso` (`:5.2`) — `padumuttara` là
     *vượt hẳn bông sen* (tức tôn quý nhất), dịch theo nghĩa từ chứ không theo nghĩa *sen*.

  DẤU LƯỢC: Pāli có `…pe…` ở `:10.2`, `:11.2`, `:12.2`; bản Việt giữ **đúng một** `…` mỗi khoá.
