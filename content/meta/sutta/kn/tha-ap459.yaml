notes: |-
  Bản dịch chỉ từ Pāli root do commit đã ghim không có bản Anh upstream cho cả bộ `tha-ap`
  (giới hạn upstream). Đủ 10 tiêu chí; status bắt buộc `draft` do blocker tầng tham khảo Anh.

  TÊN PHẨM `:0.3` — đo lại trên 341 bài `tha-ap` đã có `:0.3`: KEEP số thứ tự 66 / DROP 275.
  Ngược với 62/49 của lát trước, nên theo phép đo của lát này: BỎ số thứ tự. Mẫu câu đủ ba
  hướng đã đo: *Bài Kệ Tuyên Ngợ Về Trưởng Lão* 192/341, *Ký Sự Về Trưởng Lão* 84/341,
  *Bài Kệ Tuyên Ngôn Về Trưởng Lão* 65/341. Phẩm cục bộ của bài này là *Phẩm Cúng Dường Bệ
  Nền* (`Jagatidāyakavagga`), đo được *Tuyên Ngợ* 7/7 — cùng hướng đa số toàn tầng, nên `:0.3`
  và `:14.1` cùng dùng *Bài Kệ Tuyên Ngợ Về Trưởng Lão*.

  `:0.1` `Therāpadāna` giữ nguyên Pāli: 332/341. `:0.2` *Phẩm Cúng Dường Bệ Nền* 7/8 trong
  chính phẩm (thay cho *Phẩm Jagatidāyaka* 1/8).

  TIỀN LỆ dùng lại: `Aṅgārajātā pathavī` và `kukkuḷānugatā mahī` trùng nguyên văn với
  `ja421:1.1–1.2` (1/1); `abbhokāsamhi caṅkami` 1; `Anukampako kāruṇiko` 2/3;
  `Mama saṅkappamaññāya` 4; `cakkavattī ahosahaṁ` 2/3; `Padesarajjaṁ vipulaṁ` 6;
  `gaṇanāto asaṅkhiyaṁ` 2; `pubbe sukatamattano` 1; `Satasahassito kappe` 11/19.
  Ba khối kệ chung cho cả bốn bài `tha-ap` của lát: `Kilesā jhāpitā mayhaṁ` 69;
  `viharāmi anāsavo` 68; `Svāgataṁ vata me āsi` 67; `kataṁ buddhassa sāsanaṁ` 81;
  `Paṭisambhidā catasso` 341; `Duggatiṁ nābhijānāmi` 110/315.

  BẤT ĐỊNH đã ghi, không giấu:
  1. `Satānaṁ pañcakkhattuñca` (`:6.3`) — không có tiền lệ cùng Pāli trong 3.359 bài Việt và
     không có bản Anh đã ghim. Tôi dịch *Cũng cả trăm món báu cùng năm món quý*, giữ đúng hai
     số lượng của Pāli (`satānaṁ` và `pañcakkhattu`) mà không gán tên vật cụ thể, vì không
     có nguồn để xác nhận. Người điều phối nên tra lại.
  2. `carimo vattate bhavo` — 2/2 tiền lệ dịch *của Ngài*, nhưng vế trước là `Ayaṁ me
     pacchimā jāti` = *đời cuối cùng của ta* và người kệ nói về chính mình. Tôi giữ *của ta*.
  3. `Marīciyotthaṭā bhūmi` / `aṅgārāva mahī ayaṁ` (`:3.1–3.2`) — đọc là mặt đất bị nắng
     thiêu, chỉ còn như than; không có tiền lệ. `Upahanti mahāvātā` (`:3.3–3.4`) chủ ngữ là
     *gió lớn*, nên tôi để *Gió lớn thổi tới / hành hạ cả thân thể lẫn sinh mệnh*.
  4. `Sītaṁ uṇhaṁ vihanantaṁ` / `vātātapanivāraṇaṁ` (`:4.1–4.2`) — cặp khổ–nóng và ý cầu
     được che chở; không có tiền lệ.
  5. `padumuttaro bhagavā` (`:1.3`) và `padumuttaro mahāyaso` (`:5.2`) — `padumuttara` là
     *vượt hẳn bông sen* (tức tôn quý nhất), dịch theo nghĩa từ chứ không theo nghĩa *sen*.

  DẤU LƯỢC: Pāli có `…pe…` ở `:10.2`, `:11.2`, `:12.2`; bản Việt giữ **đúng một** `…` mỗi khoá.
  50/50 khoá đã dịch, không còn khoá trống.

  HẠN CHẾ KỸ THUẬT: đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`, nên tiêu chí 10 bị chặn ở 9.6. Tôi chỉ xác minh được JSON hợp lệ, đủ 50/50
  khoá đúng exact ID, NFC, ngoặc kép cong cân trên cả bài, dấu lược khớp Pāli từng khoá.
  Kiểm bằng `save_vi` của `_hvi.py`. Người biên tập phải chạy lại bốn lệnh trên trước khi
  đổi trạng thái.

  Sửa lan 2026-10-13: (1) `2.1`, `4.3`, `8.3`, `9.2`, `9.4` — *chiếc chòm* → *chiếc lọng* (`chatta` = lọng, không có nghĩa "chòm"; tầng dịch *lọng* ở `tha-ap295:3.4`, `tha-ap295:4.4` *việc dâng lọng*; 2 khoá Pāli `chattadānassidaṁ phalaṁ` khác trong tầng cũng *đó là quả báo của việc dâng lọng*; *chiếc chòm* chỉ có ở bài này, 5 khoá). `9.4` dùng lại nguyên văn *đó là quả báo của việc dâng lọng.* (2) `8.2` *này là đời cuối cùng của ta* → *kiếp sống tối hậu đang diễn ra* (`carimo vattate bhavo`; 12 bài dịch như vậy — `tha-ap4:18.2`, `tha-ap57:8.2`, `tha-ap414:43.2`, `tha-ap460:5.2`… — so với 2 bài (bài này và `tha-ap440:8.2`) lặp *đời cuối cùng của ta*; bản cũ còn trùng nghĩa với `8.1` `Ayaṁ me pacchimā jāti` *Đây là đời cuối cùng của ta*, mất vế `vattate` *đang diễn ra*). (3) Hai lỗi thêm cùng bài, cùng loại: `5.2` *bậc Tôn Đức vượt hẳn bông sen, danh tiếng lẫn lội* → *Đức Padumuttara danh tiếng lớn* (`padumuttaro` là tên Đức Phật, đã dịch *Padumuttara* ở `1.3`; `mahāyaso` → *danh tiếng lớn* theo `tha-ap490:4.2`, `tha-ap414:33.2`; *vượt hẳn bông sen*, *lẫn lội* không có trong Pāli); `5.4` *bậc Chân Đãng nhận lấy* → *bậc Chiến Thắng nhận lấy* (`jino` → *chiến thắng* gần 400 khoá; *Chân Đãng* 1 khoá toàn tầng, chính là khoá này). Chưa sửa vì ngoài phạm vi lượt này và chưa đối chiếu hết: `3.4` *hành hạ cả thân thể lẫn sinh mệnh* (`sarīrassāsukhepanā`) — nên soát lại. (4) `6.3` *Cũng cả trăm món báu cùng năm món quý* → *Và năm trăm lần* (`Satānaṁ pañcakkhattuñca`: `sata` ×5 = 500 (5 × 100), không phải *trăm món báu* và *năm món quý*; 8 bài cùng Pāli dịch *(Và) năm trăm lần* — `tha-ap345:3.3`, `tha-ap430:17.3`, `tha-ap558:18.1`, `tha-ap536:15.3`, `tha-ap503:18.1`, `tha-ap489:30.1`, `tha-ap539:18.3`, `tha-ap541:17.3` — so với 3 bài dịch sai, trong đó bài này và `tha-ap344:7.3`, `tha-ap375:7.3` ngoài lane chưa sửa; Pāli trùng ở `6.3` nay khớp với `cakkavattī ahosahaṁ` ở `6.4`, *năm trăm lần … làm Chuyển Luân Vương*).

  Sửa lan 2026-10-13 (cơ học, toàn tầng): khoá tha-ap459:9.3 — `duggatiṁ nābhijānāmi` trước dịch “Ta
  không biết mình rơi vào khổ đau,”, đảo nghĩa (Pāli: không còn biết đến, tức không còn rơi vào, đọa
  xứ nào) → “Ta không còn biết đến đọa xứ,”; giữ nguyên xưng hô của bài. Cùng công thức đã dịch đúng ở
  đa số khoá trong tầng.
