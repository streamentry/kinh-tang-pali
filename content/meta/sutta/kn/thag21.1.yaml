  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    1. `73.2` `tīṇi saṭṭhisatāni`: đọc là ba trăm sáu mươi theo khuôn `dve satā saṭṭhi` (260) ở `73.3` và tổng 1000 + 360 = 1360 theo truyền thống, khớp 264 trưởng lão. Nhưng ở `ja461:13.2` `saṭṭhi vassasatāni` dịch `sáu mươi trăm năm`, nên `saṭṭhisatāni` cũng có thể đọc là `sáu mươi trăm`; bản Việt không đọc theo cách đó vì `tīṇi` nhân lên sẽ cho số vô lý. Bản BJT của Bhikkhu Indacanda viết tổng 1291, khác hẳn (BJT là một văn bản Pāli khác). Đây là cụm số không có chứng cứ độc lập; không phán chắc.
    2. `2.4` `sahassaṁ apalāyinaṁ`: đọc là sở hữu cách số nhiều theo khuôn `sahassaṁ bhikkhūnaṁ` (`30.1`): `một nghìn người không bỏ chạy` (đám cung thủ). Sujato đọc là `tôi không bỏ chạy`.
    3. `7.2` `jagatogadhaṁ` (`thấm sâu vào thế gian`, Sujato `planet's deep`); `7.4` `mutattā` (Sujato `the self-examined`; `sn8.2` thêm `giải thoát`; BJT `bản thân đã được cảm nhận`); `8.2` `paṭighe`/`mute` (Sujato `impingement`, `thought`).
    4. `9.1` `saṭṭhisitā`: giữ `sáu mươi` không thêm gì; `9.3` `vaggagatassa` không có chủ ngữ nêu rõ; `9.4` `duṭṭhullagāhī` (`nắm giữ điều thô tục`, Sujato `utter lewd speech`).
    5. `10.4` `paṭicca parinibbuto`: `nương duyên` (BJT `tùy duyên`, Sujato và `sn8.2` bỏ không dịch). Không có chứng cứ độc lập để chọn.
    6. `14.1` `akhilo`: `không chai cứng` (Sujato `not hard-hearted`); `14.4` `vijjāyantakaro` hiểu là `dùng minh để chấm dứt`.
    7. `34.2` `khīlāni` (`các cọc`); `34.4` `asitaṁva`: đọc `asita` là không nương tựa, theo BJT và `sn8.8`; Sujato đọc là đối tượng `the unattached`.
    8. `36.2` `sabbaṭhitīnaṁ`: `mọi trụ xứ` (Sujato `all planes`, `sn8.8` `mọi tầng hữu`); `36.4` `aggaṁ`: `điều tối thượng` (Sujato `first`).
    9. `49.4` `nirāmagataddasā`: Pāli ghim viết `nirāma-`, trong khi Pāli của `sn8.12:4.4` viết `niyāma-`. Sujato (cùng nguồn Pāli này) và BJT đều hiểu là `niyāma` (chỗ chắc chắn); bản Việt theo cách đó và `sn8.12` đã có `sự đạt đến quyết định`. Nếu giữ `nirāma` nguyên nghĩa (không nhơ) thì nghĩa khác. Người biên tập cần phán.
    10. `56.3` `mutyapekho` (`mong cầu giải thoát`, hiểu là muttiyā apekkho); `64.2` `samuggahītaṁ` (`nắm giữ chu đáo`; Sujato `we will adopt it`).
    11. `63.2` `Niggayha dhonaṁ vadessāmi dhammaṁ`: `vadessāmi` là ngôi thứ nhất số ít tương lai nhưng Sujato và `snp2.12:10.2` đều dịch là lời thỉnh; bản Việt theo `con xin thỉnh Ngài nói Pháp`. `63.4` `saṅkheyyakāro` dịch `cân nhắc` (Sujato `comprehensibility-granter`, `snp2.12` `thấu hiểu`).
    12. `67.3` `Kaṇhassa sotaṁ`: `dòng chảy của bóng tối` (theo `snp2.12:14.3` và Sujato); nếu hiểu `Kaṇha` là Māra thì thành `dòng chảy của Kẻ Đen Tối`. Cùng từ `kaṇha` ở `1.4` dịch là người, `Kẻ Đen Tối`; hai chỗ khác nghĩa là chủ ý.
    13. `70.2`–`70.3` `kappiyo`, `kappāno` và `66.2` `Kappāyano`, `61.4` `kappaṁ`: các dạng tên của cùng một vị; bản Việt giữ `Kappa` ở `61.4` và dùng `Kappāyana` cho ba chỗ còn lại, theo `snp2.12`.
    14. `32.1`, `71.4` `Nāga` dịch `Long Tượng` (Sujato `Giant`); `55.3` `Aggāḷave` dịch `tại Aggāḷava`, không thêm `đền thờ`.
    15. `71.5` `itthaṁ sudaṁ`: các khoá `tha-ap` dịch câu tương tự là `Tôi nghe như vầy:`; ở đây không dùng vì Pāli không có `evaṁ me sutaṁ`.
    16. `1.1` tiền lệ `sn8.1:2.1` dịch `Dầu ta đã xuất gia` thêm sắc thái nhượng bộ không có chữ riêng trong Pāli (`vata ... santaṁ`); bản Việt theo tiền lệ để thống nhất với `1.3` `vẫn còn tràn đến`.
    Toàn bài giữ cách xưng `tôi` (Vaṅgīsa nói), `ngươi` (nói với Māra và với chính mình), `ông` (Ānanda nói với Vaṅgīsa), `con`/`chúng con` (khi nói thẳng với Đức Phật), `chúng tôi` (kệ tự thuật `45`–`46`), theo khuôn `thag16.6`.

