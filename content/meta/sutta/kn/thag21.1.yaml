  TIỀN LỆ TRÙNG NGUYÊN VĂN — ĐÃ DÒ. Đo toàn tầng (dn, mn, sn, an, kn), so Pāli bỏ dấu câu và hoa thường, bỏ khối `0.x`: 210 khoá nội dung của bài có Pāli trùng nguyên văn với ít nhất một khoá ngoài bài; nguồn chính là `snp2.12` (48 khoá), `sn8.8` (21), `sn8.1` và `sn8.7` (17 mỗi bài), `snp3.3` (15), `sn8.4` (14), `sn8.5` (13), `sn8.2`, `sn8.6`, `sn8.10` (11), `sn8.12` (10), `sn8.3` và `sn8.9` (8), `snp2.11` (8): bài là bản gộp các kệ của Tương Ưng Vaṅgīsa và Kinh Nigrodhakappa. Dùng lại nguyên văn (sau khi bỏ dấu câu, nháy) ở 80/210 khoá. Khác ở 130/210 khoá; trong số đó chỉ 7 khoá khác thuần túy vì đổi ngôi (`ta`/`con` ⇒ `tôi` theo khuôn `thag`); phần còn lại khác do ranh giới pāda lệch (bản `sn8`/`snp2.12` căn câu khác Pāli ghim ở nhiều khoá), do tiền lệ dịch sai nghĩa hoặc thêm chữ không có trong Pāli, hoặc khác tinh thần nhỏ. Cố ý khác tiền lệ, đã đọc ngữ cảnh: `2.2` (`daḷhadhammino` dịch `có cây cung vững chắc` theo Sujato và BJT, tiền lệ `tinh thần kiên định`); `7.1` (`trên đất` thay `dưới đất`, `pathavi` là đất); `7.4` (không dịch `giải thoát` cho `mutattā`); `8.2` (`va chạm` và `cái đã cảm nhận` thay `xúc chạm` và `điều đã nghĩ`); `12.2` (bỏ `nên` không có trong Pāli); `29.2` (`đồ bỏ đi` 8 khoá theo tầng, thay `kẻ hư hèn`); `31.1` (`vimalaṁ` là `không vết nhơ`, tránh nhầm với `visuddha` là thanh tịnh); `36.4` (không thêm `Pháp` cho `aggaṁ`); `43.3` (`aneka` là nhiều, không phải mọi); `49.4` (xem bất định); `59.2` (`aññāṇa` là `vô tri`, tiền lệ `vô minh`); `63.4` (`saṅkheyyakāro` là `cân nhắc`, tiền lệ `thấu hiểu`); `66.1` (`acarī` là `sống`, theo `sống phạm hạnh`); `6.1` (`arati` là `bất mãn` theo tầng, tiền lệ `chán nản`). Các khoá còn lại giữ cách dịch của tiền lệ.

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `muni` → mâu-ni (239 khoá Pāli chứa `muni`: mâu-ni 144, ẩn sĩ 40, hiền giả 8, hiền trí 5; riêng 22 khoá thag/thig: mâu-ni 7, ẩn sĩ 4, `bậc muni` 3, hiền giả 3); `mahāmuni` → Đại mâu-ni (`thag19.1`); `isi` → ẩn sĩ (thag/thig 9/12).
    · `maccu`, `maccuhāyin`, `maccuno jālaṁ` → tử thần (20 khoá thag/thig/sn8/snp/ud/iti/dhp: tử thần 11, Thần Chết 5); `maccuhāyino` dùng lại nguyên văn `sn8.7:8.4` (`hàng phục tử thần`); `maccudheyyaṁ` → lãnh địa (13 khoá, `cõi` 13).
    · `tevijjā` → tam minh (27 khoá `tam minh` so 18 `ba minh` toàn tầng; Pāli `tevijjo` trùng nguyên văn ở `sn8.9:5.1`, `sn8.12:6.3`, `tha-ap25:26.1` đều `tam minh`); khác với `tisso vijjā` ở `thag19.1` là `ba minh`.
    · `arati` → bất mãn (33 khoá, `chán nản` 7, `bất lạc` 5 trong 80); `vitakka` → tầm (248/412); `māna` → ngã mạn; `nibbidā` → nhàm chán (110, `yếm ly` 9); `ekagga` → nhất tâm (93/119); `kāmarāga` → dục tham (49, `tham dục` 23); `upadhi` → sanh y (15/21); `paṭibhāna` → biện tài (40 khoá, `ứng đối` 15, `tài biện luận` 4).
    · `pajā` → loài người (42, chúng sinh 24); `janā` → người đời (`người` 68; chọn `người đời` để phân biệt với `pajā` trong cùng kệ `12`); `cakkhumā` → bậc Có Mắt (`có mắt` 25); `mahāvīra` → bậc đại anh hùng (anh hùng 55, đại hùng 17); `sambuddha` → bậc Chánh Đẳng Giác (21/28); `devadeva` → bậc Thiên Trung Thiên (theo `tha-ap4:7.2`, `tha-ap515:1.2`); `ādiccabandhu` → bậc thân quyến của Mặt Trời (thân quyến 20, `Mặt Trời` viết hoa 25 so 15 viết thường); `dvipaduttama` → tối thắng giữa loài hai chân (7 khoá).
    · `parinibbuta`/`nibbāyi` → nhập Niết-bàn (74/234; 30/51 vì `nibbāyi` còn nghĩa lửa tắt); riêng `10.4` (vị còn sống, đang chờ thời) dùng `hoàn toàn tịch tịnh`, không dùng `nhập Niết-bàn` vì dễ hiểu thành đã mất; `abhinibbutatto` → tâm hoàn toàn tịch tịnh (`snp2.12:2.4`).
