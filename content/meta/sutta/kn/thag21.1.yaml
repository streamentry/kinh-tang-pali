notes: |-
  Phạm vi: đủ 309/309 khoá của bài (4 khoá tiêu đề `0.1`–`0.4`; 287 khoá kệ thuộc 71 nhóm kệ `1.1`–`71.4`, riêng `25.5`–`25.6` và `67.5` nằm ngoài khuôn bốn dòng; `71.5` dòng bìa, `71.6` dòng đóng Bộ Lớn; `72.0`–`72.5`, `73.0`–`73.4`, `74.1`–`74.5` là các bài kệ tóm tắt và dòng đóng toàn bộ Theragāthā). Không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã in và đọc đối chiếu cả 309 cặp Pāli↔Việt, không đọc mẫu.

  Bài là một chuỗi kệ của trưởng lão Vaṅgīsa, gồm nhiều đoạn có người nói khác nhau: kệ `1`–`14` tự nhủ và nói với Māra (kệ `1`–`5` đối thoại với Ác ma, `6`–`10` về vị tỳ-kheo đích thực, `11`–`14` tự nhắc mình bỏ ngã mạn); kệ `15`–`18` Vaṅgīsa hỏi Ānanda và Ānanda đáp; kệ `19`–`22` bốn kệ về lời khéo nói; kệ `23`–`25` tán thán Sāriputta; kệ `26`–`29` tán thán Đức Phật trong ngày rằm có năm trăm tỳ-kheo; kệ `30`–`37` tán thán Đức Phật giữa hơn một ngàn tỳ-kheo; kệ `38`–`40` tán thán Koṇḍañña; kệ `41`–`43` tán thán Moggallāna; kệ `44` tán thán Đức Phật như mặt trăng và mặt trời; kệ `45`–`54` tự thuật xuất gia và chứng đạt; kệ `55`–`66` hỏi Đức Phật về vị tỳ-kheo Nigrodhakappa đã qua đời tại Aggāḷava; kệ `67` lời đáp của Đức Phật; kệ `68`–`71` lời kết. Dấu nháy theo đúng từng khoá của Pāli: Pāli mở nháy kép ở `1.1`, `15.1`, `16.1`, `19.1`, `23.1`, `26.1`, `34.1`, `38.1`, `41.1`, `44.1`, `45.1`, `55.1`, `67.1`, `68.1` và đóng ở `14.4`, `15.4`, `18.4`, `22.4`, `25.6`, `33.4`, `37.4`, `40.4`, `43.4`, `44.4`, `54.4`, `66.4`, `67.5`, `71.4`; bản Việt giữ đúng như Pāli, kể cả chỗ `34.1` mở nháy mới sau khi nháy mở ở `26.1` đã đóng ở `33.4` (cùng đóng ở `37.4`). Nháy đơn chỉ có ở `32.1` (`‘Nāganāmo’si`).

  TIÊU ĐỀ VÀ TÊN BỘ. `0.2` `Mahānipāta` dịch `Bộ Lớn`: tầng không có khoá nào cùng Pāli (0), bản Anh Sujato `The Great Book`. Cách dịch tên bộ khác (`Paññāsanipāta` ở `thag19.1` là `Bộ Năm Mươi Bài Kinh`) theo số đếm, nên `72.1` `Sattatimhi nipātamhi` (sattati 70) dịch `Trong Bộ Bảy Mươi Bài Kinh`. `0.3` `Paṭhamavagga` `Phẩm Thứ Nhất` (dùng lại, khuôn `thag16`–`thag19`). `71.6` `Mahānipāto niṭṭhito` `Bộ Lớn đã khép lại.` theo `thag19.1:55.6`; `72.0`, `73.0` `Tatruddānaṁ` `Tóm tắt ở đây:` (khuôn `thag13.1:14.0`, `thag16.10:30.0`, `thag19.1:56.0`).

  COVERAGE ENGLISH — ĐO THẬT. Tra manifest: `english-sujato` có tệp cho bài này (`sutta/kn/thag/thag21.1_translation-en-sujato.json`, đúng 309 khoá ID, cùng thứ tự với Pāli). Theo công thức cổng (`source/layers.yaml`: bỏ khối `0.x`, Pāli đủ 40 ký tự sau khi gộp khoảng trắng) mẫu số chỉ là 2 khoá (`55.2` đúng 40 ký tự, `71.5` 55 ký tự) và cả 2 đều có prose của Sujato, tức 2/2 = 1,0. Mẫu số quá nhỏ nên cổng gần như không đo được gì; tôi đo thêm thô riêng: trên 305 khoá không phải khối `0.x`, Sujato có prose ở 290/305 = 0,951; 15 khoá trống đều là các kệ tóm tắt và dòng đóng ở cuối (`72.0`–`72.5`, `73.0`–`73.4`, `74.1`–`74.4`), không có kệ nội dung nào trống. `english-project`: không có tệp cho bài này, không cần lấp. `vietnamese-current`: vắng tại commit đã ghim (bilara chỉ có Pháp Cú). Không có entry trong `reference-gaps.yaml`. Bản Việt nguyên bài của Bhikkhu Indacanda (theo bản BJT, 1221–1291) chỉ là tra cứu toàn văn, không căn lề theo khoá, nên không tính là tầng tham khảo; tôi chỉ dùng nó để đối chiếu từng chỗ khó. Triangulation chỉ có một bản Anh độc lập (Sujato) cộng Pāli, cộng với bản Việt của chính dự án ở các bài trùng Pāli (xem mục tiền lệ; đó không phải một lớp đọc độc lập), nên điểm triangulation để 8,8.

  VÌ SAO `published`. Không có blocker: 309/309 khoá, 0 thừa, 0 thiếu, nháy và dấu lược khớp Pāli từng khoá, các con số đã tự tính (xem phép 5). Trung bình số học thô của 10 tiêu chí là 9,05, lớn hơn 9,0, nên theo bảng gate bài ở `published`. Biên hẹp: các điểm `semantic_fidelity`, `grammar_logic` và `ambiguity_integrity` bị trừ vì còn khoảng hai mươi chỗ Pāli khó chưa phân xử chắc (xem mục bất định). Technical gate chưa chạy (xem cuối): nếu một trong bốn lệnh đó đỏ thì status phải xét lại.

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 309 = Pāli 309, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
    2. Nháy đơn và kép khớp Pāli từng khoá: 0/309 lệch (hai chuỗi ký tự nháy của mỗi khoá so bằng nhau). Tổng 30 ký tự nháy ở Pāli (28 nháy kép: 14 mở, 14 đóng; cộng 2 nháy đơn ở `32.1`); bản Việt đúng bấy nhiêu ký tự ở cùng các khoá. Phép này có mẫu, không rỗng. Lỗi bắt được lúc đầu: tôi bỏ sót nháy mở ở `16.1` và `34.1`, phép so từng khoá báo lệch, đã sửa.
    3. Pāli trùng nguyên văn TRONG CHÍNH bài: 5 nhóm (`28.3`/`41.3`; `28.4`/`41.4`; `40.2`/`54.4`; `41.2`/`43.2`; `72.0`/`73.0`). Cả 5 nhóm bản Việt giống nhau từng chữ (`40.2`/`54.4` chỉ khác nháy đóng ở `54.4` đúng như Pāli). 0 nhóm khác về lời. Phép này có mẫu, không rỗng.
    4. Dấu lược: Pāli có `(…)` ở đúng 1 khoá (`16.4`, `rāgūpasaṁhitaṁ. (…)`), Việt có đúng 1 `(…)` ở khoá đó, giữ nguyên và đứng sau dấu chấm (đa số kiểu `an9.22:1.2` `Các ông hãy nghe. (…)`). `…pe…`: 0 ở Pāli; `…` trần: 0 ở Pāli nên 0 ở Việt. Lỗi 0/309. `(iti bhagavā)` ở `67.2` là ngoặc đơn không có dấu lược, dịch `(Đức Thế Tôn nói)` đúng khuôn 13 khoá `snp1.2`.
    5. Số Pāli (tự tính):
       · `sahassaṁ apalāyinaṁ` (`2.4`) = sahassa 1000 ⇒ một nghìn (khuôn `sn8.1:3.4`).
       · `pañcasatā` (`26.2`) = pañca 5 × sata 100 = 500 ⇒ năm trăm; `pannarase` (`26.1`) = 15 ⇒ ngày rằm.
       · `parosahassaṁ` (`30.1`) = para (hơn) + sahassa 1000 ⇒ hơn một ngàn; `sahassanetto` (`58.4`) = ngàn mắt.
       · `saṭṭhisitā` (`9.1`) = saṭṭhi 60 ⇒ sáu mươi (không thêm `kiến chấp`, bản `sn8.2` chèn thêm trong ngoặc; BJT viết 62, Pāli đã ghim chỉ có `saṭṭhi`).
       · `tevijjā`/`tevijjo` (`28.4`, `40.1`, `41.4`, `54.3`) = 3 vijjā ⇒ tam minh.
       · `cattāri ariyasaccāni` (`50.3`) = 4 ⇒ bốn Thánh đế; `caṭṭhaṅgikaṁ` (`51.3`) = aṭṭha 8 + aṅga ⇒ tám chi phần.
       · `dasaddhānaṁ` (`36.4`) = dasa 10 + addha (một nửa) = 5 ⇒ nhóm năm; `pañcaseṭṭho` (`67.5`) = pañca 5 ⇒ nhóm năm.
       · `isisattamo` (`32.2`), `isisattama` (`68.2`) = sattama thứ bảy ⇒ ẩn sĩ thứ bảy (504/513 khoá toàn tầng viết `thứ bảy`).
       · `dvipaduttama` (`71.2`) = dvi 2 + pada ⇒ tối thắng giữa loài hai chân.
       · `Sattatimhi` (`72.1`) = sattati 70 ⇒ Bộ Bảy Mươi Bài Kinh; `ekasattati` (`72.4`) = eka 1 + sattati 70 = 71 ⇒ bảy mươi mốt, khớp đúng 71 nhóm kệ `1`–`71` của bài.
       · `sahassaṁ` (`73.1`) = 1000; `tīṇi saṭṭhisatāni` (`73.2`) = tīṇi 3 + sata 100 + saṭṭhi 60 ⇒ ba trăm sáu mươi, theo khuôn `dve satā saṭṭhi` (`73.3`) = 200 + 60 = 260 trong cùng đoạn (xem bất định số 1); `cattāro` (`73.4`) = 4 ⇒ 260 + 4 = 264 vị trưởng lão, khớp 264 tệp `thag` của tầng Anh đã ghim.
       Cạm bẫy tiếng Việt đã tránh: không nhầm `bốn`/`tư`, không có thang `ngàn`/`nghìn` nhân sai.
