  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.

  Kiểm mẫu ngẫu nhiên 2026-10-15 (lượt B7): `2.2` bỏ "kinh hành tĩnh tọa" vì Pāli chỉ `abbhokāse atināmayi` (trải qua ngoài trời); `5.4` `parinibbissati` là thì tương lai, đã sửa thành "sẽ hoàn toàn tịch diệt" (Sujato: he'll be fully quenched).

  Quyết định hội đồng biên tập 2026-10-16: B9 — thag5.11:5.1 (`pariññā`/`parijānāti` = liễu tri cả họ).
