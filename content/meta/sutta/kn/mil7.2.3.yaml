notes: |-
  Đã đọc HẾT Pāli lát (w6.pali.txt, 447 dòng, 196 khoá / 14 bài) trước khi viết chữ nào.

  TẦNG THAM KHẢO — đo, không đoán. 0/14 bài có bản Anh Sujato tại commit đã ghim: tôi đếm ở
  `source/upstream-manifest.json` (edition `translation/en/sujato` có 4291 tệp; trong `kn/` chỉ
  755 tệp thuộc cp, dhp, iti, ja, kp, snp, thag, thig, ud; KHÔNG có tệp mil* nào ngoài
  `name/sutta/mil-name`), rồi đếm lại trong `.cache/upstream/suttacentral/translation/en/sujato/`
  và bằng `find . -name 'mil*'`: kết quả vẫn 1 tệp tên. Đây là `not-published-upstream`, KHÔNG
  phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit
  đã ghim có 26 tệp và toàn bộ là Pháp Cú, nên Trường Bộ không có bản Thích Minh Châu để đối
  chiếu. Lớp lấp English của dự án (`content/translation/en/project/sutta/kn/`) có 24 tệp mil*
  nhưng không có uid nào của lát w6. Ba tầng tham khảo đều vắng ⇒ blocker thật ⇒ status `draft`.

  BẰNG CHỨNG NGOÀI TẦNG ĐÃ GHIM — ghi rõ để không ai tưởng là tầng store. Để phân xử mấy từ khó
  khó, tôi tra (1) Từ điển Pāli–Anh của PTS (Childs 2001) qua DDSA, và (2) bản dịch
  T.W. Rhys Davids 1890/1894 mà SuttaCentral dựng lại từ Internet Sacred Text Archive — bản
  công cộng, KHÔNG nằm trong `source/suttacentral.lock.json`, chỉ dùng làm bằng chứng về cách
  parse cú pháp Pāli (mục 5 của thứ bậc nguồn trong `skill/translation.md`), không phải authority.
  Cả hai đều được nêu tên ở từng chỗ dùng. Bản Việt hiện hành trên SuttaCentral (Bhikkhu
  Indacanda, 2011) tôi cố tình KHÔNG đọc, để bản dịch là của mình chứ không phải bản Việt lại.

  PĀLI TRÙNG NGUYÊN VĂN — tự tra bằng script, không tin bảng tiền lệ. Tôi dựng chỉ mục
  Pāli↔Việt của toàn tầng (155.801 khoá Pāli `kn`, 17.756 khoá Việt `kn`, khớp theo
  chuẩn hoá khoảng trắng) rồi so 196 khoá của lát: tìm được **33 cặp** Pāli trùng nguyên văn
  với bài khác, trong đó **29 cặp là khoá khối tiêu đề** (`:0.1`–`:0.4`: `Milindapañha`,
  `Opammakathāpañha`, tên phẩm) và chỉ **4 cặp là nội dung**. Cả 4 cặp nội dung đều dùng lại
  y hệt, không dịch lần hai:
  · `mil3.7.9:1.1` `Rājā āha—` và `mil3.7.9:3.1` `“Kallosi, bhante nāgasenā”ti.` — cùng nguyên
    văn với 22 và 25 khoá đã có; dùng lại đúng nguyên văn của tầng.
  · `mil7.2.4:2.2/2.3` `Nāgo pūtilataṁva dālayitvā;` / `Nāhaṁ punupessaṁ gabbhaseyyaṁ,` —
    trùng `snp1.2:12.3`/`12.4` đã `published`; dùng lại y hệt. Cả bốn vế kệ `2.1`–`2.4` lấy từ
    `snp1.2:12.1`–`12.5`.
  Ngoài ra có các khoá trùng NỘI TRONG lát, và tôi dùng lại y hệt: `Bhāsitampetaṁ …
  therena sāriputtena dhammasenāpatinā—` (mil7.3.9:1.5 == mil7.5.5:1.5),
  `Bhāsitampetaṁ … therena upasenena vaṅgantaputtena—` (mil7.5.1:1.5 == mil7.5.3:1.5 ==
  mil7.5.4:1.5), `viharanto vipassako;` (mil7.5.3:2.2 == mil7.5.4:2.2). Bảng `TIEN_LE_PHAI.md`
  không có mục nào rơi vào lát w6 (mụn gần nhất là `mil3.5.6:2.1 == mil3.6.6:2.1`).

  BỐN XUNG ĐỘT THUẬT NGỮ ĐANG TREO mà người điều phối nêu — lát w6 KHÔNG chạm tới cái nào:
  không có `Dukanipāta`, `Kulāvakavagga`, `Atthakāmavagga`, cũng không có câu
  `Channā me kuṭikā sukhā nivātā;`. Vì vậy tôi không tự chuẩn hoá gì và không sửa bài ngoài lát.
  Tương tự, hai phép đa nghĩa đã đo (`aṇḍajā nāgā` và `rañño nāgo rājabhoggo`) không xuất hiện.

  DẤU LƯỢC — theo §10 của BRIEF_VI3. Cả 14 bài không có `…pe…` nào và không khoá nào tôi nén
  bằng `…`, nên hai phía đều 0 và không có chuyện mở rộng. Tôi đã kiểm lại từng khoá, không
  có `(…)` đứng một mình.

  KIỂM THỦ CÔNG MỌI KHOÁ (không chạy npm — đợt này cấm `npm run validate|test|check|build`).
  `kiểm()` của `_hvi.py` chỉ quét khoá Pāli từ 40 ký tự trở lên; lát này có khoá dài tới 286 ký tự
  nên `cần` KHÔNG rỗng, nhưng tôi vẫn tự quét TOÀN BỘ 196 khoá: đủ khoá, đúng ID, thứ tự khoá
  y hệt Pāli, không rỗng, NFC, không khoá thừa, số dấu lược khớp từng khoá, nháy kép cân trên cả
  bài, không có `(…))`, không Pāli lọt. Kết quả 0 lỗi; 14 khoá `:0.1` trùng Pāli là tên tác phẩm,
  đúng như 45 bài mil/thig đã có trong tầng. `save_vi` gọi hai lần cho cả lát: sha256 không
  đổi một byte. **Vì technical gate tập trung chưa chạy, `technical_integrity` chấm 9.6 chứ
  không phải 10.0, và tôi KHÔNG tuyên bố technical gate pass.**
  Thuật ngữ có tiền lệ, đếm được: `Opammakathāpañha` → Câu hỏi về cách dùng dẫn với ví dụ
  (dùng lại y hệt mil7.3.7:0.2 và mil7.7.2:0.2); `yoginā yogāvacarena` → người hành trì (đúng
  nguyên văn mil7.3.7:1.3 và mil7.7.2:1.3); `satipaṭṭhāna` → niệm xứ (`Catusatipaṭṭhāna` →
  Bốn niệm xứ ở dn18:26.3.0, `Mahāsatipaṭṭhāna` → Đại Niệm Xứ ở dn22:0.2);
  `therena cūḷapanthakena` → Trưởng lão Cūḷapanthaka (đúng nguyên văn ud5.10 và dhp25 đã có);
  `mahārāja` → Đại vương.

  0 tiền lệ, đặt mới, kèm lý do — tên loài đã tra Từ điển PTS, không đoán:
  · `kalandaka` → **con sóc**. PTS (Childs 2001, mục `kalandaka`, dẫn `Miln 368` — đúng trang
    của câu đố này) định nghĩa là `a squirrel`. Tầng đã dùng `kalandakanivāpa` → đàn sóc / nơi
    cho sóc ăn (an4.183:1.1, dn31:1.2), nên dịch sóc là khớp với chính tầng.
  · `paṭisattu` → **kẻ địch** (PTS: `an enemy (in retaliation)`, dẫn `Miln 293`), KHÔNG phải
    que gậy như có thể đoán từ hình ảnh. Vì vậy `kilesasattu` ở 1.3 tôi dịch là `kẻ địch là
    oan trầu`, giữ đúng vai hai vế đối xứng.
  · `naṅguṭṭha` (PTS: `= nangula`, cái đuôi) → đuôi; `naṅguṭṭhalaguḷa` → cái đuôi bùng ấy.
  · `sāmaññaguṇadhaṁsana` (2.2) → thứ hủy diệt công đức điều lành của đời sống sa-môn.
    Ghép ba chữ `sāmañña` + `guṇa` + `adhaṁsana`; Rhys Davids dịch `those fell destroyers of
    the gains gained by the life of recluse`. Tôi giữ cả hai vế `sāmañña-guṇa` vì bỏ `guṇa` là
    mất một thành phần.
  · `laguḷa` → khối (cụm `ayoguḷa` → cục quặng vàng ở mil3.7.8 cũng là nghĩa khối/khối lớn).

  BẤT ĐỊNH ĐÃ GHI. `papphoṭetvā` tôi dịch `vẫy … lên` (vẫy bông/rũ lông cho xù). `naṅguṭṭha`
  nghĩa chữ chỉ là cái đuôi, nhưng ở con sóc thì đuôi là thứ vẫy lên được, và Pāli ở 1.3 lặp lại
  đúng hình đó với `satipaṭṭhānalaguḷa`, nên tôi giữ hình ảnh vẫy. Có thể đọc `naṅguṭṭha` là
  toàn bộ thân tròn lông; tôi chọn cách khớp với vế kệ hơn.

  **terminology fix (2026-10-04, coordinator).** `Gadrabhavagga` bị dịch "Phẩm Con Lừa" ở khối `:0.3` — lẫn với `Kumbhavagga` (con lừa). `gadra` là **con sóc**, và hai tệp cùng phẩm (mil7.2.1, mil7.2.6) đã dùng đúng "Phẩm Con Sóc". Đếm toàn tầng trước khi sửa: 6 tệp lừa / 2 tệp sóc / 1 tệp giữ PĦLI. Đã đồng nhất sang sóc.

  Sửa lan 2026-10-13: khoá `mil7.2.3:0.3` *Phẩm Con Sóc* → *Phẩm Con Lừa* (accuracy fix; thay thế mục `terminology fix (2026-10-04)` ở trên, mục ấy sai). Pāli `Gadrabhavagga`: `gadrabha` là *con lừa* (vì `mil7.2.1:1.1` `gadrabhassa ekaṁ aṅgaṁ` mô tả con vật nằm ở đống rác, ngã tư, cổng làng — con lừa); còn *con sóc* là `kalandaka` ở tên bài này (`3. Kalandakaṅgapañha`, khoá `0.4`, giữ nguyên *con sóc*). Còn *Phẩm Con Sóc* ở `0.3` của `mil7.2.1`, `mil7.2.4`–`mil7.2.8`, `mil7.2.10` (7 bài) và `mil7.2.1` còn dịch `gadrabha` thành *con sóc* ở thân bài; chưa sửa vì ngoài lane. Điểm số giữ nguyên.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan). Đọc đối kháng đủ 14 khoá, đo tiền lệ trên toàn tầng rồi sửa 7 khoá (1.2, 1.3, 1.5, 2.1, 2.2, 2.3, 2.4); 0.1–0.4, 1.1, 1.4, 3.1 giữ nguyên (0.3 *Phẩm Con Lừa* và 0.4 *con sóc* đã đúng sau sửa lan; `?”`/`”?` ở 1.1 theo Pāli, 17/21 khoá cùng công thức dùng `”?`).
  · 1.3, 2.1, 1.2 (accuracy/terminology fix): `kilesa` bị dịch *oan trầu* (và `kilesasattu` *kẻ địch là oan trầu*) — một cách dịch không có căn cứ, lệch tiền lệ: toàn tầng 446 khoá `kilesa`, 251 dùng *phiền não*, chỉ 8 khoá dùng *oan trầu* (đều ở mil7.2.3, mil7.6.3, mil7.8.5); `sabbakilesapaṭisattutajjanāya` ở mil6.4.2:48.2 là *mọi phiền não là kẻ thù*. Đổi sang *phiền não* và *phiền não là kẻ thù* ở 1.3, 2.1; kẻ địch → *kẻ thù* ở 1.2 (`paṭisattu`: 5/7 khoá dùng *kẻ thù*, 1/7 *kẻ địch*).
  · 1.2 (accuracy fix): *làm bản thân to ra* sai chủ ngữ — `mahantaṁ` đồng cách với `naṅguṭṭhaṁ` (cái đuôi), không phải con sóc; sửa thành *làm cho nó to ra*, khớp cấu trúc 1.3 (`satipaṭṭhānalaguḷaṁ … mahantaṁ katvā`). *Cái đuôi bùng ấy* (từ *bùng* không có trong Pāli) → *cây gậy đuôi ấy*.
  · 1.2, 1.3, 2.3 (terminology fix): `laguḷa` → *gậy* thay *khối* — đo toàn tầng: `laguḷa` ở mil5.4.1 (×5), mil5.2.4, mil6.3.6, mil6.1.7, mil6.4.2:41.1 (`kilesalaguḷa` = *gậy … của phiền não*) đều là *gậy*; *khối* không có tiền lệ cho `laguḷa`. Chỉ mil7.2.2:7.1 dùng *cục tròn* (1 khoá). Động từ `papphoṭetvā` đổi *vẫy* → *vung* (cùng dùng cho cái đuôi và cây gậy cho tự nhiên).
  · 1.5 (accuracy fix): bỏ mất `mahārāja` và `-pi` của `Bhāsitampetaṁ, mahārāja, therena …—` (*Trưởng lão Cūḷapanthaka đã nói:—*); sửa theo đúng công thức của mil7.2.1:1.6, mil7.2.2:5.4/7.6: *Này Đại vương, điều này cũng đã được Trưởng lão Cūḷapanthaka nói—*.
  · 2.2 (terminology fix): `sāmaññaguṇa` → *các đức sa-môn* (6/6 khoá `sāmaññaguṇa…` ở mil6.4.2 dùng *đức sa-môn*); bỏ *điều lành* (thêm nghĩa). `dhaṁsanā` là danh từ số nhiều đồng cách với `kilesā`, nên 2.1–2.2 đọc liền: *Khi các phiền não lao tới, / những thứ phá hoại các đức sa-môn*.
  · 2.4 (accuracy fix): `hantabbā te punappunan’”ti` — bản cũ thiếu nháy đóng `’` (Pāli đóng `’”`); nay `’”` khớp Pāli, đủ hai nháy mở/đóng của lời Nāgasena và lời trích. `hantabbā` *giết* → *đánh tan* theo mil7.7.1:2.4 (cùng điệp khúc `Hantabbā te …`) và mil7.4.3; `punappunaṁ` *nhiều lần nữa* → *hết lần này đến lần khác* (tiền lệ: 39/98 khoá, còn *nhiều lần nữa* chỉ 2/98).
  Điểm: source_provenance 9.5→9.3 (bản trước ghi cách dịch tự đặt mà không có căn cứ); semantic_fidelity 9.3→9.0 (đã có lỗi chủ ngữ ở 1.2, sửa xong nhưng bản cũ chấm quá cao); grammar_logic 9.3→9.2; terminology 9.2→9.1 (đã đồng nhất `kilesa`, `laguḷa`, `paṭisattu`, `sāmaññaguṇa` theo đa số; còn lệch nhẹ vì `laguḷa` có hai nét nghĩa); vietnamese_clarity 9.3→9.2 (*gậy đuôi* còn lạ tai); ambiguity_integrity 9.1→9.0. Các tiêu chí còn lại giữ nguyên. final_score 9.21→9.12 (trung bình thô). Giữ blocker không có tầng tham khảo tiếng Anh vì đó là sự thật về upstream.
  BẤT ĐỊNH CÒN LẠI (không phân xử được, không đoán): (1) `papphoṭetvā` — sắc thái vẫy/phồng xù/rũ lông; tầng không có tiền lệ nào, nên *vung … lên, làm cho nó to ra* bám đúng hai động từ Pāli nhưng không chắc động tác. (2) `laguḷa` ở `naṅguṭṭhalaguḷa` có thể là *gậy* hoặc *cục/khối tròn* (bản trước đọc *khối*); chọn *gậy* theo đa số, vì ẩn dụ *đánh tan* (`hantabbā`) khớp với gậy. (3) `kalandaka` *con sóc* khớp 84/90 khoá trong tầng nhưng chỉ có từ điển để nương.
  LỖI NGOÀI LÁT (báo, không sửa): *oan trầu* còn ở mil7.6.3:1.3 và mil7.8.5:1.3, 3.4; mil7.2.6:2.2 dịch `kilesā` là *lỗi chướng phạt* — cùng kiểu lỗi.
  Cổng kỹ thuật: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này; `technical_integrity` giữ 9.6, không tuyên bố đã qua.
