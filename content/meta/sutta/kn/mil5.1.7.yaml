  ⇒ **40** khoá. Chênh lệch đúng một khoá: `mil5.1.7:5.4`
  `“Meghassa, bhante, anuppabandhatāyā”ti.` dài **40** ký tự thô nhưng **39** sau khi
  gộp khoảng trắng (dấu cách cuối), nên rớt khỏi mẫu số coverage. Tôi vẫn dịch khoá
  đó. Mẫu số coverage đo được = 40, không phải 41.

  **Pāli trùng nguyên văn đã dùng lại nguyên văn bản Việt có sẵn** (đếm bằng script,
  đã loại hai tệp của lát này khỏi số đếm):
  `“Bhante nāgasena, bhāsitampetaṁ bhagavatā—` 26 hit → “Thưa Đại đức Nāgasena, điều
  này đã được Thế Tôn dạy:”; `“Na hi, bhante”ti.` 50 hit → “Không phải vậy, thưa Đại đức”ti.;
  `Katamāni tīṇi?` 56 hit → “Ba loại nào?”; `Yadi tathāgatena bhaṇitaṁ—` 9 hit → “nếu Như
  Lai đã dạy”; `Yaṁ pana, mahārāja, bhagavatā bhaṇitaṁ—` 2 hit → “Còn điều Đức Thế Tôn
  đã dạy:”.

  **`ime ca, subhadda, bhikkhū sammā vihareyyuṁ, asuñño loko arahantehi assā` — câu
  này trùng nguyên văn `dn16:5.27.4` và `dn16:5.27.15`, nên tôi dùng lại đúng cách dịch
  đã có: “các tỳ-kheo này sẽ sống đúng đắn, thế gian sẽ không trống rỗng các bậc A-la-hán”
  (11 chỗ trong bài này). Tôi đã bỏ bản nháp “sống chơn chất / không còn A-la-hán”, vì
  đếm được “sống chơn chất” = 0 và “không còn A-la-hán” = 0 trong tầng Việt, còn
  “sống đúng đắn” = 5 và cụm “không trống rỗng các bậc A-la-hán” = 2.

  **Văn xưng — chọn theo bài liền kề, không theo đa số toàn cục, và ghi lý do.**
  Trong `mil5.*` (39 tệp, đã loại tệp này) “Bạch ngài Nāgasena” 61 lần đứng trước
  “Thưa Đại đức Nāgasena” 14 lần; nhưng `mil5.1.7:1.1` trùng nguyên văn
  `mil5.1.10:1.1`, đã dịch sẵn là “Thưa Đại đức Nāgasena”, nên tôi giữ “thưa Đại đức
  Nāgasena” cho toàn bài để không tự mâu thuẫn với bài cùng phẩm, và tự nhất quán ở
  các khoá còn lại. Tương tự: `mahārāja` → “tâu đại vương” (90 lần so với “tâu Đại
  vương” 15 trong `mil5.*`), `bhagavatā` → “Thế Tôn”, `bhagavā` → “Đức Thế Tôn” (211 so
  với 132), `micchā` → “là sai” (31 so với “là sai lầm” 12), `tathāgatena` → “Như Lai”
  (3 trên 6 cách dịch của cụm `Yadi…tathāgatena bhaṇitaṁ` trong `mil5.*`).

  **Thuật ngữ có tiền lệ đếm được:** `saddhamma` → *Chánh pháp* (đếm `Chánh pháp` 135 +
  `chánh pháp` 59 trong tầng `kn`, và `mn65:30.1` `saddhammassa antaradhāyamāne` đã dịch
  *Chánh pháp đang biến mất* — trùng nghĩa đúng chỗ ở `8.2`); `liṅga` → *dấu hiệu* (229);
  `sikkhāpada` → *học giới* (155); `paveṇupaccheda` → *bị chặn đứt* (8, gồm
  `mil6.1.7:1.5` và `3.7` của chính tác phẩm này); `dhammābhisamaya` → *giác ngộ Chánh
  pháp* (18, gồm `mil6.1.7`); `suppaṭipanna` → *thực hành đúng đắn* (31);
  `jinasāsanavara` → *giáo pháp cao thượng của Đấng Chiến Thắng* (2, `mil5.3.12`);
  `taḷāka` → *ao hồ* (`mil1:7.2`, `mil7.4.1:4.1`); `udakūpa` → *giếng* (13 chỗ “giếng
  nước”, 6 chỗ “miệng giếng”); `ubhato koṭiko` → *có hai đầu* (7); `makara` → *con cá sấu*
  (`cp27:1.3`, `2.4`). Bản nháp đầu của tôi viết `makara` thành *con rùa*; đếm lại thì
  *con rùa* 40 lần nhưng toàn bộ là `kacchapa` ở các bài Jātaka, còn `makara` đã có
  sẵn *con cá sấu* — đã sửa. `sikkhā` → *học tập*, `cāritta-sīla` → *giới hạnh đã tu trì*,
  `jinasāsanavara-saddhammataḷāka` → *cái ao hồ của Chánh pháp trong giáo pháp cao
  thượng của Đấng Chiến Thắng*, `satthusāsana` → *giáo pháp của bậc Đã Quang*.

  **Đặt mới, 0 tiền lệ, có lý do từ chính Pāli:** `makara` → cá sấu (xem trên);
  `bhavagga` → *cõi cao nhất của hữu* (theo `sn22.77:2.4` đã dịch *tầng cao nhất của
  hữu*, đếm cụm của tôi = 0 vì khác một chữ); `padhāniyaṅga` → *bước đạp vào* (giữ nghĩa
  chân chất, không liệt kê năm thứ vì bài không liệt kê); `ekarasaṁ` → *không còn chút
  nào*; `anuppabandha` → *không ngắt quãng* (1 hit `tha-ap136:5.4`, khác ngữ cảnh);
  `apariyādiṇṇa` → *không thể bị suy hao*; `nānattha` / `nānābyañjana` → *không đủ ý
  nghĩa* / *có nhiều nghĩa*; `moha` (trong `mā te pucchā moghā assa`) → *vô ích*.

  **Bất định đã phân xử, ghi lại để biên tập xem lại.**
  (1) `Saddhammantaradhānapañha` — có thể đọc là `saddhammanta` + `antaradhāna`
  (*tín ngưỡng chánh pháp* + *biến mất*). Tôi chọn *sự biến mất của Chánh pháp*, vì chính
  vua hỏi lại tên mục ở `8.1` (`‘saddhammantaradhānan’ti yaṁ vadesi`) như một danh từ
  đơn lẻ, và `3.3` ghép thẳng `saddhammassa antaradhānaṁ`; thêm nữa `8.2` dùng cặp
  song song `sāsanantaradhānāni`. Nếu biên tập chọn cách đọc kia thì phải sửa cả `0.4`,
  `1.2`, `1.6`, `1.8`, `2.1`, `3.1`, `3.2`, `3.7`, `3.9`, `8.1`, `10.1`.
  (2) `naṭṭhā paravādā bhaggā nippabhā katā` ở `9.1` là bốn mệnh đề nữ, tôi dịch đủ
  bốn là *đã bị bỏ, phản bác, phá vỡ, làm mờ nhạt* thay vì gộp thành ba.
  (3) `sallekha` ở `7.3` là công năng *trau chuốt*, KHÔNG phải *đoạn giảm* của Luật
  Tứ Phần (đếm: `sallekhā` trong tầng Việt đi với *đoạn giảm*, 8 hit ở `mn8`; nhưng
  `sallakkheyyuṁ` ở đây là động từ lau bóng, nên tôi dùng *đánh bóng* / *trau chuốt*).

  **Ba ẩn dụ (ao hồ · lửa · gương) giữ cùng một khung**, dịch khác nhau ở hình ảnh
