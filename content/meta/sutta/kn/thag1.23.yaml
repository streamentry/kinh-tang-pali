notes: |-
  Sáu vế kệ, mở nháy kép ở 1.1 và đóng ở 1.6, dòng kết 1.7 giữ HAI dấu lược như Pāli
    (BRIEF_VI3 §10.1, không mở rộng). Khung bốn khối tiêu đề giữ y hệt 24 bài thag1 đã có:
    0.1 giữ Pāli kèm số, 0.2 Bộ Một Bài Kinh, 0.3 tên phẩm, 0.4 Kinh Kệ Của Trưởng Lão.
    Sujato có 10/11 khoá (trống đúng dòng kết lược 1.7) nhưng MỌI khoá Pāli đều ngắn hơn 40 ký
    tự nên substantiveSegments = 0 và ratio = 1; đó là lý do bài này có thể published dù bản
    Anh chỉ phủ 10 khoá. Không có bản Việt hiện hành cho Trưởng Lão ở commit đã ghim.
    Tên riêng giữ nguyên dạng Pāli, không bịa tên Việt.
    Kiểm kỹ thuật: save_vi sạch, chạy hai lần idempotent (sha256 không đổi). Vì mọi khoá Pāli của Theragāḵā ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá: đủ 11/11 khoá; đúng ID; thứ tự khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2 ở dòng kết); nháy kép cân trên cả bài; không còn `(…)`; không có ký tự ngoài Latin. Không chạy npm run validate|test|check|build (đợt này cấm) nên technical_integrity = 9.6, không phải 10.  Không đối chiếu được tầng Việt hiện hành: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Đây là giới hạn của bản chụp upstream, đã ghi ở content/meta/reference-gaps.yaml.
    Thuật ngữ, đếm được. Veḻugumba giữ Pāli, là tên núi/rừng từ nguồn. madhupāyasa → mật ong và cơm
    sữa (mật ong có 5 chỗ). padakkhiṇaṁ sammasanto → khéo khéo khảo sát (khảo sát 32 chỗ).
    khandhānaṁ udayabbayaṁ → sự sinh diệt của các uẩn (uẩn 484 chỗ). Đây là Pāli trùng nguyên văn
    với dhp374:2, nơi tầng đã dịch là sự sinh diệt của các uẩn; bản nháp tôi viết cả khi sinh cả khi
    diệt của các uẩn (theo ghi chú của thag1.15 cho udayabbayañcā ở an4.12:7.4, dạng khác), đã đổi
    sang sự sinh diệt của các uẩn. Chỉ khác dấu chấm cuối vế vì Pāli hai nơi kết bằng dấu khác nhau.
    sānuṁ → lại/trở lại (thag1.17:1.4 đã dùng lại cho Punappunaṁ).
    gumba → bụi cây (0 tiền lệ, đặt mới: gumba là bụi, đám cây).
    PĀLI TRÙNG NGHIÊN VĂN, ĐÃ DÙNG LẠI. `vivekamanubrūhayan` ở 1.6 trùng nguyên văn ja61:1.6, nơi
    tầng đã dịch là và nuôi dưỡng sự thanh vắng. Bản nháp đầu tôi viết sự vắng vẻ; đã đổi sang thanh
    vắng để không tự dịch lần hai một vế đã có bản Việt đang dùng. Vì vậy ở bài này viveka dịch
    là thanh vắng, khác với những chỗ khác trong tầng dùng vắng vẻ cho cùng chữ.
    `kho` ở 1.1 là tiểu từ nhấn, tôi không dịch rõ nhưng cũng không làm lệch nghĩa.
