notes: |-
  Apaṇṇakavagga → Phẩm Bụi Dơ theo ja1 đã published (tiền lệ duy nhất, giữ nhất quán vagga).
    Bộ Một Bài Kinh 14 occ; Jātaka giữ nguyên. Thuật ngữ có tiền lệ: sa mạc 2 occ
    (vaṇṇupatha); không mệt mỏi 22 (akilāsu); mạch nước 4 (udaṅgaṇa theo Sujato
    underground stream); hiền trí 55 (muni); an tịnh 402.
    Điểm Sujato khác Pāli đã xử bằng Pāli: avinduṁ là quá khứ số nhiều nên 1.2 dịch họ
    tìm thấy nước, không theo chữ he found của Sujato.
  Đối chiếu Pāli đã ghim với Anh Sujato ở 8/9 khoá; khoá kết 2.1 Sujato để trống
    (công thức tên kinh + số thứ tự), dịch từ Pāli theo tiền lệ ja1 đã published
    (Kinh Bụi Dơ thứ nhất). Không có tầng Việt hiện hành cho Jātaka trong snapshot
    đã ghim (tiếng Việt upstream chỉ có Pháp Cú) — giới hạn của bản chụp, không phải
    thiếu sót của repo. Không có dấu lược …pe… trong Pāli lát này nên hai phía đều 0.
