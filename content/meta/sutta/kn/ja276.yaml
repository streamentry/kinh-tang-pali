  GIẢI QUYẾT DRAFT 2026-10-12 (đọc đối kháng lại toàn bài từ Pāli, đối chiếu chú giải Jātaka từng
  vế và Cariyāpiṭaka 3 bản Việt đã ghim; mục này THAY THẾ các mục cũ ở trên về tên bài, nghĩa
  vế 1, xưng hô và phẩm).

  LỖI NGHĨA THẬT ĐÃ SỬA: 12/17 khoá (0.3, 0.4, 1.3, 1.4, 2.1, 2.2, 2.4, 3.1, 3.2, 3.4, 4.1, cùng 1.1 chỉnh lời cho khớp người nói). (1) Tên bài
  `Garudhamma`: bản cũ "Kinh Pháp Của Gara" là bịa ra một tên người/nước Gara không có trong
  Pāli (`garu` là tính từ, không phải tên riêng). Đo tiền lệ: `garudhamma` đã có 10/10 khoá ở
  an8.51 dịch "pháp tôn trọng"; nay dịch "Kinh Pháp Tôn Trọng" ở 0.4 và 4.1, tag đổi theo.
  Truyện này (Cariyāpiṭaka 3 "hạnh của Kurudhamma"; vua Kuru Dhanañjaya cho các Bà-la-môn
  Kaliṅga con voi Añjana) ở nhiều bản khác mang tên Kurudhamma; bản Pāli ghim đọc `Garu-`,
  tôi dịch đúng chữ của bản ghim và ghi chênh lệch ở đây. (2) Vế 1 là lời CÁC BÀ-LA-MÔN nói với
  vua (`tava` = của ngài, `janādhipa` = hô cách); `nimimhase` là ngôi thứ nhất số nhiều
  (-mhase), không phải "ngươi cứ đem đổi" như bản cũ. Bản cũ xưng "ngươi" với vua và đặt sai
  người nói/ngôi; nay "ngài … chúng tôi đã đem đổi". `vaṇṇaṁ` ở 1.3: theo chú giải là vàng
  (của cải, mùa màng), giữ "vàng"; `añjanavaṇṇena` = màu xanh đen như thuốc kẻ mắt (dn14,
  dn30, mn91: 3/3 khoá `añjanavaṇṇa` dịch "xanh đen như thuốc kẻ mắt"), bỏ "son chàm" của bản
  cũ (son là đỏ, chàm là xanh lam — không phải màu añjana). `janādhipa` → "bậc quốc chủ"
  (sn3.16). (3) 3.1: vế này do VUA nói, bản cũ viết "Tôi tặng" lệch với "ta" ở 2.2; nay "Ta
  tặng các ngươi". (4) 3.2: `rājāraha rājabhogga` = "xứng đáng với vua, dùng cho vua" (an6.6,
  an6.7, mn125: tiền lệ đồng nhất), bỏ "xứng bậc vương giả, là đồ của vua"; `yasassinaṁ` =
  "lừng danh", bỏ "danh tiếng lẫy" (cụt). (5) 3.4: `sasārathiṁ` = "cùng người điều khiển"
  (con voi có người quản tượng đi cùng); bản cũ "đã có người kéo xe" sai (voi không kéo xe;
  `sārathi` là người điều khiển), và thiếu số nhiều ở `gacchatha` → "hãy đi nơi nào các ngươi
  muốn". (6) 2.2 `yodha uddissa gacchati`: bản cũ "ai vì ta mà đến" bỏ `idha` và thêm "ta" không
  có trong Pāli; nay "ai ở đây nhắm tới một người mà đến" (chú giải: người nào hướng đến ai đó
  với mong cầu). 2.1 "ăn nhờ" đổi "được nuôi ăn" cho rõ nghĩa chú giải (`annabhaccā` = người được
  nuôi bằng cơm ăn). 2.4 `pubbācariyavaco`: "bậc tiền nhân" đổi "các bậc thầy thuở trước" —
  đúng chữ `ācariya` (thầy), chú giải đọc là cha mẹ (an4.63, an3.31, iti106: `pubbācariya` =
  "bậc thầy đầu tiên/cổ"). (7) 0.3 `Udapānavagga`: `udapāna` là GIẾNG (sn1.47, an8.10, ja271:0.4 và
  ja280:0.3 đều dịch "giếng"), "Phẩm Nước Uống" là sai nghĩa; nay "Phẩm Giếng Nước", khớp ja280
  (2 khoá giếng, 9 bài ja271–ja279 còn ghi "Nước Uống" — ngoài phạm vi bài này, đã báo).

