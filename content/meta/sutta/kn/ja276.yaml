  BẤT ĐỊNH CÒN LẠI. (a) Vế 1.3–1.4: đọc theo chú giải (`vaṇṇa` = vàng, `nimimhase` = "chúng tôi
  đã nhận bằng cách đổi"); bản dịch giữ "con voi" là từ chú giải gán cho `añjanavaṇṇena`, Pāli
  không nêu danh từ. Không có tầng Anh để đối chiếu độc lập nên triangulation 7,6 (không cao hơn
  8,0). (b) Số của `vo` (3.1) và xưng hô "ta … các ngươi" giữ theo Pāli, không tự thống nhất
  với `janādhipa` số ít. (c) Tên bài Garudhamma/Kurudhamma như trên.

