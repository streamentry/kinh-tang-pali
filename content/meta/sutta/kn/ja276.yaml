  NGHIÊN CỨU TAM GIÁC. Không có tầng Anh nào để đối chiếu (xem trên), nên tôi đọc chú giải
  Jātaka từng vế để phân xử những chỗ Pāli khó, rồi vẫn tự viết lại bản Việt. Chú giải được
  dùng như TỪ ĐIỂN và để cân nhắc bối cảnh, không sao chép câu Anh nào vào thân kinh.

  BẤT ĐỊNH CHƯA PHÂN XỬ TRỌN VẸN, ĐÃ GHI LẠI. (1) Tên bài `Garudhammajātaka`: từ `garu` trong
  từ điển là nghĩa đáng kính, trọng, và là thầy, còn chính câu chuyện — theo chú giải — là chuyện
  dân nước Kuru giữ giới nên mưa thuận và dân sung sướng, và một nước láng giềng sai sứ đi hỏi bí
  quyết. Tôi dịch tên là Kinh Pháp Của Gara, giữ đúng chữ `garu` của bản in và không đổi thành
  Kuru; nhưng chữ Gara ấy không xuất hiện ở đâu khác trong 17 khoá nên tên nước đó là suy luận
  của tôi, và truyển bản khác cùng truyện lại đặt là Kurudhammajātaka. Người biên tập có thể
  muốn xem lại cả hai. (2) `nimimhase` (`1.4`): đọc được là động từ thứ hai số ít, nghĩa là đem
  đổi, nên tôi dịch ngươi cứ đem đổi; chú giải lại giải thích vế này theo nghĩa trao đổi
  vàng lấy voi, và còn ghi chú rằng dạng -amhāse là ngôi một số nhiều — hai cách đọc đều cho
  cùng một hành động của người nghe nên không đổi nghĩa cảnh. (3) Cùng một bài đổi thế từ xưng
   hông: `janādhipa` (1.2) là tế từ số ít còn `brāhmaṇā` (3.1) là tế từ số nhiều, trong cùng một
  bài nói; tôi giữ cả hai số như Pāli và theo `brāhmaṇā` cho `vo` (2 số nhiều), không tự
  thống nhất. (4) `pubbācariyavaco` (2.4): từ điển nghĩa là bậc tiền nhân, thầy tổ, nhưng chú
  giải đọc hẹp là mẹ cha; tôi dùng nghĩa rộng bậc tiền nhân vì nó phủ cả hai.

  THUẬT NGỮ ĐẶT MỚI (0 tiền lệ, đã tra). `nāga` ở `3.1` là CON VOI, không phải rồng — đây là
  loại đa nghĩa đã có tiền lệ gây lỗi ở lát khác, và chú giải xác nhận đây là voi; cùng bài đó
  tầng Việt đã có sẵn nghĩa voi ở dn17 và mn88. `añjanavaṇṇa` → MÀU SON CHÀM (chú giải: màu
  của son chàm; dn14 đã dịch `añjanavaṇṇa` là màu xanh thẫm). `hemajāla` → LƯỚI VÀNG (7 bài
  đã có: dn17 ghi phủ lưới vàng). `rājāraha` → xứng bậc vương giả. `saddhā`/`sīla` → đức tin /
  giới luật. `abhaccā`/`anabhaccā` → ăn nhờ / không ăn nhờ (chú giải: kẻ được người ta nuôi ăn
  và kẻ không được nuôi ăn, chia làm hai loại người). Tên phẩm `Udapānavagga` → Phẩm Nước Uống
  theo 1 bài đã có (ja279).

  TÊN RIÊNG CÓ DẤU PĀLI, CỐ Ý GIỮ. `Kaliṅga` ở `1.4`: bản in chỉ có dạng biến cách
  `kāliṅgasmiṁ`, mà chốt Pāli-lọt chỉ nhận đúng token, nên tôi viết đúng dạng danh từ Kaliṅga;
  đã có tiền lệ cùng dạng trong dn16, dn19, mn56, sn20.12.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Quét toàn tầng Pāli gốc 5.764 file (bỏ thư mục
