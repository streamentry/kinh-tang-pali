  Jātaka, Tikanipāta và tên phẩm, vốn phải giống nhau theo quy định bộ). 48 cặp trỏ tới bài đã
  có bản Việt và 13 cặp trỏ tới bài chưa có, nên tôi đặt mới cho 13 cặp đó. Riêng bài này:
  0 cặp trùng ở thân kệ.

  REVIEW ĐỐI KHÁNG RIÊNG, CHẠY TRƯỚC KHI CHẤM. Tôi in lại từng cặp Pāli và Việt ra đọc lại,
  và đây là những lỗi tôi tự bắt được và đã sửa trước khi ghi lần cuối:
  (1) Vị trí ngoặc kép: lần viết đầu tiên tôi đặt ngoặc kép theo cảm giác của câu kệ, và quét
  từng khoá đã bắt được năm chỗ lệch với Pāli — đóng ngoặc sớm ở 2.4 của ja277, mở ngoặc thừa
  ở 2.1 của ja281, đóng ngoặc thừa ở 3.1 của ja282 và 3.4 của ja286, và mở ngoặc thừa ở 1.4
  và 3.1 của ja292. Pāli phân đoạn lời thoại khác nhau ở mỗi bài, nên phải so **từng khoá**
  chứ không được so tổng số. (2) ja278 vế 2.4: bản nháp dịch mà không ai ngăn được họ; quét
  Pāli trùng mới thấy câu này đã có sẵn trong kho ở sn11.4 và sn11.5, nên đã sửa thành nguyên
  văn đã có. (3) ja282 vế 3.4: bản nháp dịch bước vào việc tự chế; cùng quét đó cho thấy đã
  có sẵn bước đến nơi tự chế, nên đã sửa. (4) ja283 vế 2.1 và 2.2: bản nháp dịch cả hai là
  sợ hãi, lặp từ và mất sắc thái phân biệt của chú giải; đã sửa 2.1 thành hoảng sợ và bỏ sợ
  hãi ở 2.2. (5) ja277 vế 3.4: bản nháp xưng ngài trong khi cả bài xưng ngươi, đã sửa cho nhất
  quán. (6) ja292 vế 3.4: bản nháp dùng trừng trừng kẻ đã làm rách mũi, đọc thành mệnh lệnh;
  đã sửa thành nơn xin ngài trừng phạt kẻ đã làm rách mũi ngài cho đúng vai sứ giả. (7) ja276 vế
  1.3: bản nháp lặp đem đổi ở cả 1.3 và 1.4, đã sửa 1.3 thành Vàng quy ra con voi màu son
  chàm. (8) ja284 vế 1.4: bản nháp ngươi hãy nhận ra, đều hưởng được của cải ấy có hai mệnh đề
  lệch; đã sửa thành ai nhận ra thì đều hưởng được của cải ấy. (9) ja281 vế 1.4: bản nháp thừa
  một chữ một; đã bỏ. (10) ja293 vế 3.3: bản nháp đặt ở nơi ấy trước buông lung làm câu khó
  đọc; đã dời.

