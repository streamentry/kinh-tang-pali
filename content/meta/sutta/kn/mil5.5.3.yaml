  ở `:5.2` phải giữ cả ba số từ, không lược); `ekāsanikā` → "chỉ ăn một bữa" (mn113:16-20.7
  "Tôi là người ăn một bữa"; an5.188 "chỉ ăn trong một chỗ ngồi"); `vesārajja` → "không sợ
