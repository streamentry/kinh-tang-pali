  LỖI BẢN NHÁP BẮT ĐƯỢC KHI REVIEW ĐỐI KHÁNG — 9 CHỖ, ĐÃ SỬA HẾT:
  (1) `:6.1` nháp đầu tiên viết "Còn āyasmā Bà-la-môn **sau khi đã thành tựu** bậc tối
  thượng … thì đã làm nên điều ấy", làm **MẤT** `taṁ abhinīhāravasena` — vế này là lý do,
  không phải hệ quả. Đã viết lại thành "Còn điều mà āyasmā Bà-la-môn là bậc tối thượng về
  sức không bệnh tật, thì vị ấy đã làm được bằng con đường chinh phục trực tiếp". Đây là
  lỗi nặng nhất của lát.
  (2) `:6.1` `udaravātābādhe` nháp đầu dịch "bệnh nặng ở vùng bụng **trên thân Ngài**" —
  Pāli không có `sarīre` ở vế này, tôi đã thêm vào. Đã sửa thành "căn bệnh nặng nơi bụng
  trong".
  (3) `:4.2` `dasahi balehi` nháp đầu dịch "mười loại sức mạnh"; kho có tiền lệ rõ là
  mil5.5.6:3.5 "Đấng Thập Lực Kassapa" và mil5.4.9:1.4 "đủ mười oai lực" ⇒ đã sửa thành
  "mười oai lực".
  (4) `:4.2` `aṭṭhārasahi buddhadhammehi` nháp đầu dịch "mười tám **pháp thú** của bậc
  Phật" — `pháp thú` (thú = con vật) không có nghĩa ở đây, và nháp đó còn **đụng** với
  `:7.1` mà tôi cũng dịch là "pháp thú" cho `dhutaṅga`. Đã sửa `:4.2` thành "mười tám pháp
  của bậc Phật" và `:7.1` thành "sáu môn thuần phục" (`dhutaṅga`).
  (5) `:7.1` `dhutaṅgaṁ ādiyantepi anādiyantepi` — nháp đầu dịch gộp thành một vế "dù đang
  thực hành pháp thú hay không", làm mất đối xứng phủ định của `ādiya/anādiya`; đã tách
  đủ cả hai vế.
  (6) `:2.5` `bāhirānaṁ āgamānaṁ adhigamānaṁ pariyattīnaṁ attani vijjamānataṁ` có **bốn**
  phân từ; nháp đầu chỉ dịch ba ⇒ đã thêm "chưa từng biết rõ".
  (7) `:3.1` `divārattiṁ vītināmeti` = "dành cả ngày", nháp đầu dịch "dành trọn ngày cho
  việc ấy" rồi lặp lại "việc ấy" ⇒ đã viết lại.
  (8) `:1.5` `bahukkhattuṁ` = "rất nhiều", nháp đầu chỉ "nhiều" ⇒ đã thêm "rất".
  (9) `:1.2` `payatapāṇi` nháp đầu dịch "cầm theo **bản thảo dược**" — vô căn cứ và sai
  nghĩa (Pāli nói mang theo dược dụ, mang loại thuốc đứng đầu) ⇒ đã sửa thành "lúc nào
  cũng mang theo dược dụ, cầm tay loại thuốc đứng đầu".
  Ngoài ra `:1.7` và `:1.9` nháp đầu viết "là lời nói sai" (thừa); đã rút về "là sai" theo
  đúng mil5.5.2:3.4.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  (1) **SỐ ĐẦU Ở `:6.1`** — `aṭṭhasaṭṭhiyā ca bhikkhusatasahassānaṁ`. Chữ nghĩa đen:
  84 × 100.000 = 8.400.000; còn cách đọc nhận thức truyền thống của truyền thống Pāli cho
  đoạn này là "84.000". Tôi chọn "tám mươi bốn nghìn" theo cách đọc nhận thức, **vì** bản
  dịch phải truyền nghĩa đã được hiểu, nhưng tôi KHÔNG coi đây là chỗ chắc chắn và KHÔNG
  bịa thêm chi tiết. Người biên tập cần ra một quy tắc thống nhất: chính tệp dn14 của dự
  án đã dịch **cùng** từ hợp `aṭṭhasaṭṭhi…bhikkhusatasahassaṁ` thành "6.800.000" ở **9**
  khoá và "8.400.000" ở **2** khoá — tức là chính kho đang không thống nhất, nên tôi hạ
  `ambiguity_integrity` xuống 8.5 thay vì giả vờ chắc.
  (2) `:6.1` `tiṇapupphakaroga` — 0 tiền lệ trong toàn tầng Việt. `tiṇa` = lúa non,
  `puppha` = hoa, `-roga` = bệnh; tôi dịch "bệnh lúa non" và không nêu tên bệnh cụ thể.
  Bản Pāli đã ghim KHÔNG có đoạn song song nào trong toàn bộ root (đã quét
  `root/pli/ms/sutta/**` cho `pupphakarog`, chỉ khớp chính mil5.5.3:6.1) nên tôi không
  dám nêu tên bệnh hay dẫn thêm bản song song.
  (3) `:6.1` `abhinīhāravasena` — 0 tiền lệ trong tầng Việt. `abhinīhāra` là "chinh phục
  trực tiếp / thắng trí toàn diện"; tôi dịch "bằng con đường chinh phục trực tiếp" và không
  thêm thuật ngữ "thắng trí toàn diện" vào vì Pāli khoá này không có.
  (4) `:6.1` `anomadassissa` — 0 tiền lệ cả khái niệm; `anoma` = dễ chịu, êm. Tôi dịch
  "khuyên dạy một cách dễ chịu", không thêm "khuyên can" hai lần.
  (5) `:4.2` `buddhadhammehi` — 0 tiền lệ trong toàn tầng Việt cho cụm này. Tôi dịch "mười
  tám pháp của bậc Phật", giữ số 18 và không liệt kê danh sách vì Pāli không liệt kê.
  (6) `:7.1` `dhutaṅga` — 0 tiền lệ trong tầng Việt. Tôi dịch "sáu môn thuần phục" theo
  cách gọi quen thuộc của Luật Tăng; Pāli khoá này không nói "sáu", nhưng `dhutaṅga` là
  thuật ngữ cố định sáu môn, nên số 6 là thuộc ngữ ngữ nghĩa chứ không phải do tôi thêm.
  (7) `:3.1` `ṭhānacaṅkamikā` — 0 tiền lệ trực tiếp trong tầng `mil`; `caṅkamana` có
  tiền lệ mil7.2.10:3.1 "đi kinh hành". Tôi dịch "thích đi dạo".
  (8) `:1.2` `sallakatto` — chỉ có 2 tiền lệ (mil5.3.3:8.1 "thầy thuốc đã chọn thuốc",
  mil5.5.10:6.1 "người thầy thuốc giải phậu"), hai cách khác nhau. Tôi chọn "bậc chọn lựa
  thuốc men" và dùng **y hệt** ở cả 5 khoá có cụm này (`:1.2 :1.9 :2.3 :4.4`) để bài không
  tự mâu thuẫn.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `bākula` → "Bà-la-môn" (mil5.5.8:1.1, 2 khoá cùng cụm);
  `appābādha` → "không bệnh tật" (ghép cụm ở `:1.4 :1.8 :6.1`); `anuttaro` → "vô thượng"
