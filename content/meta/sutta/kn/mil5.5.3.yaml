  NHÁY KÉP — BÀI NÀY CÓ CÁI BẪY THẬT, ĐÃ XỬ LÝ ĐÚNG CÁCH CHIA KHOÁ SUTTACENTRAL.
  `“` mở ở `:1.1` và **không** đóng ngay: nó đóng ở `:1.10`, vì Nāgasena đang trích lại
  chính lời mình đã dặn ở `:1.1`. Bên trong có bốn cặp `‘…’` mở ở `:1.2` (đóng ngay),
  `:1.4` (đóng ngay), và hai cặp **mở ở `:1.6` đóng ở `:1.7`, mở ở `:1.8` đóng ở `:1.9`** —
  đúng như Pāli. Bộ chốt `ngoặc()` quét **mọi** khoá và báo cân. Tôi tự đếm lại nháy đơn
  `‘’` theo thứ tự số vì `ngoặc()` của bộ chốt chỉ tính nháy kép — cân (0 = 0). Pāli:
  `“`=3 `”`=3, `‘`=6 `’`=6; bản Việt cân đúng.

  `technical_integrity` đặt 9.6 vì lát này bị cấm chạy bốn cổng kỹ thuật; **tôi không
  tuyên bố** `npm run validate`, `npm test`, `npm run check`, `npm run build` đã xanh —
  bốn lệnh đó còn lại cho người điều phối. 10.0 chỉ dành cho khi cả bốn cổng thật sự xanh
  và có người rà lại.