notes: |-
  Lát v7/7: 12 bài Jātaka Ekakanipāta (Dūkaṇipāta), 156 khoá, dịch đủ MỌI khoá
  trong `all` của v7/v7.json. Đã đọc HẾT v7/p7.txt trước khi viết.

  **Sàn coverage 80% KHÔNG kích hoạt — nhưng ô Anh trống KHÔNG phải sự đồng
  thuận.** Đo được: mọi vế kệ của Ekakanipāta đều NGẮN HƠN 40 ký tự (156 khoá,
  `substantiveSegments = 0`), nên `englishCoverageFor` cho `ratio = 1` và bài
  không cần entry trong `content/meta/reference-gaps.yaml`. Hệ quả thật: hàm
  `kiểm()` của `_hvi.py` lọc `cần = [k for k in p if len(p[k]) >= 40 …]` nên
  `cần` RỖNG ở cả 12 bài, và **NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu
  lược không tự chạy**. Tôi đã tự kiểm thủ công đủ 156 khoá bằng một lớp kiểm
  riêng áp đúng các quy tắc đó lên MỌI khoá (0 lỗi), và đọc đối kháng từng cặp
  Pāli ↔ Việt. Tầng Việt tham khảo (Hòa thượng Thích Minh Châu) ở commit đã
  ghim chỉ có Pháp Cú, nên không có bản Việt nào để đối chiếu cho 12 bài này —
  đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho.

  **Dấu lược:** không khoá nào trong 12 bài có `…pe…` hay `…`, nên cả hai phía
  đều 0. Không mở rộng, không thêm, không bớt.

  **Ngoại lệ đã đo, không phải lỗi:** khoá `:0.1` = `Jātaka` trùng nguyên văn
  Pāli ở **128/128** tệp `kn/ja*` có cả hai khoá (đếm bằng script, không suy đoán).
  Tôi giữ nguyên theo đúng tiền lệ ấy và nêu ở đây.

  **Thiếu tầng Anh:** xem `blocking_errors`. Chỗ nào Sujato im lặng thì tôi dịch
  từ Pāli; ô Anh trống ở đây KHÔNG được đọc là đồng thuận về cách dịch.
  **Bất định về `Pavāsā` ở `1.1`:** đây là chữ lạ. Trong tầng Pāli đã ghim
  `pavā` xuất hiện 135 lần nhưng với nghĩa "đuổi đi" (`pavāheyya`); ở đây
  `Pavāsā āgato tāta` ("ngươi từ ... mà về đây, người ơi") rõ ràng là **địa
  danh/nguồn đi**. Tôi dịch "từ thôn" vì đó là cách đọc ít giả định nhất và
  khớp mạch truyện; **đây là chỗ tôi không chắc**, nên ghi ở đây thay vì im lặng.

  **`Mummure upakūthito` ở `2.4`:** `mummu`/`mummura` là kẻ ấp úng, giữ tiếng
  không nói ra; `upakūṭhita` là bị ấn/chặn. Tôi dịch "ngập ngừng mấp máy như
  kẻ bị ấn chặt", giữ cả hai vế. Đây là một trong những vệ từ khó nhất của lát
  này và bản dịch có thể vẫn chưa sát; ghi lại để người biên tập xem.

  **Tiêu đề `Rādhajātaka`:** giữ Pāli "Kinh Rādha", đúng với tiền lệ đã publish
  `sn22.71:0.3` = "Kinh Rādha" (cùng nhân vật).

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja198:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja198:0.3` mang Pāli `Ruhakavagga` được
  đổi *«Phẩm Thằn Lằn»* → *«Phẩm Dây Leo»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  tầng tên **không có** mục này; quyết bằng song ngữ Pāli **trong chính phẩm** — `ja191:1.1–1.3`: `"Api ruhaka chinnāpi, / jiyā sandhīyate puna;"` (dây bị cắt, sợi dây vẫn ghép lại), và bản Việt đã có *"Dây cung … sợi dây …"*. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.


  Lượt cải thiện 2026-10-13 (đọc đối kháng 13/13 khoá; đổi 6 khoá: 1.1, 1.2, 1.3, 1.4, 2.2, 2.4).
  Các đoạn "Bất định về `Pavāsā`" và "`Mummure upakūthito`" ở trên là lời của lượt trước và đã LỖI THỜI: bản
  dịch hiện hành không còn "từ thôn" hay "ngập ngừng mấp máy"; đọc theo các điểm dưới đây.
  - **1.3–1.4, sửa nghĩa (accuracy fix, lỗi nặng nhất):** `Kaccinnu tāta te mātā, na aññamupasevati` là câu hỏi
    mong đợi ("phải chăng mẹ con không thân cận người khác?"), nhưng bản cũ "Sao mẹ ngươi lại / chẳng tìm đến người
    khác" biến nó thành câu hỏi *vì sao* và đảo hàm ý. Đã sửa thành "Phải chăng, con ơi, mẹ con / không thân cận người
    khác?”". Tiền lệ `kacci(nu)` + phủ định = "Phải chăng … không …": snp1.9 (nhiều khoá), ja487:1.3, ja498:2.3;
    `upasevati` (dạng động từ) được dịch "thân cận" ở 4 trong 7 khoá thuộc iti/ja/thag trong tầng (iti76:4.2,
    ja282:1.2, ja507:28.1, ja536:102.1; còn lại "đến gần"/"lui tới"), và là cách ít thêm sắc thái nhất. `tāta` gọi người
    nhỏ hơn: trong 115 khoá ja có `tāta` đo được 51 khoá dùng "con" (34 "con", 10 "con ơi", 6 "hỡi con", 1 "này
    con"), 36 khoá là gọi cha ("cha", "thưa cha"), "ngươi" chỉ 9. Tăng `grammar_logic` 8.7 → 9, `semantic_fidelity` 8.6 → 8.8.
  - **1.1, giải quyết bất định có căn cứ (accuracy fix):** `Pavāsā` là abl. của `pavāsa` (sự đi vắng/đi xa), không
    liên quan `pavā` "đuổi đi" như lượt trước ngờ. Căn cứ: `pavāsa` xuất hiện ở ja536:51.1 ("chồng đi xa"), ja544:125.3
    ("con đi xa"), tha-ap537:18.4 ("từ xa trở về"), an8.55:1.3 ("đi xa nhà"). "Từ thôn" trong bản cũ là chi tiết
    địa danh KHÔNG có trong Pāli; đổi thành "Từ chuyến đi xa trở về". Đồng thời đổi "người ơi/ngươi" → "con ơi/con"
    (1.1, 1.2) cho khớp 1.3 và tiền lệ `tāta`; `idāni` ("giờ đây") được dịch ở 1.2. Tăng `ambiguity_integrity`
    8.4 → 8.6.
  - **2.2 và 2.4 (clarity/accuracy, nhẹ):** bỏ "dù" ở `giraṁ saccupasaṁhitaṁ` ("lời gắn với sự thật"), vì Pāli không
    có từ nhượng bộ; bỏ "đống" ở `mummure` (định vị cách, không có nghĩa "đống"). 2.1 và 2.3 giữ nguyên ("kẻo
    phải nằm" là cách đọc `sayetha` quyền biến/hệ quả; không phân xử thêm được).
  **Bất định còn lại (giữ, không đoán):** (a) người nói và người nghe ở khổ 1 không được nêu trong Pāli của riêng
  bài (không có văn xuôi duyên khởi trong kho; Rādha và Poṭṭhapāda là hai con vẹt ở ja329, nhưng đó là bài khác, không
  dùng làm căn cứ cho bài này) nên chỉ dùng "con"/"mẹ con" trung tính; (b) `mummura` và `upakūthita` chỉ xuất hiện
  ĐÚNG MỘT lần trong toàn tầng Pāli đã ghim (ja198:2.4), không có hapax song song để quét; "tro nóng" và "bị thiêu"
  là cách đọc ít giả định nhất, chưa có căn cứ khác để phân xử giữa tro nóng / than hồng / trấu cháy, thiêu / nung;
  (c) "Poṭṭhapāda" là tên (vẹt) và chuyện kể kèm theo không có trong kho. Hai bất định (a) và (b) giữ
  `semantic_fidelity` dưới 9 và `ambiguity_integrity` dưới 9. `triangulation` giữ 7 (không có bản Anh; các phép
  đối chiếu trên chỉ là tiền lệ nội bộ). `technical_integrity` giữ 9.6: chưa chạy `npm run validate`, `npm test`,
  `npm run check`, `npm run build` ở lượt này. Không có blocker mới; blocker `không có tầng english-sujato` giữ nguyên.

  Sửa lan 2026-10-13: khoá `ja198:0.3` (`Ruhakavagga`): *Phẩm Dây Leo* → *Phẩm Ruhaka*. Căn cứ: bài đầu của phẩm là `ja191` `Ruhakajātaka`, tên bài đã dịch *Kinh Ruhaka* (tên riêng) và `ja191:1.1` đọc `ruhaka` là hô ngữ *Này Ruhaka*; còn `jiyā` ở `ja191:1.2` là *dây cung*, không phải cây leo, nên nghĩa *dây leo* cho `ruhaka` không có căn cứ trong Pāli. Tiền lệ: phẩm Jātaka đặt theo tên riêng của bài đầu phẩm giữ nguyên Pāli (*Phẩm Cūḷakuṇāla*, *Phẩm Gandhāra*, *Phẩm Soṇaka*, *Phẩm Kāliṅga*…). BẤT ĐỊNH: nghĩa của `ruhaka` không phân xử được từ tầng Pāli đã ghim (không có bản Anh), nên chọn phiên âm để không khẳng định nghĩa. Ngoài lát này, `ja191`, `ja199`, `ja200` vẫn *Phẩm Dây Leo* (và `ja200:3.2` ghi *Phẩm Thằn Lằn*) — cần thống nhất.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 7 khoá chênh lệch lớn nhất (0.4, 1.1, 1.3, 2.1, 2.3, 2.4, 3.1) → khác nghĩa thật 0: sửa 0, giữ 7, bất định 2 (1.1, 2.4). Giữ: 0.4 và 3.1 chỉ khác cách đặt tên bài (bản mù viết "Chuyện Tiền Thân Rādha"; bản dự án theo tiền lệ "Kinh <tên>" của cả tầng); 2.1 ("Na kho panetaṁ subhaṇaṁ" là "điều này nói ra không hay", khớp "chẳng nên nói ra"), 2.3 ("sayetha" là lối nói điều kiện/hệ quả nên giữ "kẻo phải nằm") và 2.4 ("mummure upakūthito" cùng nghĩa "bị thiêu trong tro nóng") chỉ khác diễn đạt; 1.3 (cả hai bản cùng đọc 1.3–1.4 là câu hỏi mong đợi "phải chăng … không thân cận người khác"). Bất định: 1.1 (bản mù tự ghi không chắc; "tāta" dùng được cả với người nhỏ lẫn người trên và Pāli của riêng bài không nêu ai nói với ai, nên "con ơi" vẫn là cách đọc không chắc) và 2.4 (hai từ chỉ xuất hiện một lần trong tầng Pāli đã ghim, bản mù cũng ghi không chắc). Bản dự án không có lỗi nghĩa nào mới bị phát hiện. Không có bản Anh hay bản Việt độc lập khác; đối chiếu chỉ gồm Pāli đã ghim và một lần dịch lại cùng họ công cụ.
