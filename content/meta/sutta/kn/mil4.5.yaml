notes: |-
  Đủ 8/8 khoá trong all. Khoá 2.1 là chuỗi 25 đức tính trong một segment, dịch từng mục, giữ đúng thứ tự Pāli (kể cả asevanasevanā nêu không gần trước, gần sau).
  Chỗ có tiền lệ thì theo: cư sĩ (28 occ nam cư sĩ); học trò; chia sẻ; an ủi; kham nhẫn; cẩn trọng; tâm từ; hoạn nạn; vật thực; tiến bộ; khó tìm; tranh luận; thuần thục; bí mật; bàn bạc; sự nghi ngờ.
  Chỗ 0 tiền lệ, dịch sát chữ: meṇḍaka → hóc búa (ngữ cảnh 2.2: về sau khởi tranh luận); jina → Đấng Chiến Thắng (thuật ngữ chuẩn cho Jina); guyha → bí mật đã có tiền lệ ở nghĩa lời bí mật.
  cittaṃ upaṭṭhapetabbaṃ → giữ tâm (không dùng an trú vì đó là chữ của vihara).
  Ghi nhận đếm: Pāli nêu hai mươi lăm mà chuỗi liệt kê có thể tách gộp khác nhau (các mục qua lại làng/trú xứ); giữ nguyên văn từng mục, không gộp ý.
