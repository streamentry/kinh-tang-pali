  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU — VÀ CÓ MỘT CHỖ TÔI CỐ TÌNH DỊCH HẠT NHỎ.**
  · `aṭṭhete ekanāmakā;` (:6.2) — **chỗ khó nhất của bài, tôi không dám dịch tự do.**
    Đo toàn Pāli root: `aṭṭhete` có **2** lần (chính bài này và `tha-ap91:4.4
    aṭṭhete cakkavattino`, nơi nó nghĩa là *trong tám vị ấy*), `ekanāmak-` có **2** lần
    (chính bài này và `tha-ap44:11.4 sabbepi ekanāmakā`). Ở bài này `aṭṭhete` đi ngay sau
    `…nāma,` và đứng với `cakkavattī` ở `:6.4`, nên đọc là *ở năm thứ tám mươi*; nhưng
    `ekanāmakā` không có cách đọc nào chắc chắn mà tôi kiểm chứng được — có bản in khác
    đọc `kanakāhamā` (*ta là người có vàng*) mà tôi **không** dùng vì không kiểm được
    ở commit đã ghim. Tôi dịch **tối thiểu theo đúng những gì chắc chắn**
    (*ở năm thứ tám mươi, tên ấy là duy nhất*) và **không** thêm chuyện vàng bạc nào.
    Đây là giới hạn thật của nguồn, đã nêu ở đây thay vì bịa.
  · `Kappe sattarase āsuṁ,` (:6.3) — `sattarase` = thứ mười bảy, `āsuṁ` = năm. Đo:
    cụm `…sattarase kappe` chỉ có **1** tiền lệ (`tha-ap183:4.1` → *Vào mười bảy kiếp trước
    đây,*, khác cấu trúc vì không có `āsuṁ`). Tôi dịch *Trong kiếp thứ mười bảy năm,*
    để giữ **cả ba** thành phần có nghĩa (`kappe` + `sattarase` + `āsuṁ`) thay vì bỏ
    `āsuṁ`. Có thể đọc là *trong kiếp thứ chín mươi bảy*; tôi **không** chọn cách đó vì
    nó cần thêm con số không có trong câu.
  · `gacchantaṁ anilañjase;` (:2.2) — `anilañjasa` = không lay chuyển, không run rẩy.
    Đo được **8** bài `tha-ap` khác có cùng Pāli đoạn này, nhưng cách dịch của chúng
    **không dùng được**: 5× *đang ngự giữa bầu trời lộng gió*, 1× *Đang ngự trên đường
    gió lượn*, 1× *đang đi trên lối không dấy bụi*, 1× *giữa bầu trời là lối đi của
    gió* — bốn cách này lấy nghĩa của cả câu chứ không phải của `anilañjase`. Tôi **không
    nhân bản** chúng, dịch đúng là *đang bước đi không lay chuyển*, và ghi ở đây để
    coordinator biết đây là chỗ cố ý lệch tiền lệ.
  · `vipassissābhiropayiṁ.` (:2.4) — 0 tiền lệ nguyên văn, không có tầng Anh để phân
    xử. `abhiropayati` = dâng lên cho, kính lễ (`tha-ap63:2.4` đã dùng cho cùng động
    từ: *con đảnh lễ ngôi tháp hóa hiện ấy*); `vipassī` = bậc Dữ Kiến. Tôi dịch *rồi
    dâng lên kính lễ bậc Dữ Kiến*, giữ cả hai vế, không thêm tên riêng nào. `tuṇḍena` ở
    `:2.3` = *ở ngọn*, nên *cầm lấy ngọn cây sāla*.
  · `susaññato` (:1.4) — **0** tiền lệ trong toàn tầng (đo: `rājā susaññato ahaṁ` ở
    `tha-ap154:7.2` có Pāli nhưng bản Việt chưa dịch khoá đó). Tôi dịch *tỉnh giác
    đối với điều ác* — `pāpesu` là số nhiều nên dịch "điều ác" (không thêm "việc").
  · `subījaṁ ropitaṁ mayā` (:4.4) — đo được 3 lần trong Pāli root; tiền lệ Việt duy
    nhất là `tha-ap308:3.4` (*hãy gieo hạt giống tốt lành*, khác vì ở đó là mệnh lệnh).
    Tôi dịch *hạt giống tốt lành do tôi gieo.* theo đúng `mayā` = *bởi tôi*.
  · `vihaṅgamena santena` (:4.3) — 0 tiền lệ. `vihaṅga` = cành/non, `santena` = tốt
    lành; tôi dịch *Với cành cây tốt lành,* vì kệ 4.3–4.4 nói cây vị trưởng lão đem gieo.
  · `buddhaseṭṭhassa santike` (:4.2) — 1 tiền lệ (`tha-ap513:3.2` → *khi được đến trước
    Đức Phật tối thượng;*). `santike` là *ở nơi có mặt*, không phải *khi*, nên tôi dịch
    *ở trước Đức Phật tối thượng!* và giữ dấu chấm than nhịp kệ.
  · `duggatiṁ so na gacchati.` (:3.4) — 2 tiền lệ cùng Pāli (*vị ấy không đi vào đọa
    xứ;* `tha-ap60` · *người ấy không đi vào cõi đọa xứu’* `tha-ap331`). Tôi dùng *đọa
    xứ* theo đa số, bỏ chữ *cõi* vì ở đây là đối xứ trong lời cảnh báo.

  **DẤU LƯỢC.** `:7.2` là `…pe…` → **đúng một** `…`, không mở rộng.

