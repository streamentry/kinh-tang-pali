notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này (đo và bằng chứng ở `blocking_errors`).
  `translationTitle` đặt BẰNG khoá `:0.3`. Quy tắc đã chốt của lát: **giữ số thứ tự khi và chỉ khi Pāli `:0.3` bắt đầu bằng chữ số**. Pāli `tha-ap493:0.3` = `Tikiṅkaṇipupphiyattheraapadāna` — bắt đầu bằng chữ T, không có số ⇒ **bỏ số thứ tự**, khớp với đa số kho (trong 1.559 tệp `:0.3` đã có, khuôn `Bài Kệ Tuyên Ngợ Về Trưởng Lão X` chiếm 187/187). Cùng phẩm này có `tha-ap500` với Pāli `8 Pulinathūpiyattheraapadāna` — số thứ tự sẽ được giữ nếu lát đó cũng dịch tới; tôi chỉ ghi lại để người điều phối gộp.
  Pāli trùng nguyên văn ở 26/33 khoá, tôi dùng lại **nguyên văn cả 26** — tỷ lệ cao nhất trong ba bài của lát, vì bài này trùng nguyên văn với `tha-ap494` (cùng phẩm) ở 6 khoá: `Therāpadāna` (348×) · `Kiṅkaṇipupphavagga` → “Phẩm Hoa Kiṅkaṇi” (8×, và cả 8 bài đã có trong đúng phẩm — 494, 495, 496, 497, 498, 499, 501, 502 — đều dùng y hệt) · `Kaṇikāraṁva jotantaṁ,` → “Rực sáng như hoa kaṇikāra,” (4×) · `nisinnaṁ pabbatantare;` → “đang ngồi giữa khe núi;” (2×, trùng tuyệt đối với `tha-ap351:1.2` và `tha-ap382:1.2`) · `Addasaṁ virajaṁ buddhaṁ,` → “ta đã thấy Đức Phật ly trần,” (3×) · `Tīṇi kiṅkaṇipupphāni,` → “Ba đóa hoa kiṅkaṇi,” (trùng tuyệt đối với `tha-ap494:2.1`) · `Tena kammena sukatena,` (12×) · `cetanāpaṇidhīhi ca;` (14×) · `Jahitvā mānusaṁ dehaṁ,` (6×) · `tāvatiṁsamagacchahaṁ.` → “ta đã đến cõi trời Ba mươi ba.” (8×) · `Ekanavutito kappe,` → “Vào chín mươi mốt kiếp trước,” (28×) · `yaṁ buddhamabhipūjayiṁ;` → “khi ta cúng dường lên Đức Phật;” (5×) · `Duggatiṁ nābhijānāmi,` → “Ta không biết mình rơi vào khổ đau,” (121×) · `buddhapūjāyidaṁ phalaṁ.` → “đây là quả báo của việc cúng dường Đức Phật.” (28×) · cả khối kết 5.1–7.4 (12 khoá, giống hệt tha-ap443 và tha-ap473) dùng nguyên văn `tha-ap453:6.1–8.4` và `tha-ap483:6.1–8.4` — 73× / 7× / 3× / 74× / 2× / 2× / 7× / 86× / 357× / 21× / 29× / 324×.
  Ngôi thứ nhất chọn `ta` cho **toàn bộ** bài. Đây là bài quyết định của lát: `tha-ap494` — cùng phẩm `Kiṅkaṇipupphavagga`, trùng nguyên văn 6 khoá với bài này — dùng `ta` từ đầu bài tới cuối, và `tha-ap494` là mẫu duy nhất trong tầng vừa dùng `ta` ở mở bài vừa giữ `ta` ở khối kết. `tha-ap453` và `tha-ap483` thì đổi từ “tôi” sang “ta” giữa bài, tôi không sao chép kiểu đổi đó.
  Bất định, ghi ở đây chứ không giải thích trong thân kinh: (1) `:1.4` `vipassiṁ lokanāyakaṁ.` — `vipassi` ở đây vừa là danh từ tính từ (bậc thấy tri) vừa là tên Đức Phật Vipassī. Tôi dịch theo cách đã có ở `tha-ap298:2.2` với Pāli trùng tuyệt đối: “Đức Phật Vipassī, bậc Dẫn Đạo Thế Gian.”; cách thứ hai trong tầng là “Đức Phật Vipassī Đấng Dẫn Đạo đời” (`tha-ap98:3.2`). (2) `:2.4` `gacchāmi dakkhiṇāmukho.` — `dakkhiṇa` có hai nghĩa là “nam” và “bên phải”, và ở Kinh Tạng `dakkhiṇāmukho` thường đi kèm đi vòng clockwise quanh bảo tháp; ở đây không có ngữ cảnh vòng quanh nên tôi giữ nghĩa “nam” và dịch “ta đi, quay mặt về phía nam.” `dakkhiṇāmukha` không có tiền lệ nào trong tầng. (3) `Sambuddhamabhipūjetvā,` tôi dịch “sau khi cúng dường bậc Toàn Giác,” — `sambuddha` có nhiều cách trong tầng (“bậc Tự Tại”, “bậc Toàn Giác”, “Đấng Tự Tại Giác”); chọn “bậc Toàn Giác” vì nó ghép với `apūjetvā` (đã cúng dường) và không lặp “Đức Phật” đã có ở khoá liền trước. (4) `paggayha abhiropayiṁ` tôi dịch “ta cầm lấy rồi dâng lên;” — `abhiropayi` có tiền lệ “dâng lên” trong tầng, `paggayha` có tiền lệ “cầm lấy”.
  Tên riêng `Tikiṅkaṇipupphiya` chưa tồn tại trong tầng (chỉ có `Kiṅkaṇipupphiya` ở `tha-ap502:14.2` và `Tikiṅkaṇipūjaka` ở `tha-ap346:0.3`), nên `lọt_pāli` sẽ báo Pāli lọt ở `:8.1`; tôi khai tên này vào bộ nhớ tiến trình đúng theo cơ chế mà docstring của `lọt_pāli` nêu, **không** sửa `_hvi.py` trên đĩa. Lý do hợp lệ: đây là tên riêng của chính bài, chỉ không có dưới dạng token tách vì Pāli gộp (`Tikiṅkaṇipupphiyattherassāpadānaṁ`).
  Không khoá nào trong 33 khoá của bài này có `…pe…` hay `…` trần ở Pāli (đã kiểm 33/33), nên không có dấu lược nào phải giữ, và không có chỗ nào bịa dấu lược để che chỗ thiếu. Nhân vật lời đối thoại không có `(…)` đứng một mình.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được phép chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đúng 33/33 khoá trong `all`, `set(khoá Việt) == set(khoá Pāli)`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá (0 = 0), ngoặc kép cân trên cả bài (1 mở ở `:1.1`, 1 đóng ở `:7.4`), không Pāli lọt, không trùng nguyên văn Pāli ở khoá có nội dung, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.