notes: |-
  Đợt 19, làn 89. Dịch từ Pāli root commit đã ghim, đủ 127/127 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ ba của Buddhavaṃsa, về Đức Phật Dīpaṅkara (vị thứ nhất theo `32.1`: `paṭhamo`): việc quy y và các bậc thành tựu Ngài ban cho đại chúng, ba lần chứng ngộ và ba kỳ hội chúng, giáo pháp hưng thịnh, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp. Khác các phẩm sau, bài không có đoạn tiền thân của Đức Gotama và lời thọ ký; lời kể mở đầu bằng dấu nháy kép ở `1.1` và đóng ở `31.4`. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các phẩm anh em (16/16 tiền lệ).
  - `0.2` “3. Dòng Kế Thừa Của Đức Phật Dīpaṅkara”: `dīpaṅkarabuddhavaṁsa`; cùng khuôn với `bv9:0.2`, `bv10:0.2`, `bv19:0.2`. Số “3.” là số ghi trong tiêu đề Pāli (thứ tự phẩm), còn thứ tự Đức Phật là thứ nhất (`32.1`).
  - `32.1` “Dòng kế thừa của Đức Thế Tôn Dīpaṅkara là thứ nhất.”: `paṭhamo` = 1; cùng khuôn với `bv9:30.1`, `bv10:30.1`.

  **Số Pāli, đã tự tính.** `pañca` 5 (2.3 năm giới). `dasavidha` “mười loại” (2.4). `catu` 4 (3.2 bốn quả; 21.1 bốn dấu hiệu). `aṭṭha` 8 (4.2 tám chứng đạt). `tisso` 3 (4.3 ba minh). `cha` 6 (4.4, 15.2 sáu thắng trí). `satasahassa` 100 × 1.000 = **100.000** (7.2: 100.000 do-tuần; theo tiền lệ `mil7.7.6:6.2` cùng Pāli). `koṭisata` = 100 koṭi (8.2; khớp `bv10:4.2`). `navutikoṭi` 90 koṭi (8.4; `navuti` = 90, khớp `bv10:4.4`). `navutikoṭisahassa` 90 × 1.000 = **chín mươi ngàn koṭi** (9.3; khớp `bv8:5.3`, `bv22:4.3`). `tayo` 3 (10.1 ba kỳ hội chúng; 19.4 ba lâu đài khớp ba tên ở 19.3). `koṭisatasahassa` 100 × 1.000 = **một trăm ngàn koṭi** (10.3; khớp `bv7:7.3`, `bv22:3.3`). `satakoṭiyo` = **một trăm koṭi** (11.4). `navakoṭisahassa` 9 × 1.000 = **chín ngàn koṭi** (12.3; `nava` = 9, cùng cấu tạo `navuti` + `koṭi` + `sahassa` ở 9.3; xem bất định 3). `dasavīsasahassa` = **mười ngàn, hai mươi ngàn** (13.1; khớp `bv27:8.1`). `cattāri satasahassāni` 4 × 100.000 = **bốn trăm ngàn** (15.1). `dasavassasahassāni` 10 × 1.000 = **10.000 năm** (19.1). `tīṇi satasahassāni` 3 × 100.000 = **ba trăm ngàn** (20.1; khớp `bv10:8.3`). `anūnadasamāsa` = không thiếu + 10 = **đủ mười tháng** (21.3; khớp `bv9:20.3`). `asīti` 80 hattha (27.1; khớp `bv15:23.3`). `satasahassavassāni` 100 × 1.000 = **100.000 năm** (28.1). `chattiṁsa` 6 + 30 = **36** do-tuần (31.4; `tiṁsa` = 30, `cha` = 6; không đo được tiền lệ trực tiếp vì `bv9:29.4` chỉ ghi “hai mươi lăm” không kèm đơn vị). `paṭhamo` 1 (32.1). Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt hiện có (draft và published, gồm cả các phẩm cùng đợt; so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 53 khoá của bài có Pāli trùng với khoá bài khác, tổng 343 cặp, trong đó 22 cặp có Việt khác bản tôi viết; 41 khoá dùng đúng nguyên văn mọi tiền lệ (`0.1`, `7.2`, `8.1`, `8.2`, `8.4`, `9.2`–`9.4`, `10.1`, `10.3`, `11.4`, `12.1`, `13.1`, `13.4`, `14.1`, `14.4`, `16.2`, `17.1`, `17.2`, `19.1`, `19.2`, `19.4`, `20.1`, `21.1`–`21.3`, `22.3`, `23.1`, `24.2`, `25.1`, `25.2`, `26.2`, `27.4`, `28.2`, `28.3`, `29.3`, `29.4`, `30.3`, `30.4`, `31.2`, `31.3`).
  - Chỗ viết **khác** tiền lệ, có lý do: `1.2` (1 cặp: `bv9:13.4` “bậc Dẫn Đạo thế gian cùng Tăng đoàn.”): ở `bv9` là tân ngữ của “ta đã làm cho no đủ”, ở đây khoá trước (`1.1`) có `bhojayitvāna` nên thêm “cho” để nối câu; dấu cuối theo Pāli từng khoá. `7.1` (1 cặp, `mil7.7.6:6.1` “Trông thấy người có duyên lành giác ngộ,”): `bodhaneyyaṁ janaṁ` không có chữ “lành”, tôi viết sát nghĩa “người đáng được giác ngộ” theo cách tầng Việt đã dịch `bodhaneyya` (5/7 khoá chứa `bodhaneyya`, đều ở `mil5.3.3`, viết “đáng được giác ngộ” hoặc “đáng giác ngộ”). `7.3` (1 cặp, `mil7.7.6:6.3` “Chỉ trong giây lát bậc Đại Ẩn Sĩ tìm đến tận nơi,”): Pāli không có chủ ngữ ở khoá này, chủ ngữ `mahāmuni` nằm ở `7.4` nên không thêm; `upagantvā` → “đến gần” (`upāgamiṁ` 18/49 trong tầng). `7.4` không có tiền lệ nguyên văn trùng (tiền lệ `mil7.7.6:6.4` ghi `mahāmunī` có dấu dài và diễn giải khác); `mahāmuni` → “Đại Mâu-ni” theo đa số phẩm Buddhavaṃsa (`bv9:21.2`, `bv10:6.2`). `10.4` và `13.2` (4 cặp mỗi khoá khác chỉ ở dấu cuối: tiền lệ `.`, Pāli ở đây `;`). `14.3` (1 cặp, `bv28:3.1` “Đức Thế Tôn Dīpaṅkara,”): ở `bv28` đứng đầu danh sách (“Đức Thế Tôn Dīpaṅkara, và bậc Đạo Sư Koṇḍañña”); ở đây là sở hữu cách của `sāsanaṁ` ở `14.4` nên viết “Của Đức Thế Tôn Dīpaṅkara,” theo khuôn “Của …” ở `bv9:8.3`. `15.2` (4 cặp, 1 khác: `tha-ap` viết “thắng tri”; chọn “thắng trí” theo 3/4 và `bv10:8.2`). `19.3` (3 cặp, 3 khác: `sn21.6:2.1`, `ja202:1.1`, `ja214:2.3` dịch “Ngỗng trời, diệc và công” vì đó là danh sách chim; ở đây ba từ đứng trước “ba lâu đài tối thượng” (19.4) và theo khuôn các phẩm anh em (`bv19:17.3` “Guhāsela, Nārisaya và Nisabha”, `bv9:18.3`), nên viết thành ba tên riêng; xem bất định 6). `20.2` (22 cặp, 3 khác; 19 giống: “người nữ được trang sức đẹp đẽ;” là dạng đa số). `25.3` (13 cặp, 1 khác chỉ thiếu dấu phẩy). `27.1` (1 cặp, `bv15:23.3` “cao tám mươi hattha,”: tôi viết hoa chữ đầu “Cao” vì khoá trước `26.4` kết bằng dấu chấm). `28.4` (18 cặp, 1 khác: `tha-ap343:1.4` “cứu vớt đông đảo chúng sanh.”; chọn dạng đa số 17/18).
  - `1.4`, `10.2`, `18.4`, `24.4`, `26.4` cùng Pāli `dīpaṅkarassa satthuno`: tôi viết khác nhau theo ngữ pháp từng khoá, xem mục “Trùng trong chính bài”.

  **Trùng trong chính bài.** 2 nhóm Pāli trùng: `1.4`/`10.2`/`18.4`/`24.4`/`26.4` (5 khoá, 10 cặp; 3 cặp giống hệt `18.4`/`24.4`/`26.4`, 7 cặp khác) và `22.4`/`27.2` (2 khoá, 1 cặp). 7 cặp khác của nhóm đầu là có chủ ý: `1.4` “bậc Đạo Sư Dīpaṅkara.” là đồng vị với “vị ấy” ở `1.3` (đối tượng của quy y); `10.2` “nơi bậc Đạo Sư Dīpaṅkara;” là chỗ xảy ra ba kỳ hội chúng (cùng khuôn `bv12:8.2`, `bv9:8.2`); `18.4`, `24.4`, `26.4` là sở hữu cách “của …” (mẹ, thị giả, nữ thị giả). `22.4` “Dīpaṅkara, bậc Đại Mâu-ni.” và `27.2` “Dīpaṅkara, bậc Đại Mâu-ni;” chỉ khác dấu cuối theo Pāli từng khoá (`.` ở `22.4`, `;` ở `27.2`).

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá, đếm số khoá).
  - `deti`/`pavecchati` → “ban” (3.1, 3.4, 4.2, 4.4): tầng dùng “cho” 146 khoá, “ban” 7, “ban cho” 3 trong 223 khoá chứa `deti`/`pavecchati`; trong cùng phẩm anh em chỉ `bv27:6.3` “ta ban cho”. Chọn “ban” vì đối tượng là quả vị, thần thông, đạo quả (“cho” sẽ đọc như đưa vật), khác với đa số tiền lệ về vật cúng. Phương án khác: “cho”.
  - `paṭisambhidā` → “vô ngại giải” (568 khoá “vô ngại giải”, 1 “tuệ phân tích” trong 597 khoá). `vijjā` → “minh” (“Ba minh” `dn33:1.10.141`, `dn34:1.4.38`). `abhiññā` → “thắng trí” (`bv10:8.2`). `varasamāpatti` → “chứng đạt tối thượng” (`bv10:12.1`). `phala` → “quả”. `sāmañña` → “đời sống sa-môn” (khoá `dn8:16.3` dịch “làm một sa-môn”, `dn34:1.5.42` “quả Sa-môn”; chọn “đời sống sa-môn” cho `sāmaññaṁ` đứng riêng, xem bất định 2).
  - `saraṇāgamana`/`saraṇaṁ upagacchuṁ` → “quy y” (`tha-ap300:3.2`). `nivesesi` → “an lập” (11/19 khoá chứa `nivesesi`/`nivesetvā`/`nivesayi`). `ovadati` → “khuyên dạy” (`sn9.3:1.2`; `mn81:5.4` dùng “giáo giới” cho Đức Phật Kassapa). `yoga` (5.1 `tena yogena`) → “phương tiện” (`mil5.3.3:7.6`, `mil5.3.3:8.2`; 2/3 khoá chứa `tena yogena`, khoá còn lại viết “phương cách”). `janakāya` → “đám đông người” (tiền lệ `mahājanakāya` “đám đông dân chúng”, `dn14:2.10.1`).
  - `lokanātha` → “bậc Lãnh Đạo thế gian” (12 khoá “Lãnh Đạo”, 4 “Hộ Trì” trong 31 khoá; `bv16:3.1`). `nātha` đứng riêng → “bậc Hộ Chủ” (5 khoá “Hộ Chủ”, 1 “che chở” trong 74 khoá chứa `nātha`; 8.3). `nāyaka` → “Dẫn Đạo” (`bv9:13.4`). `lokavidū` → “bậc hiểu rõ thế giới” (28/35 khoá kệ ngắn; `bv28:10.3`, `bv28:14.3`; toàn tầng “hiểu biết thế gian” 41, “Thế Gian Giải” 31 trên 131 khoá, chủ yếu ở văn xuôi). `narāsabha` → “đấng Nhân Ngưu” (`bv10:9.1`). `mahāmuni` → “Đại Mâu-ni”, `mahesi` → “Đại Ẩn Sĩ” (`bv9`, `bv10`, `bv22:25.2`). `mahāvīra` → “Đại Anh Hùng”. `jina` → “bậc Chiến Thắng”.
  - `duggati` → “cõi dữ” (10/12 khoá kệ ngắn; toàn tầng 885 khoá: “ác thú” 181, “cõi dữ” 139, “cảnh khổ” 39, “ác đạo” 34, “khổ cảnh” 4). `tārayati` → “đưa … vượt qua” (`bv28:2.4`, `bv20:23.4`). `parimoceti` → “giải thoát” (3 khoá, quá ít để đếm). `bodheti` → “làm cho giác ngộ”.
  - `devabhavana` → “cõi trời” (`mil5.3.3:10.1`, `mil5.1.6:6.5`; `thi-ap15:10.3` “thiên cung”, `thi-ap9:10.3` “nơi ở của chư thiên”: 2/4 “cõi trời”). `samāgama` → “cuộc tụ hội”, `sannipāta` → “kỳ hội chúng” (`bv7:6.1`, `bv9:8.1`, `bv12:8.1`). `viveka` → “viễn ly” (233/317 khoá chứa `viveka`). `pavāreti` → “cử hành lễ Tự tứ” (xem bất định 4; tầng dịch `pavāraṇā` là “Tự tứ”: `mn118:3.1`, `sn8.12:7.4`, `sn8.7:0.3`).
  - `sāsana` → “giáo pháp” (`bv27:9.4`). `pāvacana` → “lời dạy” (`bv9:27.1`). `saddhamma` → “Chánh Pháp” (402/548 khoá). `jotayati` → “soi sáng” (không tiền lệ). `mahājana` → “đại chúng” (11 khoá; “đông đảo” 22, “mọi người” 3 trong 85 khoá chứa `mahājana`). `titthiya` → “ngoại đạo”; `maddana` → “đập tan” (`mn92:20.6` `mārasenappamaddanaṁ` “đập tan đạo quân Māra”). `dīparukkha` → “cây đèn” (`tha-ap395:1.2`, `tha-ap436:1.2`; “ngọn đèn cây” 2).
  - `sekha` → “bậc hữu học”; `apattamānasa` → “tâm chưa thành tựu” (`bv27:11.3`, cùng gốc `appattamānasā`). `garahita` → “bị chê trách” (`bv27:11.4` “bị bậc trí chê trách”; `dn27:5.9` “bị người trí chỉ trích”). `iddhi` → “thần thông” (`bv19`, 39/43 khoá). `cakkaratana` → “bánh xe báu” (`dn14:1.31.10`, 69 khoá chứa `cakkaratana`). `hattha`, `koṭi`, `yojana` giữ nguyên chữ Pāli (`bv15:23.3`; “do-tuần” theo `bv19:28.4`). `padhānacāra` → “hạnh nỗ lực tinh tấn” (`bv15:18.3`, `bv17:16.3`, `bv22:18.3`, `bv27:16.3`).
  - Tên riêng (giữ dạng Pāli có dấu): `Dīpaṅkara` (`bv28:2.1`, `bv28:3.1`), `Rammavatī`, `Sudeva`, `Sumedhā`, `Padumā`, `Usabhakkhandha`, `Nāradakūṭa`, `Sudassana`, `Nandārāma` (`bv19:28.2`), `Sirīghara` (`bv7:20.4`), `Sumaṅgala`, `Tissa`, `Sāgata`, `Nandā`, `Sunandā`, `Pipphalī`, `Tapussa`, `Bhallika`, `Sirimā`, `Koṇā`, `Haṁsā`, `Koñcā`, `Mayūrā`. Chưa có tiền lệ trong tầng cho các tên này trừ những tên đã nêu. `Tissa` ở 24.1 là tên đệ tử của Dīpaṅkara, khác Đức Phật Tissa ở `bv19`. `Tapussa` và `Bhallika` ở 26.1 cùng tên hai thương nhân dâng bữa ăn đầu tiên cho Đức Gotama; Pāli không nói họ là một, nên không nối.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `1.1`: `te` không có tiền ngữ trong bài này (đây là khoá mở đầu của bài); Việt viết “họ” đúng theo `te`, không nêu họ là ai. `1.3` `upagacchuṁ saraṇaṁ tassa dīpaṅkarassa satthuno`: “đã đến quy y nơi vị ấy, bậc Đạo Sư Dīpaṅkara”; `tassa` và `dīpaṅkarassa satthuno` đồng vị.
  2. `2.1`–`4.4`: khuôn “Có người … có người khác …” là `kañci`/`kassaci` lặp theo mạch kệ; `3.2` `caturo phalamuttame`: đồng vị của `sāmaññaṁ` (đời sống sa-môn = bốn quả tối thượng), cách đọc khác là hai món riêng. `3.3` `asame dhamme`: “các pháp vô song”, tôi không quy ra tập pháp cụ thể vì Pāli root không nêu. `3.4` và `4.4` không có `kassaci` đi kèm nên “có người” không nhắc lại; cách đọc khác: `deti so paṭisambhidā` và `chaḷabhiññā pavecchati` nói về cùng nhóm người, không phải thêm một nhóm. `4.2` `aṭṭha`: “tám chứng” là tám thiền chứng (bốn sắc giới, bốn vô sắc giới), nhưng Pāli chỉ nói “tám”, nên Việt không nêu.
  3. `12.3` `navakoṭisahassehi`: tôi đọc `nava` là chín, rồi chín ngàn koṭi, theo cấu tạo `X-koṭi-sahassa` như `navutikoṭisahassānaṁ` (9.3, 90 ngàn koṭi). Cách đọc khác: đây là lỗi/ biến thể của `navutikoṭisahassehi` (90 ngàn koṭi); tầng Anh không có để phân xử, và khoá này không lặp lại ở nơi nào khác trong tầng. **Không phân xử được, người biên tập cần xác nhận.** Dãy ba kỳ hội chúng (100.000 koṭi, 100 koṭi, 9.000 koṭi) không đơn điệu, nhưng Pāli không có chữ nào để sửa.
  4. `12.4` `pavāresi`: “cử hành lễ Tự tứ” vì đây là kỳ hội của chúng đã đoạn tận lậu hoặc (`11.3`) và tầng dịch `pavāraṇā` là “Tự tứ” (như `sn8.12:7.4` `sāriputtapavāraṇā`); mặt khác tầng có `sampavāresi` ở nghĩa “làm cho thỏa mãn” (`dn4:25.2`, 30 khoá chứa `pavāres-`) nên cách đọc khác là “làm thỏa nguyện/ mời”. `12.1`–`12.2` cú pháp: `yamhi kāle mahāvīro sudassanasiluccaye … pavāresi mahāmuni`: một chủ ngữ hai danh xưng (`mahāvīro`, `mahāmuni`) cách nhau ba khoá; Việt giữ nguyên, không thêm “Ngài”. Cách đọc `siluccaya` là “núi đá” (tầng có `himavā … siluccaya` “núi đá”, `an6.43:8.2`, `thag15.2:4.2`).
  5. `5.1`–`5.4` `tena yogena … tena vitthārikaṁ āsi`: `yoga` là “phương tiện” theo `mil5.3.3`, `tena` hai lần nối “bằng phương tiện ấy” với “nhờ vậy được truyền rộng”; cách đọc khác của `yoga` là “sự gắn bó/ nỗ lực”. `6.1` `mahāhanusabhakkhandho`: `mahāhanu` “quai hàm lớn” (`sīhahanu` “quai hàm như sư tử”, `dn14:1.32.28`) + `usabhakkhandha` “vai như bò mộng”; `dīpaṅkarassa nāmako` “mang tên Dīpaṅkara”: vị được mô tả là chính Dīpaṅkara. Cách đọc khác: `Mahāhanusabhakkhandho` là một tên riêng, vì cùng chữ `usabhakkhandho` ở `20.4` là tên người con (xem 7). `6.3`–`6.4` tân ngữ `bahū jane` dùng chung cho hai động từ; Việt không nhắc lại.
  6. `19.3` `Haṁsā koñcā mayūrā ca`: ba tên lâu đài (khớp “ba” ở `19.4`, cùng khuôn `bv19:17.3`, `bv9:18.3`). Cách đọc khác: ba loài chim (ngỗng trời, diệc, công) trang trí hoặc làm tên lâu đài; tầng có hai khoá dịch như danh sách chim (`sn21.6:2.1`, `ja202:1.1`). Pāli root ở khoá này không có chữ `nāma`.
  7. `20.4` `usabhakkhandho atrajo`: “người con ruột là Usabhakkhandha”: tôi đọc là tên con, theo cấu tạo `atrajo` + tên ở `bv9:19.4`, `bv10:18.4`. Cách đọc khác: tính từ “vai như bò mộng” bổ nghĩa cho người con (không có tên). Pāli không có `nāma` ở khoá này.
  8. `16.1`–`16.4`: `ye keci tena samayena jahanti mānusaṁ bhavaṁ` “bất cứ ai vào lúc ấy từ bỏ kiếp người” (= chết) cùng khuôn `bv27:11.2`; `apattamānasā sekhā garahitā bhavanti te`: “là bậc hữu học, tâm chưa thành tựu, họ bị chê trách”; Pāli không nêu ai chê trách (ở `bv27:11.4` có “bậc trí”), nên không thêm. Ý đầy đủ của lời chê trách này Pāli root không nói; Việt chỉ giữ lời Pāli.
  9. `22.2` `abujjhi mānasaṁ muni`: `mānasaṁ` tôi đọc là đối cách chỉ phương diện (“giác ngộ trong tâm”). Cách đọc khác: `mānasa` là “mục đích/ quả” (như `apattamānasā` ở `16.3`), nên là “giác ngộ mục đích tối hậu”. **Không phân xử được.** `22.1`–`22.4`: `Brahmunā yācito santo` ở cuối phần và `dīpaṅkaro mahāmuni` kết bằng dấu chấm, trong khi `23.1` mở câu mới với cùng chủ ngữ (`mahāvīro`); Việt theo dấu câu Pāli.
  10. `23.2`–`23.4`: `nandārāme sirīghare` “ở Nandārāma, trong Sirīghara” (`bv7:20.4`); `sirīsamūlamhi` “dưới gốc cây sirīsa” (`dn14:1.8.4`); `akā titthiyamaddanaṁ` “đã đập tan các ngoại đạo” (Pāli root chỉ nói “đã làm việc đập tan ngoại đạo”, không nêu cách thức, nên Việt chỉ nêu việc đó).
  11. `26.1`–`26.4`: `Tapussabhallikā nāma` “các vị tên là Tapussa và Bhallika” (hợp từ đôi số nhiều); `Sirimā koṇā upaṭṭhikā` “Sirimā và Koṇā, các nữ thị giả”: Pāli viết `upaṭṭhikā` không có `aggu-` như `26.2` `aggupaṭṭhakā`, nên Việt cũng không viết “hàng đầu”. Cách đọc khác: `koṇā` là tính từ (“Sirimā cong”) thay vì tên riêng; không tiền lệ.
  12. `27.3` `Sobhati dīparukkhova`: “như cây đèn” (giá/ cột thắp nhiều đèn); cách đọc khác là “cây thắp đèn”. `27.1`: `asītihatthamubbedho` chiều cao chỉ cho thân Đức Phật.
  13. `30.1`–`30.2` `Sā ca iddhi so ca yaso, Tāni ca pādesu cakkaratanāni`: “thần thông ấy và danh tiếng ấy, cùng những bánh xe báu nơi đôi chân ấy”: ba thứ cùng bị `antarahita` ở `30.3`; `pādesu` “nơi đôi chân” (tướng bánh xe ở lòng chân), Việt không nêu số.
  14. `13.3` `ekadvinnaṁ abhisamayā`: “các lần chứng ngộ của một, của hai” theo khuôn `bv27:8.3`; Pāli ở đây là số nhiều `abhisamayā` (ở `bv27` là `abhisamayo`), nên viết “Các lần”. Ý “mỗi lần một người, hai người” là cách đọc khác, không quy được.
  15. `29.1`–`29.4`: câu kết nối bằng `jotayitvāna … santāretvā … jalitvā … nibbuto`; `santāretvā mahājanaṁ` “sau khi đưa đại chúng vượt qua” theo `bv20:24.2`.

