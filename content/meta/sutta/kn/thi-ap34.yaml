notes: |-
  Bài kinh thi-ap34 — Siṅgālamātutherīapadāna, bài thứ tư của Phẩm Khattiya trong
  Therīapadāna. 122/122 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào
  ngoài tập khoá Pāli. Bài kể về vị ni được gọi là mẹ của Siṅgālaka: thời Đức Phật
  Padumuttara, sinh trong gia đình đại thần ở Haṁsavatī, xuất gia, nghe nói về vị
  tỳ-kheo-ni tối thắng về tín giải và ước nguyện vị trí ấy; được Đức Phật thọ ký
  rằng sau một trăm ngàn kiếp nữa, thời Đức Gotama, sẽ thành nữ đệ tử mang danh mẹ
  của Siṅgālaka. Đời cuối, sinh ở Giribbaja, con trai Siṅgālaka lễ bái các phương
  thì được Đức Phật giáo huấn; bà nghe pháp, chứng quả Nhập Lưu, xuất gia, chứng
  A-la-hán và được đặt vào vị trí tối thắng về tín giải.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt:
  - :0.1 Therīapadāna giữ nguyên Pāli (24 khoá cùng dạng, 1 khoá dịch Trưởng Lão Ni
    Ký Sự); :0.2 Khattiyāvagga → Phẩm Khattiya (7/7 khoá cùng dạng).
  - translationTitle bằng đúng giá trị :0.3 từng ký tự, kể cả số thứ tự và dấu chấm.
  - Số thứ tự ở :0.3: Pāli :0.3 là 4 Siṅgālamātutherīapadāna, bắt đầu bằng số nên
    giữ số theo hình thức N. Đo ở phạm vi gần nhất, trong 13 tệp thi-ap đã có mà
    Pāli :0.3 có số: 7 tệp giữ số, 6 tệp bỏ số, 0 tệp thêm số ở chỗ Pāli không có;
    các bài liền kề cùng phẩm (thi-ap36, 37, 38, 39, 40) đều giữ số. Phạm vi
    tha-ap: 128 giữ số, 18 bỏ số, 0 thừa. Nếu người biên tập muốn thi-ap thống nhất
    theo một lối thì cần sửa một lượt cho cả nhóm.
  - Công thức tiêu đề Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni: phạm vi gần nhất (25 tệp
    thi-ap đã dịch) cho Tuyên Ngợ 23, Tuyên Ngôn 1, Ký Sự 0, lối khác 1; toàn tầng
    tha-ap cho Tuyên Ngợ 251, Tuyên Ngôn 132, Ký Sự 111. Hai phạm vi cùng nghiêng về
    Tuyên Ngợ nên bài này theo để đồng nhất với các bài kề cận. Tuyên Ngợ có vẻ là
    chính tả sai của Tuyên Ngôn; cần người biên tập phán một lượt cho cả cuốn chứ
    không sửa riêng bài này.
  - Khoá :31.1 catutthaṁ → thứ tư (thi-ap14 dịch thứ tư cho cùng số thứ tự). Khoá
    :30.1 là lời kết Itthaṁ sudaṁ … abhāsitthāti; imā gāthāyo là số nhiều nên dịch
    những bài kệ này theo nhóm đa số (407 khoá so với 21 khoá bài kệ này, theo đo
    của phẩm), cùng dạng với thi-ap37.
  - Tên người: Siṅgālamātā và Siṅgālaka giữ nguyên Pāli (tên riêng; thi-ap37, 38,
    39 giữ nguyên tên ni). Tầng đã có an1.247 dịch Siṅgālakamātā là bà mẹ của
    Siṅgālaka; ở 12.3 mātāti dịch được gọi là mẹ của Siṅgālaka.

  SỐ PĀLI — tự tính:
  - satasahassa (1.3 satasahassamhi, 11.1 satasahassito) = sata 100 × sahassa 1.000 =
    100.000 → một trăm ngàn. Đơn vị (đếm trên các khoá Pāli có satasahass mà
    bản Việt có cụm một trăm ngàn/nghìn): ngoài tha-ap và thi-ap ngàn 50, nghìn 5;
    trong tha-ap và thi-ap ngàn 95, nghìn 9. Cả hai phạm vi nghiêng về ngàn.
  - dvekoṭi (18.3 Dvekoṭinaranārīnaṁ) = dve 2 × koṭi → hai koṭi nam và nữ. koṭi giữ
    nguyên không quy đổi: trong các khoá koṭi của tầng, đơn vị koṭi được giữ nguyên
    ở đa số (vd trăm ngàn koṭi 19 khoá, bốn ngàn koṭi 6 khoá, tám mươi koṭi 4 khoá),
    chỉ vài khoá quy ra triệu. Không có tiền lệ nào cho đúng dạng Dvekoṭinaranārī.
  - tisso sikkhā (6.4) = ba → ba học pháp (an3.86–3.90 dịch ba học pháp, 5 khoá);
    tāvatiṁsa (14.4) = Ba mươi ba (37 khoá Ba mươi ba, 2 khoá Đạo Lợi trong toàn
    tầng); catasso (29.1) = bốn; catuttha (:31.1) = thứ tư.
  - Lưu ý theo brief phẩm: tiṁsa = 30, và bài này KHÔNG có cụm Tiṁsakappasahassa;
    Tāvatiṁsa là tên cõi trời (ba mươi ba), không phải số kiếp. Không có phép nhân
    lớn khác, nên máy kiểm số Pāli của kho không có gì để đo ở bài này — chỉ có phép
    tự tính ở trên, không phải một phép kiểm tự động đã pass.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò toàn tầng (gồm cả các bài thi-ap vừa dịch trong
  đợt này), dùng lại nguyên văn bản dịch:
  - Trong 122 khoá, 68 khoá có Pāli trùng byte với tầng đã dịch (65 khoá nếu bỏ ba
    khoá …pe…). 59/68 khoá dùng đúng một dạng đã có trong tầng; 50/68 khoá dùng đúng
    dạng đa số. 9 khoá khác dạng, đều có chủ ý:
    * 2.1, 4.2, 4.4: tiền lệ dùng ngôi tôi (mỗi khoá 1 tiền lệ); bài này dùng ta cho
      người kể xuyên suốt, khớp thi-ap33, 36, 37 và dạng ta đa số ở các khoá trùng
      3.4/19.4 (ta 8, tôi 6), 14.4 (ta 17, tôi 9), 25.1 (ta 6, tôi 3).
    * 5.1, 16.3, 20.1: chỉ khác chữ hoa/thường đầu dòng, theo vị trí trong câu.
    * 7.3: tiền lệ duy nhất sn11.14 dịch Người nào có tín tâm; bài này dùng Ai có
      niềm tin nơi Như Lai theo sn55.26 và sn55.51 (cùng kệ).
    * 8.2 ujubhūtañca dassanaṁ: tiền lệ gồm kiến giải chánh trực (2), tri kiến ngay
      thẳng (3 kể các biến thể), thấy ngay thẳng (1). Dùng cái thấy ngay thẳng vì
      dassana ở đây là cái thấy, không phải ñāṇadassana; 9.2 dhammadassanaṁ cũng
      là sự thấy pháp nên giữ cùng gốc thấy.
    * 24.4 vasī homi mahāmuni: dùng dạng của thi-ap37 (ta là bậc làm chủ, bạch bậc Đại
      Mâu-ni) thay cho con làm chủ, thưa bậc Đại Mâu-ni (1 tiền lệ).
  - Kệ Yassa saddhā tathāgate (7.3–9.4) trùng cả kệ với sn55.26, sn55.51, an4.52,
    an5.47; chọn dạng đa số và đúng thứ tự Pāli: ariyakantaṁ pasaṁsitaṁ → được bậc
    Thánh yêu mến và tán thán (thứ tự kanta trước pasaṁsita; có 2 khoá kn dịch ngược
    thứ tự thành tán thán yêu mến, bài này không theo); Adaliddoti → không nghèo
    khó (3 khoá, so với 2 không thiếu, 1 không keo kiệt); amoghaṁ tassa jīvitaṁ →
    đời sống của người ấy không uổng phí (3 khoá đúng nguyên dạng, so với 2 không
    vô ích).
  - 11.1 Satasahassito kappe: 52 khoá trùng nhưng hai ngữ cảnh khác nhau. 47 khoá
    đứng trước một mệnh đề quá khứ (kiểu yaṁ chattamadadiṁ tadā) và dịch Vào một trăm
    ngàn đại kiếp trước (31), kiếp trước đây (9), kiếp trước (6), Kể từ ... trước (1)
    — đúng hướng quá khứ cho ngữ cảnh đó. 5 khoá cùng ngữ cảnh thọ ký với bài này
    (liền sau là okkākakul…, có bhavissati): 4 dịch hướng tương lai (Vào một trăm
    ngàn kiếp nữa 3, Sau một trăm ngàn kiếp nữa 1) và 1 dịch hướng quá khứ. Bài này
    dịch Sau một trăm ngàn kiếp nữa theo 4/5 khoá cùng ngữ cảnh: 11.1–11.4 là lời
    thọ ký (bhavissati, sẽ làm bậc Thầy) về Đức Gotama, đếm từ thời Đức Padumuttara
    thì là về sau chứ không phải trước. Đây là chỗ khác đa số thô (47/52) nhưng khớp
    đa số của đúng ngữ cảnh thọ ký (4/5). Khoá lệch hướng: xem lỗi ngoài lát.
  - Trong chính bài có 2 nhóm Pāli trùng nguyên văn: pabbajiṁ anagāriyaṁ (3.4 và
    19.4, cả hai là ta xuất gia sống đời không nhà) và ba khoá …pe… (27.2, 28.2,
    29.2, cả ba là … đúng một dấu lược); 0 cặp lệch. 28.3 và 29.3 chỉ khác nhau ở
    dấu đóng ngoặc kép nên không tính là trùng; bản Việt cũng chỉ khác ở đúng dấu đó.
  - 27.1, 28.1, 28.3, 29.1, 29.3 (công thức thần thông và lời kết) dùng nguyên dạng
    đa số của tầng (119, 114, 153, 538, 499 khoá), cùng dạng với thi-ap37.

  THUẬT NGỮ — kèm số đếm:
  - jina → Chiến Thắng (Đức Chiến Thắng tên Padumuttara: 16 khoá, so với 1 khoá Bậc
    Chiến Thắng tên là); nāyaka → Dẫn Đạo (133 trong 245 khoá có nāyak, so với Lãnh
    Đạo 25, Dẫn Dắt 11, Dẫn Lộ 7); vināyaka → Điều Ngự ở 10.4 và 17.4: trong tha-ap
    và thi-ap, 17 trong 33 khoá có vināyak dịch Điều Ngự (so với dẫn dắt 2, Điều Phục
    1, Hướng Đạo 1, đạo sư 1), gồm thi-ap29:2.2 cùng Phẩm; sugata → Đấng Thiện Thệ.
  - mahāvīra → Đại Anh Hùng (29 khoá, so với 13 khoá Đại Hùng trong toàn tầng);
    mahāmuni → Đại Mâu-ni (theo thi-ap37 và các khoá trùng).
  - saddhādhimutta → tín giải (an1.247 là bà mẹ của Siṅgālaka tối thắng về tín giải).
  - sotāpattiphala → quả Nhập Lưu: phạm vi gần nhất (tha-ap12:17.3) Nhập Lưu 1/1;
    ngoài tha-ap và thi-ap, các khoá có sotāpatti/sotāpanno dịch Dự lưu 105 khoá,
    Nhập Lưu/nhập lưu 135 khoá. Hai phạm vi cùng nghiêng về Nhập Lưu.
  - sikkhā (tisso sikkhā) → ba học pháp; paṇidhi → ước nguyện (tha-ap391 dịch động từ
    thành phát nguyện, thi-ap31 khéo ước nguyện); patthayitvāna → ước nguyện (khoá
    tha-ap taṁ ṭhānaṁ patthayiṁ ahaṁ → ta đã ước nguyện vị trí ấy).
  - seṭṭhikula → gia đình triệu phú (4/4 khoá, gồm thi-ap37); purakkhata → vây quanh
    (61 trong 125 khoá có purakkhat); pāramī → ba-la-mật (49 khoá, so với viên mãn 26 khoá trên các khoá
    pārami nói chung); tuṭṭho → hài lòng (17 khoá, so với hoan hỷ 9, vui mừng 5);
    sāvikā → nữ đệ tử (40 khoá, so với đệ tử nữ 3).
  - mahājana → đông đảo người (đông đảo 20, đại chúng 9); amacca → đại thần (mil5.1.4).
  - anussati → tùy niệm (an6.30:10.2 tùy niệm, 1 tiền lệ).
  - panāda → tiếng vang dội (tha-ap404:2.2 đã có tiếng vang dội; tha-ap296 tiếng vang
    lớn); vimhaya → sự kinh ngạc (0 tiền lệ), nên panādo vimhayo ahu dịch đã có tiếng
    vang dội và sự kinh ngạc.
  - Không có tiền lệ, dịch theo nghĩa Pāli: jātāmaccakule → sinh ra trong gia đình
    đại thần; Nānāratanapajjote → rực rỡ với nhiều loại châu báu; karuṇānugatāsayo → bậc
    có tâm ý thấm nhuần bi mẫn; disāpūjanatapparo → chuyên tâm lễ bái các phương;
    vipathe rato → ưa thích con đường lầm lạc; lālasā → khao khát; atittā → chưa thỏa
    mãn; nayananandana → làm vui đôi mắt; sabbasubhākiṇṇa → đầy mọi nét tốt đẹp;
    mahāratanasañcaye → với khối châu báu tích lũy lớn lao; paṭipattīhi → bằng những
    sự thực hành.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - 17.1–17.4: vajaṁ (piṇḍāya nagaraṁ vajaṁ) là phân từ số ít có thể đi với Đức Phật
    (đi vào thành khất thực) hoặc với taṁ (người đang lễ bái). Bản Việt đọc theo
    Đức Phật, vì chuyện kể là Ngài đi khất thực thấy Siṅgālaka; không thêm chủ ngữ
    nào ngoài Pāli, để 17.1 là người đang lễ lạy, 17.2 là khi đi vào thành để khất
    thực, 17.3 thấy người ấy, Đức Phật đã giáo huấn.
  - 10.3 anomo amito: anoma có thể là cao tột hoặc không thấp kém; dịch bậc cao cả, vô
    lượng. Trong tầng, Anomadassī dịch Bậc Vô Tỳ Nhiễm (3 khoá) hoặc để nguyên Pāli;
    ở đây anomo là tính từ chứ không phải tên Phật nên không theo.
  - 10.4 byākarittha: động từ vyākaroti nghĩa giải đáp, tuyên bố hay thọ ký; trong tha-ap
    và thi-ap tầng dịch giảng giải (6), tuyên bố (2), giải đáp (1), thọ ký (1). Vì nội dung theo sau (10.5–12.4)
    là lời báo trước tương lai nên chọn thọ ký.
  - 10.5 kalyāṇī: có thể là lời gọi người hiền (hô cách) hoặc tính từ của pasannā; dịch
    Này người hiền, không thêm hơn Pāli. 10.6 taṁ chỉ điều đã ước nguyện, dịch ngươi
    sẽ đạt được điều đã khéo ước nguyện ấy (cùng cách dịch ngươi cho lời Đức Phật của
    thi-ap31).
  - 12.3 Siṅgālakassa mātāti: ti đóng tên gọi; dịch được gọi là mẹ của Siṅgālaka, không
    thêm dấu nháy vì Pāli không có dấu nháy ở khoá này.
  - 13.2 yāvajīvaṁ tadā jinaṁ: dùng nguyên tiền lệ suốt đời, khi ấy, đối với bậc Chiến
    Thắng (1 tiền lệ); lời này đứng trước 13.3 ta đã phụng sự, nên đối với đọc là
    tân ngữ của phụng sự ở khoá sau.
  - 15.3–15.4 mahāratanasañcaye: sañcaya có thể là kho tích trữ hay sự tích lũy; dịch
    với khối châu báu tích lũy lớn lao.
  - 20.3 Anussatiṁ taṁ bhāvetvā: taṁ anussatiṁ không chỉ rõ đối tượng niệm; có thể là
    niệm Đức Phật (khoá 20.2 và 21.1 nói về việc thấy Đức Phật) hoặc niệm nói chung. Bản
    Việt giữ tùy niệm ấy, không thêm đối tượng.
  - 21.2 vajāmahaṁ: không có tân ngữ rõ; dịch ta luôn luôn đi đến, đối tượng suy từ
    mục đích dassanatthāya buddhassa ở 21.1.
  - 22.2 lakkhīnilayanaṁ varaṁ: lakkhī là phước vận hay sự may mắn (cũng là tên một nữ
    thần); dịch nơi trú ngụ tối thượng của phước vận, không quyết giữa hai cách hiểu.
    Đây là hapax: 0 tiền lệ ở tầng cho Lakkhīnilayana.
  - 6.1–6.2 Aggaṁ saddhādhimuttānaṁ assosiṁ bhikkhuniṁ tadā: aggaṁ có thể đi với
    bhikkhuniṁ (vị tối thắng) và tadā có thể đi với assosiṁ hoặc bhikkhuniṁ; bản Việt
