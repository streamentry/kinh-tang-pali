notes: |-
  **Phạm vi: đúng một khoá** (`cp1:1.1`) trong 46 khoá Pāli. Tôi dịch khoá được
  giao và **không** tự thêm 45 khoá còn lại.

  **Tiêu đề ghép cả bốn dòng tiêu đề** vì chúng chưa có bản Việt: `cp1:0.1` =
  *Cariyāpiṭaka*, `0.2` = *Akittivagga*, `0.3` = *Dānapāramī 1*, `0.4` =
  *Akitticariya*. Sujato (đã ghim) dịch bốn dòng này làm một cụm
  *The Conduct Leading to Buddhahood / The Chapter With Akitti / The Perfection of
  Giving (1st) / Akitti's Conduct*. Tôi ghép làm nhãn đầy đủ, theo cách `cp35` đã làm
  cho bài đầu tiên của tầng này.

  Câu này xuất hiện **17 lần** trong snapshot Pāli đã ghim. Trong tầng Việt
  đã có sẵn **hai** cách dịch khác nhau, nên đây là chỗ bắt buộc phải tra tiền lệ:
  *Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác.* (`pv1:1.1`, `ja1:1.1`,
  `thag1.1:1.0.2` — 3/5 cách đã có), *Kính lễ Đức Thế Tôn, …* (`kp1:1.1`) và
  *Kính lạ Đức Thế Tôn, …!* (`thig1.1:1.0`). Tôi dùng lại nguyên văn cách đa số.

  **Bất định đã ghi nhận, chưa có cách nào tuyệt đối:** `bhagavato` là
  *Bậc Đã Được Vinh Danh*, mà *Đức Thế Tôn* giữ nghĩa đó sát hơn *Đức Phật*. Tôi vẫn
  chọn *Đức Phật* vì đó là cách đã có sẵn 3/5 trong tầng và là lối đọc quen với người
  Việt; ở chính lát này tôi dùng *Đức Thế Tôn* cho `bhagavato` ở chuỗi `bhagavato
  vaṁso` (xem `notes` của các phẩm bv), vì đó là cách dùng quen thuộc cho các Đức
  Phật quá khứ. Biên tập có thể muốn thống nhất hai chỗ này.

  **Đối chiếu được tầng Anh.** Sujato có mặt ở **đúng khoá này**: *Homage to him, the
  blessed one, the perfected one, the fully awakened Buddha!* — nên `triangulation` ở
  mức cao của lát. Bản Việt tham khảo (Thích Minh Châu) không có `Cariyāpiṭaka` tại
  commit đã ghim. Cũng như các bài khác của lát, chỗ dễ nhất là chữ *Đức Phật* ở
  `bhagavato` (xem mục bất định ở trên) ⇒ `ambiguity_integrity` 9.3.
