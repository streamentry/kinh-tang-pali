notes: |-
  Đã đọc HẾT p66.txt trước khi viết. Bài nằm ngay đầu phẩm `Mahāparivāravagga`, ngay cạnh
  `sibling` tha-ap117/119 đã có bản Việt — dùng chúng làm khuôn cho phần đầu–cuối.
  
  MỆNH ĐỀ ĐO LẠI.
  `:0.1` giữ Pāli `Therāpadāna`: **322/331** tệp `tha-ap` (9 tệp dùng `Trưởng Lão Ký Sự`).
  `:0.3` có **3** hình, đo lại trên **331** tệp: `Bài Kệ Tuyên Ngợ Về Trưởng Lão ` **176**
  (158 không số thứ tự + 18 có `1.`…`10.`) / `Ký Sự Về Trưởng Lão ` **84** /
  `Bài Kệ Tuyên Ngôn Về Trưởng Lão ` **65**; ngoài ra 9 tệp dùng `Tuyên Ngợi`. Đa số là
  `Tuyên Ngợ`, nên dùng. `:0.2` `Mahāparivāravagga` → `Phẩm Mahāparivāra`: **3/3** bài
  cùng phẩm đã có (`tha-ap117`, `119`, `121`) dùng đúng câu này; `tha-ap113` là bài đầu
  phẩm nên trước đây chưa có tệp nào để đo trong chính phẩm. Trong `tha-ap` nói chung,
  **331/331** khoá `:0.2` đều theo hình `Phẩm …` (không bài nào giữ Pāli ở `:0.2`).
  `:12.1` theo hình `Xtherassāpadānaṁ <thứ tự>.` → `Bài Kệ Tuyên Ngợ Về Trưởng Lão X,
  thứ nhất.`
  
  TIỀN LỆ DÙNG LẠI (số đếm trên tầng `tha-ap` đã có).
  `“Vipassī nāma bhagavā,` → `“Đức Thế Tôn ấy tên là Vipassī,` (`tha-ap117:1.1`).
  `lokajeṭṭho narāsabho;` → `bậc Trưởng Thượng thế gian, đấng Nhân Ngưu;` (7).
  `āhutīnaṁ paṭiggahaṁ.` → `… xứng đáng đón nhận các phẩm vật cúng dường` (2).
  `Ekanavutito kappe,` → `Từ chín mươi chín kiếp trước,` (22, cùng nghĩa `tha-ap102`,
  `tha-ap117:7.1` dùng `Từ chín mươi chín kiếp trước`).
  `Duggatiṁ nābhijānāmi,` → `không biết mình rơi vào khổ đau` (**103** lần, đa số bất
  biến); bản nháp đầu để nguyên `không còn biết đến đọa xứ nào` (58) — đã đổi về đa số.
  `buddhapūjāyidaṁ phalaṁ.` → `đây là quả báo của việc cúng dường Đức Phật.` (25).
  `Sattaratanasampannā,` → `đầy đủ bảy món báu quý giá,` (15).
  `Paṭisambhidā catasso,` → `Bốn vô ngại giải,` (**337**).
  `vimokkhāpi ca aṭṭhime;` → `và tám giải thoát này;` (22).
  `Chaḷabhiññā sacchikatā,` → `Sáu thắng trí đã chứng đắc,` (23).
  `kataṁ buddhassa sāsanaṁ”.` → `đã làm tròn lời dạy của Đức Phật”.` (**304**).
  `Itthaṁ sudaṁ āyasmā X thero imā gāthāyo abhāsitthāti.` → `Tôi nghe như vầy: Tôn giả
  Trưởng lão X đã nói những bài kệ này.` (`tha-ap117:10.1`, `tha-ap119:10.1`).
  `Buddhassa ānubhāvena,` → `do oai lực của Đức Phật,` (2).
  `Saraṇañca upāgacchiṁ,` → `Và ta đã quy y nương tựa,` (1) — bỏ `Và ta`, giữ `và cũng
  quy y nương tựa,` để đồng nhất với ngôi `tôi` của cả bài.
  `mahesino` → `bậc Đại Ẩn Sĩ` (2, `tha-ap136`, `tha-ap146`).
  
  BẤT ĐỊNH ĐÃ GHI.
  (1) Trình tự `:1.3–1.4` và `:2.1–2.4` **ngược nhau**: `pāvisi bandhumaṁ` (đi vào lòng đất)
  đứng trước `Nagarā abhinikkhamma, agamaṁ dīpacetiyaṁ` (từ thành phố xuống đảo). Đây là
  đặc điểm có sẵn của kệ `Therāpadāna` — các bài ghép từ nhiều mảnh — nên tôi **không sắp
  xếp lại**, chỉ dịch đúng thứ tự Pāli. Người đọc có thể thấy điều gì đó nhảy ngược.
  (2) Chủ thể xuyên suốt `:2.3` → `:7.3` là ngôi `tôi`: người kể là một vị yêu quái từng
  thấy Vipassī (`yakkhā mayhaṁ upantike`, `:3.2`). Vì vậy `:4.2` `dussaṁ paggayhahaṁ tadā`
  tôi dịch **không chủ thể** (`khoác tấm áo lên mình;`) chứ không ghi `tôi` — Pāli không
  đánh dấu, và `:4.4` `tañcādāsiṁ mahesino` mới là chỗ chủ thể `mahesino` (Vipassī) nổi
  lên. Bản nháp đầu ghi `tôi mặc áo dụ bằng da;` — vừa thêm chủ thể vừa thêm `da` (Pāli
  `dussa` chỉ là vải/áo, không nói da) — đã bỏ cả hai.
  (3) `:9.1` `Ito pannarase kappe,` — đo được **5** tiền lệ: `Vào mười lăm kiếp trước,` (2),
  `Mười lăm kiếp về trước,` (2), `Từ đây vào kiếp thứ mười lăm,` (1). `Ito` = *từ đây*, hướng
  về phía trước, nên `trước` của hai bản kia là sai dấu; tôi theo bản thứ ba: `Từ đây, ở
  kiếp thứ mười lăm,`. Đề nghị người biên tập sửa luôn 2 bản kia.
  (4) `:9.2–9.4` — `soḷāsuṁ suvāhanā` là **tân ngữ** (16 vị đại đạo vương), còn
  `Sattaratanasampannā, cakkavattī mahabbalā` là **chủ ngữ** kể về người kể, vì `:10.x` tiếp
  đúng bằng thành tựu của chính người kể. Vì vậy tôi dịch `ta có mười sáu vị đại đạo vương,`
  rồi `… là Chuyển Luân Vương có đại oai lực.` (số ít). Tiền lệ 12 lần cho
  `cakkavattī mahabbalā.` là `là các Chuyển Luân Vương có đại oai lực.` (số nhiều) — không
  dùng được ở đây vì mâu thuẫn `:9.2`. Đã ghi vì đây là chỗ lệch tiền lệ có lý do.
  (5) `:8.2` `yaṁ kammamakariṁ tadā;` — tiền lệ đa số 9 lần là `khi ta làm thiện nghiệp ấy;`
  nhưng Pāli `kamma` trung tính, không có `sila`/`puñña` đi kèm. Thêm `thiện` là thêm
  chữ không có nguồn, nên tôi dịch `khi tôi làm nghiệp ấy;` và đổi `ta` → `tôi` cho khớp
  ngôi kể của cả bài (đa số chỗ khác dùng `tôi`). Cùng lý do, `tha-ap343:9.2` dùng y hệt.
  (6) `Aṭṭhasaṭṭhisahassehi` = 84 ngàn — cùng con số với `:3.1` `Cullāsītisahassāni`; 1
  tiền lệ cho `:3.1` là `tám mươi bốn ngần`, còn đây tôi dùng `tám mươi tư ngàn` (cùng
  số, khác cách viết). `yakkhā` dịch `yêu quái` (tiền lệ `yêu quái` 3 lần).
  (7) `:6.2` `abbhutaṁ lomahaṁsanaṁ;` — 5 bản Việt đã có đều **để trống** khoá này, 0 tiền
  lệ dùng được; dịch `thật là rợn da gà kinh khủng bố;` theo nghĩa `lomahaṁsana` (tóc
  dựng, ốc người). Bản nháp đầu ghi `lạnh sống rợn da gà` — `lạnh sống` không có trong Pāli
  — đã sửa.
  `technical_integrity` đặt 9.6 vì không có ai rà lại bằng con người.
