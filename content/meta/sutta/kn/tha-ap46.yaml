notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh cho `tha-ap46` ở commit đã ghim. Tầng `vietnamese-current` không phủ bài này (manifest chỉ có 26 tệp, toàn bộ là Pháp Cú).
  Đã đọc Pāli của bài trước khi viết chữ, và đọc hai bài kề cùng phẩm `tha-ap45` (chưa dịch) và `tha-ap47` (đã dịch) cùng hai bài cùng truyện `tha-ap531` (trái cây) và `tha-ap271` để bám công thức đã có.
  Số đo: tổng 32 khoá; Pāli ≥ 40 ký tự = 2 (`8.1`, `9.1`); `english-sujato` không có tệp ⇒ coverage đo được 0/2 = 0,0%, dưới ngưỡng 0,8. Mẫu số bằng 2 nên ở đây cổng ĐO ĐƯỢC và BÁO KHÔNG ĐẠT — khác hẳn pv23, bài có mẫu số 0.
  Tiền lệ đo được và đã dùng lại nguyên văn: `2.1` đa số 5×; `2.2` đa số 7×; `2.3` 1× (tha-ap435:1.3); `2.4` HÒA 2× với 2× (tha-ap121:3.4 và tha-ap271:2.4 dùng Ngài…, còn 2× dùng đã ngự…) — chọn dạng có kính từ Ngài vì chủ thể ở đây là Đức Phật; `3.4` đa số 2×; `4.1` đa số 35×; `4.3` 1× (tha-ap304:1.3); `5.1` đa số 13×; `5.2` HÒA 4× với 4× (khi tôi… / khi ta…) — chọn khi tôi vì chủ thể là người đàn ông tự kể; `5.3` đa số 118×; `5.4` 1× (tha-ap531:4.4); `6.3` đa số 25×; `6.4` đa số 29×; `7.1` đa số 364×; `7.2` `…pe…` ⇒ đúng một `…` theo 605×; `7.3` đa số 331×; `8.1` theo khuôn 422 khoá; `0.2` đa số 4×; `0.1` đa số 347×.
  Mọi số đếm trong tệp này là ảnh chụp lúc đo, và được đo SAU khi loại ba tệp của lát s3 (sn56.40, pv23, tha-ap46) khỏi tầng Việt, để không tự đếm phiếu cho chính mình; các agent khác vẫn đang ghi vào cùng tầng nên số có thể đã tăng.
  Bất định đã ghi. (1) `4.4` `vippasannena cetasā` hòa ba cách, mỗi cách 3× (với tâm hoan hỷ tịnh tín / với tâm thanh tịnh tinh khiết / với tâm ý chí thành thanh tịnh); chọn thanh tịnh tinh khiết vì sát nghĩa nhất, không thêm chữ nào không có trong Pāli. (2) `5.3` `Duggatiṁ nābhijānāmi` đa số đo được là 118× Ta không biết mình rơi vào khổ đau, nhưng `tha-ap531:4.3` — cùng truyện trái cây, đúng chỗ này — lại dùng Ta không còn biết đến đọa xứ (63× toàn kho); ta theo đa số 118× nhưng ghi rõ là có hai cách đang cùng tồn tại trong kho, người biên tập có thể chọn theo hướng đọa xứ cho cả cặp. (3) `5.1` Pāli chỉ có `kappe` chứ không có `mahākappe`, mà đa số 13× thêm chữ đại; ta theo đa số nhưng ghi rõ chỗ lệch này. (4) `4.2` `āmaṇḍaṁ pānīyañca ahaṁ` đọc thành ba món dâng: quả cây, nước uống, và bản thân; giữ nguyên chữ Pāli āmaṇḍa theo tha-ap531:3.4 và 4.4. (5) `1.2` `pabbatantare` có 18 tiền lệ chia nhiều cách; chọn ta sống giữa núi rừng vì chủ thể là người đã xuất gia, đúng nghĩa tha-ap87:1.4. (6) `6.1` `kappamhi` có 13 tiền lệ; dùng cùng dạng … trước, như `5.1`, để nhất quán trong bài.
  Tên riêng `Sanniṭṭhāpako` giữ nguyên chữ Pāli có dấu, theo khuôn 422 khoá của `Itthaṁ sudaṁ āyasmā … thero imā gāthāyo abhāsitthāti` và bài kề cùng phẩm tha-ap47. Chốt `lọt_pāli` của harness xét từng khoá nên ở `9.1` — vốn mang `Sanniṭṭhāpakattherassāpadānaṁ` — tên bị bắt; ta khai tên vào bộ nhớ tiến trình đúng như docstring của chốt đó dạy, với chứng cứ là Pāli của chính bài này ở `8.1`. KHÔNG sửa `_hvi.py`.
  0.3 và 9.1 theo khuôn bài kề cùng phẩm (tha-ap47:0.3 và 8.1). Khuôn tiêu đề và khuôn kết của tầng này rất phân tán (352 khoá mà 333 cách), nên không có đa số để theo; ta bám bài ngay cạnh trong cùng phẩm.
  Lượt review đối kháng tự làm bắt được 2 lỗi trong bản nháp: (1) `6.1` lúc đầu dùng dạng trước đây, lệch với `5.1` ngay trong bài, đã đổi cho nhất quán; (2) `3.2` lúc đầu dịch `nāmaka` thành vị được gọi là, lặp lại tên đã nêu ở `3.1`, đã đổi theo tha-ap463:1.2.
  `technical_integrity` chỉ 9,6 vì bị cấm chạy cổng: còn lại `npm run validate`, `npm test`, `npm run check`, `npm run build`.
