notes: |-
  Dịch trực tiếp từ Pāli root: tại commit đã ghim không có bản Anh Sujato, không có bản Việt hiện hành và không có lớp lấp English cho thi-ap40. Đối chiếu với tiền lệ của phẩm thi-ap và tha-ap trong tầng. Đủ 82/82 khoá, thứ tự khoá khớp Pāli, không có khoá ngoài Pāli.
  Dùng lại nguyên văn bản dịch đã có cho 30/38 khoá có Pāli trùng nguyên văn với tầng: `Therīapadāna` (13/14), `Phẩm Khattiya` (3/3), bốn khoá `:1.1–1.4` theo thi-ap37 (`Trong hiền kiếp này,` …), ba khoá của `:6` (`Nhờ nghiệp lành khéo làm ấy,` 21/23, `cùng với tâm nguyện và chí hướng;` 21/25, `sau khi từ bỏ thân người,` 11/15), `Sau khi đoạn tận mọi lậu hoặc,` (1/2), các khoá `:9.2–9.3`, `:10.2–10.4`, `:11.1–11.4` (theo thi-ap37 và thi-ap39), `Mọi phiền não của con đã bị thiêu rụi,` (5/145), `mọi cõi hữu đều đã được nhổ sạch;` (21/28), `Thật là đón mừng thù thắng thay cho con,` (5/139), `Ba minh đã chứng đắc,` (17/39), `Bốn vô ngại giải,` (476/490), `và tám giải thoát này;` (1/1), `Sáu thắng trí đã chứng đắc,` (57/68), `Tóm tắt phẩm này:` (33/149; xem dưới), `Và tóm lược các phẩm:` (11/12). Pāli trùng trong chính bài: 0 cặp, nên phép đối chiếu nội bộ chạy rỗng (không đo được gì, không phải 0 lỗi). Không có `…pe…` hay `(…)` trong Pāli của bài nên không có dấu lược nào ở bản Việt.
  Tám khoá có Pāli trùng mà Việt khác tiền lệ, đều có chủ ý: năm khoá chỉ khác ngôi (`ta`/`tôi` thành `con`: `:6.4`, `:8.4`, `:9.4`, `:10.1`, `:13.2`), hai khoá khác chủ ngữ hoặc từ ngữ (`:9.1` viết `Con là bậc làm chủ các thần thông,` theo `vasī homi` và thi-ap37; `:14.4` thêm chủ ngữ `con` cho đúng ngôi thứ nhất như thi-ap39) và `:12.3` (xem bất định 1). Ngôi `con`: đo trên 12 bài thi-ap có sẵn, `con` ở 6 bài (thi-ap2, 3, 4, 12, 13, 39), `tôi` ở 3 (thi-ap5, 6, 10), `ta` ở 3 (thi-ap7, 16, 37); chọn `con` theo đa số thi-ap và theo thi-ap39 (cùng phẩm, cùng các công thức `Mọi phiền não…`, `Thật là đón mừng…`). Pāli `mahāmune` ở `:9.4` là xưng hô với Đức Phật nên giữ `bạch bậc Đại Mâu-ni` như thi-ap37.
  Công thức `:12.4` `viharāmi anāsavā`: tiền lệ có 6 khoá viết kèm `đời thanh tịnh` (5 khoá `con sống đời thanh tịnh không còn lậu hoặc.`, 1 khoá `tôi`) và 4 khoá viết không kèm (3 khoá `ta sống không còn lậu hoặc.`, như thi-ap37, và 1 khoá `tôi`). Pāli không có từ nào ứng với `đời thanh tịnh` nên bản này viết `con sống không còn lậu hoặc.`; đây là chủ ý không đưa thêm nghĩa vào lời kinh.
  Tên bài (`:0.3`) theo quy tắc của phẩm: Pāli `:0.3` mở đầu bằng số (`10`) nên bản Việt giữ số, dạng `10. …`, và `translationTitle` bằng đúng giá trị `:0.3`. Dạng tên `Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni …` theo đa số phạm vi gần nhất: trong thi-ap, `Tuyên Ngợ` 12 · `Tuyên Ngôn` 1 · `Ký Sự` 0 (đếm trên `:0.3`, 13 bài; thêm 1 bài để nguyên Pāli); trong tha-ap, `Tuyên Ngợ` 240 · `Tuyên Ngôn` 118 · `Ký Sự` 101 · `Tuyên Ngợi` 10 · `Kinh Kệ` 5. `Tuyên Ngợ` vốn bị coi là sai chính tả so với `Tuyên Ngôn`, nhưng được giữ để đồng nhất với tầng, chờ biên tập phán một lượt cho cả cuốn. Dòng kết `:16.1` theo mẫu `…, thứ mười.`; `:16.2` theo mẫu `Phẩm … là phẩm thứ tư.` (catuttho, thi-ap10 `Phẩm Sumedhā là phẩm thứ nhất.`); lời kết `:15.1` theo công thức đa số `đã nói những bài kệ này` (Pāli `imā gāthāyo` là số nhiều). Dòng `:17.1` `Tassuddānaṁ`: phạm vi gần nhất (thi-ap) 1/1 là `Tóm tắt phẩm này:`, toàn tầng 76 `Tóm lược:` · 33 `Tóm tắt phẩm này:` · 19 `Tóm tắt phẩm`; chọn theo thi-ap10. `:24.1` `Apadānapāḷi samattā.` theo mẫu `Kinh văn Vimānavatthu đã hoàn tất.` (`niṭṭhitā`) và `Kinh Tập đã hết.` (`samattā`): 0 tiền lệ cho riêng tên này.
  Số Pāli, tự tính: `catuttho` = thứ tư; `dasamaṁ` = thứ mười; `catasso` = 4 ⇒ `Bốn vô ngại giải`; `tisso` = 3 ⇒ `Ba minh`; `Chaḷabhiññā` = 6 ⇒ `Sáu thắng trí`; `aṭṭhime` = aṭṭha 8 + ime ⇒ `tám giải thoát này`; `tā dasa` = 10 ⇒ `mười vị ấy` (đếm đủ trong `:18–19`: Khattiyā, Brāhmaṇī, Uppaladāyikā, Siṅgālamātā, Sukkā, Abhirūpā, Aḍḍhakāsikā, Puṇṇā, Ambapālī, Pesalā = 10); `dvisatānettha` = dvi 2 × sata 100 = 200 ⇒ `hai trăm bài kệ`; `dvicattālīsa` = dvi 2 + cattālīsa 40 = 42 ⇒ `bốn mươi hai bài`; `Sahassaṁ tisatā` = sahassa 1000 + ti 3 × sata 100 = 1.300 ⇒ `một ngàn ba trăm`; `sattatālīsa` = satta 7 + tālīsa 40 = 47 ⇒ `bốn mươi bảy`; `sattapaññāsa` = satta 7 + paññāsa 50 = 57 ⇒ `năm mươi bảy`; hai tổng chênh nhau đúng 10 (1.347 và 1.357), phù hợp với câu `Saha uddānagāthāhi` (cùng với các kệ tóm lược); không tự kiểm lại tổng này trên các bài khác của phẩm. Dùng `ngàn` theo đa số thi-ap/tha-ap. Không có cụm `Tiṁsakappasahassa` nào trong bài.
  Bất định, ghi rõ để biên tập phán:
  (1) `:12.3` `Nāgīva bandhanaṁ chetvā`: thi-ap31 dịch `Như cắt đứt sợi dây của con rắn,`, nhưng cùng công thức dạng giống đực `Nāgova bandhanaṁ chetvā` có 16 khoá trong tầng và 0 khoá dịch `rắn` (`thớt voi bẻ gãy mọi trói buộc` 11, còn lại dạng gần). `nāgī` là dạng giống cái (voi cái) nên viết `thớt voi cái`; thi-ap31 `:12.3` có vẻ là lỗi dịch nhưng nằm ngoài phạm vi bài này, chỉ báo chứ không sửa.
  (2) `:1.2` `brahmabandhu`: giữ `thân quyến của Phạm thiên` theo thi-ap37 (cùng Pāli, cùng đức Phật Kassapa); tầng còn có một khoá viết `thuộc họ Brāhmaṇa`, nghĩa chính xác chưa phân xử được, và không có bản Anh để đối chiếu.
  (3) `:2.1–2.4` cú pháp `Pasūtā taṁ jinavaraṁ, disvā sutvā ca desanaṁ`: hiểu `ahaṁ pasūtā` (con được sinh ra) đi với `upāsakakule`, rồi hai gerund `disvā sutvā` là việc kế đó; `taṁ jinavaraṁ` là bậc Chiến Thắng tối thượng là Đức Phật Kassapa (`:1.3`). Chưa có tiền lệ cho `upāsakakula` (0 khoá) nên dịch `gia đình cư sĩ`.
  (4) `:4.3–4.4` `Ananussutadhammesu pubbe dukkhādikesu ca`: hiểu là các pháp chưa từng được nghe trước đây, khởi đầu là khổ (tức bốn sự thật); `ca` không dịch riêng. Không có bản đối chiếu độc lập.
  (5) `:5.1–5.2` `Cakkhu ñāṇañca paññā ca, vijjāloko ca āsi me`: dịch sát từng thành tố `Nhãn, trí và tuệ, cùng minh và ánh sáng đã có nơi con`; `vijjāloko` hiểu là hai thành tố `vijjā` và `āloko`, còn có thể hiểu là `ánh sáng của minh`. Công thức này gần với danh sách nhãn, trí, tuệ, minh, ánh sáng đã khởi lên, nhưng bài không nêu trích dẫn ấy nên không thêm.
  (6) `:5.4` `paripucchiñca bhikkhavo`: `bhikkhavo` là dạng số nhiều không theo chuẩn cho tân ngữ (thay vì `bhikkhū`); hiểu là `con đã hỏi các tỳ-kheo`, theo tiền lệ `paripucchiṁ gaṇaṁ ahaṁ` (tôi hỏi đoàn thể ấy).
  (7) `:7.3–7.4` `Upecca buddhaṁ saddhammaṁ, Sutvā saccūpasaṁhitaṁ`: `saccūpasaṁhitaṁ` đồng cách với `saddhammaṁ`, hiểu là điều gắn liền với các sự thật; 0 tiền lệ cho từ này.
  (8) `:8.2` `saccatthāni vicintayaṁ`: `saccattha` là hợp từ hiếm, dịch `ý nghĩa của các sự thật`; còn có thể hiểu là `các nghĩa chân thật`. Không có tiền lệ (0 khoá).
  (9) `:11.4` `buddhaseṭṭhassa vāhasā`: giữ `nhờ vào bậc Phật tối thượng` theo thi-ap39, vốn đã ghi chưa phân xử được nghĩa chính xác của `vāhasā`.
  (10) `:7.2` `seṭṭhimahākule`: `đại gia đình triệu phú` theo thi-ap37 (`seṭṭhikulajā` ⇒ `gia đình triệu phú`); tầng còn dùng `trưởng giả` ở ud5.3, tha-ap80, tha-ap391, nên chưa có một dạng độc nhất.
  (11) `:18.1–22.4` Tên các vị trưởng lão ni và tên các phẩm trong dòng tóm tắt giữ nguyên Pāli, theo thi-ap10 (`Sumedhā, Mekhalādāyī`). `ekūposathā` giữ đúng dạng Pāli ở dòng này trong khi tên phẩm ở thi-ap12/13/16 là `Phẩm Ekūposathika`; chưa thống nhất, để biên tập phán.
  (12) `:21.4` và `:22.4` `piṇḍitā` hiểu là được cộng gộp; `vibhāvibhi` hiểu là các bậc trí (số nhiều, công cụ cách).
