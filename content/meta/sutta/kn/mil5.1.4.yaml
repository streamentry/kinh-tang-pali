notes: |-
  `Pathavicalanapañha`, câu hỏi thứ tư của `Iddhibalavagga` (`Meṇḍakapañha`); 68 khoá, tất cả đã dịch, đúng thứ tự Pāli, không khoá nào ngoài tập khoá Pāli. Cấu trúc: vua Milinda nêu thế lưỡng đầu (Thế Tôn dạy chỉ có tám nhân khiến động đất lớn xuất hiện, nhưng vua Vessantara đang đại thí thì đại địa rung chuyển bảy lần) ở `1.1`–`1.8`; Nāgasena đáp rằng việc ấy không theo thời, thỉnh thoảng mới phát sinh, nằm ngoài tám nhân, bằng ba ví dụ (ba loại mây, mười con sông, sáu đại thần) ở `2.1`–`5.7`; rồi dẫn bảy người có nghiệp cho cảm thọ an lạc ngay trong hiện tại và bốn người lên cõi trời bằng thân người (`6.1`–`7.4`); nêu rằng chưa từng nghe có ai khác khiến đại địa rung chuyển vì bố thí (`7.5`–`7.10`); giải thích bằng ví dụ cỗ xe quá tải và bầu trời nặng nước (`8.1`–`9.2`), nói về tâm Vessantara và bài kệ (`9.3`–`10.4`), mô tả cảnh gió, nước, biển, đại địa chuyển động (`11.1`–`11.2`), ví dụ nồi nấu gạo và ngọc báu của vua Chuyển luân (`12.1`–`12.6`); nhà vua tán thán (`13.1`–`13.2`).

  **Tầng tham khảo — đo, không đoán.** Bản Anh Sujato tại commit đã ghim không có `kn/mil` (thư mục `kn/` của edition chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud`); đây là `not-published-upstream`, không phải `not-synced`. Tầng `vietnamese-current` cũng vắng (26 tệp, toàn `dhp`), và lớp `english-project` không có uid này. **Coverage English: 0/47 khoá Pāli có nội dung** (mẫu số đếm theo ba cách — độ dài thô, gộp khoảng trắng, bỏ hết khoảng trắng — cho 47, 47 và 45; các khoá sát ngưỡng nằm ở nhóm rất ngắn nên không ảnh hưởng kết luận 0%). `reference-gaps.yaml` chưa có entry cho `mil5.1.4`; entry (47/47 thiếu English) là việc của người điều phối, và có entry cũng không cứu được `published`. Ba tầng vắng hết ⇒ `triangulation` đặt 7.5 (≤ 8.0), `status: draft` kèm blocker `noEnglishEditionUpstream`.

  **Năm phép kiểm.**
  (1) Tập khoá Việt = tập khoá Pāli: 68/68, cùng thứ tự.
  (2) Nháy đơn `‘ ’` và nháy kép `“ ”` khớp Pāli từng khoá: 68 khoá × 4 loại dấu, 0 lệch. Dấu nháy kép ngoài chạy qua ranh giới khoá và được giữ đúng như Pāli: của Milinda mở ở `1.1`, đóng ở `1.8`; của Nāgasena mở ở `2.1`, đóng ở `6.1`; lời đáp của nhà vua mở và đóng ở `6.2`, `6.4`, `7.2`, `7.4`; của Nāgasena mở ở `7.5`, đóng ở `7.6`; mở ở `7.8`, đóng ở `12.6`; của nhà vua mở ở `13.1`, đóng ở `13.2`. Nháy đơn: `1.2`, `2.2` (lời Thế Tôn), `7.8`, `7.9` (câu nhắc lại), `9.3`, `9.5` (ý nghĩ của Vessantara), `10.1`–`10.4` (bài kệ), `11.2` (lời kinh hãi của các loài).
  (3) Pāli trùng nguyên văn trong chính bài: 5 nhóm (`1.2` = `2.2`; `3.3` = `4.6` = `5.7`; `4.2` = `5.2` = `12.4`; `4.4` = `5.5`; `6.3` = `7.3`), bản Việt giống hệt nhau ở cả 5 nhóm, 0 cặp lệch. Một nhóm gần trùng cần đọc kỹ: `4.5` (`Na tā nadiyo dhuvasalilā`) và `5.6` không trùng Pāli nên Việt khác.
  (4) Dấu lược: Pāli 0 khoá có `…`, Việt 0 khoá có `…` — không có `…pe…` hay `(…)` nào để giữ. Phép này chạy rỗng, không phải "đạt".
  (5) Số Pāli: xem dưới.
  Thêm: NFC đạt, 0 khoá rỗng, 0 khoảng trắng thừa, không có Pāli lọt sang Việt ngoài tên riêng, tên ngọc và nhan đề; đã in cặp Pāli↔Việt từng khoá ra đọc đối kháng.

  **Số Pāli, tự tính.** `aṭṭha hetū aṭṭha paccayā` = 8 nhân, 8 duyên; `navamo` = thứ chín (`1.3`–`1.7`). `sattakkhattuṁ` = satta 7 + khattu → bảy lần (`1.5`–`1.7`, `2.3`, `3.3`, `4.6`, `5.7`, `12.6`). `tayo meghā` = ba loại mây, liệt kê đủ ba: `vassiko`, `hemantiko`, `pāvusako` (`3.1`). `pañca nadisatāni` = pañca 5 × sata 100 = 500 con sông; `daseva nadiyo` = 10 con sông, liệt kê đủ 10: Gaṅgā, Yamunā, Aciravatī, Sarabhū, Mahī, Sindhu, Sarassatī, Vetravatī, Vītaṁsā, Candabhāgā (`4.1`, `4.3`). `satampi dvisatampi tisatampi` = một trăm, hai trăm, ba trăm; `chayeva janā` = sáu người, liệt kê đủ sáu: senāpati, purohita, akkhadassa, bhaṇḍāgārika, chattaggāhaka, khaggaggāhaka (`5.1`, `5.3`). `satta janā` = bảy người, liệt kê đủ bảy: Sumana, Ekasāṭaka, Puṇṇa, Mallikā, Gopālamātā, Suppiyā, Puṇṇā (`6.2`, `6.4`). `caturo janā` = bốn người, liệt kê đủ bốn: Guttila, Sādhīna, Nimi, Mandhātā (`7.4`). `sakiṁ vā dvikkhattuṁ vā tikkhattuṁ vā` = một lần, hai lần hay ba lần (`7.6`, `7.8`, `7.9`). `dvinnaṁ buddhānaṁ` = hai vị Phật, Kassapa và Sakyamuni (`7.9`). `vassakoṭiyo` = số nhiều của koṭi năm, không có số cụ thể nên Việt dịch `hàng koṭi năm`, không quy ra con số (`7.9`). `dasasu ṭhānesu` = mười điểm, liệt kê đủ mười: dama, sama, khanti, saṁvara, yama, niyama, akkodha, avihiṁsā, sacca, soceyya (`9.4`). Chuỗi `na … hetu deti` ở `9.6` có 11 mục (bhavasampatti, dhana, paṭidāna, upalāpana, āyu, vaṇṇa, sukha, bala, yasa, putta, dhītu), Việt giữ đủ 11. Chuỗi `na … vasena pavattati` ở `9.3` có 8 mục (rāga, dosa, moha, māna, diṭṭhi, kilesa, vitakka, arati), Việt giữ đủ 8. `tayo` ở `12.2` = ba thứ (gió lớn, nước, đại địa). `yojanaṁ` = một do-tuần (`12.5`). Danh sách ngọc ở `12.5` có 14 tên, Việt giữ đủ 14. Không có cụm số nào chưa phân xử được.

  **Tiền lệ (đếm trên tầng vi hiện có, loại tệp này).** Pāli trùng nguyên văn với nơi khác trong tầng `mil`: đã dò 68 khoá, 11 khoá có Pāli trùng nguyên văn (`0.1`, `0.2`, `0.3`, `1.1`, `2.1`, `4.2`, `4.4`, `5.2`, `5.5`, `7.7`, `12.4`). Dùng lại đúng một dạng đã có ở 4 khoá: `0.1` `Milindapañha` (227 cặp trùng, 216 giữ nguyên Pāli) và `4.2`, `5.2`, `12.4` `Như sau đây —` (2 cặp trùng, cùng một dạng). Khác có chủ ý ở 7 khoá, dạng ứng viên nào cũng là đa số trong một phạm vi đã đo:
  `0.2` `Meṇḍakapañha` (42 cặp: Pāli nguyên 30, `Phẩm Meṇḍakapañha` 4, `Câu Hỏi Nan Đề` 4) và `0.3` `Iddhibalavagga` (4 cặp, cả 4 `Phẩm Iddhibala`): toàn `mil` thì đa số giữ Pāli (30/42) nhưng bốn bài anh em trong cùng phẩm (`mil5.1.5`, `5.1.7`, `5.1.9`, `5.1.10`) đều ghi `Phẩm …`; chọn phạm vi gần nhất, giữ đồng nhất trong phẩm.
  `1.1` (27 cặp: `Thưa ngài Nāgasena, điều này đã được Thế Tôn dạy:` 5, `Thưa Đại đức Nāgasena, …` 4, `Bạch ngài …` 3) và `2.1` (18 cặp: `Tâu đại vương, điều này đã được Thế Tôn dạy:` 7, đa số): chọn `Thưa Đại đức` theo bốn bài anh em, và `Tâu đại vương, điều này đã được Thế Tôn dạy:` theo đa số.
  `4.4`, `5.5` `Kiṁ kāraṇā?`: trong 2 cặp trùng nguyên văn bài khác là `Vì cớ sao?` và `Vì lý do gì?`; đo rộng hơn trên mọi khoá Pāli `Kiṁ kāraṇā` của tầng thì `Vì cớ gì?` 3, `Vì sao?` 3, `Vì lý do gì?` 1, `Vì cớ sao?` 1 ⇒ chọn `Vì cớ gì?`.
  `7.7` `Na hi, bhante` (58 cặp: `Không phải vậy, thưa tôn giả.` 40, `Không hề, bạch tôn giả.` 5, `Không phải vậy, thưa Đại đức.` 3): giữ dạng đa số `Không phải vậy` và đổi `tôn giả` thành `Đại đức` cho cùng giọng với `1.1` (3 cặp đã có đúng dạng này).
  Văn xưng đo ở phạm vi gần nhất: đầu lời `Bhante nāgasena` trong toàn `mil`: `Thưa tôn giả` 76, `Bạch ngài` 44, `Thưa Đại đức` 19, `Thưa ngài` 14, `Bạch tôn giả` 12; trong `mil5.1.*`: `Thưa Đại đức` 4, `Bạch ngài` 1. Chọn `Thưa Đại đức Nāgasena` theo phạm vi gần nhất. `mahārāja` → `tâu đại vương` (như `mil5.1.5`). Nhà vua tự xưng `trẫm` (`sampaṭicchāmā` → `trẫm xin chấp nhận`, theo `mil5.1.5`, `mil5.1.10`, `mil5.2.5`); Nāgasena tự xưng `tôi` (`mayāpi`), đo trên mọi khoá Pāli có `mayā`, `mama`, `amhākaṁ` của tầng thì `bần tăng` 0 khoá, `tôi` 391 khoá.

  **Thuật ngữ, theo bầy lân cận.** `bhūmicāla` → `động đất` (`dn16:3.11.4`, `3.12.7`, `3.13.1`, `3.13.4` cùng dịch `động đất lớn xuất hiện`; `ud6.1:15.2` có `đại địa chấn`); `hetu`/`paccaya` → `nhân`/`duyên` (theo `dn16:3.13.1`); `mahāpathavī` → `đại địa`, `pathavī` → `đất` ở nhan đề. `nippariyāya`/`asesa`/`nissesa`: tầng có hai lối ngược nhau (`mil5.5.1:4.8`, `mil5.5.2:4.5`: `không thiếu sót, không giới hạn, không suy diễn`; `mil5.1.7:1.4`: `thiếu sót, có lỗ hổng, lệch hướng` — đảo nghĩa vì câu đó phủ định); chọn dạng của `mil5.5.*` cho `asesa`, `nissesa` và `nippariyāya` → `không vòng vo`, vì cả ba đứng trong câu khẳng định. `yakkha` → `dạ-xoa` (theo `kp8:4.4`, `ud1.7:1.2`, `ud4.4:0.2`); `mahesakkha`/`appesakkha` → `oai lực lớn`/`ít oai lực` (theo `ud8.6:15.3`; tầng có 61 khoá Pāli chứa hai từ này). `asura` → `a-tu-la` (`iti93:5.3`). `Gaṅgā` → `sông Hằng` (như `mil5.1.5`); `Yamunā`, `Aciravatī`, `Sarabhū`, `Mahī` giữ nguyên Pāli theo `ud5.5`, `sn13.3` (tầng có `mil3.5.2:1.6` dịch Yamunā thành `sông Dăm`, nhưng chỉ một khoá và lệch với bốn khoá ngoài `mil`). `vessantara` giữ nguyên Pāli (tầng có `Phẩm Vessantara` ở bảy tệp `mil6.3.*`). `jinasāsana` → `giáo pháp của Đấng Chiến Thắng` (theo `mil5.1.7`). `pāramī` → `ba-la-mật` (theo `cp`). `kāmesanā`/`bhavesanā`/`brahmacariyesanā` → `sự tìm cầu dục`/`hữu`/`phạm hạnh` (`iti54`, `iti55`). `sabbaññutā` → `toàn tri` (`mil3.6.5:1.5`). `diṭṭhi` trong chuỗi phiền não → `kiến` (cạnh `tham, sân, si, mạn`). `bodhiyāyeva kāraṇā` → `duy chỉ vì mục đích giác ngộ mà thôi` (`cp16:12.4`, `cp17:6.4`). `hemantika` → `mùa đông`, `vassika` → `mùa mưa` (`mn75:10.6`). `chattaggāhaka` và `khaggaggāhaka` → `người giữ lọng`, `người giữ kiếm` (không có tiền lệ trong tầng).

  **Bất định đã phân xử — ghi ở đây, không thêm vào thân kinh.**
  1. `3.1` `pāvusaka` → `đầu mùa mưa`. Cả `vassika` lẫn `pāvusaka` đều thuộc mùa mưa; không có bản Anh đã ghim và tầng không có khoá tương đương (`sn22.101:6.7` dịch một `pāvusaka` khác ngữ cảnh là `mùa mưa`). `đầu mùa` dựa trên nghĩa của gốc `pāvussa`, nên người biên tập có thể đổi.
  2. `6.1`, `6.2` `katādhikāra` → `đã có công hạnh phụng sự`. Từ này có nghĩa gần với đã làm việc phụng sự, đã tích lũy công đức; tầng có 0 khoá tương đương và không có Anh để phân xử. `diṭṭhadhammasukhavedanīyakamma` → `nghiệp cho cảm thọ an lạc ngay trong hiện tại` (0 khoá tương đương trong tầng).
  3. `7.1`, `7.4` `tidasabhavana` → `cõi trời Tam Thập`. Tầng có `snp3.11:1.1` `chúng trời Tam Thập` cho `tidasagaṇa`, và `mil6.3.3:2.1` `cõi trời Tam giới` cho `tidasapura`; `tha-ap` dịch `tāvatiṁsa` thành `cõi trời Ba mươi ba`. Pāli ở đây là `tidasa`, nên tôi không đổi sang `Ba mươi ba`. `mil6.3.3:2.1` còn dịch `Tam giới` — một thuật ngữ khác nghĩa — và tôi không theo.
  4. `7.5` `Sucirampi kataṁ suyyati sukatadukkaṭanti?` → `Việc đã làm từ rất lâu, cả việc thiện đã làm lẫn việc ác đã làm, vẫn được nghe nói đến chăng?`. Pāli có thể hiểu `sukatadukkaṭaṁ` là điều được nghe nói (cách tôi chọn) hoặc là một chủ đề chuyển sang câu `7.6`; cú pháp mơ hồ, không có Anh đã ghim, tầng không có khoá tương đương.
  5. `12.5` danh sách ngọc (14 tên). Giữ nguyên Pāli cho những tên không nhận diện chắc được: `indanīla`, `mahānīla`, `jotirasa`, `ummāpuppha`, `sirīsapuppha`, `manohara`, `sūriyakanta`, `candakanta`, `khajjopanaka`, `phussarāga`, `masāragalla`; dịch `veḷuriya` → `lưu ly` (theo `ud5.5`), `vajira` → `kim cương`, `lohitaṅga` → `hồng ngọc` (theo `ud5.5` và `vv36:3.3`). `masāragalla` không dịch vì tầng có hai lối ngược nhau (`ud5.5`: `mắt mèo`; `vv78:3.3`: `đá quý masāragalla`; `vv36:3.3` đặt cạnh `san hô`). `cakkavattimaṇi` → `ngọc của vua Chuyển luân`.
  6. `11.2` `dānanissandabalava vīriyavipulavipphārena`: Pāli có khoảng trắng giữa `balava` và `vīriya`; tôi đọc là `bala` + `vīriya` (sức mạnh và tinh tấn) với `dānanissanda` (dòng tuôn chảy của bố thí) và `vipulavipphāra` (sự lan tỏa rộng lớn). Chủ ngữ của `onamanti unnamanti vinamanti` không nêu rõ (có thể là gió hoặc sóng); tôi chọn gió, vì chúng ở cùng chuỗi `vāyanti`. `uddhaṁsotapaṭisotamukhā` → `hướng lên và ngược dòng`, sát chữ; `kūṭaselasikhara` → `chóp, mỏm đá, đỉnh núi`. `garuḷa` và `nāga` giữ nguyên Pāli: tầng chỉ có 6 khoá chứa `garuḷ`, không khoá nào cùng ngữ cảnh, và `nāga` có `rắn thần` ở `kp8:4.3`; không có chuẩn chung để áp.
  7. `1.5` `Yasmā ca kho … natthañño navamo hetu …, tasmā anācikkhito bhagavatā`: cấu trúc lý lẽ của nhà vua (vì không có nhân thứ chín nên Thế Tôn không nêu; thế mà nhân thứ chín này lại thấy có) giữ sát chữ. `1.8` `ittarapañña` → `trí tuệ nhỏ kém` (0 tiền lệ); `andhakaraṇo` → `làm tối tăm mờ mịt`.
  8. `5.6` `Yuttattā rājaguṇehi` → `Vì họ gắn liền với các đức tính của vua`; `rājaguṇa` có thể là phẩm chất của vua hay bổn phận kèm theo chức vụ — Pāli không nói thêm. `5.3` `purohita` → `vị tư tế` (không phải `quốc sư`, để không thêm nghĩa), `akkhadassa` → `quan xét xử`.
  9. `9.3` `arati` → `chán ghét` (chọn nghĩa không hoan hỷ; `arati` còn có thể là buồn chán, bất mãn). `9.4` `niyama` → `giữ kỷ luật`, `yama` → `tự chế`; hai từ này gần nhau và không có khoá tương đương trong tầng. `9.6` `bhavasampatti` → `sự thành tựu về cõi sống`, `vaṇṇa` → `dung sắc` (có thể là danh tiếng), `upalāpana` → `lấy lòng`.
  10. `10.2` `patibbata` → `người vợ tận tụy với chồng`; `10.3` `cajamāno na cintesiṁ` → `khi xả bỏ, ta không bận tâm`. `7.8` `rājavasabha` → `bậc vua kiệt xuất` (nghĩa đen `con bò đực đầu đàn trong các vua`), `7.8` danh sách tám mục (`āgama`, `adhigama`, `pariyatti`, `savana`, `sikkhābala`, `sussūsā`, `paripucchā`, `ācariyupāsana`) không có khoá tương đương trong tầng; dịch sát chữ.
  11. `12.2` Pāli không có dấu ngắt giữa `vipulabalavīriyena` và `natthediso`; Việt tách thành hai câu. Pāli `sabhāvanissandena` → `dòng tuôn chảy tự nhiên`.
  12. `13.2` `vādagaṇṭhi` → `nút thắt luận thuyết`, `parāpavādakumbha` → `cái bình lời công kích của kẻ khác`, `nibbāhana` → `lối thoát`, `gaṇivarapavara` → `bậc tối thắng trong các vị đạo sư chúng hội`: các từ này không có khoá tương đương chính xác trong tầng (`mil5.1.7:9.1` và `mil6.2.6:1.7` dịch `gaṇivara…` theo hai cách khác nhau).

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này không chạy bốn lệnh đó — brief cấm chạy trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt 9.6 vì các phép kiểm tự động của lát đã xanh: tập khoá Việt khớp Pāli 68/68 và đúng thứ tự, nháy đơn và nháy kép khớp Pāli ở 68/68 khoá, NFC, không khoá rỗng, không Pāli lọt sang bản Việt ngoài danh xưng, 5 nhóm Pāli trùng nội bộ đều có Việt giống hệt; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.
