notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ja250.
  Đối chiếu văn cảnh tích truyện Jātaka và chú giải Atthakathā để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 25 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code), kiểm toán Jātaka chỉ có Pāli, đối chiếu
  Pāli đã ghim, PED, và tóm tắt Rouse trên SuttaCentral chỉ để hiểu bối cảnh): sửa 6 khoá trong phần
  tóm lược: oṭṭha ở đây là "môi" (khớp ja247), không phải "lạc đà"; tên các phẩm ở tóm lược phẩm lệch
  với tên phẩm của chính tầng (Santhava, Nataṁdaḷha là "Không Bền Chắc", Kalyāṇa là "Pháp Lành"). Phần
  kệ giữ. Còn lệch 8.1 "Nhóm Hai Bài Kệ" với 0.2 "Bộ Hai Bài Kinh", thuật ngữ chung chờ người biên
  tập.
