notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của harness gần như không kiểm gì ở bài này, nên tôi tự quét toàn bộ khoá từ đĩa.** Mọi vế kệ ngắn hơn 40 ký tự nên bộ lọc `substantivePaliMinChars: 40` trong `source/layers.yaml` không thấy segment nào; tôi đọc Pāli thật của từng khoá từ `.cache/upstream/suttacentral/` theo `sourcePath` trong catalog, đối chiếu tay với bản Việt, rồi quét máy: tập khoá Việt bằng đúng tập khoá Pāli (17/17, đúng exact ID, không orphan), mọi giá trị NFC và không rỗng, ngoặc kép cong cân trên cả bài, không có `(…)`, dấu lược khớp Pāli từng khoá.
  - |-
    **Không thể tuyên bố technical gate pass.** Đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tiêu chí 10 bị chặn ở 9.6: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, NFC, ngoặc kép cân cả bài và YAML sạch. Người biên tập phải chạy lại bốn lệnh trên trước khi đổi trạng thái.
  - |-
    **Lỗi chặn ở `1.1`.** Pāli có `hi` hai lần trong bài, ở `1.1` và `1.4`, và cả hai đều là *quả thật/thật sự là vậy*. Bản Việt xử lý `1.4` đúng (*ta đã thực hành điều ấy đã lâu*) nhưng ở `1.1` lại dựng `chẳng phải không`, theo sau bằng *không*, nên câu đọc ra là phủ định. Tôi hiểu ý người dịch là cố ý dùng kiểu *chẳng phải ... sao* của tiếng Việt để nhấn, nhưng câu như đang viết thiếu dấu hỏi ở cuối nên đọc thành phủ định thật. Ở đây đang nói về các kiếp trước trong địa ngục, nên đảo chiều là đảo cả ý kệ. **Tôi không sửa; cách sạch là bỏ hẳn *chẳng phải không* và để *Ta đã đi vào luân hồi, vào địa ngục*.**
  - |-
    **Ba lệch khác đã ghi.** (1) `1.3` `tiracchānayoniyaṁ` là *dòng sinh tử của loài súc vật*; bản Việt rút thành *dòng sinh tử đau khổ* nên mất *loài vật*. (2) `1.4` `vusitaṁ` là *đã cư ngụ*, bản Việt dịch *thực hành*, và câu lặp *ta đã thực hành điều ấy đã lâu, đã lâu rồi* — hai lần *đã lâu*. (3) `3.2` `pacalitā` là *đã nứt vỡ, đã tách rời*, bản Việt dịch *đã trưởng thành* — đổi chiều nghĩa. Riêng `(3)` đáng sửa; tôi để trong notes vì nó không đổi kết luận chung của khoảng, nhưng nó là dịch sai từ.
  - |-
    **Khoảng `2.3–2.4` chính xác và đầy đủ.** Bốn cõi được nêu đúng thứ tự Pāli: `rūpadhātusu` → *cõi có sắc*, `arūpadhātusu` → *cõi vô sắc*, `nevasaññisu` → *cõi không nhớ không quên*, `asaññisu` → *cõi không còn ý thức*. Đây là chỗ dễ dịch hụt, bản dịch không hụt.
  - |-
    **Tiêu đề hơi lệch cấu trúc so với các bài cùng lát nhưng đúng với Pāli.** `:0.4` `Gotamattheragāthā` dịch *Trưởng Lão Gotama* và `:3.5` `Gotamo thero` dịch *Tôn giả Trưởng lão Gotamo* — khác nhau ở dạng `-a`/`-o` và ở chữ *Tôn giả*, nhưng đúng vì Pāli cũng viết khác nhau. Chỗ này người đọc có thể thấy chênh nhẹ; tôi không coi là lỗi.
  - |-
    **Tầng Anh.** 12/13 khoá nội dung có prose Sujato, im lặng ở `3.5`. Ở `1.1` bản Anh dịch thẳng không phủ định, nên tầng Anh đã đủ để bắt lỗi này.
