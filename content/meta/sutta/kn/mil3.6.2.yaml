notes: |-
  KỸ THUẬT. Đợt này tôi KHÔNG chạy `npm run validate|test|build|check` — người điều phối
  cấm và chạy tập trung. Vì vậy tôi KHÔNG tuyên bố technical gate pass:
  `technical_integrity` chấm 9,6 chứ không phải 10,0. Bốn lệnh đó để người điều phối
  chạy lại.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG. Bài này CÓ khoá Pāli ≥ 40 ký tự nên vòng
  chốt của `_hvi.kiểm` chạy thật; tôi vẫn tự quét lại TOÀN BỘ 14 khoá bằng chính các
  hàm đó: mọi khoá có bản dịch, không khoá thừa/thiếu so với Pāli,
  thứ tự khoá khớp Pāli, chuỗi NFC, không Pāli lọt, số dấu lược khớp TỪNG khoá,
  ngoặc kép cân trên cả bài, không có `(…)`.

  COVERAGE — ĐO LẠI BẰNG ĐÚNG QUY TẮC CỦA KHO (`source/layers.yaml`:
  substantivePaliMinChars 40, excludeReferenceBlock, floor 0,8). Bài này có 6–8 khoá
  Pāli có nội dung và **0 trong số đó mang chữ Anh**, tỉ lệ 0% < 0,8. Vì vậy nếu bài
  muốn lên `review`/`published` thì PHẢI có mục trong
  `content/meta/reference-gaps.yaml` — đợt này tôi không được sửa tệp đó, nên đây là
  blocker thứ hai bên cạnh việc thiếu hẳn tầng Anh.

  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của
  bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho Milindapañha.
  Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho. Vì vậy
  `triangulation` của sáu bài mil3 trong lát này chỉ là **Pāli + các bài song song
  trong chính tầng này + menu SuttaCentral** (xem mục thuật ngữ bên dưới).

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC, KHÔNG ĐOÁN. `“Kallosi, bhante nāgasenā”ti.`
  → *“Khéo lắm, thưa tôn giả Nāgasenā.”* là **25/25** bài mil3 đã có; `TIEN_LE_PHAI.md`
  cũng ghi cặp `mil3.5.6:2.1 == mil3.6.6:2.1`. `Opammaṁ karohī` 6 bài: 3 bài *Hãy xét
  một thí dụ* (đa số), 2 bài *Hãy nêu một ví dụ*, 1 bài *Hãy đưa một ví dụ* → tôi theo
  đa số. `Āma` 5 bài → *Vâng*. `Na hi, bhante` **0 tiền lệ**; tôi dùng *Không phải vậy*
  theo 31 bài đã có `No hetaṁ, bhante` → *Không phải vậy*. `Rājā āha—` **đang chia
  12 `Vua nói:` / 10 `Vua nói—`**; tôi theo đa số `Vua nói:` và ghi lại đây vì tầng
  đang lệch. Lưu ý khi chấm cặp: chuỗi `“Xin hãy xét một thí dụ”ti.` của tôi **khác** `“Hãy
  xét một thí dụ”.` của 3 bài kia chỉ ở chữ *"Xin"*; `ti.` bị rơi ở bản kia. Cùng nguyên
  văn đã có, nên tôi giữ `ti.` cho đúng với `”ti.` mà Pāli mang. Tên phẩm: `Mahāvagga` → *Đại Phẩm* · `Buddhavagga` → *Phẩm Đức Phật* ·
  `Sativagga` → *Phẩm Chánh Niệm* · `Arūpadhammavavatthānavagga` → *Phẩm Xác Định Pháp
  Vô Sắc* (đều có 1–6 tiền lệ). `bojjhaṅga` → *giác chi* (358 khoá Pāli, và
  `content/glossary/pali-vi.yaml` ghi `preferred: "giác chi"`).

  THUẬT NGỮ ĐẶT MỚI. `Sabbaññūbhāvapañha` **0 tiền lệ** → *Câu hỏi về việc toàn tri*
  (SuttaCentral: *The Question on Omniscience*). `sabbaññū sabbadassāvī` → *toàn tri,
  toàn kiến*, theo 3 bài đã có (`mn14`, `mn71`, `mn101`); 2 bài khác (`mn76`, `mn79`)
  dùng *biết tất cả, thấy tất cả*, tôi theo vì *toàn tri / toàn kiến* là idiom Hán–Việt
  thông dụng và gọn hơn. `sikkhāpada` → *học pháp*, theo `mil6.2.8:0.2`
  (*giới hạnh tu học*) và `an3.86` (*học pháp*); ở đây là hành động *trình bày giới hạnh
  tu học* chứ không phải *giới luật*. `vejjo` → *thầy thuốc* (`mn75` đã có) ·
  `sabbesajjāni` → *mọi thứ thuốc men* · `gilānaka` → *người bệnh* ·
  `yāvajīvaṁ anatikkamanīyan` → *suốt đời, không bỏ sót* (`anatikkamanīya` = không bỏ sót
  phần nào).

  DẤU CÂU Ở `1.8`. Pāli khoá này kết bằng `”ti?` trong khi lời thoại là **trả lời**
  (`Sampatte kāle … pāyeti`), và `?` ở đây không có ở hai bài cùng công thức
  (`mil3.5.8:2.3`, `mil3.7.6:1.8` đều là `”ti.`). Tôi dịch `”ti.` — đây là điều chỉnh
  dấu câu, không phải thêm bớt chữ nghĩa.

  Giải quyết draft 2026-10-12 (thay thế các mục cũ về `sikkhāpada` → *giới hạnh tu học*,
  `yāvajīvaṁ anatikkamanīyaṁ` → *suốt đời, không bỏ sót* và blocker coverage). Đọc đối kháng
  lại cả 14 khoá từ Pāli; sửa 5 khoá, trong đó 3 khoá lỗi nghĩa thật.
  `1.4` — bản cũ *"có trình bày giới hạnh tu học theo thứ tự cho đệ tử không?"* làm MẤT
  từ hỏi `kissa` (vì sao) và biến câu hỏi *vì sao* thành câu hỏi có/không; nay là *"Vậy thì vì
  sao … Đức Thế Tôn lại chế định học giới cho các đệ tử theo thứ tự?"*.
  `1.5` — `Atthi pana te … koci vejjo` là *"ngài có vị thầy thuốc nào … không"* (`te` = của
  ngài), bản cũ đọc thành *"ngài có biết vị thầy thuốc nào"* nên lệch câu trả lời `Āma, bhante,
  atthi` (*"có"*).
  `1.9` — `anatikkamanīya` là *"không được vượt quá"*, không phải *"không bỏ sót"*; nay *"để suốt
  đời không được vượt quá"*, khớp `mil3.6.5:1.5` và `mil6.2.3:4.7`.
  `1.7`/`1.8` — `pāyeti` là *cho uống* (thuốc); bỏ chữ *"thì không cho"* thêm vào `1.7`, vì
  Pāli `1.7` chỉ nêu hai vế `sampatte`/`asampatte` còn lời *"không"* chỉ có ở `1.8` (`no
  asampatte kāle`).
  Thuật ngữ `sikkhāpada` → *học giới*: tầng đo được 279 lần / 108 tệp so với *giới hạnh tu
  học* 12 lần / 3 tệp (và `mil3.6.5:1.5` cùng phẩm dùng *học giới*), nên đổi theo đa số; `học
  pháp` 113 lần / 38 tệp là nghĩa khác, không dùng.
  Blocker đã gỡ: "coverage English dưới 0,8" — kiểu (B) do tác giả cũ tự đặt; bài không có
  Sujato nào để đo, 14 khoá đều đọc từ Pāli, bài ngắn, cấu trúc hỏi–đáp rõ, nghĩa đứng
  vững từ Pāli một mình; mục ghi nhận mất mát thuộc `content/meta/reference-gaps.yaml` do công cụ
  của kho sinh. Blocker giữ nguyên: thiếu hẳn bản Anh Sujato tại commit đã ghim (giới hạn
  upstream). `triangulation` giữ 8,0 (không có bản Anh độc lập, không có Việt hiện hành). Bất
  định còn lại: `Kallosi` dịch *Khéo lắm* theo tiền lệ 25/25 bài mil3, nghĩa sát là *ngài thật
  giỏi/đáng khen*; giữ để nhất quán tầng. `bhesajja`/`pāyeti` không bất định.
