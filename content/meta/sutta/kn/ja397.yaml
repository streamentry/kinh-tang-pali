notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja397 tại commit đã ghim, `vietnamese-current` tại commit đã ghim vắng với Jātaka.
  Dùng lại nguyên văn 3 khoá theo Pāli trùng nguyên văn: `:3.1` theo ja141:1.1 (Kẻ giao du với người xấu ác), `:3.2` theo sn11.1:5.2 (hưởng hạnh phúc vô tận), `:7.2` theo an3.26:4.2 (Gần gũi người ngang hàng không khi nào thụt lùi).
  Bất định đã xử lý và ghi lại: `haññate` ở `:1.3` là bị giết theo nghĩa gốc của ngữ cảnh, không nới thành bị hại; `Te kathaṁ nu karissanti` (`:1.1` và `:3.3`) có thể là họ nhắc tới cha mẹ hoặc là trạng ngữ thời gian, chọn cách đọc họ và giữ nguyên vẹn ở cả hai chỗ để bài không tự mâu thuẫn; `giriyassa` ở `:3.4` là bậc đáng kính, dịch theo nghĩa tôn kính chứ không dịch núi.
  Bản dịch này còn tự nhất quán trong bài: `Manojaṁ passa semānaṁ` lặp ở `:3.3` và `:4.3` dịch giống nhau; `Acchannaṁ samhi lohite` dịch là không giấu nổi, da thịt dính máu.
  Tên phẩm chưa chốt, 0 tiền lệ: Sattakanipāta → Bộ Bảy Bài Kệ, Kukkuvagga → Phẩm Kukku, xem kỹ ghi chú chung của lát này ở ja396.
