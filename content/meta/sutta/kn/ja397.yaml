notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja397 tại commit đã ghim, `vietnamese-current` tại commit đã ghim vắng với Jātaka.
  Dùng lại nguyên văn 3 khoá theo Pāli trùng nguyên văn: `:3.1` theo ja141:1.1 (Kẻ giao du với người xấu ác), `:3.2` theo sn11.1:5.2 (hưởng hạnh phúc vô tận), `:7.2` theo an3.26:4.2 (Gần gũi người ngang hàng không khi nào thụt lùi).
  Bất định đã xử lý và ghi lại: `haññate` ở `:1.3` là bị giết theo nghĩa gốc của ngữ cảnh, không nới thành bị hại; `Te kathaṁ nu karissanti` (`:1.1` và `:3.3`) có thể là họ nhắc tới cha mẹ hoặc là trạng ngữ thời gian, chọn cách đọc họ và giữ nguyên vẹn ở cả hai chỗ để bài không tự mâu thuẫn; `giriyassa` ở `:3.4` là bậc đáng kính, dịch theo nghĩa tôn kính chứ không dịch núi.
  Bản dịch này còn tự nhất quán trong bài: `Manojaṁ passa semānaṁ` lặp ở `:3.3` và `:4.3` dịch giống nhau; `Acchannaṁ samhi lohite` dịch là không giấu nổi, da thịt dính máu.
  Tên phẩm chưa chốt, 0 tiền lệ: Sattakanipāta → Bộ Bảy Bài Kệ, Kukkuvagga → Phẩm Kukku, xem kỹ ghi chú chung của lát này ở ja396.
  Cổng kỹ thuật chưa chạy vì agent dịch không được chạy lệnh npm. Coordinator chạy bốn lệnh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5, Claude Code), đọc lại đủ 33 khoá Pāli↔Việt; chỉ có Pāli
  đã ghim và PED. Sửa: `2.3`–`2.4` (`netādisā sakhā honti`: bạn bè không phải như thế này; `labbhā me
  jīvato sakhā`: ta còn sống thì bạn vẫn tìm được; bản cũ đảo thành “chỉ bản thân ta làm bạn”),
  `4.1`–`4.2` (`pāpasampavaṅkena … mātā puttena nandati` là người mẹ KHÔNG hoan hỷ vì đứa con gắn bó
  với điều ác; PED `sampavaṅka` = thân thiết, `pāpa-sampavaṅkatā` = thân cận kẻ xấu; bản cũ đảo thành
  “mẹ mới vui”), `5.1`–`5.4` (`pāpiyo ca nigacchati` = rồi đi đến chỗ tệ hơn; `yo … vacanaṁ na karoti
  atthadassinaṁ` = kẻ không làm theo lời những người thấy rõ lợi ích; bản cũ nói “không thấy được ý
  nghĩa”), `6.1`–`6.4` (`passuttamaṁ` = `passa` + `uttamaṁ`, mệnh lệnh “hãy nhìn bậc thượng”;
  `saravaraveganiddhutaṁ` = bị đà lao mũi tên hảo hạng quật ngã), `7.1`, `7.3` (`seṭṭhamupagamaṁ udeti
  khippaṁ` = đến gần bậc tối thắng thì mau vươn lên; bản cũ nói “kẻ nào lên tới tầng cao”), `1.3`
  (`haññate` là hiện tại bị động: đang bị giết). Giữ `3.1`–`3.4`: `giriyassa` là tên `Giriya` nên “lời
  khuyên của Giriya” đúng; đoạn ghi chú cũ cho `giriyassa` là bậc đáng kính, cho `Te kathaṁ nu
  karissanti`, `Acchannaṁ samhi lohite` dịch là “không giấu nổi” không còn đúng với chữ hiện hành.
  Khoảng 11/29 khoá có nội dung sai nghĩa trước khi sửa.
