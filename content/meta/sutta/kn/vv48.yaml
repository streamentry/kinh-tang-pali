  **Bản song song vv30 — đọc để đối chiếu, nhưng không dùng bản Việt của nó.**
  `vv30` (`2. Ucchudāyikāvimānavatthu`, `Pāricchattakavagga`) kể **cùng một câu chuyện**:
  đo được **43/51** khoá trùng nguyên văn, chỉ 8 khoá khác (0.3 tên phẩm; 0.4 và 12.1
  tiêu đề; 3.3 `sīlasaññamaṁ`/`sīlasaṁyamaṁ`; 3.4 `Kenupapannā`/`Kenūpapannā`;
  4.2 `amhāka`/`amhākaṁ`; 6.3 `Leḍḍuṁ`/`Pīṭhaṁ`; 11.3 `adāsiṁ`/`adāsi`). Vì vậy lý do
  nhân vật được soi kỹ từ Pāli vv30 chứ không đoán. Bản Việt vv30 (ghi lúc 12:29 ngày
  05-10, tức trong phiên này) **không** dùng làm tiền lệ vì có lỗi đo được:
  `2.2` để nguyên Pāli `Āveḷinī` lọt vào bản Việt và dịch `kañcanasannibhattace` thành
  *có tài lộc*; `6.3` `pahāraṁ adāsi me` thành *đánh rồi đưa cho tôi* (bỏ mất hành
  động đánh); `6.4` `Tato cutā kālakatāmhi devatā` thành *từ đó tôi qua đời, nay làm
  chư thiên* (bịa thêm phần sau); `8.3`/`10.3` `tidasehi` thành *A-tu-la* thay vì
  *Tam Thập Tam*; `10.4` `Sahassanetto` thành *trăm nghìn ngọn*. Kiểm tự mâu thuẫn
  trong chính vv30 bằng script: 0 cặp — lỗi nằm ở chỗ khác, không phải ở khoá lệch.

  **Câu 1.1–1.4 là kệ đối xứng, và tiếng Việt không giữ được điều đó.** Đọc xuôi cho
  một nghĩa, đọc ngược từng câu (bỏ dấu câu, ghép âm tiết cuối-cuối đầu) cho một
  nghĩa khác vẫn trọn vẹn. Bản dịch chỉ giữ nghĩa đọc xuôi; đây là mất mát do hình
  thức ngôn ngữ, không phải lỗi hiểu. Riêng `Brahmāva deve tidase sahindake`
  đọc như một danh sách xưng hô (`-va` = hậ tố), nên dịch *cùng Brahmā, cùng chư thiên,
  Tam Thập Tam cùng thần Indra* chứ không thành ẩn dụ.

  **Bốn chỗ crux, ghi thẳng ra chứ không bịa chỗ trống.**
  - `Sassu` (5.1, 5.2, 6.2) là trở ngại thật. Pāli đã ghim xác nhận `Sassu` = mặt trăng:
    `thig15.1:8.1` `Sassuyā sasurassa ca` và `thig15.1:18.2` `Sassu sasuro ca` (thần Trăng
    và thần Mặt Trời), `ja547:773.3` `Sassu suṇhāya pāhesi` (Trăng sai tin về Mặt Trời),
    `thi-ap23:6.3` `Sassuyā saha gantvāna`. Nhưng **ai là thần Trăng** thì Pāli không nói:
    5.2 hỏi *"Ucchu, kẻ giết người, ngươi đánh rơi thần Trăng ở đâu?"* ⇒ thần Trăng không
    phải Ucchu. Bản dịch giữ "thần Trăng" như một danh xưng và không kết luận ai, vì kết
    luận sẽ là bịa. (Cũng có tiền lệ đọc ngược lại: `vv30` dịch `Sassu` thành *chồng tôi*;
    không theo vì Pāli không nói chồng.)
  - `te ucchussa khaṇḍikaṁ` (4.3, 11.3) cho hai cách đọc mà tầng Việt đang chia làm:
    (a) `ucchu` là **tên riêng** ⇒ *cho ngài, Ucchu, một miếng nhỏ*; (b) `ucchu` là **mía** và
    `khaṇḍikaṁ` là miếng mía ⇒ *một khúc mía*. Chọn (a) vì 5.2 xưng hô `ucchuṁ` trực tiếp
    với người đang nói chuyện, và vv38:12.1 `Uḷāro ucchu pallaṅko` liệt kê `Ucchu` như
    một tên; tiền lệ (b) có ở `tha-ap437` (`Ucchukhaṇḍika` → *Cúng Dường Khúc Mía*) và ở bản
    vv30, nên chỗ này là còn tranh, đã ghi lại để người điều phối gộp.
  - `Mahāvipākā mama ucchudakkhiṇā` (9.2) và `Mahājutikā mama ucchudakkhiṇā` (10.2): hai
    danh từ ở cả hai dạng bất biến, còn thì tố `ucchudakkhiṇā` có thể là "đã dâng lên
    Ucchu" hoặc "món đã dâng cho Ucchu". Bản dịch giữ thứ tự bề mặt (*tôi đã dâng lên
    Ucchu, ...*) mà không chốt cách phân tích câu.
  - `Tato cutā kālakatāmhi devatā` (6.4): `devatā` ở thế cách gọi, nhưng người nghe
    (`Ucchu`) là nam theo cả `5.2` lẫn `11.3`. Dịch *này thiên thần* (đã có 16 tiền lệ
    trong tầng `kn`) để không khẳng định sai giới tính.

