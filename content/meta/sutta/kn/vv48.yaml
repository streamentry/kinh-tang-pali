notes: |-
  Dịch từ Pāli root (`vv48_root-pli-ms.json`), 51/51 khoá khớp `pre` = `vv48:`; bài viết
  trong `content/catalog/sutta/kn.json` với `sourcePath` có thật, không phải phải dò cache.

  **Cổng coverage của bài này KHÔNG đo được gì, và đó không phải "không cần ghi nhận".**
  Đo theo đúng công thức `source/layers.yaml` (Pāli ≥ 40 ký tự, loại block tham chiếu
  `:0`) thì vv48 có **0** segment trên tổng 51; khoá dài nhất là `5.3` và `5.4`, mỗi
  khoá 35 ký tự. Mẫu số bằng 0 nên `ratio` ra 1,0000 và ngưỡng 0.8 không hề bị vượt.
  Hai sự thật này khác nhau: "không có gì để đo" không phải "đã đo và không thiếu".

  **Tầng Anh vắng, nhưng có một dữ liệu Anh đã ghim duy nhất về bài này**: tầng tên
  `translation/en/sujato/name/sutta/vv-name_translation-en-sujato.json` tại cùng commit
  có `vv-name:53.vv48` = *Sugarcane Mansion*. Đây là tên của tầng `name/`, không phải
  bản dịch thân bài, nên dùng để hiểu nghĩa của tên `Ucchu` chứ không làm authority.

  **8 khoá dùng lại y nguyên văn bản Việt đã có** (đo bằng script: cùng Pāli *và* cùng
  chuỗi Việt với một bài khác) — `0.1` vv14/vv56 · `0.2` vv11/vv14 · `0.3` vv39/vv40 ·
  `2.4` vv40:1.4 · `3.5` vv36/vv38 · `3.6` vv36:6.4 · `7.1` và `8.1` vv82:8.1. Ba khoá
  `:0` theo đa số đo được; `2.4`, `3.5`, `3.6` là tiếng Việt đã có sẵn cho **đúng** Pāli
  này nên giữ nguyên để tầng không tự mâu thuẫn.

  **Bản song song vv30 — đọc để đối chiếu, nhưng không dùng bản Việt của nó.**
  `vv30` (`2. Ucchudāyikāvimānavatthu`, `Pāricchattakavagga`) kể **cùng một câu chuyện**:
  đo được **43/51** khoá trùng nguyên văn, chỉ 8 khoá khác (0.3 tên phẩm; 0.4 và 12.1
  tiêu đề; 3.3 `sīlasaññamaṁ`/`sīlasaṁyamaṁ`; 3.4 `Kenupapannā`/`Kenūpapannā`;
  4.2 `amhāka`/`amhākaṁ`; 6.3 `Leḍḍuṁ`/`Pīṭhaṁ`; 11.3 `adāsiṁ`/`adāsi`). Vì vậy lý do
  nhân vật được soi kỹ từ Pāli vv30 chứ không đoán. Bản Việt vv30 (ghi lúc 12:29 ngày
  05-10, tức trong phiên này) **không** dùng làm tiền lệ vì có lỗi đo được:
  `2.2` để nguyên Pāli `Āveḷinī` lọt vào bản Việt và dịch `kañcanasannibhattace` thành
  *có tài lộc*; `6.3` `pahāraṁ adāsi me` thành *đánh rồi đưa cho tôi* (bỏ mất hành
  động đánh); `6.4` `Tato cutā kālakatāmhi devatā` thành *từ đó tôi qua đời, nay làm
  chư thiên* (bịa thêm phần sau); `8.3`/`10.3` `tidasehi` thành *A-tu-la* thay vì
  *Tam Thập Tam*; `10.4` `Sahassanetto` thành *trăm nghìn ngọn*. Kiểm tự mâu thuẫn
  trong chính vv30 bằng script: 0 cặp — lỗi nằm ở chỗ khác, không phải ở khoá lệch.

  **Câu 1.1–1.4 là kệ đối xứng, và tiếng Việt không giữ được điều đó.** Đọc xuôi cho
  một nghĩa, đọc ngược từng câu (bỏ dấu câu, ghép âm tiết cuối-cuối đầu) cho một
  nghĩa khác vẫn trọn vẹn. Bản dịch chỉ giữ nghĩa đọc xuôi; đây là mất mát do hình
  thức ngôn ngữ, không phải lỗi hiểu. Riêng `Brahmāva deve tidase sahindake`
  đọc như một danh sách xưng hô (`-va` = hậ tố), nên dịch *cùng Brahmā, cùng chư thiên,
  Tam Thập Tam cùng thần Indra* chứ không thành ẩn dụ.

  **Bốn chỗ crux, ghi thẳng ra chứ không bịa chỗ trống.**
  - `Sassu` (5.1, 5.2, 6.2) là trở ngại thật. Pāli đã ghim xác nhận `Sassu` = mặt trăng:
    `thig15.1:8.1` `Sassuyā sasurassa ca` và `thig15.1:18.2` `Sassu sasuro ca` (thần Trăng
    và thần Mặt Trời), `ja547:773.3` `Sassu suṇhāya pāhesi` (Trăng sai tin về Mặt Trời),
    `thi-ap23:6.3` `Sassuyā saha gantvāna`. Nhưng **ai là thần Trăng** thì Pāli không nói:
    5.2 hỏi *"Ucchu, kẻ giết người, ngươi đánh rơi thần Trăng ở đâu?"* ⇒ thần Trăng không
    phải Ucchu. Bản dịch giữ "thần Trăng" như một danh xưng và không kết luận ai, vì kết
    luận sẽ là bịa. (Cũng có tiền lệ đọc ngược lại: `vv30` dịch `Sassu` thành *chồng tôi*;
    không theo vì Pāli không nói chồng.)
  - `te ucchussa khaṇḍikaṁ` (4.3, 11.3) cho hai cách đọc mà tầng Việt đang chia làm:
    (a) `ucchu` là **tên riêng** ⇒ *cho ngài, Ucchu, một miếng nhỏ*; (b) `ucchu` là **mía** và
    `khaṇḍikaṁ` là miếng mía ⇒ *một khúc mía*. Chọn (a) vì 5.2 xưng hô `ucchuṁ` trực tiếp
    với người đang nói chuyện, và vv38:12.1 `Uḷāro ucchu pallaṅko` liệt kê `Ucchu` như
    một tên; tiền lệ (b) có ở `tha-ap437` (`Ucchukhaṇḍika` → *Cúng Dường Khúc Mía*) và ở bản
    vv30, nên chỗ này là còn tranh, đã ghi lại để người điều phối gộp.
  - `Mahāvipākā mama ucchudakkhiṇā` (9.2) và `Mahājutikā mama ucchudakkhiṇā` (10.2): hai
    danh từ ở cả hai dạng bất biến, còn thì tố `ucchudakkhiṇā` có thể là "đã dâng lên
    Ucchu" hoặc "món đã dâng cho Ucchu". Bản dịch giữ thứ tự bề mặt (*tôi đã dâng lên
    Ucchu, ...*) mà không chốt cách phân tích câu.
  - `Tato cutā kālakatāmhi devatā` (6.4): `devatā` ở thế cách gọi, nhưng người nghe
    (`Ucchu`) là nam theo cả `5.2` lẫn `11.3`. Dịch *này thiên thần* (đã có 16 tiền lệ
    trong tầng `kn`) để không khẳng định sai giới tính.

  **Thuật ngữ, đều có số đếm.** `bhante` → *thưa tôn giả*: đo trên toàn tầng `kn` cho
  274 khoá, `bạch thầy` 0, `bạch Đài Ngữ` 2. `sadevaka` → *cùng chư thiên* (26 cặp Pāli↔Việt
  đã có). `candimasūriya` → *trăng và mặt trời* (`ja258:1.1`). `issariya` → *quyền uy*
  (`ja333:4.3` *quyền lực*). `pasannacitta` → *với tâm tịnh tín* (214 cặp). `kāmaguṇehi
  pañca` → *năm dục công đức* (vv56/57/59/77). `anappaka` → *vô tận* (15 cặp trong `kn`).
  `Leḍḍu` → *khối đất* (mil7.2.2 dịch cụm `leḍḍudaṇḍalaguḷamuggarehi` là *đất đống, que
  gỗ, bùi đất*). `Sahassanetto` → *kẻ có nghìn con mắt* (0 tiền lệ trong toàn tầng; từ
  `netto` = mắt, `sahas` = nghìn). `vane` → *rừng Nandana*, theo `vv40:2.4`.

  **Tên phẩm đặt theo đa số đo được.** `0.2` `Itthivimāna` → *Chuyện Cung Điện Nữ Hư Không*
  (31 bài) thay vì *Thiên Cung Của Nữ Giới* (1 bài, vv49). `0.3` `Mañjiṭṭhakavagga` →
  *Phẩm Mañjiṭṭhaka* 7/7 bài. `0.1` `Vimānavatthu` giữ nguyên Pāli như 55/56 bài vv đã có.
  `0.4` dịch tiêu đề theo 35/38 bài vv đã có. `12.1` theo dạng *Cung Điện X, thứ N* (12 bài).

  **Dấu lược và nháy kép.** vv48 **không** có khoá lược nào (`…pe…` 0, `…` trần 0), nên
  phép kiếm số 4 không có gì để bắt — khác với vv79 có 2 khoá `…pe…`. Nháy kép đúng như
  Pāli: mở ở `1.1`, đóng ở `3.6`, mở ở `4.1`, đóng ở `11.4`; `ngoặc()` báo cân. Nháy đơn
  `‘…’` lệch ở 0/51 khoá. Sáu cặp Pāli trùng nguyên văn trong bài (`7.1`=`8.1`,
  `7.2`=`8.2`, `7.3`=`9.3`, `7.4`=`9.4`, `8.3`=`10.3`, `9.1`=`10.1`) đã dịch **y hệt**;
  đo bằng script: 0 cặp trùng mà bản Việt khác.

  **Xưng hô thống nhất trong bài, và đây là chỗ phải sửa trong lúc review đối kháng.**
  Bản nháp đầu tiên dùng *ngài* ở 4.2, 4.3, 6.1, 11.3 nhưng *ngươi* ở 2.x, 3.x, 5.2 —
  hai cách xưng trong cùng một bài. Đã thống nhất về **ngươi** (7 lần, `ngài` 0 lần), vì
  `2.4` phải dùng y nguyên vv40:1.4 (*Ngươi là ai, nữ thiên xinh đẹp...*) và vv40:4.1 cũng
  dùng *ngươi* (*Khi ngươi đi khất thực*). Cùng lúc đó, ở review còn phát hiện `9.1`/`10.1`
  đã lỡ đưa *"lớn lao"* (thuộc `Mahāvipākā`/`Mahājutikā` ở 9.2 và 10.2) vào chỗ của
  `anappaka`; đã sửa thành *Quả báo phước báu thế này, vô tận,* và `3.3` đã bỏ *"nghiêm
  túc"* vì `saññama` là tự chế/giữ giới chứ không phải nghiêm túc.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`,
  `npm test`, `npm run check`, `npm run build`. Vì bốn lệnh ấy chưa chạy ở lát này,
  `technical_integrity` đặt 9,6 chứ không 10,0.

  **Lượt cải thiện 2026-10-11 (kiểm toán đối kháng; thay thế các đoạn cũ nói về `Sassu`, `Ucchu`, xưng hô, `anappaka`, `ucchudakkhiṇā`, đọc ngược `1.1–1.4` và 8 khoá dùng lại ở trên).**
  Đọc lại từng cặp Pāli↔Việt thì bản 2026-10-05 sai nghĩa thật ở khoảng 22/51 khoá và ghi nhận sai nhiều "sự kiện" trong notes. Đã sửa 45/51 khoá (phần lớn là hệ quả của cùng vài lỗi gốc); giữ nguyên ID, thứ tự khoá, dấu nháy khớp Pāli, 6 cặp Pāli trùng vẫn dịch y hệt (0 cặp lệch).
  - **Người nói và đối tượng.** `1.1–1.4` là lời vị tỳ-kheo nói *với* nữ thiên (`atirocasi` = ngôi hai), không phải "tôi đã soi sáng"; `1.4` là so sánh *như Phạm thiên giữa…*, không phải danh sách "cùng Brahmā, cùng chư thiên". `4.1–4.2`: `upāgami` là *ngài* (vị tỳ-kheo) đã đến nhà, không phải "tôi đến nhà ngươi"; nữ thiên xưng *ngài* với tôn giả, còn tỳ-kheo hỏi nữ thiên bằng *ngươi* (đúng `2.4`, y nguyên vv40:1.4). `11.1–11.2`: `vandiṁ`, `pucchisaṁ` là ngôi một: chính nữ thiên đến gần, đảnh lễ và hỏi, không phải tôn giả. Bản cũ ép "ngươi" cho cả hai chiều và ghi đó là "thống nhất"; đó là nguyên nhân đảo vai.
  - **`ucchu` là mía, không phải tên người.** `ucchussa khaṇḍikaṁ` = một khúc mía (4.3, 11.3); `ucchudakkhiṇā` = món cúng dường mía (9.2, 10.2), không phải "dâng lên Ucchu"; `5.2` `ucchuṁ` là tân ngữ của `avākiri` ("vứt mía ở đâu"), còn `vadhuke` là hô cách *con dâu*, không phải "kẻ giết người". Tên bài đổi theo: `0.4`/`12.1`/translationTitle *Cung Điện Mía* (Sujato tên tầng `name/`: *Sugarcane Mansion*). Căn cứ đếm được: `tha-ap437` dịch `Ucchukhaṇḍika` là *khúc mía*; `an1.315`, `an8.51`, `an10.104` dịch `ucchu` là *mía*.
  - **`sassu` là mẹ chồng, không phải thần Trăng.** Đối chiếu Pāli đã ghim: `vv29:6.1` `sassuyācikkhiṁ` và `vv29:7.1` `Itissā sassu paribhāsi` (cùng công thức, tiền lệ *mẹ chồng*), `ja489:4.1` `Bhattu mama sassu mātā`, `thig15.1:18.2` `Sassu sasuro ca` (*mẹ chồng và cha chồng*), cùng `sassu suṇhāya` (mẹ chồng – nàng dâu). Nhận định cũ "Sassu = mặt trăng" là sai, `vadhukā` (an4.73) là cô dâu. Do đó `5.1–5.2`, `6.2` đã sửa; `6.1` `Tuyhaṁ nvidaṁ issariyaṁ atho mama` là lời mẹ chồng hỏi *quyền làm chủ này của ngươi hay của ta?* (có `nu` nghi vấn), và `6.3` `Leḍḍuṁ gahetvā pahāraṁ adāsi me` là bà cầm cục đất đánh tôi (đánh = `pahāraṁ adāsi`, tiền lệ `mn21:9.39`, `ud4.4:4.1`).
  - **`6.4` `devatā`** là danh cách, thân phận của nữ thiên sau khi chết (`kālakatāmhi devatā` = tôi đã mệnh chung, nay là nữ thiên), không phải hô cách "này thiên thần" gọi người nghe.
  - **Thì và nghĩa nhỏ.** `anubhomi`, `paricārayāmahaṁ`, `modāmahaṁ` là hiện tại: sửa *sẽ tự thọ hưởng* (7.2/8.2) và *đã vui chơi/hân hoan* (7.3, 7.4, 9.3, 9.4). `tidasehi` là *chư thiên Tam Thập Tam* (17 khoá tầng dùng *Tam Thập Tam*), không phải "cùng Tam Thập Tam"; `devinda` → *Thiên Chủ* (tiền lệ vv37, vv47, vv64). `Brahmā` → *Phạm thiên* (202 khoá so với 2). `anappaka` → *không nhỏ* (11 khoá) thay *vô tận* (3 khoá; ghi "15 cặp" ở notes cũ không tái lập được). `suciṇṇa` → *khéo thực hành* (không phải "trong sạch"); `pucchitācikkha` → *được hỏi, hãy nói rõ* (vv24, pv10 cùng cách đọc, tiền lệ *này nữ thiên hãy nói lời hỏi* ở vv29/36/37/38 là sai ngữ pháp); `santassa bhikkhussa` → *tỳ-kheo an tịnh* (bản cũ "đáng kính" thêm nghĩa); `uppalamāladhārinī` → *người đeo tràng hoa sen* (bản cũ "áo cánh sen xanh"); `Āveḷinī` → *đội vòng hoa* (tiền lệ vv64:15.1); `kañcanasannibhattace` → *da sáng như vàng ròng* (17 khoá tầng); `devindaguttā … samappitā` → bỏ "đã" thừa; `Nandana` → *vườn* (9 khoá so với 2); `atulāya pītiyā` → *không gì sánh bằng*. `1.3` thay chuỗi vụn "rực rỡ hào quang, tôn vinh sắc tướng" bằng đúng bốn danh từ `siri, vaṇṇa, yasa, teja`.
  - **Lỗi họ vv còn lại nhưng không sửa riêng một tệp:** `0.2` `Itthivimāna` vẫn là *Nữ Hư Không* theo cả bộ (sai vì không có `ākāsa`, 31+ bài); `vv30` (bản song song) và `vv80:10.2` mang lại các lỗi trên (`Sassu` thành *chồng tôi*, `tidasa` thành *A-tu-la*, `sassu` v.v.); `vv29/36/37/38` có `3.5` kiểu *hãy nói lời hỏi*. Cần kiểm toán các bài này riêng; không tái dùng chúng làm tiền lệ.
  - **Bất định còn lại (giữ nguyên):** (1) `7.2/8.2` `Sukhañca kammaṁ anubhomi attanā`: `sukhañca kammaṁ` có thể là *hạnh phúc và nghiệp (quả)* hay *nghiệp lạc*; dịch tối thiểu *hạnh phúc của nghiệp ấy*. (2) `6.1` `issariya`: *quyền làm chủ/định đoạt*, không phân xử được hơn. (3) `4.1` `Idāni`: *vừa mới đây* (không rõ khoảng thời gian). (4) `5.2` `avākiri` có thể ngôi ba; chọn ngôi hai vì `vadhuke` hô cách. (5) `1.1–1.4` và `5.1–5.2` không có dấu nháy trong Pāli để đánh dấu đổi người nói; bản dịch phân biệt nhờ ngôi xưng, không thêm nháy.
  - **Điểm đổi (trước → sau):** semantic_fidelity 9.0 → 8.6, grammar_logic 9.0 → 8.8, segment_alignment 10 → 9.8 (đổi người nói không có dấu nháy), terminology 9.0 → 8.5, triangulation 7.5 → 7.0 (bản song song vv30 hoá ra không đáng tin để đối chiếu), vietnamese_clarity 9.2 → 8.8, han_viet_balance 9.3 → 9.0, ambiguity_integrity 8.5 → 8.3, source_provenance 9.5 và technical_integrity 9.6 giữ. `final_score` 9.06 → 8.79 (vùng `review`); điểm cũ là kết quả của bản dịch sai nghĩa ở khoảng 22/51 khoá, điểm mới chấm cho bản đã sửa.
  - Bốn lệnh cổng kỹ thuật chưa chạy trong lượt này: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 2 khoá bất đồng nghĩa → sửa 1 (`11.2`: *đảnh lễ và hỏi về điều thiện* → *đảnh lễ và hỏi thăm sự an lành*, vì `kusalañca pucchisaṁ` là công thức hỏi thăm an lành, cùng Pāli `sukhañca kusalaṁ pucchi` ở `snp5.1:6.3` và `cnd1:6.3` đã dịch *hỏi thăm về hạnh phúc và an lành*; bản nguyên bài cũng hiểu là hỏi thăm sức khoẻ), giữ 0, bất định 1 (`3.3` `sīlasaññamaṁ`: bản nguyên bài đọc thành một cụm *sự thu thúc giới hạnh*, bản này đọc hai vế *giới hạnh và sự chế ngự*; hợp từ Pāli đọc được cả hai cách, giữ). Phần còn lại khớp nghĩa với bản nguyên bài, gồm các điểm đã phân xử ở lượt trước: `sassu` là mẹ chồng, `ucchu` là mía, `upāgami` là ngài đã đến nhà, `6.4` `devatā` là danh cách chỉ thân phận nữ thiên, và `4.1` `Idāni` là vừa mới đây. Cùng lỗi `kusalañca pucchisaṁ` còn ở bài khác (`vv30:11.2`). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
