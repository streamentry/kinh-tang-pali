  **Blocker — loại "không có bản Anh upstream": viết lại cho đúng sự thật, không đổi bản dịch để né.** Blocker cũ nói là "chưa ghi nhận tầng tham khảo trong `content/meta/reference-gaps.yaml`" và lẫn lời về việc lát bị cấm sửa tệp đó; câu đó trộn một sự thật về upstream với một việc của người điều phối. Đã kiểm lại: thư mục `translation/en/sujato/sutta/kn/` của bản chụp đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud — không có `ne`, và `source/upstream-manifest.json` chỉ liệt kê `kn/ne/ne1_root-pli-ms.json` cho uid này; không có tệp Anh của dự án cho `ne1` ở `content/translation/en/` hay `content/meta/en/`. Vậy blocker đúng sự thật duy nhất là thiếu bản Anh upstream (`not-published-upstream`), nay là một blocker ngắn bắt đầu bằng `noEnglishEditionUpstream:`. Không có lỗi văn bản nào bị che trong chuỗi này: bài không còn blocker nào khác (không hapax chưa giải, không khoá thiếu, không bất định chưa phân xử khiến nghĩa sai).

