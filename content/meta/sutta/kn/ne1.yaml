notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Dùng lại nguyên văn đã `published`, có đối chiếu bằng đếm.** Pāli của khoá này là
  `Namo tassa Bhagavato Arahato Sammāsambuddhassa` — **giống hệt** Pāli của `ja1:1.1`
  (đã `published` với bản dịch *Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác.*)
  **và** giống hệt Pāli `ja521:1.1` mà tôi ghi cùng lát này. Ba bài dùng chung một câu
  Pāli thì phải dùng chung một câu Việt — lệch một chữ là bốn cột đối chiếu hiện sai
  âm thầm ở ba nơi.
  **Cơ sở của từng danh xưng:** `bhagavā` → *Đức Phật*; `arahā` → *A-la-hán*;
  `sammāsambuddho` → *Chánh Đẳng Giác*; `namo tassa` → *Kính lễ* (theo `an10.16:1.3`
  đã `published`; `sammāsambuddha` nằm trong danh sách giữ chữ Hán–Việt của `_hvi.py`).
  **`translationTitle` đặt theo cấu trúc tệp Pāli**: `0.1` = *Netti*, `0.2` = *1.
  Saṅgahavāra* — tức đây là **chương** đầu của một tập, không phải bài kinh độc lập; tôi
  ghi rõ *Tập Netti, Chương Một* để người đọc không tưởng là kinh riêng. `Netti` giữ
  nguyên vì đây là tên bộ kinh, đúng như `Theragāthā`/`Udāna` đã giữ trong tầng Việt.
  **Điểm `triangulation` 8,6 cao hơn 8,5 vì lý do thật:** có tiền lệ Việt dự án đã
  xuất bản nói đúng câu này. Vẫn **không** có Anh Sujato và **không** có bản Thích Minh
  Châu cho tầng này.
