notes: |-
  **Bài này.** `ne1` · tập Netti, `0.2` là `1. Saṅgahavāra` — tức đây là **phần đầu của một tập**, không phải bài kinh độc lập. Bài có 24 khoá Pā li; bản dịch phủ đủ 24/24.

  **Bốn tầng kệ mở đầu, và bản Pā li song song đã dùng làm đối chiếu.** `pe1` (Peṭakopadesa, `0.2` = `1. Ariyasaccappakāsanapaṭhamabhūmi`) mang **cùng bài uddāna gāthā** ở `10.1`–`10.4`: `Soḷasahārā nettī` / `Pañcanayā sāsanassa pariyeṭṭhi` / `Aṭṭhārasamūlapadā` / `Kaccāyanagottaniddiṭṭhā`. Đối chiếu trực tiếp giúp phân xử hai chỗ: `3.2` và `3.3` ở đây có Pā li giống hệt `pe1:10.2` và `pe1:10.3`, và `3.4` ở đây là `Mahakaccānena niddiṭṭhā` trong khi `pe1:10.4` là `Kaccāyanagottaniddiṭṭhā` — cùng một hành động chỉ dẫn. Chênh lệch về hình thức là do biến thể, tôi dịch theo đúng dạng của `ne1`.

  **Đo trước khi chọn.** Chỉ mục Pāli→Việt toàn tầng: 54 cặp Pā li giống hệt đã dò (không tính 4 tệp của lát), 28 cặp trùng về lời, 2 khoá khớp nguyên văn. Chỉ hai khoá có tiền lệ: `0.1` (19 bản, dùng lại nguyên văn) và `0.3` (9 bản trùng lời, dùng lại nguyên văn). **0 khoá nào trong `1.1`–`5.5` có Pā li trùng với bài khác** — 16 vế kệ này là độc nhất toàn kho Pā li đã ghim, nên không có tiền lệ nào để dựa vào và cũng không có chỗ nào để tự mâu thuẫn.

  **Thuật ngữ kỹ thuật — nhiều từ KHÔNG có tiền lệ, và tôi lấy từ chính lớp Netti đã dịch.**
  `hārā` → *phương thức*: có sẵn ở `ne2:1.1` *mười sáu phương thức*, `ne2:5.1`, `ne22:1.1`, `ne29:1.1` trong cùng tập.
  `byañjana` → *ngữ đồng nghĩa*: có sẵn ở `ne29:1.1`, `ne29:2.2`, `ne29:2.3` trong cùng tập.
  `attha` → *nghĩa*: có sẵn ở `ne33:2.3` *đó là nghĩa khác biệt*.
  `sāsanavara` → *giáo pháp cao thượng*: 7 bản đã có (`mil5.1.7`).
  `Mahākaccāyana` → giữ dạng Pā li, 11 bản đã có; trong chính lớp Netti dùng *Tôn giả Mahākaccāyana* (`ne8:10.2`, `ne11:7.4`, `ne12:5.10`, `ne16:11.5`, `ne35:4.1`).
  `naya`, `pariyeṭṭhi`, `mūlapada`, `suttattha`, `vicaya`, `navavidha suttanta`, `bhāṇavāra`, `saṅgahavāra`: **0 tiền lệ** trong tầng Việt. Tôi dịch theo nghĩa và ghi ở đây, không ghi vào thân kinh: *cách phân tích* cho `naya`, *nền tảng* cho `pariyeṭṭhi`, *mục gốc rễ* cho `mūlapada` (chữ *gốc rễ* có sẵn 34 bản trong tầng), *nghĩa chân nghĩa* cho `suttattho` (tương ứng *attha/byañjana* ở `2.2`–`2.4`), *tập hợp* cho `vicaya`, *chín loại kinh văn* cho `navavidha suttanta` (chữ *kinh văn* có sẵn ở `ne35:5.4` cho `suttanta`).

  **Bất định, đã ghi thay vì giấu.**
  `Saṅgahavāra`: 0 tiền lệ, và Pā li chỉ xuất hiện hai lần trong toàn tầng Netti — chính `0.2` và `5.5`. Tôi dịch *Phần Tụng Họp*, ghép từ nghĩa `saṅgaha` mà chính bài `ne2:10.3` và `ne2:11.2` dùng cho *quy tụ, tụ về* (`saṅgahaṁ samosaraṇaṁ`). Cách này chạy song song với tiền lệ `ne2` đã có: `2. Uddesavāra` → *2. Phần Tuyên Chúng*. Người biên tập có thể chọn cách khác nếu có bản Netti tiếng Việt để đối chiếu — tôi không bịa nghĩa để lấp.
  `Salokapālo`: 0 tiền lệ toàn tầng, vì đây là từ hiếm. Tôi dịch *bậc Trấn Giữ Thế Gian* theo nghĩa `pāla` (giữ gìn). Tôi **không** mượn *Bảo Hộ Thế Gian* của `tha-ap102:2.2` vì Pā li ở đó là `lokanāthassa` — một từ khác; mượn sẽ làm phẳng một phân biệt.
  `naravarassa`: `naravara` là *tối thượng giữa loài người*, cũng là một danh xưng của Đức Phật. Trong câu này tôi dịch *loài người*, vì hành động *làm cho hiểu rõ* hướng tới người đọc chứ không hướng tới Đức Phật; nếu đọc theo nghĩa danh xưng thì câu sẽ vô nghĩa. Ghi ra vì đây là chỗ dễ tranh.
  `5.1`–`5.4`: `yā ceva … yañca … ubhayameva` là hai vế song song; `tatrāyaṁ` là *trong ba điều ấy*, ám chỉ ba điều của `2.1`–`2.4`. Tôi không giải thích điều đó trong thân kinh.

  **Tiêu đề.** `0.2` giữ số theo Pā li, đúng như `ne2` đã có (`2. Phần Tuyên Chúng`). `translationTitle` đo ở phạm vi gần nhất: trong 20 tệp `ne*.yaml`, 18 tệp đặt tiêu đề *Nhóm …* hoặc *Phần …* không kèm số, và duy nhất `ne1` (chính tệp này, trước khi sửa) dùng *Tập Netti, Chương Một: Saṅgahavāra*. Tôi theo số đông và sửa thành *Phần Tụng Họp*, để tiêu đề khớp `0.2`.

  **Năm phép kiếm, số do script in ra.**
  (1) set(khoá Việt) == set(khoá Pā li): thiếu 0, thừa 0. Có 23/24 khoá Pā li ngắn hơn 40 ký tự — với bài này đó là gần hết, nên chốt `_hvi.py` sẽ chạy rỗng và báo pass trong khi không đo được gì.
  (2) `“”` và `‘’` so từng khoá: 24 khoá đã so, 0 khoá lệch; ngoặc kép Pā li 0 / Việt 0; nháy đơn Pā li 0 / Việt 0. **Pā li của `ne1` không có ngoặc kép nào**, nên bản dịch cũng không thêm — khối kệ đứng trần.
  (3) Pā li trùng trong chính bài: 0 cặp, Việt khác 0 cặp.
  (4) Dấu lược: `…pe…` 0, `…` trần 0; bản dịch có 0 dấu `…`; lệch 0. Pā li không có lược nào thì bản dịch không có — 16 vế kệ viết đủ, không nén.
  (5) NFC / khoá rỗng / ký tự Pā li lọt: 0 vấn đề.

  **Vì sao `draft`, và vì sao đây là BLOCKER thật, không phải hạ nốt điểm.** Tại commit 11c9d708978cde8ba61096d8a75f7ddfb846f639 thư mục con `sutta/kn/` của tầng `english-sujato` không có `ne` ⇒ 0 tệp Anh; `vietnamese-current` chỉ có 26 tệp, toàn bộ Pháp Cú ⇒ không có bản Thích Minh Châu cho tầng này; `english-project` không có tệp cho `ne1`. Mẫu số coverage = 1 khoá Pā li ≥ 40 ký tự (bỏ `:0`), Sujato phủ 0/1. Vấn đề là `content/meta/reference-gaps.yaml` **có** entry cho `ne2`, `ne8`, `ne11`, `ne12`, `ne16`, `ne22`, `ne23`, `ne25`, `ne26`, `ne31`, `ne33`, `ne35` — **12 bài `ne*`** — nhưng **không có** `ne1`. Mà `ne1` có 1 khoá Pā li có nội dung và 0 khoá Anh, tức đúng tiêu chí mà 12 kia được ghi. Theo `AGENTS.md`, bài `review`/`published` có coverage dưới ngưỡng mà chưa có entry thì là lỗi chặn; lát này bị cấm sửa tệp đó, nên tôi đặt `draft` và ghi lý do vào `blocking_errors`, **không** tự nâng điểm để né. `final_score` = 9.29 vẫn được chấm đầy đủ và trung thực, nhưng blocker thắng điểm.

  **Ngoài ra: mẫu số coverage của bài này là 1.** Ngưỡng 40 ký tự của cổng chỉ đo được một khoá Pā li có nội dung, tức mẫu số bằng 1 — nhỏ tới mức phép đo gần như không có lực. Điều đó **không** phải tín hiệu đạt; nó là phép đo không đủ thông tin. Tôi vẫn dịch đủ 24/24 khoá và dùng phép so khoá đầy đủ của mình để thay thế.

  **Cổng kỹ thuật KHÔNG chạy được — lát này bị cấm.** `technical_integrity` = 9,6. Bốn lệnh còn lại: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  **Giải quyết draft 2026-10-12 (đọc lại đối kháng từ Pāli; mục này thay thế các đoạn cũ về dịch `hārā`/`byañjana`/`naya`/`pariyeṭṭhi`/`naravara`/`Salokapālo`/`Saṅgahavāra` và tiêu đề ở trên).**

  **Blocker còn lại — loại "không có bản Anh upstream": GIỮ NGUYÊN.** Tại commit đã ghim không có tệp Anh Sujato cho `ne1`; đây là sự thật về upstream chứ không phải lỗi văn bản, và không thể gỡ bằng việc sửa bản dịch. Bài vẫn là `draft` cho tới khi người biên tập xử lý ở cấp waiver.

  **Lỗi nghĩa thật trong bản cũ — 17/24 khoá sai nghĩa hoặc đảo cú pháp (`1.1`–`1.4`, `2.1`–`2.4`, `3.2`, `3.3`, `4.1`, `4.2`, `4.4`, `5.1`–`5.4`); 5 khoá chỉnh thuật ngữ/khuôn cho thống nhất (`0.2`, `3.1`, `3.4`, `4.3` giữ nghĩa, `5.5`); 2 khoá giữ nguyên (`0.1`, `0.3`). Chia loại.**
  (1) Đảo cú pháp ở `1.1`–`1.4`: bản cũ đọc `ñeyyaṁ` thành mệnh lệnh *"hãy học lấy… hãy làm cho điều cần hiểu được rõ ràng với loài người"*, trong khi Pāli là một câu duy nhất: `yaṁ` (quan hệ, thuộc `naravara`, đối ứng `tassa … naravarassa`) — thế gian tôn kính, thế gian cùng các vị hộ thế luôn kính lễ — *giáo pháp cao thượng này là của vị ấy*, và đó là điều `vidūhi ñeyyaṁ` (bậc trí cần biết; `vidūhi` là cách công cụ số nhiều). Không có mệnh lệnh nào, và `naravarassa` là sở hữu cách của *bậc tối thượng giữa loài người* (Đức Phật), không phải "đối với loài người". `salokapālo` = *thế gian cùng các vị hộ thế* (`lokapāla` ở nơi khác trong tầng: `ja194:1.2` *vị thần hộ thế*, `mil2:71.7` *các vị hộ thế*), không phải *bậc Trấn Giữ Thế Gian* (một danh xưng cho một người, không có trong Pāli). Đổi *thế giới* thành *thế gian* theo cách dùng chung của tầng.
  (2) `2.1`: `dvādasa padāni suttaṁ` không phải *"bộ kinh mười hai câu kệ"* (không có chữ kệ); là *kinh gồm mười hai mục* — mười hai `pada` này chính là sáu mục câu chữ + sáu mục nghĩa được liệt kê ở `ne3:24`–`ne3:25`, mà `ne3:24.0` đặt tên *Mười Hai Mục*. `2.2`: `byañjana` = *câu chữ* (`ne3:24.1`, `ne3:24.4`, `ne3:27.2`; `ne5:54` *văn từ*), không phải *ngữ đồng nghĩa* — bản cũ mượn sai từ `ne29`. `2.3` bản cũ *"hãy học lấy cả hai"* thành mệnh lệnh; Pāli `viññeyyaṁ` là *cần được hiểu rõ*. `2.4`: `katamaṁ` bản cũ thành *là những gì* — nay *nghĩa là gì, câu chữ là cái nào?*.
  (3) `3.1`–`3.4`: Pāli giống hệt `pe1:10.1`–`pe1:10.3` (đã đo, 3/3 cặp khớp từng chữ) nên dùng lại nguyên văn cách dịch của `pe1`: *Netti có mười sáu phương thức / năm lối là sự tìm hiểu giáo pháp / mười tám nền tảng gốc*. Bản cũ *"năm cách phân tích làm nền tảng của giáo pháp"* đọc `pariyeṭṭhi` (tìm hiểu, tầm cầu) thành *nền tảng* — sai nghĩa, lại mâu thuẫn với `pe1:10.2`; *mười tám mục gốc rễ* lệch với *nền tảng gốc* của `ne2:10.1`/`ne2:14.3`. `3.4` bỏ *Tôn giả* (không có `āyasmā` trong Pāli) và dùng *chỉ ra* theo `pe1:10.4`/`niddiṭṭhā`.
  (4) `4.1`–`4.4`: bản cũ *"Tập hợp các phương thức ngữ đồng nghĩa"* đọc `vicaya` (khảo xét, tra xét: `ne3:3.3`, `ne5:1.2`) thành *tập hợp*; *"nghĩa chân nghĩa"* cho `suttattho` là chữ lặp vô nghĩa; `yathāsuttaṁ` bản cũ *"đúng như kinh"* mơ hồ — nay *đúng theo kinh* (`pe5:35.5` *đúng như trong kinh*). `4.3` giữ *đã được nắm giữ* (`pariggahītaṁ`).
  (5) `5.1`–`5.4`: bản cũ *"trong ba điều ấy có thứ tự tiến dần… sự trình tự theo chín loại kinh văn"* thêm *ba điều* (không có số ba trong Pāli, `tatra` = *ở đây*), và đọc `pariyeṭṭhi` thành *sự trình tự*; và 5.2 *"hãy học lấy cả hai"* lại là mệnh lệnh. Nay: *lời thuyết giảng nào, và điều nào / được thuyết giảng — cả hai đều cần được hiểu rõ; ở đây, đây là thứ tự: sự tìm hiểu chín loại kinh* (`navavidhaṁ suttaṁ` → *chín loại kinh*, `pe1:79.1`, `ne37:3.1`).
  (6) `0.2` / `5.5` / `translationTitle`: `saṅgahavāra` bản cũ *Phần Tụng Họp* — *tụng* là nghĩa của `saṅgīti`, không phải `saṅgaha` (tổng hợp, tóm gọn). Chọn *Phần Tổng Quát*; khoá `5.5` theo đúng khuôn của `ne2:14.5` *Hết phần Tuyên Chúng* và `ne3:27.5` *Hết phần Chỉ Rõ* (2/2 tiền lệ liền kề dùng *Hết phần …*). Đây vẫn là chọn lựa của người dịch cho một từ không có tiền lệ (0 bản khác trong tầng).
  Khoá giữ nguyên: `0.1`, `0.3` (vẫn dùng lại nguyên văn như đã ghi ở trên).

  **Đối chiếu bài song song (tầng tham khảo thực dùng ở đây).** Không có bản Anh độc lập nào cho bài này; tầng tham khảo duy nhất là chính tầng Pāli của `pe1:10.1`–`10.4` (cùng bài uddāna) và các định nghĩa nội bộ của Netti ở `ne3:24`–`27`, `ne5:54`. Vì thế `triangulation` chấm 7,5 (dưới trần 8,0).

  **Bất định còn lại (ghi, không đưa vào thân kinh).**
  - `4.1`–`4.2`: ngữ pháp Pāli cho phép đọc `hārā byañjanavicayo` là hai mục liệt kê (các phương thức; sự khảo xét câu chữ) hoặc một vị ngữ (*các phương thức là sự khảo xét câu chữ*). Chọn vị ngữ vì `ubhayaṁ` (4.3) chỉ cặp **hai** — vế câu chữ (`4.1`) và vế nghĩa (`4.2`: ba lối + nghĩa kinh) — và vì `ne3:26` cũng gắn *ba lối* với *nghĩa*. Nếu người biên tập đọc khác, chỉ `4.1` đổi.
  - `1.1`: `yaṁ` có thể là trung tính (tiên đề là `sāsana`) hoặc nam tính (tiên đề là `naravara`). Chọn nam tính vì `tassa … naravarassa` cùng là sở hữu cách ở `1.3`–`1.4`, nên *giáo pháp là của vị ấy*; nếu đọc trung tính, `tassa` sẽ thừa.
  - `5.3`–`5.4`: `tatrāyamānupubbī` + `navavidhasuttantapariyeṭṭhī` đọc thành hai vế (*ở đây, đây là thứ tự: sự tìm hiểu chín loại kinh*); không xác định được cụm sau là đồng vị với *thứ tự* hay là tên của phần kế tiếp.
  - `suttanta` ở `navavidhasuttanta` dịch *kinh* (theo `pe1:79.1`, `ne37:3.1`), không *kinh văn* (cách dịch của bản cũ).

  **Phép kiểm sau sửa.** 24/24 khoá, tập khoá khớp Pāli (mẫu số 24); nháy/ngoặc: 0/0 ở cả hai bên; Pāli không có dấu lược nên Việt không có `…`; 0 cặp Pāli trùng trong chính bài. Số Pāli trong bài: `dvādasa` = 12 (không phải số tự tính, chỉ chép nhất quán), `soḷasa` = 16, `pañca` = 5, `aṭṭhārasa` = 18, `tayo` = 3, `navavidha` = 9 — khớp `ne2:1.1`, `ne2:6.1`, `ne2:10.1`, `ne3:23.1`. Cổng kỹ thuật vẫn KHÔNG chạy: `technical_integrity` = 9,6; bốn lệnh còn lại: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

