notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ja150.
  Đối chiếu văn cảnh tích truyện Jātaka và chú giải Atthakathā để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 25 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code), đối chiếu Pāli và tên phẩm ở ja111/ja131):
  sửa 7.5 và 7.6 trong phần tóm lược các phẩm: Haṁcivagga (tên phẩm, không phải "tiếng kêu chim cút")
  và Asampadānavagga (không phải "không hòa hợp") giữ nguyên tên như ở ja111, ja131. Bất định giữ
  nguyên: byaggho sañjīvako ở 1.4 (ai giết ai) và các tên trong tóm lược 4.1–4.4.

  Quyết định hội đồng biên tập 2026-10-16: B21 — :7.1 (kuruṅga = linh dương); C1 — :0.4, :2.1, translationTitle (bỏ "Chuyện Tiền Thân" về "Kinh X"); C3 — :0.2, :8.1, :9.1 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
