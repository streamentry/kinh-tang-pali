notes: |-
  ĐỌC HẾT p44.txt trước khi viết. 0.1 Therāpadāna giữ nguyên Pāli (291/300 khoá :0.1 của tầng tha-ap). 0.2 Jagatidāyakavagga = Phẩm Cúng Dường Bệ Nền (6/7 tệp; chỉ tha-ap458 dùng Phẩm Jagatidāyaka). 0.3 Pāli không có số thứ tự nên tôi không thêm. 11.1 thứ tám (29/29 tệp).
  NHÓM KỆ 7.x, 8.x, 9.x trùng nguyên văn ở cả sáu bài tha-ap của lát này: một bản Việt cho mỗi Pāli, chọn theo đa số đo được (Các phiền não của ta đã được thiêu rụi 56/85 · ta sống không còn lậu hoặc hoặc 56/84 · Thật lành thay sự đến của ta 54/82 · đã làm tròn lời dạy của Đức Phật 60/82 · Bốn vô ngại giải 300/300 · đã làm tròn lời dạy của Đức Phật”. 270/299 · …pe… giữ đúng một dấu lược).
  KỆ KẾT 6.1-6.4: Satasahassito kappe = Vào một trăm ngàn đại kiếp trước (7/13 tệp) · yaṁ pupphamabhiropayiṁ: đa số chỉ 8/28 khoá, tôi chọn biến thể có tiền lệ khi tôi dâng hoa cúng dường Phật (5 khoá) vì nó giữ nghĩa hồi dâng của abhiropayi mà biến thể đứng đầu làm mất · Ta không biết mình rơi vào khổ đau (93/278 tệp) · dehapūjāyidaṁ phalaṁ = đây là quả báo của việc cúng dường kim thân (nguyên văn ở 1 tệp).
  CÁC KỆ GIỮA ĐÃ TRA. Parinibbute bhagavati = Khi Thế Tôn đã nhập Bát-niết-bàn (2/2 tệp, nguyên văn) · Tattha cittaṁ pasādetvā = sau khi khiến tâm tịnh tín nơi đó (tha-ap520:3.3, nguyên văn; trùng nguyên văn với tha-ap441:3.3 và tha-ap446:5.3, tôi dùng chung) · Āma, bhante jānāmi trong các bài mil: Vâng, thưa tôn giả. 0 tiền lệ: Pupphavaṭaṁsaka (đống hoa), pupphavasso (mùa nở hoa), kusumavasso (mùa hoa tươi), Ambarā (xoài), sabbadassino (toàn tri tự mình suốt thấy), vāhasā, nimmāna (ngày), puññakamma sarāmaha (hồi dâng công đức), sabbadā (khắp nơi).
  BẤT ĐỊNH ĐÃ GHI NHẬN. (1) 3.1 Ambarā pupphavasso me tôi dịch là Mùa nở hoa của ta là mùa xoài, và giữ cùng cách đó cho 5.3 vì cả hai đều là pupphavasso; 4.1 dùng kusumavasso nên tôi tách bằng Mùa hoa tươi. (2) 2.2 nimmānaṁ agamāsahaṁ: nimmāna ở đây là số ngày (sáu ngày), tôi dịch là tôi đã sống sáu ngày không ăn uống; không có tiền lệ cho cụm này trong tầng. (3) 1.3-1.4 tôi hiểu Pupphavaṭaṁsake là đống hoa dựng lên rồi dâng toàn thân Đức Phật lên đó; nếu biên tập đọc là tháp hoa thì sửa cả 1.3 và 1.4 cùng lúc. (4) 5.1-5.2 Ayaṁ pacchimako mayhaṁ, carimo vattate bhavo tôi dịch là Đây là đời cuối cùng của ta / này là đời cuối cùng của Ngài; bhavo là cách xưng hô của vua với Đức Phật.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
