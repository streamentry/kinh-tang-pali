notes: |-
  Review đối kháng: đọc p44.txt, đọc 38 khoá, tra tiền lệ trên toàn tầng kn. Mười khoá sửa — nhiều nhất lát, và bài này là bài yếu nhất. Tôi ghi thẳng ra đây để người điều phối quyết định có cần dịch lại trọn hay không.
  BA LỖI CHẶN ĐÃ SỬA. (1) :3.1 Ambarā pupphavasso me bị dịch thành Mùa nở hoa của ta là mùa xoài — mùa xoài là hoàn toàn bịa, không có chỗ nào trong Pāli nhắc xoài; ambara là bầu trời, và câu này nói mưa hoa từ trên cao. (2) :1.4 sarīramabhiropayiṃ bị dịch thành tôi dâng toàn thân Ngài lên đó — đảo ngược nghĩa: tôi dâng hoa lên thân Ngài, chứ không phải tôi dâng thân Ngài lên. (3) :2.2 nimmānaṃ agamāsahaṃ bị dịch thành tôi đã sống sáu ngày không ăn uống — sai ở cả hai vế: trong Pāli không có chữ nào chỉ sáu, và agamāsahaṃ không có nghĩa là không ăn uống. Tôi tra được tiền lệ trong chính tầng này: dải X agamāsahaṃ xuất hiện nhiều lần với X là nơi chốn — tusitaṃ agamāsahaṃ ở thi-ap4:3.4 và tha-ap362:2.4, vehāsaṃ ở tha-ap519:2.2, pavanaṃ ở tha-ap492:3.2 — nghĩa là đã đến nơi ấy không mất công, không phải là không ăn. Tôi sửa thành đã đến cõi Nimmāna không mất công. Ba lỗi này thuộc đúng loại AGENTS.md xếp là chặn: bịa nội dung và sai nghĩa trọng yếu. Đã sửa nên không còn nằm trong blocking_errors.
  BẢY KHOÁ NỮA SỬA VÌ CÙNG MỘT NGUYÊN NHÂN. Cả nhóm pupphavasso mà bản Việt dịch là mùa nở hoa thì nở hoa, trong khi Pāli nói mưa: vassati là mưa. Tôi sửa :3.1 thành Trên cao, mùa mưa hoa của ta; :3.2 thành rơi xuống quanh năm; :4.1 thành Ở nơi ấy, mùa mưa hoa của ta (bản cũ bỏ mất Tahiṃ là ở nơi ấy); :4.2 thành rơi xuống khắp nơi; :5.3 và :5.4 sửa theo cho khớp. Việc hoa rơi từ trời xuống chính là cơ duyên bài kể, nên nở hoa là mất mạch cả đoạn. Thêm nữa :4.4 vāhasā sabbadassino bị dịch thành ta trở thành bậc toàn tri tự mình suốt thấy — biến vua Ản Sĩ thành chủ thể và làm sai câu; vāhasā sabbadassino là con đường của bậc Toàn Tri, tức bản dâng cúng ấy dâng lên Đấng Thấy Khắp; tôi sửa thành lên bậc Toàn Tri, Đấng Thấy Khắp. Và :1.3 Pupphavaṭaṃsake katvā bị dịch là làm thành đống hoa, mất chữ rổ, tôi sửa thành Khi bàng một chiếc rổ đựng hoa.
  VÌ SAO ĐIỂM THẤP NHẤT LÁT. Mười trên ba mươi tám khoá phải sửa, trong đó có ba lỗi loại chặn, là lý do tôi hạ semantic_fidelity xuống 8.5, grammar_logic xuống 8.7, terminology xuống 8.9, vietnamese_clarity xuống 9.0, segment_alignment xuống 9.4 và ambiguity_integrity xuống 8.8. Tôi không nâng bất kỳ điểm nào để bù.
  CÒN GIỮ NGUYÊN. :2.3 Devalokagato santo tôi dịch Ngài là bậc Thánh đã đi vào cõi trời, giữ chủ thể là Đức Thế Tôn cho khớp với :2.2 sau khi sửa; một bản dịch Anh xuất bản dùng ngôi thứ nhất. Tôi ghi ở đây vì đây là chỗ duy nhất bài lưỡng tính về chủ thể.
  TIỀN LỆ ĐÃ TRA. Phẩm Cúng Dường Bệ Nền cho Jagatidāyakavagga, Parinibbute bhagavati = Khi Thế Tôn đã nhập Bát-niết-bàn, phaladānassidaṃ phalaṃ = quả báo của việc cúng dường kim thân, Satasahassito kappe = một trăm ngàn đại kiếp — đều theo đa số đo được.
  NHÓM KỆ 7.x, 8.x, 9.x TRÙNG NGUYÊN VĂN Ở CẢ SÁU BÀI THA-AP TRONG LÁT. Tôi dựng chỉ mục Pāli → Việt trên toàn bộ tầng kn đã có (1.675 tệp, loại tám uid của lát) rồi đối chiếu: trong lát không còn một Pāli chung nào mà sáu bài dịch khác nhau, và mọi Pāli chung với bài ngoài lát đều trùng khớp hoặc chỉ lệch dấu câu. Bốn câu kệ dùng chung giữ nguyên cách đã có trong kho: Kilesā jhāpitā mayhaṁ = Các phiền não của ta đã được thiêu rụi; viharāmi anāsavo = ta sống không còn lậu hoặc; Svāgataṁ vata me āsi = Thật lành thay sự đến của ta; Paṭisambhidā catasso = Bốn vô ngại giải; kataṁ buddhassa sāsanaṁ = đã làm tròn lời dạy của Đức Phật.
  CHÚ Ý VỀ Svāgataṁ vata me āsi — TÔI CỐ Ý KHÔNG SỬA. Đếm được 54 tệp trong kho dịch câu này thành Thật lành thay sự đến của ta (đa số áp đảo; nhóm kế cạnh là Thật là đón mừng thù thắng thay cho tôi 21 tệp). Nghe thì có vẻ là đọc nhầm: svāgataṃ ở đây là tiếng than thở tự vệ, không phải danh từ sự đến. Nhưng sửa sáu khoá trong lát này sẽ tạo ra thứ tự N+1, và BRIEF_VI3 §6 nói rõ phải dịch nhất quán theo bản Việt đã có. Tôi giữ nguyên và giao việc này lại cho người điều phối quyết định thay cả kho; nếu đổi thì phải đổi cả ~54 tệp, không được sửa lẻ.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Những gì tôi tự kiểm được và đều sạch: JSON hợp lệ, đúng 38 khoá mỗi bài, tập khoá khớp tuyệt đối với content/catalog/sutta/kn.json và với all trong vc/c44.json, không orphan, không rỗng, không còn stub dạng (…), toàn bộ NFC, số dấu lược không bao giờ vượt số dấu lược của Pāli và mỗi …pe… của Pāli còn đúng một dấu …, YAML parse sạch bằng thư viện yaml của kho.
