notes:
  - |-
    **ĐÃ ĐỌC HẾT PĀLI LÁT TRƯỚC KHI VIẾT**, không dựng từ trí nhớ: file `/Volumes/SSD/opencode-work/f2/f125.pali.txt` (532 dòng) và lại đọc Pāli thật trong `.cache/upstream/suttacentral/root/pli/ms/sutta/kn/mil/mil4.2_root-pli-ms.json` cho từng khoá. **Bài này KHÁC 13 bài còn lại của lát:** đây là văn xuôi hội thoại, không phải kệ, nên `substantiveSegments` = 4 (khoá ≥ 40 ký tự) và có **cấu trúc 4 khối**: `0.x` tiêu đề → `1.x` câu hỏi của Nāgasena → `2.x` câu trả lời của Trưởng lão + `2.4` *Bhavatīha—* → `3.x` bài kệ tóm tục + `4.1` dòng tóm.

    **TẦNG THAM KHẢO — đo, không suy.** 0/17 khoá có tiếng Anh Sujato. Cùng thư mục có `kn/mil4.4`, `kn/mil4.5`, `kn/mil4.6` đã dịch trong tầng và cũng **không** có tầng Anh, nên đây là đặc điểm của bản chụp upstream cho cả nhóm Milindapañha, không phải sót của riêng bài này. Bản Việt hiện hành cũng không có. `triangulation` = 7.5 và `status` = `draft` theo quy tắc cổng.
  - |-
    **Ba khoá đầu dùng lại NGUYÊN VĂN của chính các bài cùng phẩm** (đếm bằng chỉ mục Pāli↔Việt toàn tầng): `0.1` `Milindapañha` (71 bài) → *Milindapañha*; `0.2` `Meṇḍakapañhārambhakathā` (mil4.4, mil4.5, mil4.6) → *Lời Dẫn Nhập Cho Các Câu Hỏi Hóc Búa*; `0.3` `Upāsakaguṇavagga` (mil4.4, mil4.5, mil4.6) → *Phẩm Đức Tính Người Cư Sĩ*. `Thero āha—` → *Trưởng lão nói—* theo 6 bài mil đã có; `Bhavatīha—` → *Hãy nghe:—* theo `mil4.4:1.4`. `Bhante nāgasena` → *Thưa tôn giả Nāgasena* theo `mil4.4:1.1`.
  - |-
    **Cụm then chốt, 0 tiền lệ trong tầng — dịch theo nghĩa chữ.** `mantitaṁ atthaṁ byāpādeti` → *phá hủy điều lành đã được suy nghĩ*; `atthavināsaka` → *kẻ phá hủy điều lành*. Tôi dùng **một** cụm cho `0.4`, `1.1`, `1.4`, `3.4` và `4.1` để tiêu đề và thân khớp. `aṭṭhime puggalā` → *tám loại người*. `Katame aṭṭha?` → *Là tám loại nào?* (chứ không phải *Tám pháp nào?* như 27 tiền lệ văn xuôi, vì danh từ dẫn trong chính bài này là `puggalā`, là **người**). `tesaṁ ko doso` → *trong tám người ấy, ai là kẻ phá hủy vậy*.
  - |-
    **Tám loại người — thuật ngữ, kèm đếm.** `rāgacarita / dosacarita / mohacarita / mānacarita` → *tính tình tham / sân / si mê / ngạo mạn* (`carita` = *tính tình*, 3 tiền lệ ở `snp`; `māna` = *ngạo mạn*, 456 tiền lệ). `luddha` → *tham lam* (293 tiền lệ cho *tham lam*, 195 cho *keo kiệt*; chọn *tham lam* vì `lobhavasena` ở `2.3` là lý do đi kèm). `alaso` → *lười biếng* (96 tiền lệ). `ekacintī` → *ít suy nghĩ* (0 tiền lệ — tầng không có cụm này; `ekacintitāya` ở `2.3` dùng cùng chữ). `bālo` → *ngu dốt* (41 tiền lệ). Trong kệ `3.1`–`3.4`: `ratta` → *ô nhiễm*, `duṭṭha` → *xấu xa* (**0 tiền lệ** cho cả *hỗn tội* lẫn *duṭṭha* trong tầng), `mūḷha` → *mê muội* (41), `mānī` → *ngạo mạn*.
  - |-
    **Bất định đã ghi, không giải thích trong thân kinh.** `duccarita` không có trong lát này nên không dùng. Ở `2.3` tôi dịch `alasatāya` là *sự lười biếng*, `ekacintitāya` là *sự ít suy nghĩ*, `bālatāya` là *sự ngu dốt* — cả ba là danh từ trừng phạt, khớp với các đối tượng ở `1.3`. Bản Việt lặp cụm *điều lành đã được suy nghĩ* tám lần ở `2.3` vì Pāli lặp `mantitaṁ atthaṁ byāpādeti` tám lần; tôi không nén, vì nén bằng `…` mất đúng cái danh tính (tám vì sao) mà câu hỏi `2.2` đang hỏi.
  - |-
    **Bất đối xứng đã ghi:** tiêu đề `0.4` là *Tám loại người phá hủy điều lành **đã suy nghĩ*** (theo `mantavināsaka`) còn dòng tóm `4.1` và `1.4` là *…điều lành **đã được suy nghĩ*** (theo `mantitaṁ atthaṁ`). Cả hai đều đúng với chữ Pāli của mình; tôi không ép chúng bằng nhau.
