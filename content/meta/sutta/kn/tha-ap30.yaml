  có một dấu lược nào — 49/49 khoá khớp 0 = 0. Không có chỗ nào bị mở rộng.

  Nháy kép: đặt đúng vị trí Pāli đặt và cân trên cả bài — `1.1` mở `“`, `11.4` đóng `”`;
  `4.1`–`4.4` giữ cặp nháy đơn `‘…’` đúng như Pāli (Pāli dùng nháy đơn cho lời van xin
  trong lòng sông; `ngoặc()` của `_hvi.py` chỉ đếm `“`/`”` nên cặp `‘…’` không ảnh hưởng,
