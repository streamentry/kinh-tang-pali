  BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ — `1.3` `Sagocarappasutohaṁ,`
  · Đây là **hapax legomena**: quét toàn bộ Pāli root đã ghim (`root/pli/ms/sutta`, 5.764 tệp)
    cho `sagocara` chỉ ra **3 khoá**: hai khoá của chính `tha-ap30` (1.3 và 6.2 `sarīrantimadhārinā`
    là từ khác) và `pe8:18.7/18.9` — mà `pe8` dùng `kilesagocara` theo nghĩa *sống chung với phàm
    pháp*, không liên quan. Nghĩa **`ppasuta` có thể mang tiền tố phủ định `a-`** vì Pāli
    `a + p-` → `app-` (`a + pāpa` → `appāpa`, `a + pitar` → `appitar`); nếu vậy `1.3` là *không
    hề sa vào*, và nghĩa ấy hợp hơn với một bài kể chuyện cứu vớt. Ngược lại nếu `pp-` chỉ là
    lặp phụ âm thì `pasuta` = *sa vào, bị dồn vào* (`dukkhasamudayappasuta`), và đó là cách tôi
    dịch. **Tôi đã dịch theo nghĩa không phủ định** vì *sa vào* khớp mạch cả bài (`Nadiṁ
    taritukāmo so` 2.3, `tāressāmi ahaṁ tuvaṁ` 4.2), nhưng hai đọc đối nghịch nhau và tôi
    **không** bịa thêm chi tiết nào để cứu một trong hai. Người biên tập nên tra lại `tha-ap30`
    trong bản thảo Pāli in (SuttaCentral PTS/Thai) để chốt.
  · `Susumāro` (1.2) là tên **dòng sông nhỏ** ở Kosala, không phải tên người; tầng Việt dự án
    có **0** tiền lệ nên tôi giữ nguyên Pāli. Tương tự `Candabhāgā` (1.1) — 17 tiền lệ, đều
    giữ Pāli.
  · `mahāvīra` (4.1) → *Đại Hùng*; `abhirūha` (4.1, 5.2) → *hãy nhấc tôi lên* (mệnh lệnh
    `abhirūhi`, xem `tha-ap22:6.3` `Pāsādaṁ abhirūhitvā` và `thig2.6:1.4` `pabbataṁ abhirūhiya`).
    0 tiền lệ cho cụm `Abhirūha mahāvīra`; `tha-ap481:4.1` có cùng Pāli nhưng **chưa** có bản Việt
    nên không dùng lại được.
  · `Pettikaṁ visayaṁ mayhaṁ` (4.3) → *cõi phồn hiền là chỗ của tôi*; `visaya` = *phạm vi,
    chỗ*, `pettika` = *phồn hiền*. 0 tiền lệ.
  · `Mama uggajjanaṁ sutvā` (5.1) → *Nghe tiếng tôi kêu cứu*; `uggajjana` = *gào thét*, và
    `mnd8:53.2` `gajjanto uggajjanto` xác nhận nghĩa *gào*. 0 tiền lệ cho cụm này.
  · `Sattakkhattuñca devindo` (8.1) → *Bảy lần dâng lên, ta là vua trời*; `sattakkhattuṃ` là
    **bảy lần dâng lên**, và `Tīṇikkhattuṁ cakkavattī` (8.3) là **ba bảo vật** — đó là hai
    món công đức mà bài này kể, nên tôi dịch cả hai là *dâng lên* / *bảo vật* chứ không quy
    cả hai về *lần*. 0 tiền lệ.
  · `9.1` `Vivekamanuyuttohaṁ,` → *Tôi đang hướng đến sự viễn ly,*; cụm này trùng nguyên văn ở
    `tha-ap62:10.1` nhưng bài đó **chưa** có bản Việt, nên không có câu nào để dùng lại.
  · `6.2` `siddhattho lokanāyako;` — tiền lệ chia đôi 1–1: *vị Dẫn Đạo thế gian đã thành tựu.*
    (`tha-ap441:2.4`) ⟵ *Đức Siddhattha, bậc Dẫn Lộ Thế Gian,* (`tha-ap331:5.2`). Tôi ghép
    hai vế làm một câu (*Đức Siddhattha, bậc Dẫn Đạo thế gian,*) để giữ cả `siddhattho` (tên
    riêng, 0 tiền lệ) lẫn `lokanāyako`. Người biên tập có thể muốn thống nhất với
    `tha-ap441` hoặc `tha-ap331`.

