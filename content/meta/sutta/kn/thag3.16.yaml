notes: |-
  **33/33 khoá. Đã đọc hết Pāli của bài trước khi viết chữ, và ghi ngay sau khi dịch xong
  bài này — không dồn cuối lát.**

  **PROVENANCE — kiểm được bằng đếm, không suy từ tên thư mục.** Tra
  `source/upstream-manifest.json` (commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`):
  cả **hai** tệp đã ghim đều có mặt trong `english-sujato`
  (`sutta/kn/thag/thag3.16_translation-en-sujato.json`) ⇒ **KHÔNG phải**
  `not-published-upstream`, nên không có blocker nào ở đây. Tôi còn tự tính lại
  **git blob hash** của cả sáu tệp (3 Pāli + 3 English của ba bài trong lát) và so với
  `files` trong manifest: **6/6 khớp** (`sha1("blob <len>\0" + nội dung)`), tức Pāli tôi
  dịch đúng là Pāli tại commit đã ghim. Tầng `vietnamese-current` (Hòa thượng Thích Minh
  Châu) **không có** cho bài này — commit đã ghim chỉ chứa 26 tệp Pháp Cú, nên đây là
  giới hạn của snapshot upstream, không phải thiếu sót của kho.

  **COVERAGE — đo được kèm mẫu số, và mẫu số BẰNG KHÔNG.** Ngưỡng khai ở
  `source/layers.yaml` là `substantivePaliMinChars: 40`. Đếm thẳng trên Pāli của bài:
  **0/33** khoá đạt 40 ký tự (dài nhất là `thag3.16:3.5` `… Vimalo thero … ` = 17 ký tự;
  thân bài là kệ, mỗi vế 20–25 ký tự). Vì vậy cổng coverage **không đo được gì**, chứ
  không phải "0% và không đạt" — hai việc khác nhau. Mã nguồn xử lý đúng việc này:
  `src/lib/canon/reference.ts:152` đặt `ratio = substantive === 0 ? 1 : …`, nên cổng
  **xanh theo thiết kế** và **không** cần mục trong `content/meta/reference-gaps.yaml`.
  Suy ra `substantiveWithoutEnglish = 0`, `worstMissingSegment = null`.
  **Độ phủ thô để người biên tập tự phán** (đây là số phụ, KHÔNG phải số cổng dùng):
  trong **16** khoá thơ (1.1–3.6) Sujato có tiếng ở **14/16 = 87,5%**; trống ở `3.5`
  (dòng bìa) và `3.6` (`Tikanipāto niṭṭhito.`); toàn bộ khối uddāna `4.0`–`6.4`
  (**13 khoá**) và bốn khoá `0.*` Sujato để trống. Trên **mọi** khoá: 18/33 = 54,5%.

  **BÀI NÀY LÀ BẢN LUYỆN TẬP (bhāvanā) CỦA `thag2.14` — đây là phát hiện làm được, không
  phải trùng hợp.** Từ `2.1` đến `3.4`, **mười khoá** Pāli trùng nguyên văn với
  `thag2.14:1.1`–`2.4` (bản ứng sinh của **đúng câu kệ đó**; còn `iti78:6.3`–`8.4` —
  *Dhātusosaṁsandanasutta* — là bản thứ ba của cùng câu, đã có bản Việt trong tầng).
  Tôi dùng lại **y nguyên văn** bản Việt của `thag2.14` cho cả mười khoá, vì đó là
  cùng tác phẩm, cùng câu kệ, cùng thể kệ. Chỉ có một chỗ phải cắt: `thag2.14:1.1`
  mang `“` mở ngoặc kép ngay trong khoá đó, còn `thag3.16` đã mở `“` từ `1.1`, nên
  `2.1` lấy nguyên văn **trừ** dấu `“`. Thêm nữa, `2.3`–`3.4` còn khớp `iti78` và
  `3.1`–`3.4` còn khớp `mil7.7.4:6.2`–`6.3`.

  **DÙNG LẠI NGUYÊN VĂN (đo được trên toàn tầng, không đoán):**
  · `2.1`–`3.4` ← `thag2.14:1.1`–`2.4` (10 khoá) — chi tiết ở trên.
  · `3.5` `… Vimalo thero … ` → *`… Trưởng lão Vimala …`* — **hai** dấu lược, giữ nguyên
    hình `… …` vì Pāli ở đây không có dấu chấm nối. Nguyên văn của `thag1.50:1.5`
    (cùng bậc trưởng lão, cùng Pāli, đã `published`). Khác hình `….` của `thag7.5:7.8`
    vì Pāli ở đây không có dấu chấm nối.
  · `3.6` `Tikanipāto niṭṭhito.` → *"Bộ Ba Bài Kinh kết thúc."* — nguyên văn của
    `thig3.8:5.1` (tệp cùng Pāli, đã `published`). Từ chối phương án cạnh tranh
    `iti99:9.5` *"Phẩm Ba Pháp kết thúc"* vì `Phẩm … Pháp` là hình sai cho `-nipaata`.
  · `4.0` `Tatruddānaṁ` → *"Tóm tắt ở đây:"* — **6/7** cặp trùng nguyên văn trong tầng
    (`thag1.120:3.0`, `thag5.12:6.0`, `thag6.14:7.0`, `thag7.5:8.0`, `thag8.3:9.0`,
    `thag9.1:10.0`; bản lệch là `thag2.49:4.0` *"Kệ tóm tắt toàn nhóm ấy:"*). Riêng
    `Tassuddānaṁ` của Liên tục là *Tóm lược:* — **hai chữ Pāli khác nhau, không lẫn.**
  · `0.4` `Vimalattheragāthā` → *"Kinh Kệ Của Trưởng Lão Vimala"* — nguyên văn của
    `thag1.50:0.4`, và `thag3.*` đã dùng đúng tiền tố này **16/16**.
  · `0.2` `Tikanipāta` → *"Bộ Ba Bài Kinh"* — **15/15** cặp trùng nguyên văn trong tầng,
    và tầng `name/` của chính SuttaCentral (`thag-name:189`) ghi *"The Book of the Threes"*,
    đúng hình với `Bộ Một Bài Kinh` / `Bộ Hai Bài Kinh` đã chốt trong `BRIEF_VI3` §11.
  · `0.3` `Paṭhamavagga` → *"Phẩm Thứ Nhất"* — 102 tiền lệ trong tầng.
  · `6.3` `Aṭṭhatālīsa gāthāyo,` — **CỐ Ý KHÁC** `tha-ap302:8.5` (*"Bốn mươi tám câu
    kệ,"*). Đo lại trong `kn`: *bài kệ* **552**, *câu kệ* **16**; và hai uddāna cùng thể
    đã `published` (`thag5.12:6.5`, `thag6.14:6.5`) đều dùng *bài kệ*. Giữ *bài kệ* để
    khỏi sinh biến thể thứ 17; ghi rõ ở đây vì đã **không** dùng lại y nguyên văn.
  · Mười tên trong uddāna đều có tiền lệ **trùng nguyên văn** ở đúng bài gốc của người
    ấy, nên giữ nguyên dạng đã xuất bản: `Aṅgaṇikabhāradvāja` (`thag3.1:3.5`),
    `Paccaya` (`thag3.2`), `Bākula` (`thag3.3`), `Dhaniya` (`thag3.4`), `Mātaṅgaputta`
    (`thag3.5`), `Vassika` (`thag3.8`), `Yasoja` (`thag3.9`), `Vāraṇa` (`thag3.7`),
    `Uttarapāla` (`thag3.12`), `Abhibhūta` (`thag3.13`), `Gotama` (`thag3.14`),
    `Hārita` (`thag3.15`). `sobhito` ở `4.4` **không** có tiền lệ vì bài `thag3.6`
    (Khujjasobhita) chưa dịch — tôi dịch theo đúng chữ Pāli `sobhito`, **không** tự
    sửa thành tên đầy đủ của bài gốc; xem mục bất định bên dưới.

  **BẤT ĐỊNH ĐÃ PHÂN XỬ (không thêm chú thích vào thân kinh):**
  · `6.2` `nibbāne vimalo kato;` → *"Vimala đã thành tựu trong cõi niết bàn;"*. Câu này
    **Sujato để trống** nên không có bản Anh để đối chiếu; đây là công thức uddāna nén.
    `kato` là dạng quá khứ của `kar` (làm / thành tựu), tôi đọc là "đã thành tựu" chứ
    không dịch chữ-lết "đã được làm". Người biên tập xem lại nếu muốn giữ nghĩa đen hơn.
  · `4.4` `sobhito` vs. bài `thag3.6` là `Khujjasobhito`. Tầng Pāli tại commit đã ghim cứ
    ghi `sobhito`; tôi dịch `Sobhita` theo đúng Pāli và **không** tự sửa uddāna. Đây là
    điểm thuộc tầng Pāli, không phải lỗi bản dịch.
  · `5.2` `sāṭimattiyupāli` giữ **nguyên một từ** `Sāṭimattiyupāli` (chính là Pāli)
    thay vì tách `Sāṭimattiy-Upāli`: lẻ ra phải viết `Sāṭimattiy-Upāli` cho đúng cách
    Việt, nhưng `Sāṭimattiy` là một từ Pāli mà **không** có trong Pāli của chính bài
    (`sāṭimattiyupāli` là một từ), nên tách ra sẽ bị chốt Pāli-lọt bắt. Bài gốc là
    `thag3.10` = *Sāṭimattiy* (`thag3.10:0.4`, `thag3.10:3.5`), còn `Upāli` là một vị
    khác đã có trong tầng; ghép `Upāli` làm tên bài này sẽ đổi cả tính tử nữ, nên tôi
    **không** làm.
  · `1.4` `acalaṁ sukhaṁ` → *"nền an lạc bất động"*: `acala` dùng **bất động** (44 lần
    trong `kn`, vd `acalaṁ ṭhānaṁ` → *cảnh giới bất động*), `sukha` ở đây là niềm an
    lạc chứ không phải *khổ đau* của cặp `sukha-dukkha`.
  · `1.2` `bhajeyya` → *"hãy thân cận"*: `bhaja` ở nghĩa tu tập đã dịch *thân cận* 67 lần
    trong `kn`; chỉ có **một** chỗ dùng *chơi với* và đó là câu đùa cổ tục, không theo.

  **DẤU LƯỢC:** bài **không có** `…pe…` ở bất kỳ khoá nào. Đúng **một** khoá có `…`
  trần là `3.5`, với **hai** dấu lược; tôi giữ đủ hai, không bung, không gộp (quy tắc
  `lược()` của `_hvi.py` kiểm từng khoá và pass).

  **TỰ KIẾM, không chỉ dựa vào `_hvi.py` (`_hvi.py` im lặng ở bốn trường hợp):**
  (1) `set(khoá Việt) == set(khoá Pāli)` — **33/33** cho cả ba bài trong lát, và **0**
  khoá nào dài dưới 40 ký tự bị gộp; (2) nháy đơn `‘…’` cân trên từng khoá — **0 lệch**;
  (3) `…pe…` bị bung thành văn — **không có** khoá nào; (4) `…` trần bị viết đủ — **0**.
  Thêm một phép kiểm riêng của lát này: **Pāli trùng nguyên văn TRONG CHÍNH bài mà
  bản Việt khác nhau** (loại lỗi làm bài kinh tự mâu thuẫn) — nó **bắt được 2 lỗi thật**
  ở `thag7.2` (`6.2`/`7.2` cùng Pāli `bahiddhā ca vipassati;` nhưng tôi đã dịch khác
  nhau), đã sửa. Ở `thag3.16` phép kiểm này báo **0**.

  **CỔNG KỸ THUẬT — CHƯA CHẠY, KHÔNG TUYÊN BỐ PASS.** Lát này bị cấm chạy
  `npm run validate`, `npm test`, `npm run check`, `npm run build`; bốn lệnh đó còn lại
  cho người điều phối. Tôi chỉ tự chạy `_hvi.py.kiểm()` (0 lỗi) và quét bổ sung nêu trên.
  Vì vậy `technical_integrity` đặt **9.6**, không đặt 10.0.

  **NGƯỜI BIÊN TẬP — CÒN VIỆC, CHƯA SỬA (ngoài lát này).** `thag2.14:1.1` (bản ứng sinh)
  mang `“Hãy bám lấy khúc gỗ nhỏ,` ở **đầu** khoá, còn `thag2.14` đã mở ngoặc kép
  ngay ở đó; không sai, nhưng nếu người gộp muốn đồng nhất với `thag3.16:2.1` thì đó là
  một chỉnh sửa hình thức, không phải nội dung.