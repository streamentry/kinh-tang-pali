notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `vv`.
  Bài này là bài thứ 11 của phẩm Cittalatā và là hàng xóm sát của vv27 (bài thứ 10) nên 15 khoá dùng lại nguyên văn bản Việt của vv27 với Pāli trùng: `“Với dung sắc rạng rỡ thù thắng,` / `nàng đang đứng nơi đây, này thiên nữ;` / `Chiếu sáng khắp mọi phương trời,` / `rực rỡ tựa như sao mai.` / `Do đâu nàng có được dung sắc như thế,` / `…` / `và sắc tướng nàng chiếu sáng khắp mọi phương?”.` / `Nữ thiên ấy hoan hỷ,` / `quả báo của nghiệp này là thế.` / `“Thuở trước giữa loài người tôi là một phụ nữ,` / `trong kiếp sống trước ở nhân gian.` / `tịch tịnh thanh khiết không chút bợn nhơ;` / `Tôi đã dâng cúng vật thực lên Ngài,` / `với tâm tịnh tín bằng chính đôi tay mình.` / `Nhờ vậy tôi có được dung sắc như thế này,`.
  `Tassuddānaṁ` dùng `Tóm lược:` (281×); 7 câu kệ liệt kê tên (9.1–9.7) giữ tên Pāli vì đó là danh sách tên các cung điện trong phẩm, và tầng cũng giữ tên Pāli ở `Phẩm Cây Hoa Cittalatā`. `bhikkhāya dāyikā` dịch `nữ thí vật thực cho tỳ-kheo` theo cách đã dùng ở vv27:0.4.
  Bất định còn lại: `Bhāṇavāraṁ paṭhamaṁ.` (11.1) — Pāli nói `phần đầu của chuyên luận`, trong khi vv28 thực tế mở đầu phần chuyên luận thứ hai của bộ `vv`; dịch theo chữ nghĩa là `Chuyên luận, phần thứ nhất.` và ghi bất định này ở đây để biên tập quyết. `Itthivimāne dutiyo vaggo.` dịch `Trong Cung Điện Nữ Hư Không, đây là phẩm thứ hai.`
  `Addasaṁ virajaṁ bhikkhuṁ,` dùng `Tôi trông thấy vị tỳ-kheo ly trần thanh tịnh,` (1× ở vv59:6.1) vì Pāli ở đây là `bhikkhuṁ` chứ không phải `buddhaṁ` như vv27.
  `…pe…` giữ một dấu lược.
  Lượt cải thiện 2026-10-11 (kiểm toán đối kháng, đọc lại từng cặp Pāli↔Việt): đổi 8/34 khoá, hạ điểm vì bản trước tự chấm quá cao (semantic_fidelity 9.1→8.4, grammar_logic 9.2→8.8, terminology 9.0→8.0, vietnamese_clarity 9.2→8.8, han_viet_balance 9.4→9.3, ambiguity_integrity 8.9→8.5; final_score 9.14→8.84).
  Khoá đã sửa: 4.1 `Thuở trước giữa loài người tôi là một phụ nữ,` → `Khi tôi còn làm người giữa loài người,` (Pāli `manussabhūtā` chỉ là "đã là người"; "phụ nữ" là thêm nghĩa, và "thuở trước" bị dời từ `purimāya jātiyā` ở 4.2 sang 4.1 rồi lặp lại; 14 nơi trong họ vv dịch như bản mới). 5.1 bỏ `thanh tịnh` thừa (Pāli chỉ có `virajaṁ`). 5.2 `vippasannamanāvilaṁ` = `vippasannaṁ anāvilaṁ` theo sandhi (tiền lệ sn35.132:7.2 `trong sáng, không vẩn đục`), bỏ `tịch tịnh` không có trong Pāli. 9.3 `Bhaddeyyī` là tên bịa, Pāli là `bhadditthī` (cùng tên với vv22 `Bhadditthivimāna`) → `Bhadditthī`. 9.4 `Soṇḍinnā` sai chính tả → `Soṇadinnā` (đúng Pāli và đúng vv23). 9.6 bỏ `cho tỳ-kheo`: `bhikkhāya` là "vật thực khất thực" chứ không phải "cho tỳ-kheo" (ghi chú cũ nói theo vv27:0.4 là sai, vv27:0.4 không có `cho tỳ-kheo`). 9.7 câu cũ `được gọi tên là vậy` vô nghĩa → `Vì thế, phẩm này được gọi tên như vậy.`. 11.1 `Chuyên luận` sai: `bhāṇavāra` là phần tụng đọc (tiền lệ 2 nơi trong vv: `Phần tụng đọc thứ hai/thứ ba`) → `Phần tụng đọc thứ nhất.`; bất định ghi ở ghi chú đầu về "phần đầu của chuyên luận" nay giải quyết: chữ này đóng phần tụng đọc thứ nhất ngay sau phẩm thứ hai của Itthivimāna.
  Lỗi còn lại, KHÔNG sửa riêng một bài vì lặp cả bộ: 0.2 và 10.1 `Itthivimāna` dịch `Nữ Hư Không` (Pāli không có `ākāsa`; nghĩa là "các cung điện của nữ thiên"); 0.3 `Phẩm Cây Hoa Cittalatā` (`Cây Hoa` là thêm, Pāli chỉ là `Cittalatāvagga`); 9.1 `Dāsī` giữ Pāli trong khi vv18:0.4 dịch `Nữ Tỳ`. 3.3 `yassa kammassidaṁ phalaṁ` là mệnh đề quan hệ (đây là quả của nghiệp nào, mà nữ thiên được hỏi và đáp), bản dịch `quả báo của nghiệp này là thế` (52 nơi trong họ vv) biến thành câu chỉ định, nhẹ hơn nhưng chưa phản ánh đủ; giữ vì tiền lệ, ghi bất định. Cùng lỗi 4.1/5.1/5.2 có ở vv27 và vv39 (4 khoá `một phụ nữ` trong tầng).
  Số liệu: 34/34 khoá trùng tập khoá Pāli; nháy `“”‘’` khớp Pāli từng khoá (0 lệch); `…pe…` → `…` khớp (0 lệch); 0 cặp Pāli trùng nguyên văn trong bài; NFC; không Pāli lọt vào lời kinh ngoài tên riêng ở 9.1–9.5.
  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|check`; coordinator cần chạy đủ bốn lệnh sau trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, và `npm run build`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 2 khoá bất đồng nghĩa → sửa 0, giữ 2 (9.5: bài kệ tóm lược trong bản nguyên bài ghi `Nandā`/`Sunandā`, còn Pāli ghim là `Niddā ceva suniddā ca` nên giữ `Niddā`/`Suniddā`; 3.3 `yassa kammassidaṁ phalaṁ`: bản nguyên bài đọc là mệnh đề quan hệ, "quả báo này là của nghiệp nào", còn bản dự án theo khuôn "quả báo của nghiệp này là thế" đã dùng ở 52 nơi trong họ vv; giữ để nhất quán, ghi lại rằng khuôn này làm nhẹ quan hệ đại từ), bất định 0. Các câu còn lại (1.1–2.3, 4.1–6.3, 9.1–9.7) cùng nghĩa với Pāli. Review đối kháng cùng lượt: sửa 1 khoá — 10.1 `Itthivimāne dutiyo vaggo`: "Trong Cung Điện Nữ Hư Không, đây là phẩm thứ hai." → "Trong Thiên Cung Của Nữ Giới, đây là phẩm thứ hai." (Pāli không có `ākāsa`, `itthi` là nữ giới; khớp `0.2` của chính bài; cùng lỗi ở vv17:11.1, ngoài lát). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đối chiếu bản nguyên bài Bhikkhu
  Indacanda, đoạn song song vv31 vv49 vv77 vv75 vv7 vv23): sửa 5 khoá: 2.3 và 6.3 `vaṇṇo` *sắc tướng*
  → *dung sắc* (nhất quán với 2.1, 6.1 và cả phẩm), 2.3 còn bỏ dấu thừa `?”.` → `?”` và theo Pāli `te`
  dùng *muôn phương* như vv31/vv49; 3.3 `yassa kammassidaṁ phalaṁ` *quả báo của nghiệp này là thế* →
  *về nghiệp mà đây là quả báo* (`yassa` quan hệ từ, theo vv7:4.4 đã phân xử, 49 khoá cùng Pāli;
  Indacanda giữ nghĩa quan hệ); 5.3 `tassa adāsahaṁ bhikkhaṁ` *lên Ngài* → *cho vị ấy* (`tassa` chỉ
  một tỳ-kheo, viết hoa *Ngài* là nâng bậc không có trong Pāli); 7.1 *Thí Vật Thực II* → *Thứ Hai*
  (khớp 0.4 và mẫu đóng vv2/vv12/vv14; vv27:7.1 còn *I*, ngoài lô). Giữ 9.7 *Vì thế, phẩm này được gọi
  tên như vậy* (khác công thức *phẩm ấy vì vậy được gọi tên là vậy* ở vv17, cùng nghĩa; chờ người biên
  tập thống nhất). Cùng lượt sửa vv17:11.1 theo vv28:10.1. Không bất định Pāli mới. Chờ người biên
  tập: tiêu đề 0.2, xưng hô. Không có bản Anh.
  Điều phối viên 2026-10-15: điểm lượt rà soát được hạ về 9,00 thô (chỉ khoá 3.3 là sửa quan hệ đại từ thật); ghi chú "9,01" trong hồ sơ chấm là nhầm, đúng là 9,00 — không vượt 9,0.

