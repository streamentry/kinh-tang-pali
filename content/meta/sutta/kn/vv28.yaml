notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `vv`.
  Bài này là bài thứ 11 của phẩm Cittalatā và là hàng xóm sát của vv27 (bài thứ 10) nên 15 khoá dùng lại nguyên văn bản Việt của vv27 với Pāli trùng: `“Với dung sắc rạng rỡ thù thắng,` / `nàng đang đứng nơi đây, này thiên nữ;` / `Chiếu sáng khắp mọi phương trời,` / `rực rỡ tựa như sao mai.` / `Do đâu nàng có được dung sắc như thế,` / `…` / `và sắc tướng nàng chiếu sáng khắp mọi phương?”.` / `Nữ thiên ấy hoan hỷ,` / `quả báo của nghiệp này là thế.` / `“Thuở trước giữa loài người tôi là một phụ nữ,` / `trong kiếp sống trước ở nhân gian.` / `tịch tịnh thanh khiết không chút bợn nhơ;` / `Tôi đã dâng cúng vật thực lên Ngài,` / `với tâm tịnh tín bằng chính đôi tay mình.` / `Nhờ vậy tôi có được dung sắc như thế này,`.
  `Tassuddānaṁ` dùng `Tóm lược:` (281×); 7 câu kệ liệt kê tên (9.1–9.7) giữ tên Pāli vì đó là danh sách tên các cung điện trong phẩm, và tầng cũng giữ tên Pāli ở `Phẩm Cây Hoa Cittalatā`. `bhikkhāya dāyikā` dịch `nữ thí vật thực cho tỳ-kheo` theo cách đã dùng ở vv27:0.4.
  Bất định còn lại: `Bhāṇavāraṁ paṭhamaṁ.` (11.1) — Pāli nói `phần đầu của chuyên luận`, trong khi vv28 thực tế mở đầu phần chuyên luận thứ hai của bộ `vv`; dịch theo chữ nghĩa là `Chuyên luận, phần thứ nhất.` và ghi bất định này ở đây để biên tập quyết. `Itthivimāne dutiyo vaggo.` dịch `Trong Cung Điện Nữ Hư Không, đây là phẩm thứ hai.`
  `Addasaṁ virajaṁ bhikkhuṁ,` dùng `Tôi trông thấy vị tỳ-kheo ly trần thanh tịnh,` (1× ở vv59:6.1) vì Pāli ở đây là `bhikkhuṁ` chứ không phải `buddhaṁ` như vv27.
  `…pe…` giữ một dấu lược.
  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|check`; coordinator cần chạy đủ bốn lệnh sau trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, và `npm run build`.
  Kiểm toán độc lập 2026-10-11: đọc đối kháng 34/34 khoá với Pāli; 7 khoá sai thật đã sửa, 2 khoá sai thật thuộc lỗi cả họ chưa sửa riêng. Các mục ở trên đây (viết ngày 2026-10-04) có chỗ không còn đúng, xem bên dưới.
  Đã sửa: (1) 3:3 `yassa kammassidaṁ phalaṁ` — `yassa` là quan hệ từ ("nghiệp mà đây là quả"), bản cũ đọc thành mệnh đề khẳng định "quả báo của nghiệp này là thế" nên mất cấu trúc quan hệ; nay `về nghiệp mà đây là quả báo.` (cùng cách đọc với vv15:4.4; khoảng 60 tệp vv còn dùng cách cũ). (2) 4:1 `manussesu manussabhūtā` — bản cũ chèn "phụ nữ" và "Thuở trước" (chữ này thuộc `purimāya jātiyā` ở 4:2, bị dịch hai lần); nay `Khi tôi còn làm người giữa loài người,` (17 tệp vv dùng cách này). vv27:4.1 còn câu cũ, chưa sửa. (3) 5:3 `Tassa adāsahaṁ bhikkhaṁ` — người nhận là một tỳ-kheo, không phải Đức Phật; "lên Ngài" (đúng ở vv27) là nâng bậc sai; nay `cho vị ấy`. (4) 9:3 `bhadditthī` — bản cũ viết `Bhaddeyyī` (không có trong Pāli); nay `Bhadditthī`. (5) 9:4 `soṇadinnā` — bản cũ viết `Soṇḍinnā`; nay `Soṇadinnā` (khớp vv23:0.4 và uddāna vv23). (6) 9:6 `dve ca bhikkhāya dāyikā` — "cho tỳ-kheo" là chèn thêm và sai với vv27, nơi người nhận là Đức Phật; nay bỏ, chỉ còn `cùng hai vị nữ thí vật thực;`. (7) 11:1 `Bhāṇavāraṁ paṭhamaṁ` — bhāṇavāra là một phần để tụng đọc, không phải "chuyên luận"; nay `Phần tụng đọc thứ nhất.` (cách đã dùng ở vv44, vv64 và các tệp vv khác; "Chuyên luận" chỉ ở 2/4 tệp). Đây là dòng kết thúc phần tụng thứ nhất của bộ `vv`, nên "bất định" nêu ở trên (vv28 có mở đầu phần thứ hai hay không) là hiểu sai và không còn.
  Còn tồn tại, KHÔNG sửa riêng một tệp vì sẽ lệch cả bộ: (a) 0:2 và 10:1 `Itthivimāna` dịch "Nữ Hư Không" — Pāli không có `ākāsa`, đây là lỗi dịch tên phẩm lặp ở khoảng 48 tệp vv; (b) 0:3 `Cittalatāvagga` dịch "Phẩm Cây Hoa Cittalatā" — "Cây Hoa" là chữ thêm (`latā` là dây leo, `Cittalatā` là tên), lặp ở 11 tệp; (c) 9:7 `Vaggo tena pavuccatīti` dịch "được gọi tên là vậy" gượng, lặp ở 4 tệp; (d) 5:1–5:2 `virajaṁ` + `vippasannamanāvilaṁ` dịch bằng "ly trần thanh tịnh" / "tịch tịnh thanh khiết không chút bợn nhơ" — hơi dôi chữ, nhưng không đổi nghĩa; (e) 1:2 "nơi đây" là chữ thêm nhẹ, theo công thức chung của tầng (14 tệp). Các khoá còn lại (1.1–1.4, 2.x, 3.1, 5.x, 6.x, 7.1, 9.1–9.5) đã đối chiếu với Pāli, không phát hiện lỗi nghĩa.
  Chấm lại: semantic_fidelity 9.1→8.4, grammar_logic 9.2→8.8, terminology 9.0→8.3, vietnamese_clarity 9.2→8.8, ambiguity_integrity 8.9→8.3; các tiêu chí khác giữ nguyên. final_score 9.14→8.86 (trung bình số học thô). Điểm cũ chưa ghi nhận 7 lỗi nghĩa trên; điểm mới trừ nhẹ vì các lỗi họ ở mục (a)–(c) vẫn còn trong bài.
  Bất định còn lại: `…pe…` ở 2.2, 3.2, 6.2 bị lược trong Pāli nên không thể kiểm nghĩa phần bị lược; tầng tham khảo tiếng Anh và Việt hiện hành vắng nên chưa có đối chiếu độc lập.
