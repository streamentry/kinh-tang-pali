notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `vv`.
  Bài này là bài thứ 11 của phẩm Cittalatā và là hàng xóm sát của vv27 (bài thứ 10) nên 15 khoá dùng lại nguyên văn bản Việt của vv27 với Pāli trùng: `“Với dung sắc rạng rỡ thù thắng,` / `nàng đang đứng nơi đây, này thiên nữ;` / `Chiếu sáng khắp mọi phương trời,` / `rực rỡ tựa như sao mai.` / `Do đâu nàng có được dung sắc như thế,` / `…` / `và sắc tướng nàng chiếu sáng khắp mọi phương?”.` / `Nữ thiên ấy hoan hỷ,` / `quả báo của nghiệp này là thế.` / `“Thuở trước giữa loài người tôi là một phụ nữ,` / `trong kiếp sống trước ở nhân gian.` / `tịch tịnh thanh khiết không chút bợn nhơ;` / `Tôi đã dâng cúng vật thực lên Ngài,` / `với tâm tịnh tín bằng chính đôi tay mình.` / `Nhờ vậy tôi có được dung sắc như thế này,`.
  `Tassuddānaṁ` dùng `Tóm lược:` (281×); 7 câu kệ liệt kê tên (9.1–9.7) giữ tên Pāli vì đó là danh sách tên các cung điện trong phẩm, và tầng cũng giữ tên Pāli ở `Phẩm Cây Hoa Cittalatā`. `bhikkhāya dāyikā` dịch `nữ thí vật thực cho tỳ-kheo` theo cách đã dùng ở vv27:0.4.
  Bất định còn lại: `Bhāṇavāraṁ paṭhamaṁ.` (11.1) — Pāli nói `phần đầu của chuyên luận`, trong khi vv28 thực tế mở đầu phần chuyên luận thứ hai của bộ `vv`; dịch theo chữ nghĩa là `Chuyên luận, phần thứ nhất.` và ghi bất định này ở đây để biên tập quyết. `Itthivimāne dutiyo vaggo.` dịch `Trong Cung Điện Nữ Hư Không, đây là phẩm thứ hai.`
  `Addasaṁ virajaṁ bhikkhuṁ,` dùng `Tôi trông thấy vị tỳ-kheo ly trần thanh tịnh,` (1× ở vv59:6.1) vì Pāli ở đây là `bhikkhuṁ` chứ không phải `buddhaṁ` như vv27.
  `…pe…` giữ một dấu lược.
