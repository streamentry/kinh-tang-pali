notes: |-
  CHỐT LƯỢC TỪNG VẾ. (1) Ucce sakuṇa ở 1.1 là hỡi con chim ở chốn trời cao; vihaṅgama ở 1.2 là hỡi kẻ có cánh, nên tôi chia hai tầng xưng hô ở hai vế như Pāli. (2) taṁ me tapati no idaṁ ở 2.4: cái ấy sẽ thiêu ta chứ không phải cái này, tôi dịch cháy lòng vì chỗ ấy chứ không phải chỗ này. (3) uppalasannāho ở 3.1: sannāha là dầu thơm, mỡ xoa; tôi dịch mỡ thơm hoa sen xanh. Rouse dịch vế này thành áo lót sen, nhưng asmraka/annāha không phải áo, nên tôi theo nghĩa từ điển. (4) nikkhañcussīsakohitaṁ ở 3.2 là đã nghiền trên đá mài. (5) Kāsikañca muduṁ vatthaṁ: kāsika là vải dệt bằng cỏ kāsa, tôi giữ chữ kāsa có dấu. (6) dhanikā piyā ở 3.4 là người yêu thương thân xác mỏng manh, tôi dịch người yêu thương của ta.

  ĐÂY LÀ BÀI RÕ NHẤT LÁT. Câu chuyện là người đàn ông bị đóng đinh, gọi chim cầu tin cho vợ; tôi tra Rouse (sutta khác sacred-texts/bud/j2/j2150.htm) và bốn vế kệ khớp đúng truyện.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của kiểm cổ chỉ quét khoá Pāli từ 40 ký tự trở lên; ở bảy bài Jātaka của lát này mọi vế kệ đều ngắn hơn ngưỡng đó (vế dài nhất 35 ký tự) nên assertion về bản chất KHÔNG chạy. Tôi tự quét lại TOÀN BỘ 238 khoá của 14 bài từ tệp đã ghi trên đĩa: đủ khoá và không thừa so với Pāli (sắp theo thứ tự số), không rỗng, chuỗi NFC, số dấu lược khớp từng khoá, không có (…), không thừa dấu lược, và số dấu nháy kép so với Pāli từng khoá. Kết quả: 0 lỗi trên 238 khoá.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… hay dấu lược — đã kiểm bằng script trên từng khoá. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không mở rộng, không nén, không có (…) đứng một mình.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Tôi tự dựng chỉ mục Pāli↔Việt bằng script: nạp 5.764 tệp Pāli trong .cache/upstream/suttacentral/root/pli (bỏ *.apfs-orphan) và 4.136 tệp Việt dự án trong content/translation/vi/project/sutta — tổng 112.947 khoá Việt — ghép theo khoá, rồi quét từng khoá thân bài của lát theo nguyên văn căn thẳng và theo dạng đã chuẩn hoá dấu câu, nháy kép, hoa thường, và loại bỏ chính 14 tệp của lát để đo đúng trạng thái trước khi tôi ghi. Kết quả: 44 cặp Pāli trùng ở thân bài, 42 trùng byte-for-byte và 2 trùng sau chuẩn hoá. Trong đó 33 cặp đã có bản Việt ở bài khác, tôi DÙNG LẠI NGUYÊN VĂN ở: ja275 2.3, 2.4, 3.1, 3.2, 3.3, 3.4 ← ja274; ja294 3.1 ← sn1.1; mil3.1.11 3.2 và 3.3 ← sn10.12:5.2 và 5.3 (tôi lấy cả bộ bốn vế ở sn10.12:5.1–5.4 để bài này không tự mâu thuẫn với bài nguồn); Opammaṁ karohī ở mil3.1.11:2.1, mil3.1.14:2.1, mil3.1.15:2.1, mil3.2.2:2.1, mil3.5.10:2.1, mil3.7.16:2.1; mil3.1.14 3.1 ← mil3.1.12:3.1 và 3.5 ← mil3.1.12:3.4; Kallosi ở mil3.1.11:4.1, mil3.1.14:4.1, mil3.1.15:3.1, mil3.2.2:3.1, mil3.2.9:2.1, mil3.5.10:3.1 ← 54 tệp mil khác; mil3.2.2 2.4 ← mil3.5.9:2.3; mil3.5.10 6.1 ← mil3.4.10:5.1 và mil6.2.10:5.1; mil3.7.16 5.1 ← mil3.1.16:6.1. Mười một cặp còn lại thì chưa bản Việt nào ở bài khác có, tôi phải đặt mới: ja294 2.1 và 2.2, ja295 2.1 và 2.2 (bốn khoá này là hai cặp trùng nhau — chính bài trong lát đã trùng nhau; tôi đặt một lần rồi dùng lại nguyên văn cho cả hai bài), ja295 1.3 và 1.4 (trùng ja308:1.3 và 1.4), ja297 1.2 (trùng ja429:6.2 và ja430:6.2), ja298 1.2 (trùng sáu chỗ trong ja547), mil3.1.11 1.3 và 2.4 (trùng nhau, chỉ khác ở dấu nháy) và mil3.2.9 5.1 (trùng mil6.1.9:12.1). Ghi lại đây để lát sau dùng lại nguyên văn của tôi thay vì dịch lần hai.

  MỌI CÔNG THỨC HỘI THOẠI ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN. Rājā āha— → Vua nói: (đếm trong tầng mil có 30 tệp dùng Vua nói: và 12 tệp dùng Vua nói—, tôi theo đa số; 11 tệp còn lại dùng Vua nói:—). Thero āha— → Trưởng lão nói: (3 tệp dùng dạng có dấu hai chấm và 3 tệp dùng dạng có gạch nối, hòa nhau; tôi chọn dạng có dấu hai chấm để nhất quán với Vua nói: trong chính lát này). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā. (54 tệp mil, chỉ một cách). Opammaṁ karohī → Xin hãy xét một thí dụ ti. (đúng mil3.1.12:2.1, mil3.2.7:2.1, mil3.2.8:2.1). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa ti. (đúng mil3.1.12:3.1). Bhāsitampetaṁ, mahārāja, bhagavatā— → Điều này, này Đại vương, Đức Thế Tôn đã nói — (đúng mil3.1.12:3.4). Imasmiṁ vagge dasa pañhā và Imasmiṁ vagge soḷasa pañhā → Trong phẩm này có … câu hỏi. (đúng mil3.4.10:5.1, mil6.2.10:5.1, mil3.1.16:6.1). Rājā → vua, Mahārāja → Đại vương, bhagavā/bhagavatā → Đức Thế Tôn hoặc Đức Thật Chứng Ấy, Thero → Trưởng lão, Kāma → tình dục, sīla → đức hạnh.

  TÊN PHẨM ĐÃ CHỐT. Tikanipāta → Bộ Ba Bài Kinh (bốn bài lân cận đã có: ja276, ja291, ja292, ja293). Udapānavagga → Phẩm Nước Uống (đúng ja276 và ja279; tôi tự đếm bằng script trên Pāli gốc: 10 bài mang tên phẩm này là ja271..ja280, và ja275 nằm trong đúng khoảng đó). Kumbhavagga → Phẩm Bình Vò: tên này CHƯA có trong bảng chốt của BRIEF_VI3 §11, nên tôi theo đa số trong chính phẩm đang làm — ba bài đã có (ja291, ja292, ja293) đều dùng Phẩm Bình Vò; tôi tự đếm Kumbhavagga chiếm đúng ja291..ja300, trong đó lát này có sáu bài. Người biên tập nếu muốn chốt khác thì phải sửa cả mười bài cùng lúc. Các tên phẩm Milindapañha cũng theo đúng bầy bài lân cận: Mahāvagga → Đại Phẩm, Addhānavagga → Phẩm Khoảng Thời Gian, Buddhavagga → Phẩm Đức Phật, Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc.

  STATUS. Hai blocking error ở trên là thật và đo được (thiếu hẳn tầng Anh Sujato tại commit đã ghim; coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên mọi bài lát này đặt draft bất kể final_score. Tôi không nâng điểm để né blocker và cũng không hạ điểm để tỏ ra thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có tầng tham khảo nào.

  Giải quyết draft 2026-10-12: kiểm toán độc lập đọc đối kháng 17 khoá từ Pāli. Mục "CHỐT LƯỢC TỪNG VẾ" ở trên (các điểm 1–6, riêng 1 vẫn đúng) và bốn vế của khổ 1–3 bị thay thế bằng phần này; các mục về lát 14 bài vẫn là lịch sử của lát cũ. Căn cứ đối chiếu: Pāli root đã ghim; chú giải Jātaka (Jātakaṭṭhakathā) glossa từng cụm của chính ba kệ này (vajjāsi = vadeyyāsi; pattayāno = đi bằng cánh; vihaṅgamo = đi trên không; ciraṃ karissati = nàng sẽ kéo dài việc chờ ta đến; uppalasannāho = áo giáp làm như hoa sen; nikkha = vật bằng vàng, năm suvaṇṇa; kāsikaṃ = vải Kāsi; ussīsake ṭhapitaṃ = đặt ở phía đầu; tappatu dhanakāmiyā = người yêu ham của cải được thỏa lòng); bản Anh Rouse (Cowell, ấn bản Cambridge) chỉ đọc để hiểu cách đọc, không chép câu chữ và không phải tầng đã ghim.
  Khoá đổi (10/17, đều là lỗi nghĩa thật ở bản cũ): 1.3 (vajjāsi là "ngươi hãy nói/nhắn", không phải "hãy đi đến"; bản cũ còn thêm "vợ ta", Pāli chỉ nói vāmūruṁ là người có đôi đùi đẹp; tiền lệ vajjāsi = nói/chuyển lời: 9 khoá ở sn9.14, sn10.5, ja538, ja547, ja540, ja392, vv81, đều là nói); 1.4 (sā karissati không phải "thời gian ấy bà sẽ thấy dài"; theo chú giải là nàng sẽ phải chờ lâu); 2.1–2.2 (asiṁ sattiñca = gươm và giáo, bản cũ "giáo đao với giáo nhọn" thừa một "giáo" và "ở đó" không có trong Pāli; oḍḍitaṁ = đã đặt sẵn, tiền lệ oḍḍita = giăng/đặt ở 10 khoá); 2.3 (caṇḍī = nóng nảy, tiền lệ mn21:9.45; kāhati kodhaṁ là sẽ nổi giận, bản cũ đọc thành mệnh đề thời gian "khi nổi giận"); 2.4 (tapati = thiêu đốt, idaṁ là điều này, tức việc đang bị xiên, không phải "chỗ này"; bản cũ đọc idaṁ như idha trong bản PTS); 3.1 (sannāha là áo giáp, tiền lệ sn45.4:10.3 và bv26:45.4 là giáp; bản cũ "mỡ thơm", lấy sannāha làm dầu xoa, là sai hẳn); 3.2 (nikkhañcussīsakohitaṁ = nikkhaṁ ca + ussīsake + ohitaṁ, tức nikkha và việc đặt ở phía đầu; bản cũ "đã nghiền trên đá mài" là sai hẳn; nikkha để nguyên có tiền lệ ở ja543:44.3, ja494:14.2, ja478:13.3, vv20:8.1); 3.3 (Kāsika là vải xứ Kāsi, không phải "cỏ kāsa"; tiền lệ ja544:71.1 và 5 khoá khác là "vải Kāsi", an3.39 là "xứ Kāsi"); 3.4 (xem bất định bên dưới). Giữ nguyên 1.1, 1.2, tiêu đề (0.2–0.4) và 4.1; 1.2 trùng Pāli nguyên văn với ja429:6.2 và ja430:6.2 (hai nơi), bản Việt hai nơi ấy là "hỡi kẻ có cánh đang sải cánh bay" nên giữ nguyên văn cho nhất quán, dù pattayāna chính xác hơn là "đi bằng cánh". Cặp trùng Pāli nguyên văn ngay trong bài này: 0 cặp (đã dò trong 17 khoá).
  Blocker đã gỡ: blocker thứ hai (coverage Anh "0 trên 0" dưới ngưỡng, chưa có mục reference-gaps) do tác giả cũ tự đặt, không phải lỗi văn bản: mẫu số 0 nghĩa là cổng không đo được gì, không phải bài dưới ngưỡng; và mọi vế đều ngắn hơn 40 ký tự nên không khoá nào được tính. Bài không có tầng Anh nào ở bất kỳ khoá nào (không riêng khoá Sujato bỏ trống), nên mọi khoá đều đứng trên Pāli một mình, và tôi đã đọc từng khoá 1.1–4.1 từ Pāli với chú giải. Blocker còn giữ: blocker thứ nhất (Sujato không có bài này tại commit đã ghim; Việt hiện hành, tầng Việt tham khảo, cũng chỉ có Pháp Cú ở commit này, nên bài cũng không có tham khảo Việt truyền thống) là sự thật về upstream, chờ waiver no-upstream-english của người biên tập xử lý. triangulation 7,0 (≤ 8,0): chỉ có Pāli root, chú giải và một bản Anh ngoài ghim đọc để hiểu, không có bản Anh độc lập đã ghim.
  Bất định còn lại, đều ghi ở đây chứ không đưa vào thân kinh: (a) 3.4 dhanikā piyā: dhanika thường nghĩa là "giàu có" hoặc "chủ nợ", nhưng chú giải glossa là dhanatthikā ("ham của cải") và bản PTS đọc dhanakāmiyā, nên tôi chọn "người yêu dấu ham của cải"; cách đọc khác là "người yêu dấu giàu có". (b) 1.4 ciraṁ kho sā karissati: động từ karissati cùng ciraṁ không có tiền lệ trong kho; tôi theo chú giải (nàng sẽ kéo dài sự chờ đợi vì không biết tin) nên dịch "sẽ còn chờ đợi lâu"; cách đọc thay thế là "nàng sẽ chậm trễ (không đến)". (c) 3.1 uppalasannāho: chú giải nói là áo giáp làm giống hoa sen xanh; tôi giữ "bộ giáp sen xanh", không giải thêm. (d) 3.2–3.3: ohitaṁ/ussīsake có thể trải qua cả khổ 3 (cả giáp, nikkha và vải đều đặt nơi đầu nằm, đúng theo chú giải ghare ussīsake ṭhapitaṃ); tôi ngắt vế ngay trước vải để giữ ranh giới khoá.
