notes: |-
  Đợt 19, làn 54. Dịch từ Pāli root commit đã ghim, đủ 73/73 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; người nói của từng đoạn không được ghi vào thân kinh mà chỉ đọc từ ngữ cảnh kệ.

  **Tiêu đề, theo khuôn các bài anh em cùng phẩm.** `0.2` “Bộ Mười Ba Bài Kinh” và `0.3` “Phẩm Xoài” dùng lại nguyên văn từ `ja475:0.2`, `ja475:0.3`, `ja478:0.2`, `ja478:0.3`, `ja481:0.2`, `ja481:0.3` (cùng `Terasakanipāta` + `Ambavagga`). `0.4` “6. Kinh Kāliṅgabodhi” giữ nguyên tên Pāli theo khuôn “N. Kinh <tên>” của `ja475`, `ja478`, `ja481` và theo cách `ja443:0.4` giữ “Kinh Cūḷabodhi”; `17.1` “Kinh Kāliṅgabodhi, thứ sáu.” theo `ja475:14.1` (có dấu phẩy trước số thứ tự). `chaṭṭhaṁ` = 6, khớp số “6.” ở tiêu đề.

  **Tiền lệ và trùng nguyên văn.** Đã dò tầng `kn/ja` với 12 cụm chính (`cakkavatti`, `mahārāja`, `buddhā`, `sabbaññū`, `kuñjara`, `nāga`, `pañjali`, `taramāna`, `anusāsaṁ`, `vāha`, `pūjesi`, `namo karohi`): nhiều cụm có ít tiền lệ cùng dạng nên một phần lựa chọn dưới đây là quyết định theo ngữ cảnh bài; số đếm của `cakkavatti`, `taramāna`, `koñca`, `anadhivara` và `namo karohi` đã đo lại ở lượt cải thiện 2026-10-11 (xem cuối) và đã sửa theo đa số. Pāli trùng nguyên văn với bài khác (so sau khi bỏ dấu câu và hoa/thường, toàn tầng): 3 cặp, 0 cặp bản Việt khác về nghĩa — `12.3` với `dn21:2.9.33` (chỉ khác “ông”/“Ngài” theo người được xưng), `12.4` với `thag16.1:18.1`, `16.1` với `pv21:50.1` (giống hệt “Sáu mươi ngàn xe,”). Pāli trùng nguyên văn TRONG CHÍNH bài: 73 khoá, 0 nhóm trùng (đã nén khoảng trắng) ⇒ phép này chạy rỗng, không tuyên bố “0 lỗi”.

  **Số Pāli.** `saṭṭhi vāhasahassāni` (16.1) = saṭṭhi 60 × sahassa 1.000 = 60.000 ⇒ “sáu mươi ngàn xe” (thang `ngàn` nhân cả 60, không nhân riêng chữ số); `vāha` dịch “xe” theo nghĩa “xe chở / một xe đầy” (cùng cách `ja240:3.1` “cỗ xe củi”, 1 tiền lệ). `chaṭṭhaṁ` = 6. Không có cụm số chưa phân xử được như `Tiṁsakappasahassa`.

  **Thuật ngữ và tiền lệ đã đo.**
  - `cakkavatti` (1.1) → “vị Chuyển Luân Vương”: 640 khoá toàn tầng có `cakkavatt-`, dạng “Chuyển Luân Vương” 273 + “Chuyển luân vương” 129, “vua Chuyển Luân” 83, “vị Chuyển Luân Vương” 37; “bậc Chuyển Luân” trần không có tiền lệ.
  - `nāga` (1.4, 6.1, 7.1, 8.3, 9.2, 10.2, 11.2, 11.4…) → “voi”: trong bài này `nāga` luôn đi cùng `kuñjara`, `danti`, `khīṇāyuka` (chỉ voi); tầng `ja` dịch `nāga` thành “voi/rắn/rồng” tuỳ bài (ví dụ `ja27:1.4`, `ja105:1.3`, `ja253:3.3`), nên chọn theo ngữ cảnh bài này.
  - `buddhā` → “chư Phật”, `sambuddho` → “bậc Chánh Giác”, `abhisambuddhā` → “các bậc đã giác ngộ viên mãn”, `anadhivarā` → “vô thượng” (đa số tầng: `vv16`, `bv1` 9/9 khoá dịch `anadhivara` là “vô thượng”; `anuttara` ở 16.4 cũng “vô thượng”, hai từ gần nghĩa nên không tách), `sabbaññū` → “toàn tri”, `sabbadassāvī` → “toàn kiến”, `sabbavidū` → “bậc biết mọi điều”. `ja` dùng “Đức Phật” (7 khoá, số ít) và “bậc Chánh Đẳng Giác” cho `sammāsambuddha` (3 khoá); không có tiền lệ cho số nhiều `buddhā` (chỉ `ja1` “chư Phật” 1 lần ở toàn tầng `ja`), nên chọn “chư Phật”.
  - `veyyañjanika` (8.2, 11.5, 13.3) → “người xem tướng”: 0 tiền lệ trong tầng `ja`; chọn theo 14.2 `na lakkhaṇena jānanti` (biết bằng `lakkhaṇa` “tướng”) để hai chỗ nhất quán. Nghĩa “thầy xem tướng / người đoán điềm” tương đương.
  - `bodhi`, `sambodhi`, `bodhimaṇḍa` (1.3, 15.1, 16.4) → “Bồ-đề”, “Bồ-đề”, “đạo tràng Bồ-đề” (không thêm “cội/cây”: Pāli chỉ nói `bodhi`; 0 tiền lệ `bodhimaṇḍa` trong `ja`).
  - `maṇḍa` (4.3, 5.3) → “phần tinh túy” (nghĩa gốc `maṇḍa` = kem, phần tinh túy), để người đọc không bị buộc phải đồng nhất với `bodhimaṇḍa` ở 16.4 nếu Pāli không nói; xem bất định 3.
  - `mahārāja` → “tâu đại vương” (xưng hô): đo lại 154/185 khoá `ja` có `mahārāja` dùng “tâu đại vương”; người nói là bà-la-môn thưa với vua.
  - `koñca` (9.2) → “chim diệc”: tầng có 3 khoá dịch `koñca` là “diệc” (`ja546:121.1`; `ja547:720.1` và `ja547:720.4`, cùng thành ngữ voi rống kiểu `koñca`), 2 khoá khác không nêu chim (`ja514:24.1`, `ja547:78.3` chỉ “rống”); “sếu” không có tiền lệ. Nghĩa sinh học (diệc hay sếu) không phân xử được; theo tầng.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli có “ ở 3.1, 10.5, 12.3, 13.3 và ” ở 8.4, 10.6, 12.4, 14.4; Việt đúng cùng khoá, lệch 0/73. Pāli mở nháy ở 3.1 và đóng ở 8.4 (không có dấu mở lại ở 8.x) nên bản Việt cũng không thêm dấu mở ở 8.3. Nháy đơn `‘’`, dấu lược `…` và `(…)`: Pāli 0, Việt 0.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `samaṇakolaññaṁ` (2.2) và `cakkaṁ vattayato pariggahetvā` (2.3): đã phân xử được một phần. `mil6.1.7:9.1` (Pāli) viết `kāliṅgarājā samaṇakolañño` — `samaṇakolañña` là danh hiệu đi liền với vua Kāliṅga, nên đọc là đồng vị với `rājānaṁ kāliṅgaṁ` (“vua Kāliṅga, vị sa-môn Kolañña”), và vua là người được thưa, không phải người thưa (`rājānaṁ` đối cách; bản Việt trước thiếu dấu hiệu người nhận lời nên dễ đọc nhầm vua là chủ ngữ — đã thêm “với” ở 2.2). Vẫn không phân xử được: nghĩa của hợp từ `samaṇakolañña` (cũng có thể là tên dòng họ), và `pariggahetvā` (“đón nhận” theo cách đọc hiện tại; các tiền lệ trong tầng là “giữ/đỡ/nắm lấy” nhưng đều có tân ngữ rõ ở cùng câu, còn ở đây tân ngữ không hiện) — câu 2.3 vì thế vẫn mơ hồ trong tiếng Việt. Cả hai cách đọc không đổi ý chính của đoạn (bà-la-môn Kāliṅga Bhāradvāja chắp tay thưa với vua).
  2. `bhūmibhāgo yathā samaṇuggato` (3.2): dịch “khoảnh đất này như nhô lên đều đặn” (`sama` + `uggata`); không có bản Anh để so, và `samaṇuggato` cũng có thể tách khác.
  3. `maṇḍo` (4.3, 5.3): dịch “phần tinh túy” theo nghĩa từ vựng; truyền thống chú giải thường đồng nhất với `bodhimaṇḍa` (đạo tràng Bồ-đề), nhưng bản Pāli ghim không nói rõ nên không đưa vào thân kinh. Hệ quả cần nói thẳng: cùng một từ `maṇḍa` mà bản Việt có hai cách (4.3, 5.3 “phần tinh túy”; 16.4 “đạo tràng”), người đọc sẽ không thấy hai chỗ nối nhau; `mil6.1.7:9.1` (`bodhimaṇḍassa uparito gantuṁ`: voi không thể vượt lên trên đạo tràng) phù hợp với việc 6–7 nói về ranh giới voi không qua được, nhưng vẫn không chứng minh được `maṇḍa` ở 4.3 là chính nơi ấy.
  4. `mante` (4.4): dịch “trong các thần chú” (`manta` = thần chú/lời chú Vệ-đà); cũng có thể là “trong lời bàn bạc”.
  5. `ettāvatā padesaṁ` (6.3) và `ettāvatā padeso` (7.3): tôi đọc 6 là “chỉ đến chừng này, [còn vùng đất ấy] voi không tiến vào” và 7 là “vùng đất đến chừng này, voi có thể đến được”, hai câu nhất quán với 8–9 (voi lùi lại, ngồi xuống). Nếu hiểu `ettāvatā` khác thì hai câu có thể đảo nghĩa; `Abhijāto nāgo` (7.1, danh cách) đứng như tính ngữ treo, tôi dịch “con voi dòng giống cao quý, tùy ý, xin hãy sai con voi chúa có ngà đi”.
  6. `yathimassidaṁ vacanaṁ` (8.4): dịch “lời nói này của ông ấy ra sao”; `yathā` có thể là “như thế nào / có đúng không”.
  7. `Āgamabalasā hi mayaṁ` (14.3): khuyết vị ngữ trong Pāli; tôi bổ “biết” từ `jānanti` ở 14.2 và dịch `āgama` là “sự truyền thừa”.
  8. `manupāyāsi` (15.4): đọc là `anupāyāsi` với âm `m` chen vào (cùng kiểu `mupayanti` 6.4, `mupagantuṁ` 7.4), dịch “tiến đến”.
  9. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 3–7: bà-la-môn Kāliṅga Bhāradvāja thưa với vua; 8–9, 11: kể; 10: bà-la-môn; 12: vua; 13–14: bà-la-môn.

  **Coverage English (mục 7):** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng là 32 ký tự (< 40) nên 0/73 khoá có nội dung; các khoá `:0.x` bị loại. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja479` (manifest chỉ liệt kê tệp Pāli `kn/ja/ja479_root-pli-ms.json`); `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Không đụng `content/meta/reference-gaps.yaml`.

  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  **Lượt cải thiện 2026-10-11.** Đọc đối kháng cả 73 khoá, đo lại tiền lệ toàn tầng, tìm tuyến song song trong Pāli. Đổi 9/73 khoá (giữ nguyên tập khoá và thứ tự; không đụng Pāli):
  - `1.1` “bậc Chuyển Luân” → “vị Chuyển Luân Vương” (thuật ngữ, theo đa số: xem số đếm ở mục thuật ngữ).
  - `2.2` thêm “với” trước “vua Kāliṅga” (sửa ngữ pháp: `rājānaṁ` là người nhận lời; bản trước đọc được thành vua là người chắp tay thưa).
  - `3.3` “tối thượng” → “vô thượng” cho `anadhivarā` (thuật ngữ, theo 9/9 tiền lệ).
  - `5.4` “đảnh lễ” → “kính lễ” cho `namo karohi` (thuật ngữ; `mn23:2.42`, `mn23:4.39`, `sn7.9:16.3`, `pv35:9.3` đều “kính lễ”; thêm 110 khoá `namo` dùng “kính lễ” so với 26 “đảnh lễ”).
  - `9.2` “chim sếu” → “chim diệc” (thuật ngữ, theo 3 khoá của tầng, 0 khoá “sếu”).
  - `10.4`, `11.2` “vội vàng” → “vội vã” cho `taramāno` (tầng: 11 khoá “vội vã”, 3 khoá có cả “vội vàng”; trong `ja` 4/4 là “vội vã”).
  - `13.1` “nói với Kāliṅga” → “với Kāliṅga” (bỏ chỗ lặp “nói … nói” giữa 13.1 và 13.2; không đổi nghĩa).
  - `15.2` “nhạc khí” → “nhạc cụ” (tầng 10 khoá “nhạc cụ”, 0 “nhạc khí”).
  Đã đo mà không đổi: `toàn tri, toàn kiến` (`sabbaññū sabbadassāvī`, khớp `an3.74`, `mn14`, `mil3.6.2`, `thag16.1`), `tâu đại vương`, `sáu mươi ngàn xe` (giống hệt `pv21:50.1`), `thần chú` cho `mante` (tầng dùng “thần chú” 33, “thánh chú”, “bài tụng”), `truyền thừa` cho `āgama` (khớp `an4.160`), `đạo tràng Bồ-đề` (khớp `bv2`, `bv21`, `bv26`), `Bộ Mười Ba Bài Kinh` / `Phẩm Xoài` (khớp ja474–ja482).
  Điểm đổi: `grammar_logic` 8,7 → 8,8 (sửa 2.2, 13.1; 2.3 vẫn không có tân ngữ nên không nâng thêm); `terminology` 9,0 → 9,2 (năm cụm đã sửa theo đa số đo được; `maṇḍa` hai cách và `veyyañjanika` 0 tiền lệ vẫn còn); `triangulation` 7,0 → 7,2 (tìm thêm tuyến song song Pāli `mil6.1.7:9.1`; vẫn không có bản Anh, không có tầng Việt hiện hành). Giữ nguyên: `semantic_fidelity` 8,8 và `ambiguity_integrity` 9,0 (các bất định 2–9 chưa phân xử thêm được), `vietnamese_clarity`, `han_viet_balance`, `source_provenance`, `segment_alignment`, `technical_integrity`. Các số “0 tiền lệ” và “0 cặp trùng” ở ghi chú đợt đầu (Pāli trùng, `taramāna`, `koñca`) là đo thiếu, đã sửa ở trên.
