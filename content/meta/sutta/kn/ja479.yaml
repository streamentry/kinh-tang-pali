notes: |-
  Đợt 19, làn 54. Dịch từ Pāli root commit đã ghim, đủ 73/73 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; người nói của từng đoạn không được ghi vào thân kinh mà chỉ đọc từ ngữ cảnh kệ.

  **Tiêu đề, theo khuôn các bài anh em cùng phẩm.** `0.2` “Bộ Mười Ba Bài Kinh” và `0.3` “Phẩm Xoài” dùng lại nguyên văn từ `ja475:0.2`, `ja475:0.3`, `ja478:0.2`, `ja478:0.3`, `ja481:0.2`, `ja481:0.3` (cùng `Terasakanipāta` + `Ambavagga`). `0.4` “6. Kinh Kāliṅgabodhi” giữ nguyên tên Pāli theo khuôn “N. Kinh <tên>” của `ja475`, `ja478`, `ja481` và theo cách `ja443:0.4` giữ “Kinh Cūḷabodhi”; `17.1` “Kinh Kāliṅgabodhi, thứ sáu.” theo `ja475:14.1` (có dấu phẩy trước số thứ tự). `chaṭṭhaṁ` = 6, khớp số “6.” ở tiêu đề.

  **Tiền lệ và trùng nguyên văn.** Đã dò tầng `kn/ja` với 12 cụm chính (`cakkavatti`, `mahārāja`, `buddhā`, `sabbaññū`, `kuñjara`, `nāga`, `pañjali`, `taramāna`, `anusāsaṁ`, `vāha`, `pūjesi`, `namo karohi`): hầu hết chỉ có 0–1 tiền lệ cùng dạng, nên phần lớn lựa chọn dưới đây là quyết định theo ngữ cảnh bài, không phải dùng lại nguyên văn. Pāli trùng nguyên văn với bài khác đã dò: 0 cặp dùng lại. Pāli trùng nguyên văn TRONG CHÍNH bài: 73 khoá, 0 nhóm trùng (đã nén khoảng trắng) ⇒ phép này chạy rỗng, không tuyên bố “0 lỗi”.

  **Số Pāli.** `saṭṭhi vāhasahassāni` (16.1) = saṭṭhi 60 × sahassa 1.000 = 60.000 ⇒ “sáu mươi ngàn xe” (thang `ngàn` nhân cả 60, không nhân riêng chữ số); `vāha` dịch “xe” theo nghĩa “xe chở / một xe đầy” (cùng cách `ja240:3.1` “cỗ xe củi”, 1 tiền lệ). `chaṭṭhaṁ` = 6. Không có cụm số chưa phân xử được như `Tiṁsakappasahassa`.

  **Thuật ngữ và tiền lệ đã đo.**
  - `cakkavatti` (1.1) → “bậc Chuyển Luân”: tiền lệ `ja281:1.4` “vua Chuyển Luân” (1 khoá trong `ja`).
  - `nāga` (1.4, 6.1, 7.1, 8.3, 9.2, 10.2, 11.2, 11.4…) → “voi”: trong bài này `nāga` luôn đi cùng `kuñjara`, `danti`, `khīṇāyuka` (chỉ voi); tầng `ja` dịch `nāga` thành “voi/rắn/rồng” tuỳ bài (ví dụ `ja27:1.4`, `ja105:1.3`, `ja253:3.3`), nên chọn theo ngữ cảnh bài này.
  - `buddhā` → “chư Phật”, `sambuddho` → “bậc Chánh Giác”, `abhisambuddhā` → “các bậc đã giác ngộ viên mãn”, `anadhivarā` → “tối thượng” (để phân biệt với `anuttara` 16.4 “vô thượng”), `sabbaññū` → “toàn tri”, `sabbadassāvī` → “toàn kiến”, `sabbavidū` → “bậc biết mọi điều”. `ja` dùng “Đức Phật” (7 khoá, số ít) và “bậc Chánh Đẳng Giác” cho `sammāsambuddha` (3 khoá); không có tiền lệ cho số nhiều `buddhā` (chỉ `ja1` “chư Phật” 1 lần ở toàn tầng `ja`), nên chọn “chư Phật”.
  - `veyyañjanika` (8.2, 11.5, 13.3) → “người xem tướng”: 0 tiền lệ trong tầng `ja`; chọn theo 14.2 `na lakkhaṇena jānanti` (biết bằng `lakkhaṇa` “tướng”) để hai chỗ nhất quán. Nghĩa “thầy xem tướng / người đoán điềm” tương đương.
  - `bodhi`, `sambodhi`, `bodhimaṇḍa` (1.3, 15.1, 16.4) → “Bồ-đề”, “Bồ-đề”, “đạo tràng Bồ-đề” (không thêm “cội/cây”: Pāli chỉ nói `bodhi`; 0 tiền lệ `bodhimaṇḍa` trong `ja`).
  - `maṇḍa` (4.3, 5.3) → “phần tinh túy” (nghĩa gốc `maṇḍa` = kem, phần tinh túy), để người đọc không bị buộc phải đồng nhất với `bodhimaṇḍa` ở 16.4 nếu Pāli không nói; xem bất định 3.
  - `mahārāja` → “tâu đại vương” (xưng hô): `ja306:4.1`, `ja380:8.3` và nhiều chỗ khác; có tiền lệ “Đại vương”/“hỡi vua” khác nhau (7 khoá lấy mẫu), chọn “tâu đại vương” vì người nói là bà-la-môn thưa với vua.
  - `koñca` (9.2) → “chim sếu”: 0 tiền lệ trong `ja`.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli có “ ở 3.1, 10.5, 12.3, 13.3 và ” ở 8.4, 10.6, 12.4, 14.4; Việt đúng cùng khoá, lệch 0/73. Pāli mở nháy ở 3.1 và đóng ở 8.4 (không có dấu mở lại ở 8.x) nên bản Việt cũng không thêm dấu mở ở 8.3. Nháy đơn `‘’`, dấu lược `…` và `(…)`: Pāli 0, Việt 0.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `samaṇakolaññaṁ` (2.2) và `cakkaṁ vattayato pariggahetvā` (2.3): không phân xử chắc được. Tôi đọc `samaṇakolaññaṁ` là đồng vị với `rājānaṁ kāliṅgaṁ` (“vua Kāliṅga, vị sa-môn Kolañña”) và `pariggahetvā` là “đón nhận”; cách đọc khác coi `kolañña` là tên dòng họ, hoặc `pariggahetvā` là “đã quan sát”. 0 tiền lệ trong `ja`. Cả hai cách đều không đổi ý chính của đoạn (bà-la-môn Kāliṅga Bhāradvāja chắp tay thưa với vua).
  2. `bhūmibhāgo yathā samaṇuggato` (3.2): dịch “khoảnh đất này như nhô lên đều đặn” (`sama` + `uggata`); không có bản Anh để so, và `samaṇuggato` cũng có thể tách khác.
  3. `maṇḍo` (4.3, 5.3): dịch “phần tinh túy” theo nghĩa từ vựng; truyền thống chú giải thường đồng nhất với `bodhimaṇḍa` (đạo tràng Bồ-đề), nhưng bản Pāli ghim không nói rõ nên không đưa vào thân kinh.
  4. `mante` (4.4): dịch “trong các thần chú” (`manta` = thần chú/lời chú Vệ-đà); cũng có thể là “trong lời bàn bạc”.
  5. `ettāvatā padesaṁ` (6.3) và `ettāvatā padeso` (7.3): tôi đọc 6 là “chỉ đến chừng này, [còn vùng đất ấy] voi không tiến vào” và 7 là “vùng đất đến chừng này, voi có thể đến được”, hai câu nhất quán với 8–9 (voi lùi lại, ngồi xuống). Nếu hiểu `ettāvatā` khác thì hai câu có thể đảo nghĩa; `Abhijāto nāgo` (7.1, danh cách) đứng như tính ngữ treo, tôi dịch “con voi dòng giống cao quý, tùy ý, xin hãy sai con voi chúa có ngà đi”.
  6. `yathimassidaṁ vacanaṁ` (8.4): dịch “lời nói này của ông ấy ra sao”; `yathā` có thể là “như thế nào / có đúng không”.
  7. `Āgamabalasā hi mayaṁ` (14.3): khuyết vị ngữ trong Pāli; tôi bổ “biết” từ `jānanti` ở 14.2 và dịch `āgama` là “sự truyền thừa”.
  8. `manupāyāsi` (15.4): đọc là `anupāyāsi` với âm `m` chen vào (cùng kiểu `mupayanti` 6.4, `mupagantuṁ` 7.4), dịch “tiến đến”.
  9. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 3–7: bà-la-môn Kāliṅga Bhāradvāja thưa với vua; 8–9, 11: kể; 10: bà-la-môn; 12: vua; 13–14: bà-la-môn.

  **Coverage English (mục 7):** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng là 32 ký tự (< 40) nên 0/73 khoá có nội dung; các khoá `:0.x` bị loại. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja479` (manifest chỉ liệt kê tệp Pāli `kn/ja/ja479_root-pli-ms.json`); `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Không đụng `content/meta/reference-gaps.yaml`.

  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
