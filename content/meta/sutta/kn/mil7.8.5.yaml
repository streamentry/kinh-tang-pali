notes: |-
  17 khoá, tất cả đã dịch. Bài thứ 5 của `Kumbhavagga`, ngay cạnh mil7.8.1 và mil7.8.2.

  TẦNG THAM KHẢO — 0/17 có Anh Sujato. Không có bản Việt hiện hành. ⇒ `draft`.

  PĀLI TRÙNG: `0.1`, `0.2`, và `0.3` `Kumbhavagga` → *Phẩm Bình Vò* (mil7.8.2:0.3, 2 tiền lệ),
  và `2.4` `Bhāsitampetaṁ, mahārāja, bhagavatā devātidevena—` → *Đức Thế Tôn, bậc Thiên Nhân, đã
  nói trong tập kinh—* (mil7.8.2:2.5, đúng nguyên văn).

  THUẬT NGỮ MỚI (0 tiền lệ cho `agada`; riêng *thuốc* có 41 tiền lệ): `agada` → *thuốc men*;
  `saṇṭhahanti/saṇṭhapetabbā` → *ở lại được*; `paṭihanati` → *đẩy lùi*.

  **ĐẾM SỐ PHẦN TỬ Ở `2.1`.** Pāli là `daṭṭha-phuṭṭha-adiṭṭha-asita-pīta-khāyita-sāyita` —
  **bảy** phần tử, vì có `adiṭṭha` (chưa từng thấy) đứng giữa. Bản nháp đầu của tôi chỉ liệt 6 và
  làm mất `adiṭṭha`; đã sửa thành 7 vế. Công thức Luật Tạng thường là 6 (`diṭṭhaṃ phuṭṭhaṃ
  asitaṃ pītaṃ khāyitaṃ sāyitaṃ`), nên đây là chỗ **bài này dài hơn công thức quen thuộc** và tôi
  giữ đúng số của Pāli bài này, không theo số của công thức quen.

  BẤT ĐỊNH CHƯA PHÂN XỬ: `mānadiṭṭhi` ở `2.2` tôi dịch *ngã mạn* (71 tiền lệ trong tầng);
  chú giải Pāli hiểu là *thứ độc* thứ tư gồm tham sân, vô minh, ngã mạn — nên *ngã mạn* là cách
  đọc theo bản đồ ba lậu, còn *học kiến sai lầm* là cách đọc về nghĩa của *diṭṭhi*. Bản chọn ở
  đây là *ngã mạn*. Ba câu kệ `3.1–3.4` tôi dịch *Nhìn toàn thể các hành / người hành trì mong
  muốn thấy / hãy dùng thuốc men / để trừ diệt độc của oan trầu*; Pāli không nêu nguồn nên tôi
  không ghi tên bài kinh.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
