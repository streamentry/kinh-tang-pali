notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá :4.2 — “Bạch Thế Tôn, con muốn nói! Bạch Thiện Thệ, con muốn nói!” → “Con có cảm hứng muốn nói, bạch Thế Tôn! Con có cảm hứng muốn nói, bạch Thiện Thệ!” (`paṭibhāti maṁ` = điều muốn nói hiện đến, cảm hứng; 5/9 khoá cùng Pāli của sn8.7, sn8.8, sn8.11 dùng đúng dạng này). Giữ nguyên :4.4 (“Rồi Tôn giả Vaṅgīsa … dùng những kệ thích hợp tán thán Ngài”): khác bản số đông chỉ ở lối mở câu (`Atha kho` → “Rồi”, đồng nhất với :4.1 của bài).
