notes: |-
  Tầng tham khảo: KHÔNG có bản Anh Sujato tại commit đã ghim cho bài này — đếm bằng script, trong cache đã ghin không có tệp nào khớp uid này (0/15 khoá); cũng không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya. Bài này vì thế chỉ dịch từ Pāli, triangulation chấm 7.0 và status giữ draft; xem blocking_errors.

  Đủ 15/15 khoá. Đã đọc hết Pãli lát f120.pali.txt trước khi viết.

  Vicāravagga → “Phẩm Khảo Sát” (tiền lệ `mil3.3.10`, `mil3.3.13`). Tiêu đề theo khuôn của
  cùng phẩm: `…lakkhaṇapañha` → “Câu hỏi về đặc trưng của X” (mẫu `mil3.3.9`, `3.3.10`,
  `3.3.13`). `cetana` tôi dịch “ý chí” (24 chỗ trong tầng), CỐ TÌNH không dùng “tưởng” vì
  `saññā` ở `mil3.3.10` đã chiếm chữ “tưởng” — dùng lại sẽ tự mâu thuẫn trong cùng phẩm.

  Bất định đã ghi nhận. `abhisaṅkharaṇa` không có tiền lệ trong tầng (0 chỗ cho “công thức”,
  “công thức nhận thức”, “y hình vọng”), tôi đặt mới “được quy tụ” vì nghĩa của nó là quy tụ
  về một việc, và `cetayita` tôi dịch “có chủ ý”. Đây là hai chỗ người đọc khác có thể đề
  nghị, và chúng đã được ghi ở cả 1.2 và 3.4 để tiêu đề và câu kết không lệch nhau.

  LỖI ĐÃ BẮT Ở LƯỢT REVIEW ĐỐI KHÁNG. Bản nháp dịch `sappinavanītatelamadhuphāṇitaṁ` là
  “pha thuốc ngọt, thơm, mật ong trộn với mật đặc”; chữ “thơm” không có trong Pāli và là
  chữ thêm, đã bỏ. Cùng lúc đó `attanā` tôi dịch “tự mình” thay vì “tự”, để giữ đủ hai vế
  (tự uống và rót cho kẻ khác) như Pāli.

  Tiền lệ đếm được và dùng lại: `Kallosi, bhante nāgasenā`ti. → 46 tệp đã có dùng
  “Khéo lắm, thưa tôn giả Nāgasenā.”, tôi theo đúng; `Opammaṁ karohī`ti. → “Hãy xét một
  thí dụ”ti. (4 tệp so với 3 tệp dùng “Xin hãy xét…”); `duggati` → “cảnh giới khổ”,
  `vinipāta` → “hoại diệt”, `sugati sagga` → “điều lành, cõi trời”, `anusikkhanti` → “làm theo”.

  Dấu lược: bài không có `…pe…`; hai phía đều 0.

  Kiểm kỹ thuật: save_vi chạy sạch; vì mọi khoá Pāli ở lát này ngắn hơn 40 ký tự (khoá dài nhất 39) nên tập `cần` trong _hvi.kiểm rỗng và các assertion NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy, tôi tự quét lại MỌI khoá bằng chính các hàm đó (pal, lược, lọt_pāli, ngoặc, _TỪ): đủ 15/15 khoá, đúng ID, thứ tự khoá y hệt Pāli, không rỗng, không thừa, mọi chuỗi NFC, không trùng nguyên văn Pāli (trừ 0.1 là tên bộ Kinh, đúng như tiền lệ), số dấu lược khớp Pāli từng khoá, nháy kép cân trên cả bài và khớp đúng số mở/đóng của từng khoá Pāli, không còn (…), toàn bộ chữ cái là script Latin. Đợt này cấm chạy cổng nên technical_integrity = 9.6, KHÔNG phải 10.0; bốn lệnh npm run validate | test | check | build để người điều phối chạy.
