notes: |-
  Đã đọc HẾT p49.txt (40 khoá) trước khi viết. `bhante` / `mahārāja` đang tách
  hướng trong tầng mil, nên tôi ĐO LẠI trong chính `mil` bằng script khớp từng
  khoá Pāli với bản Việt (428 khoá có `bhante` và không có `thera`): `bhante` →
  `tôn giả` **244**, `ngài` **139**, `đại đức` **45**; `mahārāja` → `đại vương`
  **1100/1227**. Tôi theo `tôn giả` cho `bhante` và `đại vương` cho `mahārāja`, và
  giữ nhất quán cả ba bài mil của lát. Cần ghi rõ mâu thuẫn: công thức riêng
  `Sādhu, bhante nāgasena, evametaṁ tathā sampaṭicchāmī` (31 khoá mil) có đa số
  CỤA CHÍNH CÔNG THỨC là `thưa ngài Nāgasena` (13/30) và `bạch ngài` (10/30), chỉ
  2 là `tôn giả`; bài kề mil6.3.7:5.2 lại dùng `thưa tôn giả`. Tôi chọn
  `tôn giả` để **bài trong lát không tự mâu thuẫn**, và ghi đây là chỗ người biên
  tập có thể muốn gộp lại.

  `Ayampi ubhato koṭiko pañho tavānuppatto, so tayā nibbāhitabbo` →
  `Đây là câu hỏi hai đầu đã đến với ngài, xin ngài hãy giải quyết` (đo trong mil:
  `hai đầu` **20/24**, `lưỡng đầu` 2, `hai ngọn móc` 2). `”ti` cuối khoá giữ
  nguyên theo quy ước đo được (406 khoá mil, 24 khoá pv).

  Tên khoá: `Milindapañha` giữ Pāli (177 bài mil đã merge), `Meṇḍakapañha` giữ Pāli
  (17/27), `Paṇāmitavagga` giữ Pāli (5/8, đa số ở khoá `:0.3`).

  BẤT ĐỊNH ĐÃ GHI. (1) `santativikopanaṁ` (1.5) — không có tiền lệ nào trong toàn
  tầng; `santati` là sức sống, `vikopana` là làm tổn hại, tôi dịch `làm tổn hại sức
  sống`. (2) `na ca bhagavā arahati etaṁ vacanaṁ vattuṁ` (1.5) — `arahati` không có
  bản song song nào trong 248 tệp mil đã ghim; vế sau `etaṁ vacanaṁ vattuṁ` (= lời
  này) buộc nghĩa phải là `không nói lời ấy`, tôi dịch vậy và không suy diễn thêm.
  (3) `niggaṇhe niggahārahaṁ, paggaṇhe paggahārahan` (0 tiền lệ cho
  `niggahāraha`/`paggahārahan`) — `niggahāraha` = đáng nắm lấy, `paggahārahan` = đáng
  siết chặt; tôi dịch đối xứng `Hãy nắm lấy điều cần nắm lấy, hãy siết chặt điều
  cần siết chặt`. (4) `niggahetabbaṁ` / `paggahetabbaṁ` — an6.85:1.3 và 2.3 dùng
  `kiềm chế tâm` / `nâng lên tâm`; `nâng lên tâm` đọc cộc và sai với `līnaṁ cittaṁ`
  (tâm nhạt nhẽo) nên tôi dùng `kiềm chế` / `củng cố`, giữ nhất quán cả sáu cặp ở
  2.6–2.11; đây là **lệch có chủ đích** so với an6.85. (5) `micchāpaṭipanno` /
  `anariyo` / `coro` (2.9–2.11) — 0 tiền lệ cho cả ba cặp; đây là bài tập ghép cặp
  trong `Puggalavagga` nên tôi giữ đúng cấu trúc đối xứng và dùng `Hành theo tà
  đạo` / `Bậc không phải bậc A-la-hán` / `Kẻ trộm` làm chủ thể.

  DẤU LƯỢC: bài này KHÔNG có `…`, nên không phát sinh chính sách dấu lược.
