notes: |-
  **Phạm vi: đủ 350/350 khoá của cnd11, không khoá nào ngoài tập khoá Pāli, cùng thứ tự.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Nanda (Pārāyana, câu hỏi thứ bảy), tức bài kệ `snp5.8`. Cấu trúc như `cnd12` và `cnd6`: dẫn từng đoạn kệ rồi giải từng cụm; phần chú giải là các chuỗi từ đồng nghĩa mang tính công thức. Có hai khối dài ngoài công thức: định nghĩa đạo quân của Ma (`10.2`, `11`–`14`) và ba cách liễu tri tham ái (`51`–`53`, `63`–`66`) kèm danh sách 44 mục của `64.2`. Pāli của bài **không có** `(…)` trần và không có nháy đơn; có 21 khoá chứa nháy kép, 24 khoá chứa `…pe…` (đều thành đúng một `…`; 4 khoá kết `…pe….` thì Việt kết ` ….`), 5 khoá có `…` trần (`10.2` và `61.3`–`61.6`, đều giữ `…`, riêng `10.2` có 14 dấu lược liền nhau trong chuỗi phiền não).

  **Cách trình bày lemma** theo `cnd6`, `cnd10`, `cnd12`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. `Iccā` giữ nguyên Pāli ở `2.8`, `18.8`, `37.8` vì lời giải nói về chính hình thức của từ ấy. Hai dòng kệ cuối mục `(nandāti bhagavā)` dịch *(Này Nanda, Đức Thế Tôn nói,)* theo đúng cách của tám bài cnd khác cùng bộ (`cnd6:10.2`, `cnd10:10.2`, `cnd13:7.2`, `cnd14:14.2`, `cnd16:16.2`, `cnd17:18.2`, `cnd18:20.2`, `cnd20:9.2`); `snp5.8:4.2` chỉ có *(Đức Thế Tôn trả lời:)*. Khi `(nandāti bhagavā)` nằm **giữa** câu (`48.1`, `48.3`) dịch thành *(này Nanda, Đức Thế Tôn nói)* trong ngoặc, vì tầng chưa có tiền lệ cho dạng nằm giữa câu.

  **Tầng tham khảo — đo, không đoán.** Sujato không có `cnd11`: thư mục `kn` của tầng Anh đã ghim chỉ có cp 35, dhp 26, iti 112, ja 83, kp 9, snp 73, thag 264, thig 73, ud 80 tệp; tệp `cnd11_translation-en-sujato.json` không tồn tại, chỉ có `cnd-name` (nhãn tác phẩm, không phải văn bản kinh). Lớp `english-project` không có `cnd11`. `vietnamese-current` chỉ có Pháp Cú; bản Việt nguyên bài (tra cứu toàn văn) cũng không có thư mục `cnd`. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự sau khi gộp khoảng trắng, tính cả thẻ in đậm như phép đo của kho, bỏ khối `:0`) là **124** khoá (350 khoá, trong đó 4 khoá là khối `:0`); Sujato phủ 0/124 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/124, `vietnamese-current` 0/124. Khi tính bỏ thẻ in đậm thì còn 115 khoá, kết luận không đổi. Có hai chứng cứ độc lập trong chính corpus, nhưng đều là bản của **bài khác** nên không tính là đối chiếu English của cnd11: (a) 71 khoá kệ trùng nguyên văn Pāli với `snp5.8` mà Sujato có dịch (và `snp3.2` cho 8 khoá kệ đạo quân của Ma); (b) công thức chú giải đã dịch ở `cnd6`, `cnd10`, `cnd12`–`cnd18`, `cnd20`. Đã đối chiếu Sujato `snp5.8` để hiểu cú pháp của các câu kệ; không dùng làm tầng tham khảo của cnd11.

  **Dùng lại tiền lệ.** Đã dò lại toàn tầng bản Việt bằng chỉ mục Pāli (bỏ thẻ in đậm, không phân biệt hoa thường và dấu câu): **204** khoá của cnd11 có Pāli trùng nguyên văn với khoá ở bài khác (1.976 cặp khoá-khoá, kể cả các dòng ngắn như `Tenāha bhagavā—`); ở **197** khoá bản Việt trùng một bản đã có, **7** khoá không trùng bản nào: `2.6` (xem phần *Trong chính bài*), `7.4`, `8.1`, `11.4`, `12.4`, `22.8`, `32.5` (`7.4` thêm *như vậy* để nối với dòng 3, xem bất định 1; `8.1` trùng duy nhất `mnd9:29.1` nhưng đó là lemma của một câu kệ khác (*Không nói thanh tịnh là nhờ…*, động từ `na suddhimāha` ở dòng sau) nên không dùng lại; `11.4`, `12.4`, `22.8`, `32.5` xem lượt cải thiện bên dưới). Nguồn các khoá trùng: `snp5.8` (kệ), các cnd/mnd khác, `snp3.2` (8 khoá đạo quân của Ma), một số khoá ở `snp`, `ne`, `ja`. Các lệch có chủ ý còn lại so với tiền lệ: (i) `7.3`, `15.3` `visenikatvā` không theo `snp5.8:2.3` (xem thuật ngữ và bất định 1); (ii) `57.2`, `60.5`, `67.2` `gotamanūpadhīkaṁ` dịch *sự không còn sanh y* như `cnd8:84.2`, `cnd8:86.1`, `cnd2:26.2`, `cnd2:52.2`, không theo *sự không chấp thủ* của `snp5.8:7.2`, `snp5.5:9.2` (tầng: `upadhi` → *sanh y* 142 lượt, *chấp thủ* 8 lượt; lời giải `60.3` định nghĩa `upadhī` là các phiền não, các uẩn và các hành tạo tác nên cần cùng một thuật ngữ ở kệ lẫn lời giải); (iii) `27.2`, `34.2`, `46.2`, `55.2` *(Này Nanda, Đức Thế Tôn nói,)* như đã nêu; (iv) `46.5`, `55.5`, `57.4`, `67.4` chỉ khác dấu cuối khoá (Pāli kết `;`/`.` ở đây, `,` ở tiền lệ); (v) `15.1` Pāli trùng `snp4.9:5.1` nhưng bản Việt đó gộp nội dung sang dòng kế (*Thanh tịnh không được nói là nhờ kiến*), nên dùng câu của `snp5.8:2.1`; (vi) `36.1`, `41.1`, `41.6`, `45.1` thêm *Nếu* cho `ce` (xem lượt cải thiện), khác `snp5.8:5.6` và `cnd2:50.6`. Các kệ còn lại (kể cả 24 khoá đạo quân của Ma ở `11`–`13` dùng lại `snp3.2:12`–`15`, trừ `11.4` và `12.4`) dùng nguyên văn.

  **Trong chính bài:** 71 nhóm Pāli trùng nguyên văn (218 khoá, 342 cặp, không phân biệt hoa thường và dấu câu); bản Việt giống nhau (chỉ khác chữ hoa đầu khoá và dấu cuối) ở 70 nhóm, **khác ở 1 nhóm**: `1.1` = `6.1` (*Người ta nói có những bậc Mâu-ni ở đời,*, dùng lại `snp5.8:1.1` vốn đã gồm *người ta nói* của `janā vadanti`) so với `2.6` (*Có những bậc Mâu-ni ở đời.*, lời giải theo `2.1`, không lặp *người ta nói* vì `3.1` đã có `janā vadanti`). Sau khi đọc cặp Pāli↔Việt đã sửa 4 khoá để các cặp trùng không lệch nội dung (`3.1`, `3.5` theo `1.3`; `23.1`, `23.4` theo `17.2`); ở lượt cải thiện này `22.8`/`32.5` và `22.9`/`32.6` vẫn giống nhau sau khi sửa.

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `visenikatvā` → *sau khi phá tan các đạo quân*: khác `snp5.8:2.3` (Sujato *live far from the crowd*, Việt *sống xa lìa đám đông*) nhưng có ba tiền lệ cùng bộ Niddesa: `mnd8:68.1` (cùng lời giải `yato catūhi ariyamaggehi … tena vuccati visenikatvāti`, dịch *thì do đó được gọi là sau khi phá tan các đạo quân*), `mnd8:68.4` (`visenikatvā pana ye caranti` → *những ai sống sau khi đã phá tan các đạo quân*) và `mnd4:53.1` (`visenibhūto` → *đã thoát khỏi các đạo quân*). Lời giải `14.1` của chính Cūḷaniddesa cũng định nghĩa từ này qua đạo quân của Ma (`senā vuccati mārasenā` ở `10.2`, `paṭisenikarā kilesā jitā` ở `14.1`), nên kệ ở đây theo cách hiểu của lời giải để bài không mâu thuẫn với chính nó; Pāli root (`caranti ye te`) vẫn ghép được với cả hai cách. `paṭisenikarā` → *đối kháng* theo `mnd8:68.1` và `mnd8:55.2` (`mnd13:143.1`, `mnd4:53.1` dùng *đối địch*; bản trước dùng *đối nghịch*, 0 tiền lệ).
  - `nīgho`/`anīghā` → *khổ não*/*không khổ não*: `anīgha` ở tầng (7 khoá): *không khổ*/*không đau khổ* 5 khoá (`snp5.4`, `snp5.8`, `an3.32`, `an4.23`, `an4.41`), *không não hại* và *không ưu phiền* mỗi dạng 1 khoá; `nīgha`: *phiền não* 5 khoá (`sn45.168`, `sn45.170`, `sn46.111–120`, `sn51.67–76`, `sn53.35–44`). Chọn *khổ não* để không trùng *phiền não* của `kilesa` ngay cùng khoá `10.2`, `14.1`.
  - `kāyaduccarita` → *ác hạnh về thân*, `vacīduccarita` → *ác hạnh về lời*, `manoduccarita` → *ác hạnh về ý*: tầng 11/9/9 khoá, còn *thân ác hạnh* 21 khoá (trong đó 14 khoá chứa `kāyaduccaritena`, tức dạng công cụ cách của công thức `samannāgata`) và *ý ác hạnh* 17 khoá; chọn dạng *ác hạnh về…* vì ở đây là danh từ đứng trong danh sách (`an8.12`).
  - Chuỗi phiền não của đạo quân Ma theo `cnd6:15.2` và `mnd8:65.3`, `mnd13:140.3`, `mnd16:60.2` (cùng công thức): `makkho` *gièm pha*, `paḷāso` *hơn thua*, `thambho` *bướng bỉnh*, `sārambho` *hung hăng*, `māno` *ngã mạn*, `atimāno` *ngạo mạn*, `mado` *tự mãn*, `pamādo` *phóng dật*, `sabbe darathā` *mọi bứt rứt*, `pariḷāhā` *mọi nóng bức*, `santāpā` *mọi thiêu đốt*. Kệ `12.4` `makkho thambho te aṭṭhamo` trước đây dùng lại nguyên văn `snp3.2:13.4` (*Khinh mạn và cứng đầu*), làm cùng một từ Pāli ở `10.2` và `12.4` thành hai cách dịch và *khinh mạn* dễ lẫn với *ngã mạn*/*ngạo mạn* trong cùng danh sách; đã đo trên 172 khoá chứa `makkh-`: *gièm pha* 46 khoá (`mn7`, `mn8`, `mn40`, `mn98`…), *chê bai* 14 khoá, *khinh mạn* 1 khoá (`snp3.2`); trên 68 khoá chứa `thambh-`: *bướng bỉnh* 10, *cứng cỏi* 6, *cứng đầu* 5. Nay `12.4` dịch *Gièm pha và bướng bỉnh là thứ tám;* theo đa số và để nhất quán trong bài; `snp3.2:13.4` vẫn giữ cách cũ (ngoài phạm vi lượt này, nên báo người biên tập).
  - `ñāṇūpapanna` → *đầy đủ trí biết* (`snp5.8:1.4`), `jīvitenūpapanna` → *đầy đủ về đời sống*; `upeta…samannāgata` → *đã đến gần, đã đến sát, đã tiến đến, đã tiến sát, đã hội đủ, đã hội đủ trọn vẹn, đã thành tựu* (`cnd6:11.9`, `cnd10:5.3`, `cnd16:5.11`, 3 lần cùng dạng).
  - `kathenti bhaṇanti dīpayanti voharanti` → *thuyết, tuyên bố, làm sáng tỏ, diễn đạt*: `kathesi` *thuyết*, `bhaṇasi` *tuyên bố* theo `cnd6:7.2` (1 khoá, bộ `kaṁ kathesi kaṁ bhaṇasi`); `voharati` ở 47 khoá của tầng: *tuyên bố* 22 khoá, *gọi* 8 khoá, *diễn đạt* 4 khoá (còn lại là *nói* hay cách diễn đạt khác); `cnd6:7.2` (1 khoá, cùng bộ năm động từ) ghép `voharasi` với *gọi*. Chọn *diễn đạt* cho cả bài để năm động từ luôn khác nhau (`bhaṇati` đã là *tuyên bố*) và để câu `diṭṭhenāpi suddhiṁ … voharanti` đọc được; `dīpayati` không có tiền lệ.
  - `suddhi visuddhi parisuddhi mutti vimutti parimutti` → *sự thanh tịnh, sự thanh tịnh hoàn toàn, sự thanh tịnh trọn vẹn, sự giải thoát, sự giải thoát hoàn toàn, sự giải thoát trọn vẹn*: đúng chuỗi của cả **14/14** khoá có cùng sáu từ Pāli trong tầng (`mnd4`, `mnd6`, `mnd8`, `mnd11`, `mnd12`, `mnd13`). Bản trước dịch lại thành chuỗi khác (*sự thanh lọc, sự hoàn toàn thanh sạch, sự thoát khỏi…*) và ghi nhầm là không có tiền lệ; đã sửa ở 19 khoá (`19`–`21`, `29.1`, `29.3`, `30.1`, `30.3`, `31.1`, `38`–`40`, `50.1`, `62.1`).
  - `sīlabbata` → *giới và hạnh* theo `snp5.8` (kệ), dù tầng toàn bộ dùng *giới cấm* 64 khoá (chủ yếu `sīlabbataparāmāsa`) và *giới và hạnh* 5 khoá; `vata` → *hạnh*. Đo thêm ở phạm vi gần nhất (cnd/mnd, 70 khoá có `vata`): *khổ hạnh* 49 khoá, và `sīla` đi cùng `vata` thường là *giới luật* (37 khoá), trong khi cnd11 dịch *hạnh* và *giới* ở lời giải `20`, `30`, `39`, `49.5`–`49.7`, `61.5`–`61.7`. Giữ *giới và hạnh* vì lemma là dòng kệ dùng lại nguyên văn `snp5.8` và lời giải phải khớp lemma; đây là một lệch so với tiền lệ cận kề, còn mở (xem bất định 12). Tương tự `muta` → *cảm nhận* (theo `snp5.8:7.3`; ở cnd/mnd 43/55 khoá lời giải dùng *nhận thức*, 10 khoá dùng *cảm nhận*, tầng chung 57 *cảm nhận* so với 47 *nhận thức*).
  - `pariññā` → *liễu tri* (theo `snp5.8:6.7`, `parijānitvā` cũng *liễu tri*); `ñātapariññā`/`tīraṇapariññā`/`pahānapariññā` → *sự liễu tri do biết/do thẩm xét/do đoạn trừ* (0 tiền lệ); `tīreti`/`tīrayitvā` → *thẩm xét* theo `cnd6:5.1` (`tīrayitvā` *đã thẩm xét*). Danh sách `tīreti aniccato … nissaraṇato` (`64.2`, 44 mục) theo từng mục tương ứng của `cnd10:11.4`–`11.45` (danh sách gần như trùng: cnd10 có `bhavato`, cnd11 có thêm `vadhakato`, `saṅkilesadhammato`, `samudayato`) và `ps3.9:11.2` (*vadhakato* → *kẻ giết*), `mil7.8.7:3.40` (*saṅkilesadhammato* → *phải ô nhiễm*); riêng `samudayato` → *sự tập khởi*, `atthaṅgamato` → *sự diệt tận* (theo `cnd10:11.42`), `assādato` → *vị ngọt*.
  - `āvutā nivutā ovutā pihitā paṭicchannā paṭikujjitā` → *che lấp, che phủ, che kín, đậy lại, bao phủ, úp kín* (`48.1`) theo `mnd2:10.9` và `mnd2:47.1` (hai khoá có cùng sáu từ, đúng thứ tự này); bản trước ghi *0 tiền lệ cho cả chuỗi* và dịch thành *bao phủ, che phủ, phủ kín, đóng kín, che đậy, úp lại*, nay sửa. `nivuta` → *che phủ* theo `snp5.8:6.3` (khớp `mnd2`).
  - `atāṇā aleṇā asaraṇā asaraṇībhūtā` → *không nơi che chở, không nơi ẩn náu, không nơi nương tựa, đã trở thành không nơi nương tựa* (`cnd10:11.19`–`11.22`, `ps3.9:11.2`; `asaraṇa` ở tầng *nơi nương tựa* 51, *chỗ nương tựa* 6, *chỗ quy y* 6).
  - `ājīvaka` giữ *Ājīvaka* (22 lượt, *ngoại đạo* 2 lượt), `nigaṇṭha` giữ *Nigaṇṭha* (256 lượt, *Ni-kiền-tử* 7 lượt), `jaṭila` → *đạo sĩ tóc bện* (*tóc bện* 9 lượt, *bện tóc* 4, *jaṭila* 6), `tāpasa` → *đạo sĩ khổ hạnh* (*đạo sĩ* 35 lượt, *khổ hạnh* 12). `kotūhalamaṅgala` → *nghi lễ cầu may* (`mn38`). `narāsabha` → *đấng Nhân Ngưu* (90 khoá của tầng chứa *Nhân Ngưu*, chủ yếu `tha-ap`, `bv`).
  - `pajā` → *chúng sinh* 73 khoá (*quần chúng* 12), cụm `sadevake loke samārake sabrahmake` theo `dn14:1.17.4`.
  - `kusala` → *thiện xảo* (`snp5.8:2.2`); danh sách ở `9.2` theo `mnd3:22.2`, `mnd8:48.2`, `mnd13:106.2`, `mnd5:16.2` (5/5 khoá cùng danh sách không dùng *các*: *thiện xảo về uẩn, về giới, về xứ, về niệm xứ, về chánh cần…*) và `iddhipāda` → *như ý túc* (tầng: *như ý túc* 328 khoá, *thần túc* 105 khoá; `mnd`: 3/5 khoá *như ý túc*); bản trước dùng *các uẩn, các giới…* và *thần túc*. `paṭiccasamuppāda` → *duyên khởi*; `āsava` → *lậu hoặc*; `kāmāsava…avijjāsava` → *dục lậu, hữu lậu, kiến lậu, vô minh lậu* (`cnd15:31.3`, `cnd17:12.3`); `kāmogha…avijjogha` → *dòng lũ dục, hữu, kiến, vô minh* (`cnd10`, `cnd16:4.5`).
  - `yatā` (`22.9`, `32.6`) → *tự chủ, chuẩn bị sẵn, được phòng hộ, được canh giữ, được bảo vệ, được thu thúc* theo `mnd16:121.12`, `mnd16:227.1` (chuỗi `yato yatto paṭiyatto gutto gopito rakkhito saṁvuto`; `gutto gopito rakkhito saṁvuto` ở `mnd16:226.2`, `226.4` cũng *phòng hộ, canh giữ, bảo vệ, thu thúc*); bản trước dịch *được kiềm chế, được chuẩn bị kỹ, được canh giữ, được bảo vệ, được gìn giữ, được thu thúc* (lệch một bậc từ `guttā` trở đi, 0 tiền lệ). `paṭiyatta` cũng chỉ có tiền lệ nghĩa *chuẩn bị sẵn sàng* (`dn16:4.18`, `ud8.5:4`, `mil3.7.3:3.5`); nghĩa trong chuỗi *tự chế* chưa phân xử được, xem bất định 13.
  - `tatthāti sakāya diṭṭhiyā sakāya khantiyā sakāya ruciyā sakāya laddhiyā` (`22.8`, `32.5`) → *Trong đó: trong kiến của mình, trong sự chấp nhận của mình, trong sở thích của mình, trong chủ trương của mình*: theo `mnd8:5.3`, `mnd13:112.4`, `mnd5:11.3` (3/3 khoá cùng lời giải: *trong kiến của mình…*) và cả 24/24 khoá của mnd chứa `sakāya laddhiyā` đều dịch `laddhiyā` → *chủ trương*; lemma dùng *Trong đó* (không *Ở đó* như mnd) cho khớp `22.7` và dòng kệ *sống chế ngự trong đó*. Bản trước dịch *bằng kiến của mình… bằng điều ưa thích… bằng tín điều của mình*: `tattha` là định vị chứ không phải công cụ, và `ruci`/`laddhi` lệch tiền lệ.
  - `ce` (`36.1`, `41.1`, `41.2`, `41.6`, `45.1`) → *Nếu*: `te ce munī brūsi anoghatiṇṇe, atha ko carahi…` là câu điều kiện (`ce` … `atha`); bản trước bỏ `ce`, theo `snp5.8:5.6` và `cnd2:50.6` (cả hai khoá cũng bỏ *nếu*). Pāli thắng tiền lệ ở chỗ này: điều kiện là một đơn vị nghĩa của Pāli (rubric `grammar_logic`).
  - `taṇhā` ở kệ `11.4` (`catutthī taṇhā pavuccati`) → *tham ái*, như `14.4`, `51`–`66` của chính bài; trên 299 khoá có `taṇhā` ngắn (<60 ký tự) tầng dùng *tham ái* 119, *ái* (đơn) 131, *khát ái* 60 và *ái dục* chỉ 7 khoá (`ái dục` dễ bị đọc thành `kāmataṇhā`). `snp3.2:12.4` vẫn là *ái dục* (ngoài phạm vi lượt này).
  - `Nanda` giữ nguyên; `iccā` theo `cnd6:3.2`; nhãn bài và colophon theo `cnd12:0.1`–`0.4`, `27.3`.

  **Số Pāli.** `catūhi ariyamaggehi` = *bốn Thánh đạo* (`14.1`); `tīhi pariññāhi` = *ba sự liễu tri* (`51.3`, `53.7`, `63.3`, `66.1`); `cattāro āsavā` = *bốn lậu hoặc* (`53.8`, `66.2`, bốn tên nêu ở `53.9`, `66.3`); `aṭṭha samāpatti` = *tám thiền chứng* (`4.2`, `8.4`, `9.2`); `pañcābhiññā` = *năm thắng trí* (`4.2`, `8.4`, `9.2`); kệ `11`–`13` đạo quân Ma: `paṭhamā` *thứ nhất*, `dutiyā` *thứ hai*, `tatiyā` *thứ ba*, `catutthī` *thứ tư*, `pañcamaṁ` *thứ năm*, `chaṭṭhā` *thứ sáu*, `sattamī` *thứ bảy*, `aṭṭhamo` *thứ tám* (khớp `snp3.2:12`–`13`); `sattamo` ở `68.4` *thứ bảy* và `7.` ở `0.4`. Không có số lớn, không có `sahassa`/`sata`/`navuti`, không có cụm `tiṁsakappasahassa`.

  **Bất định (không thêm vào thân kinh).**
  1. `7.3`, `15.3`, `10.1`, `14.1`, `14.8`, `14.9` `visenikatvā`: dịch theo lời giải của Cūḷaniddesa (*phá tan các đạo quân*), khác `snp5.8:2.3`. `caranti ye te munayoti brūmi` (`7.4`, `15.4`) trong Pāli root nằm ở dòng 4 còn `visenikatvā anīghā nirāsā` ở dòng 3; ở dòng 4 thêm *như vậy* (*những ai sống như vậy*) để nối `ye te` với dòng 3, đây là từ nối cú pháp, không có ý mới. Lượt cải thiện đã tìm thêm ba tiền lệ cùng bộ Niddesa (`mnd8:68.1`, `mnd8:68.4`, `mnd4:53.1`) cùng chọn *phá tan các đạo quân*, nên bất định này thu hẹp còn: Pāli root tự nó ghép được với *xa lìa đám đông* của `snp5.8:2.3`, và đó là chỗ `snp5.8` và cnd11 khác nhau; nếu người biên tập đổi về *sống xa lìa đám đông* thì `14.1` và `14.8` phải đổi theo.
  2. `14.6`: tầng Pāli ghim ở khoá này đọc `avijjā lobho akusalamūlaṁ` (*vô minh, tham lam, gốc rễ bất thiện*), trong khi cùng công thức ở `cnd16:3.6`, `cnd17:37.2`, `cnd18:9.2`, `cnd6:26.2` và 59 khoá khác của cnd/mnd đều đọc `abhijjhā lobho akusalamūlaṁ`; đã đếm trong tầng Pāli đã ghim: `abhijjhā lobho akusalamūlaṁ` 63 lần, `avijjā lobho akusalamūlaṁ` **1 lần** (chỉ ở khoá này). Dịch đúng chữ của Pāli ghim (*vô minh*), không sửa theo dạng đa số; nhiều khả năng đây là biến thể ghi chép ở nguồn, cần người biên tập phán.
  3. `2.5` `devā loke munayoti sañjānanti, na ca te munayoti`: ngữ pháp để mở `te` chỉ ai (các vị mang tên Mâu-ni ở `2.4`, hay cả hai cụm). Dịch sát chữ, giữ nguyên độ mở: *Chư thiên ở đời nhận biết các bậc Mâu-ni, nhưng những vị ấy không phải là các bậc Mâu-ni.*
  4. `5.1` `anekavividhaatiparamadukkarakārikalūkhajīvitānuyoga`: hợp từ dài, 0 tiền lệ; dịch *sự theo đuổi lối sống khắc khổ với đủ loại khổ hạnh tột bậc khó thực hành* (`dukkarakārikā` *khổ hạnh* 34 lượt, `lūkhajīvita` *khắc khổ* 16 lượt và *khổ hạnh* 22 lượt, `anuyoga` *theo đuổi* 40 lượt); thứ tự các thành phần trong hợp từ chưa phân xử được.
  5. `18.5` `bhovādikā`: 0 tiền lệ; dịch *người xưng hô bằng tiếng bho*, không đặt nháy vì Pāli của khoá không có nháy.
  6. `59.5` `kahaṁ narāsabhoti mahesīti`: đã giải quyết ở lượt cải thiện bằng ba tiền lệ cùng bộ, cùng khoá Pāli (`cnd9:4.4`, `cnd9:51.4`, `cnd8:85.5`) đều dịch *Đấng Nhân Ngưu ở đâu, như vậy là bậc đại ẩn sĩ*; câu chữ nay theo đó. Người hỏi (cụm *ở đâu* do ai hỏi) vẫn do `…pe…` ở `59.4` che mất, nên không thêm chủ thể.
  7. `66.5` `ahampi te oghatiṇṇā` đứng riêng (chữ `brūmi` nằm ở lemma kế `66.6`): dịch *con cũng — những người ấy đã vượt qua dòng lũ* với dấu gạch, không thêm động từ ngoài Pāli.
  8. `41.2` `te ce` dịch *Nếu những người ấy* (lời giải chỉ gloss `diṭṭhigatike`, giữ `ce` là *nếu*); `22.4`, `32.4` `diṭṭhigatikā` → *những người theo kiến chấp* (0 tiền lệ trong tầng cho `diṭṭhigatika`).
  9. `1.4`, `4.1`, `6.4` `ñāṇūpapannaṁ muni no vadanti`: `no` hiểu là `nu` (hỏi), Việt theo `snp5.8:1.4`.
  10. `42.1` `ko eso` dịch *vậy thì ai là vị…*; `23.1` lemma mở đầu bằng *Liệu họ có vượt qua…* (như `17.2`) rồi mới đến lời giải thì quá khứ `atariṁsu…`, chấp nhận sự lệch giữa nghi vấn của kệ và quá khứ của lời giải vì đó là cấu trúc Pāli.
  11. `44.2`/`1.2` `(iccāyasmā nando)` dịch *(Tôn giả Nanda nói,)* đúng `snp5.8:1.2`.
  12. `sīlabbata`/`vata`/`muta` ở lời giải (`20`, `30`, `39`, `49`, `61`): cnd11 giữ *giới và hạnh*, *hạnh*, *cảm nhận* để khớp dòng kệ lấy từ `snp5.8`; phần lớn lời giải cùng bộ (`mnd`) dùng *giới luật*, *khổ hạnh*, *nhận thức*. Chưa phân xử được bằng Pāli: cả hai cách đều ghép được với `sīlabbata`, `vata`, `muta`; đây là chọn lựa thuật ngữ cần người biên tập thống nhất cho cả `snp5.8` lẫn Niddesa.
  13. `22.9`, `32.6` `paṭiyattā`: đã đối chiếu `mnd16:121.12` (*chuẩn bị sẵn*), nhưng nghĩa *chuẩn bị sẵn* trong chuỗi `yattā paṭiyattā guttā…` (tự chế) vẫn chưa kiểm chứng bằng từ điển hay lời chú giải nào trong tầng; giữ theo tiền lệ cùng bộ, không tự chế cách dịch mới.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (350/350, cùng thứ tự); nháy kép `“”` khớp Pāli từng khoá (0/350 lệch; 21 khoá có nháy kép, Pāli không có nháy đơn nên Việt cũng không có); dấu lược `…` khớp Pāli từng khoá (0/350 lệch; 24 khoá có `…pe…` đều thành đúng một `…`, 5 khoá có `…` trần đều giữ `…`); Pāli không có `(…)` nên Việt cũng không có; ngoặc đơn `( )` khớp từng khoá; 0 khoá rỗng; NFC; không khoảng trắng thừa; Pāli lọt sang Việt chỉ gồm lemma `Iccā` (3 khoá) và tên riêng/loại hình (`Ājīvaka`, `Nigaṇṭha`, `Namucī`, `Māra`); đã in và đọc đối chiếu đủ 350 cặp Pāli↔Việt, cả ở lượt cải thiện 2026-10-11 (đọc lại toàn bộ cặp, đối chiếu từng cụm công thức với các bài cnd/mnd cùng bộ); `66.5` có dấu gạch ngang `—` mà Pāli không có (không phải nháy hay ngoặc, nên không vi phạm phép khớp nháy), xem bất định 7.

  **Lượt cải thiện 2026-10-11.** Đọc đối kháng lại 350 cặp Pāli↔Việt và so từng cụm công thức với các bài cùng bộ (cnd/mnd); **36 khoá** đổi trên 350 (`9.2`, `11.4`, `12.4`, `14.1`, `19.1`–`19.3`, `20.1`–`20.3`, `21.1`, `22.8`, `22.9`, `24.2`, `29.1`, `29.3`, `30.1`, `30.3`, `31.1`, `32.5`, `32.6`, `36.1`, `38.1`, `38.3`, `39.1`, `39.3`, `40.1`, `41.1`, `41.2`, `41.6`, `45.1`, `48.1`, `50.1`, `59.2`, `59.5`, `62.1`). Phân loại:
  - Terminology fix theo tiền lệ đo được (khoá nào, vì sao, đã ghi ở phần thuật ngữ): chuỗi sáu từ `suddhi…parimutti` (19 khoá, 14/14 tiền lệ ở `mnd`); danh sách `9.2` (bỏ *các*, `như ý túc`); `yatā` (`22.9`, `32.6`); `tatthāti…laddhiyā` (`22.8`, `32.5`); chuỗi `āvutā…paṭikujjitā` (`48.1`); `makkho thambho` (`12.4`); `taṇhā` (`11.4`); `paṭisenikarā` (`14.1`); `24.2` *xin hãy nói cho con* theo `cnd8:9.1`, `cnd9:2.6`, `cnd7:38.2`.
  - Dùng lại nguyên văn bản đã có cho Pāli trùng: `59.2` (theo `cnd8:85.2`, lệch ở bốn cụm: *cách nói*, *lời giảng*, *điều đã được chỉ dạy*, *thèm khát*), `59.5` (theo `cnd9:4.4`, `cnd9:51.4`, `cnd8:85.5`). Bản trước ghi chưa dùng lại hai khoá này và chưa dò `cnd8`/`cnd9`.
  - Accuracy fix: `36.1`, `41.1`, `41.2`, `41.6`, `45.1` thêm *Nếu* cho `ce` (câu điều kiện, xem thuật ngữ); `22.8`, `32.5` đổi *bằng* thành *trong* (định vị `tattha`).
  - Sửa lời trong notes: bản trước ghi 0 tiền lệ cho chuỗi sáu từ `suddhi…`, cho chuỗi `āvutā…paṭikujjitā`, và coi `59.2`/`59.5` là khác biệt đã chấp nhận; cả ba đều có tiền lệ đo được, nay đã ghi đúng.
  Điểm đổi: `terminology` 8.8 → 9.0 (31 khoá theo tiền lệ đo được, gồm chuỗi 14/14 ở 19 khoá, nhưng còn lệch so với `mnd` ở `sīlabbata`/`vata`/`muta` và `paṭiyatta` chưa kiểm chứng); `grammar_logic` 8.8 → 8.9 (khôi phục điều kiện `ce` ở 5 khoá và định vị `tattha` ở 2 khoá; chưa nâng thêm vì `2.5`, `5.1`, `14.6` vẫn mở). Không đổi: `source_provenance` 9.4 (claim nguồn trong notes đã được sửa nhưng chỉ là sửa lỗi, không thêm nguồn mới), `semantic_fidelity` 8.8 và `ambiguity_integrity` 8.5 (bất định thật vẫn còn: `14.6` `avijjā`/`abhijjhā`, `2.5` `te`, `5.1`, `66.5`, `22.9` `paṭiyatta`, và mục 12), `triangulation` 8.0 (vẫn không có bản Anh độc lập), `vietnamese_clarity` 8.7, `han_viet_balance` 9.2, `segment_alignment` 10.0, `technical_integrity` 9.6 (chưa chạy được bốn lệnh của kho trong lượt này).

