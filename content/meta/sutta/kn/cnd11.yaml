notes: |-
  **Phạm vi: đủ 350/350 khoá của cnd11, không khoá nào ngoài tập khoá Pāli, cùng thứ tự.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Nanda (Pārāyana, câu hỏi thứ bảy), tức bài kệ `snp5.8`. Cấu trúc như `cnd12` và `cnd6`: dẫn từng đoạn kệ rồi giải từng cụm; phần chú giải là các chuỗi từ đồng nghĩa mang tính công thức. Có hai khối dài ngoài công thức: định nghĩa đạo quân của Ma (`10.2`, `11`–`14`) và ba cách liễu tri tham ái (`51`–`53`, `63`–`66`) kèm danh sách 44 mục của `64.2`. Pāli của bài **không có** `(…)` trần và không có nháy đơn; có 21 khoá chứa nháy kép, 24 khoá chứa `…pe…` (đều thành đúng một `…`; 4 khoá kết `…pe….` thì Việt kết ` ….`), 5 khoá có `…` trần (`10.2` và `61.3`–`61.6`, đều giữ `…`, riêng `10.2` có 14 dấu lược liền nhau trong chuỗi phiền não).

  **Cách trình bày lemma** theo `cnd6`, `cnd10`, `cnd12`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. `Iccā` giữ nguyên Pāli ở `2.8`, `18.8`, `37.8` vì lời giải nói về chính hình thức của từ ấy. Hai dòng kệ cuối mục `(nandāti bhagavā)` dịch *(Này Nanda, Đức Thế Tôn nói,)* theo đúng cách của tám bài cnd khác cùng bộ (`cnd6:10.2`, `cnd10:10.2`, `cnd13:7.2`, `cnd14:14.2`, `cnd16:16.2`, `cnd17:18.2`, `cnd18:20.2`, `cnd20:9.2`); `snp5.8:4.2` chỉ có *(Đức Thế Tôn trả lời:)*. Khi `(nandāti bhagavā)` nằm **giữa** câu (`48.1`, `48.3`) dịch thành *(này Nanda, Đức Thế Tôn nói)* trong ngoặc, vì tầng chưa có tiền lệ cho dạng nằm giữa câu.

  **Tầng tham khảo — đo, không đoán.** Sujato không có `cnd11`: thư mục `kn` của tầng Anh đã ghim chỉ có cp 35, dhp 26, iti 112, ja 83, kp 9, snp 73, thag 264, thig 73, ud 80 tệp; tệp `cnd11_translation-en-sujato.json` không tồn tại, chỉ có `cnd-name` (nhãn tác phẩm, không phải văn bản kinh). Lớp `english-project` không có `cnd11`. `vietnamese-current` chỉ có Pháp Cú; bản Việt nguyên bài (tra cứu toàn văn) cũng không có thư mục `cnd`. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự sau khi gộp khoảng trắng, tính cả thẻ in đậm như phép đo của kho, bỏ khối `:0`) là **124** khoá (350 khoá, trong đó 4 khoá là khối `:0`); Sujato phủ 0/124 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/124, `vietnamese-current` 0/124. Khi tính bỏ thẻ in đậm thì còn 115 khoá, kết luận không đổi. Có hai chứng cứ độc lập trong chính corpus, nhưng đều là bản của **bài khác** nên không tính là đối chiếu English của cnd11: (a) 71 khoá kệ trùng nguyên văn Pāli với `snp5.8` mà Sujato có dịch (và `snp3.2` cho 8 khoá kệ đạo quân của Ma); (b) công thức chú giải đã dịch ở `cnd6`, `cnd10`, `cnd12`–`cnd18`, `cnd20`. Đã đối chiếu Sujato `snp5.8` để hiểu cú pháp của các câu kệ; không dùng làm tầng tham khảo của cnd11.

  **Dùng lại tiền lệ.** Đã dò toàn tầng bản Việt bằng chỉ mục Pāli (đã bỏ thẻ in đậm, gộp khoảng trắng): **107** khoá của cnd11 có Pāli trùng nguyên văn với khoá đã dịch ở bài khác (434 cặp khoá-khoá), dùng lại nguyên văn ở **93** khoá, khác ở **14** khoá (33 cặp lệch, phần lớn vì một khoá Pāli có nhiều bản Việt khác nhau ở các bài khác). Nguồn: `snp5.8` 71 khoá, các cnd khác 27 khoá, `snp3.2` 8 khoá (đạo quân của Ma), một số khoá ở `snp`, `ne`, `ja`. 14 khoá khác gồm: (i) `7.3`, `15.3` `visenikatvā` (xem bất định 1) không theo `snp5.8:2.3` *Những ai sống xa lìa đám đông, không khổ, không cầu mong*; (ii) `57.2`, `67.2` `gotamanūpadhīkaṁ` dịch *sự không còn sanh y* thay vì *sự không chấp thủ* của `snp5.8:7.2` (tầng: `upadhi` → *sanh y* 142 lượt, *chấp thủ* 8 lượt; lời giải `60.3` định nghĩa `upadhī` là các phiền não, các uẩn và các hành tạo tác nên cần cùng một thuật ngữ ở kệ lẫn lời giải); (iii) `27.2`, `34.2`, `46.2`, `55.2` *(Này Nanda, Đức Thế Tôn nói,)* như đã nêu; (iv) `12.2` và `46.5`, `55.5`, `57.4`, `67.4` chỉ khác dấu cuối khoá (Pāli kết `;`/`.` ở đây, `,` ở tiền lệ); (v) `15.1` Pāli trùng `snp4.9:5.1` nhưng bản Việt đó gộp nội dung sang dòng kế (*Thanh tịnh không được nói là nhờ kiến*), nên dùng câu của `snp5.8:2.1`. Các kệ còn lại (kể cả 24 khoá đạo quân của Ma ở `11`–`13` dùng lại `snp3.2:12`–`15`) dùng nguyên văn.

  **Trong chính bài:** 72 nhóm Pāli trùng nguyên văn (145 cặp, tính không phân biệt hoa thường và dấu cuối khoá); bản Việt giống nhau (chỉ khác chữ hoa đầu khoá và dấu cuối) ở 71 nhóm, **khác ở 1 nhóm**: `1.1` = `6.1` (*Người ta nói có những bậc Mâu-ni ở đời,*, dùng lại `snp5.8:1.1` vốn đã gồm *người ta nói* của `janā vadanti`) so với `2.6` (*Có những bậc Mâu-ni ở đời.*, lời giải theo `2.1`, không lặp *người ta nói* vì `3.1` đã có `janā vadanti`). Sau khi đọc cặp Pāli↔Việt đã sửa 4 khoá để các cặp trùng không lệch nội dung (`3.1`, `3.5` theo `1.3`; `23.1`, `23.4` theo `17.2`).

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `visenikatvā` → *sau khi phá tan các đạo quân*: không có tiền lệ nào trong tầng ngoài `snp5.8:2.3` (Sujato *live far from the crowd*, Việt *sống xa lìa đám đông*). Lời giải `14.1` của chính Cūḷaniddesa định nghĩa từ này qua đạo quân của Ma (`senā vuccati mārasenā` ở `10.2`, `paṭisenikarā kilesā jitā` ở `14.1`), nên kệ ở đây theo cách hiểu của lời giải để bài không mâu thuẫn với chính nó; Pāli root (`caranti ye te`) cũng ghép được với cả hai cách.
  - `nīgho`/`anīghā` → *khổ não*/*không khổ não*: `anīgha` ở tầng (7 khoá): *không khổ*/*không đau khổ* 5 khoá (`snp5.4`, `snp5.8`, `an3.32`, `an4.23`, `an4.41`), *không não hại* và *không ưu phiền* mỗi dạng 1 khoá; `nīgha`: *phiền não* 5 khoá (`sn45.168`, `sn45.170`, `sn46.111–120`, `sn51.67–76`, `sn53.35–44`). Chọn *khổ não* để không trùng *phiền não* của `kilesa` ngay cùng khoá `10.2`, `14.1`.
  - `kāyaduccarita` → *ác hạnh về thân*, `vacīduccarita` → *ác hạnh về lời*, `manoduccarita` → *ác hạnh về ý*: tầng 11/9/9 khoá, còn *thân ác hạnh* 21 khoá (trong đó 14 khoá chứa `kāyaduccaritena`, tức dạng công cụ cách của công thức `samannāgata`) và *ý ác hạnh* 17 khoá; chọn dạng *ác hạnh về…* vì ở đây là danh từ đứng trong danh sách (`an8.12`).
  - Chuỗi phiền não của đạo quân Ma theo `cnd6:15.2` (cùng công thức): `makkho` *gièm pha*, `paḷāso` *hơn thua*, `thambho` *bướng bỉnh*, `sārambho` *hung hăng*, `māno` *ngã mạn*, `atimāno` *ngạo mạn*, `mado` *tự mãn*, `pamādo` *phóng dật*, `sabbe darathā` *mọi bứt rứt*, `pariḷāhā` *mọi nóng bức*, `santāpā` *mọi thiêu đốt*. Riêng kệ `12.4` `makkho thambho te aṭṭhamo` dùng lại nguyên văn `snp3.2:13.4` (*Khinh mạn và cứng đầu*), nên cùng một từ Pāli ở `10.2` và `12.4` là hai cách dịch khác nhau; đã đo trên 172 khoá chứa `makkh-`: *gièm pha* 46 khoá (`mn7`, `mn8`, `mn40`, `mn98`…), *chê bai* 14 khoá, *khinh mạn* 1 khoá (`snp3.2`); trên 68 khoá chứa `thambh-`: *bướng bỉnh* 10, *cứng cỏi* 6, *cứng đầu* 5. Giữ nguyên văn kệ theo quy ước dùng lại tiền lệ và ghi rõ chỗ lệch này; người biên tập quyết định có thống nhất không.
  - `ñāṇūpapanna` → *đầy đủ trí biết* (`snp5.8:1.4`), `jīvitenūpapanna` → *đầy đủ về đời sống*; `upeta…samannāgata` → *đã đến gần, đã đến sát, đã tiến đến, đã tiến sát, đã hội đủ, đã hội đủ trọn vẹn, đã thành tựu* (`cnd6:11.9`, `cnd10:5.3`, `cnd16:5.11`, 3 lần cùng dạng).
  - `kathenti bhaṇanti dīpayanti voharanti` → *thuyết, tuyên bố, làm sáng tỏ, diễn đạt*: `kathesi` *thuyết*, `bhaṇasi` *tuyên bố* theo `cnd6:7.2` (1 khoá, bộ `kaṁ kathesi kaṁ bhaṇasi`); `voharati` ở 47 khoá của tầng: *tuyên bố* 22 khoá, *gọi* 8 khoá, *diễn đạt* 4 khoá (còn lại là *nói* hay cách diễn đạt khác); `cnd6:7.2` (1 khoá, cùng bộ năm động từ) ghép `voharasi` với *gọi*. Chọn *diễn đạt* cho cả bài để năm động từ luôn khác nhau (`bhaṇati` đã là *tuyên bố*) và để câu `diṭṭhenāpi suddhiṁ … voharanti` đọc được; `dīpayati` không có tiền lệ.
  - `suddhi visuddhi parisuddhi mutti vimutti parimutti` → *sự thanh tịnh, sự thanh lọc, sự hoàn toàn thanh sạch, sự thoát khỏi, sự giải thoát, sự hoàn toàn thoát khỏi*: chuỗi sáu từ này không có tiền lệ trong tầng (0 khoá); `vimutti` → *giải thoát* theo nghĩa kỹ thuật cố định của tầng, nên `mutti` dịch *sự thoát khỏi*.
  - `sīlabbata` → *giới và hạnh* theo `snp5.8` (kệ), dù tầng toàn bộ dùng *giới cấm* 64 khoá (chủ yếu `sīlabbataparāmāsa`) và *giới và hạnh* 5 khoá; `vata` → *hạnh*.
  - `pariññā` → *liễu tri* (theo `snp5.8:6.7`, `parijānitvā` cũng *liễu tri*); `ñātapariññā`/`tīraṇapariññā`/`pahānapariññā` → *sự liễu tri do biết/do thẩm xét/do đoạn trừ* (0 tiền lệ); `tīreti`/`tīrayitvā` → *thẩm xét* theo `cnd6:5.1` (`tīrayitvā` *đã thẩm xét*). Danh sách `tīreti aniccato … nissaraṇato` (`64.2`, 44 mục) theo từng mục tương ứng của `cnd10:11.4`–`11.45` (danh sách gần như trùng: cnd10 có `bhavato`, cnd11 có thêm `vadhakato`, `saṅkilesadhammato`, `samudayato`) và `ps3.9:11.2` (*vadhakato* → *kẻ giết*), `mil7.8.7:3.40` (*saṅkilesadhammato* → *phải ô nhiễm*); riêng `samudayato` → *sự tập khởi*, `atthaṅgamato` → *sự diệt tận* (theo `cnd10:11.42`), `assādato` → *vị ngọt*.
  - `āvutā nivutā ovutā pihitā paṭicchannā paṭikujjitā` → *bao phủ, che phủ, phủ kín, đóng kín, che đậy, úp lại*: 0 tiền lệ cho cả chuỗi; `nivuta` → *che phủ* theo `snp5.8:6.3`.
  - `atāṇā aleṇā asaraṇā asaraṇībhūtā` → *không nơi che chở, không nơi ẩn náu, không nơi nương tựa, đã trở thành không nơi nương tựa* (`cnd10:11.19`–`11.22`, `ps3.9:11.2`; `asaraṇa` ở tầng *nơi nương tựa* 51, *chỗ nương tựa* 6, *chỗ quy y* 6).
  - `ājīvaka` giữ *Ājīvaka* (22 lượt, *ngoại đạo* 2 lượt), `nigaṇṭha` giữ *Nigaṇṭha* (256 lượt, *Ni-kiền-tử* 7 lượt), `jaṭila` → *đạo sĩ tóc bện* (*tóc bện* 9 lượt, *bện tóc* 4, *jaṭila* 6), `tāpasa` → *đạo sĩ khổ hạnh* (*đạo sĩ* 35 lượt, *khổ hạnh* 12). `kotūhalamaṅgala` → *nghi lễ cầu may* (`mn38`). `narāsabha` → *đấng Nhân Ngưu* (90 khoá của tầng chứa *Nhân Ngưu*, chủ yếu `tha-ap`, `bv`).
  - `pajā` → *chúng sinh* 73 khoá (*quần chúng* 12), cụm `sadevake loke samārake sabrahmake` theo `dn14:1.17.4`.
  - `kusala` → *thiện xảo* (`snp5.8:2.2`); `paṭiccasamuppāda` → *duyên khởi*; `āsava` → *lậu hoặc*; `kāmāsava…avijjāsava` → *dục lậu, hữu lậu, kiến lậu, vô minh lậu* (`cnd15:31.3`, `cnd17:12.3`); `kāmogha…avijjogha` → *dòng lũ dục, hữu, kiến, vô minh* (`cnd10`, `cnd16:4.5`).
  - `Nanda` giữ nguyên; `iccā` theo `cnd6:3.2`; nhãn bài và colophon theo `cnd12:0.1`–`0.4`, `27.3`.

  **Số Pāli.** `catūhi ariyamaggehi` = *bốn Thánh đạo* (`14.1`); `tīhi pariññāhi` = *ba sự liễu tri* (`51.3`, `53.7`, `63.3`, `66.1`); `cattāro āsavā` = *bốn lậu hoặc* (`53.8`, `66.2`, bốn tên nêu ở `53.9`, `66.3`); `aṭṭha samāpatti` = *tám thiền chứng* (`4.2`, `8.4`, `9.2`); `pañcābhiññā` = *năm thắng trí* (`4.2`, `8.4`, `9.2`); kệ `11`–`13` đạo quân Ma: `paṭhamā` *thứ nhất*, `dutiyā` *thứ hai*, `tatiyā` *thứ ba*, `catutthī` *thứ tư*, `pañcamaṁ` *thứ năm*, `chaṭṭhā` *thứ sáu*, `sattamī` *thứ bảy*, `aṭṭhamo` *thứ tám* (khớp `snp3.2:12`–`13`); `sattamo` ở `68.4` *thứ bảy* và `7.` ở `0.4`. Không có số lớn, không có `sahassa`/`sata`/`navuti`, không có cụm `tiṁsakappasahassa`.

  **Bất định (không thêm vào thân kinh).**
  1. `7.3`, `15.3`, `10.1`, `14.1`, `14.8`, `14.9` `visenikatvā`: dịch theo lời giải của Cūḷaniddesa (*phá tan các đạo quân*), khác `snp5.8:2.3`. `caranti ye te munayoti brūmi` (`7.4`, `15.4`) trong Pāli root nằm ở dòng 4 còn `visenikatvā anīghā nirāsā` ở dòng 3; ở dòng 4 thêm *như vậy* (*những ai sống như vậy*) để nối `ye te` với dòng 3, đây là từ nối cú pháp, không có ý mới. Người biên tập có thể đổi về *sống xa lìa đám đông* nếu muốn theo Sujato, nhưng khi đó `14.1` và `14.8` phải đổi theo.
  2. `14.6`: tầng Pāli ghim ở khoá này đọc `avijjā lobho akusalamūlaṁ` (*vô minh, tham lam, gốc rễ bất thiện*), trong khi cùng công thức ở `cnd16:3.6`, `cnd17:37.2`, `cnd18:9.2`, `cnd6:26.2` và 59 khoá khác của cnd/mnd đều đọc `abhijjhā lobho akusalamūlaṁ`; đã đếm trong tầng Pāli đã ghim: `abhijjhā lobho akusalamūlaṁ` 63 lần, `avijjā lobho akusalamūlaṁ` **1 lần** (chỉ ở khoá này). Dịch đúng chữ của Pāli ghim (*vô minh*), không sửa theo dạng đa số; nhiều khả năng đây là biến thể ghi chép ở nguồn, cần người biên tập phán.
  3. `2.5` `devā loke munayoti sañjānanti, na ca te munayoti`: ngữ pháp để mở `te` chỉ ai (các vị mang tên Mâu-ni ở `2.4`, hay cả hai cụm). Dịch sát chữ, giữ nguyên độ mở: *Chư thiên ở đời nhận biết các bậc Mâu-ni, nhưng những vị ấy không phải là các bậc Mâu-ni.*
  4. `5.1` `anekavividhaatiparamadukkarakārikalūkhajīvitānuyoga`: hợp từ dài, 0 tiền lệ; dịch *sự theo đuổi lối sống khắc khổ với đủ loại khổ hạnh tột bậc khó thực hành* (`dukkarakārikā` *khổ hạnh* 34 lượt, `lūkhajīvita` *khắc khổ* 16 lượt và *khổ hạnh* 22 lượt, `anuyoga` *theo đuổi* 40 lượt); thứ tự các thành phần trong hợp từ chưa phân xử được.
  5. `18.5` `bhovādikā`: 0 tiền lệ; dịch *người xưng hô bằng tiếng bho*, không đặt nháy vì Pāli của khoá không có nháy.
  6. `59.5` `kahaṁ narāsabhoti mahesīti`: lời giải của `mahesi` trích câu hỏi về đấng Nhân Ngưu; bản cnd11 chỉ giữ phần cuối của cụm nên dịch sát chữ *đấng Nhân Ngưu ở đâu? Nên là bậc đại ẩn sĩ*, chưa phân xử được người hỏi.
  7. `66.5` `ahampi te oghatiṇṇā` đứng riêng (chữ `brūmi` nằm ở lemma kế `66.6`): dịch *con cũng — những người ấy đã vượt qua dòng lũ* với dấu gạch, không thêm động từ ngoài Pāli.
  8. `41.2` `te ce` dịch *những người ấy* (bỏ `ce` vì lời giải chỉ gloss `diṭṭhigatike`); `22.4`, `32.4` `diṭṭhigatikā` → *những người theo kiến chấp* (0 tiền lệ trong tầng cho `diṭṭhigatika`).
  9. `1.4`, `4.1`, `6.4` `ñāṇūpapannaṁ muni no vadanti`: `no` hiểu là `nu` (hỏi), Việt theo `snp5.8:1.4`.
  10. `42.1` `ko eso` dịch *vậy thì ai là vị…*; `23.1` lemma mở đầu bằng *Liệu họ có vượt qua…* (như `17.2`) rồi mới đến lời giải thì quá khứ `atariṁsu…`, chấp nhận sự lệch giữa nghi vấn của kệ và quá khứ của lời giải vì đó là cấu trúc Pāli.
  11. `44.2`/`1.2` `(iccāyasmā nando)` dịch *(Tôn giả Nanda nói,)* đúng `snp5.8:1.2`.

