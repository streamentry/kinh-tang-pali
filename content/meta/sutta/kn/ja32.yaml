notes: |-
  TRÔI DẠT TIÊU ĐỀ ĐÃ TỰ BẮT VÀ SỬA. Bản nháp tôi viết Phẩm Chim Cu cho
  Kulāvakavagga. Khi tự soát toàn tầng tôi thấy tầng đang có năm cách cho cùng chữ
  này: Phẩm Tổ Chim 3 bài (ja31, ja38, ja39), Phẩm Kulāvaka 2 bài (ja33, ja36),
  Phẩm Tổ 1 bài, Phẩm Chim Đang Lồng 1 bài (ja37), Phẩm Chim Cút Kurāva 1 bài. Tôi
  đã đổi sang Phẩm Tổ Chim vì đây là đa số, vì ja31 là bài ngay trước trong cùng
  phẩm và đã published, và vì sn11.6:0.3 đã dịch Kulāvakasutta là Kinh Tổ Chim, tức
  đã có một mốc ngữ nghĩa cho chữ này trong chính tầng. Tôi không thêm cách thứ sáu.
  Phần còn lại của phẩm vẫn chưa thống nhất; đây là việc phải quyết cho cả phẩm một
  lần, không phải sửa lẻ từng bài.
  manuñña có tiền lệ trực tiếp, ja28:1.1 nāmanuññaṁ kudācanaṁ dịch là không bao giờ
  nói lời khó nghe và 1.3 Manuññaṁ bhāsamānassa là Người nói lời dễ nghe, nên tôi dùng
  dễ nghe. ruci có tiền lệ thag1.13:1.1 tỏa rực rỡ, veḷuriya có tiền lệ an3.70:38.2
  ngọc bích, byāma có tiền lệ an4.45:6.3 và an4.46:4.3 dịch một khoanh. byāma theo
  nghĩa là gang hay trượng, tức hơn một khoanh, nhưng tầng đã dùng một khoanh cho
  byāmamatte kaḷevare nên tôi theo tầng và ghi lại ở đây.
  BẤT ĐỊNH ĐÃ GHI — pekhuṇāni ở 1.3. Pāli là Byāmamattāni ca pekhuṇāni. pekhuṇāni
  không có tiền lệ trong toàn tầng và tôi không xác định được nghĩa chắc chắn; có vẻ
  là dạng thức phái của động từ nghĩa là thấy, thì câu là lông ngươi thấy dài tròn
  một khoanh. Bản Anh Sujato đã ghim cũng BỎ chữ này, chỉ dịch là your feathers a
  full fathom long. Tôi không thêm một từ giải thích vào thân kinh nên để lông ngươi
  dài đúng một khoanh, và ghi bất định ở đây. Đây là lý do semantic_fidelity của bài
  này là 9.0 chứ không phải 9.3. Lựa chọn khác là lông ngươi người ta thấy dài tròn
  một khoanh, sát Pāli hơn nhưng rối tiếng Việt.
  dhītaraṁ là hơn, có tiền lệ sn17.24:1.3; dadāmi tôi dịch cho con gái gả cho
  ngươi vì gả là nghĩa tự nhiên của cho trong ngữ cảnh này.
  Kỹ thuật: 9/9 khoá, không rỗng, thứ tự khớp Pāli, NFC, nháy kép mở 1.1 đóng 1.4 y
  hệt Pāli, không dấu lược. save_vi sạch và idempotent. Không chạy npm run
  validate|test|check|build nên technical_integrity 9.5.
