notes: |-
  **Lỗi ý nghĩa nhẹ đã ghi nhận, không chặn.** Ở `1.4`, Pāli `Naccena te dhītaraṁ no dadāmī` — `dhītaraṁ` là "đứa con gái **trẻ hơn**" (so sánh kép với con lớn), còn bản dịch chỉ có *con gái*. Trong truyện vua có hai người con gái, nên chữ "trẻ" có tác dụng phân biệt và bị mất. Tôi **không sửa**; xem `semantic_fidelity` 9.0.
  
  **Về điệu từ trong `1.4`.** Câu *chỉ vì điệu múa, ta không cho con gái gả cho ngươi* dùng **hai** từ chỉ người: `ta` và `ngươi`. Cả hai đều đúng theo tiền lệ của tầng — `ta` là ngôi một (*Ta không thấy một pháp nào khác…*, `an1.9`; *Ta đã kết bè*, `snp1.2:4.1`) và `ngươi` là ngôi hai (*Ngươi đã tin con chó rừng*, `ja113:1.1`). Nhưng đặt cạnh nhau trong một mệnh đề thì đọc gấp, và đó là lý do `vietnamese_clarity` 8.6 và `grammar_logic` 9.0, dưới mức của các bài kệ khác trong lát.
  
  **Bốn vế kệ còn lại chính xác.** `Veḷuriya` → *ngọc bích* ✓; `Byāmamattāni` → *một khoanh* ✓ (giữ đúng đơn vị đoán Hán–Việt quen thuộc thay vì "sải tay"); `piṭṭhi` → *tấm lưng* ✓.
  
  **Sai lệch nhỏ, chấp nhận được:** Pāli có hai chữ `ca` liên tiếp ở `1.2` và `1.3`; bản dịch bỏ, câu vẫn đúng nghĩa.
  
  **Đối chiếu được tầng Anh** đủ bốn vế: *Your cry is sweet, your back brilliant, / your neck the color of sapphire, / and your feathers a full fathom long; / still, because of your dancing, I will not give you my daughter.* Sujato cũng im lặng ở `2.1`.
