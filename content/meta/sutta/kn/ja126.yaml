notes: |-
  Đã đọc hết Pāli qua v4/p4.txt. Đối chiếu bản Anh Sujato ở 8/9 khoá (chỉ dòng kết 2.1 Sujato để trống); tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Mọi segment Pāli đều dưới 40 ký tự nên không có segment nội dung theo ngưỡng coverage — Pāli đứng một mình ở dòng kết, dịch theo công thức đã publish.
  Tiền lệ (đếm trong tầng Việt dự án): khung tiêu đề như ja1 (0.1 giữ Jātaka, 0.2 Bộ Một Bài Kinh, colophon Kinh ... thứ sáu không phẩy); Kusanāḷivagga → Phẩm Lau Kusa như tám bài anh em cùng lát (lau sậy 18, cỏ kusa đã có tiền lệ; Sujato: The Reed-stalk Chapter); kalyāṇa → tốt và pāpaka → xấu theo đúng Sujato (That is good ... ill for others).
  0 tiền lệ, đặt mới, ghi lý do: Asilakkhaṇa → Dấu Gươm (asi → gươm theo dn2 Đây là gươm, đây là vỏ gươm; lakkhaṇa không dùng tướng để tránh nhầm với võ tướng; Sujato: The Mark On the Sword).
  Không blocker. Triangulation 9.0 vì có Sujato ở cả bốn vế kệ lẫn tiêu đề, trừ dòng kết chỉ có Pāli.
