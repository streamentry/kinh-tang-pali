notes: |-
  **Bài.** `tha-ap159` — `Therāpadāna apadāna`, phẩm `Bandhujīvakavagga`, thứ bảy trong
  phẩm (`6.1` tự xác nhận). Bài có 20 khoá Pā li; bản dịch phủ **20/20**.

  **Năm phép kiếm, số do phép đo in ra, không chép tay.**
  (1) `set(khoá Việt) == set(khoá Pāli)`: thiếu **0**, thừa **0**.
  (2) ngoặc kép `“”` và nháy đơn `‘’` so **từng khoá**: 20 khoá đã so, lệch **0**; cân cả bài
  ngoặc kép Pā li 1 / Việt 1, nháy đơn Pā li 0 / Việt 0.
  (3) Pā li trùng nguyên văn **trong chính bài**: **0** cặp, nên 0 cặp Việt khác.
  (4) dấu lược: 20 khoá đã so, lệch **0**. Pā li có **1** khoá `…pe…` (`4.2`) và **0** `…` trần;
  bản Việt có **0** `…pe…` và **1** `…` trần — đúng luật `…pe…` → đúng một `…`, mở rộng là 0.
  (5) chỉ mục Pā li→Việt toàn tầng: **11** cặp Pā li trùng nguyên văn đã dò, dùng lại nguyên văn
  **11** khoá (`0.1`, `0.2`, `1.1`, `1.2`, `2.2`, `3.1`, `3.3`, `3.4`, `4.1`, `4.2`, `4.3`), khác **0**.

  **Tra tiền lệ kèm đếm.**
  `Therāpadāna` → *Therāpadāna* **352** (nhóm lớn nhất trong 361 chỗ) chứ không phải *Trưởng Lão
  Ký Sự* 9.
  `Himavantassāvidūre,` (Pā li trùng nguyên văn **15** bài) → *“Không xa dãy Himavanta,* **6**;
  các cách khác 2+2+2+1+1+1.
  `bhūtagaṇo nāma pabbato;` → *có ngọn núi tên là Bhūtagaṇa;* **1** (`tha-ap346:1.2`), Pā li trùng
  nguyên văn nên dùng lại y nguyên.
  `Sattaratanasampanno,` → *Đầy đủ bảy món báu quý giá,* **25** trên 62 chỗ trùng Pā li (kế
  *Thành tựu bảy báu* 16, *đầy đủ bảy bảo ngọc* 8).
  `cakkavattī mahabbalo.` (bản số ít, `mahabbalo`) → *là Chuyển luân vương có đại thần lực.*
  **31** trên 82 chỗ trùng Pā li.
  `buddhassa abhiropayiṁ;` → ba chỗ trùng Pā li, mỗi cách **1**; tôi chọn *tôi dâng cúng lên
  Đức Phật;* vì bài này kể ngôi 1 (`mayā` ở `1.4` không có, nhưng `…abhiropayiṁ` đi kèm
  `Tiṇasūlaṁ gahetvāna,` và vế sau nói tiếp ngôi 1).
  `Ito ekādase kappe,` → *Cách đây mười một kiếp về trước,* **2** và *Từ mười một kiếp trước,* **2**
  — hòa, tôi theo dạng *Cách đây … về trước* vì dạng đó còn xuất hiện thêm 3 lần cho *Cách đây
  năm kiếp về trước*.
  `Paṭisambhidā catasso,` → *Bốn vô ngại giải,* **361**/369. `…pe…` → *…* **642/642**.
  `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”.* **328**/369.
  `jino` → *Chiến Thắng* (5 bài tha-ap dịch *Đức Chiến Thắng* cho `Padumuttaro nāma jino,`),
  `sayambhū` → *Tự Tại* (**21** cụm *bậc Tự Tại* trong `tha-ap`).

  **Dòng công thức `Itthaṁ sudaṁ` — đo lại trên đĩa hiện tại, đã bắt một lỗi bản nháp.**
  Có **428** khoá trong `tha-ap` mang đúng công thức này. Mở đầu: **428/428** là *Tôi nghe như
  vầy:* — không một chỗ nào thêm lời hô. `imā gāthāyo`: *những bài kệ này* **407** : *bài kệ này*
  **21**. `abhāsitthāti`: *đã nói* **407** : *đã từng nói* **21** (21 chỗ này là cùng một nhóm,
  tức `imā gāthāyo` số nhiều bị dịch số ít). Khoá `5.1` trên đĩa đang là *…đã từng nói bài kệ này.*
  — thuộc nhóm 21; tôi **sửa** thành *…đã nói những bài kệ này.* để khớp nhóm 407. Đây không
  phải tự ý: `imā gāthāyo` là số nhiều, dịch số ít là mất ý.

  **Tên phẩm `Bandhujīvakavagga` — đo rồi vẫn phải nói rõ vì tầng đang tự mâu thuẫn.**
  Có **5** bài cùng phẩm đã dịch và cho **3** cách: *Phẩm Hoa Dâm Bụt* **3** (`tha-ap157`,
  `tha-ap158`, `tha-ap161`), *Phẩm Bandhujīvaka* **1** (`tha-ap155`), *Phẩm Bậc Bandhujīvaka* **1**
  (`tha-ap156`). Cụm *Hoa Dâm Bụt* **không có** gốc trong `Bandhujīvakavagga` — `Bandhujīvaka`
  là tên một vị thiên, và tôi đã dò cả tầng: *Hoa Dâm Bụt* chỉ xuất hiện 3 lần, đúng 3 chỗ kể
  trên, không xuất hiện ở bài nào khác. Tôi chọn *Phẩm Bandhujīvaka* (giữ tên riêng Pā li, đúng
  cách tầng đã dùng cho các phẩm tên riêng như *Phẩm Sobhita*, *Phẩm Chatta*) và **không** nhân
  bản một cách dịch không có căn cứ. Người điều phối nên quyết một tên cho cả phẩm rồi sửa đồng
  loạt, vì hiện tại 5 bài đang đọc theo 3 cách.

  **Tiêu đề `0.3` và dòng lục `6.1`.** Đo `:0.3` của 563 bài `tha-ap`: **165** bài có số thứ tự
  trong Pā li; trong 121 bài đã có bản Việt thì **giữ số 72 : bỏ số 49** (đa số GIỮ); xét toàn
  bộ 373 tệp đã dịch thì 74 có số / 299 không. Con số 66/275 ghi trong `BRIEF_VI3` là đo theo
  tiêu chí khác (gộp cả những bài Pā li vốn không có số vào phe BỎ); tôi theo phép đo của mình
  và ghi **cả hai số** ở đây. Bài này Pā li `Tiṇasūlakattheraapadāna` **không** có số nên
  `0.3` không thêm số. Dạng tiêu đề đo được: *Bài Kệ Tuyên Ngợ Về Trưởng Lão* **215** : *Bài Kệ
  Tuyên Ngôn* 72 : *Ký Sự Về Trưởng Lão* 92 — tôi theo nhóm 215 cho cả `0.3` và `6.1`, hai khoá
  cùng nói về một bài.

  **Dấu `ti`.** Bài này **không có** khoá nào Pā li kết `”ti.`/`’ti.` (0), nên phép đo `ti` của
  lát (nói ở bài `ja254` và `pv1`) không áp dụng; `6.1` kết bằng `sattamaṁ.` nên tôi dịch *thứ
  bảy*, không phải *thứ bảy* kèm dấu lược.

  **Bất định đã ghi nhận, không che.**
  1. `ekosiṁ dharaṇīruho;` (`3.2`) — `dharaṇīruha` nghĩa gốc là *sinh từ mặt đất*, nhưng ở đây
     nó chỉ người làm vua, vì vế sau là `cakkavattī mahabbalo`. Tôi dịch *có một vị chúa đất;*.
     Tầng chỉ có **1** tiền lệ cho chữ này (`mil7.3.4:2.2`, `pādapo dharaṇīruho;` → *Là loài
     thảo mộc mọc từ đất mẹ;*) và đó là nghĩa **thực vật**, không phải nghĩa vua, nên tôi không
     dùng làm mẫu. Đây là chỗ dịch theo nghĩa của bài, không phải theo từ điển đã tra.
  2. `Ekūnasatasahassaṁ, / kappaṁ na vinipātiko.` — Pā li chia *kappa* sang vế sau. Tôi dồn
     *kappa* lên vế trước (*Trên hơn một triệu kappa,* / *không hề suy tàn.*) để câu Việt đọc
     được; đây là chọn lựa văn phong trong ranh giới câu, không thêm mất ý. Từ này là hapax toàn
     Pā li đã ghim (chỉ 1 chỗ trong 5.764 tệp), nên không có mẫu dịch để đối chiếu.
  3. `Tiṇasūlaṁ gahetvāna,` — `tiṇasūla` là đầu cỏ nhọn, ở đây là vật dùng để cạo râu bạch
     tuộc. Tôi dịch *Cầm lấy lưỡi cỏ,* và **không** suy thêm cốt truyện nào ngoài kinh.

  **Coverage tầng Anh.** Mẫu số (Pā li ≥ 40 ký tự, bỏ `:0`) = **1** khoá (`5.1`); Sujato phủ
  **0/1**, và ba tầng tham khảo đều **không có**: Sujato 0 tệp (tầng `kn` của Sujato ở commit đã
  ghim không có `tha-ap`), `english-project` 0 tệp, `translation/vi/phantuananh/` 26 tệp Pháp
