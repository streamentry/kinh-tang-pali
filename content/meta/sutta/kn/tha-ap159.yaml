  Giải quyết draft 2026-10-12 (tha-ap159). Đọc đối kháng lại cả 20 khoá từ Pāli; 8/20 khoá đổi
  chữ (0.3, 1.3, 1.4, 2.1, 2.3, 2.4, 3.2, 6.1), trong đó 5 khoá là lỗi nghĩa thật
  (1.3, 1.4, 2.3, 2.4, 3.2). **Các mục cũ bị thay thế**: mục "Tiêu đề `0.3` và dòng lục `6.1`" (dạng
  *Bài Kệ Tuyên Ngợ Về*), mục bất định 1–3 (*chúa đất*, *kappa* dồn vế trước, *lưỡi cỏ*), và dòng
  tra tiền lệ `jino` → *Đức Chiến Thắng* kèm *Vasateko* như tên riêng.
  Lỗi nghĩa thật đã sửa:
  - `1.3` `Vasateko jino tattha` = `vasate` (cư ngụ) + `eko` (một) + `jino`: "tại đó có một Đức Chiến
    Thắng cư ngụ". Bản cũ coi *Vasateko* là tên riêng của Đức Phật: sai. Đối chiếu tiền lệ trong
    Pāli của tầng: `Vasate tattha …` xuất hiện ở `bv24:15.1`, `bv25:5.3`, `bv25:16.3`, `bv26:32.3`,
    `tha-ap551:4.3` (5/5 là động từ "cư ngụ", không có chỗ nào là tên người).
  - `1.4` `lokanissaṭo` = `nissaṭa` (đã thoát ra) + `loka`: "đã thoát ly thế gian" (đối chiếu
    `nikkhanto nissaṭo vippamutto` ở `mnd2`, `mnd6`, `mnd9`, `mnd14`). Bản cũ "tối thượng thế gian":
    sai nghĩa, lẫn với `lokanāyako`/`lokanātho`.
  - `2.3`–`2.4` `Ekūnasatasahassaṁ, kappaṁ na vinipātiko`: bản cũ "Trên hơn một triệu kappa, / không hề
    suy tàn" sai hai chỗ: `ekūna` là "kém một" (đối chiếu `tha-ap127:14.2` `ekūnanavutimhito` → "tám
    mươi chín"), nên số này không thể là "hơn một triệu"; và `vinipātiko` là kẻ rơi vào đọa xứ (đối
    chiếu `vinipātaṁ na gacchati/gacchasi/gacchahaṁ`, 7 chỗ `tha-ap`: 5 dịch "(không) rơi/đi vào đọa xứ", 2 dịch khác). Nay: "Một trăm
    ngàn kém một / kiếp, không rơi vào đọa xứ."
  - `3.2` `ekosiṁ` = `eko asiṁ` ("tôi là một"): bản cũ bỏ ngôi thứ nhất. Cấu trúc `eko āsiṁ …` / `ekosiṁ …`
    có 28 chỗ trong `tha-ap`, đa số dịch ngôi thứ nhất hoặc "là một vị …"; nay "tôi là một vị chúa đất".
  - `2.1` `Tiṇasūlaṁ` là tên một loài thực vật có hoa (`tha-ap415:13.4` `tiṇasūlaṁ apūjayiṁ` →
    "cúng dường hoa tiṇasūla"; `tha-ap407:5.2` "những khu rừng tiṇasūla"), không phải "lưỡi cỏ" tự
    nghĩ ra từ tách chữ. Nay giữ nguyên tên "tiṇasūla", không thêm *hoa*/*cỏ*.
  - `0.3`/`6.1` và `translationTitle`: chữ *Ngợ* không có nghĩa trong tiếng Việt và là lỗi chính tả lan trong
    tầng (285/563 tệp `tha-ap` có dạng *Tuyên Ngợ*; thêm 99 có *Tuyên Ngôn*, 130 có *Ký Sự Về*). Bài
    cùng gốc `tha-ap415:0.3`/`30.1` (*Tiṇasūlakachādaniya*) dùng *Ký Sự Về Trưởng Lão …*; theo đó đổi
    sang *Ký Sự Về Trưởng Lão Tiṇasūlaka* ở `0.3`, `6.1` và `translationTitle`. Việc sửa 285 tệp còn
    lại ngoài phạm vi của bài này: đề nghị người điều phối xử lý đồng loạt.
  Số Pāli: `ekūnasatasahassa` là hapax toàn tầng Pāli đã ghim (1 chỗ). `ekūna` có thể đi với *sata* (99 × 1.000 =
  99.000) hoặc với cả *satasahassa* (100.000 − 1 = 99.999); tôi dịch sát cấu trúc "một trăm ngàn
  kém một" (đọc tự nhiên là 99.999) và **ghi bất định**, không đoán; không có bản Anh để phân xử.
  Giữ nguyên vì Pāli có sẵn: `1.1`, `1.2`, `2.2`, `3.1`, `3.3`, `3.4`, `4.1`–`4.3`, `5.1`. Khoá `0.2`: *Phẩm
