notes: |-
  Dịch trọn 126 khoá (3 khoá tiêu đề :0.x, 121 khoá kệ gồm ba khoá …pe…, khoá lời kết 32.1 và khoá kết 33.1) trực tiếp từ Pāli root; không có bản Anh của Sujato, không có lớp english-project và không có bản Việt hiện hành cho tha-ap541 tại commit đã ghim. Đối chiếu thuật ngữ và công thức với các Ký Sự cùng phẩm và liền kề (tha-ap533, tha-ap537, tha-ap539, tha-ap544, tha-ap547, tha-ap548, tha-ap550) cùng các bài tha-ap khác có cùng Pāli.
  Tiền lệ đã đo: có 63 khoá (không kể :0.x) mà Pāli, bỏ dấu câu và nháy, trùng nguyên văn với khoá đã dịch ở nơi khác (17.964 khoá Pāli đã có bản Việt trong 522 bài tha-ap được dò); 61 khoá dùng lại nguyên văn bản đã có, trong đó có Đức Chiến Thắng tên Padumuttara (23 trong 24), Cách đây một trăm ngàn kiếp (5), vị ấy đã đưa đông đảo mọi người vượt qua (2 so với 1), Là bậc đầy lòng trắc ẩn từ bi (5 trong 6), Rực rỡ tựa như cột trụ bằng vàng (2), Một trăm ngàn năm (3), là tuổi thọ lúc bấy giờ (3), là Bà-la-môn rất thông thạo lời tụng (5 trong 10; 2 khoá một Bà-la-môn thông suốt thần chú, 3 khoá còn lại khác), sinh ra trong dòng họ Okkāka (27 trong 28), tên là Gotama theo dòng ấy (27), sẽ làm bậc Thầy ở thế gian (27), Người kế thừa giáo pháp của Ngài (15 trong 16), là con ruột, do giáo pháp tạo nên (13 trong 16), sẽ làm đệ tử của bậc Thầy (5 so với 7 dạng môn đồ có nháy đóng, nên chọn dạng đúng với Pāli khoá này không có nháy), Nhờ nghiệp lành khéo làm ấy (26 trong 28), cùng với tâm nguyện và chí hướng (31 trong 35), sau khi từ bỏ thân người (20 trong 23, thêm chữ hoa đầu câu), Các phiền não của ta đã được thiêu rụi (113), ta sống không còn lậu hoặc (122), Thật lành thay sự đến của ta (108), đã làm tròn lời dạy của Đức Phật (127 ở khoá không có nháy đóng, 479 ở khoá có), Bốn vô ngại giải (508). Hai khoá khác với tiền lệ: 15.3 (tiền lệ là hai khoá, một phụng sự một hầu hạ; chọn hầu hạ theo tha-ap548:16.3, và với paricariṁ nói chung trong tha-ap là 3 khoá hầu hạ, 2 khoá phụng sự, 1 khoá chăm sóc) và 20.1 (tiền lệ duy nhất tha-ap103:2.1 dịch Con đã dâng muỗng đồ ăn khất thực, đổi ngôi con thành ta theo ngôi kể của bài). Hai khoá có vài dạng, chọn theo Pāli nhất: 18.1 padesarajjaṁ dịch Vương quyền cai quản các vùng đất rộng lớn (12 khoá) thay vì Vương quốc rộng lớn ấy (15 khoá) vì giữ được padesa, như tha-ap539:19.1; 18.2 dùng dạng kết bằng dấu chấm phẩy theo Pāli (9 khoá) thay vì dấu chấm (18 khoá) vì Pāli khoá này kết bằng dấu chấm phẩy. Ngôi kể dùng ta: phạm vi tha-ap500 đến tha-ap559 là 329 khoá chứa ta so với 255 khoá chứa tôi; toàn lớp tha-ap là 2.148 so với 2.638 (đếm thô, ta viết hoa của Đức Phật cũng tính), hai phạm vi cho hai đa số khác nhau; chọn ta theo các bài liền kề trong phẩm (tha-ap533, tha-ap537, tha-ap539). Trong lời nói của Rādha và Sāriputta với Đức Thế Tôn (23.1 đến 23.4, 25.2, 25.4) dùng con, theo tha-ap168:1.1 (1 khoá dạng Bạch Thế Tôn, con so với 0 khoá tôi cùng dạng, nên bằng chứng rất mỏng); tha-ap548:12.1 dùng tôi vì ngôi kể của bài đó là tôi.
  Tên phẩm Kaccāyanavagga dịch Phẩm Kaccāyana (tha-ap533, tha-ap537, tha-ap539). :0.3 trong Pāli là Rādhattheraapadāna, không bắt đầu bằng số nên bản Việt không có số thứ tự; translationTitle bằng đúng giá trị :0.3 (Ký Sự Về Trưởng Lão Rādha). Dạng tên bài theo đa số gần nhất (tha-ap500 đến tha-ap559: Ký Sự 29 so với Bài Kệ Tuyên Ngợ 15); trên toàn lớp tha-ap hai dạng kia lại nhiều hơn (Tuyên Ngợ 253, Tuyên Ngôn 136, Ký Sự 126, khác 7), hai phạm vi cho hai đa số khác nhau và chữ Tuyên Ngợ có vẻ là lỗi chính tả cần người biên tập phán một lượt cho cả cuốn. Lời kết 32.1 dùng nhóm nói những bài kệ này (518 khoá, theo imā gāthāyo là số nhiều; 2 khoá dạng số ít). Khoá 33.1 theo dạng Ký Sự Về Trưởng Lão X, thứ chín (như tha-ap539 và tha-ap547); navamaṁ là thứ chín.
  Lời thọ ký tương lai (12.1 đến 14.4): bhavissati, hessati, paññapessati dịch sẽ làm, sẽ tuyên bố. Khoá 12.1 Satasahassito kappe dùng Sau một trăm ngàn kiếp nữa (như tha-ap533:10.1; các khoá thọ ký tương lai cùng Pāli là 6 trong lớp: 2 dùng Sau, 3 dùng Vào, đều hướng tương lai, và 1 khoá sai hướng như nêu dưới đây). Ngoài lát, không sửa: tha-ap19:7.1 cùng Pāli với bhavissati ở khoá thứ tư đang dịch Vào một trăm ngàn đại kiếp trước, trái hướng tương lai của Pāli; nên rà lại. Khoá 1.3 Ito satasahassamhi dùng Cách đây một trăm ngàn kiếp (5 trong 5 khoá cùng Pāli), còn 1.4 chỉ còn bậc Hữu Nhãn đã xuất hiện như tha-ap539:1.4.
  Dấu lược: ba khoá …pe… (29.2, 30.2, 31.2) giữ đúng một …; không có (…) trần trong Pāli của bài này. Nháy: kép mở ở 1.1 và đóng ở 31.3 (30.3 không có nháy đóng, đúng Pāli); nháy đơn mở ở 11.1 và đóng ở 14.4, rồi mở và đóng lần lượt ở 22.3 và 22.4, 23.1 và 23.4, 24.3 và 24.4, 25.2 và 25.4, 26.1 và 26.4; đều khớp Pāli từng khoá, 0 lệch trên 126 khoá (6 cặp nháy đơn, 1 cặp nháy kép). Đối chiếu 126 khoá với Pāli: đủ khoá, đúng thứ tự, NFC sạch, không khoá rỗng, không khoảng trắng thừa, chữ Pāli trong bản Việt chỉ là tên riêng (Padumuttara, Haṁsavatī, Okkāka, Gotama, Rādha, Sāriputta, Giribbaja), đơn vị ratana và chữ siṅgī. Có 4 nhóm Pāli trùng nguyên văn trong chính bài (2.4 và 6.4; 14.3 và 28.3; 29.2, 30.2 và 31.2; 30.3 và 31.3), tổng 6 cặp, 1 cặp lệch có chủ ý: 14.3 và 28.3 (Paṭibhāneyyakānaggaṁ) khác vị ngữ là paññapessati ở 14.4 và ṭhapayī ở 28.4 nên bản Việt khác nhau (Vị tối thắng trong những vị có biện tài so với Vào vị trí tối thắng trong những vị có biện tài); 30.3 và 31.3 chỉ khác nháy đóng, đúng theo Pāli. Đã đọc cặp Pāli với Việt của cả 126 khoá.
  Số Pāli, mỗi phép tính đã kiểm: satasahassa là sata 100 nhân sahassa 1.000 là 100.000, dịch một trăm ngàn ở 1.3 và 12.1; vassasatasahassāni là 100.000 năm (6.1); Ratanānaṭṭhapaññāsaṁ là aṭṭha 8 cộng paññāsa 50 là 58 ratana, giữ đơn vị ratana (như tha-ap539:5.1), không quy đổi; bāttiṁsa là ba mươi hai (5.4); tāvatiṁsa là Ba mươi ba (16.4); pañcasīla là năm giới (3.4); satānaṁ tīṇikkhattuñca là tīṇi 3 nhân sata 100 là ba trăm lần (17.1) và satānaṁ pañcakkhattuñca là pañca 5 nhân 100 là năm trăm lần (17.3), như tha-ap539:18.1 và 18.3; catasso paṭisambhidā là bốn vô ngại giải (31.1). Không có cụm tiṁsakappasahassa nào cần phân xử; tiṁsa chỉ xuất hiện trong bāttiṁsa (32) và tāvatiṁsa (33). Lưu ý ngoài lát (không sửa): cùng Pāli satānaṁ tīṇikkhattuñca và satānaṁ pañcakkhattuñca đã được dịch Cả bảy món báu quý giá và Cũng cả năm món báu quý giá ở ít nhất 3 khoá trong các bài tha-ap khác (3 khoá cho Pāli của 17.1 và 3 khoá cho Pāli của 17.3, thêm 1 khoá Cũng cả trăm món báu cùng năm món quý ở tha-ap459:6.3), cả bảy lẫn trăm đều không có căn cứ trong Pāli vì tīṇi là ba, nên nên rà lại các khoá đó.
  Bất định và lựa chọn cần người biên tập lưu ý: (1) 8.1 đến 8.4: vināyakaṁ ở 8.4 đồng cách với mahāvīraṁ ở 8.1, là chủ thể của paññāpentaṁ; bản Việt giữ thứ tự Pāli nên bậc Điều Ngự đứng cuối khoá và có thể bị đọc như bổ nghĩa cho vị tỳ-kheo; không đảo để khỏi lệch khoá. paṭibhāneyyaka dịch có biện tài (0 tiền lệ trong lớp cho dạng này; paṭibhāne ở tha-ap539:26.2 là biện tài). (2) 10.2 siṅgīnikkhasamappabho dịch có hào quang như khối vàng siṅgī: siṅgī là loại vàng, nikkha là một khối hay đồng vàng; không có tiền lệ trong tầng (0 khoá), nên đây là cách hiểu có nghĩa chưa chắc. (3) 14.1 hetuguṇe dịch phẩm hạnh làm nhân của ngươi: 0 tiền lệ; có thể hiểu là đức hạnh của nguyên nhân ấy; chưa phân xử được. (4) 19.3 đến 19.4: niddhe hiểu là nghèo khó theo ngữ cảnh (như niddhane); vikalacchādanāsane hiểu là thiếu thốn y phục (chādana) và thức ăn (asana); không có tiền lệ nào (0 khoá). (5) 21.1 pabbajati na maṁ koci dịch Không ai cho ta xuất gia vì maṁ là tân ngữ; hình thái động từ ở đây mang nghĩa cho xuất gia. (6) 22.3 puttasokaṭṭo hiểu là putta (hô cách, này con) và sokaṭṭo (bị sầu muộn hành hạ), vì 23.3 Tena sokena dīnosmi nói về nỗi sầu không được xuất gia; cách hiểu khác là sầu vì con không hợp với bài. (7) 25.3 dāpesi là thể sai khiến, Pāli không nêu ai dâng, dịch đã cho dâng; còn 20.1 pādāsiṁ là Ta đã dâng, nên hai khoá khác động từ. (8) 26.2 đến 26.3: imaṁ tuvaṁ pabbājehi dijaṁ vuḍḍhaṁ bị chia qua hai khoá, động từ hãy cho xuất gia đứng ở cuối 26.2 và 26.3; 26.4 ājāniyo dịch bậc thuần chủng (6 khoá ājāniya trong tầng, toàn dạng ngựa hay bò thuần chủng). (9) 27.2 kammavācopasampadaṁ dịch thọ cụ túc giới bằng yết-ma; 0 tiền lệ cho kammavācā trong lớp. (10) 28.1 đến 28.4: yato và tato là cặp nhân quả (do ta nghe với lòng hoan hỷ, nên bậc Chiến Thắng đặt ta); chữ đặt không kèm tân ngữ thứ hai vì Pāli aggaṁ đứng riêng ở 28.3. (11) 9.1 kāraṁ katvāna dịch đã phụng sự, nhất quán với 11.3, 24.3 và 25.2 (kāra và adhikāra đều là phụng sự); tha-ap548:10.4 dịch tỏ lòng tôn kính cho kāraṁ katvā (1 khoá), tha-ap406:10.3 và tha-ap432:9.3 dịch việc phụng sự (2 khoá). (12) tādino ở 20.2 dịch bậc Vững Vàng theo 4.4 và tha-ap539:4.4; toàn lớp tha-ap là dạng bậc Như Thật và các dạng khác chiếm nhiều hơn. (13) 13.3 Rādhoti nāmadheyyena dịch Với tên gọi là Rādha, theo tha-ap62:3.1. (14) 20.4 ārāma dịch tịnh xá (ārāma đơn: 2 khoá tịnh xá, 1 khoá vườn cảnh; saṅghārāma: 4 khoá tịnh xá, 2 khoá tu viện). (15) 7.2 brāhmaṇo mantapāragū dịch lời tụng thay cho thần chú theo 5 khoá trùng nguyên văn.
  Kiểm kỹ thuật chưa chạy trong lượt này: npm run validate, npm test, npm run check và npm run build; vì vậy technical_integrity đặt 9.6 và không tuyên bố technical gate đã pass. Bài chưa có record trong reference-gaps; việc ghi nhận nằm ngoài phạm vi lát này.
