notes: |-
  Dịch từ Pāli root, đối chiếu bản Anh Bhikkhu Sujato và bản Việt Hòa thượng Thích Minh Châu khi có.
  Đầy đủ 10 tiêu chí scorecard; technical_integrity 9.6 vì lệnh validate/test do coordinator chạy.

  Lượt cải thiện 2026-10-13: đọc đối kháng 24 khoá, sửa 8 khoá.
  - 2:4 (accuracy fix, nặng): "đi đầu hướng dẫn Tăng chúng" -> "được chúng tỳ-kheo vây quanh". bhikkhusaṅghapurakkhataṁ nghĩa là được Tăng vây quanh, tôn kính; bản cũ đảo vai thành Đức Phật dẫn đầu Tăng. Tiền lệ toàn tầng là "được … vây quanh" (thag6.9:4.4, thag12.2:3.2, thag21.1:31.4, hơn 15 khoá tha-ap). Bản Anh Sujato đọc "at the fore of the Saṅgha"; không theo, vì cách hiểu này lệch tiền lệ Pāli của chính tầng đang ghim.
  - 5:1-5:4 (accuracy fix, vừa): bỏ cặp nháy đơn ‘…’ tự thêm quanh kệ 5, vì Pāli không có (chỉ có “ mở ở 1:1 và ” đóng ở 5:4); bỏ "lớn lao" (bahuṁ chỉ là "nhiều"), bỏ "đại" (sappañño là "có trí tuệ"), "nàng Bhaddā" thành "Bhaddā" (đối tượng là một tỳ-kheo-ni), "cúng dường y phục lên" thành "dâng y cho" (adāsi + cīvaraṁ; "y" là tiền lệ).
  - 2:1 (terminology fix, nhẹ): "Bước ra khỏi buổi thiền ban ngày" -> "Rời khỏi nơi an trú ban ngày", theo tiền lệ tha-ap481:1.3 và thig3.4:1.1 (divāvihārā nikkhamma, 3/3 khoá).
  - 4:4 (accuracy fix, nhẹ): "thọ nhận vật thực cúng dường" -> "thọ dụng vật thực khất thực" (abhuñjahaṁ là "ăn, thọ dụng"; "cúng dường" là nghĩa thêm).
  - 6:1: dấu kết đổi "Bhaddā Tóc Xoăn. …" thành "Bhaddā Tóc Xoăn …." theo Pāli (…. ) và đa số 44/65 khoá kết kiểu này ở thig.
  Điểm đổi: semantic_fidelity 9.3 -> 9.2 và ambiguity_integrity 9.2 -> 9.0 (bản cũ chưa ghi bất định nào; nay ghi rõ bên dưới); final_score 9.41 -> 9.38. Các tiêu chí khác giữ nguyên.
  Bất định còn lại (không phân xử được, giữ nguyên): (a) 3:3 "bhadde" là tên riêng hay hô ngữ "hiền nữ" (thi-ap21:44.2 dịch "này hiền nữ"; ở đây theo Sujato và công thức ehi bhikkhuni, giữ "Bhaddā"); (b) 5:1-5:4 người nói kệ 5 là chính Bhaddā tự thốt hay lời người khác, Pāli không nói rõ nên chỉ giữ trong nháy chung; (c) 4:1 ciṇṇā dịch "đã đi khắp", "khắp" hơi mạnh hơn Pāli; (d) 0:1 dùng "Therīgāthā N" theo đa số 61/73 khoá đầu đề thig, dù giữ Pāli trong đầu đề.
