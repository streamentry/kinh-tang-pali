notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `tha-ap` (xem blocking_errors).
  Bản dịch dùng lại nguyên văn 20/34 khoá có tiền lệ đếm được trong tầng dự án: `Therāpadāna` giữ nguyên Pāli (265 bài khác), `Phẩm Trái Avaṭa` (6× cho `Avaṭaphalavagga`), `“Tại kinh thành Bandhumatī,` (4×), `Bốn vô ngại giải,` (267×), `đã làm tròn lời dạy của Đức Phật.` (53×) và bản đóng nháy (235×), `Các phiền não của ta đã được thiêu rụi,` (47×), `ta sống không còn lậu hoặc.` (47×), `Thật lành thay sự đến của ta,` (47×), `Vào chín mươi mốt kiếp trước,` (17×), `Ta không biết mình rơi vào khổ đau,` (71×).
  Ngôi thứ nhất chọn theo cụm tiền lệ lớn nhất của tầng (47× cho ba câu kệ kia) nên là `ta`; riêng thi-ap12 dùng `con` vì là Trưởng lão NI — xem notes của thi-ap12.
  `…pe…` của Pāli giữ đúng MỘT dấu lược `…`, theo 282 bài đã có; không mở rộng.
  `phaḷadānassidaṁ phalaṁ.` chọn `đây là quả báo của việc dâng cúng trái cây.` (9×) chứ không phải bản 10× `… hoa trái`, vì 5.2 đã dịch `yaṁ phalamadadiṁ tadā` là `trái cây` và `hoa trái` thêm một loại vật không có trong Pāli khoá này.
  Bất định còn lại, đã ghi ở đây chứ không giải thích trong thân kinh: `Vittisañjananaṁ mayhaṁ` (3.1) đọc theo dạng động từ quá khứ như các câu `…katvā` liền kề, nên chủ thể (Đức Phật liếm vết thương của Trưởng lão) không được nêu ra; `diṭṭhadhammasukhāvahaṁ` (3.2) dịch theo nghĩa `diṭṭhadhamma` mà Kinh Tư Tập dùng (`sự sống an lạc theo điều đã thấy biết`), và `Uppajjateva ratanaṁ … nibbattassa tahiṁ tahiṁ` (4.3–4.4) là cặp kệ không có tiền lệ nào trong tầng, dịch theo nghĩa chữ nghĩa.
  `gacchantaṁ anilañjase.` dùng lại nguyên văn `đang ngự giữa bầu trời lộng gió.` (tha-ap245:1.4) theo luật Pāli trùng; ghi nhận `ngự` là hơi lệch vì `gacchantaṁ` là đi, nhưng ưu tiên tính nhất quán với bài đã xuất bản.
  Tên riêng giữ dạng Pāli không dấu-căn theo khuôn `Bài Kệ Tuyên Ngợ Về Trưởng Lão X` (92 bài, đa số trong 244 tiêu đề `…theraapadāna`); số thứ tự ở `:0.3` bỏ đi như đa số, đặt ở khoá đóng `:10.1`.
  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|check`; coordinator cần chạy đủ bốn lệnh sau trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, và `npm run build`.
