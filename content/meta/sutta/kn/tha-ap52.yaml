notes: |-
  **ĐỌC TOÀN BỘ PĀLI TRƯỚC KHI VIẾT.** 89 khoá, đủ và đúng thứ tự Pāli; sau khi ghi đã in lại từng cặp Pāli↔Việt và đọc.

  **`:0.3` — BỎ SỐ.** Pāli `tha-ap52:0.3` = `Cundattheraapadāna`, không bắt đầu bằng số ⇒ bản Việt không có số thứ tự; `translationTitle` bằng đúng giá trị `:0.3` của bản Việt.

  **CHỌN `Tuyên Ngôn` — SỐ ĐO PHÂN KỲ, GHI CẢ HAI.** Đo trên các tệp `tha-ap` đã có bản Việt (bỏ số đầu `:0.3`), tính theo dạng chữ trong tiêu đề: toàn tầng (uid 1–600) `Tuyên Ngợ` 250 · `Tuyên Ngôn` 120 · `Ký Sự` 103; phạm vi gần (uid 40–60) `Tuyên Ngợ` 10 · `Tuyên Ngôn` 4 · `Ký Sự` 3; cùng phẩm Upāli (tha-ap45–50) `Tuyên Ngôn` 3 · `Ký Sự` 2 · `Tuyên Ngợ` 1. `Tuyên Ngợ` là dạng có đa số số lượng nhưng là chính tả sai (không thành từ); tôi chọn dạng đúng chính tả `Tuyên Ngôn` và báo để biên tập phán một lượt cho cả cuốn.

  **PHẠM VI CÁC CỤM SỐ — TỰ TÍNH, KHÔNG CHÉP.** `catusattati` = catu 4 + sattati 70 = **74** (`Catusattatikkhattuṁ` ⇒ *bảy mươi tư lần*; khớp tha-ap45:11.1). `tisata` = ti 3 × sata 100 = **300** (`Pathabyā rajjaṁ tisataṁ` ⇒ *ba trăm lần làm vua trên đất*). `pañcasattati` = pañca 5 + sattati 70 = **75** (`Pañcasattatikkhattuñca` ⇒ *bảy mươi lăm lần*). `koṭisata` = một trăm koṭi, giữ nguyên `koṭi` theo tiền lệ (`tha-ap391:6.4`, `mil5.1.3`, `snp3.10:29`); không quy đổi ra số trần. Bài **không** có cụm `tiṁsa`/`kappasahassa` nên không phải xử lý bất định `Tiṁsakappasahassa` (3.000 hay 300.000; đo tầng `tiṁsa` = 30) — không dùng đến, ghi để người biên tập biết.

  **SỐ TRONG BÀI TÓM TẮT PHẨM (`:24.5–6`).** `Gāthāsataṁ satālīsaṁ, catasso ca taduttari`: sata 100, `sa-tālīsa` = *cùng bốn mươi* (tālīsa 40; đo tầng `tha-ap187:5.1` Cattālīsa = 40), `catasso` = 4, `taduttari` = *trên số ấy* ⇒ 100 + 40 + 4 = **144**. Đối chiếu độc lập: đếm các khổ kệ của Pāli tha-ap43–52 (24 + 29 + 16 + 7 + 6 + 5 + 5 + 8 + 25 + 19) cũng ra **144** — khớp. (Phép đếm này là đếm khổ, không phải đếm dòng.)

  **DÙNG LẠI NGUYÊN VĂN.** Dò toàn tầng `tha-ap` (481 tệp, trừ chính bài): **34** khoá Pāli của bài có Pāli trùng nguyên văn ở nơi khác; trong đó **29** khoá dùng lại nguyên văn bản Việt đã có (tiêu biểu: `:0.1` `Therāpadāna` 469 tệp; `:1.1` *Của Đức Thế Tôn Siddhattha,* (6); `:1.2` (8); `:3.3` *Với tâm tịnh tín hân hoan,* (55); `:4.4` (20); `:5.3` (5) *Ta sẽ tuyên thuyết về người ấy,*; `:5.4` (7); `:8.1–8.4` đúng tha-ap45:11.1–11.4; `:9.3` (tha-ap342:9.3); `:14.3`/`:18.3` (12); `:14.4` (5); `:18.4` (nhóm *không còn lậu hoặc*); `:19.3` (55); `:19.4` (2); `:23.1` (34)). **5** khoá Việt khác bản trùng, đều có lý do: `:3.1` (đổi *Ngài rực rỡ…* thành câu không thêm đại từ vì `buddhaṁ` đứng ở `:3.2`); `:6.2` (*đoàn vua trời* ⇒ *đoàn chư thiên*, vì `devasaṅgha` là hội chư thiên, không có từ `rājā`); `:13.1` (bỏ chữ *sau khi*, trùng nghĩa với *về sau*); `:16.4` (xem dưới); `:17.1` (dùng dạng 2 tệp *nâng lên bằng cả hai tay* thay vì dạng 3 tệp *Tôi nâng hoa…*, vì ở đây vật được nâng là xá-lợi chứ không phải hoa). **Pāli trùng trong chính bài:** 1 cặp (`Sabbāsave pariññāya,` ở `:14.3` và `:18.3`), Việt giống nhau; 0 cặp trùng mà Việt khác.

  **NGÔI KỂ: *tôi* cho vị trưởng lão, *Ta* cho Đức Phật.** Tầng chia gần đôi (`ta đã` 389 · `tôi đã` 338; `tôi dâng` 150 · `ta dâng` 70); phạm vi gần (tha-ap45–49) nghiêng *tôi*. Giữ *tôi* xuyên suốt phần trưởng lão tự thuật. Hệ quả: `:18.4` dùng *tôi sống không còn lậu hoặc* (14 tệp) thay vì dạng *ta sống…* (100 tệp) để nhất quán trong bài; đây là chọn lựa văn phong, không phải khác nghĩa.

  **`lokajeṭṭha` TRONG HAI KHOÁ (`:1.2`, `:16.4`).** Tầng có hai dạng: *bậc tối thượng thế gian* và *bậc Trưởng Thượng Thế Gian* (4 tệp cho đúng khoá `:16.4`). Giữ nhất quán trong bài bằng *bậc tối thượng thế gian* ở cả hai chỗ; phần `narāsabha` giữ *bậc Hùng Nhân giữa loài người* theo dạng 4 tệp. Khoá `:16.4` vì vậy là một trong 5 khoá khác tiền lệ.

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
    · `agghiya` / `pupphagghiya` (`:1.3`, `:3.1`, `:3.4`, `:5.2`) — hapax toàn tầng cho nghĩa vật dâng. Tiền lệ `Kañcanagghiyasaṅkāsa` dịch *cột/trụ bằng vàng* ở 7 nơi (tha-ap27, 97, 205, 328, 333, 368, 80), nên dịch `agghiya` = *cột trụ* và `pupphagghiya` = *cột trụ hoa*. Có thể là giá/đài dâng hoa; Pāli không nói rõ hình dạng. `:2.1` `taṁ pupphaṁ` tôi giữ trung tính là *phần hoa ấy* chứ không bảo là "cột".
    · `sakakammaṁ apassito` (`:10.4`) — `apassita` = nương tựa; tiền lệ chỉ có 3 nơi (`tha-ap321:1.4` *chưa từng thấy ai đem đến*, `tha-ap339:1.4` *nương nhờ*, `tha-ap431:1.4` *nương tựa*); hai trong ba theo nghĩa *nương tựa*, và dạng đầu hiển nhiên không khớp Pāli. Dịch *nương tựa vào nghiệp của chính mình*; còn khả năng đọc là *không nương tựa vào…* (phủ định `a-`) cần người biên tập phán.
    · `bhātaraṁ me` (`:15.3`, `:16.1`) — Pāli chỉ nói *người anh/em của tôi*, không nói anh hay em. Dịch trung tính *người anh em của tôi*; không thêm tên (bài không nêu).
    · `yonimhi brāhmaṇe` (`:12.1`) — đọc `brāhmaṇe` là tính từ của `yonimhi` (*trong bào thai bà-la-môn*), `so bhavissati` (`:12.2`) có vị ngữ ở `:12.3–4` (*con trai của Vaṅganta… con ruột yêu quý của Sārī*). Cách đọc khác (`brāhmaṇe so bhavissati` = *vị ấy sẽ là bà-la-môn*) làm `:12.3–4` mất chủ ngữ nên tôi loại.
    · `puññakammappabhāvitaṁ` (`:7.4`) — `pabhāvita` = *được làm cho hiện ra/tạo ra*; dịch *do nghiệp phước thiện tạo nên*; không có tiền lệ cùng từ.
    · `sampattiṁ` (`:8.3`) — tiền lệ cho đúng khoá này là *sự phúc báo* (tha-ap45, tha-ap50); khoá khác (tha-ap62:8.3 `Dve sampattī`) lại dịch *thành tựu*. Dùng lại *phúc báo* theo cặp trùng nguyên văn; không đổi.
    · `aṅgīrasassa sāsane` (`:13.2`) — `Aṅgīrasa` là tên hiệu của Đức Phật (nghĩa gốc *rực rỡ*); dịch *bậc Aṅgīrasa*, giữ tên và không giải thích trong thân kinh. `Cūḷacunda` (`:13.3`) giữ nguyên; nó khác tên `Cunda` của đầu đề/lời kết và Pāli không nói rõ quan hệ.
    · `Dujjayo` (`:10.1`) — đọc là danh xưng (`Dujjaya`, nghĩa gốc *khó chinh phục*) vì `nāma nāmena`; không dịch nghĩa.

  **LỜI KẾT `Itthaṁ sudaṁ … abhāsitthāti`.** Dùng nhóm đa số: *Tôi nghe như vầy: Tôn giả Trưởng lão Cunda đã nói những bài kệ này.* (407 tệp), không dùng dạng số ít *bài kệ này* (21).

  **COVERAGE ĐO ĐƯỢC.** Mẫu số = **1** khoá Pāli có nội dung (≥ 40 ký tự, loại `:0`), là `:20.1` — câu kết, không phải kinh văn; 22 khoá còn lại đều dưới 40 ký tự. Tầng Anh Sujato 0/1; `vietnamese-current` và `english-project` không phủ phẩm này. Theo BRIEF, đây là trường hợp cổng coverage gần như *không đo được gì* chứ không phải *không cần ghi nhận gap*.

  **DẤU LƯỢC.** Pāli của bài này không có `…` và không có `(…)`; bản Việt cũng không có.

  **NGOẶC.** Pāli mở `“` ở `:1.1` và đóng `”` ở `:19.4`; mở `‘` ở `:5.1` và đóng `’` ở `:14.4`. Đếm từng khoá, khớp Pāli: `“` 1/1 · `”` 1/1 · `‘` 1/1 · `’` 1/1; 0 khoá lệch. Pāli không có dấu `ti` đóng trích (`Cūḷacundoti` chỉ là đuôi `ti` của tên, không cần ngoặc).

  **TỰ KIẾM.** Tập khoá Việt = tập khoá Pāli (89/89), thứ tự khớp; NFC 0 lỗi; 0 khoá rỗng; 0 khoảng trắng thừa; 0 từ Pāli lọt sang Việt ngoài tên riêng đã khai (`koṭi`, `Vaṅganta`, `Sārī`, `Aṅgīrasa`, `Cūḷacunda`, `Soṇa`, `Sanniṭṭhāpaka`, `Caṅkama` — đều là tên hoặc từ giữ nguyên có trong Pāli của bài).

