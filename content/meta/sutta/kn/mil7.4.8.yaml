  BẢY ĐỨC TÍNH CỦA MẶT TRỜI. Công thức lặp đúng 7 vòng: `Puna caparaṁ… / evameva kho… / Idaṁ… N-aṅgaṁ
  gahetabbaṁ`. Dịch **nhất quán theo cả bảy vòng**, không đổi nhịp câu; đây là chỗ dễ rơi vào dịch khuôn, nên
  `:N.3` giữ nguyên một khuôn “Này Đại vương, đây là đức tính thứ N của mặt trời cần phải nắm lấy.” theo đúng
  tiền lệ mil7.4.1 và mil7.4.7, và `:N.1` giữ nguyên “Lại nữa, …”.

  TÊN ĐẦU BÀI — ĐÂY LÀ ĐIỂM CẦN NGƯỜI ĐIỀU PHỐN GỘP. `Opammakathāpañha` trong tầng `mil` đang có **6 cách**:
  “Câu hỏi về cách dùng dẫn với ví dụ” 40, “Opammakathāpañha” 8, “Câu Hỏi Về Ví Dụ” 6, “Những Câu Hỏi Về
  Ví Dụ” 4, “Các Câu Hỏi Dùng Thí Dụ” 2, “Những Câu Hỏi Về Các Tỷ Dụ” 1. Trong riêng phẩm `mil7.4.x` thì
  chia đôi: “Câu Hỏi Về Ví Dụ” 2, “Opammakathāpañha” 2, rồi bốn cách một lần — **không có đa số**. Theo BRIEF
  §11.2 thì phải đi theo đa số, nhưng đa số toàn tầng là “Câu hỏi về cách dùng dẫn với ví dụ”, đọc ra là tiếng
  Việt tối nghĩa (“cách dùng dẫn với ví dụ”) và trái mục tiêu dễ hiểu ở §1.3. Mình chọn **“Câu Hỏi Về Ví Dụ”** —
  bằng với đa số trong phẩm, trùng mil7.4.1 và mil7.4.7, và là cách rõ nhất. Đề nghị người điều phốn chốt một
  dạng cho cả phẩm rồi gộp.
  `Pathavīvagga` → “Phẩm Đất” (4/7 trong `mil`; mil7.4.2 và mil7.4.3 để nguyên Pāli, mil7.4.6 dùng “Phẩm Đất
  Đai”). `aṅgapañha` → “Câu Hỏi Về Các Đức Tính Của X” theo mil7.4.1 (`Pathavīaṅgapañha` → “Câu Hỏi Về Các Đức
  Tính Của Đất”). `bhante nāgasena` → “bạch ngài Nāgasena” (chỉ đạo của điều phốn cho `mil`; đếm: “bạch ngài” 30,
  “bạch thầy” 0). `mahārāja` → “này Đại vương” (504 lần toàn 5 tầng). `yoginā yogāvacarena` → “người hành trì
  du-già” theo mil7.4.1/mil7.4.7 (5 lần mỗi bài); phẩm này còn dùng “hành giả thực hành du-già” (mil7.4.2,
  mil7.4.9) và “hành giả tu tập” (mil7.4.3, mil7.4.4, mil7.4.6) — **cả ba đều có tiền lệ**, mình chọn một và giữ
  xuyên suốt. `yoniso manasikāro` → “sự tác ý như lý” (tiền lệ dồn dập trong `mn`, `an`). `bojjhaṅga` → “giác chi”,
  `satipaṭṭhāna` → “tứ niệm xứ”, `sammappadhāna` → “chánh cần” (không phải “chánh kiên tận” — đếm tầng Việt:
  “chánh cần” mới là dạng đã dùng), `iddhipāda` → “nền tảng thần thông”, `samādhi` → “đẳng giác”,
  `indriya` → “căn”, `bala` → “quyền lực”. `therena vaṅgīsena` → “Trưởng lão Vaṅgīsa” (tiền lệ “Tôn giả
  Vaṅgīsa”). `dhammadharo` → “giữ gìn Pháp” (tiền lệ `an`, `snp`, `ud`: “bậc đa văn giữ gìn Pháp”).

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `sakavisaya` không có ở đây, nhưng `raṁsimālī` (4.1) và `ārammaṇamālinā` (4.2) là cặp ẩn dụ: mặt trời có
  tia sáng lan xa, hành giả cũng phải có **phạm vi** lan xa. Bản nháp đầu tiên dịch 4.2 y hệt 4.1 (“phải là bậc
  có tia sáng lan xa”) — lặp nguyên văn nhưng **mất nghĩa** (`ārammaṇa` = đối tượng, không phải tia sáng); đã
  sửa thành “phải có phạm vi lan xa”.
  `duccaritaduggativisamakantāravipākavinipātakilesajālajaṭite…` (6.2) — dãy danh từ dài, gồm `duccarita`
  (hành phạm bất thiện), `duggati` (sinh về khổ), `visama` (khổ đau), `kantāra` (hiểm trở), `vipāka` (quả khổ),
  `vinipāta` (hủy diệt), `kilesajāla` (mạng lưới phiền não), `jaṭita` (giam cầm), `diṭṭhisaṅghāṭa`
  (bị thị lực che lấp), `apatimukka` (không lối thoát). Dịch **đủ cả chín** danh từ, không rút còn vài từ.
  `kupathapakkhande kummaggapaṭipanne` (6.2) — chú giải đọc là “đã vứt bỏ lối tắt mà rơi vào lối cong vòng”
  (`kupatha` = lối tắt, `pakkhanda` = hất bỏ, `kummagga` = đường cong vòng). Cũng có thể đọc `kupatha` là “cành
  khô dùng làm cầu”, nhưng nghĩa hành động là như nhau; ghi ở đây vì không có tầng Anh để đối chiếu.
  `rāhubhayā bhīto` (6.1) — mặt trời đi vì sợ rỉu: đây là nhật thực, `rāhu` là thần thứ bị giam, không dịch
  “mặt trời bị che”. `santāpenta` (5.1) = “làm nóng”, giữ hình ảnh lửa như 4 vòng trước (nắng thiêu).
  `pāṇinaṁ` (8.2) — hạ từ lịch sử chỉ người tục dân, dịch “người tục”; `rūpa` dịch “hình sắc” chứ không
  phải “sắc tướng” (`tướng` là từ kỹ thuật cho `rūpa`/`liṅga` ở nơi khác trong tầng).
  `ādiccovudayaṁ yathā` (9.4) — tiền lệ `an`, `sn`: “như mặt trời mọc xua tan tối tăm”, dịch “như mặt trời
  mọc lên ban đầu”. `avijjāpihitaṁ janaṁ` (9.2) — `avijjāpihita` là bị vô minh che lấp (bị động), nên dịch
  “quần chúng **bị** vô minh che lấp” rồi mới “mở toang ra”, giữ chiều hướng cổ nháy kép.

  DẤU LƯỢC — bài này **không có** `…pe…`, nên không dấu lược nào được phát sinh.

  Ngoặc kép: 1.1 tự cân; 1.2 mở nháy kép bao trọn lời giảng đến 9.4, trong đó kệ 8.1–9.4 đi trong nháy đơn
  ‘…’, và 9.4 đóng cả hai (‘ rồi ”). 10.1 ngoài nháy kép. Tự đếm lại: cân.

