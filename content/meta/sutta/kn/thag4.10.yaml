notes: |-
  Bản dịch tiếng Việt mới cho bài kinh thag4.10.

  Bài kệ của Trưởng lão Dhammika về Chánh pháp che chở người hành trì và quả báo dị biệt giữa Pháp và phi Pháp.

  Đối chiếu Pāli root và bản Anh Sujato tham khảo.

  Sửa lan 2026-10-13: `thag4.10:2.1`–`2.2` (`Na hi dhammo adhammo ca, ubho samavipākino`): *Không phải Pháp và phi Pháp, cả hai đều đưa lại cùng một quả báo* → *Thật vậy, Pháp và phi Pháp, cả hai không có cùng một quả báo*. Bản cũ đảo nghĩa: `na hi` phủ định `samavipākino` ("có cùng quả báo"), như `2.3`–`2.4` (phi Pháp dẫn xuống địa ngục, Chánh pháp đưa đến thiện thú). Cùng Pāli ở `ne37:462.1`–`462.2` và `ja510:24.1`–`24.2` đều là *cả hai không có cùng một quả báo* (2 khoá cùng Pāli ngoài bài, 0 khoá còn dạng cũ). Điểm số giữ nguyên.
