notes: |-
  Dịch từ Pāli root `vv33` (382/382 khoá, tiền tố `vv33:`, thứ tự khoá đúng Pāli, 0 khoá ngoài tập khoá của bài). Bài thuộc `Itthivimāna`, `Pāricchattakavagga`, cung điện thứ năm (`Guttilavimāna`, khoá kết `105.1`). Cấu trúc đo được: (a) khung mở `1.1`–`2.4`, hai khổ kệ đối đáp về một người dạy đàn bị người học thách đấu (xem Bất định); (b) 36 mục cung điện đánh số `1.`–`36.`, trong đó mục 1 được viết đủ (`1.0.1`–`10.4`), mục 2–11 viết theo cùng công thức nhưng lược bằng `…pe…` và chỉ giữ dòng riêng của từng mục (người nữ dâng gì, làm gì), còn mục 12–36 chỉ còn dòng đầu (vật dâng) và `…pe…`; (c) khổ kệ kết `103.1`–`104.6`.

  **Số lượng cung điện, tự tính.** `11.1` `caturavimānaṁ` = 4 cung điện kế tiếp (mục 2–5) theo mẫu mục 1; `46.1` `caturavimānaṁ` = 4 cung điện kế tiếp (mục 7–10) theo mẫu mục 6; `73.1` `pañcavīsativimānaṁ` = 25 cung điện kế tiếp (mục 12–36) theo mẫu mục 11, và 36 − 12 + 1 = 25 khớp. Tổng 1 + 4 + 1 + 4 + 1 + 25 = 36 mục, khớp 36 tiêu đề `x.0` trong bài. Bản Việt viết *Bốn*, *Bốn*, *Hai mươi lăm*. Số khác trong bài: `sahassa` (khoá `Accharāsahassassāhaṁ`, 12 khoá) = 1.000, viết *một ngàn*; `sattatanti` (`1.1`) = satta 7 + tanti dây đàn, viết *đàn bảy dây*; `Ekūposatha` (`49.4`) = *một ngày trai giới*; `pañcamaṁ` (`105.1`) = *thứ năm*, khớp thứ tự trong phẩm (`vv29`–`vv33`). Không có `navuti`, `tālīsa`, `Tiṁsakappasahassa` hay chữ số nguyên nào trong Pāli của bài.

  **Pāli song song.** `1.1`–`1.3`, `2.2`–`2.4` trùng 6 khoá với `ja243:1.1`–`1.3`, `2.2`–`2.4` (`1.4` và `2.1` khác chữ: `kosiyā` thay `kosiya`, `Ahaṁ te saraṇaṁ homi` thay `Ahaṁ taṁ saraṇaṁ samma`). Bản Việt `ja243` hiện `draft` và sai rõ ở chính các khoá này (`Sattatantiṁ sumadhuraṁ` dịch *Thầy đang ngồi yên là thầy dễ thương*, `raṅgamhi` dịch *chỗ đất liền*, `rāmaṇeyyaṁ avācayiṁ` dịch *thầy dùng món ăn ngon ngon lành*), nên KHÔNG dùng làm tiền lệ; báo ngoài lát, đề nghị dịch lại 6 khoá đó. Khung `Abhikkantena…`/`Kena tetādiso…`/`Sā devatā attamanā…`/`Tena metādiso…` là công thức chung của `vv1`–`vv28`, `vv45`, `vv49`…, `pv13`–`pv16`; đã tra để giữ nhất quán thuật ngữ nhưng dịch từ Pāli của `vv33`.

  **Pāli trùng nguyên văn trong tầng (ngoài bài).** 147/382 khoá có Pāli trùng ở bài khác, gồm 37 dòng Pāli khác nhau, tổng 4.496 cặp (một khoá của bài × một khoá của bài khác). Sau khi bỏ khác biệt dấu câu và chữ hoa, 2.656 cặp bản Việt giống bản này và 1.840 cặp khác. Dùng lại đa số tầng ở `3.1`–`3.4` (19/26, 17/18, 17/18, 19/24), `4.1`–`4.4` (25/37, 19/21, 14/21, 36/38), `5.2`, `5.3` (23/23), `5.4` (25/60, dạng nhiều nhất), `6.1` (30/31), `6.3` (17/18), `6.4` (41/57), `9.1` (35/53), `9.2` (14/16), `103.2` (1/2, khớp `snp1.9:28.2`), `104.3` (4/5), `104.6` (1/1). Khác đa số có chủ ý, đo trước khi đổi:
    - `10.1`–`10.3` và `5.1`: tầng dịch người nói ở `10.2`/`10.3` là *ngài* (12/13 và 13/14 khoá, nằm ở `vv1`–`vv4` và `vv6`–`vv15`, riêng `10.1` còn ở `vv54`, `vv85`) và coi `mahānubhāva`/`mahānubhāve` là *về đại oai lực ấy* (14/15 khoá ở `10.1`, 17/19 khoá ở `5.1`). Pāli không cho đọc thế: `Manussabhūtā` là chủ ngữ giống cái (người nữ khi còn làm người), `Tenamhi` có `amhi` là *tôi là* (ngôi thứ nhất), `bhikkhu mahānubhāva` là hô cách giống đực và `devi mahānubhāve` là hô cách giống cái. Bản này dịch người nữ nói về phước của chính mình (*khi còn làm người, tôi đã tạo phước báu nào*; *nhờ điều ấy mà tôi có oai lực*) và dịch hô cách (*này tỳ-kheo có đại oai lực*; *này thiên nữ có đại oai lực*, theo `pv15:31.1`, `pv16:15.1`, 2 tiền lệ). Đề nghị người điều phối xem lại các tệp trên trong tầng; không sửa ở đây.
    - `6.2` `moggallānena pucchitā`: tầng dịch *bị Tôn giả Moggallāna truy hỏi* ở 16/17 khoá; bản này dùng *được Tôn giả Moggallāna hỏi* (1 khoá, `vv12:3.2`) vì `pucchitā` chỉ là phân từ bị động *được hỏi*, không có nghĩa bức vấn, và đứng cạnh `attamanā` (hoan hỷ).
    - `10.4` `vaṇṇo ca me sabbadisā pabhāsatī`: tầng 23/49 khoá viết *sắc tướng tôi chiếu sáng khắp mọi phương*, 5/49 khoá viết đúng dạng bản này (*dung sắc tôi chiếu sáng khắp muôn phương*). Chọn *dung sắc* để khớp `9.1` (`vaṇṇo` cùng nghĩa trong một bài, tầng 35/53) và *muôn phương* để khớp phía câu hỏi `5.4` (dạng nhiều nhất, 25/60); cùng lý do ghi ở `vv34`/`vv83`.
    - `9.3` `Uppajjanti ca me bhogā`: tầng 8/16 khoá viết *hiện khưởi* (lỗi chính tả), 7/16 viết *hiện khởi*; bản này *hiện khởi*.
    - `70.2` `Bhikkhuno piṇḍāya carantassa`: tầng chỉ có 4 khoá (đều `vv45`, bản `draft`) dịch *lên vị tỳ-kheo*; bản này *cho vị tỳ-kheo đang đi khất thực*.
  Pāli trùng nguyên văn TRONG CHÍNH bài: 19 nhóm (256 khoá, 237 cặp so với khoá đầu nhóm); bản Việt giống hệt cả 237 cặp (0 lệch), kể cả các khổ lặp ở `7.1`–`8.4` với `16.2`–`17.4`, `23.2`–`24.4`, `30.2`–`31.4`, `37.2`–`38.4`, `44.1`–`44.4`, `50.1`–`50.4`, `55.1`–`55.4`, `60.1`–`60.4`, `65.1`–`65.4`, `71.1`–`71.4`, `101.1`–`101.4`.

  **Thuật ngữ, kèm số đếm.**
    - Tiêu đề: `0.1` giữ Pāli (82/84 khoá); `0.2` *Chuyện Cung Điện Nữ Hư Không* (47/49); `0.3` *Phẩm Cây San Hô* (9/9); `0.4` *Chuyện Cung Điện Guttila*, không có số thứ tự vì Pāli `0.4` của bài này không có số (khác `vv34:0.4` có `6.`); `105.1` *Cung Điện Guttila, thứ năm.* theo mẫu `vv34:27.1`. Tiêu đề 36 mục giữ số thứ tự Pāli. Mục 13 Pāli là `…dāyikāvatthu` (không có `vimāna`) nên Việt là *Chuyện Nữ Dâng Khúc Mía*, không có *Cung Điện*.
    - `dāyikā` → *Nữ Dâng …* theo `vv27:0.4` (*Nữ Thí Vật Thực*) và `vv30:0.4` (*Người Dâng Khúc Mía*). `uttama` ở mục 1–5 → *thượng hạng* (không có tiền lệ: 0 tiêu đề `…uttamadāyikā` trong tầng); `vattha` → *vải*; `rasa` ở mục 5 → *vị*.
    - `devatā` → *nữ thiên* (30/31 khoá `Sā devatā attamanā`); `devate`/`devi` → *này thiên nữ* (17/18 khoá cùng dòng Pāli).
    - `accharā kāmavaṇṇinī` → *tiên nữ mang nhan sắc khả ái* (4/4 khoá: `ja523:11.2`, `ja523:27.2`, `thi-ap29:9.4`, `vv16:3.3`).
    - `bhikkhuniyo` → *tỳ-kheo-ni* (30 khoá `vv`/`pv`/`thi-ap`, 0 dạng khác). `Kassapassa bhagavato` → *Đức Phật Kassapa* (15/19 khoá; *Đức Thế Tôn Kassapa* 4/19). `Uposatha` + `upavasi-` → *giữ ngày trai giới* (`vv24:7.1`); `Ekūposatha` → *một ngày trai giới*, còn tên phẩm `Ekūposathika` ở `thi-ap` giữ Pāli (14/14), đó là danh từ riêng chứ không phải cụm động từ như ở đây. `vippasannena cetasā` → *tâm hoàn toàn tịnh tín* (`pv10:10.4`).
    - Vật dâng: `phāṇita` → *mật mía* (7/12 khoá `phāṇita` ở dn26, mn46; *đường phèn* 3/12, ở sn7.13); `ucchukhaṇḍika` → *khúc mía* (`tha-ap437`, 4/4 khoá không phải tên người); `khīrodana` → *cơm sữa* (`tha-ap536`, 2/2); `valliphala` → *trái dây leo* (`tha-ap388`, 3 khoá); `phārusaka` → *trái phārusaka* (`tha-ap284`, `tha-ap407` viết *quả*, 2/2), chọn *trái* vì ở `vv`/`pv`/`tha-ap` cụm *dâng cúng trái* 72 khoá so với *dâng cúng quả* 6 khoá; `timbarusaka` giữ Pāli (1 tiền lệ `tha-ap23:24.1`, *quả timbarūsaka*); `nimba` → *sầu đâu* (2/2, `ja311:3.5`, `tha-ap412:10.2`); `doṇinimmajjani` → *dụng cụ cọ rửa máng* (`pv10:10.2`, 1/1); `kāyabandhana` → *dây lưng* (3/3: `sn19.17`, `sn19.21`, `bv29:14.2`); `vidhūpana` → *quạt* (2 tiền lệ, `cnd10:38.2`, `mil5.1.1`); `tālavaṇṭa` → *quạt lá thốt nốt* (6 khoá, `tha-ap219`, `mil5.1.1`; hoà với 6 khoá viết *quạt thốt nốt* hoặc *quạt bằng lá thốt nốt* ở `tha-ap380`, `tha-ap467`; còn 3 khoá là tên riêng); `chatta` → *cây lọng* và `upāhana` → *đôi dép* (`cp2:8.4`); `pūva` → *chiếc bánh* (`vv29`); `gandhapañcaṅgulika` → *dấu năm ngón tay thơm* (`tha-ap1:40.3`, 1 tiền lệ).
    - `anusūyikā` → *không oán hận* (họ `anusūy-` có 7 khoá trong tầng: *ganh tị* 3, *ganh ghét* 1, *oán hận* 1 ở `ja308:4.3`, 2 khoá dịch khác hoặc bỏ); chọn theo ngữ cảnh (hầu hạ cha mẹ chồng hung dữ). `Appamattā` → *không phóng dật*. `Dānena samacariyāya` → *bằng bố thí, bằng hạnh sống ngay thẳng* (4/5, `pv39`, `vv52`; `ja494:13.3` viết *hạnh lành*); `saññamena damena` → *bằng tự chế, bằng điều phục* (4/4 cho dạng `saṁyamena damena`). `Sugatiṁ upapajja` → *tái sinh vào cõi lành* (`tha-ap311:2.4`). `Yattha gantvā na socare` → *nơi mà khi đến rồi không còn sầu muộn* (`vv51:4.4`, 1/1). `Svāgataṁ vata me ajja` → *Thật là một lần đến tốt lành cho tôi hôm nay*, `suppabhātaṁ suhuṭṭhitaṁ` → *Buổi sáng tốt lành, sự thức dậy tốt lành* (`snp1.9:28.1`–`28.2`).

  **Bất định (đều ghi ở đây, KHÔNG thêm vào thân kinh).**
    - Người nói ở `1.1`–`2.4` và `103.1`–`104.6`: Pāli của bài không nêu. Tiêu đề `0.4` và bản song song `ja243` mang tên Guttila nhưng không nói ai nói. Nháy đơn ở `1.4` cho thấy lời *Kosiya* là lời được trích bên trong lời của người nói nháy kép; `2.4` gọi người nghe là `ācariya`. Bản Việt giữ nguyên cấu trúc nháy như Pāli và không gán người nói; người biên tập nên đối chiếu chú giải.
    - `1.2` `avācayiṁ` dịch *tôi đã dạy* (`vāceti`, nhân cách của `vācati`, *khiến đọc/học*); khả dĩ khác là *tôi đã gảy/trình tấu*. `1.3` `avheti` dịch *thách* (nghĩa *gọi ra, thách đấu* trong ngữ cảnh `raṅga`, sân diễn/đấu trường); khả dĩ thuần *gọi*. Cả hai chọn đều dựa vào văn cảnh `1.4`/`2.3`–`2.4` (học trò và thầy), không dựa vào bản Việt `ja243`.
    - `7.3` (và `16.3`, `23.3`, `30.3`, `37.3`, `43.3`, `54.3`) `Evaṁ piyarūpadāyikā manāpaṁ`: `manāpaṁ` có thể bổ nghĩa cho vật dâng (*đáng yêu, vừa ý*, như bản này) hoặc cho `ṭhānaṁ` ở dòng sau (*chốn cõi trời vừa ý*). Giữ ở khoá `7.3` để khớp ranh giới khoá Pāli; nghĩa không đổi đáng kể.
    - `8.1` `tassā me`: dịch *của tôi, người nữ ấy*; `tassā` quy về `nārī` ở dòng `7.1` (ngôi thứ ba rồi trở về ngôi thứ nhất).
    - Tiêu đề `62.0` `Aparakammakārinī` dịch *Nữ Làm Thuê Khác*: `apara-` hiểu là *khác/kế tiếp* vì lời kể `64.1` là `Parakammakarī āsiṁ`; không xác lập được cách đọc khác.
    - `83.1` `Hatthappatāpaka` dịch *vật sưởi ấm tay* sát cấu tạo (hattha + patāpaka), 0 tiền lệ trong tầng; có thể là một vật dụng cụ thể mà bản này không khẳng định. `95.1` `Morahattha` dịch *quạt lông công*; `tha-ap454` (4 khoá) viết *bàn chân công* cho cùng từ, bản này không theo vì `hattha` nghĩa là *tay/bó*, không phải *chân* (báo ngoài lát, không sửa).
    - `88.1` `Ambakañjika`, `92.1` `Āyogapaṭṭa`, `91.1` `Aṁsabaddhaka`, `78.1`–`80.1` `Timbarusaka`/`Kakkārika`/`Eḷāluka`, `99.1` `Modaka`, `100.1` `Sakkhalika`: 0 tiền lệ trong tầng (không tìm thấy dòng nào có `āyogapaṭṭa`, `aṁsabaddhaka`, `kakkārik`, `eḷāluk`, `sakkhalik`). Dịch bằng tên Pāli kèm loại vật (*dải đai*, *món*, *bánh*, *trái*) hoặc nghĩa sát cấu tạo (*dây đeo vai* cho aṁsa + baddhaka). Loại vật chưa được từ điển hay chú giải trong lát xác lập, nên người biên tập nên đối chiếu thêm. `87.1` `Nimbamuṭṭhi` dịch *một nắm sầu đâu*; Pāli không nói là lá hay quả.
    - `59.2` `Caṇḍike kodhane ca pharuse ca`: hiểu là ba tính từ chung cho cả mẹ chồng và cha chồng (đối cách số nhiều giống đực); nếu chỉ một người thì nghĩa đổi, nhưng ngữ pháp không cho đọc khác.

  **Dấu lược và nháy.** `…pe…` ở đúng 68 khoá, bản Việt đúng một `…` ở cả 68; Pāli có `…` trần 0 khoá và `(…)` trần 0 khoá (đã quét 382 khoá), bản Việt cũng 0 (lời dặn giữ `(…)` nếu Pāli có không áp dụng ở bài này). Không khoá nào Pāli kết `….`. Nháy kép Pāli mở 51, đóng 27; bản Việt cũng mở 51, đóng 27, khớp Pāli từng khoá, 0 lệch trên 382 khoá. Nháy đơn Pāli 1 mở và 1 đóng (cả hai ở `1.4`), bản Việt 1 và 1 ở cùng khoá. 25 lời nháy kép mở ở `76.1`–`100.1` (mỗi mục một lần) chạy qua ranh giới khoá như Pāli, chỉ đóng ở `102.3`.

