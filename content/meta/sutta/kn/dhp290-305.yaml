notes: |-
  Lô G2 2026-10-15 (Claude Sonnet 5.5, Claude Code): kiểm lại lỗi lặp bằng Pāli đã ghim và sửa:
  dhp304:3 `asantettha na dissanti` đổi “ở ngay đây cũng không thấy” thành “ở đây thì không được thấy”
  (dissanti là bị động; bỏ “ngay” và “cũng” là chữ Pāli không có). Điểm chỉ nâng grammar_logic mỗi
  tiêu chí 0,1 vì lỗi nghĩa thật; technical_integrity giữ nguyên.
