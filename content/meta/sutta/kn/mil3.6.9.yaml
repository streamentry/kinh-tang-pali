  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli so git-hash với manifest (khớp). Đo bằng npm run store: 4 segment Pāli có nội dung, English coverage 0%, sàn 0,8 không đạt, reference-gaps.yaml chưa ghi nhận → draft.
  Khung đối đáp giữ nguyên một cách dịch với mil3.4.9, mil3.5.4, mil3.5.6, mil3.6.6, mil3.7.13: Vua nói— (Pāli mang gạch dài nên giữ gạch dài, khớp mil3.5.6 và mil3.6.6), thưa tôn giả Nāgasena, này Đại vương, và câu chốt Khéo lắm, thưa tôn giả Nāgasenā. Câu chốt đó nằm trong TIEN_LE_PHAI.md với nguyên văn bắt buộc, lấy từ mil3.5.6:2.1 và mil3.6.6:2.1. Colophon có dấu phẩy trước số thứ tự như cả 5 bài Milinda đã có.
  Sativagga → Phẩm Chánh Niệm, lấy nguyên văn từ mil3.6.6 (cùng phẩm, đã có).
  Thuật ngữ: saṁsāra là luân hồi (125 tiền lệ), không dùng samsara. Ba nơi trong chuỗi được giữ đủ: idha (ở đây), aññatra (nơi khác), tahiṁ (ở kia), và idheva / tahiṁyeva là ngay tại đó. 1.6 lặp lại nguyên văn danh sách của 1.3 nên dịch y hệt, không diễn giải khác đi.
  Ví dụ cây xoài: pakkaṁ ambaṁ là quả xoài chín (xoài có 96 tiền lệ, quả xoài 8); aṭṭhiṁ ropeyya là gieo hạt — Pāli aṭṭhi là hạt/đá, tôi dùng hạt vì đó là cách gọi tự nhiên trong tiếng Việt và không thêm nghĩa; nibbattitvā phalāni dadeyya là lớn lên rồi ra quả; evametesaṁ rukkhānaṁ koṭi na paññāyati là số những cây như vậy không thể tính được. 1.5 và 1.6 lặp lặp cùng một công thức (tha ổi, gieo hạt, cây lớn, ra quả) hai lần trong Pāli nên giữ nguyên hai lần.
  Opammaṁ karohī: 0 tiền lệ, đặt mới Hãy nêu một ví dụ, dùng cùng cách với mil3.3.9 vì Pāli trùng nguyên văn. Không có bản Việt hiện hành ở commit đã ghim; không có Anh Sujato đã ghim và tôi không đọc english-project nên không tuyên bố đã đối chiếu English.
