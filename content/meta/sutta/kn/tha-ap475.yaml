notes: |-
  Dịch trực tiếp từ Pāli root, 66/66 khoá; không có tầng tham khảo nào để đối chiếu (đo và chứng cứ ở `blocking_errors`).
  `translationTitle` đặt BẰNG ĐÚNG khoá `:0.3`. Pāli `:0.3` là `Ukkāsatikattheraapadāna`, không bắt đầu bằng chữ số, nên không có số thứ tự (quy tắc: giữ số khi và chỉ khi Pāli bắt đầu bằng số). Hình thức `Bài Kệ Tuyên Ngợ Về Trưởng Lão X` theo phạm vi gần nhất: các bài tha-ap470-490 là 10 trên 11 tệp (tệp còn lại giữ `:0.3` nguyên Pāli), ±10 bài quanh uid 13/15, ±25 bài 28/37; toàn tầng 234 `Tuyên Ngợ` · 97 `Tuyên Ngôn` · 96 `Ký Sự` (đo 449 tệp). Tôi đi theo `Tuyên Ngợ` vì phạm vi gần nhất áp đảo; nếu người biên tập chốt `Tuyên Ngôn` cho cả cuốn thì sửa một lượt, không sửa riêng bài này. Cả `:0.3` lẫn `:18.1` dùng cùng hình thức. Tên Trưởng lão giữ Pāli là `Ukkāsatika` (dạng danh cách `ukkāsatiko` ở `:17.1`), cùng cách giữ tên của tha-ap473, 476-480.
  Pāli trùng nguyên văn trong tầng `tha-ap` ở 22/66 khoá. Dùng lại nguyên văn bản dịch đã có ở 15 khoá: `Therāpadāna` (433×) · `Naḷamālivagga` → `Phẩm Vòng Hoa Sậy` (7/7) · `Tena kammena dvipadinda,` (7/10) · `lokajeṭṭha narāsabha;` (8/9) · `jambumaṇḍassa issaro.` (1/1) · `Catunnavutito kappe,` → `Vào chín mươi tư kiếp trước đây,` (50/106) · `Kilesā jhāpitā mayhaṁ,` (80/116) · `viharāmi anāsavo.` (81/116) · `Svāgataṁ vata me āsi,` (74/112) · `kataṁ buddhassa sāsanaṁ.` (87/113) · `Paṭisambhidā catasso,` (431/444) · `kataṁ buddhassa sāsanaṁ”.` (404/443) · ba khoá `…pe…` → `…` (582/588). Cố ý khác tiền lệ ở 7 khoá, có lý do: `:13.3` chọn `Ta không còn biết đến đọa xứ,` (phạm vi Phẩm Vòng Hoa Sậy 7/11; tha-ap440-510 là 23/56) thay vì `Ta không biết mình rơi vào khổ đau,` (134/382 toàn tầng) vì `duggati` là đọa xứ chứ không phải khổ đau, và khớp 476-480; `:5.4` dùng `đây là` (phạm vi tha-ap440-510 là 37 `đây là` / 20 `đó là`; Phẩm này 9/2; toàn tầng ngược lại, 239 `đó là` / 170 `đây là`) nên khác tha-ap77:2.4 vốn ghi `đó là`, nhưng giữ `một phần cơm khất thực`; `:7.2` đổi `tôi từng` (6/7) thành `ta từng` cho khớp ngôi `ta` của cả bài; `:1.2`, `:4.2`, `:6.3`, `:7.3` Pāli trùng với từ 2 đến 4 khoá mà các khoá đó tự khác nhau, tôi chọn cách khớp Pāli sát nhất (`tadā` → `khi ấy`; `Cāturanto vijitāvī` → `làm chủ bốn phương, … chiến thắng` theo dn14/dn16/dn17/dn30, thay cho `Đủ bốn món báu` vốn thêm ý không có trong Pāli).
  Ngôi thứ nhất chọn `ta` cho toàn bài, theo các bài cùng phẩm (tha-ap473, 476-480) và khối kết `ta sống không còn lậu hoặc`; `:17.1` dùng nhóm `…đã nói những bài kệ này` (số nhiều, khớp `imā gāthāyo`; nhóm này 407 khoá, nhóm số ít 21 khoá), không dùng nhóm `…đã từng nói bài kệ này`.
  Thuật ngữ và số: `Cittakūṭa`, `Himavanta`, `Jambumaṇḍa`, `Sobhana`, `Kosiya`, `Vissakamma` giữ Pāli (theo dn17, `Vissakamma` là thiên tử kiến trúc). `dasahi saddehi avivittā` → `không vắng mười loại âm thanh` theo dn16, dn17. `tālapantī` → `hàng cây cọ` theo dn17. `sammatāḷa` → `chũm chọe` (dn16; vv35 dùng `chập chõa`). `padumuppala` → `sen đỏ và sen xanh` (tha-ap162), `puṇḍarīka` → `sen trắng`. `yojana` → `do-tuần` (tha-ap501). Số: `pañcapaññāsa` 5+50=55; `catunnavuti` 4+90=94 (tầng viết `chín mươi tư`); `tiṁsa…vīsati` 30 và 20; `dasasahassa` 10×1000=10.000 (viết `mười ngàn`; ở tầng tha-ap các cụm mười/hai mươi/ba mươi + số nghìn dùng `ngàn` 9 lần, `nghìn` 2 lần); `sattarattindivaṁ` 7 đêm ngày, `aṭṭhamena` thứ tám; `yojanasataṁ` 100; `catupākāra` 4 bức tường với `tayo` 3 bằng ngọc; `ukkāsate` một trăm ngọn đuốc. Cụm `Tiṁsakappasahassa` không xuất hiện ở bài này.
  Bất định, ghi ở đây chứ không giải thích trong thân kinh: (1) `:3.4` `agacchahaṁ` đọc là `đã đến` (đến chỗ Đức Phật, vì `:4.1-4.4` ta đảnh lễ và dâng thực ngay sau đó), không đọc là `ra đi`; `aṭṭhamena` đọc là `ngày thứ tám`. (2) `:4.1` `Vuṭṭhitaṁ` đọc là `đã xuất khỏi thiền định` vì `:1.3` mô tả Ngài là bậc ưa thiền định, nhưng Pāli chỉ nói `vuṭṭhita`, không nêu `samādhi`. (3) `:5.3` `tusite kāye` đọc là `hàng chư thiên cõi Đâu-suất`; tầng chưa có tiền lệ cho `kāye` ở chỗ này. (4) `:11.1-11.3` `Vemajjhe tālapantī` có thể là hàng cây cọ ở giữa hoặc là lớp tường thứ tư bằng hàng cọ; tôi dịch sát nghĩa chữ, không thêm quan hệ. (5) `:9.4` `sammatāḷasamāhitaṁ` có thể là `chũm chọe và vỗ tay`; chưa phân xử được. (6) `:10.2` `vallikaṭṭha` đọc là hai vật liệu `dây leo` và `gỗ`. (7) `:12.4` `samīritā` dịch `tỏa lan`; Pāli chỉ nói chuyển động, không nêu gió. (8) `:8.4` `vīsati` không có đơn vị trong Pāli, nên viết `rộng hai mươi`, không thêm `do-tuần`. (9) `:1.2` `cittakūṭe` tôi dịch `đỉnh núi Cittakūṭa` theo tha-ap479 vì `kūṭa` là đỉnh. Ngoài lát, ghi nhận để người biên tập xem: tha-ap482:11.2 dịch `ukkāsatikabījanī` thành `Ukkāsati, Kabījanī;` (tách sai tên ghép, vì Pāli nối hai Trưởng lão Ukkāsatika và Bījaniya); tha-ap116:3.2 dịch `sammatāḷasamāhito` thành `Đấng Toàn Giác đang đi kinh;` (không khớp Pāli).
  Dấu lược: 3 khoá `…pe…` (`:14.2`, `:15.2`, `:16.2`) → đúng một `…` mỗi khoá, khớp Pāli 3/3; Pāli không có `…` trần và không có `(…)`. Ngoặc kép mở ở `:1.1`, đóng ở `:16.3`, khớp Pāli từng khoá (2 khoá có dấu ngoặc, 0 lệch trên 66 khoá). Pāli trùng nguyên văn trong chính bài chỉ có 3 khoá `…pe…`, cả ba cùng cho `…`; không có cặp nào khác nên phép dò cặp trùng nội bộ gần như rỗng. Đã đọc đối chiếu từng cặp Pāli với Việt cả 66 khoá.
  Cổng kỹ thuật CHƯA chạy vì không được phép chạy lệnh npm. Chỉ xác minh được: JSON hợp lệ, `set(khoá Việt) == set(khoá Pāli)` (66/66, đúng thứ tự), NFC, không khoá rỗng, dấu câu cuối khớp Pāli 66/66, không Pāli lọt sang bản Việt ngoài tên riêng, YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
