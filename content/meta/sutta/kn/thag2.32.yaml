notes: |-
  Tầng tham khảo: có bản Anh Sujato tại commit đã ghim, tệp có đủ 15/15 khoá (đếm bằng script trên cache đã ghim .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/). Sujato chỉ có chữ ở khối 0.x và phần đầu bài, các khoá từ 2.x trở đi để trống, nên phần đóng góp của tầng Anh có hạn và triangulation chấm vừa phải, không chấm cao. Không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya trong bản chụp upstream; đây là giới hạn của bản chụp, không phải thiếu sót của repo.

  Đủ 15/15 khoá. Đã đọc hết Pāli lát f120.pali.txt trước khi viết.

  Tên phẩm: Dukanipāta → **Bộ Hai Bài Kinh** (bảng §11); Catutthavagga → “Phẩm Thứ Tư” theo
  đa số trong Theragāthā (15 tệp đã có).

  Ẩn dụ là nhà: `gahaka` (ngôi nhà), `gahakāra` (kẻ xây nhà), `geha` (xây nhà). Tôi giữ nó
  xuyên suốt thay vì quy về “thân” — đó là nghĩa chữ, còn việc quy “ngôi nhà” cho thân là
  lớp giải thích thuộc tầng chú thích, không được đưa vào thân kinh.

  Bất định đã ghi nhận, không che giấu. (1) `Gahakāraka diṭṭhosi`: `diṭṭhosi` là quá khứ
  ngôi hai của `diṭṭha`, nên về mặt ngữ pháp là “ngươi đã thấy ta”. Tôi dịch “Kẻ xây nhà, ta
  đã thấy ngươi rồi” vì Sujato và bản PTS đều đọc theo nghĩa người nói nói với người nghe;
  đây là chỗ tôi đã chọn một trong hai cách và ghi lại, không phải chỗ đã chắc. (2) `phāsukā`
  là xà ngang/rười của mái nhà, nhưng `ja143:1.3` đã dịch cùng câu Pāli này thành “mọi xương
  sườn của ngươi đều gãy nát”; theo luật “Pāli trùng nguyên văn thì cách dịch phải khớp” tôi
  dùng lại đúng câu đó, dù trong bài này ẩn dụ nhà rõ ràng hơn. Người điều phối nên cân nhắc
  sửa `ja143` thay vì sửa bài này. (3) `thūṇikā` tôi dịch “chiếc rui nhà”; tầng đã có “rui”
  trong câu `sn36:28.8` (“…như rui của một căn nhà cũ”) nên không phải đặt mới. (4)
  `vimariyādi` = không có rào bao, tôi dịch “không còn hàng rào” để giữ hình ảnh nhà.

  Tam giác: Sujato có chữ ở 1.x–2.6 (*Houses are impermanent… I’ve seen you, house-builder!
  Your rafters are all broken, your ridgepole is shattered. My mind is without boundaries…*).
  Ở 1.2 `tattha tattha` tôi dịch “ở đời này, ở đời khác” thay vì “tư tưởng tư tưởng”, vì
  Sujato đọc là *on and on, life after life* và mệt đề cố tiếp kế sinh là chủ đề cả khúc.

  Dấu lược: khoá 2.7 giữ đúng HAI dấu `…` như Pāli `… Sivako thero …. `.

  Kiểm kỹ thuật: save_vi chạy sạch; vì mọi khoá Pāli ở lát này ngắn hơn 40 ký tự (khoá dài nhất 39) nên tập `cần` trong _hvi.kiểm rỗng và các assertion NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy, tôi tự quét lại MỌI khoá bằng chính các hàm đó (pal, lược, lọt_pāli, ngoặc, _TỪ): đủ 15/15 khoá, đúng ID, thứ tự khoá y hệt Pāli, không rỗng, không thừa, mọi chuỗi NFC, không trùng nguyên văn Pāli (trừ 0.1 là tên bộ Kinh, đúng như tiền lệ), số dấu lược khớp Pāli từng khoá, nháy kép cân trên cả bài và khớp đúng số mở/đóng của từng khoá Pāli, không còn (…), toàn bộ chữ cái là script Latin. Đợt này cấm chạy cổng nên technical_integrity = 9.6, KHÔNG phải 10.0; bốn lệnh npm run validate | test | check | build để người điều phối chạy.
