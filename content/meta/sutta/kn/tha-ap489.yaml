notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này (đo và bằng chứng ở `blocking_errors`). Bài thuộc Paṁsukūlavagga (Phẩm Y Phấn Tảo), kể truyện đạo sĩ Devala ở núi Himavanta cùng tám mươi bốn ngàn học trò, tháp cát và lời thuật về các đặc tướng của chư Phật. Bài chỉ được đối chiếu với tiền lệ nội bộ của tầng Việt và với một bản Việt toàn văn không phân đoạn ở mục Tra cứu toàn văn (Bhikkhu Indacanda); bản đó chỉ dùng để kiểm cách hiểu ở vài chỗ khó, không căn lề theo khoá và không được sao chép, nên `triangulation` chỉ 7,8, dưới ngưỡng 8,0.
  `translationTitle` đặt BẰNG ĐÚNG khoá `:0.3`. Pāli `:0.3` là `7 Pulinuppādakattheraapadāna`, bắt đầu bằng chữ số nên giữ số thứ tự dạng `7. `; khoá cuối `:39.1` lặp đúng phần tên kèm `, thứ bảy` (sattamaṁ). Hình thức `N. ` có ở 128 tệp tha-ap, hình thức `N ` không dấu chấm ở 18 tệp (đo cây chính, 146 tệp có số).
  Dạng tên bài, đo ở nhiều phạm vi và PHÂN KỲ, cần người biên tập phán một lượt cho cả cuốn. Cây làm việc, toàn tầng tha-ap (532 tệp): Bài Kệ Tuyên Ngợ 245, Bài Kệ Tuyên Ngôn 137, Ký Sự 133, Bài Kệ Tuyên Ngợi 10, Kinh Kệ Của Trưởng Lão 5. Nhóm 440–539: Tuyên Ngợ 59, Ký Sự 29, Tuyên Ngôn 2, Tuyên Ngợi 1. Chín bài đã dịch của chính phẩm Paṁsukūla (tha-ap483–492): cả 9 là Tuyên Ngợ. Cây chính, toàn tầng: Tuyên Ngợ 241, Tuyên Ngôn 132, Ký Sự 111. Tôi chọn Tuyên Ngôn (chính tả đúng; Tuyên Ngợ không có nghĩa và có vẻ là lỗi đánh máy lan ra), tức đi ngược đa số phạm vi gần nhất. Nếu người biên tập chọn dạng khác cho cả cuốn thì đây là tệp cần sửa cùng với đợt sửa hàng loạt (đúng hai khoá: `:0.3` và `:39.1`, cộng `translationTitle`).
  Tiền lệ đếm được: 40 khoá Pāli của bài trùng nguyên văn với khoá đã dịch ở tầng tha-ap (không tính chính bài); dùng lại nguyên văn bản Việt ở 35/40. Năm khoá cố ý khác: (1) `:24.1`, `:33.1`, `:34.2` chỉ đổi ngôi tôi thành ta (người kể dùng ta xuyên suốt; đo nhóm 440–539: công thức Kilesā, ta 62 so với tôi 18; công thức viharāmi anāsavo, ta 64 so với tôi 18); (2) `:34.4` dùng đây là quả báo (đây 218 và đó 279 toàn tầng, nhưng nhóm 440–539 đây 57 so với đó 38; Pāli là idaṁ nên theo đây; `:31.4` cùng công thức nên cũng đây); (3) `:30.1` xem dưới, đó là chỗ tiền lệ sai.
  Công thức duggatiṁ nābhijānāmi (`:31.3`, `:34.3`): toàn tầng Ta không biết mình rơi vào khổ đau 137, Tôi không còn biết đến đọa xứ nào 92, Ta không còn biết đến đọa xứ 58; nhóm 440–539: Ta không còn biết đến đọa xứ 37, rơi vào khổ đau 23; riêng chín bài của phẩm này thì khổ đau 3 so với đọa xứ 2. Hai phạm vi cho đa số khác nhau. Tôi chọn Ta không còn biết đến đọa xứ vì duggati là cõi xấu (đọa xứ, 278 khoá trong kn dùng thuật ngữ này), còn cách dịch rơi vào khổ đau làm mất nghĩa nơi đến, và vì bài liền kề tha-ap488 dùng đúng dạng này.
  Pāli trùng trong chính bài: 5 nhóm, 11 cặp (`:5.3`=`:20.3`=`:25.1`; `:11.4`=`:13.4`=`:15.4`; `:31.3`=`:34.3`; `:33.4`=`:35.3`; `:35.2`=`:36.2`=`:37.2`), cả 5 nhóm Việt giống nhau; 0 cặp trùng mà Việt khác. Hai khoá gần trùng `:36.3` và `:37.3` chỉ khác ở dấu đóng ngoặc kép, đã giữ.
  Số Pāli, tự tính: Cullāsīti (`:3.1`) = 84, viết tám mươi tư ngàn (tiền lệ 3 khoá, một khoá khác viết tám mươi sáu nghìn là sai); bāttiṁsa = 32 (`:9.1`); cattālīsa = 40 (`:9.2`, bốn mươi chiếc răng; dija là loài sinh hai lần, ở đây chỉ răng); chappakāra = sáu cách (`:14.3`); dasasahassi = mười ngàn thế giới (`:19.4`, tiền lệ 2 khoá); aṭṭhārasa = 18 (`:29.3`, mười tám kiếp); Satānaṁ pañcakkhattuṁ (`:30.1`) = năm lần trăm = 500, viết năm trăm lần; Anekasatakkhattuṁ (`:30.3`) = nhiều trăm lần, viết hàng trăm lần theo tiền lệ; satasahassa = 100.000 (`:34.1`, một trăm ngàn đại kiếp, 26 khoá cùng dạng); paṭisambhidā catasso = bốn. Không có `tiṁsa` trong bài, nên cụm Tiṁsakappasahassa không phát sinh.
  Lỗi tiền lệ nằm ngoài lát, báo chứ không sửa: `Satānaṁ pañcakkhattuñca` ở tha-ap344:7.3, tha-ap345:3.3, tha-ap375:7.3 dịch Cũng cả năm món báu quý giá và ở tha-ap459:6.3 dịch Cũng cả trăm món báu cùng năm món quý; `Satānaṁ tīṇikkhattuñca` ở tha-ap344:7.1, tha-ap345:3.1, tha-ap375:7.1 dịch Cả bảy món báu quý giá. Pāli là số lần (năm lần trăm; ba lần trăm), không nói đến báu vật, và ba lần cũng không thành bảy. Bài này theo nghĩa số lần, khớp bản Việt toàn văn ở mục Tra cứu toàn văn (năm trăm lần). Tôi không dùng lại các khoá đó.
  Ngôi: người kể là đạo sĩ Devala nên dùng ta, khớp tha-ap488 và đa số công thức kết. Học trò xưng chúng con và gọi ngài ở `:6.1–6.4`; lời đạo sĩ với học trò ở `:27.3–28.4` dùng ta và các con. Công thức kết `:38.1` dùng Tôi nghe như vầy… những bài kệ này (nhóm 407 khoá trong tầng), không dùng nhóm số ít.
  Thuật ngữ đã đo: amanussa dịch loài không phải người (8 khoá kn) so với phi nhân (3); caṅkama dịch đường kinh hành (7) vì Pāli nói caṅkamo āsi, amanussehi māpito, một lối đi do phi nhân tạo; sissa dịch học trò ở các khoá của bài này, nhất quán, dù tiền lệ lẫn đệ tử và môn đồ; kiết già (37 khoá) cho pallaṅka; giàn hỏa (28) cho citaka; Đâu-suất (26); Đại Mâu-ni cho mahāmuni; Đại Long cho mahānāga (6 khoá, trong đó 1 khoá là Đại Long Tượng); Chuyển Luân Vương (185 khoá); chúng sinh (283 so với chúng sanh 28) cho pāṇa; samāgantvā tụ họp lại (cùng dạng ở `:5.3`, `:20.3`, `:25.1`).
  Bất định, ghi ở đây chứ không giải thích trong thân kinh: (1) `:15.1` ete: ai thấy địa ngục. Tôi hiểu ete là chính các vị Phật ở `:14.1`, nhưng ete cũng có thể chỉ chúng sinh trong địa ngục; dịch Những vị này thấy địa ngục theo cách hiểu thứ nhất và cũng là cách của bản toàn văn tham khảo. (2) `:21.3` saḷati là hapax trong toàn bộ Pāli root đã ghim (tìm không thấy dạng nào khác); dịch chuyển động như cá sấu, sát chữ gốc sal là di chuyển, không chọn nghĩa mạnh hơn. (3) `:9.4` jiñjukā phalasannibhā: giữ tên jiñjuka (thường được hiểu là cây hoặc quả Abrus precatorius), không dịch tên cây và không thêm màu sắc; cú pháp có thể hiểu mắt giống quả jiñjuka, cũng có thể hiểu jiñjukā là một danh từ riêng đi với phalasannibhā. (4) `:9.3` gopakhumā: dịch hàng mi như mi bò; chưa phân xử được bò hay bê. (5) `:6.2` deva là hô cách tôn xưng đạo sĩ (thưa bậc tôn quý); cũng có thể hiểu deva là vị thần được lễ, như bản toàn văn tham khảo, nhưng Pāli yaṁ… namassasi chỉ thūpo, và Devala là tên của chính đạo sĩ ở `:1.2`. (6) `:7.1` nu: dịch hẳn là, không đọc như câu hỏi, vì `:7.3` te kho ahaṁ namassāmi khẳng định. (7) `:31.2` vokiṇṇo: hapax đối với dạng này; hai tiền lệ vokiṇṇaṁ dịch tôi luân hồi có thể đếm, không có căn cứ trong Pāli, nên không dùng; dịch xen lẫn, không nêu các cõi. (8) `:31.4` uppādassa: tân ngữ bị lược; tên vị trưởng lão là Pulinuppādaka (người tạo ra cát), nên dịch sự tạo dựng, không thêm tháp cát vào thân kinh. (9) `:32.1` komudike māse: giữ nguyên tên tháng; không giải thích là tháng Kattika. (10) `:16.3` vaṇṇato: dung mạo, theo câu hỏi ở `:8.3`; vaṇṇa còn có thể là phẩm chất, nhưng cả đoạn 9–13 nói về hình tướng và hành vi. (11) `:28.2` atanditā dịch không biếng nhác; tiền lệ một khoá ở tha-ap484 dịch không hề mỏi mệt, nhưng tandī là uể oải, không phải mệt. (12) `:4.2` pulinacetiya và `:6.1` thūpo cùng chỉ một vật, đều dịch ngôi tháp cát; `:22.2` sikatāthūpa cũng là tháp cát.
  Quy ước dấu: ngoặc kép “ mở ở `:1.1` và đóng ở `:37.3`; nháy đơn ‘ mở ở `:6.1`, đóng ở `:6.4`; mở lại ở `:7.1`, đóng ở `:16.4`; mở ở `:21.1`, đóng ở `:21.4`; mở ở `:22.1`, đóng ở `:22.4`; mở ở `:27.3`, đóng ở `:28.4`. Khớp Pāli từng khoá (150/150). `…pe…` ở `:35.2`, `:36.2`, `:37.2` thành đúng một `…` (3/3); không khoá nào có `(…)` trần.
  Tự kiểm: tập khoá Việt bằng đúng tập khoá Pāli (150 = 150, đúng thứ tự); nháy đơn và nháy kép khớp Pāli ở 150/150 khoá; dấu lược khớp 150/150; mọi giá trị NFC, không rỗng, không khoảng trắng thừa; không Pāli lọt ngoài các tên riêng Therāpadāna, Pulinuppādaka, Himavanta, Devala, Komudika, jiñjuka; đã in cặp Pāli với Việt từng khoá để đọc đối kháng. Phép dấu lược của riêng tôi từng báo nhầm ba khoá `…pe…` vì đếm hai dấu `…` bên Pāli; đã sửa theo cách đếm của kho (một cụm `…pe…` bằng một dấu lược).
