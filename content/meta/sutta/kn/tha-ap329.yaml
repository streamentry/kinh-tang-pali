notes: |-
  Bài tha-ap329, 105 khoá Pāli, dịch đủ 105 khoá; khoá Việt khớp tập khoá Pāli, đúng thứ tự Pāli.

  KHÔNG CÓ TẦNG THAM KHẢO. Đã tra tầng Anh đã ghim: tầng english-sujato chỉ có chín thư mục con của kn (cp, dhp, iti, ja, kp, snp, thag, thig, ud) và duy nhất một tệp mang tên tha-ap là tệp tên phẩm, trong đó hai mục chạm tới uid này (tha-ap-name:329.tha-ap299 và tha-ap-name:362.tha-ap329) đều rỗng. Tầng english-project không có tệp nào cho tha-ap. Tầng vietnamese-current chỉ có 26 tệp Pháp Cú. Mẫu số coverage (khoá Pāli có nội dung từ 40 ký tự trở lên, bỏ khối :0) = 2 (:27.1 và :28.1, tức hai dòng lời-kết), Sujato phủ 0/2 và hai khoá đó là công thức lời-kết, không mang nội dung kệ; mọi vế kệ đều dưới ngưỡng 40 ký tự nên cổng không đo được gì về phần kệ. Bài dịch chỉ từ Pāli, nên triangulation giữ 7.5 (tối đa 8.0) và status draft.

  TIÊU ĐỀ. Pāli :0.3 là Nigguṇḍipupphiyattheraapadāna, không bắt đầu bằng số, nên bản Việt không thêm số; translationTitle bằng đúng :0.3. Đo ba phạm vi cho cụm Tuyên Ngôn / Tuyên Ngợ ở :0.3 của tha-ap: toàn phẩm (501 tệp có bản Việt) Tuyên Ngợ 242, Tuyên Ngôn 133, Ký Sự 111, Tuyên Ngợi 10; tha-ap300 đến tha-ap360 Tuyên Ngợ 37, Tuyên Ngôn 14, Ký Sự 7, Tuyên Ngợi 2; tha-ap320 đến tha-ap339 Tuyên Ngôn 7, Tuyên Ngợ 7. Trong chính phẩm Umāpupphiya (tha-ap323 đến tha-ap331, không tính bài này) Tuyên Ngợ 4, Tuyên Ngôn 1, Tuyên Ngợi 1, Ký Sự 2. Phạm vi gần nhất nghiêng về Tuyên Ngợ, phạm vi 20 tệp hòa. Tôi chọn Tuyên Ngôn vì Tuyên Ngợ là chính tả sai (ngợ không phải ngôn), và vì đây là hình thức tha-ap328 trong cùng phẩm dùng; tha-ap207 (cùng tên Nigguṇḍipupphiya) đang ghi Tuyên Ngợ. Đề nghị người biên tập phán một lượt cho cả cuốn. Tên phẩm :0.2 Phẩm Umāpupphiya theo tiền lệ 7 trên 8 tệp (một tệp ghi Phẩm Bậc Rải Hoa Umā). Lục kết :28.1 sattamaṁ = thứ bảy, đối chiếu chuỗi phẩm: tha-ap323 paṭhamaṁ, 324 dutiyaṁ, 325 tatiyaṁ, 326 catutthaṁ, 327 pañcamaṁ, 328 chaṭṭhaṁ, 329 sattamaṁ. Tên nhân vật bỏ đuôi -o (nigguṇḍipupphiyo thành Nigguṇḍipupphiya) theo đa số lời-kết: bỏ đuôi 434, giữ 52. Lời-kết :27.1 dùng nhóm số nhiều những bài kệ này, khớp imā gāthāyo.

  SỐ PĀLI, tự tính. Tayo saddā 3 thành ba tiếng; Jātiyā sattavassova 7 (satta) thành mới lên bảy tuổi (hai khoá :15.1 và :19.1 cùng Pāli, cùng bản Việt); Dvādasamaṁ bhāṇavāraṁ 12 thành phần tụng đọc thứ mười hai; Pañcavīsasahassamhi kappānaṁ: pañcavīsa 25 (5 + 20), sahassa 1000, 25 x 1000 = 25.000 thành hai mươi lăm ngàn kiếp; Paṭisambhidā catasso 4 thành bốn vô ngại giải; Tāvatiṁsā 33 thành cõi Ba Mươi Ba; aṭṭha 8 thành tám vị (xem bất định). Bài không có cụm Tiṁsakappasahassa, không có công thức thọ ký tương lai (bhavissati) nên không có chỗ dùng cách nói sau … kiếp nữa; câu :25.1 không có dấu chỉ hướng (ito) nên Việt giữ nguyên là trong hai mươi lăm ngàn kiếp, không thêm trước hay sau.

  NHỊP NHÁY. Pāli mở ngoặc kép ở :1.1 và đóng ở :26.3; nháy đơn mở :2.1 đóng :5.4, mở :7.1 đóng :7.4, mở :23.1 đóng :24.4. Bản Việt khớp Pāli từng khoá (0 khoá lệch trên 105); tổng mỗi loại ngoặc: mở kép 1/1, đóng kép 1/1, mở đơn 3/3, đóng đơn 3/3. Dấu lược: :26.2 là …pe…, giữ đúng một …; Pāli không có (…) nên Việt không có.

  TIỀN LỆ VÀ LỆCH CÓ CHỦ Ý. Đã dựng chỉ mục Pāli sang Việt cho 501 tệp tha-ap và đối chiếu từng khoá: 65 khoá có Pāli trùng nguyên văn với bài khác (hai khoá có tiền lệ nằm ngay trong bài này là :15.1 với :19.1, và :18.2 với :21.2, đều dịch giống nhau); dùng lại nguyên văn 35 khoá (trong đó :26.1 đến :26.3 và các vế công thức Padumuttarabuddhassa, Tena kammena, Pattomhi acalaṁ ṭhānaṁ, hitvā jayaparājayaṁ, kālaṅkato, sukkamūlena codito, Mamuddharitukāmo so); 30 khoá khác tiền lệ, phần lớn vì bản đã có là tha-ap189 (đoạn kệ chư thiên :1 đến :9 trùng với tha-ap189 và gần trùng iti83 có Sujato) và đọc sai Pāli. Các lệch có lý do: (1) saṁvega dịch kinh động (dn21 hai khoá, mn50), không dịch hổ thẹn như tha-ap189 (hổ thẹn là hiri/ottappa, một khoá lệch); (2) niviṭṭhāssa là niviṭṭhā + assa (thức nguyện), nên có Mong, khác tha-ap189 viết đã vững chãi; (3) abyāpajjaṁ nirūpadhiṁ thành không ác ý, không còn sanh y (không ác ý 24 khoá, sanh y theo mn98, mn66, dn28) thay cho đoạn khó hiểu ở tha-ap189; (4) opadhikaṁ puññaṁ thành phước hữu sanh y theo iti83, thay phước bối; (5) upapajjiṁ là quá khứ ngôi một nên dịch tôi đã tái sinh, khác tha-ap189 viết hãy sinh lại; (6) dhīraṁ thành bậc trí (7 khoá), khác vị dũng mãnh; (7) anusāsitvā thành chỉ dạy, khác được nghe giảng; (8) sāsana thành lời dạy và pāvacana thành giáo pháp, để khỏi dùng một chữ cho hai từ Pāli.

  BẤT ĐỊNH, không đoán thêm vào thân kinh. (1) :12.4 puna dhāreti mātuyā: dhāreti là chủ động ngôi ba, mātuyā là cách sở hữu hoặc công cụ, không có chủ ngữ rõ; tôi dịch lại được người mẹ mang giữ, còn có thể đọc khác. (2) :20.4 niyyādesi không có tân ngữ trong Pāli; tha-ap416:3.2 dùng niyyādesi với tân ngữ mamaṁ (giao tôi cho vị trưởng lão); tôi dịch đã giao phó và không thêm đối tượng. Chủ thể là Ānanda (mahājuti) là cách đọc theo ngữ cảnh :19.3 đến :20.2. (3) :25.3 đến :25.4 Abbudanirabbudāni aṭṭhaṭṭhāsiṁsu khattiyā: toàn tầng chỉ có một dạng Abbuda… này; abbuda và nirabbuda còn là tên số trong dãy số lớn của Pāli, nên có thể là tên hai nhóm vua, có thể là số lượng. Tôi giữ hai từ như tên riêng nối bằng và, và dịch tám vị coi aṭṭhaṭṭhā là ghép của aṭṭha với (ṭ)ṭhāsiṁsu; cách đọc tám lần tám (64) hoặc tám cho mỗi nhóm không loại trừ được. (4) :17.4 bodhimuttamaṁ: tầng đang dịch cội bồ-đề tối thượng (khoảng 8 khoá) và giác ngộ tối thượng (khoảng 7 khoá); ở đây theo ngữ cảnh vua Kosala đến bằng xe voi nên dịch cội bồ-đề, nhưng đọc là Đức Phật cũng khả dĩ. (5) :18.4 samayaṁ agamāsahaṁ: samaya có thể là buổi hội, thời điểm hoặc giáo pháp; dịch buổi tụ hội. (6) :20.1 gatimā dhitimā: tầng chỉ có mn12:62.8 làm tiền lệ (satimanto trí nhớ, gatimanto khả năng ghi nhớ, dhitimanto lưu giữ); tôi giữ khả năng ghi nhớ cho gatimā nhưng dịch dhitimā là kiên trì, lệch mn12 vì ở đây là phẩm chất của Ānanda. (7) :7.3 yoniṁ dịch nơi sinh để không buộc thành thai; :2.2 sahabyataṁ dịch cùng chung sống. (8) :15.2 ārāmaṁ dịch tịnh xá theo ngữ cảnh. Những điều này là lý do ambiguity_integrity đặt 8.4.

  LỖI BẢN NHÁP ĐÃ BẮT. Không có khoá nào phải sửa sau lượt đọc đối chiếu cặp Pāli với Việt. Hai điểm của chính phép kiểm: phép đếm dấu lược đơn giản báo lệch ở :26.2 vì …pe… gồm hai ký tự … trong khi bản Việt đúng một …, cổng kiểm của kho xác nhận khoá này cân; phép so cặp trùng báo lệch ở :11.1, :16.1, :23.3 chỉ vì chữ hoa đầu dòng (dòng .1 và .3 viết hoa theo quy ước tầng), không phải khác nghĩa.

  KỸ THUẬT. technical_integrity đặt 9.6: lượt này không chạy được các cổng của kho. Chưa chạy: npm run validate, npm test, npm run check, npm run build. Bài giữ status draft do blocker tầng tham khảo, không phải do điểm.

  Lượt cải thiện 2026-10-11: đọc đối kháng lại cả 105 khoá theo cặp Pāli với Việt, đo tiền lệ trên toàn tầng (28.881 khoá tha-ap ngoài bài này và 252.542 khoá các bộ còn lại) và đối chiếu bản Anh đã ghim của iti83 (Sujato), bài song song với :1 đến :6 của bài này. Ba khoá đổi, tập khoá và thứ tự khoá không đổi (105/105), nháy khớp Pāli từng khoá (0 lệch), hai cặp Pāli trùng trong bài (:15.1 với :19.1, :18.2 với :21.2) vẫn cùng bản Việt.
  (1) :20.1 Gatimā dhitimā ceva: trước là Có khả năng ghi nhớ, có sự kiên trì; nay là Có sự thông đạt, có sự kiên định. Lý do: đây là bốn phẩm chất công thức của Ānanda (đa văn, niệm, gati, dhiti). Trong tầng có hai nơi dịch gati của chính công thức này: an1.221 (gatimanta là thông đạt) và thag17.3:36.1 (cả ba gatimanto, satimanto, dhitimanto thành có sự thông đạt, có niệm, có sự kiên định), tức 2 nơi cùng công thức so với 1 nơi (mn12:62.8, khả năng ghi nhớ) là danh sách bốn người khác. Với dhiti: kiên định có ở thag17.3:36.2 và ja513:15.1; kiên trì có ở ja305:4.4; an1.222 dịch giữ vững. Bản cũ tự nhận lệch tiền lệ ở khoá này (mục bất định số 6 phía trên nay lỗi thời); sửa theo tiền lệ gần nhất, là terminology fix. Điểm terminology 9.0 lên 9.2.
  (2) :6.4 ehi deva punappunaṁ: hỡ vị trời đổi thành này vị trời. Hỡ là hình thức cổ và chỉ đến từ tha-ap189 (1 khoá); khoá song song iti83:18.4 dùng Này trời, và cùng bài này :2.1 dùng này bạn cho bho. Style-only, không đổi điểm. Giữ hãy đến (không đổi thành hãy trở lại như iti83 và như Sujato Come back) vì ehi là hãy đến nghĩa đen, còn nghĩa trở lại là điều suy từ ngữ cảnh.
  (3) :3.2 mūlajātā patiṭṭhitā: được thiết lập vững chắc đổi thành đứng vững. Lý do: :3.1 đã dùng an lập cho niviṭṭhā, nên thiết lập làm hai từ Pāli khác nhau trông như một; công thức mūlajātā patiṭṭhitā ở dn27:9.3 và mn47:16.1 dịch đứng vững. Style-only, không đổi điểm.
  Những chỗ nghi ngờ đã xem lại và quyết định không đổi: anuttaraṁ ở :2.4 giữ tối thượng (iti83:13.4 và bản Sujato supreme cùng dùng tối thượng; toàn tầng anuttara là vô thượng 547 và tối thượng 190, không có đa số rõ riêng cho thể kệ); macce ở :5.3 không có chữ riêng, đã gộp trong những người khác (iti83:17.3 cũng vậy); tādino ở :15.4 giữ Như Thật (tầng không có đa số: bất động 65, vững vàng 30, như vậy 92, như thật 15 trong các khoá có tādin); saṁvega kinh động (tầng chia khẩn thiết, xúc động, cấp thiết, kinh động, không có đa số); aṭṭhaṭṭhāsiṁsu ở :25.4 giữ tám vị (tha-ap41:5.2 có aṭṭhāsiṁsu janādhipā cũng là tám vị).
  Bất định còn nguyên, không đoán: :12.4 chủ thể của dhāreti; :20.4 tân ngữ của niyyādesi; :25.3 đến :25.4 Abbudanirabbudāni là tên hay số; :17.4 bodhimuttamaṁ; :18.4 samayaṁ; nghĩa gốc của gati (thông đạt hay ghi nhớ) vẫn do tiền lệ chứ chưa phân xử được từ Pāli một mình. Vì vậy ambiguity_integrity 8.4 và semantic_fidelity 8.8 không đổi; triangulation giữ 7.5 vì bài vẫn không có tầng tham khảo Anh trên chính uid này (iti83 chỉ song song 24 trên 105 khoá, và đã được bản cũ dùng). Blocker không có tầng tham khảo tiếng Anh giữ nguyên. final_score 9.0 lên 9.02 chỉ do một điểm terminology tăng 0.2; trạng thái do công cụ chấm của kho tính lại.
  Ngoài phạm vi, chỉ báo: tha-ap212:5.2 dịch aṭṭhāsiṁsu janādhipā là sáu mươi tám vị trong khi cùng Pāli ở tha-ap41:5.2 là tám vị; Pāli không có chữ sáu mươi.

  Quyết định hội đồng biên tập 2026-10-16: C5 — 0.3, 28.1 (tiêu đề và dòng kết dùng "Ký Sự Về Trưởng Lão …" thay "Bài Kệ Tuyên Ngôn"); C6 — 23.4, 24.3 (xưng hô theo mục 9: lời thưa Đức Phật xưng "con").
