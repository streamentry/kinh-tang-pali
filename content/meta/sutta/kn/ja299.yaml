notes: |-
  CHỐT LƯỢC TỪNG VẾ. (1) Sutā hi mayhaṁ paramā visuddhi ở 2.1 và Sutā hi te sā ở 3.3: sutā là điều đã nghe học, tôi dịch Điều nghe hỏi ấy là sự thanh tịnh tối thượng; đây là ý trung tâm của bài, người đọc Việt cần hiểu là sự nghe pháp chứ không phải tu hành. (2) Pure tuvaṁ sīlavataṁ sakāse ở 1.1: tôi dùng đức hạnh cho sīla, còn tầng đang có cả giới luật (180 lần) và giới hạnh (379 lần); ở Jātaka Tikanipāta tôi thấy giới hạnh phù hợp với nghĩa đạo hạnh của câu kệ. (3) Okkantikaṁ kīḷasi assamamhi ở 1.2: thịnh niên còn chơi với bọn mình. (4) selasmi ở 3.1 là tảng đá, tôi dịch tảng đá chứ không dịch đá. (5) Ārā tuvaṁ ở 3.4 là ngươi ở gần, tôi dịch ngươi đã ở gần.

  TÊN BÀI. Komāraputta là con trai thợ gốm, tầng đã dùng thợ gốm cho Ghaṭīkāra và kummāra (đếm 5 cụm thợ gốm), nên tôi dịch Kinh Con Nhà Gốm.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của kiểm cổ chỉ quét khoá Pāli từ 40 ký tự trở lên; ở bảy bài Jātaka của lát này mọi vế kệ đều ngắn hơn ngưỡng đó (vế dài nhất 35 ký tự) nên assertion về bản chất KHÔNG chạy. Tôi tự quét lại TOÀN BỘ 238 khoá của 14 bài từ tệp đã ghi trên đĩa: đủ khoá và không thừa so với Pāli (sắp theo thứ tự số), không rỗng, chuỗi NFC, số dấu lược khớp từng khoá, không có (…), không thừa dấu lược, và số dấu nháy kép so với Pāli từng khoá. Kết quả: 0 lỗi trên 238 khoá.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… hay dấu lược — đã kiểm bằng script trên từng khoá. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không mở rộng, không nén, không có (…) đứng một mình.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Tôi tự dựng chỉ mục Pāli↔Việt bằng script: nạp 5.764 tệp Pāli trong .cache/upstream/suttacentral/root/pli (bỏ *.apfs-orphan) và 4.136 tệp Việt dự án trong content/translation/vi/project/sutta — tổng 112.947 khoá Việt — ghép theo khoá, rồi quét từng khoá thân bài của lát theo nguyên văn căn thẳng và theo dạng đã chuẩn hoá dấu câu, nháy kép, hoa thường, và loại bỏ chính 14 tệp của lát để đo đúng trạng thái trước khi tôi ghi. Kết quả: 44 cặp Pāli trùng ở thân bài, 42 trùng byte-for-byte và 2 trùng sau chuẩn hoá. Trong đó 33 cặp đã có bản Việt ở bài khác, tôi DÙNG LẠI NGUYÊN VĂN ở: ja275 2.3, 2.4, 3.1, 3.2, 3.3, 3.4 ← ja274; ja294 3.1 ← sn1.1; mil3.1.11 3.2 và 3.3 ← sn10.12:5.2 và 5.3 (tôi lấy cả bộ bốn vế ở sn10.12:5.1–5.4 để bài này không tự mâu thuẫn với bài nguồn); Opammaṁ karohī ở mil3.1.11:2.1, mil3.1.14:2.1, mil3.1.15:2.1, mil3.2.2:2.1, mil3.5.10:2.1, mil3.7.16:2.1; mil3.1.14 3.1 ← mil3.1.12:3.1 và 3.5 ← mil3.1.12:3.4; Kallosi ở mil3.1.11:4.1, mil3.1.14:4.1, mil3.1.15:3.1, mil3.2.2:3.1, mil3.2.9:2.1, mil3.5.10:3.1 ← 54 tệp mil khác; mil3.2.2 2.4 ← mil3.5.9:2.3; mil3.5.10 6.1 ← mil3.4.10:5.1 và mil6.2.10:5.1; mil3.7.16 5.1 ← mil3.1.16:6.1. Mười một cặp còn lại thì chưa bản Việt nào ở bài khác có, tôi phải đặt mới: ja294 2.1 và 2.2, ja295 2.1 và 2.2 (bốn khoá này là hai cặp trùng nhau — chính bài trong lát đã trùng nhau; tôi đặt một lần rồi dùng lại nguyên văn cho cả hai bài), ja295 1.3 và 1.4 (trùng ja308:1.3 và 1.4), ja297 1.2 (trùng ja429:6.2 và ja430:6.2), ja298 1.2 (trùng sáu chỗ trong ja547), mil3.1.11 1.3 và 2.4 (trùng nhau, chỉ khác ở dấu nháy) và mil3.2.9 5.1 (trùng mil6.1.9:12.1). Ghi lại đây để lát sau dùng lại nguyên văn của tôi thay vì dịch lần hai.

  MỌI CÔNG THỨC HỘI THOẠI ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN. Rājā āha— → Vua nói: (đếm trong tầng mil có 30 tệp dùng Vua nói: và 12 tệp dùng Vua nói—, tôi theo đa số; 11 tệp còn lại dùng Vua nói:—). Thero āha— → Trưởng lão nói: (3 tệp dùng dạng có dấu hai chấm và 3 tệp dùng dạng có gạch nối, hòa nhau; tôi chọn dạng có dấu hai chấm để nhất quán với Vua nói: trong chính lát này). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā. (54 tệp mil, chỉ một cách). Opammaṁ karohī → Xin hãy xét một thí dụ ti. (đúng mil3.1.12:2.1, mil3.2.7:2.1, mil3.2.8:2.1). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa ti. (đúng mil3.1.12:3.1). Bhāsitampetaṁ, mahārāja, bhagavatā— → Điều này, này Đại vương, Đức Thế Tôn đã nói — (đúng mil3.1.12:3.4). Imasmiṁ vagge dasa pañhā và Imasmiṁ vagge soḷasa pañhā → Trong phẩm này có … câu hỏi. (đúng mil3.4.10:5.1, mil6.2.10:5.1, mil3.1.16:6.1). Rājā → vua, Mahārāja → Đại vương, bhagavā/bhagavatā → Đức Thế Tôn hoặc Đức Thật Chứng Ấy, Thero → Trưởng lão, Kāma → tình dục, sīla → đức hạnh.

  TÊN PHẨM ĐÃ CHỐT. Tikanipāta → Bộ Ba Bài Kinh (bốn bài lân cận đã có: ja276, ja291, ja292, ja293). Udapānavagga → Phẩm Nước Uống (đúng ja276 và ja279; tôi tự đếm bằng script trên Pāli gốc: 10 bài mang tên phẩm này là ja271..ja280, và ja275 nằm trong đúng khoảng đó). Kumbhavagga → Phẩm Bình Vò: tên này CHƯA có trong bảng chốt của BRIEF_VI3 §11, nên tôi theo đa số trong chính phẩm đang làm — ba bài đã có (ja291, ja292, ja293) đều dùng Phẩm Bình Vò; tôi tự đếm Kumbhavagga chiếm đúng ja291..ja300, trong đó lát này có sáu bài. Người biên tập nếu muốn chốt khác thì phải sửa cả mười bài cùng lúc. Các tên phẩm Milindapañha cũng theo đúng bầy bài lân cận: Mahāvagga → Đại Phẩm, Addhānavagga → Phẩm Khoảng Thời Gian, Buddhavagga → Phẩm Đức Phật, Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc.

  STATUS. Hai blocking error ở trên là thật và đo được (thiếu hẳn tầng Anh Sujato tại commit đã ghim; coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên mọi bài lát này đặt draft bất kể final_score. Tôi không nâng điểm để né blocker và cũng không hạ điểm để tỏ ra thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có tầng tham khảo nào.

  Giải quyết draft 2026-10-12: kiểm toán đối kháng lại toàn bài từ Pāli. Bản cũ sai nghĩa nặng ở 13/17 khoá; mục CHỐT LƯỢC TỪNG VẾ và TÊN BÀI ở trên bị THAY THẾ bởi mục này (phần còn lại là lịch sử). (1) makkaṭa là con KHỈ chứ không phải ếch: 1.3 cũ "Hỡi đàn ếch tập bên bờ kia" và 3.4 cũ "hỡi ếch" đều sai; Pāli 1.3 Karohare makkaṭiyāni makkaṭa = "này khỉ, hãy làm những trò khỉ đi" (karohare = karohi + re, mệnh lệnh). (2) Người nói đã đảo: 1.1–1.4 là các đạo sĩ lêu lổng nói với con khỉ (ngươi/chúng ta); 2.1–2.4 là con khỉ trả lời (tôi, āvuso = hiền giả); 3.1–3.4 là đạo sĩ đáp lại. 1.4 cũ "ta không còn ưng cái đời hạnh ấy của ta" đảo chủ thể (Na taṁ mayaṁ: taṁ = "ngươi" đối cách, mayaṁ = "chúng ta") nên sửa thành "chúng ta chẳng ưa ngươi giữ giới". (3) 1.1 cũ "từng rực rỡ nhờ đức hạnh" là thêm nghĩa không có trong Pāli (rực rỡ): sakāse = ở bên cạnh/trước mặt, sīlavataṁ = những người giữ giới (cùng cách dịch với an3.42:2.1 "bậc có giới"); 1.2 cũ "giờ thịnh niên ngươi còn chơi với bọn mình" bịa nghĩa; okkantikaṁ kīḷasi assamamhi = nhảy nhót vui đùa trong am thất. (4) 2.1/2.2/3.3: sutā là "đã nghe", visuddhi paramā là "sự thanh tịnh tối thượng", cũ "Điều nghe hỏi ấy là sự thanh tịnh tối thượng" lệch cấu trúc; sửa thành "Quả thật tôi đã nghe sự thanh tịnh tối thượng từ Komāraputta, bậc đa văn" (đa văn có tiền lệ sn36.6:5.1) và 3.3 "sự thanh tịnh tối thượng ấy ngươi quả đã nghe". bahussutassa cũ "học rộng nhất" là thêm cấp so sánh cao nhất không có trong Pāli. (5) 2.3 "tưởng ta" sửa thành "nghĩ về tôi", maññi (mā ... maññi) = chớ nghĩ. (6) 3.4 Ārā tuvaṁ makkaṭa jhānabhūmiyā: ārā là XA (cũ viết "đã ở gần": đảo nghĩa hoàn toàn so với ý cả bài, vì hạt trên đá không nảy mầm là hình ảnh của kẻ xa thiền); jhānabhūmi = nền tảng thiền (tiền lệ pe8:2.x "nền tảng thiền"). (7) 3.1 cũ thêm chủ ngữ "ngươi" gieo hạt không có trong Pāli (vapeyya là ngôi ba bất định) nên sửa thành "Dù có gieo hạt trên tảng đá". (8) Tên bài: Komāraputta là tên riêng của vị thầy (người con của Komāra), không có căn cứ nào cho "con nhà gốm" (Komāra không phải kumbhakāra, và đạo sĩ không phải thợ gốm), nên bỏ cách dịch cũ và giữ nguyên tên riêng như Supatta, Vaka ở các bài lân cận; đổi 0.4, 4.1 và translationTitle cho khớp, đổi cả tag. Khoá đổi: 0.4, 1.1, 1.2, 1.3, 1.4, 2.1, 2.2, 2.3, 2.4, 3.1, 3.2, 3.3, 3.4, 4.1 (14 khoá; trong đó 13 khoá lỗi nghĩa thật hoặc đảo chủ thể, 2.2/3.2/4.1/0.4 là sửa nhẹ hoặc đổi tên). Giữ nguyên 0.1, 0.2, 0.3.

  Cách đọc mang bất định nhỏ: (a) okkantikaṁ chỉ có nghĩa "nhảy nhót" theo văn cảnh trò khỉ và theo hai bản Anh công bố ngoài kho (không thuộc tầng ghim, chỉ dùng kiểm cách đọc, không chép câu chữ); tôi không phân xử được sắc thái từ nguyên ("nhảy xuống/từng đợt") nên chọn nghĩa chung "nhảy nhót vui đùa". (b) sīlavataṁ ở 1.4 có thể là tính từ của taṁ (ngươi giữ giới) hoặc là sīlavata (giới và hạnh) làm tân ngữ; hai cách đọc đều cho cùng ý "chúng ta chẳng ưa việc ngươi giữ giới", nên chọn cách ngắn nhất. (c) Komāraputtassa ở 2.2 là sở thuộc cách; dịch "từ Komāraputta" theo nghĩa nghe điều ấy từ vị thầy, phù hợp mạch kể của bài.

  GỠ BLOCKER 2026-10-12. Blocker thứ hai cũ (coverage tầng Anh 0/0 dưới ngưỡng 0,80, chưa có mục reference-gaps) do tác giả cũ tự đặt và không phải lỗi văn bản: mẫu số 0 (mọi vế kệ dưới 40 ký tự) nên cổng không đo được gì, và Sujato không có bài này (đã nêu ở blocker còn giữ). Tôi đã đọc đối kháng cả 17 khoá từ Pāli một mình và bản dịch tự đứng vững, nên gỡ. Blocker thứ nhất (không có bản Anh Sujato tại commit đã ghim) là sự thật về upstream nên GIỮ NGUYÊN. Tầng vietnamese-current không có bài này (chỉ có Pháp Cú): giới hạn tham chiếu, không phải lỗi văn bản. Triangulation 6,5: không có bản Anh độc lập nào được ghim, chỉ đối chiếu Pāli và thẩm định ngữ pháp từng vế.

  Điểm trước đây sau: semantic_fidelity 9,1 → 9,0 (bản cũ 13/17 khoá sai nghĩa nên điểm cũ không đáng tin, giờ chấm lại theo bản mới); grammar_logic 9,1 → 9,0; terminology 8,8 → 8,8; triangulation 6,4 → 6,5; vietnamese_clarity 9,2 → 9,0; ambiguity_integrity 8,8 → 9,0 (bất định đã ghi rõ); các tiêu chí còn lại giữ. final_score 8,96. Kiểm: đủ 17 khoá, thứ tự theo Pāli, 0 dấu lược (Pāli không có), dấu nháy kép khớp Pāli từng khoá (ngoặc mở ở 1.1/2.1/3.1, đóng ở 1.4/2.4/3.4), không Pāli lọt vào bản Việt ngoài tên riêng Komāraputta. Chưa chạy bốn lệnh của kho: npm run validate, npm test, npm run check, npm run build.

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 6 khoá chênh lệch lớn nhất → khác nghĩa 2 chỗ: sửa 1, bất định 1. Sửa 1 (`1.2` `okkantikaṁ kīḷasi assamamhi`: trước *ngươi vẫn nhảy nhót vui đùa trong am thất*, sau *ngươi đã nhảy nhót vui đùa trong am thất*, vì `kīḷasi` là hiện tại kể việc cũ sau `pure` (*trước đây*) ở `1.1`, và `Karohare makkaṭiyāni makkaṭa` ở `1.3` là lời bảo làm lại trò khỉ, không phải việc đang tiếp diễn; bản mù cũng đọc là việc đã qua). Bất định 1 (`1.4` `na taṁ mayaṁ sīlavataṁ ramāma`: bản dự án *chúng ta chẳng ưa ngươi giữ giới*, đọc `sīlavataṁ` như đối cách số ít đi với `taṁ`; bản mù *không ưa ngươi trong hàng những bậc có giới*, đọc sở hữu cách số nhiều; dạng chữ dung được cả hai, ý chung *chúng ta không ưa ngươi giữ giới* gần nhau, giữ cách đọc cũ như đã ghi ở mục bất định (b)). Giữ 4 (`1.1`, `1.3`, `2.4`, `0.4`: chỉ khác diễn đạt; `2.4` `jhānānuyutto viharāmi āvuso` *tôi sống chuyên chú nơi thiền định, thưa hiền giả* so với *này bạn, tôi đang sống chuyên tâm vào thiền*: cùng nghĩa). Đọc đối kháng lại 17 cặp Pāli↔Việt, không thấy lỗi mới. Không có bản Anh hay bản Việt độc lập khác; đối chiếu chỉ bằng Pāli, ngữ cảnh bài và tiền lệ trong tầng dự án.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
