    không có tiền lệ cho cặp vợ chồng này; chọn xưng hô vợ chồng theo ngữ cảnh, không phải nghĩa Pāli khác.

  **BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh:**
  · `1.1`–`1.4` ngôi nói: Pāli ở ngôi thứ ba (`āsi`, `so`, `nāsakkhi`) rồi chuyển sang ngôi thứ nhất ở
    `2.1`–`2.4` (`maṁ`, `pabbajissaṁ … ahaṁ`). Sujato đọc cả `1.x` ở ngôi thứ nhất, bản Việt nguyên bài
    giữ ngôi thứ ba. Tôi giữ ngôi thứ ba (*người ấy*) ở `1.x` và *ta* ở `2.x` theo đúng hình thái Pāli;
    đây là Kāḷa tự nói về mình, nhưng Pāli không nói điều đó thành lời.
  · `1.1` `laṭṭhihattho`: dịch *có gậy trong tay*, đúng nghĩa từng chữ. Sujato thêm *hermit's* (*đạo sĩ*),
    bản Việt nguyên bài thêm *(đạo sĩ)* trong ngoặc; Pāli không có chữ đó, nên tôi không thêm vào thân kinh.
  · `1.3`–`1.4` `Āsāya palipā ghorā`: dịch *vì mong cầu, từ vũng lầy khủng khiếp, … không thể vượt sang
    bờ bên kia*, đọc `āsāya` là cách (instrumental) và `palipā ghorā` là xuất xứ (ablative), theo Sujato và
    bản Việt nguyên bài. Cách đọc khác coi `āsāya` là sở hữu (*vũng lầy khủng khiếp của mong cầu*) không
    được phân xử bằng chứng cứ trong tầng đã ghim; nghĩa cả hai gần nhau.
  · `2.2` `atosayi`: dịch *làm cho đứa con vui*, theo Sujato (*kept our son happy*); bản Việt nguyên bài
    *chọc giỡn đứa con*. Pāli chỉ nói `atosayi` (aorist của `toseti`, *làm hoan hỷ/vui lòng*), không rõ ngụ ý (dùng đứa con làm
    công cụ giữ chân Kāḷa) có trong lời kệ hay chỉ trong chú giải; tôi không thêm.
  · `7.1` `Kāḷaṅginiṁva takkāriṁ`: Pāli root viết liền một chữ. Cả Sujato lẫn bản Việt nguyên bài đều tách
    `Kāḷa` (hô cách) khỏi phần còn lại; tôi theo cách tách đó (*Này Kāḷa, thiếp như cây takkārī*) và **không**
    dịch phần còn lại sau `Kāḷa` (Sujato: *sprouting iris*; bản Việt nguyên bài: *chồi non*). `kāḷaṅgini`,
    `takkārī` chỉ có đúng một lần ở thân kệ này trong lớp Pāli ghim (một chỗ khác `takkāri` ở `ja536` là
    chuỗi tên cây dài, không phân xử được nghĩa); tên cây giữ nguyên Pāli, không đoán loài. Người biên tập
    nên coi đây là chỗ cần tra thêm từ điển/chú giải.
  · `7.3` `dālimalaṭṭhiṁ`: dịch *cành lựu* (`dālima` = lựu, `laṭṭhi` = cành/nhánh), theo Sujato
    (*pomegranate*); bản Việt nguyên bài *giống dây leo dāḷima*, nghĩa `laṭṭhi` khác. Không phân xử.
  · `7.4` `antodīpe`: dịch *giữa hòn đảo*, đúng từng chữ (*bên trong đảo*); không thêm tiểu sử.
  · `8.4`/`10.4` `kassa ohāya gacchasi`: dịch *chàng bỏ thiếp ra đi vì ai?*, giữ `kassa` là *vì ai* (đúng
    từ Pāli; Sujato dịch *how can you…*, bản Việt nguyên bài *bởi vì ai chàng nỡ…*, cả hai diễn ý rộng
    hơn). Nghĩa hàm ý *vì lẽ gì/vì ai mà bỏ* được giữ ở chữ *vì ai*, không thêm *nỡ*.
  · `9.3` `āharimena rūpena`: dịch *bằng sắc dáng giả tạo*; Sujato *costumed form*, bản Việt nguyên bài
    *sắc đẹp hấp dẫn*. `āharima` ở đây hiểu là *mang đến, không phải tự nhiên*; từ điển không có tiền lệ
    trong tầng này để đối chiếu, nên nghĩa *giả tạo* là cách đọc theo ngữ cảnh. `9.4` `bādhayissasi`: dịch
    *bức bách*, không phải *trói buộc* như Sujato (*trap*), vì Pāli dùng `bādhati`, không phải `bandhati`
    (mà `9.2` đã dùng là `bandhitum`).
  · `9.2` `sakuṇiṁ`: dịch *chim mái*, vì Pāli ở giống cái; Sujato và bản Việt nguyên bài chỉ nói *a bird*
    / *con chim*. Không thêm nghĩa ẩn dụ về Cāpā.
  · `12.3` `nisumbhissaṁ`: dịch *đánh gục* (động từ `nisumbhati` = *đánh ngã/quật xuống*); Sujato *strike
    him to the ground*, bản Việt nguyên bài *làm té ngã*. Không dịch thành *giết*.
  · `14.1` `bhaddante`: dịch *thưa tôn giả*, theo Sujato (*sir*) và bản Việt nguyên bài (*thưa bậc đạo
    hạnh*). Hình thức `bhaddante` có thể đọc là `bhadante` hoặc `bhaddaṁ te`; tầng có **33** khoá `bhaddante`
    nhưng không dịch thống nhất (*bạch các ngài*, *thưa ngài*, *hỡi các bậc*). Không phân xử.
  · `15.1` `gaṇino`: dịch *những kẻ có đồ chúng*; `gaṇī` là người có hội chúng hoặc dẫn đầu một nhóm.
    Pāli không nói họ là phái nào; tôi không thêm.
  · `15.1` dấu nháy mở `“` có trong Pāli ở khoá này (lượt lời của Kāḷa), và Việt cũng có; `16.1` Pāli không
    mở nháy mới vì cùng lượt lời, nên Việt cũng không mở.
  · `17.1`/`17.4`/`18.3`/`18.6`/`21.3` `ādisati`: dịch *dâng vật cúng dường*, theo `ja288:2.2` (`dakkhiṇamādisi`
    ⇒ *dâng cho ta sự cúng dường*) và `kp7:12.1`; bản Việt nguyên bài *trình lên vật cúng dường*, Sujato
    *dedicate my religious donation*. Pāli không nói Cāpā gửi vật gì cụ thể; có thể chỉ là *hồi hướng* phần
    cúng dường. Tôi thêm *thay cho Cāpā* ở `21.3` vì `Cāpāya` ở cách sở hữu/tặng cách; ở `17.4`, `18.6` để
    ngữ cảnh đã nói rõ. `17.1` không có `me` trong Pāli nên Việt không thêm *của thiếp*; `18.3` có `te`
    nên Việt có *của nàng*.
  · `19.4`–`20.4` `desentaṁ`: bốn khoá `20.1`–`20.4` được hiểu là đối tượng của `desentaṁ`, nên `19.4`
    kết bằng dấu hai chấm. Pāli kết `19.4` bằng chấm; ranh giới câu do bản Việt đặt, không đổi nghĩa.
  · `21.4` `Pabbajiṁ`: hình thức `-iṁ` là ngôi thứ nhất; Sujato và bản Việt nguyên bài dịch *ông ấy/vị ấy
    xuất gia* (ngôi thứ ba) vì cả đoạn `19`–`21` kể về Kāḷa. Việt viết không có chủ ngữ (*đã xuất gia,
    sống không nhà;*, đúng khuôn tầng) nên không phải chọn ngôi. Phần `21.5`–`21.6` (*ba minh … lời dạy
    của Đức Phật*) cũng không chủ ngữ, đúng khuôn tầng. Người đọc không bị dẫn tới ngôi nào, nhưng
    Pāli có thể là lời Cāpā hay người kể.
  · Tên: `Nāḷā` giữ theo Pāli đã ghim (`ḷ`); bản Việt nguyên bài viết `Nālā`; `Kāḷa` hai bên trùng.
    Không thêm tiểu sử vào thân kinh.

