notes: |-
  **Phạm vi: đủ 94/94 khoá của bài, không khoá nào ngoài danh sách.** Thứ tự khoá trong tệp
  bản dịch bằng đúng thứ tự Pāli (kiểm bằng phép so danh sách, không dùng phép cân tổng).

  **Nguồn và coverage — đo theo công thức khai ở `source/layers.yaml`
  (`substantivePaliMinChars: 40`, bỏ khối `:0`), tầng Anh tra qua manifest đã ghim:**
  · Độ dài Pāli lớn nhất của khoá thân bài là **27 ký tự**, toàn kệ ngắn ⇒ **mẫu số cổng = 0/91**.
    ⚠ Cổng coverage **không đo được gì** ở bài này; con số hiển thị không phải bằng chứng
    Sujato dịch đủ.
  · Đo thô thay thế, trên khoá thân bài (bỏ ba khoá tiêu đề `0.1`–`0.3`, còn 91 khoá `1.1`–`22.1`):
    bản Anh Sujato đã ghim **có tệp** `thig13.3_translation-en-sujato.json` (tầng `thig` có 73 tệp
    theo manifest), **90/91 khoá có chữ = 98,9%**; khoá duy nhất để trống là `22.1` (colophon
    `… Cāpā therī ….`). Bỏ riêng colophon thì 90/90 = 100%. Ba khoá `0.x` cũng có chữ. Cả hai số
    đều ≥ 0,80, không cần entry `reference-gaps`.
  · Tầng `english-project` **vắng** (không có tệp cho uid này, và không cần lấp vì không có khoá
    kệ nào Sujato bỏ trống ngoài colophon). Tầng `vietnamese-current` **vắng** (tại commit đã ghim
    thư mục Việt hiện hành chỉ có Pháp Cú). Bản Việt nguyên bài của SuttaCentral (Bhikkhu
    Indacanda, nhóm Hai Mươi, 13.3) chỉ là mục *Tra cứu toàn văn* ở cuối trang, không phải tầng
    store, nhưng đã đọc để đối chiếu cách đọc cú pháp. ⇒ `triangulation` **8,9**: Pāli + một tầng
    Anh đủ, không có tầng Việt phân đoạn, không có bản Anh độc lập thứ hai.

  **Tái dùng nguyên văn — dựng chỉ mục Pāli→Việt ở mức segment trên toàn tầng `kn`:**
  **10 khoá** của bài có Pāli trùng nguyên văn (chuẩn hoá chữ hoa, dấu câu, nháy) với khoá ở bài khác
  đã dịch (**10 cặp trùng ngoài bài đã dò**: `0.2`, `19.4`, `20.1`–`20.4`, `21.1`, `21.4`–`21.6`).
  **7 khoá giữ nguyên văn bản Việt cũ**: `0.2` (từ `thig13.1:0.2`), `20.1`, `20.2`, `20.4` (từ
  `thig7.3:5.1`/`5.2`/`5.4`), `21.4` (*đã xuất gia, sống không nhà;* — khuôn `tha-ap16:13.2`, 4 nơi),
  `21.5` (*Ba minh đã chứng đắc,* — **19** nơi, nhiều nhất trong các dạng), `21.6` (*đã làm tròn lời dạy
  của Đức Phật.* — **125** nơi). **3 cặp bản Việt khác**: `19.4` *đang thuyết giảng cảnh giới bất tử:*
  (khuôn `tha-ap133:1.4` *thuyết giảng cảnh giới bất tử.*; ở đây thêm *đang* cho phân từ `desentaṁ` và
  dùng dấu hai chấm vì khoá kế tiếp là nội dung được thuyết giảng); `20.3` *và con đường Thánh tám chi
  phần,* (theo `dhp191:3`, giữ nghĩa của `ca`; `thig7.3:5.3` dịch *Bát chánh đạo,* và bỏ `ca`; `thig7.2:5.3`
  ghi *Tránh đạo*, rõ ràng là lỗi chính tả của bài khác, không sửa trong lát này); `21.1` *Đảnh lễ dưới chân
  Ngài,* (khuôn `cp2:8.3`, `thig6.5:4.3`, đối tượng khác nhau).

  **Cặp Pāli trùng TRONG CHÍNH bài: 5 nhóm (10 khoá), 1 nhóm bản Việt khác.** `6.2` ≡ `18.2`
  (*như nàng nói với ta;* — giữ y hệt), `8.4` ≡ `10.4` (*chàng bỏ thiếp ra đi vì ai?”*), `17.2` ≡ `18.4`
  (*đến Đấng Bảo Hộ Thế Gian vô thượng;*), `17.3` ≡ `18.5` (*và sau khi thực hiện lễ hữu nhiễu,*);
  nhóm khác: `16.2` ≡ `19.2` (`nadiṁ nerañjaraṁ pati;`) dịch *ở bên dòng sông Nerañjarā;* ở `16.2` (không
  có động từ chuyển động) và *đi về phía dòng sông Nerañjarā;* ở `19.2` (đi cùng `pakkāmi`); khác vì ngữ cảnh.

  **Năm phép kiểm (tự viết, in số kèm mẫu số):**
  · (1) `set(khoá Việt) == set(khoá Pāli)`: **94 / 94**, thiếu **0**, thừa **0**; thứ tự khoá khớp
    Pāli. Phép **có đo được**.
  · (2) Nháy kép **khớp Pāli từng khoá**: lệch **0**. Pāli mở `“` ở **15 khoá** (`1.1`, `3.1`, `4.1`,
    `5.1`, `6.1`, `7.1`, `9.1`, `10.1`, `11.1`, `12.1`, `13.1`, `14.1`, `15.1`, `17.1`, `18.1`) và đóng `”` ở
    **15 khoá** (`2.4`, `3.4`, `4.4`, `5.4`, `6.4`, `8.4`, `9.4`, `10.4`, `11.4`, `12.4`, `13.4`, `14.4`, `16.6`,
    `17.4`, `18.6`); Việt cùng 15 + 15 khoá, cùng vị trí. Nháy đơn `‘’`: Pāli **0** khoá, Việt **0**.
    Các khoá `3.4`, `4.4`, `8.4`, `10.4`, `14.4` là câu hỏi nên Việt kết `?”` thay cho `”.` của Pāli;
    `14.2` Pāli kết `;` nhưng là câu hỏi nên Việt kết `?`; `19.4` Pāli kết `.`, Việt kết `:` vì khoá kế tiếp
    (`20.1`–`20.4`) là nội dung được thuyết giảng; ngoài ra mọi khoá khác kết cùng dấu với Pāli.
  · (3) Pāli trùng nguyên văn trong bài: **5 nhóm** (10 khoá), bản Việt khác **1 nhóm** (đã giải thích
    ở trên). Phép **có đo được**.
  · (4) Dấu lược: Pāli có `…` ở **1 khoá** (`22.1`, **2** dấu); Việt cũng **2**, lệch **0**. Mở
    rộng lược (Pāli không có `…` mà Việt có): **0**. `… cho đến …`: **0**. `(…)` trần: Pāli **0**
    khoá, Việt **0** (ở bài này không có khoá nào mang `(…)`, nên điều khoản giữ nguyên `(…)` không
    áp dụng). Pāli kết `….` ở `22.1` ⇒ Việt kết ` ….`.
  · (5) Số Pāli, thêm NFC, khoá rỗng, khoảng trắng: chưa NFC **0**; khoá rỗng **0**; khoảng trắng
    thừa hoặc hai dấu cách **0**; Pāli lọt sang Việt chỉ là tên riêng/tên kinh (`Cāpā`, `Kāḷa`, `Nāḷā`,
    `Nerañjarā`, `Kāsi`, `Therīgāthā`) và tên cây (`takkārī`, `pāṭali`), giữ nguyên có chủ đích.
    `0.1` (*Therīgāthā 13.3*) trùng nguyên văn Pāli có chủ đích, như các khoá `:0.1` khác trong tầng.
  · **Số Pāli** — tự tính: `Vīsati` = 20 ⇒ *Hai Mươi* (`0.2`, theo `thig13.1:0.2`); `catubbhāga` =
    catu 4 + bhāga *phần* ⇒ *một phần tư* (`6.1`); `aṭṭhaṅgika` = aṭṭha 8 + aṅga ⇒ *tám chi phần*
    (`20.3`); `tisso vijjā` = tisso 3 ⇒ *ba minh* (`21.5`). Công cụ đo số chuẩn của kho không theo dõi
    cụm nào có trong bài này nên ở đây không đo được gì; số do tôi tự tính như trên.
  · Đọc cặp Pāli↔Việt từng khoá (94/94 in ra đọc đối kháng): không có khối nào mang nội dung của khối
    bên cạnh; mười sáu lượt lời (`1`–`2` Kāḷa độc thoại, `3` Cāpā, `4` Kāḷa, `5` Cāpā, `6` Kāḷa, `7`–`8` Cāpā,
    `9` Kāḷa, `10` Cāpā, `11` Kāḷa, `12` Cāpā, `13` Kāḷa, `14` Cāpā, `15`–`16` Kāḷa, `17` Cāpā, `18` Kāḷa)
    khớp các cặp nháy kép; `19`–`21` là lời kể, không có nháy.

