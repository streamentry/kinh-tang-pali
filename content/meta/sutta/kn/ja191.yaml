notes: |-
  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG. `_hvi.kiểm` chỉ quét `cần` = khoá Pāli ≥ 40 ký tự. Ở 16/17 bài của lát này khoá Pāli dài nhất chỉ 19–35 ký tự nên `cần` rỗng và vòng chốt NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG CHẠY LẦN NÀO. Tôi tự quét lại **164/164 khoá** bằng chính các hàm đó (`_chk_rv3.py`): 0 lỗi — không khoá rỗng, không khoá thừa so với Pāli, không thiếu khoá, mọi chuỗi NFC, số dấu lược khớp Pāli từng khoá, ngoặc kép cân trên cả bài, ngoặc tròn cân, không còn `(…)`, không còn sót `pe…`. Chỉ `mil3.1.7` có 4 khoá ≥ 40 ký tự (`:1.2`–`:1.5`) nên ở bài đó chốt thật sự có chạy. `save_vi` chạy sạch, chạy lại hai lần idempotent.

  COVERAGE — ĐO BẰNG CHÍNH HÀM CỦA KHO (chỉ đọc, `englishCoverageFor`). Cả **17/17 bài ra `ratio = 1`**: 16 bài có `substantiveSegments = 0` vì không khoá Pāli nào đủ 40 ký tự; `mil3.1.7` có 4 khoá substantive. Không bài nào rơi dưới ngưỡng 0,8 nên **không** cần mục trong `content/meta/reference-gaps.yaml` — tệp đó tôi không đụng tới.

  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho bất kỳ bài nào trong lát này. Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là **Pāli + English Sujato + các bài song song trong chính tầng này**.

  KỸ THUẬT. Tôi KHÔNG chạy `npm run validate|test|build|check` — đợt này người điều phối cấm và chạy tập trung. Vì vậy `technical_integrity` chấm **9.6 chứ không phải 10.0**; đó là hạn chế thật của lượt đánh giá này chứ không phải lời khen. Tất cả những gì chạy được thì đã chạy.

  **BLOCKER: THIẾU TẦNG THAM KHẢO ANH.** `source/upstream-manifest.json` (tầng `english-sujato`, 4.291 tệp) **không** có `sutta/kn/ja/ja191*`; `ls .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/ | grep ja191` rỗng. `not-published-upstream`, không phải cache chưa tải. Tôi đặt `draft` và không tự nâng điểm.

  **`ruhaka` = DÂY CUNG — VÀ `0.3` TÔI CỐ Ý LỆCH VỚI 4 BẢN ĐÃ CÓ.** Blurb của chính SuttaCentral cho `ja191` là **Even a broken bowstring**: đó là câu dịch nghĩa đúng ba chữ Pāli đầu bài kệ. Nghĩa là `ruhaka`/`roha` là **dây cung**, không phải thằn lằn. Bốn bài cùng phẩm đã `published` (`ja195`–`ja198`, `0.3` = `Ruhakavagga`) lại ghi *Phẩm Thằn Lằn* — không nơi nào trong kinh điển `ruhaka` là thằn lằn. Tôi dùng **Phẩm Dây Cung** và ghi lệch ở đây để biên tập quyết một lần cho cả phẩm rồi sửa `ja195`–`ja198` theo. Đây là nơi tôi **không** theo đa số, vì đa số sai theo Pāli.

  **BẤT ĐỊNH ĐÃ GHI — `1.2 jiyā`.** `jiyā` nằm trong một chuỗi ghép không có ở đâu khác. Tôi đọc là **dây** (chuỗi/dây để buộc, ghép lại được) vì (i) `2.3 Aññaṁ jiyaṁ karissāmi` = *tôi sẽ làm một sợi dây nữa* — `karissāmi` là *tôi sẽ làm*, nên nó là thứ được chế tạo, và (ii) `2.1–2.2` khoe *trong những kẻ khéo tay với dây / khéo tay với nghề* — người thợ làm dây. Nhưng `jiyā` cũng được đọc là *còn sống*; nếu đúng thì `1.2` phải là *miễn còn sống*. Hai cách đều làm câu đọc được, và cách tôi chọn có cơ sở trong chính kệ. Tôi hạ `ambiguity_integrity` vì lý do này.

  **`Sandhīyassu purāṇiyā` / `alaññeva purāṇiyā`.** `purāṇi` = *người lớn tuổi* (PED: bà lớn tuổi / người vợ cũ). Blurb của SuttaCentral nói câu chuyện nói về *sức cám dỗ từ người vợ cũ*, nên tôi giữ *người lớn tuổi* thay vì dịch thành *mẹ* (có thể đúng ở truyện khác) — và tránh *bà già* vì sắc. `mā kodhassa vasaṁ gami` = *đừng để cơn sân chế ngự* — `mā` là mệnh lệnh cầu nguyện, không phải phủ định mô tả.

  **`0.2 Dukanipāta`** — xem `ja177.yaml`: tôi dùng *Bộ Hai Bài Kinh* (đúng `duka` = hai), lệch với 26 khoá *Tập Kẻ Đau Đớn`.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja191:0.3` mang Pāli `Ruhakavagga` được
  đổi *«Phẩm Dây Cung»* → *«Phẩm Dây Leo»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  tầng tên **không có** mục này; quyết bằng song ngữ Pāli **trong chính phẩm** — `ja191:1.1–1.3`: `"Api ruhaka chinnāpi, / jiyā sandhīyate puna;"` (dây bị cắt, sợi dây vẫn ghép lại), và bản Việt đã có *"Dây cung … sợi dây …"*. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  Lượt cải thiện 2026-10-13 (đọc đối kháng từng khoá; đổi 10/13 khoá; điểm cũ → mới):

  1. LỖI NẶNG ĐÃ SỬA — `2.1–2.2` (accuracy fix). Bản cũ: *"Trong những kẻ khéo tay với dây, trong những kẻ khéo tay với nghề"*. Pāli là hai mệnh đề định vị tuyệt đối `Vijjamānesu vākesu, vijjamānesu kārisu` = *"khi còn có … , khi còn có …"* — không có chữ nào là *"khéo tay"*, và `vākesu` là *sợi vỏ cây* (vật liệu), không phải người. Tiền lệ cùng dạng trong tầng: `ja314:1.3 Vijjamānesu bhogesu` → *"Dù có tài sản dư dả"*, `tha-ap484:9.3 Ubhosu vijjamānesu` → *"Khi cả hai đều hiện có"* (2/2 cách đọc định vị tuyệt đối). Nay: *"Khi còn có sợi vỏ cây, / khi còn có người chế tác;"*. → `semantic_fidelity` 8.6 → 8.8, `grammar_logic` 8.5 → 8.9.
  2. `jiyā` / `jiyaṁ` = **dây cung**, không phải *"sợi dây"* chung chung (accuracy + terminology fix; `1.2`, `2.3`). Căn cứ đếm được: cả 3 nơi khác trong Pāli root có `jiyā/jiyaṁ` đều là dây cung — `mn63:5.21` (Sujato: *bow-string*, kho Việt: *dây cung*), `dn23:16.10` (Sujato: *strangle him with a bowstring*, Việt: *dây cung*), `ja397:1.2` (Việt: *dây cung*): 3/3. Bất định cũ *"jiyā có thể là còn sống"* nay đóng: không nơi nào trong tầng dùng `jiyā` theo nghĩa đó. Đóng được cả hai cách đọc cũ là nhờ `2.3 Aññaṁ jiyaṁ karissāmi` (làm ra một sợi khác).
  3. `purāṇiyā` (`1.3`, `2.4`) là tính từ **giống cái *cũ***, đồng giống với `jiyā`, không phải *"người lớn tuổi"* (accuracy fix). Căn cứ: `thag1.57:1.1 Ayamāhu purāṇiyā kuṭi` = *"túp lều cũ"* (tính từ giống cái); cú pháp `sandhīyassu purāṇiyā` (nối với …, cách công cụ) và `alaṁ … purāṇiyā` (`alaṁ` + cách công cụ = *đủ rồi với …*) đều khớp với *dây cung cũ*. Bản cũ lại dịch `alaññeva purāṇiyā` thành *"đúng y như người lớn tuổi"*, tức đọc `alaṁ` thành *"y như"* — sai nghĩa `alaṁ` (đủ). Nay: *"Hãy nối lại với dây cung cũ"* / *"đủ rồi với dây cung cũ"*. Ẩn dụ (dây cung cũ ↔ người bạn đời cũ) vẫn nằm ở chú thích, không đưa vào lời kinh. → cùng hai tiêu chí ở mục 1.
  4. `ruhaka` (`1.1`, `0.4`, `3.1`): **bỏ "dây cung"** (terminology + accuracy fix). `ruhaka` đứng trần (không đuôi `-o/-aṁ`), kèm hai động từ ngôi hai `sandhīyassu`, `gami` — tức có một người được gọi; dạng hô cách hợp ngữ pháp nhất. Nên `1.1` = *"Này Ruhaka, dù có bị đứt,"*, và tên bài = *"Kinh Ruhaka"* (giữ nguyên tên riêng như tiền lệ: 502/547 tiêu đề `…:0.4` của Bổn Sanh trong tầng có dạng *"Kinh <Tên>"*; tương tự `ja343:0.3 Cūḷakuṇālavagga` → *"Phẩm Cūḷakuṇāla"*). Dây cung là `jiyā`, một chữ khác hẳn. `translationTitle` đổi theo.
  5. `kodha` (`1.4`): *"cơn sân"* → *"cơn giận"* (terminology fix). Đếm trong tầng các khoá có `kodh-`: *giận* 354 · *giận dữ* 226 · *sân* 160 · *cơn giận* 59 · *phẫn nộ* 54 · *cơn sân* 3. Cấu trúc `mā … vasaṁ gami` giữ *"đừng để … chế ngự"* theo tiền lệ `sn9.2:3.4 mā niddāya vasaṁ gamī`. → `terminology` 8.8 → 8.9.
  6. `2.3`: *"một sợi dây nữa"* → *"một dây cung khác"* (`aññaṁ` = khác).

  CÒN BẤT ĐỊNH (không phân xử được, giữ nguyên): (a) `kārisu` (`2.2`) chỉ có đúng một lần trong toàn Pāli root, không từ điển/bản song song nào ghim trong kho để đối chiếu. Tôi đọc là danh từ chỉ người làm (`-kārī` có hàng chục lần ở vị trí hậu tố trong tầng) song song với `vākesu`, nhưng không loại được cách đọc là một thứ vật liệu thứ hai (như danh sách sợi ở `mn63:5.21`). (b) `ruhaka` là tên riêng hay một từ khác (cây leo, như tên phẩm *"Dây Leo"* mà người điều phối chọn ở `0.3`) — tôi KHÔNG đổi `0.3`, vì đó là quyết định biên tập chung của cả phẩm (`ja192`–`ja198`); nhưng xin biên tập lưu ý: nếu `ruhaka` là tên riêng thì `0.3` theo tiền lệ `Cūḷakuṇāla` nên là *"Phẩm Ruhaka"*. (c) tầng Pāli ghim không cho biết ai là người nói ở `1.x`/`2.x`; không thêm vào lời kinh. `ambiguity_integrity` giữ 8.6, `triangulation` giữ 8.0 (vẫn không có bản Anh độc lập; bản Anh `mn63`/`dn23` chỉ dùng xác nhận nghĩa `jiyā`).

  Không đổi: `source_provenance` 9.4, `segment_alignment` 10.0, `vietnamese_clarity` 8.8, `han_viet_balance` 9.0, `technical_integrity` 9.6 (vẫn không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này). Blocker thiếu tầng tham khảo Anh giữ nguyên. `final_score` mới = 90.0 / 10 = 9.00 — **đúng 9.0 không đủ `published`** nên vẫn `review`; trạng thái do công cụ chốt, không sửa tay.

  Sửa lan 2026-10-13: khoá `ja191:0.3` (`Ruhakavagga`): *Phẩm Dây Leo* → *Phẩm Ruhaka*. Căn cứ: bài đầu của phẩm chính là `ja191` `Ruhakajātaka`, tên bài đã dịch *Kinh Ruhaka* (tên riêng) và `ja191:1.1` đọc `ruhaka` là hô ngữ *Này Ruhaka*; còn `jiyā` (`1.2`, `2.3`) là *dây cung*, không phải cây leo, nên nghĩa *dây leo* cho `ruhaka` không có căn cứ trong Pāli. Tiền lệ đếm được: `ja192`–`ja198` (7/7 bài của phẩm đã sửa) dùng *Phẩm Ruhaka*; phẩm Jātaka đặt theo tên riêng của bài đầu phẩm giữ nguyên Pāli (*Phẩm Cūḷakuṇāla*, *Phẩm Kāliṅga*). BẤT ĐỊNH: nghĩa của `ruhaka` không phân xử được từ tầng Pāli đã ghim, nên chọn phiên âm để không khẳng định nghĩa. Ngoài lát này: `ja199:0.3` và `ja200:0.3` vẫn *Phẩm Dây Leo*, `ja200:3.2` (`Ruhakavaggo pañcamo`) vẫn *Phẩm Thằn Lằn thứ năm* — cần thống nhất. Ghi chú *Phẩm Dây Leo* ở trên là quyết định cũ, nay thay bằng tên này.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 3 khoá chênh lệch lớn nhất (trên 13 khoá) → khác nghĩa 0: sửa 0, giữ 2 (`0.4`: bản mù giữ *Chuyện Tiền thân*, khoá này theo mẫu `Kinh X` của cả phẩm; `1.4`: *chớ rơi vào quyền lực của sân hận* ≈ *đừng để cơn giận chế ngự*, cùng nghĩa `mā kodhassa vasaṁ gami`), bất định 1 (`2.2` `kārisu`: bản mù để nguyên Pāli kèm dấu ngờ; bản này dịch *người chế tác* từ nghĩa gốc `kāra`, không phân xử được từ Pāli đã ghim). Rà soát đối kháng toàn bài: 13/13 khoá, nháy kép khớp Pāli từng khoá, không số đếm, `jiyā` giữ giống cái (*dây cung*) nhất quán ở `1.2`, `1.3`, `2.3`, `2.4`. Không có bản Anh hay bản Việt độc lập khác. `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
