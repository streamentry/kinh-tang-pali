notes: |-
  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG. `_hvi.kiểm` chỉ quét `cần` = khoá Pāli ≥ 40 ký tự. Ở 16/17 bài của lát này khoá Pāli dài nhất chỉ 19–35 ký tự nên `cần` rỗng và vòng chốt NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG CHẠY LẦN NÀO. Tôi tự quét lại **164/164 khoá** bằng chính các hàm đó (`_chk_rv3.py`): 0 lỗi — không khoá rỗng, không khoá thừa so với Pāli, không thiếu khoá, mọi chuỗi NFC, số dấu lược khớp Pāli từng khoá, ngoặc kép cân trên cả bài, ngoặc tròn cân, không còn `(…)`, không còn sót `pe…`. Chỉ `mil3.1.7` có 4 khoá ≥ 40 ký tự (`:1.2`–`:1.5`) nên ở bài đó chốt thật sự có chạy. `save_vi` chạy sạch, chạy lại hai lần idempotent.

  COVERAGE — ĐO BẰNG CHÍNH HÀM CỦA KHO (chỉ đọc, `englishCoverageFor`). Cả **17/17 bài ra `ratio = 1`**: 16 bài có `substantiveSegments = 0` vì không khoá Pāli nào đủ 40 ký tự; `mil3.1.7` có 4 khoá substantive. Không bài nào rơi dưới ngưỡng 0,8 nên **không** cần mục trong `content/meta/reference-gaps.yaml` — tệp đó tôi không đụng tới.

  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho bất kỳ bài nào trong lát này. Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là **Pāli + English Sujato + các bài song song trong chính tầng này**.

  KỸ THUẬT. Tôi KHÔNG chạy `npm run validate|test|build|check` — đợt này người điều phối cấm và chạy tập trung. Vì vậy `technical_integrity` chấm **9.6 chứ không phải 10.0**; đó là hạn chế thật của lượt đánh giá này chứ không phải lời khen. Tất cả những gì chạy được thì đã chạy.

  **BLOCKER: THIẾU TẦNG THAM KHẢO ANH.** `source/upstream-manifest.json` (tầng `english-sujato`, 4.291 tệp) **không** có `sutta/kn/ja/ja191*`; `ls .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/ | grep ja191` rỗng. `not-published-upstream`, không phải cache chưa tải. Tôi đặt `draft` và không tự nâng điểm.

  **`ruhaka` = DÂY CUNG — VÀ `0.3` TÔI CỐ Ý LỆCH VỚI 4 BẢN ĐÃ CÓ.** Blurb của chính SuttaCentral cho `ja191` là **Even a broken bowstring**: đó là câu dịch nghĩa đúng ba chữ Pāli đầu bài kệ. Nghĩa là `ruhaka`/`roha` là **dây cung**, không phải thằn lằn. Bốn bài cùng phẩm đã `published` (`ja195`–`ja198`, `0.3` = `Ruhakavagga`) lại ghi *Phẩm Thằn Lằn* — không nơi nào trong kinh điển `ruhaka` là thằn lằn. Tôi dùng **Phẩm Dây Cung** và ghi lệch ở đây để biên tập quyết một lần cho cả phẩm rồi sửa `ja195`–`ja198` theo. Đây là nơi tôi **không** theo đa số, vì đa số sai theo Pāli.

  **BẤT ĐỊNH ĐÃ GHI — `1.2 jiyā`.** `jiyā` nằm trong một chuỗi ghép không có ở đâu khác. Tôi đọc là **dây** (chuỗi/dây để buộc, ghép lại được) vì (i) `2.3 Aññaṁ jiyaṁ karissāmi` = *tôi sẽ làm một sợi dây nữa* — `karissāmi` là *tôi sẽ làm*, nên nó là thứ được chế tạo, và (ii) `2.1–2.2` khoe *trong những kẻ khéo tay với dây / khéo tay với nghề* — người thợ làm dây. Nhưng `jiyā` cũng được đọc là *còn sống*; nếu đúng thì `1.2` phải là *miễn còn sống*. Hai cách đều làm câu đọc được, và cách tôi chọn có cơ sở trong chính kệ. Tôi hạ `ambiguity_integrity` vì lý do này.

  **`Sandhīyassu purāṇiyā` / `alaññeva purāṇiyā`.** `purāṇi` = *người lớn tuổi* (PED: bà lớn tuổi / người vợ cũ). Blurb của SuttaCentral nói câu chuyện nói về *sức cám dỗ từ người vợ cũ*, nên tôi giữ *người lớn tuổi* thay vì dịch thành *mẹ* (có thể đúng ở truyện khác) — và tránh *bà già* vì sắc. `mā kodhassa vasaṁ gami` = *đừng để cơn sân chế ngự* — `mā` là mệnh lệnh cầu nguyện, không phải phủ định mô tả.

  **`0.2 Dukanipāta`** — xem `ja177.yaml`: tôi dùng *Bộ Hai Bài Kinh* (đúng `duka` = hai), lệch với 26 khoá *Tập Kẻ Đau Đớn`.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja191:0.3` mang Pāli `Ruhakavagga` được
  đổi *«Phẩm Dây Cung»* → *«Phẩm Dây Leo»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  tầng tên **không có** mục này; quyết bằng song ngữ Pāli **trong chính phẩm** — `ja191:1.1–1.3`: `"Api ruhaka chinnāpi, / jiyā sandhīyate puna;"` (dây bị cắt, sợi dây vẫn ghép lại), và bản Việt đã có *"Dây cung … sợi dây …"*. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.
