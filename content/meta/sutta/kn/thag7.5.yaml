notes: |-
  `Sarabhaṅgattheragāthā`, bài thứ 5 của `Sattakanipāta`. 43/43 khoá. Tầng Anh đã ghim
  CÓ tệp `thag7.5_translation-en-sujato.json` (34/43 khoá có Anh); bài này **không** có segment Pāli
  ≥ 40 ký tự nên cổng coverage không đỏ, cũng không cần mục `reference-gaps`.

  **Tên phẩm theo đa số CỤC BỘ trong chính quyển (đo lại, không đo toàn `thag`):** `:0.1`
  *“Theragāthā 7.5”*; `:0.2` `Sattakanipāta` → *“Bộ Bảy Bài Kệ”* (**2/2** ở `thag7.1`/`thag7.4`,
  và 15/15 toàn tầng cho Pāli này, đo trước khi ghi lát này); `:0.3` `Paṭhamavagga` → *“Phẩm Thứ Nhất”*
  (93/106, đo trước khi ghi lát này);
  `:0.4` → *“Kệ Ngôn Của Trưởng Lão Sarabhaṅga”* (2/2 cục bộ, đã bỏ tiền tố số thứ tự mà `thag7.1`
  không có). Lưu ý để người gộp không gộp nhầm: `thag8.*` dùng *“Bộ Tám Bài **Kinh**”* (2/2 cục
  bộ) trong khi `thag7.*` dùng *“Bộ Bảy Bài **Kệ**”* — hai quy ước khác nhau trong cùng tác phẩm,
  và tôi theo đa số cục bộ của từng quyển như BRIEF_VI3 §11 yêu cầu.

  **Công thức kết bài:** `… Sarabhaṅgo thero … ` → *“… Trưởng lão Sarabhaṅga … ”* (giữ **hai**
  dấu lược như Pāli; 14/14 cặp trùng nguyên văn trong tầng). `Sattakanipāto niṭṭhito.` →
  *“Bộ Bảy Bài Kệ đã khép lại.”* — cụm *đã khép lại* theo tiền lệ `thig8.1:10.1` cho Pāli
  `Aṭṭhakanipāto niṭṭhito.`, và tên bộ theo `:0.2` của chính bài này. `Tatruddānaṁ` →
  *“Tóm tắt ở đây:”* (3/4 cặp; chỉ có 4 cặp toàn tầng).

  **Tiền lệ dùng lại nguyên văn:** `gotamena yasassinā.` → *“bởi Gotama oai danh lẫy lừng.”*
  (`an4.1:4.4`, 1 cặp). Tôi dùng lại **nguyên văn** theo luật “trùng thì khớp”, dù cách dịch này
  hơi văn-cổ; `yasassin` = *có danh tiếng rộng*, nên nghĩa không sai. `suvimutta` → *khéo giải
  thoát* (50 cặp trong tầng, dùng nhất quán). `Cattāri ariyasaccāni,` → *“Bốn Thánh đế,”*
  (`thig6.8:3.1` nguyên văn).

  **Bốn chỗ dịch theo nghĩa, không có tiền lệ (ghi lại để người biên tập xem):**
  `kuṭimacchisaṁ` (1.2) → *làm một túp lều rồi ở lại đó* (Sujato: *made a hut, and stayed
  there*; `kuṭima` là biến thể của `kuṭi`); `nāmaṁ sammutiyā ahu` (1.4) → *Sarabhaṅga, tức bậc
  bẻ lau* (`sammutiyā` = *do đặt tên*); `Vacanakarenātidevassa` (3.4) → *bậc vượt trên chư Thiên*
  (`ātideva`; tầng dùng *chư Thiên* ở hàng chục chỗ, nhưng **không** có tiền lệ riêng cho danh xưng
  này); `Tenañjasena agamāsi gotamo` (4.4) → *bậc Gotama đi con đường ấy mà đến* (`añjasena` =
  *nhanh, thẳng*; tôi không nhấn mạnh vì Sujato cũng không).

  **Kệ 3.1–3.2 giữ thế đảo của Pāli** (`Sakalaṁ samattaṁ rogaṁ, / Sarabhaṅgo nāddasaṁ pubbe`
  = tân ngữ đứng trước chủ ngữ). Tôi giữ vì `skill/translation.md` §4 cấm tự thêm/bớt cấu trúc và
  §9 yêu cầu giữ repetition, nhưng đặt `trước kia` ở giữa câu cho dễ đọc hơn bản dịch word-by-word.

  **Uddāna 8.1–8.4 tên thường bỏ tiếu tố chủ ngữ** theo 14/14 tiền lệ (`… Usabho thero …` →
  *… Trưởng lão Usabha …*), nên `Sundarasamuddo` → *Sundarasamudda*, `lakuṇḍabhaddiyo` →
  *Lakuṇḍabhaddi*, `Bhaddo` → *Bhadda*, `sarabhaṅgo` → *Sarabhaṅga*; `mahāisi` → *bậc Đại Ẩn Sĩ*
  (tiền lệ `tha-ap226:1.4` cho `mahesino`).
