notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất 30 ký tự nên `cần` rỗng. Tự quét
  9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu lược khớp, nháy kép mở 1.1 đóng 1.4 nên cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 2.1 (dòng chốt, Sujato để trống
  ở mọi bài Jātaka, 29 ký tự nên không tính coverage thân bản).

  KHUON TIÊU ĐỀ: Jātaka, Bộ Một Bài Kinh, Kinh <tên> thứ <thứ>. `Apaṇṇakavagga` → *Phẩm Bụi
  Dơ* dùng lại nguyên văn: 7 lượt ngoài lát (ja1, ja2, ja6, ja8, ja9…) so với 1 lượt lạc
  (ja5: Phẩm Những Điều Tầm Thường) — cách của ja5 đọc `apaṇṇaka` thành “tầm thường”, tôi
  không theo.

  THUAT NGUM. `serivāṇi` / `serivāya` (0 lượt) → *người bán mè kê*, theo nghĩa chữ: `seriva` là
  mè kê, `vāṇija` là thương nhân. Tôi dùng y hệt một cụm ở cả 0.4, 1.4 và 2.1 để tên bài không
  rời nhau. `saddhammassa niyāmataṁ` → *trong điều lệ của chánh pháp*: `saddhamma` dịch *chánh
  pháp* (chữ `dhamma` nằm trong danh sách phải giữ của kho), `niyāmata` là điều lệ quy định.
  `anutappesi` → *hối hận* (70 lượt).

  BA CHỖ DỄ SAI. (1) `Idha ce naṁ virādhesi` tôi dịc *Nếu ở đây ngươi lừa gian*; `naṁ` là tân
  ngữ và `virādhesi` là thứ hai số của `virādheti` (lừa dối/anh hưng), hai từ này cùng đứng
  trong một mệnh đề nên tôi không tách. (2) `serivāyaṁva vāṇijo` có thể là so sánh với người
  bán mè kê (đọc của tôi) hoặc là tên riêng; tôi theo đọc so sánh vì vế trước là lời răn đe.
  (3) `Ciraṁ tvaṁ anutappesi` là động từ ở thì tương lai, tôi dịc *sẽ phải hối hận* chứ không
  phải *đã hối hận*.

  Sujato đặt tên bài là The Wanton Merchant; tôi không dùng cách đó vì `serivāṇi` là
  thương nhân mè kê, còn “wanton” không có chữ nào trong Pāli ở đây.
