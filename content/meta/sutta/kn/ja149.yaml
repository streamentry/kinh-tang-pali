notes: |-
  Đủ 9/9 khóa. eka → một, paṇṇa → lá, rukkha → cây; tên bài Kinh Cây Một Lá
  là đặt mới. na bhūmyā caturaṅgulo giữ phủ định Pāli: chưa cao khỏi mặt đất
  bốn ngón tay. mahā ayaṁ kiṁ bhavissati → khi lớn lên nó sẽ ra sao.
  visakappa 0 tiền lệ: đọc theo mặt chữ visa là độc cộng kappa là tựa như,
  thành quả tựa thuốc độc; cách đọc khác là quả khác thường. Chưa phân xử
  được nên hạ terminology và ambiguity, giữ draft. Sujato trống cả 9 khóa,
  không có tầng Việt hiện hành cho Jātaka → Pāli đơn tuyến.
