notes: |-
  Đợt 17, lát n177. Dịch từ Pāli root commit đã ghim — không có tầng Anh
  (`source/upstream-manifest.json` không liệt kê tệp `english-sujato` cho uid, cũng không ở trong
  cache), tầng Việt hiện hành chỉ có Pháp Cú. Đối chiếu tham khảo ngoài store: bản dịch Anh
  R. Chalmers 1895 (public domain), bản Việt Tỳ khưu Indacanda (tamtangpaliviet, Jātakapāḷi tập I),
  và chú giải Jātaka-aṭṭhakathā (PTS 4.x) — chỉ dùng để phân xử nghĩa, không sao chép câu nào vào
  thân kinh.

  **Tiêu đề có tiền lệ.** `0.1` “Jātaka” giữ nguyên Pāli (đa số tệp ja); `0.2` “Bộ Mười Một Bài
  Kinh” dùng lại y nguyên ja455 (cùng Pāli `Ekādasakanipāta`); `0.3` “Phẩm Voi Hiếu Mẹ” dùng lại
  ja455 và ja460 (cùng Pāli `Mātuposakavagga`); `0.4` “2. Kinh Juṇha” theo khuôn “N. Kinh <tên>”
  của ja443 “5. Kinh Cūḷabodhi” và ja455 “1. Kinh Mātuposaka”; tầng tên SuttaCentral
  `ja-name:513` = “Prince Moonlight” (Juṇha = Trăng); `14.1` “Kinh Juṇha, thứ hai.” theo
  ja455:13.1 “Kinh Mātuposaka, thứ nhất.” (Pāli `dutiyaṁ`).

  **Phân xử điểm khó.**
  - `juṇhamhi` (1.2): đọc theo chú giải Aṭṭhakathā (“I have come here for a purpose, O Moonlight”)
    → “ta đến đây vì một việc, tâu Juṇha” — brāhmaṇa biết tên vua từ thủa ở Takkasīlā.
  - `satta gavaṁsatāni` (3.2, 12.2): “bảy trăm con bò” — hai nguồn độc lập đồng thuận: Chalmers
    “seven hundred kine”, Indacanda “bảy trăm con bò cái” (gavaṁsa = đơn vị 100).
  - `kāsipatī` (13.3): đọc là vocative “tâu Chúa tể xứ Kāsi” theo cả Chalmers (“O Lord of Kāsi”)
    và Indacanda (“tâu vị chúa tể của xứ Kāsi”).
  - `Bālāva kho` (10.1): `bāla + iva`, nhưng theo cặp đối chiếu 9/10/11 dịch là “Còn người ngu thì…”
    (Chalmers “’Tis fools…”, Indacanda “Còn những kẻ ngu…”).

  **Số Pāli — tự tính, in phép:** `pañca` = 5 làng · `dāsīsataṁ` = 100 tớ gái ·
  `satta gavaṁsatāni` = 7 × 100 = 700 con bò · `paro + sahassa` = hơn 1.000 đồng vàng ·
  `dve` = 2 vợ. Khóa 12.1–12.4 lặp lại 3.1–3.4 với `me/te` đổi ngôi, số y hệt.

  **Trùng nguyên văn nội bài:** 2 cặp (`3.2 = 12.2`, `3.3 = 12.3`) — dùng lại nguyên văn, 0 cặp
  lệch. Không có dấu lược nào trong bài (Pāli 0 `…`).

  **Bất định — ghi lại, không tự xử trong thân kinh.**
  - `Sārāṇiyaṁ vītisārayimha` (8.2): Chalmers “a friendly talk”, Indacanda “lời giao hẹn” — hai
    cách hiểu khác nhau; dịch “trò chuyện thân mật” theo nghĩa trung gian, `ambiguity_integrity` 9.0.
  - `Āpūratī kāsipatī tathāhaṁ` (13.3): ngữ pháp chấp nhận cả đọc chủ ngữ lẫn vocative; đã chọn
    đọc vocative như trên vì hai tham khảo cùng chọn.

  Kiểm: 57/57 khoá đúng tập và thứ tự Pāli; NFC, nháy kép từng khoá, dấu lược — 0 lệch;
  0 cặp trùng nội bộ bị lệch. Dấu câu dòng cuối khớp Pāli, trừ 4 chỗ chủ đích dùng dấu hai chấm
  trước câu hỏi (6.3) cho tự nhiên hơn.

