notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pe/pe9_root-pli-ms.json` (269/269 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli). Đây là phần `Suttavebhaṅgiya` (phân tích các bài kinh) của Peṭakopadesa, thuộc Trưởng lão Mahākaccāyana (63.2, 65.1). Bài là bản trình bày năm "lối" (naya) của Netti dưới dạng văn xuôi khô: lối đùa giỡn của sư tử (bốn phương), lối ba cánh sen (nhóm ba), lối vòng xoay hoan hỷ (nhóm hai), lối nhìn khắp các phương, lối móc câu.

  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho pe9: tầng `english-sujato` chỉ có chín nhánh `cp dhp iti ja kp snp thag thig ud` dưới `sutta/kn/` (755 tệp), không có thư mục `pe`; chỉ có tệp tên `pe-name_translation-en-sujato.json` (pe9 = "Analyses of Discourses") không kèm prose của bài. Đây là `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` chưa có tệp nào cho `pe`. Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú (26 tệp). Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.0 (≤ 8.0). Bài này dịch chỉ từ Pāli, từ tiền lệ thuật ngữ của chính tầng dự án (pe4, pe7 và các bài Netti `ne2`, `ne3`, `ne4`, `ne10`, `ne19`, `ne20`, `ne21`), và từ các bài kinh Nikāya mà bài trích lại (`sn15.2`, `an4.133`, `sn45.174`, `dn33`).
  - Coverage English:
    Mẫu số = 183 khoá Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`). Sujato phủ 0/183 (0/269 khoá tổng); coverage English 0%, dưới ngưỡng, nên bài chưa thể `review`/`published`; `reference-gaps.yaml` có entry cũng không cứu được `published` (ngoài phạm vi lát này, không chạm). Không có cách đọc English độc lập nào cho bài này.
  - Tiền lệ cùng bộ (`pe`, `ne`):
    `0.1` "Peṭakopadesa" dùng lại nguyên văn của `pe4:0.1` và `pe7:0.1`. `0.2` `Suttavebhaṅgiya` → "Phần Phân Tích Kinh": `vebhaṅgiya` theo `vibhaṅga` "phân tích"; "Phần" theo "Phần Giải Thích" của `pe7:0.2` và `ne*:0.2` (`niddesa`); tên Sujato "Analyses of Discourses" khớp hướng này. Khoá này không mang số thứ tự (Pāli không có), khác `pe4:0.2` có "4.". Hai khoá kết `63.2`–`63.3` và `65.1`–`66.1` đi cùng nhịp "tên chương rồi tên tác giả" của `pe4:13.1` và `pe7:11.1`.
    Năm lối: bài Netti `ne2` (đã có trong kho, đang `draft`) dịch năm tên này là "tuyên thuật làm vui lòng / chất đống ba tầng / đánh bóng như sư tử / soi như gương / cây gai đẩy" (4 khoá: `6.2`, `8.1`–`8.3`, `9.1`, `9.3`), còn `ne3` và `ne4` (cùng đợt dịch, chưa vào kho chính) dịch "vòng xoay hoan hỷ / ba cánh sen / đùa giỡn của sư tử / nhìn khắp các phương / móc câu" (5 khoá: `ne3:18.4`, `19.4`, `20.4`, `21.4`, `22.4`, `ne4:27.1`). Bài này theo `ne3`/`ne4` vì sát chữ hơn (`nandiyāvaṭṭa` "vòng xoay", `tipukkhala` "ba cánh sen", `sīhavikkīḷita` "đùa giỡn của sư tử", `disālokana` "nhìn khắp các phương", `aṅkusa` "móc câu") và đúng với cách Peṭakopadesa dùng "lối" cho `naya` (`ne3:26.1` "ba lối"). Nếu người biên tập chốt theo `ne2`, đổi ở cả `ne2` và bài này (31 khoá ở pe9 có tên các lối). `naya` → "lối" (cùng `ne2:6.1` "lối kể", `ne3`, `ne4`).
    Không có `hāra` trong bài này (nên không dùng "phương thức" của `ne21`–`ne35`).
  - Pāli trùng nguyên văn:
    Dò Pāli của 269 khoá với toàn bộ Pāli đã ghim (dn, mn, sn, an, kn): 13 khoá có Pāli trùng ở bài khác. Trong đó có bản Việt ở phía kia: 9 cặp (`0.1` với `pe4:0.1` và `pe7:0.1`; `55.1`, `55.2`, `55.4`, `56.4` với `ne2:12.1`, `12.2`, `12.4`, `13.4`; `59.3`, `62.2`, `62.3` với `ne3:19.3`, `22.2`, `22.3`). Dùng lại nguyên văn 6 cặp (`0.1`; `55.4` "là vùng đất của phiền não, chín nền tảng."; `56.4` "là vùng đất của các căn, chín nền tảng."; `59.3`; `62.3`). Bản Việt khác 3 cặp, đều có lý do: `55.1` "Ái và vô minh," (so `ne2:12.1` "Tham và vô minh," — `ne2` dịch `taṇhā` là "tham" và `lobha` là "tham lam", còn ở bài này `taṇhā` phải khác `lobha`/`rāga` vì `51.4`, `52.5` có `taṇhā ca lobho ca` cạnh nhau, nên `taṇhā` → "ái", `lobha`/`rāga` → "tham" theo `pe7:1.7`); `55.2` "tham, sân, và si nữa;" (so "tham lam, sân, và si mê nữa;" — cùng lý do, `lobha` "tham" 189/193 khoá so "tham lam" 25); `62.2` chỉ khác ở dấu `;` cuối khoá để khớp Pāli. Năm khoá khác có Pāli trùng ở bài khác nhưng bài kia chưa có bản Việt (`30.3` với `ne36:56.3`; `55.3`, `56.3`, `57.2` với `pe1`; `54.1` với `pe1`, `pe2`, `pe3`): không đối chiếu được. `55.3` "và bốn sự đảo lộn," đặt cạnh `ne2:12.3` "Bốn sự đảo ngược," (Pāli khác: `Cattāro` so `Caturo`) và đổi sang "đảo lộn" theo đa số tầng (33 so 20 "sai lệch", 4 "điên đảo", 3 "đảo ngược" trên 61 khoá có `vipallāsa`).
    Trong chính bài: 3 nhóm Pāli trùng nguyên văn (`16.2` và `23.2` "Ayaṁ paṭhamā disā."; `18.2` và `25.2` "Ayaṁ tatiyā disā."; `38.1` và `47.1` "Tattha katamo kusalapakkho?"), cả ba nhóm bản Việt giống nhau; 0 cặp bản Việt khác.
