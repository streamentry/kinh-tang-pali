  khác, nên không có đoạn song song cho `2.4`, `64.5`. Kết quả: không khoá nào phân xử được có căn cứ
  kiểm lại được, nên GIỮ nguyên văn cả mười một khoá trong blocker. Căn cứ từng khoá: `2.4` `tassa`
  không có tương quan, không đoạn song song; `11.2` `ne36:15.2`–`15.3` là "Kuto ca vuccati āsavantīti?
  Anusayato vā pariyuṭṭhānato vā" (hỏi nguồn chảy rỉ), còn pe9 viết `Kiñci pana vuccati vippaṭisāro`
  rồi `Ye vippaṭisārā te anusayā` (đồng nhất hối hận với tùy miên): hai bản khác hẳn nhau, không chứng
  minh được chữ nào hỏng nên không sửa; `14.4` ghép sân–thọ, si–tưởng, kiến–hành, ngược `18.1`
  (kiến–tưởng) và `19.1` (si–hành) và `15.2` (kiến–sợ hãi, si–si mê); `ne36:18.2` cùng cặp với `14.4`
  nhưng dùng `mānasallo` (ne36:26.1 ghép `mānasallo` với `saññūpagā`), nên Pāli đã ghim tự mâu thuẫn,
  bản Việt giữ đúng chữ từng khoá; `20.1` `pañcannaṁ dasannaṁ` (19.2 và `ne36:24.1`–`27.1` chỉ có
  `dasannaṁ suttānaṁ`, không ai giải thích "năm"); `45.3`, `64.2`, `64.4`, `64.7` câu vỡ ngữ pháp,
  không có song song; `51.7` `na paviṭṭhā` trái `53.12`–`53.15` (đi vào một lối), có thể thừa chữ phủ
  định nhưng không chứng minh được; `52.3`–`52.4` `amoho` lặp lại và `lobho ca doso ca` trong danh
  sách thiện, đối chiếu `51.2`–`51.3` (nhóm chỉ: samatho, alobho, adoso, asubhasaññā, dukkhasaññā) cho
  thấy chữ hỏng nhưng chỉ là phỏng đoán. Chưa tra PED cho `avikosanā` (không thấy mục trong lượt này);
  không ghi trang PED. Bất định: toàn bộ các khoá trên.

  Quyết định hội đồng biên tập 2026-10-16: B3 — `24.1` (`iddhipāda` = “như ý túc”).

  Nghiên cứu nguồn ngoài 2026-10-16: Ñāṇamoli, The Piṭaka-Disclosure (Peṭakopadesa), PTS 1964, https://ancient-buddhist-texts.net/Reference/PTS/Nyanamoli-Pitaka-Disclosure.pdf (bản scan, đọc qua OCR của người làm; còn bản quyền PTS; chỉ làm bằng chứng nghĩa); Indacanda, Peṭakopadesa song ngữ, https://tamtangpaliviet.net/TTPV/ttpv_44_Pet.pdf (NOASSERTION; chỉ làm bằng chứng nghĩa; lưu ý Indacanda có chỗ nhận hiệu đính của Ñāṇamoli nên không hoàn toàn độc lập với PD); đã đối chiếu các khoá nêu trong blocker Pāli ghim hỏng với chú thích hiệu đính của Ñāṇamoli (cuối mỗi chương) và với Indacanda ở một số chỗ; chưa đọc song song toàn văn. Theo chính sách hội đồng (mục D) chỉ dùng nguồn để hiểu NGHĨA chữ ghim hỏng: không sửa Việt theo dị bản hay chữ Pāli suy đoán, không gỡ blocker Pāli hỏng; nghĩa các chữ ghim hỏng theo nguồn: `2.4` và `64.7` hai đầu của một câu bị tách bởi đoạn xê dịch (§985–994 của Ñāṇamoli, xem pe8) cần ghép lại; `11.2` đọc theo S được trích; `14.4` đối chiếu `mohasalla` ở Netti tr. 116; `16.1`/`19.1`/`52.3` kệ `yo neti vipallāsehi kilese` đọc theo Netti; `20.1` câu hỏng, ý: mười cặp khởi đầu cùng chỉ một nghĩa, đó là phương thứ nhất ở phía đen; `52.4` thiếu tính từ `hīnesu akusalesu` đối ứng `paṇītesu kusalesu`; `64.2`, `64.4` đọc `niddissanti`/`niddissati`; `64.5` `avikosanā`/`avikkhepanā` hai chữ chắc cùng một (có thể `avikopanā`); sửa không có; bất định mọi khoá trong blocker, đặc biệt `2.4`, `20.1`, `64.7`.
  Lượt gỡ «chưa phân xử» 2026-10-17 (Claude Opus 5.5, thí điểm; theo docs/editorial-council-2026-10.md mục E và docs/editorial-decisions-2026-10-17.md §5.1): 12 locus trong blocker Pāli ghim. GỠ 6: `2.4` đọc theo chữ ghim, DPD tassa 4 bất biến từ «regarding that» đứng đầu câu (bản Việt «về điều ấy» giữ nguyên); `11.2` đọc theo chữ ghim, kiñci đại từ bất định, câu đủ ngữ pháp, ne36:15.2–15.3 khác hẳn nên không phải song song (giữ nguyên, có chú thích); `14.4` mỗi khoá đọc được và theo đúng thứ tự 12.2–13.3 (vô minh thứ ba, kiến thứ tư), khác 18.1–19.1 theo thứ tự 11.4: khác biệt của chính văn bản, bản Việt giữ đúng chữ ghim; `20.1` theo câu song song ne36:24.1 (published) và 19.2: chỉ «mười bài kinh», bỏ «năm» không có chỗ chỉ tới, theo tiền lệ ps2.9:21.14; `45.3` đọc theo chữ ghim, paṭipakkhe là vế sau của mỗi cặp trong phần đen (44.1, 45.1, 49.1–49.2), sửa «phía đối nghịch» thành «vế đối nghịch» để khỏi hiểu là phần thiện; `64.7` đọc theo chữ ghim, DPD nāssa 1.1 cách khả năng «would not be» (Dhp 124), «tuệ như vậy sẽ không có», atthi mở câu sau, thay cách đọc đại từ «đối với nó» không có tương quan. KHÔNG GỠ 6: `51.7` na paviṭṭhā trái 53.14–53.15, không dị bản, không câu song song cùng câu, bỏ «na» là phỏng đoán; `52.3`–`52.4` amoho lặp và lobho ca doso ca trong danh sách thiện (4+4+2 ≠ 9), hỏng có chứng minh nhưng không dị bản, không song song; `64.2` bhavabhūmi và niddisati chủ động với chủ ngữ attho, DPD chỉ tách máy, không song song; `64.4` natthibhūmi niddisituṁ, aṭṭhavīsatibhāgehi, không song song; `64.5` avikosanā không có trong DPD (gần nhất avikopana), không dị bản. Lớp dị bản pe9 tại commit ghim chỉ có 11.3 (pts-vp-pli1, mr «yo vippaṭisāro»), không khoá nào trong 12 locus. Đổi 3 khoá (20.1, 45.3, 64.7); chú thích 6 khoá ở content/comment/vi/project/sutta/kn/pe9_comment-vi-project.json. Không đổi status, quality, blocking_errors.
  Lượt hai §5.6 (BJT) 2026-10-17 (Claude Opus 5.5; docs/editorial-decisions-2026-10-17.md §5.6): 6 locus còn treo trong blocker (51.7, 52.3, 52.4, 64.2, 64.4, 64.5). GỠ 1: `64.4` theo BJT (tipitaka.lk p330; Tam Tạng Pāli–Việt tập 44 tr. 330, bản Việt Indacanda tr. 331), đọc «natthi bhūmi niddisituṁ.» tách hai chữ và chấm câu thay chữ ghim «natthibhūmi niddisituṁ,»; đọc ra được theo DPD (natthi 1, bhūmi 3 «grounds; basis», niddisituṁ, avacarati «moves in a certain domain»); nguồn giải nghĩa: Indacanda dịch câu đầu cùng cách; Ñāṇamoli chú 1113/4 dẫn chú giải (Cy.) đọc «aṭṭhavīsati bhūmibhāgehi», cũng để natthi đứng riêng; còn bất định câu sau (Indacanda đánh (?)); đổi khoá 64.4, chú thích tại khoá. KHÔNG GỠ 5, vì BJT trùng chữ ghim ở chữ hỏng và BJT/TTPV không có cước chú dị bản Ma, Syā, PTS: `51.7` (p324, «ekaṁ nayaṁ na paviṭṭhā»); `52.3` (p324, BJT tự đánh «amoho (?)»); `52.4` (p324, «lobho ca doso ca»; Ñāṇamoli 1104/2–3 ghi chữ đúng thiếu trong mọi bản, sửa chỉ là phỏng đoán, Indacanda cũng chỉ sửa trong ngoặc khi dịch); `64.2` (p330, BJT đánh «kusalesu (?)», chỉ khác chấm câu; Ñāṇamoli 1113/1–2 dẫn Bb. v.l. và Cy. «visuddhesu», «vibhajjamānā'ssa», không phải BJT nên ngoài §5.6); `64.5` (p330, BJT «avikosanā (?)», chỉ tách «yathā, niddiṭṭhassa»; Ñāṇamoli 1114/2 cho là cùng chữ với avikkhepanā ở 64.7). Ghi thêm: chú «read niddissanti» của Ñāṇamoli (1114/1) thuộc §1114 tức 64.6–64.7, không phải 64.2/64.4 như mục nghiên cứu nguồn 2026-10-16 ghi; ở 64.7 (đã gỡ lượt một theo chữ ghim) BJT đọc «paññā. nāssa natthi», cước chú TTPV ghi Ma «paññā nāssa atthi», PTS «paññā n'assa atthi», tức Ma và PTS trùng chữ ghim, không đổi. Không đổi status, quality, blocking_errors.
  Lượt ba §6.2–§6.3 (2026-10-18, Claude Opus 5.5): đối chiếu Indacanda TTPV 44 toàn bài; đọc cả 269 khoá (66 đoạn Pāli 1.x–66.x) cạnh bản Pāli BJT và bản dịch Việt của Bhikkhu Indacanda (tr. 308–331), phân xử mỗi chỗ khác nghĩa bằng Pāli ghim (DPD, ngữ pháp, câu song song); Ñāṇamoli (PTS 1964) chỉ dẫn tên cách đọc. Sửa 6 khoá: `2.1` phạm vi phủ định trong hợp từ (an- + uppādavaya; DPD uppādavaya là dvanda; ne10:5.3, pe6:32.2; mạch 1.3 mandavipassakā): «không thấy sự sinh và diệt» thay «thấy sự không sinh và sự hoại diệt»; `13.1`–`13.2` vị ngữ của «vuccanti» là «sallāti», không phải «anusayasahagatā» (12.1 cùng khuôn, câu song song ne36:17.1 đã published, BJT p312 cùng chữ; dấu chấm ghim là dấu câu của người biên tập, cách xử như ja545): câu Việt nối qua hai khoá, nên `13.1` không có dấu cuối và `13.2` mở bằng chữ thường; `20.1` vế đầu là câu danh từ với chủ cách «disāvilokanā» và công cụ cách chỉ phương tiện (như 19.2), thay câu tồn tại «Do bốn sự đảo lộn … có sự nhìn các phương»; `46.2` dịch «iti» («Như vậy, đây là tập và đây là khổ»), câu trước lặp «đây là khổ» không có chữ nối nên tối nghĩa; `64.2` đặt chữ bổ «[điều]», «[được]» trong ngoặc vuông theo §6.2. Phán theo §6.2 (bất định có chú thích) cả 5 locus còn trong blocker: `51.7`, `52.3`, `52.4`, `64.2`, `64.5`; đã thử lại mọi nguồn (chữ ghim, câu song song, lớp variant tại commit ghim không có mục nào ở các khoá này, BJT p324/p330 trùng chữ ghim và không có cước chú dị bản), không gỡ mới được locus nào; mỗi khoá có chú thích nêu chữ ghim, BJT/TTPV, vì sao không gỡ được và các cách hiểu khả dĩ. Thêm chú thích `36.3` (BJT, Indacanda, Ñāṇamoli đọc «akusalapakkhe»; không phải locus §5.6 nên giữ chữ ghim «kusalapakkhe»). Các chỗ Indacanda khác vì đọc theo BJT (9.3 viparītaṁ, 23.1, 24.1 tapo, 53.13 niddiṭṭhe, 58.3 saccesu, 59.1–60.4, 61.3 manasā, 64.7) giữ chữ ghim. Không đổi status, quality, blocking_errors. Bảng phân xử: scratchpad dec/pe3_pe9.tsv.
  Sau kiểm độc lập lượt ba 2026-10-18 (người kiểm khác người làm): tự mở lại Pāli ghim, Digital Pāḷi Dictionary, BJT (tipitaka.lk p312, p318, p324, p330), Indacanda TTPV 44 (tr. 309–331) và tên cách đọc của Ñāṇamoli; xác nhận đúng cả 6 khoá sửa (2.1, 13.1–13.2, 20.1, 46.2, 64.2) và chú thích 36.3 (giữ chữ ghim kusalapakkhe). Thêm một sửa nhỏ: 52.4 «ba gốc thiện» thành «ba [gốc] thiện» (chữ bổ tại locus §6.2, theo 52.7 kusalamūlesu); chú thích 64.5 nói rõ «không bị phá vỡ» là cách hiểu chữ hỏng (đổi một chữ cái), không phải nghĩa đã xác lập. Cả 5 locus còn trong blocker (51.7, 52.3, 52.4, 64.2, 64.5) đạt §6.2: đã thử chữ ghim, câu song song, lớp variant tại commit ghim, BJT/TTPV (trùng chữ ghim, không cước chú dị bản); không thấy cách gỡ nào đủ §5.1/§5.6. Không đổi status, quality, blocking_errors.
  Lượt hoàn thiện theo lời phê chấm lại 2026-10-18 (Claude Opus 5.5; thi hành lời phê của báo cáo chấm lại toàn bài cùng ngày, theo docs/editorial-decisions-2026-10-17.md §5.2): sửa 27 khoá, thêm 5 chú thích. (1) Đồng vị ngữ «lobho/doso/moho akusalamūlaṁ … samuṭṭhitaṁ» (samuṭṭhitaṁ trung tính hợp với akusalamūlaṁ): 34.1, 34.3, 35.1, 35.2, 36.1, 36.2 «tham là gốc bất thiện đã khởi lên…» → «tham, gốc bất thiện, đã khởi lên…»; 33.1 là câu định nghĩa trong danh sách nên giữ. (2) 2.13 «Chỉ do» → «Chính do» (eva nhấn mạnh); 2.12 nissanda «dòng tuôn chảy từ đó» → «hệ quả ấy» (DPD nissanda 1 «result; outcome; consequence»; Indacanda tr. 309). (3) upekkhāṭhāniya «ở vào chỗ của xả» → «đáng đem lại xả» (DPD upekkhāṭṭhāniya «serving as a basis for equanimity»; mn140:10.3, an3.61:12.4 đã published): 34.2, 36.2, 36.3. (4) Thuật ngữ theo câu song song đã published: neyya «cần được dẫn dắt» → «cần được giáo đạo» (30.5, 30.6, 30.7, 31.1, 43.1; ne4:29.6, ne36:56.5–58.4); vihāra «trú» → «sự an trú», adhiṭṭhāna «ý lập» → «sự quyết định» (saccā-/cāgā-/paññā-/upasamādhiṭṭhāna «về sự thật / về xả bỏ / về tuệ / về an tịnh»), acchariya abbhuta dhamma «pháp kỳ diệu, hy hữu» → «pháp hy hữu vi diệu» (21.2, 22.1, 23.1–26.1, 27.2; ne36:32.1–42.1, 53.5–53.8); idaṁsaccābhinivesa ở 10.4, 19.1 «chỉ điều này là sự thật» → «đây là sự thật» như 11.4, ne36:11.10–28.6 và mnd4/mnd10/mnd13; yojanā 27.1, 27.2 «sự phối hợp» → «sự kết hợp» như 53.23 và yujjati/yojetabba «được kết hợp» cả bài. Còn lệch cấp kho: pe7:10.5 và mn140 (đã published) dùng «ý lập» cho adhiṭṭhāna, dn33 «quyết định»; để người biên tập chốt. (5) 60.3 «Dhamme» đọc đối cách số nhiều, tân ngữ của neti (ne3:20.1–20.2 đã published, BJT TTPV 44 tr. 328, Indacanda tr. 329, Ñāṇamoli chú 1112/4): «trong các pháp» → «dẫn các pháp;», 60.2 «;» → «,»; có chú thích 60.3. (6) Chú thích mới: 2.9 (abhinipātā xuất xứ cách hay chủ cách số nhiều; Indacanda, Ñāṇamoli 1043/3–4; giữ bản dịch), 24.1 (BJT «tapo ca», ne36:36.1/40.1 «tapo», Ñāṇamoli 1073/1; giữ chữ ghim «bốn như ý túc»), 49.1 cho 49.1–49.3 (Ñāṇamoli 1100/1–2 đảo paṭhama/dutiya; giữ chữ ghim), 59.1 cho 59.1–59.2 (khác BJT và ne3:19.1–19.2; giữ chữ ghim). Không xử lý: chandasamādhi «định do ý muốn» (ne36 «định do dục») giữ theo pe7:10.2 đã published, vì «dục» trong bài là kāma; «lối» cho naya/paṭipadā/peyyāla/desanā và «suy tầm» cạnh «tầm» giữ theo ne3, ne4, ne36, mn140, an3.61. Không đổi locus §6.2, status, quality, blocking_errors. Bảng: scratchpad dec/polish_pe9.tsv.
