notes: |-
  Đợt 19, làn 51. Dịch từ Pāli root commit đã ghim, đủ 69/69 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; vì vậy người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung kệ (xem bất định 8).

  **Tiêu đề.**
  - `0.2` `Pakiṇṇakanipāta` → “Bộ Tạp Tập” và `0.3` `Sālikedāravagga` → “Phẩm Ruộng Lúa” (`sāli` lúa + `kedāra` ruộng): tầng có 0 tiền lệ cho cả hai (chưa có Jātaka nào của bộ Pakiṇṇaka trong tầng Việt). “Bộ …” theo khuôn các nipāta đã dịch (“Bộ Mười Ba Bài Kinh”, “Bộ Bốn Bài Kinh”…) nhưng vì Pakiṇṇaka không đặt theo số nên dùng nghĩa “tạp, hỗn hợp”; xin người điều phối quyết một lần cho tên bộ này và tên phẩm.
  - `0.4` “7. Kinh Năm Vị Giữ Trai Giới”: `pañca` = 5, `uposathika` = người giữ trai giới; khuôn “N. Kinh <tên>” theo `ja474:0.4`, `ja475:0.4`. Số `7.` ở `0.4` và `sattamaṁ` ở `17.1` đều là 7 ⇒ “thứ bảy” khớp. `17.1` “Kinh Năm Vị Giữ Trai Giới, thứ bảy.” theo `ja474:14.1` (có dấu phẩy trước số thứ tự). Chữ “vị” trong tên gọi chung năm hành giả gồm cả loài vật và vị ẩn sĩ; đây là cách đặt tên gọi, không có chữ “vị” trong Pāli.

  **Pāli trùng nguyên văn trong chính bài (đã quét sau khi nén khoảng trắng): 69 khoá, 3 nhóm.**
  - `1.3` = `4.3` = `7.3` = `11.3` (“Khudaṁ pipāsaṁ adhivāsayanto,”): bản Việt giống hệt nhau “chịu đựng đói và khát,” (4 khoá, 0 lệch).
  - `3.3` = `6.3` = `10.3` = `13.3` = `16.3` (“Tasmā ahaṁposathaṁ pālayāmi,”): bản Việt giống nhau ở bốn khoá `3.3`, `6.3`, `10.3`, `13.3` (“vì thế tôi gìn giữ trai giới,”); riêng `16.3` là “vì thế ta gìn giữ trai giới,”. Đây là 1 chỗ lệch có chủ ý: `16.3` do vị ẩn sĩ nói (“ta”), còn bốn khoá kia do bồ câu, rắn, chó rừng, gấu nói (“tôi”); Pāli dùng chung `ahaṁ` cho mọi người nói. Không phải lỗi lệch khoá.
  - `6.1` = `12.3` (“Tato janā nikkhamitvāna gāmā,”): lệch duy nhất là chữ hoa ở “Rồi” (`6.1`, đứng sau dấu chấm của `5.4`) và chữ thường ở “rồi” (`12.3`, đứng sau dấu chấm phẩy của `12.2`); nội dung giống nhau.
  Tổng cộng 3 nhóm, trong đó 2 nhóm có khác biệt trong bản Việt (đều do ngữ cảnh: người nói, dấu câu), 1 nhóm giống hệt.

  **Tiền lệ ngoài bài:** 0 cặp Pāli trùng nguyên văn với khoá đã dịch ở nơi khác trong tầng (đã dò 65 khoá không phải tiêu đề), nên không có khoá nào dùng lại nguyên văn bản dịch có sẵn; `0.1` “Jātaka” khớp với mọi bài Jātaka khác.

  **Số Pāli:** `pañca` ở tên bài = 5 → “năm”; `7.` và `sattamaṁ` = 7 → “bảy”/“thứ bảy”. Trong thân kệ không có số lượng nào khác cần tính.

  **Thuật ngữ và tiền lệ, đã đo:**
  - `posathika` / `posatha` → “giữ trai giới”, “gìn giữ trai giới”: tầng có 148 khoá chứa `posathik-`/`posatha-` (phép dò theo hai gốc này) nhưng đa phần là danh từ riêng (`uposathanāgarāja`) hoặc công thức Chuyển luân vương; cách dịch “trai giới” có ở `dn26:4.9`, `dn26:5.11`, còn “bố-tát” ở `dn17:1.7.3`, `mn129:34.2`, `mn83:3.3`, “Bát quan trai” ở `ja300:1.4`. Chọn “trai giới” vì bài là câu hỏi “vì sao giữ giới” của người ngoài nên dùng từ thông dụng hơn “bố-tát”.
  - `brahme` (14.4) → “hỡi bà-la-môn”: giữ như `ja474:1.4`, `ja474:4.2` (tầng có 15 khoá chứa `brahme`, đa số “bà-la-môn”).
  - `bhadante` (9.1, 10.1, 14.1, 14.3) → “bạch ngài”: 0 khoá `bhadante` trong tầng; theo `ja319:1.4` (`bhante` → “bạch ngài”).
  - `uraga` / `sappa` → “rắn”; `dujivha` → “lưỡi chẻ hai” (`an5.230:1.3` “lưỡi chẻ hai”; `cp20:1.4` dịch “lưỡi kép”, tầng có hai cách); `ghoraviso` → “nọc độc dữ dội” (`mn105:30.1`, `an5.230:1.3`); `dāṭhāvudho` → “lấy nanh làm vũ khí” (`cp20:1.3` dịch “răng nanh độc chết người” ghép cả hai từ, tôi tách riêng hai từ).
  - `siṅgāla` → “chó rừng” (38 khoá chứa `siṅgāl-`, ví dụ `ja250:0.3` “Phẩm Chó Rừng”; `ja374:4.1` phiên âm “Siêng-đa-la” là cách khác nên không theo).
  - `accha` (11.4) → “gấu”: 0 tiền lệ.
  - `sākuṇika` (2.3) → “người bẫy chim”: `sn19.3:1.4` dịch “thợ bẫy chim”; chọn “người bẫy chim” cho một người cụ thể trong truyện (tầng dùng nhiều cách: `mn51:9.2` “giết chim”, `mn94:11.2` “giết gà”; đây là 3 trong 6 khoá đầu của tầng, không phải số đếm toàn tầng).
  - `rāga` (3.4) → “tham luyến”; `lobha` (10.4) → “tham lam”; `kodha` (6.4) → “sân hận”; `atricchatā` (12.2, 13.4) → “lòng tham quá mức”; `māna` (16.2, 16.4) → “ngã mạn”. Đây là năm kệ phân biệt năm phiền não: tham luyến (với bạn đời), sân hận, tham lam (với thịt voi), tham vọng quá mức, ngã mạn. Tầng dịch `rāga` là “tham” ở `ja414:5.1`, `ja431:4.3`, và `lobha` cũng thường là “tham” ⇒ hai từ sẽ trùng chữ nếu dịch cả hai là “tham”; vì vậy `rāga` ở đây là “tham luyến” để giữ được khác biệt giữa hai khổ. `kodha` (6.4) → “sân hận”: ở phạm vi Jātaka 6 khoá dịch “sân hận” (ví dụ `ja443:6.4`) và 1 khoá “giận” (`ja377:1.1`); trên toàn tầng 78 khoá chứa `kodho`: “giận” 40 · “sân hận” 14 · “phẫn nộ” 8 · “sân” 2 · khác 1 ⇒ hai phạm vi cho đa số khác nhau; chọn “sân hận” theo phạm vi gần nhất (Jātaka) và vì ở đây `kodha` đứng cạnh `rāga`, `lobha`, `māna` như tên của một phiền não; `māna` → “ngã mạn” theo `snp3.5:11.1`, `snp3.4:21.1`; `atriccha` ở `ja369:4.4` dịch “lòng tham vô đáy”, nhưng ở đây `atricchatā` là danh từ nữ tính chỉ trạng thái nên dịch “lòng tham quá mức”.
  - `adhivāsayanto` → “chịu đựng” (`snp4.16:12.2`).
  - `Paccekabuddha` (15.2) → “Độc Giác Phật” (21 khoá chứa `paccekabuddh-`, đồng nhất, ví dụ `mn116:3.2`).
  - `gatimāgatiñca` (15.3) → “sự đi và sự đến”: `dn8:3.6` dịch `āgatiñca gatiñca` là “sự đến, sự đi”; ở đây thứ tự Pāli là `gati` + `āgati` nên đảo theo nguyên văn.
  - `vihaṅgama` (1.2) → “loài bay trên không”: tầng dịch `vihaṅgama` là “bay trên trời/trên không” (`mn98:8.27`, `an4.36:5.2`), 17 khoá.
  - `appossukka` (1.1) → “chẳng còn nhiệt tâm”: `dn14:3.2.10` dịch `appossukkatā` là “không nhiệt tâm”; đây là chỗ có nhiều cách hiểu (xem bất định 7).
  - `kanditvā roditvā` (6.2) → “kêu than, khóc lóc”: `ja317:3.3` “kêu than khóc lóc”.
  - `manomaya` (3.2) → “do tâm tạo ra” theo `ja440:9.2`.
  - `Rāhumukha` (10.2): giữ tên Rāhu, “miệng Rāhu”; tầng có 13 khoá chứa `rāhumukh-` nhưng chúng là tên một kiểu hình phạt (`mn13:14.3` ‘miệng Rāhu’), khác nghĩa, nên không dùng làm tiền lệ.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli mở ở `1.1`, `2.1`, `4.1`, `14.1`, `15.1` (5 dấu) và đóng ở `1.4`, `3.4`, `13.4`, `14.4`, `16.4` (5 dấu); Việt đúng như vậy, lệch 0/69 khoá. Pāli không cân bằng theo từng khổ (mở `4.1` đóng ở `13.4`, mở `2.1` đóng ở `3.4`) vì lời kể của năm người nói lồng nhau; không gói thêm nháy để làm cân. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0. Lỗi đã bắt khi tự kiểm: bản nháp đầu đặt dấu mở ở `7.1` thay vì `2.1` (đọc nhầm lời của bồ câu và chó rừng); phép so từng khoá bắt được và đã sửa.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `calakkakū` (5.2): không có tiền lệ trong tầng (0 khoá); dịch “bướu rung rinh” theo nghĩa `cala` (rung, động) + `kakudha/kakku` (bướu bò). Cách đọc khác: một từ chỉ vẻ đẹp của con bò (gần nghĩa “có yếm lúc lắc”).
  2. `Kodaṇḍakena` (12.4): dịch “dùng cung”. `kodaṇḍa` là cung, đuôi `-ka` có thể chỉ cây cung nhỏ hoặc cây gậy cong; 0 tiền lệ. Nghĩa “gậy cong” cũng khả dĩ.
  3. `Nānābhavā vippayogena` (3.1): dịch “do chia lìa nàng, trong những cảnh sống khác nhau”. Có thể hiểu `nānābhava` là hai bên mỗi bên ở một cảnh sống khác nhau sau khi bị chia cách; không thêm “mỗi bên” vào thân kinh.
  4. `Pavisi` (8.1): hình thức ngôi thứ ba (“nó chui vào”) nhưng tầng Pāli của khổ 8–10 là lời tự kể của chó rừng (`9.1` `ahaṁ`, `10.1` `ahaṁ`), nên dịch ngôi thứ nhất “tôi đã chui vào”. Có thể `pavisi` là dạng rút gọn theo niêm luật của `pavisiṁ`; không ghi “nó” để khỏi biến lời kể thành lời kể về người khác.
  5. `gāmikassa` (5.1) → “của người trong làng”: 0 tiền lệ; có thể là “người trưởng làng”. Chọn nghĩa ít giả định hơn.
  6. `mallagāmaṁ` (12.2) → “làng của người Malla”: 0 tiền lệ cho từ ghép; tầng có `mallaputto` → “người Malla” ở `dn16:4.26.1`. Có thể là làng của các đô vật (`malla` cũng là đô vật); chọn theo dòng họ vì ngữ cảnh làng.
  7. `appossukko` (1.1): chỉ nghĩa chung “ít nhiệt tâm, thụ động”; dịch “chẳng còn nhiệt tâm” theo `dn14:3.4.19`. Ngữ cảnh gợi ý là sự thờ ơ với việc tìm ăn nhưng Pāli không nói rõ “tìm ăn”.
  8. Người nói: đọc từ nội dung kệ chứ không từ văn xuôi (tầng Pāli đã ghim không có văn xuôi). Khổ 1, 4, 7, 11: người hỏi (vị ẩn sĩ) hỏi bồ câu, rắn, chó rừng, gấu; khổ 2–3 bồ câu, 5–6 rắn, 8–10 chó rừng, 12–13 gấu trả lời; khổ 14 bốn con vật hỏi lại vị ẩn sĩ; khổ 15–16 vị ẩn sĩ trả lời. Vì `bhavaṁ` (1.4, 4.4, 7.4, 11.4) và `tuvaṁ` đều là “bạn/ngươi” trong lời hỏi của ẩn sĩ nên dùng “ngươi” cho cả hai; ở `14.4` thì là lời bốn con vật hỏi ẩn sĩ nên `bhavaṁ` → “ngài”. Đây là suy luận từ nội dung, không được ghi vào thân kinh.
  9. `Manuññarūpaṁ tava bhojane taṁ` (7.2): `bhojane` là vị trí cách; dịch “thứ ấy làm thức ăn của ngươi thật hợp ý”. Có thể hiểu `manuññarūpa` là “có vẻ ngoài hợp ý” (thịt tươi ngon) hơn là “hợp ý” nói chung.
  10. `Evampahaṁ vandi` (16.1): `vandi` ở dạng ngôi ba nhưng chủ ngữ là `ahaṁ` (cùng hiện tượng với bất định 4); dịch “ta đã không lễ”.

  **Coverage English (mục 7):** mẫu số = 0. Đo mọi khoá không phải khối `:0` (65 khoá), dài nhất sau khi nén khoảng trắng là 35 ký tự (< 40) nên 0/65 khoá có nội dung theo ngưỡng của `source/layers.yaml`; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja490`; `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Tôi không đụng `content/meta/reference-gaps.yaml`.

