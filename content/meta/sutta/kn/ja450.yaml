  thousand sacrifices”) gán vào khoá Pāli `Dhammaṁ care yopi samūñjakaṁ care,`. Tôi theo Pāli.
  **Phe `nghìn` / `ngàn` — đo cả hai số như yêu cầu.** Toàn tầng: “nghìn” **207** khoá vs “ngàn”
