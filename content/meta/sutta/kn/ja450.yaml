notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Tra tiền lệ (đếm được):** `sataṁ` / `sahassānaṁ` / `sahassayāginaṁ` → *trăm* /
  *nghìn* / *mười nghìn* (xét ở `ja20:4.4` cùng lát: 199 chỗ "nghìn" so với 316 "ngàn",
  và "ngàn" chủ yếu đi với *hàng ngàn chư thiên*).
  **Bối cảnh đã đọc trước khi dịch:** cụm `Sataṁ sahassānaṁ sahassayāginaṁ …
  Kalampi nāgghanti tathāvidhassa te` **lặp nguyên văn** ở cả `8.3`–`8.4` và
  `9.3`–`9.4`, và `10.5`–`10.6` lặp lần nữa. Cả ba lần đều kết bằng *…cũng không bằng
  nổi một phần nhỏ nào của người kia*, tức nói phần cho bằng tay không bằng phần cho
  có kính. Vì `Kathaṁ` chỉ có ở `9.3` mà không có ở `8.3` và `10.5`, nó là từ **hỏi
  lượng** của riêng vế này, nên tôi dịch *Dù là …* (0 tiền lệ riêng cho `kathaṁ` ở đây)
  chứ không dịch *Bao nhiêu …* theo nghĩa câu hỏi. Nhịp đối lập đọc được ngay:
  vế trước hỏi *bằng vật gì quý hơn nữa cho được kính*, vế này trả lời *dù bao nhiêu
  cũng không bằng*.
  **Dấu ngoặc kép:** Pāli mở `“` ở `9.1` nhưng đóng ở `9.4`, và `9.1`–`9.2` không đủ 40
  ký tự nên nằm ngoài tập kiểm. Tôi dùng `‘` (xem ghi chú ở `ja353`).
