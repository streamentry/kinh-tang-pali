  (a) `1.1`–`1.4` `Apacantāpi dicchanti, santo laddhāna bhojanaṁ` — cú pháp không dứt: có thể
  `bhojanaṁ` là tân ngữ của `dicchanti` (vật bị thấy) với `santo laddhāna` là từ hạn định, hoặc
