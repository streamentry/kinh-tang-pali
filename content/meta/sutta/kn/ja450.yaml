  **Số Pāli — tự tính, in phép.**
  `sataṁ` = **100** → “trăm” (`8.3 9.3 10.5`).
  `sahassā` = **1.000** → “nghìn” (cùng ba khoá).
  `sahassayāgina` = sahassā (**1.000**) × agina (**10**) = **10.000** → “mười nghìn”.
  `sahassena` (`7.4`) = **1.000 lần** → “ngang bằng với ngàn”.
  `dvādasamaṁ` (`11.1`) = **12** → “thứ mười hai”; `0.4` cũng là **12**.
  Không có số lượng nào khác trong bài.
  ⇒ Vì vậy cụm `sataṁ sahassānaṁ sahassayāginaṁ` là ba số **100 / 1.000 / 10.000**, không phải
  “một trăm ngàn”. Bản Việt đã có của `sn1.32` ở ba khoá (`14.3 16.3 18.1`) dịch thành “một
