  nghìn lần trăm triệu kiếp”. Tôi giữ **nghìn** cho cả ba khoá trong bài để bài không tự mâu thuẫn
  và khớp khoá `9.3` đã có sẵn trên đĩa.
  **Thuật ngữ — tiền lệ đếm được.**
  `Dasakanipāta` → “Bộ Mười Bài Kệ”: trong `ja*` **9/9** (ja439–ja453); “Bộ Mười Bài Kinh”
