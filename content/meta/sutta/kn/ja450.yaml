  sau” **1**. Tôi lấy cách giữ `pāṇinan` (`sn3.20:8.4`, `sn3.22:5.4`) vì bỏ nó là mất một từ
  nghĩa. Chữ “kẻ ăn uống” cho `pāṇin` tôi đã thử rồi bỏ: **0** khoá tiền lệ, và ở tầng này
  `pāṇi` thường được dịch là “tay” (`pāṇinā` → “bằng tay”, `aṅgulipāṇi` → “bàn tay”), nên để
  người đọc tự suy ra từ “ăn uống” là chỗ dễ trượt nhất.
  **Bốn bất định, không che.**
  (a) `1.1`–`1.4` `Apacantāpi dicchanti, santo laddhāna bhojanaṁ` — cú pháp không dứt: có thể
  `bhojanaṁ` là tân ngữ của `dicchanti` (vật bị thấy) với `santo laddhāna` là từ hạn định, hoặc
  `santo` là chủ ngữ độc lập. Tôi dịch theo cách thứ nhất và ghi rõ trong câu, không thêm
  giải thích nào vào thân kinh. Mệnh đích (`9.1`–`9.4`) là người lành có món ăn **đã tự đi ăn
  xin** mà vẫn cho, nên câu hỏi `1.3` hợp lý dù cách phân tích chưa chắc tuyệt đối.
  (b) `8.1` `samuñchakaṁ` là **hapax toàn Pāli ghim** (đúng **1** khoá trong toàn bộ root, `ja450:8.1`);
  bản song song `sn1.32:14.1` viết `samuñjakaṁ` (cũng chỉ **1** khoá) và Sujato dịch là “wandering
  for gleanings”. Tôi hiểu là “sống một cách keo kiệt / tham tế”, tra theo nghĩa chung của cụm
  (đối lập với `maccharī`), và giữ lặp `care … care` của Pāli. Đây là suy luận theo ngữ cảnh,
  không phải nghĩa từ điển đã kiểm chứng.
  (c) `5.4` `sataṁ dhammo durannayo` — `sataṁ` có thể là “trăm” (số tròn) hoặc tính từ
  `sata` = “tốt lành”. Cả hai tiền lệ tầng đều không dịch ra “trăm” (`ja180:1.4` “đức lành khó
  chỉ dạy”, `sn1.32:10.4` “pháp của bậc hiền thiện thật khó noi theo”), nên tôi theo `ja180`.
  (d) `9.3` `Kathaṁ` tôi dịch “Dù là …” (giữ trên đĩa từ lát trước), coi nó là mạo ngữ nhấn
  cả vế thay vì từ hỏi số lượng; tiền lệ đúng ở `sn1.32:16.3` lại dịch “Vì sao”. Cả hai đều
  chấp nhận được; tôi chọn “Dù là” để `9.4` (`Kalampi` = “cũng”) không bị lặp ý. Chữ “hay” nối
  ba số ở `8.3 9.3 10.5` **không có** trong Pāli (`sataṁ` `sahassānaṁ` `sahassayāginaṁ` không
  liên từ nào); đó là nối liệt kê, tôi ghi rõ thay vì giấu.
