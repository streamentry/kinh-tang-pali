  cách dịch của `sn1.32` vì bản đó **làm mất một số** (xem mục số Pāli); `9.2 10.4` khác nhau
  vì chức năng mệnh đề; `10.6` bỏ cách dịch `của vật thí của người như thế` của `sn1.32` vì câu đó
  thêm cụm không có trong Pāli — `tathāvidhassa te` là “của người như thế”. **19** khoá hoàn toàn
  mới (Pāli không trùng tệp nào).
  **Số Pāli — tự tính, in phép.**
  `sataṁ` = **100** → “trăm” (`8.3 9.3 10.5`).
  `sahassā` = **1.000** → “nghìn” (cùng ba khoá).
  `sahassayāgina` = sahassā (**1.000**) × agina (**10**) = **10.000** → “mười nghìn”.
  `sahassena` (`7.4`) = **1.000 lần** → “ngang bằng với ngàn”.
  `dvādasamaṁ` (`11.1`) = **12** → “thứ mười hai”; `0.4` cũng là **12**.
  Không có số lượng nào khác trong bài.
  ⇒ Vì vậy cụm `sataṁ sahassānaṁ sahassayāginaṁ` là ba số **100 / 1.000 / 10.000**, không phải
  “một trăm ngàn”. Bản Việt đã có của `sn1.32` ở ba khoá (`14.3 16.3 18.1`) dịch thành “một
  trăm ngàn người tế lễ một nghìn lễ hy sinh”, tức **bỏ mất** `sahassayāginaṁ` và gộp
  `sataṁ sahassānaṁ` thành một số. Bản Anh Sujato đã ghim cho `sn1.32` cũng lệch: các segment
  số bị đảo khớp với key (dấu `<j>` nối câu), `14.1` (“A hundred thousand people making a
  thousand sacrifices”) gán vào khoá Pāli `Dhammaṁ care yopi samūñjakaṁ care,`. Tôi theo Pāli.
  **Phe `nghìn` / `ngàn` — đo cả hai số như yêu cầu.** Toàn tầng: “nghìn” **207** khoá vs “ngàn”
  **554**. Riêng `kn/ja*`: “nghìn” **14** vs “ngàn” **17**. Riêng các Jātaka có `sahassa*`:
  “nghìn” **6** (ja264 ×2, ja288, ja292, ja417, ja423) vs “ngàn” **6** (ja260, ja323, ja353,
  ja377 ×2, ja403, ja460) — hoà. `sataṁ sahassānaṁ` thì tầng đa số “trăm ngàn” (`snp3.10:12.1`,
  `sn6.4:5.3`, `sn6.9:5.1`, `sn6.10:10.1`, `dn20:6.5`) chỉ **5** khoá, còn `an4.3:5.1` “Trăm
  nghìn lần trăm triệu kiếp”. Tôi giữ **nghìn** cho cả ba khoá trong bài để bài không tự mâu thuẫn
  và khớp khoá `9.3` đã có sẵn trên đĩa.
  **Thuật ngữ — tiền lệ đếm được.**
  `Dasakanipāta` → “Bộ Mười Bài Kệ”: trong `ja*` **9/9** (ja439–ja453); “Bộ Mười Bài Kinh”
  chỉ xuất hiện **6** khoá và đều ở `thag10.*`, tức là sách khác.
  `Catudvāravagga` → “Phẩm Bốn Cửa”: **9/9**, không có cách thứ hai.
  `dvādasamaṁ` → “thứ mười hai”: **14** khoá trong tầng, mẫu Jātaka kế cạnh là
  “Kinh Cakkavāka thứ mười ba”, “Kinh Trí Tuệ Rộng Lớn thứ mười bốn”.
  `maccherā / maccharī` → “bỏn xẻn”, theo nguyên văn bản dịch `sn1.32` và `ja180`. Lưu ý phe
  này **không** thống nhất toàn tầng: “keo kiệt” **185** khoá vs “bỏn xẻn” **19** (đa số “keo
  kiệt” đến từ danh sách `macchaṁ` trong `an2`/`an10`).
  `satto`/`sataṁ`/`samena` — cùng một người là Bilārakosī. Ở `6.1` và `6.4` tôi giữ nguyên văn
  “bậc hiền thiện” của `sn1.32`/`ja180` vì đó là chỗ Pāli đặt `sataṁ` đối lập với `asataṁ`
  (“kẻ xấu”), nên nó là phẩm loại; ở `1.2` tôi dùng “người lành” vì người ấy đang đi ăn xin, đọc
  “bậc hiền thiện” sẽ không đúng sắc thái. Đây là **bất định thuật ngữ có chủ ý**, không phải
  lỗi.
  `dakkhiṇā` → “vật cúng dường” (`7.3`, nguyên văn `sn1.32:8.3`) nhưng “vật hiến cúng” (`10.3`,
  nguyên văn `sn1.32:17.3`) — hai cụm Pāli trùng nguyên văn ở tầng, nên tôi tái dùng cả hai
  theo đúng tiền lệ. Toàn tầng “vật cúng dường” **51** vs “vật hiến cúng” **18**.
  `patiṭṭhā honti pāṇinaṁ` → “là chỗ dựa cho các loài hữu tình trong đời sau”. Tầng có đúng
  **8** khoá `patiṭṭhā honti pāṇinan` và chia làm ba cách: “là chỗ nương tựa trong đời sau”
