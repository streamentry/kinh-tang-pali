notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja396 tại commit đã ghim, và `vietnamese-current` tại commit đã ghim chỉ có Pháp Cú nên vắng với Jātaka.
  Không có khoá nào trùng nguyên văn Pāli với bài đã dịch (0/29 khoá có nội dung khớp chuỗi), nên không có gì để dùng lại nguyên văn. Tra tiền lệ bằng grep trên tầng Việt: `yakkha` không có ở đây; `kilesa` → tạp ô; `dhamma` → Pháp; `ambuja`, `puṇḍarīka` → hoa sen, sen trắng; `dhāti` không có tiền lệ nào ở Jātaka.
  Tên phẩm chưa chốt, 0 tiền lệ: `Sattakanipāta` → Bộ Bảy Bài Kệ, bám ngay bên trên là Bộ Sáu Bài Kệ (11 tệp trong tầng); `Kukkuvagga` → Phẩm Kukku, bám Phẩm Kharaputta (6 tệp). Cả hai lựa chọn ghi ở đây để người điều phối gộp với các lát sau.
  Bất định, ghi rõ thay vì che: `kharattacaṁ bellaṁ yathāapi satthavā` (`:4.1`) và `tittakaṁ` (`:4.2`) là cụm từ cổ, chỉ dịch theo nghĩa từng chữ, không thêm chuyện gì; `tanubandhamuddharaṁ` (`:4.4`) dịch là gông trói của thân xác được nhổ ra; `agginikāsiphālimaṁ` (`:6.3`) dịch là sương sen mới khai. `siṃsapā` (gò mối) và `gopānasī` (vôi trên chân cột) không có tiền lệ nào trong tầng nên dịch mới theo nghĩa.
  Cổng kỹ thuật chưa chạy vì agent dịch không được chạy lệnh npm. Coordinator chạy bốn lệnh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Sửa lan 2026-10-14 (cơ học): khoá ja396:4.1 — bản Việt còn lẫn từ tiếng Anh hoặc từ ngoại không cần
  thiết (beer/wine, machete, teck, bael, myrobalan, kshatriya, yaksha, “Nanda’s mother”); đã thay bằng
  từ Việt hoặc dạng đã dùng ở toàn tầng (rượu men / rượu nấu / các chất say; rựa; gỗ tếch; beluva;
  āmalaka; Sát-đế-lợi; dạ-xoa; Nandamātā). Giữ nguyên phần còn lại của khoá.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5, Claude Code), đọc lại đủ 33 khoá Pāli↔Việt; chỉ có Pāli
  đã ghim và PED, không có bản Anh hay Việt khác. Bản cũ đoán nghĩa từ tên bài `kukku` (gà), nên sai
  gần cả bài: `1.1`–`1.4`, `2.1`–`2.4`, `3.2`–`3.4`, `5.2`–`5.4`, `6.1`, `6.3`, `6.4` (khoảng 20/29
  khoá có nội dung). Pāli nói về chóp mái (`kaṇṇikā`) cao một `kukku` rưỡi (`kukku` là một đơn vị đo
  chiều dài, PED), chu vi tám `vidatthi` (gang tay), bằng gỗ `siṁsapā` lõi cứng không giác
  (`apheggukā`), được ba mươi cái kèo cong (`gopānasī`, PED: dầm đỡ khung mái hình chữ Λ) vây quanh và
  ép giữ. `5.4` `phāti kayirā` là làm cho hưng thịnh (PED `phāti`, `phāti-karoti` = tăng thêm), không
  phải “đến bờ bên kia”. `6.3` `agginikāsiphālimaṁ`: PED `phālima` = nở ra, đang nở (J iii. 320, đúng
  câu này; chú giải `phālita vikasita`), `agginikāsi` = có dáng như lửa. Ghi chú cũ ở trên về
  `agginikāsiphālimaṁ` (sương sen), `tanubandhamuddharaṁ`, `siṁsapā` (gò mối) và `gopānasī` (vôi trên
  chân cột) không còn đúng; chữ hiện hành là chuẩn. Bất định, giữ nghĩa đen: `4.1`–`4.4` (quả `bella`
  vỏ sần, `anāmasantopi`, `samāharaṁ`, `tanubandhamuddharaṁ` “nhổ bỏ mối ràng mỏng”: nghĩa chuyên môn
  của việc xử lý trái không phân xử được từ Pāli); `3.4` `gopānasī bhāravahāva kaṇṇikā` đọc là chóp
  mái nhờ các kèo gánh vác; `6.3` thêm chữ “đã nở rộ” theo PED/chú giải. Không sửa `7.4`, `5.1`, tên
  phẩm và tên bộ.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
