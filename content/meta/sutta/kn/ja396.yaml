notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja396 tại commit đã ghim, và `vietnamese-current` tại commit đã ghim chỉ có Pháp Cú nên vắng với Jātaka.
  Không có khoá nào trùng nguyên văn Pāli với bài đã dịch (0/29 khoá có nội dung khớp chuỗi), nên không có gì để dùng lại nguyên văn. Tra tiền lệ bằng grep trên tầng Việt: `yakkha` không có ở đây; `kilesa` → tạp ô; `dhamma` → Pháp; `ambuja`, `puṇḍarīka` → hoa sen, sen trắng; `dhāti` không có tiền lệ nào ở Jātaka.
  Tên phẩm chưa chốt, 0 tiền lệ: `Sattakanipāta` → Bộ Bảy Bài Kệ, bám ngay bên trên là Bộ Sáu Bài Kệ (11 tệp trong tầng); `Kukkuvagga` → Phẩm Kukku, bám Phẩm Kharaputta (6 tệp). Cả hai lựa chọn ghi ở đây để người điều phối gộp với các lát sau.
  Bất định, ghi rõ thay vì che: `kharattacaṁ bellaṁ yathāapi satthavā` (`:4.1`) và `tittakaṁ` (`:4.2`) là cụm từ cổ, chỉ dịch theo nghĩa từng chữ, không thêm chuyện gì; `tanubandhamuddharaṁ` (`:4.4`) dịch là gông trói của thân xác được nhổ ra; `agginikāsiphālimaṁ` (`:6.3`) dịch là sương sen mới khai. `siṃsapā` (gò mối) và `gopānasī` (vôi trên chân cột) không có tiền lệ nào trong tầng nên dịch mới theo nghĩa.
  Cổng kỹ thuật chưa chạy vì agent dịch không được chạy lệnh npm. Coordinator chạy bốn lệnh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
