  - Chỗ bất định (không thêm vào thân kinh):
    + `1.3` `parābhetvā`: hapax toàn Pāli đã ghim; dịch "gọi" theo mạch (Đế Thích rồi nói thẳng với Alambusā ở `2`); nghĩa chính xác không xác lập được.
    + `1.2` `vatrabhū` → "đấng diệt Vatra": đọc là cách gọi Đế Thích ("diệt Vatra"); `jayataṁ pitā` → "cha của những bậc chiến thắng" (sở hữu cách số nhiều của `jayanta`).
    + `3.1` `Purāyaṁ amhe acceti` → "Kẻo vị này vượt qua chúng ta": `purā` + hiện tại đọc là "trước khi / kẻo"; cách đọc khác là "xưa kia vị này từng vượt chúng ta"; không loại trừ được. `3.3` `vuddho` → "đã trưởng thành": cũng có thể là "bậc cao tuổi" hay "đã tăng trưởng"; Isisiṅga là một thanh niên (`38.4` `māṇava`) nên không dịch "già".
    + `4.2` `mameva tuvaṁ sikkhasi` → "chỉ dạy bảo riêng mình tôi": `sikkhasi` là ngôi hai hiện tại của `sikkhati`; "ngài chỉ rèn luyện riêng tôi" cũng được; `4.3` `Isippalobhane gaccha` giữ nguyên lời Đế Thích ở `2.3`, người nghe không nói rõ.
    + `12.3` `bimbajālaka` → "các cây bimbajālaka" (tên một loài cây, cùng chuỗi tên cây ở `ja547:89.3` chưa có bản Việt); giữ phiên âm.
    + `13.2` `udaṇhasamayaṁ pati`: không tra được từ `udaṇha` ở nơi khác; dịch "lúc nắng lên" theo mạch (sáng sớm, bữa sáng, rồi nắng lên). `13.3` `aggiṭṭhaṁ parimajjantaṁ` → "lau chùi nơi thờ lửa" (đối tượng là Isisiṅga, nên dịch có chủ ngữ "ông").
    + `15.3` `mahāmāyā` → "đại huyễn thuật" theo `ja507:26.1`; có thể là "đầy sức mê hoặc" hay "rất giả dối", không phân xử được; `saññatūrū` → "đùi thon khít". `16.1` `vilaggā` → "thon thả" (không tra được nghĩa chắc ở nơi khác). `17.4` `akkhassa phalakaṁ` → "mặt ván của xúc xắc" (`akkha` còn có thể là "trục xe"). `18.3` `pūrā kaṇhañjanasseva` → "đầy như thuốc kẻ mắt đen". `19.1` `duvidhā jātā urajā` → "hai bầu mọc lên nơi ngực".
    + `20.1` `kambutalābhāsā` → "ánh lên như vỏ ốc" (`kambu` còn có thể là vàng; cùng chuỗi `ja526:44.2` chưa có bản Việt). `20.3` `paṇḍarāvaraṇā` → "có lớp che màu trắng" (không nói che chỗ nào). `20.4` `catutthamanasannibhā` → giữ phiên âm "catutthamana": hapax toàn Pāli đã ghim, không tra được nghĩa, và tôi không bịa; đây là chỗ khó nhất bài.
    + `21.1`–`21.4` `uddhaggā ca adhaggā ca ... duvijā nelasambhūtā`: đọc là răng hàm trên hướng xuống, hàm dưới hướng lên, "sinh hai lần" (răng sữa rồi răng chính) và "không tì vết" (`nela` = không tì vết); các cách đọc khác của `nela` không loại trừ được. `22.2` `jiñjūkaphalasannibhā` → "giống quả jiñjūka" (tên quả, giữ phiên âm; thường được đồng nhất với hạt đỏ nhưng tầng Pāli không nói). `23.2` `kanakabyā samocitā` → "ánh vàng, búi gọn gàng" (`byā` có thể là biến âm của `bhā`; không chắc).
    + `24.1`–`25.1` `Yāvatā kasigorakkhā ... Na te samasamaṁ passe`: đọc `yāvatā` là "trong phạm vi" cho cả bốn danh từ (cày cấy, chăn bò, đường đi của thương nhân, nỗ lực của ẩn sĩ); cách đọc "chừng nào còn..." cho cùng nghĩa.
    + `26.2` `kassapevaṁ gate sati` → "khi sự việc đã như vậy": đọc `evaṁ gate sati` là cách nói "nay đã thế này".
    + `28.2` `Chetvā dandhaparakkamaṁ` → "dứt bỏ sự chậm chạp trong nỗ lực": cũng có thể hiểu là "bỏ nỗ lực tu tập chậm chạp" hay "bỏ sự ngần ngại"; `dandhaparakkama` ở `ja345:1.4` là "đi chậm". `28.3`–`28.4` `Tamuttamāsu veṇīsu ajjhappatto parāmasi`: "ông đến gần và chạm vào nàng, nơi những bím tóc trên đầu" (`ajjhappatto` = đã tới nơi).
    + `29.1` `Tamudāvatta` → "quay về phía ông"; `29.4` `yathā taṁ atha tositā` → "bấy giờ nàng mãn nguyện như vậy" (`yathā taṁ` đọc là "đúng như thế"; không nói điều gì là điều nàng muốn).
    + `31.2`, `46.2` `sopavāhana` (giữ phiên âm, như `catussada` ở `ja501:27.3`): hapax; không tra được nghĩa (có thể là "có kèm phương tiện chuyên chở"). `31.3`, `46.3` `Sauttaracchadapaññāsaṁ` → "có năm mươi lớp phủ, kể cả tấm phủ bên trên" (`sa-uttara-cchada` = "kèm tấm phủ trên"; cách đọc "năm mươi tấm trải, lớp trên cùng" không loại trừ được). `31.4`, `46.4` `sahassapaṭiyatthataṁ` → "được trải ngàn lớp": nghĩa của `paṭiyatthata` chưa chắc.
    + `36.2`–`36.4` `yo me tejā ha sambhutaṁ ... nāvaṁva gaṇhi aṇṇave`: đọc là "kẻ nào đã đoạt lấy điều ta tích tụ nhờ uy lực (đầy các thứ châu báu), như đoạt chiếc thuyền giữa biển cả"; `nānāratnaparipūraṁ` có thể bổ nghĩa cho chiếc thuyền thay vì điều tích tụ, cách đọc khác về ngữ pháp.
    + `40.4` `svajja jhāyāmi ekako` → "chính hôm nay ta ngồi ủ ê một mình" (xem mục thuật ngữ); `41.1` `Sohaṁ tathā karissāmi` → "Chính ta sẽ làm đúng như vậy": "như vậy" chỉ lời cha dạy ở `38`–`39`, không có từ nào nói rõ.
    + `38.3` `Kamalāsadisitthiyo` → "những người nữ giống như hoa sen"; `39.1` `Uregaṇḍāyo` → "những cục bướu trên ngực": đọc `ure-gaṇḍa` là cách gọi các bầu ngực người nữ; `bujjhesi` (`38.4`, `39.1`, `39.2`) dịch là mệnh lệnh "hãy nhận biết".
    + `42.2` `Dhitiṁ ñatvā avaṭṭhitaṁ` → "cùng sự kiên định đã vững vàng": đọc `avaṭṭhita` là đã được lập vững.
    + `44.1`–`44.3` `tāvatiṁsā ca ye devā ... Tvañca bhadde sukhī hohi`: `hohi` là mệnh lệnh ngôi hai dành cho nàng; hai vế chư thiên và Vāsava dịch bằng "mong ... đều được an vui" (không có động từ riêng); cách đọc khác là chỉ nàng được chúc.
    + `46.1` `Yo ca tassāsi pallaṅko`: `tassa` đọc là "thuộc về vị ấy" (Isisiṅga, chiếc ghế dài đã sai đến ở `31`); nếu `tassa` chỉ Đế Thích thì "của vị ấy" vẫn đúng chữ.
    + `47.1` `Tamokkamiva āyantiṁ` → "như ngọn đuốc": `okka` đọc là biến âm của `ukkā` (`ja486:1.1` "đuốc"); cách đọc "sao băng" không loại trừ được; "cho nàng" ở `47.4` do `āyantiṁ` ở đối cách.
    + `48.3` `Nisippalobhikā gacche` → "xin cho tôi đừng còn đi quyến rũ ẩn sĩ nữa": đọc `ni-` là dạng của `na isi-`; không phân xử được từ Pāli một mình.
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 203/203, cùng thứ tự.
    2. Nháy đơn `‘’`, nháy kép `“”` khớp Pāli từng khoá: 0/203 lệch (Pāli 0 `‘’`; 24 khoá có nháy kép). Dấu lược `…`: Pāli 0/203, Việt 0/203 (phép chạy rỗng; không có `(…)` trần).
    3. Pāli trùng nguyên văn trong chính bài: 9 nhóm, xem trên; Việt khác 1 nhóm, cố ý.
    4. Dấu lược `…pe…`/`(…)`: Pāli 0/203 khoá, Việt 0/203 (phép chạy rỗng).
    5. Số Pāli: xem trên; tính tay từng số kèm phép tính; bài không có cụm nào thuộc nhóm từ khoá số đã xác lập nên phép kiểm máy quét 0 tệp của bài này (phép chạy rỗng, không phải đạt).
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng hoặc từ giữ phiên âm có ghi chú (`Jātaka`, `Alambusā`, `Isisiṅga`, `Missā`, `Sudhammā`, `Nandana`, `Vatra`, `Vāsava`, `Maghavā`, `Kassapa`, `Sakka`, `bimbajālaka`, `eṇeyya`, `jiñjūka`, `catutthamana`, `sopavāhana`). Đã in cặp Pāli↔Việt ra đọc toàn bài (203 cặp).
