  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ. `“Sādhu, bhante nāgasena, evametaṁ tathā
  sampaṭicchāmī”ti.` — bài CÙNG PHẨM mil6.3.9:4.11 đã có đúng `“Lành thay, thưa ngài
  Nāgasena, đúng là như vậy, trẫm xin kính nhận”ti.` ⇒ dùng lại nguyên văn ở `:9.13`.

  NHÁY KÉP — CÓ BA CẶP `‘…’”` LIỀN NHAU. Ở `:4.2` và `:4.3` Pāli đóng nháy đơn `’`
  rồi đóng nháy kép `”` ngay sau (`…ni pphādessāmā’”ti?`). Nháp đầu tiên chỉ để
  `’ti` là mất một dấu đóng; đã sửa thành `’”ti?` và `’”ti.` y hệt Pāli. Tổng bài:
  Pāli `“`=16 `”`=16, `‘`=5 `’`=5; bản Việt cân đúng. Ngoài ra các cặp nháy kép
  kéo dài đúng như SuttaCentral chia khoá: `:1.2` mở thì `:1.3` đóng; `:2.2` mở thì
  `:2.4` đóng; `:3.1` mở thì `:3.2` đóng; `:5.2` mở thì `:8.5` đóng; `:9.4` mở thì
  `:9.12` đóng. Không có dấu lược nào trong bài (đếm bằng `lược()` = 0).

  LỖI BẢN NHÁP BẮT ĐƯỢC KHI REVIEW ĐỐI KHÁNG (3 chỗ, đã sửa hết):
  (1) `:4.2` và `:4.3` — mất dấu đóng nháy kép như mô tả trên.
  (2) `:8.4` — nháp đầu tiên tách `kusalā bodhipakkhiyā dhammā` thành hai cụm “các
  pháp thiện thuộc bồ-đề, các pháp giác chi”. Sai: đây là MỘT cụm “các pháp thiện
  thuộc giác chi”. Đã sửa.
  (3) Bản nháp có lỗi chính tả do gõ: “ghì ghét” (4 chỗ) và “răn rănh” — đã sửa
  thành “chế ngự” và “răn răng”. Đồng thời `:6.2` sửa “đứng yên trong thân thì” thành
  “thân thể vẫn còn đứng yên thì”, vì `tiṭṭhamānepi sarīre` nói thân thể CÒN ĐỨNG.

  BẤT ĐỊNH ĐÃ GHI. (1) `:7.1` và `:7.4` `mahikotthaṭa` / `mahikottharaṇa` — 0 tiền lệ
  trong toàn tầng Việt. Từ cả câu (`sūriyassa pabhā na dissati santāyeva sūriyarasmi
  appavattā hoti`) rõ đó là một nơi rộng lớn và kín, ánh sáng mặt trời lọt vào chỉ còn
  một tia yếu; tôi dịch “nơi rộng lớn kín đáo” và KHÔNG nêu tên cụ thể là gian phòng
  hay kho chứa, vì không tra được nguồn nào trong kho. (2) `:5.3` và `:5.4`
  `bhavaṅga` — chỉ 2 tiền lệ cả tầng và đều không phải nghĩa “khoảnh khắc”, nên tôi
  dịch theo nghĩa thời gian là “khoảnh khắc”; `bhavaṅgagati pariyosānaṁ` ở `:9.6`
  đọc là “sự rơi vào khoảnh khắc ấy là chỗ tận cùng của giấc mê”. (3) `:9.5`
  `vokiṇṇakaṁ jaggati` — 0 tiền lệ; `jaggati` là nghiến răng trong lúc ngủ gật, tôi
  dịch “tiếng răn răng nghiến răng”, không thêm chi tiết nào. (4) `:8.2`
  `rahassakāmā` — `rahassa` có 6 tiền lệ (đều là “điều bí mật”) nhưng ở đây là “ẩn
  dật”; tôi gán cho chính bậc A-la-hán (“vốn muốn sống ẩn dật”), cách đọc còn lại là
  người ta tránh xa vì ham muốn ẩn dật.

