  - `disā` (24.1) → "mười phương" (6 khoá "mười phương"; 582 khoá chứa `disā`, đa số là "phương/hướng"). `pabhāsetvā` → "soi sáng" (4 trên 7 khoá). `sataraṁsi` → "mặt trời trăm tia sáng" (`snp5.1:41.2`, `tha-ap87:2.2`, `tha-ap112:1.2` dịch `Sataraṁsiṁva bhāṇumaṁ` đúng như vậy). `sabbasaṅkhārā` → "mọi hành" (`sn1.11:5.3`; `sn9.6:5.3` "tất cả hành"; 4 khoá). `ritta` → "trống rỗng" (28 trên 404 khoá `ritt-`; "rỗng không" 22).
  - `etarahi` → "hiện nay" (108 trên 540; "bây giờ" 102) ở 11.1 dùng "hiện nay" đi với `idāni` → "bây giờ" (10 trên 49; "nay" 13); ở 4.1 và 21.2 đã dùng "lúc này", "thời hiện tại" để không lặp cứng. `idānetarahi vijjati` (21.2) gom hai chữ "nay" thành "nay, vào thời hiện tại", `vijjati` → "đang có" (592 khoá "có").

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `5.1`–`5.2` `Ekosi sannipāto me, sāvakānaṁ mahesinaṁ`: `ekosi` = `eko āsi`; `mahesinaṁ` đọc số nhiều đồng vị với `sāvakānaṁ` ("các đệ tử, những bậc Đại Ẩn Sĩ"). Cách đọc khác: sở hữu cách số ít, "các đệ tử của bậc Đại Ẩn Sĩ" (bản trước ở `vv19:5.4`). Không đủ chứng cứ độc lập để chọn.
  2. `5.3` `Aḍḍhateḷasasatānaṁ`: 12,5 × 100 = 1.250. Pāli không nói "vị"; danh từ lấy từ `bhikkhūnāsi samāgamo` (5.4).
  3. `8.1`–`8.4` `Dasavīsasahassānaṁ … Ekadvinnaṁ`: tôi dịch sát từng con số, "của mười ngàn, của hai mươi ngàn" và "của một, của hai". Cách đọc khác: `dasavīsa` và `ekadva` là cặp số ước lượng ("mười hay hai mươi ngàn", "một hay hai"). Nghĩa tổng thể (lần chứng ngộ của từng nhóm đông, và vô số lần chứng ngộ của từng người một hai) không đổi. Pāli không có danh từ "người/vị", không thêm.
  4. `7.2` `bhavacchandajahesinaṁ`: tách `bhava` + `chanda` + `jaha` + `esin`, "tìm cách dứt bỏ ham muốn hiện hữu". Cách đọc khác: "mong cầu bỏ ham muốn tái sinh" (`bhava` = hữu, tái hữu). Pāli chỉ nói `bhava`, nên dùng "hiện hữu", không giải thích thêm.
  5. `10.3` `Bhikkhūnekasatā sabbe`: đọc `bhikkhū + anekasatā` ("hàng trăm vị tỳ-kheo", chữ `n` là phụ âm nối, không có `n` này thì sẽ là `ekasatā` = một trăm). Cách đọc khác: `bhikkhū ekasatā` = "một trăm tỳ-kheo". Chọn "hàng trăm" theo chữ `n` Pāli viết ra; cả hai cách đều nhất quán với `10.4`.
  6. `16.2` `assayānena nikkhamiṁ`: `yāna` nghĩa chung là phương tiện đi lại; không có chữ `ārūḷha` (cưỡi) hay `ratha` (xe ngựa). "Bằng ngựa" giữ nghĩa phương tiện là ngựa, không quyết định cưỡi hay xe kéo. Cách đọc khác: "bằng xe ngựa" (`dn32:7.28`) hay "cưỡi ngựa" (`dn17:1.13.4`).
  7. `11.1`–`11.4` `Idāni ye etarahi, jahanti mānusaṁ bhavaṁ; appattamānasā sekhā, te bhikkhū viññugarahitā`: đoạn khó nhất của bài. Tôi dịch sát: những vị hiện nay đang từ bỏ kiếp người (chết) khi còn là bậc hữu học tâm chưa thành tựu, những tỳ-kheo ấy bị bậc trí chê trách. Điểm yếu: không rõ `jahanti mānusaṁ bhavaṁ` ở đây là "chết" (như `sn3.4:4.2`) hay "rời bỏ đời sống tại gia"; và `viññugarahitā` có thể là "bị bậc trí chê trách" (như 19 khoá `viññugarahita`) hoặc dạng khác của lời tiếc than; tôi giữ nghĩa thông dụng và không thêm lý do vì sao bị chê. Không có bản Anh hay bản Việt hiện hành độc lập để phân xử cách tách vế giữa `11.2` và `11.3`; cách đọc khác là hai nhóm khác nhau (những vị từ bỏ kiếp người, và riêng các vị hữu học tâm chưa thành tựu bị chê trách). Không đủ chứng cứ độc lập; đây là điểm `ambiguity_integrity` và `grammar_logic` bị hạ.
  8. `12.1`–`12.4` `Ariyañca santhomayantā … Bujjhissanti satimanto, saṁsārasaritaṁ gatā`: `ariyañca` hiểu là `ariyaṁ ca` ("và bậc Thánh"), `ca` nối `santhomayantā` với `dhammaratā`; `ariya` có thể là bậc Thánh hoặc Thánh pháp (Pāli không phân biệt). `saṁsārasaritaṁ gatā` dịch "đã đi vào dòng sông luân hồi" (đang ở trong luân hồi, nhưng vẫn sẽ giác ngộ); cách đọc khác: `gata` là "đi theo/đi dọc", cùng nghĩa với `saṁsārasotamanugatā` ở `mil5.4.7:28.3`. Không thêm "dù" hay "tuy" cho quan hệ nhượng bộ vì Pāli không có.
  9. `22.6` `aggīvāhārasaṅkhayā`: `āhāra` nghĩa gốc là "thức nuôi", ở đây là nhiên liệu của lửa; tôi dịch "nhiên liệu" theo hình ảnh. Cách đọc khác: "như ngọn lửa khi hết nguồn nuôi" (cùng `āhāra` ở `mn9:10.2`, "nguồn nuôi dưỡng"). Không đổi nghĩa lớn; "nhiên liệu" rõ hơn với người đọc hiện đại.
  10. `20.3`–`20.4` `Byāmappabhā sadā mayhaṁ, soḷasahatthamuggatā`: `byāmappabhā` (nữ tính) và `muggatā` (nữ tính) cùng chủ ngữ, nên nghĩa sát chữ là "hào quang một sải luôn có nơi ta, vươn lên mười sáu hattha"; hai khoản đo (một sải, mười sáu hattha) có vẻ mâu thuẫn nếu cùng chỉ một thứ. Truyền thống chú giải có thể hiểu `byāmappabhā` là hào quang bao quanh thân, `soḷasahatthamuggatā` là phần vươn lên; Pāli không nói rõ. Giữ sát chữ, không quy đổi đơn vị, không thêm chủ ngữ.
  11. `22.1`–`22.2` `Ṭhapayitvāna dhammukkaṁ, pacchimaṁ janabodhanaṁ`: `ṭhapayitvāna` dịch "dựng lên" (`ṭhapeti` có thể là "đặt", "dựng", "để lại"); `pacchimaṁ` là "sau cùng" hay "về sau"; `janabodhanaṁ` đồng vị với `dhammukkaṁ` ("ngọn đuốc Pháp, sự đánh thức mọi người lần sau cùng"). Cách đọc khác: "để lại ngọn đuốc Pháp, sự đánh thức cho người đời sau". Giữ sát chữ.
  12. `23.1`–`24.4` `Tāni ca atulatejāni … Sabbaṁ tamantarahissanti`: chủ ngữ của `antarahissanti` ở `24.3` là toàn bộ vế liệt kê ở `23.1`–`23.4` ("những điều ấy", "mười lực này", "thân thể này"); `tāni … atulatejāni` (trung tính số nhiều) không nói rõ chỉ những gì, tôi giữ "những điều ấy" như nguyên văn. `chappabhā` (24.2): có thể là "sáu hào quang" của Đức Phật như danh từ (chủ ngữ), hoặc tính từ đi với `sataraṁsi`; tôi để nó sau phép so sánh, đúng thứ tự Pāli, không quyết định.
  13. `13.2` `rājā suddhodano pitā`: không thêm chữ "của ta" vì `me` ở `13.1` bao trùm ("Thành phố của ta là Kapilavatthu, vua Suddhodana là cha") — đây là phép lược chủ ngữ trong thể kệ.
  14. `19.1`–`19.4`: `aggupaṭṭhākupāsakā` (19.2) và `aggupaṭṭhākupāsikā` (19.4) là từ ghép "thị giả hàng đầu + cận sự nam/nữ"; dịch "các nam cư sĩ là thị giả hàng đầu", "các nữ cư sĩ là thị giả hàng đầu". Chú giải thường hiểu là những người hộ độ tại gia hàng đầu, khác `upaṭṭhāko` ở `18.3` (vị thị giả của Đức Phật là tỳ-kheo Ānanda). Pāli của chính từ ghép đã nói là `upāsaka`/`upāsikā`, nên không thêm gì. `Citto hatthāḷavako ca` đọc là hai người (Citta và Hatthāḷavaka, vì động từ/tính từ số nhiều ở `19.2`); `Nandamātā ca uttarā` cũng hai người. Không thêm danh xưng.
  15. `18.3`–`18.4`: `Ānando nāmupaṭṭhāko` đọc `nāma + upaṭṭhāko`; `santikāvacaro mama` đọc `mama` đi với `santikāvacaro` (cùng cách như `mn32:4.4`).
  16. `9.1`–`9.4` `Vitthārikaṁ bāhujaññaṁ, iddhaṁ phītaṁ suphullitaṁ`: tính từ chung của `sāsanaṁ` ở `9.4`, theo công thức `iddhañceva phītañca vitthārikaṁ bāhujaññaṁ puthubhūtaṁ` (`dn16:3.8.16`, `an8.70:8.3`, `ud6.1:13.2`). `vitthārika` → "được truyền rộng", `bāhujañña` → "được nhiều người biết đến" (như `dn16:3.8.16`), `iddha` → "thành tựu", `phīta` → "thịnh vượng" (20 trên 32 khoá `phīta`). `suphullita` → "nở rộ tươi tốt" (1 tiền lệ `vv35:5.2`). `sāsana` → "giáo pháp" (`tha-ap` các khoá `sammāsambuddhasāsane` đều "giáo pháp"); đếm thô trên nhóm `sāsan-`: "giáo pháp" 50, "lời dạy" 695, nhưng "lời dạy" phần lớn là dạng `anusāsana`/`ovāda`.
  17. `3.1` `Tato parañca desente`: `desente` (định cách tuyệt đối) không có chủ ngữ rõ; dịch "khi đang thuyết giảng" không thêm "ta" vì mạch ngôi thứ nhất của cả bài đã đủ. `3.3` `Gaṇanāya na vattabbo`: "không thể nói bằng cách đếm" (đếm không nổi); cùng cấu trúc với `8.4` `gaṇanāto asaṅkhiyo` ("đếm theo số lượng thì không thể kể xiết").

