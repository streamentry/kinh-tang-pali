  - `22.2` `janabodhanaṁ` "đánh thức mọi người" → "đánh thức người đời" (sửa chính xác): `jana` không mang chữ "tất cả"; chữ "mọi" là lượng từ không có trong Pāli.
  - `11.1` `Idāni ye etarahi` "những vị hiện nay" → "những vị nào hiện nay" (sửa sáng rõ): `ye` là đại từ quan hệ, có `te bhikkhū` ở `11.4` đón lại. Căn cứ cho cách tách vế mới tìm được: `bv3:16.1–16.4` cùng khuôn (`ye keci … jahanti mānusaṁ bhavaṁ; apattamānasā sekhā, garahitā bhavanti te`), cho thấy `11.2`–`11.3` cùng thuộc một mệnh đề quan hệ và `11.4` (`te bhikkhū viññugarahitā`) là vế chính, một nhóm chứ không phải hai; điều này loại cách đọc "hai nhóm khác nhau" ở bất định 7. Không loại được bất định còn lại: `jahanti mānusaṁ bhavaṁ` là "chết" hay nghĩa khác (cả `bv3:16.2` cũng dịch "từ bỏ kiếp người" mà không phân xử).
  - Chứng cứ đo thêm cho các bất định, không đổi chữ: `5.2` `sāvakānaṁ mahesinaṁ` đúng khuôn `vimalānaṁ mahesinaṁ` ở `bv4:10.2` và `bv16:8.4` (cả hai dịch số nhiều đồng vị "những bậc Đại Ẩn Sĩ"), chỉ `vv19:5.4` đọc sở hữu số ít; nghiêng về cách đọc đang dùng nhưng đó là tiền lệ nội bộ, chưa phải chứng cứ độc lập, nên bất định 1 vẫn mở. `22.1` `ṭhapayitvā` đi với hình ảnh Pháp ở `bv26:44.1–44.2` (`dhammavimalamādāsaṁ ṭhapayitvā mahājane` "đặt" tấm gương Pháp giữa đại chúng), hợp với "dựng lên" hơn "để lại"; cũng là tiền lệ nội bộ. `10.3` `anekasatā` ("hàng trăm") khớp `an7.58:8.1`, `mn77:6.20` (`anekasatāya parisāya` "nhiều trăm"). `15.3` `nāma nārī` 13 khoá khác của `bv` đều là "Người nữ tên là …", khớp.
  - Điểm đổi: `terminology` 8.7 → 8.9 (ba sửa thuật ngữ/chính xác có đếm, và gỡ hai ghi chú tiền lệ sai ở trên); `grammar_logic` 8.5 → 8.6 (cách tách vế `11.1`–`11.4` có thêm căn cứ song song, `ambiguity` còn lại ở `8.1`, `12`, `20.4`, `24.2`). Giữ nguyên: `semantic_fidelity` 8.7 và `ambiguity_integrity` 8.8 vì các bất định thật vẫn còn (nghĩa `jahanti mānusaṁ bhavaṁ`, `chappabhā`, `byāmappabhā` với `soḷasahatthamuggatā`, `dasavīsa`/`ekadva`, `bhikkhūnekasatā`); `triangulation` 7,0 vì ba tầng tham khảo vẫn vắng, `technical_integrity` 9,6 và các tiêu chí còn lại không đổi. `final_score` 8,86 → 8,89; blocker `noEnglishEditionUpstream` giữ nguyên, không có blocker nào được xoá. Các thuật ngữ hiếm vẫn chưa phân xử được bằng căn cứ độc lập: `santhomayantā`, `dhammukkā`, `saṁsārasarita`, `vicitta`, `jahesin` (riêng gốc `-esin` đã có tiền lệ), nên chưa nâng thêm.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 7 khoá bất đồng nghĩa → sửa 0, giữ 4, bất định 3. Giữ: bv27:15.3 (bản nguyên bài viết tên người vợ là “Bhaddakaccānā”, Pāli ghim là `Bhaddakañcanā`, theo Pāli); bv27:16.2 (bản nguyên bài “bằng ngựa”, bản này “xe ngựa” theo 17 khoá cùng công thức `…yānena nikkhami` của bv2–bv26; ghi riêng ở phần lỗi ngoài lane); bv27:19.2 và 19.4 (`aggupaṭṭhākupāsakā` bản nguyên bài là “thí chủ hộ độ”, bản này “thị giả”; tầng chưa có tiền lệ khác); bv27:20.4 (bản nguyên bài quy ra mét, bản này giữ `hattha` như 22 khoá khác của bv). Bất định: bv27:12.1 (bản nguyên bài thêm “đạo lộ” vào `ariya`), bv27:12.4 (`saṁsārasaritaṁ gatā`, bản nguyên bài hiểu là còn bị cuốn theo dòng luân hồi, bản này “đã đi vào dòng sông luân hồi”), bv27:22.2 (`pacchimaṁ janabodhanaṁ`, bản nguyên bài hiểu “chúng sinh về sau”, bản này “lần sau cùng”). Mọi số khớp: 18 koṭi, 1.250 tỳ-kheo, 29 năm, 40.000, 25. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn (25 đoạn ứng với 25 khổ kệ), không phải mức khoá; không có bản Anh. Review đối kháng bổ sung: không phát hiện lỗi mới.

