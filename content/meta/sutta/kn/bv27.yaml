notes: |-
  Đợt 19, làn 73. Dịch từ Pāli root commit đã ghim, đủ 103/103 khoá (102 khoá mới; khoá kết `25.1` đã có sẵn từ lần trước, giữ nguyên sau khi kiểm lại: `pañcavīsatimo` = pañca 5 + vīsati 20 = 25, khớp thứ tự phẩm, bv3 = thứ nhất, bv27 = thứ hai mươi lăm), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ hai mươi lăm của Buddhavaṃsa, về chính Đức Phật Gotama, do Ngài tự thuật ở ngôi thứ nhất: ba lần chứng ngộ và hội chúng 1.250 tỳ-kheo, các hội chúng khác, gia thế và xuất gia, chuyển bánh xe, các đệ tử và thị giả, hào quang, tuổi thọ, lời báo sẽ nhập Niết-bàn và lời kết về vô thường. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → "Dòng Kế Thừa Các Đức Phật": dùng lại nguyên văn `bv28:0.1`, `bv29:0.1`, `bv18:0.1` (4/4 tiền lệ).
  - `0.2` "27. Dòng Kế Thừa Của Đức Phật Gotama": cùng khuôn với `bv17:0.2`, `bv18:0.2`.
  - `25.1` giữ "Dòng kế thừa của Đức Thế Tôn Gotama là thứ hai mươi lăm."

  **Số Pāli, đã tự tính.** `aṭṭhārasa` **18** (2.3, "mười tám koṭi"; `aṭṭhārasa` = 18 là số quen thuộc). `aḍḍhateḷasasata` = aḍḍha-teḷasa (nửa tới mười ba, tức 12,5) × 100 = **1.250** (5.3; khớp con số hội chúng 1.250 vị của truyền thống; cùng cấu tạo ở Luật, không có tiền lệ nào trong tầng Việt, vì tìm theo Pāli `teḷasa` được 0 khoá). `dasavīsasahassa` **10.000 và 20.000** (8.1). `ekūnatiṁsa` = eka 1 – ūna (thiếu) từ tiṁsa 30 = **29** (14.1; tiền lệ `tha-ap118:7.1` `Ekūnatiṁsakappamhi` dịch "hai mươi chín kiếp", `tha-ap138:5.1` cùng số). `cattārīsasahassa` 40 × 1.000 = **40.000** (15.1). `caturo` 4 (16.1). `chabbassa` **6** năm (16.3). `dve` 2 (18.2; hai đệ tử thượng thủ nam). `soḷasa` **16** (20.4). `vassasata` **100** năm (21.1). `dvattiṁsa` **32** (23.4; tiền lệ `dvattiṁsa` → "ba mươi hai tướng" 44 trên 48 khoá). `dasabala` **10** lực (23.2; "mười lực" 11 trên 21 khoá). `tayo` 3 (14.4; ba lâu đài khớp ba tên ở 14.3: Ramma, Suramma, Subhaka). `pañcavīsatimo` 25 (25.1). Ba lần chứng ngộ: `paṭhamābhisamayo` (2.4), `dutiyābhisamayo` (3.4), `tatiyābhisamayo` (4.4) = thứ nhất, thứ hai, thứ ba, đúng thứ tự ba đoạn 2–4. Không có cụm `Tiṁsakappasahassa` ở bài này; không dùng số `navuti`, `tālīsa`, `sattati`, `ekanavuti` hay `catunnavuti`.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã publish và draft (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 16 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 51 cặp, trong đó 19 cặp có Việt khác bản tôi viết; 14 khoá dùng đúng nguyên văn ít nhất một tiền lệ. Gồm `0.1` (4 cặp, 0 khác), `1.1` (1, 0), `1.3` (3, 0), `1.4` (7, 6), `2.1` (2, 0), `2.4` (2, 0), `3.4` (2, 0), `4.4` (2, 0), `5.2` (1, 1), `7.4` (1, 0), `10.4` (6, 2), `14.4` (2, 0), `15.2` (8, 3), `16.1` (2, 0), `18.1` (1, 1), `20.2` (7, 6).
  - `1.1` "Nay ta là bậc Chánh Đẳng Giác," = `bv28:19.1`; `1.3` "Sau khi nỗ lực tinh tấn," 3/3; `2.1` "Được Phạm thiên thỉnh cầu," 2/2; `2.4`, `3.4`, `4.4` "đã có lần chứng ngộ thứ nhất/hai/ba." 2/2 (cùng `bv18`); `7.4` "vì thương xót chúng sinh." 1/1; `14.4` "ba lâu đài tối thượng." 2/2; `15.2` "người nữ được trang sức đẹp đẽ;" là dạng đa số (5/8); `16.1` "Sau khi thấy bốn dấu hiệu," 2/2.
  - `1.4` và `20.2` `patto sambodhimuttamaṁ`: 7 tiền lệ, 5 viết "ta đã đạt giác ngộ tối thượng." (cả năm là `cp35`, nơi chủ ngữ chưa hiện ra trong khoá), 1 "đã đạt giác ngộ tối thượng." (`tha-ap547:4.4`), 1 "đã đạt đến Chánh giác vô thượng." (`thag5.5:1.6`). Ở bài này chủ ngữ "ta" đã có sẵn ở `1.1` và `20.1`, nên chọn dạng không lặp "ta", như `tha-ap547:4.4`.
  - `10.4` "luôn luôn vây quanh ta." là dạng của `tha-ap56:5.4` và `tha-ap102:2.4`; hai tiền lệ ngôi "tôi" không dùng vì ở đây Đức Phật tự thuật.
  - `5.2` `sāvakānaṁ mahesinaṁ` lệch tiền lệ duy nhất `vv19:5.4`, nơi bản trước dịch "các môn đồ của bậc Đại Muni" (đọc `mahesinaṁ` như sở hữu cách số ít đi với `sāvakānaṁ`). Ở đây tôi đọc `mahesinaṁ` số nhiều đồng vị với `sāvakānaṁ`, như `ja462:4.2`, `ja462:6.2` (`samaṇānaṁ mahesinaṁ`, 2 khoá), và như `bv18`. Xem bất định 1.
  - `18.1` `Kolito upatisso ca` lệch tiền lệ duy nhất `sn21.12:5.1` ("Kolita, Upatissa,") chỉ ở chữ "và"; chỉ khác hình thức liệt kê, cùng hai tên, giữ "và" cho khớp `ca`.
  - Trùng trong chính bài: 2 nhóm Pāli trùng (`1.4`/`20.2`; `3.3`/`4.3`); bản Việt trong từng nhóm giống hệt nhau (chỉ khác dấu cuối theo Pāli từng khoá: `1.4` kết chấm, `20.2` kết chấm phẩy) ⇒ 0 cặp lệch.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có, gồm cả các bài đang dịch ở những làn song song; so Pāli với bản Việt cùng khoá, đếm số khoá).
  - Tên Đức Phật và địa danh: `Gotama` 2.743 chỗ / 332 tệp; `Sakya` 67 trên 123 khoá chứa `sakya` ("Thích-ca" 18); `Kapilavatthu` 98/42; `Bārāṇasī` 93/52; `Isipatana` 40/29 (giữ nguyên, không dịch "vườn nai" vì Pāli ở đây là `isipatane`, không phải `migadāya`); `Suddhodana` 7/5; `Rāhula` 272/39; `Ānanda` 3.499/224; `Kolita` 6/6, `Upatissa` 6/6; `Khemā` 25/11; `Uppalavaṇṇā` 19/8; `Citta` 136/19 (có cả tên khác); `Nandamātā` 4/3; `Uttarā` 15/9 (lẫn `Khujjuttarā` 10/7, tên một người khác). Chưa có tiền lệ: `Māyādevī` (chỉ có `Māyā` 5/3; giữ dạng Pāli đầy đủ vì Pāli là `māyādevīti`), `Bhaddakañcanā`, `Ramma`, `Suramma`, `Subhaka` (0/0), `Hatthāḷavaka` (0; `Hatthaka` 59/9 là tên khác nên không dùng). Các tên chưa tiền lệ giữ dạng Pāli có dấu theo Pāli từng khoá, như `bv18`.
  - `sambuddha` → "Đức Chánh Đẳng Giác" (17.3), "bậc Chánh Đẳng Giác" (1.1, theo `bv28:19.1`). `sammāsambuddha` đứng riêng giữ "bậc/Đức". `brahmā` (2.1) "Phạm thiên" (`bv17`, `bv18`).
  - `abhisamaya` → "chứng ngộ" (như `bv18`; đã đo ở đó: "chứng ngộ" 14, "thông đạt" 16, "giác ngộ" 10 trên 104 khoá `abhisamay-`); `dhammābhisamaya` (8.2) → "chứng ngộ Pháp".
  - `koṭi` giữ nguyên "koṭi" (như `bv18`, 41 khoá trong tầng). `sannipāta` → "kỳ hội chúng" (`dn14:1.10.1`, `dn14:1.10.2`), `samāgama` → "cuộc tụ hội" (như `bv18`; 15 khoá có `samāgam-`, dạng nghĩa gặp gỡ/hội họp), `desente` (3.1) → "thuyết giảng" (`desemi` ở `dn26:25.5`, `sn42.7` là "thuyết Pháp").
  - `ovadiṁ` (4.2) → "khuyên dạy" (16 trên 49 khoá `ovadi-`; "giáo hóa" 17, "giáo giới" 8, "chỉ dạy" 7; theo toàn nhóm `ovad-`: "khuyên dạy" 31, "chỉ dạy" 29, "giáo hóa" 28 trên 116). `atrajo` → "người con ruột" (`bv18`, 4 trên 11 khoá "con ruột", 3 "người con").
  - `mahesi` → "Đại Ẩn Sĩ" (85 trên 137 khoá chứa `mahesi`; "Đại Tiên" 8, "Đại Hiền" 6). `vimala` → "không cấu uế" (như `bv18`). `virocamāna` → "rực rỡ" (3 khoá `virocam-` trong tầng, mỗi khoá một cách: "rực", "chiếu sáng", "rạng"; không có đa số).
  - `maṇi` → "viên ngọc" (62 khoá "viên ngọc"; "ngọc" 182 trên 821 khoá khớp chuỗi `maṇ`, phép đo thô vì khớp cả từ ghép). `sabbakāmada` → "ban mọi điều ước muốn".
  - `anāsava` → "không còn lậu hoặc" (261 trên 490 khoá chứa `anāsav-`; "không lậu hoặc" 111, "vô lậu" 73). `vītarāga` → "ly tham" (82 trên 172; "lìa tham" 26). `santacitta` → "an tịnh" (31 trên 55; "tịch tịnh" 5). `samāhita` → "định tĩnh" (200 trên 491; "an trú" 53 dùng ở `bv18` vì đi với `bala`). `bhikkhusaṅgha` → "chúng tỳ-kheo" (385 trên 592; "tăng chúng" 228, "tăng đoàn" 108). `sāvakasaṅgha` → "chúng đệ tử" (38 trên 72; "tăng đoàn" 32, "tăng chúng" 23).
  - `catusacca` → "bốn chân lý" (4 khoá "chân lý", 4 "sự thật", 2 "thánh đế" trên 12 khoá; hòa 4/4; chọn "chân lý" theo `tha-ap341:1.3`, cùng động từ `pakāsento`). `pakāsemi` → "tuyên thuyết" (không có tiền lệ cùng cặp từ trong tầng; `pakāsento` ở `tha-ap341:1.3` là "tuyên thuyết"). `anukampā` → "thương xót" (1 tiền lệ nguyên văn).
  - `bhavacchanda`: 1 tiền lệ cùng từ ghép (`cnd7:47.5`, "hữu dục", đứng cạnh `bhavataṇhā` "hữu ái"); dịch từng thành tố: `bhava` "hữu" (`bhavataṇhā` 73 trên 73 khoá đều có "hữu"; lượt cải thiện 2026-10-13 đổi từ "hiện hữu"), `chanda` "ham muốn". `-esin` cuối từ ghép = "tìm cầu" (`hitesinaṁ`, `dhanesinaṁ`, `sukhesinaṁ`, `vibhavesinaṁ`), nên `jahesin` = "tìm cách dứt bỏ"; không có tiền lệ cho riêng `jahesin`. Xem bất định 4.
  - `phala` (7.1) → "quả". `sekha` → "hữu học" (17 trên 24). `appattamānasā` → "tâm chưa thành tựu" (`sn47.4:3.1`, `sn54.11:3.5`; `sn35.134:1.7` "tâm chưa đạt đến cứu cánh"; 8 khoá). `viññugarahita` → "bị bậc trí chê trách" (`an4.193:6.5`, `an4.193:6.6`; "quở trách" 10, "chê" 7 trên 19 khoá). `mānusaṁ bhavaṁ` → "kiếp người" (`sn3.4:4.2` "từ bỏ kiếp người này"; 2 khoá).
  - `ariya` (12.1) → "bậc Thánh". `santhomayantā`: 0 tiền lệ trong tầng; dịch "ca ngợi" theo nghĩa thông thường của từ, không thêm sắc thái. `satimant` → "có niệm" (9 trên 11 khoá). `dhammarata` → "vui thích trong Pháp" ("vui thích" 7, "ưa thích" 6, "hoan hỷ" 4 trên 14 khoá). `saṁsārasarita`: 0 tiền lệ; `sarita` dịch "dòng sông" (nghĩa gốc của `sarita`); `saṁsāra` → "luân hồi" (xem `saṁsārasota` ở `mil5.4.7:28.3`, "dòng hữu"; ở bài này dùng "luân hồi" quen thuộc).
  - `nagara` → "thành phố" (như `bv18`). `rājā` → "vua". `janettikā mātā` → "người mẹ sinh ra" (như `bv18`).
  - `agāra` + `vasati` (14.2) → "sống tại gia" (như `bv18`). `pāsāda` → "lâu đài" (như `bv18`). `nārī` → "người nữ". `nimitta` → "dấu hiệu" (như `bv17`, `bv18`).
  - `assayāna` (16.2) → "xe ngựa" (lượt cải thiện 2026-10-13 đổi từ "ngựa"): đúng công thức `assayānena nikkhami` đã có 4 trên 4 khoá `bv5:21.2`, `bv14:23.2`, `bv16:17.2`, `bv19:19.2` là "bằng xe ngựa"; cặp `hatthiyānaṁ assayānaṁ` "xe voi, xe ngựa" ở 2 khoá `dn32` và 11 khoá `tha-ap`/`thi-ap`; chỉ `dn17:1.13.4` ("ngựa để cưỡi") và `mn129:37.4` ("cỗ xe tốt") dịch lẻ ở ngữ cảnh khác; xem bất định 6. `padhānacāra` → "hạnh nỗ lực tinh tấn" (`bv17:16.3`, 1/1). `dukkara` → "khó làm" (32 trên 108 khoá; "khổ hạnh" 32). `padhāna`: "nỗ lực" 206, "tinh tấn" 164 trên 606 khoá.
  - `cakka` (17.2) → "bánh xe", `dhammacakka` → "bánh xe Pháp" (22 trên 36 khoá `dhammacakk-`; "pháp luân" 8). `saraṇa` (17.4, danh từ nơi nương) → "nơi nương tựa" (21 khoá; "quy y" 277 là nghĩa động từ).
  - `aggasāvaka` → "đệ tử thượng thủ", `aggasāvikā` → "nữ đệ tử thượng thủ" (2/2), `bhikkhunī` → "tỳ-kheo-ni" (216 trên 262). `upaṭṭhāka` → "thị giả", `aggupaṭṭhāka` → "thị giả hàng đầu" (như `bv18`). `santikāvacara` (18.4) → "người thường ở gần" (`mn32:4.4` "vị thị giả và người thường ở gần Đức Phật"; 5 khoá; `dn10:1.5.3`, `dn16:5.4.5` "thường ở gần"). `upāsaka` → "nam cư sĩ" (321 trên 609; "cận sự nam" 15), `upāsikā` → "nữ cư sĩ" (177 trên 218; "cận sự nữ" 0).
  - `assattha` (20.1) → "cây assattha" (`dn14:1.8.7`, `dn14:3.30.6`, `dn14:3.32.6`; Pāli ở đó là `assatthassa mūle`). `byāmappabhā` → "hào quang một sải" (`tha-ap124:4.1` "hào quang một sải", `mil3.6.3:1.2` "hào quang chiếu rộng một sải tay"; "sải" 9 trên 17 khoá `byām-`, "tầm" 2). `hattha` giữ nguyên chữ Pāli (như `bv17:21.2`; 115 trên 356 khoá chứa `hattha`).
