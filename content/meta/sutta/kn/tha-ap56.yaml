notes: |-
  **ĐỌC TOÀN BỘ Pāli TRƯỚC KHI VIẾT.** 36 khoá, in lại cặp Pāli↔Việt sau khi ghi.

    **TẦNG THAM KHẢO — 0/2 khoá có Anh Sujato** ⇒ `draft`, `triangulation` 7.5.

    **DÙNG LẠI NGUYÊN VĂN 8/13 KHOÁ PĦI TRÙNG.** `aho no satthusampadā;` → ôi, sự tròn đầy
    của bậc thầy chúng ta ấy! (1); `Ubbiddhaṁ bhavanaṁ mayhaṁ,` (1); `puññakammassidaṁ phalaṁ.` →
    đó là quả của nghiệp phước. (4); `Paṭisambhidā catasso,` (287); `…pe…` (406);
    `kataṁ buddhassa sāsanaṁ”.` (257); `Sattaratanasampanno,` → Đầy đủ bảy món báu quý giá, (19);
    `cakkavattī mahabbalo.` → là Chuyển luân vương có đại thần lực. (24); `mahābodhimaho ahu;` →
    có đại lễ cúng dường cây Đại Bồ-đề; (1, `tha-ap91:1.2`); `Itthaṁ sudaṁ …` (374/376).

    **TÊN PHẨM — LỆCH CÓ CHỦ Ý, ĐÃ KIỂM CHỨNG.** `Bījanivagga` chỉ có **một** bài đã dịch trong
    phẩm (`tha-ap55`) và bài đó dùng *Phẩm Cái Quạt*. Tôi **không** nhân bản, vì:
    (1) `bīja` = hạt/giống, không phải *cái quạt*; tôi đã tra toàn bộ Pāli đã ghim (5.764 tệp)
        và `Bījanivagga` chỉ xuất hiện đúng 10 lần, **không chỗ nào chú giải nghĩa**;
    (2) tầng `name/` của chính SuttaCentral (tầng Anh, 619 khoá cho `tha-ap`) có mục cho
        `Kuṇḍadhāna`, `Upāli`, `Nāgasamāla`, `Timira`, `Naḷamāliya` nhưng **KHÔNG có**
        `Bījanivagga` — nên không có cách nào để đối chiếu;
    (3) 7 phẩm còn lại trong lát đều theo phong cách giữ tên Pāli.
    Vì vậy tôi giữ **Phẩm Bījanivagga** và ghi lý do ở đây. Đây là cách N+1 trên số 1 hiện có —
    nhưng nhân bản một nghĩa không có cứ là bịa, mà `AGENTS.md` cấm. **Coordinator quyết nếu
    muốn thống nhất theo hướng khác.**

    **2 KHOÁ LỆCH ĐA SỒ, LỆCH CÓ LÝ DO.**
    (a) `“Padumuttarabuddhassa,` — tiền lệ duy nhất là *“Nơi cội bồ-đề thù thắng tối thượng,*
        (1), tức đọc `buddhassa` là *cội bồ-đề*. Sai: đây là **bài hát của Đức Phật Padumuttara**
        (tương tự `Siddhatthassa bhagavato` ở `tha-ap42:1.1` và `Vipassissa bhagavato` ở
        `tha-ap91:1.1`, cả hai đều đã dịch *Của Đức Thế Tân …*). Tôi dịch **“Của Đức Phật
        Padumuttara,** và dùng lại nguyên văn `:1.2` của `tha-ap91` để hai vế khớp nhau.
    (b) `Gandhodakiyattherassāpadānaṁ catutthaṁ.` (:10.1) — tiền lệ đúng câu này là *Ký sự về
        Trưởng lão Gandhodakiya, thứ tư.* (1). Nhưng cả lục kết trong tha-ap đang tách làm hai
        nhánh: *Bài Kệ Tuyên Ngợ Về Trưởng Lão <tên>* (114/287) và *Ký sự về Trưởng lão <tên>*
        (31/287). Tôi chọn nhánh **đa số** cho cả lát (và cùng nhánh với `:0.3` của chính bài này),
        không vì câu đúng hơn mà vì cả 8 bài của lát phải nói một cách.
    (c) `Ubbiddhaṁ bhavanaṁ mayhaṁ,` — tiền lệ 1 lần dùng *tôi*, tôi dùng **ta** để khớp với
        `puññakammassidaṁ phalaṁ.` mà tôi dùng lại nguyên văn (*đó là quả của nghiệp phước.*, 4
        lần) và với giọng *ta* xuyên suốt bài.

    **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
    · `mahābodhimaho` (`:1.2`) — `maho` là hậu tố tôn vinh (`-m-aho`), câu này xuất hiện ở **4** bài
      cùng công thức (`tha-ap91`, `tha-ap306`, `tha-ap434` và đây). Tôi dùng lại nguyên văn `tha-ap91`
      để bốn bài nói một cách, nhưng cách ấy **thêm** *đại lễ cúng dường* — Pāli không có động từ
      này. Đây là điểm yếu ngữ nghĩa có sẵn trong tiền lệ; tôi giữ để nhất quán và ghi ra đây
      thay vì âm thầm tạo cách thứ N+1.
    · `Ninnādo` / `asaniyā phalantiyā` (`:2.3–2.4`) — `ninnāda` = tiếng reo vang, `asani` = sấm
      sét. 0 tiền lệ trong toàn tầng. Tôi dịch *có tiếng reo vang dội lớn, / tiếng sấm đang rơi
      xuống.* rồi `:3.1` `Tenevāsanivegena` = *Chính vì tiếng sấm ấy giục dẫy,* — mối liên hệ
      chủ đề giữa hai câu kệ là của Pāli, tôi giữ.
    · `Kaḷevara` (`:4.3`) — tên thần chết trong Pāli; giữ nguyên Pāli như tầng đang làm với các
      danh từ thần (`Yama` không xuất hiện). 0 tiền lệ.
    · `Aṭṭhavīse kappasate` (`:7.1`) — tám trăm NGHÌN kiếp, **khác** `Aṭṭhārase kappasate` ở
      `tha-ap50:7.1` là một ngàn tám trăm. Tôi dịch phân biệt hai số này; đó là lý do hai bài trong
      cùng lát không dùng lại cùng một công thức.

    **DẤU LƯỢC.** `:8.2` là `…pe…` → **đúng một** `…`.

    **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:8.3`; **thêm** nháy cong `‘` mở ở `:4.1` và `’`
    đóng ở `:6.4`, vì Pāli có hai tầng đó. Tự đếm lại: cân.

