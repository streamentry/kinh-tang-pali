notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Tự quét 9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu
  lược khớp, nháy kép cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 1.5.

  BÀI SẠCH NHẤT LÁT SAU thag1.61: bốn vế là ba tà lập đức và một tâm trạng. `rāga` → *tham*,
  `dosa` → *sân*, `moha` → *si* theo đúng tiền lệ iti68:2.3 và iti69:2.3 (tham đã được đoạn
  trừ, sân đã được đoạn trừ, si đã được đoạn trừ), nên đây là Pāli trùng NGHĨA và tôi dùng
  đúng bộ ba đó. Đừng dịch thành lận tình hay mê lầm — ba chữ đó phải khớp với chỗ khác trong
  tầng, không phải chỉ khớp trong bài này.

  `pahīno` → *đã được trừ bỏ* (động từ bị động quá khứ, tiền lệ iti68/iti69), `samūhato` →
  *đã được lắng dịu* (`ūha` là lắng dịu, 2 lượng ngoài lát), `vigato` → *đã tan biến*,
  `me` → *của ta* (sở hữu cách, tôi dịc *ta* cho tự nhiên vì câu đã là lời vị ấy).
  `sītibhūtosmi` → *ta đã mát lạnh*: `sīti` là mát, `bhūto` là trở thành. `nibbuto` → *vắng
  tanh*: chữ này có 0 tiền lệ ở tầng này (chỉ xuất hiện trong bv chưa dịch), tôi chọn *vắng
  tanh* vì `nibbuta` vừa là dập tắt vừa là thái thác; Sujato dịch *quenched* (dập tắt).
  Nếu biên tập muốn thống nhất với Nhất thiết trung tạo ở tầng Anh thì đây là chỗ nên đổi.

  `sabbo` lặp ba lần ở 1.1, 1.2, 1.3 và tôi dị *Mọi* cả ba — đây là nhịp liệt kê của Pāli,
  không phải lặp vụng.
