notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud6.2:9.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud6.2:9.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 6.1–6.3 (và 6.4, 7.4–7.6 cùng bài) — ‘chỉ do sống
  chung mới biết được giới hạnh của một người. Và điều ấy phải lâu dài, không phải tức thời; phải
  tác ý, không phải không tác ý; phải do người có trí, không phải kẻ thiếu trí’ → ‘Do sống chung,
  này Đại vương, mà có thể biết được giới. Và điều ấy cần thời gian dài, không phải thời gian ngắn;
  cần người chú tâm, không phải người không chú tâm; cần người có trí tuệ, không phải người không
  trí tuệ’; tương tự ‘sự trong sạch’, ‘sự kiên trì’ (`thāmo`, trước là ‘sức mạnh’), ‘trí tuệ’. Lý
  do: Pāli không có ‘chỉ … mới’ và ‘của một người’; `manasikarotā`, `paññavatā` là thể công cụ chỉ
  người (‘nhờ người chú tâm / có trí tuệ’), không phải tính chất của điều được biết. Khớp sn3.11
  (cùng đoạn đối thoại) và an4.192. Giữ nguyên khoá 1.4: Udāna dùng ‘Đức Thế Tôn’ cho `bhagavā`
  trong cả bài (1.2, 4.1).
