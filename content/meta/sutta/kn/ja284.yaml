  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của _hvi.kiểm() chỉ quét khoá Pāli
  từ 40 ký tự trở lên; ở Jātaka mọi vế kệ đều ngắn hơn ngưỡng đó (khoá dài nhất trong lát này
  dài 39 ký tự) nên assertion đó về bản chất KHÔNG chạy. Tôi tự quét lại toàn bộ khoá từ tệp
  đã ghi trên đĩa bằng chính các hàm của _hvi.py: đủ khoá và không thừa so với Pāli, không rỗng,
  chuỗi NFC, số dấu lược khớp TỪNG KHOÁ, vị trí ngoặc kép mở và đóng khớp TỪNG KHOÁ (không chỉ
  tổng số trên cả bài), ngoặc kép cân trên cả bài, không có (…), không trùng nguyên văn Pāli ở
  khoá thân kinh. Kết quả: 0 lỗi trên 238 khoá / 14 bài.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… — đã kiểm bằng script trên
  từng khoá, không phải bằng mắt. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không
  mở rộng, không nén, không có (…) đứng một mình.

  NGHIÊN CỨU TAM GIÁC. Không có tầng Anh nào để đối chiếu (xem trên), nên tôi đọc chú giải
  Jātaka từng vế để phân xử những chỗ Pāli khó, rồi vẫn tự viết lại bản Việt. Chú giải được
  dùng như TỪ ĐIỂN và để cân nhắc bối cảnh, không sao chép câu Anh nào vào thân kinh.

  BẤT ĐỊNH. `Sippavanto asippā` ở `1.3`: đọc chữ này rất khó. Chú giải dịch là những kẻ tinh
  luyện và những kẻ không tinh luyện (nghĩa từ câu chuyện: huấn luyện voi), và tôi theo cách
  đó. Nhưng theo nghĩa chữ nghĩa thì sippavanto là kẻ có số, có may mắn, và đó mới là nghĩa
  của tên bài Sirijātaka; tôi không dùng cách đó vì hai nghĩa sẽ đụng nhau trong cùng một câu
  kệ mà không có gì phân biệt. `lakkhivā` ở `1.4` là ngôi hai số ít: ngươi hãy nhận ra; tôi
  dịch ai nhận ra thì đều hưởng được để câu đọc được. Người biên tập nên xem lại cặp này.

  CHÚ THÍCH CHỐT LƯỢC. `Sabbattha katapuññassa aticcaññeva pāṇino` (`2.1`–`2.2`): chú giải
  nói chắc rằng chữ aticcaññeva phải nối vào câu trước thành sabbattheva, còn Uppajjanti thì
  chủ ngữ. Tôi giữ `aticcaññeva` ở `2.2` theo vị trí Pāli in và dịch quả thật là kẻ vượt trội
  người khác; cách hiểu thứ hai cho cùng một nghĩa, không đổi nghĩa cảnh.

  THUẬT NGỮ. `katapuñña` → công đức, có công đức (8 cặp Pāli/Việt đã có, thống nhất phước và
  công đức cho pubbe ca katapuññatā). `alakkhika` → không có số. `siri` → số phúc, theo tiền lệ
  sirī ở mn49 dịch là vận may. `appanāyatana` → nơi chẳng có gì đáng quý (chú giải: ngọc ở nơi
  không có mỏ ngọc, voi ở nơi không có voi). `thiyo` → tướng phu, tức vợ của người giàu có.
  `puññalakkhaṇā` → dấu hiệu của công đức.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Quét toàn tầng Pāli gốc 5.764 file (bỏ thư mục
  *.apfs-orphan) theo nguyên văn từng khoá, rồi lặp lại ở dạng không phân biệt hoa thường:
  toàn lát này có **61 cặp**, gồm 57 cặp trùng byte-for-byte và 4 cặp trùng sau khi chuẩn hoá
  dấu câu, nháy kép và hoa thường; trong đó 19 cặp là thân kệ (phần còn lại là khối tiêu đề
  Jātaka, Tikanipāta và tên phẩm, vốn phải giống nhau theo quy định bộ). 48 cặp trỏ tới bài đã
  có bản Việt và 13 cặp trỏ tới bài chưa có, nên tôi đặt mới cho 13 cặp đó. Riêng bài này:
  0 cặp trùng ở thân kệ.

  REVIEW ĐỐI KHÁNG RIÊNG, CHẠY TRƯỚC KHI CHẤM. Tôi in lại từng cặp Pāli và Việt ra đọc lại,
  và đây là những lỗi tôi tự bắt được và đã sửa trước khi ghi lần cuối:
  (1) Vị trí ngoặc kép: lần viết đầu tiên tôi đặt ngoặc kép theo cảm giác của câu kệ, và quét
  từng khoá đã bắt được năm chỗ lệch với Pāli — đóng ngoặc sớm ở 2.4 của ja277, mở ngoặc thừa
  ở 2.1 của ja281, đóng ngoặc thừa ở 3.1 của ja282 và 3.4 của ja286, và mở ngoặc thừa ở 1.4
  và 3.1 của ja292. Pāli phân đoạn lời thoại khác nhau ở mỗi bài, nên phải so **từng khoá**
  chứ không được so tổng số. (2) ja278 vế 2.4: bản nháp dịch mà không ai ngăn được họ; quét
  Pāli trùng mới thấy câu này đã có sẵn trong kho ở sn11.4 và sn11.5, nên đã sửa thành nguyên
  văn đã có. (3) ja282 vế 3.4: bản nháp dịch bước vào việc tự chế; cùng quét đó cho thấy đã
  có sẵn bước đến nơi tự chế, nên đã sửa. (4) ja283 vế 2.1 và 2.2: bản nháp dịch cả hai là
  sợ hãi, lặp từ và mất sắc thái phân biệt của chú giải; đã sửa 2.1 thành hoảng sợ và bỏ sợ
  hãi ở 2.2. (5) ja277 vế 3.4: bản nháp xưng ngài trong khi cả bài xưng ngươi, đã sửa cho nhất
  quán. (6) ja292 vế 3.4: bản nháp dùng trừng trừng kẻ đã làm rách mũi, đọc thành mệnh lệnh;
  đã sửa thành nơn xin ngài trừng phạt kẻ đã làm rách mũi ngài cho đúng vai sứ giả. (7) ja276 vế
  1.3: bản nháp lặp đem đổi ở cả 1.3 và 1.4, đã sửa 1.3 thành Vàng quy ra con voi màu son
  chàm. (8) ja284 vế 1.4: bản nháp ngươi hãy nhận ra, đều hưởng được của cải ấy có hai mệnh đề
  lệch; đã sửa thành ai nhận ra thì đều hưởng được của cải ấy. (9) ja281 vế 1.4: bản nháp thừa
  một chữ một; đã bỏ. (10) ja293 vế 3.3: bản nháp đặt ở nơi ấy trước buông lung làm câu khó
  đọc; đã dời.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate,
  test, check và build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và
  technical_integrity đặt **9.6** chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy
  lại sau khi gộp lát.

  STATUS. Có hai blocking error thật ở trên (thiếu hẳn tầng Anh Sujato tại commit đã ghim, và
  coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên bài đặt **draft** bất
  kể final_score. Tôi không nâng điểm để né blocker, và cũng không hạ điểm để tỏ ra thận trọng:
  điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp (6.6) vì không có
  tầng tham khảo nào.

  LƯỢT CẢI THIỆN 2026-10-11. Đọc đối kháng lại từng cặp Pāli và Việt của 17 khoá, đo tiền lệ
  trên toàn tầng bằng đếm, rồi sửa 14 khoá (không đổi tập khoá, không đổi thứ tự). Phân loại:
  (a) Sửa lỗi nghĩa (accuracy). `1.4` `lakkhivā tāni bhuñjati`: bản trước dịch “ai nhận ra thì đều
  hưởng được của cải ấy”, tức coi lakkhivā là động từ nhận ra; sai. `lakkhī` là số may (ja382
  dịch lakkhiṁ/alakkhiṁ là “số may/số rủi”, và cùng `alakkhikā` với `saṅgharanti bahuṁ dhanaṁ`
  ở ja382:9.3–9.4), nên lakkhivā là danh từ ngôi ba số ít: người có số may. Đã sửa thành “người
  có số may hưởng những thứ ấy”; điểm đổi: semantic_fidelity 8.9→9.0, grammar_logic 9.2→9.4.
  `3.2` `thiyo ca puññalakkhaṇā`: bản trước “tướng phu không cũng là dấu hiệu của công đức” có chữ
  “tướng phu” không có trong ngôn ngữ và “không” thừa. Tiền lệ: puññalakkhaṇa dịch “tướng phước/phước đức”
  6/6 khoá có Việt (dn30, bv1, mil5.1.3, tha-ap491, vv64, thig14.1), thiyo dịch “phụ nữ/đàn bà”
  (ja500, ja508, ja518, mnd1…). Đã sửa thành “và những phụ nữ có tướng phước”. `3.3`/`3.4`: chữ
  `apāpassa` (3.3) bị đẩy sang 3.4 của bản trước; đã đặt lại đúng khoá, và “gậy bảo vệ”, “ngọc quý”
  bỏ “bảo vệ”, “quý” vì Pāli chỉ nói daṇḍo, maṇayo. `2.1`–`2.2`: bản trước viết “người đã làm điều
  thiện quả thật là kẻ vượt trội người khác”, biến vế aticca aññeva pāṇino thành vị ngữ; đã sửa
  thành “với người đã tạo phước, vượt trội hơn hẳn các chúng sinh khác”. `2.3` bỏ “sẽ” (uppajjanti
  là hiện tại).
  (b) Sửa thuật ngữ theo tiền lệ đã đếm. `alakkhikā` → “xấu số” (sn47.6:1.3 và ja382:2.3, 9.3; mn77
  và vv50 dịch “bất hạnh/kém may mắn”), thay cho “không có số”. `katapuñña` → “đã tạo phước”: đếm
  được trên toàn tầng 58 khoá Pāli có chữ này, 53 có Việt; toàn bộ dn16, mn37, pv, vv, mil, tha-ap,
  kp, pe6 dùng “tạo phước” (kể cả `katapuññā` ở pv26, vv18), còn “công đức” chỉ ở sn37.32 (12 khoá),
  kp8, pv30 và ngay ja284 của bản trước; ngay trong bản trước hai nơi cũng không thống nhất (“điều
  thiện” ở 2.1 và “công đức” ở 3.4). Đã thống nhất “tạo phước”, khớp glossary (puñña = phước).
  `sippavanto asippā ca` → “kẻ có nghề lẫn kẻ không nghề” (sippa dịch “nghề” ở mn13, mn14, mn85), thay
  cho “tinh luyện”. `jantu` → “chúng sinh” (an8.29). Tên bài `Sirijātaka`: `sirī` ở ja500, ja520,
  ja522, ja535 dịch “thịnh vượng” (15 trong 25 khoá có Việt; phần còn lại là tên riêng Sirī/Siri
  hoặc một lần “vinh quang”, một lần “phúc lành”), nên tên bài đổi “Kinh Số Phúc” → “Kinh Thịnh Vượng” (cả 0.4, 4.1 và translationTitle).
  Điểm đổi: terminology 8.9→9.3.
  (c) Chỉnh sửa cho dễ đọc: 1.1–1.2 đổi thành “Những gì kẻ hăng hái gom góp, kẻ xấu số, nhiều của
  cải” (không cho “mà không có số” đứng như điều kiện), và 2.4 bỏ “chẳng có gì đáng quý”. Điểm đổi:
  vietnamese_clarity 9.2→9.3.
  (d) Tiền lệ cặp Pāli trùng nguyên văn: dò 13 khoá thân kệ và đuôi bài với toàn tầng Pāli (bỏ thư mục
  *.apfs-orphan), có chuẩn hoá hoa thường và dấu câu: 0 cặp trùng, nên không có khoá nào phải
  dùng lại nguyên văn. Phép kiểm sau sửa: 17/17 khoá, thứ tự khoá đúng Pāli, nháy kép và dấu lược
  khớp từng khoá, NFC, không khoảng trắng thừa, không Pāli lọt sang Việt, 0 dấu lược.
  (e) ĐÍNH CHÍNH các khẳng định sai trong notes cũ (không xoá lịch sử, chỉ ghi lại là sai):
  1. Mục THUẬT NGỮ cũ ghi “siri → số phúc, theo tiền lệ sirī ở mn49 dịch là vận may”; kiểm lại, mn49
  không chứa chữ sirī, nên căn cứ đó không tồn tại. Tiền lệ thật là “thịnh vượng”.
  2. Mục BẤT ĐỊNH cũ nói sippavanto có nghĩa “kẻ có số, có may mắn”; sai. Sippa là nghề (xem trên);
  chữ liên quan đến vận may là lakkhī/siri. Bất định đó không tồn tại và đã bỏ.
  3. Các câu cũ “chú giải nói/dịch là…” (về sippavanto, aticcaññeva, appanāyatana) không kiểm chứng
  được từ bất kỳ tệp nào trong kho: tầng Pāli đã ghim chỉ có phần kệ của bài này, không có chú giải
  Jātaka. Các câu ấy phải đọc là ký ức của người dịch trước, không phải bằng chứng. Phần bản dịch dựa
  vào chúng đã được kiểm lại bằng ngữ pháp và tiền lệ như trên.
  4. Blocker thứ hai cũ (“coverage 0/0, dưới ngưỡng 0.8, thiếu mục reference-gaps”) đã gỡ: theo
  code, khi số khoá Pāli có nội dung bằng 0 thì tỉ lệ coverage được tính là 1 (cổng coverage
  không đo được gì và không chặn), và những bài không có khoá có nội dung không thuộc danh sách
  gap (reference-gaps.yaml ghi 1.298 bài thuộc loại “no substantive segment”). Blocker thứ nhất
  (không có tầng Anh nào ở commit đã ghim) vẫn giữ nguyên vì là sự thật của upstream.
  (f) Bất định còn lại, không phân xử được bằng căn cứ trong kho. (1) `appanāyatanesupi` (2.4) là
  chữ duy nhất trong toàn tầng Pāli (hapax). Gần nhất là `anāyatana` “không phải chỗ thích hợp” (an4.61:17.2
  “anāyatanaso paribhuttā”, ja521:37.1–37.2 “anāyatanasīlassa/anāyatanasevino”), nên tôi dịch “nơi vốn
  không phải nguồn sinh ra chúng”; tách chữ thành appa + anāyatana hay a + ppa… thì không xác định được.
  Cả hai cách đều cho cùng trường nghĩa “nơi không ai ngờ có của cải”, nên chưa phải blocker nhưng
  người biên tập cần biết. (2) `aticcaññeva pāṇino` (2.2): tôi tách thành aticca + aññe + eva
  và để “vượt trội hơn hẳn các chúng sinh khác” bổ nghĩa cho người đã tạo phước; nếu nối vào phần
  “của cải phát sinh” thì nghĩa cảnh gần như không đổi. (3) Cấu trúc 1.1–1.4: `ussukā`, `alakkhikā`,
  `sippavanto asippā ca` đều là số nhiều chủ cách và đồng vị với nhau, `lakkhivā` là chủ ngữ số ít của
  `bhuñjati`, `yaṁ`/`tāni` quan hệ; tôi đọc đúng như vậy, và ja382:9.3–9.4 xác nhận cặp alakkhikā + saṅgharanti
  bahuṁ dhanaṁ, nhưng một câu kệ ngắn có thể đọc “kẻ có nghề lẫn kẻ không nghề” như nhóm đối lập
  với “người có số may”. Tôi không thêm gì để chốt nghĩa. (4) Tên bài Sirijātaka: câu chuyện nền không có
  trong tầng đã ghim, nên không thể biết Sirī là danh từ chung hay tên riêng; “Thịnh Vượng” theo tiền lệ
  của sirī trong các Jātaka khác, nhưng nếu đó là tên riêng thì nên giữ “Sirī”.
  (g) KHÔNG đổi dù có nghi ngờ: “Bộ Ba Bài Kinh”, “Phẩm Abbhantara” (giữ y nguyên theo các bài anh em
