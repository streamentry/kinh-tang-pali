notes: |-
  Lát v7/7: 12 bài Jātaka Ekakanipāta (Dūkaṇipāta), 156 khoá, dịch đủ MỌI khoá
  trong `all` của v7/v7.json. Đã đọc HẾT v7/p7.txt trước khi viết.

  **Sàn coverage 80% KHÔNG kích hoạt — nhưng ô Anh trống KHÔNG phải sự đồng
  thuận.** Đo được: mọi vế kệ của Ekakanipāta đều NGẮN HƠN 40 ký tự (156 khoá,
  `substantiveSegments = 0`), nên `englishCoverageFor` cho `ratio = 1` và bài
  không cần entry trong `content/meta/reference-gaps.yaml`. Hệ quả thật: hàm
  `kiểm()` của `_hvi.py` lọc `cần = [k for k in p if len(p[k]) >= 40 …]` nên
  `cần` RỖNG ở cả 12 bài, và **NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu
  lược không tự chạy**. Tôi đã tự kiểm thủ công đủ 156 khoá bằng một lớp kiểm
  riêng áp đúng các quy tắc đó lên MỌI khoá (0 lỗi), và đọc đối kháng từng cặp
  Pāli ↔ Việt. Tầng Việt tham khảo (Hòa thượng Thích Minh Châu) ở commit đã
  ghim chỉ có Pháp Cú, nên không có bản Việt nào để đối chiếu cho 12 bài này —
  đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho.

  **Dấu lược:** không khoá nào trong 12 bài có `…pe…` hay `…`, nên cả hai phía
  đều 0. Không mở rộng, không thêm, không bớt.

  **Ngoại lệ đã đo, không phải lỗi:** khoá `:0.1` = `Jātaka` trùng nguyên văn
  Pāli ở **128/128** tệp `kn/ja*` có cả hai khoá (đếm bằng script, không suy đoán).
  Tôi giữ nguyên theo đúng tiền lệ ấy và nêu ở đây.

  **Thiếu tầng Anh:** xem `blocking_errors`. Chỗ nào Sujato im lặng thì tôi dịch
  từ Pāli; ô Anh trống ở đây KHÔNG được đọc là đồng thuận về cách dịch.
  **[Đã thu hồi 2026-10-13] Đoạn ghi chú cũ về `saviṭṭhaka`, `vīraka`, `tassānukaraṁ` là SAI.**
  Bản trước đọc `saviṭṭhaka` là từ thô chỉ bộ phận sinh dục nữ và dịch "khe khúc";
  nhận định đó không có căn cứ và đã bị gỡ khỏi bản dịch. `Saviṭṭhaka` là TÊN RIÊNG của
  con quạ chồng (bảng tóm lược cuối `ja210:5.2` cũng liệt kê `Saviṭṭhaka` như một tên
  nhân vật/bài), và `Vīraka` là tên con quạ đầm nước (tiền thân Đức Bồ-tát) mà vợ
  Saviṭṭhaka hỏi. Hai kệ là đối thoại: kệ 1 do người vợ hỏi Vīraka, kệ 2 do Vīraka đáp.
  Phần nhân vật và người nói đối chiếu với bản Anh của chuyện cổ (dịch Rouse, hiệu đính
  Cowell) và mục Vīraka-jātaka trong từ điển tên riêng Pāli; các nguồn đó nằm NGOÀI các
  tầng đã ghim nên chỉ dùng để hiểu nhân vật, không chép câu chữ.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja204:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  **Lượt cải thiện 2026-10-13.** Đọc đối kháng cặp Pāli ↔ Việt cả 13 khoá, đổi 8 khoá
  (`1.1`–`1.4`, `2.1`–`2.4`); `0.1`–`0.4`, `3.1` giữ nguyên.
  - `1.4` "chồng ta ở trong khe khúc ấy" → "chồng tôi, Saviṭṭhaka" (accuracy fix, lỗi
    nghiêm trọng: `saviṭṭhakaṁ` đồng vị với `patiṁ mayhaṁ`, là tên riêng, không phải danh
    từ thô; lời "khe khúc" là thêm nghĩa không có căn cứ). `2.3` "kẻ bắt chước loài ấy, có
    khe khúc" → "Saviṭṭhaka bắt chước nó" (cùng lỗi; `tassa` là loài chim nước ở `2.1`–`2.2`).
  - `1.2` bỏ "chim đen" (Pāli `sakuṇaṁ` chỉ nói "chim", không có "đen"); `mañjubhāṇaka` →
    "giọng nói ngọt ngào" theo tiền lệ "giọng ngọt" (5/7 khoá có `mañjubhāṇ-` ở toàn tầng, ja542/ja547;
    hai khoá còn lại "êm dịu", "dịu dàng"; "dễ nghe" không có tiền lệ).
  - `1.3` "có dáng vẻ tiếng công gọi" → "có vẻ như cổ chim công": `gīva` là cổ, không phải
    tiếng gọi; khớp đúng `ja295:2.3` ("có vẻ như cổ chim công"), `ja547:381.1` ("Màu như cổ
    chim công").
  - `2.4` "đã chết bám chặt trong bùn" → "bị rong rêu quấn chặt, đã chết": `sevāla` là rong
    rêu (đa số khoá có `sevāla` ở toàn tầng dịch "rong rêu", 0 khoá dịch "bùn"), Pāli không có "bùn"; `paliguṇṭhita` →
    "quấn chặt" theo `mil2:32.4` ("quấn chặt").
  - `2.1` "Chim sống nơi mép nước" → "Loài chim đi lại trên nước và trên cạn": `udakathalacara`
    = đi lại ở nước và đất liền; "mép nước" là thu hẹp không có trong Pāli. `2.2`
    "ăn thường thịt sống thô" → "luôn ăn cá sống": `āmakamaccha` là cá sống, không phải "thịt".
  - `1.1` "Ngươi có thấy không, hỡ Vīraka" → "Này Vīraka, ông có thấy không" (vợ hỏi một con
    quạ cùng loài; "ngươi/hỡ" nặng giọng không có trong Pāli).
  Điểm đổi: `semantic_fidelity` 8.7 → 9.1; `grammar_logic` 8.8 → 9.0 (người nói/đối tượng
  và vế `tassa` đã đúng); `terminology` 9.0 → 9.1 (tên riêng `Saviṭṭhaka` thống nhất, các từ
  theo tiền lệ); `vietnamese_clarity` 9.1 → 9.2; `ambiguity_integrity` 8.5 → 8.8 (đã gỡ một
  nhận định sai và ghi rõ nguồn ngoài tầng). Không đổi các tiêu chí khác;
  `triangulation` giữ 7.0 vì bài vẫn không có bản Anh độc lập đã ghim.
  Bất định còn lại: (1) người nói của hai kệ lấy từ truyện kèm theo ngoài tầng, kệ tự
  nó không ghi; (2) `udakathalacara` hiểu là chim "đi lại trên nước và trên cạn" — `thala`
  có thể chỉ đất liền nói chung; (3) tên phẩm `Nataṁdaḷhavagga` → "Phẩm Bó Lúa" (`0.3`)
  nhất quán 10/10 trong ja201–ja210 nhưng không thấy căn cứ trực tiếp từ Pāli — chưa đổi vì
  sửa một tệp sẽ lệch cả phẩm, báo để xử lý đồng bộ. Công cụ kho (`npm run validate`,
  `npm test`, `npm run check`, `npm run build`) chưa chạy ở lượt này, nên
  `technical_integrity` giữ 9.6.

  Sửa lan 2026-10-13: khoá `ja204:0.3`, *Phẩm Bó Lúa* → *Phẩm Không Bền Chắc* (accuracy fix). Căn cứ: Pāli `Nataṁdaḷhavagga`, tên lấy từ câu mở `ja201:1.1` `Na taṁ daḷhaṁ bandhanamāhu dhīrā`, không có chữ nào mang nghĩa *bó lúa*; theo bài mẫu `ja206:0.3` (đã sửa) và tầng tên SuttaCentral đã ghim (`ja-name`, *That is Not Strong*). Trong phẩm này (`ja201`–`ja210`), `ja206` đã đúng, 9 bài còn lại (kể cả `ja204`) có *Phẩm Bó Lúa* trước lượt này; ngoài lane, 8 bài còn lại là `ja201`, `ja202`, `ja203`, `ja205`, `ja207`–`ja210`. Khoá `ja204:0.4` (`4. Vīrakajātaka`) giữ nguyên. Chưa sửa `translationTitle` vì meta khớp tiêu đề bài (`0.4`), không phải tên phẩm.
