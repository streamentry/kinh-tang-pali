notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trực tiếp trong
  source/upstream-manifest.json, editions[english-sujato] không có mục nào cho ja153). Vì
  vậy status là draft và blocker là thật, không phải hạ điểm né cổng. Toàn bộ 13 khoá dịch
  từ Pāli, không dịch vòng qua bản nào khác.
  `cần` trong kiểm() RỖNG (mọi vế ngắn hơn 40 ký tự) nên assertion không tự chạy; đã tự
  kiểm mọi khoá — 0 lỗi; ghi lại `save_vi` lần hai ra tệp y hệt từng byte.
  Tiền lệ, có đếm: Jātaka = Jātaka (102 bài đã có); Dukanipāta = Bộ Hai Bài Kinh (4 bài
  thig2/thag2); số thứ tự trong `:3.1` viết không dấu phẩy như ja15:2.1 và ja16:2.1 (2
  tiền lệ so với 1 của ja159:5.1); nhấy kép phải mở ở 1.1 VÀ 2.1, đóng ở 1.4 và 2.4, đúng
  như Pāli (đã bắt lỗi mất một dấu mở ở lần đầu).
  KHÔNG CÓ TIỀN LỆ, ghi rõ lý do theo luật kho: (1) Daḷhavagga chưa có bản Việt nào trong
  tầng — chọn Phẩm Tàn Tật, khớp với cách dịch `daḷha` = tàn tật đã dùng 2 lần trong tầng
  (dn, mô tả thân người: một mắt, hoặc tàn tật, hoặc què quặt). (2) Sūkarajātaka chưa có
  tiền lệ — dịch theo nghĩa sūkara = heo, không bịa cốt truyện.
  BẤT ĐỊNH 1: `jayaṁ samma dadāmi te` nghĩa đen là ta sẽ cho ngươi sự thắng trận. Người
  nói là con rắn, và lời hứa ấy nghe như lời khiêu khích trước khi đánh. Không thêm kết
  cục thắng hay thua vào thân kinh vì Pāli không nói.
  BẤT ĐỊNH 2: `Ehi samma nivattassu` — ehi là mệnh lệnh đến, nivattassu là quay lại,
  samma là điều tốt/đúng. Chọn hãy quay trở lại cho đàng hoàng, đọc samma theo nghĩa đi
  đúng đắn.
  BẤT ĐỊNH 3: `catuppado` là tính từ bốn chân; Pāli lặp samma ở cả 1.1 và 1.2, nên lặp
  đúng là cho cả hai vế thay vì dịch 1.1 thành cũng (như vậy là tự dự trước tvampi của 1.2).
  Hạ triangulation 7.0 vì không có tầng Anh nào và cũng không có bản Việt tham khảo
  (vietnamese-current tại commit đã ghim chỉ có Pháp Cú).
  Lượt cải thiện 2026-10-13 (đọc đối kháng từng khoá, đối chiếu Pāli; các câu ở lượt trước nói
  khác đi về `samma`, người nói và tiền lệ `daḷha` được thay bằng phần dưới).
  SỬA LỖI THẬT: `samma` ở 1.1, 1.2, 1.3, 2.4 là hô cách "này bạn" (lời gọi người đối thoại),
  không phải trạng từ "đúng/đàng hoàng/thật sự". Đo tầng: 107 khoá có `samma`, đa số đọc là "này
  bạn" (ja386, ja400, ja451, ja465, ja495, ja542...). Khoá đổi và vì sao: 1.1 bỏ "đúng là" thêm
  "Này bạn"; 1.2 tương tự (`tvampi` = "ngươi cũng"); 1.3 "hãy quay trở lại cho đàng hoàng"
  thành "hãy đến, này bạn, hãy quay lại" (`ehi` = hãy đến, `nivattassu` = hãy quay lại);
  1.4 `kiṁ nu` = "vì sao", bỏ cấu trúc "điều gì khiến ngươi"; 2.2 `duggandho vāsi` "ngươi bốc mùi
  hôi hám" (tiền lệ "tỏa mùi hôi hám" trong tầng); 2.3 bỏ "cứ ham" (Pāli chỉ có `yujjhitukāmo`
  = muốn giao chiến, không có "cứ"); 2.4 bỏ "thật sự ban", dịch "này bạn, ta cho ngươi chiến
  thắng" (cùng cấu trúc với ja294:2.4 và ja465:12.4). 7/13 khoá đổi; 0.1-0.4, 2.1, 3.1 giữ vì
  khớp tiền lệ (3.1 khớp ja151, ja152, ja154, ja155).
  Điểm đổi: semantic_fidelity 8.8 sang 9.3 và grammar_logic 8.7 sang 9.2 (hết lỗi phân tích
  `samma`, hết nghĩa thêm); terminology 8.5 sang 8.0 (xem dưới); technical_integrity 10.0 sang
  9.6 vì chưa chạy lại bốn lệnh: npm run validate, npm test, npm run check, npm run build.
  ĐÍNH CHÍNH GHI CHÚ CŨ: (a) câu "Người nói là con rắn" là sai; Pāli không nêu con rắn (đó là
  bài ja154 kế bên). (b) Tiền lệ "daḷha = tàn tật" không kiểm lại được: 338 khoá chứa `daḷha`
  trong tầng đều dịch theo nghĩa chắc, vững, kiên cố, mạnh; không khoá nào là tàn tật. Tên
  `Daḷhavagga` dịch "Phẩm Tàn Tật" đang dùng ở 9 trong 10 bài của phẩm (ja151-ja160, riêng ja159
  là "Phẩm Người Yêu") nên giữ nguyên ở 0.3 để phẩm không bị tách nhãn, nhưng đây là bất định
  thuật ngữ thật và cần một lượt sửa chung cả phẩm; vì vậy hạ terminology.
  Bất định còn lại: Pāli không ghi người nói. Chỉ suy ra từ hô cách `sūkara` ở 2.2: lời ở khổ 2
  nói với con heo, nên khổ 1 là lời của bên kia (lời gọi quay lại hỏi vì sao bỏ chạy). Phần suy
  này không thêm vào thân kinh. Nghĩa của `jayaṁ dadāmi te` (nhường hay thách) vẫn để ngỏ.
  triangulation giữ 7.0: không có tầng Anh độc lập nào và không có bản Việt tham khảo.
  Blocker thiếu tầng English giữ nguyên vì là sự thật về upstream.
