notes: |-
  Dịch từ Pāli root, đối chiếu bản dịch tiếng Anh của Bhikkhu Sujato tại commit bilara đã ghim. Tại commit đã ghim không có bản Việt hiện hành cho Khuddaka Nikāya, nên không có tầng Việt truyền thống để so.

  Coverage Anh, đo lại bằng đúng công thức của `src/lib/canon/reference.ts`: **substantive = 0** → `ratio = 1`, bài qua cổng coverage một cách rỗng vì cả 49 khoá Pāli đều ngắn hơn 40 ký tự. Đo thủ công trên tệp Anh đã ghim: **44/45 khoá thân bài có chữ Anh**, chỉ `:12.1` (câu kết) bị Sujato bỏ trống.

  Tên phẩm, có số đếm. `0.1` `Cariyāpiṭaka` → *Hạnh Tạng*, theo đa số đo lại được là **20 tệp cp so với 1 tệp** (`cp34`) giữ Pāli; hai tệp `cp1` và `cp35` có `:0.1` rỗng nên không tính, và 20/1 là số đo trên 23 tệp có sẵn **trước khi lát này ghi** (sau khi cp14 cp15 cp19 của lát đã ghi thì toàn tầng là 23/1 trong 26 tệp). Số này khác con số 17/1 từng được báo, xem `cp14.yaml` để có đường đo. `0.2` `Hatthināgavagga` → *Phẩm Hatthināga* (4/4). `0.3` `Sīlapāramī 5` → *Trì Giới Ba-la-mật Thứ Năm*. `0.4` `Mahiṁsarājacariya` → *Hạnh Của Trâu Vương*: theo khuôn "Hạnh Của X" với con vật dịch ra tiếng Việt như cp12 *Hạnh Của Long Vương Bhūridatta* và cp13 *Hạnh Của Long Vương Campeyya* (voi → Long, trâu → Trâu, đều + Vương cho `rāja`). Câu kết → *Hạnh của Trâu Vương, thứ năm.*

  DÙNG LẠI NGUYÊN VĂN BÀN DỊCH ĐÃ CÓ (đo bằng `_c80_dup.py` trên 5.271 bài Việt): `:0.1 :0.2` (cp13), `:1.1` (9/16 bài cp), `:3.1` (tha-ap441:1.3, cùng câu `Vicaranto brahāraññe`), `:8.1` (cp13:4.3), `:10.2` (ja278:3.2), `:10.4` (ja278:3.4, cùng công thức `sā me mutti bhavissati` → "như thế ta sẽ được tự do").

  Thuật ngữ, có số đếm. `mahiṁsa` → *trâu* (an5.99:1.7 "nếu nó vồ con trâu"). `brahārañña` → *rừng lớn* (tha-ap441:1.3; an3.64:11.2 dịch "rừng rậm hiểm" — cùng nghĩa, giữ khuôn đã có). `kapi` → *khỉ* (cp27:1.1). `pavaḍḍha` → *phình to*; `bhīmadassana` → *kinh khủng* (20). `viññū garaheyyu maṁ` → *bậc hiền tri cũng sẽ chê trách ta*, theo y hệt mn54:6.4. `kuṇapa` → *xác* (mil5.3.12:3.1 "xác chết thối rữa"). `sila` → *giới hạnh*; `niyyāna` không có ở bài này.

  BẤT ĐỊNH ĐÃ GHI. (a) `:4.2` `lahu` dịch *lanh lẹnh* — nghĩa gốc là "nhẹ", Sujato đọc là "nimble"; không có bản Việt song song nào cho chỗ này nên giữ nghĩa Sujato và ghi bất định thay vì đoán. (b) `:6.3` `chava` dịch *con vật khốn khổ độc ác* — `chava` là loài sinh vật thấp kém, Sujato "vile, wicked thing"; giữ cả hai vế. (c) `:2.1` `giridugga` dịch *sườn núi cheo leo*, `dakāsa` dịch *chỗ trũng lấp nước* — cả hai đều không có tiền lệ trong kho, chỉ có Sujato "a craggy hillside" / "a waterhole". (d) `:9.1`–`:9.2` `Hīḷitā jīvitā vāpi / parisuddhena mataṁ varaṁ` dịch *Dù còn sống mà phải chịu nhục, / thà chết trong thanh tịnh còn hơn* — câu cú của mệnh đề này (danh ngữ `hīḷita` + `jīvitā`) được Sujato dịch lộn thứ tự ("Better to die from purity than live in shame"), nhưng Pāli đặt "sống nhục" trước nên bản Việt giữ thứ tự Pāli.

  Cặp nháy kép: Pāli mở `“` ở `:1.1`, đóng `”` ở `:11.4`; các nháy đơn `‘…’` ở `:6.3 :6.4 :7.3 :7.4 :9.4` tự cân. Cơ chốt `_hvi.py` chạy sạch với 49 khoá.