notes: |-
  **Sujato ĐẢO hai khoá đầu, tôi theo Pāli.** Sujato đặt *The truth, it seems, was spoken* vào `1.1` và *by certain people here—* vào `1.2`, nhưng Pāli `1.1` là `Saccaṁ kirevamāhaṁsu` (*sự thật, hình như họ đã nói*) và `1.2` là `narā ekacciyā idha` (*có vài kẻ ở nơi này*). Tôi dịch đúng theo thứ tự Pāli. Sujato cũng thêm *than a certain person* vào `1.3` — không có trong Pāli, tôi không dịch; phần *mà ngươi nghĩ tới* chỉ nằm ở `1.4` (`tvevekacciyo`).

  **`0.3` `Varuṇavagga` → *Phẩm Cây Varuṇa* — bắt buộc theo tiền lệ.** `ja79` (cùng phẩm, đã có bản dịch) ghi *Phẩm Cây Varuṇa* cho đúng Pāli `Varuṇavagga`, nên tôi dùng y hệt. Sujato lại dịch phẩm này thành *The Warding Tree* — tự do, không theo.

  **`0.4` `Saccaṅkirajātaka` → *3. Kinh Bó Chiếu*.** `saccaṅkīra` là một bó chiếu cuộn lại (người ta trải làm cầu tạm qua chỗ bùn), đó là vật dụng cốt lõi trong truyện; *bó chiếu* giữ được hình ảnh, còn *bó gọn* thì mất. Sujato đặt tiêu đề là *The Truth, It Seems* — lấy từ câu kệ đầu chứ không phải tên bài; tầng dịch tên bài (`ja1` *Kinh Bụi Dơ*, `ja2` *Kinh Sa Mạc*) nên tôi theo tầng.

  **`kira` tôi dịch *hình như*, `niplavita` → *trôi giáng* (0 tiền lệ), `seyyo` → *còn hơn*; `sacca` → *sự thật* (275 tiền lệ, vd `dn21:2.6.7`).** `1.3`–`1.4` là cặp so sánh: một khúc gỗ trôi xuống còn hơn, chứ không bằng kẻ mà ngươi nghĩ tới — tôi giữ cả hai vế của phép so sánh, không lược vế *không*.

  **Tầng Việt hiện hành không có.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa 27 tệp Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế chỉ là Pāli + English Sujato.

  **Sàn coverage không kích hoạt, nhưng ô Anh trống KHÔNG phải đồng thuận.** Hàm `kiểm()` của `_hvi.py` lọc `cần = [k for k in p if len(p[k]) >= 40 …]`. Ở bài này mọi khoá Pāli ngắn hơn 40 ký tự, nên `cần` RỖNG và NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy. Tôi đã tự quét lại MỌI khoá bằng một lớp kiểm riêng áp đúng các quy tắc ấy lên toàn bài, và in ra từng cặp Pāli ↔ Việt để đọc đối kháng.

  **Ngoại lệ đã đo, không phải lỗi.** Khoá `:0.1` trùng nguyên văn Pāli là quy ước của tầng: 168/516 tệp `kn/*` có `:0.1` là chuỗi Pāli nguyên văn (đếm bằng script). Tương tự, tên riêng mang dấu Pāli trong tiêu đề là tiền lệ (`thag1.101` Belaṭṭhānika, `thag1.11` Cūḷavaccha, `thag1.15` Kuṇḍadhāna), và dấu lược trần `…` xuất hiện 446 lần trong tầng.

  **Tôi không chạy `npm run validate|test|check|build`** (đợt này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0 — đúng như `thag1.107` đã làm.
