  đời` trùng nguyên văn tha-ap78:3.2; `hàng nghìn vị đã trừ sạch lậu hoặc` 1× tha-ap246:1.1;
  `đến bên tôi` 1× tha-ap459:5.4; `Đức Thế Tôn đã thọ nhận,` 3× trùng nguyên văn tha-ap142:3.3;
  `Vào năm mươi bảy kiếp trước đây,` trùng nguyên văn tha-ap210:4.1 cho `Sattapaññāsakappamhi`
  (7 + 50 = 57); `sinh niềm vui` 2× tha-ap135:6.3 cho `Pāmojjaṁ janayitvāna`; `có một vị vua
  tên` 4× cho `…sanāmako`; `trái cây ấy` / `cúng dường trái cây` trùng nguyên văn tha-ap89:3.2
  và :3.4 cho `yaṁ phalaṁ adadiṁ` + `phaladānassidaṁ phalaṁ`.

  BẤT ĐỊNH CÒN LẠI, ghi ở đây chứ không giải thích trong thân kinh.
  `tibhavantagu` (`:2.4`) là **hapax toàn Pāli root** của cả 5 bộ (đúng 1 khoa, chỉ ở đây);
  dịch *bậc Đạt Đến Đỉnh Cao* theo nghĩa chữ nghĩa `tibhāvan` (bậc đã đạt tới) + hậu tố `-agu`
  (tối đỉnh), 0 tiền lệ — đây là chỗ dễ sai nhất của bài.
  `viciniṁ lokanāyakaṁ` (`:2.2`) dịch *vị Dẫn Đạo Thế Gian cùng hội chúng*: `vicina` là
  "hội quân/đám đông", `lokanāyaka` có 2 tiền lệ *Dẫn Đạo Thế Gian*. Không thêm động từ nào;
  đọc theo nghĩa "vị dẫn đạo thế gian có hội chúng theo hầu". Đây là cách dịch ít chắc chắn
  nhất của bài. `sabbaññū vadataṁ varo` (`:4.4`) dịch *bậc tuyên bố tất cả trí tuệ, bậc Tối Thượng;
  — cố ý **không** bám tiền lệ duy nhất của tầng cho đúng Pāli này (tha-ap68:2.2 dịch
  *bậc Tất Trí, bậc Đạo Sư đã tuyên thuyết*), vì cách đó không tính đến `varo`.
  `Giriduggacaro`, `makkaṭo`, `thāmavegiko` (`:1.1–1.2`) không có tiền lệ nào; dịch theo nghĩa
  chữ nghĩa, trong đó `thāma` là ngựa phi nên `thāmavegiko` thành *nhanh như ngựa phi*.
  `Phalinaṁ tindukaṁ` (`:1.3`) dịch *quả phalina, quả tinduka* vì `:5.4` `phaladānassa` cho
  thấy phẩm vật dâng là **quả**; tầng có 1 tiền lệ cho `tinduka` là tha-ap351:2.1 *cây tinduka
  trĩu quả*, nên tên cây được giữ dạng Pāli không dịch.

  KHAI TỪ VỚI HARNESS (không sửa `_hvi.py`, chỉ bổ sung bộ nhớ tiến trình). `lọt_pāli()` chỉ truyền
  Pāli **của chính khoá đang xét**, nên tên riêng của bài bị bắt oan và đã tự tra chứng rồi mới
  khai: `Tindukadāyaka` (tên Trưởng lão của chính bài, có thật ở `:0.3`, `:8.1`, `:9.1`).
  `phalina` và `tinduka` không mang dấu Pāli nên `lọt_pāli` không kiểm. Ngoài ra `:0.1` cố ý
  trùng nguyên văn Pāli `Therāpadāna` — đó là tiêu đề tuyển tập, 348/357 bài đã dịch giữ
  nguyên, và khoá này dưới 40 ký tự nên `kiểm()` không quét.

