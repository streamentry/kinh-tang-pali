  `“”` mở ở `:1.1` và đóng ở `:7.3` nên cân trên cả bài. Không có `(…)`.

  SỐ THỨ TỰ Ở `:0.3` — ĐO LẠI trên **357** bài `tha-ap` có cả Pāli `:0.3` lẫn bản Việt `:0.3`
  (lớp dùng để đo có 5.361 tệp Việt, 153.717 giá trị): Pāli KHÔNG có số thứ tự ở 242 bài, CÓ số ở
  115 bài; trong 242 bài Pāli không có số thì bản Việt cũng không có **240 bài = 99,2%** (chỉ
  tha-ap117 và tha-ap427 lệch); trong 115 bài Pāli CÓ số thì Việt giữ 66, bỏ 49. Đây là phép đo
  theo hướng lát s7 — hỏi đúng câu hỏi: *khi nguồn im lặng, bản dịch có im lặng theo không* —
  và nó thống nhất với ba lát trước (66/275, 73/274, 127/291 đều kết luận BỎ) dù tỉ lệ khác nhau.
  ⇒ `tha-ap199:0.3` Pāli là `Tindukadāyakattheraapadāna` — **KHÔNG có số** — nên số bị BỎ khỏi
  `:0.3` và đặt vào khoá đóng `:9.1` (`sattamaṁ` → *thứ bảy*), đúng như tha-ap221 và 240 bài khác.

  TÊN Ở `:0.3` VÀ KHOÁ ĐÓNG — đo tiền tố ở **363** bài `tha-ap` đã dịch đủ: `:0.3` → *tuyên ngợ*
  200 / *ký sự* 88 / *tuyên ngôn* 65 / *tuyên ngợi* 10; khoá đóng → 199 / 88 / 66 / 10. Toàn tầng
  thì đa số là *tuyên ngợ*, nhưng cục bộ hai phẩm của lát thì ngược (`Hatthivagga` *ký sự* 4 /
  *tuyên ngợ* 2) và bốn bài sát nhất đã viết (tha-ap217, 219, 221, 222) đều dùng *Ký Sự*.
  Chọn **Ký Sự** vì điều kiện cứng hơn cả đa số: `:0.3` và khoá đóng phải cùng một cách gọi,
  nếu không người đọc thấy hai tiêu đề khác nhau cho cùng một bài. Số đếm ghi lại để người điều
  phốn gộp cả phẩm một lần nếu muốn thống nhất theo đa số toàn tầng. Tên riêng giữ Pāli ở CẢ
  HAI khoá (tiền lệ tha-ap221 Sappidāyaka) để bài không tự mâu thuẫn.

  TÊN PHẨM Ở `:0.2` — `Tamālapupphiyavagga` đã có sẵn 5 lần trên đĩa: *Phẩm Tamālapupphiya* 3,
  *Phẩm Hoa Tamāla* 2 ⇒ **Phẩm Tamālapupphiya** theo đa số cục bộ; tầng `name/` của SuttaCentral
  tại commit đã ghim xác nhận cùng cách đặt (`tha-ap-name:212.tha-tamalapupphiyavagga` →
  *Chapter Beginning With Tamālapupphiya*). `:0.1` giữ `Therāpadāna` — 348/357 bài đã dịch.

  NGÔI KỂ — đo riêng khoá kệ, đã bỏ mọi dòng `Tôi nghe như vầy`. Toàn tầng `tha-ap` (7.426 khoá
  kệ): `ta` 4.630 / `tôi` 2.876 ⇒ đa số `ta` (61,7%). Cục bộ `Tamālapupphiyavagga` (126 khoá):
  `tôi` 17 / `ta` 1 ⇒ nghiêng hẳn về `tôi`, và tha-ap219 (bài sát nhất đã viết) dùng `tôi` 7:0.
  Chọn **`tôi`** cho hai bài `Tamālapupphiyavagga` của lát (198 và 199 dùng chung ngôi, và các
  khoá công thức dùng chung giữa hai bài đều có tiền lệ `tôi`). Hệ quả phải nói thẳng: cùng một
  Pāli `Duggatiṁ nābhijānāmi,` sẽ khác cách dịch giữa 198/199 (`tôi`) và 220 (`ta`); trên toàn
  tầng khoá đó `ta` 180 / `tôi` 138. Người điều phốn có thể gộp cả phẩm sau.

  THUẬT NGỮ — mọi cách dùng đều bám tiền lệ đếm được: `Therāpadāna` 348×; `Tôi nghe như vầy:
