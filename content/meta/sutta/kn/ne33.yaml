notes: |-
  17 khoá, tất cả đã dịch. `Sampāta 14` của Netti.

  TẦNG THAM KHẢO — 0/17 có Anh Sujato: trong `kn/` của edition đã ghim chỉ có cp, dhp, iti, ja, kp,
  snp, thag, thig, ud; **không có `ne/`**. Không có bản Việt hiện hành. ⇒ `draft`.

  PĀLI TRÙNG — bài này trùng nhiều nhất trong lát: `0.1` `Netti`, `0.2` `Paṭiniddesavāra` → *Phần
  Giải Thích* (11 tiền lệ), `1.1` cùng khuôn `Tattha katamo … hārasampāto?`, và **`2.1`
  `“Tasmā rakkhitacittassa, sammāsaṅkappagocaro”ti gāthā.` — trùng với 10 bài** (ne23, ne29,
  ne30, ne32…), nên tôi dùng lại **đúng nguyên văn**: *“Do vậy, với người có tâm được phòng hộ,
  chánh tư duy là cảnh giới”, đó là bài kệ.* Khung `2.2–2.12` cũng dùng lại nguyên văn của
  ne29:2.2–2.4 cho *chánh tư duy của sự từ bỏ / không gây hại / không bạo hại* và *Chánh kiến chỉ
  là bóng*. `2.12` dùng khuôn *Nhóm phương thức … đã được vận dụng.* của ne32:2.4.

  THUẬT NGỮ MỚI (0 tiền lệ — đây là phần mới nhất của bài):
  · `ekattatā` → *nghĩa là nhất*; `vemattatā` → *đó là nghĩa khác biệt*. Đây là hai từ khoá cấu
    trúc của cả bài và cả bộ Netti, chưa bài Việt nào dịch chúng. Tôi đặt theo đúng vai trò:
    `ekattatā` mở đầu mỗi lần giải (`X` có nghĩa như `Y`), `vemattatā` mở đầu mỗi lần liệt kê
    (`Y` là nghĩa khác biệt). Biên tập nên thống nhất hai từ này cho mọi bài Netti sắp dịch.
  · `adhiṭṭhānahārasampāta` → *Nhóm Phương Thức Áp Dụng*. 0 tiền lệ. Đối chiếu 3 nhóm đã có:
    *Sodhana* → *thanh tẩy*, *Vevacana* → *dùng ngữ đồng nghĩa*, và khuôn `Niyutto … hārasampāto.`
    → *… đã được vận dụng.* `adhiṭṭhāna` = đặt vào, áp dụng — khác `sodhana` (thanh tẩy) và
    `vevacana` (đồng nghĩa), nên tôi giữ ba nghĩa khác nhau.
  · `saccāgamanaṁ` → *đi vào chân lý* (149 tiền lệ cho *chân lý*).
  · `apanidhāya` → *lấy … làm thước đo*. 0 tiền lệ cho cụm này; đây là cách Netti dùng để giải
    *sabba dukkha* như trong Dīgha Niệu.

  BẤT ĐỊNH CHƯA PHÂN XỬ:
  · `Thinamiddhābhibhū bhikkhu` (`2.10`). Tôi dịch *Tỳ-kheo mỏng manh, uể oải*. Glossary có
    `thīnamiddha` → *hôn trầm và buồn ngủ* cho 16 mục Aṅguttara, nhưng ở đây `akallatā` +
    `kammaniyatā` của tâm và `līnattaṁ` của thân cho thấy đây là *mỏng manh* (ít phước) và *uể oải*
    (nhũn nhẹn thân), không phải hôn trầm. Một cách đọc khác là bám glossary và dịch *hôn trầm
    và buồn ngủ*. Tôi ghi lại vì đây là chỗ lệch thuật ngữ thật sự.
  · `apāyā` ở `2.11` tôi dịch *sự đi xuống*; có thể là *sự đi vào cảnh giới thấp*.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
