notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Tự quét 9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu
  lược khớp (1.5 giữ hai dấu lược trần), nháy kép mở 1.1 đóng 1.4 nên cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 1.5.

  ĐÂY LÀ BAI SACH NHẤT CỦA LÁT: bốn vế kệ đều là đối xứng thuận – nghịch và nghĩa không cần
  giải thích thêm. Passati (thấy) thấy cả kẻ đang thấy lẫn kẻ không thấy; Apassanto (không
  thấy) thì không thấy cả hai. Tôi giữ đúng bốn danh từ — kẻ đang thấy, kẻ không thấy, kẻ
  đang thấy, kẻ không thấy — và không gộp, vì nếu gộp thì mũi câu ở 1.4 sẽ mất.

  `passati` / `passantaṁ` / `apassantaṁ` (0 lượt cho cụm này trong tầng) → *thấy*, giữ nguyên
  thì hiện tại và không thêm động từ nào. `na passatī` là phủ định với ngôi thứ ba — đây là
  chỗ dễ nhầm thành “không thấy ai”, nên tôi dịch *cũng không thấy kẻ đang thấy*.

  Khuôn tiêu đề: Phẩm Thứ Bảy (7 lượt ngoài lát), Kinh Kệ Của Trưởng Lão Vappa, dòng kết
  … Trưởng lão Vappa ….

  KỸ THUẬT. Tôi KHÔNG chạy npm run validate|test|check|build — brief đợt này cấm vì nhiều
  agent chạy song song. Vì vậy technical_integrity chấm 9.6 chứ không phải 10.0; đó là hạn
  chế thật của lượt đánh giá này chứ không phải lời khen. Những gì chạy được thì đã chạy:
  save_vi xanh, tự quét MỌI khoá bằng chính các hàm của _hvi.py, YAML parse sạch.
