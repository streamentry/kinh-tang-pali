notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho tha-ap427.
  Pāli trùng nguyên văn: dựng chỉ mục toàn tầng thì 206/294 khoá của lát có Pāli trùng nguyên văn ở nơi khác; riêng bài này 30/42 khoá trùng và 22 chỗ đã có bản Việt. Đáng chú ý: bảy khoá `:8.1`–`:8.3`, `:9.1`–`:9.3`, `:10.1`–`:10.3` trùng **nguyên văn với tha-ap428 trong cùng lát**, nên đã dịch giống hệt ở hai bài — nếu để khác nhau thì chính lát sẽ tự mâu thuẫn.
  Đã dùng lại nguyên văn: `:0.1` `Therāpadāna` (921 chỗ) · `:0.2` `Sakiṁsammajjakavagga` → Phẩm Sakiṁsammajjaka (2 chỗ) · `:2.4` `anukampāya cakkhumā.` → vì lòng thương tưởng mà bậc có mắt (1 chỗ) · `:3.4` `pade cittaṁ pasādayiṁ.` → tôi phát khởi tịnh tín nơi dấu chân ấy (1 chỗ) · `:4.1` → Thấy hoa koraṇḍa nở rộ (2 chỗ) · `:4.3` `Sakosakaṁ gahetvāna,` → Cầm lấy hoa còn nguyên đài bọc (1 chỗ) · `:5.1` → Nhờ nghiệp lành khéo làm ấy (7 chỗ) · `:5.2` → cùng với tâm nguyện và chí hướng (8 chỗ) · `:5.3` → sau khi từ bỏ thân người (2 chỗ) · `:5.4` → ta đã đến cõi trời Ba mươi ba (5 chỗ) · `:6.1` → Dù sinh vào cảnh giới nào (2 chỗ) · `:7.2` → khi tôi làm thiện nghiệp ấy (9 chỗ) · `:7.3` → Ta không biết mình rơi vào khổ đau (đa số trong tha-ap: 98/291) · `:7.4` → đó là quả báo của sự cúng dường dấu chân (1 chỗ) · `:8.1` → Các phiền não của ta đã được thiêu rụi (62/92 trong tha-ap) · `:8.3` → ta sống không còn lậu hoặc (63/92) · `:9.1` → Thật lành thay sự đến của ta (60/89) · `:9.3`, `:10.3` → đã làm tròn lời dạy của Đức Phật (138 chỗ) · `:10.1` → Bốn vô ngại giải (942+24 chỗ) · `:11.1` → Tôi nghe như vầy: Tôn giả Trưởng lão … đã nói những bài kệ này (tiền lệ đúng ở tha-ap427:11.1 trong tầng).
  Số thứ tự: `12.1` `Koraṇḍapupphiyattherassāpadānaṁ pañcamaṁ` → thứ năm, và `0.3` không có số. Đã đối chiếu chuỗi phẩm Sakiṁsammajjakavagga: `tha-ap423` (1) · `tha-ap424` (2) · `tha-ap425` (3) · `tha-ap426` (4, `0.3` ghi catutthaṁ) · `tha-ap427` (5) · `tha-ap428` (6, `0.3` ghi 6) · `tha-ap429` (7) · `tha-ap430` (8) · `tha-ap431` (9) · `tha-ap432` (10) — khớp, nên giữ “thứ năm” chứ không suy từ số thứ tự uid.
  Tên riêng giữ chữ Pāli có dấu: `Koraṇḍapupphiya` (đã có sẵn trong tầng ở một `0.3` khác, nên chốt Pāli lọt không chặn) và `koraṇḍa` cho tên loài hoa ở `4.1`, `6.3`, theo đúng tiền lệ trong tầng.
  Dấu lược: Pāli có `…pe…` ở đúng ba khoá `:8.2`, `:9.2`, `:10.2`; cả ba giữ **đúng một** `…` và không mở rộng. Nội dung bị nén là công thức `Paṭisambhidā catasso, …pe…, kataṁ buddhassa sāsanaṁ”` đã nêu đủ ngay trong cùng bài, nên giữ lược đúng như peyyāla của Pāli gốc.
  Bất định đã ghi, không che: (1) `Pārāvā` không có tiền lệ trong tầng; tôi giữ nguyên tên riêng chữ Pāli vì đây là danh xưng của người kể, không phải thuật ngữ cần dịch. (2) `āsayasāmantā` ở `2.1` nghĩa là có bậc thầy hiện diện; tôi dịch Nhờ Đức Phật, đạo sư của tôi, để giữ cả hai vế `āraya` (thầy) và `sāmantā` (hiện diện) mà không thêm giải thích nào vào thân kinh. (3) `tavatiṁsa` dịch theo tiền lệ là cõi trời Ba mươi ba.
  Dấu nháy kép: chỉ 1 cặp `“`/`”` ở Pāli, mở ở `:1.1` và đóng ở `:10.3` kèm `”.`; bản Việt giữ đúng 1 cặp và cân trên cả bài.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Đã tự xác minh được: JSON hợp lệ, đủ 42/42 khoá trong `all` và trùng khớp 42/42 khoá Pāli trong `root/pli/ms/sutta/kn/tha-ap/tha-ap427_root-pli-ms.json`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt vào bản Việt, không trùng nguyên văn Pāli ở khoá có nội dung, và YAML parse sạnh. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.