notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Vanavaccha trong phẩm Dvādasamavagga.

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1). Đo trên đĩa: 10 bản mở
  rộng thành *Bạch Thế Tôn, Tôn giả Trưởng lão X đã từng nói bài kệ này*, 5 bản giữ lược
  (thag2.35, thag6.2, thig1.7, thig1.8, thig1.9). Tôi theo §10.1 — xem `thag1.112.yaml` để có lý do
  đầy đủ. Cả hai cách đều giữ **2 dấu lược** như Pāli.

  **Thứ tự khoá tiêu đề: tôi theo PĀLI** — `0.3` = tên phẩm, `0.4` = tên bài kệ. **12 bản thag đã
  publish trên đĩa đặt NGƯỢC** (thag1.2–1.10, thag1.14, thag2.1, thag2.2); 4 bản đặt đúng (thag1.1,
  thag1.42, thag2.35, thag6.2). Tôi theo Pāli và không sửa 12 bản kia (ngoài lát).

  **Không đối chiếu được tầng Việt hiện hành** (bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng
  Việt). `triangulation` = Pāli + English Sujato. Sujato có 8/9 khoá; khoá trống là dòng kết lược.
  Mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments = 0`, `ratio = 1`, không rơi ngưỡng 80%.

  **Bốn vế này lặp y nguyên ở `thag18.1:20.1-20.4` và `thag11.1:5.1-5.4` (chưa dịch), và vế cuối
  lặp ở `thag1.13:1.4`.** Tôi dùng **một** cách dịch cho cùng một Pāli ở cả hai bài trong lát — đúng
  bài học 87 khoá bị dịch hai kiểu ở đợt trước.

  **Thuật ngữ, đếm được.** `Acchodikā` (0 tiền lệ trong tầng, đặt mới) → *trong vắt*; `puthusilā` →
  *đá rộng bằng* (an105:13.1 có cùng `puthusilā`, dịch *một tảng đá lớn* — ở đây `putha` là *rộng* và
  Sujato đọc *the rocks are broad*). `sevāla` → *rêu* (an5.162:4.2 *bị rêu và cỏ nước phủ kín*).
  `Ambusevāla` → *ướt sương* (Sujato *dewy moss*). `selā` → *vách đá* (Sujato *rocky crags*).
  `ramayanti maṁ` → *làm tôi vui lòng* (`maṁ`/`man` = ngôi thứ nhất sở hữu; ja346:2.4 cùng cấu
  `ramayanti maṁ`).

  **Bất định đã ghi, không giấu.** `gonaṅgulamigāyutā`: `miga` = *hươu nai* là chắc, nhưng
  `gonaṅgula` là từ **chỉ xuất hiện 3 lần trong toàn tầng Pāli đã ghim** (thag1.113:1.2, thag11.1:5.2,
  thag18.1:20.2) và không có chú giải nào trong cache để phân xử; Sujato đọc cả cụm là *monkeys and
  deer*. Tôi theo Sujato (*đầy khỉ và hươu nai*) vì đó là tầng tham khảo duy nhất có mặt, và ghi rõ
  ở đây rằng `gona` nghĩa đen là *bò*. Nếu người biên tập có chú giải, đây là chỗ cần xem lại đầu
  tiên của lát này.

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (dòng kết 2 = 2); ngoặc kép cân trên cả bài;
  không chữ ngoài Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này
  cấm), nên `technical_integrity` = **9.6**.

  **Danh xưng giữ nguyên dạng Pāli** (Vanavaccha).
