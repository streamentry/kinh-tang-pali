notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli và file en/sujato so git-hash với manifest và khớp. english-sujato CÓ mặt: 10/11 khoá có prose, khoá 2.1 để trống.
  Tiền lệ có đếm: Āsīsavagga → Phẩm Hy Vọng (8 tệp); colophon không dấu phẩy.
  Pāli trùng nguyên văn với ja55 ở bốn khoá 1.3–1.6 (Bhāveti kusalaṁ dhammaṁ / yogakkhemassa pattiyā / Pāpuṇe anupubbena / sabbasaṁyojanakkhayan) nên dùng CHUNG một cách dịch với ja55, và 1.5–1.6 lấy nguyên văn của iti17:3.5–3.6. Bốn khoá còn lại thì Pāli khác hoàn toàn: alīna ở ja55 được dịch là không bị vướng, còn pahaṭṭha ở đây là được rèn giũa/tinh luyện — đó là điểm khác biệt thật của cặp kệ này và tôi không lặp khuôn.
  Kañcanakkhandhajātaka: kañcana là vàng, akkandha là đống/khối, nên Kinh Đống Vàng; Sujato dịch The Mass of Gold, cùng một nghĩa. 0 tiền lệ: Đống Vàng, đặt mới; cách đặt tên bằng nghĩa theo Kinh Bình Rượu Đầy, Kinh Lá Dầu. Không có segment Pāli ≥ 40 ký tự nên sàn coverage không kích hoạt; không có bản Hòa thượng Thích Minh Châu ở commit đã ghim.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
