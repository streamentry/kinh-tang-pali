  **BÀI NÀY TRÙNG VỚI BA BÀI KHÁC — VÀ ĐANG CÓ BA CÁCH DỊCH, TÔI GHI RÕ.** `Vassati devo yathā sugītaṁ,` / `Channā me kuṭikā sukhā nivātā;` / `Atha ce patthayasi pavassa devā”ti.` trùng nguyên văn `thag1.51`–`thag1.54` (cùng bài kệ, bốn vị trưởng lão khác nhau). **Khi tôi bắt đầu lát này thì `thag1.52` và `thag1.54` chưa có trên đĩa**; trong lúc tôi làm thì agent khác ghi hai bảng ấy theo hai cách khác nhau:
  · `thag1.52` → *Trời mưa xuống như đang hát ngọt, / Nhà hut của ta có mái lá, dễ chịu, kín gió; / … / nếu ngươi muốn thì cứ mưa, hỡi trời*;
  · `thag1.54` → *Vua trời mưa xuống như đang hát, / lều tranh của tôi dễ chịu, mái đã kín; / … / nếu ngươi muốn thì hãy mưa, các vua trời*.
  Tôi giữ bản của mình, vì nó dùng hết bốn thành phần theo **đúng thứ tự Pāli** (`channā` → *lợp mái*, `kuṭikā` → *nhà*, `sukhā` → *dễ chịu*, `nivātā` → *thoáng mát*), còn `thag1.54` đảo `nivātā` lên trước `sukhā` và viết *má i đã kín*. **Đây là phân kỳ 3-cách trên cùng một câu Pāli và là lý do tôi báo người điều phối: cần quyết một lần cho `thag1.51`–`thag1.54`.** Tôi không sửa hai tệp kia vì ngoài lát.

  **BẤT ĐỊNH ĐÃ GHI — `nivātā`.** `nivāta` nghĩa chính là *thoáng, phóng gió* (cũng có nghĩa *che chở*). Sujato đọc *sheltered from the wind* và `thag1.52` dịch *kín gió* theo hướng đó; tôi đọc *thoáng mát* vì một tịch xá lợp mái thì đáng kể là thoáng, và vì `nivātā` đứng sau `sukhā` như một tính từ thêm cho sự dễ chịu. Đây là chỗ hai cách đọc đều bảo vệ được, tôi ghi để biên tập chọn.

  `devo` ở `1.1` là số ít, `devā` ở `1.4` là số nhiều: tôi giữ đúng số — *Chư thiên* ở `1.1` (Sujato *heavens*) và *các ngài* ở `1.4` (gọi thẳng `devā`). `vassati` → *mưa*; `sugītaṁ` → *đang hát ngợt*; `appamatto` → *không phóng dật* (tiền lệ `appamāda` toàn tầng). `0.3 Chaṭṭhavagga` → *Phẩm Thứ Sáu* (0 tiền lệ trong tầng Việt, nhưng `thag1.52`/`thag1.54` dùng đúng cụm này và `Dutiyavagga`/`Tatiyavagga`/`Pañcamavagga` đã có tiền lệ → theo khuôn số thứ tự). `1.5` giữ hai dấu lược.
