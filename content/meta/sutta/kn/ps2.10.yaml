notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim (kn/ps/ps2.10_root-pli-ms.json), đủ 303/303 khoá; thứ tự khoá = thứ tự Pāli, không khoá thừa, không khoá rỗng, không khoá ngoài phạm vi bài.

  Tầng tham khảo: tầng english-sujato không có ps2.10 (manifest đã ghim chỉ liệt kê tệp Pāli root cho uid này; thư mục sutta/kn của Sujato chỉ có cp dhp iti ja kp snp thag thig ud, không có ps); lớp english-project của dự án chưa có tệp cho ps; vietnamese-current chỉ có Pháp Cú. Đây là not-published-upstream (giới hạn của bản chụp), không phải not-synced. Coverage English theo công thức của source/layers.yaml: mẫu số 143 khoá Pāli có nội dung (từ 40 ký tự, bỏ khối 0.x), tử số 0 ⇒ 0/143; 160 khoá còn lại ngắn hơn ngưỡng hoặc là khối tiêu đề. Bản tra cứu toàn văn nguyên bài ở cuối trang (không phân đoạn, alignment: none, của Bhikkhu Indacanda) không phải tầng store và không cấp text cho bản này; đã đọc để đối chiếu thuật ngữ (bản ấy dịch suñña là không, bản này dùng trống rỗng theo sn35.85, ps3.9, ne4), không sao chép. Vì vậy triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft; không nâng điểm để né blocker.

  Cấu trúc bài: 1–3 duyên khởi tại Sāvatthī, Tôn giả Ānanda hỏi và Đức Phật đáp vì sao thế gian được gọi là trống rỗng (sáu căn, sáu cảnh, sáu thức, sáu xúc và cảm thọ, đều trống rỗng đối với tự ngã hay cái thuộc về tự ngã); 4 (Mẫu Đề) nêu hai mươi lăm loại trống rỗng; 5–31 (Phần Giải Thích) giải thích lần lượt hai mươi bốn mục (mục 27 gộp hai loại ekatta và nānatta); 31.11–32 câu kết, tên phẩm và kệ tóm lược của phẩm thứ hai. Chín cặp đối trị 13–17 và 23–30 dùng chung khuôn với ps2.9: xuất ly với dục tham, không sân hận với sân hận, tưởng ánh sáng với hôn trầm và buồn ngủ, không tán loạn với trạo cử, xác định pháp với nghi hoặc, trí với vô minh, hân hoan với sự không vui, sơ thiền với các triền cái, A-la-hán đạo với mọi phiền não; đã đối chiếu từng khoá để cặp không bị lệch.

  Số Pāli, tự tính từ danh sách trong chính bài: Mẫu Đề (4.1) liệt kê suññasuññaṁ, saṅkhārasuññaṁ, vipariṇāmasuññaṁ, aggasuññaṁ, lakkhaṇasuññaṁ, vikkhambhanasuññaṁ, tadaṅgasuññaṁ, samucchedasuññaṁ, paṭippassaddhisuññaṁ, nissaraṇasuññaṁ, ajjhattasuññaṁ, bahiddhāsuññaṁ, dubhatosuññaṁ, sabhāgasuññaṁ, visabhāgasuññaṁ, esanāsuññaṁ, pariggahasuññaṁ, paṭilābhasuññaṁ, paṭivedhasuññaṁ, ekattasuññaṁ, nānattasuññaṁ, khantisuññaṁ, adhiṭṭhānasuññaṁ, pariyogāhaṇasuññaṁ và paramatthasuññaṁ = 25, khớp dấu đếm [25] của chính khoá ấy; Phần Giải Thích có 24 mục hỏi Katamaṁ (mục 27 hỏi hai loại một lượt), 24 + 1 = 25 khớp. Dấu đếm [25] ở 4.1 không đưa sang bản Việt (xem bất định 12). Số nhỏ khác: tayo saṅkhārā 3 (6.2, 7.1, 8.1; liệt kê đủ 3 ở 6.3, 7.2, 8.2), dve lakkhaṇāni 2 (11.2), tīṇi lakkhaṇāni 3 (11.6), cha 6 (21.2 đến 22.7: bảy bộ sáu gồm nội xứ, ngoại xứ, nhóm thức, nhóm xúc, nhóm thọ, nhóm tưởng, nhóm tư, liệt kê đủ 7 bộ, 6 phần tử mỗi bộ theo Pāli); không có số lớn, không có cấu tạo kiểu navuti hay sahassa.

  Thuật ngữ và tiền lệ (số đếm trên tầng; khi hai phạm vi cho đa số khác nhau thì nêu cả hai):
  - suñña → trống rỗng (suñ- trên 308 khoá: trống rỗng 53 · trống không 47; gần nhất: sn35.85 cùng bài kinh nguồn, ps3.9, ne4 đều trống rỗng). suññasuññaṁ, saṅkhārasuññaṁ, ... dịch thành chuỗi trống rỗng + giới từ giữ vai trò của từ ghép Pāli (của, do, theo, trong, bên trong, bên ngoài); xem bất định 1. attena vā attaniyena vā → tự ngã hay cái thuộc về tự ngã (mn43:33, mn106:7, sn41.7:4 cùng cụm suññamidaṁ attena vā attaniyena vā đều dịch thế). nicca, dhuva, sassata, avipariṇāmadhamma (5.2 và các khoá song song) → cái thường hằng, cái bền vững, cái thường còn, cái không chịu biến đổi (thường hằng, bền vững, thường còn, không chịu biến hoại ở dn1 và dn24; 46 trên 73 khoá có dhuva và sassata dùng thường hằng).
  - vikkhambhana → trấn áp (22 trên 23 khoá; ps3.4 cùng bộ ba vikkhambhana, tadaṅga, samuccheda). tadaṅga → theo từng chi phần (đúng dạng của ps3.4; tầng có chi phần 20 trên 27). samuccheda → đoạn tuyệt (ps3.4; tầng cắt đứt 47 · đoạn tuyệt 25 trên 116 khoá; chọn dạng của ps3.4 vì cùng bộ). paṭippassaddhi → lắng dịu (115 trên 151). nissaraṇa, nissaṭa → thoát khỏi, được thoát khỏi: ps3.4 dịch nissaraṇa là xuất ly nhưng bài này nekkhamma đã là xuất ly ở mọi khoá cặp, nên dùng xuất ly cho cả hai sẽ thành Nhờ xuất ly, dục tham vừa được xuất ly; đây là chọn có chủ ý khác ps3.4 (thoát khỏi 103 trên 580 khoá có nissaraṇ- hay nissaṭ-).
  - ajjhatta, bahiddhā → bên trong, bên ngoài (318 trên 751; 301 trên 474); cha ajjhattikāni āyatanāni, cha bāhirāni āyatanāni → sáu nội xứ, sáu ngoại xứ (11 trên 13; 15 trên 19). viññāṇakāya, phassakāya, vedanākāya, saññākāya, cetanākāya → nhóm thức, nhóm xúc, nhóm thọ, nhóm tưởng, nhóm tư (mn148; tầng nhóm thức 5 · thức thân 8 trên 13 vì dn33 dùng thân; chọn nhóm vì không trùng nghĩa thân ở kāyasaṅkhāra 7.2). sabhāga, visabhāga → đồng loại, khác loại (không có tiền lệ cùng nghĩa trong tầng: các khoá sabhāg- còn lại là hội chúng và nói đồng thanh).
  - saṅkhāra ba bộ: puññābhisaṅkhāra, apuññābhisaṅkhāra, āneñjābhisaṅkhāra → hành phước, hành vô phước, hành bất động (6.3 trùng nguyên văn dn33:1.10.78; sn12.51 và cnd17 dùng hành phi phước, 3 khoá); kāyasaṅkhāra, vacīsaṅkhāra, cittasaṅkhāra → thân hành, khẩu hành, tâm hành (thân hành 31 trên 39 · khẩu hành 25 trên 26 · tâm hành 23 trên 25). atīta, anāgata, paccuppanna → quá khứ, vị lai, hiện tại.
  - vipariṇāma, vipariṇata → biến đổi, đã biến đổi (biến đổi 166 · biến hoại 257 trên 507 khoá; chọn biến đổi vì ps3.9 gần nhất dùng đúng dạng này và vì vigataṁ rūpaṁ vipariṇataṁ ở 9.3 chỉ nói đổi khác, không nói hủy hoại). ṭhitaññathatta → biến dịch khi đang tồn tại (36 trên 39 khoá của cụm ṭhitassa aññathattaṁ, ở sn22.38 và nơi khác); lakkhaṇa → tướng (237 trên 496 khoá); uppāda, vaya → sinh khởi, hoại diệt (sn22.38); bālalakkhaṇa, paṇḍitalakkhaṇa → tướng của kẻ ngu, tướng của người trí. bhava → hữu (127 trên 153). jarāmaraṇa → già chết (106 trên 383).
  - tên các loại trống rỗng 15–26 và 28–30: esanā → sự tìm cầu (tìm cầu 54 trên 446), pariggaha → sự nắm giữ (4 trên 71; dn15 dùng chấp giữ cho nghĩa xấu của pariggaha là nguyên nhân của hà tiện, ở đây nekkhammapariggaha mang nghĩa tiếp nhận trung tính), paṭilābha → sự đạt được, paṭivedha → sự thông suốt (ps2.9; 17 trên 82, thấu triệt 18), khanti → sự chấp nhận (ps2.9; ps3.9 dùng kham nhẫn cho anulomikā khanti, nhưng ở đây là pháp đối trị nên theo ps2.9), adhiṭṭhāna → sự quyết định (ps2.9; ps3.10 dùng quyết tâm), pariyogāhaṇa → sự thâm nhập (14 trên 94). nekkhamma → xuất ly, abyāpāda → không sân hận, thinamiddha → hôn trầm và buồn ngủ (157 trên 175), dhammavavatthāna → xác định pháp (26 trên 35), ālokasaññā → tưởng ánh sáng (ps2.9 và ps3.6; ps3.10 dùng nhận biết ánh sáng), pāmojja → hân hoan (ps2.9), arati → sự không vui (ps2.9; ps3.10 dùng bất mãn).
  - ekatta, nānatta → tính đơn nhất, tính sai biệt (nānatta sai biệt 120 trên 246, ps2.9 dùng sai biệt cho nānattasaññā; ekatta đồng nhất 40 trên 116 nhưng ở đây là tính duy nhất của một pháp đối trị chứ không phải đồng nhất giữa hai thứ, nên chọn đơn nhất). cetayato (27.x) → khi tư niệm (cetanā là tư; dn9 dịch acetayato là không cố ý).
  - aggasuññaṁ (10): aggaṁ, seṭṭhaṁ, visiṭṭhaṁ padaṁ → trạng thái tối thắng, tối thượng, ưu việt (cnd15:7.5 dịch padaṁ là trạng thái; tầng cảnh giới 37 · trạng thái 17 trên 141 khoá có padaṁ; chọn theo cnd15 vì cùng công thức; seṭṭha tối thượng 172 trên 488; agga tối thượng 31 · tối thắng 26 nên tách ba từ để không trùng nhau). Phần sau sabbasaṅkhārasamatho ... nibbānaṁ theo cnd15 và cnd14: sự lắng dịu mọi hành, sự từ bỏ mọi sanh y (sanh y 39 trên 39), sự đoạn tận tham ái, ly tham, đoạn diệt, Niết-bàn.
  - paramatthasuññaṁ (31.1, 31.10): paramattha → ý nghĩa tối thượng (an10.29 dịch paramattha là tối thượng); sampajāna → vị có tỉnh giác (tỉnh giác 604 trên 675); pavatta → vận hành; pariyādiyati, pariyādāna → chấm dứt (19 trên 245 khoá có pariyādiy-, pariyādān-, pariyādinn-, còn lại đủ dạng; sn36.8 jīvitapariyādāna là mạng sống chấm dứt, sn56.56 pariyādānaṁ gaccheyya là làm cạn hẳn; không dùng đoạn tận để khỏi lẫn với khaya và khīṇa); anupādisesāya nibbānadhātuyā parinibbāyantassa → đang nhập Niết-bàn trong Niết-bàn giới không còn dư y (không còn dư y 10 trên 20 khoá; dn16 dùng diệt độ cho riêng Đức Phật).
  - Pāli saddā, gandhā, rasā, phoṭṭhabbā → các âm thanh, các mùi, các vị, các xúc chạm (cnd12 và cnd13 cùng bộ sáu; samphassa là xúc nên hai từ khác nhau); cakkhusamphassa → xúc mắt (88 trên 169; cakkhuviññāṇa thức mắt 139 trên 180); vedayita → cảm thọ (sn35.85).
  - Tên phẩm và nhãn: Yuganaddhavagga → Phẩm Song Hành (ps2.5, ps2.8, ps2.9); Mātikā → Mẫu Đề (ps1.0:0.3 và ps3.10:0.3); Niddesa → Phần Giải Thích (Paṭiniddesavāra giải thích 30 khoá; ne3 dùng Phần Chỉ Rõ cho Niddesavāra); kathā niṭṭhitā → được hoàn tất (ps2.5, ps2.8, ps2.9, ps3.2, ps3.8, ps3.9, ps3.10); Tassuddānaṁ → Tóm lược: (380 khoá); 32.5 theo ps1.10:18.5 (thứ nhất đổi thành thứ hai).

  Bất định, ghi ở đây mà không thêm vào thân kinh:
  (1) suññasuññaṁ (5.1, 5.8): dịch trống rỗng của cái trống rỗng, tức cái đã là trống rỗng (suññaṁ) lại cũng trống rỗng đối với tự ngã, cái thường hằng, v.v.; có thể đọc khác là trống rỗng đối với chính cái trống rỗng; Pāli một mình chưa phân xử được, không có tầng Anh để so.
  (2) sabhāvena suññaṁ (9.2, 9.4, 9.10): dịch trống rỗng theo bản chất (bản chất 14 trên 81 khoá có sabhāva-); chưa phân xử được sabhāva ở đây là bản chất của chính pháp ấy hay một nghĩa kỹ thuật khác; 9.3 và 9.11 ghi vigata (đã mất đi) là vừa biến đổi vừa trống rỗng, đối lập với jāta (đã sinh).
  (3) nissaṭo (17.x): chủ ngữ là phiền não (dục tham, sân hận, ...) nên dịch được thoát khỏi, nghĩa là phiền não là cái được thoát khỏi nhờ pháp đối trị; ps3.4 dịch nissaraṇa xuất ly (xem thuật ngữ).
  (4) tadaṅga (14.x): dịch theo từng chi phần theo ps3.4; nghĩa kỹ thuật là phiền não bị trừ nhờ chính chi phần đối nghịch tương ứng, chưa có tầng Anh để so.
  (5) 27.3 và các khoá song song: suññaṁ ở nominative trung tính không có chủ ngữ rõ; bản Việt giữ câu không chủ ngữ (khi tư niệm ... thì có sự trống rỗng đối với ...) và không thêm tâm hay người.
  (6) 14.10: vivaṭṭanānupassanā chưa có tiền lệ trong tầng (0 khoá), dịch quán sự quay đi theo ps1.0:47.1 (vivaṭṭa là sự quay đi); saññogābhinivesa → sự chấp trước vào trói buộc (saññoga trói buộc 4 trên 8; abhinivesa chấp trước 25 trên 44), nghĩa của cả cụm chưa phân xử.
  (7) 31.4 đến 31.9: idañceva ... aññañca ... dịch chính sự vận hành nơi mắt này chấm dứt, và sự vận hành nơi mắt khác không sinh khởi; đã bỏ giá trị đối lập của ceva ... ca vì tiếng Việt không có cặp đôi tương ứng, nội dung vẫn đủ hai vế. Atha vā pana → Hoặc nữa.
  (8) 8.4: Pāli ghép hai mệnh đề không có dấu câu giữa; bản Việt tách bằng dấu chấm phẩy. 11.9 cũng ghép hai mệnh đề bằng dấu phẩy ở Pāli, bản Việt tách bằng dấu chấm phẩy.
  (9) 20.2, 20.7: ubhayametaṁ dịch cả hai thứ ấy đều trống rỗng, nhấn cả hai cùng mang tính trống rỗng, không thêm ý.
  (10) 2.1, 2.3, 3.14: vuccati ở dạng bị động không có chủ thể nên dịch người ta nói như vậy (2.1) và được gọi là (2.3, 3.14); không thêm chủ ngữ ngoài Pāli. 2.5: Pāli trùng nguyên văn sn35.85:1.6 (một cặp); tầng ấy dịch attena vā attaniyena vā là ở chính nó hay ở cái khác, bản Việt ở đây theo mn43, mn106, sn41.7 nên khác; không sửa phía tầng.
  (11) paramatthasuññaṁ: chưa chắc paramattha ở đây là ý nghĩa tối thượng hay đối tượng tối hậu; chọn theo an10.29 và không thêm giải thích.
  (12) 4.1: dấu [25] cuối khoá là dấu đếm của bản in, không phải lời kinh; ps1.1 và ps3.9 cũng không đưa dấu đếm tương tự (11 khoá trong tầng ps) sang bản Việt, nên bài này bỏ nó. Trong thân Pāli có thẻ in đậm (b) ở các câu hỏi Katamaṁ; bản Việt không mang thẻ này (cùng ps2.9).
