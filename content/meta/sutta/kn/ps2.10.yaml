  (14) Tên các bài ở kệ tóm lược 32.1 đến 32.4 (Yuganaddha, Sacca, Bojjhaṅga, Mettā, Virāga, Paṭisambhidā, Dhammacakka, Lokuttara, Bala, Suñña) dịch theo tên của các bài ps2.x đã có (ps2.5 ly tham, ps2.8 xuất thế gian, ps2.9 lực) và theo chuẩn từng từ; Dhammacakka → Pháp luân (ps2.9 chọn Phạm luân cho brahmacakkaṁ vì bám chữ brahma nên Pháp luân ở đây là dạng bám chữ dhamma); Paṭisambhidā → Vô ngại giải (ps3.10); chưa chắc các tên bài ps2.1 đến ps2.4, ps2.6, ps2.7 sẽ được dịch cùng dạng ở bài của chúng.

