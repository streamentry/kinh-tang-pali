notes: |-
  BÀI NÀY KHÓ NHẤT LÁT, VÌ BẢN MS KHÁC BẢN KINH KHÁC. Tôi đã tra ngoài: DPPN (dppn.bhavana.vn, mục Jambukhādakajātaka) và Rouse 1895 (sutta khác sacred-texts/bud/j2/j2147.htm) đều kể Ja 294 là câu chuyện thọ thần cây jambu, thỏ rừng và quạ. Nhưng Pāli đã ghim trong .cache/upstream/suttacentral/root/pli/ms lại nói bindussaro (chồn hương), vaggu (thiên nga), moracchā (cô) và Jambu- eater. Pāli là authority cuối cùng nên tôi dịch đúng vế kệ đã ghim, KHÔNG nhập câu chuyện bản khác vào. Người biên tập nên biết đây là khác biệt về truyền thống bản in, không phải lỗi dịch.

  CHỐT LƯỢC TỪNG VẾ. (1) sarvantānamuttamo: tôi đọc sarvanta = tất cả (từ điển có sarvanta = all, every; cũng có thể là saravantā = những kẻ đã nghe biết), dịch bậc tối thượng giữa tất cả. (2) Accuto: accu là liên từ hoặc, dịch hay là. (3) moracchā: từ điển gloss cô mào (chim cô), tôi dịch một con cô. (4) Byagghacchāpasarīvaṇṇa ở 2.3: đây là chỗ tôi bối rối nhất bài. Tôi tách byagha (hổ) + pasīvaṇa (bị bỏ rơi) và dịch kẻ bị hổ bỏ rơi. Cách đọc khác là Rouse dịch như con hổ non, coi Byagghacchā là một danh từ. Hai đường đều tra được, tôi chọn đường giữ cả hai thành phần và ghi lại đây. (5) kuṇapāda ở 3.3: dịch kẻ chân khép. (6) vantāda: dịch kẻ nói nước đôi. (7) aññamaññaṁ pasaṁsake ở 3.4: dịch thì khen điều khác với điều ta khen. (8) Jambu trong jambusākhāya: giữ dạng Pāli có dấu, cùng cách tôi giữ Rucirā, Jambukhādaka, Komāraputta trong tên bài.

  HAI VẾ DÙNG LẠI TỪ BÀI KHÁC. 3.1 Cirassaṁ vata passāmi trùng byte-for-byte với sn1.1:2.1 và sn2.18:6.1, và tầng đang có HAI cách: Lâu lắm rồi nay tôi mới thấy (sn1.1) và Thật lâu rồi, ta mới thấy (sn2.18). Tôi chọn nguyên văn sn1.1 và ghi lại để người biên tập biết là có hai bản; nếu chuẩn hoá thì sửa cả hai bài sn. 2.1 và 2.2 Kulaputtova jānāti / kulaputtaṁ pasaṁsituṁ trùng byte-for-byte với ja295 2.1/2.2, cùng trong lát, nên tôi đặt một lần rồi dùng lại nguyên văn cho cả hai bài; bài chưa có bản Việt thì lát sau phải dùng lại của tôi.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của kiểm cổ chỉ quét khoá Pāli từ 40 ký tự trở lên; ở bảy bài Jātaka của lát này mọi vế kệ đều ngắn hơn ngưỡng đó (vế dài nhất 35 ký tự) nên assertion về bản chất KHÔNG chạy. Tôi tự quét lại TOÀN BỘ 238 khoá của 14 bài từ tệp đã ghi trên đĩa: đủ khoá và không thừa so với Pāli (sắp theo thứ tự số), không rỗng, chuỗi NFC, số dấu lược khớp từng khoá, không có (…), không thừa dấu lược, và số dấu nháy kép so với Pāli từng khoá. Kết quả: 0 lỗi trên 238 khoá.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… hay dấu lược — đã kiểm bằng script trên từng khoá. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không mở rộng, không nén, không có (…) đứng một mình.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Tôi tự dựng chỉ mục Pāli↔Việt bằng script: nạp 5.764 tệp Pāli trong .cache/upstream/suttacentral/root/pli (bỏ *.apfs-orphan) và 4.136 tệp Việt dự án trong content/translation/vi/project/sutta — tổng 112.947 khoá Việt — ghép theo khoá, rồi quét từng khoá thân bài của lát theo nguyên văn căn thẳng và theo dạng đã chuẩn hoá dấu câu, nháy kép, hoa thường, và loại bỏ chính 14 tệp của lát để đo đúng trạng thái trước khi tôi ghi. Kết quả: 44 cặp Pāli trùng ở thân bài, 42 trùng byte-for-byte và 2 trùng sau chuẩn hoá. Trong đó 33 cặp đã có bản Việt ở bài khác, tôi DÙNG LẠI NGUYÊN VĂN ở: ja275 2.3, 2.4, 3.1, 3.2, 3.3, 3.4 ← ja274; ja294 3.1 ← sn1.1; mil3.1.11 3.2 và 3.3 ← sn10.12:5.2 và 5.3 (tôi lấy cả bộ bốn vế ở sn10.12:5.1–5.4 để bài này không tự mâu thuẫn với bài nguồn); Opammaṁ karohī ở mil3.1.11:2.1, mil3.1.14:2.1, mil3.1.15:2.1, mil3.2.2:2.1, mil3.5.10:2.1, mil3.7.16:2.1; mil3.1.14 3.1 ← mil3.1.12:3.1 và 3.5 ← mil3.1.12:3.4; Kallosi ở mil3.1.11:4.1, mil3.1.14:4.1, mil3.1.15:3.1, mil3.2.2:3.1, mil3.2.9:2.1, mil3.5.10:3.1 ← 54 tệp mil khác; mil3.2.2 2.4 ← mil3.5.9:2.3; mil3.5.10 6.1 ← mil3.4.10:5.1 và mil6.2.10:5.1; mil3.7.16 5.1 ← mil3.1.16:6.1. Mười một cặp còn lại thì chưa bản Việt nào ở bài khác có, tôi phải đặt mới: ja294 2.1 và 2.2, ja295 2.1 và 2.2 (bốn khoá này là hai cặp trùng nhau — chính bài trong lát đã trùng nhau; tôi đặt một lần rồi dùng lại nguyên văn cho cả hai bài), ja295 1.3 và 1.4 (trùng ja308:1.3 và 1.4), ja297 1.2 (trùng ja429:6.2 và ja430:6.2), ja298 1.2 (trùng sáu chỗ trong ja547), mil3.1.11 1.3 và 2.4 (trùng nhau, chỉ khác ở dấu nháy) và mil3.2.9 5.1 (trùng mil6.1.9:12.1). Ghi lại đây để lát sau dùng lại nguyên văn của tôi thay vì dịch lần hai.

  MỌI CÔNG THỨC HỘI THOẠI ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN. Rājā āha— → Vua nói: (đếm trong tầng mil có 30 tệp dùng Vua nói: và 12 tệp dùng Vua nói—, tôi theo đa số; 11 tệp còn lại dùng Vua nói:—). Thero āha— → Trưởng lão nói: (3 tệp dùng dạng có dấu hai chấm và 3 tệp dùng dạng có gạch nối, hòa nhau; tôi chọn dạng có dấu hai chấm để nhất quán với Vua nói: trong chính lát này). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā. (54 tệp mil, chỉ một cách). Opammaṁ karohī → Xin hãy xét một thí dụ ti. (đúng mil3.1.12:2.1, mil3.2.7:2.1, mil3.2.8:2.1). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa ti. (đúng mil3.1.12:3.1). Bhāsitampetaṁ, mahārāja, bhagavatā— → Điều này, này Đại vương, Đức Thế Tôn đã nói — (đúng mil3.1.12:3.4). Imasmiṁ vagge dasa pañhā và Imasmiṁ vagge soḷasa pañhā → Trong phẩm này có … câu hỏi. (đúng mil3.4.10:5.1, mil6.2.10:5.1, mil3.1.16:6.1). Rājā → vua, Mahārāja → Đại vương, bhagavā/bhagavatā → Đức Thế Tôn hoặc Đức Thật Chứng Ấy, Thero → Trưởng lão, Kāma → tình dục, sīla → đức hạnh.

  TÊN PHẨM ĐÃ CHỐT. Tikanipāta → Bộ Ba Bài Kinh (bốn bài lân cận đã có: ja276, ja291, ja292, ja293). Udapānavagga → Phẩm Nước Uống (đúng ja276 và ja279; tôi tự đếm bằng script trên Pāli gốc: 10 bài mang tên phẩm này là ja271..ja280, và ja275 nằm trong đúng khoảng đó). Kumbhavagga → Phẩm Bình Vò: tên này CHƯA có trong bảng chốt của BRIEF_VI3 §11, nên tôi theo đa số trong chính phẩm đang làm — ba bài đã có (ja291, ja292, ja293) đều dùng Phẩm Bình Vò; tôi tự đếm Kumbhavagga chiếm đúng ja291..ja300, trong đó lát này có sáu bài. Người biên tập nếu muốn chốt khác thì phải sửa cả mười bài cùng lúc. Các tên phẩm Milindapañha cũng theo đúng bầy bài lân cận: Mahāvagga → Đại Phẩm, Addhānavagga → Phẩm Khoảng Thời Gian, Buddhavagga → Phẩm Đức Phật, Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc.

  STATUS. Hai blocking error ở trên là thật và đo được (thiếu hẳn tầng Anh Sujato tại commit đã ghim; coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên mọi bài lát này đặt draft bất kể final_score. Tôi không nâng điểm để né blocker và cũng không hạ điểm để tỏ ra thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có tầng tham khảo nào.

  Giải quyết draft 2026-10-12: kiểm toán độc lập, đọc đối kháng 17 khoá từ Pāli root; sửa 12/12 khoá thân kệ (1.1–3.4) vì lỗi nghĩa thật, giữ nguyên 0.1–0.4 và 4.1. Mục "BÀI NÀY KHÓ NHẤT LÁT…", "CHỐT LƯỢC TỪNG VẾ" và hai câu về 2.1/2.2 ở mục "HAI VẾ DÙNG LẠI TỪ BÀI KHÁC" ở trên bị THAY THẾ hoàn toàn bởi mục này; kết luận cũ rằng bản ms "khác bản kinh khác" là hệ quả của việc cắt từ sai (xem dưới), không phải khác biệt truyền thống bản in.

  Các lỗi nghĩa cũ (đều do cắt từ sai, đảo cú pháp hoặc thêm nghĩa): 1.1 Koyaṁ = ko ayaṁ ("Ai đây"), không phải "Ở đâu rồi"; bindussaro vaggu là hai tính từ của giọng ("thánh thót, êm tai"), không phải "chồn hương" và "thiên nga"; hai chữ này cùng ở ja547:259.1 và 724.1 đã dịch "giọng thánh thót, êm tai" nên giữ đúng tiền lệ. 1.2 saravantānaṁ uttamo = "bậc nhất trong những kẻ có giọng", không phải "tất cả". 1.3–1.4: Accuto là tính từ của ko ayaṁ, đi với abl. jambusākhāya = "không rơi khỏi cành jambu" (accuta đã dịch "chưa rơi khỏi" ở an8.61); moracchāpa = mora (chim công) + chāpa (con non) nên "chim công non", không phải "cô"; câu cũ "kẻ ăn quả jambu" đảo toàn bộ. 2.1–2.2: kulaputta dịch "con nhà gia thế" theo ja536:90.1 và ja539:160.4 (hai nơi trong tầng; không có tiền lệ "đạo hạnh"); jānāti + pasaṁsituṁ = "mới biết khen ngợi", cũ để thiếu "khen" và vế sau "phán xét". 2.3–2.4: Byagghacchāpasarīvaṇṇa là hô cách của một từ ghép (byagghacchāpa "hổ con" + sarī + vaṇṇa "màu sắc") — dù sarī là "giống như" hay là dạng rút của sarīra, nghĩa vẫn là "có màu sắc như hổ con"; cũ tách thành "bị hổ bỏ rơi" là bịa. samma = "này bạn" (đo trên các Jātaka đã có bản Việt: đa số nơi dịch "này bạn", như ja451:3.4, ja538:48.1, ja542:23.1, ja537:82.3), dadāmi te = "ta cho bạn" (như ja537:79.4); cũ "ta cho ngươi ấy" đổi người nhận. 3.2–3.4: samāgate (thụ cách số nhiều) + vantādaṁ + kuṇapādañca: vanta-āda "ăn đồ nôn" (vanta dịch "chất nôn" ở an5.124), kuṇapa-āda "ăn xác chết" (kuṇapa dịch "xác chết" ở an8.19); cũ "kẻ nói nước đôi, kẻ chân khép" cắt kuṇapāda thành kuṇa + pāda; cũ 3.4 "khen điều khác với điều ta khen" bịa; aññamaññaṁ = "lẫn nhau", pasaṁsake = "đang khen ngợi". 3.2 cũ "đã đến với ta" đảo chủ thể (Pāli không có ngôi thứ nhất ở đây). 3.1 giữ nguyên "Lâu lắm rồi nay tôi mới thấy" vì đúng nguyên văn Pāli trùng ở sn1.1:2.1 và ja395:1.1 (cả hai đã dịch "tôi"); chỉ sn2.18:6.1 dịch "ta" — đo ở tầng: 3 "tôi" / 1 "ta", theo đa số.

  BLOCKER ĐÃ GỠ / GIỮ. (A) GIỮ: "Không có tầng tham khảo English Sujato" — đúng sự thật upstream, để cơ chế waiver của người biên tập xử lý. (B) GỠ: blocker "coverage tầng Anh 0/0 dưới ngưỡng 0.8": mẫu số = 0 (mọi vế kệ ngắn hơn 40 ký tự) nên cổng không đo được gì; đó là cách đặt blocker của tác giả cũ, không phải lỗi văn bản, và bài không có tệp Sujato nào để mà đối chiếu, nên không có đoạn "Sujato để trống" nào cần xét. Bài này ngắn, mọi khoá đã được đọc từ Pāli một mình. Vì vậy triangulation chỉ 6.5 (không bao giờ cao hơn 8.0) — không có bản Anh độc lập, chỉ có Pāli root cộng tiền lệ trong tầng dự án.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh). (1) Người nói các vế không đánh dấu trong Pāli: 1.1–1.4 là lời khen giọng, 2.1–2.4 là lời đáp mời ăn quả, 3.1–3.4 là lời nhận xét về hai kẻ khen nhau; bản dịch không gán người nói và không thêm tên loài vật. Đại từ 3.1 "tôi" chỉ theo tiền lệ nguyên văn Pāli trùng. (2) Accuto jambusākhāya: abl. "không rơi khỏi cành" là cách đọc bám ngữ pháp; nghĩa thực là "vẫn đậu vững trên cành" nhưng không thêm vào thân kinh. (3) sarī trong Byagghacchāpasarīvaṇṇa: hai cách đọc (sarī = giống như / sarī = sarīra) cho cùng một nghĩa nên không ảnh hưởng bản dịch. (4) kulaputta ở 2.1–2.2 là lời tâng bốc mỉa mai trong chuyện, bản dịch giữ nghĩa trực tiếp "con nhà gia thế". (5) Ngoài lát: ja295:2.1 và 2.2 trùng nguyên văn Pāli với ja294:2.1 và 2.2 nhưng ja295 vẫn dịch "kẻ làm tròn đạo hạnh" — lệch với bài này; nên sửa ja295 theo "con nhà gia thế mới biết / khen ngợi con nhà gia thế".

  TỰ KIỂM. Tập khoá Việt = tập khoá Pāli (17/17); 0.1–0.4 và 4.1 không đổi; nháy kép “” khớp Pāli từng khoá (mở ở 1.1, 2.1, 3.1; đóng ở 1.4, 2.4, 3.4); 0 dấu lược trong Pāli và 0 trong Việt; không chữ Pāli lọt vào thân bản dịch ngoài tên riêng jambu và tên bài. Pāli trùng trong chính bài: 0 cặp. Pāli trùng với bài khác đã dò: 1 cặp (3.1 với sn1.1, sn2.18, ja395), đã dùng lại theo đa số. Không có số trong bài. Bốn lệnh kho (npm run validate, npm test, npm run check, npm run build) chưa chạy trong lượt này nên technical_integrity vẫn 9.6.

