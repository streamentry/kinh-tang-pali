  **Năm phép kiểm tự viết, quét MỌI khoá** (ngưỡng 40 ký tự của `_hvi.py` ở đây bỏ sót gần
  hết bài nên không dùng):

  1. `set(khoá Việt) == set(khoá Pāli)`: đúng bằng 32/32, **0 orphan**, 0 thiếu, 0 thừa.
  2. Dấu nháy: đếm cả **nháy kép** `“”` lẫn **nháy đơn** `‘’`, và so **theo khoá** với Pāli —
     khớp tuyệt đối. Bản Việt cố ý **không** tự cân mỗi khoá, vì Pāli cũng vậy: `“` mở ở
     `:1.1` và `“` đóng ở `:7.3`; `‘` mở ở `:4.1` và `‘` đóng ở `:4.4`. Lũy kế về cuối
     bài: kép = 0, đơn = 0.
  3. `…pe…`: đúng 1 khoá mỗi bài (`:7.2` / `:5.2`), giữ **đúng một** `…`, không mở rộng.
  4. `…` trần: **không có** khoá nào chỉ chứa `…` trần — dấu lược duy nhất trong bài chính
     là `…pe…` ở điểm 3. Mẫu số phép này = 0 khoá riêng.
  5. Cặp Pāli trùng nguyên văn **trong chính bài**: **0 cặp** trên 32 khoá (mẫu số 32 khoá,
     và cả 32 chuỗi Pāli đều khác nhau), nên không có cặp nào mà Việt bắt buộc phải khác.
     Thay vào đó tôi dò **chéo cả phẩm**: **53** dòng Pāli của ba bài này cũng xuất hiện ở
