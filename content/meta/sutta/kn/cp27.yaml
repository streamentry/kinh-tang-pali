notes: Đối chiếu tam giác Pāli root + bản dịch tiếng Anh của Bhikkhu Sujato (21/21 khoá có bản tham khảo Anh đầy đủ). Bản dịch giữ đúng thể kệ Cariyāpiṭaka, đối chiếu với tích truyện tiền thân khỉ chúa trong Jātaka (Mahākapi/Vānarinda). Thuật ngữ 'saccapāramī' dịch là 'Chân Thật Ba-la-mật' nhất quán với cp28 và truyền thống Đại Tạng Kinh. Các đại từ nhân xưng và đối thoại được cân bằng ngoặc kép và ngoặc đơn chính xác. Đạt chuẩn xuất bản trực tiếp.
