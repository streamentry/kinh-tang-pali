notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli so git-hash với manifest (khớp). Đo bằng npm run store: 3 segment Pāli có nội dung (1.3, 2.1, 2.3), English coverage 0%, sàn 0,8 không đạt, reference-gaps.yaml chưa ghi nhận → draft.
  Khung đối đáp giữ nguyên một cách dịch với mil3.4.9, mil3.5.4, mil3.5.6, mil3.6.6, mil3.7.13: Vua nói— (Pāli mang gạch dài nên giữ gạch dài, khớp mil3.5.6 và mil3.6.6), thưa tôn giả Nāgasena, này Đại vương, và câu chốt Khéo lắm, thưa tôn giả Nāgasenā. Câu chốt đó nằm trong TIEN_LE_PHAI.md với nguyên văn bắt buộc, lấy từ mil3.5.6:2.1 và mil3.6.6:2.1. Colophon có dấu phẩy trước số thứ tự như cả 5 bài Milinda đã có.
  Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc, lấy nguyên văn từ mil3.7.13 (cùng phẩm, đã có). Dīghaṭṭhi là thời gian dài.
  yojana: 0 tiền lệ cho đơn vị này, giữ nguyên chữ yojana trong bản Việt. Lý do đo được: kho có 93 lần dùng trượng nhưng toàn bộ là cho jiñga (dây cương, dn14:1.31.12, mn151:2.5), tức đơn vị 10 m, không phải yojana; dịch yojana thành trượng sẽ sai số. Chữ yojana không mang dấu Pāli nên không vi phạm kiểm Pāli lọt. Số đo được: yojanasatika = một trăm, pañcayojanasatika = năm trăm.
  aṭṭhi ở 1.2 và 1.3 là xương; cùng gốc aṭṭhi ở 2.1 là động từ quá khứ macchā atthī, nghĩa là cá bị quăng lên, nên 2.1 dịch là cũng bị quăng lên. Bất định đã ghi: Pāli không nói cái gì quăng chúng lên; ngữ cảnh là biển nhưng tôi không thêm sóng hay bờ vào thân kinh. Taṁ kiṁ maññasi là ngài nghĩ thế nào về điều này; sutaṁ te là ngài có nghe. Nanu giữ thành Chẳng phải sao. Vì giữ nguyên tên đơn vị chưa có tiền lệ nên terminology 9.1.
  Khung nháy kép: 1.2 mở và 1.3 đóng theo Pāli (trích lời vua trong nháy cong); 2.1 và 2.3 mở và đóng trong một khoá; 3.1 đóng trọn. Tôi tự bắt được một lỗi thừa dấu đóng ở 2.3 khi đọc lại cặp Pāli↔Việt và đã sửa trước khi ghi.
  Không có bản Việt hiện hành ở commit đã ghim; không có Anh Sujato đã ghim và tôi không đọc english-project nên không tuyên bố đã đối chiếu English.
