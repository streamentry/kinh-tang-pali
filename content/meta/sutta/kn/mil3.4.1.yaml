notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Milindapañha. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ dùng lại: Nibbānavagga → Phẩm Niết-bàn (4 bài) · Rājā āha— → Vua nói: ·
  Opammaṁ karohī → Hãy xét một thí dụ (đa số) · Kallosi → Khéo lắm, thưa tôn giả Nāgasenā ·
  phassa → xúc chạm (an10.58 dùng chân xúc, an11 dùng xúc chạm) · vedanā → cảm thọ · saññā → tưởng ·
  cetanā → ý chí · viññāṇa → thức · vitakka vicāra → tầm tứ (dn1:3.22.5) · dadhi → sữa đông (19 tiền lệ) ·
  loṇa → muối · vinibbhujitvā nānākaraṇaṁ paññāpetuṁ → tách riêng để chỉ ra chúng khác biệt nhau (mn43:5.6).
  Sáu vị: ambila chua · lavaṇa mặn · tittaka cay · kaṭuka đắng · kasāya chát · madhura ngọt. Tầng chỉ có
  tiền lệ cho kaṭuka là đắng; tittaka và kasāya phải tách nhau vì cả kaṭuka lẫn kasāya đều hay bị dịch đắng.
  Tôi đặt tittaka là cay và kasāya là chát để cả sáu vị còn phân biệt được; nếu biên tập muốn theo cách dịch
  đắng-cay của dhp66 thì đổi ở cả mil3.4.1 và mil3.4.4 cùng lúc.
  Bất định đã ghi nhận. Jīraka không có tiền lệ trong tầng; PED cho là gừng hoặc hạt cumin, và tôi không
  dám gán thẳng là gừng vì siṅgivera ngay cạnh đã là gừng. Tôi dùng trung tính là hạt, giữ nguyên vị trí thứ
  tư trong danh sách gia vị. Marica → tiêu. Apākacandana ở ja77 cũng là từ chưa chắc; ở đây không có.
  Sakuṇā vā rasaṁ vā kareyya: tôi dịch là nấu một món không vị, hoặc một món có vị; vā ở đây là hoặc chứ không
  phải liệt kê. Sakena sakena lakkhaṇena upaṭṭhahantī: chúng từng nốt hiện ra bằng đặc trưng riêng.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0. Nháy kép: ngoặc ngoài mở ở 1.2 và đóng ở 1.3, mở ở 2.2
  và đóng ở 2.3, mở ở 2.4 và đóng ở 2.5; trong đó có hai dấu nháy cong lồng, đúng như Pāli. Cân trên cả bài.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
