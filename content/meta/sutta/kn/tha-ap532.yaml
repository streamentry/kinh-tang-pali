notes: |-
  Dịch trọn 196 khoá trực tiếp từ Pāli root. Không có bản Anh của Sujato, không có lớp english-project và không có tầng vietnamese-current cho tha-ap532 tại commit đã ghim. Bản Việt nguyên bài của Bhikkhu Indacanda trên SuttaCentral (mục tra cứu toàn văn, không phải tầng store, không căn lề theo segment) chỉ được đọc để kiểm cách hiểu ở những chỗ khó; câu chữ bản dịch này viết từ Pāli, và ở các chỗ bất định dưới đây có khác bản đó. Vì vậy không tuyên bố đã đối chiếu độc lập một bản tham khảo nào. Riêng khoá 12.1 đến 13.4 song song gần nguyên văn với iti112:9.1 đến 10.4, nơi có Sujato và bản Việt đã có; cách dịch ở đây bám cách đã có ở iti112 (lậu hoặc, nghi hoặc, sự đoạn tận mọi nghiệp, sanh y, sư tử vô thượng, bánh xe Phạm).
  Tiền lệ đã đo trên tầng tha-ap (kể cả các bài khác trong phẩm): 44 khoá của bài có Pāli trùng nguyên văn với bài khác, tổng 5342 cặp đã dò; 4563 cặp giống hệt bản chọn, 779 cặp khác (chủ yếu do ngôi tôi so với ta, chữ hoa đầu khoá và các biến thể diễn đạt). Lựa chọn theo đa số phạm vi gần nhất (tha-ap520 đến tha-ap560) và ghi cả toàn tầng: Các phiền não của ta đã được thiêu rụi 24/40 gần, 128/186 toàn tầng; Thật lành thay sự đến của ta 24/40 gần, 123/179 toàn tầng; Ta không còn biết đến đọa xứ 12/22 gần, nhưng toàn tầng dạng Ta không biết mình rơi vào khổ đau 139/436 đứng đầu, Tôi không còn biết đến đọa xứ nào 103 và Ta không còn biết đến đọa xứ 70 (chọn dạng gần nhất, cũng là dạng của tha-ap531); Bốn vô ngại giải 540/545 toàn tầng; Therāpadāna 536/547; ngôi kể ta 28 so với tôi 17 ở tha-ap520 đến tha-ap560 (142 so với 64 toàn tầng), theo tha-ap526, tha-ap531, tha-ap533. Lời kết 47.1 dùng nhóm nói những bài kệ này (số nhiều, theo imā gāthāyo; nhóm số ít là lỗi đã gặp ở nhiều lát). Pāli trùng nguyên văn trong chính bài: 10.4 và 38.4 (vicittapaṭibhānavā) có bản Việt giống hệt nhau; 17.3 và 20.1 (Akhilo ca visallo ca) chỉ khác nhau đúng ở chữ hoa đầu khoá theo vị trí câu; 0 cặp lệch ngoài chỗ ấy (3 cặp, tính cả ba khoá …pe…).
  Tên bài :0.3 trong Pāli không bắt đầu bằng số (Sugandhattheraapadāna) nên bản Việt không có số thứ tự; translationTitle bằng đúng giá trị :0.3. Kiểu tên: ở tha-ap500 đến tha-ap560 dạng Ký Sự Về Trưởng Lão 44 so với Bài Kệ Tuyên Ngợ 15; ở tha-ap520 đến tha-ap531 là 8 so với 4; ở tha-ap480 đến tha-ap531 là 24 so với 27 (Bài Kệ Tuyên Ngợ 27); toàn tầng thì Bài Kệ Tuyên Ngợ 254, Bài Kệ Tuyên Ngôn 138, Ký Sự 146 (chữ Ngợ là lỗi chính tả đã biết, không dùng). Hai phạm vi cho đa số khác nhau; chọn dạng Ký Sự theo phạm vi gần nhất và theo tha-ap531, tha-ap533; người biên tập nên phán một lượt cho cả cuốn. Tên phẩm 0.2: tha-ap523 đến tha-ap531 có Phẩm Cỏ Dâng Cúng 4 (tha-ap523, 524, 529, 530), Phẩm Cúng Dường Cỏ 2, Phẩm Bậc Cho Cỏ 2, Phẩm Tiṇadāyaka 1; chọn dạng đa số, và tên này vẫn là chỗ người biên tập nên thống nhất cho cả phẩm. 49.1 tepaññāsamo là thứ năm mươi ba (te 3 cộng paññāsa 50); 50.1 Tóm tắt phẩm này 42 so với Tóm lược 10 toàn tầng. 48.1 theo kiểu Ký Sự Về Trưởng Lão X, thứ mười.
  Thuật ngữ đã đo: Trong hiền kiếp này 3 so với 1; thân quyến của Phạm thiên 5 so với 1; Đại Ẩn Sĩ cho mahāmuni (như tha-ap531); bậc Trời giữa chư thiên cho devātideva (tha-ap314 và mil5.1.3; dạng Thiên Trung Thiên chỉ 2 ở vv64 và mil5.4.7); cảnh giới bất tử cho amataṁ padaṁ (tha-ap486, 340, 20 và 520); vườn nai cho migadāya (bv18, 7 chỗ); chim ca-lăng-tần-già cho karavīka (tha-ap353, 433, 540); bánh xe Phạm cho brahmacakka theo iti112 (toàn tầng prose Pháp luân 25, bánh xe tối thượng 14, Phạm luân 2, bánh xe Phạm 1; giữ dạng khác dhammacakka để không làm phẳng); đa văn cho bahussuto; biện tài phong phú cho vicittapaṭibhānavā (tha-ap549); tự tin cho visārado (tha-ap533, tha-ap409); sanh y cho upadhi (iti112 và sn4.25); bậc tối thượng trong các ẩn sĩ cho isisattamo (4 chỗ); không dao động cho anejo và aneñjo (tha-ap395, 533); không chai cứng cho akhilo (snp3.6) và đã nhổ mũi tên cho visallo (snp2.13); không kiêu mạn cho nimmāno (tha-ap534); bậc Hộ Chủ cho nātho (tha-ap544); thầy giải phẫu cho sallakattako (tha-ap552); ngang bằng với những bậc ngang bằng cho samasamo (bv16 có asamasamo); sự tịch tịnh cho nibbuti (tha-ap25); vô vi cho asaṅkhata (vv53); bậc làm chủ ngôn từ cho vāgiso (tha-ap533). Các từ không có tiền lệ trong tầng (0): appagabbo, sutāsuto, accherasatto, saccaneyyantagū, mahatthikā, dayālayo, haṁsaruta.
  Số Pāli: bāttiṁsa ở 2.2 là dvā 2 cộng tiṁsa 30, bằng 32, dịch ba mươi hai (tiṁsa là 30, không phải 3); catasso ở 46.1 là 4; satevīsaṁ ở 52.3 là sa cộng tevīsaṁ, tức 100 cộng 23, bằng 123 (tevīsa là te 3 cộng vīsa 20; cách đọc này theo tiền lệ tha-ap52:24.5 satālīsaṁ là một trăm thêm bốn mươi, và khớp với tổng một trăm hai mươi ba của bản Việt nguyên bài); tepaññāsamo ở 49.1 là 53; dasamaṁ và dasamo là thứ mười. Không có cụm tiṁsakappasahassa trong bài, nên không cần phân xử. Không có lời thọ ký tương lai kèm số kiếp; pāpuṇissāmi ở 42.4 chỉ là điều người nói tự tuyên bố sẽ đạt, dịch ta sẽ đạt đến. Số kệ 123 của 52.3 chưa đối soát được với số kệ đếm thực tế của mười bài trong phẩm (đếm sơ bằng số khối kệ trước dòng kết của từng bài ra 126); chênh lệch này là của tầng Pāli, không phải của bản dịch.
  Dấu ngoặc: kép mở ở 1.1 và đóng ở 46.3; nháy đơn mở ở 12.1 và đóng ở 24.4; khớp Pāli từng khoá, 0 lệch trên 196 khoá. Dấu lược: ba khoá …pe… (44.2, 45.2, 46.2) giữ đúng một …, không mở rộng; Pāli không có … trần và không có (…) trần; bản Việt cũng không có. Đối chiếu 196 khoá: đủ khoá, đúng thứ tự, NFC sạch, 0 khoá rỗng. Tên riêng ở 51.1 đến 52.2 (khoá tóm tắt) giữ dạng Pāli của đúng khoá, gồm cả đuôi -o, theo tiền lệ tha-ap522 và tha-ap531.
  Bất định và lựa chọn cần người biên tập lưu ý, theo mức nặng: (1) 18.3 sutāsuto là hapax trong toàn bộ snapshot Pāli đã ghim, không có tiền lệ; dịch tách thành suta cộng asuta là bậc đã nghe và chưa nghe, giữ sát chữ nhưng chưa phân xử được; bản Việt nguyên bài đọc khác (người con trai đã lắng nghe). (2) 18.4 sito dịch mỉm cười theo nghĩa sita trong từ điển; các cách đọc khác (bị ràng buộc, hoặc sīto là mát dịu) chưa loại trừ được. (3) 20.4 gandhā trong Pāli root khó phân tích như danh từ chỉ người làm; dịch bậc đi đến theo cách đọc gantā của bản Việt nguyên bài, nên đây là phỏng đoán đọc chữ chứ không phải dịch sát chữ gandhā. (4) 19.1 dhātā dhatā ca santi ca: dhatā dịch bậc giữ gìn, santi dịch bậc an tịnh; cả hai chưa chắc. Bản Việt nguyên bài có ba vị trí đầu là thiết lập, duy trì, phá hủy, nên santi có thể đọc khác. (5) 36.1 Jino te titthikākiṇṇe: te không dịch được rõ; giữ jino làm chủ ngữ của abhibhuyya ở 36.2 (Đấng Chiến Thắng khuất phục ngoại đạo), còn cách đọc khác là người nói khuất phục ngoại đạo, như bản Việt nguyên bài; ghép te với nơi chen chúc các ngoại đạo ấy. (6) 30.2 hitāya ca na sadisaṁ và 30.4 saṅgho vīrasamāyuto: câu này khó phân tích, dịch sát chữ vì lợi ích, và không gì sánh bằng, và đoàn chúng gắn bó với các bậc anh hùng; nghĩa cả khổ thơ chưa chắc. (7) 16.4 sakko garūsupi: garu hiểu là bậc thầy (số nhiều vị trí cách), sakko hiểu là có năng lực; sakko cũng có thể là Sakka (Đế-thích). (8) 11.3 và 11.4 vaṇṇa hiểu là lời tán dương (theo vaṇṇento ở 25.3 và buddhavaṇṇena ở 40.1); bản Việt nguyên bài hiểu là màu sắc (màu da vàng chói) của hemavaṇṇa. (9) 17.2 raṇañjaho dịch dứt bỏ lỗi lầm theo tha-ap533:11.4; raṇa cũng có thể là chiến trận. (10) 15.4 appagabbo dịch không ngạo mạn (không có tiền lệ); 17.1 brahmā hiểu là bậc Phạm thiên ở nghĩa tôn xưng. (11) 21.3 sahitā dịch bậc kham nhẫn (theo cách đọc của bản Việt nguyên bài) và kantā dịch bậc cắt xẻ (danh từ chỉ người làm); kantā cũng có thể hiểu là đáng mến. (12) 14.3 assattho dịch đã được an ổn. (13) 23.4 saccaneyyantagū dịch đã đến tận cùng các sự thật và các điều cần được biết; neyya hiểu là điều cần được biết. (14) 33.1 santaṁ yasaṁ dịch danh vọng an tịnh; santa cũng có thể là chân thật, hoặc hai danh từ sự an tịnh và danh vọng như bản Việt nguyên bài. (15) 40.1 và 40.2 Buddhavaṇṇena sattānaṁ kilese apanesahaṁ: sattānaṁ gắn với kilese (phiền não của chúng sinh); cách đọc khác là sattānaṁ gắn với buddhavaṇṇena. (16) 6.3 và 6.4 Āsahaṁ dhanadhaññassa pahūtassa bahū tadā dịch ta là người có tài sản và lúa gạo, dồi dào, rất nhiều vào lúc ấy. (17) 13.3 Sadevakassa lokassa trùng nguyên văn tha-ap406:8.1 nhưng ở đó dịch Trong thế gian cùng chư thiên (sở hữu cách thuộc nhóm so sánh), còn ở đây là sở hữu cách của brahmacakkappavattako nên dịch cho thế gian cùng chư thiên; Pāli trùng mà bản Việt khác này là có chủ ý. (18) 27.4 sabbagandhova dịch toàn là hương thơm; 28.3 parisanto hiểu là parisā cộng anto (trong hội chúng). (19) 47.1 dịch Tôn giả Trưởng lão Sugandha; 28.4 sarīro hiểu là thân của ta, cũng thơm như hương miệng.
  Kiểm kỹ thuật chưa chạy trong lượt này: npm run validate, npm test, npm run check và npm run build; vì vậy technical_integrity đặt 9.6 và không tuyên bố technical gate đã pass.
