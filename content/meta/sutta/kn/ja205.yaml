    không phải tư cách bậc hiền tri) và không có trong Pāli; thành "người tự khen mình".
  - `2.4` `nāyaṁ asmāka ruccati`: `asmāka` là sở hữu cách số nhiều ("của chúng tôi"), bản cũ "ta" là
