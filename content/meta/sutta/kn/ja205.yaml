  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja205:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  Giải quyết draft 2026-10-12 (ja205, Gaṅgeyyajātaka). Đọc đối kháng từng khoá từ Pāli; bản cũ
  của chính khoá này có 5/15 khoá sai nghĩa thật và 3 khoá thêm sắc độ không có trong Pāli.
  Các mục phía trên (tầng tham khảo, chốt kiểm, thuật ngữ, bất định) mô tả cả lát 14 bài, không
  riêng bài này; các khoá của ja205 dưới đây THAY THẾ mọi chi tiết cũ về nội dung bài này.
  - `1.4` `nigrodhaparimaṇḍalo` (sai nghĩa): bản cũ "được vòm cây nigrodha bao quanh" đọc compound
    thành bị bao quanh. Đúng là tính từ của `puriso`: `parimaṇḍala` = tròn đều, `nigrodha` = cây
    đa; thành "tròn trịa như cây đa". Tiền lệ đo được: 4/4 khoá có `nigrodhaparimaṇḍalo` (dn14, dn30
    ×2, mn91) đều dịch "như cây đa"; ở đó dịch "cân đối" vì đi cùng sải tay bằng thân, còn ở bài
    này không có vế đó nên giữ nghĩa "tròn".
  - `1.5` `īsakāyatagīvo` (bịa nghĩa): bản cũ "sống bằng đồ ăn mua ở chợ" hoàn toàn không có trong Pāli.
    `īsaka` = chút ít, `āyata` = dài ra, `gīva` = cổ → "cổ dài ra đôi chút".
  - `1.6` `sabbeva atirocati`: bỏ "cũng rực rỡ" (thêm "cũng", thêm sắc độ); chủ thể là `puriso`
