notes: |-
  **Nguồn.** Pāli root từ snapshot bilara đã ghim `11c9d708978cde8ba61096d8a75f7ddfb846f639`,
  đường dẫn `kn/cp/cp30_root-pli-ms.json`. Bản Anh tham khảo là Bhikkhu Sujato cùng commit,
  **44/45 khoá có chữ**, khoá rỗng duy nhất là `:10.1` (dòng ghi số thứ tự). Bản Việt hiện
  hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú ⇒ không có bản Hòa
  thượng Thích Minh Châu để đối chiếu. Trong Jātaka có `ja75` (*Kinh Cá*) là cùng truyện và
  cùng công thức lời thề — tôi đã đọc và dùng làm đối chiếu từ ngữ.

  **Coverage: `substantiveSegments = 0`** (45 khoá đều là câu kệ ngắn hơn 40 ký tự), nên ngưỡng
  0.8 ở `scripts/validate.ts:242` và `scripts/queue.ts:86` không áp dụng, `record-reference-gaps`
  bỏ qua, và không cần entry trong `content/meta/reference-gaps.yaml`. Tầng Anh ở bài này có đủ.

  **Pāli trùng nguyên văn: 9/45 khoá.** Dùng lại nguyên văn ở: `0.1` (22 bài — theo số đông
  *Hạnh Tạng* như đã ghi ở `cp11`), `0.2` (10 bài, *Phẩm Yudhañjaya*), `1.1` (15 bài; 9 viết
  *“Lại nữa, vào thời thuở nọ,*), `5.1` ≡ `cp32:5.1` (*Ta nhớ lại điều pháp chân chính,*),
  `7.4` ≡ `ja75:1.2` (*hãy phá bỏ kho tàng của con quạ;*), `7.5` ≡ `ja75:1.3`
  (*hãy làm cho con quạ gánh chịu nỗi buồn,*), `9.5` ≡ `cp27:4.3` **và** `cp32:6.5`
  (*Về sự chân thật, không ai sánh bằng ta:*), `9.6` ≡ `cp27:4.4`
  (*đây là Chân Thật Ba-la-mật của ta.”*).
  **Ghi rõ mâu thuẫn chưa giải được:** cùng một Pāli `esā me saccapāramī”ti.` mà `cp27:4.4`
  đóng bằng `”` còn `cp32:6.6` đóng bằng `”ti`. Tôi lấy của `cp27` (2 chỗ trùng hơn 1, và
  `cp27` cùng phẩm) — nhưng đây là cái lệch đã được ghi ở `notes` của `sn45.8`, người điều phối
  nên gộp.

  **Thuật ngữ — chỗ tôi cố ý không theo Sujato, và vì sao.** `2.1` `gijjhā` là **chim kền kền**
  (kền kền), không phải bồ câu: `dn22:8.1` (`…gijjhehi vā khajjamānaṁ…`) đã dịch *kền kền* và
  `mn54:16.1` (`gijjho vā kaṅko vā kulalo vā…`) cũng vậy. `bồ câu` là *kapota* và là cách dịch
  sai đã lan rộng trong một số bản dịch cũ — tôi không dùng. `2.2` `kaṅkā` là **sếu**
  (Sujato: *herons*), `kulala` là **diều hâu** (theo `dn22:8.1` và `mn54:16.1`), `senaka` là
  **chim ưng** (Sujato: *falcons*). `5.2` `paramattha` dịch **chân tướng** theo `thig6.3:5.3`.

  **Bất định đã phân xử, ghi ở đây chứ không thêm vào thân kinh.** (1) `pajjunno` là tên riêng của
  đám mây mưa; tôi giữ **Pajjuna** như `ja75:1.1` và `dn20:17.7` đã làm, thay vì dịch *mây mưa*
  ở mỗi chỗ. (2) `4.1` `dhammatthaṁ` tôi dịch *ý nghĩa của Pháp* theo nghĩa đen, còn Sujato
  dịch *the value of the Dhamma* (*giá trị của Đạo pháp*) — theo Pāli `attha` là nghĩa/ý nghĩa;
  trong đoạn này `dhammattha` mới là điều Bồ-tát quán xét để tìm chỗ nương, nên *ý nghĩa* hợp lý
  hơn. (3) `6.3`–`6.4` `nābhijānāmi … hiṁsitaṁ` — Pāli nói *ta không tìm thấy trong mình* chuyện
  cố ý gây hại, không phải *ta không biết*; tôi giữ đúng động từ *thấy trong mình* thay vì
  *biết*, vì `yato sarāmi attānaṁ` ở `6.1` nói về việc tự nhìn lại. (4) `8.3`–`8.4` tôi theo đúng
  thứ tự Pāli (rảo xuống cao nguyên và thung lũng **trước**, rồi mới *lập tức mưa*), khác Sujato
  vốn dịch ngược thứ tự.

  **Dấu lược và ngoặc.** `cp30` không có khoá nào chứa `…pe…`. Pāli mở `“` ở `1.1` và đóng `”`
  ở `9.6`; lời Bồ-tát tự hỏi (`3.3`–`3.4`) và lời tuyên thệ (`6.1`–`6.4`, rồi `7.6`) được Pāli
  đặt trong `'` nên tôi dùng nháy cong `‘…’`.

  **Cổng kỹ thuật.** Agent dịch không được chạy lệnh npm. Tôi tự kiểm: JSON hợp lệ, đủ 45/45
  khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp (bài không có lược), không
  `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không khoá nào trùng nguyên văn
  Pāli, thứ tự khoá đúng thứ tự số.