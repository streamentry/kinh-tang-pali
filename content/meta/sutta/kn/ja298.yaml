  ancient-buddhist-texts.net/.../Jatakagathavannana/298.htm; đã đối chiếu cả ba kệ (17 khoá). Kệ 1 là
  lời mời ăn quả, kệ 2 lời đáp "no đủ vì kính người lớn", kệ 3 câu kết; chú giải glossa dumapakkāni
  māsito là đã ăn quả sung… cho no, nên māsito là "đã ăn" như bản Việt; Cowell và chú giải dịch yaṁ ở
  3.1 thành "khi" (cùng nghĩa với cách đọc "chuyện… thì…"). Sửa 0 khoá. Bất định: người nói từng kệ
  (Cowell: khỉ mặt đen kệ 1 và 3, khỉ mặt đỏ kệ 2; chú giải không nêu rõ); kapitthana giữ phiên âm
  (chú giải: sung trắng, không chắc loài).
