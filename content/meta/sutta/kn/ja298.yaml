notes: |-
  CHỐT LƯỢC TỪNG VẾ. (1) kapitthanā ở 1.2 (0 tiền lệ trong tầng, đã tra bằng grep): kapittha là Limonia acidissima, tên Việt phổ thông là hồng xiêm hay mít ẻ; tôi dịch cây mít theo cách quen thuộc trong kinh Việt và theo ja208:1.2 đã dùng quả mít cho một danh sách trái cây, và ghi rõ để người biên tập xét. (2) nigrodha là cây bàng, dịch cây bàng. (3) na hi jiṇṇo jarākapī ở 3.4 là câu khuyết: bạc già tuổi già không đáng bị khinh, tôi dịch chứ bạc già đâu có hết thời xuân; ý này là lời thọ thần cây an ủi con khỉ già, và tôi không đưa vào thân kinh. (4) suhito ở 2.1 và 2.3 là no béo, tôi dùng no béo thay vì mập để giữ nghĩa được no đủ.

  HAI VẾ CHƯA CÓ BẢN VIỆT NÀO. 1.2 nigrodhā ca kapitthanā trùng byte-for-byte với sáu chỗ trong ja547; 1.2 cũng là vế người sau sẽ phải dùng lại. Tôi đặt mới và ghi lại ở đây.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của kiểm cổ chỉ quét khoá Pāli từ 40 ký tự trở lên; ở bảy bài Jātaka của lát này mọi vế kệ đều ngắn hơn ngưỡng đó (vế dài nhất 35 ký tự) nên assertion về bản chất KHÔNG chạy. Tôi tự quét lại TOÀN BỘ 238 khoá của 14 bài từ tệp đã ghi trên đĩa: đủ khoá và không thừa so với Pāli (sắp theo thứ tự số), không rỗng, chuỗi NFC, số dấu lược khớp từng khoá, không có (…), không thừa dấu lược, và số dấu nháy kép so với Pāli từng khoá. Kết quả: 0 lỗi trên 238 khoá.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… hay dấu lược — đã kiểm bằng script trên từng khoá. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không mở rộng, không nén, không có (…) đứng một mình.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Tôi tự dựng chỉ mục Pāli↔Việt bằng script: nạp 5.764 tệp Pāli trong .cache/upstream/suttacentral/root/pli (bỏ *.apfs-orphan) và 4.136 tệp Việt dự án trong content/translation/vi/project/sutta — tổng 112.947 khoá Việt — ghép theo khoá, rồi quét từng khoá thân bài của lát theo nguyên văn căn thẳng và theo dạng đã chuẩn hoá dấu câu, nháy kép, hoa thường, và loại bỏ chính 14 tệp của lát để đo đúng trạng thái trước khi tôi ghi. Kết quả: 44 cặp Pāli trùng ở thân bài, 42 trùng byte-for-byte và 2 trùng sau chuẩn hoá. Trong đó 33 cặp đã có bản Việt ở bài khác, tôi DÙNG LẠI NGUYÊN VĂN ở: ja275 2.3, 2.4, 3.1, 3.2, 3.3, 3.4 ← ja274; ja294 3.1 ← sn1.1; mil3.1.11 3.2 và 3.3 ← sn10.12:5.2 và 5.3 (tôi lấy cả bộ bốn vế ở sn10.12:5.1–5.4 để bài này không tự mâu thuẫn với bài nguồn); Opammaṁ karohī ở mil3.1.11:2.1, mil3.1.14:2.1, mil3.1.15:2.1, mil3.2.2:2.1, mil3.5.10:2.1, mil3.7.16:2.1; mil3.1.14 3.1 ← mil3.1.12:3.1 và 3.5 ← mil3.1.12:3.4; Kallosi ở mil3.1.11:4.1, mil3.1.14:4.1, mil3.1.15:3.1, mil3.2.2:3.1, mil3.2.9:2.1, mil3.5.10:3.1 ← 54 tệp mil khác; mil3.2.2 2.4 ← mil3.5.9:2.3; mil3.5.10 6.1 ← mil3.4.10:5.1 và mil6.2.10:5.1; mil3.7.16 5.1 ← mil3.1.16:6.1. Mười một cặp còn lại thì chưa bản Việt nào ở bài khác có, tôi phải đặt mới: ja294 2.1 và 2.2, ja295 2.1 và 2.2 (bốn khoá này là hai cặp trùng nhau — chính bài trong lát đã trùng nhau; tôi đặt một lần rồi dùng lại nguyên văn cho cả hai bài), ja295 1.3 và 1.4 (trùng ja308:1.3 và 1.4), ja297 1.2 (trùng ja429:6.2 và ja430:6.2), ja298 1.2 (trùng sáu chỗ trong ja547), mil3.1.11 1.3 và 2.4 (trùng nhau, chỉ khác ở dấu nháy) và mil3.2.9 5.1 (trùng mil6.1.9:12.1). Ghi lại đây để lát sau dùng lại nguyên văn của tôi thay vì dịch lần hai.

  MỌI CÔNG THỨC HỘI THOẠI ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN. Rājā āha— → Vua nói: (đếm trong tầng mil có 30 tệp dùng Vua nói: và 12 tệp dùng Vua nói—, tôi theo đa số; 11 tệp còn lại dùng Vua nói:—). Thero āha— → Trưởng lão nói: (3 tệp dùng dạng có dấu hai chấm và 3 tệp dùng dạng có gạch nối, hòa nhau; tôi chọn dạng có dấu hai chấm để nhất quán với Vua nói: trong chính lát này). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā. (54 tệp mil, chỉ một cách). Opammaṁ karohī → Xin hãy xét một thí dụ ti. (đúng mil3.1.12:2.1, mil3.2.7:2.1, mil3.2.8:2.1). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa ti. (đúng mil3.1.12:3.1). Bhāsitampetaṁ, mahārāja, bhagavatā— → Điều này, này Đại vương, Đức Thế Tôn đã nói — (đúng mil3.1.12:3.4). Imasmiṁ vagge dasa pañhā và Imasmiṁ vagge soḷasa pañhā → Trong phẩm này có … câu hỏi. (đúng mil3.4.10:5.1, mil6.2.10:5.1, mil3.1.16:6.1). Rājā → vua, Mahārāja → Đại vương, bhagavā/bhagavatā → Đức Thế Tôn hoặc Đức Thật Chứng Ấy, Thero → Trưởng lão, Kāma → tình dục, sīla → đức hạnh.

  TÊN PHẨM ĐÃ CHỐT. Tikanipāta → Bộ Ba Bài Kinh (bốn bài lân cận đã có: ja276, ja291, ja292, ja293). Udapānavagga → Phẩm Nước Uống (đúng ja276 và ja279; tôi tự đếm bằng script trên Pāli gốc: 10 bài mang tên phẩm này là ja271..ja280, và ja275 nằm trong đúng khoảng đó). Kumbhavagga → Phẩm Bình Vò: tên này CHƯA có trong bảng chốt của BRIEF_VI3 §11, nên tôi theo đa số trong chính phẩm đang làm — ba bài đã có (ja291, ja292, ja293) đều dùng Phẩm Bình Vò; tôi tự đếm Kumbhavagga chiếm đúng ja291..ja300, trong đó lát này có sáu bài. Người biên tập nếu muốn chốt khác thì phải sửa cả mười bài cùng lúc. Các tên phẩm Milindapañha cũng theo đúng bầy bài lân cận: Mahāvagga → Đại Phẩm, Addhānavagga → Phẩm Khoảng Thời Gian, Buddhavagga → Phẩm Đức Phật, Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc.

  STATUS. Hai blocking error ở trên là thật và đo được (thiếu hẳn tầng Anh Sujato tại commit đã ghim; coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên mọi bài lát này đặt draft bất kể final_score. Tôi không nâng điểm để né blocker và cũng không hạ điểm để tỏ ra thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có tầng tham khảo nào.

  GIẢI QUYẾT DRAFT 2026-10-12 (thay thế các mục (1)–(4) CHỐT LƯỢC TỪNG VẾ ở trên, vốn sai). Kiểm toán độc lập đọc đối kháng 12 vế kệ từ Pāli; Lỗi nghĩa thật ở 10/12 vế kệ (1.2, 1.3, 2.1, 2.2, 2.3, 2.4, 3.1, 3.2, 3.3, 3.4); 1.1 và 1.4 chỉ chỉnh chữ; các khoá 0.x và 4.1 không đổi. Sửa: 1.1 udumbarā cime pakkā = những quả sung này đã chín (bỏ "cây này"); 1.2 nigrodhā ca kapitthanā: nigrodha là cây đa chứ không phải bàng (ja547 đã dịch cây đa ở 335.2, 496.2, 516.2, 594.2 — 4/4 cùng một cách), kapitthana không phải mít (mít là panasa, ja547:334.1 liệt kê riêng Ambā kapitthā panasā), nên theo ja547 dùng nguyên văn "cây đa và cây kapitthana;" (ghi chú trước tự nhận là đặt mới và sai); 1.3 ehi nikkhama bhuñjassu = hãy đến, hãy ra mà ăn (bỏ "xuống đây", "đi" — không có trong Pāli; nikkhama là đi ra, không có hướng xuống); 1.4 kiṁ jighacchāya miyyasi = sao ngươi chết vì đói. 2.1–2.2 evaṁ so suhito hoti, yo vuḍḍhamapacāyati là "người nào kính trọng người lớn tuổi thì được no đủ như thế" — bản cũ "nhờ ăn không biết chán" hoàn toàn không có trong Pāli; apacāyati dịch kính trọng và vuḍḍha dịch người lớn tuổi theo ja37:1.1 (Ye vuḍḍhamapacāyanti = Ai kính trọng người lớn tuổi); suhito = no đủ (bỏ "no béo"). 2.4 dumapakkāni māsito = đã ăn quả chín của cây. 3.1–3.4: bản cũ đọc vanejo là người buôn bán và dịch thành chuyện mua bán — sai hẳn; vanejo là kẻ sinh/sống ở rừng (vana + ja), vañceyya là lừa, kapino kapi là khỉ (lừa) khỉ, daharo kapi saddheyya là khỉ non có thể tin, na hi jiṇṇo jarākapī là vì khỉ già lão thì không (tin); jarākapi cũng khớp tiêu đề dòng tóm tắt "caṇḍi jarākapinā" ở ja300:6.3. Tên phẩm: Kumbhavagga = Phẩm Bình Vò (9/10 bài của phẩm đã dùng, chỉ ja300:0.3 ghi Phẩm Kumbha; không đổi ở bài này). Tiêu đề Kinh Cây Sung giữ (udumbara = sung, khớp ja208:1.4).

  BLOCKER ĐÃ GỠ (loại B/C): mệnh đề "Coverage tầng Anh đo được là 0 trên 0 khoá Pāli có nội dung" đã xoá. Mẫu số bằng 0 nghĩa là cổng độ phủ không đo được gì — không phải một khoản mất mát cần ghi nhận trong reference-gaps; đồng thời đã đọc kỹ cả 12 vế từ Pāli, bản dịch tự đứng vững ở mức đủ để không coi là lỗi văn bản. Tầng Việt hiện hành chỉ có Pháp Cú nên bài này không có tham khảo Việt truyền thống (giới hạn tham chiếu, không phải lỗi văn bản). BLOCKER GIỮ: Sujato không có bài này tại commit đã ghim (loại A, sự thật về upstream; chờ waiver no-upstream-english của người biên tập).

  BẤT ĐỊNH CÒN LẠI. (a) Người nói từng kệ: văn bản Pāli không nêu và chú giải không có trong kho; kệ 1 là lời mời ăn (đại từ "ngươi" giữ theo bản cũ, chưa chắc về mức lễ độ), kệ 2 là lời đáp, kệ 3 là câu kết — bản dịch không gán nhân vật. (b) māsito ở 2.4: dịch như dạng quá khứ phân từ "đã ăn" (asita, có m thêm theo âm), chưa phân xử được bằng bản đối chiếu nào trong kho. (c) yaṁ ở 3.1 dịch là "chuyện" (danh hoá cả mệnh đề vanejo vanejassa vañceyya kapino kapi), không phải mệnh đề điều kiện; một cách đọc khác là "nếu…thì…" — nghĩa thông suốt không đổi. (d) kapitthana để nguyên chữ theo ja547 vì chưa có tên Việt phổ thông được xác nhận trong kho (kapittha Limonia acidissima). (e) 'dumapakkāni' dịch "quả chín của cây" không thêm "trên".

  KẾT QUẢ ĐO: 17/17 khoá, đủ và không thừa so với Pāli; thứ tự khoá theo Pāli; dấu nháy kép khớp Pāli từng khoá (mở “ ở 1.1, 2.1, 3.1; đóng ” ở 1.4, 2.4, 3.4); không dấu lược; không Pāli lọt vào bản Việt ngoài kapitthana (theo ja547, 4/4). Pāli trùng nguyên văn trong chính bài: 0 cặp; ở bài khác: 1.2 trùng 4 chỗ ja547 (cùng một dạng Việt; thật ra nigrodhā ca kapitthanā xuất hiện 4 lần ở ja547) (335.2, 496.2, 516.2, 594.2) cùng một dạng Việt. technical_integrity vẫn 9.6; npm run validate, npm test, npm run check, npm run build chưa được chạy trong lượt này.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 4 khoá chênh lệch lớn nhất (`1.2`, `2.1`, `2.2`, `3.1`) → khác nghĩa 1: sửa 1 (`1.2` "cây đa và cây kapitthana" → "quả đa và quả kapitthana": `pakkā` ở `1.1` là "đã chín" và quản cả ba danh từ số nhiều, cả bài là lời mời ăn quả, nên "cây" lẫn loại với "quả sung" ở dòng trên; cùng dòng kệ ở ja547 giữ "cây" vì đó là danh sách cây trong rừng, không đổi), giữ 3 (`2.1`–`2.2`: chỉ khác trật tự `yo vuḍḍhamapacāyati` / `evaṁ so suhito hoti` giữa hai khoá, nghĩa như nhau; `3.1`: bản cũ "Chuyện kẻ sống ở rừng lừa kẻ sống ở rừng" đọc `yaṁ` là "việc/chuyện", bản mù đọc "có thể lừa" từ `vañceyya`; cả hai khả dĩ, không đổi nghĩa câu "khỉ non có thể tin, khỉ già thì không"), bất định 1 (`1.2` `kapitthana` giữ phiên âm vì tầng giữ nguyên `kapittha`/`kapitthana` ở `thag16.10`, `mil5.4.1`, `ja547`). Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; dòng 1.2 trùng ja547 như đã ghi): sửa 2 khoá — 3.4 sai quan hệ logic: `na hi jiṇṇo jarākapī` là vế đối lập nhấn mạnh với 3.3 ("khỉ non có thể tin, chứ khỉ già… thì không"), bản cũ dịch "vì" thành quan hệ nhân quả không có trong Pāli; 2.4 và 3.4 dời dấu chấm ra sau nháy đóng theo Pāli. Giữ 1.1–3.3. Bất định giữ nguyên (a)–(e) của notes trước, nhất là `māsito` (2.4). Bổ sung: đã quét có hệ thống Pāli trùng toàn kho cho mọi khoá; chỉ 1.2 có song song (ja547 ×4, tha-ap398:5.2, tha-ap407:14.2), khác 'cây'/'quả' có lý do đã ghi.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").

