notes: |-
  17 khoá, tất cả đã dịch. Bài thứ 5 của `Samuddavagga`, ngay cạnh mil7.3.7 và mil7.3.9.

  TẦNG THAM KHẢO — 0/17 có Anh Sujato. Không có bản Việt hiện hành. ⇒ `draft`.

  PĀLI TRÙNG: `0.1`, `0.2` `Opammakathāpañha`, `0.3` `Samuddavagga` → *Phẩm Biển* (mil7.3.1,
  mil7.3.7, mil7.3.9), và `3.4` `Bhāsitampetaṁ, mahārāja, bhagavatā devātidevena saṁyuttanikāyavare
  saccasaṁyutte—`. Ở chỗ này tầng chỉ có *Bậc Thế Tôn, đấng Thiên Nhân, đã nói trong bộ Saṁyutta
  Nikāya:* (mil7.6.5:2.4, 1 tiền lệ) cho `saṁyuttanikāyavare`; `saccasaṁyutte` là tên bộ
  *Tương Ưng Khởi* nên tôi nối tiếp, không tìm thấy tiền lệ riêng cho nó (0).

  VÍ DỤ DÀI NHẤT CỦA LÁT — `2.2` liệt kê dòng ô nhiễm, sự tôn trọng của kẻ tìm lợi ích,
  sự khen chê trong nhà người khác và dòng lỗi lầm. Tôi giữ **đủ số phần tử và đúng thứ tự**
  Pāli: `kilesa-ūmi` → `lābhasakkārayasasilokapūjanavandana` → `parakulesu nindāpasaṁsā...` →
  `dosa-ūmi`, không gộp và không bỏ. `sukha-dukkha` ở cụm `sukhadukkhasammānanavimānanā` tôi dịch
  *tốt xấu*; `sammāna` và `navimāna` là *tôn trọng* và *khinh thường*.

  THUẬT NGỮ MỚI (0 tiền lệ): `nāvaṅgapañha` → *Câu hỏi về phần của thuyền*;
  `saccasaṁyutta` → *Tương Ưng Khởi*; `tiparivaṭṭā` → *ba sự quay lại*; `āsanneyeva gocaraṁ`
  → *chỗ phẳng làm chỗ đứng*; `ahañje/ālū` không có trong bài này.

  `4.1` dùng lại **nguyên văn** cụm bốn sự thật đã có ở `mil7.6.5:3.1`: *Đây là sự khổ / Đây là
  nguyên nhân của sự khổ / Đây là sự chấm dứt của sự khổ / Đây là con đường đưa đến sự chấm dứt
  của sự khổ*. Pāli ở `4.1` dùng dấu nháy kép cho từng vế; tôi giữ nguyên dấu nháy kép như Pāli.

  BẤT ĐỊNH CHƯA PHÂN XỬ: `māvaṭṭavega` ở `2.1` (sóng dồn vào bao quanh) tôi dịch *làn sóng dồn
  tới*; 0 tiền lệ, và cách đọc khác là *áp lực dồn vào*. `ācārasīlaguṇavattappaṭivatta` ở `1.3` là
  một chuỗi tính từ dài (*nghiệp, giới, đức tính, phương diện, hướng về*); tôi rút gọn thành *quy
  tụ nhiều pháp chứng đức, hạnh pháp, giới hạnh và đức tính vào một khối* — cách rút này có thể
  mất chút sắc thái của *vattappaṭivatta* nhưng không thêm ý.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
