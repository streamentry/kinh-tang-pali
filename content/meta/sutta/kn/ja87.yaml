notes: |-
  Tiền lệ đếm được: `maṅgala` → điềm lành (34 tiền lệ); `supina` → giấc mơ (9 tiền lệ); `lakkaṇā` → dấu hiệu (133 tiền lệ); `vīti` → vượt qua; `jāti` → sinh (sinh nữa 14 tiền lệ); `gara` + `yoga` → gắn vào (gắn vào 6 tiền lệ).
  Cowell 87 dịch bộ vế KHÁC (Whoso renounces omens, dreams and signs…) nhưng cùng ý và cùng cách hiểu `yugayoga` là sự gắn vào cặp đôi (Cowell: the paired Depravities), tức sinh lại — tôi dịch đúng bộ vế ở Pāli root.
  BẤT ĐỊNH thật sự: 1.1–1.2 `Yassa maṅgalā samūhatāse, Uppātā supinā ca lakkhaṇā ca`. `samūhatāse` là bị động của sam-ūha (xoá sạch) và `uppātā` là quá khứ của utpā (hiện ra), nên hai vế đứng cạnh nhau với hai nghĩa bất đồng. Tôi dịch Với người mà điềm lành đã bị xoá sạch, / giấc mơ và dấu hiệu thì hiện ra — tức điềm đã mất, chỉ còn giấc mơ và dấu hiệu. Alternative reading là hai danh từ cùng điều kiện hoá; vì lệch cả ý cả vì thế tôi hạ cả ba tiêu chí này.
  `Yugayogādhigato` tôi dịch đã đạt tới sự gắn vào cặp đôi, giữ chữ `gắn` thay vì diễn giải thành sinh lại, vì kế tiếp ngay là na jātumeti (sẽ không sinh nữa) — nếu dịch thẳng thành sinh lại thì vế đó thành lặp vô nghĩa.
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. 0.1 Jātaka giữ nguyên (58 bài đã có) và 0.2 Ekakanipāta → Bộ Một Bài Kinh (57 bài) theo tiền lệ đếm được. 1.1 mở nháy kép, 1.4 đóng nháy kép + dấu chấm, không giữ `ti.` (tiền lệ 51/57 bài; 10 bài mới hơn cũng bỏ). Dòng kết 2.1 dùng dấu phẩy (Kinh X, thứ N) theo làn sóng gần nhất ja108…ja119; kho còn 48 bài không dấu phẩy — ghi ở đây để biên tập chuẩn hoá sau, tôi không sửa bài ngoài lát. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Chú giải Jātaka-aṭṭhakathā bằng Pāli không truy cập được trong môi trường dịch này, nên bối cảnh lấy từ truyện E. B. Cowell, The Jātaka vol. I (bản 1895, tải từ archive.org); đây là lý do triangulation không lên cao. technical_integrity 10.0 căn cứ chốt _hvi.py đã pass và tự chạy lại script kiểm bổ sung (9/9 khoá khớp Pāli, NFC, ngoặc kép cân trên cả bài, không lệch dấu lược); npm run validate|test|build không chạy theo lệnh cấm của lát.
