notes: |-
  **ĐỌC TOÀN BỘ Pāli TRƯỚC KHI VIẾT.** 36 khoá, in lại cặp Pāli↔Việt sau khi ghi.

    **TẦNG THAM KHẢO — 0/1 khoá có Anh Sujato** ⇒ `draft`, `triangulation` 7.5.

    **DÙNG LẠI NGUYÊN VĂN 20/23 KHOÁ PĦI TRÙNG** — cao nhất lát. `Kilesā jhāpitā mayhaṁ` (52),
    `viharāmi anāsavo` (52), `Svāgataṁ vata me āsi` (52), `kataṁ buddhassa sāsanaṁ.` (56),
    `Paṭisambhidā catasso,` (287), `…pe…` (406), `kataṁ buddhassa sāsanaṁ”.` (257), `Ekattiṁse ito
    kappe,` → Từ ba mươi mốt kiếp trước, (13), `yaṁ buddhamabhipūjayiṁ;` → khi ta cúng dường lên
    Đức Phật; (3), `buddhapūjāyidaṁ phalaṁ.` → đây là quả báo của việc cúng dường Đức Phật. (22),
    `Himavantassāvidūre` → “Không xa dãy Himavanta, (3), `romaso nāma pabbato;` (2),
    `Buddhopi sambhavo nāma,` (1), `abbhokāse vasī tadā.` (1), `Bhavanā nikkhamitvāna,` (1),
    `padumaṁ dhārayiṁ ahaṁ;` (1), `Duggatiṁ nābhijānāmi,` (83).

    **3 KHOÁ LỆCH ĐA SỐ.**
    (a) `Ekāhaṁ dhārayitvāna,` (:2.3) — tiền lệ duy nhất là *Che trên đầu Ngài suốt một ngày một
        đêm* (1). Cách đó **thêm** *trên đầu Ngài* — cụm *đỉnh đầu* không có ở khoá này, và `:2.4`
        đã là `bhavanaṁ punarāgamiṁ` (lại trở về nơi cư ngụ), nên nối thêm chi tiết ấy là vô lý.
        Tôi dịch **giữ suốt một ngày một đêm,** theo đúng `dhārayitvāna` = đã giữ trong một đêm.
    (b) `Tassuddānaṁ` (:10.1) — *Tóm tắt phẩm này:* theo đa số trong tha-ap (11/15), lệch *Tóm
        lược:* (295 toàn tầng). **Cần coordinator gộp.**
    (c) `:0.2` xem mục tên phẩm bên dưới.

    **TÊN PHẨM — ĐÂY LÀ CHỖ CẦN NGƯỜI BIÊN TẬP QUYẾT.** `Phaladāyakavagga` đang có **3** cách
    trong tầng, hoành ba đầu bằng nhau: *Phẩm Phaladāyaka* (tha-ap513, 519, 520 — 3),
    *Phẩm Cúng Dường Trái Cây* (tha-ap514, 515, 517 — 3), *Phẩm Quả Dâng Cúng* (tha-ap516 — 1).
    Tôi chọn **Phẩm Phaladāyaka** vì nó đồng nhất với phong cách giữ tên Pāli của 7 phẩm còn
    lại trong lát (Kuṇḍadhāna, Upāli, Sakacintaniya, Nāgasamāla, Timira đều nhất trí tuyệt đối),
    và vì `Phaladāyaka` còn là TÊN một vị trưởng lão khác trong tầng (8 nơi) nên dịch nghĩa ở
    đây còn dễ sinh nhầm. Nhưng đây là cách **thứ N+1** nếu phần lớn agent còn lại chọn *Cúng Dường
    Trái Cây*. Tôi KHÔNG sửa 3 tệp kia vì ngoài lát mình — **coordinator cần hợp nhất cả phẩm**.

    **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
    · `Asīti cettha gāthāyo, tisso gāthā taduttari.` (:12.3–12.4) — `asīti` = tám mươi, `tisso` =
        ba, `taduttari` = hơn thế nữa. Tôi dịch *bài kệ ở đây dài tám mươi câu, / thêm ba bài kệ
        nữa.* Có thể ý là “tám mươi, hoặc ba bài kệ hơn thế nữa” (một con số không tròn); tôi
        giữ cách đọc đơn giản nhất và ghi bất định ở đây.
    · `padumaṁ dhārayiṁ ahaṁ` / `Ekāhaṁ dhārayitvāna` — `dhārayi` ở đây là *giữ*, không phải
        *mang theo*; tiền lệ *ta mang theo một đóa hoa sen;* cũng đọc là *mang*. Hai vế cùng gốc
        nên tôi dịch nhất quán: *mang theo* rồi *giữ suốt một ngày một đêm*.
    · uddāna `:11.x` giữ nguyên tên Pāli. Đây là mẫu của `tha-ap182:9.1–9.6` và `tha-ap192:11.x`.
        `Nāgapupphajjuna` có thể là một tên riêng hoặc `nāgapuppha` + hậu tố; tôi giữ trọn từ
        theo Pāli, không cắt.

    **DẤU LƯỢC.** `:4.2`, `:5.2`, `:6.2` là `…pe…` → **đúng một** `…` mỗi khoá.

    **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:6.3`. Tự đếm lại: cân.

