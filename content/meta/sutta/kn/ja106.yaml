notes: |-
  Không có bản Anh ở commit ghim (0/9 khoá): dịch từ Pāli một mình. Tiền lệ: muối 17.
  Bất định đã ghi: (1) Udañcanī chưa rõ là tên người vợ hay đồ vật — trong kệ đọc là người đang nấu (pacamānā giống cái), tiêu đề/kết giữ toàn dạng Pāli Udañcanījātaka; (2) corī jāyappavādena đọc là kẻ trộm mang danh vợ (kẻ trộm giống cái, đội lốt danh nghĩa làm vợ). Cả hai đều không có chỗ kiểm chéo.

  Quyết định hội đồng biên tập 2026-10-16: A13 — :1.4 (bỏ dấu chấm thừa sau ngoặc kép); C1 — :0.4, :2.1, translationTitle (bỏ đuôi jātaka, giữ phiên âm tên riêng); C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
