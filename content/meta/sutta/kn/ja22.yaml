notes: |-
  Phẩm Nai Bốn Sừng đồng nhất với ja21/ja23/ja24/ja25 cùng vagga Kuruṅgavagga.
    Thuật ngữ có tiền lệ: bầy chó 4; chó săn 1 (title theo Sujato Hounds); thuần chủng 46
    (koleyyaka); đẹp đẽ và dũng mãnh cho vaṇṇabalūpapanna.
    1.3 teme đối lập te/mayaṁ → những con kia/còn chúng ta. 1.4 Nāyaṁ saghaccā
    dubbalaghātikāyaṁ phân tích theo Sujato (không phải giết kẻ đáng giết, mà là giết hại
    kẻ yếu); chữ sa-ghacca tối nghĩa nên ambiguity 9.0, đã công khai, ảnh hưởng thấp.
  Đối chiếu Pāli đã ghim với Anh Sujato ở 8/9 khoá; khoá kết 2.1 Sujato để trống
    (công thức tên kinh + số thứ tự), dịch từ Pāli theo tiền lệ ja1 đã published
    (Kinh Bụi Dơ thứ nhất). Không có tầng Việt hiện hành cho Jātaka trong snapshot
    đã ghim (tiếng Việt upstream chỉ có Pháp Cú) — giới hạn của bản chụp, không phải
    thiếu sót của repo. Không có dấu lược …pe… trong Pāli lát này nên hai phía đều 0.
