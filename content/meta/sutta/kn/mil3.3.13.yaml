notes: |-
  **Blocker thật: không có tầng Anh.** Không có `mil3.3.13` trong bất kỳ tệp Anh nào đã ghim. Tôi dịch từ Pāli một mình và đặt `draft`; không tự nâng điểm để né. Vì vậy `triangulation` chỉ 7.0, và tôi đã tự hạ `source_provenance` xuống 8.0.

  **CANON bắt buộc — `mil3.3.13:3.1` dùng nguyên văn của 20 bài đã có.** `“Kallosi, bhante nāgasenā”ti.` trùng nguyên văn ở 20 bài Milindapañha đã dịch (`mil3.3.4`, `mil3.3.9`, `mil3.3.14`, `mil3.4.3`, `mil3.4.8`, `mil3.4.9`, `mil3.5.3`, `mil3.5.4`, `mil3.5.6`, `mil3.5.9`, `mil3.6.6`–`mil3.6.9`, `mil3.6.11`, `mil3.7.8`, `mil3.7.10`, `mil3.7.12`, `mil3.7.13`, `mil3.7.14`) và **20/20 viết giống hệt**: `“Khéo lắm, thưa tôn giả Nāgasenā.”` Tôi chép nguyên văn đó, kể cả việc bỏ `ti`.

  **`:2.1` — tôi chọn giữa ba cách đang trôi, và ghi ra đây.** `“Opammaṁ karohī”ti.` xuất hiện nguyên văn ở 5 bài: `mil3.3.9` và `mil3.6.9` viết *Hãy nêu một ví dụ*, `mil3.4.3` và `mil3.5.9` viết *Hãy xét một thí dụ*, `mil3.3.14` viết *Hãy đưa một ví dụ* — 2:2:1, tức **kho đang trôi**. Tôi theo *Hãy xét một thí dụ* vì hai tiền lệ đó cũng chỉ giữ một dạng, và vì `opamma` là **thí dụ** (ví dụ so sánh) chứ không phải *ví dụ* chung. Đây là ý kiến, không phải số đo; biên tập nên chốt một dạng cho cả bốn bài.

  **`:1.2` và `:2.3` nói nguyên văn giống nhau** (`Appanālakkhaṇo / appanālakkhaṇo vitakko`) và cả hai đều dịch giống nhau: *tầm có đặc trưng là không mang đặc trưng riêng nào*. Bản nháp đầu viết *không mang dấu hiệu gì*, tức `lakkhaṇa` ở `:1.1` (*đặc trưng*) và ở `:1.2` (*dấu hiệu*) lệch nhau trong cùng một bài — tôi đã sửa cho nhất quán.

  **Bất định đã ghi.** `ap panālakkhaṇa` (đặc trưng là *không có đặc trưng*) nghe nghịch lý nhưng đúng nghĩa; `vicāra` bên cạnh thì có `anumajjanalakkhaṇa` (`mil3.3.14:1.2`), và bản dịch sẵn có của bài đó ghi *mang dấu hiệu của sự chú ý lại* — tức tầm và tầm tức khác nhau ở đúng điểm này, nên câu của tôi đọc được nhưng **không** thêm kiến giải vào thân kinh. `Vicāravagga` → *Phẩm Khảo Sát* (2 tiền lệ `mil3.3.4`, `mil3.3.9`; `mil3.3.14:0.2` lại viết *Phẩm Suy Xét* — **trôi 2:1**, tôi theo đa số và không sửa file của lát khác). `sandhismi` ở `:2.2` là cách ngữ công cụ, tôi dịch *nhờ sức*; bản nháp đầu viết *nhờ sức lớn* — đã bỏ chữ *lớn* vì Pāli không có.**Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm — ở lát này chỉ 3/155 khoá Pāli đủ 40 ký tự, nên chốt tự kiểm 30% và assertion còn lại không tự chạy; phần tôi tự kiểm: 10/n khoá có mặt và không thừa khoá, đúng segment ID, mọi chuỗi NFC, không khoá rỗng, không khoá nội dung nào trùng nguyên văn Pāli, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài và không bao giờ âm, không còn `(…)`, không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (lát này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Milindapañha không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.
