notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `tha-ap`/`thi-ap`.
  Tiền lệ đếm được trong tầng (3.359 bài trước đó, dựng index Pāli ↔ Việt):
  151/320 khoá của lát có Pāli trùng nguyên văn; 45 nhóm trùng ngay trong lát,
  đã dùng lại đúng một cách dịch cho từng nhóm (kiểm lại sau khi sửa: 43 nhóm, 0 mâu thuẫn).
  0.1 `Therāpadāna` giữ nguyên Pāli: 291/300 tệp tha-ap đã dịch dùng vậy, 9 tệp còn lại
  dùng Trưởng Lão Ký Sự ⇒ theo đa số trong chính phẩm, không tự tạo cách thứ N+1.
  0.2 `Umāpupphiyavagga` → Phẩm Umāpupphiya (4/5; tha-ap325 dùng Phẩm Bậc Rải Hoa Umā).
  0.3 và 11.1 → Bài Kệ Tuyên Ngợ Về Trưởng Lão X, thứ N. Đo trong tha-ap/thi-ap:
  0.3 có 162/305 dùng nhóm Tuyên Ngợ, 81 dùng Ký Sự, 62 dùng Tuyên Ngôn; 11.1 có 140/305
  đúng dạng hoa chữ này (+22 biến thể chữ thường). Số thứ tự ở 0.3: giữ 51/100 (37 có dấu
  chấm, 14 không) và bỏ 49 — chọn giữ vì bỏ là mất số lượng có trong nguồn.
  `…pe…` ở 9.2 giữ đúng một dấu lược; nháy kép mở ở 1.1, đóng ở 9.3.
  Công thức dùng lại nguyên văn: `Duggatiṁ nābhijānāmi` → Tôi không còn biết đến đọa
  xứ nào (281 cặp); `Paṭisambhidā catasso` → Bốn vô ngại giải (305); `…kataṁ buddhassa
  sāsanaṁ”` → đã làm tròn lời dạy của Đức Phật (304); `Sattaratanasampannā` → đầy đủ
  bảy món báu quý giá (14); `cakkavattī mahabbalā` → là Chuyển Luân Vương có đại uy lực;
  `Catunnavutito kappe` → Vào chín mươi tư kiếp trước đây; `Tena cittappasādena` → Nhờ tâm
  tịnh tín ấy; `bhuddassa abhiropayiṁ` → rồi dâng lên Đức Phật; `vehāsaṁ nabhamuggami`
  → rồi bay vút lên bầu trời; `āhutīnaṁ paṭiggaho` → bậc tiếp nhận các lễ vật hiến
  cúng; `imaṁ gāthaṁ abhāsatha` → bậc Đạo Sư đã nói lên bài kệ này.
  Ghi nhận bất định: 8.2 `jalasikhā` không có tiền lệ nào trong tầng; dịch theo nghĩa
  chữ (tia nước phun) là ngọn nước, không ghi chú thêm trong thân kinh. 6.1 `naradeva`
  không có tiền lệ đọc được; chủ thể trong chuyện này là vị trời đi theo Đức Phật, nên
  dịch là đấng trời — nếu đọc theo nghĩa bậc Trời tể tưởng thì câu cũng đứng vững vì
  6.3-6.4 đã nói rõ vị ấy đi theo Đức Phật. 3.1 `lokavidū` dịch bậc hiểu rõ thế gian;
  `tādino` dịch bậc đã thuần phục, giữ đúng nghĩa từ `dāna` tịnh phục, khác với
  tha-ap50/524 dùng Vững Vàng kiên định.
