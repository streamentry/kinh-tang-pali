notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud8.10:3.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud8.10:3.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Lượt rà soát 2026-10-15 (lô G1, Claude Sonnet 5.5 (Claude Code)): `4.1`–`4.2` `ayoghanahatasseva
  jalato jātavedaso` — Pāli không có chữ "ánh sáng"; `ayoghana` là búa sắt, `hata` là bị đập, và
  `jalato jātavedaso` là lửa đang cháy; nay "Như bị búa sắt đập, ngọn lửa Jātaveda đang cháy" (giống
  thi-ap17:191.1 đã sửa). Bản Anh Sujato ("glow of iron struck by a hammer") thêm "glow" không có
  trong Pāli. `thag5.8` không chứa câu này: Pāli đã ghim chỉ có `ayoghanahatasseva` ở ud8.10 và
  thi-ap17:191.1.
