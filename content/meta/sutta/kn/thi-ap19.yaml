notes: |-
  Bài kinh thi-ap19 — Uppalavaṇṇātherīapadāna, bài thứ chín của Phẩm Ekūposathika trong
  Therīapadāna. 338/338 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào ngoài tập
  khoá Pāli. Bài kể lời tự thuật của Uppalavaṇṇā: vị ni thưa với Đức Thế Tôn rằng mình đã vượt
  luân hồi và xin tha thứ mọi lỗi; theo lời Ngài, vị ni thị hiện thần thông (đặt bốn đại dương
  vào lòng bàn tay, nhổ trái đất như nhổ cỏ muñja, giã núi Sineru như giã lúa), rồi kể về
  những việc đã làm vì Ngài: nữ nāga Vimalā thời Đức Phật Padumuttara cúng dường và ước nguyện
  thần thông, con gái triệu phú thời Đức Phật Vipassī, công chúa Samaṇaguttā thời Đức Phật
  Kassapa cùng sáu chị em, rồi các đời làm vải dâng, giữ lúa, hoàng hậu xứ Kāsi, mẹ năm trăm
  vị Độc Giác, và đời cuối ở Sāvatthī: xuất gia, chứng bốn chân lý khi chưa đủ nửa tháng,
  đối đáp với Māra, được đặt vào vị trí đệ nhất trong các vị ni có thần thông.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt, ghi cả hai phạm vi:
  - :0.1 Therīapadāna giữ nguyên Pāli: 35 trên 36 tệp thi-ap đã có cùng dạng (tệp còn lại là
    thi-ap6, viết Trưởng Lão Ni Ký Sự).
  - :0.2 Ekūposathikavagga → Phẩm Ekūposathika: 7 trên 7 khoá cùng Pāli (thi-ap11 đến 16 và
    thi-ap20) đã dùng dạng này.
  - translationTitle bằng đúng giá trị :0.3 từng ký tự. Pāli :0.3 là Uppalavaṇṇātherīapadāna,
    không bắt đầu bằng số, nên :0.3 không có số. Trong 36 tệp thi-ap đã có, 18 tệp có số ở Pāli
    (12 giữ, 6 bỏ) và 0 tệp thêm số ở chỗ Pāli không có; bài này thuộc nhóm không số, không thuộc
    nhóm thừa.
  - Từ chỉ thể loại apadāna ở :0.3 và :86.1 — phạm vi gần nhất, Phẩm Ekūposathika (7 tệp đã có):
    Tuyên Ngợ 7, Tuyên Ngôn 0; toàn thi-ap 36 tệp: Tuyên Ngợ 33, Tuyên Ngôn 2 (thi-ap29, thi-ap30),
    1 tệp khác dạng (thi-ap6); toàn tha-ap 558 tệp: Tuyên Ngợ 255, Tuyên Ngôn 141, Ký Sự 155, 7 khác.
    Hai phạm vi gần nhất cho Tuyên Ngợ là đa số nên bài này giữ Tuyên Ngợ cho khớp thi-ap20 và
    các tệp cùng phẩm; đó nhiều khả năng là lỗi chính tả của Tuyên Ngôn, nên cần người biên tập
    phán một lượt rồi sửa hàng loạt cả cuốn chứ không sửa riêng bài này.
  - Từ chỉ người: Trưởng Lão Ni ở tiêu đề (32 trên 36 tệp thi-ap; Tỳ-kheo-ni 3, khác 1); câu kết :85.1
    bhikkhunī → Tỳ-kheo-ni (31 trên 34 khoá cùng công thức), đúng Pāli.
  - :86.1 Uppalavaṇṇātheriyāpadānaṁ navamaṁ → Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni Uppalavaṇṇā,
    thứ chín, theo mẫu thi-ap39 (navamaṁ → thứ chín).

  SỐ PĀLI — tự tính, in phép:
  - Ekanavutito kappe (43.1) = eka 1 + navuti 90 = 91 → chín mươi mốt kiếp (123 khoá cùng Pāli;
    dạng đa số 45 là Vào chín mươi mốt kiếp trước, dùng lại).
  - Satasahassito kappe (25.1) = sata 100 × sahassa 1.000 = 100.000 → một trăm ngàn kiếp. Ở đây là
    thì quá khứ (nāgakaññā ahaṁ tadā), không phải lời thọ ký nên không dùng Sau … kiếp nữa; bài
    không có lời thọ ký tương lai nào về kiếp. Trong 79 khoá cùng Pāli: Vào một trăm ngàn đại kiếp
    trước 34, Vào một trăm ngàn kiếp trước đây 12, Vào một trăm ngàn kiếp trước 10, Sau một trăm
    ngàn kiếp nữa 17 (tương lai). Chọn Vào một trăm ngàn kiếp trước vì chữ đại không có trong Pāli
    và để khớp 43.1 (kiếp, không đại); ở phạm vi gần nhất thi-ap14 và thi-ap15 (cùng phẩm) dùng đại
    kiếp, thi-ap32 dùng kiếp trước. Người biên tập có thể phán một lượt cho cả cuốn.
  - Vīsavassasahassāni (49.3) = vīsa 20 × sahassa 1.000 = 20.000 → hai mươi ngàn năm (4 khoá cùng
    Pāli đều dịch hai mươi ngàn năm).
  - Dasakoṭisahassāni (23.1) = dasa 10 × sahassa 1.000 = 10.000 koṭi, giữ nguyên koṭi (252 khoá
    Pāli chứa koṭi ở 113 tệp; 140 khoá Việt giữ koṭi). Xem bất định số 3 về vai ngữ pháp.
  - Sataṁ sahassāni (73.1) = trăm ngàn (cùng Pāli thig11.1:8.1 đã dịch Dẫu trăm ngàn tên du đãng).
  - Pañcalājāsatāni (57.2) = pañca 5 × sata 100 = 500; pañca puttasatāni (57.4) = 500;
    anūnaṁ satapañcakaṁ (59.4) = không thiếu năm trăm = đủ năm trăm; aṭṭha paccekanāyake (62.4) =
    tám vị; sattadhītaro (50.4) = bảy người con gái. Đếm danh sách bảy: 51.1 đến 51.4 là Samaṇī,
    Samaṇaguttā, Bhikkhunī, Bhikkhudāyikā, Dhammā, Sudhammā, Saṅghadāyikā = 7 (sattamī = thứ bảy,
    khớp); 52.1 đến 52.4 là ta, Khemā, Paṭācārā, Kuṇḍalā, Kisāgotamī, Dhammadinnā, Visākhā = 7
    (sappaññā là tính từ của Khemā; Visākhā là sattamī, khớp).
  - Catasso parisā (5.3), caturo mahāsamudde (11.1), catūhi parisāhi (29.1), catusacca (70.4),
    paṭisambhidā catasso (84.1) = bốn; dutiyā dhītā (48.1) = thứ hai; aḍḍhamāse asampatte (70.3) =
    chưa đủ nửa tháng; tāvatiṁsa (41.4, 53.4) = Ba mươi ba (tên cõi trời); navamaṁ (86.1) = thứ chín.
  - Không có cụm Tiṁsakappasahassa (tiṁsa 30) trong bài: tiṁsa chỉ xuất hiện trong tên cõi trời
    Tāvatiṁsa (33). Phép kiểm cụm số chưa phân xử được vì vậy chạy rỗng với bài này, không phải pass.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò (chỉ mục dựng trên 2.254 tệp kn đã dịch ở cây chính, gồm thi-ap,
  tha-ap, thig, thag và các bộ khác, không tính bài này; so không phân biệt dấu câu và chữ hoa đầu dòng):
  - 120 khoá có Pāli trùng byte với ít nhất một khoá đã dịch; 111/120 dùng lại đúng một dạng đã có,
    trong đó 103 là dạng đa số và 8 không phải dạng đa số (17.1, 17.4, 18.1, 19.3: tiền lệ đa số
    là ta, bài này dùng con vì lời nói hướng tới Đức Thế Tôn; 70.2, 79.1, 80.3: dạng ta đứng sau
    dạng tôi hoặc ngang nhau; 25.1: đại kiếp, lý do ở mục số Pāli). 9/120 khoá khác mọi tiền lệ, đều
    có lý do: 7.1, 7.4, 16.4 (khác ngôi: tiền lệ ta, tôi hoặc không chủ ngữ; bài này dùng con);
    7.3 (tiền lệ thêm Thưa); 26.2 (tiền lệ có chủ ngữ tôi và chữ Đấng); 43.3 (tiền lệ đảo thành có
    diện mạo đáng mến, đã xuất hiện, 3 khoá; bài này giữ thứ tự Pāli Uppajji cārudassano); 71.1,
    71.2 (tiền lệ khác cấu trúc: nhờ thần thông, bà dựng ra); 71.4 (tiền lệ đứng sau động từ dâng
    nên có chữ cho).
  - Các khoá 72 đến 77 (đối đáp với Māra) trùng thig11.1:7 đến 12: 12 khoá trùng byte (72.2, 72.3,
    73.2, 73.4, 74.1, 74.2, 74.4, 75.2, 76.1, 76.2, 77.1, 77.3) đều dùng lại nguyên văn bản dịch
    thig11.1; thêm 72.4, 73.1, 77.2, 77.4 chỉ khác thig11.1 ở dấu nháy hoặc chữ hoa nên cũng dùng
    lại cùng bản dịch (77.4 antaka so với antakā: kẻ Tận Diệt). Khác thig11.1 vì Pāli khác: 72.1
    (thig11.1 viết cây sāla nở đầy hoa, nhưng ở đây sāla đã nằm ở 72.2 nên chỉ viết nở đầy hoa đến
    tận ngọn), 73.3 (na … na khác na … napi), 74.3 (Bhamukantarikāyampi khác Bhamukantare tiṭṭhāmi),
    75.1, 75.3, 75.4, 76.3, 76.4.
  - Trong chính bài có 12 nhóm Pāli trùng nguyên văn (11 nhóm ngoài nhóm …pe…): 7.4·16.4;
    9.3·66.3; 11.2·12.2; 21.3·22.3·65.3; 35.4·36.4·37.4; 39.4·44.4; 41.2·53.2; 41.3·53.3;
    41.4·53.4; 44.2·47.4; 79.2·83.3·84.3; và ba khoá …pe… (82.2, 83.2, 84.2). Cả 12 nhóm có bản
    Việt giống nhau; 0 cặp lệch. Các nhóm 35.4·36.4·37.4 và 79.2·83.3·84.3 chỉ khác dấu câu
    cuối khoá theo Pāli (dấu hỏi và nháy ở 35.4; nháy ở 36.4 và 84.3). Ba khoá …pe… đều là … đúng
    một dấu lược; Pāli không có … ở khoá nào khác thì Việt không có.

  NGÔI KỂ — lời hướng tới Đức Thế Tôn (2.1 đến 23.4, 35.1 đến 38.4, 40.3) dùng con; lời kể cho hội
  chúng và lời Ta của Đức Phật dùng ta (25.2 trở đi, 36.2, 36.3), theo thi-ap21 đến 27 (ta cho
  phần kể, con cho phần nói với Đức Phật). Phần đối đáp với Māra: Māra gọi ngươi, vị ni xưng ta,
  theo thig11.1. Đoạn miêu tả thần thông (11.2, 12.2, 14.4) và 34.4 là ngôi thứ ba theo động từ
  Pāli (pakkhipi, maddi, abravi): bà (vị ni), nàng (nữ nāga).

  THUẬT NGỮ — kèm số đếm (toàn tầng kn, 2.254 tệp):
  - sayambhū → bậc Tự Tại (22 khoá bậc Tự Tại, 13 khoá Đấng Tự Tại, 3 khoá bậc Tự Hữu).
  - Paccekabuddha → Phật Độc Giác (18 khoá Phật Độc Giác, 4 khoá Độc Giác Phật; thi-ap27 viết Đức
    Phật Độc Giác); paccekanāyaka → Dẫn Đạo Độc Giác (62.4, 60.4), theo tiền lệ aṭṭha paccekanāyake.
  - lokanātha → Bảo Hộ Thế Gian (71.4: 25 khoá Bảo Hộ Thế Gian, 15 khoá Lãnh Đạo thế gian);
    lokanāyaka (16.2, 29.2, 39.4, 40.4, 44.4) → bậc Dẫn Đạo thế gian theo tiền lệ.
  - vināyaka → Điều Ngự (45.2, 78.4; 42 khoá Điều Ngự, 3 khoá Hướng Đạo); mahesī → hoàng hậu (59.1;
    4 khoá hoàng hậu, 3 khoá chánh hậu); tidasa → Tam Thập (64.3; 15 khoá Tam Thập);
    tāvatiṁsa → Ba mươi ba (36 ta, 15 tôi, 5 con theo tiền lệ 41.4).
  - dhuttaka → du đãng (thig11.1, 1 tiền lệ); Māra → Ác Ma (73.4, theo thig11.1; tầng: Ma vương 5,
    Māra 5, Ác Ma 1); antaka → kẻ Tận Diệt (theo thig11.1).
  - nāga giữ nguyên Pāli (thi-ap32 dùng nāga); mahorago → đại xà (1 tiền lệ ở tầng: mil, của vị đại
    xà có đại oai lực); mahātejaṁ → đại oai lực (26.3; 1 tiền lệ có tám vị vua mang đại oai lực);
    koṭi giữ nguyên; muñja, sāli, Sineru giữ nguyên Pāli.
  - kappa → kiếp (xem mục số Pāli); bhaddake kappe → hiền kiếp (10 khoá Trong hiền kiếp này).
  - paṭisambhidā → vô ngại giải (585 khoá Bốn vô ngại giải). cakkavāḷa → vòng thế giới (tiền lệ
    Thân ngang bằng vòng thế giới). lājā → gạo rang (không có tiền lệ).

  BẤT ĐỊNH — ghi ở đây, không đưa vào thân kinh:
  1. 20.2 saṅgamaṁ te nidassitaṁ: te hiểu là cho Ngài (tặng cách); thi-ap30:20.2 và
     thi-ap32:18.2 (saṅgamaṁ no nidassitaṁ) dịch sự gặp gỡ của chúng tôi đã được chỉ ra. Cách đọc
     khác: của Ngài (te là sở hữu cách).
  2. 31.4 nāgakaññā mahiddhikā ở cách danh nhưng theo mạch là người nhận lời tùy hỷ nên dịch cho
     thiếu nữ nāga có đại thần lực. 32.3 và 32.4 (pasannaṁ satthuno cittaṁ, sunibandhañca mānasaṁ)
     hiểu là tâm của chính nữ nāga: tịnh tín nơi bậc Đạo Sư, và ý gắn bó chắc chắn; cách đọc khác:
     tâm của bậc Đạo Sư đã hoan hỷ.
  3. 23.1 đến 23.3: dasakoṭisahassāni có thể là tân ngữ hoặc trạng ngữ số lần (mười ngàn koṭi lần);
     giữ dạng mơ hồ như Pāli. 23.3 pariccattā ca me homi: hiểu là chính vị ni đã tự hiến thân
     (pariccattā giống cái số ít); không có tiền lệ cùng Pāli.
  4. 35.2 sumanaṁ itarāyapi: hình thái khó (sumanaṁ trung tính, itarāya giống cái công cụ cách);
     dịch đẹp ý, cả do vị kia nữa. Mạch của cả khổ thơ (nữ nāga thưa về thần thông của vị tỳ-kheo-ni)
     không bị ảnh hưởng.
  5. 62.1 buddhā sutamatī: hình thái không chắc; theo mạch 62.2 (sutānaṁ bhattunopi ca) hiểu là đã
     trưởng thành và có con trai. Phần còn lại của khổ (62.3 đến 63.4) không phụ thuộc cách đọc này.
  6. 19.4 sabhāvena mahesino: không có tiền lệ; dịch nhờ thực tính của bậc Đại Ẩn Sĩ; có thể
     là theo bản chất hoặc theo sự thật do bậc Đại Ẩn Sĩ.
  7. 11.3 đến 11.4 telaṁ hatthagatañceva khiḍḍo komārako yathā: komāraka hiểu là cậu bé (12.4
     komārako yuvā, 14.4 komārikā thiếu nữ); vế như dầu đã ở trong tay giữ nguyên nghĩa đen.
  8. 27.3 ratanaṁ vālukākiṇṇaṁ: dịch cát châu báu được rải khắp; cách đọc khác: chỗ làm bằng châu
     báu, rải đầy cát.
  9. 24.2 sirasāva katañjalī: dịch cúi đầu, chắp tay; cách đọc khác: chắp tay đặt lên đầu.
     24.3 Avocayye: avocuṁ (họ thưa) và ayye (hô cách, thưa ni sư) đều nằm trong dấu nháy của Pāli
     nên bản Việt đặt Họ thưa trong nháy để khớp từng khoá.
  10. 78.3 aggā iddhimatīnanti: Pāli có ti (dấu trích dẫn) nhưng không mở nháy; bản Việt bỏ ti, không
     thêm nháy, giữ khớp nháy từng khoá. Chưa đo toàn tầng vì không có tiền lệ cùng Pāli; tiền lệ
     gần thi-ap34:12.3 (Siṅgālakassa mātāti → được gọi là mẹ của Siṅgālaka) cũng bỏ ti.
  11. 73.3 iñje: dịch chẳng động (như thig11.1:8.3 dịch chẳng dựng lên một sợi, cũng chẳng run rẩy).
  12. 57.2 đến 58.1: khổ thơ có tỉnh lược (pañcalājāsatānihaṁ, pañca puttasatānihaṁ, rồi Patthayiṁ
     ở 58.1); giữ nguyên tỉnh lược, không thêm động từ vào thân kinh. Pañcalājāsatāni dịch năm
     trăm hạt gạo rang.
  13. 28.1 đến 28.4, 13.1 đến 13.4, 71.1 đến 71.2: chuỗi động từ liên hoàn với chủ ngữ ngầm
     theo Pāli; bản Việt giữ cấu trúc, có chỗ đọc hơi dồn; không thêm nghĩa.
  14. 54.3 pītaṁ: hiểu là màu vàng (tính từ của tấm vải); cách đọc khác: đã uống (không hợp mạch).
  15. 56.1 janapade: dịch ở vùng quê (không chọn tên riêng).

  NGUỒN VÀ TAM GIÁC — không có tầng Anh (Sujato) đã ghim, không có english-project, không có
  vietnamese-current cho thi-ap; bài chỉ đối chiếu Pāli root và các tiền lệ đã dịch trong kho
  (thi-ap, tha-ap, thig11.1). Tầng tra cứu toàn văn của kho (bản Việt nguyên bài, không căn
  lề từng khoá, không phải tầng store) chỉ được đọc để hiểu mạch ở vài chỗ khó và không được
  chép; câu Việt ở đây viết từ Pāli. Vì vậy triangulation = 7.5 và bài không được coi là đã đối
  chiếu English.

  KIỂM TRA ĐÃ CHẠY — phép tự viết, quét mọi khoá: tập khoá Việt = tập khoá Pāli (338 = 338,
  cùng thứ tự); dấu nháy đơn và nháy kép khớp Pāli từng khoá (23 khoá có nháy ở Pāli, 0 lệch; 0
  nháy thẳng); …pe… → đúng một … (3/3, 0 lệch; Pāli không có … ở khoá nào khác); không khoá
  rỗng, không (…) trần; NFC; không Pāli lọt sang thân bản dịch ngoài tên riêng và thuật ngữ giữ
  nguyên (nāga, koṭi, muñja, sāli, sāla, Sineru); 12 nhóm Pāli trùng trong chính bài có bản Việt
  giống nhau (0 lệch). Đã in cặp Pāli với Việt từng khoá để đọc.

