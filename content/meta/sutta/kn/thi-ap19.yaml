notes: |-
  Bài kinh thi-ap19 — Uppalavaṇṇātherīapadāna, bài thứ chín của Phẩm Ekūposathika trong
  Therīapadāna. 338/338 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào ngoài tập
  khoá Pāli. Bài kể lời tự thuật của Uppalavaṇṇā: vị ni thưa với Đức Thế Tôn rằng mình đã vượt
  luân hồi và xin tha thứ mọi lỗi; theo lời Ngài, vị ni thị hiện thần thông (đặt bốn đại dương
  vào lòng bàn tay, nhổ trái đất như nhổ cỏ muñja, giã núi Sineru như giã lúa), rồi kể về
  những việc đã làm vì Ngài: nữ nāga Vimalā thời Đức Phật Padumuttara cúng dường và ước nguyện
  thần thông, con gái triệu phú thời Đức Phật Vipassī, công chúa Samaṇaguttā thời Đức Phật
  Kassapa cùng sáu chị em, rồi các đời làm vải dâng, giữ lúa, hoàng hậu xứ Kāsi, mẹ năm trăm
  vị Độc Giác, và đời cuối ở Sāvatthī: xuất gia, chứng bốn chân lý khi chưa đủ nửa tháng,
  đối đáp với Māra, được đặt vào vị trí đệ nhất trong các vị ni có thần thông.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt, ghi cả hai phạm vi:
  - :0.1 Therīapadāna giữ nguyên Pāli: 35 trên 36 tệp thi-ap đã có cùng dạng (tệp còn lại là
    thi-ap6, viết Trưởng Lão Ni Ký Sự).
  - :0.2 Ekūposathikavagga → Phẩm Ekūposathika: 7 trên 7 khoá cùng Pāli (thi-ap11 đến 16 và
    thi-ap20) đã dùng dạng này.
  - translationTitle bằng đúng giá trị :0.3 từng ký tự. Pāli :0.3 là Uppalavaṇṇātherīapadāna,
    không bắt đầu bằng số, nên :0.3 không có số. Trong 36 tệp thi-ap đã có, 18 tệp có số ở Pāli
    (12 giữ, 6 bỏ) và 0 tệp thêm số ở chỗ Pāli không có; bài này thuộc nhóm không số, không thuộc
    nhóm thừa.
  - [ĐÃ LỖI THỜI — bản dịch hiện dùng Ký Sự, xem mục Lượt cải thiện 2026-10-13 ở cuối] Từ chỉ thể loại apadāna ở :0.3 và :86.1 — phạm vi gần nhất, Phẩm Ekūposathika (7 tệp đã có):
    Tuyên Ngợ 7, Tuyên Ngôn 0; toàn thi-ap 36 tệp: Tuyên Ngợ 33, Tuyên Ngôn 2 (thi-ap29, thi-ap30),
    1 tệp khác dạng (thi-ap6); toàn tha-ap 558 tệp: Tuyên Ngợ 255, Tuyên Ngôn 141, Ký Sự 155, 7 khác.
    Hai phạm vi gần nhất cho Tuyên Ngợ là đa số nên bài này giữ Tuyên Ngợ cho khớp thi-ap20 và
    các tệp cùng phẩm; đó nhiều khả năng là lỗi chính tả của Tuyên Ngôn, nên cần người biên tập
    phán một lượt rồi sửa hàng loạt cả cuốn chứ không sửa riêng bài này.
  - Từ chỉ người: Trưởng Lão Ni ở tiêu đề (32 trên 36 tệp thi-ap; Tỳ-kheo-ni 3, khác 1); câu kết :85.1
    bhikkhunī → Tỳ-kheo-ni (31 trên 34 khoá cùng công thức), đúng Pāli.
  - [ĐÃ LỖI THỜI — :86.1 hiện là Ký sự về Trưởng lão Ni Uppalavaṇṇā, thứ chín] :86.1 Uppalavaṇṇātheriyāpadānaṁ navamaṁ → Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni Uppalavaṇṇā,
    thứ chín, theo mẫu thi-ap39 (navamaṁ → thứ chín).

  SỐ PĀLI — tự tính, in phép:
  - Ekanavutito kappe (43.1) = eka 1 + navuti 90 = 91 → chín mươi mốt kiếp (123 khoá cùng Pāli;
    dạng đa số 45 là Vào chín mươi mốt kiếp trước, dùng lại).
  - Satasahassito kappe (25.1) = sata 100 × sahassa 1.000 = 100.000 → một trăm ngàn kiếp. Ở đây là
    thì quá khứ (nāgakaññā ahaṁ tadā), không phải lời thọ ký nên không dùng Sau … kiếp nữa; bài
    không có lời thọ ký tương lai nào về kiếp. Trong 79 khoá cùng Pāli: Vào một trăm ngàn đại kiếp
    trước 34, Vào một trăm ngàn kiếp trước đây 12, Vào một trăm ngàn kiếp trước 10, Sau một trăm
    ngàn kiếp nữa 17 (tương lai). Chọn Vào một trăm ngàn kiếp trước vì chữ đại không có trong Pāli
    và để khớp 43.1 (kiếp, không đại); ở phạm vi gần nhất thi-ap14 và thi-ap15 (cùng phẩm) dùng đại
    kiếp, thi-ap32 dùng kiếp trước. Người biên tập có thể phán một lượt cho cả cuốn.
  - Vīsavassasahassāni (49.3) = vīsa 20 × sahassa 1.000 = 20.000 → hai mươi ngàn năm (4 khoá cùng
    Pāli đều dịch hai mươi ngàn năm).
  - Dasakoṭisahassāni (23.1) = dasa 10 × sahassa 1.000 = 10.000 koṭi, giữ nguyên koṭi (252 khoá
    Pāli chứa koṭi ở 113 tệp; 140 khoá Việt giữ koṭi). Xem bất định số 3 về vai ngữ pháp.
  - Sataṁ sahassāni (73.1) = trăm ngàn (cùng Pāli thig11.1:8.1 đã dịch Dẫu trăm ngàn tên du đãng).
  - Pañcalājāsatāni (57.2) = pañca 5 × sata 100 = 500; pañca puttasatāni (57.4) = 500;
    anūnaṁ satapañcakaṁ (59.4) = không thiếu năm trăm = đủ năm trăm; aṭṭha paccekanāyake (62.4) =
    tám vị; sattadhītaro (50.4) = bảy người con gái. Đếm danh sách bảy: 51.1 đến 51.4 là Samaṇī,
    Samaṇaguttā, Bhikkhunī, Bhikkhudāyikā, Dhammā, Sudhammā, Saṅghadāyikā = 7 (sattamī = thứ bảy,
    khớp); 52.1 đến 52.4 là ta, Khemā, Paṭācārā, Kuṇḍalā, Kisāgotamī, Dhammadinnā, Visākhā = 7
    (sappaññā là tính từ của Khemā; Visākhā là sattamī, khớp).
  - Catasso parisā (5.3), caturo mahāsamudde (11.1), catūhi parisāhi (29.1), catusacca (70.4),
    paṭisambhidā catasso (84.1) = bốn; dutiyā dhītā (48.1) = thứ hai; aḍḍhamāse asampatte (70.3) =
    chưa đủ nửa tháng; tāvatiṁsa (41.4, 53.4) = Ba mươi ba (tên cõi trời); navamaṁ (86.1) = thứ chín.
  - Không có cụm Tiṁsakappasahassa (tiṁsa 30) trong bài: tiṁsa chỉ xuất hiện trong tên cõi trời
    Tāvatiṁsa (33). Phép kiểm cụm số chưa phân xử được vì vậy chạy rỗng với bài này, không phải pass.

