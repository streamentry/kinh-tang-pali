  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 9 khoá bất đồng nghĩa → sửa 2, giữ 6, bất định 1. SỬA: (1) 34.4: bản cũ “nàng đã nói với bậc Đạo Sư” khiến người đọc nối câu vào “vị tỳ-kheo-ni tự tin ấy” ở 34.2, trong khi lời ở 35.1–35.4 (“Con đã thấy thần thông này … làm sao vị ấy đã trở nên …”, rồi 37.1–38.4 tự ước nguyện được như vậy) là của thiếu nữ nāga; sửa thành “thiếu nữ nāga đã nói với bậc Đạo Sư điều này” (Pāli `pamoditā vedajātā satthāraṃ idamabravi` dùng ngôi ba, chủ thể xác định từ 35.3 `sā` và 37.1–37.3). (2) 57.4 `pañca puttasatānihaṃ`: bản cũ “ta với năm trăm người con trai” đọc như bà đã có năm trăm con vào lúc dâng cúng, trái với 59.3–59.4 (bà sinh năm trăm hoàng tử ở kiếp sau); đây là đối cách làm tân ngữ cho `patthayiṃ` ở 58.1, như bản nguyên bài đọc; sửa thành “ta cầu mong năm trăm người con trai.”. GIỮ: 11.4 (`komārako`: bản nguyên bài hiểu là lương y Jīvaka, Pāli đã ghim chỉ có `komārako` là cậu bé, cùng chữ ở 12.4); 23.1–23.2 (`dasakoṭisahassāni … adāsiṃ mama jīvitaṃ`: bản nguyên bài hiểu là bố thí mười ngàn koṭi của cải, nhưng tân ngữ của `adāsiṃ` là `jīvitaṃ`; so thi-ap28:35–38 `Nekakoṭisahassāni … jīvitāni pariccajiṃ`); 31.3–31.4 (`nāgakaññā mahiddhikā`: bản nguyên bài nói với Long Vương, Pāli là thiếu nữ nāga, cùng chữ ở 32.2); 51.2, 51.4 (`bhikkhudāyikā`, `saṅghadāyikā`: bản nguyên bài là dāsikā, Pāli đã ghim là dāyikā); 72.4 (`bāle`: hô cách số ít nữ, “này cô ngốc”, khớp thig11.1:7.4 và bản nguyên bài hiểu thành định ngữ của bọn du đãng); 74.1–74.4 (bản nguyên bài gán cho Māra; nhưng nháy ‘…’ mở ở 73.1 chưa đóng đến 77.4 và Pāli `esā antaradhāyāmi … tiṭṭhantiṃ maṃ` là ngôi nữ thứ nhất; khớp `thig11.1:9` và `sn5.5:5`, nên giữ lời của Uppalavaṇṇā). BẤT ĐỊNH: 20.1–20.2 `saṅgamaṃ te nidassitaṃ`: bản nguyên bài hiểu theo hướng trực tiếp hoặc gián tiếp, bản dự án giữ nghĩa đen “sự gặp gỡ đã được chỉ ra cho Ngài”; không phân xử được `te` là dữ cách hay công cụ cách. Thêm: 57.2–58.1 vẫn còn bất định chỗ `tepi` (họ) chỉ ai, giữ như Pāli. Số: `Ekanavutito` 91, `vīsavassasahassāni` 20.000, `satapañcakaṃ` 500, tám vị Độc Giác khớp hai bản; `Dasakoṭisahassāni` giữ như Pāli. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Chấm lại: triangulation 7.5 → 8.2 (bản nguyên bài phiến diện hơn ở nhiều chỗ nên đối chiếu thua tầng song song); ambiguity_integrity giữ 8.6; các tiêu chí khác giữ nguyên. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` vẫn để người điều phối chạy.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt cả 338 khoá, đối chiếu bản nguyên bài Bhikkhu Indacanda, đoạn song song thig11.1, sn5.5, tha-ap45, tha-ap316): sửa 2 khoá, đều là sửa rõ nghĩa, không đổi nghĩa Pāli: 33.2 thêm 'vị' (jalajuttamanāmako là Đức Phật Padumuttara, bản cũ 'được gọi là…' dễ bị đọc là nói về 'ta' ở 33.1); 45.2 thêm dấu phẩy sau 'bậc Điều Ngự' (uppalehi thuộc pūjayitvā ở 45.3, không phải định ngữ của vināyakaṁ). Giữ: 14.2 'sỏi thành lúa gạo' (bản nguyên bài cũng hiểu cát thành thóc; thứ tự hai tân cách chưa phân xử chắc, giữ), 12.1 ubbattayitvā 'nhổ lên' (chỉ có ở bài này, PED không tra ra mục; giữ theo luñci ở 12.4 và bản nguyên bài), 71.2 'xe bốn ngựa' (khớp thig11.1:6.2 và bản nguyên bài), 71.4 tādino 'bậc Bất Động' (tiền lệ 17 khoá). Bất định thêm: 32.2/30.4 mahāyasaṁ ở cách đối cách nhưng bổ nghĩa chủ ngữ (hình thái ghim hỏng, không sửa); 57.4 'ta cầu mong' lặp patthayiṁ ở 58.1 (ranh giới khoá, giữ). Không sửa cụm chờ người biên tập: tiêu đề Ký Sự. Các bất định 1–19 cũ vẫn mở; blocker tầng Anh giữ nguyên.

