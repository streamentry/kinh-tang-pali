  **ĐỌC TOÀN BỘ 53 KHOÁ PĀLI TRƯỚC KHI VIẾT CHỮ NÀO.** In lại cặp Pāli↔Việt sau khi ghi.
  Pāli lấy từ tầng root đã ghim (`root/pli/ms/sutta/kn/tha-ap/tha-ap523_root-pli-ms.json`),
  53 khoá, đúng thứ tự file nguồn; khớp `all` của bản làm việc và khớp `list(vi) == list(pali)`.

  **TẦNG THAM KHẢO — MẪU SỐ CHỈ 2, SUJATO PHỦ 0 ⇒ 0% ⇒ `draft`, `triangulation` 7.5.**
  Mẫu số không phải 53: công thức `source/layers.yaml` chỉ tính Pāli có nội dung ≥ 40 ký tự và
  loại block `:0`, nên chỉ còn `:13.1` (68 ký tự) và `:14.1` (42 ký tự). 51 vế kệ còn lại dài
  18–35 ký tự nên **không** vào mẫu số. Cổng coverage của bài này vì thế đo trên 2 khoá — một
  mẫu số rất nhỏ, đã nói rõ ở đây chứ không coi là đã đối chiếu được.

  **`translationTitle` = BÀN DỊCH CỦA `:0.3` NGUYÊN VĂN, VÀ `:0.3` KHÔNG CÓ SỐ THỨ TỰ.**
  Pāli `tha-ap523:0.3` = `Tiṇamuṭṭhidāyakattheraapadāna ` — KHÔNG bắt đầu bằng số, nên theo
  chính sách (giữ số khi và chỉ khi Pāli bắt đầu bằng số, hình thức `N. `) tôi KHÔNG thêm
  số thứ tự. Tên trường và giá trị `:0.3` vì thế trùng nhau từng chữ.

  **CÔNG THỨC `:0.3` — HAI PHẠM VI CHO HAI ĐA SỐ KHÁC NHAU, đã đo cả hai.**
  · Toàn tầng (426 tệp có Việt): *Bài Kệ Tuyên Ngợ* 173 · *Ký Sự* 94 · *Bài Kệ Tuyên Ngôn* 71.
  · Phạm vi gần nhất (10 bài 520–531): *Ký Sự* 6 · *Bài Kệ Tuyên Ngợ* 5.
  Tôi chọn **Bài Kệ Tuyên Ngợ** vì lý do mạnh hơn cả hai số đếm: Pāli `:0.3` của bài này TRÙNG
  BYTE với `tha-ap350:0.3`, và bài đó đã dịch là *Bài Kệ Tuyên Ngợ Về Trưởng Lão
  Tiṇamuṭṭhidāyaka* — tức có một tiền lệ **Pāli trùng nguyên văn**, đúng luật *Pāli trùng thì
  dùng lại nguyên văn bản dịch*, mạnh hơn một đa số về *công thức*. Nhưng **đây là chỗ cần
  người biên tập phán**: 6 tệp trong 10 tệp ngay kề đã chọn *Ký Sự*, còn tầng thì nghiêng *Tuyên
  Ngợ*. Tôi không sửa tệp nào ngoài lát.

  **TÊN PHẨM `:0.2` — HOÀ BA ĐẦU BẰNG NHAU, cần coordinator gộp.** `Tiṇadāyakavagga` phủ 10
  bài (523–532); 7 bài đã có Việt: *Phẩm Cỏ Dâng Cúng* 2 (tha-ap524, 529) · *Phẩm Cúng Dường
  Cỏ* 2 (tha-ap525, 527) · *Phẩm Bậc Cho Cỏ* 2 (tha-ap526, 531) · *Phẩm Tiṇadāyaka* 1 (tha-ap528).
  Ba dạng đầu hòa nhau 2–2–2 nên không có đa số để bám. Tôi chọn **Phẩm Cỏ Dâng Cúng** vì đó
  là dạng của bài kề ngay (`tha-ap524`) và của `tha-ap529`, và vì `tha-ap523` là bài đầu vòng nên
  câu `:0.2` của nó đọc thành tiêu đề chung cho cả vòng. Ghi ở đây để người điều phốn hợp nhất
  cả vòng — không phải để tôi tự tạo cách thứ N+1. Cùng kiểu: sáu vòng `*dāyakavagga` khác
  trong tầng cũng đang mỗi vòng một kiểu, nên đây là vấn đề cấp cả phẩm.

  **DÙNG LẠI NGUYÊN VĂN 43/53 KHOÁ.** Đã dựng chỉ mục Pāli→Việt cho toàn bộ 28.881 khoá Pāli
  của 563 bài `tha-ap` đối chiếu 11.955 khoá Việt đã có, rồi đếm. 43 khoá dùng lại đúng nguyên
  văn bản dịch đã có; 2 khoá có Pāli trùng nhưng tôi dịch khác có lý do (xem dưới); 8 khoá
  không có Pāli trùng ở bài nào khác (`:1.3` `:2.1` `:3.2` `:4.1` `:5.4` `:7.4` `:9.4` `:14.1`).
  **Số cặp PĦI TRÙNG đã dò: 2.436** (cùng Pāli ở bài khác), trong đó **586 chuỗi Pāli trùng mà
  bản Việt ở tầng vẫn khác nhau** (thuộc 880 chuỗi trùng) — tức tầng này vốn đã lệch, nên
  phép đo không phải đồng ý toàn tầng.

  **BÀI GẦN NHẤT LÀ `tha-ap350`** — nó trùng 34 trong 53 chuỗi Pāli của bài này, và cùng là bài
  kể `Tiṇamuṭṭhidāyaka`, nên tôi lấy nó làm khuôn: `:0.3`, `:13.1`, `:14.1` và 25 vế kệ đều
  có tiền lệ ở đó. `tha-ap350` tự nó cũng pha hai đại từ (*ta* ở `:6.4`, *tôi* ở `:4.4`), nên
  sự pha đó có tiền lệ chứ không phải lỗi.

  **NGÔI KỂ — TÔI CHỌN *ta* XUYÊT SUỐT 10 KHOÁ CÓ ĐẠI TỪ, VÀ NÊU CẢ SỐ.**
  Đếm đại từ xuất hiện thật trong bản Việt của tầng, từng khoá Pāli một (loại trừ bài này):
  `Kilesā jhāpitā mayhaṁ` *ta* 77 / *tôi* 31 / *con* 3 · `viharāmi anāsavo` *ta* 78 / *tôi* 31 /
  *con* 2 · `Svāgataṁ vata me āsi` *ta* 76 / *tôi* 28 / *con* 3 · `Duggatiṁ nābhijānāmi` *ta* 186
  / *tôi* 170 / *con* 10 · `mama buddhassa santike` *ta* 6 / *tôi* 1 / không đại từ 1 ·
  `Āsanne me kataṁ kammaṁ` *ta* 1 · `araññe kānane ahaṁ` *ta* 3 / *tôi* 1 / không đại từ 5.
  **7 khoá nghiêng *ta***, và tôi giữ *ta* cả 10 vì trộn *ta* / *tôi* / *con* trong một bài kệ 48
  vế đọc như lỗi người kể. **3 khoá lệch đa số tầng, ghi thẳng ra đây:** `:3.4` hòa ba
  (*tôi* 4 / *con* 4 / *ta* 2) — tôi lấy *ta cất bước quay về phương bắc.*, cấu trúc *ta* có sẵn
  ở tầng, chứ không lấy *rồi con quay mặt hướng bắc mà đi.*; `:4.4` đa số tầng là *tôi* 12 / *ta* 1
  — tôi vẫn dùng *ta*; `:8.4` đa số tầng là *tôi* 3 / *ta* 2, còn 5 dạng còn lại hòa 1–1–1–1–1
  nên tôi theo `tha-ap350` (Pāli trùng nguyên văn) và đổi *tôi* thành *ta*. Cả ba là biến thể
  **đã có sẵn ở tầng**, không phải cách mới.

  **MỘT CHỖ TÔI KẾ THỪA TIỀN LỆ DÙ CHƯA HẾT PĦI — GHI RA ĐỂ BIÊN TẬP PHÁN.**
  `:1.4` `abbhokāsamhi caṅkami` có nghĩa *đã đến gần ở nơi hở*, nhưng tiền lệ nguyên văn của
  tầng (3 nơi, kể cả `tha-ap350`) là *đã đi đến gần núi ấy.*, tức **bỏ mất mạo từ nơi hở**. Tôi
  giữ nguyên văn tiền lệ vì luật *Pāli trùng thì dùng lại nguyên văn bản dịch*, nhưng đây là
  nơi tôi biết bản dịch thiếu một chi tiết của Pāli — nếu biên tập muốn bám sát hơn thì sửa cả
  3 tệp kia cùng lúc, không sửa lẻ.

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU, KHÔNG THÊM VÀO THÂN KINH.**
  · `Aciraṁ gatamattassa` (`:4.1`) — độc được hai cách: trạng ngữ *(chỉ trong một chốc ngắn)*
    hoặc vị ngữ chủ tễ bị lược *(vừa mới tới chút ít)*. Tôi dịch *Chỉ vừa mới tới chút ít,*
    giữ cả hai vế; chủ tễ bị lược là cách Pāli quen thuộc. `tha-ap350:5.1` có Pāli **khác**
    (`Aciraṁ gatamattaṁ maṁ`) nên không phải tiền lệ dùng được.
  · `Migaluddo pure āsiṁ` (`:2.1`) — tầng đang đọc theo 9 hướng. Tôi theo **bản song song
    `pv32:2.3` và `pv33:4.3` của chính bộ này**, dịch *Bằng người tên Bắn Hươu,* cho
    `Migaluddo` là **tên riêng** (`ja503:1.1` `Migaluddo mahārājā` xác nhận nó là danh xưng),
    nên tôi dịch *Trước kia ta là Migaluddha,*. Ba tệp trong tầng đọc *Trước kia ta thành con nai
    bị săn đuổi,* (3) — dạng đa số, nhưng **thêm** cụm *bị săn đuổi* không có ở Pāli nên tôi
    không dùng. `tha-ap502:1.1` dịch *Dãy núi Migaluddo trước kia* là đọc sai.
  · `:1.3 Tattheva tisso sambuddho` — chỉ xuất hiện đúng một lần toàn tầng, không có tiền lệ;
    tôi dịch *Tại đó có bậc Toàn Giác ấy,* theo đúng hai vế (`tattheva` + `tisso sambuddho`).

  **MỌI SỐ PĀLI TÔI DỊCH, KÈM PHÉP TÍNH.**
  · `:6.3` `Sahassakaṇḍo` = sahassa 1.000 × kaṇḍa ⇒ **nghìn** (1 tiền lệ cùng Pāli).
  · `:6.3` `satabheṇḍu` = sata 100 × bheṇḍu ⇒ **trăm** (1 tiền lệ).
  · `:7.2` `sataraṁsīva` = sata 100 + ramsī (tia) ⇒ **trăm tia** (1 tiền lệ cùng cả vế).
  · `:9.1` `Catunnavutito` = catu 4 + navuti 90 = **94** ⇒ *chín mươi tư* (43 tiền lệ).
  · `:11.3` `Tisso` (tiso) = **3** ⇒ *Ba minh* (7 tiền lệ).
  · `:12.1` `catasso` = **4** ⇒ *Bốn* (417 tiền lệ).
  · `:12.2` `aṭṭhime` = **8** ⇒ *tám* (35 tiền lệ).
  · `:12.3` `Chaḷa` = **6** ⇒ *Sáu* (43 tiền lệ).
  · `:14.1` `paṭhamaṁ` = **thứ nhất** — khớp `tha-ap350:13.1` `aṭṭhamaṁ` = *thứ tám* ở
    đúng câu kết ấy, nên hai bài không mâu thuẫn.
  · `:2.4` và `:9.4` *một nắm tay* / *một nắm cỏ* — `muṭṭhi` là nắm tay, Pāli **không** có số
    đếm ở đây, nên tôi không thêm số nào.
  Kiểm số bằng máy trên 9 từ khoá đã xác lập: **hiệu chuẩn 8/8 OK**, 0 lệch ở bài này.
  (Máy còn báo 10 lệch ở 10 tệp **ngoài lát** — `tha-ap70` `171` `172` `241` `244` `245` `313`
  `331` `453` — tôi **báo, không sửa**.)

  **NĂM PHÉP KIẾM, ĐỦ SỐ VÀ MẪU SỐ** (tự viết, quét **cả 53** khoá, không dùng bộ lọc
  `len ≥ 40` vì ở `tha-ap` nó sẽ quét 0–2 khoá rồi báo xanh — đó là *không kiểm gì*).
  1. `set(khoá Việt) == set(khoá Pāli)`: **53 vs 53, lệch 0**; `list(vi) == list(pali)` đúng.
  2. Nháy đơn `‘’` + ngoặc kép `“”` khớp **PĀLI TỪNG KHOÁ**: lệch **0/53**; tổng `“` 1 vs 1,
     `”` 1 vs 1, `‘` 0 vs 0, `’` 0 vs 0. Nhịp nháy ở `tha-ap` **cố ý chạy qua ranh giới khoá**:
     `“` mở ở `:1.1`, `”` đóng ở `:12.4`, nên tôi không cân từng khoá.
  3. Pāli trùng nguyên văn **trong chính bài**: **0 chuỗi lặp** ⇒ **phép chạy rỗng**, tôi không
     ghi *0 lỗi* như thể đã kiểm; mẫu số vẫn là 53 khoá.
  4. Dấu lược: Pāli có `…` 0 khoá, `…pe…` 0 khoá, `(…)` 0 khoá; Việt cũng 0/0/0 ⇒ lệch **0/53**.
     Phe dấu `ti` **không phát sinh** ở bài này vì không có dấu lược nào; không có chỗ nào viết
     `… cho đến …`.
  5. Số PĐÃ XẾP Ở TRÊN, tự tính, không chép từ bản dựa.
  Thêm: NFC 0 lỗi · giá trị rỗng 0 · khoảng trắng đầu/cuối 0 · khoảng trắng lặp 0. Bốn khoá
  chứa chữ Pāli (`:0.1` `:0.3` `:13.1` `:14.1`) là **tên riêng giữ nguyên theo tiền lệ**
  (`Therāpadāna` 416 nơi; `Tiṇamuṭṭhidāyaka` 1 nơi ở `tha-ap350`), không phải Pāli lọt sang.

  **LỜI-KẾT SỐ NHIỀU.** `:13.1` `Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti.` — `imā gāthāyo` là
  **số nhiều**, nên tôi dùng *những bài kệ này*, đúng tiền lệ `tha-ap350:12.1` và nhóm đa số
