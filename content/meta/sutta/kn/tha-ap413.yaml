notes: |-
  Dịch từ Pāli root tại commit đã ghim; đủ 133 khoá, thứ tự và tập khoá khớp Pāli, không có khoá ngoài Pāli. Không có bản Anh Sujato, bản Việt phân đoạn hay english-project cho bài này, nên không có đối chiếu English độc lập; bản dịch dựa trên Pāli, ngữ cảnh bài và tiền lệ đếm được của nhóm tha-ap. Bản Việt nguyên bài ở mục Tra cứu toàn văn chỉ được đọc để kiểm cách hiểu số lớn và vài từ hiếm, không phải tầng đối chiếu ở mức segment và không đưa chữ nào vào bản dịch này.

  Tên bài. 0.3 và translationTitle là cùng một chuỗi: Ký Sự Về Trưởng Lão Bhaddāli. Pāli ở 0.3 (Bhaddālittheraapadāna) không bắt đầu bằng số nên bản Việt không có số thứ tự. 33.1 đọc lại tên đó rồi thêm thứ nhất (Pāli paṭhamaṁ). Kiểu mở đầu tên: đo ở phạm vi gần (tha-ap400–429) là Ký Sự Về Trưởng Lão 17, Bài Kệ Tuyên Ngôn Về Trưởng Lão 4; đo toàn nhóm tha-ap là Bài Kệ Tuyên Ngợ 243, Bài Kệ Tuyên Ngôn 136, Ký Sự Về 129. Tuyên Ngợ là chính tả sai, còn Tuyên Ngôn không phải nghĩa của apadāna; bài này theo Ký Sự Về Trưởng Lão như các bài cùng phẩm tha-ap415 đến tha-ap420. Hai phạm vi cho hai đa số khác nhau, nên để người biên tập phán một lượt cho cả cuốn. Tên người giữ dạng Pāli Bhaddāli. 0.1 giữ Therāpadāna (514 trên 525 bài đã dịch làm vậy). 0.2 là Phẩm Bhaddāli (7 trên 8 bài đã dịch có Pāli Bhaddālivagga).

  Số Pāli, tự tính. Saṭṭhi sahassāni (12.1, 14.1, 16.1, 18.1): saṭṭhi 60 nhân sahassa 1.000 là 60.000, nên sáu mươi ngàn (voi, ngựa, cỗ xe, ngôi làng). Sattāhaṁ (10.1): bảy ngày. Sattarattindivaṁ (3.3): bảy đêm ngày. Catudaṇḍe (5.3): bốn cây cọc. Aṭṭhārase kappasate (20.1): aṭṭhārasa 18 nhân sata 100 là 1.800, nên một ngàn tám trăm kiếp (tầng đã dịch Aṭṭhārase kappasate là một ngàn tám trăm kiếp ở 21 khoá). Sahassakkhattuṁ (20.3): một ngàn lần. Satānaṁ tīṇikkhattuñca (21.1): tīṇi 3 lần, satānaṁ là của các trăm, nên 3 nhân 100 là 300, ba trăm lần (tầng có 2 khoá cùng Pāli dịch Ba trăm lần; 3 khoá dịch Cả bảy món báu quý giá không có căn cứ trong Pāli và không được theo). Tiṁsakappasahassamhi (22.1, 24.1): tiṁsa là 30 (không phải 3), nhân kappasahassa là nghìn kiếp, nên ba mươi ngàn kiếp. Đo trên tầng: 18 khoá cùng Pāli, 16 khoá dịch ba mươi ngàn (kể cả 3 khoá Sau ba mươi ngàn kiếp nữa trong lời thọ ký tương lai ở tha-ap401, tha-ap486, tha-ap553 và 10 khoá Vào ba mươi ngàn kiếp trước đây), 1 khoá tha-ap151 dịch ba nghìn, 1 khoá tha-ap109 dịch ba trăm nghìn; hai khoá lệch này nằm ngoài lát và được báo, không sửa. 22.1 là lời Đức Sumedha thọ ký về tương lai (bhavissati ở 22.4), nên dịch Sau ba mươi ngàn kiếp nữa; 24.1 là lời người kể (addasaṁ, quá khứ), nên dịch Vào ba mươi ngàn kiếp trước đây. Hai khoá Pāli trùng nguyên văn trong bài và bản Việt khác nhau có chủ ý vì thì khác nhau. Tisso vijjā (25.3, 30.3): ba minh. Paṭisambhidā catasso (31.1): bốn vô ngại giải. Aṭṭhime (31.2): tám giải thoát. Chaḷabhiññā (31.3): sáu thắng trí. Không có số nào khác.

  Dấu lược và nháy. Pāli không có … hay (…) ở khoá nào, nên bản Việt cũng không có (0 trên 133 khoá). Nháy: Pāli mở ngoặc kép ở 1.1 và đóng ở 31.4; nháy đơn mở ở 10.1 và đóng ở 23.4; bản Việt khớp Pāli từng khoá, 0 lệch trên 133 khoá (đo từng khoá cho cả bốn loại dấu, không đo cân tổng).

  Tái dùng nguyên văn tầng và phạm vi đã dò: tra từng khoá Pāli của bài trên 525 bài tha-ap khác đã dịch; 76 khoá (kể cả hai khoá tên 0.1 và 0.2) có Pāli trùng nguyên văn với bài khác, 4.023 cặp Pāli trùng đã dò; 69 khoá có bản Việt trùng một cách dịch đã dùng, 59 trùng đúng cách dịch phổ biến nhất của tầng. Bảy khoá có tiền lệ mà bản Việt là cách mới có chủ ý: 2.2 và 3.2 (bậc Dẫn Đạo thế gian: cách dịch lokanāyaka phổ biến nhất của tầng, 56 khoá, và dạng dùng ở tha-ap401 cùng ngữ cảnh Sumedha), 2.3 (ba tiền lệ dịch tấm chiếu, trải tấm phủ, giang cả hai chân không khớp Pāli ābhujitvā; ngồi kiết già có hơn 100 khoá trong kinh tạng đã dịch), 4.2 (ta đã đi sâu vào rừng, cùng gốc ajjhogahiṁ với 2.1, tiền lệ duy nhất dịch lang thang), 4.3 (ngôi ta theo cả phẩm và bài, Chánh Đẳng Giác theo 1.1), 21.1 (xem phần số), 24.2 (ta trông thấy bậc Dẫn Đạo thế gian: Dẫn Đạo thế gian 56 khoá so với Dẫn Lộ Thế Gian 6). Mười khoá có bản Việt trùng một cách dịch của tầng nhưng không phải cách phổ biến nhất: 10.4 (hãy nghe lời Ta nói viết hoa vì người nói là Đức Phật, 9 khoá so với ta viết thường 14; tha-ap486 cùng ngữ cảnh dùng Ta), 11.1 (Dù làm chư thiên hay làm người, 1 khoá so với dù sinh làm 3), 20.1 (Trong một ngàn tám trăm kiếp là dạng của lời thọ ký tương lai ở tha-ap401 và tha-ap553; dạng Vào … kiếp trước 11 khoá là kể lại quá khứ), 21.3 (Vương quyền cai quản các vùng đất rộng lớn, 13 khoá, so với Vương quốc rộng lớn ấy 15 khoá; ấy không có trong Pāli và padesarajja là vương quyền ở các vùng, như tha-ap486), 22.1 (xem phần số), 22.3 (Tên là Gotama viết hoa đầu theo Pāli, 10 khoá so với viết thường 18; cùng cách tha-ap401 và tha-ap486), 26.1 (xem bất định 9), 28.2 (kiếp sống tối hậu đang diễn ra, 2 khoá, vì dịch được vattate; dạng này này là đời cuối cùng của ta, 3 khoá, lặp 28.1 và bỏ vattate), 28.3 và 29.3 (Như thớt voi bẻ gãy mọi trói buộc viết hoa đầu theo Pāli ở dòng thứ ba, 6 khoá, so với viết thường 14; cùng kiểu viết hoa dòng ba trong bài này). Các lựa chọn đáng ghi khác: 21.4 đếm không hết, vô tận theo 17 khoá; 6.3 Với tâm tịnh tín hân hoan 61 trên 86; 8.4 bậc Có Mắt thuyết giảng Pháp 8 trên 10; 15.4, 17.4, 18.6 và 19.4 đây là quả báo của việc cúng dường Đức Phật 56 trên 111; 23.3 Đã hiểu rõ toàn bộ lậu hoặc 35 trên 42; 28.4 và 29.4 ta sống không còn lậu hoặc 123 trên 182. Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti dùng dạng Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (nhóm số nhiều), không dùng dạng số ít. Ngôi kể dùng ta ở mọi khổ của người kể (cùng phẩm và nhóm gần); Đức Phật tự xưng Ta, và 11.2 đến 23.4 gọi người cúng hoa là người ấy hoặc người này theo ayaṁ naro ở 13.6. Dòng thứ ba của mỗi khổ viết hoa chữ đầu theo Pāli. Về hoa sala (6.1, 10.2): tầng có hoa sala 2 khoá và cây sala 7 khoá, so với cây sāla 3 khoá, nên viết sala.

  Pāli trùng trong chính bài: 12 nhóm Pāli trùng (2.2 và 3.2; 2.4 và 3.4; 7.4 và 9.4; 12.2, 14.2 và 16.2; 13.1, 15.1 và 17.1; 15.3, 17.3 và 19.3; 15.4, 17.4, 18.6 và 19.4; 22.1 và 24.1; 25.3 và 30.3; 25.4 và 30.4; 28.3 và 29.3; 28.4 và 29.4); 11 nhóm có bản Việt giống hệt nhau; 1 nhóm (22.1 và 24.1) bản Việt khác có chủ ý vì thì khác nhau, như phần số đã nêu.

  Bất định (không thêm vào thân kinh). (1) Số kiếp ở 22.1 và 24.1: xem phần số; không có bản Anh đã ghim để đối chiếu độc lập, nên đề nghị người biên tập xác nhận ba mươi ngàn kiếp cho cả cuốn. (2) 12.3 và 12.4 Suvaṇṇakacchā mātaṅgā hemakappanavāsasā: kacchā là đai, kappana là trang cụ của voi, vāsa là tấm khoác; dịch những con voi có đai bằng vàng, khoác trang cụ bằng vàng; 0 tiền lệ cùng Pāli. (3) 13.1 gāmaṇī: trưởng làng, người cưỡi voi, ngựa, cỗ xe trong lời thọ ký; không dịch thành người điều khiển voi vì Pāli không nói; 0 tiền lệ. 13.2 tomaraṅkusapāṇibhi: tay cầm giáo và móc câu. (4) 15.2 illiyācāpadhāribhi: illiyā đọc là gươm, nên dịch mang gươm và cung; cách đọc khác coi illiyā là một loại vũ khí khác; 0 tiền lệ. (5) 16.3 Dīpā athopi veyagghā: Pāli chỉ có dīpā (báo) và veyagghā (hổ); dịch có da báo và cả da hổ theo cách hiểu truyền thống về cỗ xe bọc da thú; chữ da là sự đọc, không có trong Pāli; cách đọc khác là chính loài báo và hổ; 0 tiền lệ. (6) 14.3 Ājānīyāva jātiyā: thuần chủng ngay từ khi sinh; 0 tiền lệ. 14.4 sīghavāhino: chuyên chở nhanh chóng. (7) 25.2 yamahaññāsi: hapax toàn tầng Pāli; đọc là yaṁ ahaṁ aññāsiṁ, dịch vì ta đã hiểu được lời dạy; cách đọc khác coi yaṁ là đại từ quan hệ của sāsanaṁ (lời dạy mà ta đã hiểu); cả hai cùng nghĩa chính. (8) 24.3 Etthantaramupādāya: từ khoảng thời gian ấy trở đi; tầng chỉ có Etthantare (3 khoá, dịch trong khoảng giữa ấy), 0 tiền lệ cho upādāya trong cụm này. (9) 26.1 purisājañña: tuấn mã giữa loài người, theo ājañña là giống thuần chủng; tầng có 5 khoá cùng Pāli (bậc hiểu biết người đời 3, tuấn mã 1, tối thắng 1); bậc hiểu biết người đời không có căn cứ rõ trong Pāli nên không theo. (10) 11.2 hemavaṇṇo: sắc màu vàng (tiền lệ 1 khoá, ngươi sẽ có sắc màu vàng); Pāli không nói da hay thân. 11.4 kāmabhogī: người hưởng dục lạc. (11) 27.4 phalaṁ me ñāṇakittane: quả báo của ta trong việc ca ngợi trí; 0 tiền lệ cùng Pāli. 26.3 ñāṇaṁ pakittetvā dịch ca ngợi trí theo tiền lệ Yo me ñāṇaṁ pakittesi (tha-ap486, 1 khoá). (12) 8.3 Asaṁsayaṁ: giữ Không còn nghi ngờ theo tiền lệ 1 khoá; cách đọc khác là chắc chắn. 8.1 Buddhassa giramaññāya dịch Hiểu rõ lời của Đức Phật (tha-ap332, tha-ap399, 2 khoá; Nhận ra tiếng nói của Đức Phật có 2 khoá). 4.1 Khāribhāraṁ gahetvāna giữ Gánh mang đồ vật trên vai theo 3 khoá, dù khāribhāra là một gánh khārī. (13) 10.1 và 10.2 dhārayī sālachāditaṁ: duy trì mái che được phủ bằng hoa sala, cấu trúc câu trải qua hai khoá; me dịch cho Ta. 6.2 maṇḍapaṁ chādayiṁ: phủ lên mái che, với hoa sala ở 6.1.

  Coverage English: mẫu số là 1 khoá có nội dung (32.1 là 60 ký tự, câu kết; 129 khoá còn lại là kệ ngắn dưới ngưỡng 40 hoặc khối :0); Sujato phủ 0 trên 1; english-sujato tại commit đã ghim chỉ có 9 nhóm cp, dhp, iti, ja, kp, snp, thag, thig, ud và không có tệp thân kinh tha-ap nào (tệp tha-ap duy nhất là tệp tên); vietnamese-current chỉ có Pháp Cú; english-project chưa có entry cho bài này. Cổng coverage hầu như không đo được gì ở bài này. Việc content/meta/reference-gaps.yaml có hay chưa có entry cho tha-ap413 chưa được kiểm; người điều phối cần chạy npm run reference:gaps. Entry ở đó không thay đổi việc bài này giữ draft.

