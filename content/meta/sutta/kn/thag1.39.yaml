notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Tự quét 9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu
  lược khớp (1.5 giữ hai dấu lược trần), nháy kép mở 1.1 đóng 1.4 nên cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 1.5 (dòng … Tên thero …).

  PAI TRUNG NGUYEN VAN — MOT CUONG LON, TOI PHAI CHON VA GHI RO. Bốn khoa cua bài nay trùng y hệt
  với sn1.21:2.1–2.4 và sn2.16:2.1–2.4 (đã so ký tự từng cặp). Nhưng TẦNG ĐANG TỰ MÂU THUẪN:
  mỗi vế có ĐÚNG hai cách, mỗi cách đúng 2 lượt, không có bên nào thắng.
    · Sattiyā viya omaṭṭho: Như bị mũi thương đâm phải (sn1.21, 2 lượt) vs Như bị mũi gươm
      đâm vào thân (sn2.16, 2 lượt). Tôi theo sn1.21.
    · ḍayhamānova matthake: như đầu đang bị thiêu đốt (sn1.21) vs như đang bị thiêu đốt trên
      đầu (sn2.16). Tôi theo sn1.21.
    · Kāmarāgappahānāya: cả sn1.21 và sn2.16 đều KHÔNG dịch khoá này — họ dịch nghĩa
      Kāmarāgappahānāya sang khoá kế tiếp. Ở bài này `Kāmarāgappahānāya` đứng một mình ở 1.3,
      nên nếu tôi theo họ thì khoá 1.3 sẽ mất sạch nghĩa của chính nó. Tôi KHÔNG theo, mà dịc
      *để đoạn trừ tham dục,* dùng lại đúng cụm *để đoạn trừ tham dục* đã có ở sn1.21:2.4.
      Đây là CỐ Ý RỜI HAI CÁCH ĐANG CÓ, vì sao chép cách dịch lệch khoá sẽ tạo ra một bản Việt
      mà khoá 1.3 không mang đúng nghĩa Pāli của nó — lỗi loại “thiếu nghĩa trọng yếu”.
    · sato bhikkhu paribbaje: sn1.21 gộp thành *hãy xuất gia để đoạn trừ tham dục*,
      sn2.16 gộp thành *để đoạn trừ tham ái trong các dục*, còn iti15:4.4 và iti105:4.4 — vốn
      CÓ ĐÚNG CHÍNH CHUỖI NÀY làm một cả khoá — dịch *tỳ-kheo hãy sống chánh niệm.*. Tôi theo
      iti15/iti105 vì đó là tiền lệ khớp trọn khoá.
    Đây là chỗ người điều phối cần quy một lần cho cả tầng; tôi không tự quyết được. Tôi hạ
    terminology và ambiguity_integrity vì chính bài này đang lệch với hai bài kia.

  LƯU Ý: `paribbaje` nghĩa gốc là đi du hành, còn hai bài trùng dịch là xuất gia / sống chánh
  niệm. Tôi theo tiền lệ chứ không tự sửa; người đọc không nhận ra nghĩa du hành đã mất.

  `Kuccasutta` không có ở đây. Khuôn tiêu đề: Phẩm Thứ Tư (20 lượt ngoài lát; thag2.35 có một
  lượng viết *4. Phẩm Thứ Tư*, tôi theo đa số). `Tissattheragāthā` → *Kinh Kệ Của Trưởng Lão
  Tissa* dùng lại nguyên văn từ thag1.97.
