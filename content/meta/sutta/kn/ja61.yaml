notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli và file en/sujato so git-hash với manifest và khớp. english-sujato CÓ mặt: 10/11 khoá có prose, khoá 2.1 để trống.
  Tiền lệ có đếm: Itthivagga → Phẩm Phụ Nữ (4 tệp: ja62–ja65); colophon không dấu phẩy, khớp cả 4 tệp cùng phẩm.
  Quyết định biên tập và lý do: tên bài Asātamantajātaka có hai nửa, asāta và manta. Chính vế kệ của bài định nghĩa asā: Asā lokitthiyo nāma, tức phụ nữ trong thế giới được gọi là vô chủ. Nên tôi đặt tên theo nghĩa mà chính bản thân kệ nêu — Kinh Phụ Nữ Vô Chủ — và không giữ chữ manta, vì thêm nó vào tiêu đề sẽ là thêm nghĩa ngoài Pāli bài này. vô chủ có tiền lệ ở mn82:39.x. Đây là chỗ biên tập có chủ ý, nên ambiguity_integrity 9.0.
  Bất định đã ghi và đã phân xử: Sujato dịch pagabbhā là full of desires, còn Pāli pagabbha là kiêu ngạo/trơ trẽn; Pāli thắng nên dịch thô lỗ, kiêu ngạo (sārattā = thô lỗ, pagabbhā = kiêu ngạo). velā tāsaṁ na vijjati là không có lúc nào ràng buộc được họ, giữ phủ định và mốc thời gian. sikhi sabbaghaso là ngọn lửa thiêu cháy tất cả. pabbajissāmi là xuất gia, viveka là sự thanh vắng. Vì có một chỗ lệch với Sujato nên triangulation 8.2, semantic_fidelity và grammar_logic 9.2. Không có segment Pāli ≥ 40 ký tự nên sàn coverage không kích hoạt; không có bản Hòa thượng Thích Minh Châu ở commit đã ghim.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
