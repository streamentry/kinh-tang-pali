notes:
  - >-
    **Bài `Therīgāthā` đầu tiên trong kho.** Tệp Bilara có 9 khoá, hình dạng
    **khác `thag1.2`** (đã `published`, PR #119): `0.1`–`0.3` rồi `1.0` là dòng
    quán y, `1.1`–`1.4` là bốn câu kệ, `2.1` là dòng ghi nguồn. Tôi dựng đúng
    hình dạng này.
  - >-
    `1.0` `Namo tassa Bhagavato Arahato Sammāsambuddhassa.` → *Kính lạ Đức Thế
    Tôn, bậc A-la-hán, bậc Chánh Đẳng Giác!* (theo bản Anh) · `Ekakanipāta` →
    *Bộ Một Bài Kinh* (nguyên văn `thag1.2:0.2`, đã `published`) ·
    `Aññatarātherīgāthā` → *Kệ Của Vị Trưởng Lão Nữ Vô Danh* (0 tiền lệ).
  - >-
    `1.4` kết bằng `”ti.` — đây là `ti` **có trong Pāli**, không phải chữ sót;
    tôi giữ nguyên và đã nới điều kiện kiểm tra cho đúng trường hợp này (trước
    đó chặn vô điều kiện và sẽ báo nhầm).
  - >-
    `supāhi therike` → *ngươi ngủ yên, này Trưởng lão nữ* · `Katvā coḷena
    pārutā` → *đã đắp chăn do chính ngươi may* — **0 tiền lệ, đặt mới**; bản Anh
    dịch *“wrapped in the cloth you sewed yourself”*, tôi theo cùng cách đọc
    (`koḷa` = chăn/phủ) · `Upasanto hi te rāgo` → *bởi tham của ngươi đã lắng
    xuống* · `Sukkhaḍākaṁ va kumbhiyan` → *ngươi cạn khô như cái nồi* (bản Anh:
    *“like vegetables boiled dry in a pot”*; tôi dịch theo nghĩa Pāli là *bình
    cạn khô*).
  - >-
    `2.1` `Itthaṁ sudaṁ aññatarā therī apaññātā bhikkhunī gāthaṁ abhāsitthāti.`
    → *Này các tỳ-kheo, tôi nghe vị Trưởng lão nữ vô danh đã từng nói bài kệ
    này.* — theo khuôn ghi nguồn của `thag1.2:1.5` (đã `published`), khác
    `thag1.2` ở chỗ có `Bhagavato … bhikkhunī` nên phải có “Này các tỳ-kheo”.
  - >-
    **Quy tắc dấu lược của kho, đo lại chứ không đoán:** trong 1.535 segment đã
    `published` có `…` trong Pāli, chỉ 617 (40%) giữ đúng số, và cặp lệch phổ
    biến nhất là Pāli 2 → Việt 1 (685 chỗ, tức `…pe…` → `…`). Quy tắc là
    **có/không có `…` phải khớp theo từng segment**.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Bộ, Tăng Chi Bộ Lớn và Tăng Nữ Kệ không
    có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản
    chụp upstream, đã ghi ở `content/meta/reference-gaps.yaml`.
  - >-
    **Bài `Therīgāthā` đầu tiên của kho.** Hình dạng khác hẳn `thag1.2`: có khoá
    `1.0` (dòng quán y) và khoá `2.1` (dòng ghi nguồn), không có `0.4`.
  - >-
    ĐÍNH CHÍNH của người điều phối (cùng PR): bản dịch ở khoá `thig1.1:2.1` mở đầu
    bằng *Này các tỳ-kheo*, mà Pāli `Itthaṁ sudaṁ aññatarā therī apaññātā bhikkhunī
    gāthaṁ abhāsitthāti.` **không có vocative nào** — thêm lời hô là thêm ý, vi phạm tiêu
    chí 2 và rơi vào tiêu chí 4. Đợt này dọn nốt công thức `…abhāsitthāti`: sau khi sửa,
    toàn tầng còn **82** khoá mở đầu *Tôi nghe như vầy:* và **0** khoá thêm lời hô.
    `semantic_fidelity` hạ 0,2.
