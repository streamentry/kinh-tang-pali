notes: |-
  CHỐT LƯỢC TỪNG VẾ. (1) Usabha ở 1.1 là bò mộng, dùng làm hình ẩn dụ sức lớn; vijambhita ở 1.2 là gầy guộc, nên cả vế đọc thành thân ngươi như bò mộng mà lại gầy như sư tử. (2) Migarāja ở 1.3: miga là thú vật, tôi dịch Vua của loài thú (Rouse dịch O king of beasts). (3) siṅgālo ở 3.1: từ điển gloss phân, tôi dịch phân. (4) vāyasa ở 2.4 và vāyaso ở 3.2 là cùng một từ; ở 3.2 nó đứng trong danh sách bậc tối thượng của loài chim, cùng cấu trúc với 3.1 và 3.3, nên tôi dịch cả hai là gió. Đây là chỗ dễ sai: tầng đã có ja274:1.4 dịch vāyaso thành chim ưng, và PED cũng gloss vāyasa là chim ưng. Tôi chọn gió vì cấu trúc 3.1–3.3 đòi vậy, và ghi rõ ở đây để người biên tập xem lại cả hai. (5) Eraṇḍo là cây dầu mè. (6) Namo tyatthu ở 1.3 là cúi đầu bái, tôi dịch con xin hạ đầu ở đây.

  HAI VẾ TRÙNG NGUYÊN VĂN JA294. 2.1 và 2.2 Kulaputtova jānāti / kulaputtaṁ pasaṁsituṁ trùng byte-for-byte với ja294, nên tôi dùng lại đúng nguyên văn tôi đã đặt cho ja294, không dịch lần hai.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của kiểm cổ chỉ quét khoá Pāli từ 40 ký tự trở lên; ở bảy bài Jātaka của lát này mọi vế kệ đều ngắn hơn ngưỡng đó (vế dài nhất 35 ký tự) nên assertion về bản chất KHÔNG chạy. Tôi tự quét lại TOÀN BỘ 238 khoá của 14 bài từ tệp đã ghi trên đĩa: đủ khoá và không thừa so với Pāli (sắp theo thứ tự số), không rỗng, chuỗi NFC, số dấu lược khớp từng khoá, không có (…), không thừa dấu lược, và số dấu nháy kép so với Pāli từng khoá. Kết quả: 0 lỗi trên 238 khoá.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… hay dấu lược — đã kiểm bằng script trên từng khoá. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không mở rộng, không nén, không có (…) đứng một mình.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Tôi tự dựng chỉ mục Pāli↔Việt bằng script: nạp 5.764 tệp Pāli trong .cache/upstream/suttacentral/root/pli (bỏ *.apfs-orphan) và 4.136 tệp Việt dự án trong content/translation/vi/project/sutta — tổng 112.947 khoá Việt — ghép theo khoá, rồi quét từng khoá thân bài của lát theo nguyên văn căn thẳng và theo dạng đã chuẩn hoá dấu câu, nháy kép, hoa thường, và loại bỏ chính 14 tệp của lát để đo đúng trạng thái trước khi tôi ghi. Kết quả: 44 cặp Pāli trùng ở thân bài, 42 trùng byte-for-byte và 2 trùng sau chuẩn hoá. Trong đó 33 cặp đã có bản Việt ở bài khác, tôi DÙNG LẠI NGUYÊN VĂN ở: ja275 2.3, 2.4, 3.1, 3.2, 3.3, 3.4 ← ja274; ja294 3.1 ← sn1.1; mil3.1.11 3.2 và 3.3 ← sn10.12:5.2 và 5.3 (tôi lấy cả bộ bốn vế ở sn10.12:5.1–5.4 để bài này không tự mâu thuẫn với bài nguồn); Opammaṁ karohī ở mil3.1.11:2.1, mil3.1.14:2.1, mil3.1.15:2.1, mil3.2.2:2.1, mil3.5.10:2.1, mil3.7.16:2.1; mil3.1.14 3.1 ← mil3.1.12:3.1 và 3.5 ← mil3.1.12:3.4; Kallosi ở mil3.1.11:4.1, mil3.1.14:4.1, mil3.1.15:3.1, mil3.2.2:3.1, mil3.2.9:2.1, mil3.5.10:3.1 ← 54 tệp mil khác; mil3.2.2 2.4 ← mil3.5.9:2.3; mil3.5.10 6.1 ← mil3.4.10:5.1 và mil6.2.10:5.1; mil3.7.16 5.1 ← mil3.1.16:6.1. Mười một cặp còn lại thì chưa bản Việt nào ở bài khác có, tôi phải đặt mới: ja294 2.1 và 2.2, ja295 2.1 và 2.2 (bốn khoá này là hai cặp trùng nhau — chính bài trong lát đã trùng nhau; tôi đặt một lần rồi dùng lại nguyên văn cho cả hai bài), ja295 1.3 và 1.4 (trùng ja308:1.3 và 1.4), ja297 1.2 (trùng ja429:6.2 và ja430:6.2), ja298 1.2 (trùng sáu chỗ trong ja547), mil3.1.11 1.3 và 2.4 (trùng nhau, chỉ khác ở dấu nháy) và mil3.2.9 5.1 (trùng mil6.1.9:12.1). Ghi lại đây để lát sau dùng lại nguyên văn của tôi thay vì dịch lần hai.

  MỌI CÔNG THỨC HỘI THOẠI ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN. Rājā āha— → Vua nói: (đếm trong tầng mil có 30 tệp dùng Vua nói: và 12 tệp dùng Vua nói—, tôi theo đa số; 11 tệp còn lại dùng Vua nói:—). Thero āha— → Trưởng lão nói: (3 tệp dùng dạng có dấu hai chấm và 3 tệp dùng dạng có gạch nối, hòa nhau; tôi chọn dạng có dấu hai chấm để nhất quán với Vua nói: trong chính lát này). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā. (54 tệp mil, chỉ một cách). Opammaṁ karohī → Xin hãy xét một thí dụ ti. (đúng mil3.1.12:2.1, mil3.2.7:2.1, mil3.2.8:2.1). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa ti. (đúng mil3.1.12:3.1). Bhāsitampetaṁ, mahārāja, bhagavatā— → Điều này, này Đại vương, Đức Thế Tôn đã nói — (đúng mil3.1.12:3.4). Imasmiṁ vagge dasa pañhā và Imasmiṁ vagge soḷasa pañhā → Trong phẩm này có … câu hỏi. (đúng mil3.4.10:5.1, mil6.2.10:5.1, mil3.1.16:6.1). Rājā → vua, Mahārāja → Đại vương, bhagavā/bhagavatā → Đức Thế Tôn hoặc Đức Thật Chứng Ấy, Thero → Trưởng lão, Kāma → tình dục, sīla → đức hạnh.

  TÊN PHẨM ĐÃ CHỐT. Tikanipāta → Bộ Ba Bài Kinh (bốn bài lân cận đã có: ja276, ja291, ja292, ja293). Udapānavagga → Phẩm Nước Uống (đúng ja276 và ja279; tôi tự đếm bằng script trên Pāli gốc: 10 bài mang tên phẩm này là ja271..ja280, và ja275 nằm trong đúng khoảng đó). Kumbhavagga → Phẩm Bình Vò: tên này CHƯA có trong bảng chốt của BRIEF_VI3 §11, nên tôi theo đa số trong chính phẩm đang làm — ba bài đã có (ja291, ja292, ja293) đều dùng Phẩm Bình Vò; tôi tự đếm Kumbhavagga chiếm đúng ja291..ja300, trong đó lát này có sáu bài. Người biên tập nếu muốn chốt khác thì phải sửa cả mười bài cùng lúc. Các tên phẩm Milindapañha cũng theo đúng bầy bài lân cận: Mahāvagga → Đại Phẩm, Addhānavagga → Phẩm Khoảng Thời Gian, Buddhavagga → Phẩm Đức Phật, Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc.

  STATUS. Hai blocking error ở trên là thật và đo được (thiếu hẳn tầng Anh Sujato tại commit đã ghim; coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên mọi bài lát này đặt draft bất kể final_score. Tôi không nâng điểm để né blocker và cũng không hạ điểm để tỏ ra thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có tầng tham khảo nào.

  Giải quyết draft 2026-10-12 (kiểm toán độc lập, đọc đối kháng lại 17 khoá từ Pāli). Mục này THAY THẾ các chốt lược ở đầu notes về vāyasa, siṅgālo, eraṇḍo, anto, vijambhita, khandho và tên bài; các mục khác giữ làm lịch sử.

  SỬA NGHĨA THẬT (14 trên 17 khoá có đổi; 13 khoá là lỗi nghĩa/từ vựng thật — 0.4, 1.2, 1.3, 1.4, 2.1, 2.2, 2.3, 2.4, 3.1, 3.2, 3.3, 3.4, 4.1 — và 1.1 chỉ là sửa thuật ngữ). (1) vāyasa là QUẠ, không phải "gió": ở 2.4 và 3.2 bản cũ viết "gió" — sai từ vựng. Đếm trong tầng: vāyasa/vāyaso được dịch quạ ở ja147:1.2, ja394:1.4 và 5.4, ja529:25.3, ja547:186.4; chỉ ja214:2.2 (gió) và ja274:1.4, 2.2 (chim ưng) khác, đều là điểm lệch của bài khác chứ không phải tiền lệ. Lập luận "cấu trúc 3.1–3.3 đòi gió" của notes cũ không đứng được: cấu trúc đó đòi một con vật xếp bét trong loài chim, và quạ đúng chỗ ấy. (2) siṅgālo là CHÓ RỪNG, không phải "phân": tầng đặt siṅgāla là chó rừng ở ja113, ja142, ja148 (tên bài) và ja157:2.6; "phân" ở 3.1 là gloss sai. (3) eraṇḍo là cây THẦU DẦU, không phải "dầu mè" (mè là tila): theo ja474:7.1 "cây thầu dầu". (4) anto ở 3.1, 3.3, 3.4 (và tên bài Antajātaka): bản cũ dịch "điểm cuối", nghe như mốc kết thúc và làm cả ba vế thành vô nghĩa; ở đây anto là bậc thấp nhất, thấp kém nhất trong từng loài (chó rừng trong loài thú, quạ trong loài chim, thầu dầu trong loài cây), và 3.4 tayo antā = ba kẻ thấp kém nhất đã hội tụ. Đây là nghĩa chuẩn của anta khi dùng làm tính từ (cùng họ với antama, antajāti). Tên bài đổi thành "Kinh Kẻ Thấp Kém Nhất" (0.4, 4.1 và translationTitle). (5) vijambhitaṁ ở 1.2: bản cũ dịch "gầy guộc", không có căn cứ; vijambhita là cái vươn mình, ngáp dài của sư tử (cùng gốc với vijambhati, tầng dịch "vươn mình" ở ja452:3.3 và ja531:77.3, "ngáp vươn" ở ja539:138.1). Vế 1.1–1.2 là lời khen có chủ ý: vai như bò mộng, vươn mình như sư tử — không phải "mà lại gầy". (6) khandho ở 1.1: "thân" đổi "vai", vì đối vế với usabha chỉ phần vai gồ của bò mộng. (7) 2.1–2.2: bản cũ dịch "kẻ làm tròn đạo hạnh … hiểu … và phán xét", đảo cả ba điều: kulaputta là con nhà gia thế (tầng đặt ở ja536:90.1 và ja539:160.4 là "con nhà gia thế"), jānāti + pasaṁsituṁ là "biết cách khen ngợi" (không phải "phán xét"). Nghĩa: chỉ con nhà gia thế mới biết cách khen con nhà gia thế — lời từ chối lời tâng bốc. (8) 2.3 Mayūragīvasaṅkāsa: bản cũ "Ngươi mang cổ đẹp như cổ con cô" — "cô" vô nghĩa, và thêm "đẹp" không có trong Pāli; đã đổi thành lời hô "hỡi kẻ có vẻ như cổ chim công" (saṅkāsa = trông giống). Hô cách đứng trước vāyasa ở 2.4. (9) 2.4 ito pariyāhi: bản cũ "từ trên kia hãy bay xuống" thêm "bay", "trên", "xuống" — Pāli chỉ có ito (từ đây) và mệnh lệnh đi nơi khác; đổi thành "từ đây hãy đi chỗ khác, quạ ơi". (10) 1.3–1.4: dùng lại nguyên văn tầng cho Pāli trùng ja308:1.3 và 1.4 ("Xin kính chào ngài, hỡi chúa tể loài thú," / "liệu chúng tôi có nhận được chút gì chăng") thay cho "con xin hạ đầu ở đây … dù chỉ một phần nhỏ, xin cho có được": bản cũ thêm "ở đây", "dù chỉ một phần nhỏ" và bỏ hô cách; kiểm hai cặp trùng, cả hai khác ở bản cũ và nay khớp. Chỗ lệch giữa ja308 (chúng tôi, lời một đoàn) và ja295 (người nói là một kẻ): labhāmase là ngôi thứ nhất số nhiều, nên giữ "chúng tôi" theo đúng động từ. (11) 3.2: câu rút gọn "pakkhīnaṁ pana vāyaso" (pana = còn) viết "còn trong loài chim, là quạ", ngầm dùng lại vế anto của 3.1 và 3.3.

  TIỀN LỆ ĐÃ KIỂM. Pāli trùng nguyên văn trong chính bài: 0 cặp. Pāli trùng ở bài khác: 2.1 và 2.2 trùng nguyên văn ja294:2.1 và 2.2, 1.3 và 1.4 trùng ja308:1.3 và 1.4. Với 1.3 và 1.4 đã dùng lại nguyên văn ja308; với 2.1 và 2.2 bản ja294 hiện còn viết "làm tròn đạo hạnh" (cùng lỗi như bản cũ của bài này) nên KHÔNG theo, và cần sửa ja294 cho khớp bài này — nếu hai bài ra khác nhau thì phải chọn lại một lần cho cả hai. Hai lệch ngoài lát (không sửa): ja274 dịch vāyasa là "chim ưng" ở 1.4 và 2.2, ja214 dịch vāyasa là "gió" ở 2.2 — cùng họ lỗi với bản cũ của bài này; cần người rà các bài đó.

  BLOCKER ĐÃ GỠ VÀ GIỮ. Giữ: blocker thiếu hẳn bản Anh Sujato tại commit đã ghim (sự thật về upstream, đếm được; đây là loại có thể xử bằng waiver của người biên tập). Gỡ: blocker "coverage tầng Anh 0 trên 0". Mẫu số bằng 0 — mọi vế kệ đều ngắn hơn ngưỡng 40 ký tự — nên cổng coverage không đo được gì và không thể nói "dưới ngưỡng"; đó không phải lỗi văn bản. Cả 17 khoá được đọc lại từ Pāli một mình, không có tầng Anh hay Việt hiện hành nào (cả hai đều vắng; Việt hiện hành chỉ có Pháp Cú tại commit ghim) nên `triangulation` đặt 6,5, thấp hơn mọi giới hạn 8,0. Không có đoạn nào của bài mà Pāli không tự đứng vững, ngoài bốn điểm bất định nêu dưới đây.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh). (a) Người nói của vế 1 (và 3) không được đánh dấu trong Pāli; chỉ biết vế 2 là lời đáp hô quạ (vāyasa). Không đặt nhãn người nói. (b) anto = thấp kém nhất là nghĩa suy từ cấu trúc ba vế xếp bậc và từ gốc anta; nếu người biên tập muốn bám sát chữ hơn, thay bằng "ở tận cùng/dưới cùng". (c) pariyāhi (2.4) là mệnh lệnh của pari + yā, nghĩa gốc "đi vòng", ở đây dùng với ito để đuổi đi; không có bản Anh để đối chiếu. (d) Mayūragīvasaṅkāsa có thể là lời mỉa hay lời tả thực về cái cổ óng của quạ — Pāli không phân biệt, bản dịch giữ nguyên tả cổ chim công.

  KỸ THUẬT. Đã tự soát lại 17 khoá: đủ khoá và thứ tự khớp Pāli, không khoá rỗng, chuỗi NFC, 0 dấu lược (Pāli cũng 0), dấu nháy kép khớp Pāli từng khoá (1.1 mở, 1.4 đóng, 2.1 mở, 2.4 đóng, 3.1 mở, 3.4 đóng), không có số trong thân bài nên không có phép tính số Pāli. Lượt này không chạy npm run validate, npm test, npm run check, npm run build; technical_integrity giữ 9,6, không tuyên bố technical gate pass.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 3 khoá chênh lệch lớn nhất (`0.4`, `3.4`, `4.1`) → khác nghĩa 0: sửa 0, giữ 3, bất định 0 mới. Giữ `0.4`/`4.1`: bản mù đặt tên bài theo kiểu *Chuyện Tiền thân Anta*, chỉ khác khuôn tiêu đề; bản dự án giữ khuôn *Kinh <Tên>* của tầng. Giữ `3.4` `tayo antā samāgatā`: bản mù *ba hạng chót* cùng nghĩa *ba kẻ thấp kém nhất*, nên là chứng cứ độc lập cùng chiều cho cách đọc `anto` là bậc thấp nhất đã xác lập ở lượt 2026-10-12. Review đối kháng toàn bài 17 khoá: nháy kép khớp Pāli từng khoá, không dấu lược, không số, xưng hô nhất quán (`1.4` `labhāmase` là ngôi thứ nhất số nhiều nên giữ *chúng tôi*); không phát hiện lỗi mới. Các bất định (a)–(d) ở trên giữ nguyên. Không có bản Anh hay bản Việt độc lập khác; `triangulation` chỉ dựa trên một lần dịch lại cùng họ công cụ nên bị giữ dưới 8,0. Lượt này không chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`; không tuyên bố technical gate pass.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài, không có đoạn song song đã published): sửa 2 khoá — 1.2 "sự vươn mình như của sư tử" là calque, đổi "dáng vươn mình như sư tử" (nghĩa không đổi); 3.4 dời dấu chấm ra sau nháy đóng cho khớp quy ước các bài khác trong lô. Giữ phần còn lại. Bất định nâng mức cảnh báo: 2.4 `ito pariyāhi vāyasa` đang dịch "từ đây hãy đi chỗ khác" (đuổi đi), nhưng chính Pāli 2.1–2.3 là lời khen đáp lễ ("chỉ con nhà gia thế mới biết khen con nhà gia thế", gọi quạ là "cổ chim công") và 3.4 nói ba kẻ "đã hội tụ" — mạch đó nghiêng về lời mời ("hãy đến đây"); kho không có chú giải, không có đoạn song song `pariyāhi`, nên chưa đủ căn cứ để đổi; người biên tập nên xem lại. Bổ sung: đã quét có hệ thống Pāli trùng toàn kho cho mọi khoá; 1.3–1.4 khớp nguyên văn ja308:1.3–1.4, 2.1–2.2 khớp ja294:2.1–2.2 (chỉ khác 'biết cách'/'biết'), không lệch nghĩa.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ"); C4 — `1.1` (xưng hô trong lời thoại ngắn: một cặp duy nhất, bỏ "trẫm").
