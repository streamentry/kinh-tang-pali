notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất 34 ký tự nên `cần` rỗng. Tự quét
  9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu lược khớp, nháy kép cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 2.1 (dòng chốt, Sujato để trống
  ở mọi bài Jātaka).

  KHUON TIÊU ĐỐ: Jātaka, Bộ Một Bài Kinh, Kinh <tên> thứ tám. `Varuṇavagga` → *Phẩm Cây
  Varuṇa* dùng lại nguyên văn (6 lượt ngoài lát, gồm ja79 cùng phẩm). `Illisa` giữ chữ Pāli
  theo tiền lệ của tầng với tên riêng (ja82, ja97, ja106, ja107).

  SAU CHỮ KHÔNG DỊCH RO. `khañjā` → *khập khiễu* (1 lượt, chính bài này; có thể *khập khiễu*
  là của cả người lẫn vật), `kuṇī` → *có u* (`kuṇa` là chỗ lồi/ u trên thân, 0 lượt — bản nháp
  tôi viết *lưng có u*, tức thêm chữ *lưng* không có trong Pāli, đã sửa), `visamacakkhukā` → *mắt
  lệch nhau*, `piḷakā` → *mụn nhọt* (9 lượt).

  `nāhaṁ passāmi illisan` tôi dịc *ta không phân biệt nổi ai là Illisa*: `nāhaṁ` là phủ định
  thì hiện tại của *ta*, và `illisan` là tên riêng ở dạng tân ngữ; tôi giữ cả hai vì bỏ tên
  riêng thì mất điểm của câu kệ. Đây là câu mà người đọc bị ngang nhiên nhất trong bài, nên tôi
  ghi rõ để biên tập xem cần chú thích tên Illisa hay không.
