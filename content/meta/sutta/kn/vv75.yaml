notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho vv75.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 25 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.
  Lượt cải thiện 2026-10-11 (Kiểm toán độc lập; thay điểm của lượt chấm 2026-10-03): đọc đối kháng 25 khoá Pāli↔Việt, sửa 10 khoá, không có số Pāli nào trong bài.
  1.1–1.2: vanaṁ cittalataṁ là "khu rừng" (không phải uyyāna), nên "ngự uyển Cittalatā" đổi thành "rừng Cittalatā"; uyyānaseṭṭhaṁ tidasānamuttamaṁ là đồng vị "khu vườn tối thắng, tối thượng của chư thiên Tam Thập Tam", trước chỉ có "vườn cây tối thượng" (bỏ mất seṭṭha); bỏ "rực rỡ" thêm vào pabhāsati.
  2.1: anubhāva trong cùng một khổ dịch hai cách ("uy thế lớn lao" ở 2.1, "oai lực" ở 2.3); nay mahānubhāvo là "đại oai lực", đúng cách dịch anubhāva ở 2.3 và 5.x.
  3.1: "hoan hỷ lòng" là trật tự lạ, attamano là "lòng hoan hỷ"; nay "lòng hoan hỷ". 3.3: yassa kammassidaṁ phalaṁ là mệnh đề quan hệ, không phải câu khẳng định "quả báo của nghiệp này là thế"; nay "về nghiệp mà đây là quả báo", cùng dạng đã được kiểm toán ở vv54, vv56, vv57, vv78, vv79.
  4.1: bỏ "Khi xưa" và "làm thân phận con người" (Pāli chỉ có ahaṁ manussesu manussabhūto, thì quá khứ đã ở ahosiṁ); nay "Khi tôi còn làm người giữa loài người", cách dịch phổ biến trong họ. 4.2: trật tự theo Pāli (daliddo atāṇo kapaṇo kammakaro): "người làm thuê, nghèo túng, không nơi nương tựa, khốn khổ", bỏ sắc thái "kẻ".
  4.4: Piyā ca me sīlavanto ahesuṁ là "những người có giới là thân thương đối với tôi"; bản cũ thêm "kính" và "bậc"; nay "những người có giới đức đã là thân thương đối với tôi". 4.5–4.6: cũ có hai động từ ("dâng cúng", "bố thí") cho một động từ adāsiṁ và thêm "dồi dào" ngoài vipulaṁ; nay "Với cơm ăn và nước uống, cùng tâm tịnh tín, / tôi đã cung kính bố thí rộng rãi", khớp vv73.
  Điểm đổi: grammar_logic 9.3 → 9.4 (3.3 và 4.5–4.6 sửa cú pháp); vietnamese_clarity 9.3 → 9.4 (3.1, 4.1, 4.2); semantic_fidelity 9.3 → 9.2 và terminology 9.2 → 9.0 và ambiguity_integrity 9.2 → 9.0: dù 3.3, 4.4 đã sửa, lượt chấm trước chưa nêu hai điều còn nguyên dưới đây; các tiêu chí khác giữ. final_score 9.23 → 9.2.
  Còn lại 1: 0.2 Purisavimāna đang dịch "Chuyện Cung Điện Nam Hư Không" nhưng Pāli không có ākāsa; lỗi lặp ở cả bộ nên giữ nguyên ở bài này để khỏi lệch họ, cần sửa đồng loạt ở cấp bộ (khi đổi thì sửa luôn translationTitle nếu cần).
  Còn lại 2: antalikkhe (1.4) dịch "giữa hư không" (6/6 khoá trùng Pāli trong họ) và tiṭṭhati dịch "lơ lửng" (có thể là "đứng/hiện hữu") là cách hiểu theo tiền lệ, chưa có bản đối chiếu độc lập để phân xử; giữ. Khoá 3.2 và 5.2 là …pe… (một dấu "…"), 3.1–3.3 chỉ đọc được trọn nghĩa nhờ công thức đầy đủ ở các bài họ; không đoán thêm vào thân kinh.
  Phép kiểm: 25/25 khoá Pāli có Việt, nháy và ngoặc kép khớp Pāli từng khoá, 0 cặp Pāli trùng nguyên văn trong chính bài (phép chạy rỗng), …pe… → một "…", không có Pāli lọt sang Việt, NFC.
  technical_integrity giữ 9.6, không chạy gate: `npm run validate`, `npm test`, `npm run check`, `npm run build` do coordinator chạy.

  Quyết định hội đồng biên tập 2026-10-16: A13 — 2.4 (bỏ dấu chấm thừa sau dấu kết lời thoại (`?”.`/`.”.` thành `?”`/`.”`)).
