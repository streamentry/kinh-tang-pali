  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC. `“Kallosi, bhante nāgasenā”ti.` có **32 bài** đã
    dùng đúng một nguyên văn *“Khéo lắm, thưa tôn giả Nāgasenā.”* và `TIEN_LE_PHAI.md` ghi cặp
    `mil3.5.6:2.1 == mil3.6.6:2.1`; tôi dùng lại y nguyên. `Vicāravagga` → *Phẩm Khảo Sát*
    (4 bài so với 1) · `Arūpadhammavavatthānavagga` → *Phẩm Xác Định Pháp Vô Sắc* (7 bài, toàn
    bộ đồng thuận) · `bhante nāgasena` → *Thưa tôn giả Nāgasena* (đồng thuận toàn bộ bài mil đã
    có) · `mahārāja` → *Đại vương* · `Āma` → *Vâng* (5 bài) · `Thero āha` → *Trưởng lão nói—
    theo `mil3.5.6:1.3` và `mil3.7.12:1.3` · `Rājā āha—` → *Vua nói—* (4 bài có dấu gạch dài,
    và Pāli của bài này mang `—`) · `Opammaṁ karohī` → *Hãy xét một thí dụ* (đa số 3 bài) ·
    `purimā koṭī na paññāyati` → *quá khứ không thể tính được* theo `mil3.3.1:1.5`
    (*không thể tính được*) · `avijjā` → *vô minh* · `sabbena sabbaṁ sabbathā sabbaṁ` → *toàn
    bộ, tất cả, mọi phương diện, hết thảy* (bốn từ tăng cường, giữ đủ bốn) ·
    `khandhā` → *uẩn* theo `dn10` và `dn22` · `bījānī` → *hạt giống* · `yojana` → *do-tuần*
    (4 bài dn đã có) · `ubhato chinnaṁ` → *đứt ở cả hai đầu*.

  0 tiền lệ, đặt mới có lý do: `Koṭipaññāyanapañha` → *Câu hỏi về gốc rễ của trí tuệ* theo
    đúng khuôn của `mil3.3.1:0.3` (*Câu hỏi về gốc rễ của thời gian*, `Addhānamūlapañha`);
    `paṭivigacchati` → *diệt*; `sakkā vaḍḍhetun` → *có thể cắt đứt* theo `dn10:2.24` và
    `mn77:30` (*thứ cần phải cắt đứt*).

  BẤT ĐỊNH ĐÃ PHÂN XỬ. `mil3.3.3:1.7` (`esā purimā koṭi na paññāyati, yaṁ ahutvā sambhoti,
    hutvā paṭivigacchati, esā purimā koṭi paññāyatī`) nói hai vế về *cùng một* quá khứ mà
    vừa *không tính được* vừa *tính được*, và mệnh đề quan hệ trung gian rất khó. Tôi giữ cả
    hai vế và dịch vế quan hệ thành hai mệnh đề đứng riêng (*quá khứ này không thể tính được,
    cái chưa tồn tại thì sinh, cái đã tồn tại thì diệt; còn quá khứ này thì có thể tính
    được*) — không thêm từ giải thích nào, không đoán mối liên hệ. Người biên tập nên đối
    chiếu lại với bản in PTS của Luṇṇāva; đây là chỗ đáng xem nhất của bài.
  REVIEW ĐỐI KHÁNG. Tôi in lại Pāli ↔ Việt từng cặp và đọc lại với mục tiêu tìm lỗi.
  Lỗi đã bắt được và đã sửa trước khi ghi lần cuối: 
  **(1)** `mil3.3.3:1.2` bản nháp dịch `katamā` là *bao nhiêu*; ở đây câu hỏi
      là *cái quá khứ ấy là gì* (câu trả lới `1.3` mang tính mệnh lề) — đã sửa. **(2)**
      `mil3.3.3:2.3` bản nháp có thêm *cả hai đầu* trong khi Pāli chỉ có `sāpi sakkā
      vaḍḍhetun`; đã sửa thành *nó cũng có thể cắt đứt*. **(3)** `mil3.3.3:1.7` bản nháp dịch
      `sabbena sabbaṁ sabbathā sabbaṁ` thành ba vế; Pāli có bốn từ tăng cường, đã viết đủ
      bốn vế.

  Giải quyết draft 2026-10-12. Mục này THAY THẾ các mục cũ ở trên về nghĩa của bài (đặc biệt "DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ", "BẤT ĐỊNH ĐÃ PHÂN XỬ" và "REVIEW ĐỐI KHÁNG" — các mục đó dựa trên cách đọc sai `koṭi`, `paññāyati`, `vaḍḍhetuṁ`); các mục về kỹ thuật, coverage và tầng Việt hiện hành vẫn đúng.
  LỖI NGHĨA THẬT: 14/19 khoá đã sửa (0.3, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 2.1, 2.2, 2.3, 2.4, 3.1, 3.2, 5.1); 2.5 và các khoá còn lại giữ nguyên. Gốc lỗi: (1) `koṭi` (điểm, đầu mút, khởi điểm) bị đọc thành "quá khứ" và `paññāyati` ("được nhận biết, hiện rõ") thành "tính được"; (2) `paññāyana` trong tên bài bị đọc thành `paññā` nên tiêu đề thành "gốc rễ của trí tuệ" — nay là "Câu hỏi về việc nhận biết khởi điểm" (0.3, 5.1, translationTitle); (3) `vaḍḍhetuṁ` ("làm cho tăng trưởng") bị dịch thành "cắt đứt"; (4) `bhante` ở 2.4 là gọi Nāgasena mà bị dịch "Bạch Thế Tôn"; (5) 1.7: `avijjā nāhosi` ("vô minh đã không có") bị đọc thành "chỉ là vô minh" và mệnh đề `yaṁ ahutvā sambhoti, hutvā paṭivigacchati` bị gắn nhầm vào vế "không nhận biết được" — nay là hai vế đối nhau: khởi điểm mà "vô minh hoàn toàn đã không có" thì không được nhận biết; khởi điểm của cái chưa có mà sinh khởi, có rồi thì biến mất thì được nhận biết; (6) 3.2: bỏ "ấy" không có trong Pāli, `ca` giữ là "và", chủ thể `thero` đưa thí dụ cho vua (`tassa`).
  TIỀN LỆ (đã đo): `koṭi` → "khởi điểm" theo `sn15.1:1.8` ("Khởi điểm không được biết đến", 2 khoá cùng công thức) và gần với `mil3.3.2` ("điểm khởi đầu đầu tiên"); `ito pubbe` → "trước đây" (10 khoá dn/mn, đa số); `sabbena sabbaṁ sabbathā sabbaṁ` → "hoàn toàn, về mọi phương diện" (`dn15:4.2`, `mn54:14.2`; mỗi cặp `sabbena sabbaṁ`/`sabbathā sabbaṁ` là một từ tăng cường, bản cũ chép bốn vế là thừa); `Opammaṁ karohī` → "Xin hãy xét một thí dụ" (đa số 19/21 khoá mil3.1–3.2 trở đi); `Kallosi, bhante nāgasenā` giữ nguyên văn bản các bài cùng loạt; `atthaṁ gacchati`/`abbhatthaṁ gacchanti` → "đi đến hoại diệt/biến hoại"; người hỏi xưng "con" (14 khoá so với "tôi" 6 khoá trong mil). Lưu ý các bài lân cận không nhất quán với nhau: `mil3.3.1:1.5` dịch "phần đầu của thời gian, không thể tính được" và `mil3.3.2` "không thể tìm thấy" — ngoài phạm vi lượt này, nên đồng bộ sang "không được nhận biết" khi có dịp.
  BLOCKER ĐÃ GỠ: "Coverage English dưới ngưỡng 0,8… reference-gaps chưa có mục" — không phải lỗi văn bản; theo kho, mất mát chỉ cần được ghi nhận trong tệp gap do công cụ sinh. Sujato trống toàn bộ 10/10 khoá có nội dung (vì không phát hành bài này), tôi đã đọc đối kháng từng khoá trực tiếp từ Pāli. BLOCKER GIỮ: thiếu bản Anh upstream (sự thật về bản chụp đã ghim; do waiver của người biên tập xử lý).
  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không đưa vào thân kinh): (a) 1.7 — cách đọc hai vế theo `ito pubbe … avijjā nāhosīti` và mệnh đề liên hệ `yaṁ … esā purimā koṭi paññāyati` là cách đọc hợp ngữ pháp nhất nhưng không có bản Anh hay Việt đã pin để đối chứng; (b) 2.2–2.5 — chủ ngữ giống cái `ubhato chinnā`/`sā` có thể là `koṭi` hoặc cái được nói đến, giữ trung tính "cái ấy"; 2.3 và 2.4 đều là lời vua, trong khi Pāli không có dòng người nói xen giữa; (c) 3.2 — `ca` ở `khandhā ca` giữ là "và"; có thể là "cũng". `triangulation` chấm 6,0 (≤ 8,0 vì thiếu bản Anh độc lập và thiếu tầng Việt hiện hành). Bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy trong lượt này nên `technical_integrity` giữ 9,6.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 0 khoá bất đồng nghĩa → sửa 0, giữ 0, bất định 0. Cả 19 khoá được so từng chỗ: số lượng, phủ định, điều kiện `yadi … ubhato chinnaṁ` ở 2.1–2.5, người nói ở 1.1–1.7 và kết luận về các uẩn ở 3.2 đều khớp. Chỉ có khác biệt thuật ngữ không đổi nghĩa: `koṭi` (khởi điểm so với điểm mốc), `bījāni` (hạt giống so với mầm mống), `addhā` (thời gian so với hành trình) ở 1.3. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
