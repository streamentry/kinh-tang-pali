  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC. `“Kallosi, bhante nāgasenā”ti.` có **32 bài** đã
    dùng đúng một nguyên văn *“Khéo lắm, thưa tôn giả Nāgasenā.”* và `TIEN_LE_PHAI.md` ghi cặp
    `mil3.5.6:2.1 == mil3.6.6:2.1`; tôi dùng lại y nguyên. `Vicāravagga` → *Phẩm Khảo Sát*
    (4 bài so với 1) · `Arūpadhammavavatthānavagga` → *Phẩm Xác Định Pháp Vô Sắc* (7 bài, toàn
    bộ đồng thuận) · `bhante nāgasena` → *Thưa tôn giả Nāgasena* (đồng thuận toàn bộ bài mil đã
    có) · `mahārāja` → *Đại vương* · `Āma` → *Vâng* (5 bài) · `Thero āha` → *Trưởng lão nói—
    theo `mil3.5.6:1.3` và `mil3.7.12:1.3` · `Rājā āha—` → *Vua nói—* (4 bài có dấu gạch dài,
    và Pāli của bài này mang `—`) · `Opammaṁ karohī` → *Hãy xét một thí dụ* (đa số 3 bài) ·
    `purimā koṭī na paññāyati` → *quá khứ không thể tính được* theo `mil3.3.1:1.5`
    (*không thể tính được*) · `avijjā` → *vô minh* · `sabbena sabbaṁ sabbathā sabbaṁ` → *toàn
    bộ, tất cả, mọi phương diện, hết thảy* (bốn từ tăng cường, giữ đủ bốn) ·
    `khandhā` → *uẩn* theo `dn10` và `dn22` · `bījānī` → *hạt giống* · `yojana` → *do-tuần*
    (4 bài dn đã có) · `ubhato chinnaṁ` → *đứt ở cả hai đầu*.

  0 tiền lệ, đặt mới có lý do: `Koṭipaññāyanapañha` → *Câu hỏi về gốc rễ của trí tuệ* theo
    đúng khuôn của `mil3.3.1:0.3` (*Câu hỏi về gốc rễ của thời gian*, `Addhānamūlapañha`);
    `paṭivigacchati` → *diệt*; `sakkā vaḍḍhetun` → *có thể cắt đứt* theo `dn10:2.24` và
    `mn77:30` (*thứ cần phải cắt đứt*).

  BẤT ĐỊNH ĐÃ PHÂN XỬ. `mil3.3.3:1.7` (`esā purimā koṭi na paññāyati, yaṁ ahutvā sambhoti,
    hutvā paṭivigacchati, esā purimā koṭi paññāyatī`) nói hai vế về *cùng một* quá khứ mà
    vừa *không tính được* vừa *tính được*, và mệnh đề quan hệ trung gian rất khó. Tôi giữ cả
    hai vế và dịch vế quan hệ thành hai mệnh đề đứng riêng (*quá khứ này không thể tính được,
    cái chưa tồn tại thì sinh, cái đã tồn tại thì diệt; còn quá khứ này thì có thể tính
    được*) — không thêm từ giải thích nào, không đoán mối liên hệ. Người biên tập nên đối
    chiếu lại với bản in PTS của Luṇṇāva; đây là chỗ đáng xem nhất của bài.
  REVIEW ĐỐI KHÁNG. Tôi in lại Pāli ↔ Việt từng cặp và đọc lại với mục tiêu tìm lỗi.
  Lỗi đã bắt được và đã sửa trước khi ghi lần cuối: 
  **(1)** `mil3.3.3:1.2` bản nháp dịch `katamā` là *bao nhiêu*; ở đây câu hỏi
      là *cái quá khứ ấy là gì* (câu trả lới `1.3` mang tính mệnh lề) — đã sửa. **(2)**
      `mil3.3.3:2.3` bản nháp có thêm *cả hai đầu* trong khi Pāli chỉ có `sāpi sakkā
      vaḍḍhetun`; đã sửa thành *nó cũng có thể cắt đứt*. **(3)** `mil3.3.3:1.7` bản nháp dịch
      `sabbena sabbaṁ sabbathā sabbaṁ` thành ba vế; Pāli có bốn từ tăng cường, đã viết đủ
      bốn vế.
