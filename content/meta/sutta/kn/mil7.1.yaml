notes: |-
  Đợt 19, làn 84. Dịch từ Pāli root commit đã ghim, đủ 118/118 khoá (đều là khoá mới), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Đã đọc hết Pāli của bài trước khi viết.

  **Bài này là gì.** `mil7.1` là Mātikā (bản liệt kê) của phần Opammakathāpañha, không phải một cuộc hỏi đáp: một câu hỏi của vua (`1.1`), câu mở lời của Trưởng lão (`2.1`), rồi 105 dòng, mỗi dòng nêu một vật hay một người kèm số phần cần nắm lấy, xếp thành bảy phẩm (dòng kết phẩm ở `13.1`, `24.1`, `35.1`, `46.1`, `57.1`, `68.1`, `76.1`), và dòng kết bài `115.1`. Ba mươi tám dòng cuối (`77.1`–`114.1`) nằm sau dòng kết phẩm thứ bảy và Pāli không đóng phẩm nào nữa.
  Cấu trúc câu: `2.1` kết bằng dấu gạch dài và mở dấu ngoặc kép; mọi dòng `3.1`–`114.1` tiếp nối câu ấy với chủ ngữ là vị tỳ-kheo muốn chứng đạt A-la-hán, nên dịch thành `phải nắm lấy N phần của X.`; dấu ngoặc kép đóng ở `114.1` (Pāli `”ti`). Nháy khớp Pāli từng khoá: 2 mở và 2 đóng trên cả bài (mở ở `1.1`, `2.1`; đóng ở `1.1`, `114.1`).

  **Số Pāli, đã tự tính từng dòng.** `ekaṁ` 1, `dve` 2, `tīṇi` 3, `cattāri` 4, `pañca` 5, `satta` 7. Trong 105 dòng: 34 dòng một phần, 34 dòng hai phần, 17 dòng ba phần, 5 dòng bốn phần, 13 dòng năm phần, 2 dòng bảy phần (mặt trời `32.1`, sư tử `47.1`); tổng 34 + 68 + 51 + 20 + 65 + 14 = **252** phần. Kiểm chéo với 67 bài giải đã có (`mil7.2.1`–`mil7.2.10`, `mil7.3.x`–`mil7.7.10`, `mil7.8.1`–`mil7.8.7`, ứng đúng 67 dòng đầu `3.1`–`75.1` theo thứ tự): số trong Mātikā bằng số trong câu hỏi `1.1` của bài tương ứng ở **67/67**, và ở 66/67 bài còn bằng số dòng `Idaṁ, mahārāja, … aṅgaṁ gahetabbaṁ`; ngoại lệ là `mil7.3.8` (người hoa tiêu), chỉ có hai dòng như vậy vì chi phần thứ ba nằm ở khoá `4.2` viết thường (`idaṁ, mahārāja, niyāmakassa tatiyaṁ …`), Mātikā vẫn đúng ba. Ba mươi tám dòng `77.1`–`114.1` không có bài giải nào trong snapshot đã ghim (bài giải cuối cùng là `mil7.8.7`), nên số của chúng không kiểm chéo được và chỉ đọc từ chính dòng Pāli.

  **Tiêu đề và khung.** `0.1` giữ `Milindapañha` như mọi bài `mil`. `0.2` “7. Câu hỏi về cách dùng dẫn với ví dụ”: dùng đúng cách 43 trên 67 khoá `:0.2` của `mil7.x` (các cách khác: “Câu Hỏi Về Ví Dụ” 9, giữ chữ Pāli 8, “Những Câu Hỏi Về Ví Dụ” 4, “Các Câu Hỏi Dùng Thí Dụ” 2, “Những Câu Hỏi Về Các Tỷ Dụ” 1); giữ số `7` đầu dòng theo Pāli (Pāli viết `7` không chấm, bản Việt thêm chấm theo `mil1:0.2`, `mil3.1.x:0.3`). `0.3` `Mātikā` → “Mẫu Đề”, `115.1` `Mātikā niṭṭhitā` → “Mẫu đề đã hoàn tất.”: dùng lại `ps1.0:0.3` (“1.0. Mẫu Đề”) và nguyên văn `ps1.0:74.4` (1/1 tiền lệ, cùng chữ `Mātikā`); ở `ps1.0` mātikā là bản liệt kê các nhóm pháp, ở đây là bản liệt kê các so sánh, cùng nghĩa “bảng đề mục”. Dòng kết phẩm dịch “Phẩm X, thứ N.” theo 20 trên 22 dòng kết phẩm cùng kiểu trong `mil3`–`mil7` (hai dòng còn lại: `mil5.1.10` “Phẩm Thần Lực, phẩm thứ nhất.”, `mil7.6.10` “Phẩm Sư Tử là phẩm thứ năm.”). Tên phẩm: `Gadrabhavagga` “Phẩm Con Lừa” (xem bất định 2), `Samuddavagga` “Phẩm Biển” (7/10 tệp `mil7.3.x`; “Biển Cả” 3), `Pathavīvagga` “Phẩm Đất” (7/10 tệp `mil7.4.x`; “Đất Đai” 1, giữ chữ Pāli 2), `Upacikāvagga` “Phẩm Con Mối” (7/10 tệp `mil7.5.x`; “Phẩm Upacikā” 2, giữ chữ Pāli 1), `Sīhavagga` “Phẩm Sư Tử” (10/10), `Kumbhavagga` “Phẩm Bình Vò” (6/7 tệp `mil7.8.x`; 1 tệp giữ chữ Pāli). `Makkaṭavagga` xem bất định 1.

  **Trùng nguyên văn.** Trong chính bài: **0** nhóm Pāli trùng nhau (118 khoá, so sau khi bỏ dấu câu và chữ hoa) ⇒ phép dò trùng nội bộ chạy rỗng, không có gì để lệch. Với phần còn lại của tầng Việt (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 8 khoá có Pāli trùng với khoá đã dịch ở bài khác, tổng **245** cặp: `0.1` (238 cặp; 226 cặp Việt là `Milindapañha` giống bản tôi, 12 cặp khác: “Mi-lan-đà Vấn Đạo” 8, “Mi-tiên Vấn Đáp” 3, một cặp thừa khoảng trắng cuối), sáu dòng kết phẩm `13.1`, `24.1`, `35.1`, `46.1`, `57.1`, `76.1` (mỗi dòng 1 cặp, ở dòng cuối của `mil7.2.10`, `mil7.3.10`, `mil7.4.10`, `mil7.5.10`, `mil7.6.10`, `mil7.8.7`) và `115.1` (1 cặp, `ps1.0:74.4`). Dùng lại đúng nguyên văn bản Việt của tiền lệ ở 6 khoá: `0.1`, `13.1`, `24.1`, `35.1`, `76.1`, `115.1`. **Cố ý khác** 2 cặp: `46.1` “Phẩm Con Mối, thứ tư.” (`mil7.5.10:8.1` viết “Phẩm Upacikā, thứ tư.”; chọn tên theo đa số 7/10 của chính phẩm ấy) và `57.1` “Phẩm Sư Tử, thứ năm.” (`mil7.6.10:5.1` viết “Phẩm Sư Tử là phẩm thứ năm.”; chọn khuôn 20/22 của các dòng kết phẩm). Các dòng danh mục `3.1`–`114.1` (trừ dòng kết phẩm) và `1.1`, `2.1` không trùng nguyên văn với khoá nào đã dịch.

  **Thuật ngữ, có số đếm.**
  - `aṅga` → “phần” (trong 249 khoá `mil7.x` nhắc `aṅga`: “phần” 120, “chi phần” 64, “đức tính” 54, “bộ phận” 2; 9 khoá không có từ nào trong bốn từ); `gahetabba` → “nắm lấy” (cùng toàn bộ `mil7.2`–`mil7.8`: “cần phải nắm lấy” / “phải nắm lấy”, một số bài dùng “học tập”); câu hỏi `1.1` giữ “đầy đủ” cho `samannāgato` (tiền lệ “đầy đủ sáu pháp” ở `an6.83`) và “chứng đạt A-la-hán” cho `arahattaṁ sacchikarotī` (`an6.66`, `an5.257-263`: nhiều chỗ “chứng đạt A-la-hán”).
  - Xưng hô: `Bhante nāgasena` → “Thưa tôn giả Nāgasena” (trong `mil7.x`: 40 trên 67 khoá mở lời kiểu này; “Bạch ngài” 15, “Thưa Đại đức” 6, “Bạch đại đức” 5, “Thưa ngài” 1; toàn `mil`: 87 trên 196, dạng đa số cả hai phạm vi). `mahārāja` ở `2.1` → “Này Đại vương” (trong khoá `mil7.x` có `mahārāja`: “này/Này Đại vương” 248 + 55 = 303, “Tâu/tâu đại vương” 120, “Thưa/thưa đại vương” 62, phần còn lại không có từ xưng hô ở bản Việt).
  - Tên vật theo Pāli (đo trên tầng Việt hiện có, ngoài `mil7.x`): `gadrabha` “con lừa” (`ja111`, 2 khoá; **khác** `mil7.2.1`–`mil7.2.10` đang viết “con sóc”, xem bất định 2); `kalandaka` “con sóc” (83 khoá chứa `kalandak-`, ví dụ `ud1.6:1.2` `kalandakanivāpe` “nơi nuôi dưỡng sóc”); `kumma` “con rùa” (22 khoá chứa `kummo`/`kummaṁ`, ví dụ `mn23:2.24`, `mn23:2.25`); `vāyasa` “con quạ” (`ja147`; **khác** `mil7.2.9` “chiếc thuyền”); `makkaṭa` “con khỉ” (43 khoá chứa `makkaṭ-`, ví dụ `ja173`, `cp10:2.1`); `varāha` “con lợn rừng” (`cp33:2.3`, `thag1.17:1.3`); `khagga` đứng một mình “gươm” (9 khoá không kèm `visāṇa`: `cp19`, `ja333`, `mn89`…); `agada` “thuốc giải độc” (`mil5.3.4`; “thuốc men” ở `mil7.8.5`, `mil5.1.5` “thuốc giải”); `dovārika` “người giữ cửa” (`dn28:2.4`); `usabha` “bò đực” (`snp1.2`, `snp3.1`); `kassaka` “người nông dân” (`snp1.4`, `snp3.9`); `tunnavāya` “thợ may” (`pv25:23.3`); `dabbī` “cái muỗng” (`dhp64`); `bhamara` “ong” (`dhp49`, `pv47`); `tacchaka` “thợ mộc” (`mil5.3.2`); `māgavika` “thợ săn” (`dn26:20.7`, `sn19.6`); `bāḷisika`/`baḷisa` “lưỡi câu” (`ja387`, `ja470`, `ja472`) ⇒ “người câu cá”; `tikicchaka` “thầy thuốc” (`mil5.3.4` “bác sĩ”; chọn “thầy thuốc” cùng `mn101` `bhisakko`); `gabbhinī` “người đàn bà có thai” (`ud2.6`); `cora` “kẻ trộm” (`snp1.7`, `mil5.3.11`); `nāvika` “người lái đò” (`ja376`); `soṇḍika` “người nấu rượu” (`sn4.6`, `mn35`); `indakhīla` “cột trụ Inda” (trong 10 khoá chứa `indakhīl-`: “Inda” 5 như `dn20:3.15`, `thag14.2:5.3`; “Indra” 1 `kp6:8.1`; “Đế Thích” 1 `snp2.1:8.1`; 3 khoá chỉ nói “cột trụ”/“cột cửa”); `mayūra`/`mora` “con công” (`ja159`, `ja202`); `ulūka` “con cú” (`ja270`); `ajagara` “con trăn” (`tha-ap423`; “con rắn Ajagara” ở `tha-ap86`); `biḷāra` “mèo” (`ja128`: “Hạnh Mèo”; **khác** `mil7.5.2` “con nhện”); `nakula` (xem bất định 3).
  - `Sakka` “trời Đế Thích” (như `mil7.4.9`); `cakkavatti` “vua Chuyển Luân” (như `mil7.4.10`); `niyāmaka` “người hoa tiêu” (như `mil7.3.8`); `kammakāra` “người làm công” (`mil7.3.9` “kẻ làm công”; đổi “kẻ” thành “người” cho cùng giọng với các nghề khác trong danh sách); `issāsa` “cung thủ” (`mil7.8.7`); `chatta` “chiếc lọng” (`mil5.1.4:5.3` “người giữ lọng”); `sīha` “con sư tử”, `hatthi` “con voi”.
  - `Cakkavāka` giữ chữ Pāli (“chim cakkavāka”): `ja434` dịch “vịt trời”, `mil7.6.2` “chim uyên ương Cakkavāka”; hai cách khác nhau và không cách nào chắc, nên giữ chữ Pāli kèm “chim”, như tên `Kinh Cakkavāka`.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `68.1` `Makkaṭavaggo`: tên phẩm; `makkaṭa` là “khỉ” (`12.1` Makkaṭassa là con khỉ) nhưng cũng là “nhện” (dạng `makkaṭaka`), và dòng đầu của phẩm là `Panthamakkaṭaka` (con nhện ở đường: bài giải `mil7.7.1` nói về `makkaṭajālavitāna`, tức lưới nhện). Phẩm anh em ở tầng đang có 4 cách khác nhau (`mil7.7.x`: “Phẩm Kẻ Nhắc Nhở” 6, “Phẩm Nhện” 2, “Phẩm Con Khỉ” 1, giữ chữ Pāli 1). Không phân xử được, nên giữ “Phẩm Makkaṭa”. Người điều phối cần chốt một cách cho cả `mil7.7.x`.
  2. `3.1` `Gadrabha` và `13.1` `Gadrabhavaggo`: **cố ý lệch** các tệp `mil7.2.1`–`mil7.2.10` (đang viết “Phẩm Con Sóc” và “con sóc” cho `gadrabha`). `gadrabha` là con lừa (`ja111:1.4` `assatarassa hi gadrabho pitā` “cha của con la là con lừa”); ngữ cảnh bài giải `mil7.2.1:1.2` (nằm ở đống rác, ngã tư, cổng làng, đống rơm; không ngủ nhiều) là con lừa, còn con sóc là `kalandaka` ở dòng `5.1` và `mil7.2.3`. Không sửa tệp ngoài lát; cần gộp: hoặc sửa 10 tệp `mil7.2.x` về “con lừa”/“Phẩm Con Lừa”, hoặc đổi tệp này.
  3. Ba dòng cũng lệch tầng vì bản tầng sai nghĩa theo từ điển và theo bài giải: `37.1` `Biḷāra` “con mèo” (`mil7.5.2` “con nhện”; bài giải nói con vật ấy tìm bắt chuột `undūra`), `40.1` `Nakula` “con cầy mangut” (`mil7.5.5` “chồn hôi”; bài giải nói nó tiến tới con rắn `uraga` sau khi tẩm thuốc lên thân: đó là cầy mangut; `ja165` dịch “chồn hương”), `11.1` `Vāyasa` “con quạ” (`mil7.2.9` “chiếc thuyền”). Các bài giải trên cũng đang dịch `kūpa`, `kāḷāyasa`, `nāvālagganaka`, `satapatta`, `cakkavāka`, `peṇāhikā` bằng nghĩa khác (xem mục sau); tôi chỉ ghi lệch, không sửa tệp ngoài lát.
  4. `19.1` `Nāvālagganaka` → “neo thuyền”: bài giải `mil7.3.6:1.2` nói nó giữ thuyền đứng yên giữa biển lớn, không để trôi, kể cả ở chỗ nước sâu trăm tay (`hatthasatepi udake`); đó là neo. `mil7.3.6` đang viết “bến thuyền”. `20.1` `Kūpa` → “cột buồm”: bài giải `mil7.3.7:1.2` nói `kūpo rajjuñca varattañca laṅkārañca dhāreti`, và dòng đứng giữa các mục về thuyền (`nāvā`, `nāvālagganaka`, `niyāmaka`, `kammakāra`, `samudda`); `mil7.3.7` đang viết “cái giếng”. Nghĩa “cột buồm” là cách đọc theo ngữ cảnh (từ `kūpa` cũng là “giếng”); chưa được kiểm bằng nguồn thứ hai. `70.1` `Kāḷāyasa` → “sắt đen” (cấu tạo `kāḷa` + `ayasa`); `mil7.8.2` đang viết “ngựa đen”. `58.1` `Panthamakkaṭaka` → “con nhện ở đường” (bài giải `mil7.7.1:1.2` làm lưới trên đường).
  5. Giữ chữ Pāli vì chưa xác định được vật, không bịa nghĩa: `48.1` `Cakkavāka` (xem trên), `49.1` `Peṇāhikā` (`mil7.6.3`: con vật ghen với bạn đời nên không nuôi con; 0 tiền lệ trong tầng; tôi chỉ thêm “chim”, vì dòng nằm giữa các loài chim của `Sīhavagga`), `52.1` `Satapatta` (“chim satapatta”; `ja279` dịch “bảy lá”, `mil7.6.6` “con sếu”, hai cách không khớp nhau và không khớp bài giải), `60.1` `Cittakadharakumma` (“con rùa cittakadhara”: `kumma` chắc là rùa, `cittakadhara` không xác định; `mil7.7.3` đang viết “con khỉ cầm que đếm”, trái `kumma`), `101.1` `Kikī` (“chim kikī”; `kikī` ở `dn14`, `mn81` là tên vua Kāsi, nhưng dạng cái `Kikiyā` kèm số hai phần không hợp tên vua; 0 tiền lệ chim), `106.1` `Caṅgavāraka` (tên đồ vật; 0 tiền lệ), `111.1` `Bhojaka` (“người bhojaka”; Pāli nghĩa là người ăn / người hưởng / trưởng làng, không phân xử được trong dãy toàn là người làm nghề; 0 tiền lệ).
