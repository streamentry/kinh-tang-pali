notes: |-
  Tiền lệ đếm được: `sīla` → giới hạnh (349 tiền lệ); `anuttara` → tối thượng (934 tiền lệ); `alīnatā` → không buông lung (buông lung 145 tiền lệ); `ārogya` → sức khỏe (36 tiền lệ); `vuddhānumata` → được ca ngợi (2 tiền lệ, giữ sát chữ); `attha` → điều lành; `chaḷete` + `pamukhā` → mở toang (3 tiền lệ).
  Cowell 84 dịch bộ vế KHÁC (Seek Health, the supreme good; be virtuous; Hearken to elders; from the scriptures learn…) nhưng trùng ý. Bản Việt dịch đúng bộ vế ở Pāli root.
  `Alīnatā` ở 1.3 là danh từ trừu tượng (sự siêng không nới lỏng), không phải động từ; tôi giữ nghĩa phủ định của `alīna` thay vì đổi thành chăm chỉ, vì cách sau làm thay đổi vị thì của câu. `Ārogyamicche` là nguyện ngữ thứ hai (hãy cầu), nên cả 1.1 giữ hai vế cầu.
  `Sīlañca vuddhānumataṁ sutañca` là ba danh từ nối nhau (giới — được ca ngợi — sự học hỏi); tôi giữ đủ ba, không gộp hai vế sau thành một.
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. 0.1 Jātaka giữ nguyên (58 bài đã có) và 0.2 Ekakanipāta → Bộ Một Bài Kinh (57 bài) theo tiền lệ đếm được. 1.1 mở nháy kép, 1.4 đóng nháy kép + dấu chấm, không giữ `ti.` (tiền lệ 51/57 bài; 10 bài mới hơn cũng bỏ). Dòng kết 2.1 dùng dấu phẩy (Kinh X, thứ N) theo làn sóng gần nhất ja108…ja119; kho còn 48 bài không dấu phẩy — ghi ở đây để biên tập chuẩn hoá sau, tôi không sửa bài ngoài lát. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Chú giải Jātaka-aṭṭhakathā bằng Pāli không truy cập được trong môi trường dịch này, nên bối cảnh lấy từ truyện E. B. Cowell, The Jātaka vol. I (bản 1895, tải từ archive.org); đây là lý do triangulation không lên cao. technical_integrity 10.0 căn cứ chốt _hvi.py đã pass và tự chạy lại script kiểm bổ sung (9/9 khoá khớp Pāli, NFC, ngoặc kép cân trên cả bài, không lệch dấu lược); npm run validate|test|build không chạy theo lệnh cấm của lát.
  Sửa lan 2026-10-13: `Apāyimhavagga` — tên phẩm lấy từ vế đầu của `ja81:1.1`, mà `apāyimha` là thức aorist ngôi thứ nhất số nhiều có tiền tố `a-` (*chúng tôi đã uống*), cùng dạng với `agāyimha` (*chúng tôi đã hát*) và `anaccimha` (= `a-` + `naccimha`, *chúng tôi đã nhảy múa*); dạng phủ định phải là `na`/`nā`. Bản cũ đọc `a-` là phủ định (*Chưa Từng Uống*). Tiền lệ đo trên tầng: ở `kn` các động từ aorist ngôi 1 số nhiều có `a-` (`agamimha`, `adāsimha`, `apucchimha`, `akarimha`… 20+ khoá) đều dịch khẳng định. Khoá `ja84:0.3`: *Phẩm Chưa Từng Uống* → *Phẩm Chúng Tôi Đã Uống* (cùng tên ở `ja81`…`ja90`, một tên phẩm cho cả phẩm; `ja90:4.1` giữ `Apāyimha` là tên trong bài tóm lược, không đổi). Điểm không đổi; giữ nguyên các khoá còn lại.

  Kiểm toán 2026-10-15 (kiểm toán Jātaka chỉ có Pāli), Claude Sonnet 5.5 (Claude Code): Sửa 4/4 khoá kệ. Bản cũ "cửa ngõ của điều lành ấy thì mở toang" bỏ mất chaḷete (sáu điều này) và pamukhā (hàng đầu); vuddhānumataṁ là được bậc trưởng thượng tán đồng (bản cũ "được ca ngợi"); alīnatā (na + līna, DPD: không uể oải) bị dịch "không buông lung" (pamāda); paramañca lābhaṁ là túc từ thứ hai của icche, không phải "điều tối thượng" trống nghĩa. Chú giải (Jātaka bản Anh ancient-buddhist-texts.net) đếm sáu điều: sức khỏe, giới, sự tán đồng của bậc trưởng thượng, học rộng, thuận Pháp, không uể oải; tôi theo cách đọc Pāli của kệ. Không có bản Anh Sujato.

  Quyết định hội đồng biên tập 2026-10-16: C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
