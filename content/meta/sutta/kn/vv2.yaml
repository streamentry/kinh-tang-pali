  BẤT ĐỊNH 1.1: Pīṭhaṁ te veḷuriyamayaṁ uḷāraṁ trùng nguyên văn vv4:1.1, và bản Việt ở đó dùng Nền của ngươi, trong khi 2.1–3.4 cùng người nói (Moggallāna) về te lại dùng nàng. Ở đây dùng nàng ở CẢ 1.1 lẫn 2.x–3.x để bài không tự mâu thuẫn; đo được Do đâu nàng có được dung sắc như thế, ở 16 tệp so với 0 tệp dùng ngươi. GHI RÕ là lệch MỘT CHỮ với vv4:1.1, và vv4:1.1 có thể là nguồn của cách viết ngươi trong cả bộ.
  Cũng lưu ý ngay trong lời Moggallāna: taṁ devi (3.1) thành ngài còn te (2.x–3.x) thành nàng. Hai cách này kế thừa nguyên văn của vv1, vv3, vv4 — chưa gộp được, đề nghị coordinator chọn một dạng cho cả bộ.
  veḷuriya dịch ngọc lưu ly (đếm được 66 lần lưu ly, 26 lần ngọc lưu ly). sabbadisā xuất hiện ở HAI khoá trùng nguyên văn nhau (3.4 và 7.4) nhưng hai bản Việt đã có khác nhau: 3.4 dùng khắp muôn phương (10 bản khớp), 7.4 dùng khắp mọi phương (15 bản khớp). Theo khuôn hiện hữu để không tự tạo biến thể thứ N+1, nhưng đây là chỗ nên gộp.
  Nháy kép: cặp thứ nhất mở ở 1.1 và đóng ở 3.4 (lời hỏi của Tôn giả Moggallāna), cặp thứ hai mở ở 5.1 và đóng ở 7.4 (lời đáp của nữ thiên). Cân trên cả bài, khớp đúng Pāli. 3.4 kết bằng dấu hỏi rồi dấu ngoặc kép, theo 10 bản khớp (vv1:4.4, vv3:3.4).
  Tầng vietnamese-current (Hòa thượng Thích Minh Châu) CŨNG VẮNG, đo bằng resolveLayer chứ không suy: present = false, segments = {}, tệp không có trên đĩa. Đây là đặc điểm của snapshot upstream, không phải thiếu sót của repo.
  Cổng kỹ thuật CHƯA chạy — lát này bị cấm chạy npm. technical_integrity 9.6 vì chưa tự chạy: npm run validate, npm test, npm run check (bài draft nên chưa cần npm run build).
  Kiểm toán độc lập 2026-10-11: đọc đối kháng từng khoá Pāli↔Việt; các câu ở mục 30/33 khoá dùng lại nguyên văn, BẤT ĐỊNH 1.1 (nền/nàng/ngươi) và phần nhận xét về ngài/nàng ở trên đã bị thay thế bởi lượt này. 16/33 khoá đổi, trong đó 11 khoá có lỗi nghĩa thật (accuracy fix), 5 khoá còn lại là thuật ngữ hoặc giọng văn.
  Lỗi nghĩa thật đã sửa: (a) 1.1 pīṭha là chiếc ghế chứ không phải nền; đổi Nền của nàng thành Chiếc ghế của nàng. (b) 1.2 manojavaṁ gacchati yenakāmaṁ bị bỏ manojava và thêm thật là dễ chịu mà Pāli không có; sửa thành nhanh như ý nghĩ, đi đến bất cứ nơi nào tùy ý muốn. (c) 1.3 alaṅkate malyadhare suvatthe là ba hô cách gọi nữ thiên, bị dịch thành thảm có hoa tươi; sửa thành hỡi nàng được trang sức, đeo vòng hoa, mặc y phục đẹp. (d) 1.4 abbhakūṭa là đỉnh mây, vijjuriva là như tia chớp; bản cũ cột trụ hình tia sét không có căn cứ; sửa thành nàng chiếu sáng như tia chớp trên đỉnh mây. (e) 3.1 mahānubhāve và 7.1 mahānubhāva là hô cách, bị đọc thành về đại oai lực ấy; sửa thành này thiên nữ có đại oai lực và này tỳ-kheo có đại oai lực. (f) 4.4 yassa kammassidaṁ phalaṁ là mệnh đề quan hệ, đại ý nàng giải đáp đây là quả của nghiệp nào; sửa thành đây là quả báo của nghiệp nào. (g) 5.2 abbhāgatānāsanakaṁ adāsiṁ là dâng chỗ ngồi cho khách đến, không phải dâng phẩm vật cho người xin ăn. (h) 5.4 yathānubhāva là tùy khả năng, không phải theo bậc mỗi người. (i) 7.2 và 7.3 người nói là nữ thiên nên là tôi chứ không phải ngài (yamakāsi và Tenamhi là ngôi thứ nhất).
  Sửa thuật ngữ và giọng văn: 2.2 và 6.2 idha mijjhati thành thành tựu được ở nơi đây, theo vv1 và các tệp đã chốt cùng công thức; 4.2 pucchitā là được hỏi chứ không phải truy hỏi; 5.3 tách abhivādayiṁ (đảnh lễ) khỏi añjalikaṁ akāsiṁ (chắp tay); 7.4 vaṇṇo dịch dung sắc như ở 3.4 và 6.1 thay cho sắc tướng, và sabbadisā thống nhất khắp muôn phương ở cả 3.4 lẫn 7.4.
  Điểm tiêu chí đổi (từ thành sang): semantic_fidelity 9.2 thành 8.8; grammar_logic 9.2 thành 8.9; terminology 9.2 thành 8.6; vietnamese_clarity 9.3 thành 8.9; han_viet_balance 9.4 thành 9.2; ambiguity_integrity 9.1 thành 8.6; các tiêu chí còn lại giữ nguyên. final_score 9.20 thành 8.96. Điểm bị HẠ vì bản cũ có 11/33 khoá sai nghĩa thật mà lượt chấm trước không phát hiện; sau sửa, các khoá đó đã bám Pāli nhưng lượt kiểm toán này chỉ có Pāli và tiền lệ nội bộ, không có tầng tham khảo ngoài.
  Bất định còn lại, giữ nguyên trong notes chứ không đoán: (1) tiêu đề phẩm 0.2 Itthivimāna đang dịch Nữ Hư Không, trong khi Pāli không có ākāsa; lặp ở nhiều tệp vv nên không sửa riêng một tệp, cần quyết định chung cho cả bộ. (2) 2.4 và 6.4 ye keci manaso piyā dịch dù là gì dễ chịu với tâm là quy ước cả bộ; piya nghiêng về thân ái, vừa ý hơn là dễ chịu, chưa đổi riêng. (3) 4.4 đọc yassa kammassidaṁ phalaṁ là câu hỏi gián tiếp nghiệp nào; cách đọc này theo cú pháp nhưng các tệp vv cùng công thức đang dùng cách khác. (4) adāsi ở 5.4 là dạng thứ ba nhưng ngữ cảnh 5.2 adāsiṁ và chủ ngữ ahaṁ cho thấy ngôi thứ nhất (vì vần); dịch theo ngôi thứ nhất.
  Giữ nguyên blocker không có tầng Anh vì là giới hạn upstream. Cổng kỹ thuật vẫn CHƯA chạy ở lượt này: technical_integrity 9.6 vì chưa tự chạy npm run validate, npm test, npm run check, npm run build.
  Lượt cải thiện 2026-10-13: đọc đối kháng lại 33 khoá Pāli↔Việt và đo tiền lệ trên toàn bộ vv (85 bài). Đổi 2/33 khoá. 4.3: Được hỏi, nàng đã giải thích rằng thành Được hỏi câu hỏi, nàng đã giải đáp (Pañhaṁ puṭṭhā viyākāsi: bản cũ bỏ Pañhaṁ; 10/19 cặp cùng Pāli đã dùng giải đáp). 4.4: đây là quả báo của nghiệp nào thành về nghiệp mà đây là quả báo (yassa là quan hệ từ chứ không phải nghi vấn: nàng giải đáp về nghiệp mà đây là quả; đo cặp 4.3+4.4 trên cả bộ vv: 10 cặp dùng giải đáp kèm về nghiệp mà đây là quả báo, 6 cặp giải thích rằng kèm quả báo của nghiệp này là thế, 2 cặp giải thích rằng kèm nghiệp nào, 1 cặp khác). Đây là bất định (3) của lượt trước, nay có căn cứ cú pháp và đa số nên đã phân xử. Điểm đổi: semantic_fidelity 8.8 thành 9.0; grammar_logic 8.9 thành 9.0; ambiguity_integrity 8.6 thành 8.7 (chỉ một trong bốn bất định được giải); các tiêu chí còn lại giữ nguyên, final_score 8.96 thành 9.00 (đúng 9.0 chưa vượt ngưỡng 9.0). Cải chính ghi chú cũ: bất định (1) về tiêu đề 0.2 nay đã quy về Thiên Cung Của Nữ Giới (50/50 tệp vv cùng Pāli đều dùng cách này, không còn là Nữ Hư Không). Vẫn không đổi dù còn nghi ngờ: 2.4/6.4 dễ chịu với tâm (38/39 tệp, quy ước cả bộ); 7.1 tôi nói cho ngài (4 tệp so với 10 tệp có xin, giữ dạng sát Pāli, không thêm xin); 7.2 tôi đã tạo phước báu nào (12/14, giữ theo đa số dù Pāli yaṁ là quan hệ từ); 5.4 adāsi ngôi thứ ba về hình thức nhưng dịch ngôi thứ nhất theo 5.2 adāsiṁ. Blocker không có tầng Anh và việc cổng kỹ thuật chưa chạy (npm run validate, npm test, npm run check, npm run build) giữ nguyên.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 4 khoá bất đồng nghĩa → sửa 0, giữ 4, bất định 0. Giữ: 1.1 (`veḷuriya`: bản nguyên bài "ngọc bích", dự án "ngọc lưu ly"; cùng chỉ loại ngọc `veḷuriya`, "lưu ly" là dạng quen thuộc nhất trong tầng dự án, giữ); 2.3 và 6.3 (`bhogā`: bản nguyên bài "các sự hưởng thụ", dự án "của cải"; `bhoga` có cả hai nghĩa, tầng dự án dùng "của cải" ở 20 + 15 khoá cùng công thức, giữ); 5.2 (`āsanakaṁ`: bản nguyên bài "chỗ ngồi nhỏ", dự án "chỗ ngồi"; hậu tố `-ka` không buộc nghĩa "nhỏ", giữ). Review đối kháng 33 khoá: không phát hiện lỗi nghĩa, ngữ pháp hay thuật ngữ nào cần sửa; `vaṇṇo` là "dung sắc" nhất quán ở 2.1, 3.4, 6.1, 7.4. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
