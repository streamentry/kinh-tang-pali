notes: |-
  Dịch TRỰC TIẾP từ Pāli root đã ghim (commit 11c9d708978cde8ba61096d8a75f7ddfb846f639) — không có tầng Anh đã ghim cho vv, xem blocking_errors. Đo tầng Anh bằng cách tra manifest, KHÔNG suy từ tên thư mục.
