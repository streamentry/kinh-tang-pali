  BẤT ĐỊNH 1.1: Pīṭhaṁ te veḷuriyamayaṁ uḷāraṁ trùng nguyên văn vv4:1.1, và bản Việt ở đó dùng Nền của ngươi, trong khi 2.1–3.4 cùng người nói (Moggallāna) về te lại dùng nàng. Ở đây dùng nàng ở CẢ 1.1 lẫn 2.x–3.x để bài không tự mâu thuẫn; đo được Do đâu nàng có được dung sắc như thế, ở 16 tệp so với 0 tệp dùng ngươi. GHI RÕ là lệch MỘT CHỮ với vv4:1.1, và vv4:1.1 có thể là nguồn của cách viết ngươi trong cả bộ.
  Cũng lưu ý ngay trong lời Moggallāna: taṁ devi (3.1) thành ngài còn te (2.x–3.x) thành nàng. Hai cách này kế thừa nguyên văn của vv1, vv3, vv4 — chưa gộp được, đề nghị coordinator chọn một dạng cho cả bộ.
  veḷuriya dịch ngọc lưu ly (đếm được 66 lần lưu ly, 26 lần ngọc lưu ly). sabbadisā xuất hiện ở HAI khoá trùng nguyên văn nhau (3.4 và 7.4) nhưng hai bản Việt đã có khác nhau: 3.4 dùng khắp muôn phương (10 bản khớp), 7.4 dùng khắp mọi phương (15 bản khớp). Theo khuôn hiện hữu để không tự tạo biến thể thứ N+1, nhưng đây là chỗ nên gộp.
  Nháy kép: cặp thứ nhất mở ở 1.1 và đóng ở 3.4 (lời hỏi của Tôn giả Moggallāna), cặp thứ hai mở ở 5.1 và đóng ở 7.4 (lời đáp của nữ thiên). Cân trên cả bài, khớp đúng Pāli. 3.4 kết bằng dấu hỏi rồi dấu ngoặc kép, theo 10 bản khớp (vv1:4.4, vv3:3.4).
