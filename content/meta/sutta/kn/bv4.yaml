    **Bất định (ghi ở đây, không thêm vào thân kinh).**
    1. `9.3` `Samuddaṁ antamantena`: tôi đọc “cho đến tận cùng biển cả” (quyền cai trị trải đến mép đại dương). `antamantena` là dạng lặp, tầng Việt và Pāli không có tiền lệ cho dạng này. Cách đọc khác: “từ rìa này đến rìa kia của biển”. **Không phân xử được.** `9.4` `vattayāmahaṁ` “ta thi hành quyền cai trị” (`issariya` “quyền cai trị”, `kp8:12.1`).
    2. `10.1`–`10.4` `Koṭisatasahassānaṁ vimalānaṁ mahesinaṁ … tappayiṁ`: tôi đọc `koṭisatasahassānaṁ` và `mahesinaṁ` cùng là tân ngữ của `tappayiṁ` (ta làm no đủ một trăm ngàn koṭi vị Đại Ẩn Sĩ, cùng bậc Lãnh Đạo tối thượng); Pāli dùng sở hữu cách thay cho đối cách. Cách đọc khác: “ta đã làm no đủ bậc Lãnh Đạo cùng với (tập hội) một trăm ngàn koṭi vị Đại Ẩn Sĩ”. Cùng cấu trúc ở `bv6:17.1`–`17.4`.
    3. `3.1`–`3.2`: hợp từ `indriyabalabojjhaṅgamaggasaccappakāsanaṁ` bị ngắt qua ranh giới khoá; Việt chia “sự làm sáng tỏ các căn, các lực, các giác chi” (`3.1`) và “con đường và các chân lý” (`3.2`) rồi nối với `pakāsesi` ở `3.3`; chữ “sự làm sáng tỏ” đứng ở `3.1` dù `pakāsana` ở `3.2` Pāli vì nó chi phối cả năm thành tố. Cách đọc khác: `pakāsana` chỉ chi phối `magga` và `sacca`. `pakāsana` dùng “làm sáng tỏ”, còn `pakāsesi` dùng “tuyên thuyết” (khuôn `bv5:3.1`, `bv7:2.1` cho `pakāsesi`; `bv7:27.2` cho `pakāsayaṁ` “làm sáng tỏ”).
    4. `5.2` `naramarūnaṁ samāgame`: “trong cuộc tụ hội của loài người và chư thiên”; chữ `samāgama` cùng chữ với ba “cuộc tụ hội” của hàng đã đoạn tận lậu hoặc ở `8.2`–`8.4`, nhưng ở `5.2` là hội chúng gồm người và trời (nơi giảng Pháp), không phải cuộc tụ hội đã đếm ở `8`. Việt dùng cùng chữ “cuộc tụ hội”; cách đọc khác: “nơi hội họp”.
    5. `17.4` `buddhabījaṁ kira ayaṁ`: “vị này, nghe nói, là hạt giống Phật”; `kira` tôi đọc là “nghe nói” (lời truyền lại), cách đọc khác là “quả thật” (khẳng định). `buddhabīja` “hạt giống Phật” không có tiền lệ trong tầng. Pāli mở và đóng nháy đơn trong cùng khoá `17.4`; Việt giữ đúng.
    6. `19.1`–`19.4`, `21.1`–`21.4`: `imassa lokanāthassa` (`19.1`) và `imaṁ jinaṁ` (`21.2`) là Koṇḍañña (vị đang thuyết giảng), còn `imaṁ` ở `19.4`, `21.4` là vị sẽ thành Phật (Vijitāvī/ Gotama); cả hai Pāli đều là đại từ chỉ định “này”, Việt cũng chỉ viết “này” ở cả hai nơi, không nêu tên (cùng khuôn `bv19:14.3`, 20/20). Cách đọc khác: `imaṁ` ở `19.4` cũng là Koṇḍañña (“ở trước mặt vị này” = “gặp lại chính vị này”).
    7. `19.1`: Pāli `lokanāthassa` đứng trước `sāsanaṁ` (ở `19.2`), nên Việt viết “Nếu của bậc Lãnh Đạo thế gian này, / chúng ta bỏ lỡ giáo pháp” giữ thứ tự Pāli qua hai khoá (câu thường viết “Nếu chúng ta bỏ lỡ giáo pháp của bậc … này”). `virajjhissāma` “bỏ lỡ” (đối tượng bị bỏ lỡ là `sāsanaṁ`).
    8. `20.2` `Paṭititthaṁ virajjhiya`: “bỏ lỡ bến đối diện”: `paṭititthaṁ` đọc là bến đối diện (bến đúng hướng, bờ muốn đến); cách đọc khác: “bến chính/ bến thích hợp”. Không có tiền lệ trong tầng. `20.3` `Heṭṭhātitthe gahetvāna` “sau khi chọn bến ở phía dưới” (`gahetvā` “nắm lấy, chọn lấy”).
    9. `21.2` `yadi muñcāmimaṁ jinaṁ`: `muñcāma` “buông bỏ”; cách đọc khác: “để vuột mất” (nghĩa gần với `virajjhissāma` ở `19.2`). Không có tiền lệ.
    10. `29.4` `devānaṁ nagaruttame`: “ở thành phố tối thượng của chư thiên”; cách đọc khác: đó là tên một nơi (nguyên văn không có `nāma`). Pāli root không nêu tên.
    11. `31.3` `Sālakalyāṇiko bodhi`: tôi viết “Cây Bồ-đề là cây sālakalyāṇika” và giữ nguyên tên cây (không có tiền lệ); cách đọc khác: `sāla` (cây sāla) + `kalyāṇika` (tốt lành), nghĩa “cây sāla tốt lành”. `15.3`–`15.4` Cây Bồ-đề của Gotama “được gọi là cây assattha”, khớp `bv27:20.1` (“dưới gốc cây assattha”).
    12. `27.4` `vijitaseno atrajo`: “người con ruột là Vijitasena”: tôi đọc là tên con (theo cấu tạo `atrajo` + tên ở `bv3:20.4`; `bv5:20.4` có thêm `nāma`); cách đọc khác: tính từ “có quân chiến thắng” bổ nghĩa cho người con. Pāli không có `nāma` ở khoá này. `26.3` `Suci suruci subho ca`: ba tên lâu đài (khớp “ba” ở `26.4`); cách đọc khác: ba tính từ (“trong sạch, đẹp ngời, tốt lành”). Pāli không có `nāma`.
    13. `33.1` `So aṭṭhāsīti hatthāni`: “Ngài cao tám mươi tám hattha” (`so` = Ngài); `accuggato` ở `33.2` “cao vút” lặp ý chiều cao nhưng đúng Pāli. `33.3` `uḷurāja` “mặt trăng” (`bv16:22.4`, `bv20:22.4`).
    14. `35.2`–`35.4` `vicittā āsi medanī … evaṁ so upasobhatha`: “mặt đất đã được tô điểm muôn màu” (`vicitta` theo `bv11:30.2` “được tô điểm muôn màu”; Pāli là `āsi` “đã trở nên”, không có “được”); chủ ngữ `so` ở `35.4` là Đức Phật (theo `bv17:22.4`), cách đọc khác: cả đoạn nói về mặt đất. `36.1` `nāgā` “bậc long tượng” (chỉ các vị A-la-hán, theo `snp4.9:11.2`, `snp5.13:1.5`, `snp3.7:42.4`); cách đọc khác: “những bậc cao quý” hoặc rồng/ voi nghĩa đen. `36.3` `Vijjupātaṁva dassetvā`: “sau khi hiển lộ như một tia chớp” (`dassetvā` không có tân ngữ tường minh; không có tiền lệ).
    15. `37.1`–`37.2` `Sā ca atuliyā jinassa iddhi, Ñāṇaparibhāvito ca samādhi`: “cả thần thông … lẫn định được nuôi dưỡng nhờ trí”: `paribhāvita` → “được nuôi dưỡng” theo `dn16:1.12.3` (“Định được nuôi dưỡng nhờ giới”); cách đọc khác: “được huân tập/ ướp đẫm bằng trí”. Khuôn cả…lẫn… theo `bv6:33.1`–`33.2`.
    16. `38.3` `Tattheva cetiyo citto`: “bảo tháp lộng lẫy”: `citta` đọc là tính từ “lộng lẫy, muôn màu”; cách đọc khác: tên riêng. `38.1` `pavaro buddho` “bậc Phật tối thắng”.
    17. `2.1`–`2.4` `Dharaṇūpamo khamanena … merūpamo … gaganūpamo`: “tựa như đất / biển cả / núi Meru / bầu trời”, giữ nguyên bốn ví dụ; `khamana` “sự kham nhẫn” (không có tiền lệ cho dạng `khamana` trong tầng). `1.3`–`1.4` theo nguyên văn `bv19:1.3`, `bv14:1.4`.
    18. `13.1`–`13.4`, `14`–`16` (lời thọ ký về Gotama): `ayaṁ hessati gotamo` “vị này sẽ là Gotama” theo `tha-ap491:2.4`; `Citto ca hatthāḷavako` / `Nandamātā ca uttarā` khớp `bv27:19.1`–`19.3`. `16.4` kết bằng `;` rồi `16.5` mở “Tuổi thọ của vị ấy là một trăm năm,” (`tassa` “của vị ấy”, `gotamassa` “của Gotama” là đồng vị ở `16.6`).

