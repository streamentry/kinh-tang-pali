notes: |-
  Đợt 19, làn 98. Dịch từ Pāli root commit đã ghim, đủ 159/159 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ tư của Buddhavaṃsa, về Đức Phật Koṇḍañña (vị thứ hai theo `39.1`: `dutiyo`): đức hạnh (`2`–`3`), ba lần chứng ngộ (`4`–`6`) và ba kỳ hội chúng (`7`–`8`); tiền thân là vua Vijitāvī cúng dường và được thọ ký (`9`–`16`); loài người và chư thiên hoan hỷ, ví dụ bến sông (`17`–`21`); xuất gia và đạt cõi Phạm thiên (`22`–`24`); gia thế, xuất gia lần cuối, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp (`25`–`38`). Cấu trúc nháy: nháy kép mở ở `1.1` và đóng ở `38.4`; lời thọ ký mở nháy đơn ở `11.3` và đóng ở `16.6`; lời của loài người và chư thiên ở `17.4` tự đóng; lời chư thiên mở nháy đơn ở `19.1` và đóng ở `21.4`; nháy khớp Pāli từng khoá ở cả 7 khoá có nháy. Pāli root của bài không có dấu lược `…` hay `(…)` ở khoá nào nên bản Việt cũng không có. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Tệp bản dịch của bài chưa có trước lát này.

    **Tiêu đề.**
    - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các phẩm anh em (24/24 tiền lệ).
    - `0.2` “4. Dòng Kế Thừa Của Đức Phật Koṇḍañña”: `koṇḍaññabuddhavaṁsa`; cùng khuôn với `bv3:0.2`, `bv5:0.2`, `bv9:0.2`. Số “4.” là số ghi trong tiêu đề Pāli (thứ tự phẩm), còn thứ tự Đức Phật là thứ hai (`39.1`).
    - `39.1` “Dòng kế thừa của Đức Thế Tôn Koṇḍañña là thứ hai.”: `dutiyo` = 2; cùng khuôn với `bv3:32.1` (thứ nhất), `bv5:33.1` (thứ ba). `1.1` “Sau Dīpaṅkara” khớp thứ tự (Dīpaṅkara thứ nhất).

    **Hướng của lời thọ ký (`11.3`–`11.4`, `12`–`16`).** `Aparimeyyito kappe … buddho loke bhavissati` là lời thọ ký tương lai: đếm kiếp **sau** thời Koṇḍañña (Vijitāvī) là lúc một vị Phật sẽ có mặt ở đời (Gotama). Việt: “Sau vô lượng kiếp nữa,” đúng 6/8 tiền lệ nguyên văn (`bv5:12.3`, `bv8:13.3`, `bv11:15.3`, `bv6:18.3` v.v.); tiền lệ `bv28:1.1` “Vào vô lượng kiếp trước đây,” là người kể nhìn ngược về quá khứ, khác ngữ cảnh nên không theo. Mọi động từ ở `11`–`16` giữ thì tương lai: `bhavissati` “sẽ có mặt”, `bujjhissati` “sẽ giác ngộ”, `hessanti` “sẽ là”, `upaṭṭhissati` “sẽ hầu cận”, `hessati` “sẽ là”. Việt không viết “trước đây” ở bất kỳ khoá nào của đoạn này.

    **Số Pāli, đã tự tính.** `koṭisatasahassa` 1 × 100 × 1.000 = **một trăm ngàn koṭi** (4.3, 8.1, 10.1; 19 tiền lệ nguyên văn). `navutikoṭisahassa` 90 × 1.000 = **chín mươi ngàn koṭi** (5.3; 8 tiền lệ nguyên văn). `asītikoṭisahassa` 80 × 1.000 = **tám mươi ngàn koṭi** (6.3; 7 tiền lệ nguyên văn). `tayo` 3 (7.1 ba kỳ hội chúng, khớp ba con số ở 8.1, 8.3, 8.4; 26.4 ba lâu đài, khớp ba tên ở 26.3). `koṭisahassa` = **một ngàn koṭi** (8.3; cùng cấu tạo ở `bv5:5.3`, `bv7:9.3`). `navutikoṭi` 90 koṭi (8.4; `navuti` = 90, khớp `bv5:9.2`). `paṭhama`, `dutiya`, `tatiya` 1, 2, 3 (4.4, 5.4, 6.4, 8.2–8.4; `dutiyo` 39.1). `vassasataṁ` 100 năm (16.5; khớp `bv27:21.1`). `navaṅga` chín phần (23.2; 4 tiền lệ). `dasavassasahassa` 10 × 1.000 = **10.000 năm** (26.1; 6 tiền lệ). `tīṇi satasahassāni` 3 × 100.000 = **ba trăm ngàn** (27.1; khớp `bv3:20.1`, `bv10:8.3`). `caturo` 4 (28.1 bốn dấu hiệu). `anūnadasamāsa` = không thiếu + 10 = **đủ mười tháng** (28.3; 4 tiền lệ). `aṭṭhāsīti` 8 + 80 = **88 hattha** (33.1; khớp `bv5:26.1` cùng cấu tạo ở đơn vị ratana). `vassasatasahassa` 100 × 1.000 = **100.000 năm** (34.1; 11 tiền lệ). `satta yojana` 7 do-tuần (38.4). `dasasahassī` 10 × 1.000 = **mười ngàn** thế giới (18.4; khớp `bv16:2.4`, `bv19:4.1`). Không có cụm `Tiṁsakappasahassa` ở bài này; không số nào chưa phân xử được.

    **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt `kn` hiện có (draft và published, gồm cả các phẩm cùng đợt; so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 90 khoá của bài có Pāli trùng với khoá bài khác, tổng 805 cặp, trong đó 118 cặp có Việt khác bản tôi viết; 56 khoá dùng đúng nguyên văn mọi tiền lệ (`0.1`, `1.2`–`1.4`, `4.1`, `4.4`, `5.1`, `5.3`, `6.3`, `6.4`, `7.1`, `7.3`, `7.4`, `9.2`, `11.1`, `12.2`, `12.4`, `13.1`, `13.2`, `13.4`, `14.1`, `14.3`, `14.4`, `16.3`, `21.4`, `23.1`–`23.4`, `24.1`, `24.2`, `24.4`, `25.1`, `25.3`, `26.1`, `26.2`, `26.4`, `27.1`, `28.1`–`28.3`, `29.1`, `29.3`, `30.2`, `31.2`, `32.2`, `32.4`, `33.2`, `34.1`–`34.3`, `35.1`, `35.4`, `36.4`, `37.3`, `37.4`).
    - Chỗ viết **khác** tiền lệ, có lý do (34 khoá có ít nhất một cặp khác): phần lớn chỉ khác dấu cuối khoá, dấu phẩy hoặc chữ hoa đầu khoá theo Pāli từng khoá của bài này (`5.4` 1 cặp ‘;’ thay ‘.’ ở `bv20:4.2`; `8.2` 6/12 cặp khác ‘.’/‘;’; `8.4` 1 cặp; `10.2` 1 cặp; `13.3` 1 cặp chữ hoa; `15.1`, `15.3` mỗi khoá 1 cặp thiếu dấu phẩy; `15.4` 1 cặp nháy đóng; `17.1`–`17.3` 1, 2, 1 cặp dấu/chữ hoa; `19.3`, `21.3` 4/4 cặp chữ hoa/ dấu; `22.2` 2/16 cặp dấu cuối; `12.1` 1/20 cặp có nháy mở của `bv7:13.1`; `11.3` 2/8 cặp là nháy kép ở `bv7:12.3` và ngữ cảnh quá khứ ở `bv28:1.1`; `27.2` 3/28 cặp ở `snp2.7`, câu khác nghĩa “người nữ trang điểm lộng lẫy”). Khác nội dung có chủ ý:
    - `1.1` (1 cặp, `bv28:2.1` “Sau Dīpaṅkara,”): thêm nháy mở “ vì Pāli ở đây mở lời kể.
    - `4.3`, `8.1` (1 cặp mỗi khoá, `bv6:17.1` “Một trăm ngàn koṭi,”) và `10.1` (**19/20 cặp khác**): hai khoá `4.3`, `8.1` là “Của … , đã có lần chứng ngộ/ cuộc tụ hội …” (genitive mở đầu mệnh đề tồn tại), dùng đúng dạng đa số 19/20; còn `10.1` là tân ngữ của `tappayiṁ` “ta đã làm cho no đủ” (`10.1`–`10.4`), nên theo dạng của `bv6:17.1` (cùng cấu trúc: không có “Của”) thay vì dạng 19/20 của các khoá kia, vì “Của một trăm ngàn koṭi … ta đã làm cho no đủ” sẽ thành sai cú pháp.
    - `9.1` (4/23 khác: “Vào lúc ấy tôi,” hai khoá `tha-ap` và `thi-ap`): chọn “ta” vì người kể là Đức Phật Gotama (19/23 và cùng ngôi các phẩm Buddhavaṃsa).
    - `10.4` (1 cặp, `tha-ap45:8.4` “tôi đã làm cho no đủ bằng món ăn thượng vị.”): đổi “tôi” thành “ta” theo ngôi bài, các chữ còn lại giữ nguyên.
    - `11.4` (1/2 khác: `tha-ap122:2.2` “bậc Phật sẽ có mặt ở đời;”): theo `tha-ap127:1.4` “bậc Phật sẽ có mặt ở thế gian.” (cùng dấu cuối `.`); hai tiền lệ khác nhau “ở đời”/“ở thế gian”, chọn tiền lệ khớp dấu cuối Pāli.
    - `12.3` (1 cặp, `tha-ap491:3.3` “dưới gốc cây assattha, bậc Toàn Giác,”): `sambuddha` → “bậc Chánh Đẳng Giác” (39/39 khoá bv; 340/458 toàn tầng `kn`, “Toàn Giác” 49).
    - `14.2`, `15.2` (mỗi khoá 1 cặp, `tha-ap491:4.2`, `5.2` “sẽ là hai vị đệ tử thượng thủ;”, “sẽ là hai vị nữ đệ tử thượng thủ;”): bỏ “hai vị” (Pāli `aggā … sāvakā` không nêu số), cùng khuôn “các đệ tử thượng thủ” của các phẩm anh em (23 trên 26 khoá).
    - `16.6` (13/13 khác: các khoá `vv` “Đức Gotama lẫy lừng danh thơm.”): cách dịch của phẩm `vv` thêm “Đức” và “lẫy lừng danh thơm”; tôi theo `snp5.16:2.4` (cùng chữ, “của Gotama danh tiếng.”) và thêm nháy đóng ’ theo Pāli.
    - `19.4` (20/20 khác): tiền lệ “chúng ta sẽ ở trước mặt vị này’.” có nháy đóng; ở `19.4` Pāli không có nháy đóng (lời chư thiên kéo dài tới `21.4`), nên bản Việt không có nháy đóng ở `19.4` mà có ở `21.4` (nguyên văn tiền lệ).
    - `22.1` (17/20 khác): 17 khoá ở `thig`, `pv`… dịch “của người ấy”; ba khoá khác dịch “của vị ấy”; tôi theo ba khoá này (`bv23:17.1`, `bv22:14.1`, `cp26:9.1`, cùng ngữ cảnh người nghe lời của một vị Phật).
    - `24.3` (1/3 khác: `tha-ap521:22.1` “Sau khi đạt đến chỗ tận cùng của các thắng trí,”): theo `bv5:17.3`, `bv14:19.3` “Sau khi đạt ba-la-mật trong các thắng trí,” (cùng phẩm, 2/3).
    - `22.6` (1/5 khác: `tha-ap500:31.4` “tôi đã xuất gia nơi vị ấy.”): đổi “tôi” thành “ta” và “nơi” thành “bên” theo 4/5 khoá còn lại. `34.4` (1/24 khác: `tha-ap343:1.4` “cứu vớt đông đảo chúng sanh.”): theo 23/24 khoá “vị ấy đã đưa đông đảo mọi người vượt qua.”
    - `28.4` (1/12 khác: `tha-ap200:1.4` “bậc Chiến Thắng đã nỗ lực chung thức cuối cùng.” — “chung thức” không có trong Pāli và có vẻ là lỗi; **lỗi ngoài lát, báo chứ không sửa**, đã nêu ở các lát trước).
    - Trùng trong chính bài (4 nhóm Pāli trùng, 11 cặp, 6 cặp Việt khác có chủ ý): `4.3`/`8.1`/`10.1` (3 cặp, 2 khác: `10.1`, lý do ở trên); `7.2`/`25.4`/`30.4`/`31.4` (6 cặp, 3 khác: `7.2` “nơi Koṇḍañña, bậc Đại Ẩn Sĩ;” là nơi xảy ra ba kỳ hội chúng, khuôn `bv5:8.2`; còn `25.4`, `30.4`, `31.4` “của Koṇḍañña, bậc Đại Ẩn Sĩ.” là sở hữu cách, khuôn `bv5:18.4` — giống hệt nhau); `19.3`/`21.3` (1 cặp giống hệt “Vào thời vị lai,”); `19.4`/`21.4` (1 cặp khác chỉ do nháy đóng, lý do ở `19.4`).

    **Thuật ngữ, có số đếm** (đo trên tầng Việt `kn` hiện có, khoá phân biệt; so Pāli với bản Việt cùng khoá).
    - `nāyaka`/`lokanāyaka` → “bậc Dẫn Đạo”, “bậc Dẫn Đạo thế gian” (26/26 khoá bv chứa `lokanāyak-`; toàn tầng `kn` 182 khoá: “Dẫn Đạo” 134, “Lãnh Đạo” 15, “Đạo Sư” 12, “Dẫn Lộ” 7, khác 14). `lokanātha(ggaṁ)` → “bậc Lãnh Đạo (tối thượng của) thế gian”: 34 khoá `lokanāth-`: “Lãnh Đạo” 14, “Bảo Hộ” 10, “Hộ Trì” 4, “Cứu Độ” 1, khác 5; riêng bv 2/2 khoá là “Lãnh Đạo” (`bv3:5.4`, `bv16:3.1`) nên theo; “Dẫn Đạo tối thượng của thế gian” dành cho `lokagganāyaka` (`bv19`, `bv20`, `bv22`). `mahesi` → “Đại Ẩn Sĩ” (53/53 khoá bv; toàn tầng 145 trên 188); `jina` → “bậc Chiến Thắng” (33/33 khoá bv); `mahāmuni` → “Đại Mâu-ni” (19/19); `mahāvīra` → “Đại Anh Hùng” (31/31); `dvipaduttama` → “bậc tối thắng giữa loài hai chân” (14 trên 25 khoá; “tối thượng” 9; theo `bv5:12.2`).
    - `appameyya` → “không thể đo lường” (2/2 khoá bv chứa `appameyy-`: `bv14:1.4`, `bv24:1.4`; toàn tầng `kn`: “không thể đo lường” 13 trên 24, “vô lượng” 10); `durāsada` → “khó tiếp cận” (5/5 khoá bv chứa `durāsad-`; toàn tầng 6 trên 10, “khó đến gần” 3); `atula` → “không thể cân lường” (23 trên 26 khoá bv chứa `atul-` có “cân lường”, 9 khoá có “vô song”). `asaṅkhobbha` → “không thể bị khuấy động” (`bv9:3.1`; `akkhobbho` ở `bv12:1.4` là “không lay chuyển”, chữ khác). `khīṇāsava` → “đã đoạn tận lậu hoặc”, `vimala` → “không cấu uế”.
    - `sambuddha` → “bậc Chánh Đẳng Giác” (39/39 khoá bv); `mahāyasa` → “danh tiếng lớn” (11 trên 11 khoá bv; “có danh tiếng lớn” 6): `12.4` theo nguyên văn `tha-ap491:3.4`, `36.4` theo `bv13:30.4`. `pavara` → “tối thắng” (54 khoá `pavar-`: “tối thượng” 21, “cao quý” 16, “tối thắng” 14; `snp2.14:3.4` “Đức Phật tối thắng”; ở `38.1` chọn “tối thắng” vì “tối thượng” đã dùng cho `uttama`/`agga` ở `10.3`, `26.4`, `29.4`).
    - `titthiya` → “ngoại đạo” (58 trên 62 khoá). `abhimaddati` → “đập tan” (`bv3:23.4` `titthiyamaddana` “đã đập tan các ngoại đạo”). `abhisamaya` → “chứng ngộ” (`bv5`, `bv16`, `bv18`, `bv20`). `sannipāta` → “kỳ hội chúng”, `samāgama` → “cuộc tụ hội” (`bv7:6.1`, `bv9:8.1`, `bv13:7.1`). `dhammacakkaṁ pavattente` → “Khi chuyển bánh xe Pháp,” (5/5 khoá nguyên văn), `vatti cakkaṁ` → “Bậc Đại Anh Hùng đã chuyển bánh xe,” (21/21).
    - `tappeti` → “làm cho no đủ” (7 trên 10 khoá bv chứa `tappay-`/`tappe-`, “thỏa mãn” 3; `bv6:17.2`, `bv5:11.6`); `paramanna` → “món ăn thượng vị” (tiền lệ `tha-ap45:8.4`, 1/1). `byākaroti` → “thọ ký” (15 trên 15 cho `Sopi maṁ buddho byākāsi`). `padhāna` → “nỗ lực tinh tấn” (19 trên 20 khoá `Padhānaṁ padahitvāna`; 28.4 “nỗ lực tinh tấn” 11/12). `dukkarakārikā` → “khổ hạnh” (`tha-ap491:3.2`). `bujjhati` → “giác ngộ”. `assattha` → giữ nguyên “assattha” (`bv27:20.1`, `tha-ap491:3.3`).
