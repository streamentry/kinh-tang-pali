notes: |-
  Đã đọc HẾT Pāli lát qua v5/p5.txt trước khi viết. Không segment nào của lát này có …pe… nên hai phía đều 0 dấu lược. Mọi dấu nháy kép đều cân trên cả bài.
  Phẩm Littavagga → Phẩm Những Điều Nhỏ: 0 tiền lệ cho tên phẩm này (ja1 Phẩm Bụi Dơ, ja12 Phẩm Giới, ja21 Phẩm Nai Bốn Sừng, ja101/106/107 Phẩm Parosata); litta = nhỏ, bé, ngắn, mà Pāli không nói cái gì nhỏ nên dịch theo nghĩa chữ, không gắn vào con vật nào. Giữ Jātaka và Bộ Một Bài Kinh theo ja1, ja12; 0.1 và 0.2 ngắn hơn 40 ký tự nên chốt không kiểm trùng Pāli, nhưng tầng đã có tiền lệ dùng nguyên văn Jātaka.

  Bốn vế kệ trùng nguyên văn với sn1.11:5.3–5.6 đã có trong tầng, nên dịch theo đúng
  bản đó và chỉ sửa đúng một chỗ: Pāli ở đây là saṅkhārā không có sabba, nên bỏ mọi
  (ở sn1.11 là Aniccā sabbasaṅkhārā / mọi hành là vô thường), còn vata thì giữ bằng
  Ôi. Còn lại giữ nguyên: có bản chất sinh, diệt / đã sinh ra rồi chấm dứt / sự lắng
  dịu của chúng là hạnh phúc. Cùng bài kệ này còn có ở dn16:6.10.11, dn17:2.17.6,
  sn6.15:6.2, sn9.6:5.4, tha-ap341, tha-ap429, thag20.1, pe6 — tất cả đều dùng cùng một
  cách dịch cho vế 2–4, nên lát này không tạo biến thể mới.
  Tiêu đề Mahāsudassana giữ nguyên: tên riêng này đã có 21 lần trong tầng Việt
  (dn16, dn17: vua Mahāsudassana), nên không cần đặt mới và chốt lọt_pāli cho qua.
  saṅkhāra → các hành (419); vūpasama → sự lắng dịu (theo sn1.11); sukha → hạnh phúc
  (glossary: sukha, AN1.140+).
