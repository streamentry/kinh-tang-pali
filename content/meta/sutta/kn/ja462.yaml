notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng tham khảo tiếng Anh nào ở commit đã ghim cho ja462.
  Tiền lệ đếm được: `Jātaka` -> Jātaka 418/434; `8. Saṁvarajātaka` -> 8. Kinh Saṁvara theo mẫu ja445/ja446; `Saṁvarajātakaṁ aṭṭhamaṁ.` -> Kinh Saṁvara thứ tám. `mahārāja` -> Đại vương (11 lần trong bộ Jātaka đã dịch); `hatthāroha`/`asi`/`rathi`/`pattikāraka` -> cưỡi voi / cưỡi ngựa / cưỡi xe / đi bộ (cưỡi voi 20, đi bộ 23, cưỡi ngựa 8, cưỡi xe 3 ở toàn tầng); `samaṇa` -> sa-môn; `uposatha` -> trau giới (48 lần ở toàn tầng); `Bārāṇasī` 58 so với Varanasi 9.
  `saṁvara` dịch giới hạnh (183 lần ở toàn tầng) chứ không phải hành giới hạnh — trong bài này `saṁvara` là LỐI SỐNG KỶ LUẬT mà vị vua hỏi về (3.1), còn `uposathakamma` mới là hành giới hạnh (9.4). Phân biệt này giữ cho mil6.3.3 và ja462 không lẫn.
  HAI TÊN PHẨM 0 TIỀN LỆ, dựng từ tầng `name/` đã ghim: `Ekādasakanipāta` (`ja-name:510` -> The Book of the Elevens) ⇒ Bộ Mười Một Bài Kinh; `Mātuposakavagga` (`ja-name:511` -> The Elephant Who Cared for His Mother) ⇒ Phẩm Voi Hiếu Mẹ. Giống hệt ja460; cần người điều phối ghi vào bảng tên.
  BẤT ĐỊNH ghi lại: (1) `Kena taṁ nātivattanti, ñātisaṅghā samāgatā` (3.3-3.4) dịch Bằng cách nào các ngài không phạm vào điều ấy, khi hội người thân đã tụ họp — trạng ngữ Pāli bị cắt, có thể câu hỏi là của người nói hay của nhà vua. (2) `indaṁva asurādhipo` (11.4) dịch như Inda, chúa tể của bọn Asura — `asurādhipo` là Sakka/Indra trong vai chúa tể Asura; 0 tiền lệ cho `asurādhipo`. (3) `pāde vandāmi tādinaṁ` (4.4) dịch bậc thọ lâu hơn. (4) `jānāhuposatha` (9.4) dịch hãy biết ngày trau giới như thế.
  Sửa lỗi trong lượt review đối kháng: 1.1/1.2 ban đầu dịch sai — đã gán `mahārāja` thành bậc làm chủ của loài người và `janādhipo` thành biết rõ đạo hạnh; đã sửa thành Đại vương đã biết rõ / giới luật của ngươi, bậc làm chủ của loài người. Đồng thời thống nhất `samaṇānaṁ mahesinaṁ` ở 4.2 và 6.2 thành cùng một cách.
  Vì bản root `pli/ms` chỉ có thơ, KHÔNG có văn xuôi cho Jātaka, nên khung truyện không thể đối chiếu ở commit đã ghim.
  Dấu lược: Pāli ja462 không có `…pe…`; đếm lược 0 = 0.
  Chốt `_hvi.py` sạch: 49/49 khoá, khoá thừa 0, NFC OK, ngoặc kép cân và khớp đúng cấu trúc Pāli (mở ở 1.1, 4.1, 10.1; đóng ở 3.4, 9.4, 11.4 — 4.1 mở và 9.4 đóng vì lời một người kéo dài sáu câu kệ). `Jātaka` ở 0.1 giữ nguyên Pāli là quy ước của bộ.
