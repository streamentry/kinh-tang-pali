notes: |-
  17 khoá, tất cả đã dịch. Bài thứ 11 của `Mahāvagga` trong Petavatthu.

  TẦNG THAM KHẢO — 0/17 có Anh Sujato: không có tệp `pv*` trong `kn/` của edition đã ghim (chỉ có
  cp, dhp, iti, ja, kp, snp, thag, thig, ud). Đo theo `source/layers.yaml`: Pāli có nội dung =
  **0 khoá** (mọi câu kệ của Petavatthu đều ngắn hơn 40 ký tự), nên `src/lib/canon/reference.ts`
  quy định `ratio = 1` khi mẫu số bằng 0, và cổng coverage **không** chặn. Nhưng tệp Anh thật sự
  không tồn tại, và `scripts/validate.ts` coi đó là **error** khi status là `review`/`published`.
  Đây là
  trường hợp số đo không bắt được nhưng thực tế mất tầng tham khảo vẫn là blocker ⇒ `draft`.
  Ghi rõ ở đây vì điểm này dễ bị đọc nhầm là bài đã đủ tầng tham khảo.

  PĀLI TRÙNG: `0.1` `Petavatthu` (giữ nguyên, 2 tiền lệ ở pv48, pv49), `0.2` `Mahāvagga` → *Đại
  Phẩm* (6 tiền lệ), và khuôn `Xpetavatthu` → *Chuyện ngạ quỷ X* (pv48:0.3, pv49:0.3) cùng khuôn
  kết `… ekādasamaṁ` → *…, thứ mười một.*

  THUẬT NGỮ MỚI (0 tiền lệ): `Pāṭaliputta` → *Đoàn Hộ Đứa Con*; `tiracchānayoni` → *cõi địa
  ngục không cửa*; `athava` → *người* (trong `Petā asurā athavāpi mānusā devā` tôi dịch *ngươi là
  ngạ quỷ, yêu quái, người hay chư thần*); `anappakāni` → *không mất đi*. `puñña` → *phước* theo
  glossary.

  BẤT ĐỊNH CHƯA PHÂN XỬ — đây là chỗ yếu nhất của lát nên `ambiguity_integrity` ở 8.9:
  · **`1.1` `Diṭṭhā tayā` đối chiếu `3.1` `Diṭṭhā mayā`.** Ở `3.1` `mayā` là *bởi tôi*, và câu đó
    là ngạ quỷ kể lại điều chính nó thấy. Ở `1.1` Pāli ghi `tayā` (công cụ của *ngươi*), nên đọc
    theo cú pháp sẽ là *ta đã bị ngươi thấy*. Tôi dịch cả hai vế theo hướng song song *Ta đã
    thấy ngươi*, vì `1.1–1.5` và `3.1–3.4` là **cùng một đoạn nói lại** (khác ba câu kệ xen giữa
    lời đáp của yêu quái) và chú giải Petavatthu đọc cả hai là *ta đã thấy ngươi*. Nhưng đây là
    chỗ tôi **đã phải chọn**, và `mayā` ở `3.1` là bằng chứng ngược lại.
  · `Nessāmi taṁ pāṭaliputtamakkhataṁ` (`1.4`): `nessāmi` ở đây là *ban cho* (nghĩa cho), nên ngạ
    quỷ đang **trao danh hiệu Đoàn Hộ Đứa Con** cho yêu quái, và lời đáp `2.3–2.4` (*Ta làm theo
    lời ngươi, ngươi là vị thầy của ta*) xác nhận đúng cách đọc này.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.

  Lượt cải thiện 2026-10-11 (đọc đối kháng từng khoá, thay thế các mục "THUẬT NGỮ MỚI" và "BẤT ĐỊNH CHƯA PHÂN XỬ" ở trên, vốn dựa trên cách đọc sai):
  Đổi 15/17 khoá (chỉ giữ `0.1`, `0.2`). Bản trước đọc sai nền ngữ pháp của cả bài.
  · `Pāṭaliputta` là tên THÀNH (đối chiếu `pv37:52.4` `pāṭaliputtamakkhataṁ` = về Pāṭaliputta bình an vô sự, và `bv29:14.1`, `mil2`), không phải "Đoàn Hộ Đứa Con"; tiêu đề `0.3`, `4.1` và `translationTitle` đổi thành *Chuyện ngạ quỷ Pāṭaliputta*. `Nessāmi taṁ pāṭaliputtamakkhataṁ` (`1.4`) = *ta sẽ đưa ngươi đến Pāṭaliputta bình an vô sự* (`nessāmi` = đưa đi, không phải "ban cho"; `akkhata` = không bị tổn hại).
  · `tiracchānayoni` = cõi súc sinh (bản trước: "cõi địa ngục không cửa", không có trong Pāli; tiền lệ `cnd18`, `cnd5`, `ja525:31.2` đều là súc sinh). `1.1–1.2`: `tayā diṭṭhā` (công cụ cách) = *ngươi đã thấy*, `nirayā`, `tiracchānayoni`, `petā`, `asurā`, `mānusā devā` là các cõi/loài ĐƯỢC THẤY (chủ cách số nhiều), chứ không phải lời gọi người đối thoại; bản trước biến chúng thành "ngươi là ngạ quỷ, yêu quái, người hay chư thần" và thêm "yêu quái" (không có trong Pāli). Điểm bất định `tayā`/`mayā` nêu ở mục cũ vì vậy không còn: cả hai khoá `1.1` và `3.1` đều là *đã thấy*, đúng ngôi (`tayā` = bởi ngươi, `mayā` = bởi tôi).
  · `1.3`/`3.3` `sayamaddasa(ṁ) kammavipākamattano` = *chính ngươi/tôi đã thấy quả của nghiệp thuộc về mình* (bản trước: "chỉ mới chịu quả báo của việc làm ấy thôi", câu không có trong Pāli).
  · `3.4` `Kāhāmi` = `karissāmi` *tôi sẽ làm* (đối chiếu `ja378:2.4`, `ja391:5.4`, cùng câu `Kāhāmi puññāni anappakāni`), không phải "ta sẽ kể cho ngươi" (đảo chủ thể và động từ). `anappaka` = không phải là ít (`ja378`, `ja391`, `bv22:10.2`).
  · Đổi ngôi lời đáp `2.1–2.4`, `3.1–3.4`: người đáp là người được dẫn đi, xưng *tôi* và gọi dạ-xoa là *ngài*; `yakkha`, `devate` là hô cách (*hỡi dạ-xoa*, *hỡi vị thiên*), bản trước dịch "yêu quái"/"chư thần". Dùng lại nguyên văn pv17:19.1–19.4 và pv38:53.1–53.4 (cùng Pāli; đã đối chiếu Pāli trước khi chọn). `1.5` `kusalaṁ kammaṁ` = *nghiệp thiện* (theo pv17).
  Điểm đổi: semantic_fidelity 9.2 → 9.0 (bản đã chấm có nhiều chỗ sai nghĩa thật; bản sửa còn bất định ở `1.3`/`3.3`, `1.4`), vietnamese_clarity 9.3 → 9.2, ambiguity_integrity 8.9 → 8.8; các tiêu chí khác giữ. `final_score` 9.17 → 9.13. Điểm giảm vì đọc đối kháng thấy bản trước sai sâu hơn mức đã tự chấm; bản mới đúng ngữ pháp nhưng chưa có bản Anh độc lập để đối chiếu nên không nâng `triangulation` (7.5).
  BẤT ĐỊNH CÒN LẠI (không phân xử được, không đoán): (1) `attano` trong `kammavipākamattano` có thể nối với quả của nghiệp *của chính mình* hay chỉ nhấn mạnh `sayaṁ`; giữ cách dịch sát chữ, không thêm diễn giải; (2) `akkhataṁ` (`1.4`) đứng sau `taṁ` và `pāṭaliputtaṁ` cùng hình thức đối cách, nên "bình an vô sự" có thể nói về người được đưa đi hoặc về thành; câu dịch giữ nguyên chỗ lưng chừng ấy (như `pv37:52.4`); (3) bối cảnh tự sự (ai là dạ-xoa, ai được dẫn đi) không có trong phần kệ của bản Pāli root, nên không đưa vào bản dịch. Khối `waiver` và blocker "không có tầng tham khảo tiếng Anh" giữ nguyên (sự thật về upstream). `technical_integrity` giữ 9.6; bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa được chạy trong lượt này.
