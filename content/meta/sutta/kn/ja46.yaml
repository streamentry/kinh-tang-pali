notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất 35 ký tự nên `cần` rỗng. Tự quét
  9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu lược khớp, nháy kép cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 2.1 (dòng chốt, Sujato để trống
  ở mọi bài Jātaka).

  PAI TRUNG NGUYEN VAN — DUNG LAI NGUYEN VAN, VA NO CUNG SUA MOT LOI DOC SAI CUA TOI. Ba khoa
  1.1, 1.2 và 1.3 trùng y hệt với ja47:1.1, 1.2, 1.3 (đã so ký tự). Tôi dùng lại NGUYÊN VĂN
  tiếng Việt đang có ở ja47: Chẳng phải việc lành vô ích / mà dẫn dắt tới sự an lành; / Kẻ ngu
  dốt phá bỏ điều lợi ấy. Điều này không chỉ giữ tầng nhất quán mà còn sửa một lỗi đọc của bản
  nháp: tôi đã dịc Na ve anatthakusalena theo nghĩa “kẻ không hướng đến điều lợi ích”, tức
  mũi câu phủ định — nhưng đó là đọc sai, vì mũi câu này trong kệ ủng hộ điều lành:
  “việc lành không phải là vô ích”. Nếu tôi giữ bản nháp thì bài sẽ đảo ngược thông điệp.

  KHOA 1.4 là của riêng bài này (`kapi ārāmiko` thay cho `koṇḍañño vāruṇiṁ` của ja47) nên tôi tự
  dịch: *y như tên khỉ làm rừng tịch*. `ārāmika` là người ở trong rừng tịch, `kapi` là khỉ.

  `Atthakāmavagga` → *Phẩm Cầu Điều Lành*: đo lại trên đĩa có 4 cách (Phẩm Atthakāma 2 lượt
  chưa dịch, Phẩm Muốn Giúp Người 1 lượt, Phẩm Cầu Điều Lợi 1 lượt là bản nháp của tôi). Tôi
  theo cách ĐÃ dịch của ja42.

  `dummedha` → *ngu dốt* theo ja47 (dùng lại y hệt), `hāpeti` → *phá bỏ* theo ja47. Cả hai vẽ
  đã có tiền lệ trong chính bài kệ trùng.
