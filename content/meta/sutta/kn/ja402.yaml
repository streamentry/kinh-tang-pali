notes: |-
  Dịch trực tiếp từ Pāli root; `english-sujato` tại commit đã ghim không có bài này, `vietnamese-current` vắng với Jātaka.
  Pāli trùng nguyên văn: 3 khoá (`:0.1` `Jātaka` 376/392 nơi, `:0.2` `Sattukanipāta` → “Bộ Bảy Bài Kệ” 12/12, `:0.3` `Kukkuvagga` → “Phẩm Kukku” 6/6). Cả 3 dùng lại nguyên văn. Trong chính phẩm `Kukkuvagga`, ja403 và ja404 đã dùng “Bộ Bảy Bài Kệ” + “Phẩm Kukku”, và bản đó đánh số `7.`/`8.` — khớp về vị trí trong phẩm.
  Thuật ngữ theo tiền lệ đếm được: `vibbhantacitta` → tâm tán loạn (an2.42:1.5, an3.115:1.5); `yakkho` → Dạ-xoa (an4.36:2.5, ud4.4:0.2); `parisumbha` → siết chặt (ja350:1.2); `pamuñca` → rời bỏ (dhp377:2); `uggatejo` → uy lực tột đỉnh (sn2.10:5.2); `bhiṁsarūpa` → hình tướng đáng sợ (ja378:2.2); `sotthi` → an lành (an4.196:9.7); `brāhmaṇa` → bà-la-môn (1.192 nơi).
  Tên bài: `Sattubhastajātaka` giữ nguyên Pāli ở cả `:0.4` và `:9.1`, đúng như ja102 (`Paṇṇikajātaka`) và ja57. Ở `:9.1` Pāli là `Sattubhastajātakaṁ` (có dấu `ṁ`) nên token đó không trùng với token ở `:0.4`; vì từ này đã có trong chính tệp Việt của bài (0.4) nên `lọt_pāli` không báo lỗi. Không dùng `Sattubhastajātakaṁ` có dấu `ṁ` trong bản Việt.
  Bất định, đã ghi ở `notes` chứ không thêm vào thân kinh: (1) `vārigaṇā` ở `:1.2` là loại nước mắt (học giả xếp vào nhóm nước mắt chảy thành dòng); dịch “nước mắt tuôn thành đổi”, không thêm chi tiết nào. (2) `:2.1` `bhariyā` (vợ) + `vajato` (của chồng) + `mamajja` (đừng giết ta) không cho phép chốt chắc các nhân xưng: `vajato` là sở hữu ngôi thứ ba trong khi `mamajja` là mệnh lệnh ngôi thứ hai, nên tôi dịch theo cách ít giả định nhất là một lời cầu, không thêm ai làm gì. (3) `:3.3` và `:5.2` `sattubhasta` là tên riêng xuất hiện đúng hai lần trong toàn bộ Pāli đã ghim (chỉ trong chính ja402), nên tôi giữ nguyên Pāli, không dịch và không suy đoán nó là gì. (4) `:6.1` `janakassa rañño` `janaka` không có tiền lệ trong tầng; đọa theo nghĩa “dòng dõi cao sang”, ghi rõ ở đây. (5) `:6.3` `sabbadassī` (kẻ cố gắng mọi mặt) không có tiền lệ; dịch “mọi sự hấp tấp”.
  Không khoá nào trong 8 bài này có `…pe…` ở Pāli (đã kiểm 296/296 khoá), nên không có dấu lược nào để giữ, và không có chỗ nào bịa dấu lược che chỗ thiếu.
  Đo lại trên đĩa, hai con số coordinator nêu ở mục (4) của prompt KHÔNG khớp: `bhante` trong tầng `mil` dùng **“thưa tôn giả” 149 lần / 71 tệp**, “bạch ngài” chỉ 37 lần / 23 tệp, “bạch thầy” = 0 (giữ nguyên phần đúng của bạn); `mahārāja` dùng **“này Đại vương” 395 lần / 101 tệp**, còn “tâu đại vương” chỉ 169 + “tâu Đại vương” 79 = 248 lần / 32 tệp. Cả 9 bài lân cận mil3.1.12/.14 và mil7.3.1/.9 đều dùng “này Đại vương”, nên lát này theo đo được, không theo con số bạn đưa.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đủ 37/37 khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không trùng nguyên văn Pāli, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
