notes: |-
  **Phạm vi: đủ 146/146 khoá của cnd6, không khoá nào ngoài tập khoá Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Tissametteyya (Pārāyana, câu hỏi thứ hai), tức bài kệ `snp5.3`. Mỗi đoạn kệ được dẫn rồi giải từng cụm; phần chú giải gồm nhiều chuỗi từ đồng nghĩa mang tính công thức, đa số chưa có tiền lệ trong tầng.

  **Cách trình bày lemma.** Pāli đánh dấu từ được giải bằng thẻ in đậm và chữ `ti` kết; thân bản dịch không có nháy ở những khoá ấy nên bản Việt dùng dạng `Từ được giải: lời giải` và kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế như Pāli. Riêng `3.2`–`3.3` giữ nguyên từ `Iccā` bằng Pāli vì lời giải (nối từ, kết hợp từ, hội tụ âm…) nói về chính hình thức của từ ấy; dịch thành *như vậy* sẽ làm mất nghĩa lời giải.

  **Tầng tham khảo — đo, không đoán.** Sujato không có `cnd6`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; tệp `cnd6_translation-en-sujato.json` không tồn tại, chỉ có tệp tên `cnd-name` (nhãn tác phẩm, không phải văn bản). Lớp `english-project` cũng không có cnd. `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự, bỏ khối `:0`) là **68** khoá; Sujato phủ 0/68 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/68, `vietnamese-current` 0/68. Có hai chứng cứ độc lập trong chính corpus: (a) 25 khoá kệ có Pāli trùng nguyên văn `snp5.3` (cộng 5 khoá `1.1`, `1.7`, `10.1`, `17.5`, `18.4` chỉ khác dấu nháy hoặc dấu chấm cuối) mà Sujato có dịch; (b) các đoạn dẫn `sn47.11` ở `24`–`25`. Cả hai là bản của **bài khác**, nên không tính là đối chiếu English của cnd6.

  **Dùng lại tiền lệ.** Đã dò 33 khoá có Pāli trùng nguyên văn với khoá đã dịch ở tầng (kệ `snp5.3`, đoạn `sn47.11`, `dn3`, `dn33`, nhãn `cnd3`/`cnd4`, v.v.): dùng lại nguyên văn ở 26 khoá, khác ở 7 khoá (`10.2`, `17.2`, `18.2`, `27.2`, `18.3`, `27.3`, `25.6`). Ngoài ra `24.2`, `25.3`, `25.7` khác Pāli của `sn47.11` đúng một dấu phẩy và dùng lại câu của `sn47.11`; `25.2` thêm `ajjhattaṁ` nên thêm *ở bên trong*.
  1. `10.2`, `17.2` `(metteyyāti bhagavā)`: `snp5.3:2.2` dịch *(Đức Thế Tôn trả lời:)* và bỏ hô cách `Metteyya`; ở đây chú giải `12.1`–`12.3` giải riêng `Metteyyā` là Đức Thế Tôn gọi bằng dòng họ, nên giữ *Này Metteyya* — sửa chính xác, không dùng lại.
  2. `18.2`, `27.2` `Majjhe mantā na lippati;`: Pāli giống hệt `1.5`/`9.5` nhưng ở `1.5`/`9.5` là câu hỏi, ở `18.2`/`27.2` là câu khẳng định nên chỉ khác dấu `?`/`;`, cùng nghĩa với `snp5.3:1.5`/`3.2`.
  3. `18.3`, `27.3` `Taṁ brūmi mahāpurisoti,`: tầng có hai tiền lệ cho cùng Pāli (`snp5.3:3.3` *Ta nói vị ấy là bậc đại nhân;*, `an6.61:2.3` *Ta gọi là bậc đại nhân,*). Chọn `snp5.3` vì là cùng bài kệ.
  4. `25.6` `dhammesu dhammānupassī…`: Pāli giống hệt `dn33:1.11.8` (*nơi pháp… gạt bỏ tham muốn và ưu phiền*) nhưng cả khoảng `24`–`25` là đoạn dẫn `sn47.11`, nên theo `sn47.11:2.6` (*trên các pháp… nhiếp phục tham ưu ở đời*) để đoạn dẫn nhất quán.
  5. `25.8` Pāli có `bhikkhu`, `sn47.11:2.8` thì không; bản Việt viết *tỳ-kheo có tâm được giải thoát* theo Pāli của cnd6.
  Trong chính bài, Pāli trùng nguyên văn ở 10 nhóm (`1.2=9.2`, `1.3=9.3`, `1.4=9.4`, `1.5=9.5=18.2=27.2`, `1.6=9.6`, `10.2=17.2`, `10.3=17.3`, `10.4=17.4`, `16.6=26.5`, `18.3=27.3`); bản Việt giống nhau ở 9 nhóm, khác ở 1 nhóm (`1.5`/`9.5` so với `18.2`/`27.2`, chỉ dấu câu, lý do ở mục 2).

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `sibbinī` → *thợ may*: tầng có 11 khoá *thợ dệt* (10 ở `an6.61`, 1 ở `thag14.2`) và 2 khoá *thợ may* (đều ở `snp5.3`); chọn *thợ may* theo `snp5.3` (cùng bài kệ, và `sibbati` là *khâu may*). `an6.61` nói *bà thợ dệt* — ngoài lát, báo, không sửa.
  - `abhiññāya`/`saṅkhāya` → *liễu tri* theo `snp5.3:1.4`/`2.4`; ở toàn tầng `abhiññāya` có 105 khoá *thắng tri* và 52 khoá *liễu tri*. Cả hai cùng được dịch *liễu tri* trong kệ nên lời giải `5.1`/`14.3` dùng đúng *liễu tri* để lemma khớp kệ; hai từ khác nhau được phân biệt bởi chuỗi từ giải.
  - `anta` → *đầu* (khớp *hai đầu* của kệ `snp5.3`); `an6.61` dùng *bên*. `sukhā`/`dukkhā vedanā` → *thọ lạc*/*thọ khổ*: tầng có *lạc thọ* 49, *thọ lạc* 24, *thọ khổ* 87, *khổ thọ* 24; chọn cặp *thọ lạc*/*thọ khổ* cho nhất quán và theo đa số của *thọ khổ*. `adukkhamasukhā` → *không khổ không lạc* (36/54).
  - `sakkāya` → *hữu thân* (`dn33`, `mn44`) trong danh sách `anta`, và *thân kiến* ở `sakkāyadiṭṭhi`.
  - Danh sách phiền não `kodha…pamāda` theo `mn7:3.2` (*giận dữ, hằn học, gièm pha, hơn thua, ganh tị, keo kiệt, giả dối, xảo trá, bướng bỉnh, hung hăng, …, ngạo mạn, tự mãn, phóng dật*); riêng `māna` giữ *ngã mạn* (khớp `māniñjita` ở `4.1`) thay vì *kiêu mạn* của `mn7`.
  - `iñjita` → *dao động* theo `snp5.3`; `diṭṭhivipphandita` ở `21.2` theo `mn2:8.9` cũng là *sự dao động của kiến*. Hai chữ Việt trùng nhau nhưng thuộc hai từ Pāli khác nhau; chưa có chữ Việt thứ hai được tầng chuẩn hoá nên giữ theo tiền lệ.
  - `saṅkhā samaññā paññatti vohāro` theo `mil3.1.1:2.3` (*cách gọi, danh xưng, sự chế định, cách nói thông dụng*). `ārati virati paṭivirati veramaṇī` theo `mn117:20.2`. `nicchāto nibbuto sītibhūto sukhappaṭisaṁvedī brahmabhūtena attanā viharati` theo `mn51:5.10`. `vimariyādikatena cetasā` theo `sn14.33:4.1` (*tâm không còn giới hạn*). Chuỗi *gerund* `jānitvā tulayitvā tīrayitvā vibhāvayitvā vibhūtaṁ katvā` (0 tiền lệ trong tầng) dịch *đã biết, đã cân nhắc, đã thẩm xét, đã làm cho rõ ràng, đã làm cho sáng tỏ*.

  **Số Pāli.** `vīsativatthukā` = 20 (*hai mươi cơ sở*); `dasavatthukā` ×2 = 10; `dvāsaṭṭhi` = dvā 2 + saṭṭhi 60 = 62 (*sáu mươi hai*); `aṭṭhasata` = aṭṭha 8 + sata 100 = 108 (*một trăm lẻ tám*); `catūhi kāraṇehi` = 4 (*bốn lý do*, khớp bốn lần `satipaṭṭhāna` ở `13.6`–`13.7`); `sattannaṁ dhammānaṁ` = 7; `dve kāmā` = 2; `dve lepā` = 2; `aṭṭhaṅgiko` = 8 chi (đủ tám, khớp `dn33:3.1.7`). `anekapāṇasahassānaṁ` (`28.1`) chỉ là *nhiều ngàn* chứ không có số cụ thể, dịch *nhiều ngàn người*. Các số trên đều tự tính tay từ cấu tạo từ; bài không có cụm `tiṁsakappasahassa` hay cụm chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `7.2` `kaṁ passati` là ngôi ba trong chuỗi động từ ngôi hai (`brūsi kathesi maññasi bhaṇasi … voharasi`). Chuỗi là câu hỏi hướng đến Đức Thế Tôn nên bản Việt đọc `passati` như *thấy*, không phản ánh ngôi; có thể là chính tả của bản Pāli ghim.
  2. `28.4` hợp từ `ajinajaṭāvākacīratidaṇḍakamaṇḍalukesā ca massū ca`: đọc là *da linh dương, tóc bện, y vỏ cây, gậy ba chạc, bình nước, tóc* và *râu*; ranh giới `jaṭā`/`kesā` (tóc bện / tóc) là cách đọc, không chắc hoàn toàn.
  3. `8.1` `ajjhagā` đứng đầu chuỗi động từ đồng nghĩa (`ajjhagā upaccagā atikkanto samatikkanto vītivatto`); `26.3` là `accagā`. Cả hai dịch *đã vượt qua*; sắc thái khác nhau giữa năm động từ chỉ được phân biệt bằng *qua / lên / khỏi / hẳn / quá*, không có chứng cứ độc lập.
  4. `13.4` chuỗi trạng từ thời gian có hai từ ít gặp (`poṅkhānupoṅkhaṁ` *tên nối tên*, `udakūmikajātaṁ` *sóng nước nối nhau nổi lên*) đọc theo nghĩa gốc, 0 tiền lệ trong tầng.
  5. `11.9`/`11.11` chuỗi `upeto samupeto upāgato samupāgato upapanno samupapanno samannāgato` (0 tiền lệ) dịch theo nghĩa gốc của từng tiền tố.
  6. Tên tác phẩm: `niddesa` → *Kể Lược* theo `cnd3`/`cnd4` (*Tiểu Tập Kể Lược*) để cùng tầng nhất quán, dù *Diễn giải* sát nghĩa hơn; người biên tập có thể đổi hàng loạt cho cả Cūḷaniddesa khi chốt tên.
  7. `13.3` có `nicchāto` dịch *không còn đói khát* theo `mn51:5.10`; nghĩa gốc là không còn khát ái.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (146/146, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` và dấu lược `…` khớp Pāli từng khoá (0/146 lệch; 12 khoá có `…pe…`, đều thành đúng một `…`); không có `(…)` ở Pāli nên không có ở Việt; 0 khoá rỗng; NFC; không khoảng trắng thừa; Pāli lọt sang Việt chỉ gồm tên riêng và lemma `Iccā`.
