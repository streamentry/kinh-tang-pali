notes: |-
  **Phạm vi: đủ 235/235 khoá của `cnd1`** (Kệ Dẫn Nhập, `Vatthugāthā`, mở đầu Cūḷaniddesa). Khoá `0.4` (*Namo tassa…*) giữ nguyên câu đã có; 234 khoá còn lại dịch trong lượt này. Không có khoá nào ngoài tập khoá Pāli, thứ tự khoá đúng thứ tự Pāli.

  **Quan hệ với `snp5.1` (đã đo).** Bài này chép lại nguyên các kệ Vatthugāthā của Kinh Tập 5.1. Đối chiếu từng khoá: **218/235** khoá có Pāli trùng `snp5.1` khi bỏ khác biệt chữ hoa và gạch nối; **203/235** khoá dùng lại **nguyên văn** bản Việt của `snp5.1`. Trong 218 cặp trùng, **21** cặp bản Việt khác `snp5.1`, và đều có lý do truy được về Pāli (xem dưới). Thêm **13** khoá có biến thể Pāli thật so với `snp5.1`: `2.2` · `13.1` · `14.2` · `22.2` · `27.4` · `30.4` · `36.1` · `36.2` · `41.2` · `41.4` · `46.3` · `51.4` · `52.2`; bốn khoá đầu (`0.1`–`0.4`) là tiêu đề và câu kính lễ. Sáu khoá trong số biến thể (`13.1` `22.2` `27.4` `36.2` `51.4` `52.2`) chỉ khác chính tả hoặc ngôi lịch sự, cùng nghĩa, nên giữ câu của `snp5.1`.

  **21 khoá khác `snp5.1` dù Pāli trùng — vì sao.** (1) **Lệch ranh giới khoá** trong `snp5.1`: ở `12.1`–`12.2`, `25.1`–`25.2`, `26.1`–`26.2`, `30.1`–`30.4`, `48.3`–`48.4`, `49.1`–`49.4`, `50.1`–`50.2`, bản Việt của `snp5.1` đặt nội dung của khoá này sang khoá bên cạnh (ví dụ `49.1` đang mang nghĩa của `49.3`; `50.1` đang mang nghĩa của `50.2`). Bài này dịch lại đúng nội dung từng khoá theo Pāli để bốn cột đối chiếu không lệch. Đây là chỗ nên rà lại `snp5.1`; lượt này **không** sửa bài đó. (2) **Dấu nháy**: `19.1` bỏ nháy quanh *Chánh Đẳng Giác* vì Pāli `Sambuddhoti` không có nháy ở khoá này; `29.4` bỏ dấu nháy đóng thừa vì lời nói của Bāvari kéo dài đến `30.4`. (3) `31.2` bỏ chữ *thanh niên* vì Pāli chỉ nói `brāhmaṇā`; `38.2` tách *Vesālī* khỏi *thành của xứ Magadha* (`vesāliṁ māgadhaṁ puraṁ` là hai địa danh).

  **Pāli trùng trong chính bài.** `6.4`/`11.4` (`idaṁ vacanamabravi`), `13.3`/`15.3`/`29.3`/`50.1` (`Muddhaṁ muddhādhipātañca`), `25.2`/`26.2` (`mahāpurisalakkhaṇā`), `30.3`/`49.3` (`Manasā pucchite pañhe`): 4 nhóm. `25.2`/`26.2` và `30.3`/`49.3` dịch **giống hệt** nhau; `6.4`/`11.4` khác chữ đầu (*rồi*/*và*) theo mạch câu liền trước; nhóm `muddhaṁ muddhādhipātañca` khác ở dấu câu và chữ hoa theo vị trí (dấu hỏi ở `15.3`, mở nháy ở `50.1`), không khác nghĩa.

  **Chỗ còn bất định (chỉ ghi ở đây, không thêm vào thân kinh):**
  - `2.2` `samāsane`: lấy theo `snp5.1` là *tại trú xứ của …*. Nghĩa sát hơn có thể là *giáp ranh/kề bên xứ Maḷaka*; chưa có chú giải đã ghim để phân xử nên không đổi.
  - `36.1` `Maḷakassa patiṭṭhānaṁ`: dịch **Patiṭṭhāna của Maḷaka** (tên thành, như bản Anh của `snp5.1` đọc là tên thành). `snp5.1:36.1` đang dịch *nơi định cư*; hai bài hiện chưa thống nhất ở chỗ này.
  - `41.2` `Pītaraṁsiṁva`: *tia sáng vàng*, theo 5 khoá `tha-ap` có cùng cụm `pītaraṁsiṁva bhāṇumaṁ` (đều dịch *vàng*). `snp5.1:41.2` có biến thể Pāli khác (`Sataraṁsiṁva`, *trăm tia*), nên hai bài khác nhau là đúng.
  - `46.3` `Taṇhacchida` (*bậc đoạn trừ ái*) khác `snp5.1:46.3` (`Kaṅkhacchida`, *bậc đoạn trừ nghi hoặc*): là biến thể Pāli thật.
  - `3.2` `gāmo ca vipulo ahu` giữ cách đọc của `snp5.1` (*một ngôi làng lớn đã hình thành*); cách đọc *đã có một ngôi làng thịnh vượng nương vào ông* cũng hợp lý.
  - `49.1`–`49.4`: cấu trúc câu (*ai* là người hỏi, *ngài* đáp cho ai) dịch theo cách đọc Pāli tự nhiên; câu `kametaṁ paṭibhāsati` có thể đọc là *đang đáp lời ai*.
  - `0.3` `Vatthugāthā` dịch *Kệ Dẫn Nhập* theo `snp5.1:0.2` (trước đây bản nháp giữ nguyên chữ Pāli vì chưa có tiền lệ).

  **Tên tác phẩm.** `0.1` *Tiểu Tập Kể Lược* và `0.2` *Phẩm Bờ Kia* theo `cnd3:0.1`–`0.2` và `cnd4:0.1`–`0.2`; `0.3` *1. Kệ Dẫn Nhập* cùng khuôn với `cnd3:0.3` (*3. Kệ Tán Thán Phẩm Bờ Kia*) và `cnd4:0.3`.

  **Số Pāli đã tính.** `satāni pañca`/`pañcasatāni` = năm trăm (`5.4`, `7.4`, `45.3`); `sattame divase` = ngày thứ bảy (`8.3`); `sattadhā` = bảy mảnh (`8.4`); `dvattiṁsāni` = ba mươi hai (`25.3`); `dveyeva` = hai, `tatiyā` = thứ ba (`26.3`–`26.4`); `soḷasa` = mười sáu (`31.2`); `pannarase` = ngày mười lăm (`41.3`); `vīsaṁ vassasataṁ` = 20 + 100 = một trăm hai mươi (`44.1`); `tīṇi` lakkhaṇā = ba tướng, `tiṇṇaṁ vedāna` = ba Vệ-đà (`44.3`–`44.4`). Không có số lớn nhân thang.

  **Tầng tham khảo — đo, không đoán.** Pāli root: 235 khoá. Bản Anh Sujato **không có** cho `cnd1`: edition đã ghim chỉ có tệp tên mục `cnd-name`, không có tệp kinh `cnd1` (tra manifest; thư mục `kn/` của edition chỉ có `cp` `dhp` `iti` `ja` `kp` `snp` `thag` `thig` `ud`) ⇒ `not-published-upstream`. Lớp `english-project` cũng không có `cnd1`. `vietnamese-current` chỉ có Pháp Cú. **Coverage English: mẫu số = 0** (không khoá Pāli nào ≥ 40 ký tự, vì đây là kệ từng câu ngắn), nên cổng coverage **không đo được gì**; điều đó không phải là *đã đối chiếu English*. Ba tầng tham khảo đều vắng ⇒ `triangulation` đặt 8.0 (không cao hơn), `status` là `draft` kèm blocker `noEnglishEditionUpstream`, không nâng điểm để né blocker. Với chính các kệ này, Sujato có bản dịch cho `snp5.1` (một bài khác, cùng bài kệ); `snp5.1` đã `published` với `triangulation` 9.3 trong metadata của nó, và bài này kế thừa nguyên văn bản Việt đó cho 203 khoá (sau khi đã đối chiếu lại với Pāli của `cnd1`). Đó là bằng chứng gián tiếp, không phải tầng Anh của `cnd1`.

