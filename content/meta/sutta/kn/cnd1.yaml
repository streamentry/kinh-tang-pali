notes: |-
  **Phạm vi: đúng một khoá** (`cnd1:0.4`) trong 235 khoá Pāli. **Lưu ý đặc biệt:
  khoá này nằm trong khối tham chiếu `:0`**, mà `isSubstantive` của
  `src/lib/canon/reference.ts` loại khối `:0` khỏi metric coverage. Nhưng `kiểm` của
  `_hvi.py` không có ngoại lệ đó, nên vẫn đòi khoá này — và tôi dịch theo `_hvi.py`.
  Đây là lý do `cnd1` **không** xuất hiện trong `shown` của `q_next.json` (metric
  coverage) mà vẫn nằm trong lát này: hai bộ quy tắc đo khác nhau, không phải lỗi
  đếm. Tôi dịch khoá được giao và **không** tự thêm 234 khoá còn lại.

  **Tiêu đề ghép cả ba dòng tiêu đề** vì chúng không có bản Việt: `cnd1:0.1` =
  *Cūḷaniddesa*, `0.2` = *Pārāyanavaggagāthā*, `0.3` = *1. Vatthugāthā*. *Phẩm Bờ Kia*
  theo tiền lệ `snp5.19` đã dịch `Pārāyanānugītigāthā` = *Kệ Tiếp Theo Phẩm Bờ Kia*.
  **`Vatthugāthā` tôi giữ nguyên chữ Pāli trong tiêu đề, không dịch** — `vatthu` ở đây
  chưa được chính bản Pāli giải ngay trong `cnd1` (chỗ duy nhất Pāli giải từ là
  `cnd1:16.1` và `:37.3`, đều là **tên địa danh** Kapilavatthu), nên dịch nó là bịa.
  `Cūḷaniddesa` → *Tiểu Tập Kể Lược* cũng đặt mới: 0 tiền lệ trong tầng Việt.

  Câu này xuất hiện **17 lần** trong snapshot Pāli đã ghim. Trong tầng Việt
  đã có sẵn **hai** cách dịch khác nhau, nên đây là chỗ bắt buộc phải tra tiền lệ:
  *Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác.* (`pv1:1.1`, `ja1:1.1`,
  `thag1.1:1.0.2` — 3/5 cách đã có), *Kính lễ Đức Thế Tôn, …* (`kp1:1.1`) và
  *Kính lạ Đức Thế Tôn, …!* (`thig1.1:1.0`). Tôi dùng lại nguyên văn cách đa số.

  **Bất định đã ghi nhận, chưa có cách nào tuyệt đối:** `bhagavato` là
  *Bậc Đã Được Vinh Danh*, mà *Đức Thế Tôn* giữ nghĩa đó sát hơn *Đức Phật*. Tôi vẫn
  chọn *Đức Phật* vì đó là cách đã có sẵn 3/5 trong tầng và là lối đọc quen với người
  Việt; ở chính lát này tôi dùng *Đức Thế Tôn* cho `bhagavato` ở chuỗi `bhagavato
  vaṁso` (xem `notes` của các phẩm bv), vì đó là cách dùng quen thuộc cho các Đức
  Phật quá khứ. Biên tập có thể muốn thống nhất hai chỗ này.

  **Không có tầng Anh.** 0/235 khoá có Anh Sujato (không có cả tệp Anh cho `cnd1`),
