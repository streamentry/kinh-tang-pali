notes: |-
  NHÁY KÉP PHẢI SỬA, VÀ ĐÂY LÀ SỬA ĐÚNG ĐẮN. Pāli 1.4 kết bằng `”ti.` nhưng CẢ BÀI không
  mở nháy kép ở bất kỳ khoá nào — kiểm bằng script trên toàn bộ Pāli đã ghim thì chỉ 6 bài có
  chuyện này (mn38, mn99, mn105, mn148, dn23, dn30). Tầng Việt yêu cầu ngoặc kép cân trên cả bài, và
  đây rõ ràng là một câu kệ được trích dẫn, nên tôi mở nháy ở 1.1. Đây là sửa CHỮ TÍN HÚT, không
  thêm nghĩa nào. Nếu quý vị muốn giữ nguyên Pāli thì phải sửa quy tắc của tầng, không sửa ở đây.
  `vissase` = đặt lòng tin, tin tưởng (tiền lệ ja93:1.1, sn3.11:9.2). `Adiṭṭhapubbake pose` =
  "với kẻ chưa từng thấy mặt" — `adiṭṭha` là chưa từng thấy, `pubbake` là kẻ trước, nên "kẻ
  chưa từng quen biết". `pasīdati` = trong sáng, thanh tĩnh (tiền lệ snp3.2:10.4 "Tâm ta lại càng
  thêm trong sáng"). `Sāketa` giữ Pāli, tên địa danh; Sujato cũng giữ "Sāketa".
  `Itthivagga` → "Phẩm Phụ Nữ" (5 tệp). Vì `cần` RỖNG, tôi tự quét MỌI khoá — sạch. Không chạy
  npm (đợt này cấm) nên technical_integrity = 9.6.

  Quyết định hội đồng biên tập 2026-10-16: C1 — :0.4, :2.1, translationTitle (cùng tên Pāli cùng tên Việt); C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
