notes: |-
  Đợt 19, làn 69. Dịch từ Pāli root commit đã ghim, đủ 96/96 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; vì vậy người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung kệ (xem bất định 1). Phần lớn kệ 1–13 của bài này có Pāli trùng với Nimi Jātaka (`ja541`), nhưng `ja541` chưa có bản Việt trong tầng tại thời điểm dịch nên không dùng lại được nguyên văn.

  **Tiêu đề.**
  - `0.2` “Bộ Tạp Tập” và `0.3` “Phẩm Ruộng Lúa”: dùng lại nguyên văn các bài cùng bộ, cùng phẩm (`ja484`, `ja486`, `ja487`). Cả hai là khoá Pāli trùng nguyên văn.
  - `0.4` “11. Kinh Sādhina”: `Sādhina` là tên vua, giữ phiên âm theo khuôn “N. Kinh <tên riêng>” của `ja486:0.4` (“Kinh Mahāukkusa”), `ja487:0.4` (“Kinh Uddālaka”) và `ja492:0.4`. Số `11.` ở `0.4` và `ekādasamaṁ` ở `21.1` đều là 11 ⇒ “thứ mười một” khớp (tiếp nối `ja492` là thứ chín). `21.1` “Kinh Sādhina, thứ mười một.” theo khuôn `ja491:18.1`. Lưu ý: `mil5.1.4:7.4` viết tên vua này là “Sādhīna” (dài ī); bài này theo Pāli root của chính nó (`sādhino`, `sādhinajātaka`).

  **Tiền lệ dùng lại nguyên văn: 59 khoá Pāli trùng nguyên văn với bài khác trong tầng kn, trong đó chỉ 11 khoá có bản Việt đã dịch (48 khoá còn lại trùng với `ja541`, `ja542`, `ja547`, `tha-ap…` v.v. chưa có bản Việt, hoặc chỉ trùng ở bài chưa dịch). Dùng lại nguyên chữ 5 · chỉnh nhẹ 2 · lệch có chủ ý 4.**
  - Dùng lại nguyên chữ (5): `0.2`, `0.3` (cùng phẩm: `ja484`, `ja486`, `ja487`); `2.4` và `6.2` “Vedeha, chủ thành Mithilā” (= `ja160:1.2`, chỉ khác dấu cuối khoá theo Pāli); `20.2` “do bậc Chánh Đẳng Giác thuyết giảng” (= `thag3.3:3.2`, `thag3.15:3.2`, `dhp392:2`; 4 nơi “thuyết giảng”, 1 nơi `tha-ap490:11.2` “chỉ dạy”).
  - Chỉnh nhẹ (2): `7.2` “đến trú xứ của những vị có quyền tự tại” theo `pv16:17.6` (“là trú xứ của những vị có quyền tự tại”, bỏ “là” vì ở đây là tân ngữ của `anuppatto`); đo 14 khoá chứa `āvās…`: “trú xứ” 7, “nơi ở” 1, “chỗ ở” 1. `13.4` `saṁyamena damena ca` → “bằng thu thúc và điều phục” theo `snp3.9:67.2` (“do thu thúc và điều phục”, đổi “do” thành “bằng” cho khớp 13.3 `dānena … saṁyamena`); `kp8:6.2` dịch “biết tiết chế và tự chủ” vì có “biết” từ văn cảnh. Đo 49 khoá chứa `saṁyam…`: “tự chế” 22, “thu thúc” 6, “chế ngự” 6, “tiết chế” 2; “tự chế” phần lớn thuộc `saññata/asaññata`, không phải cặp `saṁyama` + `dama`.
  - Lệch có chủ ý (4): (a) `7.5`, `10.3`, `18.3` `Tāvatiṁsesu devesu`: `tha-ap191:1.1` dịch “Trong cõi trời Tāvatiṁsa” và bỏ `devesu`; ở đây `devesu` đứng riêng và 7.3–7.4 / 18.4 còn đối ứng “chư thiên” nên giữ “giữa chư thiên cõi Ba Mươi Ba” (đo 50 khoá chứa `tāvatiṁs…`: “ba mươi ba” 41, “Tam Thập Tam” 2, “Đao Lợi” 1). (b) `11.3` `Evaṁsampadamevetaṁ`: `ja354:7.3`, `ja354:9.3` dịch “Cũng vậy, ai khóc than” (câu ví von khác hẳn, `evaṁ` là “cũng vậy”); ở đây là “điều này cũng chỉ là sự thành tựu như thế” sau hai ví dụ “đi mượn”, nên không dùng lại.
  - Gần trùng nhưng không trùng byte, đã đọc: `20.4` `yena gacchanti subbatā”ti` với `snp3.2:17.4` (“Mà những bậc khéo trì giới đã đi.”) và `ja487:16.4` (“…những người khéo trì giới”): dùng “những bậc khéo trì giới” (20 khoá chứa `subbat…`), đổi “đã đi” thành “đi” vì `gacchanti` là hiện tại; `13.3` `Dānena samacariyāya`: `iti22:5.3`, `iti60:3.3` dịch `Dānañca samacariyañca` “bố thí và hạnh lành” (xem thuật ngữ); `3.2` = `10.2` = `ja541:27.2` (`rājaseṭṭha disampati`, `ja541` chưa dịch).
  - Phần lớn kệ 1–13 của bài này có Pāli trùng với Nimi Jātaka (`ja541`), nhưng `ja541` chưa có bản Việt trong tầng tại thời điểm dịch nên không dùng lại được nguyên văn.

  **Trùng nguyên văn trong chính bài:** 96 khoá, 6 nhóm Pāli trùng (sau khi nén khoảng trắng và hạ chữ hoa): `2.4` = `6.2` (`vedehaṁ mithilaggahaṁ`), `3.2` = `10.2` (`rājaseṭṭha disampati`), `7.4` = `18.4` (`sabbakāmasamiddhisu`), `7.5` = `10.3` = `18.3` (`Tāvatiṁsesu devesu`), `7.6` = `10.4` (`bhuñja kāme amānuse”.`), `11.4` = `12.2` (`yaṁ parato dānapaccayā`). Bản Việt của cả 6 nhóm giống hệt nhau về chữ (chỉ khác dấu cuối khoá đúng như Pāli: `.` ở 11.4 và `;` ở 12.2, `;` ở 7.4 và `.` ở 18.4); 0 lệch. Cặp `2.4`/`6.2` lúc đầu bản nháp viết `6.2` thêm chữ “vị”; phép so bắt được và đã sửa cho khớp.

  **Số Pāli:** không có số lượng cần tính trong thân kệ. `sahassa` (`4.3` `Sahassayutta`) = 1.000 ⇒ “một ngàn”; số `11.` ở `0.4` và `ekādasamaṁ` ở `21.1` đều bằng 11. `Tāvatiṁsa` giữ “Ba Mươi Ba” (33; 41/50 khoá chứa `tāvatiṁs…` dùng “ba mươi ba”, “Tam Thập Tam” 2, “Đao Lợi” 1).

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `devaputta` (2.1) → “thiên tử”: `iti83:2.3`; tầng có 39 khoá chứa `devaputt…` (nhiều khoá là tên riêng). `mahiddhika` (2.1) → “có đại thần lực”: tầng dịch “có thần thông và oai lực lớn” (`ud4.4`) cho `mahiddhiko mahānubhāvo`; ở đây chỉ có `mahiddhika` đứng riêng nên chọn “đại thần lực”.
  - `devasārathi` (2.2) → “người đánh xe của chư thiên”: theo `ja470:14.2` (1 tiền lệ). `Mātali` giữ phiên âm (`ja31:1.1`, `ja470:14.2`, `vv47`).
  - `Vedeha`/`mithilaggaha` → “Vedeha, chủ thành Mithilā”: theo `ja160:1.2` và `ja170:2.4`.
  - `disampati` → “chúa tể bốn phương”: đo 7 khoá, “chúa tể bốn phương” 5 (`ja351:5.2`, `ja422:6.2`, `ja422:8.2`, `ja452:10.2`), “chúa tể muôn dân” 1 (`ja332:4.2`), 1 khoá tên riêng (`ja465:3.2`). `rājaseṭṭha` → “bậc vua tối thắng” (`ja111:1.2`, `mil7.3.10:7.3`; `ja411:2.4` “bậc vua trong các vua”).
  - `Sakka`: 35 khoá chứa `sakko…`, giữ “Sakka”. `Vāsava` (6.4) giữ phiên âm (4/5 khoá chứa `vāsava…` giữ “Vāsava”). `saindakā` (3.4) → “cùng với Đế Thích”: tầng không có tiền lệ cho `Inda` đứng riêng; chọn “Đế Thích” để thống nhất với `ja492`, và vì Pāli dùng ba tên khác nhau (Sakka, Vāsava, Inda) cho cùng một vị nên bản Việt giữ ba tên (Sakka, Vāsava, Đế Thích) thay vì gộp thành một. `devarājā` (5.4, 17.3) → “vua chư thiên”: đo 54 khoá chứa `devarāj/devānamind…`, “vua trời” 16, “chúa chư thiên” 8, “vua chư thiên” 4, “chúa tể chư thiên” 4.
  - `Tāvatiṁsa` → “cõi Ba Mươi Ba”, `tidasa` (17.4) → “chư thiên Tam Thập”: `tidasa` tầng không đồng nhất: `ja391:2.4`, `ja470:14.3` “ba mươi ba vị trời”, `snp3.11:1.1`, `bv29:11.1` “Tam Thập”; hai bên 2–2, chọn “Tam Thập” để giữ chữ Pāli là “ba mươi” (tidasa = ba mươi), tránh gộp thành 33 khi Pāli không viết 33.
  - `rājīsi` (5.3, 7.3) → “vương tiên”: 0 tiền lệ cho từ này trong tầng; `rāja` + `isi` (vua + hiền giả/ẩn sĩ); `ja422:14.1` dịch `isinā` “ẩn sĩ”. Chọn “vương tiên” như một danh xưng cô đọng, xin người điều phối quyết một lần nếu muốn “vua ẩn sĩ”.
  - `amānusa` (7.6, 10.4, 18.2) → “không thuộc loài người”: tầng không có tiền lệ cho cụm `kāme amānuse`; không dùng “phi nhân” vì dễ hiểu là loài phi nhân (ma quỷ).
  - `vasavattī` (7.2) → “có quyền tự tại”: theo `pv16:17.6`; tầng khác (`iti22`, `iti95`) dùng “tự tại”.
  - `sabbakāmasamiddhisu` (7.4, 18.4): hiểu là định ngữ của `devesu`, “những vị đầy đủ mọi dục lạc sung túc”, theo `ja346:1.2` (“nơi đầy đủ mọi dục lạc sung túc” cho cùng từ ở sở hữu cách số nhiều).
  - `puñña` (9.3, 12.3, 19.2) → “phước”: đo 119 khoá chứa `puñña…`, “phước” 96, “công đức” 14, “thiện” 7. `vipāka` (9.4) → “quả báo”.
  - `yācitaka` (11.1, 11.2) → “đi mượn”: tầng 0 khoá chứa `yācitak…`; nghĩa “mượn, đi xin được” rõ từ ngữ cảnh (đối lập với tài sản “tự mình làm”). `āveṇika` (12.4) → “riêng”: 0 khoá trong tầng.
  - `khetta` (14.1, 16.1) → “thửa ruộng”: đo 60 khoá chứa `khett…`, “ruộng” 54. `nikkha` (14.2) giữ phiên âm “nikkha”, theo `ja478:13.3` (“những nikkha làm bằng vàng ròng”); `ja456:3.3` dịch “đồng vàng”, `dhp230:1` “vàng ròng”; Pāli ở đây không nói là vàng nên không thêm. `sukuṇḍala` → “hoa tai đẹp”: `kuṇḍala` đo 48 khoá, đa số là tên riêng (`Maṇikuṇḍala…`) hoặc “vòng/hoa tai”.
  - `haritānūpā` (14.3) → “những vùng đất ẩm xanh tươi”: `anūpa` = đất ẩm ướt, bãi nước; tầng 0 tiền lệ (30 khoá chứa `anūpa…`, không khoá nào đã dịch theo cách này).
  - `pokkharaṇī` (15.1) → “hồ sen”: `ja195:1.2`, `ja396:6.2`. `cakkavāka` (15.2) → “vịt trời”: đo 26 khoá chứa `cakkavāk…` có bản dịch: “uyên ương” 9, “vịt trời” 6 (gồm `ja434`, cùng loại Jātaka), “chim cakkavāka” 2; chọn “vịt trời” theo `ja434`, vì “uyên ương” thường chỉ loài khác. `padumuppalaka` (15.4) → “sen đỏ và sen xanh”: theo `tha-ap162:1.3`, `tha-ap475:12.2` (2 khoá). `mandālaka` (15.3): giữ phiên âm “mandālaka”; không có tiền lệ (0 khoá đã dịch).
  - `ārāmavanūpacārā` (16.2) → “khu vườn, khu rừng và vùng phụ cận”: tầng 0 khoá cho từ ghép này. `janatā` (16.3) → “người dân”.
  - `vimāna` (17.1) → “cung điện”: dùng “cung điện” như `ja487:15.2`. `bhavana` (18.1) → “cung điện”.
  - `subbatā` (20.4), `sammāsambuddha` (20.2), `saṁyamena damena` (13.4): xem trên. `adaṇḍāvacara` (20.1) → “đi không dùng gậy”: `adaṇḍa` ở `snp3.7:8.8` dịch “không roi, không đòn”; tầng 0 khoá cho từ ghép `adaṇḍāvacara`.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: 96/96 khoá khớp số lượng cả `“`, `”`, `‘`, `’`, `"`, `…` và `(…)` (0 lệch). Pāli có 8 cặp nháy kép (1.1–1.4; 3.1–3.6; 5.1–5.4; 7.1–7.6; 8.1–8.5; 9.1–10.4; 11.1–16.4; 17.1–20.4; Việt cũng 8 cặp ở đúng khoá, 8 “ · 8 ”); các khổ 2, 4, 6 là lời kể, không có nháy; nháy đơn: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (phép so “…pe…” chạy rỗng vì Pāli không có lược). `8.5` Pāli kết `”.` còn Việt kết `?”` vì là câu hỏi (`udāhu … janindaseṭṭha`); phần đếm nháy vẫn khớp. NFC: 96/96 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa, chữ số chỉ có ở `0.4` (“11.”).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ nội dung kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1: lời cảm thán của dân chúng/người kể; 2, 4, 6: người kể; 3: Mātali; 5: chư thiên; 7: Sakka; 8: vua Sādhina (đối thoại với Nārada hoặc Sakka; từ hô `janindaseṭṭha` ở 8.5 không cho biết chắc người nghe); 9–10: Nārada (vì 16.4 vua gọi `nārada`, và 9.2 người nói gọi người nghe là `naravīraseṭṭha`); 11–16: vua; 17–20: vua. Tất cả là suy luận từ nội dung, không ghi vào thân kinh.
  2. `Sahassayuttamāruyha` (4.3): `sahassayutta` = “được thắng một ngàn”; Pāli không nói thắng bằng con gì. Bản Việt giữ nguyên “được thắng một ngàn” mà không thêm “ngựa” để không đưa chi tiết ngoài root. Cách hiểu thông thường là một ngàn con ngựa.
  3. `Samacchare` (3.6): hiểu là “đang tụ họp, đang ngồi cùng nhau”; `Sudhammāyaṁ` (3.6) là vị trí cách của `Sudhammā` (tên hội đường của chư thiên cõi Ba Mươi Ba trong truyền thống). Bản Việt viết “tại Sudhammā” chứ không thêm “hội đường”, vì Pāli chỉ nêu tên.
  4. `Adurāgataṁ` (5.2): “việc đến không khó nhọc/không vất vả”, đối ứng với `svāgataṁ`; cũng có thể hiểu hẹp hơn là “không đến sai lúc”. Cùng hướng nghĩa.
  5. `Parato dānapaccayā` (11.4, 12.2): hiểu là “điều có được từ người khác do duyên bố thí”, tức quả sung sướng nhận được nhờ việc bố thí của người khác/hoàn cảnh bên ngoài, đối lập với `sayaṅkatāni puññāni` “các phước tự mình làm” (12.3). `Evaṁsampadam` (11.3) hiểu là “sự thành tựu như thế”. Một cách đọc khác của `dānapaccayā` là “vì nhân là việc cho (của người khác cho)” – cùng hướng nghĩa nhưng chỗ nhấn khác nhẹ.
  6. `Imaṁ nikkhaṁ sukuṇḍalaṁ` (14.2): có thể là một danh từ ghép (“nikkha có hoa tai đẹp”) hoặc hai vật (“nikkha” và “hoa tai đẹp”); bản Việt chọn “nikkha cùng hoa tai đẹp”, trung tính.
  7. `Yassimāni mamāyiṁsu, kiṁ nu te disataṁ gatā` (15.5–15.6): `yassimāni` = `yassa` + `imāni`, nhưng chủ ngữ số nhiều `te` ở vế sau cho thấy cả cụm chỉ những người xem các thứ ấy là của mình. Bản Việt: “những ai đã xem các thứ này là của mình, họ đã đi về phương nào?”. Cách đọc khác: `mamāyiṁsu` “đã quý mến/ôm giữ” và `yassa` chỉ chủ nhân của chúng; vẫn cùng ý (người đã sở hữu/quý chúng nay đi đâu). `disataṁ` hiểu là “về phương nào” (so `vv20:2.4`).
  8. `Ārāmavanūpacārā` (16.2): `upacāra` = vùng lân cận, nơi lui tới; hiểu là “vùng phụ cận” của vườn và rừng. Cũng có thể hiểu là “những khu vườn rừng làm nơi dạo chơi”.
  9. `Suññaṁva me nārada khāyate disā` (16.4): “phương trời dường như trống rỗng đối với ta”; `disā` số ít, có thể chỉ một phương cụ thể hoặc cả vùng trời; chọn “phương trời”.
  10. `Puññāyamhi idhāgato` (19.2): `puññāya` + `amhi` (“ta ở đây/đã đến vì phước”); `idha` (“ở đây”) hiểu là cõi người, đối với cõi trời; bản Việt viết “nơi này”.
  11. `Nāhaṁ rajjena atthiko` (19.4): “ta không cần gì đến vương quốc” (`cp23:8.2`); có thể hiểu là “ta không còn cần vương quyền”.
  12. `Adaṇḍāvacaraṁ maggaṁ` (20.1): `avacara` ở đây hiểu là “đi/sống không dùng gậy” (không bạo lực); cũng có thể là “lĩnh vực không có gậy”. Chọn “đi không dùng gậy”.
  13. `Devānubhāvena` (10.1): “nhờ oai lực của chư thiên” (tầng chỉ có 1 khoá, `devānubhāv…`, có dạng “oai lực”); cũng có thể hiểu là “do thần lực cõi trời”.

