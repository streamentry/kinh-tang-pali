notes: |-
  **Cùng bộ Netti, cùng tiền lệ với `ne12`** — xem `notes` của `ne12` cho toàn bộ
  số đếm về `Netti` (15/15), `Paṭiniddesavāra` (11/12) và `Vibhaṅga N` → *Nhóm N*.
  `:0.3` ở đây là `Vibhaṅga 5` → *Nhóm 5*; `:0.4` `Lakkhaṇahāravibhaṅga` → *Nhóm Đặc Trưng
  Hướng Dẫn* (theo mẫu `ne11:0.4`). `lakkhaṇa` chỗ này là *đặc trưng*, khác `ne24:0.4`
  `Lakkhaṇahārasampāta` → *Nhóm Phương Thức Dấu Hiệu*; **hai cách đang cùng tồn tại**,
  tôi giữ tính nhất quán theo loại hàm của bộ.

  **Một lỗi bản tham khảo mà tôi phát hiện và không sửa được (ngoài lát) — báo lại đây.**
  Grep trùng nguyên văn báo `ne8:4.3` (`Akiccaṁ te na sevanti,`) trùng với `dhp293:3`,
  và bản Việt ở đó là *không làm việc không nên làm*. Ở `dhp` thì đúng (là một lời khuyên
  răn đe), nhưng ở `ne8` Pāli này là AN 10.9: *không nắm lấy điều chẳng đáng quý* — hai
  nghĩa khác hẳn. Tôi **không** dùng lại và **không sửa `dhp290-305`** (ngoài lát của tôi);
  người điều phối nên phán xử lại cả hai.

  **`:3.4` `yamakovādasutte`** tôi dịch *bài kinh Yamaka*. 0 tiền lệ; tôi tránh đưa tên
  yêu quái `Kaḍha` (chưa từng xuất hiện trong tầng Việt, và không nằm trong Pāli của bài
  này nên chốt `lọt_pāli` sẽ fail).

  **`:10.1` là bất định thật.** `kiccato ca lakkhaṇato ca sāmaññato ca cutūpapātato ca`
  — bốn phương diện mà `ekalakkhaṇa` được xét. Tôi dịch *sơ lược / đặc trưng / tương tự /
  cách ăn uống*; riêng `cutūpapāta` (bốn cách nếm thức ăn) tôi không chắc là *cách ăn
  uống* hay *cách tiêu thụ*, và `kiccata` (nói chung) cũng là cách đọc của tôi. Đây là lý
  do `ambiguity_integrity` ở 8.8.

  **`:2.1`** là mười tính chất của con mắt trong AN 10.60; `pabhaṅgu` tôi dịch *dễ vỡ*,
  `ittara` *thấp kém*, `paritta` *nhỏ bé*, `bhasana`/`bhusana` không có, còn
  `saṅkhāra` → *chuyển biến vô thường* (không đánh vần từng tiếng).

  **Không có tầng Anh.** 0/44; tầng `english-sujato` đã ghim **không có thư mục `ne`**.
