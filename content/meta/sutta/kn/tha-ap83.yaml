  BẤT ĐỊNH ĐÃ PHÂN XỬ, GHI LẠI.
  (1) `Aciraṁ gatamattaṁ maṁ` + `Papātamanugacchanto` (6.1–6.3) là đoạn khó nhất của bài và
  CHỈ xuất hiện ở đúng hai tệp trong toàn bộ Pāli đã ghim (tha-ap83 và tha-ap350, cả hai đều
  chưa có bản Việt) nên không có parallel dịch sẵn để đối chiếu. Đọc: Chỉ chút ít thời gian
  thôi, vị chúa bầy hươu đã đi xa bội; ta bám lấy theo sát bằng gót chân, liền hối chạy tới
  đó. `papāta` lấy theo nghĩa gót chân (Sujato: with my feet). `migarājā` là tên gọi kinnara,
  có tiền lệ ở tầng Việt (ja295: Vua của loài thú; ja308: chúa tể loài thú). `maṁ` mình không
  dịch thành từ riêng vì câu vốn đã rõ ý. NGƯỜI BIÊN TẬP NÊN KIỂM CÂU NÀY.
  (2) `Tārayissati tiṇṇoyaṁ` / `dantoyaṁ damayissati` (2.3–2.4): tiṇṇa và danta là quá khứ
  của từ dùng với tiền tố oya (chưa từng) — dịch kẻ chưa từng qua bờ và kẻ chưa từng được
  thuần phục. Sujato dịch vắng mặt chủ ngữ (will ferry across the uncrossed); giữ chủ ngữ
  vì Pāli có.
  (3) `Assāsissati assattho` (3.1): kẻ đau khổ sẽ hết đau khổ — câu đối xứng, giữ.
  (4) `nibbāpessati nibbuto` (3.4): tiền lệ duy nhất là bậc đã tịch tịnh sẽ làm cho chúng ta
  tịch tịnh, nhưng chữ chúng ta không có trong Pāli, nên bỏ; cũng bỏ dấu nháy kép thừa mà
  bản đó mang theo vì chỗ này Pāli không mở ngoặc.
  (5) Giọng kể thống nhất là TA (1.2, 1.3, 6.3, 6.4, 7.2). Bản nháp đầu lộn xộn tôi/tôi/ta; đã
  đồng nhất sau lượt review đối kháng. Đây là chỗ duy nhất trong lát tôi chấp nhận lệch khỏi
  tiền lệ đa số (7.2 có 8 bản dùng tôi) vì tiền lệ trong chính bài này dùng ta.
  (6) `Gahetvā timirapupphaṁ` (4.3): hoa timira — dùng y như tha-ap371:2.3 (hoa timira), đồng
  bộ với 0.3 giữ tên Pāli Timirapupphiya.
  (7) `siddhatthassa mahesino` (4.2): ba tiền lệ 1x mỗi cách (Đại Tiên, Đại Hiền, Đại Ẩn Sĩ);
  chọn Đại Ẩn Sĩ vì đây là cách phổ biến nhất trong tầng cho `mahesin`.

