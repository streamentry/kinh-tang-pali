  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ, đếm được bằng script (không dịch lại từ trí nhớ):
  `“Bhante nāgasena, tumhe bhaṇatha—` trùng nguyên văn ở 11 bài; đa số
  (mil5.2.6, mil5.2.8, mil5.3.8, mil6.2.2, mil6.2.3) đều là `“Bạch ngài Nāgasena,
  các ngài từng nói—` nên tôi dùng lại đúng chuỗi ấy ở `:2.1`.
  `“Sādhu, bhante nāgasena, evametaṁ tathā sampaṭicchāmī”ti.` trùng nguyên văn ở
  36 bài; trong số đó chỉ mil5.3.2:10.9 và mil6.3.9:4.11 giữ đuôi `”ti.` đúng như
  Pāli, và cả hai đều là `“Lành thay, thưa ngài Nāgasena, đúng là như vậy, trẫm xin
  kính nhận”ti.` — tôi dùng lại nguyên văn chuỗi ấy ở `:28.5`.

  DẤU LƯỢC. Đếm bằng `lược()`: cả bài chỉ có MỘT dấu lược, ở `:7.1` dạng `(…)`
  (không phải `…pe…`). Bản Việt giữ nguyên `(…)` — không mở rộng (luật 10.1).
  Nhắc kép: Pāli `“`=7 `”`=7, `‘`=3 `’`=3; bản Việt cân đúng như vậy. Nhắc kép là
  danh sách xuyên suốt bài: `:2.1` mở `“` thì `:24.3` mới đóng (giữ đúng cách
  SuttaCentral chia khóa).

  LỖI BẢN NHÁP BẮT ĐƯỢC KHI REVIEW ĐỐI KHÁNG (5 chỗ, đã sửa hết):
  (1) `:5.1` — nháp đầu tiên dịch `taṁ hatthināgaṁ ghātesi` là “giết con rắn ấy”.
  SAI: `hatthināga` là VOI (đúng như `:3.1` `hatthināgo … con voi`); vua rắn
  Chaddanta đã hóa voi rồi mới bị giết. Đã sửa thành “con voi ấy”.
  (2) `:13.1` — `sattakkhattuṁ dante chinditvā` là “bảy lần cắt đứt ngà voi”, không
  phải “cắt đứt hàm”. `danta` = ngà (răng nanh voi).
  (3) `:3.1` — `hatthācariyaṁ evamavoca` là “nói với ông như nói với kẻ thù trong
  tay”, không phải “thì thưa thầy ruột”.
  (4) `:18.1` — `satthavāho` là đầu đoàn xe buôn, không phải `senāpati` (Tướng
  quân — vốn là `:20.1`); nháp đầu tiên đã dùng trùng một nghĩa cho hai từ khác nhau.
  (5) `:15.1` — `laṭukikāya sakuṇikāya` là HAI loài chim; nháp đầu tiên nén thành
  “đàn chim non” là mất một loài.
  Ngoài ra `akāle ambaphalāni` đã sửa thành “quả trái cây ngoài mùa” (quả trái mùa
  thì cây vẫn ra quả, nhưng ra SAI MÙA — đó là điều Đức Phật trách ở `:2.4`).

  BẤT ĐỊNH ĐÃ GHI. (1) `:2.3` `yasena ca pakkhena ca` — 0 tiền lệ cho cụm này.
  `yasa` là danh tiếng, nhưng `pakkhena` không rõ là `pakkhin` (người theo) hay
  `pakkhena` (theo bên cạnh). Tôi dịch “danh dự lẫn uy tín”, giữ cả hai vế và không
  chọn một nghĩa; nếu người biên tập xác định `pakkhena` = người theo thì sửa thành
  “danh dự lẫn số người theo”. (2) `:26.2` `kāṇakacchapopamaṁ` — 0 tiền lệ trong
  tầng Việt; đây là thí dụ giếng làm bằng cây sắt (`kāṇakacchapa`), tôi dịch theo
  nghĩa đó, không mở rộng thêm chi tiết nào không có trong câu Pāli.
  (3) `:12.1` `sāmo nāma` và `:22.1` `mahāpadumo`: giữ đúng dạng danh từ CÓ TRONG
  PĀLI (`sāmo`, `mahāpadumo`) chứ không chuẩn hoá — vì bộ chốt Pāli-lọt chỉ nhận
  tên có thật trong Pāli của chính bài, mà `Sāma`/`Mahāpaduma` (không đuôi) không
  khớp khoá Pāli nào. Tương tự `:9.1` `paṇḍarako` → `Paṇḍaraka`,
  `:21.1` `cando` → `Cando`. Đã khai 11 tên vào bộ nhớ tiến trình sau khi tra
  chứng từng tên trong Pāli bài này (`_tvd_84_seed.py` ném `AssertionError` nếu tên
  không có gốc trong Pāli). (4) `:2.2` `ekantakaṇho`/`ekantasukko` — đen/ trắng, tôi
  dịch “chỉ toàn điều ác” / “chỉ toàn điều lành”; không có tiền lệ `vipallāsa` nào
  trong tầng Việt để dùng làm chuẩn song song.

