notes:
  - >-
    Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato
    tại commit đã ghim cho ja344. Đối chiếu văn cảnh tích truyện Jātaka và chú
    giải Atthakathā để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại. Bảo
    toàn niêm luật kệ ngôn, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ. Toàn
    bộ 21 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và
    chuẩn hóa Unicode NFC.
  - >-
    terminology fix (gộp tên phẩm, 2026-10-04, coordinator): khối tiêu đề đổi
    sang cách dịch đa số toàn tầng — `4. Ambajātaka` → «4. Kinh Xoài». Đếm bằng
    cách ghép Pāli↔Việt ở mọi khối `:0.1`–`:0.9` có số thứ tự phẩm; cùng tên
    Pāli ở hai bộ khác nhau là hai phẩm khác nên không so chéo. Khối tiêu đề,
    không đổi nghĩa segment nào.
  - >-
    Lượt rà soát 2026-10-15 (lô L10, kiểm toán Jātaka chỉ có Pāli), Claude
    Sonnet 5.5 (Claude Code): đọc đủ mọi khoá Pāli↔Việt, đối chiếu PED. Sửa
    1.1–1.2: `nīliya` là thuốc nhuộm chàm cho tóc và `saṇḍāsa` là cái nhíp nhổ
    tóc (PED, J iii.138), không phải "nhổ lông mày"; 1.3–1.4, 3.4, 4.4: đưa `yā
    te ambe avāhari` về đúng vị trí và đúng là mệnh đề quan hệ (nàng nào đã trộm
    xoài), không phải lời tuyên bố "quả báo". Bất định, không sửa: 2.1–2.4
    `tādisā pati mā laddhā` (đọc là người nữ hay là tấm chồng như thế chưa phân
    xử được từ Pāli ghim). Điểm giữ nguyên, trừ semantic_fidelity +0,1 do sửa
    lỗi nghĩa; technical_integrity giữ nguyên.
