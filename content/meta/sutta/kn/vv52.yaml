notes: |-
  Bản dịch tiếng Việt mới cho bài kinh vv52, dịch từ Pāli root (111/111 khoá khớp tiền tố `vv52:`; thứ tự khoá đúng thứ tự Pāli). Không có tầng tham khảo tiếng Anh hay tiếng Việt truyền thống ở commit đã ghim.

  **Coverage English theo công thức của `source/layers.yaml`** (Pāli có nội dung ≥ 40 ký tự, loại khối `:0`): mẫu số là **0** — khoá Pāli dài nhất của bài chỉ 36 ký tự, toàn bộ là kệ ngắn hoặc tiêu đề. Với mẫu số 0, cổng coverage **không đo được gì**; đó không phải kết luận "không cần ghi nhận gap". Sujato không có tệp nào cho `vv`, nên dù cổng có đo được thì cũng là 0%. Có blocker nên bài giữ `draft`; `content/meta/reference-gaps.yaml` do người điều phối ghi nhận bằng `npm run reference:gaps`.

  **Quan hệ với `pv39` (Chuyện Ngạ Quỷ Revatī).** Phần lớn bài là kệ song song của `pv39`: 95/111 khoá có Pāli trùng nguyên văn một khoá của `pv39` (đã dò 111 cặp, tính cả khoá `pv39` lặp lại), và 95/95 khoá đó dùng lại nguyên văn bản Việt của `pv39`; hai cặp lệch chỉ ở chữ hoa đầu câu (`10.3` mở câu sau dấu chấm nên viết hoa; `19.5` nối tiếp `19.4` sau dấu chấm phẩy nên viết thường). Vì `pv39` cũng là bản dịch của chính dự án, nó **không phải** cách đọc English hay Việt độc lập; `triangulation` vì thế bị giữ ở 7,5 (≤ 8,0), không tuyên bố đã đối chiếu độc lập. Bảy khoá `1.2–1.4` và `2.1–2.3` + `2.4` là hai kệ Pháp Cú `dhp219`–`dhp220` (Pāli trùng nguyên văn từng dòng, trừ dấu nháy ở `1.1` và `2.4`) nên dùng lại bản Việt `dhp219:1–4`, `dhp220:1–4`. Khoá `1.1` dùng *người đi xa lâu ngày* như `dhp219:1` (nháy mở thêm theo Pāli); cách dịch này không có từ riêng cho `purisaṁ` (người đàn ông), chọn giữ nhất quán với Pháp Cú thay vì thêm.

  **Năm phép kiểm.** (1) Tập khoá Việt = tập khoá Pāli, 111/111, cùng thứ tự. (2) Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá, 0 lệch trên 111 khoá (Pāli mở `“` ở 1.1 đóng ở 2.4; 3.1–3.4; 5.1–6.4; 7.1–8.4; 9.1–9.4; 10.1–10.4; 11.1–11.4; 12.1–12.4; 13.1–13.4; 14.1–16.4; 17.1–17.6; 18.1–18.4; 19.1–23.4 với nháy đơn lồng nhau `‘` ở 19.3 đóng `’` ở 19.6; 25.1–25.4). (3) Pāli trùng nguyên văn trong chính bài: 8 nhóm (5.4 với 7.4; 6.1, 6.2, 6.3 với 8.1, 8.2, 8.3; 10.3 với 19.5; 12.2 với 15.2; 17.2 với 20.4; 17.3 với 20.5), 8 cặp, 1 cặp bản Việt khác — `10.3`/`19.5`, chỉ chữ hoa đầu câu như trên; 7 cặp còn lại giống y. (4) Bài không có `…pe…` hay `…`; Việt cũng không có `…`; không có `(…)`. (5) Số Pāli: `sataporiso` (12.2, 13.4, 15.2) = sata 100 + porisa (tầm người) ⇒ *một trăm tầm người*; `vassasahassāni` (12.3, 15.3) = sahassa 1000, dạng số nhiều không nêu số lượng ⇒ *hàng ngàn năm*, không quy thành một con số; `cātuddasiṁ pañcadasiṁ` (22.1) = 14, 15 ⇒ *mười bốn, mười lăm*; `aṭṭhamī` (22.2) = 8 ⇒ *thứ tám*; `aṭṭhaṅga` (22.4) = 8 chi ⇒ *tám chi phần*; `dve yakkhā` (4.2) ⇒ *hai dạ-xoa*; `dutiyaṁ` (26.1) ⇒ *thứ hai*. Không có phép nhân thang lớn nào. Ngoài ra kiểm NFC, khoá rỗng, khoảng trắng thừa, Pāli lọt sang Việt: 0 lỗi (trừ các tên riêng Revatī, Nandiya, Bārāṇasī, Saṁsavaka, Yama, Vimānavatthu cố ý giữ nguyên).

  **Tiêu đề.** `:0.1` *Vimānavatthu* giữ nguyên Pāli (74 khoá giữ nguyên, 2 khoá dịch khác). `:0.2` *Purisavimāna* dịch *Chuyện Cung Điện Nam Hư Không*: 21 khoá toàn bộ `vv` dùng đúng dạng này, 5 khoá *Thiên Cung Của Nam Giới*, 3 khoá để nguyên Pāli; theo phạm vi gần nhất (vv51–vv62) 8 khoá dạng 21-khoá. Giữ quy ước của tầng, không tự đặt cách thứ N+1; cách dịch *Nam Hư Không* cho `purisa-vimāna` là quy ước đã có chứ không do bài này tạo ra, người biên tập có thể xem lại cho cả bộ. `:0.3` *Mahārathavagga* dịch *Phẩm Cỗ Xe Lớn* (8 khoá, đều trong phạm vi gần nhất; 2 khoá để nguyên Pāli, 1 khoá *Đại Xa Phẩm*). `:0.4` và dòng kết `26.1` theo khuôn vv53–vv62: *Chuyện Cung Điện* + tên riêng; dòng kết là tên chuyện + *thứ hai*.

  **Chỗ cần người biên tập phán (bất định, không đưa vào thân kinh):**
    - `3.2` `apārutadvāre`: dùng lại cách dịch của `pv39:1.2` — *cửa nhà không đóng* (từ `a-pāruta-dvāra`, cửa không bị che/đóng) đặt cạnh `adānasīle` *chẳng có thói quen bố thí*. Hình ảnh "cửa không đóng" mà vẫn không bố thí là nghĩa đen khó nắm; Pāli root không giải thích thêm và bản Anh không có để đối chiếu. Giữ nghĩa đen, không thêm giải thích vào thân kinh; nếu cần, cho `pv39:1.2` và `vv52:3.2` đổi cùng một lần.
    - `9.4` `na patthaye nirayaṁ dassanāya` dịch *tôi không muốn thấy địa ngục*. Pāli khác `pv39:7.4` (`nirayadassanāya` một từ ghép) nên không dùng lại nguyên văn bản `pv39` (*tôi không muốn đi thấy địa ngục*, có thêm *đi* không có trong Pāli).
    - `12.4`/`15.4` `paccasi` (hiện tại, ngôi hai) đi với `vassasahassāni`: dịch *ngươi sẽ bị nung nấu* theo nghĩa tương lai gần như `pv39:10.4`/`13.4`; dùng thì hiện tại cho việc sắp xảy ra là cách đọc thường, nhưng cũng có thể đọc là *đang bị nung nấu*.
    - `24.1–24.4`: `khipiṁsu` là chủ động (*họ đã quăng*), chủ ngữ không nêu (hai dạ-xoa ở 4.2); bản dịch dùng *bị quăng* theo `pv39:22.3`, không thêm chủ ngữ.
    - `1.1–2.4` : hai kệ mở đầu nằm trong một cặp nháy kép riêng; Pāli không nêu người nói. Để trống người nói, không thêm.
    - `11.3` `mīḷhaṁ` dịch *phân*, trùng *gūtha* ở `11.1` cũng *phân*; theo `pv39:9.1`/`9.3`.

  Bốn lệnh cổng kỹ thuật chưa chạy trong lát này (người dịch bị cấm chạy): `npm run validate`, `npm test`, `npm run check`, `npm run build`. `technical_integrity` đặt 9,6, không phải tuyên bố đã pass cổng. Bài ở trạng thái `draft` do blocker không có tầng tham khảo tiếng Anh, bất kể điểm.
