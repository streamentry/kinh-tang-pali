notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của harness gần như không kiểm gì ở bài này, nên tôi tự quét toàn bộ khoá từ đĩa.** Mọi vế kệ ngắn hơn 40 ký tự nên bộ lọc `substantivePaliMinChars: 40` trong `source/layers.yaml` không thấy segment nào; tôi đọc Pāli thật của từng khoá từ `.cache/upstream/suttacentral/` theo `sourcePath` trong catalog, đối chiếu tay với bản Việt, rồi quét máy: tập khoá Việt bằng đúng tập khoá Pāli (17/17, đúng exact ID, không orphan), mọi giá trị NFC và không rỗng, ngoặc kép cong cân trên cả bài, không có `(…)`, dấu lược khớp Pāli từng khoá.
  - |-
    **Không thể tuyên bố technical gate pass.** Đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tiêu chí 10 bị chặn ở 9.6: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, NFC, ngoặc kép cân cả bài và YAML sạch. Người biên tập phải chạy lại bốn lệnh trên trước khi đổi trạng thái.
  - |-
    **Ba lệch nhỹ đã ghi, đủ để hạ `semantic_fidelity` nhưng không đủ để xếp blocker.** (1) `1.1` `Yodha koci manusseu` chỉ là *trong loài người*, bản Việt thêm *cõi* thành *trong cõi người*. (2) `1.2` `hiṁsati` là *làm hại*, bản Việt nâng lên *hại mạng*; Sujato chỉ dịch *harms*. (3) `1.3` `Asmā lokā paramhā ca` là cách điệu *từ* cõi này và cõi kia, bản Việt dùng *từ ... đến ...* nên lệch ngữ pháp; `dhaṁsate` ở `1.4` là *bị thiêu đốt* mà bản Việt rút thành *tổn diệt*, yếu đi một chút.
  - |-
    **Khoảng `2.1–2.4` rất sạch và giữ đúng chia động từ.** `Bahuñhi so pasavati` + `puññaṁ tādisako naro` được tách đúng vào `2.3` và `2.4` thành *sẽ sinh ra rất nhiều / công đức*, không nuốt mất tân ngữ `puññaṁ` như nhiều cách dịch hay làm.
  - |-
    **Bất định chưa ghi ở đâu, đã ghi ở đây.** `3.3` `Ekāsanassa ca raho`: có thể là *sự trống trải của người một mình* (theo bản Anh đã ghin: *to sit alone in hidden places*) hoặc *chỗ trú ẩn của kẻ không có chỗ ngồi*. Bản Việt đi theo bản Anh và cho ra câu đọc được; tôi không hạ nặt vì lựa chọn ấy bảo vệ được, nhưng phải nói rõ là lựa chọn chứ không phải chỗ chắc chắn.
  - |-
    **Tầng Anh.** 12/13 khoá nội dung có prose Sujato, im lặng ở `3.5`. Ở `3.1` và `3.4` bản Anh có dấu `<j>` (ký hiệu chỉ báo chú thích còn sót) không xuất hiện ở Pāli; bản Việt bỏ qua, đúng.
  - |-
    **Thuật ngữ có tiền lệ.** `mettā` → *từ bi*, `anukampati` → *thương xót*, `pasavati` → *sinh ra*, `raho` → *thanh vắng*, `viveka` → *thanh vắng*; `subhāsitassa` dịch *điều khéo nói* thay vì *lời nói tốt đẹp*, chọn để tránh dịch trùng nghĩa với `vāca` ở kệ khác.
