notes: |-
  Đủ 122/122 khoá của bài, đúng thứ tự Pāli, không khoá nào ngoài tập khoá Pāli. Dịch trực tiếp từ Pāli root; đọc cả bài trong bối cảnh (vua hỏi, Nāgasena đáp bằng chuỗi thí dụ cùng một khuôn) trước khi dịch từng khoá.

  **Coverage English: không đo được gì ngoài con số 0.** Mẫu số 90 khoá có nội dung (theo công thức của kho; 4 khoá `:0` là khối tham chiếu, 28 khoá còn lại ngắn dưới 40 ký tự như `Bảy hạng nào?` và các câu đáp ngắn). Sujato không có bài nào của `mil`, `english-project` không có uid này, `vietnamese-current` chỉ có Pháp Cú ⇒ ba tầng vắng, mọi khoá chỉ dựa vào Pāli root. `reference-gaps.yaml` chưa có entry cho `mil6.3.6`; entry (90/90 thiếu English, coverage 0) thuộc việc của người điều phối, và có entry cũng không cứu được `published`. Nếu sau này có lớp Anh được xuất bản thì phải chấm lại `triangulation` và mở lại `status`.

  **Năm phép kiểm.**
  (1) Tập khoá Việt = tập khoá Pāli: 122/122, cùng thứ tự.
  (2) Nháy đơn `‘ ’` và nháy kép `“ ”` khớp Pāli từng khoá: 122 khoá × 4 loại dấu, 0 lệch. Cấu trúc nháy kép của Pāli chạy qua ranh giới khoá và được giữ đúng: lời vua mở ở `3.1` đóng ở `3.4`; lời Nāgasena mở ở `4.1` đóng ở `13.1` (trong đó cặp nháy đơn của bài kệ nằm trọn ở `6.1`–`6.8`); lời Nāgasena mở ở `14.2` đóng ở `15.1`; mở ở `15.5` đóng ở `17.1`; mở ở `17.5` đóng ở `19.1`; mở ở `19.5` đóng ở `21.1`; mở ở `21.5` đóng ở `23.1`; mở ở `23.5` đóng ở `25.1`; mở ở `25.5` đóng ở `26.1`; mở ở `26.7` đóng ở `27.1`; mở ở `27.7` đóng ở `27.9`; lời vua mở ở `28.1` đóng ở `28.2`. Các khoá `15.1`, `17.1`, `19.1`, `21.1`, `23.1`, `25.1`, `26.1`, `27.1` chỉ có dấu đóng `”` mà không có dấu mở trong khoá, đúng như Pāli.
  (3) Pāli trùng nguyên văn trong chính bài: 62 cặp (các câu đáp `Na hi, bhante`, `Āma, bhante`, các khoá `Kissa pana …`, các câu kết `Evameva kho … …pe…`, `Idamettha … kāraṇaṁ`), bản Việt giống hệt nhau ở cả 62 cặp, 0 cặp lệch.
  (4) Dấu lược: Pāli có `…pe…` ở 7 khoá (`3.3`, `17.5`, `19.5`, `21.5`, `23.5`, `25.5`, `26.7`), mỗi khoá Việt giữ đúng một `…`; 0 khoá nào có `…` bên Việt mà Pāli không có; không có `(…)` ở Pāli nên không có `(…)` ở Việt.
  (5) Số Pāli: xem dưới.
  Thêm: NFC đạt, 0 khoá rỗng, 0 khoảng trắng thừa, không có Pāli lọt sang Việt ngoài tên riêng và nhan đề (Nāgasena, Milindapañha, Vessantara, jambu, Yama).

  **Số Pāli, tự tính.** `Sattime … Katame satta` = bảy hạng, và chuỗi `4.3`–`4.9` kể đủ bảy hạng (đói, khát, rắn cắn, ăn độc, rơi vào lửa, rơi xuống nước, bị giáo đâm) nên 7 = 7, kệ `6.1`–`6.8` nêu cùng bảy nguyên nhân cộng gió, mật, đờm, kết hợp, thời tiết, bất cẩn, tác động và nghiệp. `Aṭṭhavidhena` = tám cách, và `5.1` kể đủ tám (gió, mật, đờm, sự kết hợp, thời tiết thay đổi, tự mình bất cẩn, tác động, quả nghiệp) nên 8 = 8, trùng với bảng tám nguyên nhân ở `mil5.1.8`. `māsiko` = một tháng tuổi (`3.3`); `vassasatiko` = vassa 1 × sata 100 = trăm tuổi (`3.4`). `bahūni vassasatasahassāni` = nhiều trăm ngàn năm (bahu × sata 100 × sahassa 1000, tức nhiều lần một trăm ngàn năm; `7.2`–`13.1`), `bahūni divasasahassāni` = nhiều ngàn ngày (`14.3`, `22.2`, `24.2`). `ekamekena opammena` = từng thí dụ một (`28.1`), `paṭhamopammena` = thí dụ đầu tiên (`28.2`). Không có cụm số nào chưa phân xử được; không có `Tiṁsakappasahassa`.

  **Tiền lệ (đếm trên tầng vi hiện có, loại tệp này).**
  Pāli trùng nguyên văn với nơi khác trong tầng: 12 khoá có Pāli trùng (`0.1`, `0.2`, `0.3`, `2.3`, `15.2`, `17.2`, `19.2`, `21.2`, `23.2`, `25.2`, `26.6`, `27.6`), tổng 828 cặp, 198 cặp bản Việt khác bản của tôi. Dùng lại nguyên văn bản đa số: `Milindapañha` (230 trong 242), `Anumānapañha` → `Câu hỏi về suy luận` (22 trong 28), `Vessantaravagga` → `Phẩm Vessantara` (9/9), `Āma, bhante` → `Vâng, thưa tôn giả.` (11 trong 19), `Na hi, bhante` → `Không phải vậy, thưa tôn giả.` (56 trong 82). Hai câu đáp ngắn còn lại có biến thể (`Vâng, bạch ngài`, `Không hề, bạch tôn giả`) ở một số bài khác; chọn dạng đa số và nhất quán với `mil6.3.4`, `mil6.3.5`, các bài cùng phẩm.
  Thuật ngữ có đếm: thí dụ (`opamma`): trong 46 khoá `mil` có `opamma` ở Pāli, 32 khoá dùng `thí dụ` và 5 khoá dùng `ví dụ`, nên dùng `thí dụ`; ngạ quỷ bị khát ái thiêu đốt (`nijjhāmataṇhika`) lấy từ `mil6.3.4:1.4`; `nghiệp bất thiện` (3) thay vì `ác nghiệp` (6) cho `akusalakamma` vì dịch sát `akusala`; `cảnh giới tái sinh` cho `gati` ở `kammappaṭibāḷhā … gatippaṭibāḷhā` có tiền lệ ở `mil5.1.3:3.1`; `cung thủ` (16) và `mũi tên` (18); `thầy thuốc` (26); `thuốc giải` (17); `trăn khổng lồ` (5, `mil7.6.10`); `đám lửa` (9) thay vì `khối lửa`; `đám mây` (22). Bộ tám nguyên nhân dùng đúng cách dịch của `mil5.1.8:4.4`–`4.11` (gió, mật, đờm, sự kết hợp, thời tiết thay đổi, tự mình bất cẩn, quả nghiệp).

  **Đặt mới hoặc lệch tiền lệ (có lý do).**
  (1) `opakkamika` → `tác động`: `mil5.1.8` dịch `do nỗ lực` (3 khoá: `4.10`, `4.15`, `13.6`), còn `mil5.1.3:10.2` dịch `tác động bên ngoài` và `mil5.1.8:5.2` dịch `do bị tác động` cho `upakkama`; ở đây danh sách tám nguyên nhân đứng cạnh các nguyên nhân bị đói, khát, rắn cắn, bị giáo đâm, nên `nỗ lực` dễ đọc thành cố gắng của chính người chết; chọn `tác động` (không thêm `bên ngoài` để khỏi lặp với `āgantuka`). Phẩm `mil6` chưa có tiền lệ cho `opakkamika`.
  (2) `āgantuka` → `từ bên ngoài đến` (0 tiền lệ trong `mil`; `ud3.3` dịch `khách` cho `āgantukā bhikkhū`, không áp dụng được cho bệnh, mây, gió, thuốc giải).
  (3) `anītiko anupaddavo` → `không tai ương, không hoạn nạn` (0 tiền lệ trong `mil`; `cnd4` dịch `anītikaṁ` là `không hệ lụy`, không hợp khi nói về đám lửa, đám mây, nọc độc).
  (4) `samasamagatiko` → `có diễn tiến hoàn toàn giống`, và `yathāgatigamanapathamatthakaṁ` → `cuối lộ trình theo đà của nó` (đều 0 tiền lệ); tránh dùng chữ `cảnh giới` cho `gati` ở những phép so sánh này vì `gatippaṭibāḷhā` ở `2.7` đã mang nghĩa `cảnh giới tái sinh`.
  (5) `paṭibāḷha` → `dồn ép` và `paṭipīḷita` → `đè ép`, hai từ cố ý khác nhau (0 tiền lệ).
  (6) `sāmayika` → `đúng thời`, `akāle` → `không đúng thời`, `kālaṅkiriyā` → `qua đời`. `không đúng thời` có tiền lệ (5 khoá, gồm `ja331:3.1` và `mil5.1.2:11.3`); `phi thời` cũng 5 khoá nhưng phần lớn nói giờ ăn hay giờ đi lại; `trái thời` 0; `chết đúng thời` và `chết không đúng thời` 0 tiền lệ. Không dùng `chết yểu` vì chỉ cái chết lúc còn trẻ, sai nghĩa.
  (7) `Yamavisaya` → `cõi Yama`, `aṅgārapabbata` → `núi than hồng` (`than hồng` 16; `Yama` 85 khoá toàn tầng, nhưng 0 tiền lệ cho `cõi Yama`).

  **Bất định, ghi tại đây chứ không thêm vào thân kinh.**
  (1) `28.1` `acittavikkhittakopi … manujo`: đọc là `ngay cả một người tâm trí rối loạn` đối lập với `sacetano` (có tâm ý tỉnh táo); cách đọc khác (phủ định kép, `người không rối loạn`) làm câu mất lập luận `huống chi`, nên chọn cách đọc đầu nhưng chưa có bản Anh hay Việt độc lập để đối chiếu.
  (2) `18.1` `tassa taṁ visaṁ anītikaṁ anupaddavaṁ maraṇaṁ pāpeyya`: hai tính từ trung tính có thể áp cho `visaṁ` hoặc `maraṇaṁ`; câu tiếp theo gọi chính nọc độc là `anītikamanupaddavaṁ`, nên bản dịch đặt chúng ở nọc độc nhưng giữ vị trí giữa hai dấu phẩy để không khóa nghĩa.
  (3) `27.1` `mañjaritapatte`: dịch `bông lá đã thành chùm`; nghĩa chính xác (lá trổ chùm hay trổ bông) chưa chắc. `24.1` `sassuṭṭhānasamayaṁ` dịch `thời kỳ lúa chín`, khác `sassuddharaṇasamayaṁ` ở `26.4`/`27.4` là `thời gặt hái`; phân biệt hai chữ là suy từ hình thái, không có tiền lệ.
  (4) `6.7` `Visamopakkamakammehi`: đọc là ba nguyên nhân `bất cẩn, tác động, nghiệp` để khớp bảng tám ở `5.1`; hợp chất bị nén vì vần.
  (5) `4.9` `sattihato … ābādhiko` dịch `bị giáo đâm, đau đớn`; `ābādhiko` có thể đọc là `bị bệnh`, nhưng ở đây đứng sau vết thương nên chọn `đau đớn`. `satti` dịch `giáo`, có tiền lệ `mil5.2.3:10.5` (`ngọn giáo`).
  (6) `15.1` `ādinnatiṇakaṭṭhasākhāpalāso`: dịch `đã nuốt cỏ, củi, cành, lá` và `pariyādinnabhakkho` dịch `đã tiêu hết thức ăn`; phân biệt hai mức `ādinna` và `pariyādinna` là suy từ `apariyādinneyeva` ở cùng khoá.
  (7) `kiriyappaṭibāḷhā` (`2.7`, `3.1`) dịch `bị hành động dồn ép`; `kiriyā` đối lập với `kammavipāka` ở `mil5.1.8:5.9`, nhưng Pāli không nói rõ là hành động của chính người chết hay của người khác.

  **Lỗi bản nháp đã bắt:** phép đối chiếu nháy từng khoá bắt được chín khoá bản nháp đầu thiếu dấu mở `“` ở đầu lời Nāgasena tiếp nối (`14.2`, `15.5`, `17.5`, `19.5`, `21.5`, `23.5`, `25.5`, `26.7`, `27.7`); sửa theo Pāli từng khoá. Đọc cặp Pāli↔Việt cũng bắt được các chỗ lược mất lời gọi `mahārāja` ở `4.4`–`4.9` (đã đưa lại `này Đại vương`) và câu `5.1` lặp lời gọi làm gãy cú pháp (đã viết lại).

  `technical_integrity` 9.6 vì lát này không được chạy cổng. Bốn lệnh còn lại do coordinator chạy trước khi publish: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
