notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json). Draft + blocker thật. 13/13 khoá từ Pāli. `cần` RỖNG nên
  tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  KHÔNG CÓ TIỀN LỆ: Bhaggajātaka chưa được dịch ở đâu trong tầng. `bhagga` là kẻ ăn, kẻ
  ăn nhờ, kẻ ngồi đến bàn; ở đây là tế tán gọi đối phương. Dịch theo nghĩa thành Kẻ Ăn,
  không bịa cốt truyện và không gán danh xưng riêng.
  BẤT ĐỊNH 1: `visa` là thiên nga, ở đây là lời miệt thị người kia cong queo. Bản dịch dùng
  quặn quẹo để giữ nghĩa miệt thị; nếu dịch sát thì phải để lại thiên nga, mà đặt thiên
  nga cạnh ma quỷ trong cùng một vế thì người đọc không hiểu. Đây là chỗ duy nhất trong lát
  có dịch cảm tính, và đã ghi lại ở đây.
  BẤT ĐỊNH 2: `mā` ở 1.3 và 2.3 là dấu cấm, không phải mệnh lệnh cầu xin. Nghĩa là cầu
  cho ma quỷ đừng ăn ta, và câu đối đáp là cầu cho ma quỷ cứ ăn ngươi. Câu 1.3–1.4 và
  2.3–2.4 vì thế là đối xứng, dịch theo cặp.
  `aparāni ca vīsatiṁ` là hai mươi năm còn lại, nên trăm hai mươi; không ghi số tổng ra
  vì Pāli không cộng từng chữ.
  `brūsi` là hiện tại của bhrū, sẽ khóc; ghép với susīma là hình ảnh khóc đưa tơ vải rách ra.
  Dịch là sẽ có tơ mảnh, các ngươi sẽ khóc.
  Tiền lệ chung: Jātaka, Bộ Hai Bài Kinh, Phẩm Tàn Tật, nhấy kép, số thứ tự; xem ja153.
  Hạ triangulation 7.0: không tầng Anh, không bản Việt tham khảo.
