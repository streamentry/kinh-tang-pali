notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json). Draft + blocker thật. 13/13 khoá từ Pāli. `cần` RỖNG nên
  tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  KHÔNG CÓ TIỀN LỆ: Bhaggajātaka chưa được dịch ở đâu trong tầng. `bhagga` là kẻ ăn, kẻ
  ăn nhờ, kẻ ngồi đến bàn; ở đây là tế tán gọi đối phương. Dịch theo nghĩa thành Kẻ Ăn,
  không bịa cốt truyện và không gán danh xưng riêng.
  BẤT ĐỊNH 1: `visa` là thiên nga, ở đây là lời miệt thị người kia cong queo. Bản dịch dùng
  quặn quẹo để giữ nghĩa miệt thị; nếu dịch sát thì phải để lại thiên nga, mà đặt thiên
  nga cạnh ma quỷ trong cùng một vế thì người đọc không hiểu. Đây là chỗ duy nhất trong lát
  có dịch cảm tính, và đã ghi lại ở đây.
  BẤT ĐỊNH 2: `mā` ở 1.3 và 2.3 là dấu cấm, không phải mệnh lệnh cầu xin. Nghĩa là cầu
  cho ma quỷ đừng ăn ta, và câu đối đáp là cầu cho ma quỷ cứ ăn ngươi. Câu 1.3–1.4 và
  2.3–2.4 vì thế là đối xứng, dịch theo cặp.
  `aparāni ca vīsatiṁ` là hai mươi năm còn lại, nên trăm hai mươi; không ghi số tổng ra
  vì Pāli không cộng từng chữ.
  `brūsi` là hiện tại của bhrū, sẽ khóc; ghép với susīma là hình ảnh khóc đưa tơ vải rách ra.
  Dịch là sẽ có tơ mảnh, các ngươi sẽ khóc.
  Tiền lệ chung: Jātaka, Bộ Hai Bài Kinh, Phẩm Tàn Tật, nhấy kép, số thứ tự; xem ja153.
  Hạ triangulation 7.0: không tầng Anh, không bản Việt tham khảo.
  Lượt cải thiện 2026-10-13 (đọc đối kháng từng khoá với Pāli; 9/13 khoá đổi):
  RÚT LẠI các nhận định cũ ở trên: (a) `bhagga` KHÔNG có nghĩa "kẻ ăn" — không có căn cứ
  từ vựng nào cho nghĩa đó; (b) các ý về `visa` = thiên nga, `brūsi`, `susīma`, tơ vải rách
  KHÔNG liên quan: những từ ấy không có trong bài này, phần ghi chú đó là nhầm lẫn và không
  dùng làm căn cứ; (c) `visaṁ` ở 2.3 là "thuốc độc" theo nghĩa thường, không có nghĩa bóng.
  Sửa 1 (accuracy, 0.4 / 1.1 / 3.1): bỏ "Kẻ Ăn", để nguyên `Bhagga` — 0.4 "5. Kinh Bhagga",
  1.1 "Hãy sống trăm năm, Bhagga," và 3.1 "Kinh Bhagga thứ năm." Cách này theo tiền lệ giữ
  nguyên tên riêng trong tầng (`Guṇa`, `Suhanu` ở ja157, ja158; xứ `Bhagga` ở mn15, mn85).
  Đã đổi theo: translationTitle và thẻ `bhagga` trong meta này.
  Sửa 2 (accuracy/grammar, 1.4 và 2.4): `jīva tvaṁ sarado sataṁ` là mệnh lệnh lặp lại, nên
  dịch "ngươi hãy sống trăm mùa thu"; bỏ "còn ... thì" (Pāli không có tương phản) và bỏ
  "đủ" (Pāli không có); `sarado` giữ "mùa thu" (khác `vassa` ở 1.1/2.1, và tầng chưa có
  tiền lệ nào cho cụm này: 2 khoá ở chính bài, 0 nơi khác).
  Sửa 3 (terminology, 1.3 và 2.3): `pisācā` cùng một từ nên dịch cùng một chữ "quỷ" ở cả
  hai khoá (trước: "ma quỷ" và "lũ quỷ"); tiền lệ "quỷ" đứng một mình: dn3, mn66, ja547.
  Hai vế `Mā maṁ ... khādantu` / `Visaṁ ... khādantu` đều là cầu mong nên dùng chung "Mong"
  (trước: "Xin đừng để" và "Mong"). 2.3 bỏ "phải" (Pāli không nói ăn nhầm).
  Sửa 4 (clarity, 1.2 và 2.2): `ca` là "và", không phải "rồi"; hai khoá Pāli trùng nguyên
  văn nên Việt giống hệt: "và thêm hai mươi năm nữa;". Số: `vassasataṁ` trăm năm + `vīsatiṁ`
  hai mươi năm; không ghi số tổng 120 vì Pāli không cộng.
  Phép đo: đủ 13/13 khoá, đúng thứ tự Pāli; nháy khớp Pāli từng khoá (0 lệch); không có dấu
  lược `…` ở Pāli lẫn Việt (phép dấu lược chạy rỗng); 1 cặp Pāli trùng nguyên văn trong bài
  (1.2/2.2), 0 cặp Việt khác nhau; không Pāli lọt sang Việt ngoài tên riêng Bhagga.
  BẤT ĐỊNH CÒN LẠI (giữ nguyên, không phân xử được): `bhagga` ở 1.1 là vocative nhưng không
  rõ là tên riêng, tên dân/xứ (cf. `bhaggesu` ở mn85) hay tính từ "gãy, vỡ" (bhagga ở ja324
  nghĩa này); tầng Pāli đã ghim không có bản Anh, không có chú giải nên không có căn cứ chọn.
  Bản dịch để nguyên tên Bhagga để không khẳng định nghĩa nào. Cũng không rõ ai nói với ai
  trong hai vế (lời chúc sống lâu đối đáp), vì tầng đã ghim chỉ có phần kệ.
  KHÔNG ĐỔI dù nghi ngờ: `0.3` "Phẩm Tàn Tật" cho `Daḷhavagga`. 9/10 bài trong vagga dùng
  cách này (ja159 là "Phẩm Người Yêu") nhưng `daḷha` ở 300+ khoá khác của tầng được dịch là
  vững chắc/kiên cố/chắc; "Tàn Tật" không có căn cứ từ vựng. Sửa riêng bài này sẽ làm 0.3
  lệch 9 bài còn lại, nên để người biên tập quyết định một lần cho cả vagga ja151–ja160.
  Điểm đổi: grammar_logic 8.8 -> 9.2 (mệnh lệnh ở 1.4/2.4, 1.1 hãy sống, ca = và; đối xứng
  hai vế 1.3/2.3). technical_integrity 10.0 -> 9.6: nội dung đã đổi nên bản chấm trước không
  còn áp dụng, và lượt này chưa chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build`. Giữ nguyên: semantic_fidelity 8.8 và ambiguity_integrity 8.6 (bất định
  về `bhagga` còn), terminology 8.5 (vấn đề Daḷhavagga còn), triangulation 7.0 (không có bản
  Anh độc lập, không có bản Việt tham khảo). final_score vẫn 8.96.
