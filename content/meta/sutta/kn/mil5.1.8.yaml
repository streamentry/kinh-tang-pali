notes: |-
  Đủ 77/77 khoá của bài, đúng thứ tự Pāli, không khoá nào ngoài `all`. Dịch trực tiếp từ Pāli root; đọc cả bài trong bối cảnh (câu hỏi của vua → tám nguyên nhân của cảm thọ → trường hợp bàn chân Thế Tôn → thí dụ đại địa → trích dẫn Moḷiyasīvakasutta) trước khi dịch từng khoá, và đối chiếu bản Việt đã publish của `sn36.21` (Kinh Với Sīvaka) cho phần trích dẫn.

  **Coverage English: không đo được gì ngoài con số 0.** Mẫu số 58 khoá có nội dung (đếm theo gộp khoảng trắng và theo bỏ hết khoảng trắng đều ra 58; 15 khoá còn lại là block tham chiếu `:0` hoặc khoá ngắn hơn 40 ký tự). `reference-gaps.yaml` chưa có entry cho `mil5.1.8`; entry (58/58 thiếu English, coverage 0) thuộc việc của người điều phối, và có entry cũng không cứu được `published`. Không tầng tham khảo nào được đối chiếu: mọi chỗ trong bản dịch dựa vào Pāli một mình, cộng tiền lệ Việt đã publish.

  **Năm phép kiểm.**
  (1) Tập khoá Việt = tập khoá Pāli: 77/77, cùng thứ tự.
  (2) Nháy đơn `‘ ’` và nháy kép `“ ”` khớp Pāli từng khoá: 77 khoá × 4 loại dấu, 0 lệch. Dấu nháy kép của vua và của Nāgasena chạy qua ranh giới khoá (mở `4.1`, đóng `4.14`; mở `5.1`, đóng `9.2`; mở `9.4`, đóng `10.1`; mở `10.3`, đóng `14.1`) và được giữ đúng như Pāli; khối nháy đơn lời Phật mở ở `12.1` và đóng ở `13.12`, bên trong có nháy kép ở `12.4` và `13.10`.
  (3) Pāli trùng nguyên văn trong chính bài: 3 nhóm (`7.2` = `8.2`; `12.4` = `13.10`; `12.5` = `13.11`), bản Việt giống hệt nhau ở cả ba nhóm, 0 cặp lệch.
  (4) Dấu lược: Pāli có `…pe…` ở 11 khoá (`4.5`–`4.10`, `13.2`–`13.6`), Việt giữ đúng MỘT `…` ở cả 11 khoá và không mở rộng; Pāli không có `…` hay `(…)` nào khác, Việt cũng không.
  (5) Số Pāli: xem dưới.
  Thêm: NFC đạt, 0 khoá rỗng, 0 khoảng trắng thừa, không có Pāli lọt sang Việt ngoài tên riêng và nhan đề (Milindapañha, Meṇḍakapañha, Nāgasena, Rājagaha, Jīvaka, Devadatta, Moḷiyasīvaka, Sīvaka).

  **Số Pāli, tự tính.** `aṭṭhahi kāraṇehi` = 8 lý do; đếm danh sách ở `4.4`–`4.11`: gió, mật, đờm, kết hợp, thời tiết thay đổi, tự mình bất cẩn, nỗ lực, quả nghiệp = 8, khớp. `dasavidhena` (gió) = 10: lạnh, nóng, đói, khát, ăn quá no, đứng, gắng sức, chạy vội, bị tác động, quả nghiệp = 10, khớp; `nava vidhā` = 9 = 10 trừ `kammavipāka`, khớp với câu `na te atīte, na anāgate`. `tividhena` (mật, đờm) = 3: lạnh, nóng, ăn uống / lạnh, nóng, ăn uống = 3 mỗi bên. `channaṁ etesaṁ samuṭṭhānānaṁ` (`10.4`) = 6 = 8 trừ `opakkamika` và `kammavipāka`, tức sáu nguyên nhân đầu của danh sách. `dve selā` = hai khối đá. `bahūni jātisatasahassāni` = nhiều trăm ngàn đời (không quy ra số). `cātumahābhūtika` = bốn đại. Không có cụm số nào thuộc loại chưa phân xử được (`Tiṁsakappasahassa`).

  **Tiền lệ (đếm trên tầng vi hiện có, loại tệp này).**
  Pāli trùng nguyên văn với bài khác: đã dò 77 khoá, 12 khoá có Pāli trùng nguyên văn với bài đã dịch (`0.1`, `0.2`, `0.3`, `4.3`, `10.2`, `12.6`, `13.3`, `13.4`, `13.5`, `13.6`, `13.7`, `14.2`); trong 12 khoá đó bản Việt của tôi khác bản đã có ở 2 khoá: `13.3` (cố ý, xem dưới) và `10.2` (`thưa ngài` thay `thưa tôn giả`, đồng bộ cách xưng trong bài). Cặp `0.2` `Meṇḍakapañha` → `Phẩm Meṇḍakapañha` theo phạm vi gần (`mil5.1.*`), dù toàn `mil` để trần ở nhiều khoá hơn; `0.3` `Phẩm Iddhibala`; `14.2` dùng lại nguyên văn dạng đa số `Lành thay, thưa ngài Nāgasena, đúng là như vậy, trẫm xin kính nhận.` (17 khoá cùng Pāli viết `thưa ngài`, chia 10 và 7 theo hai biến thể dấu chấm; còn lại là `bạch ngài`/`bạch tôn giả`/`con`). Các khoá `12.6`, `13.4`–`13.7` dùng lại nguyên văn bản Việt đã publish của `sn36.21` (dạng `do thời tiết thay đổi mà sinh khởi …`, `do tự mình bất cẩn mà sinh khởi …`, `do nỗ lực mà sinh khởi …`, `Có những cảm thọ do quả nghiệp mà sinh khởi.`, `Nên Ta nói những sa-môn Bà-la-môn ấy là sai.`); khoá `13.2` dùng cùng dạng `do chứng gió mà sinh khởi …`.
  Văn xưng: `bhante nāgasena` → `thưa ngài Nāgasena` (toàn `mil`: `Bạch ngài` 106, `Thưa Đại đức` 44, `Thưa ngài` 31, `Bạch tôn giả` 27); tôi theo `Thưa ngài` để khớp nguyên văn với khoá `14.2` đa số, thay vì `Bạch ngài`. `mahārāja` → `tâu đại vương`; vua tự xưng `trẫm`. Hai phạm vi cho đa số khác nhau (`Bạch ngài` toàn tầng so với `Thưa Đại đức` ở `mil5.1.*` gần nhất); điểm này là lựa chọn biên tập, có thể thống nhất lại cho cả phẩm.
  Thuật ngữ, đếm đối chiếu theo Pāli: `semha` → `đờm` (33 khoá có `semha`: `đờm` 19, `đàm` 12; theo `sn36.21`); `pitta` → `mật` (37 khoá, 28 viết `mật`); `vāta` → `gió` (185 khoá: `gió` 89, `phong` 6); `kammavipāka` → `quả nghiệp` (57 khoá: `quả báo` 34, `quả nghiệp` 7, `dị thục` 5) — tôi chọn `quả nghiệp` để khớp nguyên văn `sn36.21` ở `13.7` và giữ một dạng trong cả bài, dù `quả báo` là đa số toàn tầng; `jhāpetvā` → `thiêu sạch` (34 khoá có `jhāp-`: `thiêu` 5, `đốt` 4, 0 tiền lệ trực tiếp cho `akusalaṁ jhāpetvā`); `sabbaññutā` → `sự toàn tri` (47 khoá: `toàn tri` 9, `nhất thiết chủng trí` 10, `toàn giác` 8: ba nhóm gần ngang nhau; theo `mil5.1.3`, `mn90:17.4`); `devātideva` → `bậc Thiên Trung Thiên` (3 khoá: `Thiên Trung Thiên` 1, `Trời giữa chư Thiên` 2); `leḍḍu` → `cục đất` (32 khoá: `cục đất` 7, `đá` 24 — nhiều khoá `leḍḍu` đi kèm `daṇḍa`/`sattha` trong liệt kê hình phạt; ở đây là vật ném lên rồi rơi xuống đại địa nên `cục đất`); `sakalikā` → `mẩu sỏi` theo `mil5.3.8` (cùng sự kiện Devadatta; `mil5.1.3` nháp dùng `mảnh đá`); `lohitapakkhandika` → `kiết lỵ ra máu` (`dn16:4.20.1`, `mn46:21.2`); `saṁyuttanikāya` → `Tương Ưng Bộ` (trong `mil`, 10 khoá có chữ `Tương Ưng`, 9 trong đó viết đủ `Tương Ưng Bộ`); `ubhato koṭika pañha` → `câu hỏi hai đầu` (`mil5.1.3`, `mil5.3.8`).
  `sannipātika` → `do sự kết hợp` (an4.87:5.5 `do sự kết hợp của chúng`; `mil5.1.3` nháp `sự hợp lại`): ở khoá `13.3` Pāli trùng nguyên văn `sn36.21:3.3`, bản đó dịch `do chứng trầm kha mà sinh khởi …`; tôi KHÔNG giữ `trầm kha` vì `sannipāta` là `sự kết hợp` (chính `sn36.21:5.2` dịch `sự kết hợp của chúng`), còn `trầm kha` là bệnh nặng kéo dài, không phải nghĩa của `sannipāta`. Đây là điểm bản Việt khác tiền lệ có chủ ý; người biên tập có thể muốn sửa `sn36.21:3.3` cho khớp.
  Đặt mới hoặc 0 tiền lệ: `kāye abhisanne` → `khi thân bị ứ đầy`; `vireko kārito` → `cho dùng thuốc xổ`; `upaṭṭhākena therena` → `vị Trưởng lão thị giả`; `koṭṭhāsato lakkhaṇāni` → `các đặc tướng riêng theo từng phần`; `saṁyuttanikāyavaralañchake` → `thuộc phần mang dấu ấn cao quý của Tương Ưng Bộ` (`lañchaka` = dấu ấn, không có tiền lệ); `veyyākaraṇa` → `lời giải đáp`; `sattakāraṇa` → `lý do thuộc về chúng sinh`; `pubbe katahetu` → `do việc đã làm từ trước làm nhân` (`sn36.21` dịch `do nghiệp quá khứ làm nhân`; tôi giữ sát chữ, không nói `nghiệp`).

  **Bất định đã phân xử, ghi lại để biên tập xem lại.**
  (1) `5.2` mười cách làm gió rối loạn: `ṭhānena` → `do đứng`, `padhānena` → `do gắng sức`, `ādhāvanena` → `do chạy vội`, `upakkamena` → `do bị tác động`. Bốn từ này không có tiền lệ trong tầng; nghĩa `ṭhāna` (đứng, hay tư thế) và `upakkama` (bị tác động từ bên ngoài, hay sự cố ý gắng sức) không phân xử chắc, nên dịch sát từng từ, không thêm lời giải thích.
  (2) `opakkamika` → `do nỗ lực` ở mọi khoá (khớp `sn36.21`, `mn85`), nhưng ở `6.1` đây là trường hợp bàn chân bị thương do việc làm của Devadatta, tức nghĩa gần `bị tác động từ bên ngoài` hơn `tự mình nỗ lực`. Giữ một dạng nhất quán với tiền lệ, nghĩa chưa phân xử.
  (3) `visamaparihāra` → `tự mình bất cẩn` (theo `sn36.21`); `mil5.1.3` nháp dùng `chăm sóc không điều hòa`, `an4.87` dùng `không biết chăm sóc mình`. Ba cách dịch cùng nghĩa cơ bản, chưa thống nhất toàn tầng.
  (4) `4.13` `te ime puggalā sattakāraṇaṁ paṭibāhanti` → `bác bỏ lý do thuộc về chúng sinh`: `sattakāraṇa` có thể là `nguyên nhân tác động lên chúng sinh` hoặc `lý do do chính chúng sinh tạo ra`; không phân xử chắc; `vibādhati` → `làm khổ hại`.
  (5) `6.2` và `7.2`/`8.2`: câu `kammavipākato vā … kiriyato vā, tatuddhaṁ natthaññā vedanā` đi liền với `6.1` (`na kammavipākajaṁ … opakkamikaṁyeva`) và `8.3` (`natthi bhagavato kammavipākajā vedanā`). Tôi dịch sát chữ là một câu `hoặc … hoặc …; ngoài ra không có cảm thọ nào khác`, không dung hòa cho Pāli khỏi mâu thuẫn bề ngoài với `6.1`/`8.3`. `kiriyā` → `hành động` (`5.9`, `6.2`).
  (6) `6.2` `tāsaṁ pahārena papaṭikā bhijjitvā`: tôi đọc `tāsaṁ` là hai khối đá đỡ tảng đá và `papaṭikā` là mảnh vỡ bật ra từ chúng; cách đọc khác (mảnh vỡ bật ra từ tảng đá lớn) không đổi nghĩa chung.
  (7) `9.3` Pāli kết `nipatati”.` không có `ti`; giữ dấu nháy đóng và dấu chấm ngoài như Pāli.
  (8) `14.1` `Itipi` → `Cũng vì thế`.

  **Lỗi bản nháp đã bắt:** bản nháp đầu dịch `semha` là `đàm` theo `mil5.1.3` và `an4.87`; đo lại theo Pāli (33 khoá có `semha`) ra `đờm` 19, `đàm` 12 và `sn36.21` cũng dùng `đờm`, nên đổi `đờm`; `selā` bản nháp đầu dịch `ngọn núi đá`, đổi `khối đá` vì Pāli là đá chứ không phải núi; bản nháp đầu ghi cả `này Sīvaka` ở năm khoá `13.2`–`13.6` trong khi bản `sn36.21` đã publish bỏ danh xưng ở các chỗ lược `…pe…`, đã sửa để dùng lại nguyên văn.

  `technical_integrity` 9.6 vì lát này không được chạy cổng. Bốn lệnh còn lại do coordinator chạy trước khi publish: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
