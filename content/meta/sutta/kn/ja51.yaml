notes: |-
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc hết v5/p2.txt trước khi viết. Tầng english-sujato CÓ mặt ở commit này (8/9 khoá có prose); khoá 2.1 Sujato để trống như ở mọi Jātaka, dịch từ Pāli theo tiền lệ ja1/ja2 đã published. Không có segment Pāli ≥ 40 ký tự nên sàn coverage 0,8 không kích hoạt và reference-gaps.yaml không liên quan. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú (countsTowardCoverage false, requiredFor rỗng) nên không có bản Hòa thượng Thích Minh Châu để đối chiếu — đây là giới hạn của bản chụp upstream, không phải thiếu sót của repo. 0.1 Jātaka giữ nguyên âm: 70/70 tệp kn/ja* sẵn có làm vậy, kể cả ja1/ja2 đã published. 0.2 Ekakanipāta → Bộ Một Bài Kinh (83 occ). Không có dấu lược …pe… nên hai phía đều 0. technical_integrity 9.6 vì chốt _hvi.py pass và tôi tự kiểm lại 108 khoá (NFC, trùng Pāli, Pāli lọt, số dấu lược, ngoặc kép, ký tự phi Latin) — nhưng repo-wide validate/test/build không chạy vì lát này cấm, nên không thể cho 10.0.
  Tiêu đề mahā-sīla → Đại Hạnh. Ghi lại một chỗ lệch có chủ ý với kho: Sīlavagga (ja12:0.3) đã dịch thành Phẩm Giới, tức kho đang để sīla → giới; ở đây mahā-sīla là danh từ tán dương một bậc, không phải giới luật, nên Đại Giới sẽ tối nghĩa và Đại Hạnh (hạnh 3.745 occ) mới đúng. Vẫn ghi lại để lát sau không tưởng là lỗi. Còn āsīsavagga → Phẩm Hy Vọng: hy vọng 37 occ và an3.13:0.3 đã dịch Āsīsa thành Kinh Hy Vọng. Bất định đã xử: Āsīsetheva (-setheva = aorist khuyết thiếu của ‘là/nên là’ + eva) dịch Chỉ nên mang hy vọng; eva là dạng nhấn, không phải hạn định, nên tôi không dịch thành ‘chỉ có hy vọng thôi’ theo nghĩa đen. Vohaṁ → thấy rõ (không lẫn được). Passāmi giữ là hiện tại, nên dịch Giờ ta thấy rõ chính mình.

  Lô G4 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): sửa khuôn kệ Āsīsetheva/Vāyametheva puriso. Bản
  cũ dịch Chỉ nên … người đàn ông, trong đó eva bị đọc thành chỉ (giới hạn) và puriso thành hô ngữ;
  Pāli puriso là chủ ngữ (danh cách), eva nhấn mạnh động từ ước định. Nay dịch Người đàn ông nên cứ
  mang hy vọng / nên cứ cố gắng, khớp bản Anh Sujato A man should have hope / make an effort ở ja51,
  ja52. Áp dụng đồng loạt cho ja51, ja52, ja483, ja539; ja124 (Người hãy cố gắng) không đổi.
