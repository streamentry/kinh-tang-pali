notes: |-
  Đợt 19, làn 90. Dịch từ Pāli root commit đã ghim, đủ 129/129 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; người nói chỉ được đọc từ nội dung kệ (xem BẤT ĐỊNH, mục 10). Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề và colophon.**
  - `0.2` “Bộ Hai Mươi Bài Kinh” và `0.3` “Phẩm Mātaṅga”: dùng đúng cách đã có ở `ja497:0.2`, `ja497:0.3` (hai khoá Pāli trùng nguyên văn, bản Việt khớp).
  - `0.4` “11. Kinh Quyến Rũ Lớn” (`Mahāpalobhanajātaka`): `palobhana` là danh từ chỉ việc quyến rũ/cám dỗ (gốc `palobheti`); tầng dịch `palobh-` là “quyến rũ” 3 khoá, “cám dỗ” 2 khoá (`snp3.11:25.3` “cám dỗ”, `ja411:4.4` “quyến rũ”). `Mahā-` → “Lớn” theo khuôn “Kinh Xoài Lớn” (`ja429`), “Kinh Con Công Lớn” (`ja491`), “Kinh Thương Nhân Lớn” (`ja493`): trong nhóm tiêu đề Jātaka có `Mahā-`/`Cūḷa-`, đo thấy 8 tiêu đề `Mahā-`/`Cūḷa-` dịch “… Lớn/Nhỏ” (`ja193`, `ja263`, `ja264`, `ja429`, `ja430`, `ja447`, `ja491`, `ja493`) và 3 tiêu đề dịch “Đại …” (`ja51`, `ja77`, `ja453`). Số `11` ở `0.4` khớp `ekādasamaṁ` (11) ở `32.1`.
  - `32.1` “Kinh Quyến Rũ Lớn, thứ mười một.”: có dấu phẩy trước số thứ tự, theo các bài kề (`ja500`, `ja505`, `ja509` đều “…, thứ N.”).
  - Lưu ý ngoài lát: `ja263:0.4` và `ja263:4.1` (`Cūḷapalobhanajātaka`, cùng gốc `palobhana`) đang dịch “Kinh Nghi Kỵ Nhỏ”; “nghi kỵ” không phải nghĩa của `palobhana`. Khi người điều phối rà tiêu đề thì nên thống nhất hai bài này.

  **Tiền lệ dùng lại nguyên văn.** Đã dò 129 khoá: 24 khoá (không kể `0.x`) có Pāli trùng nguyên văn ở bài khác trong tầng Pāli đã ghim và có bản Việt, tổng cộng 67 cặp (khoá của bài này, khoá nơi khác). Trong 67 cặp đó, 24 cặp bản Việt khác (dấu câu và chữ hoa không tính), thuộc 18 khoá. Bản Việt dùng lại nguyên văn (đã so sau khi bỏ dấu câu và chữ hoa): `0.2`, `0.3` (theo `ja497`); `17.1` (= `cp26:12.1`); `20.4` (= `snp1.7:18.2`); `24.4` (đa số `tha-ap4`, `tha-ap9`, `tha-ap10`, `tha-ap11`); `26.4` và `27.4` (= `an3.29:9.2`, `ja262:2.4`, `ja263:2.4`); `28.2` (= `ja262:3.2`, `ja263:3.2`); `14.4` (= `sn4.25:2.4`); `30.4` (= `cp25:5.4`); `31.3` (= `an6.54:22.3`, `an6.54:23.5`, `snp1.7:27.3`); `1.2` (cùng chữ với `ja494:2.1`, chỉ khác chữ hoa ở đầu câu). Các cặp khác có lý do cụ thể, ghi dưới đây.
  - `19.3` (khác `tha-ap261:1.3` “Sau khi dựng một túp lều quán tư”): `paṇṇasālā` ở `tha-ap283:1.1` và `tha-ap425:1.4` dịch “chòi lá”; “lều quán tư” không phải nghĩa Pāli của `paṇṇasālā`. Dùng “chòi lá”.
  - `1.4` (khác `sn9.6:2.4` “nơi mọi điều mong ước đều viên mãn” và `ja494:7.4`, `ja494:18.4` “những vị đầy đủ mọi dục lạc sung túc”): `samiddhisu` là vị trí cách số nhiều của danh từ giống cái `samiddhi` (“sự sung túc/viên mãn”), không phải tính từ chỉ người, nên không đọc “những vị”. Giữ `kāma` là “dục lạc” vì đoạn kệ nói về `kāma` ở các khoá liền sau (`2.1`, `4.4`, `5.4`); tầng có hai phạm vi cho số khác nhau: `sn9.6` 1 khoá “mong ước”, `ja494` 2 khoá “dục lạc”.
  - `25.1`–`25.4`, `26.1`, `26.3`, `27.1`–`27.3`, `28.1`, `28.3` (khác `ja262`/`ja263`): đây là các khoá Pāli trùng nguyên văn với hai bài `ja262` và `ja263` đã có bản Việt. Bản Việt của hai bài kia theo tôi đọc có chỗ không khớp Pāli, nên không dùng lại: (a) `Sīdanti naṁ viditvāna` đã dịch “Biết rõ điều ấy, họ xấu hổ”, trong khi `sīdanti` là “họ chìm” (cùng gốc `saṁsīdasi`, `sīdate`, `sīdamānaṁ` của bài này; tầng dịch các dạng `sīd-` là “chìm” ở 28 trên 56 khoá); (b) `Analā mudusambhāsā` đã dịch “Không phải lời lẽ trong lành”, bỏ mất `mudusambhāsā` (“lời nói mềm mỏng”); (c) `Yaṁ etā upasevanti` đã dịch “Kẻ nào đến gần chúng”, đảo chủ thể (`etā` là chủ ngữ, `yaṁ` là tân ngữ); (d) `Jātavedova saṁ ṭhānaṁ … anudahanti naṁ` đã dịch “lửa Jātavedas sẽ làm cho chúng tan tành”, thiếu so sánh “như lửa thiêu chính nơi nó trú” và đảo tân ngữ; (e) `Missībhāvitthiyā gantvā` đã dịch “đi đến nơi Missībhāvitthi”, coi một cụm danh từ là tên riêng, trong khi `missībhāvaṁ itthiyā gantvā` là “đã chung sống/gần gũi với người nữ” (đối chiếu `dn21:1.5.48` `missībhāvaṁ gato tayā`, Sujato “become one with you”). Tôi không sửa hai bài đó (ngoài lát); người điều phối nên cân nhắc rà `ja262` (`2.1`–`3.4`) và `ja263` (`1.1`–`3.4`). Số khoá bài kia bị ảnh hưởng: `ja262` 8 khoá, `ja263` 12 khoá.
  - `26.4`, `27.4` còn khác `ja437:1.4` (“nên hãy tránh xa”) vì câu đó đứng sau liên từ khác; hai khoá này dùng `ārakā parivajjaye` “hãy tránh xa từ xa” như `an3.29:9.2`, `ja262:2.4`, `ja263:2.4` (4 chỗ cùng một dạng).
  - `30.4` (khác `snp3.1:1.4` “Đã chọn lấy hạnh xuất gia”): theo `cp25:5.4` (có “hoan hỷ”, giữ sắc thái `samarocayi`).
  - `31.3` (khác `ja431:9.3` “đã đẩy lùi tham dục”): 3 chỗ (`an6.54:22.3`, `an6.54:23.5`, `snp1.7:27.3`) dịch “sau khi ly tham ái dục”; theo đa số 3/4.
  - `24.4` khác `tha-ap60:4.2` chỉ vì khoá kia có chủ ngữ “bậc Thầy” trong cùng câu; các chỗ còn lại (4 khoá) giống hệt.

  **Trùng nguyên văn trong chính bài (có kết quả):** 4 nhóm khoá Pāli trùng nguyên văn trong bài, cả 4 đều dịch giống hệt nhau (0 cặp lệch): `19.2` với `23.2` (`samuddaṁ upasaṅkami;`), `24.1` với `30.1` (`Khattiyo ca isiṁ disvā,`), `26.3` với `27.3` (`Sīdanti naṁ viditvāna,`), `26.4` với `27.4` (`ārakā parivajjaye.`).

  **Số Pāli:** không có phép tính nào. `vīsati` (`0.2`) = 20; `ekādasamaṁ` (`32.1`) = 11, khớp số `11.` ở `0.4`; `eka-` (`4.3` `Ekaputto`) = 1, `eko` (`3.4`) và `ahameveko` (`16.3`) là “một mình / chỉ mình”. Không gặp cụm số chưa phân xử được (không có `Tiṁsakappasahassa`).

