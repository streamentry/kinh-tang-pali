  **Dấu câu (khớp Pāli từng khoá).** Nháy kép `“`/`”`: Pāli 12/12, Việt 12/12, lệch 0/129 khoá. Nháy đơn `‘`/`’`: Pāli 0, Việt 0. Dấu lược `…`, `…pe…`, `(…)`: Pāli 0, Việt 0, nên không có gì để cân (phép này chạy trên 129 khoá nhưng rỗng về nội dung, không phải “0 lỗi” có nghĩa). Cấu trúc nháy của Pāli: lời trích mở ở `4.3` và đóng ở `5.4`; `7.3`–`7.4`, `8.3`–`8.4`, `11.1`–`11.4`, `12.1`–`12.4`, `13.1`–`13.4`, `15.3`–`15.4`, `16.3`–`16.4`, `17.3`–`17.4`, `18.3`–`18.4` là các lời trích riêng; `23.3` mở và đóng trong cùng một khoá (`gamissan”ti`); `25.1` mở và `28.4` đóng. Khoá `5.4` kết bằng `?”` ở bản Việt (Pāli kết `”.`) vì khoá `5.1`–`5.4` là một câu hỏi.

  **Hai chỗ đổi vị trí trong bản Việt so với thứ tự dòng Pāli, ghi để dễ đối chiếu.** `18.1`: chủ ngữ `rājā` và đồng vị ngữ `khattiyo` (nằm ở `18.2` trong Pāli) được đưa lên `18.1` thành “vua, bậc Sát-đế-lợi” để tránh đọc nhầm “Sát-đế-lợi” là hoàng tử; `18.2` chỉ còn “khỏi chính xứ sở của mình”. `8.1`: `tathāvādiniṁ` dịch “Nàng đã nói như thế” rồi nối “nhà vua / nói với thiếu nữ ấy điều này” sang `8.2`. Hai chỗ này không thêm, không bớt ý.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `Analā` (27.1): đọc là “không biết đủ” (`a-` + `nala`, nghĩa “không bao giờ đủ”), nối với `duppūrā tā nadīsamā` “khó lấp cho đầy, họ giống như sông”. Tầng Pāli đã ghim không có chú giải; cách đọc khác là `a-nalā` “không phải [lời] …”, như bản `ja262` đã chọn. Chọn “không biết đủ” vì ghép với `duppūrā` (khó lấp cho đầy) cùng một hình ảnh sông không bao giờ đầy.
  2. `Sīdanti naṁ viditvāna` (26.3, 27.3): dịch sát chữ “người ta chìm xuống; biết điều ấy rồi”, coi `naṁ` là tân ngữ của `viditvāna` (“điều ấy”). Cách đọc khác: “biết rằng người ta chìm vì họ”, hoặc `naṁ` chỉ người nữ. Câu Việt không thêm “vì họ”.
  3. `Āvaṭṭanī mahāmāyā brahmacariyavikopanā` (26.1–26.2): chủ ngữ không có trong khoá (ngầm là người nữ, đọc từ `25.3` `itthiyā` và `27.2` `tā`); bản Việt không thêm chủ ngữ. `āvaṭṭanī` dịch “lôi cuốn” theo `mn56:8.3`; nghĩa đen “xoay quanh/cuốn vào”, “xoáy nước” là cách đọc khác.
  4. `chādeyyu` (12.4): dịch “chúng sẽ càng lúc càng làm ngài vui thích”; chủ ngữ số nhiều không nêu (có thể là “những nàng ấy” hoặc “các dục lạc”). Dùng “chúng” để không chọn một nghĩa. `chādeti` ở nghĩa “làm vừa lòng” suy từ ngữ cảnh; 0 tiền lệ trong tầng.
  5. `issādhammo ajāyatha` (15.2): “tính ghen tị” coi `dhamma` là “tính chất/khuynh hướng”; có thể đọc “pháp ganh tị”. Chọn “tính”.
  6. `Taṁ tathāvādiniṁ … kumāriṁ` (8.1–8.2): `taṁ` đứng với `kumāriṁ`, tức “thiếu nữ đã nói như thế”; câu Việt tách thành hai mệnh đề.
  7. `Tañca rājā vivāhesi, samhā raṭṭhā ca khattiyo` (18.1–18.2): `khattiyo` ở cách chủ ngữ nên đọc là đồng vị của `rājā` (vua), phù hợp lời `18.3` dùng `mayhaṁ` (“của ta”). Cách đọc khác (khattiya là hoàng tử) không khớp cách ngữ pháp của danh từ. `vivāhesi` dịch “trục xuất”; có thể là biến thể của `vivāsesi`; nghĩa gần như nhau.
  8. `Athettha isi māgacchi, samuddaṁ uparūpari` (20.1–20.2): `uparūpari` dịch “ngay phía trên”; không nêu “bay” hay “đi” vì động từ là `āgacchi`; việc bay chỉ hiện ở `23.3`, `29.4`, `30.2` (`vehāyasaṁ`).
  9. `Svāssu tāyeva saññāya` (2.3): `assu` được đọc là tiểu từ nhấn mạnh sau `so`; `tāyeva saññāya` “chính do tưởng ấy” là cái tưởng về cõi Phạm thiên không có dục; không giải thích thêm trong thân kinh.
  10. Người nói không có trong tầng Pāli đã ghim, nên được suy từ nội dung kệ và không ghi vào thân kinh: `1`–`3` kể về hoàng tử, `4`–`5` vua than, `6` giới thiệu thiếu nữ, `7`–`8` thiếu nữ và vua, `9` kể thiếu nữ hát, `10` kể, `11` hoàng tử hỏi, `12` người xung quanh đáp (gọi `deva`), `13` hoàng tử, `14`–`16` kể, `17`–`18` dân chúng thưa và vua ra lệnh, `19`–`24` kể, `25`–`28` hoàng tử nói với ẩn sĩ, `29`–`31` kể. Các đại từ (“ngài”, “ta”, “nàng”) chỉ theo ngôi của Pāli, không gán danh tính.
  11. `ca` đầu câu ở `21.1`, `18.1`, `9.1`, `3.1`: dịch “Và …”, chỉ nối câu, không thêm nội dung.
