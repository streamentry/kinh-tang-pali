  - `isi` → “ẩn sĩ”: toàn tầng 36 khoá “ẩn sĩ”, 8 “đạo sĩ”, 2 “tiên nhân”; riêng Jātaka 7 “đạo sĩ”, 5 “ẩn sĩ” (hai phạm vi cho đa số khác nhau). Chọn “ẩn sĩ” theo toàn tầng và theo các bài kề (`ja497`, `ja498`, `ja503`, `ja509` dùng “ẩn sĩ”).
  - `rājaputta` (22.1) → “hoàng tử”: trong Jātaka 6 trên 10 khoá có `rājaputta` dịch “hoàng tử” (2 “công chúa”, 1 “con vua”); toàn tầng “vương tử” 16 và “hoàng tử” 11 (hai phạm vi cho đa số khác nhau). Chọn “hoàng tử” theo Jātaka và bài kề `ja505` (dùng “hoàng tử” 7 lần).
