notes: |-
  Dịch trực tiếp từ Pāli root; `english-sujato` tại commit đã ghim không có bài này, `vietnamese-current` vắng với Jātaka.
  **Ba** bản Việt trong tầng đã chứa đúng câu kệ của bài này, và tôi dùng lại nguyên văn: `sn1.33` (các câu kệ chư thiên nói về bố thí), `sn1.41` (câu kệ thiêu đốt) và `an3.52` (hai vị bà-la-môn già nua). Pāli trùng nguyên văn: 15 khoá, dù lại nguyên văn 11 khoá.
  Dù lại nguyên văn 11 khoá: `:0.1` (376/392 nơi) · `:1.1`–`:1.4` theo `sn1.41:2.1–2.4` · `:2.1`–`:2.4` theo `sn1.41:3.1–3.4` · `:3.3` theo `sn1.33:10.3` · `:5.1`–`:5.4` theo `sn1.33:13.1–13.4` · `:6.1`–`:6.4` theo `sn1.33:16.1–16.4` · `:8.2` theo `sn1.33:19.2` · `:8.4` theo `sn1.33:19.4`.
  Cố ý KHÔNG dùng lại nguyên văn 4 khoá, vì tiền lệ khác nhau theo ngữ cảnh và tôi chọn theo ngữ cảnh: `:1.2` (`sn1.41` dịch “đồ đạc nào mang ra được”, `an3.52` dịch “người ta đem ra chiếc bọc”) — theo `sn1.41` vì cùng câu kệ nguyên vẹn trong một khối; `:1.3` (“chỉ đồ ấy là hữu ích cho mình” của `sn1.41`); `:2.2` (`sn1.41` “bị già và chết thiêu đốt” so với `an3.52` “bởi già và bởi chết” — Pāli có `jarāya maraṇena ca` nên “thiêu đốt” giữ đủ ý); `:3.4` (`sn1.33:10.4` “kẻ phàm nhân ấy đi đến nơi chốn của cõi trời” nhưng bản đó đóng ngoặc kép và thêm dấu câu khác, bản Jātaka không có).
  Sai khác giữa bản Jātaka và bản Saṁyutta đã tôn trọng, không sửa về bản Saṁyutta: `:6.2` `na karoti` (bản Saṁyutta `na karonti`), `:8.1` `Addhā` (bản Saṁyutta `Saddhā`) — đây là điểm khác biệt thật nên dịch “Xa xa, việc bố thí được khen ngợi nhiều cách”, không theo “với lòng tin”; `:8.3` `Pubbeva` (bản Saṁyutta `Pubbe ca hi`).
  Thuật ngữ theo tiền lệ đếm được: `vetaraṇi` → sông Vetaraṇī (sn1.33:10.3), `yamassa` → Diêm Vương (sn1.33:10.3), `dakkhiṇeyya` → xứng đáng cúng dường (an5.175:1.6), `pāṇabhūta` → có sinh mạng (sn1.33:16.1), `pariṇāyā dhāna` → không có. `brahmacariya` → phạm hạnh (an3.18:1.2, an3.30:1.6); `khattiya` → vua đế-chủ (an3.12:1.1).
  Tên phẩm: `Aṭṭhakanipāta` **0 tiền lệ** trong tầng; tôi dựng “Bộ Tám Bài Kệ” từ đúng mẫu đã chốt ở `BRIEF_VI3` §11 (`Ekakanipāta` → Bộ Một Bài Kinh, `Dukanipāta` → Bộ Hai Bài Kinh) và đúng những gì tầng đã dùng cho `Tikanipāta`/`Cattukanipāta`/`Sattakanipāta` (Bộ Ba/Bốn/Bảy Bài Kệ). `Kaccānivagga` cũng **0 tiền lệ**; tôi giữ nguyên Pāli “Phẩm Kaccānivagga”, theo tiền lệ “Phẩm Kukku”, “Phẩm Kāliṅga”, “Phẩm Kumbha”, “Pathavīvagga”, “Kumbhavagga” — không tự dịch tên riêng.
  Không khoá nào trong 8 bài này có `…pe…` ở Pāli (đã kiểm 296/296 khoá), nên không có dấu lược nào để giữ, và không có chỗ nào bịa dấu lược che chỗ thiếu. Ngoặc kép: Pāli mở ở `:1.1`, đóng ở `:2.4`, mở lại ở `:3.1`, đóng ở `:8.4`; bản Việt giữ đúng hai cặp đó (nên `:5.1` và `:6.1` không mở ngoặc kép mới dù chúng là đầu một câu kệ).
  Đo lại trên đĩa, hai con số coordinator nêu ở mục (4) của prompt KHÔNG khớp: `bhante` trong tầng `mil` dùng **“thưa tôn giả” 149 lần / 71 tệp**, “bạch ngài” chỉ 37 lần / 23 tệp, “bạch thầy” = 0 (giữ nguyên phần đúng của bạn); `mahārāja` dùng **“này Đại vương” 395 lần / 101 tệp**, còn “tâu đại vương” chỉ 169 + “tâu Đại vương” 79 = 248 lần / 32 tệp. Cả 9 bài lân cận mil3.1.12/.14 và mil7.3.1/.9 đều dùng “này Đại vương”, nên lát này theo đo được, không theo con số bạn đưa.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đủ 37/37 khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không trùng nguyên văn Pāli, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
