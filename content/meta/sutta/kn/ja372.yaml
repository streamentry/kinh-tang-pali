notes: |-
  Bản dịch dựng từ Pāli root (content/catalog/sutta/kn.json → .cache/upstream, 33/33 khoá), không có tầng Anh đã ghim để đối chiếu — xem blocking_errors. Cổng coverage đo được là **0/0**, tức mẫu số bằng 0: bài truyện ngắn, khoá dài nhất 27 ký tự, không khoá nào đạt ngưỡng 40 ký tự của `source/layers.yaml`.
  Câu hỏi mở: `ja372:3.1` Mataṁ marissaṁ rodanti. Cụm này và `ja372:6.1` Abbahi (xem thêm dưới) cho thấy bài kể chuyện một con mẹ chim đã chết, và bên kia là con/đàn con đang khóc. Nhưng ở 1.1 Agārā (cư sĩ) lại là người được gọi trực tiếp, còn anagārassa (du sĩ) mới là chủ thể nghĩ về. Tức hai tầng vai — người đã chết và kẻ đang buồn — đảo chiều giữa các khoá. Đã dịch theo cách đọc trực tiếp từng khoá (1.1–1.2 để người đọc tự thấy mâu thuẫn với 3.1 và 6.1), KHÔNG dàn cảnh để làm câu trôi; đây là điểm ít tin cậy nhất về mặt diễn giải, ghi lại đây để người biên tập quyết.
  Điểm ít tin cậy thứ hai, và là chỗ được coi là ít tin cậy nhất: `ja372:0.3` là tên phẩm `Aḍḍhavagga`. Người biên tập giao rằng mỗi truyện một tên riêng và 0 tiền lệ thì phải ghi rõ. Đo lại trên 449 tệp `ja` đã có bản dịch, tên phẩm này có tiền lệ: **5/5** tệp dùng "Phẩm Aḍḍha" (đo sau khi ghi lát này; trước đó là 4 tệp lân cận ja371, ja373, ja374, ja375, nay thêm ja372). Vì vậy đây KHÔNG phải 0 tiền lệ, và dùng đa số đo được "Phẩm Aḍḍha". Ghi rõ con số ở đây để người điều phối gộp. (Tên `Aḍḍhavagga` không có trong tầng tên `name/sutta/ja-name_translation-en-sujato.json` đã ghim — tầng đó chỉ khớp hai tên `pancakanipata` và `chakkanipata` — nên không thể chốt bằng bảng tên của SuttaCentral cho tên phẩm này.)
  `:0.2` Pañcakanipāta: đo lại trên 449 tệp `ja`, không chỉ chuỗi Việt mà khớp trên **giá trị Pāli tuyệt đối**: `Pañcakanipāta` (đo sau khi ghi lát này, 24 tệp có bản dịch): "Nhóm Năm Bài Kệ" 15, "Bộ Năm Bài Kệ" 5, "Bộ Năm Kệ" 3, "Nhóm Năm" 1. Đa số đo được là "Nhóm Năm Bài Kệ" (15). Tuy nhiên bốn tệp lân cận thuộc đúng phẩm này (ja371, ja374, ja375) dùng "Bộ Năm Bài Kệ", và "Bộ … Kệ" là mẫu thống nhất của cả Jātaka cho tên bộ (đo: Bộ Một Bài Kinh 150, Bộ Hai Bài Kinh 100, Bộ Bốn Bài Kệ 50, Bộ Sáu Bài Kệ 17). Chọn "Bộ Năm Bài Kệ" để khớp lân cận và mẫu chung, ghi lại cả hai con số để người điều phối chốt. Đây là chỗ thiếu nhất quán đã có sẵn trong kho, không phải chỗ tôi tự tạo ra thêm.
  Tên truyện `:0.4` và cột bài `:8.1`: "Kinh Migapotaka". Cùng bài đó, `:0.4` giữ số thứ tự như Pāli ("2. ") — đo lại trên kho: ja376…ja397 đều giữ số ở `:0.4` ("1. Kinh Avāriya", "6. Kinh Migālopa"), nên giữ. Cột bài dùng "Kinh X, thứ N." có dấu phẩy: đo 190 tệp có dấu phẩy vs 211 không, nhưng **toàn bộ lân cận** ja368–ja394 đều có dấu phẩy, nên theo lân cận.
  PHẢI ĐỌC TRƯỚC KHI GỘP — bài này trùng nguyên văn với ba bài khác. Tra bằng script trên toàn Pāli root đã ghim (khớp trên **giá trị Pāli tuyệt đối** sau khi cắt khoảng trắng, vì giá trị trong bilara có khoảng trắng cuối nên phải `.strip()`): **26/33 khoá** của ja372 đã xuất hiện nguyên văn ở ja410 (Somadatta — bản kể lại đúng những câu kệ này), ja352 (Sujāta) và ja449 (Maṭṭhakuṇḍalī). Ngoài ra cùng các câu ấy còn có ở pv17 và vv83 (chưa dịch) và ja454 (chưa dịch). Vì vậy đã **dùng lại nguyên văn** bản Việt đã có cho 12 khoá: 1.3, 1.4 (ja410:3.3–3.4), 5.1–5.3 (ja410:7.1–7.3, giống ja352 và ja449), 6.4 (ja410:8.4, giống ja449), 7.2–7.4 (ja410:9.2–9.4, giống ja352 và ja449). Riêng 7.4 giữ dấu `”ti.` để khớp với ba bài kia, dù đa số chung của kho là bỏ (đo 222 bỏ vs 207 giữ) — ở đây luật tái dụng thắng vì Pāli trùng nguyên văn.
  Sáu khoá còn lại CỐ TÌNH khác bản đã có, và đó là phần khó nhất của bài: (1) 2.1–2.3 — ja410 dịch `Saṁvāsena have sakka` thành "Dù là vua trời" và `manussassa migassa vā` thành "hay là loài người, hay là loài thú"; nhưng ở ja372 câu kệ đi ngay cùng 3.1 `Mataṁ marissaṁ rodanti` ("họ khóc cho mẹ đã chết") và 4.4 `aññamaññassa ñātake` ("không biết ai là của ai"), nên `sakka` ở đây phải là "có thể/được" và `migassa` là **con cút** — con cút mà cả bài nói tới. Dịch theo ja410 sẽ khiến 2.1–2.3 thành câu vô nghĩa và đứt mạch với phần sau. Đã dịch "Ở chung sống với nhau, dù là người / hay là con cút, / Trong lòng sinh tình yêu thương,". (2) 3.1 — ja410 dịch thành "Kẻ khóc tiếng là ‘Thưa ông con đã chết’", tức biến `Mataṁ marissaṁ` thành lời thoại trong truyện Somadatta; ở ja372 không có lời thoại nào như vậy, và `marissaṁ` là "đã từ tắt". Đã dịch "Mẹ chúng đã từ tắt,". (3) 3.3–3.4 — ja410 dịch `isi` thành "thấy sanh" (nghĩa là "rishi" bị đọc sai thành động từ "hiện sanh"); `isi` là danh từ "bậc hiền triết" nên đã dịch "bậc hiền triết", và `roditaṁ` ("đã khóc lóc rồi") đã được giữ lại. (4) 4.1–4.2 — ja410 đổi `Roditena` thành `Kanditena` ở câu trước và dịch `samuṭṭhahe` thành "sẽ tỉnh lại"; ở ja372 `Roditena have brahme` là "Này Brahma, khóc lóc" và `samuṭṭhahe` là "làm kẻ đã chết sống lại". (5) 5.4 — `daraṁ` là **tính từ** "kinh khủng/đáng sợ", nhưng cả ja352, ja410 và ja449 đều dịch là "kể cả kẻ khiếp sợ như tôi", tức biến nó thành danh từ chỉ người. Đã giữ "làm cháy tan tất cả, quá kinh khủng." (6) 6.2–6.3 — ja410 và ja449 dịch `Yo me sokaparetassa` thành "Kẻ đã gây nỗi buồn cho ta" (làm `Yo` thành chủ ngữ mới, đứt liên kết với "cái gai" ở 6.1) và `yamāsi hadayassitaṁ` thành "nỗi buồn đã ăn vào lòng ngươi" (mất `yamāsi` = "khi ngươi còn ở đây"). Đã dịch "ra khỏi tim tôi khi ngươi còn ở đây;" và "Chính nó, khi tôi bị nỗi buồn hành hạ,". Sự khác biệt còn lại là **ngôi kể khác nhau**, nên bản Việt phải khác: ja410/ja352/ja449 kể chuyện thứ hai (Somadatta, Sujāta, Maṭṭhakuṇḍalī) với "tôi" là người kể, còn ja372 là giọng con chim nói với `Vāsava`.
  Thuật ngữ: `Vāsava` (ja372:7.4) — có tiền lệ mạnh, 7 lần trong tầng Việt đã có, nên giữ nguyên Pāli (và khớp ja410). `brahme` (4.1) là cách gọi Brahma, dịch "Này Brahma" (tiền lệ 3 lần "Brahma" trong tầng, đều là danh xưng). `migassa` (2.2) dịch "con cút" vì đây là bài Chim Cút — xem mục trên. `socāmi`/`rodāmi` (7.3) giữ phân biệt soc = sầu, ro = khóc vì cả hai đứng song song trong Pāli. `salla` (6.1) dịch "cái gai" (tiền lệ: "gai" có 3 lần trong tầng, đều theo nghĩa gai nhọn).
  Bản nháp trải qua một vòng review đối kháng và đã bắt được bốn lỗi của chính bản nháp, kể lại vì đều là loại lỗi mà máy không báo: (1) ở 4.2 đã tự thêm chữ "không" vào "không làm kẻ đã chết sống lại" trong khi Pāli chỉ có `samuṭṭhahe` (hồi sinh), không có phủ định — đã sửa thành "làm kẻ đã chết sống lại"; (2) ở 1.2 đã dịch `anagārassa te sato` thành "người du sĩ nhớ về điều ấy", làm mất hành động của chủ thể; `te sato` là phân từ bổ nghĩa, nên sửa thành "người du sĩ suy nghĩ về điều ấy"; (3) ở 6.1–6.3 bản nháp dùng xưng "con/cha" trong khi các câu đã tái dụng (5.x, 7.x) dùng "tôi/ngươi" — đã đồng nhất lại; (4) cặp nháy kép đặt sai ở 3.4 và thiếu nháy mở ở 2.1 và 5.1.
  Dấu lược: Pāli của cả ba bài trong lát này **không có** `…pe…` lẫn `…` trần (đo: 0/99 khoá), nên quy tắc `…pe…` của BRIEF_VI3 §10.1 không phát sinh ở lát này; `_hvi` xác nhận dấu lược cân bằng trên cả ba bài.
