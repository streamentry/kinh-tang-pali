notes: |-
  Bản dịch dựng từ Pāli root (content/catalog/sutta/kn.json → .cache/upstream, 33/33 khoá), không có tầng Anh đã ghim để đối chiếu — xem blocking_errors. Cổng coverage đo được là **0/0**, tức mẫu số bằng 0: bài truyện ngắn, khoá dài nhất 27 ký tự, không khoá nào đạt ngưỡng 40 ký tự của `source/layers.yaml`.
  Câu hỏi mở: `ja372:3.1` Mataṁ marissaṁ rodanti. Cụm này và `ja372:6.1` Abbahi (xem thêm dưới) cho thấy bài kể chuyện một con mẹ chim đã chết, và bên kia là con/đàn con đang khóc. Nhưng ở 1.1 Agārā (cư sĩ) lại là người được gọi trực tiếp, còn anagārassa (du sĩ) mới là chủ thể nghĩ về. Tức hai tầng vai — người đã chết và kẻ đang buồn — đảo chiều giữa các khoá. Đã dịch theo cách đọc trực tiếp từng khoá (1.1–1.2 để người đọc tự thấy mâu thuẫn với 3.1 và 6.1), KHÔNG dàn cảnh để làm câu trôi; đây là điểm ít tin cậy nhất về mặt diễn giải, ghi lại đây để người biên tập quyết.
  Điểm ít tin cậy thứ hai, và là chỗ được coi là ít tin cậy nhất: `ja372:0.3` là tên phẩm `Aḍḍhavagga`. Người biên tập giao rằng mỗi truyện một tên riêng và 0 tiền lệ thì phải ghi rõ. Đo lại trên 449 tệp `ja` đã có bản dịch, tên phẩm này có tiền lệ: **4/4** tệp dùng "Phẩm Aḍḍha" (ja371, ja373, ja374, ja375 — đúng bốn tệp lân cận trong cùng phẩm). Vì vậy đây KHÔNG phải 0 tiền lệ, và dùng đa số đo được "Phẩm Aḍḍha". Ghi rõ con số ở đây để người điều phối gộp. (Tên `Aḍḍhavagga` không có trong tầng tên `name/sutta/ja-name_translation-en-sujato.json` đã ghim — tầng đó chỉ khớp hai tên `pancakanipata` và `chakkanipata` — nên không thể chốt bằng bảng tên của SuttaCentral cho tên phẩm này.)
  `:0.2` Pañcakanipāta: đo lại trên 449 tệp `ja`, không chỉ chuỗi Việt mà khớp trên **giá trị Pāli tuyệt đối**: `Pañcakanipāta` cho "Nhóm Năm Bài Kệ" 15, "Bộ Năm Bài Kệ" 4, "Bộ Năm Kệ" 3, "Nhóm Năm" 1, rỗng 1. Đa số đo được là "Nhóm Năm Bài Kệ" (15). Tuy nhiên bốn tệp lân cận thuộc đúng phẩm này (ja371, ja374, ja375) dùng "Bộ Năm Bài Kệ", và "Bộ … Kệ" là mẫu thống nhất của cả Jātaka cho tên bộ (đo: Bộ Một Bài Kinh 150, Bộ Hai Bài Kinh 100, Bộ Bốn Bài Kệ 50, Bộ Sáu Bài Kệ 17). Chọn "Bộ Năm Bài Kệ" để khớp lân cận và mẫu chung, ghi lại cả hai con số để người điều phối chốt. Đây là chỗ thiếu nhất quán đã có sẵn trong kho, không phải chỗ tôi tự tạo ra thêm.
  Tên truyện `:0.4` và cột bài `:8.1`: "Kinh Migapotaka". Cùng bài đó, `:0.4` giữ số thứ tự như Pāli ("2. ") — đo lại trên kho: ja376…ja397 đều giữ số ở `:0.4` ("1. Kinh Avāriya", "6. Kinh Migālopa"), nên giữ. Cột bài dùng "Kinh X, thứ N." có dấu phẩy: đo 190 tệp có dấu phẩy vs 211 không, nhưng **toàn bộ lân cận** ja368–ja394 đều có dấu phẩy, nên theo lân cận. Dấu `”ti` cuối bài: đo trên các khoá Pāli kết bằng `”ti.` trong bộ `ja` cho **222 bỏ vs 207 giữ**, đa số là bỏ, nên bỏ (làm đúng với BRIEF_VI4 mục 7 về số đo được).
  Thuật ngữ: `Vāsava` (ja372:7.4) — có tiền lệ mạnh, 7 lần trong tầng Việt đã có, nên giữ nguyên Pāli. `brahme` (ja372:4.1) là cách gọi Brahma, dịch "Này Brahma" (tiền lệ: 3 lần "Brahma" trong tầng, đều là danh xưng). `migassa` (2.2) là chim cút — dùng "con cút" vì khoá này nói về loài chim (`manussassa migassa vā`: người hoặc chim cút), còn `:0.4` là tên truyện nên để Pāli. `socāmi`/`rodāmi` giữ phân biệt soc = buồn, ro = khóc ở 7.3, vì cả hai đứng song song trong Pāli. `Anavilo` (7.2) dịch "không u ám", `apānudi` (6.4) dịch "gỡ", cả hai đều giữ đúng vế ngữ chủ thể.
  Bản nháp trải qua một vòng review đối kháng và đã bắt được ba lỗi của chính bản nháp, kể lại vì đều là loại lỗi mà máy không báo: (1) ở 4.2 đã tự thêm chữ "không" vào "không làm kẻ đã chết sống lại" trong khi Pāli chỉ có `samuṭṭhahe` (hồi sinh) với chủ thể là kẻ đã chết, không có phủ định — đã sửa thành "làm kẻ đã chết sống lại"; (2) ở 1.2 đã dịch `anagārassa te sato` thành "người du sĩ nhớ về điều ấy", làm mất hành động của chủ thể; Pāli `te sato` là phân từ bổ nghĩa (suy nghĩ về điều ấy), nên sửa thành "người du sĩ suy nghĩ về điều ấy"; (3) cặp nháy kép đặt sai ở 3.4 và thiếu nháy mở ở 2.1 và 5.1. Riêng dấu lược: Pāli của cả ba bài trong lát này **không có** `…pe…` lẫn `…` trần (đo: 0/99 khoá), nên quy tắc `…pe…` của BRIEF_VI3 §10.1 không phát sinh ở lát này; `_hvi` xác nhận dấu lược cân bằng trên cả ba bài.
