notes: |-
  **Phạm vi: đủ 311/311 khoá của bài, không khoá nào ngoài danh sách.** Thứ tự khoá trong tệp bản dịch bằng đúng thứ tự Pāli (kiểm bằng phép so danh sách, không dùng phép cân tổng). Đây là bài kệ dài nhất của Therīgāthā (Bộ Lớn, 75 bài kệ theo cách đánh số của bản Sri Lanka, 311 khoá), nên chỗ nào chưa phân xử được đều ghi ở mục bất định thay vì chốt chắc.

  **Nguồn và coverage — đo theo công thức khai ở `source/layers.yaml` (`substantivePaliMinChars: 40`, bỏ khối `:0`), tầng Anh tra qua manifest đã ghim:**
  · Số khoá Pāli có nội dung (≥ 40 ký tự) là **2**: `72.2` (40 ký tự) và `76.1` (48 ký tự); mọi khoá còn lại ngắn hơn 40 ký tự (kệ chia dòng ngắn) ⇒ **mẫu số cổng = 2/308** khoá thân bài (bỏ ba khoá tiêu đề `0.1`–`0.3`). Sujato phủ **2/2 = 100%** trên mẫu số này. ⚠ Với mẫu số nhỏ như vậy, cổng coverage **gần như không đo được gì**; con số 100% không phải bằng chứng Sujato dịch đủ cả bài.
  · Đo thô thay thế: bản Anh Sujato đã ghim **có tệp** `thig16.1_translation-en-sujato.json` (manifest liệt kê tệp này; cùng tập khoá 311 với Pāli), **302/308 khoá thân bài có chữ = 98,1%**; sáu khoá để trống là `76.2` (`Mahānipāto niṭṭhito.`), `77.0` (tiêu đề `Samattā therīgāthāyo`) và `77.1`–`77.4` (bốn dòng tóm tắt số kệ và số vị Trưởng lão nữ); `77.5` có chữ. Ba khoá `0.x` cũng có chữ. Cả hai số đều ≥ 0,80, không cần entry `reference-gaps`.
  · Tầng `english-project` **vắng** (không có tệp cho uid này, và không cần lấp vì Sujato chỉ bỏ trống phần colophon và tóm tắt). Tầng `vietnamese-current` **vắng** (tại commit đã ghim thư mục Việt hiện hành chỉ có Pháp Cú). Bản Việt nguyên bài của SuttaCentral (Bhikkhu Indacanda, Trưởng Lão Ni Kệ, Nhóm Lớn, 16.1, theo bản Buddha Jayanti) chỉ là mục *Tra cứu toàn văn* ở cuối trang, không phải tầng store, nhưng đã đọc để đối chiếu cách đọc cú pháp. ⇒ `triangulation` **8,9**: Pāli + một tầng Anh gần như đủ + một bản Việt nguyên bài đọc đối chiếu, không có tầng Việt phân đoạn và không có bản Anh độc lập thứ hai. Các chỗ Sujato và bản Việt nguyên bài khác nhau hoặc cùng khác Pāli ghim đều ghi ở mục bất định.

  **Tái dùng nguyên văn — dựng chỉ mục Pāli→Việt ở mức segment trên toàn tầng đã dịch (221.861 cặp khoá, 127.046 dạng Pāli khác nhau, gồm `thig13.1`–`thig15.1`, `thi-ap1`, `thi-ap30`, `thag`):** có **8 khoá** của bài có Pāli trùng nguyên văn (chuẩn hoá chữ hoa, dấu câu, nháy) với khoá ở bài khác, tổng **12 cặp**, và **cả 8 khoá đều dùng lại cách dịch đã có**: `42.2` (*nhiều khổ, chất độc lớn;*, theo `thig13.5:22.2`, **1/1**); `44.1` (*Dục lạc tựa như gươm giáo,*, theo `thig6.3:3.1` và `thig11.1:11.1`: trên **4** cặp, **2** cặp cùng chữ, **2** cặp khác là `sn5.1:5.1` *Các dục ví như gươm và giáo,* và `thig3.7:2.1` *Các dục ví như gươm giáo mũi nhọn,*; chọn dạng của hai bài kệ Therīgāthā gần nhất); `71.1`, `71.3`, `71.4`, `72.1`, `74.4` (theo `thi-ap1:3.1`, `3.3`, `3.4`, `4.1`, `18.4`, đều **1/1**); `77.1` (*Các bài kệ là bốn trăm,* theo `thi-ap30:66.3`; trên **2** cặp có **1** cặp khác là `dhp423:53` *bốn trăm câu kệ,*). Số cặp trùng ngoài bài mà bản Việt khác: **3** (hai ở `44.1`, một ở `77.1`), đã nêu lý do. `0.1` (*Therīgāthā 16.1*) giữ dạng Pāli có chủ đích, như mọi khoá `:0.1` khác trong tầng. Các khoá `71.2`, `72.2`–`72.4`, `73.1`–`73.4`, `74.1`–`74.3` có Pāli **gần** (không trùng nguyên văn) với `thi-ap1` (cùng bài kệ tiền thân của Sumedhā) nên cố ý đi theo cách dịch của `thi-ap1:3.2`, `4.2`–`4.4`, `5.1`–`5.4`, `18.1`–`18.3`, chỉ đổi chỗ Pāli khác.

  **Năm phép kiểm (tự viết, in số kèm mẫu số):**
  · (1) `set(khoá Việt) == set(khoá Pāli)`: **311 / 311**, thiếu **0**, thừa **0**; thứ tự khoá khớp Pāli. Phép **có đo được**.
  · (2) Nháy kép và nháy đơn **khớp Pāli từng khoá**: lệch **0** trên 311 khoá. Nháy kép `“”`: Pāli **9** khoá mở (`2.4`, `13.2`, `15.1`, `18.2`, `36.1`, `38.3`, `48.1`, `68.3`, `71.1`) và **9** khoá đóng (`12.4`, `13.4`, `17.4`, `31.4`, `37.4`, `46.4`, `66.4`, `68.4`, `75.4`, đóng ở `75.4` bằng `”ti`), Việt cùng vị trí. Nháy đơn `‘’`: Pāli **1** khoá mở (`27.3`) và **1** khoá đóng (`27.4`), Việt cùng vị trí. Lượt lời: lời Sumedhā thưa cha mẹ (`2.4`–`12.4`); lời Sumedhā tuyên bố nhịn ăn (`13.2`–`13.4`); lời cha mẹ khuyên (`15.1`–`17.4`); lời Sumedhā đáp, trong đó có lời của bậc Đạo Sư được nhắc lại (nháy đơn `27.3`–`27.4`) (`18.2`–`31.4`); lời Anīkaratta (`36.1`–`37.4`); lời Sumedhā đáp Anīkaratta (`38.3`–`46.4`); lời Sumedhā nói với cha mẹ và Anīkaratta (`48.1`–`66.4`); lời Anīkaratta xin cha nàng (`68.3`–`68.4`); lời Sumedhā kể kiếp trước (`71.1`–`75.4`). Dấu kết khoá: Pāli kết `”.` hoặc `”ti.`, Việt kết `.”`.
  · (3) Pāli trùng nguyên văn trong bài: **6 nhóm** (`10.4`≡`30.4`, `12.3`≡`16.3`, `13.1`≡`67.1`, `17.3`≡`36.3`, `56.1`≡`57.1`, `56.3`≡`57.3`), bản Việt khác về nội dung **0 nhóm** (chỉ khác chữ hoa đầu câu). Phép **có đo được**. Hai cặp Pāli gần trùng nhưng không nguyên văn: `10.3` (*ghaṭissaṁ*) và `30.3` (*ghaṭenti*) khác ngôi và thì ⇒ Việt khác (*con sẽ nỗ lực* / *họ nỗ lực*); `17.1`–`17.2` và `36.1`–`36.2` là cùng một câu nhưng `36.1`–`36.2` bị cắt giữa chữ *issariya* ở ranh giới khoá ⇒ Việt cùng nghĩa, chữ *quyền thế* đặt trọn ở `36.2`.
  · (4) Dấu lược: Pāli có `…` ở **0** khoá; Việt cũng **0**, lệch **0**. Mở rộng lược (Pāli không có `…` mà Việt có): **0**. `…pe…`: Pāli **0** khoá. `… cho đến …`: **0**. `(…)` trần: Pāli **0** khoá, Việt **0**. Phép này **chạy trên 311 khoá nhưng không có khoá nào mang dấu lược**, nên điều khoản giữ nguyên `(…)` và dấu ` ….` không áp dụng.
  · (5) Số Pāli, thêm NFC, khoá rỗng, khoảng trắng: chưa NFC **0**; khoá rỗng **0**; khoảng trắng thừa hoặc hai dấu cách **0**; chữ số Ả Rập trong thân bài **0** (chỉ `0.1` có *16.1* giống Pāli, có chủ đích); Pāli lọt sang Việt chỉ là tên riêng và tên loài (`Therīgāthā`, `Therīgāthāpāḷi`, `Sumedhā`, `Mantāvatī`, `Koñca`, `Vāraṇavatī`, `Anīkaratta`, `Mandhātā`, `Jambudīpa`, `Koṇāgamana`, `caṇḍāla`, `puthuloma`, `Vipula`), giữ nguyên có chủ đích.
  · Đọc cặp Pāli↔Việt từng khoá (311/311 in ra đọc đối kháng, kèm bản Anh Sujato ở những khoá khó): không có khối nào mang nội dung của khối bên cạnh. Khối lặp cấu trúc (`56`–`59` mở bằng *Khi … đang có đó, ngài cần gì …?*; `41`–`44` các ví dụ về dục lạc) được giữ nguyên lặp có chủ đích, như Pāli.

  **Số Pāli — tự tính, không dùng công cụ đo số chuẩn của kho vì không có cụm nào thuộc bộ cụm đã xác lập (`navuti`, `tālīsa`, `sattati`, `Tiṁsakappasahassa`):** `cattāro vinipātā` (`9.1`) = 4 ⇒ *bốn đọa xứ*; `duve gatiyo` (`9.2`) = 2 ⇒ *hai nẻo đi*; `dasabala` (`10.2`, `30.2`) = 10 ⇒ *bậc Mười Lực*; `tisatti satāni` (`26.1`–`26.2`) = *ti* 3 + *satti* (giáo) + *sata* 100 ⇒ *ba trăm mũi giáo*, theo `mn129:8.11`–`8.12` (*sattisatena* ⇒ *một trăm mũi giáo*); `vassasata` (`26.3`) = 100 năm ⇒ *cả trăm năm*; `cātuddīpo` (`39.1`) = 4 châu ⇒ *bốn châu*; `satta ratanāni` (`40.1`) = 7 ⇒ *bảy báu*; `catu-` (`50.1` `caturodadhī`) = 4 ⇒ *bốn đại dương*; `ekakappa` (`50.3`) = 1 kiếp ⇒ *một kiếp*; `caturaṅgulikā` (`52.3`) = *catu* 4 + *aṅgula* ngón ⇒ *bốn ngón tay*, theo `sn15.1:1.9`; `cattāri saccāni` (`55.4`) = 4 ⇒ *bốn sự thật*; `pañcakaṭuka` (`56.2`, `56.4`) = 5 ⇒ *năm thứ cay đắng*; `dasadisā` (`40.2`) = 10 ⇒ *mười phương*; `tisso janiyo` (`71.3`) = 3 ⇒ *ba người*; `dasakkhattuṁ` (`72.1`) = 10 lần, `satakkhattuṁ` = 100 lần, `dasasatakkhattuṁ` (`72.2`) = 10 × 100 = **1.000 lần**, `satāni ca satakkhattuṁ` = *trăm trăm lần* = 100 × 100 = **10.000 lần** ⇒ *mười lần, một trăm lần, một ngàn lần, rồi mười ngàn lần*, đúng như `thi-ap1:4.1`–`4.2` đã dịch và đúng cách Sujato đọc (10, 100, 1.000, 10.000); `sattaratana` (`73.3`) = 7 ⇒ *bảy báu*; `cha abhiññā` (`69.3`) = 6 ⇒ *sáu thắng trí*; `paṭhamajjhāna` (`33.4`) ⇒ *sơ thiền*; `ekuttarasatā` (`77.3`) = *eka* 1 + *uttara* hơn + *sata* 100 = **101** ⇒ *một trăm lẻ một*; `gāthāsatāni cattāri` (`77.1`) = 4 × 100 = 400, `asīti` (`77.2`) = 80, `cuddasa` (`77.2`) = *catu* 4 + *dasa* 10 = 14 ⇒ tổng Pāli tự khai **400 + 80 + 14 = 494** bài kệ cho cả Therīgāthā, 101 vị Trưởng lão nữ. Phép cộng này **chỉ là điều Pāli tự nói**; tôi không đối chiếu với số kệ thực của cả tập (bản Việt nguyên bài của Indacanda, theo bản Sri Lanka, ghi *năm trăm hai mươi mốt* cho cùng chỗ, tức bản Pāli này và bản đó khác nhau ở số tổng, còn số 101 thì giống nhau). Không có `sahassa`, `navuti`, `tālīsa`, `sattati`. Các `eka-` khác không phải số đếm.

  **Thuật ngữ — đo trên tầng đã dịch, kèm số đếm:**
  · `dasabala` ⇒ *bậc Mười Lực*: trên **33** khoá chứa `dasabal-`, *Mười Lực* **18**, *mười sức mạnh* **8**, *Thập Lực* **4**; chọn *Mười Lực*. `pāvacana` ⇒ *lời dạy*: **27** khoá, chọn theo `bv14:34.3`, `bv8:25.3`, `dn16:6.1.3`. `sāsana` ⇒ *giáo pháp* khi đứng một mình ở `74.2`, theo `thi-ap1:18.2` (trên **1.589** khoá chứa `sāsan-`, *lời dạy* **1.071**, *giáo pháp* **290**).
  · `vinipāta` ⇒ *đọa xứ*: **336**/**504** khoá. `niraya` ⇒ *địa ngục*: **622**/**627**. `petā` ⇒ *ngạ quỷ*: **13**/**141** khoá chứa `petā` (phần lớn `petā` ở nghĩa *người đã khuất*). `tiracchānayoni` ⇒ *súc sinh*: **68**, *súc sanh* **26**, *bàng sinh* **12** trên **158** khoá; chọn *súc sinh*. `asurakāya` ⇒ *loài A-tu-la*: tầng dùng *chúng A-tu-la* (`dn18:12.11`, `dn19:3.22`); tôi chọn *loài A-tu-la* vì Pāli đặt `asurakāye` cạnh `tiracchānayoniyā`.
  · `saṁsāra` ⇒ *luân hồi*: **193**/**209**. `anamatagga` ⇒ *không có khởi đầu được biết đến*: **22**/**35** khoá, theo `sn15.1:1.7`. `ariyasacca` ⇒ *Thánh đế*: **229**/**288**; `cattāri saccāni` không có `ariya` ⇒ *bốn sự thật*, theo `thag19.1:8.2` (*sự thật* **12** khoá). `yoniso` ⇒ *như lý*: **255**/**434**, theo `iti16:2.2`.
  · `bahussuta` ⇒ *đa văn*: **169**/**295** (*nghe nhiều* **61**, *học rộng* **25**), theo `thig13.2:9.1`. `sikkhamānā` ⇒ *tập sự ni*: **3** khoá `thig13.4:19.1`, `thig5.7:3.1`, `thig5.8:3.1`. `therī` ⇒ *Trưởng lão nữ*, theo `thig14.1:35.1`, `thig15.1:49.1`. `paṭhamajjhānaṁ samāpajji` ⇒ *nhập sơ thiền*: *sơ thiền* **9**/**9**.
  · `kāmaratiyo` ⇒ *khoái lạc dục tình*: **2**/**3** khoá (`thig3.7:1.3`, `thig7.3:2.3`; `sn5.1:2.3` viết *lạc thú của dục*). `kāmā` ⇒ *dục lạc* xuyên suốt bài (theo `mn22:3.9`–`3.18`, `mn54:17.6`, `thig6.3:3.1`); các ví dụ `asisūnā`, `sappasira`, `tiṇukkā`/`ukka`, `aṭṭhikaṅkala`, `rukkhaphala`, `maṁsapesī`, `supina`, `yācitaka`, `sattisūla`, `aṅgārakāsu` dịch đúng như `mn22:3.9`–`3.18` và `mn54` (*dao và thớt của người đồ tể*, *đầu rắn*, *bó đuốc cỏ*, *bộ xương*, *trái cây trên cây*, *miếng thịt*, *giấc mộng*, *đồ vật đi mượn*, *gươm giáo*, *hố than hồng*).
  · `vighāta` ⇒ *não hại*: theo `iti28:2.1`, `iti29:2.1` (`savighātaṁ` ⇒ *với não hại*). `pariḷāha` ⇒ *nhiệt não*: **287** khoá, theo `iti28`, `dhp90:4`. `domanassa` ⇒ *ưu*: **919** khoá; ở `63.2` `cittadomanassāni` ⇒ *ưu phiền trong tâm*. `appossukka` ⇒ *không vướng bận*: **61** khoá, theo `dhp330:4`, `snp1.3:9.3`.
  · `susāna` ⇒ *nghĩa địa*: **39**, *bãi tha ma* **16** trên **62** khoá; chọn *nghĩa địa*; `kaṭasi` ⇒ *nghĩa địa* (`55.1`) vì `sn15.2:1.9` dịch *nghĩa địa đã đầy thêm* (`kaṭasi`: **4** khoá, *bãi tha ma* **3**, *nghĩa địa* **1**; chọn theo `sn15.2:1.9` là chỗ cùng hình ảnh).
  · `kolaṭṭhimattaguḷikā` ⇒ *những viên bằng hạt táo*: **21** khoá chứa `kolaṭṭhi`, *hạt táo* theo `sn13.5:1.2`, `sn15.2:1.4`; `caturaṅgulikā ghaṭikā` ⇒ *từng viên bốn ngón tay*, theo `sn15.1:1.9`. `pheṇapiṇḍopama` ⇒ *ví như quả bọt*: **3** khoá, theo `sn22.95:2.1`. `kumbhīlabhaya` ⇒ *nỗi sợ cá sấu*: **12** khoá, theo `an4.122:1.3`. `puthuloma` ⇒ *cá puthuloma*: **3** khoá (`ja506:32.1`, `vv81:5.2`); giữ tên Pāli. `caṇḍāla` ⇒ giữ nguyên *caṇḍāla*: **68** khoá, tầng dùng nhiều cách (*người xứ thấp tiện*, *người dọn xác chết*, *hạng hèn hạ*) ⇒ không có cách dịch chuẩn.
  · `tālāvatthukata` ⇒ *làm như gốc chà là*: trên **140** khoá chứa `tālāvatthu-`, *gốc chà là* **56**, *thốt nốt* **41**, *cọ* **10**; chọn *gốc chà là*, đa số.
  · `kāṇakacchapa` ⇒ *con rùa mù một mắt* theo `mn129:24.3`; `yugachidda` ⇒ *lỗ của ách* theo `mn129:24.5`. `Mandhātā` ⇒ giữ tên; *vua Mandhātā* theo `an4.15:1.6`; `kāmabhogī` ⇒ *người hưởng dục* theo `an4.15:2.2`, `an10.91`. `aggamahesī` ⇒ *hoàng hậu chánh cung*, theo `sn19.15:1.3`. `rājakaññā` ⇒ *công chúa*, theo `ja514:35.5`, `ja514:38.3` (`thi-ap1:11.2` dùng *vương nữ*; chọn *công chúa* vì dễ hiểu hơn và không đổi nghĩa).
  · `akkhaṇa`/`khaṇa` ⇒ *thời bất thuận*/*thời thuận*, theo `an8.29:10.1` (*lúc thuận, thời thuận*): **0** tiền lệ trực tiếp cho `akkhaṇa` đứng riêng; `vivajjito` ⇒ *đã được tránh*.
  · `itthaṁ sudaṁ … therī gāthāyo abhāsitthāti` (`76.1`) ⇒ *Tôi nghe như vầy: Trưởng lão nữ … đã nói những bài kệ này.*: trên **595** khoá cùng công thức ở `thig`, `thag`, `thi-ap`, `tha-ap`, **592** khoá mở bằng *Tôi nghe như vầy*; theo đa số, dù Pāli ở đây không có `evaṁ me sutaṁ`.
  · `Mahānipāta` (`0.2`, `76.2`) ⇒ *Bộ Lớn*, theo cách đặt tên các bộ trong tầng (`iti100:0.2` *Bộ Bốn Bài Kinh*, `thig15.1:0.2` *Bộ Bốn Mươi Bài Kinh*); **0** tiền lệ cho `Mahānipāta`; chọn *Bộ Lớn* theo Sujato (*The Great Book*) và bản Việt nguyên bài (*Nhóm Lớn*). `Therīgāthāpāḷi` (`77.5`) giữ nguyên tên Pāli.
  · Xưng hô: Sumedhā xưng *con* và gọi cha mẹ *cha mẹ*, *thưa mẹ*, *thưa cha* (`7.1`, `31.1`) khi nói với cha mẹ; xưng *tôi* khi nói với Anīkaratta (`45.3`, `46.1`) và gọi ông là *ngài* (`56.2`–`62.4`); cha mẹ gọi nàng *con yêu* (`15.1`, `16.4`) và *con* (`17.4`); Anīkaratta gọi nàng *nàng* (`36.2`). Trong phần kể kiếp trước (`71`–`75`) nàng xưng *chúng tôi* / *tôi*. Không đổi vai ở giữa bài.
  · Tên: `Anīkaratta` viết **nhất quán một dạng**, dù Pāli ghim có hai chính tả (`Anīkaratta` ở `15.3`, `32.2`, `34.2`, `35.2`, `47.2`, `anikaratta` ở `16.2`, `67.3`, `68.1`, `Anikarattassa` ở `16.2`); bản Việt nguyên bài ghi `Aṇīkadatta` theo bản Sri Lanka; không thêm tiểu sử vào thân kinh.

  **BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh:**
  · **Ngôi kể (`1.3`, `47.1`–`47.4`)**: Pāli ghim có `āsiṁ` (ngôi thứ nhất, `1.3`) và `avocaṁ` (ngôi thứ nhất, `47.4`), nhưng `bhaṇati` (ngôi thứ ba, `2.4`, `13.1`, `18.1`, `38.1`, `67.1`) ở đoạn kể. Sujato dịch cả đoạn đầu ở ngôi ba (*In Mantāvatī city, Sumedhā … was converted*), bản Việt nguyên bài cũng ngôi ba cho `1`–`2`. Việt theo đúng Pāli ghim: ngôi một ở `1.3` và `47`, ngôi ba ở `2.3`–`2.4` (*nàng thưa*), `13`, `18.1`, `38.1`. `2.1`–`2.2` là bốn tính từ giống cái không có động từ ⇒ dịch không có đại từ.
  · `1.4` `pasāditā sāsanakarehi`: dịch *được những người làm theo lời dạy khiến cho tịnh tín*; Sujato *was converted by those who practice the Buddha's teaching*. `sāsanakara` ⇒ *người làm theo lời dạy*, theo `mn35:24.5`, `mn21:20.1`.
  · `2.1` `cittakathā`: dịch *ăn nói tài tình*; `citta` ở đây là *đa dạng, kỳ diệu*; Sujato *a brilliant speaker*, bản Việt nguyên bài *nói năng khôn khéo*. **0** tiền lệ.
  · `4.1`–`4.2` `āsī, visūpamā`: đọc là hợp từ bị cắt `āsīvisūpamā` (*như nọc rắn độc*), theo Sujato (*bitter as the venom of a snake*) và bản Việt nguyên bài (*ví như nọc độc của rắn*); dịch *như nọc rắn* / *ví như thuốc độc* (hai nửa của hợp từ). Cách đọc khác: `āsī` là động từ *đã là* ⇒ *các dục đã cay đắng*; không chọn vì `āsī` không cần ở đây.
  · `4.4` `samappitā`: dịch *bị đưa vào đó*; gốc `samappeti` là *giao cho, trao cho*; Sujato *sent to hell*. **0** tiền lệ.
  · `6.2` `dukkhasamudayoruddhā`: dịch *bị nguồn gốc của khổ giam hãm*; `oruddha` là *bị giam, bị chặn*; Sujato *trapped by the origin of suffering*, bản Việt nguyên bài *bị giam hãm bởi tham ái, nguyên nhân của khổ* (phần trong ngoặc là chú, không đưa vào thân kinh).
  · `7.1`–`7.2` `te bahutarā ajānantā ye`: cấu trúc *te … ye* (*những người không biết … ấy là đa số*); Việt đảo thứ tự thành *những ai không biết chúng, họ chiếm đa số* để rõ cú pháp, không đổi nghĩa.
  · `9.1`–`9.2` `cattāro vinipātā, duve ca gatiyo kathañci labbhanti`: dịch *có bốn đọa xứ và hai nẻo đi, bằng cách nào đó cũng có thể có được*; không nêu `duve gatiyo` là gì (Sujato *two other realms*; bản Việt nguyên bài chú *người và Trời*; chú thích này không đưa vào thân kinh). `labbhanti` đọc là *có thể có được/gặp được*.
  · `11.2`, `54.2` `kāyakalinā`/`kāyakalino`: dịch *thân tồi tệ, không cốt lõi*; `kalī` là *điều xui rủi, lỗi lầm*; Sujato *useless … body* (`11.2`), *unlucky body* (`54.2`); bản Việt nguyên bài *tội lỗi của thân xác* (`11.2`), *xác thân tồi tệ* (`54.2`). **0** tiền lệ; không phân xử được hoàn toàn giữa *xui rủi* và *tội lỗi*.
  · `12.1`–`12.2` `buddhānaṁ uppādo vivajjito, akkhaṇo khaṇo laddho`: dịch *chư Phật đã xuất hiện, đã tránh được* (`12.1`) / *thời bất thuận, đã gặp được thời thuận* (`12.2`); `vivajjito` đọc là bổ nghĩa `akkhaṇo` (*thời bất thuận đã được tránh*), vì đọc với `uppādo` (*sự xuất hiện của chư Phật bị tránh*) vô nghĩa trong văn cảnh; trước lượt cải thiện, `akkhaṇo` bị chuyển sang `12.1` khác với ranh giới khoá Pāli. Sujato *A Buddha has arisen, the time has come, the unlucky moment has passed*.
  · `13.4` `maraṇavasaṁ gatāva hessāmi`: dịch *con sẽ thành người đã rơi vào quyền lực của cái chết* (`gatā eva` ⇒ *chính là người đã đi vào*).
  · `14.1`–`14.2` `pitā ca assā … samabhihato`: `assā` đọc là *của nàng* (sở hữu cách giống cái), cha *hoàn toàn bị đánh quỵ*; Sujato *her father, though grieved*. `14.3` `ghaṭenti saññāpetuṁ`: *họ cố khuyên giải* (`saññāpeti` là *làm cho hiểu, thuyết phục*; cũng có thể là *làm cho tỉnh lại*).
  · `15.2` `tena dinnāsi vāraṇavatimhi`: `tena` không dịch riêng (có thể là *vì vậy* hoặc *bởi ngài*); Việt chỉ nêu *con đã được gả ở Vāraṇavatī*. Sujato *You're already betrothed*; bản Việt nguyên bài *Con đã được gả về thành phố Vāraṇavatī*.
  · `18.2` `mā edisikāni bhavagatamasāraṁ`: tỉnh lược, không có động từ; dịch *Đừng những điều như thế! Cõi hữu không có cốt lõi.*; Sujato *Let this not come to pass! Existence is hollow!*, bản Việt nguyên bài *Đừng có những việc như thế*.
  · `19.1`–`19.4`, `20.1` `kimiva`: hai cách đọc: `kiṁ iva` (*vì sao, để làm gì*, Sujato) hoặc `kimi iva` (*như con giòi*, bản Việt nguyên bài đọc như vậy ở `19`, còn ở `20` đọc *nó tựa như cái gì?*). Việt theo `kiṁ iva` ở cả hai chỗ vì nhất quán và vì `kimikulālayaṁ` (*tổ của bầy giòi bọ*) đã ở `20.3`. `abhisaṁviseyyaṁ` dịch *chui vào*; Sujato *cling*. `bhasta` ⇒ *túi da* theo `thag19.1:44.3`.
  · `20.4` `kaḷevaraṁ kissa diyyati`: không nêu ai trao cho ai; `kissa` đọc là *để làm gì* (Sujato *why have we been given it?*, bản Việt nguyên bài *tại sao thân xác lại được đem cho?*). Cách đọc `kissa` = *cho ai* cũng khả dĩ.
  · `22.2` `parabhattaṁ`: dịch *làm thức ăn cho kẻ khác* (cho loài khác ăn); Sujato *to be eaten by others*.
  · `23.3` `kheḷassuccārassava`: tách thành *kheḷa* (nước dãi), *assu* (nước mắt), *uccāra* (phân), *ssava*. Dịch `ssava` là *nước tiểu*, đọc như dạng rút của `passāva` đứng cặp với `uccāra` (đọc theo bản Việt nguyên bài); Sujato dịch *pus* (mủ, theo nghĩa *chất rỉ chảy*). **0** tiền lệ trong tầng; không phân xử được hoàn toàn giữa *nước tiểu* và *dịch rỉ chảy*.
  · `25.2` `saṅkhataṁ`: dịch *pháp hữu vi* (Sujato *conditioned*, bản Việt nguyên bài *pháp tạo tác*).
  · `26.1`–`26.2` `tisatti satāni navanavā`: đọc `tisatti` là `ti-satti` (3 mũi giáo) kèm `satāni` ⇒ **300**; `navanavā` ⇒ *mới rồi lại mới*; Sujato *three hundred sharp swords*, bản Việt nguyên bài *ba trăm cây giáo mới tinh*. `satti` ⇒ *giáo* theo `mn129:8.11`.
  · `27.1`–`27.2` `ajjhupagacche … yo viññāyevaṁ`: dịch *có thể chấp nhận sự sát hại, người nào đã hiểu lời của bậc Đạo Sư như vậy*; `ajjhupagacche` ở dạng khả năng.
  · `31.4` `vantasamā tālavatthukatā`: dịch *chúng như vật đã nôn ra, bị làm như gốc chà là*; `tālavatthukata` là cụm công thức *bị đoạn tận như gốc cây bị chặt*.
  · `33.2` `khaggena`: dịch *gươm*; Sujato *knife*, bản Việt nguyên bài *con dao*. `khagga` thường là *gươm*; không phân xử được là dao hay gươm trong văn cảnh này.
  · `36.1`–`36.2`: xem phép (3); đoạn *issariya* bị cắt giữa chữ.
  · `38.1` `taṁ taṁ bhaṇati`: đọc `taṁ` thứ nhất là *ông ấy* (đối cách), thứ hai là *điều ấy*; dịch *nói với ông ấy như vậy*; Sujato *spoke right back*.
  · `39.1`–`39.2` `cātuddīpo rājā, mandhātā āsi kāmabhoginamaggo`: *vua cai quản bốn châu, Mandhātā từng là bậc đứng đầu trong những người hưởng dục lạc*; `aggo` ⇒ *bậc đứng đầu*, theo `an4.15:2.1`–`2.2`.
  · `40.2` `vuṭṭhimā`: dịch *từ bầu trời đang mưa*; Sujato *from the sky*, bản Việt nguyên bài *Thần mưa*. Không phân xử được hoàn toàn nghĩa của `vuṭṭhimā` (*có mưa* / *chủ của mưa*); Việt không nêu thần.
  · `44.4` `aghamūlaṁ bhayaṁ vadho`: dịch *gốc của tai ương, sợ hãi, sát hại*; cũng có thể đọc `aghamūlaṁ` là một từ riêng và `bhayaṁ`, `vadho` là hai danh từ ngang hàng (*gốc của tai ương; sợ hãi; sát hại*). Sujato và bản Việt nguyên bài đọc như bản dịch này.
  · `45.3`–`45.4` `gacchatha na me bhavagate, vissāso atthi attano`: dịch *xin hãy đi đi; tôi không có lòng tin vào cõi hữu của chính mình*; `attano` có thể là *của chính mình* hoặc *đối với bản thân*. Sujato *I have no trust in any state of life*.
  · `48.2`–`48.3` `punappunañca rodataṁ; anamatagge`: `rodataṁ` là sở hữu cách số nhiều (*của những người khóc*), `anamatagge` là vị trí cách không nêu danh từ (ngầm là `saṁsāre`); Việt giữ *trong cái không có khởi đầu được biết đến* mà không thêm *luân hồi*; Sujato thêm *at that with no known beginning*.
  · `50.4` `vipulena`: dịch *núi Vipula*; Pāli ghim chỉ có `vipulena`, không nêu *núi*; thêm *núi* theo `sn15.10:2.2`, `sn15.10:5.2` (cùng hình ảnh, ghi *núi Vepulla*). Sujato *Mount Vepulla*, bản Việt nguyên bài *núi Vipula*.
  · `51.1`–`51.4`, `52.1`–`52.4` `upanītaṁ`, `mātā mātusveva nappahonti`, `pitupitusveva`: dịch *đem … ra*, *đem so với*; `mātā mātusveva` ⇒ *các bà mẹ của mẹ*, theo `sn15.1:1.10`; `pitupitusveva` ⇒ *các ông cha của cha*, theo `sn15.2:1.5`. Ở `52.2` chữ *so với* là cách đọc `upanīta` (*được đem ra làm ví dụ*). Chữ *đủ* (`nappahonti` ⇒ *không đủ*) đọc theo Sujato (*they'd still be fewer*).
  · `53.2` `pubbasamudde aparato ca yugachiddaṁ`: Việt giữ *ở biển phía đông, và cái lỗ của ách từ phía tây*; Sujato đọc *the yoke … blown in the ocean from east to west*; bản Việt nguyên bài *ở biển đông sang phía tây*. Không phân xử được hoàn toàn `aparato` bổ nghĩa cho gì.
  · `56.2`, `56.4` `pañcakaṭuka`: dịch *năm thứ cay đắng* (sau lượt cải thiện 2026-10-11; trước đó là *thứ năm vị cay đắng*, dễ bị đọc như số thứ tự *thứ năm*); Sujato *five bitter poisons*, bản Việt nguyên bài *năm vật cay đắng*. **0** tiền lệ; không phân xử được `pañcakaṭuka` là thuốc, độc dược hay gia vị.
  · `58.3`–`58.4` `rājaggicoraudakappiyehi`: đọc `appiyehi` là *những người thừa kế không ưa*, theo danh sách năm kẻ thù của của cải ở `an5.227:1.3`, `an7.7:2.10`, `an8.54:3.4`; Pāli chỉ có `appiyehi` (*những kẻ không ưa*), chữ *thừa kế* lấy từ các danh sách ấy. Sujato *unloved heirs*.
  · `60.2` `gaṇhantaṁ dahanti neva muñcantaṁ`: dịch *thiêu người cầm giữ, chứ không thiêu người buông*; Sujato đọc *burns one who grasps it without letting go*, bản Việt nguyên bài *đốt nóng những người đang nắm lấy và không bao giờ chịu buông ra*. Cả hai cách đọc cùng dẫn tới `60.4`.
  · `62.1`–`62.4` `kāmaṁ kāmesu damassu, tāva sunakhova saṅkhalābaddho; kāhinti khu taṁ kāmā, chātā sunakhaṁva caṇḍālā`: `kāmaṁ` đọc là *cứ việc*; `damassu` là mệnh lệnh của `dameti` (*điều phục*); `tāva` dịch *trước mắt*; `kāhinti` (`karissanti`) dịch *sẽ đối xử với* (trước lượt cải thiện là *sẽ xử*, dễ đọc như *xét xử*), không nêu *ăn thịt*; Sujato *will surely devour*, bản Việt nguyên bài *sẽ đối xử với ngươi*. Cả đoạn có thể đọc châm biếm (*cứ việc điều phục mình giữa các dục*). `caṇḍāla` giữ nguyên.
  · `65.4` `akhalitaṁ`, `nirupatāpaṁ`: dịch *không vấp ngã*, *không bức bách*; Sujato *faultless … without tribulations*, bản Việt nguyên bài *không lầm lỗi … khỏi bị nóng nảy*. **0** tiền lệ cho cả hai từ.
  · `66.3`–`66.4` `yo yoniso payuñjati; na ca sakkā aghaṭamānena`: *với người nào dốc sức một cách như lý … không thể đạt được nếu không nỗ lực*.
  · `67.2` `saṅkhāragate`: dịch *nơi các hành*; Sujato *conditioned things*.
  · `68.4` `vimokkhasaccadassā`: dịch *người thấy được sự thật về giải thoát*; Sujato *She will see the truth of liberation*, bản Việt nguyên bài *nàng sẽ có sự nhìn thấy Giải Thoát và Chân Lý*.
  · `69.4` `sikkhamānāya`: dịch *khi nàng còn là tập sự ni*, theo `thig13.4:19.1`, `thig5.8:3.1`.
  · `70.3` `pubbenivāsacaritaṁ`: dịch *những việc nàng đã làm trong các đời trước*; Sujato *her several past lives*. `70.4` `pacchime kāle` ⇒ *vào lúc cuối cùng*, theo `dn16:5.4.6`; Sujato *on her deathbed*.
  · `74.2` `sāva sāsane khantī`: *chính là sự kham nhẫn trong giáo pháp*, theo `thi-ap1:18.2`; Sujato *the acceptance of the dispensation*, bản Việt nguyên bài *sự chăm chỉ ấy trong Giáo Pháp*.
  · `75.1`–`75.2` `evaṁ karonti ye saddahanti vacanaṁ anomapaññassa`: dịch *họ làm như vậy, những ai tin lời của bậc có trí tuệ vô song*, đọc `ye saddahanti …` là mệnh đề quan hệ của `evaṁ karonti` (không phải hai động từ song song như bản trước dịch *làm như vậy, và tin*); Sujato *So say those who have faith in the words*. `anomapañña` ⇒ *trí tuệ vô song*, theo `snp2.12:2.1`.
  · `13.2`–`13.4` `na tāva āhāraṁ āharissaṁ gahaṭṭhā … maraṇavasaṁ gatāva hessāmi`: `gatāva` có thể là `gatā eva` (*chính là người đã đi vào*) hoặc `gatā iva` (*như người đã đi vào*); `tāva` ở `13.2` có thể đọc là *chừng nào* (cho đến khi, như Sujato *until*) hoặc chỉ nhấn *trước hết*. Việt giữ cách đọc bám sát chữ (không thêm *cho đến khi*); chưa phân xử được.
  · `17.1`–`17.2`, `36.1`–`36.2` `bhogā sukhā`: `bhogā` ở chỗ khác trong bài dịch *của cải* (`31.2`, `37.2`) và `dhana` (`17.1`) cũng *của cải*; ở đây Việt dùng *các sự hưởng dụng* để tránh trùng, còn `sukhā` đọc là danh từ ngang hàng (*an lạc*), không phải tính từ của `bhogā` (*thụ hưởng an lạc*, cách đọc Sujato *the happiness of possessions*); không có tiền lệ trực tiếp.
  · `40.2` `vuṭṭhimā`: chỉ xuất hiện **1** lần trong toàn Pāli root (đã quét **284.708** khoá); không thể phân xử bằng tiền lệ. Việt *từ bầu trời đang mưa* theo Sujato (*from the sky*); cách đọc khác `vuṭṭhimā` = *chủ của mưa/đám mây mưa* (bản Việt nguyên bài *Thần mưa*).
  · `56.2`, `56.4` `pañcakaṭuka`: chỉ **2** khoá trong toàn Pāli root (đã quét 284.708 khoá), cả hai đều ở bài này; là hợp từ `pañca` + `kaṭuka`, không có tiền lệ để biết là một hỗn hợp thuốc cụ thể hay chỉ *năm thứ cay đắng* nói chung; Việt giữ dạng trung tính *năm thứ cay đắng*.
  · `74.3`–`74.4` `taṁ paṭhamasamodhānaṁ, taṁ dhammaratāya nibbānaṁ`: không có động từ, `taṁ` thứ hai có thể là chủ ngữ (*đó là Niết-bàn đối với người ưa Pháp*, như Việt hiện tại) hoặc *điều ấy dẫn đến Niết-bàn cho người ưa Pháp* (như Sujato *culminated in extinguishment*); Việt giữ dạng tỉnh lược không thêm *dẫn đến*.
  · `76.1` `itthaṁ sudaṁ`: xem mục thuật ngữ (công thức đa số). `77.2`–`77.4`: số kệ (494) và số vị (101) là điều Pāli này tự khai; không đối chiếu với số thật.
  · Tầng lấp English cho bài này **không cần** (Sujato chỉ bỏ trống phần colophon); do đó không có lớp tự đánh bài của mình ở phía English.

  **Lượt cải thiện 2026-10-11:** đọc đối kháng lại 311 cặp Pāli↔Việt (kèm bản Anh Sujato); sửa **12** khoá (`12.1`, `12.2`, `17.2`, `17.4`, `36.2`, `43.3`, `56.2`, `56.4`, `62.3`, `62.4`, `64.4`, `75.1`), giữ nguyên tập khoá và thứ tự. Phân loại:
