  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda, đồng thời đọc lại bản Anh Sujato đã ghim (bài này có bản Anh) và Pāli, từng khoá trong 311 khoá. 7 khoá bất đồng nghĩa → sửa 0, giữ 6, bất định 1. Giữ: `1.3` và `47.1`–`47.4` (ngôi thứ nhất theo `āsiṁ`, `avocaṁ`, `ahaṁ`; bản Anh và bản nguyên bài đổi sang ngôi ba ở `1.3`; đã nêu ở bất định ngôi kể), `19.1` `kimiva … abhisaṁviseyyaṁ` (*cớ sao … con lại chui vào*; bản nguyên bài đọc `kimi-va` là *giống như loài dòi*), `59.3` `asakāmā` (*dù không muốn*; bản nguyên bài hiểu là dục không tốt đẹp), `73.3` `sattaratanassa mahesī` (*hoàng hậu của vị vua đầy đủ bảy báu*; bản nguyên bài tách *bảy báu* khỏi vua), `77.2` (tổng số kệ 494 theo `gāthāsatāni cattāri, asīti puna cuddasa` của Pāli ghim; bản nguyên bài ghi 521 theo dị bản). Bất định: `40.1`–`40.2` `vuṭṭhimā` — *từ bầu trời đang mưa* (bản Anh *from the sky*) so với *thần mưa* của bản nguyên bài; không phân xử được, không đổi nghĩa câu. Ba bản đồng thuận ở các điểm chính: `3.4` ít vị ngọt nhiều não hại, `9.1`–`9.2` bốn đọa xứ và hai nẻo, `12.1`–`12.2` thời bất thuận đã qua, `26.1` ba trăm mũi giáo, `51.3`–`51.4` hạt táo và các bà mẹ của mẹ, `72.x` mười, một trăm, một ngàn, mười ngàn lần, `77.3` một trăm lẻ một vị. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá.
