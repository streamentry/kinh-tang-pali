notes: |-
  Đợt 19, làn 85. Dịch từ Pāli root commit đã ghim, đủ 120/120 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ năm của Buddhavaṃsa, về Đức Phật Revata: giáo pháp và ba lần chứng ngộ, ba kỳ hội chúng, tiền thân Atideva quy y và dâng áo choàng rồi được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng và hào quang, tuổi thọ, nhập Niết-bàn và xá lợi. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.** `0.1` dùng lại nguyên văn các phẩm anh em (18/18 tiền lệ). `0.2` “7. Dòng Kế Thừa Của Đức Phật Revata”: cùng khuôn `bv19:0.2`, `bv20:0.2`; số “7.” là số ghi trong tiêu đề Pāli, còn thứ tự phẩm là thứ năm (xem `30.1`). `30.1` “thứ năm”: `pañcamo` = 5.

  **Số Pāli, đã tự tính.** `tīṇi`/`tayo` 3 (3.1 ba lần chứng ngộ: lần thứ nhất ở 3.4, lần thứ hai ở 4.4, lần thứ ba là 5.3–5.4 nhưng Pāli không gọi là `tatiya`, nên Việt không thêm chữ “thứ ba” vào đó; 6.1 ba kỳ hội chúng khớp ba khoá `7.4`, `9.4` cùng `7.2` “lần đầu”; 17.6 ba lâu đài khớp ba tên ở 17.3–17.4). `koṭisahassa` (4.3) 1 × 1.000 = **một ngàn koṭi**; `koṭisahassā arahanto` (9.3) cùng cách đọc, **một ngàn koṭi** vị A-la-hán. `koṭisata` (5.3) **một trăm koṭi**. `koṭisatasahassa` (7.3) 100 × 1.000 = **một trăm ngàn koṭi** (cùng cách với `bv18:3.3`, 12/12 tiền lệ). `chavassasahassa` (17.1) 6 × 1.000 = **6.000 năm**. `tettiṁsa` 33 + `sahassa` 1.000 = **33.000** (18.1; `Tettiṁsasahassāni ca` của `bv15:17.1` cũng đã dịch “Ba mươi ba ngàn”). `catu` 4 (19.1 bốn dấu hiệu). `anūnasattamāsa` = không thiếu + 7 = **đủ bảy tháng** (19.3; cùng khuôn `bv16:17.3`). `asīti` 80 (24.2 cao **tám mươi hattha**, 3/3 tiền lệ cùng khoá). `yojana` 1 (25.4 **một do-tuần**). `saṭṭhi` 60 × 1.000 = **60.000 năm** (26.1). `dasapāramī` 10 (14.4). Không có cụm `Tiṁsakappasahassa`.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt hiện có (draft và published; so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 50/120 khoá của bài có Pāli trùng với khoá ở bài khác, tổng 2.257 cặp (1.811 cặp thuộc `13.2` `…pe…`, 54 trong đó khác chỉ ở dấu cách hoặc dấu nháy), trong đó 120 cặp có Việt khác bản tôi viết (54 ở `13.2`; còn lại 66 trên 446 cặp). 34 khoá dùng đúng nguyên văn tiền lệ (mọi cặp đều giống hệt). 16 khoá còn lại có cặp khác, chỉ ba loại: (a) khác dấu cuối theo Pāli từng khoá (`4.4`, `6.4`, `9.4`, `14.2`, `26.1`, `26.4`; Pāli ở đây kết `.` hay `;` khác tiền lệ); (b) khác ngôi kể hoặc chữ nhỏ (`10.1` 18 cặp, 8 khác: “Vào lúc ấy tôi,” 4 / “Vào thời ấy, ta” 2…, giữ “ta” vì người kể là Đức Phật Gotama, như `bv17:9.1`; `11.4` tiền lệ duy nhất dùng “tôi” ở `tha-ap340:5.4`, bài này dùng “ta”; `18.2` 26 cặp, 6 khác, 20 giống; `25.3` 16 cặp, 6 khác: “Dù ban ngày hay ban đêm,” 10 so với “dù ngày hay đêm,” 6, chọn dạng đa số); (c) `13.1` 14/14 khác chỉ vì Pāli ở đây mở nháy đơn `‘` còn tiền lệ không có (Việt thêm `‘` theo Pāli từng khoá).
  - `12.3` **cố ý khác** tiền lệ: tiền lệ duy nhất (2 cặp, cùng khoá `bv28:1.1`) là “Vào vô lượng kiếp trước đây,” — người kể nhìn ngược về quá khứ. Ở `12.3`–`12.4` là lời thọ ký tương lai (`bhavissati`), nên viết “Sau vô lượng kiếp nữa,” theo `bv20:9.3`, `bv16:11.3`, `bv17:10.3`, `bv18:10.3`, `bv19:13.3`. Pāli `Aparimeyyito kappe` không có chữ chỉ hướng; hướng lấy từ `bhavissati` ở `12.4`.
  - `19.4` `padhānaṁ padahī jino`: 5 tiền lệ “bậc Chiến Thắng đã nỗ lực tinh tấn.” và 2 cặp ở `tha-ap200:1.4` viết “nỗ lực chung thức cuối cùng” — “chung thức” không có trong Pāli và có vẻ là lỗi; dùng dạng 5/7. **Lỗi ngoài lát, báo chứ không sửa** (đã nêu ở `bv18`, `bv19`).
  - `24.1` 2 cặp, 2 khác (`bv22:23.1` “Về chiều cao, vị Phật ấy” không có dấu phẩy; `bv25:25.1` “Đức Phật ấy,”): chọn “vị Phật ấy,” theo Pāli `so buddho` và dấu phẩy của Pāli ở đây.
  - Trùng trong chính bài: 2 nhóm Pāli trùng, 5 khoá. `12.2`/`20.2` (`revato lokanāyako;`) giống hệt: “Revata, bậc Dẫn Đạo thế gian;”. `6.2`/`16.4`/`21.4` (`revatassa mahesino`) Việt khác theo ngữ cảnh: `6.2` “nơi Revata, bậc Đại Ẩn Sĩ;” (đứng sau “Đã có ba kỳ hội chúng,”, cùng khuôn `bv20:5.2`) so với `16.4`, `21.4` “của bậc Đại Ẩn Sĩ Revata.” (khuôn `bv18:13.4`, `bv18:18.4`; 2 khoá này giống hệt nhau). Dấu cuối theo Pāli từng khoá (`6.2` `;`, `16.4`/`21.4` `.`).

  **Thuật ngữ** (đếm số khoá trong toàn tầng Việt hiện có, gồm cả các bv đã dịch ở làn khác; tiền lệ dẫn bằng khoá cụ thể ở các bv anh em).
  - `nāyaka` → “bậc Dẫn Đạo” (`bv18:1.2`, `bv18:17.2`, `bv20`; 123 khoá toàn tầng chứa “Dẫn Đạo”). `jina`/`uttama` → “bậc Chiến Thắng tối thượng”. `mahāvīra` → “Đại Anh Hùng” (`bv15`–`bv27`, 12/12 cho khoá `Vatti cakkaṁ mahāvīro`). `mahesi` → “Đại Ẩn Sĩ”. `narāsabha` → “Nhân Ngưu” (`bv16:18.4`, `bv16:24.1`, `bv17:17.2`, `bv25:1.4`; 77 khoá toàn tầng, cùng dạng). `naramarū` → “người và chư thiên”.
  - `anūpama` “không thể ví sánh”, `asadisa` “vô đối” (cùng cặp với `bv19:24.3`, tiền lệ duy nhất, giữ nguyên chữ). `atula` “không thể cân lường” (`bv16`, `bv17`, `bv18`). `asama` “vô song”. `asādisa` (28.2) cũng “vô đối”.
  - `abhisamaya` “chứng ngộ”, `sannipāta` “kỳ hội chúng”, `samāgama` “cuộc tụ hội”, `khīṇāsava` “đã đoạn tận lậu hoặc”, `vimala` “không cấu uế”, `tādī` “bất động như vậy” (đều theo `bv16`–`bv20`). `suvimutta` “khéo giải thoát” (83 khoá toàn tầng).
  - `dhammaṁ pakāsesi` (2.1) → “tuyên thuyết Pháp” (428 khoá toàn tầng chứa “tuyên thuyết”; `bv17:8.2` dịch `pakāsesi` “chỉ rõ” trong câu khác nên không áp dụng). `abhiyācita` → “thỉnh cầu” theo `yācito` ở `bv20:18.1` (15/15). `khandha` “uẩn”, `dhātu` “giới” (xem bất định 1).
  - `vinesi` → “điều phục” (4.2, `bv17:3.2`, `bv15:6.2`) và “dẫn dắt” (5.4); xem bất định 3. `paṭisallāna` → “độc cư” (235 khoá). `narāsabho` xem trên. `uttame phale` → “quả tối thượng”.
  - `saraṇaṁ gañchahaṁ` → “quy y” (359 khoá toàn tầng chứa “quy y”). `thomayitvā` → “tán thán” (646 khoá). `uttarīya` → “áo choàng ngoài” (`tha-ap340:5.4`, 2 cặp cùng khoá). `yathāthāmaṁ` → “tùy theo sức mình”.
  - `sīla` “giới”, `samādhi` “định”, `paññāguṇa` → “phẩm đức trí tuệ”. `pāramī` “ba-la-mật”. `byākāsi` → “thọ ký” (10/10 tiền lệ cùng khoá `Sopi maṁ buddho byākāsi`).
  - `āveḷo ca vibhūsito` (17.4) → “và Āveḷa được trang hoàng”: xem bất định 2. `puññakammābhinibbatta` → “Sinh ra từ nghiệp phước” (tiền lệ `tha-ap5:12.1`, 1 khoá, giữ nguyên chữ).
  - `agāraṁ ajjha so vasi` “Ngài đã sống tại gia” (12/12). `nimitta` “dấu hiệu” (14/14 cho khoá `Nimitte caturo disvā`). `rathayānena` “bằng xe” (`bv15:18.2`, `bv24:18.2`). `padhāna` “nỗ lực tinh tấn”. `aggasāvaka/-ikā` “đệ tử/nữ đệ tử thượng thủ”, `aggupaṭṭhaka/-ikā` “thị giả/nữ thị giả hàng đầu” (12/12 mỗi dạng). `upaṭṭhāka` “thị giả”.
  - `uccattana` “chiều cao” (`bv22:23.1`, `bv25:25.1`). `hattha` giữ chữ Pāli (`bv16`, `bv17`). `yojana` “do-tuần” (`bv15`, `bv16`, `bv24`). `pabhāmālā` (không tiền lệ) → “vầng hào quang”; `pabhā` → “hào quang”. `pharati` → “lan tỏa” (`bv16:23.4`). `indaketu` (không tiền lệ) → “ngọn cờ của Inda”: xem bất định 5.
  - `āyu` “tuổi thọ”. `tiṭṭhamāno` “ở lại”. `tāresi janataṁ bahuṁ` “đã đưa đông đảo mọi người vượt qua” (11 cặp, 9 giống, đã dùng lại). `buddhabala` → “sức mạnh của Đức Phật” (`mil6.1.1:6.1`, 1/1; không dùng “Phật lực” để khỏi lệch tiền lệ). `amata` “bất tử” (`bv16:2.3`). `nibbāyi` “nhập Niết-bàn”. `anupādāna` “không chấp thủ”. `yathaggupādānasaṅkhayā` “như ngọn lửa khi nhiên liệu đã cạn” (`bv16:25.4`, 1/1). `saṅkhāra` “hành” (`rittā sabbasaṅkhārā`, 4/4). `dhātuvitthārika` “việc xá lợi được rải rộng khắp” (8/8).
  - `cakkānuvattaka` (8.2) → “người tiếp nối chuyển bánh xe của Ngài”: không có tiền lệ (`an5.140:15.1` `Cakkānuvattanā` dịch “Điều ngự bánh xe”); xem bất định 4. `jīvitasaṁsaya` → “nguy hiểm cho mạng sống” (`mil6.3.9`: nghĩa “đe dọa mạng sống”, 1 khoá).
  - Tên riêng (chưa có tiền lệ trong tầng, giữ dạng Pāli có dấu): `Sumana` (1.1), `Revata`, `Arindama` (4.1), `Atideva` (10.2), `Sudhaññavatī`, `Vipula`, `Vipulā`, `Sudassana`, `Ratanagghi`, `Āveḷa`, `Sudassanā`, `Varuṇa`, `Varuṇārāma`, `Sirīghara`, `Brahmadeva`, `Sambhava`, `Bhaddā`, `Subhaddā`, `Paduma`, `Kuñjara`, `Sirīmā`, `Yasavatī`. `Revata` đã có trong tầng ở nhiều bài Tạng Kinh khác (chưa đo xem cùng một người). `Varuṇa` (18.4, 21.1) là cùng một tên ở hai chỗ: con ruột của Revata, rồi đệ tử thượng thủ; Pāli không nói họ là một người nên Việt chỉ giữ cùng một tên.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `2.3`–`2.4` `khandhadhātuvavatthānaṁ, appavattaṁ bhavābhave`: hai cụm danh từ đứng riêng (tân ngữ của `pakāsesi` hay đồng vị với `dhammaṁ`); Việt giữ hai dòng danh từ song song, không thêm động từ. `vavatthāna` “sự xác định, phân định”. `appavattaṁ` “sự không tiếp diễn” (không còn chuyển khởi); `bhavābhave` locative “ở hữu này hay hữu khác” (đọc `bhava` + `abhava` theo nghĩa “hết hữu này đến hữu khác”; cách đọc khác “trong hữu và phi hữu”). Tầng `dn1:1.17.2` dịch `itibhavābhava` “hiện hữu và không hiện hữu”, `dn25`/`an10.69` dịch “trở thành thế này hay thế khác” (hai cách khác nhau trong cùng tầng, nên không áp một dạng).
  2. `17.3`–`17.4` `Sudassano ratanagghi, āveḷo ca vibhūsito`: ba tên lâu đài khớp “ba” ở `17.6`, nên tôi đọc `Sudassana`, `Ratanagghi`, `Āveḷa` là ba tên và `vibhūsito` là tính từ (“được trang hoàng”) bổ nghĩa cho `Āveḷa`. Cách đọc khác: `Āveḷavibhūsita` (hoặc `Vibhūsita`) là tên thứ ba/thứ tư, hoặc `ratanagghi` là tính từ chứ không phải tên. Không phân xử được từ Pāli; người biên tập xác nhận khi có nguồn.
  3. `4.2`, `5.4` `vinesi`: ở `4.2` điều phục vua Arindama (tân ngữ trực tiếp), ở `5.4` “dẫn dắt vào quả tối thượng” (`uttame phale` định vị: “vào/ở quả tối thượng”). Hai dòng cùng chữ `vinesi` nhưng Việt khác (“điều phục” / “dẫn dắt”) theo tân ngữ. `4.1`–`4.2` Việt viết một mệnh đề bị động (“Khi vị vua Arindama / được Mâu-ni Revata điều phục;”); Pāli chủ động (`vinesi revato muni`), chủ ngữ là Revata. `5.1`–`5.2` `sattāhaṁ paṭisallānā vuṭṭhahitvā`: “từ cuộc độc cư bảy ngày, sau khi xuất ra”; Pāli không có chữ “thần thông” hay “định” nên Việt không thêm.
  4. `8.1`–`8.4` `yopi paññāya asamo, tassa cakkānuvattako`: `yopi` đại từ quan hệ nhưng Pāli đặt hai mệnh đề đồng vị với `so` ở `8.3`; Việt viết “Vị cũng vô song về trí tuệ, / người tiếp nối chuyển bánh xe của Ngài; / vào lúc ấy vị ấy đã lâm bệnh,”. Cách đọc khác: `tassa` là sở hữu của Đức Phật (“của Ngài”, như đã dịch) hay `tassa cakkānuvattako` = “người hộ trì bánh xe Pháp của vị ấy”. Theo ngữ cảnh đó là một vị đệ tử lớn của Ngài, nhưng Pāli ở đây không gọi tên hay chức danh, nên Việt không thêm. `9.1` `gilānapucchāya` “để hỏi thăm bệnh” (trợ cách).
  5. `24.4` `indaketuva uggato`: `inda` đọc là Inda (Sakka, Indra), giữ chữ “Inda” chứ không dịch “Đế Thích”, vì tầng dùng “Sakka” cho `sakko` và không có tiền lệ cho `inda`. Cách đọc khác: `indaketu` là tên một ngọn cờ lễ hội. Tính từ `uggato` “được dựng lên/vươn cao”. `24.3` `obhāseti disā sabbā` “chiếu sáng mọi phương” (`disā` “phương”, không đo thêm).
  6. `20.4` `varuṇārāme sirīghare`: `Varuṇārāma` và `Sirīghara` hai danh từ định vị. Đọc “ở Varuṇārāma, trong Sirīghara”. Cách đọc khác: `sirīghara` là tính từ/danh hiệu (“tòa nhà cát tường”) bổ nghĩa cho `ārāma`, hoặc tên của một khu vực. Không có tiền lệ cho cả hai. `ārāma` giữ trong tên (như `Nandārāma` ở `bv19:28.2`, `Anomārāma` ở `bv16:26.2`).
  7. `22.4` `nāgamūle`: “gốc cây nāga”. Pāli là hợp từ `nāga` + `mūla` (“gốc” của cây nāga, theo cách hiểu thông thường là cây bồ-đề của Revata); Pāli ở đây không nói chữ “cây”, Việt thêm “cây” theo cách hiểu thông thường của hợp từ này. `nāga` còn có nghĩa “long/voi”, nhưng “gốc của voi” vô lý trong văn cảnh, nên bác bỏ. `abujjhatha` “đã giác ngộ” (không dùng “đã giác ngộ vô thượng” vì Pāli không có).
  8. `15.1`–`15.4` `buddhadhammaṁ`/`dhammaṁ`: tôi đọc `buddhadhamma` là “các pháp (đức tính, điều kiện) của chư Phật”, không phải “Phật pháp” theo nghĩa giáo lý; `dhammaṁ` ở 15.3 là cùng đối tượng đó (“pháp ấy”). `āharissāmi` “ta sẽ mang đến” (nghĩa đen); cách đọc khác “ta sẽ đạt được”. `anubrūhayiṁ` “đã làm cho tăng trưởng” (đối tượng ẩn là `buddhadhamma`). `15.1` `Tadāpi` “Cũng vào lúc ấy” (`tadā` + `api`).
  9. `1.1`–`1.4`: câu không có động từ riêng; `1.2` viết “có bậc Dẫn Đạo tên là Revata” (theo `bv18:1.2`), chủ ngữ cho `1.3`–`1.4` là Revata. `1.4` `atulo uttamo jino` → “không thể cân lường, bậc Chiến Thắng tối thượng” (hai tính từ `atulo`, `uttamo` đều bổ nghĩa `jino`; tách dấu phẩy sau `atulo`, như Pāli).
  10. `12.3`–`13.3` nháy: Pāli mở `“` ở `12.3`, mở `‘` ở `13.1`, đóng `’` ở `13.3`, đóng `”` ở `29.4` (không có `“` ở `1.1`). Việt khớp Pāli từng khoá (0 lệch, mẫu số 120). Phần giữa `12.3`–`29.4` là lời Đức Phật Revata thọ ký chứ không phải lời Gotama kể; Pāli ghim không đánh nháy riêng cho tầng lời ấy.
  11. `29.1`–`29.2` `yasadharo` “bậc nắm giữ danh tiếng”; `mahāpure` “ở thành phố lớn”, Pāli không nói tên thành; cách đọc khác: `Mahāpura` là tên một thành phố.

