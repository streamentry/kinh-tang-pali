  2. **Đọc đối kháng 41 khoá: 13 khoá lỗi nghĩa thật (`1.2, 2.2, 2.3, 3.1, 3.2, 3.4, 4.1, 4.3,
     5.2, 5.3, 5.4, 6.4, 8.2`), 7 khoá sửa vì lệch nghĩa nhẹ hoặc đổi theo tiền lệ (`1.1, 2.4, 4.2,
     5.1, 6.3, 8.3, 8.4`), tổng 20 khoá đổi; 21 khoá còn lại (gồm `0.1–0.3`, `10.1`, `11.1`) giữ nguyên. Lỗi nghĩa thật:
     - `1.2` `tiṇṇaṁ vedāna pāragū`: bản cũ "đã vượt qua ba thọ". `veda` ở đây là Veda
       (kinh Vệ-đà của bà-la-môn), không phải `vedanā` (thọ). Nay "thông thạo ba Veda, bậc đã đi
       đến bờ bên kia" (tiền lệ: 6 khoá cùng Pāli ở `tha-ap3`, 5 khoá "ba Veda/Vệ Đà" ở bộ khác).
     - `2.2` `byaggharājaṁva nittasaṁ`: bản cũ "vua muông thú bị kéo đi". `byaggharāja` = hổ chúa,
       `nittasa` = không run sợ (ni + tasa, căn tras). Nay "như hổ chúa không run sợ".
     - `2.3` `Tidhāpabhinnamātaṅgaṁ`: bản cũ "thân mình gãy lỡ ba chi" sai hẳn. Nay "như voi chảy dịch
       ở ba nơi" (đúng như `tha-ap104:1.3`, `tha-ap321:4.3`, `tha-ap431:9.3`); `2.4` đổi về
       "bậc Đại Ẩn Sĩ như một con voi" khớp `tha-ap104:1.4` (cùng Pāli). Cả `2.1–2.4` là các ví dụ
       so sánh dành cho Đức Phật ở `1.4` (`lokanāyakaṁ`), không phải câu độc lập.
     - `3.1–3.2` `Sereyyakaṁ gahetvāna, ākāse ukkhipiṁ ahaṁ`: bản cũ coi `Sereyyaka` là một người
       ("giơ ngài lên"). Đó là tên loài hoa (cũng là tên vị trưởng lão, đặt theo việc cúng dường
       này); các khoá sau (`4.3` mái che bằng hoa, `5.1` áo choàng hoa) xác nhận. Nay "Cầm lấy hoa
       sereyyaka, tôi tung lên giữa hư không" (`ākāse ukkhipiṁ`: 4/8 khoá cùng cụm dịch "tung lên", còn lại "giơ lên"/"rải"; chọn "tung lên" vì động từ gốc `khip`).
       Tên loài hoa giữ nguyên dạng Pāli, không quy ra tên khoa học.
     - `3.4` `parivārenti sabbaso`: bản cũ "tôi đi vòng khắp nơi" — động từ ngôi thứ ba số nhiều,
       chủ thể là các bông hoa, không phải người nói. Nay "chúng vây quanh khắp mọi phía".
     - `4.1` `Adhiṭṭhahi mahāvīro`: "đã đứng lên" sai; `adhiṭṭhahi` = quyết định/chú nguyện. Nay "đã
       quyết định" (đúng `tha-ap342:6.1`, cùng Pāli).
     - `4.3` `Samantā pupphacchadanā, okiriṁsu narāsabhaṁ`: "phủ đầy hoa khắp mọi phương, rải xuống"
       làm mất `chadanā` (mái che). Nay "khắp mọi phía, những mái che bằng hoa / rải xuống đấng Nhân
       Ngưu". `4.2` đổi "Đạo sư của thế gian" → "bậc Dẫn Đạo thế gian" (4 khoá cùng Pāli ở tầng, cùng
       cách dịch `lokanāyako` như `1.4`, `6.4`).
     - `5.1–5.2` `pupphakañcukā … antovaṇṭā bahimukhā`: "mặt trong quay vào, mặt ngoài hướng ra" bỏ
       mất `vaṇṭā` (cuống). Nay "cuống ở bên trong, mặt hướng ra ngoài"; `kañcukā` = áo choàng
       ("áo choàng hoa" ở `thi-ap17:171.2`), không phải "giáp".
     - `5.3–5.4` `Sattāhaṁ chadanaṁ katvā, tato antaradhāyatha`: "làm tấm phủ kéo dài bảy ngày,
       rồi người ấy liền biến mất" thêm chủ thể "người ấy" và "liền" mà Pāli không có; chủ thể là
       tấm áo choàng hoa ở `5.1`. Nay "làm mái che suốt bảy ngày, / rồi biến mất".
     - `8.2–8.4`: bản cũ "có hai mươi lăm kiếp tương tự Vītamalā, là Chuyển Luân Vương" — đếm `pañcavīsati`
       thành số kiếp. Song song `tha-ap177:4.1–4.2` `Pannarasasahassamhi, kappānaṁ aṭṭha āsu te` =
       "trong mười lăm ngàn kiếp, có tám vị vua": `kappānaṁ` là "trong số các kiếp", con số đếm
       các vị Chuyển Luân Vương. Nay "Trong mười lăm nghìn kiếp, / có hai mươi lăm vị / cùng mang tên
       Vītamalā, / là những vị Chuyển Luân Vương có đại uy lực" (số nhiều, vì 25 vị; tiền lệ
       `tha-ap67:6.4`). **Số Pāli đã tính:** `pannarasa` = 15 (đã đo ở mục trước) và
       `pannarasasahassa` = 15 × 1.000 = 15.000; `pañcavīsati` = 25.
     - Sửa nhẹ về tiền lệ/sát chữ: `1.1` về "Người tụng đọc, người thuộc lòng những bài tụng"
       (`tha-ap3:137.1` + `bv2:5.1`: 11 khoá; "vị thầy … điều đã ghi nhớ" 2 khoá và "thần chú" 1 khoá;
       cách cũ lệch với `mantadharo` = người giữ/thuộc các bài tụng); `6.3` `pasādesiṁ` = làm cho tịnh tín, nay "tôi làm cho tâm tịnh tín nơi
       Đức Phật" (`ne37:119.1`, `tha-ap403:16.3`, `thi-ap28:55.1`: 3 khoá "làm cho tâm tịnh tín" /
       2 khoá "hướng tâm"); `6.4` `sugate` = "bậc Thiện Thệ" — **đính chính lời khẳng định cũ rằng
       `sugate` không có tiền lệ**: đo lại thì "bậc/Đấng Thiện Thệ" có ở `tha-ap539:24.1`, `thi-ap23:9.1`,
       `ud1.10`, `snp3.10`, `iti84` và nhiều khoá khác; "Cùng Điều Phước" là cách dịch bịa, đã bỏ.
