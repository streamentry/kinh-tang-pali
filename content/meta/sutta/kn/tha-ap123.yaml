  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (dòng đầu tệp). 1 khoá bất đồng nghĩa → sửa 0, giữ 1 (8.3: bản nguyên bài đọc tên chung của hai mươi lăm vị Chuyển Luân Vương là Cittamālā, Pāli đã ghim đọc Vītamalā; đây là dị bản chữ giữa hai ấn bản, Pāli ghim là chuẩn nên giữ "Vītamalā"), bất định 0. Việc đối chiếu này cũng giải được blocker `unresolvedTerm` về `Vītamalā`: (1) bản nguyên bài đặt ở đúng vị trí đó một danh xưng riêng ("cùng tên … ấy"), không phải tính từ; (2) công thức trong tầng: ở 76 khoá `cakkavattī mahabbalā` của `tha-ap`, 22 khoá có dòng liền trước là dòng nêu tên chung (`…nāma nāmena`, `…nāmā te`, `Sabbe samattanāmā te`…), phần còn lại là `Sattaratanasampannā` hoặc số lượng, không có dòng nào dùng một tính từ đơn thuần ở chỗ này. Vậy `Vītamalā samānā ca` là tên chung của hai mươi lăm vị và bản dịch "cùng mang tên Vītamalā" đúng; chỉ chính tả tên khác nhau giữa hai ấn bản. 40 khoá còn lại cùng nghĩa (hoa sereyyaka/sereyya, mười lăm nghìn kiếp, hai mươi lăm vị, một trăm nghìn kiếp, bốn vô ngại giải, tám giải thoát, sáu thắng trí). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Không đổi khoá nào.
