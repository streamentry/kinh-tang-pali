notes: |-
  TẦNG THAM KHẢO — 0/20 khoá có Anh Sujato: edition `translation/en/sujato` tại commit đã ghin
    (11c9d708978cde8ba61096d8a75f7ddfb846f639) không có tệp `kn/` nào, nên `tha-ap` không được phát
    hành ở tầng này — đây là `not-published-upstream`. Không có Việt hiện hành, không có lớp lấp
    `english-project`. ⇒ `draft`, `triangulation` 7.5.

    20 khoá, tất cả đã dịch, không có khoá nào thiếu hay orphan.

    Cấu trúc mở đầu `Itthaṁ sudaṁ āyasmā <tên> thero imā gāthāyo abhāsitthāti.` **không có
    vocative** trong Pāli, nên bản dịch không thêm lời hô nào: dùng lại **nguyên văn** khuôn đã có ở
    các tệp `tha-ap` trong tầng — *Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này.*

    `4.1–4.3` dùng lại **nguyên văn** công thức của `tha-ap243`/`tha-ap246`/`tha-ap257`: *Bốn vô ngại
    giải,* / *…* / *đã làm tròn lời dạy của Đức Phật”.* `Paṭisambhidā catasso` là **glossary bắt buộc**
    (`paṭisambhidā` → preferred *vô ngại giải*). Dấu lược ở `4.2` giữ **đúng một** `…` theo
    BRIEF_VI3 §10.1: Pāli đã lược ở khoá này, mà công thức `Chaḷabhiññā sacchikatā` không nằm trong
    chính bài này, nên viết thêm là thêm chữ không nguồn nào chứng thực.

    `0.3` giữ **số thứ tự** mà Pāli có ở đầu tiêu đề (`5 Vedikārakattheraapadāna` → *5. Bài Kệ Tuyên
    Ngợ…*), theo tiền lệ `tha-ap246`/`tha-ap250`/`tha-ap278`/`tha-ap281`; khi Pāli không có số thì không
    thêm, theo `tha-ap243`/`tha-ap257`. `0.1 Therāpadāna` giữ nguyên như tên tác phẩm.

    TÊN PHẨM `0.2` — xem khoản riêng ở cuối `notes`.

    REVIEW ĐỐI KHÁNG (đọc lại Pāli cạnh bản dịch từng cặp) — bắt được 6 lỗi, đã sửa hết:
    · `Sattaratanasampanno,` tôi viết đầu *đủ cả bảy bảo vật,*; đã đổi thành *đầy đủ bảy bảo ngọc,*
      để khớp 4 tệp đã có (`tha-ap156`, `tha-ap218`, `tha-ap230`, `tha-ap234`).
    · `cakkavattī mahabbalo.` tôi viết *là bậc Chuyển Luân Vương đại lực*; đã đổi thành *là bậc vua
      Chuyển Luân vĩ đại.* để khớp 6 tệp đã có (156, 188, 207, 216, 218, 230).
    · `Pasannacitto sumano,` bị tôi dịch **hai kiểu** trong chính lát (thiếu 237 và 270); đã thống
      nhất *Với tâm thanh tịnh, hân hoan,* — `pasanna` là **glossary** → *thanh tịnh*.
    · `dvipadindassa tādino.` cũng bị hai kiểu (249 và 251); đã thống nhất.
    · `bodhipūjāyidaṁ phalaṁ.` tôi viết *nơi giác ngộ*; đã đổi thành *đó là quả báo của việc cúng
      dường bậc Giác Ngộ.* cho khớp `tha-ap230:2.4`.
    · `Añjaliṁ paggahetvāna,` tôi viết *Vừa hòa tay lễ bái xong,*; đã đổi thành *ta giơ hai tay lễ rồi,*
      cho khớp `tha-ap216:1.3`, và bỏ đại từ lặp ở khoá kế (Pāli `ullokento` vẫn nối chủ ngữ `ahaṁ`,
      tiếng Việt thì pro-drop nên không mất chủ thể).

    Tên riêng Pāli giữ nguyên dấu (`Vedikāraka`, `Samantacakkhunā`, `bimbijāla`, `caṅkoṭaka`,
    `kinnara`…), đúng văn phong sẵn có của tầng.

    Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điền phối, nên
    `technical_integrity` bị chặn ở **9.6**. Bốn lệnh đó để người điền phối chạy. Tôi đã tự tái lập bằng
    script những kiểm mà `validate` làm cho tầng Việt: đủ 20 khoá với đúng segment ID, 0 orphan, 0 rỗng,
    mọi khoá NFC, dấu lược khớp Pāli **từng khoá**, không có `(…)`, ngoặc kép `“”` cân trên cả bài. Đây
    **không** thay thế được `validate`.

    TÊN PHẨM `0.2` — dùng lại **nguyên văn** `Padumukkhipavagga` → *Phẩm Bậc Tay Nắm*, đã có ở
    `tha-ap268`. Đây là cách dịch nới lỏng (`padumukkhi` = cấy xuống bùn; `mukkhi` mới là "nắm"), nhưng
    không sai nghĩa gốc như hai phẩm kia, nên tôi giữ.

    Uddāna `dutiyaṁ`: `Padumukkhipavagga` là `tha-ap263–272`; 263 `paṭhamaṁ`, 264 `dutiyaṁ`,
    265 `tatiyaṁ`, 266 `catutthaṁ`, 267 `pañcamaṁ`, 268 `chaṭṭhaṁ`, 269 `sattamaṁ`, 270 `aṭṭhamaṁ`,
    271 `navamaṁ`, 272 `dasamaṁ`. Khớp `6.1`.

    `vedikā` dịch *lan can* theo tiền lệ mạnh của tầng (`AN 9` hai hồ và hai cung điện), và ở đây là lan can
    quanh gốc Bồ-đề. `tāvade` dịch *đúng* (chính là), không dịch *chính xác* vì đó là calque.

    `Succhavi nāma khattiyo` — `khattiya` dịch *quý tộc* (tiền lệ *quý tộc* có sẵn trong tầng), `nāma`
    giữ dạng *tên là*.

