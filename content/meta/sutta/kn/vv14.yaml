notes: |-
  Dịch TRỰC TIẾP từ Pāli root — không có tầng Anh đã ghim cho vv14, xem blocking_errors.
  Chỉ mục Pāli và Việt toàn tầng: 33 khoá của bài này có Pāli trùng nguyên văn ở bài khác, 27 dùng lại NGUYÊN VĂN bản Việt đã có. Sáu câu 6.3–6.6 trùng nguyên văn vv71:4.1–4.4 (Với tâm tịnh tín tự tay mình / … trao dâng nắm bánh mạch kummāsa / nay con được hoan hỷ trong khu vườn Nandana); phần còn lại lấy lại vv1 và vv4.
  0.4 Dutiyasuṇisāvimānavatthu: tầng name/ cho vv-name:16.vv14 bằng Second Daughter-in-Law Mansion. 0 tiền lệ cho suṇisā trong tầng Việt; theo tầng name và câu 5.2 thì dịch Nữ Dâu Thứ Hai, đối xứng với vv13. Đây là BẤT ĐỊNH.
  BẤT ĐỊNH 6.3–6.4: thứ tự Pāli là Tassa adāsahaṁ bhāgaṁ (tôi đã cho vị ấy phần của mình) rồi pasannā sehi pāṇibhi (với tâm tịnh tín bằng chính đôi bàn tay mình). Tiền lệ vv71 đặt tâm tịnh tín TRƯỚC; chọn theo tiền lệ để giữ nguyên văn, vì hai cách đều thuận với Pāli.
  6.6 đổi con thành tôi vì người kể là nữ thiên; 5.2 và 6.x dùng cụt tôi cho nhất quán với vv1, vv4, vv26 (đa số tầng vv).
  Cổng kỹ thuật: npm run validate, npm test, npm run check do coordinator chạy; bài này draft nên không cần npm run build. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
  Kiểm toán độc lập 2026-10-11: đọc đối kháng từng cặp Pāli-Việt của bản trước, thấy 10/37 khoá sai nghĩa thật và 7 khoá sai nhẹ (thêm chữ, lỗi chính tả, giọng không có trong Pāli); đã sửa 17 khoá, giữ nguyên tập khoá. Lỗi nghĩa thật: 2.2 và 7.2 (idha mijjhati bị đọc thành "có được nơi này", sửa thành thành tựu được ở nơi đây); 3.1 và 8.1 (mahānubhāve/mahānubhāva là hô cách, bị đọc thành tân ngữ "về đại oai lực ấy", và devi bị gọi là ngài); 4.4 (yassa kammassidaṁ phalaṁ là mệnh đề quan hệ: về nghiệp mà đây là quả báo); 5.2 (sasura là cha chồng, bản trước ghi nhà chồng); 6.3 và 6.4 (nội dung hai khoá bị đảo: 6.3 mang pasannā sehi pāṇibhi, 6.4 mang tassa adāsahaṁ bhāgaṁ; đã trả về đúng thứ tự); 8.2 và 8.3 (yamakāsi và tenamhi xưng ngôi thứ nhất, người nói là nữ thiên, bản trước đổi thành ngài nên đảo cả chủ thể). Lỗi nhẹ: 1.2 (bỏ nơi đây không có trong Pāli, nữ thiên cho devate), 2.3 và 7.3 (khưởi thành khởi), 4.2 (truy hỏi thành hỏi), 4.3 (giải thích rằng thành giải đáp), 6.2 (bỏ tâm ý: vippasannamanāvilaṁ đọc vippasannaṁ anāvilaṁ, khớp bản Anh clear and unclouded của dhp413 và snp3.9:49.2), 8.4 (dung sắc thay sắc tướng, khớp 3.4). Điểm đổi: semantic_fidelity 9.2 thành 8.8; grammar_logic 9.2 thành 9.1; segment_alignment 10.0 thành 9.6 (bản trước đảo nội dung 6.3/6.4 mà vẫn chấm 10); terminology 9.0 thành 8.5; vietnamese_clarity 9.3 thành 9.0; han_viet_balance 9.4 thành 9.3; ambiguity_integrity 9.1 thành 8.9 (ghi chú cũ nêu 6.3–6.4 là bất định thứ tự nhưng thật ra Pāli không bất định); final_score 9.18 thành 8.98. Các lỗi này cũng có mặt ở nhiều bài vv khác (cùng Pāli), cần rà tương ứng, riêng vv71:4.1 và 4.2 cũng đảo hai nội dung này.
  Còn tồn tại, giữ nguyên: 0.2 Itthivimāna dịch Nữ Hư Không là sai vì Pāli không có ākāsa, lặp ở nhiều tệp vv nên không sửa riêng một tệp; 0.4 và 9.1 dịch Nữ Dâu Thứ Hai giữ đối xứng với vv13 (suṇisā là con dâu, Nữ Dâu là cách gọi theo tầng name/, còn bất định); 6.1 thanh tịnh bên cạnh ly trần là phần thêm nhẹ so với viraja nhưng có tiền lệ 5 nơi; 2.4 và 7.4 dù là gì dễ chịu với tâm là cách dịch đa số của họ vv, chưa sát chữ piyā (dễ chịu so với ưa thích) nhưng không sai nghĩa; 1.4 sao mai cho osadhītārakā theo đa số 27 nơi. Tầng tham khảo tiếng Anh vẫn vắng, triangulation giữ 7.5. Cổng kỹ thuật: npm run validate, npm test, npm run check, npm run build chưa chạy trong lượt này, technical_integrity giữ 9.6.
  Lượt cải thiện 2026-10-11 (đọc đối kháng lại 37 cặp Pāli-Việt sau kiểm toán trước; đổi 2 khoá, 6.1 và 6.5): (1) 6.1 ly trần thanh tịnh thành ly trần. Pāli virajaṁ chỉ có nghĩa không bụi; thanh tịnh là chữ thêm, và đo trên toàn tầng cho đúng câu Addasaṁ virajaṁ bhikkhuṁ thì ly trần là đa số 4 so với 3 (vv13 cũng ly trần). Ghi chú cũ nói có tiền lệ 5 nơi cho thanh tịnh là số sai, thực đo là 3. Loại accuracy và terminology fix. (2) 6.5 Sau khi trao dâng nắm bánh mạch kummāsa thành Sau khi dâng nắm cháo thô. Pāli Kummāsapiṇḍaṁ datvāna trùng nguyên văn vv71:4.3, bản ấy là nắm cháo thô, và cháo thô là cách dịch kummāsa chiếm đa số (khoảng 15 khoá, gồm 12 khoá Trung Bộ mn81, mn82, mn85, mn36, mn100); chữ bánh và mạch không có trong Pāli. Điểm đổi: semantic_fidelity 8.8 thành 8.9 (bỏ hai chữ thêm); terminology 8.5 thành 8.6 (hai khoá về đúng đa số tầng); các tiêu chí khác giữ nguyên; final_score 8.98 thành 9.0, vẫn không lớn hơn 9.0 nên status giữ review.
  Chỉnh lại các số liệu trong ghi chú cũ phía trên: đo lại, 35 trong 37 khoá của bài có Pāli trùng nguyên văn ở bài khác và 33 khoá dùng lại nguyên văn bản Việt đã có; hai khoá còn lại khác tầng là 1.2 và 6.5 (nay 6.5 đã khớp vv71). Đoạn 6.3 đến 6.6 chỉ trùng vv71:4.1 đến 4.4 ở phần Pāli (bốn câu, không phải sáu) và hai bản Việt không hoàn toàn giống nhau do Pāli khác giống đực và giống cái (pasanno và pasannā). Đoạn nói tiền lệ vv71 đặt tâm tịnh tín trước là lỗi thời: thứ tự hai khoá 6.3 và 6.4 đã sửa đúng Pāli ở lượt kiểm toán trước.
  Quyết định giữ dù còn nghi ngờ: 1.2 giữ nữ thiên cho devate (đúng với devatā đang dịch nữ thiên 43 lần trong họ vv và phân biệt với devi dịch thiên nữ ở 3.1), dù đa số 17 so với 2 ở câu này dùng thiên nữ; 2.4 và 7.4 giữ dễ chịu với tâm theo đa số 41 khoá (piyā sát chữ là ưa thích, đáng yêu), chưa sửa riêng một tệp; 8.2 giữ phước báu nào theo đa số 12 so với 1 dù có thể đọc như câu hỏi, bản vv13 dùng phước báu mà tôi đã tạo; 0.4 và 9.1 giữ Nữ Dâu cho đối xứng với vv13, dù trong thân bài 5.2 đã dịch con dâu. Bất định mới ghi nhận: kummāsa là cháo hay bánh còn tùy tiền lệ (vv42 và ja415 dịch kummāsapiṇḍiyā là nắm bánh mạch kummāsa, trái với cháo thô ở Trung Bộ và vv71), chưa có tầng Anh để phân xử, nên giữ nắm cháo thô theo đa số và theo bản trùng Pāli. Cổng kỹ thuật: npm run validate, npm test, npm run check, npm run build chưa chạy trong lượt này, technical_integrity giữ 9.6.
