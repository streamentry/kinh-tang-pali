notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli so git-hash với manifest (khớp). Đo bằng npm run store: 3 segment Pāli có nội dung (1.4, 1.5, 1.6), English coverage 0%, sàn 0,8 không đạt, reference-gaps.yaml chưa ghi nhận → draft.
  Khung đối đáp giữ nguyên một cách dịch với mil3.4.9, mil3.5.4, mil3.5.6, mil3.6.6, mil3.7.13: Vua nói— (Pāli mang gạch dài nên giữ gạch dài, khớp mil3.5.6 và mil3.6.6), thưa tôn giả Nāgasena, này Đại vương, và câu chốt Khéo lắm, thưa tôn giả Nāgasenā. Câu chốt đó nằm trong TIEN_LE_PHAI.md với nguyên văn bắt buộc, lấy từ mil3.5.6:2.1 và mil3.6.6:2.1. Colophon có dấu phẩy trước số thứ tự như cả 5 bài Milinda đã có.
  Nibbānavagga → Phẩm Niết-bàn, lấy nguyên văn từ mil3.4.9 (cùng phẩm, đã có).
  Thuật ngữ: bālaputhujjā là kẻ ngu dốt (kẻ ngu có 264 tiền lệ); ajjhattikabāhi āyatana là nội xứ và ngoại xứ, lấy nguyên văn dn28:4.2 và dn22:15.1; ariyasāvako là bậc Thánh đệ tử, tiền lệ dn22. abhinandanti là hoan hỷ (892), abhivadanti là đón chào, ajjhosāya tiṭṭhanti là đứng bám chặt vào. nirujjhati giữ hình ảnh dòng nước ngừng chảy thành dừng lại, đối xứng với vuyhanti (bị dòng nước lụt) ở 1.5 — đây là cặp hình ảnh mà Pāli cố ý đặt cạnh nhau. nirodha là diệt tận.
  Bố cục nháy kép theo Pāli: 1.2, 1.3, 1.4 mở và đóng trong một khoá; 1.5 mở nháy và không đóng (vì lời thoại tiếp sang 1.6), 1.6 đóng. Trong 1.5 có dấu nháy cong cho lời trích của đại đế theo đúng ‘na parimuccanti dukkhasmā’ti vadāmi của Pāli.
  Câu hỏi nirodho nibbānan là dạng câu hỏi ngắn, dịch phải chăng theo tiền lệ mil3.4.9; 1.4 Kathaṁ … là Thế nào là sự diệt tận. Không có bản Việt hiện hành ở commit đã ghim; không có Anh Sujato đã ghim và tôi không đọc english-project nên không tuyên bố đã đối chiếu English.
