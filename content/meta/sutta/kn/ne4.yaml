  - `31.2`, `33.1`, `33.3` theo `sn56.11:12.2` ("tại Bārāṇasī, ở Isipatana, nơi Vườn Nai", "không thể bị đảo ngược bởi bất kỳ sa-môn, bà-la-môn, chư thiên, Ma vương, Phạm thiên…"; `mn141:2.1` dịch "Māra" và "trong vườn Lộc Uyển", `migadāya` → "Vườn Nai" theo `sn56.11` vì sát từ). `dhammacakka` → "bánh xe Pháp" (13 khoá toàn tầng, `an1.187`, `mn141`, `sn56.11`…).
  - `1.5`, `36.3`, `37.4` (công thức `ādikalyāṇaṁ … brahmacariyaṁ pakāsessāmi`) theo `mn27:11.3`, `mn42:2.7`, `mn51:12.3` (59 khoá toàn tầng): "tốt đẹp ở phần đầu / giữa / cuối", "đầy đủ ý nghĩa và lời văn". Khác ở `1.5` là `kevalaparipuṇṇaṁ parisuddhaṁ` tách "hoàn toàn, viên mãn, thanh tịnh" vì `37.1`–`37.3` giải nghĩa riêng từng chữ (`kevala` "siêu thế", `paripuṇṇa` "đầy đủ", `parisuddha` "không dơ bẩn"); các bài `mn` gộp "hoàn toàn viên mãn".. `pariyodāta` → "trong sáng" theo `an7.70:2.2`, `an10.52:3.2`.
  - `Bởi vậy, … nói:` cho `Tenāha bhagavā` (`36.3`, `37.4`): đa số trong tầng `ne` (15 khoá "Bởi vậy" so với 3 khoá "Vì vậy" ở các khoá `Tenāha …` của `ne`). `38.2` `Tenāha āyasmā mahākaccāyano—` dùng nguyên văn `ne19:13.1` và `ne35:4.1` ("Vì vậy, Tôn giả Mahākaccāyana đã nói:"), 2/2 cặp trùng Pāli, Việt giống nhau; dấu gạch ngang Pāli chuyển thành dấu hai chấm như hai khoá kia.
  - `Niyutto desanāhāro` (`39.5`) → "Hướng dẫn đề ra đã được vận dụng", theo mẫu `ne6:17.3`…`ne34:2.3` ("… đã được vận dụng", 24 trong 26 khoá `Niyutto …` của `ne`). `Yathāha bhagavā—` (`31.1`) dùng nguyên văn `ne6:11.2`, `ne8:1.6`, `ne13:1.4` ("Như Đức Thế Tôn đã nói—"). `Imāni cattāri saccāni` (`30.4`) dùng nguyên văn `ne20:7.9`, `ne26:2.7` ("Đây là bốn sự thật.").
  - Bài kệ: `3`, `5`, `7`, `9`, `11`, `13` theo `snp4.1`; `15` theo `thag4.10:1.1`, `1.3`, `1.4` (`Dhammo have rakkhati…` → "Pháp hộ trì người thực hành Chánh pháp") nhưng `15.2` (`chattaṁ mahantaṁ` → "chiếc dù lớn", `chatta` là cái dù/lọng) khác `ja447:12.2` ("tán cây lớn", 1 khoá, ngữ cảnh khác về nghĩa); `17`–`19` theo `thag15.1:4.1`–`6.4`; `21` theo `ud5.3:13.1`–`13.4`; `23` theo `snp5.16:4.1`–`4.4` ("Hãy quán sát thế gian là trống rỗng", "nhổ lên quan điểm về tự ngã", "vượt qua Thần chết"); `39` theo `ne3:2.1`–`2.4` (`39.2`, `39.3` Pāli trùng từng byte `ne3:2.2`, `2.3`, Việt giống nhau).

  **Số Pāli.** `chappadāni` = sáu (`36.1`, `36.2`; mỗi danh sách liệt kê đủ 6 mục: saṅkāsanā, pakāsanā, vivaraṇā, vibhajanā, uttānīkamma, paññatti và akkhara, pada, byañjana, ākāra, nirutti, niddesa), `cattāri saccāni` = bốn (`30.2`; bốn mục khổ, tập, diệt, đạo), `catasso paṭipadā` = bốn và `cattāro puggalā` = bốn (`25.1`; bốn câu `25.2`–`25.5` tương ứng đủ bốn tổ hợp), `dvīhi paññāhi` / `dve paññā` = hai (`28.4`, `29.4`), `ubho` = cả hai (`26.1`, `26.2`). Danh sách ba tầng đầu–giữa–cuối ở `35.3` và `35.4`–`35.6` (ādi, majjhe, pariyosāna) có đúng 3 mục, nhưng Pāli không có từ số `ti`. Không có số lớn, không có `tiṁsa` hay `sahassa`.

  **Dấu lược và nháy.** Pāli có `…pe…` ở `17.2`, `18.2`, `33.1`, `33.2` → đúng một `…` ở mỗi khoá; Pāli không có `…` trần và không có `(…)`; Việt không có `(…)` (0 lệch, đã đo trên 127 khoá). Nháy khớp Pāli từng khoá: đo 4 loại dấu (`“`, `”`, `‘`, `’`) trên 127 khoá, 38 khoá có nháy ở Pāli, 0 khoá lệch. Các nháy nằm theo ranh giới khoá của Pāli, kể cả khối lồng `23.1`–`23.5` (mở `“‘` ở `23.1`, đóng `’` ở `23.2`, mở và đóng `‘…’` ở `23.3`, mở `‘` ở `23.4`, đóng `’”` ở `23.5`). Ba khoá `37.1`–`37.3` có chữ `ti` kết lời trích nhưng Pāli không có nháy, nên Việt cũng không thêm nháy; dùng dấu "—" để tách chữ được giải nghĩa.

  **BẤT ĐỊNH — ghi lại, không giấu.**
  - `37.3` `tathāgatapada` dịch "dấu chân của Như Lai" (`pada` còn có nghĩa "vị trí, trạng thái"); `tathāgatārañjita` dịch "nơi Như Lai ưa thích" nhưng nghĩa của `ārañjita` không kiểm chứng được (0 khoá trong tầng); `upaṭṭhitaṁ sabbavisesānaṁ` dịch "có mặt mọi điều thù thắng", có thể đọc `sabbavisesānaṁ` là sở hữu cách của chính danh từ đứng trước. Tiền lệ cho cả ba: 0 khoá.
  - `28.1` `yassa … dhammaṁ desayati`: dịch "Ở người mà … thuyết pháp cho" (cách tặng/sở hữu của `yassa`); `hāro` ở đây hiểu là chính hướng dẫn đề ra vì Pāli chỉ nói `svāyaṁ hāro`.
  - `26.1`, `26.2` `rāgavirāgāya cetovimuttiyā`, `avijjāvirāgāya paññāvimuttiyā`: dịch "để đến tâm giải thoát do ly tham", "để đến tuệ giải thoát do ly vô minh" (đọc `āya` là cách chỉ mục đích); cũng có thể đọc cả hai danh từ là cách công cụ ("nhờ tâm giải thoát do ly tham"). Cả hai cách không đổi nghĩa lớn.
  - `25.2`–`25.5` `mando`, `udatto` dịch "chậm lụt", "sắc bén" (không có tiền lệ); `niyyāti` dịch "thoát ra" (`ne7:3.21`, `ne19:8.15` dịch `niyyānika` là "dẫn ra"). `27.1` `hātabbā` dịch "cần được dẫn" (`harati`); 0 tiền lệ.
  - `1.3` `Kiṁ desayati?` và `30.1` `Sāyaṁ dhammadesanā kiṁ desayati?`: Pāli không nêu chủ thể của `desayati` ở `1.3`; Việt viết "Thuyết điều gì?" không thêm chủ ngữ.
  - `9.4` `yo naro anugijjhati`: câu kệ bị cắt giữa chừng so với bài `snp4.1` (mệnh đề chính nằm ở `11.1`), nên "nếu kẻ nào say đắm chúng" kết bằng dấu chấm trong ngoặc kép và câu chưa hoàn chỉnh đúng như Pāli.
  - `31.2` `sabbaṁ dhammacakkaṁ` dịch "tất cả đều là bánh xe Pháp" (câu tỉnh lược, không có động từ).
  - `32.1`, `34.1` `aparimāṇā ākārā neruttā niddesā`: dịch "vô lượng phương diện, định nghĩa và sự chỉ rõ" (một `aparimāṇā` dùng chung cho ba danh từ cuối); `neruttā` hiểu là `nirutti` (định nghĩa) như ở `ne3:24.1`.
  - `35.2`–`35.3`, `35.4`–`35.6` ba động từ `ugghaṭeti`, `vipañcayati`, `vitthāreti` và `ugghaṭitaññū` dùng tiền lệ `an4.133` cho người ("tức thì", "giảng rộng"); `ugghaṭeti` → "nêu lên" là lựa chọn của bài (xem trên). Tiền lệ trực tiếp cho động từ: 0 khoá.
  - `28.2`, `28.3` `vīmaṁsā` → "thẩm xét", `ussāhanā` → "sự cố gắng", `tulanā` → "sự cân nhắc" (`mn95:23.3`, `mn70:24.11`), `upaparikkhā` → "sự khảo sát" (`mn18:22.3`), `manasānupekkhaṇā` → "sự quan sát lại bằng ý"; `vīmaṁsā` và `manasānupekkhaṇā` 0 tiền lệ.
  - `23.1`–`23.5` ba cặp ví dụ về mệnh lệnh, phương tiện, quả dùng lại lời `snp5.16` (Mogharāja). Việt giữ nguyên ranh giới nháy của Pāli nên `23.4` mở `‘` mà không đóng cho tới `23.5`.

