notes: |-
  Dịch trọn 127/127 khoá của `Desanāhāravibhaṅga` (nhóm 1 của phần `Paṭiniddesavāra`): bốn dòng tiêu đề `0.1`–`0.4`, bài kệ nêu sáu thành tố (`1.x`), sáu cặp kệ ví dụ về vị ngọt, nguy hại, lối thoát, quả, phương tiện, mệnh lệnh (`2`–`23`), phần phân loại ba hạng người và bốn con đường thực hành (`24`–`29`), phần đối chiếu với bốn sự thật và bánh xe Pháp (`30`–`34`), phần giải nghĩa ba tầng đầu–giữa–cuối và ba chữ `kevala`, `paripuṇṇa`, `parisuddha` (`35`–`37`), và kệ kết (`38`–`39`). Không khoá nào ngoài tập khoá Pāli. Thẻ `<b>…</b>` trong Pāli (`37.1`–`37.3`) không đưa sang bản Việt, đúng như toàn tầng.

  **Coverage English: không đo được.** Mẫu số = 44 khoá Pāli có nội dung (từ 40 ký tự trở lên theo `source/layers.yaml`, bỏ khối `:0`). Sujato phủ 0/44, `english-project` 0/44, `vietnamese-current` 0/44. Không có entry nào trong `reference-gaps.yaml` cứu được bài, và có entry cũng không cứu được `published`. Vì không có tầng Anh độc lập nào nên bài không được tuyên bố đã đối chiếu English; chỗ nào cần chứng cứ ngoài Pāli đều dựa vào tiền lệ tầng Việt (nêu dưới đây).

  **Tên của hướng dẫn: `hāra` → "hướng dẫn" (theo yêu cầu), `desanā` → "đề ra".** Đo trên các khoá `ne` khác có `hār…` (không kể `ne3`, `ne4`): bản Việt dùng "hướng dẫn" 36 khoá và "phương thức" 51 khoá; tầng chưa có cách gọi thống nhất. Bài này theo "hướng dẫn" như `ne3` (`ne3:2.4` dịch `desanāhāro` là "hướng dẫn đề ra") và theo `ne2:1.2` cho `desanā` = "đề ra". Tiêu đề `0.4` theo mẫu `ne6`–`ne19` ("Nhóm … Hướng Dẫn") nên là "Nhóm Đề Ra Hướng Dẫn"; ở thân bài (`1.1`, `1.2`, `39.4`, `39.5`) dịch "hướng dẫn đề ra", không thêm chữ "nhóm" như `ne6:1.1` ("nhóm lý luận hướng dẫn"), để câu kệ `39.4` khớp `ne3:2.4`. Trong lời giảng, `desayati` dịch "thuyết" theo `ne6:13.1`–`13.2` (Đức Thế Tôn thuyết bất tịnh, thuyết từ…). Cần người biên tập chốt một cách cho cả bộ Netti.

  **Chỗ dùng lại nguyên văn bản dịch có sẵn.** Pāli trùng từng byte với khoá đã dịch ở bài khác: 24 khoá của bài này, 65 cặp trùng toàn tầng (nguồn: 27 bài `ne` khác, cùng `snp4.1`, `ud5.3`, `thag4.10`, `thag15.1`, `thag6.14`, `thag16.1`, `thag16.2`, `ja447`, `ja467`, `an5.179`); 15 khoá trong đó Việt giống hệt mọi bản trùng, 9 khoá có ít nhất một bản Việt khác (10 cặp lệch, kể cả cặp chỉ khác dấu chấm câu). Các cặp lệch và cách xử lý:
  - `0.2` `Paṭiniddesavāra` → "Phần Giải Thích" như 14 bài `ne` khác; chỉ `ne35:0.2` giữ nguyên Pāli (lỗi của bài kia, không sửa ở đây).
  - `3.1`, `3.3` trùng `ja467:1.1`, `ja467:1.3` ("Với người ham muốn dục", "ắt người ấy sẽ vui mừng"); bài này theo `snp4.1:1.1`, `snp4.1:1.3` vì cả sáu cặp kệ `3`–`13` đều là chính các bài kệ của `snp4.1` (Kinh Dục), nên cùng một đoạn dùng cùng một bản. Tiền lệ: `snp4.1` 1 khoá, `ja467` 2 khoá.
  - `9.2` trùng `ja467:4.2` ("bò, ngựa, nô lệ, người ở"): theo `snp4.1:4.2` ("người hầu") vì cùng lý do.
  - `11.3` trùng `thag16.2:10.3` ("thì từ đó khổ theo người ấy"): theo `snp4.1:5.3`.
  - `19.2` trùng `thag16.1:13.2`: theo `thag15.1:4.2`, `5.2`, `6.2` (cùng bài kệ "Sabbe saṅkhārā…").
  - `21.2` trùng `an5.179:9.2` ("chừng nào sức mạnh còn có thể", ngữ cảnh khác): theo `ud5.3:13.2` vì cùng bài kệ `Cakkhumā visamānīva`.
  - `7.2` khác `snp4.1:3.2` chỉ ở dấu cuối ("," so với ";"): theo `thag6.14:5.2` và dấu `;` của Pāli.
  - `7.3` cố ý KHÁC cả `snp4.1:3.3` lẫn `thag6.14:5.3` (2 khoá, đều "với sự dính mắc trong cõi đời"). Sửa độ chính xác: `somaṁ` là `so` + `imaṁ`, `visattikaṁ` là đối cách của `samativattati`; vì vậy dịch "người ấy, sự dính mắc này trong cõi đời, với chánh niệm mà vượt qua" (`7.3`–`7.4`), không phải "với" (cách công cụ). Báo, không sửa bài kia: hai khoá ở `snp4.1:3.3`, `thag6.14:5.3` có thể cần xem lại.
  - `13.4` (gần trùng `snp4.1:6.4`, khác hoa/thường và dấu nháy) cũng cố ý khác: `nāvaṁ sitvāva pāragū` → "như người đã tát nước khỏi thuyền, sang đến bờ kia"; `nāvaṁ` là tân ngữ của `sitvā` (tát nước thuyền) và `pāragū` là người đã sang bờ kia, trong khi `snp4.1:6.4` dịch "như chiếc thuyền đã tát nước, đến được bờ kia" (thuyền làm chủ ngữ). 1 khoá tầng; báo, không sửa bài kia.
  Trùng nguyên văn trong chính bài: 10 cặp (`2.1`/`8.1`, `3.5`/`9.5`, `4.1`/`10.1`, `5.5`/`11.5`, `6.1`/`12.1`, `7.5`/`13.5`, `14.1`/`22.1`, `15.5`/`23.6`, `17.2`/`18.2`, `32.1`/`34.1`), cả 10 cặp bản Việt giống hệt.

  **Thuật ngữ đã chọn (có đếm).**
  - `assāda` → "vị ngọt", `ādīnava` → "nguy hại", `nissaraṇa` → "lối thoát", `phala` → "quả", `upāya` → "phương tiện", `āṇatti` → "mệnh lệnh": theo `ne3:2.1`–`2.3`, `ne20:7.11` (`assādādīnavatā` → "vị ngọt và nguy hại"); `ne7:1.8` dịch `assāda` là "sự thọ dụng" (2 khoá) nhưng ở đây `assāda` là một trong sáu thành tố nên theo `ne3`.
  - `Tattha katamo … ?` → "Ở đây, … là gì?" (54 khoá `Tattha katam…` ở các bài `ne`, đa số theo mẫu này: `ne2`, `ne6`, `ne7`, `ne11`, `ne17`…).
  - `puggala` → "hạng người" (`ne6:13.1`); `ugghaṭitaññū` → "liễu tri tức thì", `vipañcitaññū` → "liễu tri khi được giảng rộng", `neyya` → "cần được giáo đạo" theo `an4.133:1.3` (tiền lệ duy nhất của toàn tầng, 1 khoá; tầng `ne` 0 khoá). Ba động từ tương ứng không có tiền lệ: `ugghaṭeti` → "nêu lên" (nghĩa gốc "nâng lên, mở ra"; chọn từ không thêm nghĩa "tóm lược" mà Pāli không nêu), `vipañcayati` → "giảng rộng" (cùng gốc với `vipañcitaññū` ở `an4.133`), `vitthāreti` → "trình bày chi tiết" (`ne17:10.1`–`12.2` "chi tiết"; `ne6:11.4` "trình bày rộng ra").
  - `paṭipadā` → "con đường thực hành"; `dukkhā/sukhā paṭipadā dandhābhiññā/khippābhiññā` → "con đường thực hành khổ/lạc với tuệ chậm chạp/nhanh nhạy" theo `an4.163` (tiền lệ 15 khoá cho cụm đầy đủ, 31 khoá `an` cho `khippābhiññā`: "tuệ nhanh nhạy"); `ne17:21.3` dịch "thực hành khổ thắng trí chậm" (1 khoá), `ne11:7.1` "con đường khó nhọc với trí tuệ thấy chậm" (1 khoá) — không lấy theo.
  - `taṇhācarita` → "người tính tham ái", `diṭṭhicarita` → "người tính kiến" (theo "hạng người tính tham", "tính sân", "tính si" ở `ne6:13.1`–`13.2`); `mando` → "chậm lụt", `udatto` → "sắc bén" (không có tiền lệ, 0 khoá ở toàn tầng cho cặp này); `nissaya` → "chỗ nương" (122 lần xuất hiện toàn tầng).
  - `satipaṭṭhāna` → "niệm xứ", `sammappadhāna` → "chánh cần", `jhāna` → "thiền", `indriya` → "căn", `saccāni` → "sự thật" (`ne20:7.9`) nhưng `ariyasacca` → "Thánh đế" (`sn56.19:1.3`: "Như vậy đây là Thánh đế về khổ"; `ne6:1.4` "bốn Thánh đế") để giữ hai từ Pāli khác nhau.
  - `cetovimutti` → "tâm giải thoát", `paññāvimutti` → "tuệ giải thoát", `rāgavirāgāya`/`avijjāvirāgāya` → "do ly tham" / "do ly vô minh", đọc `āya` là cách chỉ mục đích nên viết "để đến" (xem bất định).
  - `sutamayī/cintāmayī/bhāvanāmayī paññā` → "tuệ do nghe/tư duy/tu tập sinh" theo `dn33:1.10.107` ("tuệ do tư duy sinh, tuệ do nghe sinh, tuệ do tu tập sinh"); `ne11:7.2` dịch "trí tuệ của người đã nghe", "trí tuệ suy tư" (không lấy theo). `yoniso manasikāra` → "tác ý như lý" (106 lần / 30 tệp so với "tác ý hợp lý" 10 lần / 8 tệp). `saddhaṁ paṭilabhati` → "đạt được lòng tin" (`an6.30:4.5` "đạt được niềm tin"; toàn tầng "lòng tin" 663 lần, "niềm tin" 376 lần, "đức tin" 199 lần). `satthā` → "bậc Đạo Sư" (435 lần), `sabrahmacārī` → "vị đồng phạm hạnh" (331 lần), `garuṭṭhānīya` → "đáng kính" theo `an5.26:2.2` (chính câu `satthā vā … garuṭṭhāniyo sabrahmacārī`).
  - `dhammavinaya` → "Pháp và Luật" (188 lần "Pháp và Luật" cộng 37 lần "pháp và luật" trong 369 khoá có `dhammavinaya` ở `dn`, `mn`, `sn`, `an`). Khác `ne6:2.3`–`2.4` dịch `vinaya` đứng riêng là "điều phục" vì ở đó `vinaya` là một thước đo ("đối chiếu với điều phục"); còn `vineti` ở `35.4`–`35.6` dịch "điều phục" (nghĩa động từ), nên người đọc vẫn thấy `vineti` và `vinaya` cùng gốc qua chữ "Luật" / "điều phục". Có thể xem lại khi người biên tập thống nhất `vinaya`.
