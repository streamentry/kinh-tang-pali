notes: |-
  BẢN NHÁP ĐÃ DỊCH LẠI BA VẾ ĐÃ CÓ BẢN DỊCH — ĐÃ SỬA. `Vassati devo yathā sugītaṁ,`
  (1.1), `Channā me kuṭikā sukhā nivātā;` (1.2) và `Atha ce patthayasi pavassa devā”ti.` (1.4) trùng
  nguyên văn với ba bài anh em cùng phẩm: thag1.52, thag1.53, thag1.54. Bản nháp tự dịch khác đi ở
  cả ba vế — đúng cái lỗi luật Pāli-trùng cấm, và là lỗi chỉ máy không bắt được. Đã đổi sang cách
  đã có, theo ĐA SỐ: 1.1 "Chư thiên mưa như đang hát ngợt," (thag1.52 và 1.53; 1.54 dùng "Vua trời
  mưa xuống như lời hát ngọt,"); 1.2 "lều tranh của tôi dễ chịu, mái đã kín;" (1.52 và 1.54; 1.53
  dùng "nhà tôi lợp mái, dễ chịu, thoáng mát;"); 1.4 "nếu ngươi muốn thì hãy mưa, các vua trời”ti."
  (1.52 và 1.54; 1.53 dùng "nếu các ngài muốn, thì cứ mưa”ti."). Tầng đang có tiền lệ loãng 2-1 ở
  cả ba vế; tôi theo phe đông đà và ghi ra đây để người biên tập thống nhất nếu muốn.
  Lưu ý thêm một tiền lệ cùng loại: `thag1.1:4.1` có `“Channā me kuṭikā sukhā nivātā,` (chỉ khác
  dấu mở nháy và dấu chấm) và được dịch "Túp lều của tôi trát chắc, quét sạch," — tức là CHÍNH VẾ
  NÀY đã có tới hai cách dịch trong tầng trước khi tôi vào. Tôi theo đa số 2-1. Sự trùng lặp ở đây
  là của tầng, không phải do tôi tạo ra.
  1.3 `Cittaṁ susamāhitañca mayhaṁ` dịch theo đúng tiền lệ thag1.46:1.4 và thag1.1:4.3:
  "tâm khéo định tĩnh". Dòng kết 1.5 giữ HAI dấu lược như Pāli.
  Vì `cần` RỖNG, tôi tự quét MỌI khoá — sạch. Không chạy npm (đợt này cấm) nên technical_integrity
  = 9.6.
