notes: |-
  **Tự kiểm, vì bộ kiểm có sẵn không đo được gì ở bài này** (mọi vế kệ dưới 40 ký tự nên bị lọc). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép mở ở `1.1` và đóng ở `:2.1` (hoặc `1.4`), nên cân trên cả bài, không Pāli lọt, không còn `(…)`. 

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Jātaka` giữ nguyên (129 chỗ). `Ekakanipāta` → *Bộ Một Bài Kinh*. Dòng niết `<X>jātakaṁ <số>` → *Kinh <X> thứ <số>.* theo đa số trên đĩa (71 chỗ không dấu phẩy so với 24 có). Tên riêng giữ nguyên dạng Pāli ở cả `:0.4` và dòng niết — cùng cách *Kinh Paṇṇikajātaka*, *Kinh Udañcanījātaka*, *Kinh Sālittakajātaka*, *Kinh Parosata* đã có.

  **Ngoặc kép ở khoá cuối.** Pāli `ja67:1.4` là `Yato sodariyamānayeti.` — mở `“` ở `1.1` mà **không** có `”ti` đóng. Tôi đóng `”` ở `1.4` (không có `ti`, vì Pāli không có), đúng cách `ja115:1.4` đã làm cho đúng trường hợp này. Các bài Jātaka còn lại trong lát có `”ti` ở vế cuối nên tôi giữ `”ti`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có 26 chương Pháp Cú), nên `triangulation` là Pāli + English Sujato.
  **Đây là bài tôi hạ điểm nhiều nhất trong lát, và lý do là một bất định thật chưa phân xử được.** `Ucchaṅge deva me putto, / Pathe dhāvantiyā pati;` — hai chữ đầu là hai tầng xưng hô cùng lúc: `Ucchaṅge` (theo cách đọc của tôi: tên riêng, người nói gọi) và `deva` (theo cách đọc của tôi: *bạch Đại vương*). Sujato thì **bỏ mất `Ucchaṅge`** và đọc cả khối thành *A son in my lap, Your Majesty, / or a husband while walking the street* — tức lấy `devā` làm xưng hô, không có đại từ xưng hô nào cả. Hai cách đọc dẫn tới hai nghĩa khác nhau cho cả bốn vế: của tôi là *con trai tôi chạy về phía chồng tôi trên đường*; của Sujato là *con tôi nằm trong lòng, hoặc chồng tôi khi đi đường*. Tôi **chọn cách giữ được toàn bộ đơn vị nghĩa của Pāli** (không xóa `Ucchaṅge`, không thay `pati` bằng *chồng* một cách tự do), và ghi rõ ở đây thay vì làm cho câu Việt chắc chắn hơn mức Pāli cho phép. Đây là lý do `ambiguity_integrity` = 8.0 và `triangulation` = 7.8.

  **Tôi đã dò parallel trong corpus đã ghim trước khi kết luận:** `sodariyamānayeti`, `Ucchaṅga` — không có đạo văn song song nào (chỉ có `ja306`, `tha-ap419` dùng `Ucchaṅga` làm tên khác, không liên quan câu chuyện). Vì vậy không có cách nào phân xử từ nguồn nội bộ; đây là **bất định chưa phân xử được**, và tôi nói thẳng là chưa phân xử được chứ không giả vờ đã xử.

  **Vế `1.3`–`1.4` tôi giữ mệnh đề quan hệ đúng sắc:** `Tañca desaṁ na passāmi` (*tôi cũng không thấy chỗ ấy*) và `Yato sodariyamānayeti` (*từ đâu để em tôi mang người anh em về*). `ca` trong `Tañca` là *cũng*, không phải *và*; `sodariya` là **anh em** (giới tính trung tính, không phải *anh*), nên tôi dùng *người anh em* chứ không *anh em*.

  **Thuật ngữ đặt mới, kèm số tiền lệ.** `Itthivagga` → *Phẩm Phụ Nữ* (5 chỗ: `ja61`–`ja65`). `Ucchaṅgajātaka` (**0 tiền lệ**) → giữ Pāli trong tiêu đề, vì `Ucchaṅga` là tên nhân vật của truyện chứ không phải loài vật hay khái niệm. `dhāvantiyā` → *chạy về phía*; `pati` → *chồng*; `sodariya` → *người anh em*; `mānayeti` → *mang về*; `passāmi` → *thấy*.

  **Lượt cải thiện 2026-10-13.** Đọc đối kháng cặp Pāli↔Việt, đối chiếu bản Anh đã ghim và tiền lệ toàn tầng Jātaka; phát hiện bản trước hiểu sai cấu trúc câu. Các nhận định ở những đoạn ghi 2026-10-02 phía trên về `Ucchaṅge` là tên riêng, về `mānayeti` và về việc Pāli không có `ti` **được thay bằng đoạn này**.

  **Lỗi đã sửa (cả 9 khoá được rà, 6 khoá đổi).**
  - `ja67:1.1`: `Ucchaṅge` là **định vị cách** của `ucchaṅga` (*trong lòng*), đi với `me putto` (*con trai của tôi*) — không phải tên riêng được gọi. Bản cũ *“Ucchaṅga ơi, bạch Đại vương, con trai của tôi”* bịa ra một người nghe tên Ucchaṅga. Tiền lệ: `ucchaṅge` là *trong lòng* ở `ja547:567`, `thi-ap25:35.2`, `ja542:66.2`; tên bài Jātaka lấy từ chữ đầu kệ được dịch nghĩa ở `ja62`, `ja61`, `ja64`. Nay: *“Con trai ở trong lòng tôi, tâu đại vương,*. Xưng hô `deva` theo đa số tầng Jātaka: *tâu đại vương* 281 chỗ, *tâu bệ hạ* 9, *bạch Đại vương* chỉ 2 (đều là bài này và một chỗ khác), nên đổi sang đa số.
  - `ja67:1.2`: bản cũ *“chạy về phía chồng tôi trên đường”* biến `pati` thành đích đến của đứa con, không có trong Pāli. Nay: *chồng ở trên đường khi tôi chạy;* — `pathe` (trên đường) và `dhāvantiyā` (của/đối với tôi đang chạy) giữ đúng hai thành tố.
  - `ja67:1.3`: *còn nơi ấy tôi không thấy,* — `tañca desaṁ`: `ca` ở đây là chỗ chuyển đối lập (*còn*), bản cũ dịch *cũng* làm câu mất ý đối chiếu với hai vế trên.
  - `ja67:1.4`: **lỗi nặng nhất.** `mānayeti` là chỗ nối âm của `ānaye` + `ti` (kết thúc lời nói), không phải `mānaya`. `ānaye` là cách ước định ngôi một số ít của `āneti` (*mang về, đưa đến*) với chủ ngữ ngầm là **người nói**: *nơi tôi có thể mang về một người anh em ruột.* Bản cũ *“để em tôi mang người anh em về”* đặt một chủ thể thứ ba (*em tôi*) không có trong Pāli. Bản Anh đã ghim đọc đúng như vậy (*from where I can fetch a brother*). `sodariya` → *anh em ruột* theo `ja543:125.2` (*anh em ruột của ta*) và `mn93:15.2` (*anh em cùng mẹ*); thêm *ruột* để giữ ý *cùng một bụng*.
  - `ja67:0.4` và `ja67:2.1`: `Ucchaṅgajātaka` là *Jātaka Trong Lòng* (tên lấy từ chữ đầu kệ), nên dịch nghĩa như `ja62` (*Từ Hồi Còn Trong Trứng*), thay vì giữ Pāli như thể tên người. Đổi *Kinh Ucchaṅgajātaka* → *Kinh Trong Lòng*; dòng niết *Kinh Trong Lòng thứ bảy.* (không dấu phẩy theo đa số). Tiêu đề trong metadata đổi theo.

  **Ngoặc kép.** Pāli `1.1` mở `“` mà không có `”` ở đâu; `ti` ở `1.4` chính là dấu đóng lời nói. Giữ `”` ở `1.4` như `ja115:1.4` (Pāli tương tự không có dấu, bản Việt đóng), và ghi lại đây là chủ ý: số `“` / `”` ở Việt (1/1) không khớp Pāli (1/0) chỉ ở khoá này.

  **Điểm đổi, từ → sang.** `semantic_fidelity` 8.6 → 8.8 (ba khoá sai chủ thể hoặc đích đến đã sửa; vẫn còn bất định, xem dưới). `grammar_logic` 8.4 → 8.8 (người nói, đối tượng, mệnh đề quan hệ của `yato … ānaye` đã đúng). `terminology` 9.0 → 9.1 (`deva`, `ucchaṅge`, `sodariya` khớp đa số, đo được). `triangulation` 7.8 → 8.0 (bản Anh đối chiếu từng vế, kể cả `ānaye`; không nâng cao hơn vì vẫn không có bản Việt hiện hành và không có bản Anh thứ hai). Giữ nguyên: `source_provenance` 9.4, `segment_alignment` 10.0, `vietnamese_clarity` 8.8 (câu nay đúng nhưng vẫn rút gọn, hai vế đầu không có động từ như Pāli), `han_viet_balance` 9.2, `ambiguity_integrity` 8.0, `technical_integrity` 9.6.

  **Bất định còn lại (không đổi `ambiguity_integrity`).** (1) `dhāvantiyā` ở `1.2` là phân từ hiện tại giống cái; tôi đọc là *tôi đang chạy* (người nói), song bản Anh đọc *while walking the street* và có thể hiểu `pati` là *chồng* của người đang đi — đối chiếu parallel không có (không có đoạn nào khác dùng `dhāvantiyā pati`), nên không phân xử được hơn thế. (2) Pāli bỏ hệ từ và bỏ từ nối giữa `1.1`–`1.2`; bản Anh thêm *or*. Bản Việt không thêm từ nối, chỉ ngắt bằng dấu phẩy: ý *con trai và chồng đều có thể có lại, còn anh em ruột thì không* nằm ở ngữ cảnh truyện, không nằm trong chữ Pāli của kệ, nên không đưa vào lời kinh.

  **Kỹ thuật.** Đã rà đủ 9/9 khoá, đúng segment ID, NFC, không Pāli lọt sang Việt, không dấu lược nào, không số Pāli, không cặp Pāli trùng nguyên văn trong bài (phép kiểm rỗng). Vì không chạy được `npm run validate` · `npm test` · `npm run check` · `npm run build` trong lượt này, `technical_integrity` giữ 9.6, không tuyên bố technical gate đã pass.

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 6/9 khoá chênh lệch lớn nhất → khác nghĩa 0: sửa 0, giữ 6 (`0.4` và `2.1`: bản mù giữ `Ucchaṅga` như tên riêng trong tên bài, chỉ khác cách đặt tên tiêu đề, bản dự án theo tiền lệ dịch nghĩa tên bài đã nêu ở trên; `1.1`: bản mù cũng đọc `Ucchaṅge` là *nằm trong lòng*, trùng; `1.3`–`1.4`: bản mù cũng đọc `sodariya` là anh em cùng bụng mẹ và `yato … ānaye` là *từ đó … có thể đem về*, trùng; chỗ khác chỉ ở xưng hô nữ *thiếp* và diễn đạt), bất định 1 (`1.2` `dhāvantiyā`: bản mù cũng ghi không chắc, trùng bất định đã nêu ở trên). Lượt này không đối chiếu thêm bản Anh hay bản Việt nào; phần đối chiếu bản Anh của lượt 2026-10-13 ở trên không được lặp lại hay tính thêm. Điểm không đổi so với trước lượt này.

  **Lượt rà soát 2026-10-15** (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đối chiếu bản Anh Sujato đã ghim; không có bản Việt nguyên bài, không có đoạn song song): sửa 2 khoá — `1.1`, `1.2`: câu danh từ Pāli (`Ucchaṅge … me putto`, `pathe dhāvantiyā pati`) hàm ý *sẵn có, dễ có* (con thì ở ngay trong lòng, chồng thì gặp được trên đường), đối lập với `1.3`–`1.4` (anh em ruột thì không tìm được); bản cũ *“Con trai ở trong lòng tôi” / “chồng ở trên đường khi tôi chạy”* đọc như mô tả vị trí, làm mờ phép đối. Nay *“Con trai thì có trong lòng tôi” / “chồng thì có trên đường khi tôi chạy”* — chữ *có* là hệ từ ngầm của câu danh từ, không thêm ý. Phân xử bất định `dhāvantiyā` đã ghi trước: phân từ hiện tại giống cái, sở hữu/tặng cách số ít, hợp với `me` (người nói là phụ nữ) — nên *khi tôi chạy* là cách đọc ngữ pháp bắt buộc; bản Anh *while walking the street* cũng quy về người nói, không mâu thuẫn. Giữ: `1.3` *còn* (phép đối với hai vế trên), `1.4` *anh em ruột*. Không còn bất định trọng yếu.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
