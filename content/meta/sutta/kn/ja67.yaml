notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ dưới 40 ký tự). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép mở ở `1.1` và đóng ở `:2.1` (hoặc `1.4`), nên cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Jātaka` giữ nguyên (129 chỗ). `Ekakanipāta` → *Bộ Một Bài Kinh*. Dòng niết `<X>jātakaṁ <số>` → *Kinh <X> thứ <số>.* theo đa số trên đĩa (71 chỗ không dấu phẩy so với 24 có). Tên riêng giữ nguyên dạng Pāli ở cả `:0.4` và dòng niết — cùng cách *Kinh Paṇṇikajātaka*, *Kinh Udañcanījātaka*, *Kinh Sālittakajātaka*, *Kinh Parosata* đã có.

  **Ngoặc kép ở khoá cuối.** Pāli `ja67:1.4` là `Yato sodariyamānayeti.` — mở `“` ở `1.1` mà **không** có `”ti` đóng. Tôi đóng `”` ở `1.4` (không có `ti`, vì Pāli không có), đúng cách `ja115:1.4` đã làm cho đúng trường hợp này. Các bài Jātaka còn lại trong lát có `”ti` ở vế cuối nên tôi giữ `”ti`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có 26 chương Pháp Cú), nên `triangulation` là Pāli + English Sujato.
  **Đây là bài tôi hạ điểm nhiều nhất trong lát, và lý do là một bất định thật chưa phân xử được.** `Ucchaṅge deva me putto, / Pathe dhāvantiyā pati;` — hai chữ đầu là hai tầng xưng hô cùng lúc: `Ucchaṅge` (theo cách đọc của tôi: tên riêng, người nói gọi) và `deva` (theo cách đọc của tôi: *bạch Đại vương*). Sujato thì **bỏ mất `Ucchaṅge`** và đọc cả khối thành *A son in my lap, Your Majesty, / or a husband while walking the street* — tức lấy `devā` làm xưng hô, không có đại từ xưng hô nào cả. Hai cách đọc dẫn tới hai nghĩa khác nhau cho cả bốn vế: của tôi là *con trai tôi chạy về phía chồng tôi trên đường*; của Sujato là *con tôi nằm trong lòng, hoặc chồng tôi khi đi đường*. Tôi **chọn cách giữ được toàn bộ đơn vị nghĩa của Pāli** (không xóa `Ucchaṅge`, không thay `pati` bằng *chồng* một cách tự do), và ghi rõ ở đây thay vì làm cho câu Việt chắc chắn hơn mức Pāli cho phép. Đây là lý do `ambiguity_integrity` = 8.0 và `triangulation` = 7.8.

  **Tôi đã dò parallel trong corpus đã ghim trước khi kết luận:** `sodariyamānayeti`, `Ucchaṅga` — không có đạo văn song song nào (chỉ có `ja306`, `tha-ap419` dùng `Ucchaṅga` làm tên khác, không liên quan câu chuyện). Vì vậy không có cách nào phân xử từ nguồn nội bộ; đây là **bất định chưa phân xử được**, và tôi nói thẳng là chưa phân xử được chứ không giả vờ đã xử.

  **Vế `1.3`–`1.4` tôi giữ mệnh đề quan hệ đúng sắc:** `Tañca desaṁ na passāmi` (*tôi cũng không thấy chỗ ấy*) và `Yato sodariyamānayeti` (*từ đâu để em tôi mang người anh em về*). `ca` trong `Tañca` là *cũng*, không phải *và*; `sodariya` là **anh em** (giới tính trung tính, không phải *anh*), nên tôi dùng *người anh em* chứ không *anh em*.

  **Thuật ngữ đặt mới, kèm số tiền lệ.** `Itthivagga` → *Phẩm Phụ Nữ* (5 chỗ: `ja61`–`ja65`). `Ucchaṅgajātaka` (**0 tiền lệ**) → giữ Pāli trong tiêu đề, vì `Ucchaṅga` là tên nhân vật của truyện chứ không phải loài vật hay khái niệm. `dhāvantiyā` → *chạy về phía*; `pati` → *chồng*; `sodariya` → *người anh em*; `mānayeti` → *mang về*; `passāmi` → *thấy*.
