  **6 khoá có Pāli trùng nguyên văn ở bài khác; 5 cặp dùng lại NGUYÊN VĂN.** `0.1` trùng 15 file cho `Petavatthu` (15/17 giữ Pāli) · `0.2` trùng byte-for-byte `pv29:0.2` (*Cūḷavagga* — cùng phẩm Tiểu phẩm, đây là tiền lệ đúng nhất; 8 file khác lại ghi *Đại Phẩm*, tức *Mahāvagga*, **sai** với `Cūḷavagga`) · `4.3` trùng byte-for-byte `pv43:3.3` · `8.1` trùng byte-for-byte `pv3:3.1` · `8.2` trùng byte-for-byte `pv3:3.2`.
  **Khoá trùng Pāli nhưng bị loại có lý do:** `1.3` trùng `ja355:1.3` (*Còn mặt ngươi lại tươi tỉnh rạng ngời*) nhưng đó là câu kệ của Jātaka khác; tôi dịch lại theo glossary `pasanna` → *thanh tịnh*, thành *Mặt ngươi sáng trong thanh tịnh*.
  **Tên tầng đo:** `0.1` → *Petavatthu* (15/17) · `0.2` → *Cūḷavagga* theo `pv28`/`pv29` cùng phẩm · `0.3` mẫu *N. Chuyện Ngạ Quỷ <mô tả>* như pv28/pv41/pv43. **`Kūṭavinicchayika` có 0 tiền lệ trong toàn bộ repo** (`grep` không ra tệp nào), nên tôi dịch nghĩa chữ là *Dứt Mối Rối* và ghi rõ ở đây để người gộp lát thống nhất; `piṭṭhimaṁsiko` → *kẻ ăn thịt người*, khớp với tiền lệ *Chuyện Ngạ Quỷ Ăn Dơ* của pv43/pv44.
  **Mốc người kể chuyện đã kiểm chứng:** `8.1` `nārada` là tên riêng của người thợ săn, không phải thán từ cảm thánh — vì `pv3:3.1` (trùng nguyên văn) cũng gọi người thợ săn bằng *Nārada*, và `pv3` dùng cấu trúc khung y hệt. Vì vậy `8.1` dùng lại nguyên văn `pv3:3.1`.
  **Bất định đã ghi:** (1) `5.2` `jīvaloke acārisaṁ` — `acārisaṁ` là *vô tội*, câu này mang tính mỉa mai (không tội mà vẫn chịu khổ); tôi dịch *không hề có tội lỗi*, giữ nghĩa chữ chứ không chú thích mỉa mai vào thân kinh. (2) `3.2` `lomahaṁsanarūpavā` — *có hình dáng lông tơ và da thịt*; cũng có thể là *có dáng vẻ như lông tơ và thịt*. (3) `6.1` `parisaṁ` — tôi dịch *chỗ tụ họp*; có thể là *đại hội đường*.
  **Lỗi bắt được ở lượt review đối kháng, đã sửa:** `6.3` `Atthaṁ dhammaṁ nirākatvā` bản nháp gộp thành *ý nghĩa của chánh pháp*, làm mất hai vế của Pāli; đã tách thành *ta trình bày ý nghĩa, phổ biến chánh pháp*.
