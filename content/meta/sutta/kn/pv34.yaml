  Bài kệ ngắn: mẫu số coverage bằng 0 theo công thức `source/layers.yaml` (≥ 40 ký tự, loại block `:0`); đã tự quét MỌI khoá từ đĩa. Không có tệp Anh Sujato trong `source/upstream-manifest.json` (tầng `english-sujato` 4.291 tệp) cho uid này — `not-published-upstream`, không phải `not-synced`. Tầng `vietnamese-current` vắng (26 tệp, toàn bộ Pháp Cú), `english-project` không có ⇒ dịch chỉ từ Pāli root ⇒ blocker thật; `triangulation` bị chặn ở 7.4.
  **6 khoá có Pāli trùng nguyên văn ở bài khác; 5 cặp dùng lại NGUYÊN VĂN.** `0.1` trùng 15 file cho `Petavatthu` (15/17 giữ Pāli) · `0.2` trùng byte-for-byte `pv29:0.2` (*Cūḷavagga* — cùng phẩm Tiểu phẩm, đây là tiền lệ đúng nhất; 8 file khác lại ghi *Đại Phẩm*, tức *Mahāvagga*, **sai** với `Cūḷavagga`) · `4.3` trùng byte-for-byte `pv43:3.3` · `8.1` trùng byte-for-byte `pv3:3.1` · `8.2` trùng byte-for-byte `pv3:3.2`.
  **Khoá trùng Pāli nhưng bị loại có lý do:** `1.3` trùng `ja355:1.3` (*Còn mặt ngươi lại tươi tỉnh rạng ngời*) nhưng đó là câu kệ của Jātaka khác; tôi dịch lại theo glossary `pasanna` → *thanh tịnh*, thành *Mặt ngươi sáng trong thanh tịnh*.
  **Tên tầng đo:** `0.1` → *Petavatthu* (15/17) · `0.2` → *Cūḷavagga* theo `pv28`/`pv29` cùng phẩm · `0.3` mẫu *N. Chuyện Ngạ Quỷ <mô tả>* như pv28/pv41/pv43. **`Kūṭavinicchayika` có 0 tiền lệ trong toàn bộ repo** (`grep` không ra tệp nào), nên tôi dịch nghĩa chữ là *Dứt Mối Rối* và ghi rõ ở đây để người gộp lát thống nhất; `piṭṭhimaṁsiko` → *kẻ ăn thịt người*, khớp với tiền lệ *Chuyện Ngạ Quỷ Ăn Dơ* của pv43/pv44.
  **Mốc người kể chuyện đã kiểm chứng:** `8.1` `nārada` là tên riêng của người thợ săn, không phải thán từ cảm thánh — vì `pv3:3.1` (trùng nguyên văn) cũng gọi người thợ săn bằng *Nārada*, và `pv3` dùng cấu trúc khung y hệt. Vì vậy `8.1` dùng lại nguyên văn `pv3:3.1`.
  **Bất định đã ghi:** (1) `5.2` `jīvaloke acārisaṁ` — `acārisaṁ` là *vô tội*, câu này mang tính mỉa mai (không tội mà vẫn chịu khổ); tôi dịch *không hề có tội lỗi*, giữ nghĩa chữ chứ không chú thích mỉa mai vào thân kinh. (2) `3.2` `lomahaṁsanarūpavā` — *có hình dáng lông tơ và da thịt*; cũng có thể là *có dáng vẻ như lông tơ và thịt*. (3) `6.1` `parisaṁ` — tôi dịch *chỗ tụ họp*; có thể là *đại hội đường*.
  **Lỗi bắt được ở lượt review đối kháng, đã sửa:** `6.3` `Atthaṁ dhammaṁ nirākatvā` bản nháp gộp thành *ý nghĩa của chánh pháp*, làm mất hai vế của Pāli; đã tách thành *ta trình bày ý nghĩa, phổ biến chánh pháp*.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.
  **Kiểm toán độc lập 2026-10-11** (đọc đối kháng từng khoá với Pāli; bài không có tầng tham khảo nào nên Pāli đứng một mình). Mục này THAY THẾ các mục cũ ở trên về: nghĩa của `acārisaṁ`, vai `nārada`, tên bài `Kūṭavinicchayika`, `piṭṭhimaṁsiko`, `6.3`, và toàn bộ điểm số cũ 9.15 — các mục đó dựa trên bản dịch sai và không còn đúng.
  **Lỗi nghĩa thật đã sửa: 35/39 khoá đổi, trong đó khoảng 25 khoá là lỗi nghĩa.** (1) `1.1` bản cũ bịa "Ta là kẻ thợ săn, thân xám đen, lại ham muốn tình dục" — Pāli chỉ có `mālī kiriṭī kāyūrī` (đeo tràng hoa, đội mão, đeo vòng xuyến), người hỏi tả vẻ đẹp của ngạ quỷ. (2) Lẫn người nói/người nghe: `1.1`–`4.5` là Nārada hỏi ngạ quỷ ("ngài"); `5.1`–`8.4` là ngạ quỷ đáp ("tôi", gọi Nārada là "ngài"); bản cũ để "ta/ngươi" và ở `8.1` cho ngạ quỷ "thấy ở ngươi", đảo chủ thể. `tayā nārada sāmaṁ diṭṭhaṁ` = chính Nārada đã tự thấy. (3) `3.4`/`4.5` `sāmaṁ ukkacca khādasi` = "tự mình cắt ra mà ăn"; bản cũ bịa "cả sống lẫn chín". `3.3`/`4.4` = thịt lưng của chính mình. (4) `3.2` `lomahaṁsanarūpavā` = hình dạng làm rợn tóc gáy (tiền lệ pv38 "rợn tóc gáy"); bản cũ "hình dáng lông tơ và da thịt" là chữ vô nghĩa. (5) `4.2` `dukkaṭaṁ kataṁ` = điều ác đã làm; bản cũ "điều khổ xa" là chữ vô nghĩa. `4.1`–`4.3` nay theo đúng tiền lệ pv13/15/16/19/22. (6) `5.1`–`5.4`: `attano anatthāya` = vì tai hại cho chính mình; `acārisaṁ` là "đã hành xử" (động từ aorist của `carati`), KHÔNG phải "vô tội" như ghi chú cũ khẳng định; `pesuñña` = nói ly gián (tiền lệ 58 khoá, dn15 "nói ly gián"); `nikativañcanā` = gian trá, lừa gạt (an4.198, dn2). Bản cũ "đường đội dối trá", "vu khống và mang tiếng cho người khác" là chữ vô nghĩa và bịa. (7) `6.3`–`6.4` đảo ngược nghĩa: Pāli `atthaṁ dhammaṁ nirākatvā adhammamanuvattisaṁ` = đã gạt bỏ nghĩa lý và Chánh pháp, đã đi theo phi pháp; bản cũ "trình bày ý nghĩa, phổ biến chánh pháp, khuyên răn kẻ theo phi pháp" là nghĩa NGƯỢC. Ghi chú cũ "lỗi đã sửa ở 6.3" cũng sai theo hướng đó. `6.2` "thời khắc thật lý" là chữ vô nghĩa. (8) `7.1`–`7.4` `evaṁ so khādatattānaṁ` = kẻ ấy tự ăn mình (`khādati` + `attānaṁ`); bản cũ "trong số kẻ đã ăn thịt người" sai. (9) `piṭṭhimaṁsika` = kẻ nói xấu sau lưng (`7.2`, `8.4`), theo tiền lệ dn32 "nói xấu sau lưng" và ja511:32 (cùng cặp thành ngữ `yo piṭṭhimaṁsiko hoti` / `piṭṭhimaṁsāni attano`, nơi bản dịch cũng giữ "thịt lưng"); bản cũ "kẻ ăn thịt người" bịa nghĩa. (10) `8.3` `mā pesuṇaṁ mā ca musā abhāṇi` = chớ nói ly gián, chớ nói dối; bản cũ "đừng nói lời dối trá, đừng nói lời dối" lặp và mất `pesuṇa`. (11) Tên bài: `kūṭa` = gian dối (pv29 `kūṭavāṇijo`), `vinicchayika` = người làm việc phân xử (an9.23 `vinicchayo` "sự phân xử") ⇒ "Người Phân Xử Gian Dối"; "Dứt Mối Rối" là chữ vô nghĩa. `0.3` và `9.1` đổi theo; `translationTitle` đổi khớp.
  **Tiền lệ trùng nguyên văn: `0.1`, `0.2`, `4.3` giữ nguyên; `8.1`, `8.2` KHÔNG dùng lại pv3:3.1–3.2** vì bản pv3 cũng chứa chính các lỗi trên (người nói "ta"/"ngươi", `nārada` bị đọc như vai khác, `anukampakā ye kusalā vadeyyuṁ` bỏ `kusalā` và đổi thì). Lỗi ngoài lát, báo đừng sửa: `pv3:3.1`–`3.4` (cùng Pāli `tayidaṁ tayā nārada sāmaṁ diṭṭhaṁ` / `mā pesuṇaṁ mā ca musā abhāṇi`).
  **Chấm lại (nguyên bản cũ là điểm của một bản dịch có ~25 khoá sai nghĩa nên không còn đáng tin):** semantic_fidelity 9.2 → 8.8, grammar_logic 9.2 → 9.0, terminology 9.0 → 8.8, vietnamese_clarity 9.3 → 9.0, han_viet_balance 9.4 → 9.2, ambiguity_integrity 9.0 → 8.8, source_provenance 9.4, segment_alignment 10.0, triangulation 7.4 và technical_integrity 9.6 giữ nguyên. Điểm thấp hơn bản cũ dù bản dịch đúng hơn nhiều vì bản cũ tự chấm quá cao; bản mới chỉ dựa vào Pāli và tiền lệ nội bộ, không có đối chiếu độc lập.
  **Bất định còn lại (giữ trong notes, không thêm vào thân kinh):** (a) `6.3` `attha` — "nghĩa lý" (tiền lệ snp2.9:3.3 "Ý nghĩa, Chánh pháp"); trong bối cảnh phiên xử cũng có thể là "sự việc/lẽ phải". (b) `6.2` `saccakāle upaṭṭhite` — không có tiền lệ nào trong toàn tầng (0 khoá); dịch sát chữ "khi thời điểm của sự thật đã đến", chưa rõ có phải "lúc phải làm chứng". (c) `6.1` `parisaṁ` — "hội chúng", không dám dịch "toà án/hội đồng xét xử" vì chỉ do tên bài gợi. (d) `2.5` `kambukāyūradharā` — giữ tiền lệ "vòng xuyến vàng" (pv24:6.3, vv36:2.1) nhưng `kambu` có thể là vỏ ốc. (e) `8.4` `tuvaṁ` — giữ "ngài", hiểu là lời khuyên dành cho Nārada/người nghe. (f) Hai trường hợp `1.3` `pasanna`/`vaṇṇo` dịch "sắc mặt trong sáng": glossary cũ "thanh tịnh" bị bỏ vì thêm sắc thái. (g) Người hỏi gọi ngạ quỷ "ngài" và ngạ quỷ xưng "tôi" theo quy ước pv đã kiểm toán, chưa có bản Anh để đối chiếu.
  **Phép đo:** tập khoá 39/39 khớp Pāli; nháy kép `“”` khớp Pāli từng khoá (4 dấu: `1.1`, `4.5`, `5.1`, `8.4`); không có nháy đơn trong Pāli; `…` không xuất hiện ở Pāli lẫn Việt (phép lược chạy rỗng, mẫu số 0); cặp Pāli trùng nguyên văn trong chính bài: `3.3`/`4.4`/`7.4` và `3.4`/`4.5` (khác hoa-thường/dấu câu) đều Việt giống nhau; Pāli không lọt sang Việt ngoài tên riêng `Nārada` và tên phẩm/bộ ở `0.1`, `0.2`. Cổng kỹ thuật chưa chạy lại, `technical_integrity` giữ 9.6: npm run validate; npm test; npm run check; npm run build.
  **Lượt cải thiện 2026-10-11:** đọc đối kháng lại cả 39 cặp Pāli↔Việt; không tìm thấy lỗi nghĩa, đảo chủ thể, sai phủ định hay sai số (`dasa kaññāsahassāni` = 10 × 1.000 = *mười ngàn*; người hỏi Nārada gọi ngạ quỷ "ngài", ngạ quỷ xưng "tôi" đúng từ `1.1`–`4.5` và `5.1`–`8.4`). Đổi 3/39 khoá, đều là sửa thuật ngữ/văn phong theo tiền lệ đã đo, không đổi nghĩa. (1) `3.2` `lomahaṁsanarūpavā`: *làm rợn tóc gáy* → *khiến rợn tóc gáy*, theo cách dịch của cùng cụm `lomahaṁsanarūpā` ở ja530:17.3, cnd23:37.3, mnd15:11.3 (3/3 dùng *khiến*, 0 dùng *làm*). (2) `8.2` `anukampakā ye kusalā vadeyyuṁ`: *những bậc từ mẫn, thiện xảo hẳn sẽ nói* → *những ai có lòng thương xót, thiện xảo, sẽ nói rằng*; `anukampaka` dịch *thương xót / có lòng thương xót* ở đa số khoá có cụm này (22 khoá *thương xót* và 6 khoá *thương tưởng*, so với 2 khoá *từ mẫn*, trong 50 khoá có `anukampaka`), và chữ *bậc*, *hẳn* không có trong Pāli — `vadeyyuṁ` là cách chia khả năng, không phải khẳng định chắc chắn. (3) `8.1` `tayidaṁ tayā nārada sāmaṁ diṭṭhaṁ`: bỏ chữ *chính* (`tayā` chỉ chủ thể thấy, `sāmaṁ` đã là *tự mình*) và đưa về đúng nguyên văn pv3:3.1 *Điều này, Nārada, ngài đã tự mình thấy*; hai khoá `8.1`–`8.2` nay trùng nguyên văn bản Việt hiện có của pv3:3.1–3.2 (Pāli trùng chữ-đối-chữ). Mục kiểm toán trước ghi pv3 ở `3.1`–`3.4` còn lỗi, nhưng bản pv3 hiện tại ở `3.1`–`3.2` đã khớp nên có thể dùng lại; `3.3` thì pv3 dùng *lời hai lưỡi* còn bài này dùng *nói ly gián* (59 khoá *ly gián* so với 16 khoá *hai lưỡi* trong toàn tầng), nên không đồng nhất `8.3` theo pv3 — lỗi ngoài lát, báo, không sửa. Đã đo và giữ nguyên: *chiên-đàn*, *vòng xuyến vàng*, *vòng hoa vàng* (khớp pv17, pv24, ja546, vv36); *cõi sống* cho `jīvaloka` (đa số khoá); *Do quả báo của nghiệp nào* (16 khoá pv có cụm này, 15 viết hoa *Do*, 1 viết thường); *kẻ nói xấu sau lưng* khớp ja511:32.1; *phi pháp* / *Chánh pháp* trong `6.3`–`6.4` khớp ja529, ja534, mil3.4. **Điểm không đổi** (final_score 9.00 giữ nguyên): ba thay đổi trên là căn chỉnh thuật ngữ và văn phong, không gỡ bất định nào trong mục (a)–(g) ở trên nên `semantic_fidelity`, `terminology`, `ambiguity_integrity` không nâng; `triangulation` vẫn chặn ở 7.4 vì không có tầng tham khảo. Bất định mới ghi thêm: `6.3` `attha` có tiền lệ khác nhau — *nghĩa lý* (snp2.9:3.3 *Ý nghĩa*, ne37:48 *nghĩa*) so với *lợi ích* (ja515, 10 khoá cho cặp `atthañca dhammañca`); trong bối cảnh phiên xử vẫn chưa phân xử được, giữ *nghĩa lý*. Phép đo sau sửa: tập khoá 39/39 và thứ tự khớp Pāli; nháy `“”` khớp Pāli từng khoá (0 lệch); phép lược `…` chạy rỗng (Pāli 0, Việt 0); một nhóm Pāli trùng nguyên văn trong chính bài (`3.3`/`4.4`/`7.4`) và Việt giống nhau, chỉ khác dấu cuối khoá như Pāli; NFC đạt; không Pāli lọt sang Việt ngoài tên riêng. Cổng kỹ thuật chưa chạy lại, `technical_integrity` giữ 9.6: npm run validate; npm test; npm run check; npm run build.
