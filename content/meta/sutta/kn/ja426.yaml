notes: |-
  `Dīpijātaka` (số 10) trong `Kaccānivagga`, `Aṭṭhakanipāta`. 43/43 khoá. Ba tầng
  tham khảo đều vắng (xem `blocking_errors`) ⇒ `draft`, `triangulation` 7.6.

  **Tên phẩm:** `:0.1` giữ Pāli *“Jātaka”* — đo trên **416** tệp `ja` đã có `:0.1` trước khi ghi lát này:
  **400** giữ *Jātaka*, chỉ **16** dịch *Chuyện Tiền Thân*, nên đa số tuyệt đối và đúng luật “tha-ap
  giữ Pāli, thag giữ Pāli, ja giữ Pāli”; `:0.2` `Aṭṭhakanipāta` → *“Bộ Tám
  Bài Kệ”* theo đúng lớp `ja` (`ja417`/`ja418`/`ja419`/`ja420` = 4/4; khác `thag8`/`thig8` dùng *Bộ
  Tám Bài Kinh*); `:0.3` → *“Phẩm Kaccānivagga”* (6/6). `:0.4` `Dīpijātakaṁ dasamaṁ.` → *“Kinh
  Dīpijātaka, thứ mười.”* (đa số 27/40 cho `<X>jātakaṁ dasamaṁ`). `Aṭṭhakanipātaṁ niṭṭhitaṁ.` →
  *“Bộ Tám Bài Kệ đã hoàn tất.”* (6/6 tiền lệ `<X>kanipātaṁ niṭṭhitaṁ` dùng *đã hoàn tất*).

  **`naṅguṭṭha` ở bốn khoá (2.1, 3.3, 4.3, 5.3) — bất định thật, đã chọn và ghi.** Nghĩa gốc là
  **móng tay**, nhưng ở bốn khoá này nó chắc chắn là **đuôi** của con báo: `3.3` `Pacchato tuyhaṁ
  naṅguṭṭhaṁ` (“đuôi ngươi ở phía sau”), `4.3` `Tāvatā mayhaṁ naṅguṭṭhaṁ` (“đuôi ta dài đến
  tận đó”, so với `Yāvatā caturo dīpā`), `5.3` `Dīghaṁ duṭṭhassa naṅguṭṭhaṁ` (“đuôi kẻ ác rất
  dài”), và câu chuyện xác nhận. Nếu giữ “móng tay” thì bốn khoá mâu thuẫn nhau và vô nghĩa. Tôi dịch
  **đuôi** và ghi lại để người biên tập không tưởng là lỗi đọc từ điển.

  **`mātula` (1.2, 2.3) là cách xưng hô dịu dàng với người lớn tuổi** — ở đây người nghe là con
  báo, nên tôi dịch *“hỡi bác”* và *“gọi ta là ‘bác’”*. `eḷike`/`eḷakiyā` là **tên riêng** `Eḷikā`
  (danh xưng nàng dê trong truyện), giữ nguyên chữ Pāli theo quy ước tầng.

  **`Sājja mātulavādena` (2.3)**: `sājja` đọc là *chỉ vì / chẳng qua*; đây là dạng ở bản in Thái,
  tôi dịch *“Chỉ vì gọi ta là ‘bác’”* theo nghĩa và theo Sujato (*by saying ‘uncle’*), **không**
  tự chế thêm nghĩa nào.

  **`Yāvatā caturo dīpā` (4.1)**: `dīpa` ở đây là **châu lục / đảo**, không phải “ngọn đèn” — ngữ
  cảnh (bốn châu lục, có biển bao quanh, núi non trải rộng) và cách đối chiếu Sujato (*four great
  continents with seas and mountains*) cùng xác nhận. Tôi dịch *“Từ bốn châu lục lớn,”*.

  **`Neva duṭṭhe nayo atthi` (8.1)**: `naya` đọc là *nơi nương tựa / chỗ dựa*; Sujato dịch theo
  hướng khác (*Conduct, nor right, nor courtesy*) nên tôi **không** theo Sujato ở câu này.

  **`mukhamāgatā` (3.2) số ít nữ** là bằng chứng người nói là nàng dê `Eḷikā`, còn `nasatthā`
  không; tôi dùng đúng số ít nữ (*ta*) cho lời của dê và số ít nam (*ngươi*) cho lời báo.

  **Cốt truyện: KHÔNG suy đoán, đã tra.** `ja426` không có bản Anh đã ghim, nên tôi tra
  `ancient-buddhist-texts.net` (dựng lại *Jātaka-aṭṭhakathā*, trang Ja 426) để xác định ai nói với
  ai: dê cái `Eḷikā` nịnh bợ con báo `dīpaka` để giữ mạng, bị nó bắt và ăn thịt; kệ 7–8 là lời
  Đức Phật sau khi Giác ngộ. Đây là **nguồn tra cứu bên ngoài tầng đã ghim**, đã khai ở đây và
  chỉ dùng để xác định **vai trò người nói**, không chép bất kỳ câu văn xuôi nào vào thân kinh.
  `source_provenance` bị hạ xuống 9.2 vì lý do đó.

  **Uddāna 12.1–12.4 không khớp với tiêu đề `ja417`–`ja426`** (Pāli liệt kê `Parisuddhā`,
  `Manāvilā`, `Vatthadharā`… trong khi tiêu đề là `Kaccāni`, `Aṭṭhasadda`, `Sulasā`…). Đây là đặc
  thù của bản in, **không phải lỗi của tôi**, và tôi **không** sửa: dịch đúng những gì Pāli viết,
  giữ các danh từ riêng nguyên dạng Pāli. `daseḷakinā` tôi giữ là danh từ riêng thay vì đoán
  nghĩa (`dase` = mười, `siṅha` = sư tử).

  **Dấu lược:** bài này không có `…pe…`. `7.7` và `8.5` không có dấu lược; nhưng bản Pāli có
  **7 cặp** `“`/`”` cân bằng (mỗi kệ một cặp) — tôi giữ đúng số ngoặc kép theo từng khoá, và
  `save_vi` đã kiểm cân trên cả bài.
