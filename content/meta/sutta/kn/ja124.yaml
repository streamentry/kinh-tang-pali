notes: |-
  Đã đọc hết Pāli qua v4/p4.txt. Tại commit đã ghim không có tệp Anh Sujato cho bài này (0/9 khoá) và tầng Việt hiện hành chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu — bản dịch đứng hoàn toàn trên Pāli root. Mọi segment Pāli đều dưới 40 ký tự nên không có segment nội dung theo ngưỡng coverage.
  Tiền lệ (đếm trong tầng Việt dự án): khung tiêu đề như ja1; purisa → Người; paṇḍita → bậc trí; nibbindati → chán nản theo dn25; vāyāma → tinh cần (521); phala → quả theo quả của sự (15); amba → xoài (95); eva nhấn mạnh ở 1.1 không dịch thành chữ riêng vì tiếng Việt đã có hãy; colophon Kinh ... thứ tư không phẩy.
  Bất định đã ghi, không giấu: 1.4 anītihaṁ là từ hiếm (a + īti là tai ương, trạng thái không gặp tai ương) nên dịch xoài được ăn mà không gặp tai ương và hạ ambiguity; không suy thêm chuyện cây xoài vì Pāli chỉ nói quả đã được ăn.
  Triangulation 7.5 vì chỉ có Pāli root, không có bản Anh hay bản Việt nào để đối chiếu.
