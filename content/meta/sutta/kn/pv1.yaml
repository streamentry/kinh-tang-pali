notes: |-
  **Bài.** `pv1` — mở đầu `Phẩm Rắn` trong `Petavatthu`, thứ nhất. Bài có 17 khoá Pā li;
  bản dịch phủ **17/17**. Khoá `1.1` (lời kính) đã có sẵn trên đĩa và tôi giữ nguyên vì khớp
  đa số tầng.

  **Năm phép kiếm, số do script in ra (`_n33_checks.py`), không chép tay.**
  (1) `set(khoá Việt) == set(khoá Pāli)`: thiếu **0**, thừa **0**.
  (2) ngoặc kép `“”` và nháy đơn `‘’` so **từng khoá**: 17 khoá đã so, lệch **0**; cân cả bài
  ngoặc kép Pā li 1 / Việt 1, nháy đơn Pā li 0 / Việt 0.
  (3) Pā li trùng nguyên văn **trong chính bài**: **0** cặp, nên 0 cặp Việt khác.
  (4) dấu lược: 17 khoá đã so, lệch **0**; Pā li có **0** `…pe…` và **0** `…` trần, Việt cũng 0.
  (5) chỉ mục Pā li→Việt toàn tầng: **5** cặp Pā li trùng nguyên văn đã dò, dùng lại nguyên văn
  **3** khoá (`0.1`, `0.2`, `1.1`), **2** khoá cố ý khác — xem mục dưới.

  **Tra tiền lệ kèm đếm.** `Petavatthu` → *Petavatthu* **27/27**. `Uragavagga` → *Phẩm Rắn*
  **8/8** (`pv2`, `pv3`, `pv4`, `pv6`, `pv7`, `pv8`, `pv9`, `pv12`). `Namo tassa Bhagavato
  Arahato Sammāsambuddhassa.` → *Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác.*
  **9/11** (11 chỗ có cùng Pā li; ngoại lệ *Đức Thế Tôn* 1, *Kính lạ …!* 1) — khoá `1.1` sẵn có
  đúng dạng đa số nên tôi giữ. Số thứ tự ở `0.3`: trong `pv` đo được **27 giữ : 0 bỏ** (Pā li có
  số mà bản Việt không có số: 0), nên `0.3` giữ `1.`.

  **Hai khoá cố ý KHÁC tiền lệ, và vì sao.**
  1. `4.3 Saggañca kamatiṭṭhānaṁ,` — tiền lệ duy nhất `an4.60:4.5` dịch *họ đi đến chỗ ở trên
     trời,*. Chữ *họ* ở đó là chủ ngữ số nhiều do chính ngữ cảnh `an4.60` đòi hỏi (phiên bản
     nói về chư thiên và người), còn Pā li ở `pv1` **không có chủ ngữ nào** — vay *họ* vào là
     thêm từ không có nguồn. Tôi dịch *và đi đến chỗ ở trên trời,*, giữ vế `Saggañca`.
  2. `4.4 Kammaṁ katvāna bhaddakan”ti.` — `an4.60:4.6` bỏ dấu `ti` (ra *…lành.”*). Tôi **giữ**
     `”ti.` vì đo ở phạm vi gần nhất cho `pv`: Pā li kết `”ti.`/`’ti.` thì **giữ 57 : bỏ 8**, và
     `pv2:3.4`, `pv3:3.4`, `pv4:4.4` — ba bài ngay cạnh — đều giữ. `an4` là bộ khác nên không
     lấy làm chuẩn.

  **Ngôi kể.** `2.1`–`3.2` là lời dạy nói với người xin (`kasi` mệnh lệnh số 2 → *Ngươi làm…*,
  `petānaṁ dāyakassa ca` → *của người đã chết và của người cho*). `3.3`–`3.4` chuyển sang ngôi
  3 (`petā paribhuñjanti`, `dātā`), nên tôi viết *Người đã chết hưởng thụ…* và *người cho* chứ
  không kéo ngôi 2 vào. `4.1`–`4.4` Pā li không có chủ ngữ, tôi cũng để vô chủ ngữ.

  **Bất định đã ghi nhận.** `et'to nibbattate phalaṁ` (`2.4`) — `tto` là hậu tố của `etaṁ`, tôi
  dịch *từ đó có quả báo trổ ra.* và **không** dịch thành *hạt giống ấy*; tiền lệ `ja380:1.4`
  `ekaṁ nibbattate phalaṁ.` chưa được dịch nên không có mẫu đối chiếu (0). `khettūpamā` tôi
  dịch *ví như ruộng* theo đúng nghĩa phẩn vị, không theo nghĩa loại.

  **Coverage tầng Anh.** Mẫu số (Pā li ≥ 40 ký tự, bỏ `:0`) = **1** khoá (`1.1`); Sujato phủ
  **0/1**, và ba tầng tham khảo đều **không có**: Sujato 0 tệp (tầng `kn` của Sujato ở commit đã
  ghim không có `pv`), `english-project` 0 tệp, `translation/vi/phantuananh/` chỉ 26 tệp Pháp
  Cú. Mất mát này **đã được ghi nhận** trong `content/meta/reference-gaps.yaml` (`uid: pv1`,
  coverage 0), nên nó là giới hạn đã thừa nhận chứ không phải lỗ hổng bị bỏ qua. `triangulation`
  8,4 vì lý do đó.

  **Cổng kỹ thuật chưa chạy.** Bị cấm `git`/`gh` và `npm run validate|test|check|build`, nên tôi
  không tuyên bố technical gate pass. Bốn lệnh còn lại: `npm run validate`, `npm test`,
  `npm run check`, `npm run build`. Phần tự kiểm được: JSON hợp lệ, NFC, thứ tự khoá y hệt Pā li,
