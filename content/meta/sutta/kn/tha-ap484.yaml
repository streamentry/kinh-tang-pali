notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này (xem blocker). Đối chiếu duy nhất là tiền lệ trong tầng `vi/project` của phẩm `tha-ap`.
  Số: `Catunnavutito` (`:15.1`) = catu 4 + navuti 90 = 94, dịch “chín mươi tư” (cùng cấu tạo với 106 khoá cùng Pāli trong phẩm, 50 khoá dùng đúng câu “Vào chín mươi tư kiếp trước đây,”). `Diyaḍḍhayojane` (`:14.1`) = một do-tuần rưỡi. `tiṇṇaṁ vedāna` (`:1.2`) = ba Veda; `Paṭisambhidā catasso` (`:18.1`) = bốn vô ngại giải. Bài không có cụm `Tiṁsakappasahassa`, nên điểm bất định về `tiṁsa` (30 theo đo tầng) không phát sinh ở đây.
  Pāli trùng nguyên văn với phẩm: 26 khoá có tiền lệ trong tầng, 24 khoá dùng lại nguyên văn, 2 khoá (`:1.3`, `:1.4`) khác. `:1.3` chỉ khác viết hoa đầu câu (mỗi khổ kệ trong bài mở đầu dòng thứ ba bằng chữ hoa theo Pāli). `:1.4` cố ý khác tiền lệ duy nhất (tha-ap128: “và cả Sanighaṇḍusakeṭubha”): `sanighaṇḍusakeṭubhe` là hai danh từ có tiền tố `sa-` (cùng với Nighaṇḍu và Keṭubha), nên tách ra thay vì giữ một chuỗi như một tên riêng. `:0.1` `Therāpadāna` 433/444; `:0.2` `Paṁsukūlavagga` → “Phẩm Y Phấn Tảo” 2/2 (tha-ap483, tha-ap488); `:2.1` dùng lại tha-ap421:9.1; `:3.3` dùng lại tha-ap471:2.1; `:5.2` “bậc Toàn Tri, Đạo sư của thế gian” 3/4 khoá trùng Pāli (nhóm còn lại “bậc Toàn Tri, bậc Dẫn Đạo thế gian” 1 khoá), và `lokanāyaka` được dịch “Đạo sư của thế gian” nhất quán ở `:5.2`, `:6.4`, `:8.4`; `:14.3` 2/2, `:14.4` “ngay tại nơi ấy tôi đã mệnh chung.” 9/14; `:15.2` “khi ta có được niệm tưởng ấy;” 7/17; `:15.3` “Ta không biết mình rơi vào khổ đau,” 134/382 (nhóm lớn kế tiếp: “Tôi không còn biết đến đọa xứ nào” 80, “khổ xứ” 51 — giữ đa số và khớp tha-ap483 liền kề, dù `duggati` sát nghĩa hơn là “đọa xứ”); `:15.4` 6/10; `:16`–`:18` công thức chung theo đa số (80/116, 81/116, 74/112, 87/113, 431/444, 404/443); `:19.1` 3/3 theo nhóm 407 khoá “những bài kệ này” (nhóm số ít 21 khoá không dùng).
  Trong chính bài: Pāli trùng nguyên văn 1 nhóm (`:16.2`, `:17.2`, `:18.2`, đều `…pe…` → `…`, Việt giống nhau). Hai cặp chỉ khác dấu nháy (`:5.1`/`:10.1`, `:17.3`/`:18.3`) được dịch cùng câu và khác nhau đúng ở dấu nháy Pāli.
  `:1.1`–`:1.2` Pāli trùng 3 tệp (tha-ap7, tha-ap123, tha-ap129): hai tệp dịch `tiṇṇaṁ vedāna` là “ba thọ” (nhầm `veda` với `vedanā`) và `mantadhara` là “thuộc điều đã ghi nhớ”; bài này dùng cách của tha-ap129 (“Người tụng đọc, người thuộc lòng những bài tụng, / thông thạo ba Veda, bậc đã đi đến bờ bên kia”), cố ý lệch 2 tiền lệ, vì Veda là “ba bộ Veda”, không phải thọ. Phiên âm Veda: “Veda” 94 lần so với “Vệ Đà” + “Vệ-đà” khoảng 30 lần trong tầng.
  Nhịp nháy: Pāli mở “ ở `:1.1`, mở ‘ ở `:5.1`, đóng ’ ở `:6.4` và đóng ” ở `:18.3`; bản Việt khớp Pāli từng khoá (4/4 khoá có nháy; 74/74 khoá không lệch).
  Tên: `:0.3` và `translationTitle` bằng nhau, Pāli `:0.3` không bắt đầu bằng số nên không có số thứ tự. Dạng tên theo phạm vi gần nhất (tha-ap470–499): “Tuyên Ngợ” 11 tệp, “Ký Sự” 6, “Tuyên Ngôn” 0; toàn tầng `tha-ap`: “Tuyên Ngợ” 244, “Tuyên Ngôn” 97, “Ký Sự” 96. Theo đa số ở cả hai phạm vi giữ “Bài Kệ Tuyên Ngợ Về Trưởng Lão” (khớp tha-ap480–488); nếu người biên tập chốt “Tuyên Ngôn” hoặc “Ký Sự” cho cả cuốn thì đổi một lượt. `Buddhasaññaka` giữ nguyên tên Pāli như 3/3 tiền lệ (tha-ap75, tha-ap119, tha-ap311). Câu kết `:20.1` “, thứ hai.” theo 90/100 tiền lệ (so với “thứ nhì” 10).
  Bất định: (1) `:10.2` `cakkhuṁ lacchāma no bhavaṁ`: `no bhavaṁ` không phân xử được trong tầng; dịch “thưa các vị” theo cách `no bhavaṁ` là lời xưng hô trong các câu khác (ja498, ja509, ja541) nhưng ở đây số ít `bhavaṁ` đi với “chúng ta” nên có thể là cách đọc khác. (2) `:6.1` `Adhiccuppattikā` dịch “thỉnh thoảng mới xuất hiện” (nghĩa gốc `adhicca` là tình cờ/có lúc); “hiếm khi xuất hiện” và “ngẫu nhiên xuất hiện” là hai cách đọc gần. (3) `:12.3` `Āsattidosarahitā` đọc là “lìa lỗi của sự dính mắc”; cũng có thể đọc dosa là sân (lìa sự dính mắc và sân). (4) `:3.4` `pavattayi` dịch “chuyển vận” (cho ánh sáng trí tuệ); `:11.2` `kharājinanivāsino` dịch “mặc da thú thô”; `:13.3` `Uñchāya` dịch “lượm lặt” theo snp5.1:2.4. (5) `:6.3` `passeyyaṁ` dịch “đi gặp”, “đi” được thêm vì ngữ nghĩa của `yannūna` (muốn đi thấy), chủ thể lời trích `:5.1`–`:6.4` là một đệ tử. (6) `:12.1` `Yugamattaṁ` dịch “một tầm cày” theo snp3.1:6.4 (“một tầm cày”) và mn91:10.9 (“một cánh cày”). (7) `:15.2`–`:18.3` dùng ngôi “ta” (công thức chung) trong khi các khổ kể truyện dùng “tôi”, cùng cách chuyển ngôi như tha-ap483 liền kề.
  Dấu lược: `…pe…` ở `:16.2`, `:17.2`, `:18.2` → đúng một `…` mỗi khoá; Pāli không có `(…)` trần ở khoá nào nên bản Việt không có.
  Coverage English: mẫu số = 1 khoá (`:19.1`, câu kết; `:20.1` dài 38 ký tự nên không vào), Sujato phủ 0/1; không có tệp Anh nào cho uid này; `vietnamese-current` và `english-project` cũng không phủ. Vì vậy bản dịch không được tuyên bố đã đối chiếu English.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Chỉ xác minh được: JSON hợp lệ, đủ 74/74 khoá, thứ tự khoá như Pāli, không khoá thừa hoặc rỗng, NFC, dấu lược và nháy khớp Pāli từng khoá, không có `(…)` đứng một mình, không Pāli lọt (trừ `Therāpadāna` theo quy ước của 433/444 tệp và các tên riêng), và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
