notes: |-
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 4.4 (`upasanto carissasi` "ngươi sẽ sống an tịnh" → "ngươi sẽ sống yên lặng": `upasanta` = "calmed; still" theo DPD, B19 chốt `upasanto` = "yên lặng", `santi` ở 1.4 giữ "an tịnh"; khớp mnd15:148.4, 152.1 và cùng câu kệ snp4.15:15.4).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 2): sửa 2.4 (`vijaññaṁ` "liễu tri" → "biết rõ": DPD "I myself may comprehend"; A5/B9; khớp cnd20:1.5, cnd2:66.4); sửa 5.1 ("thưa Bà-la-môn" → "này Bà-la-môn": lời Đức Thế Tôn (3.2) gọi Jatukaṇṇī, `brāhmaṇa` hô cách; cnd15:29.2 "này Bà-la-môn", Sujato "brahmin").
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 1.3 (thêm chữ nội dung «đã đến đích»: `akāmamāgamaṁ` là «con đã đến [hỏi] bậc không còn ham muốn»; lời giải cnd15:6.5 `āgamhā āgatamhā`, Pj II `nikkāmaṃ bhagavantaṃ pucchituṃ āgatomhi`, Sujato «I have come with a question for that desireless one»; như cnd15:1.3, cnd2:65.3); sửa 3.1 (thể: `vinaya` là mệnh lệnh ngôi 2 số ít của `vinayati` theo DPD; lời giải cnd15:18.8 nối với `pajaha vinodehi … gamehi`; «Sau khi điều phục» → «Hãy điều phục», thi hành đề nghị đã ghi trong notes cnd15); sửa 5.4 (số và thể khả năng: `vaje` optative ngôi 3 số ít, chủ thể là `assa` «người ấy» ở 5.3; lời giải cnd15:32.1 `gaccheyya`, Sujato «might fall»; «khiến họ đi vào» → «do chúng mà người ấy có thể đi vào», như cnd15:29.4, cnd2:69.4). Giữ 5.1–5.2 đảo dòng theo Sujato (thứ tự, không phải lỗi nghĩa); giữ 4.2 «chớ để có gì còn lại cho ngươi».
