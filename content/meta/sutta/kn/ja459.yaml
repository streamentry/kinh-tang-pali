notes: |-
  Đợt 19, làn 47. Dịch từ Pāli root commit đã ghim, đủ 65/65 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem dưới).

  **Tiêu đề, theo khuôn các bài anh em cùng phẩm (`ja455`–`ja457`, `ja460`–`ja462`).**
  - `0.2` “Bộ Mười Một Bài Kinh” và `0.3` “Phẩm Voi Hiếu Mẹ” dùng lại nguyên văn từ các bài anh em trên (cùng `Ekādasakanipāta` + `Mātuposakavagga`).
  - `0.4` “5. Kinh Nước Uống”: `Pānīyajātaka` = “Chuyện [về] nước uống”; `pānīya` đã là “nước uống” ở `dn21:1.5.6` và “nước” ở `dn16:4.22.2`. Tên chung “Kinh <tên>” theo khuôn `ja460:0.4`, `ja461:0.4`; dịch nghĩa thay vì giữ Pāli, như `ja354` “Kinh Con Rắn”, `ja474` “Kinh Xoài”. `15.1` “Kinh Nước Uống thứ năm.” theo `ja460:12.1`, `ja461:14.1` (không dấu phẩy trước số thứ tự; các bài anh em `ja456`, `ja474` có dấu phẩy, tầng chưa thống nhất).

  **Cấu trúc.** Tầng Pāli ghim gồm 8 khổ kệ đầu (khoá `1`–`8`) trong một lời nói liền, nháy kép mở ở `1.1` và đóng ở `8.4`: năm điều ác lần lượt là dùng nước uống của bạn khi chưa được cho (`1`), ham muốn vợ người khác (`2`), đáp khác đi khi bọn cướp hỏi về cha (`3`), tán đồng việc sát sinh trong lễ tế Soma (`5`), tán đồng việc bày ra uống rượu (`7`); cùng bốn dòng điệp khúc (`Tena pacchā vijigucchiṁ …`) khép khổ `1` (ở `1.3`–`1.6`), khổ `2` (ở `2.3`–`2.6`) và đứng riêng thành khổ `4`, `6`, `8` sau các khổ `3`, `5`, `7`. Khoá `9`, `10` là hai lời nói ngắn, mỗi lời có nháy kép riêng; khoá `11`–`14` là một lời nói liền, mở ở `11.1`, đóng ở `14.4`.

  **Tiền lệ dùng lại nguyên văn.** Tầng có 1 cặp Pāli trùng nguyên văn ra ngoài bài đã dò: `11.4` `nirayaṁ te upapajjare` trùng `iti48:4.4`, `iti91:4.4`, bản Việt của hai nơi là “sẽ sinh vào địa ngục.”; tôi dùng lại “sẽ sinh vào địa ngục” và thêm “họ” để giữ `te`, vì ở đây chủ ngữ “những ai” nằm ở dòng trước và cần nhắc lại (1 cặp trùng, 1 cặp bản Việt khác chỉ do thêm “họ”). Đồng thời dùng “họ sẽ sinh vào cõi trời” ở `10.4` cho đối xứng (`saggaṁ te upapajjare`, 0 tiền lệ nguyên văn).

  **Trùng nguyên văn trong chính bài:** 7 nhóm Pāli trùng nguyên văn (điệp khúc `Tena pacchā vijigucchiṁ` / `taṁ pāpaṁ pakataṁ mayā` / `Mā puna akaraṁ pāpaṁ` ở `1.3`, `2.3`, `4.1`, `6.1`, `8.1` (5 khoá), `1.4`, `2.4`, `4.2`, `6.2`, `8.2` (5 khoá), `1.5`, `2.5`, `4.3`, `6.3`, `8.3` (5 khoá); `tasmā pabbajito ahaṁ` ở `1.6`, `2.6`, `4.4`, `6.4` (4 khoá, riêng `8.4` có nháy đóng nên không trùng byte); `Tesāhaṁ samanuññāsiṁ` ở `5.3`, `7.5`; `Ye kāme paṭisevanti` ở `10.3`, `11.3`; `kāmā dukkhatarā tato` ở `12.4`, `13.4`). 0 nhóm có bản Việt khác nhau.

  **Số Pāli:** không có số lượng nào cần tính. Số `5.` ở `0.4` và `pañcamaṁ` ở `15.1` = 5 ⇒ “thứ năm” (khớp với số trong tiêu đề). `sādhikaporisaṁ` (13.2) là “hơn tầm người”, không phải số đếm.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `dhiratthu` (9.1) → “khốn thay”: tầng có 21 khoá chứa `dhiratthu`; cách dịch không đồng nhất (“Ôi, khốn thay” `dn14`; “Nguyền rủa” `ja13`; “Ôi khổ thay” `ja287`, `ja293`; “Thật đáng xấu hổ” `ja327`); chọn “khốn thay” theo `dn14`, bỏ “Ôi” vì kệ không có thán từ.
  - `kāma` → “các dục”: cùng cách với `ja258:2.2`–`2.3`, nơi bản Jātaka anh em dịch “các dục”; tầng `mn` dùng “dục lạc” (ví dụ `mn22:3.8`, `mn14:4.1`), tôi không dùng vì kệ nói đến sự hưởng dụng các dục chứ không chỉ cảm giác lạc.
  - `appassādā` (11.1) → “ít ngọt”, `ja258:2.3` “ít ngọt nhiều khổ”; `mahassādā` (10.1) → “rất ngọt” (đối xứng, 0 tiền lệ nguyên văn).
  - `duggandha` (9.2) → “hôi thối”, 29 khoá chứa `duggandh…` (ví dụ `an3.27:2.8`, `an3.137:1.2`); `bahukaṇṭaka` (9.2) → “lắm gai nhọn”, tầng có 2 khoá (`sn35.244:4.2` “một khu rừng nhiều gai”, `thig11.1:2.2` “nhiều gai nhọn”).
  - `paṭisevati` (9.3, 10.3, 11.3) → “hưởng dùng” (dục): tầng có 47 khoá chứa `paṭisev…`, phần lớn nghĩa “lui tới, sống ở” (trú xứ) hoặc “giao hợp”; với `kāme paṭisevati` (`mn22:9.1`) dịch là “hưởng thụ dục”, tôi dùng “hưởng dùng” cho cả ba chỗ để nhất quán trong bài.
  - `halāhala` (14.1) → “chất độc halāhala”: giữ tên Pāli; tầng `mil` dịch `visaṁ halāhalaṁ` là “chất độc chết người” (`mil5.1.5:6.1`), tôi giữ nguyên danh xưng vì `halāhala` là tên một loại độc, không phải mô tả.
  - `pakkuthita` (14.2) → “sôi sục”, như `sn46.55:6.1` “sôi sục”; `tambaloha` (14.3) → “đồng” (nung chảy): 2 khoá trong tầng (`mn130:26.5` “đồng lỏng”, `mil6.2.4:1.1` “đồng đỏ”).
  - `aṅgāra` + `kāsu` + `sādhikaporisa` (13.1–13.2) → “than hồng … trong hố sâu hơn tầm người”: theo `sn35.244:3.2` (“hố than hồng sâu hơn tầm người”), `mn54:18.1`, `mn12:37.4`.
  - `phāla` (13.3) → “lưỡi cày”: `sn7.11:2.8`, `snp1.4:3.2` (“lưỡi cày”).
  - `pabbajita` (1.6 v.v.) → “đã xuất gia”; `vijigucchati` (1.3 v.v.) → “sinh lòng ghê tởm”: tầng có 5 khoá `vijigucch…` (“nhàm chán” `snp4.16`, “ghê tởm” `snp2.3:1.1`, “ngán ngẩm” `snp1.3:7.3`); chọn “ghê tởm”.
  - `samanuññāsiṁ` (5.3, 7.5) → “đã tán đồng”: tầng có 114 khoá chứa `samanuñ…`, “tán đồng” là chính (ví dụ `dn25:16.5`, `mn143:18.2`, `sn1.1:3.2`).
  - `surā`, `meraya`, `mādhuka` (7.1): giữ `surā`, `meraya` là tên Pāli của hai loại rượu (tầng dịch cụm `surāmeraya…` là “rượu bia” hoặc “rượu men, rượu nấu”, không thống nhất nên giữ Pāli để không mất phân biệt), `mādhuka` → “rượu mật”.

  **Bất định, ghi tại đây, không đưa vào thân kinh.**
  1. `1.1` `Mitto mittassa pānīyaṁ`: đọc là “Là bạn, tôi đã dùng nước uống của bạn [mình]” (`mitto` chủ ngữ, `mittassa` sở hữu), không phải “bạn của một người bạn”.
  2. `3.3`–`3.4` `Tesāhaṁ pucchito jānaṁ, aññathā naṁ viyākariṁ`: `naṁ` có thể chỉ “người cha” hoặc “việc ấy”; tôi dịch “đáp khác đi về việc ấy” để không quyết giữa hai cách. Phần khung truyện nói người con nói dối bọn cướp là việc của chú giải, không có trong tầng Pāli đã ghim.
  3. `5.2` `upaṭṭhite`: dịch “đã đến” (lễ tế đã tới / đã được bày ra); có thể là “đã sẵn sàng”.
  4. `7.1`–`7.2` `Surāmerayamādhukā, ye janā paṭhamāsu no`: cú pháp không chắc. `surāmerayamādhukā` có thể là danh từ số nhiều chỉ chính những người ấy (“những người [gắn với] rượu …”) hoặc là tên các loại rượu; `paṭhamāsu no` có thể là “những người đầu tiên của chúng tôi” hoặc “những người đi đầu trong chúng tôi”, hoặc `paṭhamāsu` = `paṭhamaṁ āsuṁ` “thuở xưa là”. Tôi dịch “những người ưa rượu … những người đi đầu trong chúng tôi” là cách ít thêm giả định nhất; người điều phối nên đối chiếu thêm chú giải/Jātaka đã dịch nơi khác nếu muốn chốt.
  5. `12.2` `nettiṁsova supāyiko`: `supāyika` dịch “được tôi luyện kỹ” (tôi bằng nước); cũng có thể hiểu là “được mài kỹ”. `asī` và `nettiṁsa` là hai từ khác nhau cho “gươm” và “kiếm”; tôi phân biệt “thanh gươm” / “thanh kiếm” theo thứ tự, không chắc về ranh giới nghĩa của hai từ.
  6. Người nói: `1`–`8` là lời một người đã xuất gia nói với một vị vua (`mahārāja` ở `3.1`); `9` là lời nói nghi vấn về lạc của dục (“ta đã hưởng dùng chúng mà không được thứ lạc như thế”); `10` đáp lại, nêu quan điểm dục là lạc; `11`–`14` phản bác. Đây là suy luận từ nội dung, không ghi vào thân kinh; tầng Pāli đã ghim không có văn xuôi để xác nhận.

  **Dấu câu.** Nháy kép `“”`: Pāli 4 dấu mở (`1.1`, `9.1`, `10.1`, `11.1`) và 4 dấu đóng (`8.4`, `9.4`, `10.4`, `14.4`); Việt khớp từng khoá, lệch 0/65. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0. `ti` kết ở `14.4` (`tato”ti.`) được bỏ theo cách các bài Jātaka đã publish xử lý (ví dụ `ja461:1.4`, nơi `…”ti.` thành `…”.`).

  **Coverage English (mục 7):** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng là 25 ký tự (< 40) nên 0/65 khoá có nội dung; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja459`; `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Tôi không đụng `content/meta/reference-gaps.yaml`.

  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
