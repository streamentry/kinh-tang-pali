notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud4.3:7.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud4.3:7.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 3.2 — «mong Ngài nhận lời con thỉnh Ngài cùng Tăng
  đoàn tỳ-kheo dùng bữa ăn ngày mai» → «cúi mong Đức Thế Tôn cùng Tăng đoàn tỳ-kheo nhận lời dùng
  bữa của con vào ngày mai» (adhivāsetu me … svātanāya bhattaṁ, theo dn16 và an8.12; giữ «Tăng
  đoàn tỳ-kheo» như 5.1); 1.3 — «một gốc cây» → «gốc một cây nào đó» (aññataraṁ) và «chỗ đã được
  sắp đặt» → «chỗ đã soạn sẵn» (paññatte āsane), đồng bộ ở 5.1.
