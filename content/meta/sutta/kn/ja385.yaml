notes: |-
  **Bài thứ mười — cũng là bài CUỐI — của `Avāriyavagga` trong `Chakkanipāta`, nên nó mang cả khối mục lục của cả phẩm.** Vì thế cấu trúc bài này giống hệt `ja375` (bài cuối của `Aḍḍhavagga`) mà tôi đã đối chiếu: `7.1` = tên bài + số thứ tự, `7.2` = tên phẩm + số thứ tự phẩm, `8.1` = lời dẫn mục lục, `9.1–9.4` = bốn câu kệ liệt kê tên. 37 khoá, tất cả đã dịch.

  **Ba khoá dùng lại nguyên văn (đếm bằng script):** `0.2` ← `ja376`/`ja377` (*Bộ Sáu Bài Kệ*) · `0.3` ← `ja376`/`ja377` (*Phẩm Avāriya*) · `8.1` ← `ja310`/`ja320` (*Kệ tóm tắt của phẩm ấy:*). Ba khoá khác lấy đúng câu chữ từ hai bài cùng vai trò đã dịch, không phải trùng nguyên văn mà là trùng **công thức**: `7.2` *Phẩm Avāriya là phẩm thứ nhất.* theo `ja340:5.2` (*Phẩm Kokila là phẩm thứ tư.*) và `ja330:5.2` (*Phẩm Kuṭidūsaka là phẩm thứ ba.*); `9.4` *ấy là mười chuyện* cho `dasāti` theo `ja340:7.4` và `ja330:7.4`; `9.1–9.3` giữ tên Pāli và dịch `varo` thành *tối thắng* theo đúng hai bài đó (`ja340:7.1` *chiến thắng tối thắng*).

  **`0.4` tôi giữ Pāli trong tên, bỏ hậu tố `-jātaka`: *10. Kinh Nandiyamigarāja*.** Mẫu là hai bài ngay cùng phẩm: `ja386:0.4` *1. Kinh Kharaputta* (Pāli `Kharaputtajātaka`) và `ja387:0.4` *2. Kinh Sūci* (Pāli `Sūcijātaka`) — giữ tên riêng, bỏ `-jātaka`. **Có tiền lệ trái chiều trong chính tác phẩm:** `ja267:0.4` = *7. Kinh Con Cua* cho `Kakkaṭakajātaka` (dịch nghĩa), và `ja351:0.4` = *1. Chuyện Tiền Thân Hoa Tai Ngọc* (dịch cả `jātaka`). **Giao biên tập:** nếu chọn hướng dịch nghĩa thì đổi thành *10. Kinh Vua Hươu Nandiya* là hợp lý (đối xứng với *Hạnh Của Long Vương Campeyya* của bộ `cp`), nhưng nó phải là quyết định cho cả 392 bài `ja`, không thuộc lát này — tôi theo lân cận.

  **Bản kệ mục lục `9.1–9.4` — hai chỗ tôi phải tự quyết, ghi rõ.** (a) `kujjharathesabha` là danh từ riêng dạng kép (Kujjha + rathesabha = chủ tướng xe), **giữ nguyên Pāli** như `ja330`/`ja340` giữ `Kuṭidūsaka`/`doddubha`/`Visayha`. (b) `Atha` tôi dịch *Rồi*, theo `ja340:7.3`/`7.4` và `ja330:7.3`/`7.4`. `Sadarīmukha`, `Neri`, `Latā`, `Apananda`, `Sucitta`, `Ketu`, `Nandi-miga` đều là tên riêng trong bài mục lục, giữ Pāli.

  **`kosalassa niketane` → *ở trong bầy hươu vùng Kosala*.** `niketana` là đám/bầy; tôi thêm chữ *hươu* vì chủ thể `Migarājā` (4.1) là vua hươu, và không thêm thì câu *ở trong bầy vùng Kosala* mơ hồ. Đây là chỗ tôi **thêm một chữ** để câu đủ nghĩa, nên ghi ra để biên tập phán. `Kosala` và `Kosalo` là hai tên khác nhau trong Pāli (`4.2`/`4.3` nói vùng và vị vua; `5.4` nói kẻ bắn) — tôi giữ đúng dạng của từng chỗ.

  **`odahiṁ` (3.1 và 6.1) tôi dịch *vạch mặt đất ra*.** Suy ra từ cặp song song **trong chính bài**: `3.2`/`6.2` là `khurappānissa rājino` (cái lưỡi cày của vua), `3.3`/`6.3` là `Tadāhaṁ sukhito mutto` (ta mới an nhàn, tự do). Nghĩa là lưỡi cày bị đào lên đã hiện ra — tức hành động bắn ở `5.1–5.4` đã thành công, và nhịp lặp `3.1–3.4` / `6.1–6.4` chính là hai lần nói cùng một việc. `lưỡi cày` có 11 tiền lệ trong tầng (kể cả `cp24:4.4` cùng lát này); `khurappāni` ở `cp24` đã dịch theo *lưỡi cày* nên đây là lần dùng chung đầu tiên trong lát và không lệch.

  **`mātaraṁ daṭṭhumāgato` (6.4) và `api passeyya mātaraṁ` (3.4) tôi dịch *gặp mẹ mình* / *nhìn thấy mẹ mình*.** `mātara` là dạng rút gọn của `mātarā` (mẹ); với ngôi thứ nhất thì *mẹ mình* là cách đọc tự nhiên. Hai câu này cùng ý nên tôi dùng cùng một cách.

  **Tên riêng 0 tiền lệ — đã grep toàn tầng rồi mới dùng.** `Nandiyamigarāja`, `Sadarīmukha`, `Latā` không có bản Việt nào đã có (grep = 0). Vì là tên riêng **lấy từ Pāli của chính bài**, tôi khai chúng vào bộ nhớ tiến trình của harness — đúng cơ chế mà docstring của `_hvi.py` nêu rõ (*tên riêng nằm trong Pāli của bài đang dịch thì không phải lỗi lọt*), và **không sửa `_hvi.py`**. Còn `Nandiya`, `Kosala`, `Sāketa`, `Vajjā`, `Siri` thì đã có sẵn trong tầng và tôi dùng lại nguyên dạng.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root: `root/pli/ms/sutta/kn/ja/ja385_root-pli-ms.json`, 37 khoá. Bản Anh Sujato **không có** tại commit đã ghim: 83 tệp `ja` của edition phủ `ja1–ja79` cộng `ja126`, `ja159`, `ja466`, `ja534`, **không có `ja385`**; `kn/` chỉ có `cp` 35, `dhp` 26, `iti` 112, `ja` 83, `kp` 9, `snp` 73, `thag` 264, `thig` 73, `ud` 80 — **không có `cnd`, `pv`, `mil`**. `find` cho 0 tệp ⇒ `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` cũng không có uid này. Tầng `vietnamese-current` vắng: thư mục `translation/` không tồn tại trong checkout này. Ba tầng tham khảo đều vắng ⇒ **blocker thật**, là giới hạn upstream. `triangulation` bị chặn ở **7.5** (≤ 8.0), **không nâng để né blocker**; `status` là `draft`.

  **Dấu nháy kép — đếm được, cân.** Pāli 3 mở (`1.1`, `2.1`, `3.1`) / 3 đóng (`1.6`, `2.4`, `6.4`); bản Việt y hệt. Lời ở `3.1` không đóng ngay mà chạy tới `6.4` — đúng như Pāli, và tôi không thêm dấu ở `4.5` hay `5.1` vì Pāli cũng không có.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì BRIEF cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0: mọi chốt tự động của `_hvi.kiểm` đã xanh và 37/37 khoá của chính bài này, nhưng cổng `npm` chưa chạy.