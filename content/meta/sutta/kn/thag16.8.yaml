notes: |-
  Phạm vi: đủ 109/109 khoá của bài (4 khoá `:0` tiêu đề, 104 khoá kệ `1.1`–`26.4` thuộc 26 bài kệ, `26.5` dòng bìa), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã in và đọc đối chiếu cả 109 cặp Pāli↔Việt, không đọc mẫu. Đây là bài kệ của Trưởng lão Aṅgulimāla; phần lớn các kệ trùng với `mn86` (kinh Aṅgulimāla, kệ ở `mn86:6` và `mn86:18`) và với Pháp Cú (`dhp172`, `dhp173`, `dhp382`, `dhp26`, `dhp27`, `dhp80`).

  MẪU SỐ COVERAGE THEO CỔNG = 0 — CỔNG KHÔNG ĐO ĐƯỢC GÌ. `source/layers.yaml` đặt `substantivePaliMinChars: 40` và bỏ khối `:0`; khoá Pāli dài nhất của bài chỉ 36 ký tự (mỗi pāda một khoá), nên 0 khoá đạt ngưỡng. Đây là "không đo được gì", không phải "không cần ghi nhận gap". Tôi không lấy đó làm căn cứ mà đo thô riêng.

  COVERAGE ENGLISH THÔ (do người biên tập tự phán). Tra manifest: `english-sujato` có tệp cho bài này (`sutta/kn/thag/thag16.8_translation-en-sujato.json`, có trong `source/upstream-manifest.json`), đúng 109 khoá ID, cùng thứ tự với Pāli. Trên 105 khoá thân (bỏ 4 khoá `:0.x`), Sujato có prose ở 104/105 = 0,990; trên cả 109 khoá: 108/109 = 0,991. Khoá Sujato để trống duy nhất là `26.5` (dòng bìa). Cả hai phép đo thô vượt ngưỡng 0,80. `english-project`: không có tệp, không cần lấp (Sujato phủ đủ thân kệ). `vietnamese-current`: vắng tại commit đã ghim (bilara chỉ có Pháp Cú); tầng Việt nguyên bài của sc-data chỉ để tra cứu toàn văn, không căn lề theo khoá, nên không tính là tầng tham khảo. Không có entry trong `reference-gaps.yaml`; mẫu số theo cổng bằng 0 nên cổng không có gì để ghi nhận. Bản Anh của Sujato khớp ranh giới khoá Pāli (mỗi pāda một khoá) nên đối chiếu được ở mức khoá; nó đôi chỗ thêm chữ mà Pāli không có (`3.2` `deep wood`, `4.1` `hurled`, `23.4` `had sympathy`), nên không dùng làm căn cứ cho những chữ ấy. Chữ `<j>` trong tệp Sujato là dấu nối dòng, không phải nội dung.

  VÌ SAO `published`. Không có blocker: 109/109 khoá, 0 thừa, 0 thiếu, nháy và dấu lược khớp Pāli từng khoá, số lượng đã tự tính. Trung bình số học thô của 10 tiêu chí là 9,19, lớn hơn 9,0, nên theo bảng gate bài ở `published`. Bài là kệ ngắn, câu đơn giản, hơn nửa số khoá có tiền lệ cùng Pāli trong tầng (70 khoá có Pāli trùng nguyên văn với một khoá khác ở nơi khác), nên điểm cao hơn bài kệ ẩn dụ dày; `ambiguity_integrity` bị trừ vì còn năm chỗ chưa phân xử chắc (xem mục bất định). Technical gate chưa chạy (xem cuối): nếu một trong bốn lệnh đó đỏ thì status phải xét lại. Điểm do chính người dịch tự chấm; chưa có người đọc độc lập.

  CẤU TRÚC VÀ LỜI NÓI. Pāli mở nháy kép ở `1.1` và đóng ở `1.4` (lời Aṅgulimāla, trong đó `1.4` có nháy đơn lồng `‘…’` cho câu hỏi), mở ở `2.1` đóng ở `2.4` (lời Đức Phật), mở ở `3.1` đóng ở `3.4` (Aṅgulimāla), `5.3` mở và đóng trong một khoá (`“Tamehi bhikkhū”ti`), rồi mở ở `6.1` và chỉ đóng ở `26.4` (`bhavanetti samūhatā”ti`): toàn bộ kệ 6–26 là lời nói một mạch của vị Trưởng lão, nên bản Việt không đóng nháy nào ở giữa. Kệ 4–5 là lời kể. `14.1` có nháy đơn quanh tên `‘Ahiṁsako’`; bản Việt `‘Vô Hại’`. Chủ thể: Aṅgulimāla xưng `ta`, Đức Phật xưng `Ta` (viết hoa, theo `mn86:6.6`).

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 109 = Pāli 109, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
    2. Nháy kép và đơn khớp Pāli từng khoá: 0/109 lệch. Tổng: `“` 5/5, `”` 5/5, `‘` 2/2, `’` 2/2. Không thêm nháy nào Pāli không có (`1.1` Pāli không có nháy đơn nên Việt cũng không).
    3. Pāli trùng nguyên văn TRONG CHÍNH bài: 6 nhóm (`6.3`/`7.3`/`8.3`, `6.4`/`7.4`/`8.4`, `15.2`/`16.2`, `20.1`/`21.1`, `20.2`/`21.2`, `21.4`/`26.2`), bản Việt giống nhau từng chữ (ngoài dấu câu cuối khoá) trong cả 6 nhóm, 0 nhóm khác. Thêm một cặp gần trùng: `16.4` và `26.4` (`bhavanetti samūhatā`, khoá sau có thêm `”ti`), Việt giống nhau, khoá sau thêm `”`. Phép này có mẫu, không rỗng.
    4. Dấu lược: Pāli có `…` chỉ ở `26.5`; Việt có `…` đúng ở đó. `(…)` trần: 0 ở Pāli, 0 ở Việt. `26.5` Pāli kết `….` nên Việt kết ` ….`. Lỗi 0/109.
    5. Số Pāli (tự tính): `vīsati` (`0.2`) = 20, khuôn `Bộ Hai Mươi Bài Kinh` như các bài `thag16.x` đã dịch (bài có 26 kệ, tên bộ là tên gọi truyền thống chứ không phải số đếm). `sahassa` (`3.3` `sahassapāpaṁ`) = 1000, viết `ngàn` (851 khoá `ngàn` so với 252 khoá `nghìn` trên toàn tầng). `tisso` (`21.3`) = 3, `ba minh` (35/46 khoá cùng Pāli toàn tầng viết `ba minh`). `ubhato` (`24.2`) = cả hai bên, không phải số đếm. Không có số nào khác.
    Vệ sinh: JSON hợp lệ, 109/109 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa, 0 khoá có Pāli lọt sang Việt ngoài tên riêng (`Theragāthā`, `Aṅgulimāla`, `Māra`).

  TIỀN LỆ TRÙNG NGUYÊN VĂN — ĐÃ DÒ. Đo toàn tầng (dn, mn, sn, an, kn), so Pāli bỏ dấu câu và hoa thường, không kể khoá tiêu đề và khoá lược: 70 khoá của bài có Pāli trùng nguyên văn ở nơi khác (1.623 cặp); phần lớn trùng với `mn86` và Pháp Cú. Trong 70 khoá đó, 55 khoá có ít nhất một bản Việt tiền lệ giống bản này (sau khi bỏ dấu câu), 15 khoá không có bản tiền lệ nào giống: `2.3`, `3.1`, `5.1`, `13.1`, `13.4`, `14.3`, `17.1`, `17.2`, `17.3`, `18.1`, `18.2`, `25.2`, `25.4`, `26.1`, `26.4`. Lý do khác từng nhóm: (a) theo đa số tầng thay cho `mn86`: `đại ẩn sĩ` (66/90 khoá `mahesi/mahesī/mahesino` toàn tầng, `Đại tiên` chỉ 6) ở `3.1`, `5.1`; `điều phục` (22/37 khoá `dam-`/`danto`, `nhiếp phục` 3) ở `12.4`, `13.1`, `13.4`; `bậc Vững Vàng` (17 khoá `tha-ap`, so với `kiên định` 2) ở `13.4`; `sinh linh` (`vv53:12.2` cùng cụm `pāṇesu asaññato`) ở `2.3`; `bhavanetti samūhatā` → `sợi dây dẫn đến hữu đã được nhổ bỏ` (4 khoá `dn16:2.3.8`, `thag15.1:15.4`, `thag14.1:12.4`, `thag2.8:1.4`; `mn86:18.46` `dây trói hữu đã bị đoạn tận` 1 khoá) ở `16.4`, `26.4`; `đã làm tròn lời dạy của Đức Phật` (695/704 khoá `kataṁ buddhassa sāsanaṁ`) ở `21.4`, `26.2`; `Ba minh đã chứng đắc` (`ba minh` 35/46, `đã chứng đắc` 24/46) ở `21.3`; `soi sáng thế gian này` (`dhp172/173/382`, `thag10.3:2.5`, 4/4 khoá `somaṁ lokaṁ pabhāseti` ngoài `mn86`; `mn86` `sáng chói đời này` 3 khoá cùng một bài) ở `6.3`, `7.3`, `8.3`; `người trị thủy dẫn nước`, `thợ tên uốn mũi tên`, `thợ mộc uốn gỗ` (3/4 khoá cùng Pāli) ở `12.1`–`12.3`; `đeo đuổi sự phóng dật`, `hạnh phúc tối thượng` (`sn1.36:5.1`, `sn1.36:6.1`, `sn1.36:6.4`), `gần gũi thân mật với dục lạc` (`dhp27:2`), `gìn giữ không phóng dật`, `tài sản quý nhất` (`dhp26:3`–`4`) ở kệ 18–19; `đã đặt xuống gậy gộc với mọi chúng sinh` (`snp1.3:1.1` giống từng chữ; `dhp142:3` `đặt gậy xuống`, `snp2.14:20.3` `đặt xuống gậy gộc`: 3 khoá cùng Pāli ngoài `mn86`, `mn86:6.7` `từ bỏ trượng phạt` 1 khoá) ở `2.2`. (b) bỏ chữ `mn86` thêm mà Pāli không có: `mn86:18.47` `Dù`, `mn86:18.49` `nay`, nên `17.1`–`17.3` không có các chữ ấy; `14.3` `Nay ta có tên đúng với sự thật` thay `Nay tên ấy đã đúng với thật` cho rõ nghĩa (`saccanāmo` → `tên chân thật` ở `an6.43:8.4`, `thag15.2:4.4`). Khoá `26.1` khác `thag15.1:15.1` chỉ ở đại từ (`tôi` → `ta`, vì Aṅgulimāla xưng `ta` suốt bài); `18.1`–`18.2` ghép từ `sn1.36:5.1` và `dhp26` vì dòng chia của hai bản khác Pāli bài này.

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `mahesī`/`mahesi` → bậc đại ẩn sĩ (66/90). `sugata` → bậc Thiện Thệ (164 khoá `bậc Thiện Thệ` so với `Đấng Thiện Thệ` 19 trên toàn tầng); khoá `4.3` (`sugatassa pāde`) giữ `Thiện Thệ` không `bậc` theo `mn86:6.16`.
    · `satthā` → Đạo Sư (`Đạo Sư` 628 so với `Đạo sư` 236 toàn tầng; thag/thig 20 so với 4), viết hoa chữ Sư theo đa số.
    · `mārassa` → Māra (`Māra` 266 so với `Ác Ma` 293 toàn tầng, thag/thig 1 so với 1; giữ `Māra` như các bài MN đã dịch gần đây).
    · `jhāyanto` → chuyên thiền định (`dhp27:3`); `appamādo` → không phóng dật (488 khoá `không phóng dật` toàn tầng).
    · `dhammakathā` → pháp thoại (162 khoá `pháp thoại` so với 3 khoá `Pháp thoại`); `buddhasāsane` → giáo pháp Phật (`dhp382`, `thag2.42:1.2`, theo đúng các khoá cùng Pāli; `kataṁ buddhassa sāsanaṁ` lại là `lời dạy` theo 695/704 khoá, hai chỗ khác nhau vì Pāli khác).

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `3.1` `Cirassaṁ vata me mahito mahesī`: `me` đi với `mahito` có thể là tác nhân (`được ta tôn kính`, cách tôi chọn, vì `mn86:6.10` bỏ mất `me`) hoặc dative `đối với ta`; Sujato đọc `mahito` là `renowned` (nổi tiếng) và không dịch `me`. Chưa phân xử được.
    · `3.3` `sahassapāpaṁ`: `ngàn điều ác` theo Sujato (`a thousand evils`); hợp từ cũng có thể là `điều ác gấp ngàn lần`. Không có tiền lệ cho dạng này.
    · `22.4` `ubbiggamanaso`: `lo sợ`; tầng chỉ có `ubbigga` ở `sn2.17:2.2` (`dao động`) và `ja394:2.3` (`nơm nớp lo âu sợ hãi`), nên chọn `lo sợ` vì gồm cả hai nét; Sujato `anxious`.
    · `24.2` `udicco ubhato`: `thuộc dòng cao quý ở cả hai phía` (Sujato `highborn on both sides`); `ubhato` thường được hiểu là cả cha lẫn mẹ nhưng Pāli không nói, nên không thêm. `24.1` `brahmajacco` → `sinh làm Bà-la-môn` (không có tiền lệ).
    · `24.3` `Sojja`: `so` + `ajja`, `nay ta là`: Pāli chỉ dùng ngôi ba; vì `āsiṁ`/`ahu` ở `24.1`–`24.2` là ngôi một nên `so` ở đây quy về vị Trưởng lão tự nói. Sujato `now I'm`.
    · `1.1` `samaṇaṭṭhitomhi`: tách `samaṇa ṭhitomhi` (`này Sa-môn, ... đã dừng`); `mn86:6.2` viết lại `Ta đã dừng` trong nháy đơn, còn Pāli bài này không có nháy đơn ở `1.1` nên bản Việt chỉ nêu gián tiếp (`nói rằng Ngài đã dừng`).
    · `20.2`/`21.2` `dummantitaṁ`: `quyết định ấy của ta không sai lầm` theo `mn86:18.60`; Sujato `the advice I got was good`. `mantita` là lời bàn bạc/cố vấn, cả hai cách đọc đều có thể.

