notes: |-
  17 khoá, tất cả đã dịch. Bài thứ 2 của `Upacikāvagga`, ngay cạnh mil7.5.1, mil7.5.4,
  mil7.5.5.

  TẦNG THAM KHẢO — 0/17 có Anh Sujato. Không có bản Việt hiện hành. ⇒ `draft`.

  PĀLI TRÙNG: `0.1`, `0.2`, `0.3` `Upacikāvagga` → *Phẩm Con Mối* (mil7.5.1, mil7.5.4,
  mil7.5.5 — 4 tiền lệ), và `2.4` `Bhāsitampetaṁ, mahārāja, bhagavatā devātidevena—` → *Đức
  Thế Tôn, bậc Thiên Nhân, đã nói trong tập kinh—* (mil7.8.2:2.5, đúng nguyên văn).

  **Bốn câu kệ ở `3.1–3.4` là bài Ādittapariyāya.** Pāli không nêu tên bài kinh (chỉ có `—`), nên
  tôi **không** tự thêm tên vào bản dịch; giữ nguyên khung *đã nói trong tập kinh* như tiền lệ.

  `2.2` liệt **đủ 15 vế** của công thức `iti rūpaṁ iti rūpassa samudayo iti rūpassa atthaṅgamo`
  × 5 uẩn; tôi đếm lại sau khi viết. 0 tiền lệ cho cụm này trong tầng Việt, nên đặt mới:
  *tướng / thọ / tưởng / các hành / thức* và *nguyên nhân của …* / *sự tan rã của …*. `rūpa` →
  *tướng* và `viññāṇa` → *thức* là cách dùng phổ biến của tầng.

  THUẬT NGỮ MỚI (0 tiền lệ): `biḷāra` → *con nhện*; `undūra` → *chỗ đất trống không có chỗ
  che*; `susi` → *kẽ hổng* (bản nháp đầu ghi *lòng đất*, đã sửa vì `susi` là khoảng trống/kẽ hổng
  chứ không phải lòng đất); `bhavagga` → *thế sau*.

  **Không nén `2.2`.** Công thức năm uẩn chỉ xuất hiện **một lần** trong cả bài, nén nó sẽ mất
  nghĩa giáo lý không được lặp lại ở đâu khác — đúng tình huống §10.2 nói phải viết đủ.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
