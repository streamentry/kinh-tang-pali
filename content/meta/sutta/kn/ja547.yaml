gì chẳng lành", và bản mù đọc theo hướng sau), `683.4` `gavaṁ hatthusabhaṁ sataṁ` (một trăm của mỗi thứ hay chỉ một trăm bò), `771.3`–`771.4` `mātujampi … pitujampi` ("bên mẹ", "bên cha" hay điều sinh từ mẹ, từ cha). Rà đối kháng cả bài ngoài danh sách chênh lệch, sửa thêm: `143.4`, `145.4`, `147.4`, `149.4` `samhā raṭṭhā nirajjati` "phải rời khỏi xứ sở của mình" → "bị trục xuất khỏi xứ sở của mình" (cùng công thức ở `151.6`, `152.4`–`154.4`, `156.4` đã là "bị trục xuất"; câu "phải rời khỏi" nêu ở phần Pāli trùng nguyên văn bên trên không còn đúng); `768.2`, `769.2` "của chính bà" → "của chính nàng" (`lakkhaṇā` là Maddī; "bà" dễ bị đọc là Phussatī). Tổng cộng 12 khoá đã sửa (`116.1`, `143.4`, `145.4`, `147.4`, `149.4`, `159.3`, `234.3`, `237.3`, `248.3`, `643.4`, `768.2`, `769.2`). Nháy kép, nháy đơn và ngoặc đơn vẫn khớp Pāli từng khoá (0 lệch trên 3382 khoá); số Pāli không đổi. Không có bản Anh hay bản Việt độc lập khác; điểm `triangulation` vì thế vẫn dưới trần 8,0, và các lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy ở bước này.

