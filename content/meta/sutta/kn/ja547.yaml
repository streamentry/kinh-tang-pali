      + Không có `…pe…`, `…` trần hay `(…)` ở khoá nào của Pāli bài này; các khoá `637.1` và `638.4` có ngoặc đơn `(` và `)` thật của Pāli (kệ chen, lặp `cp9:52`–`53`) và Việt giữ đúng hai ngoặc ấy ở đúng hai khoá.
    - Phép kiểm tra:
      1. Tập khoá Việt = tập khoá Pāli: 3382/3382, cùng thứ tự.
      2. Nháy `“”` và `‘’` khớp Pāli từng khoá: 3382/3382 khoá khớp. Pāli có 151 khoá mở nháy kép và 151 khoá đóng nháy kép, một cặp nháy đơn (mở ở `37.3`, đóng ở `39.4`); Việt có đúng số lượng và vị trí ấy ở từng khoá, kể cả các chỗ Pāli mở nháy ở một khoá và đóng ở khoá sau (`37.3`–`39.4`, `209.3`–`210.4`, `616`–`617.4`, `534.4`), không có nháy thẳng.
      3. Pāli trùng nguyên văn trong chính bài (474 nhóm, 1471 khoá, 2644 cặp, 237 cặp khác có lý do) và với bài khác (580 khoá, 2029 cặp, 508 khoá dùng lại): xem phần Pāli trùng nguyên văn.
      4. Dấu lược: Pāli không có `…pe…`, `…` trần hay `(…)` ở khoá nào, Việt cũng không có `…` ở khoá nào (0/3382).
      5. Số Pāli: xem phần trên, đã tự tính và đối chiếu.
      NFC đạt, không khoá rỗng, không khoảng trắng thừa, không khoá nào Việt trùng nguyên Pāli ngoài `0.1` (`Jātaka`, tên thể loại giữ phiên âm theo `ja546:0.1`); Pāli lọt sang tiếng Việt chỉ là tên riêng và từ giữ phiên âm có ghi chú (`Vessantara`, `Maddī`, `Jāli`, `Kaṇhājinā`, `Kaṇhā`, `Sañjaya`, `Phussatī`, `Jūjaka`, `Amittatāpanā`, `Accuta`, `Cetaputta`, `Vissakamma`, `Vaṅka`, `Gandhamādana`, `Mucalinda`, `Ketumatī`, `Kontimārā`, `Mārañjara`, `Kelāsa`, `Himavā`, `Kaliṅga`, `Kāsi`, `Gandhāra`, `Sakka`, `Vāsava`, `Maghavā`, `Inda`, `Pajāpati`, `Soma`, `Yama`, `Vessavaṇa`, `Nārada`, `Pabbata`, `Sujā`, `Hemavanta`, `Bhāradvāja`, `Jātaveda`, `Rohinī`, `Sītā`, `Rāma`, `Jātaka`, `Mūgapakkha`, `Pāḷi`) và các từ `kuṭaja`, `bimbajāla`, `lodda`, `padmaka`, `kaṇikāra`, `koṭumbara`, `sūta`, `māgadha`, `vayha`, `khārī`, `nikkha`, `sāla`, `kurarī`, `cakkavāka`, `beḷuva`, `vedisā`, `sinduvāraka`, `piyāla`, `kāsumārī`, `jīvaputtā`, `sattapaṇṇa`, `āsada`, `masa`, `hiṅkāra` và các tên cây, hoa, chim, thú, nhạc cụ khác giữ phiên âm viết thường. Đã in cặp Pāli↔Việt ra đọc toàn bài trong lượt dịch và đọc lại đối kháng một phần lớn (đầu bài, các ranh giới giữa các phần, đối thoại Jūjaka–vợ, Maddī trở về, Sakka và tám ân huệ); đã sửa sau lượt đọc: đồng bộ các cụm lặp xuyên các phần (xem phần Pāli trùng nguyên văn), thống nhất `īsādantaṁ urūḷhavaṁ`, công thức "Ta cho" của Vessantara (`633.1`), `lakkhaṇā` (`768.4`, `769.4`), `rathesabha` (`455.4`, `457.4`), `rājaputta` → "vương tử" (`735.1`, `797.3`), khôi phục `55.2` (bản nháp thừa chữ "Với"), `619.3` và `619.6` về "Inda".
