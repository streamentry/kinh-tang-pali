    - Số Pāli:
      `dasa`/`dasadhā` (`1.2`, `4.4`, `12.1`) = mười ân huệ; `sattadhā` (`52.4`) = bảy phần; `saṭṭhihāyana` (`76.2`, `77.2`, `78.4`, `720.2`) = sáu mươi tuổi (saṭṭhi 60, hāyana năm; `mn35:5.10`); `satta … sate`/`satāni` (`144.1`, `146.1`, `148.1`, `150.1`, `152.1`, `153.1`, `153.2`) = bảy trăm (satta 7 × sata 100) voi, ngựa, cỗ xe, phụ nữ, bò cái, tớ gái, tớ trai; `itthisahassānaṁ` (`114.1`) = hàng ngàn phụ nữ (sahassa 1000, không đoán số cụ thể); `ekamekā` (`150.2`) = mỗi nàng; `dasa bhātaro` (`188.4`) = mười anh em; `satapale` (`198.1`) = trăm pala, `satarājike` (`198.2`) = có trăm đường vân; `catuvāhiṁ` (`208.1`) = bốn ngựa; `catunnaṁ caturo haye` (`211.4`) = cho bốn người bốn con ngựa (4 × 1); `pañcamo` (`213.1`) = người thứ năm; `caturaṁsa` (`261.3`) = bốn góc; `navamiyaṁ` (`274.1`) = ngày thứ chín; `caturaṅgulā` (`381.4`) = bốn ngón tay; `tīṇi` (`385.1`, `403.1`) = ba loại; `aḍḍhamāsaṁ` (`401.1`) = nửa tháng; `satta … māse` (`446.1`, `627.1`) = bảy tháng; `ekarattiṁ` (`453.1`, `454.1`) = một đêm; `tayo` (`536.2`, `584.2`) = ba con thú; `dve` (`558.1`) = hai; `dutiyaṁ` (`577.1`) = thứ hai; `aṭṭha` (`649.4`) = tám ân huệ; `paṭhama`…`aṭṭhama` (`650.4`–`657.4`) = thứ nhất đến thứ tám; `pannarasā ratti` (`665.3`) = đêm thứ mười lăm (pañca 5 + dasa 10); `sahassa` (`682.1`, `683.5`, `684.5`) = một ngàn; `sataṁ` (`683.3`, `683.4`, `684.3`, `684.4`, `713.1`) = một trăm; `hatthinā ca satena ca` (`682.4`) = "một con voi và một trăm" (giữ sát Pāli, số ít `hatthinā`; không bổ sung "mỗi thứ"); `saṭṭhisahassāni` (`702.1`, `765.1`, `791.1`) = sáu mươi ngàn (saṭṭhi 60 × sahassa 1000 = 60.000, theo `cp9:39.1`); `catuddasa` với `nāgasahassāni`/`assasahassāni`/`rathasahassāni` (`706`, `708`, `710`) = mười bốn ngàn (14 × 1000 = 14.000); `dasamaṁ` (`801.1`) = thứ mười. Không có cụm thuộc loại `Tiṁsakappasahassa`.
