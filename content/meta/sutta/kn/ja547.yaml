notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja547_root-pli-ms.json` (3382/3382 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ, không có văn xuôi khung truyện trong tầng đã ghim. Cấu trúc: bốn khoá tiêu đề `0.1`–`0.4`; mười một dòng đầu phần (`1.0.1`, `92.0`, `218.0`, `264.0`, `327.0`, `359.0`, `440.0`, `536.0`, `622.0`, `661.0`, `727.0`); mười lăm dòng kết (`14.1`, `91.1`, `217.1`, `263.1`, `326.1`, `358.1`, `439.1`, `535.1`, `621.1`, `660.1`, `726.1`, `759.1`, `801.1`, `802.1`, `803.1`); 788 kệ gồm 679 kệ bốn dòng, 18 kệ năm dòng và 91 kệ sáu dòng (3352 khoá). Kệ `2` đến `14` là mười điều ước của Sakka cho Phussatī, `15`–`91` Vessantara cho voi quý, dân Sivi đòi trục xuất và Maddī can ngăn (phần Hemavanta, Pāli không có dòng đầu phần), `92`–`217` đại thí bảy trăm và lời can của Maddī với vua Sañjaya, `218`–`263` vào rừng, `264`–`326` Bà-la-môn Jūjaka và vợ Amittatāpanā, `327`–`358` và `359`–`439` hai phần tả rừng và Jūjaka đến chỗ ẩn sĩ Accuta, `440`–`535` hai đứa trẻ bị đem cho, `536`–`621` Maddī trở về, `622`–`660` Sakka xin Maddī và tám ân huệ, `661`–`726` vua Sañjaya chuộc hai cháu và lệnh rước Vessantara, `727`–`759` sáu vị Sát-đế-lợi gặp lại nhau, `760`–`803` trở về thành, mưa châu báu, kết bài. Nội dung này suy từ chính các kệ, không đưa vào thân kinh điều Pāli của tầng này không nói.
    - Tầng tham khảo:
      Tầng English của Sujato không có ja547 (manifest: ja chỉ có 83 tệp, ja1–79, ja126, ja159, ja466, ja534; đây là not-published-upstream, không phải not-synced); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` không có tệp cho bài này. Cả ba tầng tham khảo đều vắng nên chỉ dựa vào Pāli, tiền lệ Việt của tầng (nhiều nhất là `cp9`, Hạnh Vessantara, và các Jātaka `ja532`, `ja538`–`ja546`) và bối cảnh của chính bài. Tiền lệ Việt trong tầng do cùng một nhóm dịch, nên không phải đối chiếu độc lập; không dùng bản tóm lược hay bản dịch ngoài tầng đã ghim làm câu chữ hay đối chiếu. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
    - Coverage English:
