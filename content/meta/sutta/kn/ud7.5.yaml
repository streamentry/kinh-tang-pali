notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud7.5:5.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.
