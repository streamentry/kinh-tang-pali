notes: |-
  Nguồn đã đọc: Pāli root đã ghim (113 khoá), bản Anh Sujato (đủ 113 khoá, có tầng tham khảo), bản Việt hiện hành Phan Tuấn Anh (đủ khoá), và đối chiếu tiền lệ nội bộ bằng cách đếm trên toàn tầng. Bản dịch này trước đó chưa có ghi chú nào.

  Lượt cải thiện 2026-10-14: đọc đối kháng cả 113 khoá, đổi 35 khoá (không thêm, không bớt, không đổi thứ tự khoá).
  - Sai nghĩa (vừa): dhp366:1-3. Pāli `ce … nātimaññati` là câu điều kiện ở thức trình bày (nếu tỳ-kheo dù được ít mà không xem thường lợi lộc mình được, thì chư thiên tán thán). Bản cũ viết thành mệnh lệnh "chớ xem thường", biến mô tả thành quy định và bỏ mất "ce". Đã sửa lại thành điều kiện; dhp365:1-2 vẫn là mệnh lệnh đúng (`nātimaññeyya`, thức mong cầu).
  - Sai ngôi (nhẹ): dhp379:3-4 `vihāhisi` là ngôi thứ hai, nên viết "này tỳ-kheo, ngươi sẽ sống an lạc" (bản cũ đổi sang ngôi thứ ba); dhp376:6 `karissati` là ngôi thứ ba, nên viết "người ấy sẽ chấm dứt khổ đau" (bản cũ đổi sang "ngươi"). Hai chỗ trước đó đảo ngược nhau; dhp369:4 `ehisi` giữ "ngươi".
  - Lệch Pāli (nhẹ): dhp379:0 Pāli là `Naṅgalakula`, bản cũ viết `Naṅgalakūṭa` (theo cách ghi của bản Việt tham khảo); dhp377:1-2 `pupphāni` là hoa chứ không phải cánh hoa, `vassikā` là cây lài (bản cũ viết "hoa nhài rời bỏ những cánh úa tàn"); dhp371:3 bỏ "nóng" vì Pāli không có (ý nóng đã nằm ở `dayhamāno`); dhp367:2 bỏ dấu nháy "của ta" mà Pāli không có; dhp365:0 bỏ "hai" vì tên truyện `Vipakkhasevakabhikkhuvatthu` không có số.
  - Thuật ngữ theo tiền lệ đã đếm: dhp360:1-4 và dhp361:1-6 dùng "chế ngự" (câu Pāli `Kāyena saṁvaro sādhu…` trùng nguyên văn ở sn3.5 và pe2:179, mỗi nơi đều "chế ngự"; "hộ trì" chỉ có ở bài này, còn Milinda dùng "gìn giữ" cho riêng nó); dhp362:3 "vui thích nội tâm" (6 nơi trùng Pāli, 0 nơi "bên trong"); dhp367:1-4 "Hoàn toàn đối với danh sắc", "không sầu muộn vì điều không có", "vị ấy mới được gọi là tỳ-kheo" (đều trùng nguyên văn các câu đã có, riêng câu cuối trùng dhp267:4); dhp381:3 "tịch tịnh" cho `padaṁ santaṁ` để khớp dhp368:3 trong chính bài (3 cặp Pāli trùng trong bài, nay cả 3 cặp đều giống nhau); dhp380:3 `gati` thành "nơi đến" (an9.72 dùng "nơi đến", "nơi đi" chỉ có ở bài này); dhp371:2 `kāmaguṇe` thành "các dục lạc" (13 nơi "dục lạc" so với 4 nơi "các dục"); dhp362:0 `haṁsa` thành "thiên nga" (160 nơi so với 4 nơi "hạc"); dhp376:3 `paṭisanthāra` thành "đón tiếp ân cần" (an7.70, an6.32; "giao thiệp" chỉ có 1 nơi, chính là bài này); dhp376:4 `ācāra` thành "hạnh kiểm".
  - Ranh giới khoá: dhp373 `bhikkhuno` nằm ở khoá 2 nhưng bản cũ đặt "tỳ-kheo" ở khoá 1; đã dời về đúng khoá và dùng lại "vị tỳ-kheo tâm an tịnh" (2 nơi trùng Pāli).
  - Điểm đổi: semantic_fidelity 9.5 thành 9.4, grammar_logic 9.6 thành 9.5, ambiguity_integrity 9.6 thành 9.4 (bản trước không ghi bất định nào, còn bản này nay ghi rõ các chỗ chưa phân xử được dưới đây); technical_integrity 10.0 thành 9.6 vì bản đã sửa chưa chạy lại cổng kỹ thuật; final_score 9.69 thành 9.61. Các tiêu chí còn lại giữ nguyên, không có cải thiện cụ thể nào để nâng.

  Bất định còn lại, giữ nguyên trong ghi chú, không thêm vào lời kinh.
  - dhp365:1 và dhp366:2 `salābhaṁ`: bản dịch theo cách hiểu truyền thống là tân ngữ ("lợi lộc mình được"). Bản Anh Sujato hiểu khác (tỳ-kheo "khá giả" không nên xem thường người khác). Dạng `-aṁ` thiên về tân ngữ nhưng không loại trừ hẳn cách hiểu kia.
  - dhp362:2 `saṁyatuttamo`: giữ "thu thúc tối thượng" (Sujato: "the supreme restraint"); bản Việt tham khảo đọc thành "đầu". Hợp chất Pāli là `saṁyata` + `uttama`, không phải `uttamaṅga`, nhưng chưa có căn cứ độc lập khác để chắc chắn.
  - dhp377:2 `maddavāni`: giữ "úa tàn" theo nghĩa "héo úa"; không đối chiếu được từ điển trong lượt này.
  - Tiêu đề các truyện (`:0`): nội dung truyện chú giải chưa được đối chiếu; chỉ dịch sát tên ghép Pāli. dhp365:0 không còn "hai"; nếu chú giải xác nhận số hai thì đó là thông tin ngoài Pāli của tiêu đề.
  - dhp375:4 `pātimokkhe ca saṁvaro`: ba cách dịch tiền lệ khác nhau ("hộ trì giới luật" ở dhp185 và ud4.6, "thu thúc theo giới Pātimokkha" ở dn14) nên chưa có đa số; giữ "thu thúc theo giới bổn".
  - dhp378: "tịch tĩnh" cho `santa-` ở khoá 1-2 khác chữ "tịch tịnh" ở dhp368/373/381 và không thống nhất với tầng ("an tịnh" chiếm đa số cho `santo`); không đổi vì mỗi dạng Pāli có tiền lệ riêng.
  - Ngoài phạm vi (báo, không sửa): mn130:25.5 và an7.72:11-12 dịch `lohaguḷaṁ` thành "viên đồng nung đỏ", trong khi dhp371:3 dịch "viên sắt".

  Cổng kỹ thuật: lượt này không chạy được `npm run validate`, `npm test`, `npm run check`, `npm run build`; technical_integrity đặt 9.6 và cần chạy đủ bốn lệnh trước khi coi là đạt.
