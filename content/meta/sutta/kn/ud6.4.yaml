notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud6.4:32.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud6.4:32.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt quét lỏng): khoá 7.2 — “Mạng sống là một, thân thể là một” → “Mạng sống là một, thân thể là một khác” (`aññaṁ jīvaṁ aññaṁ sarīraṁ` là hai thứ khác nhau, bản trước đọc thành hai cái một; theo công thức đa số, 12 khoá trong toàn tầng). Giữ nguyên khoá 4.2, 5.2, 6.2 (“hữu hạn”, “vô hạn”, “chân lý … sai lầm” cho `idameva saccaṁ moghamaññaṁ`) vì đúng nghĩa, chỉ khác bản đa số ở thuật ngữ và nhất quán trong bài.
