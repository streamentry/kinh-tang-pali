notes: |-
  **Đo lại ba mệnh đề.** `0.1` Pāli `Therāpadāna` → giữ Pāli **324/333**; 9 tệp dùng
  *Trưởng Lão Ký Sự* → theo đa số, giữ Pāli. `0.2` Pāli `Vibhītakavagga` → **Phẩm Cây
  Vibhītaka** 6/7 (tệp lạ là *Phẩm Quả Vibhītaka* ở tha-ap447) → theo đa số.
  `0.3` Pāli `Pādapīṭhiyattheraapadāna` → 0 tiền lệ cho đúng chuỗi này; đếm khuôn mẫu của
  `tha-ap:0.3` trên toàn tầng cho *Bài Kệ Tuyên Ngợ Về Trưởng Lão* là **160+**, *Ký Sự Về
  Trưởng Lão* 84, *Bài Kệ Tuyên Ngôn Về Trưởng Lão* 65 → theo đa số. Pāli ở `0.3` không
  có số thứ tự, và trong tầng thì 284 tệp không có số so với 49 tệp có số, nên tôi không
  thêm số ở `0.3`; số nằm ở `13.1` theo mẫu `<tiêu đề>, thứ N.` (đúng như `tha-ap445:10.1`,
  `tha-ap446:11.1`).

  **Tiền lệ trùng nguyên văn — 13 khoá, tất cả dùng lại nguyên văn.** Đây là bài được dùng
  lại nhiều nhất trong lát, nên cả hai chiều đều phải khớp: `1.1`←`tha-ap47:1.1`
  (*Đức Chánh Đẳng Giác tôn hiệu Sumedha,*); `2.3`←`tha-ap506:2.3` (*Với tâm tịnh tín hân
  hoan,*); `3.4`←`tha-ap496:2.4` (*tôi đã sanh về cõi trời Đạo Lợi (Tāvatiṁsa).*);
  `7.4`←`thi-ap3:2.4`; `8.1`←`tha-ap47:4.1` (*Vào ba mươi ngàn kiếp trước đây,*);
  `8.2`←`tha-ap366:3.2` (*khi ta làm thiện nghiệp ấy;*); `8.3`←`thi-ap2:3.3` (*Con không
  còn biết đến bất kỳ đọa xứ nào* — 307 tệp đã dùng, nên đây là cách đã chốt của tầng);
  `9.1`←`thi-ap3:3.1`; `9.3`←`thag5.5:2.4`; `10.1`←`thi-ap3:4.1`; `10.3`←`thi-ap3:4.3`;
  `11.1`←`thi-ap3:5.1`; `11.3`←`thi-ap3:5.3`.
  `12.1` không trùng nguyên văn nhưng theo đúng khuôn dùng ở `tha-ap446:10.1` và `tha-ap445`
  cho câu `Itthaṁ sudaṁ āyasmā … abhāsitthāti`: *Tôi nghe như vầy: Tôn giả Trưởng lão …
  đã nói những bài kệ này.*

  **⚠ KHAI TÊN VÀO BỘ NHỚ TIẾN TRÌNH — CẦN NGƯỜI BIÊN TẬP BIẾT.**
  Chốt `lọt_pāli` trong `_hvi.py` chặn `Pādapīṭhiyo` ở khoá `0.3`: tên Trưởng lão có
  thật trong Pāli của chính bài này (`2.4` `pādapīṭhamakārayiṁ`, `12.1` `pādapīṭhiyo`),
  nhưng ở `0.3` nó nằm trong chuỗi ghép `Pādapīṭhiyattheraapadāna`, nên hàm tách từ không
  ra `Pādapīṭhiyo` và coi đây là Pāli lọt vào bản Việt. Docstring của chính `_hvi.py` nói
  rõ trường hợp này phải *"khai tên vào bộ nhớ tiến trình"*, nên tôi gọi
  `_GIỮ.add("Pādapīṭhiyo")` ngay trong `_tvd_70.py` **trước** khi `save_vi`. Tôi **không sửa
  `_hvi.py`**. Tên dùng trong cả bài là `Pādapīṭhiyo` — đúng dạng có mặt trong Pāli đã ghim
  (`pādapīṭhiyo`), không phải dạng `Pādapīṭhiya` tôi viết nháp đầu tiên. Nếu đồng đội khác
  cũng gặp blocker này thì đây là cách xử lý, nhưng **giải pháp đúng hơn về lâu dài** là
  bổ sung tiền tố vào `pāli_riêng` ở cấp cả bài, việc đó thuộc người sửa `_hvi.py`.

  **Dấu lược `…pe…` — 3 khoá, giữ đúng MỘT `…` mỗi khoá, KHÔNG mở rộng.** `9.2`, `10.2`,
  `11.2` đều chỉ là `…pe…` trong Pāli; bản Việt để trắng chỉ một `…`, đúng luật 10.1 của
  brief (mở rộng là thêm chữ không có nguồn). Vì `9.3`, `10.3`, `11.3` đã có bản dịch sẵn ở
  `thi-ap`/`thag` nên đoạn lược không làm mất nghĩa câu kệ.

  **Chỗ phải tự quyết, ghi rõ là chọn.**
  - `6.2` `vāṇijjaṁ suppayojitaṁ`: 0 tiền lệ trong tầng. Tôi dịch *một việc trao đổi được
    sắp đặt chu đáo*. `vāṇijja` là thuộc về thương mại/trao đổi, `suppayojita` là đã giao
    hẳn hoi sao; tôi không thay bằng *bối thí* vì Pāli không nói cho không.
  - `3.2` `sukhapākaṁ sukhudrayaṁ` → *công đức chín muồi, gốc rễ lành*: `sukha` ở đây là
    “lành/tốt”, `pāka` là chín, `udraya` là gốc rễ.
  - `5.3` `Nibbute kāraṁ katvāna` → *Khi đã làm cho sự khổ đau hoàn toàn dứt*: `kāra` là khổ
    đau, `nibbuta` là dứt hẳn.
  - `7.2` `kenaci kiccayenahaṁ` → *tôi cũng không bị ai chắn ngang*: `kicci` là vướng chắn.
  - `8.4` `pādapīṭhassidaṁ phalaṁ` → *đây là quả báo của việc cúi đầu lễ bái*, đối xứng với
    `7.4` (dùng lại nguyên văn *đây là quả báo của việc làm phước thiện* cho
    `puññakammassidaṁ phalaṁ`).

  **Dấu lược và nháy kép đã đối chiếu bằng script** cho cả 46 khoá: `9.2/10.2/11.2` lược 1
  ở Pāli và 1 ở bản Việt, 43 khoá còn lại lược 0 ở cả hai; nháy kép mở ở `1.1`, đóng ở
  `11.3` (kèm `”.` như Pāli), cân trên toàn bài.

  **Triangulation:** không có tầng Anh đã ghim cho `tha-ap` (xem blocker) nên bài chỉ dịch
  từ Pāli đã ghim cùng commit (`11c9d708978cde8ba61096d8a75f7ddfb846f639`) cùng tiền lệ
  đếm được trong chính tầng Việt dự án. Không chạy được `npm run validate|test|check|build`
  theo lệnh phân công đợt này, nên technical_integrity là 9.6.