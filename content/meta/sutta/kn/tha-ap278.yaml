notes: |-
  Đã đọc HẾT Pāli lát ở `f121.pali.txt` trước khi viết chữ nào. 16 khoá, tất cả đã dịch.

  TẦNG THAM KHẢO — 0/16 có Anh Sujato (edition `translation/en/sujato` tại commit đã ghin có **0 tệp `kn/`**),
  không có Việt hiện hành, không có lớp lấp `english-project`. ⇒ `draft`, `triangulation` 7.0.

  `Itthaṁ sudaṁ āyasmā … thero imā gāthāyo abhāsitthāti.` dùng lại **nguyên văn** khuôn đã có trong tầng:
  *Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này.* Trong 69 tệp `tha-ap` đã có, dạng này
  41 lần và dạng *đã từng nói bài kệ này* 28 lần, nên tôi theo đa số **trong chính tác phẩm này** (như
  tha-ap243 và tha-ap313 cũng vậy). Công thức này **không có vocative** trong Pāli, nên bản dịch không thêm lời
  hô nào; cũng vì vậy chỗ nào Pāli **không** có `bhagavā/bhagavato` thì tôi không dùng “Đức Thế Tôn”.

  `3.1–3.3` dùng lại nguyên văn công thức của tha-ap243: *Bốn vô ngại giải,* / *…* / *đã làm tròn lời dạy
  của Đức Phật”.* Dấu lược ở `3.2` **giữ đúng một** `…` theo BRIEF_VI3 §10.1 (Pāli ghi `…pe…`), không mở rộng:
  công thức `Chaḷabhiññā sacchikatā` chỉ xuất hiện ở hai bài `tha-ap` khác (tha-ap243, tha-ap313) và ở đây
  Pāli đã lược, nên viết thêm là thêm chữ không nguồn nào chứng thực. Trong tầng có 27 tệp dùng đúng một `…`
  cho `…pe…`, tôi theo.

  Số thứ tự uddāna đã đối chiếu **chuỗi trong phẩm**, không suy từ tên uid:
  · `tha-ap278` là số 6 trong `Suvaṇṇabibbohanavagga` (273–282): 273 `paṭhamaṁ`,
  274 `dutiyaṁ`, 275 `tatiyaṁ`, 276 `catutthaṁ`, 277 `pañcamaṁ`, 278 `chaṭṭhaṁ`. `0.3` mang số `6` ⇒ giữ số,
  khớp `5.1`; `tha-ap281` là số 9 của cùng phẩm.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điền phối, nên
  `technical_integrity` bị chặn ở **9.6**. Bốn lệnh đó để người điền phối chạy. Tôi đã tự tái lập bằng script
  những kiểm mà `validate` làm cho tầng Việt: đủ 16 khoá với đúng segment ID, 0 orphan, 0 rỗng, mọi khoá NFC,
  dấu lược khớp Pāli **từng khoá**, không có `(…)`, ngoặc kép `“”` cân trên cả bài, và không có Pāli lọt
  vào bản Việt. Đây **không** thay thế được `validate`.

  **DÙNG LẠI HAI TIỀN LỆ NGUYÊN VĂN.** `1.4 dakkhiṇeyye anuttare.` trùng nguyên văn với 3 tệp đã có
  (`sn1.8`, `sn1.9` và một tệp nữa) dịch *xứng đáng được cúng dường vô thượng;* / *đáng cúng dường, vô thượng;*
  / *bậc vô thượng xứng đáng cúng dường;*. Trước lượt tôi viết *tối thượng* — nhưng `anuttara` trong tầng đã
  dùng cả hai, và với đúng cụm này thì **vô thượng** là dạng đã có, nên tôi đổi sang để không tạo cách thứ
  hai cho cùng một Pāli. Cũng dùng lại *đáng cúng dường*.

  `1.4` còn thêm *cho bậc* so với tiền lệ *đáng cúng dường, vô thượng;* (`an5.32:8.4`): ở đó tân ngữ
  *tin vào* nằm ở `8.3` nên `8.4` không cần tân ngữ; còn ở đây `1.3` là *Cuốn sách ta đã trao* — tân ngữ
  *trao* **bắt buộc** phải có sở hữu tân, mà `dakkhiṇeyye` là cách sở hữu giới từ nên cần *cho*. Tôi giữ
  *cho bậc* và ghi lại đây để biên tập quyết nếu muốn một dạng thống nhất.

  `1.1–1.2 Satthāraṁ dhammamārabbha, saṅghañcāpi mahesinaṁ`. `mārabbha` = đã nắm được, `dhammamārabbha`
  là **quy cách sở hữu** (“từ bậc Thầy mà học giáo pháp”), tôi dịch *Ta đã học giáo pháp từ bậc Thầy,*;
  `saṅghañcāpi mahesinaṁ` = “và cả Tăng đoàn của các Đại Hiền”, tôi dịch *cùng cả Tăng đoàn của các Đại
  Hiền;*. `mahi` là “những bậc vĩ đại”, không phải *đại vương* — đó là tiền lệ dễ nhầm.

  `pottha` = sách vở (sách lá bối), `Potthadāna` = sự trao sách; dịch *Cuốn sách ta đã trao* / *… của việc
  trao sách*. `Suvaṇṇabibbohanavagga` → *Phẩm Bậc Nắm Vàng*: đặt mới, 0 tiền lệ; `Suvaṇṇabibbohani`
  (tha-ap273) là phần tử đầu phẩm, và `273:1.3 Bibbohanañca pādāsiṁ` = “ta đã trao một nắm”, nên
  *suvaṇṇa` + `bibbohana` = nắm vàng. Không bịa thêm.

  `0.3` giữ chữ số `6` — cùng lý do đã ghi ở `tha-ap246`.

  **SỬA LỚP LỖI SỐ PĀLI (lỗi loại 2 của quality gate — sai *số lượng*), 2026-10-05.**
  - `tha-ap278:2.1` (`Ekanavutito kappe,`) = **91**: `eka` 1 + `navuti` 90 = 91.
    Bản dịch cũ *Từ chín mươi **chín** kiếp trước,* là **99** — sai. Đã sửa thành *Từ chín mươi **mốt** kiếp trước,*. Tiền lệ trong chính tầng: 86 khoá cùng `Ekanavutito` đã viết *chín mươi mốt* (= 91) và **0** khoá nào viết *một*; 21 khoá sai nằm ở 21 tệp này (chính là số đo trước khi sửa).
  - Vế trước/sau, dấu câu và mọi thứ khác trong câu giữ nguyên y như cũ.

