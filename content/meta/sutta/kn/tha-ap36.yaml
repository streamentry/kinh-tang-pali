notes: |-
  Bản dịch chỉ từ Pāli root do commit đã ghim không có bản Anh upstream (giới hạn upstream); không có bản Việt hiện hành cho bài này. Đầy đủ 68 khoá, đúng thứ tự Pāli.
  Tiêu đề `:0.3` Pāli bắt đầu bằng chữ (không có số thứ tự) nên `translationTitle` và `:0.3` đều không mang số. Chọn "Tuyên Ngôn" (đúng chính tả, cùng phẩm: tha-ap34, 38, 39) thay vì "Tuyên Ngợ" (nhiều nhất toàn tầng đã dịch nhưng sai chính tả); đây là lựa chọn biên tập, chờ biên tập phán một lượt cho cả cuốn.
  Cấu trúc nháy: ngoặc kép “ mở ở 1.1 và đóng ở 16.3, nháy đơn ‘ mở ở 6.1 và đóng ở 13.4, giữ đúng theo từng khoá Pāli. Các kệ 4–5 là lời Đức Phật (không có dấu nháy riêng trong Pāli) nên dùng "ta" cho Đức Phật và "tôi" cho vị trưởng lão.
  Số lượng: Dasa aṭṭha cakkhattuṁ = mười tám lần (10 + 8, ca + khattuṁ); Pañcavīsatikkhattuñca = hai mươi lăm lần (5 + 20); Kappasatasahassamhi = một trăm ngàn kiếp (100 × 1.000).
  Bất định: (1) 8.3 `Pathabyā rajjaṁ pañcasataṁ` không nêu đơn vị; dịch "năm trăm lần" theo song song với `-khattuṁ` ở 6.1 và 8.1. Bài tha-ap61:6.3 (`sattasataṁ`) đã dịch "bảy trăm năm" — hai cách hiểu chưa thống nhất, cần biên tập phán cho các bài cùng công thức. (2) 6.3–6.4 `Uppalaṁ padumañcāpi, mallikañca taduttari` là cụm tỉnh lược, không có động từ riêng; dịch sát chữ ("còn hơn thế nữa"), không thêm vai trò ngữ pháp. (3) 7.2 `dibbagandhasamāyutaṁ` (trung tính) có thể bổ nghĩa cho mái che hoặc hoa; giữ ở dòng riêng, không ép. (4) 10.4 `ñātibandhu` không nêu đối tượng; dịch "bà con thân tộc". (5) 12.4 và 15.4 `etadagge ṭhapessati/ṭhapesi` dịch "vị trí tối thắng"; không có tiền lệ cùng bộ để đối chiếu. (6) 14.2 `makkho`: tầng có hai cách ("gièm pha" 2, "khinh miệt" 2 ở cụm `māno makkho ca`); chọn "gièm pha". (7) 5.3 `kittayissāmi` dịch "tán thán" (4 tiền lệ trong tầng so với "tán dương" 1).
  Hai lỗi trong tiền lệ của tầng, không tái dùng và không sửa ngoài phạm vi: `Paribhuñji mahāvīro` từng được dịch "Bậc Đại Anh Hùng đã nhổ sạch" (paribhuñji = thọ dụng/dùng bữa); đã dịch "đã thọ dụng" ở 3.1.
  Lời kết 17.1 dùng nhóm "đã nói những bài kệ này" (407 khoá), không dùng "đã từng nói bài kệ này".
  Chưa chạy các cổng của kho: `npm run validate`, `npm test`, `npm run check`, `npm run build`; technical_integrity đặt 9.6 và không tuyên bố các cổng đã đạt.
