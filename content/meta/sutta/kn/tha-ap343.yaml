notes: |-
  Đã đọc HẾT p66.txt trước khi viết. Cùng hình thức với tha-ap113 nhưng kể chuyện Đức
  Padumuttara và vị trở lại Dīpacetiya; dùng tha-ap113/117/119 làm khuôn.
  
  MỆNH ĐỀ ĐO LẠI.
  `:0.1` `Therāpadāna` giữ Pāli — 322/331 như trên. `:0.2` `Ekapadumiyavagga` → `Phẩm
  Ekapadumiya`: đo bằng cách nối Pāli, trong 5 bài cùng phẩm đã có bản Việt thì **5** dùng
  `Phẩm Ekapadumiya` và 2 dùng `Phẩm Bậc Một Hoa Sen` (tha-ap346, 351) — đa số `Ekapadumiya`,
  nên tôi theo đa số. Lưu ý hai bản kia dùng `Bậc Một Hoa Sen` (dịch nghĩa `ekapadumiya`
  = một vòng hoa sen), tức là cùng một phẩm mà hai cách; nếu người biên tập muốn thống nhất
  thì phải chọn một cách cho cả 7 bài.
  `:0.3` Pāli **không** có số thứ tự (`Ekapadumiyattheraapadāna`), khác `tha-ap113:0.3`
  (`1 Mahāparivāraka…` có số) — nên theo hình không số: `Bài Kệ Tuyên Ngợ Về Trưởng Lão
  Ekapadumiya` (như `tha-ap119:0.3`).
  
  TRÙNG NGUYÊN VĂN TRONG LÁT — ĐÃ DÙNG LẠI Y HỆT.
  `:10.1–10.4` của bài này **trùng nguyên văn** `tha-ap113:10.1–10.4`; `:9.2–9.4` trùng
  `tha-ap113:8.2–8.4`. Cả hai cặp đã dùng lại đúng y hệt bản Việt đã ghi ở tha-ap113, nên
  hai bài không tự mâu thuẫn. Ngoài ra `:3.1–3.2` trùng với chính `:6.1–6.2` của bài này
  (`Padumuttaro lokavidū,` / `āhutīnaṁ paṭiggaho;`) — cũng đã dùng lại y hệt.
  
  TIỀN LỆ DÙNG LẠI (số đếm).
  `Paṭisambhidā catasso,` `Bốn vô ngại giải,` 337; `vimokkhāpi ca aṭṭhime;` `và tám giải
  thoát này;` 22; `Chaḷabhiññā sacchikatā,` `Sáu thắng trí đã chứng đắc,` 23; `kataṁ buddhassa
  sāsanaṁ”.` `đã làm tròn lời dạy của Đức Phật”.` 304 — cùng số đếm như tha-ap113.
  `“Padumuttaro nāma jino,` → `“Đức Chiến Thắng tên Padumuttara,` (**4**, tha-ap146:1.1) —
  một bản khác là `“Bậc Chiến Thắng tên là Padumuttara,` (1). `sabbadhammāna pāragū;` →
  `bậc đã vượt qua mọi pháp;` (2). `pāragū` cũng có `bậc thông đạt…` nhưng nghĩa hẹp hơn.
  `Padumuttaro lokavidū,` → `Đức Padumuttara, bậc hiểu rõ thế giới,` (2, tha-ap136:2.1).
  `āhutīnaṁ paṭiggaho;` → `bậc tiếp nhận lễ vật hiến cúng;` (3) — cùng Pāli với
  `thag10.4:10.2`, dùng lại y hệt trong cả hai bài.
  `Antalikkhe ṭhito satthā,` → `… Bậc Đạo Sư đứng giữa hư không,` (1, tha-ap69:3.3); tôi giữ
  `đứng` vì `ṭhita` là đứng, bản nháp đầu ghi `ngự`.
  `cetanāpaṇidhīhi ca;` → `cùng với tâm nguyện và chí hướng;` (**11**, tha-ap148:3.2).
  `Kappānaṁ satasahassaṁ,` → `Trong suốt một trăm ngàn kiếp,` (4, tha-ap107:3.3).
  `Satasahassito kappe,` → `Vào một trăm ngàn đại kiếp trước,` (**10**). Bản nháp đầu ghi
  `Từ một trăm ngàn đại kiếp trước,` — đã theo đa số.
  `Duggatiṁ nābhijānāmi,` `Tôi không biết mình rơi vào khổ đau,` (đa số 103 lần cho hình
  `không biết mình rơi vào khổ đau`, đổi `Ta` → `Tôi` cho khớp ngôi kể).
  `buddhapūjāyidaṁ phalaṁ.` `đây là quả báo của việc cúng dường Đức Phật.` (25).
  `Idaṁ vatvāna sambuddho,` → `Sau khi nói lời này, bậc Tự Tại Giác,` (tha-ap331:5.1).
  `buddhaseṭṭhaṁ` → `Tối Thắng Trong Các Đức Phật` (theo `tha-ap117:6.2`).
  
  BẤT ĐỊNH ĐÃ GHI.
  (1) `:1.3–1.4` là lời **tán dương** Đức Phật ở ngôi hai (`vibhāvento, tāresi` — ngươi đã
  phá vỡ, ngươi đã cứu), rồi từ `:2.1` bài chuyển sang ngôi một kể về chính mình
  (`homi, ahaṁ, samogayha, kīḷāmi`). Đó là mô hình quen thuộc của `Therāpadāna`: ngôi tán
  dương rồi tới ngôi kể. Tôi giữ đúng hai ngôi, đổi `ta` thành `tôi` ở ngôi một cho nhất
  quán.
  (2) `Haṁsarājā` (`:2.1`) — **0 tiền lệ** trong toàn tầng. Danh xưng này là biệt hiệu của
  Indra, nghĩa sơn là `vua bầy thiên nga`; tôi dịch `vua Thiên Nga` để **không** tự ý
  đổi thành `Inda` (tác giả không nói `inda` ở khoá này). Ở `tha-ap113:3.4` Pāli **có** `indaṁva`
  nên mới dịch `như Inda cùng nhóm Tidasa`.
  (3) `Jātassara` (`:2.3`, `:3.3`) — **1** tiền lệ trong tầng và nó là nghĩa khác
  (`Ở giữa hồ nước tự nhiên`), không dùng được. Đây là bảo bảo sinh cùng mình
  (cintāmaṇi): `:2.3` dịch `bảo bảo sinh cùng mình`. `:3.3` `Jātassarassa upari` (`upari` =
  trên/tại) thì **mơ hồ thật sự** — có thể là `tại lễ vật hiến dâng bảo bảo sinh ấy`. Tôi giữ
  nguyên nghĩa `upari`: `trên bảo bảo sinh cùng mình ấy,`, và **không** thêm cụm `lễ vật
  hiến dâng` vì Pāli không nói. Đây là chỗ khó nhất của bài.
  (4) `devadevaṁ / sayambhuṁ lokanāyakaṁ` (`:4.1–4.2`) — 7 tiền lệ cho `devadeva` và 22 cho
  `lokanāyaka` nhưng **không tiền lệ nào trùng đủ cụm**, và Pāli không đánh dấu chủ thể.
  Cách đọc của tôi: cả `4.1` và `4.2` cùng nói một người (`Đấng thần của các thần` /
  `Đấng Tự Tại` / `Đấng Dẫn Đạo thế gian`), rồi `4.3` họ bẻ gãy cánh sen — khớp với truyện
  Padumuttara. Nếu đọc `devadevaṁ` là tân ngữ chỉ `4.1` thì `4.2` trở thành chủ ngữ mới;
  cả hai cách đều defend được, tôi chọn cách ít giả định hơn và ghi ra đây.
  (5) `Mukhatuṇḍena` (`:5.1`) — **0 tiền lệ**. Nghĩa sơn: `nắm đấm khép kín như nắm miệng`.
  Tôi dịch `bằng nắm đấm khép kín`. Bản nháp đầu ghi `bằng nắm tay khép kín miệng` — rối
  và dịch sai `mukha` thành miệng thật — đã sửa.
  (6) `:8.2` `jalajuttamanāmako` — 3 tiền lệ cho `jalajutta` là `Tối Thượng Sinh Ra Từ
  Nước`, `Tối Thượng Tựa Sen Hồng`; tôi theo hình thứ hai: `được gọi là bậc Tối Thượng
  Tựa Hồng Sen;`.
  (7) `:8.4` `agamā yena patthitaṁ.` — `patthita` = đã đến. Tôi dịch `đã đi đến nơi bậc ấy đã
  đến.` và không ghi `ngài`, vì `ngài` sẽ trỏ về chính người kể.
  (8) `:9.2` `yaṁ kammamakariṁ tadā;` — đa số 9 lần là `khi ta làm thiện nghiệp ấy;` nhưng
  Pāli không có `sila`; tôi dịch `khi tôi làm nghiệp ấy;` (lý do giống tha-ap113).
  `technical_integrity` đặt 9.6 vì không có ai rà lại bằng con người.
