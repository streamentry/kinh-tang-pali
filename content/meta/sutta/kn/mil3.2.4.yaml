notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho mil3.2.4.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 26 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.
  - Sửa lan 2026-10-13: khoá `1.8` (`yo hetu yo paccayo … anuparamā … uparamā`): "nguyên nhân và duyên khởi … chưa dứt trừ / đã tịch diệt" → "nhân nào, duyên nào … do nhân ấy, duyên ấy chưa chấm dứt / đã chấm dứt", cùng cách dịch cặp `hetu`/`paccaya` và `uparamā` ở `mil3.2.2:1.5`, `2.6`, `2.7`; khoá `0.2` (`Addhānavagga`): "Phẩm Thời Gian" → "Phẩm Khoảng Thời Gian", khớp 7/9 bài cùng phẩm `mil3.2.1`–`mil3.2.9` (hai bài còn lại là `mil3.2.4` và `mil3.2.5`, cùng sửa trong đợt này).

  Quyết định hội đồng biên tập 2026-10-16: B6 — mil3.2.4:4.4 (sati ở Milinda = “niệm” hoặc “trí nhớ”, “chánh niệm” chỉ cho sammāsati).
