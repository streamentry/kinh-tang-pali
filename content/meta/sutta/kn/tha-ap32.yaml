notes: |-
  Bản dịch tiếng Việt mới cho bài kinh tha-ap32 — trưởng lão Khomadāyako, bài thứ mười
  và bài cuối của Subhūtivagga. Tên bài nghĩa là vị trưởng lão dâng vải lanh.

  Tiền kiếp: ở kinh đô Bandhumatī ông là thương nhân, tự mình nuôi dưỡng người vợ ấy và
  gieo hạt giống của điều lành; Đức Vipassī đến đại lộ ấy và ông dâng một tấm vải lanh vì lợi
  lành cho bậc Đạo Sư. Vào chín mươi mốt kiếp trước là quả của việc cúng dường vải lanh;
  vào mười bảy kiếp trước có một vị làm vua có đủ bảy món báu, làm chúa trên bốn châu lục.

  Bất định đã ghi lại, không sửa trong kinh:
  - `Rathiyaṁ paṭipannassa, vipassissa mahesino` (2.1–2.2) là cụm danh từ rời trong Pāli.
    `rathiya` dịch là đại lộ theo ba cặp tiền lệ tha-ap259:1.2 và tha-ap186:1.4. Bản dịch
    giữ vị trí từng vế và không thêm chủ ngữ.
  - `Ekaṁ khomaṁ` dịch là một tấm vải lanh: `khoma` là vải lanh (xem phần Sửa lan bên dưới).
  - `bījasampadaṁ` (1.4) dịch là hạt giống của điều lành, không mở rộng thành công đức
    hay giới luật.
  - `Catutthabhāṇavāraṁ` (12.1) dịch là Lần thứ tư. Cụm này không có tiền lệ trong tầng
    Việt; theo mẫu `<số thứ tự> bhāṇavāraṁ` của chính hệ Apadāna ở ha-ap và a-ap thì nó
    là dấu hiệu lần tuyên thuyết, không phải tiêu đề mới.
  - uddāna 9.1–10.1 giữ tên Pāli nguyên văn như tiền lệ tha-ap252:9, kể cả ba dạng gốc
    `dhūpo`, `pulino`, `uttiyena` — vì đó là các danh từ gốc của kinh, dịch ra sẽ thành
    lời bịa.
  - `Subhūtivaggo tatiyo` (11.1) là phẩm thứ ba; số thứ tự phẩm truyền thống ở đây không
    theo chỉ số bài, dịch đúng như Pāli.
  - `Vimokkhāpi ca aṭṭhime` dịch giống hệt tha-ap31:4.2 và tha-ap27:6.2.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của chính tầng Việt qua `_hvi.save_vi`: đủ 36/36 khoá, cân ngoặc kép trên cả bài, đúng số dấu lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10 tiêu chí, tính bằng script.

  Sửa lan 2026-10-13: khoá 2.3, 3.2, 3.4 — `khoma` trước dịch là bột thọ (một đo bột thọ / bột thọ ấy / cúng dường bột thọ), sau sửa là vải lanh (một tấm vải lanh / tấm vải lanh ấy / cúng dường vải lanh). Căn cứ: `khoma` là vải lanh, và `khomakappāsikāni` (vải lanh và vải bông) cùng `vatthaṁ khomaṁ` đã dịch vải lanh ở tha-ap15:1.3 và tha-ap340:14.2, tha-ap393:97.2, tha-ap430:21.2, tha-ap503:24.2, tha-ap558:24.2, tha-ap45:5.4, thi-ap11:12.2, tha-ap345:6.3 (9 nơi trong tầng dùng vải lanh, 0 nơi khác ngoài tha-ap32). Các dòng mô tả trong notes (Tên bài, Tiền kiếp, Ekaṁ khomaṁ) đã sửa theo.

  Sửa lan 2026-10-13 (accuracy fix): `tha-ap32:4.1` `Sattarase ito kappe` "Vào hai mươi hai kiếp trước," → "Vào mười bảy kiếp trước,". Phép tính: `sattarasa` = `satta` (7) + `dasa` (10) = 17 (không phải 22; 22 là `dvāvīsati`); cấu trúc song song với 3.1 `Ekanavutito kappe` = 91 kiếp. `tha-ap32:4.2` `eko sindhavasandhano;` "có một vị đã vượt bờ bên kia sông;" → "có một vị là Sindhavasandhana;". Bản cũ là diễn giải không có căn cứ: không có động từ "vượt" hay "bờ bên kia" trong Pāli; `sindhava` (Sindhu/sông Ấn, hoặc ngựa Sindhu) và `sandhana` (không có nghĩa "vượt") không đọc được thành cụm ấy, và không có tiền lệ trong tầng (`sindhava` chỉ còn ở `ja254`, `ja266`, `tha-ap57:4.2` với nghĩa ngựa/tên). Đọc `sindhavasandhano` như danh xưng của vị Chuyển Luân Vương ở 4.3–4.4 (cùng khuôn với `tha-ap10`, `tha-ap5`, `tha-ap63`: `sattaratanasampanno, catudīpamhi issaro`), nên giữ nguyên dạng Pāli thay vì đoán nghĩa. BẤT ĐỊNH chưa phân xử được: không rõ `sindhavasandhano` là tên riêng hay một tính ngữ, và chưa rõ vị ấy là chính người kể hay một vị khác — Pāli không có `ahosiṁ`; không có chú giải hay bản Anh trong tầng đã ghim để phân xử.
