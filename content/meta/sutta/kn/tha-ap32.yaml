notes: |-
  Bản dịch tiếng Việt mới cho bài kinh tha-ap32 — trưởng lão Khomadāyaka, bài thứ mười
  và bài cuối của Subhūtivagga. Tên bài nghĩa là vị trưởng lão dâng vải lanh.

  Tiền kiếp: tại kinh thành Bandhumatī ông là thương nhân, nhờ nghề ấy nuôi vợ và gieo trồng
  hạt giống tốt; khi Đức Vipassī đang bước đi trên đường phố, ông dâng Ngài một tấm vải lanh
  vì điều thiện. Từ chín mươi mốt kiếp trước ông không còn biết đến đọa xứ nào, đó là quả của
  việc cúng dường vải lanh; vào mười bảy kiếp trước có một vị Sindhavasandhana đầy đủ bảy
  món báu, làm vua trên bốn châu lục.

  Bất định đã ghi lại, không sửa trong kinh (các dòng dưới đây đã cập nhật theo lượt cải thiện
  2026-10-13; cách dịch cũ ghi trong mục ấy):
  - `Rathiyaṁ paṭipannassa, vipassissa mahesino` (2.1–2.2) là cụm sở hữu/tặng cách đứng trước
    động từ `dinnaṁ` của 2.3. `rathiya` dịch là đường phố theo đa số tầng (`Rathiyaṁ
    paṭipajjantaṁ` → *Khi Ngài đang bước đi trên đường phố* 7 khoá; *đường phố* tổng 11/14 khoá
    có `rathiyaṁ`). "Ngài" ở 2.1 là đại từ hồi chỉ cho Đức Vipassī ở 2.2, không thêm người mới.
  - `Ekaṁ khomaṁ` dịch là một tấm vải lanh: `khoma` là vải lanh (xem phần Sửa lan bên dưới).
  - `bījasampadaṁ` (1.4) dịch sát là hạt giống tốt (tiền lệ tha-ap55:2.2). Pāli không nói đây là
    nghĩa đen (làm ruộng) hay nghĩa bóng; bản dịch không chọn hộ.
  - `kusalatthāya` (2.4) dịch là vì điều thiện: điều thiện thuộc người dâng, không phải lợi ích
    cho bậc Đạo Sư. Không có tiền lệ trong tầng Việt.
  - `Catutthabhāṇavāraṁ` (12.1) dịch là Phần tụng đọc thứ tư, theo đa số tầng cho
    `bhāṇavāra` (*Phần tụng đọc thứ …*: tha-ap3:136.1, tha-ap51:15.1, tha-ap225:9.2, pv37, vv44…).
  - uddāna 9.1–10.1 giữ tên Pāli nhưng ở dạng gốc (Dhūpa, Pulina, Uttiya), như chính tha-ap252:9
    (`Patto` → Patta, `uddālakena` → Uddālaka) và tha-ap22:21 (`nando` → Nanda); `ca` dịch là "và"
    như tha-ap22:21–22.
  - `Subhūtivaggo tatiyo` (11.1) là phẩm thứ ba; số thứ tự phẩm truyền thống ở đây không
    theo chỉ số bài, dịch đúng như Pāli.
  - `Vimokkhāpi ca aṭṭhime` dịch giống hệt tha-ap31:4.2 và tha-ap27:6.2.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của chính tầng Việt qua `_hvi.save_vi`: đủ 36/36 khoá, cân ngoặc kép trên cả bài, đúng số dấu lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10 tiêu chí, tính bằng script.

  Sửa lan 2026-10-13: khoá 2.3, 3.2, 3.4 — `khoma` trước dịch là bột thọ (một đo bột thọ / bột thọ ấy / cúng dường bột thọ), sau sửa là vải lanh (một tấm vải lanh / tấm vải lanh ấy / cúng dường vải lanh). Căn cứ: `khoma` là vải lanh, và `khomakappāsikāni` (vải lanh và vải bông) cùng `vatthaṁ khomaṁ` đã dịch vải lanh ở tha-ap15:1.3 và tha-ap340:14.2, tha-ap393:97.2, tha-ap430:21.2, tha-ap503:24.2, tha-ap558:24.2, tha-ap45:5.4, thi-ap11:12.2, tha-ap345:6.3 (9 nơi trong tầng dùng vải lanh, 0 nơi khác ngoài tha-ap32). Các dòng mô tả trong notes (Tên bài, Tiền kiếp, Ekaṁ khomaṁ) đã sửa theo.

  Sửa lan 2026-10-13 (accuracy fix): `tha-ap32:4.1` `Sattarase ito kappe` "Vào hai mươi hai kiếp trước," → "Vào mười bảy kiếp trước,". Phép tính: `sattarasa` = `satta` (7) + `dasa` (10) = 17 (không phải 22; 22 là `dvāvīsati`); cấu trúc song song với 3.1 `Ekanavutito kappe` = 91 kiếp. `tha-ap32:4.2` `eko sindhavasandhano;` "có một vị đã vượt bờ bên kia sông;" → "có một vị là Sindhavasandhana;". Bản cũ là diễn giải không có căn cứ: không có động từ "vượt" hay "bờ bên kia" trong Pāli; `sindhava` (Sindhu/sông Ấn, hoặc ngựa Sindhu) và `sandhana` (không có nghĩa "vượt") không đọc được thành cụm ấy, và không có tiền lệ trong tầng (`sindhava` chỉ còn ở `ja254`, `ja266`, `tha-ap57:4.2` với nghĩa ngựa/tên). Đọc `sindhavasandhano` như danh xưng của vị Chuyển Luân Vương ở 4.3–4.4 (cùng khuôn với `tha-ap10`, `tha-ap5`, `tha-ap63`: `sattaratanasampanno, catudīpamhi issaro`), nên giữ nguyên dạng Pāli thay vì đoán nghĩa. BẤT ĐỊNH chưa phân xử được: không rõ `sindhavasandhano` là tên riêng hay một tính ngữ, và chưa rõ vị ấy là chính người kể hay một vị khác — Pāli không có `ahosiṁ`; không có chú giải hay bản Anh trong tầng đã ghim để phân xử.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 36/36 khoá, đổi 19/36 khoá.
  Accuracy fix — `10.3` `Pañcāsītisataṁ vuttā` "đã tuyên thuyết năm mươi tám bài kệ" → "Một trăm tám mươi lăm đã được nói": `pañcāsīti` = 85 (`pañca` 5 + `asīti` 80) + `sataṁ` 100 = 185, không phải 58; đếm lại Pāli của phẩm (tha-ap23–tha-ap32, bỏ uddāna) được khoảng 188–190 khổ, cùng cỡ 185, nên 58 là sai số. `10.2` `daseva tatiye gaṇe` "là nhóm thứ ba trong mười người" → "chỉ có mười vị trong nhóm thứ ba" (đảo vế; mẫu tha-ap22:22.2 `daseva dutiye vagge`). `1.3` `Teneva dāraṁ posemi` "Chính tôi nuôi dưỡng người vợ ấy" → "Chính nhờ đó, tôi nuôi vợ" (`tena eva` là "nhờ chính điều đó", tức nghề buôn ở 1.2, không phải "chính tôi"; không có "ấy" trong Pāli; mẫu tha-ap424:1.4, thi-ap10:1.4 `tena posemi` → "nhờ đó … nuôi"). `1.4` "gieo hạt giống của điều lành" → "và gieo trồng hạt giống tốt" (bỏ "điều lành" không có trong Pāli). `2.4` `kusalatthāya satthuno` "vì lợi ích lành cho bậc Đạo Sư" → "lên bậc Đạo Sư, vì điều thiện" (bản cũ đọc thành lợi ích của bậc Đạo Sư). `3.3` `Duggatiṁ nābhijānāmi` "Ta không biết mình rơi vào khổ đau" → "Tôi không còn biết đến đọa xứ nào": vị Trưởng lão kể tiền kiếp nên xưng "tôi" như mọi khoá khác trong bài; "không biết mình rơi vào khổ đau" lại có thể hiểu là "không nhận ra mình đang khổ", sai nghĩa `duggati` = đọa xứ. Đo tiền lệ: toàn tầng 454 khoá, nhóm "đọa xứ" chiếm đa số, dạng "Tôi không còn biết đến đọa xứ nào," 108; phạm vi gần tha-ap13–tha-ap42 dạng này 8/19 (không tính chính bài).
  `2.3` "tôi dâng" → "tôi đã dâng" (`dinnaṁ` quá khứ). `2.1` "Đã đến nơi đại lộ ấy" → "Khi Ngài đang bước đi trên đường phố" (`paṭipannassa` là đang đi, không phải "đã đến"; bỏ "ấy" không có trong Pāli; tiền lệ ở mục bất định). `1.1` "Ở kinh đô Bandhumatī" → "Tại kinh thành Bandhumatī" (Pāli `“Nagare bandhumatiyā,` trùng nguyên văn tha-ap437:1.1 và thi-ap10:1.1, cả hai đều dịch như vậy). `4.2` "có một vị là Sindhavasandhana" → "có một vị Sindhavasandhana" (mẫu tha-ap130:6.2 `eko pulinapupphiyo` → "có một vị Pulinapupphiya"). `12.1` "Lần thứ tư" → "Phần tụng đọc thứ tư" (đa số tầng). Terminology fix — tên Trưởng lão dùng dạng gốc Khomadāyaka ở `0.3`, `6.1`, `7.1` và `translationTitle`, như tha-ap27, tha-ap28, tha-ap31 cùng phẩm; uddāna `9.1`, `9.3`, `9.4`, `10.1` dùng dạng gốc và "và" cho `ca`. Mô tả cũ trong notes rằng tha-ap252:9 giữ dạng `-o`/`-ena` là sai (tha-ap252:9 dùng dạng gốc); đoạn mô tả và mục bất định phía trên đã sửa theo.
  Bất định còn lại: `sindhavasandhano` (4.2) là hapax trong toàn Pāli root của kn; `sandana` ở nơi khác là cỗ xe (ja530:3.2, ja535:34.2) và `sindhava` là ngựa xứ Sindhu, nên có thể là danh xưng "người có cỗ xe ngựa Sindhu", nhưng chữ ở đây viết `-dh-` và không có chú giải hay bản Anh để phân xử; vẫn giữ dạng Pāli. Vị ấy có phải chính người kể hay không vẫn chưa rõ. `bījasampadaṁ` nghĩa đen hay bóng chưa phân xử.
  Điểm: semantic_fidelity 9.2 → 9.0, grammar_logic 9.2 → 9.0, vietnamese_clarity 9.2 → 9.0, han_viet_balance 9.3 → 9.2, ambiguity_integrity 9.0 → 8.9. Hạ chứ không nâng: điểm cũ đã cho bản có lỗi số 58/185, đảo vế 10.2, sai nghĩa 1.3 và 3.3 — tức điểm cũ bị thổi phồng; điểm mới chấm cho bản đã sửa, vẫn trừ cho hapax 4.2 chưa giải, đại từ hồi chỉ "Ngài" ở 2.1 và câu 10.3 lược "bài kệ" sang 10.4. Các tiêu chí khác giữ: source_provenance 9.5, segment_alignment 10.0, terminology 9.1, triangulation 7.5 (không có bản Anh hay Việt tham khảo nào cho bài), technical_integrity 9.6 (chưa tự chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`). Kiểm của lượt này: 36/36 khoá khớp tập và thứ tự Pāli; ngoặc kép/nháy đơn khớp Pāli từng khoá 36/36; không có `…` ở Pāli lẫn Việt; 0 cặp Pāli trùng nguyên văn trong chính bài (phép rỗng); NFC; không khoá nào trùng nguyên văn Pāli ngoài 0.1.
