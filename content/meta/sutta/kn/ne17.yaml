  · 19.3: `jhāyī` → `thiền giả` (7 khoá `thiền giả`, 7 `người thiền`, 4 `người tu thiền`; chọn Hán-Việt ngắn). `sekkho` / `asekkho` → `hữu học` / `vô học`.
