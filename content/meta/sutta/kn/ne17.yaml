notes: |-
  Đợt 19, làn 75. Dịch từ Pāli root commit đã ghim, đủ 104/104 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là Vibhaṅga 14 của Paṭiniddesavāra trong Netti: nhóm áp dụng hướng dẫn (`adhiṭṭhāno hāro`). Bài nêu cặp `ekattatā` (tính đồng nhất) và `vemattatā` (tính khác biệt) qua mười sáu mục: khổ, tập khởi của khổ, sự chấm dứt của khổ, con đường thực hành đưa đến sự chấm dứt của khổ, con đường, sự chấm dứt, sắc (kèm bốn đại và bốn mươi hai phương diện), vô minh, minh, sự chứng đạt, thiền giả, định, thực hành, thân; kết bằng quy tắc xét câu hỏi theo đồng nhất, khác biệt, chúng sinh hay pháp.

  TẦNG THAM KHẢO. Anh Sujato: 0 trên 46 khoá Pāli có nội dung (mẫu số 46 = khoá không phải `:0`, có từ 40 ký tự trở lên sau khi gộp khoảng trắng; theo công thức `source/layers.yaml`), tức 0%, dưới ngưỡng 0,8. `english-project`: vắng. `vietnamese-current`: vắng (chỉ Pháp Cú). Ba tầng đều vắng nên `triangulation` đặt 7,5 (không quá 8,0) và bài giữ `draft`. Không tuyên bố đã đối chiếu English. Gắn với `reference-gaps.yaml`: entry nếu có chỉ thừa nhận mất tầng, không cứu được `published`.

  Số Pāli, đã tự tính. `vīsati` = 20 (khoá 10.3, 11.1, 11.2: đếm đủ hai mươi mục ở 11.2 theo nhóm năm: tóc, lông, móng, răng, da; thịt, gân, xương, tủy xương, thận; tim, gan, màng, lá lách, phổi; ruột, màng treo ruột, thức ăn chưa tiêu, phân, não). `dvādasa` = 12 (12.2: mật, đờm, mủ, máu, mồ hôi, mỡ, nước mắt, chất nhờn, nước bọt, nước mũi, dịch khớp, nước tiểu = 12). `catu` = 4 (13.2: ấm, già, nóng bừng, tiêu hóa = 4). `cha` = 6 (14.2: lên, xuống, bụng, ruột, khắp các chi, hơi thở vào ra = 6). `dvācattālīsa` = dvi 2 + catālīsa 40 = 42, và 20 + 12 + 4 + 6 = 42 (15.1, 15.2) khớp. Khoá 22.5 liệt kê 32 mục (20 + 12), có `matthaluṅga` = não. Hai mươi sáu mục định ở 20.3 đếm đủ 26; tám loại thiền giả ở 19.3 đủ 8; mười một lối thực hành ở 21.3 đủ 11; mười mục chấm dứt ở 8.3 đủ 10; bảy con đường ở 7.3 đủ 7. Không có cụm `Tiṁsakappasahassa`.

  Phép đo. Khoá Việt = khoá Pāli: 104 = 104, cùng thứ tự. Nháy đơn và nháy kép khớp Pāli từng khoá: 104 khoá quét, 0 lệch (Pāli ở bài này chỉ có nháy kép, ở 1.2, 3.1 đến 22.1, 15.4, 15.8, 23.9). Dấu lược: 15.5 và 15.6 là `…pe…`, mỗi khoá một `…`; Pāli không có `…` nào khác nên Việt không có `…` nào khác; không có `(…)` trần. NFC, khoá rỗng, khoảng trắng thừa: 0 lỗi. Pāli lọt sang Việt: chỉ tên riêng Mahākaccāyana ở 23.9. Pāli trùng nguyên văn trong chính bài: 2 nhóm, 92 cặp (nhóm `Ayaṁ vemattatā.`, và cặp `Seyyathidaṁ—` ở 4.4 và 6.4), bản Việt giống hệt nhau ⇒ 0 cặp lệch.

  Pāli trùng với bài khác trong tầng: 120 cặp tầng ứng với 11 khoá của bài (0.1 Netti 25 cặp, 0.2 Phần Giải Thích 23 cặp, 4.3, 4.4, 4.5, 5.3, 6.3, 6.4, 6.5, 9.5, 15.7); 65 cặp trong đó bản Việt khác bản tôi. Dùng lại nguyên văn: 0.1 (25/25), 0.2 (22/23, một cặp khác là `ne35:0.2` giữ nguyên Pāli chưa dịch), 6.3 (2/6 cặp giống nguyên văn; 4 cặp còn lại khác bản tôi chỉ ở chữ `ngành` / `chi` hoặc dấu cuối). 4.4 và 6.4 `Seyyathidaṁ—`: 7/8 cặp tầng viết `Như sau đây —` (mil), dùng lại. 4.5 `kāmataṇhā bhavataṇhā vibhavataṇhā.`: `phi hữu ái` 8 trên 14 cặp (4 khoá `dục ái, hữu ái, phi hữu ái.` nguyên văn gồm `sn56.11:4.5`, `dn33:1.10.35`), chọn dạng này; `vô hữu ái` chỉ 1 (`mn141`). 6.5 (tám chi đạo): 5/18 khoá viết đúng `chánh niệm, chánh định.` không có `và` (dn33, dn34, sn47.40), dùng dạng này vì Pāli không có `ca`; 7 khoá dùng `và`. 9.5: `mn28:5.2` dùng `Địa đại, thủy đại, hỏa đại và phong đại.`; `sn14.37` dùng `giới tánh đất…`; chọn `đại`, bỏ `và`. 5.3: không có dạng đa số (6 dạng khác nhau, mỗi dạng 1 đến 2 khoá); viết theo cấu trúc `dn22:20.2` và `mn141:22.2`.

  Thuật ngữ, có số đếm (đo trên tầng Việt hiện có).
  · `pathavīdhātu` / `āpodhātu` / `tejodhātu` → `địa đại` / `thủy đại` / `hỏa đại`: 37 / 38 / 38 khoá dùng `…đại`; `…giới` 15+15 / 11 / 21; `giới đất…` 15 / 14 / 19. `vāyodhātu` → `phong đại`: 12 khoá `phong đại`, 18 `phong giới`, 14 `giới gió` (chênh nhau hơn các bộ kia, vẫn chọn `đại` để một bộ bốn đại cùng một cách gọi; `mn28` cũng dùng `địa đại`). `dhātuyo` ở 10.1 đến 15.2 → `các đại`.
  · `pariggaṇhāti` → `nắm bắt` (0 tiền lệ trong tầng; xem bất định 2). `ākāra` → `phương diện`. `vitthārena` → `một cách chi tiết`. `sabhāvato` → `theo bản tính` (`ne18:4.2` đến 4.5 dùng `bản tính`).
  · `yathā candanikaṁ pavicinanto…` → `vũng nước bẩn` (`an6.58:6.2`); `saṅkāraṭṭhāna` → `đống rác`; `vaccakuṭi` → `nhà xí`; `sivathikā` → `bãi tha ma` (`thag5.1`, `thag6.4`).
  · `ekattatā` → `tính đồng nhất` (`mn1:23.1`, `mn1:23.2` và các khoá `ekattaṁ …` của `mn1` dịch `ekatta` là `tính đồng nhất`); `vemattatā` → `tính khác biệt` (`snp3.6:53.2`, `mn75:27.2` `sự khác biệt` / `sự sai khác`; 53 khoá chứa `vemattat-`). Lưu ý ngoài lát: `ne33` dịch hai từ này là `nghĩa là nhất` và `nghĩa khác biệt` (ne33:2.2 đến 2.11). Đây là nhóm khoá cấu trúc của cả bộ Netti; người biên tập cần chốt một cách cho mọi bài. Tôi chọn `tính đồng nhất` / `tính khác biệt` vì `nghĩa là nhất` dễ đọc thành mức cao nhất (`nhất`), và vì `mn1` đã dùng `tính đồng nhất` cho cùng gốc `ekatta`.
  · `adhiṭṭhāno hāro` → `nhóm áp dụng hướng dẫn` (`ne2:1.2` dịch `adhiṭṭhāno` là `áp dụng`; `ne33:1.1` là `nhóm phương thức áp dụng`; ở các nhóm vibhaṅga `hāra` luôn là `hướng dẫn`: `ne7`, `ne8`, `ne11`, `ne12`, `ne13`, `ne16`, `ne18`, `ne19` cùng khuôn). `Niyutto…hāro` → `…đã được vận dụng` (24 khoá cùng khuôn).
  · `Tattha katamo` → `Ở đây, … là gì?` (36/36 khoá của `ne` mở bằng `Tattha katam-` đều dịch `Ở đây,`).
  · `dukkha` / `dukkhasamudaya` / `dukkhanirodha` → `khổ` / `tập khởi của khổ` (31 khoá `tập khởi của khổ` toàn tầng; `ne33:2.7` viết `nguyên nhân của sự khổ`) / `sự chấm dứt của khổ` (`chấm dứt` dùng ở `ne33`; `đoạn diệt` 300, `diệt tận` 275 trong tầng); `dukkhanirodhagāminī paṭipadā` → `con đường thực hành đưa đến sự chấm dứt của khổ` (173 khoá `con đường thực hành`). `paṭipadā` ở mục 21 (không đi kèm `dukkhanirodhagāminī`) → `thực hành`, để phân biệt với `magga` ở mục 7 là `con đường`.
  · `taṇhā` → `tham ái` (ne: 14 khoá `tham ái` / 1 `khát ái`). `kāmataṇhā bhavataṇhā vibhavataṇhā` → `dục ái, hữu ái, phi hữu ái`. `ponobhavikā` → `tái hữu` (`sn22.22:3.2`, 4 khoá `tái hữu` / 2 `tái sanh`). `jāti` → `sanh` (`sn56.11:4.2`; `ne18:7.12`). `ariyo aṭṭhaṅgiko maggo` → `Thánh đạo tám ngành` (167 khoá `tám ngành` / 14 `tám chi`).
  · `nirodha` ở 8.3: `chấm dứt` cho cả mười mục. `paṭisaṅkhā` → `suy xét`. `anunaya` → `quyến luyến` (6 khoá, cùng `pe7:8.1`). `paṭigha` → `bực bội` (6 khoá; `sân` 55 khoá nhưng ở đây đứng cặp với `anunaya` như `pe7:8.1`). `māna` → `mạn`. `issā` → `ganh tị` (51 khoá; `tật đố` 2). `macchariya` → `keo kiệt` (92 khoá; `xan tham` 2 khoá).
  · `rūpa` ở 9.2 đến 9.3: `cātumahābhūtikaṁ rūpaṁ` → `sắc do bốn đại tạo thành` (`mn33:4.2`, `mn33:17.2`: `bốn đại và sắc do bốn đại tạo thành`; `bốn đại` 70 khoá, `đại chủng` 27). `paññatti` → `sự chế định`.
  · 3.3: `jāti dukkhā …` theo `sn56.11:4.2`, đổi `bệnh`, `chết` cho đủ cặp. `appiyehi sampayogo` → `gặp gỡ điều không ưa`; `piyehi vippayogo` → `xa lìa điều yêu thích`. `pañcupādānakkhandhā` → `năm thủ uẩn`.
  · 15.4 / 15.8: `netaṁ mama, nesohamasmi, na meso attā` → `đây không phải của ta, ta không phải cái này, đây không phải ngã của ta` (`mn148:22.2`, 186 khoá chứa `netaṁ mama`). `sammappaññāya` → `chánh trí` (104 khoá). `yathābhūtaṁ` → `đúng như thật` (359 khoá). `nibbindati` + `cittaṁ virājeti` → `nhàm chán` + `làm cho tâm ly tham` (`mn62:8.6`, 13 khoá).
  · 16.3 (định nghĩa vô minh): `aññāṇaṁ` → `sự không biết`; `avijjānusayo` / `avijjāpariyuṭṭhānaṁ` → `vô minh tiềm ẩn` / `vô minh hiển hiện` (đúng cách `ne18:3.5` đọc hai từ này; `mn148:28.7` dịch `avijjānusayo` là `tùy miên vô minh`, nhưng ở đây theo cách đọc của `ne18`, cùng bộ). `avijjogho` → `lũ vô minh`; `avijjāyogo` → `ách vô minh`; `avijjālaṅgī` → `chốt cài vô minh`.
  · 17.3 (định nghĩa minh): `paññāpajjoto` → `ngọn đèn tuệ`, `paññāratanaṁ` → `ngọc quý của tuệ`, `paññāpāsādo` → `lầu tuệ`, `paññāsatthaṁ` → `gươm tuệ`, `patodo` → `roi thúc`; `paññindriyaṁ paññābalaṁ` → `tuệ căn, tuệ lực` (`ne19:7.11`); `dhammavicayo` → `trạch pháp`; `dhammavicayasambojjhaṅgo` → `trạch pháp giác chi` (`ne19:7.11`).
