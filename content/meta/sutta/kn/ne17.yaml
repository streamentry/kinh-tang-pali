  · 21.3: `dukkhā paṭipadā dandhābhiññā` → `thực hành khổ thắng trí chậm` (`dn28:10.2` `hành trì khổ, chứng ngộ chậm`; `dn33:1.11.135` `đạo hành khổ với thắng trí chậm chạp`; `abhiññā` → `thắng trí`). `akkhamā` / `khamā` / `damā` / `samā paṭipadā` → `không nhẫn` / `nhẫn` / `điều phục` / `điều hòa` (`dn33:1.11.137` theo đúng nghĩa cặp).
