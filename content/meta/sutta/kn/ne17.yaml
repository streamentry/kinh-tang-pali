  · 7.3: `nirayagāmī…` → `con đường dẫn đến địa ngục…` (`mn12:36.1`, 3 mục đầu cùng khuôn); `asurayoniyo` → `cõi a-tu-la` (47 khoá `a-tu-la`).

  BẤT ĐỊNH CHƯA PHÂN XỬ, ghi ở đây, không thêm vào thân kinh:
  1. `kāyapadesaṁ` (15.1, 15.2): tôi dịch `một phần của thân` (padesa = phần, vùng). Cách đọc khác là `điều được gọi là thân` (padesa = chỉ định). Chưa có tiền lệ trong tầng.
  2. `pariggaṇhāti` (10.1 đến 14.2): `nắm bắt` là cách ít giả định; có thể là `xác định`, `khảo sát`. Không có tiền lệ.
  3. `gayhūpagaṁ` (15.1, 15.2): `đáng nắm giữ` (nghĩa đen: có thể được nắm lấy). Không có tiền lệ.
  4. `makkha` / `paḷāsa` (8.3): `xúc phạm` / `khinh miệt` theo `mn15:6.35`; tầng lệch nhau (`makkha`: `khinh` 62 khoá, `gièm` 44, `chê bai` 26, `lừa dối` 12; `paḷāsa`: `ngạo` 13, `ganh` 19). Chưa chọn được dạng đa số rõ ràng.
  5. `saraṇo` / `araṇo` (20.3): `raṇa` có thể là xung đột hay lỗi lầm; `tranh chấp` theo `mn139:13.3`. Cách đọc khác: `có lỗi / không lỗi`.
  6. `āgāḷhapaṭipadā` / `nijjhāmapaṭipadā` (21.3): `gay gắt` / `thiêu đốt`; không có tiền lệ trong tầng.
  7. `vibhūtasaññāsamāpatti` (18.4): `sự chứng đạt tưởng đã tiêu biến`; `vibhūta` có thể là `tiêu biến` hay `rõ ràng`. Không có tiền lệ.
  8. `ubhayato bhāvitabhāvano samādhi` (20.3): `định có sự tu tập từ cả hai phía`; nghĩa đen của `bhāvitabhāvana` chưa có tiền lệ.
  9. `sattādhiṭṭhāna` / `dhammādhiṭṭhāna` (23.6, 23.7): `lấy chúng sinh / pháp làm chỗ áp dụng`; giữ `áp dụng` cho `adhiṭṭhāna` như ở tên nhóm để một chữ Pāli một chữ Việt, nhưng cũng có thể là `lập trường`, `cơ sở`.
  10. `ājāniyo` / `assakhaluṅko jhāyī` (19.3): `như ngựa thuần chủng` / `như ngựa non chưa luyện`; chữ `thiền giả như…` là cách đọc ẩn dụ, Pāli chỉ ghi tên loại.
  11. `diṭṭhuttaro` / `taṇhuttaro` / `paññuttaro` (19.3): `lấy kiến / ái / tuệ làm trội`; chưa có tiền lệ.
  12. Khoá 23.2: `vilakkhaṇo` → `khác nhau về đặc tính`; chủ ngữ ngầm là pháp, theo nghĩa của 23.1.

  LỖI NGOÀI LÁT, báo chứ không sửa: `ne29:2.4` dịch `paññāsatthaṁ paññākhaggo paññāratanaṁ paññāpajjoto paññāpatodo paññāpāsādo` là `chỗ quy của trí tuệ, đỉnh cao của trí tuệ, ngọc quý…, ánh sáng…, ngọn đèn…, chỗ nương tựa của trí tuệ`: chữ `satthaṁ` (dao, gươm), `khaggo` (gươm), `patodo` (roi thúc) bị dịch thành `chỗ quy`, `đỉnh cao`, thiếu `roi thúc`; chưa có căn cứ trong Pāli cho `chỗ quy`. Nên rà lại.

  Đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên `technical_integrity` bị chặn ở 9,6 và không tuyên bố cổng kỹ thuật đã pass. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` còn phải chạy trước khi coi bài hoàn tất. `npm run reference:gaps` cũng chưa chạy.
