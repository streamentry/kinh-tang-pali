notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pe/pe1_root-pli-ms.json` (526/526 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli). Đây là nền tảng thứ nhất (`Ariyasaccappakāsanapaṭhamabhūmi`) của Peṭakopadesa, thuộc Trưởng lão Mahākaccāyana (150.1). Bài mở đầu bằng hai nhân, hai duyên cho chánh kiến của vị đệ tử (tiếng nói từ người khác và tác ý như lý ở bên trong, 3.1–7.12), chuyển sang cấu trúc tổng quát của Netti (mười sáu phương thức, năm lối, mười tám nền tảng gốc, 8.7–31.4), rồi trình bày bốn Thánh đế qua các bài kinh và bài kệ dẫn chứng (34.1–95.5: khổ, tập, diệt, đạo; kinh không chung), kinh chung (108.1–140.10: mười tổ hợp hai và ba chân lý, cộng hai phần tránh), tóm lược bảy loại khổ, ba loại tập và các đảo lộn (141.1–143.21), bài kệ tóm lược (144.1–149.4) và lời kết (150.1). Văn bản Pāli ghim nhiều chỗ hỏng hay cụt (xem phần bất định): bản Việt dịch sát chữ, không gỡ hộ.

  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho pe1: trong `source/upstream-manifest.json`, tầng `english-sujato` chỉ có chín nhánh `cp dhp iti ja kp snp thag thig ud` dưới `sutta/kn/`, và với `pe` chỉ có tệp tên `pe-name_translation-en-sujato.json` (pe1 = The First Stage: Illuminating the Noble Truths), không kèm prose của bài. Đây là `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` chưa có tệp nào cho `pe`. Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú (26 tệp), và nguồn tra cứu toàn văn Việt (HTML không phân đoạn) không có thư mục `pe`. Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.0 (≤ 8.0). Bài này dịch chỉ từ Pāli, từ tiền lệ thuật ngữ của chính tầng dự án (pe3, pe4, pe6, pe7, pe9, ne1–ne36), và từ các bài kinh, kệ Nikāya mà bài trích lại (mn36, mn85, mn100, an2.126, sn3.22, sn7.18, sn12.18, snp3.8, snp4.1, snp4.2, snp4.6, snp4.7, snp5.2, snp5.7, ud3.5, ud3.6, ud7.3, ud8.8, dn15, dn16, dn33, dn34, dhp15, dhp40, dhp155, dhp240, dhp274, ja510).
    Tên Sujato của pe1 dịch `ariyasaccappakāsanā` là Illuminating the Noble Truths; không có prose của ông, nên tên bài chỉ tham khảo tên ấy ("làm sáng tỏ"), còn `pakāsana` ở 3.7 dịch "sự làm sáng tỏ" để hai chỗ khớp nhau.
  - Coverage English:
    Mẫu số = 146 khoá Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`). Sujato phủ 0/146 (0/526 khoá tổng); coverage English 0%, dưới ngưỡng, nên bài chưa thể `review`/`published`; `reference-gaps.yaml` có entry cũng không cứu được `published` (ngoài phạm vi lát này, không chạm). Không có cách đọc English độc lập nào cho bài này.
  - Tiền lệ cùng bộ (`pe`, `ne`):
    `0.1` "Peṭakopadesa" dùng lại nguyên văn của `pe3`, `pe4`, `pe6`, `pe7`, `pe9`. `0.2` theo `pe3`:`pe9` đặt "Nền Tảng Thứ N: tên" (`bhūmi` → "nền tảng"), tên "Làm Sáng Tỏ Các Thánh Đế" theo tên Sujato của chính chương này. `1.1` dùng lại câu kính lễ ở đầu 13 tệp Khuddaka (`ne1:0.3`, `cnd1`, `ja1`, `cp1`, `vv1`, `bv1`, `mil1`, `tha-ap1`, `thi-ap1`, `pv1`, `ps1.0`, `thag1.1`, `ja521`: "Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác"; riêng `kp1:1.1` viết "Đức Thế Tôn"), không theo các khoá DN/MN/AN/SN ("Kính lễ Đức Thế Tôn, bậc A-la-hán, Chánh Đẳng Giác") vì đây là câu mở đầu một tác phẩm Khuddaka, không phải lời trong kinh. `9.1` dùng lại `pe4:11.1`; `27.1` và `144.1` dùng lại `pe3:76.1` và `pe9:54.1` (cùng Pāli); `95.1` và `95.5` dùng lại `pe3:50.2` ("Những bài kinh này là không chung"), từ đó `140.1` là "chung". Các khoá hỏi "Trong đó, X là gì?" theo `pe6` và `pe9` (khớp 5/5 tệp `pe`, trong khi `ne17` viết "Ở đây"). Phần kệ chép lại đúng bản đã có của `ja510:1` (36.1–36.3), `dhp15` (49.1–49.4), `dhp40` (115.1–115.4), `dhp155` (39.1–39.4), `dhp240` (64.1–64.4), `snp4.2` (52.1–52.4, 46.1–46.2, 46.4), `snp4.7` (58.1–58.4), `snp4.1` (69.3–69.6), `ud7.3` (81.1–81.4), `ud8.8`/`ne15:27` (118.1–118.4), `ud3.5` (126.1–126.3), `ne16:3` và `ne16:6` (109.1–109.5, 132.1–132.5), `ne14:24` (121.1–121.4), `ne15:14` (135.1), `ne6:10` (129.1–129.4), `mn50:24` (55.1–55.2), rồi mỗi chỗ lặp lại trong các bài kệ tóm lược 97–106 và 145–149 dùng cùng chữ với lần xuất hiện đầu.
  - Pāli trùng nguyên văn:
    Dò Pāli của 526 khoá với toàn bộ Pāli đã ghim (dn, mn, sn, an, kn), so sau khi bỏ dấu câu, nháy và chữ hoa, trên các bản Việt đã có (kể cả pe3, pe4, pe6, pe7, pe9): 142 khoá có Pāli trùng ở bài khác mà phía kia đã có bản Việt, tổng 1.023 cặp. Trong đó 112 khoá bản Việt của bài này giống ít nhất một bản đã có (sau khi bỏ dấu câu), 30 khoá khác mọi bản đã có. Riêng với `pe`/`ne`: 68 khoá, 50 giống, 18 khác. Dùng lại nguyên văn ở các khoá còn lại, trong đó: `0.1`, `6.3` ("Vì sao vậy?", cùng `ne5:15.10`, `ne24:2.4`), `38.1` và `44.1` (`pe6:9.16`, `pe6:9.18`), `143.8` (`pe6:19.1`), `143.9` (`pe6:19.2`), `115.1`–`115.4` (`dhp40`), `39.1`–`39.4` (`dhp155`), `64.1`–`64.4` (`dhp240`), `135.1`–`135.2` (`ne15:14`), `87.1`–`87.2`, `87.4` và `105.3` (`dhp274`), `93.1` và `106.1` (`snp5.7:8.1`), `77.1`–`77.3` (`sn3.22:4`), `91.4` ("Như vậy là sự tập khởi của toàn bộ khối khổ này", `dn15:3.2`; trên toàn tầng dạng "tập khởi" 48 khoá so "toàn bộ khối khổ này sinh khởi" 6 khoá).
    30 khoá khác mọi bản đã có, kèm lý do: `10.2`, `10.3`, `14.1`, `14.2`, `15.1`, `19.1`–`19.3`, `20.1`, `20.3` (`ne1:3`, `ne2:3`–`ne2:9`) dịch theo tên phương thức, lối đã chọn ở `ne3`–`ne36` và `pe9` (xem thuật ngữ), vì `ne2` dịch `vicaya` "tích lũy", `lakkhaṇa` "dấu hiệu", `vevacana` "diễn đạt bằng lời" và các lối là "tuyên thuật làm vui lòng", "chất đống ba tầng", "đánh bóng như sư tử", "soi như gương", "cây gai đẩy" (`ne3:18`–`ne3:23`, `pe9:58`–`pe9:62` dùng "vòng xoay hoan hỷ", "ba cánh sen", "đùa giỡn của sư tử", "nhìn khắp các phương", "móc câu": 22 khoá `pe` và 6 khoá `ne`); `16.1`, `21.1`, `34.1`, `54.1`, `80.1`, `83.1`, `86.1` dùng "Trong đó" thay "Ở đây" của `ne2` và `ne17`; `45.1` và `98.3` (`snp3.8:4.1` đặt "thợ gốm" sang dòng kế, ở đây giữ "người thợ gốm" đúng dòng); `46.3` và `84.2` bỏ nháy đơn/kép của `snp4.2:6.3` và `ud3.6:6.2` vì Pāli không có nháy ("không chấp là của ta", cùng `pv36:34.2`); `50.1` "ác hạnh" (`ne10:12`, `ne36:59.1`; toàn tầng 208 khoá so "ác hành" 11 khoá, `dn33:1.10.8`); `67.1`–`67.4` (`snp4.6:4` đảo nội dung giữa các dòng; ở đây dịch đúng từng dòng); `84.4` bỏ "thì" của `dhp142:4`; `87.3` "Thánh đạo tám chi" (`pe6:6.2`, `kp4:8.2`, so "tám ngành" `sn43.11`); `91.13` "chân lý" thay "sự thật" (xem thuật ngữ); `112.1` (`ud4.9:4.1` dịch lệch dòng, không dùng được).
    Trong chính bài: 30 nhóm Pāli trùng nguyên văn sau khi bỏ nháy và dấu câu (kể cả `13.1`/`18.1`, `34.1`/`54.1`, `36.1`/`97.1`, `42.1`/`98.1`, `45.1`/`98.3`, `49.1`/`99.1`, `55.1`/`100.1`, `58.1`/`100.3`, `61.1`/`101.1`, `69.6`/`102.4`, `71.1`/`103.1`, `74.1`/`103.3`, `77.1`/`104.1`, `87.1`/`105.3`, `90.1`/`106.3`, `93.1`/`106.1`, `109.1`/`145.1`, `109.2`/`132.2`, `113.1`/`113.8`, `132.1`/`148.3`, `138.1`/`149.3`, nhóm tám khoá `Imāni dve saccāni—`, nhóm năm khoá `Imāni tīṇi saccāni.`, nhóm bốn khoá `idaṁ dukkhaṁ.`); bản Việt giống nhau ở cả 30 nhóm, 0 nhóm khác (khác nhau duy nhất là dấu cuối khoá và nháy, theo Pāli từng khoá).
  - Thuật ngữ (đếm trên tầng Việt hiện có, cùng Pāli):
    + `hāra` → "phương thức": `ne1:3.1`, `ne2:1.1`, `ne2:5.1`, `ne20:1.1` (4 khoá `soḷasa hārā`) so "hướng dẫn" `ne3:23.1` và "hành tướng" `ne35:5.1`; toàn các khoá có `hāra`: "hướng dẫn" 50 (`ne3`–`ne19`), "phương thức" 30 (`ne1`, `ne2`, `ne11`, `ne20`–`ne34`), "hành tướng" 4 (`ne35`); chọn "phương thức" vì cụm `soḷasa hārā` chia 4/1/1 và các lát gần nhất (`ne20`–`ne34`) đều dùng chữ ấy. Tên mười sáu phương thức: `desanā` "đề ra", `vicaya` "khảo xét" (`ne5`, `ne6:13.6`; không dùng "tích lũy" của `ne2`), `yutti` "lý luận", `padaṭṭhāna` "nền tảng ứng với" (138 so 156 "nền tảng" trên tầng, `pe6`, `ne7`), `lakkhaṇa` "đặc trưng" (148 so "dấu hiệu" 91, và riêng `pe`/`ne`: 116 so 8), `catubyūha` "bốn phần", `āvaṭṭa` "quy căn", `vibhatti` "phân loại", `parivattana` "chuyển đổi", `vevacana` "ngữ đồng nghĩa" (`ne3:11.4`, `ne13`), `paññatti` "định danh", `otaraṇa` "dẫn đưa" (`ne2:4.2`, `ne15`), `sodhana` "thanh tẩy", `adhiṭṭhāna` "áp dụng", `parikkhāra` "trợ duyên", `samāropana` "gom góp". Đây là các cách dịch đã dùng, chưa chắc đúng (`āvaṭṭa`, `adhiṭṭhāna`, `parikkhāra` còn tranh cãi); giữ để cả bộ nhất quán.
    + `naya` → "lối" (22 khoá `pe` và 6 khoá `ne`: `pe9:5.12`, `pe9:29.1`, `ne3:18.4`, `ne4:27.1`, `ne36`); tên năm lối: "vòng xoay hoan hỷ", "ba cánh sen", "đùa giỡn của sư tử", "nhìn khắp các phương", "móc câu".
    + `mūlapada` → "nền tảng gốc" (`pe9:49.5`, `pe9:57.3`, `ne2:10.1`) so "mục gốc rễ" 1 khoá (`ne1:3.3`); `padāni` → "nền tảng" (`pe6:11`, `pe9`); `kilesabhūmi` → "vùng đất của phiền não" (`pe9:55.4`); `indriyabhūmi` → "vùng đất của các căn" (`pe9:56.4`).
    + `saccāni` → "chân lý" (cụm `cattāri/dve/tīṇi saccāni`: 71 so "sự thật" 18 trên toàn tầng; riêng `ne`: "sự thật" 20 khoá, riêng `pe`: "chân lý" 2) và `ariyasacca` → "Thánh đế" (`pe6:5.1`, `dn16`, `sn56`); `dukkhasamudaya` → "tập khởi của khổ" (`ne17:4.2`), `dukkhanirodha` → "sự chấm dứt của khổ" (`ne17:5.2`), còn `samudaya`, `nirodha`, `magga` đứng riêng dịch "tập", "diệt", "đạo" (`pe6:5.1`).
    + `yoniso manasikāra` → "tác ý như lý" (88 so "như lý tác ý" 44 và "chú ý đúng" 25); `parato ghosa` → "tiếng nói từ người khác" (`an2.126:1.3`, `ne4:29.1`); `sutamayī`/`cintāmayī paññā` → "tuệ do nghe sinh"/"tuệ do tư duy sinh" (`ne4:28.2`–`29.2`, `pe3:72.2`, `pe9:38.2`); `sāvaka` → "đệ tử" (1.842 khoá, chỉ 1 khoá "Thanh văn"); `atthappaṭisaṁvedī` → "thọ nghiệm nghĩa" (`dn34:1.6.79`–`1.6.97`: 5 khoá); `netaṁ ṭhānaṁ vijjati` → "điều ấy không thể có" và `ṭhānametaṁ vijjati` → "điều ấy có thể có" (mẫu `ne21:11`–`ne21:14`; 235 và 130 khoá có cụm Pāli này trên toàn tầng); `ārammaṇa` → "đối tượng" (`pe9:34.2`, `pe6:21.6`, `ne5:29.1`); `niyyāna` → "sự thoát ra" (`pe9:31.2`), `niyyānikalakkhaṇo` → "đặc trưng là dẫn ra" (`ne7:3.21`); `niddisati` → "chỉ ra" (`pe3`, `pe4`, `pe7`, `pe9`); `pariyesati` → "tìm cầu".
    + `jāti jarā byādhi maraṇa` → "sinh, già, bệnh, chết" (`pe6:9.14`–`9.18`, `ne14:3.6`; "sanh" ở `ne17:3.3`); `soka`, `parideva`, `dukkha`, `domanassa`, `upāyāsa` → "sầu", "bi", "khổ", "ưu", "não" (`pe6:10.15`–`10.19`, `sn12.44`); `appiyasampayoga`, `piyavippayoga`, `yampicchaṁ na labhati` → "gặp gỡ điều không ưa", "xa lìa điều yêu thích", "cầu không được" (`ne17:3.3`); `dukkhadukkhatā`, `saṅkhāradukkhatā`, `vipariṇāmadukkhatā` → "khổ khổ", "hành khổ", "biến hoại khổ" (`ne5:15.7`, `ne36:59.12`); `pañcupādānakkhandhā` → "năm thủ uẩn" (72/72).
    + `cuti`/`upapatti` → "sự qua đời"/"sự tái sinh" (`pe6:9.19`), còn `cutūpapāta` → "chết đi sinh lại" (`ne15:14.1`); `paṭisandhi` → "tái tục" (`pe6:27.12`); `anupādisesā nibbānadhātu` → "Niết-bàn giới không còn dư y" (`ne9:37.6`, `dn16`; "vô dư y" `pe6:27.12`, "không còn dư tàn" `iti44`: 1/2/2).
    + `taṇhā` → "ái" (`pe6`, `pe9`; 839 so "tham ái" 376 theo đo của `pe3`), `lobha` → "tham", `vipallāsa` → "đảo lộn" (98 so "điên đảo" 7 và "đảo ngược" 7), `vipallāsavatthu` → "cơ sở của đảo lộn" (`pe6:19.1`), `subhasaññā`... `anattasaññā` → "tưởng tịnh", "tưởng lạc", "tưởng thường", "tưởng ngã", "tưởng bất tịnh", "tưởng khổ", "tưởng vô thường", "tưởng vô ngã" (`ne12:5.5`; `ne2:10.3` dịch `asubhasaññā` thành "tưởng bất thiện", lỗi, không theo); `micchatta` → "tà tánh" (`ne10:14.1`, `ne11:5.3`); `abbhācikkhati`, `abbhakkhāna` → "xuyên tạc" (57 so "vu khống" 16 và "phỉ báng" 8); `kāyagatāsati` → "niệm thân" (80/80 khoá, `mn119`, `dn34`); `vimuttiñāṇadassana` → "giải thoát tri kiến" (`ne7:4.2`; 88 so "tri kiến giải thoát" 16); `vimuttāyatana` → "chỗ giải thoát" (`dn33`, `dn34`; toàn tầng 9 so "xứ giải thoát" 8, `ps1.1`; gần ngang nhau); `pāmojja` → "hoan hỷ" (`pe6:45.5`); `pema` → "sự thương mến" (`pe6:61.8`); `tapanīyā dhammā` → "pháp đáng bị thiêu đốt" (`an8.12:22`); `vipatti` → "sự hỏng" (`ne36:59.21`, `dn33:1.9.29`); `duccarita` → "ác hạnh" (208 so 11); `lokāmisa` → "vật dục thế tục" (`mn25`); `bhavanetti` → "dây dẫn đến hữu" (`dn1`, `dn16`); `majjhimā paṭipadā` → "con đường trung đạo" (`ne36:6.14`).
    + `suttaṁ geyyaṁ veyyākaraṇaṁ gāthā udānaṁ itivuttakaṁ jātakaṁ abbhutadhammaṁ vedallaṁ` → "kinh khất đàm, kinh khế tùng, kinh giải thích, kinh kệ, kinh tự nói, kinh bản sự, kinh bản sinh, kinh hy hữu, kinh phương quảng" (`an7.68:2.3`, `an4.6:1.9`: 5 khoá, so "khế kinh, ứng tụng, giải thuyết, kệ ngôn, cảm hứng ngữ, như thị thuyết, bổn sanh, vị tằng hữu pháp, phương quảng" 2 khoá `an6.51`); `veyyākaraṇa`, `byākaraṇa` → "lời giải đáp" (`pe4:6.16`, `pe9:61.1`, `ne3:21.1`; toàn tầng "giải đáp" 118 khoá, trong đó "lời giải đáp" 70, và "giải thích" 50); `uddānagāthā` → "bài kệ tóm lược" (`pe3`, `pe4`, `pe9`); `ekuttarika` → "Tăng Chi" và `saṁyutta` → "Tương Ưng" (tên Việt quen dùng của bộ, không có tiền lệ `pe`/`ne`; `pañcanikāya` → "năm bộ").
  - Số Pāli:
    `soḷasa hārā` 16 (đếm 12.1 và 14.1–15.4: desanā … samāropano = 16); `pañca nayā` 5 (17.1); `aṭṭhārasa mūlapadāni` 18 = 9 bất thiện + 9 thiện (22.1: avijjā, taṇhā, lobha, dosa, moha, subhasaññā, sukhasaññā, niccasaññā, attasaññā; samatha, vipassanā, alobha, adosa, amoha, asubhasaññā, dukkhasaññā, aniccasaññā, anattasaññā); `duve hetū duve paccayā` 2 và 2 (3.1–3.2); `cattāri saccāni` 4, `dve saccāni` 2 (8 chỗ), `tīṇi saccāni` 3 (5 chỗ); `navavidhaṁ suttaṁ` 9 (79.1; 33.3 liệt kê đúng 9); `aṭṭha dānūpapattiyo` 8 (37.1, 97.2); `pañca pubbanimittāni` 5 (40.1, 97.3); `tayo gilānā` 3 (43.1); `tīṇi duccaritāni` 3 (50.1, 99.2); `tisso vipattiyo` 3 (53.1, 99.4); `dveme tapanīyā dhammā` 2 (59.1); `tayo aggī` 3 (62.1, 101.2); `dveme … abbhācikkhanti` 2 (65.1); `tīhi vācāhi` 3 (68.1, 102.1); `tisso māradhītaro` 3 (69.2, 102.3); `pañcime khandhā` 5 (72.1, 103.2); `cattāro āsavā` 4 (82.1, 104.4); `dvemā vimuttiyo` 2 (85.1, 113.6, 145.4); `sattime bojjhaṅgā` 7 (88.1); `sataṁ ayosaṅkū` 100 (55.1, 100.1); `vassasata` 100 năm (74.2); `vādasata` trăm (93.4); `dasa uddānagāthā` 10 (107.1; 97–106 là đúng 10 bài kệ); `catunnaṁ dhammānaṁ` 4 (130.4–130.6: giới, định, tuệ, giải thoát); `chahi māsehi` 6 tháng (133.4); `ekārasa upanissayā` 11 (136.7, đọc `ekārasa` là mười một, như `ekādasa`); `ekādasaṅguttaresu` chương mười một (123.1); mười tổ hợp chân lý ở 110–139 đếm được đúng 10 (khổ–tập, khổ–diệt, khổ–đạo, khổ–tập–diệt, khổ–tập–đạo, khổ–đạo–diệt, tập–diệt, tập–đạo, tập–diệt–đạo, diệt–đạo) khớp `dasa parivaḍḍhakā` ở 140.4, và 10 + `dve parivajjanā` 2 = `dvādasa parivaḍḍhakā` 12 (140.7–140.8; `ekaṁ pañca cha ca` ở 140.6 cộng 1 + 5 + 6 = 12, cũng 12); `sattavidhaṁ dukkhaṁ` 7 (141.13) = hai (`appiyasampayoga`, `piyavippayoga`) + hai (thuộc thân, thuộc tâm) + ba (`dukkhatā`) = 7; `tīhi dukkhatāhi` 3 (141.8); `tividho samudayo` 3 (142.1–142.3: ái, kiến, nghiệp); `sattavidhā diṭṭhi` 7 (143.2) = 3 (143.3) + 4 (`vipallāsavatthūni`) = 7; `cattāro vipallāsā` 4 và `cattāri vipallāsavatthūni` 4 (143.6–143.9: thân, thọ, tâm, pháp); `micchattāni` 3 + 3 + 2 = 8 (143.14–143.19, khớp tám tà tánh ở `ne10:14.1`). Không có số lớn nhân thang, không có `Tiṁsakappasahassa`.
  - Chỗ bất định (không thêm vào thân kinh):
    + `6.1` `taṁākāro yoniso dvāro vidhi upāyo`: dịch "có hình thức như thế: như lý, cửa ngõ, cách thức, phương tiện", giữ danh sách nguyên văn, không nối thành câu. `6.2` `abhimanthamānaṁ` (đối cách, không có chủ ngữ cách tương ứng) dịch như phân từ của `puriso`. `7.3` `duve upamā ayoniso kātabbā pacchimesu vuttaṁ`: không biết `pacchimesu` chỉ đoạn nào ("các phần sau"); hai ví dụ không như lý có thể là hai ví dụ đầu của `mn36:17`–`mn36:19` (gỗ ướt trong nước, gỗ ướt trên đất), còn ví dụ ở 6.2 là ví dụ thứ ba.
    + `8.6` `sakkā … adhigantuṁ` không có phủ định trong Pāli nhưng câu sau (`tasmā`) đòi nghĩa "không thể": dịch "thì không thể đạt được", đọc phủ định của `na ca … nāpi` kéo sang; nếu đọc đúng chữ thì nghĩa đảo ngược. `8.5` `ārammaṇa` dịch "đối tượng", cũng có thể là "chỗ nương". `nibbāyitukāma` dịch "người muốn đi đến tịch diệt".
    + `10.1` `soḷasahārā nettī`: dịch "Netti có mười sáu phương thức" như `ne1:3.1` (đọc `nettī` là tên tác phẩm, cũng có thể là "sự dẫn dắt"). `10.4` `Kaccāyanagottaniddiṭṭhā` dịch "do vị thuộc dòng Kaccāyana chỉ ra" (`ne1:3.4` ghi thẳng Mahākaccāyana).
    + `20.2` `nayalañjako`: không có cách dịch khớp tầng (`ne2:8.4` "được trang sức bằng các lối ấy" khác vị trí: ở `ne2` đứng cho lối thứ ba, ở đây cho lối thứ tư); dịch "vật làm dấu của các lối", chưa chắc.
    + `32.2` `Yā evaṁ`: `yā` không có tiền từ rõ (có thể chép sai của `yathā`); dịch "như vậy", bỏ `yā`. `tañca byañjanaṁ atthaputhuttena pana attheva byañjanaputhuttena`: dịch "câu chữ ấy là do sự đa dạng của nghĩa, còn nghĩa là do sự đa dạng của câu chữ", thiếu động từ trong Pāli.
    + `33.5` `ālokasabhāni` (cũng ở 124.1 cùng nhóm): dịch "có bản chất ánh sáng"; có thể là `ālokasabhāvāni` hoặc từ khác. `thāvarāni` dịch "bền vững".
    + `34.3` `alābho` dịch "cầu không được" theo `ne17:3.3`; `adhippāyavivattana` dịch "sự làm trái ý muốn". `34.5` `appaṭisandhibhāvanirodhalakkhaṇā` đọc "đặc trưng là sự diệt, trạng thái không còn tái tục" (cũng có thể là "sự diệt của trạng thái không tái tục").
    + `37.1`, `65.1`, `75.1`, `110.5`, `123.1`, `94.1`, `56.1`: các tên bộ kinh (`ekuttarike`, `saṁyuttake`, `cittasaṁyuttakesu`, `ekādasaṅguttaresu`, `godhikasaṁyuttaṁ`) dịch "Tăng Chi", "Tương Ưng" theo tên Việt quen dùng; không xác định được đúng bài kinh cho `47.1 Udakappanasuttaṁ` và `82.1 cattāro āsavā suttaṁ`, nên để nguyên tên (`Udakappana`) và tên chung ("Kinh Bốn Lậu Hoặc"). `75.1` `ayyikā me kālaṅkatā` dịch như tên kinh ("Bà Nội Của Con Đã Qua Đời", `sn3.22`), vì Pāli không có nháy.
    + `42.1`–`42.4` `Sāmaṁ tena kuto rāja / Tuvampi jarāyanti vedesi / Khattiya kammassa phalo / Loko na hi kammaṁ panayati`: cú pháp không phân giải được (`panayati` có thể là chép sai của `panassati`, như `thag2.12:1.6`; `jarāyanti` không rõ dạng); dịch sát chữ từng dòng, không nối thành câu. `98.1`–`98.2` lặp lại bài này, `98.2` `tayo devā gilānakā` dịch "ba vị trời, những người bệnh" (có thể là chép sai của `tayo devadūtā`, ba sứ giả của chư thiên; không có chứng cứ độc lập).
    + `45.4` `yaṁ pakkaṁ yañca āmakaṁ` dịch "đã nung và chưa nung" (`āmaka` = còn sống, chưa chín).
    + `47.1`/`98.4` `udakappana`, `nadidakappanaṁ`: không phân giải được (có thể là `nadī` + `udakappana`); dịch "Kinh Udakappana" và "Udakappana của dòng sông".
    + `61.1`–`61.4` `ukkā` dịch "lò của thợ rèn"; `61.4` `sutvā nibbattamambujaṁ` dịch "sau khi nghe về hoa sen đã sinh" (`ambuja` còn có thể là nghĩa khác); chưa phân xử.
    + `65.1` `dveme tathāgataṁ abbhācikkhanti`: Pāli không nói chủ thể; dịch "hai hạng người này", thêm "hạng người" để câu đọc được.
    + `67.1`–`67.4` dịch đúng từng dòng (khác `snp4.6:4`, xem Pāli trùng). `68.1` `cavanadhammaṁ` dịch "có pháp phải lìa đời" (người có tính phải rời cõi trời).
    + `71.4` `yattha sattā puthujjanā` dịch "nơi các chúng sinh phàm phu" (`satta` cũng có thể là "dính mắc").
    + `74.3` `atha vāpi akicchaṁ jīvitaṁ` dịch "hoặc dù đời sống không gian nan"; có thể là chép sai của `yo cepi aticca jīvati` (`snp4.6:1.3`).
    + `77.4` `attakammaphalūpagā` dịch "thọ lãnh quả của nghiệp mình" (`sn3.22:4.4` có `puññapāpaphalūpagā`, khác chữ).
    + `91.1` `hetusamudayo` dịch "sự tập khởi của nhân". `91.2` kết bằng dấu chấm trong Pāli nhưng câu chưa hoàn (kéo sang 91.3); dịch đúng dấu chấm.
    + `93.2` `Taṁ hi vā natthi yena naṁ paññapeyya`: `hi vā` không phân xử được (so `snp5.7:8.3` `yena naṁ vajjuṁ taṁ tassa natthi`); dịch "quả thật, không có điều nào mà nhờ đó có thể chế định vị ấy", bỏ `vā`. `93.4` `sitā vādasatassu sabbe` dịch "tất cả đều nương vào hàng trăm luận thuyết" (`sita` = nương, dính; `vāda` = luận thuyết).
    + `109.3`/`110.1` `vivicchā`: dịch "xan tham" theo `snp5.2:2.3`, `ne16:3.3`; `ne5:6.3` và `ne5:9.3` dịch "hoài nghi" (`vivicchā` = `vicikicchā`). Tầng chia 2 so 2; chọn "xan tham" vì khớp cả hai nơi cùng Pāli của kệ.
    + `113.1`, `113.8` `yaṁ cittaṁ, idaṁ dukkhaṁ`: đọc "cái tâm nào, đây là khổ" (tiền từ của `yaṁ` không rõ). `116.5` `yā saṁyojanā, ayaṁ maggo`: dịch sát chữ "những kiết sử nào, đây là đạo", nghĩa không khớp (có lẽ chỉ sự từ bỏ kiết sử); chưa phân xử.
    + `119.5` `pacceti`: dịch "tin vào" (`paṭi` + `eti`); `119.6` `yathesā vīmaṁsā`: dịch "như sự thẩm xét này", không xác định tiếp theo; `119.10` `idaṁ eso samudayo niddiṭṭho` dịch sát chữ.
    + `124.1`–`124.4` (tóm tắt kinh Gopālaka của `an11`): `rūpasaññuttā` dịch "sự gắn với tưởng về sắc" (có lẽ chép sai của `rūpaññutā`, "biết hình dáng", mục đầu của kinh); `yañca saḷāyatanaṁ`, `yañca titthaṁ`, `catubbidhaṁ ca attabhāvato ca vatthu` dịch sát chữ không giải nghĩa; `124.2` `āsāṭikaṁ hāretā` dịch "người gỡ bỏ trứng ruồi"; `124.4` `kalyāṇamittatappaccayā dhammā` dịch "các pháp có bạn lành làm duyên". Không có bản Việt của kinh gốc trong tầng để đối chiếu.
    + `127.1`–`127.3`: phân loại giới, định, tuệ uẩn không khớp với thứ tự thường (giới uẩn đi với `sīlasaṁvara`, nhưng 127.2 xếp `sīlasaṁvara` vào `paññākkhandha`); dịch đúng Pāli, không sửa. `127.1` `yaṁ cittasahajātā dhammā` (giống ngữ pháp không khớp) dịch như danh từ số nhiều.
    + `130.1` `purimakehi` dịch "cùng với những điều ở trước" (các mục `āsā`, `pihā`, `abhinandanā`). `130.7` `Paṭivedho bhavanettiyā` dịch "sự thấu suốt về dây dẫn đến hữu"; sai khác với đọc "do thấu suốt, dây dẫn đến hữu bị cắt" (như `dn16:2.3.8`).
    + `133.4` `daḷhanemiyānākāro` (và `148.4` `daḷhaṁ nemiyānākāro`): không phân giải được (có thể là Daḷhanemi, vị Chuyển luân vương đầu tiên, `dn26`); dịch "phương diện của Daḷhanemi" và "Daḷhanemi, phương diện ấy". `chahi māsehi` dịch "bằng sáu tháng". `Sañcetaniya` giữ nguyên tên.
    + `133.6`–`133.7` `Evaṁ vacīkammaṁ manokammaṁ`: Pāli lặp và không rõ `evaṁ` nối với gì; dịch đúng từng khoá.
    + `136.5`–`136.8`: `Anupaṭṭhitakāyagatā sati …pe…` và `yaṁ vimuttiñāṇadassanaṁ` nối nhau qua phần lược; `136.7` `Ekārasaupanissayā vimuttiyo` đọc "mười một sự nương tựa của các giải thoát"; `136.8` `Sīlasaṁvaro sosāniyo hoti`: `sosāniya` không phân giải được (có thể liên quan `sosānika`, người ở nghĩa địa, `an5.184`, nhưng không hợp văn cảnh), nên giữ nguyên chữ Pāli `sosāniya` trong bản Việt.
    + `138.1`–`138.4`: nguồn kệ chưa xác định; `tena attanā` dịch "do đó, tự mình" ; `vibhavañca` dịch "phi hữu" (`vibhavataṇhā` → "phi hữu ái"); `Tāva` dịch "như vậy".
    + `139.1`–`139.2` `yaṁ saccena`, `yaṁ khīṇapunabbhavo` dịch sát chữ "điều nào bằng chân lý", "điều nào là đã diệt tận tái sinh".
    + `140.4`–`140.10`: `parivaḍḍhaka` dịch "phần mở rộng", `catukko niddeso` "phần chỉ rõ nhóm bốn", `parivajjanā` "sự tránh", `savekadeso` "có một phần"; `140.6` `Ekaṁ pañca cha ca savekadeso sabbaṁ` và `140.9` `Ettāvatā sabbaṁ suttaṁ natthi, taṁ byākaraṇaṁ vā gāthā viya` dịch sát chữ, nghĩa không phân xử được (chữ `natthi` và phạm vi của `sabbaṁ`).
    + `142.4` `Tattha taṇhā ca bhavasamudayo kammaṁ`: có hai cách đọc ("ái và nghiệp là tập khởi của hữu" hoặc "ái; và tập khởi của hữu là nghiệp"); dịch cách thứ nhất.
    + `143.1` `āgantabbā` dịch "cần được truy ra"; `143.3` đọc "một sự đảo lộn được chỉ ra thành ba"; `143.5` `paṭikkhepena` dịch "bằng cách phủ nhận".
