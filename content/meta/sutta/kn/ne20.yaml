notes: |-
  Bản dịch từ Pāli root; không có bản Anh pinned (xem blocker), nên `triangulation` đặt 7.0 (≤ 8.0) và bài giữ `draft`. Mẫu số coverage = 20 khoá Pāli có nội dung, Sujato phủ 0.
  Tiêu đề: `:0.3` Sampāta 1 → "Nhóm 1"; `:0.4` Desanāhārasampāta → "Nhóm Phương Thức Đề Ra" theo bảng `X-hārasampāta` → "Nhóm Phương Thức X" (`ne22`–`ne34`) và `desanā` = "đề ra" ở danh sách mười sáu phương thức `ne2:1.2`/`:3.1` (cùng cách gọi ở `:2.3`, `:7.12`). Trong lời giảng `ne11` dùng "giảng" cho `desanā` khi không phải tên phương thức; ở đây `desayati`/`desitāni` (`:4.1`, `:7.5`) dịch "giảng", `dhammaṁ deseti` (`:7.6`) dịch "thuyết pháp".
  Tiền lệ dùng lại: bài kệ `:3.1–3.4` theo `ud4.2:4.1–4.4` (cùng ba vế "không được hộ trì / bị tà kiến phá hoại / bị hôn trầm và buồn ngủ chế ngự / đi vào quyền lực của Ma"), chỉ đổi `kāyena` → `cittena` thành "tâm"; `pamādo maccuno padaṁ` → "đường của tử thần" theo `dhp21:2` (tử thần 18 khoá, Thần Chết 11 khoá toàn kn); `:7.9` `Imāni cattāri saccāni.` dùng nguyên văn bản dịch của `ne26:2.7` (1/1 cặp trùng toàn Netti, Việt giống); `:5.6` và `:6.12` Pāli trùng nhau trong bài, bản Việt giống nhau (1/1 cặp trùng nội bộ, 0 cặp Việt khác). Chuỗi tên đích đến `:6.14` theo công thức `sn15.1`, `sn15.11`, `sn15.13`: "không thấy được khởi điểm … bị vô minh che lấp, bị … trói buộc, trôi lăn và luân chuyển" (khởi điểm 9/15 khoá có cụm; vô minh che lấp 16/22).
  Thuật ngữ đã đo: `vipallāsa` → "sự đảo lộn" theo `an4.49` (cùng bốn đảo lộn tưởng–tâm–kiến) và `ne7:1.4`; tầng còn có "điên đảo" (10 tệp) và "đảo ngược" (11 tệp), "đảo lộn" 7 tệp. Bốn nội dung đảo lộn trong ngoặc (`:4.2`, `:5.1–5.4`, `:5.7`, `:5.8`) viết "vô thường là thường", "khổ là lạc", "vô ngã là ngã", "bất tịnh là tịnh"; `an4.49` diễn cùng bốn điều bằng "lấy vô thường làm thường" v.v. (không trong ngoặc). `thina`/`middha` → "hôn trầm" và "buồn ngủ" (131 dòng / 67 tệp dùng "hôn trầm và buồn ngủ"; "hôn trầm thụy miên" chỉ 3 tệp / 5 dòng, gồm `ne33:2.10`); định nghĩa `:7.2` theo `ne33:2.10` ("không khỏe khoắn, không kham nhậm của tâm"; "co rút của thân"). `saṅkilesa` → "ô nhiễm" (95/163 khoá có từ), `upakkilesa` → "tùy phiền não" để giữ hai từ khác nhau trong cùng đoạn (`:5.5` so với `:6.11`); tầng có `upakkilesa` → "ô nhiễm" 50/95 và "tùy phiền não" 11/95. `taṇhā` → "tham ái" theo `ne7:1.5`, `ne18:7.9` (cùng bộ Netti); toàn tầng "khát ái" 206 khoá so với "tham ái" 84 khoá. `abhinandati` → "hoan hỷ" (48 so với "hoan hỉ" 12). `anāgata` → "vị lai" (22/43). `tiracchānayoni` → "súc sinh" (51 + 26 "súc sanh" so với "bàng sinh/bàng sanh" 25), `pettivisaya` → "cõi ngạ quỷ", `asurakāya` → "chúng a-tu-la" (`dn18`, `dn19`, `an3.37`). `pariññā`/`pahāna` → "liễu tri" (165/316) và "đoạn trừ" (43; "từ bỏ" 97) theo cặp `ne28:2.2`; `samudaya` → "tập" theo `ne28:2.2`; `assādādīnavatā` → "vị ngọt và nguy hại" (bộ ba `assāda`/`ādīnava`: "vị ngọt" 40, "đáng ưa" 17; "nguy hại" 41, "tai họa" 14 trên 71 khoá). `mahākaccāyano` → "Tôn giả" (8 so với "Trưởng lão" 5).
  Dấu lược: Pāli có `…pe…` ở `:4.9`, `:4.10`, `:4.11`, `:6.2`, `:6.7` → đúng một `…`; `:6.4` có `…` trần → một `…`. Không có `(…)`. Dấu nháy khớp Pāli từng khoá: bài kệ mở “ ở `:1.1`, `:3.1` và đóng ” ở `:1.4`, `:3.4`; các khoá có dấu lemma `<b>…</b>ti` (`:4.1`, `:4.2`, `:7.1`, `:7.4`) không có nháy ở Pāli nên Việt cũng không thêm nháy; thẻ `<b>` không đưa sang Việt (như `ne13:3.1`).
  Số Pāli: soḷasa = 16 ("mười sáu"); tīhi = 3 ("ba lối"); tayo = 3 ("ba pháp"); catūsu = 4 ("bốn cơ sở"); dve = 2 ("hai pháp", "hai sự đảo lộn", "hai sự thật"); paṭhamaṁ = thứ nhất, dutiyaṁ = thứ hai, tatiyaṁ = thứ ba, catutthaṁ = thứ tư; cattāri = 4. Không có số lớn, không có `tiṁsa`/`sahassa`.
  Bất định đã ghi nhận (không thêm vào thân kinh): (1) `:2.1` `Vuttā` / `tassā` — chủ ngữ giống cái nên "bài kệ ấy" lấy theo bài kệ `:1.1–1.4` ngay trước. (2) `:2.2` `Hārasampāte` dịch "Ở nhóm phương thức" — chỉ toàn bộ phần các nhóm phương thức. (3) `:1.2` `Disalocanato disā viloketvā` dịch "nhìn khắp các hướng bằng lối nhìn các hướng" (`disālocana` là một trong năm lối `naya`); `ne2:6.2` dịch cùng tên là "soi như gương" không trùng với nghĩa `disā` + `locana`, nên không lấy theo. `aṅkusa` → "móc câu" theo `ne35:5.3`, còn `ne2` có "cây gai đẩy" (2 khoá); tầng có "móc" 14 khoá. (4) `:4.8` `attabhāvavatthu` — tầng dịch `attabhāva` là "thân" (5/5 khoá mẫu); ở đây "bản thân" để khỏi lẫn với `kāya`. (5) `:4.8`, `:4.12`, `:6.1`, `:6.5` chủ ngữ của `samanupassati` là sự đảo lộn (`so vipallāso`) hoặc người mang nó; viết không nêu chủ ngữ. (6) `:6.13` `Tāhi visujjhantaṁ` dịch "khỏi hai pháp ấy" (cách xuất xứ), không phải "nhờ". (7) `:6.14` `Tesaṁ` — "những ai ấy" (không thêm "chúng sinh" mà Pāli không nêu). (8) `:7.4` `kilesamāra`/`sattamāra` dịch sát từng thành tố: "Ma phiền não", "Ma chúng sinh"; `nivuto` hiểu là bị ba điều ở `:3.1–3.3` che phủ nhưng viết "đang bị che phủ" không nêu tác nhân. (9) `:7.11` `assādādīnavatā` dịch "vị ngọt và nguy hại" theo bộ ba `assāda`/`ādīnava`; đây là lời trích đầu bài kệ `desanā`, trong bài chỉ nêu hai thành tố đầu.
