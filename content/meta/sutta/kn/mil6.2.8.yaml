notes: |-
  Đã đọc HẾT Pāli lát qua v5/p5.txt trước khi viết. Không segment nào của lát này có …pe… nên hai phía đều 0 dấu lược. Mọi dấu nháy kép đều cân trên cả bài.

  Đây là bài dài nhất lát: khoá 1.2 và 2.1 là hai đoạn văn lớn, dịch từng mệnh đề theo
  đúng thứ tự Pāli và giữ nguyên số lượng cả hai danh sách (7 vị thầy cổ; 7 khoảng mục
  bệnh; 4 vế tính tình loài người).
  Tiền lệ có đếm: tikicchaka → thầy thuốc (22); chế định (16, mil3.5.4 đã dùng cho
  sikkhita); xuất gia (938); đệ tử; tất cả đều có; toàn tri (8); hư hoại (93); buông
  bỏ; nguyên nhân; bản chất (58).
  0 tiền lệ, đặt mới, kèm lý do:
  · sikkhāpada → giới hạnh tu học. Vì trong cả ba khoá còn lại nghĩa tu học là nghĩa
    nặng nhất của câu hỏi (sikkhitabba), dịch đơn giới luật sẽ làm mất nó; còn
    giới hạnh có 349 tiền lệ nên bám kho đó.
  · anavasesa → vô dư, theo glossary (sāvasesa là hữu dư, anavasesa là vô dư).
  · santāsa → chán nản. chán nản có 8 tiền lệ nhưng cho nghĩa gần hơn là nibbidā
    và virāga, nên đây là lựa chọn riêng theo ngữ cảnh đám đông nản chán, ghi ở đây.
  · ekappahāra → một sự cố gắng (0 tiền lệ, đặt mới; nhất tâm có 20 nhưng là nghĩa
    định thần, không phải nghĩa cố sức).
  · dhammadesanā → giảng Pháp; apāyagāmino → đi vào chỗ hư hoại.
  Tên riêng giữ theo Pāli: Nārada, Dhammantarī, Aṅgiraso, Kapilo, Kaṇḍaraggi, Sāmo,
  Atulo, Pubbakaccāyano (tất cả có trong chính Pāli khoá 1.2, và Nārada đã có 1 lần
  trong tầng). Gotama giữ như sa-môn Gotama (257 tiền lệ).
  Bất định đã ghi nhận: sādhikaṁ diyaḍḍha là hơn một phần rưỡi; dịch là hơn một
  trăm lần rưỡi giới hạnh tu học, tức hơn 150, không dịch thành 150 rồi làm tròn.
  ayase, pākaṭe, vitthārike, puthugate là bốn vị tính tình đứng thành chuỗi; ở 1.2
  Pāli có đủ bốn, còn ở 2.1 chỉ có pākaṭe dose — đã dịch đúng số vị theo từng khoá,
  không lấy danh sách của 1.2 sang 2.1 (lượt review đã phát hiện và sửa lỗi này).
  anavasesato sikkhāpadaṁ na paññapesi là chỗi phủ định bám vào anavasesa: không chế
  định giới hạnh tu học nào cho trọn vẹn. Đã giữ nghĩa phủ định đó thay vì dịch ra
  thành không chế định giới hạnh tu học nào, vì hai cách đó khác nhau.
  Câu 3.1 bảy vị là sattānaṁ; không nêu tên vì Pāli cũng không nêu, và bản dịch không
  được tự thêm. sampaṭicchāmi dịch là thừa nhận, giữ ngôi thứ nhất của người nói.
