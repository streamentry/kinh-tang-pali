notes: |-
  Đợt 19, làn 52. Dịch từ Pāli root commit đã ghim, đủ 71/71 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem dưới).

  **Tiêu đề, theo khuôn của các bài anh em cùng phẩm.**
  - `0.1` “Jātaka”, `0.2` “Bộ Mười Bài Kệ”, `0.3` “Phẩm Bốn Cửa” dùng lại đúng như `ja439`, `ja440`, `ja442` và các bài cùng phẩm (`Dasakanipāta` + `Catudvāravagga`). Dò toàn tầng cho các dòng đầu đề trùng Pāli với bài khác: 5.344 tệp bản Việt đã quét, 507 cặp khoá trùng nguyên văn Pāli, trong đó 24 cặp bản Việt khác. 24 cặp ấy đều là đầu đề: `0.1` “Jātaka” so với “Chuyện Tiền Thân” ở 16 bài Jātaka thuộc các nipāta trước (ja150, ja250, ja334, ja351, ja355, ja356, ja359, ja361–ja368, ja370), và `0.2` “Bộ Mười Bài Kệ” so với “Bộ Mười Bài Kinh” ở `thag10.1`–`thag10.7`; lựa chọn của bài này theo đúng `ja439`/`ja440`/`ja442`, cùng phẩm. Ngoài đầu đề có thêm 1 cặp: `5.3` trùng nguyên văn với `ja402:4.3` (`Chindajja kaṅkhaṁ vicikicchitāni,`), bản Việt khác, xem phần thuật ngữ.
  - `0.4` “3. Kinh Bốn Vị Giữ Bố-tát” và `16.1` “Kinh Bốn Vị Giữ Bố-tát thứ ba.” theo khuôn “N. Kinh <tên>” và “… thứ <số>” của `ja439` (“1. Kinh Bốn Cửa”), `ja440` (“2. Kinh Kaṇha”) và `ja442` (“Kinh Bà-la-môn Saṅkha thứ tư.”); số `3.` ở tiêu đề và `tatiyaṁ` ở 16.1 cùng bằng 3. `Catuposathiya` là tên chuyện, không có giải thích trong tầng Pāli đã ghim (không có văn xuôi): đọc là “(chuyện về) bốn vị giữ ngày uposatha”, vì kệ 1–4 mô tả bốn hạng người và kệ 8 gán bốn đức tính cho bốn vị (rồng, kim sí điểu, càn-thát-bà, vua Kuru); `uposatha` dịch “Bố-tát” theo đa số tầng (34 lượt “Bố-tát” ở 11 tệp, 16 lượt “bố-tát” ở 9 tệp, so với 2 tệp “Bát quan trai” và 1 tệp “trau giới”). Xem bất định 1.

  **Trùng nguyên văn trong chính bài (đã dò sau khi nén khoảng trắng): 3 nhóm, 0 nhóm lệch.**
  - Câu kết `Taṁ ve naraṁ samaṇamāhu loke”.` ở `1.4` = `2.4` = `3.4` = `4.4` = `9.6` (5 khoá): bản Việt giống hệt “người ấy ở đời được gọi là sa-môn”.”.
  - `11.3` = `12.3` = `13.3` = `14.3` (4 khoá, `Pañhassa veyyākaraṇena tuṭṭho,`): giống hệt “vui mừng vì lời giải đáp câu hỏi,”.
  - `11.4` = `12.4` = `13.4` (3 khoá, `Dadāmi te dhammapūjāya dhīra.`): giống hệt “tôi tặng ngài để cúng dường Pháp, hỡi bậc trí.”. `14.4` khác (`gāmavarāni soḷasa”.`) nên bản Việt khác.
  Tổng 19 cặp trùng trong bài (10 + 6 + 3), 0 cặp lệch.

  **Trùng nguyên văn với bài khác trong tầng.** Nguồn Pāli của cùng khuôn này có hai nơi: (a) `mil5.3.9:2.1–2.2` trích đúng câu `Catubbhi dhammehi samaṅgibhūtaṁ, Taṁ ve naraṁ samaṇaṁ āhu loke` (dạng `samaṇaṁ āhu` tách chữ, khác `samaṇamāhu` ở đây nên không tính vào cặp trùng nguyên văn); bản Việt của nó “thì ở cõi đời người ấy được gọi là sa-môn” là tiền lệ cho “được gọi là sa-môn”. Ở `mil5.3.9:3.1` bốn pháp được liệt kê chính xác như kệ 8 ở đây (`khanti appāhāratā rativippahānaṁ ākiñcaññaṁ` → “nhẫn nhục, ăn ít, từ bỏ khoái lạc, … sở hữu”): bài này dùng lại “nhẫn nhục” (`8.1`), “ăn ít” (`8.2`), “từ bỏ khoái lạc” (`8.3`) và “không sở hữu” (`8.4`). (b) `5.3` trùng nguyên văn với `ja402:4.3`; tại đó bản Việt gộp hai chữ Pāli “kaṅkhaṁ vicikicchitāni” thành “mọi mối nghi ngờ”. Tôi cố ý tách hai chữ (“hoài nghi” và “những điều phân vân”) vì chính bài này lặp lại cùng cặp ở `10.4–10.5` (`Acchecchi dhīro vicikicchitāni` / `Acchecchi kaṅkhaṁ vicikicchitāni`), nơi hai vế phải phân biệt được; 1 cặp trùng đã dò, 1 cặp khác. Không sửa `ja402` (ngoài lát).

  **Số Pāli (đã tự tính):**
  - `Catubbhi dhammehi` (9.5) = catu 4: “bốn pháp”, và kệ 8 đúng liệt kê bốn (`khanti` · `appāhāra` · `rativippahāna` · `akiñcana`), khớp; kệ 1–4 cũng là bốn đoạn định nghĩa sa-môn (không giận, ăn ít, bỏ trò vui và dâm dục, bỏ chiếm hữu).
  - `satapatta` (12.1) = sata 100 + patta cánh: “trăm cánh”.
  - `ratnasahassa` (12.2) = sahassa 1.000: “ngàn châu báu”.
  - `Gavaṁ sahassaṁ` (14.1) = 1.000: “một ngàn con bò”; `usabhañca nāgaṁ` = 1 bò đực + 1 voi (hai tân ngữ nối bằng `ca`, không có số): “một con bò đực và một con voi”.
  - `dasa ime` (14.2) = 10: “mười cỗ xe”.
  - `gāmavarāni soḷasa` (14.4) = 16: “mười sáu làng thượng hạng”; cùng cách với `ja456:3.1`/`12.1` (`gāmavarāni pañca` → “năm làng thượng hạng”, 2 khoá).
  - `tatiyaṁ` (16.1) = 3: “thứ ba”.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên công cụ đo):**
  - `samaṇa` → “sa-môn”: nhất quán toàn tầng (12 khoá ở `ja` và `mil5.3.9`).
  - `sappurisa` (1.2) → “bậc chân nhân”: 20 khoá chứa `sappuris…`; “bậc chân nhân” ở `dhp54:4`, `dhp83:1`, `dhp208:4`; `ja161:2.4` dùng “bậc thiện chí” (dạng cách).
  - `nāgarājā` (7.1, 8.1) và `nāgo` (15.1) → “Long vương”: tầng có 7 lượt “Long vương” ở 4 tệp (`cp12:1.2`, `cp13:1.2`, `cp20:1.2`, `snp2.14:5.1`) cho nāga là loài rồng, và 2 lượt “vua rồng” ở `dn16`; chọn “Long vương” vì ở đây nāga đứng cùng garuḷa và gandhabba (ba hạng sinh linh thần thoại), không phải con voi. Ngược lại `nāgaṁ` ở `14.1` đi cùng bò và xe (vật tặng) và `nāgadanta` (10.6) → “voi”, “ngà voi”: `ja455:2.2` và `ja357:4.3` dịch `nāgarājā` thành “vua voi”/“chúa voi” khi chữ ấy chỉ voi; 4 tệp dùng “ngà voi” (như `ud6.4`, `vv45`, `mil5.4.7`).
  - `garuḷo venateyyo` (7.2, 8.2) và `supaṇṇo` (15.2) → “kim sí điểu”: 6 tệp / 24 lượt “kim sí điểu” (`sn30.3`, `sn30.7-16`…) cho `supaṇṇa`; dùng cùng từ cho `garuḷa` vì ở bài này hai chữ cùng chỉ một vị (15.2 `supaṇṇo` = vị ở 7.2/8.2 `garuḷo`). `Venateyya` (con của `Vinatā`) giữ tên Pāli; xem bất định 6.
  - `gandhabbarājā` → “vua Càn-thát-bà”: “Càn-thát-bà” 61 lượt ở 19 tệp (thêm 22 lượt viết thường “càn-thát-bà” ở 7 tệp).
  - `kurūnaṁ rājaseṭṭho` → “bậc vua tối thắng của người Kuru”: “Kuru” 31 lượt ở 17 tệp, “xứ Kuru” 8 lượt ở 7 tệp; chọn “người Kuru” vì Pāli là sở hữu cách số nhiều của `Kuru` (dân tộc).
  - `khanti` → “nhẫn nhục”, `appāhāra` → “ăn ít”, `rativippahāna` → “từ bỏ khoái lạc”, `akiñcana` → “không sở hữu”: cả bốn theo `mil5.3.9:3.1`, nơi cùng bộ bốn đức được liệt kê; `akiñcana` còn là “không sở hữu” ở `dhp88:2`, `dhp221:4`.
  - `ūnūdaro … sahate jighacchaṁ` (2.1) → “bụng chưa đầy mà vẫn chịu được cơn đói”: `ūnūdaro` ở `snp3.11:29` và `mil7.6.10:2.3` dịch “bụng trống”/“bụng hơi vơi”; chọn “bụng chưa đầy” vì Pāli `ūna` “thiếu, chưa đủ” + `udara` “bụng”; `jighacchā` “đói”, cùng cách với `dhp203`, `ja298:1.4`, `ja450:3.3`.
  - `danto` → “đã điều phục”: 62 khoá chứa `dant…`; “điều phục” ở `dhp142:2`, `snp2.13:12.3`. `tapassī` → “hành khổ hạnh”: tầng chỉ 1 khoá (`tha-ap330:6.3`, “bậc tiết chế hành khổ”), nên dịch theo nghĩa. `mitapānabhojano` → “ăn uống có chừng mực”: cùng cách với `snp3.11:29` (`mitāhāro` → “ăn uống có chừng mực”).
  - `kopa` / `kuddho` (1.1, 1.3) → “nổi giận”, “giận”, “cơn giận”: tầng có 37 khoá chứa `kop…`/`kujjh…` ở 22 tệp (không tính chính bài này), nhất quán với `kodha` → “giận dữ” ở `ja440`; ở đây dùng “nổi giận / cơn giận” cho `kopa` để phân biệt dạng động từ.
  - `vibhūsaṭṭhānā virato methunasmā` (3.3) → “xa lìa việc trang điểm và dâm dục”: `methuna` → “dâm dục” (`snp1.12:12.1`, “xa lìa dâm dục”, 15 khoá chứa `methun…`); `vibhūsa` → “trang điểm” theo `kp2:8.1` và `mil7.4.1:2.1` (“trang điểm”); một chữ `virato` quản hai tân ngữ nên không lặp “xa lìa”. `cālikaṁ` là `na` + `alikaṁ` (sandhi) → “không nói … lời dối trá”.
  - `pariggaha` (4.1) → “sự chiếm hữu”: tầng chỉ 19 khoá, nghĩa “thu nhận” (`ja474:11.2` “nhận lấy”) hoặc “sự nắm giữ” (`mil6.3.9:2.3`); “chiếm hữu” giữ phần “nắm làm của mình”. `lobhadhammañca` → “mọi điều thuộc về tham”.
  - `ṭhitattaṁ` (4.3) → “tâm an trú”: 10 khoá chứa `ṭhitatt…` ở 9 tệp; “tâm an trú” ở `snp2.13:1.2`, `snp2.13:12.3`, `snp2.9:5.4`.
  - `amamaṁ` (4.3) → “không chấp là của ta”: `amama` trong tầng dịch “không sở hữu” (`snp3.4:21.2`, `snp1.12:14.2`) hoặc “không chấp thủ” (`snp3.5:12.1`, `snp3.5:13.2`), và `mamāyita` → “của ta” (`dhp367:2`, `snp3.4:18.2`, `snp4.2:6.3`); vì `akiñcana` (8.4) đã dùng “không sở hữu”, bài này tách `amama` thành “không chấp là của ta” (không dùng nháy để khỏi lệch phép đếm nháy Pāli).
  - `nirāsaṁ` (4.3) → “không mong cầu”: cùng cách với `ja330:3.3`, `snp3.4:21.2` (“không tham cầu”), `snp3.5:12.1` (“không còn mong cầu”).
  - `viggaho` (5.2) → “cuộc tranh luận”: cùng cách với `mil4.1:5.4` (“cuộc tranh luận”). `kaṅkhaṁ` → “hoài nghi” (110 khoá chứa `kaṅkh…`) và `vicikicchitāni` → “những điều phân vân” (22 khoá chứa `vicikicch…`; `ja248:1.2` “phân vân”); bài này dùng cố định cặp ấy ở `5.3`, `10.4`, `10.5`.
  - `atthadasā` (6.1) → “thấy được nghĩa lý”: 41 khoá chứa `atthadas…`; “thấy được ý nghĩa” ở `ja397:5.4`, “thấy được nghĩa vi tế” ở `snp1.9:26.1`. `yoniso` (6.2) → “như lý”: 57 khoá chứa `yoniso`, “như lý” ở `iti16:2.2`, `iti16:3.1`, `iti16:3.5`.
  - `janindā` (6.4) → “các vị vua”: 11 khoá chứa `janinda` ở 9 tệp, “nhân chủ” ở `ja303:4.1`, “vua” ở `ja183:2.2`; ở đây số nhiều, chủ ngữ của `nayeyyuṁ`, nên “các vị vua”.
  - `subhāsitāni` / `dubbhāsita` (9.1, 9.2) → “lời khéo nói” / “nói dở”; `arā … nābhyā` (9.4) → “nan hoa … trục bánh xe”: “nan hoa” 12 lượt ở 6 tệp (`dn17:1.7.4`, `dn26:5.12`, `dn30:1.9.10`), “trục” cho `nābhi` trong cùng ngữ cảnh bánh xe ở `dn17:1.7.4` (“đầy đủ vành, trục và mọi chi tiết”).
  - `dhammagū dhammavidū sumedho` (10.2): hai chữ đầu không có tiền lệ trực tiếp trong tầng (0 khoá chứa `dhammagū`/`dhammavidū`); dịch “đi theo Pháp, thông hiểu Pháp”. `sumedho` → “bậc thiện trí” (`iti38:8.3`, “bậc thiện trí”). `dhīra` → “bậc trí” (112 khoá chứa `dhīr…`, “bậc trí” ở `dhp175:3`, `dhp181:1`).
  - `Cundo yathā nāgadantaṁ kharena` (10.6) → “như người thợ tiện dùng cái giũa nhám cắt ngà voi”: `cunda` trong tầng chỉ có tên người (31 khoá, `Cunda` người đồ tể ở `dhp15:0`, thí chủ Cunda ở `mil5.3.6`); ở đây không có động từ nào ngoài `acchecchi` (10.4–10.5) cho thấy tên riêng, và `yathā` mở một so sánh, nên đọc `cunda` như danh từ chung “thợ tiện” (nghĩa đen của `cunda`); “thợ tiện” có ở `dn22:2.8`, `mn10:4.8` (cho `bhamakāra`). `kharena` → “giũa nhám” (`khara` “thô, nhám”). Xem bất định 3.
  - `Nīluppalābhaṁ`, `dhūmasamānavaṇṇaṁ` (11.1–11.2) → “màu ánh hoa súng xanh”, “màu như khói”: `nīluppala` → “hoa súng xanh” theo `vv45:7.1`; `anagghaṁ` → “vô giá” (nghĩa chữ: không có giá nào xứng; tầng chỉ có `anagghiyo` ở `mil5.4.2:8.2`, cùng gốc nhưng dịch “không thể so sánh”, nên không dùng lại).
  - `dhammapūjāya` (11.4, 12.4, 13.4) → “để cúng dường Pháp”: `pūjā` → “cúng dường” (`dhp195:1`, `ja477:9.2`); `dadāmi te` → “tôi tặng ngài” (không có tiền lệ chính xác trong tầng; `ja456:12.1` dịch “Ta ban cho ngươi” nhưng ở đó người nói là vua nói với kẻ dưới, còn ở đây các vị nói với bậc được tôn trọng ở `10.1`).
  - `Suvaṇṇamālaṁ satapattaphullitaṁ` (12.1) → “vòng hoa vàng có những đóa trăm cánh đang nở”: tầng có 6 khoá chứa `satapatt…` ở 3 tệp trước bài này (`ja206:2.3`, `ja279`, `ja280:6.4`), nhưng đó là ngữ cảnh khác, không phải tính từ của hoa, nên không dùng lại; dịch theo cấu tạo `sata` (100) + `patta` + `phullita`. Báo, không sửa (ngoài lát): ở `ja206:2.3` và tiêu đề `ja279` (“Kinh Bảy Lá”), `satapatta` đang được dịch với chữ “bảy” trong khi `sata` là 100; chưa xác định được nghĩa đúng của chữ ấy trong hai bài đó.
  - `ājaññayutte ca rathe` (14.2) → “cỗ xe thắng ngựa thuần chủng”: 18 khoá chứa `ājañña`, “ngựa thuần chủng” ở `ja24:0.4`; “xe ngựa kéo” ở `ja289:2.1`.
  - `bodhisatto` (15.5) → “Bồ-tát” (61 khoá chứa `bodhisatt…` ở 10 tệp, cố định). `Sāriputto`, `Kolito`, `Anuruddho`, `Ānanda`, `Vidhura` giữ tên Pāli.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 10 dấu mở · 10 dấu đóng ở các khoá 1.1/1.4, 2.1/2.4, 3.1/3.4, 4.1/4.4, 5.1/5.4, 6.1/7.4, 8.1/8.4, 9.1/9.6, 10.1/14.4, 15.1/15.6; Việt cũng đúng 10/10, lệch 0/71 khoá. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0. Không có Pāli kết `….`. Một lỗi đã bắt khi tự kiểm: bản nháp đầu viết `6.1` không có dấu mở nháy (vì đọc `6.1–7.4` là tiếp nối lời của `5.1–5.4`), trong khi Pāli có `“` ở `6.1` và đóng `”` ở `7.4` (lời của `5.1–5.4` đóng ở `5.4` rồi mở lại ở `6.1`); phép so từng khoá bắt được và đã sửa.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Tên chuyện `Catuposathiya` (0.4, 16.1): không có văn xuôi khung truyện trong tầng đã ghim nên không xác định được “bốn” là bốn vị nào giữ ngày uposatha (đọc từ kệ: rồng, kim sí điểu, càn-thát-bà, vua Kuru) và “giữ” là hành vi nào; “Kinh Bốn Vị Giữ Bố-tát” là cách đọc ít giả định nhất theo cấu tạo `catu` + `uposatha` + `-iya`. Cách đọc “Kinh Bốn Ngày Bố-tát” cũng khả dĩ.
  2. `kattāraṁ anomapaññaṁ` (5.1): `kattar` nghĩa gốc “người làm / người hành sự”; ở đây dịch “bậc cố vấn có trí tuệ không thấp kém”, tức đọc `kattā` như người cố vấn/đại thần, vì kệ 10 gọi người được hỏi là `dhammagū dhammavidū sumedho` và bài kệ 6–8 là lời đề nghị người ấy phân xử. Nghĩa “cố vấn” không có tiền lệ nào trong tầng (17 khoá chứa `kattā…` chỉ có nghĩa “người làm”: `ja90:1.4`, `ja308:3.1`, `ja343:3.1`, `mil5.3.11:3.10`); tôi không xác minh được nghĩa này từ tầng, nên đặt thành bất định. Nếu cách đọc sai thì chỉ hai chữ “bậc cố vấn” (5.1) bị ảnh hưởng, không đổi ý của kệ 5–10.
  3. `Cundo yathā nāgadantaṁ kharena` (10.6): xem phần thuật ngữ. Cách đọc `Cundo` là tên riêng (một người tên Cunda, thợ tiện) khả dĩ, chỉ khác ở chữ “người thợ tiện” so với “Cunda, người thợ tiện”; `nāgadantaṁ` có thể là “ngà voi” (chọn) hoặc “vật làm bằng ngà voi”.
  4. `Na cālikaṁ bhāsasi kiñci loke` (3.2) và `Gandhabbarājā pana kiṁ vadesi` (7.3): `bhāsasi` và `vadesi` hình thức là ngôi thứ hai số ít (hiện tại) nhưng mệnh đề đi liền `Taṁ ve naraṁ …` (3.4) là ngôi thứ ba, và `7.3` hỏi về vua càn-thát-bà ở ngôi thứ ba; `vadesi` có thể là aorist ngôi thứ ba của `vadati`, còn `bhāsasi` không giải thích được như vậy bằng tầng. Bản Việt bỏ chủ ngữ (“không nói một lời dối trá nào ở đời”) và dịch `7.3` ở ngôi thứ ba, nên không đưa ngôi thứ hai vào thân kinh; nếu Pāli thật là ngôi thứ hai ở 3.2 thì chủ ngữ của cả 3.1–3.3 là “ông”, nghĩa không đổi.
  5. `Kathaṁ nu kathānaṁ abhāsitānaṁ, Atthaṁ nayeyyuṁ kusalā janindā` (6.3–6.4): `kathānaṁ abhāsitānaṁ` (“những lời chưa được nói ra”) và `atthaṁ nayeyyuṁ` (“dẫn ra ý nghĩa”) dịch sát chữ; chủ ngữ `kusalā janindā` có thể là chính bốn vị đang hỏi hoặc những vị vua khéo nói chung; `Kathaṁ nu` (“làm sao”) là câu hỏi tu từ nhưng Pāli kết bằng dấu chấm nên bản Việt cũng không đặt dấu hỏi. Tương tự `7.1–7.4` đều là các vế hỏi “nói như thế nào / nói gì” kết bằng nháy đóng, không đặt dấu hỏi.
  6. `venateyyo` (7.2, 8.2): dạng phái sinh từ `Vinatā` (“con của Vinatā”); trong tầng, `Vinatā` chỉ là tên sông ở 4 khoá `tha-ap` (không liên quan). Giữ nguyên `Venateyya` làm danh xưng, không giải thích thêm vào thân kinh.
  7. `Kaṇṭhāvasattaṁ maṇibhūsitaṁ me` (13.2): `maṇibhūsitaṁ` có thể bổ nghĩa cho viên ngọc (“được ngọc điểm trang”) hoặc cho vật được đeo ở cổ; `me` (“của tôi”) có thể thuộc `kaṇṭhā-` hoặc cả cụm. Bản Việt dịch “đeo nơi cổ tôi, được ngọc điểm trang” là cách ít giả định nhất.
  8. `Sakesaraṁ` (12.2): đọc “có nhụy”; chỉ có 1 khoá này ở tầng Pāli đã ghim chứa `sakesaraṁ`. `ratnasahassa` (12.2): `ratna` dạng chữ ngắn của `ratana`, dịch “châu báu” cho tổng quát; không xác định đó là 1.000 viên ngọc hay vô số châu báu, nên “ngàn châu báu”.
  9. `Ānandapaṇḍito` (15.4): có thể là “Ānanda bậc hiền trí” (chọn) hoặc một tên ghép “Ānanda-paṇḍita”; nghĩa không đổi, người nói/nhân vật là Ānanda.
  10. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1: bốn kệ định nghĩa sa-môn do bốn vị lần lượt nói (rồng, kim sí điểu, càn-thát-bà, vua Kuru, theo thứ tự kệ 8 gán `khanti` / `appāhāra` / `rativippahāna` / `akiñcana`); 5–7: bốn vị cùng hỏi (số nhiều `pucchāma`, `no`, `sabbe`); 8–9: người được hỏi (Vidhura) trả lời; 10–14: lời khen và tặng quà của bốn vị; 15: lời kết nhận diện kiếp trước. Đây là suy luận từ nội dung, không được ghi vào thân kinh.

