notes: |-
  Dịch trực tiếp từ Pāli root cho đủ 99 khoá; không có English Sujato, không có english-project và không có bản Việt hiện hành phân đoạn cho ps3.6 nên chưa đối chiếu được tầng tham khảo nào cho chính bài này. Chỗ gần nhất để đối chiếu là công thức ba nhiệm màu ở an3.60, dn28 (công thức ādisati bốn tầng) và dn11 trong tầng Việt của dự án; các bài đó đã được dùng làm tiền lệ chứ không sao chép nguyên văn.

  Chơi chữ không chuyển được trọn vẹn: ijjhati → iddhi (thành tựu → thần thông) và paṭiharati → pāṭihāriya (đẩy lui → nhiệm màu). Bản Việt giữ động từ thành tựu và đẩy lui ở vế đầu, danh từ thần thông và nhiệm màu ở vế sau, để nối giữa hai vế vẫn đọc ra được; sự ăn khớp về gốc từ của hai vế thì tiếng Việt không giữ được, đó là phần mất ở bản dịch, không phải phần thêm vào thân kinh.

  Ba nhiệm màu theo an3.60: iddhipāṭihāriya → thần thông nhiệm màu, ādesanāpāṭihāriya → tha tâm nhiệm màu, anusāsanīpāṭihāriya → giáo hóa nhiệm màu (dn11 dùng thị hiện thần thông và thị hiện giáo giới, dn28 dùng ký tâm cho ādesanā; đã chọn theo an3.60 vì cùng một công thức ba phần). Công thức ādisati ở 3.2 đến 3.13 theo an3.60 (đoán biết nhờ dấu hiệu) và dn28 (‘Ý của ông như thế này, ý của ông như thế kia, tâm của ông là như vậy’ cho mano, mano, citta); manosaṅkhārā paṇihitā → ý hành đang được hướng đến theo dn28:6.16; cetasā ceto paricca pajānāti → bằng tâm biết rõ tâm.

  Thuật ngữ đã đếm trên tầng Việt hiện có (khoá Pāli có từ đó và đã có bản Việt, trừ ps3.6): nekkhamma → xuất ly (115 khoá dùng xuất ly, 27 dùng ly dục; ps3.7 hiện dùng ly dục, 4 khoá; chọn theo đa số tầng); abyāpāda → sự không sân hận (33) hoặc không sân (73); byāpāda → sân hận (183); ālokasaññā → tưởng ánh sáng (11) so với nhận biết ánh sáng (12) cân nhau, chọn tưởng vì saññā ở khắp nơi dịch là tưởng; thinamiddha → hôn trầm và buồn ngủ (150); avikkhepa → sự không tán loạn (17 trong tầng, và trong chính ps1.0, ps1.9); uddhacca → trạo cử (28 trong tầng, ps1.9, ps3.3); vicikicchā → nghi hoặc (184 và glossary); pāmojja → sự hân hoan (37) so với hoan hỷ (96): chọn hân hoan để phân biệt với hỷ (pīti), như ps3.7; arati → bất mãn (26) so với chán (14); kilesa → phiền não (52; ps3.3 dùng phiền não); nīvaraṇa → triền cái (181); arahattamagga → A-la-hán đạo (ps1.9, ps3.3); dhammavavatthāna → sự xác định pháp (ps1.0 và mil3.7); saṅkappa → tư duy (32), anāvilasaṅkappa → tư duy không vẩn đục theo dn34:2.3.90; vitakka và vicāra → tầm và tứ; kāmacchanda → dục tham (75) theo glossary.

  Khác biệt so với ps3.7 (bài sinh đôi, cùng một danh sách tám phần tử và cùng vế bị diệt): ps3.7 hiện dùng uddhacca → chấp thủ, avikkhepa → không hồi huyễn, arati → lân cận, kilesa → uế nhiễm, ālokasaññā → nhận biết ánh sáng. Ở ps3.6 tôi theo đa số tầng như trên chứ không theo ps3.7; hai bài nên được người biên tập hòa lại khi ps3.7 được rà. Đây là bất định cần người phán, không phải lỗi đã phân xử.

  Bất định cần ghi: (1) idaṁ pajahatha, idaṁ upasampajja viharatha ở 4.5 đều là idaṁ; bản Việt theo an3.60 với điều này rồi điều kia, như tiền lệ chứ Pāli không có từ kia; (2) tadanudhammatā sati ở 5.5 đến 13.5 dịch là niệm thuận theo điều ấy, đọc tadanudhammatā như tính chất thuận theo điều ấy; có thể đọc thành trạng từ, chưa có tầng tham khảo phân xử; (3) āsevitabba → thực hành (cân với thân cận, 13 so với 12) vì đối tượng là sự xuất ly, trí, sơ thiền nên thân cận nghe lạ; (4) vitakkayato vicārayato → nơi người đang tầm, đang tứ: giữ thuộc cách chỉ người đang tầm tứ, không biến thành sự suy xét chung chung; (5) amukaṁ nāma vitakkaṁ → một ý nghĩ như thế nọ.

  Dấu lược: Pāli có …pe… ở 4 khoá (2.4, 11.6, 12.6, 14.8); Việt giữ đúng một dấu lược mỗi khoá, 11.6 và 12.6 kết bằng khoảng trắng rồi …. theo quy ước Pāli kết lược rồi chấm; không có dấu lược nào ở Việt mà Pāli không có. Pāli không có số nào; không có số Pāli cần tính. Thẻ b trong Pāli ở 2.1, 3.1, 4.1 được bỏ như các bài ps khác.

  Pāli trùng nguyên văn trong chính bài: 12 nhóm, 39 khoá, gồm 3.3, 3.6, 3.9; 3.4, 3.7, 3.10, 3.13; 5.1 và 14.1; 5.2 và 14.2; 5.4 đến 13.4 (chín khoá); 5.6 đến 10.6 cùng 13.6 (bảy khoá); 6.1 và 14.4; 6.2 và 14.5; 7.1 và 14.7; 11.6 và 12.6; 13.2 và 14.10; 14.3 và 14.6. Bản Việt của mọi nhóm giống nhau, 0 nhóm khác. Hai khoá chỉ khác nhau ở chữ hoa đầu câu hoặc dấu kết (13.1 và 14.9, 14.3 và 14.11) không tính là trùng nguyên văn; bản Việt của hai cặp này vẫn giống nhau.

  Phép đo tự chạy trước khi ghi: tập khoá Việt bằng tập khoá Pāli, 99 trên 99 và cùng thứ tự; 0 lệch nháy đơn và nháy kép trên 99 khoá; NFC, không khoá rỗng, không khoảng trắng thừa, không Pāli lọt sang Việt ngoài tên bài và tên Paṭisambhidāmagga ở 0.1. Đã đọc đối chiếu từng cặp Pāli và Việt cho cả 99 khoá.

