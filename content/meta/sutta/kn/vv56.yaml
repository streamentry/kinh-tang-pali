notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ Vimānavatthu.
  29/30 khoá Pāli trùng nguyên văn vv57, chỉ 0.4, 5.3, 6.1, 8.1 khác — hai bài
  bắt buộc dịch giống hệt nhau ở những chỗ không khác, và bản ghi chỉ khác đúng 4 khoá.
  Tiền lệ đếm được: Vimānavatthu giữ Pāli 22/23; Purisavimāna → Chuyện Cung Điện
  Nam Hư Không 9/18 (thiên cung 5, giữ Pāli 3, cảnh giới người phàm 1) — theo
  vv55/58/61/62/65/72/73/75/76, bỏ hai cách lệch; Mahārathavagga → Phẩm Cỗ Xe Lớn
  4/7 (Đại Xa Phẩm 1, giữ Pāli 2); `So devaputto attamano` → Vị thiên tử ấy vô cùng
  hoan hỷ 7/15; `kammassidaṁ phalaṁ` → quả báo của nghiệp này là thế 7/19;
  `Tena metādiso vaṇṇo` → Nhờ vậy tôi có được dung sắc như thế này 8/20.
  1.1-2.4 theo họ vv59/vv70 là đa số cho từng câu: 1.1 hòa 2-2 với vv70 nên chọn
  theo vv59 vì cùng họ với 1.2-2.4; 1.3 hòa 2-2 với vv58 nên theo vv59; 1.4
  `Veḷuriyathambhā` 2/5; 2.1-2.4 đều 2/4 theo vv59.
  3.1 `Kena tetādiso vaṇṇo` dùng ngôi `te` (ngài) vì đây là câu hỏi hỏi thiên tử;
  đa số chung là 'Do đâu nàng' (3/9, nữ, không hợp) nên giữ nhóm 'ngài' (3/9).
  `sabbadisā` dịch 'khắp mọi phương' (khớp nghĩa 'mọi phương') dù đa số tầng là
  'khắp muôn phương' 7 — 'muôn' thêm sắc thái không có trong Pāli, ghi lại.
  `mahapphalaṁ` → quả lớn (iti26, sn10.12); `Atthāya vata me` → Thật vì lợi ích cho
  tôi (sn10.12); `Tattha cittaṁ pasādetvā` trùng Pāli tha-ap520:3.2 nên dùng lại.
  `Tāvatiṁsagato santo` → cõi Ba Mươi Ba (tha-ap400, dn23).
  Danh từ `buddho`/`bhikkhu` nằm ở khoá 6.1 của Pāli nên để nguyên ở 6.1; 6.2 chỉ
  giữ `araññā gāmamāgato`, không dịch trượt đơn vị nghĩa sang khoá kế tiếp.
  0 tiền lệ, đã ghi lý do: `Paṭhamakaraṇīyavimānavatthu` chưa có tiền lệ; dịch
  `karaṇīya` là đáng tán thán, nên tiêu đề là Chuyện Cung Điện Đáng Tán Thán Lần
  Thứ Nhất (không dùng lại Chuyện Cung Điện Người Gác Cổng của vv55 vì đó là
  `Dvārapāla`, tức thành khác). 5.2 `paṇḍitena vijānatā` có dấu hiệu lỗi cách (cần
  `vijānatā` là danh từ chủ thể); dịch theo nghĩa 'được bậc hiền biết rõ'.
  `Sammaggatesu` → hội tụ (an3.37:2.2).
  Tiêu đề 0.4 giữ số 6 như vv55/58/61; colophon 8.1 bỏ số (theo vv61, vv72, vv73) và
  thêm số thứ tự bộ. `…pe…` ở 3.2, 4.2, 7.2 giữ đúng một dấu lược.
  Kiểm toán độc lập 2026-10-11: đọc đối kháng 30 khoá với Pāli. 6/30 khoá có lỗi nghĩa thật, đã sửa; 3 khoá nhỏ (thêm nghĩa) đã gọt; 4 chỗ chưa sửa, ghi bên dưới.
  Lỗi nghĩa thật (accuracy fix): (1) 0.4 và 8.1, 5.1 — `karaṇīya` là 'nên làm', không phải 'đáng tán thán' (chữ đầu của kệ `Karaṇīyāni puññāni`; ghi chú cũ 'dịch karaṇīya là đáng tán thán' là sai); sửa thành 'Việc Nên Làm' / 'Những việc phước nên làm', đổi `translationTitle` cho khớp. (2) 5.2 — `paṇḍitena vijānatā` là cách công cụ chỉ tác nhân của gerundive `karaṇīyāni`: 'bởi bậc trí có hiểu biết'; bản cũ đọc thành 'bậc hiền đã biết rõ' (mất quan hệ 'nên làm bởi ai'). Đây cũng là chỗ notes cũ ghi 'có dấu hiệu lỗi cách' mà không phân xử; nay đã phân xử. (3) 5.3 — `Sammaggatesu` là 'đã đi đúng đường' (`sammaggatā sammāpaṭipannā` ở mn60, mn117, dn2, an10.176 đều dịch 'đi đúng đường, thực hành đúng'), không phải 'hội tụ'; ghi chú cũ viện an3.37:2.2 cho 'hội tụ' không đứng vững — dạng `sammaggata` ở tầng Pāli chỉ xuất hiện trong công thức 'sa-môn, bà-la-môn đi đúng đường'. 5.4 'nơi vật bố thí có quả lớn' theo tiền lệ `yattha dinnaṁ mahapphalaṁ` (iti26, ja495, an5.36), bỏ 'vật cho ấy' ('ấy' không có trong Pāli). (4) 4.3 — `yassa kammassidaṁ phalaṁ` là 'về nghiệp mà đây là quả báo' (quan hệ từ `yassa` + 'đây'), không phải 'quả báo của nghiệp này là thế' (đảo quan hệ, biến thành mệnh đề tự đủ); đo tầng: 'quả báo của nghiệp này là thế' 51 khoá trong họ vv, đa số đang mang lỗi này.
  Khoá nhỏ đã gọt: 2.4 bỏ 'lượn bay' (Pāli chỉ `naccanti`, không có bay); 6.2 bỏ 'sâu' (Pāli chỉ `araññā`); 5.4 bỏ 'ấy'. Ba khoá này khớp lại với vv57 (cùng Pāli).
  Chưa sửa, lệch cả họ: 0.2 `Purisavimāna` dịch 'Nam Hư Không' — Pāli không có `ākāsa`; không sửa riêng một tệp (sẽ lệch cả bộ), cần sửa đồng loạt toàn bộ phẩm. Không sửa dù nghi ngờ: 4.1 'vô cùng hoan hỷ' (`attamano` tự đã là hoan hỷ; chỉ thêm cường độ), 2.1 'thỏa thích' (Pāli `acchasi pivasi khādasi ca` không có chữ này), 1.4 `rucakatthatā` dịch 'trải thảm rực rỡ' (nghĩa chính xác của hapax `rucaka` chưa phân xử được trong kho: 'vàng' hay 'rực rỡ'; 11 khoá cùng Pāli dịch lệch nhau), 2.4 `nāriyo` dịch 'tiên nữ' theo họ (Pāli chỉ là 'phụ nữ').
  Điểm: semantic_fidelity 9.3 → 8.6, grammar_logic 9.3 → 8.8, terminology 9.1 → 8.3, vietnamese_clarity 9.3 → 9.2, ambiguity_integrity 9.0 → 8.5; final_score 9.19 → 8.93. Hạ điểm vì bản cũ có 6/30 khoá sai nghĩa thật mà lượt chấm 2026-10-04 bỏ sót; sau sửa, điểm phản ánh các bất định còn lại ở trên. Các tiêu chí còn lại giữ nguyên.
  Không có thay đổi về `status` trong lượt này; blocker upstream giữ nguyên.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
  Lượt cải thiện 2026-10-13: đọc đối kháng lại 30 khoá với Pāli, đo tiền lệ trong họ Vimānavatthu (kn/vv, 85 bài). Đổi 4 khoá, đều là bỏ phần thêm nghĩa hoặc khôi phục chữ Pāli bị bỏ; không đổi khoá/ID.
  (1) 2.1 `acchasi pivasi khādasi` 'ăn uống thỏa thích' → 'uống và ăn': 'thỏa thích' không có trong Pāli, và Pāli xếp uống trước ăn; tiền lệ 4/10 khoá cùng Pāli đã dùng 'uống và ăn', 4/10 dùng 'ăn uống thỏa thích'. Accuracy fix nhẹ. (2) 2.3 `kāmaguṇettha` (= kāmaguṇā ettha): bản cũ bỏ `ettha`; thêm 'ở nơi đây' (4/9 khoá cùng Pāli ở họ vv có dịch `ettha`, 5/9 bỏ; đây là lựa chọn bám Pāli hơn là theo số đông, đã ghi để không lệch lặng lẽ). (3) 3.1 `Kena tetādiso vaṇṇo` 'sắc diện dung nhan' → 'dung sắc': `vaṇṇo` chỉ là một từ, bản cũ ghép hai từ đồng nghĩa; nay thống nhất với 3.3 và 7.1 trong chính bài; 'Do đâu ngài có được dung sắc như thế' có 6/44 khoá cùng Pāli ở dạng 'ngài' (33/44 là dạng 'nàng', không hợp người nghe ở đây). (4) 4.1 `attamano` 'vô cùng hoan hỷ' → 'hoan hỷ': 'vô cùng' là cường độ không có trong Pāli; 'Vị thiên tử ấy hoan hỷ' và 'Thiên tử ấy hoan hỷ' chiếm 13/27 khoá cùng Pāli so với 10/27 có 'vô cùng'. Bản 4 khoá này nay lệch vv57 (cùng Pāli, chưa sửa cùng lúc) ở các khoá 2.1, 2.3, 3.1, 4.1; vv57 và các bài cùng họ cần được sửa đồng loạt nếu giữ nhất quán.
  Điểm đổi: semantic_fidelity 8.6 → 8.8 (bỏ 3 chỗ thêm nghĩa, khôi phục `ettha`); terminology 8.3 → 8.6 (3.1 nay đồng nhất 'dung sắc' cho `vaṇṇo` ở cả ba khoá; và 0.2 'Nam Hư Không' mà lượt trước ghi chưa sửa nay đã thành 'Thiên Cung Của Nam Giới' trong bản hiện hành, nên ghi chú 'chưa sửa 0.2' ở trên đã lỗi thời); vietnamese_clarity 9.2 → 9.3 (bỏ cặp từ đồng nghĩa 'sắc diện dung nhan'). Các tiêu chí khác giữ nguyên, kể cả triangulation 7.5 (không có bản Anh độc lập) và ambiguity_integrity 8.5.
  Bất định còn lại, đã cân nhắc và KHÔNG đổi: 1.4 `rucakatthatā` (hapax: toàn tầng Pāli chỉ có đúng 11 lần dạng này, không có dạng rucaka đứng riêng nên không đối chiếu được; 'trải thảm rực rỡ' 8/11 khoá cùng Pāli là cách đọc theo họ, nghĩa chính xác của `rucaka` chưa phân xử được); 2.4 `nāriyo` 'tiên nữ' (Pāli chỉ là 'phụ nữ', 2/9 khoá cùng Pāli dùng 'nữ nhân', 'tiên nữ' theo họ), `suvaṇṇachannā` 'khoác trang sức vàng ròng' (Pāli là 'phủ/che bằng vàng'; 'ròng' là thêm nhẹ, giữ theo họ) và `naccanti` 'khiêu vũ' (so với 'múa' ở 3/9); 1.1 `vimānaṁ` dịch 'tòa lâu đài' (7/12) nhưng nhan đề dùng 'Cung Điện' (theo quy ước đặt tên họ vv); 5.2 `vijānatā` 'có hiểu biết' còn hơi nặng nề. Không có lỗi kỹ thuật mới; technical_integrity giữ 9.6; bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` do coordinator chạy.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 3 khoá bất đồng nghĩa → sửa 1 (2.4 nāriyo: các tiên nữ → các nữ nhân, vì Pāli chỉ nói nāriyo là những người nữ, không có ý thiên nữ; tầng có 4 khoá cùng Pāli đã dịch nữ nhân, và ở vv84 accharā là tiên nữ còn nārī là nữ nhân), giữ 1 (0.4 và 8.1 Paṭhama: bản nguyên bài bỏ chữ thứ nhất mà Pāli có), bất định 1 (1.4 rucakatthatā: bản nguyên bài hiểu rucaka là vàng, bản dự án hiểu là rực rỡ; hapax, Pāli và tầng không phân xử được, giữ theo họ vv). Đọc đối kháng lại cả 30 khoá với Pāli, không có khoá nào khác phải đổi; nháy kép, dấu lược …pe… và tập khoá khớp Pāli (0 lệch). Lỗi ngoài lát: 2.4 ở vv55, vv57, vv59 và vv85 (cùng Pāli) vẫn dịch tiên nữ. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (đợt 2, lô G5, Claude Sonnet 5.5 (Claude Code)): sửa 2.4: suvaṇṇachannā
  (channa là phủ, che) "khoác trang sức vàng ròng" đổi "phủ vàng" khớp vv55, vv77, vv79, vv85.
