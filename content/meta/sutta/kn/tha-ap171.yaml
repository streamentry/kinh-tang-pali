notes: |-
  Bản dịch phủ đủ 28/28 khoá Pāli, thứ tự khoá y hệt Pāli gốc (`pali.pal('kn','tha-ap171')`).

  **Pāli trùng nguyên văn, dùng lại nguyên văn bản dịch** (chỉ mục Pāli→Việt dựng trên toàn
  tầng `content/translation/vi/project/`, 5.407 tệp Việt / 156.518 khoá Việt):
  - `Therāpadāna ` → `Therāpadāna` — 379 cặp cùng bản Việt, 9 cặp dùng `Trưởng Lão Ký Sự`.
  - `Supāricariyavagga ` → `Phẩm Phục Vụ Tốt` — 6/7 (cùng phẩm: tha-ap163, 165–169; tha-ap164
    mới hơn dùng `Phẩm Supāricariya`).
  - `“Nagare bandhumatiyā, ` → `“Tại kinh thành Bandhumatī,` — 7/11, nhóm lớn nhất; còn lại
    chia đều cho `Tại thành thị` 1, `Ở kinh đô` 1, `Ở kinh thành` 1, `Ở thành` 1.
  - `mahāpūgagaṇo ahu; ` → `có một đại chúng đông đảo;` — 1/1.
  - `puññakkhettaṁ anuttaraṁ. ` → `ruộng phước vô thượng.` — 1/1 (sn11.3:15.4); cặp thứ hai
    cùng Pāli (`Puññakkhettaṁ anuttaraṁ,` ở tha-ap448:2.3) dùng `ruộng phước tối thượng vô
    song` nhưng ở vị trí giữa câu và có dấu phẩy.
  - `Ekanavutito kappe, ` → `Vào chín mươi mốt kiếp trước,` — 31/100, nhóm lớn nhất; kế tiếp
    `Từ chín mươi chín kiếp trước,` 19 (ghi `chín mốt` khác `chín` — Pāli `chī` là số chín,
    dịch `mốt` mới đúng; nhóm 19 cặp kia ghi sai số).
  - `Duggatiṁ nābhijānāmi, ` → `Ta không biết mình rơi vào khổ đau,` — 124/349, nhóm lớn
    nhất; nhóm kế tiếp `Tôi không còn biết đến đọa xứ nào,` 66 và
    `Tôi không còn biết đến khổ xứ,` 51. Chọn 124 vì luật Pāli trùng yêu cầu dùng lại nguyên
    văn bản đã có.
  - `cakkavattī mahabbalo. ` → `là Chuyển luân vương có đại thần lực.` — 38/92, nhóm lớn
    nhất.
  - `Paṭisambhidā catasso, ` → `Bốn vô ngại giải,` — 396 cặp, chỉ 1 biến thể.
  - `…pe… ` → `…` — 665/665, đúng một dấu lược, không mở rộng.
  - `kataṁ buddhassa sāsanaṁ”. ` → `đã làm tròn lời dạy của Đức Phật”.` — 363/396.
  - `Itthaṁ sudaṁ … abhāsitthāti` → `Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ
    này.` — 421/453 (đếm bằng script trên toàn tầng; thêm 1 cặp rơi vào cách khác). Khoá `:7.1` đã có sẵn trên đĩa đúng nhóm này nên giữ nguyên.
  Tổng cộp 11 khoá dùng lại nguyên văn từ tiền lệ đếm được.

  **Mốc bốn cặp kệ, 91 kappas và số kiếp của vị Chuyển Luân Vương — đây là chỗ yếu nhất của
  bài, đã tách riêng và đưa vào `blocking_errors`.** `Ekanavutito kappe,` (91) có tiền lệ đầy
  đủ (31 bản `Vào chín mươi mốt kiếp trước,` cho `ekānavuti` = 91). Nhưng `Ekūnasattatikappe,`
  (5.1) có **0 tiền lệ** — kể cả chuỗi `ekūnasattati` cũng chỉ xuất hiện đúng một lần trong
  toàn tầng là chính khoá này. Tôi dò cùng họ `…kappe` trong tầng thì thấy chuỗi nguồn bị hỏng
  rõ: `tevīsati` = 23, `tepaññāsa` = 53, `tesattati` = 73 (`te` đọc là 3, `sattati` ở vị trí này
  đọc là 70), `catusattati` = 74. Quy tắc đó cho `ekūna`(11) + 70 = **81**, nên dịch
  `Vào tám mươi mốt kiếp trước,`. Nhưng `ekūna`+`sattati`(7) = 18 cũng không bị loại trừ, và tôi
  không có chú giải để phân xử; vì số lượng sai là lỗi nghĩa trọng yếu nên đã ghi thêm một
  blocking_errors thay vì im lặng chốt. Cách viết theo hình thức `…kappasate` đã có trong tầng
  (`Aṭṭhārase kappasate` → `Vào một ngàn tám trăm kiếp trước,` 6 cặp,
  `Catuttiṁse kappasate` → `Vào ba mươi tư trăm kiếp trước,` 2 cặp) chỉ dùng để so hình thức
  câu, không dùng làm căn cứ cho con số.

  **Vật dâng là vải, không phải hoa — đã dò lại cẩn thận.** `māḷa` (2.3, 3.3, 4.2, 4.4) là
  vải/giặt; trong tầng này chỉ có `maṇḍalamāḷa` (lều vải) nên không có cặp nào tra được trực
  tiếp. Bài anh em ngay trước là `tha-ap169` Yūthikapupphiya, dâng **hoa** (`pupphaṁ`), và bản
  dịch của nó dùng `đây là quả báo của việc cúng dường Đức Phật.`; bài này dâng **vải** nên
  4.4 dịch `đây là quả báo của việc cúng dường vải.` theo đúng họ công thức `…dānassidaṁ
  phalaṁ.` (77 cặp cùng hình thức trong tầng, mỗi cái một vật). Riêng 4.4 của tha-ap170 có
  `dussadānassidaṁ phalaṁ.` với `y`; ở đây `māḷa` cùng nghĩa `dussa` nên cũng có thể dùng
  `y`, chọn `vải` để phân biệt với bài kia khi đọc cạnh nhau.

  **Không có tiền lệ cùng Pāli, tự dịch từ chữ nghĩa:** `Tesāhaṁ pavaro āsiṁ` (1.3),
  `mama baddhacarā ca te` (1.4), `Sabbe te sannipātetvā` (2.1), `puññakamme samādayiṁ` (2.2),
  `Māḷaṁ kassāma saṅghassa` (2.3), `Sādhūti te paṭissutvā` (3.1), `mama chandavasānugā`
  (3.2), `Niṭṭhāpetvā ca taṁ māḷaṁ` (3.3), `vipassissa adamhase` (3.4), `yaṁ māḷamadadiṁ
  tadā` (4.2), `māḷadānassidaṁ phalaṁ` (4.4), `Ekūnasattatikappe` (5.1), `eko āsi janādhipo`
  (5.2). Hình thức câu thì dựa trên tiền lệ có sẵn: `Ye maṁ baddhacarā āsuṁ` →
  `Những ai từng đi theo ta,` (tha-ap192:3.1); `Tesāhaṁ …` → `Ta` là ngôi thứ nhất quen dùng
  trong tầng; `janādhipa` → `bậc chúa tể loài người` (ja420:7.2).

  **Bất định, ghi ở đây chứ không giải thích trong thân kinh:**
  - `Sādhūti te paṭissutvā, mama chandavasānugā;` (3.1–3.2) — `te` là đại từ thứ hai
    (`của Ngài`), nghĩa là Đức Phật đang nói với vị trưởng lão; nhưng `mama` lại là `của ta`.
    Đọc `chandas` + `mama` là `ham muốn ý chí của ta` và dịch `ham theo lòng mong của Ngài,` để hai
    vế đều hướng về Đức Phật, cân với chủ ngữ là vị trưởng lão ở 3.3–3.4. Đọc ngược lại
    (`của ta` = giọng Đức Phật, `chanda` là ước nguyện của chính Ngài) cũng có thể, nên đây là
    bất định về ngôi; không ảnh hưởng nghĩa giáo nghĩa.
  - `vipassissa adamhase.` (3.4) — `vipassissa` là danh từ bổ nghĩa cho `ta` ở 3.3
    (`bậc hiền tri`), `adamhase` là `không một chút nào lơi biếng/gián đoạn`; dịch
    `bậc hiền tri không hề lơi biếng.` Không thêm chủ thể vì Pāli cũng không có.
  - `puññakamme samādayiṁ` (2.2) — `samādayiṁ` là thân nhân của 2.1 (`Sabbe te sannipātetvā`)
    nên 2.1–2.2 dịch `Ta đã tập họp tất cả, / cho làm việc phước đức;`. `puññakamma` ở tầng này
    thường là `việc phước đức`/`công việc phước đức`.
  - `Ādeyyo nāma nāmena` (5.3) — tên riêng giữ nguyên dạng Pāli, không dịch nghĩa, như 428
    câu `Tôn giả Trưởng lão` đã có trong tầng.

  **Mệt hồi `ti` — đo ở phạm vi gần nhất rồi mới nới.** Trong cùng phẩm `tha-ap` có **0** khoá
  Pāli mang mệt hồi `ti` (đếm bằng script trên 5.407 tệp Việt), nên không đo được tỉ lệ tại
  chỗ; đo ở toàn tầng cho **22.682** khoá Pāli có `ti`: bản Việt **giữ** dấu ở **4** khoá,
  **bỏ** ở **22.678** khoá. Phe bỏ thắng tuyệt đối; kệ của bài này vốn không có `ti` nên không
  dính vào lựa chọn nào.

  **`translationTitle` bằng đúng giá trị `:0.3`**, kể cả việc không đặt số thứ tự: đo trên 4567
  tệp có `:0.3`, KEEP 177 / DROP 4390; riêng dạng `Bài Kệ …` thì **235/235 bỏ số thứ tự**, và
  mẫu câu đa số là `Bài Kệ Tuyên Ngợ Về Trưởng Lão` (168) so với `Tuyên Ngôn` (51). Số thứ tự
  đặt ở khoá đóng `:8.1` như 390 cặp tiền lệ (`:8.1` có số thứ tự 390 / không có 13).

  **Năm phép kiểm tự viết (không dùng `_hvi.py`, vì ở phẩm `tha-ap` nó quét rỗng).** Số dưới
  đây do script in ra, không ước lượng:
  1. `set(khoá Việt) == set(khoá Pāli)`: 28/28, thiếu 0, thừa 0, thứ tự khoá khớp Pāli.
  2. Dấu câu so **từng khoá** với Pāli: lệch 0. Nháy đơn `‘’`: 0 cả hai bên. Ngoặc kép mở 1 /
     đóng 1 và cân trên cả bài; Pāli cố ý mở ở `:1.1` và đóng ở `:6.3` nên mỗi khoá đều
     lệch một bên — bản Việt lệch **y hệt**, không phải lỗi.
  3. Pāli trùng nguyên văn **trong chính bài**: 0 cặp, 0 cặp Việt khác (không có hai khoá nào
     trùng nhau trong một bài).
  4. Dấu lược: `…pe…` của Pāli → đúng MỘT `…` ở `:6.2`; lỗi = 0; không có `… cho đến …`, không
     còn `(…)` khoá nào chưa dịch.
  5. NFC 0 lỗi, 0 khoá rỗng, 0 orphan.
  **Coverage tầng Anh, đo bằng script:** khoá Pāli ≥ 40 ký tự = **1** (loại 3 khoá block `:0`,
  còn 24 khoá Pāli ngắn hơn 40 ký tự nên nằm ngoài tập đo); tầng `english-sujato` phủ
  **0/1 = 0%**. Thư mục `content/translation/en/sujato/sutta/kn/` không có thư mục con nào, và
  tệp `tha-ap` duy nhất trong tầng Anh là **tệp tên** (không phải tệp bài) nên không đo được tầng
  này cho bài. Mẫu số = 1 là rất nhỏ: đây là số đo được, không phải số 0 — nhưng kết luận
  `tha-ap` không có bản Anh đã ghim thì đúng và đã là blocker.

