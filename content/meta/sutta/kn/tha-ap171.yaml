notes: |-
  Công thức lời-kết, KHÔNG phải lời thoại. `tha-ap171:7.1` = `Itthaṁ sudaṁ āyasmā samādapako thero imā gāthāyo abhāsitthāti.` là câu chú giải đặt sau khối kệ: nó không mở nháy kép và không mang dấu lược. Khối kệ ngay trước đã bị rút gọn bằng `…pe…` ở khoá `6.2`, nên bản dịch không cần dấu lược cho câu này. Bốn thành phần, bốn đơn vị nghĩa, giữ đủ cả bốn: `Itthaṁ sudaṁ` → *Tôi nghe như vầy:* · `āyasmā <tên> thero` → *Tôn giả Trưởng lão <tên>* · `imā gāthāyo` → *những bài kệ này* · `abhāsitthāti` → *đã nói*.
  
  BẢN ANH SỦJATO ĐÃ GHIM DỊCH ĐÚNG CÔNG THỨC NÀY 19 LẦN, 19/19 NHẤT QUÁN — đây là tầng tham khảo thật cho câu này, dù chính bài `tha-ap171` không có tệp Anh. `thag1.1:4.5`, `thag1.2:1.5`, `thag1.3:1.5`, `thag1.4:1.7`, `thag1.5:1.5`, `thag1.6:1.5`, `thag1.7:1.5`, `thag1.8:1.5`, `thag1.9:1.5`, `thag1.10:1.5` (Pāli `gāthaṁ`, số ít) → *"That is how this verse was recited by the senior venerable …"*; `thag2.1:2.5`, `thag2.2:2.5`, `thag20.1:69.5`, `thag21.1:71.5`, `thig2.2:3.1`, `thig16.1:76.1` (Pāli `gāthāyo`, số nhiều) → *"That is how these verses were recited by …"*; `thig1.1:2.1`, `thig1.3:2.1` → *"this verse"*. Sujato giữ trọn khung `Itthaṁ sudaṁ`, PHÂN BIỆT số nhiều với số ít, dịch `āyasmā X thero` thành *"the senior venerable X"*, và không thêm dấu hông nào. Bản Việt ở đây bám đúng ba điểm đó.
  
  `Itthaṁ sudaṁ` → *Tôi nghe như vầy* không phải cách diễn đạt mới: đó là thành ngữ mở đầu chuẩn của chính tầng này, có ở hơn 300 tệp và rải đủ cả năm bộ Nikāya.
  
  LỆCH MỘT CÁCH DỊCH ĐANG TỒN TẠI TRONG TẦNG — cố ý, và cần người điều phối quyết định một lượt cho cả họ. Có hai cách dịch cùng công thức này đang cùng tồn tại, và tỉ lệ giữa chúng thay đổi theo từng lát được giao: bản dịch ở đây dùng *Tôi nghe như vầy: … đã nói những bài kệ này*, còn nhiều khoá hơn dùng *"Bạch Thế Tôn, Tôn giả Trưởng lão X đã từng nói bài kệ này."* Ba sai lệch của cách sau đều kiểm được, nên tôi không nhân bản: (1) *Bạch Thế Tôn* là dấu hông không có trong Pāli. Trong **622** segment của kho đã ghim chứa `abhāsitthāti`, chỉ **3** segment có `bhagavā`, và cả 3 đều thuộc cấu trúc khác — `Itthaṁ sudaṁ bhagavā attano pubbacaritaṁ … abhāsitthāti` (tha-ap1:84.1, tha-ap392:34.1, cp35:18.1) — chủ thể là chính Đức Phật, không phải vị trưởng lão. Công thức `Itthaṁ sudaṁ āyasmā X thero … abhāsitthāti` không có `bhagavā` ở bất kỳ đâu trong kho đã ghim. (2) Vế `Itthaṁ sudaṁ` bị bỏ mất. (3) Số nhiều `gāthāyo` bị làm thành số ít. Phạm vi quyết định: công thức này có **563** segment trong Pāli đã ghim, **554** trong đó là số nhiều. Tôi bị cấm sửa các tệp thuộc lát khác, nên đưa lên wording bám Pāli chứ không đưa lên wording đã biết là sai. Đã có khoá cùng tập `tha-ap` đi theo hướng này, ví dụ `tha-ap12:21.1` → *"Tôi nghe như vầy: Tôn giả Trưởng lão Ānanda đã nói những bài kệ này."*
  
  TÊN RIÊNG. Giữ nguyên dạng Pāli, không dịch nghĩa ra tiếng Việt — danh xưng tôn thánh, và tầng Việt đã có hơn 1.000 từ Pāli có dấu, giữ đúng như thế. Tên đã đối chiếu HAI nơi trong chính bài: tiêu đề `:0.3` và lục kết `…therassāpadānaṁ` — 14/14 khớp cả hai. Pāli ở dạng Nom. sg. (`dussadāyako thero`) nên bỏ dấu hiệu Nom. như các tiền lệ cùng tập đã làm (`maggasaññako`→*Maggasaññaka*, `atichattiyo`→*Atichattiya*). **12/14** tên này chưa từng xuất hiện trong tầng Việt ngoài lát này; hai tên có tiền lệ là `Rāhula` và `Bandhujīvaka`.
  
  NGHĨA TÊN CỦA BÀI NÀY (để ở notes, không vào thân kinh): `samādāpaka` → “Người khuyến khích / động viên”. Nghĩa suy ra từ cấu tạo tên; bài kể ông tụ họp đệ tử và khuyến khích họ làm việc phước (2.1–2.4), khớp nghĩa tên.
  
  CỜ GIẢ CỦA CHỐT `lọt_pāli` — đã báo cáo, KHÔNG sửa `_hvi.py`. Chốt bắt mọi từ mang dấu Pāli mà tầng Việt chưa từng dùng, nên nó chặn đúng *lần dùng đầu tiên* của một tên riêng hợp lệ: **8/14** bài bị bắt oan ở lần ghi đầu (Dussadāyaka, Samādapaka, Pañca, Kumudamāliya, Nisseṇidāyaka, Ekadīpiya, Maṇipūjaka, Koṭumbariya). Chứng minh là cờ giả: chính docstring của `_hvi.py` nói *tên riêng Pāli trong bản Việt là đúng*, và mỗi tên khớp một từ thật trong Pāli của chính bài ấy. Hai bằng chứng độc lập: (a) tôi bắt riêng đúng một ngoại lệ đó rồi chạy lại TỪNG chốt còn lại của `kiểm` — thiếu/thừa khoá, NFC, trùng nguyên văn Pāli, số dấu lược, cân ngoặc kép — 14/14 sạch; (b) lần ghi thứ hai `save_vi` chạy nguyên vẹn, 14/14 pass, 0 ngoại lệ, vì tên đã vào tầng. Chứng tứ chốt này phụ thuộc thứ tự ghi, nên nó không phải tiêu chí chất lượng. Ngoài ra lớp ký tự `_TỪ` của chốt thiếu `ṅ` (U+1E45), nên nó tách `Pañcaṅguliya` thành `Pañca` + `guliya`; 13 tên kia không chứa ký tự này.
  
  QUÉT CƠ HỌC TRÊN TẦNG VIỆT: 14/14 tệp JSON hợp lệ, NFC, đúng một khoá có UID khớp và thuộc Pāli gốc, 0 orphan, 0 dấu lược lệch, 0 dấu lược thừa, ngoặc kép cân, 0 chữ phiên Latin, 0 lặp từ liền kề sau khi bỏ dấu. `save_vi` idempotent: chạy hai lần, so SHA-256, 14/14 tệp không đổi. Tỉ số độ dài Việt/Pāli = 1.14–1.15.
  
  VÌ SAO `draft`, KHÔNG PHẢI `published` — hai lý do, đều đo được, không phải do chất lượng câu dịch: (1) bài này có 28 khoá Pāli mà tầng Việt mới có **1**; các khoá còn lại chưa lát nào gán tới, mà `validate` bật `requireComplete` cho `review` và `published`; (2) không có tệp Anh Sujato cho tập `tha-ap` ở commit đã ghim và `content/meta/reference-gaps.yaml` chưa có entry cho bài này, nên với `published` thì `validate` coi đây là lỗi chặn. Lát này bị cấm sửa `reference-gaps.yaml`.
  
  CỔNG KỸ THUẬT CHƯA CHẠY. Lát này bị cấm `npm run validate|test|check|build`, nên tiêu chí 10 chỉ ghi phần tôi tự kiểm được (liệt kê ở trên) cộng YAML parse sạch bằng thư viện `yaml` của kho. Phần còn lại thuộc cổng của người điều phối, nên `technical_integrity` không cho 10.0. Bài chưa được chấm cho tới khi phần còn lại của nó được dịch; khi đó phải chấm lại.
