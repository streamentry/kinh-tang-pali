notes: |-
  Tôi làm lượt review đối kháng. Bốn khoá tôi sửa, và một lỗi trong số đó đáng nói.
  LỖI ĐÃ SỬA. (1) :4.6 là lỗi nghiêm trọng nhất lát: ucchiṭṭhapaṭiggahaṇaucchādananahāpanapādaparikammena là chuỗi phân từ bảy mục (thu dọn phân bẩn, đem đi, phủ kín, lau chùi, sửa chữa lối đi), nhưng bản Việt có thêm mục bày thức ăn, mà Pāli không hề có mục nào về thức ăn trong chuỗi này, đồng thời đảo hai mục đầu cho nhau; tôi bỏ mục bịa và trả lại đúng thứ tự. Đây là loại lỗi mà AGENTS.md xếp là chặn — thêm nội dung không có nguồn — nhưng vì nó đã sửa xong nên không còn nằm trong blocking_errors. (2) :2.1 bản Việt thêm hai lần cụp của Đức Thế Tôn cho vacanaṁ, trong khi Pāli chỉ nói lời ấy không ghi ai nói; với ngữ cảnh đây là lời dạy đang tranh luận thì việc ghi tên một người là thêm khẳng định, tôi bỏ. (3) :0.4 và :5.1 Ekantasukhanibbānapañha bị dịch là Câu hỏi về việc biết…, nhưng pañha là câu hỏi, không phải việc biết; tiền lệ rõ ràng là Nirodhanibbānapañha ở mil3.4.8 dịch thành Câu hỏi về sự diệt tận là Niết-bàn, nên tôi sửa thành Câu hỏi về Niết-bàn hạnh phúc trọn vẹn và sửa luôn translationTitle cho khớp.
  CÒN GIỮ NGUYÊN. :3.8 amaccehi pariṇāyakehi bhaṭehi balatthehi tôi dịch là thường dân, bộ tôi tớ, người phụ thuộc và binh lính, lệch thứ tự Pāli một chút; cả bốn danh từ vẫn đủ và đúng nghĩa, tôi ghi thẳng ở đây thay vì sửa lẻ để tránh tăng churn trên một câu không sai nghĩa. :2.4 bản dịch dài như lát nhưng giữ đủ cả bảy nhóm tính từ, và ramenti brūhenti thành được tăng trưởng là đúng.
  TIỀN LỆ ĐÃ TRA. Công thức kết sādhu, bhante nāgasena, evametaṃ tathā sampaṭicchāmī có 29 tệp khác trong kho; chính câu này có 9 tệp dùng nguyên văn Lành thay, thưa ngài Nāgasena, đúng là như vậy, trẫm xin kính nhận nên tôi giữ. Niết-bàn hạnh phúc trọn vẹn là cách dịch ekantasukha mà bài dùng xuyên suốt, tôi giữ. Vessantaravagga = Phẩm Vessantara trùng với mil6.3.7:0.3. Anumānapañha = câu hỏi về suy luận trùng với mil1:8.3.
  NHÓM KỆ 7.x, 8.x, 9.x TRÙNG NGUYÊN VĂN Ở CẢ SÁU BÀI THA-AP TRONG LÁT. Tôi dựng chỉ mục Pāli → Việt trên toàn bộ tầng kn đã có (1.675 tệp, loại tám uid của lát) rồi đối chiếu: trong lát không còn một Pāli chung nào mà sáu bài dịch khác nhau, và mọi Pāli chung với bài ngoài lát đều trùng khớp hoặc chỉ lệch dấu câu. Bốn câu kệ dùng chung giữ nguyên cách đã có trong kho: Kilesā jhāpitā mayhaṁ = Các phiền não của ta đã được thiêu rụi; viharāmi anāsavo = ta sống không còn lậu hoặc; Svāgataṁ vata me āsi = Thật lành thay sự đến của ta; Paṭisambhidā catasso = Bốn vô ngại giải; kataṁ buddhassa sāsanaṁ = đã làm tròn lời dạy của Đức Phật. Bài này không có kệ chung với sáu bài tha-ap nên nhóm 7.x-9.x không liên quan; 0.1 Milindapañha giữ nguyên Pāli.
  CHÚ Ý VỀ Svāgataṁ vata me āsi — TÔI CỐ Ý KHÔNG SỬA. Đếm được 54 tệp trong kho dịch câu này thành Thật lành thay sự đến của ta (đa số áp đảo; nhóm kế cạnh là Thật là đón mừng thù thắng thay cho tôi 21 tệp). Nghe thì có vẻ là đọc nhầm: svāgataṃ ở đây là tiếng than thở tự vệ, không phải danh từ sự đến. Nhưng sửa sáu khoá trong lát này sẽ tạo ra thứ tự N+1, và BRIEF_VI3 §6 nói rõ phải dịch nhất quán theo bản Việt đã có. Tôi giữ nguyên và giao việc này lại cho người điều phối quyết định thay cả kho; nếu đổi thì phải đổi cả ~54 tệp, không được sửa lẻ.
  BẤT ĐỊNH CÒN MỞ. Ở :2.1 tôi bỏ tên người nói nên câu trả lời ở :3.2 của Nāgasena là câu duy nhất còn ý nghĩa; nếu biên tập muốn giữ một chủ thể thì phải chọn và ghi vào notes, không nên thêm lặng trong thân kinh. Ở :3.11 và :4.9 hai câu dài có cùng khung (kāyañca cittañca ātāpetvā … nihatapaccāmittā viya rājāno / ācariyā viya), tôi dịch nhất quán và giữ nguyên sự lặp.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Những gì tôi tự kiểm được và đều sạch: JSON hợp lệ, đúng 38 khoá mỗi bài, tập khoá khớp tuyệt đối với content/catalog/sutta/kn.json và với all trong vc/c44.json, không orphan, không rỗng, không còn stub dạng (…), toàn bộ NFC, số dấu lược không bao giờ vượt số dấu lược của Pāli và mỗi …pe… của Pāli còn đúng một dấu …, YAML parse sạch bằng thư viện yaml của kho.
