notes: |-
  ĐỌC HẾT p44.txt trước khi viết. Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Milindapañha. Toàn bộ 38 khoá dịch từ Pāli root.
  TÊN PHẨM THEO CÁCH CÓ SẴN TRONG CHÍNH PHẨM. 0.2 Anumānapañha = Câu hỏi về suy luận (8/14 tệp mil; bài anh em cùng phẩm mil6.3.7 dùng đúng chữ này). 0.3 Vessantaravagga = Phẩm Vessantara (1 tệp, cũng là mil6.3.7, không có cách nào khác để so). 0.1 Milindapañha giữ nguyên Pāli theo đa số 177/188 khoá mil. 0.4 và 5.1 tôi theo khuôn mil3.4.10 (Câu hỏi về việc biết Niết-bàn là hạnh phúc, thứ mười).
  CHỌN NGHĨA CHO ekantasukhaṁ. 0 tiền lệ cho chính cụm này: toàn bộ tầng Việt chỉ có một khoá có ekantasukha, mil7.4.9:1.2 (ekantasukhasamappito, hình thức khác) dịch thành trọn vẹn hưởng niềm hỷ lạc thuần nhất. Tôi bám vào tiền lệ gần nhất về chữ sukha trong cùng phẩm: mil3.4.10 dịch sukhaṁ nibbānaṁ thành Niết-bàn là hạnh phúc (3 khoá / 1 tệp), nên tôi dịch cả bài là Niết-bàn hạnh phúc trọn vẹn. Nhờ vậy cặp đối lập của vua (sukha so với dukkhena missaṁ) đọc được ngay trong tiếng Việt.
  dukkhena missan: 0 tiền lệ, tôi dịch cái gặp phải khổ (sát missaṁ = gặp phải). rajjasukha: 0 tiền lệ cho cụm này, tôi dịch hạnh phúc của các vua. sippasukha và sippavā: 0 tiền lệ, tôi dịch thương nghị an ổn và người biết thương nghị; đây là từ ngữ kinh điển của Abhaya-rajakumara, người đọc Việt hiểu ngay. Cụm 2.3 và 3.11 và 4.9 dùng cùng một danh sách hành xử, tôi dịch giống nhau ở cả ba chỗ.
  NHÓM ĐỒNG ÂM. 3.10 và 4.8 trùng nguyên văn và nhận cùng một bản Việt; 4.9 chỉ khác ở vế cuối (ācariyā viya sippasukhaṁ) nên tôi cũng dùng y hệt phần đầu. Nhóm 3.11 và 4.9 cũng trùng nguyên văn ở 2/3 câu, tôi dịch nhất quán. Trong lát này có 20 nhóm Pāli trùng nguyên văn, 95 khoá, và TẤT CẢ đều nhận cùng một bản Việt — tôi tự kiểm bằng script chứ không đoán.
  CÔNG THỨC HỘI THOẠI ĐO ĐƯỢC. Na hi, bhante = Không phải vậy, thưa tôn giả (14/24) · Sādhu, bhante nāgasena: 30 khoá không có đa số tuyệt đối, nhưng 16/30 dùng ngài Nāgasena, tôi theo biến thể đứng đầu (Lành thay, thưa ngài Nāgasena, đúng là như vậy, trẫm xin kính nhận). Vua dùng trừm là cách 16 tệp mil cũ đã dùng cho lời vua, nên tôi giữ để không phá vỡ văn phong của phẩm.
  BẤT ĐỊNH ĐÃ GHI NHẬN. (1) Dấu nháy kép của Pāli mở ở 3.10 và 4.8 nhưng đóng ở 4.2 và 4.10, tức chéo nhiều khoá; tôi đặt nháy đúng ở những khoá đó nên bốn cặp vẫn cân trên cả bài. (2) 2.2 Katamaṁ ettha kāraṇaṁ tôi dịch Lý do ở đây là gì, trong khi tiền lệ mil3.2.1 dùng lời giải thích cho cùng một nghĩa; tôi giữ kāraṇa là lý do vì cả bài đã dùng thống nhất. (3) Bản Pāli của bài này không có dấu lược nào, nên cả hai phía đều 0.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
