notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất 31 ký tự nên `cần` rỗng. Tự quét
  9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu lược khớp, nháy kép cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 2.1 (dòng chốt, Sujato để trống
  ở mọi bài Jātaka).

  KHUON TIÊU ĐỀ: Jātaka, Bộ Một Bài Kinh, Kinh <tên> thứ chín. `Itthivagga` → *Phẩm Phụ Nữ*
  dùng lại nguyên văn (7 lượt ngoài lát, ja61–ja65).

  `Visanta` tôi GIỮ NGUYÊN chữ Pāli thay vì dịch, theo tiền lệ rõ ràng của tầng: ja82 (Kinh
  Mittavindaka), ja97 (Kinh Nāmasiddhijātaka), ja106, ja107 đều giữ tên riêng khi tên đó là
  tên người. `Illisa` ở ja78 cũng theo cùng cách.

  BA CHỖ DỄ SAI, GHI LAI. (1) `Dhiratthu` là tiểu từ thán ngợi (nói khi vừa nôn xong thứ độc),
  tôi dịc *Ừ* — đây là chỗ hiệu quả truyền thông yếu nhất của bài. (2) `visaṁ vantaṁ` và `Vantaṁ`
  ở 1.3: tôi đọc `vanta` là dạng quá khứ của `vam` (nôn ra), nên 1.1 là *thứ độc đã nôn ra ấy*
  còn 1.3 là *giờ ta sẽ lại nuốt độc* — tức đối xứng nôn / ăn lại. Có thể đọc khác: `vanta` là
  “đi hết / mất”, khi đó 1.1 thành *thứ độc ấy đã đi* và Sujato (Vomited Poison) không còn
  đúng; tôi theo đọc của Sujato vì `vanta` làm chủ ngữ với `visaṁ` trong cả hai vế.
  (3) `jīvitakāraṇa` tôi dịc *lý do ta sống*; có thể là *phần tử sống* hay *nuôi dưỡng sự sống*,
  tôi theo nghĩa nguyên văn của chữ.

  `paccāvamissāmi` → *sẽ lại nuốt* (tương lai, `issāmi` là thì tương lai của `vam`); `mataṁ me
  jīvitā varan` → *cái chết còn hơn sự sống của ta* vì `varaṁ` là so sánh hơn, không phải mệnh
  lệnh.
