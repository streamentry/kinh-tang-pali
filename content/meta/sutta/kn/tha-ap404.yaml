notes: |-
  Bản dịch chỉ từ Pāli root, đối chiếu với tiền lệ trong chính tầng `tha-ap` vì commit đã ghim
  không có bản Anh Sujato, không có bản Việt hiện hành và không có lớp English của dự án cho bài này.
  Status bắt buộc `draft` do blocker `noEnglishEditionUpstream`; điểm cao không cứu được blocker.

  TÊN PHẨM `:0.3` — `translationTitle` bằng đúng `:0.3`. Pāli `Puṇṇakattheraapadāna` không bắt đầu
  bằng số nên BỎ số thứ tự (không thuộc nhóm THỪA). Mẫu câu đo được trên 446 bài `tha-ap` đã có `:0.3`:
  *Bài Kệ Tuyên Ngợ Về Trưởng Lão* 245, *Bài Kệ Tuyên Ngôn Về Trưởng Lão* 97, *Ký Sự Về Trưởng Lão* 97,
  khác 7. Hai phạm vi cho hai đa số khác nhau: cửa sổ tha-ap370–440 là Ngợ 22 / Ký Sự 12 / Ngôn 3 / khác 1;
  cửa sổ gần nhất tha-ap395–420 là Ký Sự 5/5. `Tuyên Ngợ` là chính tả đáng ngờ (Pāli không có chữ nào
  tương ứng), nên bài này dùng *Ký Sự Về Trưởng Lão*, khớp tha-ap400 và `:18.1` *Ký sự về Trưởng lão …, thứ hai*
  (cùng nhóm *thứ hai* ở tầng: Tuyên Ngợ 16 / Tuyên Ngôn 8 / Ký sự 7). Đề nghị người biên tập phán một
  lượt cho cả cuốn.

  `:0.1` `Therāpadāna` giữ nguyên Pāli theo đa số tầng. `:0.2` `Metteyyavagga` → *Phẩm Metteyya*, theo cách
  tha-ap400 (*Phẩm Pilindavaccha*) và tha-ap416 (*Phẩm Bhaddāli*) lấy tên riêng làm tên phẩm; 10 bài anh em
  cùng phẩm (tha-ap403–412) chưa có bản Việt nào để đối chiếu nội bộ.

  THUẬT NGỮ VÀ TIỀN LỆ (đếm trên 34.350 dòng Pāli khác nhau đã có Việt):
  - Đại từ: *ta* xuyên suốt, theo đa số cửa sổ tha-ap370–440 (công thức `Kilesā jhāpitā mayhaṁ` 21 ta / 7 tôi;
    `viharāmi anāsavo` 22 ta / 6 tôi) và toàn tầng (81 ta / 23 tôi).
  - Ba công thức kệ chung `:14`, `:15`, `:16` dùng nguyên văn đa số toàn tầng: 126, 121, 454 khoá;
    `…pe…` → đúng một `…` (683/704 khoá dạng này ở tầng).
  - `sayambhū` → *bậc Tự Tại* (nhóm Tự Tại khoảng 20 khoá so với Tự Chứng 6, Tự Hữu 4, Tự Giác 2);
    `aparājito` → *không ai khuất phục được* (6 so với *không ai chiến bại* 4). `mahesi` → *Đại Ẩn Sĩ*
    (đa số; *Đại Mâu-ni* chỉ 1 khoá cho đúng `sayambhussa mahesino`). `yakkha` → *dạ-xoa*.
  - `Ekanavutito kappe` → *Vào chín mươi mốt kiếp trước* (112 khoá toàn tầng: 38 Từ / 35 Vào / 15 Vào … đây;
    cửa sổ gần nhất Vào 5, Vào … đây 3, Từ 2). `Ekanavutito` = eka 1 + navuti 90 = 91.
  - `Duggatiṁ nābhijānāmi` → *ta không hề biết đến đọa xứ*. Hai dạng đa số của tầng là *Ta không biết mình rơi
    vào khổ đau* (136 toàn tầng / 12 cửa sổ gần) và *Ta không còn biết đến đọa xứ* (11 cửa sổ gần): dạng
    *rơi vào khổ đau* nói thêm điều Pāli không nói (`nābhijānāmi` chỉ là "không biết đến"), nên chọn dạng
    *đọa xứ* đã có ở tha-ap29 và tha-ap31 và ghi ở đây để người biên tập phán.
  - Pāli trùng nguyên văn trong chính bài: 3 nhóm (`:4.4`/`:5.4`, `:12.4`/`:14.3`, ba khoá `…pe…`),
    bản Việt của cả ba nhóm giống nhau, 0 cặp lệch.
  - Nháy: Pāli mở “ ở `:1.1`, đóng ” ở `:16.3`, cố ý chạy qua khoá; lồng ‘ ở `:8.1` và đóng ’ ở `:8.4`.
    Đối chiếu từng khoá: 0 lệch trên 66 khoá. Pāli `puṇṇakoti` (`:10.2`) không có nháy, bản Việt bỏ `ti` và
    viết *tên của ta khi ấy cũng là Puṇṇaka*, theo phe bỏ dấu `ti` ở tầng.
  - Lời kết `:17.1` dùng nhóm số nhiều *đã nói những bài kệ này* (Pāli `imā gāthāyo`; 407 khoá, so với
    21 khoá *bài kệ này* số ít).
  - Số Pāli: chỉ có `Ekanavutito` = 91 (phép tính ở trên); `catasso` (`:16.1`) = bốn; `sataraṁsi` (`:5.2`)
    = *trăm tia sáng* (sata 100 + raṁsi tia sáng, nghĩa là mặt trời). Không có `Tiṁsakappasahassa`.

  BẤT ĐỊNH — để người biên tập phán, không thêm vào thân kinh:
  1. `pabbhārakūṭaṁ` (`:1.1`) / `pabbhāraṁ` (`:4.2`): dịch *mỏm đá nhô ra* (`pabbhāra` = vách đá nhô, hang nông; `kūṭa`
     = đỉnh, mỏm). Có thể là tên một địa điểm; toàn tầng không có tiền lệ cho `Pabbhārakūṭa` (0 khoá).
  2. `nāmamaggahi` (`:7.4`) = `nāmaṁ aggahi`: dịch *đã đặt tên*, hiểu là dạ-xoa tuyên bố tên mới sắp nêu ở `:8.3`.
     Cũng có thể hiểu *đã gọi tên*. Câu Việt không nêu đối tượng vì Pāli không nêu.
  3. `tanukiccassidaṁ phalaṁ` (`:13.4`): `tanukicca` là hapax của tầng (0 tiền lệ), dịch *một việc nhỏ*
     (`tanu` nhỏ, mỏng + `kicca` việc cần làm). Kệ không nói rõ vì sao gọi là việc nhỏ; câu Việt không thêm lý do.
  4. `Yaṁ pūritaṁ tayā kiccaṁ` (`:8.1`) dịch *Việc cần làm mà ông đã hoàn tất*; chơi chữ với tên *Puṇṇaka* (`pūrita`, đầy đủ)
     không thể giữ trong Việt và được để ở ghi chú này, không đưa vào thân kinh.
  5. `sarīraṁ` (`:6.4`, `:7.1`) dịch *thân thể* (không thêm *di thể* hay *xá-lợi*): Pāli không nêu rõ đó là thân của ai,
     mạch kệ cho thấy là thân Đức Phật đã nhập Niết-bàn.
  6. `nibbutaṁ` (`:4.4`, `:5.4`) dịch *đã nhập Niết-bàn*, thống nhất với `nibbāyamānamhi` (`:2.3`) *đang nhập Niết-bàn*;
     nghĩa đen là *đã tịch diệt, đã nguội lạnh*, ở đây rõ ràng chỉ Đức Phật đã nhập diệt.

