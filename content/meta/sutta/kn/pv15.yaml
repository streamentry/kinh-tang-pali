notes: |-
  **Bài.** Mattāpetivatthu (Chuyện Ngạ Quỷ Mattā), bài 3 của Phẩm Ubbarī, Petavatthu: 148 khoá = 3 khoá tiêu đề `:0` + 34 nhóm kệ (`1.x`–`34.x`; 30 nhóm có 4 pāda, riêng các nhóm 16, 18, 25 và 33 có 6 pāda: 30 × 4 + 4 × 6 = 144) + 1 khoá kết `35.1`. Hai người vợ chung chồng: Tissā còn sống hỏi, Mattā là ngạ quỷ nữ đáp. Phân vai theo nháy của chính Pāli: Tissā hỏi (1, 3, 5, 9, 12, 15, 17), Mattā đáp (2, 4, 6–8, 10–11, 13–14, 16, 18–19), Tissā khuyên nhủ (20–22), Mattā xin che thân (23), Tissā hỏi cách giúp (24), Mattā nêu cách (25); tường thuật 26–28 (Tissā cúng dường tám tỳ-kheo và hồi hướng; Mattā hiện thân thiên nữ đến gặp lại người vợ chung chồng); Tissā hỏi vị thiên nữ (29–31); Mattā đáp và chúc phúc (32–34). Pāli ghim mở nháy ở `32.1` nhưng không đóng ở `32.4`, chỉ đóng ở `34.4`; bản Việt giữ đúng như vậy, không tự sửa. Câu trích lồng ở `19.2`–`19.4` dùng nháy đơn đúng như Pāli.
  **Năm phép tự chạy (không dùng chốt cũ, vì bài ngắn nên chốt cũ có thể chạy rỗng).** (1) Tập khoá Việt so với Pāli: 148 = 148, thiếu 0, thừa 0, thứ tự khớp. (2) Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá: mẫu số 592 dấu (148 khoá × 4 loại), lệch 0; nháy đơn Pāli chỉ có 2 dấu (`19.2`, `19.4`) nên phần nháy đơn đo trên mẫu rất nhỏ, vẫn khớp cả hai. (3) Pāli trùng nguyên văn trong chính bài: 9 nhóm (`1.2`/`23.2`; `2.1`/`32.1`; `2.2`/`32.2`; `2.3`/`32.3`; `2.4`/`3.4`/`4.4`; `5.1`/`9.1`/`12.1`/`15.1`/`17.1`; `5.3`/`9.3`/`12.3`/`15.3`/`17.3`; `8.3`/`11.3`/`14.3`/`16.5`/`18.5`; `11.1`/`14.1`); 8 nhóm dịch giống hệt; nhóm `2.4`/`3.4`/`4.4` cố ý khác ở `3.4` (người hỏi là Tissā nên viết *mà ngươi đã từ đây…?* thay vì *tôi đã từ đây…*, và dấu hỏi thay dấu chấm). Số cặp trùng trong chính bài mà Việt khác: 1 nhóm. `32.4` không tính là trùng với `2.4` vì Pāli khác dấu (`gatā.` không có `”ti`). (4) Dấu lược: Pāli có `…` ở 0 khoá, Việt 0 khoá; không có `…pe…`, không có `(…)`. (5) NFC 0 lỗi, khoá rỗng 0, khoảng trắng thừa 0, Pāli lọt sang Việt: chỉ các tên riêng (Mattā, Tissā, Bhūta, Kāsi) và `Petavatthu`, `Ubbarivagga`. Khoá Pāli ngắn nhất và dài nhất: 10 và 35 ký tự, 0 khoá đạt ngưỡng 40. Đã in cặp Pāli↔Việt cả 148 khoá ra đọc đối kháng.
  **Số Pāli.** Chỉ có `cattāro` bốn (`25.1`) và `cattāro` bốn (`25.2`), `aṭṭha` tám (`25.3`, `26.2`): 4 + 4 = 8 khớp với *tám tỳ-kheo*; và `tatiyaṁ` = thứ ba, khớp tiêu đề `3.` ở `0.3`. Không có `sahassa`, `sata`, `navuti`… nên không có cụm số nào cần phân xử.
  **Chỉ mục Pāli → Việt toàn tầng.** Dựng từ Pāli root toàn bộ cache (284.708 khoá) với 194.943 khoá Việt đã có. Số khoá pv15 có Pāli trùng nguyên văn với bài khác: 60 khoá (581 cặp); dùng lại nguyên văn bản dịch đã có ở 53 khoá, trong đó phần lớn là công thức của pv13, pv14, pv16 (`1.1`–`1.4`, `3.1`–`3.3`, `27.1`–`27.4`, `28.1`–`28.2`, `29.1`–`31.4` (riêng `31.1` theo pv16 chứ không theo đa số, xem bất định 6), `25.4`–`25.6`, `21.1`, `21.3`, `18.3`, `34.1`). Bảy khoá Pāli trùng mà Việt cố ý khác, kèm lý do: `4.3` (pv16 *với chàng*; ở đây người nghe là người vợ chung chồng nên *với ngươi*); `6.2` (khoá trùng duy nhất trong tầng dịch `sucivatthā` thành *vững chắc, trang nghiêm*, không hợp `suci` là sạch; ở đây *y phục sạch sẽ*); `16.2` (pv35:5.4 dịch `paccagghañca vilepanaṁ` thành *cả thuốc xoa lên chân nữa*, không có căn cứ trong Pāli: `paccagghaṁ` là *quý giá* và `vilepana` là dầu xoa theo ja453:8.2, vv37:12.2, ja390:4.2; ở đây *dầu xoa quý giá*; khoá pv35 không thuộc lát này nên không sửa, báo người biên tập); `18.4` (cùng chữ với pv19:12.4, chỉ khác dấu câu `;` thay `.`); `26.3` (pv10:6.3 *khoác y phục* có đối tượng là ngạ quỷ; ở đây `acchādayitvāna` có đối tượng là các tỳ-kheo nên *khoác y phục cho các vị*); `26.4` (pv16:10.4 *ông ấy … cho nàng ấy*; ở đây cả hai đều là nữ nên *cho người kia*); `33.1` (pv16:17.1 *chàng*; ở đây *chị*).
  **Thuật ngữ, kèm số đếm.** `issā`/`issukī` → *ganh tị* (51/62 khoá, so với *đố kỵ* 6 và *ganh ghét* 3); `maccharī` → *keo kiệt* (46/63, so với *bủn xỉn* 16, *bỏn xẻn* 8, *xan tham* 7); `saṭha` → *xảo trá* (18/36, so với *xảo quyệt* 3); `kodha` → *cơn giận* (10/66, so với *giận dữ* 31, *sân hận* 14, *phẫn nộ* 16; chọn *cơn giận* vì ở `7.4` nó là danh từ làm chủ ngữ của *khởi lên*); `usūyasi` → *ganh tị* (dn19:46.16, snp2.2:7.2, thag16.3:13.3 cùng dạng); `paṁsu` → *bụi đất* (6 khoá cùng cụm, so với *bụi* 37 và *đất* 23 ở mọi dạng); `dussa` → *tấm vải* (20/87; theo pv16:5.2 cho cùng từ); `gūtha` → *phân* (54/59); `dīpa` ở cụm `dīpaṁ nākāsimattano` → *hòn đảo* (pv19:12.4, pv31:4.4, dhp25:3, 3/3); `duggatā` → *khốn khổ* (pv13:13.4, pv39:1.3; còn `duggati` là *cảnh khổ*); `deyyadhamma` → *vật đáng bố thí* (4/4, theo pv45:4.3); `āpaṇa` → *cửa hàng* (6, so với *chợ* 3 trong các khoá có từ này; số thô vì mẫu có nhiều từ khác chứa `āpaṇ`); `akutobhayā` → *không sợ hãi từ đâu* (pv13:21.2, pv14:18.2, pv24:18.4, iti112:8.4, ja492:3.4: 5, so với *bất cứ đâu* 1 ở pv16:17.2); `sobhane` → *hỡi người xinh đẹp* (3/4: pv10:3.4, ja415:9.2, ja374:3.6); `vilepana` → *dầu xoa*; `kopīna` → *điều đáng xấu hổ* (an6.58:4.3 *xấu hổ*, dn31:8.2 *đáng hổ thẹn*); `sassata` ở `21.4` → *không trường tồn* (ja351:2.3 *asassatā bhogino* → *không trường tồn*; 1/1 chỗ nói về của cải); `sapattī` → *vợ chung chồng* (0 tiền lệ đúng từ này); `kapikacchu` → *cây ngứa khỉ* (0 tiền lệ; dịch theo thành tố `kapi` khỉ + `kacchu` ngứa, tha-ap338:13.3 *chứng ngứa*); `Ubbarivagga` giữ nguyên Pāli theo pv13, pv14, pv16, pv17 (cùng phẩm). Tên bài `Mattāpetivatthu` → *Chuyện Ngạ Quỷ Mattā*, theo khuôn pv16, pv17 (tên nữ không thêm *Nữ*); `translationTitle` không có số đầu theo đa số các bài `pv` đã có; thân kinh `0.3` vẫn giữ `3.` vì Pāli có. `35.1` theo khuôn `<tiêu đề>, thứ N.` của pv16:19.1.
  **Cách xưng hô, đo từ chính bài.** Hai người vợ chung chồng xưng *tôi* và gọi nhau *ngươi* trong suốt phần đối thoại về ngạ quỷ (công thức `1.1`–`1.4` của pv13, pv14 dùng *ngươi*); lúc Tissā nhận ra vị thiên nữ (`29`–`31`) đổi sang *nàng* theo công thức đã có ở pv14, pv16. Riêng `33`–`34` Mattā nói lời chúc phúc và Pāli tự đổi sang hô cách `bhagini` (`33.3`) và `sobhane` (`34.2`), nên `tvaṁ` ở đó dịch *chị* (`33.1`, `33.3`, `34.4`); `32.1`–`32.3` giữ nguyên dạng của `2.1`–`2.3` vì Pāli nhắc lại nguyên văn.
  **Coverage English, mẫu số bằng 0.** Công thức `source/layers.yaml`: Pāli có nội dung từ 40 ký tự trở lên, bỏ khối `:0`; pv15 có 0 khoá như vậy, nên Sujato phủ 0/0 và cổng không đo được gì (không phải *không cần ghi nhận*). Tầng `english-sujato` vắng toàn bộ `pv` ở commit đã ghim (manifest: 0 tệp `kn/pv`; `kn` chỉ có 9 sub-collection, 755 tệp), `english-project` vắng (không có tệp dịch lẫn tệp metadata cho pv15), `vietnamese-current` bilara vắng (26 tệp, chỉ Pháp Cú). Có đọc thêm bản Việt nguyên bài (không phân đoạn) của Bhikkhu Indacanda ở mục tra cứu toàn văn để kiểm cách hiểu `sasāminī`, `bhūta`, `paccaggha`; nó không phải tầng store, không cấp text cho cột nào, nên không tuyên bố đã đối chiếu English hay Việt hiện hành theo từng khoá.
  **BẤT ĐỊNH ghi lại, không thêm vào thân kinh.** (1) `13.3`–`13.4` `Tvañca āmantitā āsi, sasāminī no ca kho ahaṁ`: dịch *ngươi được mời, cùng với chồng, còn tôi thì không*, hiểu `sasāminī` bổ nghĩa cho người được mời; cách đọc khác (Mattā nhấn mạnh mình cũng có chồng) vẫn có thể đứng về ngữ pháp nhưng không đổi chuyện kể. (2) `22.1`, `23.4` `bhūtassa pitā`/`bhūtapitā`: Pāli root viết thường; bản Việt nguyên bài đọc `Bhūta` là tên riêng (cha của Bhūta, tức chồng chung). Ở đây dịch *cha của Bhūta*; nếu `bhūta` chỉ là *đứa bé* thì ý chính (người chồng sắp về) không đổi. (3) `20.1` `Vāmato maṁ tvaṁ paccesi`: dịch *đến với tôi theo lối trái nghịch*, hiểu `vāmato` là *theo phía trái, trái nghịch* và `paccesi` là *tiến đến* ở thì hiện tại; 0 tiền lệ đúng cụm; nghĩa tổng thể (đối nghịch và ganh tị) khá chắc, sắc thái thì tùy cách đọc. (4) `16.3` `atāresiṁ`: dịch *ném xuống hố phân* theo `gūthakūpe`; 0 tiền lệ đúng dạng này (các khoá khác của gốc `tāreti` đều nói về chuyển qua bờ). (5) `10.4` `kapikacchuno` và `11.2` `seyyaṁ tyāhaṁ samokiriṁ`: Pāli lược tân ngữ của `samokiriṁ`; bản Việt cũng để trống (*rải lên giường của ngươi*) thay vì thêm *cây ngứa khỉ* vào, người đọc tự nối từ `10.4`. (6) `31.1` `Pucchāmi taṁ devi mahānubhāve`: tôi đọc `mahānubhāve` là hô cách (*thiên nữ có đại oai lực*) vì `devi` đứng ngay trước nó cũng là hô cách giống cái; cả 17 khoá đã dịch trùng Pāli này ở tầng (chủ yếu ở nhóm `vv`, và pv14:13.1) đều đọc là địa cách (*về đại oai lực ấy*), chỉ pv16:15.1 đọc hô cách. Tôi lệch tiền lệ vì Pāli là chuẩn cuối cùng và cách đọc hô cách khớp hình thái; đã đo trước khi lệch, nhưng các khoá ấy không thuộc lát này nên không sửa; nhờ người biên tập xử. (7) `33.5`–`33.6` `Asokaṁ virajaṁ ṭhānaṁ, āvāsaṁ vasavattinaṁ`: là cụm danh từ rời trong Pāli; bản Việt giữ như một cụm treo (*nơi không sầu, không bụi, là trú xứ của những vị có quyền tự tại*) mà không nối vào động từ nào; có thể là tân ngữ của `upehi` ở `34.4`, nhưng Pāli không buộc phải nối. Truyền thống chú giải có thể đồng nhất với một cõi trời cụ thể, Pāli root không nêu nên không thêm. (8) `25.1`–`25.2` `saṅghato` và `puggale`: dịch *từ trong Tăng* (theo mn142:7.13 *từ trong Tăng*) và *bốn vị là cá nhân*, không thêm lời giải thích về cách thỉnh. (9) `6.3` `adhimattaṁ`: dịch *vượt hẳn*, hiểu là trạng từ chỉ mức độ bổ nghĩa cho `samalaṅkatatarā`; `kho` ở `6.3` không dịch riêng. (10) `26.4` `tassā`: dịch *người kia* để tránh nhầm với *nàng ấy* ở `26.1` (Tissā); đối tượng của lời hồi hướng là Mattā, đã rõ từ `25`. (11) `4.3` `Tāhaṁ duruttaṁ vatvāna`: hiểu `tā` là `taṁ` cộng `ahaṁ` (nói với ngươi), như pv16:4.3; cách đọc khác không đổi nghĩa lớn.
  **Lỗi bản nháp đã bắt.** Khi lập dàn ý, tôi đọc nhầm chủ thể của kệ 28 là Tissā; đọc lại thì `sapattiṁ upasaṅkami` có chủ thể là Mattā (đã hiện thân thiên nữ, đến gặp người vợ chung chồng) và bản Việt đã viết đúng như vậy ngay từ lúc ghi. Đã bắt thêm `pv35:5.4` dịch `paccagghañca vilepanaṁ` thành *cả thuốc xoa lên chân nữa* không có căn cứ trong Pāli (ngoài lát này, đã báo ở mục các khoá trùng dùng lại).
