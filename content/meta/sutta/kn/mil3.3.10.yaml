notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Milindapañha. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ dùng lại: Vicāravagga → Phẩm Khảo Sát (4 bài đã có; mil3.3.14 dùng Phẩm Suy Xét là thiểu số) ·
  saññā → tưởng (an10.60:4.3, an10.56 dùng niệm tưởng cho mười niệm tưởng) · Xpañho dasamo → Câu hỏi về
  …, thứ mười (mil3.7.8 thứ tám, mil3.4.3 thứ ba) · Opammaṁ karohī → Hãy xét một thí dụ (đa số 3/6 trong
  tầng; hai cách còn lại là Hãy nêu một ví dụ và Hãy đưa một ví dụ, tôi theo đa số) · Opammaṁ karohī có
  Pāli trùng nguyên văn ở mil3.3.13, mil3.3.14, mil3.3.9, mil3.4.3, mil3.5.9 và 1 bài nữa, dùng lại nguyên
  văn của chúng.
  Màu sắc: nīla xanh · pīta vàng · lohita đỏ · odāta trắng · mañjiṭṭha tím hồng. Tầng có nhiều cách cho
  chữ mañjiṭṭha (tím hồng ở dn23, đỏ thẫm ở mn21, tím ở mn7, anh đào ở mn93); tôi chọn tím hồng để phân biệt
  với lohita là đỏ trong danh sách năm sắc hoàng gia. Bốn chữ đầu thống nhất với dn23 và mn99.
  Bất định đã ghi nhận. Bhaṇḍāgāriko không có tiền lệ trong tầng; tôi dịch là người giữ kho. Rājabhoga
  cũng không có tiền lệ; tôi dịch là vật chất của vua, vì câu ví von chỉ nói người giữ kho nhìn ra các vật
  sắc ấy là của vua.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0. Nháy kép: cặp mở ở 1.1, cặp mở ở 1.2 và đóng ở 1.5,
  cặp mở ở 2.2 và đóng ở 2.3; cân trên cả bài.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
