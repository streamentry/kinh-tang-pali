notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B12 — snp4.16:7.3 (`vata`/`sīlabbata`: bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”/“giới cấm”).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 19.1, 21.4 (`abhinande`, `vihane` là optative ngôi 3 theo DPD; chú giải Sn abhinandeyya, vihaneyya; lời giải Niddesa nandeyya abhinandeyya, haneyya vihaneyya → «nên»); bất định 21.1 (`vineyya` DPD ghi optative và Niddesa giải theo khả năng cách, nhưng chú giải Sn ở snp4.2 giải vinetvā, Sujato và snp4.2:7.1, snp2.14:13.3 đọc như hoạt động đã xong, nên giữ «Sau khi đoạn trừ»).
  Thống nhất cấp kho 2026-10-17: 19.2 khila «sự cứng cỏi» → «sự chai cứng» («cứng cỏi» trong tiếng Việt là vững vàng, nghĩa tốt, trái nghĩa khila: DPD hardness, hard-heartedness; Sujato hard-heartedness; lời giải mnd16:256.4 giải bằng khilajātatā và năm cetokhila; mn16, mnd3, snp4.3:1.4 dùng «chai cứng»).
  Thống nhất cấp kho 2026-10-17: 9.3 Rittāsanaṁ sayanaṁ sevato ce «khi người ấy lui tới chỗ ngồi trống vắng» → «khi người ấy thân cận chỗ ngồi chỗ nằm trống vắng». Bản cũ bỏ sót sayanaṁ (chỗ nằm) và dùng «lui tới» là chữ của bhajato ở 4.2. Lời giải mnd16:152.2–152.7 giải riêng āsana (chỗ ngồi) và sayana (chỗ nằm) và giải sevato bằng «thân cận, gần gũi, gắn bó, sử dụng»; Sujato «frequents a lonely lodging». Dòng dẫn lại ở mnd16:149.3, 152.1, 152.8, 157.3 giữ nguyên; «khi người ấy» ứng với ce của Snp, còn mnd16 đọc ve nên dịch «đối với người».
  Thống nhất cấp kho 2026-10-17: 4.1, 9.1 bỏ «dính mắc» không có trong Pāli (vijigucchato/vijigucchamāna; Niddesa mnd16:77.3, 150.2 giải nhàm chán sinh, già…), khớp mnd16:81.1, 157.1. 9.5 Đức Phật tự xưng «Ta» (§9; cùng dòng snp5.5:2.3), «Ta sẽ nói cho ngươi điều ấy như Ta biết rõ» như cnd2:19.3, cnd8:33.6 (pajānaṁ ≠ liễu tri, hội đồng A5). 10.1–10.2 và 11.3–11.4 căn lại đúng dòng Pāli (lời cũ của khoá này nằm ở khoá kia), theo dòng trích mnd16:168, 173; sapariyantacārī «sống trong ranh giới» (DPD self-restrained, dẫn lời giải bốn ranh giới mnd16:160.9) thay «sống nơi biên địa»; dhīro giữ «bậc trí» theo lời giải paṇḍito paññavā. Còn khác mnd16 ở 64 dòng kệ (văn phong chớ/không nên, abhisambhave, Sāriputta…), chưa đồng bộ.
