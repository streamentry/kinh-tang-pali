notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja403 tại commit đã ghim, `vietnamese-current` tại commit đã ghim vắng với Jātaka.
  Pāli trùng nguyên văn: 4 khoá. Dùng lại nguyên văn 3 chỗ: `:7.2` theo ja260:3.2 (một ngàn con bò cùng với một con bò đực đầu đàn), `:7.3` theo ja323:4.3 (Bậc cao quý sao nỡ chối từ bậc cao quý) và `:7.1` theo ja260:3.1 (bản Pāli ở ja260 không có dấu mở ngoặc kép nên không khớp chuỗi, nhưng vẫn dùng nguyên văn). Cố ý lệch 2 khoá vì tiền lệ dịch sai theo Pāli: `:7.1` ja323 dịch `rohiṇīnaṁ gavaṁ` là trẫm ban cho khanh, lẫn lộn con hươu với bò, nên theo ja260 là những con bò cái đỏ; `:7.4` ja323 dịch `tava` là của khanh, trong khi `tava` là của ngươi, nên dịch là do ngươi nói.
  Bất định: `Yeme` ở `:1.1` đọc là những điều ấy, không rõ danh từ cụ thể, không thêm danh từ nào.
  Thuật ngữ theo tiền lệ đếm được: `vanibbake` → kẻ ăn xin (theo iti75:10.6 và sn3.21:11.2), `brahmacāri` → bậc phạm hạnh (theo ja337:1.3), `brāhmaṇa` → bà-la-môn (theo ja260:3.1 và ja323:4.1), `ariya` → bậc cao quý (theo ja323:4.3), `puṅgava` → bò đực đầu đàn (theo ja260:3.2). Tên phẩm Sattakanipāta → Bộ Bảy Bài Kệ, Kukkuvagga → Phẩm Kukku, xem ghi chú chung của lát ở ja396.
