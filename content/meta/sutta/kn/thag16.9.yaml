  CẤU TRÚC VÀ LỜI NÓI. Pāli mở nháy kép ở `1.1` và đóng ở `28.4` (`anāsavo”ti`), không có nháy nào khác và không có nháy đơn: toàn bài là một lời nói liền mạch, nên bản Việt chỉ mở ở `1.1`, đóng ở `28.4`. Bản Anh của Sujato thêm nhiều nháy ở giữa bài (`10`, `13`–`19`) mà Pāli không có, nên bản Việt không theo. Kệ 1–9 ngài nói về mình ở ngôi ba (`anuruddhova`, `anuruddho`), từ kệ 10 trở đi ngài xưng `tôi` như `an8.30:23`–`25` (cùng ba kệ 10–12, cùng người nói); chữ `ajjhagaṁ` ở `2.3` là dạng ngôi một nhưng nằm trong đoạn ngôi ba, nên bản Việt bỏ trống chủ ngữ ở `2.3`–`2.4` thay vì chọn ngôi.

