  TIỀN LỆ TRÙNG NGUYÊN VĂN — ĐÃ DÒ. Đo toàn tầng (dn, mn, sn, an, kn), so Pāli bỏ dấu câu và hoa thường, không kể khoá tiêu đề, bỏ khoá Pāli quá ngắn: 43 khoá của bài có Pāli trùng nguyên văn ở nơi khác (976 cặp; đa số là `12.4` `kataṁ buddhassa sāsanaṁ` 704 cặp, `12.3` 46 cặp, `10.1` 37 cặp). Trong 43 khoá đó, 35 khoá có ít nhất một bản Việt tiền lệ giống bản này (sau khi bỏ dấu câu), 8 khoá khác: `1.1` (`ja460:11.3` `Rời bỏ cả cha mẹ`; bỏ `cả` vì Pāli không có chữ tương ứng), `3.2` (tiền lệ `mê thích lời dạy`; đổi để `rato … sāsane` ở `3.2` song song với `rato … visaye` ở `2.4`, đều `vui thích trong …`, và `sāsane` → `giáo pháp` theo 54/67 khoá `sāsane` toàn tầng), `13.1` (tiền lệ thêm `ròng rã`, Pāli không có), `15.2` (tiền lệ `vị ấy chịu đựng`, bản này thêm `đã` vì `ajjhavāsayi` là aorist), `17.1`/`17.2` (`sn9.6:6.1` gộp `này Jālinī` vào khoá đầu vì dòng chia khác; ở đây Pāli tách `jālini` sang `17.2`), `22.2` (`mà mình từng sống` / `ta từng sinh sống thuở trước`; chọn `những nơi tôi từng sống thuở trước` theo ngôi `tôi` của bài), `23.5` (bốn tiền lệ cùng Pāli đều khác nhau: `không cần gậy, không cần kiếm`, `không roi gậy, không binh khí`…; chọn `không dùng gậy gộc, không dùng vũ khí` theo `dn14`, `dn26`, `dn30` — 17 khoá `adaṇḍena asatthena dhammena`). Phần lớn tiền lệ lấy từ `an8.30:23`–`25` (kệ 10–12, cùng người nói), `dn16:6.10` và `sn6.15:10`–`11` (kệ 14–15), `dn18:10.6`–`7` (kệ 24), `thag15.1:15` và `thag14.1:12` (kệ 27), `thag2.21:2.4` (`28.4`), `tha-ap5`/`tha-ap11`/`tha-ap475` và `mn92:16.20` (kệ 23).

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `muni` → bậc Mâu-ni (`Mâu-ni` 70 so với `ẩn sĩ` 41 và `hiền` 14 trên 150 khoá toàn tầng; riêng `thag` chỉ 8 khoá, tản: `hiền` 3, `ẩn sĩ` 1). `mahesī` → bậc đại ẩn sĩ (theo các bài đã dịch gần đây). Giữ hai từ khác nhau vì Pāli khác.
    · `satthā` → `bậc Thầy` ở `10.2` (7/8 khoá cùng Pāli, kể cả `an8.30:23.2`), `bậc Đạo Sư` ở `21.2`, `27.1` (`Đạo Sư` 440 và `bậc Đạo Sư` 309 so với `bậc Thầy` 96 trên 685 khoá `satthā`; `thag15.1:15.1` cùng Pāli với `27.1`).
    · `pañca kāmaguṇā` → năm dục (54/79 khoá toàn tầng; `năm dục lạc` 7, `năm dục công đức` 7, `năm loại dục` 5). `anāsavo` → vô lậu. `saṅkilesika` → ô nhiễm (43/48). `sāsana` → giáo pháp ở `3.2`, `12.2`, lời dạy ở `12.4` (`kataṁ buddhassa sāsanaṁ`, 695/704).
    · `parinibbuto`/`parinibbute` → bát-niết-bàn ở `14.4`, `16.4`: `sn6.15:10.4` cùng Pāli chọn `bát-niết-bàn`; toàn tầng thì `diệt độ` 31, `viên tịch` 7, `nhập diệt` 5, `bát-niết-bàn` 4 trên 106 khoá, tức đa số là `diệt độ` nhưng gần hết nằm ở `dn16`. Tôi giữ `bát-niết-bàn` cho cả `14.4` và `16.4` để cùng một từ trong một bài.
    · `middha` → buồn ngủ (`thīnamiddha` toàn tầng dịch `hôn trầm và buồn ngủ`, tức `middha` = buồn ngủ). `bodhipakkhika` → thuộc về giác ngộ (52/66 khoá toàn tầng dùng `giác ngộ`; `an9.1`). `nesajjika` → người chỉ ngồi, không nằm (`thag16.7:15.1` `Chỉ ngồi, không nằm`; `mn113` `người ngồi không nằm`). `manoramā` → làm đẹp lòng. `akutobhayaṁ` → không sợ hãi từ đâu (`pv13:21.2`, `pv24:18.4`).
    · `vasī` → bậc tự tại (`dn1` `bậc Tự tại`). `muhutta` → khoảnh khắc (`mn56`, `sn11.12`). `devatā` → các vị thiên (`an8.46`). `devakāya` → thiên chúng (`dn20`; `sn1.37` dịch `chúng chư thiên`), khác `sn9.6:6.2` `các cõi chư thiên`; chọn `thiên chúng` vì `kāya` là nhóm.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `2.2`/`20.4` `sammatāḷa`: `chũm chọe` (`tha-ap475:9.4`, 3 khoá; `vv35` `chập chõa`). Sujato đọc hai nhạc cụ (`cymbals and gongs`); hợp từ cũng có thể là hai chữ. Tôi giữ một chữ, không thêm nhạc cụ.
    · `2.3` `ajjhagaṁ`: dạng aorist ngôi một (`tôi đã đạt`), nằm giữa các khoá nói ngôi ba; Sujato đọc ngôi ba. Bản Việt bỏ chủ ngữ để không chọn.
    · `2.1`/`20.3` `sameto`/`upeto`: hai từ khác nhau (`sam-` / `upa-` + `eti`), cùng dịch `có múa hát vây quanh` theo Sujato; sắc thái khác nhau (đi cùng / đến gần) chưa tách được.
    · `5.1` `piṇḍapātamatikkanto`: `đã đi khất thực xong` theo `piṇḍapātapaṭikkanto` (`dn10:2.5.3` `khất thực trở về`) và Sujato `returning from almsround`; `atikkanta` nghĩa gốc là `vượt qua`, cũng có thể là `đã vượt qua [giờ/việc] khất thực`.
    · `7.2` `uddhato`: `xao động` (`uddhacca` toàn tầng là `xao động`/`trạo cử`); Sujato `conceited` (kiêu mạn). `saṁsaṭṭho`: `giao du lẫn lộn` (`mn21:2.1` `giao du quá thân mật`, `dn18:23.6` `hòa lẫn`). Chưa phân xử được giữa hai nét.
    · `8.3` `vitto`: `hoan hỷ` theo Sujato `joyful`; tầng chỉ có `pavivitto` (`mn77`), không có `vitto` riêng, nên không có tiền lệ.
    · `11.1` `yadā` (`khi`): `an8.30:24.1` cùng ba kệ đọc `yathā` (`như thế nào`); Sujato dịch như `yathā`. Pāli đã ghim ở bài này là `yadā`, nên tôi dịch `khi`.
    · `16.2` `phassapañcamā`: `những pháp có xúc là thứ năm`; Sujato `these touches and the other four`. Truyền thống hiểu là nhóm năm pháp tâm (xúc, thọ, tưởng, tư, tâm) nhưng Pāli không liệt kê, nên không thêm; `pañcama` là thứ tự, chưa rõ xúc đứng thứ năm hay đứng đầu nhóm năm.
    · `18.1`–`18.2` `sahassadhā … sabrahmakappo`: `gấp ngàn lần` có thể đi với `thế gian` (thế giới ngàn lớp, như `sahassī lokadhātu`) hoặc với `saṁvidito` (biết theo ngàn cách); bản Việt để `gấp ngàn lần` đứng cuối `18.1` nên giữ được cả hai. `kappa` trong `sabrahmakappo`: Sujato `age of the Divinity`; có thể là hậu tố `-kappa` (`gần như`), có thể là kiếp. Bản Việt chỉ dịch `cùng cõi Phạm thiên`, không dịch `kappa`.
    · `18.4` `kāle`: `đúng lúc`; Sujato nối với `cutūpapāte` (`at the time they pass away`). Pāli không bắt buộc cách nối đó.
    · `19.2` `ghāsahārako`: `người gánh cỏ` (Sujato `carrier of fodder`); `ghāsa` cũng có thể là thức ăn nói chung. `19.1` `annabhāra`: coi là tên riêng như `mn77:2.2` (`Annabhāra`); nếu là danh từ chung thì là `người mang thức ăn`.
    · `19.3` `samaṇaṁ paṭipādesiṁ`: `cúng dường vị sa-môn` theo `sn3.20:4.1` (`paṭipādesi` đi với `piṇḍapātena` là dâng cúng đồ ăn khất thực); ở đây không có `piṇḍapātena`, nên Pāli chỉ nói `paṭipādesiṁ` với tân ngữ `samaṇaṁ`. Sujato `I practiced as an ascetic` hiểu `paṭipādesiṁ` khác. Tôi bám tân ngữ `samaṇaṁ` ở cách đối cách và `upariṭṭhaṁ yasassinaṁ` đồng cách với nó (`mn116:4.2` có Upariṭṭha là một vị Độc Giác Phật; Pāli bài này không nói, nên không thêm).
    · `20.2` `vidū`: `người ta biết tôi là Anuruddha` (ngôi ba số nhiều của `vid-`); cũng có thể là danh từ `bậc hiểu biết` (`bậc trí gọi tôi là Anuruddha`).
    · `22.4` `aṭṭhāsiṁ sakkajātiyā`: `tôi đã ở lại, sinh làm Sakka` (Sujato `I was born as Sakka, and stayed`); `jāti` có thể là `sinh` hoặc `loại`, `ṭhā` là `đứng/ở`.
    · `24.3` `nivāsamabhijānissaṁ`: dạng vị lai ngôi một (`sẽ nhớ`), trong khi `dn18:10.8` cùng cấu trúc là hiện tại `abhijānāmi`; Sujato `I shall remember`. Tôi giữ vị lai theo chữ, dù ngữ cảnh (`ṭhito tadā`) nói về quá khứ.
    · `1.2` `ñātibhātaro`: `bà con, anh em` (Sujato `kinsmen, and brothers`); `bà con` 107, `thân quyến` 50, `quyến thuộc` 51, `họ hàng` 29 trên 281 khoá có `ñāti` toàn tầng, nên chọn `bà con`.
    · `3.1` `etañca` → `tất cả những thứ ấy` theo `sn4.17:4.1` (cùng Pāli); `etañca` đúng chữ là `và điều này`, nên `tất cả` là cách mở rộng của tiền lệ, giữ cho nhất quán.
    · `17.1` `punāvāso` → `chốn tái sinh` theo `sn9.6:6.1`; đúng chữ là `chốn ở lại lần nữa`. `17.2` `jālini` coi là hô cách của tên `Jālinī`.
    · `28.2` `jīvitasaṅkhayā`: `khi mạng sống đã hết` (khiếm cách chỉ lý do/thời điểm); Sujato `my life will come to an end`.

