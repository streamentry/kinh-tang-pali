  Phạm vi: đủ 119/119 khoá của bài (4 khoá `:0` tiêu đề, 114 khoá kệ `1.1`–`28.4` thuộc 28 bài kệ, `28.5` dòng bìa), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã in và đọc đối chiếu cả 119 cặp Pāli↔Việt, không đọc mẫu. Bài là kệ tự thuật của Trưởng lão Anuruddha, gồm lời ca ngợi ngôi ba (kệ 1–9), lời ngài tự nói về lần Đức Phật đến (kệ 10–13), các kệ gắn với lúc Đức Phật nhập diệt (kệ 14–17; kệ 14–15 trùng với `dn16`/`sn6.15`, kệ 17 với `sn9.6`), kệ tiền thân và thắng trí (kệ 18–26), và lời hứa nhập diệt (kệ 27–28).

