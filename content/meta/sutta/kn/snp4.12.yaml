notes: |-
  Lượt rà soát 2026-10-15 (lô G1, Claude Sonnet 5.5 (Claude Code)): `11.4` `pāva` là động từ "nói"
  (cùng gốc `pāvadati` ở mnd12:74.4–74.5), không phải "ác"; nay "nó khinh miệt người khác, mà cũng nói
  đúng điều ấy". `17.2` `uddhaṁsa`: bản cũ "ngày càng nhiều" theo Sujato ("more and more") không có
  căn cứ trong chữ Pāli; Niddesa mnd12:111.2 giải `uddhaṁso vuccati anāgataṁ`, mnd12:111.1 đã dịch "về
  sau"; nay "về sau, vị ấy đi đến tranh cãi ở đời". Cách đọc này theo Niddesa và còn bất định (Sujato
  khác); PED không tra được mục `uddhaṁsa` trên dsal. `4.1` `na vīvadātā`: BẤT ĐỊNH, KHÔNG SỬA. Chữ
  ghim có phủ định (mnd12:24.2 giải `anavīvadātā avodātā apariyodātā saṅkiliṭṭhā` = không trong sạch)
  nhưng bản Việt và Sujato đều dịch như khẳng định "nhờ kiến riêng mà thanh tịnh"; dịch sát chữ ghim
  thì mệnh đề ("do kiến riêng mà không được trong sạch, tuy tuệ thanh tịnh…") khó mạch lạc, nên giữ
  nguyên, người biên tập cần quyết định.

  Quyết định hội đồng biên tập 2026-10-16: A10 — snp4.12:4.1, snp4.12:4.4, snp4.12:4.2, snp4.12:4.3 (khôi phục phủ định của `na vīvadātā` (Pāli ghim; Niddesa mnd12:23–24 giải là chưa được làm cho trong sạch), `samattā` = trọn vẹn ở 4.4, và nối lại 4.2–4.3 cho liền mạch; Sujato đọc khác (theo dị bản, không có trong bản ghim)); B11 — snp4.12:10.1 (`muta` = cảm nhận (PED/DPD: sensed), không phải “nhận thức”/“tưởng”).
  Đồng bộ với mnd12/mnd13 sau lượt rà DPD 2026-10-16: `15.4`, `16.1` *sakāyana*/*samhi* «đường lối riêng» thay «trú xứ riêng» (DPD *own path; own way*; chú giải att13 *Sakāyananti sakamaggaṃ*), đồng bộ mnd12, mnd13, snp4.12.
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 3.2 (`bālomako`: DPD bālomaka «worthless fool; lit. low fool», Niddesa mnd12:18.2 «bālo hoti hīno nihīno omako»; bỏ «vô trí» không có trong Pāli: «kẻ ngu, vô trí» → «kẻ ngu hạ liệt»), 5.2 (`bālā` là lời họ gọi nhau, không phải chủ ngữ: Niddesa mnd12:32.3, chú giải Snp «mithu dve dve janā aññamaññaṃ ‘bālo’ti āhu», Sujato «when they call each other fools»: «những kẻ ngu nói lẫn nhau» → «họ, từng đôi một, gọi nhau là ngu»), 16.2 (`kamettha` = «ai ở đây», DPD «who here; in this case which person»; Niddesa mnd12:105.2 «kaṁ daheyya kaṁ passeyya», chú giải «kaṃ paraṃ ettha … ‘bālo’ti passeyya»: «sao còn xem người khác là ngu?» → «ở đây vị ấy có thể xem ai khác là ngu?»; Sujato «how can they» đọc lỏng hơn), 16.3 (`āvaheyya` optative, Niddesa mnd12:106.3 và chú giải «kalahaṃ āvaheyya»: «mang đến» → «sẽ mang đến»; giữ «xung đột» như 17.4 của bài).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 4): sửa 10.1–10.2 (căn đoạn: *nissāya* thuộc 10.2, bản cũ chuyển «Nương tựa» lên 10.1 và 10.2 «kẻ thấy khinh miệt hiện ra» tối nghĩa; nay 10.1 «Trong điều đã thấy, đã nghe, giới cấm, hay điều đã cảm nhận», 10.2 «nương vào những điều ấy, nó có cái nhìn khinh miệt»: Niddesa mnd12:65.4–65.5 *na sammānetīti vimānadassī*, Sujato «based on these they show disdain»), 12.2 (`paripuṇṇamānī` «đầy tràn ngã mạn» → «tự cho là viên mãn»: chú giải *‘paripuṇṇo ahaṃ kevalī’ti evaṃ paripuṇṇamānī*, Niddesa mnd12:79.4 *samattamānī anomamānī*, Sujato «imagining themselves proficient»), 12.4 (sót `samattā`: «vì kiến của vị ấy là như vậy» → «vì kiến ấy của vị ấy trọn vẹn như vậy», như 4.4 của bài và Niddesa mnd12:81.2), 15.3 (`niviṭṭhā` «an trú» → «đắm chìm»: Niddesa mnd12:99.4 *niviṭṭhā patiṭṭhitā allīnā … ajjhositā*, DPD attached to, Sujato «dogmatic»); giữ 6.1, 9.4 (*sacca* «thật»), 7.2 (*vivade* «tranh chấp»), 1.2, 2.1 (*viggayha*), 17.2 (*uddhaṁsa*, đã ghi ở trên): ngang nghĩa hoặc đã có quyết định.
  Thống nhất cấp kho 2026-10-17: kusalāvadāna/kusalā vadānā dịch «tự nhận là thiện xảo» (số ít kusalāvadāno: «tự mình nhận mình là thiện xảo»), theo DPD vadāna «asserting; professing», lời giải Niddesa kusalavādā (= tuyên bố mình là) và mnd13/snp4.13; thay «tự cho (mình) là», «tán thán».
