  biến* (đã phân xử theo vv23/vv24 và `pakkha`; các bài khác còn *tuần lễ*/*kỳ nửa tháng*, lỗi lệch họ
  chờ người biên tập). Bất định giữ nguyên: 10.2 `tapassiyugaṁ mahāmuniṁ` (*cặp tu sĩ khổ hạnh, bậc
  Đại Muni* — Pāli `mahāmuniṁ` số ít; Indacanda gộp thành *hai vị đại hiền trí khổ hạnh*; chưa phân
