  BẤT ĐỊNH (đã ghi, không giấu, không bịa thêm):
    (1) `1.4` `kiñjakkhaparivāritā` — `kiñjakkha` chỉ có **5 chỗ** trong toàn Pāli root
      (`vv22:1.4`, `ja547:307.4` `kiñjakkhareṇu`, `ja547:346.5`, `pv13:20.4`, `pv27:26.4`,
      tất cả đều trong ngữ cảnh trang trí), và **0** tiền lệ trong tầng Việt. Pāli không
      nói rõ loài cây; tôi dịch `viền bằng lá kiñjakkha` và giữ tên, KHÔNG đoán là gừng
      hay riềng. Đây là chỗ tôi tự đặt, nên `semantic_fidelity` bị trừ.
    (2) `1.1–1.3` năm màu `nīlā pītā kāḷā mañjiṭṭhā lohitā` — Pāli không nói thứ gì được
      bọc viền. Tôi để câu không gán chủ thể (`đủ màu chồng lên nhau, / viền bằng lá
      kiñjakkha.`) thay vì bịa ra là rèm hay vòng hoa.
    (3) `10.1–10.2` `Bhikkhū cāhaṁ paramahitānukampake, Abhojayiṁ tapassiyugaṁ
      mahāmuniṁ;` — đọc là (bậc được các tỳ-kheo đại hỷ, đại thương) + tôi khiến Đại Muni
      hài lòng, tức `bhikkhū` là của các tỳ-kheo và `paramahitānukampake` là tính từ
      bổ nghĩa cho `mahāmuniṁ`. Cách đọc còn lại là xưng hô (`Hỡi các tỳ-kheo`) nhưng
      `paramahitānukampake` ở số ít đơn không hợp, nên tôi chọn cách trên.
      `tapassiyugaṁ` là HAPAX (1 chỗ trong Pāli root): tôi dịch `cặp phương pháp tu
      hành`, không bịa nội dung cặp phương pháp ấy. `Đại Muni` đã có 5 lượt / 4 bài.
    (4) `4.1` `Bhadditthikāti` — tên nữ của bài. `vv28:9.3` xác nhận dạng gốc là
      `bhadditthī`, và tầng tên đã ghim dịch `vv22` là *Lovely Lady’s Mansion*. Tôi dùng
      `Dịu Dàng` cho cả `0.4`, `4.1`, `12.1` để không tự tạo thêm một cách đặt tên nữa;
      nếu người điều phối muốn theo *Lovely Lady* thì sửa cả ba khoá cùng lúc.

