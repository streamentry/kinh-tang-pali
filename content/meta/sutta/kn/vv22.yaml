  Sửa lan 2026-10-13: khoá `vv22:9.3` (`Upāsikā cakkhumato`): *Là đệ tử cư sĩ của Đấng Có Mắt Tuệ* → *Là nữ cư sĩ của Đấng Có Mắt Tuệ*. Căn cứ: `upāsikā` là nữ cư sĩ; `vv22:4.2` cùng bài đã dịch *nữ cư sĩ*; Pāli trùng nguyên văn `vv15:9.3`, `vv24:9.3`, `vv37:10.3` (cùng dạng *Là nữ cư sĩ của Đấng Có Mắt Tuệ,*) — dùng lại. Chưa kiểm đối kháng, nhưng đọc lướt thấy các khoá khác của `vv22` còn nghi lệch Pāli, chưa sửa trong lượt này: `1.3`–`1.4`, `3.1`–`3.3`, `7.3`, `10.1`–`10.2`.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 51 khoá, đổi 37 khoá. Phần ghi chú cũ phía trên về các khoá dưới đây ĐÃ BỊ THAY THẾ bởi mục này; nhiều lập luận cũ (ví dụ "lá kiñjakkha", "Ý thức cùng đồng hành", "mùa an cư", "bằng cặp phương pháp tu hành", "Dịu Dàng") đã bị bác bỏ.
    · Sửa sai chủ thể: `2.2` `mālaṁ dhāresi muddhani` là ngôi hai (người hỏi nói với nữ thiên): *tôi đeo quanh cổ mình* → *nàng đội trên đầu mình* (`dhāresi` = ngươi đội; `muddhani` = trên đầu). `2.3–2.4` `Nayime aññesu kāyesu, rukkhā santi sumedhase`: *Ở những thân xác khác, không có cây nào thơm dịu hơn* → *Nơi các chúng trời khác, không có những cây này, hỡi nàng thông tuệ* (`sumedhase` là hô cách, đã có tiền lệ `dn21:1.5.54` *hỡi nàng thông tuệ*; không có so sánh "hơn").
    · `1.4` `kiñjakkhaparivāritā`: *viền bằng lá kiñjakkha* → *có nhụy hoa vây quanh*. Căn cứ: 5 chỗ khác trong tầng dịch `kiñjakkha` là nhụy/nhị hoa (`dn21:1.5.14`, `sn22.89:10.2`, `ja547:307.4`, `ja547:346.5`, `pv13:20.4`, `pv27:26.4`); Pāli hoàn toàn không nói tới lá hay loài cây. `1.3` `Uccāvacānaṁ vaṇṇānaṁ`: *đủ màu chồng lên nhau* → *gồm đủ loại màu sắc* (không có ý "chồng lên nhau"); `1.2` `lohitā`: *đỏ tươi* → *đỏ* (không có "tươi").
    · `3.1–3.2` `Kena kāyaṁ upapannā tāvatiṁsaṁ`: bản cũ viết *Cung điện uy nghi thế ấy sinh ra từ thân nghiệp nào* — không có chữ nào trong Pāli nói về cung điện; sửa thành *Do đâu nàng được sinh vào chúng trời Ba Mươi Ba*, theo cách dịch `kāyaṁ upapajjati` = *sinh vào chúng trời* (`mn123:3.2`, `mn143:16.2`, `dn24:1.18.18`). `3.3–3.4` dùng lại cách dịch đa số của cùng Pāli: `3.4` 7/10 khoá cùng Pāli đã là *đây là quả báo của nghiệp nào?*; `3.3` theo `vv24:13.3` (cùng phẩm) *Này nữ thiên, được hỏi, hãy cho biết* (bản cũ *hãy nói lời hỏi* sai: `pucchitā` là "được hỏi").
    · `4.1` `Bhadditthikāti`: bản cũ dịch tên thành *Dịu Dàng*, không có căn cứ trong Pāli (`bhaddā` + `itthikā` là tên riêng; tầng dịch giữ phiên âm tên người ở hầu hết tên bài Vv: Caṇḍālī, Soṇadinnā, Uposathā, Niddā, Suniddā…). Đổi sang giữ tên `Bhadditthikā` ở `4.1` và `Bhadditthi` ở `0.4`, `12.1` (theo đúng tên Pāli ở từng khoá), cùng khuôn *Người ta biết đến tôi là …* của `vv23:5.1`. `4.2` `Kimilāyaṁ`: *Kimila* → *Kimilā* (định cách của thành Kimilā; `sn54.10:1.2`, `an5.201:1.1` đều *ở Kimilā*).
    · `5.2` `senāsanaṁ padīpiyaṁ`: *chỗ nằm và tấm phản* → *chỗ ở và đèn sáng* (`padīpiya` là vật thắp sáng, cùng nghĩa `padīpeyya` trong công thức `seyyāvasathapadīpeyya`; `vv23:6.2`, `vv25:5.2` đều *chỗ ở và đèn sáng*; *tấm phản* không có căn cứ).
    · `6.3` `Pāṭihāriyapakkhañca`: *tuần lễ* → *nửa tháng* (`pakkha` = nửa tháng, đã là *nửa tháng* ngay ở `6.2` cùng khổ thơ). Đã đo: tầng dịch có 11+2 khoá *tuần lễ thần biến* ở bài khác và 6 khoá *nửa tháng thần biến*; chọn *nửa tháng* vì Pāli trùng nguyên văn với `vv23:7.3`, `vv24:6.3`, `vv25:6.3`. Cách dịch "tuần lễ" của các bài kia là lệch từ vựng, không sửa trong lượt này (ngoài phạm vi).
    · Khôi phục khoá trùng Pāli nguyên văn với `vv23`: `7.1–7.4` (*Luôn giữ ngày trai giới / giới hạnh giữ mình trong sạch / Ý thức cùng đồng hành của nó / tôi cho cung điện này làm nơi ở* → *Tôi đã giữ ngày trai giới / luôn thu thúc trong các giới / nhờ tự chế ngự và biết chia sẻ / tôi cư ngụ trong cung điện này*: `saññamā`, `saṁvibhāgā` là cách thức/nguyên nhân cách của sự tự chế và sự chia sẻ, `āvasāmahaṁ` = `āvasāmi ahaṁ` "tôi cư ngụ"; bản cũ nhầm `saññā` = ý thức và đảo chủ thể thành "tôi cho"), `8.1–8.4` (*Từ bỏ sát người … không làm quá đà … rượu chè say sưa* → *Tránh xa việc sát sinh … không tà hạnh … xa lánh việc uống rượu*; `pāṇātipāta` là sát sinh, không phải "sát người"), `9.1–9.2` (*Luôn hoan hỷ gìn giữ năm giới điều / thấu suốt các Thánh đế nhiệm mầu* → *Hoan hỷ trong năm giới điều / thông tỏ các Thánh đế*; bỏ *luôn*, *gìn giữ*, *nhiệm mầu* không có trong Pāli). Pāli trùng nguyên văn với bài khác: 25/51 khoá đã dò, 17 khoá khác chữ với một số bản (đa số chỉ khác chữ hoa/dấu cuối câu hoặc là biến thể thiểu số), mọi khoá còn lại đã theo hình thức đa số của tầng hoặc của `vv23`.
    · `9.4` `Appamādavihārinī`: *luôn sống trong sự không phóng dật* → *sống không phóng dật* (bỏ *luôn*; cách dịch của `appamādavihārī` trong tầng đều là *sống không phóng dật*).
    · `9.5/10.3/11.3` `Katāvāsā katakusalā tato cutā`: bản cũ *Đã giữ mùa an cư, làm điều lành* — bỏ mất `tato cutā` ("từ đó mệnh chung") và dịch `katāvāsā` thành "giữ mùa an cư" mà Pāli không có (`āvāsa` là chỗ ở, không phải mùa an cư). Sửa thành *Đã tạo chỗ ở, đã làm điều lành, từ đó mệnh chung*. `9.6/10.4/11.4` `Sayaṁpabhā anuvicarāmi nandanaṁ`: *nay tôi lang thang một mình ở cõi Nandan* → *tự phát sáng, tôi dạo khắp vườn Nandana*: `sayaṁpabhā` = tự phát sáng (`dn1:2.2.3`, `dn27:12.3`…), bản cũ đã thêm "một mình" không có trong Pāli; `nandanaṁ` là vườn Nandana (`vv21:8.4`, `sn9.6:4.2`, `an5.34:10.2` *vườn Hoan Lạc*), không phải *cõi Nandan*. Ba khoá `9.5/10.3/11.3` giống nhau và hai khoá `9.6/10.4` giống nhau, đã kiểm trùng tuyệt đối.
    · `10.1–10.2` `Bhikkhū cāhaṁ paramahitānukampake, Abhojayiṁ tapassiyugaṁ mahāmuniṁ`: bản cũ *Bậc được các tỳ-kheo đại hỷ, đại thương, tôi đã khiến Đại Muni hài lòng bằng cặp phương pháp tu hành* sai nhiều chỗ: `abhojayiṁ` là "đã cho ăn/cúng dường thức ăn" (xem `tha-ap22:12.1`, `tha-ap44:2.4`), không phải "khiến hài lòng"; `bhikkhū … paramahitānukampake` là đối cách số nhiều "các tỳ-kheo, những bậc từ mẫn vì lợi ích tối thượng" (`vv16:13.4` *bậc từ mẫn vì lợi ích tối thượng*), không phải một vị trợ từ cho Đại Muni; `tapassī` là người tu khổ hạnh nên `tapassiyugaṁ` đọc là "cặp tu sĩ khổ hạnh", không phải "cặp phương pháp tu hành". Sửa thành *Và các tỳ-kheo, những bậc từ mẫn vì lợi ích tối thượng, / tôi đã cúng dường thức ăn, cặp tu sĩ khổ hạnh, bậc Đại Muni*.
    · `11.1–11.2`: *chở đến an lành* → *đem lại an lạc* (`sukhāvaha`: `sn2.6:2.5`, `an8.54:17.4` *đem lại an lạc*); `Uposathaṁ satatamupāvasiṁ ahaṁ` *đều là điều tôi vẫn luôn giữ* → *tôi đã luôn luôn giữ* (`upāvasiṁ` là động từ "đã giữ"; bản cũ dựng thành mệnh đề "đều là điều" không có trong Pāli).
  Đã kiểm lại: 51/51 khoá khớp Pāli, thứ tự khoá đúng, 0 khoá rỗng, NFC sạch, nháy kép `“ ”` khớp Pāli từng khoá (mở ở `1.1`, `4.1`; đóng ở `3.4`, `11.4`), không có nháy đơn, bài không có dấu lược `…` ở Pāli lẫn Việt, 0 chữ Pāli lọt sang bản Việt ngoài tên riêng, số Pāli trong bài (mười bốn, mười lăm, thứ tám, năm giới, tám chi phần) đã đối chiếu từng khoá. Cổng kỹ thuật: bài này được kiểm bằng bộ kiểm cấp lát; `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này nên `technical_integrity` giữ 9.6.
  Chấm lại trung thực (trước → sau): `semantic_fidelity` 9.2 → 8.6 (bản trước có nhiều lỗi nghĩa mà điểm cũ không phản ánh; sau sửa vẫn còn bất định thật ở dưới), `grammar_logic` 9.3 → 8.8 (cấu trúc `10.1–10.2` chưa phân xử chắc), `terminology` 9.3 → 8.8 (`katāvāsā`, `kāya` = chúng trời, tên Bhadditthi), `vietnamese_clarity` 9.4 → 8.9 (`1.2` *đỏ thẫm, và đỏ* và `10.1–10.2` còn gượng), `han_viet_balance` 9.3 → 9.2, `ambiguity_integrity` 9.0 → 8.4 (bất định thật còn nhiều hơn bản trước tự nhận); `source_provenance` 9.4, `segment_alignment` 10.0, `triangulation` 7.0 (không có tầng Anh độc lập, không nâng), `technical_integrity` 9.6 giữ nguyên. `final_score` 9.15 → 8.87 (trung bình số học thô).
  BẤT ĐỊNH CÒN LẠI (không giấu):
    (1) `katāvāsā` (`9.5/10.3/11.3`): đọc theo gốc là `kata` + `āvāsa` "đã tạo chỗ ở". Công thức giống hệt ở `an5.34:10.1` lại viết `katāvakāsā` ("đã tạo cơ duyên" trong tầng dịch), nên có thể `katāvāsā` là biến thể của `katāvakāsā`; không có tầng Anh hay chú giải nào đã ghim để phân xử. Giữ nghĩa đen của Pāli đã ghim và ghi bất định.
    (2) `tapassiyugaṁ mahāmuniṁ` (`10.2`) là hapax (1 chỗ trong Pāli root): đọc là hai tân ngữ liền nhau "cặp tu sĩ khổ hạnh, bậc Đại Muni"; cũng có thể `mahāmuniṁ` đồng vị với `tapassiyugaṁ` ("cặp bậc đại ẩn sĩ khổ hạnh"). Dấu phẩy được giữ để không chọn thay.
    (3) `kāya` (`2.3`, `3.1`) dịch là *chúng trời* theo tiền lệ `tusitaṁ kāyaṁ upapajjati` và `tāvatiṁsakāyaṁ upapannā`; cách đọc "thân" (thân xác) không bị loại hẳn ở `2.3`, nhưng ở `3.1` cú pháp `kāyaṁ upapannā tāvatiṁsaṁ` thiên hẳn về "chúng".
    (4) Người hỏi ở `1–3` không được nêu trong Pāli của bài; xưng hô giữ `tôi`/`nàng` như `vv23`–`vv26` cùng phẩm, không gán danh tính cho người hỏi. Nếu người hỏi là Đức Phật thì các khoá `4–11` có thể phải xưng `con`; không có căn cứ trong Pāli đã ghim để quyết.
    (5) Tên `Bhadditthi`/`Bhadditthikā`: không dịch nghĩa; Sujato dịch tên bài là *Lovely Lady* ở tầng tên, nhưng tầng dịch của dự án giữ phiên âm tên người ở hầu hết tên bài Vv (cũng có ngoại lệ như `vv37` *Mắt To*); không đổi nghĩa trong lượt này.
    (6) `Pāṭihāriyapakkha` = *nửa tháng thần biến* là cách dịch của `vv23`–`vv25`; nghĩa thật của thuật ngữ (kỳ trai giới đặc biệt quanh ngày rằm) chưa được phân xử; các bài ngoài `vv` dùng *tuần lễ* (13 khoá) — không đồng nhất toàn tầng, ghi để người điều phối xử lý chung.
  KHÔNG đổi dù nghi ngờ: `4.3–4.4`, `5.1`, `5.3–5.4` (đã trùng đa số với `vv23`), `6.1–6.2`, `6.4`, `9.3` (đã sửa lan đúng), `0.1–0.3`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 6 vị trí bất đồng nghĩa → sửa 1 (5.3: chân thành → ngay thẳng, vì ujubhūta là ngay thẳng, chính trực; cùng cụm Adāsiṁ ujubhūtesu đã là ngay thẳng ở vv19:6.3, vv25:5.3, vv37:6.3 và 8 khoá ujubhūtesu khác, chỉ vv23:6.3 và vv24:5.3 dùng chân thành), giữ 3 (4.2: bản nguyên bài viết Kimbilā, Pāli ghim là Kimilāyaṁ; 7.3: saññamā saṁvibhāgā là cách thức hoặc nguyên nhân cách, bản nguyên bài đọc như điều kiện đi kèm, cùng ý chính; 9.3–9.4: bản nguyên bài thêm danh xưng Gotama có danh tiếng và bỏ Appamādavihārinī, là dị bản khác, Pāli ghim chỉ có Upāsikā cakkhumato và Appamādavihārinī), bất định 2 (6.3: Pāṭihāriyapakkha, bản nguyên bài đọc là những ngày phụ trội của nửa tháng, bản dự án giữ nửa tháng thần biến theo vv23–vv25, nghĩa kỹ thuật chưa phân xử được từ Pāli ghim; 10.2: tapassiyugaṁ mahāmuniṁ, bản nguyên bài đọc là một cặp hai bậc đại hiền trí khổ hạnh, tức mahāmuniṁ đồng vị với yugaṁ, bản dự án giữ dấu phẩy nên vẫn mở cả hai cách đọc vì cả hai hợp ngữ pháp). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt 49 khoá, đối chiếu bản nguyên bài
