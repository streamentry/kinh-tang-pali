notes: |-
  Dịch trực tiếp từ Pāli root (snapshot SuttaCentral/Bilara đã ghim). Bài: Dukkarakārikapañha, câu hỏi thứ hai của Vessantaravagga (Anumānapañha): vì sao chỉ riêng Bồ-tát Gotama thực hành khổ hạnh dù chư Phật ngang bằng nhau về các pháp của Phật; vì sao Bồ-tát ra đi khi trí chưa chín muồi; lời dụ dỗ của thiên tử về bánh xe báu; mười sự trói buộc; mười hạng người bị coi thường; hai mươi lăm pháp làm yếu tâm; và việc Bồ-tát có thất niệm hay không khi nghĩ đến con đường khác. 94/94 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập khoá Pāli.

  TẦNG THAM KHẢO (đo, không đoán): bản Sujato không có cho bài này. Thư mục `kn/` của edition `translation/en/sujato` tại commit đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud (755 tệp), không có `mil`; đây là `not-published-upstream`, không phải `not-synced`. Tầng `vietnamese-current` cũng vắng (bilara tại commit ghim chỉ phân phối Pháp Cú). Lớp `english-project` của dự án chưa có tệp cho bài này. Coverage English theo công thức của `source/layers.yaml` (Pāli có nội dung từ 40 ký tự sau nén khoảng trắng, bỏ khối :0.x): 0/49 = 0%, dưới ngưỡng 0,80 (49 trên 94 khoá). Ba tầng tham khảo đều vắng nên bài chỉ được đối chiếu với Pāli root, giữ `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7,5 (không quá 8,0). Đây là giới hạn của snapshot, không phải lỗi dịch.

  TIỀN LỆ ĐÃ ĐO: (a) `Bhante nāgasena` -> Thưa tôn giả Nāgasena: toàn tầng mil 147, Bạch ngài 113, Thưa Đại đức 44, Thưa ngài 34; trong các bài cùng phẩm (mil6.3.x) 23 so với 2 Bạch ngài; chọn theo phẩm. Vì vậy `Na hi, bhante` -> Không phải vậy, thưa tôn giả (dạng này 43 trong 65 khoá Pāli trùng của tầng mil), và `Sādhu, bhante nāgasena, evametaṁ tathā sampaṭicchāmi` theo mil6.3.4:2.10 và mil6.2.5:10.9 (Lành thay, thưa tôn giả Nāgasena … tôi xin chấp nhận). (b) `mahārāja` -> Này Đại vương: toàn tầng mil 870, tâu đại vương 550, thưa đại vương 189; ở mil6.3.x là 70 so với 10 và 1; chọn Này Đại vương theo phẩm (khác mil5.2.x chọn tâu đại vương). (c) `dukkarakārikā` -> khổ hạnh (14 trong 15 khoá của tầng, cả mn36:30.5 lẫn mil6.1.4:1.1); `bodhisatto` -> Bồ-tát (67 lần xuất hiện trong mil); `cakkaratana` -> bánh xe báu (57/62); `sahassāraṁ sanemikaṁ sanābhikaṁ sabbākāraparipūraṁ` và `parosahassañca … puttā … sūrā vīraṅgarūpā parasenappamaddanā` lấy lại cách dịch dn17:1.7.4 (đầy đủ vành, trục và mọi chi tiết) và dn14:1.31.11 (dũng mãnh, anh hùng, có khả năng chế ngự quân địch). (d) `saṁvegamāpajji` -> rúng động (bốn khoá sn9.1, sn9.3, sn9.5, sn9.7 có `saṁvegamāpādī` đều dịch rúng động); `ubbijji` -> hoảng hốt (mil5.2.3:10.1); `satisammoso` -> thất niệm (4 so với 1 mất niệm); `arati` -> bất mãn (14 trong 39 khoá, so với chán 11); `ukkaṇṭhita` -> chán nản (thag1.105:1.1). (e) Danh sách hai mươi lăm pháp (17.3-17.26) lấy lại bộ thuật ngữ mn7:3.2 (giận dữ, hằn học, gièm pha, hơn thua, ganh tị, keo kiệt, giả dối, xảo trá, bướng bỉnh, hung hăng, kiêu mạn, ngạo mạn, tự mãn, phóng dật) và mn8:14.5 cho `thinamiddha` (hôn trầm và buồn ngủ); `tandi` -> uể oải (0 tiền lệ trực tiếp; sn1.16:2.2 dùng uể oải cho `bhattasammada` gần nghĩa); `ālasya` -> lười biếng (dn31:13); không có tiền lệ nào cho cụm `cittadubbalīkaraṇa` (0 khoá). (f) `bandhana` -> sự trói buộc: trên các khoá Pāli có `bandhana` ở tầng 40 khoá dùng trói buộc, 22 dây trói, 12 ràng buộc. (g) `lābhasakkāra` -> lợi dưỡng và sự cung kính (106 khoá có lợi dưỡng; dn25:10 `lợi dưỡng, cung kính và danh tiếng`). (h) `oññātā avaññātā hīḷitā khīḷitā garahitā paribhūtā acittīkatā` -> bảy cụm khác nhau (bị xem thường, bị coi rẻ, bị khinh miệt, bị chế nhạo, bị chê trách, bị sỉ nhục, không được kính trọng) theo mil5.5.9:7.3 (xem thường, khinh miệt, chế nhạo, chê trách, sỉ nhục, không được kính trọng); chuỗi này dùng đúng một chuỗi Việt ở 15.1, 15.3, 15.12, 15.13. (i) Tiêu đề: 0.2 Anumānapañha -> Câu hỏi về suy luận (20/26 khoá Pāli trùng); 0.3 Vessantaravagga -> Phẩm Vessantara (8/8); 0.4 dùng dạng chữ thường như mil6.3.3 (`3. Câu hỏi về …`).

  PĀLI TRÙNG NGUYÊN VĂN: trong chính bài có 1 nhóm khoá Pāli y hệt (11.2/11.4), bản Việt giống hệt nhau; không cặp nào bản Việt khác. Với phần còn lại của tầng mil, 9 khoá của bài có Pāli trùng nguyên văn khoá của bài khác, tổng 407 cặp, trong đó 63 cặp bản Việt khác. Chi tiết: 0.1 235 cặp, 11 khác (Milindapañha giữ nguyên, dạng đa số 223); 0.2 26/6; 0.3 8/0; 10.3 2/0 (Vì lý do gì? đúng bản đã có); 11.2 và 11.4 mỗi khoá 65/21 (chọn dạng đa số 43/65); 12.7 4 cặp, 2 khác (Kiṁ kāraṇā? tầng có Vì cớ gì? 2, Vì cớ sao? 1, Vì lý do gì? 1; chọn Vì cớ gì? là dạng nhiều nhất); 2.3 (Katamehi catūhi?) 1/1 và 15.2 (Katame dasa?) 1/1 là hai khoá cùng Pāli với bài khác nhưng đối tượng đếm khác nhau (bốn nguyên nhân so với bốn điểm; mười pháp so với mười hạng) nên dịch khác có chủ ý, `bốn điểm nào?` khớp `bốn điểm` ở 2.2.

  SỐ PĀLI (tính lại, không chép): catūhi / catu 4 -> bốn (2.2, 2.3, 2.5, 2.6, 6.1); sattame divase 7 -> ngày thứ bảy (6.1, 10.1, 10.2); sahassāra 1.000 -> một ngàn nan hoa (6.1); dvisahassa 2 x 1.000 = 2.000 -> hai ngàn đảo nhỏ (6.1); parosahassa -> hơn một ngàn (6.1, theo dn14:1.31.11); sattaratana 7 -> bảy báu (6.1); satasahassaṁ 100 x 1.000 = 100.000 -> một trăm ngàn kiếp (11.3, 18.2); caturo asaṅkhyeyye 4 -> bốn a-tăng-kỳ (11.3, 18.2); chahi vassehi 6 -> sáu năm (11.3); satadhā / sahassadhā 100 / 1.000 -> trăm mảnh / ngàn mảnh (12.4); dasa 10 -> mười (13.2, 13.3, 15.1, 15.2, 15.13, 15.14; số mục đã đếm đủ 10 ở 13.4: mẹ, cha, vợ, con, bà con, bạn bè, của cải, lợi dưỡng và sự cung kính, quyền thế, năm dục lạc; và 10 hạng người ở 15.3-15.12: 1 + 9); pañca kāmaguṇā 5 -> năm dục lạc (13.4); pañcavīsati 5 + 20 = 25 -> hai mươi lăm (17.1, 17.2, 17.27; số mục đã đếm đủ 25: 17.3 có hai mục giận dữ và hằn học, 17.4-17.25 có 22 mục, 17.26 có 1 mục); ekamāsiko 1 -> một tháng tuổi (18.4); catutthaṁ 4 -> thiền thứ tư (18.5); dasatathāgatabala 10 -> mười Như Lai lực, catuvesārajja 4 -> bốn sự tự tin không sợ hãi, chaasādhāraṇañāṇa 6 -> sáu trí không chung, cuddasabuddhañāṇa 14 -> mười bốn trí của Phật, aṭṭhārasabuddhadhamma 18 -> mười tám pháp của Phật (2.6); dutiyo 2 -> `2.` ở 0.4 và thứ hai ở 19.1. Không có cụm số nào thuộc loại chưa phân xử được (không có `tiṁsakappasahassa`).

  DẤU LƯỢC: 15.4, 17.3 và 18.4 có `…pe…` -> mỗi khoá đúng một `…`; 15.5-15.11 (7 khoá) và 17.4-17.25 (22 khoá) có `…` trần ở Pāli -> `…` ở Việt (tổng 32 khoá có dấu lược, cân bằng Pāli từng khoá). Pāli không có `(…)` trần nào, bài không có khoá chỉ gồm `(…)`; Pāli không có khoá nào kết `….`.

  BẤT ĐỊNH ghi lại (không thêm vào thân kinh):
    1. 5.1: `viparītaṁ itthāgāraṁ` dịch `hậu cung trong cảnh đảo lộn` (Pāli không nói đảo lộn thế nào, bản dịch không thêm chi tiết); `vippaṭisārī` dịch `bứt rứt` thay cho nghĩa thường là hối hận vì Pāli nối ngay với `arati`; 0 tiền lệ trong mil. `mārakāyiko devaputto` dịch `thiên tử thuộc hội chúng của Māra`.
    2. 6.1: `ekamukhena āṇā pavattissati` dịch `mệnh lệnh sẽ được thi hành thống nhất` (nghĩa `ekamukha` là đồng một hướng; 0 tiền lệ); `pathavigatāni … ākāsaṭṭhāni` dịch `ở trên đất và ở trên không`; `Mārisa` dịch `Thưa ngài` theo dn21 (257 khoá có mārisa).
    3. 2.4: `padhāna` dịch `tinh tấn` và `pamāṇa` dịch `tầm vóc` (hiểu là kích thước thân; Pāli không nói rõ, cách đọc khác có thể rộng hơn); 0 tiền lệ.
    4. 2.6: `rūpe` dịch `sắc thân`; `chaasādhāraṇañāṇe` dịch `sáu trí không chung` (Pāli không nói không chung với ai, nên không thêm); `cuddasabuddhañāṇe` dịch `mười bốn trí của Phật` (0 tiền lệ); `catuvesārajje` dịch `bốn sự tự tin không sợ hãi` theo mn12:29.5 (mil5.5.3:4.2 dịch `bốn chỗ không sợ hãi`). Các bài khác không liệt kê tên từng nhóm trí nên không đối chiếu được.
    5. 10.4: `upādānakkhayaṁ patto` dịch sát chữ (`đã đạt đến sự đoạn tận chấp thủ`) dù lúc ấy Bồ-tát chưa giác ngộ; không giải thích thêm. Cách đọc khác là nói về sự vững chắc của quyết tâm; bản dịch không chọn.
    6. 11.1: `pātālamukha` dịch `miệng vực Pātāla` (thêm chữ `vực` cho dễ hiểu; 0 tiền lệ trên tầng); `anotattadahato` dịch `hồ Anotatta` (an7.66:6.3, thag6.10:2.2 giữ tên Anotatta).
    7. 15.6-15.12 và 15.14: `agarukulavāsiko` dịch `người sống trong gia đình không được coi trọng` (cũng có thể đọc là gia đình không có người đáng kính; 0 tiền lệ); `mahagghaso` dịch `háu ăn`; `ācārahīno` dịch `thiếu hạnh kiểm`; `kammahīno` dịch `thiếu việc làm` và `kammassāmī … kammaniketavā` dịch dựa trên nghĩa `việc làm`, không phải `nghiệp`, vì ngữ cảnh là sự nỗ lực làm việc; `payogahīno` dịch `thiếu nỗ lực` (`padhāna` dịch `tinh tấn` để hai từ Pāli thành hai từ Việt). Cả chuỗi 0 tiền lệ.
    8. 14.1: `sabbabhakkhena bhavitabbaṁ` dịch `ăn mọi thứ` (ja464:7.1 có `sabbabhakkhā` với nghĩa khác).
    9. 18.4: `ekamāsiko samāno` dịch sát chữ `khi mới một tháng tuổi` (không có trong công thức mn36:31.2 song song); `sirisayane` dịch `chiếc giường quý` (0 tiền lệ); `pitu sakkassa kammante` dịch `nơi làm việc của vua cha người Sakya` (mn36 dịch `phụ thân người Sākya … đang làm việc`); `jambucchāyā` dịch `cây jambu` (7 khoá tầng dùng jambu, 2 khoá dùng mận).
    10. 7.2/8.2/9.2: bộ ba `ubbijji saṁvijji saṁvegamāpajji` dịch `hoảng hốt, xao động, rúng động`; `saṁvijji` 0 tiền lệ riêng.
    11. 11.3 và 18.2: `chahi vassehi` dịch `chỉ sau sáu năm` (instrumental chỉ thời gian); `abhisamayajātiyaṁ` dịch `kiếp sống chứng ngộ`.
    12. 4.1 và 3.2: `mahābhinikkhamanaṁ nikkhanto` dịch `ra đi trong cuộc đại xuất ly`, `nekkhammamabhinikkhanto` dịch `ra đi xuất ly` (mil6.1.x không có công thức tương đương).

  KIỂM MÁY (không chạy cổng của kho vì không được phép trong lát này): khoá Việt = khoá Pāli, 94 = 94, thứ tự khớp; số dấu nháy kép “ ” và nháy đơn ‘ ’ khớp Pāli từng khoá, 94/94 khoá; NFC đạt; không khoá rỗng; không Pāli nguyên văn lọt sang Việt ngoài tiêu đề `:0.1` (cố ý) và tên riêng (Nāgasena, Māra, Gaṅgā, Pātāla, Gotama, Sineru, Anotatta); dấu lược cân bằng Pāli từng khoá. Còn phải chạy bốn lệnh sau và technical_integrity 9,6 là điểm tạm cho tới khi chúng đạt: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

