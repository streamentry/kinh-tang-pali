notes: |-
  Đợt 17, lát n182. Dịch từ Pāli root commit đã ghim; không tầng Anh upstream. Đã đọc hết 57 khoá
  Pāli trước khi viết, và so từng khoá với bài tha-ap đã dịch trùng nguyên văn.

  DÙNG LẠI NGUYÊN VĂN — 21/57 khoá trùng nguyên văn Pāli ở tha-ap/thi-ap/thag đã dịch, đo bằng
  script: `0.1`, `0.2`, `1.1` (tha-ap177), `1.3` (tha-ap470/466), `2.2` (tha-ap139), `3.3`
  (tha-ap79), `4.1` (tha-ap142/116/68), `5.4`/`9.4`, `6.1` (tha-ap262), `6.2` (tha-ap77:3.2),
  `9.3` (tha-ap28), `10.1`/`10.2`/`10.3`, `11.2` (tha-ap215/184), `11.4`, `13.1`–`13.4` (reuse
  nguyên văn tha-ap19:11.1–11.4). Bốn chỗ ngữ biến có chủ đích: `2.2` viết `thắng trí` thay vì
  `thắng tri` của tha-ap139 để khớp `13.3` trong cùng bài; `10.2`, `10.3` đổi `tôi` → `ta` cho
  nhất quán giọng; `11.4` viết hoa `Chuyển Luân Vương` + thêm `vị` theo tha-ap19:6.2 và tha-ap74.

  TIÊU ĐỀ — test `tests/unit/tha-ap-title.test.ts` bắt hai đầu. `:0.1` giữ `Therāpadāna` (332/341
  bài giữ Pāli). `:0.2` `Phẩm Sīhāsaniya` đúng nguyên văn tha-ap13/15/19/21. `:0.3` =
  `5. Bài Kệ Tuyên Ngợ Về Trưởng Lão Pilindavaccha`: số 5 đứng đầu khớp Pāli `5 Pilindavacchat-
  theraapadāna`; phe `Tuyên Ngợ` thắng 481 so 189 `Tuyên Ngôn`; `translationTitle` bằng đúng
  `:0.3`. `:14.1` theo công thức nhóm 407 (tha-ap19:12.1): `Tôi nghe như vầy: Tôn giả Trưởng lão
  ... đã nói những bài kệ này.` Colophon `:15.1` gương tha-ap19:13.1 (…, thứ năm.).

  SỐ — `Tiṁsakappasahassamhi` (`10.1`) dịch `Trong ba mươi ngàn kiếp,` và đây là PhÂN XỬ có chứng
  cứ trong kho, không phải phỏng đoán: mọi cụm cùng khuôn `X kappasahassamhi` đều nhân X × 1000
  — `Vīsa`(20) → `hai mươi ngàn` (tha-ap152:4.1) và `hai vạn` (tha-ap178:3.1); `Saṭṭhi`(60) →
  `sáu mươi nghìn` (tha-ap15:6.3, tha-ap191, tha-ap53, tha-ap54); `Satta`(7) → `bảy nghìn` và
  `Pañca`(5) → `năm nghìn` (tha-ap15). `tiṁsa` = 30 là số đếm Pāli (3 là `tīṇi`) ⇒ 30 × 1000 =
  30.000. Mục `Tiṁsakappasahassa` trong goal.md ghi hai ứng viên 3.000 và 300.000, cả hai đều
  dựng trên tiền đề `tiṁsa = 3` (sai) — ghi lại đây để người biên tập đóng bảng chờ; 6 tệp đang
  có `ba mươi ngàn` là đúng, `tha-ap151` (`ba nghìn`) và `tha-ap109` (`ba trăm nghìn`) mới là
  lệch.

  BẤT ĐỊNH ĐÃ GHI (ambiguity 8.7): (1) `6.3` `Visuddhabhojano` là biến thể DUY NHẤT trong toàn
  bộ Pāli đã ghim (1/1) — hiểu là biệt danh của vua Varuṇa (cùng cấu trúc tha-ap77:3.1–3.4),
  dịch `Thuần tịnh trong ăn uống,`; (2) `3.4` `anumodittha so tadā` — `so` bám đại từ tới
  `Sumedhassa bhagavato` ở `3.1` nên dịch `Ngài đã hoan hỷ thuở ấy.`; (3) `1.2` `sumedhe
  aggapuggale` 0 tiền lệ giữ nguyên → `ở nơi Sumedha bậc tối thượng loài người`; (4) `10.4`
  `gandhālepa` 0 tiền lệ Việt và không có bản Anh (đoạn này không có trong dn32) →
  `đó là quả của món dầu thơm.`; (5) `1.1` `lokanātha` → `Đấng Bảo Hộ Thế Gian` (5/9 biến thể,
  đúng nguyên văn tha-ap177).

  NHÁY: Pāli `“`=1 (mở ở `1.1`) `”`=1 (đóng ở `13.4`), không có nháy đơn; bản Việt cân đúng.
  Không có dấu lược nào trong bài.
