notes: |-
  Dịch trực tiếp từ Pāli root, đối chiếu tiền lệ cùng phẩm trong tầng Therāpadāna; đủ 68/68 khoá (67 khoá mới, khoá 17.1 giữ lại và chỉnh theo công thức đa số).
  - Tiêu đề :0.3: Pāli không bắt đầu bằng số thứ tự nên bỏ số thứ tự; translationTitle đồng nhất 100% với :0.3 ("Bài Kệ Tuyên Ngôn Về Trưởng Lão Pupphathūpiya"). Dạng "Tuyên Ngợ" bị coi là sai chính tả nên không dùng. Đo toàn tầng tha-ap: Tuyên Ngợ 234 (+10 "Tuyên Ngợi") · Tuyên Ngôn 97 · Ký Sự 96 · Kinh Kệ 5; ở phạm vi gần (tha-ap110–140): Tuyên Ngợ 13 · Tuyên Ngôn 8 · Ký Sự 4 · Kinh Kệ 4. Hai phạm vi cho cùng một đa số là dạng "Tuyên Ngợ"; bài này theo hướng dẫn sửa chính tả thành "Tuyên Ngôn", nên phân kỳ với đa số đã đo — cần người biên tập phán một lượt cho cả cuốn.
  - Khoá 17.1 (công thức "Itthaṁ sudaṁ … abhāsitthāti"): đổi "bài kệ này" thành "những bài kệ này" vì Pāli "imā gāthāyo" là số nhiều. Đo 446 khoá cùng công thức ngoài bài này: 441 dùng "những bài kệ này", 3 dùng "bài kệ này", 2 dạng khác; 444/446 mở bằng "Tôi nghe như vầy".
  - Số đếm Pāli, đã tự tính: Pañca sissasahassāni (2.1) = 5 × 1.000 = 5.000 đệ tử; asīti (3.3) = 80; bāttiṁsa (3.4) = 2 + 30 = 32; ekāhaṁ (8.1) = một ngày; Kappānaṁ satasahassaṁ (13.3) = 100 × 1.000 = 100.000 kiếp (tiền lệ: 16 khoá đều "một trăm ngàn/nghìn kiếp"); Cattālīsasahassamhi (14.1) = 40 × 1.000 = 40.000; soḷasa (14.2) = 16; Vīsakappasahassamhi (15.1) = 20 × 1.000 = 20.000 kiếp; aṭṭhattiṁsa (15.4) = 8 + 30 = 38; catasso (16.1) = 4. Không có cụm tiṁsakappasahassa ở bài này.
  - Pāli trùng nguyên văn trong bài: 2 cặp. 11.3 = 13.1 ("Pupphehi thūpaṁ katvāna,"), dịch giống hệt. 1.4 = 4.4 ("brāhmaṇo mantapāragū."): 1.4 là danh từ đồng vị ("một Bà-la-môn…", giữ đúng bản đã có ở snp5.1:1.4 và tha-ap54:1.4) còn 4.4 là chủ ngữ của mệnh đề sau ("vị Bà-la-môn…"), nên khác có chủ đích.
  - Thuật ngữ: manta → "thần chú" (snp5.1:1.4, tha-ap54:1.4, tha-ap326:1.2, snp3.11:12.2 đều dùng; "lời tụng" có ở tha-ap136·137·160); "Chắp tay cung kính" cho añjaliṁ paggahetvāna (tiền lệ cùng họ 8+ khoá); lokanātha → "Đấng Bảo Hộ Thế Gian" (tiền lệ 5 khoá) phân biệt với lokanāyako → "bậc Dẫn Đạo thế gian"; duggatiṁ nupapajjahaṁ → "tôi không còn rơi vào khổ xứ" (rơi 4 · đọa 5, theo bài liền kề).
  - BẤT ĐỊNH (không thêm vào thân kinh): (1) 3.2 "taṁ vijānātha no bhavaṁ" — động từ số nhiều (vijānātha) đi với bhavaṁ số ít và "no", chưa phân xử được; dịch "xin ngài hãy biết điều ấy" và coi 3.1–3.4 là lời các đệ tử (căn cứ 4.3 "Sissānaṁ vacanaṁ sutvā"). (2) 9.4 "paramabuddhino" — hiểu là tính từ sở hữu của buddhi ("bậc có trí tuệ tối thượng"); cũng có thể hiểu là "bậc Phật tối thượng". (3) 6.1 "namassissaṁ" có dạng tương lai nhưng đi với aorist "pūjesiṁ" ở 6.4; dịch theo quá khứ. (4) 10.2 "yathā dassāvino tathā" dịch sát "đúng như những người đã thấy"; không thêm tân ngữ. (5) 14.1–14.2 và 15.1: Pāli không có "ito", tiền lệ cùng dạng đều đặt "kiếp trước". (6) 8.4 "sālaṁ" dịch "một gian nhà", chưa có tiền lệ để xác định loại công trình.
  - Không có tầng tham khảo tiếng Anh: tại commit đã ghim, tầng english-sujato không có tệp nào cho tha-ap124 (manifest chỉ liệt kê tệp Pāli), vietnamese-current chỉ có 26 tệp Pháp Cú, english-project không có entry. Mẫu số coverage theo layers.yaml (Pāli ≥ 40 ký tự, bỏ khối :0) = 1 khoá (17.1); Sujato phủ 0/1. Ba tầng tham khảo đều vắng nên triangulation đặt 7.5 (≤ 8.0) và bài giữ draft với blocker noEnglishEditionUpstream; entry trong reference-gaps.yaml có sẵn không thay đổi điều này.
  - Phép kiểm tự viết, quét mọi khoá: tập khoá Việt = tập khoá Pāli (68/68, đúng thứ tự); nháy đơn và kép khớp Pāli từng khoá (2 nháy kép, ở 1.1 mở và 16.3 đóng; 0 nháy đơn); dấu lược khớp Pāli (…pe… ở 16.2 → một dấu …; 1/1 khoá, không có (…) trần); dấu cuối từng khoá khớp Pāli 68/68; NFC sạch; không có khoá rỗng hay khoảng trắng thừa; không Pāli lọt ngoài tên riêng.
  - Kỹ thuật: chưa chạy các cổng kỹ thuật trong lát này do quy định cấm chạy lệnh git/npm, technical_integrity đặt 9.6. Bốn lệnh cần chạy khi kiểm định: npm run validate · npm test · npm run check · npm run build.
