notes: |-
  Dịch từ Pāli root tại commit bilara đã ghim, đối chiếu trực tiếp với bản Anh của Bhikkhu Sujato tại cùng commit (đủ 30/31 khoá; dòng kết tên tác giác ở `6.5` Sujato không dịch — thông lệ mọi bài).
  Khung tiêu đề theo đa số thag6 đã merge: `0.2` Trưởng Lão Kệ Nhóm Sáu (8/9 tệp đã có trong kho kể cả 3 tệp của lát này), `0.3` Phẩm Thứ Nhất, `0.4` Kệ Ngôn Trưởng Lão + tên, dòng kết `… Trưởng lão + tên ….` với hai dấu lược.
  0 tiền lệ, đặt mới có lý do: `Mālukyaputta` giữ nguyên tên Pāli (Sujato viết Māluṅkyaputta) như `thag6.11` giữ Nhātakamuni; tôi theo chính tả Pāli root là authority.
  Tái dùng nguyên văn bản dịch đã có của ba câu kệ trùng Pāli với `dhp334-359`: `Taṇhā vaḍḍhati māluvā viya;` → thì tham ái tăng như dây leo; `Phalamicchaṁva vanasmi vānaro.` → như con vượn tham quả trong rừng; `Taṁ vo vadāmi bhaddaṁ vo,` → theo cùng cách dhp334-359 đã dịch Ta nói điều này với các ngươi.
  `bīraṇa` dịch cỏ bài (4 tiền lệ ở dn24); dhp334-359 dùng cỏ bi — tôi theo đa số kho.
  `Mā vo naḷaṁva sotova, māro bhañji punappunaṁ` dịc theo đúng cách dhp337:5-6 đã merge — dựng chủ `māro` lên pāda trước để câu đọc được; khác `dhp337` tôi dùng Đấng Chiến Thắng cho Māra như thag6.1, thay vì Ma như dhp.
  0 tiền lệ khác: `usīratthova bīraṇaṁ` → như người tìm gốc cỏ bài; `khaṇāti`/`khaṇo vo mā upaccagā` → thời khắc (không phải thời gian/khoảnh khắc khác); `khaṇātītā hi socanti` → ai để thời khắc trôi qua thì hối tiếc; `rajo` → bụi; `appamāda` → không phóng dật (tiền lệ an10.15 ghi trong notes của sn35.149); `salla` → mũi tên (tiền lệ an5.48, mn105).
  Bản Anh Sujato có dịch mở rộng `…` ở một số chỗ (ví dụ `6.3` dịch gộp cả With diligence and knowledge); tôi bám Pāli và giữ đúng số dấu lược theo từng khoá.
  Coverage: bài không có khoá Pāli nào dài ≥ 40 ký tự, nên không rơi vào ngưỡng coverage Anh — không cần ghi vào content/meta/reference-gaps.yaml.
  technical_integrity 9.6 vì agent lát này không chạy gate. Bốn lệnh gate do coordinator chạy trước khi publish: npm run validate, npm test, npm run check, npm run build.

  Quyết định hội đồng biên tập 2026-10-16: B1 — thag6.5:2.2 (`visattikā` bị dịch “bức hiếp” (lỗi rõ); dịch lại = sự vướng mắc ở đời).

  **Sửa ngày 2026-10-23** ở 2 segment (`thag6.5:4.5`, `thag6.5:4.6`): các lỗi nghĩa do lượt chấm
  `full` ngày 2026-10-23 phát hiện đã được dịch lại từ Pāli. Những ghi chú phía trên mô tả cách
  dịch cũ của các segment này (nếu có) không còn đúng với bản hiện tại; lý do từng chỗ sửa nằm
  trong ghi chú của lượt chấm mới nhất ở `content/meta/assessments/kn/thag6.5.json`.
