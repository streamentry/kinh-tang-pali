notes: |-
  Dịch từ Pāli root, đối chiếu tiền lệ cùng bộ: tầng English đã ghim không có thân kinh cho thi-ap11 (noEnglishEditionUpstream), nên không có bản Anh để đối chiếu độc lập.
  Số Pāli tự tính: catusaṭṭhi 4+60=64 (sáu mươi bốn vị thiên vương); tesaṭṭhi 3+60=63 (sáu mươi ba vị Chuyển Luân Vương, khớp thi-ap8:12.1); satasahassā 100.000 (một trăm ngàn tiên nữ); ekanavutito 1+90=91 (chín mươi mốt kiếp); sattavassa=7; aḍḍhamāsa=nửa tháng; paṭisambhidā catasso=4. Không có cụm Tiṁsakappasahassa trong bài; Tāvatiṁsa là tên cõi trời (Ba mươi ba), không phải số đếm cần tính.
  Tiền lệ: 34/86 khoá có Pāli trùng nguyên văn trong tầng kn đã dịch (các bài tha-ap, thi-ap, vv, pv, cp, mil), tổng 4.728 lần xuất hiện; 32/34 khoá dùng lại nguyên văn một bản đã có. Hai khoá khác bản đã có: 1.2 (Sát-đế-lợi thay vì Sát-đế-lị, vì Sát-đế-lợi là dạng đa số của tầng) và 13.2 (chỗ ngồi nằm, gần cách của hai tiền lệ nhưng không trùng chữ). 5 nhóm Pāli trùng ngay trong bài (14 khoá) đều có Việt giống hệt nhau; 0 cặp trùng trong bài mà Việt khác.
  Tiêu đề: translationTitle bằng đúng :0.3. Pāli :0.3 bắt đầu bằng số 1 nên :0.3 giữ số theo dạng N. (khớp thi-ap37/38/39/40 và quy tắc theo Pāli). Cụm Bài Kệ Tuyên Ngợ đo ở hai phạm vi: thi-ap đã dịch có Tuyên Ngợ 16, Tuyên Ngôn 1 (1 bài chưa có tiêu đề Việt); tha-ap có Tuyên Ngợ 240 (cộng 10 dạng Tuyên Ngợi), Tuyên Ngôn 120, Ký Sự 105. Cả hai phạm vi đều nghiêng về Tuyên Ngợ nên giữ cách này cho nhất quán với bài liền kề; vì Tuyên Ngợ có thể là chính tả sai của Tuyên Ngôn và còn bị tranh chấp ở tha-ap, đề nghị người biên tập phán một lượt cho cả cuốn. Tên phẩm Phẩm Ekūposathika theo ba tiền lệ thi-ap12, thi-ap13, thi-ap16.
  Ngôi thứ nhất: dùng tôi. Tiền lệ trong thi-ap chia ba (tôi trội ở 7 bài, con trội ở 7 bài, ta trội ở 3 bài), nên đây là lựa chọn có chủ đích theo ngôi trung tính cho người kể là nữ tỳ sau thành tỳ-kheo-ni, không phải đa số máy móc. Các khoá công thức cùng Pāli dùng dạng đã có: 17.1 và 19.1 (16 khoá tôi, 99 khoá ta), 20.1 (4 khoá tôi, 93 khoá ta), 18.3 (91 khoá tôi, 54 khoá ta); khác biệt giữa tôi, ta, con ở các bài khác là khác ngôi kể, không phải trôi dạt.
  Nháy: Pāli mở ngoặc kép ở 1.1 và đóng ở 21.3; nháy đơn mở ở 3.1 và đóng ở 3.4; bản Việt khớp Pāli từng khoá (0 khoá lệch trên 86).
  Dấu lược: ba khoá …pe… (19.2, 20.2, 21.2) giữ đúng một dấu …; không có (…) trần trong Pāli bài này.
  Công thức kết 22.1 dùng nhóm số nhiều: Tôi nghe như vầy: Tỳ-kheo-ni Ekūposathikā đã nói những bài kệ này.
  Bất định: (1) 6.2 ubbhayojanamuggataṁ dịch vươn cao lên một do-tuần; từ này chỉ xuất hiện một lần trong toàn tầng Pāli đã ghim, không có số đếm trong Pāli nên chữ một là suy từ yojana không kèm số, chưa phân xử được bằng chứng độc lập. (2) 4.2 duggaccañca daliddataṁ dịch cảnh khốn khó và sự nghèo túng; duggacca không có tiền lệ trong tầng, có thể là tình cảnh khổ sở hoặc nghĩa gần duggati. (3) 6.4 mahāsanasubhūsitaṁ dịch được trang hoàng bằng những chỗ ngồi lớn; mahāsana có thể là ngai lớn, giữ nghĩa đen. (4) 15.2 hammiya dịch dinh thự, và 15.1 kūṭāgāra dịch lầu gác theo tiền lệ tha-ap14 và tha-ap20, ngoài ra có bản dịch khác trong tầng (nhà nóc nhọn, nhà có mái). (5) 8.2 và 8.4 mahesittamakārayiṁ dịch tôi đã giữ ngôi hoàng hậu theo thi-ap10 (5.2, 5.4) và thi-ap8 (11.2, 12.2); cùng Pāli, thi-ap16 (4.2, 5.2) và thi-ap5 (4.2, 4.4) dịch tôi đã tôn vinh Đại Ẩn Sĩ, hai bài khác hẳn nghĩa nhau, và đây là chỗ phân kỳ trong tầng cần người biên tập phán. Giữ hoàng hậu vì bối cảnh là ngôi vị bên các vị vua, và thể sai khiến akārayiṁ (tôi đã cho lập) không được thể hiện. (6) 3.3-3.4 saphalaṁ nūna taṁ kammaṁ, janakāyo pamodito dịch theo hướng quả báu của việc làm ấy cùng đám đông đang hoan hỷ; quan hệ giữa hai vế không được nói rõ trong Pāli.
