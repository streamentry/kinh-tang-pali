notes: |-
  **Phạm vi: đủ 516/516 khoá của mnd1, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải kinh `snp4.1` (Kāmasutta, Kinh Dục), mở đầu phẩm Aṭṭhakavagga. Cấu trúc giống `mnd4`, `mnd5` và các bài Cūḷaniddesa: dẫn từng đoạn kệ, giải từng cụm, nhắc lại cả đoạn kệ. Sáu đoạn kệ của `snp4.1` được dẫn in đậm ở `2`, `13`, `22`, `37`, `46`, `74` và nhắc lại trong ngoặc kép ở `12`, `21`, `36`, `45`, `73`, `84`, mỗi lần mở đầu bằng *Vì thế, Đức Thế Tôn đã nói—*. Các đoạn dẫn phụ: kệ dục `6`; kệ bố thí `17`–`18`; kệ về nô lệ `40`; lời Phật về vị tỳ-kheo có đệ tử ở nhà `53`–`54`; ba cấu uế bên trong `56`–`62`; ba pháp sinh khởi nội tâm `64`–`65`; kệ tham sân `68`; lời Phật về Bà-la-môn đã vượt bờ `80`–`82`. Pāli có 102 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 65 khoá chứa dấu lược `…`: 14 khoá có `…pe…` (`23.5`, `23.6`, `24.2`, `25.1`, `42.6`, `56.5`, `64.5`, `71.8`, `75.11`, `76.3`, `76.4`, `76.11`, `76.13`, `77.4`, đều thành đúng một `…`), 50 khoá có `…` trần (`24.3`–`24.9`, `25.2`–`25.7`, `30.4`, `30.5`, `70.2`–`70.8`, `70.11`–`70.23`, `71.4`, `71.5`, `75.8`, `75.9`, `77.5`, `77.6`, `78.4`–`78.7`, `81.7`–`81.9`, `81.18`, `81.19`, mỗi khoá giữ đúng một dấu), 1 khoá có `(…)` là `47.2` (giữ nguyên `(…)` đúng vị trí, giữa chuỗi tính từ), 0 khoá kết `….`. Pāli có 40 khoá mang nháy kép `“”` và không khoá nào mang nháy đơn `‘’` hay ngoặc đơn khác; bản Việt khớp từng khoá. Dấu gạch dài cuối khoá khớp Pāli (68 khoá, 0 lệch).

  **Tên bài.** `0.1` Mahāniddesa → *Đại Tập Kể Lược*, `0.2` Aṭṭhakavagga → *Kể Lược Phẩm Tám Kệ*, `0.3` và `85.1` → *Kể Lược Kinh Dục, thứ nhất*, theo `mnd4:0.1`–`0.3`, `mnd5:0.1`–`0.3` và tên kinh `snp4.1:0.2` *Kinh Dục*. `1.1` *Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác.*: dạng này 13 khoá của tầng (`bv1:1.1`, `cnd1:0.4`, `cp1:1.1`, `ja1:1.1`, `mil1:1.1`, `tha-ap1:1.1` …); dạng *Đức Thế Tôn* ở câu mở đầu chỉ có 1 khoá (`kp1:1.1`).

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd1`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho mnd1–mnd16 và tệp tên `mnd-name` (tiêu đề mnd1 là *Exposition of the Discourse on Sensuality*). Lớp `english-project` không có `mnd1`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **168** khoá (170 nếu đếm cả thẻ); Sujato phủ 0/168, `english-project` 0/168, `vietnamese-current` 0/168. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.1` (bài kệ chứa đúng sáu đoạn kệ này) có trong tầng đã ghim nhưng là bản của **bài khác**, nên không tính là đối chiếu English của mnd1. Chứng cứ độc lập còn lại là các bản Việt đã dịch của `snp4.1`, `sn1.41`, `sn3.2`, `sn35.151`, `snp2.5`, `iti88`, `mn22`, `mn54`, `an5.76`, và công thức chú giải ở `cnd5`, `cnd6`, `cnd9`, `cnd10`, `cnd13`, `cnd16`, `cnd17`, `mnd4`, `mnd5`, `mnd12`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: 127 khoá, 1.150 cặp, trong đó 158 cặp có bản Việt khác về nội dung (bỏ dấu câu, chữ hoa/thường). Dò rộng hơn (bỏ dấu câu và chữ hoa/thường, Pāli từ 8 ký tự): 171 khoá, 1.411 cặp, 316 cặp khác, tập trung ở 70 khoá; bản Việt của mnd1 trùng với đa số tiền lệ (hoặc ngang đa số) ở 147/171 khoá và khớp ít nhất một tiền lệ ở 149/171 khoá. 24 khoá khác đa số, kèm lý do: `4.8` (dùng *Đây gọi là vật dục.* cho cùng nhóm với `7.1`: 10 khoá tầng dùng *đây gọi là phiền não dục.* so với 1 khoá dùng *Những dục này được gọi là*); `22.3`, `22.4`, `36.3` và `46.2`, `69.5`, `73.2` (xem bất định 2 và 3); `30.1` (*Ở đời:* vì đây là lời giải của `loke` chứ không phải của `loko`); `54.2`–`54.4` (đa số kết bằng `…`, nhưng ở đây Pāli không có `…`); `58.3`, `58.4`, `60.1`, `60.3`, `60.4`, `62.3` (xem bất định 5); `68.4` (dùng `snp2.5:6.4` thay vì `sn10.3:3.4` là dạng câu hỏi); `75.4` (đầu mục *Con người*, ghép với kệ, thay cho *Hữu tình* của `mnd12:113.5`); `77.5`, `77.6`, `78.6`, `78.7` (*triền cái*, 8 khoá của tầng cùng danh sách, so với 3 khoá *chướng ngại*, trong đó có `sn54.12`); `82.4` (*tái sinh* 8 khoá, *tái hữu* 2 khoá). Đã dò **44 nhóm Pāli trùng byte trong chính bài** (103 khoá): 0 nhóm có bản Việt khác. Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 59 nhóm, 0 nhóm khác về nội dung. Dùng lại gần nguyên văn: kệ `snp4.1` cho `2`, `13`, `22`, `37`, `46`, `74` và các câu nhắc lại (trừ chỗ nêu ở bất định 2 và 3); kệ `cnd5:54.1`–`54.4` cho `6`; kệ `sn1.41:4.3`–`5.4` cho `17`; kệ `iti88:3`–`4`, `6`–`7`, `9`–`10` cho `57`–`62`; `sn3.2:2` và `3` cho `64`–`65`; `snp2.5:6` cho `68`; `sn35.151:1.2`–`1.8`, `3.6` cho `53`–`54`; `cnd5:51`–`53`, `cnd5:61`–`64`, `cnd6:13.4`, `cnd17:13.1`–`13.2`, `mn111:21.2` cho các danh sách; `cnd5:13.2` cho danh sách tham ái `28.4` (bỏ bốn mục *mồi của Ma, nơi ở của Ma, nơi lui tới của Ma, xiềng xích của Ma* vì Pāli của `28.4` không có; 10