notes: |-
  **Phạm vi: đủ 516/516 khoá của mnd1, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải kinh `snp4.1` (Kāmasutta, Kinh Dục), mở đầu phẩm Aṭṭhakavagga. Cấu trúc giống `mnd4`, `mnd5` và các bài Cūḷaniddesa: dẫn từng đoạn kệ, giải từng cụm, nhắc lại cả đoạn kệ. Sáu đoạn kệ của `snp4.1` được dẫn in đậm ở `2`, `13`, `22`, `37`, `46`, `74` và nhắc lại trong ngoặc kép ở `12`, `21`, `36`, `45`, `73`, `84`, mỗi lần mở đầu bằng *Vì thế, Đức Thế Tôn đã nói—*. Các đoạn dẫn phụ: kệ dục `6`; kệ bố thí `17`–`18`; kệ về nô lệ `40`; lời Phật về vị tỳ-kheo có đệ tử ở nhà `53`–`54`; ba cấu uế bên trong `56`–`62`; ba pháp sinh khởi nội tâm `64`–`65`; kệ tham sân `68`; lời Phật về Bà-la-môn đã vượt bờ `80`–`82`. Pāli có 102 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 65 khoá chứa dấu lược `…`: 14 khoá có `…pe…` (`23.5`, `23.6`, `24.2`, `25.1`, `42.6`, `56.5`, `64.5`, `71.8`, `75.11`, `76.3`, `76.4`, `76.11`, `76.13`, `77.4`, đều thành đúng một `…`), 50 khoá có `…` trần (`24.3`–`24.9`, `25.2`–`25.7`, `30.4`, `30.5`, `70.2`–`70.8`, `70.11`–`70.23`, `71.4`, `71.5`, `75.8`, `75.9`, `77.5`, `77.6`, `78.4`–`78.7`, `81.7`–`81.9`, `81.18`, `81.19`, mỗi khoá giữ đúng một dấu), 1 khoá có `(…)` là `47.2` (giữ nguyên `(…)` đúng vị trí, giữa chuỗi tính từ), 0 khoá kết `….`. Pāli có 40 khoá mang nháy kép `“”` và không khoá nào mang nháy đơn `‘’` hay ngoặc đơn khác; bản Việt khớp từng khoá. Dấu gạch dài cuối khoá khớp Pāli (68 khoá, 0 lệch).

  **Tên bài.** `0.1` Mahāniddesa → *Đại Tập Kể Lược*, `0.2` Aṭṭhakavagga → *Kể Lược Phẩm Tám Kệ*, `0.3` và `85.1` → *Kể Lược Kinh Dục, thứ nhất*, theo `mnd4:0.1`–`0.3`, `mnd5:0.1`–`0.3` và tên kinh `snp4.1:0.2` *Kinh Dục*. `1.1` *Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác.*: dạng này 13 khoá của tầng (`bv1:1.1`, `cnd1:0.4`, `cp1:1.1`, `ja1:1.1`, `mil1:1.1`, `tha-ap1:1.1` …); dạng *Đức Thế Tôn* ở câu mở đầu chỉ có 1 khoá (`kp1:1.1`).

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd1`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho mnd1–mnd16 và tệp tên `mnd-name` (tiêu đề mnd1 là *Exposition of the Discourse on Sensuality*). Lớp `english-project` không có `mnd1`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **168** khoá (170 nếu đếm cả thẻ); Sujato phủ 0/168, `english-project` 0/168, `vietnamese-current` 0/168. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.1` (bài kệ chứa đúng sáu đoạn kệ này) có trong tầng đã ghim nhưng là bản của **bài khác**, nên không tính là đối chiếu English của mnd1. Chứng cứ độc lập còn lại là các bản Việt đã dịch của `snp4.1`, `sn1.41`, `sn3.2`, `sn35.151`, `snp2.5`, `iti88`, `mn22`, `mn54`, `an5.76`, và công thức chú giải ở `cnd5`, `cnd6`, `cnd9`, `cnd10`, `cnd13`, `cnd16`, `cnd17`, `mnd4`, `mnd5`, `mnd12`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: 127 khoá, 1.150 cặp, trong đó 158 cặp có bản Việt khác về nội dung (bỏ dấu câu, chữ hoa/thường). Dò rộng hơn (bỏ dấu câu và chữ hoa/thường, Pāli từ 8 ký tự): 171 khoá, 1.411 cặp, 316 cặp khác, tập trung ở 70 khoá; bản Việt của mnd1 trùng với đa số tiền lệ (hoặc ngang đa số) ở 147/171 khoá và khớp ít nhất một tiền lệ ở 149/171 khoá. 24 khoá khác đa số, kèm lý do: `4.8` (dùng *Đây gọi là vật dục.* cho cùng nhóm với `7.1`: 10 khoá tầng dùng *đây gọi là phiền não dục.* so với 1 khoá dùng *Những dục này được gọi là*); `22.3`, `22.4`, `36.3` và `46.2`, `69.5`, `73.2` (xem bất định 2 và 3); `30.1` (*Ở đời:* vì đây là lời giải của `loke` chứ không phải của `loko`); `54.2`–`54.4` (đa số kết bằng `…`, nhưng ở đây Pāli không có `…`); `58.3`, `58.4`, `60.1`, `60.3`, `60.4`, `62.3` (xem bất định 5); `68.4` (dùng `snp2.5:6.4` thay vì `sn10.3:3.4` là dạng câu hỏi); `75.4` (đầu mục *Con người*, ghép với kệ, thay cho *Hữu tình* của `mnd12:113.5`); `77.5`, `77.6`, `78.6`, `78.7` (*triền cái*, 8 khoá của tầng cùng danh sách, so với 3 khoá *chướng ngại*, trong đó có `sn54.12`); `82.4` (*tái sinh* 8 khoá, *tái hữu* 2 khoá). Đã dò **44 nhóm Pāli trùng byte trong chính bài** (103 khoá): 0 nhóm có bản Việt khác. Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 59 nhóm, 0 nhóm khác về nội dung. Dùng lại gần nguyên văn: kệ `snp4.1` cho `2`, `13`, `22`, `37`, `46`, `74` và các câu nhắc lại (trừ chỗ nêu ở bất định 2 và 3); kệ `cnd5:54.1`–`54.4` cho `6`; kệ `sn1.41:4.3`–`5.4` cho `17`; kệ `iti88:3`–`4`, `6`–`7`, `9`–`10` cho `57`–`62`; `sn3.2:2` và `3` cho `64`–`65`; `snp2.5:6` cho `68`; `sn35.151:1.2`–`1.8`, `3.6` cho `53`–`54`; `cnd5:51`–`53`, `cnd5:61`–`64`, `cnd6:13.4`, `cnd17:13.1`–`13.2`, `mn111:21.2` cho các danh sách; `cnd5:13.2` cho danh sách tham ái `28.4` (bỏ bốn mục *mồi của Ma, nơi ở của Ma, nơi lui tới của Ma, xiềng xích của Ma* vì Pāli của `28.4` không có; 101 mục sau khi ghép *sự tham đắm của tâm* và *Cái nào là tham*).

  **Thuật ngữ, kèm số đếm.** `visattikā` → *sự đắm say* (32 khoá tầng so với 16 khoá *sự dính mắc* và 1 khoá *dính mắc*; `cnd9:47.1`, `cnd12:13.1`); `parissaya` → *hiểm nguy* (12 khoá tầng so với 2 khoá *tai họa* ở `snp4.1:5.2`, `ne4:11.2`); `vatthukāmā, kilesakāmā` → *vật dục, phiền não dục* (`cnd5:51`–`55`, `cnd6:11`); `kāma` ở lời giải → *dục*, còn ở dòng kệ giữ *dục lạc* theo `snp4.1` (xem bất định 12); `ime vuccanti` → *đây gọi là* (10 khoá tầng so với 1); `kāmayamāna` → *đang khao khát*; `icchati, sādiyati, pattheti, piheti, abhijappati` → *mong muốn, chấp nhận, ước muốn, thèm khát, thầm cầu* (`cnd13:15.31`, `cnd13:21.5`, `cnd7:31.2`; *thèm khát* cho `piheti` để khỏi trùng *khao khát* của `kāmayamāna`; `cnd13:21.5` dùng *khao khát* cho `piheti`); `pīti` → *hỷ*, `pītimano` → *hoan hỷ trong tâm* (`snp4.1:1.3`); `mano` → *ý* theo `cnd5:56.2`; `sata, sato` → *chánh niệm* (`cnd5:61`–`64`); `jantu` → *con người* (dòng kệ `snp4.1:6.1`) và danh sách *hữu tình, nam nhân, thanh niên, đàn ông, cá nhân, sinh mạng, jāgu, sinh vật, indagu* cùng `manujo` → *loài người* (`mnd12:113.5`, `cnd16:20.2` dùng *con người* cho `manujo`; `mnd4:38.5` dùng *loài người*); `nīvaraṇa` → *triền cái* (8 khoá so với 3 khoá *chướng ngại*), `byāpāda` → *sân hận*, `thinamiddha` → *hôn trầm và buồn ngủ*, `uddhaccakukkucca` → *xao động và hối tiếc* (`dn13:30.3`, `dn33:2.1.19`); `upadhi` → *sanh y* (`mnd5:52.3`); `anveti anugacchati anvāyikaṁ hoti` → *theo đuổi, đi theo, bám theo* (`snp4.1:5.3` cho `anveti`); `dukkha` các loại và danh sách bệnh theo `cnd5:14.2`; `ruppati, kuppati, ghaṭṭīyati, pīḷīyati` → *đau đớn* (`snp4.1:2.4`), *bực dọc*, *bị chạm đau*, *bị bức bách* (0 tiền lệ cho ba từ sau); `vipariṇāmaññathābhāvā` → *biến hoại, đổi khác* (`dn1:3.21.5`); `tāṇa, leṇa, saraṇa, abhaya, accuta, amata` → *chốn che chở, nơi nương náu, nơi nương tựa, trạng thái không sợ hãi, trạng thái không biến hoại, bất tử* (`mnd4:3.3`); `ukkhittapaligho … pannabhāro visaññutto` theo `mn22:30.1`; `pañcaṅgavippahīno … anāvilasaṅkappo` theo `dn33:3.3.51`; `kevalī vusitavā uttamapuriso` theo `iti97:2.1`; `abhiññāpāragū …` theo `cnd17:13`; `vasippatto pāramippatto` theo `mn111:21.2`; `hiribala, ottappabala` → *lực hổ thẹn, lực kính sợ* (`ps2.9:2.2`); `atammayatā` → *tính không bị tác thành* (`mn113:21.7`); các phép so sánh dục (`23.11`–`23.21`) theo `mn22:3`, `mn54:15`–`21`: *bộ xương, miếng thịt, bó đuốc cỏ, hố than hồng, giấc mộng, vật mượn, trái cây trên cây, dao và thớt, gươm giáo, đầu rắn, khối lửa*; Sát-đế-lợi, Bà-la-môn, Phệ-sa, Thủ-đà theo `mn93:18.63`.

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `dve kāmā` 2 → *hai loại dục* (`3.1`, `23.4`, `76.2`) rồi 2 mục (`3.2`, `23.5`); `dvīhi kāraṇehi` 2 → *hai lý do* (`23.8`, `76.6`) rồi 2 mục (`23.9`, `76.7`, 2/2); `catūhi kāraṇehi` 4 → *bốn lý do* (`30.2`, `31.1`, `32.1`, `33.1`, `75.6`) rồi 4 mục (`30.3`–`30.6`, `31.2`, `32.2`, `33.2`: 4/4 từng khoá); mười tùy niệm (`24.1`–`24.10`, `33.3`: 10/10); thiền (`25.1`–`25.8`: 4 thiền + 4 vô sắc = 8/8); bốn đạo (`26.2`–`26.5`: 4/4); mười một phép so sánh (`23.11`–`23.21`: 11/11); mười một tên gọi của rắn (`27.4`–`27.14`: 11/11); chín từ nguyên của `visattikā` (`29.3`–`29.11`: 9/9); `cattāro dāsā` 4 → *bốn hạng nô lệ* (`39.4`) rồi 4 mục (`39.5`: 4/4); `tayo purisā` 3 → *ba hạng người* (`41.1`) rồi 3 mục (`41.2`: 3/3); `cattāro bandhū` 4 → *bốn loại thân quyến* (`42.3`) rồi 4 mục (`42.4`: 4/4); `dve parissayā` 2 → *hai loại hiểm nguy* (`48.2`) rồi 2 mục (`48.3`: 2/2); ba từ nguyên của `parissaya` (`50.2`: 3/3); bốn thí dụ nơi ở của loài vật (`51.3`–`51.6`: 4/4); `tayome … antarāmalā` 3 → *ba cấu uế bên trong* (`56.1`, `56.7`) rồi 3 mục (`56.4`–`56.6`: 3/3); `tayo … dhammā` 3 → *ba pháp* (`64.2`, `64.7`) rồi 3 mục (`64.4`–`64.6`: 3/3); `catunnaṁ satipaṭṭhānānaṁ` → *bốn niệm xứ*, `catunnaṁ sammappadhānānaṁ` → *bốn chánh cần*, `catunnaṁ iddhipādānaṁ` → *bốn thần túc*, `pañcannaṁ indriyānaṁ` → *năm căn*, `pañcannaṁ balānaṁ` → *năm lực*, `sattannaṁ bojjhaṅgānaṁ` → *bảy giác chi*, `aṭṭhaṅgikassa maggassa` → *Thánh đạo tám chi* (`50.12`–`50.15`); `catunnaṁ ariyamaggānaṁ` → *bốn Thánh đạo* (`80.3`); bốn dòng lũ (`77.7`: 4/4); `catuvokārabhave` → *hữu bốn uẩn* (`29.12`); `pañcaṅgavippahīno` → *đã đoạn trừ năm chi*, `chaḷaṅgasamannāgato` → *đầy đủ sáu chi*, `ekārakkho` → *có một sự phòng hộ*, `caturāpasseno` → *có bốn chỗ dựa* (`81.1`); 12 cặp `pāraṅgato … nibbānappatto` (`80.5`: 12/12); 6 cặp `pāragū` (`80.2`, `80.3`: 6/6); 12 mục ở `5.4` và `15.2` (12/12); 8 mục `9.2` (8/8); 11 mục `9.4` (11/11); 8 mục `9.6` (8/8); 8 mục `9.7` (8/8); 8 hạng người `8.2`, `14.2` (8/8); 7 loại xe `14.5` (7/7); 5 loại mũi tên `19.2` (5/5); 7 loại ruộng `38.2` (7/7), 6 loại nền `38.3` (6/6); 11 loài thú `48.5` (11/11); 49 mục bệnh và xúc chạm `48.7`, `70.13` (9 + 5 + 5 + 5 + 6 + 4 + 8 + 6 + 1 = 49/49); 31 mục ở `49.2` (3 + 5 + 9 + 8 + 6 = 31/31); 27 mục thời gian ở `75.5` (27/27); 101 mục ở `28.4`. **`16.4` `aniccatāyeva aṭṭhamī`**: Pāli liệt kê chín mục (vua, trộm cướp, lửa, nước, người thừa kế không ưa, của cất giấu, việc làm ăn đổ vỡ, kẻ phá hoại dòng tộc, vô thường) nhưng gọi vô thường là *thứ tám* (`sn42.9:4.8` chỉ có tám mục, không có *người thừa kế không ưa*); giữ đúng chữ *thứ tám*, không sửa. Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi` làm số; `koṭigato` ở `80.5` là *chỗ tột cùng*, không phải số; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `9.2` `addhā`: tám cách nói, trong đó `niyogavacana` → *quyết định*, `apaṇṇakavacana` → *không sai lệch*, `avatthāpanavacana` → *không thể lay chuyển*, `adveḷhaka` → *không phân vân*: 0 tiền lệ cho cả chuỗi, nghĩa chưa phân xử được.
  2. `22.3`–`22.4`, `28.1`, `34.1`, `34.3`, `36.3`–`36.4` `somaṁ visattikaṁ loke, sato samativattati`: đọc `somaṁ` = `so imaṁ` (khớp lời giải `28.2` *So ti yo kāme parivajjeti* và `34.2` *taṁ visattikaṁ sato tarati …*), nên dịch *người ấy, sự đắm say này ở đời, với chánh niệm mà vượt qua*. `snp4.1:3.3`–`3.4` và `thag6.14:5.3`–`5.4` ghi *với sự dính mắc trong cõi đời, người ấy với chánh niệm vượt qua*, không có tân ngữ cho `samativattati`; `ne4:7.3`–`7.4`, `ne15:42.3`–`42.4`, `ne15:49.3` đã có cấu trúc đúng với *sự dính mắc này trong cõi đời*. Không sửa ngoài lát, báo để người biên tập quyết.
  3. `46.2`, `69.3`, `69.5`, `73.2` `parissayā` → *hiểm nguy* để khớp 12 khoá của tầng và lời giải `48`–`51`, trong khi `snp4.1:5.2` và `ne4:11.2` ghi *các tai họa*; các dòng kệ còn lại của `46` và `73` dùng lại nguyên văn `snp4.1:5`. Không sửa ngoài lát.
  4. `29.3`–`29.11` các từ nguyên của `visattikā`: `visatā` → *thấm khắp*, `visālā` → *rộng lớn*, `visaṭā` → *lan tràn*, `visakkati` → *bám dính*, `visaṁharati` → *lôi cuốn đi mọi hướng*, `visaṁvādikā` → *lừa dối*, `visamūlā` → *có gốc độc*, `visaphalā` → *có quả độc*, `visaparibhoga` → *sự thọ dụng độc*: chỉ `visaṭā vitthatā` có tiền lệ (`cnd9:47.3`, `cnd12:13.3`, `cnd12:25.3` đều nén bằng `…`); nghĩa của `visakkati` và `visaṁharati` chưa phân xử được, và trò chơi chữ Pāli không thể giữ nguyên trong tiếng Việt. Tên rắn ở `27.2`–`27.14` (*sappo, bhujago, urago, pannago, sarīsapo, bilāsayo, guhāsayo, dāṭhāvudho, ghoraviso, dvijivho, dvirasaññū*) giữ nguyên dạng Pāli vì lời giải chính là từ nguyên của từng tên; `sirena supatīti sarīsapo` dịch sát chữ *vì ngủ bằng đầu*, chưa chắc ý nghĩa từ nguyên.
  5. `58.3`–`58.4`, `60.3`–`60.4`, `62.3`–`62.4` `andhantamaṁ tadā hoti, yaṁ lobho sahate naraṁ`: dịch đúng thứ tự dòng Pāli (*bấy giờ là bóng tối mù mịt, khi tham chế ngự người ấy*), trong khi `iti88:4.3`–`4.4` đảo hai dòng (*khi tham chế ngự người ấy, chỉ còn tối tăm mù mịt*); cũng vì vậy `58.4`, `60.4`, `62.4` khác `iti88`. `60.1`–`60.2` `kuddho` → *người đang giận* theo `an7.64:13.1`, không phải *người sân* của `iti88:7.1`.
  6. `33.2` `sattattā sato`: dịch *vì là bậc chân thật*; `cnd5:64.2` ghi `satiyā samannāgatattā sato` ở chỗ tương ứng, nên chưa xác định được `sattattā` là chữ gốc hay biến thể.
  7. `71.2` `dakamesiṁ`: không phân xử được hình thái; dịch *chiếc thuyền vỡ mà nước tìm vào* và giữ phần còn lại của câu.
  8. `81.14` `aparigamanatāya` → *không còn xoay vòng*, `81.15` `kaṭaṁ samādāya` → *nắm lấy ván thắng*, `81.24` `santussitattā` → *mãn nguyện*, `81.22` `atammayatā` → *tính không bị tác thành* (theo `mn113:21.7`), `80.6` `gataddho gatadiso gatakoṭiko paṭividdhākuppo` → *đã đi hết con đường dài, đã đi đến phương hướng cần đến, đã đến điểm cuối cùng, đã thấu triệt điều bất động*: 0 tiền lệ cho các cụm này, nghĩa chưa phân xử được. `81.11` `saccaṁ sampaṭipādiyitvā` → *thực hành trọn vẹn chân lý*, `81.13` `kilesaggiṁ pariyādiyitvā` → *làm cạn lửa phiền não*: 0 tiền lệ.
  9. `39.3` `assā ti pasukādayo vuccanti` → *Ngựa: nói đến gia súc và các loài tương tự* (không khớp trực tiếp với `assā`), `40.1` `āmāya` → *sinh ra trong nhà*, `41.2` `bhatakā, kammakarā, upajīvino` → *người làm thuê, người làm công, người sống nương nhờ*, `42.2` `itthipariggaho` → *những phụ nữ được sở hữu*, `38.3` các loại `vatthu` → *nền nhà ở, nền nhà kho, nền phía trước, nền phía sau, nền vườn, nền tịnh xá*: 0 tiền lệ.
  10. `3.5` `khettaṁ vatthu hiraññaṁ suvaṇṇaṁ` → *ruộng, đất, tiền bạc, vàng* (theo `cnd5:51.5`), trong khi dòng kệ `37.1` `vatthuṁ` → *nhà cửa* (theo `snp4.1:4.1`) và `38.3` giải `vatthu` thành các loại nền đất; hai cách dịch cùng một chữ.
  11. `53.3`, `54.5` `tyassa anto vasanti anvāsavanti pāpakā akusalā dhammā`: *chúng cư trú bên trong vị ấy, chảy tràn vào bên trong vị ấy: đó là các pháp ác bất thiện*; `sarasaṅkappā saṁyojaniyā` → *những hồi ức và ý định có tính trói buộc*: `sn35.151:1.5`–`1.6` dịch khác (*những tưởng và ý nghĩ trói buộc vào*), `anvāsavanti` không có tiền lệ.
  12. Dòng kệ giữ *dục lạc* cho `kāma` (theo `snp4.1`), còn lời giải dùng *dục* (theo `cnd5`, `cnd6`, `cnd10`); `cnd20:14.2` dùng *dục lạc* cho `kāmaguṇa`. Chưa thống nhất, để người biên tập quyết.
  13. `9.4` `pīti pāmujjaṁ āmodanā pamodanā hāso pahāso vitti tuṭṭhi odagyaṁ attamanatā abhipharaṇatā cittassa` → *hỷ, vui mừng, hân hoan, rất hân hoan, vui cười, cười lớn, phấn khởi, hài lòng, hớn hở, tâm thỏa ý, sự lan tỏa của tâm*, và `9.7` tám trạng thái tâm: 0 tiền lệ cho cả chuỗi.
  14. `17.1` dùng lại nguyên văn `sn1.41:4.3` *kẻ trộm trộm đoạt, vua chúa chiếm đoạt* (tiền lệ duy nhất; câu hơi lặp chữ nhưng đúng Pāli).
  15. Lỗi ngoài lát, báo chứ không sửa: `snp4.1:3.3`–`3.4`, `snp4.1:5.2`, `ne4:11.2`, `thag6.14:5.3`–`5.4` (bất định 2 và 3).

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (516/516, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` và ngoặc đơn khớp Pāli từng khoá (0/516 lệch); dấu lược `…` khớp Pāli từng khoá (0/516 lệch; 65 khoá có `…`: 14 khoá có `…pe…`, 50 khoá có `…` trần, 1 khoá có `(…)`; không khoá Pāli nào kết `….`); dấu gạch dài cuối khoá khớp Pāli (0 lệch); 0 khoá rỗng; NFC; không khoảng trắng thừa; không nháy thẳng; Pāli lọt sang Việt: không còn từ có dấu Pāli ngoài các tên riêng và từ nguyên giữ dạng Pāli (*jāgu, indagu, sāli, vīhi, kahāpaṇa* và các tên rắn nêu ở bất định 4).

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 144 khoá chênh lệch lớn nhất (trên 516 khoá) → khác nghĩa 11: sửa 1 nhóm, giữ 5, bất định 5. Sửa (accuracy fix, 6 khoá `13.1`, `13.3`, `14.1`, `14.7`, `21.1`, `21.3`, cùng một kệ `tassa ce kāmayānassa … te kāmā parihāyanti`): “Nhưng với kẻ đang khao khát ấy … khi những dục lạc ấy tiêu giảm” → “Nhưng nếu, đối với kẻ đang khao khát ấy … những dục lạc ấy tiêu giảm”, vì `ce` là “nếu” (điều kiện) chứ không phải “khi”; khớp `2.2`/`8.6` (*nếu điều ấy thành tựu*) và lời giải `14.2` (*Nếu của người ấy*), và `16.1` đã dịch `te kāmā parihāyanti` không có “khi”. Giữ 5: `13.1`/`14.1` `kāmayānassa` (bản mù đọc *kāma-yāna* “đi theo dục”; lời giải `14.3`–`14.4` đã nêu cả hai cách đọc, nên giữ “đang khao khát”); `81.2` `apacinitvā` (“làm giảm bớt” hay “phá bỏ” chỉ khác diễn đạt); `81.5` `vidhūpeti`/`sandhūpeti` (khác diễn đạt); `81.15` `kaṭaṁ` (“ván thắng”; bản mù không chắc); `65.3`–`65.4` `hiṁsanti`, `samphala` (cùng nghĩa, khác diễn đạt). Bất định 5, ghi lại không sửa: `71.2` `dakamesiṁ` (chủ thể “tìm” là chiếc thuyền hay nước); `33.2` `sattattā`; `29.6` `visakkati` (“bám dính” hay “chạy ngược xuôi”); `81.22` `atammayatā` (“không bị tác thành” hay “không tự đồng hóa”); `28.4` `pariyuṭṭhānaṁ` dịch “hiển hiện” theo quy ước của hàng chục khoá Niddesa/Netti/Peṭakopadesa, trong khi các Nikāya dịch “ám ảnh”/“chi phối” (bản mù: “triền phược”). Không có bản Anh hay bản Việt độc lập khác nên `triangulation` chỉ 7,8. Ngoài lát, báo chứ không sửa: `snp4.1:2.1`, `ne4:5.1`, `ne15:41.1`, `pe1:69.3` còn “Nhưng với kẻ đang khao khát ấy … khi …” cho cùng kệ.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng đủ 516 khoá Pāli↔Việt, đoạn song song cnd5:13.2, cnd6:11/13, cnd12:13/22, cnd23:97–98, mnd16:83–90, iti88, sn35.151, sn3.2:2, snp4.1:1–4, snp2.5:6, sn10.3): sửa 0 khoá.
  Không có bản Việt nguyên bài độc lập cho mnd1, không có bản Anh; chỉ Pāli và đoạn song song.
  Kiểm lại có hệ thống: chủ thể/phủ định/điều kiện (`ce` = nếu), số đếm (2/4/10/8/11/9 mục khớp), 17.x, 23.x, 26.x, 47.x–51.x, 53–54, 56–68, 70–71, 77–82. Các đoạn dài (28.4, 48.7, 49.2, 75.5, 78.10) trùng nguyên văn tiền lệ đã published cnd5/cnd6/cnd23/mnd16, không lệch Pāli.
  Giữ: «vì người phàm đã đạt được…» (2.4, 10.1, 10.4, 12.4) theo snp4.1:1.4 đã published; «thanh niên du đãng» (48.6) và «sanh y» (78.10) theo tiền lệ cnd; `pariyuṭṭhāna` = «hiển hiện» (28.4) theo quy ước Niddesa/Netti.
  Không sửa (chéo, chờ người biên tập): `somaṁ visattikaṁ`/`tare loke visattikaṁ` (22.3–22.4, 28.1, 34, 36); `oḷārike`/`anusahagate` ở 26.3–26.4 («thô thiển», «vi tế»).
  Bất định: như đã ghi (9.2, 29.x, 33.2, 71.2, 81.x); không có bằng chứng mới nên giữ nguyên điểm.

  Quyết định hội đồng biên tập 2026-10-16: B1 — 20 khoá (`22.3` … `36.3`) (`visattikā` = “sự vướng mắc ở đời”; `tare` = “có thể vượt qua”); B3 — `50.12` (`iddhipāda` = “như ý túc”).

  Nghiên cứu nguồn ngoài 2026-10-16: bản Việt song ngữ Pāli–Việt của Tỳ khưu Indacanda,
  Mahāniddesapāḷi - Đại Diễn Giải (Tam Tạng Song Ngữ Pāli–Việt, Sri Lanka 2018),
  https://tamtangpaliviet.net/TTPV/35_Nidd_I.pdf (Đại Diễn Giải, tập 35); đã tải toàn văn và đối chiếu
  phần tương ứng; nguồn độc lập với dự án, giấy phép không khai (NOASSERTION), chỉ dùng làm bằng chứng
  nghĩa, không chép. Đã đối chiếu: căn chỉnh theo đoạn 85 nhóm đoạn của bài với Indacanda (61 nhóm
  khớp từ vựng và không lệch phủ định hay số đếm, 7 nhóm trùng chữ với nhóm đã so ở bài khác, 17 nhóm
  bị cờ; đã đọc thủ công toàn bộ nhóm bị cờ); đọc từng nhóm kệ trích (6 nhóm) cạnh Indacanda và
  Sujato; so 46 mục từ đầu đoạn với mục từ của Indacanda; kệ trích còn so với Sujato snp4.1 (65 khoá
  có Pāli trùng chữ với kho `snp`, 53 khoá có Việt trùng chữ, 12 khoá khác, đã xem mẫu: phần lớn do
  ngắt dòng, chấm câu hoặc do Niddesa tự đọc kệ khác Sujato). Phần lời giải Niddesa chỉ có Indacanda
  làm nguồn độc lập (Sujato không có bài này); phần kệ trích có thêm Sujato. Sửa: không có khoá nào.
  Bất định/ghi nhận: 81.1 `niraggaḷo` dịch «không còn bị ngăn trở» theo mn22:30.1, còn Indacanda
  «không còn chốt cửa» và an5.71–72 «không có then cửa» (ghi nhận, không đổi); 22.3 `somaṁ` đọc `so
  imaṁ` khớp Indacanda; 9.2 `addhā` giữ.

  Rà từng chữ bằng DPD 2026-10-16: 516 khoá đã rà; sửa: không khoá nào (đã kiểm riêng phủ định, hô cách `kāma` ở `6.1`–`6.4`, các động từ khả năng cách `vajjeyya`, `parivajjeyya`, `tareyya`, `gaccheyya`, người nói trong các đoạn dẫn `53`–`56`, `64`, `80`–`82`); giữ `74.4`, `78.1`, `83.1`, `84.4` (`nāvaṁ sitvāva`: DPD `sitvā` là danh động từ của `siñcati`, người tát thuyền như lời giải `78.2`, nhưng Sujato `snp4.1:6.4` cũng lấy thuyền đã tát làm hình ảnh), `46.1` (`balīyanti` hiện tại dịch «sẽ» là hệ quả của điều kiện `37.4`), `71.2` (`dakamesiṁ`: att1 'udakappavesaniṃ' cùng chiều bản Việt); bất định `9.2` (`avatthāpanavacana` «không thể lay chuyển»: att1 'santiṭṭhāpanaṃ ṭhapanaṃ' là xác lập, không phải a- phủ định; `ps1.4:65.8` «xác quyết»; công thức chung nhiều bài), `33.2` (`sattattā`: att1 'sattabhāvena vā … sattibhāvena vā', không phải «chân thật»), `29.6`, `29.7` (`visakkati`, `visaṁharati`: att1 'parisappati sahati vā', '… cittaṃ saṃharati saṅkhipati'), `81.4` (`na ussineti` «không chất chồng»: att1 'mānavasena na ukkaṃsati'), `74.3`, `77.1`, `77.7`, `77.8`, `84.3` (`tare`/`tareyya` «hãy/nên vượt qua» trong khi hội đồng B1 ghi `tare` = «có thể vượt qua» nhưng chỉ áp cho các khoá `visattikā`), `29.12` (`diṭṭhasutamutaviññātabba` chờ người biên tập), `28.4` (`vevicchaṁ`), `48.7`, `70.13` (tên bệnh `kilāsa`, `daddu`).
