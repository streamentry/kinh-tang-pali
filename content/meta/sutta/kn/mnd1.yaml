  Thống nhất cấp kho 2026-10-17 (lời phê vietnamese_clarity/terminology của mnd14, mnd16): (`53.1`, `53.2`, `53.4`, `53.7`, `54.6`, `54.9`, `54.10`) lời Phật trích từ sn35.151 (santevāsiko/sāntevāsiko sācariyako): «có đệ tử ở nhà, có giáo sư» → «có đệ tử nội trú, có thầy». Căn cứ: antevāsika DPD «apprentice; student; lit. who lives with», Sujato «resident pupil», HT. Thích Minh Châu «đệ tử nội trú»; «nội trú» giữ lối chơi chữ với anto vasanti «cư trú bên trong», còn «đệ tử ở nhà» dễ hiểu thành đệ tử tại gia; ācariya là «thầy» (DPD sācariyaka «together with one's teacher», Sujato «teaching master»; kho đã dùng «không có thầy» cho anācariyako), «giáo sư» là chức danh hiện đại. Thêm «thì» trước «sống trong khổ/sống an lành» để «có thầy» không bị đọc thành chủ ngữ của «sống». Đồng bộ sn35.151, mnd1, mnd14, mnd16, cnd23.
