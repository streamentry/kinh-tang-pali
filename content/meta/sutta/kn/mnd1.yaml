  **Thuật ngữ, kèm số đếm.** `visattikā` → *sự đắm say* (32 khoá tầng so với 16 khoá *sự dính mắc* và 1 khoá *dính mắc*; `cnd9:47.1`, `cnd12:13.1`); `parissaya` → *hiểm nguy* (12 khoá tầng so với 2 khoá *tai họa* ở `snp4.1:5.2`, `ne4:11.2`); `vatthukāmā, kilesakāmā` → *vật dục, phiền não dục* (`cnd5:51`–`55`, `cnd6:11`); `kāma` ở lời giải → *dục*, còn ở dòng kệ giữ *dục lạc* theo `snp4.1` (xem bất định 12); `ime vuccanti` → *đây gọi là* (10 khoá tầng so với 1); `kāmayamāna` → *đang khao khát*; `icchati, sādiyati, pattheti, piheti, abhijappati` → *mong muốn, chấp nhận, ước muốn, thèm khát, thầm cầu* (`cnd13:15.31`, `cnd13:21.5`, `cnd7:31.2`; *thèm khát* cho `piheti` để khỏi trùng *khao khát* của `kāmayamāna`; `cnd13:21.5` dùng *khao khát* cho `piheti`); `pīti` → *hỷ*, `pītimano` → *hoan hỷ trong tâm* (`snp4.1:1.3`); `mano` → *ý* theo `cnd5:56.2`; `sata, sato` → *chánh niệm* (`cnd5:61`–`64`); `jantu` → *con người* (dòng kệ `snp4.1:6.1`) và danh sách *hữu tình, nam nhân, thanh niên, đàn ông, cá nhân, sinh mạng, jāgu, sinh vật, indagu* cùng `manujo` → *loài người* (`mnd12:113.5`, `cnd16:20.2` dùng *con người* cho `manujo`; `mnd4:38.5` dùng *loài người*); `nīvaraṇa` → *triền cái* (8 khoá so với 3 khoá *chướng ngại*), `byāpāda` → *sân hận*, `thinamiddha` → *hôn trầm và buồn ngủ*, `uddhaccakukkucca` → *xao động và hối tiếc* (`dn13:30.3`, `dn33:2.1.19`); `upadhi` → *sanh y* (`mnd5:52.3`); `anveti anugacchati anvāyikaṁ hoti` → *theo đuổi, đi theo, bám theo* (`snp4.1:5.3` cho `anveti`); `dukkha` các loại và danh sách bệnh theo `cnd5:14.2`; `ruppati, kuppati, ghaṭṭīyati, pīḷīyati` → *đau đớn* (`snp4.1:2.4`), *bực dọc*, *bị chạm đau*, *bị bức bách* (0 tiền lệ cho ba từ sau); `vipariṇāmaññathābhāvā` → *biến hoại, đổi khác* (`dn1:3.21.5`); `tāṇa, leṇa, saraṇa, abhaya, accuta, amata` → *chốn che chở, nơi nương náu, nơi nương tựa, trạng thái không sợ hãi, trạng thái không biến hoại, bất tử* (`mnd4:3.3`); `ukkhittapaligho … pannabhāro visaññutto` theo `mn22:30.1`; `pañcaṅgavippahīno