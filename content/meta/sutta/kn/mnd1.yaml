  **Bất định (không thêm vào thân kinh).**
  1. `9.2` `addhā`: tám cách nói, trong đó `niyogavacana` → *quyết định*, `apaṇṇakavacana` → *không sai lệch*, `avatthāpanavacana` → *không thể lay chuyển*, `adveḷhaka` → *không phân vân*: 0 tiền lệ cho cả chuỗi, nghĩa chưa phân xử được.
  2. `22.3`–`22.4`, `28.1`, `34.1`, `34.3`, `36.3`–`36.4` `somaṁ visattikaṁ loke, sato samativattati`: đọc `somaṁ` = `so imaṁ` (khớp lời giải `28.2` *So ti yo kāme parivajjeti* và `34.2` *taṁ visattikaṁ sato tarati …*), nên dịch *người ấy, sự đắm say này ở đời, với chánh niệm mà vượt qua*. `snp4.1:3.3`–`3.4` và `thag6.14:5.3`–`5.4` ghi *với sự dính mắc trong cõi đời, người ấy với chánh niệm vượt qua*, không có tân ngữ cho `samativattati`; `ne4:7.3`–`7.4`, `ne15:42.3`–`42.4`, `ne15:49.3` đã có cấu trúc đúng với *sự dính mắc này trong cõi đời*. Không sửa ngoài lát, báo để người biên tập quyết.
  3. `46.2`, `69.3`, `69.5`, `73.2` `parissayā` → *hiểm nguy* để khớp 12 khoá của tầng và lời giải `48`–`51`, trong khi `snp4.1:5.2` và `ne4:11.2` ghi *các tai họa*; các dòng kệ còn lại của `46` và `73` dùng lại nguyên văn `snp4.1:5`. Không sửa ngoài lát.
  4. `29.3`–`29.11` các từ nguyên của `visattikā`: `visatā` → *thấm khắp*, `visālā` → *rộng lớn*, `visaṭā` → *lan tràn*, `visakkati` → *bám dính*, `visaṁharati` → *lôi cuốn đi mọi hướng*, `visaṁvādikā` → *lừa dối*, `visamūlā` → *có gốc độc*, `visaphalā` → *có quả độc*, `visaparibhoga` → *sự thọ dụng độc*: chỉ `visaṭā vitthatā` có tiền lệ (`cnd9:47.3`, `cnd12:13.3`, `cnd12:25.3` đều nén bằng `…`); nghĩa của `visakkati` và `visaṁharati` chưa phân xử được, và trò chơi chữ Pāli không thể giữ nguyên trong tiếng Việt. Tên rắn ở `27.2`–`27.14` (*sappo, bhujago, urago, pannago, sarīsapo, bilāsayo, guhāsayo, dāṭhāvudho, ghoraviso, dvijivho, dvirasaññū*) giữ nguyên dạng Pāli vì lời giải chính là từ nguyên của từng tên; `sirena supatīti sarīsapo` dịch sát chữ *vì ngủ bằng đầu*, chưa chắc ý nghĩa từ nguyên.
  5. `58.3`–`58.4`, `60.3`–`60.4`, `62.3`–`62.4` `andhantamaṁ tadā hoti, yaṁ lobho sahate naraṁ`: dịch đúng thứ tự dòng Pāli (*bấy giờ là bóng tối mù mịt, khi tham chế ngự người ấy*), trong khi `iti88:4.3`–`4.4` đảo hai dòng (*khi tham chế ngự người ấy, chỉ còn tối tăm mù mịt*); cũng vì vậy `58.4`, `60.4`, `62.4` khác `iti88`. `60.1`–`60.2` `kuddho` → *người đang giận* theo `an7.64:13.1`, không phải *người sân* của `iti88:7.1`.
  6. `33.2` `sattattā sato`: dịch *vì là bậc chân thật*; `cnd5:64.2` ghi `satiyā samannāgatattā sato` ở chỗ tương ứng, nên chưa xác định được `sattattā` là chữ gốc hay biến thể.
  7. `71.2` `dakamesiṁ`: không phân xử được hình thái; dịch *chiếc thuyền vỡ mà nước tìm vào* và giữ phần còn lại của câu.
  8. `81.14` `aparigamanatāya` → *không còn xoay vòng*, `81.15` `kaṭaṁ samādāya` → *nắm lấy ván thắng*, `81.24` `santussitattā` → *mãn nguyện*, `81.22` `atammayatā` → *tính không bị tác thành* (theo `mn113:21.7`), `80.6` `gataddho gatadiso gatakoṭiko paṭividdhākuppo` → *đã đi hết con đường dài, đã đi đến phương hướng cần đến, đã đến điểm cuối cùng, đã thấu triệt điều bất động*: 0 tiền lệ cho các cụm này, nghĩa chưa phân xử được. `81.11` `saccaṁ sampaṭipādiyitvā` → *thực hành trọn vẹn chân lý*, `81.13` `kilesaggiṁ pariyādiyitvā` → *làm cạn lửa phiền não*: 0 tiền lệ.
  9. `39.3` `assā ti pasukādayo vuccanti` → *Ngựa: nói đến gia súc và các loài tương tự* (không khớp trực tiếp với `assā`), `40.1` `āmāya` → *sinh ra trong nhà*, `41.2` `bhatakā, kammakarā, upajīvino` → *người làm thuê, người làm công, người sống nương nhờ*, `42.2` `itthipariggaho` → *những phụ nữ được sở hữu*, `38.3` các loại `vatthu` → *nền nhà ở, nền nhà kho, nền phía trước, nền phía sau, nền vườn, nền tịnh xá*: 0 tiền lệ.
  10. `3.5` `khettaṁ vatthu hiraññaṁ suvaṇṇaṁ` → *ruộng, đất, tiền bạc, vàng* (theo `cnd5:51.5`), trong khi dòng kệ `37.1` `vatthuṁ` → *nhà cửa* (theo `snp4.1:4.1`) và `38.3` giải `vatthu` thành các loại nền đất; hai cách dịch cùng một chữ.
  11. `53.3`, `54.5` `tyassa anto vasanti anvāsavanti pāpakā akusalā dhammā`: *chúng cư trú bên trong vị ấy, chảy tràn vào bên trong vị ấy: đó là các pháp ác bất thiện*; `sarasaṅkappā saṁyojaniyā` → *những hồi ức và ý định có tính trói buộc*: `sn35.151:1.5`–`1.6` dịch khác (*những tưởng và ý nghĩ trói buộc vào*), `anvāsavanti` không có tiền lệ.
  12. Dòng kệ giữ *dục lạc* cho `kāma` (theo `snp4.1`), còn lời giải dùng *dục* (theo `cnd5`, `cnd6`, `cnd10`); `cnd20:14.2` dùng *dục lạc* cho `kāmaguṇa`. Chưa thống nhất, để người biên tập quyết.
  13. `9.4` `pīti pāmujjaṁ āmodanā pamodanā hāso pahāso vitti tuṭṭhi odagyaṁ attamanatā abhipharaṇatā cittassa` → *hỷ, vui mừng, hân hoan, rất hân hoan, vui cười, cười lớn, phấn khởi, hài lòng, hớn hở, tâm thỏa ý, sự lan tỏa của tâm*, và `9.7` tám trạng thái tâm: 0 tiền lệ cho cả chuỗi.
  14. `17.1` dùng lại nguyên văn `sn1.41:4.3` *kẻ trộm trộm đoạt, vua chúa chiếm đoạt* (tiền lệ duy nhất; câu hơi lặp chữ nhưng đúng Pāli).
  15. Lỗi ngoài lát, báo chứ không sửa: `snp4.1:3.3`–`3.4`, `snp4.1:5.2`, `ne4:11.2`, `thag6.14:5.3`–`5.4` (bất định 2 và 3).

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (516/516, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` và ngoặc đơn khớp Pāli từng khoá (0/516 lệch); dấu lược `…` khớp Pāli từng khoá (0/516 lệch; 65 khoá có `…`: 14 khoá có `…pe…`, 50 khoá có `…` trần, 1 khoá có `(…)`; không khoá Pāli nào kết `….`); dấu gạch dài cuối khoá khớp Pāli (0 lệch); 0 khoá rỗng; NFC; không khoảng trắng thừa; không nháy thẳng; Pāli lọt sang Việt: không còn từ có dấu Pāli ngoài các tên riêng và từ nguyên giữ dạng Pāli (*jāgu, indagu, sāli, vīhi, kahāpaṇa* và các tên rắn nêu ở bất định 4).

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 144 khoá chênh lệch lớn nhất (trên 516 khoá) → khác nghĩa 11: sửa 1 nhóm, giữ 5, bất định 5. Sửa (accuracy fix, 6 khoá `13.1`, `13.3`, `14.1`, `14.7`, `21.1`, `21.3`, cùng một kệ `tassa ce kāmayānassa … te kāmā parihāyanti`): “Nhưng với kẻ đang khao khát ấy … khi những dục lạc ấy tiêu giảm” → “Nhưng nếu, đối với kẻ đang khao khát ấy … những dục lạc ấy tiêu giảm”, vì `ce` là “nếu” (điều kiện) chứ không phải “khi”; khớp `2.2`/`8.6` (*nếu điều ấy thành tựu*) và lời giải `14.2` (*Nếu của người ấy*), và `16.1` đã dịch `te kāmā parihāyanti` không có “khi”. Giữ 5: `13.1`/`14.1` `kāmayānassa` (bản mù đọc *kāma-yāna* “đi theo dục”; lời giải `14.3`–`14.4` đã nêu cả hai cách đọc, nên giữ “đang khao khát”); `81.2` `apacinitvā` (“làm giảm bớt” hay “phá bỏ” chỉ khác diễn đạt); `81.5` `vidhūpeti`/`sandhūpeti` (khác diễn đạt); `81.15` `kaṭaṁ` (“ván thắng”; bản mù không chắc); `65.3`–`65.4` `hiṁsanti`, `samphala` (cùng nghĩa, khác diễn đạt). Bất định 5, ghi lại không sửa: `71.2` `dakamesiṁ` (chủ thể “tìm” là chiếc thuyền hay nước); `33.2` `sattattā`; `29.6` `visakkati` (“bám dính” hay “chạy ngược xuôi”); `81.22` `atammayatā` (“không bị tác thành” hay “không tự đồng hóa”); `28.4` `pariyuṭṭhānaṁ` dịch “hiển hiện” theo quy ước của hàng chục khoá Niddesa/Netti/Peṭakopadesa, trong khi các Nikāya dịch “ám ảnh”/“chi phối” (bản mù: “triền phược”). Không có bản Anh hay bản Việt độc lập khác nên `triangulation` chỉ 7,8. Ngoài lát, báo chứ không sửa: `snp4.1:2.1`, `ne4:5.1`, `ne15:41.1`, `pe1:69.3` còn “Nhưng với kẻ đang khao khát ấy … khi …” cho cùng kệ.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng đủ 516 khoá Pāli↔Việt, đoạn song song cnd5:13.2, cnd6:11/13, cnd12:13/22, cnd23:97–98, mnd16:83–90, iti88, sn35.151, sn3.2:2, snp4.1:1–4, snp2.5:6, sn10.3): sửa 0 khoá.
  Không có bản Việt nguyên bài độc lập cho mnd1, không có bản Anh; chỉ Pāli và đoạn song song.
  Kiểm lại có hệ thống: chủ thể/phủ định/điều kiện (`ce` = nếu), số đếm (2/4/10/8/11/9 mục khớp), 17.x, 23.x, 26.x, 47.x–51.x, 53–54, 56–68, 70–71, 77–82. Các đoạn dài (28.4, 48.7, 49.2, 75.5, 78.10) trùng nguyên văn tiền lệ đã published cnd5/cnd6/cnd23/mnd16, không lệch Pāli.
  Giữ: «vì người phàm đã đạt được…» (2.4, 10.1, 10.4, 12.4) theo snp4.1:1.4 đã published; «thanh niên du đãng» (48.6) và «sanh y» (78.10) theo tiền lệ cnd; `pariyuṭṭhāna` = «hiển hiện» (28.4) theo quy ước Niddesa/Netti.
  Không sửa (chéo, chờ người biên tập): `somaṁ visattikaṁ`/`tare loke visattikaṁ` (22.3–22.4, 28.1, 34, 36); `oḷārike`/`anusahagate` ở 26.3–26.4 («thô thiển», «vi tế»).
  Bất định: như đã ghi (9.2, 29.x, 33.2, 71.2, 81.x); không có bằng chứng mới nên giữ nguyên điểm.

