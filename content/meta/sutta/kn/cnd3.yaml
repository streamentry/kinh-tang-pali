notes: |-
  **Bài này là bản rút gọn của `snp5.18` (Kinh Tập 5.18, mục Pārāyaṇa) — 28 khoá dùng lại nguyên văn.** Tôi dựng chỉ mục Pāli ↔ Việt toàn tầng (5.764 tệp Pāli trong cache, 4.983 bài Việt) rồi đối chiếu từng khoá. Kết quả: **28/37 khoá trùng nguyên văn** và bản Việt của tôi **giống hệt** `snp5.18` cho đúng 28 khoá đó. Ba khoá nữa **không** trùng chuỗi Pāli nhưng cùng nghĩa và cùng vị trí trong bài, nên tôi vẫn dùng nguyên câu chữ của `snp5.18`: `3.1` (`Todeyyakappā` ở đây không có gạch nối, `snp5.18:3.1` có), `4.2` và `4.4` (hai chữ đầu viết hoa). Ba khoá này là chỗ **vị trí ranh giới khác nhau**, không phải chỗ dịch khác — nếu dịch mới thì bài sẽ tự mâu thuẫn.

  **Chỗ ranh giới ĐÃ khác, phải dịch riêng — và tôi ghi lại vì đó là bằng chứng cho tính nguyên văn.** `cnd3` **gộp** hai câu của `snp5.18` vào một khoá: `cnd3:1.1` = `snp5.18:1.1` + `snp5.18:1.2`. Và `cnd3:1.3`/`1.4` là **hai nửa** của `snp5.18:1.4`. Vì vậy `1.1` không có tiền lệ nguyên văn: tôi ghép đúng hai câu đã có (*Đức Thế Tôn đã nói điều này khi đang trú tại xứ Magadha, ở bảo tháp Pāsāṇaka* + *đã trả lời từng câu hỏi khi được mười sáu Bà-la-môn…*) và **thêm một chữ *du sĩ*** cho `paricārakasoḷasānaṁ` mà `snp5.18:1.2` đã lược (`…mười sáu Bà-la-môn hầu cận thỉnh cầu và hỏi`). `paricārika` là du sĩ/lang thang, bỏ hẳn thì mất một nghĩa; thêm vào là khôi phục, không phải bịa. Nếu biên tập muốn khớp tuyệt đối với `snp5.18` thì xoá *du sĩ*.

  **`8.4` — dấu nháy kép.** Pāli `tasmā pārāyanaṁ iti.` không có nháy, nhưng `snp5.18:8.4` (Pāli giống hệt) là *do đó được gọi là Bờ Kia.* với nháy cong quanh *Bờ Kia*. Tôi dùng lại nguyên văn nên nháy kép vẫn cân; không phải sửa chính tả.

  **Tên tác phẩm — 0 tiền lệ trong tầng dịch, lấy từ `notes` của `cnd1.yaml` (chính bài đã có trong repo).** `0.1` `Cūḷaniddesa` → *Tiểu Tập Kể Lược*; `0.2` `Pārāyanavaggagāthā` → *Phẩm Bờ Kia*; `0.3` `3. Pārāyanatthutigāthā` → *3. Kệ Tán Thán Phẩm Bờ Kia* theo `snp5.18:0.2`. Riêng `0.2` có **một** tiền lệ đo được trong tầng dịch là `Pārāyanavaggagāthā` → *Phẩm Bờ Kia* (đặt trong `translationTitle` của `cnd1`), và một tiền lệ nữa là `Pārāyanānugītigāthā` → *Kệ Tiếp Theo Phẩm Bờ Kia* (ghi trong `notes` của `cnd1.yaml`). **Người điều phối nói cần tra tiền lệ thật vì chưa đo** — tôi đo xong: họ còn bỏ sót một tiền lệ nữa, và `translationTitle` của `cnd1` đã đặt *Phẩm Bờ Kia* nên tôi theo. 0 tiền lệ cho chính `cnd3:0.1` trong tầng dịch vì chưa có bài `cnd` nào khác dịch khối `:0` (cnd1 và cnd4 trong repo chỉ có một khoá lệch).

  **`snp5.18:0.1` = *Kinh Tập 5.18*** (bộ `snp` giữ số hiệu như bản `an`), còn `cp` giữ *Hạnh Tạng* và `ja` giữ *Jātaka* — cả ba đều đúng theo quy ước riêng của từng tác phẩm, không phải mâu thuẫn.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root: `root/pli/ms/sutta/kn/cnd/cnd3_root-pli-ms.json`, 37 khoá. Bản Anh Sujato **không có**: thư mục `kn/` của edition `translation/en/sujato` tại commit đã ghim chỉ có `cp` (35 tệp), `dhp` (26), `iti` (112), `ja` (83), `kp` (9), `snp` (73), `thag` (264), `thig` (73), `ud` (80) — **không có `cnd`, `pv` hay `mil`**; `find` cho 0 tệp `cnd3` ⇒ `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` cũng không có uid này (đã `find`). Tầng `vietnamese-current` vắng: thư mục `translation/` không tồn tại trong checkout này. Ba tầng tham khảo đều vắng ⇒ bài chỉ từ Pāli root ⇒ **blocker thật**, đây là giới hạn upstream. `triangulation` bị chặn ở **7.5** (≤ 8.0) và **không nâng để né blocker**; `status` là `draft`.

  **Vì sao `triangulation` vẫn 7.5 chứ không phải 8.8 như `cnd4`.** `cnd4` đối chiếu được tầng chú giải đã ghim `cnd22:110–119` trong chính corpus. `cnd3` thì **không có** một khoá chú giải nào đủ gần: tôi không tìm thấy bản chú giải nào trong corpus giải `cnd3` (`soḷasa`, `Todeyya`, `Kappa`, `Jatukaṇṇi`, `Bhadrāvudha`, `Mogharāja`, `Sampannacaraṇa`). Không có chú giải để phân xử thì chỉ còn Pāli + một bài song song, nên 7.5 là mức trung thực.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì BRIEF cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0: mọi chốt tự động của `_hvi.kiểm` đã xanh và 37/37 khoá của chính bài này, nhưng cổng `npm` chưa chạy.

  **28 khoá dùng lại nguyên văn, theo `snp5.18`:** `1.2` · `2.1`–`2.4` · `3.2`–`3.6` · `4.1` · `4.3` · `5.1`–`5.4` · `6.1`–`6.4` · `7.1`–`7.4` · `8.1`–`8.4`. Ba khoá cùng nghĩa nhưng khác chuỗi Pāli, vẫn dùng lại nguyên câu: `3.1` · `4.2` · `4.4`.