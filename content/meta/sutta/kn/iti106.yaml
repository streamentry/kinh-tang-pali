notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.2, 3.3 (và 2.3, 3.2 cùng thuật ngữ) — `pubbadevatā` “chư thiên cổ” → “chư thiên thuở trước”, `pubbācariyā` “bậc thầy cổ” → “bậc thầy đầu tiên” (theo `an4.63`, `an3.31`; `pubba` là “trước, đầu tiên”, không phải “cổ xưa”). Giữ nguyên khoá 2.4, 3.1, 3.4: “con cái tôn kính cha mẹ trong nhà” là cách dịch chủ động của thể bị động `pūjitā honti` mà không đổi nghĩa, “Phạm thiên” và “xứng đáng nhận cúng dường” đều đúng Pāli.
