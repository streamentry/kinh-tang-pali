notes: |-
  Đợt 19, làn 61. Dịch từ Pāli root commit đã ghim, đủ 83/83 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có tiêu đề, 18 nhóm kệ, dòng kết bài, dòng kết bộ và kệ tóm lược; không có văn xuôi khung truyện, nên người nói của từng khổ không được ghi vào thân kinh mà chỉ đọc từ ngữ cảnh (xem bất định 1).

  **Tiêu đề và phần kết, theo khuôn các bài anh em.**
  - `0.2` “Bộ Mười Ba Bài Kinh” và `0.3` “Phẩm Xoài”: dùng lại nguyên văn từ `ja482`, `ja481`, `ja479`, `ja478`, `ja476`, `ja475`, `ja474` (cùng `Terasakanipāta` + `Ambavagga`): 8/8 cặp giống nhau.
  - `0.4` “10. Kinh Sarabhamiga” và `19.1` “Kinh Sarabhamiga, thứ mười.”: theo khuôn “N. Kinh <tên Pāli>” của `ja482:0.4` (“9. Kinh Rurumigarāja”) và “Kinh …, thứ N.” của `ja482:18.1`; giữ nguyên tên ghép Pāli.
  - `20.1` “Bộ Mười Ba Bài Kinh đã hoàn tất.” theo `ja473:14.1`, `ja463:15.1`, `ja454:17.1` (cùng dạng `…nipātaṁ niṭṭhitaṁ`).
  - `21.1` “Tóm lược:”: Pāli `Tassuddānaṁ` trùng nguyên văn với 511 khoá đã dịch trong tầng, trong đó 407 cặp cùng bản Việt “Tóm lược:”; 104 cặp khác (biến thể như “Tóm lược các chuyện trong phẩm:”), chọn dạng đa số và là dạng của `ja473:15.1`, `ja463:16.1`, `ja454:18.1`.
  - `22.1`–`22.4` kệ tóm lược `uddāna`: theo `ja473:16.1`–`16.4`, `ja454:19.1`–`19.4`, `ja463:17.1`–`17.4`, giữ nguyên tên Pāli của từng bài (phiên chữ), chỉ dịch từ nối `atha` → “rồi”, `pañcamako` → “là thứ năm”, `paro` → “kế đó”. Mười tên trong kệ khớp mười bài của phẩm: Varaamba (1), Kuṭhāri (2), Sahaṁsavaro (3), Araññasmiṁ (4), Dūtaka (5, `dūtakapañcamako`), Bodhi (6), Akitti (7), Sutakkarinā (8), Rurumiga (9), Sarabha (10).

  **Tiền lệ dùng lại nguyên văn.** Đã dò 83 khoá Pāli với toàn bộ tầng Pāli đã dịch (chuẩn hoá bỏ nháy, dấu cuối khoá, chữ hoa/thường; bỏ khoá dưới 8 ký tự): 19 khoá Pāli trùng nguyên văn với khoá ở bài khác đã có bản Việt, tổng 566 cặp, trong đó 445 cặp bản Việt của tôi giống và 121 cặp khác (phần lớn khác ở khoá `21.1`, xem trên).
  - `1.1`–`1.3`, `2.1`–`2.3` dùng lại nguyên văn từ `ja51:1.1`–`1.3` (“Chỉ nên mang hy vọng, người đàn ông, / bậc trí tuệ chớ nên thất vọng; / Giờ ta thấy rõ chính mình,”); `3.1`–`3.3`, `4.1`–`4.3` từ `ja52:1.1`–`1.3` (“Chỉ nên cố gắng, người đàn ông, …”). Ở `1.2`/`2.2`/`3.2`/`4.2` có thêm `ja124:1.2` “bậc trí chớ chán nản;” (khác, 1/3 nguồn); `3.1`/`4.1` còn có `sn11.8` “Con người phải nỗ lực,” và `ja124:1.1` “Người hãy cố gắng,” (khác, 3/4 nguồn): chọn dạng của `ja51`/`ja52` vì hai bài ấy có đúng nguyên văn bốn dòng kệ này.
  - `1.4`/`3.4` “đúng như ta đã mong muốn, ta đã trở thành.” theo `ja51:1.4` (Pāli `ahū”ti` so với `ahu.` ở đây; Sujato của `ja51` “as I wished, so I became”).
  - `2.4`/`4.4` “được nâng từ mặt nước lên bờ đất.” theo `ja52:1.4` (Pāli `ubbhatan”ti`) nhưng đổi “bị nâng” thành “được nâng” (`ubbhata` chỉ là “được nâng lên”, không có nghĩa bị động tiêu cực; tương ứng Sujato của `ja52` “lifted from the water to the shore”). Đây là 2 khoá cố ý khác bản có sẵn (accuracy fix nhỏ).
  - `18.3` “bố thí và hưởng thụ đúng theo khả năng,” dùng lại nguyên văn `sn1.41:5.5` (Pāli trùng nguyên văn, 1/1 cặp giống).
  - `6.4` “dù là người nữ hay người nam”.: Pāli `itthiyā purisassa vā` có 5 khoá tầng với bản Việt khác nhau (`an7.7:4.2` “dù là người nữ hay người nam”, `sn1.46:4.2` “dù là đàn bà hay đàn ông”, `an7.5:3.2`, `an7.6:11.2` “dù là nữ hay là nam”, `kp8:6.4`); theo `an7.7:4.2` (1/5 cặp giống).
  - Hai khoá **không** theo bản có sẵn, có lý do: `9.4` (`Ñāṇaṁ nu te brāhmaṇa bhiṁsarūpaṁ`) trùng nguyên văn với `ja402:6.4`, nhưng bản Việt ở đó “ngươi có hiểu biết, bà-la-môn, hay đó là hình tướng đáng sợ?” đọc `nu` là “hay” và bỏ `ñāṇaṁ te`, còn khoá liền trước `ja402:6.3` rối nghĩa; dịch lại theo Pāli (xem bất định 5). `18.1` (`Akkodhano niccapasannacitto`) trùng nguyên văn với `ja391:7.1` “Không còn sân hận, lòng tin không lạnh nhạt,” và `ja420:7.3` “không nóng giận, có tâm nghĩ lỡ nghĩ chân chất,”: cả hai cùng phép dịch `niccapasannacitto` không bám Pāli (`nicca` “luôn”, `pasanna` “tịnh tín/trong sáng”, `citta` “tâm”) nên dịch lại là “Không nóng giận, tâm luôn tịnh tín,” (tầng có “tâm tịnh tín” cho `pasannacitto` ở nhiều bài khác); `ja391:7.2` (Pāli `Sabbātithīyācayogo`, cùng cụm với `18.2`) cũng không bám Pāli (“kẻ thắng trận mọi kẻ đối địch”). Xin người điều phối cân nhắc rà soát `ja391` và `ja420` riêng.

  **Trùng nguyên văn trong chính bài** (sau khi chuẩn hoá bỏ nháy và dấu cuối khoá): 6 nhóm = `1.1`/`2.1`, `1.2`/`2.2`/`3.2`/`4.2`, `1.3`/`2.3`/`3.3`/`4.3`, `1.4`/`3.4`, `2.4`/`4.4`, `3.1`/`4.1`. 0 nhóm mà bản Việt khác nhau về câu chữ (khác chỉ ở dấu mở nháy kép của `1.1`, `7.1`…). Bốn khổ kệ đầu là hai cặp kệ lặp, chỉ khác dòng 1 và dòng 4.

  **Số Pāli:** `Terasaka` = 13 (tera 3 + dasa 10) ⇒ “Mười Ba”, khớp bốn bài anh em; `10.` ở `0.4` và `dasamaṁ` ở `19.1` = 10 ⇒ “thứ mười”, khớp nhau; `dūtakapañcamako` (22.2) “Dūtaka là thứ năm” khớp `ja478:0.4` “5. Kinh Dūta”. Không có số lượng nào khác trong thân kệ, không có cụm số chưa phân xử được.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `sarabha` (7.1, 8.2, 11.3, 12.4, 14.2) → giữ “sarabha” và gọi là “con nai sarabha”: tầng chỉ có `sarabha` làm tên người (`an3.64` “du sĩ Sarabha”, `an3.70`) và tên sông Sarabhū, 0 tiền lệ cho tên loài thú; giữ Pāli để không gán cho một loài nai cụ thể (`migo` → “nai” theo `ja482`).
  - `giriduggasmiṁ` (7.1) → “nơi núi non hiểm trở”: theo `ja472:9.3` “chốn núi non hiểm trở” (cùng cụm, cùng chuyện bị rơi xuống vực).
  - `narakā` (8.1) → “vực sâu”: theo `ja472:9.1` “Anekatāle narake” → “vực sâu nhiều tầm cây thốt nốt”; `viduggā` → “hiểm trở” (cùng gốc `duggā` ở `ja472:9.3`).
  - `maccumukhā` (8.3) → “miệng tử thần”: `sn2.22:7.3` “miệng thần chết”, `snp4.2:5.3` “miệng tử thần” (2 khoá, cách đọc nhất quán).
  - `alīnacitta` (7.3, 8.4) → “tâm không nản” (đã đổi ở lượt cải thiện 2026-10-13, trước đó là “tâm không dao động”): tầng có 22 khoá chứa `alīnacitt-`, không có dạng nào chiếm đa số: “không hèn nhát” (`snp1.3:34.2`, 10 khoá `cnd23`), “không nhạt nhòa” (`an10.76:21.8`), “không nản” (`ja545:187.1`, cùng gốc), “uể oải” (`snp3.11:39.1`), “không dao động” (chỉ `ja156`, 3 khoá). Bản Anh của Sujato cho `snp1.3`, `snp3.11`, `an10.76` đều dịch `līna` là “sluggish” (uể oải, chùn xuống), nên `alīna` là “không chùn nản”, không phải “không lay động”; chọn “không nản” vì hợp bối cảnh dũng lực (`vikkanta`, 7.3) và có tiền lệ `ja545:187.1`.
  - `vivaṭṭacchaddo` (9.3) → “bậc đã vén màn che”: theo `dn30` “vén bỏ màn che của thế gian” (17 khoá chứa `vivaṭṭacchad-`); `ja402:6.3` rối nghĩa nên không dùng.
  - `janinda` (10.4), `manussinda` (13.3) → “chúa tể loài người”: theo `ja482:11.1` “tâu chúa tể loài người”, `ja346:1.1` “vị chúa tể loài người” (`manussinda`), `dn16:6.28.14`.
  - `khattiya` (12.2) → giữ “khattiya”: `ja472` “vị khattiya”; tầng `dn` dịch “Sát-đế-lợi” (nghĩa khác bối cảnh, giữ theo tầng `ja`). `brāhmaṇa` → “bà-la-môn” (chữ thường, theo `ja482`, `ja484`).
  - `asura` (13.2) → “a-tu-la”: theo `dn24` (56 khoá chứa `asur-`, đa số “a-tu-la”).
  - `vetaraṇī` + `yama` (14.4, 15.3) → “sông Vetaraṇī của Diêm Vương”: theo `sn1.33:10.3`, `ja424:3.3` (“sông Vetaraṇī của Diêm Vương”); `snp3.10:26.1` dịch “con sông Vetaraṇī hiểm trở” (cách đọc khác, không có `yama`).
  - `mahābrahme` (16.4) → “Đại Bà-la-môn”: theo `ja480:1.3` và 6 khoá `ja547` (`ja547:327.1`, `365.1`, `367.3`, …) “Đại Bà-la-môn”, `ja520:33.1` “đại bà-la-môn”, `ja431:1.1` “bà-la-môn lớn” (cách dịch đa số khi `mahābrahme` gọi một bà-la-môn trong Jātaka: 9/11 khoá khác); `ja254:2.3`, `ja467:10.3` “Đại Phạm thiên”, `dn18:22.14` “Đại Phạm thiên” là cách đọc khác của cùng từ (vocative của `mahābrahmā`), không hợp ở đây vì người nghe là một bà-la-môn (9.4, 12.2). Ghi chú ở lượt trước nêu `ja254:2.3` là tiền lệ “Đại Bà-la-môn” là nhầm; đã sửa.
  - `yācayogo` (18.2) → “sẵn lòng đáp ứng lời cầu xin”: theo `sn11.13:13.7` “sẵn lòng đáp ứng lời cầu xin” (43 khoá chứa `yācayog-`, cách dịch đa số “đáp ứng/đáp lời cầu xin/yêu cầu”).
  - `anindito saggamupehi ṭhānaṁ` (18.4) → “không bị chê trách, hãy đi đến nơi chốn cõi trời”: theo `sn1.41:5.6` “không bị chê trách, đi đến nơi chốn cõi trời”.
  - `vāsavo` (17.4) → giữ “Vāsava”: `dn21:1.12.51` “Vāsava”. `tidiva` → “cõi trời” (tầng có `tidivūpapanno` ở `dn21` dịch cụ thể là “cõi Ba Mươi Ba”, nhưng `tidiva` đơn lẻ chỉ là “cõi trời”; tầng `ja` có 18 khoá chứa “cõi trời”).
  - `nārīgaṇehi paricāriyanto` (17.3) → “được đoàn nữ nhân hầu hạ”: `nārīgaṇapurakkhato` ở `tha-ap221:1.2`, `vv18:1.4` dịch “được đoàn nữ nhân vây quanh”; `paricāriyanto` thêm nghĩa hầu hạ nên dịch riêng.
  - `phassā` (5.3) → “xúc chạm”: dùng thuật ngữ quen thuộc “xúc” theo nghĩa rộng “va chạm với cảnh”; xem bất định 7.
  - `bhogā` (6.3) → “của cải”; `cintāmayā` → “do tư duy mà sinh ra” (`dn33:1.10.107` “tuệ do tư duy sinh”).
  - `maccam` (5.4) → “người phàm”: theo `ja461:10.1` “Người phàm chết đi chỉ một mình”.
  - `pāṇado` (15.4) → “người ban mạng sống”: theo `ja157:2.6` “người ban mạng sống cho ta” (cùng từ, cùng cách dịch) và `ja524:15.2` “đã ban mạng sống cho tôi” (`pāṇadado`); `an7.64:19.3`, `ja517:4.1` (`pāṇadadiṁ`) “ban sự sống”. Ghi chú ở lượt trước nêu “0 tiền lệ” là sai; đã sửa.
  - `dhammaguṇe` (17.2) → “những đức hạnh của Pháp” (đã đổi ở lượt cải thiện 2026-10-13, trước đó là “đức tính”): tầng có 10 khoá chứa `dhammaguṇ-`; dạng “đức hạnh” chiếm đa số (`pv37:54.2` “các đức hạnh của Pháp”, `ja431:6.2` và `ja509:2.2` “đức hạnh của Chánh pháp”, `ja489:16.1`, `ja462:5.1`, `ja462:5.4`; `mil5.5.8:16.1` “đức hạnh của pháp”), “đức tính” chỉ ở `vv32:1.4`, `vv84:54.2`. Ghi chú ở lượt trước nêu “0 tiền lệ” là sai; đã sửa.
  - `tadānenti` (10.4) → “rút ra” (với `atthaṁ`): 0 tiền lệ trong 55 khoá chứa `ānenti`/`mānenti` (không khoá nào cùng hình thức), xem bất định 6.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli mở ở 1.1, 7.1, 9.1, 10.1, 11.1, 12.1, 13.1, 15.1, 17.1 và đóng ở 6.4, 8.4, 9.4, 10.4, 11.4, 12.4, 14.4, 16.4, 18.4 (dấu đóng của `18.4` đứng trước `ti`, bản Việt đặt `”` ở cuối khoá): 9 dấu mở · 9 dấu đóng, lệch 0/83 khoá. Khối 1–6 là một lời nói trọn vẹn (mở ở 1.1, đóng ở 6.4), khối 13–14 và khối 15–16 mỗi khối một lời nói, khối 17–18 một lời nói (mở ở 17.1, đóng ở 18.4). Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (không có chỗ lược trong bài). `9.4` và `16.4` kết bằng `?”.`: Pāli không có dấu hỏi nhưng cả hai là câu hỏi tu từ rõ ràng (`kiṁ … nu …`, `kathaṁ haneyyaṁ`), theo thói quen của `ja439:1.4`, `ja482:8.2`.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói (đọc từ ngữ cảnh kệ, không từ văn xuôi vì tầng Pāli ghim không có văn xuôi): 1–6 một nhân vật (không xác định) nói về hy vọng; 7–8 một người nói với nhà vua về con nai đã cứu ngài; 9 nhà vua hỏi một bà-la-môn (`brāhmaṇa` ở 9.4); 10 bà-la-môn đáp; 11 một người xúi nhà vua bắn nai (nhà vua được gọi `varapañña`); 12 nhà vua đáp (gọi `brāhmaṇa`); 13–14 vị bà-la-môn kia xúi tiếp; 15–16 nhà vua đáp (gọi `mahābrahme`); 17–18 chúc phúc cho nhà vua (người nói không rõ, có thể chính vị bà-la-môn hay con nai). Bản dịch không thêm người nói vào thân kinh.
  2. `7.2` `yaṁ tvaṁ anusarī pure`: `anusarī` đọc là “đã đuổi theo” (aorist của `anusarati`); có cách đọc khác “đã nhớ đến”. Chọn “đuổi theo” vì khổ kệ nói về lần nhà vua đi săn gặp con nai ở nơi núi hiểm trở.
  3. `7.3`–`7.4` `alīnacittassa tuvaṁ vikkantamanujīvasi`: dịch “của bậc có tâm không dao động, ngài đang sống nhờ dũng lực ấy” (`vikkanta` → “dũng lực”, `anujīvasi` “sống nhờ”; `alīnacitta` → “tâm không nản”, xem thuật ngữ); `vikkanta` là phân từ “đã bước tới”, ở đây đọc là danh từ chỉ hành động dũng mãnh.
  4. `8.2` `silāya yoggaṁ sarabho karitvā`: đã giải quyết một phần ở lượt cải thiện 2026-10-13. Trước đó dịch `yoggaṁ karitvā` là “lấy tảng đá làm phương tiện”; nhưng cùng công thức xuất hiện ở `ja516:21.3` `Silāya yoggaṁ katvāna` (một bậc ngưu vương cứu người khỏi hố, ngay trước đó đã “cầm một tảng đá nặng”, `ja516:21.1`) dịch “dùng tảng đá để thử sức”, và `an9.36:3.1` `yoggaṁ karitvā` là “tập luyện” (bản Anh của Sujato “practices on”). `yoggaṁ karoti` vì vậy là “luyện tập, thử sức trên (vật gì)”, không phải “làm phương tiện”; đổi thành “sau khi dùng tảng đá để thử sức”. Còn bất định: có phải `yogga` ở đây mang nghĩa “thử sức” hay “tập luyện” (Pāli root không nói rõ cách làm), và vì Jātaka `ja516` là bài khác nên không thể chắc đó là cùng một tình tiết; không thêm chi tiết nào vào thân kinh. `tức` ở đầu `8.2` nối `yo` ở `8.1` với `sarabho` (cùng chủ ngữ).
  5. `9.4` `ñāṇaṁ nu te brāhmaṇa bhiṁsarūpaṁ`: `bhiṁsarūpa` (“có hình thức đáng khiếp sợ”) dịch “là điều đáng kinh sợ”; nghĩa có thể gần “thật đáng kinh ngạc” (sợ vì quá sâu rộng). `nu` đọc là tiểu từ nghi vấn (cặp với `nusi` ở `9.3`), không phải “hay”.
  6. `10.3`–`10.4` `gāthāpadānañca subhāsitānaṁ atthaṁ tadānenti`: `tadānenti` đọc là `tad ānenti` (“họ mang/rút ra điều ấy”), dịch “rút ra ý nghĩa ấy”; `ca` sau `gāthāpadānaṁ` đọc nối hai thứ cùng có “ý nghĩa” (“các câu kệ” và “những lời khéo nói”). Cách đọc khác của `tadā` + `ānenti` cũng có thể.
  7. `5.3` `bahū hi phassā ahitā hitā ca`: `phassa` đọc là “xúc chạm” theo nghĩa rộng (điều va chạm đến mình), cách đọc khác là “những trải nghiệm”; chưa có bản English đã ghim cho khổ kệ này (Sujato không có `ja483`). Thân kinh giữ chữ “xúc chạm” và không giải thích.
  8. `11.1` `ādāya pattiṁ paraviriyaghātiṁ`: `patti` đọc là tính từ chỉ vật có lông cánh (mũi tên có `patta` = lông/cánh, cùng gốc với `catuppatta` ở `ja482:10.1`), nên dịch “vật có lông cánh, thứ hủy diệt sức mạnh của kẻ khác”, không thêm chữ “mũi tên” ở dòng này vì `11.2` `saraṁ` đã nêu. Cách đọc khác (`patti` là bộ binh) không hợp với `cāpe saraṁ` ở dòng sau.
  9. `11.2` `kiṁ vicikicchase`: dịch “sao ngài còn nghi ngại” (`vicikicchati` là “nghi ngại, lưỡng lự”; từ lượt cải thiện 2026-10-13 cả `11.2` và `14.1` đều dịch “do dự”, trước đó `11.2` là “nghi ngại” còn `14.1` là “do dự” cho cùng một động từ `vicikicchase` của cùng một người nói; `11.2` đảo thành “mũi tên trên cung, sao ngài còn do dự?” để không gán “do dự” cho chính mũi tên); `11.4` `annañhi etaṁ`: `hi` là “vì”; `varapañña` dịch “bậc có trí tuệ thù thắng”.
  10. `13.2` `asureso disampati`: `disampati` đọc là danh xưng chung “chúa tể một phương” chứ không phải tên riêng (tầng `dn19` có 31 khoá dùng `Disampati` làm tên vua, ngữ cảnh khác). `13.4` `amarādhipo` dịch “chúa tể của chư thiên bất tử” (`amara` = chư thiên).
  11. `14.2` `hantuṁ migaṁ sarabhaṁ sahāyakaṁ`: `sahāyaka` là tính từ “bạn bè” đi với `migaṁ sarabhaṁ`, dịch “người bạn ấy”; Pāli không có chữ “của ngài”, bản dịch cũng không thêm.
  12. `15.1` `kāmaṁ ahaṁ jānapadā ca sabbe`: `kāmaṁ` dịch “cứ để” (cho phép / dù cho); `gacchemu` “cùng đi” (động từ chia ở ngôi thứ nhất số nhiều). `15.4` `na tveva hañño`: `hañño` là thể nguyện (nên/được), dịch “nhất định không bị giết”, không nhấn mạnh là “không thể”.
  13. `16.2` `ekassa kattā vivanasmi ghore`: `kattā` (“người làm”) không có tân ngữ trong Pāli (nối với `pubbakiccaṁ` ở `16.3`), dịch “đã là người hành động vì ta”; không thêm chữ “cứu”. Từ lượt cải thiện 2026-10-13, `ekassa` (genitive, đi với `mayhaṁ`, “riêng mình ta”) được đặt về đúng chủ thể: “khi ta một mình nơi hoang vu đáng sợ, nó đã là người hành động vì ta” (trước đó “một mình nơi hoang vu đáng sợ, đã là người hành động vì ta” có thể đọc là con nai một mình). Còn một cách đọc khác của `kattā`: ở `ja546` (5 khoá) và `ja547` (3 khoá) `kattā` là “quan cố vấn” (một chức danh); không hợp ở đây vì `kattā` nối với `pubbakiccaṁ` (16.3) và không có tên chức vụ nào đi kèm.
  14. `17.1` `mittābhirādhī`: `abhirādhī` dịch “làm đẹp lòng” (theo `ja108:1.4` “làm đẹp lòng vua”; `vv32:6.4` “làm vừa lòng”, `ja72:1.4` “khiến họ thỏa lòng”, `ja438:3.4` “làm hài lòng” là các cách dịch khác của cùng gốc); `17.2` `dhammaguṇe` dịch “những đức hạnh của Pháp” (xem thuật ngữ). Còn bất định: `dhamma` ở đây có thể chỉ chính đạo/công bằng của vua hơn là “Pháp” theo nghĩa giáo pháp; giữ “Pháp” như các tiền lệ.
  15. `18.2` `sabbātithī yācayogo bhavitvā`: `sabbātithī` đọc là “người mà mọi người là khách” tức “người tiếp đón mọi khách”, dịch “hãy là người đón tiếp mọi vị khách”; `ja391:7.2` có cụm này nhưng bản Việt ở đó không bám Pāli. Cách đọc khác “làm khách của mọi người” không hợp với `yācayogo`.

  **Lượt cải thiện 2026-10-13.** Đọc đối kháng lại đủ 83 cặp Pāli↔Việt, đo lại tiền lệ bằng số đếm trên toàn tầng (khoảng 281 nghìn khoá đã dịch) và đối chiếu với các bài song song trong kho (`ja516`, `an9.36`). Đổi 6/83 khoá, giữ nguyên tập khoá và thứ tự khoá; 77 khoá còn lại đã đọc lại và giữ.
  - `7.3`, `8.4` (terminology fix, kèm accuracy fix nhỏ): “tâm không dao động” → “tâm không nản”. `līna` là “uể oải, chùn xuống” (Sujato dịch “sluggish” ở `snp1.3`, `snp3.11`, `an10.76`); “dao động” là nghĩa khác (`ja156` là cách dịch duy nhất theo hướng đó, 3 khoá). Có tiền lệ `ja545:187.1` “không nản”.
  - `8.2` (accuracy fix): “lấy tảng đá làm phương tiện” → “dùng tảng đá để thử sức”, theo công thức `silāya yoggaṁ karitvā/katvāna` ở `ja516:21.3` và `an9.36:3.1`; xem bất định 4.
  - `11.2` (accuracy/consistency fix): “sao ngài còn nghi ngại mũi tên trên cung?” → “mũi tên trên cung, sao ngài còn do dự?”; `vicikicchase` ở `11.2` và `14.1` (cùng người nói) giờ cùng là “do dự”.
  - `16.2` (accuracy fix về phạm vi): đặt `ekassa` về đúng `mayhaṁ` (xem bất định 13).
  - `17.2` (terminology fix): “đức tính của Pháp” → “đức hạnh của Pháp”, theo 7/9 tiền lệ có nghĩa tương đương (xem thuật ngữ).
  - Sửa lại phần ghi chú sai của lượt trước (không đổi khoá nào): tiền lệ `mahābrahme` bị gán nhầm cho `ja254:2.3`; ba chỗ ghi “0 tiền lệ” (`pāṇado`, `dhammaguṇe`, `abhirādhī`) thực ra có tiền lệ.
  - Điểm đổi: `semantic_fidelity` 8,7 → 8,8 (hai chỗ nghĩa bị đọc sai: `yoggaṁ karitvā` và `alīnacitta`); `grammar_logic` 8,8 → 8,9 (chủ thể của `ekassa`, cấu trúc `11.2`); `terminology` 8,9 → 9,0 (ba khoá đổi theo tiền lệ đo được, một thuật ngữ nhất quán lại giữa `11.2` và `14.1`). Các tiêu chí khác giữ: `triangulation` 7,0 (vẫn không có tầng tham khảo tiếng Anh/Việt hiện hành), `ambiguity_integrity` 9,0 (đã phân xử được `yogga` bằng bài song song, nhưng thêm cách đọc khác của `kattā` và `dhamma`; các bất định 1, 5, 6, 8 vẫn còn nguyên), `segment_alignment` 10,0, `technical_integrity` 9,6. Không có cổng kỹ thuật nào được chạy ở lượt này (xem dưới).

  **Coverage English (mục 7):** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng là 34 ký tự (< 40) nên 0/79 khoá có nội dung; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận gap*. Sujato: 0 tệp cho `ja483` (`kn/ja` chỉ có 83 tệp, không gồm uid này); `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Ngoài bài này, đã dùng bản English của Sujato cho `ja51` và `ja52` chỉ để hiểu hai kệ lặp (cùng nguyên văn Pāli với `1.1`–`4.4`), không coi đó là tầng English của bài. Tôi không đụng `content/meta/reference-gaps.yaml`.

  **technical_integrity = 9,6:** bài này không chạy các cổng kỹ thuật, nên không tuyên bố technical gate pass. Bốn lệnh còn lại cần chạy trước khi đổi trạng thái: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 30 khoá chênh lệch lớn nhất → khác nghĩa 0: sửa 0, giữ 30, bất định 3 (`8.2`, `11.1`, `13.4`). Giữ `7.3`–`7.4` (bản mù tách `alīnacittassa`/`vikkantamanujīvasi` sang dòng khác, cùng nghĩa *ngài sống nhờ dũng lực của bậc có tâm không nản*); `16.2` `ekassa kattā` (bản mù *chỉ một mình đã làm* đọc `ekassa` thành của người làm, nhưng `ekassa` là sở hữu cách đi với `mayhaṁ` ở `16.1`, nên bản dự án đúng); `6.4`, `3.1`/`4.1`, `1.2`/`2.2`/`3.2`/`4.2`, `1.4`/`3.4`, `10.1`–`10.2`, `15.1`, `18.3`, `0.2`/`0.4`/`20.1`: khác diễn đạt, cùng nghĩa. Bất định `8.2` `silāya yoggaṁ … karitvā`: bản mù *làm phương tiện* ⟦?⟧; giữ *thử sức* theo `ja516:21.1`–`21.3` (cùng công thức, ngay trước đó con khỉ cầm tảng đá nặng), nhưng Pāli không nói rõ. Bất định `11.1` `pattiṁ`: bản dự án *vật có lông cánh*, bản mù *mũi tên* ⟦?⟧; hai cách đọc cùng chỉ vật có lông vũ, `11.2` `saraṁ` đã nêu mũi tên. Bất định nhỏ `13.4` `amarādhipo`: bản dự án *chúa tể của chư thiên bất tử*, bản mù *chúa của chư bất tử*; `ja543:116.2` cùng từ dịch *chúa tể của những bậc bất tử* (không thêm *chư thiên*), cần người biên tập chọn một cách cho cả hai bài. Review đối kháng toàn bài 83 khoá: nháy kép khớp Pāli từng khoá, không dấu lược, không số, xưng hô nhất quán; không phát hiện lỗi mới. Không có bản Anh hay bản Việt độc lập khác; `triangulation` chỉ dựa trên một lần dịch lại cùng họ công cụ nên bị giữ dưới 8,0. Lượt này không chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`; không tuyên bố technical gate pass.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; đoạn song song ja51, ja52, ja539:14–19, ja402:6.4, sn1.41:5.5, ja512:31.4): sửa 4 khoá — 13.2 `disampati` "chúa tể một phương" → "hỡi chúa tể các phương" (`disā-pati` là chúa các phương; "một phương" là thêm số lượng sai, và là cách dịch lẻ duy nhất trong kho, đa số dùng "chúa tể các phương"); 15.4 `na tveva hañño` "nhất định không bị giết" → "nhất định không được giết" (`hañño` là phân từ cần phải, "không đáng/không được giết", không phải dự đoán); 9.4, 16.4 bỏ dấu chấm thừa sau "?”".
  Giữ 1.1–4.1 "Chỉ nên mang hy vọng / Chỉ nên cố gắng, người đàn ông", 5.2 "hy vọng về sự đến của hạnh phúc", 1.4/2.4: Pāli trùng nguyên văn ja51, ja52 (published) và ja539. Khuôn này có vấn đề thật: `eva` ở `āsīsetheva`/`vāyametheva` là nhấn mạnh ("hãy cứ hy vọng / hãy cứ cố gắng"), không phải giới hạn "chỉ nên"; "người đàn ông" đứng như hô ngữ trong khi `puriso` là chủ ngữ (sn11.8, ja124 đã dịch "Con người phải nỗ lực", "Người hãy cố gắng"). Cần người biên tập sửa đồng loạt ja51/ja52/ja483/ja539, không sửa lẻ một bài. Bất định còn lại như mục trước: 8.2, 11.1, 13.4 `amarādhipo`; 9.4 `bhiṁsarūpaṁ` "đáng kinh sợ" (có thể là "phi thường, đáng nể") cũng lệch ja402:6.4.

  Lô G4 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): sửa khuôn kệ Āsīsetheva/Vāyametheva puriso. Bản
