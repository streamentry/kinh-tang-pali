notes: |-
  `Brāhmaṇarājavādapañha`, câu hỏi thứ tám của `Santhavavagga`; 35 khoá, tất cả đã dịch. Đây là bài **dài nhất lát** về mặt văn xưng: sáu đoạn định nghĩa `brāhmaṇo` và sáu đoạn định nghĩa `rājā` theo đúng một khuôn *“X là người …; bạch đại vương, Đức Thế Tôn cũng vậy; vì lý do ấy nữa, Đấng Như Lai được gọi là …”*. TẦNG THAM KHẢO — đo, không đoán. 0/7 bài `kn` của lát này có bản Anh Sujato tại commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud` (đếm trực tiếp trên đĩa: cp 35, dhp 26, iti 11, ja 83, kp 9, snp 5, thag 264, thig 73, ud 8 tệp) — **không có `mil`**, và `ja374/376/407/412` không nằm trong 83 tệp `ja` ấy. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit đã ghim có đúng 26 tệp và tất cả đều là `dhp*` (Pháp Cú). Lớp lấp `english-project` của dự án không có uid nào trong lát. Ba tầng tham khảo đều vắng ⇒ bài dịch chỉ từ Pāli root ⇒ blocker thật, và đây là **giới hạn upstream**, không phải lỗi của người dịch. Vì vậy `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng để né blocker, và `status` là `draft` vì `scripts/validate.ts` coi tệp Anh thiếu là **error** khi status là `review` hoặc `published`.

  `0.1` → *Milindapañha* (168 bài mil), `0.2` → *Meṇḍakapañha* và `0.3` → *Santhavavagga* **giữ nguyên Pāli**, theo `mil5.5.2`, `mil5.5.4`, `mil5.5.10` (3 bài mil5.5.* đã merge); `mil5.5.7` dịch *Phẩm Santhava* và `mil5.1.9` dịch *Phẩm Meṇḍakapañha* — 1/3 và 2/9, không đủ để đổi. Ghi lại để người điều phối gộp.

  VĂN XƯNG — chọn theo bầy lân cận và đếm được trên toàn tầng `kn`: `bhante nāgasena` → **bạch ngài Nāgasena** (đếm `bạch ngài` 105 lần, `bạch thầy` **0** lần) và `thưa ngài Nāgasena` ở vị trí mở lời (theo `mil5.5.2:1.1`, `mil5.5.4:1.1`, `mil5.5.10:1.1`); `mahārāja` → **tâu đại vương** (390 lần, mạnh hơn *thưa đại vương* 130 và *bạch đại vương* 5); `thero` → **Trưởng lão**; `āyasmā` → **Tôn giả**; `bhagavatā`/`tathāgato` → **Thế Tôn** / **Đấng Như Lai**; `ajjhayana` → **chinh phục**; `vipassana` → **thấy biết rõ ràng**.

  DÙNG LẠI NGUYÊN VĂN — ĐẾM ĐƯỢC 8/8 khoá có Pāli trùng: `0.1`–`0.3`; `1.2` `Puna ca bhaṇitaṁ—` → *Lại nữa, đã được nói rằng:*; `1.4` → *Bạch ngài Nāgasena, nếu Thế Tôn đã dạy rằng:*; `1.6` `Yadi tathāgatena bhaṇitaṁ—` → *Còn nếu Đấng Như Lai đã dạy:*; `16.3` → *“Lành thay, thưa ngài Nāgasena, đúng là như vậy, trẫm xin kính nhận”.* (y hệt `mil5.5.4:7.4`).

  DANH SÁCH CHÍNH THỨC `brāhmaṇo` — DỊCH ĐỦ CẢ TÁM MỤC, KHÔNG LƯỢC. Ở `3.2` có tám vị từ `bāhitā … upasantā`; `4.1`–`10.1` có tám định nghĩa. Không khoá nào có `…pe…`, nên không dùng `…` ở đâu cả: nội dung bị nén ở đây **không** lặp lại ở chỗ khác trong bài, và §10.2 của `BRIEF_VI3.md` nói rõ phải viết đủ. Bản nháp đầu tiên có lối rút gọn ở `12.1` (bỏ `anūṇasatasalākālaṅkataṁ`) — đã viết lại đủ.

  `brahāsukhavihārajjhāna` ở `8.1`–`8.2` dịch *tầng thiền cao quý của cõi Phạm thiên*; `aggaseṭṭhavarapavaradibba` ở `6.1` dịch *lửa, ngọc, vàng và những thứ quý báu* — đây là tứ trụ `tejobhāga` của Pháp Cú, nên giữ đủ bốn mà không rút còn một. `āṇa` ở `15.1` là điều khoản vi phạm thứ tư của bộ Tứ Phần, dịch *tội lỗi vượt quá giới luật*; `sāsanavare … jinasāsanavaramhā` giữ là *giáo luật của bậc Giác Ngộ* để phân biệt với `sāsana` (giáo luật, tức điều Ngài đã tuyên).

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó — BRIEF cấm `npm run validate|test|build|check` trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6** vì mọi chốt tự động của `_hvi.kiểm` đã xanh (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên văn Pāli, không lọt Pāli, khớp số dấu lược) và 35/35 khoá của chính bài này; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.
