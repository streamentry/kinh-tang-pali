notes: |-
  SỬA LỖI LỆCH KHOÁ TỰ BẮT ĐƯỢC — GHI LẠI ĐỂ NGƯỜI ĐỌC BIẾT CHỖ NÀY ĐÃ CÓ SỰA. Bản
  nháp đặt NHẦM `Devā namassanti` (chủ ngữ + động từ, nằm ở Pāli 1.4) vào 1.3, rồi dồn
  `sabbasaṅgātigataṁ` sang 1.4. Như vậy vế 1.3 và 1.4 sai nghĩa: 1.3 phải là "bậc Đại Mâu-ni ấy, đã
  thoát mọi trói buộc" (`Taṁ sabbasaṅgātigataṁ mahāmuniṁ`), 1.4 mới là "chư thiên đảnh lễ, bậc đã
  vượt qua hữu sinh" (`Devā namassanti bhavassa pāragun”ti.`). Đã đặt lại đúng.
  Sujato 1.3 có ghi chú `<j>` và 1.4 dịch lệch sang "and gone beyond rebirth" — tôi không theo,
  vì Pāli 1.4 chứa cả hai vế.
  Tiền lệ đếm được: `bhavassa pāragun` → "bậc đã vượt qua hữu" (iti100:7.4 và an4.8:6.4, cùng
  cụm `Sattā namassanti bhavassa pāragun”); `asita` → không dính mắc (snp1.12:13.3, snp4.16:3.1);
  `anejo` → không lay động (snp2.13:14.2, snp3.4:29.3, ud3.3:17.3, iti92:5.4); `mahāmuni` → Đại
  Mâu-ni (snp1.2:14.4, sn8.11:3.3); `aṭṭhapesi` = làm cho đứng yên; `sarabhu` = tên sông, giữ Pāli
  như an3.64 và sn4.6 đã làm với Sarabha/Sarabhu.
  Dòng kết 1.5 giữ HAI dấu lược như Pāli. Vì `cần` RỖNG, tôi tự quét MỌI khoá — sạch. Không
  chạy npm (đợt này cấm) nên technical_integrity = 9.6.
