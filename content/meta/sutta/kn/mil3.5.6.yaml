notes: |-
  Đã đọc HẾT Pāli lát qua v5/p5.txt trước khi viết. Không segment nào của lát này có …pe… nên hai phía đều 0 dấu lược. Mọi dấu nháy kép đều cân trên cả bài.
  Khung đối đáp giữ nguyên một cách dịch với mil3.4.9, mil3.5.4, mil3.7.13: Vua nói, Trưởng lão nói, thưa tôn giả Nāgasena, này Đại vương, và câu chốt Khéo lắm, thưa tôn giả Nāgasenā. Colophon Câu hỏi về …, thứ N.

  Buddhavagga → Phẩm Đức Phật theo mil3.5.4, cùng quyển 3 và cùng phẩm.
  Tiền lệ có đếm: Veda (53, gồm thông thạo ba Veda, tinh thông ba Veda); toàn tri (8);
  bản chất (58); Nāgasena và Nāgasenā theo mil3.4.9.
  0 tiền lệ, đặt mới: vedagū → bậc thông đạt Veda. Pāli chỉ nói người thông đạt Veda
  chứ không nêu số ba hay bốn bộ, nên không thêm. paramatthena → xét về mặt bản chất
  (0 tiền lệ riêng cho paramatthena, đặt mới; bản chất thì có 58 lần).
  Giữ cả hai vế của phép phủ định: vua hỏi có hay không, trưởng lão đáp không có —
  vế 1.4 có paramatthena nên là không có về mặt bản chất, không phải không có tuyệt
  đối; đã dịch là xét về mặt bản chất thì không có, giữ đúng mức độ chắc chắn.
