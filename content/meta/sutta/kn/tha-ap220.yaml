  (tên cây từ nguồn, có thật ở bốn khoá của chính bài này). Không khai bừa từ nào khác. Ngoài ra
  `:0.1` cố ý trùng nguyên văn Pāli `Therāpadāna` — đó là tiêu đề tuyển tập, 348/357 bài đã dịch
