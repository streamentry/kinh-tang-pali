  BẤT ĐỊNH CÒN LẠI, ghi ở đây chứ không giải thích trong thân kinh. Đây là bài nhiều bất định
  nhất trong lát, và cả ba chỗ đều KHÔNG có tiền lệ dịch sẵn trong tầng:
  (1) `Samuggataṁ` (`:3.3`) là **hapax theo nghĩa danh hiệu** — trong Pāli root của cả 5 bộ nó
  chỉ xuất hiện 12 lần ở 10 bài, và 11 lần mang nghĩa **về vật liệu** (`pe8:306.12` *như con
  tắc kè non*, `tha-ap56:5.2` *bảy tầng, xây cất chắc chắn*, `thig14.1:14.1` *hoa sen, con vượt
  non từ hươu*) chứ không phải danh hiệu Đức Phật; chỉ `mn56:29.45` là danh hiệu nhưng bản
  Việt đã có lại dịch là *Bậc vượt lên, hành thiền* — tức không truy được. Dịch *sinh ra từ
  hươu* theo nghĩa chữ nghĩa (`samā` = hươu cái, `samuggata` = sinh ra từ hươu). Đây là chỗ
  dễ sai nhất của bài và là lý do `semantic_fidelity` 9.0 và `ambiguity_integrity` 8.8.
  (2) `kusāṭa` (`:1.1`, `:3.1`, `:5.2`, `:5.4`) là **hapax toàn Pāli root** (đúng 4 khoá, không
  bài nào khác), và tầng chỉ có `kusaṭṭhakadāyaka` (một vị Trưởng lão khác) dịch *cỏ kusa* —
  khác cây. Không bịa một loài cây: giữ nguyên Pāli *cây kusāṭa*, đúng như tầng giữ *cây
  tinduka*, *cây koraṇḍa*. Bốn khoá dùng cùng một cách để bài tự nhất quán.
  (3) `Usabhaṁ pavaraṁ aggaṁ` (`:2.3`) — tầng có 5 tiền lệ cho `usabha` và cả 5 đều dịch
  *con bò mộng* (ja295:1.1 *Thân ngươi như thân bò mộng*), còn snp3.9:58.1 thì **gộp mất**
  `usabha` vào *bậc tối thượng*. Giữ hình ảnh *Bậc Bò Mộng* để không làm phẳng ba danh hiệu.
  (4) `Tissaṁ buddhaṁ gaṇuttamaṁ` (`:2.4`) — `gaṇa` chỉ có 1 tiền lệ (vv46:7.2 *hội chúng*);
  dịch *bậc Tối Đỉnh Trong Hàng Phật* vì `buddhaṁ` đứng ngay trong cùng câu.

  KHAI TỪ VỚI HARNESS (không sửa `_hvi.py`, chỉ bổ sung bộ nhớ tiến trình). `lọt_pāli()` chỉ truyền
