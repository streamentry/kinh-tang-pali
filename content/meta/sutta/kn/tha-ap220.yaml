  BÀI NÀY LÀ BẢN SONG CẤU TRÚC CỦA `tha-ap221`: cùng phẩm `Hatthivagga`, cùng 32 khoá,
  cùng cấu trúc (`:0.1–:0.3`, bảy bài kệ `:1.`–`:7.`, `:8.1` *Itthaṁ sudaṁ*, `:9.1` khoá đóng
  mang số thứ tự) ⇒ dùng làm khuôn định dạng và đối chiếu thuật ngữ.

  SỐ THỨ TỰ Ở `:0.3` — ĐO LẠI trên **357** bài `tha-ap` có cả Pāli `:0.3` lẫn bản Việt `:0.3`
  (lớp dùng để đo có 5.361 tệp Việt, 153.717 giá trị): Pāli KHÔNG có số thứ tự ở 242 bài, CÓ số ở
  115 bài; trong 242 bài Pāli không có số thì bản Việt cũng không có **240 bài = 99,2%** (chỉ
  tha-ap117 và tha-ap427 lệch); trong 115 bài Pāli CÓ số thì Việt giữ 66, bỏ 49. Đây là phép đo
  theo hướng lát s7 — hỏi đúng câu hỏi: *khi nguồn im lặng, bản dịch có im lặng theo không* —
  và nó thống nhất với ba lát trước (66/275, 73/274, 127/291 đều kết luận BỎ) dù tỉ lệ khác nhau.
  ⇒ `tha-ap220:0.3` Pāli là `Akkantasaññakattheraapadāna` — **KHÔNG có số** — nên số bị BỎ khỏi
  `:0.3` và đặt vào khoá đóng `:9.1` (`aṭṭhamaṁ` → *thứ tám*), đúng như tha-ap221 và 240 bài khác.

  TÊN Ở `:0.3` VÀ KHOÁ ĐÓNG — đo tiền tố ở **363** bài `tha-ap` đã dịch đủ: `:0.3` → *tuyên ngợ*
  200 / *ký sự* 88 / *tuyên ngôn* 65 / *tuyên ngợi* 10; khoá đóng → 199 / 88 / 66 / 10. Toàn tầng
  thì đa số là *tuyên ngợ*, nhưng **cục bộ `Hatthivagga` thì ngược**: trên 6 bài dịch đủ,
  *ký sự* 4 (tha-ap217, 219, 221, 222) và *tuyên ngợ* 2 (216, 218); riêng bốn bài sát nhất
  (217, 219, 221, 222) thì *ký sự* 4 : 0, và tha-ap221 dùng *Ký Sự* ở CẢ `:0.3` lẫn khoá đóng.
  Chọn **Ký Sự** theo đa số cục bộ, vì điều kiện cứng hơn cả đa số là `:0.3` và khoá đóng phải
  cùng một cách gọi — nếu không người đọc thấy hai tiêu đề khác nhau cho cùng một bài. Số đếm
  ghi lại để người điều phốn gộp cả phẩm một lần nếu muốn thống nhất theo đa số toàn tầng.
  Tên riêng giữ Pāli ở CẢ HAI khoá (đúng như tha-ap221 Sappidāyaka) để bài không tự mâu thuẫn.
  TÊN PHẨM `:0.2`: `Hatthivagga` cục bộ *Phẩm Hatthi* 4 / *Phẩm Bậc Voi* 2 ⇒ **Phẩm Hatthi**;
  tầng `name/` của SuttaCentral tại commit đã ghim cũng đặt phẩm theo Hatthi
  (`tha-ap-name:234.tha-hatthivagga`). `:0.1` giữ `Therāpadāna` — 348/357 bài đã dịch.

  NGÔI KỂ — đo riêng khoá kệ, đã bỏ mọi dòng `Tôi nghe như vầy`. Toàn tầng `tha-ap` (7.426 khoá
  kệ): `ta` 4.630 / `tôi` 2.876 ⇒ đa số `ta` (61,7%). Cục bộ `Hatthivagga` (131 khoá): `ta` 16 /
  `tôi` 13 ⇒ nghiêng `ta`; bài song cấu trúc tha-ap221 dùng `ta` 6 : 0. Chọn **`ta`** cho bài này.
  Hệ quả phải nói thẳng với người điều phốn: cùng một Pāli `Duggatiṁ nābhijānāmi,` được dịch
  bằng `ta` ở 220 (`Ta không biết mình rơi vào khổ đau,` — 121 lần trong tầng, nhiều nhất) và
  bằng `tôi` ở 198/199 (`Tôi không còn biết đến đọa xứ nào,` — 62 lần, và nghiêng 17:1 về `tôi`
  trong `Tamālapupphiyavagga`). Đây là hệ quả của việc mỗi phẩm một đa số riêng; gộp lại thì
  một trong hai bên phải đổi. Ghi ra đây chứ không tự ý thống nhất, vì tha-ap221 (bài kề bên,
  cùng cấu trúc) dùng `ta` và tha-ap219 (bài kề bên kia) dùng `tôi` — tầng vốn đã tách.

