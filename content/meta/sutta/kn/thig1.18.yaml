notes: |-
  **Tự kiểm, vì `cần` RỖNG.** `kiểm()` của `_hvi.py` không chạy assertion nào cho bài này (mọi vế kệ < 40 ký tự). Tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá `all`, NFC, **số dấu lược khớp Pāli từng khoá**, ngoặc kép cân trên cả bài, không Pāli lọt, không còn `(…)`, không trùng Pāli, `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Bốn vế PĀLI TRÙNG Y HỆT với bài đã `published` — dùng lại nguyên văn, không dịch lại.** `1.2` `hitvā puttaṁ pasuṁ piyaṁ;` · `1.3` `Hitvā rāgañca dosañca,` · `1.4` `avijjañca virājiya;` trùng `sn1.28:3.2`, `:3.3`, `:3.4` (đã `published`); `1.5` `Samūlaṁ taṇhamabbuyha,` trùng `thig1.15:1.3`. Nên `1.2`–`1.4` phải đúng ba câu *từ bỏ con cái, gia súc và những gì thân thương;* · *sau khi từ bỏ tham và sân,* · *sau khi diệt trừ vô minh;*, và `1.5` phải đúng *đã nhổ lên ái cùng gốc rễ,*. `sn1.28` và `thig1.18` còn là **cùng một công thức**: `Hitvā…` + `hitvā rāgaṃ…` + `avijjañca virājiya`. Riêng `1.1` Pāli khác (`Hitvā ghare pabbajitvā` so với `Hitvā agāraṁ pabbajitā`), nên tôi dịch riêng.

  **Dòng lược `2.1` = `… Saṅghā therī ….`** → hai dấu lược giữ nguyên (BRIEF_VI3 §10.1), **không** mở rộng thành *Bạch Thế Tôn, vị trưởng lão nữ Saṅghā đã từng nói bài kệ này* như `thig1.10`–`1.16` đang làm — mở rộng là thêm chữ không đánh dấu, và `thig1.7`/`1.8`/`1.9` (đã có) dùng đúng dạng lược này.

  **`3.1` `Ekakanipāto niṭṭhito.`** — bài này là bài CUỐI của Ekakanipāta trong Therīgāthā, nên có dòng niết tập. Tôi dịch *Bộ Một Bài Kinh đã hoàn tất*: `niṭṭhitaṃ` ở cấp tập/tome đã là *đã hoàn tất* (`an6.170-649:1.29` *Chuỗi Lặp Tham đã hoàn tất*), còn `Ekakanipāta` dùng đúng cách gọi *Bộ Một Bài Kinh* của tầng (160 chỗ) chứ không phải *Phẩm Một Pháp* của 27 bài `iti`.

  **Tiền lệ, đếm được.**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: `Ekakanipāta` → *Bộ Một Bài Kinh* (160). `<X>therīgāthā` → *Kinh Kệ Của Trưởng Lão Nữ <X>* (17 chỗ, `thig1.10`–`1.16`). `ghare` → *nhà cửa* (theo `sn1.28:3.1` *từ bỏ nhà cửa, xuất gia* cho `Hitvā agāraṁ pabbajitā`). `pasuṁ` → *gia súc* (theo `sn1.28:3.2`, cùng Pāli). `virājiya` → *diệt trừ* (theo `sn1.28:3.4`, cùng Pāli).

  **Bất định đã ghi.** `upasantāmhi nibbutā”ti.` là **số nhiều cách** của `asmi` — *ta đã lắng xuống, ta đã nguội lạnh*. `upasanto` dịch *lắng xuống* theo `thig1.16:1.3` (`Upasanto hi te rāgo` → *bởi tham của ngươi đã lắng xuống*) và *an tịnh* theo `thig1.14:1.4`; `nibbutā` dịch *nguội lạnh* theo `thig1.15:1.4` và `thig1.16:1.4` (*nguội lạnh* cho `sītibhūtāsi nibbutā`). Cả hai chữ đều là mệnh đề độc lập, nên tôi lặp *ta* hai lần như Pāli, thay vì rút thành một cụm.

  **Văn phong khác `thag1.*`.** Đây là kệ trưởng lão nữ nói về chính mình, nên tôi dùng *ta* ở `1.1` và `1.6`, khác nhịp *tôi* của `thag1.66`; và tôi không kéo sang dạng *Bạch Thế Tôn, …* của nhóm `thig1.10`–`1.16` cho dòng kết.

  **Không có bản Việt tham khảo** tại commit đã ghim (`translation/vi/` bilara chỉ có 26 tệp Pháp Cú); `triangulation` là Pāli + English Sujato (9/11 — thêm `3.1` trống vì Sujato không có tệp cho bài này, và `2.1` trống vì dòng lược).

  **`technical_integrity` 9,6** vì đợt này cấm `npm run validate|test|build`, và `kiểm()` rỗng với bài này.
