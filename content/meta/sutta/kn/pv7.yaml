notes: |-
  TẦNG THAM KHẢO — đo (xem `blocking_errors`). Coverage Anh = **0/0**: cả 48 khoá Pāli dưới 40 ký tự.
  ⇒ `draft`, `triangulation` 7.5.

  48 khoá, đủ 48/48, không orphan/thừa/rỗng, NFC sạch, dấu lược: bài **không có** `…pe…`. Nháy kép: 4 cặp
