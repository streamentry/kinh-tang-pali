  dùng nháy cong `‘`/`’` theo Pāli.

  PĀLI TRÙNG NGUYÊN VĂN — **20/48 khoá** của pv7 trùng Pāli với pv6 đã dịch (cả 20 đều có bản Việt) và tôi
  dùng lại **nguyên văn cả 20**: `“Naggā dubbaṇṇarūpāsi,` `duggandhā pūti vāyasi;` `Makkhikāhi
  parikiṇṇā,` `kā nu tvaṁ idha tiṭṭhasī”ti.` (`1.1–1.4`) · `“Ahaṁ bhadante petīmhi,` `duggatā yamalokikā;`
  `Pāpakammaṁ karitvāna,` `Vijāyitvāna khādāmi,` `tepi nā honti me alaṁ.` `Pariḍayhati dhūmāyati,`
  `khudāya hadayaṁ mama;` `“Kiṁ nu kāyena vācāya,` `manasā dukkaṭaṁ kataṁ;` `Kissa kammavipākena,`
  `puttamaṁsāni khādasī”ti.` `Sāhaṁ paduṭṭhamanasā,` `Tadassā mātā kupitā,` `mayhaṁ ñātī samānayi;`
  `Sapathañca maṁ kāresi,` `paribhāsāpayī ca maṁ.` `Sāhaṁ ghorañca sapathaṁ,` `musāvādaṁ abhāsisaṁ;`
  `Puttamaṁsāni khādāmi,` `Tassa kammassa vipākena,` `musāvādassa cūbhayaṁ;`
  `pubbalohitamakkhitā”ti.` — tôi đã kiểm lại bằng script từng cặp, byte-for-byte khớp.

  THUẬT NGỮ, đếm được: `Petavatthu` giữ Pāli (20/20) · `Uragavagga` → *Phẩm Rắn* (6/6, đồng nhất pv45
  không dùng phẩm này) · `Pañcaputtakhādapetivatthu` → *Chuyện Ngạ Quỷ Ăn Thịt Năm Đứa Trẻ* (pv6:0.3)
  ⇒ `Sattaputtakhādapetivatthu` → *7. Chuyện Ngạ Quỷ Ăn Thịt Bảy Đứa Trẻ*; dòng đóng `… sattamaṁ.` → *…, thứ
  bảy.* với chữ thường ở đầu dòng đóng, đúng như `pv6:10.1` và `pv44:9.1`.

  BẤT ĐỊNH:
  (1) `mayhaṁ ñātī samānayi;` (9.2) — tôi dùng lại **nguyên văn** `mang tôi, người họ hàng của tôi, đến nơi
      quả báo của tôi;` của pv6:7.4 vì Pāli trùng nguyên văn. Tôi biết vế cuối là **diễn giải thừa** so với
      Pāli khoá này (Pāli chỉ nói *mang tôi, người thân, đến chỗ*); giữ nguyên văn là đánh đổi *tính nhất
      quán giữa hai bài* lấy *một câu dài hơn Pāli ở một khoá*. Ghi lại để biên tập quyết.
  (2) `pūtilohitako pati.` (8.4) — `pūtilohitaka` = bẩn thối lẫn máu; `pati` không có tiền lệ và trong câu
      này tôi đọc là động từ *rơi ra*, dịch *bẩn thối lẫn máu, đã rơi ra.* (cách đọc thứ hai: `pati` là danh
      từ *chồng*, khi đó câu phải hiểu theo nghĩa khác hẳn và cần xem lại cả đoạn `8.1–9.2`).
  (3) `Sāhaṁ ghorañca sapathaṁ, musāvādaṁ abhāsisaṁ; 'Puttamaṁsāni khādāmi, sace taṁ pakataṁ mayā'.`
      (10.1–10.4) — `sace` là điều kiện; tôi giữ thứ tự Pāli: *Tôi đã lập lời thề đáng sợ ấy, / đã nói lời
      điêu trá; / 'Tôi ăn thịt trẻ con, / nếu đúng như thật ta đã làm'.* — không đải câu để làm rõ hơn.
  (4) `ubho sampattayobbanā` (6.2) — đọc là *cả hai đều đã trưởng thành* (`sampatti` = đạt tới, `yobbanā` =
      tuổi thành thân). Không có tiền lệ trong tầng.
  (5) `Sā ca gabbhaṁ alabhittha, / tassā pāpaṁ acetayiṁ.` (7.3–7.4) — `acetayi` = bào chế (thuốc);
      dịch *Bà ấy lại không mang được thai, / bèn bào chế một thứ thuốc độc để hại.* Tôi không nêu rõ thuốc
      nhắm vào ai, vì Pāli chỉ nói `tassā` mơ hồ.

  CỔNG KỸ THUẬT CHƯA CHẠY — xem `blocking_errors` và `pv45.yaml`. `technical_integrity` 9.6, không
  tuyên bố technical gate pass. Bốn lệnh để coordinator chạy: `npm run validate`, `npm test`,
  `npm run check`, `npm run build`.

  Lượt cải thiện 2026-10-11 (THAY THẾ các mục "PĀLI TRÙNG NGUYÊN VĂN" và "BẤT ĐỊNH" (1)–(5) ở trên:
  những mục ấy dựa trên bản dịch cũ có nhiều lỗi nghĩa thật, và việc "dùng lại nguyên văn pv6" đã chép
  chính các lỗi của pv6 sang bài này). Đọc đối kháng 48 khoá Pāli↔Việt, đổi 41/48 khoá (giữ nguyên 0.1,
  0.2, 3.3, 5.1, 5.2, 5.3, 11.1: công thức có tiền lệ đúng hoặc đã đúng). Chia loại:
  (a) Đảo nghĩa / sai nghĩa thật: 7.3 `alabhittha` = ĐÃ mang thai (bản cũ "không mang được thai" đảo nghĩa
  và kéo theo 7.4 bịa "bào chế thuốc độc"); 7.4 `acetayiṁ` = mưu tính điều ác; 9.2 `ñātī samānayi` = tập
  hợp bà con của tôi (cũ "mang tôi … đến nơi quả báo của tôi", sai cả chủ thể lẫn tân ngữ); 9.3 `kāresi` =
  bắt tôi thề; 9.4 `paribhāsāpayī` = khiến tôi bị quở trách; 6.3 `puttabalūpetā` = có đủ sức mạnh của con cái
  (cũ "ta lại mất sức của con", đảo nghĩa); 8.2 `gabbhapātanaṁ` = làm cho sẩy thai (cũ "thai nở rơi"
  vô nghĩa); 8.4 `pūtilohitako pati` = thối rữa, đẫm máu, đã rơi ra; 1.1 `naggā` = trần truồng (cũ "gầy
  gò"); 1.2 `pūti vāyasi` = ngươi bốc mùi thối rữa (cũ "túi đựng thối nhoài", chữ vô nghĩa); 11.4
  `pubbalohitamakkhitā` = dính mủ và máu (cũ "thứ thịt đã bị bôi vẽ bằng máu", sai cả `pubba` = mủ lẫn chủ
  thể: chính ngạ quỷ bị dính, không phải miếng thịt); 10.4 `sace taṁ pakataṁ mayā` = nếu việc ấy do tôi làm
  (cũ "nếu đúng như thật ta đã làm", đổi ngôi).
  (b) Phạm trù từ đã biết là sai: `petī` = ngạ quỷ nữ (cũ "ma"); `duggatā` = khốn khổ (cũ "sinh về cõi khổ xa
  xôi"); `petalokaṁ ito gatā` = từ đây đã đi đến cõi ngạ quỷ (cũ "thế giới của người đã chết", thêm cả "từ đây
  đi sang" sai hướng); 4.1 `pariḍayhati dhūmāyati` = bị thiêu đốt, bốc khói, với chủ ngữ `hadayaṁ` ở 4.2 (cũ
  "Tôi cháy cháy", chữ vô nghĩa); 4.3 `nibbutiṁ` = sự mát dịu, theo hình ảnh lửa ở 4.4 và tiền lệ pv8:7.2.
  (c) Xưng hô, ngôi, dấu: người hỏi gọi ngạ quỷ "ngươi", ngạ quỷ xưng "tôi" và gọi "bạch ngài" (cũ lẫn
  "tôi/ta/con": 6.3 "ta", 6.1 "Ôi là tôi"); 5.4 bỏ "ta" bịa (Pāli chỉ nói `puttamaṁsāni`);
  nay giữ "tôi" suốt lời ngạ quỷ để khỏi lẫn với "con" là con cái; câu hỏi 1.4, 5.4 đóng bằng `?”`.
  (d) Thêm nghĩa/bỏ sót: 3.4 bỏ "no" thêm; 2.1–2.4 thống nhất "tôi" (cũ lẫn "con/tôi"); 7.2 `sapatiṁ` = người vợ chung
  chồng (cũ "người vợ thứ hai"); 6.2 `sampattayobbanā` = đã đến tuổi thanh xuân.
  (e) Tiêu đề: `Sattaputtakhāda…` đổi `0.3` và `12.1` từ "Bảy Đứa Trẻ" thành "Bảy Đứa Con" (đã đổi
  `translationTitle`), vì `putta` là con của chính bà (ngạ quỷ "sinh ra rồi tôi ăn chúng") và `6.1`, `10.3`
  của bài dùng "con"; chưa đồng bộ với pv6 (tiêu đề "Năm Đứa Trẻ"), việc đó ngoài tệp được phép sửa.
  Tiền lệ đã đo: `Kissa kammavipākena` → "Do quả báo của nghiệp nào" 15/16, `manasā dukkaṭaṁ kataṁ` → "do ý
  mà đã làm;" 16/17, `Tassa kammassa vipākena` → "Do quả báo của nghiệp ấy," 4/4, `aggidaḍḍhāva ātape` →
  "như bị lửa thiêu đốt dưới nắng." (pv26:8.4), `Sāhaṁ ghorañca sapathaṁ` theo pv24:15.1, `musāvādassa
  cūbhayaṁ` → "và của lời nói dối, cả hai;" theo pv24:17.2 (đúng cú pháp: `ca ubhayaṁ`; pv6, pv29 và bản cũ
  của bài này dùng "cùng nghiệp nói dối cả hai điều;" (3/4) nhưng lệch cú pháp, nên không theo đa số), `paduṭṭhamanasā` → "với tâm ác
  ý" (đồng với `paduṭṭhacitto` = "tâm ác ý" ở sn; "ác nhiễm" ở pv6 chỉ có 2 chỗ và không có tiền lệ ngoài họ).
  Đo: tập khoá Việt = Pāli 48/48, thứ tự khoá = thứ tự Pāli, nháy “ ” ‘ ’ khớp Pāli từng khoá (0 lệch), NFC,
  không Pāli lọt sang Việt, không có `…`; một cặp Pāli trùng nguyên văn trong bài (`puttamaṁsāni khādāmi`
  ở 10.3 và 11.3), 0 cặp Việt khác; bài không có số Pāli.
  Bất định còn lại (không phân xử được, không có bản Anh và không có chú giải trong tầng đã ghim):
  (1) `Kālena` (3.1): giữ "Đến đúng thời"; vế đối `sāyaṁ` (buổi chiều) gợi nghĩa buổi sáng nhưng Pāli không
  nói, không thêm. (2) `pati` (8.4): đọc là aorist của `patati` (rơi), `pūtilohitako` đọc là tính từ của
  `gabbho`; cách đọc khác (danh từ `pati`, "chồng") không cho cú pháp đủ. (3) `paribhāsāpayī` (9.4): thể sai
  khiến, đọc là "khiến tôi bị quở trách"; không loại được cách đọc "bảo người khác quở trách". (4) `mayhaṁ
  ñātī` (9.2): đọc là "bà con của tôi" (sở hữu cách `mayhaṁ` với `ñātī` đối cách), mẹ của người vợ thứ hai
  tập hợp họ để buộc thề; Pāli không nói họ đến để làm gì. (5) `mayhamānayi` (7.2): `mayhaṁ ānayi`, giữ
  "đem đến cho tôi", không thêm "về nhà". (6) `sapati` dịch "người vợ chung chồng" (không phải "vợ lẽ", vì
  Pāli không nói thứ bậc). (7) `puttamaṁsāni` ở 5.4/10.3/11.3 dịch "thịt con" (không thêm "của mình"
  hay "của tôi"); lời Pāli chỉ nói `putta`. Điểm: semantic_fidelity 9.3→9.0, grammar_logic 9.2→9.1,
  terminology 9.2→9.1, vietnamese_clarity 9.2→9.0 (các lỗi nghĩa ở trên bị bản trước chấm quá cao; bản
  mới sửa gần hết nhưng còn bất định (1)–(4)); source_provenance, segment_alignment, han_viet_balance,
  ambiguity_integrity, technical_integrity giữ; triangulation giữ 7.5 (không có bản Anh độc lập).
  final_score 9.16→9.09. Blocker "không có tầng tham khảo tiếng Anh" giữ nguyên. Kỹ thuật:
  `technical_integrity` giữ 9.6; bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build`
  chưa chạy trong lượt này.
