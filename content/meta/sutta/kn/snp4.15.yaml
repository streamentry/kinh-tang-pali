notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B13 — snp4.15:11.3 (`kappa` = vọng tưởng, bỏ “tạo tác”/“sắp đặt” (trùng `saṅkhāra`)).

  Sửa lỗi nghĩa 2026-10-16: snp4.15:11.2 — "dòng xoáy" → "dòng chảy xiết" (`ājava` là dòng nước chảy
  xiết, ghềnh thác, không phải xoáy nước: DPD s.v. ājava "swift current; rapids; torrent"
  https://www.dpdict.net/search_html?q=ājava, trích chính câu kệ này; Sujato "current"; khớp
  mnd15:121.2 đã dùng "dòng chảy xiết").

  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 12.4, 20.3 (`santo` "tịch tĩnh" → "an tịnh" theo quyết định B19, khớp mnd15:128.4, 203.1) và 15.4 (`upasanto carissasi` "sẽ sống trong an tịnh" → "sẽ sống yên lặng": `upasanta` = "calmed; still" theo DPD, B19 chốt `upasanto` = "yên lặng", khớp mnd15:148.4, 152.1); bất định 18.1 (`aniṭṭhurī` giữ "không tàn ác": DPD "not harsh" và Sujato "not bitter" nghiêng về "cay nghiệt", nhưng lời giải Niddesa mnd15:189.3–4 giải `niṭṭhuriya` là ghen tị/đố kỵ và mnd15 vẫn giữ "tàn ác"; nên đổi đồng thời cả hai bài nếu đổi).
