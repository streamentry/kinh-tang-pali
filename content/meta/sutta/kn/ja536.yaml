  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").

  Nghiên cứu nguồn ngoài 2026-10-16: H.T. Francis (dịch), The Jātaka vol. V (PTS 1905, phạm vi công cộng; đọc qua static.sirimangalo.org/old/jataka/5.htm, Jātaka 536 tr. 219–246); đã đối chiếu các nhóm 27–122 (các kệ và đoạn văn xuôi về những người nữ, các ví dụ Kaṇhā, Saccatapāpī, Kākavatī, Piṅgiyānī, tám lý do khinh chồng, chín lý do tự hư hỏng, hai mươi lăm dấu hiệu, bốn thứ không bao giờ đầy, lời khuyên cuối của Kuṇāla và các kệ kết); Francis lược phần dạo đầu (các nhóm 1–26: đoàn chim hộ tống, mô tả khu rừng Himavanta, các loài cây và chim), nên các nhóm này chỉ dựa Pāli. Sửa 50.2 và 53.1 (`kuṅkumiyajātā`/`kuṅkumī`: bản cũ để nguyên chữ Pāli 'kuṅkumiya', không dịch được; chú thích Francis ghi chú giải giải thích là `kolāhalaṁ karoti` (gây ồn ào/náo động), đã dịch 'hay làm ồn ào'; DPD không có mục nên là cách đọc của chú giải, không phải xác nhận độc lập). Khớp các khoá khác: 44.2 '`sabbadhanaanuppadānena` việc trao hết của cải', 62.3/63.3 'kẻ giữ ngựa' (Francis 'royal groom' ở truyện Piṅgiyānī). Bất định giữ nguyên: 64.3 `nādevasatto` (Francis 'if not possessed'), 39 `Nerusamāgata`, 71.1 `lākhā`.

  Rà từng chữ bằng DPD 2026-10-16: 446 khoá đã rà (chú giải Jātaka-aṭṭhakathā bản CST, bản Việt Bhikkhu Indacanda TTPV 33 [536], cùng số; bảng DPD dựng từ cache vì API quá chậm: 822/2.286 chữ, phần lớn là chữ ghép dài trong văn xuôi `1`–`13`, chưa tra được, chỗ nghi đã tra riêng); sửa 11.1–11.2 (`susukhumasunipuṇa-girippabhava-harit-upayantiyo` là tính ngữ giống cái số nhiều của dòng nước phát nguồn từ núi, xanh, chảy đến; chú giải `evarūpā nadiyo`; không tả ngọn núi), 31.1 (`lomasuddarī` = `loma` + `udarī`, chú giải `lomarājiyā maṇḍitaudarā`, giữ chữ ghim, không theo dị bản `lomasundarī`; `dhanantevāsinā`: `dhana` không phải `dhanu` "cung"; chú giải và Indacanda: Chaḷaṅgakumāra và người hầu Dhanantevāsī), 35.1 (`gamaniyo` là danh từ, chú giải `gaṇikāyo`, không phải "không nên đến"; `bandhakī` = gái điếm, DPD bandhakinī, không phải "kẻ trói buộc"; `vadhikā` = kẻ giết chồng, chú giải `sāmikaghātikāyo`; giải bất định cũ), 49.2 (`oṭṭhaṁ upalikhati`: DPD upalikhati 2 "bites", chú giải `dantehi`, Indacanda: "liếm môi" → "cắn môi"), 58.4, 59.2 (`nivātaka`: DPD "sheltered place", Indacanda "nơi thuận tiện": "người nhún nhường" → "chỗ khuất kín"), 63.4 (thiếu `taṁ`: chú giải `taṁ assabandhaṁ … nājjhagā`; ja341:4.4 cùng lỗi, ngoài lô), 64.3 (`adevasatta` để phiên âm: chú giải `devena anāsatto ayakkhagahitako`, Indacanda: "không bị thần nhập"), 66.3, 78.3 (`āvāsu` = `āpadāsu` theo chú giải, DPD āpadā: thêm "lúc hoạn nạn" bị bỏ), 80.1 (`sākha` là cành, không phải `sakha` bạn; `santhata` tấm trải; chú giải `purāṇasākhāsanthataṁ`, Indacanda), 80.2 (kẻ cướp là bạn cũ, chú giải `"Purāṇamitto me" ti na vissaseyya`), 83.4 (Pāli trùng 73.4 nhưng bản Việt chưa đồng bộ sau lô 2026-10-15: dùng lại 73.4), 89.3 (`pupphachaḍḍaka`: DPD "janitor; toilet cleaner", chú giải `vaccaṭṭhānasodhaka`), 90.2 (`chavaka`: DPD "outcast", chú giải `caṇḍāla`; vế gắn với 90.1 hay 90.3 vẫn bất định), 100.3, 101.3 (Pāli trùng ja262:2.3/ja263:2.3: dùng lại "họ chìm xuống"; "nơi họ" thừa vì `naṁ` chỉ là tiểu từ theo chú giải), 111.4 (`dānavaṁ` đối cách là kẻ bị phản bội, `hadayantarassitā` chỉ người nữ được cất trong lòng; chú giải dẫn Ja 436, Indacanda), 116.4 (`chedagāmimaṇiyaṁ` là vật nhận về, song song `devatāhi … nirayaṁ`; chú giải `bālavāṇijo … chedagāmimaṇikaṁ gaṇhāti`, Indacanda: "đổi viên ngọc lấy…" → "đổi lấy viên ngọc sẽ nứt vỡ"); bất định 10.2, 25.8 (`asatiyo`: chú giải `naṭṭhassati`), 29.1, 36.1, 37.3 (`issasiṅgha` chữ ghim; chú giải đọc sừng con issa), 39.2, 86.1 (`asā`: DPD "not one's own", chú giải `asatiyo lāmakā`), 89.2 (`maṇḍala`), 108.4, 110.3 (`uhasanti`/`pahasanti`: chú giải cười lớn/cười mỉm, ngược thứ tự bản Việt; DPD không phân biệt), 114.1 (`nakhachinna`). Đã giải: 92.4 `dijampati` là hô cách gọi Kuṇāla (chú giải `dijajeṭṭhakaṁ kuṇālaṁ ālapati`), bản Việt đúng.

  Sửa sau kiểm độc lập 2026-10-16: 86.1 `asā` = asatiyo «bất lương» (chú giải «asā ti asatiyo lāmakā»; Indacanda «đê hèn»; như 10.2 cùng bài), không phải «vô chủ»; 83.4 `omasanti` = gặm (chú giải «omasanti khādanti»; Indacanda), giữ ví dụ đàn bò.
  Lượt hoàn thiện 2026-10-17: thống nhất thuật ngữ cho các chữ chỉ người nữ (`itthī`, `nārī`, `thī`, và các tính từ giống cái `paduṭṭhā`, `asatī`, `etā` chỉ người nữ): "người đàn bà"/"người nữ"/"đàn bà" → "phụ nữ"/"người phụ nữ" ở 42 khoá (`23.7`, `23.8`, `28.3`, `33.1`, `35.1`, `39.5`, `44.1`, `44.3`, `46.1`, `46.3`, `47.4`, `48.4`, `49.1`, `49.3`, `50.1`, `50.3`, `51.5`, `52.4`–`57.4`, `58.3`, `59.3`, `60.4`, `77.2`, `77.4`, `80.4`, `81.1`, `81.4`, `86.1`, `90.4`, `92.4`, `99.3`, `110.3`, `115.1`), theo cách đã chiếm đa số trong bài (khoảng 35 khoá) và cách dịch `pamadā` ở chính bài; khác biệt cũ chỉ do vế kệ, không do nghĩa. `73.4` `omasanti varaṁ varaṁ` "cứ với tới cái tốt hơn rồi cái tốt hơn nữa" → "cứ gặm chọn thứ ngon hơn, ngon hơn nữa" (Pāli trùng `83.4`, đã sửa theo chú giải `omasanti khādanti` ở lượt kiểm độc lập 2026-10-16 mà `73.4` chưa đồng bộ); `85.1` `coriyo` "những ả trộm cắp" → "những nữ tặc" (như `10.2`, `25.8`, `99.1`); `52.1` `asaññatā` "thiếu tự chế" → "không tự chế" (như `81.2`, `82.3`, `106.2`, `107.2`); `105.4` `rakkhasigaṇa` "la-sát nữ" → "nữ la-sát" (như `38.3`); `123.3` `gijjharājā` "vua kền kền" → "vua loài kền kền" (như `76.1`, `91.1`, `103.1`). Giữ: `purisa`/`nara` "người đàn ông"/"đàn ông" (một chữ Việt cho một nghĩa), `vasalī` "ả hạ tiện" và `vasala` "đồ hạ tiện" (khác giống). Thêm 12 chú thích (`10.2`, `29.1`, `36.1`, `50.2`, `64.3`, `73.4`, `86.1`, `89.2`, `90.2`, `92.4`, `108.4`, `114.1`) vào `content/comment/vi/project/sutta/kn/ja536_comment-vi-project.json`, nêu chú giải CST, DPD và Indacanda. Các câu sau trong ghi chú cũ đã bị thay: "`triangulation` đặt 7.5 (không quá 8.0) và bài giữ `draft`" (hiện triangulation 8,4, status `review` theo waiver `no-upstream-english`; blocker vẫn ghi trong hồ sơ); "`0.2` Bộ Tám Mươi Bài Kinh" (nay "Nhóm Tám Mươi Kệ", C3); "`pamadā`/`nārī`/`itthī` → phụ nữ/người nữ/đàn bà tùy vế" (nay "phụ nữ", lượt này); trong mục bất định cũ: `11.1`–`11.2` "đang chảy về nơi xanh tươi", `31.1` "người đẹp tóc dày" và "người học trò cung thuật", `35.1` "kẻ trói buộc — kẻ sát nhân" và "không nên đến với", `49.2` "liếm môi", `50.2`/`53.1` giữ phiên âm `kuṅkumiya`, `58.4`/`59.2` "người nhún nhường", `64.3` giữ phiên âm `adevasatta`, `66.3`/`78.3` "đến lúc có việc cần kíp", `80.1`–`80.4` "người bạn quen biết từ lâu", "kẻ trộm cũ mà thành bạn", "mẹ của Dasanna", `89.3` "người dọn hoa tàn", `90.2` "kẻ chẳng khác gì xác chết", `92.4` giữ phiên âm `dijampati`, `100.3`/`101.3` "người ta chìm xuống nơi họ", `111.4` "như dānava ẩn trong lòng", `116.3`–`116.4` "bị chư thiên đổi lấy địa ngục" (đều đã sửa ở các lượt 10-14, 10-16 như ghi ở trên); câu ở lô 10-15 "`73.4` … với tới" (nay "gặm"); và câu ở đối chiếu mù "`dijampati` … là hô cách gọi Ānanda" (chú giải: gọi Kuṇāla, như lượt DPD đã ghi).
