notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja536_root-pli-ms.json` (446/446 khoá, đúng thứ tự Pāli, không khoá thừa). Bài là Jātaka có cả văn xuôi lẫn kệ: bốn dòng tiêu đề `0.1`–`0.4`; phần văn xuôi khung và truyện (`1`–`26`), các đoạn nói của Kuṇāla xen kệ (`27`–`75`), kệ của Ānanda (`76`–`90`), của Nārada (`91`–`102`), của Kuṇāla (`103`–`122`), kệ nhận diện `123`, dòng kết bài `124.1`. Dấu nháy kép mở ở `28.1` và đóng ở `75.4` bao cả đoạn văn xuôi `29`–`74`; tương tự `77.1`–`90.4`, `92.1`–`102.4`, `104.1`–`122.4`, `123.1`–`123.6`. Người nói suy từ Pāli (`76.1`, `91.1`, `103.1` nêu rõ người nói).
  - Tầng tham khảo:
    Tầng English của Sujato không có ja536 (ja chỉ có 83 tệp: ja1–79, ja126, ja159, ja466, ja534; đây là not-published-upstream, không phải not-synced); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Cả ba tầng tham khảo đều vắng. Chỉ dựa vào Pāli, tiền lệ Việt của tầng (đặc biệt `ja535`, `ja533` cùng phẩm; `ja341`, `ja464`, `ja507`, `ja519` cho các bài kệ trùng) và bối cảnh của chính bài. Tiền lệ Việt trong tầng do cùng một nhóm dịch nên không phải đối chiếu độc lập. Ở vài chỗ khó (số lượng thiếu nữ chim, thân thế Kaṇhā, cách đọc `kabandha`, hai mối quan hệ của Kuruṅgadevī) đã kiểm hướng đọc qua một bản English nằm ngoài các tầng đã ghim; đó chỉ là chứng cứ phụ về cách hiểu, không thuộc store, không phải authority, và không được tính vào triangulation.
  - Coverage English:
    Mẫu số = 86 khoá Pāli có nội dung (từ 40 ký tự trở lên theo `source/layers.yaml`, bỏ các khối `:0`) trên 446 khoá. Sujato phủ 0/86, `english-project` 0/86, `vietnamese-current` 0/86. Entry `reference-gaps.yaml` không cứu được `published`; chưa tạo entry vì nằm ngoài lát. Vì cả ba tầng vắng, `triangulation` đặt 7.5 (không quá 8.0) và bài giữ `draft`.
  - Phân loại & tiêu đề:
    `0.1` "Jātaka"; `0.2` "Bộ Tám Mươi Bài Kinh" và `0.3` "Phẩm Thiên Nga Nhỏ" dùng lại nguyên văn `ja533`/`ja535`; `0.4` "4. Kinh Kuṇāla" theo khuôn "n. Kinh <Tên>" (cùng khuôn `ja464:0.4`, `ja341:0.4`); `124.1` "Kinh Kuṇāla, thứ tư." theo khuôn "Kinh <Tên>, thứ n" của `ja535`, `ja472`; `catutthaṁ` = thứ tư khớp "4." ở `0.4`.
  - Số Pāli:
    `aḍḍhuḍḍha` (`2.1`, `14.1`) = ba rưỡi (aḍḍha rưỡi + uḍḍha thứ tư, tức 3,5), nên `itthisahassāni` = ba ngàn rưỡi (3.500) và `itthisatāni` = ba trăm rưỡi (350); phép đối chiếu với đoàn hộ tống: 2 (khiêng) + 500 (dưới) + 500 (trên) + 2 × 500 (hai bên) + 500 (trước) + 500 (sau) + 500 (các phương) = 3.502 ≈ 3.500, và với chim tu hú 2 + 50 + 50 + 2 × 50 + 50 + 50 + 50 = 352 ≈ 350. `pañcasatā pañcasatā` + `ubhatopassena` (`5.1`) dịch "mỗi bên năm trăm", `paññāsa paññāsa` (`17.1`) "mỗi bên năm mươi". `cattāri` (`40.1`) = bốn, danh sách `40.3` đếm đủ 4 (bò đực, bò sữa, xe, vợ); `cha` (`42.1`) = sáu, `43.1`–`43.3` đếm đủ 6 (cung không dây, vợ ở nhà thân quyến, thuyền ở bờ bên kia, xe gãy trục, bạn ở xa, bạn đồng hành xấu). `aṭṭhahi` (`44.1`) = tám, `44.2` đếm đủ 8 (nghèo, bệnh, già, nghiện rượu, khờ dại, phóng dật, xuôi theo mọi việc, trao hết của cải). `navahi` (`46.1`) = chín, `46.2` đếm đủ 9. `cattālīsāya` (`49.1`) = bốn mươi: danh sách `49.2` đếm đủ 40 khi mỗi cặp động từ nhân quả (`ullaṅghati ullaṅghāpeti`, `kīḷati kīḷāpeti`, `cumbati cumbāpeti`, `bhuñjati bhuñjāpeti`) tính một mục (35 mục) và chuỗi `naccena gītena vāditena rodanena vilasitena vibhūsitena jagghati` tính sáu cách cười (35 − 1 + 6 = 40); bản Việt giữ nguyên từng mục, không thêm hay bớt. `pañcavīsāya` (`50.1`) = hai mươi lăm: danh sách `50.2` đếm đủ 25 mục khi tính theo từng mệnh đề (`parivattakajātā kuṅkumiyajātā` và `agāravā paduṭṭhamanasaṅkappā` mỗi cụm một mục). `aṭṭhaṭṭha patino` (`96.2`) = tám người chồng (cách lặp phân phối), khớp `navame` (`96.5`) = người thứ chín; không đọc thành 64. `cattārome` (`92.1`) = bốn: biển, bà-la-môn, vua, người đàn bà (xem bất định `92.4` về `dijampati`). `pañca` (`27.1`, `75.4`) = năm chồng của Kaṇhā và năm hạng phụ nữ không nên gần gũi (`naccantavaṇṇā`, `bahūnaṁ kantā`, `dakkhiṇā`, vợ người khác, vì của cải: đếm đủ 5). `dasa` (`80.4`) xem bất định. `catuttha` (`29.1`) = thứ tư.
  - Pāli trùng nguyên văn:
    Dò Pāli của 446 khoá với toàn bộ Pāli đã ghim (mọi bộ) có bản Việt, loại khoá dưới 12 ký tự chuẩn hoá: 94 khoá có dạng trùng ở bài khác, tổng 135 cặp, trong đó bản Việt giống nguyên (bỏ dấu câu) ở 36 cặp và khác ở 99 cặp. Dùng lại nguyên văn: `0.2`, `0.3` (`ja533`/`ja535`), `99.1`–`99.4` (`ja519:26.1`–`26.4`), `100.2`, `102.2`, `102.3` (`ja507`/`ja263`), `123.5` (`ja522:45.4`), `123.6` (`ja441`, `ja472`), `81.4` (`ja341:1.4`). Cặp mà bản Việt khác và có lý do: `ja464` (56 cặp, 0 cặp giống) vì bản Việt hiện có ở `ja464` có nhiều chỗ sai so với Pāli: `velā tāsaṁ na vijjati` dịch "thời tiết" (`velā` ở đây là giới hạn; `ja65`, `ja61` cũng thế), `kannappakannaṁ yathā rukkhachāyā` dịch "trăng thác trong nước", `Kambojakā jalajeneva assaṁ` dịch "nữ Kamboja với con rắn nước", `Sasseva cittassa vasaṁ vajanti` dịch "như sai tên nô", `Cakkassa nemi viya parivattati` dịch "trục bánh xe", `Āvāsu kiccesu` dịch "chuyện nhỏ" (không có căn cứ), `Naccantavaṇṇā na bahūna kantā` dịch "không xinh xắn", và `Silesūpamā sikhiriva` dịch "tên tên"; ở bài này các khoá ấy được dịch lại từ Pāli. Nên rà lại `ja464` (ngoài lát, báo chứ không sửa). `ja341` (17 cặp, 6 cặp giống): dùng lại ở `60.1`–`60.3` và `81.4`, nhưng `61`–`63` sửa lại (bỏ các chữ không có trong Pāli như "tuấn tú", đổi `kaṇḍarīkinnarānaṁ` thành "Kaṇḍarī và Kinnarā", vì ở bài này ngữ cảnh là danh sách ví dụ). `ja507`/`ja262`/`ja263` (32 cặp): giữ ở chỗ cùng nghĩa (`102.2`–`102.3`), sửa ở `100.1`, `100.3`, `101.1`, `101.3` theo Pāli. `ja61`/`ja65`: `86.1` "vô chủ" khớp `ja61:1.1`, `72.4` sửa "giới hạn" (xem trên). `mil5.4.8` (2 cặp): bản Việt ở đó hiểu `khaṇaṁ` là tu sĩ nên không dùng; `59.1`–`59.4` dịch `khaṇa` là cơ hội, `raho` là chỗ kín.
    Trong chính bài: 20 nhóm Pāli trùng nguyên văn (sau khi bỏ dấu câu), tổng 58 cặp; bản Việt giống nhau ở 58/58 cặp, khác nhau ở 0 cặp. Các nhóm chính: các điệp khúc của hai đoàn hộ tống `2`–`8` và `14`–`20` (chỉ khác tên chim và số), `10.2`/`25.8`, `23.1`, `66.3`/`78.3`, `66.4`/`78.4`, `68.2`/`69.2`, `70.3`–`70.4`/`79.3`–`79.4`/`87.3`–`87.4`, `73.3`–`73.4`/`83.3`–`83.4`, `72.4`/`86.2`, `87.1`–`87.2`/`88.1`–`88.2`, `100.3`–`100.4`/`101.3`–`101.4`, `119.2`/`120.2`, `27.2`/`36.2`/`44.4`/`46.4`/`50.4`, `51.5`/`52.4`/`53.4`/`54.4`/`55.4`/`56.4`/`57.4`.
  - Thuật ngữ (có đếm trên tầng):
    + `bho` làm lời gọi người nghe trong lời kể (không phải trong lời thoại): "thưa các vị" ở mọi chỗ (20 chỗ trong 19 khoá); tầng không có tiền lệ cho văn xuôi Jātaka kiểu này (`ja535` không có phần văn xuôi trong tầng Pāli).
    + `samma` → "này bạn" (28 trong 60 khoá `ja` có `samma` đã dịch; 22 khoá bỏ chữ, 5 "bạn", 2 "hỡi bạn", 2 "ông", 1 "ngài"); ở lời mắng `24.2` giữ "này bạn" kèm "đồ hèn hạ, đồ hạ tiện" vì Pāli giữ `samma`.
    + `kokila` → "chim tu hú" (`ja331:1.4`, `ja425:1.2`, `ja506:33.2`, `ja511:26.6`, `ja523:34.2`; chỉ `ja269:2.3` dịch "cu gáy"); `phussakokila` → "chim tu hú phussa" (giữ `phussa`, không phân xử được nghĩa).
    + `dijakaññā` → "thiếu nữ chim" (không có tiền lệ); `paricārikā` → "hầu cận".
    + `vasalī` → "ả hạ tiện" (`sn7.1:5.3` "người đàn bà hạ tiện"); `corī` → "nữ tặc" (`ja519:26.1`); `dhuttī` → "gian xảo"; `asatī` → "bất lương" (không có tiền lệ đồng nghĩa); `lahucittā` → "nhẹ dạ".
    + `lohitapakkhandikā` → "kiết lỵ ra máu" (5 khoá `mil`, 1 khoá `ud8.5` "xuất huyết"); `māraṇantikā` → "đến mức có thể chết" (`ud8.5` "gần như chết").
    + `ārāma` → "khu vườn", `uyyāna` → "ngự uyển" ở văn xuôi (`9.1`, `21.1`, `46.2`; trong tầng `uyyāna` phần lớn dịch "khu vườn", tách ra để giữ hai từ Pāli khác nhau).
    + `karavīka` → "chim karavīka" (`ja526:39.3`, `bv1:79.2`; các khoá `tha-ap` dịch "ca-lăng-tần-già"); `jīvañjīvaka` → "jīvañjīvaka" (`dn32` "chim Jīvañjīvaka"); `accha/koka/taraccha` → "gấu, sói, linh cẩu" (`ja535:75.4`, `ja516:26.2`); `gavaja`, `ruru` ("nai ruru"), `kadalimiga` ("hươu kadali") theo `ja535:76`; `khagga` → "tê giác"; `pasada` → "nai đốm"; `sākhamiga` → "khỉ chuyền cành" (`ja329:1.2`); `vātamiga` → "nai gió" (`ja14`).
    + `vijjādhara` → "bậc trì chú" (`ja510:22.1`; `ja391` giữ phiên âm, `mil` "người giữ minh chú"); `tāpasa` → "đạo sĩ khổ hạnh" (`bv18:10.1`); `gandhabba, yakkha, rakkhasa` → "càn-thát-bà, dạ-xoa, la-sát" (3/3 khoá); `mahoraga` → "đại mãng xà" (`mil6.3.1:32.3`); `devabrāhmaṇa` → "bà-la-môn như thần" (`ja535:88.4`).
    + `velā` → "giới hạn"; `Neru` → "núi Neru"; `sāmika`/`bhattā`/`bhattāra`/`pati` → "chồng"; `pamadā`/`nārī`/`itthī` → "phụ nữ/người nữ/đàn bà" tùy vế.
  - Chỗ bất định (không thêm vào thân kinh):
    + `1.2` đoạn miêu tả rừng và `13.1` đoạn miêu tả Himavanta: đây là hai danh mục tên cây, thú và chim, nhiều tên giữ phiên âm vì không có tiền lệ (`kaṇṇika`, `nelamaṇḍala`, `issa`, `purisālu`, `vāraṇa`, `celāvaka`, `bhiṅkāra`, `vedisa`, `hasana`, `tirīṭi`, `kacoca`, `navera`, `manaṅgaṇa`, `manavajja`, `bhaṇḍi`, `surucira`, `bhaginī`, `dhanutakkāri`, `koṭṭhaka`, `kaccha`). `1.2` `nelamaṇḍala` không phân xử được (đọc như tên một loài thú); `amajjava` trong `amajjavamañjarīdhara…` không rõ, bản Việt chỉ giữ "mang các chùm hoa"; `13.1` `kaccha` có thể là loài cây hoặc "bờ bụi, đầm"; `vāraṇa` trong danh sách chim có thể là chim hoặc voi, giữ phiên âm; `bhaginimālāmalyadhare` dịch "mang những tràng hoa của … bhaginī", `kakudha`… `koṭṭhaka` là các tên cây. Cặp `1.2`/`13.1` là chuỗi định ngữ dài của địa điểm, dịch thành một câu với dấu chấm phẩy.
    + `1.2` `gajagavajamahiṁsa`: tách `gaja` (voi), `gavaja` (giữ phiên âm theo `ja535:76.1`; có thể là bò rừng `gavaya`), `mahiṁsa`.
    + `11.1`–`11.2` `susukhumasunipuṇagirippabhava— haritupayantiyo`: hình thái hai khoá đứt đoạn, không có chủ ngữ; `haritupayantiyo` là phân từ giống cái số nhiều, ngầm chỉ các dòng nước; bản Việt không thêm chủ ngữ ("đang chảy về nơi xanh tươi"). `12.1` `manuññamāvakappadese`: `māvaka` không phân xử được, bản Việt dịch "khả ái" cho `manuñña` và bỏ riêng `māvaka`.
    + `6.2` `(…)` giữ nguyên đúng chỗ Pāli ghim có `(…)`; Pāli `18.2` (đoạn song song) không có.
    + `9.1` `nāḷikerasañcāriyeneva`: dịch "lối dạo trong rừng dừa"; `abhisambhonti ratitthāya` dịch "mau chóng đưa chim đi … để được vui thú" (động từ ngầm tân ngữ). `2.2` `kilamatho ubbāhetthā` dịch "làm kiệt sức".
    + `13.1` `vilāsitanayano mattakkho` dịch "ánh mắt duyên dáng, mắt như say" (hai tính từ ngắn, không có tiền lệ).
    + `24.2` `jāyājinena`: đọc là "bị vợ chinh phục", đối cách so sánh với `tayā`; cách đọc khác không rõ.
    + `27.1` `dvepitikā` → "có hai cha" (không có tiền lệ); `kabandhe pīṭhasappimhī` → "kẻ thân cụt, què bò lết" (`kabandha` = thân cụt; `pīṭhasappī` = "què bò lết", theo `ja341:2.4` và `mil6.3.1:10.4`). Pāli `28.4` gọi người này `khujjavāmanaka` ("gù lùn"), nên `27.1` và `28.4` có thể cùng chỉ một người, không nối thêm.
    + `29.1` `catutthabhattaṁ pariṇāmayamānā` → "cứ bốn ngày mới dùng một bữa" (nghĩa đen "đang dành/ trải qua bữa thứ tư"; cách đọc khác không rõ); `surādhuttaka` → "kẻ nghiện rượu trác táng".
    + `30.1` `venateyya` → "Venateyya" (con của Vinatā; giữ phiên âm), `naṭakuvera` → "Naṭakuvera".
    + `31.1` `lomasuddarī` → "người đẹp tóc dày" (chưa rõ `loma` là lông hay tóc); `eḷikakumāra` → "chàng trẻ Eḷika" (có thể là tên riêng); `chaḷaṅgakumāradhanantevāsinā` → "người học trò cung thuật của Chaḷaṅgakumāra" (cách đọc khác: `Dhana` là tên riêng).
    + `33.3`–`33.6`: `samānarattā` dịch "gắn bó như nhau", `itarītarā patiṭṭhā` "nền đỡ cho kẻ này kẻ khác"; cách đọc khác của cả đoạn so sánh đất với phụ nữ không rõ; không đọc thành ca ngợi.
