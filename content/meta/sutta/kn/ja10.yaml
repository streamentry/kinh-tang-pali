notes: |-
  Đủ 15/15 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Lỗi review tự bắt được, đáng ghi. Bản nháp đầu tôi dịch bốn vế thành hai mệnh đề độc lập: Cả kẻ mà không ai che chở, / lẫn kẻ không che chở ai, / vị vua ấy vẫn sống an nhàn... — đọc như một câu cộng hai vế trạng ngữ rời rạc. Sujato đã ghim cho câu này là một mệnh đề: He who is not guarded by others, / and who does not guard others, / truly sleeps at ease, O King, / unconcerned for sensual pleasures. Tức `Sa ve rāja` là vị vua tự thân, còn `yañca aññe na rakkhanti` là vị ngữ phẩm định chủ thể ấy. Tôi đã sửa thành Kẻ không được ai che chở, / kẻ không che chở ai, / thật sự ngủ yên, này Đại vương, / không màng đến dục trần. Đây là bài học lặp lại: dựng từ trí nhớ sẽ sinh ra câu trôi.

  Tiêu đề và khung theo đa số đã có trong tầng: Ekakanipāta → Bộ Một Bài Kinh (267 bài); Apaṇṇakavagga → Phẩm Bụi Dơ (8 bài, chỉ ja5 dùng cách khác); `Xvaggo paṭhamo.` → Phẩm ..., thứ nhất. (theo mẫu an1.10:1.4); `Tassuddānaṁ` → Tóm lược: (248 khoá trong tầng, đa số áp đảo). `Sukhavihārijātaka` tôi dịch Kinh Người Sống An Nhàn, khớp với Sujato Living at Ease và với nghĩa của `kāmesu anapekkhavā` ở chính vế kệ.

  Uddāna — chỗ yếu nhất, ghi rõ thay vì làm cho nó nghe chắc:
  · `Varāpaṇṇaka vaṇṇupatha serivaro, / Suvicakkhaṇa taṇḍulanāḷikassā; / Hiri puttavaruttagāmaṇinā, / Yo ca na rakkhati tena dasāti.` Tôi giữ các tên riêng là tên, chỉ dịch vế đếm số (mười bài ấy). Lý do: đây là bài mục lục liệt kê tên các bài kinh trong phẩm, và tầng đã có cả hai cách — ja2 gọi Serivavāṇijātaka là Kinh Sa Mạc, còn ja102, ja106, ja107 giữ tên Pāni (Kinh Paṇṇikajātaka, Kinh Udañcanījātaka, Kinh Sālittakajātaka). Với các tên mà tôi không có cách dùng đã được kiểm chứng thì giữ tên Pāli an toàn hơn là đoán nghĩa; đoán nghĩa ở đây sẽ là bịa.
  · Tôi đã thử đối chiếu từng tên trong uddāna với tên bốn mươi bài kinh của chính phẩm này và thấy chúng KHÔNG khớp một-một (ví dụ uddāna có Suvicakkhaṇa và Hiri, mà phẩm Apaṇṇaka lại là ja1–ja9 với tên Apaṇṇaka, Vaṇṇupatha, Serivavāṇija, Cūḷaseṭṭhi, Taṇḍulanāḷi, Devadhamma, Kaṭṭhahāri, Gāmaṇi, Maghadeva). Nghĩa là uddāna ở bản chụp này không còn là mục lục tra cứu được. Đây là câu hỏi chưa phân xử được, nên ambiguity_integrity chỉ 8.8. Tôi KHÔNG sửa bài ngoài lát để đối chiếu, chỉ báo cáo.
  · Cùng lý do, ba uddāna của ja110, ja120, ja130, ja140 cũng giữ tên; xem ghi chú ở từng bài.

  Đối chiếu tầng tham khảo: Sujato có 8/15 khoá, im lặng ở 2.1, 2.2, 3.1 và cả bốn vế uddāna. Bốn vế kệ có bản Anh và khớp đúng khoá. Vì mọi khoá Pāli của bài này đều dưới 40 ký tự nên mẫu số coverage rỗng, không cần ghi vào content/meta/reference-gaps.yaml. Bản Việt hiện hành tại commit đã ghim không có cho Jātaka, đây là giới hạn của bản chụp upstream.

  Kiểm thủ công trên TOÀN BỘ 15 khoá (kiểm() rỗng vì không khoá Pāli nào từ 40 ký tự): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược bằng Pāli (cả hai phía 0), nháy kép cân (mở ở 1.1, đóng ngay ở 1.4), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.
