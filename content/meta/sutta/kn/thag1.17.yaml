notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Dāsaka trong phẩm Dutiyavagga.

  **Bốn vế trùng nguyên văn `dhp325:1-4`** — Pháp Cú đã `published`. Ở **một chỗ tôi CỐ Ý dịch khác**,
  và ghi ra: `dhp325:1` dịch `Middhī yadā hoti mahagghaso ca` là *Kẻ biếng nhác, ăn nhiều*; tôi dịch
  *Kẻ hôn trầm vì ăn quá nhiều*. Lý do: `middhī` là **hôn trầm** (Pāli `middha` — 62 chỗ trong tầng,
  còn chính thag1.17 này là 1 chỗ), còn *biếng nhác* là phân tích thêm mà Pāli không có; Sujato cũng
  đọc là *One who gets drowsy from overeating*. Nếu người biên tập muốn tuyệt đối giống dhp325 thì
  đổi một vế này, tôi ghi để việc đó gọn.

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1): 10 bản trên đĩa mở rộng,
  5 bản giữ lược. Xem `thag1.112.yaml`. Cả hai đều giữ 2 dấu lược như Pāli.

  **Thứ tự khoá tiêu đề: theo PĀLI** (`0.3` = phẩm, `0.4` = tên bài kệ); 12 bản thag đã publish đặt
  ngược, tôi không sửa chúng.

  **Không đối chiếu được tầng Việt hiện hành** (bilara chỉ có Pháp Cú). Sujato có 8/9 khoá, trống
  đúng dòng kết lược; mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments = 0`, `ratio = 1`.

  **Thuật ngữ, đếm được.** `Niddāyitā` → *buồn ngủ* (Sujato *fond of sleep*). `samparivattasāyī` →
  *trở mình trên chiếc giường* (Sujato *rolling round the bed*; dhp325:2 dịch *ngủ nghỉ, nằm lăn lộn* —
  tôi dùng *chiếc giường* cho rõ). `varāha` → *lợn rừng* (sn19.5:1.4 *nuôi lợn rừng*). `nivāpa` → *cơm*
  (dhp325:3 dùng *cám* 1 lần, *bằng cơm* 10 lần trong tầng — tôi theo *cơm*). `puṭṭha` → *nhồi đầy*.
  `mando` → *kẻ ngu* (sn2.22:7.3, sn9.2:4.2, sn7.12:4.4; an5.141 dịch *đần độn mù quáng* cho
  `mando momūho`). `gabbha` → *bào thai*. `Punappunaṁ … upeti` → *lại* (Sujato *again and again*).

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2); ngoặc kép cân; không chữ ngoài
  Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này cấm) →
  `technical_integrity` = **9.6**.

  **Danh xưng giữ nguyên dạng Pāli** (Dāsaka).
