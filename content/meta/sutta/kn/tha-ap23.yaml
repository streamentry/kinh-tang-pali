notes: |-
  Bài này. `tha-ap23` · phẩm `Subhūtivagga` (`Phẩm Subhūti`) · bài thứ nhất của phẩm · Trưởng lão Subhūti · 213 khoá Pāli:
  tiêu đề `:0.1`–`:0.3`, 51 kệ `:1.1`–`:51.4` (riêng `:35` có sáu dòng, `:37` có sáu dòng), câu kết `:52.1`, câu chốt `:53.1`. Tệp
  dịch có đủ 213/213 khoá, thứ tự khoá đúng thứ tự Pāli. Tên vị trưởng lão được xác nhận ba lần trong chính Pāli:
  `Subhūtittheraapadāna` (`:0.3`), `subhūti thero` (`:52.1`), `Subhūtittherassāpadānaṁ` (`:53.1`); tên cũ của vị ấy
  trong tiền kiếp là Kosiya (`:2.1`), tên Subhūti chỉ được Đức Padumuttara nêu trong lời thọ ký (`:42.3`).

  NỘI DUNG (đã đọc Pāli, không suy từ khuôn chung). Subhūti kể lại một tiền kiếp làm đạo sĩ bện tóc Kosiya trên núi Nisabha, gần
  dãy Himavanta (`:1`–`:2`): sống một mình, không ăn quả, rễ, lá mà chỉ dùng những thứ tự rụng (`:3`), không làm hư cách nuôi mạng
  dù phải bỏ mạng (`:4`). Khi tâm gắn với tham khởi lên, ông tự quán xét và điều phục (`:5`); `:6`–`:20` là lời tự nhắc mình
  (nháy đơn mở ở `:6.1`, đóng ở `:21.4`), điệp khúc `nikkhamassu vanā tuvaṁ` (`hãy rời khỏi rừng, ngươi`) ở `:6.4`, `:7.4`, `:8.4`,
  `:10.4`: một chuỗi cảnh báo rằng sống trong rừng mà tâm còn ô nhiễm thì làm ô uế nơi thanh tịnh, như khúc củi giàn thiêu
  không dùng được ở đâu (`:9`–`:10`), như con voi bị đuổi khỏi đàn (`:14`–`:17`), như vàng giả (`:18`), và rằng sống ở nhà
  cũng không có của cải cất sẵn (`:19`–`:20`). `:21` ông ngăn tâm khỏi điều ác bằng những pháp thoại. Ba mươi ngàn năm trôi qua
  (`:22`). Đức Padumuttara đến, kinh hành trên không (`:23`–`:28`); ông nghĩ đó là trời hay người, rồi nghĩ có câu chú nói vị
  ấy hẳn là bậc Thầy (`:29`–`:30`), gom hoa hương, trải tòa hoa, mời Ngài ngồi (`:31`–`:33`). Ngài ngồi bảy đêm ngày,
  ông đứng kính lễ (`:34`–`:35`). Xuất định, Đức Phật dạy tu tập niệm Phật (`:36`) và thọ ký (`:37`–`:43`, nằm trong nháy
  đơn): ba mươi ngàn kiếp ở cõi trời, tám mươi lần làm chúa chư thiên, một ngàn lần làm Chuyển Luân Vương; sau một trăm
  ngàn kiếp nữa, Gotama sẽ ra đời, ông sẽ xuất gia, tên là Subhūti, và sẽ được đặt đứng đầu về hai điều (đáng thọ cúng dường;
  hạnh sống không tranh chấp). `:44`–`:50` Subhūti kể điều đã thành: được thăng cõi Ba mươi ba, làm chúa chư thiên tám mươi lần,
  Chuyển Luân Vương một ngàn lần, không biết đến đọa xứ. `:51` bốn vô ngại giải, tám giải thoát, sáu thắng trí.

  SỐ PĀLI, TỰ TÍNH. `Tiṁsavassasahassāni` (`:22.3`) = tiṁsa 30 × sahassa 1.000 = 30.000 năm → ba mươi ngàn năm.
  `Tiṁsakappasahassāni` (`:37.1`) = tiṁsa 30 × sahassa 1.000 = 30.000 kiếp → ba mươi ngàn kiếp (theo chỉ dẫn của người điều phối:
  `tiṁsa` = 30; đúng nhóm tiền lệ `Tiṁsakappasahassamhi` 15 khoá `Vào ba mươi ngàn kiếp trước đây` + 4 khoá `Sau ba mươi
  ngàn kiếp nữa`; riêng chính dòng `Tiṁsakappasahassāni` trong tầng: `ba mươi nghìn kiếp` 6 · `ba mươi ngàn kiếp` 1, còn cụm `ba mươi
  (ngàn|nghìn) kiếp` toàn tệp `tha-ap`: `ngàn` 27 · `nghìn` 6; chọn `ngàn`). `Asītikkhattuṁ` (`:37.3`, `:47.1`) = asīti 80 → tám mươi
  lần. `Sahassakkhattuṁ` (`:37.5`, `:47.3`) = 1.000 → một ngàn lần. `Kappasatasahassamhi` (`:40.1`) = sata 100 × sahassa 1.000 =
  100.000 → một trăm ngàn kiếp. `Satasahassito` (`:50.1`) = 100.000 → một trăm ngàn. `Asītikoṭiṁ` (`:41.1`) = 80 koṭi, giữ nguyên `koṭi` như
  `tha-ap5:22.3` (Pāli `Asītikoṭiyo hitvā` → `Bỏ lại tám mươi koṭi`, 2 khoá; dòng này khác Pāli nên chỉ cùng cụm số). `Sattarattindivaṁ` (`:34.3`, `:35.2`) = satta 7 → bảy đêm
  ngày. `saṭṭhihāyanaṁ` (`:14.2`) = saṭṭhi 60 → sáu mươi tuổi. `tidhā` (`:14.1`) = ba nơi. `dvīsu` (`:43.4`) = hai. `Tāvatiṁsaṁ` (`:46.4`) = 33 →
  Ba mươi ba. `catasso` (`:51.1`) = 4, `aṭṭhime` (`:51.2`) = 8, `Chaḷabhiññā` (`:51.3`) = 6. Phần kệ bốn dòng: 51 kệ.
  KHÔNG có cụm số nào chưa phân xử trong bài; điểm `tiṁsa` ở trên theo chỉ dẫn, nên nếu người biên tập quyết định khác cho
  `Tiṁsakappasahassa` thì phải sửa cả `:37.1` lẫn các dòng cùng Pāli ở tha-ap khác.

  `:0.3` VÀ TIÊU ĐỀ. Pāli `Subhūtittheraapadāna` KHÔNG bắt đầu bằng chữ số nên không thêm số thứ tự (đo trên 551 tệp `tha-ap` của cây làm việc: Pāli có số và Việt có số 163 · Pāli không số và Việt không số 388 · Việt thêm số ở chỗ
  Pāli không có 0). `translationTitle` BẰNG ĐÚNG giá trị `:0.3`: `Bài Kệ Tuyên Ngôn Về Trưởng Lão
  Subhūti`. Phe chính tả của `apadāna` ở `:0.3`, đo hai phạm vi: toàn tầng `tha-ap` đã dịch `Tuyên Ngợ` 245 · `Ký Sự` 150 ·
  `Tuyên Ngôn` 138 · `Tuyên Ngợi` 10 · `Kinh Kệ` 5; phạm vi gần nhất, cùng phẩm Subhūti (`tha-ap24`–`tha-ap34`) `Tuyên Ngôn` 4 ·
  `Tuyên Ngợ` 4 · `Tuyên Ngợi` 2, và các bài liền kề cùng phẩm `tha-ap25`, `tha-ap26`, `tha-ap30` đều viết `Tuyên Ngôn`. Hai phạm vi cho
  hai đa số khác nhau; `Tuyên Ngợ` là dạng sai chính tả; chọn `Tuyên Ngôn`, cùng cách ở `:0.3` và `:53.1` để bài không tự mâu thuẫn. Cần
  người biên tập phán một lượt cho cả cuốn. `:0.1` `Therāpadāna` giữ nguyên Pāli (539 khoá cùng Pāli giữ nguyên, 11 khoá dịch khác).
  `:0.2` `Phẩm Subhūti` khớp 8/8 tiền lệ cùng Pāli. `:53.1` theo khuôn `Bài Kệ Tuyên Ngôn Về Trưởng Lão <tên>, thứ nhất.`
  (`tha-ap33:18.1`, `tha-ap43:26.1`). `:52.1` theo nhóm `Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này` (546 khoá
  dùng `những bài kệ này` · 2 khoá dùng số ít `bài kệ này`), vì Pāli `imā gāthāyo` là số nhiều.

  TIỀN LỆ, ĐO THẬT. Dựng chỉ mục Pāli → Việt trên 550 tệp tha-ap của cây làm việc. Trong 213 khoá của bài, 61 khoá có Pāli
  trùng nguyên văn với khoá đã dịch ở bài khác; 60/61 dùng lại nguyên văn bản Việt của tiền lệ, 1 khoá khác: `:32.4`
  (`tôi đã nói lời này:` thay vì `ta đã nói lời này:` 7 khoá, để khớp ngôi `tôi` của cả bài). Trong bài có 8 nhóm Pāli trùng
  trong chính bài (điệp khúc `:6.4`/`:7.4`/`:8.4`/`:10.4`; `:13.4`/`:19.2`; `:24.4`–`:28.4`; `:37.3`/`:47.1`; `:38.1`/`:48.1`; `:38.2`/`:48.2`;
  `:38.4`/`:39.4`/`:48.4`/`:49.4`/`:50.4`; `:39.1`/`:49.1`), cả 8 nhóm bản Việt khớp nhau (đã bỏ qua khác biệt dấu cuối dòng), 0 nhóm lệch.
  Thuật ngữ: `buddhānussati` → `niệm Phật` (tầng: `dn33`, `dn34` 2 khoá, `tha-ap532:41.2` 1 khoá `niệm Phật` so với `an6.9`, `an6.10`, `an6.141`,
  `an11.11`, `an11.12` 5 khoá `sự nhớ tưởng về Đức Phật`; dòng thọ ký là kệ nên giữ dạng ngắn như hai bài kệ/ dn cùng thể).
  `araṇavihāra` → `hạnh sống không tranh chấp` (`an1.201:1.1` `sống không tranh chấp` đúng cho `Subhūti`; `ps1.0:33.1` `trú vô tránh`).
  `chavālāta kaṭṭha` → `khúc củi của giàn thiêu xác` (`sn22.80:7.3`; `an4.95` dịch `đuốc mồi`, cũng là chavālāta nhưng ở đó có
  `ubhato padittaṁ` cháy hai đầu). `saṅkilesa` → `ô nhiễm` (mn, an, dn đều dùng). `lokanātha` → `Lãnh Đạo thế gian` (11 khoá · `Bảo Hộ`
  8 · `Cứu Độ` 1). `Padumuttarasambuddho` → `Đức Chánh Đẳng Giác Padumuttara` (`tha-ap9:1.1`, 2 khoá). `sālarāja` → `chúa cây sala`.
  `jalajuttamanāmako` → `được gọi là bậc Tối Thượng Tựa Hồng Sen` (10 khoá). `kappasatasahassamhi` → `Sau một trăm ngàn kiếp nữa` theo chỉ dẫn
  thọ ký tương lai (17 khoá cùng Pāli: `ngàn` 10 · `nghìn` 7; các tiền lệ `Sau`/`Vào … nữa`). `Satasahassito kappe` ở `:50.1` là quá khứ: viết
  `Vào một trăm ngàn kiếp trước,` (5 khoá cùng Pāli, cùng chữ, trong 63 khoá cùng Pāli) thay vì `Vào một trăm ngàn đại kiếp trước,` (30 khoá `đại kiếp` trong 63 khoá cùng Pāli), vì Pāli chỉ có `kappe`,
  không có `mahā`: người biên tập cần biết con số 30 khoá `đại kiếp` đi ngược quyết định này. `duggatiṁ nābhijānāmi` → `Tôi không còn biết đến đọa xứ nào,`
  (nhóm gần nhất `tha-ap14`, `21`, `22`, `25`, `26`; toàn tầng 100 khoá `Tôi không còn biết đến đọa xứ nào,` · 71 khoá `Ta không còn biết đến đọa xứ,` ·
  138 khoá `Ta không biết mình rơi vào khổ đau,`); giữ dạng `đọa xứ`.

  BẤT ĐỊNH, GHI RÕ VÀ KHÔNG ĐƯA VÀO THÂN KINH. (1) `Pavattaṁva supātāhaṁ` (`:3.3`): hapax trong tầng (0 khoá cùng Pāli); `pavatta` được
  hiểu là thứ đã rụng xuống, `supāta` là `rơi hẳn xuống`; `upajīvāmi tāvade` (`:3.4`) là `nương vào đó mà sống ngay lúc ấy`
  (46 dòng Pāli khác nhau chứa `tāvade`, dịch `ngay lúc ấy / ngay khi ấy`). Chỗ có thể đổi nghĩa chi tiết, cần người biên tập kiểm. (2) Kệ `:11`: `Siyā nu kho tava etaṁ, ko
  pajānāti te idaṁ; saddhādhuraṁ vahisi me, kosajjabahulāya ca`. Dịch sát chữ: `me` và `kosajjabahulāya` đều ở trường hợp
  (cách) cho phép đọc là sở hữu hoặc đối cách (`cho ta`, `cho cả sự biếng nhác`); không dòng cùng Pāli để đối chiếu. Cách đọc nào cũng
  khó khớp với văn mạch `:6`–`:20` nên tôi không thêm chủ thể. (3) `sādhu te taṁ na ruccati` (`:20.4`): `sādhu` đọc là `tốt` (điều đó
  tốt, nhưng ngươi không ưa); cũng có thể là tiểu từ `thôi/được`. (4) `Api mantapadaṁ atthi` (`:30.3`): hapax; `mantapada` đọc là `câu chú`, `api`
  = `tuy nhiên`; `ayaṁ satthā bhavissati` (`:30.4`) đọc thành phỏng đoán `hẳn là bậc Thầy` (Pāli tương lai `bhavissati`). (5) `Lāsito`
  (`:26.3`): hapax, đọc là `vui đùa`. `Timbarūsaka` (`:24.1`), `Siṅgīnikkha` (`:27.1`), `jotiraso` (`:27.3`), `Kelāsa` (`:28.1`): tên cây/ vàng/ ngọn ngọc/
  ngọn núi, giữ nguyên Pāli không thêm giải thích; `jotirasa` đã giữ nguyên ở `tha-ap425:10.2`. (6) `Ubhato muttako ajja` (`:10.3`): `muttaka` ở đây là lìa khỏi cả hai
  phía (không còn là tại gia, cũng không là người chế ngự), không phải `được giải thoát`. (7) `jhāyati`/`jhāyissasi` (`:18.2`, `:18.4`): `tỏa sáng`;
  Pāli cùng gốc với `jhāna` nên có thể chơi chữ với thiền, không đưa vào thân kinh. (8) `Tathāraṇavihāre` (`:43.3`) là `tathā + araṇavihāre`
  (`hạnh sống không tranh chấp`), không phải `rừng` (araṇa không phải `araññā`). (9) Câu hỏi: Pāli `:29.4`, `:13.4`, `:19.2`, `:11.2` có dấu `.`/`;`
  nhưng là câu hỏi, Việt dùng `?`; `:29.2`, `:32.4`, `:35.6` kết `:` thay cho `;` `.` theo cách dẫn lời của tầng. (10) Bài không có `…pe…` hay
  `(…)`: dấu lược Pāli 0, Việt 0.

  NHÁY. Pāli `“` 1, `”` 1, `‘` 4, `’` 4; mở ngoặc kép ở `:1.1` và đóng ở `:51.4`; nháy đơn: mở ở `:6.1` đóng ở `:21.4`, mở ở `:29.3` đóng ở
  `:30.4`, mở ở `:33.1` đóng ở `:33.4`, mở ở `:36.1` đóng ở `:43.4`. Khớp Pāli từng khoá: 0/213 khoá lệch (Việt `“` 1, `”` 1, `‘` 4,
  `’` 4). Lưu ý: `:21.4` đóng nháy đơn dù `:21.1`–`:21.4` mang giọng người kể; đây là vị trí đóng trong Pāli ghim và được giữ nguyên.

  COVERAGE ENGLISH, ĐO THẬT. Mẫu số là Pāli có nội dung từ 40 ký tự trở lên, bỏ khối `:0`: chỉ 1 khoá (`:52.1`, 59 ký tự); mọi khoá kệ chỉ
  dưới 34 ký tự nên cổng coverage gần như không đo được gì. Sujato phủ 0/1 (tầng `english-sujato` ở `sutta/kn` chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; tệp
  `tha-ap` duy nhất là tệp tên, không phải thân kinh; đã tra cả bộ nhớ đệm: chỉ có tệp Pāli của uid này, không có tệp Anh); `vietnamese-current` 0 (26 tệp, toàn Pháp
  Cú); `english-project` không có uid này. Vì cả ba tầng tham khảo vắng nên `triangulation` đặt 7,0 (không quá 8,0) và `status` giữ `draft` kèm
  blocker. Bài này CHƯA có entry trong `content/meta/reference-gaps.yaml` (các bài liền kề như tha-ap22 có): ngoài phạm vi lát này, cần
  `npm run reference:gaps` hoặc người điều phối ghi nhận; có hay không có entry cũng KHÔNG cứu được `published`.

  KIỂM TRA ĐÃ LÀM. Tập khoá Việt bằng tập khoá Pāli (213 = 213), thứ tự khoá đúng Pāli, NFC, không khoảng trắng thừa, không khoá rỗng,
  không Pāli lọt vào thân (chỉ còn tên riêng: Subhūti, Kosiya, Nisabha, Himavanta, Padumuttara, Gotama, Okkāka, Sakya, Kelāsa, `koṭi` và tên
  loài/ vật `timbarūsaka`, `siṅgī-nikkha`, `jotirasa` ở thân kệ, và `Therāpadāna` ở tiêu đề), mọi số Pāli đã tính lại ở trên,
  dấu lược 0/0. Dấu cuối dòng mỗi khoá khớp Pāli (`,` `;` `.`) trừ các chỗ ở mục BẤT ĐỊNH (9). Đã đọc đối chiếu cặp Pāli-Việt từng khoá.

  `technical_integrity` đặt 9,6 vì chưa chạy cổng kỹ thuật của kho. Bốn lệnh còn lại cần chạy trước khi chốt: `npm run validate` · `npm test` ·
  `npm run check` · `npm run build`.
