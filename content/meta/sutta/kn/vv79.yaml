  **Bốn chỗ crux, ghi thẳng ra chứ không bịa chỗ trống.**
  - `patapante divaṅkare` (5.2) là **hapax của toàn bộ Pāli đã ghim**: grep
    `root/pli/ms/sutta/kn/` cho `divaṅkara` và `patap` chỉ ra đúng khoá này (3 khoá có
    `patap`, trong đó 2 khoá là `cūpatapeti` và `patapattaṁ`, nghĩa khác). `divaṅkara` =
    thần Mặt Trời thì chắc; `patapanta` là "đang rọi sáng" hay "đã lặn" thì Pāli không
    nói. Chọn *khi mặt trời rọi sáng* và **không** dám chốt là *mặt trời lặn*.
  - `sittos` (10.1) đọc theo nữ (`sittā` = nữ thần cây, cặp với `ambo` là vườn xoài) nên
    dịch *nàng tiên xoài*; còn cách đọc nam (`sitta` = bậc tu hành) vẫn mở. Vì `nhāpito`
    là dạng nam số ít nên cả hai vẫn chạy được.
  - `Kilantarūpo kāyena, akilantova cetasā` (6.3–6.4): `kilanta` = tựa vào, nhưng `rupe`
    mang nghĩa "chỗ tựa"; dịch *thân mình tựa vào gốc cây / nhưng tâm thì chẳng dựa vào
    đâu*. `Kilantarūpo` và `ekacīvara` là **hapax toàn tầng kn** — 0 tiền lệ.
  - `Sabbaṁ pharati attano` (10.4): `attano` là "của chính mình" (nam) hoặc "của chính
    bà ấy" (nữ); dịch *tràn đầy hạnh phúc trong chính mình* để không khẳng định giới.

