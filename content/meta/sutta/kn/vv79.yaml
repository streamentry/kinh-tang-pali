notes: |-
  Dịch từ Pāli root (`vv79_root-pli-ms.json`), 51/51 khoá khớp `pre` = `vv79:`.

  **Cổng coverage của bài này KHÔNG đo được gì, và đó không phải "không cần ghi nhận".**
  Đo theo đúng công thức `source/layers.yaml` (Pāli ≥ 40 ký tự, loại block tham chiếu
  `:0`) thì vv79 có **0** segment trên tổng 51; khoá dài nhất là `3.3` và `1.4`, mỗi
  khoá 35 ký tự. Mẫu số bằng 0 nên `ratio` ra 1,0000 và ngưỡng 0.8 không hề bị vượt.
  Hai sự thật này khác nhau: "không có gì để đo" không phải "đã đo và không thiếu".

  **Tầng Anh vắng, nhưng có một dữ liệu Anh đã ghim duy nhất về bài này**: tầng tên
  `translation/en/sujato/name/sutta/vv-name_translation-en-sujato.json` tại cùng commit
  có `vv-name:88.vv79` = *Mango Mansion*. Đây là tên của tầng `name/`, không phải bản
  dịch thân bài; dùng nó để xác nhận `Amba` là xoài (xoác với `vườn xoài` ở 5.4) chứ
  không làm authority cho thân bài.

  **18 khoá dùng lại y nguyên văn bản Việt đã có, không dịch lại.** Đo bằng script
  (khoá nào có cùng Pāli *và* cùng chuỗi Việt với một bài khác): `1.1`–`2.4` trùng nguyên
  văn vv56, vv57, vv59, vv77; `3.1` trùng cả bốn bài; `4.1` trùng vv56/vv59/vv66/vv70;
  `4.3` trùng vv11/vv14/vv56; `5.1` trùng `ja432:6.1`; `3.2` và `4.2` trùng `tha-ap252:4.2`
  và `tha-ap470:3.2` (cùng cách quy ước `…pe…` → một `…`); cộng ba khoá `:0` theo đa số đo
  được. Cả khối mô tả cung điện và câu hỏi về sắc diện vì thế dịch giống hệt, xưng *ngài*
  6 lần và *ngươi* 0 lần — đồng nhất trong bài.
  Riêng `3.3` `Vaṇṇo ca te sabbadisā pabhāsatī”ti.` kho có **15** cách khác nhau; chọn
  vv56/vv57 (*và dung sắc của ngài chiếu sáng rực rỡ khắp mọi phương*) thay vì *hào quang*
  của vv59/vv77, vì `vaṇṇo` là dung sắc chứ không phải hào quang và `3.1` đã dùng *sắc
  diện dung nhan*.

  **Bốn chỗ crux, ghi thẳng ra chứ không bịa chỗ trống.**
  - `patapante divaṅkare` (5.2) là **hapax của toàn bộ Pāli đã ghim**: grep
    `root/pli/ms/sutta/kn/` cho `divaṅkara` và `patap` chỉ ra đúng khoá này (3 khoá có
    `patap`, trong đó 2 khoá là `cūpatapeti` và `patapattaṁ`, nghĩa khác). `divaṅkara` =
    thần Mặt Trời thì chắc; `patapanta` là "đang rọi sáng" hay "đã lặn" thì Pāli không
    nói. Chọn *khi mặt trời rọi sáng* và **không** dám chốt là *mặt trời lặn*.
  - `sittos` (10.1) đọc theo nữ (`sittā` = nữ thần cây, cặp với `ambo` là vườn xoài) nên
    dịch *nàng tiên xoài*; còn cách đọc nam (`sitta` = bậc tu hành) vẫn mở. Vì `nhāpito`
    là dạng nam số ít nên cả hai vẫn chạy được.
  - `Kilantarūpo kāyena, akilantova cetasā` (6.3–6.4): `kilanta` = tựa vào, nhưng `rupe`
    mang nghĩa "chỗ tựa"; dịch *thân mình tựa vào gốc cây / nhưng tâm thì chẳng dựa vào
    đâu*. `Kilantarūpo` và `ekacīvara` là **hapax toàn tầng kn** — 0 tiền lệ.
  - `Sabbaṁ pharati attano` (10.4): `attano` là "của chính mình" (nam) hoặc "của chính
    bà ấy" (nữ); dịch *tràn đầy hạnh phúc trong chính mình* để không khẳng định giới.

  **Thuật ngữ, đều có số đếm.** `bhante` → *thưa tôn giả*: 274 khoá trong tầng `kn`,
  `bạch thầy` 0, `bạch Đài Ngữ` 2. `Sāriputta` giữ dạng Pāli: 1.194 lần trong tầng Việt
  dự án, `Xán Đầu Lâu` 0 lần. `bhatako` → *kẻ lo thức ăn cho đám đông* theo
  `tha-ap497:2.2` (`paresaṁ bhatako ahaṁ`). `poso` → *vị giới hạnh*, cùng hướng với
  `sīla` → *giới hạnh* (189 cặp trong `kn`). `ambārāma` → *vườn xoài* (vv46). `sukhaṃ` →
  *an ổn*, `sukhāvaha` → *mang lại sự an ổn* (4 cặp, `pv41:4.4` *mang lại sự an lạc*).
  `pasannamānaso` → *với tâm tịnh tín* (214 cặp). `accharāhi` → *tiên nữ* (ud3.2:8.1
  *thiên nữ chân bồ câu*), `pāresaṁ` → *đám đông*. `pattacīvara` → *áo lá*; `ekacīvara`
  → *một tấm áo lá làm chỗ che nắng*. `Sādhu` → *Lành thay* (6 lần trong `kn`, mở câu
  cả 6). `anappaka` → *vô tận* (15 cặp). `nandana` + `vane` → *rừng Nandana* theo
  `vv40:2.4`; có 4 cặp cũ dịch là *cõi Nandan*, đã ghi để người điều phối gộp.

  **Tên phẩm đặt theo đa số đo được.** `0.2` `Purisavimāna` → *Chuyện Cung Điện Nam Hư
  Không* 14 bài vs *Thiên Cung Của Nam Giới* 5 vs giữ Pāli 3. `0.3` `Sunikkhittavagga` →
  *Phẩm Khéo Đặt Để* 4 bài vs giữ Pāli 1 (vv77, còn bỏ dịch `0.2` và `0.4` — không sao
  chép lỗi đó). `0.1` `Vimānavatthu` giữ nguyên Pāli như 55/56 bài vv đã có. `0.4` dịch
  tiêu đề theo 35/38 bài vv đã có. `13.1` theo dạng *Cung Điện X, thứ N* (12 bài), khớp
  `vv85` cùng phẩm.

  **Dấu lược và nháy kép.** Hai khoá Pāli có `…pe…` là `3.2` và `4.2`, và bản Việt giữ
  **đúng một** `…` mỗi khoá, không bao giờ mở rộng (luật 10.1 của brief); `…` trần: 0 ở
  cả hai đầu. Đo bằng script: lỗi dấu lược = 0. Nháy kép đúng như Pāli — mở ở `1.1`, đóng
  ở `3.3`, mở ở `5.1`, đóng ở `12.4`; `ngoặc()` báo cân. Nháy đơn `‘…’` lệch ở 0/51 khoá.
  `8.4` và `9.4` chỉ khác Pāli ở nguyên âm cuối (`ekacīvaro` / `ekacīvaraṁ`) nhưng đã dịch
  **y hệt** để bài không tự mâu thuẫn; đo bằng script: 0 cặp Pāli trùng mà bản Việt khác.

  **Xưng hô thống nhất trong bài, và đó là một lựa chọn đã đo.** `ngươi` 0 lần, `ngài` 6
  lần — vì 9 khoá đầu phải dùng y nguyên bản vv56/vv77 (`ngài`), mà `vv77` lại bỏ dịch
  `0.2`/`0.3`/`0.4` nên phần tiêu đề ở đây dịng theo đa số 14 bài. Cùng cơ chế đó,
  `vv30` dịch `bhante` thành *bạch thầy* (2 lần) trong khi toàn tầng `kn` dùng *thưa tôn
  giả* 274 lần — không sao chép.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`,
  `npm test`, `npm run check`, `npm run build`. Vì bốn lệnh ấy chưa chạy ở lát này,
  `technical_integrity` đặt 9,6 chứ không 10,0.

  **Kiểm toán độc lập 2026-10-11.**
  Đọc đối kháng lại 51 khoá từ Pāli. Lượt chấm 2026-10-05 (9,17) **không đứng vững**: bản
  nháp có **15/51 khoá sai nghĩa thật** và thêm **8 khoá lệch nhẹ** (thêm chữ, mất từ, tên).
  Phần notes bên trên là lịch sử; những khẳng định sau trong đó **bị thay thế** bởi mục này:
  `sittos` đọc nữ → *nàng tiên xoài*; `kilanta` = "tựa vào"; `pattacīvara` → *áo lá*;
  `bhatako` → *kẻ lo thức ăn cho đám đông*, `poso` → *vị giới hạnh*; `patapante` là hapax
  "chưa biết rọi sáng hay đã lặn"; "xưng hô thống nhất ngài/ngươi" (không còn là tiêu chí).

  *Sửa lỗi nghĩa (accuracy fix), 15 khoá:*
  - `10.1` `Ambo ca sitto` : `ambo` là cây xoài (nam, số ít), `sitto` là quá khứ phân từ của
    `siñcati` (được tưới) → *Cây xoài đã được tưới*; không có nữ thần nào, và đây không phải
    dạng nữ `sittā`. Bản cũ *nàng tiên xoài* là bịa. `nhāpito` → *đã được tắm*.
  - `6.3`, `6.4` `kilanta` = mệt (`kilamati`; 23 khoá cùng gốc trong tầng `kn`, vd.
    `sukilantarūpo` → *mệt nhọc*, `kilantosmi` → *Ta mệt*), không phải "tựa vào" → *thân có vẻ
    mệt nhọc, nhưng tâm thì không mệt*. Cũng bỏ dòng cũ "rūpa = chỗ tựa".
  - `6.1` mất động từ `āgamā` (*đi đến*); thêm lại.
  - `7.3`, `7.4` `nhāpeyyaṁ` là **ngôi thứ nhất** số ít, thức khả năng (*tôi xin tắm*), `taṁ` là
    tân ngữ "ngài", `yaṁ mamassa sukhāvahaṁ` là mệnh đề quan hệ *điều ấy sẽ đem lại an lạc cho
    tôi* (`sukhāvaha` → *an lạc*, khớp `tha-ap` và `pv`). Bản cũ *xin hãy rửa cho người ấy* /
    *nước này mang lại sự an ổn* đảo người và đưa "nước" vào chỗ không có.
  - `8.2`, `8.4`, `9.4` `pattacīvara` = **bát và y** (57 khoá trong tầng `kn`, 0 khoá nào dịch
    "áo lá"); `ekacīvara` = *chỉ mặc một y* (tiền lệ duy nhất khác: *bậc Mặc Một Tấm Áo*). Cụm
    cũ *một tấm áo lá làm chỗ che nắng* không có trong Pāli. `chāyāya` = *trong bóng mát*.
  - `5.3` `Paresaṁ bhatako poso` = *một người làm thuê cho kẻ khác* (`bhataka` = người làm
    thuê; 26 khoá trong tầng `kn` cùng gốc, nhất quán). `poso` = người, không phải *vị giới
    hạnh*; `asiñcati` là thì hiện tại kể chuyện → *đang tưới*.
  - `10.3`, `10.4` `pītiyā kāyaṁ sabbaṁ pharati attano` = *với niềm hỷ, thấm nhuần thân, toàn bộ
    của chính mình*; bản cũ *vui sướng thân thể / tràn đầy hạnh phúc* làm mất `kāya` và
    `sabbaṁ`. Vẫn **không phân xử được** `so` là người nói tự xưng ngôi ba hay vị khác;
    dịch trung tính *người ấy* (ambiguity giữ nguyên).
  - `12.2` `nānādijagaṇāyute`: `dija` = chim (các khoá khác có `dija-` đều dịch *chim*, vd.
    `dijābhighuṭṭhaṁ` → *vang tiếng chim*) → *đầy các đàn chim đủ loại*; bản cũ *các nhóm loài
    khác nhau* mất "chim".
  - `12.3` mất `naccagītehi` (múa và hát); `12.4` `purakkhato` → *được … vây quanh* (7 khoá trong
    tầng, vd. `accharāhi purakkhato` → *được các tiên nữ vây quanh*), bỏ *từ phía trước*.
  - `4.3` `yassa kammassidaṁ phalaṁ` là mệnh đề quan hệ "(nói) về nghiệp mà đây là quả báo", không
    phải câu khẳng định *quả báo của nghiệp này là thế*. Sửa theo đúng cách đọc đó (đã có đúng
    một tiền lệ trong tầng; 56/70 khoá cùng Pāli ở nơi khác vẫn dịch kiểu cũ — **lỗi lan**).

  *Sửa nhẹ (thêm chữ, mất từ, tên), 8 khoá:* `2.1` bỏ *thỏa thích* (không có trong Pāli);
  `2.4` `nāriyo` → *các nữ nhân* (tiền lệ `nārīgaṇa` → *đoàn nữ nhân*, để dành *tiên nữ* cho
  `accharā`), bỏ *lượn bay* (Pāli chỉ có `naccanti`), bỏ *trang sức … ròng*; `5.2` `patapante`
  → *khi mặt trời đang chói chang* (`patapati` là chiếu nóng, không có nghĩa "đã lặn"; ghi chú
  hapax cũ sai); `6.2` `vissuto` → *nổi danh* (tiền lệ *nổi tiếng/nổi danh*, 29 khoá);
  `7.1` *người ấy* → *vị ấy* (chỉ Sāriputta); `7.2` `avocaṁ` là **ngôi thứ nhất** → *tôi, người
  tưới xoài, đã nói*; `9.1`, `9.2`, `9.3` khôi phục tân ngữ `tañca` (*vị ấy*), `naro` →
  *người đàn ông*, `nhāpayī` → *đã tắm cho*; `10.2` `pasutaṁ anappakaṁ` → *đã tạo được phước đức
  không nhỏ* (tiền lệ *đã tạo công đức không nhỏ*), bỏ *vô tận*; `11.1` bỏ *lành* và *nhỏ bé*
  → *chỉ chừng ấy việc làm thôi*; `0.4`, `13.1` `Amba` = xoài, **không** phải tên nữ `Ambā` →
  *Cung Điện Xoài* (khớp `Cung Điện Xoài` ở bài `Ambavimāna` thứ tám, và tên tầng English
  *Mango Mansion*); `translationTitle` đổi theo.

  *Không đổi dù nghi ngờ / còn bất định:*
  - `0.2` `Purisavimāna` → *Chuyện Cung Điện Nam Hư Không*: `ākāsa` **không có** trong Pāli,
    *Hư Không* là sai (`vimāna` = cung điện/thiên cung). Lỗi lan cả phẩm (14 bài); không sửa
    riêng một tệp để khỏi lệch cả bộ — **cần sửa đồng loạt**. Vì thế `terminology` chỉ 8,4.
  - `1.4` `rucakatthatā`: *trải thảm rực rỡ* (8 tệp giống nhau; 3 tệp khác dịch ba cách khác nhau).
    `rucaka` có thể là vàng/đồ trang sức; chưa phân xử được, giữ.
  - `1.1` *Tòa lâu đài* so với *cung điện* ở tiêu đề: giữ cho khớp 8 bài chung khối 1.1–2.4.
  - `11.4` `nandanaṁ` giữ *rừng Nandana* (theo `vv40:2.4`); 12.1 cũng *rừng* nên lặp.
  - Người hỏi ở `3.1`–`3.3` (Moggallāna) và dẫn nhập `4.1`–`4.3` bị lược `…pe…` nên không
    thể xác nhận từ bài này; giữ nguyên.

  *Lan sang bài khác (không sửa ở đây, chỉ báo):* `yassa kammassidaṁ phalaṁ` 56/70 khoá cũ;
  `Paresaṁ bhatako ahaṁ` → *người bán thức ăn cho đám đông* ở `tha-ap497`; `Nāriyo ca naccanti
  suvaṇṇachannā` 9 khoá có *lượn*; `Tatthacchasi pivasi khādasi ca` 8 khoá *thỏa thích*;
  `nānādijagaṇāyute` / `Ramāmi naccagītehi` còn ở một tệp khác cùng lỗi.

  *Chấm lại, không nâng cho đẹp:* semantic_fidelity 9,3 → 8,6; grammar_logic 9,2 → 8,8;
  terminology 9,1 → 8,4; triangulation 7,5 → 7,0 (không có tầng tham khảo nào, và lượt đọc
  này cũng chỉ từ Pāli + tiền lệ nội bộ); vietnamese_clarity 9,3 → 8,8 (chuỗi 9.1–9.4 và 10.3–10.4
  buộc phải ngắt câu giữa chừng theo Pāli); han_viet_balance 9,4 → 9,2; ambiguity_integrity
  8,8 → 8,5; source_provenance 9,5 → 9,3 (nhiều khẳng định trong notes cũ sai); segment_alignment
  giữ 10,0, technical_integrity giữ 9,6 (bốn lệnh cổng chưa chạy ở lát này). `final_score`
  9,17 → 8,82: vào vùng `review` theo bảng ngưỡng; blocker không có tầng tham khảo tiếng Anh
  vẫn còn (giữ nguyên).
  Sửa lan 2026-10-13: khoá vv79:2.3, "Vị ngon cõi trời cùng năm dục công đức,"
  → "Vị ngon cõi trời cùng năm dục công đức ở nơi đây," (dibbā rasā
  kāmaguṇettha pañca: kāmaguṇettha = kāmaguṇā + ettha, "ở nơi đây" bị bỏ sót).
  Căn cứ: nguyên văn vv54:2.3, vv56:2.3, vv85:2.3 (cùng câu Pāli); vv55:2.3 và
  vv77:2.3 cũng có ettha (ở nơi đây / ở đây). Ngoài phạm vi, ghi nhận:
  vv57:2.3 và vv58:2.3 vẫn chưa có ettha.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 1 khoá bất đồng nghĩa → sửa 0, giữ 0, bất định 1 (1.4 `rucakatthatā`: bản nguyên bài viết «được trải lót bằng vàng», bản dự án «trải thảm rực rỡ tươi đẹp»; `rucaka` chỉ có thêm một chỗ nữa trong Pāli ghim (`Rucakupakiṇṇamidaṁ subhaṁ vimānaṁ`), không đủ để phân xử nghĩa «vàng» hay «rực rỡ» chỉ bằng tầng này, nên giữ cách dịch chung của 9/11 khoá cùng công thức `vv54`–`vv59`, `vv67`, `vv77`, `vv85` và ghi bất định; chữ «thảm» là cách hiểu `atthata` = trải, không có trong từ gốc). Các khoá còn lại cùng nghĩa: cung điện cột ngọc 12 do-tuần, 700 lầu gác, người làm thuê tưới vườn xoài cuối mùa hạ, Sāriputta mệt thân không mệt tâm, người tưới xoài mời tắm, Sāriputta ngồi gốc cây một y, nước trong, sinh vào Nandana. Ghi nhận khác biệt không phải lỗi: bản nguyên bài thêm cụm giải thích trong ngoặc đơn và gọi người nói là «ngươi»; bản dự án giữ «ngài» theo quy ước của tầng. Lượt review đối kháng riêng bản dự án không tìm thêm lỗi nghĩa; số liệu 12 do-tuần, 700 lầu gác khớp độc lập. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
