notes: |-
  COVERAGE. Đếm trên source/upstream-manifest.json tại commit đã ghim
  11c9d708978cde8ba61096d8a75f7ddfb846f639: tầng translation/en/sujato có thư mục kn/ja chỉ 83
  tệp (ja1..ja79, ja126, ja159, ja466, ja534), không tệp nào chứa khoá của bài này. Tầng
  translation/vi/phantuananh chỉ là Pháp Cú nên không có tầng Việt hiện hành cho bài này. Cả
  hai là giới hạn của bản chụp upstream, không phải thiếu sót của kho.

  DẤU LƯỢC. Pāli của bài không có …pe… hay (…); bản Việt cũng không có dấu lược nào.

  Giải quyết draft 2026-10-12 (thay thế các mục cũ của bài này về thuật ngữ, cặp Pāli trùng
  và blocker coverage; các mục cũ nói về cả lát nhiều bài, không còn áp dụng nguyên văn).

  KHOÁ ĐỔI (12/17 khoá thân kinh được sửa; 0 khoá tiêu đề đổi).
  (1) 1.1–1.2: bản cũ đảo vế qua ranh giới khoá (1.1 dịch mệnh đề quan hệ `yo seyyamupasevati`
  còn 1.2 dịch vế chính `seyyaṁso seyyaso hoti`) và thêm chữ "phước" không có trong Pāli;
  nay 1.1 = `seyyaṁso seyyaso hoti`, 1.2 = `yo seyyamupasevati`. `seyyaso` là dạng so sánh
  ("tốt hơn nữa"), không còn bị bỏ mất. "Tiếp thân" (không nghĩa) đổi thành "thân cận"
  (`upasevati`).
  (2) 1.3–1.4: `ekena sandhiṁ katvāna` dịch sát: hòa giải với một người (bản cũ: "lấy một bên mà
  hòa giải", câu cú lệch); `sataṁ vajjhe amocayiṁ` = "ta đã giải thoát một trăm người đáng bị
  giết" (`vajjhe` là những người đáng bị xử tử; `amocayiṁ` ngôi thứ nhất, người nói là vua nên
  xưng "ta", không xưng "tôi").
  (3) 2.1–2.2: bản cũ "làm cho hòa hợp thành một" thêm nghĩa gây khiến; `katvāna` chỉ là "sau
  khi hòa giải", `ekato` là "cùng nhau". "Thế giới" đổi thành "thế gian" theo tiền lệ (10 chỗ
  "cả/toàn thế gian" so với 2 chỗ "cả/toàn thế giới" trong các bài Jātaka đã dịch).
  (4) 2.3: `nigaccheyya` là thức nguyện/khả năng, bản cũ dịch như thì tương lai chắc chắn; nay
  "có thể đi đến cõi trời". 2.4: thêm "hỡi" cho cách hô `kāsiyā` (người Kāsi, số nhiều).
  (5) 3.1–3.2: bản cũ lệch ranh khoá, kéo tên Kaṃsa lên 3.1 trong khi Pāli để `Kaṁso` ở 3.2.
  Nay 3.1 = "vị đại vương" và 3.2 = "Kaṁsa, người nắm giữ Bārāṇasī". 3.2 dùng lại đúng
  cách dịch đã có của cùng Pāli ở ja521:3.2 (bản cũ "kẻ đã chiếm Varanasi" là chọn dạng
  khác và nặng nghĩa "chiếm"; Pāli `gaha` chỉ nói "nắm giữ/chiếm giữ", và tiền lệ Jātaka đo lại:
  `Bārāṇasī` 7 bài, `Varanasi` 3 bài gồm ja5, ja282 cũ và ja292 — nên dạng Bārāṇasī là đa số).
  (6) 3.3: `kaṇḍa` là mũi tên (ja13 dịch "mũi tên"), không phải tủ/ống tên; bản cũ "tủ tên" sai.
  Nay "đặt cung và tên xuống".
  (7) 3.4: `saṁyamaṁ ajjhupāgamī` — bản cũ dùng lại "bước đến nơi tự chế" của ja181:2.4 và
  ja541:172.4, nhưng "nơi" là nghĩa thêm: `saṁyama` là sự thu thúc, tự chế (đã dịch "sự tự chế"
  ở vv53, ja518, pe2, ja250), không phải chỗ chốn. Nay "đi đến sự tự chế". BÁO LỆCH: ja181:2.4 và
  ja541:172.4 cùng Pāli vẫn mang "bước đến nơi tự chế"; cần xem lại ở hai bài đó (không sửa
  ngoài phạm vi). Đếm: 3 cặp Pāli trùng ở thân kệ đã dò (3.1 với ja509:20.1, 3.2 với
  ja521:3.2, 3.4 với ja181:2.4 và ja541:172.4); 3.1 giữ đúng bản đã có ở ja509 ("Nói xong điều
  ấy, vị đại vương,"), 3.2 giữ đúng ja521, 3.4 là chỗ duy nhất cố ý khác tiền lệ.

  Số khoá lỗi nghĩa thật: 10/17 khoá (1.1, 1.2, 1.3, 1.4, 2.2, 2.3, 3.1 ranh giới, 3.2, 3.3,
  3.4); 2.1 và 2.4 chỉ sửa thuật ngữ/hô cách.

  GIẢI QUYẾT BLOCKER.
  - GIỮ: thiếu bản Anh Sujato tại commit đã ghim (sự thật về upstream).
  - GỠ: blocker "coverage tầng Anh đo được là 0 trên 0 khoá có nội dung". Mẫu số bằng 0 nghĩa
    là cổng coverage không đo được gì ở bài này (mọi vế kệ ngắn hơn ngưỡng 40 ký tự), nên
    không phải mất mát do Sujato bỏ trống đoạn có nội dung; đây là blocker do tác giả cũ tự
    đặt, không phải lỗi văn bản. Triangulation vì vậy chỉ ≤ 8,0 (nay 7,0), không phải blocker.

  BẤT ĐỊNH CÒN LẠI (không đoán). (a) `seyyaṁso seyyaso hoti`: `seyyaṁsa` là "có phần hơn/tốt
  hơn" (MN96 và ja480 dịch "tốt hơn"; chú giải đọc là "có phần tốt nhất"), `seyyaso` là "tốt
  hơn nữa"; bản Việt chọn "phần tốt đẹp nhất … càng tốt đẹp hơn" theo chú giải và tên bài. Cả
  `seyya` ở 1.2 vốn là dạng so sánh nhưng chú giải hiểu là điều thiện tối thượng; giữ "tốt đẹp
  nhất" cho nhất quán với tên bài. (b) `ekena` ("một người") theo chú giải là vị vua cướp bóc
  được hòa giải bằng tâm từ; Pāli chỉ nói "một", không nêu danh. (c) `Bārāṇasiggaho` giữ "người
  nắm giữ Bārāṇasī" theo ja521; Pāli không nói rõ chiếm bằng chiến tranh hay làm vua.

  TÊN BÀI. `Seyyajātaka` → Kinh Tốt Đẹp Nhất (giữ nguyên; khớp :0.4 và translationTitle).

  TAM GIÁC. Không có tầng Anh/Việt để đối chiếu; chú giải Jātaka và các bài song song trong
  kho (MN96, Dhp43, ja480, ja13, ja521) dùng như từ điển và để đo tiền lệ, không chép câu
  chữ nào vào thân kinh.

  KỸ THUẬT. Đã tự kiểm: đủ 17/17 khoá và không thừa so với Pāli, thứ tự khoá theo Pāli,
  ngoặc kép mở ở 1.1 và đóng ở 2.4 khớp Pāli. Đợt này không chạy cổng kỹ thuật của kho nên
  technical_integrity đặt 9.6; cần chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build` khi gộp.

  STATUS. Còn một blocker thật (thiếu bản Anh upstream); bài do công cụ quality:waive xử lý
