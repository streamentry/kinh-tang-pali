  Bị hạ nhẹ ở `triangulation`: không có tầng Anh nào, và `guṇa` vừa là thuật ngữ Phật
  học vừa là tên bài — tôi giữ chữ Pāli ở tiêu đề vì bài không có văn xuôi nào xác nhận
  đó là tên riêng của một nhân vật, và dịch `guṇa` là “đức/phẩm” sẽ là một lựa chọn
  diễn giải không có căn cứ trong khoá.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja157:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  Giải quyết draft 2026-10-12 (ja157). Đọc đối kháng lại cả 15 khoá từ Pāli; có 8/15 khoá
  đổi chữ (1.1, 1.4, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6; trong đó 2.3, 2.5, 2.6 là lỗi nghĩa nặng) và
  **mục "`migī` → rắn cái" ở phần thuật ngữ phía trên bị thay thế**: bài này không có rắn.
  Bối cảnh truyện (đối chiếu bản Anh của Cowell–Rouse và tóm tắt trong từ điển tên riêng,
  chỉ để hiểu cách đọc, không chép): sư tử (Bồ-tát) bị sa lầy, chó rừng cứu; sau đó sư tử
  cái ghen và đe dọa vợ chó rừng; sư tử đực nói bài kệ thứ hai với sư tử cái để bảo bà
  đừng khinh chó rừng.
  Lỗi nghĩa thật đã sửa (accuracy fix):
  - `2.6` `siṅgālo mama pāṇado` — bản cũ viết "con ong của ta sẽ đốt ngươi": sai hẳn.
    `siṅgāla` = chó rừng (50/103 khoá có `siṅgāl` trong tầng dùng "chó rừng"); `pāṇada` =
    người ban mạng sống (tiền lệ `ja483:15.4` "người ban mạng sống cho ta"). Nay: "chó rừng là
    người ban mạng sống cho ta."
  - `2.5` `Dāṭhini mātimaññittho` — bản cũ "hỡ Dāṭhi, ngươi coi ta là mẹ thì": sai.
    `mā atimaññittho` = "chớ khinh thường" (tiền lệ `atimaññ-` = khinh/coi thường: dn27, mn96,
    sn8.12); `dāṭhini` là hô cách giống cái của `dāṭhin` = "có nanh", chỉ sư tử cái vợ ông,
    không phải tên riêng. Nay: "hỡ nàng có nanh, chớ khinh thường,".
  - `2.3` `ñātako ca bandhu ca` — bản cũ "ruột thịt, là bạn bè": `bandhu` không phải bạn bè
    (`mitta`/`sakhā` mới là bạn). Nay "bà con, là thân quyến" (bà con 11/23 cho `ñāti-`;
    `bandhu` thân quyến/bà con theo `mnd1:42.4`, `cnd23:243.6`).
  - `2.4` `so mitto so ca me sakhā` — "bạn" (mitta) và "bạn đồng hành" (sakhā); `sakhā` có 4
    khoá đồng hành trong tầng (dn31:26.2…), nhưng cả hai chỗ đều giữ "bạn". Nay: "người ấy
    là bạn, là bạn đồng hành của ta;".
  - `2.1`/`2.2` `api cepi dubbalo mitto, mittadhammesu tiṭṭhati` — bản cũ "miễn là" biến
    nhượng bộ thành điều kiện; `api ce` = "dẫu cho". Nay "Dẫu người bạn yếu ớt, / vẫn đứng
    trong những bổn phận của bạn bè,"; `mittadhamma` số nhiều = "bổn phận của bạn bè", bỏ chữ
    "đạo hạnh". Tiền lệ `mittadhammo` = "tình bạn" ở `ja308:4.2`; đây là bản số nhiều nên giữ
    nghĩa bổn phận.
  - `1.1` `paṇāmeti` — "dẫn đi" làm nhẹ nghĩa; `paṇāmeti` là xua/đuổi đi (nghĩa đuổi/gạt đi). Nay "đuổi đi đâu thì đuổi".
  - `1.4` bỏ chữ "chính" (không có trong `saraṇato`).
  Giữ nguyên: `1.2` (`dhammo balavataṁ` = lẽ của kẻ mạnh), `1.3`, tiêu đề, `0.2`.
  Blocker đã xử lý: chỉ có một blocker, loại (A) thiếu bản Anh upstream — GIỮ NGUYÊN (là sự
  thật về bản chụp upstream; để công cụ miễn trừ của người biên tập xử lý). Không có blocker
  loại (B)/(C)/(D): không còn lỗi nghĩa nào chưa phân xử được trong thân kinh.
  Bất định còn lại (không đưa vào thân kinh): (1) ai nói bài kệ thứ nhất và ai là `migī`;
  bản Anh tham khảo hiểu "người bạn đời của ngươi gầm lớn" (sư tử cái gầm), còn ngữ pháp
  `unnadantī vijānāhi` thiên về người được gọi (`migī`, giống cái) là kẻ đang gào; tôi giữ
  cách đọc theo ngữ pháp, ghi cách đọc kia ở đây. (2) `0.3` `Daḷhavagga` → "Phẩm Tàn Tật" kế
  thừa từ 9 bài anh em (`ja151`–`ja160`); `daḷha` nghĩa là vững/cứng/mạnh, không phải tàn tật,
  nên tên phẩm này có vẻ sai nhưng nằm ngoài phạm vi tệp của bài, cần người điều phối đổi
  đồng loạt (ja159 còn khác: "Phẩm Người Yêu"); tôi không sửa riêng một bài để tránh vênh
  tầng, và đã hạ `terminology` và `semantic_fidelity` tương ứng. (3) `dāṭhini` đọc là tính từ
  "có nanh", không phải tên riêng. (4) `Guṇa` giữ chữ Pāli ở tiêu đề.
  Tầng tham khảo: không có Sujato, không có Việt hiện hành, không có tầng lấp English ⇒
  `triangulation` 7,0 (≤ 8,0). Pāli có nội dung ≥ 40 ký tự: 0/15 khoá (mẫu số = 0), nên cổng độ
  phủ không đo được gì ở bài này. Không có Pāli trùng nguyên văn trong chính bài (phép rỗng,
  nói thẳng). Số Pāli: không có. Dấu lược: không có `…`/`(…)` ở Pāli nên Việt cũng không có.
  `technical_integrity` giữ 9,6: chưa chạy `npm run validate`, `npm test`, `npm run check`,
  `npm run build` trong lượt này.
