  CÔNG THỨC ĐÃ THEO TIỀN LỆ (đếm trên đĩa):
  - `<Tên>jātakaṁ <thứ tự>.` → `Kinh <Tên> thứ <N>.` — 145/179 cặp ở JA không có dấu
    phẩy trước “thứ”, nên 14 bài này không dùng dấu phẩy (nhóm 34× có dấu phẩy là thiểu số).
  - `<Vagga>vaggo <thứ tự>.` → `Phẩm <Tên> thứ <N>.` — dạng `Phẩm Tâm thứ ba.`,
    `Phẩm Rắn Độc thứ nhất.` có sẵn; chỉ có 2 khoá trong lát (`ja20:2.2`, `ja30:2.2`).
  - `0.1` `Jātaka` → giữ `Jātaka` (hàng trăm bài JA đã giữ nguyên như vậy).
  - Thứ tự số: `paṭhamaṁ`…`dasamaṁ` → *thứ nhất…thứ mười*, khớp các bài lân cận.

  BẤT ĐỊNH CHƯA PHÂN XỬ (đã ghi ở đây, **không** đưa vào thân kinh):
  - `ja184:1.4` và `2.6` `tassevānuvidhiyyati`: `tassa eva` = “chỉ cái ấy”, nhưng Pāli ở
    bài kệ ngắn này **không nói cái ấy là gì**, và cả hai khoá dùng đúng một công thức.
    Tôi giữ đại từ “đó” và không bịa mục tiêu.
  - `ja184:2.2` `sikharākārakappito`: `sikharākāra` là “có đỉnh”, dịch *đủ tài đệ nhất*; đây
    là cách đọc bảo thủ, không khẳng định người ấy đã chứng ngộ.
  - `ja186:2.4` `nisevare`: đọc là `nis-varati` (rơi xuống). Chi tiết này ảnh hưởng hình
    ảnh nhưng không đổi nghĩa chung của khoảng; tôi giữ hình ảnh, không thêm giải thích.
  - `ja157:1.4` `jātaṁ saraṇato bhayaṁ`: đọc là “sinh ra làm nơi nương tựa và làm nỗi sợ
    hãi”; có thể đọc khác là “sinh ra để nương tựa và để kinh sợ”, cùng nghĩa.
  - `ja20:1.3` `pissāma` là ngôi số nhiều nhưng `maṁ` ở `1.4` là số ít. Tôi dịch cả hai
    về số ít cho nhất quán và ghi ra đây; không sửa được gì trong Pāli.
  - `ja219:2.3` `Lambatthano veṇikato`: chỉ giữ hình ảnh “thoi dài buộc chỉ”, không khẳng
    định thêm chi tiết về người ấy.
  - `ja226:1.6` `dhaṅka` có thể là *quạ* hoặc *bói cá*; chọn *quạ*.

