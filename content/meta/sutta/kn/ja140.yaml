notes: |-
  Đủ 15/15 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Khung: Asampadānavagga → Phẩm Asampadāna (trùng nguyên văn với chín khoá 0.3 của ja131–ja139, đã có trong tầng — đây là một trong những cặp Pāli trùng mà tôi tự tra ra); `Asampadānavaggo cuddasamo.` → Phẩm Asampadāna, thứ mười bốn. `kāka` = quạ nên Kinh Con Quạ, khớp với cách dịch tên loài của tầng (Kinh Heo, Kinh Con Công).

  Bất định cần người đọc biết:
  · `ubbiggahadayā` tôi dịch gào lên tiếng. `ubbiggaha` là nhấc bổng (giọng/tay), nhưng thành ngữ chung trong kinh là tiếng la. Đây là cách đọc theo nghĩa thành ngữ; ghi lại vì không có tiền lệ `ubbiggaha` nào trong tầng (đã đếm, 0).
  · `kākānamhāka ñātinan` tôi dịch trên bọn đồng loại quạ của chúng ta. Cụm này khó: `amhāka` là của chúng ta, `kākā` có thể là danh từ chỉ loài quạ (cái mà theo sau là `ñātina` = đồng bọn/anh em), nhưng cũng có thể là chữ tốt ý khác. Tôi giữ nghĩa đồng loại vì nó làm câu 1.3–1.4 đọc được (không ai trong chúng có quyền trên đồng bọn của chính mình), và đây là chỗ tôi chấm thấp nhất trong bài.

  Uddāna `Itarītara rakkhasi khemiyo ca, / Parosatapañhena ābhassaro puna; / Atha haṁsavaruttamababbujaṭaṁ, / Paṭanaṭṭhaka kākavarena dasāti.` Giữ tên, chỉ dịch `atha` thành Rồi, `puna` thành lại nữa (nhất quán với ja110) và vế đếm số. Đối chiếu với tên chín bài khác trong phẩm (Asampadāna, Bhīruka, Ghatāsana, Jhānasodhana, Candābhaja, Suvaṇṇahaṁsa, Babbuja, Godha, Ubhatobhaṭṭha) thì uddāna không khớp một-một; chỉ Babbujaṭa và Haṁsavaruttama còn dấu vết của ja137 Suvaṇṇahaṁsajātaka. Ghi bất định, không đoán.

  LỖ HỔNG TẦNG THAM KHẢO: Không có tầng tham khảo English Sujato tại commit đã ghim: đã duyệt .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ và không có tệp cho uid này (0/15 khoá có prose), và tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên Khuddaka Nikāya cũng không có bản Hòa thượng Thích Minh Châu; bài dịch chỉ từ Pāli, chưa đối chiếu được tầng tham khảo nào nên giữ draft. Mọi khoá Pāli dưới 40 ký tự nên mẫu số coverage rỗng, bài vẫn giữ draft vì không có tầng tham khảo nào để đối chiếu. Bản Việt hiện hành không có cho Jātaka.

  Kiểm thủ công trên TOÀN BỘ 15 khoá (kiểm() rỗng): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược bằng Pāli (cả hai phía 0), nháy kép cân (mở 1.1, đóng 1.4), không `(…)` dở. save_vi hai lần, idempotent.
