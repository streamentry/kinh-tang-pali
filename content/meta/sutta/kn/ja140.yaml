notes: |-
  Đủ 15/15 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Khung: Asampadānavagga → Phẩm Asampadāna (trùng nguyên văn với chín khoá 0.3 của ja131–ja139, đã có trong tầng — đây là một trong những cặp Pāli trùng mà tôi tự tra ra); `Asampadānavaggo cuddasamo.` → Phẩm Asampadāna, thứ mười bốn. `kāka` = quạ nên Kinh Con Quạ, khớp với cách dịch tên loài của tầng (Kinh Heo, Kinh Con Công).

  Bất định cần người đọc biết:
  · `ubbiggahadayā` tôi dịch gào lên tiếng. `ubbiggaha` là nhấc bổng (giọng/tay), nhưng thành ngữ chung trong kinh là tiếng la. Đây là cách đọc theo nghĩa thành ngữ; ghi lại vì không có tiền lệ `ubbiggaha` nào trong tầng (đã đếm, 0).
  · `kākānamhāka ñātinan` tôi dịch trên bọn đồng loại quạ của chúng ta. Cụm này khó: `amhāka` là của chúng ta, `kākā` có thể là danh từ chỉ loài quạ (cái mà theo sau là `ñātina` = đồng bọn/anh em), nhưng cũng có thể là chữ tốt ý khác. Tôi giữ nghĩa đồng loại vì nó làm câu 1.3–1.4 đọc được (không ai trong chúng có quyền trên đồng bọn của chính mình), và đây là chỗ tôi chấm thấp nhất trong bài.

  Uddāna `Itarītara rakkhasi khemiyo ca, / Parosatapañhena ābhassaro puna; / Atha haṁsavaruttamababbujaṭaṁ, / Paṭanaṭṭhaka kākavarena dasāti.` Giữ tên, chỉ dịch `atha` thành Rồi, `puna` thành lại nữa (nhất quán với ja110) và vế đếm số. Đối chiếu với tên chín bài khác trong phẩm (Asampadāna, Bhīruka, Ghatāsana, Jhānasodhana, Candābhaja, Suvaṇṇahaṁsa, Babbuja, Godha, Ubhatobhaṭṭha) thì uddāna không khớp một-một; chỉ Babbujaṭa và Haṁsavaruttama còn dấu vết của ja137 Suvaṇṇahaṁsajātaka. Ghi bất định, không đoán.

  LỖ HỔNG TẦNG THAM KHẢO: Không có tầng tham khảo English Sujato tại commit đã ghim: đã duyệt .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ và không có tệp cho uid này (0/15 khoá có prose), và tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên Khuddaka Nikāya cũng không có bản Hòa thượng Thích Minh Châu; bài dịch chỉ từ Pāli, chưa đối chiếu được tầng tham khảo nào nên giữ draft. Mọi khoá Pāli dưới 40 ký tự nên mẫu số coverage rỗng, bài vẫn giữ draft vì không có tầng tham khảo nào để đối chiếu. Bản Việt hiện hành không có cho Jātaka.

  Kiểm thủ công trên TOÀN BỘ 15 khoá (kiểm() rỗng): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược bằng Pāli (cả hai phía 0), nháy kép cân (mở 1.1, đóng 1.4), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.

  Lượt cải thiện 2026-10-11 (đọc đối kháng lại; 5/15 khoá đổi: 1.1, 1.2, 1.3, 1.4, 4.3).
  · LỖI NGHIÊM TRỌNG ĐÃ SỬA ở 1.1–1.4 (accuracy fix). Bản trước hiểu `ubbiggahadayā` là "gào lên tiếng" và `vasā` là "quyền", nên cả bài kệ thành "không ai trong chúng có quyền trên bọn đồng loại quạ": sai nghĩa. Ghi chú cũ ở trên về `ubbiggaha` (nhấc bổng/tiếng la) KHÔNG còn giá trị. `ubbigga` là "hoảng hốt, nơm nớp lo sợ" (tiền lệ trong tầng: ja394:2.3 cùng một cụm `niccaṁ ubbiggahadayassa` → "Lòng lúc nào cũng nơm nớp lo âu sợ hãi"; ja394:3.1 `niccaṁ ubbegino kākā` nói đúng về loài quạ; pv38, thag16.8, ud2.10, bv2 đều là sợ hãi). `vasā` ở đây là "mỡ" (như trong danh sách mười hai chất lỏng của thân mn28/mn62/mn140: `medo … vasā`), không phải `vasa` = quyền lực. Căn cứ phân xử: lời giải của Chú giải Jātaka cho bài này đọc `nesaṁ vasā natthi` là loài quạ chắc chắn không có mỡ, `nesaṁ` quy về loài quạ, và `kākānamhāka ñātinaṁ` được giải là "loài quạ, thân quyến của chúng ta" (đọc qua bản trực tuyến ancient-buddhist-texts.net; đây là nguồn ngoài các tầng đã ghim, chỉ dùng để hiểu cách đọc, không chép câu chữ). Về ngữ pháp: `nesaṁ` và `kākānaṁ amhāka(ṁ) ñātinaṁ` đều là sở hữu cách số nhiều đồng vị, nên 1.4 đứng cùng chủ ngữ "chúng" của 1.3, không phải "kẻ khác" bị chúng cai trị.
  · 1.1 → "Lòng luôn nơm nớp lo sợ" (trước: "Chúng cứ luôn gào lên tiếng"); 1.2 → "quấy nhiễu cả thế gian" (trước: "làm phiền khổ tất cả các thế giới"; `viheṭheti/vihesa` → "quấy nhiễu" là tiền lệ đa số trong mn50, mn82, dn5, dn32; `sabbaloka` → "cả thế gian" 15 khoá, "khắp thế gian" 13, "tất cả các thế giới" chỉ 1); 1.3 → "Vì vậy chúng không có mỡ —"; 1.4 → "loài quạ, họ hàng của chúng ta." (trước: "đồng loại"; `ñāti` → thân quyến 13 · bà con 13 · họ hàng 12, còn "đồng loại" chỉ có đúng chỗ này).
  · 4.3 (terminology fix): `haṁsavaruttamababbujaṭaṁ` tách thành Haṁsavaruttama, Babbu, Jaṭa thay vì "Babbujaṭa" một tên. Căn cứ: uddāna liệt kê đúng mười bài ja131–ja140 theo từ khoá trong kệ của từng bài: Itarītara (ja131:1.1 `asampadānenitarītarassa`), Rakkhasī (ja132:1.3), Khemiyo (ja133:1.1 `khemaṁ`), Ābhassara (ja135:1.4), Haṁsa (ja136:1.3), Babbu (ja137:1.1), Jaṭa (ja138:1.1 `jaṭāhi`), Paṭa/naṭṭha (ja139:1.1 `paṭo naṭṭho`), Kāka (ja140). Đếm được 10 mục, khớp `dasāti`. Ghi chú cũ gán "ja137 Suvaṇṇahaṁsa" là sai: Suvaṇṇahaṁsa là ja136, ja137 là Babbu.
  · Điểm đổi: semantic_fidelity 8.9 → 9.1 và grammar_logic 9.0 → 9.2 (sửa sai nghĩa ở lõi bài kệ); ambiguity_integrity 8.7 → 8.8 (hết bất định ở `ubbigga`, `vasā`, `kākānamhāka ñātinaṁ`; còn lại bất định nhỏ bên dưới). Các tiêu chí khác giữ nguyên; triangulation giữ 6.6 vì tầng đã ghim vẫn không có bản Anh hay Việt nào, lời giải chú giải là nguồn ngoài.
  · Bất định còn lại: (1) `sabbalokavihesakā` dịch theo nghĩa chủ động (quạ quấy nhiễu mọi người), theo từ vựng `vihesaka` và lối giải của chú giải; nghĩa bị động (quạ bị cả thế gian quấy nhiễu) không loại trừ hẳn về ngữ pháp, tuy cả hai đều dẫn đến "nên không có mỡ". (2) Trong uddāna, `Parosatapañha` (khoá ứng với ja134, kệ ja134 không chứa từ này) và `Paṭanaṭṭhaka` (có thể là `paṭo naṭṭho` ghép hậu tố) chưa phân xử được chắc chắn nên giữ nguyên tên, không dịch. `Haṁsavaruttama` giữ một tên.
