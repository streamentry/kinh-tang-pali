notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Không khoá nào có …pe… nên hai phía đều 0 dấu lược; khoá 2.7 giữ đúng hai dấu lược của Pāli (… trước, …. sau). Dấu nháy kép mở ở 1.1 và đóng ở 2.6 đúng như Pāli.

  Pāli trùng nguyên văn, đã dùng lại nguyên văn có sẵn: 2.6 natthi dani punabbhavoti trùng thag1.87:1.4 và thag2.25:2.4, giữ đúng một chữ nay không còn tái sinh nữa ti. Cùng công thức cầu kết trong 9 bài khác nữa nên đây là cặp thứ 3 mà lát này tái dùng.

  Tiền lệ có đếm và dùng lại: Dukanipata → Bộ Hai Bài Kinh (152, cùng khung với thag2.25 và thag1.107); Pañcamavagga → Phẩm Thứ Năm (26); tiêu đề dạng Kumārakassapattheragāthā → Kinh Kệ Của Trưởng Lão + tên (thag2.38, thag1.107); dòng tên người kết … X thero …. → … Trưởng lão X …. (thag2.38:2.5, thag1.107:1.5). 0 tiền lệ, đặt mới: sacchikā → tự thắng tri; sampadā → thành tựu; pacchimaka/carimāyaṁ samussaya → vị sau chót / lần khép lại cuối cùng; asaṅkheyya-kappa → kỷ nguyên không thể đo lường. Chữ mạt 1.1-1.2 dùng Aho làm thán từ tiếc nuối, dịch Ôi.

  Bất định chưa phân xử hẳn, ghi lại đây: sakkāyādhigata (2.2) không có tiền lệ nào trong tầng. Anh Sujato đã ghim dịch substantial forms, nhưng sakkāya cũng đọc được là sự tôn kính, và câu 2.3-2.4 (Trong số họ, đây là vị sau chót) chỉ có nghĩa khi động từ chủ động là các vị Giác Ngộ trong quá khứ. Đã chọn những vị ấy đã được tôn kính vì giữ được chủ thể xuyên suốt hai khoảng kệ và không biến 2.2 thành một mệnh đề vô chủ thể. Đây là điểm khó nhất của bài nên ambiguity_integrity hạ xuống 8.9.

  Triangulation: có English Sujato đủ 15/15 khoá tại .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/thag/thag2.41; vì toàn bộ khoá đều ngắn dưới 40 ký tự nên kiểm coverage theo kiểu kiểm() không chạy, nhưng từng khoá đã đối chiếu tay. Không có Việt hiện hành cho Khuddaka Nikāya tại commit đã ghin. Không chạy được npm run validate|test|check|build theo lệnh phân công đợt này, nên technical_integrity là 9.6 và đã tự kiểm bằng script đọc từ đĩa.
