notes: |-
  Tiền lệ: 0.1 giữ nguyên Jātaka theo ja1:0.1; 0.2 Bộ Một Bài Kinh theo ja1:0.2
  (cùng cách dịch có mặt ở thag/thig, hơn 10 lượt); mittāni → tình bạn (từ này
  đã có trong tầng dự án); bāla → kẻ ngu (tiền lệ mn/sn); bhusa → trấu (tiền lệ
  cụm không cám, không trấu). Asampadāna 0 tiền lệ nên giữ nguyên tên bài và tên
  phẩm, không đặt nghĩa mới.
  Bất định: 1.3 aḍḍhamānaṁ đọc là nửa phần đong (aḍḍha + māna) mà người nói chấp
  nhận khi gánh trấu; cũng có thể đọc là trạng thái bị đòi phân nửa. 1.4 sassatāya
  đọc là cho mãi mãi, đi với mā + jīyittha thành lời mong tình bạn đừng suy tàn.
  semantic và grammar hạ điểm vì hai chỗ này chỉ ở mức đọc chữ bảo vệ được.
  Thiếu tầng Anh nên triangulation chỉ 7.0 và bài ở draft.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 5 khoá chênh lệch lớn nhất. Khác nghĩa 2: sửa 0, giữ 0, bất định 2 (1.2 `kalī`: 'đi đến đổ vỡ' của bản dự án, 'trở thành tai họa' của bản mù; tầng có `kalī` = 'vận rủi' ở ne37:61.3 và snp3.10:16.3, nên cách đọc 'thất bại/tai họa/đổ vỡ' đều bảo vệ được nhưng chưa phân xử; 1.3 `aḍḍhamānaṁ`: 'nhận lấy nửa phần' của bản dự án, 'nửa đấu' của bản mù ⟦?⟧, cùng chung ý 'một nửa' nhưng chưa rõ phần hay đơn vị đong). Ba khoá còn lại chỉ khác diễn đạt (1.1, 1.4, 0.4), giữ. Rà đối kháng toàn bài: không lỗi nháy, dấu lược, số hay xưng hô. Không có bản Anh hay bản Việt độc lập khác; mọi phân xử dựa vào Pāli và tiền lệ nội bộ tầng.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản Anh, bản Việt nguyên bài hay đoạn song song): sửa 1 khoá — `1.3`: `harāmi bhusaṁ aḍḍhamānaṁ` là một cụm đối cách: `aḍḍhamānaṁ` (aḍḍha + māna, *nửa đơn vị đong*) đồng vị với `bhusaṁ`, nên là *nửa đấu trấu* mà người nói mang đi; bản cũ *"ta gánh trấu đi, nhận lấy nửa phần"* tách thành hai hành động (*gánh*, *nhận lấy*) không có trong Pāli và thêm sắc *gánh* cho `harāmi` (*mang, đem đi*). Nay *"vì vậy ta mang đi nửa đấu trấu,"*. Bất định `aḍḍhamānaṁ` ghi trước được phân xử theo ngữ pháp này. Giữ: `1.1` `itarītarassa` (*người này người khác*; cách đọc *bất cứ thứ gì* cũng bảo vệ được, ghi bất định), `1.2` `kalī` *đổ vỡ*, `1.4` `sassatāyaṁ` *đừng bao giờ*.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
