notes: |-
  Bản này chỉ có **một** tầng tham khảo: Pāli root đã ghim. **Không có Anh Sujato** —
  tại commit đã ghim thư mục `translation/en/sujato/sutta/kn/ja/` có **83** tệp
  (ja1–ja79, ja126, ja159, ja466, ja534) và **không** có tệp nào cho 14 uid của lát này.
  Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho. Tầng Việt hiện
  hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên Jātaka
  không có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` chỉ
  8,0–8,4: dịch từ Pāli, phân xử cú pháp bằng **Pāli trùng nguyên văn ở bài khác** (sn3.15,
  sn21.6, ja202, thag2.38, vv33) và bằng chú giải Jātaka khi Pāli gốc im lặng.
  **Cổng kỹ thuật chưa chạy.** Đợt này cấm `npm run validate|test|check|build`, nên tôi
  **không** thể tuyên bố technical gate pass; `technical_integrity` hạ còn 9,8 và bốn
  lệnh đó để người điều phối chạy.
  **13 khoá, đủ cả bài** (`:0.1`–`:0.4` tiêu đề, `:1.1`–`:2.4` kệ, `:3.1` dòng kết).
  `kiểm()` của `_hvi.py` chỉ quét khoá Pāli **≥ 40 ký tự**, mà lát này **không có khoá nào**
  rơi vào tập đó — nên tôi tự kiểm riêng **mọi** khoá: phủ đủ 13/13, không rỗng, NFC,
  không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, dấu
  câu cuối câu kệ khớp Pāli, không còn `(…)`. Pāli lát này **không có** `…pe…` nên hai
  phía đều 0 dấu lược.
  **Tiền lệ dùng lại, đếm được trên tầng Việt:** `:0.1` `Jātaka` giữ nguyên (171 tệp
  Jātaka); `:0.2` `Dukanipāta` → *Bộ Một Bài Kinh* (237 tệp); `:0.3` `…vagga` → *Phẩm
  <tên>*, theo khuôn `Phẩm Haṁci` (ja117:0.3) và `Phẩm Bīraṇathambha` (ja211:0.3);
  dòng kết `<Tên>jātakaṁ <số>ṁ` → *Kinh <Tên> thứ <tư>*, theo `ja22:2.1` (*Kinh Chó Săn
  thứ hai.*).
  **Pāli trùng nguyên văn với bài `published`, khớp tuyệt đối.** `Kālañca paṭikaṅkhāmi,`
  trùng `thag2.38:2.3` (`published`) — tôi dùng lại đúng nguyên văn *Tôi chờ đợi thời
  khắc,*, kể cả dấu phẩy.
  **`varatta` tôi dịch *phá nhà*, không phải *người cướp* — có lý do.** `vatā` (`1.1`) là
  cách xưng hô với chó, nên `yo varattaṁ` không phải kẻ cướp (chó không cần trừng trội
  người quen) mà là kẻ phá vào — tức kẻ trộm đột nhà mà chó phải giữ. Cụm *kẻ phá nhà*
  giữ được nghĩa *vào nhà bằng sức* của `varat-` mà không gán thêm ý *người cướp*; nếu
  người biên tập chọn nghĩa *kẻ trộm* thì phải sửa cả hai vế cho nhất quán.
  **Câu 1 hơi chật vì Pāli chật.** `Bālo vatāyaṁ sunakho, / yo varattaṁ na khādati` —
  `khādati` (cắn, ăn) hiển nhiên là nghĩa *cắn* của chó chứ không phải *ăn*, nhưng dùng
  *cắn* ở vế đối xứng với *cho ăn* ở `1.4` sẽ lặp từ trong cùng một bài kệ, nên tôi giữ
  *không cắn* — và đây là lý do `grammar_logic` không lên 9,4.
  **Tên bài** `sunakha` = *chó nhà, chó bác*, tôi dịch *Kinh Con Chó* theo khuôn tên con
  vật của tầng (ja113 *Kinh Chó Rừng*, ja153 *Kinh Heo*).
