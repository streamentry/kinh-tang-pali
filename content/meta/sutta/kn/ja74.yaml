notes: |-
  9 khoá, phủ đủ, ngoặc kép cân. Không có blocker.
  
  **Bài sạch nhất trong nhóm Tăng Bộ của rv7.** Toàn bộ bốn vế đúng, và quan trọng hơn: bản dịch giữ được **logic so sánh** của cả kệ, là thứ dễ hỏng nhất.
  
  **Kệ nói:** tốt khi có nhiều người thân — và điều đó đúng cả với cây rừng: gió hạt kẻ đứng một mình, **dù nó lớn và là chúa rừng**. Bản dịch giữ đúng cả tầng so sánh: `api rukkhā araññajā` → *dù là cây cối mọc trong rừng* (`api` = dù/vẫn), và `brahantampi vanappatin` → *dù lớn, dù là chúa rừng* (`brahantampi` = dù rất lớn). Hai chữ `api` đều được giữ thành *dù* — nếu bỏ, câu sẽ thành khẳng định suông và mất đúng cái nhấn điểm của kệ.
  
  **`Vāto vahati ekaṭṭhaṁ` → *gió cuốn đi kẻ đứng một mình*.** `ekaṭṭha` = đứng một mình / trơ trọi không chỗ bám ✓; `vahati` = cuốn đi, thổi bay ✓. Chủ ngữ `Vāto` (gió) đứng đầu và được giữ.
  
  **`Sādhū sambahulā ñātī` → *Tốt làm khi thân tộc đông đảo*.** `ñātī` là số nhiều của `ñāti` (họ hàng, thân tộc) ✓; `sambahulā` = đông đảo ✓; `sādhū` = tốt làm ✓. Ba tầng nghĩa đủ.
  
  **`vanappatin` → *chúa rừng*.** `vanappati` là danh xưng của voi trong tầng Pāli ("chúa rừng"). Bản dịch giữ hình thức danh xưng thay vì dịch thẳng *voi*; Sujato cũng dịch *lord of the forest*. Có thể biên tập muốn thêm *voi* cho rõ, nhưng đây là lựa chọn hợp lệ, không trừ.
  
  **`Rukkhadhammajātaka` → *Kinh Pháp Của Cây* ✓.** `rukkhadhamme" là "pháp của cây cối"; bản dịch bỏ *cối* ở `0.4` (*Kinh Pháp Của Cây*) trong khi Sujato dịch *The Law of Trees* — vẫn đúng nghĩa.
  
  **Tên phẩm `Varuṇavagga` → *Phẩm Cây Varuṇa* ✓** trùng nguyên văn 9 tệp đã có, và `ja71` trong cùng lô cũng dùng y hệt. Đây là cặp nhất quán tốt nhất của lô.
  
  **Tầng Anh** có mặt đủ bốn vế và xác nhận hai tầng của `vahati`.
  
  **Tầng Việt**: không có Thích Minh Châu cho Tăng Bộ ở commit đã ghim.
