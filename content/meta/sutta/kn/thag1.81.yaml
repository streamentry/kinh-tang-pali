notes: |-
  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG. `_hvi.kiểm` chỉ quét `cần` = khoá Pāli ≥ 40 ký tự. Ở 16/17 bài của lát này khoá Pāli dài nhất chỉ 19–35 ký tự nên `cần` rỗng và vòng chốt NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG CHẠY LẦN NÀO. Tôi tự quét lại **164/164 khoá** bằng chính các hàm đó (`_chk_rv3.py`): 0 lỗi — không khoá rỗng, không khoá thừa so với Pāli, không thiếu khoá, mọi chuỗi NFC, số dấu lược khớp Pāli từng khoá, ngoặc kép cân trên cả bài, ngoặc tròn cân, không còn `(…)`, không còn sót `pe…`. Chỉ `mil3.1.7` có 4 khoá ≥ 40 ký tự (`:1.2`–`:1.5`) nên ở bài đó chốt thật sự có chạy. `save_vi` chạy sạch, chạy lại hai lần idempotent.

  COVERAGE — ĐO BẰNG CHÍNH HÀM CỦA KHO (chỉ đọc, `englishCoverageFor`). Cả **17/17 bài ra `ratio = 1`**: 16 bài có `substantiveSegments = 0` vì không khoá Pāli nào đủ 40 ký tự; `mil3.1.7` có 4 khoá substantive. Không bài nào rơi dưới ngưỡng 0,8 nên **không** cần mục trong `content/meta/reference-gaps.yaml` — tệp đó tôi không đụng tới.

  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho bất kỳ bài nào trong lát này. Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là **Pāli + English Sujato + các bài song song trong chính tầng này**.

  KỸ THUẬT. Tôi KHÔNG chạy `npm run validate|test|build|check` — đợt này người điều phối cấm và chạy tập trung. Vì vậy `technical_integrity` chấm **9.6 chứ không phải 10.0**; đó là hạn chế thật của lượt đánh giá này chứ không phải lời khen. Tất cả những gì chạy được thì đã chạy.

  **BỐN VẾ CÓ HAI DẠNG KHÁC TRONG KINH ĐIỂN, TÔI THEO DẠNG CỦA BÀI NÀY.** `Yaṁ mayā pakataṁ pāpaṁ, / pubbe aññāsu jātisu;` trùng `thag5.7:2.1`–`2.2` (cùng hai vế, nhưng `2.3` ở đó là `Taṁ dānīdha pavāhemi’`), còn dạng `Tadā hi pakataṁ pāpaṁ` / `Tathā hi pakataṁ pāpaṁ` nằm ở `ja314:3.3`, `ja540:36.3`, `pv50:2.3`, `ne37:458.3`. Tôi dịch đúng theo dạng bài này.

  **ĐÃ SỬA `1.2`: bản cũ dịch thừa, đọc thành câu vô nghĩa.** Bản cũ viết *những kiếp trước, ở các đời khác*. Vế 2 chỉ có `pubbe aññāsu jātisu` — `jātisu` xuất hiện **một lần**, nhưng bản cũ dịch nó thành **hai** (*kiếp* + *đời*), và kết quả là *những kiếp trước, ở các đời khác*: hai chữ chỉ một nghĩa, đọc thành lặp. Tôi sửa thành *ở những kiếp khác trước đây*, giữ đủ cả hai mệnh đề `aññāsu` (*khác*) và `pubbe` (*trước đây*) vì Pāli có cả hai.

  **ĐÃ SỬA `1.3`–`1.4` THEO PĀLI TRÙNG NGUYÊN VĂN.** `Idheva taṁ vedanīyaṁ, / vatthu aññaṁ na vijjatī` **y hệt** `an3.34:13.5–13.6`, và bài đó đã `published` với cách dịch *Sẽ được thọ ngay tại đây, / không có chỗ nào khác*. Bản cũ của bài này viết *chính ở đây điều ấy phải được nếm trả,* và *ở nơi nào khác không hề có*. Tôi sửa thành *chính ở đây điều ấy phải được thọ,* và *không có chỗ nào khác*. Hai lý do: (1) `vedanīya` là *điều phải được cảm nhận*, chữ *trả* trong *nếm trả* không có ở Pāli; (2) Pāli trùng thì phải dùng lại nguyên văn cách dịch đã có, nếu không thì cùng một câu Pāli sẽ mang hai bản dịch. `idheva` nhấn *chính ở đây* như bản cũ đã ghi. Giữ nguyên quan sát đúng của bản cũ: `vatthu` là *nền tảng/chỗ*, không phải *vải lụa* như `vattha` trong Pháp Cú — đó là chỗ dễ bẻ nhẹ nhất của câu này.

  `0.3 Navamavagga` → *Phẩm Thứ Chín*; `0.4 Samitiguttattheragāthā` → *Kinh Kệ Của Trưởng Lão Samitigutta*; `1.5` giữ hai dấu lược.
