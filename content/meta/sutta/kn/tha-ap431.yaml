  · Tên Pháp `Sovaṇṇakiṅkaṇiya` giữ nguyên Pāli (tên riêng ghép `sovaṇṇa` + `kiṅkaṇi` + `-iya`), như `Koraṇḍapupphiya`, `Kiṅkaṇipupphiya` ở bài lân cận; `kiṅkaṇi` là tên loài hoa chưa xác định, tầng giữ nguyên "hoa kiṅkaṇi" ở 7 khoá.
  · Lời kết `Itthaṁ sudaṁ … abhāsitthāti` dùng nhóm **số nhiều** "đã nói những bài kệ này": 472 khoá, so với 3 khoá "đã từng nói bài kệ này" ở `tha-ap`.
  · `Atthadassī`: giữ tên Pāli ("Đức Thế Tôn Atthadassī", "Đức Atthadassī") theo các bài mới hơn (`tha-ap470`, `tha-ap386`, `tha-ap490`, `tha-ap223`); bốn khoá cũ dịch `Atthadassī tu bhagavā` thành "bậc Đã Thấy Pháp" (`tha-ap135`, `tha-ap173`, `tha-ap68`: 3 khoá "Nhưng Đức Thế Tôn, bậc Đã Thấy Pháp", `tha-ap69`: 1 khoá) — không theo vì `attha` là *nghĩa/mục đích*, không phải *pháp*. Giữ "Nhưng" của nhóm đó cho `tu`.
  · `saṁyojana` → "kiết sử": 41 khoá, so với "trói buộc" 14 khoá toàn tầng (0 khoá trong `tha-ap`).
  · `punabbhavo` → "tái sinh": 29 khoá so với "tái sanh" 9 khoá toàn tầng (riêng Pāli `natthi dāni punabbhavo.` nguyên văn: "tái sanh" 5 · "tái sinh" 2); chọn "tái sinh" theo đa số toàn tầng và `thag1.90`.
  · `duggati` → "Tôi không còn biết đến đọa xứ nào,": toàn `tha-ap` có "Ta không biết mình rơi vào khổ đau," 135 · "Tôi không còn biết đến đọa xứ nào," 82 · "Tôi không còn biết đến khổ xứ," 51 · "Ta không còn biết đến đọa xứ," 50; ở phạm vi gần (`tha-ap400`–`tha-ap470`) là 21 "Ta không còn biết đến đọa xứ," · 17 "Ta không biết mình rơi vào khổ đau,". Chọn dạng "Tôi … đọa xứ nào" để giữ cùng ngôi "tôi" của phần kể, không thêm "mình rơi vào" (Pāli không có).
