  · `devarajjamakārayiṁ` / `pathabyā rajjaṁ … mahiyā kārayiṁ` → "trị vì": `rajjaṁ kāreti` là thành ngữ *trị vì*; tầng có "làm ra vương quyền nơi chư thiên" 11 khoá và "trị vì" 4 khoá (`tha-ap337`, `tha-ap421`…). Chọn "trị vì" vì "làm ra vương quyền" là calque tối nghĩa (accuracy-neutral, clarity fix); biên tập có thể phán lại cho cả tầng.
  · `tādino` → "bậc Như Thật": 9 khoá "Như Thật" so với "Vững Vàng" 8 khoá trong `tha-ap`; chọn theo `tha-ap110:1.4` (cùng Pāli nguyên văn).
  · `labhāmi vipulaṁ sukhaṁ` → "đạt được sự an lạc rộng lớn", `buddhapūjāyidaṁ phalaṁ` → "đây là quả báo của việc cúng dường Đức Phật." (43 khoá; ba lần trong bài đều cùng một cách).
  · Dùng lại nguyên văn: đã dò 31 cặp Pāli của bài trùng với khoá đã dịch trong tầng (`kn`, không tính khối `:0`); **23/31** dùng lại y nguyên; **8 cặp khác có lý do**: `2.1` (không theo "bậc Đã Thấy Pháp", xem trên) · `3.1` (`ja380:7.1` "Có lẽ sức lớn của ta đã cạn kiệt" thuộc kệ khác và `vata` là *quả thật*, không phải *có lẽ*) · `5.4` (`atthadassissa` là sở hữu cách nên dịch "đối với", không phải "đến" như `tha-ap110:1.4`) · `7.3` ("hầu hạ tôi" thay vì "ta" theo ngôi phần kể) · `8.1` (`tha-ap434:5.1` "Sáu mươi ba nghìn" sai số, xem dưới) · `11.4` (xem "trị vì") · `12.1` (`tha-ap501:5.3` "Cả bảy món báu quý giá" sai: `Ekasattatikkhattuñca` là *bảy mươi mốt lần*) · `13.4` ("tái sinh", xem trên).

  Ghi chú ngoài lát (đo ở worktree, không sửa trong lát này): `tha-ap434:5.1` `Saṭṭhituriyasahassāni,` dịch "Sáu mươi ba nghìn" (đúng 60.000); `tha-ap501:5.3` `Ekasattatikkhattuñca,` dịch "Cả bảy món báu quý giá," (đúng "bảy mươi mốt lần") và `tha-ap501:6.1` `Catutiṁsatikkhattuñca,` dịch "Cả bốn mươi món báu quý giá," (đúng "ba mươi tư lần"); `tha-ap292:1.1` `Cullāsītisahassāni,` dịch "Tám mươi sáu nghìn" (đúng 84.000); `tha-ap116:6.1` `Saṭṭhitūriyasahassāni,` dịch "Hai trăm năm năm mươi sáu ngàn lần" và `tha-ap102:2.3` dịch "sáu mươi vạn ngàn năm" (đúng 60.000 nhạc cụ).

  🔴 Bất định đã ghi, **không** tự quyết:
  · `ekasataṁ` (`:12.3`) — dịch "một trăm lẻ một" theo cấu tạo eka + sata giống `Ekasattatikkhattuñca` (71) ngay trong bài; nhưng Sujato dịch `Khattiyānaṁ ekasataṁ` (`cp32:2.1`) là "A hundred" (và tầng cũng dịch "Một trăm vị Sát-đế-lợi"), nên cách đọc "một trăm" không loại trừ được. Biên tập nên phán lại.
  · `Soṇṇakiṅkaṇipupphāni` (`:4.3`, `:11.1`) — `soṇṇa` là *vàng*, nhưng "hoa bằng vàng" hay "hoa màu vàng" thì Pāli không nói; dịch "hoa kiṅkaṇi vàng" giữ trung tính. `kiṅkaṇi` không xác định được là loài nào, giữ nguyên.
  · `turiya` (`:8.1`) — `Saṭṭhituriyasahassāni` = 60.000 `turiya`; dịch "nhạc cụ" theo các nhạc khí liệt kê ở `8.2`–`8.4`; cách đọc "dàn nhạc/bộ nhạc" không loại trừ được (tầng dịch `pañcaṅgika turiya` là "dàn nhạc ngũ âm").
  · `bheriyo paṇavāni ca`, `ḍiṇḍimā`, `dundubhī` (`:8.2`–`:8.4`) — bốn loại trống/nhạc cụ; `paṇava`, `ḍiṇḍima`, `dundubhī` giữ tên Pāli vì không chắc cách gọi Việt (chỉ có "trống" chung), `bherī` giữ tên cho đồng bộ; `saṅkhā` dịch "tù và vỏ ốc"; `vaggū` dịch "êm tai".
  · `Tidhāpabhinnamātaṅgā` (`:9.3`) — `tidhā` = *ba cách/ba chỗ*, `pabhinna` = *chảy dịch* (voi trong thời kỳ động dục); dịch "chảy dịch ở ba nơi", không giải thích thêm vị trí. `mātaṅga` (`:9.3`) và `kuñjara` (`:9.4`) là hai tên gọi cho cùng đàn voi; dịch "voi" và "voi chúa", không tách thành hai loại.
  · `tapokammamapassito` (`:1.4`) — `apassita` = *nương tựa*; dịch "nương tựa vào khổ hạnh".
  · `taṁ` (`:3.2`) — `byādhinā paramena taṁ` có `taṁ` mà không nêu rõ trỏ gì (có thể là *sức lực ấy*); không dịch riêng, câu vẫn đủ nghĩa.
  · `Sovaṇṇakiṅkaṇiya` (`:0.3`, `:18.1`, `:19.1`) — tên giữ nguyên Pāli; nghĩa ghép *người (dâng) hoa kiṅkaṇi vàng* chỉ là suy luận từ thân kệ, không đưa vào thân kinh.
  · `thūpamuttamaṁ` (`:3.4`) — Pāli đóng câu bằng dấu chấm ở `3.4` nhưng động từ `karitvā` nằm ở `4.1`; dịch "…một bảo tháp thù thắng trên bãi cát. / Làm xong, …" để giữ đúng ranh giới khoá.
  · `so dāni` (`:13.1`) — `so` là *người ấy*, nhưng trong kệ ngôi nhất; dịch "Nay tôi".

