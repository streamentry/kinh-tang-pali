  🔴 Số Pāli — tự tính và in phép (mẫu số 9/9 khớp): `Saṭṭhituriyasahassāni` saṭṭhi 60 × sahassa 1.000 = **60.000** → "Sáu mươi ngàn nhạc cụ"; `Asītikoṭiyo` asīti 80 × koṭi 10.000.000 = **800.000.000** → "tám trăm triệu" (đúng quy ước tầng: `asīti vassakoṭiyo` → "tám trăm triệu năm" ở `thag1.96:1.2`, `tisso vassakoṭiyo` → "ba mươi triệu năm" ở `vv24:14.2`); `Cullāsītisahassāni` culla + asīti = **84** × 1.000 = **84.000** → "Tám mươi tư ngàn" (khớp Sujato `thig3.5:1.3` "Eighty-four thousand"); `saṭṭhihāyanā` = **60** tuổi; `Aṭṭhapaññāsakkhattuñca` aṭṭha 8 + paññāsa 50 = **58** lần (`tha-ap20:8.3` cũng "năm mươi tám lần"); `Ekasattatikkhattuñca` eka 1 + sattati 70 = **71** lần; `ekasataṁ` eka 1 + sata 100 = **101** → "một trăm lẻ một" (xem bất định); `Aṭṭhārase kappasate` 18 × 100 = **1.800** kiếp → "một ngàn tám trăm kiếp trước" (9 khoá tầng cùng cách); `Paṭisambhidā catasso` catu = **4** → "Bốn vô ngại giải"; `navamaṁ` = thứ **9**. Bất định số: có một (`ekasataṁ` 100 hay 101, xem dưới); bài không có `Tiṁsakappasahassa`.

