notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho vv, xem `blocking_errors`.
  BA MỆNH ĐỀ ĐANG TÁCH ĐÔI — đo cục bộ trong tầng `vv` (40 tệp, 1.177 segment): ngôi kể `tôi` 137 vs `ta` 23 ⇒ `tôi`; `mahānubhāva` `đại oai lực` 18 vs `uy thế lớn lao` 12 ⇒ `đại oai lực`; `sabbadisā` dạng `te` `muôn phương` 13 vs `mọi phương` 7 ⇒ `muôn phương` (3.3), dạng `me` `mọi phương` 18 vs `muôn phương` 10 ⇒ `mọi phương` (10.3).
  TIỀN LỆ: `Vimānavatthu` 39/40 giữ Pāli; `Itthivimāna` → `Chuyện Cung Điện Nữ Hư Không` 16 lần; `Mañjiṭṭhakavagga` → `Phẩm Mañjiṭṭhaka` 5 lần (vv39, vv40); mẫu `8. Chuyện Cung Điện …` và `…, thứ tám.` theo vv36; `Kena tetādiso vaṇṇo,` 10 lần, `Sā devatā attamanā,` 12 lần, `yassa kammassidaṁ phalaṁ.` 20 lần, `Tena metādiso vaṇṇo,` 20 lần, `“Ahaṁ manussesu manussabhūtā,` → `“Khi tôi còn làm người giữa loài người,` 4 lần, `pasannā sehi pāṇibhi` → `với tâm tịnh tín bằng chính đôi tay mình` 5 lần (rút gọn còn `với đôi bàn tay tịnh tín` cho đúng tiếng Việt, giữ `pasannā`).
  BẤT ĐỊNH 1 — NGÔI KỂ 1.1–1.4 và 8.1–8.4: cùng một bài kệ được lặp lại với đại từ đổi từ `te` sang `me`, nhưng `Pāsādettha mahallako` vẫn giữ ngôi hai trong CẢ HAI lần. Đã giữ đúng cách chia đại từ của Pāli: `1.1` → `Vườn xoài của ngài…`, `8.1` → `Nhờ vậy vườn xoài của tôi…`, và `1.2`/`8.2` đều là `ngài đã làm đẹp nơi ấy, này Mahallaka;`. CÁCH ĐỌC CẠNH TRANH: coi toàn bộ 1.x và 8.x là lời người kể tả chứ không phải lời nữ thiên; nếu đúng như vậy thì `me` ở 8.1 là của người kể và cả `mahallako` ở 8.2 phải hiểu theo nghĩa khác. Chưa có tầng tham khảo nào để phân xử.
  BẤT ĐỊNH 2 — `Mahallaka`: giữ nguyên tên, không dịch nghĩa. Bài đóng bằng `Ambavimānaṁ aṭṭhamaṁ` (nữ thiên Ambā), nên trong chính bài có hai tên cho cùng một nhân vật; không có bản Anh đã ghim và không có tiền lệ trong kho nên không thêm chú giải.
  BẤT ĐỊNH 3 — `Ambehi chādayitvāna, / katvā dussamaye phale` (6.3–6.4): dịch `tôi lợp mái bằng lá xoài, / làm nên bằng quả xoài khó chín.` 0 tiền lệ cho `dussamaye phale`; `samantā parivārito` (2.4) dịch `vây quanh khắp mọi bên` — chỉ bốn khoá này có nội dung đủ dài nên chốt kiểm không soi tới; đã đọc lại thủ công.
  SỐ KHOÁ TRÙNG PĀLI: 13/42 khoá trùng nguyên văn trong lát — nổi bật là cặp kệ `2.1–2.4` và `9.1–9.4`, và `1.3`/`8.3`; toàn lát dùng lại 61 cặp, 0 lệch.
