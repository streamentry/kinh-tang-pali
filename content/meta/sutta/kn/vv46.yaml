notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho vv, xem `blocking_errors`.
  BA MỆNH ĐỀ ĐANG TÁCH ĐÔI — đo cục bộ trong tầng `vv` (40 tệp, 1.177 segment): ngôi kể `tôi` 137 vs `ta` 23 ⇒ `tôi`; `mahānubhāva` `đại oai lực` 18 vs `uy thế lớn lao` 12 ⇒ `đại oai lực`; `sabbadisā` dạng `te` `muôn phương` 13 vs `mọi phương` 7 ⇒ `muôn phương` (3.3), dạng `me` `mọi phương` 18 vs `muôn phương` 10 ⇒ `mọi phương` (10.3).
  TIỀN LỆ: `Vimānavatthu` 39/40 giữ Pāli; `Itthivimāna` → `Chuyện Cung Điện Nữ Hư Không` 16 lần; `Mañjiṭṭhakavagga` → `Phẩm Mañjiṭṭhaka` 5 lần (vv39, vv40); mẫu `8. Chuyện Cung Điện …` và `…, thứ tám.` theo vv36; `Kena tetādiso vaṇṇo,` 10 lần, `Sā devatā attamanā,` 12 lần, `yassa kammassidaṁ phalaṁ.` 20 lần, `Tena metādiso vaṇṇo,` 20 lần, `“Ahaṁ manussesu manussabhūtā,` → `“Khi tôi còn làm người giữa loài người,` 4 lần, `pasannā sehi pāṇibhi` → `với tâm tịnh tín bằng chính đôi tay mình` 5 lần (rút gọn còn `với đôi bàn tay tịnh tín` cho đúng tiếng Việt, giữ `pasannā`).
  BẤT ĐỊNH 1 — NGÔI KỂ 1.1–1.4 và 8.1–8.4: cùng một bài kệ được lặp lại với đại từ đổi từ `te` sang `me`, nhưng `Pāsādettha mahallako` vẫn giữ ngôi hai trong CẢ HAI lần. Đã giữ đúng cách chia đại từ của Pāli: `1.1` → `Vườn xoài của ngài…`, `8.1` → `Nhờ vậy vườn xoài của tôi…`, và `1.2`/`8.2` đều là `ngài đã làm đẹp nơi ấy, này Mahallaka;`. CÁCH ĐỌC CẠNH TRANH: coi toàn bộ 1.x và 8.x là lời người kể tả chứ không phải lời nữ thiên; nếu đúng như vậy thì `me` ở 8.1 là của người kể và cả `mahallako` ở 8.2 phải hiểu theo nghĩa khác. Chưa có tầng tham khảo nào để phân xử.
  BẤT ĐỊNH 2 — `Mahallaka`: giữ nguyên tên, không dịch nghĩa. Bài đóng bằng `Ambavimānaṁ aṭṭhamaṁ` (nữ thiên Ambā), nên trong chính bài có hai tên cho cùng một nhân vật; không có bản Anh đã ghim và không có tiền lệ trong kho nên không thêm chú giải.
  BẤT ĐỊNH 3 — `Ambehi chādayitvāna, / katvā dussamaye phale` (6.3–6.4): dịch `tôi lợp mái bằng lá xoài, / làm nên bằng quả xoài khó chín.` 0 tiền lệ cho `dussamaye phale`; `samantā parivārito` (2.4) dịch `vây quanh khắp mọi bên` — chỉ bốn khoá này có nội dung đủ dài nên chốt kiểm không soi tới; đã đọc lại thủ công.
  SỐ KHOÁ TRÙNG PĀLI: 13/42 khoá trùng nguyên văn trong lát — nổi bật là cặp kệ `2.1–2.4` và `9.1–9.4`, và `1.3`/`8.3`; toàn lát dùng lại 61 cặp, 0 lệch.

  Kiểm toán độc lập 2026-10-11 (đọc đối kháng từng khoá với Pāli; lỗi nghĩa thật ở 21/42 khoá; điểm tự chấm 9.14 trước đó KHÔNG đúng, hạ xuống 8.92):
  (a) TÊN RIÊNG BỊA — `Ambavimāna` là "cung điện xoài" (amba), không phải tên nữ thiên Ambā: 0.4 `Chuyện Cung Điện Nữ Ambā` → `Chuyện Cung Điện Xoài`, 11.1 → `Cung Điện Xoài, thứ tám.`, `translationTitle` đổi khớp (theo mẫu `Cung Điện Mía`, `Cung Điện Tinh Xá`). `mahallako` ở 1.2/8.2 là tính từ của `pāsādo` ("to lớn"), không phải hô cách "này Mahallaka" và không có động từ "ngài đã làm đẹp nơi ấy": cả hai khoá sửa thành `ở đây có một tòa lâu đài to lớn;` (BẤT ĐỊNH 1 và 2 ở trên không còn đứng vững: ngôi `ngài` ở 1.2/8.2 không có căn cứ).
  (b) VẢI, KHÔNG PHẢI "KHÓ CHÍN" — `dussaphalehi rukkhehi` (2.3/9.3) và `dussamaye phale` (6.4) là cây/quả BẰNG VẢI (`dussa` = vải; đối chiếu `dussasanthataṁ` vv5:8.4 "phủ kín vải vóc"); bản trước dịch "ra quả khó chín" và "quả xoài khó chín", sai nghĩa. Sửa: 2.3/9.3 `bởi những cây có quả bằng vải,`, 6.4 `làm những quả bằng vải.`
  (c) HAI CẶP DÒNG BỊ ĐẢO — 2.3↔2.4 và 9.3↔9.4: bản trước đặt "vây quanh khắp mọi bên" (samantā parivārito) ở 2.3 và "bằng những cây…" ở 2.4, ngược Pāli. Đã trả đúng chỗ.
  (d) CHỮ VÔ NGHĨA / NGHE NHƯ MÁY DỊCH — 1.1 `thiên điên`; 1.3/8.3 `vây quanh muôn sắc màu` (Pāli `nānātūriyasaṅghuṭṭho` = vang tiếng nhiều loại nhạc cụ); 1.4/8.4 `rộn ràng tiếng ong tinh bị` (Pāli `accharāgaṇaghosito` = vang tiếng đoàn tiên nữ); 5.3 `tựa tự viện`; 6.1 `đại tựa tự`; 7.3 `nguyệt ấy` (taṁ). Sửa theo tiền lệ vv44:14.1–14.2 (`Vang rền muôn loại nhạc cụ, / âm vang tiếng đoàn tiên nữ`) và `tinh xá` (vv44).
  (e) NGƯỜI NÓI/NGƯỜI NGHE — 1.1 đổi `ngài` thành `nàng` (người hỏi nói với nữ thiên; đồng nhất với 3.1/3.3, 29 khoá dùng `nàng` so với 8 khoá dùng `ngài` trong ba dạng phổ biến nhất của `Kena tetādiso`).
  (f) `yassa kammassidaṁ phalaṁ` (4.3): `yassa` là quan hệ ("của nghiệp nào"), không phải `imassa`; bản trước `quả báo của nghiệp này là thế` biến câu hỏi được trả lời thành lời khẳng định. Sửa: `đây là quả của nghiệp nào.` CỐ Ý LỆCH TIỀN LỆ (68 khoá vv dùng `quả báo của nghiệp này là thế`); lỗi này lan ở cả bộ, không sửa ở tệp khác trong lượt này.
  (g) BỎ SÓT TỪ — 6.2 `kārente niṭṭhite mahe`: `mahe` (lễ hội) bị bỏ, dịch thành `đã được làm cho hoàn thành` (lặp lại 6.1). Sửa: `khi lễ hội đã được tổ chức xong;`. 6.3 `Ambehi chādayitvāna` là "phủ/che bằng xoài", không phải "lợp mái bằng lá xoài" (không có `lá`, không có `mái`): `tôi phủ kín bằng xoài,`. 7.4 `pasannā sehi pāṇibhi`: `pasannā` thuộc về người nói (nữ), không phải "đôi bàn tay tịnh tín": sửa theo tiền lệ 8 khoá `với tâm tịnh tín bằng chính đôi tay mình.` 7.1 bỏ `một` (Pāli không có), 7.2 `bhojayitvā gaṇuttamaṁ` → `rồi cho hội chúng tối thượng thọ thực;` (không phải `cung cấp`).
  (h) NHỎ — 2.2/9.2 `niccaṁ sovaṇṇayo mahā`: bản trước gắn `niccaṁ` vào "luôn là ngọn đèn" (sai quan hệ); nay `luôn luôn, bằng vàng, to lớn;` giữ `niccaṁ` ở dòng của nó, nối với `jalati` ở 2.1. 3.3 bỏ dấu chấm thừa sau `?”`. 8.1 `thật là dễ chịu` (rammaṁ) → `đáng yêu`; 10.3 `sắc tướng` → `dung sắc` cho khớp 3.3 và 10.1.
  BẤT ĐỊNH CÒN LẠI (sau kiểm toán): (1) 6.2 `kārente niṭṭhite mahe` — dạng `kārente` (định ngữ hiện tại, cách vị trí) không rõ chủ thể: giữ `khi lễ hội đã được tổ chức xong`, không dám thêm chủ thể; (2) 6.3–6.4 `ambehi chādayitvāna, katvā dussamaye phale` — "phủ kín bằng xoài, làm những quả bằng vải" bám sát từ, nhưng không rõ vật bị phủ là gì (tinh xá hay các cây xoài vây quanh) và quả vải ấy được treo ở đâu; không có tầng tham khảo để phân xử; (3) 2.4/9.4 `samantā parivārito`: chủ thể (cung điện `pāsādo` hay ngọn đèn `padīpo`, cả hai đều giống đực số ít) không xác định được từ Pāli: giữ vô chủ như nguyên văn; (4) 7.3 `taṁ` chỉ tinh xá (`vihāraṁ` 5.3) — đọc theo đại từ gần nhất, không phải lời Pāli nói thẳng; (5) mẫu số tiền lệ cho `dussaphala`/`dussamaya`: 0 nơi khác trong toàn Pāli root (hapax), đối chiếu `dussa` = vải chỉ qua `dussasanthataṁ` vv5:8.4.
  GHI NHẬN, KHÔNG SỬA RIÊNG: 0.2 `Itthivimāna` dịch `Nữ Hư Không` là sai (không có `ākāsa` trong Pāli), lặp ở ~51 tệp vv; giữ nguyên để không lệch cả bộ, cần sửa đồng loạt. 4.3 và công thức tương tự cần sửa đồng loạt toàn bộ vv (68 khoá).
  Tổng số khoá đổi 31/42 (21 khoá lỗi nghĩa thật; 10 khoá còn lại là sửa nhỏ hoặc khoá lặp theo cặp). Điểm đổi: semantic_fidelity 9.2→8.6, grammar_logic 9.0→8.8, terminology 9.2→8.6, vietnamese_clarity 9.2→8.8, ambiguity_integrity 8.8→8.4, các điểm còn lại giữ; final 9.14→8.92. `technical_integrity` giữ 9.6; bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy trong lượt này.
