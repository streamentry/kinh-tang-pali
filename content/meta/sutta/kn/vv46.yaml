notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho vv, xem `blocking_errors`.
  BA MỆNH ĐỀ ĐANG TÁCH ĐÔI — đo cục bộ trong tầng `vv` (40 tệp, 1.177 segment): ngôi kể `tôi` 137 vs `ta` 23 ⇒ `tôi`; `mahānubhāva` `đại oai lực` 18 vs `uy thế lớn lao` 12 ⇒ `đại oai lực`; `sabbadisā` dạng `te` `muôn phương` 13 vs `mọi phương` 7 ⇒ `muôn phương` (3.3), dạng `me` `mọi phương` 18 vs `muôn phương` 10 ⇒ `mọi phương` (10.3).
  TIỀN LỆ: `Vimānavatthu` 39/40 giữ Pāli; `Itthivimāna` → `Chuyện Cung Điện Nữ Hư Không` 16 lần; `Mañjiṭṭhakavagga` → `Phẩm Mañjiṭṭhaka` 5 lần (vv39, vv40); mẫu `8. Chuyện Cung Điện …` và `…, thứ tám.` theo vv36; `Kena tetādiso vaṇṇo,` 10 lần, `Sā devatā attamanā,` 12 lần, `yassa kammassidaṁ phalaṁ.` 20 lần, `Tena metādiso vaṇṇo,` 20 lần, `“Ahaṁ manussesu manussabhūtā,` → `“Khi tôi còn làm người giữa loài người,` 4 lần, `pasannā sehi pāṇibhi` → `với tâm tịnh tín bằng chính đôi tay mình` 5 lần (rút gọn còn `với đôi bàn tay tịnh tín` cho đúng tiếng Việt, giữ `pasannā`).
  BẤT ĐỊNH 1 — NGÔI KỂ 1.1–1.4 và 8.1–8.4: cùng một bài kệ được lặp lại với đại từ đổi từ `te` sang `me`, nhưng `Pāsādettha mahallako` vẫn giữ ngôi hai trong CẢ HAI lần. Đã giữ đúng cách chia đại từ của Pāli: `1.1` → `Vườn xoài của ngài…`, `8.1` → `Nhờ vậy vườn xoài của tôi…`, và `1.2`/`8.2` đều là `ngài đã làm đẹp nơi ấy, này Mahallaka;`. CÁCH ĐỌC CẠNH TRANH: coi toàn bộ 1.x và 8.x là lời người kể tả chứ không phải lời nữ thiên; nếu đúng như vậy thì `me` ở 8.1 là của người kể và cả `mahallako` ở 8.2 phải hiểu theo nghĩa khác. Chưa có tầng tham khảo nào để phân xử.
  BẤT ĐỊNH 2 — `Mahallaka`: giữ nguyên tên, không dịch nghĩa. Bài đóng bằng `Ambavimānaṁ aṭṭhamaṁ` (nữ thiên Ambā), nên trong chính bài có hai tên cho cùng một nhân vật; không có bản Anh đã ghim và không có tiền lệ trong kho nên không thêm chú giải.
  BẤT ĐỊNH 3 — `Ambehi chādayitvāna, / katvā dussamaye phale` (6.3–6.4): dịch `tôi lợp mái bằng lá xoài, / làm nên bằng quả xoài khó chín.` 0 tiền lệ cho `dussamaye phale`; `samantā parivārito` (2.4) dịch `vây quanh khắp mọi bên` — chỉ bốn khoá này có nội dung đủ dài nên chốt kiểm không soi tới; đã đọc lại thủ công.
  SỐ KHOÁ TRÙNG PĀLI: 13/42 khoá trùng nguyên văn trong lát — nổi bật là cặp kệ `2.1–2.4` và `9.1–9.4`, và `1.3`/`8.3`; toàn lát dùng lại 61 cặp, 0 lệch.

  LƯỢT KIỂM TOÁN VÀ CẢI THIỆN 2026-10-11 (đọc đối kháng từng khoá). Bản trước tự chấm 9.14 nhưng KHÔNG đạt: các đoạn mô tả cung điện và hành vi dâng cúng đều sai nghĩa thật, và các `BẤT ĐỊNH` cũ ở trên (1, 2, 3) dựa trên cách đọc sai nên không còn hiệu lực. Đã đổi 24/42 khoá.
  Lỗi nghĩa thật đã sửa (khoá, trước → sau, lý do): 1.1 `thiên điên` (vô nghĩa) → `Vườn xoài cõi trời của nàng thật khả ái` (`dibbaṁ`; `ngài` → `nàng` theo 28 vs 9 tiền lệ của `te` với nữ thiên); 1.2 và 8.2 `ngài đã làm đẹp nơi ấy, này Mahallaka` → `và ở đây có tòa lâu đài to lớn` (`pāsādo ettha mahallako`: `mahallaka` là tính từ `to lớn` của `pāsāda`, không phải tên riêng, không có động từ `làm đẹp`; `Mahallaka` bịa như một nhân vật); 1.3 và 8.3 `vây quanh muôn sắc màu` → `vang rền muôn loại nhạc cụ` (`nānātūriyasaṅghuṭṭho`; khớp vv44:14.1); 1.4 và 8.4 `rộn ràng tiếng ong tinh bị` → `âm vang tiếng đoàn tiên nữ` (`accharāgaṇaghosito`; khớp vv44:14.2 và `accharā` = `tiên nữ` ở 48 khoá); 2.3/2.4 và 9.3/9.4 đảo vế: `vây quanh khắp mọi bên` đặt ở khoá cây, `bằng những cây ra quả khó chín` đặt ở khoá `samantā parivārito` → trả đúng ranh khoá: `bởi những cây có quả bằng vải` / `bao quanh khắp mọi phía` (`dussa` = vải, vv5:8.4 `vải vóc`; `khó chín` là bịa); 5.3 `một tựa tự viện` (vô nghĩa) → `một tu viện dâng Tăng` (`tu viện` 124 vs `tịnh xá` 12 ở MN; `hội chúng` → `Tăng` cho `saṅgha` theo vv); 6.1 `đại tựa tự ấy` → `tu viện`; 6.2 `đã được làm cho hoàn thành` → `khi tôi đang cho tổ chức, lễ hội đã xong` (`kārente niṭṭhite mahe`: `mahe` là lễ hội, trước đây bị bỏ sót hoàn toàn); 6.3/6.4 `lợp mái bằng lá xoài, làm nên bằng quả xoài khó chín` → `cho phủ bằng cây xoài, và làm quả bằng vải` (`dussamaye phale` = quả làm bằng vải, trước đây thành quả xoài; nghĩa là tu viện được che bằng cây xoài và treo quả bằng vải, khớp `dussaphalehi rukkhehi` ở 2.3); 7.2 `rồi cung cấp hội chúng tối thượng` → `cho hội chúng tối thượng thọ thực` (`bhojayitvā`); 7.3 `trao nguyệt ấy` (vô nghĩa) → `dâng cúng nơi ấy cho Tăng` (`niyyādesiṁ`); 7.4 rút gọn → `với tâm tịnh tín bằng chính đôi tay mình` (khớp 17 khoá đa số; rút gọn cũ làm mất `sehi`); 8.1 `thật là dễ chịu` → `thật khả ái` (`rammaṁ` = `khả ái`, 2 tiền lệ); 2.1/9.1 thêm `Và` (`ca` trong `cettha`); 0.4 và 11.1 `Cung Điện Nữ Ambā` → `Cung Điện Xoài` (`amba` = xoài; `Ambā` không phải tên nữ thiên nào trong bài; `translationTitle` đổi theo).
  Phân loại 24 khoá: bịa hoặc vô nghĩa 10 (1.1, 1.2, 8.2, 1.4, 8.4, 5.3, 6.1, 7.3, 0.4, 11.1); dịch sai nghĩa từ vựng 8 (1.3, 8.3, 2.3, 9.3, 6.3, 6.4, 8.1, 7.2); đảo vế lệch ranh khoá 2 (2.4, 9.4); bỏ sót từ 3 (6.2, 2.1, 9.1); lệch tiền lệ 1 (7.4).
  Điểm đổi: `semantic_fidelity` 9.2 → 8.7, `grammar_logic` 9.0 → 8.8, `terminology` 9.2 → 8.7, `vietnamese_clarity` 9.2 → 9.0, `ambiguity_integrity` 8.8 → 8.6; các điểm khác giữ nguyên. Điểm hạ phản ánh lỗi nghiêm trọng của bản trước và các chỗ còn bất định; `final_score` 9.14 → 8.98.
  BẤT ĐỊNH CÒN LẠI: (a) `kārente niṭṭhite mahe` (6.2): đọc là định cách tuyệt đối `khi (tôi) đang cho tổ chức, lễ hội đã xong`; chủ ngữ của `kārente` không rõ, chưa có tầng tham khảo để phân xử. (b) `Ambehi chādayitvāna` (6.3): đọc `cho phủ bằng cây xoài`; không loại trừ nghĩa `bao phủ bằng xoài (quả)`. (c) `Itthivimāna` vẫn dịch `Nữ Hư Không` theo tiền lệ bộ vv (48 lần) dù Pāli không có `ākāsa` (tức `Cung Điện Nữ Nhân`): không sửa riêng một tệp, ghi để sửa cả bộ. (d) vv79:0.4 và vv79:13.1 cũng dịch `Ambavimāna` thành `Cung Điện Ambā`; cùng lỗi, ngoài phạm vi tệp này. (e) Ai nói 1.x: người hỏi, không phải nữ thiên; vì vậy `te` ở 1.1 và `me` ở 8.1 chỉ khác người nói, không còn mâu thuẫn như `BẤT ĐỊNH 1` cũ. `technical_integrity` vẫn 9.6 chưa chạy cổng: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  Lượt cải thiện 2026-10-11 (đọc đối kháng lại từng khoá sau lượt kiểm toán trên; đổi 7/42 khoá — 4.3, 3.3, 10.3, 2.2, 9.2, 1.1, 8.1 — gồm hai cặp trùng Pāli giữ nguyên văn). (1) 4.3 `yassa kammassidaṁ phalaṁ` `quả báo của nghiệp này là thế` → `về nghiệp mà đây là quả báo`: Pāli là mệnh đề quan hệ làm tân ngữ của câu hỏi được đáp (`yassa` = `của nghiệp nào`), bản cũ làm phẳng thành câu khẳng định và mất quan hệ; đo tiền lệ toàn tầng vv 32 vs 25 theo cách mới, và đây là họ lỗi đã biết của bộ vv (accuracy fix). (2) 2.2/9.2 `luôn là ngọn đèn vàng lớn` → `luôn luôn, ngọn đèn vàng lớn`: `niccaṁ` là trạng từ (đa số tiền lệ trong kn dịch `luôn luôn`/`luôn` đứng độc lập), bản cũ `luôn là` gán nó vào vị ngữ `là ngọn đèn vàng`, không có trong Pāli; dấu phẩy để từ ấy trôi giữa `jalati` và `sovaṇṇayo mahā` như ở Pāli (accuracy/clarity fix). (3) 10.3 `sắc tướng tôi … mọi phương”.` → `dung sắc tôi … muôn phương.”`: cùng một từ `vaṇṇo` và `sabbadisā` đã dịch `dung sắc` + `muôn phương` ở 3.1, 3.3 và 10.1, nên trong một bài phải thống nhất; đo tiền lệ khoá `Vaṇṇo ca me sabbadisā pabhāsatī`: `dung sắc` 48 vs `sắc tướng` 13, `muôn phương` 32 vs `mọi phương` 30 (hai dạng gần hoà, chọn theo thống nhất nội bài và dạng `te` 46 vs 19) (terminology fix). (4) 3.3 và 10.3 sửa vị trí dấu đóng nháy theo quy ước đa số cho Pāli kết `”ti.`: `.”` 124, `?”` 75, so với `”.` 52 và `?”.` 20 (style-only). (5) 1.1/8.1 bỏ `thật` trước `khả ái` (Pāli `rammaṁ` không có từ tăng nghĩa; ghi chú: `khả ái` 6, `đẹp` 15, `đáng yêu` 15 cho `ramma` toàn tầng, giữ `khả ái` vì ba khoá `Asokaṁ nandanaṁ rammaṁ` trong vv/pv và một khoá tha-ap đều dịch như vậy; con số 6 tính cả hai khoá của bài này) (accuracy fix nhỏ). Điểm đổi: `grammar_logic` 8.8 → 8.9 (mệnh đề quan hệ 4.3 và trạng từ 2.2/9.2); các điểm khác giữ nguyên vì các bất định thật (6.2, 6.3, 7.3, tiêu đề) vẫn còn, và `triangulation` vẫn 7.5 do không có bản Anh độc lập; `final_score` 8.98 → 8.99. Không phát hiện lỗi nghĩa mới nghiêm trọng; đã đo 8 nhóm Pāli trùng trong bài (1.3/8.3, 1.4/8.4, 1.2/8.2, 2.1/9.1, 2.2/9.2, 2.3/9.3, 2.4/9.4, ba khoá `…pe…`), 0 lệch; nháy `“”` khớp Pāli ở 42/42 khoá; `…` khớp Pāli; 0 Pāli lọt sang Việt (ngoài hai tên tiêu đề giữ Pāli).
  BẤT ĐỊNH CÒN LẠI sau lượt này (thêm vào mục (a)–(e) ở trên): (f) `taṁ` ở 7.3 (`Niyyādesiṁ taṁ saṅghassa`) có thể chỉ tu viện (5.3), ngọn đèn (7.1) hoặc cả việc cúng dường; bản dịch giữ `nơi ấy` theo cách đọc tu viện vì động từ `niyyādeti` thường đi với nơi ở dâng Tăng, chưa có tầng tham khảo để phân xử. (g) `niccaṁ` ở 2.2 có thể buộc vào `jalati` (luôn cháy) hoặc vào `sovaṇṇayo mahā`; bản dịch để trạng từ trôi giữa hai vế. Hai bất định này không đổi giáo nghĩa. Vẫn không nâng điểm `semantic_fidelity`, `ambiguity_integrity` và `terminology` vì (a)–(d) chưa được phân xử và tiêu đề `Itthivimāna` vẫn mang `Nữ Hư Không` theo tiền lệ bộ.
