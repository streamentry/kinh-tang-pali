  TIỀN LỆ TRÙNG NGUYÊN VĂN — ĐÃ DÒ. Đo toàn tầng (dn, mn, sn, an, kn), so Pāli bỏ dấu câu và hoa thường, bỏ khoá tiêu đề `0.x`: 20 khoá của bài có Pāli trùng nguyên văn với một khoá khác trong tầng. Dùng lại nguyên văn bản dịch có sẵn ở 14 khoá: `21.3`, `21.4`, `22.1`, `22.2`, `22.3`, `22.4` theo `dhp9`–`dhp10` và `ja221` (cùng kệ; riêng `21.1` chỉ đổi nháy kép thành nháy đơn theo Pāli), `23.4` và `24.4` theo cùng nguồn, `9.1` theo `ja493:12.3` và `ja256:1.5` (`bạc và vàng,`), `2.4` theo `ja401:1.6`, `3.6`, `5.6` (3/4 khoá, khoá thứ tư `ja348:1.4` đổi ngôi người nói nên khác), `32.1`–`32.3` theo `cp35:17.1`–`17.3` (chỉ đổi hoa thường ở chữ đầu của `32.3`). Cố ý khác tiền lệ ở 6 khoá, có lý do: `11.3` (cùng Pāli với `an4.26:2.1` và `iti108:3.1`; theo `an4.26` về từ vựng `gian trá, ngạo mạn, nhiều lời, mưu mô`, bỏ `Những kẻ` vì chủ ngữ đã nêu ở các khoá kề; `iti108` dịch `lừa dối, cứng cỏi, nói dai, ba hoa`, khác); `19.2` (`sn9.2:2.4` dịch `kẻ bị mũi tên đâm, thân tâm giày vò?` thành câu hỏi có chủ ngữ riêng, còn ở đây là một vế bổ nghĩa cho voi, nên chỉ lấy `bị mũi tên đâm, bị giày vò`); `24.1` (`an4.22:6.1` dịch `ca` thành `Nhưng`; ở đây theo cách `dhp10:1`, cũng mở bằng `Yo ca`, không dịch `ca` thành từ riêng); `29.3` (`sn8.12:4.3` là cách dativ `cho các tỳ-kheo và tỳ-kheo-ni`, ở đây là sở hữu cách nên `của các tỳ-kheo và tỳ-kheo-ni`); `31.3` và `31.4` (xem thuật ngữ `āraddhavīriya` và `daḷhaparakkama` bên dưới). Khoá `22.4` và `24.4` dùng lại `dhp10:4` (`kẻ ấy thật xứng y cà-sa.`) dù `24.4` nói người đức hạnh và chữ `kẻ` nghe hơi nặng; giữ vì bám tiền lệ đã publish và cùng Pāli. Số cặp trùng đã dò: 20 khoá trùng, trong đó 14 dùng lại nguyên văn, 6 cố ý khác.

