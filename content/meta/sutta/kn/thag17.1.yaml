  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `19.3` `Paṭisaṅkhā mahāghorā, nāgassāsi acintiyā`: tôi hiểu `paṭisaṅkhā` là sự suy xét (nơi voi) đã có (`āsi` = đã có), `mahāghorā` = vô cùng mãnh liệt, `acintiyā` = không thể nghĩ bàn; đối lập với `18.3`–`18.4` (các tỳ-kheo vị lai sẽ không có sự suy xét về y cà-sa). Sujato dịch `This awful lack of reflection was unthinkable to the elephant`, đảo thành chỗ thiếu sự suy xét; chữ `āsi` và `mahāghorā` bổ nghĩa cho `paṭisaṅkhā`, không thấy chỗ nào phủ định trong Pāli, nên tôi không theo Sujato. `mahāghora` ở tầng chỉ có dạng `ghora` (59 khoá: `kinh hoàng` 10, `dữ dội` 7, `khủng khiếp` 7); chọn `mãnh liệt` vì `khủng khiếp` sẽ gợi một nghĩa tiêu cực không có trong ngữ cảnh. Không có tiền lệ độc lập; nếu người biên tập hiểu khác, `19.3`–`19.4` sẽ phải sửa.
    · `1.3` `isi paṇḍarasagotto` và `3.2` `isipaṇḍarasavhaya`: `paṇḍarasa-gotta` là dòng họ Paṇḍarasa (Sujato: Paṇḍara), còn `isipaṇḍarasa-avhaya` có thể hiểu là vị ẩn sĩ có tên Paṇḍarasa. Bản Việt giữ chữ Pāli `Paṇḍarasa` cho cả hai, không giải thích. `1.4` `phussasavhayaṁ` = vị có tên Phussa.
    · `17.1` `Milakkhurajanaṁ rattaṁ`: `rajana` là thuốc nhuộm, `milakkhu` là tên (có thể là chất nhuộm hoặc tên một tộc người); Sujato dịch `vermilion`. Không có tiền lệ trong tầng; tôi giữ nguyên `milakkhu` như tên một loại thuốc nhuộm, không đoán màu.
    · `12.1` `telasaṇṭhehi kesehi`: tôi dịch mái tóc vuốt dầu; `saṇṭha` không có tiền lệ trong tầng (1 khoá chứa `saṇṭh-` liên quan dầu). `12.2` `añjanakkhikā`: mắt kẻ thuốc. `12.4` `dantavaṇṇika`: y màu ngà (Sujato `ivory color`); không tiền lệ.
    · `13.1` `Ajegucchaṁ vimuttehi`: `ajegucchaṁ` hiểu là không đáng ghê tởm, `vimuttehi` cách công cụ: bậc giải thoát. Sujato dịch `worn without disgust by the free`; bản Việt giữ vế `không hề ghê tởm` mà không thêm động từ `mặc`.
    · `8.4` `hirīmanā anatthikā`: tôi dịch biết hổ thẹn, không cầu cạnh (Sujato `conscientious and unbiased`); `anatthika` có thể hiểu là không cần gì, không tìm lợi; ngữ cảnh là những vị có đức mà yếu thế trong Tăng, nên `không cầu cạnh` hợp nhất, nhưng không có tiền lệ độc lập.
    · `7.2` và `8.2` `voharantā`: động từ chỉ sự điều hành, tranh biện trong Tăng (Sujato `running Saṅgha proceedings`); bản Việt dịch ngắn `nói năng` cho cả hai, không thêm `việc Tăng`.
    · `23.3` `nissukko`: không có tiền lệ trong tầng; dịch thiếu nhiệt tâm (Sujato `indolent`).
    · `9.2` `vatthu`: hiểu là đất (thổ cư), đi cặp `khetta` = ruộng, không nhầm với `vattha` (y phục) ở `21.2`.
    · `10.4` `magā`: hiểu là `miga` (thú rừng), dạng số nhiều chủ ngữ nối với `bālā` bằng ẩn dụ; bản Việt viết `những con thú ưa tranh cãi` mà không thêm `như`, giống Pāli không có `viya`.
    · `20.4` `gajo atthopasaṁhitā`: giữ `gajo` (con voi ấy) ở cuối khoá theo đúng thứ tự Pāli, tạo câu đảo `gắn liền với nghĩa lý, con voi ấy`.
    · Số kệ 32 trong bộ `Tiṁsanipāta` (ba mươi): xem phép 5; không sửa tên bộ.

