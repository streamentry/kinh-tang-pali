  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá). Lời nói: Pāli mở nháy kép ở `2.1`, đóng ở `2.4` (lời hỏi của vị ẩn sĩ dòng Paṇḍarasa); mở lại ở `3.1` và đóng ở `32.4` (lời đáp của Trưởng lão Phussa). Trong lời đáp có lời kể lại lời của voi Chaddanta, mở nháy đơn ở `21.1` và đóng ở `29.4`: bản Việt giữ đúng các nháy ở đúng khoá đó. Các kệ `4`–`19` mô tả các tỳ-kheo thời vị lai; kệ `19`–`20` kể chuyện voi Chaddanta bị tên bắn mà vẫn tôn trọng y cà-sa; kệ `21`–`24` là kệ của voi (cùng Pāli với Pháp Cú 9–10 và Kāsāvajātaka); kệ `25`–`29` trở lại tả các tỳ-kheo vị lai; kệ `30`–`32` là lời khuyên của Phussa. Dòng bìa `32.5` theo khuôn `… Trưởng lão X ….`.

