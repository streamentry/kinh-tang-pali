notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Yasa trong phẩm Dvādasamavagga.

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1): 10 bản trên đĩa mở rộng,
  5 bản giữ lược. Xem `thag1.112.yaml`. Cả hai đều giữ 2 dấu lược như Pāli.

  **Thứ tự khoá tiêu đề: theo PĀLI** (`0.3` = phẩm, `0.4` = tên bài kệ); 12 bản thag đã publish đặt
  ngược, tôi không sửa chúng.

  **Không đối chiếu được tầng Việt hiện hành** (bilara chỉ có Pháp Cú). Sujato có 8/9 khoá, trống
  đúng dòng kết lược; mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments = 0`, `ratio = 1`.

  **Công thức dùng chung với `thag1.112`** (bắt buộc theo BRIEF_VI3 §6): `kataṁ buddhassa sāsanan`”
  ti` dịch giống hệt — *đã làm tròn lời dạy của Đức Phật*.

  **Thuật ngữ, đếm được.** `Suvilitto` → *xức dầu* (`vilitta` = xức dầu, xức; sn42.13:6.7 dùng cùng
  `sunhāto suvilitto` cho người xức dầu). `sabbābharaṇa` → *món trang sức* (Sujato *all my
  jewelry*). `Tisso vijjā` → *ba thắng trí* (mn86:18.65 dịch đúng `Tisso vijjā anuppattā` là *Ba
  thắng trí ta đã đạt được*; sn52.24:2.4 dịch *ba chứng ngộ*; sn8.12:5.3 dịch *tam minh* — tôi theo
  vế khớp **nguyên văn dài hơn** ở mn86). `ajjhagamiṁ` → *chứng ngộ* (Sujato *I have attained*).

  **Bất định đã ghi — chỗ tôi phải chọn và ghi rõ.** `Suvilitto suvasano`: `suvilitto` chắc chắn là
  *được xức dầu*, nhưng `su-vāsano` thì **không**. `vasana` xuất hiện 25 lần trong tầng Pāli và ở
  hầu hết chỗ đều là *có mùi thơm* (tha-ap135:1.4 *pupphānivasano*, pv26:5.1 *suvatthavasano*); Sujato
  lại đọc là *well-dressed*. Vế sau `sabbābharaṇabhūsito` (*đeo đầy đủ mọi món trang sức*) củng cố
  cách đọc *mặc áo chỉn chu* của Sujato, nên tôi theo Sujato. Tôi ghi lại vì nếu đọc theo nghĩa đen
  *có mùi thơm* thì câu sẽ thành *được xức dầu, được xức hương, đeo đầy đủ món trang sức* — cũng hợp
  lý, nhưng là cách khác. 0 tiền lệ trong tầng cho cụm này.

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2); ngoặc kép cân; không chữ ngoài
  Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này cấm) →
  `technical_integrity` = **9.6**.

  **Danh xưng giữ nguyên dạng Pāli** (Yasa).
