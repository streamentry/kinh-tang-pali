notes: |-
  Dịch trực tiếp từ Pāli root, đủ 188/188 khoá, thứ tự khoá như Pāli; commit đã ghim không có bản Anh cho toàn bộ `thi-ap`. Dùng thi-ap12/13/14/15 (cùng Phẩm Ekūposathika), thi-ap22/23/26 (cùng đoạn bảy công chúa con vua Kikī và đoạn Sāvatthī), thi-ap10 (đoạn tóm tắt phẩm), và tha-ap/thig/thag làm tiền lệ. Đây là bài cuối phẩm Ekūposathika (thứ mười của phẩm) nên có thêm khoá kết phẩm và kệ tóm tắt phẩm (:47.1, :48.1, :49–:50).
  Đại từ ngôi thứ nhất dùng con, khớp thi-ap12/13/14/15 (cùng phẩm): đo thi-ap11 tôi 27/con 0, thi-ap12 con 12/tôi 1, thi-ap13 con 10/tôi 2, thi-ap14 con 44/tôi 1, thi-ap15 con 38/tôi 1, thi-ap16 tôi 9/ta 7 — tức con ở 4/6 tệp của phẩm; các nhóm thi-ap22/23/24/26 (phẩm khác) dùng ta. Đây là chọn theo phạm vi gần nhất, không phải đa số toàn nhóm; người biên tập nên phán một lượt cho cả phẩm. Vì vậy `mayaṁ`/`no` (16.1–16.2, 16.4) dịch chúng con thay cho chúng ta ở thi-ap22/23 (0 tiền lệ chúng con trong phẩm). Khi Đức Phật nói với Paṭācārā (8.4, 33.4) dùng ngươi theo thi-ap23:10.4 và thi-ap34:10.6 (lacchase → ngươi sẽ đạt được; tha-ap539/543/544/547 cùng dạng).
  `:0.3` Pāli là `Paṭācārātherīapadāna` không bắt đầu bằng số nên không giữ số thứ tự; translationTitle bằng đúng `:0.3` và `:46.1` kết bằng `thứ mười` (dasamaṁ = thứ mười, nhất quán với vị trí thứ mười của phẩm 11–20). Hình thức `Tuyên Ngợ`: nhóm thi-ap đo 28 `Tuyên Ngợ` / 1 `Tuyên Ngôn` / 1 khác; nhóm tha-ap đo 255 `Tuyên Ngợ` / 138 `Tuyên Ngôn` / 146 `Ký Sự` / 5 `Kinh Kệ` / 2 khác. Cả hai phạm vi cùng nghiêng về `Tuyên Ngợ` nên giữ nhất quán với phạm vi gần nhất; chữ này có dấu hiệu là lỗi chính tả của tầng, người biên tập nên phán một lượt cho cả cuốn.
  `Ekūposathikavagga` → Phẩm Ekūposathika (6 tệp tiền lệ, 0 cách khác); `:47.1` Ekūposathikavaggo dutiyo → Phẩm Ekūposathika là phẩm thứ hai, theo thi-ap10 (Phẩm Sumedhā là phẩm thứ nhất). `Tassuddānaṁ` → Tóm tắt phẩm này: (toàn tầng 44 so với 10 `Tóm lược:` và 2 `Tóm lược phẩm ấy:`; thi-ap10 cùng dạng kệ tóm tắt dùng `Tóm tắt phẩm này:`). Tên người trong kệ tóm tắt giữ Pāli, không dịch nghĩa, vì thi-ap11–16 và thi-ap22/23 giữ Pāli các tên này.
  Công thức lời kết `Itthaṁ sudaṁ … abhāsitthāti` dịch nhóm `đã nói những bài kệ này` (số nhiều, khớp `imā gāthāyo`), theo thi-ap10–16 và nhóm 407 khoá của tầng.
  Dùng lại nguyên văn tiền lệ: đã dò 90 khoá Pāli có nội dung trùng với tầng thi-ap/tha-ap/thig/thag (bỏ `:0.1`–`:0.3`); 89 khoá dùng lại nguyên văn (chỉ khác đại từ ta/tôi → con và dấu câu), 1 khoá khác (6.1 thêm `vật thực` theo `bhojayitvāna` thay cho `cúng dường` trần của tiền lệ). Gồm 1.1 (`Đức Chiến Thắng tên Padumuttara` 36 chỗ), 12.1–12.4 và 20.1–20.4 (`Nhờ nghiệp lành khéo làm ấy` 55 chỗ, `cùng với tâm nguyện và chí hướng` 63 chỗ), 13.1–13.4 (cụm Kassapa/Kikī, thi-ap1, thi-ap22, thi-ap23), 14.1–14.4, 17.1–18.4 (cụm bảy công chúa, thi-ap22/23), 19.4 (`Visākhā là người thứ bảy`), 21.1/21.4, 35.4, 36.1–36.4, 37.1–37.4, 39.1, 40.3–40.4 (`gánh nặng đã được đặt xuống` 7 chỗ, `sợi dây dẫn đến hữu đã được nhổ bỏ` 10 chỗ), 41.1–41.4, 42.1 (139 chỗ `Các phiền não của … đã được thiêu rụi`), 43.1 (134 chỗ `Thật lành thay sự đến của …`), 44.1 (`Bốn vô ngại giải` 560 chỗ).
  Cặp Pāli trùng trong chính bài: 10 cặp ở 6 nhóm (5.4 = 11.4; 12.2 = 20.2; 12.3 = 20.3; 12.4 = 20.4; 40.2 = 43.3 = 44.3; 42.2 = 43.2 = 44.2); 4 cặp có Việt khác nhau, tất cả chỉ ở dấu câu: 40.2/43.3/44.3 theo đúng dấu từng khoá của Pāli (`;`, `.`, `”.`), và 5.4/11.4 vì 5.4 dịch kết `,` do mệnh đề còn tiếp sang 6.1 trong khi Pāli ghi `.`.
  Số Pāli: `Ito satasahassamhi kappe` (1.3) và `Satasahassito kappe` (9.1) = sata 100 × sahassa 1000 = một trăm ngàn kiếp; 9.1 là lời thọ ký tương lai nên dịch `Sau một trăm ngàn kiếp nữa` theo nhóm 11 khoá cùng dạng của tầng (so với 33 `Vào một trăm ngàn đại kiếp trước` và 12 `Vào một trăm ngàn kiếp trước đây` ở các bài kể quá khứ); `sattāhaṁ` (6.1) = satta 7 + aha → bảy ngày; `aṭṭhamake` (7.2) = thứ tám; `Vīsavassasahassāni` (16.3) = vīsa 20 × sahassa 1000 = hai mươi ngàn năm (thi-ap22:14.3 và thi-ap23:18.3 cùng dạng); `tatiyā dhītā` (15.1) = con gái thứ ba, khớp thứ tự Samaṇī 1, Samaṇaguttā 2, Bhikkhunī 3 trong 18.1–18.2; `satta dhītaro` (17.4) = bảy, và 18.1–18.4 liệt kê đúng 7 tên (Samaṇī, Samaṇaguttā, Bhikkhunī, Bhikkhudāyikā, Dhammā, Sudhammā, Saṅghadāyikā); 19.1–19.4 liệt kê đúng 7 người (con, Uppalavaṇṇā, Khemā, Bhaddā, Kisāgotamī, Dhammadinnā, Visākhā) với `sattamī` = người thứ bảy; `ekaputta` (23.1) = một con trai, `dutiyo` (23.2) = đứa thứ hai, `ubho puttā` (31.1) = cả hai đứa con; `Tāvatiṁsa` = Ba mươi ba (tên cõi trời, không phải số đếm độc lập, tiền lệ 33 chỗ); `catasso` = bốn; `satāni pañca` (50.3) = 5 × 100 = 500, `nava` (50.4) = 9, tổng 509 bài kệ. Cụm `tiṁsa` đứng riêng và cụm `Tiṁsakappasahassa` không có trong bài này.
  Từ vựng: `jino` → Đấng/Bậc Chiến Thắng (tầng); `mahāvīra` → Đại Anh Hùng (12 chỗ); `dasabala` → bậc Mười Lực (tha-ap548); `lokanāyaka` → bậc Dẫn Đạo thế gian; `vinayadhārī` → vị trì luật (0 tiền lệ trong thi-ap/tha-ap; mil7.8 dịch `giữ giới luật`; chọn trì luật cho gọn, giữ nhất quán giữa 4.1 và 39.3); `lajjinī` → biết hổ thẹn (thi-ap35:15.1); `tādī` → bất động như vậy (ud, iti 7 chỗ); `kappākappa` → điều thích hợp và điều không thích hợp (kappiya → thích hợp ở kp7, pv5, bv22: 3 chỗ, so với 1 chỗ hợp pháp ở tha-ap49); `samappita` → bao trùm (2.4, 29.4, 30.4 cùng một cách, nhất quán nội bộ; cp12 dịch chìm trong); `pūritaṁ` → đang dâng đầy; `narasārathi`, `narasārathi` → bậc Điều Ngự Trượng Phu (5 chỗ); `sabbadassī` → bậc Thấy Tất Cả (tha-ap460 Đấng Thấy Khắp); `paṭhamaṁ phalaṁ` → quả đầu tiên (không thêm Dự lưu vì Pāli không nêu); `ekacitamhi ḍayhare` → đang bị thiêu trên một giàn hỏa (tha-ap399:1.4 nguyên văn); `ukkuso` → chim ó cá (0 tiền lệ; tha-ap268:1.2 `ukkuso` dịch kẻ lặn nước thuộc ngữ cảnh khác); `Antakenādhipannassa` → khi bị Tử vương nắm lấy theo dhp288:3 (xem dưới), trong khi ja498:14.3 dịch thần chết chi phối.
  Song song Dhammapada: 34.1–34.4 là kệ gần như trùng Dhp 288 (Chuyện nàng Paṭācārā, dhp288:1–4); tầng Anh đã ghim có bản Sujato cho dhp288:1–4 (`Children provide you no shelter`…). Dịch theo bản Việt dhp288: `Con cái không che chở được`, `khi bị Tử vương nắm lấy`, `không có nơi nương tựa nơi thân quyến`; khác ở 34.2: Pāli của bài này là `na ñātī napi bandhavā` (bà con, quyến thuộc), còn dhp288:2 là `na pitā nāpi bandhavā` (cha), nên 34.2 dịch `thân quyến cũng không, bà con cũng không` chứ không chép `cha cũng không`. Đây là bằng chứng độc lập duy nhất về cách hiểu của một đoạn kệ (4/188 khoá), không phải đối chiếu cả bài.
  Ghi nhận bất định: 7.2 `ito aṭṭhamake` — Pāli không có danh từ; dịch `từ nay là ngày thứ tám`, hiểu là ngày, vì 6.1 vừa nêu bảy ngày cúng dường; tha-ap10:9.1 và tha-ap84:5.1 có cùng cụm nhưng với `kappe` (kiếp) nên không chuyển sang đây được; hướng đếm (tám ngày trước hay sau) Pāli không nói. 23.3–23.4 `mātāpitaro okkhāmīti sunicchitā` — động từ `okkhāmi` 0 tiền lệ trong tầng và không xác lập chắc từ hình thái; dịch `sẽ đến chỗ cha mẹ` theo ngữ cảnh (24.4 `gantuṁ sāvatthimuttamaṁ`, 27.4 `gacchantī sakulālayaṁ`), không thêm sắc thái; Pāli không có dấu nháy ở khoá này nên bản Việt không đặt nháy. 25.2 `sambhāvesi pathe mamaṁ` — 0 tiền lệ; dịch trung tính `đã gặp con giữa đường`, không nói đuổi kịp hay tìm thấy. 25.3 `kammajā vātā` — nghĩa đen cơn gió do nghiệp sinh; không diễn nghĩa là cơn đau sinh nở trong thân kinh (26.2 `pasūtisamaye` ngay sau đó đã nêu thời điểm sinh nở); 0 tiền lệ. 22.2 `vitakkavasagā` — dịch `bị các tư tưởng chi phối`, không nói tư tưởng gì vì Pāli không nêu. 22.3 `jārapatiṁ` — 0 tiền lệ; hợp từ jāra (người tình, tình nhân) + pati (chồng); dịch `người tình làm chồng`, không nói ngoại tình hay không. 26.3 `dabbatthāya` — dịch `đi tìm cỏ` (dabba = cỏ; 0 tiền lệ); nghĩa khác có thể có là vật liệu làm chỗ trú, Pāli không nói mục đích. 27.3 `kunnadiṁ` — dịch con sông nhỏ (ku- + nadī), 0 tiền lệ. 28.1–28.4 — Pāli chỉ nêu `ekakaṁ` (một mình) mà không nêu động từ; hiểu đứa bé nằm một mình ở bờ bên kia theo 28.3 `sāyetvā`, rồi `itaraṁ taraṇāyahaṁ` là mục đích lội sông vì đứa còn lại; việc người mẹ quay lại do 29.1 `nivattā` nêu. 29.1 `ukkuso hāsi` — `hāsi` dịch mang đi. 31.3 `bhātā` — số ít nên dịch `người anh em`, Pāli không nói anh hay em. 33.3 `Attānaṁ te gavesassu` — dịch `hãy tìm kiếm chính mình`, 0 tiền lệ, không thêm tân ngữ như nơi nương tựa. 35.2 `paṭhamaṁ phalamajjhagaṁ` — 0 tiền lệ; dịch quả đầu tiên. 38.4 `byāhariñca yathātathaṁ` — dịch `đã nói ra đúng như thật`, không nói đọc lại hay giảng. 4.3 `tādiṁ` — chọn bất động như vậy theo ud/iti; đây là chỗ một nữ tỳ-kheo được gọi tādī, có thể có cách hiểu nhẹ hơn (bậc như vậy, bậc như thế), người biên tập có thể muốn đổi theo tầng.
  Dấu câu: nháy kép `“”` mở ở 1.1 và đóng ở 44.3; nháy đơn `‘’` mở ở 7.1/đóng ở 7.4, mở ở 8.2/đóng ở 10.4, mở ở 31.1/đóng ở 31.4, mở ở 33.2/đóng ở 34.4, mở ở 39.3/đóng ở 39.4, đúng như Pāli, khớp từng khoá (không khoá nào tự cân). `…pe…` ở 42.2, 43.2, 44.2 → đúng một `…`; Pāli không có `(…)` trần ở khoá nào nên bản Việt cũng không có. Pāli không có `…` trần ở khoá nào khác.
  Phép kiểm tự làm trước khi ghi: tập khoá Việt = tập khoá Pāli (188/188, cùng thứ tự); 0 khoá lệch nháy đơn/kép trên 188 khoá (12 khoá có dấu nháy); 0 khoá lệch `…`; NFC, 0 khoá rỗng, 0 khoảng trắng thừa; Pāli lọt sang Việt chỉ ở tên riêng (Paṭācārā, Haṁsavatī, Bārāṇasī, Samaṇī, Samaṇaguttā, Uppalavaṇṇā, Saḷalā, Naḷamālī). Đã in cặp Pāli↔Việt cả 188 khoá để đọc đối kháng; đã sửa các lỗi bản nháp đầu: 4.1/4.2 chia dòng lệch Pāli (nāyako ở 4.2, không phải 4.1), 25.3/25.4 chuyển `uppannā` đúng khoá, 38.1 bỏ động từ `đã học` vì `uggahiṁ` nằm ở 38.3, bỏ `học thuộc` và `nói lại` vì Pāli không nói thuộc lòng hay đọc lại, 31.3 số ít.
