  BẤT ĐỊNH đã ghi, không giấu:
  1. `carimo vattate bhavo` — 2/2 tiền lệ dịch *này là đời cuối cùng của Ngài*, nhưng vế trước
     là `Idaṁ pacchimakaṁ mayhaṁ` = *của ta*, và người kệ đang nói về chính mình. Tôi giữ *của ta*
     để không tự mâu thuẫn trong một câu kệ. Đây là chỗ lệch tiền lệ có chủ ý, xin người điều
     phối biết.
  2. `tāvatiṁsamagacchahaṁ` — 12 tiền lệ dịch *cõi trời Ba mươi ba*, nhưng đó là ngữ cảnh
     `tāvatiṁsa`. Ở đây `tāvatim` = *mức ấy*, đi kèm `Tattha cittaṁ pasādetvā`, nên dịch *chứng
     đạt được mức ấy*. Không dùng lại tiền lệ sai ngữ cảnh.
  3. `Sandhāvitvā bhave ahaṁ` — `bhave` là thì tương lai, giữ *ta sẽ đổi được thân này*.

  DẤU LƯỢC: Pāli có `…pe…` ở `:10.2`, `:11.2`, `:12.2`; bản Việt giữ **đúng một** `…` mỗi khoá,
  không mở rộng. Không còn khoá nào để trống — 50/50 khoá đã dịch.

