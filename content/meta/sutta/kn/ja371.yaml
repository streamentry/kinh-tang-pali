  Kiểm toán Jātaka chỉ có Pāli 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): đọc lại đủ khoá; sửa 3.1–3.4 (bản cũ đọc thành "không có hành vi thiện nào khác có thể che chở … cũng như của cải chẳng cứu giúp", mâu thuẫn ý kệ; theo Pāli `nāññaṁ sucaritaṁ … nāññaṁ subhāsitaṁ tāyate`: ngoài hạnh lành và lời nói tốt, không gì che chở lúc lâm chung, của cải khác cũng vậy; khớp Chalmers), 6.3 (`averena` = không oán hận, bỏ "tình thương"). Bất định: `evamevitaraṁ dhanaṁ` (3.4) cú pháp ngắn gọn. Điểm giữ nguyên.

