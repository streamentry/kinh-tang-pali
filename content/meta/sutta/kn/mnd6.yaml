  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `Cullāsītisahassāni` = cullāsīti 84 × sahassa 1.000 = 84.000 → *tám mươi tư ngàn* (`5.1`, như `tha-ap113:3.1`, `tha-ap489:3.1`; `thig3.5:1.3` viết *tám mươi bốn ngàn*), 84.000 *kiếp* của chư thiên `marū`. `vassasata` 100 → *trăm năm* (`2.2`, `17.10`, `21.38`, `22.2`, `30.2`). Dãy tuổi `21.9`–`21.37`: `addhamāsika` nửa tháng, `māsika` 1, `dve`…`dasa` 2–10 tháng (`21.11`–`21.19`, 9 khoá, từng khoá khớp), `saṁvaccharika` 1 tuổi, `dvevassika`…`dasavassika` 2–10 tuổi (`21.21`–`21.29`), `vīsati` 20, `tiṁsa` 30, `cattārīsa` 40, `paññāsa` 50, `saṭṭhi` 60, `sattati` 70, `asīti` 80, `navuti` 90 (`21.30`–`21.37`): 29/29 khoá khớp từng khoá. Dãy `22.2`–`22.9`: eka 1, dve 2, tīṇi 3, cattāri 4, pañca 5, dasa 10, vīsati 20, tiṁsa 30, cattārīsa 40 → *sống thêm* một … bốn mươi năm (9/9). `dvādasāyatanāni` 12 (`74.2`), sáu cặp căn–cảnh (`74.3`, 6/6); `pañca macchariyāni` 5 (`63.5`, `76.4`; 5/5); `tisso sāmaggiyo` 3 (`70.2`; 3/3); `tīṇi moneyyāni` 3 (`64.8`; 3/3); `satta sekkhā` 7; `dvīhi kāraṇehi` 2 (`3.3`; 2/2); `dvīhi cittehi` 2 (`5.4`). Nhóm 37 pháp ở `70.8`: 4 + 4 + 4 + 5 + 5 + 7 + 8, đủ 7/7 nhóm. Danh sách: 7 mục `Assāsūpanibaddhaṁ … viññāṇūpanibaddhaṁ` (`14.2`, 7/7); 8 mục `appakaṁ … naciraṭṭhitikaṁ` (`17.1`, `17.7`, 8/8); 8 mục `dubbala` (`14.3`, 8/8); 5 loại `byasana` (`63.2`, `63.4`, `76.3`, 5/5); 10 quan hệ thân thuộc (`52.3`, `75.5`, 10/10); 8 vật ngồi (`69.2`, 8/8); 13 cảnh trong mộng (`51.4`, 13/13); 17 phiền não (`86.8`–`86.24`, 17/17); 10 cặp chánh–tà (`87.1`–`87.10`, 10/10); sáu cửa (`68.x`, 6/6). Không có `navuti`/`tālīsa` làm số nhân, `koṭi`, `Tiṁsakappasahassa`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
    1. `15.2` `Gandhabbā ca ime hi sabbaso`: giữ nguyên *gandhabba* (không dịch thành thiên nhạc thần hay chúng sinh trung ấm); nghĩa trong kệ chưa phân xử được, 0 tiền lệ. Cả kệ `15.1`–`15.6` là kệ trích, chủ ngữ của `hāyati`, `pabhāvikā` dịch theo lời giải `14.3`–`14.6`.
    2. `3.4`, `14.1`, `16.1` `sarasaparittatā`: *theo bản chất* là cách đọc `sarasa` = tính chất của chính nó; có thể là *vị*, *chức năng*. Cần người biên tập xem lại.
    3. `7.x`, `10.x`, `11.x`: kệ trích không nêu chủ ngữ (`ye bhaggā`, `anidhānagatā`, `nibbattā ye`); dịch là *những cái*, *các pháp đã phát sinh* như Pāli, không gán *các uẩn* ở những dòng không có chữ ấy. `9.1` `yathā ninnā pavattanti`: *những gì xuôi xuống chỗ thấp*, không thêm *nước*.
    4. `21.2`–`21.6` `kalala`, `abbuda`, `pesi`, `ghana`, `pasākha`: giữ nguyên tên năm giai đoạn thai, 0 tiền lệ (đại ý các giai đoạn phôi từ sơ khởi đến thành hình chi thể); giải thích thuộc glossary.
    5. `21.9`–`21.37` `-māsika`, `-vassika`: dịch *người … tháng tuổi / … tuổi*; Pāli chỉ nêu tính từ chỉ tuổi, chủ thể là kẻ vừa nêu.
    6. `22.2`–`22.9` `jīvati`: dịch *sống thêm* vì chủ thể là người đã sống quá trăm năm (`atikkamitvā`); Pāli không có chữ *thêm*. Nếu chủ thể không như vậy thì câu thành vô nghĩa nên cách đọc này gần như chắc chắn, nhưng vẫn ghi.
    7. `57.2`–`57.3` `cakkhuviññāṇābhisambhūtā`, `sotaviññāṇābhisambhūtā`: *đã được nhãn thức / nhĩ thức đạt đến*; `abhisambhūta` có thể là *sinh ra từ* hoặc *nằm trong tầm của*. 0 tiền lệ.
    8. `70.18` `paṭicchanne niraye`: *trong địa ngục đã bị che kín như vậy*; `channa` có thể là *phù hợp* hoặc *bị che*; dịch `etaṁ channaṁ etaṁ patirūpaṁ etaṁ anucchavikaṁ etaṁ anulomaṁ` thành bốn tính từ *thích hợp, xứng hợp, phù hợp, thuận theo* (0 tiền lệ), và coi `paṭicchanne` thuộc `niraye` như Pāli.
    9. `44.7` `bhagavā taṁ puggalaṁ pariggaṇhāti`: *nắm giữ* theo gốc `pariggaha`; có thể là *chấp nhận / nhận lấy làm của mình*.
    10. `64.17` `accutadassino`: *thấy cái bất hoại*, 0 tiền lệ; `69.2` `bhisi taṭṭikā cammakhaṇḍa …`: *nệm, chiếu, tấm da …* 0 tiền lệ; `42.5` `payogamaññanā` → *tưởng nghĩ do nỗ lực*, 0 tiền lệ.
    11. `41.3` `sattuka` → *kẻ thù* dùng lại `ja351:3.3` (chưa kiểm được người được gọi).
    12. `34.11` `Purimānaṁ purimānaṁ … pacchimā pacchimā`: dịch *hết cái này đến cái khác* cho dạng lặp; `10.2` `puñjo` → *khối tích tụ*.
    13. Từ Pāli giữ nguyên chủ ý: `kalala, abbuda, pesi, ghana, pasākha` (`21.2`–`21.6`), `gandhabba` (`15.2`), `jāgu`, `indagu` (`59.8`, như `mnd1:15.3`), `Sineru` (`51.4`), `Vāri`, `Pokkhara` (`77.3`, `81.3`, `81.8`: lời giải đồng nghĩa mà tiếng Việt không có hai từ khác nhau cho *nước* / *lá sen*).
    14. Lỗi ngoài lát, báo chứ không sửa: `snp4.6:3.1`–`3.2` đảo hai dòng và `snp4.6:3.4` dịch `māmako` là *kẻ có lòng tham ái* (đối chiếu `an4.26`, `iti108`, `mnd6:44.6`–`44.9`); `snp4.6:7.4` `bhavane` → *trong gia đình* trái lời giải `mnd6:70.16`; `snp4.6:2.2` *tài sản*, `snp4.6:9.4`, `10.2` *nhận thức* so với `mn22`, `dn16`; ba khoá Pāli y hệt `Kuhā thaddhā lapā siṅgī unnaḷā asamāhitā` dịch ba cách khác nhau (`iti108:3.1`, `an4.26:2.1`, `thag17.1:11.3`).

