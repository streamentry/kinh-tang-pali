notes: |-
  **Phạm vi: đủ 593/593 khoá của mnd6, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải `snp4.6` (Jarāsutta, Kinh Già), thuộc phẩm Aṭṭhakavagga. Cấu trúc giống các bài Mahāniddesa/Cūḷaniddesa đã dịch (`mnd5`, `mnd7`, `mnd8`, `cnd6`, `cnd9`, `cnd16`): dẫn từng đoạn kệ, giải từng cụm, nhắc lại cả đoạn kệ; mười đoạn kệ của kinh nằm ở `2`, `31`, `38`, `50`, `56`, `62`, `67`, `73`, `80`, `85`, mỗi đoạn được nhắc lại trong ngoặc kép sau *Vì thế, Đức Thế Tôn đã nói—* (`30`, `37`, `49`, `55`, `61`, `66`, `72`, `79`, `84`, `93`). Ngoài ra bài trích các kệ khác ở lời giải: `4`–`12` (kệ sát-na tâm), `15`, `18`–`19`, `23`–`27`, `40`–`41`, `45`–`46`. Pāli có 132 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 103 khoá chứa dấu lược `…` (161 dấu): 25 khoá có `…pe…` (đều thành đúng một `…`), 78 khoá có `…` trần, 0 khoá có `(…)`, 0 khoá kết `….`; mỗi khoá giữ đúng số dấu của Pāli.

  **Tên bài.** `0.1` Mahāniddesa → *Đại Tập Kể Lược*, `0.2` Aṭṭhakavagga → *Kể Lược Phẩm Tám Kệ*, theo `mnd5:0.1`–`0.2`; `0.3` và `94.1` → *Kể Lược Kinh Già, thứ sáu* (tên kinh theo `snp4.6:0.2`, cùng khuôn *Kể Lược Kinh Tám Kệ Về Tối Thượng, thứ năm* ở `mnd5`); `1.1` theo `mnd5:1.1`.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd6`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho `kn/mnd` và tệp tên `mnd-name`; tệp `mnd6_translation-en-sujato.json` không tồn tại. Lớp `english-project` không có `mnd6`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **179** khoá (185 nếu đếm cả thẻ); Sujato phủ 0/179, `english-project` 0/179, `vietnamese-current` 0/179. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.6` (bài kệ mà bài này chú giải) có trong tầng đã ghim nhưng là bản của **bài khác**: đã đọc để so cách hiểu các dòng kệ, không tính là đối chiếu English của `mnd6`, và không dùng để nâng `triangulation`. Chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.6`, `snp3.8`, `sn4.9`, `sn4.10`, `dn16`, `dn22`, `mn1`, `mn22`, `mn141`, `ja351`, `iti108`, `an4.26` và công thức chú giải ở `mnd1`, `mnd4`, `mnd5`, `mnd7`, `mnd8`, `mnd12`, `cnd5`, `cnd6`, `cnd9`, `cnd10`, `cnd11`, `cnd13`, `cnd14`, `cnd16`, `cnd19`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: 147 khoá có tiền lệ, dùng lại nguyên văn 92 (từ 24 nguồn; nhiều nhất `cnd19` 14, `snp3.8` 14, `mnd8` 13, `snp4.6` 10, `cnd5` 6, `ja351` 5, `iti108` 5, `cnd16` 3), chỉ khác dấu câu hoặc chữ hoa/thường 5, khác 50. Trong 50 khoá khác: 41 là dòng kệ trùng `snp4.6` (lý do ở mục *Kệ* dưới), 4 là `17.3`–`17.6` (trùng `mn41`, `mn42` nhưng ở đó câu chen *cùng chư thiên …, cõi …*, ngữ cảnh khác), 5 còn lại là `45.1` (trùng `thag17.1:11.3` và `an4.26:2.1`), `46.1` (trùng `iti108:4.1`, `an4.26:3.1`), `64.7` (trùng `dn33`, *Ba sự hiền trí*), `88.1` (trùng `mnd8:77.11`, *tám ngành* → *tám chi*) và `88.9` (trùng `mnd8:77.18`, *Ngài* → *Vị ấy* vì chủ thể là bậc A-la-hán). Đã dò **53 nhóm Pāli trùng nguyên byte trong chính bài** (68 khoá lặp thêm): 0 nhóm có bản Việt khác ngoài chữ hoa đầu câu (một nhóm: `2.4` dòng kệ viết thường, `28.1` đầu câu viết hoa). Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 72 nhóm (110 khoá lặp thêm), 2 nhóm Việt khác: `53.1`/`55.4` (khoá lời giải mở đầu có chữ *Người*, dòng kệ nối từ dòng trước) và `80.4`/`85.2`/`93.2` (*không dính mắc vào* khác *không tưởng nghĩ về*, vì vị ngữ khác).

  **Kệ (các dòng trùng `snp4.6` mà bản Việt khác, kèm lý do).**
    - `31.1`, `32.x`, `37.1`: *được xem là của mình* thay *được cho là của mình*, và *sầu não* thay *sầu khổ*, để khớp lời giải (`cnd6:20.4` *xem là của mình*; toàn tầng *xem là của mình* 10 khoá, trong mnd/cnd 6, *cho là của mình* 2; `socati` → *sầu não* 62, *sầu muộn* 43, *sầu khổ* 24, trong mnd/cnd *sầu não* 16).
    - `31.2`, `37.2`: *sở hữu* thay *tài sản* cho `pariggaha`, vì lời giải `33.x`, `64.x` và `mn22:22.2` đều dùng *sở hữu* (toàn tầng *sở hữu* 17, *tài sản* 7, *nắm giữ* 19 chủ yếu là động từ).
    - `31.3`, `37.3`: *sự xa lìa* thay *sự chia lìa* cho `vinābhāva`, theo `dn16:3.48.2` và `dn17` (6 khoá *sự xa lìa*, 2 khoá *chia lìa*); `31.4`, `37.4`: *không nên sống đời tại gia* thay *người ấy không còn sống trong nhà*, vì `āvase` là thức cầu khiến và lời giải `35.5` dẫn *agārasmā anagāriyaṁ pabbajitvā*.
    - `38.1`–`38.4`, `49.1`–`49.4`: `snp4.6:3.1`–`3.2` đảo thứ tự hai dòng, còn mnd6 cắt lời giải theo từng dòng nên giữ đúng thứ tự Pāli; `māmako` → *đệ tử của Ta* (không phải *kẻ có lòng tham ái* của `snp4.6:3.4`), theo `an4.26`, `iti108` (*không phải đệ tử của Ta* cho `na me te bhikkhū māmakā`) và lời giải `44.6`–`44.9`; `nametha` → *cúi theo*; `maññati` → *tưởng nghĩ* (toàn tầng *tưởng nghĩ* 60, *quan niệm* 50, không khoá nào trong mnd/cnd), cùng gốc với `maññita` ở `89.7` là đoạn trùng `sn35.248` (*sự tưởng nghĩ*).
    - `50.1`–`50.4`, `55.1`–`55.4`: `snp4.6:4.1`–`4.2` ghép hai dòng, bản này giữ đúng thứ tự Pāli (*Như sự gặp gỡ trong giấc mộng, người tỉnh dậy không còn thấy*).
    - `56.1`, `56.2`, `56.4`, `61.2`: `snp4.6:5.1`–`5.2` thêm *ta* và *từng* mà Pāli không có; `jantu` giữ *chúng sinh* như `mnd1:15.3`.
    - `62.1`–`62.4`, `66.2`–`66.3`: `giddhā` → *những kẻ tham lam* (lời giải `63.11` *Lòng tham được gọi là tham ái*, đã có ở `cnd15:30.5`), `macchariya` → *keo kiệt* (cnd5:12.x), không *xan tham*; `snp4.6:6.3`–`6.4` đảo vị trí `khemadassino`.
    - `67.1`–`67.4`, `72.2`–`72.3`: `patilīnacara` → *sống thu mình* (như `snp4.10:5.1` *Thu mình*; lời giải `68.5` mô tả việc làm co rút, quay lui tâm), không *sống ẩn cư*; `vivittamāsana` → *chỗ ngồi tách biệt* theo `mnd7:77.2` (*vivitta* → *tách biệt*), không *thanh vắng*; `bhavane` → *ở bất cứ nơi ở nào* vì lời giải `70.16` định nghĩa `bhavana` là nơi ở của từng loại chúng sinh (địa ngục, súc sinh, ngạ quỷ, người, chư thiên), không phải *trong gia đình* của `snp4.6:7.4`.
    - `73.1`–`73.3`, `79.2`–`79.3`: `appiya` → *điều không ưa thích* (lời giải `75.x` dùng *được ưa thích / không được ưa thích*), `paridevamaccharaṁ` → *than khóc và keo kiệt*.
    - `80.4`, `85.2`, `93.2`: `muta` → *được cảm nhận* thay *được nhận thức*, vì lời giải `74.17`, `82.9`, `89.2`–`89.5` liệt kê riêng `muta` và `viññāta` (`viññāta` → *được nhận biết*); toàn tầng *cảm nhận* 71, *nhận thức* 35, *cảm giác* 14; trong mnd/cnd riêng *nhận thức* 29, *cảm nhận* 11 vì các khoá ấy là công thức ba thành tố (thấy, nghe, `muta`) lấy từ kệ, trong khi bài này dùng cả công thức bốn thành tố ngay cạnh kệ.
    - `85.1`, `85.3`, `91.1`, `93.3`: `nāññena` → *nhờ cái khác* (theo `mnd4:19.1`), không *nhờ kẻ khác*; `na hi so rajjati no virajjati` → *không tham đắm cũng không ly tham*, bỏ *còn* vì Pāli không có.

  **Thuật ngữ khác, kèm số đếm.** `ṭhitiparittatā` → *sự ngắn ngủi của thời gian tồn tại*; `sarasaparittatā` → *sự ngắn ngủi theo bản chất* (0 tiền lệ). `cittakkhaṇa` → *sát-na tâm* (`khaṇa` → *sát-na* ở `thig1.5:1.2`). `jīvita` → *đời sống* trong lời giải (kệ giữ *Đời này* như `snp4.6:1.1`); `āyu` → *tuổi thọ*; `jīvitindriya` → *mạng căn*. `assāsa`/`passāsa` → *hơi thở vào / hơi thở ra* (`sn54.10`). `kabaḷīkārāhāra` → *đoàn thực* (`pe9:16.1`). `paccuppanna`, `anāgata`, `atīta` → *hiện tại, vị lai, quá khứ*. `paramatthiyā` → *theo nghĩa tối thượng* (`ps2.10:31.1`). `āragga` → *đầu mũi kim* (`snp3.9:37.2`, `mn98`). `palokadhamma` → *bản chất tan rã* (`ps3.9`). `khīṇāsava` → *bậc đã diệt tận lậu hoặc* (`cnd13:8.2`). `puthujjanakalyāṇaka` → *phàm phu hiền thiện*, `satta sekkhā` → *bảy bậc hữu học* (`cnd18:48.3`). `paṇḍita` → *có trí* (trong mnd/cnd *có trí* 9, *bậc trí* 8, *hiền trí* 6), `dhīra` → *kiên định* (trong mnd/cnd *kiên định* 4). `iddhipāda` → *thần túc* (trong mnd/cnd *thần túc* 17, *như ý túc* 2; toàn tầng *như ý túc* 296, *thần túc* 68); `aṭṭhaṅgiko maggo` → *Thánh đạo tám chi* (trong các bài Mahāniddesa *tám chi* 5, *tám chi phần* 2, *tám ngành* 1; trong cnd *tám chi phần* 12; toàn tầng *tám ngành* 199). `vacīduccarita` → *ác hạnh về lời* (trong mnd/cnd *về lời* 9, *khẩu* 4; toàn tầng *khẩu* 68, *về lời* 31). `lepa` → *dính mắc* (`cnd6:20.1`, 6 khoá trong mnd/cnd). `nissaya` → *nương tựa*, `anissito` → *không nương tựa* (`cnd9:40.7`–`40.9`). `sāmaggī` → *hòa hợp*; `anabhinibbatti` → *sự không tái sinh* (`pe6:9.15` *abhinibbatti* → *tái sinh*). `anupādisesā nibbānadhātu` → *Niết-bàn giới không còn dư y* (`ps2.10:31.4`). `bhavana` → *nơi ở* (0 tiền lệ). `byasana` → *tai họa* (`dn22:18.13`, `mn141`), `ñātibyasana` → *tai họa về thân quyến*. `paṭigha` → *sân* (71 khoá *sân*, 13 *va chạm*). `payoga` → *nỗ lực* (`tha-ap536:31.3`), `vipāka` → *quả* (186 khoá *quả*, 132 *quả báo*). `asappāya` → *không thích hợp*. Các dãy phiền não `86.8`–`86.24` theo `mnd5:54.x`,