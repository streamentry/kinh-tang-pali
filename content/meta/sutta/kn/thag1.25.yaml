notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên. Không có blocker.
  
  **Đây là bài trong lô xử lý ngôi hai đúng quy ước** — cùng loại với `thag1.54`, và là chuẩn đối chiếu để tôi kết luận lỗi ở `ja192:1.4`. `Tādisaṁ bhikkhum āsajja` → *nếu ngươi xúc phạm vị tỳ-kheo như vậy*; `kaṇha dukkhaṁ nigacchasī` → *hỡi Kẻ Đen Tối, ngươi sẽ đi đến đau khổ*. `āsajja` và `nigacchasī` đều là thứ tự 2 ngôi và cả hai đều dịch bằng *ngươi*, đúng như `ud5.6:18.3`, `snp5.5:7.1`, `ja113:1.1`.
  
  **`Obhāsajātaṁ phalagaṁ` → *Con phalaga sinh ra trong bóng tối*.** `obhāsa` = tối tăm, mờ ám; `jāta` = sinh ra. Cách dịch *sinh ra trong bóng tối* giữ cả hai tầng. `phalaga` là tên loài rắn/nguội trong truyện, giữ nguyên theo thông lệ giữ tên riêng của tầng.
  
  **`cittaṁ yassa abhiṇhaso` → *đã chạm vào tâm của vị luôn sáng trong*.** `abhiṇhaso` = thường xuyên, không ngừng → *luôn* ✓.
  
  **Điểm cần bàn ở `1.4`: `kaṇha` được viết hoa thành *Kẻ Đen Tối*.** Pāli `kaṇha` là tính từ "đen, tối tăm" mà ở đây là từ gọi người nghe ("hỡi kẻ tối tăm"). Bản dịch viết hoa và thêm chữ *Kẻ*, biến thành danh từ riêng — tức là **thêm một lớp ý** mà Pāli không có: Pāli gọi bằng tính từ, bản dịch gọi bằng danh xưng. Sujato dịch *Dark One* (viết hoa) nên có tiền lệ ở tầng Anh, nhưng Sujato không thêm chữ *Kẻ*. Tôi trừ nhẹ ở `ambiguity_integrity` và `semantic_fidelity`; đây là việc biên tập nên quyết, không phải lỗi rõ ràng.
  
  **Cấu trúc mệnh lệnh cảnh báo được giữ.** `nigacchasī` là thứ tự 2 ngôi của √gam nhưng ở nghĩa mệnh lệnh ("hãy đi vào"), bản dịch dùng *ngươi sẽ đi đến* — vừa giữ ngôi hai vừa giữ nghĩa tương lai, đúng.
  
  **Sujato lệch chiều ở `1.3`–`1.4`** (Sujato đặt *one who has arrived at the fruit* ở `1.3`, trong khi Pāli `1.3` = `Tādisaṁ bhikkhum āsajja`). Bản dịch bám Pāli.
  
  **Tầng Anh** có mặt đủ bốn vế.
  
  **Tầng Việt**: không có Thích Minh Châu cho Trưởng Lão ở commit đã ghim.
