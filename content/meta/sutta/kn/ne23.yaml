notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Netti. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ BẮT BUỘC dùng lại. Khoá 2.1 có Pāli trùng nguyên văn với ne24:2.1, ne27:2.1, ne28:2.1, ne29:2.1,
  ne30:2.1, ne34:2.1 và nhiều bài khác; tôi dùng nguyên văn Do vậy, với người có tâm được phòng hộ, chánh tư
  duy là cảnh giới, đó là bài kệ. Đây cũng là dòng TIEN_LE_PHAI nêu cho ne27 và ne32.
  Khung Netti dùng lại nguyên văn từ bản đã có: Netti → Netti (7 bài) · Paṭiniddesavāra → Phần Giải Thích ·
  Sampāta 4 → Nhóm 4 · Xhārasampāta → Nhóm Phương Thức X như ne24 (Dấu Hiệu), ne27 (Phân Biệt),
  ne30 (Định Danh), ne34 (Trợ Duyên) · Tattha katamo X hārasampāto → Ở đây, nhóm phương thức X là gì ·
  Niyutto X hārasampāto → nhóm phương thức X đã được vận dụng.
  Sáu nền tảng: sucarita → hành hạnh thiện (an3.155, an4.85) · samatha → sự định tĩnh ·
  vipassanā → sự quán (ne34:2.2 dùng chỉ và quán cho samathavipassanā) · dassanabhūmi → nền thấy biết ·
  vīriya → sự tinh tấn · bhāvanā → sự tu tập. Sáu câu kệ dẫn dùng nguyên văn từ ne30:2.3-2.5, kể cả
  Chánh tư duy là cảnh giới, Chánh kiến là bảo hộ, Tỳ-kheo có mặt ở cả sự nhợt nhạt và sự nửa chừng, Bỏ hết
  mọi kẻ xấu. Đã hiểu rõ cả khi sinh cả khi diệt lấy từ ne30:2.4.
  Bất định đã ghi nhận. Padaṭṭhāna trong sampāta này tôi dịch là nền tảng ứng với, theo ne30:2.2-2.4 đã có
  (sự định danh của nền tảng ứng với chánh niệm). Vì vậy dasanabhūmi ở khoá 2.5 tôi rút thành nền thấy biết
  để tránh lặp nền tảng ứng với nền tảng; đây là lựa chọn văn phong, không bỏ nghĩa.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0. Nháy kép: mỗi khoá 2.x là một cặp riêng; cân trên cả bài.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
