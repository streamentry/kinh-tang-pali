  BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ:
  · `8.3` `Patino kiramhākaṁ visiṭṭha nārīnaṁ,` — xem `blocking_errors`. **Thiếu sót thật**:
    tôi bỏ `kiramhāka` và không thay bằng nghĩa nào. Từ này là **hapax legomena** trong toàn bộ
    Pāli root đã ghim. Trong tầng Việt dự án cũng không có từ nào cho nó.
  · `8.2` `Yaṁ no apucchimha akittayī no;` — `akittayī` đã được chính `cnd8:44.2` giải nghĩa
    ngay trong Pāli root: *kittitaṁ pakittitaṁ ācikkhitaṁ desitaṁ …* = *đã được tuyên bố, đã
    được nói rõ*. Vậy nghĩa là **điều chúng tôi đã hỏi mà không ai nói cho biết**, không phải
    *chưa từng hỏi*. Tôi dịch theo nghĩa đó; đây là điểm dùng được **bằng chứng trong chính
    bộ kinh** chứ không phải đoán.
  · `1.1`–`1.4` — `Latā ca sajjā pavarā ca devatā` … `Rājīmatī dhammaguṇehi sobhatha` là
    **bốn tên riêng của một nữ thiên** (`Latā`, `Pavarā`, `Sutā`, `Rājīmatī`), không phải ba
    nàng khác nhau. Cơ sở: vế sau `9.1`–`9.4` và `11.x` nói **một** người đã sống đời vợ tử,
    và `Sutā` là *con gái bậc vua chinh phạt* (`suta` = học), `Rājīmatī` = *tỏa sáng như vua
    trời*, `Accimatī` = *mặt trời*, `Sirīmata` = *chói lòa*. Tôi dịch theo cách ấy và ghi rõ ở
    đây vì nó là **quyết định diễn giải**, không chỉ là lựa chọn từ ngữ. Người biên tập nên
    xác nhận.
  · `3.1`–`4.4` — **khó nhất về mạch**. `Pucchāmi taṁ uppalamāladhārini` xưng *tôi* hỏi
    *nàng mang tràng hoa sen*; `Āveḷini kañcanasannibhattace` thì lại là lời **chê** (*nàng xấu
    xí*) trong khi `Timiratambakkhi nabheva sobhane` lại là lời **khen** (*ngọc trai giữa trời,
    chói lòa*) — hai vế trái chiều trong cùng một khối. Cùng cấu trúc xuất hiện ở `vv30:2.1`
    và `vv48:2.1` (cùng `uppalamāladhārini`, cùng `Āveḷinī kañcanasannibhattace`), nhưng cả ba
    bài đều **chưa** có bản Việt nào để đối chiếu. Tôi dịch sát chữ nghĩa chữ nghĩa và **không**
    thêm bớt gì; người biên tập nên tra thảo luận để chốt mạch. `Āveḷini` ở đây ngắn `i`,
    khác `Āveḷinī` ở `vv30:2.2`/`vv48:2.2` — tôi giữ đúng dạng Pāli của từng khoá.
  · `8.4` `Gatī ca tāsaṁ pavarā ca devatā` — `gatī` = *nơi sinh, đích đến*, `pavarā` = *sự tuyên
    pháp*. Ở `8.4` `pavarā` lại là danh từ, khác `9.3` `pavarā seṭṭhā` ở `vv21` (nơi tôi dịch
    *người tuyên thuyết*); ở đây tôi dịch *việc tuyên pháp ấy*. Cùng một Pāli từ, hai vai —
    ghi lại để người biên tập cân nếu muốn thống nhất.
  · `9.x` — `sabbā` là **số nhiều** (*tất cả chúng tôi*); dù bài nói về một người, Pāli cứ dùng
    số nhiều và tôi giữ nguyên. `lacchāmase` = *chúng ta sẽ được ấy* (thứ tự câu đảo trong tiếng
    Việt cho tự nhiên; Pāli để `lacchāmase` trước `bhasati`).
  · `9.2` `Patibbatā yattha bhavanti itthiyo` — bản nháp đầu bỏ mất `Patibbatā` (*lập gia đôn*);
    đã sửa thành *những người nữ đã qua lập gia đôn sinh ra ở chỗ nào*. `9.4` `Lacchāmase` là
    *chúng ta sẽ có được* và đứng **trước** `bhasati` (*tuyên bố*) trong Pāli; bản nháp đầu đảo
    thứ tự cho đỡ vướng, đã trả về *thì điều nàng Latā tuyên bố, chúng ta sẽ có được.*
  · `11.1`–`11.4` — chủ ngữ chuyển: `11.2`–`11.3` xưng *chồng* (`patiṁ`), `11.4` xưng *nàng ấy*
    (`sā`) với danh xưng *kẻ sống đúng pháp* (`dhammacārinī`). Đây là một giọng kể khác với
    khối 5–7; tôi giữ đúng các chủ ngữ Pāli đặt ra. `ariyasāvikā` → *nữ đệ tử bậc Thánh*
    (`sāvikā` = nữ đệ tử, `ariya` = bậc Thánh; xem `sn16.10:1.4` *tịnh xá của các tỳ-kheo nữ*
    và `pp`/`cp` không có tiền lệ trực tiếp cho cụm này).
  · `10.1`–`10.4` — ẩn dụ: **sư tử** không ăn xác, nên dòng `10.3`–`10.4` nói kẻ ăn thịt chỉ ăn
    thịt vụn nát. `mahindhara` = núi chứa nước mưa. Tôi giữ ẩn dụ, **không** diễn giải thành lời
    giảng.
  · `6.3` `Sadevaraṁ sassasuraṁ sadāsakaṁ` — 0 tiền lệ. Tôi dịch *tôi luôn săn sóc chồng mình,
    cha mẹ chồng, xem như bậc trời*; `sas` = chồng, `sasura` = cha mẹ chồng, `sadāsaka` =
    săn sóc, `sadevara` = xem như thần. Đây là cách đọc của tôi; hai vế khác đọc là
    *tôn kính chồng như thần, luôn săn sóc* hoặc *xem cả hai như bậc trên*.

