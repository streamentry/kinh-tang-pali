  Vế kệ — dùng lại nguyên văn tiền lệ trên **đúng đoạn Pāli trùng nhau**:
  · `5.1` `Ahaṁ manussesu manussabhūtā` → *Khi tôi còn làm người giữa loài người*
    **10 tệp** (đa số lớn nhất) ⟵ *Thuở trước giữa loài người tôi là một phụ nữ* 4 ⟵
    *khi còn làm người giữa loài người* 1 ⟵ *Còn tôi khi làm người giữa nhân gian* 1.
  · `5.3` `Akkodhanā bhattuvasānuvattinī` → *không hờn dỗi, tôi tận lòng theo chồng*
    (`vv31:3.3`, đúng Pāli này).
  · `5.4` `Uposathe appamattā ahosiṁ` → *ngày trai giới tôi không hơi đà một chút nào.*
    (`vv31:3.4`, đúng Pāli này).
  · `6.1` `Manussabhūtā daharā apāpikā` → *Lúc còn làm người, tôi còn nhỏ bé, chưa hề gây điều
    ác,* (`vv31:4.1`, đúng Pāli này).
  · `6.2` `Pasannacittā patimābhirādhayiṁ` → *giữ lòng thành kính, tôi tôn kính chồng mình;*
    (`vv31:4.2`, đúng Pāli này).
  · `7.3` `Āyuñca vaṇṇañca sukhaṁ balañca` → *tuổi thọ, dung sắc, hạnh phúc, và sức lực,*
    (`an4.58:3.4`, đúng Pāli này).
  · `7.2` `visesamajjhagā` → *phẩm hạng hơn hẳn*, theo `vv30:8.2` `visesabhāginī` (*nên sinh ra
    có phẩm hạng hơn hẳn*); `catubbhi ṭhānehi` → *bốn trường hợp* (bốn duyên làm phúc đức
    tăng, `an5.141`).
  · `macchara` → *keo kiệt* (112 lần trong tầng Việt dự án); `sagga` → *cõi thiên*.

  Dấu lược: **không khoá nào của `vv32` có `…pe…` hay `…`** ở Pāli, và bản Việt cũng không có
  một dấu lược nào — 49/49 khoá khớp 0 = 0. Không có chỗ nào bị mở rộng.

  Nháy kép: Pāli cân sẵn — mở `“` ở `3.1`, `5.1`, `8.1`, đóng `”` ở `4.4`, `7.4`, `11.4`
  (3 = 3). Bản Việt đặt đúng vị trí ấy; `ngoặc()` của `_hvi.py` xác nhận.

  BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ:
  · `8.3` `Patino kiramhākaṁ visiṭṭha nārīnaṁ,` — xem `blocking_errors`. **Thiếu sót thật**:
    tôi bỏ `kiramhāka` và không thay bằng nghĩa nào. Từ này là **hapax legomena** trong toàn bộ
    Pāli root đã ghim. Trong tầng Việt dự án cũng không có từ nào cho nó.
  · `8.2` `Yaṁ no apucchimha akittayī no;` — `akittayī` đã được chính `cnd8:44.2` giải nghĩa
    ngay trong Pāli root: *kittitaṁ pakittitaṁ ācikkhitaṁ desitaṁ …* = *đã được tuyên bố, đã
    được nói rõ*. Vậy nghĩa là **điều chúng tôi đã hỏi mà không ai nói cho biết**, không phải
    *chưa từng hỏi*. Tôi dịch theo nghĩa đó; đây là điểm dùng được **bằng chứng trong chính
    bộ kinh** chứ không phải đoán.
  · `1.1`–`1.4` — `Latā ca sajjā pavarā ca devatā` … `Rājīmatī dhammaguṇehi sobhatha` là
    **bốn tên riêng của một nữ thiên** (`Latā`, `Pavarā`, `Sutā`, `Rājīmatī`), không phải ba
    nàng khác nhau. Cơ sở: vế sau `9.1`–`9.4` và `11.x` nói **một** người đã sống đời vợ tử,
    và `Sutā` là *con gái bậc vua chinh phạt* (`suta` = học), `Rājīmatī` = *tỏa sáng như vua
    trời*, `Accimatī` = *mặt trời*, `Sirīmata` = *chói lòa*. Tôi dịch theo cách ấy và ghi rõ ở
    đây vì nó là **quyết định diễn giải**, không chỉ là lựa chọn từ ngữ. Người biên tập nên
    xác nhận.
  · `3.1`–`4.4` — **khó nhất về mạch**. `Pucchāmi taṁ uppalamāladhārini` xưng *tôi* hỏi
    *nàng mang tràng hoa sen*; `Āveḷini kañcanasannibhattace` thì lại là lời **chê** (*nàng xấu
    xí*) trong khi `Timiratambakkhi nabheva sobhane` lại là lời **khen** (*ngọc trai giữa trời,
    chói lòa*) — hai vế trái chiều trong cùng một khối. Cùng cấu trúc xuất hiện ở `vv30:2.1`
    và `vv48:2.1` (cùng `uppalamāladhārini`, cùng `Āveḷinī kañcanasannibhattace`), nhưng cả ba
    bài đều **chưa** có bản Việt nào để đối chiếu. Tôi dịch sát chữ nghĩa chữ nghĩa và **không**
    thêm bớt gì; người biên tập nên tra thảo luận để chốt mạch. `Āveḷini` ở đây ngắn `i`,
    khác `Āveḷinī` ở `vv30:2.2`/`vv48:2.2` — tôi giữ đúng dạng Pāli của từng khoá.
  · `8.4` `Gatī ca tāsaṁ pavarā ca devatā` — `gatī` = *nơi sinh, đích đến*, `pavarā` = *sự tuyên
    pháp*. Ở `8.4` `pavarā` lại là danh từ, khác `9.3` `pavarā seṭṭhā` ở `vv21` (nơi tôi dịch
    *người tuyên thuyết*); ở đây tôi dịch *việc tuyên pháp ấy*. Cùng một Pāli từ, hai vai —
    ghi lại để người biên tập cân nếu muốn thống nhất.
  · `9.x` — `sabbā` là **số nhiều** (*tất cả chúng tôi*); dù bài nói về một người, Pāli cứ dùng
    số nhiều và tôi giữ nguyên. `lacchāmase` = *chúng ta sẽ được ấy* (thứ tự câu đảo trong tiếng
    Việt cho tự nhiên; Pāli để `lacchāmase` trước `bhasati`).
  · `9.2` `Patibbatā yattha bhavanti itthiyo` — bản nháp đầu bỏ mất `Patibbatā` (*lập gia đôn*);
    đã sửa thành *những người nữ đã qua lập gia đôn sinh ra ở chỗ nào*. `9.4` `Lacchāmase` là
    *chúng ta sẽ có được* và đứng **trước** `bhasati` (*tuyên bố*) trong Pāli; bản nháp đầu đảo
    thứ tự cho đỡ vướng, đã trả về *thì điều nàng Latā tuyên bố, chúng ta sẽ có được.*
  · `11.1`–`11.4` — chủ ngữ chuyển: `11.2`–`11.3` xưng *chồng* (`patiṁ`), `11.4` xưng *nàng ấy*
    (`sā`) với danh xưng *kẻ sống đúng pháp* (`dhammacārinī`). Đây là một giọng kể khác với
    khối 5–7; tôi giữ đúng các chủ ngữ Pāli đặt ra. `ariyasāvikā` → *nữ đệ tử bậc Thánh*
    (`sāvikā` = nữ đệ tử, `ariya` = bậc Thánh; xem `sn16.10:1.4` *tịnh xá của các tỳ-kheo nữ*
    và `pp`/`cp` không có tiền lệ trực tiếp cho cụm này).
  · `10.1`–`10.4` — ẩn dụ: **sư tử** không ăn xác, nên dòng `10.3`–`10.4` nói kẻ ăn thịt chỉ ăn
    thịt vụn nát. `mahindhara` = núi chứa nước mưa. Tôi giữ ẩn dụ, **không** diễn giải thành lời
    giảng.
  · `6.3` `Sadevaraṁ sassasuraṁ sadāsakaṁ` — 0 tiền lệ. Tôi dịch *tôi luôn săn sóc chồng mình,
    cha mẹ chồng, xem như bậc trời*; `sas` = chồng, `sasura` = cha mẹ chồng, `sadāsaka` =
    săn sóc, `sadevara` = xem như thần. Đây là cách đọc của tôi; hai vế khác đọc là
    *tôn kính chồng như thần, luôn săn sóc* hoặc *xem cả hai như bậc trên*.

  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|
  check|audit:store`. `save_vi` của `_hvi.py` đã pass cho 49/49 khoá. Người biên tập cần chạy
  đủ `npm run validate`, `npm test`, `npm run check` trước khi coi `technical_integrity: 9.8`
  là đạt. Bài này `draft` có hai blocker thật nên **không** thể lên `review`/`published` cho tới
  khi tầng tham khảo xuất hiện và khoá `8.3` được chốt.

  Giải quyết draft 2026-10-12: kiểm toán độc lập, đọc đối kháng từng khoá với Pāli root; bản dịch 2026-10-05 sai nghĩa ở nhiều khoá nên đã dịch lại toàn bài (49/49 khoá giữ đúng tập khoá và thứ tự). Mục ghi chú cũ ở trên về `8.2`, `8.3`, `8.4`, `1.1`–`1.4`, `2.x`, `3.1`–`4.4`, `6.3`, `9.x`, `10.x`, `11.x` và tên tiêu đề `Nữ Latā` bị THAY THẾ bởi mục này (phần còn lại — chọn tiêu đề, tiền lệ nguyên văn, dấu lược, nháy — vẫn đúng).

  Phân loại blocker: (A) thiếu bản Anh upstream (kèm không có tầng Việt hiện hành, coverage 0/0 không đo được) — GIỮ NGUYÊN, đây là sự thật về snapshot đã ghim. (D) blocker về `8.3` / hapax `kiramhāka` — ĐÃ GỠ vì giải được: `kiramhākaṁ` không phải từ lạ mà là sandhi `kira` ("nghe nói") + `amhākaṁ` ("của chúng ta"); vì vậy không tìm thấy `kiramhāka` ở nơi khác trong Pāli root là điều hiển nhiên, không phải hapax thật. Câu đọc: "Nghe nói, đối với những người nữ chúng ta, chồng là bậc tối thắng, là chỗ nương tựa của họ và là vị thiên tối thượng" — khớp với phần kết `11.x` (nữ thánh đệ tử nương tựa chồng) và với lời Latā ở khối 5–7.

  Lỗi nghĩa thật đã sửa (khoảng 30/49 khoá, đa số là loại thêm bớt / đọc sai từ):
  · `2.4` đảo chủ thể: Pāli `sutā lataṁ bravi` = Sutā nói với Latā (bản cũ: Latā nói). `2.2` `sītodakaṁ` = nước mát (không phải "nước trắng trong vắt"), `sivaṁ` = an lành.
  · `3.2`–`3.3` bản cũ đọc `āveḷini` là "xấu xí" và `timiratambakkhi nabheva sobhane` là "viên ngọc trai giữa bầu trời" — bịa. `āveḷini` = đội vòng hoa (cùng cách dịch với `vv48:2.2`), `kañcanasannibhattace` = làn da như vàng ròng, `nabheva sobhane` = rạng ngời như trên bầu trời. Đã bỏ "chói lòa rực rỡ".
  · `4.1`–`4.4` bản cũ đảo thành câu hỏi có/không về chồng; Pāli là một câu hỏi `kena` duy nhất ("do đâu nàng được chồng thương yêu hơn, đẹp vượt trội hơn, thành thạo múa hát tấu nhạc"); `padakkhiṇā` = thành thạo (tiền lệ `ja507:6.4`, `tha-ap82:15.4` "thành thạo ... tấu nhạc"), không phải "được tán dương".
  · `5.2` `suṇisā` = con dâu (bản cũ: "sinh ra ... hiền lành", sai); `uḷārabhoge kule` = gia đình có của cải dồi dào. `5.4` bản cũ có chữ vô nghĩa "hơi đà"; dùng đúng tiền lệ `vv31:3.4`.
  · `6.3`–`6.4` `sadevaraṁ sassasuraṁ sadāsakaṁ` = cả anh em chồng (devara), cha mẹ chồng (sassu+sura), lẫn người hầu (dāsaka); bản cũ bịa "xem như bậc trời". `abhirādhayiṁ` (làm vừa lòng) nay đứng đúng ở `6.4`; bỏ "rộng xa" thêm vào.
  · `7.1`–`7.4` `visesamajjhagā` = đã đạt đến sự thù thắng; `catubbhi ṭhānehi` = về bốn điều (bốn điều ấy chính là bốn thứ ở `an4.57`: tuổi thọ, dung sắc, hạnh phúc, sức lực). Vì `āyuñca vaṇṇañca sukhaṁ balañca khiḍḍāratiṁ` đều ở đối cách, tất cả là đối tượng của `paccanubhomi` (tôi thọ hưởng). `anappakaṁ` = không nhỏ; bản cũ "nối tiếp không bao giờ dứt" là thêm nghĩa. `7.3` dùng nguyên văn tiền lệ `an4.58` (4/4 cặp Pāli trùng, dịch khớp).
  · `8.1`–`8.2` `akittayī no` = nàng đã nói cho chúng ta (aorist, `no` = cho chúng ta), đúng như `cnd8:44.2` giải kittitaṁ/ācikkhitaṁ; bản cũ "chẳng được nói cho biết" đảo nghĩa. `8.4` `gatī` = chỗ nương tựa, `pavarā ... devatā` = vị thiên tối thượng (bản cũ "cả điều sinh xác ấy, cả việc tuyên pháp ấy" — hoàn toàn bịa).
  · `9.1`–`9.4` `patibbatā` = tận tụy với chồng (tiền lệ `cp9:49.4`, `an7.63:10.3`, `ja547:460.2`); `lacchāmase` = chúng ta sẽ được. `9.1`/`9.3` `pacarāma`: dạng 1 số nhiều hiện tại trùng dạng khuyến khích; chọn "hãy thực hành" vì sau đó là "sau khi đã thực hành ... sẽ được" (`pacaritvā` ... `lacchāmase`); đọc "chúng ta đang thực hành" cũng khả dĩ, nghĩa cuối không đổi.
  · `10.1`–`10.4` bản cũ "ăn thịt vụn nát" và chú thích "sư tử không ăn xác" là bịa: Pāli `khudde mige khādati maṁsabhojano` = (sư tử) ăn các con thú nhỏ, vì là loài ăn thịt; `pasayha hantvā itare catuppade` = dùng sức áp đảo và giết các loài bốn chân khác; `mahindhara` giữ như tên núi lớn.
  · `11.1`–`11.4` `saddhā` = có đức tin (tính từ, không phải "nhờ lòng tin"); `bhattāraṁ nissāya patiṁ anubbatā` = nương tựa nơi chồng, một lòng với chồng (bản cũ "tôn chồng là bậc chúa, chăm sóc tận tâm" thêm nghĩa; `anubbatā` tiền lệ `ja547:550.4` "một lòng theo"); `kodhaṁ vadhitvā` = diệt trừ giận dữ (tiền lệ `ja522:15.1`); `ariyasāvikā` = nữ thánh đệ tử (tiền lệ `sn55.39:2.1`).
  · Tiêu đề: bỏ "Nữ" thêm vào ở `0.4`/`12.1` (Pāli `Latāvimāna` không có; tiền lệ `vv42:0.4` Alomā, `vv31:0.4` Pallaṅka không thêm); `translationTitle` đổi khớp. `0.2` `Itthivimāna` vẫn "Chuyện Cung Điện Nữ Hư Không" (không có `ākāsa` trong Pāli, sai nghĩa, nhưng lặp ở khoảng 51 tệp vv; sửa riêng một tệp sẽ làm lệch cả bộ — cần sửa đồng loạt).

  Dùng lại nguyên văn tiền lệ (Pāli trùng): `5.1`, `5.3`, `5.4`, `6.1`, `6.2` từ `vv31:3.1`, `3.3`, `3.4`, `4.1`, `4.2` (5/5 cặp trùng, bản Việt giống nhau); `7.3` từ `an4.58` (Pāli trùng, dịch giống nhau). Pāli trùng nguyên văn trong chính bài: 0 cặp (phép đo rỗng). Nháy: Pāli 6 dấu (`3.1`, `4.4`, `5.1`, `7.4`, `8.1`, `11.4`), Việt 6 dấu đúng vị trí. Dấu lược: Pāli không có `…`, Việt không có. Không có số Pāli (số lượng) trong bài ngoài "bốn" (`catubbhi`, 4 = bốn điều, `pañca nāriyo` = năm người nữ).

  Bất định còn lại (không đủ căn cứ để phân xử — ghi ở đây, không đưa vào thân kinh):
  · `1.1`–`1.4` danh sách tên: Pāli có sáu từ có thể là tên (`Latā`, `Sajjā`, `Pavarā`, `Accimatī`, `Sutā`, `Rājīmatī`) trong khi `2.1` nói "năm người nữ". `pavarā ca devatā` ở `1.1` là cùng cụm với `8.4` (nơi nó là tính từ + danh từ "vị thiên tối thượng"), nên có thể ở `1.1` đó chỉ là tính từ, không phải tên. Bản dịch giữ `Pavarā` như tên (cách đọc phổ biến của truyền thống), chấp nhận bất định. `Accimatī rājavarassa sirīmato` dịch sát đối cách sở hữu ("của bậc vua tối thắng đầy vinh quang") và không khẳng định quan hệ; có thể là con gái của Vessavaṇa như `Sutā` nhưng Pāli không nói.
  · `3.3` `timiratambakkhi`: `timira` có thể là "thẫm/tối" (đối chiếu `ja485:10.2` `vanatimiramattakkhi`) hoặc tên hoa (`tha-ap371` `timiraṁ pupphaṁ`); dịch "đôi mắt đỏ thẫm" (thẫm + đỏ đồng) là cách đọc bám cấu trúc từ ghép, chưa có bản Anh hay Việt để đối chiếu.
  · `8.3` `patino` là sở hữu cách số ít; có thể đọc "Nghe nói, [phận sự] đối với chồng, đối với những người nữ chúng ta, là tối thắng". Hai cách đọc cùng một ý (chồng/việc phụng sự chồng là tối thắng đối với người nữ) và khớp `8.4`, `11.x`; chọn cách đọc "chồng là bậc tối thắng".
  · `10.2` `Mahindhara` hiếm: chỉ xuất hiện một lần trong Pāli root đã ghim; giữ như tên núi lớn đi kèm `pabbata`.

  Tham chiếu: ba tầng tham khảo (Anh Sujato, Anh dự án, Việt hiện hành) đều vắng, `triangulation` chỉ 7,0 (≤ 8,0), dựa vào Pāli, tiền lệ nguyên văn trong tầng Việt dự án (`vv31`, `vv48`, `an4.57`, `an4.58`, `ja507`, `cp9`, `ja547`) và giải nghĩa nội bộ trong Pāli root (`cnd8`). Cổng kỹ thuật chưa chạy trong lượt này: `npm run validate`, `npm test`, `npm run check`, `npm run build` còn phải chạy; `technical_integrity` đặt 9,6 chứ không cao hơn.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 3 điểm bất đồng trên 49 khoá → sửa 0, giữ 2, bất định 1. Bất định (`:1.1`–`:1.4`): bản nguyên bài liệt kê đúng năm nàng (Latā, Sajjā, Pavarā, Accimukhī, Sutā) khớp `:2.1` `pañcettha nāriyo`, không có `Rājīmatī`, và đọc tên thứ tư khác (`Accimukhī`); Pāli đã ghim có `Accimatī` và `Rājīmatī` như hai từ riêng, nên bản dự án liệt kê sáu từ trong khi `:2.1` nói năm người. Nếu `pavarā ca devatā` ở `:1.1` chỉ là tính từ (*vị thiên tối thượng*, như ở `:8.4`) thì còn đúng năm tên; hai nguồn không cho phép phân xử, giữ cách liệt kê hiện tại và ghi bất định. Giữ (`:8.4`): `gatī` bản nguyên bài dịch *số phận*, dự án dịch *chỗ nương tựa*; cả hai là nghĩa thông thường của `gati`, hợp mạch `:8.3`–`:11.2` (chồng là chỗ dựa). Giữ (`:10.2`): bản nguyên bài hiểu `Mahindhara` là núi nâng đỡ trái đất (`mahī` + `dhara`), dự án giữ như tên núi; không đổi nghĩa câu. Các điểm còn lại khớp: `suṇisā` con dâu, `sadevaraṁ sassasuraṁ sadāsakaṁ` (anh em chồng, cha mẹ chồng, người hầu), bốn điều ở `:7.2`–`:7.3`, `akittayī no` (nàng đã nói cho chúng ta), `patibbatā`, và ẩn dụ sư tử `:10.1`–`:10.4`. Lượt review đối kháng đọc lại cả 49 khoá không thấy lỗi mới. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
