notes: |-
  **Đo lại ba mệnh đề.** `0.1` Pāli `Milindapañha` → giữ Pāli: 190/201 bài `mil`
  giữ Pāli, 8 dùng *Mi-lan-đà Vấn Đạo*, 3 dùng *Mi-tiên Vấn Đáp*; theo đa số, giữ Pāli.
  `0.2` Pāli `Meṇḍakapañha` → giữ Pāli: 22/32 (4 *Câu Hỏi Nan Đề*, 2 *Những Câu Hỏi Hóc
  Búa*, 2 *Những Câu Hỏi Lưỡng Đao*, 2 *Phẩm Meṇḍakapañha*); theo đa số, giữ Pāli, và
  khớp tuyệt đối với `mil5.3.8`. `0.3` Pāli `Paṇāmitavagga ` → 6 tệp `mil5.3.*` có đúng
  Pāli này đều dùng **Paṇāmitavagga** (mil5.3.1/.4/.5/.8/.10/.11); hai tệp lạ là
  *Phẩm Đuổi Đi* (mil5.3.9/.12). Theo luật trùng nguyên văn, tôi dùng **Paṇāmitavagga**
  — không thêm cách thứ N+1.

  **Tiều lệ trùng nguyên văn, đã dùng lại.** 9 khoá trùng Pāli ở bài khác của tầng:
  `0.1`←`mil7.7.8:0.1`, `0.2`←`mil5.3.8:0.2`, `0.3`←`mil5.3.1:0.3`, `1.1`←`mil5.3.8:1.1`
  (theo đó `tumhe` là số nhiều nên tôi dịch *chính các ngài đã nói*),
  `1.7`←`mil5.3.8:1.7` (*Câu hỏi hai đầu này đã đến với ngài, xin ngài hãy giải quyết*),
  `3.4`←`mil6.2.3:1.4` (*Vâng, này Đại vương*), `10.2` và `10.6`←`mil3.5.1:1.8`,
  `10.9`←`mil5.3.8:8.4`.

  **`”ti.` — đo rồi mới chọn.** Trong tầng `mil`, khoá Pāli kết bằng `”ti.` mà bản Việt
  **giữ nguyên** `”ti.` là 397, chỉ để `”.` là 188, còn lại 220 viết kiểu khác. Tôi giữ
  `”ti.` ở mọi khoá kết thúc bằng nó. Trong hai chỗ này tôi **lệch khỏi tiền lệ** và nói
  rõ: `1.7` và `10.9` có Pāli trùng nguyên văn với `mil5.3.8:1.7` và `mil5.3.8:8.4`, mà
  hai tệp ấy lại bỏ `ti`; tôi lấy nguyên văn chữ nghĩa của chúng nhưng thêm lại `ti` cho
  khớp đa số tầng và khớp Pāli. Với dấu nháy cong trích lời nói **bên trong** câu thì ngược
  lại, tôi **bỏ** `ti`, đúng như quy ước đã có: `mil3.1.13:2.3` Pāli `…ariyo aṭṭhaṅgikaṃ
  maggaṃ”ti` → bản Việt kết `…giải thoát’.`, và `mil3.1.10:2.5` Pāli `‘pivatu, deva,
  pānīyan’ti` → `‘Tâu bệ hạ, xin bệ hạ dùng nước!’`.

  **`bhante` / `mahārāja` — đo cả hai mặt rồi mới chọn, và chọn theo dạng Pāli.**
  - Toàn tầng `mil` (531 khoá Pāli có `bhante`): *tôn giả* 360 lần, *ngài* 198, *Đại đức* 28.
  - Chỉ trong cặp Pāli trùng nguyên văn của bài này (152 cặp): *tôn giả* 88, *ngài* 48,
    *Đại đức* 12.
  - Tách theo dạng: Pāli chỉ có `bhante` (không kèm tên) → toàn tầng 301 khoá: *tôn giả*
    236 vs *ngài* 66; lát này 90 cặp trùng: *tôn giả* 76 vs *ngài* 8 → **bạch tôn giả /
    thưa tôn giả**. Pāli `bhante nāgasena` → toàn tầng 230 khoá: *ngài* 132 vs *tôn giả*
    124 (gần như ngang); lát này 62 cặp trùng: *ngài* 40 vs *tôn giả* 12 → **bạch ngài
    Nāgasena / thưa ngài Nāgasena**. Cả hai số đều ghi ở đây để người điều phối thấy.
  - `mahārāja`: toàn tầng `mil` 1389 khoá Pāli có `mahārāja`, đếm **theo lần xuất hiện**
    thì *Đại vương* (hoa) 886 vs *đại vương* (thường) 442 → theo đa số, **Đại vương**.
    Riêng bài này: 39 khoá có `mahārāja`, đem đối chiếu chỉ số trùng nguyên văn thì **0
    cặp trùng** (mọi câu ấy đều dài và đặc thù), nên không có tiền lệ trùng để dùng
    lại; tôi theo đa số toàn tầng. `mahārājā` ở `3.4` là số nhiều nhưng vẫn là cách gọi
    thẳng vua, nên theo tiền lệ trùng nguyên văn `mil6.2.3:1.4`.

  **Thuật ngữ — tiền lệ đếm được trong chính tầng Việt.**
  `tathāgato` → *Như Lai* (74 khoá `mil`); `bhagavato` → *Đức Thế Tôn* (27 khoá);
  `tacchako` → *người thợ mộc*, `tacchati` → *đẽo gọt* (theo `mil7.7.10:1.2`
  *như người thợ mộc theo đúng đường dây mực đen mà đẽo gọt thân cây*); `kassako` →
  *nông dân* (theo `mil3.2.2:2.2`); `dhammapariyāya` → *bài pháp giảng về* (theo
  `cnd3:1.4`, `cp35:18.1`, `mil5.4.4:1.1`).

  **Chỗ tôi cố ý lệch tiền lệ, và vì sao — để người biên tập biết cần gộp.**
  `anunayappaṭigha`: tầng hiện dùng *giận dữ hay thương mến* (`mil5.3.12:2.4–2.5`), dịch
  `anunaya` thành *thương mến*. Pāli `anunaya` ở đây mang tiền tố phủ định `a-`, tức là
  **không được lòng / không vừa ý**, cộng `paṭigha` = chống đối, khó chịu. Tôi dịch *bực
  bội hay khó chịu* (và *vượt khỏi bực bội và khó chịu* cho `vippamutta`). Tệp
  `mil5.3.12` thuộc lát khác nên tôi không sửa; nếu biên tập đồng ý thì cần sửa cả hai.
  `micchāpaṭipanna` → *đi lệch* (khớp `mil5.5.8:12.1` *đi lệch phải*), và
  `sammāpaṭipanna` → *đi đúng đường* để thành cặp đối xứng; `sammāpaṭipanna` có 0 tiền lệ
  nên đây là cặp do tôi đặt.

  **Bốn từ 0 tiền lệ, đã ghi cách chọn.**
  - `uṇhaṁ lohitaṁ mukhato uggata` (0 tiền lệ): tôi dịch *khói đỏ như máu từ miệng
    trào ra*. `uṇha` = khói, `lohita` = đỏ như máu, `mukhato uggata` = từ miệng trào ra.
    Dùng **nguyên văn một cụm** ở cả 14 khoá có nó, kể cả `2.1` và `9.3` nơi phải phủ
    định, để câu không lệch nghĩa.
  - `amata` (0 tiền lệ) → *vị bất tử*; `dhammāmatena` → *vị bất tử của Pháp*.
  - `sattā bhabbā / abhabbā` (0 tiền lệ) → *có khả năng / không có khả năng*.
  - `patanti` → *rơi lạc* (đối xứng với `buddhanti` = *giác ngộ*); đây là lựa chọn của tôi.

  **Dấu lược:** 0/46 khoá có `…pe…`; bản Việt không có dấu lược nào. Nháy kép mở/đóng đúng
  theo từng vị trí trong Pāli, kể cả khối `7.4 → 10.1` là một lời thoại liên tục qua bốn
  khoá không dấu nháy (`8.1, 8.2, 9.1–9.3`), và `10.7` mở nháy mới sau khi `10.6` đã
  đóng.

  **Triangulation:** không có tầng Anh đã ghim cho `mil` (xem blocker) nên bài chỉ dịch từ
  Pāli đã ghim cùng commit (`11c9d708978cde8ba61096d8a75f7ddfb846f639`) cùng tiền lệ đếm
  được trong chính tầng Việt dự án. Không chạy được `npm run validate|test|check|build`
  theo lệnh phân công đợt này, nên technical_integrity là 9.6.

  **Giải quyết draft 2026-10-12.** Đọc đối kháng lại toàn bài từ Pāli đã ghim; 39/46 khoá
  đổi (38 khoá nội dung + tiêu đề `0.4`), trong đó 21 khoá sai nghĩa thật. Các mục cũ ở trên
  bị thay thế như sau: *"Bốn từ 0 tiền lệ"* (nhất là `uṇhaṁ lohitaṁ` = *khói đỏ như máu*),
  *"Chỗ tôi cố ý lệch tiền lệ"* (`anunayappaṭigha`), `patanti` = *rơi lạc*, `micchāpaṭipanna` =
  *đi lệch*, `amata` = *vị bất tử*, và các quyết định ở `0.4`/`11.1`, `1.1`, `1.7` đều không còn
  hiệu lực; những mục khác (ba mệnh đề `0.1`–`0.3`, `”ti.`, `bhante`/`mahārāja`) giữ nguyên.

  **Lỗi nghĩa thật đã sửa (21 khoá).**
  - `uṇhaṁ lohitaṁ mukhato uggataṁ` là *máu nóng từ miệng trào ra* (`uṇha` = nóng, `lohita` =
    máu), không phải "khói đỏ như máu"; khớp `an7.72:18.2` (*máu nóng từ miệng của sáu mươi vị
    tỳ-kheo trào ra*) và khớp chính `3.3` bản cũ. Sửa ở `1.3, 1.5, 1.6, 2.1, 3.1, 3.2, 9.3`.
  - `1.4` bị đảo hẳn: Pāli là `hitamapanetvā ahitamupadahitaṁ` = *trừ bỏ lợi ích rồi đem lại điều
    bất lợi* (lời chất vấn của vua), bản cũ viết ngược thành *cứu khỏi điều hại, đem lợi ích*.
  - `2.1` bản cũ phủ định sự kiện ("không hề trào ra"), trong khi Pāli khẳng định máu trào ra
    và phủ định **nguyên nhân** (*không do việc làm của Như Lai, mà do việc làm của chính họ*).
  - `1.6` bản cũ chèn *"là đúng"* mà Pāli không có (`Yadi … uggataṁ` = *nếu … đã trào ra*).
  - `anunayappaṭigha` (`4.1, 4.4, 5.2`): bản cũ cho `anunaya` mang tiền tố phủ định `a-` và dịch
    *bực bội*; đó là sai: `anunaya` là *ưa thích/quyến luyến*, đối với `paṭigha` = *chống đối,
    ghét bỏ*. Đo tiền lệ: `anunayappaṭigha…` ở 11 khoá khác của tầng, toàn bộ dịch theo nghĩa
    ưa/thương/quyến luyến + ghét/sân (*tham luyến và sân hận* 6, *ưa thích và ghét bỏ* 2, *quyến
    luyến và xung đột* 2, *quyến luyến và ác cảm* 1); chọn *ưa thích và ghét bỏ* (sát chữ nhất, `mil7.4.1:5.1`).
  - `3.5`: `tathāgatoyeva tattha adhikāro tesaṁ nāsanāya` bản cũ viết *chỉ Như Lai mới có quyền
    quyết định*; sửa cho khớp `3.3` thành *chính Như Lai là người chịu trách nhiệm trong việc
    hủy hoại họ* (đây là chỗ vua cáo buộc, không phải lời khẳng định quyền hạn).
  - `4.3`: `sārāni` bản cũ *ngon ngọt* (Pāli không nói vị); `daḷhabandhanāni` = bám chặt;
    `pūtivaṇṭamūlāni` = gốc cuống mục. `madhukaṁ` bản cũ *cây mật*; tầng đang giữ `madhuka`
    nguyên dạng ở các khoá jātaka có từ này, nên giữ `madhuka`.
  - `5.1`: `dhaññaṁ ropetukāmo` = muốn *trồng lúa* (không phải "gieo hạt"); `tiṇāni` = cỏ (bản cũ
    thêm *dại*, *vô số*); `anekasatasahassāni` = nhiều trăm nghìn.
  - `7.3`: `vajjanīyaṁ` = phần *cần bỏ* (tiền lệ `mil5.5.7:4.4` *cần phải tránh*), không phải
    "đáng chê"; câu cũ dựng thành điều kiện phủ định ("nếu không … thì … đâu") lệch cấu trúc.
  - `8.1`: bản cũ *cây chuối, cây dầu và cây xoài*; Pāli `kadalī veḷu assatarī` = cây chuối, cây
    **tre**, con **la cái**; `attajena haññati` = bị giết bởi *cái do chính mình sinh ra*.
  - `9.1`: `sīsacchedanaṁ` = *chặt đầu* (bản cũ *cắt tai*); `sūlāropanaṁ` = *xiên lên cọc nhọn*.
  - `9.3`: `neva bhagavato katena, na paresaṁ katena` = *không do việc làm của Đức Thế Tôn,
    không do việc làm của người khác* (bản cũ *họ làm theo Đức Thế Tôn*).
  - `10.1, 10.5`: `apuññaṁ āpajjeyyā` = *mắc phải điều vô phước* (đo: cụm `kiñci apuññaṁ āpajjeyyā` dịch *mắc phải điều vô
    phước nào* ở các khoá `mil5.1.3:6.3, 7.9, 7.10, 9.5, 9.6`), không phải "phước tuệ dù không"; `sabbītito parimucceyyuṁ` = *thoát khỏi mọi
    tai họa* (bản cũ *hoàn toàn được giải thoát*); `visūcikā` = *bệnh dịch tả* (`mil5.2.4:13.7`;
    bản cũ *kiết lỵ*).
  - `10.3, 10.7`: `te dhammāmatena bujjhanti` = *giác ngộ* (bản cũ *làm cho hiểu biết*, bỏ mất
    `bujjhanti`); `amataṁ dhammadānaṁ` = *Pháp thí bất tử*.
  - `5.2` bản cũ *tâm đã thành thụ* (chữ sai); `paripakkamānasa` = *tâm đã chín muồi*, thống
    nhất với `6.2`.
  - Thiếu `evameva kho` (*cũng vậy*) ở `4.4`; thêm `ayampi` = *cũng* ở `1.7`.

  **Thuật ngữ — đo lại.** `sabbasatta` → *tất cả chúng sinh* (bản cũ *loài*): tầng dùng *chúng
  sinh* ở mọi khoá đã dò có `sabbasatta`/`sabbasattānaṁ` (tha-ap, bv, mil). `pharaṇa` (`0.4`, `11.1`) → *lan tỏa* (`ne21:5.1–5.3`,
  `pharaṇa` đều *lan tỏa*), bản cũ *đưa … đến* bỏ mất `pharaṇa`. `-matta` sau số → *khoảng*
  (`mil2:47.1`, `mil2:54.1`, `snp1.4:1.3`). `aggikkhandhūpama dhammapariyāya` → *pháp môn Ví Dụ
  Đống Lửa Lớn* (tên kinh `an7.72` trong tầng là *Ví Dụ Đống Lửa Lớn*; `dhammapariyāya` = *pháp môn*
  ở `cnd21`, `cnd3`). `micchāpaṭipanna`/`sammāpaṭipanna` → *thực hành sai lạc/đúng đắn* (`cnd23:18.16`
  *thực hành chân chánh*, `ja536:23.7` *thực hành đúng đắn*, `mil5.5.8:12.1` *hành trì sai lạc/chân
  chánh*); bản cũ *đi lệch/đi đúng đường* chỉ có 1 tiền lệ yếu. `patanti` → *rơi xuống* (sát
  chữ, đồng nhất với ví dụ trái cây rơi). `bodheti`/`bodhaneyya` → *giác ngộ … đáng được giác ngộ*
  (`mil5.3.3:7.4–7.6`). `amata` → *bất tử* (206/220 khoá). `mahārāja` → *này Đại vương*: đếm
  trên 1.390 lần *này Đại vương* so với 737 *tâu đại vương* ở các bài `mil` khác. `parisā` → *hội
  chúng* (bản cũ *đại chúng*; tiền lệ `mil2:64.1`, `mil2:73.3`, `ja534:50.3`). `pariḷāha` → *cơn nóng bức*. `assatarī` → *con la cái*
  (`ja546:12.2` *xe do la kéo*). Tiền lệ trùng nguyên văn: 1.1 (Pāli trùng `mil5.3.8:1.1`) tôi
  bỏ chữ *từng* vì `bhaṇatha` là hiện tại; `1.7` (trùng `mil5.1.9:1.8`, `mil5.2.2:1.7`,
  `mil5.3.8:1.7`, 4 bản khác nhau) lấy dạng `mil5.1.8:3.3` *cũng đã đến với ngài, ngài phải giải
  quyết*; `3.4`, `10.2`, `10.6`, `10.9` giữ nguyên (tiền lệ trùng áp đảo). Cặp Pāli trùng
  **trong chính bài**: 4 cặp (`4.2/4.5`, `8.2/9.2`, `10.2/10.6`, `10.3/10.7`), 0 cặp bản Việt khác.

  **Bài giải quyết blocker.** Blocker 1 (không có bản Anh `mil` trong tầng đã ghim) là sự thật
  về upstream — giữ nguyên, thuộc phạm vi waiver của người biên tập. Blocker 2 (tầng Việt hiện
  hành chỉ có Pháp Cú) chỉ là giới hạn tham chiếu, không phải lỗi văn bản: đã gỡ; bài không có bản
  Hòa thượng Thích Minh Châu để đối chiếu và `triangulation` giữ 7.5 (≤ 8.0). Số đếm: 46 khoá
  Pāli, 46 khoá Việt, mẫu số Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) là 35; Sujato phủ 0/35 vì tầng đã ghim không có `mil`.

  **Bất định còn lại (không thêm vào thân kinh).**
  - `adhikāro tesaṁ nāsanāya` (`3.3`, `3.5`): *người chịu trách nhiệm* là cách đọc theo mạch
    cáo buộc và ví dụ con rắn; `adhikāra` còn nghĩa *việc/phận sự*, chưa phân xử tuyệt đối.
  - `dhammayantamabhipīḷayati` (`6.2`): đối cách `dhammayanta` với động từ `abhipīḷayati`; dịch
    sát *ép cỗ máy Pháp*, hiểu như vận hành cỗ máy để ép (ví dụ `6.1`); chưa có tiền lệ.
  - `madhukaṁ` (`4.3`) giữ nguyên tên cây; `attajena` (`8.1`) hiểu là *cái do mình sinh ra*
    (quả/bào thai) theo ví dụ chuối-tre-la cái nổi tiếng nhưng Pāli ở đây không nói rõ quả hay con.
  - `amata` ở `10.1` nói về thứ được *ăn* (`asitvā`) nên dịch *thứ bất tử*; chưa có tiền lệ.
