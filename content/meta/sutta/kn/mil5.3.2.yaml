notes: |-
  **Đo lại ba mệnh đề.** `0.1` Pāli `Milindapañha` → giữ Pāli: 190/201 bài `mil`
  giữ Pāli, 8 dùng *Mi-lan-đà Vấn Đạo*, 3 dùng *Mi-tiên Vấn Đáp*; theo đa số, giữ Pāli.
  `0.2` Pāli `Meṇḍakapañha` → giữ Pāli: 22/32 (4 *Câu Hỏi Nan Đề*, 2 *Những Câu Hỏi Hóc
  Búa*, 2 *Những Câu Hỏi Lưỡng Đao*, 2 *Phẩm Meṇḍakapañha*); theo đa số, giữ Pāli, và
  khớp tuyệt đối với `mil5.3.8`. `0.3` Pāli `Paṇāmitavagga ` → 6 tệp `mil5.3.*` có đúng
  Pāli này đều dùng **Paṇāmitavagga** (mil5.3.1/.4/.5/.8/.10/.11); hai tệp lạ là
  *Phẩm Đuổi Đi* (mil5.3.9/.12). Theo luật trùng nguyên văn, tôi dùng **Paṇāmitavagga**
  — không thêm cách thứ N+1.

  **Tiều lệ trùng nguyên văn, đã dùng lại.** 9 khoá trùng Pāli ở bài khác của tầng:
  `0.1`←`mil7.7.8:0.1`, `0.2`←`mil5.3.8:0.2`, `0.3`←`mil5.3.1:0.3`, `1.1`←`mil5.3.8:1.1`
  (theo đó `tumhe` là số nhiều nên tôi dịch *chính các ngài đã nói*),
  `1.7`←`mil5.3.8:1.7` (*Câu hỏi hai đầu này đã đến với ngài, xin ngài hãy giải quyết*),
  `3.4`←`mil6.2.3:1.4` (*Vâng, này Đại vương*), `10.2` và `10.6`←`mil3.5.1:1.8`,
  `10.9`←`mil5.3.8:8.4`.

  **`”ti.` — đo rồi mới chọn.** Trong tầng `mil`, khoá Pāli kết bằng `”ti.` mà bản Việt
  **giữ nguyên** `”ti.` là 397, chỉ để `”.` là 188, còn lại 220 viết kiểu khác. Tôi giữ
  `”ti.` ở mọi khoá kết thúc bằng nó. Trong hai chỗ này tôi **lệch khỏi tiền lệ** và nói
  rõ: `1.7` và `10.9` có Pāli trùng nguyên văn với `mil5.3.8:1.7` và `mil5.3.8:8.4`, mà
  hai tệp ấy lại bỏ `ti`; tôi lấy nguyên văn chữ nghĩa của chúng nhưng thêm lại `ti` cho
  khớp đa số tầng và khớp Pāli. Với dấu nháy cong trích lời nói **bên trong** câu thì ngược
  lại, tôi **bỏ** `ti`, đúng như quy ước đã có: `mil3.1.13:2.3` Pāli `…ariyo aṭṭhaṅgikaṃ
  maggaṃ”ti` → bản Việt kết `…giải thoát’.`, và `mil3.1.10:2.5` Pāli `‘pivatu, deva,
  pānīyan’ti` → `‘Tâu bệ hạ, xin bệ hạ dùng nước!’`.

  **`bhante` / `mahārāja` — đo cả hai mặt rồi mới chọn, và chọn theo dạng Pāli.**
  - Toàn tầng `mil` (531 khoá Pāli có `bhante`): *tôn giả* 360 lần, *ngài* 198, *Đại đức* 28.
  - Chỉ trong cặp Pāli trùng nguyên văn của bài này (152 cặp): *tôn giả* 88, *ngài* 48,
    *Đại đức* 12.
  - Tách theo dạng: Pāli chỉ có `bhante` (không kèm tên) → toàn tầng 301 khoá: *tôn giả*
    236 vs *ngài* 66; lát này 90 cặp trùng: *tôn giả* 76 vs *ngài* 8 → **bạch tôn giả /
    thưa tôn giả**. Pāli `bhante nāgasena` → toàn tầng 230 khoá: *ngài* 132 vs *tôn giả*
    124 (gần như ngang); lát này 62 cặp trùng: *ngài* 40 vs *tôn giả* 12 → **bạch ngài
    Nāgasena / thưa ngài Nāgasena**. Cả hai số đều ghi ở đây để người điều phối thấy.
  - `mahārāja`: toàn tầng `mil` 1389 khoá Pāli có `mahārāja`, đếm **theo lần xuất hiện**
    thì *Đại vương* (hoa) 886 vs *đại vương* (thường) 442 → theo đa số, **Đại vương**.
    Riêng bài này: 39 khoá có `mahārāja`, đem đối chiếu chỉ số trùng nguyên văn thì **0
    cặp trùng** (mọi câu ấy đều dài và đặc thù), nên không có tiền lệ trùng để dùng
    lại; tôi theo đa số toàn tầng. `mahārājā` ở `3.4` là số nhiều nhưng vẫn là cách gọi
    thẳng vua, nên theo tiền lệ trùng nguyên văn `mil6.2.3:1.4`.

  **Thuật ngữ — tiền lệ đếm được trong chính tầng Việt.**
  `tathāgato` → *Như Lai* (74 khoá `mil`); `bhagavato` → *Đức Thế Tôn* (27 khoá);
  `tacchako` → *người thợ mộc*, `tacchati` → *đẽo gọt* (theo `mil7.7.10:1.2`
  *như người thợ mộc theo đúng đường dây mực đen mà đẽo gọt thân cây*); `kassako` →
  *nông dân* (theo `mil3.2.2:2.2`); `dhammapariyāya` → *bài pháp giảng về* (theo
  `cnd3:1.4`, `cp35:18.1`, `mil5.4.4:1.1`).

  **Chỗ tôi cố ý lệch tiền lệ, và vì sao — để người biên tập biết cần gộp.**
  `anunayappaṭigha`: tầng hiện dùng *giận dữ hay thương mến* (`mil5.3.12:2.4–2.5`), dịch
  `anunaya` thành *thương mến*. Pāli `anunaya` ở đây mang tiền tố phủ định `a-`, tức là
  **không được lòng / không vừa ý**, cộng `paṭigha` = chống đối, khó chịu. Tôi dịch *bực
  bội hay khó chịu* (và *vượt khỏi bực bội và khó chịu* cho `vippamutta`). Tệp
  `mil5.3.12` thuộc lát khác nên tôi không sửa; nếu biên tập đồng ý thì cần sửa cả hai.
  `micchāpaṭipanna` → *đi lệch* (khớp `mil5.5.8:12.1` *đi lệch phải*), và
  `sammāpaṭipanna` → *đi đúng đường* để thành cặp đối xứng; `sammāpaṭipanna` có 0 tiền lệ
  nên đây là cặp do tôi đặt.

  **Bốn từ 0 tiền lệ, đã ghi cách chọn.**
  - `uṇhaṁ lohitaṁ mukhato uggata` (0 tiền lệ): tôi dịch *khói đỏ như máu từ miệng
    trào ra*. `uṇha` = khói, `lohita` = đỏ như máu, `mukhato uggata` = từ miệng trào ra.
    Dùng **nguyên văn một cụm** ở cả 14 khoá có nó, kể cả `2.1` và `9.3` nơi phải phủ
    định, để câu không lệch nghĩa.
  - `amata` (0 tiền lệ) → *vị bất tử*; `dhammāmatena` → *vị bất tử của Pháp*.
  - `sattā bhabbā / abhabbā` (0 tiền lệ) → *có khả năng / không có khả năng*.
  - `patanti` → *rơi lạc* (đối xứng với `buddhanti` = *giác ngộ*); đây là lựa chọn của tôi.

  **Dấu lược:** 0/46 khoá có `…pe…`; bản Việt không có dấu lược nào. Nháy kép mở/đóng đúng
  theo từng vị trí trong Pāli, kể cả khối `7.4 → 10.1` là một lời thoại liên tục qua bốn
  khoá không dấu nháy (`8.1, 8.2, 9.1–9.3`), và `10.7` mở nháy mới sau khi `10.6` đã
  đóng.

  **Triangulation:** không có tầng Anh đã ghim cho `mil` (xem blocker) nên bài chỉ dịch từ
  Pāli đã ghim cùng commit (`11c9d708978cde8ba61096d8a75f7ddfb846f639`) cùng tiền lệ đếm
  được trong chính tầng Việt dự án. Không chạy được `npm run validate|test|check|build`
  theo lệnh phân công đợt này, nên technical_integrity là 9.6.