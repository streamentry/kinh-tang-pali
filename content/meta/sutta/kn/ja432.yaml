notes:
  - >-
    **BLOCKER 1: không có tầng Anh nào để đối chiếu.** Tầng `english-sujato` chỉ có **83** tệp trong `translation/en/sujato/sutta/kn/ja/` và `ja432` không có trong số đó (`find .cache/upstream -name '*ja432*'` chỉ trả về đúng tệp Pāli root). Không có tầng Việt hiện hành cho Khuddaka Nikāya. **Toàn bộ 49 khoá dịch từ Pāli một mình**, `triangulation` chỉ 7,8.
  - >-
    **BLOCKER 2: một số câu không có gì để đối chiếu.** Đo lại bằng công thức của `src/lib/canon/reference.ts`: `substantiveSegments = 0` (cả 49 khoá Pāli ngắn hơn 40 ký tự, dài nhất là `:12.1` với 34 ký tự), nên `ratio` bị coi là 1 và bài **qua cổng coverage một cách rỗng** — cổng không phát hiện được việc tầng Anh vắng hẳn ở một bài ngự ngâm.
  - >-
    **PHÁT HIỆN QUAN TRỌNG KHI DỊCH: ba khoá của bài này trùng NGUYÊN VĂN với `ja36` (Sakuṇajātaka).** Chạy `_c80_dup.py` ở chế độ *chính xác* cho thấy `ja432:7.2` = `ja36:1.2` (`svāyaṁ aggiṁ pamuñcati;`), `ja432:7.3` = `ja36:1.3` (`Disā bhajatha vakkaṅgā,`) và `ja432:11.4` = `ja36:1.4` (`jātaṁ saraṇato bhayan”ti.`) — nghĩa là Padakusalamāṇavajātaka chính là những bài kệ rút từ Sakuṇajātaka. Nhưng **bản Việt của `ja36` dịch sai hai chỗ**: `:1.3` `Disā bhajatha vakkaṅgā` bị dịch thành *Hãy chạy sang bên kia, hỡi những kẻ có cánh* — `vakkaṅga` là **người khách / người lạ**, không phải `pattaṅga` (kẻ có cánh); và `:1.4` bị dịch thành *nơi cây saraṇa đã mọc lên, hãy tránh mối nguy* — sai cấu trúc, vì `jātaṁ` là "sinh ra" (ngôi 3) chứ không phải "mọc lên". Ở đây tôi dịch đúng Pāli: *Hãy chia làm hai, hỡi những vị khách,* và câu điệu dùng lại nguyên văn `ja157:1.4`. **`ja36` không thuộc lát của tôi nên tôi KHÔNG sửa nó**; người biên tập nên xử lý riêng.
  - >-
    **Câu điệu lặp y hệt, giữ y hệt.** `jātaṁ saraṇato bhayaṁ` xuất hiện y hệt ở `:2.4 :3.4 :4.4 :5.4 :6.4 :7.4 :8.4 :9.4 :11.4` (9 lần) và bản Việt dùng lại **nguyên văn** của `ja157:1.4` — *sinh ra làm nơi nương tựa và làm nỗi sợ hãi*. Đây là repetition mang chức năng của Pāli, không phải điền bằng khuôn.
  - >-
    **Cấu trúc nháy kép: mười khối lời thoại riêng biệt, đếm được.** Pāli mở `“` ở đúng 10 khoá (`:1.1 :2.1 :3.1 :4.1 :5.1 :6.1 :7.1 :8.1 :9.1 :10.1`) và đóng `”` ở đúng 10 khoá (`:1.4 :2.4 :3.4 :4.4 :5.4 :6.4 :7.4 :8.4 :9.4 :11.4`). Khối cuối dài bất thường 7 khoá (`:10.1`–`:11.4`) vì Pāli ngắt đoạn ở `:10.4` bằng dấu chấm chứ không đóng nháy; bản Việt giữ nguyên vị trí này. Cơ chốt `_hvi.py` xác nhận ngoặc kép cân trên cả bài.
  - >-
    **BẤT ĐỊNH TỪNG CHỖ, KHÔNG GIẤU — bảy chỗ.** (a) `:1.1` `Bahussutaṁ cittakathiṁ` dịch *Câu chuyện về tâm mà ta đã học nhiều*; câu này mở bài nhưng không rõ là ai nói với ai, và `gaṅgā vahati pāṭaliṁ` (`:1.2`) — *sông Hằng đang trôi hoa pāṭali* — có vẻ là hình ảnh so sánh chứ không phải mệnh đề tiếp. (b) `:1.3` `Vuyhamānaka bhaddante` là **số ít gọi số nhiều** ("hỡi mấy vị"), dịch *Hỡi mấy vị lành dữ*; tôi đã sửa một lượt từ *Hỡi mấy vị lành, lành dữ* vì lặp chữ. (c) `:3.2` `sattā yattha patiṭṭhitā` — **con số bảy không có danh sách đi kèm** trong Pāli, dịch *có bảy thứ ở đó dựng lên* và không tự bịa bảy thứ đó là gì. (d) `:4.2` `sītaṁ yena vihaññati` dịch *lại chịu lạnh khắc khao thế*; `sīta` có thể là "lạnh" hoặc "sự mát mẻ", không có bản Anh để chọn. (e) `:7.1` `Yaṁ nissitā jagatiruhaṁ` **bất định cú pháp**: `Yaṁ` và `jagatiruhaṁ` đều là cách ngữ, còn `nissitā` là tân ngữ, nên không dịch được thành một mệnh đề trọn vẹn; tôi dịch *Bà con đã nương vào bậc sinh ở đời này* để giữ cả hai bên. (f) `:8.1` `Yamānayiṁ somanassaṁ` dịch *Bà con dẫn dắt tâm hòa nhã* — `soma` là mặt trăng, ở đây là ẩn dụ cho sự an tịnh, không dịch là "trăng" để tránh câu vô nghĩa. (g) `:11.2` `purohita` dịch *tế sư*; kho có `purohitaputta` → *Con Trai Vị Tế Sư* (thag6.9:6.5) nhưng không có bản dịch trực tiếp cho `purohita`.
  - >-
    **Thuật ngữ, có số đếm.** `0.1` `Jātaka` giữ Pāli (417/443 tệp ja). `0.2` `Navakanipāta` → *Bộ Chín Bài Kệ* (11/11 trong các tệp cùng Bộ Chín). `0.3` `Gijjhavagga` → *Phẩm Hươu* (11/11). `0.4` và `12.1` theo khuôn bài anh em cùng phẩm: ja429 *3. Kinh Xoài Lớn* / *Kinh Xoài Lớn thứ ba.*; ja431 *5. Kinh Haritaca* / *Kinh Haritaca, thứ năm.*; ja433 *7. Kinh Lomasakassapa*; ja435 *9. Kinh Haliddirāga*; ja436 *10. Kinh Samugga*. Trong thân bài: `pāṭali` → *hoa pāṭali* (3 tiền lệ trong kho) · `gandhamādana` → *thơm* · `canda` → *cây sành* · `Rāhu` giữ Pāli (240 lần) · `puthū` → *hàng trăm* (44 lần) · `vilump` → *phá hoại* (66 lần) · `brāhmaṇakhattiya` → *Bà-la-môn Sát-đế-lỵ* (`brāhmaṇa` 2905 lần, `khattiya` → *Sát-đế-lỵ* 153 lần).
