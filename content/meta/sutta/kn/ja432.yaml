notes:
  - >-
    **BLOCKER 1 (giữ nguyên): không có tầng Anh nào để đối chiếu.** Tầng
    `english-sujato` chỉ có **83** tệp trong
    `translation/en/sujato/sutta/kn/ja/` và `ja432` không có trong số đó. Không
    có tầng Việt hiện hành cho Khuddaka Nikāya. Bản dịch đi từ Pāli một mình,
    đối chiếu thêm bằng bài song song `ja36` (có Sujato) và `ja157`; vì vậy
    `triangulation` chỉ 7,8.
  - >-
    **Coverage Anh đo rỗng, không phải đạt.** Cả 49 khoá Pāli ngắn hơn 40 ký tự
    (dài nhất là `:12.1`, 34 ký tự), mẫu số `substantiveSegments = 0`, nên cổng
    coverage không đo được gì. Không có đoạn Sujato "để trống" nào để ghi nhận
    gap.
  - >-
    **Cấu trúc nháy kép (còn đúng).** Pāli mở `“` ở đúng 10 khoá (`:1.1 :2.1
    :3.1 :4.1 :5.1 :6.1 :7.1 :8.1 :9.1 :10.1`) và đóng `”` ở đúng 10 khoá (`:1.4
    … :9.4 :11.4`). Khối cuối dài bất thường 7 khoá (`:10.1`–`:11.4`) vì Pāli
    ngắt đoạn ở `:10.4` bằng dấu chấm; bản Việt giữ nguyên vị trí này.
  - >-
    **Giải quyết draft 2026-10-12 — kiểm toán độc lập, thay thế các ghi chú cũ
    (2026-10-05) về `ja36`, câu điệp, bảy bất định và thuật ngữ.** Bản cũ có lỗi
    nghĩa thật ở **đa số khoá thân kinh (khối 2–11, 40 khoá)** do đọc sai cấu
    trúc, nên mọi mục cũ đó bị gỡ và thay bằng mục này. (1) **Câu điệp `jātaṁ
    saraṇato bhayaṁ` (9 lần: `:2.4 … :9.4`, `:11.4`)**: `saraṇato` là ablative
    "từ chỗ nương tựa", `jātaṁ` là "đã sinh"; bản cũ dịch *sinh ra làm nơi nương
    tựa và làm nỗi sợ hãi* là sai cấu trúc và cũng không khớp `ja157:1.4`. Nay
    dùng lại nguyên văn `ja157:1.4` — *hiểm họa đã sinh từ chỗ nương tựa* — và
    khớp Sujato `ja36:1.4` ("The threat is born from the refuge!"). Cũng đổi
    `bhaya` ở `:10.4` thành *hiểm họa* cho nhất quán. (2) **Bản cũ sai ngữ pháp
    ở các mệnh đề quan hệ `yena…`/`yattha…`/`yaṁ…`**: `:2.1–2.2` là "cái mà
    người ta rưới lên kẻ khổ đau/người bệnh" (bản cũ dịch thành câu hỏi, lại
    thiếu `tassa` → *giữa nó*); `:3.2` `sattā` là *chúng sinh* (nominative số
    nhiều của `satta`), **không phải số bảy** — bản cũ *"có bảy thứ"* là sai;
    `:3.3` `sīsaṁ` là *đầu*, không phải "màng não"; `:4.2` `sītaṁ yena
    vihaññati` là *cái lạnh bị đẩy lùi* (`sīta` là chủ ngữ bị động), bản cũ
    *"lại chịu lạnh khắc khao"* sai; `:4.3` `gattāni` là *thân thể*, không phải
    "cắn rách"; `:5.1–5.3` `puthū` là *nhiều* (nominative số nhiều bổ nghĩa
    `brāhmaṇakhattiyā`), không phải "hàng trăm", và `yāpenti` là *nuôi sống
    mình* chứ không phải "đi tới"; `:6.2` `paṇḍitā` là chủ ngữ của `icchanti`;
    `:7.1` `jagatiruha` là *cây* (mọc trên đất), bản cũ "bậc sinh ở đời này"
    sai, và `:7.3` `vakkaṅgā` là *những kẻ thân cong* (loài chim; Sujato
    `ja36:1.3` dịch "Geese!") — **không phải "khách" như ghi chú cũ nói**; dùng
    đúng tiền lệ `ja430:6.3`, `ja533:71.3`, `ja534:18.1`; `:8.1–8.2` `Yaṁ ānayiṁ
    … māliniṁ candanussadaṁ` là người nữ được dẫn về *đeo vòng hoa, xức đầy
    chiên-đàn* (không phải "vòng hoa thơm như gỗ đàn hương"), `Sā` là *nàng ấy*;
    `:9.1–9.2` là *người mà vì sinh ra mà tôi hoan hỷ, tôi từng mong cho được
    hưng thịnh* (bản cũ biến thành câu hỏi); `:10.3–10.4` `yato … tato` là *chỗ
    nào … chỗ ấy*; `:11.2` `brāhmaṇo ca purohito` là *vị Bà-la-môn tế sư* (cùng
    bị nói tới như vua), bản cũ *"người Bà-la-môn thì làm tế sư"* sai. (3) **Đại
    từ xưng hô thống nhất**: người nói trong khối 2–11 là một người, xưng *tôi*;
    người hỏi ở `:1.x` gọi *ông*, bản cũ trộn *ta* và *tôi*. (4) **Phẩm**:
    `:0.3` `Gijjhavagga` là *Phẩm Kền Kền* (đã sửa ở `ja428`, `ja430`), không
    phải *Phẩm Hươu*. (5) **Tiêu đề**: `Padakusalamāṇavajātaka` → *Kinh Thanh
    Niên Padakusala* theo khuôn `māṇava` → *Thanh Niên* (`cnd5`–`cnd20`,
    `vv53`); `translationTitle` khớp `:0.4`.
  - >-
    **Bài song song `ja36` — chỉ báo, không sửa (ngoài tệp của lát).** `ja36` và
    `ja432` trùng nguyên văn `svāyaṁ aggiṁ pamuñcati` / `Disā bhajatha vakkaṅgā`
    / `jātaṁ saraṇato bhayaṁ`, nhưng bản Việt `ja36:1.4` (*nơi cây saraṇa đã mọc
    lên, hãy tránh mối nguy*) và `ja36:1.1` (*cây đại thụ của thế giới ấy*) vẫn
    sai cấu trúc như bản cũ của bài này; `ja36:1.3` *những kẻ có cánh* chấp nhận
    được nhưng khác `kẻ thân cong`. Người biên tập nên xử lý `ja36` riêng.
  - >-
    **Bất định còn lại (ghi trong notes, không nhồi vào thân kinh).** (a) `:1.2`
    `pāṭaliṁ` đọc là tên/biệt danh người bị sông cuốn đi (`bahussutaṁ
    cittakathiṁ` là hai tính từ đứng trước), không phải cây hay hoa; không có
    bản Anh hay bài song song để xác nhận, và không rõ ai là người được hỏi kệ
    (Pāṭali tự nói khối 2–9, hay người khác). Đọc theo ngữ pháp là chắc, còn
    việc gán nhân vật là suy đoán nhẹ. (b) `:9.2` `bhavamicchisaṁ` dịch *mong
    cho được hưng thịnh* (`bhava` = sự hiện hữu/hưng thịnh); nghĩa khác khả dĩ:
    "mong cho tồn tại/sống lâu". (c) `:8.1` `somanassaṁ` đọc là trạng thái
    "trong niềm hoan hỷ" của người nói. (d) `:10.3` `yatodakaṁ tadādittaṁ`: đọc
    `yato … tato/tad` là chỗ-nơi (*chỗ nào có nước, chỗ ấy cháy bùng*); khả dĩ
    khác là "từ nước mà có lửa". (e) `:7.1` chủ ngữ của `nissitā` được đọc là
    các loài chim được gọi ở `:7.3`, không thêm đại từ vào bản Việt. Các chỗ này
    không làm đổi nghĩa chính của bài (một chuỗi các điều từng là chỗ nương tựa
    nay thành hiểm họa: nước, đất, lửa, thức ăn, gió, cây, vợ, con), nên không
    còn coi là blocker lỗi văn bản.
  - >-
    **Thuật ngữ, có đối chiếu.** `cittakathī` → *thuyết giảng vi diệu* (22 khoá
    có `cittakath` trong tầng; `sn9.4:2.3` *thuyết giảng vi diệu*) · `bahussuta`
    → *nghe nhiều* · `candana` → *chiên-đàn* (95 khoá toàn tầng, 38 trong `ja`,
    so với *đàn hương* 53 / 17; dùng cho vật xức) · `purohita` → *tế sư* (7
    trong `ja`, `dn5` cũng *tế sư*) · `negamā`/`jānapadā` → *dân thị thành*/*dân
    miền quê* · `vilumpati` → *cướp phá* (`mn128:6.27` *cướp phá quốc gia*) ·
    `puthū` → *nhiều* · `Jātaka`, `Navakanipāta` → *Bộ Chín Bài Kệ* (11/11 tệp
    cùng bộ).
  - >-
    **technical_integrity = 9,6 là điểm tạm.** Chưa chạy bốn cổng của kho trong
    lượt này: `npm run validate` · `npm test` · `npm run check` · `npm run
    build`. Cần chạy trước khi đổi trạng thái.
  - >-
    Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công
    cụ) dịch lại bài từ Pāli, không xem bản dự án; so 15 khoá chênh lệch lớn
    nhất (trong 49 khoá; 34 khoá còn lại hầu như trùng ý) → khác nghĩa 1
    (`7.3`): sửa 0, giữ 15, bất định 3 (`1.2`, `7.3`, `9.2`). Giữ: `7.3`
    `vakkaṅgā` — bản mù *hỡi loài chim* (có `⟦?⟧`), bản dự án *những kẻ thân
    cong*; đây là cùng một nhận diện từ vựng nhưng bản dự án giữ cách dịch đồng
    nhất toàn tầng (`ja36:1.3`, `ja430`, `ja502:1.2`, 17 khoá). `9.2` `yassa ca
    bhavamicchisaṁ` — bản mù *đã mong nó hiện hữu*, bản dự án *mong cho người
    nào được hưng thịnh* (`sn7.14:2.2` dịch *mong chúng tốt lành*), cùng hướng.
    `1.2` `pāṭaliṁ` — bản mù cũng không chắc; cả hai đọc là tên người bị sông
    cuốn đi. `7.1` bản mù thêm *chúng ta* mà Pāli (`nissitā`, nguyên cách số
    nhiều, không đại từ) không có.
    `1.1`/`4.1`/`4.2`/`5.1`/`9.1`/`10.3`/`10.4`/`11.2`/`3.1`/`3.3` chỉ khác diễn
    đạt (*cái mà nhờ nó cơm được nấu chín* ↔ *thứ làm chín cơm*; *tế sư* ↔ *quốc
    sư*, 7 khoá `ja` đã đếm). `0.2` *Bộ Chín Bài Kệ* ↔ *Chương Chín* theo tiền
    lệ nipāta của tầng. Bất định: (1) người nói ở khối 2–9 là Pāṭali hay người
    khác; (2) `bhavamicchisaṁ` *hưng thịnh* hay *tồn tại*; (3) `Yatodakaṁ
    tadādittaṁ` đọc *chỗ nào có nước, chỗ ấy cháy*; khả dĩ khác *từ nước mà có
    lửa*. Không có bản Anh hay bản Việt độc lập khác.
