notes: |-
  `Koṭasimbalijātaka`, bài thứ bảy của `Gandhāravagga` trong `Sattakanipāta`. 35 khoá, tất cả đã dịch. TẦNG THAM KHẢO — đo, không đoán. 0/7 bài `kn` của lát này có bản Anh Sujato tại commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud` (đếm trực tiếp trên đĩa: cp 35, dhp 26, iti 11, ja 83, kp 9, snp 5, thag 264, thig 73, ud 8 tệp) — **không có `mil`**, và `ja374/376/407/412` không nằm trong 83 tệp `ja` ấy. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit đã ghim có đúng 26 tệp và tất cả đều là `dhp*` (Pháp Cú). Lớp lấp `english-project` của dự án không có uid nào trong lát. Ba tầng tham khảo đều vắng ⇒ bài dịch chỉ từ Pāli root ⇒ blocker thật, và đây là **giới hạn upstream**, không phải lỗi của người dịch. Vì vậy `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng để né blocker, và `status` là `draft` vì `scripts/validate.ts` coi tệp Anh thiếu là **error** khi status là `review` hoặc `published`.

  TÊN BÀI VÀ TÊN PHẨM — theo bầy lân cận, đếm được: `Sattakanipāta` → *Bộ Bảy Bài Kệ*; `Gandhāravagga` → *Phẩm Gandhāra*; `0.1` → *Jātaka*; `0.4`/`8.1` giữ Pāli `Koṭasimbalī` theo mẫu `1. Kinh Gandhāra` của `ja406`.

  BỐN CÂU KỆ CUỐI DÙNG LẠI NGUYÊN VĂN, ĐẾM ĐƯỢC 5/7 khoá có Pāli trùng. `Saṅkeyya saṅkitabbāni / rakkheyyānāgataṁ bhayaṁ / Anāgatabhayā dhīro / ubho loke avekkhatī”ti.` trùng nguyên văn ở `ja311:4.1`–`4.4` và lấy **y hệt** (kể cả dấu câu): *Nên đề phòng những điều đáng ngờ vực, / cần phải gìn giữ trước những hiểm họa chưa đến; / Bậc trí giả nhìn thấy nỗi sợ hãi trong tương lai, / nên quan sát và suy xét cả hai thế giới”ti.* Hai khoá đó lệch **chỉ ở dấu nháy**: ở đây `7.1`–`7.3` là trích dẫn lồng trong lời của con đại voi nên dùng `‘’`, vì lời ngoài đã mở ở `3.1` và chỉ đóng ở `7.4` (`”ti.`) — nếu dùng `“` thì bài mất cân.

  VÀI CHỖ CỐT BÀI ĐỌC LẠI. `1.1` `Ahaṁ dasasataṁbyāmaṁ` — `byāma` là **hạt** (con), không phải *đem rắc*; dịch *Tôi đã gom một trăm hạt,* (bản nháp đầu tiên ghi *đem rắc*). `2.2` `Appamaṁsataraṁ mayā` đọc là *của ta cũng còn hơn cái giường ấy trăm lần*; `6.1`–`6.2` `Ajjhārūhābhivaḍḍhanti, brahantampi vanappatiṁ` là *Chúng mọc lên méo mó, dù to lớn và lan như rừng cây* — bản nháp đầu tiên ghi *chẳng mấy / cây vỏ rộng bao la*, vừa thừa vừa lệch, đã sửa trong review đối kháng.

  `pilakkhudumbara` ở `3.4` giữ Pāli làm *cây pīlu* vì không có tiền lệ Việt; không tự đặt tên cây khác.

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó — BRIEF cấm `npm run validate|test|build|check` trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6** vì mọi chốt tự động của `_hvi.kiểm` đã xanh (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên văn Pāli, không lọt Pāli, khớp số dấu lược) và 35/35 khoá của chính bài này; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.

  Sửa lan 2026-10-13 (accuracy fix; 1.1–2.4, 4.1–4.4, 6.1–6.4, 7.1–7.4 đổi; 3.x, 5.x, 0.x, 8.1 giữ nguyên). Mục này THAY «VÀI CHỖ CỐT BÀI ĐỌC LẠI» và «byāma là hạt» ở trên (sai), và phần nói ‘ ’ ở 7.1–7.3. Trước → sau: 1.1–1.4 «Tôi đã gom một trăm hạt, / nắm từ dưới đất lên; / Còn cái giường, tấm nệm lớn ấy, / ngươi đã không chịu nâng đỡ» → «Tôi đã bắt con rắn dài một ngàn sải, / mang theo nó mà đến; / cả nó lẫn tôi, thân hình to lớn, / ngươi chịu đỡ mà không rung chuyển» (uraga = rắn, dasasata = 10 × 100 = 1.000, byāma = sải như bv11:27.1 «một sải»; dhārayaṁ nappavedhasi = chịu đỡ mà không rung chuyển; không có «hạt», «giường», «nệm»); 2.1–2.4 «Dù là tấm chiếu nhỏ nhất, / của ta cũng còn hơn cái giường ấy trăm lần; / Vì không chịu nâng đỡ, ngươi kinh hãi, / vì sao lại là Koṭasimbalī?» → «Nhưng con chim nhỏ này, / ít thịt hơn tôi; / ngươi chịu đỡ mà run sợ, hoảng hốt, / vì sao vậy, hỡi Koṭasimbalī?» (pakkhiṁ khuddakaṁ = con chim nhỏ; appamaṁsataraṁ = ít thịt hơn; Koṭasimbalī là lời gọi vị thần cây (bản Anh dịch cotton-tree), giữ nguyên); 4.1–4.4 «Những cây ấy không mọc lên được, / dù đã ra rễ từ chỗ ta trồng; Chúng lại che kín ta, / và biến ta thành không còn gì» → «Những cây ấy mọc lên, / sinh ra nơi kín gió bên cạnh ta; / chúng sẽ quấn chặt lấy ta, / và biến ta thành kẻ không còn là cây» (saṁvirūhanti = mọc lên, không phải «không mọc được»; nivātajā = sinh nơi kín gió; arukkhaṁ = không còn là cây); 6.1–6.4 «Chúng mọc lên méo mó, / dù to lớn và lan như rừng cây; Nên, ông vua, xin hãy răn đe, / hãy nghĩ đến hiểm họa ập đến» → «Loài mọc trùm lên cứ lớn dần, / phủ lên cả cây rừng to lớn; / Vì vậy, tâu vua, tôi rung chuyển, / vì thấy trước hiểm họa chưa đến» (ajjhārūhā = loài mọc trùm lên; pavedhāmi = tôi rung chuyển, không phải «xin hãy răn đe»; sampassaṁ = vì thấy trước); 7.1–7.4 đổi dấu nháy đơn ‘ ’ → “ ” để khớp Pāli từng khoá (Pāli 6.4 đã đóng nháy, 7.1 mở lại), và để khớp ja311:4.1–4.4 (Pāli trùng byte-for-byte). Ai nói với ai suy từ truyện dẫn (bản Anh Jātaka tập III, Francis–Neil 1897, chỉ để biết người nói): 1–2 và 7 là lời vua loài chim lớn (bản Anh gọi là roc), 3–6 là lời thần cây. Số Pāli: dasasata = 1.000 (dasa 10 × sata 100); thig16.1:72.2 dùng đúng dạng này làm «một ngàn lần». Bất định: (a) mūlino khandhino dumā (5.2) và bījamāharitā hatā (5.4) giữ nguyên cách dịch cũ, chưa đọc lại; (b) anāgatabhayā (7.3) giữ cách đọc «nhìn thấy nỗi sợ hãi trong tương lai» như ja311:4.3, dạng ablative «vì hiểm họa chưa đến» cũng khả dĩ; (c) 3.1 «ông vua ơi» chưa chỉnh. Pāli trùng nội bộ: 0 cặp. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại; technical_integrity giữ nguyên.

