notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli và file en/sujato so git-hash với manifest và khớp. english-sujato CÓ mặt: 10/11 khoá có prose, khoá 2.1 để trống như ở mọi Jātaka.
  Tiền lệ có đếm: Kuruṅgavagga → Phẩm Nai Bốn Sừng (5 tệp: ja21–ja25); colophon không dấu phẩy, khớp cả 5 tệp cùng phẩm.
  Thuật ngữ: nandi là bò/bò cái, dịch Con Bò theo ja88 (Sārambhajātaka → Kinh Con Bò Sārambha); giữ Nandivisāla là tên riêng lấy nguyên văn từ tiêu đề Pāli. manuñña là dễ nghe/hoà thuận; kudācanaṁ là không bao giờ, nên 1.2 là không bao giờ nói lời khó nghe. 1.4 garuṁ bhāraṁ udaddhari có chủ ngữ là sự nặng nề, không phải người nói, nên dịch sẽ gánh trĩu nặng đi xa. Dhanañca naṁ alābhesi là được của cải, có 163 tiền lệ; tena cattamano ahū là thỏa mãn. Cả hai vế chủ động của Manuññameva bhāseyya và bhāsamānassa giữ nguyên.
  Sujato dịch 1.3–1.6 hơi lỏng (earning him money / and he was satisfied), tôi giữ đúng cú pháp Pāli với chủ ngữ bị động. Không có segment Pāli ≥ 40 ký tự nên sàn coverage không kích hoạt; không có bản Hòa thượng Thích Minh Châu ở commit đã ghim.
