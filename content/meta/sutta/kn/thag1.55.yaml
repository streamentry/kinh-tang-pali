notes: |-

  **Tầng Anh có mặt nhưng thiếu đúng một khoá.** 8/9 khoá có tiếng Anh Sujato tại commit đã ghim. Khoá thiếu là dòng kết *… X thero ….* (`:1.5`), vốn là dạng lược của công thức quy kết *Itthaṁ sudaṁ … gāthaṁ abhāsitthāti*. Tôi **không** mở rộng dòng kết: BRIEF_VI3 §10.1 nói thẳng *Pāli có dấu lược thì bản Việt giữ nguyên, không bao giờ mở rộng* — mở rộng là thêm chữ KHÔNG ĐÁNH DẤU, và đã có tiền lệ sai thật (ba ngọn lửa `rāgagginā…` bị nhân sang `sn35.29:1.15`). Tiền lệ có sẵn trên đĩa làm đúng như vậy và đã `published`: `thag1.42` là ngoại lệ ngược lại, tôi **không** theo. Số dấu lược của mọi khoá `:1.5` bằng Pāli (2 = 2). Không đối chiếu được tầng Việt hiện hành như đã nói ở trên.
  **Đặt kinh theo thứ tự khoá của lát này** (`0.1` = Theragāthā + số · `0.2` = Ekakanipāta · `0.3` = vagga · `0.4` = tên bài kệ) — cùng thứ tự với `thag1.42`, `thag1.107`, bài đã `published`. `Ekakanipāta` → *Bộ Một Bài Kinh* (159 lần trong tầng kn; chỉ `thag1.1:0.2` viết *Tập Một*). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>* (25 lần, so với 4 lần *Bài Kệ…*). `Theragāthā 1.N` giữ **số** như `thag1.42:0.1`. ở `:1.5` Pāli dùng dạng chủ cách (*Cittako*, *Suppiyo*, *Suyāmano*…); bản Việt dùng dạng gốc để thống nhất với tên bài kệ, đúng cách `thag1.113` (`Vanavaccho` → *Vanavaccha*), `thag1.34` (`Posiyo` → *Posiya*), `thag1.46` (`Samiddhitthero` → *Samiddhi*) đã làm.

  **Tên riêng giữ nguyên dạng Pāli** và đều xác minh được trong Pāli đã ghim (không phải đặt mới): Añjanavaniya, Vimalakoṇḍañña, Suyāmana, Cittaka, Suppiya, Sīha, Mettaji (giữ âm, dạng gốc). `lọt_pāli` trong `_hvi.py` chỉ quét khoá Pāli ≥ 40 ký tự mà mọi khoá của Theragāthā đều ngắn hơn, nên tên có dấu ở đây không bị chặn; tôi vẫn tra lại từng tên.
  **Hai khoá phải dùng lại nguyên văn — người điều phối cần đọc.** `:1.4` `kataṁ buddhassa sāsanan”ti.` là cùng một Pāli với `thag1.107:1.4`, `thag1.108:1.4`, `thag1.112:1.4`, `thag1.117:1.4`; bốn bản đó đều viết **`đã làm tròn lời dạy của Đức Phật”ti.`** (đúng như `TIEN_LE_PHAI.md` yêu cầu *một chữ cho cả 4 bài*) và `thag1.66:1.6` cũng vậy — tôi chép nguyên văn. `:1.3` `Tisso vijjā anuppattā,` trùng nguyên văn `thag1.66:1.5`, đã dịch *Tôi đã chứng ngộ tam-minh,* — tôi cũng chép nguyên văn đó, dù bản nháp đầu tôi định viết *ba thắng trí*. Lý do phải thống nhất: `thag1.117:1.3` có Pāli **khác** (`Tisso vijjā ajjhagamiṁ`) và đã được dịch *tôi đã chứng ngộ ba thắng trí* — nghĩa là chính kho đang phân biệt hai Pāli này, thì lúc `anuppattā` gặp lại thì bắt buộc dùng đúng cách của `anuppattā`.

  **Thuật ngữ, đếm được.** `kuṭikā` → *túp lều* (`sn1.19` `Kuṭikāsutta` → *Kinh Túp Lều*, `ud4.2` *chòi rừng*). `āsandi` → *chiếu lá* (tiền lệ `an3.63` *ghế dài*, `mn76` *chiếc cáng*; ở đây là chiếu ngồi trong rừng nên *chiếu lá* rõ hơn *ghế*). `ogayha añjanaṁ vanaṁ` → *bước vào rừng Añjana* (`ogayha` là dạng bị động của `ogahī`, tôi đổi sang chủ động cho kệ — ghi ra vì đó là chỗ duy nhất đổi trạng từ).

  **Bất định đã ghi.** `Āsandiṁ kuṭikaṁ katvā` là một danh từ kép (*āsandi* + *kuṭikā*); Sujato dịch *made a hut to live in*, tức coi là *túp lều*, và tôi theo hướng đó nhưng thêm *lá* vì `āsandā` là chiếu lá. Không có bản Việt nào trên đĩa cho cụm này. `Tisso` không có chủ ngữ trong câu nhưng cả bài là lời trưởng lão tự thuật (`Āsandiṁ … katvā`), nên *Tôi* ở 1.3 là chính ngữ cảnh, không phải thêm ý.**Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm — ở lát này chỉ 0/155 khoá Pāli đủ 40 ký tự, nên chốt tự kiểm 0% và assertion còn lại không tự chạy; phần tôi tự kiểm: 9/n khoá có mặt và không thừa khoá, đúng segment ID, mọi chuỗi NFC, không khoá rỗng, không khoá nội dung nào trùng nguyên văn Pāli, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài và không bao giờ âm, không còn `(…)`, không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (lát này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Theragāthā 1.N Aṅguttara Nikāya 11 không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.
