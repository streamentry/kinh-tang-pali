notes: |-
  Dịch từ Pāli root của tha-ap409 (167 khoá, đủ khoá và đúng thứ tự khoá như Pāli); không có bản Anh Sujato, không có bản Việt hiện hành phân đoạn, không có lớp lấp english-project. Mọi lựa chọn dựa vào Pāli, ngữ cảnh bài và tiền lệ đếm được trong tầng Việt của dự án (tha-ap). Status bắt buộc draft do blocker noEnglishEditionUpstream.

  Tên bài (:0.3): Pāli Hemakattheraapadāna không bắt đầu bằng số nên bản Việt không có số thứ tự; translationTitle bằng đúng giá trị khoá :0.3 (Ký Sự Về Trưởng Lão Hemaka). Đo kiểu tên trên 537 tệp tha-ap khác có :0.3: Tuyên Ngợ (chính tả đáng ngờ) 255, Tuyên Ngôn 138, Ký Sự 137, khác 7. Hai phạm vi cho hai đa số khác nhau: cửa sổ tha-ap380 đến tha-ap440 có Ký Sự 29, Tuyên Ngợ 14, Tuyên Ngôn 7, khác 1; trong phẩm Metteyya (tha-ap403, 404, 405, 406, 408) Ký Sự 5 trên 5; toàn tầng nghiêng về Tuyên Ngợ. Chọn Ký Sự theo phạm vi gần nhất và theo cùng phẩm, khớp với lời kết 43.1. Đề nghị người biên tập phán một lượt cho cả cuốn. Tên riêng Hemaka giữ dạng Pāli.

  :0.1 Therāpadāna giữ nguyên Pāli; :0.2 Metteyyavagga dịch Phẩm Metteyya theo 5 bài cùng phẩm đã dịch (tha-ap403, 404, 405, 406, 408).

  Số Pāli, tự tính: saṭṭhi 60 + sahassa 1000 = sáu mươi ngàn (25.1 voi, 27.1 ngựa, 29.1 cỗ xe, 31.1 bò cái); soḷasa 16 + sahassa = mười sáu ngàn (32.1 phụ nữ); sattasattati = satta 7 + sattati 70 = 77, bảy mươi bảy kiếp (20.1); pañcasattati = pañca 5 + sattati 70 = 75, bảy mươi lăm lần (20.3); dvattiṁsa = dvi 2 + tiṁsa 30 = 32, ba mươi hai lần (21.1; tiṁsa = ba mươi, đúng như dvattiṁsavaralakkhaṇa = ba mươi hai tướng); aṭṭhārasa 18 x sata 100 = 1800, một ngàn tám trăm kiếp (34.1, 14 khoá cùng Pāli dùng đúng số này); cakkavāḷasahassa = một ngàn vòng thế giới (6.3). Bài không có cụm Tiṁsakappasahassa nên không phải phân xử 3.000 hay 30.000 hay 300.000.

  Lời thọ ký tương lai (20 đến 22, 34 đến 36): kappasate ở 34.1 dịch Sau một ngàn tám trăm kiếp nữa theo tha-ap492:20.1 (cùng Pāli, cùng chức năng thọ ký Gotama) và tha-ap406:22.1; bhavissati, ramissati, karissati, lacchati dịch thì tương lai (sẽ).

  Dùng lại tiền lệ nguyên văn: trong 164 khoá nội dung (trừ :0.1, :0.2, :0.3) có 62 khoá Pāli trùng một khoá khác của tầng tha-ap; 59 khoá bản Việt dùng đúng chữ của tiền lệ (không kể hoa thường). 3 khoá khác, đều có lý do: 33.3 dịch Họ thay cho Chúng vì chủ ngữ là mười sáu ngàn phụ nữ (cùng Pāli với 30.3, nơi chủ ngữ là cỗ xe nên giữ Chúng); 34.4 dịch sẽ là Đức Phật ở thế gian thay cho bậc Phật sẽ có mặt ở thế gian (tha-ap122, tha-ap127) vì 34.2 đã nêu chủ ngữ Gotama và tha-ap491:1.4 dịch bhavissati là sẽ là; 35.2 dịch người ấy thay cho vị ấy (tha-ap486) cho nhất quán với 20.2 và 36.2 trong bài. Trong chính bài có 25 cặp Pāli trùng (3.3 với 8.3; 6.2 với 12.2; 25.2, 27.2, 29.2, 32.2; 26.1, 28.1, 30.1; 26.4, 28.4, 30.4, 31.4, 33.4; 30.3 với 33.3; ba khoá dấu lược 39.2, 40.2, 41.2): 24 cặp bản Việt giống nhau, 1 cặp khác (30.3 với 33.3, Chúng với Họ, vì chủ ngữ khác).

  Ngôi kể: dùng ta xuyên suốt, theo tha-ap408, tha-ap404 và đa số công thức chung: Kilesā jhāpitā mayhaṁ ta 121, tôi 53, khác 3 (177 khoá Pāli trùng chữ); viharāmi anāsavo ta 132, tôi 61, khác 3 (196 khoá); lời Đức Phật ở 19 dùng Ta viết hoa. Lời kết 42.1 dùng nhóm số nhiều đã nói những bài kệ này (523 khoá cùng công thức, so với 2 khoá đã từng nói bài kệ này số ít). 43.1 theo cùng phẩm: Ký sự về Trưởng lão Hemaka, thứ bảy (5 bài cùng phẩm đều viết dạng này). 43.2 Sattarasamaṁ bhāṇavāraṁ dịch Phần tụng đọc thứ mười bảy (14 khoá bhāṇavāra dùng Phần tụng đọc thứ, kể cả tha-ap415, 430, 458, 486, 500, 528, 537 liền kề).

  Thuật ngữ và tiền lệ: ratnapīṭhassidaṁ phalaṁ (26.4, 28.4, 30.4, 31.4, 33.4) dịch đây là quả báo của chiếc ghế đẩu bằng châu báu theo mẫu đây là quả báo của việc cúng dường (tha-ap413). Piyadassī nāma sambuddho dịch Đức Chánh Đẳng Giác tôn hiệu Piyadassī theo mẫu đa số của tầng (10 khoá tôn hiệu, so với 2 khoá tên là, 2 khoá Đức Toàn Giác tên là). aggo kāruṇiko muni dịch bậc tối thượng, bậc Mâu-ni giàu lòng bi mẫn (3 khoá cùng Pāli). anukampako kāruṇiko dịch Là bậc đầy lòng trắc ẩn từ bi (8 khoá). lokajeṭṭho narāsabho dịch bậc Trưởng Thượng thế gian, đấng Nhân Ngưu (26 khoá). muni chỉ vị Phật (5.2, 6.2, 6.4, 11.2, 12.2, 13.2, 15.3, 17.2) dịch Mâu-ni; muni chỉ chính đạo sĩ Anoma (2.4, 4.4) dịch bậc hiền trí để phân biệt (tầng chỉ có 1 khoá bậc hiền trí và 3 khoá bậc hiền tri, nên không có tiền lệ mạnh). Kumbhamattaṁ dịch to bằng chiếc ghè theo tha-ap390:2.1 (Cầm lấy trái mít to như chiếc ghè). tamandhakāraṁ vidhamitvā dịch xua tan bóng tối mù mịt ấy theo tha-ap405:15.3. Padesarajjaṁ vipulaṁ gaṇanāto asaṅkhiyaṁ dùng đúng chữ đa số (17 và 21 khoá). Sabbāsave pariññāya dùng Đã hiểu rõ toàn bộ lậu hoặc (39 khoá); nibbāyissatināsavo’ dịch sẽ nhập Niết-bàn, không còn lậu hoặc’ theo 5 bài kề cận (tha-ap395, 396, 397, 406, 415), so với 8 khoá ở các bài xa hơn dịch sẽ vô lậu mà đi vào Niết-bàn’. Ba công thức kệ 39, 40, 41 dùng đúng đa số của tầng, …pe… dịch đúng một dấu lược. Chữ sāsana: 35.4 và 37.4 dịch giáo pháp (đa số trong tầng), còn kataṁ buddhassa sāsanaṁ giữ lời dạy của Đức Phật như 139 khoá cùng Pāli.

  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 41.3, cố ý chạy qua khoá; nháy đơn mở ở 14.1 và đóng ở 14.4, mở ở 19.1 và đóng ở 36.4, và một cặp tự cân trong 12.4. Đối chiếu từng khoá cho 0 lệch trên 167 khoá cả bốn loại dấu. Dấu lược: ba khoá …pe… (39.2, 40.2, 41.2) đều là một dấu …; Pāli không có dấu lược trần hay (…) nào khác. Pāli không dùng ti nên không có chuyện phe bỏ hay giữ dấu ti. Không có chữ số Ả Rập trong bản Việt; không có từ Pāli lọt vào ngoài tên riêng (Therāpadāna, Piyadassī).

  BẤT ĐỊNH, để người biên tập phán, không thêm vào thân kinh:
  1. 3.3 và 8.3 Paṭṭho bhūmantalikkhamhi: paṭṭha dịch Lừng danh (theo mạch tāpaso được tiếng về đất và trời); cũng có thể đọc là thông thạo. Tầng không có tiền lệ (0 khoá). bhūmantalikkha dịch đất và bầu trời, không diễn nghĩa thành địa lý hay thiên văn.
  2. 4.1 nirārambho: dịch không bận rộn việc làm (ārambha là khởi sự, làm việc); cũng có thể đọc là không sát hại. Tầng không có tiền lệ (0 khoá).
  3. 8.4 nakkhattapadakovido: dịch tinh thông về vị trí các vì sao; pada là bước chân, dấu vết, vị trí; tầng không có tiền lệ.
  4. 31.2 dohaññā puṅgavūsabhe: dohañña đọc là vắt sữa được, puṅgavūsabha là bò đực đầu đàn; chưa phân định puṅgavūsabhe là vị ngữ cùng với dhenu hay là tân ngữ của janayissanti (sinh ra bò đực đầu đàn và bê); bản Việt giữ thứ tự Pāli để không chọn thay. Tầng không có tiền lệ (0 khoá).
  5. 19.2 amatañca phalaṁ: dịch trái cây bất tử; amata có thể chỉ vị ngon như cam lồ; không thêm giải thích vào thân kinh.
  6. 14.1 đến 16.2 pīṭha, pallaṅka, āsandī: dịch ghế đẩu, ghế bành, ghế dài để giữ ba chữ Pāli phân biệt; tầng không có tiền lệ cho ghế đẩu, ghế bành (0 khoá), ghế dài có 2 khoá (tha-ap422). 16.1 Ratane ca nisinnassa dịch ngồi trên chiếc ghế báu (ratana ở đây là chất liệu của chiếc ghế ở 14.4 và 15.1).
  7. 16.3 jambuphalaṁ: dịch trái mận theo tầng (xoài, mận ở tha-ap284:2.2, 2 khoá); đây là trái jambu, loài chưa xác định, không có tiền lệ cho dạng trái mận.
  8. 9.1 Sohaṁ buddhassa sutvāna: dịch Sau khi nghe Đức Phật; Pāli chỉ nói nghe từ Đức Phật, không nêu nghe điều gì. 7.4 na sutopi ca kassaci dịch chưa từng nghe từ bất kỳ ai; không thêm tân ngữ.
  9. 11.1 Kālañca punarāgamma dịch Rồi khi thời điểm lại đến; có thể đọc là đến một lần khác nữa. 11.3 và 11.4 dịch ta vẫn không biết rằng đây là Đức Phật; chữ rằng là bắt buộc về cú pháp vì Pāli không đánh dấu lời trực tiếp ở đây.
  10. 2.3 Sakasāmaññavikkanto: dịch Dấn bước trong sa-môn hạnh của chính mình; vikkanta có thể là dũng cảm hoặc tinh cần. 1.2 Anoma: tên đạo sĩ trùng tên một vị Phật (tha-ap397:27.2); Pāli ở đây là tāpaso nên không đồng nhất hai người.
  11. 1.1 đến 4.4 chủ ngữ ngôi ba (vị ấy), từ 7 trở đi ngôi nhất; Pāli không có chuyển ngôi nào được báo hiệu, nên bản Việt giữ nguyên chỗ đổi. 1.4 vasī và 5.4 pharī dịch quá khứ (đã sống, đã lan tỏa).
  12. 12.3 Sañjānāpesi attānaṁ dịch Ngài đã cho ta nhận biết về chính Ngài (động từ sai khiến); dấu hai chấm là dấu câu tiếng Việt, không có trong Pāli.

