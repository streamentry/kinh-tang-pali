  Thống nhất cấp kho 2026-10-17 (gāmaṇīyehi, quyết định điều phối theo uỷ quyền): «các vị trưởng làng» → «các thầy luyện voi / luyện ngựa / đánh xe» theo loại ở kệ liền trước (nāga / assa / ratha). Căn cứ: «trưởng làng» là nghĩa của gāmaṇī, không phải gāmaṇīya (DPD «squadron leader»); chú giải Apadāna (CST s0510a.att35/att36) không giải chữ này; cùng công thức kệ được chú giải Jātaka giải là hatthācariya / assācariya / rathācariya (ja539, CST s0514a2) và rathika (ja529, s0514a1), là bằng chứng câu song song (§3.2). Thêm chú thích ở dòng đầu.
