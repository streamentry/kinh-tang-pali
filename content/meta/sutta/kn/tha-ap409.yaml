  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 6 vị trí bất đồng nghĩa → sửa 0, giữ 3, bất định 3. Giữ: 9.3 (Tiṭṭhanto vā nisinno vā là đứng hay ngồi, bản nguyên bài đọc ăn hoặc ngồi, một dị bản khác); 35.1 (Tassa dassanamāgamma: nhờ được diện kiến, bản nguyên bài đọc đi đến chiêm ngưỡng, cùng ý); 40.1 (Svāgataṁ vata me āsi: thật lành thay sự đến của ta, theo tầng (228 khoá cùng Pāli), bản nguyên bài đọc là đã thành công mỹ mãn). Bất định: 3.3 và 8.3 (paṭṭho bhūmantalikkhamhi: bản dự án thạo, bản nguyên bài nổi tiếng, chỉ có ở bài này trong tầng); 4.1 (nirārambho: bản dự án không bận rộn việc làm, bản nguyên bài không giết hại, cũng là nghĩa của nirārambha ở an4.39, an4.40, sn3.9 trong tầng); 31.2–31.3 (puṅgavūsabhe: bản dự án là bò đực đầu đàn cùng bò cái sinh bê, bản nguyên bài đọc bò đực cao quý cũng là con do bò cái sinh; đuôi -e ở đây có thể là danh cách hay đối cách số nhiều). Các số (bảy mươi bảy kiếp, bảy mươi lăm lần, ba mươi hai lần, sáu mươi ngàn ×4, mười sáu ngàn, một ngàn tám trăm kiếp) khớp bản nguyên bài từng chỗ. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

