notes: |-
  **Nguồn.** Pāli root từ snapshot bilara đã ghim, `kn/cp/cp10_root-pli-ms.json`, 100 khoá. Bản Anh tham khảo là Bhikkhu Sujato cùng commit, **có thật** trong tầng đã ghim: 80/100 khoá có chữ. 20 khoá còn lại đều rỗng là toàn bộ phần kết của bài (`:20.1` colophon hạnh, `:21.1` colophon phẩm, `:22.1`–`:23.4`–`:26.4` bài kệ tóm lược `Tassuddānaṁ` và `:27.1` colophon phần giải thích) — Sujato không dịch phần này ở bài nào của `cp` tại commit đã ghim. `kn` không có tầng Việt hiện hành (tầng `vietnamese-current` chỉ có Pháp Cú), nên không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  **Coverage English — nói rõ giới hạn.** Cổng coverage đo trên khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): khoá dài nhất của bài là 28 ký tự nên **mẫu số của cổng = 0**, cổng không đo được gì và không sinh entry ở `reference-gaps.yaml` (không có entry nào cho cp10). Đo thô thay thế: trên phần kệ thân bài `:1.1`–`:19.4` (76 khoá) Sujato phủ **76/76 = 1,00**; trên mọi khoá không phải tiêu đề (96 khoá, gồm cả phần kết/tóm lược) là **76/96 = 0,79**, vì 20 khoá phần kết không có tầng Anh nào. Tầng `english-project` không có tệp cho bài này. Kết luận: phần kệ nội dung được đối chiếu Anh độc lập đầy đủ; phần kết 20 khoá chỉ dựa vào Pāli và tiền lệ `cp20`/`cp35` (cùng khuôn `Tassuddānaṁ`), nên `triangulation` hạ xuống 9,1 chứ không để ở mức cao nhất.

  **Pāli trùng nguyên văn: 9 khoá** có Pāli giống hệt khoá của bài khác đã dịch (613 cặp đã dò). Dùng lại nguyên văn theo đa số: `0.1` (`Hạnh Tạng`, 32/33 cặp; ngoại lệ duy nhất `cp34:0.1` viết `Cariyāpiṭaka`), `0.2` (`Phẩm Akitti`, 8/8), `1.1` (`“Lại nữa, vào thời thuở nọ,`, 15/24 cặp, theo đa số của `cp`), `10.1` (`Nhờ thấu rõ ý định của ta,`, 12/28 cặp, theo `cp8:3.1` và nhóm `tha-ap` dùng `ta`), `11.2` (`ta đã nói lời này:` theo `cp26:8.2`), `12.1` (`Món thí thù thắng chưa từng được cho trước đây,` theo `cp8:12.3`), `22.1` (`Tóm lược:`, 382/512 cặp). `15.4` (`ta ngồi xuống một bên.`) cùng Pāli với 3 khoá khác nhưng 3 khoá đó khác ngôi (`tôi`) hoặc khác ngữ cảnh nên bản Việt khác là có chủ ý. **Một chỗ cố ý khác tiền lệ:** `23.4` `mahāgovindabrāhmaṇo` dịch `và bà-la-môn Mahāgovinda` (khác `cp5:1.4` ghi `đạo sĩ`), vì Pāli viết `brāhmaṇo` và đây là danh sách tên trong bài tóm lược; tương tự `23.1` `Bà-la-môn Akitti` trong khi `cp1:4.4` ghi `đạo sĩ` ở dòng Pāli khác. Không có cặp Pāli trùng nội bộ trong bài.

  **Dấu lược và ngoặc.** Bài không có khoá nào chứa `…`, nên Việt không có `…` và không có `(…)`. Nháy kép `“…”`: mở ở `1.1`, đóng ở `19.4` (`adāsahan”ti`). Nháy đơn `‘…’`: `3.3`–`3.4`; mở `4.4` đóng `5.4`; mở `7.3` đóng `9.4`; mở `11.3` đóng `13.4`; `14.1` mở và đóng trong cùng khoá (`‘Sādhū’ti`). Mọi khoá khớp Pāli về số lượng từng loại nháy.

  **Thuật ngữ đã đo.** `Uposatha` dịch `ngày trai giới` (tầng: `trai giới` 59+5 khoá, `Bố-tát` 34+8+4, `Bát quan trai` 2 gồm `cp13:2.2`); chọn `trai giới` vì rõ với người đọc hiện đại và là cách phổ biến nhất của tầng. `dakkhiṇeyya` → `vị đáng cúng dường` theo `cp1:10.2`. `ghāsahetu` → `vì miếng ăn` theo `ja129:1.2`. `paraheṭhana` → `việc gây hại cho người khác` theo `cp15:9.4`. `Dānapāramī 10` → `Bố Thí Ba-la-mật Thứ Mười` theo khuôn `cp1`–`cp8` (`cp6:0.3` viết số `6` là ngoại lệ). `dānavara` → `món thí thù thắng` theo `cp8:12.3`. `pariccaj-` → `xả bỏ` ở `26.2` (tầng dùng `từ bỏ` cho vật ngoài; thân mình là vật đặc biệt hơn). Tên: `Hạnh Của Thỏ Hiền Trí` theo `ja316:0.4` (`Thỏ Hiền Trí`).

  **Số Pāli.** Bài không có số lượng để tính (`dasamaṁ` = thứ mười ở `20.1`, `paṭhamo` = thứ nhất ở `21.1`, `Dānapāramī 10` ở `0.3`).

  **Bất định đã phân xử, ghi ở đây chứ không thêm vào thân kinh.** (1) `12.4` `ayuttaṁ te paraheṭhanaṁ`: `ayuttaṁ` là tính từ trung tính hợp với `paraheṭhanaṁ`, nghĩa `không thích hợp`; dịch `làm hại người khác không thích hợp với ông`. Sujato viết `unattached to harming others` (gắn vào `Tuvaṁ`), là cách đọc khác; chọn theo ngữ pháp Pāli vì Pāli root là authority, nhưng đây là chỗ hai cách đọc có thể khác sắc thái. (2) `14.4` `aṅgāragabbhakaṁ`: dịch sát `một hốc than hồng ở bên trong`; Sujato viết `placed an ember in the recess`, độ chắc về hình dạng giàn lửa thấp. (3) `25.1` `dānaparikkhārā`: `parikkhāra` = vật dụng/phương tiện đi kèm; dịch `vật dụng của sự bố thí`, tầng không có tiền lệ chắc (`cp20:12.2` là cách dịch khác của chữ này và khó đối chiếu). (4) `19.1` `chaviṁ cammaṁ`: dịch `lớp da ngoài, lớp da trong` theo Sujato và cách hiểu thông thường (`chavi` = biểu bì, `camma` = lớp da dày); `cp12:4.1` giải `camma` thành `gân` — khác, không đo được ai đúng ở bài này. (5) `19.2` `hadayabandhanaṁ` dịch sát `các dây buộc nơi tim` (Sujato `heart with cords`). (6) `2.2` `suttapoto` là dạng hiếm; theo Sujato (`young otter`) và `ja316` nơi bạn của thỏ là rái cá — dịch `một con rái cá non`. (7) `17.2` `Paviṭṭhaṁ yassa kassaci`: dịch `đối với bất cứ ai đã bước vào`, giữ cấu trúc vô định của Pāli thay vì `nhảy vào` của Sujato.

  **Cổng kỹ thuật.** Agent dịch không được chạy lệnh npm, nên `npm run validate`, `npm test`, `npm run check` và `npm run build` là việc của coordinator; `technical_integrity` đặt 9,6 và **không** tuyên bố cổng kỹ thuật đã pass. Tự kiểm: JSON hợp lệ, đủ 100/100 khoá theo Pāli đúng thứ tự, không khoá thừa, NFC toàn bộ, không khoá rỗng, nháy khớp Pāli từng khoá, không Pāli lọt ngoài các tên riêng.
