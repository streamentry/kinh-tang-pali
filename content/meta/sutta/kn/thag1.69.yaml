notes: |-
  `mahārasa` = rất ngọt, thơm ngon (chữ Hán–Việt "ngọt" giữ đúng sắc và quen thuộc hơn
  "thơm ngon"); chữ này chưa có tiền lệ trong tầng (0 chỗ) nhưng `sugītaṁ` ở thag1.51 đã được
  dịch "ngợt ngơ", nên tôi giữ trục "ngọt" cho cả hai bài.
  `sabbaññuta` = toàn tri (tiền lệ mn90:17.4 "sự toàn tri", mil6.2.8). `ñāṇavara` = tuệ tinh
  tường; `magga` = con đường; `amatā` = bất tử. `yogakkhemassa pathassa` = con đường đưa tới sự
  an ổn thoát gông trói — dịch theo đúng tiền lệ `yogakkhemaṁ` (iti107:3.4 "sự an ổn tối thượng
  thoát các ách"; ja55:1.4 "để mong đạt sự an ổn, thoát khỏi gông trói"). `kovido` = rành, thạo
  (tiền lề sn8.6:3.2 "rành rẽ"; mn109:11.2). Câu 1.3–1.4 chuyển từ "tôi" sang "ngài", tôi giữ
  đúng mạch chủ từ của Pāli.
  Dòng kết 1.5 giữ HAI dấu lược như Pāli. Vì `cần` RỖNG, tôi tự quét MỌI khoá — sạch. Không
  chạy npm (đợt này cấm) nên technical_integrity = 9.6.
