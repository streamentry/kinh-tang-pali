  BẤT ĐỊNH (ghi ở đây, không giải thích trong thân kinh):
  (1) `brahme udakumbho` (9.1) — pv12 có `brahme`, ja354 thì không. Tôi đọc `brahme` là
      tính từ *bằng đất* (bình nước làm bằng đất nung), dịch *Như bình nước bằng đất nung,*
      chứ không phải *của Phạm thiên* — vì `udakumbha` là bình nước và cả dụ ngánh nói về đồ
      vỡ không ghép lại được. Cần người phân xử nếu có ý kiến khác.
  (2) `9.2` — Pāli `bhinno appaṭisandhiyo;` **trùng nguyên văn** với ja354:9.2, nhưng tôi cố
      ý KHÔNG dùng lại nguyên văn `không thể ghép lại được;` của ja354, vì ở ja354 chữ *vỡ ra*
      đã được đẩy lên `9.1` (dựng theo `udakakumbho`), còn ở pv12 `9.1` đã bị `brahme` chiếm
      mất; dùng lại nguyên văn sẽ **mất chữ `bhinno`**. Tôi đặt *vỡ ra* vào `9.2`:
      *vỡ ra thì không thể ghép lại được;*. Đánh đổi *tính nhất quán nguyên văn* lấy *đủ nghĩa*.
  (3) `10.4` — Pāli kết `”ti.`. Tầng pv giữ `ti` **56** / bỏ **8** (đo lại), nên tôi giữ:
      *…chính vị ấy”.ti.* — lệch với ja354:10.4 vốn bỏ `ti`. Lý do: `ti` là particle Pāli, giữ
      nó giữ cho nhịp kệ trong tầng pv; ghi lại để biên tập đồng ý hoặc sửa cả hai.
  (4) `Anabbhito tato āgā` / `nānuññāto ito goto` (3.1–3.2) — ja354 đọc `Anavhito` +
      `ananuññāto` (đều nghĩa *không ai mời*), còn pv12 đọc `Anabbhito` + `nānuññāto` (nghĩa
      *không ai biết*). Tôi dịch theo **Pāli của pv12**: *Không ai mời từ nơi kia, / không ai
      biết từ nơi này, mà vị ấy đã đi;* và cố ý khác bản ja354 ở chỗ này.
  (5) `Tassuddānaṁ` không có dấu hai chấm trong Pāli nhưng bản Việt có — theo 345× tiền lệ.
  
