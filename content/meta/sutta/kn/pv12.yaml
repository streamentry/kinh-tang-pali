  BẤT ĐỊNH (ghi ở đây, không giải thích trong thân kinh):
  (1) `brahme udakumbho` (9.1) — pv12 có `brahme`, ja354 thì không. Tôi đọc `brahme` là
      tính từ *bằng đất* (bình nước làm bằng đất nung), dịch *Như bình nước bằng đất nung,*
      chứ không phải *của Phạm thiên* — vì `udakumbha` là bình nước và cả dụ ngánh nói về đồ
      vỡ không ghép lại được. Cần người phân xử nếu có ý kiến khác.
  (2) `9.2` — Pāli `bhinno appaṭisandhiyo;` **trùng nguyên văn** với ja354:9.2, nhưng tôi cố
      ý KHÔNG dùng lại nguyên văn `không thể ghép lại được;` của ja354, vì ở ja354 chữ *vỡ ra*
      đã được đẩy lên `9.1` (dựng theo `udakakumbho`), còn ở pv12 `9.1` đã bị `brahme` chiếm
      mất; dùng lại nguyên văn sẽ **mất chữ `bhinno`**. Tôi đặt *vỡ ra* vào `9.2`:
      *vỡ ra thì không thể ghép lại được;*. Đánh đổi *tính nhất quán nguyên văn* lấy *đủ nghĩa*.
  (3) `10.4` — Pāli kết `”ti.`. Tầng pv giữ `ti` **56** / bỏ **8** (đo lại), nên tôi giữ:
      *…chính vị ấy”.ti.* — lệch với ja354:10.4 vốn bỏ `ti`. Lý do: `ti` là particle Pāli, giữ
      nó giữ cho nhịp kệ trong tầng pv; ghi lại để biên tập đồng ý hoặc sửa cả hai.
  (4) `Anabbhito tato āgā` / `nānuññāto ito goto` (3.1–3.2) — ja354 đọc `Anavhito` +
      `ananuññāto` (đều nghĩa *không ai mời*), còn pv12 đọc `Anabbhito` + `nānuññāto` (nghĩa
      *không ai biết*). Tôi dịch theo **Pāli của pv12**: *Không ai mời từ nơi kia, / không ai
      biết từ nơi này, mà vị ấy đã đi;* và cố ý khác bản ja354 ở chỗ này.
  (5) `Tassuddānaṁ` không có dấu hai chấm trong Pāli nhưng bản Việt có — theo 345× tiền lệ.

  THƠ UDDĀNA (13.1, 14.1–14.6) — đây là mục lục 12 tên truyện của phẩm. Tôi dịch nghĩa ở
  những tên mà nghĩa chữ **chắc chắn và đã có tiêu đề Việt trong chính tầng này**:
  `Khetta` → *Ruộng* (khetta = ruộng, 83 khoá Pāli kn) · `Sūkara` → *Heo* (pv2 *Có Miệng Dễ
  Chịu*) · `Pūti` → *Thối* (pv3 *Có Miệng Thối*) · `Piṭṭha` → *Bột* (pv4 *Búp Bê Bột*) ·
  `Pañca` → *Năm* (pv6 *Ăn Thịt Năm Đứa Trẻ*) · `Sattaputta` → *Bảy Đứa Trẻ* (pv7) ·
  `Goṇa` → *Chăn Trâu* (pv8) · `Pesakāraka` → *Nữ Thợ Dệt* (pv9 *Nữ Thợ Dệt Vải Lớn*) ·
  `dvādasaṁ uragañcevāti` → *Phẩm Rắn mười hai bài vậy* (khớp `:0.2`).
  Hai tên **`Tirokuṭṭa`** (14.2) và **`Khallāṭiya`** (14.5) tôi **giữ nguyên Pāli**, vì
  pv5 và pv10 chưa có bản Việt trong tầng (pv5: 0 khoá, pv10: 0 khoá) và tôi không có từ điển
  để dịch mà không bịa. `Nāga` (14.5) giữ Pāli vì `nāga` là tên riêng đã có sẵn trong tầng.
  Tiền lệ cho cách giữ tên Pāli trong thơ uddāna: toàn tầng có **1676** dòng uddāna đã dịch,
  trong đó **323** dòng còn giữ chữ Pāli có dấu (19%) — đây là quy ước có sẵn, không
  phải chỗ trống. Nếu biên tập muốn cả 12 tên đều dùng tiêu đề đầy đủ của pv1–pv12 thì phải
  chờ pv1, pv5, pv10, pv11 có bản Việt trước; hiện chưa thể mà không bịa.

  CỔNG KỸ THUẬT CHƯA CHẠY — agent dịch không được phép chạy `npm run validate|test|build|check`. `technical_integrity` 9.6, KHÔNG tuyên bố technical gate pass. Bốn lệnh coordinator cần chạy trước khi coi tiêu chí 10 là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Lượt cải thiện 2026-10-11 (kiểm toán độc lập; THAY THẾ các khẳng định trước đây về nghĩa của 1.2–1.4, 3.1–3.2, 5.1–5.4, 7.1–7.2, 9.1–9.2, 10.4, 14.2, 14.4, 14.6, về "27/29 câu dùng lại nguyên văn với ja354", về "tiền lệ giữ `ti` 56/bỏ 8" và về bất định (1), (2), (3), (4) ở trên). Đọc đối kháng từng cặp Pāli↔Việt cho thấy bản trước chép nguyên cụm dịch của ja354 mà ja354 cũng sai, nên nhiều khoá nói điều không có trong Pāli. Đổi 41/52 khoá:
  • 5.1–5.4: "Dẫu lá gan và túi mật của tôi có khô / … sự chán ghét của tôi lại càng lớn" → "Nếu tôi khóc, tôi sẽ gầy mòn; / ở đó tôi được ích lợi gì? / Họ hàng, bạn bè và thân hữu của chúng ta / sẽ càng thêm bất mãn." Pāli `sace rode kisā assaṁ` = "nếu tôi khóc, tôi sẽ gầy"; không có gan/mật. `arati` → "bất mãn" theo đa số tầng (sn4.25, mnd15, bv2, thig3.7…).
  • 7.1–7.2: "đứa trẻ cầm miếng bánh, đi đâu cũng bám lấy mẹ" → "đứa trẻ khóc theo mặt trăng đang đi" (`dārako candaṁ gacchantamanurodati`; không có bánh, không có mẹ). Song song `candaṁ viya dārako rudaṁ` (pv17, vv83, ja449) đã dịch "khóc đòi mặt trăng".
  • 3.1–3.2: "không ai biết từ nơi này" → "không ai cho phép" (`nānuññāto` = na + anuññāto, anuññāta = được cho phép; mn82, an3.22); `anabbhito` đọc là "không ai mời", song song `anavhito` ở ja354.
  • 9.1: bỏ "bằng đất nung" (bản trước tự đọc `brahme` là tính từ, không có căn cứ) → hô cách "Này Bà-la-môn" như ja402, ja456, ja478, ja520, ja547 (`brahme` luôn là hô cách trong tầng Pāli). 9.2: "vỡ ra thì" → "đã vỡ thì" (`bhinno` là phân từ của bình).
  • 1.2–1.4: "vẫn đi tiếp với thân mình" → "lìa bỏ thân mình mà đi" (`hitvā … saṁ tanuṁ`: `hitvā` là phân từ bỏ lại, `tanuṁ` là tân ngữ); "khi thân xác rơi rã" → "không còn hưởng thụ gì" (`nibbhoge`, cùng gốc `nibbhogo` an8.11 dịch "không hưởng thụ"); "khi cái chết đã đến với một người" → "khi người đã khuất đã chết" (`pete kālaṅkate`; ở đây `peta` là người đã mất, không phải ngạ quỷ).
  • 2.1–2.4 (lặp ở 4, 6, 8, 10): "Đang cháy" → "Đang bị thiêu" (`ḍayhamāno`, thể bị động); "họ hàng đang khóc than" → "sự than khóc của họ hàng" (`ñātīnaṁ paridevitaṁ` là danh từ, sở hữu cách); "khóc thương điều này" → "khóc cho người này" (`etaṁ` chỉ người đã mất, theo mạch `so` ở 2.4); bỏ "chính" ở "số phận của chính vị ấy" (không có trong Pāli). 3.4: "khóc than là vì sao" → "có gì để than khóc".
  • 7.3–7.4, 9.3–9.4: "Cũng vậy, ai khóc than / người đã từ khuất" → "Việc này cũng chỉ như thế, / đối với người sầu thương kẻ đã khuất" (`evaṁsampadamevetaṁ yo petamanusocati`; `anusocati` là sầu thương, khác `paridevati` là than khóc).
  • 10.4: bỏ "ti" Pāli lọt sang Việt (`”.ti.` → `”.`). Đo lại toàn bộ tầng pv: chỉ pv12 mang `.ti.`; mọi khoá pv khác có Pāli kết `”ti` đều dịch kết `”.`. Khẳng định "giữ `ti` 56/bỏ 8" ở trên là sai.
  • 14.2: "Tirokuṭṭa" → "Ngoài Bức Tường" (đồng nhất tiêu đề pv5, nay đã có bản Việt). 14.4: "Chăn Trâu" → "Bò" (`goṇa` = bò đực, pv8 "Con Bò"); "Nữ Thợ Dệt" → "Thợ Dệt" (`pesakāraka` giống đực). 14.6: "Phẩm Rắn mười hai bài vậy" → "và thứ mười hai là Con Rắn" (`dvādasaṁ uragañcevāti`; không có từ "phẩm" và "bài").
