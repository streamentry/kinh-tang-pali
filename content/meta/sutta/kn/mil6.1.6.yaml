notes: |-
  Dịch trực tiếp từ Pāli root tại commit bilara đã ghim (11c9d708978cde8ba61096d8a75f7ddfb846f639, khoá dựng từ tiền tố pre của lát, không phải từ uid).
  Tầng Anh đã ghim không có bài nào trong thư viện Milindapañha, tầng Việt hiện hành chỉ có Pháp Cú, lớp lấp english-project không có ⇒ dịch một tầng, nên triangulation bị chặn.
  Văn xưng theo mil đã merge: Thưa Đại đức Nāgasena (7 tệp) và Tâu Đại vương (chữ hoa ở đầu câu, chữ thường sau); Thế Tôn cho bhagavā, Trưởng lão cho thera, Đấng Chiến Thắng cho buddha khi tán dương.
  `Buddhavagga` dịch Phẩm Đức Phật theo `mil6.1.3` đã merge; `Anumānapañha` giữ Pāli như `mil6.1.3` và `mil6.1.4`. `0.4` đặt mới: Câu Hỏi Về Bậc A-la-hán Biết Thọ.
  0 tiền lệ, đặt mới có lý do: `kāyānugata dhamma` → pháp luôn chạy theo thân xác (2 lần lặp nguyên văn, dịch nhất quán); `anissaro assāmī avasavattī` → làm chủ, không làm chủ; `āṇā`/`issariyaṁ` → quyền uy, quyền cai trị (quyền uy có 1 tiền lệ ở dhp60-75:3, còn `issariyaṁ` ở kp8 là quyền cai trị và uy quyền — tôi tách hai vế cho đúng nghĩa `vā`); `uccāro/passāvo` → gió thổi về, gió thổi ngược; `middha` → trạo trạo; `goṇa` → con bò bị buộc dây; `bheravarāva` → gào thét; `samādhithambha` → chỗ dựa của định; `daḷhaṁ gaṇhāti` → nắm chặt vào; `avikkhittaṁ` → không tản loạn; `khandha` (cây) → tàng cây.
  Bất định đã phân xử và ghi lại: `vedanā` tôi dịch cảm thọ xuyên suốt bài này (kể cả tên câu hỏi), còn ở `sn22.33` cùng lát tôi dịch thọ vì bài kia nằm trong cặp với `sn22.34` đã published mà đó dùng thọ. Hai bài khác tập nên tôi để vậy và ghi ở đây để người điều phối chọn một cách thống nhất toàn kho.
  `goṇa chāto paritasito abaladubbalaparittakatiṇesu vā latāya vā upanibaddho assa` — tôi dịc gộp là con bò bị buộc dây, ở trong ruộng lúa, ở giữa gò thổi gió nóng, hay bị trói vào cây vú; `baladubbalaparittakati` (chỗ yếu) và `parittakati` (bị gió về) là hai nơi bò bị xâu, dịch văn xuôi cho đọc được; người biên tập nên xem nếu muốn giữ từng nơi.
  Pāli trùng nguyên văn và đã dùng lại bản Việt có sẵn: `“Bhante nāgasena, tumhe bhaṇatha—` (6 lần ở mil5.1.9, mil5.2.6, mil5.2.8, mil5.4.10, mil5.5.10, mil6.2.2) và `Sādhu … sampaṭicchāmī` (18).
  technical_integrity 9.6 vì agent lát này không chạy gate. Bốn lệnh gate do coordinator chạy trước khi publish: npm run validate, npm test, npm run check, npm run build.
