  Phạm vi: đủ 299/299 khoá của bài (4 khoá tiêu đề `0.1`–`0.4`; 288 khoá kệ `1.1`–`69.4` thuộc 69 nhóm kệ, mỗi dòng Pāli một khoá; `69.5` dòng bìa, `69.6` dòng đóng bộ; `70.0`–`70.4` bài kệ tóm tắt cuối bộ), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã in và đọc đối chiếu cả 299 cặp Pāli↔Việt, không đọc mẫu. Lượt đọc đối kháng sau khi viết đã sửa hai khoá: `19.4` (bỏ dấu phẩy thừa) và `53.1` (đổi `Người` thành `Vị nào` cho khớp cách dịch `Yo` ở `55.1`, `57.1`, `59.1`, `63.1`).

  MẪU SỐ COVERAGE THEO CỔNG = 1 — CỔNG ĐO ĐƯỢC RẤT ÍT. `source/layers.yaml` đặt `substantivePaliMinChars: 40` và bỏ khối `:0`. Mỗi pāda là một khoá nên khoá kệ dài nhất chỉ 33 ký tự (`45.3`, `45.4`); khoá duy nhất đạt ngưỡng là `69.5` (62 ký tự), tức dòng bìa `Itthaṁ sudaṁ…`, không phải câu kệ. Sujato có prose ở `69.5` (1/1), nhưng con số đó không nói gì về độ phủ của 288 dòng kệ. Đây là "cổng gần như không đo được gì về nội dung kệ", không phải "không cần ghi nhận gap". Tôi không lấy đó làm căn cứ mà đo thô riêng.

  COVERAGE ENGLISH THÔ (do người biên tập tự phán). Tra manifest: `english-sujato` có tệp cho bài này (`sutta/kn/thag/thag20.1_translation-en-sujato.json`, có trong `source/upstream-manifest.json`), đúng 299 khoá ID, cùng thứ tự với Pāli. Trên 295 khoá không phải khối `0.x`, Sujato có prose ở 290/295 = 0,983; toàn bộ 288/288 khoá kệ `1.1`–`69.4` đều có prose, cộng `69.5` và `69.6`. 5 khoá trống là `70.0`–`70.4` (bài kệ tóm tắt cuối bộ, Sujato để trống). Ở `52.2`–`52.3`, `54.2`–`54.3`, `56.2`–`56.3`, `58.2`–`58.3`, `62.2`–`62.3` Pāli lược (`… pe` rồi `…`) nhưng Sujato đã viết đủ điệp khúc; đó là bản mở rộng của Sujato, tôi không theo mà giữ đúng một `…` ở mỗi khoá. Phép đo thô vượt ngưỡng 0,80 và không có blocker coverage. `english-project`: không có tệp cho bài này, không cần lấp. `vietnamese-current`: vắng tại commit đã ghim (bilara chỉ có Pháp Cú). Bản Việt nguyên bài của Bhikkhu Indacanda (theo bản BJT, 1152–1219 = 68 bài kệ) chỉ để tra cứu toàn văn, không căn lề theo khoá, nên không tính là tầng tham khảo theo khoá; tôi chỉ dùng nó để đối chiếu từng chỗ khó. Không có entry trong `reference-gaps.yaml`. Triangulation chỉ có một bản Anh độc lập (Sujato) cộng Pāli, cộng các đoạn kệ trùng đã dịch trong tầng (`mn50`, `thag1.39`–`1.41`, `thag4.4`, `thag16.4`, `thag16.9`, `thag17.3`, `thag18.1`, `sn21.4`, `mn143`), không có tham khảo Việt truyền thống theo khoá, nên điểm triangulation để 8,7.

  VÌ SAO `published`. Không có blocker: 299/299 khoá, 0 thừa, 0 thiếu, nháy và dấu lược khớp Pāli từng khoá, các con số đã tự tính (xem phép 5). Trung bình số học thô của 10 tiêu chí là 9,02, lớn hơn 9,0, nên theo bảng gate bài ở `published`. Biên rất hẹp: điểm `ambiguity_integrity`, `semantic_fidelity` và `grammar_logic` bị trừ vì còn nhiều chỗ chưa phân xử được chắc (xem mục bất định). Technical gate chưa chạy (xem cuối): nếu một trong bốn lệnh đó đỏ thì status phải xét lại.

  CẤU TRÚC VÀ NHÁY. Bài mở bằng lời kêu gọi, rồi nhiều lời trích xen nhau; Pāli đánh nháy như sau, và bản Việt không thêm nháy ở chỗ Pāli không đánh. Nháy kép mở/đóng: `1.1`–`4.4`; `5.1`–`8.4`; `9.1`–`9.4`; `10.1`–`11.4`; `12.1`–`18.4`; `19.1`–`29.4`; `30.1`–`34.6`; `35.1`–`36.4`; `37.1`–`38.4`; `39.1`–`42.4` (trong đó có cặp nháy đơn `‘…’` ở `40.1` và `40.4`); `43.1`–`57.6`; `58.1`–`61.4`; `62.1`–`68.4`; `69.1`–`69.4`. Hai chỗ lời hỏi đáp nằm trong lời kể mà Pāli không đánh nháy riêng: `57.3`–`57.4` (câu hỏi với Sakka) và `59.3`–`61.4` (câu hỏi với Phạm thiên và lời đáp); bản Việt giữ đúng như vậy và chỉ nhận người nói ở chỗ Pāli nêu (`Tassa sakko viyākāsi`, `Tassa brahmā viyākāsi`, `māra` hô cách, `kaṇha` hô cách). Pāli dùng hô cách giống cái ở `5.1`–`6.2` (`kuṭike`, `pisācini`) và `11.3` (`pāpacitte`); bản Việt không thêm tên hay giới tính người nghe. Điệp khúc `Yo etamabhijānāti, … pe, …, kaṇha dukkhaṁ nigacchasi` ở `50`, `52`, `54`, `56`, `58`, `62`, `64` được giữ thành `Vị tỳ-kheo trực tiếp biết điều này, …, …, hỡi Kẻ Đen Tối, ngươi sẽ đi đến đau khổ.` theo `mn50:24.11`–`24.14` (7 khoá `Yo etamabhijānāti`, bản Việt dùng một cách dịch).

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 299 = Pāli 299, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
    2. Nháy đơn và kép khớp Pāli từng khoá: 0/299 lệch. Tổng ký tự nháy ở Pāli 30 (14 `“`, 14 `”`, 1 `‘`, 1 `’`), Việt đúng 30 ký tự đó ở cùng các khoá. Phép này có mẫu, không rỗng.
    3. Pāli trùng nguyên văn TRONG CHÍNH bài (so Pāli bỏ dấu câu và hoa thường): 31 nhóm. 30 nhóm bản Việt giống nhau từng chữ (kể cả khác dấu cuối dòng), 1 nhóm khác: `59.6` / `61.2` (`Brahmaloke pabhassaraṁ`): `59.6` là câu hỏi (`… không?`) và `61.2` là lời khẳng định (`…;`), khác nhau do ngữ pháp chứ không do cách hiểu. Phép này có mẫu, không rỗng.
    4. Dấu lược: Pāli có `…` ở 10 khoá (`52.2`, `52.3`, `54.2`, `54.3`, `56.2`, `56.3`, `58.2`, `58.3`, `62.2`, `62.3`; dạng `… pe` ở `x.2`, `…` ở `x.3`); Việt có đúng 1 `…` ở mỗi khoá đó (theo `thag14.1:11.2`–`11.3`, `thag15.1:13.2`–`13.3`: cả hai dạng đều là `…`). `(…)` trần: 0 ở Pāli nên 0 ở Việt. Pāli không có khoá kết `….`. Lỗi 0/299.
    5. Số Pāli (tự tính, in phép ra):
       · `Saṭṭhinipāta` (`0.2`, `69.6`), `Saṭṭhikamhi nipātamhi` (`70.1`) = saṭṭhi 60 ⇒ Bộ Sáu Mươi Bài Kinh (khuôn `thag19.1:0.2` "Bộ Năm Mươi Bài Kinh").
       · `aṭṭhasaṭṭhi` (`70.4`) = aṭṭha 8 + saṭṭhi 60 = 68 ⇒ sáu mươi tám (khớp 68 bài kệ BJT 1152–1219 của bản Indacanda; tầng ghim Pāli có 69 nhóm khoá vì ngắt nhóm khác nhau, nên tôi không ép số nhóm khoá và chỉ dịch đúng số Pāli ghi).
