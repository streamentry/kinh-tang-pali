       · `aṭṭhapadakatā` (`15.1`) = aṭṭha 8 ⇒ tám lọn (theo `thag16.4:4.1`).
       · `pañcakkhandhe` (`21.3`) = 5 ⇒ năm uẩn.
       · `jātisataṁ` (`31.1`) = jāti + sata 100 ⇒ một trăm lần sinh. `soḷasiṁ` (`32.4`) = 16 ⇒ một phần mười sáu (theo `vv20:7.6`, 3 khoá cùng Pāli). `tiṇṇaṁ vedāna` (`32.2`) = 3 ⇒ ba Vệ Đà.
       · `aṭṭha vimokkhāni` (`33.1`) = 8 ⇒ tám giải thoát.
       · `tevijjaṁ` (`38.2`) = 3 ⇒ ba minh.
       · `Dasa devasahassāni` (`39.3`) = dasa 10 × sahassa 1.000 = 10.000 ⇒ mười ngàn (theo `thag18.1:32.3`). Thang lớn nhân cả số tích lũy: 10 × 1.000, không phải 1.010.
