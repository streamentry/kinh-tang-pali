  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `Māra` → giữ nguyên Māra (`mn50:31.5`, `31.9`, `31.15`); `pāpima` → Ác Ma (`mn50:31.11`); `kaṇha` → Kẻ Đen Tối (7 khoá `mn50`); `antaka` → Kẻ Chấm Dứt (`mn50:31.14`); `yakkha` → dạ xoa (`mn50:31.19`).
    · `maccu` → Thần Chết (`sn5.3:6.3` `đạo quân của Thần Chết`; `sn6.14:6.3` và `ne10:3.3` dùng `tử thần`, 1 khoá `Thần Chết` so 3 khoá `tử thần` cho cụm `maccuno senaṁ`; chọn `Thần Chết` theo `sn5.3:6.3`, không phán chắc vì số khoá ít). `dhunāti` → đánh tan, `dāleti` → phá vỡ (`sn6.14:6.3` dịch `dhunātha` thành `chặn đứng`, `naḷāgāraṁva kuñjaro` ở `sn6.14:6.4` thành `như con voi đánh bay căn nhà bằng lau sậy`, 3 khoá cùng Pāli; vế voi giữ nguyên, vế đạo quân dùng `đánh tan` cho khác `dālemu`).
    · `uñchāpattāgate` → `vui thích phần vụn rơi trong bát xin ăn` (`thag2.18:1.4`, 1 khoá); `āraññika` → vị ở rừng (`mn69:4.1`, `mn69:10.1` `vị tỳ-kheo sống nơi rừng`); `piṇḍapātika` → vị đi khất thực; `rukkhamūlika` → vị ở gốc cây; `sātatika` → bền bỉ (`thag16.7:2.1`–`6.1`).
    · `pisāca` → quỷ (`dn3:1.16.5`, `mn66:6.23`), nên `pisācini` → nữ quỷ; `nava sotāni` → chín lỗ rỉ chảy (`thag4.4:1.3`); `dhiratthu pūre duggandhe` → `Khốn thay thân xác hôi thối này` (`thag4.4:1.1`).
    · `mahāvīra` → đại anh hùng (toàn tầng, ở những khoá có `mahāvīra` hô cách: `đại anh hùng` 33 khoá, `đại hùng` 10 khoá); `sa-môn` theo tầng.
    · `tādī` → bậc bất động (`thag18.1:17.4`, `thag18.1:27.1` `bậc bất động`; `thag1.41:1.4` `không bị lay chuyển`; `dn16:6.10.16` `bậc như như`; `sn22.78:6.4` `bậc như vậy`).
    · `cittakataṁ bimbaṁ` → hình hài được trang điểm; `rūpaṁ` → dung nhan (`thag16.4:1.1`, `2.1`); `āturaṁ bahusaṅkappaṁ` → bệnh hoạn, nhiều toan tính (`thag16.4:1.3`; `mn82:25.3` viết `nhiều mộng tưởng`).
    · `Sāriputta`, `Moggallāna`, `Kassapa`, `Poṭṭhila`: giữ tên Pāli; `Mahāmoggallāna` ở `0.4`, `69.5` (`mn50:1.2` `Tôn giả Mahāmoggallāna`).
    · `anekākārasampanna` → hoàn thiện nhiều phương diện (`sn8.10:5.3` `hoàn thiện mọi phương diện`, 1 khoá; tôi giữ `nhiều` theo `aneka`).
    · `nibbute` → đã bát-niết-bàn (`thag17.3:33.4` `sambuddhe parinibbute` và `thag17.3:34.4` `ānando parinibbuto` cùng viết `bát-niết-bàn`; `dn16:6.10.2` `diệt độ` cho `parinibbute`).
    · `Aniccā vata saṅkhārā` → `Ôi, các hành là vô thường` (`sn15.20:8.1`, `ja95:1.1`, `tha-ap21:4.1`, `tha-ap429:13.1`; 8 khoá cùng Pāli, các biến thể `Các hành quả thật vô thường` ở `dn16`, `tha-ap341`); `uppādavayadhammino` → bản chất là sinh, diệt (5 trong 10 khoá cùng Pāli); `tesaṁ vūpasamo sukho` → sự lắng dịu của chúng là hạnh phúc (3 trong 4 khoá cùng Pāli).
    · `pañcakkhandha` → năm uẩn; `attā` → tự ngã.
    · `ubhatobhāgavimutta` → giải thoát hai phần (`mn65:11.2`, `mn70:15.1`, `mn70:15.3`, `an7.56:7.1`, `an7.56:7.3`); `tevijja` → ba minh; `maccuhāyī` → vượt qua cái chết (`an3.58:9.2`); `dakkhiṇeyya` → xứng đáng được cúng dường; `puññakkhetta anuttara` → ruộng phước vô thượng (`sn11.3:15.4`, `tha-ap45:4.4`, 3 khoá cùng Pāli).
    · `brahmapurohita` → chư thiên Phạm Phụ (`dn21:1.12.71` `Phạm phụ thiên`; `brahmapārisajja` → Phạm Chúng ở `thag18.1:32.4`); `purisājañña` → bậc tuấn mã giữa loài người (`thag12.2:10.1`, `thag18.1:34.1`, `sn22.79:15.1`; `dn32:4.27` viết `bậc cao quý giữa loài người`, 8 khoá).
    · `naradeva` → người và trời (`tha-ap538:24.1` `người và trời`, `bv27:3.2` `người và chư thiên`, `sn1.11:3.3` `chư thiên và loài người`); `puṇḍarīka` → đóa sen (`thag18.1:39.4`; `sn9.14:4.2` `đóa sen trắng`).
    · `nipāta` cuối bộ → Bộ Sáu Mươi Bài Kinh (khuôn `thag17.3:37.6`, `thag19.1:55.6`); `Tatruddānaṁ` → Tóm tắt ở đây (`thag17.3:38.0`, `thag18.1:41.0`, `thag19.1:56.0`).
    · `Itthaṁ sudaṁ āyasmā … thero gāthāyo abhāsitthāti` → `Tôi nghe như vầy: Tôn giả Trưởng lão … đã nói những bài kệ này.` Đó là quy ước của tầng (613 khoá có Pāli mở đầu bằng `Itthaṁ sudaṁ`; 552 khoá viết đúng khuôn này, 17 khoá `đã từng nói bài kệ này`); nghĩa đen của `itthaṁ sudaṁ` là `thế này đã được nói`, bản Việt không đổi quy ước (ghi ở bất định).
    · `sottiya` → bậc tinh thông (`thig12.1:16.4`; `an7.88:1.1` `bậc đa văn`; `mn39:27.1` `người tinh thông`); `ajjhāyaka` → người trì tụng (`tha-ap340:1.3` `Người tụng đọc`; `mn93:15.5` `tinh thông tụng đọc`; ở bài này `trì tụng` để khỏi trùng chữ `tinh thông` dùng cho `sottiya`); `tiṇṇaṁ vedāna pāragū` → `là bậc thành thạo ba Vệ Đà` (5 trong 15 khoá cùng Pāli; `thông thạo ba Veda…` 4 khoá, `thông suốt ba Vệ-đà` 2 khoá).
    · `abhivandati`, `vanda` → đảnh lễ; `namo`, `namassati` → kính lễ.
    · `jimhapatha` → con đường cong (0 khoá cùng gốc); `kummagga` → con đường sai (`mn19:26.6`, `an4.11:10.1` `con đường sai quấy`); `saṁsārena purakkhato` → bị luân hồi dẫn đầu (0 khoá cùng cụm).
    · `lābhasakkāra` → lợi dưỡng và cung kính (`dn25:10.15`, `dn25:13.19`); `kimi` → con dòi; `mīḷha` → phân (0 khoá cùng gốc `mīḷhasallitta`).
    · `vikubbanā` → biến hóa (`ps3.2:15.1`, `thi-ap32:10.2`); `vasī` → tự tại (`thag16.9:18.3`); `iddhiguṇa` → phẩm tính thần thông (`thag16.9:18.3`).
    · `bhavanetti` → sợi dây dẫn đến hữu (`dn16:2.3.8`, `dn1:3.73.1`); `sabbasaṁyojanakkhayo` → sự đoạn tận mọi kiết sử (`thag14.1:13.4`, `thi-ap20:41.4`, 5 khoá cùng Pāli).
    · `Mahāneru` → núi Mahāneru (`dn32:7.2`); `Pubbavideha` → Pubbavideha (`mn50:30.3`).

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `5.4` `paragatte mamāyase`: `mamāyati` là xem là của mình, bám níu (`cnd6:20.6` `xem là của mình`; `mil3.6.1:1.4` `nâng niu`); `paragatte` là thân thể người khác. Sujato `you cherish the parts of others`; Indacanda `nàng còn âu yếm thân thể của người khác`. Bản Việt `xem thân người khác là của mình`: không phán chắc.
    · `5.1`–`8.4` người được gọi: Pāli dùng hô cách giống cái (`kuṭike`, `pisācini`); Sujato dịch trung tính (`you hut`, `you demoness`, `O body`), Indacanda dịch `nàng`. Bản Việt `túp lều`, `nữ quỷ`, `ngươi`, không thêm `nàng` hay `cô`. `6.2` `uragaṇḍi`: Sujato `horns on your chest`, Indacanda `khối u ở ngực`; không có tiền lệ (0 khoá). `7.2` `paribandhaṁ`: nghĩa chướng ngại, ràng buộc; Sujato `full of dung` (có vẻ đọc khác), Indacanda `vật chướng ngại`; bản Việt `là sự chướng ngại`, 0 khoá cùng gốc để phân xử.
    · `9.4` `jaraggavo`: bò già (`pv8:1.4` `con bò già`); `visīdanti` là chìm; bản Việt `lún trong bùn lầy` ghép nghĩa chìm với bùn (`paṅka`).
    · `11.4` `pakkhimā`: `pakkhin` là loài có cánh; Sujato `moth`, Indacanda `bướm đêm`. Bản Việt `bướm đêm`; động từ lược (`xông vào`) lấy từ `āsādi`.
    · `19.3`–`19.4` `Anekākārasampanne … sāriputtamhi nibbute`: định ngữ ở dòng 19.3, tên ở 19.4.
    · `21.1`–`22.4` `parato`: `là cái khác` (Sujato `as other`, `as alien`); xem BÁO `thig7.1:3.4`.
    · `25.1`–`25.2` `bhāvitattena … sarīrantimadhārinā`: Pāli không nêu tên; Sujato `urged by the developed one`; bản Việt không nêu tên.
    · `28.3`–`28.4`: Pāli `Putto appaṭimassa tādino` không nêu `Buddha`; Sujato thêm `of the Buddha`, `thag1.41:1.4` thêm `Đức Phật`. Bản Việt không thêm.
    · `34.2` `māttānaṁ khaṇi`: `khaṇati` là đào; Sujato `Don't ruin yourself`, Indacanda `chớ đào sâu bản ngã`; thành ngữ này có 0 khoá cùng cụm ở tầng (đã dò). Bản Việt `chớ tự làm tổn hại chính mình`; không phán chắc.
    · `34.6` `mā te vijaṭi matthakaṁ`: `vijaṭi` có thể là động từ tách rời, vỡ ra; Sujato `don't let your head explode`, Indacanda `chớ làm vỡ tan cái đầu`. Bản Việt `kẻo đầu ngươi vỡ tung`; 0 khoá cùng cụm để phân xử.
    · `35.2` `saṁsārena purakkhato`: `purakkhata` là đặt trước, dẫn đầu, hoặc tôn trọng; `thag19.1:23.2` đã chọn `vây quanh` cho cùng từ ở ngữ cảnh khác. Bản Việt `bị luân hồi dẫn đầu` (Indacanda `Bị dẫn đầu bởi sự luân hồi`).
    · `36.2` `saṅkhāre adhimucchito`: bản Việt `đắm say các hành` (Sujato `besotted with conditions`).
    · `38.1` `Visallaṁ khīṇasaṁyogaṁ`: `visalla` là không còn mũi tên; `saṁyoga` hiểu là ràng buộc.
    · `41.4` `saṅkhārenupalippati`: Pāli ghim viết không có `na`; Sujato (`He is unsmeared by conditions`), Indacanda (`không bị lấm lem bởi pháp hữu vi`) và cụm so sánh `toyena nupalippati` ở `an4.36:6.2`, `nupalippati toyena` ở `an6.43:16.3` (`Không bị nước làm lấm nhiễm`) đều hiểu là phủ định, nên bản Việt `vị ấy không bị các hành làm lấm nhiễm`. Đây là chỗ bản Việt thêm một phủ định mà dòng Pāli ghim không có; có thể là sandhi của `saṅkhārena nupalippati`. Không có khoá cùng Pāli ở tầng để phân xử.
    · `42.1`–`42.4` `sabrahmakappo`: Sujato `with the age of the Divinity`, Indacanda `luôn cả Phạm Thiên giới`; `thag16.9:18.2` (cùng Pāli, 1 khoá) `cùng cõi Phạm thiên`, bản Việt theo `thag16.9`. `sahassadhā loko`: `mn49:9.3` `thế giới gồm một ngàn phần`, `thag16.9:18.1` `gấp ngàn lần`; bản Việt theo `thag16.9`. `kāle` hiểu là đúng lúc (Sujato `at the time`).
    · `44.1`–`44.2` `Koṭisatasahassassa attabhāvaṁ khaṇena nimmine`: bản Việt giữ thứ tự (một trăm ngàn koṭi, thân hình, hóa hiện); Sujato đọc `likenesses of ten million times 100,000 people`, Indacanda `biến hóa ra trăm ngàn koṭi bản thể của mình`. Bản Việt không thêm `người`.
    · `45.1`–`45.2`: `vasipāramīgato` (toàn hảo về sự tự tại); `asitassa` (của bậc không lệ thuộc; `mn56:29.47` `không lệ thuộc`; `an5.34:10.5` `bậc Vô sự`; `snp3.11:21.2` `Asita` là tên riêng); Sujato `unattached`, Indacanda `bậc không bị vướng mắc`. Không phán chắc đây không phải tên riêng Asita.
    · `51.1`–`51.2`: Pāli `Majjhesarasmiṁ tiṭṭhanti, vimānā kappaṭhāyino` hơi khác `mn50:25.1`–`25.2` (`Majjhe sarassa tiṭṭhanti … kappaṭṭhāyino`) nhưng cùng nghĩa; bản Việt lấy cách dịch của `mn50`.
    · `57.4` `taṇhakkhayavimuttiyo`: dạng số nhiều `vimuttiyo`; `mn50:28.4` `sự giải thoát do đoạn tận ái`, Indacanda `các sự giải thoát do sự cạn kiệt của tham ái`, Sujato `the one who is freed through the ending of craving`. Bản Việt theo `mn50`.
    · `59.2` `Sudhammāyaṁ ṭhito sabhaṁ`: `mn50:29.2` `trước hội chúng ở giảng đường Sudhammā`; Indacanda `Đứng tại cuộc hội họp ở Sudhammā`; bản Việt `đang đứng trước hội chúng ở giảng đường Sudhammā`.
    · `59.5`–`59.6`, `61.1`–`61.2` `vītivattantaṁ … brahmaloke pabhassaraṁ`: bản Việt theo `mn50:29.5`–`29.6`, `29.11`–`29.12` (`ánh sáng … vượt lên trên cõi Phạm thiên`) và Sujato (`radiance surpassing the realm of divinity`); Indacanda hiểu khác (`sự chói lọi ở thế giới Phạm Thiên đang mất dần`) và `sn6.5:7.3`–`8.4` ở tầng dịch `vītivattantaṁ` thành `sự vượt thoát`, `brahmaloke pabhassaraṁ` thành `trong Phạm Thiên giới rực sáng này`. Ba cách hiểu khác nhau cho cùng Pāli; tôi theo cách đã có ở `mn50`, không phán chắc.
    · `63.2` `vimokkhena aphassayi`: Sujato `using the power of meditative liberation`, `mn50:30.2` `bằng sức mạnh của giải thoát`; bản Việt `bằng sự giải thoát`, không thêm `sức mạnh`. `63.4` `bhūmisayā`: `mn50:30.4` `sống trên vùng đất ấy`; Indacanda `những người đàn ông nằm ở mặt đất`; bản Việt theo `mn50`.
    · `65.3` `Bālova`: `bālo + eva` (`chính kẻ ngu`) hay `bālo + iva` (`như kẻ ngu`); `mn50:31.3` Pāli khác (`Bālo ca`). Bản Việt `Chính kẻ ngu`.
    · `68.1` `Karato te cīyate pāpaṁ`: đối tượng của `karato` lược; bản Việt `Khi ngươi làm, điều ác được chất chồng`.
    · `69.1`–`69.2` `Iti māraṁ atajjesi, bhikkhu bhesakaḷāvane`: động từ chủ động (vị tỳ-kheo đã cảnh cáo Māra); bản Việt đặt bị động để chủ ngữ rơi vào dòng sau, khớp thứ tự Pāli (`Māra đã bị cảnh cáo` / `bởi vị tỳ-kheo ở rừng Bhesakaḷā`), không đổi người làm và người chịu.
    · `69.5` `Itthaṁ sudaṁ`: xem thuật ngữ (quy ước của tầng, không phải nghĩa đen).
    · `70.3`–`70.4` `Ekova theragāthāyo … aṭṭhasaṭṭhi bhavanti tāti`: `theragāthāyo` là một hợp từ (các bài kệ của trưởng lão); `thag18.1:41.3` tách `thero gāthāyo`. Bản Việt `chỉ có một vị, các bài kệ của trưởng lão` / `là sáu mươi tám` (phép 5).
    · Xưng hô: `tôi` (lời tự thuật), `ta` (lời Phạm thiên ở `60.3`–`61.4`, theo `mn50:29.9`–`29.14`), `ngươi` (nói với túp lều xương, Māra, Bà-la-môn), `chúng ta` ở `1.3`–`4.3`, `chúng tôi` ở `17.3`, `18.3` (theo `thag16.4:6.3`, `7.3` cùng Pāli).

