       · `Koṭisatasahassassa` (`44.1`) = koṭi 10.000.000 × satasahassa 100.000 = 10^12, tức một trăm ngàn koṭi. Bản Việt giữ thang `một trăm ngàn koṭi` (cùng chữ với `tha-ap82:15.1`, `bv16:3.3`, `bv5:9.1`, `bv17:6.3`, `bv6:12.3`; `pv38:40.1` viết `Hàng trăm ngàn koṭi`), không đổi koṭi ra số.
       · `Sataṁ ayosaṅkū` (`49.1`) = 100 ⇒ một trăm cọc sắt (theo `mn50:24.5`).
