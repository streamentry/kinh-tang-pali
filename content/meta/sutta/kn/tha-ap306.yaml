  NGÔI THỨ NHẤT — đếm lại trên 414 bài `tha-ap`, chỉ khoá kệ `:1.`–`:7.` và đã bỏ công thức
  `Tôi nghe như vầy`: `ta` 172 · `tôi` 165 · `con` 9 · không đại từ 68. Chọn `ta` vì đa số chung và
  vì `Padumakesaravagga` nghiêng về `ta` 6 / `tôi` 1. Cùng ngôi với `tha-ap221` và `tha-ap262` để lát
  này tự nhất quán.

  SỐ THỨ TỰ Ở `:0.3` — ĐO LẠI. Trên 418 bài `tha-ap` có `:0.3` ở Pāli: Pāli CÓ số thứ tự 127 bài,
  KHÔNG có 291 bài; bản Việt giữ số 68, bỏ số 350. Đọc theo góc Pāli thì 289/291 bài không có số
  ở Pāli thì bản Việt cũng không có (99,3%). `tha-ap306:0.3` Pāli là
  `Dhammasaññakattheraapadāna` — KHÔNG có số — nên số thứ tự bị bỏ khỏi `:0.3` và đặt vào khoá đóng
  `:9.1` (`catutthaṁ` → *thứ tư*), đúng như 5 bài anh em cùng phẩm đã có.

  TÊN Ở `:0.3` VÀ TÊN PHẨM Ở `:0.2` — đa số CỤC BỘ của `Padumakesaravagga`, và ở phẩm này đa số là
  ** tuyệt đối**, không phải 3–2 như ở hai phẩm kia: cả 7 bài có `:0.3` đều dùng tiền tố *Bài Kệ
  Tuyên Ngợ*; `:0.2` là *Phẩm Bậc Nhị Hoa Sen* 6 và *Phẩm Padumakesara* 1. Tên riêng giữ dạng Pāli có
  dấu, đúng với cả 7 bài.

  REVIEW ĐỐI KHÁNG — bắt được 3 lỗi bản dịch, đã sửa hết. `Rukkhaṭṭhasseva sambuddho,` bản nháp dịch
  *chính là bậc Chánh Đẳng Giác ngồi nơi gốc cây* — thêm *ngồi* không có trong Pāli; đã bỏ, còn
  *nơi gốc cây*. `Saṅkhittena ca desento,` bản nháp dịch *dạy theo trình tự rõ ràng* — sai hướng nghĩa:
  đo trên tầng thấy cặp `saṅkhitta`/`vitthārena` trong nghĩa thuyết pháp đã được dịch thành *vắn tắt*
  và *chi li* (an3.33:1.7 *Cúi mong Đức Phật thuyết pháp một cách sơ lược, thuyết pháp một cách chi
  li*, và an3.33:1.4), và `saṅkhitta` trong nghĩa *tâm thu hẹp* (23 khoá) là nghĩa khác, không dùng
  được ở đây. Đã đổi thành cặp *cũng có dạy vắn tắt,* / *và có dạy một cách tường tận;* và bỏ đại từ
  *Ngài* ở `3.1` vì chủ thể đã nêu ở `2.3`. `vācāsabhimudīrayaṁ.` bản nháp dịch *giọng nói* — tầng
  dùng *lời nói* (618 khoá có `vācā`, đa số *lời*); đã đổi thành *tiếng nói vang dội khắp nơi.*

  BẤT ĐỊNH CÒN LẠI, ghi ở đây chứ không giải thích trong thân kinh. `rukkhaṭṭha` (1.3) không có một
  tiền lệ nào trong tầng; dịch *nơi gốc cây* theo nghĩa chữ nghĩa. `dhammamasuṇi` (5.2) và
  `dhammasavassi` (5.4) cũng không có tiền lệ ở dạng này; dịch *niệm tưởng về pháp* và *nghe pháp* theo
  cặp khuôn đã có của lớp `…-saññā`/`…-dāna` (tha-ap217:4.4 dịch `buddhasaññāyidaṁ phalaṁ` thành
  *đó là quả báu của Phật tưởng*), nên `5.4` viết theo đúng khuôn *đây là quả báo của việc nghe
  pháp.* đối với 27 bài đã dùng *đây là quả báo của việc cúng dường Đức Phật.* `Tettiṁsamhi ito
  kappe,` (6.1) dịch *Từ ba mươi kiếp trước đây,*: `tettiṁsa` là ba mươi, và chỗ duy nhất trong tầng
  có dạng này là tha-ap98:5.3 nhưng lại đang dịch thành *ba mươi ba kiếp*, nên tôi không bám vào đó.
  `Sutavā` (6.3) là tên riêng, giữ nguyên Pāli; `savassī` là người đã nghe.

  KHAI TÊM VỚI HARNESS: `lọt_pāli` của `_hvi.py` chỉ truyền Pāli của CHÍNH khoá đang xét, nên
  `Dhammasaññaka` ở `:8.1` và `:9.1` bị bắt oan vì Pāli hai khoá đó dùng dạng chủ ngữ
  `dhammasaññako`. Đã tự tra chứng rồi mới khai: dạng trích dẫn có thật trong Pāli `:0.3` của chính
  bài này (`Dhammasaññakattheraapadāna`). `Sutavā` thì có ngay trong Pāli khoá `:6.3` (`Sutavā nāma
  nāmena,`) nên vẫn khai theo cùng cơ chế để khỏi phụ thuộc hoàn toàn vào bộ nhớ tiến trình. Không
  khai bừa từ nào khác.

