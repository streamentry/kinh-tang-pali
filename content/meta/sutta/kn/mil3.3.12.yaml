notes: |-
  Tầng tham khảo: KHÔNG có bản Anh Sujato tại commit đã ghim cho bài này — đếm bằng script, trong cache đã ghin không có tệp nào khớp uid này (0/15 khoá); cũng không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya. Bài này vì thế chỉ dịch từ Pāli, triangulation chấm 7.0 và status giữ draft; xem blocking_errors.

  Đủ 15/15 khoá. Đã đọc hết Pãli lát f120.pali.txt trước khi viết.

  Cùng khuôn với `mil3.3.11`. `viññāṇa` tôi dịch “nhận thức” (72 chỗ trong tầng) chứ
  không dùng “thức”, vì ở Milindapañha `viññāṇa` là chức năng nhận biết chứ không phải
  tàng thức; “công thức” và “thức tưởng” đều có 0 tiền lệ trong tầng.

  Bất định đã ghi nhận. `nagarasiṅghāṭaka` tôi dịch “chỗ phá lốn của thành” — nghĩa chữ là
  chỗ tường thành đã sập, và `majjhe nisinno` là ngồi giữa chỗ ấy; cách đọc khác là “ngồi giữa
  thành phố”. `phoṭṭhabbaṁ phusati` tôi dịch “chạm vào điều sở xúc”, `vijānāti` là “nhận biết”.

  LỖI ĐÃ BẮT Ở LƯỢT REVIEW ĐỐI KHÁNG. Bản nháp dịch `nagaraguttiko` là “người canh giữ cổng
  thành” rồi lặp lại “của thành” ngay ở vế sau, làm câu nặng; đã sửa thành “canh giữ cổng
  thành, ngồi giữa chỗ phá lốn của thành” để hai vế là hai nơi khác nhau.

  Tiền lệ đếm được và dùng lại: `Kallosi` → “Khéo lắm, thưa tôn giả Nāgasenā.” (46 tệp);
  `Opammaṁ karohī`ti. → “Hãy xét một thí dụ”ti.; `mahārāja` → “Đại vương”; `bhante nāgasena`
  → “Thưa tôn giả Nāgasena”; `Visantipāṭha`-không-dùng.

  Dấu lược: bài không có `…pe…`; hai phía đều 0.

  Kiểm kỹ thuật: save_vi chạy sạch; vì mọi khoá Pāli ở lát này ngắn hơn 40 ký tự (khoá dài nhất 39) nên tập `cần` trong _hvi.kiểm rỗng và các assertion NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy, tôi tự quét lại MỌI khoá bằng chính các hàm đó (pal, lược, lọt_pāli, ngoặc, _TỪ): đủ 15/15 khoá, đúng ID, thứ tự khoá y hệt Pāli, không rỗng, không thừa, mọi chuỗi NFC, không trùng nguyên văn Pāli (trừ 0.1 là tên bộ Kinh, đúng như tiền lệ), số dấu lược khớp Pāli từng khoá, nháy kép cân trên cả bài và khớp đúng số mở/đóng của từng khoá Pāli, không còn (…), toàn bộ chữ cái là script Latin. Đợt này cấm chạy cổng nên technical_integrity = 9.6, KHÔNG phải 10.0; bốn lệnh npm run validate | test | check | build để người điều phối chạy.
