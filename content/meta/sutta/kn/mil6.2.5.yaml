notes: |-
  **Bài này có bản song song gần như trùng ý đã dịch, và tôi dùng nó làm tiền lệ chính: `mil6.2.6`** (`Kammajādipañha`, ngay sau, cùng phẩm, cùng đối thủ). Nhờ đó phần lớn văn phong và thuật ngữ của bài này không phải tự phát minh. Cụ thể: `akammajā ahetujā anutujā` → *không do nghiệp, không do nhân, không do thời tiết sinh* (nguyên văn `mil6.2.6:1.5`) · `bhante nāgasena` → *thưa tôn giả Nāgasena* · `mahārāja` → *này Đại vương* · `Āma, bhante` → *“Vâng, thưa tôn giả”ti.* (**8×**) · `Na hi, bhante` → *“Không phải vậy, thưa tôn giả”ti.* (**32×**) · `Katame dve?` → *Thế nào là hai?* (**59×**) · `sammāpaṭipanno ariyasāvako` → *bậc Thánh đệ tử thực hành chính đắn* · `Saccaṁ, mahārāja` → *Đúng vậy, này Đại vương* (*Đúng vậy, này Đại vương* 12 khoá) · `saññāpehi` → *làm cho tôi nhận biết* (`mil6.2.3:4.1`) · `evametaṁ tathā sampaṭicchāmi` → *ta hoàn toàn chấp nhận điều ấy là đúng như vậy* (`mil6.2.6:1.7`, `mil6.2.4:2.4`) · `sampaṭicchāmi` → *chấp nhận*, `Sādhu` → *Lành thay*.

  **7/51 khoá trùng nguyên văn — dùng lại nguyên văn.** `0.1` `Milindapañha` → *Milindapañha* (**199×**; 8 tệp dùng *Mi-lan-đà Vấn Đạo* và 3 tệp *Mi-tiên Vấn Đáp*, đa số 199/210 giữ Pāli; đây là khối tiêu đề sách, giữ Pāli là quy ước của bộ) · `0.2` `Anumānapañha` → *Câu hỏi về suy luận* (**14×**, đối lập giữ Pāli 5×) · `0.3` `Nippapañcavagga` → *Phẩm Năm Điều Đã Vứt Bỏ* (**8×**) · `0.4` và `11.1` dựng theo cặp `mil6.2.6:0.4`/`2.1` (`Kammajādipañha` → *Câu hỏi về những gì do nghiệp sinh ra*, *…thứ sáu*).

  **`9.2` và `9.4` dùng lại nguyên văn dài của `mil6.2.6:1.6`** cho danh sách *đã sinh, chưa sinh, có thể sinh ra, đã qua, chưa đến, đang có hiện hữu* và *mắt, tai, mũi, lưỡi, thân* — cùng một danh sách `viññeyya`, chỉ khác `kammaja/hetuja/utuja` ở bài kia và `uppanna…` ở đây. Không tự dịch lại để tránh hai cách trong cùng một phẩm.

  **Đoạn `9.2`–`9.4` là đối lập có chủ đích, và tôi giữ nguyên phần phủ định.** Vua hỏi nếu Niết-bàn không phải đã sinh… không thể biết bằng mắt… thì hãy nói *không có Niết-bàn*; Nāgasena đáp *có* Niết-bàn, có Niết-bàn chỉ biết được **bằng tâm**, và bậc Thánh đệ tử thực hành chính đắn **thấy** nó. Sự tồn tại của Niết-bàn được giữ bằng vế *có thể biết bằng tâm*, không phải bằng cách bỏ bớt danh sách phủ định — đó là ý nghĩa của cả câu hỏi của vua.

  **`asaṅkhata` → *vô vi* — cần người rà soát chú ý đây là nghĩa kỹ thuật của Milindapañha, không phải “không điều kiện” theo nghĩa thường.** `Asaṅkhataṁ, bhante nāgasena, nibbānan` (9.1) là câu hỏi của vua và `Asaṅkhatattā dhammassā` (8.7) là lý do Nāgasena nêu; `na kehici kataṁ` (9.2) *không ai làm ra được* nối tiếp `asaṅkhataṁ` thành một mệnh đề duy nhất: Niết-bàn là cái **vô vi** và **không do ai tạo ra**. Tôi không dịch `asaṅkhata` là *điều kiện* vì như vậy mất ngay đối lập với `kammaja` ở chính bài này.

  **0 tiền lệ, dựng từ Pāli, ghi lại:** `icchitabbo` → *nên mong muốn có* (đọc theo `mil4.1:8.1` với `icchitabbo`) · `anekasatehi kāraṇehi` → *với hàng trăm lý do* · `jinavacanaṁ` → *lời nói của bậc Chiến Thắng* (`jinaṁ` → *bậc Chiến Thắng*, dn32:4.34, 8×) · `makkhehi` → *đem ra mà đối chiếu* · `anuppādanīyaṁ` → *không thể sinh khởi được* · `sakkaccaṁ` → *thật chu đáo* · `sakkuṇeyya` → *có thể làm được* · `pārimatīraṁ` → *nửa dặm* (tha-ap61:2.2 dịch `aḍḍhakose` là *nửa dặm*) · `upadassayituṁ` → *làm cho … hiện ra được* · `vaṇṇato vā saṇṭhānato vā` → *màu sắc, hay hình dạng* · `upadhāveyyaṁ`/`atthidhamma` không có ở bài này. **Có tiền lệ và đã dùng lại:** `himavantaṁ pabbatarājaṁ` → *núi Himavanta, vị vua các ngọn núi* (sn4.20:2.6).

  **Dấu nháy kép khớp Pāli TỪNG KHOÁ (đếm bằng script):** tổng 31 `“` / 31 `”` / 5 `‘` / 5 `’`, và **từng khoá cũng khớp**. Cấu trúc: `1.1`, `2.1`, `2.5`, `6.1`, `6.2`, `7.1`–`7.4`, `8.2`–`8.4`, `9.1`–`9.4`, `10.1`–`10.9` tự mở tự đóng; `1.2` mở → `1.6` đóng; `2.3` mở → `2.4` đóng; `3.1` mở → `5.2` đóng; `7.5` mở → `8.1` đóng; `8.5` mở → `8.7` đóng. Riêng `3.2`, `4.1`, `4.2`, `8.7` **không** có dấu mở của riêng mình — tôi đã bỏ dấu mở ở đúng các khoá ấy sau một lượt đối kháng.

