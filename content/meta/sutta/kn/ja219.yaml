  hiện hành chỉ có Pháp Cú — giới hạn tham chiếu, không phải lỗi văn bản. `triangulation` 7,6 (≤ 8,0 vì không
  có bản Anh độc lập).
  BẤT ĐỊNH CÒN LẠI (không đưa vào thân kinh): (1) `aṅkitakaṇṇako` đọc "tai xỏ lỗ" theo truyền thống chú giải
  Anh ngữ; nghĩa đen Pāli là "tai có dấu". (2) `taṁ janaṁ` ở `2.6` có thể là một người (người còn lại trong
  nhà) hoặc tập thể (người ta); giữ nghĩa đen *"người ấy"*. (3) Pāli không nói người không râu là ai (nghĩa
  "vợ" thuộc chú giải, không đưa vào thân kinh). `hirañña` chia 2 : 2 giữa *tiền vàng* và *vàng thỏi*.
