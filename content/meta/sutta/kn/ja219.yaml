  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja219:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  GIẢI QUYẾT DRAFT 2026-10-12 (kiểm toán độc lập, đọc đối kháng từng khoá từ Pāli).
  KẾT QUẢ: bản cũ sai nghĩa ở 9/15 khoá thật sự (đều là khoá kệ; 0.1–0.4 và 3.1 đúng). Đã dịch lại
  toàn bộ 10 khoá kệ `1.1–1.4`, `2.1–2.6`; các khoá tiêu đề giữ nguyên. Mục lỗi nghĩa cũ:
  - `2.6` `so taṁ vitudate janaṁ` bị đọc thành *"bán lẻ từng chút cho dân chúng"*: không có từ nào trong
    Pāli là "bán". `vitudati` = đâm chọc, châm chích (tầng có tiền lệ: an6.54 *đâm chọc* 5×, snp3.10 *đâm
    chích*); nay: *"kẻ ấy đâm chọc người ấy."*
  - `2.3` `lambatthano veṇikato` bị đọc *"thoi dài buộc chỉ"*: `lambatthana` = có vú (ngực) thõng; `veṇikata` =
    tóc đã bện (bím). Nay: *"vú thõng, tóc bện,"*.
  - `2.4` `aṅkitakaṇṇako` bị đọc *"kẻ chỉ còn một mắt"*: Pāli nói **tai** (`kaṇṇa`), không có chữ mắt; `aṅkita` =
    có dấu/được đánh dấu, đọc là tai xỏ lỗ (các bản Anh của bộ Jātaka đều là "pierced ears"). Nay: *"lại có
    đôi tai xỏ lỗ;"*.
  - `2.2` `amassuko` = không có râu; bản cũ *"không hề lười"* không có căn cứ. Nay: *"trong đó một người
    không có râu;"*.
  - `2.1` `dve dve gahapatayo gehe` bị đọc *"hai gia trưởng cùng giật lấy đi"* (thêm hành động "giật lấy" không
    có trong Pāli); `dve dve` là phân phối (mỗi nhà hai người). Nay: *"Trong mỗi nhà có hai gia chủ,"*.
    `gahapati` → *gia chủ*: đo trên tầng 836 khoá có *gia chủ* so với 1 khoá *gia trưởng* (chính bản cũ này) và
    26 *cư sĩ*.
  - `2.5` `kīto dhanena bahunā` = được mua bằng nhiều của cải; bản cũ thêm tân ngữ "nó" và hành động "bỏ ra".
  - `1.2` `esā rattiṁ divā kathā` bị đọc *"lời bàn ban ngày của đêm tối"* (đảo nghĩa); nay *"đó là lời bàn đêm
    ngày"*.
  - `1.4` `ariyadhammaṁ apassataṁ` bị đọc *"bạch pháp lành lành"* (chữ vô nghĩa, và thiếu động từ "thấy"); nay
    *"không thấy Thánh pháp."* — `ariyadhamma` → *Thánh pháp* là cách dịch của tầng (24 khoá có chữ này trong
    135 khoá chứa `ariyadhamm…`, số còn lại là hợp từ như `ariyadhammassavana`; *bạch pháp* chỉ có ở chính bản
    cũ này, 1/135).
  - `1.1` `hiraññaṁ me suvaṇṇaṁ me` bản cũ lặp *"vàng… vàng cũng"* làm mất cặp `hirañña`/`suvaṇṇa`; nay
    *"Tiền vàng của ta, vàng ròng của ta,"* theo tiền lệ `ja534:53.1` và `thig13.5:11.1` (*tiền vàng / vàng
    ròng*); `ja547:50.3` và `:56.1` dùng *vàng thỏi / vàng ròng* (2 : 2, ghi cả hai).
  - `1.3` `dummedhānaṁ manussānaṁ` → *những người thiếu trí* (`dummedha`: *thiếu trí* 13 khoá, *ngu dốt* 9).
  Các mục THUẬT NGỮ/BẤT ĐỊNH CŨ của `ja219` bị thay thế bởi mục này: `veṇikā` → *thoi buộc chỉ*;
  `aṅkitakaṇṇako` → *kẻ chỉ còn một mắt*; `gahapati` → *gia trưởng*; `ariyadhamma` → *bạch pháp*;
  `dummedhāna` → *ngu dốt*; `hirañña`/`suvaṇṇa` → *vàng*/*vàng*; và dòng bất định `ja219:2.3` (đã giải: không phải
  "thoi chỉ" mà là vú thõng, tóc bện). Dòng "dùng nhất quán `gia trưởng` với `ja199:2.1`" không còn áp dụng.
  Các mục của 13 bài anh em trong lát cũ không thuộc bài này và không bị đụng tới.
  KIỂM TRA: 15/15 khoá, tập khoá trùng Pāli; không có Pāli trùng nguyên văn trong chính bài (0 cặp trùng nội
  bộ — phép này chạy rỗng); nháy kép mở ở `1.1`, đóng ở `2.6` đúng như Pāli (chạy qua ranh giới khoá); không có
  `…`/`(…)`; không có số Pāli cần tính; không Pāli lọt vào bản dịch.
  ĐỐI CHIẾU NGOÀI TẦNG (chỉ để kiểm cách đọc, không chép câu chữ): các bản tóm lược tiếng Anh công khai của
  Garahitajātaka cùng nêu "một trong hai chủ nhà không râu, vú dài, tóc bện, tai xỏ lỗ", khớp cách đọc
  `2.2–2.4`. Đây không phải tầng được ghim nên không nâng `triangulation`.
  BLOCKER ĐÃ PHÂN LOẠI: chỉ còn một blocker, loại *thiếu bản Anh upstream* (Sujato không có bài này tại commit
