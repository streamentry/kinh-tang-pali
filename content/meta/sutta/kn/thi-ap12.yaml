notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `thi-ap`.
  Dùng lại nguyên văn 22/34 khoá có tiền lệ: `Therīapadāna` (4×), `Phẩm Ekūposathika` (thi-ap13:0.2), `“Bên bờ sông Candabhāgā,` (3×), `đó là quả báu của việc cúng dường Phật.` (2×), `Vào chín mươi mốt kiếp trước,` (17×), `Bốn vô ngại giải,` (267×).
  NGÔI THỨ NHẤT: bài này dùng `con` cho cả cụm kệ 5–8, theo đúng cụm tiền lệ của thi-ap2/thi-ap4/thi-ap13 cho CHÍNH những Pāli này (`Mọi phiền não của con đã bị thiêu rụi` 3×, `Thật là đón mừng thù thắng thay cho con,` 3×, `con đã làm tròn lời dạy của Đức Phật.` 3×, `con sống đời thanh tịnh không còn lậu hoặc.` 2×, `con không hề biết đến đọa xứ nào` 8×). Năm bài `tha-ap` cùng lát dùng `ta` theo cụm 47×. Vì vậy 7 khoá có Pāli trùng nguyên văn giữa thi-ap12 và các bài tha-ap nhưng Việt khác — đây là khác biệt có chủ đích theo giới của người kể, đã được kiểm bằng `_chk28.py` và ghi ở đây, không phải trôi dạt.
  `Upasiṅghi mahāvīro,` xuất hiện hai lần (2.3 và 3.3) với Pāli trùng nguyên văn nên dịch giống hệt; `vipassī lokanāyako` và `pekkhamānāya me tadā` giữ ngôi thứ ba của Đức Phật Vipassī như Pāli.
  `Ocinitvāna saḷalaṁ` (2.1) dịch `Sau khi đã nâng đống cây sala ấy lên`; `sala` giữ nguyên vì tầng dùng `sala` cho cây (tha-ap448) chứ không phiên âm.
  Bất định còn lại: `ahosiṁ kinnarī tadā` và `Addasāhaṁ devadevaṁ` (1.2–1.3) không có tiền lệ cho cụm này; `devadeva` dịch `bậc Thiên trong hàng Thiên` thay vì `Đức Phật` để giữ nghĩa là `Thiên trong các chúng Thiên`.
  `…pe…` giữ một dấu lược.
