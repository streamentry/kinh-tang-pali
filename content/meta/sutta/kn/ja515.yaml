  Quyết định hội đồng biên tập 2026-10-16: A14 — 29.2 (`uttamāhevanandaho` = kẻ thiêu rụi khu rừng rậm tối thượng: aṭṭhakathā `ahevanaṁ vuccati vanasaṇḍo`), 36.3 (`mā katvā avasī` theo aṭṭhakathā: không làm theo lời ấy mà nấn ná; chú thích bất định giữ); không đổi chữ Pāli ghim; blocker trong meta do điều phối viên xử lý; C3 — `0.2` (tên nipāta "Nhóm N Kệ").

  Nghiên cứu nguồn ngoài 2026-10-16: H.T. Francis (dịch), The Jātaka vol. V (PTS 1905, phạm vi công cộng; đọc qua static.sirimangalo.org/old/jataka/5.htm, Jātaka 515 tr. 31–37); đã đối chiếu toàn bài (kệ 1–40, cả các nhóm lặp điệp khúc); không sửa khoá nào. Francis (đi theo chú giải) đọc 29.2 là ngọn lửa 'trên củi/gỗ thượng hạng' ('choicest wood'), phù hợp với việc hiểu `uttamāhevana` là khu rừng/gỗ tối thượng, không mâu thuẫn quyết định A14 (aṭṭhakathā: `ahevanaṁ vuccati vanasaṇḍo`). Francis dịch 36.1–36.4 là 'hôm nay và ngày mai không bao giờ giống nhau… hãy nhanh chóng nắm lấy cơ hội khi việc nảy sinh', đồng hướng với 'nấn ná' của bản dịch nhưng không phân xử thêm vai trò của `katvā`; vẫn bất định 36.3–36.4, 37.1 (Francis đọc lỏng 'a thought in which his mind may rest') và 7.4 `asamānaṁ` (Francis 'friend').

  Rà từng chữ bằng DPD 2026-10-16: 189 khoá đã rà (bảng tra DPD từng chữ, chú giải Jātaka-aṭṭhakathā bản CST, bản Việt Bhikkhu Indacanda TTPV 33 [515], cùng số); sửa 7.4 (`asamānaṁ` là hiện tại phân từ của `asati` "ăn", DPD asati 3.1, cùng gốc `ghatāsana` ở 29.1; chú giải `bhuñjamānaṁ`, Indacanda "đang thọ thực": "bậc vô song" → "đang dùng bữa"; giải bất định cũ), 9.1 (`pidahissanti` = `pidahissaṁ` + `iti`, ngôi 1 tương lai kèm trích dẫn, không phải "người ta sẽ"; chú giải "…gaṅgaṁ pidahissan"-ti byāpāro uppanno, Indacanda cùng hướng; khớp 9.2–9.3 "tôi không thể lấp"), 28.3 (`gacche` là vị cách của `gaccha` "bụi cây", DPD gaccha 2.1, chú giải `gacchasaṅkhāte mahāvane`: "đi qua rừng" → "lan đi giữa rừng cây bụi"), 36.1 (`saṁseyya` cầu khiến ngôi 3, chủ ngữ là "có người" nói với vua "hôm nay, ngày mai" theo chú giải `koci puṭṭho … katheyya`, không phải Sucīrata "ngài"; nay khớp 36.3 "chớ làm theo lời ấy"); bất định 8.3, 12.3, 16.3, 34.3 (`pucchesi`: chú giải giải là quá khứ "vua đã hỏi", dấu nháy của bản ghim và Indacanda đọc là lời sai "hãy hỏi"; giữ), 37.1 (`ajjhattaññeva`: chú giải là năm uẩn vô thường, chủ ngữ Sucīrata; giữ).
