  - Tầng tham khảo:
    Tầng English của Sujato không có ja515 (Sujato Jātaka chỉ có 83 tệp: ja1–79, ja126, ja159, ja466, ja534; không có uid này); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Tôi dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Tôi có xem thêm một bản Anh cũ phạm vi công cộng (H. T. Francis, E. B. Cowell biên tập, 1905) chỉ để xác nhận người nói ở từng bài kệ và gỡ các chỗ khó (`9`, `29`, `36`–`37`); đó không phải tầng đã ghim, không được dùng làm bản đối chiếu độc lập, và không câu chữ nào được lấy từ đó. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
