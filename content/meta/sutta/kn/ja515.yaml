  - Giải quyết draft 2026-10-12:
    Đọc đối kháng lại toàn bài (189 cặp Pāli↔Việt) từ Pāli root, độc lập với lần chấm trước. Phân loại blocker: `noEnglishEditionUpstream` (thiếu bản Anh Sujato tại commit đã ghim) là sự thật về upstream, giữ nguyên câu blocker; `unresolvedTerm` là lỗi văn bản thật, xử lý từng chỗ như sau.
    + Đã giải quyết `19.4` `te su paññāya no vidū`. Căn cứ: trong Pāli đã ghim, `vidū` còn xuất hiện ở các câu kệ như `vv63:2.4` (`sujāto iti maṁ vidū`), `thag8.1:4.4` (`devāpi naṁ tathā vidū`), `thag4.8:1.2` (`rāhulabhaddoti maṁ vidū`), nơi nó là động từ ngôi thứ ba số nhiều "họ biết", không chỉ là danh từ "bậc hiểu biết"; còn `no` đọc là phủ định vì `20.1` ngay sau nói chính ba vị ấy "không thể nói" khi được hỏi, và cách đọc `no` = đại từ "của chúng ta" không có tiền lệ nào trong bài. Bản Việt `19.4` đổi từ "không phải bậc thấu hiểu bằng trí tuệ" sang "không thấu hiểu bằng trí tuệ" để không ép nghĩa danh từ. Blocker cho `19.4` được gỡ.
    + `6.6` `atthadhammānusiṭṭhiyā`: Pāli chỉ có một danh từ cách dụng/giữ cách (instrumental/dative) "vì sự chỉ dạy về lợi ích và chánh pháp", không có ý "đáp lại"; đổi "để đáp lại lời chỉ dạy" thành "vì lời chỉ dạy" để không thêm quan hệ trao đổi mà Pāli không nêu.
