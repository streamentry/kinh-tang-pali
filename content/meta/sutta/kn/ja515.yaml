notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja515_root-pli-ms.json` (189/189 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ; phần văn xuôi của Jātaka không nằm trong tầng Pāli đã ghim nên bối cảnh câu chuyện chỉ được suy từ chính các bài kệ.

  - Tầng tham khảo:
    Tầng English của Sujato không có ja515 (Sujato Jātaka chỉ có 83 tệp: ja1–79, ja126, ja159, ja466, ja534; không có uid này); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Tôi dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Tôi có xem thêm một bản Anh cũ phạm vi công cộng (H. T. Francis, E. B. Cowell biên tập, 1905) chỉ để xác nhận người nói ở từng bài kệ và gỡ các chỗ khó (`9`, `29`, `36`–`37`); đó không phải tầng đã ghim, không được dùng làm bản đối chiếu độc lập, và không câu chữ nào được lấy từ đó. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
  - Coverage English:
    Mẫu số = 0. Không khoá Pāli nào của bài đạt ngưỡng 40 ký tự theo `source/layers.yaml` (bài toàn kệ ngắn, bỏ khối `:0`), nên cổng coverage không đo được gì; điều đó không có nghĩa là không cần ghi nhận gap. Sujato phủ 0/189 khoá, `english-project` 0/189, `vietnamese-current` 0/189.
  - Phân loại & tiêu đề:
    + `0.1` "Jātaka"; `0.2` "Bộ Ba Mươi Bài Kinh" (Tiṁsanipāta, tiṁsa = 30); `0.3` "Phẩm Mong Muốn Gì" (Kiṁchandavagga, dùng lại nguyên văn `ja511`–`ja514:0.3`); `0.4` "5. Kinh Sambhava" và `41.1` "Kinh Sambhava, thứ năm." (pañcamaṁ = 5, khớp số "5." ở `0.4`) theo khuôn "Kinh <Tên>" / "Kinh <Tên>, thứ n" của `ja511`–`ja514`.
  - Người nói (Pāli không ghi tên; suy từ lời xưng hô và bối cảnh trong bài):
    + Nhà vua (Yudhiṭṭhila, Koravya) nói với bà-la-môn Sucīrata (Bhāradvāja): `1`–`4`, `6`; Sucīrata nói với vua: `5`; người dẫn: `7`, `11`, `15`, `33`; Sucīrata nói với từng người được hỏi: `8`, `12`, `16`, `34`; Vidhura: `9`–`10`; Bhadrakāra: `13`–`14`; Sañcaya: `17`–`18` (và, theo suy luận từ cách xưng hô "thưa bà-la-môn", cả `21`–`32`); Sucīrata nói với Sañcaya: `19`–`20`; Sambhava: `35`–`40`. Quy ước xưng hô: vua xưng "ta", gọi Sucīrata là "ngài"; Sucīrata gọi vua "tâu đại vương", xưng "tôi" với những người được hỏi và gọi họ "ngài", riêng với Sambhava (còn nhỏ) gọi "cậu" ở phần dẫn.
  - Pāli trùng nguyên văn:
    Dò Pāli của 189 khoá với toàn bộ Pāli đã ghim (mọi bộ): 16 khoá dài trên 12 ký tự có ít nhất một dạng trùng ở bài khác. Dùng lại nguyên văn bản Việt có sẵn ở 9 khoá: `0.3` (`ja511`–`ja514`), `2.2` (`ja406:3.2`), `22.1`–`22.2` (`an5.31:9.1`–`9.2`), `26.3` (`tha-ap132:1.3`), `40.1`–`40.2` (`ja290:3.1`–`3.2`), `40.3` (`an5.174:12.3`); `40.4` khớp `pv41:7.6`, `iti71:6.4` về nghĩa (chỉ khác dấu nháy cuối); ở `40.1` lược chủ ngữ "người có giới hạnh" của `ja290:3.1` vì bài này không có. Cố ý khác ở 4 chỗ: `22.3`–`22.4` (`an5.31:9.3`–`9.4` đã lệch dòng so với Pāli: `9.3` Việt "với ánh sáng chiếu tỏ" là nghĩa của `ābhāya` ở dòng sau; ở đây tách đúng theo Pāli); `26.4` (`tha-ap132:1.4` "đàn thú lớn", còn ở đây theo `mil6.3.1:30.2`, cùng cụm `mahābhūtagaṇālayo` khi tả núi Himavanta: "đoàn đại thần linh"); `39.1` (`ja472:4.1` "vụ việc" là ngữ cảnh xét xử, ở đây `ṭhānāni` là "những điều này"). Ngoài lát, chỉ báo, không sửa: `an5.31:9.3`–`9.4` (Việt lệch một dòng so với Pāli).
    Trong chính bài: 20 nhóm Pāli trùng nguyên văn; 19 nhóm có bản Việt giống nhau, 1 nhóm khác có chủ ý (`7.3` = `11.3` = `15.3` = `33.3`: "ông ấy" / "chàng" / "chàng" / "cậu", vì người được nhắc ở mỗi chỗ khác nhau: Vidhura, Bhadrakāra, Sañcaya, Sambhava).
  - Số Pāli:
    `tiṁsa` (`0.2`) = 30 → "ba mươi"; `pañcamaṁ` (`0.4`, `41.1`) = 5 → "5." / "thứ năm"; `tayo janā` (`19.3`) = 3 → "ba người"; `nikkhañcimaṁ suvaṇṇassa` (`6.3`) là một nikkha vàng, không có số đếm. Bài không có số đếm nào khác.
  - Thuật ngữ (có đếm trên tầng):
    + `attha` + `dhamma` đi đôi → "lợi ích và chánh pháp" (khi vua muốn thực hành và đi hỏi); tầng có 6 khoá Việt dịch cặp này thành "nghĩa và pháp" (`an2.41`, `ja269:3.3`, `thig13.2:9.3`, `dhp363:3`...) nhưng đều trong ngữ cảnh giảng pháp, còn ở đây là điều nhà vua muốn thực hành nên chọn "lợi ích" và "chánh pháp" (khớp `ja406:3.2` "chánh pháp"). `adhamma` → "điều không phải chánh pháp" ở `2.2` (nguyên văn `ja406:3.2`) và "phi pháp" ở `2.1`, `38.2`.
    + `rāja` vocative → "tâu đại vương" (50 lần trong các `ja` đã dịch); `brāhmaṇa` vocative → "thưa bà-la-môn" (viết thường 123 so với viết hoa 55 trong các `ja`); `khattiya` vocative → "hỡi khattiya" (`ja517:27.4`, `ja472:14.4`; dạng "Sát-đế-lợi" ở `ja499`, `ja505` và "Khattiya" ở `ja420`, mỗi dạng ít hơn); `korabya` → "Koravya" (theo `mn82:16.3`, `an6.54:9.1`); `yudhiṭṭhila` giữ làm tên dòng họ vua (`ja413:1.2` dịch thành tính từ "dũng mãnh trong trận" nhưng ở đây là chủ ngữ của `iccabravi`, nên giữ tên); `mahābrahmā` (`7.3`, `11.3`, `15.3`, `33.3`) → "vị đại bà-la-môn": chỉ Bhāradvāja, người đến tìm các vị; `dūta` → "sứ giả" (10 khoá `ja`); `cando` → "mặt trăng" (`an5.31:9.1`; dạng "vầng trăng" cũng có nhưng ít hơn).
    + `daharo` → "người còn trẻ"/"còn trẻ"; `kaniṭṭha` → "em trai nhỏ hơn tôi"; `oraso atrajo` → "con ruột, do chính tôi sinh ra" (`thag5.7:4.4`, `tha-ap538:8.2` "con ruột").
    + `pāvako`, `ghatāsano`, `dhūmaketu`, `kaṇhavattanī` → "ngọn lửa", "kẻ ăn bơ lỏng", "lấy khói làm cờ", "để lại vệt đen" (theo `ja345:1.2`, `ja464` và `sn3.1:11.2`).
  - Chỗ bất định (không thêm vào thân kinh):
    + `29.2` `uttamāhevanandaho`: hapax trong toàn Pāli đã ghim; bản Việt "kẻ thiêu đốt lễ phẩm tối thượng" đọc theo cấu tạo (uttama + āhevana "lễ phẩm" + daho) và chưa xác lập được; bản Anh cũ đọc khác ("gỗ thượng hạng"). Blocker `unresolvedTerm`.
    + `36.3`–`36.4` `Mā katvā avasī rājā atthe jāte yudhiṭṭhilo`: cấu trúc và động từ `avasī` không phân xử được; bản Việt đọc `katvā` là "làm vậy" (chỉ lời "hôm nay, ngày mai" ở `36.1`) và `avasī` là "nấn ná", nhưng cách đọc khác (vua cần hành động kịp thời) cũng có thể đúng. Blocker `unresolvedTerm`.
    + `19.4` `te su paññāya no vidū`: `no` đọc là phủ định ("không phải bậc thấu hiểu bằng trí tuệ") vì khớp `20.1` ("các vị không thể nói"); cách đọc khác là đại từ ("những bậc hiểu biết của chúng ta"). `19.1`: `dhammo` dịch "lẽ này" (không rõ chỉ cái gì), `asmāka` đọc "chúng tôi".
    + `8.3` (cùng `12.3`, `16.3`, `34.3`): `pucchesi` dịch mệnh lệnh "Hãy hỏi" vì khớp tình huống vua sai sứ giả; dạng quá khứ 3 ngôi "đã hỏi" cũng có thể. `8.4` `yudhiṭṭhilo` là vua.
    + `9.1`–`9.4`: câu Gaṅgā của Vidhura chỉ dịch sát chữ ("người ta sẽ lấp dòng Gaṅgā lại cho tôi... tôi không thể lấp kín được dòng sông lớn"), nghĩa ẩn dụ không phân xử được từ Pāli; `pidahissanti` không có chủ ngữ.
    + `7.4` `asamānaṁ`: "bậc vô song" (a-samāna "không ai sánh"); cách đọc khác có thể khác nghĩa hoàn toàn. `7.3` `mahābrahmā` xem trên.
    + `13.1`–`13.2`: "bỏ gánh thịt lại, tôi chạy theo con kỳ đà" dịch sát chữ; ý ẩn dụ (đuổi theo thứ vô ích, bỏ thứ có giá trị) không được Pāli nói ra nên không thêm.
    + `28.4` `analo`: "ngọn lửa không biết đủ" (a-nala hiểu là "không thỏa"); cũng là một tên của lửa. `28.2` `accimālī`: "mang vòng ngọn lửa".
    + `37.1` `ajjhattaññeva`: "điều thuộc bên trong" (chỉ nội tâm hay chính bản thân vua), không rõ hơn. `37.3` `niveseyya`: "bước vào"; `38.1` `attānaṁ nātivatteyya`: "không nên vượt quá bản thân" dịch sát chữ; `38.3` `atitthe nappatāreyya`: "không nên đưa qua ở chỗ không phải bến", Pāli không nêu ai được đưa qua.
    + `31.1` `bhadraṁ`: "con vật tốt" (Pāli không nêu loài; thường hiểu là ngựa). `20.3`: "người còn trẻ" chỉ Sambhava.
    + `35.3`–`35.4` `Rājā ca kho taṁ jānāti, yadi kāhati vā na vā`: "còn nhà vua tự biết điều ấy: liệu mình sẽ làm hay không"; chủ ngữ của `kāhati` đọc là vua.
    + `6.3` `nikkha`: đơn vị vàng, giữ nguyên "nikkha". `6.6` `atthadhammānusiṭṭhiyā`: "để đáp lại lời chỉ dạy về lợi ích và chánh pháp".
    + `23.1`–`23.2` `daharūpeto paññāyogena`: Pāli không có động từ; bản Việt không thêm, nối thẳng vào "chớ coi thường cậu ấy".
    + `29.4` `pahūtedho`: "có nhiên liệu dồi dào" (edha "nhiên liệu"); `ja413:2.2` dịch khác ("đống phân") nên không dùng làm tiền lệ.
    + `26.6` `disā bhāti pavāti ca`: "chiếu sáng và tỏa hương khắp các phương"; `pavāti` đọc là tỏa hương.
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 189/189, cùng thứ tự.
    2. Nháy đơn `‘’` và nháy kép `“”` khớp Pāli từng khoá: 0/189 lệch.
    3. Pāli trùng nguyên văn trong chính bài: 20 nhóm, xem trên; Việt khác 1 nhóm (có chủ ý).
    4. Dấu lược `…pe…`/`(…)`: Pāli 0/189 khoá, Việt 0/189 (phép chạy rỗng).
    5. Số Pāli: xem trên.
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng (`Jātaka`, `Sambhava`, `Sucīrata`, `Bhadrakāra`, `Sañcaya`, `Vidhura`, `Bhāradvāja`, `Yudhiṭṭhila`, `Koravya`, `Himavā`, `Gandhamādana`, `Gaṅgā`, `nikkha`). Đã in cặp Pāli↔Việt ra đọc toàn bài (189 cặp).
