notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv25_root-pli-ms.json` (90/90 khoá, đủ và đúng thứ tự Pāli; không có khoá nào ngoài tập Pāli). Tên bài lấy từ chính Pāli `0.3` (`Ubbaripetavatthu`, thứ mười ba của Ubbarivagga); Pāli `ubbarī` là tên người nữ (hoàng hậu của vua Brahmadatta).

  - Tầng tham khảo và coverage English:
    Tầng `english-sujato` không có pv25 (manifest chỉ có `cp dhp iti ja kp snp thag thig ud` dưới `sutta/kn/`); tầng `english-project` của dự án chưa có pv25 (`content/translation/en/project` chỉ có pv48 và pv49 ở bộ pv; `content/meta/en/kn/pv25.yaml` không tồn tại); `vietnamese-current` chỉ có Pháp Cú. Cả ba tầng tham khảo đều vắng nên bài bắt buộc ở draft và `triangulation` đặt 7.0 (≤ 8.0). Mẫu số coverage = 0: khoá Pāli dài nhất của bài là 27 ký tự (không khoá nào đạt ngưỡng 40 ký tự theo `source/layers.yaml`), nên cổng coverage không đo được gì và KHÔNG được trích làm bằng chứng đã có tầng tham khảo. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài và tiền lệ cùng bộ (pv18, ja454 là bản có cùng công thức kệ). Có entry ở `content/meta/reference-gaps.yaml` cũng không cứu được `published`; tệp đó ngoài phạm vi lát này.
  - Tiêu đề & phân loại:
    + `0.1` `Petavatthu` và `0.2` `Ubbarivagga` giữ nguyên Pāli như pv14, pv18, pv19, pv20, pv22, pv23 (cùng phẩm). `0.3` và `20.1` theo khuôn "N. Chuyện Ngạ Quỷ …" / "Chuyện Ngạ Quỷ …, thứ N" của pv18, pv19, pv23. `21.1` `Ubbarivaggo dutiyo` → "Phẩm Ubbarī, thứ hai", theo khuôn "Phẩm Saṅkappa, thứ nhất" (ja260) và "Phẩm Nhỏ là thứ ba" (pv35); giữ tên phẩm là Ubbarī vì `0.2` không dịch tên phẩm. `22.1` `Tassuddānaṁ` → "Tóm lược:" theo pv12, pv35, cp20, ja10… (tầng còn có "Tóm tắt phẩm" ở ud và iti: đo trên tầng cho 106 cặp Pāli trùng khác nhau ở khoá này, hầu hết là biến thể của cùng nhóm).
    + `23.1`–`23.4` (uddāna, 13 bài của phẩm): `Mocakaṁ` = `Saṁsāramocaka` (pv13; suy từ nhãn, không có tiền lệ dịch), `mātā` = mẹ trưởng lão Sāriputta (pv14), `mattā` = pv15, `Nandā` = pv16, `kuṇḍalī` = `Maṭṭhakuṇḍalī` (pv17), `ghaṭo` = pv18 (tên vị Ghaṭa trong bài Kaṇha), `dve seṭṭhī` = pv19 + pv20 (đúng hai bài; cùng quy tắc `dve` + số nhiều = hai bài đã dùng ở pv35), `tunnavāyo` = pv21 (đã đối chiếu nhãn `9. Aṅkurapetavatthu`; `tunnavāya` là thợ may, tôi dịch theo nghĩa chữ, không xác nhận được vì sao pv21 mang nhãn này), `uttara` = pv22, `sutta` = pv23, `kaṇṇa` = pv24 (`Kaṇṇamuṇḍa`), `ubbarī` = pv25. Tên giữ Pāli, từ chung dịch ("Mẹ", "Hai Trưởng Giả", "Người Thợ May", "Kinh Tương" theo pv23) — theo cách pv12 viết hoa chữ đầu từng mục.
  - Số Pāli — tự tính:
    + `chaḷāsītisahassāni` (7.1) = cha 6 + asīti 80 = 86, sahassa 1000 → 86.000 → "Tám mươi sáu ngàn". Chứng cứ từ tầng: `Chaḷasītisahassāni` → "Tám mươi sáu ngàn" ở tha-ap474, tha-ap485, tha-ap560 (3/3), `Chaḷāsītimhito kappe` → "tám mươi sáu kiếp" (tha-ap201:5.1). Hai khoá khác có Pāli `Chaḷāsītisahassāni` y hệt nhưng dịch SAI số: `tha-ap17:4.3` "Tám mươi ngàn thiên nữ" (thiếu 6.000) và `pv35:6.1` "Suốt bảy trăm hai mươi ngàn năm" (720.000, không khớp 86.000 và thêm đơn vị năm). Đã báo, KHÔNG sửa vì ngoài lát. Pāli không có danh từ đi kèm `sahassāni`; đối tượng được đếm suy từ 7.2–7.3 (những người cùng tên Brahmadatta); bản Việt giữ nguyên "Tám mươi sáu ngàn" ở 7.1 và để "mang tên Brahmadatta" ở 7.2, không thêm danh từ.
    + `pañcāla`, `cūḷanī`, `uruvelā` không phải số. `terasamaṁ` (20.1) = thứ mười ba, khớp số `13.` ở `0.3`; `dutiyo` (21.1) = thứ hai. Không còn số nào khác.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + Pāli trùng nguyên văn với bài khác: đã dò 14 khoá có Pāli trùng (574 cặp kể cả 22.1); bản Việt khác ở 154 cặp, trong đó 106 cặp là `22.1` (Tassuddānaṁ), còn 48 cặp ở 13 khoá còn lại. Của 48 cặp ấy: (a) ngôi/đại từ đổi cho khớp ngữ cảnh (ta → tôi vì bà Ubbarī là phụ nữ nói với một ẩn sĩ; "người ấy" → "vị ấy"); (b) `13.2`/`13.3`/`13.4` theo pv18:16.2–16.4 và ja454:12 (bơ lỏng, rưới nước, dập tắt) chứ KHÔNG theo ja352, ja372, ja410, ja449, pv8 (5 tệp dịch `ghatasittaṁva pāvakaṁ` là "cành cây khô bị lửa thiêu đốt" và `Vārinā viya osiñcaṁ` là "nước sóng vọt vào"): `ghata` là bơ lỏng, `sitta` là được rưới, nên "cành cây khô" không có căn cứ trong Pāli; đã báo, không sửa ngoài lát; (c) `18.2` "qua" thay vì "đến" (ja382) hoặc "nơi" (ja478): `vicarantī` + đối cách = đi qua; (d) `17.4`/`19.2` thêm "để được" trước "sinh lên cõi Phạm" vì `brahmalokūpapattiyā` là cách dative/instrumental chỉ mục đích (snp1.7:27.6 dịch "Được sinh lên cõi Phạm" cạnh vế khác).
    + Dùng lại nguyên văn: `13.2`–`13.4` và `14.2` (pv18:16.2–16.4 và pv18:17.2; riêng `14.2` pv8:6.2 dịch "nỗi sầu cắm sâu trong tim" khác một chữ nên chọn pv18). `16.1` theo "Nghe lời nói ấy" (snp5.1, cp11, cp19, cp22; pv18:2.1 và ja454:2.1 là "lời nói ấy của người ấy", ở đây đổi "người ấy" thành "vị ấy"). `17.2` theo ud4.1 "từ nhà ra không nhà". `16.3` "cầm bát và y" theo ud2.3, ud2.6.
    + Trong chính bài có 10 cặp Pāli trùng (`2.3`=`4.5`=`6.5`, `4.2`=`6.2`, `4.4`=`6.4`, `4.6`=`6.6`, `3.4`≈`5.2`, `7.2`=`9.2`, `1.2`=`8.2`, `17.4`=`19.2`), bản Việt cùng một câu ở cả 10 cặp (0 cặp khác); chỉ khác dấu câu cuối ở `3.4`/`5.2` và `17.4`/`19.2`.
    + `rathesabha` → "bậc chiến xa đệ nhất": đo trên tầng 20 khoá, "bậc chiến xa đệ nhất" 9 khoá là dạng đa số (ja260 ×2, ja306, ja333, ja460 ×3, ja482, tha-ap115), các dạng khác 1–2 khoá (ja323 và ja343 "bậc ngự chiến xa", snp3.7 "bậc đầu các cỗ xe", snp2.7 "vị chúa tể xe", ja376 "người cầm xe"). 1.2/8.2 là số ít, 9.4 là số nhiều ("những bậc …").
    + `bhadante` (5.3) → "bạch ngài" (16 so với "thưa ngài" 2 ở tầng kn); `mārisa` (5.4, 11.2) → "thưa ngài" (20 so với "bạch ngài" 1 và "hỡi bạn" 1) — hai tiếng gọi cạnh nhau ở 5.3–5.4 nên dùng hai dạng đa số khác nhau.
    + `kālamakrubbatha` (1.4, 18.4) → "mệnh chung": trong kn, các khoá có `kālaṁ kar-` dịch "mệnh chung" 27, "qua đời" 24, "chết" 13, "mạng chung" 6; chọn "mệnh chung" (cùng pv19:9.2).
    + `susamāgatā` (3.4, 5.2) → "đã tụ họp đông đủ": tầng có hai tiền lệ "tụ họp hòa hợp" (ja492:5.2, ja492:20.2) và một "hội tụ đông" (ja323:3.2); chọn "đông đủ" vì `su-` là "đầy đủ" và không thêm nghĩa "hòa hợp".
    + `āḷāhana` (2.1, 4.1, 6.1, 7.3) → "nơi hỏa táng": 0 tiền lệ trong kn ngoài `thig3.5:1.5` `Etamhāḷāhane daḍḍhā` → "đám thiêu"; chọn "nơi hỏa táng" cho cả bốn lần để chỉ cùng một chỗ.
    + `isi` → "ẩn sĩ", `muni` (3.2) → "hiền giả" (thig3.5:3.4 "bậc hiền giả"), `mahāmuni` (15.4) → "bậc đại hiền giả" (tha-ap45 "bậc Đại Hiền", thag2.30 "bậc đại ẩn sĩ", thag1.110 "bậc Đại Muni": 3 cách khác nhau, tầng chưa thống nhất); `samaṇa` (16.2) → "sa-môn"; giữ ba từ riêng cho ba chữ Pāli.
    + `mahesittamakārayi` (10.2): tiền lệ `thi-ap1:15.4`/`:16.4` `mahesittamakārayiṁ` → "tôi đã giữ ngôi hoàng hậu" (2/2); dùng "ngôi hoàng hậu". Các khoá khác có `mahesitta-` (thi-ap5:4.2/4.4, thi-ap6:8.2/9.2, thi-ap7:3.4/4.2) dịch là "Đại Ẩn Sĩ" hoặc "cai trị"; chưa đối chiếu ngữ cảnh từng bài nên không dùng làm tiền lệ.
    + `virājetvā` (19.3): tầng dịch `kāmarāgaṁ virājetvā` là "ly tham" (snp1.7:27.3, snp1.9), "lìa dục" (thig1.14), "đẩy lùi" (ja431:9.3); ở đây tân ngữ là `itthicitta` nên "ly tham tâm nữ nhân" sẽ lệch tiếng Việt; chọn "lìa bỏ" (không thêm "tham").
    + `pabbaji anagāriyaṁ` (16.4) → "xuất gia, sống đời không nhà" ; `agārasmā anagāriyaṁ` (17.2) → "từ nhà ra không nhà" (ud4.1, ud5.6 đa số).
    + `bahubhāsasī`, `ātume` — xem phần Bất định.
  - Dấu nháy và người nói: Pāli có nháy kép “ ” ở 16 khoá — `4.1` mở và `4.6` đóng (lời ẩn sĩ hỏi, có nháy đơn ‘ ’ quanh tiếng khóc ở `4.6`), `5.3` mở và `6.6` đóng (người đứng đó đáp, cũng có nháy đơn ở `6.6`), `7.1`/`7.4` (ẩn sĩ), `8.1`/`8.4` (bà Ubbarī), `9.1` mở và `10.4` đóng (ẩn sĩ), `11.1`/`11.4` (bà), `12.1`/`12.4` (ẩn sĩ), `13.1` mở và `15.4` đóng (bà). `2.4` có `brahmadattāti` KHÔNG nháy trong Pāli nên bản Việt cũng không nháy ("bà khóc gọi: Brahmadatta ơi!"). Bản Việt khớp Pāli từng khoá (16 khoá có nháy / 90, nháy đơn ở 2 khoá, 0 lệch), dấu lược `…` 0/0 (Pāli không có `…` nào, cũng không có `(…)`).
  - Bất định — ghi lại, không thêm vào thân kinh:
    + `ātume` (11.1): hình thái này chỉ xuất hiện ở đúng khoá này trong toàn tầng Pāli kn (0 khoá nào khác): đây là hapax; `ātuma` có ở snp4.3, snp4.12, snp4.14 (`ātumānaṁ` = "bản thân"), nhưng không xác lập được `ātume` có phải dạng cách khác của từ đó hay không. Bản Việt KHÔNG dịch chữ `ātume` mà chỉ dịch phần còn lại (`itthibhūtāya` = "là phụ nữ", `dīgharattāya mārisa` = "từ lâu rồi, thưa ngài"), thay vì bịa nghĩa. Bởi vậy `11.1`–`11.4` là phần thiếu chắc chắn nhất của bài và đã nâng thành blocker thứ hai.
    + `11.3`–`11.4` `Yassā me itthibhūtāya, saṁsāre bahubhāsasī`: `yassā` là đại từ quan hệ giống cái, không có vế tương liên rõ; dịch "Với tôi, người là phụ nữ như thế" và `bahubhāsasī` đọc là `bahu bhāsasi` ("ngài nói nhiều"), `saṁsāre` đọc là "trong luân hồi". Câu 12 (ẩn sĩ đáp: đã là nữ, đã là nam, đã vào thai loài thú) giúp đoán ý, nhưng không đủ để xác lập từng chữ của 11.
    + `sabbe vāhesuṁ rājāno` (9.1): đọc là `sabbe va ahesuṁ rājāno` (`va` nhấn mạnh + `ahesuṁ` = "đã là", cùng khuôn `ahu rājā` ở 1.1) → "Tất cả đều đã là vua". Cách đọc khác là động từ `vāhesuṁ` (của `vāheti`, "gánh, điều hành"), khi đó phải thêm tân ngữ "việc nước" mà Pāli không có; không chọn.
    + `mahesittamakārayi` (10.2): `akārayi` là ngôi thứ ba trong khi `anusocasī` (10.4) là ngôi thứ hai; bản Việt dịch với chủ ngữ "ngươi" theo mạch (người được hỏi là bà Ubbarī). Cách đọc khác: chủ ngữ là từng vị vua ("mỗi vị vua đã phong bà làm hoàng hậu"). Không đổi nghĩa chính của câu.
    + `nānāgandhasameritaṁ` (4.2, 6.2): `samerita` (từ `sam` + `īr`) hiểu là "được khuấy động / lan tỏa"; 0 tiền lệ trong tầng; dịch "đủ loại hương thơm lan tỏa", đây là cách hiểu theo ngữ cảnh hương thơm của giàn hỏa táng, không phải chữ của Pāli.
    + `Evametaṁ atītānaṁ` (12.3): `atītānaṁ` đứng không có danh từ; "đời" được hiểu ngầm theo ngữ cảnh luân hồi ("Những đời đã qua là như thế"). `ahu`, `āgamā` ở 12.1–12.2 không có chủ ngữ nên bản Việt cũng để trống chủ ngữ.
    + `pasuyonimpi` (12.2): `pasuyoni` dịch "thai loài thú" (yoni = thai/cách sinh); 0 tiền lệ trong tầng (`pasuyoni` 0 khoá).
    + `kuṇḍalīnā` (23.2): nhận là `Kuṇḍalī` (pv17 `Maṭṭhakuṇḍalī`) cộng một âm `nā` không giải thích được (không phải số ít cách công cụ rõ ràng vì không có động từ); bản Việt bỏ `nā`, không thêm nghĩa.
    + Số `13.` ở `0.3` là số trong phẩm Ubbarivagga (pv25 là bài thứ 13 của phẩm), giữ nguyên như pv18, pv19, pv23.
    Vì các chỗ trên và thiếu bản Anh độc lập, `semantic_fidelity` 8.8, `grammar_logic` 8.8, `ambiguity_integrity` 8.0.
  - Kiểm tra: 90/90 khoá đúng tập và thứ tự Pāli; NFC, không khoá rỗng, không khoảng trắng thừa; nháy kép và nháy đơn khớp Pāli từng khoá (16 khoá có nháy / 90); 0 dấu lược; không Pāli lọt vào thân bản dịch ngoài tên riêng (Petavatthu, Ubbarivagga, Brahmadatta, Pañcāla, Ubbarī, Cūḷanī, Uruvelā, Mattā, Nandā, Kuṇḍalī, Ghaṭa, Uttara, Kaṇṇa). Đã đọc đối chiếu từng cặp Pāli↔Việt.
  - technical_integrity 9.6: cổng kỹ thuật do người điều phối chạy — npm run validate; npm test; npm run check; npm run build.
