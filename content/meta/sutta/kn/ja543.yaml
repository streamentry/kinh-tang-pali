notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Tra tiền lệ (đếm được):** `disa` (phương, hướng) → *phương*, và bốn phương vị →
  *Đông / tây / nam / bắc*. Tiền lệ rõ nhất: `an4.28:5.2` "nếu sống ở phương Tây",
  `an4.28:5.4` "nếu sống ở phương Nam", `mn129:35.3` "chuyển về phương Đông". Vì vậy
  tôi viết hoa chữ đầu của phương vị đứng đầu (*phương Đông*) như tiền lệ đã làm.
  **Bối cảnh đã đọc trước khi dịch:** `140.1`–`140.2` nói các Bà-la-môn thông
  `vāsava` tế lễ khắp mặt đất, `140.4` nói `Saṁvijjamānā janayanti vedaṁ` — tức là
  *ngay trong lúc thờ phụng*, chứ không phải đi từ phương này sang phương khác. Vì vậy
  `Purimaṁ disaṁ pacchimaṁ dakkhiṇuttaraṁ` là **tứ phương** một lượt, tôi dịch thành
  danh sách bốn hướng chứ không thành động từ "đi tới".
  **Không nhân bản chữ "phương":** Pāli chỉ có `disa` **một lần** cho cả bốn hướng; nếu
  viết "phương Đông, phương Tây, phương Nam, phương Bắt" thì thêm ba chữ không có
  trong nguồn. Tôi giữ đúng một chữ "phương" cho cả vế, và bốn hướng vẫn không nhập
  nhằng.
  **0 tiền lệ, đặt mới:** `brāhmaṇā` → *các Bà-la-môn* (`an1.10:2.3` "bà-la-môn
  Pārāsariya" đã có); `vāsava` (thông kinh) → 0 tiền lệ riêng ở khoá này, tôi lược vì
  không nằm trong lát.
