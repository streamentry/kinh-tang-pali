  - Số Pāli:
    `pañcahi sahassehi` (`92.4`, `94.4`; `pañcannaṁ sahassānaṁ` `95.3`) = 5 × 1.000 = 5.000; `sataṁ nikkhaṁ` (`44.3`) = một trăm nikkha, không quy đổi; `caturo jane` (`37.2`) và `caturo janā` (`38.2`) = bốn người; `dasa nāriyo` (`15.4`) = mười người nữ; `tīhi ṭhānehi` (`123.3`) = ba điều (người tụng đọc, người chuyên cầu xin, người giữ lửa tế); `sattarattassa` (`88.3`) = bảy đêm; `satta vassāniyaṁ` (`111.3`) = bảy mùa mưa; `sattadhā` (`181.3`) = bảy mảnh; `vassasahassajīvī` (`133.1`) = sống một ngàn năm; `sahassabāhu` (`130.3`) = ngàn tay; `sahassathambhā` (`24.3`) = ngàn cột; `cāpasatāni pañca` (`130.1`) = 5 × 100 = 500 cây cung; `aṭṭhaṁsā` (`24.1`) = tám cạnh; `anekasataporiso` (`19.4`) = nhiều trăm tầm người; `sahassanettassa` (`26.2`) = Đấng Ngàn Mắt (Sakka); `lohitakkhasahassāhi` (`41.1`) = hàng ngàn kẻ mắt đỏ; `tayo vedā` (`185.1`, `186.1`) = ba bộ Veda; `catunnaṁ` (`186.4`) = bốn thứ (mưu lược của sát-đế-lợi cộng ba bộ Veda); `ito māsaṁ` (`71.2`, `77.2`) = một tháng; `purimaṁ disaṁ pacchimaṁ dakkhiṇuttaraṁ` (`140.3`) = bốn phương. Không có cụm thuộc loại `Tiṁsakappasahassa`.
  - Thuật ngữ (có đếm trên tầng):
    + `nāga` (loài rồng) → "rồng" (26 khoá ja, "Long vương" 5, giữ "nāga" 3; nghĩa "voi" 52 khoá thuộc từ khác; `ja506`, `cp12`); `uraga`, `ahi` → "rắn" (8/9 khoá ja); `mahānāga` → "đại long"; `supaṇṇa` → "kim sí điểu" (60 khoá ja); `garuḷa` giữ nguyên (6 khoá, so với "kim sí điểu" 6).
    + `brāhmaṇa` → "Bà-la-môn"; `khattiya` → "sát-đế-lợi" (68 so với giữ "khattiya" 11); `vessa`, `sudda` giữ phiên âm (2 và 1 khoá).
    + `veda` → "Veda" (111 khoá toàn tầng so với "Vệ-đà" 36; trong ja5xx là 1 so với 2; `ja536` cùng bộ dùng "Veda"); `ajjhāyaka` → "người tụng đọc" (`ja488:6.1`); `yañña` → "lễ tế"/"tế lễ" (84/82 trên 258 khoá; "cúng tế" 11); `mahāyañña` → "đại tế lễ" (`cnd1:4.1`); `yūpa` → "cột tế".
    + `uposatha` → "trai giới" (`ja489:14.5` cùng Pāli; 15 so với "bố-tát" 2 trong ja); `caṇḍāla` giữ nguyên (18 so với "chiên-đà-la" 17); `milakkhu` → "man di" (4/4 khoá); `bhūnahu` → "kẻ phá hoại sự tăng trưởng" (9 trên 12 khoá, kể cả `ja530:21.1`; "kẻ giết người" 1 khoá).
    + `maṇi` → "viên ngọc" (36 so với "ngọc" 30); `sela` → "viên đá ngọc" (để phân biệt trong cùng bài); `nikkha` giữ nguyên (10 khoá); `tapassin` → "khổ hạnh" (36/53); `kokila` → "chim tu hú" (42/61); `koñca` → "sếu" (10 so với giữ "koñca" 5); `cakkavāka` giữ nguyên (28 so với "vịt trời" 7); `kambukāyūra` → "vòng xuyến vàng" (`pv24:6.3`, `pv34:2.5`, `ja506:31.1`); `indagopaka` giữ nguyên (`thag18.1:13.3`, `ja482:3.3`); `rahada` → "hồ".
    + Tên riêng giữ phiên âm: Dhataraṭṭha, Varuṇa, Yamunā, Samuddajā, Brahmadatta, Bārāṇasī, Kāsi, Videha, Bhūridatta, Sudassana, Ariṭṭha, Subhoga, Somadatta, Alampāna (Pāli `54.4`, `97.1`; vocative `Ālampa` ở `92.1`, `101.3` giữ theo Pāli), Ajamukhī, Kosiya, Payāga, Kambala, Assatara (`dn20:11.3`), Mucalinda, Sāgara, Lomapāda, Dudīpa, Ajjuna, Bhīmasena, Vāsava, Maghavā (Sakka/Inda).
  - Chỗ bất định (không thêm vào thân kinh):
    + `dvirasaññu` (`143.4`, `149.4`, `179.4`, `188.4`): hapax trong bài; chỉ có `mnd1:27.14` định nghĩa là "nếm vị bằng hai lưỡi", tức con rắn. Dịch "kẻ hai lưỡi" như một cách gọi chê (hợp với `188.4`, nơi nó đứng làm vị ngữ cho chính những người nêu thuyết Veda), không dịch "con rắn" vì ở `149.4` và `179.4` người bị gọi là Bà-la-môn. `dvirasaññurā` ở `188.4` đọc `rā` là hậu tố số nhiều.
    + `māhu` (`138.4`, `174.4`, `175.2`, `176.4`, `179.4`, `180.4`): đọc "người ta nói" (có thể là `me āhu`, "họ bảo tôi"); `ariyā` (`128.1`, `154.1`) dịch "các bậc cao quý" mà không chỉ rõ là Bà-la-môn, vì `155.4` mới nêu.
    + `41.1`–`41.4`: `parivāritaṁ` là đối cách nên đọc "viên ngọc được hàng ngàn kẻ mắt đỏ vây quanh"; không phân xử được ai là người đang giữ viên ngọc giữa Alampāna và Bà-la-môn, nên các đại từ ở `40`–`47` chỉ dùng "tôi/ông". `46.1` `tayā` dịch "theo ông"; `47.1` `saṁse` đọc "báo cho tôi biết về".
    + `49.3` `āsīvisena vitto`: `vitta` có thể là "hài lòng" hoặc "giàu nhờ"; chọn "hài lòng" theo nghĩa thường gặp. `55.3` `daṇḍena`: đọc "hình phạt", không phải "cây gậy". `59.2` `mahissamapi vivarati`: đọc `mahī assa api vivarati` ("đất cũng nứt ra cho kẻ ấy"). `63.3` `ujjhāpetvāna bhūtāni`: đọc "khiến các loài hữu tình phải bất bình". `66.3` `satthuṁ`: đọc "chế ngự".
    + `70.1` `nābhisasi`: không tìm được tiền lệ trong tầng; dịch "bị điều gì làm khổ" để không nói quá. `95.4` `pāṭibhogo hi kittima`: đọc `kittima` là lời gọi nhà vua ("bậc lừng danh"), căn cứ lời đáp ở `96`; không tìm được tiền lệ cho `kittima` trong tầng.
    + `114`: `lokyaṁ sajantaṁ udakaṁ … komaṁ ajjhoharī bhūto`: đọc `komaṁ` là `ko maṁ` và "ogāḷhaṁ" đứng với "tôi", cùng khuôn với `139.3`–`139.4` (người tụng đọc rưới nước nơi bờ biển bị đại dương nuốt); `lokya` dịch "thế gian" không giải thích thêm. `116.2` `Kāsissa rañño amarādhipassa`: dịch sát chữ.
    + `119.2` `piṅgalaṁ santhatāyutaṁ`: dịch "vàng nâu, trải rộng liền khắp"; `199.4` `kuppila` không có tiền lệ nào trong tầng (hapax), giữ nguyên; `104.1`–`104.2` `siluta`, `silābhu` giữ nguyên, chỉ `deḍḍubha` có tiền lệ ("rắn nước", `thig2.3:1.4`).
    + `127.1` `anittarā ittarasampayuttā` và `127.3` `tadaggarayhañhi`: dịch sát chữ, nghĩa chưa chắc. `141.1` `kalī … kaṭaṁ`: đọc theo nghĩa lượt thua/lượt thắng trong trò xúc xắc; `141.4` `nātivahanti paññaṁ` có hai cách đọc ("không đưa trí tuệ vượt lên" hoặc "không vượt được trí tuệ"). `142.1` `dassa`: đọc "kẻ hung ác". `148.2` `ajjhenamaggiṁ`: đọc "lửa của việc tụng đọc".
    + `171.1` `akāsiyā`: đọc `akasiyā`, "không làm ruộng"; `171.1`–`171.2` có thể có nghĩa khác. `172.1` `bāhārasi`: đọc `bāhā asi`. `180.1`–`180.4`: `mano manussaṁ ajanesi` đọc "Manu sinh ra loài người" (có thể hiểu "tâm sinh ra người"); `vosaggavibhaṅga` dịch "phân chia theo sự ban phát". `183.2`–`183.4` `porisiyaṁ balena`, `asamā samānā`: đọc "sư tử, hổ, báo có nòi giống không đồng đều, con người thì ngang nhau"; hai cách đọc khác khả dĩ. `185.1`, `186.1` `khattiyamantā`: đọc "mưu lược của sát-đế-lợi", cũng có thể là "thần chú". `187.1`, `188.1` `ibbhā`: đọc "người giàu" (ở `dn3`, `dn27` là lời mạt sát, nghĩa khác).
    + `116.5`–`116.6` `ohārituṁ` dịch "kéo xuống"; `120.3` `yasasā jalaṁ` giữ theo `an4.15:2.4`. `77.1` `teyye` đọc `te ayye` ("thưa bà"). `89.3` `tāta` ở đây dịch "này bạn" vì người nói và người nghe không phải cha con.
  - Kiểm kỹ thuật:
    Sáu khoá chỉ có dấu lược Pāli `(…)` (`14.1`, `39.1`, `67.1`, `113.1`, `126.1`, `189.1`) được giữ nguyên `(…)` đúng như tầng Pāli (không dịch, không bung); phép kiểm cấp lát vì thế báo "(…) trần ở 6 khoá" mà đây là hình thức của nguồn, không phải khoá chưa dịch. Không chạy được `npm run validate`, `npm test`, `npm run check` và `npm run build` trong lát này, nên không tuyên bố technical gate pass; `technical_integrity` đặt 9.6 và bốn lệnh ấy còn phải chạy. Đã tự kiểm: tập khoá Việt = tập khoá Pāli (815/815), nháy đơn và nháy kép khớp Pāli từng khoá (132 dấu nháy, 0 lệch), dấu lược cân bằng Pāli từng khoá (0 lệch), không còn Pāli ngoài tên riêng và vài thuật ngữ giữ phiên âm, NFC sạch.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 226 khoá chênh lệch lớn nhất (trên 815 khoá), đọc cả mạch kệ chung quanh → khác nghĩa 26: sửa 1, giữ 4, bất định 21. Sửa 1: 157.4 "vì sao Brahmā lại làm cho thế gian cong vạy?" → "vì sao Brahmā không làm cho thế gian ngay thẳng?" ("nujju" = "na ujjuṁ", phủ định đi với "ujjuṁ" = ngay thẳng; mạch 157.1–158.4 chất vấn việc Brahmā không chỉnh đốn một thế gian đã rối loạn, bản cũ biến câu thành lời buộc tội Brahmā làm thế gian cong). Giữ 4: 174.4, 175.2, 176.4 (bản mù đọc "māhu" là lời cấm "chớ nói"; cùng cụm ở 138.4 là lời thuật "người ta nói", nên giữ) và 33.1 ("dhāraya" là mệnh lệnh "hãy giữ", không phải mô tả "người đeo"). Hầu hết 200 khoá còn lại chỉ khác diễn đạt, ngắt dòng (76.3–76.4, 103.3–103.4) hoặc xưng hô. Sửa nhẹ không đổi nghĩa: 100.4 ("lừa dối dân chúng nặng nề" → "rất nhiều", đúng "bhusaṁ") và 192.1 (bỏ chữ "vàng" mà Pāli không có). Bất định 21 khoá, giữ cách đọc cũ vì Pāli không đủ để phân xử: 6.4 (cách hiểu "khattiyo … samuddajā"), 27.4 ("vasavattinaṁ" là tính chất hay tên một cõi trời), 49.3 ("vitto" là "lừng danh" hay "được làm hài lòng"), 52.2 ("sammantaṁ"), 63.3 ("ujjhāpetvāna": "khiến bất bình" hay "kêu than, tố cáo"; hai nơi khác trong tầng dịch theo nghĩa "báo, kể lể"), 70.1 ("nābhisasi"), 92.3 và 94.3 ("abbhutaṁ": cuộc cá cược hay màn kỳ lạ), 114.1–114.4 (ai nói và "sajantaṁ", "lokyaṁ"), 143.4, 149.4, 179.4, 188.4 ("dvirasaññu" dịch "kẻ hai lưỡi"; chú giải trong tầng ghi "nếm vị bằng hai lưỡi" nên hợp, nhưng ai là đối tượng chưa rõ), 148.2 ("ajjhenamaggiṁ"), 153.4 ("sandhāpitā jantubhi"), 171.1 ("akāsiyā"), 183.2 và 183.4. Số đếm kiểm lại với Pāli (năm ngàn, bảy đêm, bảy mùa mưa, năm trăm cung, một trăm nikkha, ba bộ Veda, bốn người…) đều khớp; Pāli trùng nguyên văn trong bài 49 nhóm, 7 nhóm khác ở xưng hô/dấu câu (anh/ông, ?/;, 138.4 và 174.4/176.4), không khác nghĩa. Không có bản Anh hay bản Việt độc lập khác.
