    Dò Pāli của 815 khoá với toàn bộ Pāli đã ghim (mọi bộ) có bản Việt, loại các khoá dưới 12 ký tự chuẩn hoá: 75 khoá có dạng trùng ở bài khác, tổng 192 cặp, trong đó bản Việt giống hệt (bỏ dấu câu) ở 120 cặp và khác ở 72 cặp. Dùng lại nguyên văn ở 43 khoá: `0.3`, `1.1` (`ja534:95.1`), `5.2` (`ja534:69.4`), `13.3`/`76.3` (`ja540:76.3`), `17.2`/`106.2` (`bv9:1.4`), `24.2` (`vv78:2.2`), `47.2` (`ja530:25.2`), `47.4` (`ja538:74.2`), `51.2` (`ja496:8.2`), `52.1` (`iti68:3.3`), `61.1` (`cnd1:4.1`, `snp5.1:4.1`), `81.1` (`pe1:61.1`), `88.2` (6/6 cặp), `105.2` (3 cặp), `105.4`/`107.4` (`iti26:5.4`, `pv21:74.4`), `121.3` (`ja518:38.1`), `122.2` (`ja373:3.4`), `123.3` (`dhp224:3`), `162.1`–`162.4` (`ja544:54`), `165.2`/`166.2` (3 cặp), `190.1`, `190.3`–`190.4`, `191`, `192`, `193.2`–`193.4`, `194.1` (`ja532:26`–`ja532:30`; `190.2` cũng theo `ja532:26.2`) và `200.4` (`ja503:3.4`); một phần: `10.1`/`38.1` (8/16 cặp), `22.3` (1/3, `thag18.1:13.3`), `46.4` (10/18 cặp), `52.4` (3/8: "không biếng trễ" 3 cặp so với "không mệt mỏi" 4 cặp ở `bv23:12.2`, `thag1.83:1.2`; giữ "biếng trễ" vì Pāli `atandito` là "không lười" và gần nhất là `ja413:2.4`), `68.2` (2/3 cặp), `84.2`/`85.2` (2/3 cặp), `118.2` (3/5 cặp), `120.2` (1/2 cặp), `131.3` (1/2 cặp), `204.2` (2/4 cặp).
