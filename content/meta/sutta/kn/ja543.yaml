notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja543_root-pli-ms.json` (815/815 khoá, đúng thứ tự Pāli, không khoá thừa). Bản trước trong kho chỉ có một khoá (`140.3`); khoá ấy được giữ nguyên vì khớp ngữ cảnh, 814 khoá còn lại được dịch mới từ Pāli. Bài toàn kệ: bốn dòng tiêu đề `0.1`–`0.4`, 204 bài kệ đánh số `1`–`204` (sáu bài chỉ có dấu lược Pāli `(…)` ở `14`, `39`, `67`, `113`, `126`, `189`) và dòng kết bài `205.1`; phần văn xuôi khung truyện không nằm trong tầng Pāli đã ghim, nên người nói được suy từ xưng hô, nháy và mạch của chính các bài kệ. Nội dung chính (suy từ kệ): Dhataraṭṭha, vua loài rồng, đòi cưới con gái vua Brahmadatta xứ Kāsi và cho rồng vào vây Bārāṇasī cho đến khi vua gả (`1`–`14`); Bhūridatta, con của hai người, giữ ngày trai giới trên đống mối, gặp một Bà-la-môn đi săn, mời xuống cõi rồng, đưa viên ngọc cõi trời và hứa ban của cải, vị Bà-la-môn cáo từ (`15`–`39`); sau đó vị Bà-la-môn đi săn thương lượng về một viên ngọc với Alampāna, người trừ độc rắn, rồi chỉ chỗ Bhūridatta nằm cho Alampāna bắt; con ông là Somadatta can cha và bỏ đi (`40`–`66`); mẹ Bhūridatta mơ thấy mất cánh tay phải, các anh em Sudassana, Ariṭṭha, Subhoga đi tìm (`68`–`88`); Subhoga thách Alampāna đấu ở nơi hội chúng bằng Ajamukhī, em gái khác mẹ của mình (`89`–`113`); đoạn đối thoại giữa Subhoga và vị Bà-la-môn đã phản bạn, về thành của Dhataraṭṭha dưới sông Yamunā (`114`–`126`), rồi cuộc tranh luận giữa Ariṭṭha và Subhoga về Veda, lửa, lễ tế giết vật và đẳng cấp (`127`–`188`); cuối cùng người ta hỏi về đoàn tùy tùng rực rỡ đang đến và được đáp rằng họ là các rồng con của Dhataraṭṭha và Samuddajā (`190`–`204`). Phần này không được đối chiếu với văn xuôi nào, nên các dòng tả cảnh và tả người nói dựa hoàn toàn vào kệ.
