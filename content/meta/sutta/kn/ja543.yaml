  Nghiên cứu nguồn ngoài 2026-10-16: E. B. Cowell và W. H. D. Rouse (dịch), The Jātaka vol. VI (PTS 1907, phạm vi công cộng; đọc qua static.sirimangalo.org/old/jataka/6.htm, Jātaka 543 Bhūridatta tr. 83–106, bản Cowell số 543 trùng uid ja543); đã đối chiếu toàn bài (các nhóm 1–204: lời cầu hôn của Dhataraṭṭha, Bhūridatta và vị Bà-la-môn, Ālampāna và viên ngọc, giấc mơ của mẹ, cuộc đấu rắn và ếch, bắt Bhūridatta, tranh luận của Subhoga và Ariṭṭha, đoàn rồng đến); không sửa khoá nào, nghĩa khớp Cowell ở mọi khoá có nội dung riêng, kể cả phần Ariṭṭha bác bỏ Veda và tế lễ (141–188) và phần miêu tả đoàn tùy tùng (190–204). Bất định ghi nhận, không đổi: 6.3–6.4 `khattiyo ca videhānaṁ, abhijātā samuddajā` (Cowell hiểu 'sprung from Videha's khattiya line' gắn với Dhataraṭṭha, bản dịch gắn với việc gả cho một khattiya Videha), 180.1–180.2 `mano manussaṁ ajanesi pubbe` (Cowell dịch 'mind first brought mankind to light', bản dịch 'Manu… đã sinh ra loài người'), 104 `siluta/silābhu` (Cowell 'rat or water-snake', bản dịch giữ phiên âm), 127 (Cowell 'worthless' gắn với Bà-la-môn, bản dịch theo cấu trúc Pāli).

  Rà từng chữ bằng DPD 2026-10-16: 815 khoá đã rà, đối chiếu thêm chú giải Jātaka-aṭṭhakathā (CST, ancient-buddhist-texts.net K10-JA/543; câu đầu `Yaṁ kiñci ratanaṁ atthi` khớp uid); sửa 8.4, 11.4 (`vitatā` là thân rồng giăng ra, chủ cách số nhiều, chú giải vitatasarīrā), 32.4 (`sotthiṁ` trạng từ, DPD safely), 41.3 (`kālaṁ` = sáng sớm, DPD kāla 1.4, chú giải pāto va), 52.2 (`sammanta` = đang sống, DPD, chú giải vasantaṁ), 53.4 (`mama` là "cho tôi", chú giải mayhaṁ pakāsesi), 91.2–91.4 (`avhāyantu` đọc là phân từ "kẻ thách tôi", `mama` đi với lời nói, chú giải avhāyanto, parisā mama vacanaṁ suṇantu), 92.3–92.4 và 94.3–94.4 (`abbhuta` = cuộc cá cược, DPD abbhuta 3, chú giải jūta), 114.1 (`lokya` = thứ nước đời xem là thanh tịnh, DPD (comm) purity, chú giải lokasammataṁ), 124.4 (`yāmunaṁ` là tính từ, núi bên sông Yamunā, chú giải; không có núi tên Yāmuna), 127.3 (`tad-agarayhaṁ` = điều không đáng chê, chú giải agārayhaṁ; không phải "tối thượng"), 130.2 (`bhīmaseno` là tính ngữ "có đạo quân đáng sợ" của Ajjuna, `yo`/`so` số ít, chú giải bhayānakaseno), 140.4 (`vedaṁ` = niềm hoan hỷ, DPD veda 1, chú giải pītisomanassaṁ), 142.2 (`dassa` = âm nối d + `assa`, bỏ "kẻ hung ác" thêm vào, chú giải byañjanasandhimattaṁ), 143.4, 149.4, 179.4, 188.4 (`dvirasaññu` là hô cách gọi Ariṭṭha, một con rắn, DPD dvirasaññū snake, chú giải bhātika/samma dvirasaññu; bản cũ đọc thành chủ ngữ hoặc "những kẻ hai lưỡi", `rā` ở 188.4 không phải hậu tố số nhiều), 168.1 (`saraṇa` = ngôi nhà, DPD saraṇa 1.2, `pavissa` = đi vào, chú giải gehaṁ pavisitvā), 171.1 (`akāsiya` = viên thu thuế của vua, DPD, chú giải), 179.3 (Bà-la-môn bị nuốt, không phải đi nuốt; 179.4 `māhu` = ahu "trở thành", chú giải), 180.2 (`mano` là tâm, không phải Manu, chú giải manomayāva sattā); bất định 12.3, 15.1, 23.3, 27.3, 49.3, 66.3, 70.1, 102.1, 104.1, 127.1, 132.3, 140.1, 141.4, 143.3, 153.4, 164.2 (cùng 167.2, 168.2), 180.4, 183.2, 183.4, 186.4, 187.1 (cùng 188.1), 198.4, 199.4 (DPD thiếu mục hoặc lệch chú giải; cách đọc 