notes: |-
  Dịch từ Pāli root tại commit đã ghim; đủ 61 khoá, thứ tự và tập khoá khớp Pāli, không có khoá ngoài Pāli. Không có bản Anh Sujato, bản Việt phân đoạn hay english-project cho bài này, nên không có đối chiếu English độc lập; bản dịch dựa trên Pāli và tiền lệ đếm được của nhóm tha-ap.

  Tên bài và tên phẩm. 0.3 và translationTitle là cùng một chuỗi, Ký Sự Về Trưởng Lão Quét Dọn Một Lần (sakiṁ là một lần, sammajjaka là người quét dọn); Pāli ở 0.3 không có số thứ tự nên bản Việt không thêm số. Kiểu mở đầu tên: đo ở phạm vi gần (tha-ap380–469) là Bài Kệ Tuyên Ngợ 36, Ký Sự 14, Bài Kệ Tuyên Ngôn 3; đo toàn nhóm tha-ap là Bài Kệ Tuyên Ngợ 234, Bài Kệ Tuyên Ngôn 97, Ký Sự 96. Tuyên Ngợ là chính tả sai, còn Tuyên Ngôn không phải nghĩa của apadāna; bài này theo Ký Sự Về Trưởng Lão, cùng kiểu với tha-ap426 trong cùng phẩm (tha-ap427 và tha-ap428 trong phẩm này dùng Bài Kệ Tuyên Ngôn). Nên để người biên tập phán một lượt cho cả cuốn. 16.1 đọc lại đúng chuỗi ở 0.3 rồi thêm thứ nhất (40 khoá ở tầng kết bằng thứ nhất). 0.1 giữ Therāpadāna (433 so với 11 khoá viết Trưởng Lão Ký Sự). 0.2 là Phẩm Sakiṁsammajjaka, theo 3 khoá cùng Pāli ở tha-ap426, tha-ap427, tha-ap428. Tên người ở 15.1 giữ dạng Pāli Sakiṁsammajjaka, theo cách tha-ap426 giữ Sattakadambapupphiya.

  Số Pāli: ekanavutito (11.1) là eka 1 cộng navuti 90 bằng 91, đã viết chín mươi mốt như 110 khoá cùng Pāli ở tầng; tisso vijjā (13.3) là ba minh; catasso (14.1) là bốn; aṭṭha (14.2) là tám; chaḷa (14.3) là sáu. Không có số lớn và không có cụm Tiṁsakappasahassa.

  Dấu lược: Pāli không có … hay …pe… ở khoá nào của bài, nên bản Việt cũng không có; hai khoá 12.2 và 13.2 ở các bài khác thường bị lược, ở đây Pāli viết đủ nên bản Việt dịch đủ. Ngoặc kép mở ở 1.1 và đóng ở 14.4 đúng như Pāli; không có nháy đơn.

  Tái dùng nguyên văn tầng: 27 khoá có Pāli trùng với bài khác trong nhóm tha-ap (tổng 2.531 cặp Pāli trùng đã dò), trong đó 15 khoá giống hệt cách dịch phổ biến nhất và 12 khoá khác. Phần khác là chủ ý hoặc chỉ khác hoa thường: 1.1 (Vipassino là sở hữu cách của Vipassī, cách đọc cũ Đức Thế Tôn, bậc quán sát tách vipassino thành tính từ), 1.4, 2.3 (sammajjitvāna là quét dọn, không phải sắp xếp), 2.4, 4.3 và 4.4 (pīḷesi là siết chặt, mahabbalo là sức mạnh lớn, không phải nuốt chửng hay đại thần lực), 5.4 (ramāmahaṁ là ta vui hưởng, khác cách dịch cũ ở tha-ap056 và tha-ap434 là dù ở cõi trời ta vẫn rực rỡ lắm, 2 khoá, vì ramati không phải toả sáng), 11.1 (Vào chín mươi mốt kiếp trước theo phạm vi gần 4 so với Từ 1 và theo tha-ap426; toàn tầng Từ 38 so với Vào 34), 11.3 (Ta không còn biết đến đọa xứ theo phạm vi gần 21 so với Ta không biết mình rơi vào khổ đau 18 và theo tha-ap426; toàn tầng 382 khoá có Pāli này, cách dịch phổ biến nhất 134). Dòng thứ ba của mỗi khổ viết hoa chữ đầu theo đa số (1.634 so với 514 khoá toàn nhóm, 171 so với 80 ở phạm vi gần), nên 3.1, 13.3 và 14.3 nay trùng chữ với cách dịch phổ biến nhất. Ngôi kể dùng ta ở mọi khổ: công thức Kilesā jhāpitā mayhaṁ dùng ta 41 so với tôi 12 ở phạm vi gần, 80 so với 31 toàn tầng. Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti dùng dạng Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (437 khoá), không dùng dạng số ít đã từng nói bài kệ này.

  Pāli trùng trong chính bài: một nhóm Pāli (phalaṁ sammajjanāyidaṁ ở 7.4, 8.4, 10.4, 11.4); cả bốn khoá có bản Việt giống hệt, không có cặp nào bản Việt khác.

  Bất định (không thêm vào thân kinh). (1) 4.1 tādimaggena là chữ chỉ thấy trong bài này (0 tiền lệ); đọc là con đường như thế, viết con đường ấy; cách đọc khác là con đường của bậc Tādī. (2) 3.4 paṭikuṭiṁ chưa rõ nghĩa chính xác (trong nhóm chỉ có hai tệp dùng paṭikuṭiko ở nghĩa khác); đọc là paṭi cộng kuṭiṁ, trở về lều, viết đi về lại túp lều. (3) 4.3–5.3: chủ ngữ của gilati không nêu; đọc là con trăn ajagara ở 4.3 nuốt thân xác, nên viết bị động thân xác ta bị nuốt; kaḷevaraṁ là thân xác, không phải tên riêng. (4) 5.1 āsanne giữ nguyên Nghiệp ta đã làm ở ngay đây theo 2 khoá cùng Pāli (tha-ap350, tha-ap523); các bài này chưa giải thích āsanne là gần lúc nào. (5) 8.3 abhantaṁ đọc là không mê loạn (a cộng bhanta); 9.1 majjāmi giữ nghĩa đen là say sưa, không rõ là kiêu mạn hay mê muội. (6) 10.2 Pāli lược động từ (na dussāmi) nên bản Việt cũng để trống động từ ở khoá này. (7) 7.1–7.3 tên bệnh: kuṭṭha là bệnh cùi, gaṇḍa là nhọt, kilāsa là bạch biến, apamāra là động kinh, vitacchikā là ghẻ lở, daddu là hắc lào, kaṇḍu là chứng ngứa; 7 từ này gần như không có tiền lệ trong tầng Việt (kuṭṭha và gaṇḍa chỉ ở vài khoá kinh khác), cách chọn từ chưa kiểm chứng được. (8) 2.2 sammajji viết dạng ngôi thứ ba trong Pāli nhưng chủ thể là người nói (cùng khổ chủ ngữ ahaṁ ở 2.4), viết ngôi ta.

  Cổng kỹ thuật chưa chạy (bị cấm trong lát này) nên technical_integrity đặt 9.6, người điều phối cần chạy: npm run validate, npm test, npm run check, npm run build.
