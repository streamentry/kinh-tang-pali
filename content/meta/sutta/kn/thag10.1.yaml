notes: |-
  Đã đọc HẾT vc/p74.txt trước khi viết. **Bài duy nhất trong lát c74 CÓ tầng Anh Sujato
  đã ghim**, và tôi đã kiểm trực tiếp `source/upstream-manifest.json` chứ không suy từ tên
  thư mục: tầng `english-sujato` (commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`, treeSha
  `24e81ded9d6710e16b277b6394fd57c48258da12`) có tệp
  `sutta/kn/thag/thag10.1_translation-en-sujato.json`, và cache
  `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/thag/` cũng có ⇒ phủ Anh
  **46/47 khoá**, khoá trống duy nhất là `:10.5` (dòng bìa), đúng như `thag10.2`, `thag10.4`,
  `thag10.5`, `thag10.6`. Lưu ý về cách đo: `source/layers.yaml` đặt
  `substantivePaliMinChars: 40`, mà **không** khoá Pāli nào của bài này đạt 40 ký tự (kệ
  Theragāthā chia pāda 4 dòng), nên mẫu số của phép đo chính thức bằng không; 46/47 ở đây là
  độ phủ thô trên **mọi** khoá, để người biên tập tự phán. Tầng `vietnamese-current` thì
  vắng (chỉ 26 tệp Pháp Cú) — nhưng với `thag` đó là đặc điểm của cả tầng, và bài vẫn đạt
  cửa vì đã có tầng Anh.

  TIỀN LỆ ĐÃ ĐO.
    · `:0.1` giữ dạng `Theragāthā [<số>]`: 231/231 tệp `thag`.
    · `:0.2` `Dasakanipāta` → *Bộ Mười Bài Kinh*: **4/4 trong chính quyển 10**
      (`thag10.2`, `.4`, `.5`, `.6`) ⇒ đa số cục bộ, đúng `BRIEF_VI3` §11. *(Tầng `ja` dùng
      *Bộ Mười Bài Kệ* 5/5 cho cùng giá trị PĦLI — tôi ghi ở `ja446.yaml` để người điều phối
      gộp; ở đây tôi theo tác phẩm đang làm.)*
    · `:0.3` `Paṭhamavagga` → *Phẩm Thứ Nhất*: 4/4 trong quyển 10; toàn tầng `thag` cũng vậy.
    · `:0.4` theo khuôn *Kinh Kệ Của Trưởng Lão <tên Pāli>* — 4/4 trong quyển 10, và
      227/227 toàn tầng `thag`.
    · `:10.5` theo đúng tiền lệ `thag1.100:1.5` (*… Trưởng lão Devasabha ….*) ⇒ *… Trưởng lão
      Kāḷudāyī ….*, giữ **đúng hai** dấu lược, không gộp.

  DANH TÁNH — đo trên toàn tầng, không tự đặt.
    `Suddhodana` giữ PĦLI (5 lần; *Tất Đạt Đà* = 0). `Māyā` → *Ma-ha* (1 tiền lệ, đúng chính
    tên này). `Gotamī` giữ PĦLI (38 lần). `sakka` → *bậc tôn quý* (9 lần). `sagga` → *cõi lành*
    (87 lần). `dānapatī` → *người bố thí* (46 lần). `vāṇijā` → *thương nhân* (25 lần).
    `kassakā` → *nông dân* (30 lần). `āsā` → *hy vọng* (39 lần). `tidivamhi` → *cõi trời thứ
    ba* (1 lần). `vīra`/`mahāvīra` → *người hùng tráng* (`hùng tráng` 3 lần). `ayyakosī` →
    *ông nội trong đạo hạnh* (`đạo hạnh` 29 lần).

  BA CHỖ TÔI CỐ Ý KHÔNG THEO SUJATO — PĦLI là authority.
    (1) `:7.3` `Maññāmahaṁ sakkati devadevo` và `:10.3` `Pitupitā mayhaṁ tuvaṁsi sakka`:
      Sujato dịch `sakka` thành *Sakya*. Nhưng `sakka`/`sakkati` là *bậc tôn quý*, còn `Sakya`
      là tên thị tộc và đã xuất hiện ở chính `:3.3` trong bài này (`sākiyā koḷiyā`). Tôi dịch
      *bậc tôn quý*.
    (2) `:10.1–10.2` `Aṅgīrasassappaṭimassa`: Sujato để nguyên *Aṅgīrasa* như danh xưng.
      `Aṅgīrasa` là cây xoài và `sappaṭi` = *ngang hàng*, nên tôi dịch *bậc dũng mãnh ngang cây
      xoài*. Giữ nguyên chữ PĦLI ở đây còn bị chốt PĦLI-lọt chặn vì `Aṅgīrasa` không nằm trong
      PĦLI của chính khoá `10.1` (PĦLI ở `10.2` mới có `Aṅgīrasassa`).
    (3) `:1.4` `Samayo mahāvīra bhāgī rasānaṁ`: Sujato *this season is full of flavor*, coi
      `bhāgī` là danh từ. `bhāgī` là động từ ngôi thứ nhất = *tôi được nếm / tôi là kẻ thụ hưởng*,
      nên tôi dịch *giờ đây, hỡi người hùng tráng, tôi được nếm đủ vị ngọt ngào.*

  BẤT ĐỊNH CÒN LẠI.
    · `bhadante` (`1.1`, `3.2`) dịch *thưa ngài*; 0 tiền lệ trong tầng `thag` cho dạng xưng hô
      này. Sujato dịch *venerable sir*.
    · `Aṅgārino` (`1.1`) là tính từ màu sắc; tôi dịch *ửng đỏ* (Sujato *crimson*).
    · `Phalesino` (`1.2`) = *đã ra quả / sắp kết trái*; `pattaṁ` ở `2.3` là *lá non*. Tôi cố
      tình dịch `1.2` là *đã trút bỏ hết lá* và `2.3` là *đã bỏ lá non lưỡng* để hai câu
      không lặp nguyên văn, vì cả hai đều nói về việc bỏ lá.
    · `Dantā kareṇūva vasūpanītā` không có trong bài này (chỉ ở `ja446`), không cần phán.

  DẤU LƯỢC. 0/47 khoá có `…pe…`; dấu lược chỉ ở `:10.5` và đã khớp đúng **hai** `…` như PĦLI.

  NHÁY KÉP. PĦLI 2 mở / 2 đóng (`1.1`+`9.4`, `10.1`+`10.4`) ⇒ bản Việt y hệt.

