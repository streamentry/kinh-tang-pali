notes: |-
  Đợt 19, làn 78. Dịch từ Pāli root commit đã ghim, đủ 109/109 khoá (4 khoá tiêu đề `:0` + 26 khổ kệ + dòng kết), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; vì vậy người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung kệ (xem bất định 8).

  **Tiêu đề.**
  - `0.2` `Pakiṇṇakanipāta` → “Bộ Tạp Tập” và `0.3` `Sālikedāravagga` → “Phẩm Ruộng Lúa”: dùng lại nguyên văn từ `ja486`, `ja488`, `ja492`, `ja496` (cùng bộ, cùng phẩm). Tên bộ và tên phẩm vẫn chờ người điều phối quyết một lần.
  - `0.4` “2. Kinh Candakinnarī” và `27.1` “Kinh Candakinnarī, thứ hai.”: `Candakinnarī` là tên riêng (candā + kinnarī) nên giữ Pāli, theo khuôn “N. Kinh <tên giữ Pāli>” của `ja486:0.4` (“3. Kinh Mahāukkusa”) và `ja487:0.4`; số `2.` ở `0.4` và `dutiyaṁ` ở `27.1` đều là 2 ⇒ “thứ hai” khớp; câu kết có dấu phẩy trước số thứ tự theo `ja484:18.1`, `ja486`, `ja487`.

  **Pāli trùng nguyên văn trong chính bài (đã quét sau khi nén khoảng trắng): 109 khoá, 15 nhóm.** 14 nhóm bản Việt giống hệt nhau, 1 nhóm khác:
  - Nhóm khác: `5.2` = `25.2` (“yo me icchitaṁ patiṁ varākiyā”): ở `5.2` mệnh đề quan hệ do hoàng tử làm chủ ngữ và động từ `vijjhasi` nằm ở `5.3`, nên bản Việt `5.2` “kẻ đã bắn người chồng yêu quý của tôi, kẻ khốn khổ này,”; ở `25.2` chủ ngữ là vị bà-la-môn và động từ `abhisiñci` nằm ở `25.3`, nên bản Việt `25.2` “ngài, đối với người chồng tôi yêu quý, vì tôi khốn khổ này,” và `25.3` “đã rưới bằng thứ bất tử;”. Hai khoá phải khác vì vị ngữ khác (và ngôi kể khác).
  - 14 nhóm giống hệt: `2.3`=`3.3`=`4.3`; `2.4`=`3.4`; `6.1`=`7.1`; `6.3`=`7.3`; `6.4`=`7.4`; `8.1`=`9.1`; `8.3`=`9.3`=`11.3`; `9.4`=`11.4`; `13.3`…`24.3` (12 khoá); `13.4`…`23.4` (11 khoá); `14.2`=`15.2`; `16.2`=`26.2`; `17.2`…`22.2` (6 khoá); `23.2`=`24.2`. Khác biệt có chủ ý giữa các khoá gần giống: `6.2` “mẹ của ngươi” và `7.2` “vợ của ngươi” (Pāli `mātā` / `jāyā`); `8.2` / `9.2` tương tự; `24.4` có dấu đóng nháy còn `13.4`–`23.4` thì không (Pāli `kassaṁ”.` ở `24.4`).

  **Tiền lệ ngoài bài: đã dò 2 khoá có Pāli trùng nguyên văn với khoá đã dịch ở nơi khác trong tầng (`0.2`, `0.3`); dùng lại nguyên văn 2/2, 0 khoá khác bản có sẵn.** Không còn khoá nào có Pāli (từ 8 ký tự trở lên) trùng nguyên văn với khoá đã dịch trong tầng; vì vậy phần thân kệ không có bản dịch cũ để dùng lại. `ja525:15.1`–`15.2` (“Mā tvaṁ cande rudi, / Mā soci vanatimiramattakkhi;”) gần trùng `10.1`–`10.2` nhưng bản Việt của `ja525` chưa có, nên không có gì để đối chiếu.

  **Số Pāli:** không có số lượng nào cần tính. `tālīsa` ở `12.3` không phải số 40 (xem bất định 5). Số thứ tự `2.` ở `0.4` và `dutiyaṁ` ở `27.1` đều là 2.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `rājaputta` → “hoàng tử” (5.1, 6.2, 7.2, 8.2, 9.2, 11.2): trong cả tầng, các khoá có `rājaputt-` và đã dịch cho “hoàng tử” 11, “vương tử” 16, “thái tử” 6, khác 9; riêng `ja` thì “hoàng tử” 6, “vương tử” 0, khác 5 ⇒ chọn “hoàng tử” theo phạm vi gần nhất (`pv42` cũng “hoàng tử”). Hai số cho đa số khác nhau ở phạm vi toàn tầng (vương tử) và phạm vi `ja` (hoàng tử); ghi lại để người điều phối quyết.
  - `kimpurisa` / `kimpurisī` → giữ Pāli “kimpurisa” / “kimpurisī”: tầng có 25 khoá chứa “kimpurisa” (`ja481:8.4`, `ja481:13.1`, `ja504:1.4`…), đa số giữ Pāli. `kinnarī` trong tên bài giữ Pāli “Candakinnarī”; `thi-ap5:1.2` dịch `kinnarī` thành “nàng tiên nữ kinnara” là cách khác trong văn xuôi, không áp dụng cho tên truyện.
  - `Himavā` / `himavantaṁ` → “Himavanta” (12.2, 17.1–22.1): 65 khoá chứa “Himavanta” trong tầng (đa số), so với 8 khoá “Tuyết Sơn”; giữ “núi Himavanta” theo `ja481:9.2`. Pāli `himavato pabbatassa` dịch “của núi Himavanta”.
  - `gandhamādane` → “núi Gandhamādana” (23.1, 24.1): giữ Pāli theo `ja504:1.3` (cùng bài khác của Jātaka, kimpurisa cũng sống ở đó).
  - `yakkha` → “dạ-xoa” (23.1): tầng 61 khoá “dạ-xoa” so với 11 “dạ xoa” (không gạch nối).
  - `osadhi` → “dược thảo” (23.2, 24.2): tầng có 16 khoá chứa “dược thảo”; `osadhi` còn nghĩa “sao mai” ở `iti27:5.1`, `tha-ap99:2.3`, nhưng ở đây đi với `sañchanne` (phủ kín) nên là cây cỏ.
  - `amatena` (25.3) → “bằng thứ bất tử”: tầng có 71 khoá dịch `amata` là “bất tử” so với 1 khoá “cam lồ”. Không thêm “nước” vì Pāli chỉ nói `amatena`.
  - `sañchanne` → “phủ đầy”; `abhikiṇṇa` → “rải đầy”: theo `pv24:2.1` (“Phủ kín”); `kusumābhikiṇṇasotāyo` không có tiền lệ nào trong tầng.
  - `tagara` (12.3): tầng có 13 khoá chứa `tagara`; `an3.79:7.2` giữ “tagara” nên giữ Pāli. `tālīsa` (cây) không có tiền lệ nào trong tầng (137 khoá chứa `tālīsa` đều là số 40 trong `cattālīsa`…).
  - `paṭimuñcatu` (6.2, 7.2) → “mang lấy”: `ja544:108.2`–`110.2` (cùng công thức nhưng chưa có bản Việt) và `ja497:1.3`, `ja497:12.3` “Hãy quàng … lên cổ” (nghĩa gốc “mặc lên, khoác lên”) đã dò; chọn “mang lấy” cho nghĩa “nhận lấy nỗi sầu vào mình”.
  - `vāḷamiga` (14.2, 15.2) → “thú dữ”: theo `thag11.1:6.4` (“thú dữ”).
  - `bhīruke` → “nàng nhút nhát” (12.1): `ja132:0.4` “Kẻ Nhút Nhát”; `jīvitukāmike` → “muốn được sống” theo `dhp123:3` (“người muốn sống”).

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli mở ở `1.1`, `5.1`, `10.1`, `11.1`, `12.1`, `13.1`, `25.1` và đóng ở `4.4`, `9.4`, `10.4`, `11.4`, `12.4`, `24.4`, `26.4` (7 dấu mở · 7 dấu đóng); Việt cũng đúng 7/7, lệch 0/109 khoá. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0. Khoá kết `26.4` Pāli `…assā”ti.` → Việt kết `nhau.”`: trong tầng, 11.576 khoá Pāli kết `”ti.` đã dịch thì 8.819 kết `.”`, 1.553 kết `”.`, 1.204 dạng khác ⇒ chọn dạng đa số `.”`. Khoá kết `”.` ở Pāli (`4.4`, `9.4`, `11.4`, `12.4`, `24.4`) thì Việt kết `”.` như Pāli.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `Upanīyatidaṁ maññe` (1.1): `idaṁ` không có danh từ đi kèm; dịch “mạng sống này đang bị đưa đi” theo mạch kệ (hơi thở ngưng dứt ở `1.4`, tương tự `upanītavayo` ở Dhp). “Mạng sống” là cách đọc ngữ cảnh, không có trong chữ.
  2. `cande lohitamaddane` (1.2): `lohitamaddane` không tìm được tiền lệ nào trong tầng (0 khoá). Dịch “lấm máu”; `maddana` nghĩa gốc là “nghiền, giẫm”, nên các cách đọc khác là “nhuốm máu”, “ở nơi máu bị giẫm nát”. Không thêm chủ thể của máu vào thân kinh.
  3. `Vassamiva sare pāde` (4.1): `sare` có thể là “ở hồ” (`sara`), “ở lau sậy” hay “mũi tên”; `pāde` có thể là “ở chân” hoặc dạng rút gọn của `pādape` (“cây”). Dịch “hồ nước và cây cối”; ghi lại, không chắc.
  4. `Me ḍayhate nitammāmi` (2.2): `nitammāmi` là động từ hiếm; dịch “kiệt sức” theo nghĩa “mệt lả, héo mòn”. `Na naṁ aññehi sokehi` (2.4, 3.4, 4.4): `naṁ` có thể là “nó” (nỗi đau) hoặc “điều ấy”; dịch “chứ chẳng phải vì những nỗi sầu khác”.
  5. `tālīsatagarabhojanā` (12.3): đọc là hai tên cây `tālīsa` và `tagara` (cặp quen thuộc trong Vinaya), `bhojanā` là tính từ nữ cách một của `kimpurisī` (“người ăn …”). Cách đọc khác: “nơi có thức ăn là tālīsa và tagara”. `tālīsa` ở đây không phải số 40 vì đi với `tagara` thành cặp tên cây.
  6. `vanatimiramattakkhi` (10.2): hapax trong tầng (chỉ còn `ja525:15.2`, chưa có bản Việt). Đọc `vana` + `timira` + `matta` + `akkhi` là “mắt như bóng tối của rừng”; `matta` có thể là “say” hoặc “đo, bằng”. Dịch “đôi mắt như rừng tối”, không chắc.
  7. `ayirabrahme` (25.1): `ayira` = `ayya` (cao quý), `brahme` hô cách của `brahma` / `brāhmaṇa`; dịch “hỡi bà-la-môn cao quý” theo `ja474:1.4` (“hỡi bà-la-môn”). Cách đọc “bậc Phạm thiên cao quý” cũng khả dĩ. `Nānādumavasanāyo` (26.3): `vasana` là “áo” hoặc “chỗ ở”; dịch sát chữ “khoác muôn loài cây”.
  8. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1–4: chồng của Candā (kinnara Canda, bị bắn); 5–9: Candā; 10: hoàng tử; 11: Candā; 12: hoàng tử; 13–24: Candā nói với chồng; 25: Candā nói với vị bà-la-môn (người đã rưới bất tử, `amatena abhisiñci`); 26: Candā nói với chồng. Suy luận này khớp với truyện khung của truyền thống (bản Rouse trong bộ Cowell, 1901, ngoài tầng đã ghim, chỉ để kiểm người nói, không dùng làm nguồn dịch). Ngôi nói trong bản Việt: kinnara và Candā tự xưng “tôi”, gọi nhau “nàng”/“chàng”; hoàng tử tự xưng “ta”, gọi Candā là “nàng”; Candā gọi hoàng tử là “ngươi”. Đây là lựa chọn biên tập theo ngữ cảnh, Pāli không có đại từ ngôi hai.
  9. `Mā ca puttaṁ mā ca patiṁ addakkhi` (8.1, 9.1): dịch “Cầu cho chẳng được thấy …” theo nghĩa cầu nguyện; `kāmā hi` (8.4, 9.4, 11.4): `hi` không dịch riêng (tiểu từ nhấn mạnh). `yo kimpurisaṁ avadhi` (8.3…): bản Việt không đặt đại từ “ngươi” để khỏi gán chủ ngữ ngôi hai khi Pāli chỉ dùng quan hệ từ `yo`.
  10. `Api nūnahaṁ marissaṁ` (11.1): `api nūna` dịch “Dẫu … có phải” (nhấn khả năng); cách đọc khác “thà rằng tôi chết”.

