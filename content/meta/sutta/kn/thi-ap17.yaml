notes: |-
  Mahāpajāpatigotamītheriyāpadāna (Mahāpajāpatī Gotamī), bài thứ bảy của Phẩm Ekūposathika trong Therīapadāna. 771/771 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá nào ngoài tập khoá Pāli. Nội dung: khi Đức Phật ở Vesālī, tỳ-kheo-ni Mahāgotamī nghĩ đến việc nhập Niết-bàn trước Đức Phật và các vị đại đệ tử, năm trăm tỳ-kheo-ni cũng nghĩ như vậy; đất rung, chư thiên khóc; bà từ biệt các tỳ-kheo-ni và nữ cư sĩ, đến lễ Đức Phật, xin được cho phép và xin tha thứ lỗi lầm; dặn Ānanda; kể việc bà chúc Đức Phật sống lâu và lời Đức Phật dạy về cách tôn kính chư Phật; thị hiện thần thông theo lời Đức Phật; kể tiền thân (thời Padumuttara ước nguyện vị trí đứng đầu các tỳ-kheo-ni kỳ cựu, làm vợ người đứng đầu một làng nô lệ xứ Kāsi và cúng dường năm trăm vị Tự Tại, đời cuối là dì và người nuôi dưỡng Đức Phật); năm trăm tỳ-kheo-ni trình bày chứng đắc và xin nhập Niết-bàn; bà lễ chân Đức Phật lần cuối, nhập các tầng thiền theo thứ tự thuận rồi nghịch và nhập Niết-bàn; lễ tang do chư thiên và Đức Phật cùng chư tỳ-kheo cử hành; lời Đức Phật về Gotamī.

  NGUỒN VÀ TAM GIÁC — không có tầng Anh (Sujato) đã ghim, không có `english-project`, không có `vietnamese-current` cho thi-ap; bài dịch từ Pāli root, đối chiếu với các tiền lệ đã dịch trong kho qua chỉ mục Pāli sang Việt dựng trên toàn tầng kn, sn, an, dn, mn: thi-ap18 đến thi-ap20 (cùng phẩm, cùng khuôn Padumuttara, thọ ký tương lai, thần thông và vô ngại giải), thi-ap21 đến thi-ap28, thi-ap30 đến thi-ap32, thi-ap36, thag5.8 và ud8.10 (các câu kệ trùng), tha-ap536, tha-ap550, tha-ap562. Không dùng bản Việt nguyên bài nào ở mục tra cứu toàn văn. Vì vậy triangulation = 7.5 và bài không được coi là đã đối chiếu English.

  TIÊU ĐỀ, TÊN PHẨM VÀ SỐ THỨ TỰ — đo trước khi chốt, ghi cả hai phạm vi (đo trên các tệp thi-ap khác đã có, 39 tệp, và tha-ap, 561 tệp):
  - :0.1 Therīapadāna giữ nguyên Pāli: 38 trên 39 tệp thi-ap (tệp còn lại là thi-ap6, Trưởng Lão Ni Ký Sự).
  - :0.2 Ekūposathikavagga → Phẩm Ekūposathika: 9 trên 9 tệp cùng phẩm (thi-ap11 đến thi-ap16, thi-ap18 đến thi-ap20).
  - :0.3 Pāli là Mahāpajāpatigotamītherīapadāna, không bắt đầu bằng số nên :0.3 không có số; translationTitle bằng đúng :0.3 từng ký tự. Chính sách số thứ tự đo trên 39 tệp thi-ap: 18 tệp có số ở Pāli (12 giữ, 6 bỏ) và 0 tệp thêm số ở chỗ Pāli không có; bài này thuộc nhóm không số.
  - Từ chỉ thể loại apadāna ở :0.3 và :195.1. Phạm vi gần nhất, Phẩm Ekūposathika (9 tệp): Tuyên Ngợ 9, Tuyên Ngôn 0, Ký Sự 0. Toàn thi-ap (39 tệp): Tuyên Ngợ 36, Tuyên Ngôn 2 (thi-ap29, thi-ap30), 1 khác (thi-ap6). Toàn tha-ap (561 tệp): Tuyên Ngợ 255, Ký Sự 156, Tuyên Ngôn 143, 7 khác. Cả hai phạm vi cùng cho Tuyên Ngợ đứng đầu nên giữ Tuyên Ngợ cho khớp các tệp cùng phẩm; chữ này có dấu hiệu là lỗi chính tả của Tuyên Ngôn, người biên tập nên phán một lượt cho cả cuốn chứ không sửa riêng bài này.
  - Tên người ở tiêu đề: Pāli viết liền Mahāpajāpatigotamī; dịch tách Mahāpajāpatī Gotamī, theo thi-ap27 (Bhaddā Kāpilānī, Pāli viết liền) và thi-ap28:3.2 (Gotamī Pajāpatī). Lưu ý an1.235 trong tầng dịch tên này theo Hán-Việt (Ma-ha Ba-xà-ba-đề); các tệp thi-ap và tha-ap giữ nguyên Pāli, nên bài này giữ Pāli.
  - Từ chỉ người: Trưởng Lão Ni ở tiêu đề theo các tệp thi-ap đã dịch. Câu kết :194.1 theo công thức Itthaṁ sudaṁ ... imā gāthāyo abhāsitthāti: đo trên thi-ap và tha-ap, 600 khoá cùng công thức: 592 khoá dùng những bài kệ này, 2 khoá dùng bài kệ này (số ít), 5 khoá dạng khác; dùng dạng 592 vì Pāli imā gāthāyo là số nhiều. Pāli :194.1 không có chữ bhikkhunī nên không thêm Tỳ-kheo-ni (thi-ap5:10.1, Pāli có therī, dịch vị trưởng lão nữ; không có tiền lệ không chức danh). :195.1 sattamaṁ → thứ bảy: đúng vị trí thứ bảy của phẩm (thi-ap11 đến thi-ap20 là mười bài); hình thức Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni X, thứ N theo thi-ap14, thi-ap15, thi-ap16, thi-ap20.
  - :25.1 Paṭhamaṁ bhāṇavāraṁ → Phần tụng đọc thứ nhất: 24 trên 28 khoá bhāṇavāra trong thi-ap và tha-ap dùng Phần tụng đọc thứ N (4 khoá dạng khác); chưa có tiền lệ Paṭhama nên theo dạng đa số (thi-ap18:83.1, thi-ap23:19.1, thi-ap28:57.1, thi-ap35:34.2). Bài chỉ đánh dấu phần thứ nhất, không có phần thứ hai.

  NGÔI KỂ — Mahāpajāpatī Gotamī tự thuật nên lời kể và lời nói với tỳ-kheo-ni, nữ cư sĩ, Ānanda dùng ta (ahaṁ); lời nói với Đức Phật dùng con; các tỳ-kheo-ni nói với Gotamī và Đức Phật (10.4, 13 đến 14, 128 đến 135) và các nữ cư sĩ (22, 146) dùng chúng tôi; lời Đức Phật nói với Gotamī dùng Ta (viết hoa) và bà (theo thi-ap20: ngươi dùng với Paṭācārā, bài này dùng bà vì người nghe là dì của Ngài); lời Ānanda nói với các tỳ-kheo (160.4 đến 164.4) dùng tôi. Đo trong thi-ap đã dịch: đại từ ta/tôi/con ở các bài cùng phẩm: thi-ap11 tôi 27; thi-ap12, 13, 14, 15 con 12, 10, 43, 38; thi-ap16 tôi 9 và ta 7; thi-ap18 ta 85 và con 15; thi-ap19 ta 57 và con 51; thi-ap20 con 69; thi-ap21 đến thi-ap27 ta ở mọi tệp (63, 40, 44, 31, 37, 24, 44). Chọn theo thi-ap18, thi-ap19 và thi-ap21 đến thi-ap27 (bài dài tự thuật nhiều đời): ta cho phần kể, con cho lời nói với Đức Phật; đây là chọn theo phạm vi gần nhất, người biên tập nên phán một lượt cho cả phẩm. Chúng tôi trong thi-ap: 101 khoá, chúng ta 23 khoá, chúng con 3 khoá (toàn tha-ap, thi-ap và thig: chúng tôi 114, chúng ta 129, chúng con 11; chúng ta chủ yếu ở tha-ap, ngôi kể gồm cả người nghe nên không dùng cho các tỳ-kheo-ni nói với Gotamī). Các khoá 129 đến 134 phần lớn dùng lại nguyên văn từ thi-ap30, thi-ap32, thi-ap33 và thi-ap36 (cùng lời các tỳ-kheo-ni nói với Đức Phật); 130.4 và 131.4 (đã làm tròn lời dạy của Đức Phật, không chủ ngữ) theo thi-ap30:55.4 và thi-ap32:43.3.

  SỐ PĀLI — tự tính, in phép:
  - 3.2, 20.2, 121.4 satehi saha pañcahi = pañca 5 × sata 100 = 500 → năm trăm vị (7.1 pañcasatānampi = 500; 168.2 pañcasatānipi = 500 ngôi nhà mái nhọn; 116.1 pañcasatā = 500 vị Tự Tại; 115.1 Pañcadāsasatānūnā = pañca 5 × sata 100 = 500, anūna là không thiếu → không ít hơn năm trăm người nô lệ). 20.4 pañcahi sau satehi (nadīsatehi, hàng trăm con sông) được hiểu là năm trăm theo song song với 20.2; cách đọc khác là năm con sông lớn.
  - 97.1 vīsavassasatikā = vīsa 20 + vassasata 100 = 120 → một trăm hai mươi tuổi (theo cấu tạo; chưa có tiền lệ cùng cụm trong tầng; vīsavassasahassāni ở nhiều bài khác là 20.000 năm, cụm khác).
  - 99.3 Ito satasahassamhi kappe = sata 100 × sahassa 1.000 = 100.000 → cách đây một trăm ngàn kiếp (thì quá khứ, theo thi-ap20:1.3: 21 trên 25 khoá cùng Pāli dùng đúng dạng này). 107.1 Satasahassito kappe cũng 100.000 nhưng là lời thọ ký tương lai nên dịch Sau một trăm ngàn kiếp nữa, theo thi-ap20:9.1 (trong 84 khoá cùng Pāli: 35 dịch Vào một trăm ngàn đại kiếp trước, 18 dịch Sau một trăm ngàn kiếp nữa, 12 dịch Vào một trăm ngàn kiếp trước đây; chọn theo mạch thọ ký tương lai như thi-ap20:9.1).
  - 45.1 Dvattiṁsa = dvi 2 + tiṁsa 30 = 32 → ba mươi hai tướng; ở đây tiṁsa là 30. Không có cụm Tiṁsakappasahassa trong bài, nên phép kiểm cụm chưa phân xử được chạy rỗng, không phải pass. 111.1 Tāvatiṁsa là tên cõi trời (Ba Mươi Ba; 82 trên 89 khoá trong tầng dịch Ba Mươi Ba).
  - 111.3 dasahaṅgehi = dasa 10 → mười yếu tố; 112.1 đến 113.2 liệt kê sắc, thanh, hương, vị, xúc (5), tuổi thọ, dung sắc, an lạc, danh tiếng (4), quyền uy (1) = 10, khớp. 112 đến 113.2 lấy lại nguyên văn thi-ap36:6.3 đến 7.4.
  - 117.2 catumāse = catu 4 + māsa → bốn tháng. 70.4 sattavassāhi = satta 7 + vassa → bảy tuổi. 163.3 pañcanetto = pañca 5 + netta → bậc Năm Mắt. 167.1 Cattāro lokapālā = bốn vị. 193.3 sattabojjhaṅge = bảy giác chi. 131.1 catasso = bốn (vô ngại giải); 131.2 aṭṭhime = tám (giải thoát); 131.3 Chaḷabhiññā = sáu (thắng trí); 130.3 tisso = ba (minh). 89.1 Chassūrodayakāle = cha 6 + sūriya → lúc sáu mặt trời mọc. 91.3 Candasūrasahassāni = hàng ngàn mặt trăng và mặt trời. 92.1 Catusāgara = bốn đại dương. 149 đến 151 paṭhamaṁ đến catutthaṁ = thiền thứ nhất đến thứ tư; 150 là bốn vô sắc xứ theo thứ tự. 195.1 sattamaṁ = thứ bảy.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò (chỉ mục dựng trên các bài kn, sn, an, dn, mn đã dịch ở cây chính, không tính bài này; so không phân biệt dấu câu và chữ hoa đầu dòng):
  - 117 khoá có Pāli trùng byte với ít nhất một khoá đã dịch (kể cả 0.1 và 0.2); 106/117 dùng lại một dạng đã có (đa số là dạng đa số), 11/117 khác, đều có lý do: 3.2, 20.2, 121.4 (tiền lệ duy nhất thi-ap27:50.2 là năm trăm người, là nam; ở đây là năm trăm tỳ-kheo-ni nên dịch vị); 10.1 (tiền lệ là chân Ngài, ở đây là chân Gotamī); 51.3 (tiền lệ thi-ap28:14.3 là với nàng, nói với Yasodharā; ở đây là bà, nói với dì Gotamī); 75.4 (tiền lệ ja435 là tôi hỏi, ja477 là con hỏi; dùng con, theo người nói với Đức Phật, bỏ chữ Xin Ngài vì Pāli không có); 76.1 (tiền lệ thag5.8:4.1 mở bằng Nhìn thấy; ở đây 76.3 là hãy nhìn nên bỏ); 98.3 (tiền lệ thi-ap19:24.3 mở nháy đơn; ở đây khoá mở nháy kép theo Pāli); 103.1 (tiền lệ là lòng tôi bừng khởi niềm tịnh tín ở các bài khác, không khớp mạch Disvā ... pasādetvā ... sutvā; dịch sau khi thấy, làm cho tâm tịnh tín); 106.2 (tiền lệ duy nhất tha-ap536:10.4 dịch Lãnh Đạo; lokanāyaka trong tầng: Dẫn Đạo 189, Lãnh Đạo 17, Dẫn Lộ 7 trên 240 khoá; dùng Dẫn Đạo); 140.1 (tiền lệ là đời cuối cùng của ta; ở đây Idaṁ pacchimakaṁ mayhaṁ lokanāthassa dassanaṁ là lần thấy cuối cùng, theo 140.2).
  - Lấy lại nguyên cả bốn câu kệ của ud8.10:4.1, 4.3, 4.4 và 5.1 đến 5.3 cho 191.1, 191.3, 191.4, 192.1 đến 192.3, và 4.2 cho 191.2; xem bất định số 45. Lấy lại thag16.1:5.2 cho 24.4 (con đường cũng đã được khéo tu tập), thag11.1:8.4/thi-ap20:40.4 cho 26.4, đa số cho 27.1 đến 27.4 (xuất gia, đời sống không nhà, kiết sử), thi-ap28:4.2 cho 152.2, tha-ap537:14.2 cho 154.2, thi-ap19:29.4 cho 143.4, tha-ap1:72.4 cho 87.4, ps3.2:7.4 cho 85.3, thag4.9:1.2 cho 101.2, tha-ap535:31.3 cho 102.1, thi-ap34:2.2 cho 100.2, thi-ap27:2.4 cho 115.4, thi-ap20 cho 107, 108 và 110.2.
  - Trong chính bài có 13 nhóm Pāli trùng nguyên văn: 3.2·20.2·121.4; 4.1·177.1; 4.2·5.2; 8.2·11.2; 12.2·12.4; 26.2·81.3·82.3·130.4·131.4; 34.4·147.4; 80.2·81.2·82.2; 82.1·131.1; 105.4·183.2; 132.2·188.2; 132.3·188.3; 133.2·189.2. Trong đó 11 nhóm có bản Việt giống nhau (khác nhau chỉ ở dấu câu và nháy theo Pāli từng khoá); 2 nhóm khác có lý do: 3.2·20.2·121.4 (3.2 đứng sau Cùng với các tỳ-kheo-ni đã giải thoát nên không lặp Cùng với; 20.2 và 121.4 có cùng với) và 34.4·147.4 (và nói lời này đứng sau đảnh lễ; đã nói lời này đứng sau vuốt ve đầu). Không có cặp Pāli trùng nào trong chính bài mà bản Việt khác vì lỗi.
  - Ba khoá …pe… (80.2, 81.2, 82.2) đều là … đúng một dấu lược; Pāli không có dấu lược ở khoá nào khác nên bản Việt cũng không có.

  NHÁY — nháy Pāli chạy qua khoá; điều kiện đúng là khớp Pāli từng khoá, không phải mỗi khoá tự cân. Pāli bài này có 31 cặp nháy kép và 7 cặp nháy đơn (38 cặp). Nháy kép: 4.1 đến 6.4; 13.1 đến 14.4; 15.1 đến 15.2 (ti ngoài); 16.1 đến 17.4; 18.4 đến 20.4; 22.1 đến 22.4; 23.3 đến 33.4; 35.1 đến 44.4; 47.1 đến 50.4; 51.1 đến 52.4; 54.1 đến 58.4; 60.1 đến 61.4; 63.1 đến 64.4; 66.1 đến 66.4; 68.1 đến 82.3 (lồng nháy đơn 73.1 đến 73.4, 74.3 đến 74.4, 75.1 đến 75.4, 76.1 đến 76.4, 77.3 đến 78.2, 79.4); 83.1 đến 83.4; 95.1 đến 95.4; 97.1 đến 97.4; 98.3 đến 98.4; 99.1 đến 123.4 (lồng nháy đơn 106.1 đến 109.4); 128.1 đến 135.4; 136.1 đến 136.4 (ti ngoài); 139.4 đến 141.4; 142.1 đến 142.4; 146.1 đến 146.4; 148.1 đến 148.4; 155.3 đến 155.4; 159.3 đến 159.4; 160.4 đến 164.4; 181.1 đến 181.4; 183.3 đến 193.4. Một số chỗ nháy Pāli giữ nguyên dù ngữ nghĩa lệch: 22.4 (icchaṭṭā vilapiṁsu tā đóng nháy dù là câu tường thuật), 82.3 và 123.4 (nháy đóng sau câu cuối bài kể), 136.1 (nháy kép bao cả câu nói của Đức Phật có chứa lời trích mà Pāli không đánh nháy riêng; bản Việt không thêm nháy), 160.4 (nháy mở ở cuối khoá, đóng ở 164.4). Dấu ti: Pāli có ti gắn vào từ mà không mở nháy (40.1 mahesīti, 40.3 buddhamātāti, 194.1 abhāsitthāti); đo trong thi-ap và tha-ap: 262 khoá có ti gắn vào từ mà khoá Pāli không có nháy, 0/262 khoá Việt thêm nháy (bỏ ti). Bài này bỏ ti và không thêm nháy.

  THUẬT NGỮ — kèm số đếm (toàn tầng kn, sn, an, dn, mn đã dịch):
  - narasārathi → Điều Ngự Trượng Phu (12 trên 13 khoá; 1 khoá Chủ Xế); vināyaka → Điều Ngự (46 trên 66; Hướng Đạo 4); lokanāyaka → Dẫn Đạo (189 trên 240; Lãnh Đạo 17, Dẫn Lộ 7); lokanātha → Bảo Hộ Thế Gian (28 trên 53; Lãnh Đạo 17); narāsabha → Nhân Ngưu (101 trên 140); mahesī → Đại Ẩn Sĩ (185 trên 205); sugata → Thiện Thệ (424 trên 913 khoá); isisattama → bậc tối thượng trong các ẩn sĩ (7 trên 12 khoá, kể cả dạng trong các bậc ẩn sĩ; 4 khoá dịch bậc ẩn sĩ thứ bảy ở snp2.12, thag21.1, mn56); lokapajjota → ngọn đèn của thế gian (11 trên 15); lokabandhu → Thân Hữu của thế gian (12 trên 24; thân quyến 5, quyến thuộc 2); sayambhū → Tự Tại (39 trên 48); subbata → bậc có hạnh nguyện tốt (4 trên 33, tha-ap536:23.2 cùng dạng hô cách; hạnh lành 7, trì giới 5, giữ giới 4); cakkhumā/cakkhuma → Hữu Nhãn đối với mọi pháp ở 99.2 (theo cùng Pāli ở tha-ap544, tha-ap545) và bậc Có Mắt ở 95.4 (theo thi-ap19:7.4, thi-ap19:16.4, thi-ap15:21.4); devatā → chư thiên (312 trên 766); devadundubhi → sấm trời (9 trên 10); bhūmicāla → động đất (48 trên 60); āyusaṅkhāra → lực mạng (12 trên 26; thọ mạng 4, thọ hành 2); saddhamma → Chánh pháp (288 trên 371; diệu pháp 16); rattaññū → kỳ cựu (26 trên 43, gồm an1.235 cho chính Gotamī); upāsikā → nữ cư sĩ (202 trên 245); sāvikā → nữ đệ tử (64 trên 111); upassaya → trú xứ (thi-ap20, thi-ap18) và nilaya → nơi ở (phân biệt hai từ); kaḷevara → thân xác (7 trên 11); pāṭihīra → phép lạ (tha-ap562:34.3, tha-ap521:5.1; thần thông ở thi-ap15:4.3 và tha-ap407:35.4, nhưng iddhi ở 125.1 đã dịch thần thông); padakkhiṇaṁ → đi nhiễu quanh; kūṭāgāra → ngôi nhà mái nhọn (giảng đường mái nhọn 34 khoá cho kūṭāgārasālā; kūṭāgāra riêng lẻ dịch nhà mái nhọn; ở 1.3 kūṭāgāre susālāyaṁ dịch liền hai vế).
  - tāvatiṁsa → Ba Mươi Ba; Padumuttara, Koṇḍañña, Rāhula, Ānanda, Nanda, Sāriputta, Mahākassapa, Vissakamma, Sakka, Garuḷa, Meru, Sineru, Mucalinda, Vesālī, Kāsi, Haṁsavatī, Devadaha, Kapilavatthu, Suddhodana, Añjana, Sulakkhaṇā giữ nguyên Pāli; mahāvane dịch Đại Lâm (62 khoá cùng Pāli trong tầng, 52 khoá dịch Đại Lâm hoặc đại lâm).
  - saṅkhata → hữu vi; asaṅkhata → vô vi (con đường đưa đến vô vi, sn43); asubha không có trong bài.
  - jhāna → thiền thứ nhất đến thứ tư và các xứ Không vô biên, Thức vô biên, Vô sở hữu, Phi tưởng phi phi tưởng (ps2.9, mnd3); 150.3 Ākiñcaṁ nevasaññañca dịch Vô sở hữu xứ và Phi tưởng phi phi tưởng xứ (quy ước phi tưởng phi phi tưởng, 168 khoá).
  - dosa → lỗi lầm ở 48.2 và 57.2 (dosa ở đây không phải sân; nhất quán trong bài); khama → tha thứ (thi-ap19:4.4 khamassu).
  - Đại từ ta của Đức Phật viết hoa Ta (51.3, 106.3 đến 106.4, 185.1, 185.4) theo tha-ap486:18.4.

  BẤT ĐỊNH — ghi ở đây, không đưa vào thân kinh:
  1. 2.3: kate có thể đi với pure hoặc upassaye; dịch nơi đã được xây dựng.
  2. 3.3 đến 3.4: tassevaṁ = tassā evaṁ; như vầy đặt ở 3.4.
  3. 6.1 đến 6.4: nibbutiṁ là tân ngữ của gaccheyyaṁ (6.3); giữ trật tự Pāli nên vào Niết-bàn đứng ở 6.2; paṭikacca dịch từ trước (trước thời điểm đó).
  4. 9.3: tāhi (cùng với họ) có thể chỉ chư thiên đang khóc hoặc chính các tỳ-kheo-ni; mittā dịch bạn hữu. 10.3 toyalavāsittā: bị những giọt nước thấm ướt (có thể là nước mắt, Pāli không nói); 10.4 rahogatā: đang ở nơi thanh vắng.
  5. 14.3 sahāyeva: dịch như những người bạn đồng hành; cách đọc khác: chính là bạn đồng hành.
  6. 20.3 đến 20.4: pañcahi không kèm danh từ; xem mục số Pāli.
  7. 22.1 mahābhoge (hô cách nữ): dịch hỡi bậc có tài sản lớn, chưa kiểm chứng ở tầng; 22.4 icchaṭṭā: dịch đau khổ vì khao khát.
  8. 23.4 hāsakāloyamajja vo: vo hiểu là đối với các con; cách đọc khác: của các con.
  9. 29.4 hatadabbā: không có tiền lệ trong tầng; dabba hiểu là của cải, tài vật; cách đọc khác: lợi dưỡng hoặc thế lực.
  10. 30.1 đến 30.2: yaso (vinh quang) và ussito māramaddano cùng chỉ Đức Phật; dịch bậc đã nghiền nát Ma vương, đã vươn cao; maddana chưa có tiền lệ.
  11. 31.3 Ānandabherikāloyaṁ: dịch đây là lúc đánh trống hoan hỷ (ānanda là niềm vui, đồng thời trùng tên Ānanda).
  12. 37.1 taṇhāsamaṇaṁ: dịch làm dịu cơn khát; taṇhā vừa là cơn khát vừa là ái, có thể chơi chữ với dhammakhīra (37.4).
  13. 38.1 bandhanārakkhane: từ khó, không có tiền lệ; dịch sự ràng buộc và gìn giữ; anaṇo là không có nợ nần.
  14. 45.3 Sañjhāghanāva bālakkaṁ: dịch như mặt trời non giữa mây chiều.
  15. 51.1 Akkhante nāma khantabbaṁ: không có tiền lệ; dịch khi không có gì cần phải tha thứ, thì còn gì để tha thứ; 51.3 te → bà.
  16. 52.1 đến 52.4: khamante dịch thích hợp; pabhātakāle byasanaṅgatānaṁ disvāna niyyātiva candalekhā khó và disvāna không có tân ngữ rõ; dịch sát từng vế, không thêm ý.
  17. 55.1 đến 55.2 vāditabbapahārino: nghĩa chưa chắc (người đánh nhạc cụ, có thể là hình ảnh tiếng gầm thuyết pháp); dịch bậc đánh vang nhạc cụ.
  18. 57.2 dosagghāni: hiểu là dosaghāni (diệt trừ lỗi lầm); nhất quán với dosa ở 48.2; cách đọc khác: diệt trừ sân.
  19. 59.1 anusāvetvā: dịch thông báo; 59.2 subbatā chỉ Gotamī (hạnh nguyện tốt), đặt ở 59.2 theo Pāli.
  20. 62.3 Ṭhitācalaṭṭhiti thirā và 62.4 dhammatā: dịch đứng vững, có chỗ đứng bất động, kiên cố và bản tính của các pháp.
  21. 70.3 đến 70.4 sukumārīhi sattavassāhi: dịch những bé gái mảnh mai mới bảy tuổi; không xác định được những vị nào.
  22. 71.2 pacchimaṁ dassanaṁ tava: dịch lần thấy cuối cùng của con (con thấy ta lần cuối).
  23. 77.3 đến 77.4 rodhesi: dịch đã ngăn cản; chưa phân xử được ngăn điều gì (ngăn hội chúng lễ kính hay điều khác); 78.2 vipattitaṁ: dịch sự suy vong; không có tiền lệ.
  24. 87.2 pallaṅkena kamī: dịch ngồi kiết già mà đi; 87.3 vasaṁ vattesi kāyena: dịch tự tại bằng thân theo ps3.2:7.10 (yāva brahmalokāpi kāyena vasaṁ vatteti).
  25. 90.2 merumūlanadantare: từ ghép khó; dịch ở khoảng giữa chân núi Meru và các dòng sông; hai cách tách chưa phân xử được.
  26. 92.4 pavassatha: dịch bà đã làm đổ xuống trận mưa lớn (chủ ngữ là Gotamī, động từ chia dạng lạ).
  27. 98.3 Avocayye: avocuṁ + ayye; Pāli mở nháy ngay trước Avoca, bản Việt đưa Họ thưa vào trong nháy theo thi-ap19:24.3.
  28. 103.3 đến 103.4: mātucchaṁ không có đại từ sở hữu; dịch vị dì tỳ-kheo-ni, hiểu là dì của Đức Padumuttara; ṭhapentaṁ (đang đặt) chuyển sang bị động được đặt ... bởi để khớp trật tự Pāli.
  29. 109.2 jīvitāpādikā: dịch người nuôi dưỡng mạng sống (cùng gốc với 120.4 jinassāpādikā).
  30. 114.4 dāsagāmake: làng của nô lệ; 116.1 sayambhuno: dịch Tự Tại theo tầng, chỉ các vị tự giác; 117.1 pūgā: dịch nhóm.
  31. 123.1 đến 123.2 Sahapuññassa kattāro mahāsamayakārakā: nghĩa chưa chắc (người cùng làm việc phước, người tạo nên đại hội); chưa có tiền lệ; dịch sát từng vế.
  32. 125.2 đến 125.4 piḷandhavikatiṁ ... kammaññassa: dịch như việc làm ra các thứ trang sức, như người thợ vàng khéo học nghề, với vàng dễ uốn.
  33. 128.3 vāsitā: dịch được thấm nhuần (bởi phước của Đức Phật); 134.2 vijjati: dịch đều có.
  34. 136.1 iccevaṁ: iti là dấu trích dẫn, Pāli không đánh nháy riêng lời của các tỳ-kheo-ni trong lời Đức Phật; yassadāni = yassa idāni; dịch bản gốc theo cấu trúc thi-ap30:60.
  35. 138.4 yāvakoṭṭhakaṁ: dịch cho đến cổng (koṭṭhaka là cổng hoặc tiền sảnh).
  36. 140.3 amatākāraṁ: dịch có dáng vẻ bất tử.
  37. 142.1 đến 142.4: người nói là Đức Phật nói với Gotamī (nháy mở ở 142.1); tava dịch đối với bà; anassāsikamittaraṁ dịch không thể tin cậy, tạm bợ (mn76:22.3 anassāsika → không đáng tin cậy).
  38. 143.3 Aḍḍhapallaṅkamābhujja: không có tiền lệ; dịch xếp chân ngồi bán kiết già.
  39. 155.2 saṁviggāhiṁsu = saṁviggā āhiṁsu: dịch xúc động ... đã nói; 156.1 maṁ: lời tường thuật dùng ngôi thứ nhất (Gotamī tự kể cả cái chết của mình), giữ ta.
  40. 163.2 gatāsamaṁ: dịch đã đến cảnh giới vô song; 164.2 yo ca piyo: dịch ai là người thân mến đối với bậc Đại Mâu-ni, cách đọc khác: người mà Ngài thương mến; 167.1 lokapālā: dịch vị thần hộ thế (ja519 vị thần hộ thế); 167.4 samaggahuṁ: dịch đã cùng nâng giữ, chưa chắc.
  41. 171.2 đến 171.4 pupphakañcukā, ogatākāsapadumā, mahiyā pupphamuggataṁ: dịch sát; không có tiền lệ.
  42. 178.1 đến 178.4: Buddho buddhassa nibbāne nopaṭiyādi bhikkhavo: dịch khi một vị Phật nhập Niết-bàn, vị Phật đã không lo liệu, hỡi các tỳ-kheo; bhikkhavo hiểu là hô cách; cách đọc khác: chủ ngữ số nhiều; 178.3 đến 178.4 không có động từ nên mượn nopaṭiyādi ở dạng khẳng định.
  43. 181.2 ḍayhañcassā: dịch thân thể của bà đã được thiêu; 181.3 saṅketaṁ: dịch dấu hiệu báo trước; 182.2 tassā pattagatāni: đã đặt trong bát của bà.
  44. 183.3 đến 184.2: sāravantassa/palujjeyya: dịch cây lớn có lõi cứng ... đổ gãy vì vô thường (sn47.14:2.13 palujjeyyuṁ dịch rụng xuống, ở đây thân chính nên đổ gãy).
  45. 191.1 Ayoghanahatasseva: lấy lại nguyên bản ud8.10:4.1 (Như ánh sáng của sắt bị búa đập) để nhất quán; chữ ánh sáng là dịch giả ud thêm vào, Pāli không có; 191.2 jātavedassa (ud8.10:4.2 viết jātavedaso): dịch của lửa Jātaveda đang cháy theo ud.
  46. 193.2 satipaṭṭhānagocarā: dịch lấy niệm xứ làm nơi hành hoạt (thag1.100:1.2 gocaro dịch cư trú trong; ps2.7:19.6 gocarā dịch phạm vi).
  47. 40.2, 40.4 sulabhaṁ, paramadullabhaṁ: dịch dễ có được, vô cùng khó có được.

  KIỂM TRA ĐÃ CHẠY — phép tự viết, quét mọi khoá: tập khoá Việt = tập khoá Pāli (771 = 771, cùng thứ tự); nháy đơn ‘ ’ và nháy kép “ ” khớp Pāli từng khoá (0 lệch trên 771 khoá, 38 cặp; 0 nháy thẳng); …pe… → đúng một … (3/3 khoá 80.2, 81.2, 82.2; Pāli không có … ở khoá nào khác thì Việt không có); không khoá rỗng, không (…) trần (Pāli bài này không có (…)); NFC; không khoảng trắng thừa; không Pāli lọt sang thân bản dịch ngoài tên riêng; 13 nhóm Pāli trùng trong chính bài (11 giống, 2 khác có lý do); 117 khoá Pāli trùng với tầng đã dịch (106 dùng lại, 11 khác có lý do). Đã in cặp Pāli với Việt từng khoá để đọc.

  CỔNG KỸ THUẬT — technical_integrity đặt 9.6 vì chưa chạy được bốn lệnh của kho trong phiên này: npm run validate, npm test, npm run check, npm run build. Phải chạy cả bốn trước khi coi tiêu chí 10 là đạt. Bài giữ draft do blocker tầng Anh; mẫu số coverage chỉ 2 khoá (hai câu kết) nên khi chạy npm run reference:gaps sẽ phát sinh entry cho thi-ap17.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2008, dựa trên ấn bản Buddha Jayanthi), đã đọc toàn bài theo từng khổ kệ. Khoảng 31 khoá bất đồng nghĩa hoặc xưng hô → sửa 3, giữ 15, bất định 13.
  Sửa 3: (1) 3.3 rahogatāya: trước "khi bà ở một mình nơi vắng vẻ" → sau "khi bà đang ở nơi thanh vắng"; 3.1–3.2 nói bà ở cùng năm trăm tỳ-kheo-ni đã giải thoát nên "một mình" mâu thuẫn, và rahogata chỉ là ở nơi riêng tư, thanh vắng (cùng cách dịch với 10.4). (2) 161.3 mayhaṁ: trước "lời con nói" → sau "lời tôi nói"; đây là Ānanda nói với các tỳ-kheo (tỳ-kheo nói với tỳ-kheo xưng "tôi"), đúng như đoạn ngôi kể ở trên đã ghi cho 160.4–164.4 nhưng khoá này còn sót "con". (3) 22.2: trước "bỏ lại chúng tôi" → sau "bỏ lại chúng con"; các nữ cư sĩ thưa với Gotamī, cùng người nói với 146.1–146.4 vốn đã dùng "chúng con", nên thống nhất. Đoạn ngôi kể trên ghi 22 và 146 dùng "chúng tôi" là lỗi thời: các tỳ-kheo-ni thưa với Đức Phật ở 128–135 và nữ cư sĩ ở 22, 146 đều dùng "chúng con".
  Giữ 15 (bản nguyên bài khác Pāli đã ghim hoặc theo dị bản): 11.1 calā (bản nguyên bài hiểu "vững chải", Pāli ghim là calā, đang chuyển động); 14.1 nikkhantā là phân từ quá khứ, bản nguyên bài dùng thì tương lai; 32.2 kataññutā là lòng biết ơn, bản nguyên bài dịch "bi mẫn"; 33.3 nandissaṁ là dạng tương lai, bản nguyên bài dịch quá khứ; 34.2 và 101.2 purakkhatā với cách instrumental là "được vây quanh", bản nguyên bài dịch "dẫn đầu"; 38.3 labhanti là lối trần thuật, bản nguyên bài dịch lối ước nguyện; 48.2 matā là "được xem là" (man), bản nguyên bài hiểu "chết đi"; 83.1 thīnaṁ (của nữ giới) có trong Pāli, bản nguyên bài bỏ; 90.2 merumūlanadantare, bản nguyên bài đọc thành ba ngọn núi Meru, Mandāra, Daddara theo dị bản; 117.1–117.4 bản nguyên bài thêm việc xây năm trăm cốc liêu mà Pāli ghim không có; 135.1–135.2 asmābhi pariciṇṇosi là "Ngài được chúng con phụng sự" (instrumental, phân từ bị động), bản nguyên bài đảo chủ thể; 140.3 amatākāraṁ (ākāra, dáng vẻ), bản nguyên bài hiểu ākara (nguồn); 141.1–141.3 samphusissati là ngôi thứ ba, nên chủ ngữ là lễ bái chứ không phải "con"; 142.1–142.4 Pāli đóng nháy ở 141.4 rồi mở nháy mới ở 142.1 nên đổi người nói sang Đức Phật, bản nguyên bài để Gotamī nói tiếp; 156.1 maṁ giữ ngôi thứ nhất theo Pāli ghim (bản nguyên bài đổi thành "vị ni này").
  Bất định 13 (Pāli một mình không phân xử được, giữ cách đọc sát chữ nhất): 2.3 kate đi với pure hay upassaye (bản nguyên bài gắn với trú xứ); 29.2 jino chỉ Đức Phật hay Rāhula (bản nguyên bài gắn với Rāhula) và 29.4 hatadabbā (bản nguyên bài dịch "niềm kiêu hãnh đã tiêu tan"); 30.2 māramaddano bổ nghĩa yaso hay chỉ Đức Phật; 38.1 bandhanārakkhane (bản nguyên bài dịch "dưỡng nuôi chăm sóc"); 51.1 akkhante nāma khantabbaṁ; 52.2–52.4 khamante và byasanaṅgatānaṁ (bản nguyên bài hiểu là các vì sao biến mất); 55.2 vāditabbapahārino (bản nguyên bài dịch "đánh đổ sự kiêu căng của những người đối chất"); 77.3–77.4 rodhesi (bản nguyên bài dịch "hài lòng", có thể theo dị bản rocesi; bản dự án giữ nghĩa "ngăn cản" của Pāli ghim); 89.1 chassūrodayakāleva là "như vào lúc" hay "đúng vào lúc"; 103.3 mātucchaṁ là "vị dì" hay tên riêng Mātucchā như bản nguyên bài; 163.2 gatāsamaṁ; 164.2 piyo mahāmune là "thân mến đối với" hay "yêu mến" như bản nguyên bài; 178.1–178.4 nopaṭiyādi là "không lo liệu" hay "không hiện diện" như bản nguyên bài; 191.1 chữ "ánh sáng" là chữ thêm của bản ud8.10:4.1 mà bài này dùng lại nguyên văn cho nhất quán, Pāli không có.
  Mọi số Pāli khớp bản nguyên bài: năm trăm vị (3.2, 7.1, 20.2), một trăm hai mươi tuổi (97.1), một trăm ngàn kiếp (99.3, 107.1), ba mươi hai tướng (45.1), mười yếu tố (111.3), bốn tháng (117.2), năm trăm ngôi nhà mái nhọn (168.2). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; có nhiều chỗ bản nguyên bài theo dị bản khác nên không khớp từng khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn 771 khoá, đối chiếu bản
  nguyên bài Bhikkhu Indacanda; không có đoạn song song published cho bài này): sửa 1 khoá: 191.1
  ayoghanahatasseva, trước "Như ánh sáng của sắt bị búa đập" → sau "Như bị búa sắt đập"; chữ "ánh
  sáng" không có trong Pāli (ayoghana = búa sắt, hata = bị đập; jātaveda ở 191.2 là lửa), là chữ thêm
  do dùng lại nguyên văn ud8.10:4.1 và làm câu tối nghĩa (sắt có ánh sáng). Giữ: đọc lại 106.1–106.2
  (sasaṅghaṁ là tính từ của lokanāyakaṁ, bản Việt tách "Tăng đoàn, và bậc Dẫn Đạo" nhưng nghĩa tương
  đương, không sửa), 44.3 sudiṭṭhaṁ, 113.3 ("Ta đã là của chúa tể chư thiên" gượng nhưng đứng được
  theo 113.4), 98.3 "Họ thưa:" trong nháy (đã ghi ở bất định 27); các khoá khác bản Indacanda đã phân
  xử ở lượt 2026-10-14. Bất định giữ nguyên: 38.1, 52.2–52.4, 55.2, 77.3–77.4, 178.1–178.4. Cần người
  biên tập: ud8.10:4.1 (và có thể thag5.8) vẫn mang "ánh sáng của sắt bị búa đập", cùng lỗi, ngoài lô
  này nên không sửa; tiêu đề/số "Ký Sự" và ngôi ta/con trong thi-ap giữ chờ quyết định chung.

