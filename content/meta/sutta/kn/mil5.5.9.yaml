notes: |-
  `Gāthābhigītabhojanakathāpañha`, câu hỏi thứ chín của `Santhavavagga`; 62 khoá, tất cả đã dịch. Cấu trúc: vua Milinda nêu thế lưỡng đầu (Đức Phật từ chối *thức ăn hát lên bằng kệ*, nhưng lại luôn nói pháp thoại về bố thí trước) ở `1.1`–`3.7`; Nāgasena giải bằng hai ví dụ (đồ chơi cho trẻ, dầu trước khi xổ) ở `4.1`–`5.3`; rồi vua hỏi sang *viññatti* (`6.1`), Nāgasena phân tích bốn loại (thân có lỗi / thân không lỗi / lời có lỗi / lời không lỗi) ở `6.2`–`17.1`; cuối cùng là một câu hỏi phụ về chư thiên rải dưỡng chất cõi trời vào thức ăn của Như Lai (`18.1`–`19.5`).

  TẦNG THAM KHẢO — đo, không đoán. Bản Anh Sujato tại commit đã ghim không có `kn/mil` (thư mục `kn/` của edition chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud`); đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng vắng (chỉ có 26 tệp `dhp*`), và lớp `english-project` không có uid này. Coverage đo theo công thức của `source/layers.yaml`: 0 trên 42 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0.x`) = 0%. Ba tầng tham khảo vắng hết ⇒ bài dịch chỉ từ Pāli root và các bài `mil` đã dịch trong tầng project, nên `triangulation` bị chặn ở 7.5 và `status` là `draft` kèm blocker `noEnglishEditionUpstream`.

  `0.1`–`0.3` giữ nguyên Pāli (*Milindapañha*, *Meṇḍakapañha*, *Santhavavagga*) theo `mil5.5.2`, `mil5.5.4`, `mil5.5.8`, `mil5.5.10` (227, 42 và 10 khoá Pāli trùng ở toàn tầng `mil`, bản Việt đều giữ Pāli). `mil5.5.7` dịch *Phẩm Santhava* là ngoại lệ, không đổi theo. Ghi lại để người điều phối gộp.

  DÙNG LẠI NGUYÊN VĂN — 10 khoá có Pāli trùng với bài `mil` đã dịch khác (10 cặp đã dò): `0.1`–`0.3`, `1.1`, `3.2`, `3.5`, `4.1`, `4.5`, `10.4`, `19.5`. Chín khoá dùng lại đúng một cách dịch đã có (`0.1`–`0.3`, `1.1`, `3.2`, `3.5`, `4.1`, `4.5`, `19.5`); một khoá khác có chủ ý là `10.4` (10 cặp trùng: bảy khoá cũ ghi *“bậc Thiên Nhân”* cho `devātideva`, ba khoá ghi *“bậc Thiên Trung Thiên”* như `mil5.4.7`; chọn *Thiên Trung Thiên*, 17 khoá trong tầng). `3.2` có 17 cặp trùng với cách dịch khác nhau (*“Thưa ngài Nāgasena, nếu Thế Tôn đã dạy:”* 5, *“Bạch ngài Nāgasena, nếu Thế Tôn đã dạy rằng:”* 3, *“… đã nói rằng:—”* 2…); chọn dạng *Bạch ngài … đã dạy rằng* cho cùng giọng với `1.1`. Nội bộ bài: 0 cặp Pāli trùng nguyên văn.

  THUẬT NGỮ — chọn theo bầy lân cận, đo trên tầng `mil`: `bhante nāgasena` → *Bạch ngài Nāgasena* (95 khoá) vs *Thưa ngài Nāgasena* (31); `mahārāja` → *tâu đại vương* (376 khoá); `thero` → *Trưởng lão* (91); `tathāgato` → *Đấng Như Lai*; `ubhato koṭiko pañho` → *câu hỏi hai đầu* (37 khoá). `dānakathā` / `sīlakathā` / `anupubbikathā` → *pháp thoại về bố thí* / *pháp thoại về giới* / *pháp thoại tuần tự* (theo `dn14` và các bài khác; tầng có 8 khoá `dānakathaṁ`). `ājīva` → *chánh mạng* (theo tầng, 148 khoá Pāli có `ājīva`), `bhinnājīva` → *người có chánh mạng bị phá vỡ*. `sāvajja` / `anavajja` → *có lỗi* / *không có lỗi*. `dibbaṁ ojaṁ` → *chất bổ dưỡng của cõi trời* (theo `mil5.3.6:7.2`). `Seyyathidaṁ—` → *Như sau đây —* (theo `mil1:8.2`, `mil6.3.12:4.2`). `devātideva` → *bậc Thiên Trung Thiên* (theo `mil5.4.7:24.2`).

  `gāthābhigītaṁ me abhojaneyyaṁ` (`2.1`, `3.3`, `4.2`) → *Thức ăn hát lên bằng kệ, Ta không dùng*, đúng bản đã dịch của `sn7.8`, `sn7.9`, `sn7.11` (3/3 khoá). Khác tầng ở `2.3`/`4.3` (`gāthābhigītaṁ panudanti buddhā`): `sn7.8`/`7.9`/`7.11` ghi *thức ăn của kẻ hát kệ*, còn bài này giữ *thức ăn hát lên bằng kệ* để cùng một thuật ngữ Pāli luôn cùng một chữ Việt trong bài, và vì *của kẻ hát kệ* đổi quan hệ ngữ pháp (thức ăn *được hát lên*, không phải thức ăn *của người hát*). `snp1.4:11.1` ghi *bị tụng kệ*, `snp3.4:32.1` ghi *được tụng kệ mà thành*: tầng có ba lối, không bản nào áp cho cả bốn; bài này theo `sn7.*`.

  `viññatti` / `viññāpeti` (lặp ở `6.x`–`16.2`) → *việc xin* / *xin*: `kāyaviññatti` *việc xin bằng thân*, `vacīviññatti` *việc xin bằng lời*. Tầng chỉ có hai khoá trước (`mil7.6.7:2.2` *xin xỏ*, `mil7.2.5:4.1` không dịch được thuật ngữ này), nên đây là lựa chọn của bài; `viññatti` trong Phật học còn nghĩa *biểu tri* (Abhidhamma), nhưng văn cảnh ở đây là việc xin vật dụng nên chọn nghĩa Luật.

  BẤT ĐỊNH (ghi ở đây, không thêm vào thân kinh):
  1. `7.2` `ṭhānaṁ bhañjati` → *làm hỏng cách đứng*. Nghĩa đen *phá vỡ chỗ đứng*; không có bản Anh đã ghim để đối chiếu và tầng Việt không có khoá nào tương đương, nên chọn cách đọc sát chữ nhất. Có thể là *đứng ở chỗ không đúng chỗ rồi còn đổi tư thế để gây chú ý*, nhưng Pāli không nói thêm.
  2. `10.2` `ṭhānepi aṭṭhānepi yathānusiṭṭhiṁ gantvā ṭhāne tiṭṭhati` → *tùy theo lời chỉ dạy mà đi đến, cả chỗ nên lẫn chỗ không nên đứng, rồi đứng ở chỗ nên đứng*. Cú pháp của `ṭhānepi aṭṭhānepi` mơ hồ: có thể đi với `gantvā` (đi đến cả chỗ nên lẫn chỗ không nên) hoặc đi với `yathānusiṭṭhiṁ` (theo chỉ dạy cả trong chỗ nên lẫn chỗ không nên). Chọn cách thứ nhất.
  3. `11.2`–`11.3` (kệ `Dhīro ca veditumarahati; Uddissa ariyā tiṭṭhanti`): *xứng đáng hiểu được* (ai hiểu, hiểu gì không nêu) và *đứng đó để ngỏ ý* (`uddissa` là *chỉ rõ / hướng đến*). Khác bản của `ja403:6.2`–`6.3` (*kẻ kiên định thì biết lúc phải xin*, *Nhìn thấy rồi … vẫn đứng vững*) mà bài này không theo vì không giữ được `veditum arahati` và `uddissa`. Không có Anh đã ghim để phân xử; hai bản có thể cùng đúng một phần.
  4. `17.1` `āveṭhanaviniveṭhanakaḍḍhananiggahappaṭikammena` → *việc quấn lại và gỡ ra, lôi kéo, khuất phục và đáp trả*: năm danh từ nối nhau, Pāli không nói chủ thể của từng hành vi. Chỉ ghi sát chữ; `mil3.1.3:1.5` ghi `āveṭhana`/`nibbeṭhana` là *mở gút thắt / tháo gút gỡ* và `niggaha` là *khuất phục*.
  5. `5.3` `kammabhūmi` → *mảnh đất của nghiệp* (nghĩa đen *đất của nghiệp*; tầng không có khoá tương đương), và `na ca kenaci viññattimāpajjati` → *không rơi vào việc xin với bất cứ ai*.
  6. `19.3` `sukkhayavapulaka` → *lúa mạch khô thô cứng*: `yavapulaka` không có khoá tương đương trong tầng; nghĩa của `pulaka` (loại ngũ cốc kém / vụn) không phân xử được từ tầng đã ghim.
  7. `18.1` `madhupāyāsa` → *cháo sữa mật ong* (không có khoá tương đương trong tầng; `mil7.2.5:4.1` ghi *cháo sữa ngọt ngào* cho một chỗ khác). `sūkaramaddava` giữ nguyên Pāli theo `mil5.3.6:7.2`.
  8. `14.1` `vacīvipphārena` → *dùng lời nói phô trương*: `vipphāra` có nghĩa *lan tỏa / phô bày*; chọn *phô trương* cho khớp ngữ cảnh nói rao trước hội chúng.

  SỐ — không có số lớn trong bài. Hai phép tính: `catūhapañcāhaṁ` = bốn + năm = *bốn năm ngày* (một cụm *khoảng* bốn hay năm ngày, không phải chín); `dvīsu piṇḍapātesu` = *hai* bữa khất thực (`sūkaramaddava` và `madhupāyāsa`).

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó — brief cấm chạy trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6** vì các phép kiểm tự động của lát đã xanh: tập khoá Việt khớp Pāli 62/62 và đúng thứ tự, nháy đơn và nháy kép khớp Pāli ở 62/62 khoá, NFC, không khoá rỗng, không Pāli lọt sang bản Việt ngoài danh xưng, 0 cặp Pāli trùng nội bộ; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.
