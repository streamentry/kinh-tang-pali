notes: |-
  Dịch từ Pāli root tại commit đã ghim; đủ 86 khoá, thứ tự và tập khoá khớp Pāli, không có khoá ngoài Pāli. Không có bản Anh Sujato, bản Việt phân đoạn hay english-project cho bài này, nên không có đối chiếu English độc lập; bản dịch dựa trên Pāli và tiền lệ đếm được của nhóm tha-ap.

  Tên bài và tên phẩm. 0.3 và translationTitle là cùng một chuỗi, Ký Sự Về Trưởng Lão Cúng Dường Một Tấm Vải (ekadussa là một tấm vải, dāyaka là người cúng dường); Pāli ở 0.3 không có số thứ tự nên bản Việt không thêm số. Kiểu mở đầu tên: đo ở phạm vi gần (tha-ap380–469) là Bài Kệ Tuyên Ngợ 36, Ký Sự Về 18, Bài Kệ Tuyên Ngôn 7; đo toàn nhóm tha-ap là Bài Kệ Tuyên Ngợ 240, Bài Kệ Tuyên Ngôn 118, Ký Sự Về 101. Tuyên Ngợ là chính tả sai, còn Tuyên Ngôn không phải nghĩa của apadāna; bài này theo Ký Sự Về Trưởng Lão, cùng kiểu với tha-ap423 và tha-ap426 trong cùng phẩm (tha-ap422, tha-ap427, tha-ap428, tha-ap429 dùng Bài Kệ Tuyên Ngôn; tha-ap421 đang để nguyên tên Pāli). Nên để người biên tập phán một lượt cho cả cuốn. 23.1 đọc lại đúng chuỗi ở 0.3 rồi thêm thứ hai (Pāli dutiyaṁ). 0.1 giữ Therāpadāna theo tiền lệ tầng. 0.2 là Phẩm Sakiṁsammajjaka, theo các bài cùng phẩm. Tên người ở 22.1 giữ dạng Pāli Ekadussadāyaka.

  Số Pāli: chattiṁsakkhattuṁ (9.1) là chattiṁsa 36, tức 6 cộng 30, nên ba mươi sáu lần; tettiṁsakkhattuṁ (9.3) là tettiṁsa 33, tức 3 cộng 30, nên ba mươi ba lần; tiṁsa đo được trong tầng là 30 (tiṁsakkhattuṁ ở tha-ap, tiṁsatikkhattuṁ viết ba mươi lần). Ở tầng, chattiṁsakkhattuṁ devindo có 3 khoá cùng Pāli, 1 khoá viết ba mươi sáu lần, 2 khoá viết ba mươi lần, nên 2 khoá ấy lệch với phép đo này (ngoài lát, chỉ báo). Kappasatasahassāni (8.3) là sata 100 nhân sahassa 1000 thành một trăm ngàn kiếp; satasahassito kappe (18.1) là một trăm ngàn kiếp trước. Catasso (21.1) là bốn. Ekadussa là một tấm vải. Không có cụm Tiṁsakappasahassa nên không có bất định về số lớn nào chưa phân xử được; bất định duy nhất liên quan tiṁsa là việc cấu tạo chattiṁsa và tettiṁsa dựa vào phép đo tầng chứ không có bản Anh ghim độc lập để đối chiếu.

  Dấu lược: ba khoá 19.2, 20.2, 21.2 có Pāli …pe… nên bản Việt mỗi khoá là một …; Pāli không có … hay (…) ở khoá nào khác nên bản Việt cũng không có. Nháy: Pāli mở ngoặc kép ở 1.1 và đóng ở 21.3; nháy đơn mở ở 3.3 và đóng ở 4.4, mở ở 6.3 và đóng ở 6.4, mở ở 8.1 và đóng ở 11.4; bản Việt khớp Pāli từng khoá, 0 lệch trên 86 khoá.

  Tái dùng nguyên văn tầng: 43 khoá có Pāli trùng với bài khác trong nhóm tha-ap (tổng 4.634 cặp Pāli trùng đã dò, trong đó ba khoá …pe… mỗi khoá 640 cặp); 29 khoá giống cách dịch phổ biến nhất, 6 khoá theo cách ít phổ biến hơn, 8 khoá khác có chủ ý. Phần theo cách ít phổ biến: 7.4, 9.1, 10.1 (Vương quyền cai quản các vùng đất rộng lớn: toàn nhóm 3 so với Vương quốc rộng lớn ấy 12, nhưng ấy không có trong Pāli và 3 khoá cùng cách dịch này gồm tha-ap421 và tha-ap422 cùng phẩm, nên chọn dạng bám Pāli), 13.3, 18.1 (Vào một trăm ngàn kiếp trước, 2 khoá, so với đại kiếp 21 khoá; chọn kiếp vì kappa là kiếp ở 742 so với 69 trong toàn nhóm và để khớp 8.3 ở cùng bài), 18.3 (Ta không còn biết đến đọa xứ, phạm vi gần 25 so với Ta không biết mình rơi vào khổ đau 18; toàn nhóm 54 so với 136). Phần khác chủ ý: 2.4, 5.2 (ta làm cho tâm mình tịnh tín, cùng nghĩa, theo ngôi ta), 8.4 (đọa xứ thay khổ đau, vì vinipāta là chỗ rơi, không phải dukkha), 9.3 (thêm làm vua cho rājā, theo tiṁsatikkhattuṁ rājā ca), 12.1 (Đức Chánh Đẳng Giác thay bậc Tự Tại Giác: toàn nhóm Chánh Đẳng Giác 112 so với Tự Tại Giác 6), 12.4 (vua thiên nga thay vị vua hạc: haṁsa là thiên nga, không phải hạc; 3 khoá cùng Pāli viết vị vua hạc, 1 khoá viết chúa thiên nga), 15.2, 15.3 (hai khoá cùng Pāli ở tha-ap345 và tha-ap497 nằm trong câu khác, ghép với lời Việt rời nên viết lại cho hợp mạch). Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti dùng dạng Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (464 khoá), không dùng dạng số ít đã từng nói bài kệ này (2 khoá). Dòng thứ ba của mỗi khổ viết hoa chữ đầu theo Pāli (19.3, 20.3, 21.3 viết thường vì đi sau …). Ngôi kể dùng ta ở mọi khổ.

  Pāli trùng trong chính bài: một nhóm Pāli ekadussassidaṁ phalaṁ (13.4 và 18.4), hai khoá có bản Việt giống hệt, không có cặp nào bản Việt khác; ba khoá …pe… (19.2, 20.2, 21.2) giống hệt nhau là …; hai khoá kataṁ buddhassa sāsanaṁ (20.3 và 21.3) chỉ khác ngoặc đóng ở 21.3 như Pāli.

  Bất định (không thêm vào thân kinh). (1) 4.2 natthi me koci dāyako: đọc dāyaka là thí chủ, tức ta không có thí chủ nào; cách đọc khác là không có ai là người cho tặng (ta không có người nào để cho thêm). (2) 4.4 ropayissāmi dakkhiṇaṁ: ropayissāmi là sẽ gieo trồng, dakkhiṇaṁ là sự cúng dường; 0 tiền lệ cho dạng này trong nhóm. (3) 6.2 ukkuṭṭhiṁ sampavattayiṁ: đọc là cất tiếng reo mừng; 0 tiền lệ. (4) 10.4 saṁsaranto tuvaṁ bhave: động từ bhave không có chủ ngữ nêu, bản Việt viết ngươi sẽ có được, tức vương quyền ở 10.1; cách đọc khác là ngươi sẽ là như vậy. (5) 11.2 anavakkantadehavā: đọc là thân thể không bị xâm hại, theo nghĩa anavakkanta không bị xâm nhập (sn14.34, mn122); chữ này chỉ thấy trong bài này và tha-ap336, chưa có tiền lệ Việt. (6) 11.3 akkhobha: viết không gì lay chuyển, theo tiền lệ akkhobhaṁ ratanaṁ; cách đọc khác là không cạn, không suy tổn. (7) 14.3–14.4 Heṭṭhā dussamhi tiṭṭhāmi, uparicchadanaṁ mama: bên dưới ta đứng trên vải, mái che phía trên là của ta; Pāli không nói mái che bằng gì nên bản Việt không thêm chất liệu. (8) 15.1 Cakkavāḷaṁ upādāya: viết tính từ vòng thế giới trở vào, theo nghĩa lấy vòng thế giới làm giới hạn; 0 tiền lệ cho cakkavāḷa là vòng thế giới trong tầng. (9) 15.4 dussehacchādayeyya taṁ: taṁ chỉ cả vòng thế giới cùng rừng núi ở 15.1–15.2. (10) 17.2 nājjhagaṁ katthacikkhayaṁ: không gặp sự cạn kiệt nào ở bất cứ đâu; chủ ngữ ngầm là quả báo ở 17.1, và 17.4 vipaccati idhāpi me cũng lấy quả báo làm chủ ngữ. (11) 1.2 tiṇahārako: người mang cỏ, không thêm gánh hay bán vì Pāli không nói. (12) 12.2 jalajuttamanāmako: giữ theo 5 khoá cùng Pāli (được gọi là bậc Tối Thượng Tựa Hồng Sen), vì đây là nghĩa tên Padumuttara.

