notes: |-
  Đủ 9/9 khóa. Tiêu đề theo tiền lệ ja1: Jātaka giữ nguyên, Ekakanipāta
  là Bộ Một Bài Kinh, kết là Kinh Kỳ Đà thứ nhất. godhā → kỳ đà theo bảng
  dấu hiệu (tướng kỳ đà). accantasukha → an lạc lâu bền; kaliṁ pāpeti
  attanaṁ → tự đưa mình đến bại vong.
  kakaṇṭa 0 tiền lệ: dịch là tắc kè (một loài thằn lằn), chưa kiểm chứng
  được chính xác loài nào; vế so sánh đọc là như con tắc kè với bầy kỳ đà
  thì kẻ giao du kẻ xấu tự chuốc bại vong. Sửa sau review: 1.3 bỏ chữ giữa
  (thêm nghĩa không gian cho túc từ godhākulaṁ) thành với cho trung thực
  với cách.
  Sujato trống cả 9 khóa, không có tầng Việt hiện hành cho Jātaka trong
  snapshot đã ghim → chỉ Pāli đơn tuyến, giữ draft.
