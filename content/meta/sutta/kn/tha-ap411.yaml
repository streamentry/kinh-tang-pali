  (https://suttacentral.net/tha-ap411/vi/indacanda) và DPD (https://www.dpdict.net/); chú giải CST
  (Apadāna-aṭṭhakathā s0510a) không phủ bài này. Đã đối chiếu cả 54 khổ kệ (218 khoá); sửa 0 khoá. Số
  khớp: 42.3 ba mươi ngàn kiếp, 42.4 và 43.1 sáu mươi bốn lần (Indacanda 64; Walters “seventy-four” ở
  43.1 lệch cả Pāli lẫn Indacanda), 44.1 một trăm ngàn kiếp, 28.3 một trăm ngàn bậc tự tại, 36.3 trăm
  bộ phận. 36.1 `Bhuttāviṁ kālamaññāya`: Indacanda cùng nghĩa “biết thời điểm Ngài thọ thực xong”,
  Walters “too late to eat” lệch. 34.2 `jalajuttamanāyako`: cả hai bản dịch hiểu là danh hiệu của
  Padumuttara (Walters “Leader named Supreme Lotus”) giống tha-ap410:44.2; bản đang dùng ở hai bài đặt
  hai cách diễn đạt khác nhau (“đóa sen tối thượng sinh từ nước” và “tựa hồng sen”), cần một cách
  thống nhất. 24.1 `anīkaṭṭhā` Walters “sentinels”, Indacanda “hộ vệ”, khớp quyết định A9 “quân hộ
  vệ”. 25.1–25.4: Walters “the indolent Maharaja” và Indacanda “bị xao lãng” cùng đọc `pamattassa` (dị
  bản), khác chữ ghim `mamatthassa`; giữ chữ ghim như đã ghi, bất định. 6.2 `supāsakā` (Walters
  “dice-players”, Indacanda “người giữ trẻ”; DPD không có mục) và `jallā` (DPD `jalla` = bùn đất,
  không phải đô vật) vẫn chưa phân xử; các danh sách tên nước và giáo phái 10.1–19.4 hai bản đều theo
  bản BJT với dạng tên khác Pāli ghim (Kolaka/Koṭala, Babbara…), giữ chữ ghim.

