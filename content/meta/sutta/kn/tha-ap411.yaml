notes: |-
  Dịch từ Pāli root của tha-ap411 (218 khoá, đủ khoá và đúng thứ tự khoá như Pāli); không có bản Anh Sujato, không có bản Việt hiện hành phân đoạn, không có lớp lấp english-project. Mọi lựa chọn dựa vào Pāli, ngữ cảnh bài và tiền lệ đếm được trong tầng Việt của dự án (tha-ap). Status bắt buộc draft do blocker noEnglishEditionUpstream.

  Tên bài (:0.3): Pāli Jatukaṇṇittheraapadāna không bắt đầu bằng số nên bản Việt không có số thứ tự; translationTitle bằng đúng giá trị khoá :0.3 (Ký Sự Về Trưởng Lão Jatukaṇṇi). Đo kiểu tên trên 551 tệp tha-ap có :0.3 (cây chính cộng bản đang làm, tính theo uid): Tuyên Ngợ (chính tả đáng ngờ) 245, Ký Sự 150, Tuyên Ngôn 138, Tuyên Ngợi 10, Kinh Kệ Của 5, khác 3. Hai phạm vi cho hai đa số khác nhau: toàn tầng nghiêng về Tuyên Ngợ; cửa sổ tha-ap400 đến tha-ap420 có Ký Sự 18 trên 18. Chọn Ký Sự theo phạm vi gần nhất và theo cùng phẩm Metteyya, khớp với lời kết 56.1. Đề nghị người biên tập phán một lượt cho cả cuốn. Tên riêng Jatukaṇṇi giữ dạng Pāli.

  :0.1 Therāpadāna giữ nguyên Pāli; :0.2 Metteyyavagga dịch Phẩm Metteyya theo các bài cùng phẩm đã dịch (tha-ap403, 404, 405, 406, 408, 409). Lời kết 56.1 Jatukaṇṇittherassāpadānaṁ navamaṁ dịch Ký sự về Trưởng lão Jatukaṇṇi, thứ chín, theo dạng viết thường của lời kết cùng phẩm (11 trên 11 tệp tha-ap396 đến tha-ap412 có lời kết dạng này); thứ tự chín khớp Pāli navamaṁ, nối tiếp tha-ap409 (thứ bảy) và tha-ap410 (Pāli aṭṭhamaṁ, thứ tám).

  Số Pāli, tự tính: tiṁsa 30 x sahassa 1000 = ba mươi ngàn (42.1 Tiṁsakappasahassāni, dịch Trong ba mươi ngàn kiếp); catusaṭṭhi = catu 4 + saṭṭhi 60 = 64, sáu mươi bốn lần (42.3 và 43.1); kappasatasahassa = sata 100 x sahassa 1000 = 100.000, một trăm ngàn kiếp (44.1); vasīsatasahassa = một trăm ngàn bậc tự tại (28.3 và 34.3); tūriyasatasahassa = một trăm ngàn nhạc cụ (41.1); pañca sīla = năm giới (40.1), dasa kammapatha = mười nghiệp đạo (40.2), tiṇṇaṁ vedāna = ba Veda (46.2), catasso paṭisambhidā = bốn vô ngại giải (54.1), sattavaṇṇa = bảy (25.3). Về cụm Tiṁsakappasahassa: chỉ dẫn của người điều phối dùng tiṁsa = 30, và phép đo tầng khớp chỉ dẫn đó: 13 khoá cùng Pāli đã dịch ba mươi nghìn (11 khoá) hoặc ba mươi ngàn (2 khoá), 0 khoá dịch ba nghìn. Bản ghi chú chung của phẩm ghi tiṁsa = 3 (ba nghìn kiếp); trái với phép đo và chỉ dẫn, nên bài theo ba mươi ngàn. Dạng chữ ngàn theo chỉ dẫn, khác nghìn ở 11 khoá tiền lệ; cùng giá trị 30.000.

  Lời thọ ký tương lai (38 đến 48): bhavissati, ramissati, karissati, carissati, gamissati, abhiramissati dịch thì tương lai (sẽ). Kappasatasahassamhi ở 44.1 dịch Sau một trăm ngàn kiếp nữa theo hướng sau bao nhiêu kiếp nữa (tiền lệ 3 khoá Sau một trăm ngàn kiếp nữa, 10 khoá Vào một trăm ngàn kiếp nữa, 10 khoá Sau một trăm nghìn kiếp). Ngôi nói: Đức Phật nói ở 38 đến 48, dùng Ta viết hoa; người kể là Trưởng lão ở các khoá còn lại, dùng ta (Kilesā jhāpitā mayhaṁ: ta 231, tôi 93 trên 334 khoá cùng Pāli của tầng; viharāmi anāsavo: ta 250, tôi 58, khác 62 trên 370 khoá).

  Dùng lại tiền lệ nguyên văn: trong 215 khoá nội dung (trừ :0.1, :0.2, :0.3) có 66 khoá Pāli trùng một khoá khác của tầng tha-ap (kể cả ba khoá …pe…); 58 khoá bản Việt dùng đúng chữ của tiền lệ (không kể hoa thường). 8 khoá khác, đều có lý do: 27.2 vajjamānāsu bherisu dịch khi các trống đang được đánh vang vì là vị trí tuyệt đối (tiền lệ giữa tiếng trống rền vang, 4 khoá); 28.2 padumuttaranāyako dịch bậc Lãnh Đạo Padumuttara thay cho bậc dẫn đường qua vùng nước bùn (2 khoá) vì đó là tên và danh xưng, cùng cách tha-ap187 và tha-ap177 (Đấng Lãnh Đạo Padumuttara, Đức Đạo Sư Padumuttara); 34.2 jalajuttamanāyako dịch bậc Lãnh Đạo, đóa sen tối thượng sinh từ nước, không thêm chữ tựa như mà tiền lệ 2 khoá có; 36.1 và 36.2 đổi cấu trúc vì bản Việt gắn kālamaññāya với sở hữu cách buddhaseṭṭhassa tādino; 36.4 và 51.1 dùng ta thay cho tôi theo ngôi kể của bài; 47.4 thêm vị ấy để giữ chủ ngữ của lời thọ ký. Trong chính bài có 7 nhóm Pāli trùng (parivārenti maṁ sadā 3 khoá: 4.4, 5.4, 6.4; āgacchanti mamaṁ gharaṁ 15 khoá: 9.4 đến 23.4, riêng 24.4 viết hoa chữ đầu nên không trùng byte nhưng Việt vẫn giống; paricāremahaṁ tadā 2; Vasīsatasahassehi 2; upaṭṭhānassidaṁ phalaṁ 2; viharāmi anāsavo 2; …pe… 3), tổng 115 cặp, 0 cặp bản Việt khác nhau. Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti dùng nhóm số nhiều đã nói những bài kệ này.

  Thuật ngữ và tiền lệ: pañca kāmaguṇe trong tầng dịch năm dục (2 khoá); ở 1.3 chỉ có kāmaguṇe (không pañca) nên dịch các dục lạc. Rajojalladharā dịch mang bụi bặm và nhơ bẩn theo tha-ap414:23.3 (Tất cả đều mang bụi bặm và nhơ bẩn; 3 khoá cùng gốc). Kappakā nhāpakā sūdā mālākārā dịch thợ cạo, người hầu tắm, đầu bếp, người làm tràng hoa theo dn2 (cùng bộ chữ). Naḷakārā dịch thợ đan lau sậy (dn2 dịch thợ đan giỏ; tha-ap236 dịch người làm việc bằng lau sậy; theo nghĩa gốc naḷa là lau sậy). Pesakārā ở 20.1 và 22.2 cùng Pāli, cùng bản Việt thợ dệt. Nigaṇṭha dịch Ni-kiền-tử (tha-ap549:23.2). Mahāmuniṁ trong tầng có 36 khoá cùng Pāli và nhiều cách dịch (Đại Mâu-ni, Đại Muni, Đại Ẩn Sĩ, Đại Hiền); chọn Đại Mâu-ni, khớp tha-ap414:26.2 và các khoá cùng danh xưng. Vīthi ở 29.2 và 32.4 cùng dịch đường phố. Nirūpadhi dịch không còn sanh y (24 khoá). Nāgova bandhanaṁ chetvā dịch như thớt voi bẻ gãy mọi trói buộc (23 khoá). Sukkamūlena codito dịch được khích lệ bởi cội nguồn thiện căn (56 khoá). Padesarajjaṁ vipulaṁ gaṇanāto asaṅkhiyaṁ dịch đúng chữ đa số (29 và 37 khoá). Công thức kệ 52, 53, 54 dùng đúng đa số của tầng; …pe… dịch đúng một dấu lược.

  Tên các nhóm người và nghề: dòng 4 đến 24 là danh sách dài các hạng người, dân tộc, nghề nghiệp; hầu hết là hapax trong toàn tầng tha-ap (0 khoá cùng Pāli ở các tệp khác; riêng celāpikā chỉ có thi-ap14:17.2 khujjā celāpikā bahū). Quy tắc áp dụng: nghề nghiệp nghĩa rõ thì dịch (thợ rèn, thợ gốm, thợ nhuộm, người cưỡi voi); tên dân tộc, xứ sở thì giữ dạng Pāli kèm chữ người (người Oḍḍaka, người Damiḷa, người Yonaka, người Kaliṅga...); hạng người mà nghĩa chưa xác lập được thì giữ nguyên Pāli, không bịa nghĩa (xem bất định 3).

  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 54.3, cố ý chạy qua khoá; nháy đơn lồng trong: 32.3 mở và 32.4 đóng, 34.1 mở và 34.4 đóng, 38.1 mở và 48.4 đóng. Đối chiếu từng khoá cho 0 lệch trên 218 khoá cả bốn loại dấu. Dấu lược: ba khoá …pe… (52.2, 53.2, 54.2) đều là một dấu …; Pāli không có dấu lược trần hay (…) nào khác. Pāli không dùng ti nên không có chuyện phe bỏ hay giữ dấu ti. Không có chữ số Ả Rập trong bản Việt; không có từ Pāli lọt vào ngoài tên riêng, tên dân tộc và nhóm người (xem trên), và Therāpadāna.

  BẤT ĐỊNH, để người biên tập phán, không thêm vào thân kinh:
  1. 25.1 và 25.2 Ānandassa mahārañño mamatthassa adāsahaṁ: cú pháp không phân xử được. Ānandassa mahārañño ở sở hữu cách (đại vương Ānanda, thân phụ Đức Padumuttara theo truyền thống, nhưng Pāli ở đây không nói) và mamatthassa là mama + atthassa; không rõ đại vương Ānanda là người nhận, người cho hay chỉ là bối cảnh, và tân ngữ của adāsahaṁ không nêu. Bản Việt giữ nguyên bốn thành phần theo thứ tự Pāli (Của đại vương Ānanda, vì lợi ích của ta, ta đã cho) và không tự thêm người nhận hay vật cho; 25.3 và 25.4 (bằng châu báu bảy sắc, ta đã làm đầy chỗ còn thiếu) rõ hơn và nối với 26.4 (ta đã làm họ thỏa lòng bằng châu báu). Tầng không có tiền lệ (0 khoá).
  2. 34.4 adhivāsesi so muni nằm trong dấu nháy đơn của lời thỉnh (34.1 đến 34.4) nhưng động từ ở quá khứ (đã nhận lời); bản Việt giữ đúng thì quá khứ, nên lời thỉnh và việc nhận lời lẫn trong cùng một câu nháy. Có thể Pāli đã thiếu dấu đóng nháy hoặc người kể chen lời; không sửa dấu nháy khỏi Pāli ghim.
  3. Các tên nhóm giữ Pāli vì không xác lập được nghĩa: celāpikā (4.1; thi-ap14 dùng cùng chữ trong cụm khujjā celāpikā, chưa phân định là người lùn nữ hay hạng khác), kuñjavāsī, timajjhikā, sokajjhāyī (4.2, 4.3; dạng gần sokajjhāyika chỉ có ở ja547:716.4 mandakā sokajjhāyikā, tầng Việt chưa có bản dịch khoá đó), vetāḷino (5.1), supāsakā (6.2), jallā (6.3; mallā ở đây dịch đô vật, jallā giữ Pāli), paṭagā và laṭukā (10.1), viluttāvī (11.1), parittakā, santipattā, kodhapugganikā (12.1, 12.2), bandhikā (24.2), và các tên dân hay hạng ở 13 đến 19 mà tầng không có tiền lệ (0 khoá): dhammarā niggamānusā (15.2), cetaputtā (15.3 dịch những người con của Ceta theo nghĩa chữ; Pāli ja547:244.4 và cp9:40.2 có cetaputta nhưng tầng Việt chưa có bản dịch hai khoá đó), hatthiporikā (16.2), isiṇḍā makkalā (16.3), celāvakā ārabbhā oghuḷhā meghalā (17.1, 17.2), khuddakā suddakā (17.3), citakā ekakaṇṇikā (18.2), kumārā (19.1).
  4. 14.3 Ārāvacīnaraṭṭhā ca: tách thành ba tên (Ārāva, Cīna, Raṭṭha) là một lựa chọn phân đoạn; cũng có thể đọc Cīnaraṭṭha là một tên (xứ Cīna). 19.2 mallasovaṇṇabhūmikā tách Malla và Sovaṇṇabhūmika (người xứ Vàng); 19.3 Vajjītaṅgā tách Vajjī và Aṅga. Cả ba đều là phân đoạn chữ ghép, không có tiền lệ.
  5. 2.2 mahābhoge valañjako: valañjaka dịch người thụ hưởng, mahābhoge dịch trong cảnh của cải lớn; cũng có thể đọc mahābhoge là đại điện, đại cảnh nhà. Tầng không có tiền lệ (0 khoá).
  6. 7.2 sikkhite katupāsane: dịch những người đã được rèn luyện, đã thuần thục; upāsana có thể là tập luyện bắn cung hay phụng sự, tầng không có tiền lệ. 7.4 tidasaṅgaṇe dịch hội chúng chư thiên Tam Thập (saṅgaṇa là chỗ tụ hội); tầng có tidasa dịch Tam Thập (3 khoá), không có saṅgaṇa.
  7. 8.2 varakā: dịch người cầu ân huệ theo nghĩa vara là ân huệ; cũng có thể là hạng người khác. 23.3 sūparakkhā dịch người trông coi món canh; 24.1 anīkaṭṭhā dịch người trong hàng quân (dn30 dịch khác); 24.2 pupphachaḍḍakā dịch người dọn hoa; 10.2 pupphasāṭakā dịch người mặc vải hoa; 11.2 godhammā devadhammikā dịch người theo pháp bò, người theo pháp trời (an5.294-302 có devadhammiko nhưng bản Việt ở đó chưa dùng làm chuẩn).
  8. 36.3 sataṅgikena tūriyena dịch bằng dàn nhạc trăm bộ phận; chưa xác lập được là trăm nhạc cụ hay trăm phần; tầng không có tiền lệ (0 khoá). 36.1 và 36.2 Bhuttāviṁ kālamaññāya buddhaseṭṭhassa tādino: sở hữu cách buddhaseṭṭhassa tādino đi với kālamaññāya (biết thời điểm của Đức Phật); bản Việt dịch Biết thời điểm Ngài đã thọ thực xong, Đức Phật tối thượng, bậc như thị, không thêm gì ngoài Pāli.
  9. 39.2 sahirañño sabhojano dịch có vàng, có thực phẩm; hirañña có thể là vàng hay bạc, bhojana là thức ăn (khác với bhakkha ở 39.1 là có thức ăn dồi dào). 39.3 đến 39.4 ekarajjaṁ kārayissati dịch quyền làm vua duy nhất sẽ thi hành; tầng không có tiền lệ (0 khoá).
  10. 30.4 sataraṁsīva uggato dịch như mặt trời trăm tia đã mọc lên (sataraṁsi là mặt trời); tầng có Sataraṁsī làm tên Đức Phật, nên chữ mặt trời là chọn theo ngữ cảnh. 29.4 dīparukkhova jotati dịch chói sáng như cây đèn (4 khoá cùng gốc).
  11. 31.3 và 31.4 Antogharesu vipulo āloko: dịch Bên trong các nhà, một ánh sáng rộng lớn đã hiện ra ngay lúc ấy; vipulo là tính từ của āloko.
  12. 46.1 ajjhāyako dịch người trì tụng (người học thuộc lòng Veda); 46.4 carissati mahiṁ imaṁ dịch sẽ du hành khắp trái đất này; tầng không có tiền lệ cho hai khoá này.

  HẠN CHẾ KỸ THUẬT: đợt này bị cấm chạy npm run validate, npm test, npm run check, npm run build, nên tiêu chí 10 bị chặn ở 9.6. Chỉ xác minh được: JSON hợp lệ, đủ 218/218 khoá đúng exact ID và đúng thứ tự Pāli, mọi giá trị NFC, không khoá rỗng, không khoảng trắng thừa, không chữ số Ả Rập, nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch trên 218 khoá), dấu lược khớp Pāli từng khoá (3 khoá …pe…, 0 lệch), 0 cặp Pāli trùng trong bài mà bản Việt khác. Người biên tập phải chạy lại bốn lệnh trên trước khi đổi trạng thái.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 23 khoá bất đồng nghĩa → sửa 1 (tha-ap411:25.1, 25.2: “Của đại vương Ānanda, vì lợi ích của ta, ta đã cho” → “Cho đại vương Ānanda, vì lợi ích của ta, ta đã dâng”, vì `Ānandassa mahārañño` ở sở hữu cách thay tặng cách đi với `adāsahaṁ` (người nhận), bản nguyên bài cũng hiểu đại vương là người được dâng; bản cũ để “Của” treo; thay thế khoản bất định số 1 ở trên về chủ thể nhận), giữ 12 (dị bản danh sách bản nguyên bài khác Pāli ghim: 2.1–2.2, 12.1–12.2, 14.2, 15.2, 16.2, 17.2, 19.1–19.3, 41.1–41.3, nơi bản nguyên bài theo bản in khác; giữ theo Pāli ghim), bất định 10 (4.1, 4.3, 6.2, 6.3, 8.2, 10.1, 11.1, 14.3, 24.2, 25.2: tên nhóm người hoặc từ hiếm mà bản nguyên bài đọc là nghề hay hạng người, còn bản này giữ chữ Pāli; không phân xử được từ Pāli đã ghim, ghi sẵn ở bất định 3, 4, 7; riêng 25.2 `mamatthassa` bản nguyên bài đọc khác hẳn, bất định còn nguyên). Các số khớp: ba mươi ngàn kiếp, sáu mươi bốn lần, một trăm ngàn kiếp, một trăm ngàn bậc tự tại. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt 218 khoá, đối chiếu bản nguyên bài
  Bhikkhu Indacanda, đoạn song song tha-ap18:6.1 cho 42.3): sửa 1 khoá: 1.1 `Nagare haṁsavatiyā` "Ở
  thành xứ Haṁsavatī" thành "Ở thành Haṁsavatī", vì Pāli chỉ có `nagare` (trong thành), "xứ" là chữ
  thêm; dạng "Ở thành Haṁsavatī" chiếm đa số (8 khoá có nháy mở, 4 khoá không nháy, so với 5 khoá
  "thành xứ"), và 1.1 của tha-ap340 đã sửa như vậy. Cùng chữ thừa còn ở tha-ap424:1.1 và tha-ap430:1.1
  (ngoài lô này, cần sửa theo). Kiểm lại: 25.1 đến 25.4 (đã sửa 2026-10-14, `mamatthassa` vẫn bất
  định, không sửa chính tả), 34.4 nháy, 36.1 đến 36.4 sở hữu cách `buddhaseṭṭhassa tādino`, 45.1 đến
  45.4, 49.4 `sakyaputtassa`. Giữ nguyên các tên nhóm người bằng chữ Pāli như danh mục bất định cũ.
  Lưu ý chéo bài: `anīkaṭṭhā` ở 24.1 dịch "người trong hàng quân" còn tha-ap410:4.1 dịch "quân hộ vệ",
  cần một quyết định chung. Tiêu đề "Ký Sự" và xưng hô ta/tôi thuộc quyết định chung chờ người biên
  tập, không sửa lẻ.

  Quyết định hội đồng biên tập 2026-10-16: A9 — 24.1 (`anīkaṭṭhā` = quân hộ vệ); C6 — 29 khoá (1.2, 1.4, 2.1, 2.2, 2.4, …) (xưng hô theo mục 9: người kể xưng "tôi").

