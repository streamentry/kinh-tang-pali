  - Chỗ bất định (không thêm vào thân kinh):
    + `1.2` `Veḷuriyamuttātharukhaggabandhā`: tách `tharu` = chuôi (không có tiền lệ trong tầng), đọc "đeo gươm chuôi nạm ngọc lưu ly và ngọc trai"; cách ghép từ có thể khác.
    + `2.2` và `37.3` `uggata`: đọc là tính từ "bậc hiển hách"; có thể là tên riêng của vua xứ Kāliṅga.
    + `3.1`–`3.4`: Pāli không nêu ai hỏi; `4.1`–`4.4` nói về Sakka ở ngôi thứ ba, tôi giữ ngôi thứ ba.
    + `5.1` `Dūre sutā no`: đọc "chúng tôi nghe danh từ xa"; `5.3` `ayire` (hình thái lạ, chỉ một lần trong toàn Pāli ghim) đọc là "các bậc cao quý".
    + `9.1`–`9.4`: các sở hữu cách `tiṇṇañca raññaṁ … devānamindassa ca vāsavassa` có thể là "của" (câu hỏi của họ) hoặc "cho" (giải đáp cho họ); tôi chọn "cho".
    + `10.3` `Āceraputto`: đọc là "con của vị thầy" (ācariya-putta); chưa có tiền lệ trong tầng, cách đọc khác (tên một dòng họ) không loại trừ được. `suvinītarūpo` → "có phong thái rất được rèn luyện" (cùng nghĩa `rūpa` như `sādhurūpā` → "phong thái hiền thiện", `ja497:14.4`).
    + `11.3`–`11.4` `eso manujesu dhammo, yaṁ vuddhamāgacchati esa bhāro`: đọc `dhammo` là "phép tắc", mệnh đề sau là nội dung của phép tắc ấy; dấu hai chấm do tôi đặt, Pāli không có.
    + `13.4` `yañcāsi abhipatthitaṁ`: đọc "câu hỏi mà ngài đã mong muốn".
    + `15.2` `Makkhappahānaṁ`: "sự từ bỏ thói gièm pha" (đa số tầng); nghĩa khác "khinh miệt" cũng có tiền lệ.
    + `17.2` `Sārambhahetū`: đọc "vì nguyên cớ tranh chấp"; nghĩa "vì sợ xung đột" gần nhau, nhưng khác tiền lệ `mn7`, `sn7.16` ("hung hăng", "phẫn nộ").
    + `18.1`–`18.4`: `catupattharūpaṁ` chưa tra được nghĩa chắc; tôi dịch "người mang bốn dạng" (Pāli chỉ liệt kê ba: hơn, ngang bằng, thấp kém; dạng thứ tư có thể là hạng khó nhận ra ở `virūparūpena`). Không rõ câu kết `Tasmā hi sabbesaṁ vaco khametha` là phần câu hỏi của Sakka hay đã chuyển sang lời đáp; Pāli giữ một cặp nháy kép từ `18.1` đến `18.4`, nên tôi để cả khổ trong cùng một lời nói.
    + `19.4` `Khantī balassūpasamanti verā`: tách `khantībalassa upasamanti` ("người có sức mạnh nhẫn nhục thì các oán thù lắng dịu"); có thể đọc "nhờ sức mạnh của nhẫn nhục thì oán thù lắng dịu".
    + `20.3` `Yathā ahuṁ`: đọc "như đã từng có"; chưa chắc `ahuṁ` là ngôi thứ ba số nhiều.
    + `21.1` `Kisañhi vacchaṁ avakiriya`: Pāli không nêu cái được ném rải lên nên tôi không điền; `kisaṁ vacchaṁ` đọc là tên Kisavaccha (khớp `45.2` `kisavaccho`); cách đọc "Vaccha gầy gò" cũng có thể, và `41.1` Pāli viết tách `vacchassa kisassa`. `ja530:27.2` có `Kisaṁ avakiriya daṇḍakī` (không có `vaccha`), chưa có bản Việt.
    + `23.1` `niraye sattisūle`: giữ phiên âm Sattisūla (nghĩa gốc "giáo và cọc nhọn"), không có tiền lệ trong tầng; `24.3`–`24.4` `Kalābuvīci`: đọc "địa ngục Vīci của Kalābu" và ba tính từ `Mahāpatāpaṁ kaṭukaṁ bhayānakaṁ` bổ nghĩa cho địa ngục ấy.
    + `26.6` và `30.4` `Kathaṁvidhaṁ no siri no jahāti`: `no` đầu có thể là đại từ "chúng tôi" thay vì phủ định; tôi đọc "thịnh vượng không rời bỏ" và không điền ai. `sirī` đứng một mình như một đức (cùng loạt với `sīla`, `paññā`, `dhamma` ở `31.3`, `32.3`) chưa có tiền lệ rõ trong tầng; "thịnh vượng" theo `ja500`.
    + `28.2` `Nāccāhitaṁ kamma karoti luddaṁ`: `accāhita` hiếm; đọc "nguy hại quá mức". `ja446:3.2` có cùng cụm nhưng bản Việt ("làm điều hèn hạ mà chẳng dựng lời cho chu tới") lệch khỏi Pāli nên không theo; `28.3` `atthapadaṁ` → "lời có ý nghĩa" (`dhp100`).
    + `29.2` `daḷhabhatti`: 0 tiền lệ trong tầng; đọc "lòng trung thành vững chắc".
    + `33.5` `paṭipadaṁ`: đọc "con đường thực hành"; `paññāya` đọc "để đạt trí tuệ".
    + `37.2` `Tavamaṭṭhakā`: đọc `tava` + `Aṭṭhakā` (hô cách), "của ngài, hỡi Aṭṭhaka"; cách đọc khác khả dĩ.
    + `39.1` `Karomi`: giữ hiện tại ("tôi tạo cơ hội"), không đổi thành tương lai.
    + `41.1`–`41.4`: Pāli không nêu người nói; `katāya … pūjā` đọc "khi sự tôn kính đối với Kisavaccha đã được thực hiện" (chưa phân xử được ai tôn kính ai); `Jhāne ratā hotha` đọc "hãy luôn vui thích trong thiền".
    + `43.3` `aṭṭhikatvā`: đọc "hết lòng" (`snp2.8:2.1` `Tadaṭṭhikatvāna` → "lắng nghe chín chắn").
    + `44.2` `kassapo`: chỉ viết "Kassapa", không thêm "Mahā"; `44.4` `kaccāyano ca devalo`: không biết chiều đồng nhất. Ở các cặp trước, tên trong truyện đứng trước, vị đệ tử đứng sau; riêng cặp này Devala có thể là ẩn sĩ Asita Devala (xem `mn93:18.6`) nên có thể đứng ở vế truyện. Tôi giữ đúng thứ tự Pāli và dùng "là", không đảo.
  - Phép kiểm tra:
