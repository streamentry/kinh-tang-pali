    2. Nháy đơn `‘’` và kép `“”` khớp Pāli từng khoá: 0/196 lệch (Pāli không có nháy đơn; nháy kép 31 mở + 31 đóng).
    3. Pāli trùng nguyên văn trong chính bài: 8 nhóm, Việt khác nội dung 0.
