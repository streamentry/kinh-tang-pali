  đóng nháy ở `:3.3` như cách dịch tự nhiên, bộ chốt sẽ báo lệch. Tôi cũng tự đếm nháy đơn
  `‘’` (bộ chốt không tính): cân, 0 = 0. Tổng Pāli: `“`=4 `”`=4.

  DẤU LƯỢC. Bài có **3** khoá `…pe…` (`:6.4 :7.1 :7.3`) và cả ba giữ **đúng một** `…`,
  không mở rộng — đây là peyyāla đúng nghĩa: `sakayavanepi …pe…` lược danh sách địa phương
  vì danh sách **đứng đủ** ở `:6.2`, và `:6.2` đã viết đủ cả tám địa danh. Riêng `:6.4`
  và `:7.3` kéo dài thêm phần đã lược ở cuối (`… yattha katthacipi ṭhito …`) nhưng **phần đứng
  ở khoá sau vẫn viết đủ**, nên không mất gì.

  LỖI BẢN NHÁP BẮT ĐƯỢC KHI REVIEW ĐỐI KHÁNG — 9 CHỖ, ĐÃ SỬA HẾT:
  (1) `:6.2` `kāsikosala` — nháp đầu dịch là **"xứ Kāsi"**, tức là **GỘP** `kāsikosala` với
    `kāsi`. Đây là lỗi nặng nhất của lát: danh sách Pāli có **tám** địa danh, mà `kāsikosala`
  và `kasmīra` là hai món khác nhau (nếu `kāsikosala` chỉ là `Kāsi`, thì `kasmīra` ở ngay
  sau là vô nghĩa, và `alasanda`, `nigumba`, `gandhāra` cũng không còn gốc để dịch). Đã sửa
  thành "nơi đất có cỏ Kāsi mọc" (`kāsika` = thuộc Kāsi, `kosala` = một loài cỏ).
    Ghi thêm: tôi thử giữ chữ Pāli `Kāsikosala` trước, và bộ chốt **bắt được** — vì ở khoá
    này Pāli viết `kāsikosalepi` (dạng nhiều có `-epi`), nên dạng đứng riêng `kāsikosala`
    không xuất hiện trong Pāli của chính khoá và bộ chốt coi là Pāli lọt. Đây là chốt đúng,
    không phải chốt sai; tôi không sửa `_hvi.py`.
  (2) `:2.1` `tena hi natthi nibbānaṁ?` — nháp đầu dịch "thì có phải Niết-bàn **không có
    không?**", lặp phủ định hai lần và đọc hỏng. Đây là câu hỏi tu từ đơn, đã sửa thành
    "thì phải chăng không có Niết-bàn?".
  (3) `:3.2` `atthi aggi nāma` — nháp đầu dịch "có **ngọn lửa nọ**" dù đây là lần **đầu**
    giới thiệu, không có antecedent nào để gọi là "nọ"; và `kaṭṭha` là **khúc gỗ**, không
    phải "củ khô" (nháp đầu ghi "hai củ khô"). Đã sửa cả hai.
  (4) `:4.1` `atthi satta ratanāni nāma` — nháp đầu cũng dùng "bảy món báu **nọ**" ở lần
    giới thiệu đầu tiên ⇒ đã bỏ "nọ". Ngược lại `:5.2` `atthi taṁ ṭhānaṁ` **có** antecedent
    (Nāgasena vừa nói ở `:5.1`) nên giữ "một chỗ nọ" là đúng.
  (5) `:2.3` `pupphuṭṭhānaṁ gumbo` và `phaluṭṭhānaṁ rukkho` — `gumbo` và `rukkhō` là
    **một cây** (cây đa/cây lớn), nháp đầu dịch thành "rừng cây" hai lần ⇒ đã sửa thành
    "một cây … một cây".
  (6) `:7.2` `pubbadisā` — nháp đầu dịch "có phía trước **bằng**" (nghe như "bằng chứng").
    `disā` = khoảng trống / chỗ ⇒ đã sửa thành "có chỗ đứng trước mặt".
  (7) `:7.5` `gaṇivarapavara` — nháp đầu dịch "bậc vua cao nhất của loài", rối và sai sắc
    thái (`vara` = tối thượng, `gaṇi` = bầy/loài người) ⇒ đã sửa thành "vua tối thượng trong
    loài người".
  (8) `:6.2` danh sách địa danh — nháp đầu dịch `alasanda` là "nơi **cát có ngọc**", tức
    nhầm `sanda` (cát) với ngọc quý, và `nigumba` là "nơi **đất có cây bụi**", tức lệch
    nghĩa (`gumba` = bụi cỏ tụ dày). Đã sửa thành "nơi đất cát mặn" và "nơi cỏ á dày".
  (9) `:6.4` — nháp đầu kéo dài phần bị lược thành "hay ở nơi đất có cây cao" rồi mới đặt
    `…`, khiến dấu lược **không** đứng ở cuối khoá như Pāli ⇒ đã viết lại cho đúng hình dạng
    `…, … `.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  (1) `:6.2`–`:7.3` — **tám địa danh/địa hình** `sakkayavana cīnavilāta alasanda nigumba
    kāsikosala kasmīra gandhāra nagamuddha brahmaloka`: **0 tiền lệ** trong toàn tầng Việt
    (đã tra bằng mục lục Pāli↔Việt 151.534 cặp). Bản Pāli đã ghim cũng **không** có đoạn song
    song nào trong toàn bộ root (đã quét `root/pli/ms/sutta/**` cho `cīnavilāta`, 0 khoá).
    Vì vậy tôi dịch từng chữ theo nghĩa chữ, KHÔNG bịa tên riêng cho loài đất: `sakkayavana`
    → "chính quê mình"; `cīnavilāta` → "nơi đất có cây cao vút"; `alasanda` → "nơi đất cát
    mặn"; `nigumba` → "nơi cỏ á dày"; `kāsikosala` → "nơi đất có cỏ Kāsi mọc"; `kasmīra`
    → "Kasmīra" (giữ tên, có tiền lệ mil3.7.5:1.2 "Kasmīra"); `gandhāra` → "Gandhāra";
    `nagamuddha` → "nơi ngọn cây kín hoa" (`naga` = cây, `muddha` = ngọn/đỉnh);
    `brahmaloka` → "cõi Phạm thiên" (tiền lệ 52 khoá, mil3.7.4:2.3). Riêng `nagamuddha` là
    chỗ tôi **ít chắc nhất**: `muddha` còn có nghĩa "đỉnh", và bản Việt đã có ở thag10.2:8.4
    dịch `nisinno nagamuddhani` thành "khi ngồi trên đỉnh núi" — nghĩa khác hẳn. Người biên tập
    nên tra từ điển trước khi chốt hai chỗ này.
  (2) `:2.4` và `:3.1` — cặp `sannihitokāso` / `uṭṭhānokāso`: **0 tiền lệ** cho cả hai.
    Tôi dịch "chỗ cư trú" / "chỗ đứng dậy", giữ chúng **khác nhau** để mệnh đề của Nāgasena
    còn đúng lập luận. Nếu dịch cả hai giống nhau, lập luận ở `:2.4` sẽ hỏng.
  (3) `:7.5` `avañjho suppayuttānaṁ sammāpayogo` — 0 tiền lệ cho cả cụm. Tôi dịch "không hề
    chậm trễ, đã mau màng dứt bỏ, sự dụng hành đúng đắn" và **không** thêm thuật ngữ "tinh
    tấn" vì Pāli khoá này không có.
  (4) `:7.5` `gaṇivarapavara` — 0 tiền lệ. Tôi dịch "vua tối thượng trong loài người".
    Lưu ý `pariṇāyakaratana` ở `:4.3` tôi dịch theo kho đã có là "báu đại tướng", **khác**
    nghĩa chữ "người chỉ đường" của `pariṇāyaka`; đây là điểm cần người biên tập chốt lại vì
    cùng một gốc từ mà hai bản dịch trong kho đang đi hai hướng.
  (5) `:5.1` `nibbānassa sannihitokāso mā hotu` — `mā hotu` là cầu nguyện/đặt giả định
    ("cứ cho là …"), tôi dịch "cứ cho là không có chỗ cư trú của Niết-bàn" nhưng **không**
    thêm "mong rằng" vào.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `sammāpaṭipanno` → "người hành đúng chánh đạo" (mil6.3.11,
  9 khoá); `sīle patiṭṭhito` → "đứng vững trong giới hạnh" (tiền lệ gần: mil3.1.9:1.5
  "giới … là nền tảng"); `sakayavana` → "chính quê mình"; `brahmaloka` → "cõi Phạm thiên"
  (52 khoá); `nibbāna` → "Niết-bàn"; `sacchikaroti` → "chứng ngộ" (mil6.3.11, 9 khoá);
  `ṭhāna` → "chỗ" (6 khoá `:5.1`–`:6.5` cùng nghĩa, dùng y hệt một cách để bài không tự lệch);
  `satta ratanāni` → xem mục dùng lại nguyên văn ở trên; `khattiya` → "kshatriya" (giữ chữ
  Pāli có tiền lệ ở mil5.5.8:1.8 "bậc Kshatriya").

