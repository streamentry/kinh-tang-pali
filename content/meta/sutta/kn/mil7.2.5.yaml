notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho mil7.2.5.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các thuật ngữ cổ và đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 29 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  **terminology fix (2026-10-04, coordinator).** `Gadrabhavagga` bị dịch "Phẩm Con Lừa" ở khối `:0.3` — lẫn với `Kumbhavagga` (con lừa). `gadra` là **con sóc**, và hai tệp cùng phẩm (mil7.2.1, mil7.2.6) đã dùng đúng "Phẩm Con Sóc". Đếm toàn tầng trước khi sửa: 6 tệp lừa / 2 tệp sóc / 1 tệp giữ PĦLI. Đã đồng nhất sang sóc.

  **Sửa lan 2026-10-13 (rút lại một điều chỉnh trước).** Khoá `0.3` (`Gadrabhavagga`): *Phẩm Con Sóc* → *Phẩm Con Lừa*. Căn cứ: `gadrabha` là con lừa (`an3.82` `Gadrabhasutta` dịch *Kinh Con Lừa*, `ja111` `Gadrabhapañhajātaka` dịch *Câu Hỏi Về Con Lừa*, `ja536:117.4` `gadrabharatha`, `mil3.7.1:7.2` `gadrabhaṁ` đứng cạnh *lạc đà*, *bò*), còn con sóc là `kalanda`. Mục *terminology fix (2026-10-04)* ở trên khẳng định `gadra` là con sóc là sai và được rút lại. Đã đo lại: `mil7.1:13.1` và `mil7.2.10:5.1` (kết phẩm `Gadrabhavaggo paṭhamo`) dịch *Phẩm Con Lừa*, cùng `mil7.2.2`, `mil7.2.9`. Các tệp `mil7.2.1`, `mil7.2.3`, `mil7.2.4`, `mil7.2.6`–`mil7.2.8`, `mil7.2.10:0.3` vẫn ghi *Phẩm Con Sóc* (cùng cả chữ *con sóc* trong thân `mil7.2.1`) và cần sửa lan riêng. Khoá `0.1`, `0.2` giữ nguyên; tiêu đề `translationTitle` không chứa tên phẩm. Điểm chấm không đổi.

  **Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan).** Đọc đối kháng đủ 29 khoá, đối chiếu tiền lệ toàn tầng bằng số đếm; đổi 21 khoá, giữ nguyên tập khoá và thứ tự. Điểm cũ bỏ sót nhiều lỗi, nên có tiêu chí được hạ.
  *Accuracy fix.* `4.4` (`sājīvo garahito mama`): *mạng sống của ta bị chê trách* → *chánh mạng ấy của ta bị chê trách* — `ājīva` là sinh kế, không phải `jīvita` (mạng sống, dịch ở `5.4`); tầng dịch `ājīva` là *chánh mạng* 183 / *mạng sống* 21, và `mil5.5.9:15.2` kể cùng chuyện Trưởng lão Sāriputta bỏ thuốc vì sợ *chánh mạng* vỡ. `5.3`: *quyết không phá hoại lẽ sống thanh tịnh* → *sẽ không bao giờ phá vỡ chánh mạng của mình* (bỏ *thanh tịnh* không có trong Pāli; `bhindeyyaṁ` theo `mil5.5.9`). `4.2` (`vacīviññattivipphārā`): bỏ *gợi ý bóng gió* (không có trong Pāli; tầng dịch `viññatti` là *xin*, `mil5.5.9:6.2`/`12.2`, và `vacīvipphāra` là *lời nói phô trương*, `mil5.5.9:14.1`) → *do sự phô bày của lời xin*. `1.2`: `pabbatagahanaṁ` *chốn núi non hiểm trở* → *núi rậm* (`hiểm trở` là `visama` ở `dn26:21.6`, không phải `gahana`); bỏ *rình* (`nilīyitvā` chỉ là ẩn mình). `1.3`: `appanigghosaṁ` *không huyên náo* → *ít ồn ào* (`appa` là ít, không phải không); `araññaṁ` *rừng rậm* → *rừng*; `pabbataṁ` *sườn núi* → *núi*; `kandaraṁ` *khe suối* → *khe núi*; `palālapuñjaṁ` *đụn rơm* → *đống rơm*; `abbhokāsaṁ` *khoảng đất trống ngoài trời* → *ngoài trời* (đúng công thức `dn25:4.5` và các bài `dn`/`mn` cùng chuỗi Pāli, 5/5 lần nhất quán). `2.4`: bỏ *sâu sắc* thêm vào `vipassako`; `2.5`: bỏ *sâu* thêm vào `araññaṁ`. `5.4`: bỏ *này* thêm vào. `3.2`: chuyển *chẳng hạn như* (đặt danh sách như ví dụ, Pāli liệt kê chính các cách ấy rồi mới nói `aññataraññatarena`) thành *do …, hoặc do bất kỳ tà mạng nào khác*; `3.1`/`3.2` `pasuṁ` *con mồi ngã nghiêng* → *con thú ngã về bên trái* (`an8.12:31.3` dịch `pasuṁ vadhitvā` là *con thú*).
  *Terminology (đo số đếm).* `yoginā yogāvacarena` *người hành giả thiết tha tu tập* → *người hành trì, người thực hành* (đúng như `mil7.2.1`/`mil7.2.2`; trong `mil` toàn tầng *người hành trì* ~30 so với *thiết tha tu tập* 11 lần, và *thiết tha* không có căn cứ Pāli). `aṅga` *chi phần* → *phần* (`mil7.2.*` 100% *phần*; `mil7.*` 207 *phần* / 57 *chi phần*): `1.1`, `1.5`, `3.3`, `0.4`, `6.1` và `translationTitle`; bỏ *hai* khỏi tiêu đề `0.4`/`6.1` vì `Dīpikaṅgapañha` không chứa số (số `dve` vẫn giữ ở `1.1`). `vasibhāva` *sự thuần thục* → *sự làm chủ* (`mil5.3.3:11.1`/`12.1`, `mil6.2.1:6.4`). Khoá `1.1`: xưng hô *Bạch ngài* → *Thưa tôn giả* (117 so với 48 cho `Bhante nāgasena` ở `mil`, và đúng `mil7.2.9:1.1`) và dấu kết `?”.` → `?”` (đa số ~700 so với 29 ở `mil`). `2.6` `gaṇhāti` *chứng đạt* → *nắm lấy*, song song với `gahetabbaṁ` (*nắm lấy*) ở `1.5`. `5.1`–`5.2` `care` *lăn lóc* → *lòng thòng bên ngoài* (`care` là đi lại, không phải nằm lăn).
  *Điểm đổi.* `semantic_fidelity` 9.3 → 9.0 (tìm ra lẫn `ājīva`/`jīvita`, ba chỗ thêm nghĩa và một chỗ phủ định sai, nay đã sửa, nhưng bất định bên dưới vẫn còn); `grammar_logic` 9.3 → 9.2 (cấu trúc danh sách `3.2` đã sai, nay đã sửa); `terminology` 9.2 → 9.1 (lệch tiền lệ nhiều chỗ, nay đã sửa nhưng `antaguṇaṁ` và `madhupāyasaṁ` chưa có tiền lệ cùng ngữ cảnh); `vietnamese_clarity` 9.3 → 9.2 (`ngã nghiêng`, `lăn lóc`, `thoáng gió thanh vắng` gượng); `ambiguity_integrity` 9.2 → 8.8 (xem dưới). Giữ nguyên `source_provenance`, `segment_alignment` (khoá và thứ tự khớp), `triangulation` 7.5 (vẫn không có bản Anh độc lập), `han_viet_balance`, `technical_integrity` 9.6. `final_score` 9.23 → 9.13.
  *Bất định còn lại (không phân xử được, không đoán).* (1) `vacīviññattivipphārā`: `viññatti` là *xin* (đã đo) nhưng `vipphāra` ở đây là *phô bày* hay *tác động/lan tỏa* thì chỉ có hai tiền lệ cùng tầng (`mil5.5.9:14.1` *phô trương*, `an3.60:11.1` *lan tỏa*); giữ *phô bày*. (2) `antaguṇaṁ`: tầng dịch phần lớn là *màng treo ruột*/*màng ruột* khi đứng cạnh `anta`, còn đứng một mình trong câu kệ này chưa có tiền lệ; giữ *ruột* vì nghĩa kệ là ruột lòi ra, không ghi *màng*. (3) `madhupāyasaṁ`: *cháo sữa* (4 lần) so với *cơm sữa* (1 lần, `thag1.23`), cùng thêm *ngọt* cho `madhu`; giữ *cháo sữa ngọt*. (4) Chưa tìm được tiền lệ cho `dhammasaṅgāhakehi` ở tầng khác; giữ *các vị trưởng lão kết tập Chánh pháp* theo nghĩa từ. (5) Tiêu đề `0.2` *cách dùng dẫn với ví dụ* giữ nguyên theo đa số tầng (nhưng chữ *dùng dẫn* chưa rõ nghĩa, chờ sửa lan riêng cho cả `mil7.*`). Trong bài không có cặp Pāli trùng nguyên văn nên phép đối chiếu nội bộ chạy rỗng. Cổng kỹ thuật vẫn do `npm run validate`, `npm test`, `npm run check`, `npm run build` quyết định.
