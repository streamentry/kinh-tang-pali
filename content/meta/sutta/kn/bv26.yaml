notes: |-
  **Công thức `X bhagavato vaṁso N-samo.`** xuất hiện 25 lần trong snapshot
  (đúng 25 phẩm bv3–bv27), và **chưa phẩm nào** được dịch trước đây, nên tôi đặt cả
  chuỗi này cho 9 phẩm của lát và ghi lại ở đây. Số thứ tự đã tự kiểm: bv3 = `paṭhamo`,
  bv4 = `dutiyo` … và bv27 = `pañcavīsatimo`, khớp đúng thứ tự phẩm, nên
  `cuddasamo` = 14, `pannarasamo` = 15 (pañña 5 + rasa 10), `soḷasamo` = 16,
  `ekūnavīsatimo` = 19, `ekavīsatimo` = 21, `dvāvīsatimo` = 22, `tevīsatimo` = 23,
  `catuvīsatimo` = 24, `pañcavīsatimo` = 25.

  **Tiền lệ (đếm được trong `content/translation/vi/project/sutta/`):** tên Đức Phật
  giữ nguyên chữ Pāli — `dn14` đã dịch *Kakusandha, bậc Đức Thế Tôn A-la-hán Chánh
  Đẳng Giác*, *Vipassī, …*, *Vessabhū, …*, *Koṇāgamana, …*; `Gotama` (2027 chỗ),
  `Kassapa` (365 chỗ). `bhagavato` → *Đức Thế Tôn* (331 chỗ). **0 tiền lệ** cho
  `vaṁso` nghĩa dòng các Đức Phật: tầng Việt có *dòng dõi* (94 chỗ) và *truyền thống*
  (71 chỗ) nhưng cả hai chỉ xuất hiện với nghĩa gia đạo / truyền thống, không phải
  dòng kế thừa các Đức Phật, nên tôi đặt mới *Dòng kế thừa*. Có *thứ mười* (123 chỗ),
  *thứ mười bốn* (9), *thứ hai mươi* (8), *thứ hai mươi lăm* (1) sẵn.

  **Ràng buộc kỹ thuật phải nói thẳng.** Tên ba Đức Phật *Atthadassī*, *Dhammadassī*,
  *Siddhattha* **chưa có tiền lệ nào** trong tầng Việt (0 chỗ, có dấu lẫn không dấu).
  Chốt `lọt_pāli` của `_hvi.py` sẽ fail nếu ta viết dấu Pāli cho một từ chưa từng
  xuất hiện, nên tôi bỏ dấu ở ba tên này. Hệ quả phải ghi: **chuỗi bv của tôi không
  nhất quán về hình thức** — `Vipassī`, `Vessabhū`, `Koṇāgamana` có dấu, ba tên kia
  không. Tôi chọn giữ dấu ở chỗ đã có tiền lệ thay vì tự phát minh một cách viết
  Hán–Việt cho ba tên đó.

  **Không có tầng Anh.** 0/106 khoá có Anh Sujato (đếm trên tệp Pāli), và
  `translation/vi/phantuananh/` chỉ có Pháp Cú. Đối chiếu chỉ có thể là Pāli + tiền
  lệ trong chính tầng Việt, nên `triangulation` ở mức thấp của lát.
  **Riêng tên Đức Phật:** 365 chỗ.

  **Kết:** *Dòng kế thừa của Đức Thế Tôn Kassapa là thứ hai mươi tư.*
