  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 8 khoá bất đồng nghĩa → sửa 0, giữ 5, bất định 3. Giữ: 7.1 (như bv24:5.1); 9.3 (atikkantabhavantānaṁ: bản nguyên bài là vượt qua tham ái, Pāli là bhava, hữu); 11.2 (sadhamme pāramiṁ gato: bản nguyên bài là phận sự chánh yếu, Pāli là trong pháp của mình); 40.3 (Vicitasenā: bản nguyên bài là Vijitasenā, giữ tên theo Pāli ghim); 41.4 (gahapūrito: bản nguyên bài là quầng ánh sáng, Pāli là gaha, tinh tú). Bất định: 2.1 (kulamūlaṁ: gốc rễ gia tộc theo nghĩa đen, hay tài sản gia tộc như bản nguyên bài; chỉ có một lần trong cả tầng, không có tiền lệ); 17.1 (Ahu kapilavhayā rammā: như bv24:11.1, ahu đi với rammā là danh từ hay đứng trước nikkhamitvā ở 17.2); 46.4 (sīlasaṁsaggamaddanaṁ: bản dự án dịch nghiền nát sự giao kết với giới, sát nghĩa compound nhưng khó hiểu về giáo lý; bản nguyên bài tách thành giới và trừ diệt sự gắn liền với phiền não, là cách diễn giải không đọc thẳng được từ compound, nên chưa nhận; chưa phân xử được). Rà đối kháng lại số lượng (hai mươi, mười, năm, ba ngàn koṭi, bốn tháng, hai ngàn năm, ba lần mười sáu ngàn, bảy ngày, hai mươi ratana, hai mươi ngàn năm, một do-tuần) với Pāli: khớp bản nguyên bài. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đối chiếu bản nguyên bài Bhikkhu Indacanda, tiền lệ bv24:15.1–15.2, bv25:7.1, bv25:16.3–16.4): sửa 10 khoá. `32.3`–`32.4` **sai cú pháp** đã được nêu ở notes `bv25` (lượt 2026-10-13): `vasate` có chủ ngữ `mahākulaṁ`, bản cũ “Cư ngụ tại thành phố ấy, / là đại gia tộc…” nghe như Đức Phật “là đại gia tộc”; nay giống hệt `bv25:16.3`–`16.4`. `2.1`–`2.3`: `sañchaḍḍitaṁ` là quá khứ phân từ đối cách đi với `kulamūlaṁ`, tân ngữ của `datvāna … dānaṁ` (của cải gia tộc được đem cho làm vật thí), không phải gerund “sau khi từ bỏ” tách khỏi việc bố thí; `bahvannapānabhojanaṁ` đọc như tính từ bổ nghĩa (“dồi dào…”). `27.1`–`27.2`: bỏ calque “Nếu của bậc…”, giữ thì tương lai `virajjhissāma` (“chúng ta sẽ bỏ lỡ”). `31.4` `bodhiyāyeva kāraṇā` “chỉ vì mục đích giác ngộ” (bỏ “một mục đích duy nhất”, Pāli chỉ có `eva`). `43.3` `nivāsetvā` “Sau khi mặc” (không phải sai khiến “cho mặc”; cùng khuôn `pārupitvā` “khoác” ở 45.3). `8.1` như `bv25:7.1`. Bất định thêm: `7.1` `naradevassa yakkhassa`: bản nguyên bài đọc là dạ-xoa tên Naradeva (người nghe Pháp); bản dự án giữ cách đọc danh xưng của Đức Phật theo `bv24:5.1`, không phân xử được từ Pāli ghim. Bất định 1 (`ahu kapilavhayā`), 2, 8 (`upaṭṭhāka` của cư sĩ), 14 (`46.4`) vẫn mở.

  Quyết định hội đồng biên tập 2026-10-16: A6 — 30.2 (`bhiyyo` chỉ là "thêm", bỏ "bội phần" thừa ý); A7 — 12.2, 24.2, 24.4, 40.2, 40.4 (`upaṭṭhāka/upaṭṭhikā` chỉ cư sĩ = "thí chủ hộ độ", không phải "thị giả", như mn81); B17 — 25.4 (`kira` ở lời thọ ký trực tiếp = "thì ra" (người nghe vừa nghe chính Đức Phật thọ ký)).

  Nghiên cứu nguồn ngoài 2026-10-16: chú giải Madhuratthavilāsinī (Buddhavaṃsa-aṭṭhakathā), đoạn
  Kassapabuddhavaṃsavaṇṇanā, ấn bản CST4 (https://www.tipitaka.org/romn/cscd/s0511a.att26.xml); bản
  Việt song ngữ Bhikkhu Indacanda (https://tamtangpaliviet.net/TTPV/ttpv_42_Bv&Cp.pdf, kệ BJT 1-51, có
  dị bản) và bản nguyên bài sc-data. Horner và Law không tra được bản mở. Đã đối chiếu cả 215 khoá;
  sửa 5 khoá, đều có hai nguồn độc lập (chú giải Pāli và bản Indacanda) cùng đọc khác bản cũ: (1)
  7.1-7.2 `naradevassa yakkhassa … apare dhammadesane`: chú giải kể rõ Naradeva là tên một dạ-xoa mạnh
  thần lực ăn thịt vua, được Đức Phật điều phục trong một lần thuyết Pháp khác, rồi vô số người chứng
  ngộ; bản cũ đọc thành hai tính từ “vị trời giữa loài người, bậc đầy uy lực” và số nhiều “những lần”,
  mất tên dạ-xoa; nay “Của dạ-xoa Naradeva, trong một lần thuyết Pháp khác”; (2) 14.2 `vattāvattesu
  kovido`: chú giải glossa “khuddakavatta-mahāvattesu” (bổn phận nhỏ và lớn), bản cũ “bổn phận và
  không là bổn phận”, nay “các bổn phận lớn nhỏ”; (3) 41.4 `candova gahapūrito`: chú giải glossa
  “parivesagahaparikkhito puṇṇacando” (trăng tròn bao quanh bởi quầng sáng), bản Indacanda cũng “quầng
  ánh sáng”, bản cũ “các tinh tú”; nay “như mặt trăng tròn đầy trong quầng sáng”; (4) 46.4
  `sīlasaṁsaggamaddanaṁ`: chú giải glossa giới siêu thế dùng để nghiền nát sự giao kết với phiền não
  (“kilesasaṃsaggamaddanatthāya”), bản cũ “nghiền nát sự giao kết với giới” trái nghĩa; nay “giới
  nghiền nát sự giao kết”, không thêm chữ “phiền não” vì không có trong Pāli. Cùng khoá Pāli
  `naradevassa yakkhassa` còn ở `bv24:5.1` (bài khác, ngoài lát này, dịch như bản cũ). Chú giải xác
  nhận thêm, không đổi: 2.5-2.6 `āḷakaṁ` là chuồng bò; 3.1 hai mươi ngàn koṭi; 6.1-6.2 `sudhammā` là
  hội trường chư thiên ở cõi Đao-lợi, Đức Phật thuyết Abhidhamma với thân mẫu Dhanavatī đứng đầu;
  11.3-11.4 `bhūmantalikkhakusalo` giỏi địa học và thiên văn; 12.2 `upaṭṭhāko` Ghaṭīkāra (thợ gốm) là
  cư sĩ hộ độ, còn Sabbamitta ở 38.3 là vị thị giả (A7 nhất quán); 12.4 `nibbuto tatiye phale` do
  chứng quả thứ ba; 34.1-34.4 ba lâu đài Haṁsa, Yasa, Sirinanda; 35.1 `tisoḷasasahassāni` là bốn mươi
  tám ngàn; 36.2 Ngài ra đi bằng lâu đài (chú giải: lâu đài bay lên không đưa đi); 36.3 bảy ngày;
  43-48 các ví dụ Pháp là đồ trang sức, áo giáp và vũ khí: hồ nước Pháp là pháp học, gương Pháp là Sơ
  quả đạo, khiên niệm là bốn niệm xứ, giáo trí là tuệ quán sắc bén, tấm lọng trắng là giải thoát. Còn
  bất định: 2.1 `kulamūlaṁ` (chú giải glossa “kulagharaṃ”, nhà và gia sản vô lượng; bản này giữ nghĩa
  đen “gốc rễ gia tộc”); 5.2 `ñāṇadhātuṁ` (chú giải glossa `dhātu` là bản thể “sabhāva” của toàn tri;
  bản này giữ “giới của trí”); 9.3 `atikkantabhavantānaṁ` (chú giải: những vị đã vượt qua hàng phàm
  phu, Dự lưu v.v., tức mọi vị lậu tận; Indacanda: vượt qua tham ái; giữ “vượt qua các hữu”); 17.1
  `ahu kapilavhayā rammā` giữ như `bv21:14.1`. Chưa thêm blocker; blocker Pāli/thiếu Anh cũ giữ
