notes: |-
  Đợt 19, làn 107. Dịch từ Pāli root commit đã ghim, đủ 215/215 khoá (214 khoá mới; khoá kết `52.1` đã có sẵn từ lần trước, giữ sau khi kiểm lại: `catuvīsatimo` = catu 4 + vīsati 20 = 24, khớp thứ tự phẩm, bv3 = thứ nhất nên bv26 = thứ hai mươi tư), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ hai mươi tư của Buddhavaṃsa, về Đức Phật Kassapa: ba lần chứng ngộ Pháp (hai mươi ngàn, mười ngàn, năm ngàn koṭi) cùng lần giảng ở cõi trời (ba ngàn koṭi), hai kỳ hội chúng, tiền thân là thanh niên Jotipāla xuất gia nhờ Ghaṭīkāra và được thọ ký, lời thọ ký về Đức Gotama (`16.3`–`24.4`) cùng lời nguyện của chư thiên và loài người (`27.1`–`29.4`), gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, chuỗi ẩn dụ Pháp là đồ trang sức và vũ khí (`43`–`48`), nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.** `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”, `0.2` “26. Dòng Kế Thừa Của Đức Phật Kassapa”: cùng khuôn với `bv25`, `bv24`, `bv27`. `52.1` giữ “Dòng kế thừa của Đức Thế Tôn Kassapa là thứ hai mươi tư.”

  **Số Pāli, đã tự tính.** `vīsakoṭisahassa` = 20 × 1.000 koṭi = **hai mươi ngàn koṭi** (3.3; như `bv25:4.3` `vīsatikoṭisahassānaṁ`); `dasakoṭisahassa` = 10 × 1.000 koṭi = **mười ngàn koṭi** (4.3); `pañcakoṭisahassa` = 5 × 1.000 koṭi = **năm ngàn koṭi** (5.3); `tīṇikoṭisahassa` = 3 × 1.000 koṭi = **ba ngàn koṭi** (6.3). Cả bốn là `koṭisahassa`, không phải cụm `Tiṁsakappasahassa` còn bỏ ngỏ, và ở đây không có chữ `kappa` đi với số. Thang lớn nhân cả số tích lũy. `vīsabhikkhusahassa` = 20 × 1.000 = **hai mươi ngàn tỳ-kheo** (9.1). `catumāsa` = **bốn tháng** (4.1). `eko samāgamo` = **một** cuộc tụ hội (8.2). `tatiye phale` = quả **thứ ba** (12.4). `duve vassasahassa` = 2 × 1.000 = **hai ngàn năm** (34.1). `tayo pāsāda` = 3 (34.4) khớp ba tên ở `34.3`. `tisoḷasasahassa` = 3 × 16 × 1.000 = **ba lần mười sáu ngàn** (35.1; giữ đúng nguyên văn `bv13:20.1` và `bv18:15.1`, không quy ra 48.000). `caturo nimitta` = 4 (36.1). `sattāha` = **bảy ngày** (36.3). `vīsatiratana` = **hai mươi ratana** (41.2; giữ đơn vị `ratana`, như `bv23:26.1`, `bv18:21.1`). `vīsativassasahassa` = 20 × 1.000 = **hai mươi ngàn năm** (42.1). `yojana` = **một do-tuần** (51.4). `dasapāramī` = **mười** ba-la-mật (30.4). `navaṅga` = **chín** phần (15.2). `tiṇṇaṁ vedāna` = **ba** Vệ Đà (10.4). Không có số nào dịch theo phỏng đoán; đã tự kiểm lại từng phép nhân.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt kn đã dịch (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 113 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 945 cặp, trong đó 143 cặp có Việt khác bản tôi viết; 70 trên 113 khoá dùng đúng nguyên văn mọi tiền lệ. 43 khoá còn lại không giống hệt nhưng khác biệt thuộc ba loại, đã đo: (a) chỉ khác dấu câu cuối khoá theo Pāli từng khoá (`2.6`, `4.4`, `9.2`, `15.2`, `17.4`, `32.4`, `30.2`: tiền lệ kết bằng chấm phẩy hoặc dấu chấm theo Pāli của chúng); (b) chỉ khác nháy theo Pāli từng khoá (`16.3` nháy đơn mở, `23.6`, `24.4` và `29.4` nháy đơn đóng hoặc không, `27.4` không nháy; 15 trên 17 cặp ở `16.3` khác chỉ vì nháy); (c) tiền lệ ở `tha-ap` có thể dịch ngôi hoặc lối diễn đạt khác (`10.3`, `10.4`, `13.3`, `13.4`, `25.1`, `25.3`, `35.2`, `42.4`: ở các khoá này tôi dùng đúng cách dịch của chuỗi bv). Cụ thể: `1.2` dùng “có bậc Chánh Đẳng Giác…” theo 6 trên 9 tiền lệ (cùng Pāli, 3 cặp không có “có”, đều ở tầng khác); `1.3` `Kassapo nāma gottena` → “tên theo dòng họ là Kassapa,” theo 14 trên 16 cặp (cặp khác: “tên là Kassapa, dòng họ Gota”); `49.2` `appameyyo durāsado` → “không thể đo lường, khó tiếp cận;” theo 3 trên 3 tiền lệ (`bv4`, `bv14`, `bv24`); `11.1` và `11.2` theo `snp5.1:45.1`, `snp5.1:45.4` (cùng Pāli, 1 cặp: “Về tướng thuật và sử truyện,” và “đã đạt đến sự thông suốt trong pháp của mình”); `8.1` dùng “Cũng của vị ấy” theo `bv15:25.1`, `bv25:7.1` (2 trên 3; `bv17:5.1` là “Cũng nơi vị ấy”); `41.1` dùng “vị Phật ấy” theo `bv22`, `bv7`, `bv6` (3 trên 4; `bv25:25.1` là “Đức Phật ấy”); `25.4` bỏ nháy vì Pāli bài này không có nháy (tiền lệ `bv4:17.4` có nháy vì Pāli ở đó có); `7.4` dùng đúng `bv28:3.4` “không thể đếm hết.” (cùng Pāli, 2/2 trong `bv28`), còn `bv24:5.4` là Pāli khác (`asaṅkhiyo`).
    - Pāli trùng trong chính bài: 4 nhóm. `23.5`/`39.3` (`bodhi tassa bhagavato`), `27.3`/`29.3` (`anāgatamhi addhāne`), `33.4`/`38.4` (`kassapassa mahesino`): bản Việt mỗi nhóm giống hệt nhau ⇒ 0 cặp lệch. `27.4`/`29.4` (`hessāma sammukhā imaṁ`): Pāli ở `29.4` có thêm nháy đơn đóng nên Việt có thêm `’`, ngoài ra giống hệt ⇒ 0 cặp lệch về nghĩa.
    - Dấu lược: Pāli không có `…`, `…pe…` hay `(…)` ở khoá nào; bản Việt cũng không có `…` nào (0 lệch).
    - Nháy: Pāli mở nháy kép ở `1.1` và đóng ở `51.4` (`”ti`); mở nháy đơn ở `16.3` đóng ở `24.4`; mở nháy đơn ở `27.1` đóng ở `29.4`; đếm khớp Pāli từng khoá, 0 lệch trên 215 khoá.
    - `16.3`–`16.4` `Imamhi bhaddake kappe … bhavissati`: lời thọ ký tương lai (như `bv24:10.3`–`10.4`, `bv25:12.3`–`12.4`); không có số kiếp nên cách dịch “sau … kiếp nữa” của các thọ ký như `bv20:9.3`, `bv16`, `bv18` không áp dụng ở đây; mọi động từ thọ ký (`hessanti`, `hessāma`, `upehiti`, `bujjhissati`, `bhavissati`) dịch tương lai “sẽ”, không đảo thành quá khứ.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; số tệp trừ chính bài này).
    - `upaṭṭhāka` → “thị giả”: giữ theo chuỗi bv (`bv4`, `bv21`, `bv22`, `bv23`, `bv27`) cho cả Ānanda lẫn Ghaṭīkāra, Sabbamitta; `mn81` dịch `upaṭṭhāka` của Ghaṭīkāra là “người hộ độ”, không chọn ở đây để cùng khuôn chuỗi bv (bất định 8). `aggasāvaka` → “đệ tử thượng thủ”, `aggupaṭṭhaka` → “thị giả hàng đầu” (như `bv22`, `bv23`).
    - `nāyaka` → “bậc Dẫn Đạo”; `jina` → “bậc Chiến Thắng”; `mahesi` → “bậc Đại Ẩn Sĩ”; `naruttama` → “bậc tối thượng trong loài người” (như `bv24`, `bv25`); `purisuttama` → “bậc tối thượng giữa loài người” (như `bv25`); `dhammarāja` → “bậc Pháp Vương” (`bv21:12.5`, 1/1; `bv28:20.1` “Pháp vương”); `pabhaṅkara` → “đấng chiếu sáng” (`bv28:5.4` “những bậc chiếu sáng”, 1/1).
    - `gotta` → “dòng họ” (14 trên 16 cặp cho khoá `1.3`). `itihāsa` → “sử truyện” theo `snp5.1:45.1` (1/1 cùng Pāli); ở `dn3`, `dn4`, `mn` dịch “truyền thống lịch sử” (9) hoặc “lịch sử” (18 trên 21 khoá chứa `itihās`), nhưng đó là cụm `itihāsapañcama`; cùng cụm `lakkhaṇe itihāse ca` có tiền lệ trực tiếp nên theo `snp5.1`.
    - `ñāṇa` + `dhātu` (5.2) → “giới của trí”: `dhātu` → “giới” ở tầng Việt (như `ps1.1:36`, `ne13:4` “giới/phạm vi”), `ñāṇadhātu` không có tiền lệ nguyên cụm (0 khoá).
    - `āveḷa` → “vòng hoa” (`pv24:6.4`, `pv34:2.6` “vòng hoa vàng”, 2/2); `tevijjā` → “ba minh”; `chaḷabhiññā` → “sáu thắng trí” (`bv3:4.4`, `bv3:15.2`, `bv6:5.3`, `bv10:8.2`, `bv13:29.1`: 5/5); `phalaka` → “tấm khiên” (`mil6.4.2:41.1`, “tấm khiên” 1/1); `kunta` → “giáo”; `khagga` → “gươm”; `kañcuka` → “áo khoác”; `kavaca` → “giáp” (0 tiền lệ ở kn cho `sīlakañcuka`, `jhānakavaca`, `dhammacamma`, `sannāha`: chuỗi `43`–`48` không trùng Pāli với bài nào khác).
    - `hiri` → “hổ thẹn” (`iti42:2.3` “Hổ thẹn và ghê sợ”, 1/1 khoá Pāli chứa `hirī ca` ở kn; đếm chữ Việt ở dn/mn, không đối chiếu Pāli: “hổ thẹn” 55, “tàm” 18, “tàm quý” 5). `ehipassika` → “đến để mà thấy” và `svākkhāta` → “được khéo thuyết” theo cụm công thức ở `dn16:2.9.6`, `dn18:27.10`; ở kn `svākkhāta` có 8 khoá chứa (`thag16.6:20.1` “được khéo giảng dạy”, `ud4.9:1.6` “được khéo thuyết”); `suppaṭipanna` → “khéo thực hành” (`dn28:2.15` “Tăng chúng đệ tử khéo thực hành”). `abhaya` → “vô úy” (`mn91:36.9`, `sn7.18:6.4`).
    - Tên riêng đã có tiền lệ trong tầng (số tệp): `Koṇāgamana` 12, `Kassapa` 118, `Mahākassapa` 29, `Jotipāla` 6 (`dn19`…), `Ghaṭīkāra` 4 (`mn81`), `Ghaṭikāra` 2 (`mil5.5.7`), `Kikī` 7 (`dn14`), `Brahmadatta` 13, `Dhanavatī` 1 (`dn14:1.12.19`), `Sunandā` 7, `Vijitasena` 2, `Sumaṅgala` 12, `Bhaddā` 21, `Bhāradvāja` 42, `Tissa` 60, `Sabbamitta` 4, `Uruvelā` 36, `Sudhammā` 18, `Bārāṇasī` 68, `Nerañjarā` 24, `Ajapāla` 11, `Kapila` 57, `Hatthāḷavaka` 3, `Nandamātā` 7. Chưa có tiền lệ: `Sirinanda`, `Vicitasenā`, `Anuḷā`, `Setabyārāma` (0 tệp); `Haṁsa` có đúng 1 tiền lệ là tên lâu đài (`bv20:15.3` “Garuḷapakkha, Haṁsa và Suvaṇṇabhāra”), 3 tệp khác (`ja510`, `tha-ap535`, `tha-ap545`) là tên người hoặc tên thành; giữ dạng Pāli có dấu như chuỗi bv.
    - Cây Bồ-đề: `assattha` → “cây assattha” (như `bv4:15.4`, `bv21:20.6`); `nigrodha` → “cây nigrodha” (`dn16:3.34.1` “cây nigrodha của những người chăn dê”).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
    1. `17.1` `Ahu kapilavhayā rammā`: `ahu` là quá khứ, nhưng toàn đoạn `16.3`–`24.4` là lời thọ ký tương lai; dịch sát chữ “Đã có nơi xinh đẹp mang tên Kapila” và `17.2` “Đức Như Lai, sau khi rời đi”, đúng `bv21:14.1`–`14.2`, `bv22:13.1`, `bv23:16.1`, `bv24:11.1`, `bv25:13.1` (cùng Pāli, giống hệt). `kapilavhayā rammā` vừa có thể là chủ cách (“có nơi xinh đẹp…”) vừa là xuất xứ cách (“từ nơi xinh đẹp…”): không phân xử được ở đây. Cùng một khoá Pāli nằm ở `bv2:62.1` (bv2 chưa có bản dịch trong tầng), `bv21:14.1`, `bv22:13.1`, `bv23:16.1`, `bv24:11.1`, `bv25:13.1`, `bv26:17.1`: cần thống nhất cho cả bảy khi người biên tập quyết định.
    2. `2.1`–`2.6`: `kulamūlaṁ` dịch “gốc rễ gia tộc” (không rõ là cơ nghiệp hay dòng dõi); `pūrayitvāna mānasaṁ` dịch “làm cho tâm được đầy đủ” (có thể hiểu là làm trọn ý nguyện); `āḷakaṁ` dịch “chuồng” theo cách hiểu thông thường (“bò đực phá tung chuồng”), nghĩa chính xác của `āḷaka` không xác lập được.
    3. `5.2` `ñāṇadhātuṁ pakittayi`: “giới của trí” là dịch sát chữ; cũng có thể là “yếu tố trí tuệ” hay “cõi trí”.
    4. `6.1` `Sudhammā devapure ramme`: `Sudhammā` có thể là hội trường Sudhammā của chư thiên (như `dn21:1.12.48` “hội trường Sudhammā”) hay tên khác; Pāli bài này không nói “hội trường” nên giữ tên trần.
    5. `7.1`–`7.4`: `naradevassa yakkhassa` theo đúng cách `bv24:5.1`; `etesānaṁ abhisamayā` (“sự chứng ngộ của những vị này”) không nói rõ “những vị này” là ai (các lần thuyết khác ở `7.2`).
    6. `9.3`–`9.4` `Atikkantabhavantānaṁ, hirisīlena tādinaṁ`: `bhavantānaṁ` đọc là các “hữu” đã vượt qua (`bhava`+`anta`); nếu là phân từ hiện tại của `bhavati` thì nghĩa khác; `hirisīlena` có thể là hợp chất “tàm-giới” hay hai từ “hổ thẹn” và “giới”. Chọn cách sát chữ nhất.
    7. `11.3`–`11.4` `Bhūmantalikkhakusalo, katavijjo anāvayo`: `bhūmantalikkha` đọc “đất và bầu trời”; `katavijjo` “đã thành tựu các môn học”; `anāvayo` “không thiếu sót” (nghĩa chính xác của `anāvaya` không xác lập được). `11.2` `sadhamme` theo `snp5.1:45.4` là “pháp của mình” (sa + dhamma), không đọc là “chánh pháp”.
    8. `12.2`–`12.4`: `Ghaṭīkāra` là cư sĩ (`mn81`, dịch “người hộ độ”) nhưng bv dịch `upaṭṭhāka` “thị giả”; `sagāravo sappatisso` dịch “có lòng tôn kính, biết vâng phục” (0 tiền lệ nguyên cụm); `nibbuto tatiye phale` dịch “đã tịch tịnh ở quả thứ ba” sát chữ, không thêm “bất lai”. `13.1` `ādāya maṁ` dịch “sau khi dẫn ta theo”.
    9. `14.2` `vattāvattesu kovido`: đọc `vatta` + `avatta` “bổn phận và không là bổn phận”; chữ `vattāvatta` ít gặp, có thể có cách đọc khác (“tập quán và không phải tập quán”).
    10. `25.2` `assamassa mahesino`: Pāli ở đây có `ss` kép; dịch “bậc Đại Ẩn Sĩ vô song” như `bv4:17.2` (`asamassa`), coi `assamassa` là dạng viết của `asamassa`; nếu là `assama` (am thất) thì nghĩa khác (“của bậc Đại Ẩn Sĩ ở am thất”). Một dị bản chữ viết, không phân xử được từ Pāli ghim.
    11. `26.4` `dasasahassī sadevakā`: chủ ngữ của `namassanti` là “mười ngàn thế giới cùng chư thiên” theo lối hoán dụ; không thêm chữ “chúng sinh”.
    12. `31.1` `Evamahaṁ saṁsaritvā`: “Như vậy ta đã luân chuyển” sát chữ; Pāli không nêu “luân hồi” làm tân ngữ.
    13. `41.4` `candova gahapūrito`: 0 tiền lệ trong toàn Pāli ghim; `gaha` vừa là “tinh tú/hành tinh” vừa là “sự nắm giữ”; dịch “như mặt trăng tràn đầy các tinh tú”, khả dĩ nhưng không chắc.
    14. `43`–`48` (chuỗi Pháp là đồ trang sức và vũ khí): đây là đoạn duy nhất của Buddhavaṃsa Pāli ghim có chuỗi này (0 khoá trùng Pāli ở bài khác). `43.1` `māpayitvā` dịch “tạo dựng”; `45.1`–`45.2` `sīlakañcukaṁ … jhānakavacavammitaṁ` đọc `vammitaṁ` phụ cho “áo khoác giới” (“được bọc bằng giáp thiền”), cách đọc khác là phụ cho người nhận; `45.3` `pārupitvā` dịch “sau khi khoác”; **`46.4` `sīlasaṁsaggamaddanaṁ` dịch sát chữ “nghiền nát sự giao kết với giới”; Pāli ghim không cho đủ để phân xử nghĩa (có thể là “nghiền nát sự giao du với điều bất thiện” khi `sīla` là “nếp sống”)** — đây là chỗ bất định lớn nhất của bài; `47.2` `āveḷaṁ caturo phale` “vòng hoa là bốn quả”; `48.3` `abhayaṁ pupphaṁ` “đóa hoa vô úy”.
    15. `51.1` `Mahākassapo jino satthā`: ở đây là danh xưng của Đức Phật Kassapa (“Mahākassapa”), không phải Đại Ca-diếp thượng thủ của Đức Gotama; tên viết giống nhau (29 tệp `Mahākassapa` ở tầng). `51.4` `yojanubbedha` “vươn cao một do-tuần”.
    16. `1.4` `Dhammarājā pabhaṅkaro` “đấng chiếu sáng” theo `bv28:5.4`; `ja339:3.2` dịch cùng cụm này “Đấng Pháp vương chiếu tỏa ánh quang minh”, khác cách nói không khác nghĩa.

