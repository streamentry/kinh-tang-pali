notes: |-
  **Phạm vi: đủ 364/364 khoá của cnd9, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Dhotaka (Pārāyana, câu hỏi thứ năm), tức bài kệ `snp5.6`. Cấu trúc như `cnd6`, `cnd10`, `cnd12`, `cnd13`, `cnd16`, `cnd18`, `cnd20`: dẫn từng đoạn kệ, giải từng cụm, rồi nhắc lại cả đoạn kệ trong ngoặc kép (kệ in đậm ở `1`, `8`, `15`, `25`, `36`, `42`, `49`, `55`; nhắc lại trong ngoặc kép ở `7`, `14`, `24`, `35`, `41`, `48`, `54`, `60`). Có ba đoạn trích nguyên văn trong phần giải: `mn8` (`27`), `dhp165` (`29`) và `mn107` (`31`). Pāli có 142 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 41 khoá chứa dấu lược `…`: 38 khoá có `…pe…` (đều thành đúng một `…`; 25 khoá kết bằng `…pe…`), 4 khoá có `…` trần (`40.9`, `40.10`, `43.2`, `52.3`, giữ nguyên số dấu), 2 khoá kết `….` (`45.4`, `45.6`, viết ` ….` như đa số tầng), 0 khoá có `(…)`. Tổng 89 dấu `…` ở bản Việt = 38 + 51 dấu ở Pāli.

  **Cách trình bày lemma** theo `cnd6`/`cnd12`/`cnd13`/`cnd16`/`cnd18`/`cnd20`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Giữ nguyên chữ Pāli ở một chỗ vì lời giải nói về chính hình thức của từ ấy: `Iccā` (`3.2`, đúng nguyên văn `cnd16:3.13`, `cnd18:8.2`, `cnd17:9.2`). Tên người giữ nguyên Pāli: Dhotaka, Sabhiya, Cunda, Sakya. Hô ngữ `dhotakā` ở dòng chuyển lời `(dhotakāti bhagavā)` dịch *(Này Dhotaka, Đức Thế Tôn nói,)* theo `cnd13:7.2`, `cnd16:16.2`, vì `10.1`, `44.2`, `56.4` giải thích chính hô ngữ ấy.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `cnd9`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; trong edition ấy chỉ có tệp tên `cnd-name` (tiêu đề *Exposition of the Questions of the Student Dhotaka*), không có tệp kinh; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho `kn/cnd`. Lớp `english-project` không có `cnd9`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **109** khoá (122 nếu tính cả thẻ); Sujato phủ 0/109 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/109, `vietnamese-current` 0/109. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp5.6` (bài kệ có cùng Pāli ở bốn đoạn kệ của Dhotaka) và của `snp3.6` (đoạn kệ `18`) đã được đọc để kiểm cách parse các dòng kệ (Sujato dịch `sakka` là *Sakyan*, `kathaṅkathāhi` là *indecisions*, `brahme` là *brahmin*, `abyāpajjamāno` là *unobstructed as space itself*), nhưng đó là bản của **bài khác** nên không tính là đối chiếu English của cnd9. Chứng cứ độc lập còn lại là các bản đã dịch của `snp5.6`, `snp3.6`, `snp5.5`, `mn8`, `mn107`, `mn39`, `mn49`, `dhp165`, `an3.65`, `sn35.70`, `ne17`, `ps2.1`, `ps3.2` và công thức chú giải ở `cnd6`, `cnd10`, `cnd12`, `cnd13`, `cnd16`, `cnd18`, `cnd20`, `cnd21`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: 131 khoá có tiền lệ (kể cả ba khoá tiêu đề `0.1`–`0.3`), dùng lại nguyên văn 112, khác 19; so khớp sau khi bỏ dấu câu và chữ hoa/thường (bỏ khối `0.x`): 180 khoá có tiền lệ, dùng lại nguyên văn 153, còn lại 27 khác (gồm cả 19 khoá trên; phần thêm chủ yếu là khoá lặp ở lời giải mà bản Việt cố ý rút gọn hoặc đổi theo thuật ngữ của bài). Nguồn dùng lại chính: `snp5.6` (các dòng kệ), `cnd12`, `cnd13`, `cnd16` (công thức chú giải và cụm `Uddhaṁ adho tiriyañcāpi majjhe`, 57), `cnd10` (`20.4`, `20.5`, `21`), `cnd21` (`4.3`), `cnd6` (`3.4`, `3.6`), `snp3.6` (`18`), `mn8` (`27.2`–`27.3`), `dhp165` (`29`), `mn107` (`31.2`–`31.3`), `ps3.2:8.1` (`11.2`), `ps2.1:10.2` (`6.11`–`6.25`). Trong chính bài này, 48 nhóm Pāli trùng nguyên văn (109 cặp), 5 nhóm bản Việt khác nhau có chủ ý: `1.5`/`8.5`, `6.1`/`13.1`, `6.27`/`13.9`, `7.5`/`14.5` (`sikkhe` ngôi nhất trong lời Dhotaka *con sẽ học tập*, mệnh lệnh trong lời Đức Thế Tôn *hãy học tập*, theo `snp5.6:1.5`/`2.5`) và `47.6`/`49.4`/`53.8` (`49.4` là dòng kệ nên mang *vị ấy*, hai khoá kia là lặp lại lemma, theo `cnd12:9.4`/`13.6`). Các khoá Pāli trùng nguyên văn với bài khác mà bản Việt khác, kèm lý do (19 khoá):
  - `8.2`, `14.2`, `42.2`, `48.2`, `55.2`, `60.2` `(dhotakāti bhagavā)` (trùng `snp5.6:2.2`/`6.2`/`8.2` *(Đức Thế Tôn trả lời:)*) → *(Này Dhotaka, Đức Thế Tôn nói,)*, vì `snp5.6` bỏ hô ngữ `dhotakā` trong khi `10.1`, `44.2`, `56.4` của chính bài này giải thích hô ngữ ấy;
  - `15.3`, `24.3` `Taṁ taṁ namassāmi samantacakkhu,` (trùng `snp5.6:3.3`), `18.4` `Saṁsāramaticca kevalī so,` (trùng `snp3.6:19.4`), `35.1` `Nāhaṁ sahissāmi pamocanāya,` (trùng `snp5.6:4.1`): chỉ đổi dấu cuối khoá cho khớp Pāli (`,` thay `;` hoặc thêm `,`);
  - `25.2`, `35.2` `Kathaṅkathiṁ dhotaka kañci loke;` (trùng `snp5.6:4.2` *đang nghi ngờ*) → *đang nghi hoặc*, và cả `15.4`, `23.1`, `23.11`, `23.12`, `24.4` `kathaṅkathāhi` (so với `snp5.6:3.4` *nghi ngờ*) → *nghi hoặc*: đo trên cnd và snp, `kathaṅkathā` dịch *nghi hoặc* ở 22 khoá, *nghi ngờ* ở 3 khoá; thêm nữa `23.8` `Kathaṅkathā vuccati vicikicchā` buộc phải tách *nghi hoặc* (`kathaṅkathā`) khỏi *hoài nghi* (`vicikicchā`) theo `cnd13:11.1`, còn `kaṅkhā` (`23.9`, `23.10`) là *nghi ngờ* theo `cnd13:11.2`;
  - `36.3`, `41.3` `Yathāhaṁ ākāsova abyāpajjamāno,` (trùng `snp5.6:5.3` *Con nguyện sống ngay tại đây, như hư không,*): `snp5.6:5.3`–`5.4` đã đổi vị trí vế (đưa `idheva … careyyaṁ` lên dòng 3, dồn `santo asito abyāpajjamāno` xuống dòng 4 thành *an tịnh, không hệ lụy, không dao động*), trong khi lời giải `39.1`–`39.6` và `40.1`–`40.12` giải từng cụm theo đúng thứ tự Pāli: nên `36.3`–`36.4`, `41.3`–`41.4` dịch lại theo Pāli (*để con, như hư không, không bị chướng ngại, / ngay tại đây, an tịnh, không lệ thuộc, con có thể sống*);
  - `41.1` `Anusāsa brahme karuṇāyamāno,` (trùng `snp5.6:5.1` *bậc Phạm hạnh*) → *thưa Bà-la-môn*: ít nhất bốn chỗ đúng dạng `brahme` ở tầng `kn` dịch *Bà-la-môn* (`cnd1:7.3`, `cnd4:3.4`, `snp5.1:7.3`, `snp5.19:3.4`) so với một chỗ *bậc Phạm hạnh* (`snp5.6:5.1`), và `17.3` của chính bài này giải Đức Thế Tôn là `brāhmaṇo`; `36.1`, `37.1`–`37.4` theo cách đó;
  - `49.4` `tare loke visattikaṁ.` (trùng `cnd12:13.6` *vượt qua sự đắm say ở đời.*) → thêm *vị ấy* vì là dòng kệ (như `cnd12:9.4`);
  - `54.1` (và `49.1`, `50.1`, `50.3`) `Tañcāhaṁ abhinandāmi,` (trùng `snp5.6:7.1`, `snp5.5:6.1` *Con hoan hỷ với pháp ấy,*) → *Con hoan hỷ với lời dạy ấy*, vì lời giải `50.2` định nghĩa `taṁ` là *lời nói, cách nói, lời giảng, lời chỉ dạy, điều đã được chỉ dạy của Ngài* (xem bất định 9).
  - `1.5`, `8.5` `Sikkhe nibbānamattano.` (trùng `snp4.15:6.5` *hãy tu học*) → theo `snp5.6:1.5` (*con sẽ học tập*) và `snp5.6:2.5` (*hãy học tập*) vì cùng là kệ của Dhotaka.

  **Số Pāli, tự tính (không chép từ bản dựa).** `tisso pucchā` (`2.2`) = ba loại câu hỏi; `tisso sikkhā` (`6.2`, `13.2`) = ba học pháp; `tayo devā` (`16.2`) = ba loại chư thiên; `catūhi kāraṇehi` (`11.4`, `46.6`, `52.5`) = bốn lý do; `sattannaṁ dhammānaṁ` (`17.3`) = bảy pháp, và danh sách ở `17.4` đếm đúng 7 (`sakkāyadiṭṭhi`, `vicikicchā`, `sīlabbataparāmāso`, `rāga`, `dosa`, `moha`, `māna`); `dve nissayā` (`40.6`) = hai sự nương tựa; `ekavokāra`/`catuvokāra`/`pañcavokārabhavaṁ` (`40.10`) = hữu một uẩn / bốn uẩn / năm uẩn; danh sách tài sản `23.5` đếm 16 (Pāli 16, bản Việt 16 *tài sản*); `16.8` bảy cõi trời (`cātumahārājikā`, `tāvatiṁsā`, `yāmā`, `tusitā`, `nimmānaratī`, `paranimmitavasavattī`, `brahmakāyikā`) cộng *những chư thiên cao hơn nữa*; `6.11`–`6.25` đủ 15 mục (như 15 mục của `ps2.1:10.2`); `2.9`, `9.1` (chín và mười hai động từ), `23.11` (bảy động từ), `26.1` (tám động từ), `43.2` (mười động từ), `50.2` (chín động từ) đếm đủ theo Pāli. Không có số kiểu `sahassa`, `sata`, `navuti`, `Tiṁsakappasahassa`.

  **Thuật ngữ, kèm số đếm (đo trên tầng chứ không đoán).** `adhisīlasikkhā`… *học giới / tâm / tuệ tăng thượng*: 26 / 31 / 31 lần xuất hiện (đếm cụm chữ trên toàn tầng), so với *tăng thượng giới / tâm / tuệ học*: 3 / 3 / 5 lần; cụm *ba học pháp* 12 lần (`an3.86`–`an3.90` v.v.), *ba học* 14 lần. `pahātabbaṁ pajahanto` *từ bỏ điều cần từ bỏ* theo `ps2.1:10.2` (không *đoạn trừ*). `cittaṁ padahanto` *dốc tâm tinh cần*: 0 tiền lệ (`ps2.1` chỉ có `adhiṭṭhahanto`). Hạng chư thiên: *chư thiên Tứ Đại Thiên Vương* 32, *Hóa Lạc* 24, *Tha Hóa Tự Tại* 18, *Tam Thập Tam* 13, *Đâu-suất* (cõi 23, chư thiên 4), *Dạ-ma* (cõi 6 lần, chư thiên `thig8.1` viết *Yāma*); `devātidevo` *Thiên Trung Thiên* (ít nhất 5 chỗ: `mil5.4.7:24.2`, `mil5.1.3:8.2`, `vv64:27.4`, `tha-ap314:2.1`, `tha-ap532:9.1`); `atidevo` *vị vượt trên chư thiên* theo `sn6.3:5.2`; `sammutidevā`/`upapattidevā`/`visuddhidevā` *chư thiên do quy ước / do tái sinh / do thanh tịnh*: 0 tiền lệ ở tầng (không có bản Việt nào của đoạn này). Bộ từ đồng nghĩa mô tả đối trị phiền não ở `43.1`–`43.2`, `6.5`–`6.9`: theo `cnd6:15.2` (*giận dữ, hằn học, gièm pha, hơn thua, ganh tị, keo kiệt, giả dối, xảo trá, bướng bỉnh, hung hăng, ngã mạn, ngạo mạn, tự mãn, phóng dật, mọi phiền não, mọi ác hạnh, mọi bứt rứt, mọi nóng bức, mọi thiêu đốt*). `tulayitvā tīrayitvā vibhāvayitvā vibhūtaṁ katvā` và `ñatvā jānitvā` theo `cnd12:12.1`, `cnd18:43.2`. `dukkhe kaṅkhā …` (`23.9`) theo `ne17:16.3` (*tính điều kiện cụ thể*). `sandiṭṭhikaṁ akālikaṁ ehipassikaṁ opaneyyikaṁ` (`45.7`) theo `sn35.70:1.4`, `ne13:8.1`. `itihītiha … diṭṭhinijjhānakkhanti` (`45.9`) theo `cnd12:5.1`, `an3.65:4.1`. `sakkāyadiṭṭhi` *thân kiến* (`ne5:27.6`, `ps2.1:13.2`), `sīlabbataparāmāso` *giới cấm thủ*, `ponobhavikā sadarā dukkhavipākā` theo `mn49:30.14`. `purisathāma/vīriya/parakkama` theo `sn12.22:2.3`, `dn28:19.1`. `anvatthapaṭipadā` *sự thực hành đúng nghĩa* theo `cnd21:7.6`, `cnd15:19.2`.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `2.3`–`2.5` ba loại câu hỏi `adiṭṭhajotanā`, `diṭṭhasaṁsandanā`, `vimaticchedanā`, rồi `imā tisso pucchā …pe…` và `nibbānapucchā` đứng riêng: 0 tiền lệ trong tầng; dịch sát nghĩa từng thành tố (*làm sáng tỏ điều chưa thấy*, *đối chiếu điều đã thấy*, *cắt đứt sự phân vân*), không giải thêm; chưa rõ `nibbānapucchā` là loại thứ tư hay là đoạn đã lược.
  2. `23.10` chuỗi từ đồng nghĩa của nghi: `kaṅkhāyanā`, `kaṅkhāyitattaṁ`, `dveḷhakaṁ`, `dvedhāpatho`, `saṁsayo`, `anekaṁsaggāho`, `āsappanā`, `parisappanā`, `apariyogāhanā`: 0 tiền lệ cho cả chuỗi (chỉ `chambhitattaṁ cittassa manovilekho` có ở `cnd13:11.2`); dịch bám nghĩa gốc từ; một số từ (`āsappanā`, `parisappanā`, `anekaṁsaggāho`) chưa phân xử được chính xác sắc thái.
  3. `26.6` `moceyyuṁ` (dạng sai khiến) đối với `31.6` `mucceyyuṁ` (dạng bị động): đọc theo ngữ cảnh là *họ được giải thoát nhờ chính nỗ lực*, vì `26.5` nói không ai khác là người giải thoát và `attanā … paṭipajjamānā` đi kèm. Nếu hiểu là *họ giải thoát (cho người khác)* thì nghĩa đổi, nhưng không hợp mạch lập luận; chưa phân xử tuyệt đối.
  4. `59.4` câu dài `bhavābhavāya kammabhavāya punabbhavāya kāmabhavāya, …`: giữ trật tự Pāli, đọc *nghiệp hữu* và *tái hữu* theo từng cõi (dục hữu, sắc hữu, vô sắc hữu, rồi tái hữu lặp đi lặp lại); cách ghép từng cặp (nghiệp hữu của cõi này với tái hữu của cõi kế) chưa phân xử được dứt khoát.
  5. `40.2`–`40.5` `santo` chơi chữ: `samāno` (đang hiện hữu) ở `40.2` và `upasanto` (an tịnh) ở `40.4`; bản Việt giữ *an tịnh* ở lemma và *đang hiện hữu* trong lời giải `40.2`.
  6. `39.1`, `39.3`, `39.5` `abyāpajjamāno` *không bị chướng ngại* (Sujato `snp5.6` *unobstructed*) trong khi `na byāpajjati` ở `39.5` là *không ác ý*: hai động từ khác nhau (`byāpajjati` từ `byāpāda`), nên cùng một khoá có *không bị chướng ngại* và *không ác ý*.
  7. `58.1` `saṅgo … lagganaṁ … bandhanaṁ … palibodho`: *trói buộc* (khớp `snp5.6:8.4` ở `55.4`/`60.4`), *mắc vào*, *cột buộc*, *ràng buộc*; `bandhana` ở `cnd17:33.1` là *ràng buộc*, ở `cnd18:43.2` là *trói buộc*: tầng chưa thống nhất, chọn *cột buộc* để không trùng với `saṅga`.
  8. `53.6` `sato tareyyaṁ uttareyyaṁ` (ngôi thứ nhất) dịch *con, có chánh niệm, có thể vượt qua, vượt lên …*; `cnd12:13.5` cùng dạng ngôi nhất nhưng đã dịch ngôi ba (*vị có chánh niệm*); `47.5` là `tareyya` (ngôi ba) nên dịch ngôi ba. Không sửa `cnd12` (ngoài lát), báo.
  9. `49.1`/`50.1`: Sujato `snp5.6:7.1`–`7.2` đọc `taṁ` là *that supreme peace* (đối tượng của hoan hỷ là `santimuttamaṁ`), còn lời giải `50.2` định nghĩa `taṁ` là lời dạy; chọn theo lời giải của chính bài này, chưa phân xử được nếu đọc theo kệ gốc.
  10. `16.13` `gaṇigaṇī`, `sīhasīho`, `nāganāgo`, `munimunī`, `rājarājā`: dịch *X của các X* (*bậc đứng đầu hội chúng của các bậc đứng đầu hội chúng*, *sư tử của các sư tử*, …): 0 tiền lệ ở tầng.
  11. `45.2`–`45.3` `diṭṭhe dhamme` (vị trí cách) dịch *nơi pháp đã thấy …* trong lời giải, nhưng dịch *thiết thực hiện tại* ở kệ (theo `snp5.6:6.3`): hai cách đọc cùng cụm Pāli, phụ thuộc vào cách đọc của người chú giải; giữ cả hai ở đúng chỗ.
  12. `4.4`, `51.4` `kahaṁ narāsabhoti mahesī` là phần còn lại sau `…pe…` của lời giải `isi` (đã gặp ở `cnd21:14.4`–`14.5`): dịch *Đấng Nhân Ngưu ở đâu, như vậy là bậc đại ẩn sĩ*, không thêm phần bị lược.
  13. `26.3` `na chandaṁ janemi … assaddhe puggale acchandike kusīte hīnavīriye appaṭipajjamāne dhammadesanāyāti`: `dhammadesanāya` dịch *theo lời thuyết pháp*; ngữ pháp mở (đối với/ vì), không thêm.

  **Lỗi ngoài lát, báo chứ không sửa.** `snp5.6:2.2`, `6.2`, `8.2` bỏ hô ngữ `dhotakā` (cùng kiểu `snp5.13:3.2`, `snp5.12:3.2`, `snp5.15:3.2` đã báo ở `cnd15`, `cnd16`, `cnd18`); `snp5.6:5.3`–`5.4` đảo vị trí vế (dòng 3 và dòng 4 so với Pāli); `snp5.6:5.1` `brahme` *bậc Phạm hạnh* khác bốn chỗ `brahme` *Bà-la-môn* ở `cnd1`, `cnd4`, `snp5.1`, `snp5.19`; `snp5.6:7.1`/`snp5.5:6.1` `taṁ` *pháp ấy* (so với lời giải `50.2` của chính cnd9).

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (364/364, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` và ngoặc đơn khớp Pāli từng khoá (0/364 lệch; 30 khoá Pāli có nháy, 9 khoá có ngoặc đơn, bản Việt có cùng số lượng); dấu lược `…` khớp Pāli từng khoá (0/364 lệch; 41 khoá có `…`); 0 khoá rỗng; NFC; không khoảng trắng thừa; không nháy thẳng; Pāli lọt sang Việt chỉ gồm `Iccā` (cố ý) và tên riêng `Dhotaka`, `Sabhiya`, `Cunda`, `Sakya`. Đã in và đọc lại cả 364 cặp Pāli↔Việt; lượt đọc đối kháng bắt được 5 khoá lệch dấu cuối so với Pāli (`15.3`, `24.3`, `18.4`, `25.1`, `35.1`, đã sửa) và đưa đến việc dịch lại `36.3`–`36.4`, `41.3`–`41.4` theo thứ tự Pāli thay vì chép `snp5.6`.

