  Sửa lan 2026-10-13: (1) cnd9:61.2 satthā me, bhante bhagavā, sāvakohamasmīti: «Bạch ngài, Đức Thế Tôn là Bậc Đạo Sư của con…» → «Bạch Thế Tôn, Thế Tôn là Bậc Đạo Sư của con, con là đệ tử.» (bhante gửi tới Đức Phật; theo cnd19:68.2 và quy ước xưng hô; cùng dạng ở cnd8, cnd10, cnd17, cnd18 còn «Bạch ngài», ghi nhận để xử lý ngoài lát này). Mục «Bạch ngài … giữ nguyên» ở các ghi chú trên là cách đọc cũ. (2) cnd9:45.7 «không hề thời hạn» → «không thời hạn» (akālikaṁ), căn cứ an11.13:7.2; «hề» là chữ thêm. Đã xét và giữ nguyên: công thức viditaṁ katvā tulayitvā … ở 46.1, 46.2, 46.5, 52.2, 52.4 (dạng «sau khi làm cho biết …, đã cân nhắc …» là lỗi chung của tầng đã ghi, chưa phân xử); không có taṁ te pavakkhāmi, diṭṭhapada hay vosajja trong bài. 2 khoá đổi trên 364, tập khoá và thứ tự không đổi. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại; điểm và status giữ nguyên.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 75 khoá chênh lệch lớn nhất (đọc thêm đối kháng cả 364 cặp Pāli↔Việt) → khác nghĩa 4: sửa 0, giữ 3, bất định 1. Giữ: (1) `36.1`, `37.1`, `37.2`, `37.4`, `41.1` `brahme` (bản mù *bậc Phạm thiên*, bản dự án *Bà-la-môn*; giữ vì `brahme` là hô cách gọi người, `17.3` giải thích Đức Thế Tôn là `brāhmaṇo` do loại bỏ bảy pháp, và khớp `snp5.6`); (2) `53.6` `sato tareyyaṁ uttareyyaṁ` (bản mù lẫn ngôi; `tareyyaṁ` là ngôi thứ nhất nên *con, có chánh niệm, có thể vượt qua* đúng, khác `47.5` `tareyya` ngôi thứ ba *vị có chánh niệm*); (3) `53.1`, `54.4`, `47.6` `tare` (bản mù lúc *hãy*, lúc *có thể*, lúc *sẽ vượt qua*; `tare` là dạng cầu khiến ngôi thứ ba nên giữ *vị ấy vượt qua* theo `snp5.6`, không thêm trợ từ). Bất định: `4.4`/`51.4` `kahaṁ narāsabho ti mahesī` (cả hai bản cùng ghi không chắc; giữ *Đấng Nhân Ngưu ở đâu* theo `cnd8`, `cnd11`, `mnd14`, nơi vế trước nói rõ đây là điều các bậc có uy lực tìm cầu, còn ở bài này bị `…pe…` lược). Phần còn lại của 75 khoá chỉ khác diễn đạt (*Giải thích* so với *Kể Lược*, *hãy chỉ bày* so với *hãy giải thích*, *sáng suốt* so với *minh mẫn*) hoặc bản mù chép lại thẻ in đậm của Pāli. Giữ nguyên `17.4` `vicikicchā` là *nghi hoặc* theo công thức `cnd8:101.3`, `mnd4:17.4`, `mnd4:66.13` (trong các khoá Pāli chứa `vicikicch`, *nghi hoặc* xuất hiện 431 lần, *hoài nghi* 127 lần); chữ *nghi hoặc* cũng là cách dịch `kathaṅkathā`, và `23.8` đã tách hai từ bằng *hoài nghi*. Không đổi khoá nào. Không có bản Anh hay bản Việt độc lập khác.
