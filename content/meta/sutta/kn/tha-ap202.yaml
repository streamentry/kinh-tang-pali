notes: |-
  `Yūthikapupphiyattheraapadāna`,
  thứ 10 của `Tamālapupphiyavagga`. 43/43 khoá. Ba tầng tham khảo đều vắng (xem `blocking_errors`) ⇒
  `draft`, `triangulation` 7.5.

  **Tên phẩm:** `:0.1` giữ Pāli **“Therāpadāna”** (316/325, đo trước khi ghi lát này); `:0.3` theo đa số
  đo lại **167/325** = *“Bài Kệ Tuyên Ngợ Về Trưởng Lão …”* (xem ghi chú ở `tha-ap102`; con số
  165/80/62 của lượt trước đã được đo lại thành 167/84/65 + 9 biến thể). `:0.2` `Tamālapupphiyavagga` → *“Phẩm
  Tamālapupphiya”*: trong **đúng phẩm Tamālapupphiya** tiền lệ **chia đều 2–2** (`tha-ap194`/`tha-ap201`
  dùng *Phẩm Tamālapupphiya*, `tha-ap193`/`tha-ap195` dùng *Phẩm Hoa Tamāla*), nên tôi chọn giữ
  Pāli cho khớp với `:0.3` (vốn giữ Pāli) — **ghi rõ là hòa giải, không phải đa số**.

  **Tiền lệ dùng lại nguyên văn:** `Padumuttaro nāma jino,` → *“Đức Chiến Thắng tên Padumuttara,”*
  (đa số 3/5); `āhutīnaṁ paṭiggaho;` → *“bậc tiếp nhận lễ vật hiến cúng;”* (3 cặp nguyên văn);
  `Ubho hatthehi paggayha,` → *“Tôi nâng hoa bằng cả hai tay,”* (2 cặp nguyên văn); `Buddhassa
  abhiropayiṁ,` → *“Dâng cúng lên Đức Phật,”* (`tha-ap193:2.3` nguyên văn); `Tena cittappasādena,` →
  *“Nhờ tâm tịnh tín ấy,”* (7/18 — đa số rõ nhất); `anubhotvāna sampadā;` → *“anh đã thọ nhận được
  thành tựu;”* (`tha-ap136:6.2` nguyên văn); `Kappānaṁ satasahassaṁ,` → *“Trong suốt một trăm ngàn
  kiếp,”* (3/4 nguyên văn); `eko āsiṁ janādhipo;` → *“ta làm một vị chúa tể của dân chúng;”* (2/5);
  `cakkavattī mahabbalo.` → *“là Chuyển luân vương có đại thần lực.”* (**25/74** — đa số rõ nhất);
  `Paṭisambhidā catasso,`, `…pe…`, `kataṁ buddhassa sāsanaṁ”.` như trên.

  **`Itthaṁ sudaṁ …` (6.1) giữ dạng Pāli:** Pāli là `yūthikapupphiyo` nên tôi viết *“Tôn giả Trưởng
  lão Yūthikapupphiya”*, đúng dạng `tha-ap169:6.1` đã có (nguyên văn).

  **`Ito paññāsakappesu,` (4.1): 0 tiền lệ** → *“Từ năm mươi kiếp trước đây,”* (`Ito … kappe` =
  *từ … kiếp này trở đi*; số 50 giữ nguyên). `Samittanandano nāma,` → *“tên là Samittanandana;”* —
  tên riêng giữ dạng gốc; `mettacittassa tādino.` → *“dâng cho bậc mang lòng thương yêu ấy.”*
  (`mettacitta` = *có tâm từ bi*).

  **`Pavanā nikkhamitvāna,` (1.3) chọn theo tiền lệ** *“Sau khi rời khỏi khu rừng rậm”*
  (`tha-ap252:1.3`) chứ không phải *“Từ chốn rừng sâu bước ra”*, vì `1.4` nói rõ người nói **đi đến**
  (`yāti`) chứ không phải đã ra khỏi. `vihāraṁ yāti cakkhumā.` → *“bậc Hữu Nhãn đi đến tự xá.”* —
  `cakkhumā` là **danh xưng** của bậc Phật; tầng đã dùng *bậc Hữu Nhãn* 3 lần (`sn6.15:10.4`) và
  `vihāra` → *tự xá* (2 lần; *tăng xá* 0 lần), nên tôi theo đa số có sẵn.

  **`yūthikaṁ pupphamuttamaṁ` (2.2)**: `yūthikā` là loài hoa, tầng đã giữ Pāli (*Cầm lấy đóa hoa
  yūthikā* ở `tha-ap169:2.1`), nên tôi viết *“là cọng hoa yūthikā tuyệt đẹp nhất;”*.

  **Uddāna 9 và vagguddāna 11 tên thường bỏ tiếu tố chủ ngữ** theo cách `tha-ap182:9.x` đã làm
  (*Kumuda, Nisseṇī, / Rattika, Udapānada; …*) — `tiṇasanthāro` → *Tiṇasanthāra*,
  `parivāro` → *Parivāra*, `supāricariyopi` → *Supāricariyā*, `tinduko` → *Tinduko*,
  `nelapupphiyo` → *Nelapupphiyo*, `kiṅkaṇiko` → *Kiṅkaṇiko*, `yūthiko` → *Yūthiko*.
  `gāthā paññāsa aṭṭha cāti.` → *“gồm có năm mươi tám câu kệ.”* theo `ekapaññāsa gāthakāti` →
  *“gồm có năm mươi mốt bài kệ.”* ở `tha-ap182:9.6`.

  **Các câu đếm số câu kệ dịch theo nghĩa, KHÔNG tự cộng:** `Chasatāni ca gāthāni, / chasaṭṭhi
  ca tatuttari.` → *“Có một trăm lẻ sáu câu kệ, / lại hơn sáu mươi mối câu nữa.”* — Pāli chỉ nói
  “hơn sáu mươi mối”, không nói hơn bao nhiêu.

  **`Bhikkhāvaggadasakaṁ.` / `Dutiyasatakaṁ samattaṁ.`: 0 tiền lệ** → *“Phẩm Tỳ-kheo — mười
  phẩm.”* / *“Tập thứ hai trăm đã hoàn tất.”*

  **Tên riêng bị chặn oan, đã tra chứng rồi khai vào bộ nhớ tiến trình:** `Tiṇasanthāra`
  (`tha-ap202:9.1`), `Parivāra` (`:11.1`), `Chattā` (`:11.3`), `Supāricariyā` (`:11.4`). Mỗi tên đều
  tra được trong Pāli đã ghim (`tiṇasanthārakattheraapadāna`, `Mahāparivāravagga` ở `tha-ap113`,
  `Chattavagga` ở `tha-ap143`, `supāricariyavagga`) trước khi khai.
