notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja478_root-pli-ms.json` (59/59 khoá, đủ và đúng thứ tự Pāli).

  - Tầng tham khảo:
    Tầng `english-sujato` không có ja478 (tầng này chỉ có 83 bài Jātaka tại commit đã ghim); `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Coverage English: mẫu số = 0 — mọi khoá Pāli của bài đều ngắn hơn 40 ký tự (dài nhất 32), nên cổng coverage không đo được gì; đây không phải bằng chứng đồng thuận về cách dịch. Vì ba tầng đều vắng, `triangulation` đặt 7.5 (không quá 8.0) và bài giữ `draft` với blocker `noEnglishEditionUpstream`. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài và tiền lệ cùng bộ.
  - Tiêu đề & phân loại:
    + `0.1` “Jātaka” đồng nhất mọi bài Jātaka.
    + `0.2` “Bộ Mười Ba Bài Kinh” (Terasakanipāta) theo ja475:0.2 (tầng tên `ja-name` = “The Book of the Thirteens”).
    + `0.3` “Phẩm Xoài” (Ambavagga) theo ja475:0.3.
    + `0.4` “5. Kinh Dūta” theo khuôn “N. Kinh <tên>” (ja475, ja455); `14.1` “Kinh Dūta, thứ năm.” (Pāli `pañcamaṁ`). Tên Dūta (sứ giả) để nguyên Pāli như Phandana ở ja475; ja260 cũng mang tên Dūtajātaka nhưng là bài khác, uid khác.
  - Số Pāli — tự tính:
    + `satta nikkhāni` (10.3) = 7 nikkha; `catuddasā` (13.4) = 14 (catu 4 + dasa 10) = 2 × 7. Phép nhân đôi khớp mạch kể (nhận bảy, vua ban mười bốn). Không còn số nào khác.
    + `ekova` (8.3) = “một mình” (không phải số đếm), `ekamanaṁ` (7.2) = “cùng một tâm ý”.
  - Thuật ngữ & tiền lệ (đo trên tầng Jātaka đã dịch):
    + `gaṅgā` → “sông Hằng”: đa số tiền lệ (ja405, ja425, ja432) so với “Ganges”/“Gāṅgā” ở vài bài lẻ.
    + `kāsīnaṁ raṭṭhavaḍḍhana(o)` (2.2, 13.2) → “bậc làm giàu có cho xứ Kāsi”, theo ja455:12.2 (1 tiền lệ cùng cấu tạo). Cùng cách dịch ở cả hai chỗ.
    + `mahāsāle … brāhmaṇe` (10.2) → “các Bà-la-môn giàu có”, theo tiền lệ `brāhmaṇamahāsāla` ở tầng kinh tạng khác (nhiều tệp); `rājapurise` (10.1) → “những người của vua” (1 tiền lệ: “các người của nhà vua”).
    + `hirottappa` (8.4) → “tàm và quý” theo tiền lệ các kinh Nikāya (10 khoá).
    + `rāja`/`mahārāja` (4.3, 9.3, 10.5, 11.1, 12.1) → “tâu đại vương”; `brahme` → “Bà-la-môn”; `siṅgāla` → “chó rừng” (đa số 36 khoá).
    + `nikkha` (10.3, 13.3, 13.4): đơn vị tiền/trọng lượng vàng, tầng Việt chưa có tiền lệ (chỉ là thành tố tên riêng ở ja90) — giữ nguyên “nikkha”, không đoán quy đổi.
  - Trùng nguyên văn trong bài: 0 cặp (đã dò toàn bộ 59 khoá).
  - Bất định — ghi lại, không thêm vào thân kinh:
    + `guyhamataṁ` (1.4): hiểu là “điều được xem là cần giấu kín”; đây là cấu tạo hiếm (guyha “kín” + mata “được nghĩ/được xem”). Không có tiền lệ trong tầng Việt (ja214:1.2 là từ khác nghĩa).
    + `ekaṅgamapi bhāgaso` (3.2): “dù chỉ một phần, từng phần một”; chủ ngữ của `vippamoceyya` là người cứu giúp, `tassa` ở 3.1 là người đang khổ còn `tassa` ở 3.4 là người cứu giúp.
    + `medhāvīnaṁ ekamanaṁ` (7.2): `medhāvīnaṁ` ở dạng sở hữu số nhiều, dùng như đối cách số ít — dịch “người trí cùng một tâm ý”.
    + `tibbāni` (7.3, 8.3): Pāli chỉ có tính từ “gay gắt, nặng nề” (số nhiều trung tính); danh từ “nỗi đau” bổ sung từ ngữ cảnh (kệ 1–6 nói về dukkha). `parassa` đọc là cách dành cho “người khác”.
    + `avisayhamattano … na te hi mayhaṁ sukhāgamāya` (8.1–8.2): `avisayhaṁ attano` hiểu là “vượt ngoài sức của chính mình (để gỡ)”, và `te` là “những người kia”; câu nối với 11.3 (“họ không đủ sức giải thoát khỏi khổ”). Chưa có bản đối chiếu độc lập để phân xử.
    + `tassādāsi pasannatto` (13.1): chủ ngữ là `kāsīnaṁ raṭṭhavaḍḍhano` ở 13.2 (đảo chủ ngữ trong kệ); dấu nháy mở “ ở 13.1 và đóng ” ở 13.4 là của Pāli, giữ khớp từng khoá dù đây là lời dẫn truyện.
    Vì các chỗ trên và thiếu bản Anh độc lập, `ambiguity_integrity` 9.0.
  - Kiểm tra: 59/59 khoá đúng tập và thứ tự Pāli; NFC, không khoá rỗng, không khoảng trắng thừa; nháy kép “ ” khớp Pāli từng khoá (1.1, 1.4, 12.4, 13.1, 13.4), nháy đơn 0/0; dấu lược `…` 0/0 (Pāli không có); 0 cặp trùng nội bộ; không Pāli lọt vào thân bản dịch ngoài tên riêng và thuật ngữ giữ nguyên (Jātaka, Dūta, Kāsi, nikkha). Đã đọc đối chiếu từng cặp Pāli↔Việt.
