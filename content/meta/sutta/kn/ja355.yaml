notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ja355.
  Đối chiếu văn cảnh tích truyện Jātaka và chú giải Atthakathā để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 25 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Lô G7 2026-10-15: kiểm lại lỗi lặp bằng Pāli đã ghim, Claude Sonnet 5.5 (Claude Code). 5.2
  `sabbakāmarasāharo`: "thâu góp" đổi "mang đến" theo ja536:96.4, ja547:44.4 (`-āhara` là mang đến).
  Điểm giữ nguyên, trừ semantic_fidelity +0,1 do sửa lỗi nghĩa; technical_integrity giữ nguyên.

  Đợt kiểm toán Jātaka chỉ có Pāli 2026-10-15, Claude Sonnet 5.5 (Claude Code): sửa 2.3 (`dhaṅka` là hô ngữ, giữ nguyên chữ, bỏ 'kẻ ngu dốt') và 4.3–4.4 (`nāgamissati` là phủ định: sẽ chẳng đến; bỏ chủ ngữ 'cái chết' tự thêm). Bất định: 5.1–5.2 `nālamekova`, `sabbakāmarasāharo`; 1.1 vai người hỏi.

  Quyết định hội đồng biên tập 2026-10-16: C1 — `0.4`, `6.1` và translationTitle (tiêu đề giữ "Kinh X", bỏ đuôi "jātaka" hoặc "Chuyện Tiền Thân"; cùng tên Pāli thì cùng tên Việt); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
