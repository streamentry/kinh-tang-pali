notes: |-
  Đợt 19, làn 56. Dịch từ Pāli root commit đã ghim, đủ 75/75 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; vì vậy người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung kệ (xem bất định 1).

  **Tiêu đề.**
  - `0.2` `Pakiṇṇakanipāta` → “Bộ Tạp Tập” và `0.3` `Sālikedāravagga` → “Phẩm Ruộng Lúa”: dùng lại nguyên văn `ja490:0.2`, `ja490:0.3` (cùng bộ, cùng phẩm); cả hai đều là khoá Pāli trùng nguyên văn với `ja490`. Xin người điều phối quyết một lần cho tên bộ và tên phẩm này.
  - `0.4` “8. Kinh Con Công Lớn”: `mahā` + `mora` (con công). Theo khuôn `ja159:0.4` “9. Kinh Con Công” (Morajātaka, dịch nghĩa); các tên có `Mahā-` khác trong tầng có hai cách (`ja453:0.4` “Đại Điềm Lành” dịch nghĩa; `ja302:0.4` `ja407:0.4` `ja469:0.4` `ja472:0.4` giữ phiên âm). Chọn dịch nghĩa vì `mora` là danh từ chung chứ không phải tên riêng; “lớn” theo nghĩa `mahā` (vĩ đại, cao quý), xin người điều phối cân nhắc “Đại Công” nếu muốn gọn hơn. Số `8.` ở `0.4` và `aṭṭhamaṁ` ở `18.1` đều là 8 ⇒ “thứ tám” khớp (tiếp nối `ja490` là thứ bảy). `18.1` “Kinh Con Công Lớn, thứ tám.” theo `ja490:17.1`.

  **Pāli trùng nguyên văn trong chính bài (đã quét sau khi nén khoảng trắng): 75 khoá, 4 nhóm.**
  - `5.2` = `6.2` (“Abhayañca yo sabbabhūtesu deti;”): bản Việt giống hệt nhau “và người ban sự không sợ hãi cho mọi loài;” (0 lệch).
  - `7.3` = `10.3` = `11.3` (“Tathā phalaṁ sukatadukkaṭānaṁ,”): bản Việt giống nhau, riêng `11.3` viết hoa “Cũng” vì đứng sau dấu hỏi của `11.2`; nội dung giống hệt. Dòng này là câu lược (xem bất định 4).
  - `8.1` = `9.1` và `8.2` = `9.2` (hai khoá đầu của câu hỏi và câu đáp về mặt trăng, mặt trời): bản Việt giống hệt nhau ở cả hai cặp.
  Tổng cộng 4 nhóm, 0 nhóm có khác biệt nội dung trong bản Việt.

  **Tiền lệ ngoài bài.** Đã dò 75 khoá với toàn tầng Việt hiện có: 6 cặp Pāli trùng nguyên văn.
  - `0.1` “Jātaka” (mọi bài Jātaka), `0.2`, `0.3` (từ `ja490`): dùng lại nguyên văn, 3 khoá.
  - `5.4` “Ito cuto kiṁ labhate sukhaṁ so” trùng `ja391:3.4`: dùng lại nguyên văn “kẻ đã rời khỏi đời này được hạnh phúc gì?” (1 khoá).
  - `6.3` “Diṭṭheva dhamme labhate pasaṁsaṁ” trùng `ja391:4.3` (“được điều cao quý ngay trong đời này”): bản Việt ở đây KHÁC, dịch “ngay trong đời này người ấy được khen ngợi”. `pasaṁsā` ở `iti76:3.3` và `iti76:2.3` dịch “khen ngợi”, `pasaṁsanti` ở `iti106:6.3` dịch “tán thán”; “điều cao quý” không có căn cứ ở Pāli nên không theo.
  - `6.4` “Saggañca so yāti sarīrabhedā” trùng `ja391:4.4` (“rồi còn lên cõi trời khi thân tan rãi.”): dùng lại, chỉ sửa chính tả “rãi” → “rã” (1 chữ).
  Tổng: 6 cặp, 4 khoá dùng lại nguyên văn, 1 khoá dùng lại có sửa 1 chữ, 1 khoá khác có lý do.

  **Số Pāli:** `satta vassāni` (3.1) = 7 → “bảy năm”; `satāni anekāni` (16.2, chim bị nhốt trong nhà) → “nhiều trăm con” (`sata` = 100, `aneka` = nhiều; số cụ thể không được nêu, nên không đổi thành “hàng trăm” cho khỏi hàm ý một số cụ thể); `8.` và `aṭṭhamaṁ` = 8 → “8.”/“thứ tám”. Không còn số lượng nào khác.

  **Thuật ngữ và tiền lệ, đã đo:**
  - `khurappa` (2.1) → “mũi tên sắc”: `ja265:0.4` “Kinh Mũi Tên Sắc” (Khurappajātaka), tầng có 7 khoá chứa `khurapp-` nhưng `ja385` dịch là “lưỡi cày”, `ja270:6.2` để nguyên “Khurappa”; theo `ja265` vì cùng nghĩa mũi tên.
  - `pāṇātipātā virata` (4.1, 5.1, 6.1) → “kiêng sát sinh”: tầng có 10 khoá chứa `pāṇātipātā virat-`, dịch “từ bỏ sát người” (đa số, ở các bài Thiên cung sự), “tránh xa việc sát sinh” (`vv24:8.1`), “tránh xa tội giết người” (`vv12:4.3`); không dùng “sát người” vì ở đây đối tượng là mọi loài (`sabbabhūtesu`).
  - `abhaya` + `sabbabhūtesu` (4.2, 5.2, 6.2) → “sự không sợ hãi cho mọi loài”: `sabbabhūtesu` ở tầng dịch “mọi chúng sinh”/“mọi loài hữu tình” (22 khoá chứa `bhūtesu`; `snp1.3:1.1`, `snp2.14:20.3`); ở đây đi cùng `abhaya` và người nói là loài chim nên dùng “mọi loài”.
  - `morarāja` (2.4, 5.3, 12.3) → “vua công”, `morādhipati` (17.2, 17.3) → “chúa tể loài công”: 0 tiền lệ trong tầng (chỉ có `moro` → “con công” ở `ja159:2.6`, `ja159:4.6`); `adhipati` giữ nghĩa “chúa tể”.
  - `dattupaññatta` (7.4, 10.4, 11.4) → “điều do kẻ ngu đặt ra”: theo `mn76:7.8`, `mn76:8.8` (“Bố thí là điều do kẻ ngu đặt ra”), tầng có 2 khoá (cùng một công thức), không có khoá khác.
  - `ahetuka` (10.2) → “chủ trương vô nhân”: `mn60:25.5` “chủ trương vô nhân” (`ahetukavādo`), `sn22.62:13.2` “chủ trương vô nhân duyên”.
  - `vibhavaṁ upeti` (7.2) → “đi đến đoạn diệt”: `iti49:7.3` dịch `vibhavā` là “sự đoạn diệt”; `vibhava` ở các khoá khác (`ud3.10:8.4`, `snp3.6:13.4`) được dịch “phi hữu”, nhưng đó là cặp `bhava`/`vibhava` trong hữu ái và phi hữu ái, còn ở đây là quan điểm đoạn kiến nên theo `iti49`.
  - `jīva` (7.2) → “sinh mạng”: tầng dịch `jīva` là “linh hồn” ở các khoá Milinda (ví dụ `mil3.1.4:6.16`, `mil3.3.6:1.5`); không dùng “linh hồn” ở đây vì thân kinh không nêu một cái “linh hồn” thuộc học thuyết nào, chỉ nêu việc sinh mạng chấm dứt.
  - `arahataṁ` (7.5) → “những bậc A-la-hán ấy”: `iti107:5.3` “có lòng tin nơi bậc A-la-hán”, `snp1.10:11.1` “Người có tín đối với bậc A-la-hán”; lời của người thợ săn, nên giữ nghĩa “A-la-hán” như chính ông ta gọi, không thêm lời đánh giá.
  - `kāsāyavattha` (13.2) → “mặc y cà-sa”: `ja434:1.1` “khoác màu áo cà-sa”, `snp1.3:30.3` “Mặc y vàng”; `anagāriya` → “sống không nhà”: tầng có 44 khoá chứa `anagāriy-` (ví dụ “xuất gia từ nhà ra không nhà” ở `ud4.1:9.3`), ở đây là tính từ chỉ trạng thái nên rút còn “sống không nhà”.
  - `vikālacariyā` (13.4) → “đi lại phi thời”: `kp2:6.1` “ăn phi thời”, `snp2.14:12.1` “đi lại vào lúc không đúng thời”; dùng “phi thời”.
  - `santo` (13.4) → “các bậc hiền thiện”: xem bất định 6.
  - `urago` ... `tacaṁva jiṇṇaṁ purāṇaṁ` (15.1) → “Như rắn lột bỏ lớp da già cũ”: dùng lại cách dịch `snp1.1:1.4` (`urago jiṇṇamivattacaṁ purāṇaṁ`, 8 khoá giống nhau); `paṇḍūpalāsa` (15.2) → “lá vàng úa”: `dhp235:1` “lá vàng úa”.
  - `luddabhāva` / `luddakabhāva` (15.3, 15.4) → “thân phận thợ săn”: 0 tiền lệ; `luddaka` → “thợ săn” (`ja359:3.2`, `ja359:5.1`, `mil5.4.7:5.1` đều dịch là “thợ săn”).
  - `bādhetu` / `bādhayāmi` (17.2, 7.6) → “làm hại”: 0 tiền lệ gần; dùng cùng một chữ cho cả hai.
  - `yasassī` (17.2, 17.3) → “lừng danh”.
  - `nivesana` (16.2) → “nhà” (32 khoá, nơi ở/nhà); `niketa` (16.4) → “nơi ở”.
  - `khuppipāsā` (3.2) → “đói khát”: `snp3.2:12.3` “Đói và khát”, `thig6.2:2.4` “đói khát”.
  - `candasūriya` ở đây là `cando ca suriyo ca` (8.1, 9.1) → “mặt trăng và mặt trời”: `ja258:1.1`, `vv48:1.2` (`candimasūriyā`).
  - Đại từ: người ngoài hỏi và người đáp đều dùng “ngươi”/“tôi” theo `ja490` (cùng bộ, cùng loại đối thoại người – vật); `samma` (1.3) → “bạn”: tầng có 61 khoá chứa `samma` với hai cách dịch (“hiền hữu” ở `ud4.4:2.4`, “này bạn” ở `ja315:1.4`, `ja315:3.4`); chọn “này bạn” theo phạm vi Jātaka.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli mở 13 dấu (`1.1`, `2.1`, `3.1`, `5.1`, `6.1`, `7.1`, `8.1`, `9.1`, `10.1`, `11.1`, `13.1`, `15.1`, `17.1`) và đóng 13 dấu (`1.4`, `2.4`, `4.4`, `5.4`, `6.4`, `7.6`, `8.4`, `9.4`, `10.4`, `12.4`, `14.4`, `16.4`, `17.4`); Việt đúng như vậy, lệch 0/75 khoá. Pāli không cân bằng theo từng khổ (mở `3.1` đóng ở `4.4`; mở `11.1` đóng ở `12.4`; mở `13.1` đóng ở `14.4`; mở `15.1` đóng ở `16.4`); không gói thêm nháy để làm cân. `17.4` Pāli kết `”ti.`; “ti” là tiểu từ trích dẫn, chuyển thành dấu đóng nháy. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ nội dung kệ chứ không từ văn xuôi (tầng Pāli đã ghim không có văn xuôi). Khổ 1 là chúa tể loài công xin người thợ săn; khổ 2 người thợ săn đáp; khổ 3–4 chúa tể loài công hỏi lại; khổ 5 người thợ săn hỏi; khổ 6 chúa tể loài công đáp; khổ 7 người thợ săn; khổ 8 chúa tể loài công hỏi; khổ 9 người thợ săn đáp; khổ 10 chúa tể loài công đáp; khổ 11–12 người thợ săn; khổ 13–14 chúa tể loài công; khổ 15–16 người thợ săn; khổ 17 chúa tể loài công (dựa vào `ahaṁ pamutto`, “tôi đã được thoát”). Đây là suy luận từ nội dung, không được ghi vào thân kinh.
  2. `cāpadhure` (2.2): `dhura` nghĩa gốc “ách, gánh”, 0 tiền lệ cho từ ghép; dịch “nơi đầu cung” (đặt vào đầu cung). Cách đọc khác: “ở dây cung”. `samāhito` dịch “đã được đặt”.
  3. `pāsañca tyāhaṁ adhipātayissaṁ` (2.3): `te` có thể là đại từ sở hữu (“cái bẫy của ngươi”) hay tặng cách (“cho ngươi”); dịch “quăng bỏ cái bẫy cho ngươi” để không nói rõ hơn Pāli. `adhipāteti` có nghĩa gốc “làm rơi xuống, quăng xuống”; 0 tiền lệ.
  4. `Tathā phalaṁ sukatadukkaṭānaṁ` (7.3, 10.3, 11.3): câu lược, không có động từ; ở `7.3` và `10.3` ngầm là “[không nói đến/không có] quả của việc làm thiện và việc làm ác”, ở `11.3`–`11.4` ngầm là “[sao có thể không có]”. Bản Việt giữ nguyên dạng lược, không chèn thêm phủ định vào thân kinh; ở `11.4` dùng “làm sao có thể như thế?” để nối câu hỏi.
  5. `yaṁ` (3.1, 4.3): có thể là liên từ “vì, rằng” hoặc đại từ quan hệ. Dịch `3.1` như một mệnh đề độc lập (“Suốt bảy năm ngươi đã bám theo tôi”) và `4.3` là “vì ngươi muốn thả tôi”.
  6. `santo` (13.4): vừa là “bậc hiền thiện” vừa là “bậc an tịnh”; dịch “các bậc hiền thiện”. `vikālacariyā viratā` có thể chỉ việc không đi khất thực phi thời hoặc không đi lại phi thời nói chung; dịch “kiêng đi lại phi thời” theo nghĩa rộng nhất của `cariyā`.
  7. `hīnavādā` (10.1): có thể là “những quan điểm thấp kém” hoặc “những người chủ trương quan điểm thấp kém”; vì `10.2` tiếp theo nêu người (`ahetukā ye`), dịch theo nghĩa người. `te` (10.1) đọc là chỉ định “những kẻ ấy”, không đọc là “của ngươi”.
  8. `satāni anekāni` (16.2): chỉ nói “nhiều trăm”; không biết số cụ thể.
  9. `mokkhañca te pattā sakaṁ niketaṁ` (16.4): `pattā` có thể chi phối cả `mokkhaṁ` lẫn `niketaṁ` (“đạt giải thoát và đến chỗ ở”); dịch “được giải thoát và về đến nơi ở của mình”.

  **Coverage English (mục 7):** mẫu số = 0. Đo mọi khoá không phải khối `:0.x` (71 khoá), dài nhất sau khi nén khoảng trắng là 38 ký tự (< 40) nên 0/71 khoá có nội dung theo ngưỡng của `source/layers.yaml`; 4 khoá `:0.x` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja491`; `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Tôi không đụng `content/meta/reference-gaps.yaml`.

