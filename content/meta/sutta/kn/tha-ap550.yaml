notes: |-
  Dịch từ Pāli root, 106 khoá, đủ khoá, đúng thứ tự Pāli; không có bản Sujato, không có lớp english-project và không có bản Việt hiện hành cho bài này. Đối chiếu độc lập chỉ có ở hai chỗ: bốn khoá 18.1-18.4 trùng nguyên văn với thag1.27 (tiền lệ Việt thag1.27 và thag3.5, Sujato thag1.27 dịch "thrust aside ... foster seclusion"), và mười sáu khoá 20.1-23.4 trùng với mn131:3.1-3.16 (Việt đã có; Sujato mn131 dịch "Don't run back to the past ... so declares the peaceful sage"); phần còn lại chỉ dựa vào Pāli, các tha-ap đã dịch và mn134 (Sujato: Lomasakaṅgiya ở Kapilavatthu, thiên tử Candana đến hỏi). Hệ quả: triangulation hạ xuống 7.8 và status giữ draft.
  Tên bài (khoá 0.3): Pāli 0.3 là 8 Lomasakaṅgiyattheraapadāna, bắt đầu bằng số nên giữ số thứ tự theo hình thức N. (đo toàn tầng tha-ap: 146 tệp có số ở Pāli đều giữ số ở Việt, 0 tệp bỏ, 0 tệp thêm số ở chỗ Pāli không có). translationTitle bằng đúng giá trị 0.3. Kiểu tên: Ký Sự Về Trưởng Lão X chiếm 14 so với Bài Kệ Tuyên Ngợ 4 ở phạm vi tha-ap525 đến tha-ap575 và 24 so với 16 ở tha-ap500 đến tha-ap600; toàn tầng tha-ap thì ngược lại: Bài Kệ Tuyên Ngợ 251, Bài Kệ Tuyên Ngôn 132, Ký Sự Về 112. Hai phạm vi cho hai đa số khác nhau; theo phạm vi gần nhất và theo các bài cùng phẩm tha-ap544, tha-ap547, tha-ap551 thì dùng Ký Sự Về. Chữ Tuyên Ngợ không dùng vì chưa rõ gốc; vấn đề đó để biên tập phán một lượt cho cả cuốn.
  Khoá 0.2 Bhaddiyavagga dịch Phẩm Bhaddiya theo tha-ap544, tha-ap547 và tha-ap551 (3 bài cùng phẩm). Khoá 28.1: Ký sự về Trưởng lão X, thứ tám theo dạng của tha-ap544 và tha-ap551 (ở phạm vi tha-ap525 đến tha-ap575 dạng Ký sự/Ký Sự chiếm 12 so với Bài Kệ Tuyên Ngợ 4). Khoá 27.1 dùng công thức Tôi nghe như vầy ... đã nói những bài kệ này (407 khoá của tầng dùng những bài kệ này, 21 khoá dùng số ít; Pāli imā gāthāyo là số nhiều).
  Số Pāli: tatiyaṁ (13.1) là thứ ba, dịch lần thứ ba; dasa trong rūpādidasahaṅgehi (4.1) là 10, dịch mười yếu tố; catasso (26.1) là bốn, Bốn vô ngại giải; ubho (3.2) là cả hai; cātuddīpo (11.1) là bốn châu; aṭṭhamaṁ (28.1) là thứ tám; tidasa (5.1) là ti 3 nhân dasa 10 và được dịch cõi trời Tam Thập theo tha-ap5, snp3.11 và bv29 (tầng còn có Ba Mươi Ba cho tāvatiṁsa); bài không có cụm Tiṁsakappasahassa và không có số lớn nào cần phán.
  Pāli trùng nguyên văn ở các bài khác: đã dò 18 khoá Pāli trùng với các tha-ap đã dịch (khoá 0.1, 0.2, 1.1-1.4, 4.3, 14.2, 19.4, ba khoá …pe…, 24.1, 24.3, 25.1, 25.3, 26.1, 26.3). 17 khoá Việt giống bản của tầng (4.3 chỉ khác chữ hoa đầu dòng); 1 khoá khác: 14.2, vì Pāli trước (14.1) nêu đối tượng buddhānubhāvaṁ taṁ nên không dùng lại đúng câu trông thấy Ngài với tâm tràn đầy kinh ngạc (2 khoá). Bốn khoá 1.1-1.4 theo tha-ap551 (cùng phẩm); tha-ap433 có bản khác (kiếp lành lành, thuộc họ Brāhmaṇa; 1 so với 1). Pāli trùng nguyên văn trong chính bài: một nhóm là …pe… (24.2, 25.2, 26.2), cả ba Việt giống nhau là một dấu lược …; khoá 25.3 và 26.3 chỉ khác nháy đóng nên Việt giống nhau chỉ khác nháy. Không có cặp trùng nội bộ nào mà Việt khác. Mười sáu khoá 20.1-23.4 dùng nguyên văn mn131:3.1-3.16 (cũng là mn132, mn133, mn134), thêm nháy đơn mở ở 20.1 và đóng ở 23.4 theo Pāli.
  Ngôi kể: tôi cho người kể suốt bài. Ở công thức Kilesā jhāpitā mayhaṁ đa số tầng dùng ta (101 ta, 41 tôi toàn tầng; 24 ta so với 15 tôi ở tha-ap500 đến tha-ap600; 10 ta so với 8 tôi ở tha-ap525 đến tha-ap575). Chọn tôi vì suốt bài người kể đã là tôi (ahaṁ) và hai bài liền kề cùng phẩm tha-ap544 và tha-ap551 dùng tôi; đây là chỗ hai phạm vi không cho cùng một đa số và để người biên tập phán. 25.1 dùng Thật là sự đón tiếp tốt lành cho tôi theo tha-ap544 và tha-ap551 (đa số tầng 96 khoá Thật lành thay sự đến của ta).
  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 26.3; nháy đơn mở ở 13.1 và đóng ở 13.4, khoá 17.2 và 17.3 tự cân, mở ở 18.1 và đóng ở 18.4, mở ở 20.1 và đóng ở 23.4. Việt khớp Pāli từng khoá (0 khoá lệch trên 106). Dấu ti ở 17.3 và 23.3 được bỏ theo phe đa số bỏ ti. Khoá …pe… giữ đúng một dấu lược …; Pāli của bài không có (…) trần.
  Bất định, không đưa vào thân kinh: 1.2 brahmabandhu dịch thân quyến của Phạm thiên theo tha-ap551 (cũng có nghĩa Bà-la-môn chỉ theo dòng họ). 2.3 Āpāṇakoṭikaṁ dhammaṁ dịch pháp hành đến hơi thở cuối cùng (āpāṇakoṭika có tiền lệ mn89 và mil7.5.8 với brahmacariya, chưa có tiền lệ với dhamma; nghĩa pháp hành là cách hiểu). 3.1 santusita là Tusita (Đâu-suất theo mn123 và các bài khác), 5.1 tidasa là Tam Thập, Candana tái sinh ở Tam Thập còn người kể sinh làm người Sakya. 4.1 rūpādidasahaṅgehi dịch mười yếu tố khởi đầu từ sắc; mười yếu tố cụ thể không nêu trong Pāli nên không ghi vào thân kinh (sn40.10 có mười phương diện của chư thiên, có thể liên quan nhưng chưa phân xử). 5.4 sākiyatrajo dịch con trai dòng Sakya. 6.1-6.2 ajjhiṭṭho dịch được thỉnh cầu (snp5.18 và cnd3), kapilavhayaṁ dịch nơi có tên Kapila theo bv29:13.4. 7.4 jātithaddhā dịch cứng đầu vì dòng dõi. 8.1 saṅkappa dịch ý định theo tha-ap115 (tầng còn có tư duy). 8.3 Pajjunno không có tiền lệ Việt trong tầng; giữ tên Pajjunna (thần mưa hoặc mây mưa), chưa phân xử. 10.1-10.3 pakāsa dịch ánh sáng, pāṭihera dịch thần thông theo pāṭihāriya (trong các khoá có pāṭihāriya, thị hiện ở 68 khoá, thần thông 73, thần biến 11). 11.1 Cātuddīpo mahāmegho dịch đám mây lớn khắp bốn châu (tầng có bốn châu và bốn châu lục), 11.3-11.4 jātakaṁ vessantaraṁ dịch Chuyện Tiền Thân Vessantara (Chuyện Tiền Thân xuất hiện 82 lần trong tầng). 12.2 mada dịch kiêu mạn. 13.1-13.4 lời Suddhodana: Idaṁ tatiyaṁ là lần thứ ba, hai lần trước được hiểu là hai Yadā ở 13.3 và 13.4 nhưng Pāli không nói rõ; bhūripañña là bậc trí tuệ rộng lớn (mn56, snp2.12, snp2.14), samantacakkhu là bậc nhìn khắp (snp2.12, snp2.14); Pāli không nêu đại từ ngôi thứ nhất nên dùng tôi, không dùng con. 14.1-14.2 taṁ buddhānubhāvaṁ là oai lực ấy của Đức Phật. 14.4 mātupūjako dịch tôn kính mẹ (không có tiền lệ trong tầng). 15.4 saṅkhepavitthāraṁ nayaṁ dịch phương cách tóm lược và chi tiết, hiểu là cách trình bày Bhaddekaratta. 16.4 saṁviggo vanamāmako dịch xúc động, ưa thích rừng (trong các tha-ap đã dịch chỉ có 1 khoá saṁvigga, dịch xúc động; māmaka không có tiền lệ gần nghĩa này, iti108 dùng nghĩa của ta). 17.3-17.4 Sukhumālo dịch mảnh mai, mềm yếu theo ja496:1.1; vārayī taṁ vacaṁ hiểu là ngăn lời xin ở 17.2. 18.1 Kāsaṁ dịch cỏ Kāsa (kāsa có 2 tiền lệ), 18.3 panudissāmi dịch sẽ gạt sang bên; thag1.27 và thag3.5 viết dẹp lệ sang bên (2 khoá, nghĩa chưa rõ) nên không dùng lại, còn 18.4 dùng sự thanh vắng theo thag1.27 và thag3.5 (4 khoá, so với sự viễn ly 66 khoá và sự độc cư 43 khoá). 19.3 Bhaddekarattaovādaṁ dịch lời giáo giới Một Đêm Có Lành (giáo giới xuất hiện 42 lần trong tầng); Bhaddekaratta dịch Một Đêm Có Lành theo mn131 (mn134 dùng cùng tên).
  Cổng kỹ thuật để coordinator chạy (người dịch bị cấm chạy): npm run validate, npm test, npm run check, npm run build. technical_integrity đặt 9.6 vì chưa chạy bốn lệnh đó.
