  **Giải quyết draft 2026-10-12: kiểm toán độc lập và dịch lại.** Đọc đối kháng từng cặp Pāli↔Việt cho cả 54 khoá. Bản cũ sai nghĩa nặng: **49/54 khoá** đã được viết lại (5 khoá còn lại không đổi: ba khoá tiêu đề `0.1`–`0.3` và `13.1`, cùng khoá thân kinh `12.1` đã đúng). Hai mục cũ trong ghi chú này — mục *"BẤT ĐỊNH CÒN LẠI"* (bảy điểm) và các cách đọc ghi ở ba khoá `6.6`/`8.4`/`9.2` — **bị thay thế hoàn toàn** bởi mục này; chỉ giữ lại phần mô tả cấu trúc, số khoá và tiền lệ tiêu đề.

  **Lỗi nghĩa thật đã sửa (loại, khoá):**
  - *Đảo chủ thể / người nói:* `1.1`–`1.4` là lời người hỏi tả đoàn người cưỡi voi trắng, xe la, kiệu của ba người con — bản cũ dịch thành "quân đội hủy diệt, giết bằng tay". `1.4` "chiếu sáng mười phương" là của cô gái trên kiệu. `6.1`–`6.2` là các con (`Ete`) đã bố thí; bản cũ ghi "chúng tôi đã cho". `6.4` `Paribhāsakā` là *những kẻ mắng nhiếc* các Sa-môn Bà-la-môn (cha mẹ ngạ quỷ), không phải "kẻ chê bai chúng tôi".
  - *Đọc sai từ:* `nāga` ở `3.2` là **voi** (song song `kuñjarena`, và `catukkama` = bốn chân như `tha-ap10:2.2 migarājā catukkamo`), không phải "loài nāga"; `catubbhi yuttena` = *được thắng bốn (con la)*, không phải "bốn con vật xâu lại, roi thuận lợi"; `Rudammukhā` = *mặt đang khóc* (cùng cụm `assunettā rudammukhā` ở `ja547:251.2`, `thi-ap22:22.2`), không phải "miệng đỏ như máu"; `muggarahatthapāṇino` = *tay cầm chùy*; `assatarī` = **la** (precedent `sn10.8:2.2` "xe do la kéo"), và sửa lỗi chính tả "cỗi" thành "cỗ"; `kaññā` = cô gái.
  - *Câu bịa / lệch:* `1.1` "bị quân đội hủy diệt", `2.4` "của kẻ khác", `4.2` "roi thuận lợi", `4.4` "rực rỡ ràng", `5.4` "phần nhỏ của phần" (chữ "nhỏ" không có trong Pāli), `6.6` "từ chúng ta nấu thành cháo, chặt bằng nửa bước chân" (bịa hoàn toàn, xem dưới), `7.2` "đi theo hạnh pháp thiện lành" (đảo nghĩa: `supāpadhammino` là *rất xấu ác*, bản cũ thành "thiện lành"), `7.4` "từ bỏ sướng, quay sang khổ, rồi gặp khổ ở", `8.4` "chẳng chịu buông bỏ thứ của chúng ta", `9.1` "Ngay cả người phàm" (`Icceva` là *cứ như vậy*, không phải "ngay cả"), `9.2`, `10.2` "cháy khắp", `11.4` "thắp ngọn đèn" (`dīpa` là **hòn đảo** nơi nương tựa — song song `dhp25:3 Dīpaṁ kayirātha medhāvī` đã dịch "tạo cho mình hòn đảo"), `12.3` "không hề".

  **Ba chỗ từng bị ghi là bất định (hapax) — nay đã phân xử được bằng song song trong Pāli, nên gỡ blocker tương ứng:**
  (1) `6.6 sussāma naḷova chinno` — `sussāma` là *chúng tôi khô héo* (căn `sussati`: `ja498:12.4 naḷo chinnova sussati` đã dịch "khô héo như cây sậy bị cắt"; `naḷova harito luto` ở `sn1.10:4.4` và `ja538:91.4` là cây lau bị cắt). Dịch: *khô héo như cây lau bị cắt*. Bản cũ ("nấu thành cháo", "nửa bước chân") không có căn cứ.
  (2) `8.4 nacchādimhase` — là dạng phủ định của `chādeti` *hợp ý, vừa miệng* (song song `dn2:70.1`, `mn39:14.8` `bhattañcassa nacchādeyya` dịch "ăn không thấy ngon"; `mn46:18.6` `nacchādessati`). Dịch: *cũng chẳng thấy vừa ý*; còn `na dhātā homa` = *không no*. (Không phải *dhātā* "ghi nhớ" của `dn34:2.1.16`.)
  (3) `9.2 Adāyakā` = *a-dāyaka*, "kẻ không bố thí" — hình thái trong suốt từ `dāyaka`; `ṭhāyino` = *ở trong, an trú* (song song `dn1:2.2.3 subhaṭṭhāyino`, `sn14.25:1.7 …majjappamādaṭṭhāyino`), nên `yamassa ṭhāyino` = *ở lại nơi của Yama* (dạng gần với `peta`, không thêm "cõi" làm danh từ riêng). Tiền lệ tương đương: `pubbalohita` = *mủ và máu* (`mn105:19.10`, `pv6:9.4`, `pv14:5.1`).
  Tương tự `Bhāgaḍḍhabhāgena` (`5.4`): song song `vv13:6.5 Bhāgaḍḍhabhāgaṁ datvāna` (đã dịch "sau khi dâng nửa phần chia") và `ja545:57.3 Upaḍḍhabhāgaṁ bhattassa` ⇒ *nhờ nửa phần chia* (cô út bố thí ít hơn hai anh nên hưởng ít hơn — đúng với thứ bậc voi / xe / kiệu).

  **Quyết định dịch (đo tiền lệ):** `Obhāsayantī dasa sabbaso disā` → *chiếu sáng khắp mười phương* (`vv64:17.3`, cùng Pāli, 1/1); `migamandalocanā` → *đôi mắt như mắt nai* (`vv64:11.1`, `ja527:6.1`); `sivikā` → *kiệu* (3/4 tiền lệ: `dn32:7.30`, `bv9:20.2`, `ja547:106.2`); `paribhāsa-` → *mắng nhiếc* (`mn50:12.4`; các khoá `paribhāsati` ở `dn27` dùng "chửi mắng, phỉ báng"); `kovidā` → *thiện xảo* (`sn5.8:3.4`); `dukhudrāni` = `dukkhudraya` → *đem lại khổ* (`mn61:9.3` "dẫn đến khổ"); `puññaṁ` → *phước* (`pv10:2.4`; chọn *phước* thay *điều thiện* ở đây vì `karonti puññaṁ` đi với `bhuñjare` — "hưởng dùng" / "làm phước" — là cặp hành động). Pāli trùng nguyên văn trong chính bài: 0 cặp (phép rỗng, không phải 0 lỗi); 4 khoá trùng với bài khác (`0.1`, `0.2`, `6.4`, `12.2`): `0.1`, `0.2` dùng lại nguyên văn (Petavatthu; Phẩm Rắn 9/9), `6.4` trùng `ja470:16.2`, `ja535:16.2`, `ja541:39.2` đều chưa có bản Việt nên tự dịch, `12.2` trùng `ja37:1.2` nhưng bản đó dùng *là kẻ hiểu biết pháp* nên không dùng lại vì ở đây phải đi với 12.1 (*những người thiện xảo về pháp*). Số Pāli: `dasa` = 10 (mười phương), `catukkama` = bốn chân, `catubbhi` = bốn (con la), `ekādasamaṁ` = thứ mười một khớp tiêu đề `0.3` — 4/4 khớp. Dấu nháy: mở ở `1.1`, `3.1`, `7.1`, `8.1`, đóng ở `2.4`, `6.6`, `7.4`, `12.4`, khớp từng khoá với Pāli.

  **Blocker đã xử lý:** (A) giữ nguyên blocker thiếu bản Anh Sujato trên upstream. (B) coverage: mẫu số = 0 (không khoá Pāli nào ≥ 40 ký tự), nên cổng coverage không đo được gì; không phải lỗi văn bản, đã gỡ khỏi `blocking_errors` và ghi giới hạn ở đây (`triangulation` ≤ 8,0: chấm 7,5). (C) tầng `vietnamese-current` chỉ có Pháp Cú — giới hạn tham chiếu, đã nằm trong câu blocker (A). (D) ba bất định hapax nêu trên — đã giải quyết có căn cứ nên gỡ. Blocker "bốn cổng kỹ thuật chưa chạy" không phải lỗi văn bản; `technical_integrity` giữ 9,6 và bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` vẫn do người điều phối chạy.

  **Bất định còn lại (ghi ở đây, không đưa vào thân kinh):** `4.2 suvaggitena` (từ hiếm, `vagganti` ở `vv64:9.1` nghĩa nhảy múa/phi) dịch *khéo chạy nhảy*; `9.1 Icceva` đọc *cứ như vậy*; `9.2 yamassa ṭhāyino` đọc *ở lại nơi của Yama*; `10.4 kaṭukapphalāni` (trung tính số nhiều, bổ nghĩa cho `kammāni`) dịch *những nghiệp có quả đắng cay*; `5.4` và `8.4` như trên; tên bài `Nāgapetavatthu` giữ nguyên *Nāga* vì `pv12:14.5` đã giữ — nhưng ở thân kinh `nāga` là *voi*, nên cách hiểu tên bài có thể là "ngạ quỷ [gắn với] voi"; chưa phân xử được, không dịch tên bài.
