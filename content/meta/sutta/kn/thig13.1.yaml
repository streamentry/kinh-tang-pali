notes: |-
  **Phạm vi: đủ 80/80 khoá của bài, không khoá nào ngoài danh sách.** Thứ tự khoá trong tệp
  bản dịch bằng đúng thứ tự Pāli (kiểm bằng phép so danh sách, không dùng phép cân tổng).

  **Nguồn và coverage — đo theo công thức khai ở `source/layers.yaml`
  (`substantivePaliMinChars: 40`, bỏ khối `:0`), tầng Anh tra qua manifest đã ghim:**
  · Độ dài Pāli lớn nhất của khoá thân bài là **33 ký tự**, toàn kệ ngắn ⇒ **mẫu số cổng = 0/80**.
    ⚠ Cổng coverage **không đo được gì** ở bài này; con số hiển thị không phải bằng chứng
    Sujato dịch đủ.
  · Đo thô thay thế, trên khoá thân bài (bỏ ba khoá tiêu đề `0.1`–`0.3`): bản Anh Sujato
    đã ghim **có tệp** `thig13.1_translation-en-sujato.json` (tầng `thig` có 73 tệp theo manifest),
    **76/76 khoá kệ `1.1`–`19.4` có chữ = 100%**; tính cả khoá kết `20.1` (colophon, Sujato để
    trống) thì **76/77 = 98,7%**. Ba khoá `0.x` cũng có chữ. Cả hai số đều ≥ 0,80, không cần
    entry `reference-gaps`.
  · Tầng `english-project` **vắng** (không có tệp cho uid này, và không cần lấp vì không có khoá
    kệ nào Sujato bỏ trống). Tầng `vietnamese-current` **vắng** (tại commit đã ghim thư mục Việt
    hiện hành chỉ có Pháp Cú). Bản Việt nguyên bài của SuttaCentral (Bhikkhu Indacanda, nhóm Hai
    Mươi, 13.1) chỉ là mục *Tra cứu toàn văn* ở cuối trang, không phải tầng store, nhưng đã đọc để
    đối chiếu cách đọc cú pháp. ⇒ `triangulation` **8,9**: Pāli + một tầng Anh đủ, không có tầng
    Việt phân đoạn, không có bản Anh độc lập thứ hai.

  **Tái dùng nguyên văn — dựng chỉ mục Pāli→Việt ở mức segment trên toàn tầng `kn` (38.771
  dòng Pāli khác nhau):** **0/80 khoá** của bài có Pāli trùng nguyên văn ở bài khác ⇒ **0 cặp
  trùng ngoài bài**, phép này **chạy rỗng** (bài này không có công thức dùng chung với bài nào
  khác trong tầng). Vì vậy `0.1`–`0.3` và `20.1` không tái dùng nguyên văn mà theo khuôn các bài
  `thig` đã dịch: `0.2` ⇒ *Bộ N Bài Kinh* (`Soḷasanipāta`, `Dvādasanipāta`… đều theo khuôn này;
  `Vīsatinipāta` ⇒ *Bộ Hai Mươi Bài Kinh*); `20.1` Pāli kết `….` ⇒ Việt kết ` ….` (37/58 khoá
  `… X therī …` của `thig` kết ` ….`) và dịch `therī` là *Trưởng lão nữ* (26) thay vì *Trưởng lão
  ni* (22) theo khuôn gần nhất `thig12.1:17.1`, `thig11.1:13.1`, `thig7.1:8.1`.

  **Cặp Pāli trùng TRONG CHÍNH bài: 2 nhóm trùng (18 khoá + 2 khoá), 0 cặp bản Việt khác.** `x.4`
  `Saccavādivacanaṁ anaññathā.` trùng **18 khoá** (`1.4`–`18.4`), cùng một câu Việt; `5.3` ≡ `8.3`
  `Tā jarāya valibhippalambitā,` cùng một câu Việt. `19.4` Pāli là `anaññathā”.` (có nháy đóng)
  nên Việt `…khác”.`, **không** tính là trùng.

  **Năm phép kiểm (tự viết, in số kèm mẫu số):**
  · (1) `set(khoá Việt) == set(khoá Pāli)`: **80 / 80**, thiếu **0**, thừa **0**; thứ tự khoá khớp
    Pāli. Phép **có đo được**.
  · (2) Nháy kép **khớp Pāli từng khoá**: lệch **0**. Pāli có `“` ở **1 khoá** (`1.1`) và `”` ở
    **1 khoá** (`19.4`); Việt cùng hai khoá, cùng vị trí. Pāli **không có nháy đơn** nên Việt
    cũng **0**. `19.4` Pāli kết `”.` ⇒ Việt kết `”.`.
  · (3) Pāli trùng nguyên văn trong bài: **2 nhóm** (18 khoá + 2 khoá), bản Việt khác **0**.
    Phép **có đo được**.
  · (4) Dấu lược: Pāli có `…` ở **1 khoá** (`20.1`, **2** dấu); Việt cũng **2**, lệch **0**. Mở
    rộng lược (Pāli không có `…` mà Việt có): **0**. `… cho đến …`: **0**. `(…)` trần: Pāli **0**
    khoá, Việt **0**. Pāli kết `….` ở `20.1` ⇒ Việt kết ` ….`.
  · (5) Số Pāli, thêm NFC, khoá rỗng, khoảng trắng: chưa NFC **0**; khoá rỗng **0**; khoảng trắng
    thừa hoặc hai dấu cách **0**; Pāli lọt sang Việt chỉ là tên riêng/tên cây (`Ambapālī`,
    `Therīgāthā`, `pattalī`, `pāṭali`), giữ nguyên có chủ đích. `0.1` (*Therīgāthā 13.1*) trùng
    nguyên văn Pāli có chủ đích, như các khoá `:0.1` khác trong tầng.
  · **Số Pāli** — tự tính: `Vīsati` = 20 ⇒ *Hai Mươi* (`0.2`); `ubho` = hai ⇒ *cả hai* (`12.1`,
    `14.1`, `16.1`, `18.1`). Công cụ đo số chuẩn của kho hiệu chuẩn OK nhưng **không theo dõi cụm
    nào có trong bài này**, nên ở đây nó không đo được gì; số do tôi tự tính như trên.
  · Đọc cặp Pāli↔Việt từng khoá (80/80 in ra đọc đối kháng): không có khối nào mang nội dung của
    khối bên cạnh; mỗi khổ kệ có đủ ba phần (hình ảnh xưa · nay do tuổi già · điệp khúc).

  **Thuật ngữ — đo trên tầng, kèm số đếm:**
  · Ngôi kể: tầng `thig` (kệ, bỏ khoá `:0`) dùng *tôi* làm đại từ chính ở **33** tệp, *ta* ở **25**,
    *con* ở **7** ⇒ giữ *tôi* xuyên suốt, nhất quán với `thig12.1` (Puṇṇā nói về mình).
  · `kokila` ⇒ *chim tu hú*: trong tầng, *tu hú* (8 dòng) so với *Kokila* giữ nguyên (7 dòng); chọn
    *tu hú* vì là loài chim quen thuộc với người Việt, khớp Sujato *cuckoo*.
  · `kambu` ⇒ *vỏ ốc* (`ja461:13.3` *cổ thanh tú như vỏ ốc*, **1** tiền lệ trực tiếp).
  · `jaṅghā` ⇒ *bắp chân* (`snp3.9:22.3`; ở `thag4.12:2.4` là *cẳng chân*; 1/1 mỗi bên, chọn *bắp
    chân* theo Sujato *calves* và vì đi cặp với `ūru` *đùi* ngay trước đó).
  · `samussayo` ⇒ *thân xác* (`thig2.2`, `thig6.6`, `thag5.5`, `dhp351` đều dịch *thân xác*/*thân*).
  · `jarā` (instrumental `jarāya`) ⇒ *do tuổi già* nhất quán xuyên bài; `thag6.13` dùng *bị tuổi già*.
  · Ba khoá không có `jarāya` trong Pāli (`14.3`, `15.3`, `19.3`) được dịch **không** thêm *do tuổi
    già*, vì Pāli không nói.
  · `saccavādi` ⇒ *bậc nói sự thật*: **0** tiền lệ trong tầng (hapax); theo cả Sujato (*the truthful
    one*) và bản Việt nguyên bài (*bậc Tuyên Thuyết Sự Thật*).

  **BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh:**
  · `2.3` `salomagandhikaṁ`: dịch *mùi như lông chó* theo Sujato và bản Việt nguyên bài, hiểu `sa`
    là *chó* (Pāli `sā`); đọc `sasa` ⇒ *thỏ* (một số bản) không loại trừ hẳn. Pāli root đã ghim chỉ
    có `salomagandhikaṁ`, nên chữ *chó* là cách đọc của các bản dịch, không do Pāli nói trực tiếp.
  · `9.1` `pattalīmakula`: tên cây/hoa chưa phân xử được; Sujato *jasmine*, bản Việt nguyên bài *nụ
    hoa chuối*; tôi **giữ nguyên `pattalī`**, không đoán loài hoa.
  · `9.3` `khaṇḍitā cāsitā`: Sujato *broken and yellow*, bản Việt nguyên bài *sứt mẻ và ngả màu vàng*;
    `cāsitā` có thể đọc `ca + asitā` (*và đen*). Tôi dịch trung tính *sứt mẻ và ngả màu*, không nêu
    màu cụ thể.
  · `12.3` `pāṭalibbalitā`: Sujato *wrinkle and sag as a patala tree*, bản Việt nguyên bài *cành cây
    hoa kèn bị khô héo*; tôi dịch *co quắt như cành pāṭali*, giữ tên cây Pāli, nghĩa chính
    (khô quắt, nhăn) không đổi; chữ *cành* là cách đọc của bản Việt nguyên bài, không có trong Pāli.
  · `16.1` `nāgabhogasadisopamā`: *vòi voi* theo Sujato và bản Việt nguyên bài; `bhoga` về chữ nghĩa
    có thể là thân/khoanh của rắn `nāga`, nên *thân rắn* không loại trừ; hình ảnh chắc là đùi
    tròn thon nên chọn *voi*.
  · `13.3` `mūlamūlikā` ⇒ *rễ củ cải* (Sujato *red radishes*, bản Việt *rễ củ*); loại củ không chắc.
  · `14.3` `thevikīva … nodakā`: *túi không nước* theo Sujato *water bags*, bản Việt *túi da hết
    nước*; chữ *da* là cách đọc của bản Việt nguyên bài, không có trong Pāli nên bỏ.
  · `19.1` `Ediso ahu ayaṁ samussayo`: tôi hiểu *đã trở nên như thế* (chỉ trạng thái già nua ở
    `19.2`), theo bản Việt nguyên bài; Sujato đọc *ediso* chỉ trạng thái xưa (*once was such*) và thêm
    *but now*. Pāli không có từ đối lập nào, nên tôi không thêm.
  · `4.1` `kaṇhakhandhakasuvaṇṇamaṇḍitaṁ`: *chùm tóc đen và vàng* — Sujato *plaits of black and
    ribbons of gold*, bản Việt *chùm tóc đen*; `khandhaka` thật sự là cụm/búi tóc (chưa chắc là
    bím); hai chữ *bím tóc* ở `4.2` dịch `veṇī`.
  · `6.2` `abhinīla` ⇒ *xanh thẫm* (đen xanh sẫm); Sujato *indigo*.
  · `7.3` `upakūlitā viya` ⇒ *như bị quắt lại*: Sujato *shriveled like a pepper*, bản Việt *quắt lại*;
    *như quả ớt* là phần thêm của Sujato, không có trong Pāli, nên bỏ.
  · Tên: `0.3`/`20.1` ghi **Ambapālī** theo tiền lệ `thi-ap39:0.3`;
    không thêm tiểu sử vào thân kinh.

