notes: |-
  Đủ 14/14 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Pāli trùng nguyên văn, DÙNG LẠI nguyên văn đã có — đây là phần quan trọng nhất của bài:
  · Bốn vế kệ ở 2.1–2.4 trùng nguyên văn y hệt snp3.11:43.1–43.4 (tầng đã có bản Việt). Tôi dùng lại nguyên văn đó, chỉ chuy�nh dấu kết cho khớp Pāli: Điều gì còn thiếu thì reo vang, / điều gì đầy ắp thì tịch tĩnh; / kẻ ngu như cái ghè vơi một nửa, / bậc trí như hồ đầy nước.
  · Lần đầu tôi đọc `Yadūnakaṁ` là dù đầy ắp đến đâu và tưởng bản dịch sẵn sai. Đọc lại cả bốn vế thì thấy bản sẵn ĐÚNG và bài kinh mới coherent: chỉ cái còn thiếu mới reo vang, chỉ cái đầy ắp mới tịch tĩnh — khớp ẩn dụ kẻ ngu là cái ghè vơi một nửa. Đây là lỗi review tự bắt được ở hướng ngược lại: đáng lẽ tôi phải bác bỏ bản dịch của tôi, không phải bản dịch của người trước.

  Tiền lệ đếm được:
  · `Opammakathāpañha`, `makkaṭaka` không có; `yoginā yogāvacarena` → người hành trì thực hành (mil7.7.2).
  · `bhagavatā devātidevena` → Bậc Thế Tôn, đấng Thiên Nhân (mil7.7.2:1.5). `suttanipāte` → trong tập kinh (mil7.7.2 dùng bài kinh về sự diệt tận cho parinibbānasuttante, ở đây Pāli chỉ nói suttanipāte nên tôi không thêm định danh nào).
  · `kumbho` → bình (an3.30:1.9, an3.36:15.4 đã có trong tầng). Vì `Kumbhavagga` chưa có cách dùng nào trong tầng, tôi đặt mới Phẩm Bình Vò.

  Bất định đã ghi nhận, không giấu:
  · `nihatamānena nihatadabbena bhavitabbaṁ, ujukena amukharena avikatthinā` — cụm ba tính từ này khó. Tôi dịch phải sống như kẻ đã bị khuất phục, với dáng vẻ của kẻ đã bị khuất phục: thẳng thắn, không gian dối, không cậy cọ. `avikatthi` tôi hiểu là không cậy cọ, `amukharena` là không gian dối; hai chữ này là chỗ chưa chắc, nhưng tôi không dịch theo nghĩa từ điển một cách máy móc vì cả cụm là một bức tượng về khiêm tốn.
  · `sāmaññe pāramiṁ` — tôi dịch điểm viên mãn của sự tịch mặc. `āgame adhigame pariyattiyaṁ` là ba mức đến, tôi dịch thành ba vế đã đến chỗ tối thượng, đã hoàn toàn thành tựu, đã tới điểm viên mãn, giữ đủ ba.

  Kiểm thủ công trên TOÀN BỘ 14 khoá (kiểm() chỉ soi 5 khoá Pāli từ 40 ký tự): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược bằng Pāli (cả hai phía 0), nháy kép cân (mở 1.1/đóng 1.1, mở 1.2/đóng 2.4), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.
