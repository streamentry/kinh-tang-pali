  **Hai blocker, bài phải ở `draft`.** Không sửa gì trong bản dịch; hai lỗi giao cho biên tập.
  
  **Lỗi 1 — `1.4` sai nghĩa.** Đã dẫn chứng ở `blocking_errors`. Ghi thêm vì dễ bỏ sót: cả vế `1.4` chỉ có hai ý (`bhuttaṁ` = đã ăn, `uggataṁ` = lấy ra), và `uggata` là ý thứ hai, tức **toàn bộ ý còn lại của vế kệ** bị thay bằng một ý không có trong Pāli. Ba chỗ `uggata` khác trong chính snapshot đã ghim đều cùng nghĩa "mọc ra / trồi ra / sinh ra", nên đây không phải chỗ nhiều nghĩa.
  
  **Lỗi 2 — mất tầng Anh.** Đã kiểm cả ba tầng: `pali` có (10 khoá), `english-sujato` **không có tệp**, `vietnamese-current` không có (chỉ có Pháp Cú ở commit đã ghim). Bài này **không có khoá thân nào đủ 40 ký tự** nên bộ đo coverage trả `substantiveSegments = 0` và báo `ratio = 1` — tức số đo **không bắt được** sự mất tầng này. Vì vậy tôi ghi blocker theo kiểm tệp trực tiếp, không dựa vào số coverage. `triangulation` 6.5 là hậu quả trực tiếp: toàn bộ nghĩa phải đứng vững chỉ với Pāli.
  
  **Phần đúng.** `Tañca appañca ucchiṭṭhaṁ` → *Cả cái đã đào lên lẫn cái chưa đào lên* ✓ giữ được kép. `Sohaṁ brāhmaṇajātiko` → *Bản thân tôi, người thuộc dòng bà-la-môn* ✓ — và ở đây **ngôi một `tôi` là đúng**: `no adā` ở `1.2` (*cái ấy tôi cũng chẳng cho*) xác nhận người nói là chính con chuột. `Evaṁ dhammaṁ niraṅkatvā` → *Đã suy xét pháp như thế này* ✓. `Laddhenapi na nandatī` → *đã có được rồi cũng không vui* ✓ (`nandati` = "vui", không phải "thỏa mãn").
  
  **Dùng `…` lược:** không có segment nào chứa `…pe…` trong bài này, nên không có chỗ nào cần giữ dấu lược.
  
