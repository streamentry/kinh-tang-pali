notes: |-
  Dukanipāta dịch là Tập Kẻ Đau Đớn theo đa số 30 bài trong tầng, và Kalyāṇavagga là
  Phẩm Pháp Lành theo cả 7 bài đã có. Cả hai tôi đếm được, không phải đoán.
  ucchiṭṭha không có tiền lệ trong tầng cho nghĩa đào lên; tôi dịch là đào lên theo
  gốc từ ucchavati. Bất định LỚN NHẤT CỦA BÀI: yaṁ bhuttaṁ tampi uggataṁ ở 1.4. Tôi
  dịch thứ gì ăn vào, tôi cũng ăn thừa bề, theo uggata là dư dà, quá mức. Nhưng
  uggata cũng có thể là danh từ chỉ phần còn dư, thì 1.1-1.2 nói ta đã cho đi cả cái
  đào lên lẫn cái không đào lên, chẳng cho dù chỉ một chút, còn 1.3-1.4 thì nói ta đã
  ăn phần còn dư; hai cách đó không mâu thuẫn nhau như cách đọc ăn thừa bề thì mâu
  thuẫn với chính 1.2. Tôi chọn ăn thừa bề vì Sujato không có bản Anh cho bài này để
  phán, còn cách đọa thứ hai thì khiến 1.3-1.4 thành lời khoe. Cả hai đều là đọc; tôi
  không dám khẳng định. Lựa chọn khác là cơm ăn phần dư còn lại.
  brāhmaṇajātiko không có tiền lệ. Tôi dịch là người thuộc dòng bà-la-môn, vì hậu tố
  -jātika là lớp từ chỉ nguồn gốc, và bà-la-môn thì đã có 976 chỗ trong tầng. Tôi
  không dịch nó thành hiền triệt dù câu kệ nghe có vẻ ca ngợi, vì đó là thêm ý.
  Tên bài giữ nguyên Pāli Satadhammajātaka, theo tiền lệ ja102 Paṇṇikajātaka và
  ja106 Udañcanījātaka là hợp danh Bồ-tát cộng jātaka thì giữ Pāli. Lựa chọn khác là
  dịch thành Kinh Chánh Pháp.
  Satadhammova lābhena không có tiền lệ cho lābha; tôi dịch được lãnh về. adhammena
  dịch phi pháp, khớp an3.56:2.2 dục phi pháp. niraṅkatvā dịch suy xét, vihaññati dịch
  khổ não theo dhp15:3.
  Kỹ thuật: 13/13 khoá, không khoá nào rỗng, thứ tự khớp Pāli, NFC, nháy kép mở ở 1.1
  và 2.1 đóng ở 1.4 và 2.4 y hệt Pāli, không có dấu lược ở cả hai phía. save_vi sạch và
  idempotent. Không chạy npm run validate|test|check|build nên technical_integrity 9.5.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja179:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.
