notes: |-
  Dukanipāta dịch là Tập Kẻ Đau Đớn theo đa số 30 bài trong tầng, và Kalyāṇavagga là
  Phẩm Pháp Lành theo cả 7 bài đã có. Cả hai tôi đếm được, không phải đoán.
  ucchiṭṭha không có tiền lệ trong tầng cho nghĩa đào lên; tôi dịch là đào lên theo
  gốc từ ucchavati. Bất định LỚN NHẤT CỦA BÀI: yaṁ bhuttaṁ tampi uggataṁ ở 1.4. Tôi
  dịch thứ gì ăn vào, tôi cũng ăn thừa bề, theo uggata là dư dà, quá mức. Nhưng
  uggata cũng có thể là danh từ chỉ phần còn dư, thì 1.1-1.2 nói ta đã cho đi cả cái
  đào lên lẫn cái không đào lên, chẳng cho dù chỉ một chút, còn 1.3-1.4 thì nói ta đã
  ăn phần còn dư; hai cách đó không mâu thuẫn nhau như cách đọc ăn thừa bề thì mâu
  thuẫn với chính 1.2. Tôi chọn ăn thừa bề vì Sujato không có bản Anh cho bài này để
  phán, còn cách đọa thứ hai thì khiến 1.3-1.4 thành lời khoe. Cả hai đều là đọc; tôi
  không dám khẳng định. Lựa chọn khác là cơm ăn phần dư còn lại.
  brāhmaṇajātiko không có tiền lệ. Tôi dịch là người thuộc dòng bà-la-môn, vì hậu tố
  -jātika là lớp từ chỉ nguồn gốc, và bà-la-môn thì đã có 976 chỗ trong tầng. Tôi
  không dịch nó thành hiền triệt dù câu kệ nghe có vẻ ca ngợi, vì đó là thêm ý.
  Tên bài giữ nguyên Pāli Satadhammajātaka, theo tiền lệ ja102 Paṇṇikajātaka và
  ja106 Udañcanījātaka là hợp danh Bồ-tát cộng jātaka thì giữ Pāli. Lựa chọn khác là
  dịch thành Kinh Chánh Pháp.
  Satadhammova lābhena không có tiền lệ cho lābha; tôi dịch được lãnh về. adhammena
  dịch phi pháp, khớp an3.56:2.2 dục phi pháp. niraṅkatvā dịch suy xét, vihaññati dịch
  khổ não theo dhp15:3.
  Kỹ thuật: 13/13 khoá, không khoá nào rỗng, thứ tự khớp Pāli, NFC, nháy kép mở ở 1.1
  và 2.1 đóng ở 1.4 và 2.4 y hệt Pāli, không có dấu lược ở cả hai phía. save_vi sạch và
  idempotent. Không chạy npm run validate|test|check|build nên technical_integrity 9.5.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja179:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  Lượt cải thiện 2026-10-11: đọc đối kháng từng khoá, bản trước SAI nghĩa ở cả hai bài kệ nên các ghi chú cũ phía trên về ucchiṭṭha, niraṅkatvā, kicchena/no và uggata KHÔNG còn đúng; bản dịch hiện hành thay thế chúng. Đã đổi 7/13 khoá (1.1, 1.2, 1.4, 2.1, 2.2, 2.3, 2.4); các khoá 0.x, 1.3, 3.1 giữ nguyên.
  (1) ucchiṭṭha: bản trước hiểu là cái đào lên (suy từ ucchavati) và không có căn cứ trong tầng. Đúng là đồ ăn thừa (đồ còn lại sau khi người khác đã ăn): ja547:184.2 dịch đồ ăn thừa, ja539:160.6 dịch đồ thừa, mil6.3.9:4.6 dịch đồ ăn thừa, nghĩa là cả ba nơi dùng ucchiṭṭha trong toàn Pāli đã ghim đều cho nghĩa này, không nơi nào cho nghĩa đào lên. Sửa 1.1 thành thứ vừa ít ỏi vừa là đồ ăn thừa (accuracy fix; semantic_fidelity 9.0 → 8.5 vì lỗi cũ nặng hơn điểm cũ phản ánh, nay còn bất định ở uggata).
  (2) kicchena no adā: bản trước hiểu no là phủ định nên 1.2 thành chẳng cho dù chỉ một chút, trái với cả mạch kệ. Đọc no là đại từ (cho chúng tôi, dạng thơ ca dùng cho ngôi nhất số ít) và kicchena là một cách khó khăn; adā là đã cho. Sửa 1.2 thành lại còn cho tôi một cách khó khăn (accuracy fix; grammar_logic 9.1 → 8.8).
  (3) niraṅkatvā ở 2.1: bản trước dịch suy xét, không đúng gốc nir + ākaroti, nghĩa gạt bỏ, ruồng bỏ. Tiền lệ trong tầng: ja529:10.1 và ja534:84.3 ruồng bỏ (pháp), snp2.9:3.2 gạt bỏ, ja413:7.1 bỏ mặc, ja386:6.2 bỏ rơi, pv34:6.3 gạt bỏ (nirākatvā). Chọn ruồng bỏ theo hai nơi cùng đối tượng dhammaṁ niraṅkatvā. Câu cũ đã suy xét pháp như thế này đảo ngược ý kệ (terminology fix; terminology 9.1 → 9.0 vì lỗi cũ này, nay mọi thuật ngữ chính đều có tiền lệ đếm được).
  (3b) 2.2 adhammena jīvati dịch sống bằng phi pháp (instrumental). 2.3-2.4 bản trước tách Satadhammova khỏi chủ ngữ yo và dịch dù được lãnh về như Satadhamma, sai cú pháp. Nay: yo là chủ ngữ, Satadhammova đọc như Satadhamma (iva) làm vế so sánh, lābhena laddhenapi na nandati là không vui với lợi lộc dù đã có được. lābha dịch lợi lộc theo ja287:1.3 và ja533:28.3, ja533:30.1 (loại bài Jātaka), không dùng lợi dưỡng của glossary vì ở đây không phải vật cúng dường (grammar_logic và terminology chung).
  (4) uggata ở 1.4: gốc ud + gam là đã đi lên, trào lên; trong tầng chỉ có từ này một lần ở nghĩa ăn uống, các lần khác đều là mọc lên, cao vút (suriya, giri). Chọn đã trào ngược lên vì (i) đi liền đồ ăn thừa, (ii) người nói tự nhận mình dòng bà-la-môn, tức đối lập ô uế, (iii) 2.3-2.4 nói lợi lộc có được mà không vui. Bản trước đọc uggata là dư dà quá mức nên dịch ăn thừa bề: cách đó không có điểm tựa từ vựng nào trong toàn tầng và tạo ra một câu tối nghĩa; bỏ.
  Bất định còn lại, không giải được: (a) uggata là đã trào ngược lên (ăn xong thì ói) hay nghĩa khác như thức ăn đã được nâng lên, đã dâng lên; không có bản Anh ở tầng đã ghim, không có chú giải trong kho, nên giữ theo ngữ cảnh và nghĩa gốc từ vựng. (b) Satadhammova có thể là Satadhammo + iva (như Satadhamma, đã chọn) hoặc Satadhammo + eva (chính Satadhamma). (c) Không xác định được người nói của kệ 1 và nhân vật Satadhamma từ chính văn kệ, nên không thêm chủ thể vào lời kinh. (d) kicchena là cách khó khăn, không nói rõ là miễn cưỡng hay gian nan; giữ nghĩa trung tính.
  Điểm đổi: semantic_fidelity 9.0 → 8.5, grammar_logic 9.1 → 8.8, terminology 9.1 → 9.0, vietnamese_clarity 9.2 → 8.8, han_viet_balance 9.2 → 9.0, ambiguity_integrity 9.2 → 8.6 (bản trước tuyên bố chắc chắn hơn mức cho phép), technical_integrity 9.5 → 9.6; source_provenance 9.5, segment_alignment 10.0 và triangulation 6.0 giữ. final_score 8.98 → 8.78. Các điểm hạ vì lỗi chính của bản trước nay mới lộ, không phải vì bản mới kém hơn. Kỹ thuật: 13/13 khoá, thứ tự khớp Pāli, NFC, nháy khớp Pāli từng khoá, 0 cặp Pāli trùng trong bài, không có Pāli lọt sang Việt ngoài tên bài. Chưa chạy npm run validate, npm test, npm run check, npm run build.
