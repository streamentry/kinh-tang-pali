notes: |-
  Dịch TRỰC TIẾP từ Pāli root, đủ 63 khoá, không có tầng Anh hay Việt hiện hành nào đã ghim cho vv37, xem blocking_errors. Đã đọc toàn bộ Pāli rồi tra tiền lệ trong các bài vv đã dịch; in lại từng cặp Pāli với Việt sau khi ghi.

  PHÉP ĐO (mẫu số kèm theo): tập khoá Việt bằng tập khoá Pāli, 63/63, đúng thứ tự Pāli. Nháy đơn và nháy kép khớp Pāli từng khoá, 63 khoá, 0 lệch (Pāli chỉ có cặp nháy kép mở ở 1.1 và 4.1, đóng ở 3.6 và 14.4). Dấu lược: Pāli có 0 khoá chứa dấu lược và bản Việt cũng 0, nên các phép về …pe… và (…) chạy rỗng vì không có đối tượng, không phải đạt. Pāli trùng nguyên văn trong chính bài: 1 cặp (4.2 và 13.2, rūpaṁ mayhaṁ gatī ca me), 0 cặp lệch, hai khoá dùng đúng một bản dịch. Số Pāli: cātuddasiṁ 14, pañcadasiṁ 15, aṭṭhamī là thứ tám, aṭṭhaṅga là tám chi, pañcasikkhāpada là năm giới, tāvatiṁsa là Ba Mươi Ba; không có số lớn hay phép cộng nào. NFC sạch, 0 khoá rỗng, 0 khoảng trắng thừa; Pāli lọt sang Việt chỉ là ba tên riêng được giữ (Vimānavatthu, Purindada, Sunandā) cùng các tên Rājagaha, Cittalatā, Gotama.

  TIỀN LỆ: 30 khoá Pāli trùng nguyên văn với khoá ở các bài vv khác (kể cả 0.1 đến 0.3); 26 khoá dùng lại nguyên văn bản dịch đa số, 4 khoá khác đa số (6.2, 8.3, 9.1, 12.3) và 13.1 theo vv47. Khuôn ngày trai giới và năm giới ở 5.3 đến 10.4 trùng với vv15, vv19, vv22, vv23, vv25, vv26 (5 hoặc 6 tệp mỗi dòng), nên các dòng đó giữ nguyên bản đa số. 0.2 theo 41 trong 43 tệp là Chuyện Cung Điện Nữ Hư Không; 0.3 theo 7 trong 7 tệp là Phẩm Cây San Hô; khuôn N. Chuyện Cung Điện tên. Mẫu 3.5 và 3.6 giữ nguyên bản đa số (6 và 4 tệp).

  BỐN CHỖ CỐ Ý KHÔNG NHÂN BẢN BẢN ĐA SỐ, vì bản đa số sai nghĩa Pāli. Đã đo trước khi đổi: (1) 9.1 Pāṇātipātā viratā: bản đa số là Từ bỏ sát người (5 tệp: vv15, vv19, vv22, vv23, vv25); pāṇa là chúng sinh nói chung chứ không riêng người, và công thức này ở nơi khác trong tầng được dịch là sát sinh (mn123:9.2), nên viết Từ bỏ sát sinh. (2) 8.3 Saññamā saṁvibhāgā ca: saññama là sự tự chế, 3 tiền lệ dịch tự chế (iti22:4.5, snp4.13:4.1, thag12.1:3.2), còn 5 tệp vv dịch năm cách khác nhau mà đều không phải tự chế (vv15 và vv19 là ý thức và sự chia sẻ, vv22 là Ý thức cùng đồng hành của nó, vv23 là không nói lỗi, vv25 là cả việc sát sinh). Viết nhờ tự chế và chia sẻ. (3) 6.2 senāsanaṁ padīpiyaṁ: bản đa số là chỗ nằm và tấm phản, chỗ ngủ và thức uống; padīpiya là dạng của padīpeyya (đèn đuốc), tiền lệ an4.197 và an7.52 dịch seyyāvasathapadīpeyya là chỗ ở và đèn sáng, nên viết chỗ ở và đèn sáng. (4) 12.3 chỉ lấy cụm bảo tháp, bỏ xá-lợi mà vv60:5.3 thêm vào. KHUYẾN NGHỊ cho người điều phối (đã đo, không sửa vì ngoài lát): các tệp vv15, vv19, vv22, vv23, vv25 mang nguyên các chỗ sai ở (1) đến (3).

  CHỖ GIỮ THEO TIỀN LỆ NHƯNG CÒN YẾU, ghi để biên tập: 9.3 Theyyā ca aticārā ca là không trộm cắp, không làm quá đà (6 tệp); aticāra chỉ là vượt quá giới hạn, trong khuôn năm giới thường được hiểu là tà hạnh trong dục, nhưng Pāli ở đây không nói rõ nên không thêm. 10.2 ariyasaccāna kovidā là thấu suốt các Thánh đế nhiệm mầu (6 tệp): chữ nhiệm mầu không có trong Pāli, giữ theo tiền lệ. 6.3 ujubhūtesu là những vị chân thành (4 tệp), nghĩa sát hơn là những vị ngay thẳng. 3.5 Devate pucchitācikkha là Này nữ thiên, hãy nói lời hỏi (6 tệp), nghĩa sát hơn là hỡi nữ thiên, được hỏi thì hãy nói rõ (vv47:3.3 làm vậy).

  BẤT ĐỊNH 2.4 và 3.3 (citrā honti và kāye na dissatī cittaṁ): đọc citra, citta là sắc màu sặc sỡ, nghĩa là chư thiên khi vào rừng Cittalatā thì thân hiện nhiều màu, còn trên thân Sunandā không thấy màu ấy mà hình sắc vẫn như thế. Hai chỗ nhất quán với nhau và với tên rừng, nhưng 0 tiền lệ trong tầng cho citrā honti; cách đọc khác của cittaṁ ở 3.3 là tâm không hợp văn cảnh. Chưa xác minh được bằng tầng Anh vì không có.

  BẤT ĐỊNH 3.2 uyyāne được dịch là khu vườn trong khi 1.2 và 2.2 là khu rừng (cittalatāvana, vana): Pāli dùng hai từ khác nhau, giữ hai từ khác nhau.

  4.2 và 13.2 gatī dịch là cảnh giới (nơi sinh về), vì cả câu liệt kê quả của nghiệp: hình sắc, cảnh giới, thần lực, uy lực; tiền lệ vv32:8.4 chỉ có 1 khoá dạng này và đang lệch nên không dùng. Iddhi và ānubhāva dịch là thần lực và uy lực (an3.80:9.3, an3.92:1.7 và 2.5, cả ba tiền lệ cùng cặp). 11.1 đến 11.4: tāhaṁ là taṁ ahaṁ, số tràng hoa mà nữ tỳ mang đến được dâng hết lên bảo tháp; hārati ở hiện tại kể chuyện nên dịch không gắn thì. 0.4 và 15.1 Visālakkhi: Pāli dùng từ này làm lời gọi ở 1.1 (hỡi người mắt to, đúng nghĩa visāla và akkhi) và làm tên bài; giữ nghĩa Mắt To như vv22 giữ nghĩa Dịu Dàng cho Bhadditthi, trong khi vv36 giữ tên riêng Mallikā; người nữ thật sự tên Sunandā ở 5.2. Tiền lệ tên loại này không thống nhất nên ghi rõ để người biên tập quyết.

  14.2 vipaccati dịch chín (tiền lệ an3.34); 14.4 siyaṁ là mong được, giữ ở mức hy vọng (āsā) chứ không viết thành xác nhận đã đạt Nhất lai.

  Cổng kỹ thuật: npm run validate, npm test, npm run check và npm run build chưa chạy trong lát này (bị cấm trong lát); bài này draft nên npm run build không bắt buộc. technical_integrity 9.6 vì chưa tự chạy các lệnh này.

  Lượt cải thiện 2026-10-11: đọc đối kháng lại 63 khoá và đo lại tiền lệ bằng số đếm trên toàn tầng kn/vv; đổi 14 khoá, giữ nguyên tập khoá và thứ tự. ĐÍNH CHÍNH các khẳng định tiền lệ ở phần trên: các số "6 tệp" ghi cho 3.5 (hãy nói lời hỏi), 10.2 (nhiệm mầu) và 9.3 (quá đà) là sai; đo lại thì 3.5 đa số là "được hỏi, xin hãy cho biết" (11 tệp; "hãy nói lời hỏi" chỉ 2), 10.2 đa số là "thông tỏ các Thánh đế" (6 tệp; "nhiệm mầu" chỉ có ở bài này), 9.3 là "không tà hạnh" 5 tệp so với "quá đà" 3 tệp. Cũng sai là việc 8.1, 8.2 được ghi là giữ đa số: đa số thật là "Tôi đã giữ ngày trai giới" (5 tệp) và "luôn thu thúc trong các giới" (6 tệp). Nên hạ source_provenance 9.5 xuống 9.3 vì bốn khẳng định kiểm lại được đã sai, nay đã đính chính.
  Khoá đã đổi (accuracy fix): 10.2 bỏ "nhiệm mầu" (không có trong Pāli); 10.1 bỏ "Luôn" (Pāli không có sadā ở khoá này, sadā nằm ở 8.2); 8.1 "Luôn giữ" thành "Tôi đã giữ" (upavasissaṁ là thì quá khứ, và sadā thuộc 8.2); 8.2 "giới hạnh giữ mình trong sạch" thành "luôn thu thúc trong các giới" (saṁvutā là thu thúc, sadā được trả về đúng khoá); 9.4 "cũng không rượu chè say sưa" thành "và xa lánh việc uống rượu" (majjapāna là việc uống rượu, ārakā là xa lánh; bản cũ nói thành say sưa); 3.5 "hãy nói lời hỏi" (vô nghĩa) thành "được hỏi, xin hãy cho biết" (pucchitā là phân từ được hỏi, ācikkha là mệnh lệnh), kéo theo 3.6 thành câu hỏi "đây là quả báo của nghiệp nào?". Terminology fix: 6.3 ujubhūtesu "chân thành" thành "ngay thẳng" (tầng dùng "ngay thẳng" cho ujubhūta ở khoảng 20 chỗ, ja541 cùng cụm ujubhūtesu 6 lần đều "ngay thẳng", "chân thành" chỉ ở 3 chỗ); 9.3 aticārā "không làm quá đà" thành "không tà hạnh" (cách vv15, vv19, vv23, vv24, vv25 trong khuôn năm giới; trong tầng aticāra ở nơi khác là ngoại tình hay phụ bạc, nên "quá đà" mơ hồ); 10.3 "đệ tử cư sĩ" thành "nữ cư sĩ" (upāsikā, 4 tệp); 8.4 "lấy cung điện này làm nơi ở" thành "cư ngụ trong cung điện này" (āvasāmi, 4 tệp). Clarity fix: 12.1 "đã đến" thành "đã đi đến" và 12.3 "dâng" thành "đã dâng" (aorist, nhất quán với 11.4); 12.1 và 12.2 vẫn giữ đúng ranh giới khoá, gerund gantvā đứng trước danh sách lễ vật. 0.2 Itthivimāna "Chuyện Cung Điện Nữ Hư Không" thành "Chuyện Cung Điện Nữ": Pāli không có ākāsa, "Hư Không" là lỗi lặp ở khoảng 75 tệp vv (48 Nữ Hư Không, 27 Nam Hư Không); khuyến nghị người điều phối sửa cả họ vv, bài này đã sửa vì sai nghĩa trực tiếp và đã có tiền lệ dạng "Chuyện Cung Điện Nữ" (1 tệp).
  Điểm đổi: source_provenance 9.5 thành 9.3 (đính chính khẳng định sai); semantic_fidelity 8.8 thành 8.9 (bỏ hai chỗ thêm nghĩa ở 10.1, 10.2, sửa 9.4 và 8.1); grammar_logic 8.9 thành 9.0 (thì và chỗ đặt sadā ở 8.1, 8.2, câu mệnh lệnh 3.5); terminology 8.9 thành 9.0 (ujubhūta, upāsikā); vietnamese_clarity 8.9 thành 9.0 (3.5, 3.6, 9.4, 12.1). Không đổi: han_viet_balance, ambiguity_integrity (bất định thật vẫn còn: citrā honti và cittaṁ ở 2.4, 3.3 chưa có tiền lệ nào; "tuần lễ thần biến" cho pāṭihāriyapakkha là quy ước của tầng, 12 chỗ so với 6 chỗ "nửa tháng", trong khi pakkha là nửa tháng; "tà hạnh" cho aticāra là quy ước khuôn năm giới, Pāli không nói rõ "trong dục"; "Đấng Có Mắt Tuệ" thêm chữ "tuệ" theo đa số 6 trên 8), triangulation (vẫn không có bản Anh độc lập), technical_integrity (vẫn chưa chạy được bốn lệnh của kho). Phép đo sau sửa: tập khoá 63/63 đúng thứ tự; nháy khớp Pāli từng khoá 63 khoá; dấu lược 0 ở cả hai; Pāli trùng nguyên văn trong chính bài 1 cặp (4.2 và 13.2), 0 lệch; số Pāli không đổi (14, 15, thứ tám, tám chi, năm giới, Ba Mươi Ba).
