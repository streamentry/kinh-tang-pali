notes: |-
  Dịch TRỰC TIẾP từ Pāli root — không có tầng Anh đã ghim cho vv36, xem blocking_errors. Đây là bài nhiều chữ lạ nhất trong lát: chỉ 8 khoá có Pāli trùng nguyên văn ở bài khác (2 khoá dùng lại nguyên văn), 29 khoá không có tiền lệ nào, và Sujato cũng không có bản Anh cho cả bộ Pāricchattakavagga. Vì vậy terminology và ambiguity_integrity bị hạ.
  0.1 Vimānavatthu và 0.2 Itthivimāna theo đa số vv. 0.3 Pāricchattakavagga: tầng name/ cho vv-name:32.vv-paricchattakavagga bằng The Chapter With the Coral Tree, nhưng cả tầng Việt có 0 lần chữ Pāricchattaka, nên dùng Phẩm Cây San Hô — đúng dạng Phẩm cộng dịch đã có trong vv (vv75 là Phẩm Khéo Đặt Để, vv26 là Phẩm Cây Hoa Cittalatā). GHI RÕ: nếu muốn thống nhất với Phẩm Pīṭha và Phẩm Mañjiṭṭhaka (giữ tên riêng Pāli) thì phải có tên cho cả phẩm này.
  0.4 Mallikāvimānavatthu: tầng name/ cho vv-name:40.vv36 bằng Mallikā’s Mansion. Giữ tên Mallikā vì chữ này đã có 64 lần trong tầng Việt, ví dụ hoàng hậu Mallikā; đã đo trước và gạch bỏ hướng dịch là hoa lài, vì ở đây Mallikā là TÊN người chứ không phải tên loài hoa.
  BẤT ĐỊNH kambukāyūra ở 2.1: đây là tên một loại đá quý, cả tầng Việt có 0 lần, và cả bản Anh Sujato trong kn cũng không dịch chữ này. Vì không có cách Việt hóa đã kiểm chứng, chỉ giữ nghĩa chung là đồ trang sức quý báu và ghi tên riêng ở đây; KHÔNG chép thẳng chữ Pāli vào thân kinh.
  BẤT ĐỊNH karavīka ở 4.2: 1 tiền lệ trong tầng (tha-ap353:2.4) là cách phiên âm hỏng, không dùng được. haṁsā dịch là thiên nga theo tiền lệ sn6.6:5.1 (caturo ca haṁsā là bốn trăm con thiên nga); karavīka là loài thủy cầm nên dịch vịt nước. Cả hai đều là tiếng chim nên câu vẫn giữ đúng hai chủ thể.
  3.4 pāreva và takkhī có 0 tiền lệ; chỉ giữ nghĩa là ngọc quý (ngọc ma-ni 24 tiền lệ) và ghi bổ từ hình lá cho pāreva. 3.1–3.3 dùng đúng tên đá đã có tiền lệ: vàng, hồng ngọc (13), ngọc trai, ngọc lưu ly, san hô cho masāragalla.
  6.2 và 6.3 xưng ngài (không dùng ngươi như năm câu kệ đầu) để giữ một cụt xuyên suốt bài. 7.4 và 8.3 dùng tôi vì người kể là nữ thiên. 7.3 giữ Parinibbāta là viên tịch (có tiền lệ) và Gotama giữ nguyên vì đã có 64 lần trong tầng.
  Cổng kỹ thuật: npm run validate, npm test, npm run check do coordinator chạy; bài này draft nên không cần npm run build. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
  Lượt cải thiện 2026-10-11 (kiểm toán đối kháng, đọc từng khoá Pāli↔Việt; sửa độc lập, không có tầng Anh để đối chiếu): bản trước SAI NGHĨA ở 20/32 khoá thơ (1.1–8.4) — không phải lỗi nhỏ về chữ mà là bịa nội dung (sập, xe ngựa vàng của tôi, bánh xe, tiếng trống, vịt nước, bắt lửa cháy…), nên các điểm cũ (9.02, semantic_fidelity 8.9, terminology 8.5, ambiguity_integrity 8.7) không có căn cứ. Phân loại lỗi đã sửa: (a) chủ thể/đại từ: 1.3 và 5.1 đọc thành của tôi và ngài trong khi người hỏi gọi nữ thiên là nàng (theo mẫu vv33), 6.2–6.3 xưng ngài; (b) từ nghi vấn và hô cách: 2.1 mất chữ Kā (nàng là ai), 6.3 devate pucchitācikkha bị đọc là hãy nói lời hỏi (lỗi lan trong họ vv, nay là được hỏi, xin hãy cho biết như đa số trong tầng); (c) từ/tên vật sai nghĩa: 1.1–1.2 (y phục, cờ phướn, trang sức màu vàng — nay dùng nguyên văn vv47 vì Pāli trùng khít), 1.3 pītantarāhi, 2.1 kambukāyūra là vòng tay chứ không phải đá quý (3 tiền lệ vòng xuyến vàng), 2.2 kañcanāveḷa là vòng hoa vàng (2 tiền lệ pv24/pv34) chứ không phải ngọc vàng và ngọc lưu ly, 3.3 masāragalla là mắt mèo (3 tiền lệ ud5.5, bản cũ dịch san hô là sai vì pavāḷa mới là san hô), 3.4 pārevatakkhī là mắt bồ câu (không phải hình lá), 4.2 karavīka là chim ca-lăng-tần-già (3 tiền lệ tha-ap, và đây KHÔNG phải vịt nước), 4.3 vaggurūpo là êm tai (vv64 2 lần, bản cũ dịch tiếng trống), 5.1 bỏ chữ bánh xe bịa, 5.3 dhātu là khoáng chất, 5.4 suvibhatta là khéo phân chia (28 chỗ trong tầng) chứ không phải bắt lửa cháy, 6.1 bỏ chữ bánh xe, 6.2 bhāsasi imaṁ padesaṁ là chiếu sáng vùng này, 7.1 maṇisoṇṇacittitaṁ là điểm tô bằng ngọc và vàng, 7.3 parinibbute là viên tịch (locative absolute: khi Đức Gotama đã viên tịch), bỏ vô đối chẳng gì bằng; (d) câu rối nghĩa ở kệ kết: 8.3 sống an ổn, sầu muốn, 8.4 anāmayā là không bệnh tật (sampamodāmi anāmayā), không phải tâm hân hoan hỷ phát đến. 9.1 đổi thành Cung Điện Nữ Mallikā, thứ tám theo đúng khuôn 9.1 của họ vv (Cung Điện X, thứ N). Tổng 32 khoá đổi (1.1–1.4, 2.1–2.4, 3.1–3.4, 4.1–4.4, 5.1–5.4, 6.1–6.4, 7.1–7.4, 8.3–8.4, 9.1); giữ 0.1–0.4, 8.1–8.2. Điểm đổi: source_provenance 9.5 → 9.0 (ghi chú cũ chứa khẳng định sai về nghĩa từ vựng), semantic_fidelity 8.9 → 8.0, grammar_logic 9.0 → 8.5, terminology 8.5 → 8.0, vietnamese_clarity 9.1 → 8.8, han_viet_balance 9.4 → 9.2, ambiguity_integrity 8.7 → 8.2; segment_alignment 10.0, triangulation 7.5, technical_integrity 9.6 giữ. final_score 9.02 → 8.68. Bản cũ ở các mục trên nói kambukāyūra là đá quý, karavīka là vịt nước và 3.1–3.3 dùng san hô cho masāragalla: các khẳng định đó đã bị thay bằng mục này. Tên Itthivimāna ở 0.2 vẫn là Nữ Hư Không (không có ākāsa trong Pāli, lỗi chung ở khoảng 51 tệp vv); KHÔNG sửa riêng tệp này để khỏi lệch cả bộ — cần sửa đồng loạt. 0.4 và 9.1 giữ chữ Nữ như vv35 (Nữ Pesavatī) để khớp các bài kề; chữ này không có trong Pāli Mallikāvimānavatthu (Mallikā là tên nữ thiên). 8.1 giữ nguyên Làm việc ấy rồi, dù Tāhaṁ gồm cả ahaṁ (tôi nằm ở 8.3).
  BẤT ĐỊNH CÒN LẠI (không phân xử được, không có tầng Anh, không có tiền lệ): 1.3 pītantarāhi vaggūhi — danh từ giống cái ẩn, tạm hiểu là các lớp bên trong màu vàng (lớp lót / nội y?); 1.4 apiḷandhāva sobhasi — apiḷandha mang tiền tố api- như apiḷandhana (vv64:10.1 là đồ trang sức) nên dịch như đã được trang sức, cách đọc khác là dù không trang sức vẫn chói sáng; 3.1–3.4 không nêu chủ ngữ của các vật làm bằng vàng, hồng ngọc, ngọc trai, lưu ly (có thể là chuỗi hoa/trang sức của nàng ở 2.4 hoặc các phần của cỗ xe) nên dịch trung lập, không thêm danh từ; 3.3 masāragalla chọn mắt mèo theo ud5.5 (3 lần) nhưng tầng còn một cách giữ nguyên chữ Pāli (pv37, mil), chưa kiểm chứng được là đá nào; 4.1–4.2 cấu trúc koci koci ... haṁsassa rañño karavīkasussaro mơ hồ: bản này hiểu là có kẻ giọng như công, có kẻ như vua thiên nga, giọng như ca-lăng-tần-già, nhưng cũng có thể hiểu giọng ca-lăng-tần-già hay thuộc về vua thiên nga; 7.2 muttācitaṁ (cita = nạm hay chất đầy); 7.4 abhiropayiṁ không nêu người nhận, chỉ tạm để dâng lên (nơi/di vật của Đức Gotama?) — không thêm vật nhận vào lời kinh. Điều tương tự cần soát ở vv38 và vv39 (cùng Pāli 8.1–8.4: vv38 9.3–9.4 và vv39 8.3–8.4 hiện còn sai: sống an ổn, sầu muốn, hân hoan hỷ phát đến, tôi chứng đắc thiên thần lực) và 7 tệp vv có Devate pucchitācikkha dịch là hãy nói lời hỏi (vv38:7.3 và 6 tệp khác).
  Cổng kỹ thuật vẫn do coordinator chạy: npm run validate, npm test, npm run check, npm run build; technical_integrity 9.6 chưa đổi vì không tự chạy các lệnh này. Với điểm mới final_score 8.68 và blocker upstream-english còn nguyên, bài không còn đủ điều kiện published theo bảng gate; status chờ công cụ quality:waive tính lại.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 4 khoá bất đồng nghĩa → sửa 0, giữ 2 (1.4: bản nguyên bài đọc là nàng chói sáng dù không trang điểm, bản dự án đọc như đã được trang sức; giữ vì 1.2 đã nói nàng được trang hoàng và chữ api- có tiền lệ trong apiḷandhana ở vv64:10.1 và ja517:5.2 mang nghĩa đồ trang sức; 6.1: bản nguyên bài gắn màu vàng kim vào dáng của nàng, nhưng kañcanabimbavaṇṇe ở vị trí cách đứng cùng giống với rathe nên bản dự án gắn với cỗ xe), bất định 2 (1.3 pītantarāhi: bản nguyên bài hiểu là tấm choàng, bản dự án giữ nghĩa hẹp hơn là các lớp bên trong vì danh từ không hiện; 4.1–4.2: bản nguyên bài tách thành ba loài tiếng công, thiên nga, karavīka, còn bản dự án ghép vua thiên nga với karavīka vì cấu trúc koci koci chỉ có một koci). Các khoá khác (vòng xuyến, vòng hoa, mắt mèo, ngọc ma-ni mắt bồ câu, xe, lưới vàng dâng khi Đức Gotama viên tịch, 8.1–8.4) hai bản cùng nghĩa. Đọc đối kháng toàn bài thêm một lượt: không thấy lỗi nghĩa mới. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt từng khoá, đối chiếu bản nguyên bài Bhikkhu Indacanda, đoạn song song vv64, vv84, vv37, vv44, vv34, vv38, vv39, ne37): sửa 1 khoá:
    - `8.1` "Làm việc ấy rồi," → "Sau khi tôi làm việc ấy,": `Tāhaṁ` = `tā ahaṁ`, chủ ngữ `ahaṁ` bị bỏ; cùng Pāli ở `vv38:9.1` và `ne37:153.1` đã dịch "Sau khi tôi làm việc ấy". Không đổi nghĩa lớn (accuracy nhỏ + nhất quán).
    Giữ các chỗ khác với bản nguyên bài (đã ghi 2026-10-14): `1.4`, `6.1`. Bất định giữ nguyên văn: `1.3` `pītantarāhi`, `1.4` `apiḷandhāva` (đọc "như đã được trang sức" hay "dù không trang sức"), `4.1`–`4.2` ranh giới `koci koci`/`haṁsassa rañño`, `3.1`–`3.4` chủ ngữ không nêu. Đề xuất: người biên tập tra PED/chú giải cho `apiḷandha`; không sửa theo đoán chữ.
    Lỗi chéo chờ người biên tập: `0.2` Itthivimāna; xưng hô trong lời hỏi `6.2`–`6.3`.

  Nghiên cứu nguồn ngoài 2026-10-16: Hellmuth Hecker, "Vimānavatthu – Wege zum Himmel" (Beyerlein &
  Steinschulte 1995, còn bản quyền; bản SuttaCentral/palikanon.de)
  https://suttacentral.net/vv36/de/hecker, kèm bản Nga của Леонид Шаповалов (dịch từ bản Anh
  Mahamevnawa, phổ biến miễn phí) https://suttacentral.net/vv36/ru/shapovalov, DPD https://dpdict.net,
  và PDF song ngữ Indacanda (chỉ đọc phần dị bản, https://tamtangpaliviet.net/TTPV/30_Vv_Pv.pdf; giấy
  phép NOASSERTION); đã đối chiếu cả 37 khoá (kệ 654–661 của Hecker); sửa 1.4 (`apiḷandhāva sobhasi`:
  trước "chói sáng như đã được trang sức"; Hecker "selbst ohne Schmuck", Indacanda "vẫn chói sáng dầu
  không trang điểm", bản Nga (Mahamevnawa) "даже без этих украшений", DPD `apiḷandha` "not adorned";
  PDF Indacanda ghi dị bản `apilandhā va` Syā, PTS; nay "chói sáng dẫu không trang sức"; mục bất định
  1.4 của lượt trước được gỡ, lý lẽ cũ về `apiḷandhana` không đủ chống ba bản độc lập); bất định 1.3
  `pītantarāhi vaggūhi`, 4.1–4.2 `koci koci` (Indacanda hiểu là các tràng hoa phát tiếng), 5.3
  `dhātūhi` (bản này "khoáng chất", Indacanda "phần tử").

  Rà từng chữ bằng DPD 2026-10-16: 37 khoá đã rà; sửa 1.3 (nghĩa từ: `pītantarāhi` giống cái số nhiều
  là áo khoác ngoài, chú giải Vv-a https://www.tipitaka.org/romn/cscd/s0506a.att1.xml "antarā
  uttariyaṃ uttarāsaṅgo … pariyāyasaddā", bản Nhật 関西パーリ語実習会 https://suttacentral.net/vv36/jpn/kansai
  "上着"; "lớp bên trong" là dịch máy móc `antara` "inner" → "tấm khăn choàng"), 3.3 (nghĩa từ:
  `masāragalla` DPD "emerald; sapphire; crystal", không phải "mắt mèo" — DPD dành "cat's eye" cho
  `veḷuriya`; dùng lại cách dịch "đá quý masāragalla" của câu Pāli trùng vv84:15.3), 4.1–4.2 (thêm ý:
  `koci koci ettha` là trong các tràng ngọc, Vv-a "etthāti etesu mālādāmesu", bản Nhật trung tính; "có
  kẻ" thêm người → "có cái"; `haṁsassa rañño` giữ "vua thiên nga" theo Pāli ghim dù Vv-a đọc
  "haṃsassaro añño"); bất định không có mới.
