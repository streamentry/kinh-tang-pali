notes: |-
  Dịch TRỰC TIẾP từ Pāli root — không có tầng Anh đã ghim cho vv36, xem blocking_errors. Đây là bài nhiều chữ lạ nhất trong lát: chỉ 8 khoá có Pāli trùng nguyên văn ở bài khác (2 khoá dùng lại nguyên văn), 29 khoá không có tiền lệ nào, và Sujato cũng không có bản Anh cho cả bộ Pāricchattakavagga. Vì vậy terminology và ambiguity_integrity bị hạ.
  0.1 Vimānavatthu và 0.2 Itthivimāna theo đa số vv. 0.3 Pāricchattakavagga: tầng name/ cho vv-name:32.vv-paricchattakavagga bằng The Chapter With the Coral Tree, nhưng cả tầng Việt có 0 lần chữ Pāricchattaka, nên dùng Phẩm Cây San Hô — đúng dạng Phẩm cộng dịch đã có trong vv (vv75 là Phẩm Khéo Đặt Để, vv26 là Phẩm Cây Hoa Cittalatā). GHI RÕ: nếu muốn thống nhất với Phẩm Pīṭha và Phẩm Mañjiṭṭhaka (giữ tên riêng Pāli) thì phải có tên cho cả phẩm này.
  0.4 Mallikāvimānavatthu: tầng name/ cho vv-name:40.vv36 bằng Mallikā’s Mansion. Giữ tên Mallikā vì chữ này đã có 64 lần trong tầng Việt, ví dụ hoàng hậu Mallikā; đã đo trước và gạch bỏ hướng dịch là hoa lài, vì ở đây Mallikā là TÊN người chứ không phải tên loài hoa.
  BẤT ĐỊNH kambukāyūra ở 2.1: đây là tên một loại đá quý, cả tầng Việt có 0 lần, và cả bản Anh Sujato trong kn cũng không dịch chữ này. Vì không có cách Việt hóa đã kiểm chứng, chỉ giữ nghĩa chung là đồ trang sức quý báu và ghi tên riêng ở đây; KHÔNG chép thẳng chữ Pāli vào thân kinh.
  BẤT ĐỊNH karavīka ở 4.2: 1 tiền lệ trong tầng (tha-ap353:2.4) là cách phiên âm hỏng, không dùng được. haṁsā dịch là thiên nga theo tiền lệ sn6.6:5.1 (caturo ca haṁsā là bốn trăm con thiên nga); karavīka là loài thủy cầm nên dịch vịt nước. Cả hai đều là tiếng chim nên câu vẫn giữ đúng hai chủ thể.
  3.4 pāreva và takkhī có 0 tiền lệ; chỉ giữ nghĩa là ngọc quý (ngọc ma-ni 24 tiền lệ) và ghi bổ từ hình lá cho pāreva. 3.1–3.3 dùng đúng tên đá đã có tiền lệ: vàng, hồng ngọc (13), ngọc trai, ngọc lưu ly, san hô cho masāragalla.
  6.2 và 6.3 xưng ngài (không dùng ngươi như năm câu kệ đầu) để giữ một cụt xuyên suốt bài. 7.4 và 8.3 dùng tôi vì người kể là nữ thiên. 7.3 giữ Parinibbāta là viên tịch (có tiền lệ) và Gotama giữ nguyên vì đã có 64 lần trong tầng.
  Cổng kỹ thuật: npm run validate, npm test, npm run check do coordinator chạy; bài này draft nên không cần npm run build. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
