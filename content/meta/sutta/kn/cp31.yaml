  - Đối chiếu nghĩa với Jātaka tiền thân: Dùng `ja444` (Kaṇhadīpāyana-jātaka) làm nguồn tham khảo chính về ngữ nghĩa và bối cảnh câu chuyện tiền thân của ẩn sĩ Kaṇhadīpāyana cứu sống đứa trẻ Yaññadatta bị rắn độc cắn bằng lời thề chân thật (saccakiriya).
  - Tiêu đề & phân loại: :0.1 "Hạnh Tạng" (đồng nhất với 24 bài cp khác); :0.2 "Phẩm Yudhañjaya" (đồng nhất với 10 bài khác trong phẩm); :0.3 "Chân Thật Ba-la-mật Thứ Năm" (nối tiếp hệ thống Saccapāramī 1–4, 6 của cp27–30, cp32); :0.4 và translationTitle đồng nhất là "Hạnh Của Ẩn Sĩ Kaṇhadīpāyana"; :14.1 "Hạnh của Ẩn Sĩ Kaṇhadīpāyana, thứ mười một." (chữ "của" viết thường theo đúng quy ước 23/24 bài trong Cariyāpiṭaka).
  - Phép kiểm 5/5:
    1. Đủ 58/58 khoá khớp hoàn toàn Pāli root từ :0.1 đến :14.1, không thừa không thiếu, không đổi ID.
    2. Dấu nháy đơn và kép khớp 1:1 với Pāli root từng khoá: mở kép “ ở 1.1, mở đơn ‘ ở 11.1 (bắt đầu lời thề chân thật), đóng đơn ’ ở 12.3 (kết thúc lời thề chân thật), đóng kép ” ở 13.6 (kết thúc bài kinh); các khoá còn lại tuyệt đối không có dấu nháy dư thừa.
    3. Tính nhất quán nội bộ đạt 100%: 13.5 và 13.6 trùng nguyên văn với tiền lệ cp27:4.3-4.4 và cp30:9.5-9.6 ("Về sự chân thật, không ai sánh bằng ta:" / "đây là Chân Thật Ba-la-mật của ta.”").
    4. Dấu lược: 0/0, Pāli không có dấu lược, bản dịch không tự tiện thêm dấu lược.
    5. Số đếm và tên riêng được kiểm tra chính xác: Paropaññāsavassāni / Vassāni paññāsasamādhikāni = hơn năm mươi năm (1.3, 11.4); Sattāhaṁ = bảy ngày (11.1); Tayo janā = ba người (5.3); ekādasamaṁ = thứ mười một (14.1); Paṭhamaṁ = trước tiên (10.3); Kaṇhadīpāyana (ẩn sĩ Kaṇhadīpāyana), Maṇḍabya (bạn đồng tu Maṇḍabya), Yaññadatta (đứa trẻ Yaññadatta).
  - Thuật ngữ mấu chốt: anabhirato (1.4) / anabhiratimanaṁ (2.2) / arati (2.4) dịch là "lòng chẳng hề hoan hỷ" / "tâm trạng không hoan hỷ" / "nỗi chán nản", phản ánh trung thực tâm trạng không tìm thấy niềm vui thích trong đời sống xuất gia phạm hạnh suốt hơn 50 năm nhưng vẫn giữ nghiêm giới luật không hề dối trá, làm nên sức mạnh chân thật tối thượng (saccabala) để cứu sống đứa trẻ. sūlamāropanaṁ (3.4) dịch "nạn đâm trên cọc nhọn"; āsīvisa (6.4, 7.3, 9.1) dịch "con rắn độc"; uttamaṅga (7.4) dịch "ngay trên đầu".
  - Kỹ thuật: JSON hợp lệ, tất cả chuỗi chuẩn hóa NFC, không có ký tự ngoài hệ Latin, hoàn tất technical check.

  - Giải quyết draft 2026-10-12 (thay thế các mục cũ "Thuật ngữ mấu chốt" về anabhirato/uttamaṅga và lời khẳng định đã tự kiểm 5/5 ở trên):
    1. Phân loại blocker: chỉ có một blocker, thuộc loại thiếu bản Anh upstream (Sujato không phát hành bài này tại commit đã ghim); giữ nguyên vì là sự thật về upstream, không có blocker về độ phủ Sujato hay lỗi văn bản. Giới hạn tham chiếu: tầng Việt hiện hành chỉ có Pháp Cú nên không có đối chiếu Việt truyền thống cho bài này. Tầng tham khảo còn lại là Pāli của chính bài và các câu kệ gần như trùng ở Jātaka 444 (`ja444:1.1–1.7`, đã công bố). `triangulation` giữ 7,5 (≤ 8,0).
    2. Đọc đối kháng 58 khoá: 1 lỗi nghĩa thật và 31 khoá sửa vì thêm nghĩa hoặc sai sắc thái, tổng 32 khoá đổi (cp31:1.3, 1.4, 2.3, 2.4, 3.3, 4.1, 5.4, 6.3, 7.1–7.4, 8.2, 8.4, 9.1–9.4, 10.1–10.4, 11.1–11.4, 12.1–12.3, 13.2–13.4).
    3. Lỗi nghĩa thật (12.1): `Akāmako vāhi ahaṁ carāmi` bị dịch "ta sống mà lòng chẳng có ước muốn gì". `akāmako` là "không muốn, miễn cưỡng" (chủ thể sống phạm hạnh trái ý), đúng với mạch bất mãn ở 1.4/2.2/2.4 và với câu song song `ja444:1.5` (`Akāmakovāpi ahaṁ carāmi` = "dù không muốn, ta vẫn sống như vậy"). Sửa thành "dù không muốn, ta vẫn sống như vậy". Dạng `vāhi` được đọc như `vāpi` của `ja444` (biến thể chính tả; ghi ở mục bất định).
    4. Khoá 11.1–12.3 trùng gần nguyên văn Pāli với `ja444:1.1–1.7` (khác `acariṁ`/`ācariṁ`, cách tách `paññāsa samādhikāni`, `vāhi`/`vāpi`): dùng lại cách dịch đã công bố của `ja444` (7 khoá đối chiếu, 0 chỗ lệch nghĩa sau sửa). Qua đó bỏ các thêm nghĩa: "đầu" ở 11.1 (Pāli chỉ nói `Sattāhameva`, thứ tự do `Athāparaṁ` ở 11.3), "hoan hỷ" cho `pasanna` (nay "tịnh tín", đúng tiền lệ toàn tầng: 137/150 khoá có `pasannacitto` dùng "tịnh tín"), "sống lại" cho `jīvatu` (nay "sống").
    5. Các thêm nghĩa/đổi sắc thái khác đã gỡ: "hề" (1.4), "chỉ" (2.4), "tận tình" (4.1), "am thất" thêm vào `pāhunāgataṁ` (5.4; cùng chữ `pāhuna` = khách ở `an5.228`), "lăn"/"mải miết" (6.3, 7.1–7.2), "ngay" và "chạm phải" (7.3–7.4; Pāli `parāmasi` chỉ là chạm), "hung tàn" (8.2), "chớp mắt" cho `khaṇe` (8.4), "cắn trúng"/"gục" (9.1–9.2), "vô cùng" (9.3), "hai người" cho `te` (10.1; Pāli chỉ nói số nhiều), "cơn phát"/"bừng"/"hoàn toàn" (13.2–13.4).
    6. `kiriyaṁ` (10.3) đổi từ "lời thề chân thật" sang "lời tuyên thệ" theo tiền lệ cùng bộ (cp29–cp30: 7 khoá dùng "tuyên thệ", 1 khoá cũ của bài này dùng "lời thề"); `saccaṁ` ở 10.4 dịch "sự thật" nên không lặp "chân thật". `mānase` (2.4) dịch "trong tâm" thay "trong dạ". Tiền lệ `anabhirati`: "không hoan hỷ" (`dhp186`, `dn34`) và "bất mãn" (`sn8`, `an10.66`) cùng tồn tại; giữ "không hoan hỷ" cho nhất quán với toàn bài.
    7. Số: `Paropaññāsavassāni` (1.3) = "hơn năm mươi năm"; `Vassāni paññāsasamādhikāni` (11.4) = "năm mươi năm và hơn thế" (cách `ja444`); `Sattāhameva` = bảy ngày; `Tayo janā` = ba người (cha, mẹ, con); `ekādasamaṁ` = thứ mười một. Pāli `…` và `(…)`: 0/0. Nháy ‘ ’ “ ” khớp Pāli từng khoá (“ 1.1, ‘ 11.1, ’ 12.3, ” 13.6). Cặp Pāli trùng nguyên văn trong chính bài: 0; cặp trùng với bài khác bản Việt khác nhau: 0 (13.5–13.6 khớp `cp30:9.5–9.6`).
    8. Bất định còn lại (không thêm vào thân kinh): (a) `vaṭṭa` (6.3, 7.1) hiểu là vật tròn dùng để chơi, dịch "quả bóng"; bài không nêu rõ chủng loại. (b) `mama vāhasi taṁ dukkhaṁ` (9.4) đọc `vā` như "như thể" (≈ `iva`), bản chép `vāhasi` khó phân xử; nghĩa chính "nỗi đau ấy như là của ta". (c) `Abujjhitvāna` (13.3) đọc như `pabujjhitvāna` ("tỉnh lại"), cùng kiểu với `cp26:4.2` và `ja523:33.2`; không đọc `a-` là phủ định vì mạch câu ("rồi đứng dậy"). (d) `vāhi`/`vāpi` (12.1) như mục 3. (e) `kiriyaṁ` = hành vi tuyên bố sự thật (saccakiriya).
    9. Kỹ thuật: `technical_integrity` 9,6; bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` do công cụ kho chạy sau khi ghi. Tự kiểm: tập khoá Việt = Pāli (58/58), thứ tự khoá theo Pāli, NFC, không khoá rỗng.

  - Giải quyết draft 2026-10-13 (vòng 2; thay thế các câu cũ nói không có tầng tiếng Anh và `triangulation` 7,5):
    1. Phân loại blocker: loại (A') — blocker cũ `noEnglishEditionUpstream` khẳng định thiếu bản Anh là SAI. Bản Anh của Bhikkhu Sujato CÓ phát hành cho bài này tại commit đã ghim (`sutta/kn/cp/cp31_translation-en-sujato.json`, có trong `source/upstream-manifest.json`), đủ 58 khoá; chỉ `cp31:14.1` để trống (câu kết ngắn, dưới ngưỡng 40 ký tự). Độ phủ trên Pāli có nội dung = 100%, nên không có blocker độ phủ và không cần ghi nhận gap. Đã xoá blocker (mảng rỗng). Tầng Việt hiện hành vẫn chỉ có Pháp Cú: đây là giới hạn tham chiếu, không phải lỗi văn bản.
    2. Đối chiếu từng khoá với bản Anh Sujato và Pāli root: đồng thuận ở mọi chỗ then chốt (hơn năm mươi năm bất mãn; Maṇḍabya bị xiên cọc do nghiệp quá khứ; đứa trẻ chọc rắn rồi bị cắn; lời nói thật 11.1–12.3; "dù không muốn" ở 12.1 khớp "unwillingly"). Không còn khoá nào sai nghĩa; các khoá Sujato diễn giải thêm (9.2 "fainted" cho `papati bhūmiyaṁ`; 12.2 thêm chủ ngữ "he") không bị bản Việt theo, vì Pāli không có.
    3. Bốn khoá đổi (không phải lỗi nghĩa, là chỉnh sắc thái/tiền lệ; lỗi nghĩa thật 0/58): `cp31:2.4` "nỗi chán nản quẩn quanh trong tâm ta" thành "nỗi bất mãn vận hành trong tâm ta" (`arati` = "bất mãn" theo tiền lệ `ja525:26.2`, `mnd8:67.2`; "chán nản" là `ukkaṇṭhitā` ở `mnd15:53.4`; bỏ "quẩn quanh" vì `carati` chỉ nói vận hành); `cp31:5.2` "con thơ" thành "con trai nhỏ" (`puttaka` là con trai, dạng chỉ nhỏ; ở 6–13 cậu bé được gọi là `dārako`, `kumārako`, `māṇavo`); `cp31:5.4` bỏ "ghé thăm" thêm vào `pāhunāgataṁ` (chỉ nói đến như khách); `cp31:12.1` bỏ "như vậy", đổi "sống" thành "thực hành" cho trùng nguyên văn `ja444:1.5` (cùng `carāmi`, và gọi lại `caritaṁ` ở 11.3 là "sự thực hành").
    4. Dùng lại cách dịch đã công bố của `ja444:1.1–1.7` cho 11.1–12.3: 7 khoá đối chiếu, nay 0 chỗ lệch nghĩa (khác dạng chữ chỉ ở `acariṁ`/`ācariṁ`, `vāhi`/`vāpi`; "đã sống" ở 11.2 ja444 và "sống" ở đây là khác thì quá khứ, không đổi nghĩa). Các câu mở "Lại nữa, vào thời thuở nọ," giữ theo đa số tiền lệ cp (20/25 khoá mở đầu "Lại nữa, vào thời thuở nọ", phần còn lại là "khi ta là/còn là" hoặc "thuở xưa").
    5. Số: `Paropaññāsavassāni` = "hơn năm mươi năm"; `paññāsasamādhikāni` = "năm mươi năm và hơn thế" (Sujato: "fifty years or more"); `Sattāhaṁ` = bảy ngày; `Tayo janā` = ba người (khớp "all three"); thứ mười một. Pāli `…`/`(…)` 0/0; nháy “ ‘ ’ ” khớp Pāli từng khoá; cặp Pāli trùng trong chính bài 0; 13.5–13.6 trùng `cp27:4.3`, `cp29:11.5`, `cp30:9.5`, `cp32:6.5` (4/4 bản Việt giống nhau).
    6. `triangulation` nâng từ 7,5 lên 9,0 vì nay có một bản Anh độc lập đã xuất bản đối chiếu từng khoá; không lên cao hơn vì không có tầng Việt hiện hành. `ambiguity_integrity` 9,0, bất định còn lại giữ ở mục 8 của đợt 2026-10-12 (`vaṭṭa`, `mama vāhasi taṁ dukkhaṁ`, `abujjhitvāna`, `vāhi`, `kiriyaṁ`); Sujato đồng ý "ball", "as if mine", "awoke", "unwillingly" và "act/declaration of truth" cho các điểm đó nên không còn chỗ nào dựa vào đoán đơn độc.
    7. Kỹ thuật: `technical_integrity` 9,6; bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` do công cụ kho chạy sau khi ghi. Tập khoá Việt = Pāli (58/58), thứ tự theo Pāli, NFC, không khoá rỗng.
