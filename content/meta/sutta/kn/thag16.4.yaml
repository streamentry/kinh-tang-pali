notes: |-
  Phạm vi: đủ 105/105 khoá của bài (4 khoá `:0` tiêu đề, 100 khoá kệ `1.1`–`25.4`, `25.5` dòng bìa), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã đọc đối chiếu cả 105 cặp Pāli↔Việt, không đọc mẫu. Đây là các kệ của Trưởng lão Raṭṭhapāla; các kệ `1`–`4` và `6`–`20` có song song trong `mn82` (nơi Ngài nói với vua Koravya), nên bản này đối chiếu thêm bản Việt `mn82` đã published; các kệ `21`–`25` là phần tự thuật chỉ có ở Theragāthā.

  ⚠️ MẪU SỐ COVERAGE THEO CỔNG = 0 — CỔNG NÀY KHÔNG ĐO ĐƯỢC GÌ. `source/layers.yaml` đặt `substantivePaliMinChars: 40` và bỏ khối `:0`. Khoá Pāli dài nhất của bài chỉ 34 ký tự (mỗi pāda một khoá), nên 0 khoá đạt ngưỡng. Đây là "không đo được gì", không phải "không cần ghi nhận gap". Tôi không dùng nó làm căn cứ publish mà đo thô riêng như dưới đây.

  COVERAGE ENGLISH THÔ (do người biên tập tự phán) — tra tầng đã ghim, không suy từ tên thư mục. `english-sujato` có tệp cho bài này (`sutta/kn/thag/thag16.4_translation-en-sujato.json`), cùng đúng 105 khoá ID với Pāli, cùng thứ tự. Trên 101 khoá thân (bỏ 4 khoá `:0.x`), Sujato có prose ở 100/101 = 0,990; trên mọi 105 khoá: 104/105 = 0,990. Ngưỡng 0,80 của kho đạt trên phép đo thô này. Khoá duy nhất Sujato để trống là `25.5` (dòng bìa `… Raṭṭhapālo thero ….`). `english-project`: không có tệp cho bài này (không cần lấp). `vietnamese-current`: vắng tại commit đã ghim (bilara chỉ có Pháp Cú), đặc điểm của cả tầng ở `thag`. Bản Việt nguyên bài của sc-data chỉ dùng tra cứu toàn văn, không căn lề theo khoá, nên không được tính là tầng tham khảo. Không có entry trong `reference-gaps.yaml` cho bài này; mẫu số bằng 0 nên cổng không có gì để ghi nhận.

  CẤU TRÚC VÀ NHÁY. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá). Pāli của bài chỉ có một dấu mở `“` ở `1.1` và một dấu đóng `”` ở `25.4`; toàn bộ 25 kệ nằm trong một lời nói liền. Pāli không có nháy đơn nào, kể cả quanh lời than của thân quyến ở `11.2` (`aho vatā no amarāti cāhu`, `iti` không kèm nháy). Bản Việt theo đúng Pāli từng khoá, nên không thêm nháy đơn ở `11.2`, dù `mn82:42.16` có thêm. Bản Anh đặt nháy ở `7.4`, `8.1`, `20.4`, `21.1` còn Pāli thì không; bản Việt theo Pāli.

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 105 = Pāli 105, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
    2. Nháy đơn và kép khớp Pāli từng khoá: 0/105 lệch. Tổng: `“` 1/1, `”` 1/1, `‘` 0/0, `’` 0/0 (Pāli/Việt).
    3. Pāli trùng nguyên văn TRONG CHÍNH bài: 6 nhóm (`3.3`=`4.3`=`5.3`, `3.4`=`4.4`=`5.4`, `6.2`=`7.2`, `6.3`=`7.3`, `17.1`=`17.4`, `18.2`=`18.4`). Bốn nhóm đầu bản Việt giống nhau từng chữ. Nhóm `18.2`/`18.4` giống từng chữ, chỉ khác dấu cuối (`;` và `.`) đúng như Pāli (`;` và `.`). Nhóm `17.1`/`17.4` khác: `17.1` là `Người nhập thai và đến thế giới kia,` (chủ ngữ là người làm ác nghiệp ở `16.4`, theo `mn82:42.39`), `17.4` là `cũng nhập thai và đến thế giới kia.` (chủ ngữ là kẻ ít trí tuệ ở `17.3`, theo `mn82:42.42`); khác biệt là chủ ngữ do câu trước cấp, không phải khác cách dịch cụm Pāli. Pāli trùng ở bài khác: 74 khoá có tiền lệ, 952 cặp, 797 cặp bản Việt trùng với bản này (sau khi bỏ dấu câu và hoa thường), 155 cặp khác. Phân xử 155 cặp khác: 13 cặp ở `0.3` `Paṭhamavagga` (11 bài thag đặt tên trưởng lão ở `0.3`, 2 bài ghi thêm số thứ tự đầu dòng; bản này theo Pāli và khuôn `thag16.1`–`thag16.7` đã dịch: `0.3` là tên phẩm); 64 cặp ở `tha-ap`/`thi-ap` cho `24.2` `kataṁ buddhassa sāsanaṁ` (các bài apadāna đưa chủ ngữ tôi/con vào câu vì đó là lời tự thuật có chủ ngữ riêng trong khoá lân cận; bản này theo `thag11.1:8.2`, `thag14.1:12.2`, `thag15.1:15.2` là cùng bộ, cùng thể kệ, không chủ ngữ: `đã làm tròn lời dạy của Đức Phật`; 3 khoá `sn8.12`, `thag8.3`, `thig3.1` dịch lời dạy đã hoàn thành, cùng nghĩa khác trật tự); 34 cặp với `mn82` (kệ song song, xem dưới); 44 cặp còn lại, phần lớn là câu cố định của công thức cuối bài (`23.1` `Etamādīnavaṁ ñatvā`: tầng có 15 khoá, `Biết rõ sự nguy hại này` 7 khoá so `Biết sự nguy hiểm ấy` 4 khoá và dạng khác, chọn dạng đa số; `25.1` `Yassatthāya pabbajito`: `thag2.8:2.1` dịch `Mục đích vì thế mà tôi xuất gia`, bỏ nghĩa quan hệ của yassa atthāya, nên theo `thag11.1:9.1`, `thag15.1:16.1` `Mục đích mà vì đó tôi đã xuất gia`; `25.2` `agārasmānagāriyaṁ`: 13 khoá, `đến` và `đi đến` và `bước vào` xen nhau, theo `thag15.1:16.2`, `thag2.8:2.2`; `24.4` `bhavanetti samūhatā`: `sợi dây dẫn đến hữu đã được nhổ bỏ` theo `thag15.1:15.4`, `thag11.1:8.4` chỉ khác một giới từ vào/đến; `1.1`, `1.2`, `1.4` trùng `dhp147` nhưng dhp dịch hình nộm và thân thể chất chứa vết thương, bản này theo `mn82:25.1`, `25.2`, `25.4` vì cùng bài người nói và cùng thể kệ; `1.3` xem bất định; `9.2`–`9.4` trùng `ja467:5.2`–`5.4` nhưng Jātaka diễn đạt khác về biển, bản này giữ sát từng chữ như `mn82:42.8`–`42.10`).
    4. Dấu lược: Pāli có `…` ở 1 khoá (`25.5`, hai dấu lược), Việt có đúng khoá đó với hai dấu; `…pe…` 0; `(…)` trần 0 ở Pāli nên 0 ở Việt. Lỗi = 0/105. Khoá bìa `25.5` kết ` ….` (lược rồi mới chấm), đúng dạng đa số của tầng (398/760 khoá Pāli kết `….`) và đúng `thag16.1:21.5`, `thag16.7:24.5`.
    5. Số Pāli (tự tính): trong thân kệ chỉ có hai số. `ekena vatthena` (`12.2`) = một tấm vải (eka = 1). `Aṭṭhapadakatā` (`4.1`): aṭṭha 8 + pada, dịch tóc kết thành tám lọn; chữ aṭṭhapada còn là tên bàn cờ nên số tám có thể là dạng ô vuông, xem bất định. Ngoài thân kệ: `Vīsatinipāta` (`0.2`): vīsati = 20, nipāta = bộ ⇒ Bộ Hai Mươi Bài Kinh, theo `thag16.1`–`thag16.7` đã dịch (`Soḷasakanipāta` ⇒ Bộ Mười Sáu Bài Kinh). Phép hiệu chuẩn nội bộ: eka 1, aṭṭha 8, vīsati 20, nhất quán một cách đọc.
    Vệ sinh: JSON hợp lệ, 105/105 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa, 0 khoá Pāli lọt sang Việt ngoài tên riêng (`Theragāthā`, `Raṭṭhapāla`).

  ĐỐI CHIẾU VỚI `mn82` (kệ song song). Pāli của Theragāthā khác `mn82` ở một số chữ nhỏ (`cittakataṁ`/`cittīkataṁ`, `vāguraṁ`/`vākaraṁ`, `pasayhappathaviṁ`/`pasayhā pathaviṁ`, `seyyā`/`seyyo`, `karoti`/`karonti`, `sandhimukhe gahīto`/`gahito`) và có thêm kệ `21`–`25`. Những chỗ trùng nghĩa, bản này lấy lại cách dịch của `mn82` (trùng đúng từng chữ ở 32 khoá thân: 1.2, 1.4, 2.3, 3.2–3.4, 4.2–4.4, 5.3–5.4, 6.1–6.2, 7.2, 8.2–8.4, 9.3, 10.1–10.3, 11.1, 14.1, 15.1–15.2, 16.2, 17.1, 17.4, 18.1–18.2, 18.4, 20.2, sau khi bỏ dấu câu và hoa thường). Những chỗ khác `mn82` có chủ ý (34 cặp; liệt kê chỗ nặng nhất): xưng hô `ta` của `mn82` sang `tôi` (và `chúng tôi` ở `6.3`, `7.3`, vì Pāli `gacchāma` là ngôi thứ nhất số nhiều) cho khớp cả bộ thag đã dịch (`tôi` thắng `ta` trong `thag16.1`, `thag16.7` và nhóm lân cận); `1.3` `bahusaṅkappaṁ` là `nhiều toan tính` theo `dhp147:3` (cùng Pāli) thay vì `nhiều mộng tưởng`; `5.1` `añjanī` là hộp đựng thuốc bôi mắt (khác `hộp phấn` của `mn82`), xem bất định; `9.2` giữ `mahiṁ` (đất) bằng `cõi đất cho đến tận biển` thay vì `trị vì đến tận bờ biển`; `10.4` dịch sát `na atthi titti` thay vì ý lượng `chẳng bao giờ đủ`; `11.2` bỏ `Người thân ta` vì Pāli không có chủ ngữ; `12.1` giữ `sūlehi` là cọc nhọn (đâm xuyên), `mn82` viết `que`; `13.3` bỏ cách nói thiếu chủ ngữ của `mn82` `Không gì tài sản theo kẻ chết`; `14.4` dịch `asassataṁ` là `không thường hằng` thay vì `vô thường` để khỏi trùng thuật ngữ anicca; `16.3` `bhavābhavesu` là `các hữu này hữu khác` theo đa số (đo toàn tầng 62 khoá chứa `bhavābhav`: dùng `hữu` 32, `đời` 8); `19.1`–`19.3` lấy đúng `snp1.3:16.1`–`16.3` (cùng Pāli, `kāmaguṇesu` là `các dục lạc`: đo toàn tầng 246 khoá chứa `kāmaguṇ`, `dục lạc` 53, `ngũ dục` 6, `dục vọng` 2, `các dục` 6).

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `bimba` → hình hài (`mn82:25.1`, `sn5.9`; `dhp147` dịch hình nộm). `rūpa` (`2.1`) → dung nhan. `arukāya` → thân đầy vết thương. `cittakata` → được trang điểm, theo `dhp147:1`; trong cả bài đặt `trang điểm` cho `cittakata`, `alaṅkata`, nhất quán (khác `mn82` dùng `điểm trang` ở `25.18`).
    · `maṇi kuṇḍala` → châu báu và vòng tai (`mn82:25.6`). `alattaka` → son đỏ (`thag7.1:1.3`; `mn82` dịch sơn màu đỏ). `cuṇṇaka` → phấn (tầng dùng `bột` cho `cuṇṇakajāta`, `phấn` cho `cuṇṇakamakkhitaṁ` ở `mn82:25.10`). `añjana` → thuốc bôi mắt/thuốc đen. `pāragavesī` → người tìm bờ bên kia (`mn82:25.12`, `dhp355:2` dịch bờ kia).
    · `bāla` → kẻ ngu (đo toàn tầng 250 khoá: kẻ ngu 171, người ngu 15). `dhīra` → bậc trí (159 khoá: bậc trí 81, người trí 15). `pajā` → chúng sinh (1.968 khoá chứa `pajā`: chúng sinh 175, loài người 95; theo đa số, và theo `mn82:42.45`). `satta` (`13.2`) → chúng sinh.
    · `māṇava` (`20.1`) → con người. Đo toàn tầng 587 khoá chứa `māṇav`: thanh niên 390, con người 5, loài người 3; ở đây `daharā ca vuḍḍhā ca` (trẻ lẫn già) bổ nghĩa nên `thanh niên` sai; chọn `con người`, khác `mn82` chỉ ở một chữ.
    · `migabandhaka` → kẻ bắt nai (`mn82:25.24`; `thig12.1:7.2` dịch kẻ bẫy thú, khác ngữ cảnh). `migaluddaka` → kẻ săn nai (`pv32:0.3` dịch ngạ quỷ bắn hươu; chọn săn vì `luddaka` là thợ săn, và để khỏi nhầm `bắn`). `nivāpa` → mồi (`mn82:25.23`, `mn25` dịch mồi). `vāgura` → lưới; không có tiền lệ trực tiếp (`mn82` có `vākaraṁ` khác chữ).
    · `kāma` → dục; `kāmaguṇa` → dục lạc (xem trên). `ādīnava` → nguy hại (7 khoá `Etamādīnavaṁ ñatvā` dịch nguy hại, 4 khoá nguy hiểm). `sāmañña` → đời sống sa-môn.
    · `dāyādaka` → người thừa kế (đo toàn tầng 124 khoá chứa `dāyād`, bỏ hợp từ `brahmadāyāda`, `dhammadāyāda`: người thừa kế 9, thừa tự 4, thừa kế 3, người thừa tự 1).
    · `phassa` → xúc chạm (`mn82:42.31`). `vosāna` → cứu cánh (`mn82:42.36`).
    · `jinasāsana` → giáo pháp của bậc Chiến Thắng (15 khoá chứa `jinasāsane`, hầu hết là Milindapañha và apadāna dịch đúng dạng này). `anaṇa` → không mắc nợ (`thig1.2:1.4`; 6 khoá: không mắc nợ 3, không còn nợ nần 2, không nợ 1). `avañjhā` → không uổng phí; không có tiền lệ trong tầng.
    · `saṁvega` → tâm khẩn thiết (`thag2.39:2.2`, cùng dòng Pāli `saṁvegaṁ alabhiṁ tadā`; toàn tầng 81 khoá có `saṁveg`/`saṁvej`: xúc động 10, động tâm 7, khẩn thiết 5; chọn khẩn thiết theo khoá trùng Pāli nguyên văn). `āsavakkhaya` → sự đoạn tận các lậu hoặc.
    · `pariciṇṇo mayā satthā` → Bậc Đạo Sư đã được tôi phụng sự (`thag15.1:15.1`; `thag11.1:8.1` dịch Bậc Thầy). `kataṁ buddhassa sāsanaṁ` → đã làm tròn lời dạy của Đức Phật. `ohito garuko bhāro` → gánh nặng đã được đặt xuống (`thag14.1:12.3`). `bhavanetti` → sợi dây dẫn đến hữu. `sabbasaṁyojanakkhayo` → sự đoạn tận mọi kiết sử (`thag6.1:6.4`).
    · `rāja` (vocative, `19.4`, `20.3`) → thưa nhà vua (`mn82:42.50`, `42.53`).
    · `Vīsatinipāta` → Bộ Hai Mươi Bài Kinh. `Paṭhamavagga` → Phẩm Thứ Nhất. `0.4` theo khuôn Kinh Kệ Của Trưởng Lão X, đúng `thag16.1:0.4`.

  KHÁC BIỆT ĐÃ PHÂN XỬ (đối chiếu Sujato).
    (1) `1.3` `bahusaṅkappaṁ`: Sujato dịch obsessed over; bản Việt dịch nhiều toan tính, xem bất định.
    (2) `3.3`–`3.4`: Sujato dịch may be enough to beguile a fool, but not a seeker of the far shore; bản Việt giữ `alaṁ` là đủ và `no ca` là không, theo `mn82:25.11`–`25.12`.
    (3) `5.1`–`5.2`: Sujato nối thành A rotting body all adorned like a freshly painted makeup box; bản Việt giữ hai vế ở hai khoá (hộp mới được vẽ màu, thân thối rữa được trang điểm), vì Pāli đặt `añjanī` ở `5.1` và `pūtikāyo alaṅkato` ở `5.2`.
    (4) `6.3`: Sujato dịch I've eaten the bait and now I go (số ít); bản Việt dịch chúng tôi, theo Pāli `gacchāma` (ngôi thứ nhất số nhiều).
    (5) `11.2`: Sujato dịch They're not immortal; bản Việt dịch đâu có bất tử, không nêu chủ ngữ, xem bất định.
    (6) `13.3`–`13.4`: Sujato dịch Riches don't follow you when you die; nor do children, wife, wealth, nor kingdom; bản Việt dịch Không một tài sản nào theo người đang chết, con cái, vợ, tài sản, quốc độ cũng không. Tôi đọc `kiñci` là phủ định phổ quát gắn với `dhanaṁ`, và bốn danh từ ở `13.4` là một danh sách cùng chủ ngữ với `anveti`, như Sujato và `mn82`.
    (7) `16.2`–`16.3`: Sujato dịch since by wisdom you reach consummation in this life; bản Việt giữ chủ ngữ không nêu (nhờ trí tuệ, ngay đời này đạt cứu cánh), đúng Pāli, không thêm you.
    (8) `17.1`–`17.4`: Sujato dịch One who enters a womb... While someone of little wisdom, placing faith in them, also enters a womb; bản Việt giữ chữ `cũng` ở `17.4` để nối với `17.3`, như Sujato, xem bất định.
    (9) `20.1`: Sujato dịch the sons of Manu; bản Việt dịch con người, vì `māṇava` ở đây là loài người nói chung (xem thuật ngữ).
    (10) `20.4`: Sujato dịch it's a sure bet that the ascetic life is better; bản Việt dịch chắc chắn, chính đời sống sa-môn là điều tốt hơn, giữ `apaṇṇakaṁ` là trạng từ chắc chắn và `eva` là chính.
    (11) `22.3`–`22.4`: Sujato dịch conception in a womb as suffering, and the hells as very fearful (cả hai đều là đối tượng của `disvā`); bản Việt giữ hai danh ngữ không động từ (khổ kể từ lúc nhập thai, nỗi sợ lớn trong các địa ngục), nối vào `22.1`–`22.2` bằng cách xếp song song, không thêm chữ thấy.
    (12) `23.3`: Sujato dịch I was stabbed, but then I found peace; bản Việt dịch chính tôi, khi ấy bị xuyên thấu, rồi được an tịnh, giữ `santo` là an tịnh, xem bất định.
    (13) `10.4`: Sujato dịch for in this world sensual pleasures never satisfy (có chữ for); bản Việt không thêm chữ vì, theo Pāli.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `1.3` `bahusaṅkappaṁ`: `saṅkappa` là ý định, dự tính, tư duy. Có thể đọc là nhiều toan tính (cách hiểu của `dhp147:3`), là nhiều ý nghĩ chiếm tâm (Sujato obsessed over), hoặc nhiều mộng tưởng (`mn82:25.3`). Chọn toan tính vì trùng Pāli với `dhp147:3`; ba cách đọc chỉ khác sắc thái, không đổi nghĩa cả kệ.
    · `4.1` `Aṭṭhapadakatā kesā`: `aṭṭhapada` có hai nghĩa đã biết: tám bím, tám lọn (Sujato eight braids, `mn82:25.13` tóc búi thành tám lọn) và bàn cờ, nên cũng có thể là tóc chải thành ô vuông như ô cờ. Tôi theo tám lọn như hai tiền lệ; chưa phân xử trọn vẹn. Tầng không có tiền lệ nào khác cho `aṭṭhapadaka`.
    · `5.1` `Añjanīva navā cittā`: `añjanī` là hộp hay ống đựng thuốc bôi mắt; `navā cittā` là mới và được vẽ (tô màu). `mn82:25.17` dịch hộp phấn mới tô son, bản Anh dịch freshly painted makeup box. Tôi dịch theo gốc từ (añjana + ī = đồ đựng thuốc bôi mắt) và giữ hai tính từ; hộp phấn là cách diễn nghĩa rộng hơn. Tầng không có tiền lệ nào cho `añjanī`.
    · `6.3`/`7.3` `gacchāma`: ngôi thứ nhất số nhiều, thường được đọc là con nai nói (kẻ đã ăn mồi mà thoát), ám chỉ vị trưởng lão đã hưởng đời rồi bỏ đi. Dịch chúng tôi theo Pāli; nếu người biên tập muốn đồng nhất với Sujato (số ít), sửa hai khoá. Không có tiền lệ trong tầng khác `mn82:25.23` (`ta`).
    · `9.2` `Sasāgarantaṁ mahimāvasanto`: `mahiṁ āvasanto` là cư ngụ, ngự trị trên đất; `sasāgarantaṁ` là có biển làm giới hạn. Dịch ngự trị trên cõi đất cho đến tận biển; cũng có thể đọc là sống trên đất có biển bao quanh (`ja467:5.2` cư ngụ nơi đất liền có đại dương bao quanh), cùng nghĩa.
    · `11.2` `aho vatā no amarāti cāhu`: `amarā` là số nhiều, `no` có thể là `na` (không) hoặc `amhākaṁ` (của chúng ta). Cách đọc phổ biến: họ nói Than ôi, đâu có bất tử! (Sujato They're not immortal), tức không ai bất tử, kể cả người nói. Cách đọc khác: Than ôi, chúng ta không phải bất tử. Bản Việt giữ câu không chủ ngữ để không chọn thay Pāli; `mn82:42.16` đã chọn Người thân ta chẳng bất tử, thêm chủ ngữ mà Pāli không có.
    · `12.1` `sūlehi tujjamāno`: `tujjamāno` là bị thọc, bị đâm; `sūla` là cọc nhọn, que nhọn dùng đảo giàn thiêu. Dịch bị những cây cọc xuyên chọc; có thể đọc nhẹ hơn là bị chọc bằng cọc để đảo thân. Cùng nghĩa với `mn82:42.19`.
    · `13.2` `Satto pana gacchati yena kammaṁ`: `yena kammaṁ` là nơi nghiệp dẫn đi (kammaṁ ở đây là chủ ngữ ngầm của `yena`); Sujato dịch beings fare on according to their deeds, `mn82:42.24` dịch theo nghiệp. Cả ba cách đều cùng nghĩa; chọn đi đến nơi nghiệp dẫn đi cho sát `yena`.
    · `17.1`–`17.4` `tassappapañño abhisaddahanto`: `tassa` có thể chỉ người làm ác ở `16.4`, hoặc chỉ chính lời dạy/quan niệm của người ấy (tin theo điều người ấy làm). Dịch đặt niềm tin nơi người ấy (Sujato placing faith in them); chủ ngữ của `17.1` đọc là người ở `16.4`. Chưa phân xử trọn vẹn.
    · `19.2` `virūparūpena`: hình thức khác lạ, theo `snp1.3:16.2` (cùng Pāli); `mn82:42.48` dịch nhiều hình thức, Sujato appearing in disguise (giả dạng). Không đổi nghĩa cả câu.
    · `21.2` `upeto jinasāsane`: `upeta` là đến gần, gắn bó với; chọn đã đến với giáo pháp, cũng có thể là đầy đủ trong giáo pháp. Không có tiền lệ cho dạng này trong tầng.
    · `22.2` `Jātarūpāni satthato`: `jātarūpa` là vàng; `satthato` là như đao kiếm, như vũ khí (Sujato a cutting blade). Chọn đao kiếm theo `satthāni` đã dịch ở `thag16.1`.
    · `22.3`–`22.4`: xem khác biệt (11); hai danh ngữ nối với `disvā` ở `22.1`; nếu người biên tập muốn rõ chủ ngữ thì thêm chữ thấy, bản này không thêm.
    · `23.3` `Sohaṁ viddho tadā santo`: `viddho` là bị xuyên thấu (bởi saṁvega ở `23.2`), `santo` có thể là an tịnh (Sujato found peace) hoặc chỉ là phân từ của `atthi` (đang ở trong trạng thái ấy). `thag2.39:2.3` dùng cùng dòng với `ditto` khác chữ (`Sohaṁ ditto tadā santo`) và dịch lúng túng, không dùng làm tiền lệ. Chọn an tịnh vì `āsavakkhaya` kề liền ở `23.4`; chưa phân xử trọn vẹn.
    · `25.1` `Yassatthāya`: Pāli khác `thag11.1:9.1`, `thag15.1:16.1`, `thag14.1:13.1` (`Yassa catthāya`) ở chữ `ca`; bản này dùng cùng cách dịch, vì chữ `ca` chỉ là hư từ nối.

