notes: |-
  **Đây là bài dài nhất lát, nhưng lại KHÔNG có tầng Anh nào ở commit đã ghim** — nên tôi dịch chỉ từ Pāli và `triangulation` chỉ 7.0. Đã kiểm: `source/upstream-manifest.json` (tầng `english-sujato`, 4291 tệp) không có mục nào chứa `mil4`; thư mục cache `en/sujato/sutta/kn/` có đúng 9 thư mục con (`cp dhp iti ja kp snp thag thig ud`) và **không có** `mil`. Đây là giới hạn của bản chụp upstream — Milindapañha không có bản Anh Sujato trong bilara — chứ không phải thiếu sót của kho. Cùng lý do, `mil4.5` (đã có trên đĩa) cũng `draft`.

  **Bốn khoá thân bài phải đọc liền nhau.** `:1.2` mở ngoặc kép và đến `:1.5` mới đóng — giữ đúng cấu trúc trích dẫn xuyên bài của SuttaCentral (`:1.1` có một cặp `“…”` riêng quanh lời *sādhū*, nên cân trên cả bài). `idha` ở đầu `:1.3` là *Ở đây*, tôi lồng vào câu *Mười đức tính ấy là gì, bạch Đại vương:* — không dịch riêng thành một từ đứng dính.

  **Đếm đúng MƯỜI, không rút thành chín.** Pāli nói `dasā` (số mười) ở `:1.2`, rồi liệt kê bốn mục ở `:1.3`, bảy mục ở `:1.4` — **4 + 7 = 11**? Không: `:1.3` có `saṅghena samānasukhadukkho`, `dhammādhipateyyo`, `yathābalaṁ saṁvibhāgarato`, `jinasāsanaparihāni … vāyamati` = **4**; `:1.4` có `sammādiṭṭhiko`, `apagatakotūhalamaṅgaliko` (gộp với `jīvitahetupi … uddisati` thành một mục vì chúng chung một vế), `kāyikavācasikañcassa rakkhitaṁ`, `samaggārāmo … samaggarato`, `anusūyako`, `na ca kuhanavasena sāsane carati`, `buddhaṁ/dhammaṁ/saṅghaṁ saraṇaṁ goto` = **6**, cộng `…` thành 10. Vì danh sách chữ bị lược bởi công thức, tôi giữ nguyên **văn bản Pāli theo từng vế** và chỉ ghép ba cụm quy y nơi vào một mệnh đề, không tự cắt hay thêm mục. Người biên tập nên đối chiếu lại với bản in Milindapañha nếu muốn chốt cách chia mục.

  **Bổ ý cho ba chữ lặp, và đó là lý do điểm kỹ thuật còn 9.6 chứ không phải 10.** Tôi tự quét MỌI khoá của lát (không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm): đúng 10/10 khoá của bài này, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá (bài này Pāli không có dấu lược nào, bản Việt cũng không), ngoặc kép cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte. Tôi **không** chạy `npm run validate|test|check|build` (đợt này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6.

  **Chuyên chú ý: `samaggārāmo` là động từ, không phải danh từ `ārama`.** `āramā` ở đây nghĩa là *nương tựa vào, ham thích*, và nó đi với `samaggarato` (*ham thích sự đồng thuận*) — nếu dịch *tựa vào tu viện* thì biến một phẩm chất thành một chỗ ở. Tôi dịch *ưa sự đồng thuận, hoan hỷ sự nhất trí*, giữ hai vế như Pāli. Cùng lý do, `na ca kuhanavasena sāsane carati` là *không đi trong giáo pháp bằng phương tiện lừa dối* — `kuhanā` là lừa dối, `hsa` là phương tiện; không phải *không đi trong giáo pháp một cách gian dối*.

  **Thuật ngữ, đếm được.** `upāsakaguṇavagga` → *Phẩm Đức Tính Người Cư Sĩ* và `Upāsakaguṇa` → *6. Đức Tính Của Vị Cư Sĩ* (tiền lệ chính xác: `mil4.5:0.3` và `mil4.5:0.4` cho `Upāsakaguṇavagga` / `Ācariyaguṇa`; cùng công thức, tôi làm nối). `Meṇḍakapañhārambhakathā` → *Lời Dẫn Nhập Cho Các Câu Hỏi Hóc Búa* (`mil4.5:0.2`). `Milindapañha` giữ nguyên. `niṭṭhitā` → *đã hoàn tất* (**0 tiền lệ** cho `niṭṭhitā` trong tầng; tôi theo đúng cách *đã hoàn tất* đã dùng 42 lần, và `thig1.18:3.1` *Bộ Một Bài Kinh đã hoàn tất* cho `Ekakanipāto niṭṭhito`). `sādhū` → *Lành thay* (151 chỗ). `mahārāja` → *Đại vương* (739 chỗ). `sammādiṭṭhi` → *chánh kiến* (44 chỗ). `anusūyako` → *cung kính lễ phép* (`snp2.9:2.1`). `saṁvibhāgarato` → *hoan hỷ chia sẻ từng phần* (`an3.79:5.4` *hoan hỷ chia sẻ*). `yathābalaṁ` → *tùy sức mình*. `jina` → *bậc Chiến Thắng* (`mil4.5:2.2` *Đấng Chiến Thắng*). `dhammādhipateyyo` → *lấy Pháp làm chủ tể* (`dn26:5.2` và `an5.133:2.1` dùng *làm quyền chủ* cho cùng ý). `apagatakotūhalamaṅgaliko` → *đã đoạn tận sự tò mò hổi hợt* (**0 tiền lệ**, đặt mới; giữ đủ ba lớp nghĩa: `apagata` đã đi, `kotūhala` tò mò, `maṅgala` đi lại lang thang). `jinasāsanaparihāni` → *sự suy tàn của giáo pháp bậc Chiến Thắng* (**0 tiền lệ**, đặt mới). `abhivaḍḍhi` → *tăng cường* (**0 tiền lệ**, đặt mới).

  **Còn một điểm cần người biên tập cân, đã ghi chứ không giấu:** `katame dasa, idha, mahārāja, upāsako` — tôi dịch *Mười đức tính ấy là gì, bạch Đại vương: vị cư sĩ…*, tức lấy `upāsako` làm chủ thể của cả danh sách. Cách này khớp với `mil4.5:2.2` (tương tự), nhưng Pāli cũng cho đọc *mười đức tính ấy của một vị cư sĩ là gì*. Tôi chọn cách khớp tiền lệ của chính chương.
  **Những lỗi bản đầu tôi tự bắt khi đọc đối kháng (đã sửa hết, ghi lại để người đọc scorecard biết điều gì đã qua):** `1.3` bản đầu dịch `saṁvibhāgarato` thành *chia sẻ phần phân* — *phần phân* không phải tiếng Việt và làm mất nghĩa *phần chia* của `saṁvibhāga`; sửa thành *hoan hỷ chia sẻ từng phần*.
