notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ja332. Đối chiếu văn cảnh tích truyện Jātaka và chú giải Atthakathā để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại. Bảo toàn niêm luật kệ ngôn, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ. Toàn bộ 21 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC. Sửa lan 2026-10-13: khoá 1.3 «Tâu Đại vương» → «Tâu đại vương» (viết thường theo đa số trong ja*: 277 chỗ so với 4); khoá 3.1–3.4 và 4.1–4.4 dùng lại bản Việt của ja452:9.1–10.4 (Pāli trùng nguyên văn tám vế; chỉ khác nháy: ja332 không mở nháy ở 3.1 và đóng ở 4.4). Trước → sau: 3.1 «ham ngũ dục biếng nhác chẳng tốt» → «hưởng dục mà lười biếng thì không tốt»; 3.2 «chẳng thu thúc giới hạnh chẳng lành» → «không tự chế thì không tốt»; 3.3 «xử sự thiếu suy xét chín chắn chẳng hay» → «hành động thiếu suy xét thì không tốt»; 3.4 «kẻ xưng là trí thức mà hay phẫn nộ cũng chẳng tốt lành» → «bậc trí mà hay phẫn nộ, điều ấy không tốt» («xưng là» là thêm nghĩa); 4.1 → «Bậc Sát-đế-lợi nên suy xét rồi mới hành động,» (giữ Sát-đế-lợi: đo trên ja* có 90 khoá Sát-đế-lợi + 7 Sát-đế-lỵ so với 1 «quân vương»); 4.2 «tâu đấng chúa tể muôn dân, chớ hành động hấp tấp khinh suất» → «chớ hành động khi chưa suy xét, hỡi chúa tể các phương» (disampati = chúa tể các phương, không phải «muôn dân»; «hấp tấp khinh suất» là thêm nghĩa); 4.3 → «với người hành động có suy xét, tâu đại vương,»; 4.4 «danh thơm và tiếng tăm của vị ấy sẽ không ngừng tăng trưởng» → «danh xưng và tiếng tăm tăng trưởng» (vaḍḍhatī là hiện tại; «sẽ không ngừng» thêm nghĩa). Các khoá 1.1–2.4 đã đọc đối chiếu Pāli và giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
