  SỐ PĀLI, TỰ TÍNH. satasahassa = sata 100 x sahassa 1.000 = 100.000: 1.3 (Ito satasahassamhi: cách đây một trăm ngàn kiếp, dùng lại nguyên văn tiền lệ), 21.1 (Satasahassito kappe trong lời thọ ký về Đức Gotama: sau một trăm ngàn kiếp nữa, vì Pāli ở đây là tương lai) và 45.1 (Satasahasse kataṁ kammaṁ: nghiệp đã làm cách đây một trăm ngàn kiếp, dùng lại nguyên văn tiền lệ). sattāhaṁ = 7 ngày (12.3, 18.4); sattavassiko = bảy tuổi (25.4); bārasavassikaṁ = mười hai năm (36.4); tīṇi sīsāni = ba cái sọ (37.2); catūhi vesārajjehi = bốn sự tự tin (5.1 đến 5.2); catasso paṭisambhidā = bốn vô ngại giải (48.1); pañcavīsatimaṁ = pañca 5 + vīsati 20 = hai mươi lăm (29.1, Phần tụng đọc thứ hai mươi lăm, theo tiền lệ Vīsatimaṁ bhāṇavāraṁ = Phần tụng đọc thứ hai mươi); catutthaṁ = thứ tư (50.1). Bài này không có cụm Tiṁsakappasahassa; tiṁsa = 30 chỉ liên quan nếu gặp, ở đây không có phép tính nào cần đến nó.

  NĂM PHÉP KIỂM, MỖI PHÉP IN MẪU SỐ. (1) Tập khoá: Việt 193 = Pāli 193, thừa 0, thiếu 0, thứ tự y hệt Pāli. (2) Nháy kép và nháy đơn khớp Pāli từng khoá: đếm từng ký tự ‘ ’ “ ” ở cả 193 khoá, lệch 0/193 khoá. Nhịp nháy chạy qua khoá là cố ý của Pāli (nháy đơn mở ở 35.4 nhưng 'kiñci sippan'ti' ở 36.1 không có dấu đóng; nháy đơn mở ở 37.1 và chỉ đóng ở 37.4) và được giữ y hệt. (3) Pāli trùng nguyên văn TRONG CHÍNH bài: 3 nhóm, Sabbavedavidū jāto (10.3, 26.1), Nipacca sirasā pāde (13.1, 34.1, 35.1) và …pe… (46.2, 47.2, 48.2); cả 3 nhóm bản Việt giống nhau, lệch 0. (4) Dấu lược: Pāli có 3 khoá …pe…, Việt 3 khoá đúng một …, lệch 0; không có khoá (…) trần và không có khoá … nào Pāli không có. (5) Số Pāli: xem mục trên. Phụ: NFC 193/193; khoá rỗng 0; khoảng trắng thừa 0; từ Pāli lọt sang Việt ngoài tên riêng 0 (chỉ còn Therāpadāna ở 0.1, Bhaddiya ở 0.2, Padumuttara, Haṁsavatī, Okkāka, Gotama, Vaṅga, Vaṅgīsa, Rājagaha, Sāriputta và kaṇikāra).

  TIÊU ĐỀ. 0.3 = Ký Sự Về Trưởng Lão Vaṅgīsa và translationTitle BẰNG ĐÚNG giá trị đó. Số thứ tự: Pāli 0.3 là Vaṅgīsattheraapadāna, không bắt đầu bằng chữ số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số; bài không thuộc nhóm THỪA). Phe dịch apadāna ở phạm vi gần nhất (tha-ap530 đến tha-ap565): Ký Sự Về Trưởng Lão 23 tệp không số (thêm 6 tệp có số theo Pāli), Bài Kệ Tuyên Ngợ 2; toàn tầng tha-ap: Bài Kệ Tuyên Ngợ 165, Ký Sự Về Trưởng Lão 111, Bài Kệ Tuyên Ngôn 100 (tính theo bốn chữ đầu của 0.3). Hai phạm vi cho hai đa số khác nhau và Tuyên Ngợ là sai chính tả theo brief; theo phạm vi gần nhất và bài cùng phẩm dùng Ký Sự Về. 0.1 giữ Therāpadāna (536 khoá của tầng). 0.2 Bhaddiyavagga dịch Phẩm Bhaddiya, khớp 9/9 tiền lệ. 50.1 dùng Ký Sự Về Trưởng Lão Vaṅgīsa, thứ tư, theo 0.3.

