  DÙNG LẠI NGUYÊN VĂN. Dò toàn tầng kn đã có (2.229 bài đối chiếu): 57 khoá Pāli của bài này có Pāli trùng nguyên văn ở bài khác, tổng 6.157 cặp Pāli trùng đã dò; 4.619 cặp bản Việt trùng chữ với bản của bài này, 1.538 cặp khác (phần lớn khác ở ngôi kể ta/tôi hoặc là biến thể diễn đạt). 47/57 khoá dùng lại nguyên văn một bản đã có (0.1, 0.2, 1.1, 1.2, 1.3, 1.4, 2.4, 8.2, 8.4, 10.1, 10.2, 13.1, 19.2, 19.3, 20.1, 21.1, 21.2, 21.3, 21.4, 22.1, 22.2, 22.4, 23.1, 23.2, 24.1, 24.2, 24.3, 25.1, 25.2, 30.1, 34.1, 35.1, 43.4, 44.4, 45.1 đến 45.4, 46.1 đến 46.3, 47.1 đến 47.3, 48.1 đến 48.3); 10 khoá khác có chủ ý: 3.2, 3.3, 3.4 (viết lại để dòng 3.1 đến 3.2 đọc liền mạch, và 3.3 viết hoa chữ đầu vế thứ ba theo Pāli), 12.4 (ngôi kể ta đổi thành tôi theo bài), 13.3 (giữ thứ tự của Pāli), 17.1, 18.1 (thêm dấu phẩy), 20.2 (ngươi thay cho con, vì Đức Phật nói với người sẽ được thọ ký), 24.4 (ta đổi thành tôi), 25.4 (đa số tầng viết lên bảy tuổi kể từ khi sinh ra). Số cặp Pāli trùng trong chính bài mà Việt khác: 0. Ngôi kể: người kể xưng tôi suốt bài, theo đa số bài liền kề cùng lát.

  BẤT ĐỊNH, KHÔNG BỊA, KHÔNG ĐƯA VÀO THÂN KINH. (1) 16.3 santānaṁ: đọc là của các bậc an tịnh (santa); có thể là dạng rút gọn của sattānaṁ (chúng sinh), nhưng Pāli ghim chỉ có santānaṁ nên dịch sát, không tự sửa. (2) 17.3 đến 17.4 avocaṁ ... gatiṁ pappomi: câu không có nháy; dịch nội dung mong cầu là tôi sẽ đạt đến cảnh giới của vị tỳ-kheo; gati dịch cảnh giới, khác với ṭhāna (vị trí) ở 19.3; chưa xác lập được nghĩa chính xác, cần biên tập phán. (3) 31.2 đến 31.4: mamanucchavaṁ dịch điều thích hợp với mình; nicitaṁ dịch chất thành đống, cittaṁ dịch muôn màu (tính từ của gāthāpadaṁ); câu chia qua ba khoá nên chưa chắc chắn cấu trúc. (4) 30.4 nidakkhitaṁ: hình thái hiếm, dịch chỉ nhìn xuống một tầm cày theo ngữ cảnh (yugamatta = một tầm cày) và tiền lệ yugamattaṁ pekkhamāno; không thêm. (5) 34.2 ‘pabbājehī’ti maṁ bravi: bravi là ngôi ba, nhưng chủ ngữ theo ngữ cảnh là Vaṅgīsa đang xin xuất gia; giữ nghĩa theo ngữ cảnh, quote chỉ gồm pabbājehi, không đưa tôi vào trong nháy. (6) 35.4 và 36.1: câu hỏi của Đức Phật bị chia qua hai khoá và dấu nháy đóng ở 35.4 dù câu chưa hết; giữ cách chia và nháy của Pāli, nên 36.1 bắt đầu chữ thường. (7) 36.6 vācaya và 37.4 avācayiṁ: dịch làm cho nó nói và làm cho nói lên; nghĩa kỹ thuật (đọc ra cảnh giới tái sinh) không rõ, không thêm. (8) 36.5 vijjāvisesena dịch bằng tri thức đặc biệt; vijjā có thể là thuật hay chú, không giải thích trong thân kinh. (9) 37.1 đến 37.4: nháy đơn mở ở 37.1 và đóng ở 37.4 theo Pāli. (10) 39.3 kabbavittosi: dịch nhà làm thơ; kabbavitta hiếm, nghĩa chính xác chưa xác lập. (11) 40.3 đến 40.4: pana (hay) và dấu hỏi là bổ sung ngữ pháp, ṭhānaso dịch ngay tại chỗ (cũng có thể là tùy theo sự việc); nhất quán ở 41.2, 41.4, 42.3. (12) 43.2 đến 43.3 aññesamatimaññahaṁ pesale tena saṁviggo: đọc atimaññahaṁ là khinh thường (không dịch là vượt trội như bản Việt nguyên bài đã dùng), pesale là những vị hiền thiện, saṁviggo dịch xúc động; chưa đối chiếu được nguồn độc lập nào cho cách đọc này, đây là chỗ khó nhất bài, cần biên tập phán. (13) 26.2 visārado dịch tinh thông ở đây (vādasattha) trong khi 5.4 và 8.4 dịch tự tin ở nghĩa Đức Phật; vādasattha dịch các luận thư về tranh luận. (14) 4.1 anurañjanto dịch làm rạng rỡ (không có tân ngữ trong Pāli). (15) 6.1 Āsabhaṁ ṭhānaṁ dịch vị thế ngưu vương cao quý, buddhabhūmi dịch địa vị Phật theo tiền lệ. (16) 10.4 và 27.2: vāgīso và vacane issaro dịch cùng một cách, chúa tể lời nói. (17) 25.3 paccājāto dịch đã tái sinh theo tiền lệ; lặp ý với jāto ở 25.2 là của Pāli.

  SỬA BẢN NHÁP ĐÃ BẮT. (a) Bản nháp đầu để 39.1 không có dấu phẩy cuối khoá như Pāli; đã sửa. (b) Bản nháp đầu viết 36.1 là nghề nào không với dấu hỏi, đọc lệch vì câu hỏi bị Pāli chia qua hai khoá; đổi thành một nghề nào chăng. (c) Bản nháp đầu viết 25.4 là bảy tuổi kể từ lúc sinh, thiếu so với đa số tầng cho cùng Pāli (lên bảy tuổi kể từ khi sinh ra); đã sửa. (d) Bản nháp đầu đặt 20.4 không có dấu phẩy sau khi thọ hưởng; đã sửa để tách gerund khỏi anappakaṁ. Không có lỗi cổng nào được bắt vì không được chạy cổng.

