  BẤT ĐỊNH:
  (1) `Ubhinnaṁ devarājūnaṁ, / saṅgāmo samupaṭṭhito; / Ahosi samupabyūḷho, / mahāghoso avattatha.`
      (1.1–1.4) — `Ubhinnaṁ` = *hai bên*, `samupaṭṭhita` = *phát sinh*, `samupabyūḷha` = *bùng lên dữ dội*,
      `mahāghoso` = *tiếng reo lớn*, `avattatha` = *lắng xuống*. Tôi dịch theo nghĩa chữ nghĩa; không có
      tiền lệ cho cụm này.
  (2) `nikkhittakavacāvudhā;` (3.2) — đọc `kavacāvudha` = *giáp giáo và vũ khí*, `nikkhitta` = *đã cởi bỏ*,
      nên *cởi bỏ giáp giáo cùng vũ khí;* Chi tiết này **không có** trong Pāli và không có tiền lệ; tôi nêu
      đúng hai từ có trong Pāli, không thêm chi tiết nào.
  (3) `Paduṭṭhacitto manujo, / ekapāṇaṁ viheṭhayaṁ;` (5.1–5.2) — `manujo` = *người*, `ekapāṇa` = *một
      điều luật*, `viheṭhaya` = *phá bỏ*. Tôi dịch *Có người tâm ý ô nhiễm, / đã phá bỏ giới luật một lần;*
      `ekapāṇa` chỉ xuất hiện đúng một lần trong toàn Pāli đã ghim nên nghĩa chắc chắn không có bên thứ hai
      để đối chiếu.
  (4) `Saṅgāmasīse nāgova` (6.1) — cùng cấu trúc `Nāgo saṅgāmasīseva` của thag1.31:1.3 (bản Việt đã có:
      *Hãy như voi giữa trận đánh*) nên tôi dịch *Như voi giữa trận chiến,* — dùng `nāgo` = **voi**, không
      phải rắn, vì `nāgova` ở đây đứng sau `saṅgāmasīse` (tại trận chiến) và thag dùng cùng hình ảnh voi.
  (5) `Mahādundubhināmā ca, / soḷasāsuṁ rathesabhā;` (10.1–10.2) — `rathesabhā` = *chiến xa đệ nhất* (1
      tiền lệ, ja306:4.4), `Mahādundubhināmā` = *theo tiếng trống lớn*. Cụm này nối mơ hồ với `9.3–9.4`
      (một trăm nghìn kiếp không đọa xứ) rồi tới `10.3–10.4` (ba mươi ngàn kiếp, vua Chuyển luân); tôi giữ
      đúng vế và không nối từ nào thêm.
  (6) `Saraṇañca upāgacchuṁ, / lokajeṭṭhaṁ sutādinaṁ.` (7.3–7.4) — tôi dịch *rồi cũng quy y nương tựa, /
      bậc Trưởng Thượng thế gian, bậc đã nghe pháp ấy.* `sutādina` là *đã nghe*, không có tiền lệ; tôi không
      nêu rõ "pháp" là mạch nào của bài vì Pāli khoá này không nói.

