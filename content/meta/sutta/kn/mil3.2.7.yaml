  ngoặc kép cân trên cả bài, không có `(…)`.

  COVERAGE — ĐO LẠI BẰNG ĐÚNG QUY TẮC CỦA KHO (`source/layers.yaml`:
  substantivePaliMinChars 40, excludeReferenceBlock, floor 0,8). Bài này có 6–8 khoá
  Pāli có nội dung và **0 trong số đó mang chữ Anh**, tỉ lệ 0% < 0,8. Vì vậy nếu bài
  muốn lên `review`/`published` thì PHẢI có mục trong
  `content/meta/reference-gaps.yaml` — đợt này tôi không được sửa tệp đó, nên đây là
  blocker thứ hai bên cạnh việc thiếu hẳn tầng Anh.

  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của
  bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho Milindapañha.
  Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho. Vì vậy
  `triangulation` của sáu bài mil3 trong lát này chỉ là **Pāli + các bài song song
  trong chính tầng này + menu SuttaCentral** (xem mục thuật ngữ bên dưới).

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC, KHÔNG ĐOÁN. `“Kallosi, bhante nāgasenā”ti.`
  → *“Khéo lắm, thưa tôn giả Nāgasenā.”* là **25/25** bài mil3 đã có; `TIEN_LE_PHAI.md`
  cũng ghi cặp `mil3.5.6:2.1 == mil3.6.6:2.1`. `Opammaṁ karohī` 6 bài: 3 bài *Hãy xét
  một thí dụ* (đa số), 2 bài *Hãy nêu một ví dụ*, 1 bài *Hãy đưa một ví dụ* → tôi theo
  đa số. `Āma` 5 bài → *Vâng*. `Na hi, bhante` **0 tiền lệ**; tôi dùng *Không phải vậy*
  theo 31 bài đã có `No hetaṁ, bhante` → *Không phải vậy*. `Rājā āha—` **đang chia
  12 `Vua nói:` / 10 `Vua nói—`**; tôi theo đa số `Vua nói:` và ghi lại đây vì tầng
  đang lệch. Lưu ý khi chấm cặp: chuỗi `“Xin hãy xét một thí dụ”ti.` của tôi **khác** `“Hãy
  xét một thí dụ”.` của 3 bài kia chỉ ở chữ *"Xin"*; `ti.` bị rơi ở bản kia. Cùng nguyên
  văn đã có, nên tôi giữ `ti.` cho đúng với `”ti.` mà Pāli mang. Tên phẩm: `Mahāvagga` → *Đại Phẩm* · `Buddhavagga` → *Phẩm Đức Phật* ·
  `Sativagga` → *Phẩm Chánh Niệm* · `Arūpadhammavavatthānavagga` → *Phẩm Xác Định Pháp
  Vô Sắc* (đều có 1–6 tiền lệ). `bojjhaṅga` → *giác chi* (358 khoá Pāli, và
  `content/glossary/pali-vi.yaml` ghi `preferred: "giác chi"`).

  THUẬT NGỮ ĐẶT MỚI. `Addhānavagga` **0 tiền lệ trong toàn tầng** → *Phẩm Khoảng Thời
  Gian*, theo tiêu đề tiếng Anh của chính SuttaCentral cho phẩm này (*The Expanse of
  Time*, `suttacentral.net/api/menu/mil-addhanavagga`) và theo quy ước *Phẩm X* của 5 phẩm
  mil3 đã có. **`mil3.2.1`–`mil3.2.9` chưa bài nào được dịch**, nên lát sau gặp cùng tên
  phải theo đúng chữ này. `Therapaṭisandahanāpaṭisandahanapañha` **0 tiền lệ** → *Câu
  hỏi về việc tái sinh của vị trưởng lão*. Đọc `paṭisandhā` ở đây là **tái sinh**: thân
  `1.3` dùng `paṭisandahissāmi` ngay cạnh `bhavissāmi` ("còn chấp thủ thì tôi sẽ tái
  sinh"), và SuttaCentral cũng dịch tiêu đề là *The Question on the Rebirth of Nāgasena*.
  Tôi giữ `Thera` → *vị trưởng lão* thay vì thay bằng *Nāgasena* như SuttaCentral, vì
  Pāli là authority. `upādāna` → *chấp thủ* (577 chỗ trong tầng, **0** chỗ *chấp thọ*).
  `adhikāra` → *quyền hành* · `pañcahi kāmaguṇehi` → *năm món dục* · `yuttakārī` → *kẻ
  xử sự đúng đạo* · `paṭikaroti` (trong `na me rājā kiñci paṭikarotī`) → *cho*.

  Giải quyết draft 2026-10-12 (Claude Sonnet 5.5, Claude Code). Mục này THAY các câu cũ
  về "đợt này tôi không được sửa tệp reference-gaps" và về coverage; phần còn lại của
  notes cũ giữ làm lịch sử.

  BLOCKER. (A) Thiếu bản Anh Sujato tại commit đã ghim — GIỮ NGUYÊN, đó là sự thật về
  upstream. (B) Blocker "Coverage English dưới ngưỡng 0,8 … reference-gaps.yaml chưa có
  mục" — ĐÃ GỠ: không phải lỗi văn bản, mà là hệ quả trực tiếp của (A) (không có tầng
  Anh nên 0/6 khoá Pāli có nội dung mang chữ Anh); mất mát được ghi nhận ở
  reference-gaps do công cụ của kho sinh, không do tác giả bản dịch tự đặt. Toàn bài
  đã được đọc lại đối kháng từ Pāli, không còn đoạn nào phải dựa vào English. (C) Tầng
  Việt hiện hành vắng (bilara chỉ có Pháp Cú) — giới hạn tham chiếu, không phải lỗi
  văn bản; `triangulation` giữ 8,0 (tối đa khi thiếu bản Anh độc lập).

  SỬA (8/14 khoá đổi: 0.3, 1.2, 1.3, 2.2, 2.3, 2.4, 2.6, 4.1; trong đó lỗi nghĩa thật ở 1.3, 2.2, 2.3, 2.6, 0.3, 4.1):
  - `1.3`, `2.6` — **thiếu `alaṁ`**: thêm "Thôi đi". `paṭikacceva akkhātaṁ` là "đã nói
    **trước**" (nhắc đúng lời ở `mil3.1.6:1.8`, cùng câu), bản cũ dịch "nói thẳng" là
    sai. `kiṁ te tena pucchitena` → "ngài hỏi điều ấy để làm gì". Gỡ dấu cách thừa
    trước dấu chấm (`’ .”` → `’.”`). Ở `2.6` Pāli không có "mahārāja" trong ngoặc đơn
    nên bỏ "này Đại vương" khỏi lời trích (bản cũ chép nhầm từ `1.3`).
  - `1.2` — `tvaṁ` do vua nói với tôn giả: "ngươi" thay bằng "ngài" (cùng cặp
    `mil3.1.6:1.7`, dịch "ngài"); bỏ "nữa" không có trong Pāli.
  - `2.2` — **`rañño adhikāraṁ kareyya` là người ấy làm việc/nhiệm vụ cho vua**, không phải
    "được vua ban quyền hành" (bản cũ đảo chủ thể–người nhận, vì `kareyya` là động từ
    của người ấy). Sửa theo cùng công thức ở `mil3.3.9:2.2`: "làm nhiệm vụ cho vua".
  - `2.3` — `paricareyya` ở đây (đi với `pañcahi kāmaguṇehi samappito samaṅgibhūto`) là
    **vui hưởng**, không phải "hầu hạ" (bản cũ sai nghĩa; công thức này trong tầng dịch
    "được cung cấp đầy đủ … vui hưởng", ví dụ `an10.99:7.2`, `dn1:3.20.2`).
    `kāmaguṇa` → "năm dục lạc" (22 khoá, so với "năm món dục" 1 khoá). `samappito
    samaṅgibhūto` → "được cung cấp đầy đủ và sở hữu", bỏ "thừa hưởng … trọn vẹn".
    **`na me rājā kiñci paṭikaroti`** → "vua chẳng **đền đáp** cho tôi điều gì" (bản cũ
    "không ban cho tôi" đảo ý: người ấy đã được ban rồi, và kẻ nói vua "không làm gì
    đáp lại" mới là kẻ vô ơn, nên mới không `yuttakārī`). Dời chữ "thì" lạc ở cuối
    khoá sang đầu `2.4` để câu điều kiện nối đúng ranh khoá.
  - `2.4` — "thưa Đại vương" → "này Đại vương" (Nāgasena nói; cùng cách ở `1.3`);
    `yuttakārī` → "người hành xử đúng đắn" (bản cũ "kẻ xử sự đúng đạo" thêm sắc "đạo"
    không có trong Pāli); bỏ dấu chấm thừa sau `?”`.
  - `0.3`, `4.1` — **tiêu đề thiếu một vế**: `Therapaṭisandahanāpaṭisandahanapañha` là
    thera + paṭisandahanā + **a**paṭisandahana (a + a → ā), tức "tái sinh **hay không tái
    sinh**" của vị trưởng lão; bản cũ chỉ dịch "tái sinh". Cũng đúng với nội dung bài
    (`sace saupādāno … paṭisandahissāmi, sace anupādāno … na paṭisandahissāmi`). Bỏ dấu
    chấm cuối `0.3` (Pāli không có). `translationTitle` đã khớp.

  Giữ nguyên: `2.1` "Xin hãy xét một thí dụ" (đa số tầng: "Xin hãy xét một thí dụ" áp đảo các cách dịch
  `Opammaṁ karohī` khác), `2.5` "Không phải vậy, thưa tôn giả" (tiền lệ dày), `3.1` "Khéo lắm …
  Nāgasenā" (25/25 bài mil3), `0.2` "Phẩm Khoảng Thời Gian" (7/9 bài trong phẩm; `mil3.2.4` ghi
  "Phẩm Thời Gian", `mil3.2.5` ghi "Phẩm Thời Gian Dài" — lệch ngoài lát, đề nghị
  thống nhất về "Phẩm Khoảng Thời Gian").

  BẤT ĐỊNH CÒN LẠI. `adhikāra` được dùng hai nghĩa liền nhau (người làm "nhiệm vụ/phục
  vụ" cho vua; vua "ban" một `adhikāra` đáp lại). "Chức vụ" theo công thức song song
  `mil3.3.9:2.2`; ngoại diên có thể là "đặc ân/quyền được trao" — không đổi nghĩa lập luận
  của thí dụ, nên không phải blocker nhưng hạ `semantic_fidelity` và
  `ambiguity_integrity`. Không có bản Anh hay Việt hiện hành độc lập để đối chiếu.

