notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Pāli mở nháy ở 1.4 rồi đóng ở 1.10 nên bản Việt giữ đúng như vậy, các khoá 1.5-1.9 nằm trong cặp nháy đó nên không thêm nháy riêng; cân trên cả bài.

  Tiền lệ có đếm và dùng lại: Anumānapañha → Câu hỏi về suy luận (5); Nippapañcavagga → Phẩm Năm Điều Đã Vứt Bỏ (5, y hệt mil6.2.10 trong cùng phẩm); kaṭhina → gối trúc theo mil6.2.10; paṭipīḷita → bị che phủ, theo cùng hệ với sự che phủ đã dùng ở mil6.2.10:2.1; acchariya → kỳ diệu và abbhuta → lạ lùng theo glossary; Katame cattāro → Thế nào là bốn, theo đếm trên toàn tầng: Thế nào là bốn 131 lần, Là bốn nào 44 lần, các cách khác rải rác; bản nháp đầu là Bốn thứ ấy là gì, đã sửa theo đa số dù câu hỏi hơi lạ khi đứng một mình.

  Bốn bệnh của mặt trời phải phân biệt được thì câu 1.10 mới có nghĩa, nên abbha, mahikā, megho, rāhu lần lượt dịch là mây che kín, mây dày, mây mưa, Rāhu. Rāhu giữ nguyên tên Pāli vì đây là danh xưng con yêu gây nhật thực, có 216 tiền lệ trong tầng; nhật thực chỉ có 3 nên không dùng. 0 tiền lệ, đặt mới: abbha → mây che kín, mahikā → mây dày (mây mưa có 16 nên megho mới dùng); mandaṁ tapati → chỉ nắng nhạt, đặt để đối xứng với thiêu gối trúc mà vẫn tự nhiên trong tiếng Việt.

  Giữ đúng cả hai vế: 1.1 hỏi có thiêu nhẹ lúc nào không, 1.2 đáp là không có lúc nào; 1.3 lặp lại câu hỏi kèm vì điều gì; 1.4 nói có bốn bệnh nhưng cắt ngang, 1.5 hỏi bốn thứ ấy là gì, 1.6-1.9 lần lượt kể, 1.10 chốt lại đủ bốn. Không gộp 1.4 với 1.10.

