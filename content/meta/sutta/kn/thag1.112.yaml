notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Mỗi bài là MỘT bài
  kệ bốn vế của Theragāthā, không có phần lược trong thân kệ. Tôi ghi đủ 4 khoá tiêu đề +
  4 vế + 1 dòng kết lược mỗi bài, đúng segment ID, không thêm khoá nào.

  **Dòng kết lược — tôi GIỮ HAI DẤU LƯỢC, không mở rộng.** BRIEF_VI3 §10.1 nói *Pāli có dấu
  lược thì bản Việt không bao giờ mở rộng*, và lý do nêu ở đó là mở rộng là *thêm chữ không đánh
  dấu*. Đo trên đĩa: **10 bản** mở rộng thành *Bạch Thế Tôn, Tôn giả Trưởng lão X đã từng nói bài
  kệ này* (thag1.42, thig1.4, thig1.5, thig1.6, thig1.10, thig1.12, thig1.13, thig1.14, thig1.15,
  thig1.16) và **5 bản** giữ lược (thag2.35, thag6.2, thig1.7, thig1.8, thig1.9). 10:5 nghiêng về
  mở rộng, nhưng đó là quyết định của agent trước và đã xuất bản; §10.1 là chính sách mới nhất
  được giao cho lát này nên tôi theo §10.1, và ghi lại đây để người biên tập đảo chiều được
  trong một chỗ nếu họ chọn phía kia. Cả hai cách đều giữ **đúng 2 dấu lược** như Pāli.

  **Thứ tự khoá tiêu đề: tôi theo PĀLI, và 12 bản thag đã publish có lệch.** Pāli đặt `0.3` =
  tên phẩm (`Dvādasamavagga`) và `0.4` = tên bài kệ (`Vacchagottattheragāthā`). **12 bản thag trên
  đĩa** (thag1.2–1.10, thag1.14, thag2.1, thag2.2) đặt **ngược**: `0.3` = tên bài kệ, `0.4` =
  tên phẩm. **4 bản** đặt đúng như Pāli (thag1.1, thag1.42, thag2.35, thag6.2). Tôi theo Pāli —
  lệch này là lỗi căn chỉnh segment, không phải lựa chọn văn phong — và **không** sửa 12 bản kia
  (ngoài lát của tôi). Người biên tập nên xử lý riêng.

  **`0.1` giữ số hiệu bài.** Pāli ghi `Theragāthā 1.112`. 4 bản thag giữ số (thag1.1, thag1.42,
  thag2.35, thag6.2), 12 bản bỏ số. Tôi giữ vì đó là nội dung có thật trong khoá đó. (Hai bản
  *Therīgāthā* ở thag1.1 và thag2.35 ghi sai chữ — Pāli là `Theragāthā`.)

  **Không đối chiếu được tầng Việt hiện hành.** Tại commit đã ghim, `translation/vi/` của bilara
  chỉ chứa Pháp Cú, nên Theragāthā không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của
  bản chụp upstream, không phải thiếu sót của kho; vì thế `triangulation` là Pāli + English Sujato.

  **Tầng Anh: 8/9 khoá có tiếng Anh Sujato, khoá trống đúng một khoá là dòng kết lược.** Đo được
  bằng công thức của chính kho (`englishCoverageFor`): mọi khoá Pāli của 12 bài này đều **ngắn hơn
  40 ký tự**, nên `substantiveSegments = 0` và `ratio = 1` theo định nghĩa sẵn có — tức **không**
  rơi vào ngưỡng 80% và **không** cần entry trong `content/meta/reference-gaps.yaml`. Sujato để
  trống duy nhất `:1.5` (`… <Tên> thero ….`), cũng là dòng kết lược. Tôi không coi ô English trống
  đó là sự đồng thuận: ở khoá đó tôi dựa vào Pāli + tiền lệ 5 bản thag/thig giữ lược.

  **Thuật ngữ, đếm được.** `Tevijjo` → *bậc thông tam-minh* (thig5.11:5.6 *chúng con thông tam-minh*;
  kho còn có *bậc có Ba Thông Giải* 6 lần ở mn71/mn73, *bậc tam minh* 4 lần ở sn8.9/sn8.12 — tôi
  chọn vế của tạng kinh, gần thơ ca hơn). `jhāyī` → *thiền giả* (sn4.23:12.2). `cetosamatha` →
  *sự an định của tâm* (43 bản, kể cả an4.12:8.1; chỉ 2 bản viết *vắng lặng của tâm*). `kovid` →
  *thông hiểu*. `Sadattho me anuppatto` → *Mục đích chân chính của tôi đã chứng đạt* (dn27:7.8 và
  dn27:31.1 dịch `anuppattasadattho` là *mục đích chân chính đã đạt*; dn29/mn76 dùng *đạt mục đích
  của mình*; an3.37 dùng *mục đích tối thượng* — tôi ghép *chân chính* của dn27 với `me` =
  *của tôi*). `kataṁ buddhassa sāsanan` → *đã làm tròn lời dạy của Đức Phật* (giữ nguyên cụm *lời
  dạy của Đức Phật* đã có ở sn8.12:5.4 và thig5.11; `sāsana` + tiểu tục *đã làm tròn* để ra *fulfilled*
  chứ không ra *đã học xong*).

  **Bất định đã ghi.** `mahājhāyī` là *bậc thuyền giả lớn* theo nghĩa đen (`mahā` + `jhāyī`), Sujato đọc
  *I am a great meditator*; tôi giữ *vị thiền giả lớn* vì không bỏ mất `mahā`. `Tevijjohaṁ` là ngôi
  thứ nhất (*Tôi là…*), Sujato cũng vậy — nhưng vế sau `Sadattho me anuppatto` là thứ nhất sở hữu,
  nên bài kệ pha ngôi; tôi giữ nguyên pha ngôi ấy của Pāli.

  **Kiểm kỹ thuật.** `save_vi` chạy sạch cả hai lần (idempotent, tệp trên đĩa không đổi). Tự kiểm
  các cờ tương đương review đối kháng: đủ 9/9 khoá mỗi bài; đúng segment ID; thứ tự khoá y hệt Pāli;
  không khoá rỗng; mọi chuỗi đã NFC; số dấu lược bằng Pāli ở **mọi** khoá (kể cả dòng kết:
  2 = 2); ngoặc kép mở ở `:1.1` và đóng ở `:1.4`, cân trên cả bài; không có chữ nào ngoài chữ viết
  Latin (tên riêng Pāli như `Mahānāma`, `Kuṇḍadhāna` dùng đúng dấu); không còn `(…)` ở khoá nào.
  Tôi **không** chạy `npm run validate|test|check|build` (đợt này cấm; người điều phối chạy tập trung),
  nên `technical_integrity` chấm **9.6** chứ không phải 10.0.

  **Danh xưng giữ nguyên dạng Pāli** (Vacchagotta, Vanavaccha, Adhimutta, Mahānāma, Pārāpariya,
  Yasa, Kimbila, Vajjiputta, Mahāvaccha, Kuṇḍadhāna, Dāsaka, Nesādaka): danh xưng tôn thánh và tên
  địa danh, không bịa tên Việt — đúng cách toàn bộ thag/thig đã làm.
