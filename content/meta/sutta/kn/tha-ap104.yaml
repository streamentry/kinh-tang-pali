  **Pāli trùng nguyên văn ở bài khác: 17 khoá, dùng lại nguyên văn 15.**
  Toàn tầng đã dò **152.959** segment, **97.528** chuỗi Pāli có bản dịch, trong đó
  **7.721** chuỗi Pāli trùng mà tầng đang có nhiều hơn một cách Việt.

  **Hai chỗ CỐ Ý không dùng lại nguyên văn**:
  - `4.2 yaṁ kammamakariṁ tadā;` — trùng **39** segment nhưng **11** cách Việt
    (thiên về *làm thiện nghiệp* 11, *làm việc* 7, *tạo nghiệp* 3 …). Tôi chọn
    *khi ta đã làm nghiệp ấy* vì `kamma` ở đây là **nghiệp**, và nó khớp với
    `4.4` (*quả báo*) — giữ đúng quan hệ nhân quả của cặp kệ.
  - `7.1` lời-kết chú giải — xem mục riêng bên dưới.

  **Cặp kệ đáng chú ý: bài này kể chính vị trưởng lão đang nói.** `4.1–4.2` nói
  *94 kiếp trước, khi ta đã làm nghiệp ấy*; `5.1` lại nói *73 kiếp trước, có mười
  sáu vị tối thượng trong loài người … Chuyển Luân Vương*. Hai mốc kiếp khác nhau
  là của **hai người khác nhau** trong bài kể (vị trưởng lão và một vị vua anh
  hùng trước đó) — tôi **không** gộp và **không** thêm chữ nào để “làm cho trôi”.

  **Thuật ngữ, đếm được:** `Therāpadāna` giữ nguyên **352** vs *Trưởng Lão Ký Sự*
  **9**. `Bhikkhadāyivagga` (trùng 4 khoá, đều là bài `tha-ap` trong cùng phẩm):
  *Phẩm Bhikkhadāyi* **3** vs *Phẩm Người Cho Thức Ăn* **1**; toàn tầng grep
  `Phẩm Bhikkhadāyi` **4** vs `Phẩm Người Cho Thức Ăn` **1**. Cả hai phép đo ra
  *Phẩm Bhikkhadāyi*, và nó khớp với khuôn *Phẩm <tên Pāli>* đang dùng cho
  `Bhikkhadāyaka`. `Paṭisambhidā catasso` → *Bốn vô ngại giải* **361**;
  `Sattaratanasampannā` → *Đầy đủ bảy món báu quý giá* **17**;
  `cakkavattī mahabbalā` (số nhiều, vì `5.2` là mười sáu vị) → *là các Chuyển
  Luân Vương có đại oai lực* **14**; `Catunnavutito kappe` → *Vào chín mươi tư
  kiếp trước đây* **30**; `Duggatiṁ nābhijānāmi` → *Tôi không còn biết đến đọa
  xứ nào* **60**. `Obhāsentaṁ disā sabbā` → *Ngài tỏa sáng khắp mọi phương trời*
  **3**; `Rathiyaṁ paṭipajjantaṁ` → *Khi Ngài đang bước đi trên đường phố* **6**;
  `paggahetvāna añjaliṁ` → *chắp tay cung kính hướng về Ngài* (dùng lại nguyên văn
  `tha-ap53:2.2`); `Pasannacitto sumano` → *Với tâm tịnh tín hân hoan* **37**;
  `siddhatthassa` → *Đức Thành Tựu* (tiền lệ `tha-ap226:1.1` → *bậc Thành Tựu*);
  `khattiya` → *Sát-đế-lợi* / *Sát-đế-lợi* thì hai bản gần như ngang nhau
  (grep toàn tầng: **156** vs **157**), tôi ghi con số cả hai và theo tiền lệ sát
  nhất trong `tha-ap` (*có vị Sát-đế-lợi tên Sumedha*).

  **Bốn từ chỉ xuất hiện MỘT lần trong toàn bộ Pāli root đã ghim — tôi ghi lại
  vì không có tiền lệ để đối chiếu, và tôi không bịa nghĩa để lấp:**
  - `Nisabhājāniyaṁ yathā` → *xứng đáng so sánh với núi vàng ròng*. Cùng dạng Pāli
    có 3 tiền lệ (`tha-ap99:2.2`, `tha-ap285:1.2`, `tha-ap324:1.2`) nhưng cả ba bản
    dịch đều sai nghĩa (ví dụ *như con bò mộng dòng dõi cao quý*), nên tôi dịch lại
    theo cấu túc `nisabhā` + `-jāniya` = *xứng đáng được so với một khối vàng*.
  - `Tidhāpabhinnaṁ mātaṅgaṁ` → *màu vàng ròng chia làm ba*. Song song gần nhất
    `tha-ap123:2.3` và `tha-ap321:4.3` viết `Tidhāpabhinnamātaṅgaṁ` trong ẩn dụ
    *sư tử / vua báo*, nên `tidhā-pabhinna` là *chia ba phần*, không phải *ba tia*.
  - `uḷurāja` → *một con voi vua* (hapax; chỉ dịch nghĩa *đầy tràn* của
    `pūritaṁ` theo mối `2.1 Ngài tỏa sáng khắp mọi phương trời`).
  - `apassaha` → *không gì sánh bằng* (hapax; đi với `lokajeṭṭha` mà tầng dịch
    *bậc Trưởng Thượng thế gian*).

  **Lời-kết `7.1` — giữ nguyên bản có sẵn, và nói rõ vì sao.** Pāli
  `Itthaṁ sudaṁ āyasmā ñāṇasaññiko thero imā gāthāyo abhāsitthāti` trùng nguyên
  văn **1** segment khác (`tha-ap130:8.1`) nhưng bản đó dùng wording (B)
  *Bạch Thế Tôn, Tôn giả Trưởng lão … đã từng nói bài kệ này* — bỏ mất `sudaṁ`,
  thêm xưng hô không có trong Pāli, và làm số nhiều `imā gāthāyo` thành số ít. Tôi
  **không** nhân bản lỗi đã biết, và cũng **không** sửa `tha-ap130` vì ngoài lát
  của tôi. Người điều phò nhiễn một lượt cho cả nhóm công thức này.

  **Vì sao `draft`.** Không phải vì chất lượng câu dịch: blocker là **tệp Anh
  đã ghim không tồn tại**, mà `scripts/validate.ts` đẩy thành `error` khi status là
  `review` hay `published`. Hai blocker cũ trong tệp này đã được xử lý: (1) thiếu
  segment — nay đủ **28/28** khoá; (2) thiếu ghi nhận gap — nay đã có entry trong
  `content/meta/reference-gaps.yaml`.

  **Cổng kỹ thuật chưa chạy** — lát này bị cấm `git` và cấm `npm run
  validate|test|check|build`, nên tôi **không** tuyên bố technical gate pass.
  Bốn lệnh còn lại: `npm run validate` · `npm test` · `npm run check` ·
  `npm run build`. Phần tôi tự kiểm được: JSON hợp lệ, mọi chuỗi NFC, khoá trùng
  đúng UID và thuộc Pāli gốc, thứ tự khoá khớp Pāli, 0 orphan, ngoặc kép và nháy
  đơn khớp Pāli từng khoá, dấu lược khớp từng khoá.

  **Giải quyết draft 2026-10-12** (đọc đối kháng toàn bài từ Pāli root; thay thế
  các mục cũ nói về bốn từ "hapax", về "hai mốc kiếp của hai người khác nhau" và
  về việc bản dịch `nisabhājāniya` ở các bài khác "đều sai").
  - **Khoá đổi: 11/28** — sai nghĩa thật **5** (`1.1`, `1.2`, `1.3`, `2.2`, `2.4`),
    chỉnh nhẹ **6** (`1.4`, `3.1`, `3.4`, `4.2`, `4.4`; tiêu đề `0.3`/`8.1`, nên
    `translationTitle` đổi theo). Còn 17 khoá giữ nguyên.
  - `1.1`: *"Lên Đức Phật…"* là chữ hỏng (lan 7 khoá trong tầng); `sambuddhaṁ` là
    đối cách, đối tượng của `apassahaṁ` ở `2.4` → *"Bậc Chánh Đẳng Giác màu vàng ròng"*.
  - `1.2`: *"xứng đáng so sánh với núi vàng ròng"* là bịa (không có `núi`, không có
    `xứng đáng`): `nisabha` = bò mộng, `ājāniya` = thuần chủng → *"như con bò mộng
    thuần chủng"*. Tôi đã ghi sai ở mục cũ rằng dạng này ở bài khác "đều sai".
  - `1.3`: *"màu vàng ròng chia làm ba"* là sai: `tidhāpabhinna` = chảy dịch ở ba
    nơi (dịch ở thái dương/mắt/chỗ kín của voi đang hăng), `mātaṅga` = voi. Tiền lệ
    `Tidhāpabhinnā mātaṅgā` → *Voi chảy dịch ở ba nơi* (3 khoá) → *"như con voi
    chảy dịch ở ba nơi"*; `1.1`–`1.4` là các vế so sánh cùng chỉ Đức Phật.
  - `1.4`: *"một con voi lớn"* làm rơi `mahesinaṁ` (đại ẩn sĩ, đồng vị với
    `sambuddhaṁ`) → *"bậc Đại Ẩn Sĩ như một con voi"*.
  - `2.2`: *"một con voi vua"* sai: `uḷu` = sao, `uḷurāja` = vua của các vì sao =
    **mặt trăng**; `pūrita` = tròn đầy. Một khoá khác trong tầng (`Uḷurājaṁva
    pūritaṁ`) đã dịch *"vầng trăng tròn đầy"* → *"tựa như vầng trăng tròn đầy"*.
  - `2.4`: `apassahaṁ` **không** phải hapax mà là sandhi `apassiṁ + ahaṁ` = *"tôi
    đã thấy"*; *"không gì sánh bằng"* là bịa. Động từ chính của cả hai kệ `1`–`2` ở
    đây → *"tôi đã thấy bậc Trưởng Thượng thế gian"* (`lokajeṭṭha` giữ khuôn
    *Trưởng Thượng thế gian*, 10+ tiền lệ).
  - `3.1`/`4.4`: `ñāṇa` = **trí tuệ**, không phải *tri thức*. Đo trên tầng: `ñāṇa`
    → *trí* 404, *trí tuệ* 164, *tri thức* 10 → đổi. `4.4`: khuôn
    `-saññāyidaṁ phalaṁ` → *quả báo của niệm tưởng về …* (đa số trong tầng); bỏ
    *"bằng … ấy"* không có trong Pāli.
  - `3.4`: `Siddhattha` là tên Đức Phật thời 94 kiếp trước (khớp `4.1`), không phải
    *"Thành Tựu"* → *"tôi đã đảnh lễ Đức Siddhattha"* (động từ `abhivādayiṁ` ở thì
    quá khứ ngôi thứ nhất).
  - `4.2`: *"ta"* → *"tôi"* cho nhất quán một người nói (`2.4`, `3`, `4.3`).
  - `0.3`/`8.1`: *"Bài Kệ Tuyên Ngợ"* là chữ hỏng (254 tiêu đề trong tầng), và
    `Apadāna` = *Ký sự*; dạng *Ký Sự Về Trưởng Lão …* có 160 tiêu đề và là dạng
    của `tha-ap130` cho cùng tên trưởng lão → đổi theo.
  - **Mục cũ sai về `5.1`–`5.4`**: `94 kiếp` (nghiệp `4.1`–`4.2`) và `73 kiếp`
    (mười sáu Chuyển Luân Vương) là **cùng một người** kể về các đời của mình —
    công thức quen thuộc của Apadāna, không phải hai người khác nhau. Bản dịch không
    đổi vì không thêm chữ nào.
  - **Blocker đã gỡ:** (B) coverage Sujato dưới ngưỡng (mẫu số 1, Sujato phủ 0/1;
    khoá duy nhất là `7.1`; Sujato không có tệp nào cho bài này nên khoản này
    cùng gốc với blocker (A), và entry gap đã có trong `reference-gaps.yaml`) và (C)
    `vietnamese-current` chỉ có Pháp Cú (giới hạn tham chiếu, không phải lỗi văn
    bản). **Blocker giữ:** (A) Sujato không có bài này tại commit đã ghim.
  - **Bất định còn lại.** `7.1`: công thức `Itthaṁ sudaṁ …` = *"Như vậy, …"*; bản
    *"Tôi nghe như vầy"* là quy ước đã chạy trong tầng (557 khoá so với 3 khoá dùng
    *"Như vậy"*) và không đổi nghĩa trọng yếu, nên giữ để nhất quán, không sửa lẻ
    một bài. `3.2` *"cung kính hướng về Ngài"* thêm sắc thái so với `paggahetvāna
    añjaliṁ` (đưa tay chắp lên), giữ theo tiền lệ `tha-ap53:2.2`. `4.3` *"không còn
    … nào"* và `5.4` *"đại oai lực"* cũng theo tiền lệ. `triangulation` 7,5 vì ba
    tầng tham khảo đều vắng; các đoạn ở đây chỉ dựa Pāli root và tiền lệ tầng.
  - Cổng kỹ thuật chưa chạy (`technical_integrity` 9,6): `npm run validate` ·
    `npm test` · `npm run check` · `npm run build`.
