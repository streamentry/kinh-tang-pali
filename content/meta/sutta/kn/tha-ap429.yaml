notes: |-
  Dịch trực tiếp từ Pāli root vì tầng tham khảo tiếng Anh của Sujato không phủ tha-ap tại commit đã ghim; ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng cho uid này.
  Tiêu đề: `0.3` Pāli bắt đầu bằng số (`7 Ekadhammassavaniyattheraapadāna`) nên giữ số thứ tự theo hình thức `N. `, và `translationTitle` bằng đúng giá trị `0.3`. Công thức tên bài theo các bài liền kề trong cùng phẩm (tha-ap427, 428, 431, 432 dùng `Bài Kệ Tuyên Ngôn Về Trưởng Lão`; tha-ap423, 426 dùng `Ký Sự Về`): đo ở phạm vi gần nhất 4 Tuyên Ngôn so với 2 Ký Sự; toàn tầng 231 Tuyên Ngôn, 199 Ký Sự Về, 475 dạng chính tả Tuyên Ngợ (sai chính tả) và 20 dạng Tuyên Ngợi. Dạng Tuyên Ngợ không được dùng.
  Tên trưởng lão `Ekadhammassavaniya` giữ nguyên chữ Pāli theo tiền lệ thag1.67 (Ekadhammasavanīya, giữ Pāli ở cả đầu đề lẫn lời kết); không dịch thành `Nghe Một Pháp` vì đó là suy diễn về nghĩa tên riêng.
  Số Pāli: `Tiṁsakappasahassāni` = tiṁsa 30 × sahassa 1000 → ba mươi nghìn kiếp (30.000). BẤT ĐỊNH ghi rõ: hướng dẫn chung của phẩm từng ghi tiṁsa = 3 ("ba nghìn kiếp") còn phép đo ở tầng cho tiṁsa = 30 (Pāli `tiṁsa` là ba mươi; các khoá cùng tầng có `Aṭṭhatālīsa` = 48 và `Cattālīsa` = 40 theo cấu tạo thập phân), nên bài này dịch ba mươi nghìn kiếp theo phép đo; ba bài đã có trong tầng cũng dùng đúng dạng `Trong ba mươi nghìn kiếp`. Cách đọc khác (ba nghìn kiếp, hay ba trăm nghìn kiếp) chưa được loại trừ bằng nguồn độc lập vì tầng Anh đã ghim không có bản nào cho cụm này; cần người biên tập phân xử. `Ekapaññāsakkhattuñca` = 51 lần (eka 1 + paññāsa 50; khớp tha-ap45:12.3); `Ekavīsatikkhattuñca` = 21 lần (eka 1 + vīsati 20; khớp tha-ap14:11.1 hai mươi mốt kiếp). `Satasahassito` = 100.000 → một trăm ngàn. `Jātiyā sattavassena` = bảy tuổi. `Tāvatiṁsa` = Ba mươi ba.
  Lỗi số ở tiền lệ cần người biên tập xem lại (báo, không sửa ở ngoài lát): tha-ap428:6.1 `Ekapaññāsakkhattuñca` đang dịch là `Lại thêm năm mươi lần nữa` (Pāli là năm mươi mốt lần) và tha-ap19:6.1 `Ekavīsatikkhattuñca` đang dịch là `Hơn nữa, hai mươi lần nữa` (Pāli là hai mươi mốt lần).
  Dùng lại nguyên văn: 42/82 khoá có Pāli trùng ở tầng (đã dò 5.594 cặp), trong đó 36 khoá dùng lại đúng một bản dịch tiền lệ — `:0.1` (460 chỗ) · `:0.2` (6 chỗ) · `:1.1` Đức Chiến Thắng tên Padumuttara (7/8) · `:1.2` (5/8) · `:3.4` (cp27) · `:7.2` · `:8.1`–`:8.4` · `:9.1` · `:9.2` · `:9.3` · `:9.4` · `:10.2`–`:10.4` · `:12.2` · `:13.1`–`:13.4` (tha-ap21) · `:14.3` (tha-ap490) · `:14.4` · `:15.2` · `:15.1` Đủ bảy tuổi (thag7.3) · `:16.1` (19/28 là đại kiếp) · `:16.3` (138 chỗ) · `:17.1` · `:17.3` · `:18.1` · `:18.3` · `:19.1` · `:19.3`. Sáu khoá có tiền lệ nhưng khác có chủ ý: `:1.3` (tiền lệ duy nhất `Tỏ ra bốn sự thật`; chọn `Giảng giải` vì `pakāsento` là chỉ rõ, giảng giải), `:2.2` (tiền lệ cp17 mở đầu bằng `khi ta` vì Pāli có `yadā`, ở đây Pāli không có), `:10.1` (tiền lệ `Hơn nữa, hai mươi lần nữa` sai số, xem trên), `:11.1` (tiền lệ vv15 `Tôi`, đổi sang `Ta` để thống nhất đại từ cả bài), `:12.4` (tiền lệ `bèn tuyên ngợ về vô thường` sai chính tả và thêm `bèn`), `:16.2` (tiền lệ `khi ta niệm tưởng về pháp ấy` dịch `asuṇiṁ` là niệm tưởng, trái với nghĩa nghe).
  Đại từ: dùng `ta` xuyên suốt cho ngôi thứ nhất (ahaṁ); tiền lệ tầng không đồng nhất (`tôi` và `ta` đều có; ví dụ `cakkavattī ahosahaṁ` 8 chỗ `tôi` so với 3 chỗ `ta`), nên chọn theo thống nhất trong bài và theo các khoá cùng Pāli đa số dùng `ta` (`Ta không biết mình rơi vào khổ đau` 138 chỗ, `Các phiền não của ta` 94 chỗ).
  Trùng nguyên văn trong chính bài: 4 nhóm (14.4 với 15.2; 15.4 với 16.4; 17.2, 18.2, 19.2; 18.3 với 19.3), Việt đều giống nhau trừ dấu kết (nháy đóng ở 19.3 theo Pāli) — 0 cặp mà nội dung Việt khác.
  Dấu lược: ba khoá `:17.2`, `:18.2`, `:19.2` Pāli là `…pe…`, cả ba giữ đúng một `…`, không mở rộng; Pāli không có `(…)` trần ở khoá nào nên Việt không có. Nháy: Pāli mở `“` ở `:1.1` và đóng `”` ở `:19.3`; nháy đơn mở `‘` ở `:13.1` và đóng `’` ở `:13.4`; bản Việt khớp Pāli từng khoá (82/82). Thẻ `<b>` ở `:15.1` của Pāli không đưa sang bản Việt.
  Lời kết `Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti` dịch `đã nói những bài kệ này` (nhóm số nhiều, 79 chỗ ở lát liền kề, khớp `imā gāthāyo`), không dùng nhóm `bài kệ này` số ít.
  Bất định ghi, không che (không đưa vào thân kinh): (1) `4.1` `Udake vokkamitvāna` — `vokkamitvāna` là rời khỏi, chệch khỏi; `udake` là định vị cách nên có thể hiểu là rời khỏi nơi có nước, hoặc chệch hướng khi ở trên nước; bản dịch giữ sát chữ `Rời khỏi nước` và chưa gán thêm chi tiết. (2) `4.4` `iriyāpathavikopanaṁ` dịch là sự làm xáo trộn oai nghi (iriyāpatha = oai nghi theo tiền lệ ps3.5). (3) `5.2` `appevatthaṁ` hiểu là `appeva` + `atthaṁ`; `attha` dịch là nguyên do, cũng có thể là ý nghĩa hay lợi ích. (4) `5.4` Pāli `saddamassosi` là dạng ngôi ba, nhưng chủ ngữ mạch kệ là `ahaṁ`; dịch ngôi nhất (có khả năng là `assosiṁ` bị viết thiếu). (5) `12.1` `Pitugehe` không nói rõ cha của ai; dịch sát là `nhà của cha` và không thêm đại từ. (6) `12.3` `Kathaṁsa` hiểu là `kathaṁ` cộng đại từ; dịch là bài nói ấy. (7) `16.2` `yaṁ dhammamasuṇiṁ tadā` là mệnh đề quan hệ; dịch `pháp mà ta đã nghe khi ấy` và để `16.3` làm mệnh đề chính. (8) `11.5` `koṭi` dịch là điểm tận cùng, nối với `11.6` Niết-bàn, cảnh giới bất hoại (accutaṁ padaṁ, tiền lệ thig5.7 `cảnh giới bất hoại`). (9) `15.3` đã thêm `ta` làm tân ngữ của `upasampādayī` (Pāli không có đại từ).
  Hiệu chuẩn Pāli: 82/82 khoá khớp tập khoá và thứ tự; NFC đạt; không khoá rỗng; không Pāli lọt vào bản Việt ngoài `0.1` và `0.2` (tiêu đề vagga giữ chữ Pāli theo tiền lệ).
