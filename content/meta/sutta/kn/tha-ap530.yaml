notes: |-
  Dịch trọn 106 khoá trực tiếp từ Pāli root; không có bản Anh của Sujato, không có lớp english-project và không có bản Việt hiện hành cho tha-ap530 tại commit đã ghim. Đối chiếu thuật ngữ và công thức với các Ký Sự cùng phẩm và các bài tha-ap liền kề (tha-ap520 đến tha-ap531).
  Tiền lệ đã đo: các vế điệp khúc dùng lại nguyên văn theo bản đã có trong phẩm (Rơi khỏi cõi trời 8/8; Các phiền não của ta đã được thiêu rụi 100/144; Thật lành thay sự đến của ta 95/139; Bốn vô ngại giải 487/500; đã làm tròn lời dạy của Đức Phật 111/140; Bệnh cùi, nhọt, và bạch biến 2/2). Ngôi kể dùng ta theo đa số gần nhất (tha-ap526 và tha-ap531), khác tha-ap529 dùng tôi. Lời kết 27.1 dùng nhóm nói những bài kệ này (số nhiều, theo imā gāthāyo). Tên phẩm Tiṇadāyakavagga dùng Phẩm Cỏ Dâng Cúng, cùng tha-ap524 và tha-ap529; các dạng khác trong tầng gồm Phẩm Cúng Dường Cỏ 2, Phẩm Bậc Cho Cỏ 2, Phẩm Tiṇadāyaka 1.
  :0.3 trong Pāli không có số thứ tự đầu tên nên bản Việt không thêm số; translationTitle bằng đúng giá trị :0.3. Tên bài dịch từ Bodhisammajjaka (bodhi cùng sammajjaka, người quét dọn) theo tiền lệ Vīthisammajjaka là Quét Dọn Đường Đi; bồ-đề viết Bồ-đề theo đa số trong tầng (Bồ-đề hoặc bồ-đề 58 lần so với Bồ Đề 1 lần ở tha-ap).
  Dấu lược: ba khoá …pe… (24.2, 25.2, 26.2) giữ đúng một …; không có (…) trần trong Pāli của bài này. Dấu ngoặc kép mở ở 1.1 và đóng ở 26.3, khớp Pāli từng khoá; không có nháy đơn. Đối chiếu 106 khoá với Pāli: đủ khoá, đúng thứ tự, 0 lệch nháy, 0 lệch dấu lược, NFC sạch. Có 4 nhóm Pāli trùng nguyên văn trong chính bài (54 cặp): vế quả báo vipāko pattachaḍḍite (7 khoá), Aparampi guṇaṁ tassa (6 khoá), nibbattati bhavābhave (6 khoá) và …pe… (3 khoá); cả 4 nhóm đều có bản Việt giống hệt nhau, 0 cặp lệch.
  Số Pāli: vīsatīguṇe và vīsataṅgehi là 20 (vīsati 20), dịch hai mươi; duve là 2, dịch hai (hai cõi hữu, hai dòng tộc). Không có cụm số lớn nào cần phân xử (không có tiṁsakappasahassa).
  Bất định và lựa chọn cần người biên tập lưu ý: (1) guṇa ở 1.4, 10.1 đến 15.1 và 22.2 dịch phẩm chất vì trong bài nó chỉ cả lợi ích (dung sắc, sức khỏe, của cải, tuổi thọ) lẫn thành tựu tu chứng, không hẹp thành đức hạnh; aṅga ở 23.3 dịch chi phần, hai chữ không cùng gốc nên không ép đồng nhất. (2) tassa ở 8.1, 10.1 đến 15.1, 16.2 dịch người ấy, bám đại từ ngôi ba của Pāli, dù cùng một người với ta ở các khổ khác. (3) āgame ở 22.1 dịch kinh điển theo nghĩa thường của āgama; nếu chú giải hiểu là sự chứng đạt thì cần sửa, tầng hiện có không có tiền lệ cho dạng này. (4) tilakā ở 9.2 dịch nốt ruồi, piḷakā dịch mụn; nghĩa chính xác của tilaka (nốt ruồi hay tàn nhang) chưa có chứng cứ phân xử trong tầng. (5) ārohapariṇāhavā ở 4.2 dịch có đủ chiều cao và vòng thân, giữ sát hai danh từ, không thêm cân đối. (6) bhavehaṁ ở 18.4 hiểu là bhaveyyaṁ (ngôi thứ nhất, cách ước định), dịch ta sẽ là như thế. (7) Vế bodhiṁ ở 21.2 hiểu là cội bồ-đề của bậc Đạo Sư, bám ngữ cảnh. (8) Dấu hỏi ở 21.4 là lựa chọn biên tập cho kiểu hỏi tu từ của kiṁ nāma, Pāli kết bằng dấu chấm.
  Kiểm kỹ thuật chưa chạy trong lượt này: npm run validate, npm test, npm run check và npm run build; vì vậy technical_integrity đặt 9.6 và không tuyên bố technical gate đã pass.
