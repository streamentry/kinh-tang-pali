notes: |-
  **ĐỌC TOÀN BỘ Pāli TRƯỚC KHI VIẾT.** 36 khoá, in lại cặp Pāli↔Việt sau khi ghi.

    **TẦNG THAM KHẢO — 0/2 khoá có Anh Sujato** ⇒ `draft`, `triangulation` 7.5.

    **DÙNG LẠI NGUYÊN VĂN 12/14 KHOÁ PĦI TRÙNG.** `Mahānubhāvo tevijjo,` → Có đại uy lực, đạt tam
    minh, (1); `Himavantaṁ` (tầng đã dùng `Himavanta`); `matthake okiriṁ ahaṁ` → ta đã rải lên
    đỉnh đầu Ngài. (1, ở `tha-ap371`); `Khāribhāraṁ gahetvāna,` → Gánh mang đồ vật trên vai,
    (1); `Pubbakammaṁ saritvāna,` → Nhớ lại nghiệp quá khứ, (1); `tattha kālaṅkato ahaṁ.` →
    ngay tại nơi ấy tôi đã mệnh chung. (3); `Ekattiṁse ito kappe,` → Từ ba mươi mốt kiếp trước,
    (13); `yaṁ pupphamabhiropayiṁ;` → khi ta dâng cúng hoa ấy; (7, chỉ khác đại từ);
    `pupphapūjāyidaṁ phalaṁ.` → đó là quả báu của việc cúng dường hoa. (3);
    `Paṭisambhidā catasso,` (287); `…pe…` (406); `kataṁ buddhassa sāsanaṁ”.` (257);
    `Itthaṁ sudaṁ …` (374/376).

    **2 KHOÁ LỆCH ĐA SỒ.**
    (a) `pakkāmiṁ pācināmukho.` (`:4.4`) — tiền lệ duy nhất cho đúng câu này là *cúi mình đảnh lễ
        Đấng Thiện Thệ.* (1). Cách đó thêm **đảnh lễ**, không có trong Pāli (`pakkāmi` = cất bước
        ra đi; `pācina` = hướng nam). Cùng công thức `pakkāmi …-mukho` ở tha-ap được dịch đúng
        *cất bước hướng về phương bắc* (tha-ap110/318/333) và *quay mặt hướng bắc* (tha-ap357),
        nên tôi dịch **ta quay mặt hướng nam cất bước đi.** theo mẫu chuẩn của chính công thức ấy.
    (b) `Ālokite ca vīrena,` (`:4.3`) — xem mục bất định bên dưới.

    **TÊN PHẨM.** `Timiravagga` có 7 bài đã dịch: *Phẩm Timira* 4 (tha-ap84, 85, 87, 91),
    *Phẩm Hoa Timira* 3 (tha-ap88, 89, 90). Tôi lấy **đa số 4/7**: *Phẩm Timira*.

    **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
    · `Pakkhijāto` (`:3.1`) — đã tra **toàn bộ** Pāli đã ghim (5.764 tệp): cụm `…akkhijāta` chỉ
        xuất hiện **đúng 2 lần**, ở `tha-ap69:1.1` và `tha-ap86:3.1`, không có ở đâu khác, nên không
        có tầng nào để tra. Có thể là *sinh ra trong vòng mười bốn ngày* (gốc `pakkhin`), cũng có
        thể là *sinh ra từ trứng*. Tôi **không dịch từ đoán** — chỉ dịch `viyākāse` là *giữa bầu
        trời,* và ghi bất định ở đây. Cần người biên tập xác nhận, rồi sửa **cùng một lượt** với
        `tha-ap69:1.1`.
    · `Ālokite ca vīrena,` (`:4.3`) — `ālokita` = được chiếu sáng, `vīreṇa` có thể là *ánh sáng
        rực rỡ* (danh từ `vīra` = oai lực) hoặc *kẻ nam tử*. Trong câu kệ này nó đứng sau `Ālokite
        ca` nên tôi đọc là tính ngữ *rực rỡ* và dịch **Bừng sáng rực rỡ,**. Bản nháp đầu tiên của
        tôi thêm *khí thơm lan tỏa* — đó là chữ không có nguồn, đã **xoá**.
    · `Vasāmi appamaññāsu,` / `iddhīsu ca tadā vasī` (`:2.3–2.4`) — `vasāmi` = ta làm chủ,
        `appamañña` = không gì sánh bằng, `iddhi` = thần thông. Tôi dịch *Ta làm chủ không ai
        sánh bằng, / khi ấy làm chủ cả các thần thông.* Chủ ngữ `idthis` là số nhiều, nên vế
        sau có `cả các`. 0 tiền lệ cho cụm này.
    · `Abhibhū` (`:1.1`) — tên riêng đã có 4 nơi trong tầng (`an` và `mn`: đệ tử đôi Abhibhū và
        Sambhava), nên tôi giữ Pāli. `sikhino` (`:1.2`) = của Đấng Chinh Phục (tức Đức Phật, vì
        `sikhin` là danh từ riêng của Đức Phật trong các bản kinh sau); tầng hay dịch `Siṅghi`
        là *Đức Sikhī*, nhưng ở đây là dạng sở hữu nên tôi dùng *Đấng Chinh Phục* để không lẫn
        với vị Đức Phật Sikhī của `tha-ap`.
    · `Adhopupphaṁ` (`:3.3`) — *hoa chưa chính*; cũng là gốc của tên `Adhopupphiya`. Giữ nghĩa
        chính xác, không dịch *hoa héo*.

    **DẤU LƯỢC.** `:8.2` là `…pe…` → **đúng một** `…`.

    **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:8.3`. Tự đếm lại: cân.

