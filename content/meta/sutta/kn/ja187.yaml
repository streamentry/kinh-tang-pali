  Rouse, không phải tên riêng); các khoá khác khớp; bất định chú giải liệt kê bốn mặt (thân, dòng,
  giọng, giới); bản Việt không liệt kê để khỏi thêm nghĩa.

  Rà từng chữ bằng DPD 2026-10-16: 13 khoá đã rà; sửa 2.1 (`suvaṇṇo suvaṇṇena`: DPD suvaṇṇa 1
  "beautiful; of good appearance", chú giải CST `suvaṇṇo ti sundaravaṇṇo, suvaṇṇenā ti dutiyena
  haṁsapotakena`, Indacanda "loài có cánh đẹp" → "kẻ sắc đẹp bàn với kẻ sắc đẹp"; giải quyết bất định
  cũ), 2.3 (`kiṁ te ettha`: bản cũ bỏ `te` ngôi hai, Indacanda "ngươi" → "việc này can gì đến ngươi,
