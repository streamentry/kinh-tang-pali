  Lượt hoàn thiện 2026-10-17: thống nhất thuật ngữ: đã rà, không có khoá cần sửa (`mantayati` "bàn/bàn bạc" ở 1.2, 1.3, 2.2; `jambuka` "chó rừng"); tên bài 0.4/3.1 giữ "Catumaṭṭha" trong khi 2.3 dịch "kẻ trong sạch bốn mặt" (có lý do: tên bài là tên gọi truyện; nay ghi thành chú thích để người biên tập quyết theo C1); thêm 5 chú thích (0.4 tên bài và nghĩa `catumaṭṭha`; 1.1 ai nói với ai theo chú giải; 1.4 "vua của loài thú" là chó rừng tự xưng; 2.1 `suvaṇṇa` "sắc đẹp", "trời với trời"; 2.3 bốn mặt và lời khen mỉa). Các câu sau trong ghi chú cũ đã bị thay: "`triangulation` là Pāli + English Sujato" (sai: commit đã ghim không có bản Anh Sujato cho bài này); "đúng 9/9" khoá và đoạn về `ja67:1.4` và `Yaṁ … nissitā` (không thuộc bài này; bài có 13 khoá); "`Ekakanipāta` → Bộ Một Bài Kinh", "`Dukanipāta` → Phẩm Hai Pháp/Bộ Hai Bài Kinh", "Phẩm Asadi/Phẩm Bất Đối Đẳng" (nay "Nhóm Hai Kệ" theo C3, "Phẩm Vô Song" theo B21); dòng kết "không dấu phẩy" (nay có dấu phẩy theo C2); mục "Vì sao `draft` chứ không phải `review`" và điểm 8.69 (waiver `no-upstream-english` đã áp, bài nay ở `review`; điểm hiện hành xem `quality`); "Kinh Bốn Điều", "`suvaṇṇa` → vàng", "`mantaye` → thờ phụng", "Còn với ngươi, thì cái bốn điều ấy là gì" và "`2.3` dịch Ở đó, Catumaṭṭha có việc gì" (đã thay ở các lượt 2026-10-14 và 2026-10-16); bất định (1) `suvaṇṇo`, (2) `catumaṭṭha`, (4) người nói ở lượt 2026-10-14 (đã phân xử bằng chú giải ở các lượt 2026-10-16).
