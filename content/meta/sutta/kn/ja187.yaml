notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ dưới 40 ký tự). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép mở ở `1.1` và đóng ở `:2.1` (hoặc `1.4`), nên cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Jātaka` giữ nguyên (129 chỗ). `Ekakanipāta` → *Bộ Một Bài Kinh*. Dòng niết `<X>jātakaṁ <số>` → *Kinh <X> thứ <số>.* theo đa số trên đĩa (71 chỗ không dấu phẩy so với 24 có). Tên riêng giữ nguyên dạng Pāli ở cả `:0.4` và dòng niết — cùng cách *Kinh Paṇṇikajātaka*, *Kinh Udañcanījātaka*, *Kinh Sālittakajātaka*, *Kinh Parosata* đã có.

  **Ngoặc kép ở khoá cuối.** Pāli `ja67:1.4` là `Yato sodariyamānayeti.` — mở `“` ở `1.1` mà **không** có `”ti` đóng. Tôi đóng `”` ở `1.4` (không có `ti`, vì Pāli không có), đúng cách `ja115:1.4` đã làm cho đúng trường hợp này. Các bài Jātaka còn lại trong lát có `”ti` ở vế cuối nên tôi giữ `”ti`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có 26 chương Pháp Cú), nên `triangulation` là Pāli + English Sujato.
  **Đây là bài khó nhất của lát, và tôi nói thẳng là chưa phân xử xong.** Bốn câu `1.1`–`1.4` (`Ucce viṭabhi māruyha, / mantayavho rahogatā; / Nīce oruyha mantavho, / migarājāpi sossati.`) không có tầng Anh nào ở commit đã ghim, không có bản Việt hiện hành, và tôi đã dò **toàn bộ** corpus Pāli đã ghim tìm parallel: không có. `mantayavho` tôi xác minh được bằng `ja504:3.2` (*Kimidhaṭṭhitā mantayavho abhiṇhaṁ* — cũng là `vho` khách ngữ, nghĩa *các ngươi cứ nói*), và `rahogatā` bằng `ja547:267.2` / `278.2` (*… mantayanti rahogatā* — *nói trong kín đáo*), còn `migarājā` bằng `dn24:2.6.7` (*so sīho migarājā* — *lão chúa sư tử*). Nhưng hai dạng động từ `māruyha` và `oruyha` (cả hai đều là **sở thứ hai số ít**, dạng aorist có đuôi `-yha`) **tôi không phân xử được**. Tôi chọn cách đọc giữ được toàn bộ đơn vị nghĩa còn lại và không thêm ý nào: Jambuka nói với vua. Điều này phải nói ra vì nó có thể làm đổi nghĩa cả khối thơ — nếu `māruyha` đọc là *giáng vào* (nghĩa `māru`) thì ý cả khối là đe dọa, chứ không phải trò chuyện.

  **Thuật ngữ đặt mới, kèm số tiền lệ.** `Catumaṭṭhajātaka` → *Kinh Bốn Điều*: **0 tiền lệ**; `catumaṭṭha` nghĩa đen là *bốn điều* (bốn điều kiện của bậc vua trong truyện thợ kim hoàn), tôi giữ nguyên nghĩa đen thay vì đặt một nhãn giàu hình như *Bốn Đức Tính* — vì chữ *đức tính* đã bị chiếm bởi `guṇa` trong tầng và sẽ dễ lẫn. `Dukanipāta` → *Phẩm Hai Pháp* (`iti28`–`iti33`, 6 chỗ). `Asadisavagga` → *Phẩm Asadi*: **0 tiền lệ**; tôi giữ Pāli, đúng cách *Phẩm Kakaṇṭaka*, *Phẩm Santhava*, *Phẩm Litta*, *Phẩm Haṁci* đã có, vì không có cách Việt nào chắc chắn (`asadi` có thể là *không có sát na* hoặc *vô hại*). `suvaṇṇa` → *vàng* (tiền lệ `sn35`/`dn` trong tầng), `kāka` → *con quạ* (*Kinh Quạ Tai Đen*, *Kinh Con Quạ*, *Kinh Quạ Biển*), `pavisa` → *ăn* (động từ ăn xoài), `bilaṁ` → *chỉ*, `migarājā` → *lão chúa sư tử*, `mantaye` → *thờ phụng*.

  **Cũng cần ghi: hai chữ trong `:2.3` tôi hiểu là hỏi, không phải khẳng định.** `Kiṁ tettha catumaṭṭhassa` → *Còn với ngươi, thì cái bốn điều ấy là gì*; `tettha` là *với ngươi* (dative), `catumaṭṭhassa` là cách sở hữu *của bốn điều*, nên `bốn điều ấy` có `của` là do tôi thêm cho tự nhiên, không phải chữ Pāli. `vàng được mạ bằng vàng / trời được thờ phụng bằng trời` là cách ví Pāli đã có.

  **Vì sao `draft` chứ không phải `review`.** Điểm trung bình là 8.69, tức đã dưới ngưỡng 9.0; nhưng lý do chính là **blocker thiếu tầng tham khảo Anh**, và blocker thắng điểm. Tôi không nâng điểm để né nó.
  **Những lỗi bản đầu tôi tự bắt khi đọc đối kháng (đã sửa hết, ghi lại để người đọc scorecard biết điều gì đã qua):** (1) `2.3` tôi đặt *với ngươi* ở giữa câu, làm mất dạng câu hỏi `Kiṁ tettha …` — sửa thành *Còn với ngươi, thì cái bốn điều ấy là gì,*; (2) `1.1` bản đầu đọc `Yaṁ` như tân ngữ đứng trước cả mệnh đề, sai vị trí vì `Yaṁ` là quan hệ nối `nissitā`.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja187:0.2` mang Pāli `Dukanipāta` được
  đổi *«Phẩm Hai Pháp»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

