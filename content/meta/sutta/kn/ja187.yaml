  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 11 khoá chênh lệch lớn nhất (cả bài 13 khoá) → khác nghĩa 10: sửa 10 (`1.1`–`1.4`, `2.1`–`2.4`, `0.4`, `3.1`), giữ 1 (`0.3`: chuẩn hoá tên phẩm theo tầng tên đã ghi ở trên, bản mù chỉ phiên âm), bất định 2 (`2.1`, `2.3`; xem dưới). Các sửa theo Pāli. `1.1` `viṭabhimāruyha` = `viṭabhiṁ āruyha`, *leo lên tán cây* (`viṭabhi` = tán, như `mn45:4.15`); `āruyha` (75 khoá trong tầng Pāli) và `oruyha` ở `1.3` (17 khoá) là tiền khứ phân từ như `ja514:10.1`, `snp3.1:14.2`, không phải động từ ngôi hai. Bản trước dịch `1.1` thành *từ chỗ cao, ngươi nói với ta lời thẳng thắn* và `1.3` thành *từ chỗ thấp, ngươi lại nói*: thêm người nghe *ta* và nội dung *lời thẳng thắn* mà Pāli không có, và bỏ mất hai tiền khứ phân từ. `1.2` `mantayavho rahogatā` → *các ngươi bàn bạc riêng ở nơi kín* (bỏ *với ta*). `1.4` `migarājā` → *vua của loài thú* (tiền lệ `cnd23:330.1`, `bv2:138.1`; bỏ *lão* và *ấy* tự thêm). `2.1`–`2.2`: `suvaṇṇo suvaṇṇena` là chủ ngữ và công cụ cách (*vàng với vàng*), `mantaye` là *bàn bạc* (`mantayati`, như `ja504:3.2`, `ja547:267.2`), không phải *thờ phụng*; bản trước dịch *vàng được mạ bằng vàng, trời được thờ phụng bằng trời* không có căn cứ. `2.4`: `bilaṁ pavisa` là mệnh lệnh *hãy chui vào hang*, `jambukā` hô cách *hỡi chó rừng* (tiền lệ `ja374:4.1`, `ja335:1.2`); bản trước dịch *kẻ chỉ biết ăn xoài* (đọc nhầm `jambuka` thành quả jambu, `pavisa` thành *ăn*) và kết bằng `?”.` trong khi Pāli là `”ti.` nên viết `.”` theo `ja186:2.6`, `ja188:2.4`, `ja189:2.4`. `0.4`, `3.1`, `2.3`: giải thích trước đây rằng `catumaṭṭha` là *bốn điều* (*bốn điều kiện của bậc vua trong truyện thợ kim hoàn*) không có căn cứ trong Pāli đã ghim, không có tiền lệ nào trong tầng (0), nên trả tên về phiên âm `Kinh Catumaṭṭha` (`3.1` không dấu phẩy theo đa số đã đo ở phần notes trên) và `2.3` dịch *Ở đó, Catumaṭṭha có việc gì,*; `tettha` đọc `te ettha` hay `tattha` đều khả dĩ. Thông tin về thợ kim hoàn trong mục notes cũ là suy đoán, không phải nội dung Pāli. Bất định còn lại: (1) `suvaṇṇo` là tính từ hay tên riêng; (2) `catumaṭṭha` chưa rõ nghĩa; (3) `mantayavho`/`mantavho` có thể là ngôi hai số nhiều trình bày hoặc mệnh lệnh (hai cách đọc đều giữ được nghĩa `1.3`–`1.4`); (4) người nói của chuỗi `1.1`–`2.4` và người nghe chưa xác định được từ Pāli. Thay cho đoạn 'không phân xử được `māruyha`/`oruyha`' ở trên: nay đọc cả hai là tiền khứ phân từ. Không có bản Anh hay bản Việt độc lập khác; chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản Anh, bản Việt nguyên bài hay đoạn song song): sửa 1 khoá — `1.3` `Nīce oruyha mantavho`: `-vho` là mệnh lệnh trung thái ngôi hai số nhiều, và vế này là lời mời đối lập với `1.1`–`1.2` (*lên cao bàn riêng* ↔ *xuống thấp mà bàn*, để `1.4` *vua loài thú cũng nghe*); bản cũ *"xuống chỗ thấp rồi các ngươi bàn"* đọc như trần thuật. Nay *"hãy xuống chỗ thấp rồi bàn,"*. Giữ `1.2` trần thuật (`mantayavho` cùng hình thái nhưng ngữ cảnh *rahogatā* là mô tả việc đang làm) — ghi bất định nhỏ. Giữ 11 khoá còn lại sau lượt sửa lớn 2026-10-14. Bất định `2.1` (`suvaṇṇa` *vàng* hay chim lông vàng), `2.3` (`catumaṭṭha`) giữ như ghi trước.

  Quyết định hội đồng biên tập 2026-10-16: B21 — :0.3 (asadisa = vô song); C2 — :3.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").

  Nghiên cứu nguồn ngoài 2026-10-16: Rouse (Cowell chủ biên, PTS 1897),
  https://obo.genaud.net/dhamma-vinaya/pts/kd/jat/jat.2/jat.2.187.rous.pts.htm; Ānandajoti, bản dịch
  kệ và chú giải Jātaka,
