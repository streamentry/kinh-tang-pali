notes: |-
  Dịch trực tiếp từ Pāli root tại commit bilara đã ghim (11c9d708978cde8ba61096d8a75f7ddfb846f639, khoá dựng từ tiền tố pre của lát, không phải từ uid).
  Tầng Anh đã ghim không có bài nào trong thư viện Milindapañha, tầng Việt hiện hành chỉ có Pháp Cú, lớp lấp english-project không có ⇒ dịch một tầng, nên triangulation bị chặn.
  Văn xưng theo mil đã merge: Thưa Đại đức Nāgasena (7 tệp) và Tâu Đại vương (chữ hoa ở đầu câu, chữ thường sau); Thế Tôn cho bhagavā, Trưởng lão cho thera, Đấng Chiến Thắng cho buddha khi tán dương.
  Dấu lược: `…pe…` của Pāli giữ đúng MỘT `…` và KHÔNG mở rộng (BRIEF_VI3 §10.1). Bản nháp đầu của tôi đã mở rộng ở bốn khoá `1.6`, `1.8`, `2.1`, `2.3` — tái dựng cả vế `so ākaṅkhamāno, ānanda, tathāgato kappaṁ vā tiṭṭheyya` đang nằm trong chỗ lược — đã trả về `… được tu tập … hoặc phần còn lại của một kiếp`. Harness chỉ bắt được số dấu lược, nên lỗi này phải bắt bằng mắt; ghi lại để lát sau đọc kỹ.
  Công thức `cattāro iddhipādā bhāvitā … kappāvasesaṁ vā’ti` dịch theo đúng 7 tiêu chí tu tập của `dn16:3.41.5` (đã published trong kho): được tu tập, làm cho sung mãn, dùng làm phương tiện, lấy làm nền tảng, duy trì, tích lũy, khéo khởi dậy; `kappaṁ vā tiṭṭheyya kappāvasesaṁ vā` → một kiếp, này Ānanda, hoặc phần còn lại của một kiếp.
  Tiêu đề `0.2 Meṇḍakapañha` và `0.3 Iddhibalavagga` theo đúng `mil5.1.9` đã merge (Phẩm Meṇḍakapañha, Phẩm Iddhibala). `0.4 Iddhibaladassanapañha` 0 tiền lệ nên đặt mới: sự hiển biết thần lực.
  0 tiền lệ, đặt mới có lý do: `natthi tathāgatānaṁ aṭṭhāne gajjitaṁ` → không có tiếng la hét nào; `amoghavacanā/tathavacanā/advejjhavacanā` → lời không vướng mắc quả, lời chân thật, lời không chập thủ; `ubhato koṭiko` → có hai đầu; `diṭṭhijāla` → màn nhìn (1 tiền lệ, dn1:3.74.3 dịch Lưới Kiến — khác ngữ cảnh, ghi rõ); `anatthiko` → không cần thêm thế giới nào nữa; `sabbabhavagatiyoniyo` → mọi lối đưa vào các cõi hiện hữu; `buddhasīhanāda` → lời vang rền rĩ của chư Phật; `gūtha` → phân (1 tiền lệ, dn23:25.6).
  Bất định đã phân xử và ghi lại: `iddhipāda` trong bài này là tức địa của thần lực nhưng câu hỏi lại xoay quanh `iddhibala` (thần lực) và `temāsaparicchedo` (hạn ba tháng) — tôi dịch theo tiền lệ `dn16` là bốn thần thông, giữ nhất quán với 3 lần lặp cùng công thức trong chính bài; nếu biên tập muốn bốn như ý túc thì phải sửa cả 3 khoá.
  `na ca taṁ javagatiṁ tassaṁ parisāyaṁ dasseyya` tôi dịch là không thể phô ra tốc độ ấy trước đám đông (chứ không phải bắt đuổi kịp) — vì `vijjati ca so javo tassa` ngay sau đó nói sức chạy của vị ấy bị con chiến mã vượt mất.
  Pāli trùng nguyên văn với bài đã dịch và đã dùng lại nguyên văn bản Việt đó: `“Bhante nāgasena, bhāsitampetaṁ bhagavatā—` (10 lần), `Yadi, bhante nāgasena, bhagavatā bhaṇitaṁ—` (5), `Bhāsitampetaṁ, mahārāja, bhagavatā—` (5), `“Sādhu, bhante nāgasena, evametaṁ tathā sampaṭicchāmī”ti.` (18), `Imasmiṁ vagge dasa pañhā.` (4), cộng `cattāro iddhipādā …` nguyên văn `dn16:3.41.5` cho `1.2` và `3.3`.
