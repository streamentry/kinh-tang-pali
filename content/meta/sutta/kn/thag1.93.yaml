notes: |-
  **Tự kiểm, vì `cần` RỖNG.** `kiểm()` của `_hvi.py` không chạy assertion nào cho bài này (mọi vế kệ < 40 ký tự). Tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá `all`, NFC, số dấu lược khớp Pāli từng khoá, ngoặc kép cân trên cả bài, không Pāli lọt, không `(…)`, không trùng Pāli, `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Bốn vế lặp khuôn, giữ đúng bốn.** Pāli là hai câu đối xứng lặp lại (`Yo kāme kāmayati` / `Yo kāme na kāmayati`), nên bản Việt cũng phải có hai câu đối xứng. Tôi dịch **từng vế riêng**, không rút gọn và không dùng một khuôn câu chung cho cả bài — đây là lần thứ bảy cùng lớp lỗi *điền bằng khuôn* mà lát này cảnh báo.

  **Tiền lệ, đếm được.**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: `kāmā` → *dục* (rất nhiều). `kāmayati` → *hưởng thọ*: cặp `kāma` + `kāmayati` là động từ *thọ dục*, và cùng kỹ thuật với `vedeti` (*cảm nhận*) mà tôi dùng ở `thag1.98:1.3`. `sukha` → *sướng* (đối xứng với `dukkha` → *khổ*). `Dukkhā kāmā` → *Dục là khổ*, theo đúng mệnh đề danh ngữ + vị ngữ của Pāli, không đảo thành *Các dục là khổ* cho xuôi.

  **Bất định đã ghi, và tôi KHÔNG sửa nó.** `Dukkhaṁ so na kāmayati erakā` (không hưởng thọ các dục ⇒ **không** hưởng thọ khổ) nghe nghịch lý, nhưng đó **là** chữ trong nguồn; Sujato cũng dịch y hệt (*doesn't enjoy suffering*). Tôi giữ nguyên và **không** dịch thành điều hợp lý hơn — sửa ở đây là bịa thêm ý. Người đọc muốn hiểu thì đọc trực tiếp cả cặp `1.5`–`1.6`.

  **`erakā` ở `1.6`** là dạng biến thiên theo nhịp kệ, không phải từ khác; tôi dịch cùng cách gọi *này Eraka* như `1.1`–`1.5`.

  **Dấu lược theo BRIEF_VI3 §10.1.** `1.7` = `… Erako thero ….` → hai dấu lược, không mở rộng.

  **Không có bản Việt tham khảo** tại commit đã ghim (`translation/vi/` bilara chỉ có 26 tệp Pháp Cú); `triangulation` là Pāli + English Sujato (10/11, thiếu dòng lược `1.7`).

  **`technical_integrity` 9,6** vì đợt này cấm `npm run validate|test|build`, và `kiểm()` rỗng với bài này.
