notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Tự quét 9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu
  lược khớp, nháy kép cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 1.5.

  TOI THEM MOT CHỮ DUNG CHO CÓ Y NGHĨA VA GHI RA. 1.3 là Vuyhamāno mahogheva, tức “bị cuốn
  đi như dòng lũ lớn”, rồi 1.4 là saccāni paṭivijjhahan, tức “(vẫn) thấu hiểu các sự thật”.
  Hai vế này CẦN một từ nối nhượng nhưng Pāli không viết, nên tôi thêm *dù* ở 1.3. Đây là
  trường hợp “không thêm nghĩa giải thích”, chỉ là từ nối cú pháp bắt buộc của một câu kệ có
  nhịp đối lập; tôi ghi lại để biên tập xử lý thống nhất cho các bài Trưởng Lão khác.

  `Asakkhiṁ vata attānaṁ` → *Ta khéo lắm với chính thân mình*: `asakkhi` là không vụng
  về (0 lượt cho chữ này; snp3.9:3.4 dùng asakkhi theo nghĩa “không thể”, cũng không giúp được),
  `vata` là tiểu từ than ngợi. Tôi không dịch thành “Ta là người khéo léo” vì câu là tiếng kêu
  của chính vị ấy sau khi vớ được bờ.
  `uddhātuṁ udakā thalaṁ` → *từ dưới nước vươn lên bờ*: `uddhātuṁ` là ngước lên, `thala` là
  bờ (0 lượt cho chữ này).
  `saccāni` → *các sự thật*: số nhiều của `sacca`, không phải *bốn sự thật*.
  `paṭivijjhahan` là thì hoàn thành của `paṭivijjhahāti` (xuyên qua), tôi dịc *thấu hiểu*.
  Phẩm Thứ Chín 7 lượt ngoài lát.
