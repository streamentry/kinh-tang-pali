notes: |-
    CHOT KIEM KHONG TU CHAY — DA TU KIEM. Tự quét 9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu
    lược khớp, nháy kép cân.

    TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 1.5.

    TOI THEM MOT CHỮ DUNG CHO CÓ Y NGHĨA VA GHI RA. 1.3 là Vuyhamāno mahogheva, tức “bị cuốn
    đi như dòng lũ lớn”, rồi 1.4 là saccāni paṭivijjhahan, tức “(vẫn) thấu hiểu các sự thật”.
    Hai vế này CẦN một từ nối nhượng nhưng Pāli không viết, nên tôi thêm *dù* ở 1.3. Đây là
    trường hợp “không thêm nghĩa giải thích”, chỉ là từ nối cú pháp bắt buộc của một câu kệ có
    nhịp đối lập; tôi ghi lại để biên tập xử lý thống nhất cho các bài Trưởng Lão khác.

    **ĐÃ SỬA LỖI NGHĨA Ở `1.1`.** Bản dịch trước đây viết *Ta khéo lắm với chính thân mình*,
    và notes cũ của chính bài này đọc `asakkhi` là *không vụng về* rồi ghi là 0 lượt cho chữ
    này. Đọc vậy là sai, và chỗ sai đã thành câu tự khoe. `asakkhi` là **động từ** nghĩa *có
    thể, làm được*, và Pāli đã ghim cho chứng cứ ở ngay đây: `dn24:2.8.1` *neva asakkhi … cāvetuṁ*
    → *couldn’t get*; `dn13:6.1` *neva asakkhi … saññāpetuṁ* → *was able to persuade*. Sujato
    đọc `Asakkhiṁ vata attānaṁ` là *I was able to lift myself up*. `vata` là tiểu từ kinh
    ngạch, và câu là tiếng kêu của chính vị ấy sau khi vớ được bờ, nên tôi dịch *Ôi! Ta đã
    làm được,*. Cùng nguyên văn còn xuất hiện ở `ja342:1.1`, nhưng bài đó chưa có bản Việt
    trong kho nên không có nguyên văn đã dịch để dùng lại.
    `uddhātuṁ udakā thalaṁ` → *vươn mình lên từ dưới nước ra đến bờ*: `uddhātuṁ` là ngước
    lên, `thala` là bờ (0 lượt cho chữ này).
    `saccāni` → *các sự thật*: số nhiều của `sacca`, không phải *bốn sự thật*.
    `paṭivijjhahan` là thì hoàn thành của `paṭivijjhahāti` (xuyên qua), tôi dịc *thấu hiểu*.
    Phẩm Thứ Chín 7 lượt ngoài lát.
