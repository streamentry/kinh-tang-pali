  **Bất định còn lại (đã chọn cách ít giả định nhất).**
  - `8.2`/`9.4` `paccaya` đứng liền `sayanāsana`: có thể là "vật dụng" nói chung (cách chọn ở `pv36`)
    hoặc dạng rút gọn của "dược phẩm khi bệnh" trong bốn vật dụng; bản canonical dùng "vật dụng".
    Bản `iti107:4.2` cũng có Pāli này (dịch "y phục, vật dụng") — ngoài phạm vi, không sửa.
  - `8.3` `Taṁ` chỉ Uttara (người con) theo cách đọc cú pháp tự nhiên; nếu đọc `taṁ` chỉ việc cúng
    dường thì "mắng việc ấy" — ít hợp `paribhāsāmi` hơn, nên không dùng.
  - `4.2` `Himavanta` để nguyên tên riêng (không dịch "núi tuyết") để khỏi thêm nghĩa.
  - Ngoài phạm vi, chỉ báo: `pv32:4.2` còn cùng chữ vô nghĩa "cận tự tín đầy lòng tin" như bản cũ ở
    `7.2` của bài này.

