notes: |-
  **Đo lại ba mệnh đề.** `0.1` Pāli `Petavatthu` → giữ Pāli, 19/19 tệp `pv` đều giữ.
  `0.2` Pāli `Ubbarivagga` → **0 tiền lệ** (đếm trên toàn tầng, không tệp `pv` nào có
  Pāli 0.2 đúng bằng `Ubbarivagga`). Tầng `name/` đã ghim đặt tên bản Anh cho phẩm này là
  *Queen Ubbari* (`pv-name:14.pv-ubbarivagga`). Tôi **giữ Pāli `Ubbarivagga`** vì có tiền lệ
  cùng loại trong chính bộ (`Cūḷavagga` ở pv28/pv29/pv32 giữ nguyên Pāli), còn chuyển
  *Phẩm Ubbarī* thì sẽ là cách thứ N+1. Nhờ người điều phối quyết nếu muốn đổi.
  `0.3` Pāli `10. Uttaramātupetivatthu` → theo khuôn *N. Chuyện Ngạ Quỷ X* đã có trong bộ
  (12 tệp viết hoa *Chuyện Ngạ Quỷ*, 7 viết thường *Chuyện ngạ quỷ*; theo đa số là hoa),
  và tầng `name/` đặt *Uttara's Mother* → **10. Chuyện Ngạ Quỷ Mẹ Uttara**. `:11.1` theo mẫu
  `<tiêu đề>, thứ N.`

  **Tiền lệ trùng nguyên văn, đã dùng lại nguyên văn.**
  - `6.1–6.3` ← `pv43:3.1–3.3` (*Điều ác gì là do thân, do lời nói, / do ý mà đã làm; /
    Do quả báo của nghiệp nào*). Ba khoá này cùng công thức còn xuất hiện ở `pv34:4.3`,
    `pv44:3.3`, `pv6:5.3` — tôi theo `pv43` vì đó là tiền lệ đã được chốt trong tầng.
  - `7.2` ← `pv32:4.2` (*là một cận tự tín đầy lòng tin*).
  - `8.1` và `9.3` ← `thag7.4:5.3` (*Tấm y và thức ăn khất thực,*).
  - `10.3` ← `pv29:5.1` (*Do quả báo của nghiệp ấy,*).
  - `dubbaṇṇā` → *xấu xí* theo `pv6:1.1` (*Này ngươi gầy gò, xấu xí,*).

  **⚠ CHỖ TÔI CỐ Ý LỆCH TIỀN LỆ, VÌ TIỀN LỆ ẤY CÓ VẺ SAI — CẦN NGƯỜI BIÊN TẬP XỬ.**
  `8.2` và `9.4` là Pāli `paccayaṁ sayanāsanaṁ;` / `paccayaṁ sayanāsanaṁ.` Trùng nguyên văn
  với `iti107:4.2`, và bản Việt ở tệp ấy là *nhận được y phục, vật dụng*. Tôi cho rằng bản ấy
  **sai**: `paccaya` là chỗ tựa, `āsana` là chỗ ngồi, `sayanā` là chỗ nằm — không phải y
  phục. Tôi dịch *chỗ ngồi, chỗ nằm để dựa*. `iti107` không thuộc lát của tôi nên tôi **không
  sửa tệp đó**; nếu biên tập đồng ý thì phải sửa cả hai bên.

  **Chỗ phải tự quyết.**
  - `0.2` `Ubbarivagga` — xem trên.
  - `10.1–10.2` `Etaṁ te paralokasmiṁ, lohitaṁ hotu uttara`: `etaṃ` chỉ thứ gì đó trong câu
    trước, tức hành động dâng cho vị sa-môn ở `8.1` và `9.3`. Tôi dịch *Ở thế giới bên
    kia, / xin cho nó hãy là máu với ngươi, Uttara;* — dùng đại từ *nó* để không bịa thêm
    danh từ nào.
  - `4.1–4.2` `sītodikā gaṅgā / himavantato sandati`: tôi tách *sông Gaṅgā vùng tuyết,
    / chảy từ núi tuyết xuống* theo đúng hai khoá Pāli.
  - `1.4` `bhīrudassanā` → *kinh khủng đến mức đáng sợ*; `2.2` `yāvabhūmāvalambare` →
    *xõa xuống tận mặt đất*; `5.3` `lohitaṁ me parivattati` → *Máu của tôi đã hoá thành
    nước* (tức máu của bà đã loãng ra thành nước — đây là lý do bà xin nước chứ không ăn).

  **LỖI ĐÃ BẮT VÀ SỬA TRƯỚC KHI CHẤM — ghi lại để không ai tưởng nó chưa từng xảy ra.**
  Lượt review đối kháng phát hiện lệch **một khoá** ở `4.2–4.3`: bản nháp đầu của tôi đã
  gộp hai câu Pāli `Ayaṁ sītodikā gaṅgā,` và `himavantato sandati;` vào `4.1`, rồi dịch
  `Piva etto gahetvāna,` vào `4.2`. Đã sửa lại đúng theo từng khoá trước khi tính điểm;
  vì vậy `segment_alignment` vẫn là 10.0. Đây cũng là lý do tôi in lại từng cặp Pāli ↔ Việt
  thay vì tin bản nháp.

