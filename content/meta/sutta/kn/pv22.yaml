  **Giải quyết draft 2026-10-12 (kiểm toán độc lập, đọc lại toàn bài từ Pāli).**
  Các mục ở trên là lịch sử của lượt viết đầu. Những chỗ sau **bị thay thế** bởi mục này:
  phần "CHỖ TÔI CỐ Ý LỆCH TIỀN LỆ" (cách đọc `paccayaṁ sayanāsanaṁ`), các diễn giải ở "Chỗ phải
  tự quyết" cho `1.4`, `2.2`, `4.1–4.2`, `5.3`, `10.1–10.2`, và dòng `6.1–6.3`/`dubbaṇṇā` giữ
  nguyên; cùng cách ghép `8.3` với `9.x`. Lượt đọc lại phát hiện bản cũ sai nghĩa thật ở **20/46
  khoá** (và thêm 2 lỗi chữ), chia loại:
  - *Đảo chủ thể / đối tượng:* `8.3` `Tamahaṁ paribhāsāmi` = "tôi mắng **nó**" (Uttara), không phải
    "tôi trách ngươi"; `9.1–9.2` `Yaṁ tvaṁ mayhaṁ akāmāya samaṇānaṁ pavecchasi` = những gì *con*,
    trái ý *mẹ*, đem cho sa-môn (bản cũ "ngươi không muốn cho tôi" đảo `akāmāya`); `7.3` `akāmāya`
    = trái ý tôi (bản cũ "không muốn cho tôi"); `1.3` `petī` là **nữ ngạ quỷ**, bản cũ ghi "Người mẹ"
    (nhân vật chỉ được nói rõ là mẹ của Uttara ở `7.1` và ở tên bài).
  - *Đảo chiều nước↔máu:* `5.3` `Lohitaṁ me parivattati` = (nước) **hóa thành máu** đối với tôi,
    không phải "máu của tôi hoá thành nước"; điều này khớp `6.4`, `10.4` (`gaṅgā … hoti lohitaṁ`).
    Lý giải cũ ghi ở "Chỗ phải tự quyết" là sai. `5.1` `Sacāhaṁ` = "nếu tôi" (bản cũ bỏ điều kiện);
    `5.2` `gaṇhāmi` = lấy/múc (bản cũ "hái nước").
  - *Số và thời gian:* `3.1` `Pañcapaṇṇāsa` = **năm mươi lăm** (bản cũ 50); `3.2` `kālaṅkatā` =
    mệnh chung (bản cũ "bị giết chết"); `3.3–3.4` `Nābhijānāmi bhuttaṁ vā, pītaṁ vā pana pāniyaṁ`
    = tôi không nhớ đã ăn hay đã uống (bản cũ "kiêng ăn … chỉ biết nước" — mâu thuẫn chính lời
    xin nước ở `3.5`); `1.1` `Divāvihāragataṁ` = đã đi nghỉ ban ngày (bản cũ "đi khất thực").
  - *Từ:* `4.1` `sītodikā` = nước mát lạnh (bản cũ "vùng tuyết"); `4.4` `yācasi` = xin (bản cũ
    "hỏi"); `4.2` `himavantato` → "núi Himavanta" theo đa số tầng (dãy `tha-ap`, `snp3.1:18`, `pv41`);
    `8.2`/`9.4` `paccayaṁ sayanāsanaṁ` → "vật dụng, chỗ nằm chỗ ngồi", đúng bản `pv36:78.2` và
    `pv36:83.2` (hai khoá Pāli trùng nguyên văn, bản cũ "chỗ ngồi, chỗ nằm để dựa" tự bịa cụm "để
    dựa"); `10.1–10.2` `Etaṁ te paralokasmiṁ, lohitaṁ hotu uttara` = lời nguyền "những thứ ấy, đối
    với con ở đời sau, hãy thành máu, Uttara" (bản cũ "ở thế giới bên kia, xin cho nó hãy là máu";
    song song `pv9:4.3` dịch `paralokasmiṁ` = "ở đời sau"); `7.2` đổi "cận tự tín đầy lòng tin"
    (chữ vô nghĩa) thành "cư sĩ có đức tin" theo `pv24:13.2`, `pv33:5.2`; `1.2` sửa lỗi chữ "bế bên".
  - *Cấu trúc câu:* `7.3–8.2` là **một câu**: nó trái ý tôi mà đem cho sa-môn / y, đồ khất thực, vật
    dụng, chỗ nằm chỗ ngồi; `8.3–8.4` tôi mắng nó, bị keo kiệt hành hạ; `9.1–10.2` là lời mẹ mắng
    chính con (xưng "mẹ/con" khác với lời xưng "tôi" với vị tỳ-kheo vì đây là lời trích lại trong
    lời kể, Pāli không có nháy lồng nên dùng dấu `:` ở `7.4` và `8.4` để báo); `10.3–10.4` quay lại
    nói với vị tỳ-kheo. `6.4` thêm dấu hỏi vì `Kissa … gaṅgā te hoti lohitan` là câu hỏi.
  - *Dùng lại nguyên văn:* `3.2–3.4` ← `pv19:10.2–10.4` (cùng Pāli, `Pañcapaṇṇāsavassāni` ở
    `pv19:10.1` dịch "năm mươi lăm năm"); `6.1–6.3` giữ `pv43:3.1–3.3`; `8.1`, `9.3` giữ "Tấm y và
    thức ăn khất thực,"; `10.3` giữ "Do quả báo của nghiệp ấy," (`pv29:5.1`, `pv6:9.1`, `pv7:11.1`).
  Tên bài `0.3`/`translationTitle`, `0.1`, `0.2`, `11.1` không đổi. Pāli `(…)`/`…pe…`: không có.
  Nháy kép mở `3.1, 4.1, 5.1, 6.1, 7.1`, đóng `3.6, 4.4, 5.4, 6.4, 10.4`: khớp Pāli từng khoá.

