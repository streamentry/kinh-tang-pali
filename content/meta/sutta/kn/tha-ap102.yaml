notes: |-
  `Buddhupaṭṭhākattheraapadāna`,
  thứ 10 của `Sudhāvagga`. 43/43 khoá. Ba tầng tham khảo đều vắng (xem `blocking_errors`) ⇒ `draft`,
  `triangulation` 7.5.

  **Tên phẩm (đo lại, không tin con số cũ; mọi số dưới đây đo TRƯỚC khi ghi lát này):** `:0.1` giữ
  nguyên Pāli **“Therāpadāna”** — đếm trên 325 tệp `tha-ap` đã có: **316** giữ Pāli, chỉ 9 dịch
  *Trưởng Lão Ký Sự*, nên đa số tuyệt đối.
  `:0.3` chọn *“Bài Kệ Tuyên Ngợ Về Trưởng Lão …”* — đo lại trên 325 tệp `tha-ap` có `:0.3`:
  **167** *Bài Kệ Tuyên Ngợ Về Trưởng Lão*, **84** *Ký Sự Về Trưởng Lão*, **65** *Bài Kệ Tuyên Ngôn Về
  Trưởng Lão*, cộng **9** biến thể *Bài Kệ Tuyên Ngợi Về Trưởng Lão*. Tôi theo 167. `:0.2`
  `Sudhāvagga` → *“Phẩm Sudhā”* — đa số **cục bộ trong phẩm Sudhā** là 6/6 (`tha-ap94`–`tha-ap100`),
  nên không phải đa số toàn tầng (toàn tầng chia 188 *dịch nghĩa* / 137 *giữ Pāli* cho `:0.2`).

  **Tiền lệ dùng lại nguyên văn:** `Vipassissa bhagavato,` → *“Đức Thế Tôn Vipassī,”*
  (`tha-ap290:1.1`); `lokanāthassa tādino;` → *“Đấng Bảo Hộ Thế Gian, bậc Bất Động;”
  (`tha-ap277:2.2`); `Ekanavutito kappe,` → *“Từ chín mươi **mốt** kiếp trước,”* (**đã sửa**
  2026-10-05; bản ghi trước ghi *chín*, tức 99 — sai); `Catuvīse ito
  kappe,` → *“Từ hai mươi bốn kiếp trước,”* (`tha-ap264:3.1`); `Duggatiṁ nābhijānāmi,` →
  *“Tôi không còn biết đến đọa xứ nào,”*; `Paṭisambhidā catasso,` → *“Bốn vô ngại giải,”*;
  `…pe…` → *“…”*; `kataṁ buddhassa sāsanaṁ”.` → *“đã làm tròn lời dạy của Đức Phật”.”* (290/331);
  `Sudhāvaggo dasamo.` → *“Phẩm Sudhā là thứ mười.”* (theo `Kumudavaggo aṭṭhārasamo.` →
  *“Phẩm Kumuda là thứ mười tám.”* ở `tha-ap182:7.1`).

  **Tên trong công thức `Itthaṁ sudaṁ …`: giữ dạng Pāli có `-o` như tầng đang làm.**
  `:6.1` tôi viết *“Tôn giả Trưởng lão Buddhupaṭṭhāko”* (theo `nigguṇḍipupphiyo` ở `tha-ap207:5.1`
  và `sattāhapabbajito` ở `tha-ap290:6.1`) chứ không phải *Buddhupaṭṭhāka*, vì `_hvi.lọt_pāli` chỉ
  cho qua khi chữ đúng nằm trong Pāli của chính khoá đó. `:0.3`/`:7.1` giữ dạng gốc
  *Buddhupaṭṭhāka* như trong tiêu đề Pāli.

  **`Niccupaṭṭhānayuttomhi` (1.3) — bản tham chiếu đã có SAI, tôi KHÔNG chép.**
  `tha-ap188:1.3` có **đúng Pāli này** nhưng dịch *“ta không lúc nào rời bỏ nghề xấu xí ấy,”* —
  không đúng nghĩa (`niccupaṭṭhāna` = *việc hầu hạ thường ngày*, `yutta` = *được giao*). Theo luật
  “trùng thì khớp TRỪ KHI bản tham khảo sai”, tôi dịch đúng nghĩa (*“tôi được giao việc phụng sự
  thường ngày”*) và **ghi đây là chỗ cần người biên tập xem lại `tha-ap188`** — tôi không sửa tệp
  ngoài lát.

  **`Saṭṭhitūriyasahassāni` (2.3) — đơn vị đo không chắc, ghi rõ.** `tūriya` được tầng dịch là
  *một vạn* (`tha-ap41:3.1`, `Saṭṭhitūriyasahassehi` → *“Với sáu mươi ngàn …”*), nhưng điển ngữ
  `PED` cũng cho `tūri` = *một trăm ngàn*, nên phép nhân với `sahassāni` (*ngàn*) không dẫn đến
  con số nào chắc chắn. Tôi dịch **theo nghĩa chữ** là *“sáu mươi vạn ngàn năm,”* và **không** tự
  nhân ra một con số cụ thể. `parivārenti maṁ sadā` → *“luôn luôn vây quanh ta.”*

  **`upaṭṭhānassidaṁ phalaṁ.` (3.4) 3 cặp trùng nguyên văn, chia đều 3 cách**
  (*quả báu của việc phục vụ Tăng chúng* / *quả báu của việc dâng người phụng sự* / *quả báo của
  sự phụng sự*). Vì không có đa số, tôi theo cách ngắn nhất đã có và giữ `phala` = *quả báu*
  (*“đó là quả báu của sự phụng sự.”*).

  **`Mahāniggosa` (4.2) — chính tả khác Pāli, có chủ đích.** Pāli ghi `mahānigghosanāmakā`
  (có `gh`); tiếng Việt phiên âm theo quy ước tầng bỏ `h` sau nguyên âm → *Mahāniggosa*. Tôi
  không sửa thành `Mahānigghosa` để giữ dạng đọc tiếng Việt đã quy ước (ví dụ `Nigguṇḍi`,
  `Buddhupaṭṭhāka`).

  **Uddāna 9.1–9.6 không khớp tiêu đề `tha-ap93`–`tha-ap102` ở ba chỗ** (Pāli liệt kê
  `Madhusenā` nhưng `tha-ap99` là `Madhupiṇḍika`; `Cupaṭṭhako` nhưng `tha-ap100` là
  `Senāsanadāyaka`; `veyyāvacco` khớp `tha-ap101`). Đây là đặc thù bản in, tôi **không sửa** và dịch
  đúng những gì Pāli viết. `Samasaṭṭhi ca gāthāyo, / asmiṁ vagge pakittitā.` → *“rồi đến câu kệ
  thứ sáu mươi, / được ghi trong phẩm này.”*

  **`Buddhavaggadasakaṁ` (13.1) và `Paṭhamasatakaṁ samattaṁ.` (14.1): 0 tiền lệ** (không tệp
  `tha-ap` nào đã có hai công thức này). Tôi dịch *“Phẩm Buddha — mười phẩm.”* và *“Tập thứ nhất
  trăm đã hoàn tất.”* (`dasaka` = *một bộ mười*; `samatta` → *đã hoàn tất*, xem `6/6` tiền lệ
  `<X>kanipātaṁ niṭṭhitaṁ`). `Catuddasasatā gāthā, / pañcapaññāsameva ca.` → *“Có một nghìn bốn
  trăm câu kệ, / lại cộng thêm năm câu nữa.”* — **không** tự cộng thành 1.405.

  **Tên riêng bị chặn oan, đã tra chứng rồi khai vào bộ nhớ tiến trình** (đúng cơ chế docstring
  `_hvi.lọt_pāli`): `Buddhupaṭṭhāka` (`tha-ap102:0.3`), `Mahāniggosa` (`:4.2`), `Ceḷa` (`:9.1`,
  từ `ceḷañca`), `Gandhamāliya` (`:9.2`, từ `gandhamāliyo`), `Cupaṭṭhaka` (`:9.4`, từ
  `cupaṭṭhako`), `Bījanisaka` (`:11.4`, từ `bījanisakacinti`). Mỗi tên đều tra được trong Pāli đã
  ghim trước khi khai.

  **SỬA LỚP LỖI SỐ PĀLI (lỗi loại 2 của quality gate — sai *số lượng*), 2026-10-05.**
  - `tha-ap102:3.1` (`Ekanavutito kappe,`) = **91**: `eka` 1 + `navuti` 90 = 91.
    Bản dịch cũ *Từ chín mươi **chín** kiếp trước,* là **99** — sai. Đã sửa thành *Từ chín mươi **mốt** kiếp trước,*. Tiền lệ trong chính tầng: 86 khoá cùng `Ekanavutito` đã viết *chín mươi mốt* (= 91) và **0** khoá nào viết *một*; 21 khoá sai nằm ở 21 tệp này (chính là số đo trước khi sửa).
  - Vế trước/sau, dấu câu và mọi thứ khác trong câu giữ nguyên y như cũ.

  **CHƯA SỬA — nghi vấn khác trong chính tệp này, xin người biên tập xác nhận:** `Saṭṭhitūriyasahassāni,` (`:2.3`) đang dịch *sáu mươi vạn ngàn năm,* = 600.000.000. Nếu `saṭṭhi` = 2²⁰ = 1.048.576 và `tūriya` = ¾ thì `saṭṭhitūriya` = 786.432, × `sahassāni` (ngàn) = **786.432.000**, không phải 600 triệu. Hai tệp cùng cụm còn đang dịch **khác nhau**: `tha-ap116:6.1` → *Hai trăm năm năm mươi sáu ngần lần* (≈ 256.000, lại lặp chữ *năm*). Tôi **KHÔNG sửa** `:2.3` vì nó ngoài 32 khoá được giao, và đền ngữ `tūriya` cần tra kỹ hơn.

  **Cổng còn lại:** bị cấm chạy `git`/`gh` và `npm run validate|test|check|build|audit|reference:gaps` ⇒ `technical_integrity` = **9,6**; bốn lệnh còn lại là `npm run validate` · `npm test` · `npm run check` · `npm run build`. Điểm **không** nâng.
