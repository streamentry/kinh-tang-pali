  trị NFC; không khoá nào trùng nguyên văn Pāli ngoài `:0.1`; nháy kép cân trên cả bài
  (2 mở, 2 đóng — khớp đúng với Pāli: `1.1`→`1.4` và `2.1`→`7.4`); không có `(…)` đứng
  một mình; dấu lược khớp; thứ tự khoá theo số. Vì chưa chạy bốn cổng `npm` và chưa có lượt
  rà của người, `technical_integrity` đặt **9.6** chứ không phải 10.0.

  Giải quyết draft 2026-10-12: kiểm toán độc lập, đọc đối kháng từng khoá từ Pāli và THAY THẾ
  các mục cũ ở trên về: đọc `ajā`; đọc `Kiso`; đọc `ajayūthena`; đọc `Vāseṭṭho`; đọc `vibhavaṁ
  gatā`; đọc `1.2`; đọc `7.1`–`7.2`; tên loài `sarabha`; mục "bất định (a)–(d)" và mục "CHỖ ĐỌC LẠI
  (1)–(5)". Bản dịch cũ sai nghĩa thật ở 16/33 khoá (`1.2`, `2.2`, `2.3`, `3.2`, `3.3`, `4.1`, `4.2`, `4.4`,
  `5.1`, `5.2`, `5.3`, `6.1`, `6.2`, `6.3`, `7.1`, `7.2`); chỉnh diễn đạt/thuật ngữ ở 9 khoá
  (`1.1`, `1.3`, `1.4`, `2.1`, `3.1`, `3.4`, `4.3`, `6.4`, `7.3`); giữ nguyên 8 khoá (`0.1`–`0.4`,
  `2.4`, `5.4`, `7.4`, `8.1`).

  Các lỗi nghĩa thật đã sửa, kèm căn cứ trong chính kho:
  (1) `ajā` KHÔNG phải cách xưng hô tế vị vua. Đó là danh từ `ajā` (dê, số nhiều): `4.2` là
  tân ngữ của `nāvabujjhatha` (không để ý đến bầy dê); `4.3` `āgacchantī vajantī` là phân từ
  giống cái, khớp `ajā` chứ không khớp `sarabhā` (giống đực); `4.4` `tā ajā` = những con dê
  ấy; `6.2` `ajā … vibhavaṁ gatā` = bầy dê đã tiêu tán. Cụm "bạch đấng vua" ở `4.2`, `4.4`,
  `6.2` hoàn toàn không có trong Pāli và đã bỏ. Bài chỉ có đúng một vị vua, ở `1.1`; phần
  còn lại là lời Vidhura kể chuyện.
  (2) `ajayūthena` = *cùng với bầy dê*. Bầy dê và nai sarabha cùng có mặt trong một bài,
  không mâu thuẫn: `ajayūtha` ở ja528:36.2 đã dịch *bầy dê*. `ajā` và `sarabhā` là hai nhóm
  vật khác nhau; bản cũ gộp thành *đàn bò* cho cả hai là sai.
  (3) `sarabha` là loài nai (precedent: ja483 *con nai sarabha*, ja547:414.4 *các loài nai
  rohicca và sarabha*), KHÔNG phải bò; đã đổi *đàn bò* thành *những con nai sarabha* ở
  `3.2`, `4.1`, `5.1`, `6.1`.
  (4) `Kiso` ở `6.3` là tính từ *gầy* (kisa), không phải tên riêng *Kīsa*: `Kiso vivaṇṇo
  bhavati` đã có ở ja461:8.1 (*gầy gò, sắc diện tiều tụy*) và snp3.8:12.1; `cāsi` = `ca` + `āsi`
  (đã trở nên). Chủ ngữ là chính vị Bà-la-môn ở `6.4`. Blocker "bất định `Kiso`" được gỡ vì
  có căn cứ hình thái và tiền lệ.
  (5) `1.2` `dhammakāmo yudhiṭṭhilo` là tên và đức hạnh của VUA (Yudhiṭṭhila, tên vua
  Koravya đã gặp ở ja495:1.2, ja515:8.4, ja536:28.2), không phải mô tả Vidhura, và
  `yudhiṭṭhila` ở đây là tên riêng chứ không phải *dũng mãnh trong trận* như bản cũ. Pāli
  trùng nguyên văn `ja495:1.2` nên dùng lại nguyên văn *Yudhiṭṭhila, bậc ưa chuộng chánh pháp;*.
  `1.1` bỏ *bậc* trước Vidhura theo ja495:1.1.
  (6) `2.2` `pahūtedho vane vasaṁ` = *sống trong rừng, có nhiều củi* (`edha` = củi nhiên
  liệu; ja515:29.4 *nhiên liệu dồi dào*), không phải *dựng cao những đống phân*, vốn không có
  trong Pāli. `2.3` `vāseṭṭho` là họ/tên của CHÍNH vị Bà-la-môn ở `2.1`, không phải người
  thứ hai; bản cũ ghi "hai người" là sai, và câu *vị Vāseṭṭha ấy* đã sửa thành *Vāseṭṭha*.
  (7) `3.1` thêm *hắn*, `3.2` *đàn bò* → *nai sarabha bị muỗi quấy nhiễu* (`makasaḍḍitā`
  = bị muỗi hành hạ), `3.3` `vassāvāsaṁ upāgacchuṁ` = *đã đến ở lại trong mùa mưa* (không
  phải *chỗ lánh mưa*), `3.4` *bậc làm khói* → *người làm khói* (không có `bhante` ở đây).
  (8) `4.2` `ajā so nāvabujjhatha` đảo chủ thể: *ông không để ý đến bầy dê*, không phải
  *con không hiểu thấy*. `4.4` *tuyệt diệt hẳn* thêm *hẳn*; `vinasuṁ` = *chết mất*.
  (9) `5.2` `pahīnamakase vane` là vị trí tuyệt đối (*khi muỗi trong rừng đã hết*), không phải
  *rời bỏ đám muỗi*. `5.3` `giriduggāni` = *các nơi núi non hiểm trở* (ja547:260.1 *những
  vùng núi hiểm trở*, ja483 *nơi núi non hiểm trở*), không phải *hố nước, khe núi*. `5.4`
  dùng lại nguyên văn ja547:260.2 (Pāli trùng byte-for-byte).
  (10) `6.2` `vibhavaṁ gatā` = *tiêu tán* (suy vong), KHÔNG phải *phát đạt*: chủ ngữ là bầy dê
  vừa chết ở `4.4`, không phải muỗi; bản cũ lệch chủ thể và đảo nghĩa hoàn toàn. `6.4`
  `paṇḍurogī ca brāhmaṇo` = *và vị Bà-la-môn mắc bệnh vàng da* (chữ `ca` nối với `6.3`).
  (11) `7.1`–`7.2` `saṁ niraṅkatvā, āgantuṁ kurute piyaṁ` = *bỏ mặc cái thuộc về mình mà xem
  kẻ mới đến là thân yêu*: `āgantu` = kẻ mới đến (đối lập `saṁ`), tương ứng với bầy dê (của
  mình) so với nai sarabha (khách tới). Bản cũ *bỏ bê điều ấy / theo đuổi việc mình yêu
  thích* sai nghĩa. `niraṅkatvā` có tiền lệ *ruồng bỏ / bỏ mặc* (ja529:10.1, ja534:84.3,
  ja537:91.2). `1.4` và `7.3` đều là `socati` nên cùng dịch *sầu khổ* (ja355:3.1 *Người sầu
  khổ*), bỏ *khóc*; `1.4` `ko eko bahu socati` = *ai là người một mình mà sầu khổ nhiều*.

  Pāli trùng nguyên văn đã dò: `2.4` (ja532:17.4, ja543:52.4 cùng bản dịch *ngày đêm không
  biếng trễ*, nhất quán) và `5.4`, `1.2` (ja547:260.2, ja495:1.2). Không có cặp Pāli trùng
  nguyên văn trong chính bài này mà bản Việt khác.

