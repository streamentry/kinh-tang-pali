  ở `4.4` và `vibhavaṁ gatā` ở `6.2` hiểu là *chết mất / tiêu tán* (hao tổn bầy dê), mức độ
  cụ thể (chết hay thất lạc) không do Pāli quyết định; (d) `Api brāhmaṇa jānāsi` gọi Vidhura
  là *Bà-la-môn* và dùng *ngươi* theo lời vua; chưa tìm được câu tương tự trong kho để đo
  tiền lệ. `technical_integrity` giữ 9.6: chưa chạy `npm run validate`, `npm test`,
  `npm run check`, `npm run build`.

