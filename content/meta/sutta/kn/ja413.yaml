notes: |-
  `Dhūmakārijātaka`, bài thứ tám của `Gandhāravagga` trong `Sattakanipāta`. 33/33 khoá đã
  dịch, set khoá Việt bằng đúng set khoá Pāli (đối chiếu bằng set, không chỉ đếm 33).

  TẦNG THAM KHẢO — đo, không đoán. Xem `blocking_errors` mục 1: không có tầng Anh, không có
  `vietnamese-current`, không có lớp lấp `english-project`. Ba tầng tham khảo đều vắng ⇒
  `draft`, và `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng điểm để né blocker.

  TÊN BÀI VÀ TÊN PHẨM — theo bầy lân cận, kèm số đếm trên 445 tệp `ja` đã có ở tầng này:
  `:0.1` → *Jātaka* (429 tệp) chứ không phải *Chuyện Tiền Thân* (16 tệp);
  `Sattakanipāta` → *Bộ Bảy Bài Kệ* (20/20 tệp có khoá `:0.2`);
  `Gandhāravagga` → *Phẩm Gandhāra* (10/10 tệp có khoá `:0.3`);
  `:0.4` → *N. Kinh X* (411/445 tệp); dòng kết `…thứ N.` (462 khoá ở 408 tệp).
  ⇒ *8. Kinh Dhūmakāri* và *Kinh Dhūmakāri, thứ tám.* Tên riêng giữ dạng Pāli theo mẫu bầy
  lân cận (ja406 *Kinh Gandhāra*, ja410 *Kinh Somadatta*); chưa có tiền lệ Việt nào cho
  `Dhūmakāri` (đo trong toàn tầng: 0), nên giữ Pāli cũng là cách ít tự đặt nhất.

  PĀLI TRÙNG NGUYÊN VĂN — 4/33 khoá có Pāli trùng byte-for-byte ở bài khác: ba khoá tiêu
  đề và `2.4`. Cả bốn đều dùng lại nguyên văn. `2.4` `rattindivamatandito.` trùng y hệt
  `an8.38:3.4`, lấy đúng *ngày đêm không biếng trễ.* Bản nháp đầu tiên của tôi ghi *suốt ngày
  lẫn đêm không hề mệt mỏi* — cùng nghĩa nhưng đã tự tạo một cách Việt thứ hai cho cùng một
  Pāli, nên đã sửa theo nguyên văn của bài kia.

  CHỖ ĐỌC LẠI, CÓ LÝ DO. (1) `ajā` ở `4.2`, `4.4`, `6.2` là **cách xưng hô tế vị vua**
  (`aja` ⇒ `ajā`), KHÔNG phải *dê cái*; nếu đọc sai thì ba câu đó thành vô nghĩa và câu trả
  lời của vị Bà-la-môn mất chủ ngữ. Đây là chỗ dễ sai nhất của bài. (2) `2.3` `Dhūmaṁ
  akāsi vāseṭṭho` — chủ ngữ là **Vāseṭṭha**, người **làm khói**, khác với vị Bà-la-môn
  đang khóc ở `7.4` `dhūmakārīva brāhmaṇo`; giữ đúng hai người ấy là mấu chốt của toàn bài.
  (3) `2.4` `atandito` nghĩa là *không biếng trễ / không mệt*, không phải *mệt mỏi* —
  bản nháp ghi *không hề mệt mỏi* vì đọc nhầm dấu lược tiền tố. (4) `5.2` `pahīnamakase
  vane` — bỏ rừng nghĩa là **bỏ rời** những con muỗi ở rừng, tôi dịch *rời bỏ đám muỗi nơi
  rừng*, không dịch *bỏ đi* theo nghĩa từ. (5) `7.1`–`7.2` `Evaṁ yo saṁ niraṅkatvā /
  āgantuṁ kurute piyaṁ` — tôi đọc là *kẻ đã bỏ bê điều ấy mà vẫn cứ theo đuổi việc mình
  thân yêu*, và `7.4` mới là câu trả lời cho câu hỏi ở `1.3`–`1.4`.

  BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh. (a) **`6.3` `Kiso`** là điểm khó nhất:
  tên riêng (đọc *Kīsa*) hay là danh từ chỉ đàn vật? Tôi chọn **tên riêng** và dịch *còn Kīsa
  thì đã xanh xét*, vì `6.4` `paṇḍurogī ca brāhmaṇo` là mệnh đề song song cùng một chủ thể
  người, và vì `7.4` đã dùng *vị Bà-la-môn làm khói* để chỉ người. Nhưng `Kiso` không xuất
  hiện trước đó trong bài, nên không loại trừ được khả năng nó chỉ đàn bò. Nếu đọc theo hướng
  đó thì `6.3` phải dịch khác. (b) `2.1` `ajayūthena` — tôi dịch trung tính là *cùng đàn gia
  súc*, không dịch *dê* cũng không dịch *bò*, vì bài tự mâu thuẫn: `ajā` ở đây là *dê cái*
  theo nghĩa thường, còn `3.2` và `5.1` `sarabha` là *bò*. Vì không có bản Anh để phán xử, tôi
  để dạng trung tính và ghi lý do ở đây. (c) `1.2` `dhammakāmo yudhiṭṭhilo` — hai danh từ
  này mô tả **vua** (`Rājā` ở `1.1` là chủ ngữ) chứ không phải bậc `Vidhura`, vì chúng đứng
  ngay sau `apucchi vidhuraṁ`; tôi dịch *bậc vua ham chánh pháp, dũng mãnh trong trận*. Nếu
  đọc là mô tả bậc Vidhura thì câu đó hỏng nghĩa, vì bậc trí không *dũng mãnh trong trận*.
  (d) `6.2` `vibhavaṁ gatā` — `vibhava` là *dư dả / thịnh vượng*, chủ ngữ là đám muỗi
  đã được nhắc ở `3.2` và `5.2`; tôi dịch *chúng thì phát đạt*. Tôi không ghi rõ *muỗi* ở
  khoá này vì Pāli ở `6.2` không nhắc lại.

  DẤU LƯỢC: bài này không có khoá nào chứa `…pe…` và không có `…` trần; hai phía đều 0.
  Đây là câu kệ, không có đoạn lược.

  CỔNG KỸ THUẬT. Agent dịch không được chạy lệnh `npm` (BRIEF cấm
  `validate|test|build|check`). Tôi tự kiểm và tất cả xanh: `_hvi.kiểm` pass; set khoá Việt
  bằng set khoá Pāli (33/33, kể cả 33 khoá ngắn hơn 40 ký tự mà `_hvi` không quét); mọi giá
  trị NFC; không khoá nào trùng nguyên văn Pāli ngoài `:0.1`; nháy kép cân trên cả bài
  (2 mở, 2 đóng — khớp đúng với Pāli: `1.1`→`1.4` và `2.1`→`7.4`); không có `(…)` đứng
  một mình; dấu lược khớp; thứ tự khoá theo số. Vì chưa chạy bốn cổng `npm` và chưa có lượt
  rà của người, `technical_integrity` đặt **9.6** chứ không phải 10.0.