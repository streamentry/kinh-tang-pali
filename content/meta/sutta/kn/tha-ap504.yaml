  BẤT ĐỊNH đã ghi, không giấu:
  1. `Sukataṁ mattikāpattaṁ` (`:2.1`) — `mattikāpatta` không có tiền lệ cùng nghĩa trong
     3.359 bài Việt (tiền lệ duy nhất là `Aggahiṁ mattikāpattaṁ`, mang nghĩa khác: bát làm
     bằng đất nung), và không có bản Anh đã ghim. Tôi dịch *Tấm lá bết đất làm khéo* — giữ
     đúng hai thành phần *đất* và *lá* cùng *làm khéo* của `sukataṁ`, không khẳng định đây là
     vật cụ thể nào. Người điều phối nên tra lại.
  2. `soṇṇathāle` / `rūpimaye ca sovaṇṇe` / `taṭṭike ca maṇīmaye` (`:3.2–3.4`) — dịch theo
     nghĩa từ (*kho chứa vàng*, *làm bằng hình sắc và bằng vàng*, *làm bằng vải vóc và làm
     bằng ngọc*); không có tiền lệ nào trong tầng Việt.
  3. `Pātiyo paribhuñjāmi` (`:4.1`) — `pātiya` là *thức ăn dư* mang về; dịch *phần thức ăn
     dư ấy*.
  4. `Buddhakhetta` (`:6.2`, `:7.3`) — dịch *ruộng của Đức Phật*; không có tiền lệ trong tầng
     Việt, nhưng nghĩa là ruộng lành.
  5. `acalaṁ padaṁ` (`:8.4`) — hai tiền lệ giống hệt dịch *bước chân không lay* / *chỗ đứng
     bất động*; tôi dùng *bước đến nơi không lay chuyển*.

  DẤU LƯỢC: Pāli có `…pe…` ở `:10.2`, `:11.2`, `:12.2`; bản Việt giữ **đúng một** `…` mỗi khoá.
