notes: |-
  **ĐỌC TOÀN BỘ PāLI TRƯỚC KHI VIẾT.** 36 khoá, in lại cặp Pāli↔Việt sau khi ghi.

    **TẦNG THAM KHẢO — 0/2 khoá có Anh Sujato** ⇒ `draft`, `triangulation` 7.5. Chi tiết cùng lát.

    **DÙNG LẠI NGUYÊN VĂN 9/11 KHOÁ PĦI TRÙNG.** `Paṭisambhidā catasso,` (287), `…pe…` (406),
    `kataṁ buddhassa sāsanaṁ”.` (257), `Duggatiṁ nābhijānāmi,` (83), `Aṭṭhārase kappasate,` →
    Vào một ngàn tám trăm kiếp trước, (2), `lokajeṭṭhassa tādino;` → bậc tối thượng thế gian, bậc
    Vững Vàng kiên định; (2), `Paṭiggahesi bhagavā,` → Đức Thế Tôn đã thọ nhận, (1),
    `Sattaratanasampannaṁ,` → Đầy đủ bảy món báu quý giá, (31 trong số hai dạng), `accharāhi` →
    được các tiên nữ vây quanh. (1), `Itthaṁ sudaṁ …` (374/376).

    **2 KHOÁ LỆCH ĐA SỐ.**
    (a) `“Atthadassissa munino,` — tiền lệ duy nhất là *“Đệ tử của bậc Ẩn Sĩ Atthadassī,* (1,
        ở `tha-ap310`). Cách đó thêm chữ **Đệ tử** không có trong Pāli (không có `sāvaka`/`putta`
        ở vế này) — đó là unsupported addition, tức blocking error loại 4 của AGENTS.md. Tôi dịch
        *“Của bậc Hiền giả Atthadassī,* giữ đúng cách HÀNG của `munino` (bậc Hiền giả).
    (b) `yaṁ kammamakariṁ tadā;` — đa số 9 lần là *khi ta làm thiện nghiệp ấy;*. Nhưng ở đây
        `yaṁ` là TỪ QUAN HỆ và chủ từ là vị vua ở `:6.3`, không phải người kể. Dùng *ta* sẽ
        đặt nhầm người. Tôi dịch **nghiệp mà hắn đã làm khi ấy;**.

    **TÊN PHẨM.** `Upālivagga` → **Phẩm Upāli**: 3/3 bài đã có (tha-ap47–49), một cách duy nhất.

    **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
    · `Uccato pañcaratanaṁ` (:2.1) — `uccata` = trang bày/trang sức; `pañcaratana` = năm món báu
      (vòng đầu, hoa tai, vòng cổ, vòng tay, vòng chân). 0 tiền lệ cho cụm này. Tôi dịch *ta
      trang sức bằng năm món báu,*. Nếu `pañcaratana` ở đây mang nghĩa *ngũ bảo* như ở
      `Sattaratana`, cách dịch không đổi, nên câu này an toàn dù đọc nào.
    · `bhāvanīyyaṁ manoramaṁ` (:2.4) — `bhāvanīyya` nghĩa gốc là *đáng để quán sát/tu chứng*, ở đây
      là tính ngữ đi với con đường đi lát, nên tôi dịch theo nghĩa chức năng *thuận tiện để đi*;
      `manorama` = *thích thú để ngắm* (có 1 tiền lệ `snp5.1`: *xinh đẹp, khả ái*). Ghi rõ vì
      `bhāvanīyya` là từ hội tĩnh hơn *dễ đi*.
    · `pulinaṁ anubhossati.` (:4.4) — chủ ngữ là người được sinh ra với bảy bảo ở `:4.3`, không
      phải người kể. Tôi dịch *thọ hưởng cát mịn ấy.* theo thì hiện tại của `anubhossati`, giữ
      mạch cả khối `:4.1–4.4` về việc dâng cát mịn.
    · `Tikkhattuṁ` (:6.3) — `tikha` = sắc bén/dữ dội; tôi dịch *dũng mãnh*. 0 tiền lệ trong tha-ap
      (hai nơi khác trong tầng đều nói về tiếng sư tử, không liên quan).

    **HAI TẦNG NHÁY.** Như kép `"` mở ở `:1.1` và đóng ở `:8.3`; **thêm** nháy cong `‘` mở ở
    `:4.1` và `’` đóng ở `:6.4`, vì Pāli cũng có hai tầng đó. Tự đếm lại: cân.

    **DẤU LƯỢC.** `:8.2` là `…pe…` → **đúng một** `…`.

