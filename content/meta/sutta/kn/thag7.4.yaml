notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato (34/35 khoá có chữ).
  `Sattakanipāta` → Bộ Bảy Bài Kệ (8/8); 0.4 theo mẫu `Kệ Ngôn Của Trưởng Lão <Tên>` của thag5; 7.5 `… Sopāko thero ….` dùng lại nguyên văn tiền lệ (đúng một cặp trùng). 2.4, 7.3 dùng lại nguyên văn tiền lệ.
  Ba tầng nháy trong Pāli: “ mở ở 1.1 đóng ở 7.4; nháy đơn ‘…’ của Đức Phật ở 5.1 và 6.1. Giữ nguyên ba tầng, kiểm cân trên toàn bài.
  BẤT ĐỊNH nhỏ: 3.1–3.2 là một mệnh đề bị cắt đôi — `Tato pañhe apucchi maṁ` rồi `pañhānaṁ kovido vidū` là phần tán từ đi kèm; dịch tách hai vế cho khớp ranh giới khoá, không gộp.
  `…pe…` không có trong bài này nên không phát sinh dấu lược.
  Tên bộ: như thẻ ghi ở thag5.12, hai tên do coordinator nêu không có tiền lệ đo được trên đĩa (0 lần).
