notes:
  - >-
    **Bài đầu tiên của Tăng Bộ** (Jātaka 1), nên có `0.1`–`0.4` **bốn** khối
    tiêu đề. `apaṇṇaka` → *bụi dơ* (0 tiền lệ, đặt mới; cũng là tên phẩm).
    `takkikā` → *bầy quạ*. `Namo tassa Bhagavato Arahato Sammāsambuddhassa` →
    *Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác* (`arahā` và
    `sammāsambuddho` theo `an10.16:1.3`, đã `published`).
  - >-
    Bốn vế kệ mở đầu (`2.1`–`2.4`) là **cách nói về cách lấy bụi dơ: bằng bụi
    dơ, hoặc bằng bầy quạ** — hai phương tiện quen thuộc trong cả nhóm Tăng Bộ.
    Tôi dịch nguyên văn, không diễn giải.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng
    Thích Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã
    ghi ở `content/meta/reference-gaps.yaml`.
  - >-
    Rà lại 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): `ja1:2.2` `takkikā`
    trước dịch "bầy quạ" là sai; PED/Sujato ("sophists") cho nghĩa người biện
    luận, nay dịch "bọn biện luận". Còn tồn đọng, chưa sửa vì ngoài phạm vi lượt
    này: `apaṇṇaka` (2.1, 2.4, tên bài) đang dịch "bụi dơ", Sujato dịch "sure
    bet".
  - >-
    Sửa 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): `apaṇṇaka` là tính từ
    "chắc chắn, đúng, không sai" (PED: certain, true, absolute; J i.104 giải là
    `ekaṁsika aviruddha niyyānika`; Sujato: "sure bet"), không phải "bụi dơ".
    Nay dịch "điều chắc chắn" ở `0.3`, `0.4`, `2.1`, `2.4`, `3.1` và
    `translationTitle`; `ṭhānaṁ eke` ở `2.1` đọc "có người (giữ) chỗ chắc chắn".
    Hai ghi chú đầu bài (về "bụi dơ", "bầy quạ" và "cách lấy bụi dơ") là của
    lượt dịch cũ, đã được thay bằng ghi chú này. Tag `pham-bui-do` giữ nguyên
    cho nhất quán cả phẩm, chờ người biên tập quyết định đổi tên phẩm ở
    ja2–ja10.
