notes:
  - >-
    **Bài đầu tiên của Tăng Bộ** (Jātaka 1), nên có `0.1`–`0.4` **bốn** khối
    tiêu đề. `apaṇṇaka` → *bụi dơ* (0 tiền lệ, đặt mới; cũng là tên phẩm).
    `takkikā` → *bầy quạ*. `Namo tassa Bhagavato Arahato Sammāsambuddhassa` →
    *Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác* (`arahā` và
    `sammāsambuddho` theo `an10.16:1.3`, đã `published`).
  - >-
    Bốn vế kệ mở đầu (`2.1`–`2.4`) là **cách nói về cách lấy bụi dơ: bằng bụi
    dơ, hoặc bằng bầy quạ** — hai phương tiện quen thuộc trong cả nhóm Tăng Bộ.
    Tôi dịch nguyên văn, không diễn giải.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng
