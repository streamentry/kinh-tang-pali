notes: |-
  Dịch trực tiếp từ Pāli root (snapshot SuttaCentral/Bilara đã ghim). Bài: Maccubhāyanābhāyanapañha, câu hỏi thứ ba của Abhejjavagga (Meṇḍakapañha): Thế Tôn nói `tất cả đều run sợ hình phạt, tất cả đều sợ tử vong` nhưng cũng nói bậc A-la-hán đã vượt qua mọi sợ hãi; kể cả chúng sinh địa ngục muốn thoát vẫn sợ chết. 79/79 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập khoá Pāli.

  TẦNG THAM KHẢO (đo, không đoán): bản Sujato không có cho bài này. Thư mục `kn/` của edition `translation/en/sujato` tại commit đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud (755 tệp), không có `mil`; đây là `not-published-upstream`, không phải `not-synced`. Tầng `vietnamese-current` cũng vắng (bilara tại commit ghim chỉ phân phối Pháp Cú). Lớp `english-project` của dự án chưa có tệp cho bài này. Coverage English theo công thức của `source/layers.yaml` (Pāli có nội dung từ 40 ký tự sau nén khoảng trắng, bỏ khối :0.x): 0/58 = 0%, dưới ngưỡng 0,80. Ba tầng tham khảo đều vắng nên bài chỉ được đối chiếu với Pāli root, bài giữ `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7,5 (không quá 8,0). Đây là giới hạn của snapshot, không phải lỗi dịch.

  TIỀN LỆ ĐÃ ĐO: (a) Đoạn trích kệ `sabbe tasanti daṇḍassa, sabbe bhāyanti maccuno` dùng lại đúng lời dịch dhp129:1-2 (`Tất cả đều run sợ hình phạt` / `tất cả đều sợ tử vong`) ở 1.2, 1.6, 1.8, 2.2, 2.5, 3.8, 5.6. Hai khoá Pāli trùng ở tầng (dhp129:1, dhp130:1) đều dịch như vậy; maccu dịch `tử vong` đi theo dhp129, còn `maraṇa` dịch `cái chết` để giữ hai từ Pāli thành hai từ Việt. (b) `Bhante nāgasena` -> Bạch ngài Nāgasena: ở các bài mil5.2.x là 9/9, nhưng toàn tầng mil là Thưa tôn giả Nāgasena 81, Bạch ngài Nāgasena 48, Thưa Đại đức Nāgasena 21; chọn Bạch ngài theo cùng phẩm và để cả đối thoại một cách xưng hô. Vì vậy `Na hi, bhante` -> Không phải vậy, bạch ngài (tầng 44/63 là thưa tôn giả; mil5.2.x chia 4/4/1/1) và `Āma, bhante` -> Vâng, bạch ngài (tầng 11 thưa tôn giả so với 2 bạch ngài; mil5.2.x 2 so với 1). (c) `mahārāja` -> tâu đại vương: toàn tầng mil này Đại vương 801, tâu đại vương 437, thưa đại vương 93; mil5.2.x thưa đại vương 56, tâu đại vương 10, này Đại vương 8; chọn tâu đại vương, nhất quán cả bài, như mil5.2.2 và mil5.2.7. (d) `Kena kāraṇena, mahārājā` dùng lại nguyên văn đã có (1/1). (e) `ubhato koṭiko pañho` -> câu hỏi có hai đầu (đúng cách mil5.2.2:1.7 và mil5.2.7). (f) `bhisakko sallakatto` -> thầy thuốc giải phẫu (5 so với 2 thầy thuốc). (g) `nerayikā sattā` -> chúng sinh địa ngục (mil3.4.6 dùng `chúng sinh trong địa ngục`, 3 khoá). (h) Tiêu đề: 0.2 Meṇḍakapañha giữ Pāli (4 so với 3 `Câu Hỏi Nan Đề` trong mil5.2.x; 24/34 toàn tầng); 0.3 Phẩm Không Thể Phá Vỡ (6/7 trong mil5.2.x, một bài dùng Phẩm Abhejja).

  PĀLI TRÙNG NGUYÊN VĂN: trong chính bài có 3 nhóm khoá Pāli y hệt (2.2/2.5/3.8/5.6; 11.4/12.3/13.3; 11.6/13.5), cả 3 nhóm bản Việt giống hệt nhau; 3.7 và 5.5 trùng Pāli gần như nguyên khoá (3.7 chỉ khác dấu mở nháy) nên cùng một lời dịch. Với phần còn lại của tầng, 9 khoá không phải tiêu đề có Pāli trùng khoá của bài khác, 199 cặp, trong đó 189 cặp bản Việt khác; mọi khác biệt đều nằm ở công thức xưng hô và lời đáp (Thưa Đại đức / thưa tôn giả / này Đại vương / con xin kính cẩn lãnh thọ), nằm trong chọn lựa đã ghi ở (b)-(c); không phát hiện cặp nào khác nghĩa.

  SỐ PĀLI (tính lại, không chép): cattāro mahāmattā 4 (3.1) và catunnaṁ 4 (3.3) -> bốn; tikkhattuṁ 3 -> ba lần (5.2); satayojana 100 -> một trăm do-tuần (8.2); catūhi 4 -> bốn điều (7.6); pañcavidhehi / pañcahi 5 -> năm (7.1, 7.7); chabbidha 6 -> sáu loại (8.2); ubhato koṭiko 2 -> hai đầu (1.9); tatiyo 3 -> thứ ba (14.1, và `3.` ở 0.4). Không có cụm số nào thuộc loại chưa phân xử được.

  DẤU LƯỢC: 10.3 `…pe…` -> đúng một `…`; 10.4 có 10 `…` ở Pāli (lược giữa 11 tên vật) và 10 `…` ở Việt; Pāli không có `(…)` trần nào, bài không có khoá chỉ gồm `(…)`.

  BẤT ĐỊNH ghi lại:
    1. 2.6: `phāsukā` (bhaggā phāsukā) dịch `các đòn tay`, theo dhp154:3 (`các đòn tay của ông đều gãy`); nghĩa gốc là `xương sườn` (ja143:1.3 và thag2.32:2.3 dịch xương sườn, tầng 2 so với 1). Chọn nghĩa ẩn dụ vì cùng công thức `bhaggā phāsukā`, nhưng ranh giới nghĩa đen/ẩn dụ chưa được xác minh độc lập.
    2. 2.6: `yoni viddhaṁsitā` dịch `các cửa thọ sinh đã bị phá tan` và `sabbabhavālayā` dịch `mọi chỗ bám víu của hữu`; 0 tiền lệ cho cả hai trên tầng (0 khoá có `bhavālaya`).
    3. 5.4: `kuṭipurisa` dịch `chủ hộ` (0 tiền lệ trên tầng); hiểu là người đàn ông có nhà riêng trong làng, đối lập với đàn bà, tôi tớ, người làm thuê, gia súc ở liền sau. `itthipurisā` dịch `đàn bà, đàn ông` theo từng từ.
    4. 7.1-7.6: năm cách xác lập nghĩa. `āhaccapada` dịch `lời kinh trực tiếp`, `rasa` dịch `ý vị`, `ācariyavaṁsa` dịch `truyền thống thầy tổ`, `adhippāya` dịch `chủ ý`, `kāraṇuttariyatā` dịch `sự vượt trội của lý lẽ`; cả năm đều 0 tiền lệ trên tầng (0 khoá có `āhaccapada`, `kāraṇuttariyat`, `ācariyavaṁs`), nên giữ thuật ngữ Pāli trong ngoặc ở 7.1 và đầu mỗi lời giải 7.2-7.6. Thẻ `<b>` của nguồn không đưa vào bản Việt. `adhippāyā` ở 7.1 là dạng thiếu `-ena` so với bốn từ kia (có vẻ lỗi chép); dịch theo công thức năm vế.
    5. 3.2: `kismiñci deva` có vẻ là `kismiñcideva` bị tách; dịch `việc cần làm nào đó`. `sādhetha tumhe cattāro mahāmattā` dịch `bốn vị đại thần các khanh hãy hoàn thành`.
    6. 8.2: chuỗi định ngữ dài mô tả chúng sinh địa ngục; `kadariyā tapanā mahānirayā` dịch `đại địa ngục tồi tệ, thiêu đốt` (kadariya vốn có nghĩa bủn xỉn, ở đây dùng nghĩa hèn hạ, thảm hại; 0 tiền lệ); `antimapacchimagatikā` dịch `ở vào cảnh tận cùng, cuối chót`; `saṁsibbitachabbidhajālāmālākulā` dịch `bị bao vây bởi những vòng lửa sáu loại đan xen vào nhau`. Cả chuỗi là một câu hỏi của vua nên giữ một khoá, kết bằng `?`.
    7. 1.4: Pāli kết bằng dấu chấm nhưng cấu trúc `kiṁ nu kho … vā …` là câu hỏi lựa chọn; bản Việt kết bằng `?`. Câu hỏi này cũng không rõ có phải hai vế đối lập hay hai ví dụ nối nhau; dịch đúng hai vế `hay`, không thêm chú giải.
    8. 9.1 và 9.4: `kissa niraye ramanti` dịch `vì sao họ lại vui thích ở địa ngục`; `hāsanīyaṁ … taṁ ṭhānaṁ, yaṁ te patthitaṁ labhanti` dịch `đó là điều đáng hoan hỷ, vì họ đạt được điều mình ao ước` (vế `yaṁ` hiểu là mệnh đề lý do); cách đọc khác là `chỗ đáng vui mừng ở chỗ họ đạt được điều mong cầu`, cùng nghĩa.
    9. 10.6: `sarasasabhāvatejo` dịch `uy lực thuộc bản chất tự nhiên vốn có` (ba thành tố sarasa-sabhāva-teja); oai lực ở 9.3 (`ānubhāvo`) và uy lực ở 10.6 là hai từ Pāli khác nhau.
    10. 11.3: `yamakasalākā` dịch `cặp que` và `khāralavaṇaṁ` dịch `muối kiềm`; hai dụng cụ chưa được kiểm trên nguồn thứ hai; `nisadāya pisāpeyya` dịch `cho giã … trên phiến đá`. 11.5: `vedanābhayā` dịch `vì sợ cảm thọ ấy` (không thêm chữ `đau`).
    11. 13.2: `daṭṭhavisena āsīvisena` dịch `con rắn độc có nọc cắn` và `paccācamāpeyya` dịch `khiến nó hút lại` ; chủ thể của `hút lại` là con rắn (không thêm giải thích).
    12. 13.1: `okappeyyaṁ` dịch `tin nhận`; 2 tiền lệ trên tầng cho nghĩa khác (mn2:19.3, an6.58:6.2 dịch theo nghĩa `cho rằng`), nên đây là suy từ ngữ cảnh.

  KIỂM MÁY (không chạy cổng của kho vì không được phép trong lát này): khoá Việt = khoá Pāli, 79 = 79, thứ tự khớp; số dấu nháy kép “ ” và nháy đơn ‘ ’ khớp Pāli từng khoá, 79/79 khoá; NFC đạt; không khoá rỗng; không Pāli nguyên văn lọt sang Việt ngoài hai tiêu đề `:0.1` và `:0.2` (cố ý); dấu lược cân bằng Pāli từng khoá. Còn phải chạy bốn lệnh sau và technical_integrity 9,6 là điểm tạm cho tới khi chúng đạt: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

