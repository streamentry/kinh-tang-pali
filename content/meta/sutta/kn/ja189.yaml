  bài này dịch CHỈ TỪ PĀLI, không có tầng nào độc lập để đối chiếu cú pháp, sắc thái hay cách
  dịch thuật ngữ. Vì vậy triangulation chỉ 7.4 và status là draft, không phải vì điểm thấp.

  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất 30 ký tự nên `cần` rỗng. Tôi tự quét
  13/13 khoá: đủ, đúng ID, không rỗng, NFC, dấu lược khớp, nháy kép cân (mở 1.1/đóng 1.4, mở
  2.1/đóng 2.4), không còn (…) rỗng.

  KHUON DAI. Jātaka (166 lượt); Tập Kẻ Đau Đớn cho Dukanipāta (30 lượt ngoài lát, đa số rõ rệt
  trước Bộ Hai Bài Kinh); Phẩm Bất Bại cho Asadisavagga — đo lại trên đĩa có 4 cách, tôi theo
  cách ĐÃ DỊCH của ja182 (Phẩm Bất Bại) thay vì các cách chưa dịch (ja187: Phẩm Asadi).

  THUAT NGUM DAT MOI, DEM DUOC. `sīhacamma` (0 lượt) → *bào da sươn*: `sīha` là sươn, `camma` là
  da/thuộc, và cả bài kể con lừa trùm da sươn nên gọi tên bài theo việc ấy. `dīpino` → *hổ
  gấm* (0 lượt cho chữ này; `byagha` → *hổ* theo khuôn hiện có, `dīpinī` là báo cáo trong tiếng
  Pāli). `jammo` → *trùm da* (0 lượt). `haritaṁ yavaṁ` → *hạt non xanh*: `yava` là lúa mạch
  (không phải cỏ — bản nháp đầu tôi viết *cỏ non xanh*, đã sửa). `ravamānova` → *ngạo nghễ* (1
  lượt, chính là bài này; `māna` giữ nghĩa kiêu ngạo). `vanta` ở 2.4 dịc bằng *chim* vì
  `dūsayī` là “kẻ hai chân”, tức lũ chim.

  BA CHỖ DỄ SAI, GHI LAI. (1) 1.1–1.2 là lời của con lừa bọc da: *Không phải tiếng gầm của
  sươn ấy, không phải của hổ, không phải của hổ gấm* — tức tiếng kia không phải của bất kỳ thú
  dữ nào. (2) `Pāruto sīhacammena` lặp y hệt ở 1.3 và 2.3, tôi dịc GIỐNG HỆT hai chỗ theo luật
  Pāli trùng. (3) 2.1–2.2 là phần gốc con lừa vẫn gặm cỏ tươi bên rừng, dù đã trùm da sươn —
  tôi dịc *Dẫu lâu, con lừa cũng gặm mãi, hạt non xanh bên rừng*, không sửa thành lời khoe
  mình vì không có chữ ấy trong Pāli.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja189:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

