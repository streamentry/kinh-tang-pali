notes: |-
  BLOCKER THAT — GHI RA, KHONG TU NANG DIEM. Bài này KHÔNG có tầng tham khảo English Sujato
  tại commit đã ghim (kiểm bằng cách liệt kê trực tiếp .cache/.../en/sujato/sutta/kn/ja/ — không
  có ja189_translation-en-sujato.json) và cũng không có bản Việt hiện hành cho Jātaka. Tức là
  bài này dịch CHỈ TỪ PĀLI, không có tầng nào độc lập để đối chiếu cú pháp, sắc thái hay cách
  dịch thuật ngữ. Vì vậy triangulation chỉ 7.4 và status là draft, không phải vì điểm thấp.

  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất 30 ký tự nên `cần` rỗng. Tôi tự quét
  13/13 khoá: đủ, đúng ID, không rỗng, NFC, dấu lược khớp, nháy kép cân (mở 1.1/đóng 1.4, mở
  2.1/đóng 2.4), không còn (…) rỗng.

  KHUON DAI. Jātaka (166 lượt); Tập Kẻ Đau Đớn cho Dukanipāta (30 lượt ngoài lát, đa số rõ rệt
  trước Bộ Hai Bài Kinh); Phẩm Bất Bại cho Asadisavagga — đo lại trên đĩa có 4 cách, tôi theo
  cách ĐÃ DỊCH của ja182 (Phẩm Bất Bại) thay vì các cách chưa dịch (ja187: Phẩm Asadi).

  THUAT NGUM DAT MOI, DEM DUOC. `sīhacamma` (0 lượt) → *bào da sươn*: `sīha` là sươn, `camma` là
  da/thuộc, và cả bài kể con lừa trùm da sươn nên gọi tên bài theo việc ấy. `dīpino` → *hổ
  gấm* (0 lượt cho chữ này; `byagha` → *hổ* theo khuôn hiện có, `dīpinī` là báo cáo trong tiếng
  Pāli). `jammo` → *trùm da* (0 lượt). `haritaṁ yavaṁ` → *hạt non xanh*: `yava` là lúa mạch
  (không phải cỏ — bản nháp đầu tôi viết *cỏ non xanh*, đã sửa). `ravamānova` → *ngạo nghễ* (1
  lượt, chính là bài này; `māna` giữ nghĩa kiêu ngạo). `vanta` ở 2.4 dịc bằng *chim* vì
  `dūsayī` là “kẻ hai chân”, tức lũ chim.

  BA CHỖ DỄ SAI, GHI LAI. (1) 1.1–1.2 là lời của con lừa bọc da: *Không phải tiếng gầm của
  sươn ấy, không phải của hổ, không phải của hổ gấm* — tức tiếng kia không phải của bất kỳ thú
  dữ nào. (2) `Pāruto sīhacammena` lặp y hệt ở 1.3 và 2.3, tôi dịc GIỐNG HỆT hai chỗ theo luật
  Pāli trùng. (3) 2.1–2.2 là phần gốc con lừa vẫn gặm cỏ tươi bên rừng, dù đã trùm da sươn —
  tôi dịc *Dẫu lâu, con lừa cũng gặm mãi, hạt non xanh bên rừng*, không sửa thành lời khoe
  mình vì không có chữ ấy trong Pāli.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja189:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja189:0.3` mang Pāli `Asadisavagga` được
  đổi *«Phẩm Bất Bại»* → *«Phẩm Bất Đối Đẳng»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:201.ja-asadisavagga` → *"Prince Peerless"* ⇒ `asadi` là **vô đối**, không phải *bất thành tựu*. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  Lượt cải thiện 2026-10-11: đọc đối kháng cặp Pāli↔Việt 13/13 khoá. Phát hiện trước hết: các đoạn notes cũ ở trên (KHUON DAI, THUAT NGUM DAT MOI, BA CHO DE SAI) mô tả những lựa chọn đã bị thay ở bản dịch hiện hành (tựa *bào da sươn*, *hổ gấm*, *hạt non xanh*, *trùm da*, *ngạo nghễ*); bản hiện hành dùng *sư tử* / *báo* / *lúa mạch xanh tươi* / *khoác lớp da* / *Kinh Da Sư Tử*. Các đoạn cũ giữ làm lịch sử, KHÔNG còn mô tả văn bản; `translationTitle` trong tệp này đã chỉnh cho khớp khoá 0.4. Ba khoá đổi: (1) 1.2 *cọp* → *hổ* (accuracy/terminology): `byagga` ở tầng Khuddaka-Jātaka dịch *hổ* 57 / *cọp* 11 / khác 6 trên 74 khoá; *cọp* ở ja150 ja280 ja290 ja510 là thiểu số, nên theo đa số. `dīpi` → *báo* giữ nguyên (30/33). (2) 1.4 *đê tiện* → *hèn hạ* (terminology): `jamma` ở tầng có *thấp hèn* 5 / *hèn hạ* 5 (kể cả ja250:2.3 `jammo` làm tính từ chủ ngữ), *đê tiện* 0 cho `jamma`; chọn *hèn hạ*. (3) 2.4 *vì cất tiếng kêu* → *chỉ vì cất tiếng kêu* (accuracy, sót từ): `ravamānova` = `ravamāno` + `eva`, tiểu từ nhấn *eva* trước đây bị bỏ. Điểm đổi: terminology 8.8 → 9.0 (hai thuật ngữ nay theo đa số đã đo); ambiguity_integrity 8.5 → 8.6 (bỏ các đoạn notes mâu thuẫn với văn bản, ghi thêm hai bất định dưới đây; mức tăng nhỏ vì bất định thật vẫn còn); các điểm khác giữ nguyên; final_score 8.98 → 9.01 (tổng 90,1/10; sát ngưỡng, chủ yếu nhờ hai thuật ngữ nay đúng đa số). Pāli trùng trong bài: 1.3 = 2.3 (`Pāruto sīhacammena,`), Việt giống hệt (*khoác lớp da sư tử,*), 1 cặp trùng, 0 cặp Việt khác. Nháy khớp Pāli từng khoá (mở 1.1/đóng 1.4; mở 2.1/đóng 2.4). Không có số Pāli trong bài. Bất định còn lại, GIỮ: (a) `dūsayī` ở 2.4 không có tân ngữ nêu rõ; *tự hại mình* là cách đọc thông thường (con lừa tự làm hỏng/phơi bày chính mình) nhưng *mình* là bổ sung của người dịch, chưa có bản tham khảo độc lập nào ghim để kiểm; (b) `taṁ` ở 2.1 (`Cirampi kho taṁ khādeyya`) có thể là chỉ định từ của *yavaṁ* hoặc tiểu từ đệm; không dịch riêng, không đổi nghĩa câu; (c) `khādeyya` dạng khả năng dịch *lẽ ra còn ăn được*, là cách đọc phản thực có chủ ý (ý nói: lẽ ra còn ăn lâu nếu không kêu). Giới hạn tiền lệ: ja162:2.3 (`dīpino`) hiện dịch *con hươu* ở bài khác, lệch 30/33 *báo*, chỉ báo cáo, không sửa ở đây. Blocker không có tầng tham khảo Anh/Việt tại commit đã ghim GIỮ nguyên (sự thật về upstream). Technical gate: `technical_integrity` giữ 9.6; bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy trong lượt này.
