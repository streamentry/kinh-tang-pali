notes: |-
  Đợt 19, làn 92. Dịch từ Pāli root commit đã ghim, đủ 134/134 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ và dấu nháy (xem dưới). Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Cùng câu chuyện vua Sivi cho mắt còn có `cp8` (Hạnh của vua Sivi) và `mil5.1.5` đã dịch trong tầng; đã dùng hai bài đó để đối chiếu tên riêng và nội dung, không dùng làm nguồn Pāli.

  **Tiêu đề.** `0.1` Jātaka giữ nguyên (cùng dạng với toàn bộ các Jātaka đã dịch). `0.2` “Bộ Hai Mươi Bài Kinh” dùng lại nguyên văn bản dịch của `Vīsatinipāta` (26/26 khoá cùng một dạng). `0.3` “Phẩm Mātaṅga” dùng lại nguyên văn `ja497:0.3`, `ja498:0.3` (12/12 khoá cùng dạng). `0.4` “3. Kinh Sivi” và `32.1` “Kinh Sivi thứ ba.” theo khuôn của `ja498` (“2. Kinh Cittasambhūta” / “Kinh Cittasambhūta thứ hai.”) và `ja497`. Số `3.` và `tatiyaṁ` đều là 3. Tên Sivi giữ nguyên dạng Pāli, theo `cp8` (“Hạnh Của Vua Sivi”) và `mil5.1.5` (“vua Sivi”); `sivayo` / `sivīnaṁ` → “dân Sivi”.

  **Tiền lệ dùng lại nguyên văn.** Đã dò toàn tầng (Pāli đã ghim, so khớp sau khi nén khoảng trắng và bỏ dấu câu, bản Việt đã có): 21 khoá của bài này có Pāli trùng nguyên văn với khoá ở bài khác (`0.1`, `0.2`, `0.3`, `5.1`, `7.4`, `9.3`, `14.2`, `14.5`, `19.2`, `19.4`, `20.2`, `20.4`, `23.5`, `25.3`, `27.1`, `27.2`, `27.3`, `29.1`, `29.2`, `29.3`, `31.3`). 16/21 khoá dùng lại nguyên văn bản Việt có sẵn (chỉ khác hoa/thường và dấu cuối khoá): `0.1`, `0.2`, `0.3`, `5.1` (theo `sn7.15:2.3`), `7.4` (theo `ja493:12.2`), `14.5`, `19.4` (theo `sn11.18:7.2`), `23.5` và `25.3` (theo `ja489:3.1`), `27.1`, `29.1` (theo `tha-ap418:7.1`), `27.2`, `29.2` (theo `tha-ap418:7.2`), `27.3`, `29.3` (theo `mn129:16.9`, 14 khoá chứa `yojanasata-` dùng “trăm do-tuần/tuần” so với 8 khoá dùng “một trăm do…”), `31.3` (theo `ja498:26.3`, `ja483:18.3`, `sn1.41:5.5`). 5/21 khoá không dùng lại nguyên văn: `9.3` (đổi tân ngữ “ta” → “ngài” vì `sn8.1:3.3` nói về “ta”, còn ở đây người bị vây quanh là người được nhắc ở `9.1`), `14.2` (đổi “chớ mong” của `dhp84:2` thành “ta không mong” vì ở đây là lời vua nói về mình, giữ ba danh từ “con cái, tài sản, quốc độ”), `20.2` (đổi “đến bên nàng” của `ja489:20.4` thành “đến bên ngài”), `20.4` (đổi “ông” của `ja440:3.4` thành “ngài”), `19.2` (tiền lệ duy nhất `tha-ap135:4.4` dịch “cùng tấm chiếu, ngươi đã bay tới nơi” cho Pāli `pallaṅkena upāvisi`, sai nghĩa so với Pāli; ở đây dịch “đã ngồi xếp bằng”, theo `dn19:16.13` và `dn19:28.4`, 2/2 khoá khác có `pallaṅkena nisīdi`; xem mục lỗi ngoài lát). Tức 5/21 khoá Việt khác, 0 khoá lệch về nghĩa so với Pāli.

  **Trùng nguyên văn trong chính bài.** 134 khoá, 7 nhóm Pāli trùng (sau khi nén khoảng trắng và bỏ dấu câu): `2.4`=`4.4`, `10.1`=`11.1`, `10.2`=`11.2`, `23.5`=`25.3`, `27.1`=`29.1`, `27.2`=`29.2`, `27.3`=`29.3`. Cả 7 nhóm dùng đúng một bản Việt, 0 nhóm lệch. Bản Việt chỉ khác ở dấu nháy mở/đóng và dấu cuối khoá theo Pāli từng khoá (`10.1` có nháy mở, `11.1` không). Hai khổ `27` và `29` chỉ khác ở dòng 4: `27.4` “nguyện chúng cho ngài được thấy” (mệnh lệnh, lời Sakka) so với `29.4` “chúng cho ta được thấy” (trần thuật, lời vua).

  **Số Pāli:**
  - `Vīsati` (0.2) = 20, “Hai Mươi”, theo tầng.
  - `tatiyaṁ` (32.1) = 3, khớp số `3.` của `0.4`.
  - `ekaṁ` (6.1) = 1 và `ubhayāni` (6.2) = 2: “Khi ông xin một, ta cho cả hai”. Hai con mắt được nói rõ ở `ubhayāni`, khớp phần kể ở 16.3 (“móc đôi mắt của nhà vua ra”).
  - `ekanettā` (1.3) = `eka` 1 + `netta` mắt, “cùng một mắt”.
  - `yojanasataṁ` (27.3, 29.3) = `yojana` + `sata` 100 = 100 do-tuần, “trăm do-tuần”.
  - `dutiyaṁ` (25.4) = “thứ hai”, nói về con mắt thứ hai; `katipāha` (17.1) = “vài ngày”, không nói con số cụ thể.

  **Thuật ngữ và tiền lệ, đã đo:**
  - `vanibbaka` → “kẻ ăn xin”: 7/8 khoá chứa `vanibb-` ngoài bài này (`sn3.21` ×4, `pv39:12.2`, `ja489:12.2`, `iti75:10.6`) dùng “kẻ ăn xin”; `cp8:13.4` (cùng chuyện) dùng “người cầu xin” cho `vaṇibbake`; chọn dạng đa số toàn tầng. `vanibbato` (4.1, 24.4) là dạng phân từ nên dịch “đang xin”.
  - `isi`/`rājīsi` (20.3) → “vương tiên”, theo `ja494:5.3`, `ja494:7.3` (2/2 khoá `ja` chứa `rājīsi`); `dn26` dùng “vua ẩn sĩ”, không phải đa số.
  - `deva` và `mahārāja` hô cách (7.1, 7.3, 8.1, 8.3) → “tâu đại vương”: `deva` 19/26 khoá `ja` và `mahārāja` 34/36 khoá `ja` dịch “đại vương”.
  - `janinda` (13.2) → “chúa loài người”, theo `ja498:15.1`; `dvipadinda` (22.1) → “chúa loài hai chân” (48 khoá chứa `dvipadinda`, phần lớn dịch “Đấng Lưỡng Túc Tôn” khi nói về Đức Phật; ở đây gọi vua nên không dùng danh hiệu đó).
  - `khattiya` (22.2) → “Sát-đế-lợi” (xem `ja498`: 397/519 khoá dùng dạng này).
  - `raṭṭhavaḍḍhana` (17.4, 26.2) → “bậc làm giàu có cho xứ sở của dân Sivi”: 8 khoá chứa `raṭṭhavaḍḍhan-` ngoài bài này, “làm giàu có cho xứ sở/xứ Kāsi” 5 (`ja455:12.2`, `ja476:10.4`, `ja476:13.4`, `ja478:2.2`, `ja478:13.2`), “làm hưng thịnh” 2 (`ja502:20.2`, `cp8:8.2`), “làm phát đạt” 1 (`ja415:3.3`). Chọn dạng đa số; thêm “của dân Sivi” vì Pāli có `sivīnaṁ`.
  - `rathesabha` (9.4) → “bậc chiến xa đệ nhất”, theo `ja482:5.2`, `ja460:1.2`, `ja460:5.2`, `ja460:8.2` (15 khoá chứa `rathesabha` ngoài bài này: “chiến xa đệ nhất” 7, “người cầm xe” 2, khác 6; dạng này là dạng nhiều nhất).
  - `sārathi`/`sūta` (17.3, 18.1) → “người đánh xe”, theo `dn14:2.1.2`, `sn19.8:1.4`. `uyyānabhūmi` (18.3) → “vườn ngự uyển”, `pokkharaṇī` (18.4, 19.1) → “hồ sen”, `pallaṅkena nisīdi` (19.2) → “ngồi xếp bằng”.
  - `Sujampati` (3.1, 19.4) → “chồng của Sujā”, theo `sn11.18:7.2` (3/3 khoá `sn11` cùng dạng) và `ja347:3.2`; `Maghavā` giữ nguyên Pāli, theo `sn11.18:7.1`, `ja301:3.4`.
  - `saccavajja` (23.5, 25.3) → “lời tuyên thệ chân thật”, theo `ja489:3.1`, `mil5.1.5:12.2` (“lời tuyên thệ chân thật”); `dn2:17.5` và `mn60` dùng “nói thật” cho nghĩa khác (lời nói thật), không áp dụng ở đây.
  - `Yama` (11.4) → “Diêm Vương”: trong 30 khoá `ja`/`cp`/`vv`/`pv` chứa `yama` chỉ vị vua cõi chết, ba khoá dùng “Diêm Vương” (`ja424:3.3`, `ja483:14.4`, `ja483:15.3`), hai khoá dùng “Yama”, 25 khoá còn lại là chữ khác hoặc không phải tên riêng; chọn “Diêm Vương” theo đa số trong `ja`. `yamasādhana` (11.4): 0 tiền lệ; xem bất định 4.
  - `pāsa` (10.3) → “thòng lọng”, theo `thig5.3:5.3` (“tròng thòng lọng vào cổ”).
  - `pītisomanassa` (25.1–25.2) tách hai chữ: `pīti` → “niềm hỷ”, `somanassa` → “niềm hoan hỷ”; tầng dịch ghép `pītisomanassajātā` thành “hỷ lạc”/“hỷ và lạc” (`dn19:3.2`, `dn18:2.7`), nhưng ở đây hai chữ đứng riêng và không có `sukha`, nên không dùng “lạc”.
  - `varaṁ` (20.3) → “ân huệ”, theo `ja440:3.3`.
  - `macca` (30.2) → “người phàm”, theo `dn19:45.16`, `sn1.76:3.1` (28 khoá chứa `maccānaṁ`/`macco`/`maccā`/`macce`: “người phàm” 11, “phàm nhân” 5, “người đời” 4, khác 8; chọn dạng nhiều nhất).
  - `uparūḷha` (17.2) → “lành lại”, theo `mn105:25.9` (`ruḷhena vaṇena` “vết thương lành lại”); 1 khoá, 0 tiền lệ trong `ja`.
  - `hemakappanavāsase` (8.4) → “mặc áo dệt bằng vàng”, theo `vv43:8.4`, `vv20:9.4` (2/2 khoá chứa `hemakappanavāsasā`).
  - `sayoggā sarathā` (9.2) → “có xe cùng ngựa kéo”, theo `vv37:2.3`.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá, lệch 0/134 khoá (đã thử từng khoá, không chỉ cân tổng); Pāli không có nháy đơn `‘’` nào, Việt cũng 0. Các lời nói kéo qua nhiều khoá mở nháy ở khoá đầu và đóng ở khoá cuối đúng như Pāli: `3.1`–`4.4`, `5.1`–`6.4`, `7.1`–`9.4`, `10.1`–`12.4`; các lời nói còn lại mở và đóng trong một khoá hoặc một khổ (`1`, `2`, `13`, `14`, `15`, `18`, `20`, `21`, `22`, `23.1`–`25.4`, `26.1`–`27.4`, `28.1`–`31.4`). Đoạn kể `16`, `17`, `19`, `32.1` không có nháy. Dấu lược: Pāli có đúng 1 khoá `(…)` trần ở `14.5`, giữ nguyên `(…)` ở Việt (0 khoá `…pe…` khác); `(…)` này là dấu lược của tầng Pāli ghim, không phải khoá chưa dịch (31/31 khoá `(…)` ở Việt đo được đều khớp với Pāli).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `Dūre apassaṁ therova` (1.1): đọc `apassaṁ` là phân từ hiện tại phủ định “không thấy”, `dūre` “ở xa”, `therova` = `thero va` “như một người già”: “Không thấy được xa, như người già”. Có thể đọc `apassaṁ` là quá khứ ngôi thứ nhất “tôi đã thấy” (như ở chỗ khác trong Jātaka), nhưng khi đó `therova` và 1.3 “cùng một mắt” khó khớp ngữ cảnh. `cp8:6.3` (“Andhavaṇṇova hutvāna”) cho cùng chuyện mô tả người đến xin là người mù, nghiêng về cách đọc phủ định. `Ekanettā bhavissāma` (1.3): “chúng ta sẽ cùng một mắt”, cả vua lẫn người xin.
  2. `Vanibbato mayha vaniṁ anuttaraṁ` (4.1): `vanibbato` có thể là phân từ “đang xin” (chủ ngữ là người xin, “tôi”) hoặc dạng sở hữu/ly cách “của người xin”; `vaniṁ` là “lời xin”, `anuttaraṁ` “vô thượng”: dịch “Tôi đang xin; lời xin của tôi là lời xin vô thượng”. Cách đọc khác: “Ngài, vị tối thượng, đối với lời xin của tôi, người đang xin,”. Chưa phân xử được hẳn.
  3. `Mā no deva adā cakkhuṁ` (7.1): `no` có thể là sở hữu (“của chúng tôi”) hoặc ly cách (“với chúng tôi”); dịch “con mắt của chúng thần”, dùng “chúng thần” vì người nói là triều thần/dân Sivi, suy từ ngữ cảnh và `9.1` (`sivayo sabbe`). `parākari` (7.2) = “bỏ rơi, vứt bỏ”.
  4. `sampatto yamasādhanaṁ` (11.4): 0 tiền lệ trong tầng; `sādhana` có thể là “nơi xử trị/trừng phạt” hoặc “công cụ” (nơi Yama hoàn tất việc xử); dịch “đã đến chốn xử trị của Diêm Vương”.
  5. `ājānīye calaṅkate` (8.2): `ājānīya` “ngựa thuần chủng”, nên đọc “những cỗ xe đã thắng ngựa thuần chủng”; `calaṅkate` có thể là `cala` + `alaṅkata` “trang sức lay động” hoặc “trang sức rung rinh”; 0 tiền lệ trong tầng, dịch “trang sức rung rinh”. `hemakappanavāsase` (8.4): dịch theo `vv43:8.4`; `kappana` có thể là “yên cương voi”, nghĩa khác với “áo”, chưa phân xử.
  6. `Bhūmyaṁ so patitaṁ pāsaṁ, gīvāyaṁ paṭimuñcati` (10.3–10.4): `patitaṁ` “đã rơi, đã đặt xuống”; hiểu là cái thòng lọng bẫy nằm sẵn trên đất; dịch “Cái thòng lọng đã rơi xuống đất, người ấy tròng vào cổ mình”. `dassanti vatvāna` (10.1): `dassanti` = “ta sẽ cho”, không thêm nháy trong thân kinh vì Pāli không có.
  7. `Svāhaṁ tameva dassāmi` (12.3): “Cho nên chính điều ấy ta sẽ cho”, hiểu `yaṁ na yāce na taṁ dade` (12.2) là nguyên tắc chung; việc nhà vua cho cả hai mắt khi chỉ bị xin một (6.1–6.2) không được giải thích thêm ở đây.
  8. `Satañca dhammo carito purāṇo` (14.3): `ca` đọc là “và”, nối với 14.1–14.2: lý do bố thí là pháp xưa của bậc thiện nhân; không thêm “vì”.
  9. `Mamaṁ jigīsato` (15.3): `jigīsato` “của người khao khát / người muốn đạt”; Pāli không nêu đối tượng, dịch “người đang khao khát”, không bổ sung “bố thí”. Người nói 15 (vua nói với `sīvika`, thầy thuốc theo `cp8:13.1` `sivaka` là người móc mắt) suy từ ngữ cảnh; “thầy thuốc” không đưa vào thân kinh.
  10. `Uparūḷhesu cakkhusu` (17.2): “khi hai mắt đã lành lại” hiểu là chỗ hai mắt đã liền; không thêm “ổ mắt”. `Sūtaṁ` (17.3) là người đánh xe; `sārathi` (18.1) cùng người đó.
  11. `Varaṁ varassu rājīsi` (20.3): `varassu` “hãy chọn”; `rājīsi` hô cách “vương tiên”: vua đồng thời là ẩn sĩ.
  12. `Yāni saccāni dvipadinda` (22.1): dịch “những điều chân thật nào”, không nói rõ ai biết những điều chân thật ấy (ý: những lời chân thật nhà vua đã thực hành); `puna cakkhu bhavissati` (22.4): “con mắt sẽ lại có”, `cakkhu` số ít, ăn khớp với `dutiyaṁ` (25.4).
  13. `Cakkhu me upapajjatha` (23.6), `dutiyaṁ me upapajjatha` (25.4): `upapajjatha` có thể là quá khứ ngôi thứ ba trung gian (“đã khởi lên”, như `bv19:10.4` `pīti me upapajjatha`, `cp14:8.4`) hoặc cầu nguyện (“nguyện khởi lên”). Ở đây là lời tuyên thệ chân thật đặt trước kết quả (22.4 là lời hứa tương lai, 26.3–26.4 mới thấy mắt) nên chọn nghĩa cầu nguyện, tương tự `ja489:3.2` `uppajjataṁ` “nguyện … sinh ra”. Cách đọc quá khứ làm nghĩa khoá lệch hẳn nên đáng ghi lại; cả hai đều khớp chuyện (Sivi nhận lại hai mắt) nhưng không khớp thứ tự thời gian.
  14. `Na cāgamattā paramatthi kiñci` (30.1): `cāgamattā` có thể là `cāga` + `matta` (“độ lượng, mức”), nghĩa “không có gì cao hơn mức bố thí”, hoặc `cāgā` với `matta` là chữ hạn định; dịch “Không có điều gì cao hơn sự bố thí”. `Maccānaṁ idha jīvite` (30.2): sở hữu cách số nhiều của `macca`, “đối với người phàm trong đời sống này”.
  15. `Amānusaṁ cakkhuṁ` (30.4): “con mắt không thuộc loài người” (không dịch là “thiên nhãn”, vì Pāli dùng `amānusaṁ`, không dùng `dibba` ở khoá này; ở `26.4`, `28.4` mới có `dibbāni` “cõi trời”).
  16. `Dassanaṁ anubhontu te` (27.4) và `dassanaṁ anubhonti me` (29.4): `anubhoti` “trải nghiệm, thụ hưởng”; dịch “cho ngài/ta được thấy”, chủ ngữ là đôi mắt (`nettāni` 26.3). Cách đọc sát chữ hơn là “chúng hãy trải nghiệm sự thấy cho ngài”.
  17. `Tadiṅgha` (28.3) → “Vậy nào”, tiểu từ thúc giục; `mamajja` = `mama ajja`.

