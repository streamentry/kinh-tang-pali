notes: |-
  `Pārāvatajātaka` (số 10) trong `Kharaputtavagga`, `Chakkanipāta`. 41/41 khoá. **Đây là bài khó nhất của lát và là bài có điểm thấp nhất — ghi rõ để không ai tưởng là cẩu thả.**

  **Vì sao tên bài là *Kinh Chim Bồ Câu* chứ không phải *Kinh Pārāvata*.** `Pārāvata` **không bao giờ** xuất hiện như một từ đứng riêng trong Pāli của chính bài này (chỉ ở `:0.4` `10. Pārāvatajātaka` và `:7.1` `Pārāvatajātakaṁ dasamaṁ.`), nên `_hvi.lọt_pāli` chặn dạng ngắn: nó chỉ tha từ có dấu Pāli khi từ đó **đã** có trong tầng Việt hoặc **đã** nằm trong chính Pāli của segment đó. Đo trên toàn tầng, `Pārāvata` chưa từng được dùng ⇒ dạng "Kinh Pārāvata" không qua được cổng. Tầng `name/` đã ghim cho `ja395` → **"The Dove"**, nên đã dịch nghĩa thay vì giữ tên: `0.4` → *10. Kinh Chim Bồ Câu*, `7.1` → *Kinh Chim Bồ Câu, thứ mười.* Hai chỗ này khác 371 tệp `ja` dùng mẫu *N. Kinh <tên>*, và **mẫu đó cũng không cứu được** vì `ja418:0.4` (*Kinh Aṭṭhasaddajātaka*) và `ja424:0.4` (*Kinh Ādittajātaka*) giữ cả đuôi `jātaka` chính là để qua cổng này — nhưng giữ `Pārāvatajātaka` thì người đọc mất tên. Đã chọn dịch nghĩa theo tầng `name/` đã ghim và ghi lại đây; tên Pāli `Pārāvata` nằm trong `notes` này.

  **Ba tầng tham khảo đều vắng** (xem `blocking_errors`). Không có một câu nào trong bài được Sujato dịch, nên **mọi** khoá phải đứng vững bằng Pāli root + tiền lệ trong tầng. Đây là lý do `triangulation` = 7.0 (thấp nhất lát) và `ambiguity_integrity` = 8.2.

  **Pāli trùng nguyên văn: 6/41 khoá.** `1.1` `“Cirassaṁ vata passāmi,` trùng byte-for-byte `ja294:3.1` → lấy y hệt (*Lâu lắm rồi nay tôi mới thấy*). `0.1` theo 384:16; `0.2` theo 16/16 trong lớp `ja` (*Bộ Sáu Bài Kệ*); `0.3` theo 8/8 (*Phẩm Kharaputta*); `8.1` `Tassuddānaṁ` theo đa số 51/181 (*Tóm lược:*); `10.1` `Atha vagguddānaṁ` theo 3/4 (*Và tóm lược các phẩm:*).

  **Bốn chỗ tôi KHÔNG dám khẳng định, ghi thay vì làm cho nó nghe chắc.** (1) `1.2` `sahāyaṁ maṇidhārinaṁ` — `maṇidhārin` là kẻ lấy mất vị ngọt ở nơi có `maṇi`; dịch *người bạn đã lấy mất vị ngọt ấy* là cách đọc bám nghĩa `loma` (thịt quả dịch) ở `2.4`/`3.1`/`5.1`, nhưng bài không có văn xuôi kể trước nên không kiểm được bằng context. (2) `1.3`–`1.4` `Sukatā massukuttiyā, / sobhate vata me sakhā` — `Sukatā` là tế danh, `massukuttiyā` là mùi thơm của tôi; dịch *này người ngọt ngào của tôi, / ôi, người bạn của tôi đẹp quá*. (3) `2.1` `Parūḷhakacchanakhalomo` — đọc là "trụi hết lông, lông nách và móng", giữ nguyên lặp của Pāli. (4) `6.1`–`6.2` `Tvaññeva maṇinā channo, / Sukatāya ca massuyā` — đọc `massuyā` là "hương thơm của ta"; có thể là công thức xưng hô riêng, chưa phân xử được.

  **Kệ `udāna` `9.1`–`9.4` rối, đã dịch theo kiểu liệt kê của `ja340:7.1`–`7.4`:** `mayhakapañcamapakkhivaro` ở `9.2` là chuỗi rối, đã dịch *chùy của ta, bậc tối thượng trong nhóm năm con* và **ghi rõ là cách đọc**, không khẳng định. `9.4` `kapotavarena` = "bởi bồ câu tuyệt nhất", `dasāti` = "ấy là mười bài" (mẫu `ja385:9.4`).

  **Dấu lược:** không segment nào có `…pe…`; cả hai phía 0.

  `npm run validate|test|check|build` không chạy (BRIEF cấm); `technical_integrity` = 9.6 vì các chốt tự động đã xanh và cổng `npm` chưa chạy.

  Sửa lan 2026-10-13 (accuracy fix; 1.2–6.4 đổi, 1.1 và các khoá sau 7.1 giữ nguyên). Mục này THAY «Bốn chỗ tôi KHÔNG dám khẳng định» (1)–(4) ở trên: cách đọc cũ «vị ngọt», «thịt quả dịch», «hương thơm của ta» đều sai, từ loma (2.4, 3.1) là LÔNG, không phải «thịt quả dịch»; massukutti là sự tỉa râu. Trước → sau: 1.2–1.4 «người bạn đã lấy mất vị ngọt ấy; / này người ngọt ngào của tôi, / ôi, người bạn của tôi đẹp quá» → «người bạn đeo ngọc; / với bộ râu được tỉa khéo léo, / bạn của tôi trông thật rạng rỡ» (maṇidhārinaṁ = đeo ngọc; sukatā massukuttiyā = với bộ râu tỉa khéo); 2.1–2.4 «Tôi trụi lông, trụi lông nách, trụi móng, / … siêng phụng sự làm việc từ thiện; / Gặp được thứ ấy sau thời gian dài dằng dặt, / hôm nay tôi sẽ mang cái thịt quả dịch ấy đi» → «Lông nách, móng và lông trên thân tôi đã mọc dài, / mà tôi lại bận rộn với công việc; / lâu lắm mới gặp được người thợ cắt tóc, / hôm nay tôi đã nhờ cắt bỏ số lông ấy» (parūḷha = mọc dày dài, không phải «trụi»; kammesu byāvaṭo = bận rộn với công việc; nhāpitaṁ = thợ cắt tóc, như dn12:4.1; hārayiṁ = đã nhờ cắt bỏ); 3.1–3.4 «Tại sao ngươi lấy cái thịt quả dịch ấy? … tiếng kim loại va vào nhau trong cổ?» → «Bạn đã cắt bỏ lông ấy rồi, / vì gặp được thợ cắt tóc khó tìm; / vậy thì, bạn ơi, / cái gì kêu leng keng nơi cổ bạn?»; 4.1–4.4 «Người loài người vốn mỏng manh… Ta nói cho ngươi lý do, đừng nghĩ như đã xong ngay lập tức» → «Ở những người quen sống nuông chiều giữa loài người, / ngọc đeo lủng lẳng nơi cổ; / tôi học theo họ, / bạn chớ nghĩ rằng tôi làm để đùa chơi» (anusikkhāmi = học theo; davā kataṁ = làm để đùa chơi); 5.1–5.4 «Nếu ngươi muốn cái thịt quả dịch ấy, vị ngọt đã được chuẩn bị khéo léo…» → «Nếu bạn cũng thèm muốn / kiểu râu được tỉa khéo này; / bạn ơi, tôi sẽ cho người làm cho bạn, / và tôi cũng sẽ cho bạn cả viên ngọc» (kārayissāmi = sẽ cho người làm); 6.1–6.4 «Chính ngươi, dây chuyền ngọc trai thật đẹp, hương thơm quý của ta; Hãy đi nào, món ăn của ta, ta thích được thấy ngươi» → «Chính bạn mới được tô điểm bằng viên ngọc, / và bằng bộ râu được tỉa khéo; / Tôi xin từ biệt bạn để đi, / được thấy bạn là điều tôi quý mến» (āmanta kho taṁ gacchāmi = tôi xin từ biệt bạn để đi, khớp ja458:16.3 «tôi xin từ biệt nàng để đi»; không phải «món ăn của ta»). Xưng hô thống nhất «tôi/bạn» cho cả hai nhân vật (trước đây lẫn «tôi/ta/ngươi»), cùng cách với ja275. 1.1 giữ nguyên văn «Lâu lắm rồi nay tôi mới thấy» (trùng sn1.1:2.1, ja294:3.1). Ai nói với ai suy từ truyện dẫn (bản Anh Jātaka tập III, Francis–Neil 1897, chỉ để biết người nói): 1, 3, 6 là bồ câu, 2, 4, 5 là quạ. Bất định, không đưa vào thân kinh: (a) yannu (3.1) đọc «đã (cắt)» theo mạch; (b) 6.4 piyaṁ me tavadassanaṁ dịch sát chữ («được thấy bạn là điều tôi quý mến»), bản Anh Francis–Neil dịch câu này theo giọng mỉa («troublesome»), nhưng Pāli piyaṁ là «đáng quý», nên giữ sát chữ; (c) channo (6.1) đọc «được tô điểm». 8.1–12.1 (kệ uddāna) CHƯA đọc lại: cách dịch cũ ở 9.1–9.4 («kim khâu», «chiếc ả đồi quay», «bình nước, đám mây») đáng ngờ vì từ khoá bị dịch thành danh từ thường. Pāli trùng nội bộ: 0 cặp. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại; technical_integrity giữ nguyên.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 19 khoá chênh lệch lớn nhất → khác nghĩa 9: sửa 6 (`9.1`–`9.4`: *kim khâu, chiếc ả đồi quay, bình nước, đám mây, giữa chừng, Vaṭṭaka bởi bồ câu tuyệt nhất* → *Passa, Sasūci, Tuṇḍilaka / Miga, Mayhaka là thứ năm, Pakkhivara / Pañjali, Vārija, Mejjha / Vaṭṭa, cùng Kapotavara*: đây là kệ tên các bài của phẩm, từ khoá phải giữ dạng tên như `ja375:9`, `ja385:9`, `ja405:11` chứ không dịch thành danh từ thường — `tuṇḍilako` không phải *ả đồi quay*, `pañjali` không phải *bình nước* và `vārija` không phải *đám mây*; `11.1`: *hãy học thuộc phẩm ấy* → *Giờ đây ta sẽ tuyên nói về các phẩm*, vì `pakittissaṁ` là tương lai ngôi thứ nhất *ta sẽ tuyên nói*, không phải mệnh lệnh; `11.2`: *phẩm tối thượng trong sáu phẩm* → *trong Bộ Sáu Bài Kệ tối thượng*, vì `chanipātaṁ` là Bộ Sáu chứ không phải *sáu phẩm*, cùng cấu trúc `ja416:12`), giữ 3 (`11.3`–`11.4`: bản mù đọc `subyañjanā` là tên bài thứ ba, sai — đó là tính từ *văn cú tốt đẹp* của hai phẩm; `10.1`: bản mù thêm chữ *của phẩm* không có trong Pāli), 10 khoá còn lại (`0.4`, `7.1`, `1.3`, `1.4`, `2.1`, `2.4`, `3.1`, `4.1`, `5.1`, `6.1`) chỉ khác diễn đạt, cùng nghĩa với bản dự án; bất định 2 (`6.1` `channo`: *được tô điểm* hay *che phủ/hợp với*; `11.2` `varuttame`: làm định ngữ của Bộ Sáu hay một cách đọc khác của cú pháp kệ tổng kết, bản mù cũng ghi chưa chắc). Review đối kháng toàn bài (41 khoá): nháy kép mở và đóng đúng từng kệ, không có dấu lược, không có số đếm; xưng hô *tôi/bạn* nhất quán; không phát hiện lỗi nào khác ngoài các khoá đã sửa. Không có bản Anh hay bản Việt độc lập khác; chỉ có một lần dịch lại cùng họ công cụ nên `triangulation` không vượt 8,0.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; đoạn song song ja476:1.2, ja484:14.4, ja489:25.4, ja480:10.6): sửa 2 khoá — 6.4 sai nghĩa (đảo ý): Pāli ghi liền `tavadassanan`, trong khi cùng ấn bản viết tách `tava dassanaṁ` ở mọi chỗ nghĩa "được thấy ngươi" (ja476:1.2, ja484:14.4, ja489:25.4); viết liền là sandhi `tava` + `adassanaṁ` "không thấy bạn", khớp với 6.1–6.3 (bồ câu từ chối lời mời, từ biệt mà đi) và lời mỉa đã ghi ở notes cũ; đổi "được thấy bạn là điều tôi quý mến" → "không thấy bạn là điều tôi ưa”." (kiểu `sādhu tassa adassanaṁ`, ja480:10.6). Cách đọc cũ vẫn là khả năng về chữ nếu ấn bản viết liền không có chủ ý; ghi ở đây. 4.1 "Ở những người quen sống nuông chiều giữa loài người" vụng, đổi "Với những người được nuông chiều trong loài người" (nghĩa không đổi). Giữ các khoá còn lại; uddāna 9.1–11.4 giữ như lượt 2026-10-14. Bổ sung: đã quét có hệ thống Pāli trùng toàn kho; 1.1 khớp ja294:3.1, sn1.1:2.1; 6.3 khớp ja458:16.3; cộng các chỗ `tava dassanaṁ`/`adassanaṁ` nêu trên.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2`, `12.1`, `11.2` (tên nipāta "Nhóm N Kệ").
