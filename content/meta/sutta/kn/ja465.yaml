      *rơi nước mắt*, `ja523:34.4`). Hai vế khớp nhau: người mở lời hỏi một người mặc y phục trắng
      trinh đứng giữa trời **vì sao nước mắt kia lại rơi**. Cách đọc "sạch/sắc" cho `suddha` và
      "vũ khí" cho `vatthehi` đã bị tôi loại **sau khi đo**: nó làm `assūni` thành vô nghĩa trong
      câu đó. Đây là lý do tôi dịch `1.1` và `1.3` như trên, chứ không phải suy đoán.
  (2) **`vehāyasaṁ ṭhitā`** (`1.2`) — `vehāya` có **hai** nghĩa đều có chứng cứ trong tầng: *đoàn tùy
