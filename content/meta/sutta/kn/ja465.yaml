      `vv60`). Tôi chọn **đoàn hộ giá** vì hậu tố `-saṁ` ở đây là *cùng với*, và vì `ṭhitā` là *đứng*.
      Người biên tập có thể chọn *bay*; khác biệt chỉ ở một cụm.
  (3) **`kā tvaṁ suddhehi vatthehi`** (`1.1`) — `vattha` còn nghĩa **bình chất** (tiền lệ
      `snp2.7:5.1` *với các bình chất khác nhau*, `tha-ap407:51.3` *cùng với bình chất đựng thức ăn*).
      Tôi chọn **y phục** vì bối cảnh một vị thần hiện ra bên gối giường nhà vua giữa đêm; nếu
      *bình chất* thì câu ấy phải nói về một người đang nấu ăn, mà toàn bài không có cảnh đó. Tôi
      ghi rõ là chọn theo bối cảnh, không phải đã chứng minh.
  (4) **`sarīrena vinābhāva`** (`6.2`) — `vinābhāva` không phải hapax (**16** nơi, nghĩa *hủy diệt*),
      nhưng `sarīrena` ở đây là **hapax** và `sarīra` có hai nghĩa: *chủ nhân* và *chồng*. Tôi chọn
      *chủ nhân* vì người nói ở đây là thân cây, không có chồng. Câu này còn phải nối với `me` ở `7.3`
      (`Evaṁ me chijjamānassa`) để hiểu là người nói nói về chính mình.
  (5) **`Ceteyyarūpaṁ cetesi`** (`12.1`) — **1** nơi trong toàn bộ Pāli ghim. Tôi dịch *Dù hình hài
      nào, cứ hành động đi,* theo nghĩa từng thành phần. Cách đọc khác (`cetesi` = *ngươi sẽ nghĩ*)
      cho *Dù hình hài nào ngươi nghĩ,* cũng có thể; tôi chọn cách hành động vì nó khớp với cặp
      *Hitakāmosi… / abhayaṁ samma dammi te* ở hai câu sau, tức một lời trao phúc lành cho bạn.
      Tôi **không** nêu tên người nói câu này trong bản dịch, vì Pāli ghim cũng không nêu. 🔴 Ở đúng chỗ
      này bản dịch Rouse **lệch với Pāli ghim**: nó đặt lời thoại cuối vào miệng vua (*thy thoughts
      must noble be…*) và không có câu *ta ban cho ngươi trọn vẹn sự không-sợ-hãi*. Theo
      `AGENTS.md` thì Pāli ghim là authority, tôi dịch theo Pāli ghim — nhưng ghi lại ở đây vì đó là
      chỗ hai bản thật sự khác nhau, không phải chỗ tôi diễn đạt khác.
  (6) **`agāre ca disampati`** (`3.2`) — `disampati` là tên một vua (tiền lệ `dn19`, đã dịch là *vua
      Disampati*), và ở đây đứng cạnh `agāre` như một danh từ. Tôi giữ *vua Disampati* và thêm *cai trị*
      để câu tiếng Việt đứng vững; nếu người biên tập muốn đọc `disampati` như danh từ chung *một vị
      vua cai trị* thì cũng được — tôi **không** chọn cách đó vì nó làm mất tên riêng đã có tiền lệ.
  (7) **`vanappati`** (`9.2`, `12.2`) — đo **7** nơi; tiền lệ sát nhất `ja74:1.4` dịch là *chúa rừng*.
      Ở đây `bhaddasāla vanappati` là cách xưng hô *ông chúa*, nên tôi viết *ông chúa Bhaddasāla*
      thay vì *chúa rừng*.
  (8) **`kā tvaṁ`** (`1.1`) — Pāli ghim dùng `kā` ở đây là *ai thế này* (câu hỏi về danh tính), không
      phải *vì sao*; tôi dịch *Ngươi là ai*. Câu hỏi *vì sao* của bài nằm ở `1.3` (*Vì sao nước mắt…*),
      nên hai khoá không lặp nhau.

