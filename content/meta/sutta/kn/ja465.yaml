  *Ngoài phạm vi (báo, không sửa).* `ja412:4.2` (`mama passe nivātajā`) và nhiều khoá khác của `ja412` dịch
  lệch hẳn (vd. `ja412:1.3` *cái giường, tấm nệm lớn*) — nên kiểm toán riêng.

  **Đối chiếu bản dịch mù độc lập 2026-10-14.** Một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 16/55 khoá chênh lệch lớn nhất → khác nghĩa 0: sửa 0, giữ 16 (`10.1`–`10.2` `hetuṁ dhammūpasaṁhitaṁ`: hai bản cùng đọc *lý do gắn với Pháp*; `4.1`: bản mù *không thấy cây nào như thế*, bản dự án *chưa từng thấy ai như ngươi*, giữ vì đó là cách nói quen thuộc của `Taṁ ivāhaṁ na passāmi`; `6.2`, `6.4`, `11.1`, `9.1` chỉ khác diễn đạt; `11.4` bản mù ghi không chắc nhưng cách đọc *chưa quen chịu khổ do kẻ khác gây ra* trùng), bất định 2 (`4.4` `jātiyā`: *từ khi sinh ra* hay *theo loài/giống*; `6.1`–`6.2` `sarīrena vinābhāvo`: nội dung của ý nghĩ hay cụm độc lập; cả hai đã đọc theo cách ít giả định nhất). Rà đối kháng toàn bài (nháy, số `saṭṭhi vassasahassāni` = sáu mươi ngàn năm, xưng hô `deva`/`disampati`, thuật ngữ `vanappati`/`yakkha`, danh sách `10.1`–`11.4`) không thấy lỗi thật nào thêm. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài, không có đoạn song song): sửa 1 khoá — 2.4 `tiṭṭhato pūjitassa me` "khi tôi đứng đó và được tôn kính." → "tôi đã đứng đó và được tôn kính." (câu cũ chỉ có mệnh đề phụ "khi…" rồi chấm câu, 2.3–2.4 không có mệnh đề chính).
  Giữ 3.2 "tâu đấng chúa tể bốn phương" cho `disampati`: kho đang lệch ("chúa tể các phương" 7, "chúa tể bốn phương" 5, "đấng chúa tể bốn phương" 4) — việc thống nhất để người biên tập chốt chung, không sửa lẻ. Đọc lại 55/55 khoá: không thấy lỗi nghĩa mới. Bất định còn lại như mục trước: 4.4 `jātiyā`, 6.1–6.2 `sarīrena vinābhāvo`, 11.4 `asukhocitaṁ`, 12.1 `ceteyyarūpaṁ`.

  Lô G4 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): sửa khoá 3.2. disampati (disā + pati, chúa tể
  các phương): kho dịch ba cách; Pāli disā không mang số bốn nên thống nhất chúa tể các phương, bỏ số
  bốn thêm vào, cho ja465, ja494, ja532, ja541 khớp ja332, ja351, ja422, ja452, ja483, ja505, ja509,
  ja539. Ở dn19 Disampati là tên riêng, giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: C2 — `13.1` (dòng kết thêm dấu phẩy: "…, thứ N."); C3 — `0.2` (tên nipāta "Nhóm N Kệ").

