  Mẫu số bằng 0 ⇒ cổng **không đo được gì**; đó **không** phải *đã đủ tham khảo*, và cũng **không**
  phải câu *"không cần ghi nhận gap"*. `validate.ts` có điều kiện `substantiveSegments > 0` nên cổng
  không đỏ — tôi ghi ra đây để không ai đọc cổng xanh là bằng chứng đã đối chiếu Anh.

  (3) **`triangulation` bị chặn ở 7.0.** Không có bản Anh độc lập nào để đối chiếu. Tôi **không**
  tuyên bố bài này đã đối chiếu English. Nguồn đối chiếu là Pāli ghim cùng commit, tiền lệ đếm được
