  PĀLI THẮNG Ở 6.1: bản Anh đã ghim dịch Tato satthā nirākatvā là the Teacher didn’t neglect me, tức bỏ mất nghĩa bậc Đạo Sư bước ra khỏi chỗ độc cư; 6.3 bản Anh cũng bỏ chủ ngữ. Dịch theo Pāli. Đây là disagreement thật đã phân xử bằng Pāli.
  BẤT ĐỊNH 1.3–1.4: Bahūhi vatacariyāhi dịch nhờ nhiều lễ lạt (vatacariya = lễ tu, phép tu hành) và laddho āyācanāhi ca dịch cũng nhờ cầu xin (āyācana → cầu xin, tiền lệ đo được 20 chỗ). Hai cụm Pāli là hai nguyên nhân khác nhau nên tách thành hai vế, không gộp làm một.
  BẤT ĐỊNH 3.3: nātha dịch bậc Bảo Hộ, theo tiền lệ Nāthavagga → Phẩm Bảo Hộ (10 lần); không có tiền lệ nào cho nātha gọi thẳng là Chúa ơi (đếm được 0 lần) nên không tự đặt.
  CÓ CHỦ ĐÍCH lệch tiền lệ ở 3.4 và 5.2: cả hai cùng nói về jina, mà tiền lệ khít cho vihāraṁ pāvisī jino. là bậc chiến thắng bước vào tu viện. Để hai khoá trong cùng một bài đồng nhất, dùng Đấng Chiến Thắng ở cả hai (đo được 21 lần Đấng Chiến Thắng so với 25 lần bậc chiến thắng). Chỉ lệch MỘT CHỮ so với tiền lệ.
  4.4 hessatyājāniyo ayaṁ dịch người này sẽ thành một bậc tuấn mã — giữ ẩn dụ ngựa thuần chủng như Pāli (tuấn mã đo được 7 lần) và KHÔNG dịch thành A-la-hán, vì Pāli không nói arahant.
  5.2 vihāraṁ dịch tu viện (khớp tiền lệ), 6.2 paṭisallāna dịch độc cư (đo được 224 lần, còn tịnh mật 0 lần). Câu 6.1–6.2 lặp ý trong Pāli (nirākatvā rồi paṭisallānavuṭṭhito đều là ra khỏi chỗ độc cư) nên tách mỗi khoá một ý, không nén.
  Lặp ý ở 6.4 và 7.2 (āsūpasampadā rồi upasampadā) là LẶP CỦA CHÍNH PĀLI, bản Anh đã ghim cũng dịch lặp. Giữ nguyên, KHÔNG nén bằng dấu lược.
  Nháy kép: một cặp kép mở ở 1.1 và đóng ở 7.4, đúng như Pāli; ba cặp nháy đơn ở 3.1–3.4, 4.3–4.4 và 6.3 (cặp thứ ba đóng ngay trong chính 6.3). Cân trên cả bài và bằng đúng số cặp của Pāli. 7.5 có HAI dấu lược ở Pāli, giữ đúng hai, không mở rộng.
