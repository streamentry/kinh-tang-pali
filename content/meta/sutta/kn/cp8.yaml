notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh của Bhikkhu Sujato tại cùng commit bilara. Tại commit đã ghim không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya, nên không có tầng Việt truyền thống để so; tầng `english-project` cũng không có gì cho bài này.

  PHẠM VI. Bài đủ 69 khoá, khớp tập khoá Pāli, theo đúng thứ tự Pāli, không có khoá ngoài tập. Không có dấu lược `…` ở khoá Pāli nào nên bản Việt cũng không có.

  COVERAGE ANH, đo theo công thức của `source/layers.yaml` (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`): mẫu số = 0, vì toàn bộ 65 khoá thân bài (kệ và câu kết) đều ngắn hơn 40 ký tự (dài nhất 26 ký tự). Cổng coverage vì vậy KHÔNG đo được gì ở bài này; đây không phải là "không cần ghi nhận gap". Đo thô thay thế trên khoá thân bài: Sujato có chữ Anh ở 64/64 khoá kệ `:1.1`–`:16.4` (ratio thô 1,0000) và để trống đúng một khoá là `:17.1` (câu kết Sivirājacariyaṁ aṭṭhamaṁ), dịch từ Pāli một mình theo khuôn các hạnh cp1–cp7. Tổng số khoá có chữ Anh: 68/69 (kể cả 4 khoá tiêu đề `:0.x`).

  TIỀN LỆ, có số đếm. Quét 65 khoá thân bài + 4 khoá tiêu đề so với toàn tầng Việt hiện có: 10 khoá thân bài có Pāli trùng nguyên văn với nơi khác trong tầng. Dùng lại nguyên văn bản dịch ở 8 khoá: `:1.3`/`:4.1` Nisajja pāsādavare → Ngồi trên lầu cao tráng lệ (tha-ap126:1.1; tha-ap368:2.1 dịch khác vì câu đi kèm); `:1.4` → thuở ấy ta đã suy nghĩ như vầy (cp25:3.2, tha-ap83:2.2); `:3.1` Mama saṅkappamaññāya → Nhờ thấu rõ ý định của ta (hơn 20 khoá Apadāna dùng đúng dạng này, nên giữ chữ Nhờ dù chủ thể ở đây là Sakka); `:10.1` → Nghe lời ấy của người ấy (10 khoá thig/pv/tha-ap); `:10.4` → ta đã nói lời này (cp19:9.4); `:15.4` bodhiyāyeva kāraṇā → chỉ vì một mục đích duy nhất là giác ngộ (cp21:5.4, cp14:10.4); `:16.3` Sabbaññutaṁ piyaṁ mayhaṁ → Mà vì Nhất Thiết Chủng Trí là điều quý báu nhất đối với ta (cp21:6.3, cp23:10.3; cp5:3.3 dịch khác, tôi thương yêu điều toàn biết, là bài đơn lẻ). Hai khoá lệch với tầng: `:3.4` và `:7.4` idaṁ vacanamabravi → đã nói lời này, trong khi tha-ap326:4.4 (1 khoá) viết rồi nói lời này; tôi bỏ chữ rồi vì Pāli không có trình tự thời gian. Trong chính bài: 1 cặp Pāli trùng (`:3.4` và `:7.4`), 0 cặp bản Việt khác nhau. Pāli `:1.3` và `:4.1` chỉ khác dấu nháy mở, bản Việt khác nhau đúng chỗ đó. Tên khoá: `:0.1` Cariyāpiṭaka → Hạnh Tạng và `:0.2` Akittivagga → Phẩm Akitti theo cp1–cp7; `:0.3` Dānapāramī 8 → Bố Thí Ba-la-mật Thứ Tám theo khuôn cp1, cp3, cp5, cp7; `:0.4` và `:17.1` theo khuôn Hạnh Của Vua Nimi (cp6) và Hạnh của vua Kururāja, thứ ba (cp3).

  THUẬT NGỮ, có số đếm (toàn tầng Việt hiện có). khattiya → Sát-đế-lợi (423 khoá viết hoa, 25 khoá viết thường). mahiddhika → có đại thần thông (cp12, cp13, cp18). sabbaññutā → Nhất Thiết Chủng Trí (cp1, cp21, cp23; cp5 là bài đơn lẻ viết toàn biết). dessa → ghét bỏ (cp21:6.1, cp23:10.1). añjali → chắp tay (tha-ap244, thig5.9, tha-ap87 và hàng chục khoá khác). haṭṭho saṁviggamānaso → hoan hỷ, tâm xúc động (tha-ap445:2.4). tālamiñja → cùi quả thốt nốt (tāla được dịch thốt nốt ở 41 khoá viết thường, 3 khoá viết hoa; cây tala 3 khoá). sakko devānamissaro → Sakka, chúa tể chư thiên (ja391:2.4 dịch Sakka, chúa tể của ba mươi ba vị trời; ja301:3.2 dịch Thiên chủ Sakka; ja300:2.1 dịch Đế Thích; giữ Sakka theo cp33 và ja264, ja391). mahārāja → tâu đại vương (mil5.1.5). nettā nayanā → con mắt dẫn đường (Pāli dùng hai từ đồng nghĩa chỉ mắt; netta cũng là người dẫn đường).

  KHÔNG CÓ SỐ PĀLI nào trong bài (ekaṁ, ubho là số một và hai: một con mắt ở `:9.3`, cả hai con mắt ở `:9.1`, `:13.3`, `:16.1`), nên không có phép tính số lớn. Nháy: Pāli có cặp ngoặc kép mở ở `:1.1` đóng ở `:16.4`, cùng ba cặp nháy đơn mở ở `:2.1`, `:4.1`, `:8.1`, `:11.1`, đóng ở `:2.4`, `:5.4`, `:9.4`, `:13.4`; bản Việt khớp từng khoá, 0 lệch trên 69 khoá. Cặp Pāli↔Việt đã in ra đọc từng khoá.

  BẤT ĐỊNH ĐÃ GHI (không đưa vào thân kinh). (a) `:14.4` tālamiñjaṁva yācake: Sujato bỏ so sánh này và dịch he presented them to the trembling supplicant; tôi giữ so sánh như quả thốt nốt theo đúng chữ, nhưng Pāli không rõ so sánh này gắn với việc móc mắt ra hay với việc trao cho người xin, nên đặt nó giữa hai mệnh đề theo thứ tự Pāli. (b) `:16.2` attā na me na dessiyo: hai chữ na liền nhau có thể đọc là phủ định kép; tôi theo Sujato và mạch song song với `:16.1`, đọc là cũng không phải ta ghét bỏ chính mình. (c) `:8.2` dhammika raṭṭhavaḍḍhana: tôi đọc là hai từ xưng hô cho nhà vua (bậc công chính, đấng làm hưng thịnh quốc độ); Sujato dịch như một mệnh đề về chính trị công bằng làm quốc độ hưng thịnh. (d) `:8.3` Tava dānaratā kitti: dānaratā là tính từ nữ khớp với kitti; tôi dịch danh tiếng về sự ưa thích bố thí của ngài. (e) `:2.3` và `:16.4` cakkhuṁ số ít: ở `:2.3` tôi giữ một con mắt (đúng số ít; `:9.3` nayanaṁ cũng số ít, đúng lời xin một mắt); ở `:16.4` đi sau ubho cakkhū của `:16.1` và sau việc móc cả hai mắt ở `:13.3`–`:14.3` nên dịch đôi mắt; Pāli dùng cakkhuṁ như danh từ chung. (f) `:15.1` dadamānassa dentassa: hai phân từ hiện tại gần nghĩa nhau, Sujato dịch while planning to give, while giving; tôi giữ khi đang cho, khi đang trao, không thêm ý định trước. (g) `:13.1` Sivaka: tôi hiểu là tên người thực hiện việc móc mắt theo lệnh vua (vị này khác với vua Sivi), theo `:14.2` sivako vacanaṁ karo; Pāli trong bài không nói rõ nghề của ông. (h) `:11.3` Tvaṁ mama cittamaññāya: tôi dịch ông biết rõ tâm ý của ta mà đến xin; câu không nói người xin thật sự là Sakka (điều đã nêu ở `:3`–`:6`).

