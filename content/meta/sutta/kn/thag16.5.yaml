notes: |-
  Phạm vi: đủ 125/125 khoá của bài (4 khoá `:0` tiêu đề, 120 khoá kệ `1.1`–`24.6`, `24.7` dòng bìa), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã đọc đối chiếu cả 125 cặp Pāli↔Việt, không đọc mẫu. Đây là kệ thứ hai của Trưởng lão Mālukyaputta (lần thứ nhất ở `thag6.5`). Toàn bộ 20 kệ `1`–`24` là đoạn kệ mà Tôn giả Māluṅkyaputta trình bày ở `sn35.95` (kệ tóm lược, sáu căn, sáu cặp kệ xấu và tốt), nên bài này lấy lại cách dịch của `sn35.95` đã published cho các dòng Pāli trùng, rồi đo lại từng dòng.

  ⚠️ MẪU SỐ COVERAGE THEO CỔNG = 0 — CỔNG NÀY KHÔNG ĐO ĐƯỢC GÌ. `source/layers.yaml` đặt `substantivePaliMinChars: 40` và bỏ khối `:0`. Khoá Pāli dài nhất của bài chỉ 30 ký tự (mỗi pāda một khoá), nên 0 khoá đạt ngưỡng. Đây là "không đo được gì", không phải "không cần ghi nhận gap". Tôi không dùng nó làm căn cứ publish mà đo thô riêng như dưới đây.

  COVERAGE ENGLISH THÔ (do người biên tập tự phán) — tra tầng đã ghim, không suy từ tên thư mục. `english-sujato` có tệp cho bài này (`sutta/kn/thag/thag16.5_translation-en-sujato.json`), cùng đúng 125 khoá ID với Pāli, cùng thứ tự. Trên 121 khoá thân (bỏ 4 khoá `:0.x`), Sujato có prose ở 120/121 = 0,992; trên mọi 125 khoá: 124/125 = 0,992. Ngưỡng 0,80 của kho đạt trên phép đo thô này. Khoá duy nhất Sujato để trống là `24.7` (dòng bìa `… Mālukyaputto thero ….`). `english-project`: không có tệp cho bài này (không cần lấp). `vietnamese-current`: vắng tại commit đã ghim (bilara chỉ có Pháp Cú). Bản Việt nguyên bài của sc-data chỉ dùng tra cứu toàn văn, không căn lề theo khoá, không tính là tầng tham khảo. Không có entry trong `reference-gaps.yaml` cho bài này; mẫu số bằng 0 nên cổng không có gì để ghi nhận.

  CẤU TRÚC VÀ NHÁY. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá). Pāli của bài chỉ có một dấu mở `“` ở `1.1` và một dấu đóng `”` ở `24.6`; cả 24 kệ nằm trong một lời nói liền. Pāli không có nháy đơn nào. Bản Việt theo đúng Pāli từng khoá, nên khác `sn35.95` ở hai chỗ nháy: `sn35.95` bọc đoạn trích kệ bằng nháy đơn lồng trong lời nói, còn ở đây là lời nói chính nên dùng nháy kép.

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 125 = Pāli 125, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
    2. Nháy đơn và kép khớp Pāli từng khoá: 0/125 lệch. Tổng: `“` 1/1, `”` 1/1, `‘` 0/0, `’` 0/0 (Pāli/Việt).
    3. Pāli trùng nguyên văn TRONG CHÍNH bài: 15 nhóm, 225 cặp (sáu bài kệ cảm giác lặp theo công thức), 0 nhóm bản Việt khác (so sau khi bỏ dấu câu và hoa thường). Pāli trùng ở bài khác: 108 khoá thân có tiền lệ, 641 cặp, 629 cặp bản Việt trùng với bản này, 12 cặp khác. 12 cặp khác đều là `Tañca ajjhosa tiṭṭhati` ở các khoá `1.4`, `3.4`, `5.4`, `7.4`, `9.4`, `11.4` so với `thag1.98:1.4` và `thag1.99:1.4`: hai bài kia dịch `rồi vẫn chạy theo đó`, bản này dịch `và bám chặt vào đó` theo `sn35.95` (7 khoá `ajjhosa tiṭṭhati` ở `sn35.95:12.4`, `14.4`, `16.4`, `18.4`, `20.4`, `22.4`, `37.4`) và vì `ajjhosa` ở đây là bám chặt, đắm chấp (Sujato `keep clinging`). Đo hai phạm vi: nhóm Theragāthā 2 khoá `chạy theo`, toàn tầng 7 khoá `bám chặt`. Chọn `bám chặt` vì sát Pāli hơn; `thag1.98:1.4` và `thag1.99:1.4` ngoài lát này, để người biên tập cân nhắc đồng nhất.
    4. Dấu lược: Pāli có `…` ở 1 khoá (`24.7`, hai dấu lược), Việt có đúng khoá đó với hai dấu; `…pe…` 0; `(…)` trần 0 ở Pāli nên 0 ở Việt. Lỗi = 0/125. Khoá bìa `24.7` kết ` ….` (lược rồi mới chấm), đúng dạng đa số của tầng (398/760 khoá Pāli kết `….`) và đúng `thag6.5:6.5`, `thag16.4:25.5`.
    5. Số Pāli (tự tính): trong thân kệ không có số nào. Ngoài thân kệ: `Vīsatinipāta` (`0.2`): vīsati = 20, nipāta = bộ ⇒ Bộ Hai Mươi Bài Kinh, theo `thag16.1`–`thag16.9`. Số `16.5` ở `0.1` là số hiệu bài, giữ nguyên.
    Vệ sinh: JSON hợp lệ, 125/125 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa, 0 khoá Pāli lọt sang Việt ngoài tên riêng (`Theragāthā`, `Mālukyaputta`).

  TIỀN LỆ ĐÃ DÙNG LẠI. Sau khi bỏ dấu câu và chuẩn hoá sandhi (`Evamācinato` là `Evaṁ ācinato`), 119/120 dòng kệ có Pāli trùng một dòng của `sn35.95` (khối `12`–`40`), và bản Việt ở đây trùng bản Việt `sn35.95` ở cả 119/119 dòng đó (sau khi bỏ dấu câu). Dòng còn lại, `20.1` `Yathāssa sāyarato rasaṁ`, khác Pāli của `sn35.95:31.1` (`sāyato`) một chữ và dùng lại cách dịch `Khi vị ấy nếm vị`, xem bất định. `24.1` `Yathāssa vijānato dhammaṁ` trùng Pāli `sn35.95:40.1`, dịch `Khi vị ấy nhận biết pháp`; `sn35.95` phân biệt `jānato` (`Khi vị ấy biết pháp`, ở khối kệ trước) với `vijānato` (`nhận biết`), bản này giữ đúng sự phân biệt đó. `patissato` (bản `sn35.95` ghi `paṭissato`) cùng một từ: `có chánh niệm`.

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `sati muṭṭhā` → thất niệm (7 khoá ở `sn35.95:12`–`22`, `thag1.98:1.1`, `thag1.99:1.1`). `patissato` → có chánh niệm; `sato` (`caratī sato`) → có niệm, theo `sn35.95:25.4`. Sujato dịch các chữ này đều là mindfulness; bản Việt theo `sn35.95` giữ ba mức (thất niệm, có chánh niệm, có niệm) vì Pāli dùng ba cấu trúc khác nhau.
    · `piyaṁ nimittaṁ manasi karoto` → khi chú ý vào một tướng khả ái (cùng cách ở `sn35.95:12.2`, `thag1.98:1.2`, `thag1.99:1.2`). `sārattacitto` → tâm đầy dục ý; `virattacitto` → tâm lìa dục ý (`sn35.95`: 6 khoá mỗi dạng ở `12`–`23` và `24`–`35`). `ajjhosa tiṭṭhati` → bám chặt (xem trên).
    · `vedanā` → cảm thọ; `vedeti` → cảm nhận (người trải qua); `sevato vedanaṁ` → trải qua cảm thọ. `abhijjhā` → tham lam; `vihesā` → sự hại (`an5.200:3`, `an6.13:2.3`, `ne6:14.2` dịch sự hại; `snp2.6` dịch não hại). `cittamassūpahaññati` → tâm của vị ấy bị tổn thương.
    · `ācinato` → tích lũy (đối với `apacinato` → làm tiêu giảm, cùng `sn35.95:25.5`). `ārā nibbāna` → xa Niết-bàn; `santike nibbāna` → gần Niết-bàn. `khīyati nopacīyati` → cạn mòn, không tích lũy.
    · `rūpa`, `sadda`, `gandha`, `rasa`, `phassa`, `dhamma` → sắc, tiếng, mùi, vị, xúc, pháp (như `sn35.95`). `disvā`, `sutvā`, `ghatvā`, `bhotvā`, `phussa`, `ñatvā` → đã thấy, đã nghe, đã ngửi, đã thưởng thức, đã chạm xúc, đã biết.
    · `Vīsatinipāta` → Bộ Hai Mươi Bài Kinh; `Paṭhamavagga` → Phẩm Thứ Nhất; `0.4` → Kinh Kệ Của Trưởng Lão Mālukyaputta, theo khuôn `thag16.1`–`thag16.9`. Tên riêng viết `Mālukyaputta` đúng Pāli của bài này và của `thag6.5`, khác `Māluṅkyaputta` ở `sn35.95` (đo toàn tầng ngoài bài này: dạng `ṅ` ở 7 tệp, dạng không `ṅ` ở 1 tệp là `thag6.5`). Pāli của bài không có dấu `(Dutiya)`; Sujato ghi `(2nd)` để phân biệt với `thag6.5`, bản Việt không thêm vì Pāli không có.

  KHÁC BIỆT ĐÃ PHÂN XỬ (đối chiếu Sujato).
    (1) Ngôi: Sujato dịch `you` (người nói chung, `When you see a sight`); bản Việt giữ ngôi thứ ba `người ấy`, `vị ấy` như `sn35.95`, vì Pāli là `tassa`, `so`, `assa`, không có ngôi thứ hai.
    (2) `2.3`–`2.4`: Sujato nối `The mind is damaged by covetousness and cruelty`; bản Việt giữ hai khoá riêng (`tham lam và sự hại,` rồi `tâm của vị ấy bị tổn thương;`) theo ranh giới Pāli và theo `sn35.95:13.3`–`13.4`.
    (3) `14.3`: Sujato dịch `you wear away, you don't heap up`; bản Việt `thì cạn mòn, không tích lũy`, không nêu chủ ngữ (Pāli `khīyati nopacīyati` không có chủ ngữ), xem bất định.
    (4) `22.2`, `24.2`: Sujato dịch `get familiar with how it feels` cho `sevato vedanaṁ`, còn ở `14.2`, `16.2` dịch `undergo a feeling`; bản Việt giữ `trải qua cảm thọ` cho cả sáu lần như `sn35.95` vì Pāli chữ nào cũng là `sevato cāpi vedanaṁ`.
    (5) `4.5`/`14.5`: Sujato dịch `Heaping up`/`Eroding suffering like this`; bản Việt `Người tích lũy khổ như vậy`/`Người làm khổ tiêu giảm như vậy`, như `sn35.95`.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `20.1` `Yathāssa sāyarato rasaṁ`: `sāyarato` không phải dạng quen (`sn35.95:31.1` và các chỗ khác viết `sāyato`, phân từ của `sāyati` là nếm). `sāyarato` có thể là dạng biến thể của `sāyato`, hoặc có thể đọc `sāyaṁ rato` (ưa thích nếm); Sujato dịch `savor a taste`, nghĩa nghiêng về `nếm`. Dịch `nếm vị` theo `sn35.95` và Sujato; không phân xử được hình thái, chưa có tiền lệ trong tầng cho dạng này.
    · `14.3` `Khīyati nopacīyati`: chủ ngữ ngầm có thể là `vedanā` (các cảm thọ cạn mòn, không tích lũy) hoặc là chính người ấy (Sujato `you wear away`). Bản Việt giữ không nêu, như `sn35.95`.
    · `2.4` `cittamassūpahaññati`: `cittam assa upahaññati` (tâm của vị ấy bị tổn thương), `abhijjhā ca vihesā ca` đứng ở khoá trước. Hai danh từ `abhijjhā`, `vihesā` ở khoá `2.3` có thể được đọc là cái gây tổn thương tâm (Sujato) hoặc là hai điều cùng khởi lên với các cảm thọ rồi tâm bị tổn thương. Bản Việt giữ nguyên hai khoá liền nhau, không thêm chữ nối.
    · `1.2` `piyaṁ nimittaṁ manasi karoto`: phân từ hiện tại, đang chú ý; chủ thể là người ở `1.3` `vedeti`. Không có chủ ngữ riêng trong Pāli nên bản Việt không nêu; theo `sn35.95:12.2`.
    · `13.2`, `15.2`, `17.2`, `19.2`, `21.2`, `23.2` `patissato`: `sn35.95:24.2` viết `paṭissato`; cùng một từ, dịch `có chánh niệm`.
    · `0.4`: Sujato `(2nd)`; Pāli không có dấu hiệu thứ tự, bản Việt không thêm.
    · Hai bài `thag1.98` và `thag1.99` có cùng bốn dòng đầu (cùng Pāli, `ajjhosa tiṭṭhati` dịch `chạy theo`); bản này không sửa hai bài đó. Nếu người biên tập muốn đồng nhất, đổi `1.4` của hai bài sang `và bám chặt vào đó`.

  VÌ SAO published, VÀ BIÊN ĐỘ. Không có blocker: 125/125 khoá, 0 thừa, 0 thiếu, nháy và dấu lược khớp Pāli từng khoá, không có số sai, không phát hiện lỗi chủ thể hay đảo vai (đã soi riêng sáu cặp kệ đối nghịch `rajjati` so `na rajjati` và `ārā` so `santike`). Tầng Anh phủ 120/121 khoá thân (0,992), khớp ranh giới khoá. Có bản Việt `sn35.95` đã published làm tiền lệ cho toàn bộ 120 dòng kệ; đó là sản phẩm của chính dự án nên không tính là đọc độc lập thứ hai. Trung bình 9,22 > 9,0 ⇒ published. Biên độ nhỏ trên ngưỡng; các điểm dưới 9,0 là chỗ người biên tập nên soi trước nếu muốn hạ về review: `ambiguity_integrity: 8.6` (các bất định `20.1`, `14.3`, `2.4`), `triangulation: 8.8` (không có tầng Việt hiện hành phân đoạn; Sujato là tầng độc lập duy nhất; bản tiền lệ `sn35.95` là sản phẩm của chính dự án).

