notes: |-
  **Dịch từ Pāli một mình.** Không có Sujato ở commit đã ghim, cũng không có bản Việt Thích Minh Châu (xem mục chung).

  **Lỗi lớn nhất tôi tự bắt ở lượt review đối kháng, đã sửa:** bản nháp đầu của tôi dịch `1.1` `Na santi devā pavasanti nūna` là *Chắc chắn là các vị trời đang rơi xuống* — **đã mất chữ phủ định `Na`**. Đây là loại lỗi nghiêm trọng nhất của tầng này vì nó đổi hẳn mệnh đề. Đã sửa thành *Chắc chắn là không có vị trời nào rơi xuống*, và lặp lại cùng cách cho `1.2` (`Na hi nūna santi`) và `1.4` (`Na hi nūna santī`). Cả ba khoá đều là mệnh đề phủ định, và bài kệ cất tiếng theo kiểu *không có thần hộ thế nào, không ai ngăn được*.

  **`0.2` `Dukanipāta` → *Tập Hai*, `0.3` `Ruhakavagga` → *Phẩm Dây Leo* — cả hai đều MÂU THUẪN với bản dịch đã có, và tôi chọn Pāli.** Sáu tệp (`ja195`–`ja198`, `ja201`, `ja218`) dùng *Tập Kẻ Đau Đớn* cho `Dukanipāta` (`duka` = *hai*, không phải *đau đớn*), và bốn tệp `ja195`–`ja198` dùng *Phẩm Thằn Lằn* cho `Ruhakavagga`. Cái thứ hai sai rõ hơn: bài đầu của phẩm là `ja191 Ruhakajātaka`, và câu `Api ruhaka chinnāpi, jiyā sandhīyate puna` (*Dù cây leo bị chặt, nó vẫn nối lại mọc tiếp*) nói rõ `ruhakā` là **dây leo**, không phải thằn lằn — nên tôi dịch *Phẩm Dây Leo*. Tôi đã đọc Pāli `ja191` trực tiếp ở commit đã ghim để phân xử, không suy từ tên. Cả hai chỗ tôi đều **không** nhân lại lỗi sẵn có, vì Pāli là authority cuối cùng; đồng thời ghi đây để biên tập sửa nốt mười tệp kia. Tôi **không** sửa chúng vì ngoài lát của tôi.

  **`nūna` tôi dịch *chắc chắn*, và dùng nó ở cả `1.1`, `1.2`, `1.4`.** Đây là trạng ngữ suy luận, không phải trạng ngữ phủ định; nó đứng sau `na` ở `1.2`/`1.4` nên nghĩa là *chắc chắn là không có*.

  **`nanu so tāvatā hato` tôi dịch *chẳng phải hắn đã bị hủy diệt đến thế ư*** — `nanu` là câu hỏi tu từ, không phải mệnh đề. `saggā` → *từ trên cao* (Sujato dịch `out of the sky` cho câu kệ ở bài khác); `ṭhānā` → *chỗ của nó*; `paṭisedhitāro` → *ai ngăn nổi*.

  **`0.4` `Maṇicorajātaka` → *4. Kinh Maṇicora*:** `maṇicora` là một loại đá quý và cũng là tên nhân vật; tầng có tiền lệ phi chuyển danh từ trong tiêu đề Jātaka, nên tôi giữ `Maṇicora` chứ không dịch *Kinh Hạt Ngọc* (chưa có tiền lệ nào cho tên này).

  **Tầng Việt hiện hành không có.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa 27 tệp Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ cho bài này. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế chỉ là Pāli + English Sujato.

  **Sàn coverage không kích hoạt, nhưng ô Anh trống KHÔNG phải đồng thuận.** Hàm `kiểm()` của `_hvi.py` lọc `cần = [k for k in p if len(p[k]) >= 40 …]`. Ở bài này mọi khoá Pāli ngắn hơn 40 ký tự, nên `cần` RỖNG và NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy. Tôi đã tự quét lại MỌI khoá bằng một lớp kiểm riêng áp đúng các quy tắc ấy lên toàn bài, và in ra từng cặp Pāli ↔ Việt để đọc đối kháng.

  **Ngoại lệ đã đo, không phải lỗi.** Khoá `:0.1` trùng nguyên văn Pāli là quy ước của tầng: 168/516 tệp `kn/*` có `:0.1` là chuỗi Pāli nguyên văn (đếm bằng script). Tương tự, tên riêng mang dấu Pāli trong tiêu đề là tiền lệ (`thag1.101` Belaṭṭhānika, `thag1.11` Cūḷavaccha, `thag1.15` Kuṇḍadhāna), và dấu lược trần `…` xuất hiện 446 lần trong tầng.

  **Tôi không chạy `npm run validate|test|check|build`** (đợt này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0 — đúng như `thag1.107` đã làm.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja194:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Hai»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.
