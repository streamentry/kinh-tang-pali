notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja519_root-pli-ms.json` (154/154 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ; phần văn xuôi của Jātaka không nằm trong tầng Pāli đã ghim nên bối cảnh câu chuyện chỉ được suy từ chính các bài kệ.

  - Tầng tham khảo:
    Tầng English của Sujato không có ja519 (Sujato Jātaka chỉ có 83 tệp, trong đó không có uid này); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Tôi chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Tôi có xem thêm một bản Anh cũ phạm vi công cộng (H. T. Francis, E. B. Cowell biên tập, 1905) chỉ để nhận ra ai nói với ai ở từng bài kệ và một vài chỗ khó; đó không phải tầng đã ghim, không được dùng làm bản đối chiếu độc lập, và không câu chữ nào được lấy từ đó. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
  - Coverage English:
    Mẫu số = 0. Không khoá Pāli nào của bài đạt ngưỡng 40 ký tự theo `source/layers.yaml` (khoá dài nhất 36 ký tự; bài toàn kệ ngắn, bỏ khối `:0`), nên cổng coverage không đo được gì; điều đó không có nghĩa là không cần ghi nhận gap. Sujato phủ 0/154 khoá, `english-project` 0/154, `vietnamese-current` 0/154.
  - Phân loại & tiêu đề:
    + `0.1` "Jātaka"; `0.2` "Bộ Ba Mươi Bài Kinh" (Tiṁsanipāta, tiṁsa = 30, dùng lại nguyên văn `ja511:0.2`); `0.3` "Phẩm Mong Muốn Gì" (Kiṁchandavagga, dùng lại nguyên văn `ja511:0.3`); `0.4` "9. Kinh Sambulā" và `36.1` "Kinh Sambulā, thứ chín." (navamaṁ = 9, khớp số "9." ở `0.4`) theo khuôn "Kinh <Tên>" / "Kinh <Tên>, thứ n" của `ja512`, `ja513` và các bài cùng đợt.
  - Người nói (Pāli không ghi tên; suy từ lời xưng hô và bối cảnh trong bài):
    + Kẻ ăn thịt người (dānava, rakkhasa, pisāca, purisādaka là cùng một nhân vật): `1`, `2`, `6`, `8`–`10`; Sambulā nói với kẻ ấy: `3`–`5`, `7`, `13`, `14` (14 là lời than một mình); `15` là lời một vị nói với kẻ ăn thịt người (gọi y là `rakkhasa`, bảo thả nàng; Pāli không nêu tên, bản Anh cũ cho là Sakka, tôi không thêm tên vào thân kinh); `11`, `12`, `16`, `17` là lời kể; `18`–`23` là lời Sambulā một mình, mỗi bài kết bằng lời nương tựa trong nháy kép; hoàng tử Sotthisena nói với Sambulā: `24`, `26`, `35`; Sambulā nói với chồng: `25`, `27`; người cha, gọi là `tāta` (đây là cha của hoàng tử, tức cha chồng của Sambulā theo bản Anh cũ; Pāli chỉ ghi `tāta`): `28` hỏi nàng, `34` nói với hoàng tử (`janinda`); Sambulā đáp cha: `29`–`33`. Quy ước xưng hô: Sambulā xưng "tôi" với kẻ ăn thịt người và với chồng, xưng "con" với cha, gọi chồng là "phu quân" khi nói về ông và "chàng" khi nói với ông; kẻ ăn thịt người xưng "ta" và gọi nàng "nàng".
  - Pāli trùng nguyên văn:
    Dò Pāli của 154 khoá với toàn bộ Pāli đã ghim (mọi bộ): 16 khoá có Pāli trùng ở bài khác mà bài đó đã có bản Việt; 9 khoá dùng lại nguyên văn (`0.1`, `0.2`, `0.3` theo `ja511`/`ja512`; `2.3` theo `ja511:8.3`; `8.4` theo `ja489:23.4`; `14.2` theo `ja194:1.2`; `24.2` theo `ja458:9.2`; `26.3` theo `ja64:1.3`; `27.5` theo `cp30:7.1`, `ja463:13.5`, chỉ đổi chữ hoa đầu dòng cho khớp câu) và 7 khoá cố ý khác: `9.2` (nói với một người nữ nên "nàng", không phải "ngươi" như `snp3.6:10.2`), `12.2` ("tàn bạo", cùng cách dịch `luddo` ở `11.1` và `ja513`, `ja492:17.2` viết "tham lam"), `14.1` và `14.3` (xem dưới, về `ja194`), `20.2` (`ja427:4.4` nằm trong câu có chữ "là"), `26.2` (`thag2.9:1.4` khác chủ ngữ), `27.4` (`ja419:3.4` khác ngữ cảnh). `26.4` Pāli chỉ gần giống (`ja64:1.4` kết `gatan”ti`), vẫn dùng lại "như dấu cá để lại trong nước". Lỗi nghi ngờ ngoài lát, chỉ báo, không sửa: `ja194:1.1` dịch `pavasanti` thành "rơi xuống" và `ja194:1.3` dịch `sahasā karontānaṁ asaññatānaṁ` thành "hành xử tập thể", cả hai đều không khớp Pāli (`pavasanti` là "đi vắng, ở nơi khác"; `sahasā` là "hấp tấp, bốc đồng").
    Trong chính bài: 6 nhóm Pāli trùng nguyên văn (`13.1`–`13.4` = `25.3`–`25.6`; `18.3` = `19.3` = `20.3` = `21.3` = `22.3` = `23.3`; `18.4` = `19.4` = `20.4` = `21.4` = `22.4` = `23.4`). Bản Việt giống nhau ở cả 6 nhóm (chỉ khác chữ hoa đầu dòng và dấu nháy đóng/mở theo đúng Pāli từng khoá); 0 nhóm khác.
  - Số Pāli:
    `catussatā` (`8.2`) = catu 4 + sata 100 = 400 → "bốn trăm"; `sattajaṭo` (`11.1`) = satta 7 + jaṭa (búi tóc bện) → "bảy búi tóc bện"; `sattadhā` (`15.4`) = satta 7 + hậu tố `-dhā` (từng phần) → "bảy mảnh"; `sattasatā` (`28.1`) = satta 7 + sata 100 = 700 → "bảy trăm"; `satāni soḷasa` (`28.3`) = soḷasa 16 × sata 100 = 1.600 → "một ngàn sáu trăm"; `tiṁsa` (`0.2`) = 30; `navamaṁ` (`36.1`) = 9, khớp `0.4`. Bài không có số đếm nào khác.
  - Thuật ngữ (có đếm trên tầng):
    + `rakkhasa` → "quỷ la-sát" (`ja517:0.4`, `ja517:1.4`, `ja517:1.6`, `ja132:1.3`; còn "dạ-xoa" ở `ja347`, `snp2.7`, "quỷ dữ" ở `iti69`, `iti109`); `dānava` giữ nguyên chữ, tầng không có tiền lệ cho nghĩa "loài quỷ" (ở `cp` chỉ là `dānavara`, "món thí"); `pisāca` → "quỷ" (`ud1.7`, `ja155`); `purisādaka` → "kẻ ăn thịt người" (`ja513`, 4/4 khoá có bản Việt); `ludda` → "tàn bạo" (`ja308:2.2`, `ja513`; `cp22:13.2` viết "tàn nhẫn"); `bhadde` → "hỡi hiền nữ" (ja489, vv34); `kalyāṇi` → "hỡi người xinh đẹp" (`ja511`, `ja458`); `sumajjhime` → "hỡi người có vòng eo đẹp" (`ja511`); `rājaputtī yasassinī` → "công chúa danh tiếng" (`ja458`, `ja489`); `saraṇaṁ gatā` → "đã đến nương tựa" (không dùng "quy y" như `ud5.3`, `iti74` vì ở đây không phải Tam quy); `lokapāla` → "thần hộ thế" (`ja194`); `vanamuñchā` → "lượm nhặt trong rừng" (`ja507:19.4` "nhặt nhạnh"); `siluccaya` → "khối núi đá" (`thag15.2`, `tha-ap405`); `Vedehaputta` → "con trai bà Videhī" (cách dịch `vedehiputto` ở sn3.14 "con bà Videhī"); `tāta` → "thưa cha" (nói với cha), `ayyaputta` → "phu quân" (tầng không có tiền lệ nghĩa này; `ud2.8` "ông chủ", `sn41.10` "anh"); `patibbatā` → "tiết hạnh với chồng" (cách dịch gần `ja489:21.4` "trung tín với chồng", `mil5.1.4:10.2`, `vv11:5.2`); `sattu` → "kẻ thù" (`ja492:4.2`, `ja492:5.1`, `ja448:8.2`, `cp27:2.3`); `paṇhe` → "vào buổi sáng" (theo `ja513`, xem bất định); `janinda` → "chúa tể loài người".
  - Chỗ bất định (không thêm vào thân kinh):
    + `1.2` `saṁhitūru`, `1.3` `pāṇipameyyamajjhe`: đọc là đôi đùi khép sát, vòng eo nhỏ vừa tầm bàn tay nắm (lời khen sắc đẹp, không có nghĩa kỹ thuật).
    + `4.1`, `7.3` `bhaddante`: đọc `bhaddaṁ te` ("điều lành đến với ngài"), tức lời chúc; cách đọc khác là lời gọi "hỡi người tốt".
    + `4.1` `Vedehaputto`: đọc là con trai bà Videhī (mẹ người xứ Videha), theo `vedehiputto` ở sn3.14; không phân xử được từ Pāli một mình.
    + `4.3` `rogasammatta`: hiếm; `sammatta` là "say, mê mệt" (`ja418:6.1`, `ja460:5.3`), dịch "bị bệnh làm cho mê mệt".
    + `5.2` `migābilaṁ`: không tra được (toàn tầng chỉ có ở khoá này); dịch "những thứ của loài nai", đi cùng `madhumaṁsaṁ`; nghĩa chính xác không chắc.
    + `5.4` `tassa nūnajja nādhati`: `nādhati` không tra được trong tầng (chỉ có `na gādhati` ở những chỗ khác, nghĩa khác); dịch theo mạch "hôm nay hẳn người ấy chẳng có gì", có thể là "chẳng có gì để ăn".
    + `6.3` `pariciṇṇena`: đọc là phân từ quá khứ của `paricarati` ("người đã được hầu hạ"), đi cùng `karissasi` như một tân ngữ cách công cụ; cách đọc "Sambulā, nàng sẽ được ta hầu hạ" ít khả dĩ hơn.
    + `9.1` `nūna`: đọc là tiểu từ nhấn ("quả thật"), cách đọc khác (xác suất, "hẳn") khả dĩ không kém.
    + `10.1` `maheseyyaṁ kārayissasi`: đọc theo khuôn `rajjaṁ kāreti` ("trị vì") là "giữ ngôi chánh hậu"; `10.3`–`10.4` `paṇhe`: đọc là `pubbaṇhe` ("buổi sáng") theo `ja513`, dù cách đọc này làm `10.3` (bữa sáng) và `10.4` lặp ý.
    + `11.2` `kaḷāro`: đọc là "nâu vàng" (màu da; ở tầng chỉ còn làm tên riêng `Kaḷāra` ở sn12); không phân xử được.
    + `15.5` `mā tvaṁ dahī muñca patibbatāya`: `dahī` không rõ; đọc là dạng bị động của `ḍah`, "chớ để bị thiêu đốt"; cách đọc "chớ thiêu đốt (nàng)" không loại trừ được. `patibbatāya` (cách chỉ định) đọc là tân ngữ của `muñca`.
    + `16.3` `paḷinaṁ`: đọc là "bay về", dịch "chim mái bay về tổ"; `16.4` `gatasiṅgaṁva ālayaṁ`: không tra được (toàn tầng không có `gatasiṅga`); dịch sát chữ là "chốn ở đã mất sừng"; bản Anh cũ đọc là hình ảnh con bò mất bê trở về chuồng trống, tôi không đưa nghĩa đó vào thân kinh vì Pāli không có chữ "bò" hay "bê".
    + `17.3` `utumattakkhā`: hiếm (toàn tầng chỉ có ở đây); dịch "mắt như dại đi" theo mạch và theo bản Anh cũ; `utu`- chưa giải thích được.
    + `21.1` `indīvarīsāmaṁ`: giống trung/đực, nhưng đi với `rattiṁ` (giống cái, `21.2`); dịch là "vẻ sẫm màu như hoa sen xanh, của đêm" để không phải chọn.
    + `29.1` `padumuttarattacā`: đọc là "làn da như sen thượng hạng"; nghĩa chính xác của `uttara` ở đây không chắc. `29.2` `passati`: ngôi thứ ba, chủ ngữ là phu quân (khớp `naṁ` ở `30.4`); `29.4` bỏ chủ ngữ trong Pāli, tôi thêm "phu quân" vì tiếng Việt cần chủ ngữ.
    + `30.1` `suvaṇṇasaṅkaccadharā`: `saṅkacca` không tra được trong tầng, giữ nguyên chữ; `30.3` `Senopiyā`: đọc `Seno-piyā` ("được Sena yêu mến", Sena là dạng rút gọn của Sotthisena); cách đọc khác không loại trừ được.
    + `32.1` `Yamannapāne`: `yaṁ` đọc như tiểu từ nhượng bộ ("dù"); `32.4` `abajjha`: đọc là `ābajjha` ("buộc, thắt"), nghĩa là thắt dây tự vẫn; `abajjhare` ở ja114 và `abajjhi` ở ja501 là nghĩa "bị buộc", không phải "buộc mình"; cách đọc "cái chết không ai nỡ giết" (`avajjhā`) ít khả dĩ hơn.
    + `33.2` `kaṭādutīyā`: đọc là "chỉ có tấm chiếu làm bạn" (`kaṭa` chiếu, `dutiya` bạn đôi); toàn tầng không có dạng này.
    + `34.2` `bhattitthiyā`: đọc là `bhattā itthiyā` ("đối với người vợ, người chồng"); cách đọc `bhatti` ("lòng tận tụy") cũng được. `34.3` `hitā ca te` đọc "vì lợi ích của ngươi".
    + `35.1`–`35.4` `issāvatiṇṇā`: đọc là "bị ghen tuông xâm chiếm", toàn tầng không có dạng này; câu điều kiện thiếu mệnh đề kết quả rõ nên tôi thêm "thì" ở `35.3`.
