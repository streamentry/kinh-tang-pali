notes: |-
  Đợt 19, làn 56. Dịch từ Pāli root commit đã ghim, đủ 75/75 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có tiêu đề, 17 nhóm kệ và dòng kết; không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh mà chỉ đọc từ ngữ cảnh (xem dưới).

  **Tiêu đề, theo khuôn các bài anh em cùng phẩm.**
  - `0.2` “Bộ Mười Ba Bài Kinh” và `0.3` “Phẩm Xoài” dùng lại nguyên văn từ `ja475:0.2`, `ja475:0.3`, `ja478:0.2`, `ja478:0.3` (cùng `Terasakanipāta` + `Ambavagga`).
  - `0.4` “9. Kinh Rurumigarāja” và `18.1` “Kinh Rurumigarāja, thứ chín.”: theo khuôn “N. Kinh <tên Pāli>” của `ja385:0.4` (“Kinh Nandiyamigarāja”, giữ nguyên tên ghép Pāli) và dạng “Kinh …, thứ N.” của `ja385:7.1`, `ja475:14.1`.

  **Tiền lệ dùng lại nguyên văn.**
  - `13.1`–`14.4` là Pāli trùng nguyên văn với `ja478:4.1`–`5.4` (8 khoá) và với `ja476:6.1`–`7.4` (8 khoá); đã dùng lại đúng bản Việt của `ja478`/`ja476` (hai bài này cho bản Việt giống nhau từng khoá), chỉ thêm dấu nháy kép mở ở `13.1` và đóng ở `14.4` cho khớp Pāli của bài này.
  - `2.4`/`1.4`, `1.2`/`2.2`, `11.3`/`12.3`, `16.2`/`17.2` là Pāli trùng ngay trong bài: bản Việt của từng cặp cùng một câu chữ, chỉ khác dấu câu cuối khoá theo Pāli (`”.` / `.`, `,` / `;`).
  - `ja73:1.1`–`1.4` là kệ có Pāli gần giống `7.1`–`7.4` (`Saccaṁ kirevamāhaṁsu` / `kireva māhaṁsu`); trong đó `7.2`, `7.3`, `7.4` trùng nguyên văn Pāli với `ja73:1.2`, `1.3`, `1.4`. Bản Việt của `ja73` (“Khúc gỗ trôi giáng còn hơn … chứ không bằng kẻ mà ngươi nghĩ tới”) không bám sát Pāli (`na tvevekacciyo naro` không có “mà ngươi nghĩ tới”), nên bài này dịch lại theo Pāli (`kaṭṭhaṁ niplavitaṁ seyyo` → “khúc gỗ được vớt khỏi nước thì tốt hơn”) thay vì dùng lại bản `ja73`. Xin người điều phối cân nhắc rà soát `ja73` riêng.
  - Số khoá dùng lại nguyên văn: 8 khoá (`13.1`–`14.4`, từ `ja478`/`ja476`) + `0.2` = 9 khoá, cộng `0.3` dùng lại theo khuôn tiêu đề phẩm = 10 khoá. Đã dò 75 khoá Pāli với toàn bộ tầng Pāli `kn` (chuẩn hoá bỏ nháy, dấu cuối khoá, chữ hoa/thường; bỏ khoá dưới 10 ký tự): 24 khoá Pāli trùng nguyên văn với một khoá ở bài khác; trong đó 16 khoá có bản Việt đã có (9 khoá giống bản Việt của tôi, 7 khoá bản Việt của tôi khác); 8 khoá còn lại chưa có bản Việt ở bài kia nên không có gì để dùng lại. 7 cặp khác, cố ý: `3.3` (`Indagopakasañchannā` so với `thag1.13:1.3` “phủ kín bọ cánh cứng”, xem thuật ngữ); `4.1` (`Dhanuṁ advejjhaṁ katvāna` so với `ja385:5.3` “cắn chỉnh cung cho thẳng”, “cắn chỉnh” không có căn cứ trong Pāli); `5.1` (`Āgamehi mahārāja`, `ja380:8.3` “Hỡi vua, hãy đến đây”: ở đây là lời ngăn lại “xin hãy khoan”, đúng nội dung `5.2` “xin đừng bắn tôi”); `7.2`, `7.3`, `7.4` (so với `ja73`, xem trên); `15.2` (`negamā ca samāgatā` so với `ja432:10.2` “và cả các thị trấn tụ họp”, khác cú pháp: ở đây `negamā` là chủ ngữ của “đã tụ họp”).

  **Trùng nguyên văn trong chính bài** (sau khi chuẩn hoá bỏ nháy và dấu cuối khoá): 5 nhóm = `1.2`/`2.2`, `1.4`/`2.4`, `3.4`/`5.4`/`6.4`, `11.3`/`12.3`, `16.2`/`17.2`. 0 nhóm mà bản Việt khác nhau về câu chữ; ba khoá `3.4`/`5.4`/`6.4` cùng câu “con nai ấy đang đứng ở chỗ này” (khác chỉ ở dấu hỏi/chấm và lời dẫn “rằng” ở `5.4`, `6.4` vì `5.3`, `6.3` là mệnh đề dẫn “điều này”).

  **Số Pāli:** `catuppatta` (10.1) = 4 (catu) “bốn lông cánh”; `navamaṁ` (18.1) = 9 ⇒ “thứ chín”, khớp “9.” ở `0.4`. Không có số lượng nào khác, không có cụm số chưa phân xử được.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `gāmavaraṁ` (1.1, 2.1) → “ngôi làng ưu tú”: nhất quán `ja289:1.3`, `ja289:3.1` (“ngôi làng ưu tú”); `ja456:3.1`, `ja456:12.1` dùng “làng thượng hạng” (2 so với 2 khoá).
  - `rathesabha` (5.2) → “hỡi bậc chiến xa đệ nhất”: tầng `ja` có 22 khoá chứa `rathesabh…`, cách dịch “bậc chiến xa đệ nhất” là chính (ví dụ `ja260:1.4`, `ja306:4.4`, `ja333:1.2`).
  - `migo` (nhiều khoá) → “nai”: trong tầng `kn`, ở các khoá có từ gốc `miga` đã dịch, “thú” 22 khoá, “hươu” 18, “nai” 16 (khoá có thể trùng nhau); chọn “nai” vì `rurumiga` là loài nai; `ja385` (cùng `migarāja`) dùng “vua hươu”, một cách đọc khác của cùng từ.
  - `migarāja` (17.3) → “vua loài nai”; `ruru` (8.1, 12.1, 16.3) giữ nguyên Pāli “Ruru” (tên nhân vật, vừa là tên loài; 0 tiền lệ trong tầng).
  - `asabbhi` (9.4) → “kẻ chẳng lành”: nhất quán `ja144:1.1` (“kẻ chẳng lành”), tầng chỉ có 1 khoá.
  - `indagopaka` (3.3): giữ nguyên Pāli “bọ indagopaka”, không xác định loài; `thag1.13:1.3` dịch “bọ cánh cứng” (tầng có 1 khoá dịch, 2 khoá chưa dịch). Giữ Pāli vì không xác lập được loài.
  - `negamā` (15.2) → “dân thị trấn”, `jānapadā` (15.1) → “dân trong xứ”; `ja432:10.1` dịch `jānapadā` là “các làng xóm” (1 khoá), cách đọc khác của cùng từ nhưng bối cảnh khác (lời kêu gọi nghe).
  - `devo` (15.4) → “đại vương”, nhất quán `rāja`/`mahārāja` → “đại vương” trong cùng bài; `ja460:1.4` dịch `devo` là “ngài”.
  - `abhayadakkhiṇā` (16.4) → “món quà vô úy”: 0 tiền lệ trong tầng; `abhaya` → “vô úy” là thuật ngữ quen thuộc.
  - `kāmakaro` (11.5) → “người làm theo ý nguyện của ngài”; `kāmacāra` (12.5) → “sự đi lại tùy ý”: 0 tiền lệ (cả hai không có trong tầng).
  - `vara` (17.4) → “ân huệ” (cũng là nghĩa của `varaṁ` ở `gāmavaraṁ`, nhưng ở đó dịch “ưu tú” theo tiền lệ).

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli mở ở 1.1, 2.1, 4.1, 6.1, 7.1, 8.1, 9.1, 10.1, 11.1, 12.1, 13.1, 15.1, 16.1 và đóng ở 1.4, 3.4, 5.4, 6.4, 7.4, 8.4, 9.4, 10.4, 11.5, 12.5, 14.4, 15.4, 17.4 (dấu đóng của `17.4` đứng trước `ti`, bản Việt đặt `”` ở cuối khoá); 13 dấu mở · 13 dấu đóng, lệch 0/75 khoá. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (không có chỗ lược trong bài).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói (đọc từ ngữ cảnh kệ, không từ văn xuôi vì tầng Pāli ghim không có văn xuôi): 1 nhà vua hứa thưởng; 2–3 kẻ chỉ điểm; 4 lời kể (nháy kép mở ở `4.1` và đóng ở `5.4` theo Pāli, nên khối 4–5 mang dấu nháy dù `4.1`–`4.4` là lời dẫn truyện); 5 Ruru; 6 nhà vua; 7 Ruru; 8 nhà vua; 9 Ruru; 10 nhà vua; 11 Ruru; 12 nhà vua; 13–14 Ruru; 15 dân chúng; 16–17 nhà vua. Bản dịch không thêm người nói vào thân kinh. Riêng `8.1`: `Kiṁ nu ruru garahasi migānaṁ …` đọc là lời nhà vua hỏi Ruru; có thể hiểu khác nếu chủ ngữ của `8.3` “ta” là người khác.
  2. `4.1` `dhanuṁ advejjhaṁ katvāna`: `advejjha` dịch “cho ngay” (tức không cong lệch, không nhị biến); `tha-ap244:1.1` dịch “không sai lệch”, `tha-ap209:2.1` “siết chặt”; nghĩa không chắc.
  3. `7.3` `kaṭṭhaṁ niplavitaṁ`: dịch “khúc gỗ được vớt khỏi nước” (`niplavita` đọc là vật bị vớt lên khỏi nước, theo nội dung `9.1`–`9.2` kể Ruru vớt người bị nước cuốn). Cách đọc khác “khúc gỗ trôi” (`ja73:1.3` “trôi giáng”) cũng có thể.
  4. `7.1` `saccaṁ kireva māhaṁsu`: đọc là `saccaṁ kira evaṁ āhaṁsu` (“quả thật người ta đã nói như vậy”); cách tách `māhaṁsu` còn tùy cách đọc.
  5. `8.4` `taṁ mānusiṁ bhāsamānaṁ`: `mānusiṁ` là giống cái; dịch “nói bằng tiếng người” (ngầm hiểu `vācaṁ`), không thêm từ nào vào thân.
  6. `10.1`–`10.2` `catuppattamimaṁ vihaṅgamaṁ tanucchidaṁ`: `vihaṅgama` nghĩa đen “vật bay”, ngữ cảnh chỉ mũi tên (xem `4.2` `usuṁ`); dịch sát chữ “vật bay bốn lông cánh”, `catuppatta` (bốn lông/cánh) không có tiền lệ (0 khoá). `hadaye ossajāmi` (“phóng vào tim”): tim của kẻ chỉ điểm, ngầm hiểu từ `10.3` `taṁ`.
  7. `10.4` `yo tādisaṁ kammakataṁ na jāne`: dịch sát chữ “kẻ chẳng biết đến một người như thế, người đã làm nên việc ấy” (0 tiền lệ cho `kammakata`); nghĩa gần “không nhận ra người đã làm ơn cho mình”.
  8. `11.1` `dhīrassa bālassa`: sở hữu cách của hai danh từ; dịch “với bậc trí hay kẻ ngu” (cách đọc “việc giết bậc trí hay kẻ ngu”) — giữ mơ hồ giống Pāli.
  9. `11.4`, `12.4` `yañcassa bhaṭṭhaṁ`: `bhaṭṭha` dịch “điều đã được dành cho hắn” (từ gốc `bhaj`, phần chia cho, phần thưởng đã hứa ở `1.1`–`2.2`); tầng chỉ có `ja139:0.4` chứa chữ `bhaṭṭha` (từ ghép `ubhatobhaṭṭha`, nghĩa khác: “hỏng”), nên không có tiền lệ trực tiếp. Có thể có cách đọc khác ("điều đã mất của hắn").
  10. `11.5` `ahañca te kāmakaro bhavāmi` và `12.5` `kāmacāraṁ dadāmi`: dịch sát nghĩa từng chữ (làm theo ý muốn của ngài; ban sự đi lại tùy ý). Không phân xử được thêm điều gì ngoài Pāli.
  11. `16.1`, `17.1` `kāmaṁ janapado māsi` / `mā me janapado āsi`: đọc `māsi` = `mā āsi` (“chớ có”) nên dịch “mặc cho xứ sở không còn”, “dù ta chẳng còn xứ sở”; hai khoá có cùng nghĩa, chỉ khác cú pháp.
  12. `9.1` `vāhane`: đọc là “dòng chảy” (cách đọc khác “phương tiện”) khớp `9.2` `sīghasote` “dòng chảy xiết”.

  **Coverage English (mục 7):** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng là 36 ký tự (< 40) nên 0/75 khoá có nội dung; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận gap*. Sujato: 0 tệp cho `ja482` (`kn/ja` chỉ có 83 tệp); `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Tôi không đụng `content/meta/reference-gaps.yaml`.

