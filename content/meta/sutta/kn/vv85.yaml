notes: |-

  Bản dịch tiếng Việt mới cho bài kinh vv85 — Chuyện Cung Điện Khéo Đặt Để, bài thứ mười
  một trong Purisavimāna, thứ bảy trong Sunikkhittavagga. Bài này có ĐẦY ĐỦ khối uddāna
  (`10.1`–`13.1`) trong khi chỉ một tệp `vv` trong 48 tệp đã có là `vv28`.

  Tiền kiếp: tòa lâu đài cao vút, chu vi mười hai do-tuần, bảy trăm lầu gác nguy nga tráng lệ,
  cột bằng ngọc lưu ly; ở đó ngài an tọa ăn uống, đàn hạc cõi trời tấu khúc nhạc, năm vị
  ngon cùng năm dục công đức, tiên nữ khoác trang sức vàng ròng khiêu vũ. Tôi hỏi ngài là
  bậc đại oai lực: khi còn làm người ngài đã làm phước đức gì, do đâu ngài có oai lực rực rỡ
  như thế, và dung sắc ngài chiếu sáng khắp muôn phương. Vị thiên tử ấy vô cùng hoan hỷ khi
  được Tôn giả Moggallāna hỏi thăm; được hỏi câu hỏi liền giải đáp quả báo của nghiệp này là
  thế. Ngài kể: đặt một vòng hoa thơm ngon ngập đều lên bảo tháp của bậc Thiện Thệ; tôi có
  thần thông, là bậc đại oai lực, thọ hưởng trọn vẹn mọi dục lạc cõi trời. Nhờ vậy tôi có
  được dung sắc như thế này, có được nơi này, của cải nào hiện khưởi cho tôi, dù là gì dễ
  chịu với tâm. Để tôi nói cho ngài, bậc tỳ-kheo, về đại oai lực ấy: việc tôi đã làm khi còn
  làm người — chính vì thế oai lực ngài rực rỡ như thế, và sắc tướng tôi chiếu sáng khắp
  mọi phương.

  NGOẠI LỆ `TRÙNG THÌ KHỚP, TRỪ KHI BẢN THAM CHIẾU SAI` — BA KHOÁ `3.1`–`3.3`:
  - Đa số CHUNG của các khoá `Kena tetādiso vaṇṇo`, `kena te idha mijjhati`,
    `Uppajjanti ca te bhogā`, `ye keci manaso piyā`, `Vaṇṇo ca te sabbadisā pabhāsatī”ti.`
    trong tầng `vv` đều lấy từ `Itthivimāna` (vv4, vv13), nên đa số là `nàng`
    (15/25, 9/10, 9/10, 22/22 và 9/37 theo hạng mục). Bản ấy SAI cho bài này: `vv85`
    thuộc `Purisavimāna` và Pāli ở `5.1` là `So devaputto` — người được hỏi là NAM.
    Nếu theo đa số chung thì bài sẽ tự mâu thuẫn với chính khoá `5.1` của nó.
  - Vì vậy: `3.1` lấy đúng bản NAM đã có (`vv57:3.1`, 5/9 bản nam);
    `3.2`, `3.3` và `4.4` sửa đúng một từ của bản đa số — `nàng` thành `ngài` — vì
    ngoài từ ấy bản đa số vốn đã đúng; `4.4` lấy bản nam đã có `vv76:2.4`.
    `3.4` và `7.4` (`dù là gì dễ chịu với tâm.`, 21/22) không có từ giới tính nên dùng
    nguyên bản đa số.
  - Đây là nơi cần người biên tập xem lại: nếu một lát sau chọn theo đa số chung cho cả
    `Vimānavatthu`, thì phải sửa đồng loạt cả `vv29` lẫn các bài `Itthivimāna`, không sửa lẻ.

  PÁI BẢN DÙNG LẠI NGUYÊN VĂN:
  - `1.1`–`2.4` trùng nguyên văn `vv57:1.1–2.4` (mười bản dịch cho mỗi khoá; bản của
    `vv57` chiếm 6/10, 5/8, 6/9, 6/9, 6/8, 6/8, 5/7, 5/7 — đa số ở tất cả tám khoá).
  - `4.2` (6/12), `4.3` (5/12), `5.1` (12/20), `5.2` (2/4), `5.3` (3/5), `5.4` (26/38),
    `6.4` (trùng `vv55:5.4`), `7.1` (25/38), `7.2` (10/12), `7.3` (6/12), `8.1` (11/12),
    `8.4` (13/34).
  - Khối uddāna theo đúng khuôn `vv28:8.1` (`Tóm lược:`), `vv28:9.1–9.6` (tên riêng giữ
    Pāli), `vv28:9.7` + `vv28:10.1` (gộp cho `11.5` vì Pāli đã gộp một khoá), `vv28:11.1`
    (`Chuyên luận, phần thứ nhất.` → `phần thứ tư.`).
  - `9.1`, `9.2` theo khuôn `vv57:8.1` (`Cung Điện …, thứ bảy.`) và `vv28:7.1`.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - `6.1`–`6.3` không có tiền lệ Pāli trùng nguyên văn. `Dunnikkhittaṁ mālaṁ
    sunikkhipitvā` dịch `Một vòng hoa thơm ngon ngập đều,` — `vòng hoa` là cách đã có (75
    giá trị trong tầng Việt). `sugata` đa số toàn tầng là `Thiện Thệ` (113 khoá Pāli có
    `sugata`; cách dùng này chiếm đa số), `thūpa` đa số là `bảo tháp` (22 giá trị Việt).
  - Bài kệ tóm tắt `11.1`–`11.4` là uddāna của Sunikkhittavagga (`vv75`–`vv84`:
    Cittalatā, Nandana, Maṇithūṇā, Suvaṇṇā, Amba, Gopāla, Kaṇḍaka, Anekavaṇṇā,
    Maṭṭhakuṇḍalī, Serīsaka). Bốn câu Pāli này dùng nghĩa ẩn dụ và giai âm
    (`Dve daliddā`, `Bhatako`, `gopālakaṇḍako`), nên tên riêng giữ nguyên theo Pāli, còn
    chữ nghĩa dịch nghĩa đen (`hai vị nghèo khổ sống trong rừng`, `vị đầu bếp`). Không tự
    sinh thêm tên Hán–Việt cho các tên riêng ấy. Người đọc Việt sẽ không thấy ánh xạ trực
    tiếp; đó là hệ quả của bản chất uddāna, và là lý do `ambiguity_integrity` bị hạ.
  - `3.1` dùng nguyên văn bản NAM đã có ở `vv57:3.1`, kể cả chữ cổ `đân gì`. Trong các
    bản dịch nam còn lại có `Do đâu ngài có được dung sắc như thế` (`vv58:3.1`, 2 lần)
    và `Do đâu chàng…` (`vv55:3.1`, 1 lần); chọn bản nhiều nhất theo luật `trùng thì khớp`.
    Cụm `đân gì` cổ hơn tiếng Việt hiện đại nhưng là cách đã có trong tầng và thay đổi nó
    sẽ sinh thêm một biến thể nữa cho cùng một Pāli.
  - `13.1` `Vimānavatthupāḷi niṭṭhitā.` theo khuôn `…niṭṭhitā` đã có trong `kn`
    (`kp9:12.1` `Kinh văn Tiểu Tụng kết thúc.`), giữ `Vimānavatthu` như ở `0.1` (47/48).

