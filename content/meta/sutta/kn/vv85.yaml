notes: |-
  
  Bản dịch tiếng Việt mới cho bài kinh vv85 — Chuyện Cung Điện Khéo Đặt Để, bài thứ mười
  một trong Purisavimāna, thứ bảy trong Sunikkhittavagga. Bài này có ĐẦY ĐỦ khối uddāna
  (`10.1`–`13.1`) trong khi chỉ một tệp `vv` trong 48 tệp đã có là `vv28`.

  Tiền kiếp: tòa lâu đài cao vút, chu vi mười hai do-tuần, bảy trăm lầu gác nguy nga tráng lệ,
  cột bằng ngọc lưu ly; ở đó ngài an tọa ăn uống, đàn hạc cõi trời tấu khúc nhạc, năm vị
  ngon cùng năm dục công đức, tiên nữ khoác trang sức vàng ròng khiêu vũ. Tôi hỏi ngài là
  bậc đại oai lực: khi còn làm người ngài đã làm phước đức gì, do đâu ngài có oai lực rực rỡ
  như thế, và dung sắc ngài chiếu sáng khắp muôn phương. Vị thiên tử ấy vô cùng hoan hỷ khi
  được Tôn giả Moggallāna hỏi thăm; được hỏi câu hỏi liền giải đáp quả báo của nghiệp này là
  thế. Ngài kể: đặt một vòng hoa thơm ngon ngập đều lên bảo tháp của bậc Thiện Thệ; tôi có
  thần thông, là bậc đại oai lực, thọ hưởng trọn vẹn mọi dục lạc cõi trời. Nhờ vậy tôi có
  được dung sắc như thế này, có được nơi này, của cải nào hiện khưởi cho tôi, dù là gì dễ
  chịu với tâm. Để tôi nói cho ngài, bậc tỳ-kheo, về đại oai lực ấy: việc tôi đã làm khi còn
  làm người — chính vì thế oai lực ngài rực rỡ như thế, và sắc tướng tôi chiếu sáng khắp
  mọi phương.

  NGOẠI LỆ `TRÙNG THÌ KHỚP, TRỪ KHI BẢN THAM CHIẾU SAI` — BA KHOÁ `3.1`–`3.3`:
  - Đa số CHUNG của các khoá `Kena tetādiso vaṇṇo`, `kena te idha mijjhati`,
    `Uppajjanti ca te bhogā`, `ye keci manaso piyā`, `Vaṇṇo ca te sabbadisā pabhāsatī”ti.`
    trong tầng `vv` đều lấy từ `Itthivimāna` (vv4, vv13), nên đa số là `nàng`
    (15/25, 9/10, 9/10, 22/22 và 9/37 theo hạng mục). Bản ấy SAI cho bài này: `vv85`
    thuộc `Purisavimāna` và Pāli ở `5.1` là `So devaputto` — người được hỏi là NAM.
    Nếu theo đa số chung thì bài sẽ tự mâu thuẫn với chính khoá `5.1` của nó.
  - Vì vậy: `3.1` lấy đúng bản NAM đã có (`vv57:3.1`, 5/9 bản nam);
    `3.2`, `3.3` và `4.4` sửa đúng một từ của bản đa số — `nàng` thành `ngài` — vì
    ngoài từ ấy bản đa số vốn đã đúng; `4.4` lấy bản nam đã có `vv76:2.4`.
    `3.4` và `7.4` (`dù là gì dễ chịu với tâm.`, 21/22) không có từ giới tính nên dùng
    nguyên bản đa số.
  - Đây là nơi cần người biên tập xem lại: nếu một lát sau chọn theo đa số chung cho cả
    `Vimānavatthu`, thì phải sửa đồng loạt cả `vv29` lẫn các bài `Itthivimāna`, không sửa lẻ.

  PÁI BẢN DÙNG LẠI NGUYÊN VĂN:
  - `1.1`–`2.4` trùng nguyên văn `vv57:1.1–2.4` (mười bản dịch cho mỗi khoá; bản của
    `vv57` chiếm 6/10, 5/8, 6/9, 6/9, 6/8, 6/8, 5/7, 5/7 — đa số ở tất cả tám khoá).
  - `4.2` (6/12), `4.3` (5/12), `5.1` (12/20), `5.2` (2/4), `5.3` (3/5), `5.4` (26/38),
    `6.4` (trùng `vv55:5.4`), `7.1` (25/38), `7.2` (10/12), `7.3` (6/12), `8.1` (11/12),
    `8.4` (13/34).
  - Khối uddāna theo đúng khuôn `vv28:8.1` (`Tóm lược:`), `vv28:9.1–9.6` (tên riêng giữ
    Pāli), `vv28:9.7` + `vv28:10.1` (gộp cho `11.5` vì Pāli đã gộp một khoá), `vv28:11.1`
    (`Chuyên luận, phần thứ nhất.` → `phần thứ tư.`).
  - `9.1`, `9.2` theo khuôn `vv57:8.1` (`Cung Điện …, thứ bảy.`) và `vv28:7.1`.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - `6.1`–`6.3` không có tiền lệ Pāli trùng nguyên văn. `Dunnikkhittaṁ mālaṁ
    sunikkhipitvā` dịch `Một vòng hoa thơm ngon ngập đều,` — `vòng hoa` là cách đã có (75
    giá trị trong tầng Việt). `sugata` đa số toàn tầng là `Thiện Thệ` (113 khoá Pāli có
    `sugata`; cách dùng này chiếm đa số), `thūpa` đa số là `bảo tháp` (22 giá trị Việt).
  - Bài kệ tóm tắt `11.1`–`11.4` là uddāna của Sunikkhittavagga (`vv75`–`vv84`:
    Cittalatā, Nandana, Maṇithūṇā, Suvaṇṇā, Amba, Gopāla, Kaṇḍaka, Anekavaṇṇā,
    Maṭṭhakuṇḍalī, Serīsaka). Bốn câu Pāli này dùng nghĩa ẩn dụ và giai âm
    (`Dve daliddā`, `Bhatako`, `gopālakaṇḍako`), nên tên riêng giữ nguyên theo Pāli, còn
    chữ nghĩa dịch nghĩa đen (`hai vị nghèo khổ sống trong rừng`, `vị đầu bếp`). Không tự
    sinh thêm tên Hán–Việt cho các tên riêng ấy. Người đọc Việt sẽ không thấy ánh xạ trực
    tiếp; đó là hệ quả của bản chất uddāna, và là lý do `ambiguity_integrity` bị hạ.
  - `3.1` dùng nguyên văn bản NAM đã có ở `vv57:3.1`, kể cả chữ cổ `đân gì`. Trong các
    bản dịch nam còn lại có `Do đâu ngài có được dung sắc như thế` (`vv58:3.1`, 2 lần)
    và `Do đâu chàng…` (`vv55:3.1`, 1 lần); chọn bản nhiều nhất theo luật `trùng thì khớp`.
    Cụm `đân gì` cổ hơn tiếng Việt hiện đại nhưng là cách đã có trong tầng và thay đổi nó
    sẽ sinh thêm một biến thể nữa cho cùng một Pāli.
  - `13.1` `Vimānavatthupāḷi niṭṭhitā.` theo khuôn `…niṭṭhitā` đã có trong `kn`
    (`kp9:12.1` `Kinh văn Tiểu Tụng kết thúc.`), giữ `Vimānavatthu` như ở `0.1` (47/48).

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và
  `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên
  `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của
  chính tầng Việt qua `_hvi.save_vi`: đủ 46/46 khoá, cân ngoặc kép trên cả bài (mở ở `1.1`
  và `6.1`, đóng ở `4.4` và `8.4`), đúng số dấu lược theo Pāli, NFC, không trùng nguyên văn
  Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10 tiêu chí, do
  `_meta71.ghi` tính.

  Lượt cải thiện 2026-10-11 (kiểm toán đối kháng độc lập; bản tự chấm trước đó 9.14 đã bỏ sót lỗi nghĩa thật, nay chấm lại 8.89):
  Đổi 16/46 khoá. LỖI NGHĨA NẶNG (5 khoá):
  - `6.1`–`6.2`: `Dunnikkhittaṁ mālaṁ sunikkhipitvā` là "vòng hoa bị đặt không khéo, sau khi đặt lại cho khéo" (dunnikkhitta = đặt không khéo, sunikkhipitvā = đặt lại cho khéo), KHÔNG phải "vòng hoa thơm ngon ngập đều"; `Patiṭṭhapetvā … thūpe` = an trí trên bảo tháp. Đây chính là cốt truyện đặt tên bài (Cung Điện Khéo Đặt Để), bản cũ làm mất nó.
  - `8.1`: `Akkhāmi te bhikkhu mahānubhāva` — `mahānubhāva` là hô cách đi với `bhikkhu`, bản cũ đọc thành tân ngữ "về đại oai lực ấy" (lỗi lan từ họ vv). Nay: "Tôi xin nói cho ngài, này tỳ-kheo có đại oai lực" (theo 4 tiền lệ đúng; 9 tiền lệ vv sai theo mẫu cũ).
  - `8.3`: `Tenamhi evaṁ jalitānubhāvo` — người đáp là thiên tử, chủ ngữ là "tôi", bản cũ ghi "oai lực ngài" (sai người nói). Nay "tôi có oai lực rực rỡ như thế". `8.4` đồng bộ `muôn phương` với `4.4`.
  - `11.2`: `Bhatako` = người làm thuê (bản cũ "vị đầu bếp" sai); `gopālakaṇḍako` = hai tên Gopāla và Kaṇḍaka (vv80, vv81), không phải một tên "Gopālakaṇḍa".
  LỖI NGHĨA VỪA (5 khoá): `3.2` và `7.2` (`idha mijjhati`) nay "thành tựu được ở nơi đây" theo quyết định vv7 (trước đó mất `mijjhati`); `4.1` bổ sung hô cách `deva` ("hỡi thiên tử"); `6.3` `Mahiddhiko` = có đại thần thông (bản cũ bỏ `mahā`); `11.5` bỏ "vì thế" tự thêm (Pāli không có `tena`).
  LỖI NHẸ (6 khoá): `2.1` bỏ "thỏa thích" thêm; `2.3` thêm `ettha` ("ở nơi đây"); `2.4` bỏ "lượn bay" thêm; `3.1` thống nhất "dung sắc" (29 + 2 tiền lệ), bỏ "sắc diện dung nhan"; `7.3` sửa lỗi chính tả "khưởi" thành "khởi" (khởi 16 + 2; khưởi 6 + 4 ở họ vv, ngoài lát này); `8.4`.
  Các lỗi trên còn lan sang tệp họ vv khác (vv54 có `8.3`, `4.1`, `3.2`; ~9 tệp có `8.1`; 6 tệp có `2.4` lượn bay): báo, không sửa ngoài lát này.
  Điểm đổi: semantic_fidelity 9.2→8.4, grammar_logic 9.2→8.8, terminology 9.0→8.6, vietnamese_clarity 9.2→8.8, ambiguity_integrity 8.9→8.4; các tiêu chí khác giữ nguyên (`triangulation` 7.5 vì không có bản Anh độc lập). final_score 9.14→8.89.
  Bất định còn lại, không phân xử được: `1.4` `rucakatthatā` ("trải thảm rực rỡ", rucaka có thể là vàng/đồ trang sức); `5.4` `yassa kammassidaṁ phalaṁ` dịch theo đa số "quả báo của nghiệp này là thế" (26/38), hơi lệch quan hệ đại từ ("đây là quả của nghiệp nào"); `11.1` `Dve daliddā vanavihārā` (không rõ "sống trong rừng" gắn với hai người nghèo hay là một nhóm khác; uddāna tên ẩn dụ); `3.4`/`7.4` `piyā` dịch "dễ chịu" theo đa số (21/22). Tiêu đề họ `Purisavimāna` → "Nam Hư Không" (0.2, 11.5) là lỗi cả họ (không có `ākāsa`), không sửa lẻ một tệp.
  Ghi chú sửa: đoạn notes cũ nói `3.1` dùng "đân gì" không khớp JSON (`3.1` thực dùng "sắc diện dung nhan"); nay đã đổi thành "dung sắc". Notes cũ giữ nguyên như lịch sử. Kiểm cuối: 46/46 khoá, thứ tự khoá = thứ tự Pāli, nháy khớp Pāli từng khoá, NFC, không `…` thừa, 1 cặp Pāli trùng nội bộ (`3.4`/`7.4`, Việt giống nhau). technical_integrity 9.6; chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 3 khoá bất đồng nghĩa → sửa 1, giữ 1, bất định 1. Sửa: 11.1 `Dve daliddā vanavihārā` "Hai vị nghèo khổ sống trong rừng" → "Hai người nghèo khổ, rừng cây và tu viện," (kiểm đếm: bài kệ tóm lược phải phủ đủ mười một cung điện vv75–vv85; `dve daliddā` = 2, `bhatako` 1, `gopālakaṇḍako` 2, `anekavaṇṇamaṭṭhakuṇḍalī` 2, `serīsako` 1, `sunikkhittaṁ` 1, tổng 9, nên `vanavihārā` phải là hai mục còn lại; `vihārā` là danh từ số nhiều chứ không phải tác nhân "người sống trong rừng"; bản nguyên bài cũng đếm "hai người nghèo khó, hai trú xá"; việc `vana-vihāra` là hai mục "rừng" và "tu viện" hay một hợp chất "nơi ở trong rừng" ×2 vẫn bất định, cả hai cách đều ra hai mục). Giữ: 5.4 `yassa kammassidaṁ phalaṁ` (bản nguyên bài đọc là mệnh đề quan hệ "quả báo này là của nghiệp nào"; bản dự án theo khuôn "quả báo của nghiệp này là thế" 26/38 khoá, giữ nhất quán và ghi lại rằng khuôn này làm nhẹ quan hệ đại từ). Bất định: 1.4 `rucakatthatā` (bản nguyên bài "được trải lót bằng vàng"; bản dự án "trải thảm rực rỡ" theo 9/11 khoá trong tầng; `rucaka` có thể là vàng hay đồ trang sức; Pāli không phân xử). Review đối kháng cùng lượt: sửa thêm 2 khoá — 11.5 `Purisānaṁ tatiyo vaggo` "Cung Điện Nam Hư Không" → "Thiên Cung Của Nam Giới" (Pāli không có `ākāsa`; khớp `0.2` của chính bài; cùng lỗi dạng nữ ở vv17:11.1, ngoài lát); 12.1 `Bhāṇavāraṁ catutthaṁ` "Chuyên luận, phần thứ tư." → "Phần tụng đọc thứ tư." (`bhāṇavāra` là phần tụng đọc; 6/6 khoá còn lại cùng Pāli trong tầng, ở pv và vv, đều dịch "Phần tụng đọc …"). Các số đã tính lại và khớp bản nguyên bài: mười hai do-tuần (1.2), bảy trăm lầu gác (1.3), bài đóng thứ mười một và phẩm thứ bảy. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
