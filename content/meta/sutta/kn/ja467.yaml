notes: |-
  Đợt 17, lát n178. Dịch từ Pāli root commit đã ghim — không có tầng Anh cho uid, tầng Việt hiện
  hành chỉ có Pháp Cú. Đối chiếu tham khảo ngoài store: bản dịch Anh R. Chalmers 1895 (public
  domain), bản Việt Tỳ khưu Indacanda (tamtangpaliviet, Jātakapāḷi tập I), và chú giải
  Jātaka-aṭṭhakathā — PTS 4.167–4.175, dịch nguyên văn từng kệ — chỉ dùng để phân xử nghĩa, không
  sao chép câu nào vào thân kinh.

  **Song song kinh điển.** Chú giải xác nhận bộ kệ này là Kāma Sutta (Sn 772 ff.). Đã dò song
  song trong root đã ghim: `snp4.1` (6 dòng trùng byte), `mnd1` Mahāniddesa (5 dòng), `an5.209`
  (biến thể, không trùng byte) — nhưng `snp4.1` và `mnd1` chưa có bản Việt trong tier (0 tệp),
  nên không có nguyên văn để dùng lại; tự dịch từ Pāli.

  **Tiêu đề có tiền lệ.** `0.1` “Jātaka”; `0.2` “Bộ Mười Hai Bài Kinh” (6 tiền lệ, cùng
  `Dvādasakanipāta`); `0.3` “Phẩm Cūḷakuṇāla” (16 tiền lệ, cùng `Cūḷakuṇālavagga`); `0.4` “4. Kinh
  Dục” theo khuôn “N. Kinh <tên>” — tầng tên SuttaCentral `ja-name:526` = “Desire”, danh từ chung
  dịch theo tiền lệ “Kinh Xoài” (ja124, ja344 — cùng dịch danh từ chung từ Ambajātaka);
  `13.1` “Kinh Dục, thứ tư.” theo ja455:13.1 “Kinh Mātuposaka, thứ nhất.” (Pāli `catutthaṁ`).

  **Phân xử điểm khó (theo chú giải Aṭṭhakathā).**
  - `apacinetheva kāmānaṁ` (8.1): chú giải “viddhaṃsetheva” = “nên hủy diệt các dục”.
  - `samuddamatto puriso` (8.3): chú giải “endowed with great wisdom, of the measure of the ocean”
    → “Người có chí lượng như biển cả”.
  - `Rathakārova cammassa` (9.1): chú giải “Rathakāroti cammakāro” = thợ giày (không phải thợ xe)
    → “Như thợ giày cắt da làm guốc”.
  - `sabbā honti sahassiyo` (10.2): chú giải    “sahassārahā — each deserving of a thousand” →
    “mỗi kệ đều đáng một ngàn” (vua trao 8 × 1.000).
  - `mahābrahme` (10.3): vocative `mahābrahmā` dùng như tôn xưng thanh niên → “này Đại Phạm Thiên”
    (Chalmers “great Brahmā”; Indacanda “vị Bà-la-môn vĩ đại” — hai cách khác nhau, chọn đúng nghĩa
    đen Pāli).

  **Số Pāli — tự tính, in phép:** `Aṭṭha` = 8 kệ · `sahassiyā` = 1.000 mỗi kệ · `sahassehi` = ngàn ·
  `satehi` = trăm · `nahutehi` = mười ngàn — CPD (“ten thousand; a myriad”) và Indacanda
  (“mười ngàn”) đồng thuận; Chalmers “tens of thousands”, bản chú giải Myanmar “millions” — hai
  nguồn kia khác, ghi lại đây chứ không đoán thêm.

  **Trùng nguyên văn nội bài:** 1 cặp (`1.2 = 2.2`) — dùng lại nguyên văn, 0 cặp lệch. Không có
  dấu lược nào trong bài (Pāli 0 `…`).

  **Bất định — ghi lại, không tự xử trong thân kinh.**
  - `iti vidvā samaṁ care` (4.4): chú giải “not subject to craving, right conduct”, Chalmers “live
    equably”, Indacanda “hành xử công bằng” → dịch “sống điều độ”; ba nguồn không khớp từng chữ.
  - `nahutehi` (11.2): như trên, chọn 10.000 theo CPD.
  Vì hai chỗ trên, `ambiguity_integrity` 9.2.

  Kiểm: 57/57 khoá đúng tập và thứ tự Pāli; NFC, nháy kép từng khoá, dấu lược — 0 lệch;
  0 cặp trùng nội bộ bị lệch. Dấu câu dòng cuối khớp Pāli.

