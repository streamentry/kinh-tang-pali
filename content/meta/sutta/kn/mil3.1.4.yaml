notes: |-
  Nội dung: vua Milinda sai bốn đại thần mời Tôn giả Nāgasena đến nội cung. Trong lúc ngài
  đang đi vào thành Sāgalā cùng tám mươi ngàn vị tỳ-kheo, quan Anantakāyo đi kề bên hỏi: khi ngài gọi
  `Nāgasena` thì cái nào là `Nāgasena`. Anantakāyo cho linh hồn-hơi thở là Nāgasena; Trưởng lão hỏi lại bằng
  ví dụ người thổi tù và, sáo tre, kèn sừng, rồi thuyết một bài giảng về Abhidhamma (hơi thở vào-ra là thân hành,
  không phải linh hồn).

