  TÊN RIÊNG — GIỮ NGUYÊN DẠNG PĀLI GỐC, VÌ ĐÓ LÀ AUTHORITY. `Devamantiya`, `Anantakāyo`,
  `Maṅkuro`, `Sabbadinno`, `Sāgalā`, `Milinda`, `Nāgasena`. Mọi số dưới đây đo trên tầng Việt
  **đã trừ hai bài của lát N20** (nếu không trừ, số của chính bài này tự đẩy số đếm lên 1).
  Đo được: **0** lần `Anantakāya`, **0** lần `Sabbadinna`, **0** lần `Sāgala`, **0** lần
  `Anantakāyo`, **0** lần `Sabbadinno`, **0** lần `Maṅkuro`, **0** lần `Devamantiya`; chỉ có **2**
  lần `Sāgalā` (ở `mil1:2.2` và `mil1:7.2`, cho `sāgalaṁ nāma nagaraṁ` → *có thành tên là
  Sāgalā*). `Sabbadinna` và `Anantakāya` là dạng PTS, còn Pāli gốc tại commit đã ghim viết
  `sabbadinno` và `anantakāyo` — tôi theo Pāli gốc. `Sāgalā` thì theo tầng Việt đã có, vì đó là
  cách duy nhất trong kho.

  HAI KHOÁ TIÊU ĐỀ CỐ TÌNH KHÔNG DÙNG TÊN RIÊNG. `:0.3` và `:7.1` ghi *Câu hỏi về thân vô tận* —
  đó là nghĩa gốc của `ananta-kāya` (thân vô tận), và cũng khớp với tên trong tầng tên đã ghim
  (*on the Breath and the Soul*), đồng thời đúng khuôn tiêu đề của loạt `mil3.1.*` (*Câu hỏi về
  việc tái sinh*, *Câu hỏi về việc khéo tác ý*…). Trong thân bài, `Anantakāyo` dùng ở `3.5`,
  `5.1`, `6.1`, `6.17` — đúng bốn khoá mà Pāli gốc có dạng `anantakāyo`.

  `bhante` → *thưa tôn giả*, `bhante nāgasena` → *thưa tôn giả Nāgasena*. Đo trên **toàn bộ**
  các bài `mil*` của tầng Việt (khoá Pāli có `bhante`): *thưa tôn giả* **369** · *bạch ngài* 123 ·
  *bạch tôn giả* 89. Riêng loạt `mil3.1.*` thì *tôn giả Nāgasena* 13 với *ngài Nāgasena* 8. Tôi
  theo số đông, dù `mil3.1.3` và `mil3.1.5` dùng *ngài*; nếu biên tập muốn thống nhất cả loạt thì
  đây là chỗ cần gộp. `thera` → *Trưởng lão* · `āyasmā` → *Tôn giả* · `mahārāja` → *đại vương* ·
  `rājā` → *Đức vua* · chủ ngữ vua → *trẫm* (theo `mil3.1.3:1.2`) · `abbhānumodi` → *hoan hỷ nhận
  lời* (theo `mil3.1.3:1.9`) · `etadahosi` → *nghĩ* (theo `dn23:19.16` cho đúng công thức này;
  `mil3.8:1.1` dùng *nói* — sai nghĩa, tôi không theo).

  DẤU `ti` — GIỮ Ở MỌI KHOÁ MÀ PĀLI CÓ. Đo trên các bài `mil*`: khoá Pāli có `”ti` thì **giữ 862 /
  bỏ 606** (58.7% giữ) — đa số giữ. Bản nháp đầu của tôi đã **sót 30 khoá**; phép kiếm riêng bắt
  được, không phải harness `_hvi` (harness chỉ đếm cân ngoặc kép, không đối chiếu `ti`). Riêng khuôn
  `“Na hi, bhante”ti.` thì 35/52 khoá trong kho ghi *Không phải vậy, thưa tôn giả*`ti.` — tôi theo
  đúng khuôn đó cho cả bốn khoá `6.7/6.9/6.11/6.13`.

  CÁC CÔNG THỨC ĐÃ TRA, ĐO ĐƯỢC (cùng cách trừ hai bài của lát). `pubbaṇhasamayaṁ nivāsetvā
  pattacīvaramādāya` → *buổi sáng, đắp y, cầm bát và y* (đúng y như `an3.63` và `an10.75`;
  `đắp y, cầm bát và y` = **59** so với `mặc y phục, cầm y bát` = **1** ở `mil3.8:4.1`).
  `antepure` → *nội cung* (**17**; cùng nghĩa `rājantepure` ở `sn42.10` và `yaṁ kiñci antepure
  kappiyaṁ` ở `mil3.8:2.3`). `uṭṭhāyāsanā` → *đứng dậy khỏi chỗ ngồi* (**32**) / *đứng dậy từ
  chỗ ngồi* (**8**). `saṅkha` → *tù và* (theo `dn23:19.15` *cây tù và* cho `Neva so saṅkho
  saddamakāsi`) · `vaṁsa` → *cây tre* · `siṅga` → *cái kèn* (0 tiền lệ cho `siṅga`, chọn theo nghĩa
  ổng cầm để tạo tiếng để nói với bộ ba ẩn dụ này). `jīvo` → *linh hồn* (**40**, `dn23:18.x`),
  `vāto` → *gió* ở đây nên *hơi thở* (**155**) dành cho `assāsapassāsā`; hai từ không lẫn được vì
  `vāto` đã là gió trong khoảng rỗng ngay trước đó. `assāsapassāsā` → *hơi thở* (theo `mn44:14.2`
  và `sn41.6:1.8`, và Sujato dịch *Breathing*) · `kāyasaṅkhārā` → *hoạt động của thân* (theo
  `mn62:26.4` và `mn118:18.4`) · `sakkāro` → *lễ cúng dường* (theo `snp3.2:14.1`) · `maṅku ahosi` →
  *thấy mình nhục nhã* (theo `dn25:20.11` cho `maṅkubhūto`) · `upāsakattaṁ paṭivedesī` → *đã trở
  thành cư sĩ* (theo `dn4:24.0` *tuyên bố trở thành cư sĩ*) · `atthaṁ jappehī` → *hãy giảng giải ý
  nghĩa cho tôi được hiểu* (theo `mil3.2.5:1.15` và `mil3.3.6:6.3`). **CỐ TÌNH KHÔNG DÙNG LẠI
  `Trẫm` của `mil3.2.5:1.15`**: Pāli hai khoá gần như giống hệt nhau, nhưng người nói khác nhau —
  `mil3.2.5` là vua, `6.15` là Anantakāyo, một cư sĩ.

  KHÔNG CÓ DẤU LƯỢC nào ở bài này: đo trên cả 52 khoá, Pāli có **0** `…pe…` và **0** `…` trần.
  Bốn nhóm Pāli trùng nguyên văn trong chính bài (`“rājā, bhante, milindo evamāha—` ×2 ·
  `“āgacchatu, mahārāja, dasahi bhikkhūhi saddhin”ti.` ×3 · `“yattake bhikkhū icchati,
  tattakehi bhikkhūhi saddhiṁ āgacchatū”ti.` ×2 · `“Na hi, bhante”ti.` ×4) đều có bản Việt nhất
  quán — bài không tự mâu thuẫn.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được
  JSON hợp lệ, `set(khoá Việt) == set(khoá Pāli)` (52 == 52, 0 thiếu, 0 thừa), 0 khoá rỗng,
  mọi giá trị NFC, dấu lược khớp Pāli từng khoá, mẫu nháy `“”` và `‘’` khớp Pāli từng khoá và
  cân trên cả bài, không trùng nguyên văn Pāli, không Pāli lọt vào, không sót dấu `ti`, và YAML
  sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  Giải quyết draft 2026-10-12: kiểm toán độc lập, đọc đối kháng cả 52 khoá từ Pāli và viết lại những
  khoá lệch nghĩa. Mục này THAY THẾ các câu cũ nói về: tiêu đề *Câu hỏi về thân vô tận*; *tám nghìn
  vị tỳ-kheo*; *ẩn dụ gió trong khoảng rỗng*; `kāyasaṅkhārā` → *hoạt động của thân*; đoạn "tên riêng" nói hai khoá
  tiêu đề cố ý không dùng tên riêng; và cách đặt dấu hỏi `?` sau ngoặc kép ở các khoá câu hỏi (đã bỏ).

  LỖI NGHĨA THẬT ĐÃ SỬA — 33 khoá được ghi lại, trong đó khoảng 25 khoá sai nghĩa hoặc bịa thêm,
  số còn lại là sửa giọng, đại từ, dấu câu. Chi tiết:
  (1) `5.4` — `asītiyā bhikkhusahassehi` là tám MƯƠI nghìn (80 × 1.000 = 80.000), bản cũ ghi *tám nghìn*;
  tầng Việt cho cùng cụm ở `mil2:65.2` và `mil2:73.2` đều là *tám mươi ngàn* (2/2), nên theo đó.
  (2) `0.3`, `7.1`, `translationTitle` — `Anantakāya` là TÊN NGƯỜI (quan Anantakāyo ở `3.5`, `5.1`, `6.1`,
  `6.17`), không phải "thân vô tận"; tên bài là *Câu hỏi của Anantakāya*, đúng khuôn `mil3.4.2` (*Câu hỏi
  của Nāgasena*). Tên Anantakāya có nghĩa "thân vô tận" là chuyện từ nguyên, không đưa vào tiêu đề.
  (3) `6.8` · `6.10` · `6.12` — bản cũ bịa ra *"những thứ vừa khít vào tù và ấy lấp kín tù và"*; Pāli
  `saṅkhadhamakā / vaṁsadhamakā / siṅgadhamakā` là NGƯỜI thổi tù và / sáo tre / kèn sừng (`dhamenti` = thổi),
  và `tesaṁ vāto` = *gió của họ*. Cũng sửa `6.14`: `te na marantī` là *họ không chết*, không phải *những
  thứ ấy*.
  (4) `6.16` — bản cũ mất phủ định `neso`: *Đây không phải là linh hồn*; hơi thở vào-ra là thân hành.
  `kāyasaṅkhārā` → *thân hành* (91 khoá trong tầng Việt, trừ bài này) so với *hoạt động của thân* (2 khoá);
  phần "mn62, mn118" của ghi chú cũ SAI — hai bài ấy cũng dịch *thân hành*. `jīvo` → *linh hồn*, `vāto jīvo`
  là đồng vị: *cái gió ở bên trong, tức là linh hồn* (`6.5`); bản cũ có *"khoảng rỗng"* mà Pāli không có
  (`abbhantare` chỉ là *ở bên trong*).
  (5) `2.3` — bản cũ bịa *ra lệnh chuẩn bị xe ngựa… làm cho chiếc xe sẵn sàng* và dịch `āpucchitvā` là *hỏi
  thăm*; Pāli: *từ giã, lên xe, vừa tụng đọc "Nāgasena! Nāgasena!" vừa ra đi* (`sajjhāyaṁ karonto`, theo
  cách dịch *tụng đọc* ở `an6.51`).
  (6) `3.6` · `3.8` · `4.2` · `4.6` · `4.10` — bản cũ đảo vai: *"Xin hãy đến, đại vương"* khiến đại vương như
  bị mời đi; thực ra `āgacchatu` là ngôi thứ ba — để Đại đức đến. Sabbadinno đề nghị MƯỜI vị, vua nói *tùy ý
  ngài*. Chấm hỏi `?` thừa sau ngoặc kép đã bỏ.
  (7) `1.2` — bản cũ hiểu sai `yannūnāhaṁ sve antepure sallapeyyaṁ` thành *không nên để lỡ cuộc đàm thoại*;
  đúng là *Vậy thì ngày mai trẫm hãy đàm thoại trong nội cung*. `yāva apucchitāniyeva … atha sūriyo atthaṁ
  gamissati` = *trong khi những điểm ấy vẫn còn chưa được hỏi thì mặt trời sẽ lặn*.
  (8) `4.11` — bỏ *khắp nơi* (không có trong Pāli): `sabbo ayaṁ sakkāro paṭiyādito` = toàn bộ lễ cúng dường
  này đã được chuẩn bị. `6.15` — bỏ *bậc đại* (Pāli chỉ có `vādinā`, một người biện luận). `6.17` — bản cũ
  *"người ta bảo rằng… đã trở thành cư sĩ"* không có trong Pāli; `upāsakattaṁ paṭivedesi` = tuyên bố trở
  thành cư sĩ (theo `dn4:24.0`). `3.4` — `suṭṭhu` là *rất tốt*, không phải `sādhu`.
  (9) `2.2` và `4.12` — người nói là vua, nên `tvaṁ` dịch *khanh* (tiền lệ `dn26:12.18` *các khanh*; vua
  nói với quan).

  BLOCKER ĐÃ GỠ.
  (D) Bất định ở `4.12` (cũ gọi là "không phân xử được"): GIẢI QUYẾT ĐƯỢC. `bhaṇe` là tiếng gọi (vocative
  particle) người dưới quyền, KHÔNG phải một dạng động từ hỏng. Tiền lệ trong tầng Việt: `dn16:4.35.2`,
  `dn16:6.13.2`, `dn16:6.18.2`, `dn23:25.12`, `dn23:25.13`, `dn26:12.18` đều dịch `bhaṇe` thành lời gọi
  (*này ngươi / này các ngươi / này các khanh*) — 6/6. Vậy `Ayaṁ bhaṇe sabbadinno aññathā bhaṇati` = *Này các
  khanh, Sabbadinno này nói khác đi*; `kiṁ nu mayaṁ nappaṭibalā bhikkhūnaṁ bhojanaṁ dātun`ti = *Chẳng lẽ
  chúng ta không đủ sức dâng thức ăn cho các tỳ-kheo sao?* — chủ thể `mayaṁ` là chính vua và các quan.
  Nghĩa này khớp mạch: vua đã chuẩn bị đủ, chỉ vì Sabbadinno giới hạn số vị nên vua trách; kế đó
  Sabbadinno `maṅku ahosi` (`4.13`, *trở nên bối rối*, theo cụm `maṅkubhūta` = *bối rối* ở `an10.93:15.1`,
  `an3.64:6.6`…). Không còn chỗ nào phải đoán.
