notes: |-
  Đợt 19, làn 86. Dịch từ Pāli root commit đã ghim, đủ 121/121 khoá (0.1–0.4, 1.1–29.4, 30.1), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng khổ không được ghi vào thân kinh; người nói chỉ được đọc từ nội dung và từ cách xưng hô trong kệ (xem BẤT ĐỊNH 1). Việc đối chiếu chỉ dựa vào Pāli root, các Pāli song hành trong tầng Việt đã dịch và tiền lệ nội bộ; không dùng bản dịch bên thứ ba nào để sao chép hay để làm cơ sở cho `triangulation`.

  **Tiêu đề và colophon.**
  - `0.2` “Bộ Hai Mươi Bài Kinh” và `0.3` “Phẩm Mātaṅga”: dùng lại nguyên văn `ja497:0.2`–`0.3`, `ja504:0.2`–`0.3`, `ja508:0.2`–`0.3` (19 khoá trùng ở `0.2`, 9 khoá trùng ở `0.3`, 0 lệch).
  - `0.4` “9. Kinh Somanassa”, `30.1` “Kinh Somanassa, thứ chín.”: giữ phiên âm tên như `ja504:0.4` “8. Kinh Bhallātiya” và `ja504:26.1`; số `9.` ở `0.4` và `navamaṁ` ở `30.1` đều là 9 ⇒ “thứ chín” khớp.

  **Tiền lệ dùng lại nguyên văn.** Đã dò toàn tầng `kn` đã dịch (2.136 tệp ngoài bài này): 17 khoá Pāli của bài có dòng trùng nguyên văn (sau khi bỏ dấu câu và hạ chữ hoa) với bài khác, tổng 67 cặp trùng, trong đó 19 cặp bản Việt khác với bản của bài này. 13 khoá dùng lại nguyên văn:
  - `0.2`, `0.3` (xem trên).
  - `6.1` “Nghe lời nói ấy của vị ấy,”: 8 cặp trùng, 3 dạng Việt (“Nghe lời nói ấy,” 4 · “… của người ấy,” 2 · “… của vị ấy,” 2). Chọn “của vị ấy” vì Pāli có `tassa` (4/8 cặp giữ chủ ngữ, 4/8 bỏ); 6 cặp khác với bản này, đều là dạng bỏ `tassa` hoặc “người ấy”.
  - `12.4` “xin cho phép tôi, tôi sẽ xuất gia, tâu đại vương” dùng nguyên văn `ja509:14.4` (1 cặp, 0 lệch).
  - `19.1`–`19.4` và `20.1`–`20.3` (7 khoá): kệ trùng với `ja351` (4.1–5.3), `ja452` (9.1–10.3) và `ja332` (3.1–4.3). `ja351` và `ja452` giống hệt nhau ở cả 7 khoá; `ja332` dịch khác ở cả 7 (ví dụ `disampati` “đấng chúa tể muôn dân” so với “đấng chúa tể bốn phương”). Chọn theo 2/3 bài; bỏ dấu nháy mở của hai bài kia vì Pāli ở đây không có. Bản `ja332` không thuộc lát này, không đụng; báo người điều phối: một cùng Pāli, hai cách Việt trong tầng.
  - `20.4` (`yaso kitti ca vaḍḍhati.`) gần trùng `ja351:5.4`/`ja452:10.4` (`…vaḍḍhatī”ti.`); dịch giống nội dung nhưng không dùng nguyên văn vì kết câu khác (không có `ti`).
  - `26.3` “đã đặt xuống gậy gộc với mọi chúng sinh,”: 3 cặp trùng (`thag16.8:2.2` “đã đặt xuống gậy gộc với mọi chúng sinh”; `snp1.3:1.1` cùng chữ; `snp2.14:20.3` “Sau khi đặt xuống gậy gộc đối với mọi loài hữu tình”); theo 2/3, 1 cặp khác.
  - `29.2` “bậc đa văn, biết suy nghĩ nhiều;” nguyên văn `ja391:6.2` (1 cặp, 0 lệch).
  Không dùng lại, có lý do: `7.3` (`Akkhāhi me pucchito etamatthaṁ`, 2 cặp: `ja438:4.4` và `ja456:6.3`, hai bản Việt khác nhau và khác bản này vì đổi chủ thể; ở đây người con xin cha nói khi mình hỏi, đọc `pucchito` là “được hỏi (bởi tôi)” như `ja456:6.3`); `13.2` (`ja333:4.3` “Ta xin trao toàn bộ quyền lực cho ngài,” nhưng ở `ja505` người nói là cha nói với con nên đổi “ngài” thành “con”); `22.3` và `29.1` (xem BẤT THƯỜNG ngoài bài, dưới đây).
  **Bất thường ngoài lát (báo, không sửa):** `ja453:10.2` dịch `Viññuppasatthāni sukhudrayāni;` là “đều đã được biết, dễ tìm, dễ có được;” trong khi `ja444:5.5` dịch `Viññuppasatthañca` “được bậc trí tán thán” và `iti22:5.2`, `iti60:3.2` dịch `sukhudrayaṁ` “đưa đến an lạc về sau” (2/2); `ja391:6.1` dịch `Addhā have sevitabbā sapaññā,` là “Với bậc có trí tuệ, việc tu hành phải kéo dài,” trong khi `sevitabbā` là “nên thân cận”. Cả hai khoá nên được người điều phối xem lại; bài này không lấy hai khoá đó làm tiền lệ.

  **Trùng nguyên văn trong chính bài (có kết quả):** 121 khoá, 4 nhóm Pāli trùng (sau khi bỏ dấu câu và hạ chữ hoa): (7.1 = 23.1), (7.2 = 23.2), (9.2 = 10.2), (9.3 = 10.3). Bản Việt của cả 4 nhóm giống hệt nhau về chữ; khác biệt duy nhất là dấu nháy mở `“` ở `7.1` và `9.x` theo Pāli từng khoá, và `23.1` không có. Cặp gần trùng nhưng khác nội dung, đã đọc: `17.x` và `18.x` (cặp khuôn kệ đối lập `Anisamma`/`Nisamma`, `anavatthāya`/`sammāvatthāya`, `vebhaṅgo`/`sampatti`, `pāpako`/`bhadrako`) phải khác và đã khác; `8.x` và `9.x` (cùng chủ đề `gahapati`, hai vế hỏi và đáp) khác ở động từ và ngôi.

  **Số Pāli:** `dasaṅguliṁ` (5.2) = dasa 10 + aṅguli “ngón tay” ⇒ **mười ngón tay**; `ekāparādhaṁ` (16.2) = eka 1 + aparādha ⇒ **một lỗi**; `0.4` “9.” và `navamaṁ` (30.1) = **9** ⇒ “thứ chín” khớp. `tidivasmiṁ` (15.1): `tidiva` là một tên của cõi trời (tiếng Pāli `ti-diva`), không phải con số ⇒ dịch “cõi trời”. Không gặp cụm số chưa phân xử (`Tiṁsakappasahassa`).

