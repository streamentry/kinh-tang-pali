  - Không đụng `content/glossary/pali-vi.yaml`.

  **Xưng hô.** Vua (cha) với con: `8.4` “ngươi” (lúc giận, hỏi tội), `10.1` “ngươi”, từ `13.1` trở đi “con”/“hoàng tử” (đã hạ giận, năn nỉ; có `putta` ở `16.2`); `13.3` `tvaṁ` ⇒ “con”. Hoàng tử với vua: “tôi”/“ngài”. `25`–`27`: vua nói với hoàng hậu `Sudhammā`: “ta”/“nàng”. `26`, `28`: hoàng hậu với con và với vua.

  **Dấu câu.** Nháy khớp Pāli từng khoá: 121/121 khoá khớp số lượng cả `“`, `”`, `‘`, `’`, `"`, `…` (0 lệch; tổng “ = ” = 19, nháy đơn Pāli = 0). Nháy mở ở `1.1`, `2.1`, `3.1`, `4.1`, `5.1`, `7.1`, `8.1`, `9.1`, `10.1`, `11.1`, `13.1`, `14.1`, `16.1`, `17.1`, `25.1`, `26.1`, `27.1`, `28.1`, `29.1`; nháy đóng ở `1.4`, `2.4`, `3.4`, `4.4`, `5.4`, `7.4`, `8.4`, `9.4`, `10.4`, `12.4`, `13.4`, `15.4`, `16.4`, `24.4`, `25.4`, `26.4`, `27.4`, `28.4`, `29.4`. Các khoá `4.1`/`4.4` và `17.1`/`24.4` nháy chạy qua nhiều khoá (`4.1` mở, `4.4` đóng với `4.2`–`4.3` ở giữa; `17.1` mở, `24.4` đóng với `19`–`23` ở giữa), nên đúng là *khớp Pāli từng khoá*, không phải mỗi khoá tự cân. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (phép so “…pe…” chạy rỗng vì Pāli không có lược; Pāli cũng không có `(…)` trần nên không có gì để giữ). NFC: 121/121 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa; chữ số chỉ có ở `0.4` (“9.”).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ nội dung chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1–2: vua hỏi, rồi một người tu (đạo sĩ) than; 3: vua ra lệnh; 4: sứ giả; 5, 7, 9, 11–12, 14–15, 17–24: hoàng tử Somanassa (7, 9 hỏi và đáp; 11–12 nói với hội chúng; 14–15 từ chối ngôi); 8, 10, 13, 16: vua; 25, 27: vua nói với hoàng hậu Sudhammā; 26, 28: hoàng hậu; 29: lời kết, ngôi nói không xác định trong bản root. Không ghi thêm tên nhân vật nào vào thân kinh ngoài những tên có trong kệ (`Somanassa`, `Sudhammā`, `Kuru`).
  2. `1.4` `Kvajja setu nihato pathabyā`: `setu` “cầu” (cũng “đê, bờ chắn”) đi với `nihato` “bị đánh gục”; dịch “chiếc cầu bị đánh sập” và để nguyên nghĩa đen; có thể là ẩn dụ (người chống đỡ/che chở) hoặc một chữ khác (`ketu`, “cờ hiệu”). Không phân xử được từ tầng (tầng không có tiền lệ `setu` đi với `nihato`). `1.3` `rudantu` là mệnh lệnh nhưng dịch “phải khóc” như câu hỏi tu từ.
  3. `2.3` `Ahiṁsako reṇumanuppavissa`: `reṇu` vừa là “bụi, phấn” vừa là tên riêng; giữ phiên âm “Reṇu” và dịch “đã đi vào Reṇu” (không thêm “xứ/vườn”), vì không xác định được `reṇu` là tên người, tên nơi hay chữ “bụi”. Cách đọc khác: “đi vào lớp bụi”. Tầng có 0 khoá cho dạng `reṇumanuppavissa`.
