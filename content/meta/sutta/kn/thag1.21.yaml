notes: |-
  9 khoá: bốn tiêu đề, bốn vế kệ, và dòng `… Nigrodho thero ….` ở `1.5`. Dấu lược `…` được giữ nguyên theo Pāli.
  
  **Điểm tốt đáng nói: bản dịch bám Pāli ở chỗ Sujato lệch.** Ở Sujato, `1.3` = *Mendicants advance by the path* và `1.4` = *where no fear remains* — **hai vế bị đảo chiều** so với Pāli (`Yattha bhayaṁ nāvatiṭṭhati` = "ở đâu nỗi sợ không bám trụ"; `Tena maggena vajanti bhikkhavo` = "theo con đường ấy các tỳ-kheo đi đến"). Bản dịch đặt đúng vế nào vào khoá nào: `1.3` → *Nơi nào nỗi sợ không bám trụ*, `1.4` → *theo con đường ấy các tỳ-kheo đi đến*. Đây là chỗ Pāli phải thắng, và nó thắng.
  
  **Cấu trúc mệnh đề ra lệnh được giữ.** `sato tatrādhivāsaye` là mệnh lệnh khuyên nhủ (thứ tự 2 ngôi của √vas: `gaccha/sato`), bản dịch dùng *hãy chánh niệm mà cư trú nơi ấy* — đúng chức năng. Không thêm đại từ chủ ngữ nào, đúng như quy ước tầng.
  
  **`Satthā no amatassa kovido` → *Thầy chúng tôi rành thông bất tử*** ✓ — `no` (của chúng tôi) và `amatassa` (bất tử) đều đúng; `kovido` = "rành, thạo".
  
  **Về `Ta` ở `1.1`.** `Nāhaṁ bhayassa bhāyāmi` → *Ta không sợ nỗi sợ hãi*. Tôi đã tra tiền lệ trước khi chấm, và kết quả là **ngôi một trong tầng này được dịch theo hai cách**. Đếm trên `thag` + `thig`: `tôi` 30 lần (kể cả `thag1.103:1.1` `Nāhaṁ etena atthiko` → *Tôi không thiếu gì…* và `thag6.2:6.3` → *Tôi không bị cái rét ấy hành hạ*), `ta`/`Ta` 7 lần. Ngoài ra `ta` là ngôi một rất phổ biến ở `an` (*Này các tỳ-kheo, Ta không thấy một pháp nào khác…*). Nên *Ta* ở đây **đúng**, không phải lỗi; nhưng lô này tự dùng lẫn hai dạng cho cùng ngôi một (`thag1.48`, `thag1.73`, `thag1.54` dùng *tôi*; `thag1.21`, `thag1.67`, `thig1.11` dùng *Ta/tôi* xen). Tôi trừ nhẹ ở `terminology` vì lý do nhất quán nội bộ, không phải vì sai nghĩa.
  
  **Tầng Anh** có mặt đủ bốn vế thân. `Tatiyavagga` → *Phẩm Thứ Ba* khớp 2 tệp thag cùng phẩm (`thag1.25`, `thag1.15`).
  
  **Tầng Việt**: không có Thích Minh Châu cho Trưởng Lão ở commit đã ghim.
