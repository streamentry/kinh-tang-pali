notes: |-
  Đợt 16, lát f207. Dịch từ Pāli root theo khuôn Netti đã có (`ne8`, `ne23`):
  `Tattha katamo padaṭṭhāno hāro?` → "Ở đây, nhóm nền tảng hướng dẫn là gì?";
  `padaṭṭhāna` → "nền tảng ứng với" (tiền lệ `ne23:2.2`); `Niyutto padaṭṭhāno hāro`
  → "Nhóm nền tảng hướng dẫn đã được vận dụng."; `Tenāha āyasmā mahākaccāyano`
  → "Bởi vậy, Tôn giả Mahākaccāyano nói:" (`ne8:10.2`).
  Chain parse `titthaññutā→…→vimuttiñāṇadassana` bám đúng thứ tự Pāli; thuật ngữ
  dựng theo tiền lệ an11.1/sn (avippaṭisāra "không hối tiếc", pāmojja "hoan hỷ",
  passaddhi "khinh an", samādhi "chánh định", yathābhūtañāṇadassana "sự thấy biết
  như thật", nibbidā "sự chán ngại", vimuttiñāṇadassana "giải thoát tri kiến").
  `:0.3` = "Nhóm 4"; `:0.4` `Padaṭṭhānahāravibhaṅga` → "Nhóm Nền Tảng Hướng Dẫn";
  translationTitle đặt theo `:0.4` (khớp 4/4 bài vibhaṅga cùng tệp).
  `lọt_pāli`: `ne7:4.4` giữ `Mahākaccāyano` là tên riêng — chủ ý, không phải rò.
  Cổng kỹ thuật CHƯA chạy — cần chạy đủ bốn lệnh trước khi coi `technical_integrity: 9.6`
  là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 3.9 — “Tham ái có đặc trưng là chấp thủ; thủ là nền tảng ứng với tham ái” → “Tham ái có đặc trưng là sự đắm chấp; nó là nền tảng ứng với thủ”: (a) `sā upādānassa padaṭṭhānaṁ` là *tham ái* làm nền tảng cho *thủ*, bản cũ đảo chiều; (b) `ajjhosāna` không phải `upādāna` nên bỏ “chấp thủ” (đã dành cho `upādāna`), dùng “sự đắm chấp” theo `pe6:10.9` (cùng Pāli). Cùng lỗi đảo chiều và cùng thuật ngữ được sửa ở hai khoá cùng bài dù không nằm trong danh sách: 3.8 (`sā taṇhāya padaṭṭhānaṁ`: “tham ái là nền tảng ứng với thọ” → “nó [thọ] là nền tảng ứng với tham ái”, khớp `pe6:10.8`) và 1.5 (`Ajjhosānalakkhaṇā taṇhā`: “chấp thủ” → “sự đắm chấp”; vế “cái đáng ưa, cái dễ chịu là nền tảng ứng với tham ái” đúng chiều nên giữ). Đã đối chiếu mọi khoá `padaṭṭhānaṁ` ở 3.1–3.21: chỉ 3.8 và 3.9 bị đảo.

  Quyết định hội đồng biên tập 2026-10-16: B5 — `0.4`, `1.1`, `1.2`, `4.5` (`hāra` = “phương thức”; tiêu đề `-vibhaṅga` không dịch là “nhóm”).
