notes: |-
  Đợt 16, lát f207. Dịch từ Pāli root theo khuôn Netti đã có (`ne8`, `ne23`):
  `Tattha katamo padaṭṭhāno hāro?` → "Ở đây, nhóm nền tảng hướng dẫn là gì?";
  `padaṭṭhāna` → "nền tảng ứng với" (tiền lệ `ne23:2.2`); `Niyutto padaṭṭhāno hāro`
  → "Nhóm nền tảng hướng dẫn đã được vận dụng."; `Tenāha āyasmā mahākaccāyano`
  → "Bởi vậy, Tôn giả Mahākaccāyano nói:" (`ne8:10.2`).
  Chain parse `titthaññutā→…→vimuttiñāṇadassana` bám đúng thứ tự Pāli; thuật ngữ
  dựng theo tiền lệ an11.1/sn (avippaṭisāra "không hối tiếc", pāmojja "hoan hỷ",
  passaddhi "khinh an", samādhi "chánh định", yathābhūtañāṇadassana "sự thấy biết
  như thật", nibbidā "sự chán ngại", vimuttiñāṇadassana "giải thoát tri kiến").
  `:0.3` = "Nhóm 4"; `:0.4` `Padaṭṭhānahāravibhaṅga` → "Nhóm Nền Tảng Hướng Dẫn";
  translationTitle đặt theo `:0.4` (khớp 4/4 bài vibhaṅga cùng tệp).
  `lọt_pāli`: `ne7:4.4` giữ `Mahākaccāyano` là tên riêng — chủ ý, không phải rò.
