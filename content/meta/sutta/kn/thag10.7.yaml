  `translationTitle` — ĐO TỈ LỆ, GHI CẢ HAI SỐ.
  Đo trên **238** tệp `thag*.yaml` có trong kho (238/238 đều khai trường này):
  hình `Kinh Kệ Của Trưởng Lão <Tên>` chiếm **203**;
  `Kệ Ngôn Của Trưởng Lão` 17; `Kệ Ngôn Trưởng Lão` 13; `Bài Kệ Của Trưởng Lão` 3;
  `(Lần Thứ Hai) Kinh Kệ Của…` 1; `Kinh Kệ Của Vị Trưởng Lão…` 1.
  Ở phạm vi gần nhất, `thag10.1`–`thag10.6` trên đĩa: **6/6** theo hình `Kinh Kệ Của Trưởng
  Lão <Tên>`. Hai phạm vi cho cùng đa số ⇒ theo đa số, không phải luật riêng của phẩm
  `tha-ap` (luật đó chỉ có hiệu lực với chính `tha-ap`).
  Về dấu ngoặc ở `:0.4`: đo **238** tệp `thag` có bản Việt thì **237** không mở đầu bằng dấu
  ngoặc, **1** có (`thag1.100`, do `(Dutiya)`). Riêng cặp song sinh `thag1.89` `(Paṭhama)` /
  `thag1.100` `(Dutiya)` thì **1 giữ : 1 bỏ**. Vì vậy `(Apara)` ở đây được BỎ. Lý do thêm:
  `Apara` là "còn lại/kia kia", KHÔNG phải thứ tự, nên ép vào khuôn `(Lần Thứ Hai)` sẽ bịa ra
  một con số mà Pāli không nói — và Sujato tự đánh số bài này là Gotama thứ ba, không phải
  thứ hai. Bỏ ngoặc là cách duy nhất không bịa. Hệ quả phải nói thẳng: tiêu đề này trùng với
  `thag2.9` và `thag3.14` (cùng tên Gotama); người đọc phân biệt được nhờ khối `uddāna` ngay
  dưới, nơi `gotamo` là vị thứ bảy của bộ Mười.
  `:0.1` giữ nguyên Pāli `Theragāthā 10.7` — **227/238** bài `thag` giữ dạng này.
  `:0.2` `Dasakanipāta` → `Bộ Mười Bài Kinh` (**6/6** trong `thag10.*`).
  `:0.3` `Paṭhamavagga` → `Phẩm Thứ Nhất` — **76/76** bài `thag` có Pāli `:0.3` = `Paṭhamavagga`
  dùng đúng dạng này, không một ngoại lệ.
  DÒNG BÌA `:10.5` `… Gotamo thero … ` (Pāli chỉ có hai dấu lược trần, KHÔNG có dấu chấm
  sau) → `… Trưởng lão Gotama …`. Đo phạm vi gần nhất trong `thag`: Pāli kết `…` trần thì
  Việt kết ` …` là **11 : 8**; Pāli kết `….` mới kết ` ….`. Hình `… Trưởng lão <Tên> …`
  chiếm **213** so với `… Tôn giả Trưởng lão <Tên> …` là 9 — nên `Tôn giả` không dùng ở đây.
  `:10.6` `Dasakanipāto niṭṭhito.` → `Bộ Mười Bài Kinh đã khép lại.`: trong `thag`, cụm `<tên
  :0.2> đã khép lại.` xuất hiện **3** lần, là dạng phổ biến nhất; các dạng lệch (`Dứt Nhóm
  Một Kệ.`, `Nhóm Hai Kệ đã hoàn tất.`, `Nhóm Năm Bài Kệ chấm dứt.`) mỗi dạng 1.
  `:11.0` `Tatruddānaṁ` → `Tóm tắt ở đây:` — **8 : 1** trong `thag` (ngoại lệ `thag2.49`).

  SỐ PĀLI — TỰ TÍNH, KHÔNG CHÉP.
  `Sattime dasake therā` → **bảy** vị trưởng lão; `gāthāyo cettha sattatīti.` → **bảy** bài
  kệ. Kiểm chéo độc lập bằng danh sách tệp đã ghim: `thag10` có đúng **7** tệp, 10.1→10.7.
  Cả hai số khớp 7/7. Đây là chỗ dễ sai nhất của lát: luật `sattati = 70` chỉ đúng cho nghĩa
  "bảy mươi" và KHÔNG được áp ở đây, vì `sattatīti` ở cuối khối uddāna là dạng "bảy" + `iti`,
  cùng loại với `navāti` (thag9.1:10.4) = "chín", `dvādasāti` (thag5.12:7.4) = "mười hai",
  `catuvīsatīti` (thag8.3:9.4) = "hai mươi tư". Trên đĩa không có cụm số Pāli nào khác trong
  53 khoá này cần tính.

  BẤT ĐỊNH VÀ CHỖ PHẢI PHÁN, ĐÃ GHI.
  (1) **`:1.2` `Avalokeyyātha pāvacanaṁ` — BẤT ĐỊNH THẬT SỰ, đã ghi.** `pāvacana` là hapax
  trong toàn lớp Pāli đã dịch của kho (8 lần xuất hiện, không bản Việt nào), nên không có
  tiền lệ để bắt chữ. Sujato đọc là *the dispensation* (giới luật). Tôi dịch theo nghĩa
  gốc, "sự tụng đọc", vì đó là nghĩa thường của từ và có 88 khoá tiền lệ cho *recitation*
  trong tầng. Nếu người biên tập giữ quan điểm của Sujato thì chỉ cần đổi một khoá.
  (2) **`:10.2` `Samūlake āsave padāleyya` — BẤT ĐỊNH THẬT SỰ, đã ghi.** `samūlaka` là
  tính từ "không gốc" đi kèm `āsave` (số nhiều, tân ngữ), nên Pālic nghiã là "lậu hoặc không
  gốc"; Sujato đọc `samūla` như trạng ngữ và dịch *defilements shattered, root and all*.
  Tôi theo Pāli là chính (authority cuối cùng) và giữ tính từ, dịch `lậu hoặc không còn gốc`.
  Hai cách đọc hội tụ cùng một ý (dứt sạch tận gốc) nên nghĩa không đảo chiều, nhưng cứ ghi
  rõ để người biên tập phán.
  (3) **`:11.2` `ekavihārī ca kappino` — ĐÃ PHÁN, CÓ BẰNG CHỨNG ĐẾM ĐƯỢC.** `kappino` không
  phải tên riêng thứ tám trong tầng Pāli: khối uddāna nêu đúng bảy trưởng lão, và thứ tự bảy
  tên trong uddāna khớp **7/7** với thứ tự bài của `thag10.1`→`thag10.7` nếu `kappino` =
  `Mahākappina` (`thag10.3`). Vì vậy `:11.2` dịch `Ekavihārī cùng Kappin;`. Đây là suy luận
  có kiểm chứng bằng đếm, không phải đoán.
  (4) `muni` (`:10.1`): toàn tầng `muni` → "ẩn sĩ" chiếm **29/110** khoá, nhưng trong chính
  bộ Mười này, `thag10.6:5.2` đã dùng "bậc hiền siêu" cho đúng `muni` và cùng chủ thể, nên tôi
  giữ "bậc hiền siêu" để bộ Mười đọc liền không lệch. Ghi rõ hai số vì hai phạm vi cho đa
  số khác nhau.
  (5) `padāleti` (`:10.2`): "phá vỡ" **20** so với "phá tan" **16** trên 48 khoá; tôi chọn
  "phá tan" vì đi với `lậu hoặc` tự nhiên hơn, và ghi cả hai số.
  (6) `Sāmaññaṁ ajjhupagatassa` (`:1.4`) → "đời sống sa-môn": trên 106 khoá Pāli có `sāmaññ`,
  "đời sống sa-môn" là **10**, cao nhất trong các cách dịch đo được (kế đến "thân phận sa-môn" 9).
  `Etaṁ samaṇassa patirūpaṁ` → "Điều này thích hợp với bậc sa-môn": với `patirūpa`, toàn tầng
  có 61 khoá đã dịch thì "thích hợp" **25**, "xứng đáng" 12 — theo đa số. Câu này lặp nguyên
  văn ở 8 khoá (`:2.4`–`:9.4`) và cả 8 đều dịch giống nhau, không khoá nào lệch.

  THUẬT NGỮ, SỐ ĐẾM (đều đo trên tầng, kèm phạm vi gần khi hai nơi khác nhau).
  `bojjhaṅga` → "giác chi": **135/135** khoá Pāli có `bojjhaṅga` mà đã dịch đều dùng "giác
  chi". `iddhipāda` → "tức địa": **56/97** khoá có `iddhipāda`; "tỳ-bà-sa" **0**. `indriya`
  → "căn" **250/431**. `bala` → "lực" **158/652**. `senāsana` → "chỗ ở" **65/108**.
  `āraññaka senāsana` → "chỗ ở nơi núi rừng", theo đúng tiền lệ `an7.23:7.1`.
  `pajah` → "từ bỏ": **184/221**. `bhāve` → "tu tập": **780/892**. `yathābhūta` → "như
  thật": **593/676**. `adhicitta` → "tâm tăng thượng": **36/48`. `anattasaññā` → "vô ngã":
  **29/29**. `asubhasaññā` → "bất tịnh": **7/8**. `anabhirat` → "không ham muốn" **16** so
  với "bất mãn" **13** trên 63. `vippamutta` → "giải thoát". `ācāragocara` → "oai nghi và
  hành xứ", theo `sn47.46:2.4` và `an8.13:2.3`. `yutto` → "chuyên tâm" **17/153**.
  `apaciti` → "lễ bái" (`ja288:2.4`, `ja292:3.3`); `sagāravatā` → "cung kính" (`sn48.58:3.2`
  dịch "cung kính và tôn trọng") — hai từ Pāli khác nên hai cách dịch khác nhau.
  `garu` → "bậc Đạo Sư". `bāhusacca` → "học rộng" ở `:7.1` và `sikkhā` → "học tập" ở
  `:2.2`, để hai pāda không lặp một cách dịch; đo được `bāhusacca` → "học tập" **8**,
  "nhiều học" **4**, "học rộng" **1** trên 13. `taṇhā` → "ái": trong `thag` là **12/15**,
  nên "ái" chứ không phải "tham". `Saṅghe` → "Tăng đoàn" **158** (chuỗi `saṅgh` có 660 khoá).
  `attha` trong `sakaṁ atthaṁ` → "mục đích".

  NĂM PHÉP TỰ KIẾM, CÓ SỐ VÀ CÓ MẪU SỐ.
  (1) Tập khoá: Việt **53**, Pāli **53**, mẫu số **53**; trùng khớp hoàn toàn, không có
  khoá nào ngoài tập `keys`; thứ tự khoá Việt **khớp** thứ tự Pāli.
  (2) Nháy đơn và ngoặc kép khớp Pāli **từng khoá**: mẫu số **53** khoá, tổng cộng **1** dấu
  nháy (ngoặc kép mở ở `:1.1`, đóng ở `:10.4`), số khoá lệch **0**.
  (3) Pāli trùng nguyên văn trong chính bài: **1** nhóm gồm **8** khoá (`:2.4`–`:9.4`,
  `Etaṁ samaṇassa patirūpaṁ.`); trong đó bản Việt khác nhau **0/8** — tức phép này CÓ chạy
  và tìm được cặp để so, không phải phép rỗng.
  (4) Dấu lược: `…pe…` xuất hiện ở **0** khoá Pāli nên phép so `…pe…` **chạy rỗng**, bản Việt
  cũng không có `…pe…` ở đâu; dấu `…` trần xuất hiện ở **1** khoá (`:10.5`), Việt khớp đúng
  **2** dấu; `(…)` không có ở **0** khoá Pāli và cũng không có ở Việt. Pāli kết `….` ở
  **0** khoá nên quy tắc ` ….` không có mẫu số để áp ở bài này.
  (5) Số Pāli: xem mục trên; mẫu số là **1** cụm số cần phán (khối uddāna), và đã phán
  bằng đếm tệp đã ghim.
  Ngoài ra: mọi giá trị đều NFC, không khoá rỗng, không khoảng trắng thừa đầu/cuối/đôi,
  và không có dấu chỉ riêng của Pāli nào lọt vào chữ Việt ngoài các tên riêng được giữ nguyên
  theo quy ước (`Theragāthā`, `Gotama`, `Kāḷudāyī`, `Ekavihārī`, `Kappin`, `Cūḷapanthaka`,
  `Kappa`, `Upasena`).

