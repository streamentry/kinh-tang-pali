notes: |-
  `Sulasājātaka` (số 3) trong `Kaccānivagga`, `Aṭṭhakanipāta`. 41/41 khoá. Ba tầng tham khảo đều vắng (xem `blocking_errors`) ⇒ `draft`, `triangulation` 7.5.

  **Pāli trùng nguyên văn: 8/41 khoá.** `9.1`–`9.3` trùng byte-for-byte `ja342:4.1`–`4.3` (đúng là *Cùng bốn vế* ấy) → lấy y hệt, kể cả dấu câu. `6.1`–`6.3` trùng `5.1`–`5.3` **trong chính bài** ⇒ cũng dùng lại y hệt. `0.1` theo 384:16; `0.2`/`0.3` theo mẫu `ja418`/`ja424` như đã ghi ở `ja417`.

  **Một chỗ trùng Pāli mà cố ý dịch khác, và vì sao.** `6.1` `Na hi sabbesu ṭhānesu,` trùng `ja248:1.3`, bản dịch ở đó là *Vì không phải chỗ nào cũng vậy*. Ở bài này `6.1`–`6.3` nối liền `5.1`–`5.3` và nội dung là *không phải chỗ nào người nam cũng là bậc trí tuệ*, nên dịch đầy đủ chủ ngữ mới giữ được ý; dùng lại nguyên văn của `ja248` sẽ mất vế `puriso … paṇḍito`. Đây là cùng cách xử lý như tiền lệ đã ghi ở `ja376` (Pāli trùng, ngữ cảnh khác ⇒ dịch riêng, nêu lý do).

  **Ba chỗ khó, đã ghi thay vì khẳng định.** (1) `7.3` `Migaṁ puṇṇāyateneva` — `miga` ở tầng này luôn dịch *nai* (11 tiền lệ, kể cả `ja359:0.4` *Con Nai Vàng*), nhưng ở đây từ đứng trước `sattuka` là tên kẻ cướp, nên dịch *kẻ phi phẩm* cho đúng ngữ cảnh; **đây là cách hiểu, không phải nghĩa từ điển**, và nên được người biên tập kiểm lại khi tìm được chú giải. (2) `3.2` `yato pattāsmi viññutaṁ` — đã dịch *từ khi ta đã được xác nhận*; có thể là "từ khi ta đạt đến chỗ biết rõ", chưa phân xử được. (3) `4.1`–`4.2` `Ehi taṁ upagūhissaṁ, / karissañca padakkhiṇaṁ` — đã dịch *Hãy đến đây, ta sẽ tự mình / chọn lấy người ấy và kính lễ*; `upagūhissaṁ` là "tự mình nắm lấy/đem về", `karissañca` là tân ngữ, nên câu có thể mang nghĩa chọn người để cưới — ghi lại chứ không bịa thêm.

  **Lỗi bắt ở lượt review đối kháng, đã sửa:** `5.2` `puriso hoti paṇḍito` bản nháp dịch *học giả là bậc tinh tấn lắm vậy* — sai hoàn toàn, `purisa` là **người nam**, `paṇḍita` là **có trí tuệ**, `vicakkhaṇa` mới là tinh tấn; đã sửa cả `5.1`–`5.4` và `6.1`–`6.4`. `2.3`–`2.4` cũng đã sửa từ *không thèm biết* thành *không hề biết* cho khớp nghĩa `abhijānāmi` (biết chắc).

  **Dấu lược:** không segment nào có `…pe…`; cả hai phía 0.

  `npm run validate|test|check|build` không chạy (BRIEF cấm); `technical_integrity` = 9.6 vì các chốt tự động đã xanh và cổng `npm` chưa chạy.
