notes: |-
  Đợt 19, làn 72. Dịch từ Pāli root commit đã ghim, đủ 101/101 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem dưới).

    **Tiêu đề.** `0.2` “Bộ Tạp Tập” và `0.3` “Phẩm Ruộng Lúa” dùng lại đúng bản Việt của `ja486`, `ja487`, `ja490`, `ja492` (cùng Pāli, 4 bài anh em đã dịch, 0 lệch); tầng vẫn chưa có tiền lệ đã publish cho hai tên này, nên người điều phối nên quyết một lần cho cả phẩm. `0.4` “5. Kinh Củ Sen” theo khuôn “N. Kinh <tên>” của `ja474:0.4`, `ja486:0.4`; `bhisa` → “củ sen” theo `ja392:3.1` và `sn9.14:4.1` (“đào củ sen”), `sn20.9:3.3`. `25.1` “Kinh Củ Sen, thứ năm.” theo `ja474:14.1` (có dấu phẩy trước số thứ tự); số `5.` ở `0.4` khớp `pañcamaṁ` = 5 ⇒ “thứ năm”, và đứng sau `ja487` (4.) trước `ja490` (7.) trong cùng phẩm.

    **Tiền lệ dùng lại nguyên văn.** Dò toàn tầng (toàn bộ Pāli root `pli/ms` đã ghim) bằng so khớp Pāli sau khi bỏ dấu câu và hoa/thường: 5 khoá của bài này có Pāli trùng với khoá đã có bản Việt (`0.2`, `0.3`, `16.4`, `17.3`, `21.2`), 2 khoá giữ nguyên bản Việt (`0.2`, `0.3`) và 3 khoá lệch có chủ ý. `16.4` (= `mn82:42.38` “do si mê, người ta tạo các ác nghiệp.”): giữ cấu trúc, đổi “người ta” thành “họ” vì ở đây chủ ngữ đã nêu rõ ở `16.3` (`bhūtādhipatī pamattā`). `17.3` (= `mn82:42.49` “thấy nguy hại trong ngũ dục,”): dùng lại nguyên văn; `kāmaguṇa` trong tầng: 143 khoá “năm dục”, 33 “dục lạc”, 6 “ngũ dục” (64 khoá dịch cách khác), nên “ngũ dục” là cách thông dụng, dù Pāli ở đây không nêu `pañca`. `21.2` (= `ja391:5.2`): bản Việt của `ja391:5.2` đọc “theo đó tôi sẽ bảo chúng sanh biết Vāsava là bậc mang điện”; không khớp Pāli (`yaṁ vāsavaṁ bhūtapatiddasāma` = “vì chúng ta đã thấy Vāsava, chủ của muôn loài”: `addasāma`, ngôi thứ nhất số nhiều, không có động từ “bảo/biết”), nên không dùng lại. Đây là lỗi ngoài lát, báo chứ không sửa. Các khoá lặp công thức `Bhisāni te brāhmaṇa yo ahāsi` đều dùng một bản Việt duy nhất.

    **Trùng nguyên văn trong chính bài:** 2 nhóm Pāli trùng, 0 nhóm mà bản Việt khác nhau: nhóm 1 gồm 11 khoá `1.4`, `2.4`, `3.4`, `4.4`, `5.4`, `6.4`, `7.4`, `8.4`, `11.4`, `12.4`, `13.4` (`yo ahāsi`, riêng `1.4`, `2.4`, `13.4` thêm nháy đóng theo Pāli); nhóm 2 gồm `9.4` và `10.4` (`yā ahāsi`, giống cái, dịch “người nữ nào”, vì khổ 9–10 nói về một người nữ).

    **Số Pāli:** `satta bhātaro` (22.4) = 7; đếm đủ bảy tên trong `22.1`–`22.3`: `ahaṁ`, Sāriputta, Moggallāna, Kassapa, Anuruddha, Puṇṇa, Ānanda = 7 ⇒ “bảy anh em” khớp. `pañcamaṁ` (25.1) = 5 ⇒ “thứ năm”, khớp `5.` ở `0.4`. `sahassanetta` (19.3) = `sahassa` 1.000 + `netta` mắt ⇒ “Ngàn Mắt”, cùng cách với `sn11.9:2.3` “này Ngàn Mắt” và `ja340:2.1`. `itthīsahassāna` (9.2) = “ngàn phụ nữ” (`sahassa` = 1.000). `pāsasatehi chabbhi` (12.1) = “hàng trăm thòng lọng” (`sata` = 100) và “sáu” (`cha`), xem bất định 6. `catussada` (7.1): `catu` = 4 (xem bất định 5). `cāturanta` (4.3) → “bốn phương”, theo `dn14:1.31.8` (“làm chủ bốn phương”; 31 khoá chứa `cāturant…`).

    **Thuật ngữ và tiền lệ đã đo:**
    - `jātarūpa` + `rajata` (1.1) → “vàng”, “bạc”: `dn23:13.7` (“bạc và vàng”), `dn1:1.10.7` (“vàng và bạc”) (127 khoá chứa `jātarūp…`, 72 khoá chứa `rajata`); Pāli ở đây xếp `rajataṁ jātarūpaṁ` nên viết “bạc và vàng”.
    - `yakkha` → “dạ-xoa”: `dn21:1.13.2`, `dn32:8.3` (104 khoá chứa `yakkh…`).
    - `gahapati` → “gia chủ” (1.607 khoá); `bhaginī` → “chị em gái” (Pāli không nêu chị hay em); `dāsa`/`dāsī` → “nô lệ”/“nữ nô lệ”: `dn10:2.10.1`, `dn3:1.16.1` (38 khoá chứa `dāso`, 28 khoá chứa `dāsī`; `mn82:18.1` dịch “nữ tỳ”).
    - `ekāparādhaṁ khama` (20.3) → “xin tha một lỗi lầm”: `ja411:2.4` (3 khoá chứa `ekāparādh…`, trong đó 1 khoá đã dịch; `ja497:19.3` và `ja505:16.2` chưa dịch).
    - `avikampamānā` (10.2) → “không hề dao động”: `sn6.3:9.1` (3 khoá chứa `avikampamān…`, 1 khoá đã dịch).
    - `Gajaṅgalā` (11.2): `mn152:1.2` “Gajaṅgalā” (3 khoá chứa `gajaṅgal…`).
    - `bhūripañña` → “bậc trí tuệ rộng lớn”: `dn19:3.15` “bậc trí tuệ rộng lớn” (17 khoá chứa `bhūripañña`; `dn18:13.12` dịch “bậc Đại Tuệ”).
    - `ajjhāyaka` → “người tụng đọc”: `dn4:5.10` (69 khoá chứa `ajjhāyak…`); `tapassī` → “khổ hạnh”: `dn25:8.4` (104 khoá chứa `tapassī`).
    - `avītarāga` → “chưa lìa tham”: `mn35:30.6` “chưa lìa tham” (4 khoá chứa `avītarāg…`; `sn4.25:11.1` dịch “chưa lìa dục ái”).
    - `kāsikacandana` → “đàn hương Kāsi”: `mn87:28.4` (14 khoá chứa `kāsikacand…`).
    - `rājābhirājā` → “vua của các vua”: `mn92:16.23`, `snp3.7:18.3` (2 khoá).
    - `sahassanetta` → “Ngàn Mắt”: `sn11.9:2.3`, `ja340:2.1` (2 khoá).
    - `rājadhāni` → “kinh đô”: `dn14:2.16.1`, `dn14:3.8.5` (58 khoá chứa `rājadhāni…`).
    - `jīvaloka` → “cõi sống”: `sn1.33:13.2`, `ja424:5.2` (5 khoá chứa `jīvaloke`).
    - `ekarājā` (9.1) → “vị vua duy nhất”; tầng có `ja159:1.1` dịch “vị vua một mình”; 10 khoá chứa `ekarāj…`, phần lớn là tên Ekarāja.
    - `kodhabala` (20.4) → “lấy cơn giận làm sức mạnh”: tầng chỉ có 1 khoá khác chứa `kodhabal…` (`an8.27:1.3`, “sức mạnh nổi giận”, nghĩa danh từ).
    - `khattiya` giữ nguyên Pāli “khattiya”: `ja472:2.1`, `ja483:12.2`, `ja420:7.1` (3 khoá `ja` giữ nguyên; `ja432:5.2` dịch “Sát-đế-lợi”).
    - `brāhmaṇa` → “bà-la-môn” viết thường, như các bài `ja` khác; `kāma` → “dục”; `iṭṭha`/`kanta`/`piya`/`manuñña` → “đáng mong”/“đáng ưa”/“đáng yêu”/“vừa ý”.
    - Tên riêng: `alakka` giữ nguyên Pāli (tầng chỉ có 2 khoá chứa `alakk…`, đều là từ khác `calakka`); `Gajaṅgalā` giữ nguyên Pāli (0 tiền lệ).

    **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá, lệch 0/101 khoá. Pāli có 11 nháy mở (`1.1`, `2.1`, `3.1`, `14.1`, `15.1`, `16.1`, `18.1`, `19.1`, `20.1`, `21.1`, `22.1`) và 11 nháy đóng (`1.4`, `2.4`, `13.4`, `14.4`, `15.4`, `17.4`, `18.4`, `19.4`, `20.4`, `21.4`, `24.4`). Ba lời nói trải qua nhiều khổ: khổ `3`–`13` (mở ở `3.1`, đóng ở `13.4`, không có nháy ở `4.1`–`12.4`), khổ `16`–`17` (mở ở `16.1`, đóng ở `17.4`) và khổ `22`–`24` (mở ở `22.1`, đóng ở `24.4`). Bản Việt đúng theo từng khoá như vậy. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (không có `(…)` trần trong bài này).

    **Coverage English (mục 7):** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng là 36 ký tự (< 40) nên 0/101 khoá có nội dung; các khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja488` (tra `source/upstream-manifest.json`: chỉ có `kn/ja/ja488_root-pli-ms.json`, tầng Pāli; không suy từ tên thư mục); `english-project`: 0 (`content/translation/en/project/sutta/kn/` không có tệp nào cho uid này); `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker `noEnglishEditionUpstream`. Không đụng `content/meta/reference-gaps.yaml`.

    **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
    1. Cấu trúc kệ: bản root chỉ có các kệ, không có văn xuôi nêu ai nói. Đọc từ ngữ cảnh: `1`–`13` là các lời thề nguyền (mỗi khổ kết bằng `Bhisāni te brāhmaṇa yo/yā ahāsi`, “kẻ/người nữ nào đã lấy những củ sen của ông”) mà người nói chúc cho kẻ lấy củ sen được những thứ thế gian ưa thích, nghĩa là lời nguyền ở dạng đảo; `14` là một lời thề khác; `15` là câu hỏi, `16`–`17` là câu đáp; `18` là lời của người nói rằng chính mình đã lấy các củ sen để thử; `19`–`21` là các lời đối đáp tiếp, trong đó `19.4` gọi người ấy là `devarāja` và `21.2` nhắc `vāsava`; `22`–`24` là lời nêu các nhân vật ứng với bài. Đây chỉ là suy luận từ nội dung kệ, không được ghi vào thân kinh; người nói không được xác định trong tầng Pāli đã ghim.
    2. `Vayaṁ apassaṁ gharamāvasātu` (3.3): đọc `vayaṁ` = “tuổi tác, sự suy tàn của tuổi” (75 khoá chứa `vayaṁ`, nghĩa không đồng nhất) và `apassaṁ` = “không thấy” (40 khoá chứa `apassaṁ`, ví dụ `mn30:11.19` `ajānaṁ … apassaṁ` cùng dạng phủ định). Nghĩa của `vayaṁ` ở đây chưa được xác lập chắc; cách đọc khác là “sức sống, sinh lực”.
    3. `kasimā` (3.1): đọc `kasi` (cày cấy) + `-mant`, “có ruộng cày”; trong tầng, `kasimā` ở `mn25:4.7` là từ khác (“gầy mòn”). 0 chứng cứ độc lập cho nghĩa dùng ở đây.
    4. `Tapassīnaṁ maññatu sabbaloko` (6.2): `tapassīnaṁ` là sở hữu cách số nhiều; dịch “xem kẻ ấy là bậc khổ hạnh”. Cách đọc khác là “xem (kẻ ấy) thuộc hàng các bậc khổ hạnh”, cùng nghĩa. 3 khoá khác chứa `maññatu` (`sn11.5:8.1`, `sn11.4:7.1`, `ne37:412.1`) đều là `kāmaṁ maññatu vā mā vā` (“nghĩ sao thì nghĩ”), cấu trúc khác.
    5. `catussadaṁ gāmavaraṁ` (7.1): `catussada` = “dồi dào bốn thứ”; Pāli không nêu bốn thứ là gì. Tầng chỉ có `sattussada` (13 khoá, `dn4:1.4` “đông dân, dồi dào cỏ, củi, nước và lúa gạo”) với tên bảy thứ nêu rõ; bài này không nêu, nên không thêm vào thân kinh.
    6. `pāsasatehi chabbhi` (12.1): dịch “hàng trăm thòng lọng, bằng sáu sợi”; `chabbhi` đọc là sáu, nhưng chưa xác định được “sáu” chỉ loại dây nào hay là số lượng thêm. 0 khoá khác chứa `chabbhi`.
    7. `So rājato byasana mālattha kiñci` (8.3): đọc `mālattha` = `mā` + `alattha`, “không gặp bất kỳ tai ương nào từ nhà vua”; `mā` + `alattha` là lối cấm đi với thì quá khứ (aorist). 0 khoá khác chứa `mālattha`.
    8. `Isīnañhi sā sabbasamāgatānaṁ` (10.1): đọc sở hữu cách tuyệt đối “trong lúc tất cả các ẩn sĩ đang tề tựu”; có thể đọc “giữa các ẩn sĩ”. `sāduṁ` (10.2) dịch “món ngon”, Pāli không nêu rõ món gì. `avikampamānā` xem mục thuật ngữ.
    9. `ālokasandhiṁ divasaṁ karotu` (11.3): `ālokasandhi` = “ô cửa sổ lấy sáng”; `divasaṁ karotu` đọc “suốt ngày làm”; cấu trúc `divasaṁ` + `karoti` (“kéo ngày dài”, “qua ngày”) cũng có thể. 0 khoá khác chứa `ālokasandhi`.
    10. `tipukaṇṇaviddho` (13.1): “tai bị xỏ thiếc”; có thể là “tai xỏ khuyên thiếc”. `Sakacchabandho` (13.3): “thắt gọn khố”; `sappamukhaṁ` (13.2): “miệng rắn”. 0 khoá khác chứa `tipukaṇṇa…` và `sakaccha…`; `sappamukha…` có đúng 1 khoá khác (`mil6.3.6:9.1`, chưa dịch).
    11. `Yo ve anaṭṭhaṁva naṭṭhanti cāha` (14.1): đọc “kẻ nào quả thật nói rằng cái chưa mất là đã mất”; không có nháy trong Pāli nên không thêm nháy vào bản Việt. `Kāmeva` (14.2) đọc `kāme` + `eva`, “các dục”; cũng có thể là `kāmaṁ eva` (“tùy ý”). `saṅkati` (14.4) “nghi ngờ”. 0 khoá khác chứa `anaṭṭhaṁva`.
    12. `bhūtādhipatī` (16.3): dịch “những bậc chủ tể muôn loài”; có thể chỉ các vua chúa hoặc người nắm quyền. `pamattā` “buông lung”. `pasavetva` (17.1) “sau khi tạo ra”. `pāpadhammā` “kẻ có pháp ác”.
    13. `Kismiṁ vupatthambha` (19.3): `vupatthambha` đọc “nương vào, dựa vào”; một cách đọc khác là “cậy vào, ỷ vào”. 0 khoá khác chứa `vupatthambha`. `kīḷaneyyā` (19.1): “thứ để đùa vui”; 0 khoá khác.
    14. `brahme` (20.2): dịch “hỡi bà-la-môn”; một cách đọc khác là hô cách của `brahmā` (“hỡi Phạm thiên”). `esā patiṭṭhā khalitassa` (20.2) “đây là chỗ nương tựa của kẻ vấp lỗi”; `ācariyo mesi pitā ca mayhaṁ` (20.1) đọc `me` + `asi`, “ông là thầy, là cha của tôi”. `Ekāparādhaṁ` (20.3) “một lỗi”. Cùng Pāli với `ja497:19.3`–`19.4` (chưa dịch trong tầng).
