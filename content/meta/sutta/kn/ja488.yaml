    **Bất định mới ghi nhận ở lượt này, không thêm vào thân kinh:**
    17. `isino` (18.1): xem trên. Cách đọc khác là số nhiều (“của các ẩn sĩ”); hình thái thường gặp của số nhiều là `isayo`/`isinaṁ`, nên số ít được ưu tiên, nhưng người nói và người sở hữu củ sen không được nêu trong tầng Pāli ghim.
    18. `mahimāvasātu` (4.3) và `gharamāvasātu` (3.3) cùng động từ `āvasati` (“cư ngụ”, và với vua “cai quản”): bản dịch hiện giữ “sống trong nhà” (3.3) và “ngự trị đại địa” (4.3) theo ngữ cảnh từng khoá; khoá `4.3` có thể đọc sát hơn là “cư ngụ trên đại địa bốn phương”. Không đổi vì cách đọc “cai quản” có tiền lệ trực tiếp cùng cụm `mahimāvasanto` (`mn82:42.8` “trị vì”, `thag16.4:9.2` “ngự trị trên cõi đất”; 4 khoá chứa `mahimāvas…`, kể cả khoá này) và ở công thức chuyển luân vương (`dn14:1.31.8`; 41 khoá chứa `cāturant…`); nhưng tầng Pāli ghim không cho phép phân xử giữa “cư ngụ” và “cai quản”.
    19. `chabbhi` (12.1): bản dịch “bằng sáu sợi” vẫn thêm lượng từ “sợi” mà Pāli không nêu; chưa có căn cứ để thay bằng từ khác, nên giữ nguyên và nêu rõ ở đây. Đọc đối kháng không tìm được tiền lệ nào khác cho `chabbhi` toàn tầng (0 khoá).
    20. `tutta` và `pācana` (12.3): bản dịch “gậy nhọn” và “roi thúc”. Tiền lệ: `dn21:1.5.18` dịch `tutta` là “gậy thúc”, `sn7.11:2.8` và `snp1.4:3.2` dịch `pācana` là “gậy thúc”/“cây gậy thúc”, nên hai chữ ở khoá này có thể đều là “gậy thúc” (hai thứ gậy khác nhau, hoặc một hình thức nhấn). Không đổi vì không phân xử được hai từ trong cùng một cụm; ghi lại.
