notes: |-
  Bản dịch chỉ từ Pāli root, 88/88 khoá, đúng thứ tự Pāli, đối chiếu tiền lệ tầng Việt của chính dự án (tha-ap), vì commit đã ghim không có bản Anh upstream (giới hạn upstream, không phải lỗi người dịch). Bài kể vị Bà-la-môn ở Haṁsavatī, trên đường đi tắm gội, thấy Đức Phật Padumuttara cùng chư A-la-hán vào thành, tung chiếc áo choàng ngoài lên che cả hội chúng, được Đức Phật thọ ký, về sau xuất gia dưới Đức Phật Gotama và đạt A-la-hán.
    Số Pāli, phép tính: Tiṁsakappasahassāni = tiṁsa 30 + kappa-sahassa (nghìn kiếp) = ba mươi ngàn kiếp; Paññāsakkhattuṁ = 50 lần; Chattiṁsakkhattuṁ = cha 6 + tiṁsa 30 = ba mươi sáu lần; yojanasataṁ = một trăm do-tuần; Satasahassito kappe = một trăm ngàn kiếp trước (sata 100 × sahassa 1.000 = 100.000); catasso = bốn; byāmato = một sải tay; Ekāhaṁ = một ngày. Giá trị tiṁsa = 30 xác lập từ chính tầng: Chattiṁsa-khattuṁ ở tha-ap421 dịch ba mươi sáu lần, Tiṁsatikkhattuṁ dịch ba mươi lần, Tiṁsa kappāni dịch ba mươi kiếp, Satañca aṭṭhatiṁsa ca là một trăm ba mươi tám.
    BẤT ĐỊNH VỀ SỐ: cụm Tiṁsakappasahassāni ở 10.1 dịch ba mươi ngàn kiếp theo giá trị tiṁsa = 30, nhưng cách đọc tiṁsa-kappa-sahassa là 3 (một số brief nội bộ) hay 30 chưa phân xử được bằng chứng cứ độc lập vì tầng Anh đã ghim không có bản nào cho dạng này; tầng hiện có dạng Tiṁsakappasahassamhi dịch ba mươi ngàn kiếp trước đây (4 khoá) so với một khoá dịch ba trăm nghìn. Người biên tập cần phán một lượt cho cả phẩm; không đoán ở đây.
    Bất định đã nêu, không bịa: (1) 1.3 Ajjhāyako mantadharo dịch người tụng đọc, người thuộc lòng những bài tụng theo hai tiền lệ cùng Pāli (2 khoá). (2) 2.2 jātimā ca susikkhito dịch xuất thân cao quý, lại được đào tạo chu đáo; jātimā có thể nghĩa là có dòng dõi tốt hoặc có tư cách bậc sinh; tiền lệ đúng Pāli là 0. (3) 2.3 Toyābhisecanatthāya dịch vì mục đích tắm gội bằng nước; tiền lệ là 0. (4) 4.1-4.2 Sucārurūpaṁ disvāna, āneñjakāritaṁ viya dịch thấy tướng mạo vô cùng xinh đẹp của Ngài, như thể đã được làm cho bất động; chủ ngữ của āneñjakārita và nghĩa chính xác (như được tạc nên bất động, hay bất động như một pho tượng) chưa chốt được; tiền lệ trong tầng là 0. (5) 6.2 ukkhipiṁ dịch tung lên theo tha-ap Ākāsukkhipiya (ākāse ukkhipiṁ ahaṁ là tôi đã tung lên tận hư không); cũng có thể là giơ lên. 6.3-6.4 yāvatā … tāva dịch rộng đến đâu … đến đó. (6) 7.1-7.4 chủ ngữ của aṭṭhāsi ở 7.3 hiểu là tấm vải (sāṭako, danh cách ở 6.4), còn hāsayanto mamaṁ là tấm vải khiến tôi hoan hỷ; chủ ngữ này được bổ sung từ 6.4 chứ không nằm ngay trong khoá. mahābhikkhugaṇādino (7.2) dịch bậc có đại chúng tỳ-kheo đi cùng, đây là sở hữu cách đồng chủ ngữ với 7.1; ādi (vân vân) không được dịch riêng. (7) 8.1 Gharato nikkhamantassa là sở hữu cách tuyệt đối, hiểu là Đức Phật rời khỏi nhà (đồng chủ ngữ với 8.2 sayambhū aggapuggalo); không xác định được là nhà của ai nên không thêm. 8.3 Vīthiyaṁva dịch đứng ngay trên đường (va là eva hoặc iva). (8) 9.1-9.4 người nói là Đức Phật: Pasannacitto sumano mô tả người dâng, yo me adāsi là người đã dâng cho ta; nháy đơn mở ở 10.1 là lời thọ ký. (9) 11.4 dussacchannaṁ dịch sẽ được che phủ bằng vải. (10) 12.3 Padesarajjaṁ vipulaṁ dịch Vương quốc rộng lớn ấy theo công thức của tầng (13 khoá), so với Vương quyền cai quản các vùng đất rộng lớn (2 khoá); chữ ấy không có trong Pāli nhưng giữ để nhất quán với tha-ap341. (11) 14.4 và 15.2 paṭilacchatiyaṁ naro hiểu là paṭilacchati + ayaṁ naro (người này sẽ nhận được); koseyya dịch vải lụa tơ tằm, kambaliya dịch vải len, khoma dịch vải lanh (tiền lệ trong tầng cho khoma là vải lanh và bột thọ lẫn lộn), kappāsika dịch vải bông. (12) 15.3 Ekadussassa dịch một tấm vải. (13) 17.3 Ekāhaṁ dịch trong một ngày (cũng có thể là suốt một ngày hoặc một ngày một lần). (14) 18.3 Dhāreti dussachadanaṁ có chủ ngữ không nêu; dịch thụ động mái che bằng vải được giữ lại. (15) 19.1-19.2 Aviññattaṁ nivāsemi, cīvaraṁ paccayañcahaṁ: tôi dịch nivāsemi là mặc, aviññattaṁ là không phải ngỏ lời xin, và paccayañcahaṁ là các vật dụng cần thiết; ahaṁ ở cuối 19.2 không có động từ nên không dịch riêng; tiền lệ trong tầng là 0. (16) 5.4 uttarīya và 19.4 uttareyya cùng nghĩa áo choàng ngoài; tên bài là Uttareyyadāyaka giữ nguyên Pāli, không dịch nghĩa. (17) 20.1 Satasahassito kappe dịch Vào một trăm ngàn đại kiếp trước theo công thức của tầng (22 khoá), so với Vào một trăm ngàn kiếp trước đây (6 khoá); đại là chữ thêm theo quy ước. (18) 16.2 sukkamūlena dịch cội nguồn thiện căn (20 khoá) so với cội rễ trắng (3 khoá).
    Tiền lệ đã đo trong tầng tha-ap (481 tệp trong cây làm việc, trừ bài này): Pāli trùng nguyên văn với 39 khoá của bài, dùng lại nguyên văn cho 30 khoá, 9 khoá khác bản đã có (1.2, 2.1, 6.1, 7.1, 8.2, 8.4, 11.2, 13.2, 13.4) vì khác ngôi (ta thành tôi), bản đã có thêm chữ không có trong Pāli (7.1 cất bước du hành, 8.2 loài hai chân), hoặc khác ngữ cảnh (13.4 ngay lúc ấy sẽ tái sinh là dùng cho chúng sinh tái sinh, ở đây chủ ngữ là điều mong cầu nên dịch hiện ra). Trong chính bài có 3 cặp Pāli trùng nguyên văn (5.3 và 9.1: Pasannacitto sumano; 11.2 và 13.2: puññakammasamaṅgino; 13.3 và 15.1: Manasā patthitaṁ sabbaṁ), cả ba dịch giống hệt nhau; không có cặp trùng nào mà Việt khác. Chattiṁsakkhattuṁ devindo có ba tiền lệ ngoài bài (tha-ap19:5.3 và tha-ap518:4.1 dịch Ba mươi lần, tha-ap421:6.1 dịch Ba mươi sáu lần); bài này theo ba mươi sáu vì chattiṁsa = 36, hai khoá kia nằm ngoài lát và cần xem lại. Dấu lược: 21.2 Pāli …pe… giữ một dấu …; không có (…) trần. Nháy kép khớp Pāli từng khoá (mở ở 1.1, đóng ở 21.3) và nháy đơn khớp (mở ở 10.1, đóng ở 16.4); các khoá khác không có nháy. Công thức kết Itthaṁ sudaṁ dùng nhóm số nhiều những bài kệ này (407 khoá) chứ không dùng nhóm số ít (21 khoá). Hạnh lành cho subbataṁ (5.2) theo hai tiền lệ cùng gốc. Bốn vô ngại giải (467 khoá), …pe… giữ một dấu … (643), đã làm tròn lời dạy của Đức Phật (437), tôi không còn biết đến đọa xứ nào (87) so với ta không còn biết đến đọa xứ (54) — giữ ngôi tôi theo cả bài.
    Tên phiên: `:0.3` Pāli (Uttareyyadāyakattheraapadāna) không bắt đầu bằng số nên không có số thứ tự, translationTitle bằng đúng giá trị `:0.3`. Cách viết Tuyên Ngôn chọn theo ba tệp liền kề tha-ap339, tha-ap341, tha-ap342 cùng phẩm Gandhodaka, không dùng Tuyên Ngợ: đo trong phạm vi tha-ap300 đến tha-ap380 thì Tuyên Ngợ 54, Tuyên Ngôn 11, Ký Sự 9, Tuyên Ngợi 2; toàn tầng Tuyên Ngợ 240, Tuyên Ngôn 120, Ký Sự 103, Tuyên Ngợi 10; trong phẩm Gandhodaka (tha-ap333 đến tha-ap342) Tuyên Ngôn 5, Tuyên Ngợ 1, Tuyên Ngợi 1 — các phạm vi phân kỳ về cách viết, người biên tập cần phán một lượt cho cả cuốn. Tên phẩm Gandhodakavagga dịch Phẩm Gandhodaka (7 khoá trong cùng phẩm); 23.1 là :0.3 bỏ tên Pāli đuôi dài và thêm thứ tám (aṭṭhamaṁ).
    Chưa chạy được các cổng của kho trong lượt này: npm run validate, npm test, npm run check, npm run build; technical_integrity 9.6. Status bắt buộc draft do blocker tầng tham khảo Anh.
