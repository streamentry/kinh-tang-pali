notes: |-
  Dịch trọn 174 khoá trực tiếp từ Pāli root; không có bản Anh của Sujato, không có lớp english-project và không có bản Việt hiện hành phân đoạn cho tha-ap538 tại commit đã ghim. Bản Việt không phân đoạn của Bhikkhu Indacanda (mục Tra cứu toàn văn của trang bài, dựa trên bản Buddha Jayanti) chỉ được đọc để đối chiếu nghĩa ở những dòng khó, không có căn lề theo segment và không được chép; ở nhiều chỗ bản ấy theo một cách đọc Pāli khác bản Mahāsaṅgīti đã ghim (xem các mục bất định), nên không tính là một tầng tham khảo độc lập. Đối chiếu thuật ngữ và công thức với các Ký Sự cùng phẩm và các bài liền kề (tha-ap530, tha-ap531, tha-ap533, tha-ap534, tha-ap537, tha-ap539, tha-ap541, tha-ap543, tha-ap544), cùng ud1.10 (đoạn kệ cảm hứng và thiên nhân thúc giục Bāhiya), snp5.1:21 (kệ Sāvatthī) và dhp101 (kệ Sahassamapi).
  Tiền lệ đã đo: 49 khoá mà Pāli (bỏ dấu câu và nháy) trùng nguyên văn với khoá đã dịch ở nơi khác (6.544 cặp đã dò, gồm Therāpadāna 542 cặp và …pe… 1.008 cặp), trong đó 44 khoá dùng lại nguyên văn bản đã có, 5 khoá khác tiền lệ có lý do: 4.3 (đã phủ phục dưới chân Ta, bỏ chữ Ông vì ở đây là vế phụ của vị Bà-la-môn ở 4.2), 9.2 (đối với bậc Đại Mâu-ni, không dùng bạch vì mahāmune ở đây không phải hô cách như thi-ap35:15.4), 16.2 (ta thay cho tôi), 29.3 (vị đã thuyết pháp cho ta, vì ở đây là mệnh đề quan hệ chứ không phải lời xưng hô với Đức Phật như cnd4) và 42.2 (nơi ấy không có tối tăm, bỏ chữ nhưng của ud1.10:14.6 vì Pāli không có từ đối lập). Dùng lại nguyên văn gồm Therāpadāna (531 so với 11 dạng Trưởng Lão Ký Sự), Cách đây một trăm ngàn kiếp (16 khoá, không có dạng khác), bậc Dẫn Đạo đã xuất hiện và tên là Padumuttara (534), Thân được điểm tô bằng dây tế lễ bằng vàng (534:13.3), lông trên thân dựng lên (537:8.2), Người kế thừa giáo pháp của Ngài (22 khoá, không có dạng khác), là con ruột, do giáo pháp tạo nên (20 so với 3), Dù sinh làm chư thiên hay làm người (5 so với 2 dạng bỏ chữ sinh và 4 dạng khác), như đi về nơi ở của chính mình (thi-ap35:10.4), Lại nữa, khi giáo pháp của bậc Anh Hùng Kassapa đang tàn lụi, sau khi leo lên đỉnh núi đá, chuyên tâm vào giáo pháp của bậc Chiến Thắng (537:19), là người làm theo giáo pháp của bậc Chiến Thắng (491:10.4), kinh thành tối thượng (thi-ap38:5.2), Tại Sāvatthī, kinh thành của xứ Kosala, đầy đủ trí tuệ, với tuệ rộng lớn (snp5.1:21.1 và 21.2), Nghe pháp của Ngài (3 so với 2 dạng có chữ sau khi), ta đã đạt được sự đoạn tận các lậu hoặc (541:27.4), Các phiền não của ta đã được thiêu rụi (135 so với 34 và 27 dạng tôi), ta sống không còn lậu hoặc (135 so với 37 dạng tôi), Thật lành thay sự đến của ta (135 so với 24 và 14), đã làm tròn lời dạy của Đức Phật (723 so với 56 dạng tôi và 16 dạng con, ở khoá không có nháy đóng), Bốn vô ngại giải (567 so với 3), Rồi bậc Đạo Sư gọi (3), y phục và chỗ nằm (2 so với 1 giường chiếu và 1 giường nằm), cùng cách dịch indaketu là ngọn cờ của Inda (bv7:24.4, ở đó là được dựng lên còn ở đây là bị đổ xuống), và bốn dòng kệ Dù nói ngàn bài kệ (dhp101:1 đến 4, Pāli trùng khít; các chữ nói và có ý nghĩa là lựa chọn đã có ở dhp101, giữ để thống nhất). Các dòng 41.1 đến 43.2 theo ud1.10:14 và 15 (Pāli gần trùng); không lặp cách ud1.10 gán bằng trí tuệ của mình cho dòng 15.2 mà dịch sát từng dòng của tha-ap538, trong đó munimonena dịch theo mona là trí tuệ như ud1.10:15.2 và thag2.24:2.3 (2 tiền lệ).
  Thuật ngữ và số đếm: khippābhiñña dịch thắng trí nhanh chóng (1 tiền lệ duy nhất, an1.216:1.1, cùng cách dịch); dārucīra dịch y vỏ cây (15 so với 1 áo vỏ cây); byākari ở 4.1 dịch thọ ký (trong các khoá byākari và viyākāsi của tha-ap và thi-ap: giảng giải 12, tuyên bố 5, thọ ký 3; chọn thọ ký vì đây là lời thọ ký tương lai như tha-ap533:11.4 cùng phẩm), còn viyākāsi ở 34.1 dịch đã tuyên bố như tha-ap544:7.1; sāvaka ở 8.4 dịch đệ tử (tầng 8 khoá đệ tử so với 12 khoá môn đồ ở cùng câu, phạm vi tha-ap500 đến tha-ap559 là 4 so với 6; chọn đệ tử theo hai khoá liền kề tha-ap537 và tha-ap539 và theo sāvake ở 38.2, sasissa ở 3.2); tilokagga dịch tối thượng trong ba cõi (tha-ap549:12.3); sirī dịch vinh quang (sn1.79:2.2, tiền lệ duy nhất); suññata ở 29.4 dịch tánh không (toàn tầng 7 khoá tánh không so với 9 khoá tính không; ở các câu kinh sâu xa liên quan đến suññatā là sn55.53 và an2.47 cùng dạng tánh không); cuta dịch mệnh chung (thi-ap35:10.3); parinibbāyi dịch nhập Niết-bàn (dn17); jhāpetha dịch hỏa táng (ud1.10:11.3 và an5.50:19.2). Ngôi kể dùng ta theo đa số gần: tầng 247 tệp ta so với 273 tệp tôi, phạm vi tha-ap500 đến tha-ap559 là 30 so với 23, và các khoá liền kề tha-ap530, tha-ap531, tha-ap533, tha-ap537 đều dùng ta; 12.4 agamhase là ngôi thứ nhất số nhiều đi với pañca janā nên dịch chúng ta. Vị thiên nhân (19.3 và 19.4) và Đức Phật (28.3) nói với Bāhiya dùng ông, theo ud1.10:2.2 và ud1.10:8.1.
  Tên phẩm Kaccāyanavagga dịch Phẩm Kaccāyana (6 so với 0 dạng khác, cùng tên riêng giữ dạng Pāli). :0.3 trong Pāli không có số thứ tự đầu tên nên bản Việt không thêm số; translationTitle bằng đúng giá trị :0.3. Dạng tên bài Ký Sự Về Trưởng Lão X theo đa số gần nhất: tha-ap500 đến tha-ap559 là 39 so với 15 dạng Bài Kệ Tuyên Ngợ; tha-ap525 đến tha-ap555 là 23 so với 2; toàn tầng 141 dạng Ký Sự Về Trưởng Lão so với 255 dạng Bài Kệ Tuyên Ngợ và 138 dạng Bài Kệ Tuyên Ngôn (hai phạm vi cho hai đa số khác nhau, tên bài theo phạm vi gần nhất đã đo như các khoá liền kề tha-ap537 và tha-ap544). Lời kết 44.1 dùng nhóm nói những bài kệ này (số nhiều, theo imā gāthāyo). Khoá 45.1 theo dạng Ký Sự Về Trưởng Lão X, thứ sáu (chaṭṭhaṁ; như tha-ap537:30.1 thứ năm và tha-ap539:32.1 thứ bảy).
  Lời thọ ký tương lai (4.2 đến 8.4): hessati dịch sẽ có (7.4) và sẽ làm (8.4); Pāli ở lời thọ ký này không có số kiếp nên không có dạng sau … kiếp nữa; 1.1 là câu kể quá khứ (Ito satasahassamhi kappe) nên dịch Cách đây một trăm ngàn kiếp như 13 khoá cùng Pāli.
  Dấu lược: ba khoá …pe… (31.2, 32.2, 33.2) giữ đúng một …; không có (…) trần trong Pāli của bài này. Nháy: kép mở ở 1.1 và đóng ở 43.4; nháy đơn mở ở 4.2 và đóng ở 8.4, mở ở 16.4 và đóng ở 17.4, mở và đóng ở 19.3 và 19.4, 20.3 và 20.4, 21.1 và 21.4, 23.1 và 23.2, mở và đóng trong cùng khoá 23.4, mở ở 24.1 và đóng ở 24.4, mở ở 27.3 và đóng ở 27.4, mở ở 28.1 và đóng ở 28.3, mở ở 38.3 và đóng ở 43.2; 23 khoá Pāli có nháy, 0 khoá lệch nháy so với Pāli từng khoá. Đối chiếu 174 khoá với Pāli: đủ khoá, đúng thứ tự, 0 lệch dấu lược, NFC sạch, không khoá rỗng, không chữ số lọt vào thân bài. Có 2 nhóm Pāli trùng nguyên văn trong chính bài (nhóm …pe… 31.2, 32.2, 33.2 và nhóm 32.3, 33.3; tổng 4 cặp), cả hai nhóm đều có bản Việt giống hệt nhau, 0 cặp lệch. Đã đọc cặp Pāli với Việt của cả 174 khoá.
  Số Pāli: satasahassa là sata 100 và sahassa 1.000 nên 100.000, dịch một trăm ngàn kiếp ở 1.1; sattāhikaṁ dānaṁ là vật thí bảy ngày; sahassamapi gāthā là ngàn bài kệ; pañca janā là năm người; katipāhakaṁ là vài ngày; catasso paṭisambhidā là bốn vô ngại giải; chaṭṭhaṁ là thứ sáu; tāvatiṁsa không có trong bài này. Không có cụm tiṁsakappasahassa hay số lớn nào cần phân xử.
  Bất định và lựa chọn cần người biên tập lưu ý: (1) 4.4 cariyaṁ paccavekkhaṇaṁ dịch đang quán xét hạnh của mình; bản Indacanda (theo bản Buddha Jayanti) có một dòng khác hẳn (ánh mắt và khuôn mặt được tịnh tín), tức là có dị bản đọc, ở đây giữ chữ của bản Mahāsaṅgīti. (2) 5.4 dijaṁ hiểu là răng (cả khổ kệ mô tả thân, da, môi, răng); nếu hiểu dija là Bà-la-môn thì cần sửa. 5.2 avadātatanuttacaṁ dịch da mỏng, trắng sáng; 6.1 guṇathāmabahutaraṁ dịch sức mạnh đức hạnh rất dồi dào và 6.3 guṇoghāyatanībhūtaṁ dịch chỗ chứa dòng lũ đức hạnh đều là cách hiểu hợp chữ nhưng không có tiền lệ. 6.2 samuggatatanūruhaṁ dùng lại lông trên thân dựng lên của 537:8.2; bản Indacanda dịch thân hình vươn cao. (3) 9.2 mahāmune hiểu là dạng với nghĩa đối với bậc Đại Mâu-ni (không phải hô cách như thi-ap35:15.4). (4) 13.4 appasiddhiyaṁ dịch nơi ít khi thành công; ja439:4.2 appasiddhikaṁ dịch biển cả không lối qua (1 tiền lệ), bản Indacanda dịch ít có sự an toàn. (5) 14.4 makarākare dịch chỗ đầy thủy quái makara, giữ makara dạng Pāli như ja296:1.3. 15.4 mandavedhito dịch yếu ớt, run rẩy (hiểu manda là yếu và vedhita là run). (6) 18.3 saṅkappaṁ dịch ý nghĩ; 19.2 pubbadevatā dịch vị thiên nhân thuở trước (ud1.10:2.1 gọi là thiên nhân vốn là thân quyến kiếp trước); 20.1 saṁviggo dịch động tâm. (7) 22.3 arahattamuttamaṁ hiểu là bậc A-la-hán tối thượng theo cách bản Indacanda dịch; nếu giữ nghĩa trừu tượng thì phải là quả vị A-la-hán tối thượng. (8) 23.1 đến 23.2: Pāli ghi satthuno … sadā jinaṁ passāmi (sadā là luôn luôn); bản Indacanda dịch Khi nào tôi sẽ nhìn thấy đấng Chiến Thắng, tức một cách đọc kadā; ở đây giữ chữ của Mahāsaṅgīti và để Bậc Đạo Sư đứng riêng; đây là chỗ khó nhất của bài, chưa phân xử được. (9) 24.1 nháy mở trước cả Tato avocuṁ nên lời tường thuật họ nói nằm trong nháy, giữ khớp Pāli. 24.3 sasova hiểu là sasa iva (như thỏ), căn cứ sasova bandhito ở dhp342:2; bản Indacanda dịch nếu mong mỏi diện kiến (tức Sace), một cách đọc khác. (10) 26.2 pācayantaṁ pītākaraṁ là chỗ không chắc (pācayati là làm cho chín, pītākara là nguồn hỷ lạc); bản Indacanda dịch như đang phân phát sự Bất Tử. 26.4 ravidittiharānanaṁ dịch gương mặt mang ánh rực rỡ của mặt trời (hara là mang); nếu hara là đoạt mất thì nghĩa là gương mặt át cả ánh mặt trời. (11) 28.1 pāṇasantāraṇatthāya dịch để cứu độ sinh mạng, mở cho hai cách hiểu (nuôi sống, hoặc độ chúng sinh). (12) 30.3 santo hiểu là đang là (người) nên dịch ta là người đã hết tuổi thọ, không phải an tịnh. (13) 36.4 bāhitāgamaṁ dịch đã dứt bỏ sự tái sinh theo cách bản Indacanda hiểu āgama là sự đến; nếu āgama là giáo thuyết thì nghĩa là đã gạt bỏ các giáo thuyết sai, cần người biên tập phán. (14) 25.4 apihāgidhaṁ dịch không mong cầu, không tham đắm (a cộng pihā cộng gidha). (15) 38.4 tanuṁ sabrahmacārino dịch thân của vị đồng phạm hạnh. (16) 12.3 và 12.4 pañca janā agamhase: số năm theo Pāli (bản Indacanda thêm chú bảy vị ở dòng trước, Pāli của bài này không có).
  Kiểm kỹ thuật chưa chạy trong lượt này: npm run validate, npm test, npm run check và npm run build; vì vậy technical_integrity đặt 9.6 và không tuyên bố technical gate đã pass.
