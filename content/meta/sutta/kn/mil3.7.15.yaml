notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Milindapañha. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ dùng lại: Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc · Rājā āha— → Vua nói: ·
  Thero āha— → Trưởng lão nói: · Na hi, bhante → Không phải, bạch tôn giả · Kallosi → Khéo lắm ·
  phoṭṭhabba → điều sờ được (an10.20) · vijānāti → biết rõ.
  Bất định đã ghi nhận. Ba chỗ không chắc, đã ghi ở đây thay vì giấu vào thân kinh:
  Một, carahi trong câu hỏi 1.4; theo cách đọc câu thì nó là động từ chỉ hành vi, và tôi dịch là người đi. Trong
  tầng có an4.36:3.9 dùng cùng dạng từ này theo nghĩa rốt ráo. Nếu đọc khác thì câu hỏi vẫn giữ nguyên
  ý nhưng mất chủ từ.
  Hai, mahantena ākāsena xuất hiện hai lần: một lần sau mắt và một lần sau tai. Chỗ này tôi dùng khoảng
  không rộng lớn cho mắt nhưng dùng được xa hơn và rõ hơn cho tai, vì định nghĩa khoảng không cho tai là
  vô nghĩa; tôi đã sửa chỗ này trong lượt review đối kháng.
  Ba, vijānanalakkhaṇa và pajānanalakkhaṇā lần lượt cho thức và cho tuệ; tôi phân biệt là nhận biết rõ ràng
  và biết rõ triệt để. Tầng không có tiền lệ cho cặp này.
  Khoá 1.2 hỏi thức, tuệ và linh hồn trong chúng sinh là ba nghĩa khác nhau hay một nghĩa với ba lời gọi;
  tôi giữ cả hai vế và không thêm phán đoán nào. Nhiều thuật ngữ ở đây mang tính thuật ngữ học thuyết, tôi dịch
  theo nghĩa chứ không theo phán đoán luận lý.
  Dấu lược: đây là khoá duy nhất trong lát có …pe…, và tôi giữ đúng MỘT dấu lược ở đúng chỗ ấy, không mở
  rộng. Hai phía đều bằng 1.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
