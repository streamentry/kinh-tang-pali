notes: |-
  Lượt cải thiện 2026-10-14 (kiểm toán đối kháng, đối chiếu Pāli, English SuttaCentral, dn33 song song và tiền lệ toàn tầng). Bài trước đó chưa có ghi chú. Đã đổi 10 khoá trên 31.
  Accuracy: 2.3 và 3.1 paccupaṭṭhitakāmā dịch "các dục hiện có sẵn" làm chủ ngữ của "họ đi từ trạng thái này sang trạng thái khác" (3.5), trong khi dn33:1.10.88 cùng Pāli là chúng sinh ("chúng sinh ham muốn các dục hiện tiền") và cả danh sách ở 3.1–3.4 là các hạng chúng sinh; nay "những ai ham muốn các dục hiện tiền". 4.1–4.2 "người trí trong việc đắm say các dục" đặt sai vế (kāmabhogesu thuộc về "biết sự nguy hiểm ấy"); nay "biết sự nguy hiểm ấy / trong việc hưởng các dục, người trí". 5.1 "với người bị dính mắc vào điều khả ái" biến gadhitaṁ (đi với sotaṁ, dòng chảy) thành người bị dính mắc và thêm chủ thể không có trong Pāli, rồi 5.3 thêm "họ" lẫn với "họ" ở 3.5; nay "dính mắc vào cái khả ái, dễ chịu, / dòng chảy khó vượt, sau khi cắt đứt;" và 5.3 bỏ "họ" như iti93:8.3.
  Terminology: nimmānaratino và paranimmitavasavattino dịch theo mô tả ("ưa tạo hóa", "tự tại với những gì người khác tạo ra"), lệch tên cõi đã thành quy ước: "Hóa Lạc" (43 khoá có nimmānarati) và "Tha Hóa Tự Tại" (ye devā vasavattino 3/3 ở sn5.7, thig8.1, bv1.20; paranimmitavasavatti 31 khoá); nay 2.3 "chư thiên Hóa Lạc, chư thiên Tha Hóa Tự Tại", 3.2 "chư thiên Tha Hóa Tự Tại", 3.3 "chư thiên Hóa Lạc". 3.4 kāmabhogino dịch "đắm say" nay "hưởng các dục" (138 khoá kāmabhogī dùng "hưởng"; "đắm say" thuộc gadhita, mucchita). 5.1 sāta dịch "đẹp đẽ" nay "dễ chịu" (88 khoá; iti109:2.1 cùng cụm piyarūpasāta là "khả ái, dễ chịu"). 6.1 vedaguno dịch "thắng tri pháp" trùng với abhiññāya ở 6.3 (hai từ Pāli khác nhau); nay "bậc đạt minh", theo 33 khoá cùng Pāli, sn6.3, sn6.4, và đồng bộ với iti93:9.1. 4.3 giữ "hãy từ bỏ" (ja467:9.6 cùng sabbe kāme pariccaje).
  Điểm: semantic_fidelity 9.4 -> 9.3, grammar_logic 9.5 -> 9.4 và ambiguity_integrity 9.5 -> 9.3 (lượt chấm trước không ghi nhận các lỗi trên; sau khi sửa vẫn còn bất định ở các mục dưới). technical_integrity 10.0 -> 9.6 vì lượt này không chạy được bốn lệnh cổng: npm run validate, npm test, npm run check, npm run build; chưa tuyên bố technical gate pass.
  Bất định còn lại: (1) kāmūpapatti dịch "được hưởng" (2.1, 2.4, tiêu đề) theo hướng bản Anh SuttaCentral của bài này; dn33:1.10.87 cùng Pāli (4 khoá) dịch "sinh vào dục" và bản Anh dn33 là "sensual rebirth"; hai cách đọc đều hợp lý, giữ "được hưởng" vì câu hỏi "Ba cách ấy là gì?" và 3.4 kāmabhogino đều nói về việc hưởng dục. (2) Cách đọc paccupaṭṭhitakāmā là chúng sinh dựa vào dn33 và chủ ngữ số nhiều ở 3.5; bản Anh SuttaCentral của bài này đọc là "các dục hiện có" (vật được hưởng); không phân xử dứt khoát từ Pāli một mình. (3) 5.1–5.2 gadhitaṁ đi với sotaṁ (dòng chảy), theo bản Anh và iti109:2.1 (dòng chảy mang vẻ khả ái, dễ chịu); trật tự Việt đảo lên để người đọc gắn đúng vào "dòng chảy". (4) 6.1 ariyaddasā dịch "thấy pháp Thánh" theo iti93:9.1, bản Anh đọc "thấy các chân lý cao quý"; chưa phân xử được. (5) 6.3 "do thắng tri" thêm quan hệ nhân quả cho absolutive abhiññāya; giữ vì khớp iti93:9.3 và iti104:5.3 (cùng Pāli), trong khi snp3.12:32.3 dùng "sau khi thắng tri"; cần xử lý đồng bộ cả ba bài.
  Phép đo: 31/31 khoá Pāli và Việt trùng tập khoá và thứ tự; nháy kép/đơn khớp Pāli từng khoá 0 lệch; dấu lược … 0 lệch (Pāli bài này không có dấu lược); không có cặp Pāli trùng nguyên văn trong bài (phép này chạy rỗng); NFC đạt; không Pāli lọt sang Việt; không số Pāli trong bài (phép số chạy rỗng).
  Coverage English: Sujato phủ toàn bài tại commit đã ghim (mọi khoá có nội dung); không có bản Việt hiện hành tại snapshot (chỉ Pháp Cú), nên triangulation không vượt 9.4.
