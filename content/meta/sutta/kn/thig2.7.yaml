notes: |-
  Đủ 14/14 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  LỖI TẦNG THAM KHẢO ĐÃ ĐO ĐƯỢC — đây là lý do bài giữ draft. Tệp English Sujato đã ghim .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/thig/thig2.7_translation-en-sujato.json bị lệch ở mức segment: đối chiếu từng cặp thì sujato:1.1 mang nội dung Pāli 2.2, sujato:1.2 mang Pāli 2.1, sujato:1.3 mang Pāli 1.4, sujato:1.4 mang Pāli 1.1, sujato:2.1 mang Pāli 1.2, sujato:2.2 mang Pāli 1.3; chỉ 2.3–2.6 còn khớp. Sáu trong mười khoá có nội dung bị gán sai, nên đo coverage theo khoá sẽ ra 100% trong khi tầng tham khảo thực tế không dùng được. Tôi dịch từ Pāli và chỉ dùng Sujato để kiểm tra nghĩa, không dùng để định vị khoá. Đây là dữ liệu upstream hỏng, không phải lỗi provenance của tôi, nhưng nó làm suy yếu đối chiếu nên triangulation chỉ 7.4 và bài giữ draft cho tới khi người điều phối xử lý lớp tham khảo này. Xin ghi vào biên bản: đây có thể là lỗi nhập dữ liệu ở SuttaCentral, không phải lỗi riêng của thig2.7.

  Pāli trùng nguyên văn, dùng lại — bốn vế đầu đã có sẵn trong tầng:
  · `“Cātuddasiṁ pañcadasiṁ,` = sn10.5:2.1 → Ngày mười bốn, ngày mười lăm,
  · `yā ca pakkhassa aṭṭhamī;` = sn10.5:2.2 → và ngày mồng tám của nửa tháng;
  · `Pāṭihāriyapakkhañca,` = sn10.5:2.4 → và cả tuần lễ thần biến, (tôi theo bản không kèm chú thích trong ngoặc của sn10.5:2.4)
  · `aṭṭhaṅgasusamāgataṁ.` = sn10.5:2.4 → trọn vẹn đầy đủ tám chi phần.
  · `devakāya` → cõi chư thiên (sn9.6:6.2 đã có trong tầng).

  Hai chỗ phải tự dịch và đã tra tiền lệ: `Uposathaṁ upāgacchiṁ` → Ta bước vào ngày giới Uposatha (tầng có cả Phẩm Giữ Trai lẫn Phẩm Ngày Bố Tát cho Uposathavagga, còn `Uposathaṁ upavaseyya` thì đã dịch là hãy giữ giới — vì đây là hành động bước vào nên tôi giữ chữ Uposatha như tên ngày lễ); `muṇḍā saṅghāṭipārutā` → đầu cạo trọn, mặc y ngoài (saṅghāṭi = y ngoài, xem thig2.5).

  Bất định đã ghi nhận:
  · `Sājja ekena bhattena` — Sujato dịch thành Today I eat just once a day, tức đọc `sājja` như hôm nay. Theo từ điển `sājja` là tề chu đầy đủ, và vế 2.4 đã nói việc mặc y ngoài, nên tôi dịch Tề chu đầy đủ, chỉ ăn một bữa — giữ cả hai semantic unit thay vì bỏ `sājja`. Đây là chỗ tôi cố ý không theo Sujato; ghi lại vì reviewer có thể bác.
  · `Mittātherīgāthā` trùng nguyên văn với thig1.8:0.3, đang được dịch là Kệ Của Trưởng Lão Nữ Mittā; còn sáu bài thig2.x dùng Kinh Kệ Của Trưởng Lão Nữ. Tôi chọn theo sáu bài cùng Phẩm Hai Bài Kinh để trong lát này không tự mâu thuẫn, và ghi rõ ở đây để người điều phối gộp. Dòng kết `:3.1` thì hai cách trùng nhau nên không có xung đột.
  · `:0.2` Dukanipāta → Bộ Hai Bài Kinh theo đa số trong chính Theragāthā/Therīgāthā (8 bài so với 1 bài Tập Hai của thag2.35); ở Jātaka tôi theo đa số ngược lại. Chi tiết đếm ở báo cáo gửi người điều phối.

  Đối chiếu tầng tham khảo: Sujato có 13/14 khoá nhưng lệch như đã nói trên. Mọi khoá Pāli dưới 40 ký tự nên mẫu số coverage rỗng. Bản Việt hiện hành không có cho Trưởng Lão — giới hạn bản chụp upstream.

  Kiểm thủ công trên TOÀN BỘ 14 khoá (kiểm() rỗng vì không khoá Pāli nào từ 40 ký tự): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược khớp (3.1 có 2 ở cả hai phía), nháy kép cân (mở 1.1, đóng 2.6), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.

  Giải quyết draft 2026-10-12 (Claude Sonnet 5.5, Claude Code). Mục này thay thế mục "Sājja ekena bhattena" ở phần Bất định phía trên và phần kết luận "giữ draft" của mục LỖI TẦNG THAM KHẢO.
  Khoá đổi (4/14, trong đó 1 lỗi nghĩa thật):
  · `:2.3` `Sājja ekena bhattena` — LỖI NGHĨA THẬT. `sājja` là `sā` + `ajja` (tôi/nàng ấy + hôm nay), không phải một từ nghĩa "tề chu đầy đủ". Căn cứ: cùng dạng mở câu `Sājja …` ở thig3.5:3.1 và thig6.1:6.1 (`Sājja abbūḷhasallāhaṁ` → "Nay cây tên đã được nhổ …"), thig5.2:4.1 (`Sājja piṇḍaṁ caritvāna` → "Nay sau khi khất thực …"), thig13.4:2.1 (→ "Hôm nay, ăn hết …"), và sn10.5:3.5 `Sā dāni ajja passāmi` → "hôm nay tôi thấy" (`sā` là đại từ chủ ngữ của người nữ đang nói); Sujato cũng đọc là "Today I eat just once a day". Sửa thành "Nay ta chỉ ăn một bữa,". Việc này cũng làm rõ cấu trúc bài: hai khổ đầu là việc đã làm (giữ Uposatha, hướng về chư thiên), từ `ajja` là hiện tại (xuất gia, ăn một bữa, không còn mong thiên giới). Ghi chú cũ "cố ý không theo Sujato" vì vậy bị bác bỏ.
  · `:2.4` "đầu cạo trọn" → "đầu cạo trọc": chữ "trọn" không có cơ sở trong `muṇḍā`; tiền lệ thig5.2:4.2 và thag16.10:25.2 (cùng dòng Pāli `muṇḍā saṅghāṭipārutā`) đều dùng "đầu cạo trọc". Giữ "y ngoài" cho `saṅghāṭi` (thig2.5, thig2.6 cùng phẩm, và đa số ở các khoá `saṅghāṭipattacīvaradhāraṇe`: 18 "y ngoài" so với 9 "tăng-già-lê" trên 43 khoá, còn lại là dạng khác). Dùng "khoác" cho `pārutā` theo tiền lệ sn7.13, thi-ap18, thag17.2 (`saṅghāṭipāruto` → "khoác").
  · `:2.2` `devakāyābhinandinī` "vui mừng trong cõi chư thiên" → "vui thích cõi chư thiên": `abhinandinī` có tân ngữ là `devakāya`, không phải vị trí "trong".
  · `:2.6` `vineyya hadaye daraṁ` "vì đã gỡ bỏ ưu sầu khỏi lòng" → "đã nhiếp phục sự xao xuyến trong lòng": `vineyya` là bất biến quá khứ phân từ, không có từ "vì" nào trong Pāli; dùng lại cách dịch của đúng dòng Pāli ấy ở sn10.8:13.2 và ja546:187.2 ("nhiếp phục sự xao xuyến trong tâm", 2/3 nơi; an3.35:9.2 dịch "vứt bỏ mọi lo âu nơi cõi lòng"); giữ "lòng" cho `hadaya` như bản cũ.
  Số khoá lỗi nghĩa thật: 1/14 (`:2.3`); 3 khoá còn lại sửa chữ/tiền lệ, không đổi nghĩa lớn. 10 khoá còn lại đọc đối kháng và giữ nguyên; bốn vế đầu (14, 15, mồng 8) đã đối chiếu số Pāli, đúng.
  Blocker "tầng Sujato lệch ở mức segment" — đã gỡ (loại B/D: giới hạn của tầng tham khảo, không phải lỗi văn bản). Đã đối chiếu từng cặp: Sujato viết lại thành MỘT câu tiếng Anh với động từ đứng đầu và đảo thứ tự vế (Sujato:1.1 = Pāli 2.2, 1.2 = 2.1, 1.3 = 1.4, 1.4 = 1.1, 2.1 = 1.2, 2.2 = 1.3; 2.3–2.6 khớp), nên khoá của Sujato không thẳng hàng với khoá Pāli. Đây là cấu trúc câu của bản Anh, không có nội dung nào bị bỏ hay thêm; coverage không bị ảnh hưởng vì mọi khoá Pāli của bài dưới 40 ký tự (mẫu số coverage = 0, cổng không đo được gì ở bài này). Bản Việt viết từ Pāli, và nghĩa toàn khổ thơ được đối chiếu với Sujato ở mức cả câu, không ở mức khoá. Vì chỉ đối chiếu được ở mức cả câu và Pāli là authority nên `triangulation` giữ 7,4 (không cao hơn 8,0).
  Giới hạn tham chiếu giữ nguyên: `vietnamese-current` chỉ có Pháp Cú nên không có tầng Việt hiện hành cho Therīgāthā; không có bản Anh độc lập thứ hai.
  Bất định còn lại: (1) `pāṭihāriyapakkha` giữ "tuần lễ thần biến" theo dạng phổ biến nhất của tầng (16/25 khoá cùng dòng Pāli dùng "tuần lễ thần biến/thần thông"; 5/25 dùng "nửa tháng thần biến"; 4/25 ở an3.37/an3.38 dùng "kỳ phép nhiệm màu"); `pakkha` vốn là nửa tháng nên "tuần lễ" chỉ là quy ước, không phải nghĩa đen của chữ, nghĩa chính xác của hợp từ chưa phân xử được ở cấp bài này; (2) `upāgacchiṁ` "bước vào ngày giới" so với "giữ" (`upavasanti` ở sn10.5 dịch "hành trì"); (3) tiền lệ ja469:3.2/4.2 vẫn còn "đầu cạo trọn" (ngoài phạm vi bài này, đã báo). Kiểm thủ công trên đủ 14 khoá: đúng tập khoá và thứ tự, nháy “ ” cân (mở 1.1, đóng 2.6), một dấu lược ở 3.1 khớp Pāli, không Pāli lọt sang bản Việt, NFC. Chưa chạy npm run validate, npm test, npm run check, npm run build, nên technical_integrity giữ 9,6.
