notes: |-
  Đủ 14/14 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  LỖI TẦNG THAM KHẢO ĐÃ ĐO ĐƯỢC — đây là lý do bài giữ draft. Tệp English Sujato đã ghim .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/thig/thig2.7_translation-en-sujato.json bị lệch ở mức segment: đối chiếu từng cặp thì sujato:1.1 mang nội dung Pāli 2.2, sujato:1.2 mang Pāli 2.1, sujato:1.3 mang Pāli 1.4, sujato:1.4 mang Pāli 1.1, sujato:2.1 mang Pāli 1.2, sujato:2.2 mang Pāli 1.3; chỉ 2.3–2.6 còn khớp. Sáu trong mười khoá có nội dung bị gán sai, nên đo coverage theo khoá sẽ ra 100% trong khi tầng tham khảo thực tế không dùng được. Tôi dịch từ Pāli và chỉ dùng Sujato để kiểm tra nghĩa, không dùng để định vị khoá. Đây là dữ liệu upstream hỏng, không phải lỗi provenance của tôi, nhưng nó làm suy yếu đối chiếu nên triangulation chỉ 7.4 và bài giữ draft cho tới khi người điều phối xử lý lớp tham khảo này. Xin ghi vào biên bản: đây có thể là lỗi nhập dữ liệu ở SuttaCentral, không phải lỗi riêng của thig2.7.

  Pāli trùng nguyên văn, dùng lại — bốn vế đầu đã có sẵn trong tầng:
  · `“Cātuddasiṁ pañcadasiṁ,` = sn10.5:2.1 → Ngày mười bốn, ngày mười lăm,
  · `yā ca pakkhassa aṭṭhamī;` = sn10.5:2.2 → và ngày mồng tám của nửa tháng;
  · `Pāṭihāriyapakkhañca,` = sn10.5:2.4 → và cả tuần lễ thần biến, (tôi theo bản không kèm chú thích trong ngoặc của sn10.5:2.4)
  · `aṭṭhaṅgasusamāgataṁ.` = sn10.5:2.4 → trọn vẹn đầy đủ tám chi phần.
  · `devakāya` → cõi chư thiên (sn9.6:6.2 đã có trong tầng).

  Hai chỗ phải tự dịch và đã tra tiền lệ: `Uposathaṁ upāgacchiṁ` → Ta bước vào ngày giới Uposatha (tầng có cả Phẩm Giữ Trai lẫn Phẩm Ngày Bố Tát cho Uposathavagga, còn `Uposathaṁ upavaseyya` thì đã dịch là hãy giữ giới — vì đây là hành động bước vào nên tôi giữ chữ Uposatha như tên ngày lễ); `muṇḍā saṅghāṭipārutā` → đầu cạo trọn, mặc y ngoài (saṅghāṭi = y ngoài, xem thig2.5).

  Bất định đã ghi nhận:
  · `Sājja ekena bhattena` — Sujato dịch thành Today I eat just once a day, tức đọc `sājja` như hôm nay. Theo từ điển `sājja` là tề chu đầy đủ, và vế 2.4 đã nói việc mặc y ngoài, nên tôi dịch Tề chu đầy đủ, chỉ ăn một bữa — giữ cả hai semantic unit thay vì bỏ `sājja`. Đây là chỗ tôi cố ý không theo Sujato; ghi lại vì reviewer có thể bác.
  · `Mittātherīgāthā` trùng nguyên văn với thig1.8:0.3, đang được dịch là Kệ Của Trưởng Lão Nữ Mittā; còn sáu bài thig2.x dùng Kinh Kệ Của Trưởng Lão Nữ. Tôi chọn theo sáu bài cùng Phẩm Hai Bài Kinh để trong lát này không tự mâu thuẫn, và ghi rõ ở đây để người điều phối gộp. Dòng kết `:3.1` thì hai cách trùng nhau nên không có xung đột.
  · `:0.2` Dukanipāta → Bộ Hai Bài Kinh theo đa số trong chính Theragāthā/Therīgāthā (8 bài so với 1 bài Tập Hai của thag2.35); ở Jātaka tôi theo đa số ngược lại. Chi tiết đếm ở báo cáo gửi người điều phối.

  Đối chiếu tầng tham khảo: Sujato có 13/14 khoá nhưng lệch như đã nói trên. Mọi khoá Pāli dưới 40 ký tự nên mẫu số coverage rỗng. Bản Việt hiện hành không có cho Trưởng Lão — giới hạn bản chụp upstream.

  Kiểm thủ công trên TOÀN BỘ 14 khoá (kiểm() rỗng vì không khoá Pāli nào từ 40 ký tự): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược khớp (3.1 có 2 ở cả hai phía), nháy kép cân (mở 1.1, đóng 2.6), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.
