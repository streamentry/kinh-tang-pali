notes: |-
  **Phạm vi: đủ mọi khoá trong `all` — 9 khoá/bài, 108 khoá cả lát.** Bốn vế kệ của
  Trưởng lão Mahāvaccha trong phẩm Dutiyavagga.

  **Vế 2 trùng nguyên văn `sn2.14:3.2`** (`Samāhito jhānarato satīmā`) — bài đã `published`; tôi dịch
  giống hệt: *an định, hoan hỷ trong thiền, có niệm*. Vế 1 dùng đúng `sīlavatūpapanno` của
  `an5.42:3.3` (*giới hạnh trọn vẹn*).

  **Dòng kết lược giữ HAI DẤU LƯỢC, không mở rộng** (BRIEF_VI3 §10.1): 10 bản trên đĩa mở rộng,
  5 bản giữ lược. Xem `thag1.112.yaml`. Cả hai đều giữ 2 dấu lược như Pāli.

  **Thứ tự khoá tiêu đề: theo PĀLI** (`0.3` = phẩm, `0.4` = tên bài kệ); 12 bản thag đã publish đặt
  ngược, tôi không sửa chúng.

  **Không đối chiếu được tầng Việt hiện hành** (bilara chỉ có Pháp Cú). Sujato có 8/9 khoá, trống
  đúng dòng kết lược; mọi khoá Pāli ngắn hơn 40 ký tự nên `substantiveSegments = 0`, `ratio = 1`.

  **Thuật ngữ, đếm được.** `Paññābalī` → *sức mạnh của tuệ* (an4.153:0.3 *Kinh Sức Mạnh Của Tuệ*;
  an4.163:2.5 và an5.14:6.1 dịch `paññābalaṁ` là *sức mạnh của tuệ*). `sīlavatūpapanno` → *giới hạnh
  trọn vẹn* (an5.42:3.3, trùng nguyên văn). `Samāhito jhānarato satīmā` → *an định, hoan hỷ trong
  thiền, có niệm* (sn2.14:3.2, trùng nguyên văn). `Yadatthiyaṁ bhojanaṁ` → *ăn đúng số phần cần
  thiết* (Sujato *eating just the needed food*). `Kaṅkhetha kālaṁ` → *hãy chờ thời*. `vītarāgo` →
  *ly tham* (613 bản trong tầng; an5.82:2.3 dịch `Vītarāgo hoti` là *Người ấy ly tham*; còn
  sn16:20.2 và an10.14:11.2 dùng *thoát khỏi tham*).

  **Bất định đã ghi.** `vītarāgo` là *ly tham*, không phải *vô tham* (33 bản) — tôi theo đa số 613.
  `Kaṅkhetha kālaṁ idha` ngụ ý chờ thời ở tại giới sa-môn (Sujato *one should await one's time here,
  free of desire*); tôi dịch đúng *hãy chờ thời ở đây* và **không** diễn giải thêm thành *chờ ngày
  ra đi* — Pāli không nói.

  **Kiểm kỹ thuật.** `save_vi` sạch, chạy hai lần idempotent. Tự kiểm: đủ 9/9 khoá; đúng ID; thứ tự
  khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2); ngoặc kép cân; không chữ ngoài
  Latin; không còn `(…)`. Không chạy `npm run validate|test|check|build` (đợt này cấm) →
  `technical_integrity` = **9.6**.

  **Danh xưng giữ nguyên dạng Pāli** (Mahāvaccha).
