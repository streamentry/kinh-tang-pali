notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Milindapañha. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ dùng lại: Milindapañha (34) · Mahāvagga → Đại Phẩm · Rājā āha— → Vua nói: ·
  Thero āha— → Trưởng lão nói: (2 bài đã có, cả hai dùng gạch dài) · saupādāno/anupādāno → còn/không
  chấp thủ (mil3.2.7 dùng đúng cặp này) · atthi koci … na … → có … hay không (mil3.7.12) ·
  Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā (25 bài, nhất quán tuyệt đối).
  Duyên cớ của câu hỏi về việc dùng tái sinh chứ không phải thọ sanh: mil3.2.7 trong cùng tác phẩm đã dịch
  paṭisandahissāmi thành tái sinh, nên tôi theo đúng cả bảy khoá có động từ này và cả tiêu đề Paṭisandhipañha.
  Tầng có cả thọ sanh (mil7.2.4 dùng sự thọ sanh cho paṭisandhi); hai lựa chọn đều có căn cứ, tôi chọn theo
  tác phẩm. Nếu biên tập muốn thống nhất toàn tầng thì đổi cả hai nhóm cùng lúc.
  Bất định đã ghi nhận. Sakileso và nikkileso không có tiền lệ trong tầng; tôi dịch là người còn ô nhiễm và
  người thanh tịnh, giữ đúng hai vế có và không. Khoá 1.7 paṭisandahissasī là câu hỏi dự đoán nên tôi dịch
  bằng cặp phải không, không thêm ý nào ngoài dấu câu.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0. Nháy kép: cân trên cả bài.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
