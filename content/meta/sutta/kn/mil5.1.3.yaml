  Đặt mới hoặc 0 tiền lệ, có lý do từ Pāli: `kappaṭṭhitika kamma` → `nghiệp tồn tại suốt một kiếp` (`mil5.5.2:5.2` dịch `một lượng nghiệp lớn`, không bám Pāli); `āgucārī` → `kẻ phạm tội`; `āghātana` → `nơi hành quyết`; `laddhavaro` → `đã nhận được ân huệ`; `ādeyyavacano` → `lời nói được người ta nghe theo`; `khāralavaṇa` → `muối kiềm`; `salākā` → `que nung`; `anusota` đứng trước `paṭisota` giữ hai chữ đối nhau.

  **Bất định đã phân xử, ghi lại để biên tập xem lại.**
  (1) Khoá `9.2` `cha koṭṭhāse kate kappe atikkante paṭhamakoṭṭhāse saṅghaṁ bhindi`: tôi đọc `paṭhamakoṭṭhāse atikkante` như một cụm vị trí tuyệt đối (`phần thứ nhất đã trôi qua`) và `cha koṭṭhāse kate kappe` như cụm thứ hai (`kiếp được chia thành sáu phần`), rồi `saṅghaṁ bhindi`; cộng với `pañca koṭṭhāse niraye paccitvā` thì 1 + 5 = 6 phần, khớp một kiếp (`kappaṭṭhitika`, các khoá `1.6`, `9.6`). Cách đọc khác về vị trí của `atikkante` (và về việc phần thứ nhất ứng với thời gian nào so với lúc chia rẽ Tăng) có thể làm đổi sắc thái; Pāli một mình không phân xử chắc, nên canonical text giữ sát từng từ, không thêm lời giải thích.
  (2) Khoá `6.2` `patthaddhadhammosadhabalena`: `patthaddha` không có tiền lệ trong tầng (0 khoá); tôi đọc song song với `balavosadhabalena` ở khoá `6.1` và dịch `thuốc pháp mạnh mẽ`; nếu `patthaddha` mang nghĩa khác thì phải sửa chỗ này. Cũng ở `6.2` `kāruññabalo` đặt trước `patthaddha…bala` nên tôi tách `nhờ sức mạnh của lòng bi, nhờ sức mạnh của thuốc pháp mạnh mẽ`.
  (3) Khoá `1.4` `pakatatto samānasaṁvāsako samānasīmāyaṁ ṭhito`: ba thuật ngữ Luật về tỳ-kheo có đủ tư cách để phá Tăng; tầng không có tiền lệ (`pakatatta` 0, `samānasaṁvāsaka` 0 khoá; `samānasīmā`/`sīmāya` chỉ có `tha-ap310:1.4` `ranh giới`). Tôi dịch sát từng từ (`ở trạng thái bình thường`, `cùng một nhóm sinh hoạt`, `đứng trong cùng một ranh giới`), không tự giải thích nghĩa Luật.
  (4) Khoá `7.5` `balavicchitakārī`: tôi đọc là `balavā icchitakārī` (có quyền thế, làm được điều mình muốn) và dịch `làm được điều mình muốn nhờ có quyền thế`; từ này không có tiền lệ nên đây là cách đọc, không phải nghĩa đã kiểm chứng.
  (5) Khoá `7.5`/`7.2` `deva` → `tâu đại vương`, khoá `7.5` `ahametassa kāraṇā rañño santike paṭivacanaṁ karissāmi` → `vì hắn mà tôi sẽ đáp lời nhà vua`: `kāraṇā` ở đây dịch `vì`, không chắc là `vì (hắn)` hay `vì việc này`, cả hai đều hợp ngữ cảnh.
  (6) Khoá `6.5`/`9.7` `atthato sampaṭiccha`: `mil6.1.1:7.3` dịch `hãy thật sự suy xét`; tôi dịch `hãy chấp nhận … là có nghĩa lý`, bám `sampaṭicchati` = nhận lấy, đồng ý. `atthato` không phân xử chắc là `đúng nghĩa lý` hay `đúng sự thật`.
  (7) Khoá `3.1` lời nghĩ của Đức Thế Tôn (`imassa apariyantakataṁ kammaṁ … kappaṭṭhiyameva kammaṁ āyūhissatīti`) trong Pāli **không** có nháy đơn; bản Việt cũng không thêm nháy, dịch bằng `nghĩ rằng …` để khớp nháy từng khoá. `kappaṭṭhiyameva` dịch `vẫn sẽ tạo nghiệp tồn tại suốt một kiếp`, không thêm `chỉ`.
  (8) Khoá `8.1`–`8.4` kệ: ngữ pháp trải qua bốn khoá (`imehi aṭṭhīhi` … `pāṇehi buddhaṁ saraṇaṁ upemi`); bản Việt dịch từng dòng rời, đọc liền thành một câu. `pāṇehi` → `bằng mạng sống`, và `9.1` `pāṇupetaṁ saraṇamagamāsi` → `quy y bằng mạng sống` cho nhất quán; `Tôi` cho `upemi` (Pāli không có đại từ riêng, không dùng `con`).
  (9) Khoá `10.2` chuỗi hợp từ dài `vātapittasemhasannipātautupariṇāmavisamaparihāraopakkamikopakkantaṁ`: tôi tách thành bốn nguyên nhân (`sự hợp lại của phong, mật, đàm` · `thời tiết đổi thay` · `chăm sóc không điều hòa` · `tổn thương do tác động bên ngoài`) theo `an4.87:5.5`; `ahitacitto` → `tâm muốn làm điều bất lợi` (đối nghịch `hitacitto` ở `10.3`).
  (10) Khoá `1.1` `kena pabbājito` → `được ai cho xuất gia` (dạng bị động), khoá `1.3` `devadattena pabbajitvā saṅgho bhinno` → `sau khi xuất gia, Devadatta đã chia rẽ Tăng đoàn` (Pāli là cách bị động `Tăng đoàn bị chia rẽ bởi Devadatta`, nghĩa không đổi).

  **Lỗi bản nháp đã bắt:** `phá rẽ` → `chia rẽ` (đo 15 so với 2 theo Pāli); `Bích Chi Phật` → `bậc Độc Giác` (đo 16 so với 3); `khổ cảnh` → `ác thú` cho `āpāyika` (đo `apāya`: 149 so với 4); `vương tử` → `hoàng tử` (230 so với 79); `lòng thương xót` → `lòng thương` cho `anukampaka` (46 so với 5); khoá `5.1` bản nháp đầu dịch `thấy người thân … đang phải chịu hình phạt` nhưng Pāli không có động từ `thấy` ở đó, đã sửa thành `làm cho hình phạt nặng thành nhẹ đối với người thân hay bạn … đang phải chịu hình phạt nặng`; khoá `10.2` bản nháp đầu dịch `ahitacitto` là `không vì lợi ích của người bệnh` (lệch nghĩa đối nghịch), đã đổi thành `với tâm muốn làm điều bất lợi cho người bệnh`; khoá `11.6` đã đổi thứ tự để `kappakoṭisatasahassampi` đứng ở cuối câu như một khoảng thời gian.

