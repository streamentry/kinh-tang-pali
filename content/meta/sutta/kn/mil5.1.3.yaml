  **Năm phép kiểm.**
  (1) Tập khoá Việt = tập khoá Pāli: 65/65, cùng thứ tự.
  (2) Nháy đơn `‘ ’` và nháy kép `“ ”` khớp Pāli từng khoá: 65 khoá × 4 loại dấu, 0 lệch. Dấu nháy kép ngoài của Nāgasena chạy qua ranh giới khoá (mở ở `4.2`, đóng ở `6.3`; mở ở `6.5`, đóng ở `7.7`; mở ở `7.11`, đóng ở `9.3`; mở ở `9.7`, đóng ở `10.2`; mở ở `10.6`, đóng ở `11.2`) và được giữ đúng như Pāli; tương tự lời vua (mở `2.3`, đóng `2.4`; mở `11.3`, đóng `11.4`; mở `12.1`, đóng `12.2`) và đoạn kệ `8.1`–`8.4` (nháy đơn mở ở `8.1`, đóng ở `8.4`).
  (3) Pāli trùng nguyên văn trong chính bài: 1 nhóm (`7.1` = `10.1` = `11.1`), bản Việt giống hệt nhau ở cả ba, 0 cặp lệch. `6.5` và `9.7` khác nhau ở Pāli (`tvaṁ`) nên Việt cũng khác (`ngài cũng hãy …`). Ba khoá `2.1`/`2.2`/`2.3` lặp cùng một mệnh đề nháy đơn, bản Việt giống nhau ở cả ba lần.
  (4) Dấu lược: Pāli 0 khoá có `…`, Việt 0 khoá có `…` — không có `…pe…` hay `(…)` nào để giữ hay mở rộng. Phép này chạy rỗng, không phải đạt.
  (5) Số Pāli: xem dưới.
  Thêm: NFC đạt, 0 khoá rỗng, 0 khoảng trắng thừa, không có Pāli lọt sang Việt ngoài tên riêng và nhan đề (Milindapañha, Meṇḍakapañha, Aṭṭhissara) và từ `koṭi` (giữ nguyên dạng Pāli, xem dưới).

  **Số Pāli, tự tính.** `chayime … khattiyakumārā` = 6 vị hoàng tử (Bhaddiya, Anuruddha, Ānanda, Bhagu, Kimila, Devadatta: đếm đủ 6 tên) và `upālikappako sattamo` = Upāli người thợ cạo là vị thứ 7 (khoá `1.2`). `cha koṭṭhāse` = 6 phần, `paṭhamakoṭṭhāse` = phần thứ nhất, `pañca koṭṭhāse` = 5 phần: 1 + 5 = 6, khớp nhau (khoá `9.2`). `kappakoṭisatasahassa` (khoá `3.1`, `4.5`, `5.2`, `6.2`, `11.6`) = `kappa` × `koṭi` × `sata` × `sahassa`; tôi **không quy ra số** mà dịch `trăm ngàn koṭi kiếp`, giữ `koṭi` nguyên dạng Pāli (toàn tầng `koṭi` giữ nguyên dạng ở 31 khoá; tiền lệ `snp3.10:29.3` `năm koṭi nahuta`). `anekāni`/`bahūni` → `nhiều`. `kappaṭṭhitika` = tồn tại suốt một kiếp (các khoá `1.6`, `3.1`, `9.6`). `ubhato koṭiko pañho` = câu hỏi có hai đầu (khoá `2.4`). Không có cụm số nào thuộc loại chưa phân xử được (`Tiṁsakappasahassa`).

  **Tiền lệ (đếm trên tầng vi hiện có, loại tệp này).**
  Pāli trùng nguyên văn với bài mil khác: đã dò 65 khoá, 3 khoá có Pāli trùng nguyên văn (`0.1`, `0.2`, `0.3`); ở `0.1` `Milindapañha` bản Việt giống đa số (216/227; còn `Mi-lan-đà Vấn Đạo` 8, `Mi-tiên Vấn Đáp` 3), ở `0.3` `Iddhibalavagga` → `Phẩm Iddhibala` 4/4 trong `mil5.1.*`. `0.2` `Meṇḍakapañha`: toàn `mil` để trần `Meṇḍakapañha` ở 30 khoá và `Phẩm Meṇḍakapañha` ở 4 khoá, nhưng 4/4 khoá trong `mil5.1.*` (`mil5.1.5`, `mil5.1.7`, `mil5.1.9`, `mil5.1.10`) dùng `Phẩm Meṇḍakapañha` — tôi theo phạm vi gần nhất (cùng phẩm), nên ở 1 trong 3 khoá trùng bản Việt khác đa số toàn tầng, có chủ ý. Số `0.4`: `3.` giữ số thứ tự như `mil5.1.5`, `mil5.1.7`, `mil5.1.9`, `mil5.1.10`.
  Văn xưng đo ở phạm vi gần nhất: trong `mil5.1.*` `Thưa Đại đức` 23 so với `bạch ngài` 4; `tâu đại vương` 65 và `Tâu Đại vương` 65 (đầu câu viết hoa, trong câu viết thường). Theo `mil5.1.5`: `Thưa Đại đức Nāgasena`, `tâu đại vương`; `deva` (xưng hô vua trong ví dụ) → `tâu đại vương` cho nhất quán với `mahārāja`.
  Thuật ngữ, đếm đối chiếu theo Pāli (không đếm chữ Việt thô):
  `saṅghaṁ bhindati`/`saṅghabhedaka`: toàn tầng `chia rẽ Tăng` 15 (12 + 3 viết hoa), `phá hòa Tăng` 8, `phá rẽ Tăng` 2, `phá hoại Tăng` 2; riêng `mil` có 2 khoá (`mil5.5.2:5.2`, `mil6.3.8:1.4`) đều là `phá rẽ Tăng đoàn`. Hai phạm vi cho đa số khác nhau: tôi chọn đa số toàn tầng `chia rẽ`, ghép với `Tăng đoàn` (toàn tầng 391 khoá, `mil` 8) ⇒ `chia rẽ Tăng đoàn`; bản nháp đầu viết `phá rẽ` theo `mil`, đã đổi sau khi đo. Đây là điểm cần người biên tập xem lại nếu muốn thống nhất với hai khoá `mil` kia.
  `niraye paccati` → `bị nung nấu trong địa ngục` (37 khoá Pāli có dạng này: `nung` 9, `nung nấu` 5, `nấu` 5, `thiêu đốt` 4; chọn `nung nấu`, gần nhất với `sn3.20:4.5`, `ud5.3:11.6`, `an10.39:2.4`/`iti18:3.6` `suốt một kiếp`).
  `apuñña` → `điều vô phước` (toàn tầng 79 khoá có `apuñña`: `vô phước` 32, `bất thiện` 31, `tội` 24; trong `mil` 10 khoá chỉ có `nghiệp ác` 4 và `điều ác` 1 ở dạng đối lập `puñña`/`apuñña`, không có tiền lệ cho `apuññaṁ āpajjati`). Chọn `vô phước`, đi cùng động từ `mắc phải` cho `āpajjati`.
  `paccekabuddha` → `bậc Độc Giác` (20 khoá: `bậc Độc Giác` 6, `vị Độc Giác` 5, `các Độc Giác` 3, `Bích Chi Phật` 3, `Phật Độc Giác` 1; bản nháp đầu viết `Bích Chi Phật` từ `an2.56`, đã đổi sau khi đo). `paccekabodhi` → `sự giác ngộ của bậc Độc Giác` (0 tiền lệ).
  `āpāyika` → `dẫn đến ác thú` (`apāya` 149 `ác thú` so với 122 `đọa xứ`; `āpāyika` riêng 45 `đọa xứ`/12 `Bại Vong`; chọn `ác thú` để `vinipāta` giữ `đọa xứ` 127 trong cùng câu `nirayena nirayaṁ vinipātena vinipātaṁ`). `vinipāta` → `đọa xứ`.
