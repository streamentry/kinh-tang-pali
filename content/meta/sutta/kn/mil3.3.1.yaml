notes: |-
  ƯU TIÊN DÙNG LẠI HAI THỨ ĐÃ CÓ. Một: câu chốt “Kallosi, bhante nāgasenā”ti. ở 2.1
  có đúng 20 bản Việt đã dùng cùng một nguyên văn, tôi lấy nguyên văn đó. TIEN_LE_PHAI
  cũng liệt kê cặp này. Hai: dãy duyên mười mắt xích ở 1.4 TRÙNG NGUYÊN VĂN với
  an3.61:15.2-15.12, tôi dùng lại từng vế: Với vô minh làm duyên có các hành, với các
  hành làm duyên có thức, với thức làm duyên có danh sắc, với danh sắc làm duyên có sáu
  xứ, với sáu xứ làm duyên có xúc chạp, với xúc chạp làm duyên có thọ, với thọ làm
  duyên có ái, với ái làm duyên có thủ, với thủ làm duyên có hữu, với hữu làm duyên có
  sinh, với sinh làm duyên có già chết, sầu bi khổ ưu não được sinh khởi. Hệ quả: già
  chết ở đây viết không có chữ và, trong khi mil3.3.4 và mil3.4.8 dùng già và chết; tôi
  theo nguyên văn đã có thay vì tự viết lại.
  Vua nói— giữ gạch dài vì Pāli có gạch dài. Tầng đang phân hoá 12 chỗ Vua nói: và 6
  chỗ Vua nói—, tôi theo vế có gạch dài vì Pāli có gạch dài; đây cũng là cách mil3.3.4
  dùng. 0.2 Vicāravagga là Phẩm Khảo Sát theo 3 bài so với 1 bài Phẩm Suy Xét.
  0.3 Addhānamūlapañha là 0 tiền lệ, tôi đặt mới Câu hỏi về gốc rễ của thời gian theo
  đúng mẫu Câu hỏi về sự khởi sinh của tiến trình của mil3.3.4 và Câu hỏi về đặc trưng
  của cảm thọ của mil3.3.9. addhāna có tiền lệ gần nhất là mil3.7.10:0.3 Dīghaṭṭhi
  dịch Câu hỏi về thời gian dài, tức cùng gốc ṭhi. mūla có nhiều tiền lệ gốc rễ.
  Bộ ba quá khứ, vị lai, hiện tại có tiền lệ rõ: vài câu trong tầng dùng đúng quá khứ,
  vị lai, hiện tại. Bất định nhỏ ở 1.5: purimā koṭi là thời hạn đầu tiên hay đại kỳ đầu
  tiên, tôi dịch phần đầu của thời gian; mil3.6.9:1.5 đã dịch koṭi na paññāyati là
  không thể tính được nên tôi theo.
  Bốn khoá 1.2-1.5 đủ 40 ký tự nên đây là bài duy nhất trong lát mà chốt kiểm của
  _hvi.py thật sự có chạy; mọi khoá còn lại tôi tự quét. 10/10 khoá, không rỗng, thứ tự
  khớp Pāli, NFC, không dấu lược, nháy kép mở ở 1.2, 1.3, 2.1 và đóng ở 1.5 y hệt Pāli.
  save_vi sạch và idempotent. Không chạy npm run validate|test|check|build nên
  technical_integrity 9.5. Bài này KHÔNG có bản Anh Sujato đã ghim nên scorecard không
