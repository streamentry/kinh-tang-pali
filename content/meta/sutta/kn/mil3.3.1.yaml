  **Về tầng Anh.** Tôi đã đếm: `mil3.3.1` có **4 khoá thân** (≥40 ký tự, bỏ khối `:0`) và **0** trong số đó có chữ Anh. `english-sujato` không có tệp nào cho `mil` (thư mục `sutta/kn/` của Sujato chỉ có `cp`, `dhp`, `iti`, `ja`, `kp`, `snp`, `thag`, `thig`, `ud`). `english-project` không có lớp lấp cho `mil`. Tôi cũng đã kiểm `content/meta/reference-gaps.yaml` và xác nhận `mil3.3.1` **không** có trong đó, nên chưa có ai ghi nhận sự mất này. Đây là trường hợp bộ đo coverage bắt được (ratio = 0, thấp hơn ngưỡng) — ngược lại với `ja179`/`ja192`/`ja183`.
  
  **Phần dịch tốt, và tôi đã tra tiền lệ cho từng mắt xích.** Chuỗi duyên khởi ở `1.4` dùng đúng công thức **"Với X làm duyên có Y"** — khớp nguyên văn với tiền lệ đã `published` ở `an3.61:15.3`–`15.4` (*với các hành làm duyên có thức / với thức làm duyên có danh sắc*). Đây là chỗ dễ bị dịch vòng vo, và ở đây bản dịch bám đúng tiền lệ.
  
  **Ba thời của thời gian giữ đủ ba, không gộp.** `atīta` / `anāgata` / `paccuppanna` → *đã qua / sắp tới / hiện tại* ở cả câu hỏi `1.2` và câu trả lời `1.3`, và `1.3` còn giữ chuỗi `ca` ba lần. Đây là điểm hay và cần nói ra, vì `paccuppanna` (hiện tại) dễ bị lẫn với `anāgata`.
  
  **Chuỗi mười mắt xích không thiếu mắt nào.** `jarāmaraṇaṁ` → *già chết* rồi `sokaparidevadukkhadomanassupāyāsā sambhavanti` → *sầu bi khổ ưu não được sinh khởi* ✓ giữ đủ tám thành phần của cụm ghép.
  
  **`Evametassa kevalassa dukkhakkhandhassa addhānassa purimā koṭi`** → *Toàn bộ khối khổ ấy, phần đầu của thời gian, không thể tính được* ✓. `paññāyatī` là "tính ra / suy ra được"; *không thể tính được* giữ đúng nghĩa. `purimā koṭi` (hàng trăm triệu phần đầu) hơi nhạt so với *phần đầu của thời gian* nhưng không sai nghĩa.
  
  **Một điểm nhỏ về nối dấu:** `1.5` kết bằng `”ti.` và `2.1` lại mở `“` mới — đúng, vì `2.1` là lời vua đáp lại (`Kallosi` = "Khéo lắm"). Bản dịch dùng `"Khéo lắm, thưa tôn giả Nāgasenā.”` (bỏ `ti`), còn `mil3.6.5:2.1` cũng vậy — nhất quán trong lô.
  
  **`Vicāravagga` → *Phẩm Khảo Sát*** là đa số (4 tệp: `mil3.3.1`, `.4`, `.9`, `.13`; chỉ `mil3.3.14` dùng *Phẩm Suy Xét*).
  
  **Danh xưng:** `bhante nāgasena` → *thưa tôn giả Nāgasena* ✓ khớp tiền lệ.
