notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên.
  
  **Đây là bài trong lô dịch ngôi hai ĐÚNG quy ước, và tôi dùng nó làm chuẩn đối chiếu cho `ja192`.** `Atha ce patthayasi pavassa devā` → *nếu ngươi muốn thì hãy mưa, các vua trời*. `patthayasi` là ngôi hai (*nếu ngươi muốn*), và `ngươi` đúng là dạng ngôi hai của tầng (`ja113:1.1`, `ud5.6:18.3`, `snp5.5:7.1`). So với `ja192:1.4` dùng *ta* cho `saddahāsi` (cũng ngôi hai), hai bài trong **cùng một lô** đã xử lý hai từ ngôi hai theo hai hệ khác nhau. Đó là cơ sở để tôi coi lỗi của `ja192` là lỗi chủ thể chứ không phải lựa chọn văn phong.
  
  **`devā` → *các vua trời*** ✓ dùng đúng danh từ quen thuộc cho `deva` mà tầng đã dùng nhiều. `Vassati devo` ở `1.1` → *Vua trời mưa xuống* — dùng số ít ở vế trước, số nhiều ở vế sau; Pāli cũng vậy (`devo` … `devā`), nên bản dịch bám Pāli.
  
  **`Channā me kuṭikā sukhā nivātā` → *lều tranh của tôi dỡ chịu, mái đã kín*.** `kuṭikā` = lều; *lều tranh* thêm chữ *tranh* nhưng đúng với nghĩa (lều tranh là lều quen thuộc ở Ấn Độ). `nivātā` = "được che gió" → *mái đã kín* ✓ giữ đúng ý che chở. `sukhā` → *dỡ chịu* ✓.
  
  **`Tassaṁ viharāmi adutiyo` → *Tôi cư trú ở đó, một mình*.** `adutiyo` (không có bạn đồng hành) → *một mình* ✓. `Tassaṁ` (ở chỗ ấy) → *ở đó* ✓ đúng chỗ trả lời cho `kuṭikā` ở vế trước.
  
  **Dấu câu ở `1.4`:** dùng phẩy trước *các vua trời* theo kiểu gọi tên địa chỉ, hợp với tiếng Việt.
  
  **Tầng Anh** có mặt đủ bốn vế và xác nhận `kuṭikā` = *hut*, `nivātā` = *sheltered from the wind*.
  
  **Tên riêng:** Pāli ở `0.4` là `Uttiyattheragāthā`, Sujato ghi *Uttiya (2nd)* — dấu (2nd) là của chính SuttaCentral, không có trong Pāli đã ghim, nên bản dịch bỏ qua là đúng; `1.5` cũng vậy.
