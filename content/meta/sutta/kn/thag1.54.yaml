notes: |-
  Khung bốn khối tiêu đề giữ y hệt các bài thag1 đã có: 0.1 giữ Pāli kèm số,
  0.2 Bộ Một Bài Kinh (258 bài), 0.3 tên phẩm theo thứ tự, 0.4 Kinh Kệ Của Trưởng Lão
  với chữ Lão hoa (89 bài; bốn bài lẻ dùng lão thường). Dòng kết 1.5 giữ HAI dấu lược
  như Pāli (BRIEF_VI3 §10.1, không mở rộng), mở nháy kép ở 1.1 và đóng ở 1.4 y hệt Pāli.
  HAI THỨ ĐÃ CÓ PHẢI DÙNG LẠI. Một: dòng kết 1.5 trùng nguyên văn với thag1.99:1.7, và
  bản Việt đó đã có, nên tôi lấy nguyên văn … Trưởng lão Uttiya …. ; tiêu đề 0.4 Pāli là
  Uttiyattheragāthā, trùng nguyên văn với thag1.99:0.4, nên tôi lấy cả Kinh Kệ Của Trưởng
  Lão Uttiya. Hai: vế 1.1, 1.2 và 1.4 trùng nguyên văn với thag1.51, thag1.52, thag1.53
  (ba bài chung Chaṭṭhavagga, cùng câu kệ mưa và lều tranh). Ba bài kia CHƯA có bản Việt.
  Tôi vì thế dịch một lần và ghi nghĩa ở đây để lát sau dùng lại cho cả ba.
  Vế 1.3 là vế khác nhau: ở đây Tassaṁ viharāmi adutiyo, còn thag1.53 là Tassaṁ viharāmi
  appamatto, nên tôi dịch đúng của mình và không kéo sang bản kia.
  channā kuṭikā không có tiền lệ cho cả hai chữ, tôi dịch lều tranh. Chữa: kuṭikā là cái
  lều nhỏ và channā là vật liệu lợp mái, nên lều tranh gộp được cả hai. nivātā dịch mái
  đã kín. adutiyo dịch một mình; tầng có ba chỗ một mình cho ý này. devo và devā dịch vua
  trời theo ud3.7:3.4 Sakka, vua trời. vassati dịch mưa xuống. sugītaṁ dịch lời hát
  ngọt. pavassa là mệnh lệnh mưa, tôi dịch hãy mưa.
  Sujato ghi tiêu đề là Uttiya (2nd), tức có trùng thứ tự với thag1.53; tôi không theo vì
  Pāli ở 0.4 không có chữ (2nd).

  Kỹ thuật: 9/9 khoá, không rỗng, thứ tự khớp Pāli, NFC, số dấu lược bằng Pāli từng
  khoá, nháy kép cân trên cả bài, không còn (…). save_vi sạch, chạy lại hai lần
  idempotent. Vì mọi khoá Pāli của Trưởng Lão ngắn hơn 40 ký tự nên cần trong kiểm()
  rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá bằng script riêng. Không
  chạy npm run validate|test|check|build (lát này cấm) nên technical_integrity 9.5.
  Tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên không có bản Hòa thượng
  Thích Minh Châu cho Trưởng Lão; bản Anh Sujato có mặt và tôi đã đọc ở tất cả tám bài
  này. Ô English trống ở dòng kết không phải sự đồng thuận, mà là chỗ Pāli phải tự đứng
  vững.
