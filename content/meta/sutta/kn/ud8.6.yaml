notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud8.6:29.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud8.6:29.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Rà nhất quán theo Pāli trùng 2026-10-14 (đối chiếu dn16): khoá 14.2 — «các ngươi hãy tùy thời» →
  dùng lại nguyên văn công thức dn16:1.25.2 «các ông hãy tùy thời mà làm điều các ông thấy nên làm»
  (Đức Phật nói với gia chủ; «các ông» 1.105 chỗ so với «các ngươi» 219 chỗ toàn tầng); khoá 18.4 —
  thêm «của chúng tôi» (`no` trong `adhivāsetu no … bhattaṁ`, bản trước bỏ sót); khoá 21.2 — bổ sung
  vế `ekamantaṁ nisinne kho sunidhavassakāre magadhamahāmatte` («đã ngồi xuống một bên») bị bỏ sót,
  và «tùy hỷ với các bài kệ» → «tùy hỷ bằng các bài kệ» (`anumodi imāhi gāthāhi`); khoá 15.1, 17.2
  (và 17.4 cùng bài) — «dòng Vajjī» → «người Vajji» (toàn tầng «người Vajji» 87 chỗ, «dòng Vajjī»
  chỉ 3); khoá 17.9 — «vùng đất của bậc Thánh» → «xứ của người Ariya» (`ariyaṁ āyatanaṁ` chỉ vùng
  của người Ariya, không phải bậc Thánh; dùng lại dn16:1.28.7). Giữ nguyên các khoá 4.1, 4.3, 5.1,
  6.1, 7.1, 8.1, 8.3, 9.1, 9.3, 10.1, 11.1, 12.1, 13.1, 13.3, 17.3, 18.1, 20.1, 20.2, 21.1, 26.1,
  26.2, 26.3, 27.1, 27.3, 27.4, 28.1 vì khác dn16 chỉ ở cách ghép tên hai đại thần, «phá giới/phá
  giới hạnh» so với «thiếu giới/phá giới», «giữ giới» so với «có giới», «Ba Mươi Ba» so với «Tam
  Thập Tam»; cả hai cách đều đúng Pāli và ud8.6 tự nhất quán trong bài (các công thức giới cùng
  một cách dịch).

  Quyết định hội đồng biên tập 2026-10-16: B4 — ud8.6:4.1, ud8.6:4.4, ud8.6:5.2, ud8.6:6.2, ud8.6:7.2, ud8.6:8.2, ud8.6:8.3 (`sīlavipatti` = thất bại về giới (cặp với `sampadā` = thành tựu), không lặp “phá giới” của `dussīla`).
