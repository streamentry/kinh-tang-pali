  Phạm vi: đủ 89/89 khoá của bài (4 khoá `:0` tiêu đề, 84 khoá kệ `1.1`–`21.4`, `21.5` dòng bìa), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã đọc đối chiếu cả 89 cặp Pāli↔Việt, không đọc mẫu. Đây là bài kệ thứ hai của Trưởng lão Adhimutta (bài kệ thứ nhất là `thag1.114`; Pāli tiêu đề `0.4` của hai bài trùng nhau nên bản Việt `0.4` dùng cùng một chuỗi).

