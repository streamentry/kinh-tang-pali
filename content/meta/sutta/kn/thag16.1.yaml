  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá), nên đối chiếu được ở mức khoá. Cấu trúc lời nói: `1.1`–`2.4` bọn cướp (qua lời thủ lĩnh) hỏi vị trưởng lão; `3.1`–`15.4` trưởng lão đáp; `16.1`–`16.4` người kể; `17.1`–`17.4` bọn thanh niên hỏi; `18.1`–`19.4` trưởng lão đáp; `20.1`–`21.4` người kể. Chỉ có hai chỗ nháy đơn lồng trong lời nói (`11.1`, `11.2`, `13.4`). Bốn đoạn lời nói mở bằng nháy kép và đóng bằng nháy kép đúng ở khoá Pāli đóng (`2.4`, `15.4`, `17.4`, `19.4`); `21.4` kết `asaṅkhatanti.` không mở nháy nào nên bản Việt không đóng nháy.

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 89 = Pāli 89, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
    2. Nháy đơn và kép khớp Pāli từng khoá: 0/89 lệch. Tổng: `“` 4/4, `”` 4/4, `‘` 3/3, `’` 3/3 (Pāli/Việt).
    3. Pāli trùng nguyên văn TRONG CHÍNH bài: 3 nhóm (`5.1`=`6.1`, `5.2`=`6.2`, `17.4`=`19.4`). Hai nhóm đầu bản Việt giống nhau từng chữ. Nhóm `17.4`/`19.4` bản Việt khác đúng một dấu: `17.4` kết `?”` (câu hỏi của bọn thanh niên), `19.4` kết `.”` (câu đáp của trưởng lão), cùng nội dung chữ; Pāli đều kết `”.` vì dấu hỏi không có trong Pāli. Pāli trùng ở bài khác: 15 khoá có tiền lệ, 165 cặp, 131 cặp bản Việt trùng với bản này (sau khi bỏ dấu câu và hoa thường), 34 cặp khác. Phân xử 34 cặp khác: 13 cặp ở `0.3` `Paṭhamavagga` (11 bài thag đặt tên trưởng lão ở `0.3`, 2 bài ghi thêm số thứ tự đầu dòng; bản này theo Pāli và khuôn `thag14.2`, `thag15.2`: `0.3` là tên phẩm); 1 cặp `5.3` `Maraṇe me bhayaṁ natthi` (`thag1.20:1.1` dịch Cái chết không làm ta sợ: bản này dùng cùng khuôn nhưng đổi xưng hô ta thành tôi, vì trong cả bộ thag đã dịch `tôi` 283 lần so với `ta` 238 lần và bài kề `thag15.2` dùng tôi; lời nói ở bài này là của một vị tỳ-kheo đối thoại với kẻ cướp); 4 cặp `7.2` `katakicco anāsavo` (`thag11.1:12.2` trùng đúng chữ; 4 cặp ở `an3.57`, `an4.35`, `an5.179`, `thag10.2:5.4` bỏ chữ còn, đổi vế đầu hoặc dịch khác vế sau: theo `thag11.1`, cùng thể kệ và cùng bộ); 1 cặp `9.4` `iti vuttaṁ mahesinā` (`sn15.10:4.4` dịch Đại Tiên: theo `thag1.120:3.4` dịch mahesi là Đại Ẩn Sĩ, cùng bộ); 3 cặp `10.2` `yathā buddhena desitaṁ` (`snp5.18:7.2` và `cnd3:7.2` kèm cụm từng câu hỏi nên khác ngữ cảnh; `thag14.1:3.4` dịch đã thuyết giảng; theo `an4.25:3.2`, `iti35:4.4`, `iti36:4.4` là Đức Phật đã dạy, 3 khoá, so 1 khoá đã thuyết giảng ở bộ thag, chọn cách có nhiều khoá hơn); 3 cặp `13.2` `yadā paññāya passati` (`thag15.1:4.2`, `5.2`, `6.2` dịch khi dùng trí tuệ thấy điều ấy, trong đó chữ điều ấy là của câu kệ kề bên không có ở đây; theo `thag15.1:3.4` dịch khi dùng trí tuệ mà thấy, khoá có đúng cùng Pāli ở kệ không có bổ ngữ); 1 cặp `14.2` `bhavenamhi anatthiko` (`thag2.1:2.2` dịch không mong muốn sự tồn tại, từ bỏ mọi sở thích: câu ấy gộp hai vế Pāli khác nhau trong cùng bài, không sánh trực tiếp được; bản này dịch sát từng chữ, không còn cần đến hữu); 5 cặp `16.1` `Tassa taṁ vacanaṁ sutvā` (4 khoá `snp5.1:9.3`, `cp11:4.1`, `cp19:4.1`, `cp22:11.3` dịch Nghe lời nói ấy, bỏ chữ tassa; 1 khoá `ja454:2.1` dịch Nghe lời nói ấy của người ấy: theo `ja454`, vì Pāli có `tassa` và ở đây lời nói là của vị trưởng lão cần được gọi rõ); 2 cặp `16.2` `abbhutaṁ lomahaṁsanaṁ` (`tha-ap113:6.2`, `tha-ap125:4.2` dịch kèm chữ khủng bố và kinh hãi, thêm sắc thái so với Pāli; theo đa số đáng kinh ngạc, rợn da gà ở `pv35:9.2`, `tha-ap62:4.2`, `tha-ap123:6.2`, `tha-ap160:4.2`, 4 khoá trở lên); 1 cặp `18.4` `sabbalokatikicchako` (`tha-ap283:2.2` dịch bậc đại y vương chữa lành muôn loài, có chữ đại và vương không có trong Pāli; bản này giữ thầy thuốc chữa lành cho cả thế gian). Cộng 13 + 1 + 4 + 1 + 3 + 3 + 1 + 5 + 2 + 1 = 34, khớp.
    4. Dấu lược: Pāli có `…` ở 1 khoá (`21.5`, hai dấu lược), Việt có đúng khoá đó với hai dấu; `…pe…` 0; `(…)` trần 0 ở Pāli nên 0 ở Việt. Lỗi = 0/89. Khoá bìa `21.5` kết ` ….` (lược rồi mới chấm), đúng dạng đa số của tầng (398/760 khoá Pāli kết `….`) và đúng `thag1.114:1.5`.
    5. Số Pāli (tự tính): trong thân kệ không có từ chỉ số lượng; số duy nhất là `Vīsatinipāta` (`0.2`): vīsati = 20, nipāta = bộ ⇒ Bộ Hai Mươi Bài Kinh, theo khuôn thag đã dịch (`Dukanipāta` ⇒ Bộ Hai Bài Kinh, `Soḷasakanipāta` ⇒ Bộ Mười Sáu Bài Kinh ở `thag15.2:0.2`); Sujato dịch The Book of the Twenties. Phép hiệu chuẩn nội bộ: Dukanipāta 2, Soḷasa 16, Vīsati 20, nhất quán một cách đọc.
    Vệ sinh: JSON hợp lệ, 89/89 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa, 0 khoá Pāli lọt sang Việt ngoài tên riêng (`Theragāthā`, `Adhimutta`).

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `gāmaṇi` (vocative, `3.2`, `12.4`) → này thôn trưởng: đo toàn tầng, 265 chỗ dịch thôn trưởng trong các khoá chứa `gāmaṇi` (sn42, 253 khoá, và 1 khoá sn44 là danh sách tên), 0 chỗ dịch khác; Sujato dịch village chief. Không dịch thủ lĩnh để khỏi suy diễn vai nhân vật.
    · `āghātana` (`7.4`) → nơi hành quyết (Sujato execution). `ayoguḷa` (`10.4`) → viên sắt, theo `dn23:17.3`; `sutatta` → nung nóng. `ādittāva gharā mutto` → như người thoát khỏi căn nhà đang cháy.
    · `assāda` → vị ngọt (181 khoá trên 327 khoá chứa `assād`; `thỏa mãn` 2, `vui thích` 4; số còn lại dịch cách khác); `nirassāda` (`6.3`) → không có vị ngọt, không có tiền lệ trực tiếp cho dạng phủ định này, theo gốc.
    · `bhava` → hữu (`4.1` dây dẫn đến hữu theo `thag15.1:15.4`, `thag14.1:12.4`, `thag2.8:1.4`; `6.3`, `9.2`, `10.3`, `14.2`).
    · `saṅkhārā` → các hành. `dhammasamuppāda` (`12.1`) → sự sinh khởi của các pháp. `saṅkhārasantati` (`12.2`) → dòng nối tiếp của các hành; `santati` không có tiền lệ trực tiếp trong thân kinh, tầng chỉ có `ne18:5.1` dịch liên tục.
    · `māṇava` → thanh niên (390 khoá, so thiếu niên 61, dạng khác 135), theo đa số.
    · `subhāsita` → lời khéo nói (59 khoá, so lời hay 4, lời thiện 1, lời nói tốt 1), theo `dn21:1.12.20`.
    · `jina` (`18.2`) → bậc Chiến Thắng (36 khoá, dạng khác 2). `sabbaññū sabbadassāvī` → toàn tri, toàn kiến (`ja479:12.4`, `sabbaññū` toàn tri 31 khoá so biết tất cả 7). `mahākāruṇika` → có lòng đại bi. `tikicchaka` → thầy thuốc chữa lành.
    · `satthāni` → đao kiếm, `āvudha` → khí giới (`mn86:6.14` asimāvudhañca dịch kiếm và khí giới). Tách hai chữ vì `20.2` đặt `satthāni ca āvudhāni ca` cạnh nhau.
    · `sāsana`: dạng vị trí cách (`sugatassa sāsane`, `21.1`) → giáo pháp của bậc Thiện Thệ (5 khoá trùng đúng chữ: `iti84:7.4`, `iti98:6.2`, `iti98:6.4`, `pv32:10.2`, `pv33:11.2`); dạng đối cách (`kassa sāsanamāgamma`, `tassa sāsanamāgamma`, `17.3`, `19.3`) → lời dạy (ở bộ thag: lời dạy của Đức Phật cho `kataṁ buddhassa sāsanaṁ` 20 khoá trở lên; giáo pháp cho cách vị trí `sāsane` 6 khoá, lời dạy 1 khoá). Quy ước theo cách của chữ, không theo ý đồ riêng.
    · `bhadante` (`17.1`) → thưa tôn giả. Đo toàn tầng 128 khoá chứa `bhadante`: bạch (Thế Tôn) 115, thưa ngài 12, dạng khác 1; mọi chỗ ấy là tỳ-kheo nói với Đức Thế Tôn. Ở đây người nói là bọn thanh niên thế tục nói với một vị tỳ-kheo, nên không dùng bạch; chọn thưa tôn giả, không có tiền lệ trực tiếp cho cặp người nói và người nghe này.
    · `asokatā` → sự không sầu muộn; `socati` → sầu muộn (82 khoá sầu so buồn 5). `udaggacitta sumana` (`21.3`) → tâm phấn khởi, hoan hỷ, theo `snp5.1:53.3` và `snp3.11:11.4`. `asaṅkhata` → vô vi (158 khoá).
    · `Vīsatinipāta` → Bộ Hai Mươi Bài Kinh. `Paṭhamavagga` → Phẩm Thứ Nhất. `0.4` theo khuôn Kinh Kệ Của Trưởng Lão X, đúng `thag1.114:0.4`.

  KHÁC BIỆT ĐÃ PHÂN XỬ (đối chiếu Sujato).
    (1) `1.3` `Avasesaṁ bhayaṁ hoti`: xem bất định.
    (2) `3.2` `anapekkhassa`: Sujato dịch without concern; bản Việt dịch không còn luyến tiếc theo tiền lệ `dn25:13.16`, `sn3.10:5.4`, `ja411:7.4`.
    (3) `4.1`–`4.4`: Sujato nối `bhāranikkhepane yathā` thành it's like laying down a burden; bản Việt giữ như khi đặt gánh nặng xuống. `yathātathe` (`4.2`) và `yathābhūtaṁ` (`12.3`) cùng dịch đúng như thật, vì Pāli dùng hai chữ khác nhau cho cùng ý (Sujato dịch as it is và truly).
    (4) `6.4` `visaṁ pitvāva chaḍḍitaṁ`: Sujato dịch someone who has tasted poison, then thrown it out, thêm chủ ngữ someone; bản Việt giữ chất độc, đã uống rồi nhả bỏ như Pāli, không thêm người.
    (5) `8.1` `uttamaṁ dhammataṁ patto`: Sujato dịch the supreme Dhamma; bản Việt dịch pháp tính tối thượng, bám `dhammatā` hơn là Dhamma, xem bất định.
    (6) `9.1`–`9.3`: Sujato dịch whatever has come to pass và there is no Lord of all that; bản Việt dịch hợp thành và không có ai làm chủ, xem bất định.
    (7) `11.1`–`11.2`: Sujato dịch It doesn't occur to me; bản Việt dịch Tôi không có ý nghĩ, giữ hai nháy đơn đúng Pāli `‘ahosin’ti`, `‘bhavissan’ti`.
    (8) `13.1` `tiṇakaṭṭhasamaṁ lokaṁ`: Sujato dịch The world is like grass and sticks; bản Việt giữ thế gian như cỏ và củi.
    (9) `15.3`–`15.4` `doso pemañca hehiti`: Sujato dịch I won't be angry or attached; bản Việt dịch sân hận cũng không có thương mến, giữ `pema` là thương mến (affection) chứ không dịch bám víu.
    (10) `20.3` `tamhā kammā`: Sujato dịch their former deeds; bản Việt dịch việc làm ấy, không thêm chữ trước kia.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `1.3` `Avasesaṁ bhayaṁ hoti`: `avasesa` là phần còn lại. Có thể đọc (a) trạng từ: không sót ai, tất cả đều sợ hãi (Sujato without exception), hoặc (b) chủ ngữ: nỗi sợ còn lại nơi họ. Tôi theo (a) và viết tất cả, không sót ai, đều sợ hãi; nếu (b) đúng thì câu thành nỗi sợ vẫn còn nơi họ, chỉ đổi ý ở một khoá. Tầng không có tiền lệ cho cụm này.
    · `8.1` `dhammataṁ`: `dhammatā` là bản tính của pháp, trạng thái tự nhiên của Pháp. Dịch pháp tính tối thượng giữ chữ bản tính; Sujato dịch the supreme Dhamma (Pháp tối thượng). Tầng không có tiền lệ `dhammatā` trong nghĩa này.
    · `9.1` `saṅgataṁ`: có thể là hợp thành (do nhiều yếu tố hợp lại, gần `saṅkhata`) hoặc nghĩa gần hơn là điều đã đến, đã xảy ra (Sujato come to pass). Tôi dịch do hợp thành; chưa phân xử trọn vẹn. Tầng không có tiền lệ cho dạng này.
    · `9.3` `anissaraṁ`: không có ai làm chủ, hoặc không ai điều khiển được (nằm ngoài sự kiểm soát). Cách dịch giữ cả hai cách hiểu (Sujato there is no Lord).
    · `13.4` `natthi me`: có thể là tôi không có (một thứ gì đó) hoặc không có cái gì là của tôi. Theo Sujato I don't have it; chữ `mamatta` ở `13.3` đã nói đến sự cho là của ta, nên nghĩa gần nhau.
    · `14.4` `añño ca na bhavissati`: Pāli chỉ nói `añño` (cái khác), không nêu danh từ; bản Việt thêm chữ thân vì khoá `14.3` đã nói thân này, Sujato dịch another. Nếu người biên tập muốn giữ trần chữ khác thì sửa một khoá.
    · `7.3` `tuṭṭho`: mãn nguyện; có thể là hài lòng, vui mừng. Đo toàn tầng: vui mừng 4 khoá, hài lòng 1 khoá, dạng khác 12; chọn mãn nguyện cho nghĩa content (Sujato), không có tiền lệ trực tiếp.
    · `21.2` `bojjhaṅgabalāni`: hợp từ `bojjhaṅga` và `bala`. Tôi đọc hai thành tố đứng cạnh nhau (các giác chi và các lực), như Sujato; cách đọc khác là lực của các giác chi (hợp từ phụ thuộc). Chưa phân xử.
    · `21.3` `katindriyā`: `kata` (đã làm) + `indriya`; tôi dịch các căn đã hoàn thiện, như Sujato; cách đọc khác là đã làm xong việc nơi các căn, hoặc các căn được thúc liễm. Tầng không có tiền lệ `katindriya`.
