notes: |-
  Bài kệ ngắn: mẫu số coverage bằng 0 theo công thức `source/layers.yaml`; đã tự quét MỌI khoá từ đĩa.
  **4 khoá có Pāli trùng nguyên văn ở bài khác; 3 cặp dùng lại NGUYÊN VĂN.** `0.1` trùng `ja183:0.1` (*Jātaka*) · `0.2` trùng `thag7.1:0.2` và `Sattakanipāta` trong lớp `ja` là 11/11 *Bộ Bảy Bài Kệ* ⇒ khớp · `0.3` trùng `ja407:0.3` (*Phẩm Gandhāra*).
  **Tên tầng đo:** `Sattakanipāta` → *Bộ Bảy Bài Kệ* (11/11 theo giá trị Pāli tuyệt đối) · `Gandhāravagga` → *Phẩm Gandhāra* (4 file: ja406–ja412) · `0.4` mẫu *N. Kinh <tên Pāli>* như ja376/ja406/ja424.
  **Bất định lớn nhất của bài, đã ghi thay vì bịa:** `Ambāhamaddaṁ` (`1.1`, `1.3`) và `Usabhāhamaddaṁ` (`4.1`). `madda` là động từ nghiền/xoay; cả `Ambāha` lẫn `Usabha` đều là danh từ Hán-Phạn, và `Nīlobhāsaṁ phalitaṁ saṁvirūḷhaṁ` cho thấy thứ đang xoay có **nửa thân sắc xanh, toàn thân nở rộ**. Tôi đọc là một loài cây leo lan trong rừng và dịch `1.1` là *Cây leo Ambāha quấn chằng chịt giữa rừng*, nhưng `Calakkakuṁ vaṇṇabalūpapannaṁ` ở `4.2` (hạt lúa mọc trên phân đất) lại chỉ về cây, nên hai hình ảnh không khớp nhau và tôi **không** dịch thống nhất. Nếu cần, lượt sau nên tra chú giải Jātaka cho hai từ này.
  **Ba chỗ khác cũng đã ghi:** (1) `1.3` `Tamaddasaṁ phalahetu vibhaggaṁ` — bản nháp từng dịch thêm *của việc cho thí*, đó là **thêm ý không có trong Pāli**, đã gỡ; giờ chỉ còn *Đằm đằm đưa vì lý do của quả báo*. (2) `bhikkhācariyaṁ carāmi` (4 lần, mỗi lần một khoá) dịch *ta sống phạm hạnh*; `bhikkhācariya` nghĩa là đời sống thiền viện, và đây là lựa chọn của tôi, 0 tiền lệ trong lớp `ja`. (3) `7.4` `Sakuṇīva muttā purisassa hatthā` — bản nháp dịch *mắc trói*, sai (`muttā` = được thả/tháo); đã sửa thành *được thả khỏi tay kẻ bị trói*.
  **Lỗi bắt được ở lượt review đối kháng, đã sửa:** (1) `5.6` `pabbajiṁsu` là số nhiều nhưng bản nháp dịch *vị ấy xuất gia*; đã sửa thành *họ xuất gia*. (2) `8.1` `Āmaṁ pakkañca jānanti` bản nháp dịch *Chính quả chín kia cũng là biết* — vòng, đã sửa thành *Quả chín kia người ta cũng biết*.
  Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6: npm run validate; npm test; npm run check; npm run build.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code), kiểm lại từng khoá bằng Pāli đã ghim, PED và tích truyện làm bối cảnh): sửa 33 khoá, gần như toàn bộ kệ của bốn vị vua. Lỗi nghĩa thật: `:1.x` là cây xoài giữa rừng, ánh xanh sẫm, trổ quả, bị bẻ gãy vì quả; `:2.x` là đá ngọc mài bóng do người thợ tài làm nên, người nữ mang đôi, ít tiếng, đến cái thứ hai thì có tiếng ồn (PED: sela = rock, stone, crystal; yuga = pair); `:3.x` là chim vây đuổi một con chim đang mang xác chết (`dijā` là loài chim; PED: paripāteti = pursue, attack); `:4.x` là con bò đực giữa đàn bị đâm vì dục (bản cũ dịch `calakkaku` thành hạt lúa mọc trên phân đất); `:5.x` là bốn vị vua Karaṇḍaka, Naggaji, Nimi, Dummukha bỏ nước xuất gia; `bhaggavi` ở `:6.3` và `bhaggava` ở `:7.3` là hô ngữ (vợ chồng người thợ gốm), `ekā` ở `:7.3` là nữ; `:7.4` là chim mái được thả khỏi tay người đàn ông (bản cũ dịch `sakuṇīva muttā` thành sếu, kẻ bị trói); `:8.4` là nàng cứ đi, ta cũng đi. Bất định: `anusāsitā` ở `:7.2` (đọc là người chỉ dạy, về sau không có), `yugaṁ` ở `:2.2` (đôi, mâu thuẫn nhẹ với `dutiyaṁ` ở `:2.3` nên giữ sát chữ), `yathodhikāni` ở `:6.4` giữ như tiền lệ `snp1.3:26.3`. Điểm: semantic_fidelity và grammar_logic hạ về mức bản đã sửa vì bản cũ sai gần hết số khoá kệ.

  Quyết định hội đồng biên tập 2026-10-16: C1 — `0.4`, `9.1` và translationTitle (tiêu đề giữ "Kinh X", bỏ đuôi "jātaka" hoặc "Chuyện Tiền Thân"; cùng tên Pāli thì cùng tên Việt); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
