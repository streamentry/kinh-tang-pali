notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất 32 ký tự nên `cần` rỗng và các
  assertion của `kiểm()` không chạy lần nào. Tôi tự quét 9/9 khoá: đủ, đúng ID, không rỗng,
  NFC, dấu lược khớp (1.5 giữ đúng hai dấu lược trần của Pāli theo BRIEF_VI3 §10.1), nháy
  kép mở 1.1 đóng 1.4 nên cân, không còn (…) rỗng.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 1.5 (dòng … Tên thero …, Sujato
  để trống ở MỌI bài Trưởng Lão). Không có bản Việt hiện hành cho Trưởng Lão.

  KHUON TIEU DE: Theragāthā 1.28 (giữ Pāli kèm số, 96 lượt), Bộ Một Bài Kinh, Phẩm Thứ Ba
  (30 lượt ngoài lát), Kinh Kệ Của Trưởng Lão <tên> (106 lượt), dòng kết … Trưởng lão <tên> ….
  Tên riêng Jambugāmikaputta giữ dạng Pāli, không bịa tên Việt.

  KHOA 1.4 LA CHOI BAI, VA TÔI GHI RA THAY VI GIAI THICH TRONG THAN KINH. Pāli là Kiṁ tvaṁ
  vāyasi netarā pajā. Tôi dịc *sao ngươi ngửi thấy mà không đem ra?*: `vāyasi` là “ngươi ngửi /
  hít”, `Kiṁ` là câu hỏi tại sao, và `netarā pajā` tôi đọc là “không đem ra”. Nhưng `netarā`
  không tách được chắc chắn (có thể là `na-etarā`, hoặc `ne-tarā`), và `pajā` có thể là
  “sinh ra / toả ra” thay vì “đem ra”. Đây là chỗ dễ sai nhất của bài, nên semantic_fidelity và
  ambiguity_integrity tôi chấm thấp và ghi ở đây cho biên tập. Cách đọc khác là câu hỏi về hành
  động của người nghe (“ngươi đã ngửi thấy rồi đừng làm gì nữa”), không có bản Anh nào để quyết.

  THUAT NGUM. `vattha` → *y phục* theo tiền lệ (iti83:2.2 y phục dơ, iti82:2.3 mặc y vàng), và
  `pasuto` → *chuyên tâm* / *đắm say* theo tiền lệ (chuyên tâm 119 lượt, đắm say 29 lượt;
  snp3.11:31.1 chuyên tâm vào thiền định). `sīlamayaṁ` → *mùi giới hạnh* theo tiền lệ
  (iti60:2.3 sīlamayaṁ puññakiriyavatthu → cơ sở tạo phước do giới hạnh); `gandha` là mùi.
  `bhūsananārata` (0 lượt) → *đắm say trang sức* vì `bhūsana` là đồ trang sức và `nārata` là
  ham mê.

  `Kacci no` lặp ba lần và tôi dịc *Có kẻ…* cho cả ba chứ không dịch thành câu hỏi, vì `no` ở
  cuối 1.1 và 1.2 là tiểu từ nhấn và câu hỏi thật nằm ở khoa 1.4; giữ nhịp liệt kê rõ hơn là đặt
  dấu hỏi vào từng vế.
