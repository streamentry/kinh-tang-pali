  - `abhibhuyya` (18.3) → “vượt … mà làm chủ”: tầng 143 khoá chứa `abhibhuy…` với nhiều nghĩa (chế ngự, vượt qua, chinh phục); ở đây là vua đứng trên năm bậc hiền trí nên chọn “vượt chúng tôi”.
  - `sāhasā` (8.2) → “dùng bạo lực”: `thag16.2:18.4` “bằng bạo lực”, `snp4.15:9.4` “hành động thô bạo”.
