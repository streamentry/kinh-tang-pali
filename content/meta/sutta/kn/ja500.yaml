notes: |-
  Đợt 19, làn 86. Dịch từ Pāli root commit đã ghim, đủ 121/121 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; vì vậy người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung kệ và từ điệp khúc (xem BẤT ĐỊNH, mục 1). Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề và colophon.**
  - `0.2` “Bộ Hai Mươi Bài Kinh” (`Vīsatinipāta`, vīsati = 20): dùng lại nguyên văn `thag16.2:0.2` (“Bộ Hai Mươi Bài Kinh”, cùng Pāli) và cùng khuôn với các bài cùng bộ (`ja497`, `ja498`, `ja502`, `ja504`, `ja508`, `ja509`, `ja510`).
  - `0.3` “Phẩm Mātaṅga”: dùng lại nguyên văn `ja509:0.3` (cùng Pāli).
  - `0.4` “4. Kinh Sirīmanta”: giữ phiên âm tên bài, theo khuôn “Kinh <tên>” của `ja498` (Cittasambhūta), `ja504` (Bhallātiya), `ja509` (Hatthipāla). `sirīmanta` có thể là danh từ chung (“người có sirī”) hoặc tên riêng; tầng Pāli đã ghim không có văn xuôi nên không phân xử được, vì vậy không dịch nghĩa vào tên. Số `4.` ở `0.4` khớp `catutthaṁ` ở `22.1` (thứ tư). `22.1` “Kinh Sirīmanta, thứ tư.” có dấu phẩy trước số thứ tự, theo `ja502:27.1`, `ja504:26.1`, `ja509:27.1`.

  **Tiền lệ dùng lại nguyên văn: đã dò 121 khoá với Pāli toàn tầng (sau khi bỏ dấu câu và hạ chữ hoa, từ 12 ký tự trở lên): 10 khoá có Pāli trùng ở bài khác (`0.2`, `0.3`, `8.1`, `17.1`, `17.3`, `17.4`, `21.1`, `21.3`, `21.4`, `21.5`); 6 trong 10 có bản Việt để dùng lại (`0.2`, `0.3`, `8.1`, `21.3`, `21.4`, `21.5`), cộng `21.6` gần trùng với `ja441:14.4` (chỉ khác `soḷasa` / `soḷasā”ti`). Cả 6 + 1 đều đã dùng lại nguyên văn: `8.1` theo `ja404:4.1` (“Không phải điều tốt, kẻ mạnh mà ngu dốt”); `21.3`–`21.5` theo `ja441:14.1`, `14.2`, `11.3`/`14.3` (“một ngàn con bò, một con bò đực và một con voi”, “cùng mười cỗ xe thắng ngựa thuần chủng này”, “vui mừng vì lời giải đáp câu hỏi”); `21.6` theo `ja441:14.4` (“tôi tặng ngài mười sáu làng thượng hạng”). Còn khác ở đâu: 1 khoá (`21.3`) chỉ khác chữ hoa đầu câu (“Một” → “một”) vì ở đây khoá nằm giữa câu; 0 cặp khác nghĩa. 4 khoá trùng không có bản Việt để so (`17.1`, `17.3`, `17.4` trùng `ja520:9.1`, `9.3`, `9.4`; `21.1` trùng `mnd11`, `cnd8`; cả hai chưa dịch): phép này chạy rỗng về phía bản Việt cho 4 khoá đó, không tuyên bố “0 lỗi” cho chúng; khi `ja520` được dịch cần đối chiếu `17.1`, `17.3`, `17.4` (“như rắn bỏ lớp da già”, “thịnh vượng rời bỏ kẻ ngu si ấy”).

  **Trùng nguyên văn trong chính bài:** 121 khoá, 6 nhóm Pāli trùng (sau khi bỏ dấu câu): `1.4`=`3.4` (“Kamettha seyyo kusalā vadanti”, giống hệt); 16 khoá lời dẫn `2.5`, `4.5`, `5.5`, `6.5`, `7.5`, `8.5`, `9.5`, `11.3`, `12.5`, `13.5`, `14.5`, `15.5`, `16.5`, `17.5`, `18.5`, `19.5` (“Etampi disvāna ahaṁ vadāmi”, giống hệt, “Thấy cả điều này, tôi nói:”); 8 khoá điệp khúc của Senaka (`2.6`, `5.6`, `7.6`, `9.6`, `12.6`, `14.6`, `16.6`, `18.6`, giống hệt); 8 khoá điệp khúc của Mahosadha (`4.6`, `6.6`, `8.6`, `11.4`, `13.6`, `15.6`, `17.6`, `19.6`: 7 giống hệt, `19.6` khác ở dấu câu cuối vì Pāli kết bằng dấu chấm không đóng nháy, trong khi `20.4` đóng nháy); `13.1`=`15.1` (giống hệt); `11.2`=`20.4` (khác chỉ ở dấu câu cuối: `;` và `”.`, đúng như Pāli). Tổng: 6 nhóm / 32 cặp, 0 cặp khác nghĩa, 2 nhóm khác chỉ dấu câu.

  **Số Pāli:** không có phép tính nào. `catutthaṁ` (22.1) = 4, khớp `4.` ở `0.4`. `pañca` (18.1) = 5 (“năm bậc hiền trí”; Pāli ở 18.1 không nêu tên). `sahassa` (21.3) = 1.000, `dasa` (21.4) = 10, `soḷasa` (21.6) = 16, theo `ja441:14` cùng ba số, cùng cấu tạo. `vīsati` (0.2) = 20.

  **Cách đọc cấu trúc kệ (người nói, suy từ nội dung).** Điệp khúc `Pañño nihīno sirīmāva seyyo` đứng cuối các khổ 2, 5, 7, 9, 12, 14, 16, 18; điệp khúc `Paññova seyyo na yasassi bālo` đứng cuối các khổ 4, 6, 8, 11, 13, 15, 17, 19. Hai điệp khúc đối nhau nên được đọc là hai người nói: Senaka (chủ trương thịnh vượng hơn) và Mahosadha (chủ trương trí tuệ hơn); khổ 1 là câu hỏi của vua với Senaka (“pucchāmi taṁ senaka”), khổ 3 là câu hỏi với Mahosadha (“Mahosadha …”), khổ 21 là lời vua ban thưởng cho Mahosadha. Đây là suy luận từ điệp khúc và vocative, không đưa vào thân kinh; bản Việt chỉ dùng “tôi” ở lời vua và lời mỗi người nói.

  **Thuật ngữ và tiền lệ đã đo (không ghi tên script):**
  - `yasassī` / `yasassi` (1.2, 2.4, 3.3, 4.6, … 19.1, 19.6): “danh tiếng”. Tầng có 161 khoá chứa `yasass…`: “danh tiếng” 81, “danh vọng” 22, “vinh quang” 3, “uy danh” 1; chọn dạng đa số.
  - `sirī` (1.1, 2.6, … 20.4): “thịnh vượng”. Tầng chỉ có 8 khoá chứa `sirī` dạng đứng riêng: `ja382:17.4` “sự thịnh vượng đáng ưa” (cùng cụm `kantā sirī`), `ja420:7.1` “thịnh đại lẫn phúc lành”, `sn1.79:2.2` “vinh quang”, và 3 khoá giữ nguyên `Sirī` là tên riêng; ở đây `sirī` là khái niệm đối lập với `paññā` xuyên suốt bài, nên giữ một chữ nhất quán ở cả 18 khoá chứa `sirī` / `siriyā` / `sirīmā` trong bài. `sirīmā` → “người có thịnh vượng”; `siriyā vihīna` → “thiếu thịnh vượng”.
  - `bāla` → “kẻ ngu”: 207 khoá, “kẻ ngu” 151, “người ngu” 13. `dummedha` (8.3, 17.2, 17.3) → “ngu si”: 53 khoá; “ngu si” 11, “ngu dốt” 11, “ngu muội” 5, “ngu dại” 3, “kém trí” 2, “bất trí” 1; chọn “ngu si” vì “ngu dốt” đã dùng lại nguyên văn cho `balavā bālo` (`8.1`, theo `ja404:4.1`) và cần tách `bāla` khỏi `dummedha`. `appapañña` (6.1, 13.2) → “kẻ kém trí”: cùng cách với `ja382:17.4` (`majjati appapañño` → “kẻ kém trí say sưa”, cùng cụm với `6.1`).
  - `paṇḍita` → “bậc hiền trí” (3.3, 18.1, 19.3): 639 khoá, “bậc trí” 214, “hiền trí” 82; chọn “hiền trí” theo `ja508` (cùng phẩm, `Pañcapaṇḍitajātaka` → “Kinh Năm Bậc Hiền Trí”) vì cùng cụm “năm bậc … trí” của cùng bộ truyện. `dhīra` (2.1) → “bậc trí”. `pañña` làm tính từ (2.6 …) → “có trí”. `bhūripañña` (14.1, 15.2) → “bậc trí tuệ rộng lớn” theo `ja508:11.3` và `ja452:1.1`.
  - `kusalā` (1.4, 3.4) → “các bậc thiện xảo”: 1.981 khoá chứa `kusal…`, phần lớn là “thiện” trong nghĩa thiện/bất thiện; “thiện xảo” 27, “khéo” 24 ở nghĩa khéo léo; ở đây chỉ người giỏi phán đoán nên chọn “thiện xảo”.
