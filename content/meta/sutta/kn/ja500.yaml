  - `vāricara` (6.4) → “con cá”: `pv40:3.2` dịch cùng cụm `vāricarova ghamme` là “quẩn quanh trong khổ đau, nóng bức” (bỏ mất hình ảnh), `ja486:7.4` dịch `vāricara` là “loài đi dưới nước”; theo nghĩa từng thành tố (vāri nước + cara đi) và ngữ cảnh (cá giữa nắng nóng, ghamme), chọn “con cá”.
  - `bhūtapati` (18.4) → “chủ của muôn loài”: theo `ja488:21.2`; `devarājā` → “vua chư thiên”: 44 khoá chứa `devarāj…`, đa số `devarājūnaṁ` → “thiên vương”; ở đây số ít, chỉ Sakka.
  - `bhaddante` (18.1) → “thưa ngài”: theo `ja322:1.1` (“thưa ngài”); `thag16.3:16.1` “thưa Tôn giả”.
  - `duggatigāmī` / `suggatigāmī` (13.4, 15.4) → “đi đến cõi dữ” / “cõi lành”: theo `thag16.8:17.2`, `mn86:18.48` (“cõi dữ”, 3 khoá); 0 khoá đối ứng `suggatigām…` trong tầng nên dùng “cõi lành” theo đối xứng.
