  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 19 cặp mở/đóng nháy (mở ở 1.1, 2.1, 3.1, 4.1, 5.1, 6.1, 7.1, 8.1, 9.1, 10.1, 12.1, 13.1, 14.1, 15.1, 16.1, 17.1, 18.1, 19.1, 21.1; đóng ở 1.4, 2.6, 3.4, 4.6, 5.6, 6.6, 7.6, 8.6, 9.6, 11.4, 12.6, 13.6, 14.6, 15.6, 16.6, 17.6, 18.6, 20.4, 21.6); bản Việt đúng như vậy, lệch 0/121 khoá cả `“`, `”`, `‘`, `’`, `…`, `(`, `)`, `"`. Hai chỗ nháy kép chạy qua ranh giới khoá giống Pāli: mở ở 10.1, đóng ở 11.4 (10.4 không đóng); mở ở 19.1, đóng ở 20.4 (19.6 không đóng, 20.1 không mở). Nháy đơn: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (phép so “…pe…” chạy rỗng vì Pāli không có lược; đã giữ đúng yêu cầu “`(…)` trần giữ nguyên” nhưng bài không có khoá nào như vậy). NFC 121/121 khoá, 0 khoá rỗng, 0 khoảng trắng thừa. Chữ số chỉ có ở `0.4` (“4.”). Pāli lọt sang Việt chỉ có ở tên riêng và tên bài (`Mātaṅga`, `Sirīmanta`, `Gaṅgā`, `Mahosadha`, `Senaka`, `Sakka`), đúng ý. Lỗi đã bắt khi tự kiểm: 0 lỗi nháy; bản nháp đầu viết `20.3` mở bằng “còn” (thêm tương phản không có trong Pāli, `ñāṇañca` chỉ là “và”), đã sửa thành “và”.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ điệp khúc và vocative, không có văn xuôi trong tầng. Senaka nói các khổ 2, 5, 7, 9, 12, 14, 16, 18; Mahosadha nói các khổ 4, 6, 8, 10–11, 13, 15, 17, 19–20; vua nói các khổ 1, 3, 21. Khổ 18 (“chúng tôi là năm bậc hiền trí … ngài vượt chúng tôi mà làm chủ”) là lời Senaka nói với vua, nhắc lại cảnh năm bậc hiền trí đứng hầu vua; “ngài” ở 18.1 và 18.3 hiểu là vua.
  2. `Pañño nihīno sirīmāva seyyo` (2.6 …): đọc `pañño` là tính từ “có trí” (đối ứng `Paññova seyyo` của Mahosadha, `paññāyupetaṁ siriyā vihīnaṁ` ở 1.1) và `nihīno` là “thấp kém” (về thịnh vượng), tức “bậc có trí mà thấp kém thì chính người có thịnh vượng mới hơn”. Cũng có thể đọc `pañño nihīno` là `paññā-nihīno` (“thấp kém về trí tuệ”, tức kẻ thiếu trí mà có thịnh vượng vẫn hơn); hai cách đọc cùng hướng kết luận (thịnh vượng hơn) nhưng khác người bị so. Tầng có 0 khoá đồng cụm.
  3. `Na khāyate iddhiṁ paññopi loke` (9.4): hiểu `khāyate` là “hiện rõ / được thấy”, `iddhiṁ` là “uy lực / thế lực”, `-pi` “cũng” nối với Gaṅgā ở 9.3 (Gaṅgā đổ vào biển thì không còn hiện rõ, người trí ở đời cũng không hiện rõ uy lực). Có thể đọc `iddhiṁ` là “thành tựu” hoặc “sự thịnh đạt”, và cũng có thể là “(người trí) không hiển lộ so với kẻ thịnh đạt”. Tầng có 1 khoá chứa `khāyate` (`ja494:16.4`, nghĩa “hiện ra / dường như”), 0 khoá cùng cụm.
  4. `Yametamakkhā` (10.1): `yametamatthaṁ` (`snp4.9:4.4`, `snp4.11:8.3`) là `yaṁ etaṁ atthaṁ`, nên `yametamakkhā` đọc là `yaṁ etam akkhā` (“…mà người ta nói đến này”); nghĩa của `akkhā` (có thể là dạng của `akkhāti`, “được nói / kể”) không có tiền lệ trong tầng (0 khoá). Bản Việt dùng “mà người ta nói đến ấy”, có thể đã thêm “người ta”; một cách đọc khác là `akkhā` là chủ ngữ riêng (`akkhā` = “loài / vật gọi là …”), không thể loại trừ.
  5. `bālassa pajappitāni` (11.1): `pajappita` ở `sn7.18:5.3`, `ne6:10.3` dịch “lời cầu khẩn”; ở đây dùng cùng chữ. Có thể là “lời huyên thuyên / lời tâng bốc” của kẻ ngu hoặc “điều khao khát”; nếu là điều khao khát thì câu có nghĩa “dù kẻ ngu khao khát bao nhiêu, thịnh vượng cũng không vượt qua trí tuệ”.
  6. `kevaladhammadassī` (3.2, 21.2): `kevala` có thể là “duy nhất / chỉ” hoặc “trọn vẹn”; dịch “bậc thấy trọn vẹn Pháp”. Cách đọc khác: “bậc chỉ thấy Pháp (không thấy gì khác)”. 0 khoá trong tầng.
  7. `sandhānagato` (12.2): dịch “đã vào cuộc dàn xếp”; có thể là “đã đạt đến sự nối kết / liên minh” hoặc “đã đến chỗ hòa giải”; `paresamatthaṁ` hiểu “việc của người khác” (có thể là “lợi ích của người khác”). Tầng 4 khoá chứa `sandhān…`, đều là tên riêng Sandhāna (`dn25`), không giúp được.
  8. `iddhassa posassa aniddhimanto` (16.4): `aniddhimanto` là cách số nhiều chủ cách, hiểu là chủ ngữ của `bhavanti` (“cả những kẻ không giàu thịnh cũng (thành vật thọ dụng) của người giàu”), hợp với 2.4 (`yasassino pesakarā bhavanti`); cách đọc đối nghịch là “còn kẻ không giàu thịnh thì không (được hưởng)”. Chọn cách đầu vì chủ ngữ số nhiều chủ cách khớp ngữ pháp hơn; có thể sai.
  9. `na bandhuvā na sarīravaṇṇo yo` (5.2): `yo` không dịch riêng (có thể là đại từ quan hệ “thứ nào …”); dịch “bà con hay vẻ đẹp thân hình cũng không”. `goravindaṁ` (5.4): dịch “người được kính trọng” (`gorava` + `vindaṁ`, “tìm thấy / đạt được”); 0 khoá trong tầng.
  10. `dummedhamantinaṁ` (17.2): dịch “tính toán kém trí”; `mantī` có thể là “người bàn tính / cố vấn”. Tầng có `ja508:21.2` (`mantinaṁ` “người đang bàn việc kín”) nhưng đó là nghĩa khác (bàn kín). Cách đọc khác: “kẻ ngu, cố vấn kém cỏi”.
  11. `kalimaggahesi` (4.4): tách thành `kaliṁ aggahesi` (đã nắm lấy ván thua). Hình ảnh xúc xắc (kali = viên thua) theo `thag5.2:2.2`; nếu `kali` là nghĩa khác (tai họa) thì câu thành “đã nắm lấy tai họa ở cả hai đời”, cùng hướng nghĩa.
  12. `anāḷhiyo` (14.2): dịch “túng thiếu” theo `mn66:11.1` (“sống túng thiếu”), `mn96:4.3` (“nghèo khó”).

