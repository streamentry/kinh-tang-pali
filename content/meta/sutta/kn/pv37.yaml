notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv37_root-pli-ms.json` (229/229 khoá, đủ và đúng thứ tự Pāli). Tên bài lấy từ nhãn Pāli `Serīsakapetavatthu` (Chuyện Ngạ Quỷ Serīsaka). Bài thuộc Đại Phẩm (Mahāvagga), bài thứ hai. Cùng cốt truyện hậu thân của vua Pāyāsi trong dn23; đã đối chiếu dn23 (bản Việt của dự án) để lấy tên Kumārakassapa và cách gọi nam cư sĩ.

  Bản Pāli song song: vv84 (Serīsakavimāna) trùng nguyên văn 219/227 khoá chung với pv37 (khác ở `0.1`–`0.3`, `1.1`, `3.4`, `6.3`, `50.3`, `55.1`); khi cả hai bài được gộp cần rà lại các khoá trùng để đại từ và thuật ngữ nhất quán.

  - Tầng tham khảo và coverage English:
    Tầng `english-sujato` không có pv37 (không có tệp nào của sub-collection `pv`); `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage = 0: Pāli có 226 khoá ngoài block tham chiếu, khoá dài nhất chỉ 38 ký tự, không khoá nào đạt ngưỡng 40 ký tự, nên cổng coverage không đo được gì và KHÔNG được trích ra làm bằng chứng đã có tầng tham khảo. Thứ chặn bài là việc ba tầng tham khảo đều vắng. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài, dn23 và tiền lệ cùng bộ, nên `triangulation` đặt 7.0.
  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” và `0.2` “Đại Phẩm” theo pv39–pv51 (cùng phẩm). `0.3` theo khuôn “N. Chuyện Ngạ Quỷ …” của pv39–pv41; `55.1` theo khuôn “Chuyện ngạ quỷ …, thứ N.” của pv39, pv43, pv44. `55.2` `Bhāṇavāraṁ tatiyaṁ` → “Phần tụng đọc thứ ba.”: Pāli dạng `…bhāṇavāra…` có 19 khoá ở tầng: “Phần tụng (đọc) thứ N” 11 khoá (dn32 ×2, tha-ap ×8, iti96), “Chuyên luận, phần thứ N” 3 khoá (pv20, vv28, vv85), “Chuyện kể thứ hai” 1 khoá (pv28), cách khác 4 khoá; chọn dạng đa số vì `bhāṇavāra` là phần để tụng đọc.
  - Cấu trúc người nói (Pāli không nêu tên người nói; không thêm vào thân kinh):
    + Kệ 1–2 là lời người kể (mở “ ở `1.1`, đóng ở `2.4`). Kệ 3–6 dạ-xoa hỏi các thương nhân; kệ 7–10 thương nhân đáp; kệ 11–12 dạ-xoa; kệ 13–20 thương nhân; kệ 21, 23 dạ-xoa; kệ 22, 24 thương nhân; kệ 25–28 dạ-xoa kể chuyện cũ; kệ 29–31 thương nhân; kệ 32–34 dạ-xoa; kệ 35 thương nhân; kệ 36 dạ-xoa; kệ 37 thương nhân; kệ 38–44 dạ-xoa; kệ 45 thương nhân; kệ 46 dạ-xoa; kệ 47 thương nhân; kệ 48 dạ-xoa; kệ 49–55 là lời người kể (không có ngoặc kép ngoài “ahaṁ pure”). Cặp ngoặc kép bản dịch khớp từng khoá với Pāli (48 dấu, 0 lệch). Đại từ: dạ-xoa tự xưng “ta”, thương nhân xưng “chúng tôi” và gọi dạ-xoa “ngài”/“thưa công tử” (`kumāra`); dạ-xoa gọi thương nhân “các vị” (`tumhe`), “các bạn” (`tātā`, tầng dịch `tāta` chủ yếu là “con ơi/này con” khi người trên nói với người dưới, ở đây hai bên không rõ tuổi nên chọn trung tính).
  - Số Pāli — tự tính:
    + `satamussitāse` (15.1) = sata 100 → “một trăm cột”; `sahassathambhaṁ` (16.1) = sahassa 1000 → “ngàn cột”; `vassasataccayena` (33.1) và `vassasataṁ` (33.3) = 100 năm; `vassasatāni pañca` (34.1) = 5 × 100 = 500 năm; `dutiyaṁ` (55.1) = thứ hai, khớp số `2.` ở `0.3`; `tatiyaṁ` (55.2) = thứ ba; `ekassa` (54.3) = một; `ekamekā` (33.2) = từng cái một; `magadhesu aṅgesu` (7.1) = hai xứ Magadha và Aṅga. Không còn số nào khác. Không gặp cụm số chưa phân xử.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + Pāli trùng nguyên văn với bài khác: đã dò 12 khoá (17 cặp Pāli↔Việt); 10 cặp dùng lại nguyên văn hoặc chỉ khác dấu câu và chữ hoa: `14.2` (vv6, vv7, vv8, pv28: “gần như phủ kín bởi hoa nhài, lại đầy những bông sen”), `19.2` (vv31), `24.2` (pv30:7.2), `27.4` (vv12, vv61), `27.5` (vv61), `39.2` (iti84). 7 cặp khác có lý do: `15.3` vv36:3.3 dịch `masāragallā` là “san hô” (sai: tầng dịch `masāragalla` là một loại đá quý, “đá quý masāragalla” ở dn17 và mil5.1.4 (18 khoá); `lohitaṅga` là “hồng ngọc” ở tha-ap5, tha-ap474, thi-ap11, thi-ap14), nên bản này dịch “đá quý masāragalla cùng hồng ngọc”; `18.2` vv82:1.3 dịch `accharā` là “đám bất tử” (sai; vv21 và vv31 dịch “đám tiên nữ” cho `accharāsaṅgaṇena`), bản này theo “tiên nữ”; `24.1` ja447:1.1 dùng “Ngươi” — ở đây thương nhân nói với dạ-xoa nên dùng “ngài”; `24.2` ja447:1.2 “hạt giống” (lệch Pāli `suciṇṇa`), theo pv30; `27.3` “sát sanh” 1 khoá so với “sát sinh” 38 khoá ở kn nên dùng “sát sinh”; `28.2` pv30:10.2 “của ngài” vì `Tassa` ở đó chỉ vị khác, ở đây người nói tự thuật; `44.6` ja161:2.4 “bậc thiện chí… điều hân hoan” — `sappurisa` ở tầng dịch “thiện nhân” 208 khoá so với “chân nhân” 54 và “thiện chí” 2, `sukho` dịch “hạnh phúc” nên bản này dịch “bậc thiện nhân quả thật là hạnh phúc”.
    + Trong chính bài có 5 nhóm Pāli trùng nguyên văn (không tính dấu câu): `3.3`=`9.3`; `7.4`=`37.2`=`52.2`; `9.2`=`44.4`; `20.3`=`22.3`=`24.3`; `49.1`=`50.1`=`51.1`. Cả 5 nhóm dùng cùng một câu Việt (chỉ khác dấu cuối khoá ở `7.4`, vì Pāli `7.4` kết bằng chấm). Có hai cặp gần trùng nhưng cố ý khác: `27.3`–`27.6` (ta, `abhāṇiṁ`/`ahosiṁ`) và `50.3`–`50.6` (họ, `bhaṇiṁsu`/`ahesuṁ`) vì ngôi khác; `1.1`–`1.4` và `32`–`34` không trùng.
    + `kadariya` → “keo kiệt” (tầng 36 lần so với “bủn xỉn” 18, “xan tham” 2); `pariyesati` → “tìm cầu” (tầng 69 so với “tìm kiếm” 18); `upāsaka` → “nam cư sĩ” (dn23:30.6 và tầng 355 lần so với “cận sự nam” 15); `duggati` → “đọa xứ” (kn 280 khoá so với “ác thú” 22, “cõi khổ” 13); `nekkhamma` → “xuất ly” (kn 45); `pāpadhamma` → “có hạnh ác”; `yakkha` → “dạ-xoa” (theo pv39 và dn32); `vāṇija` → “thương nhân” (tầng dịch như thế ở dn11, an6.54, ja493); `satthavāha` → “người dẫn đoàn buôn” (dn23:23.5 dịch “người dẫn đội”, tầng chỉ có 3 khoá `satthavāha`; chọn “đoàn buôn” cho `sattha` để dùng chung trong bài); `vaṇṇupatha` → “sa mạc” (ja2 `Vaṇṇupathajātaka` “Kinh Sa Mạc”, ja2:1.1) và `kantāra` → “hoang mạc” (dn2, dn10 “hoang mạc”), nên 3.2 và 3.3 dùng hai từ khác nhau; `bahussuta` → “nghe nhiều”, `cittakathī` → “thuyết giảng hay” (dn23:2.6, mn84:2.4, an5.50); `kumārakassapa` giữ “Kumārakassapa” (dn23); `diṭṭhivisūka` → “quanh co của tà kiến” (mn2:8.9 “sự quanh co của kiến chấp”); `ucchedavādī` → “kẻ chủ trương đoạn diệt” (dn1:3.9 “chủ trương đoạn diệt”); `natthikadiṭṭhi` → “tà kiến hư vô” (snp2.2:5.3 dịch “tà kiến đoạn diệt” nhưng ở đây `25.4` đã có `ucchedavādī`, nên cần từ khác); `vebhūtika pesuṇa` → “lời chia rẽ, lời ly gián” (dn28, dn30, sn11); `sakhila` → “hòa nhã” (an5.38:5.4); `asaṭho amāyo` → “không xảo trá, không gian dối” (dn25:15.7 “không xảo trá, không gian dối”, snp4.15:7.2 “amāyo” “không xảo trá”); `ariyavutti` → “người có hạnh của bậc Thánh” (sn3.24:5.3); `santusita` → “biết đủ” (tầng “tri túc” 110, “biết đủ” 76; chọn “biết đủ” vì đi với `santusito` trong kệ); `parittapuñña` → “ít phước” (mil6.2.2 “ít phước đức”, pv30:1.4 “phước báo ít ỏi”); `sambhava` giữ tên riêng; `sirīsa` → “cây sirīsa” (dn14:1.8.4); `pokkharaññī` → “ao sen”; `veḷūriya` → “ngọc lưu ly”; `jambonada` → “vàng Jambonada” (mn120, sn2.29); `muraja` → “trống muraja” (vv35:3.3 “trống”); `vessavaṇa` → “vua Vessavaṇa” (tầng 1 khoá “vua Vessavaṇa”; dn21, dn32 dịch “Đại Thiên Vương” cho `mahārājā`, ở đây Pāli chỉ nói `rājā`, `rañño`).
  - Bất định đã ghi (không thêm vào thân kinh):
    + `5.2` `Anāyasaṁ`: hai cách đọc — “không phải sắt” (`an` + `āyasa`) hoặc “chẳng lành, không có điều tốt”. `anāyasa` chỉ có ở pv37 và bản song song vv84:5.2 trong toàn Pāli root (cùng một đoạn); tầng Anh đã ghim không có. Dịch “chẳng lành” vì hợp với `paralokena tulyaṁ`; chưa phân xử được.
    + `3.4` `vaṅkambhayā`: tách `vaṅka` + `bhaya` (“sợ nơi hiểm trở”, theo `3.1` `vaṅke araññe`); dạng `vaṅkambhayā` chỉ có ở pv37; bản song song vv84:3.4 viết tách `vaṅkaṁ bhayā`, xác nhận cách tách này.
    + `4.2` `upādānaṁ`: dịch “gì nuôi thân”; nghĩa “nhiên liệu” (củi lửa nấu ăn) cũng khả dĩ, tầng chưa có tiền lệ cho khoá này.
    + `11.2` `vettācaraṁ saṅkupathaṁ`: chỉ có 1 khoá trùng (ja438:7.2, bản Việt “lối xe chở” không dựa được); dịch nghĩa chữ “đường đi bằng dây mây, đường cắm cọc”.
    + `15.2` `silāpavāḷassa ca āyataṁsā`: `āyataṁsā` (“góc/cạnh dài”) chỉ có ở pv37 và vv84:15.2 trong toàn Pāli root; `silāpavāḷa` → “đá san hô” (ja454:4.3 và pv18:4.3 “đá và san hô”). `15.4` `jotirasāmayāse`: `jotirasa` là tên một loại ngọc (mil5.1.4) nên dịch “ngọc jotirasa”; vv9:7.3 dịch “rực rỡ ánh lửa”.
    + `16.4` `tapanīya` → “vàng ròng”: tầng không có tiền lệ cho nghĩa “vàng” (32 khoá `tapanīya` còn lại là nghĩa “đốt nóng/giằng vặt”).
    + `17.2` `phala` trong `pāsādasopānaphalūpapanno` → “ván sàn”: `phala` ở đây có thể là “ván/tấm lát”; chưa có tiền lệ.
    + `19.1` `nārigaṇappabodhano`: chỉ có ở pv37 và vv84:19.1 trong toàn Pāli root; có thể là “người làm đoàn nữ nhân tỉnh thức” (tác nhân, như dịch) hoặc “được đoàn nữ nhân đánh thức”; Pāli không phân xử.
    + `21.2` `gutto`: dịch “canh giữ” (sát `abhipālayāmi` ở `21.3`); nghĩa “được bảo hộ” cũng hợp ngữ pháp.
    + `26.2` `uḷāro` → “là bậc cao quý” (tầng “cao quý” 24, “lớn lao” 13).
    + `31.2` `kalalīkata` → “khuấy đục” (sn46.55:12.1, an5.193:6.2 `kalalībhūta` “bùn lầy/đục”) và `31.4` `appaccayo` → “nỗi phiền muộn”: dn1:1.5.1 dịch `appaccaya` là “bất mãn”; ở đây người kể nói về nỗi buồn nên dịch “phiền muộn”; ai phiền muộn (thương nhân hay dạ-xoa) cũng do ngữ cảnh.
    + `33.2` `sipāṭikā phalati ekamekā`: dịch “từng quả một nứt ra”; chủ thể “từng quả” của mỗi cây hay của cả rừng không nêu rõ. Cách tính 100 năm một quả và 5 quả = 500 năm (`34.1`) là cách hiểu theo ngữ cảnh, không thêm vào thân kinh.
    + `34.3` `cavissaṁ` → “lìa bỏ nơi này” (nghĩa “mệnh chung” hay “rơi khỏi cõi trời” đều khả dĩ).
    + `38.1` `Mā ceva serīsamahaṁ akattha`: dịch “Chớ làm lễ hội Serīsa” theo nghĩa chữ; nhưng ở `53.4` các thương nhân vẫn làm lễ hội ấy — chưa phân xử được chỗ này (có thể `ceva` có nghĩa “không chỉ”).
    + `44.5` `Taṁ khippamānena lahuṁ parena`: chưa phân xử được (không có tiền lệ, tầng Anh đã ghim không có); dịch sát chữ “điều ấy, nhờ người khác mau chóng thúc đẩy”. Đây là điểm bất định đáng kể nhất của bài.
    + `46.2` `kocchaphalūpajīvī`: `kocchaphala` chỉ có ở pv37 và bản song song vv84:46.2 trong toàn Pāli root (0 khoá khác trong 5 bộ); giữ nguyên Pāli, đoán là dụng cụ của người thợ cắt tóc nhưng không thêm vào thân kinh.
    + `46.3` `pesiyo` → “người hầu”; `48.3` `ālambantu` → “chạm vào” (tầng dịch `ālambati` “tựa vào/chống tay” trong dn17, mn91); `49.2` `purakkhatvā` → “đặt lên hàng đầu”; `49.4` `Masakkasāraṁ` giữ Pāli (5 khoá ở Pāli root: ja524, ja535, ja546 ×2, vv84:49.4; tầng đã dịch chưa có khoá nào).
    + `51.4` `anumato` → “ưng thuận”; `53.1` `saṅgharaṁ` → “nhà của mình” (tha-ap45:7.4 “nhà mình”); `53.5` `pariveṇa` → “khu trú xá” (tầng đã dịch chưa có khoá nào dùng `pariveṇa`).
    + `54.4` `sabbeva sattā` → “tất cả chúng sinh”: có thể chỉ những người trong đoàn buôn hoặc nói chung.
  - Dấu lược: bài này không có `…` hay `(…)` ở Pāli (0/229 khoá), nên bản Việt cũng không có; không phát sinh chính sách dấu lược.
  - Kiểm tra tự động: tập khoá Việt = tập khoá Pāli (229/229, đúng thứ tự); nháy đơn và nháy kép khớp Pāli từng khoá (48 dấu, 0 khoá lệch); 0 khoá rỗng; chuẩn NFC; không có Pāli lọt sang thân Việt ngoài tên riêng và các thuật ngữ đã giữ nguyên ở trên.
  - technical_integrity đặt 9.6: không chạy được `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này; cần chạy đủ bốn lệnh này (cùng `npm run reference:gaps`) trước khi gộp. Không tuyên bố technical gate đã pass.
