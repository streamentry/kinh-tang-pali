    + `18.3` `Murajaālambaratūriya`: tách đúng là muraja + ālambara + tūriya; bản trước tách nhầm thành “trống ālamba”. Tên nhạc cụ `ālambara` đã có ở ja535:15.2 (“trống murajā và ālambara”) và cnd23:87.2. Sửa thành “trống ālambara”. Tiêu chí terminology 8.9 → 9.1 (cùng các sửa thuật ngữ dưới đây).
    + `19.1` `nārigaṇappabodhano` (bất định cũ, nay phân xử): đối chiếu hợp chất `-ppabodhana` ở toàn tầng, thấy dạng “được X đánh thức” (bị động, X là phương tiện): thag16.9:2.2 và 20.4 “được chũm chọe đánh thức”, ja547:107.2 “được đánh thức bằng múa hát”, ja547:11.2 “được đánh thức bằng rượu và thịt”, ja542:2.4 “được đánh thức bằng trống và tù và”, vv64:22.1 “được đoàn nhạc đánh thức”; chỉ 1 khoá nghiêng về nghĩa chủ động (tha-ap393:131.2). Hình ảnh vua được đoàn nhạc hay đoàn nữ nhân đánh thức cũng hợp ngữ cảnh cung điện. Đổi “là người làm đoàn nữ nhân tỉnh thức” → “được đoàn nữ nhân đánh thức” (cách đọc cũ còn gây hiểu nhầm là tỉnh thức tâm linh). Còn một khoá chủ động ở tầng nên đây là phân xử có căn cứ chứ không tuyệt đối. ambiguity_integrity 8.3 → 8.5 (các bất định khác ở trên vẫn còn nguyên).
    + `13.1` “còn kỳ diệu hơn cả điều này, chúng tôi chưa từng nghe, cũng chưa từng thấy” dễ bị đọc là họ đã thấy điều kỳ diệu hơn; Pāli `itopi accherataraṁ … na no sutaṁ vā atha vāpi diṭṭhaṁ` nghĩa là chưa từng nghe hay thấy điều nào kỳ diệu hơn điều này. Sửa 13.1 thành “điều nào kỳ diệu hơn điều này”.
    + `8.3` `Etena vegena`: “vì thế … đã đi nhanh như vậy” thêm quan hệ nhân quả Pāli không nêu; đổi thành “với tốc độ ấy, tất cả chúng tôi đã đến”. `8.2` `samekkhamānā`: “cân nhắc đến lòng thương” → “cân nhắc việc thương xót” (đỡ gượng, sát `anukampā`).
    + `4.4` `tatāhi uṇhāhi ca dāruṇāhi`: ba tính từ giống cái hợp với `paṁsūhi`/`vālukāhi` (4.3), bản trước viết như một nhóm “những thứ” đứng riêng; đổi thành “vốn bị nung nóng, nóng rực và khắc nghiệt” để nối đúng với bụi đất và cát.
    + `7.1` `Magadhesu aṅgesu ca satthavāhā` là định vị cách (ở Magadha và Aṅga); bản trước dịch “Từ các xứ” như nguồn gốc xuất phát; đổi thành “ở các xứ”.
    + `16.1` `Sahassathambhaṁ`: bản trước chèn thêm chữ “cung điện” ngay trước 16.2 vốn đã có `vimānaṁ`, nên lặp; đổi thành “Có ngàn cột” (khớp cách dịch cùng khoá ở bản song song vv84:16.1).
    + `17.4` `manuñño` “đẹp lòng” → “đẹp ý” để thống nhất với 22.4 và 23.4 (`manuññaṁ` “đẹp ý”) trong bài. `19.2` `manorame` “dễ chịu hết sức” → “làm đẹp lòng”: tầng có `manorama` “đẹp lòng” 22 khoá và “làm đẹp lòng” 13 khoá so với “dễ chịu” 9 khoá.
    + `41.1` `sagāravo sappatisso`: “cung kính” → “kính cẩn” cho `sappatisso` theo an6.33:2.4 và an7.33:3.2 (“kính cẩn, kính trọng”) và dn33:2.2.23 (“tôn trọng, kính cẩn”).
    + `12.4` `tātā`: “các bạn thân mến” → “hỡi các bạn” để cùng cách gọi với 32.1, 34.2, 36.3 trong bài (cùng Pāli `tātā`, bài vẫn dùng một dạng trung tính). `48.4` `kadariyā`: bỏ chữ “cả” vốn không có trong Pāli.
    + Điểm đổi: semantic_fidelity 8.8 → 9.0 (13.1, 18.3, 8.3); grammar_logic 8.8 → 8.9 (4.4, 7.1); terminology 8.9 → 9.1; vietnamese_clarity 9.0 → 9.1 (13.1, 19.1, 8.2); ambiguity_integrity 8.3 → 8.5. Không đổi: source_provenance, segment_alignment, triangulation (vẫn 7.0, không có bản Anh độc lập), han_viet_balance, technical_integrity (9.6).
    + Bất định còn lại sau lượt này, không phân xử được nên giữ nguyên bản dịch và ghi chú ở trên: `38.1` (chớ làm lễ hội hay chớ chỉ làm lễ hội; lưu ý `ceva` thường đi cặp với `ca`, ở đây `ca` nằm ở 38.2, và 53.4 họ vẫn làm lễ hội), `44.5`, `5.2`, `4.2`, `15.2`, `21.2`, `46.2`, `33.2`.
    + `12.4`/`36.3` và các khoá khác của bài song song vv84 không được đồng bộ trong lượt này (hai bài dịch độc lập; vv84 có cách dịch khác ở nhiều khoá như 4.2 “củi lửa”, 5.2 “vô ích”); cần thống nhất khi gộp hai bài.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 14 khoá bất đồng nghĩa → sửa 8, giữ 3, bất định 3. Sửa: 4.2 `upādānaṁ natthi kutodha bhakkho` "không có gì nuôi thân, thì lấy đâu ra món ăn" → "không có củi lửa, lấy đâu ra thức ăn ở đây" (`upādāna` là nhiên liệu; khớp vv84:4.2 cùng Pāli và bản nguyên bài; ghi chú cũ đã nêu đúng cách đọc này là khả dĩ); 5.2 `anāyasaṁ` "chẳng lành" → "vô ích" (khớp vv84:5.2 và bản nguyên bài "không có lợi ích"); 14.2 `pahūtamalyā bahupuṇḍarīkā` "gần như phủ kín bởi hoa nhài, lại đầy những bông sen" → "nhiều hoa, nhiều sen trắng" ("gần như" và "nhài" là chữ thêm; cùng Pāli ở vv84:14.2, vv6:6.4, vv7:6.4, vv8:7.4, pv28:3.2 đều dịch "nhiều hoa, nhiều sen trắng"; `puṇḍarīka` là sen trắng); 15.2 `silāpavāḷassa` "đá san hô" → "đá và san hô" (hai danh từ nối nhau; khớp vv84:15.2 và bản nguyên bài); 33.4 `yadagge kāyamhi idhūpapanno` "thân này" → "hội chư thiên này" (`kāya` là nhóm, như `bhummānaṁ sahabyagato` ở 2.2; vv84:33.4 và bản nguyên bài đều hiểu là nhóm); 34.1 `disvānahaṁ vassasatāni pañca` "Sau khi chứng kiến năm trăm năm" → "Ta đã thấy rằng, sau năm trăm năm" (vv84:34.1 và bản nguyên bài đều hiểu là ngài thấy trước hạn năm trăm năm ở lại cung điện; "chứng kiến năm trăm năm" làm lệch nghĩa); 44.5 `taṁ khippamānena lahuṁ parena` "điều ấy, nhờ người khác mau chóng thúc đẩy" → "vị ấy, bị người khác mau chóng ruồng bỏ" (`khippamāna` là phân từ bị động của `khipati`, "bị ném đi/bị bỏ"; vv84:44.5 "quăng bỏ", bản nguyên bài "xử tệ"; cú pháp của `taṁ` vẫn bất định); 46.2 `kocchaphalūpajīvī` "sống bằng nghề kocchaphala" → "sống bằng lược và dao cạo" (vv84:46.2 và bản nguyên bài cùng đọc là lược và dao cạo). Giữ: 12.4 `suṇoma` (Pāli ngôi số nhiều, bản dự án "ta muốn nghe"; không đổi nghĩa); 22.1 `pariṇāmajaṁ` ("biến hóa sinh ra" theo ja546 và ja524; bản nguyên bài "nảy sanh do sự phát triển"); 48.3 `ālambantu` ("chạm vào" so với bản nguyên bài "bước lên"). Bất định: 5.3 `luddānaṁ` (thợ săn hay kẻ hung dữ; `ludda` có cả hai nghĩa; vv84:5.3 và bản nguyên bài chọn "hung dữ"); 33.2 `sipāṭikā phalati` ("nứt ra" so với bản nguyên bài "kết trái"); 51.4 `yakkhiddhiyā anumato punappunaṁ` ("hết lần này đến lần khác" bám vào sự cho phép hay vào sự tùy hỷ). Các số đã tính lại và khớp bản nguyên bài: 100 cột (15.1), ngàn cột (16.1), 100 năm (33.1, 33.3), 500 năm (34.1). Review đối kháng cùng lượt: không tìm thấy lỗi nào ngoài những khoá nêu trên. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
