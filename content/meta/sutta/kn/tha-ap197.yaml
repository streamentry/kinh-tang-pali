  **Không chạy `git`** (kể cả `status`/`diff`/`log`) và không chạy `gh` — đã tuân thủ.

  **NỘI DỤNG RIÊNG**: thấy hoa aṅkola nở, cánh hoa lấm bụi vàng, hái lên đem đến bên
  Đức Phật. Khi bấy giờ Đức Siddhattha — vị Đại Muni — ở ngự đó; trong một khắc Ngài suy
  nghĩ rồi rút cánh hoa ra khỏi nách. 94 kiếp trước đã lễ bái bông hoa ấy; 36 kiếp sau có
  một vị tên Āseko, được thần ban, đủ bảy báu, làm Chuyển Luân Vương, và có bốn vô ngại
  giải. `tha-ap367` (Aṅkolapupphiya) là cùng một hoa và cùng hành động, nên tôi đối chiếu hai
  bài: `tha-ap367:2.1` `Aṅkolaṁ pupphitaṁ disvā` → *Thấy hoa aṅkola nở rộ*.

  **Bất định đã ghi nhận, không giấu.**
  1. `Aṅkolaṁ pupphitaṁ disvā` (`1.1`): có **near-miss** `tha-ap367:2.1` — cùng PāLI, chỉ
     khác dấu `“` mở đầu — → *Thấy hoa aṅkola nở rộ*. Tôi **dùng lại nguyên văn** theo luật
     "Pāli trùng thì dùng lại bản dịch", nhưng phải nói thẳng: chữ **"rộ"** không có trong
     Pāli (`pupphitaṁ` chỉ là *nở*). Đây là lệch có chủ ý; sửa thành *nở* thì phải sửa cả
     `tha-ap367:2.1` để kho không tự mâu thuẫn.
  2. `āseko devagajjito` (`4.2`): `devagajjito` là **hapax toàn Pāli gốc** (1/284.708
     segment, chỉ xuất hiện ở chính khoá này) và tôi **không có từ điển trong kho** để tra.
     Tôi dịch *được thần ban cho* theo cấu tạo (`deva` + `gajjita` = "được thần cho đạt")
     và ghi rõ đây là **suy đoán có chứng cứ, không phải điều đã kiểm**. Tôi không bịa một
     câu giải thích dài để lấp chỗ trống.
  3. `guhāyaṁ` (`2.4`): `guhā` nghĩa là **nách** (khoảng hõm dưới nách, cũng dùng cho khoảng
     hống trong y áo). 12 khoá có `guhā` trong tầng đều mang nghĩa **hang động** (dn21, dn16,
     mn76, sn46.14, dhp37, snp4.16) nên **không** có tiền lệ cho nghĩa nách. Tôi dịch *rút
     bông hoa ra khỏi nách* và ghi rõ đây là chỗ tôi tự phân xử.
  4. `Muhuttaṁ paṭimānetvā` (`2.3`): `paṭimāna` ở đây là *suy nghĩ, tính toán*, và chủ thể là
     **Đức Phật** (`2.1–2.2`), không phải vị trưởng lão. Tôi dịch *Trong một khoảnh khắc
     suy nghĩ xong*, giữ `muhutta` làm "một khoảnh khắc" và `paṭimānetvā` làm tiếng động từ
     đi sau. Có thể đọc là "liệu Ngài suy xét trong một khoảnh khắc"; cả hai cách đều để đây.
  5. `mālāvaraṁ sakosakaṁ` (`1.2`): **0 tiền lệ.** `mālā` = bụi, phấn hoa; `vara` = tốt
     nhất; `sakosaka` = "có vỏ bụi phủ bên ngoài" (`koṣa` = vỏ, bọc). Tôi dịch *bụi vàng lấm
     tấm trên hoa*; "lấm tấm" là cách nói tự nhiên cho `sakosaka` ở một bông hoa, nhưng đây
     là **diễn đạt của tôi**, không phải tiền lệ có sẵn. Tôi cố ý **không** thêm "cánh
     hoa" vì Pāli ở `1.2` không nêu cánh, chỉ nói bông hoa (`pupphaṁ` ở `1.3`).
  6. `patilīno mahāmuni` (`2.2`): `patilīna` = nằm, ngự yên. Tôi dịch *vị Đại Muni ở ngự ở đó*;
     `Đại Muni` 6 lần trong tầng (tha-ap7:2.4, tha-ap70:4.2, tha-ap269:2.2, thag1.110:2.6,
     vv67:6.1, vv22:10.2, vv19:5.3 — 7 chỗ nhưng 6 chuỗi khác nhau vì hoa/thường).
  7. `Chattiṁsamhi ito kappe` (`4.1`) **không có tiền lệ**; tôi dịch theo khuôn đã đo ở `Ito
     ca aṭṭhame kappe` (1 tiền lệ trùng chính xác) → *Cách đây … kiếp về trước*. Đây là
     **ngoại suy từ 1 tiền lệ**.
  8. `Siddhattho tamhi samaye` (`2.1`) có tiền lệ trùng chính xác `tha-ap30:2.1` → *Đức
     Siddhattha bấy giờ*; tôi dùng lại, chỉ giữ dấu phẩy cuối theo khoá (Pāli khoá này kết
     bằng `,`).

  **ĐÃ SỬA so với lần ghi trước.** (1) Tệp bản dịch chỉ có 1/24 khoá → nay 24/24, nên
  blocker "thiếu segment bắt buộc" hết hiệu lực. (2) `6.1` đang là *… đã từng nói bài kệ
  này* (số ít `bài kệ` + thêm "từng") trong khi 41 khoá cùng công thức `Itthaṁ sudaṁ āyasmā
  <tên> thero imā gāthāyo abhāsitthāti` đã merge ở dạng *Tôi nghe như vầy: … đã nói
  **những** bài kệ này* → nay sửa theo đúng dạng đó (bỏ "từng", sửa số nhiều của `imā
  gāthāyo`). (3) `translationTitle` đổi cho khớp với `:0.3`. (4) `assessed_at` cập nhật.
  Blocker còn lại chỉ là cổng kỹ thuật chưa chạy.
