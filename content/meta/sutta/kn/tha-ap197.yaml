  - `vietnamese-current` (Hòa thượng Thích Minh Châu): 26 tệp, **toàn bộ là `dhp`**
    (Đại Thập). 0 mục cho `kn/tha-ap`.
  - `english-project` (lớp lấp của dự án): 0 tệp cho 4 bài này; `content/meta/en/kn/`
    cũng không có. Tôi bị cấm ghi vào đó nên không tạo.
  ⇒ **Mẫu số coverage = 1 khoá mỗi bài** (Pāli ≥ 40 ký tự, bỏ khối `:0`): chỉ `:6.1`.
  Sujato phủ **0/1**, `vietnamese-current` phủ **0/1**, `english-project` phủ **0/1**.
  Đây là **giới hạn của bản chụp upstream**, không phải thiếu sót của kho, nên
  `triangulation` hạ 8,2–8,4 cho cả 4 bài. Vì mẫu số chỉ có **1 khoá**, con số này gần
  như không đo được gì; tôi nói thẳng thay vì coi như đã đối chiếu English.
  `content/meta/reference-gaps.yaml` **đã có** entry cho cả 4 bài (tha-ap168 dòng 1529,
  tha-ap175 dòng 1564, tha-ap180 dòng 1594, tha-ap197 dòng 1684), mỗi entry ghi
