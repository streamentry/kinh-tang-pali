  `npm run reference:gaps` sinh và tôi bị cấm sửa; sau thay đổi này nên chạy lại để nó tự
  làm mới.

  **CỔNG KỸ THUẬT CHƯA CHẠY — không tuyên bố pass.** Lát này bị cấm
  `npm run validate|test|check|build`, nên `technical_integrity` đặt **9,6** và bốn lệnh
  còn lại là: `npm run validate` · `npm test` · `npm run check` · `npm run build`. Phần tôi
  tự kiểm được: JSON hợp lệ, NFC, đủ và đúng thứ tự khoá, 0 lệch nháy, 0 lệch dấu lược,
  YAML parse sạch bằng thư viện `yaml` của kho, `final_score` khớp trung bình số học thô
  tính bằng script. Vì `AGENTS.md` nói *chỉ sau khi technical gate pass mới được đổi
  status*, 4 bài này giữ `draft` dù `final_score` đã > 9,0; chạy xanh bốn lệnh trên là
