notes: |-
  BÀI NÀY thuộc lát n37 (4 bài `tha-ap`, 92 khoá được giao). Lần ghi này bổ sung
  TOÀN BỘ 24 khoá của bài — tệp bản dịch trước chỉ có đúng 1 khoá `:6.1` — nên hai
  blocking error cũ (thiếu segment bắt buộc; chưa ghi nhận tầng tham khảo) đã hết hiệu
  lực. Xem "ĐÃ SỬA" ở cuối.

  **Bối cảnh đo (chụp lúc đọc, không phải con số vĩnh viễn).** Tầng Pāli gốc đã ghim:
  284.708 segment. Tầng Việt dự án lúc đo: **156.283** segment. Các lát khác vẫn chạy song
  song nên con số tầng Việt đã tăng trong lúc tôi làm (155.826 → 156.000 → 156.283); mọi
  tỉ lệ dưới đây là của đúng cái chụp 156.283 đó, và sẽ đổi nếu đo lại.

  **Năm phép kiếm tự chạy, in số** (`_n37_check.py`, chạy sau khi ghi):
  1. `set(khoá Việt) == set(khoá Pāli)`: 4/4 bài 24/24, thiếu 0, thừa 0, thứ tự khoá
     khớp đúng thứ tự Pāli, 0 khoá sai NFC. Phép này phải tự viết vì ngưỡng ≥ 40 ký tự
     của chốt cũ loại hết lát này: ngoài `:6.1` **không có khoá Pāli nào ≥ 40 ký tự**.
  2. Nháy đơn `‘’` và ngoặc kép, so **từng khoá**: 0 lệch ở cả 4 bài. Cả 4 bài có đúng
     1 `“` (khoá `1.1`) và 1 `”` (khoá `5.3`) — Pāli cố ý để nháy chạy qua nhiều khoá và
     tôi giữ y hệt, không dời. Nháy đơn: 0 ở cả hai vế, trùng Pāli 0/0.
  3. Pāli trùng nguyên văn TRONG CHÍNH bài mà Việt khác: **0 nhóm** — không bài nào
     có cặp Pāli lặp nội bộ.
  4. Dấu lược: mỗi bài đúng 1 khoá `…pe…` và 0 khoá `…` trần; cả 4 khoá lược giữ
     **đúng một** `…`, không khoá nào có `… cho đến …`, không khoá nào thêm `…` khi Pāli
     không có. Tổng lỗi của 5 phép: **0**.
  5. Mọi số nêu trong `notes` này đều do script in ra.

  **Chỉ mục Pāli→Việt toàn tầng.** Dựng trên 284.708 segment Pāli × 156.283 segment
  Việt. Trong 96 khoá của lát: **52/96** khoá có Pāli trùng nguyên văn ở nơi khác, tổng
  **9.569** cặp trùng đã dò. **40/96 khoá dùng lại NGUYÊN VĂN** bản dịch đã có (10 khoá
  mỗi bài × 4 bài); 56/96 khoá hoặc không có tiền lệ trùng, hoặc có mà tôi chọn cách
  khác — lý do từng khoá ghi ở mục "Bất định" bên dưới.

  **Thuật ngữ, đều kèm số đếm (đo trên 156.283 segment Việt).**
  - `Therāpadāna` (`:0.1`) → giữ nguyên `Therāpadāna`: 368 khoá `:0.1` giữ nguyên, 9 khoá
    dùng *Trưởng Lão Ký Sự*; đối chiếu chính xác trên cụm Pāli `Therāpadāna ` thì
    **364/373**. Đây là **tên sách**, và tầng đang làm y hệt với `Jātaka` (427 khoá `:0.1`),
    `Milindapañha` (211), `Vimānavatthu` (61), `Petavatthu` (27), `Theragāthā` (12),
