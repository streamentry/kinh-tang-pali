  - **Điểm đổi.** `semantic_fidelity` 8.9 → 9.0 (bỏ nghĩa thừa ở `4.2`, `35.2`); `grammar_logic` 9.0 → 9.1 (làm rõ người nói ở `44.2`, `46.2`; chủ thể ở `35.2`); `terminology` 8.7 → 8.9 (sáu chuỗi thuật ngữ về theo tiền lệ đã đếm); `vietnamese_clarity` 8.9 → 9.1 (`1.7`, `4.2`, hai câu nói rõ người nói). Không đổi: `source_provenance`, `segment_alignment`, `triangulation` (vẫn 7.0, không có tầng tham khảo nào), `han_viet_balance`, `ambiguity_integrity` (21 bất định ở trên vẫn còn nguyên: không có căn cứ mới để phân xử), `technical_integrity`. `final_score` 8.93 → 8.99.
  - **Chưa giải được, ghi lại.** `kn/mil3.8:3.8` có Pāli trùng nguyên văn với `42.1` của bài này nhưng bản Việt ở đó viết "nói" (Pāli là `etadahosi`, "nghĩ"); đây là lỗi ở bài khác, chưa sửa trong lượt này. Các bất định số 1–21 và blocker `noEnglishEditionUpstream` giữ nguyên. Bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` vẫn do người điều phối chạy tập trung.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 9 khoá bất đồng nghĩa → sửa 1 (`2.2`: trước «mong nhờ biện tài ấy, ta đủ sức gỡ rối, tháo gỡ mọi điều ứng đối cho những câu hỏi được hỏi đi hỏi lại» → sau «mong ta đủ sức gỡ rối, tháo gỡ mọi điều ứng đối cho những câu hỏi được người này hỏi đi hỏi lại»; Pāli `iminā pucchitapucchitaṁ` là «bởi người này hỏi đi hỏi lại», người hỏi chính là chú sa-di về sau thành vua Milinda; cụm «nhờ biện tài ấy» của bản cũ không có trong Pāli và làm mất người hỏi), giữ 5 (`4.4`: ở danh mục mười chín môn học, bản nguyên bài hiểu khác ở các mục suti, sammuti, yogā, nīti, visesikā, ketu, mantanā, bản dự án giữ cách đọc theo từ nguyên và đủ mười chín mục như Pāli; `36.4`: bản nguyên bài chỉ nêu Kinh và Vi Diệu Pháp, Pāli nêu cả Luật; `51.4`: Pāli `yojanasatāni` là số nhiều, «hàng trăm do-tuần», bản nguyên bài viết «một trăm»; `60.7`: bản nguyên bài không có vế `sāmaññaphalaṁ kho pana amhākaṁ paramattho` (quả sa-môn là mục đích tối thượng); `75.1`: bản nguyên bài đảo chiều thâm niên, trong khi Pāli `purato … navakataro`, `pacchato … vuḍḍhataro` so sánh với Nāgasena, nên 40.000 vị phía trước cao hạ hơn và 40.000 vị phía sau thấp hạ hơn, đúng như bản dự án), bất định 3 (`17.3` và `17.6`: `kammabahulena` là «nhiều nghiệp» hay «nhiều việc»; bản nguyên bài chọn «việc», bản dự án giữ «nghiệp», trong tầng không có chỗ thứ hai dùng từ này để phân xử; `30.1`: `ācariyassa anuyogaṁ datvā` là «chuyên tâm theo học thầy» hay «đáp lại sự khảo vấn của thầy», bản nguyên bài theo cách thứ hai). Các số khớp giữa hai bản: 18 phần Vibhaṅga, 14 Dhātukathā, 6 Puggalapaññatti, 1.000 bài Kathāvatthu (500 + 500), 10 Yamaka, 24 Paṭṭhāna, bảy tháng, bảy năm mười tháng, 80.000 tỳ-kheo, 100 koṭi vị A-la-hán, 16 × 8 khuỷu tay. Danh mục chướng ngại ở `32.4` chỉ có 15 mục dù Pāli nêu «mười sáu»; cả hai bản đều chép 15 mục, giữ đúng Pāli. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
