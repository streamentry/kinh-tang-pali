notes: |-
  `Bāhirakathā` ("Phần Truyện Bên Ngoài"), phần dẫn thứ hai của Milindapañha, kể tiền duyên của Milinda và Nāgasena. 337 khoá Pāli, đã dịch đủ 337/337 (dịch mới toàn bài), thứ tự khoá đúng thứ tự Pāli, 0 khoá ngoài tập Pāli. Bài gồm bảy phần: tiền nghiệp của hai vị tỳ-kheo và sa-di (`1.1`–`3.2`); vua Milinda và các giáo chủ ngoại đạo (`4.1`–`11.3`); Tăng đoàn ở Himavanta, thiên tử Mahāsena và Tôn giả Rohaṇa (`12.1`–`22.5`); cuộc đời Nāgasena từ lúc thọ thai đến lúc chứng A-la-hán (`23.1`–`57.2`); lời thỉnh của một trăm koṭi vị A-la-hán (`58.1`–`58.6`); Tôn giả Āyupāla và lần thất bại thứ ba của Milinda (`59.1`–`64.4`); Nāgasena đến Sāgala, hai đoạn kệ và dòng kết (`65.1`–`82.1`).

  **Coverage English (đo thật, không đoán).** Mẫu số = số khoá Pāli có nội dung theo `source/layers.yaml` (từ 40 ký tự, chuẩn hoá khoảng trắng, bỏ khối `:0.x`) = **238** trên 337 khoá. Chữ English có ở tầng đã ghim = **0**, nên ratio = 0.0000, dưới ngưỡng floor 0.8. Cả ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng cho uid này, nên bài không được tuyên bố đã đối chiếu English hay Việt hiện hành ở bất kỳ khoá nào; mọi chỗ khó phải tự đứng trên Pāli, ngữ cảnh trong chính bài và tiền lệ nội bộ của tầng Việt đã dịch. Đây là lý do `draft` (xem `blocking_errors`).

  **Tiêu đề và hai dòng kết.** `0.1` `Milindapañha` giữ nguyên Pāli (234 trên 246 khoá cùng Pāli trong toàn tầng; 8 khoá viết "Mi-lan-đà Vấn Đạo"). `0.2` `Bāhirakathā` → "Phần Truyện Bên Ngoài": 0 tiền lệ cho chuỗi này; tầng tên của chính SuttaCentral đặt "Introductory Narrative" cho cả `mil-bahirakatha` lẫn `mil2`, còn `mil1` (`Ārambhakathā`) ở tầng Việt là "Phần Dẫn Nhập", nên không dùng lại chữ "dẫn nhập" cho hai bài khác nhau. `0.3` `Pubbayogādi` → "Việc Làm Từ Trước Và Những Điều Khác": `1.1` tự chú rằng `pubbayoga` là `pubbakamma` ("việc làm từ trước"); khuôn viết hoa chữ đầu từng từ theo `mil6.4.2:0.4`. `82.1` `Bāhirakathā niṭṭhitā` → "Phần Truyện Bên Ngoài đã hoàn tất.": theo khuôn của `mil4.6:2.1`, `mil3.8:7.1`, `mil8:9.1`. `1.1` viết theo cách `mil5.2.3:7.2`–`7.6` đã xử lý các câu chú giải dạng `Pāli ti …`: giữ thuật ngữ Pāli trong ngoặc đơn sau bản dịch ("Việc làm từ trước (pubbayoga)").

  **Số Pāli, đã tự tính từng cụm.** `ekūnavīsati` = 1 ít hơn 20 = **19**; đã đếm lại bằng cách tách mục ở `4.4`: suti, sammuti, saṅkhyā, yogā, nīti, visesikā, gaṇikā, gandhabbā, tikicchā, catubbedā, purāṇā, itihāsā, jotisā, māyā, ketu, mantanā, yuddhā, chandasā, buddhavacana = 19 (khớp). `cha satthāro` = 6 (`6.2`: Pūraṇa Kassapa, Makkhali Gosāla, Nigaṇṭha Nāṭaputta, Sañjaya Belaṭṭhaputta, Ajita Kesakambala, Pakudha Kaccāyana = 6, khớp). `pañcasatā yonakā` = 500; `koṭisatā arahanto` = 1 koṭi × 100 → "một trăm koṭi vị A-la-hán" (cùng thang `koṭisata` đã dùng ở `bv`, `mil6.4.2`); `dvādasa vassāni` = 12 năm; `dasamāsādhikāni satta vassāni` = 7 năm + 10 tháng (`22.3`, `23.2`, `24.4`; khớp với 10 tháng thọ thai ở `26.3`); `tayo acchariyā abbhutā dhammā` = 3 (`23.1` kể đủ ba: khí giới bùng cháy, lúa thượng hạng chín rộ, mưa lớn); `sattavassiko` = 7 tuổi; `sahassaṁ` = 1.000 (`28.1`, đơn vị không nêu trong Pāli nên không thêm); `soḷasa palibodhe` = 16 (xem bất định số 1); `aṭṭhārasa vibhaṅga` = 18, `cuddasavidhena` = 14, `chabbidhena` = 6, `pañcasuttasatāni` × 2 = 500 + 500 = 1.000 (`suttasahassaṁ`), `dasavidhena` = 10, `catuvīsatividhena` = 24 (`37.1`; đủ 7 bộ, khớp `satta pakaraṇāni` ở `39.1`); `satta māsāni` = 7 tháng; `paripuṇṇavīsativassaṁ` = tròn 20 tuổi; `tiṁsamattāni vassāni` = chừng 30 năm; `pañcamattāni sakaṭasatāni` = chừng 500 cỗ xe; `soḷasahatthaṁ āyāmena, aṭṭhahatthaṁ vitthārena` = dài 16, rộng 8 khuỷu tay (cùng đơn vị "khuỷu tay" đã có trong tầng); `aṭṭhārasannaṁ brahmakoṭīnaṁ` = 18 koṭi (`60.9`; `mil6.4.2:9.1` cùng con số "mười tám koṭi phạm thiên"); năm bài kinh ở `61.1` đếm đủ 5; `asītiyā bhikkhusahassehi` = 80 × 1.000 = 80.000; `cattālīsāya bhikkhusahassānaṁ` = 40 × 1.000 = 40.000 ở phía trước và 40.000 ở phía sau (`75.1`; cộng 80.000, khớp `65.2`/`73.2`). `yojanasatāni` (`51.4`) là số nhiều nên dịch "hàng trăm do-tuần", không quy thành 100. Không có cụm `Tiṁsakappasahassa` nào trong bài.

  **Dùng lại nguyên văn.** Dò toàn tầng dn/mn/sn/an/kn (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 15 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác (tổng 514 lần xuất hiện), trong đó 12 khoá Việt dùng đúng bản đa số hoặc đúng bản duy nhất: `0.1` (giữ Pāli), `4.3` "Như sau đây —" (9 trên 12 khoá), `9.1` "Bấy giờ, vua Milinda nghĩ—" (1 trong 2; khoá kia viết "Rồi vua Milinda nói:" là dịch sai `etadahosi`), `13.2`/`17.4` "Lần thứ hai cũng …", `24.3`/`60.6` "Trưởng lão nói—" (19 trên 26), `49.5`/`53.8` “Bất cứ pháp nào có tính sinh khởi, tất cả đều có tính đoạn diệt.” (8 trên 20 khoá; các cách khác "Phàm pháp gì …", "… tính chấm dứt"), `55.2` `(…)`, `68.2` "rành rẽ đường và chẳng phải đường;" (`sn8.6:3.2`), `79.4` "đã nói lời này:" (10 trên 16 khoá). Ba khoá khác bản đã có: `25.3` (`āha.` → "ông nói." vì câu kết một lời dẫn ở đây; bản kia "ngài đã bảo:" mở một lời dẫn), `42.1` (`etadahosi` → "nghĩ như sau": bản kia viết "nói", sai nghĩa), `68.1` (chỉ khác dấu nháy mở, vì Pāli của bài này không mở nháy ở khoá đó). Trùng nguyên văn trong chính bài: 9 nhóm, 11 cặp; 1 nhóm bản Việt khác: `44.1` và `58.4` ("Bạch ngài, …" so với "Bạch các ngài, …") vì người nghe khác nhau (Rohaṇa một mình, rồi một trăm koṭi vị A-la-hán); 8 nhóm còn lại Việt giống hệt.

  **Văn xưng và danh xưng.** `bhante` của Milinda với các giáo chủ và Āyupāla → "thưa tôn giả" (toàn mil: "thưa tôn giả" 622 so với "bạch ngài" 238, đa số theo `mil6.4.2`); `bhante` giữa tỳ-kheo với bậc trên, Sakka với Assagutta, thiên tử với Sakka → "bạch ngài". `mahārāja` do tỳ-kheo hoặc đạo sư nói → "này Đại vương"; do người Yonaka và Devamantiya nói → "tâu đại vương" (toàn mil: "này Đại vương" 1.320, "tâu đại vương" 737). `devā` → "tâu đức vua" theo `mil3.2.6`. `mārisa` → "thưa ngài" (`mil6.3.2`, `dn32`; `mil5.1.6` dịch "thưa tôn giả"). `āvuso` → "hiền giả"/"chư hiền" (`mil5.3.4`, `mil6.4.2`). `tāta` → "con"/"này con"/"con ơi" khi người lớn tuổi hay cha gọi người nhỏ hơn (cha Soṇuttara, vị trưởng giả ở Pāṭaliputta, bà đại nữ cư sĩ nói với một tỳ-kheo), "thưa cha" khi Nāgasena nói với cha (`mil6.3.1` dùng "cha ơi", "thưa ông" cho `tāta`). `dāraka` → "cậu bé". `āyasmā` → "Tôn giả" (7.150 khoá trong tầng); `thero` → "vị trưởng lão"/"Trưởng lão" (1.324).

  **Thuật ngữ, đã đo trên tầng.**
  - `paṭisambhidā` → "vô ngại giải": 618 khoá trong tầng, so với 1 khoá "tuệ phân tích".
  - `dibbāya sotadhātuyā` → "thiên nhĩ giới": 28 khoá "thiên nhĩ giới" và 28 khoá "thiên nhĩ" không kèm "giới".
  - `nirodhaṁ samāpanno` → "nhập diệt thọ tưởng": 49 khoá "diệt thọ tưởng", 0 khoá "diệt tận định". Pāli ở đây chỉ có `nirodhaṁ` nên bản Việt dùng dạng rút gọn đã có trong tầng.
  - `dhammacakkhuṁ udapādi` → "pháp nhãn … khởi lên": "pháp nhãn" 29 khoá, "Pháp nhãn" 9 khoá.
  - `sotāpatti` → "Nhập Lưu" (46 khoá, so với 3 khoá "Dự Lưu").
  - `upajjhāya` → "thầy tế độ" (21 khoá, so với 6 khoá "hòa thượng"). `sāmaṇera` → "sa-di" (64 khoá).
  - `pariveṇa`/`ārāma` → "tịnh xá": 74 khoá "tịnh xá" so với 66 khoá "tinh xá". Dùng một dạng cho cả `Saṅkhyeyyapariveṇa` và `Asokārāma`.
  - `tāvatiṁsa` → "cõi trời Ba Mươi Ba" ("Ba Mươi Ba" 169, "Ba mươi ba" 85, viết hoa theo đa số).
  - `devānamindo` → "vua chư thiên" (295 khoá), tên Sakka giữ nguyên (186 khoá "Sakka, vua chư thiên").
  - `sākacchā`/`sallapituṁ` → "thảo luận"/"đàm luận" (`mil3.1.4`, `mil3.2.5` dùng "đàm thoại", "tranh luận"; chọn "đàm luận" vì `sallapituṁ` lặp lại nhiều lần trong bài và cần nhất quán). `kaṅkhaṁ paṭivinetuṁ` → "giải tỏa nghi ngờ" (0 tiền lệ cho cụm này).
  - `khattiya … caṇḍāla pukkusa` (`8.4`, `8.6`): "Sát-đế-lợi" 576 khoá; "Phệ-xá", "Thủ-đà-la" theo `mil1` (tầng: 11 và 19 khoá); "Chiên-đà-la" 14 khoá; `pukkusa` → "người đổ rác" theo `an5.192` (cùng chuỗi đẳng cấp), khác `vv63` giữ nguyên chữ `pukkusa`.
  - `dhammābhisamaya` → "sự giác ngộ Chánh pháp" theo `mil6.4.2:9.1`, `mil6.4.2:10.1`. Các tên kinh ở `61.1` theo đúng `mil6.4.2:8.2`: "Kinh Đại Hội", "Kinh Đại Điềm Lành", "Tiểu Kinh Giáo Hóa Rāhula", "Kinh Sa Đọa", `samacittapariyāya` giữ nguyên chữ vì không xác định được kinh tương ứng.
  - `Himavanta` giữ nguyên chữ (6 khoá, so với "Tuyết Sơn" 2). `Jambudīpa` (3 khoá). `Sāgala` viết như Pāli ở bài này (`mil1` viết "Sāgalā" ở 3 khoá theo Pāli của bài đó: `sāgalāyaṁ`, `sāgalaṁ`). `mandārava` giữ nguyên chữ theo `dn16`, `bv19` (8 khoá, so với "mạn-đà-la" 2 khoá).
  - Bảy bộ Abhidhamma ở `37.1`: tên giữ nguyên Pāli trong lời kể (`Abhidhamma` giữ nguyên trong mil, 4 khoá); các câu mở đầu từng bộ dịch: "Các pháp thiện, các pháp bất thiện, các pháp vô ký", "Tổng hợp, không tổng hợp", "Chế định uẩn, chế định xứ" (theo `mil3.1.1`, "sự chế định"), "Song đối gốc, song đối uẩn", "Nhân duyên, cảnh duyên".
  - `acchariya abbhuta dhamma` → "điều hy hữu, kỳ diệu"; `āvudhabhaṇḍa` → "khí giới".

  **Nháy.** Pāli có 160 khoá chứa nháy kép. Các lời mở ở một khoá và đóng ở khoá sau (hoặc sau nhiều khoá): `8.3` mở, `8.5` đóng; `8.6` mở, `8.12` đóng; `44.1` mở, `44.2` đóng; `51.5` mở, `51.6` đóng; `52.4` mở, `52.5` đóng; `56.2` mở, `56.3` đóng; `58.2` mở, `58.3` đóng; `58.4` mở, `58.5` đóng; `59.5` mở, `59.6` đóng; `60.9` mở, `61.1` đóng, rồi `61.2` mở, `61.5` đóng; `66.1` mở, `70.4` đóng và `79.1` mở, `81.4` đóng (hai đoạn kệ); `71.2` mở, `71.3` đóng. Nháy đơn nằm trong nháy kép ở bảy khoá: `24.2`, `24.4` (hai cặp), `25.2`, `35.2`, `38.2`, `44.2` (hai cặp) và `44.3` (năm cặp lồng nhau). `3.2` Pāli kể lời tiên đoán không đặt nháy nên bản Việt cũng không thêm nháy. Đã so khớp từng khoá cho cả bốn loại `“ ” ‘ ’`: 0 khoá lệch trên 337 khoá.

  **Dấu lược.** Pāli có `…` trần ở `1.4`, `13.2`, `17.4` (cả ba giữ đúng một `…`, không mở rộng), và `(…)` ở `24.4` (nằm trong câu) và `55.2` (là toàn bộ khoá). Cả hai `(…)` giữ nguyên theo Pāli đã ghim: ở `55.2` đó là toàn bộ nội dung khoá Pāli (140 khoá Pāli y hệt trong tầng, Việt viết `…` 64, `~` 57 và cách khác), nên không thể thay bằng chữ vì sẽ thêm lời không có trong nguồn. Công cụ kiểm của kho báo `(…)` trần ở khoá `55.2` là cố ý. Pāli không có `…pe…` nào.

