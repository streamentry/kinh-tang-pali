notes: |-
  Dịch trực tiếp từ Pāli root, đủ 102/102 khoá, thứ tự khoá như Pāli; commit đã ghim không có bản Anh cho toàn bộ `thi-ap`. Dùng bài liền kề thi-ap14, thi-ap12/13/16 và tha-ap418 (Ekadīpiya, cùng đề tài cúng đèn) làm tiền lệ.
  Đại từ ngôi thứ nhất dùng con, khớp thi-ap12/13/14 (cùng Phẩm Ekūposathika): đo thi-ap12 con 12/tôi 1, thi-ap13 con 10/tôi 2, thi-ap14 con 41/tôi 1; thi-ap16 cùng phẩm dùng tôi 9/ta 5, nên đây là chọn theo phạm vi gần nhất (3/4 bài trong phẩm), không phải đa số toàn nhóm.
  `:0.3` Pāli là `Pañcadīpadāyikātherīapadāna` không bắt đầu bằng số nên không giữ số thứ tự; translationTitle bằng đúng `:0.3` và `:27.1` kết bằng `thứ năm`. Tên người `Pañcadīpadāyikā` giữ Pāli theo thi-ap14 (`Ekāsanadāyikā`), thi-ap13 (`Modakadāyikā`) và thi-ap16 (`Naḷamālikā`).
  Hình thức `Tuyên Ngợ` ở `:0.3`/`:27.1`: nhóm thi-ap đo 21 tệp `Tuyên Ngợ` / 1 `Tuyên Ngôn` / 1 khác; nhóm tha-ap đo 251 `Tuyên Ngợ` / 131 `Tuyên Ngôn` / 111 `Ký Sự` / 5 `Kinh Kệ`. Cả hai phạm vi cùng nghiêng về `Tuyên Ngợ` nên giữ nhất quán với phạm vi gần nhất; chữ này có dấu hiệu là lỗi chính tả của tầng, người biên tập nên phán một lượt cho cả cuốn.
  `Ekūposathikavagga` → Phẩm Ekūposathika theo thi-ap12/13/14/16. `Haṁsavatiyā` → Haṁsavatī, `Ở thành Haṁsavatī` như thi-ap14 (4 chỗ `thành xứ Haṁsavatī`, 2 chỗ `thành Haṁsavatī`).
  Công thức lời kết `Itthaṁ sudaṁ … abhāsitthāti` dịch nhóm `đã nói những bài kệ này` (số nhiều, khớp `imā gāthāyo`), theo thi-ap12/13/14 và nhóm 407 khoá của tầng.
  Dùng lại nguyên văn tiền lệ: đã dò 38 khoá Pāli có nội dung trùng với tầng thi-ap/tha-ap (bỏ `:0.1`, `:0.2` và các khoá `…pe…`); 34 khoá dùng lại nguyên văn (chỉ khác dấu câu hoặc hoa/thường), 4 khoá khác chỉ ở đại từ ta/tôi → con (3.4, 15.4, 18.3, 22.2). Gồm 8.1–8.4 (`Nhờ nghiệp lành khéo làm ấy` 32 chỗ, `cùng với tâm nguyện và chí hướng` 32 chỗ), 9.1 (`cung điện khéo tạo của`), 14.1 (`Dù sinh vào cảnh giới nào` 15 chỗ), 14.2 (`dù làm chư thiên hay làm người` 12 chỗ), 15.1 (`Rơi khỏi cõi trời` 8 chỗ), 17.1 (`Khi đời sống cuối cùng đã đến` 2 chỗ), 19.1–19.2 (thi-ap14), 20.3 (`đã đạt đến chỗ tận cùng của các thắng trí`), 22.1 (`Vào một trăm ngàn đại kiếp trước` 27 chỗ so với 6 `kiếp trước đây`), 22.3 (thi-ap14), 25.1 (`Bốn vô ngại giải` 505 chỗ).
  Chỗ chủ ý khác nhóm thi-ap12/13/14: 23.3 `viharāmi anāsavā` dịch `con sống không còn lậu hoặc`, bỏ `đời thanh tịnh` vì Pāli không có chữ ấy (đo toàn tầng: 12 khoá `sống không còn lậu hoặc` so với 7 khoá `đời thanh tịnh`); 24.1 `Svāgataṁ vata me āsi` dịch `Thật lành thay sự đến của con` (113 khoá) thay cho `Thật là đón mừng thù thắng thay cho con` (31 khoá) của thi-ap12/13/14. Hai chỗ này làm bản Việt của thi-ap15 khác các bài liền kề; người biên tập có thể muốn đồng bộ cả nhóm theo một hướng.
  Từ vựng: `bodhimuttamaṁ` → cội bồ-đề tối thượng (tha-ap177, tha-ap423), `bodhimūle` → dưới gốc bồ-đề (tha-ap154); `pāṭihīraṁ` → thần thông (nhóm `pāṭihāriya` của tầng: 66 khoá thần thông, 10 thần biến, 2 phép thần, 1 điều kỳ diệu); `kāḷapakkhe` → nửa tháng trăng khuyết (nhóm đa số của tầng: 6 trong 14 khoá có `kāḷapakkha`, so với 4 khoá `nửa tháng tối` và 4 cách khác); `ārāmena ārāmaṁ` → từ tu viện này sang tu viện khác (mn89, sn46.6); `mahāvīra` → Đại Anh Hùng (12 chỗ, so với 5 `Đại Hùng` và 1 `Đại Anh hùng`); `cakkhuma` → bậc Có Mắt (tha-ap26, tha-ap471); `sītibhāva` → mát lạnh (tha-ap391 `sītibhūto`); `Satasahassito kappe` → một trăm ngàn đại kiếp (xem số Pāli); `sugataduggate` → những ai đã đi đến cảnh giới tốt và xấu, theo công thức thiên nhãn `sugate duggate` của dn25 (`đi đến cảnh giới tốt hay xấu`) và dn10 (`thiện thú, ác thú`); `Dīpasatasahassāni` → hàng trăm ngàn ngọn đèn theo tha-ap418 (1 chỗ); `devabhavana` → thiên cung; `sūtikāgehe` → phòng sinh (0 tiền lệ); `pañcadīpānidaṁ phalaṁ` → đây là quả báo của năm ngọn đèn theo `đây là quả báo của một ngọn đèn` ở tha-ap418.
  Số Pāli: `Sattarattindivaṁ` = satta 7 + ratti + diva → bảy đêm ngày (tha-ap475 `Sattarattindivaṁ ṭhatvā` → bảy đêm ngày); `Sattame divase` = thứ bảy; `pañca dīpāni` = năm ngọn đèn; `Saṭṭhiyojana` = saṭṭhi 60 → sáu mươi do-tuần; `tiṁsayojana` = tiṁsa 30 → ba mươi do-tuần (`tiṁsa` = 30 theo thi-ap14 và `tiṁsayojana` cùng khoá trong tầng); `Asīti` = 80; `Satānaṁ` = số nhiều của `sata` → hàng trăm (không phải một trăm); `Jātiyā sattavassāhaṁ` = satta 7 → lên bảy tuổi; `Satasahassa` = 100 × 1000 = một trăm ngàn; `Paṭisambhidā catasso` = bốn. Cụm `Tiṁsakappasahassa` không có trong bài này.
  Ghi nhận bất định: 1.2 `cārikī` — dạng nữ của `cārika` (người đi lại, du hành), 0 tiền lệ trong tầng; dịch `nữ du hành` theo nghĩa gốc, không nói đó là hành hương hay khất thực. 4.2 `asamappaṭipuggalo` — 1 tiền lệ chỉ ở dạng cắt đôi (tha-ap520), dịch `bậc không ai sánh bằng`; 4.1 `amitaguṇo` — 0 tiền lệ, dịch `có phẩm đức vô lượng`. 4.3 `dassetu` là mệnh lệnh ngôi thứ ba (`xin hiển bày` để nói với Đức Phật); Pāli nói Đức Phật ở ngôi thứ ba nên chuyển sang `xin Ngài` là chọn văn phong, không phải thêm nghĩa. 5.1 `Saha āvajjite mayhaṁ` — 1 tiền lệ ở mil6.3.4 cho `āvajjite` (`nhớ nghĩ đến`); dịch `Ngay khi con vừa nghĩ đến`, không nêu tân ngữ vì Pāli không nêu. 12.2 `sugataduggate` — hai cách hiểu có thể có: chúng sinh đã đi đến cảnh giới tốt và xấu (công thức thiên nhãn), hoặc người sung túc và người khốn khổ; chọn cách thứ nhất theo công thức của tầng, và Pāli không có `chúng sinh` nên không thêm. 13.3 `Satānaṁ cakkavattīnaṁ` — số nhiều của `sata` nên dịch `hàng trăm`; tha-ap344 và tha-ap459 dùng cùng dạng `satānaṁ` cho một mệnh đề khác nên không dùng làm bằng chứng. 17.2 `mānasaṁ vinivattayiṁ` — 0 tiền lệ trong tầng; dịch `xoay chuyển tâm ý`, không nói tâm quay khỏi cái gì vì Pāli không nêu. 17.3–17.4 `Ajarāmataṁ sītibhāvaṁ, nibbānaṁ` — ba tân ngữ đứng trước `Niết-bàn`; giữ thứ tự Pāli qua hai khoá. 18.4 `guṇamaññāya` — Pāli không nêu phẩm đức của ai; dịch `sau khi biết rõ phẩm đức` không thêm `của con`, tha-ap26 cũng không thêm. 21.1 `Sabbavositavosānā` — 0 tiền lệ; dịch `Đã hoàn thành mọi điều cần hoàn thành`. 21.3 `Pañcadīpā mahāvīra` — hiểu `Pañcadīpā` là tên người nói ở cách thứ nhất, nên thêm `con là` để câu Việt tự lập; Pāli là câu danh từ không có động từ. 2.1 `Kāḷapakkhamhi divase` — Pāli nêu một ngày thuộc nửa tháng khuyết, không nêu ngày nào. 7.1 `Āsanaṁ parivāretvā` — Pāli không nêu chỗ ngồi của ai; dịch `chỗ ngồi` trần.
  Dấu câu: nháy kép `“”` mở ở 1.1 và đóng ở 25.3; nháy đơn `‘’` mở ở 4.1 và đóng ở 4.4, đúng như Pāli, khớp từng khoá (không khoá nào tự cân). 3.4 kết bằng dấu hai chấm vì khoá kế mở lời trích, theo tiền lệ `lúc ấy tôi nghĩ như vầy:`; Pāli kết bằng dấu chấm.
  Bản Việt mới dịch xong, chưa có lượt review đối kháng riêng ngoài các phép tự kiểm: tập khoá Việt = tập khoá Pāli (102/102, cùng thứ tự); 0 khoá lệch nháy đơn/kép; `…pe…` ở 23.2, 24.2, 25.2 → đúng một `…`; Pāli không có `(…)` trần ở khoá nào nên bản Việt cũng không có; NFC, 0 khoá rỗng, 0 khoảng trắng thừa. Cặp Pāli trùng trong bài: 3 nhóm (14.3 = 16.1; 16.4 = 19.4 = 20.4 = 22.4; 23.2 = 24.2 = 25.2) = 10 cặp; chỉ 1 cặp (14.3/16.1) khác nhau, chỉ ở chữ hoa đầu câu vì 16.1 mở câu mới sau dấu chấm còn 14.3 ở giữa câu; thêm cặp gần trùng 2.4/6.2 (khác dấu câu cuối) dịch giống nhau.
  technical_integrity 9.6 vì lát này không chạy gate (brief cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
