notes: |-
  Tiền lệ: khung tiêu đề như ja131; bhīruka → nhút nhát (kẻ biết sợ, hợp với nghĩa
  cả bài); rakkhasa → quỷ la-sát, 0 tiền lệ trong tầng dự án nên ghi mới, tránh
  nhầm với dạ-xoa (yakkha) đã có tiền lệ riêng.
  Bất định: 1.2 Anivattitattābhayabhīrutāya là hợp chất kép, đọc là vừa quyết không
  lùi bước vừa biết sợ điều nguy hiểm; cách đọc khác là nhờ không lùi mà kẻ nhút
  nhát được an toàn. Bản Việt giữ cả hai đức tính nên đứng vững ở cả hai cách đọc.
  Thiếu tầng Anh nên triangulation chỉ 7.0 và bài ở draft.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
