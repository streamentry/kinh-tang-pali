notes: |-
  PĀLI TRÙNG NGUYÊN VĂN — ĐÃ DÙNG LẠI. `“Saddhāyāhaṁ pabbajito,` trùng y hệt
  `thag1.46:1.1` và `sn4.22:4.1`, tầng đã dịch "“Tôi xuất gia vì lòng tin," — dùng lại nguyên văn.
  `sampajāno patissato` trùng `iti17:3.4` = "tỉnh giác và chánh niệm" — dùng lại.
  `Appamatto ca ātāpī` dịch theo khuôn có sẵn ở mil7.7.2:2.1 "hãy sống không phóng dật, nhiệt tâm,
  quyết chí": "và không phóng dật, nhiệt tâm". `appamatta` có tiền lệ riêng (iti101:4.4 "không
  phóng dật"; an3.100; snp3.12). `kuṭikā` = túp lều, có tiền lệ ở thag1.1:4.1 và sn1.19.
  Lưu ý: cụm `kuṭikā` cũng xuất hiện ở thag1.51:1.2 với nghĩa khác hẳn (`sukhā nivātā`), nên tôi
  giữ "túp lều" ở đây cho khớp với tiền lệ thag1.1 chứ không dịch theo nghĩa của thag1.51.
  Dòng kết 1.5 giữ HAI dấu lược như Pāli. Vì `cần` RỖNG, tôi tự quét MỌI khoá — sạch. Không
  chạy npm (đợt này cấm) nên technical_integrity = 9.6.
