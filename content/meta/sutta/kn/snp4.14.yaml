notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B12 — snp4.14:17.4 (`vata`/`sīlabbata`: bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”/“giới cấm”).
  Thống nhất cấp kho 2026-10-17 (B19, họ √sam): 5.1 upasame «hãy an tịnh» → «hãy làm yên lặng», 5.3 upasantassa «đã an tịnh» → «đã yên lặng» (B19 upasanto = «yên lặng»; DPD upasameti «calms; tranquillizes», Niddesa mnd14:43.2 giải bằng sameyya ngoại động), 5.2 santiṁ «sự tịch tĩnh» → «sự an tịnh» (B19 santi); khớp dòng kệ trích mnd14:42.1–42.3, 48.1–48.3. Dòng 5.4 còn khác mnd14 («tự ngã/huống gì» và «bản ngã/làm sao có»), ngoài phạm vi.
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 2.1 (bỏ sót chữ nội dung, nghĩa từ sai: papañcasaṅkhā «sự tạo tác» bỏ mất papañca → «các định danh do hý luận»; lời giải mnd14:18.2 «Papañcāyeva papañcasaṅkhā», Pj II §923, DPD «concepts due to proliferation», Sujato «judgments that emerge from proliferation», snp4.11:13.4), 2.3 (bỏ sót mantā → thêm «bằng tuệ»; lời giải mnd14:20.2 «Mantā vuccati paññā», 20.11 mantāya, Pj II §923 «sabbaṃ mantāya uparundhe», DPD mantā 1 «(comm) wisdom»; giữ cú pháp «chính là ý niệm ‘ta là’» theo Sujato), 3.3 (nghĩa từ sai: thāmaṁ kubbetha «tạo sức mạnh cho mình» → «cậy sức»; lời giải mnd14:31.2 thāmaṁ … thambhaṁ … mānaṁ na kareyya, DPD thāmas 2 «obstinacy», Sujato «be proud»), 7.1 (bỏ sót vivaṭa: «Bậc có mắt» → «Bậc có mắt rộng mở»; lời giải mnd14:57.3, Pj II §928, Sujato «whose eyes are open»), 14.2 (sai cách: bhikkhu là chủ ngữ, không phải hô cách «hỡi Tỳ-kheo»; lời giải mnd14:164.2 vị tỳ-kheo được khen là chủ thể của na unnameyya, Sujato «a mendicant would not gloat»), 17.3 (nghĩa từ sai: jīvita «mạng sống» → «lối sống»; lời giải mnd14:204.4–205.3 lūkhajīvita/paṇītajīvita, Pj II §938 jīvikāya, DPD jīvita 2 «livelihood; lifestyle», Sujato «livelihood»), 18.1 (bỏ sót rusito → «mà bị xúc phạm»; lời giải mnd14:209.2, Pj II §938, Sujato «provoked»), 18.4 (thêm ý «không muốn»: na … karonti → «không tranh đối»; lời giải mnd14:211.5, Sujato «do not retaliate»). Không sửa (NGHI-GIỮ): 4.3 phuṭṭho «bị hỏi», 4.4 vikappayaṁ «biện minh», 15.2 upavāda (Snp theo Sujato), 5.4 attā/nirattā, 8.1 lola; thuật ngữ B19 còn sót: 1.2 santipada, 18.4 santo, 19.3 santi «tịch tĩnh» (không phải lỗi nghĩa, để lượt thuật ngữ).
  Sau kiểm độc lập 2026-10-17: giữ cả 8 sửa của lượt đối chiếu Niddesa; thêm chú thích 2.3 nêu cách đọc khác của mantā: DPD xếp chính dòng kệ này vào mục mantar «người suy tư, người biết» (không phải mantā 1 «(comm) wisdom» như mục trên ghi), Sujato cùng cách đọc ấy; bản dịch theo lời giải mnd14:20.2, 20.11 và chú giải Pj II §923 («sabbaṃ mantāya uparundhe»).
  Sửa 2026-10-18 theo đối chiếu khoá trùng Pāli: thi hành nốt B19 (santo/santi = «an tịnh»; lượt 2026-10-17 đã làm 5.1–5.3): 1.2 santipada «trạng thái tịch tĩnh» → «trạng thái an tịnh», 18.4 santo «các bậc tịch tĩnh» → «các bậc an tịnh», 19.3 santi «sự tịch tĩnh» → «sự an tịnh» (thuật ngữ, không phải lỗi nghĩa; khớp dòng kệ trích trong mnd14:2.2, 7.1, 12.8, 16.2, 208.4, 211.1, 214.3, 217.1 và 5.2 của chính bài; trong lời giải mnd14:211.2, 45.3 chữ «tịch tĩnh» dịch nibbuto, nên dùng nó cho santo thì va chạm). Giữ 15.4 lapayeyya «nói năng với người ta vì muốn lợi lộc»: DPD lapayati 2 (dẫn chính dòng này) có nghĩa «talks; appeals (to); chats up», Pj II giải «lābhakāmatāya janaṃ nālapayeyya»; bản hiện tại đã nói đúng việc nói với người ta vì lợi (ālapanā, vế đầu của lapanā), chỉ chưa nói rõ sắc thái «lấy lòng» như lời giải mnd14:176.2–176.4 và Sujato «cajole» — để lượt đồng bộ dòng kệ Snp với lời giải Niddesa cấp kho (quyết định 2026-10-17 §5.4), không phải lỗi nghĩa.
