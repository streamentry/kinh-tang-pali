notes: |-
  **Bài này ĐÃ CÓ một tệp trên đĩa từ đợt trước, và chỉ phủ 1/13 khoá** (`ja218:2.3`); metadata cũ ghi `draft` với blocker *bản dịch chỉ phủ 1 khoá*. Đợt này lát chia theo `all` nên cả 13 khoá về tôi, và tôi viết đủ 13 — **blocker cũ vì vậy không còn đúng** nên tôi đã viết lại `notes` này. Tôi **giữ nguyên nguyên văn** `ja218:2.3` đã có (*Hãy trao hạt đậu ấy, vì lẽ con trai bạn, vì lẽ hạt đậu phải vỡ ra;*) chứ không viết lại, vì đổi câu đã có sẽ là sửa vô ích.

  **Vì sao vẫn `draft` — và vì sao điểm thấp hơn hẳn so với các bài khác.** Tại commit đã ghim, tầng English Sujato **không có thư mục `kn/ja`** với bài này: `ls .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/` có `ja`, nhưng `ja218` không có tệp — `englishCoverageFor('kn','ja218')` trả `englishSegments: 0`. `validate` coi thiếu tệp Anh là lỗi chặn cho `review`/`published`, nên bài giữ `draft`. Đồng thời **ba trong năm chữ khó đoạn kệ này có cách đọc cạnh tranh thật** (xem dưới), nên tôi hạ `semantic_fidelity`, `terminology` và `ambiguity_integrity` xuống dưới mức 9. Tôi **không** nâng điểm để né blocker.

  **Tự kiểm.** Chỉ `2.3` là khoá ≥ 40 ký tự nên `kiểm()` của `_hvi.py` chỉ bắt một khoá. Tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá `all` (13 khoá), NFC, **số dấu lược khớp Pāli từng khoá**, ngoặc kép mở ở `1.1` và đóng ở `2.4` nên cân trên cả bài, không Pāli lọt, không còn `(…)`, không trùng Pāli, `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Tiêu đề: dùng lại nguyên văn, không bịa.** `Bīraṇathambhavagga` → *Phẩm Bīraṇathambha* — **PĀLI TRÙNG Y HỆT `ja211:0.3`** (cùng phẩm, đã có bản Việt) nên dùng lại. `Dukanipāta` → *Tập Kẻ Đau Đớn* (26 chỗ, và `ja211:0.2` dùng đúng vậy); tôi **không** theo *Phẩm Hai Pháp* (22) hay *Bộ Hai Bài Kinh* (15) vì hai cách đó là dịch theo hậu tố `-nipāta` chứ không phải nghĩa của `duka`. `Kūṭavāṇijajātaka` → *Kinh Kūṭavāṇija*: giữ **tên riêng** theo đúng `translationTitle` đã có sẵn của chính bài này và theo `ja211:0.4` *Kinh Somadatta*; tôi **không** đặt mới cách Việt cho `kūṭa` trong tiêu đề, vì `kūṭa` trong thân kệ đã được dịch thành *hạt đậu* ở `2.3` (nguyên văn đã có) và hai chỗ đó phải khớp nhau.

  **Ba bất định đã ghi — không nhập chú giải vào thân kinh.**
  (1) `Saṭhassa sāṭheyyamidaṁ sucintitaṁ` — `Saṭha` viết hoa đầu như **tên riêng** và là người được nói (vế sau `1.4` gọi cậu bé là `kumāraṁ`), nên tôi dịch *Này Saṭha, điều này đã được suy nghĩ rất kỹ lưỡng vì lợi ích của ngươi*. Cách đọc cạnh tranh: `saṭha` là danh từ chung *người khôn*, thì câu là *vì lợi ích của người khôn* — không có tên riêng nào được gọi. Tôi chọn cách có tên vì Pāli viết hoa.
  (2) `Paccoḍḍitaṁ paṭikūṭassa kūṭaṁ` — `paṭikūṭa` có **0** tiền lệ, và từ điển cho cả *phần còn lại / phần dưới cùng* lẫn *kẻ bán lừa đảo*. Tôi dịch *hạt đậu của kẻ bán lừa đảo đã được đổ đầy*, vì `1.4` dùng `kulalā` (kẻ bán) đúng nghĩa ấy và hai vế còn lại nói về việc giấu hạt vỡ ở dưới cho chuột. Nếu đọc theo nghĩa *phần dưới cùng*, câu thành *hạt đậu ở tầng dưới đã được đổ đầy* — cũng hợp truyện, tôi ghi ra để biên tập cân nhắc.
  (3) `Mā te puttamahāsi phālanaṭṭho` — khó nhất. Tôi dịch *Kẻ bán lừa đảo ấy chớ để phần vơi của cậu làm lợi cho mình*, dựa vào `te` là danh từ *kẻ bán hạt* và `phālanaṭṭho` là *lợi lấy từ hạt đậu vỡ*. Tôi **không** chắc chắn về `puttamahā` (có thể là `putta-moha` *xiềng của cậu*) và không dám chọn cách đọc thứ hai; vì vậy `ambiguity_integrity` chỉ 8,6.

  **Tiền lệ, đếm được.** `kūṭa`/`phāla` → *hạt đậu* (nguyên văn `ja218:2.3` đã có trong bài này — và Pāli `1.3` `Phālañce khādeyyuṁ mūsikā` xác nhận đó là **hạt đậu đã vỡ**, không phải *đậu xanh*, vì 13 khoá của bài không hề có chữ `muḍga`). `mūsikā` → *chuột* — từ Việt thông thường, người đọc hiểu ngay, nên giữ; tôi **không** ghi số đếm cho chỗ này vì các agent khác đang viết song song làm số đó trôi. `kulala` → *kẻ bán lừa đảo*: **0**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: tiền lệ cho `kulala`, đặt mới theo nghĩa *kẻ buôn bán rong hàng*. `nikaṭino nikatyā` → *có kẻ gặt lấy đi*, giữ đúng nghĩa *kẻ gặt rác / thợ gom mẩu* mà bản cũ cũng ghi.

  **Văn phong.** Bài kệ là lời buộc trách của chính kẻ bán hàng, nên tôi dùng mệnh đề thẳng và giữ câu hỏi `1.4` dạng *Vì sao … không …?* như Pāli `Kasmā … na hareyyuṁ`, không chuyển sang khẳng định.

  **Không có bản Việt tham khảo** tại commit đã ghim (`translation/vi/` bilara chỉ có 26 tệp Pháp Cú).

  **`technical_integrity` 9,6** vì đợt này cấm `npm run validate|test|build`.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja218:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.
