notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Tra tiền lệ (đếm được):** `dā` dạng mệnh lệnh → *hãy cho* / *trao* (`ja450:4.2` "hãy
  cho bố thí"; 192 chỗ "trao" trong tầng Việt); `naṭṭha` (vì lẽ) → **0 tiền lệ riêng**,
  đặt mới *vì lẽ*; `putta` → *con trai*.
  **Bối cảnh đã đọc trước khi dịch:** `1.3` nói `Phālañce` — những hạt đã vỡ — và
  `2.2` nói `nikaṭino nikatyā` (thợ cạo cắt đều tay), nên `phāla` ở đây là **hạt đậu đã
  vỡ ra**, và vỡ ra là dấu hiệu người bán trung thực. Tôi dịch `phālaṁ` là *hạt đậu ấy*
  chứ không phải *đậu xanh*, vì Pāli trong 13 khoá của bài **không** dùng chữ `muḍga`
  — thêm *đậu xanh* là thêm chi tiết không có trong nguồn.
  **Bất định đã ghi:** `puttanaṭṭha` (dative) và `phālanaṭṭhassa` (genitive) là hai cụm
  `naṭṭha` đi cạnh nhau nhưng khác cách, và cách gắn `phālanaṭṭhassa` vào `phālaṁ`
  không hoàn toàn rõ. Tôi đọc là hai trạng ngữ mục đích song song — *vì lẽ con trai
  bạn, vì lẽ hạt đậu phải vỡ ra* — vì đó là cách đọc làm cho cả ba thành phần của Pāli
  đều có chỗ đứng. Cách đọc cạnh tranh: `phālanaṭṭhassa` là genitive sở hữu của
  `phālaṁ`. Tôi **không** nhập chú giải vào thân kinh; người đọc cần thêm thì xem chỗ
  dùng `phālanaṭṭtho` ở khoá `2.4` (không thuộc lát này).
  **Điểm ở `semantic_fidelity` 9,0 và `terminology` 8,7 là do bất định trên**; `phāla`
  và `phālana` đều là **0 tiền lệ** trong tầng Việt.
