notes: |-
  Đợt 19, làn 116. Dịch từ Pāli root commit đã ghim, đủ 334/334 khoá (333 khoá mới; khoá `1.1` đã có từ lần trước, kiểm lại và giữ nguyên), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Đây là phẩm đầu của Buddhavaṃsa, phần Đường Kinh Hành Châu Báu: Phạm thiên Sahampati thỉnh cầu (`2`), Đức Phật khởi lòng bi mẫn và quyết định cho thấy Phật lực (`3`–`6`), hóa hiện đường kinh hành bằng châu báu trên không trung và chư thiên tán thán (`7`–`37`), lời tán thán Đức Phật (`38`–`43`), Sāriputta nhìn thấy, triệu tập năm trăm tỳ-kheo và cùng đến (`44`–`57`), các vị đệ tử thượng thủ (`58`–`63`), Đức Phật nói về bốn điều không thể tính đếm và về lúc từ Tusita giáng thế (`64`–`72`), Sāriputta hỏi về lời phát nguyện và các ba-la-mật (`73`–`78`), Đức Phật bắt đầu giảng (`79`–`82`), khoá kết `83.1`. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bài không có dấu lược `…` hay `(…)` trong Pāli nên bản Việt cũng không có.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn `bv13:0.1`, `bv18:0.1`, `bv26:0.1`, … (27/27 tiền lệ).
  - `0.2` “1. Phần Đường Kinh Hành Châu Báu”: `kaṇḍa` → “Phần”, cùng cách `bv28:0.2` “Phần Tạp Tập Về Các Đức Phật”; `caṅkama` → “kinh hành” (103 trên 194 khoá Pāli có `caṅkam-`, ví dụ `dn25:6.2`, `dn27:1.4`, `bv13:17.2`); `ratana` → “châu báu” (`bv7:28.1`, `bv10:25.2`; “báu vật” 1, “ngọc” 2). Bản cũ của bài ghi “Phẩm Đường Ngọc”: đây là terminology fix (đổi “Phẩm” → “Phần” và “Đường Ngọc” → “Đường Kinh Hành Châu Báu”) để khớp `bv28`, `bv29` và các khoá thân bài; `translationTitle` đổi theo. Phương án khác: “Chương Con Đường Kinh Hành Bằng Châu Báu”.
  - `83.1` `niṭṭhito` → “đã hoàn tất”, cùng khuôn `bv28:21.1`.

  **Số Pāli, đã tự tính.** `dasasahassī` / `dasasahassīlokadhātu` = dasa 10 × sahassa 1.000 = **10.000** “mười ngàn thế giới” (13.1, 14.1, 19.2, 25.1, 67.3, 69.3, 70.4, 72.3; tiền lệ `bv4:18.4`, `bv18:21.4`, `tha-ap51:2.2`, 11 khoá trong bv). `pañcannaṁ bhikkhusatānaṁ` = 5 × 100 = **500** (47.1) và `pañcabhikkhusatā` = **500** (56.1): cùng một nhóm. `dvattiṁsa` = dvi 2 + tiṁsa 30 = **32** (17.2; “ba mươi hai tướng cao quý”, 5/5 tiền lệ trùng nguyên văn, ví dụ `bv15:23.2`, `bv22:23.4`). `Dasanāgabala` = **10** (40.1). `cattāro` = **4** (65.1) khớp bốn mục ở 65.3–65.5: sattakāya, ākāsa, cakkavāḷa, buddhañāṇa. `catuhatthe` = **4** hattha (74.4; giữ chữ hattha, như `bv17:21.2`). `dasa pāramī` = **10** (78.1; “mười ba-la-mật”, `bv17:12.4`). `tipāṭihīre` = **3** (12.2) khớp ba tên ở 12.1 (iddhi, ādesanā, anusāsanī). `chappakāraṁ` = **6** “sáu cách” (72.4). `satapuññalakkhaṇo` = **100** (10.3) và `sataraṁsi` “trăm tia sáng” (16.4; tiền lệ `bv8:24.4`, `bv9:25.4`, `tha-ap24:17.4`). `pañcavaṇṇika` = **5** “năm màu” (23.1, 26.3, 27.3, 37.3). Không có cụm `Tiṁsakappasahassa`, không có `koṭi` dùng làm số: ở 65.2 `koṭi` mang nghĩa “điểm tận cùng”, xem mục bất định.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã publish và draft (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 55 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 281 cặp, trong đó 103 cặp có Việt khác bản tôi viết (riêng bv: 71 cặp, 47 giống hệt; riêng tha-ap: 121 cặp, 77 giống hệt). 36 khoá dùng đúng nguyên văn ít nhất một tiền lệ (`0.1`, `1.1`, `16.4`, `17.2`, `18.1`, `18.2`, `18.4`, `20.1`–`20.5`, `22.4`, `24.2`, `24.3`, `26.2`, `27.2`, `28.2`, `30.3`, `32.2`, `35.4`, `39.4`, `40.4`, `49.1`, `50.1`–`50.3`, `51.4`, `52.4`, `53.4`, `57.1`, `59.4`, `71.4`, `73.1`, `73.2`, `81.2`); 19 khoá khác mọi tiền lệ, mỗi chỗ có lý do:
  - `16.3` (tiền lệ “Ngài chiếu sáng mọi phương,” ở bv7, bv8, bv13): ở đây chủ ngữ của `obhāseti` là con đường (`nimmito ratanāmayo`, 16.2), không phải Đức Phật, nên viết “Con đường chiếu sáng mọi phương,”. Cùng lý do ngôi kể/chủ ngữ khác thì Việt phải khác.
  - `19.4`, `25.4`, `30.4`, `57.2` `tuṭṭhahaṭṭhā pamoditā`: viết “vui mừng, hớn hở, hoan hỷ” (đúng `cp9:6.2`, `tha-ap414:29.1` bỏ chữ “bà”); không theo `tha-ap434:5.2` “đã đứng lên, đầy hân hoan” vì nghĩa “đã đứng lên” không có căn cứ ở chữ Pāli.
  - `24.4` (tiền lệ `tha-ap486:9.4` “bậc Tối Thượng Loài Hai Chân”): dùng dạng đa số trong bv, “tối thắng giữa loài hai chân” (5/5 khoá có `dvipaduttama` ở bv).
  - `31.1` (tiền lệ `tha-ap521:16.1` “Cả những loài rồng sống lâu,”): `nāga` ở kn tha-ap dịch “nāga” 48 khoá, “rồng” 1 khoá; bv 6 “nāga” và 5 “rồng”; chọn “nāga”, cùng `21.2`.
  - `34.2` (tiền lệ `ja494:1.2` “điều làm dựng tóc gáy”): `lomahaṁsana` ở bv dịch “rợn da gà” (`bv14:12.2`, `bv23:6.2`, và 9 khoá trùng nguyên văn cho cả dòng `abbhutaṁ lomahaṁsanaṁ`), nên dùng “rợn da gà”.
  - `44.1`, `51.3`, `58.1`, `75.1` (tiền lệ `sn8.6:3.3` “Xá-lợi-phất”): trong kn, `Sāriputta` giữ nguyên Pāli 16/16 khoá (tha-ap 7, thag 9); sn mới có 22 “Xá-lợi-phất” trên 568 khoá.
  - `45.1` “Như cây sāla chúa nở rộ hoa,” (tiền lệ `tha-ap404:5.1` “sa-la”): theo `bv17:22.1` (cùng bv).
  - `46.1`, `55.1` `dīparukkha` “cây đèn” (tiền lệ `tha-ap508:1.3`, `tha-ap389:1.3` “ngọn đèn cây sáng tỏ”; `bv3:27.3` và `tha-ap395:1.2`, `tha-ap411:29.4` dùng “cây đèn”).
  - `47.3` (tiền lệ “Của những bậc đã đoạn tận lậu hoặc, không cấu uế,” 19 khoá): các tiền lệ đều ở sở hữu cách (“của …”). Ở đây `khīṇāsavānaṁ vimalānaṁ` là tân ngữ của `sannipātayi` (cách dùng sở hữu thay đối cách), nên viết “Những bậc …”.
  - `51.1` `Khīṇāsavehi vimalehi` (tiền lệ `bv3:17.3`, `bv4:35.1` “Nhờ các bậc …”): ở đây là cách đi cùng (“cùng với”), không phải phương tiện.
  - `54.2` (tiền lệ `tha-ap343:4.2` viết hoa “Đấng Tự Tại, Đấng Dẫn Đạo thế gian”): viết “đấng Tự Tại, bậc Dẫn Đạo thế gian” theo dạng đa số (`lokanāyaka` → “bậc Dẫn Đạo thế gian” 157 trên 213 khoá; bv 30/30).
  - `66.4` (tiền lệ `mil1:4.4` “kinh ngạc nhờ, thấm sâu, chấn động tận lông da.”): khoá tiền lệ đó dịch một chuỗi khác nghĩa; dùng “đáng kinh ngạc, rợn da gà” như các khoá bv.
  - Trùng trong chính bài: 27 nhóm Pāli trùng (so sau khi bỏ dấu câu và chữ hoa), tổng 43 cặp: `4.1`/`5.1`; `11.3`/`12.3`; `11.4`/`12.4`; `13.1`/`25.1`; `13.4`/`14.4`; `19.1`/`27.1`; `19.3`/`57.3`; `19.4`/`25.4`/`30.4`/`57.2`; `20.6`/`55.4`/`56.2`; `22.4`/`35.4`; `23.1`/`37.3`; `23.2`/`37.4`; `26.2`/`27.2`; `26.3`/`27.3`; `26.4`/`27.4`; `28.1`/`72.1`; `28.4`/`72.6`; `29.4`/`32.4`/`33.4`; `39.4`/`40.4`/`71.4`; `40.3`/`59.3`; `44.1`/`51.3`/`58.1`/`75.1`; `44.2`/`75.2`; `45.2`/`54.4`; `45.3`/`55.3`; `46.1`/`55.1`; `51.4`/`52.4`; `69.3`/`72.3`. Bản Việt giống hệt nhau (không kể chữ hoa đầu dòng) trong 40 cặp; **3 cặp khác có chủ ý**: `13.4`/`14.4` (`caṅkame ratanāmaye`, hình thức `-e` vừa là đối cách số nhiều vừa là vị trí cách số ít: 13.4 là tân ngữ “các đường kinh hành”, 14.4 là chỗ “bên … con đường kinh hành”), `20.6`/`56.2` và `55.4`/`56.2` (`passanti lokanāyakaṁ`: ở 20.6 và 55.4 chủ ngữ chưa nêu nên thêm “họ”, ở 56.2 chủ ngữ đã đứng ở 56.1 “Cả năm trăm tỳ-kheo,”). Nhóm `4.1`/`5.1` giống hệt Pāli nên Việt giống hệt; hai khoá `4.2`/`5.2`, `4.3`/`5.3`, `4.4`/`5.4` khác Pāli (`kīdisa` so với `edisa`) nên Việt khác (“như thế nào” so với “như thế này”).

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có).
  - `caṅkama` → “kinh hành” (103/194 khoá; không có dạng khác đứng đầu). `pāṭihīra` → “thần thông”, `accheraka pāṭihīra` → “phép thần thông kỳ diệu”, `iddhi` cũng “thần thông” (`bv23:5.2` “thực hiện thần thông”); ba `pāṭihāriya` ở `12.1` “thần thông, biết tâm và giáo giới” theo `dn11:3.10`.
  - `lokanāyaka` → “bậc Dẫn Đạo thế gian” (213 khoá: 157 dạng này, 16 “Lãnh đạo thế gian”; bv 30/30). `lokanātha` → “bậc Lãnh Đạo thế gian” (bv 4/4), nên 41.4 dùng “Lãnh Đạo”. `narāsabha` → “đấng Nhân Ngưu” (90/129; bv 10/10). `naruttama` → “bậc tối thượng giữa loài người” (`thi-ap24:5.2`, `dn30:1.6.21`). `lokajeṭṭha` → “bậc Trưởng Thượng thế gian” (bv và tha-ap, đúng nguyên văn 29 khoá). `mahāvīra` → “Đại Anh Hùng” (134/169; bv 33/33). `mahāmuni` → “Đại Mâu-ni” (bv 20/20). `vināyaka` → “bậc Điều Ngự” (42/62; “hướng dẫn” 9, “hướng đạo” 4, “dẫn dắt” 3). `cakkhumā` → “bậc có mắt” (bv 11/11). `jina` → “bậc Chiến Thắng”. `dhīra` → “bậc trí” (`bv28:19.4`, `bv10:4.3`, `tha-ap329:11.3`). `tādī` số ít → “bậc Bất Động” (`tha-ap24:7.4`), số nhiều “bất động như vậy” (bv 24/25 khoá có `tādi-`). `anadhivara` → “Vô Thượng” (`vv16:3.4`).
  - `pañjalīkata`/`katañjalī` → “chắp tay” (77/83 khoá). `tuṭṭhahaṭṭhā pamoditā` xem mục trùng. `udaggacitta sumana` → “với tâm phấn khởi, hoan hỷ” (đúng nguyên văn `thi-ap8:8.1` …, 3/3). `acchariya` → “điều kỳ diệu” (`bv14:12.1`, `bv23:6.1`, `bv26:16.1`); `abbhuta lomahaṁsana` → “đáng kinh ngạc, rợn da gà” (9/9).
  - `Tāvatiṁsa` → “Tam Thập Tam” ở 7.1 và 20.1 (4/4 tiền lệ trùng nguyên văn ở `sn5.7`, `thig8.1` cho 20.1; toàn tầng “Ba Mươi Ba” 226 khoá và “Tam Thập Tam” 25 khoá; chọn dạng có tiền lệ đúng nguyên văn, ghi hai số). `Nimmānaratī` → “Hóa Lạc” (36/46 khoá), `Paranimmitavasavattī` → “Tha Hóa Tự Tại” (27/51 khoá; chỉ “Tự Tại” 7), `Cātumahārājika` → “Tứ Đại Thiên Vương” (dn11, dn23), `Ābhassara` → “Quang Âm”, `Subhakiṇha` → “Biến Tịnh”, `Vehapphala` → “Quảng Quả” (`mn1:13.1`), `Akaniṭṭha` → “Sắc Cứu Cánh” (`mn41:18-42.33`; tầng có cả dạng giữ Pāli), `Brahmakāyika` → “Phạm chúng” (`dn11:79.6`).
  - `gandhabba` → “càn-thát-bà” (dn21), `rakkhasa` → “la-sát” (`dn30:1.9.21`), `kinnara` giữ Pāli (`thi-ap32:2.2`), `supaṇṇa` giữ Pāli (`dn20:11.12`). `saṅkha`/`paṇava`/`ḍiṇḍima` → “tù và” / “trống chầu” / “trống cơm” (`dn2:90.1`, `dn10:2.27.3`). `candanacuṇṇa` → “bột đàn hương” (`dn16:5.2.4`). `mandārava`, `pārichattaka` giữ Pāli như `bv16:10.1`–`10.2`, `bv19:11.1`–`11.2`.
  - `amataṁ padaṁ` → “cảnh giới bất tử” (24/34 khoá; riêng tha-ap 16/20). `sampajāna` → “tỉnh giác”. `kaṅkhā` + `vinodeti` → “xua tan hoài nghi” (`mn92:19.10`). `dānaṁ sīlañca nekkhammaṁ` → “bố thí, giới, xuất ly”. `paññā` → “trí tuệ”, `viriya` → “tinh tấn”, `khanti` → “nhẫn nại”, `sacca` → “chân thật”, `adhiṭṭhāna` → “quyết định” (`dn33:1.11.149`), `mettā`/`upekkhā` → “từ”/“xả”. `pubbenivāsa` → “túc mạng” (20 khoá; “quá khứ” 159 là cho ngữ cảnh khác; “tiền kiếp” 11). `byāmappabhā` → “hào quang một sải” (`bv22:24.1`). `dibbacakkhu` → “thiên nhãn” (75/75). `sagārava sappatissa` → “tôn kính … kính trọng”. `subbata` → “giữ trọn giới hạnh” (`an5.179:17.2`). `mahiddhika` → “có đại thần lực” cho chư thiên và nāga (25.2, 31.2; “đại thần lực” 65 khoá trên 178 khoá chứa `mahiddhik-`) nhưng “đại thần thông” cho Moggallāna (59.4; đúng nguyên văn `thag20.1:70.2` “Moggallāna, bậc đại thần thông;”, 26 khoá “đại thần thông”). `dhutaguṇa` → “các đức hạnh đầu-đà” (`bv17:8.2`).
  - Tên riêng: `Sahampati`, `Sāriputta`, `Moggallāna`, `Mahākassapa`, `Anuruddha`, `Upāli`, `Puṇṇa`, `Mantānī`, `Gijjhakūṭa`, `Sineru`, `Tusita`, `Yāma`, `Santusita` giữ dạng Pāli có dấu (đúng thông lệ kn: Sāriputta 16/16, Moggallāna 10/10, Mahākassapa 7/7, Anuruddha 15/15). `Santusita` (67.2) là tên Đức Phật khi ở Tusita; 0 tiền lệ.
  - Nháy: nháy kép mở 2.3 đóng 2.4; 4.1–6.4; 23.4–24.4; 28.1–28.4; 34.1–34.4; 38.1–49.4 (một lời bao cả dòng tường thuật 44–47, giữ nguyên theo Pāli từng khoá); 65.1–72.6, trong đó nháy đơn 68.1–68.4 lồng; 76.1–78.4; 81.1–82.4. Đã kiểm khớp Pāli từng khoá: 0 lệch trên 334 khoá (20 khoá có dấu nháy).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `15.1` `Tulāsaṅghāṭānuvaggā`: 0 tiền lệ trong tầng. Dịch sát chữ “có xà ngang và khung nối nối tiếp nhau” (`tulā` xà ngang, `saṅghāṭa` khung nối, `anuvagga` nối tiếp). Cách đọc khác: `tulā` = “cân xứng”, `saṅghāṭa` = “đôi”, tức hai con đường cân xứng thành đôi.
  2. `14.3`–`14.4` `sabbasoṇṇamayā passe, caṅkame ratanāmaye`: Pāli không nêu danh từ cho `sabbasoṇṇamayā`; đọc là một đường kinh hành toàn bằng vàng đặt bên cạnh đường châu báu (14.2 là `caṅkamaṁ`). Cách đọc khác: `passe` “ở hai bên”.
