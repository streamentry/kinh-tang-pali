notes: |-
  **Phạm vi: đúng một khoá** (`bv1:1.1`) trong 334 khoá Pāli — đây là
  `missingAll` của `scripts/queue.ts`, không phải phần `missing` mà metric coverage
  đếm. Tôi dịch khoá được giao và **không** tự thêm 333 khoá còn lại.

  **Tiêu đề.** `bv1:0.2` = *1. Ratanacaṅkamanakaṇḍa*. `Ratanacaṅkamaṇa` là đường đi
  lát ngọc mà chính ngài Bồ-đề dựng lên trên trời (`bv1:6.3–4`: *Caṅkamaṁ māpayissāmi,
  nabhe ratanamaṇḍitaṁ*), `kaṇḍa` là phần/chương. Tôi dịch tiêu đề là *Phẩm Đường Ngọc*.
  Tên đầy đủ *Buddhavaṡsa* dịch là *Dịch Bảo Kệ* — 0 tiền lệ trong tầng Việt, đặt
  theo nghĩa chữ (bảo quý viết thành kệ). `Buddhavaṡsa` chỉ xuất hiện ở 25 phẩm bv,
  chưa phẩm nào có bản Việt trước đây.

  Câu này xuất hiện **17 lần** trong snapshot Pāli đã ghim. Trong tầng Việt
  đã có sẵn **hai** cách dịch khác nhau, nên đây là chỗ bắt buộc phải tra tiền lệ:
  *Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác.* (`pv1:1.1`, `ja1:1.1`,
  `thag1.1:1.0.2` — 3/5 cách đã có), *Kính lễ Đức Thế Tôn, …* (`kp1:1.1`) và
  *Kính lạ Đức Thế Tôn, …!* (`thig1.1:1.0`). Tôi dùng lại nguyên văn cách đa số.

  **Bất định đã ghi nhận, chưa có cách nào tuyệt đối:** `bhagavato` là
  *Bậc Đã Được Vinh Danh*, mà *Đức Thế Tôn* giữ nghĩa đó sát hơn *Đức Phật*. Tôi vẫn
  chọn *Đức Phật* vì đó là cách đã có sẵn 3/5 trong tầng và là lối đọc quen với người
  Việt; ở chính lát này tôi dùng *Đức Thế Tôn* cho `bhagavato` ở chuỗi `bhagavato
  vaṁso` (xem `notes` của các phẩm bv), vì đó là cách dùng quen thuộc cho các Đức
  Phật quá khứ. Biên tập có thể muốn thống nhất hai chỗ này.

  **Không có tầng Anh.** 0/334 khoá có Anh Sujato; `translation/vi/phantuananh/`
  chỉ có Pháp Cú. Đối chiếu chỉ có Pāli + tiền lệ trong tầng Việt, nên `triangulation`
  ở mức thấp của lát. Lỗi chính ở đây là chữ *Đức Phật* ở `bhagavato` (xem mục bất định
  ở trên); vì vậy `ambiguity_integrity` ở 9.3 chứ không 10.
