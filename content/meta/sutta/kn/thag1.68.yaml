notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ của bài kệ dưới 40 ký tự, nên assertion không tự chạy). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Dòng lược kết `:1.5` giữ nguyên hai dấu lược.** Pāli là `… <tên> thero …. `; tôi viết `… Trưởng lão <tên> ….`, đúng dạng `thag1.98`, `thag1.101`, `thag1.106` đã có trên đĩa, và **không** mở rộng thành *Bạch Thế Tôn, vị trưởng lão … đã từng nói bài kệ này* như nhóm `thig1.10`–`1.16` đang làm — BRIEF_VI3 §10.1 nói thẳng Pāli có dấu lược thì bản Việt giữ lược, mở rộng là thêm chữ KHÔNG ĐÁNH DẤU. Tên ở `:1.5` tôi dùng **dạng gốc** cho khớp tên ở `:0.4`, đúng cách 20 tệp thag/thig đã làm, dù Pāli dùng dạng chủ cách.

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Ekakanipāta` → *Bộ Một Bài Kinh* (160 chỗ trên đĩa, thắng *Phẩm Một Pháp* của 27 tệp `iti`). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>*. `Tatiyavagga` → *Phẩm Thứ Ba* (`iti21`–`iti26`), `Catutthavagga` → *Phẩm Thứ Tư* (`iti80`–`iti85`), `Pañcamavagga` → *Phẩm Thứ Năm* (`iti90`–`iti92`), `Sattamavagga` → *Phẩm Thứ Bảy* (`thag1.66`). Với `Chaṭṭhavagga`, `Aṭṭhamavagga`, `Navamavagga` chưa có tiền lệ nào trong tầng, tôi đặt mới *Phẩm Thứ Sáu* / *Thứ Tám* / *Thứ Chín* theo đúng công thức số thứ tự của loạt `Phẩm Thứ Hai`…`Thứ Mười Hai`. `Theragāthā 1.N` giữ **số** như `thag1.42`, `thag1.101`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có Pháp Cú), nên `triangulation` là Pāli + English Sujato. Bản Anh đã ghim có prose ở **8/9** khoá của mỗi bài; khoá trống duy nhất là `:1.5`, tức dòng lược — đúng như BRIEF_VI3 §10.1 nói, chỗ đó Pāli phải tự đứng vững.
  **Bốn vế PĀLI TRÙNG NGUYÊN VĂN với `ud4.7:4.1`–`4.4` — tôi dùng lại nguyên văn bản dịch đã có, KHÔNG dịch lại.** Đã đối chiếu từng khoá: `1.1` khớp *“Bậc ẩn sĩ có tâm cao thượng, không phóng dật,* · `1.2` khớp *đang học tập trong các đường lối của bậc ẩn sĩ;* · `1.3` khớp *thì không có sầu khổ cho vị bất động như vậy,* · `1.4` khớp *vị tịch tịnh, luôn luôn chánh niệm.”*. Chỉ khác đúng một thứ: Pāli `thag1.68:1.4` có `”ti` còn `ud4.7:4.4` thì không, nên bản Việt của tôi đóng `”ti.` thay vì `.”` — theo đúng hình thức dòng kết của thag.

  **Vì sao đây là cặp trùng này mà không phải cặp khác.** `ud4.7` là bài Udānavarga `Sāriputtasutta`; nó dùng lại đúng bốn vế của bài thag này. Vì luật của kho là *Pāli trùng thì dùng lại nguyên văn cách dịch đã có*, nếu tôi dịch lại bằng chữ khác thì một câu Pāli duy nhất sẽ có hai bản Việt trong cùng tầng — đó là lỗi. Đây cũng là lý do `semantic_fidelity` và `segment_alignment` của bài này cao hơn các bài kệ khác của lát.

  **Bổ ý đã kiểm chứng:** `adhicetaso` → *có tâm cao thượng*; `appamajjato` → *không phóng dật* (tiền lệ `an10.15:1.2` cho `appamāda`); `Munino` → *bậc ẩn sĩ*; `monapathesu` → *đường lối của bậc ẩn sĩ*; `sikkhato` → *đang học tập*; `tādino` → *vị bất động như vậy*; `upasanta` → *tịch tịnh*; `satīmato` → *luôn luôn chánh niệm*. Tất cả đã có sẵn trong `ud4.7` nên không có thuật ngữ đặt mới.

  **Tên riêng.** `Ekudāniya` ở `:0.4` và `:1.5` giữ dạng gốc; Pāli `:1.5` là `Ekudāniyo` (dạng chủ cách) — tôi dùng dạng gốc cho khớp tên bài kệ, đúng cách `thag1.101` đã làm.

  **Vì sao `triangulation` 9.5, cao nhất lát.** Pāli + bản Anh Sujato của chính bài + bản Việt đã `published` của `ud4.7` cho đúng bốn vế trùng Pāli: đây là bài có đối chiếu độc lập dày nhất, và cả hai lớp Anh đều không mâu thuẫn.
