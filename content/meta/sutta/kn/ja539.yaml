  - Số Pāli:
    `sattasatā bhariyā` (`78`–`80`, `111`–`113`, `121`–`126`) = satta 7 × sata 100 = bảy trăm; `satapalaṁ kaṁsaṁ` (`81.1`, `127.1`) = sata 100 + pala = một trăm lạng (pala) đồng thau; `satarājikaṁ` (`81.2`, `127.2`) = sata 100 + rājikā = một trăm đồng vàng (theo `thag1.97:1.2`, `thag16.7:21.2`, 2/2); `soḷasete mahānidhī` (`13.4`) = soḷasa 16 = mười sáu đại kho báu, và cách đếm các kho báu ở `11`–`13` khớp 16 như sau: mặt trời mọc, mặt trời lặn, bên trong, bên ngoài, không trong không ngoài (5); chỗ bước lên, chỗ bước xuống (7); bốn cây sāla lớn (11); quanh một do-tuần (12); đầu ngà (13); đầu sợi tóc (14); Kepuka (15); ngọn cây (16); `catūsu mahāsālesu` (`12.3`) = catu 4 + mahāsāla = bốn; `sahassathāmo` (`13.5`) = sahassa 1000 + thāma sức = sức ngàn người; `sattāhasammeghe` (`116.1`) = satta 7 + āha ngày = bảy ngày; `sattatantiṁ` (`119.2`) = satta 7 + tanti dây = bảy dây; `catutthe bhattakāle` (`160.1`) = thứ tư (catuttha) bữa ăn; `dutiyābhisecanaṁ` (`127.4`) = thứ hai (dutiya); `dunīvarā` (`163.2`) = du hai + nīvara vòng, đối chiếu `ekanīvaro` (`164.2`) = eka một + nīvara vòng; `dvedhāpatho` (`167.1`, `175.1`) = dvedhā hai nhánh; `dvīhi cakkhūhi` (`171.1`) = hai mắt; `ekaṁ cakkhuṁ` (`169.5`, `172.1`) = một mắt; `tipuraṁ` (`35.2`) = ti ba + pura thành = ba lớp thành (xem bất định). Không có cụm số chưa phân xử được trừ hai chỗ nhận xét ở bất định (`satarājikaṁ` và `tipuraṁ`).
