    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng và tên vải, hoa, đàn có ghi chú (`Jātaka`, `Mūgapakkha`, `Mahājanaka`, `Mithilā`, `Sīvalī`, `Nārada`, `Kassapa`, `Dīghāvu`, `Thūṇa`, `Upasenī`, `Kāsi`, `koṭumbara`, `mandālaka`, `vīṇā`, `sāla`). Đã in cặp Pāli↔Việt ra đọc toàn bài (763 cặp) và sửa sau lượt đọc: đổi "thợ làm xe" thành "thợ xe" (27 so với 10), "dân xứ" thành "dân chúng", thống nhất "tôi" cho vua khi nói với Nārada (`135`, `149`, `153`, `154`), đổi "chưa từng có" thành "chưa bao giờ" ở `145.1`/`148.1`, thay "phố chợ" bằng "cửa hàng" theo `tha-ap8:88.2`, và đưa các dòng trùng nguyên văn với tầng về đúng cách dịch đã có.
