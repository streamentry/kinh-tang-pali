notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Tra tiền lệ (đếm được):** gọi thẳng `jana` → *này người* (118 chỗ, `an4.159:5.4`
  "này người em gái", `an3.36:5.3` "này người kia"); `piṇḍa` (thức ăn xin) — 0 tiền lệ
  riêng ở khoá này, tôi dùng *thức ăn* theo nghĩa chung.
  **Bối cảnh đã đọc trước khi dịch:** `160.5` là `Tayidaṁ na sādhu tayidaṁ na suṭṭhu`
  (điều ấy không tốt, không đàng hoàng) rồi tới khoá của tôi. Nghĩa là người nói đang
  **mỉa** người nghe, nên `bhuñjase` là lời chửi chứ không phải lời chúc. Tôi dịch
  *thì cứ ăn đi* cho đúng giọng mỉa; dịch "cầu cho bạn ăn" thành lời chúc sẽ **đảo**
  ngược ý.
  **Bất định đã ghi:** (1) `bhuñjase` có thể là nguyên/mong muốn, cũng có thể là mệnh
  lệnh; tôi chọn cách đọc mỉa vì đặt cạnh `na sādhu … na suṭṭhu`. (2)
  `sunakhucchiṭṭhakaṁ` — `suna` (chó) + `kucchi` (xương) + `ṭṭhaka` (mảnh vụn) — tôi
  dịch *một mẩu xương chó*. 0 tiền lệ cho `ṭṭhaka`; tôi chọn *mẩu* theo nghĩa "mảnh
  nhỏ", và **không** nhân lên thành "xương chó vụn" vì Pāli không nói vụn. (3) `luḷitaṁ`
  ở `160.3` = *liếm sạch*, tôi không dịch vì ngoài lát; nhưng nó cho thấy giọng mỉa
  của cả đoạn, nên củng cố lựa chọn ở (1).
  **Dấu ngoặc kép:** Pāli chỉ có `”` đóng, không có `“` mở trong khoá này, nên tôi dùng
  `’` thay cho `”` (xem ghi chú ở `ja353`).
