  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 213 khoá chênh lệch lớn nhất trên 763 khoá (phần lớn chỉ khác ngắt dòng hay diễn đạt) → khác nghĩa 16: sửa 1 cụm (`157.1`, `158.1`–`158.3`, `158.6`: người nghe của `157`–`159` đổi từ "ngài" trung tính, người nói "tôi" sang vua nói với Sīvalī, "ta"/"nàng", vì `158.3` `rajjaṁ tuvaṁ kārayasi` hướng tới người đang trị vì, `159.2` `yāpehi` là mệnh lệnh ngôi hai, và `160` là lời Sīvalī đáp thẳng việc sống bằng khất thực của `159`; bản cũ ghi người nghe là Nārada, người không trị vì), giữ 3 (`50.1` và các khoá song song `gāmaṇīyehi`: "trưởng làng" theo 11/11 khoá tiền lệ, bản mù "thủ lĩnh" không có căn cứ trong tầng; `45.1`/`46.1` `pallaṅka`: "ghế dài" 5/5 trong Jātaka, bản mù "giường"; `136.3` `atīraṇeyya`: khác diễn đạt, cùng ý "chưa xong"), bất định 12 (`53.3`–`69.3`, `86.3`–`102.3` `dīpe … veyyagghe` là báo và hổ thật hay da báo và da hổ; `81.2`/`127.2` `satarājikaṁ`: "một trăm đồng vàng" theo `thag1.97` hay "có trăm đường vân" như `ja547:198.2`, hai cách đọc trong tầng không khớp nhau; `13.2` `kepuke`; `18.4` `maccumupabbajanti` (Pāli ja539 là `maccu`, `ja483:5.4` là `macca`); `135.5` `missaṁ nandīhi`; `142.1`–`142.2` `sannataṁ`/`unnataṁ`; `147.3`–`147.6` `na hi kappaṁ vā vijjaṁ vā paccakkhāya`, phủ định đi với `paccakkhāya` hay `āhu`; `154.4` `aniketamasanthavaṁ` thiếu vị ngữ trong Pāli; `156.2` `paṭicchadaṁ`; `160.2` `ajuṭṭhamārī`; `162.1` `upaseniye` là tên hay danh xưng; `166.3`/`174.3` `garahittho`). Review đối kháng toàn bài thêm: nháy kép và nháy đơn khớp Pāli từng khoá (0/763 lệch), không có dấu lược ở Pāli lẫn Việt, 111 cặp trong bài khác nhau đều đã có lý do, số Pāli không đổi. Các chỗ bất định trên giữ nguyên câu chữ, không thêm vào thân kinh. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bài 763 khoá, đoạn song song
  ja529:49, ja547:148, tha-ap410:20, ja313:1, sn4.18:4, dhp200, thag1.97 kèm bản Anh Sujato của
  thag1.97; không có bản Việt nguyên bài): sửa 24 khoá. Sai nghĩa: 144.4 kasmā tetaṁ aruccatha là
  aorist của ruccati (a- là tăng âm, không phải phủ định), "vì sao điều này không hợp ý ngài" →
  "vì sao ngài lại ưa thích điều này"; 18 khoá 53.3–69.3 (lẻ) và 86.3–102.3 (lẻ) dīpe/dīpā …
  veyyagghe/veyyagghā là tính từ hợp cách với cỗ xe (veyyaggha là dạng phái sinh "thuộc về hổ"),
  "có báo và có hổ" → "có da báo và cả da hổ" theo ja547:148.3, tha-ap410:20.3 (ja529:49.3 còn
  dịch cũ, ngoài phạm vi); 157.6 pajāpati là hô cách giống cái "người vợ" (như vv41:6.3, mnd15:74.6),
  hợp với người nghe Sīvalī của 157–159, → "hỡi hiền thê" (cách đọc khác: danh xưng của Dīghāvu).
  Rõ nghĩa: 3.3, 139.1–139.2, 140.3 ("đến chỗ ngài"); dấu câu 176.4 (nháy trước dấu chấm). Giữ:
  81.2/127.2 satarājikaṁ (Sujato thag1.97 cũng hiểu là số lượng), 131.4 theo ja313:1.4, 133.3 theo
  sn4.18:4.3. Bất định mới: migājina ở 145, 146, 148, 150, 151 có thể là tên một ẩn sĩ khác (khi đó
  143–144 là lời người ấy, không phải Nārada); chưa đổi vì Pāli đã ghim không có văn xuôi để kiểm.

  Lô G4 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): sửa khuôn kệ Āsīsetheva/Vāyametheva puriso. Bản
  cũ dịch Chỉ nên … người đàn ông, trong đó eva bị đọc thành chỉ (giới hạn) và puriso thành hô ngữ;
  Pāli puriso là chủ ngữ (danh cách), eva nhấn mạnh động từ ước định. Nay dịch Người đàn ông nên cứ
  mang hy vọng / nên cứ cố gắng, khớp bản Anh Sujato A man should have hope / make an effort ở ja51,
  ja52. Áp dụng đồng loạt cho ja51, ja52, ja483, ja539 (14.1–17.1 ở bài này). disampati ở 20.2 đã là
  chúa tể các phương, giữ.
