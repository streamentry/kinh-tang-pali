notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja539_root-pli-ms.json` (763/763 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ: bốn dòng tiêu đề `0.1`–`0.4`, 176 bài kệ (`1`–`176`; 147 bài bốn dòng, 28 bài sáu dòng, riêng `159` hai dòng) và dòng kết bài `177.1`; phần văn xuôi khung truyện không nằm trong tầng Pāli đã ghim, nên người nói được suy từ xưng hô, nháy và mạch của chính các bài kệ. Nội dung chính (suy từ kệ): người đang bơi giữa đại dương, không thấy bờ, bị một vị thiên nữ chất vấn và đáp rằng vẫn nên nỗ lực (`1`–`9`); vị thiên khen sự nỗ lực ấy và nói về kho báu, rồi các câu về hy vọng và nỗ lực (`10`–`19`); triều thần than vua không còn ham múa hát (`20`–`21`); người ấy, khi đã ở ngôi vua Mithilā, nghĩ đến chuyện bỏ hết để xuất gia (`22`–`120`: các dòng bắt đầu bằng "Bao giờ ta…" và "Bao giờ đây…"); các bà vợ khóc, vua ra đi với chiếc bát đất (`121`–`127`); lời can ngăn vì lửa và giặc, vua đáp là mình không còn gì để mất (`128`–`133`); cuộc đối đáp với một vị bà-la-môn tên Nārada Kassapa (`134`–`156`, gồm chuyện hai cây xoài ở `149`–`154`); lời đáp về việc sống bằng đồ khất thực (`157`–`161`); đối thoại với Sīvalī, cô gái đeo vòng và người thợ làm tên, kết bằng lời bảo Sīvalī hãy sống một mình (`162`–`176`).
  - Tầng tham khảo:
    Tầng English của Sujato không có ja539 (ja chỉ có 83 tệp: ja1–79, ja126, ja159, ja466, ja534; đây là not-published-upstream, không phải not-synced); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Tiền lệ Việt trong tầng do cùng một nhóm dịch, nên không phải đối chiếu độc lập; tôi không dùng bản tóm lược hay bản dịch ngoài tầng đã ghim làm câu chữ hay đối chiếu. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`. Bản dịch một khoá (`160.6`) có từ lượt trước được thay bằng bản dịch đủ 763 khoá này; cách hiểu `bhuñjase` đổi từ mệnh lệnh mỉa sang hiện tại ngôi hai "ngài lại ăn…" (accuracy fix, vì `160.5` đã kết luận điều ấy là không tốt, không đúng đắn).
