notes: |-
  **Phạm vi: đủ 88/88 khoá của bài, không khoá nào ngoài danh sách.** Thứ tự khoá trong tệp
  bản dịch bằng đúng thứ tự Pāli (kiểm bằng phép so danh sách, không dùng phép cân tổng).

  **Nguồn và coverage — đo theo công thức khai ở `source/layers.yaml`
  (`substantivePaliMinChars: 40`, bỏ khối `:0`), tầng Anh tra qua manifest đã ghim:**
  · Độ dài Pāli lớn nhất của khoá thân bài là **27 ký tự**, toàn kệ ngắn ⇒ **mẫu số cổng = 0/85**.
    ⚠ Cổng coverage **không đo được gì** ở bài này; con số hiển thị không phải bằng chứng
    Sujato dịch đủ.
  · Đo thô thay thế, trên khoá thân bài (bỏ ba khoá tiêu đề `0.1`–`0.3`, còn 85 khoá `1.1`–`22.1`):
    bản Anh Sujato đã ghim **có tệp** `thig13.2_translation-en-sujato.json` (tầng `thig` có 73 tệp
    theo manifest), **84/85 khoá có chữ = 98,8%**; khoá duy nhất để trống là `22.1` (colophon
    `… Rohinī therī ….`). Bỏ riêng colophon thì 84/84 = 100%. Ba khoá `0.x` cũng có chữ. Cả hai số
    đều ≥ 0,80, không cần entry `reference-gaps`.
  · Tầng `english-project` **vắng** (không có tệp cho uid này, và không cần lấp vì không có khoá
    kệ nào Sujato bỏ trống ngoài colophon). Tầng `vietnamese-current` **vắng** (tại commit đã ghim
    thư mục Việt hiện hành chỉ có Pháp Cú). Bản Việt nguyên bài của SuttaCentral (Bhikkhu
    Indacanda, nhóm Hai Mươi, 13.2) chỉ là mục *Tra cứu toàn văn* ở cuối trang, không phải tầng
    store, nhưng đã đọc để đối chiếu cách đọc cú pháp. ⇒ `triangulation` **8,9**: Pāli + một tầng
    Anh đủ, không có tầng Việt phân đoạn, không có bản Anh độc lập thứ hai.

  **Tái dùng nguyên văn — dựng chỉ mục Pāli→Việt ở mức segment trên toàn tầng `kn`:**
  **12 khoá** của bài có Pāli trùng nguyên văn với khoá ở bài khác đã dịch (**12 cặp trùng ngoài
  bài đã dò**), trong đó bản Việt **khác ở 8 cặp**. **6 cặp trong 8 đó** là **khác vì ngôi nói**
  (cùng Pāli nhưng người nói/người được nói tới đổi): `18.4` *ông*→*cha*, `19.4` *ông*→*cha*,
  `20.1`/`20.3`/`20.4` *tôi*→*cha*, `21.1` *ta/tôi*→*cha* (người cha Bà-la-môn tự xưng với con
  gái; `thig12.1` là người chồng, `thag3.1` là chính vị trưởng lão). **2 cặp còn lại** (`9.1`,
  `10.1` so với `thi-ap38:3.1`) chỉ khác chữ hoa đầu câu (*Đa văn, thọ trì pháp,* so với *đa văn,
  thọ trì pháp,*), vì ở đây đứng đầu câu. **4 cặp trùng giữ nguyên văn bản Việt cũ**: `19.1`, `19.2`,
  `19.3`, `20.2` (đều từ `thig12.1:14.x`/`15.2`).

  **Cặp Pāli trùng TRONG CHÍNH bài: 4 nhóm trùng (10 + 2 + 2 + 2 = 16 khoá), 0 cặp bản Việt
  khác.** `x.4` `tena me samaṇā piyā.` trùng **10 khoá** (`5.4`–`14.4`; `15.4` có nháy đóng nên
  Pāli là `piyā”.`, **không** tính là trùng); `9.1` ≡ `10.1`, `9.2` ≡ `10.2`; `19.2` ≡ `20.2`; mỗi
  nhóm một câu Việt.

  **Năm phép kiểm (tự viết, in số kèm mẫu số):**
  · (1) `set(khoá Việt) == set(khoá Pāli)`: **88 / 88**, thiếu **0**, thừa **0**; thứ tự khoá khớp
    Pāli. Phép **có đo được**.
  · (2) Nháy kép **khớp Pāli từng khoá**: lệch **0**. Pāli mở `“` ở **5 khoá** (`1.1`, `4.1`,
    `16.1`, `18.3`, `20.1`) và đóng `”` ở **5 khoá** (`3.4`, `15.4`, `18.2`, `19.4`, `21.4`); Việt
    cùng 5 + 5 khoá, cùng vị trí. Nháy đơn: Pāli có `‘…’` ở `1.1` và `1.2`; Việt cũng đúng hai
    khoá đó, lệch **0**. `15.4`, `19.4`, `21.4` Pāli kết `”.` ⇒ Việt kết `”.`; `3.4` Pāli kết `”.`
    nhưng là câu hỏi nên Việt kết `?”`; `18.2` Pāli kết `”;` ⇒ Việt `”;`.
  · (3) Pāli trùng nguyên văn trong bài: **4 nhóm** (16 khoá), bản Việt khác **0**. Phép **có đo
    được**.
  · (4) Dấu lược: Pāli có `…` ở **1 khoá** (`22.1`, **2** dấu); Việt cũng **2**, lệch **0**. Mở
    rộng lược (Pāli không có `…` mà Việt có): **0**. `… cho đến …`: **0**. `(…)` trần: Pāli **0**
    khoá, Việt **0**. Pāli kết `….` ở `22.1` ⇒ Việt kết ` ….`.
  · (5) Số Pāli, thêm NFC, khoá rỗng, khoảng trắng: chưa NFC **0**; khoá rỗng **0**; khoảng trắng
    thừa hoặc hai dấu cách **0**; Pāli lọt sang Việt chỉ là tên riêng/tên kinh/tên sách
    (`Rohinī`, `Therīgāthā`, `Veda`), giữ nguyên có chủ đích. `0.1` (*Therīgāthā 13.2*) trùng
    nguyên văn Pāli có chủ đích, như các khoá `:0.1` khác trong tầng.
  · **Số Pāli** — tự tính: `Vīsati` = 20 ⇒ *Hai Mươi* (`0.2`, theo `thig13.1:0.2`); `tīṇi` = ba ⇒
    *ba gốc rễ* (`6.1`); `tevijjo` ⇒ *tam minh* (ba minh, `21.3`). Công cụ đo số chuẩn của kho
    không theo dõi cụm nào có trong bài này nên ở đây không đo được gì; số do tôi tự tính như trên.
  · Đọc cặp Pāli↔Việt từng khoá (88/88 in ra đọc đối kháng): không có khối nào mang nội dung của
    khối bên cạnh; mỗi khổ `5`–`15` kết bằng đúng điệp khúc *tena me samaṇā piyā*; năm lượt lời
    (người cha `1`–`3`, Rohinī `4`–`15`, người cha `16`–`18.2`, Rohinī `18.3`–`19`, người cha
    `20`–`21`) khớp năm cặp nháy kép.

  **Thuật ngữ — đo trên tầng `kn`, kèm số đếm:**
  · `samaṇa` ⇒ *sa-môn*: **278/320** khoá có `samaṇ-` dùng *sa-môn*, **1** dùng *khổ hạnh*, **0** *tu sĩ*.
    `samaṇī` ⇒ *nữ sa-môn* (`1.4`): **1/1** tiền lệ (`thig7.2:2.2`).
  · `therī` ⇒ *Trưởng lão nữ*: **87** so với *Trưởng lão ni* **74** trên tầng; chọn *Trưởng lão nữ*
    theo khuôn gần nhất `thig13.1:20.1`, `thig12.1:17.1`.
  · Nghiệp: *thân nghiệp / khẩu nghiệp / ý nghiệp* (`7.1`–`7.3`): tầng `kn` **2/2/2** cho ba dạng này,
    toàn corpus *khẩu nghiệp* **42** so với *nghiệp lời* **4**.
  · `parakkama` ⇒ *nỗ lực* (`4.4`): **14** so với *tinh tấn* **17** trên tầng, hai dạng gần ngang;
    chọn *nỗ lực* vì `paññā`, `sīla`, `parakkama` đứng thành bộ ba và *nỗ lực* rõ nghĩa với người đọc
    hiện đại, không đổi nghĩa so với *tinh tấn*.
  · `kittayissāmi`/`kittesi` ⇒ *tán dương*: tầng dịch lớp này bằng *tán dương* (**5**), *tán thán*
    (**5**), *tuyên thuyết* (**7**); chọn *tán dương* vì ở đây là ca ngợi, không phải tuyên bố.
  · `yañña` ⇒ *tế lễ*: **22** so với *lễ tế* **9** (`snp3.4`, `snp2.7`).
  · `ekaggacitta` ⇒ *tâm nhất điểm*: *nhất điểm* **1**, *nhất tâm* **2**, *chuyên nhất* **1** (số
    mẫu rất nhỏ); chọn *nhất điểm* theo `ud4.9:1.9` là dạng danh từ-tính từ cùng cấu tạo.
  · `anuddhata` ⇒ *không dao động*: **5/8** khoá, và cả cặp `mantabhāṇī anuddhato` ⇒ *nói lời chín
    chắn, không dao động* (`dhp363`, `ja269`) dùng lại nguyên văn.
  · `santarabāhira` ⇒ *cả trong lẫn ngoài*: **4** tiền lệ (`thag2.26`, `thag6.4`, `thag14.1`, `thig5.4`).
  · `sukka dhamma` ⇒ *pháp trắng*: **4** khoá (`iti42` ba khoá, `cp22:5.3`), **1** khoá *trong sạch*
    (`ja6:1.2`); giữ *pháp trắng* vì là thuật ngữ cặp với *pháp đen*.
  · `rūpiya` ⇒ *bạc*: **2/2** (`tha-ap452:6.4`, `vv78:3.2`). `dakkhiṇā` ⇒ *vật cúng dường*
    (`kp7:12.1`).
  · `Upehi saraṇaṁ`, `Samādiyāhi sīlāni`, `dhammaṁ saṅghañca tādinaṁ` ⇒ theo khuôn `thig12.1:14.x`
    (*Hãy nương về Đức Phật*; *Hãy thọ trì các giới*; *Pháp, và Tăng đoàn của những bậc như vậy*).
  · `tāta` ⇒ *Cha ơi* (cô con gái gọi cha), `bhoti` ⇒ *này con* (người cha gọi con gái; `1.1`,
    `16.1`): tầng không có tiền lệ cho `bhoti` giữa cha và con; nơi khác `bhoti` là *thưa cô/bà* khi
    người lạ gọi một phụ nữ (`thig12.1:3.1`, `ud2.6:2.2`). Chọn *con* vì quan hệ cha con đã rõ ở `4.1`
    và `2.3`. Người đọc nên biết đây là chọn về xưng hô, không phải nghĩa Pāli khác.
  · Ngôi kể: Rohinī tự xưng *con*, gọi cha là *cha*; người cha tự xưng *cha* (cả ở `20.1`–`21.4`
    khi đã quy y).

  **BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh:**
  · `8.1` `saṅkhamuttāva`: dịch *vỏ ốc và ngọc trai*, đọc `saṅkha` + `muttā` là hai vật và `va` là
    *iva*; Sujato chỉ một vật (*conch-shell*), bản Việt nguyên bài *vỏ sò và ngọc trai*. Pāli không
    có `ca` giữa hai từ, nên cách đọc *và* là cách đọc của bản Việt nguyên bài, không chắc chắn.
  · `14.1` `hiraññaṁ`: dịch *tiền vàng* (Sujato *gold coins*); bản Việt nguyên bài *vàng khối*;
    `thig6.5:3.4` dịch *vàng ròng*; `snp2.7`, `snp4.1` dịch *vàng bạc*. Chọn *tiền vàng* để khác
    `suvaṇṇa` (*vàng*) đứng ngay sau; loại vật chính xác không phân xử được từ Pāli đã ghim.
  · `13.2` `kumbhiṁ` ⇒ *chum* (bản Việt nguyên bài *chum*; `snp3.10:22.1` dịch *nồi* khi là đồ
    nấu); `khaḷopiyaṁ` ⇒ *giỏ* (Sujato *baskets*, bản Việt *giỏ*); đây là hapax trong tầng nên
    nghĩa đồ vật không có tiền lệ nội bộ.
  · `13.3` `Pariniṭṭhitamesānā`: Sujato *prepared by others* (đọc `para`), bản Việt nguyên bài *vật
    thực đã được nấu chín*; tôi dịch *thức ăn đã nấu xong*, bỏ chữ *do người khác*, vì Pāli không
    nói chủ thể.
  · `11.1` `dūraṅgamā`: dịch *đi nơi xa* theo Sujato (*traveling afar*); bản Việt nguyên bài *đi đến
    nơi xa vắng*; sắc thái *sống xa lánh* không loại trừ hẳn.
  · `14.3` `paccuppannena yāpenti` ⇒ *sống bằng những gì hiện có*; Sujato thêm *that day*, Pāli
    không có.
  · `17.3`–`17.4` `paṭigaṇhanti` ở thì hiện tại: Sujato *will henceforth receive*, bản Việt nguyên bài
    *(sẽ) nhận lãnh*; tôi giữ nghĩa hiện tại, không thêm *sẽ*, vì Pāli không có chỉ dấu tương lai.
  · `16.1`–`16.2` `no`/`kule`: `no` đi với `atthāya` (*vì lợi ích cho chúng ta*); `kule` là *trong
    gia đình*, Sujato và bản Việt nguyên bài thêm *của chúng ta*. Tôi viết *trong gia đình này*,
    chỉ cho gia đình của người cha đang nói.
  · `16.3`–`16.4`: `tibbagāravā` đứng cùng `saṅghe` ở khoá `16.4`, nhưng Sujato và bản Việt nguyên
    bài đọc *kính trọng* cho cả ba ngôi báu; tôi giữ *vô cùng kính trọng* ở `16.4` cho Tăng đoàn,
    đúng vị trí Pāli, và không mở rộng sang Phật, Pháp.
  · `18.1`–`18.2` `Patiṭṭhito hettha yañño`: *tế lễ được thiết lập vững chắc* và *sẽ trở nên dồi dào
    cho chúng ta*; bản Việt nguyên bài đọc *vật hiến dâng … sẽ được thiết lập cho các vị Sa-môn*,
    gần cách Sujato (*there we will place our sacrifice*). Tôi không thêm *cho các sa-môn* vì
    Pāli chỉ có `ettha` (*ở đó/nơi đây*).
  · `21.2` `so idānimhi brāhmaṇo`: *nay cha mới thật là Bà-la-môn*, dùng lại sắc thái *thật sự* của
    `thig12.1:16.2` (`saccabrāhmaṇo`) và `thag3.1:3.2`; Pāli root ở đây không có `sacca`, nên
    chữ *thật* là cách đọc theo ngữ cảnh (đối lập với `brahmabandhu`), không phải chữ Pāli.
  · Tên: `Rohinī` theo Pāli đã ghim và Sujato; bản Việt nguyên bài viết `Rohiṇī` (theo BJT);
    không thêm tiểu sử vào thân kinh.

