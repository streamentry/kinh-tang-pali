notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim (kn/ps/ps3.4_root-pli-ms.json), đủ 120/120 khoá; thứ tự khoá = thứ tự Pāli, không khoá thừa.

  Tầng tham khảo: english-sujato không có ps3.4 (đây là not-published-upstream, không phải not-synced; manifest chỉ liệt kê tệp Pāli root cho uid này); english-project của dự án chưa có; vietnamese-current (phantuananh) chỉ có Pháp Cú. Coverage English theo công thức của source/layers.yaml: mẫu số 69 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0.x), tử số 0 ⇒ 0/69 = 0%, dưới ngưỡng 0,8; 51 khoá còn lại (khối tiêu đề và khoá ngắn hơn 40 ký tự) cổng không đo được gì. Bản Việt nguyên bài ở mục tra cứu toàn văn cuối trang (nếu có, không phân đoạn, alignment: none) không phải tầng store, không cấp text cho bản này và không tính vào triangulation. Vì vậy triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft.

  Chỗ tựa được vào tầng Việt đã có: công thức mở đầu 1.2 và 14.1 trùng nguyên văn Pāli với sn45.149:1.2 nên dùng lại nguyên văn bản Việt đó; công thức hạt giống 3.1 và 15.1 gần với sn45.150:1.1 và mn35:10.3–10.4; vế nương vào viễn ly, ly tham, đoạn diệt, hướng đến buông bỏ trùng với công thức giác chi ở an2.12, an6.58, mn118, mn146, dn33. Đã dùng làm tiền lệ thuật ngữ.

  Cấu trúc bài: đoạn mở đầu từ lời Phật về đất và hạt giống (1.2–4.10; trích dẫn mở ở 1.2, đóng ở 4.10); phần 3.4.1 giải thích tám chi đạo (5.0–13.6); đoạn trích lời Phật thứ hai về giác chi, lực, căn (14.1–16.8; mở ở 14.1, đóng ở 16.8); phần 3.4.2 giải thích năm căn (17.0–19.7). Phần giải thích dùng một khuôn duy nhất: hỏi, kể năm hình thức, giải thích từng hình thức, tóm lại, và kết bằng câu khởi ước muốn; chỉ đổi danh pháp (viễn ly, ly tham, đoạn diệt, buông bỏ) và đối tượng (chánh kiến, chánh định, tín căn, tuệ căn). Khuôn Việt được giữ y nguyên ở mọi khối.

  Thuật ngữ và tiền lệ (đo trên tầng Việt đã có): Sāvatthinidānaṁ → Tại Sāvatthī (436 trên 460 khoá có đúng Pāli này; Duyên khởi tại Sāvatthī 8, Nhân duyên ở Sāvatthī 5, Duyên khởi ở Sāvatthī 4). sīlaṁ nissāya sīle patiṭṭhāya → nương tựa vào giới, đứng vững trên giới (trong 42 khoá có công thức này: nương tựa vào giới 18, nhờ nương vào giới 16, nương vào giới trơn 8; chọn nương tựa vì sn45.149 là bài trùng Pāli nguyên văn). pathaviṁ nissāya → nương tựa vào đất (4 so với nương vào đất 3, nhờ nương vào mặt đất 3, nương vào mặt đất 3 trên 11 khoá; theo sn45.149:1.2). ariyaṁ aṭṭhaṅgikaṁ maggaṁ → Bát Thánh Đạo: ở phạm vi gần nhất, tức các khoá có sīlaṁ nissāya sīle patiṭṭhāya, 12 khoá Bát Thánh Đạo so với 6 khoá bát chánh đạo; toàn tầng bát chánh đạo 264 so với Bát Thánh Đạo 43; chọn Bát Thánh Đạo vì sát công thức và vì có chữ ariya, giữ một cách trong cả bài. bahulīkaroti → làm cho sung mãn (372 so với làm cho nhiều 4). vuddhiṁ viruḷhiṁ vepullaṁ → sự tăng trưởng, phát triển và lớn mạnh (theo mn35:10.3, cùng dạng chữ Pāli; sn45.150 dùng sinh trưởng, lớn lên, chín muồi). bījagāmabhūtagāmā → hạt giống và cây cỏ (mn35, an7.66; sn45.150 viết hạt giống và rễ cây, rễ không có trong Pāli). pāpuṇāti dhammesu → đạt đến trong các pháp (sn45.150, sn45.151). vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vosaggapariṇāmiṁ → nương vào viễn ly, nương vào ly tham, nương vào đoạn diệt, hướng đến buông bỏ (nương vào viễn ly 14, nương vào đoạn diệt 12, hướng đến buông bỏ 126). nissaya (5.1, 6.1) → sự nương tựa, cùng gốc với nissāya. nirodha → đoạn diệt xuyên suốt bài, kể cả ở danh sách năm hình thức, vì nirodhanissita ở 2.2 và nirodhā ở 8.1 là cùng một từ Pāli; vì vậy tổ hợp đoạn diệt do đoạn tuyệt lặp chữ đoạn, là cái giá của việc giữ một cách dịch. ps3.3 dùng diệt đơn cho nirodha; không sửa ps3.3 trong lát này. virāga → ly tham; viveka → viễn ly; vosagga → buông bỏ. nissaraṇa → thoát ly (đã sửa ngày 2026-10-11 từ xuất ly; xem mục Lượt cải thiện cuối ghi chú). samuccheda → đoạn tuyệt (theo ps3.3 và ps1.9; ngoài ps tầng dùng đứt đoạn cho samuccheda ở ngữ cảnh khác). paṭippassaddhi → lắng dịu (ps3.3). vikkhambhana → trấn áp (mil3.1.10:1.5 dịch vikkhambheti là trấn áp; 0 tiền lệ cho danh từ vikkhambhana). nibbedhabhāgiya → thuộc phần xuyên thấu (dn34, dn33). diṭṭhigata → tà kiến (63 trên 129 khoá). nīvaraṇa → triền cái (217 trên 329). paṭhamajjhāna → sơ thiền (4 trên 7). lokuttara → xuất thế gian (ps2.8, ps3.3). khayagāmi → đưa đến sự đoạn tận (dn34 dịch khayagāminiyā là đưa đến sự chấm dứt; ps3.3 dùng đoạn tận cho khaya). phalakkhaṇe → ở thời điểm quả (ps3.3 dùng tại thời điểm Dự lưu quả cho cùng gốc kkhaṇe). amatā dhātu → cõi bất tử (iti73:5.1 dịch amatadhātuṁ là cõi bất tử; 1 tiền lệ). chandajāto → khởi lên ước muốn (an3.112:1.9 dịch là khát cầu đã sanh; ps3.3 dùng dục cho chanda trong danh sách pháp, ở đây chọn ước muốn để khỏi gợi nghĩa dục tham). adhimutto → thắng giải (ps3.3 dùng thắng giải cho adhimokkha). svādhiṭṭhitaṁ → khéo an lập (an9.35). saddhindriya, vīriyindriya, satindriya, samādhindriya, paññindriya → tín căn, tinh tấn căn, niệm căn, định căn, tuệ căn (ps3.3). Các chi đạo: chánh kiến, chánh tư duy 151, chánh ngữ, chánh nghiệp 118, chánh mạng 112 (an3.162:1.5 viết chánh mệnh cho đúng Pāli sammāājīvaṁ bhāveti …; không theo vì chánh mạng là đa số), chánh tinh tấn 118, chánh niệm 125, chánh định 363. satta bojjhaṅge → bảy giác chi (61 trên 64). pañca balāni → năm lực (24 trên 32). pañcindriyāni → năm căn (114 trên 118).

  Pāli trùng nguyên văn: trong chính bài 23 cặp (46 khoá: 6.3 với 18.3; 10.8 với 18.2; 5.2 đến 5.7 với 10.1 đến 10.6; 7.2, 7.3, 7.5 với 11.2, 11.3, 11.5; 8.2, 8.3, 8.5 với 12.2, 12.3, 12.5; 9.2, 9.3, 9.5 với 13.2, 13.3, 13.5; 2.2, 2.9 với 4.2, 4.9; 1.2 với 14.1; 6.5 với 10.11; 17.2, 17.3 với 19.1, 19.2); 0 cặp mà bản Việt khác. Đã dò toàn tầng Việt đã có: 476 cặp (khoá bài này với khoá bài khác có Pāli y hệt, từ 15 ký tự trở lên), thuộc 9 khoá của bài này (0.1, 1.1, 1.2, 4.4 đến 4.8, 14.1); sau khi chỉnh, bản Việt khác ở 24 cặp, tất cả là 1.1 (Tại Sāvatthī so với các biến thể của 24 khoá khác, bản Việt của bài này theo đa số 436) cộng 1 cặp 4.6 với an3.162:1.5 (chánh mạng so với chánh mệnh; đa số chánh mạng).

  Bất định, không thêm vào thân kinh: (1) tadaṅga (6.2 và các khoá lặp): tiền lệ có và nhất quán, đo lại ngày 2026-10-11 (bản ghi trước nói là không có tiền lệ, sai): 18 khoá ngoài bài này thuộc ps1.1, ps2.10, mnd3, cnd18 đều dịch theo từng chi phần (18/18); sn22.43 và an9.50 là tadaṅganibbuto và tadaṅganibbānaṁ, khác hợp thể, dịch khác. Nghĩa đen là chi phần ấy; chú giải truyền thống hiểu là chi phần đối nghịch. Bản dịch theo từng chi phần không đưa nghĩa chú giải vào lời kinh nhưng với người đọc mới vẫn khó hiểu; nghĩa của từ này vẫn là điểm cần người biên tập phán, dù cách dịch đã thống nhất với tầng. (2) saddhādhimutto: có tiền lệ, đo lại ngày 2026-10-11 (bản ghi trước nói là không có, sai): ps1.3 có 6 khoá cùng công thức chandajāto hoti saddhādhimutto, cittañcassa svādhiṭṭhitaṁ, cả 6 dịch khởi lên ước muốn, thắng giải bằng đức tin, và tâm của vị ấy được khéo an lập (6/6), khớp với bản này; nghĩa của adhimutto vẫn có thể đọc là quyết tâm vì đức tin. (3) dvādasa nissayā: mười hai sự nương tựa không được Pāli liệt kê trong bài này (chỉ có tổng số, còn năm hình thức của mỗi danh pháp thì kể rõ); không thêm danh sách. (4) 6.3: sở hữu cách nīvaraṇānaṁ và diṭṭhigatānaṁ không kèm động từ; dịch là đối với các triền cái, đối với các tà kiến; có thể đọc thành sự viễn ly khỏi các triền cái và các tà kiến, hai cách đọc không đổi giáo nghĩa. (5) 8.3 và 12.3: nissaraṇanirodho kết bằng amatā dhātu trong khi các khối khác kết bằng nirodho nibbānaṁ; dịch đúng từng chữ có mặt. (6) 16.8 chỉ còn pāpuṇāti dhammesu sau dấu lược; dịch đạt đến trong các pháp, không thêm sự tăng trưởng, phát triển và lớn mạnh vì Pāli khoá này không có. (7) Thẻ b quanh các khoá hỏi và tiêu đề trong Pāli (6.1, 7.1, 8.1, 9.1, 10.1 đến 10.7) được bỏ khỏi bản Việt, như các bài ps đã dịch. (8) niddesa ở 5.0 và 17.0 dịch là giải thích; ps1.1:1.0 bỏ chữ niddesa và chỉ dịch phần còn lại, ở đây phần còn lại chỉ là tên chi đạo và căn nên giữ chữ giải thích để tiêu đề không cụt.

  Dấu lược: Pāli có …pe… ở 20 khoá và có … trần ở 21 khoá khác (tổng 41 khoá chứa …); Việt giữ đúng một dấu lược mỗi khoá có dấu lược, khớp Pāli từng khoá (0 lệch), không có (…) trần nào trong Pāli bài này; 14.6 kết …pe…. nên Việt kết khoảng trắng rồi ….

  Số Pāli: không có số lớn. Các số có mặt: pañca → năm (4 danh pháp, mỗi danh pháp kể đúng 5 hình thức); dvādasa → mười hai (dvā 2 + dasa 10); aṭṭhaṅgika → tám chi, nằm trong Bát Thánh Đạo, không tách số; satta bojjhaṅge → bảy giác chi; pañca balāni → năm lực; pañcindriyāni → năm căn.

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (120 = 120), thứ tự giống Pāli; nháy kép: Pāli có 4 khoá chứa nháy (1.2, 4.10, 14.1, 16.8), 0 lệch trên 120 khoá, Pāli bài này không có nháy đơn nên phép so nháy đơn chạy với mẫu số 0; dấu lược khớp từng khoá (41 khoá có …, 0 lệch); NFC, khoá rỗng, khoảng trắng thừa, Pāli lọt sang Việt: 0 lỗi trên 120 khoá (ngoài tên Paṭisambhidāmagga ở 0.1 và tên Sāvatthī ở 1.1). Đã đọc đối chiếu từng cặp Pāli và Việt cho cả 120 khoá.

  Chưa chạy cổng kỹ thuật nên technical_integrity đặt 9,6: còn phải chạy npm run validate, npm test, npm run check và npm run build.

  Lượt cải thiện 2026-10-11: đọc đối kháng lại cả 120 cặp Pāli và Việt, rồi đo lại tiền lệ ở phạm vi gần nhất, tức Vô Ngại Giải Đạo, thay vì chỉ ở toàn tầng. Đổi 23 trên 120 khoá, không đổi tập khoá, không đổi ranh giới khoá.
  (a) 19 khoá thuật ngữ (6.2, 6.3, 7.2, 7.3, 8.2, 8.3, 9.2, 9.3, 10.8, 10.9, 11.2, 11.3, 12.2, 12.3, 13.2, 13.3, 18.2, 18.3, 19.5): nissaraṇa trong năm hình thức, từ do xuất ly sang do thoát ly. Lý do: ở Vô Ngại Giải Đạo, nissaraṇa dịch là thoát ly ở 62 khoá, còn xuất ly dịch cho nekkhamma (ps1.1:123.2, ps3.10:10.1 đến 11.4, nơi hai từ được định nghĩa là cái này đi liền cái kia); công thức năm hình thức nissaraṇappahānaṁ ở ps1.1:125.2 và 125.7 đã là do thoát ly. Số đo toàn tầng trước đó (xuất ly 183 so với thoát ly 98) trộn hai từ Pāli nên không phân xử được ở đây. Dùng xuất ly cho nissaraṇa làm hai từ va nhau trong cùng một tác phẩm. Điểm: terminology 8.7 sang 8.9.
  (b) 1.2 và 14.1: thêm vế evamete mà bản trước bỏ sót: đều nương tựa vào đất, đứng vững trên đất; như vậy các công việc ấy được thực hiện. Lý do: cùng cấu tạo Pāli ở 3.1 và 15.1 đã dịch evamete là như vậy các loài hạt giống và cây cỏ ấy, và mn35:10.6 dịch Evamete balakaraṇīyā kammantā karīyanti là chính như vậy mà các công việc ấy được thực hiện; một đơn vị nghĩa (evaṁ) bị rơi. Đây là chủ ý lệch với sn45.149:1.2, 3.1, 4.1 và 5.1, nơi cùng Pāli vẫn mang chỗ rơi đó (tính theo khoá của bài này: 2 khoá lệch 1 bài khác, sn45.149:1.2); không sửa được vì ngoài phạm vi, nên đề nghị người biên tập đồng bộ sn45.149 và sn49.23-34:1.1. Điểm: semantic_fidelity 9.1 sang 9.2.
  (c) 4.10 và 16.7: bỏ chữ là trong Như vậy, này các tỳ-kheo, là vị tỳ-kheo ..., thì đạt đến: tổ hợp là ... thì làm câu có hai vị ngữ; Pāli Evaṁ kho, bhikkhave, bhikkhu ... pāpuṇāti chỉ có một động từ. 2.10 vẫn giữ là vì vị ngữ đứng sau là tu tập và làm cho sung mãn, khớp sn45.149:1.6. Không đổi điểm vietnamese_clarity (9,0) vì chỉ hai khoá.
  Đo lại số cặp Pāli trùng: trong chính bài 23 cặp, 0 cặp Việt khác; so với toàn tầng (từ 15 ký tự trở lên) 527 cặp thuộc 10 khoá của bài này, 28 cặp Việt khác: 24 là 1.1 (Tại Sāvatthī, đa số 461 so với các biến thể Duyên khởi, Nhân duyên, Bối cảnh), 2 là 4.6 (chánh mạng so với chánh mệnh ở an3.162 và an1.435, đa số chánh mạng), 2 là 1.2 và 14.1 so với sn45.149:1.2 (chủ ý, mục b).
  Đã đo, không đổi dù còn nghi: (i) ye keci dịch phàm có những ở 1.2 và 14.1 nhưng bất cứ ở 3.1 và 15.1, hai cách đều có tiền lệ (sn45.149 so với mn35:10.3), không đổi để khỏi lệch thêm. (ii) nirodha dịch đoạn diệt toàn bài: số khoá chứa đoạn diệt, diệt tận, diệt ở Vô Ngại Giải Đạo (không tính bài này) là 52, 125, 165; toàn tầng là 465, 422, 427; không có đa số rõ nên giữ lựa chọn đã ghi, một cách trong cả bài. (iii) saddhādhimutto dịch thắng giải bằng đức tin giữ nguyên, khớp ps1.3. (iv) vikkhambhana là trấn áp (41 khoá, 41/41), samuccheda là đoạn tuyệt, paṭippassaddhi là lắng dịu, phalakkhaṇe là thời điểm quả: cùng cách dịch với ps1.1 và các bài ps khác, giữ nguyên.
  Điểm giữ nguyên có lý do: ambiguity_integrity 8,5 (nghĩa chú giải của tadaṅga, hai cách đọc ở 6.3, và dvādasa nissayā không được liệt kê vẫn là bất định thật; việc tìm ra tiền lệ cho hai từ chỉ sửa khẳng định sai trong ghi chú chứ không giải quyết bất định về nghĩa); triangulation 7,0 (vẫn không có tầng Anh độc lập, nên bị chặn); technical_integrity 9,6 (chưa chạy bốn lệnh cổng ở trên). final_score mới là trung bình số học thô của 10 điểm (không làm tròn khi tính cổng): 8,97 sang 9,00, vẫn không vượt 9,0.
