notes: |-
  Đã đọc HẾT p66.txt trước khi viết. `thag` **CÓ** tệp Anh đã ghim — đã kiểm trực tiếp
  `source/upstream-manifest.json` chứ không suy từ tên thư mục: tầng `english-sujato`
  (treeSha 24e81ded9d6710e16b277b6394fd57c48258da12) có 264 tệp trong `sutta/kn/thag/`, và
  đúng 264 tệp `thag10.2`, `thag10.4`, `thag10.5`, `thag10.6` có mặt; cache `.cache/
  upstream/suttacentral/translation/en/sujato/sutta/kn/thag/` cũng có đủ 4 tệp ⇒
  coverage Anh **44/45 khoá = 97,8%** (khoá `:10.5` — dòng bìa `… X thero ….` — Sujato để
  trống ở cả bốn bài). Lưu ý về cách đo: `source/layers.yaml` đặt
  `substantivePaliMinChars: 40` và `floor: 0.8`, nhưng **không** khoá Pāli của bài nào trong
  bốn bài này đạt 40 ký tự (kệ `Theragāthā` chia pāda 4 dòng, mỗi dòng 15–35 ký tự), nên
  mẫu số của phép đo chính thức bằng không; con số 97,8% ở trên là độ phủ thô trên **mọi**
  khoá của bài, để người biên tập tự phán. Dù sao thì cũng không có dấu hiệu tụt ngưỡng.
  
  MỆNH ĐỀ ĐO LẠI.
  `:0.1` giữ Pāli: đo trên **227** tệp `thag*`, **227/227** đều giữ dạng `Theragāthā [<số>]`.
  `:0.2` `Dasakanipāta` → `Bộ Mười Bài Kinh`. Đây là bài **đầu tiên** trong `thag` mang
  `Dasakanipāta` (mọi bài `thag` đã có đều thuộc `Ekakanipāta`…`Aṭṭhakanipāta`), nên không
  có tiền lệ trong `thag`. Đo hình `-nipaata` trong toàn tầng `thag`: `Ekakanipāta` →
  `Bộ Một Bài Kinh` (120), `Dukanipāta` → `Bộ Hai Bài Kinh` (49), `Tikanipāta` → `Bộ Ba Bài
  Kinh` (15), `Catukkanipāta` → `Bộ Bốn Bài Kinh` (11), `Aṭṭhakanipāta` → `Bộ Tám Bài
  Kinh` (3) — **5/8 nhóm** theo hình `Bộ <số> Bài Kinh`, và hai hàng đầu đúng hai dòng đã
  chốt trong `BRIEF_VI3` §11; hai nhóm lệch là `Pañcakanipāta` → `Nhóm Năm` (10) và
  `Chakkanipāta` → `Trưởng Lão Kệ Nhóm Sáu` (13), `Sattakanipāta` → `Bộ Bảy Bài Kệ` (3).
  Theo đa số hình ⇒ `Bộ Mười Bài Kinh`. Ngoài tầng `thag` có đúng 5 tệp khác dùng
  `Bộ Mười Bài Kệ` cho `Dasakanipāta`, nhưng **tất cả đều là `ja`** (`ja439`, `ja449`,
  `ja451`, `ja452`) — một tác phẩm khác — nên không tính là tiền lệ cho `Theragāthā`.
  `:0.3` `Paṭhamavagga` → `Phẩm Thứ Nhất`: nối theo Pāli, **67/96** bài `thag` có Pāli
  `:0.3` = `Paṭhamavagga` dùng `Phẩm Thứ Nhất`; đây cũng là hình chuẩn của
  `iti10:0.3` (95).
  `:0.4` → `Kinh Kệ Của Trưởng Lão <tên>`: đo **227/227** bài `thag` đã có đều theo hình
  này (`thag` dùng `Trưởng lão` 523 lần so với `Tôn giả` 27). Tên vị trưởng lão **giữ Pāli**,
  bỏ đuôi `theragāthā`/`attheragāthá`.
  DÒNG BÌA `… <Tên> thero ….` → `… Trưởng lão <Tên> ….` — theo đúng tiền lệ của
  `thag1.100–1.112` (`… Devasabho thero ….` → `… Trưởng lão Devasabha ….`). Hai dấu lược
  được giữ nguyên, không gộp, không thêm.
  `…pe…`: không khoá nào trong bốn bài `thag` này có `…pe…`; dấu lược chỉ xuất hiện ở
  dòng bìa `:10.5` và đã khớp đúng hai `…` như Pāli.
  
  TIỀN LỆ DÙNG LẠI. `vāḷamiganisevitaṁ;` có 1 tiền lệ (`nơi đã thọ dụng bầy chim`) và
  `Seve senāsanaṁ bhikkhu,` có 1 (`tỳ-kheo ở nơi chỗ tụ trú,`) — xem bên dưới, tôi **không**
  theo hai tiền lệ này vì chúng trái nghĩa Pāli trong bối cảnh.
  
  BẤT ĐỊNH VÀ CHỖ PHẢI PHÁN, ĐÃ GHI.
  (1) **`vāḷamiganisevitaṁ` (`:1.2`) — BẤT ĐỒNG THUẬN THẬT SỰ, đã ghi.** Cả Pāli lẫn Sujato
  đều ở đây: Sujato đưa `frequented by beasts of prey` vào khoá `:1.4` (sang `paṭisallānakāraṇā`
  = *cơ sở cho sự nhập cư*), còn 1 tiền lệ trong tầng dịch thành `nơi đã thọ dụng bầy chim`
  — cả hai đọc `vāḷamiganisevitaṁ` theo nghĩa **khẳng định**. Tôi dịch theo nghĩa **phủ
  định**: `không có bầy thú lui tới;`. Lý do: mệnh đề đứng ngay trước là `Vivittaṁ
  appanigghosaṁ` (*vắng vẻ, không ồn ào*) — nếu `:1.2` khẳng định thì câu tự mâu thuẫn với
  chính nó; và `vāḷa` là chim/kêu (`jaḷāva`), có tiếng. Đây là chỗ lệch ý **đáng kể nhất**
  của lát này: nếu đọc khẳng định thì câu đảo chiều. Tôi chọn cách khớp nội bộ bài và ghi
  rõ để người biên tập phán; nếu họ giữ quan điểm của Sujato thì chỉ cần đổi một khoá.
  (2) **Căn chỉnh bản Anh của Sujato lệch nặng ở bài này.** Sujato ghép `In order to go on
  retreat,` vào `:1.1` (`Vivittaṁ appanigghosaṁ` không mang nghĩa ấy) và đẩy
  `frequented by beasts of prey` sang `:1.4`. `They should be content even with coarse food, /
  not hoping for lots of flavors` thì Sujato dịch `Lūkhenapi vā santusse` là `content even
  with coarse food` (đúng) nhưng đặt `vị ấy biết đủ` vào câu sau. Vì vậy ở bài này tôi
  dùng Sujato **cho nghĩa và thuật ngữ**, còn thứ tự và chủ thể lấy từ Pāli.
  (3) `3.2–3.3` `sapadānaṁ kulā kulaṁ; / Piṇḍikāya care bhikkhu,` — `sapadānaṁ` =
  không phân biệt nằm ở khoá trước cùng với `kulā kulaṁ` (gia hộ nọ sang gia hộ kia), nên
  tôi đặt `không phân biệt` ở `:3.2` và `cầm bát từ nhà nọ đến nhà kia` ở `:3.3`, đúng vị
  trí Pāli; không dịch vòng theo Sujato (`a mendicant should walk for alms / from family
  to family indiscriminately`).
  (4) `4.1–4.2` `Lūkhenapi vā santusse, nāññaṁ patthe rasaṁ bahuṁ;` — 1 tiền lệ cho cả
  cặp nhưng nó là câu dài của bài khác và còn vướng `patthe`, không dùng được. Tôi dịch `Dù
  ăn thô hay, vị biết đủ này / cũng không mong cầu nhiều vị ngon;` theo nghĩa Sujato
  (`content even with coarse food, / not hoping for lots of flavors`).
  (5) `5.2` `pavivitto vase muni` — `vase` = sống ở, `pavivitta` = tách bạch; tôi dịch `bậc
  hiền siêu sống ở nơi tách bạch;`. Bản nháp đầu ghi `sống tách bạch` thiếu `vase`.
  (6) `8.1–8.2` `Suggahītanimittassa, cittassuppādakovido;` — Sujato dịch `Expert in the
  arising of thought, / they would grasp well the pattern of the mind`, hơi trôi (`nimitta`
  là dấu hiệu, không phải tâm). Tôi dịch `Biết rõ dấu hiệu khởi lên, / thấy biết sự sinh
  khởi của tâm;`.
  (7) `9.3–9.4` `Na ca appatvā dukkhantaṁ, vissāsaṁ eyya paṇḍito.` — `vissāsa` = tin
  chắc/tự phụ; Sujato dịch `would not be too sure of themselves`. Tôi dịch `bậc khôn ngoan
  không hề tự phụ, / cho tới khi đạt tận cùng khổ đau.` — giữ `appatvā … antam` (chưa
  đạt tới) và `na ca` (cũng không), không đổi thành khuyến nghị.
  `technical_integrity` đặt 9.6 vì không có ai rà lại bằng con người.
