  bốn bài này đạt 40 ký tự (kệ `Theragāthā` chia pāda 4 dòng, mỗi dòng 15–35 ký tự), nên
  mẫu số của phép đo chính thức bằng không; con số 97,8% ở trên là độ phủ thô trên **mọi**
  khoá của bài, để người biên tập tự phán. Dù sao thì cũng không có dấu hiệu tụt ngưỡng.
  
  MỆNH ĐỀ ĐO LẠI.
  `:0.1` giữ Pāli: đo trên **227** tệp `thag*`, **227/227** đều giữ dạng `Theragāthā [<số>]`.
  `:0.2` `Dasakanipāta` → `Bộ Mười Bài Kinh`. Đây là bài **đầu tiên** trong `thag` mang
  `Dasakanipāta` (mọi bài `thag` đã có đều thuộc `Ekakanipāta`…`Aṭṭhakanipāta`), nên không
  có tiền lệ trong `thag`. Đo hình `-nipaata` trong toàn tầng `thag`: `Ekakanipāta` →
  `Bộ Một Bài Kinh` (120), `Dukanipāta` → `Bộ Hai Bài Kinh` (49), `Tikanipāta` → `Bộ Ba Bài
  Kinh` (15), `Catukkanipāta` → `Bộ Bốn Bài Kinh` (11), `Aṭṭhakanipāta` → `Bộ Tám Bài
  Kinh` (3) — **5/8 nhóm** theo hình `Bộ <số> Bài Kinh`, và hai hàng đầu đúng hai dòng đã
  chốt trong `BRIEF_VI3` §11; hai nhóm lệch là `Pañcakanipāta` → `Nhóm Năm` (10) và
  `Chakkanipāta` → `Trưởng Lão Kệ Nhóm Sáu` (13), `Sattakanipāta` → `Bộ Bảy Bài Kệ` (3).
  Theo đa số hình ⇒ `Bộ Mười Bài Kinh`. Ngoài tầng `thag` có đúng 5 tệp khác dùng
  `Bộ Mười Bài Kệ` cho `Dasakanipāta`, nhưng **tất cả đều là `ja`** (`ja439`, `ja449`,
  `ja451`, `ja452`) — một tác phẩm khác — nên không tính là tiền lệ cho `Theragāthā`.
  `:0.3` `Paṭhamavagga` → `Phẩm Thứ Nhất`: nối theo Pāli, **67/96** bài `thag` có Pāli
  `:0.3` = `Paṭhamavagga` dùng `Phẩm Thứ Nhất`; đây cũng là hình chuẩn của
  `iti10:0.3` (95).
  `:0.4` → `Kinh Kệ Của Trưởng Lão <tên>`: đo **227/227** bài `thag` đã có đều theo hình
  này (`thag` dùng `Trưởng lão` 523 lần so với `Tôn giả` 27). Tên vị trưởng lão **giữ Pāli**,
  bỏ đuôi `theragāthā`/`attheragāthá`.
  DÒNG BÌA `… <Tên> thero ….` → `… Trưởng lão <Tên> ….` — theo đúng tiền lệ của
  `thag1.100–1.112` (`… Devasabho thero ….` → `… Trưởng lão Devasabha ….`). Hai dấu lược
  được giữ nguyên, không gộp, không thêm.
  `…pe…`: không khoá nào trong bốn bài `thag` này có `…pe…`; dấu lược chỉ xuất hiện ở
  dòng bìa `:10.5` và đã khớp đúng hai `…` như Pāli.
  
  TIỀN LỆ DÙNG LẠI. `vāḷamiganisevitaṁ;` có 1 tiền lệ (`nơi đã thọ dụng bầy chim`) và
  `Seve senāsanaṁ bhikkhu,` có 1 (`tỳ-kheo ở nơi chỗ tụ trú,`) — xem bên dưới, tôi **không**
  theo hai tiền lệ này vì chúng trái nghĩa Pāli trong bối cảnh.
  
  BẤT ĐỊNH VÀ CHỖ PHẢI PHÁN, ĐÃ GHI.
  (1) **`vāḷamiganisevitaṁ` (`:1.2`) — BẤT ĐỒNG THUẬN THẬT SỰ, đã ghi.** Cả Pāli lẫn Sujato
  đều ở đây: Sujato đưa `frequented by beasts of prey` vào khoá `:1.4` (sang `paṭisallānakāraṇā`
  = *cơ sở cho sự nhập cư*), còn 1 tiền lệ trong tầng dịch thành `nơi đã thọ dụng bầy chim`
  — cả hai đọc `vāḷamiganisevitaṁ` theo nghĩa **khẳng định**. Tôi dịch theo nghĩa **phủ
  định**: `không có bầy thú lui tới;`. Lý do: mệnh đề đứng ngay trước là `Vivittaṁ
  appanigghosaṁ` (*vắng vẻ, không ồn ào*) — nếu `:1.2` khẳng định thì câu tự mâu thuẫn với
  chính nó; và `vāḷa` là chim/kêu (`jaḷāva`), có tiếng. Đây là chỗ lệch ý **đáng kể nhất**
  của lát này: nếu đọc khẳng định thì câu đảo chiều. Tôi chọn cách khớp nội bộ bài và ghi
  rõ để người biên tập phán; nếu họ giữ quan điểm của Sujato thì chỉ cần đổi một khoá.
  (2) **Căn chỉnh bản Anh của Sujato lệch nặng ở bài này.** Sujato ghép `In order to go on
  retreat,` vào `:1.1` (`Vivittaṁ appanigghosaṁ` không mang nghĩa ấy) và đẩy
  `frequented by beasts of prey` sang `:1.4`. `They should be content even with coarse food, /
  not hoping for lots of flavors` thì Sujato dịch `Lūkhenapi vā santusse` là `content even
  with coarse food` (đúng) nhưng đặt `vị ấy biết đủ` vào câu sau. Vì vậy ở bài này tôi
  dùng Sujato **cho nghĩa và thuật ngữ**, còn thứ tự và chủ thể lấy từ Pāli.
  (3) `3.2–3.3` `sapadānaṁ kulā kulaṁ; / Piṇḍikāya care bhikkhu,` — `sapadānaṁ` =
  không phân biệt nằm ở khoá trước cùng với `kulā kulaṁ` (gia hộ nọ sang gia hộ kia), nên
  tôi đặt `không phân biệt` ở `:3.2` và `cầm bát từ nhà nọ đến nhà kia` ở `:3.3`, đúng vị
  trí Pāli; không dịch vòng theo Sujato (`a mendicant should walk for alms / from family
  to family indiscriminately`).
  (4) `4.1–4.2` `Lūkhenapi vā santusse, nāññaṁ patthe rasaṁ bahuṁ;` — 1 tiền lệ cho cả
  cặp nhưng nó là câu dài của bài khác và còn vướng `patthe`, không dùng được. Tôi dịch `Dù
  ăn thô hay, vị biết đủ này / cũng không mong cầu nhiều vị ngon;` theo nghĩa Sujato
  (`content even with coarse food, / not hoping for lots of flavors`).
  (5) `5.2` `pavivitto vase muni` — `vase` = sống ở, `pavivitta` = tách bạch; tôi dịch `bậc
  hiền siêu sống ở nơi tách bạch;`. Bản nháp đầu ghi `sống tách bạch` thiếu `vase`.
  (6) `8.1–8.2` `Suggahītanimittassa, cittassuppādakovido;` — Sujato dịch `Expert in the
  arising of thought, / they would grasp well the pattern of the mind`, hơi trôi (`nimitta`
  là dấu hiệu, không phải tâm). Tôi dịch `Biết rõ dấu hiệu khởi lên, / thấy biết sự sinh
  khởi của tâm;`.
  (7) `9.3–9.4` `Na ca appatvā dukkhantaṁ, vissāsaṁ eyya paṇḍito.` — `vissāsa` = tin
  chắc/tự phụ; Sujato dịch `would not be too sure of themselves`. Tôi dịch `bậc khôn ngoan
  không hề tự phụ, / cho tới khi đạt tận cùng khổ đau.` — giữ `appatvā … antam` (chưa
  đạt tới) và `na ca` (cũng không), không đổi thành khuyến nghị.
  `technical_integrity` đặt 9.6 vì không có ai rà lại bằng con người.

  Lượt cải thiện 2026-10-14. Đọc đối kháng từng khoá Pāli↔Việt, đo tiền lệ bằng số đếm trên toàn tầng. Bản trước có lỗi nghĩa thật mà lượt chấm 2026-10-04 không bắt được; điểm cũ vì thế đã bị chấm cao hơn thực chất, và lượt này chấm lại theo chuẩn đọc đối kháng. Đã đổi 37/45 khoá (giữ nguyên tập khoá và segment ID; tiêu đề `:0.x` và dòng bìa `:10.5` không đổi).
  ĐÍNH CHÍNH. Mục bất định (1) ở trên SAI và nay đã bị bác. `vāḷamiganisevitaṁ` là nghĩa KHẲNG ĐỊNH: `vāḷamiga` = thú dữ, `nisevita` = được lui tới. Bản trước dịch phủ định (`không có bầy thú lui tới`) với lý lẽ rằng `vāḷa` là chim/tiếng kêu; lý lẽ đó không có căn cứ. Đo trên Pāli root: 31 khoá chứa `vāḷamiga`; mọi bản Việt đã có trong tầng (trừ khoá lỗi `mil7.2.6:5.2` ngoài lát) đều dịch `thú dữ` kèm `lui tới/lai vãng/đầy`, kể cả đúng cụm này ở `thag11.1:6.4` (`nơi thú dữ và nai thú hay lui tới`) và `thig14.1:8.1`. Sujato cũng đặt `frequented by beasts of prey` (khẳng định). Câu `appanigghosaṁ` (ít tiếng ồn) không mâu thuẫn với thú dữ lui tới: hai vế là hai đặc tính của nơi thanh vắng. Sửa ở `:1.2`: `có thú dữ lui tới;`.
  Các khoá đã sửa, phân theo mức.
  NẶNG (nghĩa sai hoặc đảo): `:1.2` đảo phủ định nói trên; `:1.4` `thuận tiện cho sự nhập cư` ← `paṭisallānakāraṇā`: `nhập cư` là lỗi từ (đo: `paṭisallāna` 224 khoá, `độc cư` 147, `nhập cư` chỉ 1 là khoá này) ⇒ `vì mục đích độc cư.`; `:5.3` `hội chủ` ← `gahaṭṭhehi` (người tại gia): `hội chủ` trong tầng chỉ còn là `saṅghin` ở `sn3.1`, còn `gahaṭṭha` dịch `tại gia` 89/234 ⇒ `người tại gia`; `:8.1` `Biết rõ dấu hiệu khởi lên` làm mất `suggahīta` (khéo nắm) và dời `khởi lên` sai chỗ ⇒ `Khéo nắm bắt dấu hiệu,`, kèm `:8.2` `thiện xảo về sự sinh khởi của tâm` (`kovida` = thiện xảo: `thag21.1`, `thag17.3`; `nimitta` = dấu hiệu: `thag1.85`).
  VỪA: `:9.1` bỏ `Dù có sức mạnh và sát chí` (Pāli không có ý nhượng bộ; `vīriya` = tinh tấn 1.185/1.352 khoá, không phải `sức mạnh`; `sātacca` = kiên trì/bền tâm: `sn12.203`, `sn34.55`) ⇒ `Đầy đủ tinh tấn và kiên trì,`; `:9.4` `không hề tự phụ` ← `vissāsaṁ eyya`: `vissāsa` là tin cậy/yên tâm, không phải kiêu mạn, và đây là lời khuyên (optative) chứ không phải mô tả ⇒ `bậc trí không nên yên tâm.`; `:4.1` `Dù ăn thô hay, vị biết đủ này` (lủng củng, thêm `ăn` và `này`) ⇒ `Dù với món thô cũng nên biết đủ,` (theo `mil7.5.6:6.1`); `:4.4` `định` ← `jhāne` ⇒ `thiền định` (`jhāna` 1.353/1.367 khoá là `thiền`; glossary chỉ cho phép `thiền định`/`thiền`; 3 khoá có đúng `jhāne na ramatī mano` đều là `thiền định`); `:8.3` `chuyên tâm vào định` ← `samathaṁ` ⇒ `tu chỉ` (`samatha` 185/218 khoá là `chỉ`, 24 là `định`) và `:8.4` `quán sát` ← `vipassanaṁ` ⇒ `tu quán` (`quán` 407/435); `:10.4` `sự đình chỉ` ← `nibbuti` ⇒ `sự tịch diệt` (`thag6.8:2.4`); `:3.4` `thu thúc viên mãn` ← `susaṁvuto` ⇒ `khéo thu thúc` (đa số: `pv38:45.4`, `snp3.1:9.2`, `thag16.8:25.2`…); `:3.3` `cầm bát` ← `piṇḍikāya` ⇒ `đi khất thực`; `:3.2` `không phân biệt` ← `sapadānaṁ` ⇒ `tuần tự từ nhà này sang nhà khác` (`tuần tự từng nhà`/`từng nhà một` ở 11/11 khoá `sapadānaṁ` khác); `:2.3` `áo khoác` ← `saṅghāṭikaṁ` ⇒ `y tăng-già-lê` (`thi-ap22:36.3`, `tha-ap542:31.3`; `tăng-già-lê` 43/114 khoá `saṅghāṭi`, `áo khoác` chỉ 1 là khoá này).
  NHẸ: `:1.1` theo `snp2.11:4.3` (`Nơi thanh vắng, ít tiếng ồn,`); `:1.3` `chỗ tụ trú` ← `senāsana` ⇒ `chỗ ở` (126/176) và `seve` ⇒ `thân cận` (`sn6.13`); `:2.1` `phế liệu` (Pāli không nêu vật nhặt) ⇒ `Sau khi nhặt từ các đống rác,` theo `thi-ap22:36.1`; `:2.2` `đường phố` giữ theo `thi-ap22:36.2`; `:2.4` `tấm y thô kệch ấy` ⇒ `y thô` (`lūkhacīvara` = `y thô` ở `thi-ap22`, `tha-ap542`); `:3.1` `Hạ mình thấp trong tâm` ⇒ `Hạ thấp tâm mình` (đúng khoá có Pāli trùng `thag12.2:2.3`); `:4.2` thêm `nên`, `nhiều vị khác` (theo `mil7.5.6:6.2`); `:4.3` `ham muốn` ⇒ `tham mê` (`mil7.5.6:6.3`); `:5.2` `bậc hiền siêu … ở nơi tách bạch` ⇒ `bậc mâu-ni nên sống viễn ly` (`muni`: `mâu-ni` 224/281 khoá, `hiền siêu` chỉ có ở bài này và `thag10.7`; `pavivitta` = `viễn ly`: `thag16.2`, `thag2.14`); `:5.4` `không trộn lẫn với người không gia đình` ⇒ `cũng không với người xuất gia` (trùng đúng Pāli `anāgārehi cūbhayaṁ` ở `snp3.9:40.2`, `dhp404:2`, `mil7.4.5:4.2`; `mn98:11.36` cũng `người xuất gia`); `:5.3` `không giao du` theo cùng cụm; `:6.1` `thằng ngu`/`kẻ câm` ⇒ `người đần độn hay người câm` (`jaḷa` = đần độn ở `dn34`, `an8.29`, `an5.231`; `thằng` quá suồng sã); `:6.2` `tự hiện ra` ⇒ `tự tỏ ra`; `:6.3` `bậc khôn ngoan` ⇒ `bậc trí` (362/884 khoá `paṇḍita`; `bậc khôn ngoan` không ở đâu khác) và `lời dài dòng` ⇒ `nói quá mức` (`ativelaṁ` = `quá mức/quá độ`: `ja331`, `ja517`, `dn1`); `:6.4` `giữa chúng Tăng đoàn` ⇒ `giữa Tăng đoàn` (`mn69:2.1`, `mn5:11.4`); `:7.1–7.2`, `:7.4` thêm `nên`: toàn bài là cầu khiến (`siyā`, `-eyya`, `-aye`), bản trước lẫn lộn lời khuyên với lời mô tả; `:9.2` thêm `nên` (`sadā siyā`); `:10.1` `Với vị tỳ-kheo` (sở hữu cách); `:10.3` `héo mòn` ⇒ `cạn mòn` (`khīyati` ở `sn35.95` ×6). Phần còn lại là viết hoa đầu dòng theo dòng 1 và 3 như Pāli.
  Điểm tiêu chí đổi: semantic_fidelity 9.2 → 9.1 (đảo nghĩa `:1.2` và bốn khoá nặng đã sửa; còn bất định thật ở `vissāsa` và `suggahītanimitta`, nên chấm theo chuẩn đọc đối kháng chứ không nâng); terminology 9.3 → 9.4 (nay khớp đa số tầng: `độc cư`, `chỉ`/`quán`, `thiền định`, `mâu-ni`, `bậc trí`, `tăng-già-lê`, `tại gia`/`xuất gia`); vietnamese_clarity 9.2 → 9.3 (bỏ `nhập cư`, `hội chủ`, `sát chí`, câu `:4.1`); final_score 9.32 → 9.33. Các tiêu chí khác giữ nguyên: ambiguity_integrity 8.7 giữ vì bất định còn lại; triangulation 9.1 giữ vì vẫn không có bản Việt hiện hành cho bài này, và nay đã đối chiếu đúng Sujato (bản trước đọc sai chỗ Sujato đặt `beasts of prey`).
  Bất định còn lại, KHÔNG phân xử được. (a) `:9.4` `vissāsaṁ eyya`: `yên tâm` là lựa chọn bám nghĩa `tin cậy/an tâm`; Sujato dịch `too sure of themselves`; chưa có Pāli song song trong tầng để phân xử (chỉ `sn22.85:14.17` `đặt lòng tin cậy` và `mn15` dùng `vissāsa` với nghĩa tin cậy giữa người với người). (b) `:8.1` `suggahītanimitta`: Pāli không nêu `nimitta` của gì; dịch `dấu hiệu` theo `thag1.85:1.1`, không khẳng định đó là tướng của định hay của tâm. (c) `:4.1` `lūkha` đứng một mình: hiểu là món ăn thô do khoá `:4.2` nói về vị (`rasa`) và `mil7.5.6:5.2`. (d) `:3.4` `guttadvāro`: giữ `các cửa căn` như các bản `thag16.8` và `tha-ap8`, dù Pāli không nêu chữ `căn`.
  Không đổi dù nghi ngờ: tiêu đề `:0.4` và dòng bìa `:10.5` giữ `con nhà Vaṅgantā` (có tiền lệ `an1.213:1.1`, `ud4.9:1.3`, `ud4.10:5.5` là `con của Vaṅgantā`; các bài `thag` khác dùng `-putta` liền tên, tầng chưa thống nhất; không phải lỗi nghĩa). `:5.1` `Ít ham muốn` giữ (24/33). `:7.3` `Thu thúc trong giới bổn` giữ (trùng đúng `tha-ap58:6.1`, `tha-ap491:10.1`).
  Đo lại: Pāli trùng nguyên văn với bài khác ở 11 khoá (`:1.1`, `:1.2`, `:1.3`, `:2.3`, `:3.1`, `:3.4`, `:4.2`, `:4.3`, `:4.4`, `:5.4`, `:7.3`), và đã đối chiếu tiền lệ của từng khoá; 0 cặp Pāli trùng nguyên văn trong chính bài. Dấu lược `…` ở `:10.5` khớp Pāli (2/2); không có `…pe…`. Nháy kép `“”` khớp Pāli từng khoá. 45/45 khoá, tập khoá khớp Pāli.
  Kiểm kỹ thuật chưa chạy trong lượt này (bị cấm chạy cổng): `npm run validate` · `npm test` · `npm run check` · `npm run build`; technical_integrity giữ 9.6, chưa tuyên bố cổng kỹ thuật đã pass.
