notes: |-
  Đã đọc hết Pāli (119 khoá, 116 khoá ngoài khối tiêu đề `:0`) trước khi viết. Bài là một ma trận hình thức về các nhân (hetu) làm duyên cho sự thọ sinh (upapatti) trong sự thành tựu cảnh giới (gatisampatti): tám nhân khi tương ưng với trí (ba nhân thiện, hai nhân bất thiện, ba nhân vô ký), sáu nhân khi không tương ưng với trí (hai, hai, hai); mỗi trường hợp được hỏi và đáp riêng cho bốn nhóm: cảnh giới nói chung, các Sát-đế-lợi / Bà-la-môn / gia chủ đại phú cùng chư thiên dục giới, chư thiên sắc giới, chư thiên vô sắc giới. Vì cả bài là một khuôn lặp, mọi khoá cùng khuôn dùng đúng một bộ chữ; đã in cặp Pāli↔Việt cả 119 khoá ra đọc đối chiếu.

  COVERAGE ENGLISH ĐO ĐƯỢC. Mẫu số = 85 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`) trên 116 khoá ngoài khối `:0`; Sujato phủ 0/85. Tầng english-sujato tại commit đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud dưới kn/ (755 tệp theo manifest), không có ps ⇒ not-published-upstream (không phải not-synced); lớp english-project không có uid này; tầng vietnamese-current chỉ có Pháp Cú. Bài dịch chỉ từ Pāli nên triangulation đặt 7.0 và status giữ draft theo blocker noEnglishEditionUpstream. Không tuyên bố đã đối chiếu tầng tham khảo nào; thuật ngữ được lấy từ tiền lệ trong chính tầng dịch của dự án chứ không từ một bản tham khảo độc lập.

  SỐ PĀLI, ĐÃ TỰ TÍNH. Tám nhân (aṭṭhannaṁ hetūnaṁ) = 3 nhân thiện + 2 nhân bất thiện + 3 nhân vô ký = 8, khớp :3.2, :3.6, :3.10. Sáu nhân (channaṁ) = 2 + 2 + 2 = 6, khớp :12.2, :12.6, :12.10. Mười bốn pháp (cuddasa) ở nhóm bất tương ưng (:4.5) = năm uẩn 5 + bốn đại 4 + ba mạng hành 3 + danh và sắc 2 = 14; ở nhóm tương ưng (:4.10, :6.10, :9.5) = bốn uẩn vô sắc 4 + năm căn 5 + ba nhân 3 + danh và thức 2 = 14. Hai mươi tám pháp (aṭṭhavīsati, :4.11, :6.11) = 14 + 14. Mười hai pháp (dvādasa, :13.10) = bốn uẩn vô sắc 4 + bốn căn 4 + hai nhân 2 + danh và thức 2 = 12. Hai mươi sáu pháp (chabbīsati, :13.11) = 14 + 12. Đã đối chiếu 60 chỗ có số Pāli với số chữ Việt, 0 lệch; hiệu chuẩn ba trường hợp mẫu đều đúng.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `gati` → "cảnh giới" (tầng: dn12:10.15 "cảnh giới đi đến", mn110:13.2–24.3 "cảnh giới của người thiện / bất thiện"; "cõi" dùng cho sugati/duggati ở 244 khoá sn và 584 khoá kn, nhưng ở đây gati là danh từ trục của tiêu đề nên chọn "cảnh giới"). `gatisampatti` → "sự thành tựu cảnh giới" (không có tiền lệ cùng từ trong tầng, 0 khoá). `upapatti` → "sự thọ sinh": tầng cho `upapatti` là "sự tái sinh" 39 khoá + "tái sinh" 13, so với "sự thọ sanh" 8 + "thọ sinh" 3; vì `paṭisandhi` ở cùng bài đã mang "tái sinh" (mil3.2.6, mil3.1.6, ne18:5.1) nên phải tách hai từ, chọn "thọ sinh" cho `upapatti` và "tái sinh" cho `paṭisandhi`. `hetu` → "nhân" (ps3.3:12.2, ps1.9:1.2 "nhân và duyên", "là nhân"). `paccaya` → "duyên"; mẫu `-paccayā` + `saṅkhārā / viññāṇaṁ / nāmarūpaṁ` → "do duyên X cũng có Y" theo "do duyên X mà có Y" (sn12.1:2.4, sn12.65:3.4, sn12.67:7.5; 7 khoá dạng này). `kusalamūla` / `akusalamūla` → "gốc thiện" / "gốc bất thiện" (25 và 27 khoá; "căn lành" 2, "căn bất thiện" 6). `abyākata` → "vô ký" (mil3.2.5, 2 khoá; ps3.7:2.1 có "không tạc hiện" 1 khoá, đây là cách hiếm và không dùng lại). `javana` → "tốc hành", `khaṇa` → "thời điểm" theo khuôn `-kkhaṇe` → "tại thời điểm …" của ps1.9:1.2, :6.1–:8.1 và ps3.3:11.3, :12.1 (6 khoá trong ps). `nikanti` → "ham muốn" (an7.49:4.2 "sự ham muốn đời sống", 4 khoá an7.49; dn25:10.15 "mong"). `paṭisandhikkhaṇe` → "tại thời điểm tái sinh". `cetanā` → "tư" (mn111:4.1 và 3 khoá cùng khuôn; sn12.11 "ý tư"); `jātacetanā` → "tư sinh khởi". `sahajāta` → "đồng sanh" (8 khoá, "đồng sinh" 2 khoá; gần nhất ps1.9:1.2 "đồng sanh"), nên `sahajātapaccaya` → "duyên đồng sanh" dù bài này dùng "sinh" ở các từ khác. `aññamañña` → "lẫn nhau" (aññamaññaṁ → "lẫn nhau" ở iti18:2.4, ja425:8.3, mil3.8:6.4…; "hỗ tương" 0 khoá) nên `aññamaññapaccaya` → "duyên lẫn nhau". `nissaya` → "nương tựa" (624 khoá tầng so với "y chỉ" 308) nên `nissayapaccaya` → "duyên nương tựa". `sampayutta` → "tương ưng" (45 khoá), `vippayutta` → "không tương ưng" (pe7:1.4–1.5, 5 khoá; "bất tương ưng" 0 khoá); `ñāṇasampayutte` → "khi tương ưng với trí", `ñāṇavippayutte` → "khi không tương ưng với trí". `jīvitasaṅkhāra` → "mạng hành" (dn16:2.23.5, :2.24.1; sn47.9 dùng "lực mạng sống" cho cùng từ nhưng ở bối cảnh khác). `mahābhūta` → "đại" (ba khoá mil, "bốn đại"); `indriya` → "căn"; `arūpī khandhā` → "uẩn vô sắc"; `kāmāvacara / rūpāvacara / arūpāvacara` → "dục giới / sắc giới / vô sắc giới" (ps3.3:4.1–6.2: "tâm dục giới / sắc giới / vô sắc giới"; trong tầng "sắc giới" 11 khoá, "dục giới" 7, "vô sắc giới" 5). `khattiyamahāsāla` / `brāhmaṇamahāsāla` / `gahapatimahāsāla` → "Sát-đế-lợi đại phú / Bà-la-môn đại phú / gia chủ đại phú" (an6.57:14.2, sn3.21:6.2, dn16:5.17.6; đo 109 khoá Pāli có `mahāsāla` ở dn, mn, sn, an, kn: "đại phú" 45, "giàu có" 29, "đại phú hộ" 6, "vĩ đại" 5, "quyền quý" 5, "giàu lớn" 1, khác 18; chọn "đại phú" vì là dạng đa số và khớp snp2.7 "bà-la-môn đại phú").

  TÊN VÀ TIÊU ĐỀ, ĐO ĐƯỢC. `:0.1` giữ Pāli "Paṭisambhidāmagga" (ps1.7, ps1.8, ps1.9, ps3.5, ps3.7 đều giữ). `:0.2` giữ Pāli "Mahāvagga" và bỏ chữ số "1" đứng trước (ps1.7, ps1.8, ps1.9 đều bỏ). `:0.3` dịch "1.6. Luận Bàn Về Cảnh Giới" theo khuôn "Luận Bàn Về …" có số thứ tự của ps1.1, ps1.7 và ps1.8. Colophon `:14.7` dịch "Luận bàn về cảnh giới đã hoàn tất." theo ps1.8:8.10 (bài kề trong cùng Mahāvagga).

  PĀLI TRÙNG NGUYÊN VĂN. Trong chính bài: đã dò mọi cặp khoá có Pāli trùng nguyên văn (sau khi bỏ khoảng trắng đầu cuối): 215 cặp, 0 cặp Việt khác nhau. Khoá có Pāli khác nhau chỉ ở một từ thì Việt khác đúng từ đó (ví dụ :3.13 `nāmarūpapaccayāpi viññāṇaṁ, viññāṇapaccayāpi nāmarūpaṁ` so với :8.13 `nāmapaccayāpi viññāṇaṁ viññāṇapaccayāpi nāmaṁ`, và :4.12 `aṭṭhannaṁ` so với :13.12 `channaṁ`). Với tầng: 0 khoá Pāli của bài này trùng nguyên văn với khoá đã dịch ở dn, mn, sn, an, kn (đã dò toàn bộ 116 khoá ngoài khối `:0`), nên không có bản dịch nào để dùng lại nguyên văn.

  DẤU LƯỢC, NHÁY, NGOẶC. Hai khoá có …pe… ở Pāli (:7.2 và :14.5, không có chấm cuối), bản Việt giữ đúng MỘT dấu `…` ở mỗi khoá, đặt sau một dấu cách và không thêm chấm, đúng dạng " …" của tầng. Pāli không có `…` trần và không có `(…)` ở bài này nên Việt cũng không có. Dấu nháy kép “ ” khớp Pāli từng khoá: mở ở :3.13, :5.5, :5.9, :5.13, :8.5, :8.9, :8.13, :12.5, :12.9, :12.13 và đóng ngay trong khoá; riêng :14.5 mở nháy rồi chỉ đóng ở :14.6 (`hotī”ti`), Việt giữ đúng cấu trúc đó và kết `.”`. Không có nháy đơn ở Pāli nên Việt cũng không có. Các khoá Pāli kết bằng dấu gạch dài `—` (`Tena vuccati—`) được giữ gạch dài (tầng: 3.071 khoá gạch dài so với 1.225 khoá dấu hai chấm). Pāli kết bằng `;` thì Việt kết bằng `;`.

  BẤT ĐỊNH ĐÃ GHI (không thêm vào thân kinh). (1) `gati`: có thể dịch "cõi tái sinh", "nẻo đi", "cảnh giới"; chọn "cảnh giới" theo mn110 và dn12, giữ nghĩa trung tính, không thêm chữ "tái sinh" vào tiêu đề. (2) `upapatti` và `paṭisandhi` được tách thành "thọ sinh" và "tái sinh" trong cùng bài; nếu người biên tập muốn gộp hai từ thì phải đổi một trong hai ở mọi khoá. (3) `javanakkhaṇe` dịch "tại thời điểm tốc hành": `javana` là thuật ngữ A-tỳ-đàm ("tốc hành" là cách quen thuộc), nhưng tầng dịch của dự án chưa có tiền lệ cho từ này (chỉ gặp làm tên riêng ở ja476), nên lựa chọn này chưa được tầng kiểm chứng. (4) `jātacetanāya` ở :3.3 và các khoá cùng khuôn dịch "đối với tư sinh khởi vào thời điểm ấy"; cách đọc khác là "cho tư vừa sinh", cùng nghĩa. (5) `tayo jīvitasaṅkhārā` giữ "ba mạng hành"; Pāli không liệt kê ba mục ấy trong bài này nên không đưa tên ba mục vào thân kinh. (6) `nikanti` dịch "ham muốn" theo an7.49; trong ngữ cảnh A-tỳ-đàm có thể đọc là tham ái lúc cận tử, nhưng Pāli ở đây không nói thêm nên không đưa nghĩa chú giải vào. (7) Tên riêng nhóm "Sát-đế-lợi đại phú …" viết hoa "Sát-đế-lợi", "Bà-la-môn" theo đa số tầng (an, sn, dn) dù ở kn có 4 khoá viết thường "bà-la-môn đại phú". (8) Chính tả: dùng "đồng sanh" (đa số 8/10) nhưng "thọ sinh", "tái sinh" (đa số trong họ từ ấy); đây là hệ quả của việc đo từng từ, không phải thiếu nhất quán trong một từ.

