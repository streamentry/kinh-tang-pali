notes: |-
  TẦNG THAM KHẢO CÓ. `source/upstream-manifest.json` liệt kê
  `sutta/kn/thig/thig9.1_translation-en-sujato.json`; tệp có đủ 41/41 khoá, 39 khoá có chữ
  (im lặng 10.1 là dòng tên tác giả và 11.1 là dòng khép tập). Coverage theo
  `source/layers.yaml`: bài này KHÔNG có khoá Pāli nào dài ≥ 40 ký tự, mẫu số bằng 0, cổng
  coverage không chặn, không cần entry reference-gaps. Tầng `vietnamese-current` vắng.

  LƯU Ý VỀ VIỆC SUY RA TỪ TÊN THƯ MỤC: không suy `thag` có bản Anh chỉ vì tên. Đã kiểm trực
  tiếp `source/upstream-manifest.json`: tầng `english-sujato` có 264 tệp `kn/thag` và 73 tệp
  `kn/thig`, và cả `thag6.14` lẫn `thig9.1` đều có tệp riêng.

  TÊN PHẨM ĐO ĐƯỢC.
  :0.1 giữ Pāli `Therīgāthā 9.1`: 44/57 tệp thig viết dạng Therīgāthā + số, 4 tệp bỏ số,
  9 tệp dùng Trưởng Lão Ni Kệ.
  :0.2 `Navakanipāta`: chưa có tiền lệ trùng giá trị Pāli, nhưng khuôn Bộ N Bài Kính chiếm
  38/58 tệp thig (Bộ Một 18, Bộ Hai 10, Bộ Ba 8, Bộ Bốn 1, Bộ Tám 1), và tầng tên đã ghim
  `thig-name:70` đọc Navakanipāta là The Book of the Nines. Theo đúng bảng tên đã chốt ở
  BRIEF_VI3 §11 (Ekakanipāta → Bộ Một Bài Kính, Dukanipāta → Bộ Hai Bài Kính) và theo khuôn
  đa số của thig: Bộ Chín Bài Kính. Tên phẩm số mười của thig đã có là Tập Sáu (8 tệp) và Nhóm
  Năm (9 tệp) — tức là khuôn không thống nhất tuyệt đối trong thig, ghi ra để người biên tập
  thống nhất nếu muốn.
  :0.3 theo khuôn thig: Kinh Kệ Của Trưởng Lão Nữ X = 28/58 tệp, đứng đầu.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ (Pāli trùng tuyệt đối) — 4 khoá: 6.1 (Mọi lậu hoặc của con đều
  đã đoạn tận), 6.4 (đã làm tròn lời dạy của Đức Phật), 8.1 (Nghe lời ấy của người ấy),
  9.2 (ngày đêm không mệt mỏi). Ngoài ra 3.3, 8.4, 9.2 có tiền lệ 1x mỗi cách.
  6.3 `Tisso vijjā anuppattā` có 24 tiền lệ rời nhau (đa số 7x thêm chủ ngữ Tôi, 6x Ba minh
  đã chứng đắc). Vì 6.1 đã có của con, tôi chọn cách KHÔNG chèn chủ thể, đồng bộ với cách
  thig8.1:7.3 đã dùng.
  10.1 là `… Vaḍḍhamātā therī ….` với HAI dấu lược — giữ đúng hai.
  11.1 `Navakanipāto niṭṭhito.` theo tiền lệ thig8.1:10.1 (Bộ Tám Bài Kính đã khép lại).

  TÊN RIÊNG KHAI VÀO BỘ NHỚ TIẾN TRÌNH: `Vaḍḍhamātā` (0.3) là tên riêng Pāli thật — có mặt
  nguyên văn ở 10.1 — nhưng chưa có ở tầng Việt; khai vào `_TỪ_VI` theo cơ chế
  `lọt_pāli(pāli_riêng=…)`, không sửa `_hvi.py`.

  BẤT ĐỊNH ĐÃ PHÂN XỬ, GHI LẠI.
  (1) `vanatho` + `kudācanaṁ` (1.2): vanatho là bụi gai, kudāca là một loài cỏ gai; dịch bụi
  gai quấn chân. Ở 4.4 và 5.4 cùng từ vanatho thì dịch là sự vướng mắc — đúng vì ở đó nói về
  tâm, không nói về cỏ. NGƯỜI BIÊN TẬP NÊN KIỂM SỰ ĐỒNG NHẤT NÀY.
  (2) `patodaṁ samavassari` (7.2): patoda là roi thúc voi, samavassari là đã rải xuống/ban cho;
  dịch là bộ roi thúc mẹ đã dùng vào con. Bản nháp đầu viết cơm roi mẹ đã ban cho con —
  đổi vì roi thúc mới đúng với hình ảnh mẹ thúc con đi.
  (3) `Sukhañhi vaḍḍha munayo` (2.1): munayo là các bậc giác ngộ (số nhiều), không phải có
  một người nào; đã tách Ơi Vaḍḍha ra câu trước cho đúng số.
  (4) `Dhammasaṁvegamāpādiṁ` (8.3): chịu sự thôi thúc của chánh pháp — Sujato đọc là
  righteous urgency; tôi bám nghĩa chữ, không thêm chữ công bằng vì Pāli không nói.
  (5) `santimuttamaṁ` (9.4) dịch là sự tịnh tĩnh tối thượng, phân biệt với `santimuttama`
  là bậc tối thượng ở 2.1 (`santo` = bậc an tịnh).

  TẦNG THAM KHẢO ĐÃ ĐO.
