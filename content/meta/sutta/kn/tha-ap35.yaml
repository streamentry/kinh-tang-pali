notes: |-
  Bản dịch tiếng Việt mới cho tha-ap35, Mahākaccānattheraapadāna — bài kệ của trưởng lão Mahākaccāna, bài thứ ba của Kuṇḍadhānavagga. Đủ 72/72 khoá, thứ tự và tập khoá khớp Pāli.

  Nội dung: ở kiếp quá khứ, nhân vật kể dâng một chỗ ngồi bằng đá thếp vàng, cùng lọng bằng châu báu và quạt lông đuôi, lên Đức Padumuttara (1.1–2.4). Chư thiên cõi đất tụ họp để nghe Ngài nói quả báo (3.1–4.4). Đức Padumuttara ngồi trên chỗ ngồi bằng vàng, nói lời thọ ký trong dấu nháy đơn (6.1–13.4): vị dâng chỗ ngồi sẽ làm chúa chư thiên ba mươi kiếp, làm Chuyển Luân Vương Pabhassara, một trăm ngàn kiếp sau, trong giáo pháp của Gotama, sẽ là Kaccāna, xuất gia, đạt A-la-hán, được đặt vào vị trí tối thượng nhờ khả năng giảng rộng một câu hỏi vắn tắt. Từ 14.1 là lời tự thuật của ngài ở kiếp cuối.

  Tên bài và thể thức :0.3 — đo trước khi chọn:
  - translationTitle bằng đúng giá trị khoá :0.3 trong bản dịch. Pāli :0.3 (3 Mahākaccānattheraapadāna) BẮT ĐẦU bằng số, nên giữ số thứ tự theo hình thức N. (có dấu chấm): đo trên 138 tệp tha-ap có Pāli :0.3 mở đầu bằng số, 120 tệp Việt viết N. có dấu chấm, 18 tệp viết N không chấm; không có trường hợp thêm số ở chỗ Pāli không có.
  - Hình thức đầu tên: đo trên các :0.3 đã dịch của phẩm tha-ap, Tuyên Ngợ 236 (cộng 10 khoá Tuyên Ngợi), Tuyên Ngôn 105, Ký Sự 99; ở phạm vi gần nhất (Kuṇḍadhānavagga, tha-ap34 và tha-ap38–42) Tuyên Ngôn 3, Tuyên Ngợ 2, Ký Sự 1. Hai phạm vi cho đa số khác nhau. Chọn Tuyên Ngôn vì Ngợ/Ngợi là chính tả không có nghĩa (lỗi gõ), đồng thời Tuyên Ngôn là hình thức nhiều nhất ở phạm vi gần nhất; con số của tôi lệch con số điều phối nêu, xin biên tập phán một lượt cho cả cuốn.
  - 0.2 Kuṇḍadhānavagga dịch Phẩm Kuṇḍadhāna, đúng 5/5 tiền lệ của chính phẩm này. 19.1 `tatiyaṁ` dịch thứ ba, theo tiền lệ của tầng (thứ ba).

  Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti (18.1): dùng nhóm số nhiều đã nói những bài kệ này (443 khoá) thay vì đã từng nói bài kệ này (4 khoá), vì Pāli là số nhiều.

  Bất định đã ghi lại, không sửa trong kinh:
  - aṭṭharatanaṁ (9.3): ratana ở đây có vẻ là đơn vị đo chiều dài (aṭṭharatano, aṭṭharatanubbedho được dùng cho thân voi ở an10.99 và mil6.3.8), khác với ratana là báu ở 2.1, 3.3, 6.2; đây là cách hiểu của người dịch, tầng không có tiền lệ. Giữ nguyên tám ratana trong kinh vì chưa xác lập được cách đổi sang đơn vị Việt mà không thêm nghĩa, và không tra được tiền lệ trong tầng; cần người biên tập phán.
  - brahmabandhu (11.4): dịch sát chữ là thân quyến của Phạm thiên. Ba nơi khác trong tầng dịch thành Bà-la-môn theo dòng họ (thag3.1:3.1, snp2.2:3.2) hoặc thuộc họ Brāhmaṇa (tha-ap433:1.2). Ở đây không có dấu hiệu chê bai, và 14.2 đã có brāhmaṇo riêng cho nghĩa Bà-la-môn, nên giữ nghĩa sát chữ; nếu biên tập muốn thống nhất theo nghĩa dòng dõi Bà-la-môn thì sửa một khoá này.
  - ābhāyābhibhavissati (7.4): abhibhavati là lấn át, vượt trội; yojanasataṁ ở 7.3 là phạm vi (accusative of extent). Dịch lấn át bằng hào quang trong phạm vi một trăm do-tuần; cách hiểu khác (chiếu sáng đến một trăm do-tuần) đổi nghĩa ít. Chủ ngữ là devindo ở 7.1.
  - uggatejo (8.4): hiểu là ugga-tejo, uy lực hùng mạnh; cách hiểu uggata-tejo (uy quang đã vươn lên) cũng có thể, vì tên Pabhassara nghĩa là sáng rỡ; chọn nghĩa ít giả định hơn.
  - cetiya (1.2): dịch đền theo tầng (dn16, ud6.1, an5.143: đền Cāpāla, đền Udena…); tha-ap318:1.1 dịch tháp bảo cho cetiyaṁ. Vì Đức Padumuttara đang tại thế ở bài này nên chọn đền. Pāli không có động từ nối 1.2 với 1.3; dịch thành câu rời, không thêm có.
  - Chủ ngữ 3.4: kathayissati không nêu chủ ngữ; dịch Ngài theo 4.2 satthuno (bậc Thầy đang nói). 3.1–4.4 là lời chư thiên cõi đất, không có dấu nháy trong Pāli nên không thêm dấu nháy.
  - chattānaṁ (3.3) là số nhiều còn chattaṁ (2.1) số ít; tiếng Việt không đánh dấu số nên dịch lọng ở cả hai chỗ, không tự quyết là một hay nhiều chiếc.
  - Tusitā hi (11.1): hi là tiểu từ nhấn mạnh, không dịch riêng; không thêm chữ.
  - etadagge ṭhapesi maṁ (16.4): dịch đã đặt tôi vào hàng tối thắng, theo cách tầng dịch etadagga ở an1 và an9 (tối thắng). aggaṭṭhāne (12.4) dịch chỗ tối thượng theo tiền lệ duy nhất tha-ap19:9.4. Hai chỗ nói cùng sự việc (thọ ký rồi ứng nghiệm) nhưng dùng hai từ vì hai cấu tạo Pāli khác nhau.
  - ajjhāsayaṁ (13.4, 15.3): dịch chí nguyện, theo 9 khoá dn19 và dn25 của tầng (10 khoá ajjhāsaya toàn tầng, 1 khoá ne13 dịch khác); pūrayissati/pūremi là làm tròn. Ở đây ajjhāsaya là chí hướng của người hỏi (15.3 có tesaṁ); 13.4 không có tesaṁ nên không thêm của người hỏi vào kinh. Nếu biên tập thấy chí nguyện quá nặng cho ngữ cảnh hỏi đáp, đổi đồng loạt thành ý hướng ở cả hai khoá.
  - Đại từ ngôi thứ nhất của phần tự thuật là tôi, giữ nhất quán trong bài; lời Đức Phật (6.3–6.4) là Ta.

  Đo tiền lệ (Pāli trùng nguyên văn ở bài khác): 28 khoá của bài có Pāli trùng khoá ở bài khác của phẩm (2.009 cặp, tính cả các khoá công thức 0.1, 17.1–17.3); 15 khoá dùng lại nguyên văn bản dịch phổ biến nhất, 13 khoá khác; trong 2.009 cặp có 94 cặp mà bản Việt của tiền lệ khác bản của tôi. Các khác biệt đáng chú ý:
  - 5.2 và 16.2 (sayambhū aggapuggalo, 5 tiền lệ dịch bậc tự tại, tối thắng giữa loài hai chân): đổi sang bậc Tự Tại, bậc tối thượng giữa loài người, vì giữa loài hai chân là cách dịch của dvipaduttama (15.4 của chính bài này, tầng dịch dvipada là loài hai chân hoặc song chân, vd snp5.1:20.6, tha-ap436:1.4), còn aggapuggalo không có dvipada; giữ nguyên thì hai thuật ngữ khác nhau trong cùng một bài bị gộp làm một.
  - 10.1 (Kappasatasahassamhi): tiền lệ 2 khoá dịch Trong số một trăm nghìn kỳ; đổi thành Vào một trăm ngàn kiếp sau vì -mhi là cách vị trí (locative) chỉ thời điểm tương lai trong lời thọ ký, kappa là kiếp (cùng cách dịch 7.1, tha-ap34:9.3), và dùng ngàn như phần còn lại của tầng. Số: sata 100 × sahassa 1.000 = 100.000, kappa là đơn vị đếm.
  - 9.2: tiền lệ 2 khoá dịch đã bốc lên như trăm tia nắng mặt trời; đổi thành như mặt trời trăm tia sáng đã mọc, theo 4 khoá của tầng dịch sataraṁsiṁva là mặt trời trăm tia sáng mọc lên.
  - 7.1–7.3, 8.1–8.2, 2.3, 6.3–6.4, 14.4: tiền lệ 1–2 khoá, khác ở dạng câu (thêm chủ ngữ, đảo vế); giữ nghĩa, điều chỉnh để liền mạch.
  - 2.3 và 14.4: giữ tôi (ngôi người kể của bài) thay vì Ta của một số tiền lệ; 6.3–6.4: dùng Ta thay vì tôi của tiền lệ tha-ap61, vì người nói ở đây là Đức Padumuttara (5.4 imā gāthā abhāsatha).
  Không có cặp Pāli trùng nguyên văn bên trong chính bài ngoài đúng một cặp (5.2 và 16.2); hai khoá đó dịch giống hệt nhau.

  Số Pāli: Tiṁsa kappāni (7.1) = tiṁsa 30, nên ba mươi kiếp — KHÔNG phải cụm Tiṁsakappasahassa chưa phân xử được (không có sahassa ở đây); Kappasatasahassamhi (10.1) = một trăm ngàn kiếp, 100 × 1.000 = 100.000; yojanasataṁ (7.3) = sata 100, một trăm do-tuần (do-tuần là cách viết 96 khoá của tầng); aṭṭharatanaṁ (9.3) = aṭṭha 8, tám ratana; Paṭisambhidā catasso (17.1) = bốn vô ngại giải; tatiyaṁ (19.1) = thứ ba; đầu :0.3 là số 3.

  Dấu lược: 17.2 là …pe… trong Pāli, giữ đúng một …; không có (…) trần. Dấu nháy: mở “ ở 1.1 đóng ” ở 17.3 (chạy qua nhiều khoá); mở ‘ ở 6.1 đóng ’ ở 13.4; mỗi khoá khớp Pāli.

  Coverage English: mẫu số 1 khoá (18.1); Sujato 0/1; ba tầng tham khảo đều vắng; `content/meta/reference-gaps.yaml` chưa có entry cho tha-ap35 — việc ghi nhận gap thuộc người điều phối.

