notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này.
  Pāli trùng nguyên văn: 5 khoá, dù lại nguyên văn 4 khoá. `:0.1` `Petavatthu` (14/14 nơi) · `:0.2` `Cūḷavagga` (1 nơi, `pv29:0.2`) · `:1.1` và `:1.3` dùng lại nguyên văn bản đã có sẵn của chính câu kệ này.
  Cố ý dịch khác ở `:1.2`: `Vimānamāruyha` là mệnh lệnh ngôi thứ hai (“hãy bước vào”), nhưng tiền lệ dịch thành “cung điện có tâm tư đa dạng, **nàng** đã bước vào” là ngôi thứ ba quá khứ, trái cả văn phong `pv29` (dùng “ngươi” cho `tvam`), nên tôi dịch “ngươi bước vào cung điện có tâm tư đa dạng;”. Vì thiếu ngữ cảnh tôi **không** kết luận ai đang nói với ai.
  Tên `0.3` và `9.1`: `Rathakārapetivatthu` dịch “Chuyện Ngạ Quỷ Người Kéo Xe” theo khuôn `N. Chuyện Ngạ Quỷ …` của `pv29`/`pv2`. `Rathakāra` không có tiền lệ trong tầng; đọa theo nghĩa chữ nghĩa là người kéo xe, không suy đoán thêm.
  Thuật ngữ theo tiền lệ đếm được: `veḷuriya` → ngọc lưu ly (19 nơi); `pokkharaṇī` không có tiền lệ trong tầng; ở đây `pokkharaṇī` đi cùng `samantamotthatā` (lót) và `paṅko paṇako` (bùn, đất sét) nên nó là **chỗ nằm phủ hoa**, tôi dịch “tấm sàn trải hoa” chứ không dịch là “ao sen” — đây là chỗ tôi đã cân nhắc và ghi rõ. `puṇḍarīkā` → bông sen; `suvaṇṇacuṇṇehi` → bụi vàng; `haṁsā` → thiên nga; `dundubhī` → trống đồng; `Nanda` → rừng Nanda (đã có trong tầng); `Āḷāra` giữ nguyên Pāli vì là tên hang, đã có trong tập từ của tầng; `peti` → ngạ quỷ (xem `pv29`).
  Bất định: `:4.3` `vaggūpanadanti` không có tiền lệ, dịch “tiếng trầm trùm”; `:5.1` `Daddalla` là tên một chiếc trống, giữ nguyên Pāli; `:7.4` `kāmakāminin` (kẻ mong cầu sự thỏa mãn) dịch theo nghĩa chữ nghĩa.
  Không khoá nào trong 8 bài này có `…pe…` ở Pāli (đã kiểm 296/296 khoá), nên không có dấu lược nào để giữ, và không có chỗ nào bịa dấu lược che chỗ thiếu.
  Đo lại trên đĩa, hai con số coordinator nêu ở mục (4) của prompt KHÔNG khớp: `bhante` trong tầng `mil` dùng **“thưa tôn giả” 149 lần / 71 tệp**, “bạch ngài” chỉ 37 lần / 23 tệp, “bạch thầy” = 0 (giữ nguyên phần đúng của bạn); `mahārāja` dùng **“này Đại vương” 395 lần / 101 tệp**, còn “tâu đại vương” chỉ 169 + “tâu Đại vương” 79 = 248 lần / 32 tệp. Cả 9 bài lân cận mil3.1.12/.14 và mil7.3.1/.9 đều dùng “này Đại vương”, nên lát này theo đo được, không theo con số bạn đưa.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đủ 37/37 khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không trùng nguyên văn Pāli, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
