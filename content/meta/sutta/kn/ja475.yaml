notes: |-
  Đợt 17, lát n179. Dịch từ Pāli root commit đã ghim — không có tầng Anh cho uid, tầng Việt hiện
  hành chỉ có Pháp Cú. Đối chiếu tham khảo ngoài store: bản dịch Anh R. Chalmers 1895 (public
  domain), bản Việt Tỳ khưu Indacanda (tamtangpaliviet, Jātakapāḷi tập I) — chỉ dùng để phân xử
  nghĩa, không sao chép câu nào vào thân kinh. Chú giải Aṭṭhakathā (via ePitaka) xác nhận ngữ
  cảnh: thần cây Phandana mớm lời thợ xẻ chặt da thú vương quanh vành xe, rồi thợ xẻ giết sư tử.

  **Tiêu đề — hai tên mới, khai theo tầng tên SuttaCentral.**
  - `0.2` “Bộ Mười Ba Bài Kinh” — tầng tên `ja-name:533` = “The Book of the Thirteens”, theo khuôn
    “Bộ Mười Hai Bài Kinh” (6 tiền lệ). Chưa có tệp Terasakanipāta nào trong tier nên đây là lần
    dùng đầu.
  - `0.3` “Phẩm Xoài” — tầng tên `ja-name:534` = “Mangoes”; tiền lệ danh từ chung “Kinh Xoài”
    (ja124, ja344). Cũng là lần dùng đầu.
  - `0.4` “2. Kinh Phandana” theo khuôn “N. Kinh <tên>” (ja443, ja455); `14.1` “Kinh Phandana, thứ
    hai.” theo ja455:13.1 (Pāli `dutiyaṁ`).

  **Phân xử điểm khó.**
  - `issa` (2.1, 8.1, 9.4, 10.1–10.2, 11.4, 12.4): theo tầng tên `ja-name:536` “The Lion and the
    Boxwood Tree” và chú Chalmers (“īso, ‘lord’, i.e. lion, king of beasts”) — “issa” = thú vương
    (vua loài thú, tức sư tử); bản Indacanda ở phần truyện lại viết “con gấu” nhưng chính các kệ
    của ông là “sư tử / chúa rừng” — chọn “thú vương” cho nhất quán với phủ định ở 9.4
    (`issānaṁ` = “của loài thú vương, đã sinh và chưa sinh”).
  - Tên cây `sāla`, `khadira`, `assakaṇṇa`, `dhava`, `phandana` giữ nguyên Pāli theo tiền lệ ja455
    giữ tên hoa Pāli (`sallakī`, `kuṭajā`, `kaṇikārā`).
  - `ukkacca caturaṅgulaṁ` (8.2): “cắt một dải da rộng bốn ngón” — `caturaṅgula` = 4 ngón tay.

  **Số Pāli — tự tính, in phép:** `caturaṅgulaṁ` = 4 ngón (8.2). Không có số nào khác.

  **Trùng nguyên văn nội bài:** 3 cặp (`1.3 = 2.3 = 4.3`, cùng `Puṭṭho me samma akkhāhi`) — đã
  đồng nhất một cách dịch “được ta hỏi, này bạn, hãy nói:”, 0 cặp lệch. Không có dấu lược nào
  trong bài (Pāli 0 `…`).

  **Bất định — ghi lại, không tự xử trong thân kinh.**
  - `yogakkhemā na dhaṁsatī` (13.4): dịch theo nghĩa đen `yoga` (xiềng xích) + `khema` (an ổn) —
    “sẽ chẳng rơi khỏi nơi an ổn, chốn thoát xiềng xích”; Chalmers đọc thành “final peace”,
    Indacanda “sự an toàn đối với các mối ràng buộc”. Không có tiền lệ tầng Việt cho từ này.
  - `veraṁ appesi` (9.2): Chalmers “made enmity”, Indacanda “kết oan trái” → “gieo thù hận”.
  Vì hai chỗ trên, `ambiguity_integrity` 9.1.

  Kiểm: 57/57 khoá đúng tập và thứ tự Pāli; NFC, nháy kép từng khoá, dấu lược — 0 lệch;
  0 cặp trùng nội bộ bị lệch. Dấu câu dòng cuối khớp Pāli, trừ 3 chỗ chủ đích dùng dấu hai chấm
  trước câu hỏi (1.3, 2.3, 4.3) cho tự nhiên hơn.

  Triangulation 7.8: ba tầng store đều vắng cho uid (coverage không đo được) nhưng có đối chiếu
  hai bản dịch ngoài store ⇒ dưới ngưỡng 8.0 theo quy định.

  technical_integrity 9.6: cổng kỹ thuật do coordinator chạy — npm run validate; npm test;
  npm run check; npm run build.
