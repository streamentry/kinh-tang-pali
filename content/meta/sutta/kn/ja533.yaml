      + `1.1`–`1.4`: Dhataraṭṭha nói với Sumukha. `2.1`–`4.4`: Sumukha nói với Dhataraṭṭha (xưng hô `mahārāja`, `vihagādhipa`). `5.1`–`7.4`: Dhataraṭṭha. `8.1`–`10.4`: Sumukha. `11.1`–`12.4`: Dhataraṭṭha. `13.1`–`18.4`: lời kể. `19.1`–`20.4`: người thợ săn (hỏi Sumukha). `21.1`–`21.4`: Sumukha (gọi thợ săn là `dijāmitta`). `22.1`–`22.4`: thợ săn. `23.1`–`24.4`: Sumukha. `25.1`–`25.4`: Sumukha (xin thợ săn). `26.1`–`26.4`: thợ săn. `27.1`–`30.4`: Sumukha. `31.1`–`33.4`: thợ săn. `34.1`–`35.4`: Sumukha (lời mở là lời kể, xem phần nháy). `36.1`–`39.4`: Sumukha chỉ cách cho thợ săn. `40.1`–`40.6`: lời kể. `41.1`–`41.4`: thợ săn tâu vua. `42.1`–`42.4`: vua loài người. `43.1`–`56.4`: thợ săn kể lại với vua. `57.1`–`57.4`: lời kể. `58.1`–`58.4`: Sumukha hỏi vua loài người; `59.1`–`59.4`: vua đáp; `60`–`61` và `62.1`–`62.4`: Sumukha hỏi, vua đáp (`61`, `63`); `63.1`–`65.4`: vua (một đoạn nháy mở ở `63.1`, đóng ở `65.4`; sau phần đáp ở `63`, vua hỏi tiếp Dhataraṭṭha ở `64`–`65`). `66.1`–`69.4`: Dhataraṭṭha đáp vua. `70.1`–`70.4`: vua. `71.1`–`71.4`: lời kể. `72.1`–`73.4`: vua. `74.1`–`74.4`: Dhataraṭṭha mời Sumukha nói. `75.1`–`77.4`: Sumukha. `78.1`–`80.4`: vua. `81.1`–`84.4`: Dhataraṭṭha. `85.1`–`89.1`: lời kể và kết.
      + Hai khoá có nháy lệch chỗ ở chính tầng Pāli, được giữ đúng từng khoá: `34.1` mở nháy `“` trên một dòng lời kể (lời nói thật bắt đầu ở `35.1`, đóng ở `35.4`), nên bản Việt `34.1`–`34.4` nằm trong nháy; và `43.1` mở nháy cho cả đoạn thợ săn kể lại, đóng ở `56.4`. Nháy đơn `‘…’` lồng ở `49.1`–`53.4` (Pāli: `49.1` mở `‘`, `53.4` đóng `’`; trong đó `52.1`–`52.4` có nháy kép `“…”`) cũng được giữ như vậy.
    - Pāli trùng nguyên văn:
      Dò Pāli của 359 khoá với toàn bộ Pāli đã ghim (mọi bộ) có bản Việt, loại các khoá dưới 12 ký tự chuẩn hoá: 57 khoá có dạng trùng ở bài khác, tổng 141 cặp, trong đó bản Việt giống hệt (bỏ dấu câu) ở 99 cặp và khác ở 42 cặp. Dùng lại nguyên văn ở nhóm khoá sau: `1.2`, `1.3` (cùng cấu trúc `ja501:1.3`), `1.4` (`ja502:3.2`), `4.1` (`ja520:5.1`), `20.1`–`20.4` (`ja502:10.1`–`10.4`), `21.2`–`21.4` (`ja502:11.2`–`11.4`), `23.1`–`23.4` (`ja502:7.1`–`7.4`), `31.4` (`an3.48:4.4`, `an5.40:3.4`), `33.1`–`33.2` (`ja502:12.3`–`12.4`), `35.1`–`35.4` và `49.1`–`49.4` (`ja502:13.1`–`13.4`, `ja501:15`, `ja359:5`), `39.3`/`53.3` (`ja523:47.3`), `40.1`/`47.1`/`68.1` ("Nghe lời nói ấy của vị ấy" theo `ja505:6.1`), `55.2` (`ja484:13.2`), `57.1` (`ja530:1.1`), `58.1`–`59.4` (`ja502:14`–`15`), `60.1`–`60.2`, `61.1`–`61.2` (`ja502:16`–`17`), `60.4`/`61.4` (`sn4.23:7.2`), `62.1`–`63.4` (`ja502:18`–`19`), `79.4` (`ja516:5.4`).
      Cặp mà bản Việt khác có lý do: `20.3` (`ja430:3.3` là chim sẻ, ở đây theo `ja502:10.3`); `23.1`–`23.4` (`ja399:5`, `ja164:2` là hai bài khác, đã dịch "suy việt… tự bỏ mạng mình", 2/3 cặp; ở đây theo `ja502:7`, cùng bài song song với bài này); `28.1` (`ja465:4.3` "Với thân hình cân xức" chỉ nêu thân hình, dòng `28.2` ở đây còn cần "chiều cao" để nối tiếp "ngang nhau"); `35.1`–`35.3` và `49.1`–`49.3` (`ja399:7.1`, `ja455:7.4`, `ja359:5.3`: người nói khác, xưng "thiếp"); `40.1`/`47.1`/`68.1` (7 cặp "Nghe lời nói ấy" không có "của vị ấy", bài khác; ở đây cần chỉ đúng người vừa nói là Sumukha); `45.3` (`ja281:3.1` nằm trong câu nói khác); `56.2` (xem dưới); `63.4` (`tha-ap171:3.2` dịch "ham theo lòng mong của Ngài", câu khác).
      Trong chính bài: 31 nhóm Pāli trùng nguyên văn (sau khi bỏ dấu câu), tổng 52 cặp; bản Việt giống nhau ở 51 cặp; khác nhau ở 1 cặp: `56.2` ("tôi không thấy món nào khác như thế", thợ săn nói về món lễ vật) so với `79.4` ("ta không thấy ai khác như thế", vua nói về người). Các nhóm quan trọng: `34.1`–`34.4`/`48.1`–`48.4` (`57.3`–`57.4` cùng với `34.3`–`34.4`, và `71.4`), `35`/`49`, `36`/`50`, `37`/`40.5`–`40.6`/`51`, `38`/`41`/`52`, `39`/`53`, `40.1`/`47.1`/`68.1`, `26.3`/`33.3`, `60.2`/`61.2`, `60.4`/`61.4`, `62.2`/`63.2`, `62.3`/`63.3`.
    - Số Pāli:
      `ubho` (`27.1`…`28.2`, `29`, `37.2`, `54.4`, `80.4`), `ubhayo` (`14.3`) = hai/cả hai; `ubhinnaṁ` (`6.4`) = của cả hai; `ubhayato` (`37.4`, `40.6`, `51.4`) = ở cả hai đầu (đòn gánh); `ekaṁ` (`17.1`) = một con; `ekena` (`27.3`) = một con; `paṭhamamāpade` (`64.4`) = hoạn nạn đầu tiên; `paṭhamaṁ` (`89.1`) và "1" (`0.4`) khớp = thứ nhất; `asīti` (`0.2`) = 80. Không có số lớn, và không có cụm thuộc loại chưa phân xử được, kể cả `Tiṁsakappasahassa`.
    - Thuật ngữ (có đếm trên tầng):
      + `luddaka` → "bác thợ săn" khi xưng hô (`ja502:13.1`, `ja501:15.1`, `ja359:5.1`: 3/3); `luddo`/`nesāda` → "thợ săn" (40 khoá `ja` có `ludd…` dịch "thợ săn"); `mahārāja` → "tâu đại vương" (69 khoá `ja`, 16 khoá khác); `deva` xưng hô → "tâu đại vương" (23 khoá, so với "tâu vua" 11, "bệ hạ" 1 và 9 khoá khác, trong 44 khoá `ja` có `deva` đứng riêng); `dijādhipa`/`vihagādhipa` → "vua loài chim" (`ja502:13.4`); `dija`/`sakuṇa`/`vihaṅgama` → "chim"; `haṁsa` → "thiên nga"; `dhataraṭṭha` số nhiều ở `15.1`, `30.3`, `38.1`, `41.1`, `52.1`, `88.3` → "thiên nga Dhataraṭṭha" (tên đàn/loài của vua Dhataraṭṭha; không có tiền lệ khác, `ja534` chưa dịch); `vakkaṅga` → "kẻ thân cong" (`ja502:1.2`, `ja502:9.3`; 3 khoá dịch "thân cong", 7 khoá khác dịch khác); `kaṇṇasukhaṁ vācaṁ` → "lời êm tai" (`ja501:17.1`); `antepura` → "nội cung" (24 khoá "nội cung" so với "hậu cung" 4); `senāpati` → "đại tướng" (22 khoá "đại tướng" trong mọi bộ, `dn24:1.18.18`, `mn108:24.1`); `kāja` → "đòn gánh" (4 khoá: `ja507:22.3`, `mn127:12.3`, `mn81:18.13`, `an8.8:6.3`); `āpadā` → "hoạn nạn" (`ja502:22.4`); `bhatti` → "lòng trung thành" ở `9.3`, `11.2` (người dưới đối với chủ) và "lòng quý mến" ở `81.4` (vua đối với hai thiên nga, chiều ngược lại); `pāsa` → "bẫy"; `baddha` → "bị trói"; `upāsati` → "hầu cận" (`ja502:10.2`); `dhammo` (nguyên tắc) → "Pháp" (`ja520:5.1`, `ja510:23.1`, `ja447:11.1`) và `dhammena` ở các câu vua cai trị → "đúng pháp" (`ja502:14.4`); `khema` → "an ổn" (3 so với "an toàn" 4 trong khoá `ja`); `kacci` mở câu hỏi → "có phải" (12 khoá); `arindama` xưng hô → "hỡi bậc hàng phục kẻ thù" (`pv38:16.4`, `pv38:21.2`); `padakkhiṇaṁ katvā` → "lễ hữu nhiễu" (`ja523:45.2`); `pasāda` → "niềm tịnh tín"; `nāvakaṅkhanti jīvitaṁ` → "không còn mong cầu sự sống" (`sn4.23:7.2`); `puttadārā ca bandhavā` → "con cái, vợ chồng và thân quyến" (theo `an3.48:4.4`, `an5.40:3.4`; `dāra` ở Pāli là "vợ").
      + Xưng hô: Dhataraṭṭha nói "ta/bạn" với Sumukha (`ja502:2.1`, `5.3`), Sumukha nói "tôi/ngài"; thợ săn nói "tôi/bạn" với Sumukha (`ja502:12`) và "tôi/tâu đại vương" với vua; vua nói "ta/ngài" với Dhataraṭṭha (`ja502:15`) và "ta/hai vị" ở `72`–`80`.
    - Chỗ bất định (không thêm vào thân kinh):
      + `1.1` `anupacinantā`: không có tiền lệ; đọc như "không đoái hoài" (cùng nghĩa `anapekkhamānā` ở `ja502:2.3`); cách đọc khác là "không tích lũy".
      + `5.2` `mahānasā`: chỉ gặp một lần trong toàn lớp Pāli (các khoá khác có `mahānasa` là "nhà bếp"); đọc như xưng hô, dịch "hỡi bậc cao cả" theo yếu tố `mahā-`, yếu tố `-nasā` không xác định. Có thể là dạng sai chép của `mahāyasā` ("hỡi bậc danh tiếng lớn"); không phân xử được.
      + `5.3` `cetayānassa` → "người có suy xét" (không có tiền lệ; có thể là "đang có ý định").
      + `7.1`–`7.4`: `kañcanadepiñcha` → "bậc lông vàng" (`kañcana` vàng, `piñcha` lông, chữ `de` không xác định); `yaṁ na` không phân xử được (không dịch riêng chữ `na`); câu đọc là "kẻ nào đã rơi vào bóng tối mù mịt, bỏ mạng vì kẻ như thế thì làm sáng tỏ được lợi ích nào".
      + `8.3` `apacito` → "được tôn kính"; `9.1` `apekkhāno` → "xem trọng". `10.3`–`10.4` `jīvitassāpi … hetu`: `hetu` ở đầu dòng `10.4` đọc là "vì" của `jīvitassāpi` (theo `ja501:11.4` "dù vì mạng sống"), nên `dhammamanussaraṁ` là "khi nhớ nghĩ đến Pháp".
      + `11.3` `Kāmaṁ karassu mayhetaṁ`: đọc là "về việc này của ta, bạn cứ tùy ý mà làm" (cách đọc khác: "hãy thực hiện ý muốn này của ta"). `12.2` `khaṇḍaṁ` → "chỗ thiệt hại" (nghĩa đen "chỗ vỡ"); `12.3`–`12.4` đọc `assa` là lời mong, chủ thể là Sumukha.
      + `14.1` `abhisañcikkha` → "nhận ra" (hình thái hiếm; có thể là "thấy rõ"). `14.2` `hitā` → "bạn tốt của nhau". `15.1` `Dhataraṭṭhe` đọc là "những thiên nga Dhataraṭṭha" (đàn); cách đọc khác: tên vua ở dạng số nhiều. `16.3` `paccakamittha` → "bước lại gần" (cách đọc khác: "lui lại"; `67.1` `paccagamittha` cùng mạch "tiến lại"). `17.3`–`17.4` `pekkhamānamadīnavaṁ`: đối cách, đọc là chỉ con bị trói đang nhìn không sầu não; cách đọc khác: chỉ con kia.
