notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja533_root-pli-ms.json` (359/359 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ: bốn dòng tiêu đề `0.1`–`0.4`, 88 bài kệ (`1`–`88`) và dòng kết bài `89.1`; phần văn xuôi của Jātaka không nằm trong tầng Pāli đã ghim, nên người nói được suy từ xưng hô, nháy và mạch của chính các bài kệ. Nội dung chính: vua thiên nga Dhataraṭṭha mắc bẫy, đại tướng Sumukha không chịu bỏ ngài mà đi; người thợ săn xúc động, thả cả hai, dẫn vào gặp vua loài người, được hậu đãi; hai thiên nga trở về với đàn. Bài có song song gần nhất ở `ja502` (cùng nhan đề Cūḷahaṁsajātaka ở Pāli, đã dịch) và ở `ja534` (chỉ có Pāli, chưa có bản Việt); các khoá Pāli trùng nguyên văn đã dùng lại cách dịch của tầng.

    - Tầng tham khảo:
      Tầng English của Sujato không có ja533 (Sujato Jātaka chỉ có 83 tệp: ja1–79, ja126, ja159, ja466, ja534; đây là not-published-upstream, không phải not-synced); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng (đặc biệt `ja502`, `ja501`, `ja520`) và bối cảnh của chính bài. Bản Pāli của `ja534` được dùng làm song song Pāli để đối chiếu từ ngữ, không phải bản dịch độc lập. Tôi không dùng bản tóm lược hay bản dịch ngoài tầng đã ghim làm câu chữ hay đối chiếu. Vì vậy `triangulation` 7.8 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
    - Coverage English:
      Mẫu số = 0: trong 359 khoá, không khoá nào có Pāli từ 40 ký tự trở lên theo `source/layers.yaml` (toàn vế kệ ngắn), nên cổng coverage không đo được gì ở bài này. Điều đó không có nghĩa là không cần ghi nhận gap; entry `reference-gaps.yaml` cũng không cứu được `published`. Sujato phủ 0/359 khoá, `english-project` 0/359, `vietnamese-current` 0/359.
    - Phân loại & tiêu đề:
      + `0.1` "Jātaka"; `0.2` "Bộ Tám Mươi Bài Kinh" (Asītinipāta, asīti = 80; khuôn "Bộ Sáu Mươi Bài Kinh" của `ja529:0.2`, "Bộ Hai Mươi Bài Kinh" của `ja502:0.2`); `0.3` "Phẩm Thiên Nga Nhỏ" (tên phẩm Cūḷahaṁsavagga; dịch theo nghĩa như "Phẩm Xoài", "Phẩm Hươu", "Phẩm Bốn Cửa" thay vì giữ phiên âm như "Phẩm Cūḷakuṇāla", vì nhan đề bài đã Việt hóa); `0.4` "1. Kinh Thiên Nga Nhỏ" và `89.1` "Kinh Thiên Nga Nhỏ, thứ nhất." theo khuôn "Kinh <Tên>" / "Kinh <Tên>, thứ n" của `ja526`, `ja529`, `ja502` (`paṭhamaṁ` = thứ nhất, khớp "1." ở `0.4`).
      + Nhan đề trùng với `ja502:0.4` ("6. Kinh Thiên Nga Nhỏ"; Pāli cùng là Cūḷahaṁsajātaka): giữ y nhan đề đã dùng, hai bài phân biệt bằng số thứ tự, bộ và phẩm. `haṁsa` → "thiên nga" (18 so với "ngỗng" 6 trong các khoá `ja` có `haṁs…` và có tên loài chim; `ja502`, `ja476`); `Cūḷa-` → "Nhỏ" (theo `ja502`, `ja430`, `ja193`).
