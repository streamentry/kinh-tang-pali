  Nghiên cứu nguồn ngoài 2026-10-16: H.T. Francis (dịch), The Jātaka vol. V (PTS 1905, phạm vi công cộng; đọc qua static.sirimangalo.org/old/jataka/5.htm, Jātaka 533 tr. 175–185); đã đối chiếu toàn bài (kệ 1–88, các nhóm lặp 38–53 và 85–88); không sửa khoá nào, nghĩa khớp Francis ở mọi khoá có nội dung riêng (lòng trung thành của Sumukha, đề nghị đổi mạng, lời người thợ săn dâng thiên nga lên vua, lời hỏi thăm của Dhataraṭṭha và nhà vua). Francis phóng dịch lệch Pāli ở 12 ('ties that bound my kin… may pass to thee'; bản dịch theo Pāli `yaṁ khaṇḍaṁ ñātinaṁ mayā… assa paramasaṁvutaṁ`) và gán lời 31 cho người thợ săn; không đổi bản dịch. Không có chỗ bất định mới.

  Nguồn thứ hai 2026-10-16: Tỳ khưu Indacanda, Tam Tạng song ngữ Pāli–Việt, Tiểu Bộ – Bổn Sanh II (TTPV tập 33),
  kệ CST 3717–3804 (88 kệ, trùng 88 kệ bilara); bản Việt trực tiếp từ Pāli, độc lập với bản dự án;
  https://tamtangpaliviet.net/TTPV/33_Ja_II.pdf; Buddhist Cultural Centre, Sri Lanka, in lần thứ nhất 2017;
  không có giấy phép máy đọc được nên `NOASSERTION`, chỉ đối chiếu, không chép câu chữ) và chú giải
  Jātakaṭṭhakathā (https://ancient-buddhist-texts.net/Buddhist-Texts/K10-JA/533.htm; chỉ dùng giải nghĩa, trần
  thấp hơn bản dịch); khi phân xử có đối chiếu thêm H.T. Francis (nguồn đã dùng lượt trước). Đã đọc cặp
  Pāli–Việt dự án–Indacanda của toàn bộ 88 kệ; đối chiếu 356/359 khoá (kệ `1.1`–`88.4`, `0.4`, `89.1`;
  `0.1`–`0.3` không có đối ứng so sánh được); KHỚP 341, LỆCH-THẬT 6 khoá (đã sửa), NGUỒN-LỆCH 4, chưa phân xử 5.
  Đã sửa theo Pāli ghim, chú giải, Indacanda và Francis: `5.1`–`5.2` `gati aññā mahānasā` là "nẻo nào khác ngoài
  bếp lớn" (`mahānasā` là cách xuất xứ của `mahānasa` "nhà bếp lớn", như `ja292:2.3`; Indacanda "cái lò bếp",
  Francis "cruel spit"), bản cũ đọc như xưng hô "hỡi bậc cao cả"; `11.3`–`11.4` `kāmaṁ karassu mayhetaṁ` là "hãy
  làm điều ta mong muốn" (chú giải `mama kāmaṁ… vacanaṁ karassu`), bản cũ "bạn cứ tùy ý mà làm"; `16.3`–`16.4`
  `paccakamittha… baddhā iti vicintayaṁ`: `paṭikkamati` là lùi/chùn lại (chú giải: giảm tốc, đi chậm, nghĩ
  `baddhā, na baddhā`), bản cũ "bước lại gần, nghĩ rằng chúng bị trói"; `67.1` `paccagamittha` chú giải
  `osakkittha` "lùi lại", bản cũ "tiến lại". Các mục notes cũ nêu cách đọc khác hoặc yếu tố không xác định cho
  `5.2`, `11.3` nay đã phân xử như trên. NGUỒN-LỆCH (bài giữ): `22.3`–`22.4` `padañhetaṁ mahantānaṁ` (Indacanda
  "bản tánh"), `42.3`–`42.4` `issare` (Indacanda "lãnh địa"). Chưa phân xử: `12.2`–`12.4` `khaṇḍaṁ` (Indacanda
  "điều ràng buộc", bài "chỗ thiệt hại"); `17.4` `pekkhamānamadīnavaṁ` (chú giải đọc `ādīnavaṁ`, bài "không chút
  sầu não"); `75.2` `nāgarājārivantaraṁ` (chú giải thêm hình ảnh vào trong giỏ, bài chưa nêu). Công thức
  triangulation: 8,4 + 0,6 × (356/359) × (351/356) = 8,99, làm tròn 9,0; semantic_fidelity +0,1 và grammar_logic
  +0,1 vì sửa lỗi nghĩa/ngữ pháp.

  Sửa lỗi nghĩa 2026-10-16: 46.3 `anutthunanto` — "ngồi đó không than van" → "ngồi đó than thở"
  (anutthunāti = than thở/ai oán theo DPD, https://www.dpdict.net; Indacanda kệ 3762 "ngồi than vãn",
  https://tamtangpaliviet.net/TTPV/33_Ja_II.pdf; chú giải hiểu là "bhattuguṇe vaṇṇento", tán dương đức
  của chủ, và Francis "whose praise he sang",
  https://ancient-buddhist-texts.net/Buddhist-Texts/K10-JA/533.htm,
  https://ancient-buddhist-texts.net/English-Texts/Jataka/533.htm; không nguồn nào cho phủ định);
  7.1–7.4 `yaṁ na kañcanadepiñcha andhena tamasā gataṁ` — "Kẻ nào … đã rơi vào bóng tối mù mịt; bỏ
  mạng vì kẻ như thế" → "chẳng khác việc làm trong bóng tối mù mịt; vì một việc như thế mà bỏ mạng"
  (chú giải "yaṁ nā ti ettha na-kāro upamāne … gataṁ ti kataṁ", Indacanda kệ 3723, Francis "Wrapped …
  in night will be your deed", cùng URL); 17.4 `pekkhamānamadīnavaṁ` — "không chút sầu não" → "trong
  nỗi ưu phiền" (chú giải "ādīnavam-eva hutvā mahāsattaṁ olokentaṁ", Indacanda kệ 3733 "xem xét tai
  họa"; không có từ *dīnava để phủ định bằng a-, nên đọc là ādīnava với nguyên âm ngắn vì vần luật;
  mức chắc vừa phải, các bản Anh Francis không dịch từ này).
