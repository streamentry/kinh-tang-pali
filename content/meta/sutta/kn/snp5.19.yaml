notes: |-
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 1.3 (ngôi và thì: `addakkhi`, `akkhāsi` aorist ngôi 3, chủ thể là Đức Phật ở 1.4; lời giải cnd22:3.1 `yathā addakkhi tathā akkhāsi ācikkhi desesi…`, Pj II `yathā sāmaṃ saccābhisambodhena … addakkhi`, Sujato; như cnd22:1.3, cnd4:1.3, notes cnd4 đã báo); sửa 6.1 (bỏ sót chữ nội dung `āsino` «đang ngồi»: Pj II `tamanudāsinoti tamonudo āsino`, lời giải cnd22:49.2 `āsīno ti nisinno`; như cnd22:36.1, cnd4:6.1); sửa 19.1 (bỏ «Bậc»: `asaṁhīraṁ asaṅkuppaṁ` chỉ Niết-bàn, lời giải cnd22:135.1, 136.1, Pj II `dvīhipi padehi nibbānaṃ bhaṇati`; như cnd22:134.1). Giữ 1.6 (câu hỏi tu từ, quyết định đã ghi ở notes cnd22), 2.4 «đầy đủ phẩm hạnh» (Pj II `guṇūpasañhitaṃ`), 12.3, 16.1, 16.3 (Pj II `saddhaṃ uppādetvā`).
