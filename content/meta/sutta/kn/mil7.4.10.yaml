  THUẬT NGỮ CỦA `CAKKAVATTI` — 0 TIỀN LỆ, VÀ ĐÂY LÀ ĐIỂM PHẢI NÓI RÕ.
  Trong tầng `mil` chỉ có **9** khoá chứa `cakkavatti`, và chúng đã **tách làm hai**:
  "vua Chuyển Luân" (**5** khoá, mil3.1.10:2.2–2.5) và "vua Chuyển Vòng Bánh Xe" (4 khoá,
  mil3.1.13). Ngoài ra `tha-ap` dùng "Chuyển Luân Vương" (thi-ap5:4.3, thi-ap7:4.1,
  thi-ap16:5.1…) và `sn`/`dn` dùng "Chuyển Luân Vương" (dn34, sn22.102:9.1, sn46.50:2.1).
  Tôi chọn **"vua Chuyển Luân"** vì đó là đa số trong `mil` và trong tầng `kn` nói chung, và vì
  `:11.4` của chính bài này (`sakko ca cakkavattināti`) cũng nằm trong bài đang đọc. Ghi lại
  để người điều phối gộp: hai bài mil3.1.13 đang dùng cách khác và có thể cần sửa theo.

