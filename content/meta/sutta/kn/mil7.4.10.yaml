  LỖI BẢN NHÁP BẮT ĐƯỢC KHI REVIEW ĐỐI KHÁNG — 8 CHỖ, ĐÃ SỬA HẾT.
  (1) **`:3.4` và `:5.1`** — nháp đầu đóng ngoặc kép `”` ở hai khoá này, làm bộ chốt báo lệch
    (xem mục nháy kép ở trên). Đây là lỗi bắt được bằng cơ chế, không phải bằng mắt.
  (2) `:4.1` `anuyāyati kalyāṇapāpakāni vicinamāno` — nháp đầu dịch **"đem tốt điều ác đến
    khắp nơi"**, tức biến vị chuyển lưu thành kẻ **gây** điều ác; Pāli nói vị ấy đi **xét**
    (`vicinamāno`) điều lành điều ác. Đã sửa thành "đi xét điều lành điều ác khắp nơi"; tiền
    lệ `kalyāṇapāpake` ở mil7.4.8:7.1 là "điều lành và điều ác".
  (3) `:1.2` `saṅgahavatthūhi` — nháp đầu dịch "bốn **căn cứ quy tụ**", vừa lặp chữ vừa sai
    sắc thái. Đã tra được tiền lệ rõ: an8.24:1.18/1.19/1.20 dùng "bốn **phương thức hội
    tụ**" cho đúng cụm `catūhi saṅgahavatthūhi` ⇒ đã sửa theo.
  (4) `:2.1` `na uṭṭhahanti` — nháp đầu dịch "không có kẻ trộm nổi lên **nữa**" (vế so
    sánh không có trong Pāli). Đã bỏ "nữa".
  (5) `:1.3` `mānasaṁ saṅgahetabbaṁ anuggahetabbaṁ sampahaṁsetabbaṁ` — nháp đầu dịch
    "…nâng đỡ và khuyến khích **họ**", tức đổi tân ngữ trong Pāli (tân ngữ là `mānasaṁ` =
    cái tâm) sang đại từ. Đã sửa thành "…nâng đỡ và khuyến khích tâm ấy".
  (6) `:4.4` nháp đầu dịch "trong tập kinh Tăng Chi Bộ **tối thượng**" — thêm chữ không có
    trong Pāli và lệch với hai tiền lệ `nikāyavaralañchake` đã có ⇒ đã sửa thành "thuộc Tăng Chi
    Bộ".
  (7) `:0.4` nháp đầu đặt "**Bốn** Chi Phần" trong tiêu đề. Pāli `Cakkavattiṅgapañha` không
    có số; và hai bài cùng phẩm có số đều **không** đặt số trong tiêu đề (mil7.4.1 "1. Câu
    Hỏi Về Các Đức Tính Của Đất" cho `pañca aṅgāni`; mil7.4.8 "8. Câu Hỏi Về Các Đức Tính
    Của Mặt Trời" cho `satta aṅgāni`) ⇒ đã bỏ "Bốn".
  (8) `:3.1` `Vitakkūpasame ca yo rato` — nháp đầu bỏ mất `ca … yo` và dịch `rato` thành
    "chấp trú" (nghĩa hơi mạnh). Đã viết lại thành "Kẻ nào chấp trú trong sự dừng dậy của
    tư tưởng", giữ cả vế quan hệ.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  (1) `satidovāriko` (`:6.2`, `:7.1`) — **0 tiền lệ** trong toàn tầng Việt. `satidovāri`
    là người giữ chánh niệm, người canh giữ bằng sự chú ý. Tôi dịch "người giữ chánh niệm" ở
    cả hai khoá, y hệt, và dùng lại đúng chuỗi ấy ở `:7.1` cho `ariyasāvako` cũng không có
    (tôi dịch "bậc Thánh đệ tử", theo mn9:3.2 và sn24.10:3.2 — 9 và 8 khoá).
  (2) `:3.1`–`:3.4` `vitakkūpasame` và `:2.2` `kāmarāgabyāpādavihiṁsāvitakkā` — 0 tiền lệ
    cho cả hai cụm. Tôi dịch theo nghĩa chữ: `vitakkūpasama` = "sự dừng dậy của tư tưởng";
    `kāmavitakka/byāpādavitakka/vihiṁsāvitakka` có tiền lệ ở dn17:2.2.3 ("tư duy dục", "tư duy
    sân hận", "tư duy làm hại"), nên `kāmarāgabyāpādavihiṁsāvitakkā` tôi dịch "tư tưởng về
    dục, về tham, về sân hận và hăm dọa" — năm món, món `rāga` tách riêng vì Pāli liệt kê
    `kāma` **và** `rāga` thành hai chữ.
  (3) `:3.3` `byanti kāhiti` — `byā` = "ta hứa", `kāhā` = lời hứa. Tôi dịch "đó là điều chúng
    ta đã hứa"; `:3.4` `checchati` = "ta tuyên thệ" ⇒ "đó là lời chúng ta đã tuyên thệ".
  (4) `:4.2` `anupavajjassa` — "không vấp lỗi". `pāpajāti` = phạm lỗi / vấp váp; tôi dịch
    "vấp lỗi" và không thêm "sơ suất" vào.
  (5) `:4.4` `aṅguttaranikāyavara` — như đã ghi ở trên: tôi **lược** `vara` theo đúng hai
    tiền lệ đã có. Nếu người biên tập muốn giữ `vara` thì phải sửa cả bài này và hai bài
    mil6.1.2/mil6.1.8 cùng lúc.
  (6) `:11.1`–`:11.4` — kệ `uddāna` liệt **tám** mục của phẩm (`Pathavī āpo ca tejo ca,
    vāyo ca pabbatena ca; Ākāso candasūriyo ca, sakko ca cakkavattināti`). Tôi dịch đủ cả tám,
    không lược; đây là lý do phần này ngắn: danh sách không lặp lại ở đâu khác trong bài.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `cakkavatti` → "vua Chuyển Luân" (xem mục trên, 5 + nhiều khoá);
  `aṅgāni gahetabbānī` → "chi phần cần phải nắm lấy" (mil7.4.1:1.1, mil7.4.8:1.1, mil7.4.9:1.1
  — 3 bài kề, cùng cách); `catūhi saṅgahavatthūhi` → "bốn phương thức hội tụ" (an8.24, 3 khoá);
  `vicinamāno` → "xét" (khoá 4.1); `kalyāṇapāpakāni` → "điều lành điều ác" (mil7.4.8:7.1);
  `kāyakammaṁ vacīkammaṁ manokammaṁ` → "thân nghiệp, khẩu nghiệp và ý nghiệp" (ne35:3.1 — cùng
  cụm Pāli); `paccavekkhitabbaṁ` → "soi xét" (mn15:7.7 "tự kiểm tra", an10.44:3.1 — 15 và 4
  khoá); `ariyasāvako` → "bậc Thánh đệ tử" (mn9:3.2 9 khoá, sn24.10:3.2 8 khoá);
  `suddhamattānaṁ pariharatī` → "giữ gìn mình cho hoàn toàn thanh tịnh" (`suddha` = "thanh
  tịnh", mil6.3.11; `visuddhamattānaṁ` = "đã được thanh lọc", mn40:8.1); `mahārāja` → "tâu đại
  vương"; `devātideva` → "bậc Thiên Nhân" (mil7.2.2:3.4).

