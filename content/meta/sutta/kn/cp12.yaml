notes: |-
      Nguồn: đúng uid cp12, Pāli root bilara đã ghim (`root/pli/ms/sutta/kn/cp/cp12_root-pli-ms.json`, đường dẫn lấy từ `pre` là `cp12:`); tầng Anh đã ghim là bản Bhikkhu Sujato cùng commit. Tầng Việt hiện hành không có cho bài này (snapshot upstream chỉ phân phối Pháp Cú) — đặc điểm của snapshot, không phải thiếu sót của repo.
      Coverage đo bằng đúng quy tắc trong source/layers.yaml: bài này có 0 segment đủ điều kiện "Pāli có nội dung" (mọi khoá đều dưới 40 ký tự sau khi chuẩn hóa khoảng trắng), nên không có gì để đo; theo `isSubstantive` và điều kiện `substantiveSegments > 0` trong `scripts/validate.ts` và `src/lib/canon/reference.ts`, quy tắc ngưỡng coverage KHÔNG áp dụng cho bài này, và vì vậy không cần entry trong content/meta/reference-gaps.yaml (1004 bài khác cũng ở nhóm "no substantive segment" theo chính file đó). 40/41 khoá vẫn có tiếng Anh ở bản đã ghim.
      Trùng nguyên văn: 3/41 khoá có Pāli trùng tuyệt đối với khoá đã dịch ở bài khác — 1.1 với cp13:1.1, 8.3 với cp13:6.3, 9.1 với cp18:7.1; dùng lại nguyên văn bản Việt. Trong chính lát không có cặp trùng nội bộ nào ở cp12.
      Tiền lệ đo được: khối `:0.1` của 17 tệp `cp*` trong tầng dùng «Hạnh Tạng» 14/17; riêng cp34:0.1 dùng «Cariyāpiṭaka», còn cp1 và cp35 có khoá đầu tiên không phải tiêu đề sách. Theo đa số trong chính bộ cp nên cp12:0.1 = «Hạnh Tạng»; GHI RÕ sự lệch này để người biên tập gộp — nếu chọn phương án kia thì cp34 cũng phải đổi theo, không để hai cách trong một bộ. `Hatthināgavagga` → «Phẩm Hatthināga» 3/3 (cp13:0.2, cp17:0.2, cp18:0.2). `Sīlapāramī 2` → «Trì Giới Ba-la-mật Thứ Hai» theo khuôn cp13:0.3 «Thứ Ba», cp17:0.3 «Thứ Bảy», cp18:0.3 «Thứ Tám». `Bhūridattacariya` → «Hạnh Của Long Vương Bhūridatta» theo cp13:0.4 «Hạnh Của Long Vương Campeyya» và cp17:0.4. `Punāparaṁ yadā homi` → «Lại nữa, vào thời thuở nọ,» 4/5 (chỉ cp34:1.1 dùng «Lại nữa, khi ta làm»). `sīlabbataṁ` → «giới hạnh và lễ nghi» (an3.78:1.2).
      Bất định đã ghi, không giấu:
        1) 3.3 `Caturo aṅge adhiṭṭhāya` — dịch sát chữ là «Ta quyết định với bốn chi thể», rồi 3.4 «rồi nằm xuống trên một đống mối». Có cách đọc theo chú giải Jātaka là «ăn chay bốu ngày»; bản Anh đã ghim dịch "I resolved on the four factors". Đây là nội dung chú giải, KHÔNG có trong root Pāli, nên không đưa vào lời kinh; giữ cách đọc sát chữ và ghi ở đây để người biên tập quyết. Đây là điểm làm giảm vietnamese_clarity vì người đọc hiện đại phải dừng lại ở câu này.
        2) 5.2 và 6.3 — Pāli viết thường `ālampāyano` ở 5.2 nhưng hoa `Ālampāyane` ở 6.3, và bản Anh đã ghim coi cả hai là tên riêng (Ālampāyana). Tầng này giữ tên riêng đúng dạng Pāli (cp13:1.2 «Campeyyaka», cp32:1.1 «Sutasoma»), nên ở đây giữ nguyên hai dạng: «Ālampāyano» và «Ālampāyane». Sự khác dạng ngữ pháp Pāli được giữ nguyên có chủ ý, không phải lỗi chính tả.
        3) 4.1–4.2 — `chavi` = da ngoài, `camma` = gân, `maṁsa` = thịt, `nahāru` = dây thần kinh, `aṭṭhi` = xương; bản Anh đã ghim dịch "outer skin and inner, flesh, sinews and bones". Bản nháp đầu dịch nhầm `camma` thành «ruột»; đã sửa thành «gân» và dịch `nahāru` thành «dây thần kinh» để phân biệt với `camma`.
        4) `yāpanamattakaṁ` (3.2) dịch «ăn đủ no và đủ sống» — `yāpanamatta` là thừa đủ để sống, không phải no đủ; Sujato dịch "eating enough to get by". Giữ cả hai vế để không bỏ mất ý thừa đủ.
        5) `akataññunā` (5.1) dịch «vô ơn» (nghĩa gốc: không biết ơn), Sujato dịch "the ingrate"; `vammikamuddha` dịch «đống mối» (`vammika` = mối, `muddha` = đống).
      Dấu lược: bài này Pāli KHÔNG có `…pe…`; bản Việt cũng không thêm dấu lược nào.
      Kiểm tra: `_hvi.py` bắt được 0 lỗi (41/41 khoá, NFC, ngoặc kép cân trên cả bài — 1.1 mở và 9.4 đóng, đúng như Pāli, không trùng nguyên văn Pāli ở khoá có nội dung, không lọt Pāli). Lượt review đối kháng bắt được một lỗi nghĩa thật ở bản nháp: 4.1 dịch `camma` thành «ruột» — đã sửa. Cả 41 khoá đã in ra đọc từng cặp.

