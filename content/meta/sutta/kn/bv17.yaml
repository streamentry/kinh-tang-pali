notes: |-
  Đợt 19, làn 72. Dịch từ Pāli root commit đã ghim, đủ 102/102 khoá (101 khoá mới; khoá kết `26.1` đã có sẵn từ lần trước, giữ nguyên nghĩa sau khi kiểm lại: `pannarasamo` = pañña 5 + rasa 10 = 15, khớp thứ tự phẩm, bv3 = thứ nhất; chỉ sửa chữ `Dhammadassi` thành `Dhammadassī`, xem mục tên riêng), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ mười lăm của Buddhavaṃsa, về Đức Phật Dhammadassī: thời kiếp và việc xua tan bóng tối, ba lần chứng ngộ và ba kỳ hội chúng, tiền thân là Sakka Purindada cúng dường và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn `bv28:0.1`, `bv29:0.1` (2/2 tiền lệ).
  - `0.2` “17. Dòng Kế Thừa Của Đức Phật Dhammadassī”: cùng cách với `0.1` và `26.1` (`vaṁso` → “Dòng Kế Thừa”), theo khuôn của phẩm anh em `bv18:0.2`. Phương án khác: “Phần Về Đức Phật Dhammadassī”.
  - `26.1` giữ “Dòng kế thừa của Đức Thế Tôn Dhammadassī là thứ mười lăm.”

  **Số Pāli, đã tự tính.** `koṭisatasahassa` = 100 × 1.000 koṭi = **một trăm ngàn koṭi** (2.3, 6.3; tiền lệ `mil5.1.3:11.6` “một trăm ngàn koṭi kiếp”; cùng chữ với `bv18:3.3`). `navutikoṭi` 90 koṭi (3.3). `asītikoṭi` 80 koṭi (4.3, 8.3). `satakoṭi` 100 koṭi (7.3). Ba lần chứng ngộ ở 2.3, 3.3, 4.3 = 100.000 / 90 / 80 koṭi, ba kỳ hội chúng ở 6.3, 7.3, 8.3 = 100.000 / 100 / 80 koṭi (Pāli chỉ nói số, không nói “vị” hay “người”; không thêm danh từ). `tayo` 3 (5.2: ba kỳ hội chúng, khớp ba khoá `6.4`, `7.4`, `8.4` = thứ nhất, hai, ba; 14.4: ba lâu đài, khớp ba tên ở 14.3). `aṭṭhārase kappasate` 18 × 100 = **1.800** “một ngàn tám trăm kiếp” (10.3; khớp `bv28:12.1`, nơi Dhammadassī nằm trong ba vị cách thời Gotama 1.800 kiếp). `dasapāramī` 10 ba-la-mật (12.4). `aṭṭhavassasahassa` 8 × 1.000 = **8.000 năm** (14.1). `ticattārīsasahassa` ti 3 + cattārīsa 40 = 43, × 1.000 = **43.000** (15.1; cấu tạo đơn vị trước chục sau, cùng kiểu `Ekatālīsito`=41, `Sattatālīsito`=47 ở bảng số đã xác lập; cùng chữ `Ticattārīsasahassāni` còn ở `bv11:20.1`, `bv12:21.1`, `bv21:26.1`, nhưng các khoá đó chưa có bản Việt nên chưa có tiền lệ trực tiếp. Nếu đọc `ti-` là ‘ba lần’ thì thành 120.000, không hợp với kiểu cấu tạo đã xác lập của số 41–47, nên không chọn). `caturo` 4 (16.1). `sattāha` 7 ngày (16.3). `asītihattha` 80 hattha (21.2). `dasasahassī` **10.000** (21.4; ngầm chỉ thế giới, như `dasasahassilokadhātu` ở `mn120:17.6`, `sn56.11:13.2`, `tha-ap33:14.2`). `vassasatasahassa` 100 × 1.000 = **100.000 năm** (23.3). `tīṇi yojana` 3 do-tuần (25.4). `pannarasamo` 15 (26.1). Số đôi ở các khoá tên: 18.1 (Paduma, Phussadeva), 19.1 (Khemā, Saccanāmā), 20.1 (Subhadda, Kaṭissaha), 20.3 (Sāḷiyā, Kaḷiyā), mỗi cặp đủ hai tên khớp “các … thượng thủ / hàng đầu” ở khoá sau. Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã publish và draft (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 7 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 910 cặp, trong đó 52 cặp có Việt khác bản tôi viết; 2 khoá dùng đúng nguyên văn một tiền lệ. Gồm `0.1` (2 cặp, 0 khác), `9.1` (2, 2), `10.3` (19, 19), `11.1` (1, 0), `11.2` (879, 27; dạng `…` của `…pe…` là 852/879), `12.2` (2, 2, chỉ khác dấu cuối), `15.2` (5, 2). Dò thêm riêng với phẩm anh em `bv18` (bản Việt cùng đợt): 37 cặp Pāli trùng, 34 cặp giống hệt, 3 cặp khác chỉ ở dấu phẩy cuối khoá (`9.1`, `19.3`, `25.3`; ở đây giữ dấu cuối theo Pāli từng khoá).
  - `0.1` dùng lại nguyên văn (2/2). `11.1` “Sau khi nỗ lực tinh tấn,” dùng lại nguyên văn `tha-ap22:15.3` (1/1). `11.2` `…pe…` → đúng một `…` (dạng đa số 852/879).
  - `9.1` “Vào lúc ấy, ta,”: 2 tiền lệ chia đôi (“tôi” ở `tha-ap341:2.1`, “ta” ở `tha-ap429:2.1`, “Vào thời ấy”); chọn “ta” vì người kể là Đức Phật Gotama, cùng ngôi với `bv18:8.1`, `bv28`, `cp`.
  - `10.3` **cố ý khác** 19/19 tiền lệ. Tiền lệ đều là người kể nhìn ngược về quá khứ (“Vào một ngàn tám trăm kiếp trước,” 12 khoá, “Từ một ngàn tám trăm kiếp trước,” 3, “Vào một ngàn tám trăm đại kiếp trước,” 2, “Trong một ngàn tám trăm kiếp,” 1). Ở `10.3`–`10.4` là lời thọ ký tương lai (`bhavissati`), nên hướng đếm ngược lại: một ngàn tám trăm kiếp **sau** thời Dhammadassī là thời Gotama, khớp `bv28:12.1`. Viết “Sau một ngàn tám trăm kiếp nữa,”, cùng cách `bv18:10.3`. Pāli ở `10.3` không có chữ chỉ hướng, hướng lấy từ động từ ở `10.4`.
  - `12.2` “ta càng làm cho tâm tịnh tín bội phần;” khớp 2/2 tiền lệ, chỉ đổi dấu cuối theo Pāli từng khoá. `15.2` “người nữ được trang sức đẹp đẽ;” là dạng đa số (3/5).
  - Trùng trong chính bài: 5 nhóm Pāli trùng (`2.1`/`23.1`, `3.1`/`6.1`, `4.3`/`8.3`, `7.1`/`8.1`, `13.4`/`18.4`, mỗi nhóm 2 khoá); bản Việt trong từng nhóm giống hệt nhau ⇒ 0 cặp lệch. `2.1`/`23.1` cùng là sở hữu cách “của vị ấy” nên dùng chung “Với cả vị ấy, bậc có uy lực không thể cân lường,” (đúng nguyên văn `bv18:3.1`).
  - Khoá dùng lại đúng nguyên văn bản Việt của `bv18` (33 khoá, ứng với 34 cặp giống hệt vì `3.3` trùng cả `bv18:4.3` lẫn `bv18:5.3`): `0.1`, `2.1`, `2.3`, `2.4`, `3.3`, `3.4`, `4.4`, `5.3`, `5.4`, `10.4`, `11.1`, `11.2`, `11.3`, `12.1`–`12.4`, `14.2`, `14.4`, `15.2`, `16.1`, `17.1`, `17.3`, `17.4`, `18.2`, `19.2`, `20.2`, `20.4`, `21.1`, `23.1`, `23.3`, `23.4`, `24.4`.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá, đếm số khoá).
  - `isi` → “ẩn sĩ” (trong kn: 17 trên 34 khoá chứa `isi`; “đạo sĩ” 3), cùng `mahesi` → “Đại Ẩn Sĩ” của `bv18`. `devadeva` → “Thiên Trung Thiên” (trong kn: 10 trên 20 khoá). `narāsabha` → “Nhân Ngưu” (32 trên 58 khoá trong kn; “Ngưu Vương” 4, “Hùng Nhân” 4). `purisuttama` → “tối thượng giữa loài người” (trong kn: 14 trên 15 khoá có “tối thượng”, 7 khoá đúng cụm “tối thượng giữa loài người”; `dn32:4.28` cùng cụm); `naruttama` → “tối thượng trong loài người” như `bv18:17.4` (khác `purisuttama` ở 16.4 chỉ bằng chữ “giữa/trong”, hai chữ Pāli khác nhau). `mahāvīra` → “Đại Anh Hùng” (như `bv18`), `mahāyasa` → “có danh tiếng lớn” (16 trên 28 khoá; “đại danh” 6; `bv28:6.2`). `satthā` → “Đạo Sư” (`bv28:3.2`). `vināyaka` → “bậc Hướng Dẫn” (khoá kn có `vināyaka`/`nāyaka` chỉ một khoá dịch, `mn85` “hướng dẫn”); đặt cách `nāyaka` → “Dẫn Đạo” (`bv28`) ra để giữ hai chữ Pāli hai chữ Việt.
  - `vineti` → “điều phục” (6 trên 19 khoá; “huấn luyện” 10, nhưng đó là việc huấn luyện đệ tử dần dần; `mn107` dùng “điều phục” cho `tathāgato purisadammaṁ … vineti`); `vinesi sañjayaṁ isiṁ` là một lần độ một người, nên chọn “điều phục”.
  - `byākāsi` → “thọ ký” (**0** khoá “thọ ký” trong toàn tầng Việt; “trả lời” 32 trên 60 khoá chứa `byākar-` trong kn, “tuyên bố” 4). Chọn “thọ ký” vì ngữ cảnh là lời tiên báo về tương lai (`bhavissati`, `10.4`) và đây là thuật ngữ quen thuộc của truyền thống Việt; đây là chỗ yếu nhất về thuật ngữ của bài. Cùng dòng `Sopi maṁ buddho byākāsi,` có ở 17 phẩm Buddhavaṃsa trong snapshot (bv4–bv8, bv12–bv17, bv19–bv22, bv24, bv25) nên các phẩm kia nên thống nhất một cách.
  - `abhisamaya` → “chứng ngộ” (như `bv18`). `sannipāta` → “kỳ hội chúng”, `samāgama` → “cuộc tụ hội” (như `bv18:6.1`, `bv18:7.4`; `dn14:1.10.1` cùng cụm `tayo sāvakānaṁ sannipātā`). `khīṇāsava`, `vimala`, `santacitta`, `tādī`, `cakkhumā`, `aggasāvaka`, `upaṭṭhāka`, `koṭi`, `yojana`, `pāramī`, `pasāda`: dùng cách đã chốt ở `bv18` và `bv28` (số đếm chi tiết ở ghi chú của `bv18`).
  - `sapariso` → “cùng tùy tùng” (18 khoá chứa `sapariso`/`saparisā` trong tầng: “hội chúng” 9, “tùy tùng” 7, “quyến thuộc” 2; “tùy tùng” là cách dịch khi đi cùng vua hay người có địa vị: `dn3:2.22.4`, `dn4:6.30`–`6.32`, `dn5:7.30`–`7.32`; “hội chúng” ở `mn92:24.1`, `mn92:27.1` là đoàn học trò của Sela và ở các khoá `-parisā`; Sakka cùng quyến thuộc chư thiên thuộc nhóm trước). `vassaṁ upāgami` → “vào an cư mùa mưa” (`dn16:2.22.3`, `dn16:2.22.5` cho `vassaṁ upagacchi`). `dhuta` → “đầu-đà” (5 khoá “đầu-đà”, 3 khoá “đầu đà” trên 15 khoá chứa `dhuta`, ví dụ `an1.191:1.1`, `sn14.15:2.10`). `guṇa` → “đức hạnh” (42 khoá chứa `guṇa`: “công đức” 13, “đức hạnh” 5, “đức tính” 5, “phẩm chất” 2; chọn “đức hạnh” cho nghĩa phẩm chất hành trì, như `dn30:1.18.13` “các đức hạnh”). `pakāsesi` → “chỉ rõ” (`dn14:3.13.3`, `dn14:3.17.3`).
  - `gandhamāla` → “hương và vòng hoa” (kn: “vòng hoa” 6 trên 10 khoá, “hương” 3; `dn16:6.13.2` “hương hoa”). `tūriya` → “nhạc khí” (`dn16:5.2.5`, `mn37:7.1`; “nhạc” 6 trên 13 khoá). `abhipūjayiṁ` → “cúng dường”. `purindada` → “Purindada” (`dn20:14.10`, `mn56:29.37`, `sn11.12:2.1`: giữ nguyên).
  - `nimitta` → “dấu hiệu”, `pāsāda` → “lâu đài”, `khattiya` → “Sát-đế-lợi”, `nagara` → “thành phố”, `janikā` → “người mẹ sinh ra”, `atrajo` → “người con ruột”, `samalaṅkata` → “được trang sức đẹp đẽ”, `thūpavara` → “bảo tháp tối thượng”: cùng `bv18`. `brahmā` → “Phạm thiên”. `yācito` → “thỉnh cầu”. `migadāya` → “vườn nai” (50 trên 79 khoá chứa `migadāy-`; “Lộc Uyển” 8, chỉ ở `mn141` cho Isipatana).
  - `atirocati` → “chiếu sáng vượt trội” (30 khoá chứa `atirocati`/`atirocanti`: “vượt trội” 16 như `dn18:17.3`, “lấn lướt” 3 như `sn11.14:2.4`, “rực rỡ” 2, không khoá nào chỉ “chiếu sáng”; ghép hai nghĩa của `ati-` + `rocati`). `vidhamitvā` → “xua tan” (`mil7.4.3:5.1`). `obhāsa` → “ánh sáng” (16 khoá; “hào quang” 23: chọn “ánh sáng” cùng `bv18:23.1`). `upāgañchi`/`upāgamuṁ` → “đến” (41 khoá).
  - `sāsana` → “lời dạy” (723 trên 768 khoá trong kn; “giáo pháp” 31, “giáo huấn” 4): chọn dạng đa số. `sālarāja` → “cây sāla chúa” (`dn14:3.29.1`, 1/1). `vijjū` → “tia chớp” (6 khoá; “chớp” 14, “sét” 8 trên 29). `majjhanhika` → “giữa trưa” (4 khoá; “trưa” 22 trên 28). `gagana` → “bầu trời” (3 trên 5). `thūpa` → “bảo tháp” (22 khoá; tính cả “tháp” nói chung thì 62 trên 228 khoá chứa `thūpa`).
  - Tên riêng: `Dhammadassī` giữ dấu theo Pāli và `bv28:12.4` (1 tệp trong tầng; chữ cũ ở `26.1` là `Dhammadassi` không dấu từ lần trước, nay đã sửa cho cả bài thống nhất, ghi là terminology fix). `Sakka` (dn20:14.10 …), `Purindada` đã có tiền lệ. `Saraṇa` (vừa là thành vừa là vua: Pāli `Saraṇaṁ nāma nagaraṁ, saraṇo nāma khattiyo` dùng cùng một tên), `Sunandā`, `Vicikoḷi`, `Puññavaḍḍhana`, `Araja`, `Viraja`, `Sudassana`, `Sañjaya`, `Paduma` (`bv28:7.1`), `Phussadeva`, `Sunetta`, `Khemā`, `Saccanāmā`, `Bimbijāla`, `Subhadda`, `Kaṭissaha`, `Sāḷiyā`, `Kaḷiyā`, `Sālārāma`, `Maṇḍa`: chưa có tiền lệ Việt trong tầng cho dạng này, giữ dạng Pāli có dấu (bỏ đuôi `-o` của danh cách như `bv28`).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `1.1` `maṇḍakappamhi`: tôi đọc `maṇḍa` là tên kiếp “kiếp Maṇḍa” (0 tiền lệ). Cách đọc khác: `maṇḍakappa` là loại kiếp (một trong các loại kiếp theo số Đức Phật xuất hiện), tức “kiếp maṇḍa”. Pāli chỉ nói `maṇḍakappa`, không có chữ nói đó là loại hay tên, nên giữ chữ Pāli và không giải thích. `tattheva` dịch “ngay trong … ấy” theo nghĩa `tatra` + `eva`.
  2. `6.3` `Tadā koṭisatasahassānaṁ`: Pāli đã ghim ở 2.3 và 6.3 cùng một số (một trăm ngàn koṭi). Bản nguyên bài (tầng tra cứu toàn văn, chỉ dùng để hiểu mạch, không cấp text) ở chỗ tương ứng của `6.3` ghi “một ngàn koṭi” (có vẻ theo một dị bản `koṭisahassa`). Pāli thắng; không đổi số, chỉ báo.
  3. `3.2` `vinesi sañjayaṁ isiṁ`: `vineti` dịch “điều phục” theo `mn107`; cách đọc khác: “hướng dẫn” (bản Indacanda), “dẫn dắt”. Pāli chỉ nói `Sañjaya` là một vị `isi`, không nói đây là sự độ cho xuất gia hay lời giáo huấn, nên không thêm.
  4. `4.1`–`4.2` `Yadā sakko upāgañchi, sapariso vināyakaṁ`: `sapariso` là danh cách số ít, bổ nghĩa cho `sakko` (Sakka cùng tùy tùng), không phải cho `vināyakaṁ`. Tiếng Việt khó giữ được thứ tự này trong hai khoá, nên dịch “Khi Sakka tiến đến, / cùng tùy tùng, bên bậc Hướng Dẫn;”.
  5. `5.1` `Tassāpi devadevassa`: `tassāpi` đứng cùng danh từ sở hữu `devadevassa`, nên dịch “Cũng nơi vị ấy, bậc Thiên Trung Thiên”. Pāli không nói “Thiên Trung Thiên” là ai ngoài Đức Phật Dhammadassī.
  6. `7.2` `devato eti mānusaṁ`: Pāli không có chữ `loka` cho cả `devato` lẫn `mānusaṁ`; thêm “cõi” theo cách nói thuận tiếng Việt, hiểu là “từ nơi chư thiên đến nơi loài người”, không thêm sự kiện cụ thể nào (Pāli không nêu tên cõi trời hay thời điểm).
  7. `8.2` `pakāsesi dhute guṇe`: Pāli chỉ nói “các đức hạnh đầu-đà”, không nói bao nhiêu pháp hay tên pháp nào; không thêm.
  8. `10.1`–`10.2` `byākāsi … devamajjhe nisīdiya`: “thọ ký” là chữ chọn (0 tiền lệ trong tầng, xem mục thuật ngữ). Chủ ngữ của `nisīdiya` là vị Phật; “ngồi giữa chư thiên” dịch sát chữ, không nói là Phật hay chư thiên ngồi.
  9. `10.3` nháy đơn mở ở `10.3` (không ở `10.1` như `bv18`) và đóng ở `11.3`. Nháy kép mở ở `1.1`, đóng ở `25.4` (chữ `ti` ở `Tīṇiyojanamuggato”ti`), nên cả bài là một lời kể.
  10. `11.2`–`11.3` `…pe… hessāma sammukhā imaṁ’`: đoạn lược che phần giữa lời thọ ký, nên không xác định được “chúng ta” là ai. Giữ đúng một `…`, giữ nháy theo Pāli từng khoá, dịch sát chữ, không thêm người nói. `sammukhā` dịch “ở trước mặt” (cùng `bv18:11.3`).
  11. `13.2` `saraṇo nāma khattiyo`: không thêm “cha” (Pāli không gọi là cha). `15.3` `Vicikoḷi nāma nārī`: Pāli không có `sā`, nên dịch “Người nữ tên là” không có “ấy” và không thêm “vợ” hay “chính thất”. `15.4` `atrajo puññavaḍḍhano`: “người con ruột là Puññavaḍḍhana” (Pāli không có `nāma`), không thêm “trai”.
  12. `16.2` `pāsādenābhinikkhami`: dịch sát “đã ra đi bằng lâu đài”. Truyền thống chú giải hiểu là lâu đài tự bay lên đưa Ngài đi, nhưng lời kinh không nói; không thêm. Cách đọc khác: “từ lâu đài” (nếu coi `-ena` là cách xuất xứ).
  13. `16.3` `padhānacāra`: dịch “hạnh nỗ lực tinh tấn” (`padhāna` → “nỗ lực tinh tấn” như `bv18:11.1`; không có khoá nào dịch riêng `padhānacāra`).
  14. `19.1` `Khemā ca saccanāmā ca`: tôi đọc `Saccanāmā` là tên riêng. Cách đọc khác: “Khemā và vị tên là Saccā”, tức `sacca` + `nāmā`. Bản nguyên bài cũng viết thành một tên.
  15. `20.1`–`20.4` `aggupaṭṭhaka/-ikā`: truyền thống chú giải hiểu là các thí chủ hộ độ hàng đầu (nam và nữ), khác `upaṭṭhāko` ở `18.3`. Pāli không nói tại gia hay xuất gia nên dịch “thị giả” cho cả hai (cùng `bv18`). Tên nữ `Sāḷiyā`, `Kaḷiyā`: bản nguyên bài viết “Sāliyā, Valiyā”; Pāli ghim thắng.
  16. `21.1`–`21.2` `asamasamo`, `asītihatthamuggato`: `asamasama` “ngang bằng với bậc vô song” (cùng `bv18:22.1`). `hattha` là đơn vị đo chiều cao; tôi giữ nguyên chữ Pāli “hattha” và không quy đổi (như `ratana` ở `bv18`); bản nguyên bài quy đổi sang cánh tay và mét, đó là bổ sung. Đây là chỗ không có tiền lệ Việt trong tầng cho đơn vị này.
  17. `21.4` `dasasahassimhi dhātuyā`: đọc `dhātuyā` là `lokadhātuyā` rút gọn (“thế giới”, `dasasahassī lokadhātu`); Pāli chỉ nói `dhātu`. Cách đọc khác: “trong cõi giới mười ngàn”.
  18. `22.1` `suphullo sālarājāva`: “cây sāla chúa” theo `dn14:3.29.1` (`sālarājamūle`). Cách đọc khác: “vua của các cây sāla”.
  19. `22.4` `upasobhatha`: dịch “rạng ngời”; không có tiền lệ cho `upasobhati` trong tầng.
  20. `23.2` `samakaṁ āsi jīvitaṁ`: `samaka` dịch “ngang bằng” (`thag6.9:2.1` “ngang bằng mình”; `mil3.7.5` “đồng thời như nhau”). Pāli không nói ngang bằng với cái gì; chú giải hiểu là ngang với tuổi thọ con người thời ấy, lời kinh không nói nên không thêm. Cách đọc khác: “mạng sống cũng đồng thời”.
  21. `24.2` `vimalaṁ katvāna sāsanaṁ`: “làm cho lời dạy không cấu uế”. Cách đọc khác: “làm cho giáo pháp trong sạch”.
  22. `24.3` `Cavi candova gagane`: `cavi` (aorist của `cavati`) dịch “khuất bóng”, vừa chỉ sự ra đi của Đức Phật vừa hợp với hình ảnh mặt trăng; tầng dịch `cavati` thường “chết đi” (`dn24`), không hợp cho một Đức Phật và cho hình ảnh mặt trăng. Cách đọc khác: “đã lìa đời như mặt trăng lặn trên bầu trời”.
  23. `25.2` `Sālārāmamhi`: giữ nguyên là danh từ riêng “Sālārāma”, `ārāma` là “vườn / tu viện”, không tách (như `bv18:24.2` `Anomārāma`). Bản nguyên bài ghi một tên khác (tu viện Kesa); Pāli ghim thắng.
  24. `26.1` đã có từ trước và giữ; ngoài việc sửa chữ `Dhammadassī`, không đổi gì.
  25. Các chỗ không đối chiếu được: không có Sujato, không có `english-project`, không có `vietnamese-current` segment cho `bv`; nên các điểm 1, 3, 4, 8, 16, 17, 20, 22 chỉ có Pāli root và tiền lệ nội bộ làm căn cứ.

