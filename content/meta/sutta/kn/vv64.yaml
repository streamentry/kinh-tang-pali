notes: |-
  Dịch trực tiếp từ Pāli root cho đủ 145 khoá; không có bản Anh Sujato, bản Anh của dự án hay bản Việt hiện hành để đối chiếu, nên không tuyên bố đã đối chiếu English. Tiền lệ lấy từ các bài đã dịch cùng nhóm Vimānavatthu (vv5, vv30, vv32, vv36, vv48, vv60–62, vv65, vv78) và các tầng khác.
  Số Pāli (tự tính): Sahassayutta = 1.000 (1.1); Sahassaraṁsiko = ngàn tia sáng (5.2); sata = 100 (4.3 satarāji, 27.4 satapuññalakkhaṇa); pannarase cando = trăng ngày thứ mười lăm, dịch là trăng ngày rằm (2.4); pañcaṅgika = năm phần (5.4, 9.4); dasa disā = mười phương (17.3); tividhaṁ = ba phương diện (31.2); catukkamā = bốn chân (8.1); cuddasamaṁ = thứ mười bốn (34.1); pañcamo = thứ năm (34.2); tatiyaṁ = thứ ba (37.1); uddāna 36.3–36.4: dve = hai, tayo = ba, dve = hai. Không có cụm số chưa phân xử được.
  Pāli trùng nguyên văn với tầng đã dịch: 15 khoá (5.3, 5.4, 9.3, 9.4, 23.1, 23.2, 25.1–25.3, 26.1–26.3, 29.2, 32.1, 35.1). Dùng lại nguyên văn bản Việt có sẵn ở 11 khoá (5.4, 9.4 theo vv36:4.4; 25.1–25.3 theo vv78:8.1–8.3; 26.1–26.3 theo dạng đa số của tầng; 29.2 theo ja398:4.2; 32.1 theo vv32:7.3; 35.1 theo 86 nơi dịch là Tóm lược:). Khác có chủ ý ở 4 khoá: 5.3 và 9.3, vì vv36:4.3 dịch vaggurūpo là như tiếng trống, không có căn cứ trong Pāli (vaggu = êm ái, vv56:2.2 và vv72:2.1 dịch êm dịu, ngọt ngào); 23.1 và 23.2, vì các bản có sẵn (vv48, vv30, pv40) nói với nữ thiên bằng ngươi hoặc có vế khác, còn ở đây Tôn giả Moggallāna nói với một thiên tử bằng ngài, cùng cách xưng với vv78. Trong chính bài có 6 nhóm Pāli trùng nhau (5.3 và 9.3; 5.4 và 9.4; 7.4 và 8.2; 20.1 và 22.3; 12.4, 13.4, 14.4, 15.4, 16.4; 14.3, 15.3, 16.3), bản Việt khác nhau ở 0 nhóm; 20.2 và 22.4 chỉ khác dấu câu như Pāli.
  Thuật ngữ và tên gọi theo tầng: Purisavimāna = Chuyện Cung Điện Nam Hư Không (21 khoá, so với 5 khoá Thiên Cung Của Nam Giới); Mahārathavagga = Phẩm Cỗ Xe Lớn (8, so với 2 để nguyên Pāli); Bhāṇavāraṁ = Phần tụng đọc thứ ba, theo cách dịch ở hơn mười khoá khác của kn (Phần tụng đọc) và ở dn (Phần tụng); đây khác 3 khoá vv dịch Chuyên luận, vì bhāṇavāra là đơn vị tụng đọc, không phải luận; devātideva = Thiên Trung Thiên (36 chỗ); oghatiṇṇa = vượt qua dòng lũ (48 chỗ dòng lũ so với 11 chỗ bộc lưu); padumuppala = sen đỏ và sen xanh (4 trên 4); devinda hô cách = hỡi Thiên Chủ (3 khoá vv37); accharā = tiên nữ (vv11, thi-ap10); uposatha = ngày trai giới (41 chỗ trai giới trong kn).
  Bất định, không đưa vào thân kinh: (1) rathakubbara (2.1) dịch là càng xe; SN 4.10 của Sujato dịch Nemīva rathakubbaraṁ là vành bánh quanh trục, nên nghĩa kubbara có thể là trục bánh hoặc càng xe. (2) phalehi aṁsehi (2.2) dịch sát chữ là các thanh và các vai xe; không xác định được đúng bộ phận kỹ thuật. (3) sujātagumbā naravīraniṭṭhitā (2.3) dịch sát chữ, chưa xác định gumba chỉ vật gì. (4) pādantaramajjhabhūsitā (4.2) và nābhi (4.1, 4.3) dịch là khoảng giữa các bánh và trục bánh. (5) sateratā (4.4) hiểu là tia chớp, khớp cách vv35:3.1 đã dịch. (6) sirasmiṁ cittaṁ (6.1) dịch là vật nhiều màu ở đỉnh, chủ thể không rõ; maṇicandakappita (6.1, 7.1) dịch là vầng trăng ngọc ma-ni. (7) ārohakambū và brahūpamā (7.2) dịch thận trọng là vóc cao, dáng đẹp, hùng vĩ; nghĩa riêng của kambu (vỏ ốc, vàng hay giống ngựa Kamboja) và brahū- (to lớn hay như Phạm thiên) chưa phân xử được. (8) catukkamā (8.1) dịch sát là bước bằng bốn chân. (9) samitassa và vicitrasaṁvane (10.3, 10.4) dịch là hội chúng và khu rừng muôn màu. (10) āḷārapamhā (11.2) dịch là mi cong; pv28:5.3 trong tầng dịch thành hang rắn Āḷāra, không có cơ sở. (11) sadeva gandhabbasūraggapūjitā (11.4) có thể đọc sadeva là cùng chư thiên hoặc là luôn luôn; chọn cách thứ nhất. (12) kambukeyūra (13.1) dịch là vòng tay vỏ ốc. (13) missakesiyo (14.1) dịch là tóc đan xen; samaṁ vibhattāhi pabhassarāhi (14.2) không có danh từ rõ nên dịch trừu tượng. (14) cāmarahatthabāhubhi (3.4) và pokkharapattabāhubhi (19.4) đọc bāhu là cánh tay. (15) pavajjamānāsu atīva (20.3) chuyển atīva sang vế xoay lượn của 20.4. (16) vajirāvudha (22.2) dịch là vị cầm kim cương, không kèm giải thích. (17) 32.2 muni đọc là hô cách, hỏi bậc ẩn sĩ; cũng có thể đọc muni như người nhận cúng dường, cùng nghĩa với asaṅgamānase ở 32.4. (18) Kassapamaggapuggalaṁ (27.2) đọc là Kassapaṁ aggapuggalaṁ, không phải một nhân vật khác. (19) suvaṇṇasiṅgīnada (28.2) giữ nguyên siṅgīnada. (20) tividhaṁ visuddhaṁ (31.2) giữ ba phương diện, không nêu ba gì. (21) uddāna 36.3: Karaṇīya giữ nguyên Pāli.
  Kiểm chuẩn cho lần soát này: 145 trên 145 khoá khớp tập khoá và thứ tự Pāli; dấu nháy kép khớp Pāli từng khoá (1.1, 25.4, 27.1, 33.4); Pāli không có dấu lược nên Việt cũng không có; NFC; không khoá rỗng; không Pāli lọt sang thân Việt ngoài tên riêng.
  Coverage English: mẫu số 0 (không khoá Pāli nào đạt 40 ký tự), cổng coverage không đo được gì; tầng Sujato phủ 0 khoá, ba tầng tham khảo đều vắng.
  technical_integrity đặt 9.6 vì chưa chạy các cổng của kho trong lần soát này; cần chạy npm run validate, npm test, npm run check và npm run build trước khi chốt trạng thái.
