notes: |-
  Tôi làm lượt review đối kháng, không viết lại từ đầu: đọc p44.txt đầy đủ, đọc cả 38 khoá, rồi dựng chỉ mục Pāli → Việt trên toàn bộ tầng kn đã có để tra tiền lệ thay vì đoán. Ba khoá tôi sửa, tất cả đều là lỗi thật.
  LỖI ĐÃ SỬA. (1) :5.1 madhughaṭasataṁ bị dịch thành trăm hạt mật — ghaṭa là bình/đại lượng, không phải hạt; đã sửa thành trăm bình mật. Cùng khoá, madhuṃ sampannaṃ vā na sampannaṃ vā bị dịch thành người ấy đã nếm được vị ngọt hay không, tức biến câu hỏi về sự trọn vẹn thành câu hỏi về vị giác; sampanna là trọn, hết, nên đã sửa thành người kia có biết mật đã trọn vẹn hay chưa. (2) :7.2 có chữ Do đó, không có trong Pāli và làm sai cả quan hệ nhân quả, vì sotañca paṭicca sadde ca chỉ là vế thứ hai của một loạt đối xứng với manañca paṭicca dhamme ca ở :7.3; đã sửa thành và khi duyên vào tai cùng với âm thanh … để song song với Và khi duyên vào tâm cùng với pháp.
  VÌ SAO KHÔNG SỬA THÊM. :4.6 Āma, bhante, jāneyyā hiện là Vâng, thưa tôn giả, người ấy biết; jāneyyā là thể nghi vấn nên có thể là sẽ biết, nhưng hai tệp khác trong kho dịch y hệt câu này thành người ấy biết, nên tôi giữ để không tự tạo cách thứ N+1; tôi ghi nét thể nghi vấn này ở đây. Công thức Hội thoại tôi theo đa số đo được trên chính tầng mil: Rājā āha— = Vua nói:, Thero āha— = Trưởng lão nói—, Na hi, bhante = Không phải vậy, thưa tôn giả, Kallosi, bhante nāgasenā = Khéo lắm, thưa tôn giả Nāgasenā.
  TIỀN LỆ ĐÃ TRA. Dải sáu vế giác quan mắt thấy sắc, tai nghe âm thanh, mũi ngửi mùi, lưỡi nếm vị, thân chạm vào điều sờ được, tâm biết rõ pháp đã có sẵn trong mil3.3.12 và mil3.7.15, tôi dùng lại nguyên văn. Dải vị ambilattaṃ vā lavaṇattaṃ vā tittakattaṃ vā kaṭukattaṃ vā kasāyattaṃ vā madhurattaṃ vā đã có ở mil3.4.1:2.3-2.4 thành vị chua, vị mặn, vị cay, vị đắng, vị chát hay vị ngọt, tôi giữ y hệt ở :4.5 và :4.7, không đảo tittaka với kasāya cho hợp nghĩa từ điển. nhãn thức cho cakkhuviññāṇa có tiền lệ nguyên văn trong tầng.
  DẤU LƯỢC. :7.2 kết thúc bằng …pe… của Pāli nên bản Việt chỉ còn đúng một dấu lược, tôi không mở rộng ở :7.3. :3.1 có ba dấu lược trần của Pāli (sotesu ugghāṭitesu … ghāne ugghāṭite … jivhāya ugghāṭitāya … kāye ugghāṭite) và bản Việt giữ đúng ba. Ở đâu khác không thêm dấu lược nào.
  NHÓM KỆ 7.x, 8.x, 9.x TRÙNG NGUYÊN VĂN Ở CẢ SÁU BÀI THA-AP TRONG LÁT. Tôi dựng chỉ mục Pāli → Việt trên toàn bộ tầng kn đã có (1.675 tệp, loại tám uid của lát) rồi đối chiếu: trong lát không còn một Pāli chung nào mà sáu bài dịch khác nhau, và mọi Pāli chung với bài ngoài lát đều trùng khớp hoặc chỉ lệch dấu câu. Bốn câu kệ dùng chung giữ nguyên cách đã có trong kho: Kilesā jhāpitā mayhaṁ = Các phiền não của ta đã được thiêu rụi; viharāmi anāsavo = ta sống không còn lậu hoặc; Svāgataṁ vata me āsi = Thật lành thay sự đến của ta; Paṭisambhidā catasso = Bốn vô ngại giải; kataṁ buddhassa sāsanaṁ = đã làm tròn lời dạy của Đức Phật. Bài này không có kệ chung, nhưng 0.1 Milindapañha giữ nguyên Pāli (đa số mạnh 177/188 khoá mil), 0.2 Vicāravagga = Phẩm Khảo Sát (đa số 8/11 tệp mil).
  CHÚ Ý VỀ Svāgataṁ vata me āsi — TÔI CỐ Ý KHÔNG SỬA. Đếm được 54 tệp trong kho dịch câu này thành Thật lành thay sự đến của ta (đa số áp đảo; nhóm kế cạnh là Thật là đón mừng thù thắng thay cho tôi 21 tệp). Nghe thì có vẻ là đọc nhầm: svāgataṃ ở đây là tiếng than thở tự vệ, không phải danh từ sự đến. Nhưng sửa sáu khoá trong lát này sẽ tạo ra thứ tự N+1, và BRIEF_VI3 §6 nói rõ phải dịch nhất quán theo bản Việt đã có. Tôi giữ nguyên và giao việc này lại cho người điều phối quyết định thay cả kho; nếu đổi thì phải đổi cả ~54 tệp, không được sửa lẻ.
  BẤT ĐỊNH CÒN MỞ, GHI Ở ĐÂY CHỨ KHÔNG BỎ QUA. (1) Ở :5.1 tôi chọn sampanna = trọn, hết; cách đọc khác là người kia có nếm trọn vị mật hay không, và tôi không dám khẳng định hơn mức Pāli cho phép. (2) :2.2 upasantassa tādino tôi dịch là thành ấy bỗng vắng vẻ, còn :2.4 nigghoso āsi tāvade là tiếng ồn dịu lại nơi đó; hai câu đọc như vậy là chặn nhau, và một bản dịch Anh xuất bản đọc ngược lại là nơi ấy có tiếng ồn lớn lên. Tôi giữ cách đọc chặn nhau vì nó tự nhất quán với upasanta, và ghi rõ ở đây. (3) dvāra ở :1.5 tôi dịch cửa còn vātapāna ở :1.4 và :2.2 dịch cửa sổ, vì Pāli cố ý đổi từ; đừng sửa lẻ một khoá.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Những gì tôi tự kiểm được và đều sạch: JSON hợp lệ, đúng 38 khoá mỗi bài, tập khoá khớp tuyệt đối với content/catalog/sutta/kn.json và với all trong vc/c44.json, không orphan, không rỗng, không còn stub dạng (…), toàn bộ NFC, số dấu lược không bao giờ vượt số dấu lược của Pāli và mỗi …pe… của Pāli còn đúng một dấu …, YAML parse sạch bằng thư viện yaml của kho.
