notes: |-
  ĐỌC HẾT p44.txt (928 dòng) trước khi viết. Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Milindapañha. Toàn bộ 38 khoá dịch từ Pāli root.
  BÀI NÀY TRÙNG VỚI BÀI ĐÃ CÓ, VÀ TÔI DÙNG LẠI NGUYÊN VĂN. mil3.5.6 trong chính tầng này là bản stub 9 khoá của cùng câu hỏi Vedagūpañha (Pāli :0.3, :1.2 và :3.1 của nó trùng nguyên văn với :0.3, :1.2 và :9.1 của tôi). Tôi đối chiếu từng cặp và dùng lại nguyên văn bản Việt đã có: 6. Câu hỏi về việc thông đạt Veda. · Thưa tôn giả Nāgasena, có bậc thông đạt Veda hay không? · Câu hỏi về việc thông đạt Veda, thứ sáu.
  DÃY BÀI CỦA mil3.3.12 VÀ mil3.7.15 CHO TIỀN LỆ TỪNG CÂU, ĐẾM ĐƯỢC. Công thức năm giác quan cakkhunā rūpaṁ passati … sotena saddaṁ suṇāti … ghānena gandhaṁ ghāyati … jivhāya rasaṁ sāyati … kāyena phoṭṭhabbaṁ phusati, manasā dhammaṁ vijānāti đã có hai tệp dịch (mil3.3.12:2.3-2.7 và mil3.7.15:1.4): mắt thấy sắc, tai nghe âm thanh, mũi ngửi mùi, lưỡi nếm vị, thân chạm vào điều sờ được, tâm biết rõ pháp. Tôi dùng lại đúng sáu vế đó cho 1.4 và 2.2. Cũng từ mil3.7.15:1.6 lấy cách dịch mahantena ākāsena bahimukha suṭṭhutaraṁ: khoảng không rộng lớn, quay mặt ra phía ngoài, rõ hơn. abbhantare jīvo: linh hồn trong quá khứ (cùng cách với bhūtasmiṁ jīvo: linh hồn trong chúng sinh ở mil3.7.15).
  SÁU VỊ PHẢI GIỮ NGUYÊN ÁN XỔ CỦA BÀN ĐÃ CÓ. Dải ambilattaṁ vā lavaṇattaṁ vā tittakattaṁ vā kaṭukattaṁ vā kasāyattaṁ vā madhurattaṁ vā trùng nguyên văn với mil3.4.1:2.3-2.4, đã dịch là vị chua, vị mặn, vị cay, vị đắng, vị chát hay vị ngọt. Tôi dùng lại y hệt cho 4.5 và 4.7, không tự đảo thứ tự tittaka và kasāya cho hợp với nghĩa từ điển.
  CÔNG THỨC HộI THOẠI ĐO ĐƯỢC TRÊN TẦNG mil. Rājā āha— = Vua nói: (43/43 tệp) · Thero āha— = Trưởng lão nói— (10/17 tệp, mil3.5.6 cũng dùng gạch nối) · Na hi, bhante = Không phải vậy, thưa tôn giả (14/24 khoá) · Kallosi, bhante nāgasenā = Khéo lắm, thưa tôn giả Nāgasenā (64/73 tệp) · mahārāja = này Đại vương (401 khoá / 104 tệp) · bhante = thưa tôn giả (32 khoá / 25 tệp). Tôi theo đa số của TỪNG công thức, nên 1.1 dùng hai chấm còn 2.1 dùng gạch nối; đó là số đông đo được, đánh đổi lấy tính nhất quán nội bộ của từng bài.
  PHẨM VÀ TIÊU ĐỀ. Vicāravagga = Phẩm Khảo Sát (8/11 tệp mil; bốn bài anh em cùng phẩm mil3.3.1, :3, :4, :9 đều dùng đúng cách này). 0.1 Milindapañha giữ nguyên Pāli: tôi đếm 177/188 khoá mil giữ Pāli, chỉ 8 dùng Mi-lan-đà Vấn Đạo và 3 dùng Mi-tiên Vấn Đáp.
  BẤT ĐỊNH ĐÃ GHI NHẬN. (1) dvāra ở 1.5 tôi dịch cửa, còn vātapāna ở 1.4 và 2.2 dịch cửa sổ, vì Pāli cố ý đổi từ; nếu biên tập muốn thống nhất thì đổi cả cụm, đừng sửa lẻ. (2) puratthima, pacchima, uttara, dakkhiṇa ở 1.4 và 2.2 tôi dịch là phía trước, phía sau, phía trên, phía dưới, vì đây là cửa sổ của cung điện; cùng bốn từ ấy ở mil3.3.12:2.2 lại là hướng đông nam tây bắc của thành, tôi theo ngữ cảnh từng nơi và ghi ở đây. (3) mil3.3.6:3.1 có ba dấu lược trần của Pāli (sotesu ugghāṭitesu … ghāne ugghāṭite … jivhāya ugghāṭitāya … kāye ugghāṭite); tôi giữ đúng ba, không thêm và cũng không bớt.
  DẤU LƯỢC. 7.2 kết thúc bằng …pe… của Pāli nên bản Việt chỉ có một dấu lược; tôi KHÔNG mở rộng ở 7.3 và cũng không thêm dấu lược nào ở đâu khác. 8.1 bỏ dấu tiếng ấy-ti vì 64/73 tệp đã bỏ, còn các khoá khác giữ “ti. Nháy kép: đặt đúng ở cùng khoá với Pāli, cân trên cả bài (22 mở, 22 đóng); bốn cặp mở ở 1.4, 2.2, 6.2, 7.2 và đóng ở 1.5, 2.7, 6.3, 7.3.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
