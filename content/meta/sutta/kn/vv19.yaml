  **BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ** (đã ghi, chưa im lặng):
  · `8.3` `Saññamā saṁvibhāgā ca` — xem `blocking_errors`. Chỗ này là **bằng chứng đối chiếu
    chéo trong chính Pāli root**, không phải suy đoán: `ja541` đọc `Saṁyamā` 8/8, `vv` đọc
    `Saññamā` 7/7.
  · `6.1` `ḍāka` — **hapax legomena** toàn bộ Pāli root (đếm bằng tokenizer, đúng 1 khoá:
    `vv19:6.1`; `thig1.1:1.4` chỉ có dạng ghép `Sukkhaḍākaṁ`). Tôi dịch *xôi* theo nghĩa
    *mảnh, miếng* của `ḍāka` — đây là **suy luận**, cần xác nhận.
  · `6.2` `loṇasovīrakañcahaṁ` — **một từ ghép, hapax**: `loṇa` (mắm) + `sovīra` (bơ) + `añcaha`
    (bánh). `sovīra` chỉ xuất hiện thêm 1 lần ở `mil6.4.2:54.1` trong danh sách hàng hoá và
    đó là **bơ đã lọc**; `añcaha` không có chỗ nào khác. Tôi dịch *bánh mắm bơ* — dịch theo
    nghĩa từng thành phần, không bịa một món ăn cụ thể nào.
  · `5.1`–`5.2` `Kevaṭṭadvārā nikkhamma, / ahu mayhaṁ nivesanaṁ;` — đọc là *bốn cửa ngõ của
    nơi tôi cư trú*. `nivesana` = nơi cư trú (có tiền lệ *chỗ ở tận xa xôi* ở `vv23:6.2` cho
    `senāsanaṁ padīpiyaṁ`, nhưng khác từ). Câu này hơi cụt trong tiếng Việt vì Pāli cũng là
    mảnh vắt; tôi **không** thêm chủ ngữ nào.
  · `5.4` `saṁcaramānānaṁ` — dịch *đang đi khất thực* vì `saṃcarati` là đi khất thực trong
    câu này (người nhận lấy gạo, cháo ở `6.1`); nếu đọc đơn thuần là *đi lang thang* thì câu
    vẫn hiệu được nhưng mất liên kết với kệ 6.
  · `12.3`–`12.4` — `sāmaññaphale` và `sakadāgāmiphale` là hai **quả vị khác nhau** theo đúng
    Pāli: *quả Sa-môn* rồi *quả vị nhập lưu một lần*. `Anacchariyaṁ kho panetaṁ` = *thật đáng
    lạ*; câu 12.3 là câu hỏi bám dấu hai chấm nhưng Pāli không có dấu hỏi ở `byākareyya.`,
    tôi giữ dấu chấm.
  · `12.2` — Pāli là mệnh đề danh định không có chủ ngữ (*[tên] là Lakhumā … nữ cư sĩ …*);
    tôi thêm *Tôi* và *một* để câu thành câu trong tiếng Việt — ghi rõ vì đây là **phần thêm
    nhỏ** so với Pāli, không phải diễn giải nghĩa.

  **Nháy kép.** Pāli cân sẵn: mở `“` ở `1.1` và `5.1`, đóng `”` ở `3.4` và `12.4` (2 = 2);
  một cặp nháy đơn `‘…’` ở `12.2` (1 = 1). Bản Việt đặt **đúng các vị trí ấy** — kể cả
  `11.3`, vốn ở Pāli là `pabhāsatīti.` **không** có `”`, vì lời của nữ thiên còn mở cho tới
  `12.4` `byākāsī”ti.`. `ngoặc()` của `_hvi.py` xác nhận cân; tôi tự kiểm thêm nháy đơn
  **theo từng khoá** (`_hvi` chỉ đếm nháy kép): 1 khoá có nháy đơn, lệch 0.

  **Dấu lược.** Pāli có `…pe…` đúng 1 khoá (`11.2`); **không** khoá nào có `…` trần. Bản Việt
  giữ **đúng một** `…` ở `11.2` và không có dấu lược nào khác ⇒ tổng dấu lược khớp 1 = 1, 0
  chỗ bung thành văn, 0 chỗ nén.

