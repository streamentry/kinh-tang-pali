    Pāli: *quả Sa-môn* rồi *quả vị nhập lưu một lần*. `Anacchariyaṁ kho panetaṁ` = *thật đáng
    lạ*; câu 12.3 là câu hỏi bám dấu hai chấm nhưng Pāli không có dấu hỏi ở `byākareyya.`,
    tôi giữ dấu chấm.
