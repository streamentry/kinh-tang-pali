  · Khoá sửa và lý do (đối chiếu Pāli):
    `2.2` `kena te idha mijjhati` → *thành tựu được ở nơi đây* (công thức đã quyết ở `vv7`/`vv13`);
    `3.1` hô cách `devi mahānubhāve` + `taṁ` = *Tôi hỏi nàng, này thiên nữ có đại oai lực* (bản cũ
    gọi *ngài* và biến hô cách thành tân ngữ *về đại oai lực ấy*);
    `4.2` `pucchitā` = *được … hỏi* (không phải *bị truy hỏi*); `4.3`–`4.4` mệnh đề quan hệ *về nghiệp
    mà đây là quả báo*;
    `5.1`–`5.2` `Kevaṭṭadvārā nikkhamma, ahu mayhaṁ nivesanaṁ` — bản cũ đọc *bốn cửa ngõ* là sai
    (`kevaṭṭa` không phải *bốn*); đọc là tên cổng (`Kevaṭṭadvāra`, hapax toàn Pāli root, 1 khoá),
    giữ nguyên tên riêng; `5.3`–`5.4` `sañcaramānānaṁ sāvakānaṁ mahesinaṁ` là cụm sở hữu cách *khi các
    đệ tử của bậc Đại Ẩn Sĩ đang đi lại ở đó* (bản cũ *đi khất thực vân la* thêm nghĩa); *bậc Đại
    Ẩn Sĩ* theo tiền lệ `mahesi` toàn tầng kn;
    `6.1` `ḍākaṁ` = *rau* (Sujato `thig1.1:1.4` dịch *vegetables*, dạng ghép `sukkhaḍāka`), không phải
    *xôi*; `6.2` `loṇasovīrakañcahaṁ` = `loṇasovīrakaṁ` + `ca` + `ahaṁ` (*và … tôi*), không phải
    `añcaha` = *bánh*: bản cũ *bánh mắm bơ* sai cả ba chữ; `loṇasovīraka` là thức uống chua mặn,
    cùng từ ở `sn12.66:13.10` (dịch *cháo chua pha muối*), nên dùng đúng cách dịch ấy;
    `6.3` `ujubhūtesu` = *ngay thẳng* (không *chân thành*; `vv25:5.3` cùng cách);
    `7.3` *cùng cả kỳ nửa tháng thần biến* (`pakkha` = nửa tháng; theo `vv24`/`vv25`/`vv31`);
    `8.1` `upavasissaṁ` = *Tôi đã giữ* (`sadā` thuộc `8.2`, nên bỏ *Luôn* ở `8.1`); `8.2` bỏ *giữ mình
    trong sạch* (không có trong Pāli), `saṁvutā` = *thu thúc*; `8.4` bỏ *lấy … này làm nơi ở* thành
    *cư ngụ trong cung điện* (`āvasāmi`);
    `9.1` `pāṇātipātā` = *sát sinh* (bản cũ *sát người* sai); `9.2` `saññatā` = *giữ mình*;
    `9.3` `aticārā` = *tà hạnh* (bản cũ *quá đà*); `9.4` `ārakā` = *xa lánh*;
    `10.1` bỏ *Luôn*; `10.2` bỏ *nhiệm mầu*; `10.3` bỏ *Mắt Tuệ* (`cakkhumato` = *Bậc Có Mắt*);
    `10.4` `gotamassa yasassino` là sở hữu cách *của Đức Gotama danh tiếng* (bản cũ rời rạc, thêm
    *lẫy lừng danh thơm*);
    `1.1`, `1.4` bỏ *rạng rỡ*/*rực rỡ* (không có trong Pāli); `1.2` bỏ *nơi đây* (Pāli không có `idha`);
    `6.4` `vippasannena cetasā` = *với tâm trong sáng* (bỏ *thanh tịnh*);
    `12.1` thêm `ca` = *Và*; `12.2` lời gửi là ngôi thứ ba: *nữ cư sĩ tên Lakhumā cúi đầu đảnh lễ*
    (bản cũ thêm *Tôi tên là … một nữ cư sĩ*, đổi thành lời tự xưng);
    `12.3` `anacchariyaṁ` = *chẳng có gì lạ lùng* (bản cũ *thật đáng lạ* đảo nghĩa), `yaṁ … byākareyya`
    = *nếu … có thể tuyên bố*; `12.4` `byākāsī` là quá khứ *đã tuyên bố*, và `sakadāgāmi` =
    *Nhất Lai* (bản cũ *nhập lưu một lần* sai: đó là `sotāpatti`; xem `vv15`/`sn55.56` cùng tầng).
    Cách dịch `12.1`–`12.4` đồng bộ với `vv15` (cùng Pāli).
  · **Không sửa tiêu đề `0.2`** *Chuyện Cung Điện Nữ Hư Không*: `Itthivimāna` không có `ākāsa`, nên chữ
    *Hư Không* là sai, nhưng cụm này lặp ở hàng chục tệp vv (đo trong tầng) nên sửa riêng một tệp sẽ làm
    cả bộ lệch nhau; ghi nhận để người biên tập sửa đồng loạt. `0.4` và khoá kết `13.1` giữ như cũ.
  · Đọc kỹ các đoạn từ Pāli khi không có tầng tham khảo: `5.1`–`5.2` (tên cổng có thể là tên riêng
    của một cổng thành, nhưng Pāli root không nói rõ), `7.3` (`Pāṭihāriyapakkha`, giữ cách dịch của
    cả họ vv), `6.1`–`6.2` (xác định từ `thig1.1` và `sn12.66`). Phần còn bất định: `Kevaṭṭadvāra` có
    phải tên riêng hay *cổng của người đánh cá*, ghi ở đây, không thêm vào thân kinh.
