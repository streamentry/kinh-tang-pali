  `11.3`, vốn ở Pāli là `pabhāsatīti.` **không** có `”`, vì lời của nữ thiên còn mở cho tới
  `12.4` `byākāsī”ti.`. `ngoặc()` của `_hvi.py` xác nhận cân; tôi tự kiểm thêm nháy đơn
  **theo từng khoá** (`_hvi` chỉ đếm nháy kép): 1 khoá có nháy đơn, lệch 0.

  **Dấu lược.** Pāli có `…pe…` đúng 1 khoá (`11.2`); **không** khoá nào có `…` trần. Bản Việt
