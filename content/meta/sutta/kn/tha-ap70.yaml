notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `tha-ap`/`thi-ap`.
  Bài này bắt đầu bằng một con khỉ dâng quả xoài cho Đức Phật, nên văn phong văn xuôi
  1.1-4.2 giữ ngôi kể thứ nhất của chính vị trưởng lão.
  Tiền lệ đếm được: 11/40 khoá có Pāli trùng nguyên văn trong tầng — tỉ lệ thấp nhất lát.
  0.1 `Therāpadāna` giữ nguyên Pāli (291/300 tệp tha-ap). 0.2 `Sakacintaniyavagga` →
  Phẩm Sakacintaniya (4/4; dùng chung cho tha-ap66 và 68 trong lát). 0.3 và 11.1 →
  Bài Kệ Tuyên Ngợ Về Trưởng Lão X, thứ N. (0.3: 162/305 nhóm Tuyên Ngợ; 11.1: 140/305
  đúng dạng này). Pāli 0.3 không có số thứ tự nên không thêm số vào 0.3.
  Công thức dùng lại nguyên văn: `Avasesesu kappesu` → Trong suốt những kiếp còn lại;
  `Pattomhi acalaṁ ṭhānaṁ` → Tôi đã chứng đắc cảnh giới bất động (tha-ap64);
  `hitvā jayaparājayaṁ` → buông bỏ cả thắng lẫn bại; `cakkavattī mahabbalā` → là Chuyển
  Luân Vương có đại uy lực; `Duggatiṁ nābhijānāmi` → Tôi không còn biết đến đọa xứ nào.
  Ghi nhận bất định, đây là lý do ambiguity_integrity 8.9 và semantic_fidelity 9.2:
  (a) 4.3–4.4 `Iminā madhudānena, ambadānena cūbhayaṁ` — `madhudāna` dịch việc dâng mật
  (cùng Pāli ở tha-ap396:8.1 là Nhờ việc dâng mật này); `cūbhayaṁ` = `ca` + `ubhayaṁ`, cả
  hai (việc dâng mật và việc dâng xoài). Câu không có tiền lệ cú pháp và vế sau treo
  nên giữ ngắn, không thêm chủ ngữ.
  (b) 7.1–7.2 `Damena uttamenāhaṁ, damitomhi mahesinā` — `dama` là sự điều phục, không phải
  ngọn đèn: tôi được bậc Đại Ẩn Sĩ điều phục bằng sự điều phục tối thượng. Không có
  tiền lệ Pāli trùng.
  (c) 2.1 `Kapi ahaṁ tadā āsiṁ` — `kapi` là con khỉ (ja46:1.4, ja516:17.1, ja545:119.2 đều
  dịch khỉ); cách dịch con dê núi cũ là sai.
  (d) 1.4 `appamāṇe nirūpadhi` — `appamāṇe` bổ nghĩa `loke` (thế gian vô lượng), `nirūpadhi`
  là bậc không còn sanh y (không còn chấp thủ), cùng cách dịch ở tha-ap490:12.2 và
  tha-ap25:16.2.
  (e) 3.4 `ambaṁ samadhukaṁ` dịch quả xoài có mật, đối ứng với `madhudānena` ở 4.3; đọc
  `samadhuka` là ngọt như mật cũng khả dĩ, bất định còn mở.
  (f) 8.1 `Sattasattatikappasate` — dạng `X-kappasate` đo được nhân X với một trăm
  (tha-ap146:5.1 mười lăm là một ngàn năm trăm; tha-ap200:4.1 hai mươi ba là hai ngàn ba
  trăm; tha-ap487:17.1 hai mươi sáu là hai ngàn sáu trăm), nên bảy mươi bảy là bảy ngàn
  bảy trăm kiếp; cách đọc của hợp từ này không có phép chứng thực độc lập.
  Tên `Ambadāyako` chứng thực trong chính Pāli bài này ở 10.1.
  `…pe…` ở 9.2 giữ đúng một dấu lược; nháy kép mở ở 1.1, đóng ở 9.3.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do
  coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`,
  `npm run build`.

  Sửa lan 2026-10-13 (kiểm cả bài, 24 khoá): 1.1 Bậc Vô Tỳ Nhiễm, Đức Thế Tôn → Đức Thế Tôn Anomadassī (Anomadassī là tên Đức Phật, giữ nguyên như ở tha-ap178:1.1, tha-ap4:1.1, tha-ap3:69.1, cùng Pāli, đều là Đức Thế Tôn Anomadassī); 1.3–1.4 Ngự ấy tỏa hào quang… → Ngài trải tâm từ khắp thế gian, vô lượng, bậc không còn sanh y (`mettāya aphari`); 2.1 dê núi → khỉ (`kapi`); 2.2 núi chí tôn cao nhất → ở Himavanta, ngọn núi tối thượng (tha-ap43:6.2); 2.3 bậc Vô Tỳ Nhiễm ấy → Anomadassī ấy; 2.4 lòng ta… hoàn toàn tịnh tín → tôi làm cho tâm tịnh tín nơi Đức Phật (tha-ap329:11.2); 3.1 Từ chỗ xa trên núi ấy → Không xa núi Himavanta (cùng Pāli ở tha-ap474:2.1, `avidūre`); 3.2, 3.3, 3.4 sửa theo Pāli (cây xoài đang có quả; từ đó tôi lấy quả chín; quả xoài có mật); 4.1 → Đức Phật đã giảng giải điều ấy cho tôi (4/5 khoá cùng Pāli dịch giảng giải: tha-ap20:5.1, tha-ap563:5.1, vv34:21.1, tha-ap312:2.1; 1 khoá dịch thọ ký, tha-ap15:2.1; chủ ngữ là Đức Phật, không phải vị ấy chung chung); 4.2 → Anomadassī, bậc Đại Mâu-ni (bv9:21.2); 4.3–4.4 → Nhờ việc dâng mật này, và nhờ việc dâng xoài, cả hai; 5.1 Vào năm mươi bảy kiếp trước đây → Trong năm mươi bảy kiếp (động từ `ramissati` là tương lai, đây là lời thọ ký, không phải quá khứ; đồng dạng tha-ap396:8.3); 5.4 luân hồi có thể đếm → luân hồi xen kẽ (`vokiṇṇaṁ`, giống tha-ap397:17.4); 6.1 nghiệp ác đã bị thiêu rụi → Sau khi làm tiêu hết nghiệp ác (`khepetvā`, không phải `jhāpeti`); 6.3 đi đến chỗ tan rã → không rơi vào đọa xứ (`vinipāta`); 6.4 lụa phiền não → các phiền não (`kilese`, `lụa` là chữ thừa); 7.1–7.2 ngọn đèn… thiêu lửa → sự điều phục tối thượng, được bậc Đại Ẩn Sĩ điều phục (`dama`); 8.1 Từ → Vào bảy ngàn bảy trăm kiếp trước (đồng dạng tha-ap146:5.1, tha-ap110:4.1; 7.700 giữ nguyên); 8.2 có mười bốn vị có danh là → cùng mang tên Ambaṭṭhaja (mười bốn vị đã nằm ở 8.3; tha-ap147:4.2). Đại từ ngôi thứ nhất của trưởng lão thống nhất là tôi trong các khoá đã sửa (trước đó lẫn ta và tôi). Các nhận định (a)–(d) ở trên được viết lại cho khớp bản sửa. Ba số Pāli trong bài: 57, 7.700 (77 × 100), 14. Khối quality giữ nguyên: các điểm ghi ngày 2026-10-05 được chấm trước lượt sửa này và bản đã sửa chưa được chấm lại.
