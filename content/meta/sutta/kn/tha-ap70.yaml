notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `tha-ap`/`thi-ap`.
  Bài này bắt đầu bằng một con dê núi dâng quả xoài cho Đức Phật, nên văn phong văn xuôi
  1.1-4.2 giữ ngôi kể thứ nhất của chính vị trưởng lão.
  Tiền lệ đếm được: 11/40 khoá có Pāli trùng nguyên văn trong tầng — tỉ lệ thấp nhất lát.
  0.1 `Therāpadāna` giữ nguyên Pāli (291/300 tệp tha-ap). 0.2 `Sakacintaniyavagga` →
  Phẩm Sakacintaniya (4/4; dùng chung cho tha-ap66 và 68 trong lát). 0.3 và 11.1 →
  Bài Kệ Tuyên Ngợ Về Trưởng Lão X, thứ N. (0.3: 162/305 nhóm Tuyên Ngợ; 11.1: 140/305
  đúng dạng này). Pāli 0.3 không có số thứ tự nên không thêm số vào 0.3.
  Công thức dùng lại nguyên văn: `Sattapaññāsakappamhi` → Vào năm mươi bảy kiếp trước
  đây (tha-ap150, 3 cặp); `Avasesesu kappesu` → Trong suốt những kiếp còn lại;
  `Pattomhi acalaṁ ṭhānaṁ` → Tôi đã chứng đắc cảnh giới bất động (tha-ap64);
  `hitvā jayaparājayaṁ` → buông bỏ cả thắng lẫn bại; `cakkavattī mahabbalā` → là Chuyển
  Luân Vương có đại uy lực; `Duggatiṁ nābhijānāmi` → Tôi không còn biết đến đọa xứ nào.
  Ghi nhận bất định, đây là lý do ambiguity_integrity 8.9 và semantic_fidelity 9.2:
  (a) 4.4 `ambadānena cūbhayaṁ` không có tiền lệ và cú pháp lạ. Đọc `cūbhayaṁ` là từ
  nhấn cả hai vế, nên dịch cả với việc dâng quả xoài nữa; cách đọc còn lại là nói Đức
  Phật đã giảng cho cả hai điều (ngọt và xoài) thì câu cũng đứng nhưng khi đó phải lặp lại
  chủ ngữ, nên chọn cách ít giả định hơn.
  (b) 7.1-7.2 `Damena uttamenāhaṁ, damitomhi mahesinā` không có tiền lệ; `ahaṁ` và
  `damitomhi` cùng là ngôi thứ nhất nhưng hai vế có hai chủ thể khác nhau trong cách
  đọc thông thường, nên dịch giữ nguyên sự chuyển ngôi: Bằng ngọn đèn tối thượng, ta đã
  thiêu / lửa phiền não của Đại Ẩn Sĩ. Không thêm chủ ngữ nào và chỉ ghi ở đây.
  (c) 2.1 `Kapi ahaṁ tadā āsiṁ` đọc là Ta là một con dê núi lúc ấy; `kapi` cũng có thể
  là ca sĩ nhưng cả khốa kệ nói về hái quả xoài trên núi nên nghĩa dê là đúng bối cảnh.
  (d) 1.4 `appamāṇe nirūpadhi` dịch không đo lường được, không còn chỗ bám víu, ghép
  `appamāṇa` (không đo lường được) với `nirūpadhi` (không có chỗ đứng) đúng như cặp
  tính từ Pāli ghép; tha-ap136:3.4 dùng không đo lường, không chấp giữ cho cùng công
  thức nên ở đây giữ nghĩa chỗ bám víu cho khác, vì `nirūpadhi` là nơi chứa đứng.
  Tên `Ambadāyako` chứng thực trong chính Pāli bài này ở 10.1.
  `…pe…` ở 9.2 giữ đúng một dấu lược; nháy kép mở ở 1.1, đóng ở 9.3.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do
  coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`,
  `npm run build`.