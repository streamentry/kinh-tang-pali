notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B1 — snp5.5:5.5, snp5.5:6.4 (`visattikā` = sự vướng mắc (ở đời); `tare` = có thể vượt qua).

  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 9.2 ("Gotama đã khéo giảng về sự không chấp thủ" → "điều không còn sanh y đã được khéo giảng, thưa Gotama": `gotama` là hô cách trong hợp âm `gotama + anūpadhīkaṁ`, chủ ngữ của `sukittitaṁ` (quá khứ phân từ) là `anūpadhīkaṁ`; DPD `anūpadhīka` "free from attachment", lit. không có `upadhi`; lời giải Niddesa cnd8:86.4 giải `upadhi` là phiền não, uẩn, hành tạo tác, khớp "sanh y" ở chính 3.1, 3.3; Sujato "You have expounded non-attachment well, Gotama"; khớp cnd8:84.2, cnd2:26.2); giữ 2.4 (`upadhinidānā` "do chấp thủ làm nhân" không thuộc mục chéo này, để lượt thống nhất `upadhi` chung).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 2): sửa 2.3, 3.3, 5.4, 6.3 (`pajānaṁ`/`viditvā` "liễu tri" → "biết rõ"/"người hiểu biết": DPD `pajāna` "knowing; clearly understanding", `viditvā` "having known"; A5/B9 dành "liễu tri" cho họ `pariññā`; khớp cnd8:31.3, 37.3, 60.4 đã sửa); giữ 5.5, 6.4 (`tare` ngôi 3 "vị ấy": lời giải cnd8:64.16, 70.5 `sato tareyya` ngôi 3, Sujato "one").
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 1.5, 2.5 (bỏ chữ nội dung 'ye keci': thêm 'bất cứ khổ nào'; lời giải cnd8:29.2 'sabbena sabbaṁ … pariyādiyanavacanaṁ', Sujato 'all their countless forms'); 2.4 ('upadhi' 'chấp thủ' → 'sanh y': 'chấp thủ' là chữ của 'upādāna', trong khi 3.1, 3.3, 9.2 cùng mạch dịch 'sanh y'; lời giải cnd8:34.2 'dasa upadhī', 86.4 'upadhī vuccanti kilesā ca khandhā ca abhisaṅkhārā ca'; thống nhất trong bài theo quyết định 2026-10-17 §3; khớp cnd2:19.4, cnd8); 8.1–8.4 (lệch ranh khoá: 'bhikkhu' đặt ở 8.1, 8.3 mang 'sau khi biết rõ, ngay tại đây' của 8.4; dịch lại từng dòng, 'vidvā' là 'người có hiểu biết' theo lời giải cnd8:82.8 'vijjāgato ñāṇī', 82.11 'jātiñca jarañca sokapariddavañca dukkhañca pajaheyya'; theo cnd2:25.1–25.4); 10.1–10.2 (lệch ranh khoá, đảo vế; theo lời giải cnd8:91.2–92.5 và cnd2:27.1–27.2).
