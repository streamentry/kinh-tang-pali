notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho tha-ap, xem `blocking_errors`.
  TIỀN LỆ: giống tha-ap495 cho mọi công thức dùng chung (`Therāpadāna`, `Phẩm Hoa Kiṅkaṇi`, `Bốn vô ngại giải`, `đã làm tròn lời dạy của Đức Phật`, `Tôi không còn biết đến đọa xứ nào`, `Các phiền não của tôi đã bị thiêu rụi`, `tôi sống không còn lậu hoặc`). Riêng bài này: `Upaḍḍhadussaṁ datvāna` → `Sau khi cúng dường nửa tấm y,` dùng nguyên văn tiền lệ; `devarajjamakārayiṁ` → `tôi làm ra vương quyền nơi chư thiên`; `Padesarajjaṁ vipulaṁ` → `Vương quốc rộng lớn ấy` và `gaṇanāto asaṅkhiyaṁ` → `đếm không hết, vô tận` dùng nguyên văn tiền lệ; `Satasahassito kappe` → `Vào một trăm ngàn kiếp trước đây` 5 lần; `yaṁ dānamadadiṁ tadā` → `khi tôi dâng cúng phẩm vật ấy` 2 lần.
  NGÔI KỂ: `tôi` (xem tha-ap495 về phép đo và về việc cần gộp).
  BẤT ĐỊNH 1 — `Icchamāno cahaṁ ajja, / sakānanaṁ sapabbataṁ` (6.1–6.2): `sakānanaṁ sapabbataṁ` nghĩa là núi được phủ kín, nhưng câu `cahaṁ ajja` (hôm nay tôi mong) đứng trước làm cả khổ thơ khó nối. Dịch `Hôm nay tôi mong / có những núi / phủ kín lá cỏ chằng chịt,` và để 6.4 làm vế quả báo; không thêm chữ giải thích.
  BẤT ĐỊNH 2 — `devindo` (4.1) là `deva-indra`; dịch `bậc Trời Vua`. 0 tiền lệ cho `devindo`; gần nhất là `devarājāra` → `vua chúa thiên đế` (vv40:2.4).
  BẤT ĐỊNH 3 — `saṅkāre carate tadā` (1.4): dịch `rồi đi lang thang nơi phố phường`; `saṅkāra` ở đây là đường phố, không phải hành trình.
  TIÊU ĐỀ: `Ký Sự Về Trưởng Lão Cúng Dường Nửa Tấm Y` theo mẫu 3/3 bài anh em cùng phẩm (494, 496, 499). Cụm này không chứa từ Pāli có dấu nên không vướng chốt `lọt_pāli`.
  SỐ KHOÁ TRÙNG PĀLI: 17/42 khoá trùng nguyên văn trong lát; toàn lát dùng lại 61 cặp, 0 lệch.

  Sửa lan 2026-10-13: (1) `tha-ap497:6.1`–`6.3` (`Icchamāno cahaṁ ajja, sakānanaṁ sapabbataṁ; Khomadussehi chādeyyaṁ`): *Hôm nay tôi mong / có những núi / phủ kín lá cỏ chằng chịt* → *Hôm nay, nếu tôi muốn, / cả rừng cây lẫn núi non, / tôi có thể phủ bằng những tấm vải lanh*. `khomadussehi` là cách dụng cụ số nhiều của "vải lanh", không có "lá cỏ"; `chādeyyaṁ` là "tôi có thể phủ"; theo `tha-ap345:6.1`–`6.3`, `tha-ap424:15.2`–`15.3`, `tha-ap336:14.2`–`14.3`. (2) Trong cùng lượt đọc đối chiếu còn sửa `1.3`–`1.4` (`Paṁsukūlaṁ gavesanto, saṅkāre carate tadā`): chủ ngữ là vị đệ tử Sujāta của `1.2` (động từ `carate` ngôi thứ ba), không phải người kể — *Vị ấy tìm kiếm y phấn tảo, khi ấy đi giữa các đống rác* (bản cũ: *tôi tìm kiếm… đi lang thang nơi phố phường*); và `2.2` (`paresaṁ bhatako ahaṁ`): *người bán thức ăn cho đám đông* → *người làm thuê cho người khác* (`bhataka` = người làm thuê, như `tha-ap26:3.2`). Điểm số giữ nguyên.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 42/42 khoá, đổi 17/42 khoá.
  (1) `dussa` → `vải`, không phải `y`: ngay trong bài, `khomadussehi` (6.3) đã dịch "vải lanh", nên `aḍḍhadussa` ở 6.4 là "nửa tấm y" thì cùng gốc mà hai nghĩa; tầng `tha-ap` đa số dịch `dussa` là "vải" (tha-ap424, tha-ap336, tha-ap113, tha-ap393; tiêu đề tha-ap424 "Cúng Dường Một Tấm Vải"); chỉ tha-ap95 (bài song song) dùng "y" và chính nó cũng lẫn "vải" ở 3.2. Đổi `0.3`, `12.1`, `translationTitle` thành *Ký Sự Về Trưởng Lão Cúng Dường Nửa Tấm Vải*; `2.3` *cúng dường nửa tấm vải*; `5.3` *Nhờ sự trao nửa tấm y ấy* → *Nhờ việc cúng dường nửa tấm vải* (bỏ "ấy" không có trong Pāli, "trao" lệch động từ của 2.3); `6.4` = `7.4` (Pāli trùng) *đó là quả của việc trao nửa tấm y* → *đây là quả của nửa tấm vải* (theo `ekadussassidaṁ phalaṁ` ở tha-ap336:17.4).
  (2) `4.1` `devindo`: *bậc Trời Vua* → *là chúa chư thiên*. Ghi chú BẤT ĐỊNH 2 cũ ("0 tiền lệ cho devindo") là sai: đúng câu `Tettiṁsakkhattuṁ devindo` có 2 khoá tiền lệ (tha-ap420:7.1), và `devindo` ở tầng tha-ap có 38 khoá, đa số "chúa chư thiên". BẤT ĐỊNH 2 coi như đã giải.
  (3) Ghi chú BẤT ĐỊNH 3 cũ (`saṅkāra` = "phố phường") là sai và đã được lượt sửa lan bỏ khỏi bản dịch: `saṅkāra` là đống rác, khớp `paṁsukūla` ở 1.3. BẤT ĐỊNH 1 cũ cũng đã được sửa lan giải (6.1–6.3).
  (4) Theo tiền lệ đếm được: `2.1` *thành xứ* → *thành* (2/3); `2.4` *tôi cúi đầu lễ bái* → *tôi đã cúi đầu đảnh lễ* (`abhivādayiṁ` thì quá khứ, tha-ap1:7.4); `4.3` → *Và bảy mươi bảy lần* (4/4; bỏ "lại thêm … nữa"); `4.2`, `4.4` thêm "đã" (aorist); `5.1` *Vương quốc rộng lớn ấy* → *Vương quyền cai quản các vùng đất rộng lớn* (37/49; bản cũ mất `padesa` và thêm "ấy"); `5.4` *không sợ hãi* → *không sợ hãi từ đâu* (`akutobhayo`, như thi-ap28:69.4); `9.1` *Thật là đón mừng thù thắng thay cho tôi* → *Thật lành thay sự đến của tôi* (đa số 168/226 dạng "Thật lành thay sự đến của …"; "thù thắng" không có trong Pāli); `11.1` tên ở dạng gốc *Upaḍḍhadussadāyaka* (478 khoá dạng gốc so với 59 dạng chủ cách `-o`); `1.1` *Tôn Đức Thế Tôn* → *Đức Thế Tôn* ("Tôn Đức" không có trong Pāli).
  GIỮ, có ghi nhận: `4.2` *làm ra vương quyền nơi chư thiên* là calque gượng của `devarajjamakārayiṁ`, nhưng là đa số tầng (≈25/31; "cai trị/cai quản/trị vì cõi trời" ≈6) — để biên tập phán một lượt cho cả cuốn, không lệch riêng bài này. `5.2` *đếm không hết, vô tận* giữ theo 14/17 dù "vô tận" hơi thừa. Ngôi kể "tôi" giữ theo các bài cùng lát (495–500). Ngoài lát: tha-ap495, tha-ap496, tha-ap498 vẫn dùng "Thật là đón mừng thù thắng thay cho tôi", tha-ap498:5.3 vẫn "bậc Trời Vua", 9 khoá khác vẫn "Vương quốc rộng lớn ấy" — chưa sửa.
  Số Pāli: `tettiṁsa` = 33; `satta-sattati` = 7 + 70 = 77; `satasahassa` = 100 × 1.000 = 100.000 ("một trăm ngàn").
  Tự kiểm: 42/42 khoá khớp Pāli; nháy kép/đơn khớp Pāli 42/42 khoá; `…pe…` 3/3 → `…`; 2 nhóm Pāli trùng nội bài (6.4/7.4; 8.2/9.2/10.2), 0 nhóm lệch; NFC sạch. Không chạy được cổng của kho trong lượt này — còn phải chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`.
  Điểm: semantic_fidelity 9.3 → 9.2, grammar_logic 9.3 → 9.2 (bản đã published từng mang lỗi chủ ngữ 1.3–1.4 và lỗi nghĩa 2.2, 6.1–6.3 mà điểm cũ không bắt được; nay không còn lỗi nghĩa đã biết, nhưng chỉ có Pāli để đối chiếu); vietnamese_clarity 9.3 → 9.0 (calque 4.2 còn giữ, "không sợ hãi từ đâu" hơi cứng); han_viet_balance 9.4 → 9.3; ambiguity_integrity 9.2 → 9.0 (hai trong ba ghi chú bất định cũ chứa khẳng định sai, nay đã đính chính ở đây); terminology giữ 9.2 (sửa `devindo`, `dussa`, dạng tên; còn `4.2` chưa thống nhất toàn tầng); triangulation giữ 7.5 (không có bản Anh và Việt hiện hành). final_score 9.23 → 9.15.

  Quyết định hội đồng biên tập 2026-10-16: B20 — 3.2 (`cetanāpaṇidhīhi` = nhờ những ước nguyện của tâm).
