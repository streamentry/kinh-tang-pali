notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, tệp `kn/ja/ja480_root-pli-ms.json` (103/103 khoá, đúng thứ tự Pāli, không khoá ngoài tập). Bài chỉ gồm tiêu đề, 21 nhóm kệ và dòng kết; tầng Pāli đã ghim không có phần văn xuôi.

  - Tầng tham khảo:
    Tầng `english-sujato` tại commit đã ghim chỉ có 83 bài Jātaka và không có `ja480` (tra manifest và thư mục cache: chỉ có tệp Pāli root cho uid này). Tầng `english-project` của dự án chưa có bài này và `content/meta/en/` không có `ja480.yaml`. Bản Việt hiện hành (`translation/vi/phantuananh/`) chỉ có Pháp Cú. Coverage English = 0; mẫu số theo ngưỡng của `source/layers.yaml` (khoá Pāli có nội dung từ 40 ký tự, bỏ khối `:0`) = 0, vì mọi dòng kệ đều ngắn hơn 40 ký tự, nên cổng coverage không đo được gì ở bài này (đó không phải là bằng chứng cho việc không cần ghi nhận gap). Ba tầng tham khảo đều vắng, nên bài giữ `draft` với blocker `noEnglishEditionUpstream` và `triangulation` = 7.0 (≤ 8.0).
    Bài dịch dựa vào Pāli root và các tiền lệ nội bộ của tầng Việt; không tham khảo bản dịch bên thứ ba nào ngoài tầng ghim.
  - Người nói (suy từ nội dung kệ, Pāli không ghi trực tiếp): 1 mở đầu có phần dẫn truyện rồi lời hỏi của Sakka; 2 Akitti đáp; 3, 5, 7, 11, 15, 18 Sakka ngỏ lời ban ân huệ (điệp khúc); 4, 6, 8, 12, 16–17, 19 Akitti chọn từng ân huệ; 9 và 13 Sakka hỏi lại; 10 và 14 Akitti đáp; 20 Sakka; 21 Akitti. Bản dịch không thêm người nói vào thân kinh.
  - Bất định (đã chọn cách ít giả định nhất, không đưa vào thân kinh):
    + 1.1–1.4: dấu nháy kép của Pāli bao cả dòng dẫn (`sakko bhūtapatī bravi`) lẫn lời hỏi của Sakka; bản Việt giữ đúng ranh giới nháy theo từng khoá, không thêm nháy lồng.
    + 1.1, 1.4, 2.4 `sammati` / `sammāmi`: dịch là "nhọc công" (làm việc vất vả, tu khổ hạnh trong nóng nực); tầng Việt chưa có tiền lệ cùng gốc từ. `ghammani` = "giữa nóng nực" (ja405:4.2 tầng đã dịch nóng nực).
    + 1.3 `mahābrahme`: dịch "Đại Bà-la-môn", vì Sakka gọi một vị ẩn sĩ Bà-la-môn (tiền lệ ja254:2.3 và ja483:16.4; ngoài ra ja431:1.1 "bà-la-môn lớn" và ja467:10.3 "Đại Phạm Thiên" mỗi dạng một lần, bối cảnh khác).
    + 10.3 và 14.3 `dunnayo seyyaso hoti` / `sunayo seyyaso hoti`: đây là chỗ khó nhất của bài. Đọc `seyyaso` là vị ngữ "tốt hơn / hơn" (cùng nghĩa với dhp43:4 `seyyaso`), chủ ngữ là lối dẫn dắt tồi (dunnaya) và lối dẫn dắt tốt (sunaya). Với kẻ ngu, câu có thể hiểu là "theo cách nhìn của y, dẫn dắt tồi lại hơn"; một cách đọc khác là `seyyaso` chỉ mức độ "càng thêm". Không có bản Anh ghim để phân xử nên giữ sát chữ, hai câu song song.
    + 10.1–10.2, 14.1–14.2 `anayaṁ nayati` / `nayaṁ nayati`: "dẫn dắt theo lối sai / lối đúng". `adhurāyaṁ niyuñjati`: "gắn mình vào việc không phải gánh của mình" (dhura là ách, gánh; sát chữ nhưng nghĩa hơi lỏng, cũng có thể hiểu là giao việc không đúng chỗ).
    + 4.6 và 6.6 `na mayī vase`: đọc là optative của vasati, dịch "chớ trú nơi tôi"; cách đọc khác coi `vase` là thuộc sức chi phối ("chớ nằm trong quyền lực nơi tôi").
    + 6.5 `yena jātena jīyanti`: chủ ngữ của `jīyanti` là "người ta" (không nêu trong Pāli); đối tượng bị mất là các vật ở 6.3–6.4.
    + 4.3–4.5: câu Pāli kéo qua ba khoá (`yena … laddhā narā na tappanti`); bản Việt giữ nguyên trật tự khoá để mỗi khoá còn tương ứng, nên 4.3 đọc nối với 4.5.
    + 16.4 `sūriyuggamanaṁ pati`: "vào lúc gần mặt trời mọc" (`pati` = hướng tới). Tiền lệ ja460:7.2 cùng Pāli dịch khác ("tỏa sáng tới chỗ tận cùng"), nhưng ja460:7.1 `ussāvova tiṇaggamhi` (ussāva là sương) có vẻ đã bị dịch thành "mặt trời mọc"; chỗ đó nằm ngoài lát này, chỉ báo, không sửa.
    + 21.2 `sabbakāmasamiddhinaṁ`: dùng làm định ngữ của người đối thoại ("đầy đủ mọi dục lạc sung túc"); ja346:1.2 cùng Pāli dịch thêm "nơi", ở đây bỏ vì cú pháp khác (đối cách của 21.1).
    + 21.3 `tapo pamajjeyyaṁ`: "xao lãng khổ hạnh" (tiền lệ `tapo` → khổ hạnh ở ja303:2.1, ja433:9.3, ja456:4.1, ja468:11.1).
    + 2.3 `sammohamaraṇaṁ`: "chết trong mê muội".
  - Thuật ngữ và tiền lệ: điệp khúc `Etasmiṁ te sulapite, patirūpe subhāsite` (3.1–3.2 và năm lần lặp 5, 7, 11, 15, 18) dùng nguyên văn ja440:3.1–3.2 (3 chỗ trong ja440, 3/3 giống nhau); `yaṁ kiñci manasicchasi` → "dù ông mong muốn điều gì" (ja440 ba lần; ja429, ja430 dịch "ngươi" vì người nghe khác); `Varañce me ado sakka, sabbabhūtānamissara` → ja440:4.1–4.2 (3 lần); `etaṁ sakka varaṁ vare` → ja440:13.6; `gavāssaṁ dāsaporisaṁ` → ja467:4.2. `bāla` → "kẻ ngu" (30 khoá đã dịch trong tầng ja dùng "kẻ ngu", so với 2 khoá dùng "người ngu"); `dhīra` → "bậc trí"; `dummedho` → "kẻ kém trí"; `vinayaṁ` → "kỷ luật" (0 tiền lệ trong ja); `varaṁ` → "ân huệ" (đã dùng thống nhất ở ja440). Tiêu đề: `Terasakanipāta` → "Bộ Mười Ba Bài Kinh", `Ambavagga` → "Phẩm Xoài" (9/9 trong tầng; nhất quán ja475, ja479, ja481); `Akittijātaka` → "Kinh Akitti", dòng kết "Kinh Akitti thứ bảy." theo ja479 và ja481. `Kassapa` là họ, giữ nguyên làm danh xưng; `Vāsava` giữ nguyên Pāli.
  - Số Pāli: không có số lượng trong lời kệ. Chỉ có số thứ tự ở tiêu đề: `7.` ở 0.4 và `sattamaṁ` = "thứ bảy" ở 22.1 (nhất quán). Không có cụm số chưa phân xử.
  - Phép kiểm tra: (1) tập khoá Việt = tập khoá Pāli, 103/103, cùng thứ tự; (2) dấu nháy kép “ ” khớp Pāli từng khoá (0 lệch trên 103 khoá), không có nháy đơn trong Pāli lẫn Việt; (3) dấu lược `…`: Pāli 0, Việt 0; (4) Pāli trùng nguyên văn trong chính bài: 8 nhóm (các dòng điệp 3.1–3.4, 4.1–4.2, 9.2/13.2, 17.4/19.4), 0 nhóm Việt khác nhau; Pāli trùng với bài khác trong tầng Việt: 33 khoá, 31 dùng lại nguyên văn, 2 khác có lý do (16.4, 21.2, nêu ở trên); (5) NFC, không khoá rỗng, không Pāli lọt sang thân bản Việt ngoài tên riêng và thuật ngữ đã nêu; in cặp Pāli với Việt từng khoá để đọc đối chiếu.
  - Kỹ thuật: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; `technical_integrity` đặt 9.6, cần chạy các lệnh này trước khi publish.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 25 khoá chênh lệch lớn nhất. Khác nghĩa 3: sửa 1, giữ 0, bất định 2. Sửa 6.5 `yena jātena jīyanti`: 'Khi nó đã sinh khởi, người ta mất đi;' → '… người ta mất đi những thứ ấy;' (jīyanti nhận tân ngữ là các vật ở 6.3–6.4: ruộng, đất, vàng, bò, ngựa, nô lệ, người làm; bản cũ có thể đọc thành 'người ta chết/tiêu mất'). Bất định giữ nguyên: 10.3 và 14.3 `dunnayo/sunayo seyyaso hoti` — bản mù đọc `dunnayo` là người ('Hắn khó dẫn dắt') ⟦?⟧, bản dự án đọc là danh từ 'lối dẫn dắt tồi/tốt'; `seyyaso` không rõ nghĩa trong cấu trúc này, chưa phân xử được bằng Pāli một mình. 22 khoá còn lại chỉ khác diễn đạt, giữ (ví dụ 3.2, 5.2… `patirūpe subhāsite` 'thật xứng đáng, thật hay' dùng lại nguyên văn tiền lệ ja440; 4.3–4.4, 6.3–6.4 danh sách tài sản và 20.2 'đàn ông cũng như đàn bà' đúng Pāli). Chỉnh style-only 22.1 'Kinh Akitti thứ bảy.' → 'Kinh Akitti, thứ bảy.' cho khớp dạng có dấu phẩy chiếm 8/10 bài Bộ Mười Ba. Rà đối kháng toàn bài: nháy, dấu lược, số khớp Pāli. Không có bản Anh hay bản Việt độc lập khác; mọi phân xử dựa vào Pāli và tiền lệ nội bộ tầng.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; đoạn song song pv21:42.5, tiền lệ ja440): sửa 4 khoá — 20.4 Sakka tự xưng "ta" trong khi suốt bài (3.3, 5.3… 18.3 "tôi ban cho ông") xưng "tôi" ⇒ đổi "thấy ta" → "thấy tôi" cho nhất quán người nói; 1.4, 9.4, 13.4, 20.4 bỏ dấu chấm thừa sau "?”".
  Giữ 3.4/5.4/…/18.4 "dù ông mong muốn điều gì" theo ja440 đã published (cùng Pāli `yaṁ kiñci manasicchasi`); kho đang lệch với dn21, ja499, ja519 ("bất cứ điều gì…") — "dù" ở đây hơi gượng, nên người biên tập thống nhất chung cả nhóm ja429/ja430/ja440/ja480, không sửa lẻ. Bất định còn lại như mục trước: 10.3/14.3 `dunnayo/sunayo seyyaso hoti`; thêm 10.2/14.2 `adhurāyaṁ (ni)yuñjati` không nêu tân ngữ — "gắn mình" là một cách đọc, cũng có thể là giao người khác vào việc không phải phận sự.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
