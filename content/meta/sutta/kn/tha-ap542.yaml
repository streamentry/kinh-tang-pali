notes: |-
  Dịch trọn 156 khoá (3 khoá tiêu đề :0.x và 153 khoá còn lại: các khổ kệ 1 đến 36 gồm ba khoá …pe…, lời kết 37.1, hai khoá kết 38.1 và 39.1, khoá 40.1 và hai khổ kệ tóm tắt 41 và 42) trực tiếp từ Pāli root; không có bản Anh của Sujato (tệp tha-ap542 chỉ có Pāli root trong danh mục tệp đã ghim), không có lớp english-project và không có bản Việt hiện hành tại commit đã ghim. Đối chiếu thuật ngữ và công thức với các Ký Sự cùng phẩm và liền kề (tha-ap533, tha-ap537, tha-ap539, tha-ap541, tha-ap543, tha-ap549), các bài tha-ap khác có cùng Pāli, thag16.9 (cùng dòng upariṭṭhaṁ yasassinaṁ), snp5.16 (cùng bốn vế Suññato lokaṁ avekkhassu của Mogharāja) và mn77 (y thô, y tăng-già-lê, đống rác, bãi tha ma).
  Tiền lệ đã đo: 153 khoá (không kể :0.x) đối chiếu với 19.252 khoá tha-ap đã có bản Việt; 54 khoá có Pāli, bỏ dấu câu và nháy, trùng nguyên văn với khoá đã dịch ở nơi khác (tổng 5.101 cặp trùng, phần lớn là ba khoá …pe… và công thức kết bài); 48 khoá dùng lại nguyên văn một dạng đã có (Đức Chiến Thắng tên Padumuttara 26 trong 27, Cách đây một trăm ngàn kiếp 7 trong 8, Là bậc đầy lòng trắc ẩn từ bi 7 trong 8, Nhờ nghiệp lành khéo làm ấy 31 trong 33, cùng với tâm nguyện và chí hướng 36 trong 40, sau khi từ bỏ thân người 22 trong 28 (4 khoá thêm chữ hoa đầu câu), Các phiền não của ta đã được thiêu rụi 118 trong 172, ta sống không còn lậu hoặc 128 trong 191, Thật lành thay sự đến của ta 113 trong 165, đã làm tròn lời dạy của Đức Phật 137 ở khoá không có nháy đóng và 494 ở khoá có, Bốn vô ngại giải 526 trong 531, Gắn bó với việc làm cho người khác lấy theo tha-ap339:1.3 vì năm tiền lệ cho Pāli này đều khác nhau, thuộc một gia đình nào đó theo ja415:4.2, 1 khoá). 6 khoá khác tiền lệ có chủ ý: 10.4 và 15.4 đổi ngôi tôi thành ta theo ngôi kể của bài và của phẩm (1 tiền lệ mỗi khoá); 17.1 viết Do phần nghiệp còn lại ấy thay cho Nhờ (3 tiền lệ ở các bài phước, với 1 dạng Rồi do ở tha-ap391) vì đây là nghiệp xấu; 18.4 viết do sức mạnh của nghiệp ấy thay cho nhờ (4 khoá tha-ap539, 541, 543, 549 đều thuộc ngữ cảnh phước, còn đây là quả của nghiệp đốt nền đất); 19.1 viết Trong hiền kiếp này (bv24, bv25, bv28: 3 khoá hiền kiếp, trong khi tha-ap chỉ có tha-ap17 kiếp lành và tha-ap433 viết lỗi kiếp lành lành; hai phạm vi cho hai đa số khác nhau, chọn hiền kiếp vì là tên quen thuộc của kiếp này, Bhaddakappa); 20.1 viết Nhờ nghiệp thù thắng ấy (2 tiền lệ khác nhau, Nhờ vào thiện nghiệp đặc thù ấy và Nhờ việc làm ấy tuyệt hảo ấy, cả hai đều thêm chữ không có trong Pāli).
  Ngôi kể dùng ta: bốn bài cùng phẩm đã có (tha-ap533, 537, 539, 541) đều dùng ta (16, 26, 25, 25 lần) và 0 tôi; phạm vi tha-ap500 đến tha-ap559 là 353 khoá chứa ta so với 242 khoá chứa tôi; toàn lớp tha-ap là 1.913 so với 1.809 (đếm thô, ta viết hoa của Đức Phật cũng tính), nên hai phạm vi cùng nghiêng ta và nghiêng nhẹ. Khi Mogharāja nói với Đức Thế Tôn (25.1 đến 26.4) dùng con, theo tha-ap541:23.1 đến 23.4; Đức Phật nói ngươi (27.1 đến 27.4) theo snp5.16:4.4.
  Tên phẩm Kaccāyanavagga dịch Phẩm Kaccāyana theo tha-ap533, 537, 539 và 541. :0.3 trong Pāli là Mogharājattheraapadāna, không bắt đầu bằng số nên bản Việt không có số thứ tự; translationTitle bằng đúng giá trị :0.3 (Ký Sự Về Trưởng Lão Mogharāja). Dạng tên bài theo đa số gần nhất (tha-ap500 đến tha-ap559: Ký Sự 34 so với Bài Kệ Tuyên Ngợ 15, 0 Tuyên Ngôn) và bốn bài cùng phẩm đều là Ký Sự Về; trên toàn lớp tha-ap hai dạng kia lại nhiều hơn (Tuyên Ngợ 255, Tuyên Ngôn 138, Ký Sự 135, Kinh Kệ 5, khác 2), hai phạm vi cho hai đa số khác nhau và chữ Tuyên Ngợ có vẻ là lỗi chính tả cần người biên tập phán một lượt cho cả cuốn. Lời kết 37.1 dùng nhóm nói những bài kệ này (531 khoá, theo imā gāthāyo là số nhiều; 2 khoá dạng số ít). Khoá 38.1 theo dạng Ký Sự Về Trưởng Lão X, thứ mười (dasamaṁ là thứ mười). Khoá 39.1 dạng Phẩm Kaccāyana là phẩm thứ năm mươi bốn (đa số 30 khoá là phẩm thứ, 11 khoá thứ, 10 khoá là thứ); catupaññāsamo là catu 4 cộng paññāsa 50 là 54. Khoá 40.1 Tóm tắt phẩm này theo tha-ap62, 82, 512, 522, 563 (39 trong 50). Khoá 41.1 và 41.2 hiểu thero đi với mahākappinasavhayo (vị Trưởng lão tên là Mahākappina), vì thero ở số ít; cách hiểu khác là thero thuộc Vakkali, nên chưa phân xử được; vasī ở 41.4 dịch bậc tự tại theo thag16.9:18.3, và không rõ vasī bổ nghĩa cho Koṭṭhika hay đứng riêng.
  Dấu lược: ba khoá …pe… (34.2, 35.2, 36.2) giữ đúng một …; không có (…) trần trong Pāli của bài này. Nháy: kép mở ở 1.1 và đóng ở 36.3 (35.3 không có nháy đóng, đúng Pāli); nháy đơn mở ở 11.3 và đóng ở 13.4, rồi mở ở 25.1 và đóng ở 26.4, mở ở 27.1 và đóng ở 28.2; đều khớp Pāli từng khoá, 0 lệch trên 156 khoá (3 cặp nháy đơn, 1 cặp nháy kép; 8 khoá có nháy). 26.4 thêm dấu hỏi trước nháy đóng vì kết thúc câu hỏi 26.3 (theo snp5.16:3.4); Pāli khoá này kết bằng dấu chấm. Đối chiếu 156 khoá với Pāli: đủ khoá, đúng thứ tự, NFC sạch, không khoá rỗng, không khoảng trắng thừa, chữ Pāli trong bản Việt chỉ là tên riêng (Padumuttara, Haṁsavatī, Upariṭṭha, Saccasena, Bāvarī, Gotama, Mogharāja, Kaccāyana, Kaccāna, Vakkali, Mahākappina, Dabba, Kumāra, Bāhiya, Koṭṭhika, Uruvelakassapa, Rādha), đơn vị ratana và chữ sāla. Có 7 nhóm Pāli trùng nguyên văn trong chính bài (2.4 và 6.4; 8.1 và 16.1; 15.2 và 20.2; 15.3 và 20.3; 26.4 và 28.2; 34.2, 35.2 và 36.2; 35.3 và 36.3), tổng 9 cặp, 1 cặp lệch có chủ ý: 26.4 và 28.2 (maccurājā na passati) khác ở chỗ 26.4 kết câu hỏi (để Thần chết không thấy được?) còn 28.2 là câu trả lời (Thần chết không thấy được); 35.3 và 36.3 chỉ khác nháy đóng, đúng theo Pāli. Đã đọc cặp Pāli với Việt của cả 156 khoá.
  Số Pāli, mỗi phép tính đã kiểm: satasahassa là sata 100 nhân sahassa 1.000 là 100.000, dịch một trăm ngàn ở 1.3 (kiếp) và vassasatasahassāni là một trăm ngàn năm ở 6.1; Ratanānaṭṭhapaññāsaṁ là aṭṭha 8 cộng paññāsa 50 là 58 ratana, giữ đơn vị ratana (như tha-ap539:5.1 và tha-ap541:5.1), không quy đổi; bāttiṁsa là ba mươi hai (5.4); tāvatiṁsa là Ba mươi ba (15.4 và 20.4); pañcasīla là năm giới (3.4); samasahassaṁ là sahassa 1.000, sama là năm, dịch một ngàn năm (16.3, xem bất định dưới đây); pañca jātisatāni là pañca 5 nhân sata 100 là năm trăm lần sinh (17.2 và 18.1); tīṇi gāthāsatāni là tīṇi 3 nhân sata 100 là ba trăm bài kệ (42.3) và bāsaṭṭhi là bā 2 cộng saṭṭhi 60 là 62 (42.4); dasamaṁ là mười (38.1); catupaññāsamo là 54 (39.1); catasso paṭisambhidā là bốn vô ngại giải (36.1). Không có cụm tiṁsakappasahassa nào cần phân xử; tiṁsa chỉ xuất hiện trong bāttiṁsa (32) và tāvatiṁsa (33). Lưu ý ngoài lát (không sửa): tha-ap512:12.1 dịch ekapaññāsamo (là 51) thành thứ năm mươi, nên rà lại thành năm mươi mốt.
  Bất định và lựa chọn cần người biên tập lưu ý: (1) 12.4 acalaṁ sālapiṇḍitaṁ dịch bất động như một khối cây sāla: sālapiṇḍita không có tiền lệ nào trong tầng (0 khoá), nên đây là cách hiểu có nghĩa chưa chắc (piṇḍita là khối, sāla là cây sāla; cũng có thể là một so sánh khác). (2) 13.2 saccasenassa bhikkhuno dịch vị tỳ-kheo Saccasena như tên riêng (0 tiền lệ); cách hiểu khác là một danh hiệu của vị đệ tử (có đạo quân chân thật); 13.4 vaṇṇasitāsayo dịch người có chí hướng nương vào lời tán dương vị ấy: vaṇṇa là lời tán dương, sita là nương vào, āsaya là chí hướng, 0 tiền lệ, chưa phân xử được. (3) 8.2 vasanto katabhūmiyaṁ dịch khi ở trên nền đất đã làm sẵn: katabhūmi là nền đã được chuẩn bị (cùng gốc với katabhūmikamma ở mil6.4.2), paṭikkamanasālā dịch nhà nghỉ vì không có tiền lệ trong tầng; 8.4 daḷhaṁ kaṇhāsi dịch đã đen sạm hẳn và giữ nguyên, không thêm chữ cháy. (4) 16.3 samasahassaṁ dịch một ngàn năm: sama hiểu là năm (samā), đơn vị năm là suy luận từ ngữ cảnh địa ngục, không có tiền lệ nào khác trong tầng (0 khoá). (5) 17.4 jātiyā lakkhaṇaṅkito dịch mang dấu ấn từ lúc sinh ra: lakkhaṇa là dấu hiệu, không rõ là dấu hiệu của bệnh hay một tướng khác, và không thêm chữ bệnh vì Pāli không nói; 17.2 và 18.1 là hai khoảng năm trăm lần sinh song song (17: làm người sinh trong gia đình tốt; 18: bị bệnh phong cùi giáng xuống), pañca jātisatāneva ở 18.1 dịch Cũng trong năm trăm lần sinh, eva hiểu là cũng, có thể là chỉ. (6) 19.2 Upariṭṭha viết như tên riêng theo thag16.9:19.4 (Upariṭṭha, bậc có danh tiếng); 19.3 thêm vị ấy làm tân ngữ của tappesiṁ vì Pāli để tân ngữ ở 19.2. (7) 21.3 và 21.4 ahaṁ ở khoá 21.3 được dịch ở khoá 21.4 (ta được trao vương quyền lớn) vì tiếng Việt không để ta cuối dòng; mahārajja dịch vương quyền lớn theo tha-ap549:19.1 (vương quốc lớn ở tha-ap420 và 518, 2 khoá). (8) 22.4 mogharājā là tên riêng nên giữ nguyên chữ Mogharāja, nghĩa moghaṁ rajjaṁ (vương quyền vô ích) chỉ ghi ở đây, không đưa vào thân kinh; tato dịch nên. (9) 25.3 diṭṭhiṁ no nābhijānāmi: chữ no không dịch, hiểu là tiểu từ nhấn (snp5.16:2.3 viết diṭṭhiṁ te nābhijānāti), cách hiểu khác là chúng con, chưa phân xử được. (10) 29.4 āsiṁ bhikkhu tathārahā dịch ta đã trở thành tỳ-kheo, và cũng là bậc A-la-hán: tathārahā hiểu là tathā cộng arahā (cũng là bậc A-la-hán), cách hiểu khác là xứng đáng như vậy; 0 tiền lệ. (11) 30.3 mā vihāro padussīti dịch để tu viện không bị ô uế, giữ nghĩa mục đích và không đặt nháy vì Pāli khoá này không có nháy (không đo riêng dạng ti cho bài này; đây là chỗ duy nhất của bài); vihāra dịch tu viện (tha-ap483:1.4 một khoá; trong bản Việt Trung Bộ chữ tu viện 124 lần so với 55 trú xứ và 12 tịnh xá, đếm thô, không giới hạn ở vihāra), saṅghika là của Tăng; vātarogehi dịch bệnh phong hàn theo thag5.8:1.1 và thag6.11:1.1 (2 khoá), khác với kuṭṭharoga dịch bệnh phong cùi theo mn75 (8 lần phong cùi). (12) 31.1 āhitvā không nêu tân ngữ trong Pāli, bản Việt giữ nhặt từ không thêm vải. (13) 33.3 Sikhīva anupādāno dịch như ngọn lửa không còn chấp thủ: anupādāna vừa là không nhiên liệu vừa là không chấp thủ; giữ chấp thủ theo thuật ngữ chung (tha-ap51:19.3 dịch không chấp thủ). (14) 9.2 catusaccapakāsako dịch bậc tuyên thuyết bốn chân lý theo tha-ap537:3.1 (trong tầng: bốn sự thật 5 khoá, bốn chân lý 4 khoá, hai số gần nhau). (15) 10.3 và 32.3 lūkhacīvaradhāra dịch mang y thô theo mn77:9.4 (y thô), saṅghāṭi dịch y tăng-già-lê theo mn77:9.4. (16) 11.3 purisakaṁ dịch người đàn ông, không giữ sắc thái nhỏ bé của hậu tố -ka; 11.4 kucelaṁ dịch y phục rách rưới, tanudehakaṁ dịch thân hình gầy gò (0 tiền lệ). (17) 24.4 vādisūdanaṁ dịch bậc đánh bại các nhà luận thuyết (0 tiền lệ); 28.4 tikicchako dịch bậc chữa trị (ja228). (18) 4.4 vasībhūtehi tādibhi: giữ như tha-ap539:4.4 và tha-ap541:4.4 (những vị đã tự tại, những bậc Vững Vàng). (19) 12.1 pītippasannavadanaṁ dịch gương mặt tươi sáng vì niềm hoan hỷ, 12.3 udaggatanujaṁ dịch lông trên thân dựng lên theo tha-ap537:8.2 (tanūruha). (20) 32.1 đến 32.2 tasmiṁ me guṇe bị chia qua hai khoá, giữ thứ tự Pāli nên me đứng ở khoá đầu (đối với điều ấy nơi ta) và guṇe ở khoá sau; mahābhisakko dịch bậc Đại Y Sư (0 tiền lệ).
