notes: |-
  Bản dịch chỉ từ Pāli root do commit đã ghim không có bản Anh upstream (giới hạn upstream).
  Đầy đủ 10 tiêu chí scorecard; status bắt buộc draft do blocker tầng tham khảo Anh; technical_integrity 9.6.
  **Sửa lỗi (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm.** `1.1`–`1.4`
  lệch đúng một khoá: `1.1` chỉ là stub *Bạch ngài Nāgasena, các ngài từng nói—*,
  `1.2` mang nội dung định nghĩa của `1.1`, `1.3` là stub *Nhưng các ngài lại nói—*
  và `1.4` mang danh sách tám cảnh giới của `1.3` nhưng bị cắt mất `āyuṁ`, `māsaṁ`,
  `nekkhammaṁ`. Đã viết lại bốn khoá (`bodhi` dịch *giác ngộ* chứ không phải *cội bồ-đề*).
  `status` vẫn `draft` vì blocker tầng tham khảo Anh ghi ở trên chưa gỡ.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (bản không phân đoạn, đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh). 11 điểm bất đồng nghĩa → sửa 7, giữ 2, bất định 2. Sửa: (1:1) `bodhi niyatā` trước *giác ngộ* → sau *cội bồ-đề*, vì mục này nằm trong danh sách những thứ cụ thể được định sẵn (cha mẹ, bodhi, đệ tử thượng thủ, con, thị giả) và `bodhi` ở Buddhavaṃsa (bv13:24.3 `bodhi tassa bhagavato`) là cây; `bujjhanaṁ` ở 1.4 mới là sự giác ngộ; (1:3) `tusite kāye ṭhito` trước *an trú trong thân mang thai* → sau *ở trong chúng chư thiên Đâu-suất* (`kāya` = nhóm, cùng cách dùng `tusitā kāyā` ở dn14:1.17.1; Pāli không nói đến thai); (1:3) `aṭṭha mahāvilokanāni` trước *tám cảnh giới lớn* → sau *tám điều lớn* mà Bồ-tát *quán xét* (`viloketi`, không phải cảnh giới); (3:1/3.2/3.4) `aṭṭhannaṁ` trước *tám hạng người* → sau *tám trường hợp* (trong tám có voi chúa, không phải người); (3:3) `tittha` trước *bến đỗ* → sau *chỗ lội qua* (người đánh xe, bến lội); `upasaṅkamitabbo` trước *đến chữa trị* → sau *đến gần người bệnh*; `uttarasetu` bỏ *cầu treo* (Pāli không nói treo); `anāgataṁ kālaṁ` trước bỏ sót chữ `anāgataṁ` → sau *thời gian chưa đến*. Giữ: (1:3) `nekkhammaṁ` *sự xuất gia* (bản nguyên bài dùng *xuất ly*, cùng nghĩa trong ngữ cảnh Đại Xuất Gia); (1:5–1:6) `uppajjāmi` *giáng sinh* (bản nguyên bài dùng *tái sanh*; Pāli nói chung là *sinh khởi*, cả hai đúng, và ở đây Bồ-tát từ trời Đâu-suất xuống). Bất định: (1:3) `māsaṁ viloketi` *tháng sanh* (Pāli chỉ nói *tháng*; bản nguyên bài chú thêm *thời gian trụ thai*, nên đây là cách hiểu truyền thống chứ không phải chữ của Pāli); (3:3) `anāgataṁ kālaṁ` của vị tỳ-kheo (không rõ *thời gian* là giờ được phép thọ thực hay thời điểm sắp tới nói chung; bản nguyên bài hiểu là thời gian thọ thực chưa trôi qua). Sửa thêm ngoài đối chiếu: lỗi chính tả *chín muồn* → *chín muồi* (1:4); thêm *cũng* cho `bhāsitampetaṁ` (1:1); `ubhatokoṭiko pañho` đổi *hai ngọn móc* → *hai đầu*, theo cách dịch của đa số trong tầng Milinda (khoảng 38 khoá dùng *hai đầu*). Đối chiếu đã làm ở bài này; technical gate (`npm run validate`, `npm test`, `npm run check`, `npm run build`) do người điều phối chạy.
