notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B12 — snp5.8:3.4, snp5.8:4.4, snp5.8:5.4, snp5.8:6.5, snp5.8:7.4 (`vata`/`sīlabbata`: bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”/“giới cấm”).

  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 7.2 ("Gotama đã khéo giảng về sự không chấp thủ" → "điều không còn sanh y đã được khéo giảng, thưa Gotama": `gotama` là hô cách trong hợp âm `gotama + anūpadhīkaṁ`, chủ ngữ của `sukittitaṁ` (quá khứ phân từ) là `anūpadhīkaṁ`; DPD `anūpadhīka` "free from attachment", lit. không có `upadhi`; lời giải Niddesa cnd8:86.4 giải `upadhi` là phiền não, uẩn, hành tạo tác; Sujato "You have expounded non-attachment well, Gotama"; khớp cnd8:84.2, cnd2:26.2 và snp5.5:9.2).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 2): giữ 6.7, 7.6 (`pariññāya` "liễu tri": B9 giữ "liễu tri" cho họ `pariññā`; bài không có `viditvā`/`vijaññaṁ`/`pajānāti` nào dịch "liễu tri").
