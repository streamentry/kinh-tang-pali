notes: |-
  **Phạm vi: đủ 320/320 khoá của cnd10, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Upasīva (Pārāyana, câu hỏi thứ sáu), tức bài kệ `snp5.7`. Cấu trúc như `cnd6`, `cnd12`, `cnd13`: dẫn từng đoạn kệ, giải từng cụm, rồi nhắc lại cả đoạn kệ. Kệ in đậm ở `1`, `10`, `18`, `25`, `32`, `37`, `43`, `49`; nhắc lại trong ngoặc kép ở `9`, `17`, `24`, `31`, `36`, `42`, `48`, `54`; kệ trích ở `6` không in đậm và không có nháy. Pāli có 122 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 30 khoá chứa `…pe…` (đều thành đúng một `…`) và 40 khoá chứa `…` trần (`11.5`–`11.44`, mỗi khoá một mục của chuỗi quán, giữ một `…` mỗi khoá), 0 khoá có `(…)`, 5 khoá kết `….` (`3.2`, `3.3`, `20.2`, `20.3`, `23.5`, đều viết ` ….`). 19 khoá có nháy kép, 12 khoá có ngoặc đơn, 0 khoá có nháy đơn; tất cả khớp Pāli từng khoá.

  **Cách trình bày lemma** theo `cnd13`, `cnd16`, `cnd18`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Giữ nguyên chữ Pāli ở `Iccā` (`3.2`, `20.2`, theo `cnd13:2.4`, `cnd14:7.8`, `cnd20:3.2`) vì lời giải nói về chính hình thức của từ ấy, và ở tên riêng `Upasīva`, `Verambhā` (`38.2`, theo `sn17.9:1.5`). Các khoá giải xưng hô (`3.1`–`3.5`, `13.1`–`13.4`, `20.1`–`20.5`, `27.1`–`27.4`, `38.5`–`38.8`, `50.3`–`50.5`) theo `cnd13:2.3`–`2.8`, `9.1`–`9.4`: *Tôn giả Upasīva nói*, *Này Upasīva, Đức Thế Tôn nói*. Dòng hô ngữ trong ngoặc `(upasīvāti bhagavā)` viết *(Này Upasīva, Đức Thế Tôn nói,)* theo `cnd13:7.2`, `cnd6:10.2`; `(iccāyasmā upasīvo)` viết *(Tôn giả Upasīva nói,)* theo `snp5.7:1.2`.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `cnd10`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; không có tệp `cnd10_translation-en-sujato.json` (chỉ có tệp `cnd-name`, là nhãn tác phẩm, không phải văn bản kinh); manifest chỉ khai `cnd10_root-pli-ms.json`. Lớp `english-project` không có `cnd10`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **94** khoá (104 nếu tính cả thẻ); Sujato phủ 0/94 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/94, `vietnamese-current` 0/94. `cnd10` chưa có entry trong `reference-gaps.yaml`; entry chỉ thừa nhận mất tầng chứ không cứu được `published`; việc chạy `npm run reference:gaps` để người điều phối làm. Bản Sujato của `snp5.7` (bài kệ trùng Pāli) đã được đọc để kiểm cách parse các dòng kệ (nó hiểu `Natthīti` là một nhận thức rằng không có gì, và hiểu `khittā` theo nghĩa bị quăng đi), nhưng đó là bản của **bài khác** nên không tính là đối chiếu English của cnd10. Chứng cứ độc lập còn lại là các bản đã dịch của `snp5.7`, `an3.116`, `ps3.9`, `mil7.8.7`, `mn102`, `sn17.9`, `dn15` và công thức chú giải ở `cnd6`, `cnd12`–`cnd18`, `cnd20`, `cnd21`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, khớp cả dấu câu) trùng nguyên văn với khoá đã dịch ngoài bài này: 118 khoá có ít nhất một khoá trùng (442 cặp); 74 khoá có bản Việt khớp nguyên văn một tiền lệ, 44 khoá khác. Nguồn dùng lại (một khoá có thể khớp nhiều nguồn): `cnd13` 34 khoá, `snp5.7` 31, `cnd6` 26, `cnd15` 25, `cnd16` 21, `cnd20` 20, `cnd14` 19, `cnd17` 17, `cnd18` 16, `cnd12` 13, `cnd21` 6, `ne5` 4. 44 khoá khác gồm: (i) `11.6`–`11.44` (31 khoá, mỗi khoá một mục của chuỗi quán như `gaṇḍato …`) trùng Pāli với `mil7.8.7:3.x`, nơi bản Việt mang *xem là …* vì câu dẫn của khoá ấy là *Phải luyện tập xem là …*; ở đây câu dẫn là `11.4` (*đang quán sát … là vô thường, là khổ …*) nên viết *là …*; chữ cho từng mục lấy từ `ps3.9:11.2` và `mil7.8.7:3.x`; (ii) `10.2`, `17.2`, `25.2`, `31.2`, `37.2`, `42.2`, `49.2`, `54.2` (trùng `snp5.7:2.2`, `4.2`, `6.2`, `8.2` *(Đức Thế Tôn trả lời:)*): bản ấy bỏ hô ngữ `upasīvā`, trong khi chính chú giải `13.2` giảng đó là tên Đức Thế Tôn gọi vị Bà-la-môn; viết *(Này Upasīva, Đức Thế Tôn nói,)* theo `cnd13:7.2`; (iii) `1.3`, `9.1`, `9.3` (trùng `snp5.7:1.1`, `1.3`): `snp5.7:1.1` mang *không nương tựa* của dòng hai và `snp5.7:1.3` mang *dòng lũ lớn* của dòng một, không khớp ranh giới dòng ở các lemma `2.1`, `4.1`, nên viết riêng (xem bất định 2); (iv) `10.3`, `17.3` (trùng `snp5.7:2.3`): bản ấy đặt *không có gì* trong nháy kép trong khi Pāli không có nháy, nên viết không nháy (xem bất định 6). Đo thêm bằng cách bỏ dấu câu và chữ hoa/thường: 161 khoá trùng (540 cặp), 109 khoá dùng lại, 52 khoá khác; ngoài các khoá trên có thêm tám khoá khác: `1.1`, `2.11`, `4.3` (như `snp5.7:1.1`, `1.3`), `13.4`, `27.4`, `38.8`, `50.5` (hô ngữ như nhóm (ii)), `14.5` (như `snp5.7:2.3`).

  **Trong chính bài:** 48 nhóm Pāli trùng nguyên văn (124 khoá, sau khi bỏ thẻ in đậm), cả 48 nhóm có bản Việt giống hệt từng chữ. Đo thêm bằng cách bỏ dấu câu, chữ hoa/thường và `ti` cuối: 53 nhóm (179 khoá), 0 nhóm khác về chữ. Mỗi kệ lặp hai lần mang cùng bản Việt (`1`/`9`, `10`/`17`, `18`/`24`, `25`/`31`, `32`/`36`, `37`/`42`, `43`/`48`, `49`/`54`), chỉ khác dấu nháy đầu và cuối theo Pāli từng khoá.

  **Thuật ngữ, kèm số đếm (phạm vi tầng).**
  - `ākiñcaññāyatana` → *Vô sở hữu xứ* theo `cnd18` (268 khoá chứa `ākiñcaññāyatan`: *vô sở hữu* viết thường 147 khoá, viết hoa 115 khoá); `ākiñcañña` ở kệ → *trạng thái không có gì* theo `snp5.7:2.1`, `cnd18:42.1`; `viññāṇañcāyatana` → *Thức vô biên xứ* theo `cnd18:16.5`; `ākiñcaññāyatanasamāpatti` → *sự chứng đạt Vô sở hữu xứ* theo `cnd18:16.2`; `heṭṭhimā cha samāpattiyo` → *sáu thiền chứng bên dưới* theo `cnd13:16.3`; `satta saññāsamāpattiyo` → *bảy sự chứng đạt có tưởng* (`an9.36:10.1`, `ne17:18.3`).
  - `satimā` → *người có niệm* ở lemma (419 khoá chứa `satimā`/`satimaṁ`: *có niệm* 280, *chánh niệm* 76) và *với chánh niệm* ở kệ theo `snp5.7:2.1`; `sato samāpajjitvā` → *có niệm chứng nhập* theo `cnd18:16.5`; `sati anussati paṭissati … sammāsati` → *niệm, tùy niệm, nhớ lại … chánh niệm* (`cnd17:27.3` có `sati anussati … sammāsati`; 0 khoá chứa `paṭissati` theo nghĩa này, xem bất định 17).
  - `adhimutto` → *nghiêng hẳn về* theo `cnd18:39.3`; `tanninno tappoṇo tappabbhāro` → *hướng về, nghiêng về, xuôi về* (`sn45.97:1.3`; 89 khoá chứa đủ bộ ba `-ninno … -poṇo … -pabbhāro`); `taggaruko` → *xem trọng* theo `cnd18:40.1`; `tadadhipateyyo` → *lấy điều ấy làm chủ đạo* theo `cnd18:39.3`; `aggo seṭṭho viseṭṭho pāmokkho uttamo pavaro` → *tối thượng, cao quý, thù thắng, đứng đầu, tối cao, ưu tú* theo `cnd14:23.3`; `parama` → *cao nhất* (xem bất định 3).
  - `kāmogha bhavogha diṭṭhogha avijjogha` → *dòng lũ dục, dòng lũ hữu, dòng lũ kiến, dòng lũ vô minh* theo `cnd16:4.5`; `tareyyaṁ uttareyyaṁ patareyyaṁ samatikkameyyaṁ vītivatteyyaṁ` → *vượt qua, vượt lên, vượt ra, vượt hẳn, vượt quá* theo `cnd12:13.5`; `atikkamitvā samatikkamitvā vītivattitvā` → *vượt khỏi, vượt hẳn, vượt quá* theo `cnd13:4.1`; `samantacakkhu` → *bậc nhìn khắp* theo `snp5.7:1.4`, `cnd13:18.4`; `sabbaññutañāṇaṁ` → *trí toàn tri* theo `cnd13:18.4` (21 khoá chứa `sabbaññutañāṇaṁ`).
  - `sakka` → *bậc Thích-ca*, `sakyakulā` → *dòng Sakya*, `dhana` → *tài sản*, và chuỗi mười hai tính từ ở `2.10` theo `cnd13:17.2`–`17.8` (lối chơi chữ `sakko` giữa *Sakya* và *có khả năng* không giữ được trong tiếng Việt, người đọc đối chiếu cột Pāli); `upeto samupeto upāgato samupāgato upapanno samupapanno samannāgato` → *đã đến gần, đã đến sát, đã tiến đến, đã tiến sát, đã hội đủ, đã hội đủ trọn vẹn, đã thành tựu* theo `cnd16:5.11`, `cnd6:11.9`.
  - `vītarāgo vigatarāgo cattarāgo vantarāgo muttarāgo pahīnarāgo paṭinissaṭṭharāgo` → *ly tham, đã hết tham, xả tham, nhả tham, thoát tham, đoạn tham, từ bỏ tham* theo `cnd15:4.11`, `cnd6:13.3`; `vikkhambhanato` → *do trấn áp* theo `ps3.4:7.2` (25 khoá chứa `vikkhambhan`); `sabbesu` → *đối với tất cả* và chuỗi `sabbena sabbaṁ … nissesaṁ` theo `cnd15:30.2`.
  - `kathaṅkathā` → *nghi hoặc*, `vicikicchā` → *hoài nghi*, `Dukkhe kaṅkhā … manovilekho` theo `cnd13:11.1`–`11.2`; `ārato virato paṭivirato` → *xa lìa, tránh xa, đã tránh xa* theo `cnd6:11.6`; `nikkhanto nissaṭo vippamutto visaññutto vimariyādikatena cetasā` → *đã thoát ra, đã xuất ly, đã giải thoát, không còn ràng buộc, với tâm không còn giới hạn* theo `cnd13:25.1`; `tiracchānakathā` → *chuyện tầm phào* (`dn2:52.3`, `dn1:1.17.3`); `vinodetvā byantīkaritvā anabhāvaṁ gametvā` → *trừ diệt, làm cho tiêu tan, đưa đến không còn* theo `an4.11:5.2` (69 khoá chứa `anabhāvaṁ gam`).
  - `pūgampi vassāni` → *dù cho đến vô số năm* theo `snp5.7:5.2` (đúng 1 khoá chứa `pūgampi`); `nicco dhuvo sassato avipariṇāmadhammo sassatisamaṁ tatheva tiṭṭheyya` → *thường hằng, bền vững, thường còn, không chịu biến hoại, tồn tại mãi như vậy* theo `dn24:2.18.15` (40 khoá chứa `sassatisamaṁ`); `anupādisesāya nibbānadhātuyā parinibbāyati` → *nhập Niết-bàn trong Niết-bàn giới không còn dư y* theo `cnd18:31.3`; `atthaṁ paleti na upeti saṅkhaṁ` → *đi đến chấm dứt, không thể tính đếm* theo `snp5.7:6.3`.
  - Chuỗi `11.4`–`11.45`: `rogato … sāsavato` theo `ps3.9:11.2` và `mil7.8.7:3.x` (*là bệnh, là ung nhọt, là mũi tên, là khốn khổ, là tật ách, là xa lạ, là tan rã, là tai ương, là tai nạn, là đáng sợ, là tai họa, là dao động, là dễ vỡ nát, là không bền vững, là không nơi che chở, là không nơi ẩn náu, là không nơi nương tựa, là trống vắng, là hư rỗng, là trống rỗng, là vô ngã, là nguy hại, là phải biến đổi, là không có cốt lõi, là gốc rễ của khốn khổ, là vô hữu, là hữu lậu, là hữu vi, là mồi của Ma, là phải sinh, là phải già, là phải bệnh, là phải chết*); `sokaparidevadukkhadomanassupāyāsadhammato` → *là phải chịu sầu, bi, khổ, ưu, não* theo `mn22:24.1`; `samudayadhammato` → *là có tính sinh khởi* theo `cnd6:28.2`; `atthaṅgamato`, `assādato`, `ādīnavato`, `nissaraṇato` → *là sự diệt tận, là vị ngọt, là nguy hại, là sự xuất ly* theo `mn102:25.2`; `cittacetasike dhamme` → *các pháp thuộc tâm và tâm sở* theo `cnd18:46.2`; `pekkhamāno dakkhamāno olokayamāno nijjhāyamāno upaparikkhamāno` → *đang nhìn, đang thấy, đang quan sát, đang ngắm kỹ, đang xem xét* theo `cnd20:25.5`.
  - `khattiyo brāhmaṇo vesso suddo` → *Sát-đế-lợi, Bà-la-môn, Phệ-sa, Thủ-đà* theo `mn93:18.63`, `mil5.1.5:11.13`; `rūpī arūpī saññī asaññī nevasaññīnāsaññī` → *có sắc, vô sắc, có tưởng, vô tưởng, phi tưởng phi phi tưởng* theo `cnd13:15.24`; `nerayiko tiracchānayoniko pettivisayiko` → *thuộc địa ngục, thuộc loài súc sinh, thuộc cõi ngạ quỷ* (0 khoá chứa `pettivisayik`); `rattoti vā … thāmagatoti vā` → *tham nhiễm, sân hận, si mê, bị trói buộc, bám chấp, tán loạn, chưa dứt khoát, đã ngấm sâu* theo `ps3.3:17.9` (1 khoá); `uddhacca` → *trạo cử*, `anusaya` → *tùy miên* theo `ps3.3:17.9`; `abhisaṅkhāra` → *hành tạo tác* theo `cnd18:43.1`; `hetu`, `paccaya`, `kāraṇa` → *nhân, duyên, lý do* (0 khoá chứa chuỗi `so hetu natthi paccayo natthi`).
  - `khandha āyatana dhātu`, `gati upapatti paṭisandhi bhava saṁsāra vaṭṭa` → *uẩn, xứ, giới*, *nẻo, sự tái sinh, sự kết sinh, hữu, luân hồi, vòng luân chuyển* theo `cnd20:16.4`; `vādapatha` → *đường lối ngôn từ* theo `snp5.7:8.5`; `adhivacana`, `nirutti` → *danh xưng*, *ngôn ngữ* theo `dn15:32.11`; `paññatti` → *sự chế định* theo `cnd6:3.6`, `cnd13:9.3` (không dùng *khái niệm* của `dn15:32.11` để khớp chuỗi `saṅkhā uddesa gaṇanā paññatti` ở `39.3`); `supaṇṇa` → *kim sí điểu* (tầng viết *kim sí điểu* ở hầu hết khoá chứa `supaṇṇ`).
  - Nhãn: `Cūḷaniddesa` → *Tiểu Tập Kể Lược*, `Pārāyanavagganiddesa` → *Kể Lược Phẩm Bờ Kia*, `Pucchāniddesa` → *Kể Lược Các Câu Hỏi*, tên bài và colophon theo `cnd13:0.1`–`0.4`, `27.3` (*niddesa* → *Kể Lược*; người biên tập có thể đổi hàng loạt khi chốt tên).

  **Số Pāli, kèm phép tính.** `dve kāmā` (`15.2`, `19.3`, `26.3`) = 2: *hai loại dục*, `15.3`–`15.5` nêu đúng hai (`vatthukāmā`, `kilesakāmā`); `heṭṭhimā cha samāpattiyo` (`21.2`, `28.2`) = 6: *sáu thiền chứng bên dưới*, Pāli chỉ nêu số, bản Việt không liệt kê; `satta saññāsamāpattiyo` (`22.1`, `29.1`) = 7: *bảy sự chứng đạt có tưởng*, không liệt kê; `saṭṭhikappasahassāni` (`30.2`, `33.1`) = saṭṭhi 60 × sahassa 1.000 = 60.000: *sáu mươi ngàn kiếp* (`an3.116:3.3` `Ākiñcaññāyatanūpagānaṁ … saṭṭhi kappasahassāni` → *sáu mươi nghìn kiếp*; `tha-ap402:16.1` `Saṭṭhi kappasahassāni` → *Sáu mươi ngàn kiếp*; trong các khoá chứa `sahass` tầng viết *ngàn* 1.055 khoá, *nghìn* 235 khoá, và 18/18 khoá `cnd` viết *ngàn*; xem bất định 10); `dvattiṁsāya tiracchānakathāya` (`15.11`) = dve 2 + tiṁsa 30 = 32: *ba mươi hai loại chuyện tầm phào*, không liệt kê; `cattāro ariyamaggā` (`40.6`) và `catunnaṁ ariyamaggānaṁ` (`40.7`) = 4: *bốn Thánh đạo*; bốn dòng lũ (`2.2`, `4.2`, `8.2`, `14.4`) = 4 Việt; năm động từ vượt (`2.2`, `4.2`, `8.2`, `14.4`) = 5 Việt; chín động từ lệnh ở `5.1` = 9 Việt, tám động từ ở `46.4` = 8 Việt; mười hai tính từ ở `2.10` (với `pahīnabhayabheravo` một cụm) = 12 cụm Việt; chuỗi ở `11.4`–`11.45` có 43 mục (hai mục ở `11.4`, 41 khoá `11.5`–`11.45`) = 43 mục Việt; chuỗi tài sản ở `2.7`–`2.8` chỉ nêu tám mục đầu (`saddhādhanaṁ` … `satipaṭṭhānadhanaṁ`), một `…`, rồi `nibbānadhanaṁ` (khác chuỗi mười sáu mục ở `cnd13:17.6`), bản Việt có đúng tám mục, `…`, và một mục cuối; tám hướng ở `39.3` (đông, tây, bắc, nam, trên, dưới, ngang, phụ) = 8 Việt; bốn danh từ `saṅkhaṁ uddesaṁ gaṇanaṁ paṇṇattiṁ` = 4 Việt; mười lăm loại gió ở `38.2` = 15 Việt, sáu phân từ ở `38.3` = 6 Việt; mười mục `-kkhaya` ở `16.5` = 10 và sáu động từ nhìn = 6 Việt; mười ba mục ở `41.4` = 13 Việt; tám mục ở `51.1` và tám mục ở `51.2` = 8 Việt mỗi khoá; mười mục ở `51.4` = 10 Việt, năm động từ nói = 5 Việt; mười danh từ và mười hai động từ ở `52.1` (sáu + năm + một cụm `ñāṇagginā daḍḍha`) = 10 và 12 Việt; mười một từ ở `22.2` từ `adhimutto` đến `tadadhipateyyo` = 11 vế Việt (vế đầu *nghiêng hẳn về* và mười vế sau). Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi`; cụm số cùng cấu tạo với `tiṁsakappasahassa` chỉ có `saṭṭhikappasahassāni`, xem bất định 10.

  **Bất định (không thêm vào thân kinh).**
  1. `2.2`, `4.2`, `8.2` `mahantaṁ kāmoghaṁ bhavoghaṁ diṭṭhoghaṁ avijjoghaṁ` → *dòng lũ lớn, tức dòng lũ dục, dòng lũ hữu, dòng lũ kiến, dòng lũ vô minh*: `mahantaṁ` đứng liền `kāmoghaṁ` nên về ngữ pháp có thể chỉ bổ nghĩa dòng lũ dục; chọn hiểu là bổ nghĩa cả bốn theo `snp5.7:1.3` (*dòng lũ lớn*). `2.2` ba mệnh đề `puggalo vā me dutiyo natthi, dhammo vā me dutiyo natthi, yaṁ vā puggalaṁ nissāya …`: lượt đầu dịch mệnh đề thứ ba như một mệnh đề quan hệ không có động từ chính, đọc lướt có thể thành nghĩa khẳng định; đã được phân xử ở lượt cải thiện 2026-10-13 (xem mục cuối): mệnh đề thứ ba nằm dưới `natthi` của hai mệnh đề trước, nên bản Việt nay nêu rõ phủ định.
  2. `1.1`, `1.3`, `2.1`, `4.1`, `4.2`, `9.x` `eko … anissito no visahāmi tārituṁ`: giữ đúng ranh giới dòng Pāli (*Con đơn độc, thưa bậc Thích-ca, dòng lũ lớn* / *không nương tựa, con không đủ sức vượt qua*) để các lemma `2.1`, `4.1` khớp; lệch với `snp5.7:1.1`, `1.3` (xem mục dùng lại tiền lệ). `no visahāmi na ussahāmi na sakkomi na paṭibalo` → *không đủ sức, không gắng nổi, không thể, không đủ khả năng*: 1 khoá chứa `visahāmi` (`snp5.7:1.3`, dịch *không thể*), 0 khoá chứa `na ussahāmi na sakkomi`; bốn từ gần nghĩa dịch khác nhau, sắc thái từng từ không có chứng cứ độc lập.
  3. `18.4`, `21.2`, `22.1`–`22.3`, `29.2`, `31.4` `Saññāvimokkhe paramedhimutto`: chú giải đọc `parame adhimutto` (*nghiêng hẳn về …* theo `cnd18:39.3`), khác `snp5.7:3.4` `parame vimutto` (*giải thoát trong sự giải thoát tối thượng của tưởng*). `parama` → *cao nhất* để không trùng *tối thượng* mà `cnd14:23.3` đã dành cho `agga`; sáu từ `aggo … pavaro` giữ nguyên cách dịch của `cnd14:23.3` (cùng Pāli). `adhimuttivimokkhena adhimutto` → *nghiêng hẳn về bằng sự giải thoát của sự nghiêng hẳn về*: dịch sát chữ, nghĩa kỹ thuật của `adhimuttivimokkha` chưa phân xử; `taccarito tabbahulo` → *sống theo điều ấy, thường xuyên với điều ấy*: 0 khoá chứa `taccarito`, `tabbahulo` (`an4.171:8.5` có `tabbahulavihārī` → *thường tu tập nơi đó*).
  4. `6.1`–`6.4`: `Na tassa adiṭṭhamidhatthi kiñci / atho aviññātamajānitabbaṁ` → *không có gì chưa được thấy / cũng không có gì chưa được nhận biết hay không thể biết*: 0 khoá chứa `na tassa adiṭṭham`; `ajānitabbaṁ` có thể là *không thể biết* hoặc *không cần biết*, chưa phân xử; `abhiññāsi` → *đều đã thắng tri* (aorist).
  5. `11.x`: `asaraṇībhūtato` → *là đã trở thành không nơi nương tựa* (0 khoá chứa); `bhavato` → *là hữu* (không có trong `ps3.9:11.2`, nơi chỉ có `vibhavato` → *là vô hữu*); `parato` → *là xa lạ* theo `ps3.9:11.2`, nghĩa *là cái khác, là ngoại lai* chưa phân xử; `11.27` và `11.44` cùng Pāli `ādīnavato …` nên cùng *là nguy hại*, dù `11.44` đứng trong bộ năm `samudaya … nissaraṇa` (`mn102:25.2` dịch *sự nguy hiểm*). `pekkhamāno` dịch *quán sát* ở `11.4` (theo kệ) nhưng *đang nhìn* ở `11.45` (theo chuỗi `cnd20:25.5`), vì chuỗi năm phân từ cần năm từ khác nhau.
  6. `10.3`, `14.1`–`14.5`, `17.3`: `Natthīti nissāya` → *nương vào ý nghĩ rằng không có gì*: Pāli không có nháy nên bản Việt không có nháy; `natthi kiñcīti ākiñcaññāyatanasamāpatti` (`14.1`, `14.2`) → *không có gì tức là sự chứng đạt Vô sở hữu xứ*, một câu định nghĩa đọc kém rõ hơn *Không có gì: là sự chứng đạt Vô sở hữu xứ* của `cnd18:16.2` vì ở đây không dùng được nháy; chọn *ý nghĩ rằng* để chỉ `iti`, theo cách `snp5.7:2.3` được đọc là một nhận thức. `14.4` `nissāya upanissāya ālambaṇaṁ karitvā` → *nương vào, nương cậy vào … lấy đó làm chỗ bám*.
  7. `5.1` `ārammaṇaṁ ālambaṇaṁ nissayaṁ upanissayaṁ` → *điểm tựa, chỗ bám, chỗ nương tựa, chỗ nương cậy*: 0 khoá chứa chuỗi bốn từ; `ālambaṇa` chủ yếu có trong tên phẩm `Ālambaṇadāyaka` (`tha-ap225`…). `11.3` `niyyānapathaṁ` → *con đường thoát ra* (0 khoá chứa `niyyānapath`; `niyyāna` → *xuất ly* ở `ps3.3:13.7`, *thoát ra* ở `pe9:31.2`).
  8. `15.1`–`15.12` `virato kathāhi`: chú giải đưa hai cách đọc, `kathāhi` là `kathaṅkathā` (nghi hoặc) hoặc `dvattiṁsāya tiracchānakathāya` (ba mươi hai loại chuyện tầm phào, không liệt kê); kệ giữ *chuyện trò* theo `snp5.7:2.4`. `15.9` ghép `Dukkhe kaṅkhā … manovilekho` với `kathaṅkathāya ārato …` bằng dấu chấm phẩy vì Pāli không có dấu câu giữa hai nửa.
  9. `23.2` `saṁsayapucchā vimatipucchā dveḷhakapucchā anekaṁsapucchā` → *câu hỏi do nghi ngờ, do hoài nghi, do phân vân, không dứt khoát* (0 khoá chứa cả bốn; `dveḷhaka` 1 khoá, `anekaṁsa` 1 khoá): sắc thái từng từ chưa phân xử. Bốn dạng hỏi `evaṁ nu kho, nanu kho, kiṁ nu kho, kathaṁ nu kho` dịch bằng *có phải vậy không, chẳng phải vậy sao, là gì vậy, như thế nào vậy* (theo `mn38:23.2`, `sn12.20:5.2`).
  10. `30.2`, `33.1` `saṭṭhikappasahassāni` → *sáu mươi ngàn kiếp*: cùng cấu tạo với `Tiṁsakappasahassa` mà brief của lát nêu là chưa phân xử (3.000 hay 300.000); ở đây chọn 60 × 1.000 = 60.000 vì ngữ cảnh là thọ lượng ở Vô sở hữu xứ và `an3.116:3.3` viết *sáu mươi nghìn kiếp*, nhưng chứng cứ độc lập là các khoá của chính tầng này, tầng Anh đã ghim không có bản nào cho `cnd10`.
  11. `23.5`, `30.4`, `33.3` `anānuyāyī aviccamāno avigacchamāno anantaradhāyamāno aparihāyamāno` → *không đi tiếp, không rời bỏ, không đi mất, không biến mất, không suy giảm*: 0 khoá chứa `aviccamāno`, `avigacchamāno`, `anantaradhāyamāno`, `aparihāyamāno`; nghĩa chọn theo gốc từ. `anānuyāyī` giữ *không đi tiếp* theo `snp5.7:3.5`. `arajjamāno adussamāno amuyhamāno akilissamāno` → *không nhiễm tham, không sân hận, không si mê, không bị ô nhiễm*: 0 tiền lệ.
  12. `34.1`, `34.2`, `32.2`, `36.2` `pūgampi vassāni` → *dù cho đến vô số năm* (theo `snp5.7:5.2`): chú giải `34.2` giảng bằng `bahūni vassāni … bahūni kappasatasahassāni` (*nhiều năm … nhiều trăm ngàn kiếp*), nên `pūga` có thể là *nhiều* hơn là *vô số*; giữ cách dịch của kệ để lemma khớp kệ.
  13. `35.2`–`35.4`: các cụm `caveyya ucchijjeyya nasseyya vinasseyya na bhaveyya` → *biến mất, bị cắt đứt, bị hủy hoại, bị tiêu vong, không còn hiện hữu* (0 khoá chứa `caveyya`, 1 khoá `ucchijjeyya`); `punabbhavapaṭisandhiviññāṇaṁ` → *thức kết sinh của tái hữu* (0 khoá chứa); Pāli đóng câu hỏi bằng `iti` nên bản Việt dùng *chăng*. `ākiñcaññāyatanaṁ samāpannassa` (`35.2`) → *người đã chứng nhập Vô sở hữu xứ*, `ākiñcaññāyatanaṁ upapannassa` (`35.4`, `35.5`) → *người đã sinh vào Vô sở hữu xứ*. `32.3`, `35.1`, `36.3` giữ chữ *Và* của `snp5.7:5.3` dù Pāli không có `ca`.
  14. `37.1`, `38.1`–`38.4` `khittā`: *bị sức gió thổi bạt* thay vì *bị gió mạnh thổi tắt* của `snp5.7:6.1`, vì chú giải `38.3` giảng `khittā ukkhittā nunnā paṇunnā khambhitā vikkhambhitā` (*bị ném đi, bị hất lên, bị xô đẩy, bị đẩy bật, bị chặn lại, bị đẩy lùi*, 0 tiền lệ cho cả sáu từ) là bị ném, bị đẩy chứ không là bị thổi tắt. `jālasikhā` → *chóp lửa cháy* (0 khoá chứa); `38.2` các loại gió `sarajā arajā` → *có bụi, không bụi*, `pakkhavātā` → *gió từ cánh*, `supaṇṇavātā` → *gió từ kim sí điểu*, `tālapaṇṇavātā` → *gió từ lá thốt nốt*, `vidhūpanavātā` → *gió từ cái quạt* (0 khoá chứa bốn từ cuối); `verambhavātā` → *gió Verambhā* theo `sn17.9:1.5`.
  15. `39.2`, `39.3`, `41.3` `atthaṁ paleti, atthaṁ gameti, atthaṁ gacchati`: ba cụm gần nghĩa dịch *đi đến chấm dứt, khiến đi đến chấm dứt, đi đến chỗ biến mất* (0 tiền lệ); `saṅkhaṁ uddesaṁ gaṇanaṁ paṇṇattiṁ` → *sự tính đếm, sự chỉ định, sự kể đếm, sự chế định* (0 khoá chứa chuỗi bốn từ); `vidisaṁ` → *phương phụ* theo `cnd20:23.1`; `39.3` đặt nháy quanh *đã đi về phương đông … phương phụ* theo Pāli và dịch `so hetu natthi …` là *không có nhân ấy, không có duyên ấy, không có lý do ấy để vị ấy có thể đi đến sự tính đếm*.
  16. `40.2`–`40.8`: `opammasampaṭipādanaṁ` → *sự áp dụng ví dụ* (0 khoá chứa); `tadaṅgaṁ samatikkamā vikkhambhanappahānena pahīno` (`40.5`) → *Do vượt qua theo từng chi phần ấy, vị ấy đã đoạn trừ bằng sự đoạn trừ do trấn áp*: Pāli không nêu cái bị đoạn trừ, `tadaṅga` → *từng chi phần* theo `ps3.4:6.3`; `bhavantaṁ āgamma` (`40.6`) → *nhờ đến với hữu*: 0 khoá chứa `bhavantaṁ āgamma`, nghĩa chưa chắc (có thể là *nhờ đến với sự hiện hữu*, hoặc một dạng khác của từ chỉ sự tu tập), không thêm chữ để làm rõ; `accantaanupādāvimokkhena` → *bằng sự giải thoát hoàn toàn không chấp thủ* (0 khoá chứa `accantaanupādā`; `anupādāvimokkho` → *giải thoát không chấp thủ* ở `mn102:25.2`); `mutto vimutto suvimutto` → *thoát khỏi, giải thoát, khéo giải thoát*.
  17. `12.1`–`12.3` `paṭissati` → *nhớ lại*: 0 khoá chứa chuỗi `sati anussati paṭissati`, 20 khoá chứa `paṭissati` đa số là `paṭissatimattāya` → *ghi nhận*; chọn *nhớ lại* để khác `anussati` → *tùy niệm*. `satimā` → *người có niệm* ở lemma nhưng *với chánh niệm* ở kệ (xem thuật ngữ); cùng một từ Pāli hai cách dịch trong bài, theo hai nguồn trùng Pāli.
  18. `51.1`–`51.5`, `49.3`, `54.3`: dùng *họ* ở kệ và ở các khoá giải (không dùng *vị ấy*) cho cùng một chủ ngữ `tassa` để nhất quán với `snp5.7:8.3`; trong khi `50.1`, `41.3` dùng *vị ấy* ở khoá có chủ ngữ rõ ràng. `51.2`, `51.4`: các mục `rattoti vā … thāmagatoti vā` và `nerayikoti vā … nevasaññīnāsaññīti vā` viết với *hay*, không thêm nháy vì Pāli không có.
  19. `52.1`, `53.2` `ūhatesu samūhatesu uddhatesu samuddhatesu uppāṭitesu samuppāṭitesu` → *gỡ bỏ, nhổ sạch, nhổ lên, nhổ bật hẳn, bứng, bứng hẳn*: chỉ `samūhata` có tiền lệ (*nhổ sạch*, 116 khoá chứa `samūhat`), 1 khoá chứa `uppāṭit`; sáu từ dịch khác nhau để giữ từng cặp; `vādā ca vādapathā ca` → *ngôn từ và các đường lối ngôn từ*.
  20. `55.1`–`55.2`: sau dấu lược `…pe…`, chủ ngữ của `nisinno hoti` và đối tượng của `namassamāno` không có trong Pāli của khoá; bản Việt viết *ngồi chắp tay đảnh lễ—* không thêm *vị ấy* hay *Đức Thế Tôn*. `55.1` `ye te brāhmaṇena saddhiṁ` → *những người cùng với vị Bà-la-môn ấy*, theo `cnd6:28.1`.
  21. `16.3`, `16.4` `Nattaṁ vuccati ratti`, `Aho ti divaso` → *Ban đêm: được gọi là đêm*, *Ngày: là ban ngày*: lời giải đồng nghĩa giữa hai từ Pāli mà tiếng Việt không phân biệt được; `16.5` sáu động từ nhìn `passa abhipassa dakkha olokaya nijjhāya upaparikkha` → *hãy thấy, hãy quán sát, hãy nhìn thấy, hãy quan sát, hãy ngắm kỹ, hãy xem xét* (0 khoá chứa `upaparikkhāti`, `abhipassa` ở 2 khoá khác).
  22. `19.8`, `26.8` `vikkhambhanato` → *do trấn áp*: ở đây là một trong năm cách đoạn trừ (`ps3.4:7.2`) nhưng Pāli của khoá không nêu danh sách năm cách.
  23. Lỗi ngoài lát, báo chứ không sửa: `snp5.7:6.1` (*bị gió mạnh thổi tắt* cho `Accī yathā vātavegena khittā`, xem bất định 14); `snp5.7:2.2`, `4.2`, `6.2`, `8.2` bỏ hô ngữ `upasīvā` (cùng kiểu `snp5.10:2.2`); `snp5.7:2.3` đặt nháy kép quanh *không có gì* trong khi Pāli không có nháy; `cnd16:5.11` (*đã thành tựu trí tuệ này, tuệ này*, lặp chữ *tuệ*, Pāli `imāya medhāya paññāya`).

