notes: |-
  Sửa lan 2026-10-13: khoá 3.3, 6.1, 6.2 (vo, tumhe, tumhākaṁ cùng bhikkhave), các ngươi → các ông, đồng bộ với ud2.2 (cùng Pāli ở 6.1 và 6.2); trong tầng, cùng Pāli ở các bài khác gần nhất dùng các ông hoặc các thầy. Pāli không có sắc thái khinh miệt; không đổi nghĩa.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud3.9:7.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud3.9:7.1 — `etamatthaṁ viditvā` trước dịch “sau khi
