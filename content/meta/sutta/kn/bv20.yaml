notes: |-
  Đợt 19, làn 73. Dịch từ Pāli root commit đã ghim, đủ 102/102 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ mười tám của Buddhavaṃsa, về Đức Phật Phussa: ba lần chứng ngộ và ba kỳ hội chúng, tiền thân Vijitāvī xuất gia và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và việc rải xá lợi. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn `bv28:0.1`, `bv29:0.1` (2/2 tiền lệ).
  - `0.2` “20. Dòng Kế Thừa Của Đức Phật Phussa”: `phussabuddhavaṁsa`; cùng chữ “Dòng Kế Thừa” với `0.1` và `26.1`, cùng khuôn với các phẩm anh em dịch trong đợt này. Phương án khác: “Phần Về Đức Phật Phussa”.
  - `26.1` “Dòng kế thừa của Đức Thế Tôn Phussa là thứ mười tám.”: `aṭṭhārasamo` = 18, khớp thứ tự phẩm (bv20 là phẩm thứ mười tám).

  **Số Pāli, đã tự tính.** `tayo` 3 (5.1 ba kỳ hội chúng khớp ba con số ở `6.1`, `6.3`, `7.1`; ba lần chứng ngộ khớp ba khoá `3.4`, `4.2`, `4.4` = thứ nhất, thứ hai, thứ ba; 15.4 ba lâu đài khớp ba tên ở 15.3). `koṭisatasahassa` = 1 koṭi × 100 × 1.000 = **một trăm ngàn koṭi** (3.3; cùng cách đọc với `bv18` và tiền lệ `mil5.1.3`). `navutisatasahassa` = 90 × 100 × 1.000 = **9.000.000 (chín triệu)** (4.1). `asītisatasahassa` = 80 × 100.000 = **8.000.000** (4.3). `saṭṭhisatasahassa` = 60 × 100.000 = **6.000.000** (6.1). `paññāsasatasahassa` = 50 × 100.000 = **5.000.000** (6.3). `cattārīsasatasahassa` = 40 × 100.000 = **4.000.000** (7.1). Cách đọc `X-sata-sahassa` thành “X triệu” (X × 100.000) có tiền lệ `mil5.5.3:6.1` (`aṭṭhasaṭṭhiyā … bhikkhusatasahassānaṁ` = 68 × 100.000, dịch “sáu triệu tám trăm nghìn”). `dvenavute` 2 + 90 = **92** (9.3). `navavassasahassa` 9 × 1.000 = **9.000 năm** (15.1). `tiṁsaitthisahassa` 30 × 1.000 = **30.000** người nữ (16.1; đây là đếm người nữ, không phải cụm `Tiṁsakappasahassa`). `caturo` 4 (17.1). `chamāsa` 6 + tháng = **sáu tháng** (17.3). `dasapāramī` 10 (11.4). `aṭṭhapaṇṇāsa` 8 + 50 = **58** ratana (22.1). `navutivassasahassa` 90 × 1.000 = **90.000 năm** (23.1). `aṭṭhārasamo` 18 (26.1). Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt hiện có (draft và published; so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 10 khoá của bài có Pāli trùng với khoá bài khác, tổng 64 cặp, trong đó 53 cặp có Việt khác bản tôi viết; 4 khoá dùng đúng nguyên văn một tiền lệ (`0.1`, `10.1`, `23.2`, `25.3`), thêm 2 khoá theo dạng đa số (`16.2` 3/5, `23.4` 2/3).
  - `0.1` 2 cặp, 0 khác. `10.1` “Sau khi nỗ lực tinh tấn,” 1 cặp, 0 khác (`tha-ap22:15.3`). `23.2` “là tuổi thọ lúc bấy giờ;” 1 cặp, 0 khác (`tha-ap26:5.2`). `25.3` “đã có việc xá lợi được rải rộng khắp,” 2 cặp, 0 khác (`bv29:1.3`, `bv29:18.1`); `25.4` theo `bv29:1.4` “ở những vùng này vùng nọ.” (1 cặp theo cùng Pāli `tesu tesu padesato`, đóng nháy kép theo Pāli). `16.2` “người nữ được trang sức đẹp đẽ;” 5 cặp, 3 giống, 2 khác ở `snp2.7`. `23.4` “vị ấy đã đưa đông đảo mọi người vượt qua.” 3 cặp, 2 giống (`bv28:2.4`, `bv28:8.4`), 1 khác (`tha-ap343:1.4`, “cứu vớt đông đảo chúng sanh”). `11.2` 2 cặp, 2 khác chỉ ở dấu cuối (tiền lệ kết `.`, Pāli ở đây kết `;`; câu giống). `14.1` 1 cặp, 1 khác: tiền lệ “Thành tên là Kāsika,”, bản này viết “Thành phố tên là Kāsika,” theo cách dịch `nagara` ở các phẩm cùng đợt.
  - `8.1` “Vào lúc ấy, ta,”: 3 cặp, 3 khác (hai tiền lệ “Vào lúc ấy tôi,”, một “Vào thời ấy, ta”); chọn “ta” vì người kể ở đây là Đức Phật Gotama, như các phẩm cùng đợt.
  - `9.3` **cố ý khác** 44/44 tiền lệ. Tiền lệ đều là người kể nhìn ngược về quá khứ (“Vào chín mươi hai kiếp trước”, 18; “… trước đây”, 10; “Từ chín mươi hai kiếp trước”, 9; còn lại các dạng gần). Ở `9.3`–`9.4` là lời thọ ký tương lai (`ayaṁ buddho bhavissati`), nên hướng đếm ngược lại: 92 kiếp **sau** thời Phussa là thời Gotama. Viết “Sau chín mươi hai kiếp nữa,”. Pāli ở `9.3` không có chữ chỉ hướng, hướng lấy từ động từ ở `9.4`.
  - Trùng trong chính bài: 2 nhóm Pāli trùng, mỗi nhóm 3 khoá, tổng 6 cặp. Nhóm `1.4`/`9.2`/`18.2` (`phusso lokagganāyako`): Việt giống hệt, chỉ khác dấu cuối theo Pāli từng khoá ⇒ 0 cặp khác nghĩa. Nhóm `5.2`/`14.4`/`19.4` (`phussassāpi mahesino`): `14.4` và `19.4` giống hệt (“của Phussa, bậc Đại Ẩn Sĩ.”); `5.2` **cố ý khác** (“cũng nơi Phussa, bậc Đại Ẩn Sĩ;”) vì ở đó `phussassāpi` đi với `sannipātā` (kỳ hội chúng xảy ra nơi Ngài) và giữ chữ “cũng” cho `-pi`, cùng cách dịch với `tassāpi` ở các phẩm anh em. ⇒ 2 cặp khác (5.2 với 14.4, 5.2 với 19.4).

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có của `kn`, trừ chính bài này).
  - `lokagganāyaka` → “bậc Dẫn Đạo tối thượng của thế gian”: 18 khoá chứa `lokagganāyak-`, “tối thượng” 12, “Đạo Sư” 8, “giáo chủ” và “Lãnh Đạo” là các dạng còn lại; `nāyaka` → “Dẫn Đạo” theo `bv28:2.2`, `bv28:8.2`. Giữ cả hai vế (`agga` → “tối thượng”).
  - `mahesi` → “Đại Ẩn Sĩ” (80 trên 113 khoá chứa `mahesi`; “Đại Hiền” 6, “Đại Tiên” 2). `khattiya` → “Sát-đế-lợi” (30 trên 51; “vua” 12). `jinavara` → “bậc Chiến Thắng tối thượng” theo `bv29:1.1` (8 khoá: “Chiến Thắng” 4, “tối thượng” 3). `aggasāvaka` → “đệ tử thượng thủ” (3 trên 5), `aggasāvikā` → “nữ đệ tử thượng thủ”, `aggupaṭṭhaka/-ikā` → “thị giả hàng đầu / nữ thị giả hàng đầu” (chưa có tiền lệ cho dạng này; dùng cùng chữ với `upaṭṭhāka` “thị giả” như các phẩm anh em). `satthā` → “bậc Đạo Sư”, `naruttama` → “tối thượng trong loài người”, `purisuttama` → “bậc tối thượng giữa loài người”, `mahāvīra` → “Đại Anh Hùng”, `migadāya` → “vườn nai”: cùng cách với `bv17`, `bv18` dịch trong đợt này.
  - `khīṇāsava` → “đã đoạn tận lậu hoặc”, `vimala` → “không cấu uế”, `santacitta` → “tâm an tịnh”, `tādī` → “bất động như vậy”: cùng chữ với `bv18`. `paṭisandhi` → “tái sinh” (`mil5.2.3:2.6`); `vocchinna` → “bị cắt đứt” (`upacchinna` “đã bị cắt đứt”, `tha-ap420:3.1`; không có tiền lệ cho dạng `vocchinna`). `anupādā` → “do không chấp thủ” (26 khoá chứa `anupādā/-āya/-āno`, đều dịch “không chấp thủ”).
  - `mahājaṭa` + `vijaṭeti` → “gỡ mớ rối lớn” (`mil5.1.3:2.4` dịch đúng “gỡ mớ rối lớn”). `amata` → “bất tử” (nước bất tử; chưa có tiền lệ cho `amatambu`). `tappayati` → “làm cho no đủ” (`tha-ap45:8.4`, `ja484:17.4`). `mahārajja` → “vương quốc lớn” (`tha-ap420:7.4`, `tha-ap518:4.4`; “ngôi vua lớn” `cp22`). `navaṅga satthusāsana` → “lời dạy chín phần của bậc Đạo Sư” (`mil7.2.7:2.1`: “Chín phần lời dạy của Đức Phật”). `jinasāsana` → “giáo pháp của bậc Chiến Thắng” (`thi-ap39:5.2`, `thi-ap39:10.2`). `pariyāpuṇati` → “học thuộc” (chỉ 1 tiền lệ: `ud4.8:13.1` “học thuộc”). `sobhayati` → “làm rạng rỡ” (`snp3.1:17.1`, `tha-ap42:2.3` dịch “làm đẹp”; ở đây hợp với `jinasāsana` hơn).
  - `pāramī` → “ba-la-mật”; `pāramiṁ gantvā` → “đạt ba-la-mật” (`cp35:11.3`, `cp35:12.3`, `cp35:13.3`: “Đã đạt ba-la-mật …”, 3/3). `abhiññā` → “thắng trí” theo `bv18`. `pasāda` → “tịnh tín” (20 trên 27 khoá chứa `pasādayiṁ`). `hatthiyāna` → “xe voi” (5/5 khoá chứa `hatthiyāna`). `pāsāda` → “lâu đài” (5 trên 27 khoá chứa `pāsāda`; “cung điện” 7, “cung” 7; chọn “lâu đài” theo `bv17`, `bv18` cho cùng công thức `tayo pāsādamuttamā`). `atrajo` → “người con ruột” (`cp7:1.2`). `janikā` → “người mẹ sinh ra”. `nimitta` → “dấu hiệu”. `nagara` → “thành phố”. `ratana` (đơn vị đo) giữ nguyên chữ Pāli, như `bv18`. `koṭi` giữ nguyên chữ Pāli.
  - `sataraṁsi` → “mặt trời trăm tia sáng” (`tha-ap126:2.4`: “tựa như mặt trời trăm tia sáng”). `uḷurāja pūrita` → “mặt trăng đã tròn đầy” (`tha-ap112:1.4`, dùng đúng nguyên văn).
  - Tên riêng giữ dạng Pāli có dấu: Phussa, Vijitāvī, Jayasena, Sirimā, Kisāgotamī, Anūpama, Surakkhita, Dhammasena, Sabhiya, Cālā, Upacālā, Dhanañcaya, Visākha, Padumā, Nāgā, Kāsika, Senārāma, Āmaṇḍa (cây Bồ-đề; tên cây, giữ nguyên; trái `āmaṇḍa` ở `tha-ap46:4.2`, `tha-ap531` cũng giữ nguyên), Garuḷapakkha, Haṁsa, Suvaṇṇabhāra (tên ba lâu đài), Maṇḍa (tên kiếp, như `bv17:1.1`).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `3.2` `phusse nakkhattamaṅgale`: tôi đọc `phusse` là chủ ngữ của `pavattente` (cả hai cùng định cách số ít giống đực; Ngài Phussa chuyển bánh xe), và `nakkhattamaṅgale` là trạng ngữ thời gian “vào lúc tinh tú cát tường”. Cách đọc khác: `phusse` là tên sao Phussa (Pusya), cụm này là “vào sao Phussa, tinh tú cát tường”. Không đủ chứng cứ độc lập (không có tiền lệ cho `nakkhattamaṅgala` trong tầng) nên dịch sát chữ, không giải thích thêm.
  2. `4.1`–`7.1` `-sata-sahassānaṁ`: các số 90/80/60/50/40 `sata-sahassa` chỉ có số (sở hữu cách), không có danh từ đi kèm (“vị”, “người”), và không có `koṭi` như ở `3.3`. Tôi đọc là 90 × 100.000 … (xem phần số), không thêm danh từ. Cách đọc khác: giống `3.3` (`koṭi` ngầm hiểu) sẽ ra số lớn hơn nhiều; Pāli không có `koṭi` ở các khoá này nên không dùng.
  3. `4.2`/`4.4` `dutiyābhisamayo`/`tatiyābhisamayo` “lần chứng ngộ”: cùng điểm yếu thuật ngữ như `abhisamaya` ở các phẩm anh em (so với “thông đạt”, “giác ngộ”).
  4. `7.3`–`7.4` `anupādā vimuttānaṁ vocchinnapaṭisandhinaṁ`: `anupādā` đọc là “do không chấp thủ” (bất biến từ, cùng nghĩa với `anupādāya`); `vocchinnapaṭisandhinaṁ` là bahubbīhi sở hữu cách “của những vị có sự tái sinh nối tiếp đã bị cắt đứt”. Hai cụm cùng bổ nghĩa cho các vị ở `5.3`–`5.4`.
  5. `8.2` `vijitāvī` đọc là tên riêng (cùng `nāma`), không phải tính từ “chiến thắng” như ở `tha-ap475:7.3` (không có `nāma` đi kèm ở đó).
  6. `10.2`–`10.3` `…pe…`, `hessāma sammukhā imaṁ’`: đoạn lược che mất phần giữa, nên không xác định được “chúng ta” là ai. Giữ một dấu `…` theo Pāli, dịch sát chữ `hessāma sammukhā imaṁ`, không thêm người nói; nháy đơn của lời thọ ký mở ở `9.3`, đóng ở `10.3` theo Pāli từng khoá.
  7. `12.1`–`12.2` `suttantaṁ vinayañcāpi, navaṅgaṁ satthusāsanaṁ`: đọc `navaṅgaṁ satthusāsanaṁ` là cụm đồng vị với `suttantaṁ vinayañca` (kinh và luật là lời dạy chín phần). Cách đọc khác: hai cụm tách rời (kinh, luật và, riêng ra, lời dạy chín phần). Không thêm chữ “tạng”.
  8. `13.2` `brahmaṁ bhāvetva bhāvanaṁ`: `brahmaṁ` đọc là tính từ “thuộc Phạm thiên”, bổ nghĩa cho `bhāvanaṁ`, khớp với đích `brahmalokamagañchahaṁ` ở `13.4`. Cách đọc khác: “sự tu tập cao thượng/tối thắng” (`brahma` làm tiền tố tăng nghĩa), hay là “các Phạm trú” (truyền thống chú giải). Pāli không nói “Phạm trú” nên không thêm.
  9. `15.3` `Garuḷapakkha haṁsa suvaṇṇabhārā`: đọc thành ba tên lâu đài Garuḷapakkha, Haṁsa, Suvaṇṇabhāra (khớp “ba” ở `15.4`), ba tên ở dạng gốc (nguyên âm cuối rút gọn theo vần). Cách đọc khác: `garuḷapakkha` “cánh Garuḷa”/“hình Garuḷa” là tính từ của lâu đài thứ nhất; vẫn là một tên với cách dịch hiện nay.
  10. `16.3`–`16.4` `sā nārī`, `atrajo`: Pāli không nói “vợ” hay “chính thất”; không thêm. `atrajo` dịch “người con ruột” như `cp7:1.2`, không thêm “trai”. `14.2` `khattiyo` không thêm “cha” (Pāli không gọi là cha): danh sách ở `14.1`–`14.4` chỉ nêu thành, vị Sát-đế-lợi và người mẹ.
  11. `19.3`, `20.2`, `21.2`, `21.4` `upaṭṭhāko`/`aggupaṭṭhakā/-ikā`: truyền thống chú giải hiểu các vị `aggupaṭṭhaka/-ikā` là những người hộ độ tại gia hàng đầu, khác `upaṭṭhāko` là vị thị giả. Pāli không nói tại gia hay xuất gia nên dịch cùng một chữ “thị giả”, thêm “nữ” cho số ít nữ. Nếu cần phân biệt, đổi “thị giả hàng đầu” thành “người hộ trì” (`ud2.8:9.2`, 2 khoá), nhưng đó là diễn giải.
  12. `22.1`–`22.2` `aṭṭhapaṇṇāsaratanaṁ … accuggato`: `ratana` ở đây là đơn vị chiều cao (hasta/khuỷ tay); giữ nguyên đơn vị, không quy đổi. `accuggato` dịch “cao vút” (`mil7.4.5:9.1` “núi nhô cao vút”), nghĩa đen “vươn cao vượt mức”.
  13. `22.3`–`22.4` `sataraṁsīva … uḷurājāva pūrito`: hai ví dụ dùng chữ gốc (“mặt trời trăm tia sáng”, “mặt trăng đã tròn đầy”), theo hai tiền lệ ở trên. Pāli không nêu tên `sūriya`/`canda`, nên “mặt trời”, “mặt trăng” là cách đọc truyền thống của hai ẩn dụ đã đóng khuôn.
  14. `25.1`–`25.4` `Dhātuvitthārikaṁ āsi, tesu tesu padesato`: giữ y chữ như `bv29:1.3`–`1.4`. `Senārāmamhi` giữ nguyên là danh từ riêng “Senārāma”; `ārāma` là “vườn/tu viện”, không tách để khỏi thêm nghĩa. `”ti` đóng lời; nháy mở ở `1.1`, nên cả bài là một lời kể, và lời thọ ký `9.3`–`10.3` nằm trong đó.
  15. `23.3` `Tāvatā tiṭṭhamāno so`: chủ ngữ `so` được đặt ở `23.4` “vị ấy đã đưa …” (dùng lại đúng nguyên văn `bv28:2.4`, `bv28:8.4`) để không lặp “vị ấy” hai khoá liền; không đổi nghĩa.

