notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja514_root-pli-ms.json` (175/175 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ; phần văn xuôi của Jātaka không nằm trong tầng Pāli đã ghim nên bối cảnh câu chuyện chỉ được suy từ chính các bài kệ.

  - Tầng tham khảo:
    Tầng English của Sujato không có ja514 (Sujato Jātaka chỉ có 83 tệp, trong đó không có uid này); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Tôi dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Tôi có xem thêm một bản Anh cũ phạm vi công cộng (H. T. Francis, E. B. Cowell biên tập, 1905) chỉ để xác nhận người nói ở từng bài kệ và gỡ vài chỗ khó (`14`, `35.3`, `34.4`); đó không phải tầng đã ghim, không được dùng làm bản đối chiếu độc lập, và không câu chữ nào được lấy từ đó. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
  - Coverage English:
    Mẫu số = 0. Không khoá Pāli nào của bài đạt ngưỡng 40 ký tự theo `source/layers.yaml` (khoá dài nhất 37 ký tự; bài toàn kệ ngắn, bỏ khối `:0`), nên cổng coverage không đo được gì; điều đó không có nghĩa là không cần ghi nhận gap. Sujato phủ 0/175 khoá, `english-project` 0/175, `vietnamese-current` 0/175.
  - Phân loại & tiêu đề:
    + `0.1` "Jātaka"; `0.2` "Bộ Ba Mươi Bài Kinh" (Tiṁsanipāta, tiṁsa = 30, dùng lại `ja513:0.2`); `0.3` "Phẩm Mong Muốn Gì" (Kiṁchandavagga, dùng lại nguyên văn `ja511`–`ja513:0.3`); `0.4` "4. Kinh Chaddanta" và `42.1` "Kinh Chaddanta, thứ tư." (catutthaṁ = 4, khớp số "4." ở `0.4`) theo khuôn "Kinh <Tên>" / "Kinh <Tên>, thứ n" của `ja513`. Tên Chaddanta (chha + danta, "sáu ngà") giữ nguyên làm tên riêng.
  - Người nói (Pāli không ghi tên; suy từ lời xưng hô và bối cảnh trong bài):
    + Vua xứ Kāsi: `1`, `3`, `5`, `13`; hoàng hậu Subhaddā: `2`, `4`, `6`, `9`–`12`, `14`, `16`–`17`; các thợ săn: `7`, `15` (và `8`, nhiều khả năng cũng là lời thợ săn hỏi phương hướng); người dẫn: `18`–`25`, `32`–`37.3`, `40`; voi chúa (Bồ-tát): `26`–`28`, `30`–`31`; người thợ săn trả lời voi: `29`; `37.4`–`39.4` là lời Đức Phật; `41` là lời Đức Phật kết nối tiền thân. Quy ước xưng hô: hoàng hậu xưng "thiếp", gọi vua "tâu đại vương"; vua xưng "ta", gọi hoàng hậu "nàng"; thợ săn xưng "chúng tôi/tôi"; voi chúa xưng "ta" khi nói với thợ săn đã ra tay, nhưng xưng "tôi" ở `28.4` khi còn hỏi nguyên do (đổi giọng theo từng khoá, không ép một dạng).
  - Pāli trùng nguyên văn:
    Dò Pāli của 175 khoá với toàn bộ Pāli đã ghim (mọi bộ): 14 khoá dài trên 12 ký tự có ít nhất một dạng trùng ở bài khác (`0.3`, `6.2`, `8.1`, `8.2`, `25.2`, `25.3`, `26.1`–`26.4`, `27.1`–`27.3`, `41.4`). Dùng lại nguyên văn bản Việt có sẵn ở 12 khoá: `0.3` (`ja511`–`ja513`), `6.2` (`ja409:7.2`), `8.1` (`snp5.17:3.1`), `25.2` (`mil5.5.6:2.2`), `26.1`–`26.4` (`dhp9`, `ja221:1`, `thag17.1:21`), `27.1`–`27.3` (`dhp10`, `thag17.1:22`), `41.4` (`ja441:15.6`); `27.4` dùng lại `thag17.1:22.4` và `dhp10` ("kẻ ấy thật xứng y cà-sa") chứ không theo `ja221:2.4` ("kẻ ấy hẳn là xứng y cà-sa") vì Pāli của `ja221:2.4` có `…rahatī”ti`. Cố ý khác ở 2 khoá: `8.2` (`snp5.17:3.2` viết "trên, dưới, và mười phương này"; ở đây "trên và dưới: đó là mười phương này", vì `uddhaṁ adho` là hai trong mười phương chứ không phải thêm vào mười) và `25.3` (`mil5.5.6:2.3` viết "Dù đang đau đớn tột cùng nhưng nhận thức liền khởi sanh"; Pāli chỉ có `dukkhena phuṭṭhassa`, không có "dù" hay "tột cùng"). Ngoài lát, chỉ báo, không sửa: `mil5.5.6:2.1` (cùng Pāli với `25.1`) viết "Khi chạm vào người thợ săn định giết mình", trong khi `vadhissaṁ` là ngôi thứ nhất "ta sẽ giết" của con voi; `mil5.5.6:2.4` bỏ `sabbhi` ("bởi người thiện").
    Trong chính bài: 7 nhóm Pāli trùng nguyên văn (`2.4` = `4.4`; `10.1` = `19.1`; `10.4` = `19.4`; `11.3` = `20.3`; `11.4` = `20.4`; `17.4` = `34.4`; `32.3` = `35.2` = `39.2`; `35.1` = `39.1`); bản Việt giống nhau ở cả 7 nhóm, không nhóm nào khác (các khoá gần trùng như `11.2`/`20.2`, `16.2`–`16.3`/`21.2`–`21.3` cũng được viết giống nhau).
  - Số Pāli:
    `catasso` + `catasso` (`8.1`) = 4 + 4 = 8 (bốn phương chính, bốn phương phụ), cộng `uddhaṁ adho` = 2 → `dasa disā` (`8.2`) = 10, khớp 4 + 4 + 2; `chabbisāṇa` (`6.3`, `7.2`, `8.4`, `11.1`, `13.5`, `20.1`) = cha 6 + visāṇa → "sáu ngà"; `satta` (`9.2`, `18.3`, `sattagirī`) = 7 → "bảy ngọn núi"; `aṭṭhasahassapāda` (`10.4`, `19.4`) = aṭṭha 8 × sahassa 1000 = 8.000 → "tám ngàn chân"; `aṭṭhasahassanāgā` (`11.3`, `20.3`) = 8 × 1000 = 8.000 → "tám ngàn con voi"; `pañca` (`14.4`, `gāmavarāni pañca`) = 5 → "năm làng"; `aṭṭha disā` (`24.4`, `33.2`) = 8 → "tám phương"; `tiṁsa` (`0.2`) = 30; `catutthaṁ` (`0.4`, `42.1`) = 4. Ở `30.1` `dantayugā` là "cặp ngà" (yuga = cặp), không có số đếm. Bài không có số đếm nào khác.
  - Thuật ngữ (có đếm trên tầng):
    + `mahārāja` (và `deva` vocative) → "tâu đại vương" (2.608 khoá có dạng `mahārāja` trong tầng; với `deva` vocative ở các ja đã dịch: 7/10 khoá đã viết "tâu đại vương"); `luddaka` → "thợ săn" (11/14 khoá ja); `samma` → "này bạn" (17), "bạn" (21), "bạn hiền" (5) trong 46 khoá ja; `pokkharaṇī` → "hồ sen" (5/6 khoá ja); `kāsāva` → "y cà-sa" (`dhp9`, `dhp10`, `ja221`, `thag17.1`); `nāgarājā` → "chúa voi" (`ja357:4.3`; không dùng "long vương" vì ở bài này `nāga` là voi, khác `ja441`); `gajuttama` → "thớt voi tối thắng" (`vv61:1.2`); `suvimuttacitta` → "tâm khéo giải thoát" (3/3 khoá); `visallo` → "đã nhổ mũi tên" (`snp2.13:9.3`); `vītasoko` → "không còn sầu muộn" (`ja352:7.2` và 4 khoá khác); `sayaṁ abhiññāya` → "tự mình thắng trí" (`dhp353:4`); `kālamakāsi` → "qua đời" (`snp2.12:2.3`); `katahattha` → "luyện tay thuần thục" (`ja510:7.1`); `rājaputtī`/`rājakaññā` → "công chúa" (cả hai; `ja519:17.2` "công chúa" cho `rājaputtī`), dù ở `2`–`6` bà đã là hoàng hậu (mahesī) của vua Kāsi; `mahesī` → "chánh hậu" (khác `devī` → "hoàng hậu"); `kimpurisa`, `kinnara` giữ nguyên như `ja485`; `dohaḷa` → "cơn thèm muốn" (không dùng "thèm nghén" của `tha-ap551:12.1` vì bài không nói đến thai nghén).
  - Chỗ bất định (không thêm vào thân kinh):
    + `40.1` `anāvasūraṁ`: không xác lập được nghĩa, bản Việt không dịch từ này (blocker `unresolvedTerm`); `cirarattasaṁsitaṁ` đọc "được tán thuật từ lâu", `uccāvacaṁ caritaṁ` "hành trạng cao thấp muôn vẻ".
    + `1.1` `uccaṅgi`: dịch "người dáng cao"; nghĩa sát chữ chưa tra được.
    + `3.2` `lokasmi nandane`: đọc `nandane` là tính từ chỉ định `lokasmiṁ` ("thế gian đầy hoan hỷ"); cách đọc khác là hô cách "hỡi người đem lại hoan hỷ".
    + `10.4`, `19.4` `pādaṁ` trong `aṭṭhasahassapādaṁ`: dịch sát chữ "tám ngàn chân" (có thể là rễ trụ hay thân phụ).
    + `14.1`–`14.2` `issitā`, `uddhañca sussāmi`: `issitā` đọc "ganh ghét"; `uddhaṁ` không giải được và không được dịch, bản Việt chỉ giữ phần chắc "thiếp khô héo vì cứ nhớ lại".
    + `17.2` `puṇḍarīkattacaṅgī`: "da như sen trắng" (tacaṅgī đọc là taca + aṅgī); `17.4`, `34.4` `sabbabhaddaṁ`: đọc là tính từ của chánh hậu ("cát tường trọn vẹn"), không coi là tên riêng; cách đọc "Sabbabhaddā" làm tên cũng được.
    + `22.3` `opātamāgacchi`: "đến cái hố bẫy" trong khi `23.1` mới nói đào hố; thứ tự sự kiện không được Pāli làm rõ. `22.4` `cittavasānugāya`: "người chạy theo ý muốn của tâm mình" (chỉ hoàng hậu).
    + `23.2`–`23.3` `attānamodhāya`, `passāgataṁ`: đọc "đặt mình cùng cây cung vào đó" và "thấy con voi đã đến"; `passa-` cũng có thể là "bên cạnh".
    + `24.3` `tiṇañca kaṭṭhañca raṇaṁ karontā`: "gây tiếng ầm ĩ giữa cỏ và gỗ"; nghĩa sát chữ chưa chắc.
    + `25.1` `parāmasanto`: không rõ tân ngữ; dịch "nó chạm tới", không nói chạm vào cái gì. `25.2` giữ nguyên `mil5.5.6:2.2`.
    + `29.3` `taṁ addasā`: đọc `taṁ` là "ngài" (hoàng hậu thấy con voi trong mộng).
    + `31.1`, `32.1` `kharaṁ`: dịch "cái cưa" (theo mạch cắt ngà); nghĩa thô của `khara` là "thô ráp".
    + `35.3` `suvaṇṇarājīhi samantamodare`: "với những vệt vàng làm hoan hỷ khắp xung quanh"; `modare` đọc là dạng của `mod-`, không chắc.
    + `37.4`–`38.1`: Pāli không đóng ngoặc lời các tỳ-kheo trước khi Đức Phật đáp; bản Việt giữ một đoạn lời thoại liền (mở ở `37.4`, đóng ở `39.4`). `37.4` là câu mở đầu lời đáp hay là lời hỏi của các tỳ-kheo thì không phân xử được; `37.4` không nêu tân ngữ của `pātukaronti` (nụ cười ở `37.2` là suy ra, không thêm vào).
    + `41.1` `vo`: tiểu từ "với các thầy", không dịch.
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 175/175, cùng thứ tự.
    2. Nháy đơn `‘’`, nháy kép `“”` và dấu lược `…` khớp Pāli từng khoá: 0/175 lệch (Pāli 0 `…`, Việt 0; nháy đơn chỉ ở `31.4`).
    3. Pāli trùng nguyên văn trong chính bài: 7 nhóm, xem trên; Việt khác 0 nhóm.
    4. Dấu lược `…pe…`/`(…)`: Pāli 0/175 khoá, Việt 0/175 (phép chạy rỗng).
    5. Số Pāli: xem trên.
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng (`Jātaka`, `Suvaṇṇapassa`, `Kāsi`, `Subhaddā`, `Devadatta`, `Chaddanta`, `kimpurisa`, `kinnara`). Đã in cặp Pāli↔Việt ra đọc toàn bài (175 cặp).
