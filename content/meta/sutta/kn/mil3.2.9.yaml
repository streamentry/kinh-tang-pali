notes: |-
  [MỤC NÀY BỊ THAY THẾ bởi mục "Giải quyết draft 2026-10-12" ở cuối: các nghĩa addhā → khoảng dài, kālaṅkatā → bảy hạng có thời hạn ấn định, hành tạo, hoàn tịch diệt độ đều đã bỏ.] THUẬT NGỮ MỚI (0 tiền lệ, đã tra, nay đã thay). addhā → khoảng thời gian, và ở các vế 1.8 đến 1.10 addhā chỉ quá khứ nên tôi dịch là quá khứ cho rõ. saṅkhārā → hành tạo. vipākadhammadhammā → pháp là pháp của quả. kālaṅkatā → có thời hạn ấn định (bảy hạng có hạn ngày, gồm địa ngục, ngạ quỷ, súi sinh, loài người, tộc tiên, thiên thần, phạm thiên). parinibbāta → hoàn tịch diệt độ (tầng đã có: Niết-bàn và hoàn toàn giải thoát ở nhiều bài; tôi dùng cụm này vì nó nêu đúng nghĩa không còn tự thân).

  BẢN CHẤT BÀI. Vua hỏi addhā nghĩa là gì; Trưởng lão trả lời quá khứ, vị lai, hiện tại đều là addhā, rồi phân ra có kẻ có kẻ không, và kết bằng bảy hạng kālaṅkatā. Tôi giữ đúng phép liệt kê của Pāli, không thu gọn, vì đây là ý chính của câu trả lời.

  HAI VẾ DÙNG LẠI. 1.1 Vua nói: theo đa số tầng. 2.1 Khéo lắm, thưa tôn giả Nāgasenā. theo 54 tệp mil. 5.1 Imasmiṁ vagge nava pañhā chưa có bản Việt nào trong tầng (chỉ trùng với mil6.1.9:12.1, cũng chưa dịch), nên tôi đặt mới theo đúng công thức Trong phẩm này có … câu hỏi. đã có ở mil3.4.10:5.1, mil6.2.10:5.1, mil3.1.16:6.1.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của kiểm cổ chỉ quét khoá Pāli từ 40 ký tự trở lên; ở bảy bài Jātaka của lát này mọi vế kệ đều ngắn hơn ngưỡng đó (vế dài nhất 35 ký tự) nên assertion về bản chất KHÔNG chạy. Tôi tự quét lại TOÀN BỘ 238 khoá của 14 bài từ tệp đã ghi trên đĩa: đủ khoá và không thừa so với Pāli (sắp theo thứ tự số), không rỗng, chuỗi NFC, số dấu lược khớp từng khoá, không có (…), không thừa dấu lược, và số dấu nháy kép so với Pāli từng khoá. Kết quả: 0 lỗi trên 238 khoá.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… hay dấu lược — đã kiểm bằng script trên từng khoá. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không mở rộng, không nén, không có (…) đứng một mình.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Tôi tự dựng chỉ mục Pāli↔Việt bằng script: nạp 5.764 tệp Pāli trong .cache/upstream/suttacentral/root/pli (bỏ *.apfs-orphan) và 4.136 tệp Việt dự án trong content/translation/vi/project/sutta — tổng 112.947 khoá Việt — ghép theo khoá, rồi quét từng khoá thân bài của lát theo nguyên văn căn thẳng và theo dạng đã chuẩn hoá dấu câu, nháy kép, hoa thường, và loại bỏ chính 14 tệp của lát để đo đúng trạng thái trước khi tôi ghi. Kết quả: 44 cặp Pāli trùng ở thân bài, 42 trùng byte-for-byte và 2 trùng sau chuẩn hoá. Trong đó 33 cặp đã có bản Việt ở bài khác, tôi DÙNG LẠI NGUYÊN VĂN ở: ja275 2.3, 2.4, 3.1, 3.2, 3.3, 3.4 ← ja274; ja294 3.1 ← sn1.1; mil3.1.11 3.2 và 3.3 ← sn10.12:5.2 và 5.3 (tôi lấy cả bộ bốn vế ở sn10.12:5.1–5.4 để bài này không tự mâu thuẫn với bài nguồn); Opammaṁ karohī ở mil3.1.11:2.1, mil3.1.14:2.1, mil3.1.15:2.1, mil3.2.2:2.1, mil3.5.10:2.1, mil3.7.16:2.1; mil3.1.14 3.1 ← mil3.1.12:3.1 và 3.5 ← mil3.1.12:3.4; Kallosi ở mil3.1.11:4.1, mil3.1.14:4.1, mil3.1.15:3.1, mil3.2.2:3.1, mil3.2.9:2.1, mil3.5.10:3.1 ← 54 tệp mil khác; mil3.2.2 2.4 ← mil3.5.9:2.3; mil3.5.10 6.1 ← mil3.4.10:5.1 và mil6.2.10:5.1; mil3.7.16 5.1 ← mil3.1.16:6.1. Mười một cặp còn lại thì chưa bản Việt nào ở bài khác có, tôi phải đặt mới: ja294 2.1 và 2.2, ja295 2.1 và 2.2 (bốn khoá này là hai cặp trùng nhau — chính bài trong lát đã trùng nhau; tôi đặt một lần rồi dùng lại nguyên văn cho cả hai bài), ja295 1.3 và 1.4 (trùng ja308:1.3 và 1.4), ja297 1.2 (trùng ja429:6.2 và ja430:6.2), ja298 1.2 (trùng sáu chỗ trong ja547), mil3.1.11 1.3 và 2.4 (trùng nhau, chỉ khác ở dấu nháy) và mil3.2.9 5.1 (trùng mil6.1.9:12.1). Ghi lại đây để lát sau dùng lại nguyên văn của tôi thay vì dịch lần hai.

  MỌI CÔNG THỨC HỘI THOẠI ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN. Rājā āha— → Vua nói: (đếm trong tầng mil có 30 tệp dùng Vua nói: và 12 tệp dùng Vua nói—, tôi theo đa số; 11 tệp còn lại dùng Vua nói:—). Thero āha— → Trưởng lão nói: (3 tệp dùng dạng có dấu hai chấm và 3 tệp dùng dạng có gạch nối, hòa nhau; tôi chọn dạng có dấu hai chấm để nhất quán với Vua nói: trong chính lát này). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā. (54 tệp mil, chỉ một cách). Opammaṁ karohī → Xin hãy xét một thí dụ ti. (đúng mil3.1.12:2.1, mil3.2.7:2.1, mil3.2.8:2.1). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa ti. (đúng mil3.1.12:3.1). Bhāsitampetaṁ, mahārāja, bhagavatā— → Điều này, này Đại vương, Đức Thế Tôn đã nói — (đúng mil3.1.12:3.4). Imasmiṁ vagge dasa pañhā và Imasmiṁ vagge soḷasa pañhā → Trong phẩm này có … câu hỏi. (đúng mil3.4.10:5.1, mil6.2.10:5.1, mil3.1.16:6.1). Rājā → vua, Mahārāja → Đại vương, bhagavā/bhagavatā → Đức Thế Tôn hoặc Đức Thật Chứng Ấy, Thero → Trưởng lão, Kāma → tình dục, sīla → đức hạnh.

  TÊN PHẨM ĐÃ CHỐT. Tikanipāta → Bộ Ba Bài Kinh (bốn bài lân cận đã có: ja276, ja291, ja292, ja293). Udapānavagga → Phẩm Nước Uống (đúng ja276 và ja279; tôi tự đếm bằng script trên Pāli gốc: 10 bài mang tên phẩm này là ja271..ja280, và ja275 nằm trong đúng khoảng đó). Kumbhavagga → Phẩm Bình Vò: tên này CHƯA có trong bảng chốt của BRIEF_VI3 §11, nên tôi theo đa số trong chính phẩm đang làm — ba bài đã có (ja291, ja292, ja293) đều dùng Phẩm Bình Vò; tôi tự đếm Kumbhavagga chiếm đúng ja291..ja300, trong đó lát này có sáu bài. Người biên tập nếu muốn chốt khác thì phải sửa cả mười bài cùng lúc. Các tên phẩm Milindapañha cũng theo đúng bầy bài lân cận: Mahāvagga → Đại Phẩm, Addhānavagga → Phẩm Khoảng Thời Gian, Buddhavagga → Phẩm Đức Phật, Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc.

  STATUS. Hai blocking error ở trên là thật và đo được (thiếu hẳn tầng Anh Sujato tại commit đã ghim; coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên mọi bài lát này đặt draft bất kể final_score. Tôi không nâng điểm để né blocker và cũng không hạ điểm để tỏ ra thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có tầng tham khảo nào.

  Giải quyết draft 2026-10-12. Đọc đối kháng lại từ Pāli: bản cũ sai nghĩa ở 9 trên 17 khoá (1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 1.10); tám khoá còn lại (0.1–0.3, 1.1, 2.1, 3.1, 4.1, 5.1) giữ nguyên. Các lỗi đã sửa: (1) addhā là khoảng thời gian (so dn28:15.6, dn16:2.2.2 và nhiều chỗ addhāna ở dn, đều dịch thời gian), bản cũ dịch nhầm thành khoảng dài, rồi 1.3 thành quá khứ là khoảng dài; (2) 1.2 dùng ngươi nói với bậc tôn giả: đếm các khoá mil có Thưa tôn giả Nāgasena kèm đại từ: 36 dùng ngài, 5 dùng ngươi, nên đổi sang ngài; hai bài láng giềng mil3.2.7 và mil3.2.8 còn ngươi, ngoài lát này; (3) 1.2 kimetaṁ addhānaṁ nāma là cái gọi là khoảng thời gian ấy là gì, không phải khoảng dài ấy được gọi là gì; (4) 1.4 phải lẽ là bịa, atthī là có; (5) 1.5 và 1.6 koci addhā atthi, koci natthi, katamo addhā: khoảng thời gian nào, bản cũ bỏ chủ ngữ và đọc thành có kẻ có kẻ không, thế nào là có; (6) 1.7 niruddhā là đã diệt chứ không phải ngăn lại, đếm 25 đã diệt trên 27 chỗ có niruddha ngắn trong tầng; vigatā là đã mất, bản cũ ghi tan rã; ye ca aññatra paṭisandhiṁ denti là những pháp đem lại tái sinh ở nơi khác, bản cũ cho ra quả bằng đường khác với sự tái sinh đảo hẳn nghĩa; vipākadhammadhammā là các pháp có tính chất cho quả (đọc từ cấu tạo hợp từ, không có bản tham khảo nào trong tầng ghim để đối chiếu); (7) 1.8 đến 1.10 là lỗi lớn nhất: bản cũ chèn bảy hạng ấy có thời hạn ấn định, hạng ấy KHÔNG có trong Pāli. kālaṅkatā chỉ là đã chết (tầng có 258 khoá chứa kālaṅkata, dn14, dn16, dn23, dn24 đều dịch đã khuất, qua đời, đã chết), và sattā là chúng sinh; đã bỏ toàn bộ chi tiết bảy hạng, bỏ cả lời giải thích trong notes cũ; (8) 1.10 parinibbutā dịch viên tịch theo đa số tầng mil (mil5.1.1, mil5.1.10, mil3.5.2: viên tịch; chỉ mil3.5.10 dùng hoàn tịch diệt độ, trong chính bài được đọc là Đức Thế Tôn nên không ép); parinibbutattā là vì đã viên tịch, bản cũ dịch thành từ lúc đã hoàn tịch diệt độ, đảo nghĩa nhân quả thành thời điểm. saṅkhārā là các hành, theo tiền lệ dn16:2.2 (các hành đã qua, đã diệt, đã biến đổi), không dùng hành tạo. Pāli 1.8 và 1.9 song song nhau (chỉ khác uppannā và anuppannā) và 1.10 bổ sung, nên bản Việt giữ đúng cấu trúc ba vế.

  Blocker đã gỡ: (B) coverage tầng Anh 0 trên 9 khoá, blocker do tác giả cũ đặt chứ không phải lỗi văn bản; mất mát đã được ghi nhận trong content/meta/reference-gaps.yaml (mục mil3.2.9, 0/9). Cả chín khoá thân bài đều đã đọc kỹ từ Pāli một mình, bài rất ngắn và cấu trúc song song, nên bản dịch tự đứng vững; triangulation giữ 6,5, không cao hơn. Blocker giữ: thiếu hẳn bản Anh Sujato tại commit đã ghim (sự thật về upstream). Tầng Việt hiện hành cũng không có cho bài này (tầng chỉ có Pháp Cú), giới hạn tham chiếu chứ không phải lỗi văn bản.

  Bất định còn lại: (a) vipākadhammadhammā là hợp từ khó, tôi dịch là những pháp có tính chất cho quả; (b) aññatra có thể là nơi khác hoặc đời khác, giữ ở nơi khác; (c) anuppannā ở 1.9 giữ không sinh ra, không thêm chưa; (d) sự khác nhau giữa chết mà không sinh ra nơi khác (1.9) và viên tịch (1.10) không được Pāli nói rõ, nên bản dịch không giải thích. Technical gate: bốn lệnh npm run validate, npm test, npm run check, npm run build chưa chạy ở lượt này, technical_integrity giữ 9,6. Điểm mới: terminology 8,6, grammar_logic 8,8, semantic_fidelity 8,9, vietnamese_clarity 9,0; trung bình 8,89.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 2 điểm bất đồng nghĩa trên 17 khoá → sửa 0, giữ 2, bất định 0. Giữ (`:0.2`, `:0.3`, `:1.2`–`:1.10`, `:3.1`, `:4.1`): bản nguyên bài dịch `addhā` là *hành trình*, dự án dịch *khoảng thời gian* — `addhā` mang cả nghĩa đường/chặng lẫn nghĩa thời gian, nhưng ở đây chính Pāli xếp `atīto addhā, anāgato addhā, paccuppanno addhā` (quá khứ, vị lai, hiện tại) và hỏi `dīghamaddhānaṁ`, tức thời gian; ba vế đó chỉ là ba thì nên *khoảng thời gian* đúng nghĩa, giữ. Giữ (`:1.7`): `ye dhammā vipākā` bản nguyên bài dịch *tạo quả*, dự án dịch *là quả*; `vipāka` là quả/dị thục, còn `vipākadhammadhammā` mới là pháp có tính chất cho quả (Pāli tách hai vế rõ), nên giữ cách phân vế của dự án. Phần còn lại khớp nghĩa: bốn hạng `atītā vigatā niruddhā vipariṇatā`, `aññatra paṭisandhiṁ denti`, hai hạng chúng sinh chết rồi sinh/không sinh nơi khác, hạng `parinibbutā`, và các số (`nava` = chín, `navamo` = thứ chín, `dutiyo` = thứ hai). Lượt review đối kháng không thấy lỗi nào cần sửa. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
