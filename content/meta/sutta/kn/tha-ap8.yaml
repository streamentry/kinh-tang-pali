notes: |-
  Dịch trực tiếp từ Pāli root tại commit đã ghim; đủ 626/626 khoá, đúng thứ tự Pāli, không có khoá ngoài Pāli. Bài dài (156 khổ kệ cộng khoá đề, khoá chia phần tụng 77.1, lời kết 157.1 và dòng chốt 158.1). Không có tầng Anh đã ghim cho tha-ap nên không có đối chiếu English độc lập; xem blocking_errors.
  Tiền lệ: dựng chỉ mục Pāli sang Việt trên các bài kn đã có (1.476 tệp, trừ ja, mil, ps; 49.659 dòng Pāli khác nhau; riêng tha-ap 560 tệp). 148 khoá của bài (không tính 0.1, 0.2, 0.3) có Pāli trùng nguyên văn với bài khác, tổng 3.700 cặp tiền lệ (903 cặp trong đó có bản Việt khác bản chọn, phần lớn do ta hay tôi, nhãn hiệu hoa thường, hoặc cách dịch thiểu số). 131 khoá dùng lại nguyên văn một bản Việt đã có (kể cả khi chỉ khác hoa thường đầu câu ở 6.4 và 8.2, bậc Có Mắt theo 9 tiền lệ khác), 17 khoá khác tiền lệ, đều có lý do: 1.2 (tiền lệ là câu có ta ở dòng trước, ở đây không có chủ ngữ nên viết có vị Bà-la-môn); 21.4, 22.4, 23.4, 31.2, 113.1, 114.4, 153.1 (chỉ đổi ta thành tôi vì vị trưởng lão tự thuật xưng tôi suốt bài, như tha-ap4, tha-ap5, tha-ap12; 31.2 thêm tân ngữ Ngài vì nisinnaṁ là tân ngữ chung); 22.1 (tiền lệ pv26 đọc kūṭāgāre, pāsāde là trạng ngữ trong lầu gác và lâu đài; ở đây là tân ngữ của katvā nên viết thành danh sách công trình); 29.2 (tiền lệ ghi đối với, ở đây là sở hữu cách của adhivāsana nên viết của); 30.2 (tiền lệ ghi bậc Lãnh Đạo; nāyaka trên tha-ap là Dẫn Đạo ở 12 khoá, Lãnh Đạo 1 khoá); 33.3 (ahaṁ có mặt ở Pāli nên thêm tôi); 94.3 (sở hữu cách nên viết của; hai tiền lệ ghi Trong và Đối với tuỳ câu); 106.1 (tiền lệ bỏ yāvatā, ở đây giữ rộng đến đâu theo 9.3); 108.2 (5 tiền lệ bv ghi bậc Đạo Sư; satthā trên tha-ap là bậc Thầy, và bài này dùng bậc Thầy ở 13.4, 14.4, 83.4, 152.4 nên giữ bậc Thầy cho nhất quán trong bài); 112.1 (tiền lệ tha-ap78:7.1 ghi Từ kiếp thứ hai về sau, nhưng ở đó và ở đây đều là quá khứ; viết Ở kiếp thứ hai kể từ kiếp này theo cách đếm thứ tự trong chính Pāli); 138.3 (tiền lệ ghi Nhờ việc làm ấy vì quả lành; ở đây là quả của việc khinh bậc Tự Tại nên viết Do nghiệp ấy).
  Trong chính bài có 23 nhóm Pāli trùng nguyên văn (55 khoá). 22 nhóm có bản Việt giống hệt nhau; 1 nhóm khác có chủ ý: 36.3 và 37.3 (Chúng sẽ luôn luôn vây quanh người này, nói về voi ngựa xe và nhạc cụ) với 39.3 (Họ sẽ luôn luôn vây quanh người này, nói về các người nữ ở 38.2). Hai tiền lệ cùng Pāli dùng cả Chúng (4) lẫn Họ (1). Các khổ 13 và 43 giống hệt (Kappasatasahassamhi...), khổ 14 và 44 chỉ khác ở dòng 3 (14.3 Puṇṇa con nhà Mantāṇi, 44.3 Upāli); 47.1 và 78.1, 67.1, 74.1, 110.1 dùng cùng một cách dịch.
  Tên bài và tên phẩm. 0.3 và translationTitle là cùng một chuỗi, Bài Kệ Tuyên Ngôn Về Trưởng Lão Upāli. Pāli ở 0.3 (Upālittheraapadāna) không bắt đầu bằng số nên bản Việt không thêm số thứ tự. Kiểu mở đầu tên: đo ở phạm vi gần nhất (phẩm Phật, tha-ap1 đến tha-ap13, 11 tệp đã có) là Tuyên Ngôn 10, Tuyên Ngợ 1; ở phạm vi tha-ap1 đến tha-ap60 (58 tệp) là Tuyên Ngôn 35, Tuyên Ngợ 20, Ký Sự 3; đo toàn nhóm tha-ap (560 tệp) là Tuyên Ngợ 255, Ký Sự 156, Tuyên Ngôn 142, Kinh Kệ 5 và 2 tên khác. Hai phạm vi cho hai đa số khác nhau: bài này theo đa số gần (Tuyên Ngôn), vì Tuyên Ngợ là chính tả sai; người biên tập nên phán một lượt cho cả cuốn. 0.1 giữ Therāpadāna (549 trên 560 tiền lệ, 9 tiền lệ ghi Trưởng Lão Ký Sự). 0.2 là Phẩm Phật (10 trên 10 tiền lệ cùng Pāli Buddhavagga). 77.1 Dutiyabhāṇavāraṁ dịch Phần tụng đọc thứ hai theo khuôn Phần tụng đọc thứ N đã có ở các khoá cùng dạng. 158.1 dịch Bài Kệ Tuyên Ngôn Về Trưởng Lão Upāli, thứ sáu (chaṭṭhaṁ là thứ sáu), theo khuôn tha-ap4:25.1, tha-ap5:25.1, tha-ap6:15.1, tha-ap10:17.1.
  157.1 công thức lời kết: dùng nhóm Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (imā gāthāyo là số nhiều), như tha-ap4, tha-ap5, tha-ap6, tha-ap10, tha-ap12, tha-ap43; không dùng dạng số ít đã từng nói bài kệ này.
  Số Pāli, mọi phép tính tự làm: asītikoṭi (1.3) = asīti 80 + koṭi, nên tám mươi koṭi (giữ nguyên koṭi theo 3 tiền lệ Sau khi bỏ lại tám mươi koṭi); koṭisatasahassānaṁ (10.3) = koṭi + sata 100 × sahassa 1000 = một trăm ngàn koṭi (21 trên 23 tiền lệ ghi Của một trăm ngàn koṭi); sattarattindivaṁ (11.1) = satta 7, nên bảy đêm ngày; aṭṭhame divase (11.3) = ngày thứ tám; kappasatasahassamhi (13.1, 43.1) = sata 100 × sahassa 1000 = một trăm ngàn kiếp, dịch Sau một trăm ngàn kiếp nữa theo lời thọ ký tương lai (8 tiền lệ Sau một trăm ngàn kiếp nữa; 5 tiền lệ Vào một trăm ngàn kiếp nữa); satasahassena (21.3, 26.1, 32.1) = một trăm ngàn, không nêu đơn vị tiền vì Pāli không nêu; saṭṭhi (37.1) = 60, nên sáu mươi ngàn nhạc cụ; chaḷasīti (38.1) = cha 6 + asīti 80 = 86, nên tám mươi sáu ngàn (khớp 4 tiền lệ cùng Pāli); tiṁsakappasahassāni (40.1) = tiṁsa 30 × sahassa 1000 = ba mươi ngàn kiếp (khớp 13 tiền lệ cùng Pāli: ba mươi ngàn 7, ba mươi nghìn 6; theo chỉ dẫn của người điều phối tiṁsa là 30, không phải 3); sahassakkhattuṁ (40.3, 42.1) = một ngàn lần; yojanasataṁ (61.3) = sata 100, nên một trăm do-tuần (6 tiền lệ Khắp chung quanh một trăm do-tuần); vassasahassena (65.3) = một ngàn năm; satasahassupādāya (67.1, 74.1, 110.1) và aparimeyyupādāya (47.1, 78.1): xem bất định số 9; pañcame (80.2) = thứ năm; navaṅgaṁ (98.3, 108.2) = nava 9 + aṅga, nên chín phần (5 tiền lệ lời dạy chín phần); dutiyake (112.1) = thứ hai; nāgasatasahassāni (114.1) = hàng trăm ngàn con voi (số nhiều của satasahassa, không phải đúng một trăm ngàn); tiyojanasahassamhi (126.1) = ti 3 + yojana + sahassa 1000 = ba ngàn do-tuần, theo mẫu caturāsītiyojanasahassāni (84 ngàn do-tuần) ở mnd14:50.2; sattadivasā (123.3) = bảy ngày; kappakoṭimhi (143.4) = một koṭi kiếp; tayo aggī, tihaggibhi (136.2, 136.3, 50.2) = ba ngọn lửa; tiṇṇaṁ vedāna (2.2) = ba Veda; tidhāpabhinnā (114.3) = chảy dịch ở ba nơi; catusaccaṁ (10.1) = bốn chân lý; caturaṅginī (36.2) = bốn binh chủng; caturo phale (76.3) = bốn quả; catasso (156.1) = 4; aṭṭhime (156.2) = 8; chaḷabhiññā (156.3) = 6; tisso vijjā (155.3) = 3; chaṭṭhaṁ (158.1) = thứ sáu; ekasikhā (3.1) = một chỏm tóc; ekaṁ phalaṁ (65.4) = một trái; ekaccāna, eke (140) = một số. Không có lỗi số học nào được phát hiện lúc rà lại cặp Pāli với Việt.
  Thuật ngữ và số đếm (tầng kn đã có): lậu hoặc cho āsava; vô ngại giải, tám giải thoát, sáu thắng trí, lời dạy của Đức Phật (156.1 đến 156.4, 543, 61, 69, 504 tiền lệ cùng Pāli); Ba minh đã chứng đắc (155.3, 18 tiền lệ); đạo sĩ khổ hạnh cho tāpaso; Dẫn Đạo cho nāyaka (12 khoá, Lãnh Đạo 1 khoá); bậc Có Mắt cho cakkhumā (9 tiền lệ ghi bậc Có Mắt, 7 tiền lệ ghi bậc Hữu Nhãn; chọn Có Mắt cho nhất quán với 27.4); Đại Anh Hùng cho mahāvīra; Đại Ẩn Sĩ cho mahesi; Tự Tại cho sayambhū; bậc Chiến Thắng cho jina; Đức Chánh Đẳng Giác cho sambuddha; Sát-đế-lợi cho khattiya (83 khoá có khattiyo trong dòng ngắn: Sát-đế-lợi hay Sát-đế-lý 66, vua 4, dạng khác 13); ngoại đạo cho titthiya (mọi tiền lệ); nhiệt não cho pariḷāha (5 trên 8 tiền lệ); cơ hội cho khaṇa (tiền lệ khaṇo me paṭipādito là cơ hội đã được đem đến cho tôi); bất động cho tādī (tha-ap24:36.2, bv13:7.4); tịnh xá cho ārāma và saṅghārāma (tịnh xá 6, tu viện 5 trên tha-ap; chọn tịnh xá, chỉ để Tăng đoàn khi nói đến saṅgha); Niệm xứ cho satipaṭṭhāna; Như ý túc cho iddhipāda; Abhidhamma giữ nguyên (2 tiền lệ); Khandhaka giữ nguyên tên (0 tiền lệ); Chuyển Luân Vương cho cakkavattī; quỷ cho bhūta (nghĩa này không có tiền lệ; tha-ap2 dịch bhūta là chúng sinh ở nghĩa khác); ba ngọn lửa cho tayo aggī.
  BẤT ĐỊNH (không thêm vào thân kinh): (1) 1.2 sujāto nāma brāhmaṇo: Pāli không có ahaṁ, nhưng 4.2 brāhmaṇo vissuto iti và 5.2 mānatthaddho ahaṁ cho thấy Sujāta là vị trưởng lão ở đời trước; dịch trung tính có vị Bà-la-môn, không thêm tôi là. (2) 3.1 và 3.2 paribbājā ekasikhā, gotamā buddhasāvakā: gotamā đọc là hạng tu sĩ mang tên Gotama, buddhasāvakā dịch đệ tử của Phật dù 5.3 nói chưa có tiếng Phật; chưa phân xử được; carakā giữ nguyên tên Caraka vì không có tiền lệ. (3) 5.3 Buddhoti vacanaṁ: bỏ dấu ti và không dùng ngoặc, theo phe bỏ trong tầng, và vì Pāli chỉ mở nháy kép ở 1.1 và đóng ở 156.4. (4) 10.1 và 10.2 catusaccaṁ pakāsente, seṭṭhe ca pupphamaṇḍape: đọc seṭṭhe là bậc tối thượng (đang tuyên thuyết) đang ở trong mái che hoa; cách đọc khác là mái che hoa tuyệt hảo. (5) 17.4 yathā passāmi gotamaṁ: dịch sát chữ như tôi thấy Gotama; cách đọc khác là để tôi được thấy Gotama (yathā chỉ mục đích) hoặc như tôi thấy nơi Gotama; chưa phân xử được. (6) 19.2 sabbapāṭhissa sāsane: dịch trong giáo pháp của bậc thông tụng tất cả; không rõ sabbapāṭhī chỉ Đức Padumuttara hay vị tụng nào; không thêm. (7) 21.2 puratthato: dịch ở phía đông của thành; cách đọc khác là ở phía trước thành. (8) 22.1 đến 23.2 và 24: kūṭāgāre, pāsāde, maṇḍape, hammiye, guhā, caṅkame đọc là tân ngữ của katvā và māpayitvā; jantāghara dịch nhà tắm hơi, aggisālā dịch nhà sưởi ấm (theo tiền lệ aggisālaṁ), udakamāḷaka dịch nhà chứa nước (không có tiền lệ), nhānaghara là nhà tắm; ārāmika dịch người phục vụ tịnh xá theo tiền lệ người phục vụ vườn tu viện. (9) Đơn vị kiếp: satasahassupādāya (67.1, 74.1, 110.1) và aparimeyyupādāya (47.1, 78.1) không nêu đơn vị trong Pāli; dịch kể từ một trăm ngàn kiếp trở lại và kể từ vô lượng kiếp trở lại, bổ sung đơn vị kiếp theo ngữ cảnh (13.1, 43.1: sau một trăm ngàn kiếp nữa Gotama xuất hiện) và theo tiền lệ Catunnavutupādāya (Kể từ kiếp thứ chín mươi tư trở lại); đây là chỗ bổ sung đơn vị duy nhất trong bài, cần người biên tập xác nhận. (10) 51.1 visādo puriso: đọc là người trúng độc; cách đọc khác là người nản chí (visāda); 53.2 visahato naro dịch như người bị chất độc làm hại. (11) 54.4 sabbasallavinodanaṁ: dịch nhổ trừ mọi mũi tên; salla theo tiền lệ mũi tên (38 trên 67 khoá có Pāli này trong tầng kn đã dò). (12) 62.2 adhosīsaṁ viheṭhayaṁ: đọc là treo ngược đầu và hành hạ. (13) 76.4 Dhammevaṁ vijanayiṁ ahaṁ: vijanayiṁ đọc là janeti (làm cho phát sinh), không phải vijānāti (nhận biết); không có tiền lệ cho dạng này. (14) 80.2 tikacchede ca pañcame: giữ nguyên Tikaccheda là tên một phần Luật; pañcame đọc là thứ năm; chưa đối chiếu được phần nào của Vinaya. (15) 81.1 đến 81.3 niggahe, paṭikamme, osāraṇe, vuṭṭhāpane: dịch bằng nghĩa chung (khiển phạt, sửa chữa, cho nhập lại, phục hồi) vì là thuật ngữ Luật chưa có tiền lệ trong tầng; ở Niddesa niggaha và paṭikamma là thuật ngữ tranh luận (sự bác bẻ và phản bác); ở đây đọc theo văn cảnh Luật; 45.2 và 81.2 ṭhānāṭhāne dịch điều thích hợp và không thích hợp, không có tiền lệ. (16) 82.1 đến 82.4 nikkhipitvā padaṁ, ubhato viniveṭhetvā, rasato osareyyaṁ: dịch sát chữ (nêu ra một từ, gỡ cho rõ từ cả hai phía, đi vào theo ý vị); chưa rõ osarati ở đây có nghĩa kết luận hay nhập vào. (17) 84.1 rūpadakkho: dịch thiện xảo về các dạng thức; rūpa có thể là dạng từ, trường hợp, hay hình thức; chưa phân xử được. (18) 88.1 siṅghāṭakaṁ caccarañca: dịch ngã ba đường và ngã tư; hai từ này đều chỉ chỗ đường giao nhau, phân biệt ba và bốn nhánh chưa chắc. (19) 91.1 đến 91.4 mamatto, adhikaraṇaṁ, mittassa paṭipajjituṁ: dịch người thân thiết với vua, việc xét xử, để hành xử vì người bạn; chủ ngữ của deti (nhà vua) được hiểu từ rañño; chưa phân xử được mittassa là bạn của vua hay bạn của người ấy. (20) 93.4 cakkavākova dukkhitaṁ: giữ nguyên tên cakkavāka (loài chim, không có tiền lệ); động từ che chở được hiểu từ rakkhanti ở 93.3. (21) 102.3 và 102.4 dhutavādīguṇenaggo, akkhadasso: dịch bậc tối thắng nhờ đức hạnh của vị nói về hạnh đầu-đà (tiền lệ kassapaṁ dhutavādikaṁ ghi vị nói về hạnh đầu-đà) và vị thẩm phán. (22) 104.2 pamesi bhagavā mamaṁ: dịch Đức Thế Tôn đã chọn tôi, vì sau atikkamma; pameti còn có thể là đo lường, lấy làm chuẩn; chưa phân xử được. (23) 108.3 và 108.4 vinayogadhaṁ, vinayamūlapassino: dịch thấm sâu trong Luật, đối với những vị thấy gốc rễ của Luật; vinaya là gốc cũng có thể đọc là những vị thấy Luật là gốc. (24) 111.2 kappako: dịch thợ cạo theo tiền lệ Thợ làm bánh và thợ cạo; 111.4 putto jāto mahesino: dịch sinh làm con của bậc Đại Ẩn Sĩ, không thêm nghĩa con theo pháp. (25) 115.3 và 117.1 sirikaṁ nāgaṁ: dịch con voi Sirika (tên voi); sirika cũng có thể là tính từ (có phước, cát tường). (26) 116.3 Devalo nāma sambuddho: dịch Đức Chánh Đẳng Giác tên là Devala đúng như Pāli; truyền thống có thể hiểu là một vị Độc Giác, nhưng điều đó không có trong lời kinh. (27) 123.4 raṭṭhaṁ me vidhamissati: raṭṭhaṁ là danh từ trung tính nên có thể là chủ ngữ hoặc tân ngữ; dịch bị động quốc độ của tôi sẽ bị tan hoại; cách đọc khác là vị ấy sẽ phá huỷ quốc độ của tôi. (28) 126.1 tiyojanasahassa: đọc là ba ngàn do-tuần (3 × 1000), nhưng không có tiền lệ nào trong tầng cho dạng này; cách đọc khác là ba do-tuần với một ngàn người. (29) 129.1 đến 129.4: đổi người nói không được đánh dấu trong Pāli; đọc 129 đến 132 là lời Đức Phật đáp lại 128 nên me ở 129.4 dịch Ta. (30) 132.4 gamanaṁ taṁ na vijjati: dịch sát chữ sự đi đến điều ấy không có; điều ấy có thể là sân hận hoặc khổ cảnh; chưa phân xử được. (31) 135.2 susaṇṭhitaṁ: dịch đã đứng vững; có thể là đứng đúng tư thế (hợp 127.1 và 127.2) hoặc tâm đã vững. (32) 137.4 yathā diṭṭhaṁ padaṁ mama: dịch đúng như điều đã thấy về trường hợp của tôi; padaṁ có thể là trường hợp, cảnh giới hay lời. (33) 150.1 satthukappaṁ suvinayaṁ: dịch Luật tốt đẹp, ngang với bậc Thầy; kappa ở đây có thể là ngang bằng hoặc giống như. (34) 152.3 Upāli taṁ mahāvīra pāde vandati satthuno: dịch Upāli đảnh lễ Ngài, hỡi bậc Đại Anh Hùng, dưới chân của bậc Thầy; taṁ đọc là tân ngữ Ngài. (35) 8.1 pitu atthāya: dịch vì lợi ích của cha, đọc là cha của Đức Phật Padumuttara; Pāli không nêu chủ sở hữu. (36) Các khoá 129 (và có thể 130 đến 132) cũng khiến 130.4 kopo buddhe na jāyati dịch nơi Đức Phật, sự giận dữ không sinh khởi, không thêm của chư.
  Phép kiểm tự viết, mẫu số ghi kèm: tập khoá Việt bằng tập khoá Pāli 626/626 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 626/626, 0 lệch (Pāli mở nháy kép ở 1.1, đóng ở 156.4, kết ”. ; không có nháy đơn; Việt giữ đúng hai dấu ở đúng hai khoá, không tự cân từng khoá); dấu lược: Pāli 0 khoá có … hoặc (…), Việt 0 khoá, nên phép này chạy rỗng, không đo được gì; không khoá rỗng; NFC đủ; không khoảng trắng thừa; không chữ số trong thân kinh; dấu kết dòng khớp Pāli ở 618/626 khoá (8 khoá khác có chủ ý: 18.4 dùng dấu hỏi cho câu hỏi 18.3 và 18.4; 31.4, 34.4, 120.4, 127.4 dùng hai chấm trước lời nói theo tiền lệ; 47.3, 78.3, 110.3 dùng hai chấm theo 2 tiền lệ Mục đích ấy của tôi đã đạt được:); không Pāli lọt sang tiếng Việt ngoài tên riêng và thuật ngữ giữ nguyên (Therāpadāna, Haṁsavatī, Sujāta, Veda, Lakkhaṇa, Itihāsa, Caraka, Padumuttara, Sunanda, Okkāka, Gotama, Puṇṇa, Mantāṇi, Upāli, Sobhana, Sakya, Cittalatā, Āsāvatī, Kapilavatthu, Garuḷa, Tikaccheda, Khandhaka, Abhidhamma, Sāriputta, Kolita, Ānanda, Añjasa, Candana, Sirika, Devala, Sumekhala, Kosiya, Siggava, Sattaka, Dānava, Rakkhasa, Devadatta, Aṅgulimāla, Rāhula, Dhanapāla, Māra, bherī, cakkavāka, halāhala, koṭi). 23 nhóm Pāli trùng trong chính bài (55 khoá) đã dò, 1 nhóm Việt khác có chủ ý (nêu ở trên).
