notes: |-
  Đủ 8/8 khoá trong all. Bài Petavatthu đầu tiên trong tầng Việt.
  Mahāvagga → Đại Phẩm (4 tiền lệ); ngạ quỷ có tiền lệ (cõi ngạ quỷ); jāgaratha → tỉnh giác (124 occ); māpamajjathā → chớ phóng dật (tiền lệ).
  Bất định đã ghi nhận: Detheva đọc là detha (hãy cho!) + eva, hợp hai câu mệnh lệnh mở–kết bài kệ; ubhayaṃ (cả hai) chưa rõ chỉ hai gì nên giữ chữ cả hai, không suy đoán; Akkharukkha giữ nguyên tên cây, không chẻ nghĩa akkha+rukkha.

  Lượt cải thiện 2026-10-11: Thay thế phần ghi chú cũ "jāgaratha → tỉnh giác (124 occ)" vì sai: đo lại trên toàn tầng, các dạng gốc jāgar- được dịch chủ yếu là "tỉnh thức" (jāgariyānuyoga → "chuyên cần tỉnh thức", jāgarato → "tỉnh thức"); "tỉnh giác" là của sampajañña/sampajānakārī và chỉ trùng khoá với jāgarite trong công thức "sampajānakārī". Sửa 1.4 "hãy tỉnh giác" → "hãy tỉnh thức" (terminology 8.9 → 9.2).
  1.1: bỏ "của mình" — Pāli `na taṁ hoti` không có người sở hữu; "vật cho đi thì không còn là của mình" là thêm nghĩa và chốt một cách hiểu. Nay viết sát hơn: "Vật nào cho đi thì vật ấy không còn" (semantic_fidelity 9.0 → 8.7 vì bất định ở dưới vẫn còn).
  1.2: Pāli `Detheva dānaṁ` = detha (mệnh lệnh số nhiều) + dānaṁ + eva; bản cũ "hãy cho!" bỏ mất tân ngữ dānaṁ và eva → "hãy bố thí đi!". 1.3: `tena dānena` là "nhờ bố thí ấy" (không phải "vật thí" cụ thể); `gacchati` = đi đến, bỏ "được" thừa → "nhờ bố thí ấy mà đi đến cả hai".
  Bất định còn lại, chưa phân xử được: (a) `yaṁ dadāti na taṁ hoti` có thể là "vật cho đi thì không còn (ở mình)" hoặc "quả nhận được không đồng với vật đã cho"; Pāli chỉ có `taṁ hoti` không bổ ngữ, bản Việt tra cứu toàn văn đọc theo hướng thứ hai bằng lời giải chú đặt trong ngoặc, nhưng phần đó không có trong kinh văn nên không đưa vào lời kinh; câu Việt giữ ở mức trung tính, không chốt. (b) `ubhayaṁ` (cả hai) không nói hai gì; giữ "cả hai". (c) Tên Akkharukkha giữ nguyên; kinh văn không nêu nghĩa (bản tra cứu toàn văn đặt tên bài khác hẳn), nên ghi chú cũ "tên cây" chỉ là suy đoán chứ không kiểm chứng được từ Pāli.
  Điểm đổi: semantic_fidelity 9.0 → 8.7; grammar_logic 9.2 → 9.0 (1.1 chưa xác định được quan hệ); terminology 8.9 → 9.2; vietnamese_clarity 9.2 → 9.0; technical_integrity 10.0 → 9.6 (chưa chạy lại cổng máy trong lượt này). Các điểm khác giữ. triangulation giữ 7.0 (không có bản Anh độc lập). Blocker "không có tầng tham khảo English/Việt hiện hành" giữ nguyên. final_score 9.1 → 9.02. Đổi 4/8 khoá (pv48:1.1–1.4).
