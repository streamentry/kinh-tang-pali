notes: |-
  Đủ 8/8 khoá trong all. Bài Petavatthu đầu tiên trong tầng Việt.
  Mahāvagga → Đại Phẩm (4 tiền lệ); ngạ quỷ có tiền lệ (cõi ngạ quỷ); jāgaratha → tỉnh giác (124 occ); māpamajjathā → chớ phóng dật (tiền lệ).
  Bất định đã ghi nhận: Detheva đọc là detha (hãy cho!) + eva, hợp hai câu mệnh lệnh mở–kết bài kệ; ubhayaṃ (cả hai) chưa rõ chỉ hai gì nên giữ chữ cả hai, không suy đoán; Akkharukkha giữ nguyên tên cây, không chẻ nghĩa akkha+rukkha.
