notes: |-
  `Somadattajātaka` (số 5) trong `Gandhāravagga`, `Sattakanipāta`. 41/41 khoá. Ba tầng tham khảo đều vắng (xem `blocking_errors`) ⇒ `draft`, `triangulation` 7.5.

  **Pāli trùng nguyên văn: 13/41 khoá — dùng lại NGUYÊN VĂN 10 cặp.** `7.1`–`7.4` trùng byte-for-byte `ja352:5.1`–`5.4`; `8.1`–`8.3` trùng `ja352:6.1`–`6.3`; `9.1`–`9.3` trùng `ja352:7.1`–`7.3`. Cả mười khoá lấy y hệt, kể cả dấu câu. `0.1` theo 384:16; `0.2` theo 14/14 (*Bộ Bảy Bài Kệ*); `0.3` theo 5/5 (*Phẩm Gandhāra*); `0.4` theo mẫu 371:29 *N. Kinh <tên>* → *5. Kinh Somadatta* (đã có tiền lệ `ja211:0.4` *1. Kinh Somadatta*).

  **Một chỗ trùng Pāli mà dịch riêng — đây là điểm dễ sai nhất của bài.** `8.4` ở đây là `puttasokaṁ apānudi.` trong khi `ja352:6.4` là `pitusokaṁ apānudi.` (cha, không phải **con**). Dùng lại nguyên văn của `ja352` sẽ đổi nghĩa, nên dịch riêng *đã đẩy nỗi khó đau của người con ấy đi xa*. Ngược lại `9.4` `tava sutvāna vāsavā”ti.` cũng khác `ja352:7.4` `tava sutvāna māṇava.`; dịch *sau khi nghe lời ngươi, hỡi Vāsava”ti.* theo đúng Pāli của mình, giữ tên `Vāsava` vì tầng đã dùng tên này 20+ lần (kể cả `ja340:3.4` *hãy tiếp tục gìn giữ, hỡi Đấng Vāsava*).

  **Bốn khoé đọc đã ghi.** (1) `1.1`–`1.4` `Yo maṁ pure paccuḍḍeti, araññe dūramāyato` — `paccuḍḍeti` = tìm kiếm, `dūramāyato` = xa chỗ ở; dịch *Kẻ nào trước đây tìm ta giữa rừng, / xa cái chỗ ở của ta;* và `mātaṅgo` ở `1.3` là tế danh ⇒ *mẹ ơi*. (2) `2.2` `allasiṅgaṁva vacchito` — cách-mạng `allasiṅga` + cá bị kéo lưới là ẩn dụ về cái chết, dịch *nằm sấp như cá được kéo lưới*; `amarā` ở `2.4` là thán từ bất ngạ, dịch *không chút tự tại ơi*. (3) `6.3`–`6.4` `Sabbe saṅgamma rodāma, aññamaññassa ñātake` — bản nháp dịch sai thành *Chỉ thân thôi còn buồn khóc thế*; `saṅgamma` là gom lại, đã sửa thành *Tất cả chúng ta, gom lại, đều khóc*. (4) `3.2` `vippamuttassa te sato` — đã thoát khỏi ưu não, dịch theo nghĩa `vimutta` đã có 15 tiền lệ trong tầng.

  **Dấu lược:** không segment nào có `…pe…`; cả hai phía 0.

  `npm run validate|test|check|build` không chạy (BRIEF cấm); `technical_integrity` = 9.6 vì các chốt tự động đã xanh và cổng `npm` chưa chạy.

  Sửa lan 2026-10-13 (accuracy fix; 1.1–9.4 đổi, 0.x và 10.1 giữ nguyên). Mục này THAY «Bốn khoé đọc đã ghi» (1)–(4) ở trên (paccuḍḍeti «tìm kiếm», mātaṅgo «mẹ ơi», «cá được kéo lưới», amarā «không chút tự tại», vippamutta «thoát khỏi ưu não», saṅgamma) và ý «dùng lại nguyên văn ja352:5–7» (ja352 đang được sửa riêng); riêng điểm 8.4 puttasokaṁ (con, không phải cha) vẫn đúng. Trước → sau: 1.1–1.4 «Kẻ nào trước đây tìm kiếm ta giữa rừng, / xa cái chỗ ở của ta; / Hình như hắn không còn hiện diện, mẹ ơi; / Somadatta đi đâu rồi?» → «Kẻ trước đây vẫn đến đón tôi / từ xa trong rừng; / con voi ấy nay không thấy đâu, / Somadatta đã đi đâu rồi?» (mātaṅgo = con voi, như ja547:78.3, ja547:720.1, mil7.2.2:8.1; không có «mẹ ơi»); 2.1–2.4 → «Hay đây chính là kẻ đã chết đang nằm, / như mầm non tươi bị chặt; / nằm gục trên mặt đất, / ôi, con voi lớn»; 3.1–3.4 «Gặp trường hợp nhà không ở, / đã thoát khỏi ưu não…» → «Ngươi đã đi đến đời sống không nhà, / đang là người đã được giải thoát; / Đối với bậc sa-môn, điều ấy không tốt, / việc ngươi sầu thương người đã chết» (anagāriyupeta = đã đi đến đời sống không nhà; vippamutta = đã được giải thoát; 3.3–3.4 khớp ja372:1.3–1.4 và ne37:193.3); 4.1–4.4 «Dù là vua trời, hay là loài người, hay là loài thú; …» → «Này Sakka, quả thật do sống chung, / với người hay với thú; / tình thương sinh ra trong lòng, / không thể không sầu thương về điều ấy» (saṁvāsena have sakka: sakka là lời gọi Sakka); 5.1–5.4 «Kẻ khóc tiếng là ‘Thưa ông con đã chết’… Nên thấy sanh… o bậc thiện thế, kẻ khóc ấy là kẻ ngu ngốc» → «Họ khóc người đã chết và người sắp chết, / những ai khóc lóc và than van; / Vì vậy, này ẩn sĩ, ngươi đừng khóc, / bậc thiện nhân nói khóc lóc là vô ích» (isi = ẩn sĩ, không phải động từ; santo = bậc thiện nhân, moghaṁ = vô ích, không phải «ngu ngốc»); 6.1–6.4 «Dù bị khóc gọi, ông hãy nhớ… vô ích, hỡi kẻ không biết ơn» → «Này Bà-la-môn, nếu nhờ kêu khóc mà / người đã chết, đã ra đi, có thể sống dậy; / thì tất cả chúng ta sẽ cùng tụ họp mà khóc / cho những người thân của nhau»; 7.1–9.4, ba khổ kệ trùng ja449:8.1–10.4 (đang dùng bản đã sửa), thay «Ôi, tôi đã cháy bỏng rồi, như cành cây khô bị lửa thiêu đốt; nước sóng vọt vào như vậy, làm cháy tan tất cả, kể cả kẻ khiếp sợ như tôi; Ôi, tôi đã đau đớn khổ sở, nỗi buồn đã ăn vào lòng ngươi; Kẻ đã gây nỗi buồn cho ta…; Giờ thì tôi đã hết nỗi khó đau của mình» bằng «Quả thật tôi đang bốc cháy, như lửa được rưới bơ lỏng; như người rưới nước lên, ngài đã dập tắt mọi nỗi bức bối. / Thật vậy, ngài đã nhổ mũi tên của tôi, mũi tên từng găm trong tim; khi tôi bị sầu muộn vây phủ, ngài đã xua tan nỗi sầu thương con. / Nay tôi đã được nhổ mũi tên, … sau khi nghe lời ngài, hỡi Vāsava» (căn cứ như ja372 5.1–7.4: bơ lỏng, người rưới nước, daraṁ = nỗi bức bối, sallaṁ = mũi tên, yamāsi hadayassitaṁ = từng găm trong tim). Ai nói với ai suy từ truyện dẫn (bản Anh Jātaka tập III, Francis–Neil 1897, chỉ để biết người nói): ẩn sĩ nuôi voi con Somadatta, voi chết, Sakka đến can; 1–2, 4 và 7–9 là lời ẩn sĩ, 3, 5, 6 là lời Sakka. Bất định không đưa vào thân kinh: (a) paccuḍḍeti/dūramāyato (1.1–1.2) đọc «vẫn đến đón / từ xa trong rừng», chưa kiểm được sắc thái; (b) allasiṅgaṁva vacchito (2.2) tôi đọc «như mầm non tươi bị chặt»; allasiṅga có thể là tên một loài (gừng tươi?), chưa phân xử; (c) amarā vata (2.4): vata dịch «ôi», còn amarā KHÔNG được dịch vì nghĩa từ vựng («bất tử») chưa khớp bối cảnh và chưa phân xử được; (d) marissaṁ (5.1) đọc «người sắp chết». Pāli trùng nội bộ: 0 cặp. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại; technical_integrity giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
