notes: |-
  `Somadattajātaka` (số 5) trong `Gandhāravagga`, `Sattakanipāta`. 41/41 khoá. Ba tầng tham khảo đều vắng (xem `blocking_errors`) ⇒ `draft`, `triangulation` 7.5.

  **Pāli trùng nguyên văn: 13/41 khoá — dùng lại NGUYÊN VĂN 10 cặp.** `7.1`–`7.4` trùng byte-for-byte `ja352:5.1`–`5.4`; `8.1`–`8.3` trùng `ja352:6.1`–`6.3`; `9.1`–`9.3` trùng `ja352:7.1`–`7.3`. Cả mười khoá lấy y hệt, kể cả dấu câu. `0.1` theo 384:16; `0.2` theo 14/14 (*Bộ Bảy Bài Kệ*); `0.3` theo 5/5 (*Phẩm Gandhāra*); `0.4` theo mẫu 371:29 *N. Kinh <tên>* → *5. Kinh Somadatta* (đã có tiền lệ `ja211:0.4` *1. Kinh Somadatta*).

  **Một chỗ trùng Pāli mà dịch riêng — đây là điểm dễ sai nhất của bài.** `8.4` ở đây là `puttasokaṁ apānudi.` trong khi `ja352:6.4` là `pitusokaṁ apānudi.` (cha, không phải **con**). Dùng lại nguyên văn của `ja352` sẽ đổi nghĩa, nên dịch riêng *đã đẩy nỗi khó đau của người con ấy đi xa*. Ngược lại `9.4` `tava sutvāna vāsavā”ti.` cũng khác `ja352:7.4` `tava sutvāna māṇava.`; dịch *sau khi nghe lời ngươi, hỡi Vāsava”ti.* theo đúng Pāli của mình, giữ tên `Vāsava` vì tầng đã dùng tên này 20+ lần (kể cả `ja340:3.4` *hãy tiếp tục gìn giữ, hỡi Đấng Vāsava*).

  **Bốn khoé đọc đã ghi.** (1) `1.1`–`1.4` `Yo maṁ pure paccuḍḍeti, araññe dūramāyato` — `paccuḍḍeti` = tìm kiếm, `dūramāyato` = xa chỗ ở; dịch *Kẻ nào trước đây tìm ta giữa rừng, / xa cái chỗ ở của ta;* và `mātaṅgo` ở `1.3` là tế danh ⇒ *mẹ ơi*. (2) `2.2` `allasiṅgaṁva vacchito` — cách-mạng `allasiṅga` + cá bị kéo lưới là ẩn dụ về cái chết, dịch *nằm sấp như cá được kéo lưới*; `amarā` ở `2.4` là thán từ bất ngạ, dịch *không chút tự tại ơi*. (3) `6.3`–`6.4` `Sabbe saṅgamma rodāma, aññamaññassa ñātake` — bản nháp dịch sai thành *Chỉ thân thôi còn buồn khóc thế*; `saṅgamma` là gom lại, đã sửa thành *Tất cả chúng ta, gom lại, đều khóc*. (4) `3.2` `vippamuttassa te sato` — đã thoát khỏi ưu não, dịch theo nghĩa `vimutta` đã có 15 tiền lệ trong tầng.

  **Dấu lược:** không segment nào có `…pe…`; cả hai phía 0.

