notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho `tha-ap`, xem `blocking_errors`.
  ĐO `tha-ap :0.3` theo hướng lát s7 (so với Pāli, KHÔNG so theo chuỗi Việt): 357 tệp Việt có khoá `:0.3`; Pāli `:0.3` KHÔNG có số thứ tự ở 242 tệp, và 240/242 (99,2%) bản Việt cũng không có — xác nhận con số của s7 (289/291 = 99,3%). Chiều ngược lại thì kho còn lệch: Pāli `:0.3` CÓ số ở 115 tệp mà bản Việt chỉ giữ 71 (61,7%), tức 44 tệp đang thêm số ở chỗ Pāli không có. Ba bài trong lát này đều có Pāli `:0.3` không số (`Bhisadāyakattheraapadāna`, `Gandhamāliyattheraapadāna`, `Pallaṅkadāyakattheraapadāna`) ⇒ BỎ số ở `:0.3`, đặt số ở khoá đóng, nơi Pāli thật sự có (`pañcamaṁ` / `dasamaṁ`). Mẫu tiêu đề: `Bài Kệ Tuyên Ngợ Về Trưởng Lão …` 203/357 so với `Ký Sự Về Trưởng Lão …` 89/357 và `Bài Kệ Tuyên Ngôn …` 65/357. Mẫu phẩm ở `:0.2`: `Phẩm X` 469 lần, giữ nguyên Pāli chỉ 9 lần.
  `…pe…` của Pāli giữ đúng MỘT dấu lược `…` theo 606/606 tiền lệ có số đếm trong tầng; không mở rộng ở bất kỳ khoá nào. `Therāpadāna` ở `:0.1` giữ nguyên Pāli (348/357).
  BÀI CÓ `UDDĀNA` Ở CUỐI: `9.1` `Tassuddānaṁ` + `10.1–10.6`. `9.1` dịch `Tóm lược:` theo đa số 66/124; `10.1–10.5` là danh sách tên riêng của các bài trong phẩm nên giữ nguyên dạng Pāli không dấu (`Chatta`, `thambha`, `vedi`, `Parivārumapupphiyo`, `Anulepo`, `maggo`, `phalako`, `vaṭaṁsako`, `Pallaṅkadāyī`) — cùng cách làm với `tha-ap72:12.1–13.2`. `10.6` `chappaññāsa pakittitāti.` = `năm mươi sáu đã được ghi lại.`
  ĐỐI CHIẾU TIỀN LỆ ĐẾM ĐƯỢC (10 khoá trong bài có Pāli trùng nguyên văn ở bài khác; 8/10 dùng lại đúng nguyên văn): `Therāpadāna` 345; `Phẩm Chatta` 3 cho `Chattavagga`; `bậc tối thượng thế gian, bậc Vững Vàng kiên định;` cho `lokajeṭṭhassa tādino;` 4; `Đầy đủ bảy món báu quý giá,` cho `Sattaratanasampanno,` 26/63 (đa số); `Bốn vô ngại giải,` 362; `…` 603; `đã làm tròn lời dạy của Đức Phật”.` 329; `Tóm lược:` 66/124. `là những vị Chuyển Luân Vương có đại uy lực.` cho `cakkavattī mahabbalā.` — 47 bản (`đại oai lực` 29 vs `đại uy lực` 25, gần như hòa; giữ `uy lực` để khớp `tha-ap67:6.4` cùng lát). `Nhờ thấu rõ ý định của tôi,` cho `Mama saṅkappamaññāya,` — 13 bản, `của ta` 5 và `của tôi` 5 nên hòa.
  SỬA 4 LỖI TÌM ĐƯỢC TRONG TỆP DỊCH CÓ SẴN:
    (1) `0.3` LỆCH MẪU TIÊU ĐỀ — bản cũ `Ký Sự Về Trưởng Lão Pallaṅkadāyaka`; đa số 203/357 dùng `Bài Kệ Tuyên Ngợ Về Trưởng Lão …`, và hai bài anh em cùng lát (`tha-ap67`, `tha-ap97`) cũng vậy. Đã sửa cả `0.3` và khoá đóng `7.1` cho khớp.
    (2) `2.2` SAI NGHĨA — bản cũ `là chủ Pallaṅka thuở ấy;`; `pallaṅko āsi so tadā` = `đó là bệ Pallaṅka dưới thời ấy`, `chủ` là chủ nhân, không có nghĩa ở đây và trái với `3.4` `quả báo của việc dâng Pallaṅka`. Đã sửa `là bệ Pallaṅka thuở ấy;`.
    (3) `3.1` THÊM CHỮ KHÔNG CÓ — bản cũ `Trong ba mươi ngàn kiếp ấy,`; `Tiṁsakappasahassamhi,` không có `ấy`. Đã sửa `Vào ba mươi ngàn kiếp trước đây,` theo 2/3 tiền lệ, và sửa luôn `4.1` (`Vīsakappasahassamhi,`) cho khớp.
    (4) `3.2` CỦA BẢN CŨ `tôi đã dâng Pallaṅka thời ấy;` là ĐÚNG, KHÔNG sửa — `pallaṅkamadadiṁ` đọc `mā adasiṃ` = chính tôi đã dâng, khớp `1.3` `Pallaṅko hi mayā dinno`. Ghi ra đây vì dạng `adadiṁ` trông như ngôi thứ hai, rất dễ bị sửa nhầm.
  BẤT ĐỊNH (ghi ở đây, KHÔNG giải thích trong thân kinh):
    (a) `pallaṅka` — Pāli root có `pallaṅka` ở nhiều bộ khác (`bv2:77.4`, `ja501:27.3`, `mnd19:3` = bậc thang thứ tư để leo điện tháp) nhưng KHÔNG bản Việt nào trong kho đã dịch những chỗ ấy, nên 0 tiền lệ cho nghĩa tế lễ. Đã dịch `bệ Pallaṅka` vì `2.1` nói nó `Sattaratanasampanno` (đầy bảy bảo) và `1.4` nói `sauttarasapacchado` (tám tầng) — tức một dàn lễ, không phải thang leo. Ghi rõ vì đây là chỗ dễ đọc sai nhất của bài.
    (b) `Mama saṅkappamaññāya, / nibbattati sadā mama.` (2.3–2.4) — chủ ngữ của `nibbattati` không nêu trong Pāli; dịch `điều ấy luôn luôn xảy ra với tôi.` theo nghĩa `nibbattati` (sinh ra / có được) mà không bịa chủ thể.
    (c) `3.1` nói ba mươi ngàn kiếp, `4.1` nói hai mươi ngàn kiếp — hai con số không khớp trong chính Pāli; giữ nguyên cả hai.
    (d) `sauttarasapacchado.` dịch `thứ có tám tầng chồng lên.` (`sauttara` = tám, `paccha` = tầng lớp) — hapax, 0 tiền lệ.
    (e) `8.1` `Chattavaggo pannarasomo.` = `Phẩm Chatta là phẩm thứ mười lăm.` — hapax, 0 tiền lệ.
