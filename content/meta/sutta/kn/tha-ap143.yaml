notes: |-
  **Bài này.** `tha-ap143` · phẩm `chattavagga` · thứ nhất trong phẩm (lục kết `6.1` tự xác nhận) · vị trưởng lão Atichattiya. Bài có 21 khoá Pā li; bản dịch phủ đủ 21/21.

  **Công thức lặp rất dày ở tập này, và tôi đo trước khi chọn.** Dựng chỉ mục Pāli→Việt toàn tầng, rồi đếm với từng segment: 1967 cặp Pā li giống hệt đã dò (không tính 4 tệp của lát), 1160 cặp trùng về lời, 11 khoá khớp nguyên văn ít nhất một bản đã có. Dùng lại nguyên văn ở `0.1` (365), `0.2` (8), `1.1` (3), `2.3` (1), `3.1` (1), `3.2` (2), `3.4` (3), `4.1` (374), `4.2` (24), `4.3` (32), `4.4` (341).

  **Năm phép kiếm, số do script in ra.**
  (1) set(khoá Việt) == set(khoá Pā li): thiếu 0, thừa 0. Có 20/21 khoá Pā li ngắn hơn 40 ký tự, tức là gần hết bài — chốt `_hvi.py` bỏ sót nhóm này và sẽ chạy rỗng.
  (2) `“”` và `‘’` so từng khoá: 21 khoá đã so, 0 khoá lệch; cân cả bài: ngoặc kép Pā li 2 / Việt 2, nháy đơn Pā li 0 / Việt 0. Pā li mở nháy ở `1.1`, đóng ở `4.4`.
  (3) Pā li trùng trong chính bài: 0 cặp, Việt khác 0 cặp.
  (4) Dấu lược: `…pe…` 0 khoá, `…` trần 0; bản dịch có 0 dấu `…`; lệch 0. Bài này Pā li **không** có lược nào, nên bản dịch cũng không có — không dùng `…` để nén.
  (5) NFC / khoá rỗng / ký tự Pā li lọt: 0 vấn đề. Tên riêng `Atichattiya` và địa danh `Saḷala` không xuất hiện ở `tha-ap143` — chỉ `Atichattiya` có mặt, ở `0.3`, `5.1`, `6.1`.

  **Bất định, đã ghi thay vì giấu.**
  `1.3 Chattātichattaṁ kāretvā`: đọc được hai cách — hoặc *tầng dù trên tầng dù* (chép từ lặp `chatta`), hoặc *tháp bốn tầng dù* (`chattā` bịa nhân với `catta`). Tôi chọn cách đọc văn chữ *tầng dù trên tầng dù* và ghi cả hai ở đây. Có thể kiểm chéo trong chính bài: `2.3 Pupphacchadanaṁ katvāna / chattamhi abhiropayiṁ` cho thấy người kể làm một mái che bằng hoa rồi đặt lên chiếc dù — tức `chatta` ở bài này là *dù*, và `chattātichattaṁ` là mái dù chồng lên mái dù.
  `1.2 atthadassīnaruttame`: chỉ 1 tiền lệ, *Đức Atthadassī, bậc tối thượng giữa loài người*. Tôi bỏ chữ *Đức* — vì `1.1` vừa nói *Thế Tôn đã nhập Bát-niết-bàn*, gọi người đang đọc là *Đức* sẽ lẫn hai danh xưng; `ruttame` là `ruttama` tối thượng giữa hàng người, thì giữ nguyên. Đây là lệch **một chữ** với tiền lệ, có lý do, không phải quên.
  `3.3 Manussattaṁ na gacchāmi`: `na gacchāmi` là *không đi tới được*, không phải *không mong muốn*. Tôi dịch sát nghĩa đen là *ta không đi vào chỗ làm người*, không suy diễn thành sự mong muốn — vì bối cảnh `3.2` đã nói rõ ông làm vương quyền nơi chư thiên.
  `1.4`: 2 bản đã có, cả hai dùng *tôi*. Tôi dùng *ta* để nhất quán ngôi kể với `3.2` (bản đã có cùng lời, cũng dùng *ta*) — lệch đúng một từ đại từ, không đổi nghĩa.

  **Tên riêng giữ nguyên dạng Pā li.** `Atichattiya`: Pā li ở khoá kệ dạng Nom. sg. `atichattiyo` (`5.1`), ở `0.3` có `Atichattiyattheraapadāna` với sandhi `-iya`+`tthera`, ở `6.1` là `Atichattiyattherassāpadānaṁ`. Ba nơi khớp nhau.

  **Chính sách `:0.3` — đo rồi mới chọn.** Giữ số khi và chỉ khi Pā li `:0.3` bắt đầu bằng số. Đo ở 427 tệp `tha-ap*.yaml`: KEEP 15 · DROP 297 · LỆCH 115; số bài mà Pā li `:0.3` bắt đầu bằng số là 130, trong đó chỉ 8 tệp viết số vào `translationTitle` và cả 8 khớp đúng số Pā li với hình thức `N. `. Bài này Pā li `:0.3` = `1 Atichattiyattheraapadāna` **bắt đầu bằng số** ⇒ **GIỮ số**, hình thức `N. ` ⇒ `1. Bài Kệ Tuyên Ngợ Về Trưởng Lão Atichattiya`, và `translationTitle` đặt **bằng đúng** giá trị `:0.3` ấy. Trước khi sửa, `translationTitle` là *Kinh Kệ Của Trưởng Lão Atichattiya* — thiếu số, nên tôi sửa. `tests/unit/tha-ap-title.test.ts` không tồn tại trong kho, tôi tự đếm.

  **Tiền lệ `ti`, đo ở phạm vi gần nhất — ghi cả hai số.** Trong 427 tệp `tha-ap*.yaml`: *Bài Kệ Tuyên Ngợ Về* 191 · *Ký Sự Về* 88 · *Bài Kệ Tuyên Ngôn Về* 65 · *Kinh Kệ Của* 39 · *Truyện Kệ Của* 14 · *Tự Thuật Của* 14. Tôi theo nhóm đông nhất, và giữ số thứ tự phẩm theo Pā li.

  **Tầng tham khảo — đo manifest.** Tại commit 11c9d708978cde8ba61096d8a75f7ddfb846f639, thư mục con `sutta/kn/` của tầng `english-sujato` không có `tha-ap` ⇒ 0 tệp Anh, 0 segment Anh. `vietnamese-current` chỉ có 26 tệp, toàn bộ Pháp Cú ⇒ không có bản Thích Minh Châu cho `tha-ap`. `english-project` không có tệp cho bài này. Mẫu số coverage = 1 khoá Pā li ≥ 40 ký tự (bỏ `:0`), Sujato phủ 0/1. `reference-gaps.yaml` **đã có** entry cho `tha-ap143`, nên khoảng trống này không chặn `review`/`published`.

