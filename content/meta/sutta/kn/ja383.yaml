notes: |-
  Bản dịch dựng từ Pāli root (content/catalog/sutta/kn.json → .cache/upstream, 33/33 khoá), không có tầng Anh đã ghim để đối chiếu — xem blocking_errors. Cổng coverage đo được là **0/0**, tức mẫu số bằng 0: bài truyện ngắn, khoá dài nhất 27 ký tự, không khoá nào đạt ngưỡng 40 ký tự của `source/layers.yaml`.
  Bối cảnh đọc được từ Pāli: bài này là hình mẫu gốm — chim cút (kukkuṭi) làm vợ con mèo. 1.1 `tambacūḷa` (màu đồng) và 1.2 `vihaṅgama` (bay) cho biết kẻ cầu hôn là **chim**, nhưng 1.4 `mudhā bhariyā bhavāmi` ("ta sẽ làm vợ của ngươi") và 2.1 `Catuppadī tvaṁ` ("ngươi có bốn chân") làm lộ chủ thể là con vật bốn chân; hai câu cạnh tranh còn để nửa chừng lời cảnh báo ở 1.3. Đã dịch theo đúng nghĩa Pāli của từng khoá, **không** dàn cảnh để làm câu trôi; sự lệch này là của chính văn bản, ghi lại đây để người biên tập biết mà không tự ý sửa.
  Điểm ít tin cậy nhất: `:0.3` là tên phẩm `Avāriyavagga`. Người biên tập giao rằng mỗi truyện một tên riêng và 0 tiền lệ thì phải ghi rõ. Đo lại trên 449 tệp `ja` đã có bản dịch: tên phẩm này có tiền lệ **8/8** tệp dùng "Phẩm Avāriya" (ja376–ja381 và ja384, đều lân cận trong đúng phẩm này). Vì vậy KHÔNG phải 0 tiền lệ; dùng đa số đo được "Phẩm Avāriya". Ghi rõ con số 8/8 để người điều phối gộp. (Tầng tên `name/sutta/ja-name_translation-en-sujato.json` đã ghim không chứa `Avāriyavagga` — nó chỉ khớp `pancakanipata` và `chakkanipata` — nên không thể chốt bằng bảng tên của SuttaCentral cho tên phẩm này.)
  `:0.2` Chakkanipāta → "Bộ Sáu Bài Kệ": đo trên 449 tệp `ja`, chuỗi Pāli này chỉ đi kèm **một** cách dịch, 17/17, không có đối chứng nào. Khác ja372 ở chỗ `Pañcakanipāta` thì kho có tới bốn cách; ở đây không có chỗ nào phải phán xử.
  `:0.4` và cột bài `:8.1` → "Kinh Kukkuṭa". PĀLI `:0.4` là `8. Kukkuṭajātaka`. Đo lại trên kho: chuỗi PĀLI `Kukkuṭajātaka` đúng bằng ấy đã có 2 tệp — ja448 dùng "10. Kinh Kukkuṭa" và ja209 dùng "9. Kinh Chim Cút". Chọn **Pāli** ("Kinh Kukkuṭa") vì mẫu lân cận trong Chakkanipāta nghiêng hẳn về giữ Pāli: ja376 "1. Kinh Avāriya", ja377 "2. Kinh Setaketu", ja378 "3. Kinh Darīmukha", ja379 "4. Kinh Neru", ja380 "5. Kinh Āsaṅkajātaka", ja381 "6. Kinh Migālopa" — **6/6** giữ Pāli. Ghi rõ cả hai tiền lệ để người điều phối chốt nếu muốn thống nhất theo ja209.
  Trong thân truyện, `kukkuṭa` dịch "gà" (tiền lệ đo được: ja448 dùng "gà" 5 lần cho `kukkuṭo`/`kukkuṭova`, gồm đúng hai câu `…viya senakaṁ` và `…vaṁsakānane` có cấu trúc song song với 5.4 và 7.4 của bài này). `sattu`/`biḷāri` dịch "kẻ thù" — đây là bắt buộc theo luật tái dùng: PĀLI `Muccate sattusambādhā` ở 7.3 **trùng nguyên văn** với ja342:4.3 và ja419:9.3, và cả hai tệp đã có đều dịch là "Sẽ thoát khỏi cạm bẫy của kẻ thù", nên 7.3 dùng lại đúng nguyên văn đó. Bản nháp đầu tiên của tôi đã dịch 7.3 là "giải thoát khỏi tay kẻ thù" và 7.4 là "khỏi miệng sư tử" — cả hai sai: vế trước trùng nguyên văn Pāli ở hai bài khác nên phải dùng lại cách dịch đã có; vế sau lại dùng "sư tử" cho `sattu`, mà đo toàn tầng thì "sư tử" chỉ có nghĩa là **sư tử** (22 lần, đều nói tiếng rống sư tử), còn `sattu` trong kho đã dùng là "kẻ thù" (ja351, ja342, ja419). Đã sửa cả hai. Đây là lỗi mà harness không bắt được vì hai bản Việt vẫn "đọc hiểu được".
  Cùng loại lỗi, đã bắt và đã sửa trong vòng review đối kháng: cặp nháy kép đặt sai ở 5.4 (Pāli mở nháy ở 5.1 nhưng đóng ở 7.4, bản nháp đóng sớm ở 5.4).
  Dấu lược: PāLI của cả ba bài trong lát này **không có** `…pe…` lẫn `…` trần (đo: 0/99 khoá), nên quy tắc `…pe…` của BRIEF_VI3 §10.1 không phát sinh ở lát này; `_hvi` xác nhận dấu lược cân bằng trên cả ba bài. Dấu `”ti` cuối bài: đo trên các khoá Pāli kết bằng `”ti.` trong bộ `ja` cho **222 bỏ vs 207 giữ**, đa số là bỏ, nên bỏ (như ja372).
  `ariyena vedena` (3.3 và 4.3) dịch "bằng cách công khai" — `ariya` ở đây mang nghĩa "cao quý, công khai, không che giấu", đối lập với cách mà kẻ cầu hôn thực sự dùng (nói dễ thương ở 3.1–3.2 rồi đòi ở 4.3). Ghi rõ vì đây là chỗ dịch theo nghĩa từ điển chứ không có tầng Anh để đối chiếu.
