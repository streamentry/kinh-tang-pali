    + `23.3`–`23.4` `ubhova gacchāmase … yāva pitā … etu`: không rõ là hai người cùng đi trước khi cha về, hay đợi cha về rồi mới đi; dịch sát chữ.
    + `26.2` `tapanī` giữ phiên âm (hapax, có thể là lò sưởi hoặc chỗ nhóm lửa); `samitā` → "lắng yên" (cũng có thể là "bày sẵn" nếu đọc `samiddhā`). `26.4` `brahmabhūto` → "đã trở thành Phạm" (theo `mn51:5.10`).
    + `28.2` `vineti`: động từ không có tân ngữ, dịch "đang điều phục" theo `mn107`, `mn35`; nghĩa trong mạch không xác lập được ("dẫn đi", "loại bỏ" cũng khả dĩ). `28.4` `sukaṇhakaṇhacchadanehi bhoto`: `chadana` ("lớp che") có thể là tóc, lông mi hoặc y phục; `bhoto` đọc là "của vị ấy" chứ không phải lời gọi cha.
