    + `41.1`–`41.4`: câu mô tả vết thương của người khách và việc người ấy đè lên Isisiṅga; `uttariyāna` → "bước lên trên" (cũng có thể là "vượt lên"); `vimaṭṭhimaṁ` → "nhẵn nhụi"; `kharapattasannita` → "hình như chiếc lá nhám" (`sannita` không rõ, có thể là `saṇṭhita`).
