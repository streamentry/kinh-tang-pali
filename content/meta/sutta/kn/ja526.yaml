    Trong chính bài: 5 nhóm Pāli trùng nguyên văn (sau khi bỏ dấu câu): `10.2`/`11.4` (`yassa tevaṅgataṁ phalaṁ`), `10.3`/`11.5`, `19.4`/`20.4`/`21.4`, `32.4`/`42.2`, `54.3`/`55.3`; bản Việt giống nhau ở mọi nhóm. Hai nhóm khác là đoạn lặp nhưng không trùng Pāli: `25.1`–`25.4` với `27.1`–`27.2` (nội dung tương tự, nhưng Pāli khác nên Việt khác) và `54`–`55` (`55` thêm `punapi` nên Việt thêm "lại").
  - Số Pāli:
