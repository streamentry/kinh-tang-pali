notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Không khoá nào có …pe…; nháy kép mở ở 1.2 và đóng ở 1.3, lại mở ở 2.1 và đóng ở 2.2, rồi 3.1-3.2, 4.1 — cân trên cả bài đúng như Pāli.

  Tiền lệ có đếm và dùng lại: Mahāvagga → Đại Phẩm (6, y hệt mil3.1.7); manasikāra → khéo tác ý theo mil3.1.7 và glossary; Opammaṁ karohī → Hãy xét một thí dụ, theo đếm trên cả họ công thức Opammaṁ karohī trong tầng là thí dụ 11/14 và ví dụ chỉ 3/14, nên bản nháp đầu là Hãy làm một ví dụ đã bị sửa; khung Vua nói, thưa tôn giả Nāgasena, này Đại vương, bạch tôn giả giữ nguyên với mil3.1.7, mil3.4.9. Pāli trùng nguyên văn: 4.1 Kallosi bhante nāgasenā ti trùng mil3.1.7:2.1, mil3.3.4:2.1, mil3.6.5:2.1 và nằm trong bảng TIEN_LE_PHAI.md — dùng lại nguyên văn Khéo lắm, thưa tôn giả Nāgasenā.

  Một xung đột nhỏ trong tầng đã phản ánh vào notes: Rājā āha được dịch theo hai kiểu, Vua nói có 27 bài và Vua nói có gạch dài 12 bài cho đúng một Pāli. Chọn đa số Vua nói và ghi ở đây; lát này không tự chuẩn hoá tệp lát khác.

  0 tiền lệ, đặt mới: ūhanalakkhaṇa → mang dấu hiệu là nắm lấy; chedanalakkhaṇā → mang dấu hiệu là cắt bỏ; yavalāvaka là tên loại cỏ, giữ nguyên dạng từ điển cho cả ba khoá 2.3, 2.5, 3.1 vì Pāli biến cách (yavalāvake, yavalāvakā, yavalāvako) và mỗi dạng chỉ xuất hiện trong Pāli của chính khoá đó nên không thể dùng nguyên văn ở cả ba; tên này đã khai vào bộ nhớ tiến trình theo đúng cơ chế lọt_pāli của _hvi.py. Một lượt review tự bắt được lỗi: bản nháp đầu dịch dāttena thành tay cắt, nghe cụt; đã sửa thành tay cầm lưỡi cắt.

