notes: |-
  **Bài này.** `tha-ap196` · phẩm `tamālapupphiyavagga` · thứ tư trong phẩm ·
  vị trưởng lão Asokapūjaka. Lát `n42` giao 3 bài / 81 khoá; bài này có
  **28 khoá** trong `all`, tôi dịch và ghi đủ **28/28** — 27 khoá trong `keys`,
  còn `tha-ap196:7.1` đã có sẵn từ đợt trước và tôi **giữ nguyên văn**.
  **Vì sao tệp cũ chỉ có MỘT khoá — và blocker cũ đã được gỡ.** Đợt trước lát
  này được chia bằng bộ lọc `len(Pāli) >= 40`, mà ở `tha-ap` **23/24** khoá Pāli
  ngắn hơn 40 ký tự, nên bộ lọc loại hết kệ và chỉ còn `:7.1`.
  `blocking_errors` cũ ghi đúng điều đó. Lát n42 dùng `missingAll`, tôi đủ
  **28/28** khoá, nên blocker thiếu khoá **không còn**; blocker duy nhất còn lại
  là tầng Anh đã ghim không phủ `tha-ap` (nêu ở trên).
  **Nội dung riêng của bài này — đã đọc Pāli, không suy từ công thức chung.**
  Người kể là vị trưởng lão Asokapūjaka, trước đời làm `Uyyānapālo`, người
  trông giữ vườn hoa sen *Paduma* bên đường lộn của vua ở thành Tivarā. Khi
  Đức Phật tới ngồi bên hoa sen ấy, bóng Ngài không rời bậc Mâu-ni; người kể
  thấy cây asoka nở hoa, dựng lễ vật rõ ràng và dâng lên cúng dường Đức Phật
  với tâm hân hoan. Vì việc cúng dường Phật ấy, trong chín mươi tư kiếp người
  kể không còn biết đến đọa xứ nào; tính cả thì ba mươi bảy kiếp, có mười sáu
  vị sống trong rừng, đều đầy đủ bảy báu quý giá và là Chuyển Luân Vương có
  đại uy lực; và chứng bốn vô ngại giải trong giáo pháp của Đức Phật.
  **Công thức `:7.1` — đo lại.** Điều kiện đo: Pāli chứa `Itthaṁ sudaṁ` **và**
  `abhāsitthāti`, quét toàn tầng `vietnamese-project/sutta/kn`. Đo lúc tôi
  chạy: **417** khoá dùng *…đã nói **những** bài kệ này*, **35** khoá dùng
  *…đã từng nói **bài kệ này***, cộng 1 câu lạ (`cp35:18.1`) không theo công thức.
  Brief ghi 407 / 21; tôi tin phép đo của mình và nêu rõ ở đây. `imā gāthāyo` là
  số **nhiều**, nên nhóm 417 là nhóm đúng; tệp này đã ở nhóm đó và tôi giữ
  nguyên văn.
  **`translationTitle` phải BẰNG ĐÚNG `:0.3`, và đây là chỗ tệp cũ sai.**
  Tệp cũ ghi *Kinh Kệ Của Trưởng Lão Asokapūjaka*. Đo tiền lệ ở **phạm vi gần
  nhất** (`tha-ap183`–`tha-ap212`, 27 tệp có `translationTitle`): *Bài Kệ Tuyên
  Ngôn* **11**, *Ký Sự* **5**, *Bài Kệ Tuyên Ngợ* **4**, *Kinh Kệ Của Trưởng Lão*
  **4**, *Tự Thuật Của Trưởng Lão* **3**. Cả tầng `tha-ap` (428 tệp): *Bài Kệ
  Tuyên Ngợ* **200**, *Ký Sự* **94**, *Bài Kệ Tuyên Ngôn* **72**, *Kinh Kệ Của
  Trưởng Lão* **28**, *Tự Thuật Của Trưởng Lão* **9**, *Truyện Kệ* **6**. Tôi
  theo đa số gần nhất và **bỏ** mẫu *Kinh Kệ Của Trưởng Lão*. Về *Tuyên Ngợ /
  Tuyên Ngôn*: gần nhất **Ngôn 11 vs Ngợ 4**, cả tầng nghiêng ngược (**Ngợ 200
  vs Ngôn 72**) vì nhiều lát cũ nhân bản chính tả sai *Ngợ*. Tôi theo đa số gần
  nhất (đúng chính tả) và **giao người biên tập phán một lượt cho cả cuốn** —
  hai phạm vi cho hai đa số khác nhau, không tự dọn lẻ từng tệp.
  **Chính sách số thứ tự ở `:0.3`: Pāli `:0.3` của bài này KHÔNG bắt đầu bằng số**
  (`Asokapūjakattheraapadāna`), nên bản Việt cũng không có số. Cùng phẩm có
  những tệp khác Pāli có số (`2 Tiṇasanthāraka…`, `8. …Muṭṭhipūjaka…`) và tôi
  giữ số ở đó; ở đây không thêm — không tệp nào thêm số ở chỗ Pāli không có.
  **`:0.1` giữ nguyên dạng Pāli, có tiền lệ đếm được.** `Therāpadāna` được giữ
  ở **376/385** tệp `tha-ap` có bản dịch. Đây là **một** khoá có Pāli giữ nguyên
  sang bản Việt, có chủ đích. `:0.2` đo riêng theo từng phẩm vì cùng một Pāli
  phải nhất quán trong phẩm: `Tamālapupphiyavagga` 7 tệp ⇒ *Phẩm Tamālapupphiya*
  **5** thắng *Phẩm Hoa Tamāla* **2**. Tôi theo 5.
  **`:8.1` — số thứ tự đo theo chữ Pāli, không đoán.** `catutthaṁ` được dịch thành
  *thứ tư* ở **5/8** tệp (3 tệp dùng *thứ bốn*). Bài này `catutthaṁ` ⇒ *thứ
  tư*.
  **Nhịp nháy: đúng như Pāli, chạy qua khoá.** Pāli mở `“` ở `:1.1` và đóng `”`
  ở `:6.3`. Tôi **không** làm mỗi khoá tự cân: `:1.1` mang `“`, `:6.3` mang `”`,
  các khoá khác không dấu. Phép kiểm so **từng khoá** cả hai vế và cả nháy đơn
  `‘’`; 28/28 khớp.
  **Dấu lược `:6.2`.** Pāli là `…pe…` nên bản Việt giữ **đúng một** `…` và
  **không** mở rộng. Không có khoá nào dùng `…` trần, không khoá nào còn `(…)`.
  **Thuật ngữ — tiền lệ đếm được, không tự đặt.** `Paṭisambhidā catasso` ⇒
  *Bốn vô ngại giải* (dùng chung ở **393** tệp; gần nhất 5/5);
  `kataṁ buddhassa sāsanaṁ` ⇒ *đã làm tròn lời dạy của Đức Phật* (gần nhất
  5/5); `Duggatiṁ nābhijānāmi` ⇒ *Tôi không còn biết đến đọa xứ nào* (tiền lệ
  nhiều nhất trong tầng, đã dùng nguyên văn); `buddhapūjāyidaṁ phalaṁ` ⇒ *đó là
  quả báo của việc cúng dường Đức Phật*; `Catunnavutito kappe` ⇒ *chín mươi tư
  kiếp*; `Sattaratanasampannā` ⇒ *Đầy đủ bảy món báu quý giá*;
  `cakkavattī mahabbalā` ⇒ *là Chuyển Luân Vương có đại uy lực* (gần nhất 4/7;
  cả tầng còn *đại oai lực* và *đại thần lực* — tôi theo gần nhất, vì `mahabbalā`
  là **sức mạnh**, còn *thần lực* là thần thông nên lệch nghĩa);
  `Tivarāyaṁ pure ramme` ⇒ *Ở kinh đô Tivarā xinh đẹp* (dùng lại nguyên văn
  `tha-ap236:1.1`); `sayambhū sappabho` ⇒ *Đấng Tự Tại ấy có dáng vẻ đẹp đẽ*;
  `puṇḍarīka` ⇒ *hoa sen trắng*; `rañño baddhacaro ahaṁ` ⇒ *tôi là người canh
  giữ cho nhà vua*; `gaṅgā` (ở bài kế) ⇒ *sông Hằng*.
  **Tên riêng giữ dạng Pāli — đếm được.** `Asokapūjaka` đã có sẵn ở `:7.1` của
  chính bài này (giữ nguyên); 33 tệp cùng công thức trong tầng đều giữ tên Pāli
  có dấu. `Uyyānapālo` và `Paduma` cũng giữ dạng Pāli. Lý do: đây là **tên
  riêng**, và bịa tên Việt cho tên riêng là bịa nghĩa. Riêng `Paduma` tôi dịch
  kèm *hoa sen* vì `paduma` là tên loài hoa, đọc trần `Tên là Paduma` khiến
  người đọc không biết đó là cái gì.
  **Câu lời-kết đã đọc lại từng cặp.** Tôi in toàn bộ 28 cặp Pāli ↔ Việt và đọc
  lại sau khi ghi; không phát hiện lỗi chủ thể, phủ định, số lượng hay lệch khoá
  nào. Số đã kiểm lại bằng công thức số Pāli: `Catunnavuti` = **94**,
  `soḷasa` = **16**, `sattati` = **37**. Riêng `Sattatiṁsamhito` không có tiền lệ
  bản dịch nào trong tầng; tôi tách nó thành *Tính cả thì ba mươi bảy kiếp* —
  `sattati` = 37 có tiền lệ xác nhận ở `tha-ap285:4.1` và `tha-ap198:6.1`
  (`Sattatiṁse ito kappe` → *ba mươi bảy kiếp*), và hậu tố `-saṃhito` là dấu
  *tính cả*.
  **BẤT ĐỊNH — ghi rõ, không giấu, và không bịa để lấp.**
  (1) `tha-ap196:3.4` `jalajuttamanāmino`. Có thể là *tâm hân hoan vì đóa hoa sen
  tuyệt nhất* (`jalaja` = hoa sen, `uttama` = bậc nhất, `nāma` = tâm) — tôi chọn
  cách này vì nó nối tiếp `Buddhassa abhiropesiṁ` ở `:3.3` và giữ đủ ba vế. Có
  thể khác là `nāma` = *tên*, khi đó câu kệ là *gọi tên là [đóa sen] bậc nhất*.
  Cách nào cũng không đổi hành động đã kể, nên **không blocking**; ghi ở đây để
  biên tập đo lại nếu có sớ giải.
  (2) `tha-ap196:3.2` `piṇḍibhāraṁ sudassanaṁ`. Tôi dịch *lễ vật được bày biện rõ
  ràng*; `piṇḍibhāra` là món lễ vật dạng cơm trộn. `sudassana` là tính chủ thể
  của *bày biện rõ ràng* — tôi đặt nó vào `lễ vật`, không phải vào hành động
  dâng lên, vì `Buddhassa abhiropesiṁ` ở `:3.3` đã mang hành động. Ghi ở đây.
  (3) `tha-ap196:5.1` `Sattatiṁsamhito` — xem mục trên; chưa chắc là số **tổng**
  hay số **kể từ mốc nào**, tôi chọn cách ít giả định là *tính cả*.
  (4) `tha-ap196:2.4` `chāyā na jahi taṁ muniṁ` — `chāyā` là cái bóng (không
  phải hào quang), và `na jahi` là *không hề rời bỏ*. Tôi dịch vậy; đây là chỗ
  dễ lẫn với hào quang, ghi ra để rõ.
  **Lỗi bản nháp thật trong tầng mà tôi đo được và BÁO, không tự sửa** (đều ngoài
  lát n42):
  (a) `tha-ap192:5.1` `Teraseto kappasate` đang dịch *mười bảy ngần kiếp*;
  `teraseta` = 13.000 và hậu tố `-to` là dấu nhân nghìn — đúng kiểu đã dịch chuẩn
  ở `tha-ap145:4.1` (`Soḷaseto` → *một nghìn sáu trăm kiếp*) và `tha-ap19:7.1`
  (`Satasahassito kappe` → *một trăm ngàn đại kiếp*). Đúng là **mười ba nghìn**.
  (b) `tha-ap140:4.1` `Sattarase kappasate` đang dịch *chín mươi tư kiếp trước*;
  `sattarase` = **1.700**, và chính Pāli này ở `tha-ap143:3.1` đã dịch đúng là
  *một nghìn bảy trăm kiếp*.
  (c) `tha-ap241:2.1` `Aṭṭhārase kappasate` đang dịch *Từ tám trăm kiếp trước*;
  `Aṭṭhārase` = **1.800**, và **29** tệp khác trong tầng đều dịch *một ngàn tám
  trăm*.
  (d) `tha-ap186:5.1` `Ito terasakappamhi` đang dịch *Cách đây mười ba kiếp về
  trước* — **thiếu nhân nghìn**: `terasakappa` = 13.000 kiếp.
  (e) `tha-ap48:4.1` `Sattatālīsito kappe` đang dịch *bốn mươi bảy kiếp*;
  `sattatālī` = 7 + 60 = **sáu mươi bảy**.
  (f) `tha-ap140:1.4` `agamaṁ buddhasantikaṁ` đang dịch *đã đến dự lễ tế của
  tôi* — thêm *của tôi*, không có trong Pāli.
