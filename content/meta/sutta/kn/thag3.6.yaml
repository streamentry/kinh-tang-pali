    - "Sai chiều của mệnh đề tại `thag3.6:3.3`: Pāli `Brahmacariyānuciṇṇena` và bản Anh đã ghim đều chỉ theo chiều *đã không bỏ rơi phạm hạnh*, còn bản Việt viết *với việc không bám nơi phạm hạnh* — tức chiều ngược lại, thành *không giữ phạm hạnh*. Đây là chỗ bản Việt đi ngược bản Anh đã ghim mà không ghi lại lý do ở bất kỳ đâu, và câu cũng không thành tiếng Việt."
