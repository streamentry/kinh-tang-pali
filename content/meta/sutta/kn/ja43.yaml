notes: |-
  9 khoá, phủ đủ, ngoặc kép cân. Không có blocker.
  
  **Sujato lệch chiều ở đây và bản dịch đã bám Pāli.** Sujato đặt `1.1` = *One who does not follow advice when instructed* và `1.2` = *by an ally who wants to help* — **đảo** so với Pāli (`Yo atthakāmassa hitānukampino` = kẻ mong điều lành cho người, lòng thương tế). Bản dịch căn đúng Pāli: `1.1` → *Kẻ mong điều lành cho người, lòng thương tế*, `1.2` → *đã được khuyên dạy mà vẫn không làm theo lời dạy*. Đây là lần thứ tư trong lô thấy Sujato lệch, và lần thứ hai liên tiếp trong nhóm Tăng Bộ của rv7.
  
  **`Ovajjamāno na karoti sāsanaṁ` → *đã được khuyên dạy mà vẫn không làm theo lời dạy*.** `ovajjamāno` là dạng bị động của √vaj "khuyên dạy"; bản dịch dịch thành câu chủ động ghép "được khuyên dạy" là đúng. `na karoti sāsanaṁ` → *không làm theo lời dạy* ✓.
  
  **`Evaṁ so nihato seti` → *Người ấy hủy diệt vì thế*.** `nihato` (bị hủy diệt) + `seti` (tiêu diệt) là hai từ cùng hướng; bản dịch gộp thành *hủy diệt* là gọn và không mất ý. `Veḷukassa yathā pitā` → *như cha của Veḷuka* ✓ giữ đúng quan hệ so sánh (y như cha của).
  
  **Tự mâu thuẫn trong lô: tên phẩm `0.3`.** Pāli `Atthakāmavagga` — bản dịch ghi *Phẩm Mong Điều Lành*, còn `ja48` (cùng lô, cùng Pāli) ghi *Phẩm Mong Muốn Lợi Ích*. Đây là biến thể **thứ năm** trong tầng, sau `ja41`+`ja48`+`ja49` (*Mong Muốn Lợi Ích*), `ja42`+`ja46` (*Cầu Điều Lành*), `ja44`+`ja47` (*Atthakāma*), `ja45` (*Lời Nói Tử Tế*). `atthakāma` là "mong muốn điều lành / lợi ích", nên *Mong Muốn Lợi Ích* sát Pāli hơn và cũng là nhóm nhiều nhất. Nhưng nguyên nhân phân mảnh có sẵn từ trước lô này, nên tôi trừ `terminology` chứ không ghi blocker.
  
  **`Veḷukajātaka` → *Kinh Veḷuka* ✓** giữ nguyên dấu, khớp `2.1`.
  
