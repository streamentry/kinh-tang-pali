    `npm test`, `npm run check`, `npm run build`.
  - >-
    Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công
    cụ) dịch lại bài từ Pāli không xem bản dự án; so 8 khoá chênh lệch lớn nhất
    (`0.4`, `1.1`, `2.1`, `3.1`, `5.1`, `5.2`, `5.3`, `5.4`) → khác nghĩa 0: sửa
    0, giữ 8, bất định 0 mới. Hai khoá tiêu đề `0.4`, `3.1` chỉ khác cách đặt
    tên (bản mù viết *Chuyện Tiền Thân*); bốn khoá tóm lược `5.1`–`5.4` bản mù
    tách tên riêng ra từng từ, bản dự án giữ nguyên từ Pāli, cùng nghĩa; `1.1`
    *không bờ bến* so với *không bờ bên kia* chỉ khác diễn đạt của `anantapāra`;
    `2.1` cả hai bản đều đọc `na hissa tādisaṁ` là *đối với kẻ ấy không có điều
    như thế*. Bản mù ghi không chắc ở `1.1`, `2.1`, `5.1`–`5.3` nhưng chỗ ấy bản
    dự án cũng chỉ giữ nguyên từ Pāli hoặc cùng nghĩa với bản mù. Review đối
    kháng toàn bài (19 khoá) không tìm thêm lỗi thật. Không có bản Anh hay bản
    Việt độc lập khác.
