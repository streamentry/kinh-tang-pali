  - >-
    **VIỆC BIÊN TẬP của người điều phối (cùng PR):** khoá `ja230:0.2` mang Pāli
    `Dukanipāta` được đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng
    **tên** của chính SuttaCentral tại commit đã ghim
    (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`)
    ghi `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng
    `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa /
    dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính
    xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of the Ones"*. Tầng
    này trước đợt sửa có **17** cách cho `Dukanipāta`, **6** cho `Asadisavagga`:
    đó là     lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
    mới.     `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng
    của bài.
  - >-
    **Sửa lan 2026-10-13 — viết lại 8 khoá thân bài (`1.1`–`1.4`, `2.1`–`2.4`);
    các giải nghĩa gốc từ ở hai mục "Đây là bài khó nhất" và "`2.1`–`2.4` còn mơ
    hồ" bên trên là SAI và bị mục này thay thế (không xoá để giữ lịch sử).**
    Cũng sai là lời viện dẫn bản Anh Sujato ở mục `2.1`–`2.4`: bản chụp đã ghim
    không có bản Anh nào cho bài này (coverage 0/0). Mỗi từ dưới đây tra từ
    chính Pāli và tiền lệ của tầng Việt. Trước → sau: `1.1` *đạo quân vô lượng*
    → *Cờ hiệu vô lượng* (`dhaja` = cờ; `tha-ap1:17.4`, `tha-ap60:1.4` dịch
    *cờ*; *đạo quân* là thêm nghĩa, không có trong Pāli); `1.2` *như biển cả mà
    bầy quạ khó khuất phục* → *khó bị bầy quạ khuất phục, như biển cả*
    (`duppasahaṁ dhaṅkehi sāgaraṁva`; `dhaṅka` = quạ, đúng như `sn10.3:3.4`,
    `cnd23:116.4`, `ja531:39.4`; bản cũ ở mục trên gọi `dhaṅka` là "cơn mưa rào"
    — sai); `1.3` *như núi kiên cố, trước sức gió khó lay chuyển* → *như núi khó
    bị gió khuất phục* (`duppasayho` cùng gốc với `duppasahaṁ` ở `1.2` và
    `duppasaho` ở `1.4`, nên cả ba giữ cùng một chữ *khó bị … khuất phục*; *kiên
    cố*, *lay chuyển* không có trong Pāli); `1.4` chỉ đổi *nay* → *hôm nay*
    (`ajja`), còn lại giữ bản cũ. `2.1` *Đừng hối hận, bậc ngu ngốc, chớ thốt
    lời thế ấy* → *Chớ nói nhảm lời ngu dại; đối với kẻ ấy đâu có điều như thế*
    (`bāliyaṁ` là danh từ trung tính *sự ngu dại*, không phải hô cách *bậc ngu
    ngốc*; `vilapi` = nói nhảm, than van — `mn35:24.4` dịch `vilāpaṁ vilapitaṁ`
    là *lời nói nhảm*, không phải *hối hận*); `2.2` *kẻ biết kìm hãm thì đâu có
    tìm được cách hủy hoại* → *ngươi bị thiêu đốt, vì chẳng tìm được ai ngăn
    cản* (`viḍayhase` = ngôi thứ hai bị động của `ḍah` *cháy*, chủ thể là
    *ngươi* như `labhase`, không phải *kẻ biết kìm hãm*; `nisedhakaṁ` = người
    ngăn chặn, không phải *cách hủy hoại*); `2.3` *dù đã bám víu như con voi,
    một mình đi lại* → *ngươi xông vào, như xông vào con voi đi một mình*
    (`āsajjasi` = ngươi xông vào/đụng độ, `gajamiva ekacārinaṁ` = như [xông vào]
    con voi đi một mình; bản cũ biến `āsajjasi` thành *bám víu* và `gajamiva`
    thành một mệnh đề riêng); `2.4` *thì kẻ nào đá bằng chân vào nó như dùng gậy
    dài trăm trượng để đập cho nát"vậy* → *con voi ấy sẽ lấy chân giẫm nát ngươi
    như cây sậy* (`naḷa` = cây sậy, không phải "trăm" — bản cũ bịa đơn vị chiều
    dài; `yo` là con voi, `taṁ` là *ngươi*, `padā` là *bằng chân*,
    `pothayissati` là tương lai *đập/giẫm nát*; chữ *vậy* dư thay cho `ti` đã
    bỏ). **Bất định, không phân xử được vì không có bản Anh, chú giải hay tiền
    lệ:** (1) `na hissa tādisaṁ` ở `2.1`: `assa` có thể là sở hữu/dành cách *của
    nó, đối với nó* (cách đang dịch) hoặc dạng khả năng của `as` *sẽ là*; (2)
    `viḍayhase` ở `2.2` có thể là *bị thiêu đốt* hoặc *bị nung nấu* (0 tiền lệ
    trong tầng); (3) `dhaja` ở `1.1` là cờ hiệu hay đạo quân do cờ hiệu làm đại
    diện; (4) ai nói với ai (người nói `1.1`–`1.4` tự nhận khó bị khuất phục,
    người nói `2.1`–`2.4` cảnh báo bằng hình ảnh con voi) — Pāli không nêu, nên
    không thêm chủ thể. Điểm đổi (bản cũ cao hơn thực tế vì nhiều khoá sai nghĩa
    và bản Anh được viện dẫn không tồn tại): `semantic_fidelity` 9,1 → 8,4;
    `grammar_logic` 9,0 → 8,4; `terminology` 9,1 → 9,0; `triangulation` 8,8 →
    7,8 (không có bản Anh nào, không có tầng Việt hiện hành, chỉ có tiền lệ từ
    vựng); `vietnamese_clarity` 9,1 → 8,6; `ambiguity_integrity` 9,0 → 8,2;
    `final_score` 9,23 → 8,86 (trung bình thô). Status giữ nguyên theo yêu cầu
    của lượt này; `final_score` 8,86 thuộc khoảng `review` của bảng quality
    gate, nên cần chốt lại bằng `npm run quality -- --apply`. Kiểm: 19/19 khoá
    khớp Pāli, nháy kép khớp Pāli từng khoá (`1.1` mở, `1.4` đóng, `2.1` mở,
    `2.4` đóng), không dấu lược, 0 Pāli lọt sang bản Việt, 0 cặp Pāli trùng
