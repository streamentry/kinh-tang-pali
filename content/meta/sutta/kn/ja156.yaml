notes: |-
  Đủ 15/15 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Pāli trùng nguyên văn, dùng lại — bốn vế này tôi đã tra ra trước khi viết, đây là phần dễ sai nhất của bài:
  · `Bhāvayaṁ kusalaṁ dhammaṁ,` trùng an4.37:7.3 → tu tập pháp thiện,
  · `yogakkhemassa pattiyā;` trùng ja55:1.4 và ja56:1.4 → để mong đạt sự an ổn, thoát khỏi gông trói;
  · `Pāpuṇe anupubbena,` trùng iti17:3.5, ja55:1.5, ja56:1.5 → sẽ tuần tự đạt đến
  · `sabbasaṁyojanakkhayan”ti.` trùng iti17:3.6, ja55:1.6, ja56:1.6 → sự tận diệt mọi kiết sử.”
  Dùng lại nguyên văn đã có làm cho năm vế của cả bài đọc liền một mạch với thig2.5 và thig2.6 trong cùng lát, và tránh dịch lần hai câu đã có bản Việt đang dùng.
  `āraddhavīriyo` → đã phát khởi tinh tấn (tinh tấn là cách dùng cố định của tầng cho vīriya).

  Chỗ chưa chắc:
  · `pahaṭṭhā` tôi dịch là bị đánh bại. Nghĩa gốc là bị dẫm phá; bối cảnh là quân của người khác bị hủy nên đánh bại là cách đọc tự nhiên, ghi lại vì nó là chuyển nghĩa nhẹ.
  · `jīvaggāhaṁ agāhayi` tôi dịch ông biến nó thành nơi bắt mạng chúng sinh. `agāhayi` = biến thành/làm cho, `jīvaggāha` = túm lấy mạng sống. Tôi không thêm “trên đất của tôi” dù đó có thể là ngụ ý, vì Pāli không nói.
  · `alīnacitta` tôi dịch tâm không dao động. `alīna` là bền vững / không suy sụp; ở 1.1 cách này khớp vì câu kệ ca ngợi tâm vững như đã phá được quân địch. Lưu ý: cùng từ này ở 1.1–1.2 mang nghĩa tốt (tâm vững đắc thắng) nhưng ở câu kệ 2.1–2.2 là lời mô tả đời sống của tỳ-kheo; tôi giữ nghĩa vững ở cả hai chỗ vì đó là nghĩa của một từ, không phải nghĩa thêm do tôi chế ra.

  LỖ HỔNG TẦNG THAM KHẢO: Không có tầng tham khảo English Sujato tại commit đã ghim: đã duyệt .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ và không có tệp cho uid này (0/15 khoá có prose), và tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên Khuddaka Nikāya cũng không có bản Hòa thượng Thích Minh Châu; bài dịch chỉ từ Pāli, chưa đối chiếu được tầng tham khảo nào nên giữ draft. Mọi khoá Pāli dưới 40 ký tự nên mẫu số coverage rỗng, bài vẫn giữ draft vì không có tầng tham khảo nào để đối chiếu. Bản Việt hiện hành không có cho Jātaka.

  BỐN XUNG ĐỘT THUẬT NGỮ ĐANG TREO — xem đầy đủ ở ghi chú của ja152: Dukanipāta tôi chọn Tập Kẻ Đau Đớn cho hai bài Jātaka của lát này vì đó là đa số trong Jātaka (31 bài so với 13), còn Bộ Hai Bài Kinh cho bốn bài Trưởng Lão vì đó là đa số trong Theragāthā/Therīgāthā. Daḷhavagga → Phẩm Tàn Tật (4 bài so với 1). Tôi không sửa bài ngoài lát.

  Kiểm thủ công trên TOÀN BỘ 15 khoá (kiểm() rỗng): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược bằng Pāli (cả hai phía 0), nháy kép cân (mở ở 1.1, đóng ở 2.6), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja156:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.
