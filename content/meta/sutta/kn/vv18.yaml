notes: |-
  **Phạm vi: đủ 69/69 khoá của `all`.** Không khoá nào bị bỏ, không khoá nào ngoài tập Pāli;
  thứ tự khoá đúng thứ tự Pāli; NFC; không khoá rỗng; không khoảng trắng thừa; Pāli không lọt
  sang bản Việt (ngoại trừ tên riêng giữ nguyên chữ La-tinh).

  Nguồn: dịch từ Pāli root đã ghim (`source/upstream-manifest.json`, commit `11c9d708`, tầng
  `pali`, treeSha `4d736429`). Không có tầng Anh — xem `blocking_errors`. Không có bản Việt hiện
  hành (HT. Thích Minh Châu: `vietnamese-current` chỉ có 26 tệp Pháp Cú). Bài là kệ đối thoại
  giữa Tôn giả Moggallāna và một thiên nữ cõi Ba Mươi Ba, từng là nữ tỳ trong kiếp người.

  **Tiền lệ đo được (đếm bằng script trên toàn tầng `kn`, 71 tệp `vv` đã dịch, loại bài này).**
  Khoá Pāli của bài này trùng nguyên văn với một khoá đã dịch ở nơi khác trong tầng: **21/69**.
  Bản Việt dùng đúng dạng đa số ở **20/21**. Một khoá khác dạng đa số (`6.2` `gotamassa yasassino;`):
  chỉ có 2 tiền lệ, hai dạng khác nhau (hoà 1–1: *của Đức Gotama lẫy lừng danh thơm;* ở `vv21:1.2`
  và *của Đức Gotama đầy danh vọng;*) ⇒ tôi chọn dạng của `vv21`, cùng phẩm `Cittalatāvagga`,
  khớp `vv19:10.4`.
  · Khối kệ hỏi `2.1`–`4.4` giống nguyên văn Pāli ở các bài `vv` anh em; dùng lại nguyên văn bản
    dịch phổ biến nhất của từng khoá, gồm cả `3.1` *Tôi hỏi ngài, này thiên nữ*, dù ba khoá kế dùng
    *nàng* — đó là hình thức đã thành quy ước của cả khối, tôi không đổi một khoá cho lệch.
  · `0.1` `Vimānavatthu` giữ nguyên Pāli **69/71**; `0.2` `Itthivimāna` → *Chuyện Cung Điện Nữ Hư
    Không* **41/43**; `0.3` `Cittalatāvagga` → *Phẩm Cây Hoa Cittalatā* **9/9**.
  · `0.4`/`17.1`: header của phẩm này là *N. Chuyện Cung Điện …*; khoá kết là *Cung Điện …, thứ N*
    (`vv20`, `vv21`, `vv22`, `vv26`; `vv19` cũng vậy). Tôi theo `vv19`: *1. Chuyện Cung Điện Nữ Tỳ*
    … *Cung Điện Nữ Tỳ, thứ nhất.* `Dāsī` dịch *nữ tỳ* (`thi-ap13` *nữ tỳ đội ghè nước*, `thig6.4:1.4`
    *tỳ nữ*), là danh từ chung chứ không phải tên riêng, cùng cách `vv11`–`vv14` dịch tên theo nghĩa.
  · `7.1` `Kāmaṁ bhijjatuyaṁ kāyo,` giống nguyên văn `cp13:6.1` và `thag4.12:2.1` (2/2): dùng
    *Thân xác này dù có bị tan nát,*.
  · `1.3`–`1.4` `nārīgaṇapurakkhatā` song song với `thig6.4:1.4` `dāsīgaṇapurakkhatā` *được đoàn tỳ
    nữ vây quanh trước sau* ⇒ *được đoàn nữ nhân vây quanh trước sau*.
  · `9.3` `Saṭṭhi tūriyasahassāni`: `tha-ap41:3.1` `Saṭṭhitūriyasahassehi` đã dịch *sáu mươi ngàn
    nhạc cụ*. Phép tính số: saṭṭhi 60 × sahassa 1.000 = **60.000** (*sáu mươi ngàn*). Không có số
    nào khác trong bài ngoài `pañcannaṁ` (5, `7.3` *năm giới điều*, khớp `vv15:9.1` … `vv26:6.1`
    *năm giới điều* 6/6) và `tidasānaṁ` (`14.4`, xem dưới); `paṭhamaṁ` = *thứ nhất* (`17.1`).
  · `tidasānaṁ` → *chư thiên Ba Mươi Ba*: tiền lệ `ja391:2.4` *ba mươi ba vị trời* (`tidasānamindo`);
    tầng cũng dùng *Ba Mươi Ba* cho `tāvatiṁsa` (`ud3.2`, `ud5.3`, `ud8.6`). Pāli `tidasa` nghĩa đen
    là *ba mươi*; tôi giữ cách đọc đã có trong tầng, không tự đổi.
  · `sakka` giữ *Sakka*; `devindo` → *chúa chư thiên* (`ud3.7` *Sakka, vua trời*; `tha-ap` *chúa
    chư thiên*); `moggallānena pucchitā` → *bị Tôn giả Moggallāna truy hỏi* (15/16 tệp cùng Pāli).
  · `tādino` (`6.4`) → *vị bất động như vậy* (`ud3.1`, `ud3.7`, `ud3.8`, `ud4.7`: 4 khoá; *bình
    thản* ở `snp1.9`, `snp3.11`: 2 khoá; đa số theo nghĩa *bất động*).
  · `vasavattino` (`9.2`) → *bậc có quyền tự tại* (`iti22`, `iti95`, `iti112` *tự tại*; `ja405:1.2` *có
    quyền lực*).
  · `nikkamo`/`nikkamassa` (`6.3`, `8.3`) → *sự nỗ lực*: `ja305:4.4` *kiên trì và nỗ lực*; không dịch *xuất gia* vì `7.1`–`8.4` nói về sự bền chí giữ năm giới ngay trong lúc
    có thể tan thân, không nói chuyện bỏ nhà ra đi.
  · `accharā` → *tiên nữ* (`tha-ap30:7.4`, `tha-ap50:5.4` *được các tiên nữ vây quanh*); `devatā`
    → *thiên nữ* / *nữ thiên* (như `vv10`…`vv26`).
  · `tūriya` → *nhạc cụ* (`tha-ap41`, `tha-ap102`).
  · Tên các thiên nữ (`11.1`–`12.2`) giữ nguyên chữ La-tinh có dấu, như `vv23:5.1` (*Soṇadinnā*);
    `vv28:9.x` (phần *Tóm lược*) dịch ba tên bằng cách khác nhau (*Soṇḍinnā*, *Bhaddeyyī*), không
    phải tiền lệ cho tên riêng ở thân bài.

  **BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ** (đã ghi, chưa im lặng; không thêm vào thân kinh):
  · `10.1`–`10.4` `Ālambo gaggaro bhīmo, sādhuvādī ca saṁsayo; Pokkharo ca suphasso ca, viṇāmokkhā ca
    nāriyo.` Pāli chỉ liệt kê tên; không có chứng cứ trong tầng ghim cho việc đây là tên nhạc cụ
    hay tên thiên nữ (các dạng đầu kết `-o` giống số ít giống đực, còn `nāriyo` là *các nữ nhân*, và
    `12.3` `Etā caññā ca` *những vị này cùng các vị khác* gom lại như một danh sách thiên nữ). Tôi
    giữ nguyên tên (phiên âm) và dịch `nāriyo` là *các nữ nhân*, **không** quyết đây là nhạc cụ hay
    người. `viṇāmokkhā` có thể là một tên ghép hoặc hai tên (`Viṇā` + `Mokkhā`); tôi giữ một từ.
  · `11.4` `puṇḍarīkāti dāruṇī` → *Puṇḍarīkā và Dāruṇī*: đọc `dāruṇī` là tên (danh sách thiên nữ
    cùng loại ở `vv50:26.2` cũng chỉ ghi `puṇḍarīkātidāruṇī`); nếu `dāruṇī` là tính từ (*dữ tợn*) thì
    câu đổi nghĩa.
  · `12.3` `seyyāse` → *nơi giường nằm*: hình thái hiếm, không có tiền lệ trong tầng (**0** khoá). `12.3`
    `Etā caññā ca seyyāse, / accharānaṁ pabodhikā` có thể đọc là *những tiên nữ đánh thức* (như tôi
    dịch, khớp `9.4` `paṭibodhaṁ karonti me`) hoặc *những vị đánh thức trong số các tiên nữ*.
  · `7.2` `neva atthettha saṇṭhanaṁ` → *nơi đây cũng chẳng có gì trụ vững*: đọc `atthi + ettha`; một
    cách đọc khác là `attha` (mục đích) cho *ở đây không có mục đích nào trong sự tồn tại*.
  · `9.1` `Āmantanikā raññomhi` → *Tôi là người được vua triệu thỉnh*: `āmantanikā` không có tiền lệ
    trong tầng (**0** khoá); tôi đọc `rañño + amhi`.
  · `5.2` `Dāsī ahosiṁ parapessiyā kule` → *tôi là nữ tỳ trong gia đình, làm kẻ sai bảo của người
    khác*: `parapessiyā` không có tiền lệ (**0** khoá). Pāli không nêu gia đình nào.
  · `16.1` `sahabyakāmānaṁ` → *mong muốn được cùng chung sống*: Pāli không nêu đối tượng (có thể là
    chư thiên cõi này); tôi không thêm.
  · `2.2` `kena te idha mijjhati;` giữ *Do đâu nàng có được nơi này;* như `vv10`…`vv19` (14/16 khoá cùng Pāli);
    `mijjhati` nghĩa đen là *thành tựu, thành công*, nên bản Việt chung của khối này hơi lỏng.
  · Chữ *hiện khưởi* (sai chính tả) tồn tại ở **13** khoá của tầng (`vv10:2.3`, `vv13:2.3`, `vv3:2.3` …); bài này dùng
    *hiện khởi* (đúng chính tả; 18 khoá khác trong tầng). Lỗi đã có ngoài lát này, không sửa.

  **Nháy kép.** Pāli: mở `“` ở `1.1` và `5.1`, đóng `”` ở `3.4` và `16.4` (2 = 2); không có nháy
  đơn. Bản Việt đặt đúng các vị trí ấy; đã kiểm *khớp Pāli từng khoá* với cả bốn loại `“”‘’`:
  0 lệch / 69 khoá. Khoá `13.1`–`13.4` là lời của các thiên nữ nằm *bên trong* lời thiên nữ chính
  (đến `16.4`); Pāli không đánh nháy riêng ⇒ bản Việt cũng không.

  **Dấu lược.** Pāli không có `…pe…` và không có `…` ở khoá nào; bản Việt cũng không có ⇒ 0 = 0.

  **Phép đo Pāli trùng nguyên văn trong chính bài.** Dò toàn bộ 69 khoá: **0** nhóm Pāli trùng ⇒
  phép này chạy **rỗng**, không phải *đạt*.

