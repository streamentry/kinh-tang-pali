  · `nikkamo`/`nikkamassa` (`6.3`, `8.3`) → *sự nỗ lực*: `ja305:4.4` *kiên trì và nỗ lực*; không dịch *xuất gia* vì `7.1`–`8.4` nói về sự bền chí giữ năm giới ngay trong lúc
