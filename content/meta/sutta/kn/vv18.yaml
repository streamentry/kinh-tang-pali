  **BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ** (đã ghi, chưa im lặng; không thêm vào thân kinh):
  · `10.1`–`10.4` (đã đối chiếu lại lượt 2026-10-14) `Ālambo gaggaro bhīmo, sādhuvādī ca saṁsayo; Pokkharo ca suphasso ca, viṇāmokkhā ca
    nāriyo.` Pāli chỉ liệt kê tên; không có chứng cứ trong tầng ghim cho việc đây là tên nhạc cụ
    hay tên thiên nữ (các dạng đầu kết `-o` giống số ít giống đực, còn `nāriyo` là *các nữ nhân*, và
    `12.3` `Etā caññā ca` *những vị này cùng các vị khác* gom lại như một danh sách thiên nữ). Tôi
    giữ nguyên tên (phiên âm) và dịch `nāriyo` là *các nữ nhân*, **không** quyết đây là nhạc cụ hay
    người. Chứng cứ thêm trong tầng (chỉ một nơi song song, `vv50:24.3`–`25.2`): dãy tên này đứng ngay sau `Saṭṭhi tūriyasahassāni, paṭibodhaṁ karonti me` (nhạc cụ đánh thức tôi) và
    tách khỏi dãy tên nữ sau đó (`Nandā ceva sunandā ca …`) bằng chữ `nāriyo`; điều ấy gợi ý đó là các loại nhạc cụ, nhưng Pāli không nói rõ và
    toàn tầng chỉ có 2 khoá chứa các tên này (`vv18`, `vv50`), nên **không** đủ để phân xử: giữ bất định, không đổi bản dịch. `viṇāmokkhā` có thể là một tên ghép hoặc hai tên (`Viṇā` + `Mokkhā`); tôi giữ một từ.
  · `11.4` `puṇḍarīkāti dāruṇī` → *Puṇḍarīkā và Dāruṇī*: đọc `dāruṇī` là tên (danh sách thiên nữ
    cùng loại ở `vv50:26.2` cũng chỉ ghi `puṇḍarīkātidāruṇī`); nếu `dāruṇī` là tính từ (*dữ tợn*) thì
    câu đổi nghĩa.
  · `12.3` `seyyāse` → *nơi giường nằm*: hình thái hiếm, không có tiền lệ trong tầng (**0** khoá). `12.3`
    `Etā caññā ca seyyāse, / accharānaṁ pabodhikā` có thể đọc là *những tiên nữ đánh thức* (như tôi
    dịch, khớp `9.4` `paṭibodhaṁ karonti me`) hoặc *những vị đánh thức trong số các tiên nữ*.
  · `7.2` `neva atthettha saṇṭhanaṁ` → *nơi đây cũng chẳng có gì trụ vững*: đọc `atthi + ettha`; một
    cách đọc khác là `attha` (mục đích) cho *ở đây không có mục đích nào trong sự tồn tại*.
  · `9.1` `Āmantanikā raññomhi` → *Tôi là người được vua triệu thỉnh*: `āmantanikā` không có tiền lệ
    trong tầng (**0** khoá); tôi đọc `rañño + amhi`.
  · `5.2` `Dāsī ahosiṁ parapessiyā kule` → *tôi là nữ tỳ trong gia đình, làm người hầu của người
    khác*: `parapessiyā` (`para` + `pessiyā`) không có đúng dạng này ở nơi khác (**0** khoá), nhưng `pessa`/`pesiya` ở toàn tầng dịch *người hầu*
    (`an4.198`, `an5.148`, `an7.47`, `an9.20`, `pv37:46.3` …); *kẻ sai bảo* (bản trước) dễ đọc ngược thành người ra lệnh. Pāli không nêu gia đình nào.
  · `16.1` `sahabyakāmānaṁ` → *mong muốn được cùng chung sống*: Pāli không nêu đối tượng (có thể là
    chư thiên cõi này); tôi không thêm.
  · `2.2` `kena te idha mijjhati;` giữ *Do đâu nàng có được nơi này;* như `vv10`…`vv19` (14/16 khoá cùng Pāli);
    `mijjhati` nghĩa đen là *thành tựu, thành công*, nên bản Việt chung của khối này hơi lỏng.
  · Chữ *hiện khưởi* (sai chính tả) tồn tại ở **13** khoá của tầng (`vv10:2.3`, `vv13:2.3`, `vv3:2.3` …); bài này dùng
    *hiện khởi* (đúng chính tả; 18 khoá khác trong tầng). Lỗi đã có ngoài lát này, không sửa.

  **Nháy kép.** Pāli: mở `“` ở `1.1` và `5.1`, đóng `”` ở `3.4` và `16.4` (2 = 2); không có nháy
  đơn. Bản Việt đặt đúng các vị trí ấy; đã kiểm *khớp Pāli từng khoá* với cả bốn loại `“”‘’`:
  0 lệch / 69 khoá. Khoá `13.1`–`13.4` là lời của các thiên nữ nằm *bên trong* lời thiên nữ chính
  (đến `16.4`); Pāli không đánh nháy riêng ⇒ bản Việt cũng không.

  **Dấu lược.** Pāli không có `…pe…` và không có `…` ở khoá nào; bản Việt cũng không có ⇒ 0 = 0.

  **Phép đo Pāli trùng nguyên văn trong chính bài.** Dò toàn bộ 69 khoá: **0** nhóm Pāli trùng ⇒
  phép này chạy **rỗng**, không phải *đạt*.

  **MẪU SỐ CỔNG COVERAGE — đo được.** Theo `source/layers.yaml` (`substantivePaliMinChars: 40`,
  `excludeReferenceBlock: true`): ngoài block `:0` có **65** khoá, độ dài Pāli lớn nhất **35** ký
  tự ⇒ **0** khoá có nội dung ≥ 40 ký tự ⇒ **mẫu số = 0**, nên cổng coverage **không đo được gì** ở
