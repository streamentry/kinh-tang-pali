    toàn tầng không có đa số (*bất động*, *vững vàng*, *như thế/như vậy*, *như như*, *bình thản* đều có), nên theo tiền lệ của đúng dòng này,
    và `tassa` (*ấy*) không còn bị bỏ.
  · `vasavattino` (`9.2`) → *bậc có quyền tự tại* (`iti22`, `iti95`, `iti112` *tự tại*; `ja405:1.2` *có
