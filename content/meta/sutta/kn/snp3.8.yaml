  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 3.2 ("luôn luôn sợ rụng" → "sợ rụng lúc sớm mai": `pāto` là bất biến từ, DPD "early; in the morning"; chú giải Mahāniddesa giải `paccūsakāle` "lúc rạng đông", chú giải Suttanipāta giải `pāto pāto niccakālaṃ patanti` "mỗi sớm mai, thường xuyên rụng", nên ý "thường xuyên" là phần chú giải rút ra và đã có ở `niccaṁ` của 3.4 "thường trực"; Sujato đọc "always"; khớp mnd6:23.2).
