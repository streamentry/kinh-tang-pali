notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Lớp tham khảo: KHÔNG có Anh Sujato ở commit đã ghim, không có lớp lấp english-project, không có bản Việt
  hiện hành cho Milindapañha. Toàn bài dịch từ Pāli root; triangulation hạ xuống 7.0.
  Tiền lệ dùng lại: Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc (5 bài đã có) ·
  Rājā āha— → Vua nói: · Na hi, bhante → Không phải, bạch tôn giả (mil3.7.12, mil3.7.14) ·
  Āma, bhante → Vâng, bạch tôn giả · Kallosi → Khéo lắm, thưa tôn giả Nāgasenā ·
  ekena pāṇātipātena niraye uppajjeyyā → kẻ nào giết một người sẽ sinh vào địa ngục · vasā devesu → sinh lên
  cõi trời · uppilav → nổi lên.
  Bất định đã ghi nhận. Vāhasata tôi dịch là trăm xe chở đá, vì vāha là một xe chở; đây là đơn vị đo lượng
  bên cạnh hòn đá ở 2.1 nên giữ hình ảnh xe chở. Buddhaguṇa không có tiền lệ trong tầng; tôi dịch là phẩm
  chất của Đức Phật. Satiṁ paṭilabheyya → được một chút; māraṇakāle → khi đến giờ chết.
  Câu hỏi thật của vua là hai mệnh đề ngài không tin, và tôi dịch đủ cả hai; không thêm lời giải thích nào.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0. Nháy kép: cặp mở ở 1.2 và đóng ở 1.3; cân trên cả bài.
  Kiểm kỹ thuật: save_vi chạy sạch; tự quét MỌI 13 khoá. Đợt này cấm chạy npm run validate, test, check,
  build nên không tuyên bố technical gate pass; bốn lệnh đó để người điều phối chạy, technical_integrity 9.8.
