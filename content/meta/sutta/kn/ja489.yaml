notes: |-
  Đợt 19, làn 78. Dịch từ Pāli root commit đã ghim, đủ 109/109 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem phần bất định).

    **Tiêu đề.** `0.1` “Jātaka”, `0.2` “Bộ Tạp Tập”, `0.3` “Phẩm Ruộng Lúa” dùng lại đúng bản Việt của các bài anh em `ja484`, `ja486`, `ja487`, `ja488` (0.2 và 0.3: 4 bài, 0 lệch; 0.1: “Jātaka” 482 khoá so với “Chuyện Tiền Thân” 16 khoá). `0.4` “6. Kinh Suruci” theo khuôn “N. Kinh <tên>” của `ja486:0.4`, `ja487:0.4`, `ja461:0.4`; `26.1` “Kinh Suruci, thứ sáu.” theo `ja474:14.1` và `ja488:25.1` (có dấu phẩy trước số thứ tự); `chaṭṭhaṁ` = 6 ⇒ “thứ sáu”, khớp `6.` ở `0.4` và đứng sau `ja488` (5.) trong cùng phẩm.

    **Tiền lệ dùng lại nguyên văn.** Dò toàn tầng bằng so khớp Pāli sau khi bỏ dấu câu và hoa/thường, loại `0.1`: 32 khoá của bài này có Pāli trùng với khoá đã có bản Việt, tổng 126 cặp; trong đó 55 cặp bản Việt khác. Phần lớn là khác có chủ ý hoặc khác do vế nói khác ngôi:
    - `3.4`, `6.4`, `9.4`, `11.4`, `13.4`, `15.4` (= `snp5.1:8.4` “nguyện đầu ngài vỡ thành bảy mảnh!”): giữ cấu trúc, đổi “ngài” thành “tôi” vì người nói tự thề (`me` ở `3.3`).
    - `1.3` (= `ja461:13.1` “Suốt mười ngàn năm,”): dùng lại, chỉ hạ chữ hoa vì đứng sau dấu chấm phẩy. `2.2` (= `ja160:1.2`, `ja494:2.4`, `ja494:6.2` “Vedeha, chủ thành Mithilā”): dùng lại, chỉ khác dấu câu cuối.
    - `2.6` (= `ud5.4:4.4` “dù công khai hay kín đáo”): dùng lại; `sn10.5:6.4` viết “lén lút”, chọn “kín đáo” vì đây là lời tự biện hộ của một người nữ đức hạnh (4 khoá “kín đáo” so với 1 khoá “lén lút”).
    - `5.4` (`rattindivamatanditā`): “ngày đêm không biếng nhác mỏi mệt” theo `thig5.4:3.2`, `thi-ap36:17.2` (3 khoá cùng Pāli và cùng bản Việt) so với 1 khoá “ngày đêm không mệt mỏi” (`iti93:8.2`); `atandita` chứa nghĩa “lười nhác”, nên chọn bản có cả hai vế.
    - `14.2` “và ngày thứ tám nửa tháng” (13 khoá, so với 3 khoá “mồng tám của nửa tháng” và 1 khoá “thứ tám của nửa tháng”); `14.3` “cùng cả tuần lễ thần biến” (8 khoá, so với 5 khoá “cùng kỳ phép nhiệm màu”, 2 khoá “và cả tuần lễ thần biến”); `14.4` “trọn vẹn đầy đủ tám chi phần” (11 khoá, so với 5 khoá “viên mãn đầy đủ tám phần”). `14.1` “Ngày mười bốn, ngày mười lăm” theo `sn10.5:2.1` và `an3.37:5.1`.
    - `14.6` (`sadā sīlesu saṁvutā`): “luôn thu thúc trong các giới” theo `pv39:21.2` (3 khoá); 6 khoá `vv15`, `vv19`, `vv22`, `vv23`, `vv25`, `vv37` viết “giới hạnh giữ mình trong sạch”: không dùng, vì “trong sạch” không có trong Pāli và `sadā` bị bỏ. Đây là chỗ lệch với đa số của tầng (6 so với 3), ghi lại để người biên tập phán.
    - `21.4` (= `sn3.16:3.4` “con dâu tôn kính mẹ chồng như thiên thần, trung tín với chồng”): bỏ “con dâu” vì chủ ngữ đã là “người nữ nào” ở `21.2`; giữ phần còn lại.
    - `24.2` (`ubhayattha kaṭaggaho`): “một lần thắng ở cả hai phía” theo `mn60:12.5`, `mn60:20.5`, `mn60:28.4` (“thắng ở cả hai phía”); `thag7.1:4.4` viết “ở cả hai việc đều thắng trận”.
    - `12.1` (= `ja468:10.1` “Cả với sa-môn lẫn bà-la-môn”): bỏ “với” vì ở đây là tân ngữ của `tappemi` (`12.3`). `20.4` (= `ja458:4.2` “tôi đã đến bên nàng”): bỏ chủ ngữ vì `20.3` đã nêu “chính ta”.
    - `2.3` và `2.4`: `nābhijānāmi` → “tôi không nhớ mình đã” theo `an4.55:2.1`, `an7.53:10.3` (cùng mẫu “không nhớ ... ”). `tha-ap330:6.1` (cùng Pāli `Nābhijānāmi kāyena`) viết “Không phải tôi không biết bằng thân,” là lỗi ngoài lát: phủ định kép làm sai nghĩa. Báo, chưa sửa.
    - `ja160:1.2` (cùng Pāli `vedehaṁ mithilaggahaṁ`) và `ja494`: dùng lại “Vedeha, chủ thành Mithilā”.

    **Trùng nguyên văn trong chính bài:** 4 nhóm Pāli trùng, 0 nhóm mà bản Việt khác về nghĩa: bốn dòng `Etena saccavajjena / putto uppajjataṁ ise / Musā me bhaṇamānāya / muddhā phalatu sattadhā` lặp ở 6 khổ (`3`, `6`, `9`, `11`, `13`, `15`); bản Việt giống hệt nhau ở cả 6 khổ, trừ `15.4` kết bằng nháy đóng `”` theo đúng Pāli `sattadhā”.`.

    **Số Pāli:** `dasa vassasahassāni` (1.3) = `dasa` 10 × `sahassa` 1.000 = 10.000 ⇒ “mười ngàn năm”, khớp `ja461:13.1`. `soḷasitthisahassāni` (7.1) = `soḷasa` 16 × `sahassa` 1.000 = 16.000 ⇒ “mười sáu ngàn phụ nữ”. `cātuddasiṁ` (14.1) = 14, `pañcaddasiṁ` (14.1) = 15, `aṭṭhamī` (14.2) = 8, `aṭṭhaṅga` (14.4) = 8 ⇒ “tám chi phần”, khớp `sn10.5:2.1`–`2.4`. `sattadhā` (3.4 …) = 7 ⇒ “bảy mảnh”, khớp `snp5.1:8.4`, `dn3:1.20.3`. `sahassakkha` (20.3) = `sahassa` 1.000 + `akkha` mắt ⇒ “Ngàn Mắt”, cùng cách với `sn11.12:5.1`, `ja488:19.3`. `ubhayattha` (24.2) = hai nơi/hai phía, đối chiếu `24.3` và `24.4` đếm đủ hai điều (sinh lên cõi trời, danh tiếng ở đời này). `chaṭṭhaṁ` (26.1) = 6, khớp `6.` ở `0.4`.

    **Thuật ngữ và tiền lệ đã đo:**
    - `mahesī` (1.1) → “hoàng hậu”: `an10.45:1.5`, `mn51:10.5`, `mn94:12.5`, `an4.198:6.5`, `dn3:1.15.8` (14 khoá chứa `mahes…`, trong đó 5 khoá nghĩa hoàng hậu đều là “hoàng hậu”; `aggamahesī` ở `sn19.15:1.3` là “hoàng hậu chánh cung”).
    - `vedeha`/`mithilaggaha` (2.2): xem trên. `Suruci` giữ nguyên Pāli (tên riêng; 0 khoá khác có `Suruci` làm tên, chỉ có `suruci` là tính từ “rực rỡ” ở `mn92:16.1`).
    - `brāhmaṇa` → “bà-la-môn” viết thường, như các bài `ja` khác; `isi` → “ẩn sĩ”.
    - `saccavajja` → “lời tuyên thệ chân thật”: `cp30:7.1`, `ja463:13.5` (44 khoá chứa `saccavajj…`; 2 khoá đã dịch cùng dạng `Etena saccavajjena`).
    - `muddhā phalatu sattadhā` → “đầu ... vỡ thành bảy mảnh” theo `snp5.1:8.4`, `dn3:1.20.3`, `mn35:13.13`, `an9.11:14.2` (5 khoá).
    - `sassu` / `sasura` → “mẹ chồng” / “cha chồng”; `bhattu` → “chồng” (`an4.55:2.1` dùng “chồng”).
    - `ānītā` (1.2) → “được đưa về”: `an4.55:2.1`, `an4.55:2.4`, `an7.53:10.3` (30 khoá chứa `ānīt…`/`ānay…`).
    - `vinetar` (4.3) → “người dẫn dắt”: `tha-ap22:2.3` “Bậc Dẫn Dắt”, `snp3.4:36.1` “Vị đã dẫn dắt” (2 khoá).
    - `dhammacārinī` (5.2) → “sống theo pháp”: `ud4.8:6.3`, `ud4.8:8.2` (37 khoá chứa `dhammacār…`).
    - `sapattī` (8.4) → “người vợ chung chồng”: `thig11.1:1.2` “làm vợ chung với chồng” (2 khoá chứa `sapatt…`).
    - `dāsa` + `kammakara` + `pessa` (10.1) → “tôi tớ”, “người làm công”, “người sai việc”: `dn31:32.1`, `dn31:34.5` (“tôi tớ”, “người làm công”); `dn5:18.2` dịch “nô bộc, người phục vụ, công nhân”.
    - `anujīvin` (10.2) → “sống nương nhờ”: `sn3.20:5.4`, `an3.48:4.6` (7 khoá).
    - `sahadhammena` (10.3) → “đúng theo lẽ phải”: `dn4:19.2` (57 khoá chứa `sahadhamm…`, nghĩa không đồng nhất).
    - `vanibbaka` (12.2) → “kẻ ăn xin”: `sn3.21:11.2` “những kẻ ăn xin khác”, `sn3.24:9.3` “kẻ khất thực” (19 khoá chứa `vanibbak…`).
    - `annapāna` (12.3) → “cơm và nước”: `sn3.24:9.4`. `tappeti` (12.3) → “làm thỏa mãn”: `sn3.24:9.3`.
    - `payatapāṇi` (12.4) → “bàn tay rộng mở”: `sn55.6:17.6`, `sn55.39:2.7` (27 khoá chứa `payatapāṇ…`, đều thuộc công thức `muttacāgo payatapāṇi`).
    - `uposatha` (14.5) → “ngày trai giới”: `pv39:21.1` “Tôi sẽ giữ ngày trai giới”.
    - `rajojalla` (18.1) → “bụi đất bám đầy thân”: `dn8:14.18`, `dn25:8.16` (34 khoá chứa `rajojall…`).
    - `vehāyasa` + `agha` (18.2) → “đứng giữa không trung”: `ja465:1.2` “đứng giữa trời”, `vv41:1.4` (8 khoá chứa `vehāyas…`).
    - `hadayaṅgama` (18.4) → “thấu tim”: `dn1:1.9.5` “thấu tim” (22 khoá). `manuñña` (18.3) → “dễ nghe”: `ja28:1.3` (1 khoá có `manuññaṁ bhās…`).
    - `sudhammā` (20.2) giữ nguyên Pāli, tên hội trường: `dn21:1.12.48` (“hội trường Sudhammā”), `dn19:2.1` (20 khoá). `sahassakkha` (20.3) → “Ngàn Mắt”; `sakka` giữ nguyên Pāli.
    - `devasaṅgha` (20.1) → “các chúng chư thiên”.
    - `medhāvinī` / `sīlavatī` (21.3) → “có trí tuệ”, “có giới hạnh”: `sn3.16:3.3`.
    - `samacārinī` (21.2) → “sống ngay thẳng”: `ud4.8:6.3` dịch `samacārino` là “sống an tịnh” (3 khoá), nhưng nghĩa ấy ở đây không hợp cho người nữ có đức hạnh ở nhà chồng, nên chọn “ngay thẳng” (xem bất định 11).
    - `sassudevā patibbatā` (21.4): xem trên.
    - `amānusā` (22.4) → “những bậc không phải người”: chỉ chư thiên theo ngữ cảnh `devā` ở `22.3`; chỉ 1 khoá trong tầng.
    - `suciṇṇa` / `sucarita` (23.1–23.2) → “việc thiện đã làm”, “thiện hạnh”.
    - `sabbakāmasamiddhinī` (23.4) → “đầy đủ mọi điều ước muốn”: `pv24:8.2` “nàng đầy đủ mọi điều ước muốn” (`vv29:3.2` viết “làm cho mọi ham muốn được thành tựu”).
    - `kaṭaggaha` (24.2): xem trên. `devalokūpapatti` (24.3) → “sự sinh lên cõi trời” (`an3.18:1.2` “thọ sinh vào cõi trời”, 1 khoá).
    - `tidiva` (25.3) → “cõi trời”: `sn3.21:15.5`, `tha-ap9:9.4` (10 khoá chứa `tidiv…`).
    - `rājaputti` (16.2, 24.1) → “công chúa”: `ja458:9.2`. `bhadde` → “hỡi hiền nữ”: `pv10:1.3`, `pv10:3.5` (115 khoá chứa `bhadd…`, mỗi nơi một cách dịch).
    - `pavedeti` (19.4) → “cho biết”: `ja476:1.4`, `ja478:3.4` (4 khoá chứa `pavedaya`, “hãy cứ nói ra”).

    **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá, lệch 0/109 khoá; không có nháy đơn trong Pāli của bài. Pāli có 4 nháy mở (`1.1`, `16.1`, `18.1`, `20.1`) và 4 nháy đóng (`15.4`, `17.4`, `19.4`, `25.4`); `25.4` kết `dassanan”ti` ⇒ `.”` theo đa số tầng (306 khoá `.”` so với 156 khoá `”.`). Lời nói trải qua nhiều khổ: khổ `1`–`15` (mở ở `1.1`, đóng ở `15.4`), khổ `16`–`17`, khổ `18`–`19`, khổ `20`–`25`. Pāli không có `…`, không có `(…)`, nên bản Việt không có.

    **Coverage English (mục 7):** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng là 26 ký tự (< 40) nên 0/109 khoá có nội dung; các khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja489` (tra `source/upstream-manifest.json`: chỉ có `kn/ja/ja489_root-pli-ms.json`, tầng Pāli; Sujato chỉ có 83 tệp trong `kn/ja`, không gồm uid này; không suy từ tên thư mục); `english-project`: 0 (`content/translation/en/project/sutta/kn/` và `content/meta/en/` không có tệp nào cho uid này); `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng tham khảo đều vắng ⇒ `triangulation` đặt 7,0 (≤ 8,0), `status: draft` + blocker. Bài chỉ đối chiếu với Pāli root và tiền lệ nội bộ.

    **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
    1. Cấu trúc kệ: bản root chỉ có các kệ, không có văn xuôi nêu ai nói. Đọc từ ngữ cảnh: `1`–`15` là lời của một hoàng hậu nói với một đạo sĩ trên không (xưng `brāhmaṇa` ở 2.1, 4.3 `brahme`, `ise` ở 3.2); các khổ `3`, `6`, `9`, `11`, `13`, `15` là lời thề chân thật, mỗi khổ trước đó kể một đức hạnh; `16`–`17` là lời đáp của đạo sĩ; `18`–`19` là lời của hoàng hậu hỏi lại; `20`–`25` là lời tự giới thiệu của Sakka (`Sohaṁ sakko sahassakkho`, 20.3). Người nói và người nghe không được ghi vào bản Việt.
    2. `Suruci` (1.1, 1.4, 2.5): đọc `Surucino bhariyā` (1.1) và `rājānaṁ ... Suruciṁ` (2.1–2.5, tân ngữ) là tên của nhà vua (`rājānaṁ vedehaṁ mithilaggahaṁ`), và người nói là hoàng hậu của ông. Bản root không nêu tên hoàng hậu.
    3. `Dasa vassasahassāni, yaṁ maṁ surucimānayi` (1.3–1.4): đọc `yaṁ` là “kể từ khi” và `maṁ ānayi` “đưa tôi về”; một cách đọc khác là đếm số năm sống làm chính hậu. `ānītā paṭhamaṁ ahaṁ` (1.2): “được đưa về đầu tiên” có thể là “đầu tiên trong các bà vợ” hoặc “lần đầu”. 0 khoá khác chứa `surucimānayi`.
    4. `atimaññittha` (2.5): đọc là ngôi thứ nhất, tân ngữ `Suruciṁ`: “tôi không nhớ mình đã khinh thường Suruci”. Dạng `-ittha` thường là ngôi thứ ba hoặc số nhiều; không có khoá nào khác trong tầng cùng dạng (59 khoá chứa `atimaññ…`, đều dạng khác). Giữ cách đọc theo mạch kệ (lời tự biện của người nói), cũng là cách `an4.55:2.1`, `an7.53:10.3` dùng mẫu `nābhijānāmi ... aticaritā`.
    5. `Bhattu mama sassu mātā` (4.1): đọc “mẹ của chồng tôi, tức mẹ chồng tôi” (`bhattu` + `mātā`, `sassu` đồng vị); không có khoá nào khác trong tầng cùng cấu trúc. `yāva aṭṭhaṁsu jīvitaṁ` (4.4): `aṭṭhaṁsu` là quá khứ, “suốt thời họ còn sống” đã bỏ sắc thái quá khứ.
    6. `kāmasā` (5.2): hapax toàn tầng (1 khoá), đọc “tự nguyện, theo ý mình”; có thể là “vì dục”. `ahiṁsāratinī` (5.1): “vui thích sự bất hại”; 0 khoá khác chứa `ahiṁsārat…`.
    7. `sahabhariyāni` (7.2): hapax toàn tầng (1 khoá), đọc “cùng làm vợ”; tân ngữ chung với `itthisahassāni`. `Hitena tāsaṁ nandāmi` (8.1): `hitena` ở cách công cụ, đọc “vui vì điều lợi ích của họ”; có thể là “vui với lòng thiện chí”.
    8. `Pesemi` (10.3): đọc “sai bảo (làm việc)”; có thể là “phái đi (thực hiện)”. `pamuditindriyā` (10.4) đọc là nữ số ít, bổ nghĩa cho người nói (“tôi, với các căn hoan hỷ”), vì tân ngữ `dāse kammakare pesse` là số nhiều nam/trung nên sẽ có dạng khác. 0 khoá khác chứa `pamuditindriy…`.
    9. `Dummī` (18.1): hapax của bài; trong toàn Pāli chỉ có 2 khoá chứa `dummī` (`ja543:102.1` chưa dịch, và khoá này); nghĩa chưa xác lập chắc. Dịch “dáng tiều tụy” là cách đọc dè dặt từ ngữ cảnh (đi cùng `rajojalladharo`); có thể là “lôi thôi, nhếch nhác”.
    10. `Devatānusi saggamhā` (19.1): đọc `devatā nu asi` “ngài có phải là vị thiên ... không”; `isi vāsi mahiddhiko` đọc `isi vā asi` “hay là ẩn sĩ”; `Ko vāsi tvaṁ` đọc `ko vā asi` “hay ngài là ai”.
    11. `samacārinī` (21.2): “sống ngay thẳng”; khác với `ud4.8:6.3` (“sống an tịnh”, `samacārino`, 3 khoá). Một cách đọc khác là “sống hòa hợp, ở yên với mọi người”. `sassudevā` (21.4): đọc “xem mẹ chồng như thiên thần”; một cách đọc khác là “có mẹ chồng là bậc đáng thờ như thiên thần”.
    12. `uppajjate` (17.4): hiện tại với nghĩa tương lai (“sẽ sinh ra”); `uppajjataṁ` (3.2): mệnh lệnh/nguyện cầu (“nguyện ... sinh ra”). `putto` (3.2, 17.4): “con trai” (nam), không nêu “cho tôi”/“cho nàng” ở 3.2; chỉ có `tava` (17.4).
    13. `dhammamattani pālaya` (25.2): đọc `dhammaṁ attani`, “hãy gìn giữ pháp nơi chính mình”; một cách đọc khác là “hãy tự bảo vệ trong pháp”. 1 khoá khác chứa (`ja534:68.2`, chưa dịch).
    14. `sumedhe` (25.1) và `sumedhāya` (22.1): đọc tính từ (“người có trí tuệ”, “người nữ rất thông tuệ”). Một cách đọc khác là `Sumedhā` ở 25.1 là tên của hoàng hậu; bản root không nêu tên nên không đưa vào thân kinh. Tầng có 178 khoá chứa `sumedh…`, đa số là tính từ hoặc tên người khác.
    15. `kaṭaggaho` (24.2): “lần thắng”, nghĩa gốc là ván thắng trong cờ bạc (xem `mn129:49.1`); `ubhayattha` đọc “cả hai phía”, tương ứng `24.3` (cõi trời) và `24.4` (danh tiếng ở đời này).
    16. `amānusā` (22.4): đọc đồng vị với `devā` (22.3), “những bậc không phải người”; một cách đọc khác là thuộc `mānusiyā` (“người nữ loài người, ... phi nhân”), nhưng không hợp văn.

