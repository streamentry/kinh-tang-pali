  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2008, dựa trên ấn bản Buddha Jayanthi). 3 khoá bất đồng nghĩa → sửa 1 (1.3 rakkhaso: trước "dạ-xoa" → sau "la-sát"; rakkhasa và yakkha là hai loài khác nhau trong Pāli, và tầng dịch hiện hành dịch rakkhasa là la-sát ở bv1:9.1, bv1:21.1, ja519:13.2, ja546:7.1), giữ 1 (1.2/3.2 dvipadindo: bản nguyên bài hiểu là "chúa tể của loài người", Pāli dvipada là loài hai chân và inda là chúa tể; giữ "bậc chúa tể loài hai chân"), bất định 1 (2.4 balino samitiṁ: bản nguyên bài đọc samiti là cuộc gặp gỡ với bậc có năng lực, bản dự án đọc là hội chúng của những kẻ hùng mạnh, tức nhóm la-sát mà vị ấy hái hoa cho; samiti trong tầng Pāli ghim chỉ có nghĩa hội chúng/đám đông ở tha-ap215:2.2, dhp321:1, ja493:1.1 nên giữ cách đọc của bản dự án, nhưng balino có thể là số ít chỉ một bậc có năng lực và Pāli một mình không phân xử được). Các số đếm đã đối chiếu đều khớp: 1.800 kiếp (6.1), mười lăm kiếp (7.1), bảy vị Chuyển Luân Vương (7.2). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
