      · `rakkhaso` → `dạ-xoa` (47 lần trong tầng).
    * `Sattaratanasampannā` → `Đầy đủ bảy món báu quý giá,` (65 khoá) ·
      `catudīpamhi issarā` → `là vua trên bốn châu lục.` (2 khoá) ·
      `cakkavattī mahabbalā` → `là các Chuyển Luân Vương có đại oai lực.` (22 khoá) ·
      `janādhipā` → `chúa tể muôn dân` (tha-ap41:5.2) · `…nāmenā/te` → `Đều mang tên gọi là …`
      (tha-ap41:5.3 `Đều mang tên gọi là Sahassarāja,`).
    * Số đếm `kappasahassa`: `Satta kappasahassamhi` (7 × 1.000) → `bảy nghìn kiếp` ·
      `Saṭṭhi kappasahassamhi` (60 × 1.000) → `sáu mươi nghìn kiếp` (tiền lệ
      `Saṭṭhikappasahassamhi` ở tha-ap54:11.1 và 2 khoá nữa) · `Pañca kappasahassamhi` → `năm
      nghìn kiếp`. Ở lát này không có `Tiṁsakappasahassamhi` nên không dính lỗi *ba mươi ngàn
      kiếp* — nhưng tôi vẫn thấy lỗi đó còn tồn tại ở `tha-ap54:6.3`
      (`Tiṁsakappasahassāni` → `Trong ba mươi nghìn kiếp,`), thuộc lát khác; `tiṁsa` = 3 và
      `kappasahassa` = nghìn nên phải là *ba nghìn kiếp*. Báo để người điều phối xử.
    * `caturo X nāmakā` → `có bốn vị mang tên là …;` (tiền lệ `caturo rāmanāmakā` ở
      tha-ap54:11.2) · `Sattaratanasampannā` như trên.

  BÀI NÀY (tha-ap173) — GHI RIÊNG. Đây là bài thứ nhất của Kumudavagga, cùng vị trưởng lão mà
  tha-ap322 (mười thứ của Ārakkhadāyakavagga) cũng kể. Bài kể Đức Phật ngồi thiền ở hồ lớn
  giữa núi Himavanta, ngắm hoa, và dâng hoa lên Đức Phật.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG BỊA.
    * `:2.2` `cakkamattāni jāyare` — xem blocker thứ tư. `cakkamatta` là hapax toàn Pāli root
      đã ghim (0/10.093 tệp khác). Nguồn duy nhất tra được: sổ tay Pāli–Myanmar (qua
      wisdomlib.org/definition/cakkamatta) giải `(1) có đo bằng đường kính bánh xe; (2) mỗi
      bánh xe`. Tôi giữ nghĩa đo được, không ghi vào thân kinh một số cánh hoa hay một hình
      dạng mà tôi không kiểm chứng được — khác hẳn tha-ap78:1.3 `Satapattehi sañchanno` là
      `trăm cánh`, nhưng đó là Pāli KHÁC nên tôi không mượn nghĩa của nó sang đây.
    * `:1.3` `Tatthajo rakkhaso āsiṁ` → `nơi ấy sinh ra một dạ-xoa`. Pāli `āsiṁ` là quá khứ của
      `asit` / `atthi` (có mặt) nhưng `jo` mang nghĩa `sinh ra`; tôi giữ cả hai ý.
    * `:2.4` `balino samitiṁ` → `là đám bạo quân lúc ấy`. `samiti` chỉ có 1 tiền lệ trong tầng
      (`tha-ap215:2.2` → `đám người`); ở đây `balino` (kẻ mạnh) đứng trước nên tôi dịch
      `đám bạo quân`, còn `parisā` ở `:5.2` dịch `đoàn người` để hai vế không lặp nguyên văn.
    * `:3.3` `Pupphasaṅkocitaṁ` → `bó hoa ấy`. `saṅkocita` là `buộc/gom thành bó`; 0 tiền lệ
      cho chữ này, nhưng có tiền lệ `paggayha` + đám hoa ở `tha-ap68:4.1` (`Cầm lấy đám hoa
      tối thượng`) nên tôi giữ hình ảnh bó hoa.
    * `:5.3` `Tāvacchadanasampanno` → `Đã tới nơi tận cùng ấy`. `tāva` = tới mức ấy, `chadana`
      = giới hạn, `sampanna` = viên mãn. 0 tiền lệ (hapax). Tôi dịch theo nghĩa cấu tạo và
      không suy ra thêm chủ thể.
    * `:7.1` `Ito pannarase kappe` → `Từ đây, ở kiếp thứ mười lăm`. 6 tiền lệ, 2–2–1–1 và
      không có đa số rõ; tôi chọn cách giữ cả `Ito` (từ đây) lẫn `pannarase kappe` (ở kiếp thứ
      mười lăm) thay vì rút gọn thành `Mười lăm kiếp về trước`, vì `Ito` là điểm mốc tính từ
      đây chứ không phải tính từ hiện tại.
    * `:7.3` `Sahassarathanāmā te` → `Đều mang tên gọi là Sahassaraṭha`. Tách âm theo
      `…ṭha + nāma` (giống `Sahassarājanāmena` ở tha-ap41:5.3 mà tầng dịch `Đều mang tên gọi là
      Sahassarāja,`). `Sahassaraṭha` là dạng có dấu lần đầu trong tầng Việt (0 tiền lệ); tôi
      giữ dạng Pāli vì tên riêng không dịch nghĩa, và ghi số 0 này để biên tập biết đây là
      tên mới chứ không phải lỗi quên dấu.
    * `:4.1` `Upāgatañca sambuddhaṁ` → `Và bậc Chánh Đẳng Giác đã đến`, còn `:5.4` `tathāgato` →
      `bậc Thế Tôn`. Tôi giữ hai danh xưng khác nhau vì `sambuddha` (tự Phật) mạnh hơn `tādi`
      / `tathāgata`; đo được `Tathāgata` không được giữ Pāli ở bất kỳ tệp nào trong tầng, còn
      `Chánh Đẳng Giác` có 136 tệp và `Thế Tôn` 472 tệp.
    * `Kumudaṁ pupphate` (2.1): `Kumuda` ở đây là bông sen (vế sau là `taṁ pupphaṁ` và cả khối
      kể chuyện hái hoa dâng lên), không phải tên người — dù tên vị trưởng lão là
      `Kumudamāliya`. Tôi giữ `kumuda` không dấu hoa như tiền lệ `tha-ap322:2.3` (`tràng hoa
      kumuda`).

  Giải quyết draft 2026-10-12: kiểm toán độc lập lại toàn bài 37 khoá từ Pāli; 21 khoá đổi, trong đó
  khoảng 17 khoá là lỗi nghĩa thật (đa số do bản cũ dịch vụn từng vế hoặc chép tiền lệ sai). Các
  mục cũ ở trên về `Sahassaraṭha`, `cakkamatta` là hapax, `saṅkocita` = bó hoa, `chadana` = giới
  hạn, `tathāgata` → Thế Tôn, `mahabbalo` → đại thần lực, `balino samitiṁ` → đám bạo quân và
  `Duggatiṁ nābhijānāmi` → Ta không biết mình rơi vào khổ đau nay bị THAY THẾ bởi các điểm dưới đây.
    * `:1.1–1.4` `Pabbate himavantamhi` = trên núi Himavanta; `mahājātassaro` = hồ nước tự nhiên
      lớn (tầng có 14 khoá `jātassara`, đa số dịch `hồ nước tự nhiên`); `Tatthajo rakkhaso āsiṁ`
      = TÔI là dạ-xoa sinh ở đó (`āsiṁ` ngôi thứ nhất, bản cũ làm mất chủ ngữ); `mahabbalo` = đại
      lực (bỏ `thần`, Pāli không có nghĩa thần).
    * `:2.2` `cakkamattāni` KHÔNG phải hapax về cấu tạo: `matta` là hậu tố đo lường rất thường
      (`-matta` = cỡ, chừng); tầng có đúng một nơi khác dùng chữ này, `tha-ap82:17.3`, đã dịch
      `lớn cỡ bánh xe`, nên `:2.2` nhất quán với nó. Nghĩa `cỡ bánh xe` có căn cứ cấu tạo từ và
      tiền lệ cùng chữ; blocker thứ tư của bản cũ GỠ.
    * `:2.3–2.4` bản cũ dịch `balino samitiṁ` thành đồng vị của đóa hoa (`là đám bạo quân`) — sai
      cú pháp. Nay đọc `samitiṁ` là tân ngữ chỉ mục đích: hái hoa cho hội chúng của những kẻ hùng
      mạnh (`balino` = những kẻ có sức mạnh, tức giới dạ-xoa). Cách đọc này hợp lý nhưng không có
      bản Anh đối chiếu; ghi vào bất định.
    * `:3.1` `Atthadassī` là TÊN Đức Phật (38 khoá cùng Pāli trong tầng, đa số giữ tên riêng, tiền
      lệ `Nhưng Đức Thế Tôn Atthadassī,` ở tha-ap414:35.1 và tha-ap431:2.1); bản cũ dịch thành
      `bậc Đã Thấy Pháp` làm mất tên. `dvipadindo` → `bậc chúa tể loài hai chân` (2 tiền lệ trọn
      nghĩa `indo`). `:3.4` `mama santikaṁ` → `đến bên tôi` (bỏ `nơi tôi ở`, Pāli không nói chỗ ở).
    * `:3.3` `Pupphasaṅkocitaṁ` hapax (0 khoá khác trong tầng); `saṅkocita` là phân từ của
      `saṅkoceti` (co lại, thu lại, gom lại). Dịch `hoa đã bị thu gom lại`; bản cũ `bó hoa` thêm
      hình ảnh `bó`. Còn bất định nhẹ: có thể hiểu hoa khép/héo lại; không đổi giáo nghĩa chính.
    * `:4.1–4.4` `Upāgatañca sambuddhaṁ` là tân ngữ (bản cũ làm thành mệnh đề độc lập `Và bậc Chánh
      Đẳng Giác đã đến`); nay `Khi … đã đến gần, … tôi nâng tất cả hoa lên, rồi dâng`. Bỏ `xuất
      chúng` thêm ở `:4.2`.
    * `:5.1–5.4` bản cũ `Đã tới nơi tận cùng ấy` và `là đoàn người` lệch hẳn. `chadana` = mái che
      (tầng có 67 khoá `chadan-`, đều là mái che/tấm che; hai bài song song `tha-ap117:3.1–3.2`
      `Suvaṇṇacchadanaṁ āsi, yāvatā parisā tadā` và `tha-ap492:14–17` có cùng khuôn `yāvatā parisā`
      + `chadana`). Nên: hội chúng ấy lúc đó có mặt đến tận cùng Himavanta; `tāvacchadanasampanno`
      = có mái che rộng chừng ấy; `tathāgato` → `bậc Như Lai` (391 khoá `tathāgato` trong tầng,
      đa số `Như Lai`; bản cũ `Thế Tôn` đổi danh xưng).
    * `:6.3` `Duggatiṁ nābhijānāmi` → `Tôi không còn biết đến đọa xứ nào`: bản cũ `Ta không biết
      mình rơi vào khổ đau` (135 khoá lan trong tầng) thêm `rơi vào`, đổi `duggati` (đường ác) thành
      `khổ đau`, lại dùng `Ta` trong khi người nói là `tôi` suốt bài (`:2.3`, `:4.3`). Dạng mới có
      108 khoá tiền lệ đúng nghĩa.
    * `:7.3` `Sahassarathanāmā` = `Sahassaratha` (`ratha` là xe, không có `ṭha`; chính tả cũ
      `Sahassaraṭha` sai). `:7.4` `mahabbalā` → `đại lực` (tầng đang chia: đại thần lực ~109, đại uy
      lực ~30, đại oai lực ~40; không dạng nào sát chữ, chọn `đại lực` đúng `mahā-bala` và thống
      nhất với `:1.4`).
    * Các khoá còn lại (`:0.x`, `:6.1`, `:6.2`, `:6.4`, `:7.1`, `:7.2`, `:8.x`, `:9.1`, `:10.1`) đọc
      đối kháng với Pāli, GIỮ NGUYÊN theo các tiền lệ đã đo ở trên.
