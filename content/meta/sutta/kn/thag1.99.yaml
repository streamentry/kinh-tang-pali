notes: |-
  **Tự kiểm, vì `cần` RỖNG.** `kiểm()` của `_hvi.py` không chạy assertion nào cho bài này. Tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá `all`, NFC, **số dấu lược khớp Pāli từng khoá**, ngoặc kép cân, không Pāli lọt, không `(…)`, không trùng Pāli, `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte. Dấu lược `1.7` = `… Uttiyo thero ….` → hai dấu, không mở rộng (BRIEF_VI3 §10.1).

  **`1.2`–`1.5` PĀLI TRÙNG Y HỆT `thag1.98`** → cùng một nguyên văn, kể cả sau khi review đối kháng sửa hai vế đó ở cả hai bài. Bản nháp đầu của tôi đã tự dịch riêng bốn vế này và lệch khỏi `thag1.98` ở `1.2` và `1.3`; review đối kháng bắt được và tôi gộp về một nguyên văn. Đó đúng là lớp lỗi *87 khoá cùng Pāli bị dịch theo hai cách* mà lát này cảnh báo.

  **Chỉ hai vị trí thật sự khác `thag1.98`, và cả hai tôi dịch khác:** `1.1` `Saddaṁ sutvā` → *Khi đã nghe tiếng* (thay *thấy sắc*), và `1.6` `Saṁsāraṁ upagāmino` → *hướng tới luân hồi* (thay *gốc của hữu*).

  **Tiền lệ, đếm được.** `saṁsāra` → *luân hồi* (**132** chỗ trong tầng — đây là tiền lệ mạnh nhất của lát này, vì thế tôi dùng nó ở `1.6` và để *gốc của hữu* cho `thag1.98:1.6`); *gốc của luân hồi* là **0**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: chỗ. `sati muṭṭhā` → *thất niệm* (59). `Piyaṁ nimittaṁ` → *tướng khả ái* (4 chỗ, `an3.68:3.2`). `Sārattacitto` → *tâm đầy dục ý* (đặt mới, xem `thag1.98`). `ajjhosa tiṭṭhati` → *chạy theo* (93). `vaḍḍhanti āsavā` → *lậu tăng trưởng* (`mn2:3.4`).

  **Tiêu đề bài.** English Sujato ghi *Uttiya (3rd)* — vì Pāli có ba vị Uttiya trong Ekakanipāta và bài này là bài thứ ba. Tôi dịch tiêu đề *Kinh Kệ Của Trưởng Lão Uttiya* như 19 bài thag/thig khác (giữ tên, không chép số đếm thứ tự vào tiêu đề), và **không** thêm *(lần ba)*; nếu biên tập muốn phân biệt thì phải tra `saṃyutta-khuddaka`, với tầng Việt hiện tại thế số *(3rd)* là của Sujato chứ không có tiền lệ Việt.

  **Bất định đã ghi.** `thag16.5` (chưa dịch, ngoài lát) có cùng `Sārattacitto vedeti, Tañca ajjhosa tiṭṭhati` — lát sau dịch `thag16.5` nên lấy lại nguyên văn hai vế đó.

  **Không có bản Việt tham khảo** tại commit đã ghim (`translation/vi/` bilara chỉ có 26 tệp Pháp Cú); `triangulation` là Pāli + English Sujato (10/11, thiếu dòng lược `1.7`).

  **`technical_integrity` 9,6** vì đợt này cấm `npm run validate|test|build`, và `kiểm()` rỗng với bài này.
