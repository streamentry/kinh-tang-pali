notes: |-
  `Rurumigarājacariya` trong `Hatthināgavagga`, `Cariyāpiṭaka`, `Sīlapāramī 6`. 55/55 khoá.

  **Đọc Pāli rồi mới kết luận văn phong: bài này là THƠ KỆ, không phải văn xuôi.** 13 kệ bốn câu (`1.1`–`12.4`) cộng một câu lục kết `13.1`; mọi khoá đều ngắn hơn 30 ký tự Pāli. Đã giữ nguyên nhịp bốn câu và dấu câu cuối từng khoá.

  **`translationTitle` đo theo `content/meta/sutta/kn/cp*.yaml`: 27/29 tệp đặt bằng đúng giá trị `:0.4`** (tên bài), 28/29 theo khuôn *Hạnh Của …*. Hai tệp lệch: `cp35` là uddāna nên không có tên riêng, và `cp3` chỉ lệch **chữ hoa** (`:0.4` viết *Hạnh Của vua Kururāja*, `translationTitle` viết *Hạnh Của Vua Kururāja*). Ở phạm vi gần nhất — 9 bài anh em cùng `Hatthināgavagga` — cả 9 đều theo `:0.4`. `cp16:0.4` = `Rurumigarājacariya` ⇒ *Hạnh Của Vua Hươu Ruru*. Ba tiêu đề còn lại theo đa số đo được: `:0.1` *Hạnh Tạng* 27/29 (1 tệp để nguyên Pāli, 1 uddāna); `:0.2` *Phẩm Hatthināga* 10/29; `:0.3` *Trì Giới Ba-la-mật Thứ Sáu* theo chuỗi `cp11`–`cp20` (mười khoá, liên tục *Thứ Nhất*…*Thứ Mười*).

  **Thuật ngữ, đều có tiền lệ đếm được.** `migarāja` → *vua hươu*, theo `ja385:4.1` (`Migarājā pure āsiṁ` → *Ta là vua hươu, trước kia*); tên `Ruru` giữ nguyên chữ như `cp20:11.3`. `mahārāja` → *đại vương*. `mā no vā` trong `11.4` → *Ngươi* (phong cách đối thoại xưng hô của chư vua trong tầng).

  **Pāli trùng nguyên văn, đã dùng lại nguyên văn bản dịch.** Trong chính bài này KHÔNG có cặp trùng nào (0/55) ⇒ phép đo nội bộ **chạy rỗng**. Đo toàn tầng `kn` thì 7/55 khoá có bản Pāli trùng byte, 72 khoá đối chiếu: **51 khoá khớp nguyên văn** với bản dịch đã có, 10 khoá lệch — mọi lệch đều có lý do:
  - `12.1`–`12.4` trùng `cp17:6.1`–`6.4` (`Anurakkhiṁ mama sīlaṁ` … `bodhiyāyeva kāraṇā”ti.`): lấy **y hệt** `cp17`, kể cả dấu `”`.
  - `12.2` còn trùng `cp19:11.2`, nhưng `cp19` dịch *ta không bảo vệ mạng sống của mình* vì vế trước `cp19:11.1` là `Iti sīlavataṁ hetu` (quan hệ nhân quả); ở `cp16` vế trước là `11.4` (mệnh lệnh của vua) và `12.1` đã là *Ta bảo hộ giới hạnh của ta* — tương phản, nên dịch *chứ không bảo hộ mạng sống của ta* là đúng, **không** phải lỗi.
  - `0.1` trùng 34 khoá: 25 tệp đã viết *Hạnh Tạng*, 8 uddāna bỏ trống, `cp34:0.1` để nguyên chữ Pāli. Theo đa số.
  - `1.1` trùng 24 khoá: 12 khớp nguyên văn; 6 tệp khác đã gộp dấu phẩy vào câu kế (`cp5` *Lại nữa, khi ta là*, `cp6` *Lại nữa, vào thuở xưa*, `cp23`, `cp28`, `cp32`, `cp34`) — ở `cp16` câu kế là khoá riêng đầy đủ nên giữ dấu phẩy như Pāli.

  **Bất định đã ghi, không đưa vào thân kinh.** `10.1`–`10.2` `Yāvatā karaṇaṁ sabbaṁ, / rañño ārocitaṁ mayā;` — `mayā` là công cụ của người báo tin, nhưng Pāli không nói rõ đó là Ruru hay kẻ được cứu; bản Anh đã ghim đọc `mayā` là "tôi" của **kẻ được cứu** và đổi cả hai khoá sang ngôi người ấy, còn bốn khoá ngay sau (`11.1`–`12.4`) lại quay về ngôi Ruru. Bản Việt giữ chủ thể kể chuyện là Ruru và dịch *Mọi việc đã xảy ra, / ta đều báo lên nhà vua.*, không thêm giải thích nào vào thân bài. `10.4` `tassa` và `10.6` `mittadubbhiṁ` cùng chỉ kẻ phản bội, cho nên nhà vua nhắm vào kẻ được cứu, và `11.3` `Tiṭṭhateso` là *xin tha người ấy*.

  **Dấu lược:** không khoá nào có `…pe…`, `…` trần hay `(…)` ở Pāli; bản Việt cũng **0** — phép đo chạy rỗng, đều đồng âm. Nháy kép `“”` và nháy đơn `‘’` so **từng khoá** với Pāli: 220 phép so, 0 lệch. Có 9 khoá nháy không tự cân (`1.1`, `6.3`, `6.4`, `8.3`, `8.4`, `10.5`, `10.6`, `11.3`, `11.4`) vì Pāli cố ý cho nháy chạy qua ranh giới khoá; Pāli và bản Việt cân **giống hệt** ở từng khoá.

  **Số Pāli, tự tính và in phép ra.** Bài chỉ có hai số: `0.3` `Sīlapāramī 6` (chữ số 6) ⇒ *Thứ Sáu*, và `13.1` `chaṭṭhaṁ`. `chaṭṭha` là thứ tự thứ sáu, kiểm bằng chuỗi thứ tự đo được ngay trong tầng: `cp1` *paṭhamaṁ* = thứ nhất · `cp2` *dutiyaṁ* = thứ hai · `cp3` *tatiyaṁ* = thứ ba · `cp4` *catutthaṁ* = thứ tư · `cp5` *pañcamaṁ* = thứ năm · `cp6` `chaṭṭhaṁ` = thứ sáu · `cp7` `sattamaṁ* = thứ bảy — 7/7 khớp, nên `cp16:13.1` = *thứ sáu*, và hai số của bài cùng ra **6**, khớp với `:0.3`. Không gặp `Tiṁsakappasahassa` hay bất cứ cụm số chưa phân xử nào.

  **Coverage English: cổng KHÔNG đo được gì — mẫu số bằng 0.** Đo theo đúng công thức `source/layers.yaml` (Pāli có nội dung ≥ 40 ký tự, loại khối tham chiếu `:0`): **0/55** khoá đạt ngưỡng, mẫu số = 0 ⇒ `ratio` đọc thành **1** theo đúng quy tắc của kho (`ratio: substantive === 0 ? 1`), và cổng vì thế không đỏ. **Đó là quy tắc của kho, không phải bằng chứng đối chiếu** — đừng đọc `published` của bài này là cổng coverage đã chứng minh tầng Anh đủ. Không ghi vào `reference-gaps.yaml`: không có khoá nào mất tầng.

  **Tầng tham khảo, đếm trực tiếp trên manifest chứ không suy từ tên thư mục.** Tầng `english-sujato` **có mặt** tại commit đã ghim: `source/upstream-manifest.json` liệt kê `sutta/kn/cp/cp16_translation-en-sujato.json`, và trong 55 khoá có **54** khoá có chữ, chỉ `13.1` (câu lục kết) để trống ⇒ tầng tham khảo Anh **thực sự dùng được cho 54/55 khoá**, không chỉ có tệp. `vietnamese-current` vắng: tầng này tại commit đã ghim có 26 tệp, toàn bộ là `dhp` (Pháp Cú). Lớp lấp `english-project` không có `cp16` và cũng không cần — không khoá nào bị Sujato bỏ trống ngoài câu lục kết. Do bản lấp Anh và bản Việt **không** cùng tác giả, đây là đối chiếu Anh độc lập, nên `triangulation` không bị hạ theo lý do "tự chấm bài mình".

  **Một khiếm khuyết của chính tầng Anh đã ghim, đã xử lý theo Pāli.** Ở `1.2` và `1.3` hai tệp **lệch khoá**: `1.2` mang *the king of deer named Ruru,* (thuộc Pāli `1.3`) và `1.3` mang *in appearance I was like burnished gold,* (thuộc Pāli `1.2`). Đã dịch theo Pāli — `1.2` *ta có dáng vẻ như vàng ròng đánh bóng* cho `sutattakanakasannibho`, `1.3` *Ta là vua hươu, tên là Ruru* cho `Migarājā ruru nāma` — cả hai nghĩa đều được tầng Anh xác nhận, chỉ là gắn sai chỗ.

