notes: |-
  Đủ 9/9 khóa. Bài duy nhất trong lát có Sujato (8/9 khóa; khóa 2.1 là câu
  kết công thức ngắn nên không có bản Anh, đúng mẫu chung). Đã đối chiếu
  Sujato từng vế: aṭṭhakkhura → tám móng; khara → con lừa (mn50, an3.82);
  sattahi kālātikkantaṁ → bảy lần trễ hẹn; ovadati → khuyên dạy (iti104).
  Pāli 1.1 không có động từ nhận lấy, hiểu ngầm theo Sujato (Please accept),
  đã ghi nhận. vaṅkātivaṅkin đọc theo Sujato là gian xảo (nghĩa đen là cong
  queo). na naṁ ovadituṁ ussahe → không dám khuyên dạy (ussahe là dám).
  Kharādiya giữ tên riêng theo Pāli; Sujato đặt tựa Accept the Ass, cách đọc
  khác là Kinh Con Lừa, đã ghi nhận. Hai vế đầu và hai vế sau là hai lượt lời
  khác nhau nên tách thành hai cặp ngoặc dù Pāli chỉ một dải ti. Sīlavagga →
  Phẩm Giới (20 tiền lệ). Không có tầng Việt hiện hành cho Jātaka nên
  triangulation 8.5. Không blocker, published.
