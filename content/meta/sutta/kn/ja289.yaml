  BẤT ĐỊNH CÒN LẠI. (1) Pāli không gọi tên ai là người nói ở `3.x`; từ `1.1` (`mahārāja` gọi vua) và mệnh lệnh số nhiều `paṭipādetha` (ra lệnh cho nhiều người thi hành) có thể suy ra vua đang ra lệnh, nhưng bản Việt KHÔNG nêu danh người nói, chỉ giữ mệnh lệnh *hãy cho*. (2) `Puṇṇikā` là tên riêng (cùng tên với nhiều nhân vật khác trong kho, ví dụ `thi-ap38`, `thig12.1`); bản Việt giữ nguyên tên và dịch `jammī` là *hèn hạ*, không thêm *nữ tỳ/người hầu* (chi tiết ấy thuộc chú giải, không có trong kệ). (3) `gāmavara` có thể hiểu *ngôi làng ưu tú* hoặc *một làng được ban làm ân thưởng*; chọn dạng đầu theo tiền lệ, cả hai cho cùng cảnh. Kỹ thuật: bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy trong lượt này, nên `technical_integrity` giữ 9,6.
