  BẤT ĐỊNH CHƯA PHÂN XỬ TRỌN VẸN, ĐÃ GHI LẠI. (1) **Ai nói ở `1.1`?** Pāli là
    `“Nānāchandā mahārāja, ekāgāre vasāmase; Ahaṁ gāmavaraṁ icche, brāhmaṇī ca gavaṁ
    sataṁ”.` — `mahārāja` là tế từ gọi vua, nên người nói không phải vua; tôi hiểu là bà-la-môn
    đang đòi đổi, và `Ahaṁ` là chính ông. Bằng chứng nội tại: `3.1` (`Brāhmaṇassa gāmavaraṁ`)
    mới là câu vua đáp, nên hai vế ở `1.3` và `1.4` phải là hai người muốn hai thứ khác nhau
    (ông muốn làng, người bà muốn trăm bò). Đây là suy luận, không phải dữ kiện văn bản.
    (2) **`udukkhalaṁbhikaṅkhati`** (`2.4`) = *`ambhikaṅkhati`* (tìm/ham muốn) + *`udukkhala`*
    (khổ đau); tôi dịch *tìm mà sinh lòng ham muốn đau khổ*. Từ điển không có trong kho, và
    cổ tự không phải Pāli; nếu `udukkhala` là động từ *gây khổ* thì câu này còn một nghĩa nữa,
    nhưng cả hai đều cho cùng một hành động của người bà-la-môn, nên nó không đổi nghĩa cảnh.
    Cả hai điểm đã ghi ở đây vì người biên tập có thể muốn xem lại cùng chú giải Jātaka.
