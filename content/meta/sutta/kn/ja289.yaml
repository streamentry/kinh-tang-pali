  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC. `“Kallosi, bhante nāgasenā”ti.` không thuộc lát này
    nhưng `TIEN_LE_PHAI.md` ghi cặp `mil3.5.6:2.1 == mil3.6.6:2.1`; tôi đã dùng đúng nguyên văn
    đó cho `mil3.3.3:4.1` và `mil3.7.4:4.1`. `gāmavaraṁ` → *một làng ưu tú*: **3 bài đã có**
    (`mn83:4.9`, `mn83:16.14`, `mn88:18.7` — vua trao *một làng ưu tú* cho Kappaka; Anānanda
    nói *nếu hợp lẽ mà dâng Tôn gi Ānanda một làng ưu tú*). `maṇikuṇḍala` → *vòng tay đeo ngọc
    quý*: `mn54:20.1` có *đồ trang sức bằng ngọc quý* cho `pavaramaṇikuṇḍala`. Mẫu kết bài:
    `Xjātakaṁ navamaṁ` → *Kinh X thứ chín* theo `ja159:5.1` và `ja199:3.1`. Tên phẩm:
    `Jātaka` → *Jātaka* giữ nguyên (214/214 bài). 0 tiền lệ, đặt mới có lý do: `Tikanipāta` →
    *Bộ Ba Bài Kinh*; `Abbhantaravagga` → *Phẩm Abbhantara*; `Nānāchandajātaka` → *9. Kinh
    Nhiều Màu*.

  BẤT ĐỊNH CHƯA PHÂN XỬ TRỌN VẸN, ĐÃ GHI LẠI. (1) **Ai nói ở `1.1`?** Pāli là
    `“Nānāchandā mahārāja, ekāgāre vasāmase; Ahaṁ gāmavaraṁ icche, brāhmaṇī ca gavaṁ
    sataṁ”.` — `mahārāja` là tế từ gọi vua, nên người nói không phải vua; tôi hiểu là bà-la-môn
    đang đòi đổi, và `Ahaṁ` là chính ông. Bằng chứng nội tại: `3.1` (`Brāhmaṇassa gāmavaraṁ`)
    mới là câu vua đáp, nên hai vế ở `1.3` và `1.4` phải là hai người muốn hai thứ khác nhau
    (ông muốn làng, người bà muốn trăm bò). Đây là suy luận, không phải dữ kiện văn bản.
    (2) **`udukkhalaṁbhikaṅkhati`** (`2.4`) = *`ambhikaṅkhati`* (tìm/ham muốn) + *`udukkhala`*
    (khổ đau); tôi dịch *tìm mà sinh lòng ham muốn đau khổ*. Từ điển không có trong kho, và
    cổ tự không phải Pāli; nếu `udukkhala` là động từ *gây khổ* thì câu này còn một nghĩa nữa,
    nhưng cả hai đều cho cùng một hành động của người bà-la-môn, nên nó không đổi nghĩa cảnh.
    Cả hai điểm đã ghi ở đây vì người biên tập có thể muốn xem lại cùng chú giải Jātaka.
  REVIEW ĐỐI KHÁNG. Tôi in lại Pāli ↔ Việt từng cặp và đọc lại với mục tiêu tìm lỗi.
  Lỗi đã bắt được và đã sửa trước khi ghi lần cuối: 
  **(1)** `ja289:1.3`/`3.1` bản nháp dịch `gāmavaraṁ` là *bầy bò*; tra toàn tầng
      thì `mn83` và `mn88` đã dịch là *một làng ưu tú*, và câu kệ còn đặt nó cạnh
      `gavaṁ sataṁ` (trăm con bò) — nếu cả hai đều là trăm bò thì vế sau thừa vô nghĩa; đã
      theo *làng ưu tú*. **(2)** `ja289:0.2` bản nháp theo đa số `Dukanipāta` → *Tập Kẻ Đau
      Đớn*; `duka` ở đây là thuật ngữ *cặp/hai câu* chứ không phải *đau đớn*, và đó là bài
      khác (Tập 2, không phải Tập 3 của `Tikanipāta`), nên đã theo đúng họ *Ekakanipāta* →
      *Bộ Một Bài Kinh* (141 bài) cộng `Dukanipāta` → *Bộ Hai Bài Kinh* (11 bài) và đặt
      *Bộ Ba Bài Kinh*. **(3)** `ja289:1.4` bản nháp ghi *bà bà-la-môn* (lặp); đã sửa thành
      *còn người bà ấy*.
