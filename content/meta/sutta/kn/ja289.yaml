  ĐỌC LẠI TỪ PĀLI: đây là bài kệ Jātaka mà tác giả cũ đã hiểu sai gần như toàn bộ. Cấu trúc thật: `1.1–2.4` là lời một người nói với vua (`mahārāja`), kể ý muốn của cả nhà — `Nānāchandā` là *những người có ý muốn khác nhau*, không phải *màu*; `chanda` là ý muốn, không liên quan màu sắc. `vasāmase` là ngôi thứ nhất số nhiều (*chúng tôi sống*). Ông muốn một ngôi làng ưu tú (`gāmavaraṁ icche`), nữ Bà-la-môn muốn trăm con bò, con trai muốn cỗ xe thắng ngựa thuần chủng, con gái muốn hoa tai ngọc, còn Puṇṇikā `jammī` muốn cái cối (`udukkhalaṁ abhikaṅkhati`, sandhi `udukkhalaṁbhikaṅkhati`). `3.1–3.6` lặp lại đúng từng món bằng dạng tặng cách (`brāhmaṇassa`, `brāhmaṇiyā`, `puttassa`, `kaññāya`), động từ `paṭipādetha` (mệnh lệnh số nhiều, đặt cuối câu, chi phối cả sáu món) — nên `3.6` là *hãy cho cái cối*, KHÔNG phải *ngươi muốn…, chịu lấy khổ não*; không có chữ nào của Pāli nói *khổ não*. `udukkhala` là danh từ *cái cối* (tiền lệ `thi-ap19:14.1` *cái cối*; `ud6.4:27.2` `udukkhalo`), không phải *khổ đau*.
  KHOÁ ĐÃ SỬA: `0.4` (đổi tiêu đề từ *Nhiều Màu* thành *Ước Muốn Khác Nhau* — sửa nghĩa, vì không có từ *màu* nào trong Pāli), `1.1`, `1.2`, `1.3`, `1.4`, `2.1`, `2.2`, `2.3`, `2.4`, `3.1`, `3.2`, `3.3`, `3.4`, `3.5`, `3.6`, `4.1` (tiêu đề nhắc lại). 16/19 khoá đổi; 3 khoá giữ nguyên (`0.1`, `0.2`, `0.3`, đúng theo tiền lệ 214/214, 50/50 và các bài cùng phẩm `ja281`–`ja290`). Lỗi nghĩa thật ở khoá bản cũ: `1.1` (*con bò nhiều màu* — Pāli là *ý muốn khác nhau*), `1.4` và `3.2` (*người bà* — Pāli là `brāhmaṇī` *nữ Bà-la-môn*), `2.2`/`3.4` (*vòng tay* — `kuṇḍala` là hoa tai, 30+ khoá Jātaka dịch *hoa tai ngọc*), `2.3` (*người đàn bà đẹp* — Pāli là `puṇṇikā jammī`: tên riêng + *hèn hạ*), `2.4`/`3.6` (*ham muốn đau khổ / chịu lấy khổ não* — Pāli là *ao ước cái cối* / *hãy cho cái cối*), `3.5` (*ngươi muốn* — Pāli không có chủ ngữ ấy; `puṇṇikaṁ jammiṁ` là đối tượng được ban), `1.1`–`1.4` đổi người nói rõ ràng (một người nói *chúng tôi*, không phải *tôi muốn có một ngôi làng* tách rời gia đình), `3.x` đổi *cứ đi theo* (sai hoàn toàn).
  TIỀN LỆ ĐÃ ĐO. `jammī`/`jammi` → *hèn hạ*: 4/4 nơi (`dhp335:1`, `thag6.5:2.1`, `thig13.3:13.3`, `ja520:18.1`). `maṇikuṇḍala` → *hoa tai ngọc*: đa số áp đảo trong Jātaka (`ja493`, `ja500`, `ja506`, `ja517`, `ja523`, `ja526`, `ja527`, `ja529`, `ja545`, `ja546`, `ja547`…); `mn54:20.1` *hoa tai ngọc quý*, `mn94` dịch *vòng ngọc trang sức* (ở chỗ khác, dạng số nhiều ngữ cảnh khác). `ājaññaratha` → *cỗ xe thắng ngựa thuần chủng/thuần thục*: `mn21:7.10`, `mn119:31.1` (`mn83` dùng *cỗ xe nghìn tuấn mã* vì có `sahassayutta`). `gāmavara` → *ngôi làng ưu tú*: `mn83` (9 khoá), `mn88:18.7`, `ja482:1.1`, `ja482:2.1`; còn *làng thượng hạng* ở 8 khoá Jātaka (`ja441`, `ja456`, `ja488`, `ja498`, `ja500`, `ja512`, `ja514`…) — hai dạng gần ngang nhau, chọn *ưu tú* vì khớp `ja482` (kệ Jātaka cùng cấu trúc) và `mn83`. `brāhmaṇī` → *nữ Bà-la-môn* theo `mn100` (6 khoá, cùng cách viết hoa). `udukkhala` → *cái cối*: `thi-ap19:14.1`. Pāli trùng nguyên văn trong chính bài: các cặp `1.3`/`3.1`, `1.4`/`3.2`, `2.1`/`3.3`, `2.2`/`3.4`, `2.3`+`2.4`/`3.5`+`3.6` đã được bản Việt giữ nhất quán (cùng một từ cho cùng một món: *ngôi làng ưu tú*, *trăm con bò*, *cỗ xe thắng ngựa thuần chủng*, *hoa tai ngọc*, *Puṇṇikā hèn hạ này*, *cái cối*) — 5 cặp dò, 0 cặp lệch; khác duy nhất có chủ đích là `1.4`/`3.2` ở thể nêu (`brāhmaṇī` chủ cách) với thể ban cho (`brāhmaṇiyā` tặng cách).
