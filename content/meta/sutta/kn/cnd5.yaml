notes: |-
  **Phạm vi: đủ 470/470 khoá của cnd5, không khoá nào ngoài tập khoá Pāli, cùng thứ tự.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Ajita (Pārāyana, câu hỏi thứ nhất), tức bài kệ `snp5.2`. Cấu trúc như `cnd6`, `cnd9`, `cnd11`, `cnd17`: dẫn từng đoạn kệ, giải từng cụm bằng chuỗi từ đồng nghĩa, rồi nhắc lại cả đoạn kệ. Ngoài công thức chung còn các khối riêng của bài: (i) lời giải danh hiệu *bhagavā* qua các chữ *bhagga*/*bhāgī* (`11`); (ii) hai danh sách rất dài: các từ đồng nghĩa của *jappā*/tham ái (`13.2`) và các thứ khổ (`14.2`); (iii) lời giải *sotā* và các đoạn lặp *… savanti* (`17`, `27`); (iv) bốn đạo và sự diệt của thức (`39`); (v) *saṅkhātadhammā*, *sekhā* và ba học (`42`–`47`); (vi) *vatthukāmā*/*kilesakāmā* (`51`–`55`); (vii) hai mươi sáu lượt *āvilaṁ* (`56`) và bốn mươi bốn lượt *-to kusalo* (`58`); (viii) các lý do *sato* (`61`–`66`). Pāli của bài: 74 khoá chứa nháy kép, 0 nháy đơn, 11 khoá có ngoặc đơn (đều là lời dẫn người nói trong kệ, khớp từng khoá), 13 khoá chứa `…pe…` (đều thành đúng một `…`), 111 khoá có `…` trần (đều giữ đủ), 0 khoá có `(…)` trần.

  **Cách trình bày lemma.** Như `cnd6`: Pāli đánh dấu từ được giải bằng thẻ in đậm và chữ `ti` kết; bản Việt dùng dạng `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế như Pāli. Riêng `3.2` và `18.2` giữ nguyên từ `Iccā` bằng Pāli vì lời giải nói về chính hình thức của từ ấy. Lời dẫn người nói trong kệ dùng dạng `(Tôn giả Ajita nói,)` và `(Này Ajita, Đức Thế Tôn nói,)` theo `cnd6`/`cnd9`; chú giải `11.1`, `24.5`, `37.2` giải riêng *Ajitā* là Đức Thế Tôn gọi vị Bà-la-môn bằng tên, nên giữ *Này Ajita* chứ không dùng `(Đức Thế Tôn trả lời:)` của `snp5.2`/`ne5` (4 khoá: `8.2`, `15.2`, `23.2`, `28.2`).

  **Tầng tham khảo — đo, không đoán.** Sujato không có `cnd5`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; tệp `cnd5_translation-en-sujato.json` không tồn tại, chỉ có tệp tên `cnd-name` (nhãn tác phẩm, không phải văn bản). Lớp `english-project` cũng không có `cnd5`. `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự, bỏ khối `:0`) là **161** khoá; Sujato phủ 0/161 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/161, `vietnamese-current` 0/161. Có hai chứng cứ độc lập trong chính corpus, nhưng đều là bản của **bài khác** nên không tính là đối chiếu English của cnd5: (a) khoảng 98 khoá có Pāli trùng (bỏ dấu câu và nháy) với khoá của `snp5.2`, bài mà Sujato có dịch (phần kệ `1`, `7`, `8`, `15`, `16`, `22`, `23`, `28`, `29`, `34`, `35`, `40`, `41`, `49`, `50`, `67` và các dòng nhắc lại); (b) kệ `65` trùng `snp3.6:13`. Bốn bài kinh khác ở tầng Việt (`ne5`, `ne16`, `snp5.2`, `snp3.6`) cũng dùng chung các dòng kệ này.

  **Dùng lại tiền lệ.** Đã dò 100 khoá có Pāli trùng nguyên văn (từ 15 ký tự, bỏ thẻ in đậm và khoảng trắng) với khoá đã dịch ở tầng ngoài cnd5: dùng lại nguyên văn ở 83 khoá, khác ở 17 khoá. Trong 17 khoá khác:
  1. `8.2`, `15.2`, `23.2`, `28.2` `(ajitāti bhagavā)`: giữ *(Này Ajita, Đức Thế Tôn nói,)*, lý do ở mục trình bày lemma. Riêng `65.2` `(sabhiyāti bhagavā)` thì dùng lại nguyên văn `snp3.6:13.2` và `cnd9:18.2` (*(Đức Thế Tôn nói với Sabhiya)*), nên là chỗ duy nhất trong bài không theo dạng *(Này X, Đức Thế Tôn nói,)*.
  2. `35.2`, `40.2` `ajita taṁ vadāmi te;`: dùng lại `snp5.2:6.2` (*Ajita, Ta sẽ trả lời cho ngươi;*); `ne5` chỉ khác dấu `:` thay `;`.
  3. `50.4`, `61.1`, `66.2`, `67.4` `sato bhikkhu paribbaje`: tầng có ba cách (`snp3.12`: *Tỳ-kheo hãy sống du hành với niệm*, `thag20.1`: *tỳ-kheo có niệm nên đi lang thang*, `snp5.2:8.4`: *tỳ-kheo ấy sống du hành với chánh niệm*); chọn `snp5.2:8.4` vì cùng bài kệ. `67.4` còn khác `sn1.21:2.4`, nơi `sato bhikkhu paribbaje` được dịch trải qua hai dòng (*vị tỳ-kheo, với chánh niệm, hãy xuất gia để đoạn trừ tham dục*) trong ngữ cảnh khác; giữ *sống du hành* theo `snp5.2`.
  4. `54.2`, `54.3` (kệ *addasaṁ kāma te mūlaṁ*): khác `ja421:4.2`–`4.3`. Pāli `addasaṁ` là ngôi thứ nhất (*ta đã thấy*), `saṅkappā` là *từ tư duy*; `ja421:4.1`–`4.4` đọc *Ngươi đã thấy tham dục làm gốc rễ… ngươi sinh ra từ sự cố chấp* — nghi sai ngôi và nghĩa của `saṅkappa`, nhưng thuộc bài khác nên **báo, không sửa** (1 bài, 4 khoá).
  5. `43.3` *luân hồi sinh tử*: theo `cnd17:13.8`/`cnd18:10.2`; `thag2.41` dịch khác nhưng đó là kệ.
  6. `56.23`, `56.24`, `56.26`, `56.27`: `mnd5` dịch *khỏi mọi …* vì ngữ pháp khác (xuất ly); ở đây là *do mọi …* (nguyên nhân làm tâm vẩn đục).
  Ngoài ra, `ayaṁ/idaṁ vuccati …` dịch *điều này được gọi là …* theo `cnd20:14.4` (`12.10`) và `cnd10:12.2` (`25.3`), và dùng cho cả bảy chỗ còn lại của bài (`2.3`, `9.2`, `10.2`, `12.5`, `13.3`, `14.5`, `64.4`); đo trên toàn tầng, các khoá đứng riêng dạng `ayaṁ/idaṁ vuccati X` có *điều này được gọi là* 7, *đây gọi là* 5, *đây được gọi là* 1 và 17 khoá dịch theo dạng khác. Bốn thiền ở `46.2`–`46.5` xem mục thuật ngữ; `46.3` trùng nguyên văn `dn4:23.8`. Trong chính bài, Pāli trùng nguyên văn ở 37 nhóm (đã bỏ thẻ in đậm và khoảng trắng); bản Việt giống nhau ở cả 37 nhóm, khác ở 0 nhóm.

  **Thuật ngữ, kèm số đếm (phạm vi tầng; `cnd` là phạm vi gần nhất).**
  - `jappā` → *sự lẩm bẩm*: giữ nguyên của `snp5.2:2.4` (*Ta nói sự lẩm bẩm là vết nhơ của nó*) cho cả bốn lần kệ và cho cả họ từ `jappā pajappā abhijappā jappanā jappitattaṁ` (`13.2`); chú giải `13.1` giải `jappā` là tham ái. Đây là chỗ khó chịu nhất của bài: *lẩm bẩm* đúng nghĩa đen và khớp kệ, nhưng khi `jappā` làm đồng nghĩa của *taṇhā* thì có thể đọc *thầm cầu* (`cnd9:4.1`, `cnd15:4.8` dịch động từ `abhijappati` là *thầm cầu*). Chưa chốt được; xem bất định 1.
  - `vevicchā` → *xan tham* (`snp5.2:2.3`; 44 lần toàn tầng); `macchariya` → *keo kiệt* (`dn33:2.1.17`, `an9.69:1.3` cho năm loại).
  - `nivuto` → *bị che phủ* (kệ `snp5.2:1.1`); `āvuto` → *che lấp*, `ovuto` → *che kín*, theo `mn99:15.5` và `mn125:10.1` (*che lấp, che kín, phủ kín*).
  - `lagganaṁ bandhanaṁ upakkileso`, `laggo laggito palibuddho` → *sự mắc vào, sự ràng buộc, sự ô nhiễm; bị mắc vào, bị vướng vào, bị ràng buộc* theo `cnd17:37.3`.
  - `āvaraṇaṁ nīvaraṇaṁ` → *sự che chắn, sự cản trở* khi nói về việc chặn dòng chảy (`19`, `20`, `25`, `26`); nhưng trong danh sách tham ái (`13.2`) là *chướng ngại, triền cái* theo `sn46.37`/`sn46.39`. Hai nghĩa theo ngữ cảnh, cùng một từ Pāli.
  - `nivāraṇaṁ` → *ngăn chặn*, `saṁvaraṁ` → *sự chế ngự* (`snp5.2:3.3`–`3.4`, `4.4`); `saṁvaraṇaṁ` trong chuỗi giải → *sự phòng hộ*.
  - `ācikkhati desesi paññapesi paṭṭhapesi vivarasi vibhajasi uttānīkarosi pakāsesi` → *giải thích, giảng dạy, trình bày, an lập, khai thị, phân tích, làm cho hiển lộ, công bố* theo `cnd11:24.5`, `cnd14:24.6`, `cnd17:15.2` (ngôi hai và ngôi nhất dùng *Ngài*/*Ta*).
  - `avijjā` (`9.2`), `paññā` (`30.2`) theo `ne17:16.3`, `ne17:17.3` và `cnd6:14.2`; `pamāda` (`12.8`) theo `cnd20:14.2`; `sati` (`25.2`, `30.3`, `64.4`) theo `cnd10:12.1`.
  - `bhagavā`: *Thế Tôn* (`cnd9:2.8`, `cnd17:19.7`); công thức `bhaggarāgoti bhagavā` → *vị đã phá vỡ tham là Thế Tôn* theo `mnd7:16.3`–`16.20` (cùng Pāli, 4 bài `mnd` đều dịch dạng đồng vị; xem Lượt cải thiện 2026-10-13); `netaṁ nāmaṁ mātarā kataṁ …` (`11.21`–`11.22`) dùng lại `cnd21:13.6`–`13.7`, thay *Phật* bằng *Thế Tôn*.
  - `saṅkhātadhammā` → *đã liễu tri pháp* (`snp5.2:7.1`, `ne5:37.1`; `saṅkhāya` là *liễu tri* trong `cnd6`); chuỗi `ñāta tulita tīrita vibhūta vibhāvita` → *đã biết, đã cân nhắc, đã thẩm xét, đã làm cho sáng tỏ, đã làm cho rõ ràng* theo `cnd12:23.2`. `gatiyo upapattiyo paṭisandhi bhavā saṁsārā vaṭṭā` → *nẻo, sự tái sinh, sự kết sinh, hữu, luân hồi, vòng luân chuyển* theo `cnd20:28.5`.
  - `sekha` → *hữu học* (233 lần toàn tầng); `adhisīla/adhicitta/adhipaññā` → *giới/tâm/tuệ tăng thượng* (`cnd9:6.3`); `āvajjantā … sacchikarontā sikkhanti` theo `cnd9:6.11`–`6.25`.
  - `sotāpanna`/`sakadāgāmī`/`anāgāmī` → *Dự lưu*/*Nhất lai*/*Bất lai*: toàn tầng *Dự lưu* 173 (hai dạng viết hoa/thường) so với *nhập lưu* 161; *Nhất lai* 125; *Bất lai* 130. `cnd` chưa dùng; chọn đa số.
  - Bốn thiền (`46.2`–`46.5`): toàn tầng *sơ thiền* 157 so với *thiền thứ nhất* 138, *tứ thiền* 86 so với *thiền thứ tư* 134; trong `cnd` các bài đã dịch (`cnd17`) dùng *thiền thứ …*; chọn *thiền thứ nhất … thiền thứ tư* cho khớp cụm Pāli *paṭhamaṁ jhānaṁ … catutthaṁ jhānaṁ*.
  - Danh sách phiền não *kodha … pamāda* (`56.9`–`56.22`) theo `cnd6:15.2` (*giận dữ, hằn học, gièm pha, hơn thua, ganh tị, keo kiệt, giả dối, xảo trá, bướng bỉnh, hung hăng, ngã mạn, ngạo mạn, tự mãn, phóng dật*); riêng *sabbaḍāhehi* → *mọi nóng rát* (khác *sabbadarathehi* → *mọi bứt rứt* của `cnd6`).
  - Các thứ bệnh (`14.2`) theo `an10.60:7.4` (*kilāsa* → *chàm*, *sotarogo* → *bệnh tai trong*, *kaṇṇarogo* → *bệnh tai ngoài*, …); *byasana* → *mất mát* theo `an5.130:1.3`.
  - Mô-típ `-to` ở `58` theo `cnd10:11.4`–`11.45` (*là bệnh, là ung nhọt, là mũi tên, …*), thêm `vadhakato` → *là kẻ sát hại* (`sn22.85`) và `saṅkilesikadhammato` → *là có tính gây ô nhiễm* (`ps3.9:23.10`: *là phải ô nhiễm*).
  - Danh sách vật dục (`51.5`) theo `cnd6:20.5` và `mnd5:48.6`; `saṅkappo kāmo` → *tư duy là dục*; chuỗi `kāmacchando … kāmacchandanīvaraṇaṁ` (`53.2`) theo `cnd17:19.2`, thêm `kāmagedho` → *dục thèm đắm* (không có tiền lệ).
  - `agadhito amucchito anajjhosanno` → *không đắm chấp, không si mê, không trói buộc* theo `sn16.1`; dải *vīta/vigata/catta/vanta/mutta/pahīna/paṭinissaṭṭha* theo `cnd15:4.11`, `cnd10:19.8`.
  - `abhisaṅkhāraviññāṇa` → *thức tạo tác*; `anamatagge saṁsāre` → *luân hồi vô thủy*; `anupādisesāya nibbānadhātuyā` → *Niết-bàn giới không còn dư y* theo `an8.70:21.1`, `an8.19:15.2`.

  **Số Pāli.** `pañca macchariyāni` = 5 (đủ năm loại ở `12.3`); `dve kāmā` = 2 (`51.2`); `catūhi kāraṇehi` ×4 ở `61.2`, `62.1`, `63.1`, `64.1` = 4 lý do mỗi lần, và mỗi lần đều liệt kê đủ 4 mục; `sattannaṁ dhammānaṁ` = 7 (`64.6`, đủ bảy ở `64.7`); `dvādasāyatanāni` = 12 (`60.1`, sáu cặp ở `60.2`); `satta bhave` = 7, `dve bhave` = 2, `pañcasu bhavesu` = 5 (7 − 2), `ekaṁ bhavaṁ` = 1 (`39.1`–`39.3`); `dasannaṁ saññābhāvanānaṁ` = 10, `aṭṭhannaṁ vimokkhānaṁ` = 8, `aṭṭhannaṁ abhibhāyatanānaṁ` = 8, `navannaṁ anupubbasamāpattīnaṁ` = 9, `dasannaṁ tathāgatabalānaṁ` = 10, `channaṁ abhiññānaṁ` = 6, `channaṁ buddhadhammānaṁ` = 6, bốn/bốn/bốn/năm/năm/bảy/tám ở `11.19` (`catunnaṁ … pañcannaṁ … sattannaṁ … aṭṭhaṅgikassa`). `anekapāṇasahassānaṁ` (`68.1`) chỉ là *nhiều ngàn* chứ không có số cụ thể, dịch *nhiều ngàn người*. Các số trên tự tính từ cấu tạo từ; bài không có cụm `tiṁsakappasahassa` hay cụm chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `jappā` và họ từ (`8.4`, `13.1`–`13.5`, `15.4`, kèm 5 từ ở `13.2`): xem mục thuật ngữ. *Lẩm bẩm* là nghĩa đen của kệ nhưng đọc lên lạ khi làm đồng nghĩa của tham ái; phương án thay là *thầm cầu*. Người biên tập có thể đổi hàng loạt cho cả họ từ.
  2. Danh sách tham ái `13.2`: 15 từ ít gặp hoặc 0 tiền lệ trong tầng, đọc theo nghĩa gốc và có thể chưa chuẩn: `māyā` → *sự giả dối* (theo `cnd6`), `janikā` *kẻ sinh ra*, `sañjananī` *kẻ làm phát sinh*, `saritā` *kẻ di chuyển*, `visaṭā` *kẻ bò lan* (theo `an4.199:2.1`), `visattikā` *sự đắm say* (theo `cnd9:47.1`), `āyūhanī` *kẻ tích lũy*, `dutiyā` *bạn đồng hành*, `bhavanetti` *dây dẫn đến hữu* (`sn23.3` dịch *dây trói hữu*), `pucchañjikatā` *sự vẫy đuôi*, `sādhukamyatā` *sự ham điều tốt đẹp*, `visamalobho` *tham bất chính*, `paṭibandhu` *sự gắn bó*, `gantho` *nút thắt*, `taṇhāgaddulaṁ` *dây xích tham ái*; `rūpataṇhā` xuất hiện hai lần (hữu sắc giới và đối tượng sắc) và đều dịch *ái sắc*, theo chính chuỗi Pāli.
  3. `14.2`: câu kết *yesaṁ dhammānaṁ ādito samudāgamanaṁ paññāyati* và `14.3` *atthaṅgamato nirodho paññāyati* đọc là *đối với những pháp nào thì sự khởi lên được nhận thấy ngay từ ban đầu* / *sự chấm dứt được nhận thấy từ lúc lặn mất*; chủ ngữ của mệnh đề không rõ hẳn từ Pāli. Phần tên bệnh theo `an10.60`, gồm cả những chỗ nghi vấn (*kilāsa* → *chàm*, *opakkamikā ābādhā* → *các bệnh do bị tác động*).
  4. `11.3`–`11.20` trò chơi chữ *bhagga/bhāgī/bhagavā* không giữ được trong tiếng Việt; bản Việt giữ nghĩa từng cụm. `bhaggakaṇḍako` → *vị đã phá vỡ gai nhọn* (có thể là *kaṇṭaka*), `bhaji vibhaji pavibhaji` → *chia sẻ, phân chia, phân chia rộng rãi*, `appamaññā` → *vô lượng* (không nêu *tâm*), `bhāgī vā` → *vị có phần về …*.
  5. `12.4` *kaṭukañcukatā* → *sự co thắt cay nghiệt*, *aggahitattaṁ cittassa* → *sự nắm chặt của tâm*; `25.2` *apilāpanatā* → *sự không hời hợt*, *asammussanatā* → *sự không quên lãng*; 0 tiền lệ trong tầng.
  6. `58`: mô-típ `-to kusalo sabbadhammānaṁ` (cách xuất xứ) dịch *xét là … thì thiện xảo trong mọi pháp*; từ *xét* là chữ nối thêm để câu Việt thành, Pāli chỉ có hậu tố `-to`. Cả 44 lượt dùng cùng một khuôn *là X …* theo `cnd10:11`.
  7. `29.1`: Pāli `paññā ceva sati cāpi` khác `snp5.2:5.1` (`paññā ceva sati yañca`) nên không dùng lại nguyên văn *Và tuệ ấy cùng với niệm*; dịch *Tuệ và cả niệm*.
  8. `43.1`–`43.2`: `pacchimako` đứng ở dòng trước `samussayo`; đọc cả hai là tính từ của *thân* (*thân sau chót … thân cuối cùng*), theo `sn22.76:9.2` (*thân này là thân cuối cùng*). Thêm chữ *thân* ở `43.1` vì Pāli chỉ để `pacchimako` đứng riêng.
  9. `56.2` lemma *mano* dịch *Ý* trong khi kệ dịch `manasā` thành *tâm*, vì định nghĩa mở đầu bằng *citta* (*tâm*) và *mano* nằm trong chuỗi từ đồng nghĩa; hai chữ này không tách được trong tiếng Việt.
  10. `64.3` mười đề mục niệm: *tùy niệm* cho `anussati`, *niệm* cho `sati` (hơi thở, sự chết, thân); `upasamānussati` → *tùy niệm sự tịch tịnh*.
  11. `55.3`: câu mở *kilesakāmena vatthukāmesu nābhigijjheyya* dịch *không nên dùng phiền não dục mà tham đắm … đối với các vật dục*; chỗ này mô tả cơ chế (phiền não dục là cái tham đắm, vật dục là đối tượng) và hơi nén ở tiếng Việt.
  12. `42.10` *antime samussaye ṭhitā* → *đứng ở thân cuối cùng*, *antimadehadharā* → *mang thân xác cuối cùng*; hai chữ *thân* khác nhau (samussaya, deha) không phân biệt được rõ bằng tiếng Việt.
  13. Tên tác phẩm: `niddesa` → *Kể Lược* theo `cnd3`/`cnd4`/`cnd6`, dù *Diễn giải* sát nghĩa hơn; người biên tập có thể đổi hàng loạt cho cả Cūḷaniddesa khi chốt tên.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (470/470, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` và ngoặc đơn khớp Pāli từng khoá (0/470 lệch); dấu lược `…` khớp Pāli từng khoá (0/470 lệch; 13 khoá có `…pe…`, đều thành đúng một `…`; 111 khoá có `…` trần, đều giữ đủ); không có `(…)` ở Pāli nên không có ở Việt; 0 khoá rỗng; NFC; không khoảng trắng thừa; Pāli lọt sang Việt chỉ gồm lemma `Iccā` (`3.2`, `18.2`).
  **Lượt cải thiện 2026-10-13.** Đọc đối kháng lại 470 cặp Pāli↔Việt, rồi đo lại tiền lệ cho mọi khoá có Pāli trùng nguyên văn với khoá đã dịch ở ngoài cnd5 (dò 259 khoá, bỏ dấu câu và nháy; 110 khoá khác nhau về chữ, phần lớn chỉ khác dấu câu hoặc là dạng lemma có chủ ý). Số khoá đổi: 31/470 (không đổi tập khoá hay thứ tự). Phân loại:
  1. Terminology fix, `11.3`–`11.20` (18 khoá, công thức *bhagga/bhāgī … bhagavā*): bản cũ dịch *vì … nên là Thế Tôn*, thêm quan hệ nhân quả mà Pāli (đẳng thức từ nguyên với chữ `ti`) không nói; bốn bài `mnd` (`mnd7:16`, `mnd13:157`, `mnd16:151`, `mnd10:10`) có cùng Pāli đều dịch *vị đã … là Thế Tôn*. Đổi theo đó: *vị đã phá vỡ tham/sân/si/ngã mạn/tà kiến/gai nhọn/phiền não là Thế Tôn*; *bhāgī* → *vị có phần về …*; `11.13` → *đã lui tới những trú xứ xa vắng trong rừng sâu, … thoáng vắng, xa người, thích hợp cho độc cư* (đúng 13/13 khoá `cnd`/`mnd` có `vijanavātāni`; bản cũ lấy dạng `sn35.63` chỉ có một khoá); `11.20` *tuệ phân tích* → *vô ngại giải* (6/6 khoá `cnd`/`mnd` có `catunnaṁ paṭisambhidānaṁ`); `11.14`–`11.16` theo cùng các khoá `mnd`. Lưu ý riêng: `bhaggadiṭṭhi` → *tà kiến* theo 4 bài `mnd` (Pāli chỉ có *diṭṭhi*; nhưng ở đây là hạng mục trong chuỗi phiền não nên *tà kiến* đã có tiền lệ; `17.2` và `24.2` *dòng chảy kiến* giữ nguyên vì là hợp từ khác); `bhaggakaṇḍako` → *phá vỡ gai nhọn* để giữ nguyên chữ *phá vỡ* của cả chuỗi *bhagga-*.
  2. Accuracy/terminology fix, `64.8`: *đem lại phiền não* → *đem lại phiền khổ, cho quả khổ* (`sadarā dukkhavipākā`): *phiền não* trùng thuật ngữ *kilesa* và là cách dịch lẻ loi; 11/12 khoá Niddesa có cùng công thức dùng *đem lại phiền khổ, cho quả khổ* (`mnd3:27.28`, `mnd4:17.5`, `cnd9:17.4`, `cnd8:93.11`, `cnd23:192.8` …); toàn tầng *phiền khổ* 13, *phiền lụy* 9, *phiền não* 1 (+ 7 khoá `mn39` có dạng *phiền não và quả khổ*).
  3. Terminology fix, `45.2` và `47.2` (công thức giới và tuệ): đổi theo `mnd7:34.9` và `mnd7:36.2`, cùng Pāli, cùng bố cục *adhisīla/adhicitta/adhipaññā*. Với `45.2`: 7 khoá `mnd` có đúng cụm *sống hộ trì Pātimokkha, đầy đủ oai nghi và đường hạnh, …*; bản cũ theo dạng `an9.3`/`ud4.1` (2 khoá). Với `47.2`: 3 khoá `mnd` cùng dạng, bản cũ là dạng trộn. Trade-off: *học tập giữ đúng các học luật đã thọ nhận* nới hơn *samādāya sikkhati* so với bản cũ, nhưng nhất quán với mọi khoá `mnd` cùng Pāli.
  4. Terminology fix, `27.31`, `27.35`, `47.3`, `47.7`: *nguồn gốc của khổ/lậu hoặc* → *sự tập khởi của khổ/lậu hoặc*; bản cũ tự lệch trong bài (`27.43`–`27.45` và `58.39` đã dùng *tập khởi* cho `samudaya`); tầng: 15 khoá ngắn *tập khởi* so với 4 khoá *nguồn gốc* cho `dukkhasamudayo`, và `cnd23:16.30`, `mnd4:42.29` cùng dạng. (`āsavasamudayo` toàn tầng *nguồn gốc* 16 so với *tập khởi* 5, nhưng giữ cùng dạng với `dukkhasamudayo` để hai dòng cạnh nhau không lệch.)
  5. Terminology fix, `55.3`: *agiddho* → *nên không tham* (không còn *không ham mê*): `mnd2:106.18`, `mnd9:98.11`, `mnd10:133.6` cùng chuỗi *không tham, không đắm chấp, không si mê, không trói buộc* (3/4 khoá Niddesa; `mnd15:189.14` khác).
  6. Terminology fix, `52.2` và `55.1`: *Những dục này được gọi là …* → *Đây gọi là vật dục / phiền não dục* (`ime vuccanti …` số nhiều; 22 khoá toàn tầng *đây gọi là phiền não dục*, 2 khoá *đây gọi là vật dục*, 0 khoá dạng cũ).
  7. Clarity/accuracy fix, `44.6` (thêm *cũng* cho cả ba `-pi` như `mnd7:37.2`), `46.5` (*chứng và trú* → *chứng và an trú*, cùng `mnd7:35.5` và 7 khoá khác), `13.5` (thêm *của nó*, khớp `8.4`, `15.4` cùng Pāli).
  Điểm: `semantic_fidelity` 8.8 → 8.9 (gỡ quan hệ nhân quả thêm vào ở 18 khoá và một chữ *phiền não* lệch nghĩa); `terminology` 8.8 → 9.0 (các sửa 1–6, loại tự mâu thuẫn *tập khởi*/*nguồn gốc*); `final_score` 8.96 → 8.99. Các điểm khác giữ nguyên: bài vẫn có 15 từ hiếm ở `13.2`, họ từ `jappā`, câu cuối `14.2` và `43.1` chưa phân xử được, nên không nâng `ambiguity_integrity`; không có bản Anh độc lập nên `triangulation` vẫn 8.0; `technical_integrity` vẫn 9.6 vì lượt này cũng không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`.
  Căn cứ mới cho bất định 1 (`jappā`): bản Anh của `snp5.2` (cùng dòng kệ `jappābhilepanaṁ brūmi`) dịch *muttered prayer*, tức nghĩa đen *lẩm bẩm*; đó là chứng cứ cho nghĩa đen của kệ, chưa phân xử được việc họ từ `jappā` làm đồng nghĩa tham ái ở `13.2` nên bất định giữ nguyên. Bất định 8 (`43.1`): ba khoá `cnd8:107.1`, `mnd16:62.1`, `cnd23:326.1` có cùng dòng kệ mở đầu là `Tassāyaṁ pacchimako bhavo` (danh từ là *bhavo*, dịch *hữu cuối cùng*), còn `cnd5` chỉ có `pacchimako` đứng riêng nên vẫn chưa biết danh từ ngầm là *bhava* hay *samussaya*; giữ *thân sau chót* và ghi nhận khả năng đọc *hữu*. Không đổi ở `14.2`/`14.3`: câu cuối khớp cấu trúc `cnd8:28.5`–`28.6` (mệnh đề *yesaṁ dhammānaṁ …* tiếp vào danh sách của khoá kế).
  Chỗ nghi ngờ nhưng không đổi: `12.8` (*có sự buông thả tâm* so với `cnd23:224.28` *là sự buông thả của tâm*; cùng nghĩa); `2.2` (*đời này, đời sau* so với *thế gian này, thế gian khác* ở `cnd19`, đã có tiền lệ `mnd15:38.2`); `60.2` (*tiếng/xúc chạm* so với *thanh/xúc* ở `mnd6:74.3`, tiền lệ 1:1 với `mn115:10.3`); `45.3` (hai dạng *cửa ngõ, bậc đầu* và *cửa ngõ, đầu mối* chia 2:2 trong `mnd`); `jappā` giữ *lẩm bẩm*.
