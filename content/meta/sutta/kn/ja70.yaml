  HAI LỖI NGHĨA NẶNG ĐÃ BẮT VÀ ĐÃ SỬA — ĐỌC LẠI TỪNG CẶP PĀLI KÍCH VIỆT.
  Bản nháp có sẵn trên đĩa lúc tôi bắt đầu (mtime 10:24, **không có scorecard**)
  dịch cả bốn vế thân kệ sai theo cùng một cách:
  1. `sādhu jitaṁ` ở `1.1` và `1.3` bị dịch thành **"thắng lành"**. Đây là lỗi nghĩa
     nặng nhất của lát. Trong tiếng Việt "lành" nghĩa là **không bị thương** (thân
     thể còn lành, chỗ còn lành), không phải *tốt*; `sādhu` ở đây là "tốt, đáng,
     đúng đắn", và Sujato dịch "a good victory". Dùng "thắng lành" khiến câu mang
     nghĩa sai hoàn toàn. Sửa thành **"thắng trận tốt"** ở cả hai vế.
  2. `avajīyati` và `nāvajīyatī` ở `1.2` và `1.4` bị dịch thành **"bị hủy hoại đi"**.
     Đó là nghĩa của `bhañjī` hay `vināsayati` (huỷ diệt, phá hủy). Còn `avajī` là
     **chinh phục, hạ** (đè bại), và Sujato dịch "may be undone" theo nghĩa *bị đè
     bại*, không phải *bị phá hủy*. Sửa thành **"bị chính người đã thắng mình lại
     chinh phục"** và **"không ai chinh phục được"**. Đếm tiền lệ: "chinh phục" đã có
     trong tầng ("Đại vương có thể chinh phục được"), "đánh bại" cũng có; chọn
     "chinh phục" vì `avajī` là *hạ*, và giữ cả hai vế đối xứng như Pāli.

  UỨD NGHĨA `4.1–4.4` — KHÔNG MỞ MÃ HOÁ, CỐ Ý. `Sikhīsabbaghasopi ca vīṇavaro` …
  là uddāna Itthivagga: danh sách tên-mangala của mười bài trong phẩm, không phải mười
  tên bài kinh. Bản chụp không có chú giải, nên tôi giữ danh sách Pāli kèm dấu, chỉ
  dịch từ nối, theo tiền lệ `ja10`, `ja20`, `ja30`, `ja50`, `ja100`–`ja140`. Cuối vế
  dùng "— mười bài ấy." (6 lần ở JA ngoài lát so với 2 lần của cách kia). Từ nối
  "và cả" trong bản nháp đã bỏ vì **không có mẫu nào** ở JA ngoài lát này.

  SỐ THỨ TỰ ĐỐI CHIẾU HAI BÊN, KHÔNG SUY TỪ TÊN UID. `Itthivaggo sattamo` là thứ
  bảy; chín bài `ja61–ja69` đã mang "Phẩm Phụ Nữ" trong tầng, và `ja70:2.1` là
  "thứ mười", khớp `dasamaṁ` và khớp vị trí thứ 10 trong phẩm.

  TIÊU ĐỀ `0.4`. `Kuddāla` là tên riêng, giữ dấu Pāli, cùng cách tầng đã làm cho
  `Naccajātaka`, `Sakuṇajātaka`, `Guṇa`, `Kosiyajātaka`, `Bāhiyā`.
