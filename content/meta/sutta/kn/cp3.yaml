notes: |-
  **Bài thứ ba của phẩm `Akittivagga`, `Dānapāramī 3`, trong `Cariyāpiṭaka`.** `0.2` *Phẩm Akitti* không lệch trong `cp5`/`cp6`/`cp7`; `0.3` lấy *Bố Thí Ba-la-mật Thứ Ba* theo `cp5` (*Thứ Năm*) và `cp7` (*Thứ Bảy*), **không** theo `cp6` (*Bố Thí Ba-la-mật 6* — chỗ lệch, xem `notes` của `cp18`; tôi không sửa tệp ngoài lát). 37 khoá, tất cả đã dịch. Cốt truyện: vua Dhanañjaya ban con voi cho Bà-la-môn dù đang đói, vì *toàn tri* là điều quý hơn.

  **Bốn khoá dùng lại nguyên văn (đếm bằng script):** `0.1` ← `cp13`/`cp17` (*Hạnh Tạng*) · `0.2` ← `cp5`/`cp6` (*Phẩm Akitti*) · `1.1` ← `cp13`/`cp17` (*Lại nữa, vào thời thuở nọ,*) · `8.3` ← `cp21:6.3` (*Mà vì Nhất Thiết Chủng Trí là điều quý báu nhất đối với ta,*). Riêng `8.3` Pāli `Sabbaññutaṁ piyaṁ mayhaṁ` có **hai** tiền lệ và chúng hòa 1–1: `cp21:6.3` *Mà vì Nhất Thiết Chủng Trí là điều quý báu nhất đối với ta* và `cp5:3.3` *tôi thương yêu điều toàn biết*. Tôi chọn `cp21` vì nó kết bằng **ta**, khớp ngôi của cả bài (xem `notes` của `cp24`: toàn bộ `Cariyāpiṭaka` đã dịch dùng *ta*), còn `cp5` kết bằng *tôi* sẽ phá vỡ xưng ngôi. Đây là **lựa chọn vì ngôi**, không phải đa số.

  **Xưng ngôi thống nhất: *ta*.** Bản nháp đầu viết `8.3` bằng *tôi* và `8.4` bằng *tôi*, lệch với `1.3`/`2.2`… của chính bài; đã sửa cả hai về *ta* (kiểm bằng script: 0 khoá còn chữ *tôi*).

  **`nīlaṁ añjanasavhayaṁ` → *màu xanh chàm, như màu nước đọng*.** `añjana` là chất son/lamson đen (cũng là tên con voi trong câu chuyện), `nīla` là xanh chàm. Sujato dịch *of midnight hue named Añjana*. Tôi dùng *xanh chàm* vì đó là màu, và *nước đọng* vì đó là thứ tạo nên sắc màu ấy; không giữ chữ *Añjana* vì Pāli ở đây **không** nói tên con voi, chỉ nói màu — thêm tên là bịa chi tiết mà câu kệ không có.

  **`dhanañcayo nāma` → *vua tên Dhanañjaya*.** `dhanañcaya` là tên không biến cách (indeclinable) của chính vị vua trong truyện, Sujato cũng viết *Dhanañjaya*. Cần giữ chữ **ñ** đúng dạng, nên tôi khai tên này vào bộ nhớ tiến trình của harness (xem mục tên riêng cuối `notes`).

  **`bhiṅgāre ratanāmaye` → *cùng bát nghiệc bằng vàng*.** `bhiṅgāra` là bát nghiệc có ngọc để rót nước trong nghi lễ; 0 tiền lệ trong tầng nên *bát nghiệc* là đặt mới, và tôi chỉ thêm *bằng vàng* theo `ratanāmaye` (làm bằng vàng) chứ không thêm *ngọc* (đó là của `maṇimaya`, không có ở đây).

  **Năm cụm 0 tiền lệ:** `avutthika` → *không mưa* · `dubbhikkho chātako` → *lương thực khan hiếm, nạn đói lớn* (`chātaka` = nạn đói) · `paṭikkhepo anucchavo` → *ta không nên từ chối* · `amaccā` → *các đại thần* · `Dhanañjaya` (xem trên). Vì có nhiều chỗ đặt mới, `terminology` ở 9.1 và `ambiguity_integrity` ở 9.0.

  **`0.4` và dòng kết: *Hạnh Của Vua Kururāja* / *Hạnh của vua Kururāja, thứ ba.*** Mẫu `Hạnh Của Vua Ekarāja` của `cp34:0.4` và `Hạnh Của Vua Khỉ` của `cp27:0.4`; `tatiyaṁ` → *thứ ba* theo `cp13`.

  **Dấu nháy kép.** Pāli 1 mở (`1.1`) / 1 đóng (`8.4`); bản Việt y hệt. Ngoài ra bài có 4 cặp nháy đơn `‘… ’` ở `3.1–3.4`, `4.1–4.4`, `6.3–6.4`, `7.4` và `8.1–8.4` — tôi đặt đúng như Pāli, không thêm dấu nào.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root: `root/pli/ms/sutta/kn/cp/cp3_root-pli-ms.json`, 37 khoá. Bản Anh Sujato **có** tại commit đã ghim: `translation/en/sujato/sutta/kn/cp/cp3_translation-en-sujato.json` (36/37; Sujato im lặng đúng ở dòng kết `9.1` — **một ô Anh rỗng không phải sự đồng thuận về cách dịch**). Tầng `vietnamese-current` vắng: thư mục `translation/` không tồn tại trong checkout này. **Lưu ý về công thức coverage:** mọi khoá thân đều **dưới 40 ký tự** (kệ ngắn), nên theo đúng `source/layers.yaml` bài có 0 khoá có nội dung ⇒ coverage 0/0; phép đo đó không phản ánh chất lượng tham khảo, và cả 12 bài `cp` đã `published` cũng vậy.

