  **KIỂM LỚP LỖI SỐ PĀLI — `tha-ap48:4.1`, KHÔNG sửa (2026-10-05).** `Sattatālīsito kappe,` được
  đưa vào danh sách sửa với giá trị **67**; phép cộng của tôi ra **47**: `satta` 7 + `catālīsa` 40 =
  47. **7 + 40 = 47, không phải 67** — con số 67 trong danh sách là lỗi cộng. Tiền lệ cùng cấu tạo
  `X + tālīsi + to` ngay trong tầng này, đều bằng `X + 40` chứ không phải kiểu tròn chục:
  `Ekatālīsito` = 41 (`tha-ap125:8.1`, `tha-ap131:5.1`), `Tetālīse` = 42 (`tha-ap117:8.3`),
  `Paṇṇatālīsito` = 45 (`tha-ap112:4.1`), `Aṭṭhatālīsa` = 48 (`tha-ap302:8.5`, trùng `cattālīsa` =
  48 ở `tha-ap187:5.1`). Bản dịch hiện tại *Vào bốn mươi bảy kiếp trước,* **đã đúng 47** ⇒ giữ nguyên,
  không sửa khoá nào ở tệp này.

