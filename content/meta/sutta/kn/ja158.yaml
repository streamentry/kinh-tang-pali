notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json). Draft + blocker thật. 13/13 khoá từ Pāli. `cần` RỖNG nên
  tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  LƯU Ý VỀ PHẨM: bài này có tên Suhanujātaka nhưng Pāli đặt nó trong Daḷhavagga
  (`:0.3` = Daḷhavagga), chỉ ja159 mới ở Suhanavagga. Nên `:0.3` dịch Phẩm Tàn Tật, không
  theo tên bài. Tiêu đề dùng Kinh Người Yêu để khớp với cách gọi Phẩm Người Yêu đã có ở
  ja159:0.3.
  BẤT ĐỊNH 1, giữ nguyên chữ Pāli: `soṇa` là tên một loài rắn; Pāli chỉ xuất hiện ở dạng
  chia `soṇena` (1.2, 2.2) và `soṇassa` (1.4). Không có từ Việt nào tương đương, và tên
  loại là thông tin có thật trong nguồn, nên giữ rắn soṇa. Đây là từ mang dấu Pāli đi vào
  bản Việt, nên tự kiểm thủ công đã báo đúng 2 khoá (1.2 và 1.4) và khai ở đây; nó thuộc
  đúng loại mà docstring của lọt_pāli nói: tên riêng có trong Pāli của bài thì không bao
  giờ là Pāli lọt.
  BẤT ĐỊNH 2: `pakkhandinā` mang dấu nữ, phải hòa với một danh từ nữ; ứng viên gần nhất
  là suhanū, người yêu. Chọn Với sự tự phụ ngu ngốc, không gán rõ chủ thể.
  BẤT ĐỊNH 3: `asatā asan` là điều không có thật gặp điều không có thật; dịch là điều bất
  thật gặp điều bất thật, không dịch thành hư vọng vì hư vọng là suy diễn.
  `visamasīlena` là đạo hạnh lỉnh kỳ, thiếu chỗn chuẩn mực; dịch lạ hành không chỗn chuẩn
  mực.
  Bài này bị hạ mạnh nhất lát: terminology 8.0, semantic_fidelity 8.2, vietnamese_clarity
  8.9, vì phải giữ một tên loại bằng chữ Pāli và ba câu còn bất định mà không có tầng Anh
  để phân xử. triangulation 7.0: không tầng Anh, không bản Việt tham khảo.
  Sửa lan 2026-10-13: `translationTitle` "Kinh Người Yêu" → "Kinh Suhanu", khớp khoá `ja158:0.4` ("8. Kinh Suhanu") và `ja158:3.1` ("Kinh Suhanu thứ tám"); Pāli `Suhanujātaka` là tên riêng. Các câu ở trên về "Phẩm Tàn Tật" và "Kinh Người Yêu" thuộc bản cũ: `ja158:0.3` hiện là "Phẩm Kiên Cố" (Daḷhavagga). Các khoá nội dung không được chạm; điểm cũ không đổi.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 8 khoá chênh lệch lớn nhất (cả 8 khoá được báo; bài chỉ có 13 khoá) → khác nghĩa 5 nhóm (7 khoá bị sửa: 1.1, 1.2, 1.4, 2.1, 2.2, 2.3, 2.4): sửa 5, giữ 1 (0.4, tên bài), bất định 2. Sửa: (1) 1.1, 1.2, 1.4 `soṇa`: bản dự án để nguyên chữ Pāli như một tên riêng và phần ghi chú đầu bài gọi đó là một loài rắn; Pāli không có từ nào chỉ rắn, `soṇa` là dạng của `suna` (con chó), hợp với `sandānakhādinā` (gặm dây buộc) ở 2.2 → "con chó" (1.1, 1.4), "nó" (1.2). (2) 1.1 `visamasīlena`: "khác tính khác nết" (sai nghĩa; `visama` là không đều, bất chính) → "nết bất chính". (3) 1.2: "kết bạn" không có trong Pāli (`saha` chỉ là "cùng với") → "ở cùng với nó". (4) 2.1 `pakkhandinā pagabbhena`: "tự phụ ngu ngốc" thêm "ngu ngốc" không có căn cứ → "hay xông tới, trơ trẽn". (5) 2.2 `sandānakhādinā`: bản cũ làm mất `sandāna` (dây buộc, dây da) và thêm "phá hoại và nuốt chửng" → "luôn gặm dây buộc"; kèm 2.3–2.4 `pāpaṁ pāpena`, `asatā asaṁ`: "điều bất thật gặp điều bất thật" (`asat` là xấu, bất chính, không phải "không có thật") → "ác hợp với ác, bất chính hợp với bất chính", trung tính giữa người và việc như Pāli. Các câu cũ ở trên về loài rắn `soṇa`, về `pakkhandinā` "mang dấu nữ" (đây là cách công cụ giống đực của tính từ đuôi -in) và về "đạo hạnh lỉnh kỳ" là sai, nay thay bằng đoạn này. Bất định còn lại: (a) 1.1–1.2 `Nayidaṁ visamasīlena soṇena suhanū saha` không có vị ngữ và không rõ `suhanū` là chủ ngữ hay hô cách (bản mù đọc là hô cách, bản dự án giữ sát chữ, không chọn); (b) `soṇa` là danh từ chung hay tên con chó, `Suhanu` là ai: tầng Pāli đã ghim chỉ có phần kệ, không có truyện khung để phân xử. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản Anh, bản Việt nguyên bài hay đoạn song song): sửa 2 khoá — `1.1`, `1.4`: lượt 2026-10-14 đổi `soṇa` thành *con chó*; nay đọc lại là **tên riêng Soṇa**: `soṇena suhanū saha` ghép hai tên song song (Suhanu là tên riêng ở tiêu đề), `sagocaro` (*cùng bãi ăn*) và `sandānakhādinā` (*gặm dây buộc*, 2.2) hợp với hai con vật nuôi được buộc; `soṇa` làm tên riêng có nhiều trong tầng (`ja532:17.1`, `ja528:2.3`). Truyện chú giải (không có trong bản chụp đã ghim) kể hai con ngựa hung dữ Mahāsoṇa và Suhanu; điều này chỉ dùng để hiểu, không đưa vào lời kinh. Giữ *nó* ở `1.2`. Bất định: `soṇa` theo từ vựng cũng là *chó* — nếu người biên tập chọn đọc theo từ vựng thì đổi lại cả hai khoá; cú pháp tỉnh lược `Nayidaṁ … saha` (1.1–1.2, *Suhanu chẳng khác gì Soṇa*) vẫn được dịch sát chữ nên còn khó đọc. Giữ 2.1–2.4 như lượt trước.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :3.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").

  Nghiên cứu nguồn ngoài 2026-10-16: Rouse (Cowell chủ biên, PTS 1897),
  https://obo.genaud.net/dhamma-vinaya/pts/kd/jat/jat.2/jat.2.158.rous.pts.htm; Ānandajoti, bản dịch
  kệ và chú giải Jātaka,
  https://ancient-buddhist-texts.net/Texts-and-Translations/Jatakagathavannana/158.htm; đã đối chiếu
  1.1–1.4, 2.1–2.4; sửa không có khoá nào; bất định 1.1–1.2 (`nayidaṁ visamasīlena`): Rouse (ngựa
  Chestnut và Strongjaw "như nhau") và chú giải (Suhanu giống Soṇa) khớp nghĩa chung "cùng loại tìm
  nhau", nhưng cú pháp cụ thể vẫn bất định, giữ nguyên; `sagocaro` = "cùng nơi kiếm ăn" và
  `sandānakhādinā` = "gặm dây buộc" được chú giải xác nhận.

  Rà từng chữ bằng DPD 2026-10-16: 13 khoá đã rà; sửa 1.1–1.2 (`visamasīlena`: `visama` là "khác" đối
  với `samasīla`, không phải "bất chính"; chú giải CST `idaṁ na attano visamasīlena, atha kho attano
  samasīleneva saddhiṁ karoti`, https://ancient-buddhist-texts.net/Buddhist-Texts/K10-JA/158.htm;
  Indacanda "có bản tính khác biệt là không đúng" → "Chẳng phải với kẻ khác tính nết / mà Suhanu ở
  cùng Soṇa"; giữ tên riêng Soṇa theo B23); bất định: không.
  Lượt hoàn thiện 2026-10-17: thống nhất thuật ngữ: đã rà, không có khoá cần sửa (`Soṇa`, `Suhanu` giữ tên riêng ở 1.2, 1.3, 1.4; `pāpa` "ác", `asat` "bất chính" ở 2.3–2.4); thêm 4 chú thích (1.1 cú pháp tỉnh lược và `visama` "khác" theo chú giải; 1.2 Soṇa là tên riêng theo B23, theo từ vựng là "chó", chú giải kể hai con ngựa; 1.4 `sagocara` theo chú giải là cùng lối hành xử; 2.1 `pakkhandinā`, `sandānakhādinā` theo chú giải). Các câu sau trong ghi chú cũ đã bị thay: "Draft + blocker thật" (bài nay ở `review` theo waiver `no-upstream-english`, blocker vẫn ghi trong hồ sơ); các điểm "terminology 8.0 … triangulation 7.0" của mục đầu (điểm hiện hành xem `quality`); ở lượt 2026-10-14, "`visamasīlena` → nết bất chính" và "1.2 ở cùng với nó" (nay "Chẳng phải với kẻ khác tính nết / mà Suhanu ở cùng Soṇa", lượt DPD 2026-10-16); ở lượt 2026-10-15, câu "Giữ *nó* ở `1.2`" (1.2 nay không còn "nó") và câu "Truyện chú giải (không có trong bản chụp đã ghim)" chỉ đúng với bản chụp, chú giải nay đã được đọc qua ancient-buddhist-texts.net.
  Chấm lại độc lập sau rà DPD + kiểm độc lập 2026-10-17: đọc cả 13/13 khoá đối chiếu chú giải CST (K10-JA/158), Indacanda, DPD: LỖI-THẬT 0, BẤT-ĐỊNH 0 trọng yếu (soṇa giữ tên riêng theo B23, có chú thích nghĩa 'chó'). Lượt DPD đã sửa 1.1–1.2 visama = 'khác' đúng chú giải. Không bản Anh Sujato, không Thích Minh Châu → triangulation 8,8. Văn phong: câu tỉnh lược 1.1–1.2 và chuỗi tính ngữ 2.1–2.2 khó đọc → clarity 8,5. 4 chú thích lượt hoàn thiện khách quan, đúng nguồn → ambiguity 9,1. validate pass, quality:check không lỗi ở bài này → technical 9,5. Blocker vắng bản Anh thay bằng chuỗi đúng sự thật (chuỗi cũ ghi 'bài phải ở draft').
