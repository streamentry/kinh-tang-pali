notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json). Draft + blocker thật. 13/13 khoá từ Pāli. `cần` RỖNG nên
  tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  LƯU Ý VỀ PHẨM: bài này có tên Suhanujātaka nhưng Pāli đặt nó trong Daḷhavagga
  (`:0.3` = Daḷhavagga), chỉ ja159 mới ở Suhanavagga. Nên `:0.3` dịch Phẩm Tàn Tật, không
  theo tên bài. Tiêu đề dùng Kinh Người Yêu để khớp với cách gọi Phẩm Người Yêu đã có ở
  ja159:0.3.
  BẤT ĐỊNH 1, giữ nguyên chữ Pāli: `soṇa` là tên một loài rắn; Pāli chỉ xuất hiện ở dạng
  chia `soṇena` (1.2, 2.2) và `soṇassa` (1.4). Không có từ Việt nào tương đương, và tên
  loại là thông tin có thật trong nguồn, nên giữ rắn soṇa. Đây là từ mang dấu Pāli đi vào
  bản Việt, nên tự kiểm thủ công đã báo đúng 2 khoá (1.2 và 1.4) và khai ở đây; nó thuộc
  đúng loại mà docstring của lọt_pāli nói: tên riêng có trong Pāli của bài thì không bao
  giờ là Pāli lọt.
  BẤT ĐỊNH 2: `pakkhandinā` mang dấu nữ, phải hòa với một danh từ nữ; ứng viên gần nhất
  là suhanū, người yêu. Chọn Với sự tự phụ ngu ngốc, không gán rõ chủ thể.
  BẤT ĐỊNH 3: `asatā asan` là điều không có thật gặp điều không có thật; dịch là điều bất
  thật gặp điều bất thật, không dịch thành hư vọng vì hư vọng là suy diễn.
  `visamasīlena` là đạo hạnh lỉnh kỳ, thiếu chỗn chuẩn mực; dịch lạ hành không chỗn chuẩn
  mực.
  Bài này bị hạ mạnh nhất lát: terminology 8.0, semantic_fidelity 8.2, vietnamese_clarity
  8.9, vì phải giữ một tên loại bằng chữ Pāli và ba câu còn bất định mà không có tầng Anh
  để phân xử. triangulation 7.0: không tầng Anh, không bản Việt tham khảo.
