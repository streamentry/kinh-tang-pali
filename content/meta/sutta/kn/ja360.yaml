notes: |-
  Lát c14. KHÔNG có Sujato tại commit đã ghim cho ja360 ⇒ `draft`, xem mục
  blocking_errors. Đây là bài tôi thấy khó nhất trong lát: văn xưng và hành động của các
  nhân vật đòi hỏi cốt truyện, mà cốt truyện không có trong tầng nào đã ghim.

  Tiền lệ có đếm và dùng lại: `Pañcakanipāta` → “Nhóm Năm Bài Kệ” (18 bản, đa số áp đảo so
  với “Bộ Năm Kệ” 3); `Maṇikuṇḍalavagga` → “Phẩm Hoa Tai Ngọc” (4 bản so với “Phẩm
  Maṇikuṇḍala” 2 — đã có một tệp dịch dở để trống, tôi không đụng);
  `Maṇikuṇḍalavaggo paṭhamo.` → “Phẩm Hoa Tai Ngọc, thứ nhất.” (theo đúng mẫu ja310/ja340);
  `Tassuddānaṁ` → “Tóm lược:” (275 bản).

  0 tiền lệ, phải tự đặt: `sedumaṁ` (khoá 2.2) là HAPAX trong toàn bộ corpus Pāli đã ghim —
  tôi grep toàn tầng chỉ ra đúng một chỗ, chính là khoá này. Tôi KHÔNG đoán; giữ nguyên
  dạng Pāli trong ngoặc kép để người đọc thấy đây là từ lạ chứ không phải lỗi gõ. Tương tự,
  `Mandakkhī` (khoá 5.3, tên riêng) và `Kurukacchā` (khoá 3.1, tên thành) giữ nguyên.

  Cách dịch 4 khoá uddāna (7.1 + 8.1-8.4) theo mẫu đã có: ja340:7.1-7.4 “Rồi …,
  ấy là mười chuyện.” Tôi khớp từng với tên phẩm của 10 bài trong Maṇikuṇḍalavagga mà tôi
  đã đối chiếu trực tiếp từ Pāli gốc ja351–ja360 (Maṇikuṇḍala, Sujāta, Venasākha,
  Uraga, Ghaṭa, Koraṇḍiya, Laṭukika, Cūḷadhammapāla, Suvaṇṇamiga, Suyonandī). Ứdāna là
  trí nhớ gốn các chữ mở đầu, nên tôi giữ tên riêng nguyên văn thay vì dịch.

  Bất định khác: `tamba kāmā tudanti maṁ` (1.4) — `kāmā` đọc được là “ham muốn” (sở thích
  của nàng), `tudanti` = kéo/lôi; tôi dịch “cái trống của nàng vẫn kéo ta đến” và ghi ở đây.
  `makarehi abhidā nāvā` (3.3) — `makara` ở đây là phao/bè mộc hình cá dùng cho tàu qua
  sông; “bè cá gỗ” là cách tôi chọn vì `makara` cũng là loài cá biển.

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  **Giải quyết draft 2026-10-12.** Mục này THAY THẾ các nhận định cũ về `1.2`/`1.4`, `2.1`–`2.4`, `3.1`–`3.4`, `4.4`, `5.3`–`5.4`, uddāna `8.1`–`8.3` và các ghi chú "bè cá gỗ", "cái trống", "Mandakkhī là tên", "Kurukacchā là tên thành giàu có" ở trên; những chỗ đó là đọc sai Pāli, không phải bất định.

  *Phân loại blocker.* Blocker duy nhất còn trong `blocking_errors` là loại (A): bản chụp đã ghim không phát hành bản Anh cho bài này — sự thật về upstream, GIỮ NGUYÊN. Phần câu đó nói thêm tầng `vietnamese-current` vắng (loại C): chỉ là giới hạn tham chiếu (tầng đó chỉ có Pháp Cú), không phải lỗi văn bản; câu blocker được giữ nguyên chữ vì chỉ là một chuỗi. Coverage Anh: mẫu số 0 (không có khoá Pāli ≥ 40 ký tự), nên cổng không đo được gì; ba tầng tham khảo đều vắng ⇒ `triangulation` 7,0.

  *Khung truyện.* Pāli root chỉ có bốn lời kệ đối đáp, nên người nói phải suy từ cấu trúc: `1.x` và `3.x`–`5.x` cùng một người nói ("ahaṁ" ở 3.4, "maṁ" ở 1.4/4.1/5.1), gọi `tamba` ở 1.4 và 5.4 (cùng một đối tượng, một danh xưng số ít hô cách; `vijānahī` là mệnh lệnh ngôi hai); `2.x` là người khác hỏi lại ("tuyhañca" ở 2.3 = "và của ông"), nên đổi "ta" thành "ông". Để hiểu khung truyện (không chép câu chữ) tôi đối chiếu thứ cấp với các bản Anh phạm vi công cộng của Cowell và Francis–Neil, đọc qua tóm lược: Tamba là vua Bārāṇasī, Suyonandī là hoàng hậu bị một Garuḷa đem đi, người hát rong thuật lại bằng kệ chuyện thuyền đắm ở Kurukaccha (các bản Anh ghi Bharukaccha) và chuyện được nàng cứu. Đây chỉ là tham chiếu hiểu nghĩa, không phải tầng đã ghim và không thay Pāli; mọi tên ở trên chỉ dựa vào dạng hô cách/cấu trúc câu Pāli, không thêm thông tin từ truyện vào bản dịch.

  *Khoá đã sửa (accuracy fix).* 1.1 `gandho … vāti` đã mất chữ "hương": "Gió xua tan bóng tối" → "Hương của các cây timira thoảng bay" (`timirānaṁ` sở hữu cách số nhiều; hai bản Anh đều hiểu là rừng/cây timira; dạng Pāli giữ nguyên vì chưa có tên Việt chắc chắn); 1.2 bỏ "ao hồi" → "biển cả vang tiếng ầm ào"; 1.3 `dūre ito` = "xa nơi này"; 1.4 `tamba` là hô cách "này Tamba" (không phải cái trống), `kāmā tudanti maṁ` = "những ham muốn đang dằn vặt ta"; 2.1–2.4 đổi người nói thành ngôi hai (`atari`, `addakkhi` ngôi 2/3 aorist; `tuyhañca` ngôi hai) và `ahu saggasamāgamo` = "đã có cuộc hội ngộ cõi trời", câu cuối "làm sao ta có được của cải ấy" là bịa; 3.1–3.2 dùng lại nguyên văn tiền lệ `ja463:2.1`/`2.2` (cùng công thức `Kurukacchā payātānaṁ vāṇijānaṁ dhanesinaṁ`, 1 cặp trùng Pāli ngoài bài, bản Việt giữ nguyên) thay cho "Có thành nọ tên là Kurukaccha, giàu có các thị trấn…" (sai ngữ pháp: `payātānaṁ` là phân từ "những người đã ra đi"); 3.3 `makarehi abhidā nāvā` = "thuyền … bị các thủy quái makara đập vỡ" (không phải "bè cá gỗ"); 3.4 `phalakenāhamaplaviṁ` = "ta trôi nổi nhờ một tấm ván" (không phải "qua được mặt nước"); 4.4 `mātā puttaṁva orasaṁ` dùng lại "như mẹ thương đứa con ruột", tiền lệ 3 lần (dn31:26.8, dn16:1.31.11, ud8.6:24.2); "bế … trên lòng" là thêm nghĩa; 5.3 `mandakkhī` là tính từ ("e thẹn", tương ứng Skt. `mandākṣa` chỉ sự e thẹn), không phải tên riêng; 5.4 `evaṁ tamba vijānahī` = "này Tamba, hãy biết như vậy"; 8.1–8.3 sửa "bậc thắng trí" (`jinavaro` = bậc Chiến Thắng tối thượng, không phải `abhiññā`) và chính tả `Bhiṇṇaplava` → `Bhinnaplava`, `Bhūnahata` → `Bhūnahatā`. Tổng số khoá lỗi nghĩa thật: 15/31 (1.1, 1.2, 1.3, 1.4, 2.1–2.4, 3.1–3.4, 4.4, 5.3, 5.4) cộng 3 khoá uddāna sửa chính tả/chức danh; các khoá còn lại giữ nguyên.

  *Bất định còn lại, không thêm vào thân kinh.* (1) `timirānaṁ` — nghĩa "cây/rừng timira" dựa trên cách hiểu của các bản Anh cũ, chưa kiểm được bằng tầng đã ghim; (2) `kusamuddo` (1.2) — thành tố đầu `ku-`/`kusa-` chưa phân giải được, tôi chỉ dịch phần chắc chắn là "biển … vang tiếng" (`ghosavā`); (3) `sedumaṁ` (2.2) — hapax toàn corpus Pāli đã ghim, được hiểu là tên đảo của Garuḷa (các bản Anh ghi Seruma, có thể là dị bản d/r); tôi viết hoa "Seduma" như tên riêng và giữ dạng Pāli; (4) `saggasamāgamo` (2.4) — "cuộc hội ngộ cõi trời" hay "cuộc hội ngộ của Sagga" (tên người hát rong trong truyện); chọn cách đọc bám cấu trúc Pāli; (5) `mandakkhī` (5.3) — "e thẹn" là cách đọc có căn cứ ngữ nguyên nhưng không có tiền lệ trong tầng; (6) khoá uddāna `8.x` là chữ gợi nhớ; việc tách `Migamuttamasaggavarena` thành "Miga, Uttama, Saggavara" không phân xử được. Các điểm này chỉ ảnh hưởng sắc thái, không đổi mạch lời kệ; không đủ để giữ thêm blocker.

  *Phép kiểm.* 31/31 khoá, thứ tự khoá khớp Pāli, nháy kép khớp Pāli từng khoá (không có nháy đơn), không có dấu lược `…`/`(…)` trong Pāli nên Việt cũng không có; không có số Pāli trong bài; 1 cặp Pāli trùng ngoài bài đã dùng lại (ja463:2.1/2.2), 0 cặp trùng nội bộ. Tiêu chí 10 vẫn 9,6 vì chưa chạy bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  **Giải quyết draft 2026-10-13 (vòng 2).** Phân loại: blocker cũ là một chuỗi lẫn hai sự thật, nay tách. (A) Không có bản Anh Sujato cho ja360 tại commit đã ghim (xác minh lại: tệp không có trong manifest lẫn cache) — là khẳng định thuần về upstream, được viết lại thành một blocker ngắn `noEnglishEditionUpstream:`, không còn lẫn lời nào về lỗi văn bản. (C) Tầng `vietnamese-current` vắng (chỉ có Pháp Cú) — chỉ là giới hạn tham chiếu, đã gỡ khỏi blocker và ghi ở đây. (B) không áp dụng: mẫu số coverage Anh bằng 0 (không khoá Pāli nào đủ 40 ký tự), cổng không đo được gì. (D) Không có lỗi văn bản nào còn treo thành blocker: đọc đối kháng lại cả 31 khoá, các bất định ở mục "Bất định còn lại" của lượt 2026-10-12 chỉ đổi sắc thái hoặc là tên riêng/chữ gợi nhớ, không đổi mạch lời kệ; giữ nguyên.
  *Khoá đổi vòng 2 (clarity/accuracy fix nhẹ, bỏ chi tiết Pāli không nói).* 1.2 "biển cả vang tiếng ầm ào" → "biển vang tiếng" (`ghosavā` = có tiếng; "ầm ào" là thêm, "cả" dựa vào thành tố `ku-` chưa phân giải được); 4.1 `saṇhena mudunā` "mềm mại dịu dàng" → "mịn màng, mềm mại" (`saṇha` = mịn, tinh tế, không phải "dịu dàng"); 4.2 `candanagandhinī` "ngát hương" → "thơm hương" (`gandhinī` chỉ có hương, không có sắc thái "ngát"). Các khoá còn lại đối chiếu lại với Pāli, giữ nguyên: lỗi nghĩa thật vòng này 3/31 khoá (cả ba là thêm sắc thái nhẹ, không đảo nghĩa).
  *Đối chiếu bổ sung.* Khoá 3.1–3.2 trùng nguyên văn Pāli với ja463:2.1–2.2 (6 khoá của ja463 mang cùng công thức `Kurukacchā payātānaṁ`), bản Việt hai bài khớp nhau; 0 cặp trùng nội bộ trong bài; `timira` còn xuất hiện ở tha-ap83/tha-ap371 như tên một loài hoa ("timirapupphiya"), nên cách đọc `timirānaṁ` là tên cây/hoa timira có thêm căn cứ nội bộ (không phải chắc chắn). `mandakkhī` chỉ có đúng một chỗ trong toàn tầng Pāli đã ghim (ja360:5.3), không có tiền lệ đối chiếu; "e thẹn" vẫn là cách đọc theo ngữ nguyên, ghi là bất định. Uddāna 8.1–8.4 là chữ gợi nhớ (cách xử lý tương tự ja340/ja310: dịch từng từ có nghĩa, giữ tên riêng).
  *Chấm lại.* `terminology` 8,7 → 8,6 và `ambiguity_integrity` 8,5 → 8,4 vì số bất định chưa phân xử (`kusamuddo`, `timirānaṁ`, `sedumaṁ`, `mandakkhī`, `saggasamāgamo`) lớn hơn mặt bằng bài Jātaka có Sujato; `triangulation` giữ 7,0 (không có bản Anh độc lập). Blocker còn lại thắng điểm ⇒ `draft` cho tới khi người điều phối áp waiver `no-upstream-english`. Tiêu chí 10 vẫn 9,6 vì chưa chạy bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 17 khoá chênh lệch lớn nhất → khác nghĩa 0 được xác nhận: sửa 0, giữ 9 (ja360:3.1, 3.2, 4.1, 4.2, 4.3, 1.4, 0.2, 0.3, 0.4: hai bản cùng nghĩa, chỉ khác diễn đạt, thứ tự ngắt dòng, hoặc bản mù giữ tên Pāli; riêng 3.1–3.2 và 4.1–4.3 bản mù dồn hai khoá vào nhau nên độ tương đồng thấp), bất định 8 (ja360:1.1 `timirānaṁ`, 1.2 `kusamuddo`, 2.2 `sedumaṁ`, 5.3 `mandakkhī`, 8.1, 8.2, 8.3, 8.4 khoá uddāna: bản mù cũng tự đánh dấu không chắc đúng ở các chỗ này, trùng với các bất định đã ghi ở trên; bản mù dịch uddāna theo nghĩa từng từ — “chiếc bè vỡ, rắn, cái bình”, “các hang động, voi, kẻ sát hại bào thai” — còn bản dự án giữ tên riêng, Pāli root không phân xử được các chữ gợi nhớ này; giữ nguyên). Đọc đối kháng lại toàn bài: người nói, nháy, số và thuật ngữ nhất quán, không đổi khoá nào. Không có bản Anh hay bản Việt độc lập khác.
