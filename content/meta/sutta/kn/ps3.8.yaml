  - `bhāvanā` → “tu tập” (536/571 khoá); `āsevana` → “thực hành”: `mn44:12.5` “thực hành”, `mn95:21.4` “tập hành”, `pe7:4.1` “thực hành”; chọn “thực hành”. `ekarasa` → “nhất vị”: tầng chỉ có các dạng danh từ (`an1.4:1.1`, `an1.9:1.1`: “một hương vị nào khác”, nghĩa “vị” là vị giác) nên không tham khảo được; chọn “nhất vị” là thuật ngữ Phật học quen thuộc. `anativattana` → “không vượt quá”: 0 tiền lệ. `tadupagavīriyavāhana` → “chuyên chở sự tinh tấn thích ứng với chúng”: 0 tiền lệ, hợp thể của `tad` + `upaga` + `vīriya` + `vāhana`; xem bất định 2. Đây là lý do thứ hai `terminology` hạ xuống 8,7.
  - Tên bài: `Satipaṭṭhānakathā` → “Luận Bàn Về Niệm Xứ”, theo khuôn `ps1.6`–`ps2.8`, `ps3.3`–`ps3.6` (“Luận Bàn Về …”; riêng `ps3.7` dùng “Bài Nói Về …”). Câu kết `Satipaṭṭhānakathā niṭṭhitā.` → “Luận bàn về niệm xứ được hoàn tất.”, theo `ps3.3`–`ps3.6`.
