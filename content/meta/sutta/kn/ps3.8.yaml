notes: |-
  Đợt 19, làn 98. Dịch từ Pāli root commit đã ghim, đủ 157/157 khoá (0.1–0.3, 1.1–1.8, 2.1–2.14, 3.1–3.2, 4.1–4.24, 5.1–5.3, 6.1–6.11, 7.1–7.25, 8.1–8.2, 9.1–9.11, 10.1–10.2, 11.1–11.30, 12.1–12.3, 13.1–13.15, 14.1–14.4); thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Các khoá 1.2–1.8 (đoạn kinh dẫn về bốn niệm xứ) có Pāli giống nguyên văn với các khoá `sn47.*` và `mn125`, nên được đối chiếu với bản Việt của chính các khoá ấy; phần còn lại của bài (giải thích kiểu Paṭisambhidāmagga) không có song song ngoài nội bộ bộ `ps`.

  **Cấu trúc bài.** Bài là một khuôn lặp: dẫn kinh bốn niệm xứ (1) → mỗi niệm xứ gồm câu hỏi “thế nào là sống quán X trên X?”, một danh sách đối tượng, công thức bảy phương diện (quán vô thường/khổ/vô ngã, nhàm chán, ly tham, làm cho diệt, buông xả, và bảy điều từ bỏ tương ứng), công thức “X là sự thiết lập, không phải niệm / niệm vừa là sự thiết lập vừa là niệm / bằng niệm ấy, bằng trí ấy”, câu chốt “vì thế được nói” và bốn nghĩa của tu tập (2–5 thân, 6–8 thọ, 9–12 tâm, 13–14 pháp). Vì khuôn lặp, mọi khoá có Pāli giống nhau đều được dịch giống hệt nhau.

  **Pāli trùng nguyên văn trong chính bài (đã đếm):** 157 khoá, 26 nhóm Pāli trùng (sau khi bỏ thẻ, hạ chữ hoa, bỏ dấu câu), gồm 78 khoá; bản Việt của cả 26 nhóm giống hệt nhau, 0 nhóm khác. Các nhóm lớn: bảy phương diện (2.8 = 4.18 = 13.9); ba vế đầu của danh sách bảy (2.3 = 4.13 = 13.3, 2.4 = 4.14 = 13.4, 2.5 = 4.15 = 13.5, và 2.6 = 13.6); câu thiết lập (2.11 = 4.21 = 6.8 = 7.22 = 9.8 = 11.27 = 13.12; 2.10 = 4.20); câu trí (2.12 = 4.22, 6.9 = 7.23, 9.9 = 11.28); câu chốt (2.13 = 4.23 = 6.10 = 7.24 = 9.10 = 11.29 = 13.14); định nghĩa bốn tu tập (3.1 = 5.1 = 14.1 và 3.2 = 5.2 = 14.2); mở đầu tu tập lược (7.1 = 8.1 = 10.1 = 12.1); `paṭinissajjati, no ādiyati.` (4.17 = 6.3 = 7.17 = 9.3 = 11.22 = 13.8); `paṭinissajjanto ādānaṁ pajahati.` (6.5 = 7.19 = 9.5 = 11.24); 6.4 = 7.18 = 9.4 = 11.23; và các cặp khác chỉ theo chủ ngữ thân/thọ/tâm (2.9 = 4.19, 6.6 = 7.20, 9.6 = 11.25, 6.7 = 7.21, 9.7 = 11.26, 2.14 = 4.24, 6.11 = 7.25, 9.11 = 11.30, 10.2 = 12.2). Cặp gần trùng nhưng khác nội dung, đã đọc từng cặp và giữ khác có chủ ý: 4.16 (`virajjati, no rajjati, nirodheti, no samudeti;`) khác 2.6 + 2.7 vì Pāli gộp hai mệnh đề vào một khoá; 7.2 (`… bhāvanā …pe…`) khác 10.2 và 12.2 (`… bhāvanā.`) ở dấu lược; 2.10 / 6.7 / 9.7 / 13.11 chỉ khác chủ ngữ (thân/thọ/tâm/các pháp), và 13.10 / 13.13 khác 2.9 / 2.12 vì Pāli ở đó dùng `te dhamme` thay `kāyaṁ`.

  **Pāli trùng nguyên văn với tầng đã dịch (đã dò):** 16 chuỗi Pāli của bài có tiền lệ nguyên văn (0.1, 0.2, 1.1–1.8, 2.13, 11.16–11.20). Dùng lại nguyên văn 8: `0.1` “Paṭisambhidāmagga” (13/13 khoá); `0.2` “3. Phẩm Trí Tuệ” (4/5, 1 khoá `ps3.7:0.2` viết “Phẩm Trí Tuệ”); `1.1` “Tại Sāvatthī.” (454/478 khoá, còn lại “Duyên khởi tại Sāvatthī.” 8 · “Nhân duyên ở Sāvatthī.” 5); `1.2` “Này các tỳ-kheo, có bốn niệm xứ này.” (3/4, theo `sn47.36`, `sn47.37`); `1.3` “Thế nào là bốn?” (160 · “Là bốn nào?” 39 · “Bốn niệm xứ nào?” 8, trên 240 khoá); `1.4` (2/2: `sn47.37:1.3`, `sn47.38:1.3`, kể cả dấu chấm phẩy vì danh sách còn tiếp); `1.7` (16 trong 41 khoá, dạng nhiều nhất “… xa lìa tham lam và buồn phiền nơi đời.”); `2.13` “Vì thế được nói—” (13/13, theo `ps1.6`). Khác có chủ ý 8: `1.5` ← `mn125:24.3` “quán thọ trên các thọ …” (chỉ khác chữ hoa đầu khoá theo Pāli); `1.6` ← 9 khoá, hai dạng “sống quán tâm nơi tâm …” 3 và “quán tâm trên tâm …” 3, chọn dạng sau cho thẳng hàng với “trên” ở 1.4/1.5/1.7; `1.8` ← `sn47.24:1.8` “này các tỳ-kheo, đây là bốn niệm xứ”.” (chỉ khác chữ hoa đầu khoá); `11.16`–`11.20` (khoá chỉ có tên thức): trong các khoá có Pāli trùng nguyên văn, dạng “thức của …” chiếm 1–3 khoá cho mỗi loại thức (mắt 3 · tai 1 · mũi 2 · lưỡi 3 · thân 2) và dạng “thức mắt/tai/mũi/lưỡi/thân” 1–2 khoá; trên toàn tầng “thức mắt” 162 · “thức của mắt” 18, “thức thân” 52; danh sách sáu thức ở `dn33:2.2.9`, `mn9:58.3` dùng “thức mắt, thức tai, thức mũi, thức lưỡi, thức thân”; chọn dạng toàn tầng và danh sách sáu thức.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên công cụ đo):**
  - `kāye kāyānupassī viharati` → “sống quán thân trên thân”: “quán thân trên thân” 101 · “nơi thân” 58 · “trong thân” 0; “quán thọ trên các thọ” 20 · “nơi các thọ” 20; “quán tâm trên tâm” 73 · “nơi tâm” 25; “quán pháp trên các pháp” 77 · “nơi các pháp” 58. Chọn “trên” cho cả bốn để một hệ thống. `ātāpī sampajāno satimā` → “tinh cần, tỉnh giác, có niệm”: 188 · “nhiệt tâm, tỉnh giác, có niệm” 47 · “nhiệt tâm, tỉnh giác, chánh niệm” 38. `vineyya loke abhijjhādomanassaṁ` → “xa lìa tham lam và buồn phiền nơi đời”: 137 · “từ bỏ tham lam và ưu não” 46 · “gạt bỏ tham và ưu” 38. Hai dạng này theo đúng `sn47.37:1.3` và nhóm `sn47` cùng Pāli.
  - `satipaṭṭhāna` → “niệm xứ”; `upaṭṭhāna` → “sự thiết lập”: theo `ps1.9:11.1`, `ps2.5:19.2`, `ps3.3:13.7` (`upaṭṭhānaṭṭhena` → “do ý nghĩa thiết lập”, 3/3). `kāyo upaṭṭhānaṁ, no sati` dịch sát chữ “thân là sự thiết lập, không phải niệm”; không thêm “nền tảng”/“đối tượng” vào thân kinh (xem bất định 1).
  - `pathavīkāya` … `aṭṭhimiñjakāya` → “khối đất” … “khối tủy xương”: `pathavīkāyaṁ` → “khối đất” theo `mn76:7.3`, `mn76:8.4`, `sn24.5:1.4` (3/3); `chavi` → “lớp da ngoài” và `camma` → “da trong” theo `dn23:18.10`, `dn23:20.11`, `dn23:20.14`; ở đây ghi “khối da ngoài” và “khối da trong” (bỏ chữ “lớp” để cùng khuôn “khối X”). `nhāru` → “gân” (63 khoá chứa `nhāru`, các khoá `dn22`, `dn23`, `dn28` đều “gân”). `rudhira` không có tiền lệ cùng dạng (0 khoá); dịch “máu” theo cách các khoá `dn22:5.2`, `dn28:7.4` dịch `lohita` “máu”.
  - `aniccato anupassati, no niccato` → “quán là vô thường, không quán là thường”: [ĐÍNH CHÍNH 2026-10-11: đo lại thì công thức này CÓ tiền lệ — 7 khoá ở `ps1.1` và `ps1.3`, bản Việt 7/7 là “quán là vô thường, không quán là thường”, trùng bài này; xem “Lượt cải thiện”.] Bản đầu ghi nhầm “0 tiền lệ”, đặt theo ngữ pháp (`-to` cách “như là”, `no` phủ định vế sau, động từ `anupassati` bị lược ở vế `no niccato`).
  - `nibbindati` → “nhàm chán” (60/154 khoá chứa `nibbindati` dùng đúng “nhàm chán”; các khoá còn lại bản Việt lược hoặc viết khác, không đo thêm); `virajjati` → “ly tham” (82/87); `nandati`/`nandiṁ` → “hoan hỷ” (148/241); `rajjati` → “tham đắm” (19 · “tham” 111 trên 140 khoá; dùng “tham đắm” để khác `rāga` → “tham” ở 2.8); `samudeti` → “sinh khởi” (12/13); `paṭinissajjati`/`paṭinissajjanto` → “buông xả” ([đính chính 2026-10-11: cặp `paṭinissajjati, no ādiyati` có 7 khoá tiền lệ ở `ps1.1`/`ps1.3`, cả 7 là “buông xả, không nắm giữ”; ghi “tầng có 1 khoá” ở bản đầu là sai]; “từ bỏ” xuất hiện ở 70/90 khoá chứa `paṭinissajj-` nói chung, nhưng cùng khoá 2.8 đã dùng “từ bỏ” cho `pajahati` nên dùng “buông xả” để giữ hai từ khác nhau); `ādiyati`/`ādāna` → “nắm giữ”, `nirodheti` → “làm cho diệt” (`ps3.3:17.3` “làm diệt cái đã diệt”). `niccasaññā`/`sukhasaññā`/`attasaññā` → “tưởng thường/tưởng lạc/tưởng ngã”: theo họ `aniccasaññā` → “tưởng vô thường” (84 khoá chứa `niccasaññ`, ví dụ `dn34:1.8.45`, `dn34:2.2.64`); không có tiền lệ cho `niccasaññā`, `sukhasaññā`, `attasaññā` đứng riêng; `samudaya` ở 2.8 → “sự sinh khởi” (cùng gốc với `samudeti`, chọn đồng nhất thay vì “tập khởi”, 0 tiền lệ cho dạng này ở công thức bảy phương diện).
  - `ākāra` → “phương diện”: 20 · “hình thái” 6 trên 49 khoá chứa `ākārehi`; theo `dn5:16.1`, `dn5:16.16`, `pe4:5.5`.
  - Danh sách thọ (7.3–7.16): `sāmisaṁ`/`nirāmisaṁ` → “thuộc về thế tục”/“không thuộc về thế tục”: tầng đo 26 khoá chứa `sāmis-`: “vật chất” 13 · “thế tục” 7; nhưng ở phạm vi gần nhất, `mn10:32.5`–`32.10` (đúng cùng danh sách sáu thọ này) dùng “thuộc về thế tục” 6/6 ⇒ theo phạm vi gần nhất và ghi hai số. `cakkhusamphassajaṁ vedanaṁ` → “thọ do xúc mắt sinh”: “xúc mắt/xúc ý” 93 khoá (“xúc của ý” 0).
  - Danh sách tâm (11.1–11.15): theo đúng `mn10:34.2`–`34.17` (cùng mười sáu loại tâm): “tâm không tham / có sân / không sân / có si / không si / co hẹp / tán loạn / rộng lớn / không rộng lớn / chưa đạt mức cao nhất / đã đạt mức cao nhất / có định / không có định / được giải thoát / chưa được giải thoát”; `sauttaraṁ`/`anuttaraṁ` → “chưa đạt mức cao nhất”/“đã đạt mức cao nhất”: tầng chỉ có 2 khoá cho `sauttaraṁ`, cả hai là `mn10`; `saṅkhittaṁ` → “co hẹp” (`mn10`) so với “co rút” 2 khoá ở nơi khác (`sn`/`an`). Đây là một chỗ chọn dạng nơi có tiền lệ gần nhất dù không cao nhất toàn tầng. `manoviññāṇaṁ` → “thức ý” (131 · “ý thức” 29).
  - `bhāvanā` → “tu tập” (536/571 khoá); `āsevana` → “thực hành”: `mn44:12.5` “thực hành”, `mn95:21.4` “tập hành”, `pe7:4.1` “thực hành”; chọn “thực hành”. `ekarasa` → “nhất vị”, `anativattana` → “không vượt quá”, `tadupagavīriyavāhana` → “chuyên chở sự tinh tấn thích ứng với chúng”: [ĐÍNH CHÍNH 2026-10-11: bản đầu ghi nhầm “0 tiền lệ” và “chỉ có các dạng danh từ”; đo lại, cả ba có tiền lệ nguyên văn trong chính công thức bốn sự tu tập ở `ps1.1`, `ps1.3`, `ps2.1` — `anativattanaṭṭhena` 55 khoá “không vượt quá”, `ekarasaṭṭhena` 42/50 khoá “nhất vị” (8 khoá còn lại là các câu khác, “đồng một vị”/“cùng một vị”), `tadupagavīriyavāhana` 13/13 khoá “chuyên chở sự tinh tấn thích ứng với chúng”, `āsevanaṭṭhena` 32/32 “thực hành”]. `tadupagavīriyavāhana` là hợp thể của `tad` + `upaga` + `vīriya` + `vāhana`; nghĩa cụ thể vẫn là bất định (xem bất định 2).
  - Tên bài: `Satipaṭṭhānakathā` → “Luận Bàn Về Niệm Xứ”, theo khuôn `ps1.6`–`ps2.8`, `ps3.3`–`ps3.6` (“Luận Bàn Về …”; riêng `ps3.7` dùng “Bài Nói Về …”). Câu kết `Satipaṭṭhānakathā niṭṭhitā.` → “Luận bàn về niệm xứ được hoàn tất.”, theo `ps3.3`–`ps3.6`.
  - Thẻ `<b>`: bỏ thẻ khỏi bản Việt vì tầng Việt không có khoá nào dùng thẻ này (0 tệp); các khoá `<b>Bhāvanā</b>ti …` dịch “Tu tập nghĩa là có bốn sự tu tập —”, không dùng nháy đơn để tránh lệch số nháy so với Pāli từng khoá (Pāli không có nháy).
  - Không đụng `content/glossary/pali-vi.yaml`.

  **Số Pāli (tự tính, in phép):** `cattāro` (1.2, 1.3, 1.8) = 4; `catasso` (3.1, 5.1, 7.1, 8.1, 10.1, 12.1, 14.1) = 4, và 3.2 liệt kê đúng 4 mục (`anativattana`, `ekarasa`, `tadupagavīriyavāhana`, `āsevana`); `sattahi ākārehi` (2.9, 4.19, 6.6, 7.20, 9.6, 11.25, 13.10) = 7, và khoá 2.2–2.7/2.8 liệt kê đúng 7 mục (vô thường/tưởng thường · khổ/tưởng lạc · vô ngã/tưởng ngã · nhàm chán/hoan hỷ · ly tham/tham · làm cho diệt/sinh khởi · buông xả/nắm giữ) ở cả hai vế. Không có số nào khác (không có `sahassa`, `navuti`, `tiṁsa…`); chữ số chỉ ở tiêu đề `0.2` (“3.”) và `0.3` (“3.8.”). Số lượng mục trong danh sách `4.2`–`4.12` + `2.2`: 13 khối thân (đất, nước, lửa, gió, tóc, lông, da ngoài, da trong, thịt, máu, gân, xương, tủy xương) = 1 + 11 + 1; danh sách thọ `7.3`–`7.16` + `6.2` = 15 loại (lạc; khổ; không khổ không lạc; sáu loại thế tục/không thế tục; sáu loại do xúc) — bản đã đếm khớp Pāli; danh sách tâm: `sarāgaṁ` (9.2) + 11.1–11.15 = 16 loại tâm, rồi 11.16–11.21 = 6 thức, tổng 22 mục; cả ba số đã đếm trực tiếp trên Pāli và khớp bản Việt.

