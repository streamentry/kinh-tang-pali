  - Không đụng `content/glossary/pali-vi.yaml`.

  **Số Pāli (tự tính, in phép):** `cattāro` (1.2, 1.3, 1.8) = 4; `catasso` (3.1, 5.1, 7.1, 8.1, 10.1, 12.1, 14.1) = 4, và 3.2 liệt kê đúng 4 mục (`anativattana`, `ekarasa`, `tadupagavīriyavāhana`, `āsevana`); `sattahi ākārehi` (2.9, 4.19, 6.6, 7.20, 9.6, 11.25, 13.10) = 7, và khoá 2.2–2.7/2.8 liệt kê đúng 7 mục (vô thường/tưởng thường · khổ/tưởng lạc · vô ngã/tưởng ngã · nhàm chán/hoan hỷ · ly tham/tham · làm cho diệt/sinh khởi · buông xả/nắm giữ) ở cả hai vế. Không có số nào khác (không có `sahassa`, `navuti`, `tiṁsa…`); chữ số chỉ ở tiêu đề `0.2` (“3.”) và `0.3` (“3.8.”). Số lượng mục trong danh sách `4.2`–`4.12` + `2.2`: 13 khối thân (đất, nước, lửa, gió, tóc, lông, da ngoài, da trong, thịt, máu, gân, xương, tủy xương) = 1 + 11 + 1; danh sách thọ `7.3`–`7.16` + `6.2` = 15 loại (lạc; khổ; không khổ không lạc; sáu loại thế tục/không thế tục; sáu loại do xúc) — bản đã đếm khớp Pāli; danh sách tâm: `sarāgaṁ` (9.2) + 11.1–11.15 = 16 loại tâm, rồi 11.16–11.21 = 6 thức, tổng 22 mục; cả ba số đã đếm trực tiếp trên Pāli và khớp bản Việt.

  **Dấu câu.** Nháy khớp Pāli từng khoá: 157/157 khoá khớp số lượng của `“`, `”`, `‘`, `’`, `(`, `)` (0 lệch). Pāli mở nháy kép ở `1.2`, đóng ở `1.8` (chạy qua nhiều khoá), và có cặp nháy trọn ở 2.14, 4.24, 6.11, 7.25, 9.11, 11.30, 13.15 — đúng là khớp Pāli từng khoá, không phải mỗi khoá tự cân. Không có nháy đơn ở Pāli của bài. Dấu lược: Pāli có `…` hoặc `…pe…` ở 59 khoá, bản Việt đúng một `…` ở đúng 59 khoá ấy (0 lệch); `…pe…` → đúng một `…`; Pāli không có `(…)` nên Việt cũng không có `(…)` trần ở khoá nào. NFC 157/157, 0 khoá rỗng, 0 khoảng trắng thừa; Pāli lọt sang Việt: chỉ `Sāvatthī` (tên riêng, 1.1) và `Paṭisambhidāmagga` (0.1, trùng tiền lệ 13/13).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `upaṭṭhāna` ở 2.10–2.11 (và các khoá lặp): bản này dịch “sự thiết lập”. Nghĩa là thân (đối tượng) là chỗ/việc thiết lập niệm, còn niệm vừa là chính việc thiết lập vừa là niệm; cách hiểu truyền thống còn gloss `upaṭṭhāna` là “nền tảng” hoặc “đối tượng”. Không viết các từ đó vào thân kinh vì Pāli không nói; chỉ ghi ở đây.
  2. `tadupagavīriyavāhanaṭṭhena` (3.2, 5.2, 14.2): hợp thể dài và hiếm; đọc `tad` “những điều ấy (các pháp và các căn vừa nêu)”, `upaga` “đi cùng, hợp với”, `vīriya` “tinh tấn”, `vāhana` “sự chuyên chở/dẫn đi”: “chuyên chở sự tinh tấn thích ứng với chúng”. Cách đọc khác: “tinh tấn hợp với các pháp ấy, đang dẫn đi”. Không có tiền lệ trong tầng (0 khoá) và không có tầng tham khảo, nên không phân xử được; dùng cách đọc ít giả định nhất.
  3. `anativattanaṭṭhena` (3.2…): “không vượt quá” — Pāli không nêu cái gì không vượt quá cái gì; truyền thống hiểu là các pháp sinh khởi trong đó không vượt quá nhau. Bản này giữ nguyên “của các pháp sinh khởi trong đó”, không thêm “nhau”.
  4. `nirodheti, no samudeti` (2.7, 4.16, 13.7): `nirodheti` là dạng nhân quả (làm cho diệt) còn `samudeti` là dạng không nhân quả (sinh khởi); dịch “làm cho diệt, không để sinh khởi” giữ độ đối lập, nhưng “không để” có thể nặng nghĩa nhân quả hơn Pāli một chút. Cách đọc khác: “làm cho diệt, không làm cho sinh khởi”.
  5. Chủ ngữ “người ấy” (2.9, 2.12, 5.3, 8.2, …): Pāli không có chủ ngữ rõ; chủ ngữ ngầm là `idhekacco` “ở đây, có người”, khác `bhikkhu` ở 1.4. Giữ “người ấy”, không đổi thành “vị tỳ-kheo”.
  6. Khoá lặp lược (4.1, 6.2, 7.3, 9.2, 11.1, 13.2…): các khoá `…pe…` ở Pāli bị lược ngay sau đối tượng (ví dụ 4.1 `Idhekacco āpokāyaṁ …pe…`); bản Việt dùng “Ở đây, có người đối với khối nước …” — chữ “đối với” là chữ ngữ pháp để khối từ đứng được, không mở rộng phần bị lược (đã đo: đúng một `…`). Khoá 6.2/9.2/7.16/11.21 có sẵn `aniccato anupassati, no niccato` nên giữ nguyên.
  7. `chavi` → “da ngoài”, `camma` → “da trong”: theo tiền lệ `dn23` (“lớp da ngoài”, “da trong”); ranh giới nghĩa giữa hai từ này không được bài tự giải thích nên không thêm gì vào thân kinh.
  8. `ṭhapetvā kāyaṁ ṭhapetvā vedanaṁ ṭhapetvā cittaṁ tadavasese dhamme` (13.2): dịch “trừ thân, trừ thọ, trừ tâm, quán các pháp còn lại”; không nêu trong bài các pháp còn lại gồm những gì (truyền thống: các pháp trừ thân, thọ, tâm, tức tưởng, hành và các pháp khác); không viết vào thân kinh.

