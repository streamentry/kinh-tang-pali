notes: |-
  **Đây là bài `published` đầu tiên trong Vuttantavagga của Saṃyutta Khuddaka** — trước khi tôi viết, tầng Việt có **0** tệp `vv*` (đếm được: `ls content/translation/vi/project/sutta/kn/ | grep ^vv` rỗng). Nên **không có bài anh em `vv*` đã publish làm mẫu** như BRIEF_VI3 gợi ý; tôi dựng cách đặt tiêu đề từ cấu trúc `vv*` trong chính Pāli gốc (đọc `vv60`, `vv61`, `vv67`, `vv68`, `vv70`, `vv71`, `vv72` bên cạnh) và từ tiền lệ `<X>vatthu` → *Chuyện …* của tầng (`dhp92:0` *Chuyện Trưởng lão Belaṭṭhasīsa*).

  **Bài gần như toàn lược, nên 9/11 khoá là tiêu đề, dấu lược, dòng trong ngoặc biên tập và công thức quy kết.** Không có lựa chọn nào để lấp; tôi KHÔNG mở rộng bất cứ dấu lược nào (BRIEF_VI3 §10.1): `1.2` và `3.2` là `…pe…` → **mỗi khoá đúng MỘT** `…`.

  **Tự kiểm.** `kiểm()` của `_hvi.py` bắt đúng một khoá (`2.1`) vì đó là khoá ≥ 40 ký tự duy nhất. Nhưng các cổng còn lại — cân ngoặc kép, dấu lược mọi khoá, không Pāli lọt — thì **không** tự chạy cho 8/12 bài của lát, nên tôi tự quét MỌI khoá của cả lát (`_tvd7_2_chk.py`, 136 khoá): đúng tập khoá, NFC, số dấu lược khớp từng khoá, ngoặc kép cân, không Pāli lọt, không `(…)`, không trùng Pāli, `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Thuật ngữ đặt mới, đều ghi ở đây vì 0 tiền lệ.**
  Số đếm lấy trên cây làm việc lúc bàn giao; các agent khác còn đang viết song song nên các con số này sẽ trôi — điều bền vững là tên khoá tiền lệ nêu kèm: `vimāna` (0 chỗ trong tầng Việt) → *cảnh giới thần*, chọn vì `vimāna` là biệt danh cõi trời và *cảnh giới* đã là cách tầng dùng cho `gocaro` (`ne28:2.1`, `mn106:2.5`). `purisavimāna` → *Cảnh giới của người phàm* (đối xứng với *cảnh giới thần* ở `0.1`; đây là chỗ tôi suy từ cấu trúc `0.1`/`0.2` của Vuttantavagga, không phải từ chú giải). `upassayadāyaka` → *kẻ ban sự hộ trì*: đọc theo hành động trong `vv68:4.2` `Upassayaṁ arahato adamha` (*ta đã cho sự hộ trì tới bậc A-la-hán*) — tức `…dāyaka` là **bên cho**, không phải bên được cho. `pāyāsa` → *Hộ Trì*: từ điển cho hai nghĩa (*sự bảo vệ* và *người hầu hạ*), và phẩm này toàn chuyện thần tử bố thí và hộ trì, nên tôi chọn *Hộ Trì*; đây là chỗ dễ còn ý kiến khác nhất, nên `triangulation` và `ambiguity_integrity` hạ thấp. `vaṇṇo` → *dung sắc* (151 chỗ; `an5.44:11.4` `abhikkantavaṇṇo` → *dung mạo tuyệt đẹp*). `sabbadisā` → *khắp bốn phương* (8 chỗ).

  **Đối chiếu anh em trong chính Pāli gốc.** `vv69:1.1` `Suriyo yathā vigatavalāhake nabhe,` đổi chủ ngữ từ *canda* (trăng, ở `vv68:1.1`) sang *suriyo* (mặt trời) — đúng kiểu lặp-và-biến của Vuttantavagga, nên tôi dịch *Mặt trời y như bầu trời khi mây đã tan rã,* giữ hình ảnh và đổi chủ thể. `vv69:2.1` `(Yathā purimavimānaṁ tathā vitthāretabbaṁ.)` là **chú thích biên tập** trong ngoặc, không phải lời nói ai; tôi giữ ngoặc và dịch *(Như những cảnh giới trước, cũng nên trình bày đầy đủ.)*.

  **Tầng Anh đã đổi trong lúc tôi làm — và tôi KHÔNG đổi `triangulation` vì nó.** Lúc tôi đo, `englishCoverageFor('kn','vv69')` cho `substantiveSegments: 1`, `substantiveWithoutEnglish: 1`, tỉ lệ **0%**. Giữa lúc đó một agent khác đã ghi vào đĩa `content/translation/en/project/sutta/kn/vv69_translation-en-project.json` (11 khoá) kèm scorecard `status: published`, nên bây giờ chỉ số coverage của kho là 100%. Nhưng đó là **bản lấp English do chính tầng dự án tạo ra**, và `assessed_by` của nó trùng `assessed_by` của bài Việt này — tức **không phải một bản Anh độc lập**; `AGENTS.md` nói thẳng một bản lấp do cùng người chấm thì scorecard tiếng Việt **không được** tuyên bố đã đối chiếu English. Vì vậy `triangulation` của tôi vẫn 6,5 và tôi ghi điểm này ra đây. (Bản Anh **đã ghim** thì vẫn không có: xem ngay dưới.)

  **Vì sao `draft`.** Tại commit đã ghim, tầng English Sujato **không có thư mục `kn/vv`** (đếm được: `ls .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/` ra `cp dhp iti ja kp snp thag thig ud`, không có `vv`). `englishCoverageFor('kn','vv69')` đo được: 1 segment nội dung (`2.1`), 0 segment nào có tiếng Anh, tỉ lệ 0%. `validate` xem thiếu tệp Anh là **lỗi chặn** cho `review`/`published`, nên bài giữ `draft` — đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho, và tôi ghi nó làm blocker thật chứ không nâng điểm để né.

  **Không có bản Việt tham khảo** tại commit đã ghim (`translation/vi/` bilara chỉ có 26 tệp Pháp Cú).

  **`technical_integrity` 9,6** vì đợt này cấm `npm run validate|test|build`.

  **Lượt cải thiện 2026-10-13** (đọc đối kháng từng khoá Pāli↔Việt, rồi đo tiền lệ trên tầng `kn/vv*`; 8/11 khoá đổi, `0.2`, `1.2`, `3.2` giữ).

  - `3.1` — *accuracy fix*. Cũ: *Do tu pháp ấy, dung sắc dạng ấy,* — *tu pháp* không có trong Pāli (`Tena metādiso vaṇṇo` = *nhờ đó, dung sắc của tôi như thế này*; không có từ nào nói về tu tập). Mới: *Nhờ vậy tôi có được dung sắc như thế này,* — đúng công thức mà tầng dùng ở **57/64** khoá `Tena metādiso vaṇṇo` trong `kn` ngoài bài này (7 chỗ còn lại là biến thể *Do đó/Do nghiệp ấy…*, *ta* thay *tôi*). Tiêu chí đổi: `semantic_fidelity` 9.0 → 9.4.
  - `1.1` — *accuracy fix*. Cũ: *Mặt trời y như bầu trời khi mây đã tan rã,* — đọc `suriyo yathā … nabhe` thành *mặt trời giống bầu trời*, sai cú pháp (`yathā` mở so sánh, `nabhe` là định vị cách *giữa bầu trời*). Mới: *Như mặt trời giữa bầu trời mây tan sạch,* — khớp đúng khoá song song `vv68:1.1` (*Như mặt trăng giữa bầu trời mây tan sạch,*). `grammar_logic` 9.1 → 9.4.
  - `2.1` — *accuracy fix* (số). `purimavimānaṁ` là số ít, cũ dịch *những cảnh giới trước* (số nhiều). Mới: *(Phải được trình bày rộng ra giống như cung điện trước.)* — theo đúng khuôn các dòng ngoặc biên tập cùng loại ở `vv33:11.1`, `vv33:46.1`, `vv54:10.1` (*… phải được trình bày rộng ra giống như …*). Vẫn là chú thích biên tập trong ngoặc, không mở rộng nội dung.
  - `0.4`, `4.1` — *terminology fix*. Cũ dùng *cảnh giới* cho `vimāna` và *kẻ ban sự hộ trì* cho `upassayadāyaka`. Đo trên toàn `kn/vv*`: `vimāna` ở khoá tiêu đề/kết được dịch *cung điện* 253 lần, *thiên cung* 100 lần, *lâu đài* 11 lần, và *cảnh giới* **4 lần — cả 4 đều ở chính bài này** (0 lần ở bài nào khác). `upassaya` được dịch *chỗ trú* ở `vv68:0.4`, `vv68:6.1` và `vv74:9.2` (*bố thí chỗ trú*), *chỗ trú ngụ*/*nơi trú ngụ* ở `ja524`, `ja546`. Bài này là bài song sinh của `vv68` (`Paṭhamaupassayadāyakavimāna` → *Thiên Cung Người Bố Thí Chỗ Trú Thứ Nhất*), nên mới: *5. Chuyện Thiên Cung Người Bố Thí Chỗ Trú Thứ Hai* và *Thiên Cung Người Bố Thí Chỗ Trú Thứ Hai, thứ năm.* — mọi lựa chọn cũ nêu ở phần trên (*cảnh giới thần*, *sự hộ trì*) bị thay vì không còn bám tiền lệ nào. `terminology` 8.8 → 9.4.
  - `0.1` — *terminology fix*: *Chuyện về cảnh giới thần* → `Vimānavatthu`, đúng tên bộ như **84/84** bài `vv*` khác (các bài còn lại) giữ (tầng để nguyên tên bộ ở khoá `:0.1`). `0.3` — *Phẩm Hộ Trì* → *Phẩm Pāyāsi*: `Pāyāsi` là tên riêng (tên phẩm theo bài mở đầu), 9/9 bài `vv65`–`vv73` khác dùng *Phẩm Pāyāsi*; *Hộ Trì* là nghĩa tôi tự chọn từ từ điển, không có tiền lệ. Hai khoá này đưa bất định *Pāyāsi = hộ trì* trong phần trên về **không còn trong canonical text**; `ambiguity_integrity` 8.8 → 9.0 (nghĩa thật của `Pāyāsi` trong tên phẩm vẫn không phân xử được bằng căn cứ đã có).
  - `3.3` — *clarity/style fix*: thêm *và* theo `ca` của Pāli (`Vaṇṇo ca me …`), *khắp bốn phương* → *khắp muôn phương* (đa số hẹp: *muôn phương* 31 khoá, *mọi phương* 26 khoá trong 57 khoá `Vaṇṇo ca me sabbadisā…` ngoài bài này; *bốn phương* 0 khoá), bỏ *rực rỡ* vì `pabhāsatī` là *chiếu sáng* và Pāli không có chữ tương ứng với *rực rỡ*. `vietnamese_clarity` 9.0 → 9.3.

  **Điểm không đổi.** `triangulation` giữ 6.5 (vẫn không có bản Anh độc lập tại commit đã ghim; bản lấp English của dự án không tính). `han_viet_balance`, `segment_alignment`, `source_provenance`, `technical_integrity` giữ nguyên vì không có thay đổi tương ứng. Cặp Pāli trùng nguyên văn trong bài: `1.2`/`3.2` (`…pe…`) đều là `…`, 1 cặp, 0 lệch. Các đoạn cũ ở trên về thuật ngữ đặt mới (*cảnh giới thần*, *sự hộ trì*, *Hộ Trì*, *khắp bốn phương*) và lý do `draft` là lịch sử của lượt trước; lượt này đã thay chúng ở các khoá nêu, và **không** còn *cảnh giới* ở khoá nào của bài.

  **Công cụ.** `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy trong lượt này (cấm chạy); `technical_integrity` vẫn 9,6.
