notes: |-
  Đã đọc HẾT p49.txt (40 khoá) trước khi viết. Mọi khuôn `:0.1` `:0.3` `:9.1`–`:9.3`
  `:10.1` `:11.1` dùng lại nguyên văn đã có, đếm trên 307 bài `tha-ap` đã dịch trọn
  (số đếm ghi ở `tha-ap117` cùng lát). Riêng `buddhasaññāyidaṁ phalaṁ` (7.4) có
  tiền lệ **nguyên văn y hệt** ở tha-ap311:3.4 `đó là quả báo của niệm tưởng về
  Đức Phật` — bản thứ hai của cùng bài kệ ấy ở `tha-ap75`, nên đây là tiền lệ mạnh.

  DẤU LƯỢC: `:9.2` là `…pe…`, giữ **đúng một** `…`.

  BẤT ĐỊNH ĐÃ GHI. (1) `kappaṁ saggamhi modahaṁ` (6.2) — chữ Pāli không rõ (`saggamhi`
  có thể là `sagge` + `amhi`), 0 tiền lệ; tôi dịch `rồi ở cõi trời, tôi hân hoan`,
  giữ `modahaṁ` (tôi vui mừng) ở ngôi `tôi` cho khớp `kittetvā` và `caritaṁ mayā`
  xung quanh. (2) `medanī jalamekhalā` (1.4) — 0 tiền lệ; `medanī` là khe nứt của
  đất, `jalamekhalā` là dòng nước; dịch `mặt đất nứt toác thành dòng nước`. (3)
  `Uppādo nu kimatthāya, āloko vipulo ahu` (3.3–3.4) — câu hỏi về nguồn của ánh
  sáng dị thường; tôi dịch `Do đâu mà sinh ra / ánh sáng rộng lớn dường này`, giữ
  dấu hỏi ở vế trước như Pāli. (4) `suvicittavaṭaṁsakaṁ` (2.2) — 0 tiền lệ;
  `vaṭaṁsaka` = báo hiệu, `suvicitta` = rõ ràng; dịch `có dấu hiệu rõ ràng là điều
  lành`. (5) `Ito cuddasakappamhi` (8.1) — dịch `Từ tám ngàn kiếp trước`; `Ito` ở
  đây là mốc quá khứ, không phải `từ nay trở đi`.
  `technical_integrity` đặt 9.6: không ai rà lại bằng con người.
