notes: |-
  **Phạm vi: đủ 114/114 khoá của `all`**, không khoá nào ngoài lát; thứ tự khoá trong tệp dịch bằng đúng thứ tự Pāli. Năm phép tự viết đều chạy trên 114/114: (1) tập khoá Việt bằng tập khoá Pāli, 114 = 114, thừa 0, thiếu 0; (2) nháy kép khớp Pāli từng khoá, 0 lệch trên 114 (Pāli mở 11, đóng 11: mở ở 1.1, 3.1, 5.1, 8.1, 10.1, 12.1, 15.1, 16.1, 17.1, 18.1, 19.1, đóng ở 2.4, 4.4, 7.4, 9.3, 11.6, 14.4, 15.6, 16.4, 17.6, 18.4, 26.4; bản Việt đúng cùng vị trí), nháy đơn Pāli 0 và bản Việt 0; (3) Pāli trùng nguyên văn trong chính bài, xem dưới; (4) dấu lược, xem dưới; (5) số Pāli, xem dưới. Thêm: NFC 0 lỗi, khoá rỗng 0, thừa khoảng trắng 0, từ Pāli lọt sang Việt chỉ có `Vimānavatthu` ở 0.1 (cố ý, theo 74/76 khoá cùng Pāli ở tầng).

  **VĂN PHONG.** `vv34` là kệ, không phải văn xuôi: 26 bài kệ (`1.1`–`26.4`, 109 vế: ba bài `11`, `15`, `17` mỗi bài 6 vế, bài `9` có 3 vế vì vế giữa là `…pe…`, các bài còn lại 4 vế) cộng 4 khoá tiêu đề `0.1`–`0.4` và khoá chốt `27.1`. Chiều dài Pāli của khoá ngắn nhất 4 (`9.2`, chỉ có dấu lược), dài nhất 35 ký tự. Bản Việt giữ nhịp kệ, mỗi khoá một vế, không văn xuôi hoá.

  **Nguồn.** Dịch từ Pāli root đã ghim (`source/upstream-manifest.json`, commit `11c9d708`; `vv34_root-pli-ms.json` có trong 85 tệp `kn/vv`). Không tầng Anh, không bản Việt hiện hành, không lớp lấp `english-project` cho bài này, nên xem `blocking_errors`. Để đối chiếu thuật ngữ và công thức dùng các bản Việt đã dịch trong dự án, đặc biệt đoạn `19`–`23` là lời kể lại đoạn kệ của `sn11.16` (Sakka hỏi Đức Phật trên núi Gijjhakūṭa; Pāli `20`/`22`/`23` khớp `sn11.16:2.1`–`2.3`, `3.1`–`3.4`, `4.1`–`4.3`) và đoạn `26` khớp trọn bốn vế `an4.57:4.1`–`4.4`.

  **Coverage tầng Anh: cổng KHÔNG đo được gì.** Mẫu số là số khoá Pāli có nội dung (`≥ 40` ký tự theo `source/layers.yaml`, bỏ khối `:0`) bằng **0 trên 114** (khoá dài nhất 35 ký tự). Đó là mẫu số bằng 0, không phải *không cần ghi nhận gap*, và cũng không phải lý do cho blocker; blocker là việc ba tầng tham khảo đều vắng.

  **PĀLI TRÙNG NGUYÊN VĂN TRONG CHÍNH BÀI: 13 nhóm (27 khoá).** `1.3`=`16.3`, `3.2`=`17.2`, `3.4`=`17.4`, `7.2`=`11.4`, `7.3`=`11.5`, `7.4`=`11.6`, `8.4`=`10.4` (chỉ khác chữ hoa), `15.2`=`23.4`, `19.3`=`21.3`, `19.4`=`20.4`=`21.4`, `20.1`=`23.1`, `20.2`=`23.2`, `20.3`=`23.3`. Cả 13 nhóm bản Việt cho cùng một câu (so khớp bỏ dấu cuối); 0 nhóm lệch. Chỉ dấu cuối khác theo Pāli ở `3.4` (chấm) và `17.4` (chấm phẩy), `15.2` (chấm phẩy) và `23.4` (chấm).

  **DẤU LƯỢC.** Pāli có `…pe…` ở đúng 1 khoá (`9.2`) và bản Việt giữ đúng một `…`; Pāli có `…` trần 0 khoá và `(…)` trần 0 khoá (lời dặn có thể có `(…)` ở một khoá không áp dụng cho bài này: đã quét 114 khoá), bản Việt cũng 0; cân bằng 114/114, 0 lệch. Pāli không khoá nào kết `….`.

  **SỐ PĀLI, tự tính, in phép.** (a) `0.4` `6.` = **6**, chữ số nguyên trong Pāli, giữ nguyên; khoá chốt `27.1` `chaṭṭhaṁ` = cha 6 ⇒ *thứ sáu* (khớp `0.4`); (b) `8.1` `Aṭṭheva` = aṭṭha 8 + eva ⇒ *chỉ có tám*; (c) `12.4` `attanaṭṭhamaṁ` = attanā + aṭṭhama 8 ⇒ *tính cả ngài là vị thứ tám*, và khớp với tám phần ăn ở `8.1` (tám vị thọ thực); (d) `22.1`–`22.2` `cattāro` = **4** ×2 ⇒ *bốn vị … bốn vị* (đúng bốn đôi tám bậc); (e) `1.3`/`16.3` `tāvatiṁse` = ba mươi ba ⇒ *Ba Mươi Ba* (184/299 khoá có `tāvatiṁs` ở tầng viết đúng *Ba Mươi Ba*). Không có `sahassa`, `sata`, `navuti`, `tālīsa` hay `Tiṁsakappasahassa` trong bài. Mọi số đã đối chiếu với phép tính; 0 chỗ lệch.

  **PHÂN XỬ TIỀN LỆ: 43 khoá có Pāli trùng nguyên dòng với tầng đã dịch** (đã dò trên toàn bộ tầng đã dịch của dn, mn, sn, an, kn; bỏ `9.2` là dấu lược): **27** khoá bản Việt dùng lại nguyên văn (so khớp bỏ dấu cuối), **16** khoá khác có lý do: `1.2`, `1.4` (chỉ 1 tiền lệ, ở `vv15`/`vv5`, khác cú pháp); `4.1`, `4.2` (`vv29:9.1`–`9.2` viết *rồi tịch diệt* cho `tato cutā`, lệch nghĩa vì `cutā` là *mệnh chung*; `tato cutā` ở các khoá khác của tầng (18 khoá) phần lớn viết *từ đó mệnh chung* hoặc *qua đời*); `4.3` (khoá `mn41`/`mn42` ghép với tên cõi, khác cấu trúc); `5.1` (`vv21:10.1` viết *Phúc lành dồn dào* là danh ngữ cho người nói, ở đây là thuộc ngữ của `pāṇino`); `9.3` (xem dưới); `19.3`/`21.3` (`iti26` đặt `quả của sự chia sẻ` làm tân ngữ của *biết*, ở đây là tân ngữ của *hỏi/giảng*, nên thêm *về*); `20.2`/`23.2` (`sn11.16` viết *chúng sanh*; ở `vv`/`pv`/`iti` 76 khoá viết *chúng sinh* và 0 khoá viết *chúng sanh*); `20.3`/`23.3`, `22.3`, `22.4`, `25.4` (xem dưới).

  **THUẬT NGỮ, đều có số đếm.** `Vimānavatthu` (`0.1`): giữ nguyên Pāli **74/76** khoá `vv`. `Itthivimāna` (`0.2`): *Chuyện Cung Điện Nữ Hư Không* **44/46** ⟵ *Thiên Cung Nữ* 1 ⟵ *Thiên Cung Của Nữ Giới* 1; giữ nguyên văn. `Pāricchattakavagga` (`0.3`): *Phẩm Cây San Hô* **8/8** khoá, cả 7 tệp cùng phẩm đã có mặt (`vv29`–`vv32`, `vv35`–`vv38`). `0.4`: số thứ tự được **giữ** trong tệp dịch (`6.`, theo **76/76** khoá `0.4` của các `vv` đã dịch) còn `translationTitle` ở metadata **bỏ** số (**64/78** tệp meta `vv` bỏ, 14 giữ). `27.1`: ở các `vv` đã dịch khoá kết dạng *Cung Điện …, thứ …* **55** ⟵ *Chuyện Cung Điện …* 10; theo đa số (hệ quả như `vv32`/`vv35`: tiêu đề `0.4` có *Chuyện* mà khoá kết thì không; muốn thống nhất phải sửa cả tầng `vv`).
  · `Daddalla` giữ nguyên Pāli. **Không** thêm *Nữ*: các khoá Pāli của bài không nêu tên người nào là Daddalla; từ này lấy từ chữ đầu bài kệ (`daddallamānā` = rực rỡ) và từ bảng tóm tắt `vv38:12.3` (`Daddallapesamallikā`) nên không xác lập được là tên riêng của một nữ nhân. Các tệp cùng phẩm không phải tên nữ (`Uḷāra`, `Pallaṅka`, ...) cũng không có *Nữ*. Người biên tập có thể muốn *Nữ Daddalla* nếu chú giải xác nhận.
  · `Nimmānaratī` → *Hóa Lạc* (**32/42** khoá có `nimmānarat`). `tāvatiṁsa` → *Ba Mươi Ba* (**184/299**). `devinda` → *Thiên Chủ* (**4/4** khoá `vv` có `devinda`). `devatā`/`devate` → *nữ thiên* (**50** khoá) ⟵ *thiên nữ* 22. `bhadde` → *hiền nữ* (`pv10` 2/2). `dakkhiṇeyya` → *đáng được cúng dường* (`vv10:6.5`, 1/1 trong `vv`/`pv`). `saṅgha` → *Tăng* (**11/16** khoá `vv`/`pv`) ⟵ *Tăng đoàn* 5 ⟵ *Tăng chúng* 1; ở `sn11`/`an8`/`an4` *Tăng* 86 ⟵ *Tăng chúng* 19 ⟵ *Tăng đoàn* 14; cả hai phạm vi cho *Tăng* là đa số. `22.3` theo `sn11.16:3.3` (*bậc chánh trực*) nhưng đổi *Tăng chúng* thành *Tăng* cho khớp đa số. `manobhāvanīya` → *đáng kính* (**54/56**). `brahmacārī` → *phạm hạnh* (**514/567**). `appamatta` → *không phóng dật* (**34/50**). `macchariya` → *keo kiệt*: ở 7 khoá `vv`/`pv` có `maccher*` thì *keo kiệt* (kể cả *keo kiết*) 4, *hà tiện* 3, *xan tham* 1 (chung một khoá với *keo kiệt*); ở 8 khoá `vadaññū vītamaccharā` thì *keo kiệt* 5, *xan tham* 3 ⇒ `15.4` và `26.3` cùng dùng *keo kiệt* cho thống nhất trong bài. `Gijjhakūṭa` → *Gijjhakūṭa* **86/95** khoá ⟵ *Linh Thứu* 9; vì `19.2` có đúng một tiền lệ cùng dòng Pāli ở `thig3.4:1.2` (*trên đỉnh núi Linh Thứu Gijjhakūṭa*), dùng dạng có cả hai. `vadaññū vītamaccharā` (`15.4`) → *hào phóng, hết keo kiệt* (**3/8** khoá cùng dòng Pāli: `an8.49`, `an4.54`, `an4.53`; 5 khoá còn lại 5 dạng khác nhau). `opadhikaṁ puññaṁ` (`20.3`, `23.3`) → *phước hữu sanh y* (**5** khoá `iti27` ×4, `iti83:17.1`) ⟵ *phước nghiệp phàm thế* (`sn11.16` ×2) ⟵ *thêm vượt bội* (`an8.59`/`an8.60`); chọn *hữu sanh y* vì là thuật ngữ gốc `upadhi` và `iti83:17.1` có đúng cụm `opadhikaṁ puññaṁ`. `lokavidū` (`25.4`) → *những bậc biết rõ thế gian* (theo `an4.57:3.6`).
  · `9.3` `vaṇṇo ca me sabbadisā pabhāsatī`: ở tầng có 12 dạng cho cùng dòng Pāli, nhiều nhất *và sắc tướng tôi chiếu sáng khắp mọi phương* **18/50** khoá. Tôi chọn *dung sắc* để khớp `9.1` (*Nhờ vậy tôi có được dung sắc như thế này*, **34/51** khoá) và `1.1`: trong cùng một bài `vaṇṇa` cùng nghĩa nên không dịch hai cách.
  · `7.3`/`11.5` `Devate pucchitācikkha`: ở tầng **7/12** khoá viết *Này nữ thiên, hãy nói lời hỏi*, kể cả 3/3 khoá ở `vv36`–`vv38` cùng phẩm. Tôi **không** theo vì `pucchitā` là phân từ bị động (*được hỏi*) và *hãy nói lời hỏi* đổi nghĩa thành tự mình hỏi; dùng dạng đã có ở `vv24:13.3` (*Này nữ thiên, được hỏi, hãy cho biết*) và `pv10:9.3` (*được hỏi xin hãy nói*). Đo lại: *được hỏi* **3/12**. Việc này **tạo ra một lệch** với `vv36`–`vv38`; người biên tập cần quyết có thống nhất cả tầng theo cách *được hỏi* hay không.
  · `7.4`/`11.6` `kissa kammassidaṁ phalan` → *quả báo ấy là do nghiệp nào* (**6/11** khoá). `8.4`/`10.4` `pasannā sehi pāṇibhi` → *với tâm tịnh tín bằng chính đôi tay mình* (**7/17** khoá, dạng nhiều nhất). `19.4`/`20.4`/`21.4` `yattha dinnaṁ mahapphalaṁ`: 6 khoá, 5 dạng khác nhau (không dạng nào quá 2); chọn *nơi vật bố thí có quả lớn* (`iti26:4.4`, cùng chủ đề *quả của sự chia sẻ*) vì *vật cho ấy* (`vv56`/`vv57`) có đại từ *ấy* không có tiền ngữ. `21.1` → *Đức Phật đã giảng giải điều ấy cho tôi* (**2/5** khoá, hoà với *Vị ấy đã giảng giải cho tôi*; chọn dạng có chủ ngữ rõ). `22.1`–`22.4`: ba khoá cùng dòng (`sn11.16`, `an8.59`, `an8.60`) với 4 dạng; theo `sn11.16` cho `22.1`–`22.2` và `22.3` (*bậc chánh trực*), nhưng **không** theo `sn11.16:3.4` *hội đủ trí tuệ, giới hạnh và định* vì thêm *định* không có chữ Pāli riêng (`samāhito` đứng sau `paññāsīla`); `22.4` dùng *vững vàng trong trí tuệ và giới hạnh*. `26.1`–`26.4` dùng nguyên văn bốn vế của `an4.57:4.1`–`4.4`.

  **LỖI BẢN NHÁP ĐÃ BẮT.** (i) Bản nháp đầu viết `19.2` *trên đỉnh núi Linh Thứu* (theo `thig5.9:2.2`) rồi đo `Gijjhakūṭa` toàn tầng **86 so với 9** nên đổi sang dạng có cả hai của `thig3.4:1.2`. (ii) Bản nháp đầu viết `0.4` *Cung Điện Nữ Daddalla* (theo mẫu `vv32`/`vv35`/`vv36`) rồi thấy Pāli không có ai tên Daddalla nên bỏ *Nữ*. (iii) `7.2` và `11.4` lúc đầu khác nhau (*đã đạt được …* và *lại đạt được …*) trong khi Pāli trùng nguyên văn; đã thống nhất. (iv) Phép đo Pāli trùng ban đầu chỉ dò trong `kn` nên bỏ sót `sn11.16`, `an8.59`, `an8.60`, `an4.57`, `iti26`; dò lại trên cả `dn`, `mn`, `sn`, `an`, `kn`.

  **BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ (đều ghi ở đây, KHÔNG thêm vào thân kinh).**
  · **Ai nói ở `1`–`2`.** Pāli không nêu người nói. Suy từ văn bản: `3.1` (`subhaddāsiṁ`) và `3.3` (`te āsiṁ`) cho thấy người nói ở `3`–`4` là Subhaddā; `5`–`7`, `10`–`11` do người đã sinh ở nhóm thấp hơn hỏi (`11.2` `hīnakāyūpagā`); `16` và `18`–`26` là Sakka (suy từ `17.1` `devinda`). Tôi không gán lời cho `1` và `2`, chỉ dịch ngôi hai (*nàng*) và ngôi nhất (*tôi*) theo văn bản: `1` khen người được nói tới là vượt trội chư thiên cõi Ba Mươi Ba (`1.3`–`1.4`, cùng cụm với `16.3`–`16.4`), còn `2` là người không nhận ra người gọi tên mình. Người biên tập nên đối chiếu chú giải để chốt ai nói ở `1` và `2`.
  · `2.3` `Kasmā kāyā nu āgamma`: `kāya` ở `2.3` và `11.2` (`hīnakāyūpaga`) tôi hiểu là *nhóm, chúng* (nhóm chư thiên), còn ở `4.1` (`kāyassa bhedā`) là *thân*. Có thể đọc `2.3` là *từ thân nào (kiếp nào)*; người biên tập nên tra chú giải.
  · `6.1` `kena vaṇṇena`: tôi hiểu `vaṇṇa` là *cách thức, nguyên do* (theo `ja444:8.5` *bằng cách nào*; `ja259:1.3` *làm sao*), không phải *dung sắc*. Có thể đọc *nhờ dung sắc nào*; người biên tập nên xác nhận. `6.4` `subbatena` → *hạnh lành* (tầng 4 khoá `subbata` viết *hạnh lành*).
  · `5.3` `kittayissasi` ở thì tương lai trong Pāli; tôi dịch *sẽ tuyên bố* và `5.4` `jātimattano` = *jātiṁ attano* ⇒ *nơi sinh của chính nàng*.
  · `12.4` `attanaṭṭhamaṁ`: tôi hiểu *Revata cùng bảy vị nữa, tính cả ngài là tám*, khớp `8.1` tám phần ăn. Không thêm *bảy vị khác* vào thân kinh.
  · `13.1` `atthapurekkhāro` (0 khoá khác ở tầng): *trước hết nghĩ đến lợi ích của tôi* là cách đọc của tôi, bám `attha` (lợi ích) + `purekkhāra` (đặt lên trước).
  · `14.2` `appameyye` (và `18.3` `saṅghamhi appameyye`): *bậc vô lượng* ở `14.2` tôi hiểu là Tăng, theo `18.3`; trong Pāli `14.2` không nêu chữ Tăng.
  · `18.1` `Dhammena`: *đúng lẽ thay* (trạng từ); cũng có thể hiểu *nhờ Pháp/chính đáng*. `Dhammena pubbe bhaginī` ngắt câu ở `18.1` còn chủ ngữ của `18.2` (`virocati`) là cô em gái, so sánh `tayā`.
  · `21.2` `jānaṁ kammaphalaṁ sakaṁ`: `sakaṁ` (của riêng) có thể chỉ quả nghiệp của chính mỗi chúng sinh hoặc của chính vị biết; tôi giữ nguyên ý mơ hồ *của chính mình*.
  · `26.2` `vedajātā`: dùng nguyên văn `an4.57:4.2` (*đầy lòng cảm xúc*) cho cùng khối; nghĩa sát hơn là *hân hoan, xúc động tích cực*. Tầng có 5 khoá `vedajāta` với 5 cách dịch khác nhau (*phấn chấn*, *xúc động*, *hân hoan sinh khởi*, *kính trọng*, *cảm xúc*); người biên tập nên thống nhất.
  · `15.3` `manussattaṁ` → *kiếp người*; `15.4` `vadaññū` → *hào phóng*; các từ này không đổi giáo nghĩa.

  **XƯNG HÔ.** Ngôi nhất dịch *tôi*, ngôi hai dịch *nàng* (hoặc *hiền nữ* khi Pāli có `bhadde`); `17.1` `devinda` dịch *Thiên Chủ* (theo 4/4 khoá `vv`). Không gán lời nói cho từng người ngoài những gì chính văn bản cho thấy, xem bất định đầu tiên.

  **CỔNG KỸ THUẬT, CHƯA CHẠY.** Agent dịch không được chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` (và cũng không chạy `npm run audit:*`, `npm run reference:gaps`, `npm run verify:store:*`). Nên **không** tuyên bố technical gate pass; `technical_integrity` đặt 9.6 theo quy định, và người biên tập cần chạy đủ bốn lệnh trên.
