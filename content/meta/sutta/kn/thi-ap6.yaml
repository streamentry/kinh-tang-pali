notes: |-
  Dịch từ Pāli root commit 11c9d708.
  Upstream bilara không có bản dịch tiếng Anh của Sujato tại commit đã pin (thuộc 1.596 bài KN không có English).
  58/58 khoá khớp Pāli root tuyệt đối.
  Dấu nháy đơn lồng trong suy nghĩ và đối thoại (2.3–3.4, 4.3–4.4) khớp 1:1 với Pāli root.
  3 dấu lược …pe… tại 12.2, 13.2, 14.2 chuyển thành … trần.
  Sửa lan 2026-10-13: khoá `thi-ap6:0.3` — `Ekapiṇḍapātadāyikātherīapadāna` để nguyên chữ Pāli → *Ký Sự Về Trưởng Lão Ni Ekapiṇḍapātadāyikā* (khuôn tiêu đề của kho: 35 trong 39 tiêu đề `thi-ap` còn lại có dạng *Ký Sự Về Trưởng Lão Ni X*; dòng kết `thi-ap6:16.1` của chính bài đã dịch *Ký sự về trưởng lão ni Ekapiṇḍapātadāyikā*). Tên hiệu `Ekapiṇḍapātadāyikā` giữ chữ Pāli như `thi-ap15`, `thi-ap10`, `thi-ap14`. `translationTitle` trong meta đổi theo thành *Ký Sự Về Trưởng Lão Ni Ekapiṇḍapātadāyikā*. Khoá này không giữ dấu cách thừa cuối giá trị như các khoá khác của tệp (58/58 khoá của bài mang một dấu cách cuối, không sửa trong lượt này). Điểm không đổi; giữ nguyên các khoá còn lại.
