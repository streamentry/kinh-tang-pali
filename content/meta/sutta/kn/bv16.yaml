notes: |-
  Đợt 19, làn 75. Dịch từ Pāli root commit đã ghim, đủ 106/106 khoá (105 khoá mới; khoá kết `27.1` đã có sẵn từ lần trước, kiểm lại rồi chỉ đổi “Atthadassi” → “Atthadassī” cho khớp chữ Pāli và `bv17:26.1`; `cuddasamo` = 14 khớp thứ tự phẩm bv3 = thứ nhất), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ mười bốn của Buddhavaṃsa, về Đức Phật Atthadassī: ba lần chứng ngộ và ba kỳ hội chúng, tiền thân đạo sĩ Susīma cúng hoa và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tia sáng, tuổi thọ, nhập Niết-bàn và xá lợi. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn `bv28:0.1`, `bv29:0.1` và các bv đã dịch (6/6 tiền lệ).
  - `0.2` “16. Dòng Kế Thừa Của Đức Phật Atthadassī”: cùng khuôn với `bv17:0.2`, `bv18:0.2`, `bv20:0.2`; `vaṁso` ở `27.1` cũng là “Dòng kế thừa”.

  **Số Pāli, đã tự tính.** `tayo` 3 (3.2 ba lần chứng ngộ khớp ba khoá `3.4`, `4.4`, `5.4` = thứ nhất, thứ hai, thứ ba; 6.1 ba kỳ hội chúng khớp ba số ở `7.1`, `7.3`, `8.1`; 15.4 ba lâu đài khớp ba tên ở 15.3). `koṭisatasahassa` = 100 × 1.000 koṭi = **một trăm ngàn koṭi** (3.3, 4.3, 5.3; cùng cách tính `bv17:2.3`, `bv18:3.3`). `aṭṭhanavutisahassa` = 8 + 90 = 98, nhân 1.000 = **98.000** (7.1). `aṭṭhāsītisahassa` = 8 + 80 = 88, nhân 1.000 = **88.000** (7.3). `aṭṭhasattatisatasahassa` = 8 + 70 = 78, nhân 100.000 = **7.800.000** (8.1, “bảy triệu tám trăm ngàn”; dùng “triệu” như `bv20:4.1`, `bv20:6.1` cho các số `satasahassa`). Thang lớn nhân cả số đã tích lũy, không nhân riêng chữ số đứng trước. `aṭṭhārase kappasate` = 18 trăm = **1.800 kiếp** (11.3; cùng giá trị với `bv17:10.3`, 31 khoá trùng Pāli). `dasapāramī` 10 (13.4). `dasavassasahassa` 10 × 1.000 = **10.000 năm** (15.1). `tettiṁsa` 33, nhân 1.000 = **33.000** (16.1). `caturo` 4 (17.1). `anūnaaṭṭhamāsa` = không thiếu + 8 = **đủ tám tháng** (17.3). `asīti` **80** hattha (22.2). `vassasatasahassa` 100 × 1.000 = **100.000 năm** (24.3). `dasasahassī` **10.000** (2.4; ngầm chỉ thế giới, như `bv18:21.4`). `cuddasamo` **14** (27.1). Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã publish và draft (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 58 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 1.053 cặp, trong đó 73 cặp có Việt khác bản tôi viết; 56 trên 58 khoá dùng đúng nguyên văn một tiền lệ. Hai khoá không trùng nguyên văn với tiền lệ nào: `2.2` (tiền lệ duy nhất `sn22.78:3.2` chỉ là cụm “chuyển bánh xe Pháp”, tôi thêm “Ngài đã” để có chủ ngữ) và `26.1` (tiền lệ duy nhất `tha-ap114:1.1` “Bậc Đấng Điều Ngự Atthadassī,” là cách dịch `jinavara` khác hẳn 3 tiền lệ khác `bv20:25.1`, `bv29:1.1`, `snp3.11:20.1` là “bậc Chiến Thắng (tối thượng)”; chọn dạng đa số).
  - Dùng lại đúng nguyên văn một tiền lệ: 56 khoá — `0.1`, `1.1`, `1.2`, `1.4`, `2.1`, `3.2`–`3.4`, `4.3`, `4.4`, `5.1`, `5.3`, `5.4`, `6.1`, `6.3`, `6.4`, `7.2`, `7.4`, `8.2`, `8.3`, `9.1`, `9.2`, `11.1`–`11.4`, `12.1`–`12.3`, `13.1`–`13.4`, `14.1`, `15.1`, `15.2`, `15.4`, `16.2`, `17.1`, `17.4`, `18.1`–`18.3`, `19.2`, `20.2`, `20.3`, `21.2`, `21.4`, `22.1`, `22.2`, `22.4`, `24.3`, `24.4`, `26.2`–`26.4`. Với `11.3` xem mục riêng bên dưới (trùng Pāli với 20 khoá nhưng chỉ 1 khoá cùng dạng Việt). Không có tiền lệ Pāli trùng ở `27.1`; `6.2` và `10.4` theo khuôn của `bv20:5.2` (“cũng nơi …, bậc Đại Ẩn Sĩ;”) và `bv18:9.3` (“Đức Chánh Đẳng Giác”), còn `tha-ap493:2.3` dịch `sambuddha` là “bậc Toàn Giác”.
  - `1.4`: tiền lệ đa số là “ta đã đạt giác ngộ tối thượng.” (5 trên 8 khoá, ngôi thứ nhất); ở đây chủ ngữ là Đức Atthadassī nên bỏ “ta”, dùng dạng không chủ ngữ của `bv27:1.4` (2/8).
  - `2.1`/`18.1` (`Brahmunā yācito santo`, 24 khoá trùng): “Được Phạm thiên thỉnh cầu,” (4 tiền lệ, 4/4 giống).
  - `1.2`/`18.2` (`atthadassī mahāyaso`): “Đức Atthadassī danh tiếng lớn;” (2 trên 3 tiền lệ); khác `bv17:1.2` “Dhammadassī, bậc có danh tiếng lớn;” (Pāli khác: `dhammadassī mahāyaso` — cùng cấu trúc nhưng tiền lệ trùng nguyên văn của bài này có dạng khác), nên không đổi theo bài anh em.
  - `9.2` `jaṭilo uggatāpano` → “là đạo sĩ bện tóc, tu tập khổ hạnh mãnh liệt;” dùng đúng `tha-ap341:2.2` (3 tiền lệ chỉ khác dấu phẩy và “khi ta”).
  - `11.3` **cố ý khác** 19 trên 20 tiền lệ. Tiền lệ đa số là người kể nhìn ngược về quá khứ (“Vào một ngàn tám trăm kiếp trước,” 12 khoá; “Từ một ngàn tám trăm kiếp trước,” 3; “Vào một ngàn tám trăm đại kiếp trước,” 2). Ở `11.3`–`11.4` là lời thọ ký tương lai (`bhavissati`), nên hướng đếm ngược lại: dùng đúng `bv17:10.3` “‘Sau một ngàn tám trăm kiếp nữa,” (1/20). Pāli ở `11.3` không có chữ chỉ hướng, hướng lấy từ động từ ở `11.4`.
  - `12.2` `…pe…` → đúng một `…` (847 trên 874 cặp dạng này; phần còn lại là `… ` có khoảng trắng hoặc kèm nháy).
  - `7.2`, `8.2`, `13.2`, `20.3`, `9.1`: các khoá có tiền lệ khác bản tôi chỉ ở dấu câu cuối (`;` / `.` / `,`) hoặc chữ “Ta”/“ta”; tôi theo dấu của Pāli từng khoá, không khác nghĩa.
  - `17.4` `padhānaṁ padahī jino`: “bậc Chiến Thắng đã nỗ lực tinh tấn.” (cùng chữ với `bv18:16.4`). Tiền lệ `tha-ap200:1.4` viết “nỗ lực chung thức cuối cùng” — “chung thức” không có trong Pāli và có vẻ là lỗi; **lỗi ngoài lát, báo chứ không sửa.**
  - Trùng trong chính bài (Pāli sau khi bỏ dấu câu và chữ hoa): 4 nhóm Pāli trùng — `1.2`/`18.2`, `2.1`/`18.1`, `3.3`/`4.3`/`5.3`, `14.4`/`19.4`. Bản Việt trong từng nhóm giống hệt nhau ⇒ 0 cặp lệch. `14.4`/`19.4` cùng chỉ “của” ở cả hai chỗ (mẹ của, thị giả của), nên dùng chung “của bậc Đạo Sư Atthadassī.” (`bv17:13.4`, `bv17:18.4` cùng khuôn).

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá, đếm số khoá).
  - `lokanātha` → “bậc Lãnh Đạo thế gian” (10 trên 28 khoá chứa `lokanāth-`; “Bảo Hộ Thế Gian” 9, “hộ trì” 3). `mahesi` → “Đại Ẩn Sĩ” (89 trên 141 khoá; “Đại Tiên” 8, “Đại Hiền” 6). `narāsabha` → “Nhân Ngưu” (71 trên 109 khoá; “tối thượng/Tối Thắng” 18, “chúa tể” 3). `jinavara` → “bậc Chiến Thắng tối thượng” (`bv20:25.1`, `bv29:1.1`). `muni` → “Mâu-ni”, `mahāmuni` → “bậc Đại Mâu-ni” (cùng `bv28`). `mahāvīra` → “Đại Anh Hùng”. `cakkhumā` → “bậc có mắt”. `sambuddha` → “Đức Chánh Đẳng Giác” theo `bv18:9.3`.
  - `khīṇāsava` → “đã đoạn tận lậu hoặc”; `vimala` → “không cấu uế”; `santacitta` → “tâm an tịnh”; `tādī` → “bất động như vậy”: cùng khuôn với `bv17:5.3`–`5.4`, `bv18:6.3`–`6.4`, `bv20:5.3`–`5.4` (3/3 giống).
  - `abhisamaya` → “chứng ngộ”, `sannipāta` → “kỳ hội chúng”, `samāgama` → “cuộc tụ hội”: cùng `bv18`, `bv17`, `bv20`. Điểm yếu nhất về thuật ngữ vẫn là `abhisamaya`: trên 129 khoá chứa `abhisamay-` đã dịch, “thông đạt” 22, “chứng ngộ” 17, “giác ngộ” 10 (“thông đạt” là dạng của `sn56`, nơi `abhisamaya` gắn với bốn Thánh đế; ở đây `abhisamaya` đếm theo số người của từng kỳ hội, nên chọn “chứng ngộ” như `bv17`, `bv18`, `bv20`).
  - `jaṭila` + `uggatāpana` → “đạo sĩ bện tóc, tu tập khổ hạnh mãnh liệt” (`cp17:1.2`, `tha-ap341:2.2`, `tha-ap429:2.2`). `seṭṭhasammata` → “được xem là bậc tối thượng” (`ja268:1.2`, `ja334:2.2`, `ja334:4.2`).
  - `mandārava` → giữ nguyên “mandārava” (dn16, 6 khoá; “mạn-đà-la” 2 khoá ở tha-ap, 20 khoá có tên phẩm “Mandārava”); `pārichattaka` → “pāricchattaka” theo `tha-ap294:2.3` (dạng chính tả chuẩn; Pāli ở đây viết `pārichattaka`). `paduma` (hoa) → “hoa sen”. `dibba` → “của cõi trời” (gắn với `mandārava`).
  - `devacārikā` → “du hành ở cõi trời” (3 tên kinh `sn55.18`–`sn55.20`: “Đi Đến Cõi Trời”, “Thăm Viếng Chư Thiên”; 32 trên 39 khoá chứa `devacār-`/`devaloka` dùng “cõi trời”).
  - `sāvaka` → “đệ tử” (1.690 trên 1.941 khoá); `aggasāvaka` “đệ tử thượng thủ” (`bv18:18.2`). `upaṭṭhāka` → “thị giả”. `yojana` → “do-tuần” (65 trên 359 khoá; “do tuần” 6, “yojana” 7). `hattha` (đơn vị đo) giữ nguyên, như `bv17:21.2`. `koṭi` giữ nguyên chữ Pāli (như `bv18`).
  - `pāramī` → “ba-la-mật”. `khattiya` → “Sát-đế-lợi” (`tha-ap14:11.2`, `bv18:13.2`). `janikā` → “người mẹ sinh ra” (`bv17:13.3`, `bv18:13.3`, `bv20:14.3`). `atrajo` → “người con ruột” (`bv17:15.4`, `bv18:15.4`, `bv20:16.4`). `nimitta` → “dấu hiệu”. `pāsāda` → “lâu đài” (`bv17:14.4`, `bv18:14.4`). `samalaṅkata` → “được trang sức đẹp đẽ” (7 khoá). `nāma nāmena` → “tên là” (`ja385:4.3`, `tha-ap10:10.3`; “Người tên là” ở `tha-ap9:13.3`). `nagara` → “thành phố” (`tha-ap475:9.1` có đúng “Thành phố tên là Sobhana,”). `Bodhi` → “Cây Bồ-đề”.
  - Tên riêng: `Atthadassī` giữ dấu theo Pāli (khớp `bv17:1.2`, `bv18` ghi “Dhammadassī” giữ dấu); `Susīma` (25 khoá), `Visākhā` (69), `Sela` (70), `Abhaya` (33), `Nisabha` (4, `thag2.38`, `thag2.40:3.5`), `Campaka` (8), `Sobhana` (1, `tha-ap475:9.1`): đã có tiền lệ, giữ dạng ở đó. `Sāgara`, `Sudassanā`, `Amaragiri`, `Sugiri`, `Vāhana`, `Santa`, `Upasanta`, `Dhammā`, `Sudhammā`, `Nakula`, `Makilā`, `Sunandā`, `Anomārāma`, `Anomuyyāna`, `Maṇḍa`: chưa có tiền lệ cho đúng nhân vật này trong tầng, giữ dạng Pāli. `Anomārāma` dùng nguyên văn `bv18:24.2`.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `2.3`–`2.4` `amatena tappayī lokaṁ dasasahassisadevakaṁ`: `dasasahassī` đọc là “mười ngàn (thế giới)”, bổ nghĩa cho `lokaṁ`; `sadevaka` là tính từ “cùng chư thiên”. Tôi tách “mười ngàn thế giới cùng chư thiên” sang khoá sau như Pāli. Cách đọc khác: “thế gian mười ngàn cõi cùng chư thiên”. `amata` dịch “bất tử” (cùng `bv20:2.4` “nước bất tử”).
  2. `4.2` `carate devacārikaṁ`: `devacārikā` có hai cách hiểu: chuyến đi lên cõi trời (hợp tên kinh `sn55.18`) hoặc chuyến du hành giữa chư thiên. Tôi dịch “đang đi du hành ở cõi trời” để giữ cả hai khả năng; Pāli không nói Đức Phật đi lên hay xuống.
  3. `5.2` `desesi pitusantike`: Pāli chỉ nói “đã thuyết giảng ở bên cha”, không có `dhammaṁ`; không thêm “Pháp”. “Cha” là cha của Đức Phật theo mạch kể, nhưng Pāli chỉ có `pitu`. Cũng không thêm “của Ngài”.
  4. `7.1`, `7.3`, `8.1`: ba con số không có chữ “vị” hay “người”, nên không thêm danh từ. Số ở `8.1` là 7.800.000, lớn hơn hẳn hai số trước (98.000, 88.000); đây là con số của Pāli ghim (`aṭṭhasattatisatasahassa`), không phải lỗi dịch. Nếu bản Pāli khác ghi `aṭṭhasattatisahassa` thì sẽ là 78.000, nhưng tôi không có chứng cứ độc lập nên giữ đúng chữ Pāli đã ghim.
  5. `9.4` `mahiyā seṭṭhasammato`: `mahiyā` có thể là định vị “trên mặt đất” hoặc công cụ “bởi mặt đất/loài người”; tôi dịch “trên mặt đất”.
  6. `17.2` `assayānena`: tiền lệ chia đôi. `bv27:16.2` dịch cùng chữ là “bằng ngựa”; các khoá `hatthiyānaṁ assayānaṁ` ở tha-ap dịch “xe ngựa” (5 khoá); `bv20:17.2` dịch `hatthiyāna` “bằng xe voi”. Tôi chọn “bằng xe ngựa” vì `yāna` nghĩa là cỗ xe và để cùng khuôn với `bv20`.
  7. `18.4` `anomuyyāne`: đọc là `anoma-uyyāna` (sandhi), giữ nguyên chữ Pāli “Anomuyyāna” như một tên riêng, cùng cách với “Anomārāma” ở `26.2` (`ārāma`/`uyyāna` đều là “vườn”; không tách để khỏi thêm nghĩa). Cách đọc khác: “ở vườn Anoma”.
  8. `22.3` `sālarājāva`: “cây sāla chúa” theo `dn14:3.29.1`; 17 khoá chứa `sālarāja`, các dạng khác “chúa cây sala”, “cây sa-la chúa”.
  9. `23.1`–`23.4`: `pākatikā raṁsī` dịch “những tia sáng tự nhiên” (`pākatika` = bình thường/tự nhiên); `anekasatakoṭiyo` dịch sát “nhiều trăm koṭi” (không quy đổi); `pharanti yojanaṁ` dịch “lan tỏa một do-tuần” (đối cách chỉ khoảng). `Uddhaṁ adho dasa disā` dịch “Trên, dưới, mười phương” theo `snp5.17:3.2`, `kp9:8.3`. Cách đọc khác của `23.3`: “ở phía trên, phía dưới và mười phương” (nối với `23.4`).
  10. `25.3`–`25.4` `aniccataṁ patto yathaggupādānasaṅkhayā`: `aniccataṁ patto` dịch “đã đi đến vô thường” (cách nói về sự qua đời; tầng Việt chưa có tiền lệ cho cụm này, 0 khoá khác), `aggi-upādāna-saṅkhayā` hiểu là “khi nhiên liệu của ngọn lửa đã cạn” (`upādāna` ở đây là nhiên liệu, không phải chấp thủ như ở `8.3`; “nhiên liệu” có 25 khoá tiền lệ, ví dụ `mn99:17.2`). Cách đọc khác: “như lửa tắt vì hết nhiên liệu”.
  11. `26.1` `jinavaro` “bậc Chiến Thắng tối thượng”; `26.3` `dhātuvitthārikaṁ` “việc xá lợi được rải rộng khắp” (dùng đúng nguyên văn `bv20:25.3`, `bv29:1.3`).
  12. `20.4` `campakoti`: `ti` là chữ dẫn tên (`campako` + `iti`); nháy đóng nằm ở `26.4` (`padesato”ti`), nên cả bài là một lời kể, nháy đơn của lời thọ ký (`11.3`–`12.3`) nằm trong đó.
  13. `12.2` `…pe…`, `12.3` `hessāma sammukhā imaṁ’`: đoạn lược che mất phần giữa, nên không xác định được “chúng ta” là ai; giữ nguyên nháy theo Pāli từng khoá và dịch sát chữ, không thêm người nói (cùng cách xử lý ở `bv17`, `bv18`, `bv20`).
  14. `19.1`, `20.1`, `21.1`: `santo ca upasanto ca`, `dhammā ceva sudhammā ca`, `nakulo ca nisabho ca` đọc là tên người, theo vị trí trong danh sách đệ tử/thị giả như `bv17:18.1`, `bv18:18.1`; cách đọc `santo`/`upasanto` là tính từ (“hiền tịnh, an tịnh”) không hợp vì có `ahesuṁ aggasāvakā` đi sau.

