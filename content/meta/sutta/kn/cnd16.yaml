notes: |-
  **Phạm vi: đủ 212/212 khoá của cnd16, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Bhadrāvudha (Pārāyana, câu hỏi thứ mười hai), tức bài kệ `snp5.13`. Cấu trúc như `cnd6`, `cnd12`, `cnd13`, `cnd14`, `cnd15`, `cnd20`: dẫn từng đoạn kệ, giải từng cụm, rồi nhắc lại cả đoạn kệ (kệ in đậm ở `1`, `8`, `16`, `22`; nhắc lại trong ngoặc kép ở `7`, `15`, `21`, `27`; khối `11` là kệ về chữ *vīra*, trùng `cnd15:3`). Pāli có 90 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 49 khoá chứa dấu lược `…`: 23 khoá có `…pe…` (đều thành đúng một `…`), 27 khoá có `…` trần (giữ nguyên số dấu từng khoá; riêng `4.8` có cả hai), 0 khoá có `(…)`, 0 khoá kết `….`. Không có đoạn kệ nào của Pāli trong bài mà Việt dịch khác hai lần trong cùng bài: các lần nhắc lại kệ ở `7`, `15`, `21`, `27` mang cùng bản Việt với kệ ở `1`, `8`, `16`, `22`, chỉ khác dấu nháy đầu và cuối theo Pāli từng khoá.

  **Cách trình bày lemma** theo `cnd6`/`cnd12`/`cnd13`/`cnd14`/`cnd15`/`cnd20`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Giữ nguyên chữ Pāli ở bốn chỗ vì lời giải nói về chính hình thức của từ ấy hoặc đó là tên riêng: `Iccā` (`3.13`, theo `cnd14:7.8`, `cnd15:5.2`), `Iti` (`25.12`, theo `cnd14:24.4`), `nāga` (`6.2`, `6.3`: lời giải chơi chữ `nāga` với `na āgu`, `na gacchati`, `na āgacchati`, nếu đổi *Long tượng* thì mất phép giải từ) và `jāgu`, `indagu` (`20.2`, xem bất định). Tên xứ ở `9.3` giữ nguyên Pāli (Aṅga, Magadha, Kaliṅga, Kāsi, Kosala, Vajji, Malla, Cetiya, Vaṁsa, Kuru, Pañcāla, Maccha, Surasena, Assaka, Avanti, Yona, Kamboja). Các khoá không có `metaṁ` (`3.15` giữ *đây là* theo `cnd6:3.6`, `cnd12:2.7`, `cnd13:2.7`, `cnd14:7.10`, `cnd20:3.4` dù Pāli không có `metaṁ`; `6.2`, `26.2` không thêm *đây là*); `17.19` (có `metaṁ`) viết *đây là lời xưng hô tôn kính …* đúng như `cnd15:18.11`.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `cnd16`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud, và tệp `cnd16_translation-en-sujato.json` không tồn tại. Lớp `english-project` không có `cnd16`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **60** khoá (72 nếu tính cả thẻ); Sujato phủ 0/60 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/60, `vietnamese-current` 0/60. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp5.13` (bài kệ trùng Pāli) đã được đọc để kiểm cách parse các dòng kệ (Sujato dịch `Okañjahaṁ` là *bastion-leaver*, `kappañjahaṁ` là *formulation-leaver*, `sumedhaṁ` là *intelligent*, `nāgassa` là *spiritual giant*), nhưng đó là bản của **bài khác** nên không tính là đối chiếu English của cnd16; chứng cứ độc lập còn lại là các bản đã dịch của `snp5.13`, `snp3.6`, `sn22.3`, `sn22.4`, `mn112`, `mn72` và công thức chú giải ở `cnd6`, `cnd12`, `cnd13`, `cnd14`, `cnd15`, `cnd20`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm) trùng với khoá đã dịch ngoài bài này: so khớp nguyên dấu câu 50 khoá, dùng lại 46, khác 4; so khớp sau khi bỏ dấu câu và chữ hoa/thường 75 khoá, dùng lại 68, khác 7. Nguồn dùng lại: `snp5.13` (các dòng kệ, 23 khoá), `cnd15` (15 khoá: `0.2`, `0.3`, `6.6`, `11.1`–`11.4`, `14.3`, `3.6`, `4.2`, `17.19`, `20.4`, `26.6`, `28.1`, `28.2`), `cnd6` (`24.3`, `24.5`), `cnd12` (`24.4`), `cnd20` (`3.2`), `mn138` (`17.4`), `snp5.5` (`8.4`), `snp5.6` (`16.3`, `21.3`). Các khoá Pāli trùng mà bản Việt khác, kèm lý do:
  - `2.5`, `2.6` (trùng `sn22.45:1.16`, `1.17` *đối với giới tánh tưởng …*, *giới tánh hành …*): dùng *giới tưởng*, *giới hành* theo `sn22.3:5.5`, `sn22.4:4.2` (cùng bộ năm `dhātuyā` và cùng công thức `yo chando yo rāgo …`); đo bộ `vedanādhātu/saññādhātu/saṅkhāradhātu/viññāṇadhātu` trong tầng: 55 khoá, *giới* 41, *giới tánh* 10, khác 4.
  - `23.7`, `25.2` (trùng `mn131:8.4` *xem thọ …*): bỏ chữ *xem* vì Pāli ở đây không có động từ; chỉ còn *thọ …*.
  - `3.11` (trùng `snp5.13:1.1` *Con cầu xin bậc từ bỏ hang ổ …*): `3.11` là dòng nhắc lại lemma nên không có động từ *con cầu xin*; `1.1`, `7.1` dùng nguyên văn `snp5.13:1.1` (xem bất định 1).
  - `3.16`, `17.20` (trùng `snp5.13:1.2` *(Tôn giả Bhadrāvudha nói,)* và `snp5.13:3.2` *(Đức Thế Tôn trả lời:)*): `3.16` viết *Tôn giả Bhadrāvudha nói* đúng như `cnd15:5.6`; `17.20` viết *Này Bhadrāvudha, Đức Thế Tôn nói* vì lời giải `17.18` giảng đó là tên mà Đức Thế Tôn gọi vị Bà-la-môn (theo `cnd15:18.12`, `cnd20:11.2`, `cnd14:16.9`).
  - `16.2`, `21.2` (cùng trùng `snp5.13:3.2` *(Đức Thế Tôn trả lời:)*): bản ấy bỏ hô ngữ; viết *(Này Bhadrāvudha, Đức Thế Tôn nói,)* theo `cnd15:17.2`, `cnd15:22.2`.
  - `22.4` so với `26.5`: Pāli giống, Việt `22.4` có *thì* (dùng lại nguyên `snp5.13:4.4`) còn `26.5` là lemma nên không có *thì*.
  Các khoá còn lại dùng lại nguyên văn công thức chú giải từ `cnd6`, `cnd12`, `cnd13`, `cnd14`, `cnd15`, `cnd20`: `3.2`, `3.6`, `3.13`, `3.14`, `3.15`, `5.10` (theo `cnd6:19.8`, `cnd6:14.2`), `5.11` (theo `cnd6:11.9`), `9.2`, `13.2` (theo `cnd20:14.1`), `13.3` (theo `cnd12:10.2`, `cnd14:11.2`), `13.4` (theo `cnd13:18.3`), `17.18` (theo `cnd14:16.9`, `cnd20:11.2`), `19.2` (theo `cnd12:25.4`), `23.2` (theo `cnd20:27.2`), `24.8` (theo `cnd12:13.4`).

  **Trong chính bài:** 24 nhóm Pāli trùng nguyên văn (40 cặp), cả 24 nhóm có bản Việt giống hệt. Đo thêm bằng cách bỏ dấu câu và chữ hoa/thường: 32 nhóm (78 cặp), 30 nhóm Việt giống nhau (sau khi bỏ dấu câu, chữ hoa/thường và dấu nháy), 2 nhóm khác: [`1.1`, `3.11`, `7.1`] (`1.1`, `7.1` có *Con cầu xin* mang từ kệ `snp5.13`, `3.11` là lemma, không có) và [`22.4`, `26.5`] (*thì*), cả hai đã giải thích ở trên. Khoá `1`–`7`, `8`–`15`, `16`–`21`, `22`–`27` lặp kệ hai lần với cùng bản Việt. Chuỗi chín Ma, các chuỗi `…` liệt kê ở `17`, `23`, `25` mang cùng bản Việt từng khoá (`17.5`–`17.12`, `23.8`–`23.15`, `25.3`–`25.10` giống nhau; `17.13` và `25.11` cùng viết *nắm lấy, chấp thủ, nắm giữ, bám víu, chấp trước vòng luân chuyển*).

  **Thuật ngữ, kèm số đếm (phạm vi tầng; nêu cả hai số khi phạm vi gần nhất cho đa số khác).**
  - Công thức `yo chando yo rāgo yā nandī yā taṇhā ye upayupādānā cetaso adhiṭṭhānābhinivesānusayā` (`2.2`, `2.7`) → *phàm có ham muốn, tham, hoan hỷ, tham ái nào, có những hướng đến, chấp thủ, an trú của tâm, chấp trước và tùy miên nào*, theo `sn22.4:4.4` (cùng công thức), `mn112:10.2` (*những hướng đến, chấp thủ, an trú của tâm, chấp trước và tùy miên*). `chando` → *ham muốn* (23 khoá chứa `yo chando`: *ham muốn* 18, *dục nào* 2, *dục,* 2); `nandī` → *hoan hỷ* (33 khoá chứa `nandī` cùng `taṇhā`: *hỷ* 24, *hoan hỷ* 20, *niềm vui* 9; và `snp5.13:1.3` dịch `nandiñjahaṁ` *bậc từ bỏ hoan hỷ*); `taṇhā` → *tham ái* (như `cnd6`, `cnd14`, `cnd15`). Khác `sn22.4:4.4` ở chỗ *hỷ* → *hoan hỷ*, *ái* → *tham ái* (theo `snp5.13:1.3` và `cnd15`).
  - Chuỗi `pahīnā ucchinnamūlā tālāvatthukatā anabhāvaṅkatā āyatiṁ anuppādadhammā` (`2.2`, `2.7`, `3.7`, `4.3`) → *đã được đoạn trừ, cắt tận gốc rễ, làm thành như gốc cây thốt nốt bị chặt, làm cho không còn hiện hữu, khiến không thể sinh khởi trong tương lai*, theo `mn72:20.5` (cùng chuỗi; 13 khoá cho đúng dạng này) và `mn36:47.5`. `tālāvatthukata` → *thốt nốt* (132 khoá chứa: *chà là* 54, *thốt nốt* 33, *cọ* 10; chọn *thốt nốt* vì `tāla` là cây thốt nốt và `mn72`, `mn36`, `mn140`, `dn34` dùng *thốt nốt*; `sn22.3:5.7` viết *chà là* cho cùng chuỗi).
  - Chuỗi `chinnā ucchinnā samucchinnā vūpasantā paṭippassaddhā abhabbuppattikā ñāṇagginā daḍḍhā` (`3.3`) → *đã bị cắt đứt, chặt đứt, nhổ tận gốc, làm lắng dịu, làm an tịnh, không thể sinh khởi nữa, bị lửa trí tuệ thiêu cháy*: ba chữ sau theo `cnd6:13.3`, `cnd15:31.5`; ba chữ đầu: `ucchinna` 142 khoá chứa (*chặt* 122, *đoạn* 56, *cắt* 45, *nhổ* 2), `chinna` 103 khoá (*đứt* 39, *cắt* 37, *chặt* 29), `samucchinna` 84 khoá (*cắt* 44, *đoạn* 38, *nhổ* 14, *chặt* 4) ⇒ *cắt đứt*, *chặt đứt*, *nhổ tận gốc*.
  - `ejā`, `anejo`, `iñjati` → *dao động*, *bậc bất động*, *không dao động* (`snp5.13:1.1` *bậc bất động*; `cnd6:4.1` *dao động do tham ái …*; `sn35.90:1.1` *Dao động … là bệnh*); `na calati na vedhati na pavedhati na sampavedhati` (`3.9`) → *không lay chuyển, không run rẩy, không rung động, không chấn động* (`sn36.4:2.4` `pavedhati` *run rẩy*; `dn14:1.17.7` `sampavedhati` *chấn động*; `mn91:12.5` `vedhati` *lay động*). Tám pháp thế gian `lābha … dukkha` → *được lợi lộc, không được lợi lộc, được danh tiếng, mất danh tiếng, được khen ngợi, bị chê trách, lạc, khổ* (`an8.6:4.2` `alābha` *mất lợi ích*; `an8.7:2.3` *mất lợi dưỡng*; 0 tiền lệ cho `ayasa`).
  - `kāmogho bhavogho diṭṭhogho avijjogho` (`4.5`) → *dòng lũ dục, dòng lũ hữu, dòng lũ kiến, dòng lũ vô minh* (`dn34:1.5.19`, `dn33:1.11.164`); `tiṇṇo uttiṇṇo nitthiṇṇo atikkanto samatikkanto vītivatto` → *đã vượt qua, đã vượt lên, đã vượt thoát, đã vượt khỏi, đã vượt hẳn, đã vượt quá* theo `cnd12:25.5`, `cnd13:4.1`; `sabbasaṁsārapatha` → *toàn bộ con đường luân hồi* (`thi-ap32:40.3` *con đường luân hồi*). `jātimaraṇasaṁsāro natthi tassa punabbhavo` → *luân hồi sinh tử … không còn tái sinh* (`thag5.5:5.3` *luân hồi sanh tử*; `iti94:3.4` *không còn tái hữu*, chọn *tái sinh* theo `cnd6:15.3` *đã chấm dứt tái sinh*, `snp1.9:10.5`). `vutthavāso`, `ciṇṇacaraṇo` → *đã sống xong*, *đã thực hành xong* (theo `cnd6:15.3` `vusitavā` *đã sống xong*).
  - `kappa` → *tạo tác* (`taṇhākappa` *tạo tác do tham ái*, `diṭṭhikappa` *tạo tác do kiến*): theo `snp5.13:1.4` *bậc từ bỏ tạo tác*, `snp3.6:21.4` `Kappaṁ neti` *không còn tạo tác*; 0 tiền lệ cho hai từ ghép. `diṭṭhi` → *kiến* theo `cnd15:21.1` *sở hữu do kiến*, `cnd6:4.1`. `paṭinissaṭṭha` → *từ bỏ* (14 khoá chứa: *từ bỏ* 13, *xả* 12, *buông* 7).
  - `abhiyāce` chuỗi tám (`5.8`): `yācāmi abhiyācāmi ajjhesāmi sādiyāmi patthayāmi pihayāmi jappāmi abhijappāmi` → *cầu xin, khẩn cầu, thỉnh cầu, chấp nhận, ước muốn, khao khát, thầm khấn, thầm cầu*: `ajjhesāmi` *thỉnh cầu* theo `cnd13:18.2`, `cnd15:6.4`; `sādiyati` *chấp nhận*, `pattheti` *ước muốn*, `piheti` *khao khát*, `abhijappati` *thầm cầu* theo `cnd13:15.31`, `cnd15:4.8`; 0 tiền lệ cho `abhiyācāmi` (*khẩn cầu*) và `jappāmi` (*thầm khấn*).
  - `iccāyasmā` / `piyavacanaṁ` / `abhilāpo` → *Tôn giả … nói*, *đây là lời thân ái*, *lời xưng*: theo `cnd15:5.1`, `cnd15:5.4`, `cnd12:2.6`, `cnd13:2.6`, `cnd14:7.9`, `cnd20:3.3` (4 khoá cho `piyavacanaṁ …pe…`) và `cnd12:2.7`, `cnd13:2.7`, `cnd14:7.10`, `cnd20:3.4` (4 khoá cho `abhilāpo`).
  - `nāga` → *Long tượng* ở kệ (`snp5.13:1.5`) và *nāga* ở lời giải `6.2`–`6.3`; `āguṁ na karoti` → *không làm điều tội lỗi*, `na gacchati` → *không đi*, `na āgacchati` → *không đến* (0 tiền lệ).
  - `vīro` chuỗi: `vīriyavā` *có tinh tấn*, `pahū` *có khả năng*, `visavī` *có quyền năng*, `alamatta` *đủ sức*, `vigatalomahaṁsa` *không còn sởn tóc gáy* theo `cnd15:2.5`, `cnd13:17.8`; kệ `11` dùng lại nguyên `cnd15:3` (toàn tầng 10 khoá chứa `vīriyavā`: tinh tấn 4, có tinh tấn 2, dũng mãnh 2).
  - `ādānataṇhā` → *tham ái chấp thủ* theo `snp5.13:3.1`; `ādiyati` → *nắm lấy*, `upādiyati` → *chấp thủ*, `gaṇhāti` → *nắm giữ*, `parāmasati` → *bám víu*, `abhinivisati` → *chấp trước* theo `cnd15:26.2`, `cnd15:20.2`, `cnd13`. Dịch `ādāna` bằng *chấp thủ* ở kệ khiến *tham ái chấp thủ* trùng chữ với `upādāna`; đã giữ *nắm lấy* riêng cho `ādiyati` để lời giải `17.2`–`17.3` vẫn phân biệt hai gốc.
  - Chuỗi `gatiṁ upapattiṁ paṭisandhiṁ bhavaṁ saṁsāraṁ vaṭṭaṁ` (`17`, `23`, `25`) → *cảnh giới, tái sinh, kết sinh, hữu, luân hồi, vòng luân chuyển* theo `cnd14:12.1`, `cnd20:28.5` (cùng chuỗi). Toàn tầng 6 chữ ấy trong công thức này: không có tiền lệ ngoài hai khoá `cnd`.
  - `khandhamāra … vaṭṭamāra` (`20.1`) → *Ma uẩn, Ma giới, Ma xứ, Ma cảnh giới, Ma tái sinh, Ma kết sinh, Ma hữu, Ma luân hồi, Ma vòng luân chuyển* (0 tiền lệ; viết hoa *Ma* theo `Ma vương` ở kệ). `kammābhisaṅkhāra` → *hành tạo tác của nghiệp* theo `cnd15:24.3`.
  - `rūpagataṁ vedanāgataṁ saññāgataṁ saṅkhāragataṁ viññāṇagataṁ` (`19.1`, `24.7`) → *thuộc về sắc, thuộc về thọ, thuộc về tưởng, thuộc về các hành, thuộc về thức* theo `mn147:3.26` (*thuộc về thọ, thuộc về tưởng, thuộc về các hành, thuộc về thức*); `mn64:9.3` viết *thuộc sắc, thọ, tưởng, hành, thức*.
  - `uddhaṁ pādatalā adho kesamatthakā` (`18.17`–`18.18`) → *từ lòng bàn chân trở lên*, *từ đỉnh tóc trở xuống* (`dn28:7.3`); `adukkhamasukhā vedanā` → *thọ không khổ không lạc* (`cnd6:19.4`, `dn34:1.4.11`); `abyākatā dhammā` → *các pháp vô ký* (`ps3.7:2.1` viết *các pháp không tạc hiện*; báo ngoài lát).
  - `maccudheyya` → *lãnh địa của Thần chết*, `māradheyya` → *lãnh địa của Ma vương*, `maraṇadheyya` → *lãnh địa của cái chết* (`snp5.13:4.4` *lãnh địa của Thần chết*; `mn34:3.4` `māradheyya` *phạm vi của Māra*, `maccudheyya` *phạm vi của cái chết*; `sn1.38:11.4` *cõi của thần Chết*). `pajā` → *đám người* theo `snp5.13:4.4`; `sattā visattā āsattā laggā laggitā palibuddhā` (`26.3`) → *bị dính mắc, bị đắm chìm, bị bám chặt, bị mắc vào, bị vướng vào, bị ràng buộc* (`an4.24:9.2` `visattā` *bám chặt*; `snp2.5:7.3` *dính mắc*; 0 tiền lệ cho `palibuddha`).
  - `pajānanto` chuỗi sáu (`23.4`, `23.5`) → *biết, liễu tri, hiểu rõ, nhận biết, nhận biết rõ, thấu suốt* theo `cnd15:14.4` cho năm chữ *biết, hiểu rõ, nhận biết, nhận biết rõ, thấu suốt* (`jāneyyaṁ`, `ājāneyyaṁ`, `vijāneyyaṁ`, `paṭijāneyyaṁ`, `paṭivijjheyyaṁ`, dạng nguyện; Pāli ở đây có `paṭivijānanto` thay `paṭijānāti`), `pajānanto` → *liễu tri* theo kệ `snp5.13:4.1`, và `cnd12:12.2`, `cnd12:12.5` (hai câu trích). `sato` → *chánh niệm* (`cnd6:13.5`–`13.8`, `cnd12:12.6`–`12.8`).
  - `disāvidisaṁ` → *khắp các phương chính và phụ* (`mil6.1.9:6.1` *các phương chính và phụ*; `mil6.1.5:14.2` *các phương chính và phương phụ*).
  - `khattiyā brāhmaṇā vessā suddā gahaṭṭhā pabbajitā devā manussā` → *Sát-đế-lợi, Bà-la-môn, Phệ-sa, Thủ-đà, người tại gia, người xuất gia, chư thiên và loài người* theo `cnd20:14.1`.
  - `rūpadhātu … viññāṇadhātu` (`2.2`, `2.4`–`2.7`) → *giới sắc, giới thọ, giới tưởng, giới hành, giới thức* theo `sn22.4:4.1`–`4.4`, `sn22.3:5.4`–`5.7` (xem trên).

  **Số Pāli, kèm phép tính.** `dve kappā` (`5.2`) = 2: *hai loại tạo tác* (liệt kê đúng hai: `taṇhākappo`, `diṭṭhikappo`); `catūhi kāraṇehi` (`24.3`) = 4: *bốn lý do*; `dvādasamo` (`28.3`) = 12: *thứ mười hai* (khớp `0.4` = 12); bốn dòng lũ `kāmogho bhavogho diṭṭhogho avijjogho` (`4.5`) = 4 Việt; chuỗi sáu `tiṇṇo … vītivatto` (`4.5`) = 6 Việt; tám pháp thế gian (`3.9`) = 8 Việt + 4 động từ `calati vedhati pavedhati sampavedhati` = 4 Việt; tám mục `abhiyāce` (`5.8`) = 8 Việt; bảy động từ `upeto … samannāgato` (`5.11`) = 7 Việt; năm danh từ + năm tính từ + bốn động từ ở `6.4` = 5 + 5 + 4 Việt; tám nhóm người (`9.2`, `13.2`) = 8 + 8 Việt; mười bảy xứ (`9.3`) = 17 Việt; bốn động từ `saṅgatā samāgatā samohitā sannipatitā` (`9.4`) = 4 Việt; năm tính từ `vīro` (`10.3`) = 5 Việt; sáu mục `abhikaṅkhamānā …` (`12.2`) = 6 Việt; tám động từ + `sādhu` ở `13.4` = 8 Việt (+ *khéo*); năm tính từ ở `14.1` = 5 Việt; năm động từ ở `17.3`, `19.1`, `25.1` = 5 + 5 + 5 Việt; sáu động từ ở `17.15` = 6 Việt; năm uẩn (`rūpa … viññāṇa`) + sáu mục `gati … vaṭṭa` ở `17`, `23`, `25` = 5 + 6 Việt mỗi chuỗi; sáu nhóm ba (`18.2`–`18.19`) = 6 × 3 Việt; chín loại Ma ở `20.1` = 9 Việt (+ *thuộc về kết sinh*, xem bất định 5); mười một từ ở `20.2` = 11 Việt; sáu động từ ở `23.4` = 6 Việt và ở `23.5` = 6 Việt; sáu cõi `sabbaapāyaloke …` (`24.8`) = 6 Việt; bảy động từ ở `25.13` = 7 Việt; sáu từ `sattā … palibuddhā` ở `26.3` = 6 Việt, ở `26.4` = 6 + 6 Việt. Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi`, `sahassa`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `1.1`, `7.1` và `1.4`, `7.4` đều viết *Con cầu xin*, vì dùng lại nguyên văn `snp5.13:1.1` và `1.4`; Pāli chỉ có động từ `abhiyāce` ở `1.4`/`7.4`, còn `1.1`/`7.1` chỉ liệt kê danh hiệu (Sujato dịch `I beseech you` một lần ở dòng đầu). Giữ như bản đã dịch của `snp5.13` để hai bài khớp nhau; nếu sau này đổi `snp5.13:1.1`, đổi cả ở đây.
  2. `5.9` `Sumedhā vuccati paññā` → *Trí tuệ tốt đẹp được gọi là tuệ*; `5.11` `medhāya paññāya` → *trí tuệ này, tuệ này*: 0 tiền lệ cho `medhā` (chưa phân xử được liệu hai từ là hai thuật ngữ hay một cặp đồng nghĩa); `5.12` giữ *bậc trí tuệ* của kệ cho `sumedho`.
  3. `5.3`–`5.5`, `5.6`, `5.7` `taṇhākappa`/`diṭṭhikappa` → *tạo tác do tham ái*/*tạo tác do kiến*: nghĩa của `kappa` ở đây (sự tạo dựng, phân định của ái và của kiến) chưa phân xử được; Sujato dịch `formulation`; bản Việt giữ *tạo tác* của `snp5.13:1.4`.
  4. `6.3` `āguṁ na karoti` → *không làm điều tội lỗi*: nghĩa `āgu` là *tội lỗi* dựa vào hiểu biết của người dịch, không có tiền lệ trong tầng; không ghi `(āgu)` vào thân kinh vì Pāli khoá ấy không có ngoặc.
  5. `20.1` `paṭisandhiko` đứng ngay trước chuỗi chín loại Ma: viết *thuộc về kết sinh*, tách bằng dấu phẩy; chưa chắc tính từ ấy bổ nghĩa cho cả chuỗi hay cho `Ma kết sinh`. Dấu phẩy là của người dịch.
  6. `20.2` giữ nguyên `jāgu`, `indagu` (0 tiền lệ, nghĩa chưa phân xử được); `mānava` → *thanh niên*, `posa` → *đàn ông*, `jantu` → *sinh vật*, `manuja` → *con người* đều 0 tiền lệ cho cả chuỗi mười một từ.
  7. `25.13` `dissamāno` → *đang nhận ra*: 0 tiền lệ; năm mục còn lại theo `cnd20:25.5`.
  8. `12.2` `pihayamānā` → *thèm khát* (khác `cnd13`, `cnd15` viết *khao khát*) để không trùng `abhikaṅkhamānā` → *khao khát* đứng ngay đầu chuỗi và là lemma.
  9. `24.2` `puthujjanakalyāṇako` → *phàm phu hiền thiện*: 0 tiền lệ.
  10. `26.4` `bhittikhile`, `nāgadante` → *cái cọc trên tường*, *cái móc ngà voi*: 0 tiền lệ; nghĩa dựa vào hiểu biết của người dịch.
  11. `4.8` có hai dấu lược trong cùng khoá (`dosā cittaṁ … mohā cittaṁ …pe…`), viết *tâm khỏi sân … tâm khỏi si …* (hai `…`), phần bị lược là *đã thoát, đã giải thoát, đã khéo giải thoát* của `rāgā cittaṁ muttaṁ vimuttaṁ suvimuttaṁ`.
  12. `3.9` `ayasepi` → *mất danh tiếng*, `yasepi` → *được danh tiếng*: 0 tiền lệ cho cặp `yasa/ayasa` trong chuỗi tám pháp thế gian; `18.2`–`18.4` `uddhaṁ = anāgataṁ`, `adho = atītaṁ`: dịch đúng như Pāli, không cố làm nghĩa trên/dưới trùng khớp với thời gian.
  13. Lỗi ngoài lát, báo chứ không sửa: `snp5.13:1.1` và `snp5.13:1.4` cùng có *Con cầu xin* (xem 1); `snp5.13:3.2` *(Đức Thế Tôn trả lời:)* bỏ hô ngữ `bhadrāvudhā` (cùng kiểu với `snp5.12:3.2`, đã báo ở `cnd15`); `ps3.7:2.1` dịch `abyākatā dhammā` là *các pháp không tạc hiện*.

