notes: |-
  TẦNG THAM KHẢO — 0 khoá trên 2 có Anh Sujato. Không có thư mục `kn/tha-ap/` trong edition
  `translation/en/sujato` tại commit đã ghim (`source/upstream-manifest.json` xác nhận thư mục con của
  `sutta/kn/` trong edition đó chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud). Không có Việt hiện hành,
  không có lớp lấp `english-project`. ⇒ `draft`, `triangulation` 7.5.

  ĐỒNG BÀI CÙNG PHẨM ĐÃ CÓ TRÊN ĐĨA, DÙNG LẠI NHẤT QUÁN. tha-ap138 và tha-ap140 cùng `Sobhitavagga` cho
  tiền lệ gần như y hệt: `Therāpadāna` giữ Pāli (**262/262 bài tha-ap đã dịch, 1 cách duy nhất** — không phải
  “Trưởng Lão Ký Sự”, tuy có bản dịch như vậy ở một số nơi); `Sobhitavagga` → “Phẩm Sobhita” (3 nơi,
  1 cách); `Paṭisambhidā catasso` → “Bốn vô ngại giải” (**275 nơi**, dùng nguyên văn); `…pe…` → `…`;
  `kataṃ buddhassa sāsanaṃ”.` → “đã làm tròn lời dạy của Đức Phật”.”; `Itthaṃ sudaṃ āyasmā X thero imā gāthāyo
  abhāsitthāti.` → “Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này.”; `…therassāpadānaṃ N.` →
  “Bài Kệ Tuyên Ngôn Về Trưởng lão X, thứ N.”; `sabbaññū lokanāyako` → “bậc Toàn Tri, Đạo sư của thế gian”
  (dùng nguyên văn tha-ap205:1.2). `Padumuttara` giữ Pāli (tiền lệ tha-ap107, 146, 251, 376). `jino` → “Đức
  Chiến Thắng”, `isi` → “vị Ẩn Sĩ”, `sambuddho` → “Đức Chánh Đẳng Giác” (đều có tiền lệ).
  `cakkavattī mahabbalā` (7.4) → “là những Chuyển luân vương có đại thần lực.” — Pāli giống hệt tha-ap192:5.4
  nên hai bài mang **cùng một câu**, và khác tha-ap139:7.4 (`mahabbalo` số ít) là “là Chuyển luân vương có
  đại thần lực.”.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `mantapāragū` (1.2 và 4.2) — Pāli giống hệt nhau ở hai khoá, và bản Việt cũng vậy (đã sửa `:4.2` từ “vị
  Bà-la-môn thông thạo lời tụng ấy” về “là Bà-la-môn rất thông thạo lời tụng” cho khớp, vì khác nhau ở
  đây là tự mâu thuẫn trong một bài). `mantapāra` = tinh thần tụng (mantra) đem đi vượt qua; dịch “rất thông
  thạo lời tụng” và **không** dịch “thông Veda” vì Pāli không nói Veda.
  `vājapeyyaṃ ayājayi` (1.4) — `vājapeyya` là bài ca của thiên tài; dịch “xướng lên bài ca do thiên tài làm
  ra.” `Ajjhāyako yācayogo` (1.3) — `ajjhāyaka` = đọc tụng, `yācayoga` = tụng hát theo khúc điệu; dịch “hay
  đọc tụng, tụng hát khúc điệu,”.
  `sukkamūlena` (6.1) — `sukka` = trắng, chỉ rễ củ trắng (củ cải trắng), là vật cúng dường dâng lên; dịch “Bằng
  chính rễ củ trắng đó,”. Bản nháp đầu tiên dịch “rễ rau” — sai vì rau không phải vật dâng lên.
  `pañcatiṃsāsu khattiyā` (7.2) — `khattiya` là tầng lớp quân tộc, không phải nông dân; dịch “có những vị
  quân tộc trong ba mươi năm”. Cùng lý do, `sumitto nāma khattiyo` ở tha-ap139:7.2 dịch “có vị quân tộc tên
  Sumitta”.
  `Ambaraṃsasanāmā te` (7.3) — tên riêng `Ambaraṃsasa`, ghép tên thành Ambara với `ṃsasa` (danh hiệu vua
  của thành Ambara). Không có tiền lệ trong tầng; dịch “Ambarsa” để giữ dạng Việt mà không mất dấu Pāli.
  `appamāṇe nirūpadhi` (3.4) — `appamāṇe` + `nirūpadhi`, hai danh từ nối nhau, dịch “không đo lường, không
  chấp giữ.”
  `Sabbāsave pariññāya, tiṇṇo loke visattikaṃ` (6.3–6.4) — `visattika` là khổ đau (theo dải nghĩa cũ “sattā /
  visattā”); dịch “người ấy vượt khỏi thế giới, khỏi khổ đau.”
  `Ekārase kappasate` (7.1) — đo được 394 khoá Pāli `kappasate` trong `tha-ap`; chọn hình “Vào … kiếp trước”
  như tha-ap138.

  DẤU LƯỢC — `:8.2` là `…pe…`; bản Việt giữ **đúng một** `…` (không mở rộng). Đây là cơ chế
  `_hvi.lược()`: `…pe…` tính là MỘT dấu lược, đã khớp từng khoá khi ghi.

  Ngoặc kép: 1.1 mở “ và 8.3 đóng ” — toàn bộ kệ là một lời thoại; 8.2 (`…`) nằm trong đó; 9.1 và 10.1 ngoài
  nháy kép. Tự đếm lại: cân.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  Sửa lan 2026-10-13 (lượt L539): khoá tha-ap136:6.2 `anubhotvāna sampadā`, “anh đã thọ nhận được thành tựu” → “sau khi đã thọ hưởng các thành tựu” (anubhotvāna là bất biến phân từ “sau khi thọ hưởng”, Pāli không có chủ ngữ nên không thêm “anh”; chủ ngữ của câu là `tiṇṇo` ở 6.4, đã là “người ấy”); căn cứ: cùng Pāli `anubhotvāna sampadā` ở 6 bài khác — 4 bài dịch “sau khi (đã) thọ hưởng (các/những) thành tựu” (tha-ap474:18.2, tha-ap174:2.2, tha-ap202:3.2, tha-ap342:11.2), 2 bài dùng “tôi” vì cùng kệ có chủ ngữ ngôi thứ nhất (tha-ap339:14.2 có `ahaṁ`; tha-ap129:7.2 có `pattomhi`) — kệ này không có. Khoá tha-ap136:6.1 `Teneva sukkamūlena`, “Bằng chính rễ củ trắng đó” → “Nhờ chính cội nguồn thiện căn ấy” (sukkamūla = cội nguồn thiện, cái được “bẻ hoa” ở 4.1 là hoa, không có vật dâng nào là rễ củ; câu giải thích “rễ củ trắng (củ cải trắng) là vật cúng dường” ở đoạn trên của notes này không có căn cứ trong Pāli và được thay bằng cách dịch này); căn cứ: tha-ap391:4.1 cùng Pāli “Nhờ chính cội nguồn thiện căn ấy”, và hơn 35 khoá `sukkamūlena codito` dịch “cội nguồn thiện căn”. Chưa sửa, ghi nhận (ngoài lượt): tha-ap129:7.1 và thi-ap31:5.1 còn “Bằng chính rễ củ trắng đó”.
