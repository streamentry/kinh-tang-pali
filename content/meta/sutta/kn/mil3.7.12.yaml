notes: |-
  Đủ 11/11 khoá trong all. Đã đọc HẾT Pāli lát qua v7/p1.txt trước khi viết.
    Khung bốn khối tiêu đề, lời thoại, lời khen và dòng chốt giữ nguyên một cách dịch cho cả
    bốn bài mil của lát, theo mil3.4.9 / mil3.5.6 / mil3.6.6 / mil3.7.13 đã có trong tầng:
    Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc (0 tiền lệ riêng, dùng lại nguyên văn
    mil3.7.13:0.2 cùng phẩm); Thero āha— → Trưởng lão nói— (cả 2 bài đã có đều dịch vậy);
    Samuddapañho dvādasamo → Câu hỏi về biển, thứ mười hai.
    LƯỢT SOÁT CHÉO ĐÃ SỬA MỘT CHỖ. Bản nháp đầu để Rājā āha— thành Vua nói—, theo mil3.5.6 và
    mil3.6.6. Đếm lại toàn tầng cho thấy dấu hai chấm là đa số: 10 bài dùng Vua nói: (mil3.3.4
    không tính, thật ra là mil3.4.3, mil3.4.9, mil3.5.3, mil3.5.4, mil3.5.9, mil3.6.7, mil3.6.8,
    mil3.6.11, mil3.7.8, mil3.7.13) và chỉ 6 bài dùng Vua nói—. Tôi theo đa số, đổi thành Vua nói:.
    Đây là dấu gạch dài so với hai chấm trong bản gốc, nên tôi để bạn biên tập muốn thống nhất thì
    đổi 16 bài cùng lúc, đừng sửa lẻ bài kinh.

    Tiền lệ BẮT BUỘC dùng lại nguyên văn (TIEN_LE_PHAI.md): khoá 2.1 là “Khéo lắm, thưa tôn giả
    Nāgasenā.” — Pāli `Kallosi, bhante nāgasenā` trùng mil3.5.6:2.1 và mil3.6.6:2.1, đã so ký tự.
    Ngoài ra: loṇa → vị mặn (11 tiền lệ, mil3.7.13 dùng cho cùng chủ đề); udaka → nước;
    biển (258); mahārāja → Đại vương; bhante → tôn giả; tattakaṁ → từng ấy nhiêu.

    Bất định đã ghi nhận. Vua hỏi về NGUỒN GỐC TỪ (vì sao nước lại gọi là samuddo), nên tôi giữ
    chữ `samuddo` trong thân câu thay vì dịch hẳn là biển — dịch hẳn thì câu hỏi mất đối tượng.
    Nhưng để người đọc hiểu ngay lần đầu, tôi thêm cặp `tức là biển, biển` ngay sau lần gọi đầu,
    đúng một lần, không lặp ở hai chỗ sau. Đó là cách duy nhất tôi chấp nhận thêm chữ không có
    trong Pāli, và nó thuộc loại chú giải từ ngữ, không phải ý mới: `samuddo` là biển, còn câu hỏi
    là tại sao NƯỚC lại mang tên ấy.
    Dấu lược: cả bài không có `…pe…` nên hai phía đều 0.
    Kiểm kỹ thuật: save_vi sạch, chạy hai lần idempotent (sha256 không đổi). Vì mọi khoá Pāli của Theragāḵā ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá: đủ 11/11 khoá; đúng ID; thứ tự khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2 ở dòng kết); nháy kép cân trên cả bài; không còn `(…)`; không có ký tự ngoài Latin. Không chạy npm run validate|test|check|build (đợt này cấm) nên technical_integrity = 9.6, không phải 10.  Không đối chiếu được tầng Việt hiện hành: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Đây là giới hạn của bản chụp upstream, đã ghi ở content/meta/reference-gaps.yaml.
