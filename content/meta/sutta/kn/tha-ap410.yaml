notes: |-
  Dịch từ Pāli root của tha-ap410 (214 khoá, thứ tự khoá như Pāli); không có bản Anh Sujato, không có bản Việt hiện hành, không có lớp lấp english-project. Mọi lựa chọn dựa vào Pāli, ngữ cảnh bài và tiền lệ đếm được trong tầng Việt của dự án (551 tệp tha-ap đã có :0.3 lúc đo). Status bắt buộc draft do blocker noEnglishEditionUpstream. Content/meta/reference-gaps.yaml chưa có entry nào cho tha-ap410 (đo: 0); có entry cũng không cứu được published, nên việc ghi nhận gap là việc của người điều phối.

  Tên bài (:0.3): Pāli Todeyyattheraapadāna không bắt đầu bằng số nên bản Việt không có số thứ tự; translationTitle bằng đúng giá trị khoá :0.3 (Ký Sự Về Trưởng Lão Todeyya). Đo kiểu tên trên 551 tệp tha-ap: Tuyên Ngợ (chính tả đáng ngờ) 255, Ký Sự 151, Tuyên Ngôn 138, Kinh Kệ 5, khác 2. Hai phạm vi cho hai đa số khác nhau: toàn tầng nghiêng về Tuyên Ngợ; cửa sổ tha-ap395–420 có Ký Sự 23 trên 23; phẩm Metteyya (tha-ap403–406, 408, 409, 412) Ký Sự 7 trên 7. Chọn Ký Sự theo phạm vi gần nhất, khớp lời kết 54.1 (Ký sự về Trưởng lão …, thứ tám; aṭṭhamaṁ = thứ tám). Đề nghị người biên tập phán một lượt cho cả cuốn. Tên riêng Todeyya giữ dạng Pāli. :0.1 Therāpadāna giữ nguyên Pāli (540 trên 551 khoá cùng Pāli); :0.2 Metteyyavagga dịch Phẩm Metteyya (7 trên 7).

  Số Pāli, tự tính: saṭṭhi = 60, sahassa = 1000, nên saṭṭhi … sahassāni = sáu mươi ngàn (60 × 1000 = 60.000) ở 11.3 (pāṇa, chúng sinh), 16.1 (voi), 18.1 (ngựa), 20.1 (xe), 21.1 (bò cái sữa), 22.1 (phụ nữ), 24.1 (làng); saṭṭhihāyanā (7.2) = sáu mươi tuổi; pañcavīsatikappāni (42.3) = hai mươi lăm kiếp; chabbīsatikappasate (43.1) = 26 × 100 = hai ngàn sáu trăm kiếp; sahassakkhattuṁ (43.3) = một ngàn lần; tettiṁsakkhattuṁ (44.1) = ba mươi ba lần (te 3 + tiṁsa 30; tiền lệ tha-ap420:7.1); tiṇṇaṁ vedāna (46.2) = ba Veda; tilakkhaṇena (46.3) = ba tướng; tividhaggi (49.1) = ba ngọn lửa; catusaccaṁ (34.3) = bốn chân lý; catasso (52.1) = bốn; tidhāpabhinnā (7.1) = chảy dịch ở ba nơi. Bài không có cụm Tiṁsakappasahassa. Ghi để tránh lẫn: tiṁsa = ba mươi (không phải ba), nhất quán với tettiṁsa = ba mươi ba.

  43.1 là lời thọ ký tương lai ở vị trí cách (kappasate): dịch Sau hai ngàn sáu trăm kiếp nữa, theo tha-ap487:17.1 (cùng Pāli, 1 khoá) và tha-ap409:34.1 (Aṭṭhārase kappasate = Sau một ngàn tám trăm kiếp nữa); tha-ap413:20.1 cùng công thức dịch Trong một ngàn tám trăm kiếp, nên tầng chưa nhất quán giữa sau và trong. Pāli không nói rõ quan hệ giữa hai mươi lăm kiếp ở 42.3 (đối cách, kéo dài) và hai ngàn sáu trăm kiếp ở 43.1; bản Việt không thêm quan hệ nào.

  Dùng lại tiền lệ nguyên văn: trong 214 khoá có 87 khoá Pāli trùng một khoá khác của tầng kn (đã dò), trong đó 82 khoá bản Việt dùng đúng chữ của một bản tiền lệ (không kể hoa thường), 5 khoá khác (4.1, 16.4, 22.3, 26.3, 39.2), đều có lý do: 4.1 anīkaṭṭhā dịch quân hộ vệ theo ja520:8.1 (ja462:7.1 dịch kẻ cưỡi ngựa không khớp anīkaṭṭha); 16.4 hemakappanavāsase dịch khoác trang cụ bằng vàng theo tha-ap409:25.4 cùng công thức kệ (ja499:8.4 dịch mặc áo dệt bằng vàng, 1 khoá); 22.3 dùng mặc y phục và trang sức muôn màu (tha-ap409, tha-ap474, 2 khoá; dạng với y phục … có 3 khoá nhưng ở pv); 26.3 bỏ chủ ngữ vị ấy của tiền lệ để dùng ngôi ta; 39.2 thêm chữ lên cho liền câu với 39.1. Trong chính bài có 9 nhóm Pāli trùng (không kể hoa thường và dấu cuối): sabbe sannipatuṁ tadā (7 khoá: 4.4 đến 10.4), sabbālaṅkārabhūsite (16.2, 18.2, 20.2), ārūḷhe gāmaṇīyehi (17.1, 19.1), nikkhamiṁ anagāriyaṁ (17.6, 19.4), pabbajiṁ anagāriyaṁ (20.6, 21.4, 23.4, 24.4), sabbāsave pariññāya (48.3, 49.3), viharāmi anāsavo (49.4, 50.3), …pe… (50.2, 51.2, 52.2), kataṁ buddhassa sāsanaṁ (51.3, 52.3): tổng 38 cặp, 0 cặp mà bản Việt khác nghĩa (chỉ khác hoa thường và dấu nháy đóng ở 52.3 theo Pāli).

  Ngôi kể: dùng ta xuyên suốt cho lời tự thuật, theo đa số công thức chung: Kilesā jhāpitā mayhaṁ (bốn dạng đầu trong 221 khoá) ta 143, tôi 35 và 27, con 8; viharāmi anāsavo ta 144, tôi 38, tôi sống đời thanh tịnh 23, con 2 (212 khoá); pabbajiṁ anagāriyaṁ ta xuất gia 16, tôi 8 (27 khoá). Ba công thức kệ 50, 51, 52 dùng nguyên văn đa số của tầng, …pe… dịch đúng một dấu lược …; lời kết 53.1 dùng nhóm số nhiều đã nói những bài kệ này (Pāli imā gāthāyo; 407 khoá, so với 21 khoá bài kệ này số ít), theo tha-ap408:23.1; 54.1 theo tha-ap408:24.1.

  Thuật ngữ và tiền lệ: candana = chiên-đàn (tha-ap, 5 khoá; trầm hương 6 khoá nhưng trầm hương thường là agaru chứ không phải candana; đàn hương 1 khoá). pamatta (2.1) = phóng dật (28 khoá, so với buông lung 3, lơ là 1; tiền lệ Khattiyassa pamattassa = Khi vị sát-đế-lợi phóng dật). Paccante kupite (3.1) = miền biên địa nổi loạn (tiền lệ Kupito ahu paccanto, Tadā kupitapaccanto). āḷārikā kappakā nhāpakā mālakārā (5.1–5.2) = thợ làm bánh, thợ cạo, người hầu tắm, người làm tràng hoa, đúng chữ của dn2 (cùng chuỗi nghề); hatthārohā anīkaṭṭhā sūrā cammayodhino dhanuggahā uggā (4.1–4.3) theo dn2 và ja520: cưỡi voi, quân hộ vệ, dũng sĩ, chiến binh mặc giáp da, cung thủ, chiến sĩ dòng cao quý. kaṁsūpadhāraṇā (21.2) = có bình đồng đựng sữa (dn17:2.5.12 dịch cho sữa đầy bình đồng). Agyāgāraṁ (26.2) = phòng lửa (mn75:1.2). suññāgāre (27.2) = ngôi nhà trống (thi-ap9, thi-ap15). Maṇḍape (27.1) = trong lều theo đa số 7 khoá (thi-ap15:19.1 …) so với dưới mái che 1 khoá (tha-ap408:11.3, cùng phẩm); Pāli ở đây không có maṇḍapa khác để đối chiếu. gatimaggaṁ visodhaye (15.4) theo tha-ap406:8.4 (thanh lọc con đường đi đến cảnh giới tái sinh); Yannūna (15.3) = Chi bằng theo tha-ap406:9.1. Tiyaggī nibbutā mayhaṁ → Ba ngọn lửa của ta đã tắt (tha-ap454:4.1 có thêm chữ dần mà Pāli không có, nên bỏ). Sumedho nāma sambuddho (28.1) = tôn hiệu Sumedha theo đa số 5 khoá (tha-ap405:2.1 dùng tên là). 30.4 tampi so tārayissati: taṁ là đối cách của tvaṁ (ông), vì lời dạ-xoa nói với vị ẩn sĩ. Vassike (36.1) = hoa nhài (dhp377 dịch hoa nhài; dhp55 dịch vassikī là hoa vũ quý; 1 khoá mỗi bên).

  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 52.3, cố ý chạy qua khoá; có ba lớp nháy đơn: 12.2–12.4, 30.1–30.4, 36.1–38.4 và 41.1–48.4. Đối chiếu từng khoá cho 0 lệch trên 214 khoá (10 khoá có nháy). 31.3 buddhoti không có nháy trong Pāli nên bản Việt viết Phật, Phật không nháy. Dấu lược: ba khoá …pe… (50.2, 51.2, 52.2) đều là một dấu …; Pāli không có dấu lược trần hay (…) nào khác.

  BẤT ĐỊNH, để người biên tập phán, không thêm vào thân kinh:
  1. 2.2–2.3 aṭaviyo samuṭṭhahuṁ / otārā tuṇḍikā: aṭavi là rừng, dịch những toán người rừng; otārā (kẻ tìm kẽ hở, đột kích) và tuṇḍikā chỉ thấy ở khoá này (otāra chỉ có nghĩa khác ở sn4.24; tuṇḍika chỉ có ahituṇḍika ở ja365, cp13), nên tuṇḍika được giữ nguyên dạng Pāli.
  2. 3.2 sannipātesirindamo đọc là sannipātesi arindamo (bậc hàng phục kẻ thù, theo ja511:26.2), không coi là tên riêng như ở bv7:4.1.
  3. 8.2 ukkāruharaṇassa: ukkāra là rác, đống rác (tầng chỉ có thag10.5:1.2 mahāukkārasambhavo dịch phân); dịch việc mang đi rác rưởi, nghĩa của cụm ở ngữ cảnh quân đội chưa xác lập.
  4. 8.3 yodhājīvā katakammā dịch những người sống bằng nghề chiến đấu, đã thạo việc; katakamma có thể là đã lập công hoặc đã thạo việc.
  5. 9.2 utujasaddakaṁ dịch những tiếng do thời tiết sinh ra (mil6.2.5:1.5 có anutujaṁ dịch không do thời tiết sinh); nghĩa cụ thể của tiếng này trong đội quân chưa rõ.
  6. 10.1 Tisūlakontimantehi: dịch đinh ba và thương; kontimanta chưa có tiền lệ (ja542:159.2 không giúp được); 10.3 koṭṭentānaṁ nipātentā dịch đang đâm chém, đang quật ngã.
  7. 11.1–11.2 Kimevātinisāmetvā, sarājā ajitaṁ jino: cả ba chữ đều khó phân xử (kimeva + ati + nisāmetvā; sarājā; ajitaṁ jino). Bản Việt dịch sát chữ Sau khi xem xét kỹ việc gì đó, chính ta, vị vua chiến thắng cả kẻ chưa ai thắng được; không thêm nghĩa là xét thiếu cân nhắc dù mạch kệ sau (12–15) cho thấy vua hối hận. sarājā đọc là sa (đại từ) + rājā; chữ này cũng có ở ja213:1.4 (Pāli, không có bản Anh để đối chiếu).
  8. 11.4 uttāsayiṁ (khiến bị đặt lên cọc, đâm xuyên) dịch cho xiên lên cọc; sūle uttāsita là cách nói quen thuộc nhưng tầng không có tiền lệ.
  9. 13.2 passāmi niraye: niraye là vị trí cách, dịch thấy ở địa ngục; không thêm cảnh. 13.4 tajjayanti không nêu chủ thể, dịch họ.
  10. 14.3 na te pahonti dhāretuṁ: dịch Chúng không đủ sức nâng đỡ ta, bổ sung ta theo 14.4 mamaṁ; dhāretuṁ cũng có thể là gìn giữ.
  11. 17.3 saṅgāmāvacare ṭhāne: dịch Ở chốn trận mạc; ṭhāne có thể là nơi chốn hoặc vị trí.
  12. 19.3 pahāretvāna và 20.5 parihāretvā: đều đọc theo ngữ cảnh là bỏ lại (dứt bỏ, lìa bỏ), vì cả hai khoá đều dẫn tới nikkhamiṁ / pabbajiṁ; pahāretvāna không thấy ở nơi khác trong Pāli root (đo: 0 khoá khác).
  13. 30.4 tampi so tārayissati: xem trên, dịch ông cũng được; nếu taṁ là ngôi ba thì phải dịch người ấy.
  14. 37.1–37.2 nāgavanike, atimuttakaketake: giữ nguyên tên cây dạng Pāli (ja504:11.2 giữ atimuttaka); campaka, ketaka cũng không có tiền lệ Việt.
  15. 39.4 aṭṭhāsi tāvade: Pāli là aṭṭhāsi chứ không phải aṭṭhāsiṁ, nhưng 39.1–39.3 (anulimpiṁ, pasādetvā) cùng chủ ngữ nên đọc là ngôi thứ nhất (tha-ap486:16.4 tuṇhī aṭṭhāsahaṁ tadā).
  16. 42.1–42.2 Ādeyyavākyavacano, brahmā uju patāpavā: brahmā đọc là danh từ Phạm thiên, patāpavā dịch đầy uy lực; có thể đọc brahmā là tính từ (cao quý).
  17. 46.3 tilakkhaṇena sampanno: dịch Đầy đủ ba tướng; ba tướng nào không được Pāli nêu, bản Việt không đoán.
  18. 47.2 mantapāragū dịch bậc thông suốt thần chú; 48.2 añjasaṁ dịch con đường ngay thẳng (añjasa là thẳng, trực tiếp; thêm chữ con đường theo nghĩa danh từ thường dùng).
  19. 47.3 Upagantvāna sambuddhaṁ: tiền lệ nghiêng về Đi đến gần Đức Toàn Giác (4 khoá, so với Đức Chánh Đẳng Giác 1 khoá ở tha-ap398:8.3 và Tiến lại gần Đức Chánh Đẳng Giác 2 khoá); chọn Chánh Đẳng Giác để nhất quán với 28.1 và 35.3 của chính bài.
  20. 46: bāvarī nāma brāhmaṇo (46.4) là vị Bà-la-môn khác với người được thọ ký; 47.1 Tassa sisso xác nhận người được thọ ký là đệ tử của Bāvarī. Không thêm lời giải thích vào thân kinh.

