notes: |-
  Đã đọc HẾT Pāli lát qua v5/p5.txt trước khi viết. Không segment nào của lát này có …pe… nên hai phía đều 0 dấu lược. Mọi dấu nháy kép đều cân trên cả bài.
  Phẩm Littavagga → Phẩm Những Điều Nhỏ: 0 tiền lệ cho tên phẩm này (ja1 Phẩm Bụi Dơ, ja12 Phẩm Giới, ja21 Phẩm Nai Bốn Sừng, ja101/106/107 Phẩm Parosata); litta = nhỏ, bé, ngắn, mà Pāli không nói cái gì nhỏ nên dịch theo nghĩa chữ, không gắn vào con vật nào. Giữ Jātaka và Bộ Một Bài Kinh theo ja1, ja12; 0.1 và 0.2 ngắn hơn 40 ký tự nên chốt không kiểm trùng Pāli, nhưng tầng đã có tiền lệ dùng nguyên văn Jātaka.

  Cùng công thức với mnd16:114.1–114.4 (chưa có bản Việt trong tầng) nên dùng nó
  làm phép so: ở mnd16 vế 1.1 là Samatittikaṁ anavasesaṁ, ở ja96 là anavasekaṁ — biến
  thể khác nhau. Đã chọn nghĩa không vết bẩn cho anavaseka (avaseka = vết bẩn, vết
  dơ), và ghi ở đây là đọc còn lại là nếp nhăn của chiếu. 0 tiền lệ cho telapatta, đặt
  mới theo nghĩa chữ: lá để đốt làm đèn dầu; vì không có tiền lệ Việt cho cụm này mà
  kinh trích dẫn chỉ có bốn vế kệ, dịch lá dầu và giải thích thêm sẽ là thêm ý.
  sacitta → giữ tâm nhớ biết (0 tiền lệ riêng, đặt mới); anurakkhe → canh giữ;
  disaṁ agatapubban → phương chưa từng bước tới (không nói thành chưa từng có ai đi,
  vì đó là câu chuyện của riêng người đi, nên giữ chữ bước).
  Vế 1.1 Pāli là mô tả tính chất không có chủ ngữ, giữ dạng khúc đoạn.
