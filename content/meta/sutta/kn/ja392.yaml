notes: |-
  Dịch trực tiếp từ Pāli root. Tầng `english-sujato` không có tệp cho ja392 tại commit đã ghim, và `vietnamese-current` (Hòa thượng Thích Minh Châu) tại commit đã ghim chỉ có 26 tệp, toàn bộ là Pháp Cú, nên không có tầng Việt tham khảo cho Jātaka. Không còn tầng đối chiếu nào ngoài Pāli.
  Tiền lệ Pāli trùng nguyên văn: 18 khoá trùng chuỗi Pāli với `sn9.14` (`Gandhatthenasutta`) — đó là chính câu chuyện này được trích vào Tương Ưng, nên cùng một câu kệ. Trong đó dùng lại nguyên văn bản dịch cũ ở 3 khoá: `:2.3` theo ja394:1.3 (tiền lệ 2 lần), `:7.2` và `:7.3` theo sn9.14:8.2–8.3. Cố ý lệch 15 khoá vì bản Jātaka khác bối cảnh: `vārija` ở đây là đầy vết nhơ (đi cặp với `anaṅgaṇa` ở `:5.1`), không phải hoa sen như sn9.14; người nói là số ít (`:7.1` `upajīvāmi`, không phải `upajīvāma` như sn9.14:8.1); `:3.1` hỏi ngược người nghe nên không có vế là trộm như sn9.14:4.4. Hai khoá lệch vì tiền lệ dịch sai theo Pāli: `:4.1` `ākiṇṇaluddo` là kẻ bị mùi hương mê hoặc, không phải kẻ thô lỗ tàn ác; `:4.2` `dhāticela` là mảnh gỗ, không phải tấm khăn.
  Bất định ghi lại, không che: `Yoyaṁ` ở `:3.1` và `suggatin` ở `:7.4` giữ nguyên cách dịch của sn9.14 vì cùng câu kệ; `pāpassa` ở `:5.3` để nguyên nghĩa của điều ác.
  Thuật ngữ theo tiền lệ đếm được: `yakkha` → dạ-xoa (68 tiền lệ trong tầng kn), `bhikkhu` → Tỳ-kheo, `anaṅgaṇa` → vết nhơ, `abdhāta` → mây giông. Tên phẩm `Chakkanipāta` → Bộ Sáu Bài Kệ (11 tệp) và `Kharaputtavagga` → Phẩm Kharaputta (6 tệp, gần nhất là ja393 và ja394 ngay trước) lấy nguyên văn bản đã có. Tiêu đề Kinh Siṅghapuppha theo đúng tiền lệ Kinh Kharaputta, Kinh Kaṇḍarī; tên riêng Pāli có dấu phụ đã khai vào bộ nhớ tiến trình của `_hvi.py` đúng như tài liệu dặn.
  Cổng kỹ thuật chưa chạy vì agent dịch không được chạy lệnh npm. Coordinator chạy bốn lệnh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Sửa lan 2026-10-13 (accuracy fix; 1.1–7.1 đổi, 2.3–2.4 và 7.2–8.1 giữ nguyên). Mục này THAY các lập luận cũ ở trên rằng vārija là «đầy vết nhơ», ākiṇṇaluddo là «kẻ bị mùi hương mê hoặc» và dhāticela là «mảnh gỗ»: cả ba sai (vārija = mọc dưới nước, như sn9.14:2.1 và mnd9:97.2; dhāticela = tấm vải của người vú nuôi, như ja438:2.2). Trước → sau: 1.1–1.4 «Ngươi đang ngửi đóa hoa này đầy vết nhơ, / vốn chẳng phải của ngươi; / Chỉ vì cái mùi ấy thô, / ngài là kẻ trộm hương» → «Đóa hoa mọc dưới nước này / chưa được cho, ngươi đã ngửi nó; / Đó là một yếu tố của trộm cắp, / này ngài, ngươi là kẻ trộm hương» (như sn9.14:2.1–2.4); 2.1–2.2 «Ta không lấy, không ăn, / ta chỉ ngửi đóa hoa đầy vết nhơ từ xa» → «Ta không lấy, cũng không bẻ gãy, / từ xa ta ngửi đóa hoa mọc dưới nước» (bhañjāmi = bẻ gãy, không phải «ăn»); 3.1–3.4 «Kẻ nào đào củ sen hàng nghìn / mà chỉ ăn củ sen trắng; Kẻ hành động thô bạo như vậy…» → «Kẻ nào đào củ sen, / bẻ các đóa sen trắng, / với hành động thô bạo như vậy, / tại sao kẻ ấy lại không bị gọi như thế?» (không có «hàng nghìn», bhañjati = bẻ); 4.1–4.4 «Kẻ bị mùi hương mê hoặc, / như một mảnh gỗ được quét vôi; / Về kẻ ấy ta không có lời nào để nói, / kẻ ấy thì xứng đáng để ta nói chuyện» → «Người đàn ông thô bạo, tàn nhẫn, / bị vấy bẩn như tấm vải của người vú nuôi; / Với kẻ ấy, ta không có lời nào để nói, / còn với ngươi thì ta nên nói» (ākiṇṇaluddo puriso = người đàn ông thô bạo, tàn nhẫn (cùng hướng ja438:2.1 «đầy tàn ác»); dhāticelaṁva makkhito dùng đúng cách dịch ja438:2.2; tañcārahāmi: taṁ là «ngươi», như tvañcārahāmi ở sn9.14:5.4, nên «xứng đáng nói» thuộc về ngươi chứ không phải kẻ kia); 5.1–5.4 «luôn tìm cầu thức lành thơm… cũng thấy to như đám mây giông» → «luôn tìm cầu sự thanh tịnh, … cũng hiện ra to như một đám mây» (sucigavesino = tìm cầu sự thanh tịnh; không có «thơm», không có «giông»); 6.1–6.4 «ngươi biết ta từ lâu rồi, giờ hãy thương xót ta… hãy nói lại» → «quả thật ngươi biết ta, / và ngươi thương xót ta; / lần nữa hãy nói với ta, / khi ngươi thấy điều tương tự như thế» (addhā = quả thật, không có «từ lâu»; anukampasi hiện tại); 7.1 «Ta không sống nhờ điều ấy» → «Ta không sống nhờ ngươi» (taṁ là «ngươi»). Giữ nguyên: 2.3–2.4 (đúng tiền lệ ja394:1.3, ja540, ja458: «Thế nhưng vì cớ sao»), 7.2–7.4 (khớp sn9.14:8.2–8.4; bhataka có thể sát hơn là «kẻ làm thuê», yena gaccheyya suggatiṁ là «nhờ đó đi đến cõi lành», không phải «con đường» — cả hai là tiền lệ chung với sn9.14, ngoài phạm vi). Bất định: 1.3 ekaṅgaṁ theyyānaṁ dịch «một yếu tố của trộm cắp» như sn9.14:2.3; 4.4 arahāmi vattave đọc «ta nên nói (với ngươi)». Số Pāli: không có. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại; technical_integrity giữ nguyên.
