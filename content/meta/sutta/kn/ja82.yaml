notes: |-
  Tiền lệ đếm được: `ramaṇa` → đạo sĩ (209 tiền lệ); `mokkha` → giải thoát (2.057 tiền lệ); `vāsin`/nuốt đá là hành động, giữ nguyên; `sadāmatta` dịch rối loạn (0 tiền lệ đúng chữ, `matta` hiếm; dùng cặp ngu dại + rối loạn để giữ hai chữ `dūbhaka` và `sadāmatta`).
  Cowell 82 kể chuyện vua chư thiên đeo đá đầu làm hình phạt một tỳ-kheo cứng đầu, và bản Cowell dịch bộ vế KHÁC (No more to dwell in island palaces…). Bộ vế ở Pāli root tôi dịch theo chữ.
  BẤT ĐỊNH thật sự: (a) 1.1–1.2 `Atikkamma ramaṇakaṁ, sadāmattañca dūbhakaṁ` không có chủ ngữ rõ ràng — tôi hiểu là đã vượt qua vị đạo sĩ, vượt qua kẻ ngu dại lúc nào cũng rối loạn, và ghi rõ đây là cách đọc của tôi; (b) 1.3 `Svāsi` không tách được, tôi hiểu là tôi ở cùng kẻ nuốt đá, và `yasmā` ở 1.4 là lý do chứ không phải chủ ngữ (người thứ hai), nên dịch bằng nên. Vì hai chỗ này cùng nằm trên cùng một vế kệ và không có tầng Anh nào để phá vỡ, tôi hạ cả grammar_logic và ambiguity_integrity.
  Tiêu đề giữ tên `Mittavindaka` theo tiền lệ Kinh Mitacintī / Kinh Udañcanī; chữ Mittavindaka là tiếng Việt không dấu nên không gặp ràng buộc Pāli-lọt.
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. 0.1 Jātaka giữ nguyên (58 bài đã có) và 0.2 Ekakanipāta → Bộ Một Bài Kinh (57 bài) theo tiền lệ đếm được. 1.1 mở nháy kép, 1.4 đóng nháy kép + dấu chấm, không giữ `ti.` (tiền lệ 51/57 bài; 10 bài mới hơn cũng bỏ). Dòng kết 2.1 dùng dấu phẩy (Kinh X, thứ N) theo làn sóng gần nhất ja108…ja119; kho còn 48 bài không dấu phẩy — ghi ở đây để biên tập chuẩn hoá sau, tôi không sửa bài ngoài lát. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Chú giải Jātaka-aṭṭhakathā bằng Pāli không truy cập được trong môi trường dịch này, nên bối cảnh lấy từ truyện E. B. Cowell, The Jātaka vol. I (bản 1895, tải từ archive.org); đây là lý do triangulation không lên cao. technical_integrity 10.0 căn cứ chốt _hvi.py đã pass và tự chạy lại script kiểm bổ sung (9/9 khoá khớp Pāli, NFC, ngoặc kép cân trên cả bài, không lệch dấu lược); npm run validate|test|build không chạy theo lệnh cấm của lát.
