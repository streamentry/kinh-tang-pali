notes: |-
  Tiền lệ: khung tiêu đề như ja131; udaka → nước; thala → cạn;
  ubhatobhaṭṭha là ubhato (cả hai bề) + bhaṭṭha (hư hỏng, rơi rớt), 0 tiền lệ nên
  đặt tên Kinh Hỏng Cả Hai Bề và ghi mới.
  Bất định: 1.1 akkhī bhinnā (mắt hỏng) là cách đọc theo chữ; bhaṇḍanaṁ là cãi nhau
  trong nhà bạn (sakhigehe, định vị cách). Kệ là lời than của người mất cả chì lẫn
  chài, bản Việt không thêm lời bình vào thân kinh.
  Thiếu tầng Anh nên triangulation chỉ 7.0 và bài ở draft.
