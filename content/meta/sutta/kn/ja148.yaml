notes: |-
  Đủ 9/9 khóa. Đây là Kinh Chó Rừng thứ hai cùng tên Siṅgālajātaka với ja142
  (ja142 là thứ hai, bài này là thứ tám); giữ cùng tên bài cho trung thực,
  phân biệt bằng số thứ tự. Phủ định na đầu bài chi phối động từ pavekkhāmi
  ở 1.3 nên cả ba vế phủ định cùng dồn vào một động từ: sẽ không chui vào
  thân voi nữa (pavisati → chui vào; đọc ti là bỏ ở thân kinh theo tiền lệ
  ja1 cùng Bộ Một).
  bondi 0 tiền lệ: dịch là thân (cách đọc khác là xác); nếu truyện là chó
  rừng mắc kẹt trong xác voi thì xác đúng hơn, chưa kiểm được truyện nên
  giữ thân và ghi nhận. Sujato trống cả 9 khóa → Pāli đơn tuyến, draft.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code), kiểm lại toàn bài từ Pāli): sửa 1.1–1.3 để
  phủ định nāhaṁ chi phối rõ pavekkhāmi (bản cũ "ta chui vào thân voi" để mất chữ không); chỉnh diễn
  đạt, không đổi điểm. bondi vẫn bất định (thân/xác).

  Quyết định hội đồng biên tập 2026-10-16: C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
