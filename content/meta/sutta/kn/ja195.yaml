notes: |-
  Lát v7/7: 12 bài Jātaka Ekakanipāta (Dūkaṇipāta), 156 khoá, dịch đủ MỌI khoá
  trong `all` của v7/v7.json. Đã đọc HẾT v7/p7.txt trước khi viết.

  **Sàn coverage 80% KHÔNG kích hoạt — nhưng ô Anh trống KHÔNG phải sự đồng
  thuận.** Đo được: mọi vế kệ của Ekakanipāta đều NGẮN HƠN 40 ký tự (156 khoá,
  `substantiveSegments = 0`), nên `englishCoverageFor` cho `ratio = 1` và bài
  không cần entry trong `content/meta/reference-gaps.yaml`. Hệ quả thật: hàm
  `kiểm()` của `_hvi.py` lọc `cần = [k for k in p if len(p[k]) >= 40 …]` nên
  `cần` RỖNG ở cả 12 bài, và **NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu
  lược không tự chạy**. Tôi đã tự kiểm thủ công đủ 156 khoá bằng một lớp kiểm
  riêng áp đúng các quy tắc đó lên MỌI khoá (0 lỗi), và đọc đối kháng từng cặp
  Pāli ↔ Việt. Tầng Việt tham khảo (Hòa thượng Thích Minh Châu) ở commit đã
  ghim chỉ có Pháp Cú, nên không có bản Việt nào để đối chiếu cho 12 bài này —
  đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho.

  **Dấu lược:** không khoá nào trong 12 bài có `…pe…` hay `…`, nên cả hai phía
  đều 0. Không mở rộng, không thêm, không bớt.

  **Ngoại lệ đã đo, không phải lỗi:** khoá `:0.1` = `Jātaka` trùng nguyên văn
  Pāli ở **128/128** tệp `kn/ja*` có cả hai khoá (đếm bằng script, không suy đoán).
  Tôi giữ nguyên theo đúng tiền lệ ấy và nêu ở đây.

  **Thiếu tầng Anh:** xem `blocking_errors`. Chỗ nào Sujato im lặng thì tôi dịch
  từ Pāli; ô Anh trống ở đây KHÔNG được đọc là đồng thuận về cách dịch.
  **Sửa sau review đối kháng — `pokkharaṇī` là ao sen, không phải thân rắn.**
  Bản nháp đầu tôi dịch `jātā pokkharaṇī sivā` thành "có thân trơn truôn, dáng
  dấp đẹp đẽ", tức tôi đã đọc `pokkharaṇī` như một tính từ mô tả con vật. Đối
  chiếu lại thì sai: Sujato dịch "lotus pond" ở `sn13.2:1.2`, `mn119:30.1`,
  `an5.162:7.2`, `dn3:1.15.10`; cùng cụm `jātā pokkharaṇī sivā` còn xuất hiện
  nguyên văn ở `ja535:72.2`, ngay cạnh `Akakkasā apabbhārā` (không lỗi lầm, không
  sơ hở) — nghĩa là hồ sen. Tiền lệ Việt đã publish của kho là **"hồ sen"**
  (72 lần, "ao" chỉ 4), nên tôi dùng "hồ sen".

  **Bất định còn lại, đã phân xử và ghi lại:** `Taṁ` ở `1.3` là gì. Nếu quay lại
  `pokkharaṇī` (cái hồ sen) thì `siṅgālo` không đem lời trách được với một cái
  hồ; nếu quay lại chủ thể của `1.1` (kẻ lang thang núi) thì câu văn chạy và
  đúng logic truyện. Tôi chọn cách thứ hai, và vì thế dịch `1.1` là "Trong khu
  rừng núi của kẻ lang thang" để chủ thể đó hiện ra ngay. Người biên tập nên xem
  lại nếu muốn bám theo cách đọc kia.

  **`siṅgāla` giữ nguyên Pāli:** từ điển cho hai nghĩa (chồn hôi / khỉ) và câu
  kệ không nói rõ loài nào, nên tôi không tự chọn. Giữ Pāli có tiền lệ mạnh:
  `Nigrodha` (58 lần), `Rādha` (138), `Mahāsudassana` (53), `Sākha` (2).

  **Tiêu đề `Pabbatūpattharajātaka`:** dịch theo nghĩa chữ ("kẻ lang thang
  núi") vì đây là tên riêng không quen thuộc, và tầng Việt chưa có tiền lệ nào
  cho tên này.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja195:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja195:0.3` mang Pāli `Ruhakavagga` được
  đổi *«Phẩm Thằn Lằn»* → *«Phẩm Dây Leo»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  tầng tên **không có** mục này; quyết bằng song ngữ Pāli **trong chính phẩm** — `ja191:1.1–1.3`: `"Api ruhaka chinnāpi, / jiyā sandhīyate puna;"` (dây bị cắt, sợi dây vẫn ghép lại), và bản Việt đã có *"Dây cung … sợi dây …"*. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  Lượt cải thiện 2026-10-13: ĐÁNH GIÁ LẠI TOÀN BÀI, và các đoạn ghi chú cũ ở trên
  về `siṅgāla` giữ Pāli, về `Taṁ`/chủ thể "kẻ lang thang" và về tiêu đề "Kẻ Lang
  Thang Núi" bị THAY THẾ bởi mục này; phần còn lại (hồ sen, Dukanipāta, Ruhakavagga)
  giữ nguyên. Đọc đối kháng từng khoá phát hiện bản trước sai nặng ở cả hai kệ:
  - `1.1` (và `0.4`, `3.1`): `pabbatūpatthare` là định ngữ vị trí "trên thảm/nền núi"
    (`pabbata` núi + `upatthara` cái trải ra), KHÔNG có từ nào nghĩa "kẻ lang thang".
    Sửa "Trong khu rừng núi của kẻ lang thang" → "Trên thảm núi xinh đẹp"; tiêu đề
    "Kinh Kẻ Lang Thang Núi" → "Kinh Thảm Núi".
  - `1.2`: `jātā pokkharaṇī sivā` = một hồ sen (hiện có/đã có), `sivā` tốt lành. "mọc lên
    … đẹp đẽ" → "có một hồ sen tốt lành".
  - `1.3`: `Taṁ siṅgālo apāpāyi` — `Taṁ` là cái hồ, `apāpāyi` là thể quá khứ của `pivati`
    "uống" (cùng gốc `apāyi` ở dn16:4.25.8, ja150:7.3; `apa-` chỉ làm đủ vần), KHÔNG
    phải "trách mắng". Sửa "kẻ siṅgāla đã trách mắng nó" → "con chó rừng đã uống nước hồ
    ấy". `siṅgāla` dịch "chó rừng" theo tiền lệ của tầng (đa số các khoá `kn/ja*`);
    bản trước giữ Pāli vì ngờ nghĩa — nay bỏ lý do đó, vì tiền lệ đã rõ.
  - `1.4`: `jānaṁ` (chủ cách) = chó rừng biết; `sīhena rakkhitaṁ` bổ nghĩa cho hồ.
    Bỏ "vì" thêm vào: "vì biết rõ nó đã có sư tử canh giữ" → "biết nó được sư tử canh giữ".
  - `2.1–2.2`: `Pivanti ce … sāpadāni mahānadiṁ` = "nếu các thú hoang uống (nước) sông
    lớn". Bản trước hiểu `pivanti` như "chảy" và `sāpadāni` như "những con sông" —
    sai hẳn. Nay: "Tâu đại vương, nếu có uống nước, / các thú hoang ở sông lớn"
    (`Tâu đại vương` theo tiền lệ đa số: 143 + 133 khoá ở `kn/ja*`, "bậc đại vương" chỉ 10).
  - `2.3`: `na tena anadī hoti` = vì thế nó không thành "chẳng phải sông"; bản trước
    "không làm cho ngừng dòng chảy" làm lệch nghĩa. Sửa theo chữ.
  - `2.4`: `khamassu yadi te piyā` = "xin hãy tha thứ, nếu (họ) là người ngài yêu quý". Bản
    trước "nếu chúng là điều ngươi quý" sai đối tượng và sai sắc thái ("ngươi").
  Tổng cộng đổi 10/13 khoá (`0.4`, `1.1–1.4`, `2.1–2.4`, `3.1`); `0.1–0.3` giữ.
  Điểm: semantic_fidelity 8.7 → 8.9 và grammar_logic 8.8 → 9.0 vì hai kệ nay đúng chủ
  thể, động từ và phủ định; terminology 9 → 9.2 vì `siṅgāla`, `hồ sen`, `sông lớn`,
  `tha thứ`, `Tâu đại vương` đều theo đa số; segment_alignment 10 → 9.8 vì `2.1–2.2`
  phải dịch chuyển chủ ngữ `sāpadāni` sang dòng sau (đã đo: không lệch ranh khoá, nhưng
  trật tự khác Pāli); vietnamese_clarity 9.2 → 9.0 vì hai kệ vẫn cô đọng, "chẳng phải
  sông" hơi gượng. Các điểm khác giữ. Điểm cũ của bản trước đã quá cao so với chất
  lượng thật của nó.
  Căn cứ ngữ cảnh (ngoài kho, chỉ để hiểu, không chép câu chữ): chú giải Jātaka (bản
  ancient-buddhist-texts.net, Ja 195) kể vua Brahmadatta hỏi vị đại thần về một triều
  thần và một phụ nữ trong cung có quan hệ với nhau; kệ 1 là lời vua (`pokkharaṇī` ẩn dụ
  người phụ nữ, `siṅgāla` ẩn dụ người kia, `sīha` là nhà vua), kệ 2 là lời vị đại thần
  (Bồ-tát). Kinh văn Pāli của bài KHÔNG nói điều đó nên tôi không đưa ẩn dụ hay người nói
  vào bản dịch. Căn cứ này không phải tầng đã ghim và không độc lập với bản Anh, nên
  `triangulation` giữ 7.
  BẤT ĐỊNH CÒN LẠI (không phân xử được, giữ nguyên): (1) `mahānadiṁ` — "sông lớn" theo
  chữ; chú giải đọc `nadī` là ao nước đứng vì sen không mọc trong sông chảy, nhưng đó là
  cách đọc hậu kỳ, nên giữ "sông" ; (2) `piyā` (dạng số nhiều hoặc giống cái) không có
  chủ ngữ rõ trong kệ, nên dịch bỏ chủ ngữ ("nếu ngài yêu quý") và không chọn "họ"/"nàng";
  (3) nghĩa chính xác của `upatthara` ở tiêu đề (chú giải: vùng đất trải rộng dưới chân
  núi) — "thảm núi" là dịch theo chữ, chưa có tiền lệ trong kho; (4) `jānaṁ` ở `1.4` có thể
  gồm sắc thái "dù biết" nhưng Pāli không có liên từ nên không thêm. `technical_integrity`
  giữ 9.6; chưa chạy bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Sửa lan 2026-10-13: khoá `ja195:0.3` (`Ruhakavagga`): *Phẩm Dây Leo* → *Phẩm Ruhaka*. Căn cứ: bài đầu của phẩm là `ja191` `Ruhakajātaka`, tên bài đã dịch *Kinh Ruhaka* (tên riêng) và `ja191:1.1` đọc `ruhaka` là hô ngữ *Này Ruhaka*; còn `jiyā` ở `ja191:1.2` là *dây cung*, không phải cây leo, nên nghĩa *dây leo* cho `ruhaka` không có căn cứ trong Pāli. Tiền lệ: phẩm Jātaka đặt theo tên riêng của bài đầu phẩm giữ nguyên Pāli (*Phẩm Cūḷakuṇāla*, *Phẩm Gandhāra*, *Phẩm Soṇaka*, *Phẩm Kāliṅga*…). BẤT ĐỊNH: nghĩa của `ruhaka` không phân xử được từ tầng Pāli đã ghim (không có bản Anh), nên chọn phiên âm để không khẳng định nghĩa. Ngoài lát này, `ja191`, `ja199`, `ja200` vẫn *Phẩm Dây Leo* (và `ja200:3.2` ghi *Phẩm Thằn Lằn*) — cần thống nhất.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 4 khoá chênh lệch lớn nhất (`0.4`, `2.2`, `2.3`, `3.1`) → khác nghĩa 0, còn lại là khác diễn đạt hoặc chủ thể chưa hiện rõ: sửa 1 (`2.3`: “vì thế, nó không thành chẳng phải sông” → “vì thế, sông ấy không thành chẳng phải sông”; Pāli `na tena anadī hoti` không nêu chủ ngữ, mà dòng liền trước `2.2` có `sāpadāni` (các thú hoang) nên “nó” dễ bị đọc nhầm là thú hoang; chủ ngữ đúng là `mahānadiṁ` ở `2.2`; chỉ làm rõ chủ thể, không đổi nghĩa), giữ 3 (`0.4`, `3.1`: bản mù dịch “Chuyện Tiền Thân …”, chỉ khác khuôn tiêu đề “Kinh …” của các bài cùng phẩm; `2.2`: bản mù đặt `mahānadiṁ` làm tân ngữ trực tiếp của “uống”, đúng ngữ pháp đối cách và cùng nghĩa với “uống nước … ở sông lớn”), bất định 0 mới (các bất định đã ghi ở trên, gồm `mahānadiṁ`, chủ ngữ của `piyā`, `upatthara`, cũng là chỗ bản mù không phân xử được). Chín khoá còn lại hai bản hội tụ về nghĩa; đã đọc lại đối kháng cặp Pāli↔Việt cả 13/13 khoá: nháy `“”` khớp Pāli từng khoá, không dấu lược, không số lượng. Không có bản Anh hay bản Việt độc lập khác. `triangulation` 7,0 → 7,7: có một lần dịch lại độc lập, hội tụ cả 13 khoá, nhưng cùng họ công cụ nên không quá 8,0. Điểm khác giữ nguyên. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này; `technical_integrity` 9,6.

  Lượt rà soát 2026-10-15 (kiểm toán Jātaka chỉ có Pāli, Claude Sonnet 5.5 (Claude Code)). Sửa 2.1–2.2
  (cú pháp sāpadāni mahānadiṁ pivanti: thú dữ uống nước sông lớn) và 2.4 (piyā là dạng nữ tính, "nếu
  nàng được ngài yêu quý"). Chữ Pāli ghim giữ nguyên, không emend; không có bản Anh Sujato để đối
  chiếu thêm.
