notes: |-
  **Sửa lỗi hậu xuất bản (2026-10-04) — lỗi phát hiện SAU khi bài đã được chấm và xuất
  bản.** Ký hiệu lược `…pe…` của bilara lọt nguyên văn vào bản Việt ở **1 khoá**. `…pe…`
  là **ký hiệu lược**, không phải chữ; quy ước kho là giữ **đúng MỘT** `…`. Ở **1 khoá**
  Pāli ghim **có** dấu lược nên chỉ rút cụm còn một `…`, nghĩa không đổi: `snp3.10:6.2`.

  `final_score` tính lại bằng script (trung bình số học thô của đúng 10 tiêu chí),
  `assessed_at` cập nhật. Đây là sửa lỗi kỹ thuật/thuật ngữ ở mức khoá, không phải biên
  dịch lại bài; không blocker, trạng thái giữ nguyên theo quality gate.

    **Vì sao lượt chấm lại này không ghi tên công cụ vào `assessed_by`.** Tệp này ghi
    `ChatGPT (OpenAI)` trong `translators`, và `AGENTS.md` cùng
    `tests/unit/tooling.test.ts` chốt rằng **tệp ghi công cụ đã làm ra nó thì không được
    gán lại công cụ sau** — đó là bảo vệ lịch sử biên tập, không phải hình thức. Nên lượt rà
    soát này chỉ ghi ở `notes`: đã chấm lại điểm, đã tìm ra lỗi, đã sửa. Bản gốc của
    `assessed_by` giữ nguyên.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 8.3–8.11 — «hai mươi kiếp ở địa ngục X bằng một
  kiếp ở địa ngục Y» → «ví như hai mươi địa ngục X bằng một địa ngục Y», vì Pāli (vīsati … nirayā
  evameko … nirayo) không có «kiếp» và có seyyathāpi; cùng công thức ở an10.89, sn6.10, ne37 giữ
  nguyên dạng tên địa ngục, nên Kumuda, Sogandhika, Uppalaka, Puṇḍarīka, Paduma thay cho «Hoa Sen
  Vàng / Sen Thơm / Sen Xanh / Sen Trắng / Hoa Sen Hồng»; để cả bài nhất quán, «Hoa Sen Hồng» →
  «Paduma» cũng được đổi ở khoá 4.5, 5.3, 7.2, 7.3, 8.12, 29.2 và bỏ «kiếp sống» ở khoá 8.2; khoá
  3.3 — «là chỗ nương tựa của con» → «đáng tin cậy, đáng được tin tưởng» (saddhāyiko paccayiko);
  giữ nguyên khoá 5.5 vì «Đức Thế Tôn» và cách nối với khoá 5.4 theo mạch của bài.
