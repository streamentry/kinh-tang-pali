notes: |-
  Dịch trọn 113 khoá trực tiếp từ Pāli root; không có bản Anh của Sujato, không có lớp english-project và không có tầng vietnamese-current cho tha-ap533 tại commit đã ghim. Bản Việt nguyên bài của Bhikkhu Indacanda trên SuttaCentral (mục tra cứu toàn văn, không phải tầng store, không căn lề theo segment) chỉ được đọc để kiểm cách hiểu ở những chỗ khó; câu chữ bản dịch này viết từ Pāli, và ở các chỗ bất định dưới đây có khác bản đó. Vì vậy không tuyên bố đã đối chiếu độc lập một bản tham khảo nào.
  Tiền lệ đã đo trên tầng tha-ap (tính cả các bài khác trong tầng): 28 khoá của bài có Pāli trùng nguyên văn với bài khác, tổng 2695 cặp đã dò; cả 28 khoá đều dùng lại một bản Việt đã có (1836 cặp giống hệt bản chọn, 859 cặp khác, chủ yếu do ngôi kể tôi so với ta và các biến thể diễn đạt). Lựa chọn theo đa số phạm vi gần nhất (tha-ap480 đến tha-ap560): Therāpadāna 496/507 toàn tầng; Đức Chiến Thắng tên Padumuttara 13/14; Vào một trăm ngàn kiếp trước đây 4/8 (nhóm tha-ap480 đến tha-ap560; toàn tầng nhóm Vào một trăm ngàn đại kiếp trước có 26 so với 7, nhưng Pāli của bài này không có chữ mahā nên không thêm đại); Ta không còn biết đến đọa xứ 18/48 gần và 58 toàn tầng; Các phiền não của ta đã được thiêu rụi 34/55 gần; ta sống không còn lậu hoặc 35/56 gần; Thật lành thay sự đến của ta 32/55 gần; đã làm tròn lời dạy của Đức Phật 43/55 gần; Bốn vô ngại giải 55/55 gần (493/506 toàn tầng); Ta lưu chuyển trong hai cõi hữu và Ta sinh vào hai dòng tộc 1 mỗi dạng ở gần; Và nay, trong đời cuối cùng 3/3; đây là quả báo của việc cúng dường Đức Phật 4/8 gần; khi ta làm thiện nghiệp ấy 15 toàn tầng (gần nhất có bản dùng tôi và việc thiện lành, không đổi nghĩa). Ngôi kể dùng ta theo đa số gần nhất (tha-ap526, tha-ap531). Lời kết 28.1 dùng nhóm nói những bài kệ này (số nhiều, theo imā gāthāyo; nhóm số ít là lỗi đã gặp ở nhiều lát). Pāli trùng nguyên văn trong chính bài: nhóm 17.4, 18.4, 19.4 (3 khoá, 3 cặp) có bản Việt giống hệt nhau; cặp 26.4 và 27.4 chỉ khác nhau đúng ở nháy kép đóng theo Pāli; 0 cặp lệch ngoài chỗ Pāli khác nhau.
  :0.3 trong Pāli bắt đầu bằng số (1 Mahākaccāyanattheraapadāna) nên bản Việt giữ số thứ tự theo hình thức N. ; translationTitle bằng đúng giá trị :0.3. Tên bài theo kiểu Ký Sự Về Trưởng Lão: ở tha-ap500 đến tha-ap531 dạng này 15 so với Bài Kệ Tuyên Ngợ 13 (và 1 Tuyên Ngợi), ở tha-ap520 đến tha-ap531 là 7 so với 4; toàn tầng thì Bài Kệ Tuyên Ngợ 242, Bài Kệ Tuyên Ngôn 134, Ký Sự 116 (có chữ Ngợ là lỗi chính tả đã biết, không dùng). Hai phạm vi cho đa số khác nhau, người biên tập nên phán một lượt cho cả cuốn. Tên phẩm Kaccāyanavagga là phẩm đầu tiên của nhóm này, chưa có tiền lệ cùng phẩm; giữ nguyên tên Pāli theo kiểu Phẩm Bhikkhadāyi, Phẩm Mahāparivāra, Phẩm Sereyya.
  Tên riêng bám Pāli từng khoá: Mahākaccāyana ở :0.3, 28.1, 29.1 và Kaccāyana ở 8.4 (đúng chữ Pāli của các khoá đó); Kaccāna ở 14.1, 15.3, 21.4. Trong tầng Việt các dạng này đều có mặt (Mahākaccāna 180, Kaccāna 173, Kaccāyana 21, Mahākaccāyana 17); không ép thống nhất vì Pāli trong cùng bài đã dùng cả hai dạng. Thuật ngữ đã đo: Padumuttara 100 chỗ; Himavanta 66 (Tuyết Sơn 8); Đại Ẩn Sĩ 59 cho mahāmuni; Đấng Thiện Thệ 9 và bậc Thiện Thệ 8; Sát-đế-lợi 35, Bà-la-môn 37; tỳ-kheo 66; Vệ-đà (có hai dạng Vệ-đà và Vệ Đà, mỗi dạng 2, dạng thông suốt Vệ-đà đã có tiền lệ cho vedapāragū); đa văn 2 (nghe nhiều 0); bất tử 20 (Bất Tử 0); cảnh giới 42; bốn sự thật 4 so với bốn chân lý 2; thọ ký cho byākāsi/byākato theo lời thọ ký tối thắng đã có (byākaraṇaṁ), dạng giảng giải chỉ có 1 tiền lệ cho byākāsi nhưng là cách hiểu hẹp; đạo sĩ khổ hạnh cho tāpaso có 1 tiền lệ đúng chữ.
  Dấu ngoặc: kép mở ở 1.1 và đóng ở 27.4; nháy đơn mở ở 8.1 và đóng ở 9.4, mở ở 12.1 và đóng ở 13.4; khớp Pāli từng khoá, 0 lệch trên 113 khoá. Pāli của bài không có dấu lược … và không có (…) trần; bản Việt cũng không có. Đối chiếu 113 khoá: đủ khoá, đúng thứ tự, NFC sạch, 0 khoá rỗng. Dấu chấm câu cuối khoá khớp Pāli ở mọi khoá, riêng 11.4 dùng dấu hai chấm trước lời thọ ký (Pāli kết bằng dấu chấm), theo tiền lệ đã có.
  Số Pāli: satasahasse kappānaṁ ở 1.3 và satasahassito kappe ở 17.1 đều là sata 100 nhân sahassa 1000, bằng 100.000 kiếp, dịch một trăm ngàn kiếp; duve ở 18.1 và 19.1 là 2; tisso ở 26.3 là 3; catasso ở 27.1 là 4; aṭṭhime ở 27.2 là 8; chaḷa trong chaḷabhiññā là 6; sattahi ở 23.4 là 7 (sesehi saha sattahi, cùng với bảy vị còn lại); paṭhamaṁ ở 29.1 là thứ nhất. Không có cụm tiṁsakappasahassa trong bài, nên không cần phân xử.
  Lời thọ ký tương lai (14.3 đến 16.4) chỉ có anāgatamhi addhāne và hessati/pāpuṇissati, không có số kiếp, nên dịch thời vị lai và sẽ.
  Bất định và lựa chọn cần người biên tập lưu ý: (1) anejo ở 1.2 dịch không dao động (eja có thể hiểu là dục vọng); ajitaṁ jayo đọc ajitaṁ là tính từ của jayo, dịch có chiến thắng không bị đánh bại; một cách hiểu khác là thắng điều chưa ai thắng. (2) sabbavākyapathātīto ở 3.3 dịch vượt khỏi mọi con đường của ngôn từ, giữ sát chữ; vākya cũng có thể hiểu là lời chê trách. (3) santāna ở 4.3 dịch dòng tương tục, không thêm chữ tâm. (4) raṇañjaho ở 11.4 dịch dứt bỏ lỗi lầm (raṇa là lỗi hoặc cấu uế); raṇa còn có nghĩa chiến trận, tầng chưa có tiền lệ để phân xử. (5) uggahadayaṁ ở 13.3 đọc là ugga cộng hadaya, dịch có tâm cao quý; dạng này chưa có tiền lệ trong tầng và bản Việt nguyên bài đọc khác (hiểu thành thân hình cao quý), cần người biên tập phán. (6) purohitadijādhino ở 20.4 và Pajjotassa ca caṇḍassa ở 20.3 ngữ pháp mơ hồ: bản dịch giữ độ mờ, không thêm chữ vua hay gán rõ ai là tế sư; không rõ của Pajjota bổ nghĩa cho thành Ujjenī hay cho vị Bà-la-môn. (7) 14.3 đến 14.4 anāgatamhi addhāne gotamassa mahāmune dịch vào thời vị lai của Gotama, giữ sở hữu cách của Pāli. (8) mune ở 16.2 hiểu là sở hữu cách, bậc Ẩn Sĩ chỉ Đức Phật. (9) tasmātadagge ở 9.3 hiểu là etadagge, vị thế tối thắng ấy. (10) kammaṁ ở 17.2 dịch thiện nghiệp theo tiền lệ 15 khoá; Pāli chỉ nói việc làm, nhưng ngữ cảnh là buddhapūjā. (11) pakāsayaṁ ở 8.2 thêm vị ấy làm chủ ngữ, vì phân từ chủ cách nhắm tới Kaccāyana ở 8.4. (12) Chữ lông trên thân ở 12.3 cho loma (lông), và tướng ở 3.2 là các tướng tốt, theo tiền lệ có sẵn.
  Kiểm kỹ thuật chưa chạy trong lượt này: npm run validate, npm test, npm run check và npm run build; vì vậy technical_integrity đặt 9.6 và không tuyên bố technical gate đã pass.
