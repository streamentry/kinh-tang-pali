  BẢN NỮ CỦA pv43 — CẤU TRÚC GIỐNG HỆT, ĐÃ KIỂM BẰNG SỐ. Pāli của pv43 và pv44 có **25 cặp khoá trùng nguyên
  văn**; bản Việt của cả 25 cặp giống hệt nhau. Kiểm lại toàn lát bằng script: **0/47 cặp trùng bị dịch khác**.
  Chỗ Pāli **khác** giữa hai bài thì bản Việt mới khác, và khác đúng chỗ:
  - `ko nu dīno` / `kā nu dīnā` (1.2) → “kẻ khốn khó ấy” / “người khốn khó ấy”;
  - `petomhi` / `petīmhi` (2.1) và `duggato yamalokiko` / `duggatā yamalokikā` (2.2) — Pāli tự đã cho biết giới;
    bản Việt không cần chia đựng (“con là ma”, “sinh về cõi khổ xa xôi”), vì “con”, “người ấy” vốn không mang
    giới. Đây là chỗ **không** nên cố làm khác nhau;
  - `…gato”.` / `…gatā”ti.` (2.4) và (5.4) — pv43 mất `ti` ở 2.4, pv44 có `ti`; giữ nguyên theo Pāli.

  THUẬT NGỮ giống pv43 và cùng tiền lệ đếm được: `Petavatthu` giữ Pāli (1 cách duy nhất trong 11 nơi),
  `Mahāvagga` → “Đại Phẩm” (1 cách trong 19 nơi), `…petivatthu` → “Chuyện Ngạ Quỷ …”. Riêng tiêu đề `:0.3`
  là `petivatthu` (bản nữ) nên giữ nguyên hình thái “Ăn Dơ” như pv43 — hình thái nam/nữ là của Pāli, không
  phải của tiêu đề.

  BẤT ĐỊNH — cùng những chỗ đã ghi ở pv43, vì Pāli các câu ấy trùng nhau: `saddahase tuvaṃ` (1.4),
  `hadantañño` / `hadāmi` (8.1, 8.3), `duggatā yamalokikā` (2.2), `kissā kammavipākena` (3.3), `pecca gatiṃ`
  (6.4), `sīse tiṭṭhāmi matthake` (7.2). Xem `pv43.yaml` để có lý do từng chỗ.

  DẤU LƯỢC — bài này **không có** `…pe…`.

  Ngoặc kép cùng cấu trúc pv43; tự đếm lại: cân.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  LƯỢT CẢI THIỆN 2026-10-11 (kiểm toán độc lập, đọc đối kháng từng khoá với Pāli). Bản cũ tự chấm 9,05 nhưng có **15/33 khoá nội dung sai nghĩa thật** — lỗi lan từ pv43 (bài nam, Pāli trùng) và từ họ vv/pv. Đã sửa 24/36 khoá (33 khoá nội dung + 3 khoá tiêu đề/colophon không đổi). Phân loại lỗi cũ:
  - NGƯỜI NÓI / NGƯỜI ĐƯỢC GỌI (7): `1.2`, `1.3`, `1.4`, `3.4` đặt “bạch ngài” vào miệng vị tỳ-kheo hỏi và nói về ngạ quỷ ở ngôi thứ ba (“người ấy”), trong khi Pāli là vị tỳ-kheo hỏi thẳng ngạ quỷ nữ (`kā nu dīnā patiṭṭhasi`, `pāpakammantā`, `saddahase tuvaṁ`, `nigacchasī`) → nay “ngươi” theo khuôn pv13/pv33; `6.2` (`yo te āsi kulūpako`) “của bạch ngài” → “gia đình ngươi”; `8.1`/`8.4` (`hadantaññe`, `so upajīvati`) “thứ ngài thải ra”, “ngài ấy dùng” → “những kẻ khác thải ra”, “kẻ ấy sống nhờ”.
  - ĐẢO VAI / BỊA NGHĨA (4): `7.1`–`7.4` “ở lại ngay trước hiên nhà người ấy làm nô lệ”, “người ấy cũng đã chịu quả báo khổ đau”, “kẻ hầu hạ thì chính là con” — Pāli `sīse tiṭṭhāmi matthake … paravisayaṁ patto, mameva paricārako` nói ngược hẳn: ngạ quỷ nữ đứng trên đầu kẻ ấy, kẻ ấy sang lãnh địa khác và là kẻ hầu hạ của riêng cô.
  - TÂN NGỮ / QUY CHIẾU (2): `5.2` `bhikkhavo paribhāsisaṁ` (tân ngữ “các tỳ-kheo”) bị đọc thành “bạch ngài, con đã trở thành kẻ mắng nhiếc người khác”; `5.3` `tassa kammavipākena` (nghiệp ấy của chính cô) bị đọc thành “nghiệp người ấy”.
  - TỪ BỊ ĐỌC SAI (3, trùng lẫn nhóm trên): `4.1` `ahu` (aorist của `hoti`, “đã có”) bị coi là tên riêng “Ahu”; `4.4` `kadariyo paribhāsako` “tàn nhẫn” → “keo kiệt, hay mắng nhiếc” (pv19:7.2, pv38:22.4, pv38:35.4: 3/3 cùng Pāli); `1.3` `nissaṁsayaṁ` “không hề do dự” → “chắc chắn”.
  - NHẸ / KHUÔN: `2.1` `petīmhi` → “ngạ quỷ nữ” (pv13:2.1); `2.2` bỏ “xa xôi” (không có trong Pāli; `duggatā` = rơi vào cảnh khổ, theo pv13/pv19/pv27: 4 khoá, trong khi “sinh về cõi khổ xa xôi” có 7 khoá, đều là chép chéo giữa pv31/pv43/pv44/pv45 và không có nền Pāli); `4.2` thêm lại `kula-` (“xan tham với các gia đình”); `1.1` “bốc lên” → “trồi lên” (`uggantvā`); `6.3` bỏ “nhưng” không có trong Pāli; `6.1` “không phải bạn theo vẻ ngoài” → “không phải bạn mà có vẻ ngoài như bạn”; `6.4` “cõi nào” → “cảnh giới nào” (`gatiṁ`); `3.4`, `1.4`, `6.4` kết `?”` (129 so 45 khoá `?”.` ở đuôi `”ti.`).
  Giữ nguyên (đã đối chiếu): 0.1–0.3, `2.3`, `2.4`/`5.4` (`petalokaṁ ito gatā`: 25 khoá cùng “thế giới của người đã chết”, trái với pv19:2.4 “cõi ngạ quỷ”; giữ theo đa số), `3.1`–`3.3` (8 nơi cùng Pāli), `4.3`, `5.1` (chỉ đổi “người ấy” → “vị ấy” vì là vị tỳ-kheo; pv25:16.1 cùng khuôn), `8.2`, `8.3`, `9.1`. Pāli trùng trong bài: `2.4`=`5.4` → Việt giống nhau (1/1 cặp, 0 khác).
  Điểm: `semantic_fidelity` 9.0 → 8.8 và `vietnamese_clarity` 9.1 → 8.8 vì còn các chỗ chưa phân xử (bên dưới) và vài câu còn cứng (`7.1`–`7.2`, `4.1`); `segment_alignment` 10.0 → 9.8 (`7.1` đưa “với chính kẻ ác nghiệp ấy” tách vị trí động từ sang `7.2`); `terminology` 9.0 → 8.9; các điểm còn lại giữ. `final_score` 9.05 → 8.97: bản mới đúng nghĩa hơn bản cũ rất nhiều, nhưng điểm cũ không đứng vững dưới đọc đối kháng.
  BẤT ĐỊNH CÒN LẠI (không phân xử được, không bịa): (1) `1.4` `kiṁ nu saddahase tuvaṁ` — Pāli ghim đọc `saddahase` (“tin”), dịch sát là “ngươi tin vào điều gì vậy?”; bản Việt nguyên bài ở mục Tra cứu toàn văn hiểu như “gây tiếng ồn” (dạng `saddāyase` ở bản khác), tức câu có thể là lời trách hơn là câu hỏi về niềm tin — không đổi theo vì Pāli root là `saddahase`. (2) `4.1` `āvāsiko mayhaṁ`: “vị tỳ-kheo trú xứ của con” — thêm “tỳ-kheo” vì ngữ cảnh (`kulūpako`, `bhikkhavo`), Pāli chỉ nói “người ở trú xứ”; `mayhaṁ` có thể là “của con” hoặc “ở chỗ con”. (3) `4.3` `ajjhāsito`: dịch “đã cư ngụ”, có thể được hiểu là “bị dính mắc”. (4) `7.2` `sīse tiṭṭhāmi matthake`: dịch sát chữ “đứng trên đầu, trên đỉnh đầu”; không loại trừ nghĩa bóng “ở vị thế trên” . (5) `7.3` `paravisayaṁ`: “lãnh địa của kẻ khác” — chưa xác định có phải cõi ngạ quỷ nói chung. (6) Tiêu đề `0.3`/`9.1`: `gūtha` là phân (pv15:15.4, pv15:16.3, pv29:1.3 dịch “phân”), “Ăn Dơ” là cách nói giảm theo pv43; không đổi vì đã là khuôn tiêu đề của cặp pv43/pv44 và không làm sai nghĩa; có thể đổi cả hai cùng lúc về sau.
  NGOÀI PHẠM VI, CẦN XỬ LÝ: pv43 (Pāli trùng 25 khoá) còn nguyên các lỗi cũ (`1.2`–`1.4`, `3.4`, `4.1`, `4.4`, `5.2`, `5.3`, `6.2`, `7.1`–`7.4`, `8.1`, `8.4`); lỗi `3.4` “mà bạch ngài rơi vào khổ ấy” cũng có ở pv35:3.4 và `1.3`/`1.4` ở pv51:1.3 (`nissaṁsayaṁ pāpakammanto`); pv45:2.2 và pv31 còn “sinh về cõi khổ xa xôi”. Vì vậy câu ở phần “BẢN NỮ CỦA pv43 … 0/47 cặp trùng bị dịch khác” nay không còn đúng: pv44 đã khác pv43 ở các khoá trên, và cái đúng là pv44.
  `technical_integrity` giữ 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này; chỉ kiểm tập khoá, dấu lược, NFC, không Pāli lọt sang bản Việt, nháy cân theo Pāli từng khoá.
  LƯỢT CẢI THIỆN 2026-10-11 (lượt hai, đọc đối kháng lại từng khoá và đo tiền lệ bằng số đếm). Đã đổi 10/36 khoá; 26 khoá còn lại đã đối chiếu và giữ nguyên.
  - THUẬT NGỮ THEO TIỀN LỆ ĐẾM ĐƯỢC (6): `6.1` `amitto` “Kẻ không phải bạn mà có vẻ ngoài như bạn” → “Kẻ thù mang dáng bạn bè” (`amitta` được dịch “kẻ thù” ở đa số khoá đã đối chiếu: ja342, ja448, ja518 ×4, ja531, thig13.5 ×5; ngoại lệ duy nhất đã thấy là mil5.5.8:12.1 “phe địch”, ở dạng ghép `amittasaṅgha`); `4.2` `issukī kulamaccharī` “đố kỵ, xan tham với các gia đình” → “ganh tị, bỏn xẻn về các gia đình” (`issukī maccharī` = “ganh tị, bỏn xẻn/keo kiệt” ở pv15, ja382, mnd10, an6.36: 4/4; `kulamacchariya` = “keo kiệt về gia đình” 4/4 ở mnd2, mnd6, cnd5; chọn “bỏn xẻn” để không trùng “keo kiệt” của `kadariyo` ở `4.4`, vốn đã giữ nguyên vì 3/3 khoá cùng Pāli `kadariyo paribhāsako` ở pv19:7.2, pv38:22.4, pv38:35.4 dịch “keo kiệt, hay mắng nhiếc”); `0.3` và `9.1` `gūthakhādaka-` “Ăn Dơ” → “Ăn Phân” (`gūtha` = “phân” ở 6/6 khoá khác: pv15:15.4, pv39:9.1, vv52:11.1, thag20.1:6.1, thag20.1:8.4 và `1.1` “hố phân” của chính bài; “dơ” là nhẹ giọng, không có tiền lệ; cả `translationTitle` ở meta đổi theo); `2.4` và `5.4` `petalokaṁ ito gatā` “thế giới của người đã chết” → “cõi ngạ quỷ” (tầng chia gần đều: 13 khoá “thế giới của người đã chết” so 12 khoá “cõi ngạ quỷ”, nên không có đa số để bám; quyết định theo nhất quán trong bài, vì `2.1` đã gọi người nói là “ngạ quỷ nữ”, và “cõi ngạ quỷ” có cùng Pāli, cùng giới từ ở pv51:2.4, pv45:2.4). Đổi một thuật ngữ thì quét cả bài: `gūtha-` xuất hiện ở `0.3`, `1.1`, `9.1`; `petaloka-` ở `2.4`, `5.4`; không còn khoá nào lệch.
  - CÚ PHÁP / QUAN HỆ (3): `7.1` `Tassevāhaṁ pāpakammassa` “Với chính kẻ ác nghiệp ấy” → “Của chính kẻ ác nghiệp ấy” (`pāpakammassa` là sở hữu cách đi với `sīse … matthake` ở `7.2`, không phải “với”); `7.4` `mameva paricārako` “lại là kẻ hầu hạ” → “là kẻ hầu hạ” (Pāli chỉ có `ca … patto, mameva paricārako`, không có từ đối lập “lại”; `eva` đã thể hiện ở “của riêng con”); `1.2` `kā nu dīnā patiṭṭhasi` “mà đứng đó thảm thương” → “người thảm thương, đang đứng đó” (`dīnā` là từ xưng hô đứng riêng, không bổ nghĩa cho động từ `patiṭṭhasi`).
  - CÂU GƯỢNG (1): `6.2` `yo te āsi kulūpako` “kẻ đã từng thường lui tới gia đình ngươi” → “kẻ từng hay lui tới gia đình ngươi” (“đã từng thường” là ba trợ từ cho một `āsi`).
  Điểm đổi: `terminology` 8.9 → 9.0 (bốn nhóm thuật ngữ lệch tiền lệ đã sửa, nhưng `4.1` “trú xứ” và `7.3` “lãnh địa” vẫn là lựa chọn có căn cứ vừa phải); `semantic_fidelity` 8.8 → 8.9 (`7.1`, `7.4`, `6.1` sát Pāli hơn; còn bất định ở `1.4`, `4.3`, `7.2`, `7.3` nên không nâng thêm); `vietnamese_clarity` 8.8 → 8.9 (`1.2`, `6.2`, `7.1`, `7.4` gọn hơn; `1.4` vẫn là câu khó hiểu). Giữ nguyên các tiêu chí còn lại: `grammar_logic` 9.0 (chỉ chỉnh quan hệ ở `7.1` và `7.4`, không có lỗi mới); `ambiguity_integrity` 8.6 (bất định thật vẫn còn); `triangulation` 7.5 (vẫn không có bản Anh hay Việt hiện hành). `final_score` 8.97 → 9.00 — đúng bằng 9.0, nên vẫn `review`, chưa `published`.
  QUYẾT ĐỊNH KHÔNG ĐỔI DÙ NGHI: (a) `1.4` `kiṁ nu saddahase tuvaṁ` giữ “ngươi tin vào điều gì vậy?” theo Pāli đã ghim (`saddahase`); chỉ pv51:1.4 viết `saddāyase` (“kêu la”) và đó là bài khác. Chú ý: pv43:1.4 có đúng Pāli `saddahase` của bài này nhưng bản Việt hiện dịch “kêu la” theo `saddāyase` — hai bản Việt khác nhau ở cùng một câu Pāli, cần người biên tập phân xử cho cả hai bài; (b) `4.1` “trú xứ” giữ vì `āvāsiko bhikkhu` = “vị tỳ-kheo trú xứ” ở an5.232 và an5.237 (nhiều khoá), dù pv43:4.1 dịch “thường trú”; (c) `4.4` giữ “keo kiệt, hay mắng nhiếc” theo tiền lệ 3/3; (d) `2.2` “đã rơi vào cảnh khổ” giữ vì 5 khoá cùng Pāli (pv13, pv19, pv27 ×2) so với “khốn khổ” 2 khoá; (e) `7.3` “lãnh địa” giữ, không đổi sang “lãnh vực” (7 khoá ở mnd16 và sn47.7 nói về “nơi lui tới” của tỳ-kheo, khác nghĩa với `patto` “đã đến” một vùng đất).
  NGOÀI PHẠM VI, CẦN XỬ LÝ: pv43 còn `0.3`/`9.1` “Ăn Dơ”, `4.2` “đố kỵ, keo kiệt về các gia đình” (nay lệch pv44) và `1.4` “kêu la” theo Pāli khác; `2.4` ở pv43 vẫn “thế giới của người đã chết”.
  Pāli trùng nguyên văn trong bài: 1 cặp (`2.4` = `5.4`), bản Việt giống nhau (0 cặp khác). Số Pāli: bài này không có số lượng cần tính. `technical_integrity` giữ 9.6: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; chỉ kiểm tập khoá 36/36, thứ tự khoá, nháy khớp Pāli từng khoá, NFC, không Pāli lọt sang bản Việt.

  LƯỢT CẢI THIỆN 2026-10-14 (đọc đối kháng lại cả 36 khoá với Pāli, đo tiền lệ bằng số đếm). Đã đổi 2/36 khoá; 34 khoá còn lại đối chiếu và giữ nguyên. Không tìm thấy lỗi nghĩa nặng nào còn sót; hai lỗi dưới đây đều nhẹ.
  - THUẬT NGỮ THEO TIỀN LỆ (1, vừa): `7.3` `paravisayaṁ patto` “lãnh địa của kẻ khác” → “lãnh vực của kẻ khác”. `paravisaya` được dịch “lãnh vực của người khác” ở 15/15 khoá còn lại trong toàn tầng (sn47.6, sn47.7, mnd16; ba bài này cùng nghĩa từ vựng “phạm vi, miền của kẻ khác”); “lãnh địa” chỉ có ở khoá này (pv43:7.3 dịch “cõi của kẻ khác”). Lượt trước giữ “lãnh địa” vì cho rằng nghĩa khác (`patto` “đã đến” một vùng so với “nơi lui tới”), nhưng danh từ `visaya` ở đây vẫn là cùng từ và không có căn cứ để dịch khác; chọn nhất quán tầng. `terminology` 9.0 → 9.1.
  - CÂU THỪA (1, nhẹ): `5.1` `Tassāhaṁ vacanaṁ sutvā` “Nghe lời ấy của vị ấy” → “Nghe lời của vị ấy” (Pāli không có đại từ chỉ định cho `vacanaṁ`; cùng Pāli ở pv33:7.1 dịch “Nghe lời của vị ấy”, pv43:5.1 “Nghe lời vị ấy”, pv32:6.1 “Nghe lời ấy của người ấy”: 3 cách, không có đa số, nên chọn cách ít thêm chữ nhất).
  - ĐÃ ĐO TIỀN LỆ VÀ GIỮ NGUYÊN: `6.1` `amitto mittavaṇṇena` “Kẻ thù mang dáng bạn bè” (dn31:15–18 `amittā mittapatirūpakā` “kẻ thù đội lốt bạn”, nhiều khoá); `6.2` `kulūpako` “hay lui tới gia đình” (an5.111 ×4 “hay đến các gia đình”); `7.4` `paricārako` “kẻ hầu hạ” (thag7.3:3.4 “kẻ hầu hạ”, ja495:10.1 “người hầu hạ”, ja455/ja543/ja532 “người hầu cận”, đều là danh xưng người phục vụ; không có đa số rõ nên giữ); `2.2` `duggatā yamalokikā` (pv13, pv19, pv27 ×2 cùng “đã rơi vào cảnh khổ, thuộc cõi của Yama”); `3.2` `manasā dukkaṭaṁ kataṁ` “do ý mà đã làm” (16/17 khoá cùng một cách); `3.3` `Kissa kammavipākena` (10/10 cùng một cách); `4.4` `kadariyo paribhāsako` “keo kiệt, hay mắng nhiếc” (an7.57 ×nhiều khoá dịch “keo kiệt, bủn xỉn, hay sỉ nhục” cho `maccharī kadariyo paribhāsako`; ở đây `kadariyo` đứng một mình nên “keo kiệt” vẫn hợp, không đổi). Pāli trùng nguyên văn trong bài: 1 cặp (`2.4` = `5.4`), bản Việt giống nhau, 0 cặp khác.
  - BẤT ĐỊNH CÓ THÊM DỮ KIỆN, VẪN CHƯA PHÂN XỬ ĐƯỢC: (a) `4.3` `ajjhāsito mayhaṁ ghare` “đã cư ngụ trong nhà con” — dạng `ajjhāsito` chỉ xuất hiện đúng hai lần trong toàn Pāli gốc đã ghim (pv43:4.3, pv44:4.3), không có tiền lệ để đo; đọc kỹ ngữ cảnh thì cách hiểu “cư ngụ” có vấn đề: ở `4.1` người ấy là `āvāsiko` (tỳ-kheo trú xứ ở tinh xá), ở `4.2` là `kulamaccharī` (bỏn xẻn về các gia đình, tức giữ chặt thí chủ), nên một vị ở tinh xá mà lại “ở trong nhà” thí chủ thì khó khớp; cách hiểu “bám/dính mắc vào nhà con” (gần với `ajjhosita` “chấp chặt”, gặp ở mn11, mn35, mn106) hợp ngữ cảnh hơn, và bản Việt nguyên bài ở mục Tra cứu toàn văn cũng hiểu theo nghĩa “dính mắc”; tuy vậy `ajjhāsito` ≠ `ajjhosito` về hình thái và tôi không có từ điển hay chú giải để xác nhận hai dạng này là một, nên KHÔNG đổi câu chữ. Đây là chỗ dịch có thể sai nhẹ nghĩa nhất bài. (b) `1.4` `kiṁ nu saddahase tuvaṁ`: không đổi; `saddahase` chỉ có đúng ở pv43:1.4 và pv44:1.4 trong toàn Pāli gốc. (c) `4.1`, `7.2`, `7.3` như lượt trước. Vì (a) làm tăng nghi ngờ về một câu, `semantic_fidelity` 8.9 → 8.8; `ambiguity_integrity` giữ 8.6 vì bất định đã được ghi đầy đủ ở đây.
  Điểm lượt này: `semantic_fidelity` 8.9 → 8.8, `terminology` 9.0 → 9.1, các tiêu chí còn lại giữ nguyên (`vietnamese_clarity` 8.9: sửa `5.1` gọn hơn nhưng “lãnh vực” ở `7.3` không sáng hơn “lãnh địa”, hai thay đổi triệt tiêu nhau; `triangulation` 7.5: vẫn không có bản Anh độc lập nào). `final_score` 9.00 → 9.00 (trung bình thô của mười điểm); chưa vượt 9.0 nên vẫn `review`.
