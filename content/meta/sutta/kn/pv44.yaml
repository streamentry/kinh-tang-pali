notes: |-
  TẦNG THAM KHẢO — không có tệp Anh Sujato cho uid này ở commit đã ghim (xem `blocking_errors`).
  0 segment Pāli có nội dung trên 36 khoá ⇒ cổng coverage không chặt, nhưng tệp Anh vắng thì `validate` vẫn lỗi
  với `review`/`published` ⇒ `draft`. Không có Việt hiện hành ⇒ `triangulation` 7.5.

  BẢN NỮ CỦA pv43 — CẤU TRÚC GIỐNG HỆT, ĐÃ KIỂM BẰNG SỐ. Pāli của pv43 và pv44 có **25 cặp khoá trùng nguyên
  văn**; bản Việt của cả 25 cặp giống hệt nhau. Kiểm lại toàn lát bằng script: **0/47 cặp trùng bị dịch khác**.
  Chỗ Pāli **khác** giữa hai bài thì bản Việt mới khác, và khác đúng chỗ:
  - `ko nu dīno` / `kā nu dīnā` (1.2) → “kẻ khốn khó ấy” / “người khốn khó ấy”;
  - `petomhi` / `petīmhi` (2.1) và `duggato yamalokiko` / `duggatā yamalokikā` (2.2) — Pāli tự đã cho biết giới;
    bản Việt không cần chia đựng (“con là ma”, “sinh về cõi khổ xa xôi”), vì “con”, “người ấy” vốn không mang
    giới. Đây là chỗ **không** nên cố làm khác nhau;
  - `…gato”.` / `…gatā”ti.` (2.4) và (5.4) — pv43 mất `ti` ở 2.4, pv44 có `ti`; giữ nguyên theo Pāli.

  THUẬT NGỮ giống pv43 và cùng tiền lệ đếm được: `Petavatthu` giữ Pāli (1 cách duy nhất trong 11 nơi),
  `Mahāvagga` → “Đại Phẩm” (1 cách trong 19 nơi), `…petivatthu` → “Chuyện Ngạ Quỷ …”. Riêng tiêu đề `:0.3`
  là `petivatthu` (bản nữ) nên giữ nguyên hình thái “Ăn Dơ” như pv43 — hình thái nam/nữ là của Pāli, không
  phải của tiêu đề.

  BẤT ĐỊNH — cùng những chỗ đã ghi ở pv43, vì Pāli các câu ấy trùng nhau: `saddahase tuvaṃ` (1.4),
  `hadantañño` / `hadāmi` (8.1, 8.3), `duggatā yamalokikā` (2.2), `kissā kammavipākena` (3.3), `pecca gatiṃ`
  (6.4), `sīse tiṭṭhāmi matthake` (7.2). Xem `pv43.yaml` để có lý do từng chỗ.

  DẤU LƯỢC — bài này **không có** `…pe…`.

  Ngoặc kép cùng cấu trúc pv43; tự đếm lại: cân.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  Kiểm toán độc lập 2026-10-11 — bản dịch trước (do một agent khác tự chấm 9.05) có LỖI NGHĨA THẬT ở 17/36 khoá (1.2, 1.3, 1.4, 2.2, 3.4, 4.1, 4.2, 4.4, 5.2, 5.3, 6.1, 6.2, 7.1, 7.2, 7.3, 7.4, 8.1), thêm lỗi thuật ngữ/tiêu đề/văn phong ở 9 khoá khác; điểm 9.05 không có căn cứ. Các câu ở mục cũ phía trên về "con là ma", "sinh về cõi khổ xa xôi", "không cần chia đựng", "Ăn Dơ" và "0/47 cặp trùng bị dịch khác" nay đã lạc hậu: các cặp trùng giống nhau nhưng giống nhau trong lỗi.
  Lỗi đã sửa (accuracy fix), phân loại:
  - Hô cách bị đọc thành tân ngữ / đảo người nói (bhadante, bhikkhavo): `1.2`, `3.4`, `6.2` có “bạch ngài” trong miệng vị trưởng lão đang hỏi (bhadante chỉ có ở lời ngạ quỷ nói với trưởng lão); `8.1` “thứ ngài thải ra” (Pāli: `yaṁ bhadante hadantaññe` = những gì người khác thải ra, bhadante là hô cách); `5.2` bhikkhavo là tân ngữ “các tỳ-kheo” (con đã mắng nhiếc các tỳ-kheo), không phải “bạch ngài”.
  - Động từ bị đọc thành tên riêng: `4.1` “Ahu là người cùng ở với con” — `ahu` là aorist của `hoti` (đã có); `āvāsika` = vị thường trú (tiền lệ `ja488:11.1`).
  - Thêm nghĩa/bịa không có trong Pāli: `7.1`–`7.3` (“ở lại ngay trước hiên nhà … làm nô lệ”, “cũng đã chịu quả báo khổ đau”); `2.2` “xa xôi” (duggatā = rơi vào cảnh khổ, 3 nơi cùng Pāli dùng “đã rơi vào cảnh khổ”: pv13, pv19, pv27); `1.3`–`1.4` (“không hề do dự”, “còn mong đợi điều gì nữa”).
  - Đảo chủ thể: `7.4` “kẻ hầu hạ thì chính là con” — Pāli `mameva paricārako` = chính là người hầu hạ của con (kẻ kia hầu hạ ngạ quỷ); `5.3` “nghiệp người ấy” → nghiệp ấy (nghiệp mắng nhiếc của chính ngạ quỷ).
  - Từ vựng sai/đảo nghĩa: `4.4` kadariya = bủn xẻn, không phải “tàn nhẫn” (cnd5:12.4, ja151, ja470 đều là keo kiệt/bủn xỉn); `6.1` `amitto mittavaṇṇena` = kẻ thù mang dáng vẻ bạn bè (bản trước đảo thành “không phải bạn theo vẻ ngoài”); `6.2` `kulūpaka` = người thường lui tới gia đình (không phải “họ hàng”); `4.2` `kulamaccharī` mất vế “về gia đình” (cnd5:12.3, mnd6:63.6: “keo kiệt về gia đình”).
  - Thuật ngữ/tiêu đề (terminology fix): `petī` dịch “ngạ quỷ nữ” (pv13), `petaloka` = “cõi ngạ quỷ” (pv19; đa số cùng Pāli dùng “thế giới của người đã chết” ở pv13/15/16/27/31/45/51/7 — không theo, vì cùng một khổ thơ đã gọi `petī` là “ngạ quỷ”); tiêu đề `Gūthakhādakapetivatthu` → “Chuyện Ngạ Quỷ Nữ Ăn Phân” (gūtha = phân, như “hố phân” ở 1.1; tiền lệ pv15, pv29; `petī` = nữ như pv13); `paravisaya` = “lãnh vực của người khác” theo sn47.6.
  Số đã đổi: 26/36 khoá (17 lỗi nghĩa thật như trên; 9 khoá còn lại là thuật ngữ/tiêu đề/văn phong: `0.3`, `1.1`, `9.1`, `2.1`, `2.4`, `5.4`, `5.1`, `6.4`, `8.4` “ngài ấy” → “người ấy” vì chỉ kẻ ác ấy, không phải bậc đáng kính, và dấu câu `?”.` → `?”`). Hai khoá Pāli trùng nguyên văn (`2.4`, `5.4`) dịch giống nhau; các khoá không đổi (`3.1`–`3.3`, `2.3`, `6.3`) đã đối chiếu và đúng (3.x giống pv13 cho cùng Pāli).
  Điểm đổi (từ → sang): semantic_fidelity 9.0 → 8.5, grammar_logic 9.0 → 8.8, segment_alignment 10.0 → 9.5 (7.1/7.2 chia câu “của … / con đứng trên đầu” qua ranh khoá theo đúng Pāli), terminology 9.0 → 8.5, vietnamese_clarity 9.1 → 8.8, han_viet_balance 9.2 → 9.0, ambiguity_integrity 8.6 → 8.3; source_provenance, triangulation (7.5, không có bản Anh độc lập), technical_integrity (9.6) giữ nguyên. final_score 9.05 → 8.8.
  BẤT ĐỊNH CÒN LẠI: (1) `1.4` `kiṁ nu saddahase tuvaṁ` — dịch sát “ngươi tin điều gì vậy?”; chưa phân xử được liệu `kiṁ nu` là đại từ nghi vấn (tin điều gì) hay trợ từ hỏi có/không (ngươi có tin chăng); (2) `4.1` `mayhaṁ` nối với `āvāsiko` (“của con”) hay chỉ quan hệ chung — dịch “vị thường trú của con” theo nghĩa bám Pāli nhất; chưa xác định liệu bà là thí chủ trú xứ; (3) `4.3` `ajjhāsito` giữ “đã ở trong nhà con”; (4) `8.1`/`8.3` `hadati` dịch trung tính “thải ra”, không nói rõ phân hay nước tiểu; (5) `7.3` `paravisayaṁ patto` “đã rơi vào lãnh vực của người khác” — không nói thêm đó là cõi ngạ quỷ hay quyền của chính ngạ quỷ nữ; (6) `7.1`–`7.2` đứng “trên đầu” theo nghĩa đen, không diễn giải.
  Blocker “không có tầng tham khảo tiếng Anh” giữ nguyên (sự thật về upstream). pv43 (bản nam, Pāli trùng 25 cặp) và pv6/pv31/pv45/pv51/pv7 mang cùng lỗi tương ứng ở các khoá chung Pāli (ví dụ “xa xôi”, “con là ma”, và riêng pv43 các khoá 1.2–8.4 giống hệt lỗi trên) — ngoài phạm vi lượt này, cần kiểm toán riêng.
  Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy ở lượt này (technical_integrity giữ 9.6).
