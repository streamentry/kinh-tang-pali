notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này.
  Pāli trùng nguyên văn: 7 khoá, dù lại nguyên văn cả 7. `:0.1` `Milindapañha` (174/185 nơi) · `:0.2` `Mahāvagga` → “Đại Phẩm” (21/21) · `:1.1` `Rājā āha—` → “Vua nói:” (40/66) · `:2.1` và `:4.1` `“Opammaṁ karohī”ti.` → ““Xin hãy xét một thí dụ”ti.” (12/27) · `:4.11` `Bhāsitampetaṁ, mahārāja, bhagavatā—` (4/7) · `:5.1` `“Kallosi, bhante nāgasenā”ti.` → ““Khéo lắm, thưa tôn giả Nāgasenā.”” (62/71).
  Hai bài lân cận mil3.1.12 và mil3.1.14 đặt tiêu đề `0.3` và khoá kết theo cùng khuôn “Câu hỏi về …, thứ …”; tôi theo đúng khuôn đó, kể cả `0.3`.
  Cụm dài `kusalākusalasāvajjānavajjahīnappaṇītakaṇhasukkasappaṭibhāgadhamme` dịch theo đúng cách đã dùng ở `mil7.3.8:3.2` (cùng bộ `mil`): “điều thiện và điều bất thiện, điều có lỗi và không có lỗi, điều thấp hèn và cao thượng, các pháp đen và trắng đối kháng nhau” — ở đây rút gọn thành “bất thiện, có lỗi và không có lỗi, thấp hèn và cao thượng, đen và trắng đối kháng nhau” để không lặp hai lần trong cùng bài.
  `yogāvacaro` → hành giả (mil3.1.9:1.5); `sevati` → thực hành (an2.11:2.4); `bhajitabbe dhamme` → đáng tu hành; `sāvajja` → có lỗi (mil7.3.8:3.2); `bhikkhave` → này các tỳ-kheo (mil3.1.12:3.5); `bojjhaṅga` → giác chi (an2.12:2.2); `balāni` → sức mạnh (mil3.1.9:1.5); `iddhipāda` → thần túc (an3.158:1.1); `sammappadhāna` → chánh cần (an3.162:2.1); `satipaṭṭhāna` → tứ niệm xứ (an3.162:2.1).
  Bất định: `apilāpanalakkhaṇā` không có tiền lệ trong tầng; đọa `apilāpa` là “không bị gọi hỏi”, dịch “không bị gọi hỏi” và giữ nguyên nghĩa phủ định ở cả `:1.3`, `:1.8`, `:2.6`. `cakkavattissa` → vua Chuyển Vòng Bánh Xe (không tra được tiền lệ trong tầng `mil`; đây là dịch nghĩa, không phải chuyển tự). `pariṇāyakaratanaṁ` ở `:4.2` là người giữ dây cương, **không** phải người giữ ngựa; bản nháp đầu đã viết sai và đã sửa. `sāpateyya` → tiền lương (0 tiền lệ trong tầng). `vijjā` → tri kiến.
  Không khoá nào trong 8 bài này có `…pe…` ở Pāli (đã kiểm 296/296 khoá), nên không có dấu lược nào để giữ, và không có chỗ nào bịa dấu lược che chỗ thiếu.
  Đo lại trên đĩa, hai con số coordinator nêu ở mục (4) của prompt KHÔNG khớp: `bhante` trong tầng `mil` dùng **“thưa tôn giả” 149 lần / 71 tệp**, “bạch ngài” chỉ 37 lần / 23 tệp, “bạch thầy” = 0 (giữ nguyên phần đúng của bạn); `mahārāja` dùng **“này Đại vương” 395 lần / 101 tệp**, còn “tâu đại vương” chỉ 169 + “tâu Đại vương” 79 = 248 lần / 32 tệp. Cả 9 bài lân cận mil3.1.12/.14 và mil7.3.1/.9 đều dùng “này Đại vương”, nên lát này theo đo được, không theo con số bạn đưa.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đủ 37/37 khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không trùng nguyên văn Pāli, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
