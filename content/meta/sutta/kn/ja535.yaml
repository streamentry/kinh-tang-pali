  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 126 khoá chênh lệch lớn nhất → khác nghĩa hoặc có thể khác nghĩa 12: sửa 1 (26.3 `na mayhamatthatthi imehi koci naṁ`: "những thứ này" → "các nàng này"; `imehi` số nhiều không thể chỉ đóa hoa số ít `pupphaṁ imaṁ` ở 25.2 mà chỉ bốn nàng; bản mù cũng đọc là các nàng), giữ 2 (94.4 `mahesi`: bản mù "vương hậu", nhưng cùng chữ ở 37.1 bản mù cũng đọc hô cách "thưa bậc đại ẩn sĩ", giữ hô cách như bản này; 50.4 `apiḷayha`: bản mù thêm phủ định "không đeo", nhưng đây là `api` + `piḷayha`, khớp `piḷandhatha` ở 26.4, giữ "cài"), bất định 9 (2.4 `adānaṁ nupapajjati` "không thích hợp" hay "không thể có"; 8.1 `sara` "hồ nước" hay "hồ Sara"; 30.1 `āyattamanā` đi với Purindada hay với các nàng; 35.3 `adhicca`; 41.1 `sohitthiyā` "vì thế" hay `so hi`; 46.1 `yassāhamicchāmi sudhaṁ`; 73.5 `āḷigaggarakākiṇṇā` một hay hai tên cá; 78.5 `atricca`; 84.1 `suplavatthaṁ` là hapax toàn Pāli ghim, bản này chưa dịch riêng từ ấy và bản mù chỉ đoán "rất vững"). Phần còn lại của 126 khoá (tên chim thú ở 73–76, cây ở 69–71, công thức lặp 3.1–12.4, danh sách định ngữ 84–87) khớp tiền lệ ja546, sn21.6, tha-ap407 hoặc chỉ khác diễn đạt. Đọc đối kháng lại toàn 406 khoá: số `dvādasa` ở 38.1 khớp mười hai mục (`daraklamaṁ` gồm hai mục), danh sách bốn nàng, nháy, người nói, không phát hiện lỗi mới. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đoạn song song ja470 cho `1`–`21`; không có bản Việt nguyên bài, không có bản Anh): sửa 8 khoá.
    - `83.4`, `89.3` (sai ngữ pháp, đổi nghĩa câu hỏi): `Āsāya … siriyā ca` là xuất/so sánh cách (giống cái `-āya`, không thể là chủ cách), nên câu của Sakka là "thay vì Hy Vọng, Niềm Tin và Thịnh Vượng, vì lý do gì Hổ Thẹn lại nhận được cam lộ?"; bản cũ để ba tên như một danh sách treo. Lời đáp ở `90` (lần lượt chê Sirī, Saddhā, Āsā rồi khen Hirī) xác nhận phép so sánh. Hai khoá giữ giống nhau như Pāli.
    - `26.3`–`26.4`: `imehi` là giống đực/trung số nhiều, không thể chỉ bốn nữ thần (sẽ là `imāhi`), nên đọc là "những thứ này" (cành hoa ở `22.4`); `naṁ` là tân ngữ của `piḷandhatha` (đóa hoa) → "nàng ấy hãy cài lấy nó" thay cho "tự trang sức". Lượt mù 2026-10-14 đã đổi `26.3` thành "các nàng này"; lượt này đảo lại vì lý do giống ngữ pháp. Cách đọc "các nàng" vẫn là khả năng nếu kệ lệch giống.
    - `98.3` `Nārado sāriputtosi`: "Sāriputta là Nārada" → "Nārada là Sāriputta", theo thứ tự Pāli như mọi dòng nhận diện khác (`97.1`, `97.3`, `97.4`, `98.1`, `98.2`, `98.4`). `97.2` `kosiyo dānapati bhikkhu` → "Kosiya là vị tỳ-kheo thí chủ", song song `98.1` `Sūriyo kassapo bhikkhu` "tỳ-kheo Kassapa" (bất định cũ về `dānapati` vẫn giữ).
    - `73.1`, `74.1` `sanniratā` "ở yên" → "sống thỏa thích" (`sannirata` = vui thích, không phải "đứng yên").
    Giữ nguyên `1`–`21` (trùng `ja470`). Bất định cũ ở `30.1`, `35`, `42.1`, `43.2`, `49.2`, `58.2`, `63`–`64`, `78.5` `atricca`, `84.1` `suplavatthaṁ`, `94.4` `mahesi` vẫn để nguyên.

  Quyết định hội đồng biên tập 2026-10-16: A13 — `13.4`, `29.4`, `30.4`, `36.4`, `44.4`, `51.4`, `58.4`, `64.4` và 2 khoá khác (tổng 10 khoá) (bỏ dấu chấm thừa sau dấu đóng lời thoại, ví dụ `?”.` thành `?”`); B21 — `74.3` (`koñca` = sếu (DPD sarus crane; công thức tiếng kèn voi)); C3 — `0.2` (tên nipāta "Nhóm N Kệ").

  Nghiên cứu nguồn ngoài 2026-10-16: H.T. Francis (dịch), The Jātaka vol. V (PTS 1905, phạm vi công cộng; đọc qua static.sirimangalo.org/old/jataka/5.htm, Jātaka 535 tr. 202–218); đã đối chiếu toàn bài (kệ 1–96; các nhóm lặp 2–12, các danh sách cây/cá/chim/thú 69–76 và 84–86 theo mẫu); không sửa khoá nào, nghĩa khớp Francis ở mọi khoá có nội dung riêng (lời của Sakka và Kosiya, bốn nữ thiên Sirī/Āsā/Saddhā/Hirī, mười hai điều xấu ác cam lộ diệt trừ, lời trách từng nữ thiên, lời khen Hirī). Francis dịch Sirī là 'Glory' và Hirī là 'Honour'; bản dịch giữ 'Thịnh Vượng' và 'Hổ Thẹn' theo nghĩa Pāli (`hirī` = hổ thẹn). Bất định ghi nhận, không đổi: 64.1 `kālā nidāgheriva aggijāriva` (bản dịch 'như ngọn lửa bùng cháy'; Francis, với chú thích 'ipomoea', hiểu `aggijāri` là một loài cây; DPD không có mục), 58.2 `jighaññanāmavhayanaṁ disaṁ` (Francis 'the ill-omened West'), 46.1 `Yassāhamicchāmi sudhaṁ` (Francis 'I bliss confer on whom I will').

