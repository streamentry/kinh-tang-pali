notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja535_root-pli-ms.json` (406/406 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ: bốn dòng tiêu đề `0.1`–`0.4`, 98 bài kệ (`1`–`98`; phần lớn bốn dòng, riêng `31`, `65`, `83` có năm dòng, `73`, `74`, `76`, `78` có sáu dòng và `77` chỉ có hai dòng) và dòng kết bài `99.1`; phần văn xuôi khung truyện không nằm trong tầng Pāli đã ghim, nên người nói được suy từ xưng hô, nháy và mạch của chính các bài kệ. Nội dung chính (suy từ kệ): mở đầu là cuộc nói chuyện giữa Kosiya, người còn keo kiệt, với Sakka và đoàn tùy tùng hiện làm bà-la-môn (cùng bộ kệ với `ja470`), Kosiya hứa bố thí rồi xuất gia; sau đó Nārada khơi chuyện bốn nữ thần Hy Vọng, Niềm Tin, Thịnh Vượng và Hổ Thẹn tranh nhau hoa Pārichatta, rồi họ đến hỏi Sakka ai là bậc cao quý hơn; Sakka sai Mātali mang cam lộ cho Kosiya, lúc này là ẩn sĩ ở sườn Himavanta; Kosiya trao cam lộ cho Hổ Thẹn, Sakka hỏi lý do, Kosiya đáp, và Mātali mời ông lên cõi trời. Phần này không được đối chiếu với văn xuôi nào, nên các dòng tả cảnh và tả người nói dựa hoàn toàn vào kệ.

  - Tầng tham khảo:
    Tầng English của Sujato không có ja535 (ja chỉ có 83 tệp: ja1–79, ja126, ja159, ja466, ja534; đây là not-published-upstream, không phải not-synced; ja534 là một Jātaka khác); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng (đặc biệt `ja470`, bài có cùng 21 bài kệ đầu, và `ja533`, cùng phẩm) và bối cảnh của chính bài. Tiền lệ Việt trong tầng do cùng một nhóm dịch, nên không phải đối chiếu độc lập; tôi không dùng bản tóm lược hay bản dịch ngoài tầng đã ghim làm câu chữ hay đối chiếu. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
  - Coverage English:
    Mẫu số = 0: trong 406 khoá, không khoá nào có Pāli từ 40 ký tự trở lên theo `source/layers.yaml` (toàn vế kệ ngắn), nên cổng coverage không đo được gì ở bài này. Điều đó không có nghĩa là không cần ghi nhận gap; entry `reference-gaps.yaml` cũng không cứu được `published`. Sujato phủ 0/406 khoá, `english-project` 0/406, `vietnamese-current` 0/406.
  - Phân loại & tiêu đề:
    + `0.1` "Jātaka"; `0.2` "Bộ Tám Mươi Bài Kinh" (Asītinipāta, asīti = 80; cùng khuôn với `ja533:0.2`); `0.3` "Phẩm Thiên Nga Nhỏ" (Cūḷahaṁsavagga, dùng lại nguyên văn `ja533:0.3`); `0.4` "3. Kinh Thức Ăn Cam Lộ" (Sudhābhojana = sudhā + bhojana; dịch theo nghĩa như "Kinh Thương Nhân Biển" ở `ja466:0.4`, thay vì giữ phiên âm); `99.1` "Kinh Thức Ăn Cam Lộ, thứ ba." theo khuôn "Kinh <Tên>, thứ n" của `ja472`, `ja441`; `tatiyaṁ` = thứ ba khớp "3." ở `0.4` và vị trí thứ ba trong phẩm.
    + `sudhā` → "cam lộ": tầng không có tiền lệ cho chính `sudhā`; với `amata` (Milinda) có "cam lộ" 1 khoá và "cam lồ" 2 khoá; chọn dạng Hán–Việt chuẩn "cam lộ". Đây là chọn thuật ngữ, không phải phát hiện về Pāli.
  - Bốn nữ thần (dịch tên theo nghĩa, vì bài mô tả họ như những phẩm chất nhân cách hóa):
    `Āsā` → "Hy Vọng", `Saddhā` → "Niềm Tin", `Sirī` → "Thịnh Vượng", `Hirī` → "Hổ Thẹn". Viết hoa khi là nhân vật (`24.3`, `42.3`, `45.1`, `46.3`, `52.3`, `59.1`, `62.1`, `65.1`, `68.2`, `83.4`–`83.5`, `89.3`–`89.4`, `94.3`, `97.1`) và viết thường khi là phẩm chất trong lời Kosiya (`53`–`56`, `57.1`, `90`, `91`–`93`). Đo trên tầng: `sirī` trong các khoá `ja` đã dịch có 11 khoá "thịnh vượng" so với 4 khoá giữ "Sirī" (đa số giữ "Sirī" khi đứng cặp với Lakkhī, như `ja527:34.3`, `ja382:11.3`); ở đây Sirī là phẩm chất bị nhân cách hóa, nên chọn "Thịnh Vượng". `hirī` → "hổ thẹn" (hirī–ottappa) theo `dn33`, `mn53`, `sn16.7`. Đây là quyết định biên tập; cách giữ phiên âm cũng có thể bảo vệ được.
