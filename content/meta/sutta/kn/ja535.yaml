  - Số Pāli:
    `ubho` (`14.1`) = cả hai; `duvinnaṁ` (`1.4`) = của hai người; `dvādasa` (`38.1`) = 12, và danh sách ngay sau đó đếm đủ 12 mục khi tách `dara`/`klama` và `kodha`/`upanāha`, `vivāda`/`pesuṇa`: khudā 1 + pipāsā 2 + arati 3 + dara 4 + klama 5 + kodha 6 + upanāha 7 + vivāda 8 + pesuṇa 9 + sīta 10 + uṇha 11 + tandi 12; `pañcama` (`40.3`) = thứ năm (thīghātaka 1 + pāradārika 2 + mittaddu 3 + người nguyền rủa bậc giữ giới 4 + kẻ keo kiệt 5); `catasso`/`caturo` (`24.1`, `42.2`, `43.3`) = bốn, đúng bốn nữ thần Āsā, Saddhā, Sirī, Hirī; `catuddisā` (`43.3`) = bốn phương; `sahassa-` (`29.3`, `34.2`, `83.2`) = ngàn (`sahassacakkhu`, `sahassayutta`, `sahassanetto`); `dasasatāni` (`86.2`) = 10 × 100 = 1.000 (khớp `sahassayuttaṁ` ở `34.2`); `nava` ở `79.3`, `82.4` là tính từ "mới" (không phải số 9); `dutīya` (`51.3`, `52.1`) = bạn đồng hành; `ekikā` (`51.4`) = một mình; `asīti` (`0.2`) = 80; `tatiyaṁ` (`99.1`) = thứ ba, khớp "3." ở `0.4`. `tidasa` ở `23.1` dịch "chư thiên Ba Mươi" (`ja523:43.4`), ở `14.3` và `83.2` dịch "ba mươi ba vị trời" (`tidasānamindo`: `ja470:14.3`, `ja512:30.4`, `ja391:2.4`, 3 khoá; `ja494:17.4` dịch "chư thiên Tam Thập"). Không có số lớn, và không có cụm thuộc loại chưa phân xử được, kể cả `Tiṁsakappasahassa`.
  - Thuật ngữ (có đếm trên tầng):
    + `devasārathi` → "người đánh xe của chư thiên" (`ja470:14.2`, `ja494:2.2`: 2/2); `sugatte` → "hỡi người thân hình đẹp đẽ" (3/3 khoá `ja`: `ja444:8.2`, `ja458:8.2`, `ja442:7.2`); `bhadde` → "hỡi hiền nữ" (6 trong 9 khoá `ja` có `bhadde`; 1 khoá dịch "hỡi nàng"); `varapañña` → "hỡi bậc có trí tuệ thù thắng" (`ja483:11.4`, 1/1); `accharā` → "tiên nữ" (5 trong 6 khoá `ja`); `upanāha` → "oán hận" (`ja506:21.2`, `ja382:5.1`: 2/2); `muni`/`mahāmuni` → "hiền sĩ", "đại hiền sĩ" (`ja509:4.4`, `ja467:12.2`; `ja530:32.2` dịch "Mâu-ni"), còn `mahesi` (vị ẩn sĩ lớn, `37.1`, `94.4`) → "đại ẩn sĩ" và `isivara` (`22.3`) → "vị ẩn sĩ tối thắng" để giữ hai từ Pāli khác nhau; `kañcanavelliviggahe` → "hỡi người có thân hình như dây leo vàng" (không có tiền lệ); `osadhī` → "sao Mai" (`pv13:10.4`: "tựa như sao mai"); `jaṭājinandhara` → "tóc bện mặc da thú" (`ja497:22.4`: "búi tóc bện và da thú"); `Masakkasāra` giữ phiên âm (`ja524:15.6`, `vv84:49.4`, `pv37:49.4`); `haṁsa` trong danh sách chim `74.3` → "ngỗng trời" theo đúng khoá Pāli trùng nguyên văn (4 khoá `sn21.6:2.1`, `ja202:1.1`, `ja214:2.3`, `tha-ap407:30.1`) dù trong `ja533` `haṁsa` là "thiên nga" (18 so với 6 "ngỗng"), vì ở đó là nhân vật chính; `koñca` → "diệc" (cùng 4 khoá); `cakkavāka` → "vịt trời" (`ja434`); `sīha/byaggha/varāha` → "sư tử, hổ, heo rừng" (`tha-ap414:5.1`); `acchakokataraccha` → "gấu, sói, linh cẩu" (`ja516:26.2`; `tha-ap414:5.2` dịch "gấu, chó sói, linh cẩu"); tên cây, cá, chim, thú không có từ Việt chắc chắn được giữ phiên âm theo `tha-ap407`, `tha-ap414`, `ja503` ("pāṭhīna", "piyāla", "tinduka", "uddālaka", "pāṭalī", "sinduvāraka", "kareri"); cá có thêm chữ "cá" như `tha-ap407:3.1`; `ambā` → "xoài", `panasa` → "mít", `kadalī` → "chuối" (`tha-ap407:11.3`), `mahiṁsa` → "trâu" (`an5.99:1.7`; `ja278:0.4` dịch "Vua Bò"); `kadalimiga` giữ "hươu kadalī" (`dn1:1.15.2`, `dn2:50.2`).
    + `pūjita`, `pūjiyā` → "tôn kính". `dāna/dama/cāga/saṁyama` (`60.1`) → "bố thí, tự điều phục, xả thí, tự kiềm chế" (bốn từ khác nhau, giữ bốn từ Việt khác nhau; `ja224:1.3`, `ja57:1.3` dịch `cāga` là "bố thí" khi đứng trong chuỗi khác).
    + Xưng hô: Kosiya nói "tôi/nàng" với các nữ thần và "tôi" với Mātali; ở `2`–`18` giữ "ta/ngươi" theo `ja470`, ở `83` Sakka nói "ta"; các nữ thần nói "tôi/ngài" với Kosiya.
  - Chỗ bất định (không thêm vào thân kinh):
    + `22.2` `tā` chỉ những nữ nhân đã nói ở phần văn xuôi không có trong tầng Pāli; bản Việt dùng "các nàng ấy" mà không nêu thân phận. `23.4` `tadārahaṁ` → "xứng với họ" (chỉ chư thiên).
    + `24.4`, `88.4` `devabrāhmaṇa`/`nāradadeva brāhmaṇaṁ`: không có tiền lệ; dịch "vị bà-la-môn như thần" cho cả hai. Có thể đọc `nāradadeva` ở `24.4` là tên ghép "Nārada-thiên" (cách đọc khác).
    + `25.3`–`25.4`: `sabbā gati te ijjhatu` → "mong mọi bước đi của ngài đều thành tựu" (`gati` nghĩa rộng: lối đi, vận mệnh); `Tuvampi no hohi yatheva vāsavo` → "ngài cũng hãy đối với chúng tôi như Vāsava vậy" (không nêu Vāsava là gì với họ vì Pāli không nêu).
    + `26.3` `Na mayhamatthatthi imehi koci naṁ`: `imehi` và `naṁ` không phân xử được; dịch "Ta không có lợi ích nào từ những thứ này cả". `26.4` `piḷandhatha`: dịch là mệnh lệnh số ít hướng về nàng nào cao quý hơn, đối tượng ngầm.
    + `30.1` `āyattamanā` → "với tâm chú ý" (hình thái hiếm, có thể là "tâm ý bị chi phối").
