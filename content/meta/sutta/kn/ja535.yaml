  - Pāli trùng nguyên văn:
    Dò Pāli của 406 khoá với toàn bộ Pāli đã ghim (mọi bộ) có bản Việt, loại các khoá dưới 12 ký tự chuẩn hoá: 89 khoá có dạng trùng ở bài khác, tổng 203 cặp, trong đó bản Việt giống hệt (bỏ dấu câu) ở 188 cặp và khác ở 15 cặp. Dùng lại nguyên văn: `1.1`–`21.4` từ `ja470:1.1`–`21.4` (cùng bộ kệ; 21 bài kệ, 84 khoá; chỉ sửa dấu cuối khoá và nháy theo Pāli ở `3.2`, `3.4`, `14.4`, `15.1`, `15.4`, `16.1`, `16.4`, `17.1`, `21.4`; `19.1` thiếu hạt `hi` so với `ja470:19.1` nên không đổi nghĩa), `0.3` (`ja533:0.3`), `72.2` (`ja195:1.2`), `74.3` ("Ngỗng trời, diệc và công": `sn21.6:2.1`, `ja202:1.1`, `ja214:2.3`, `tha-ap407:30.1`), `75.3` (`tha-ap414:5.1`), `75.4` (`ja516:26.2`).
    Cặp mà bản Việt khác có lý do: `16.2` (`pv11:6.4` có thêm "chúng tôi" theo ngữ cảnh riêng); `16.3`/`17.3` (`ja457:10.3`, `ja457:11.3`: câu khác trong bài khác, ở đây theo `ja470:16.3`, `ja470:17.3`); `16.4` (`ja488:17.2`, "thì đi vào địa ngục" nằm trong câu khác); `19.3` (`ja523:41.1`, "Chính ta"); `20.3` (`pv36:56.3`, ở đây theo `ja470:20.3`); `21.4` (5 cặp: `ja509:23.4`, `ja509:25.4`, `ja408:6.4`, `tha-ap2:35.3`, `snp1.3:26.3`; ở đây theo `ja470:21.4`); `58.1` (`pv28:5.1` dịch `Daddallamānā` là "Daddalla ngân lên"; `daddallamāna` là phân từ hiện tại "chói sáng", nên không theo); `74.3` (`bv3:19.3` giữ phiên âm).
