  https://ancient-buddhist-texts.net/Buddhist-Texts/K10-JA/535.htm làm bằng chứng nghĩa. Đối chiếu
  401/406 khoá (98 khổ kệ; không đối chiếu: tiêu đề và dòng kết); KHỚP 83, LỆCH-THẬT 6, NGUỒN-LỆCH 9.
  Đã sửa: 43 (`subhena vaṇṇena sikhārivaggino` nói về bốn thiếu nữ, không phải vị ẩn sĩ); 49.2
  `vidurānupātiniṁ` là kẻ lao vào hãm hại người khôn (chú giải `paṇḍite pātetvā pothetvā viheṭhetvā`),
  không phải "chạy theo"; 58.2 `jighaññanāmavhayanaṁ disaṁ` là phương mang tên thấp kém (chú giải
  `jighaññena lāmakena nāmena`; Indacanda "hướng Tây"), không phải tên riêng Jighañña (cùng chữ
  `jighañña` ở 63.1 đã dịch "cuối"); 64.1 `kālā nidāgheriva` là dây leo sẫm màu mùa nóng (chú giải
  `kāḷavalli`), không phải "mùa nóng bức"; 84.1 `udatārayī` (chú giải `uttāresi ukkhipitvā`) là cất
  lên cho lướt đi, không phải "hạ xuống"; 86.4 `saddagame` là đi theo tiếng hô (chú giải
  `saddamatteneva gamanasīle`), không phải "vang tiếng". NGUỒN-LỆCH, giữ nguyên: 35 `udaggihuttaṁ`
  (chú giải và Indacanda tách `udaka`, `aggi`, mặt trời; bản Việt hiểu lửa tế bốc cao), 44 và 67
  `kañcanavelliviggahe`, 46 `sudhaṁ`, 50 `kambuvimaṭṭhadhārinī` (chú giải: trang sức vàng; bản Việt
  "vỏ ốc"), 54 `karontupāyaso` (chú giải `upāyena`; bản Việt `upāyāsa`), 61 `pekkhavā` (chú giải
  `sataṇho`), 77 `chamāgirī`, 78 `nīladumābhilambitā`, 91 `jiṇṇā` (chú giải: góa phụ). triangulation
  8.4→8.94 = cũ + 0,6 × 401/406 × 89/98 (khoá kết luận được; các khoá NGUỒN-LỆCH tính là chưa kết
  luận), tối đa 9,2. semantic_fidelity và grammar_logic +0,1 mỗi tiêu chí vì đã sửa lỗi nghĩa thật;
  các tiêu chí khác giữ nguyên.

  Sửa lỗi nghĩa 2026-10-16: 84.3 `jambonadīsaṁ` — “như vàng sông Jambu, sáng như vàng ròng;” → “có càng xe
  bằng vàng sông Jambu, sáng như vàng ròng;” (`īsā` là càng/gọng xe, chữ cuối của hợp từ; Chú giải CST:
  *Jambonadīsan-ti jambunadasaṅkhātaṁ rattasuvaṇṇamayaṁ īsaṁ*; Indacanda “có càng xe làm bằng …”; Francis “Its
  pole of gold”, https://ancient-buddhist-texts.net/Buddhist-Texts/K10-JA/535.htm ;
  https://ancient-buddhist-texts.net/English-Texts/Jataka/535.htm). 54.2 `karontupāyaso` — “gieo hạt giống,
  chịu bao nhọc nhằn ưu lo;” → “gieo hạt giống, làm việc bằng đủ phương cách;” (`upāyaso` là `upāya` + hậu tố
  trạng ngữ `-so`, không phải `upāyāsa` “nhọc nhằn”; Chú giải: *taṁ taṁ kiccaṁ upāyena karonti*; Indacanda
  “làm việc theo kế hoạch”; Francis “labour with their utmost skill”,
  https://ancient-buddhist-texts.net/Buddhist-Texts/K10-JA/535.htm ;
  https://tamtangpaliviet.net/TTPV/33_Ja_II.pdf). 84.2 vẫn giữ, bất định như cũ.

  Rà từng chữ bằng DPD 2026-10-16: 406 khoá đã rà; sửa 35.3–35.4 (`vāsavo` là chủ cách, không phải hô cách; Chú giải `vāsavo nu kho evaṁ … odahi`, Indacanda “Vāsava … hay người nào”; `ko neva` = `ko nu evaṁ` như Chú giải ở 30.4: “Vāsava, … ai đã đặt” → “phải chăng là Vāsava, … — ai đã đặt như vậy”), 42.1 (`matā` là mata 2.2 của DPD “known, understood”, Chú giải `anumatā ceva pesitā ca`, Indacanda “được chấp thuận và được phái đi”: thêm “chấp thuận”), 43.2–43.3 (`caturo`: DPD `catura` “clever” dẫn đúng Chú giải `caturā ti cāturiyena samannāgatā`; bản cũ “cả bốn nàng” và “bốn” lặp ở 43.2 → “bốn thiếu nữ khéo léo”; Indacanda gán `caturo` cho Kosiya, chưa phân xử chủ thể), 49.1 và 66.3 (`Taṁ taṁ` = `tasmā taṁ` theo Chú giải, Indacanda “Vì thế”: thêm “vì thế”), 50.4 (`kusaggirattaṁ`: DPD tách `kusa + aggi + rattaṁ`, Chú giải `kusatiṇaggisikhāvaṇṇaṁ`, Indacanda “ngọn lửa cỏ kusa”: “đỏ như ngọn cỏ kusa” → “đỏ như lửa cỏ kusa”), 57.1 (`ime` giống đực số nhiều không đi với `āsā` giống cái; Chú giải `ime sattā … tasmā tvaṁ āsā nāma visaṁvādikasammatā`, Indacanda “những người này”: “Những niềm hy vọng này bị xem là lừa dối” → “Qua những người này, Hy Vọng bị xem là kẻ lừa dối”), 77.1 (`chamāgirī`: DPD tách `chamā + girī`, Chú giải `bhūmisamapatthaṭā piṭṭhipāsāṇā`, Indacanda “các tảng đá trải bằng ở mặt đất”: “Ngọn núi” → “Những phiến đá phẳng sát mặt đất”), 29.2 và 81.2 (`udīritā` là quá khứ phân từ của DPD “said; uttered; spoken”, không phải “bị kích động”; Chú giải ở 29.2 `“Bhūtādhipam-eva pucchathā” ti vuttā`, Indacanda “Được bảo (hãy đi và hỏi)”: “được bảo như thế”; ở 81.2 Chú giải `sakkassa santike ayaṁ sudhāti udīrayi`, Indacanda “đã nói rằng”: “nàng cất lời”; hai khoá trùng chữ nhưng Chú giải giải theo văn cảnh riêng); bất định 3.1, 5.1, 7.1, 10.1, 12.1 (`Taṁ taṁ vadāmi`: Chú giải `tena taṁ vadāmi`, Indacanda “vì lý do đó”, nhưng DPD chỉ ghi `taṁ` là đại từ và công thức trùng ja470; giữ “như vậy” cho nhất quán liên bài), 30.1 (`āyattamanā`: DPD chỉ tách chữ; Indacanda gán cho các nàng; `katañjalī` theo Chú giải là Sakka được các nàng chắp tay), 46.1 (`sudhaṁ`, dị bản PTS `sukhaṁ` mà Indacanda theo; không dùng dị bản), 55.1 (`attakārāni`: Chú giải việc dũng lược nơi chiến trận), 61.1 (`pekkhavā`: Chú giải `sataṇho`), 76.4 (`gaṇino`: DPD `gaṇī` “one with a following” ủng hộ “sống thành bầy”, Chú giải `gokaṇṇā` và Indacanda là một loài thú), 78.1–78.2 (`abhilambitā` DPD không có, Chú giải và Indacanda: nàng vịn cành cây; `anupajjatha` DPD “follows”, Chú giải `pāvisi` vào am thất), 78.5 (`atricca`: DPD chỉ ghi dị bản `atriccha`; Chú giải `attharitvā`, Indacanda “trải ra”), 84.2 (`upakāriya`), 94.4 (`jāyatha`: DPD `jāyati` “is born; arises” ủng hộ “sinh ra”, Chú giải đọc “trở thành bậc được xem là tối thắng”, Indacanda “đã chiến thắng”).

  Sửa sau kiểm độc lập 2026-10-16: 35.1 `udaggihuttaṁ` = lễ nước và lửa (chú giải «udakaaggihuttaṁ»), không phải «lửa tế bốc cao»; 35.2 `pabhaṅkaraṁ lokatamonuduttamaṁ` là đối tượng được hầu (chú giải: ādiccaṁ, mặt trời), không phải tính ngữ của ngọn lửa — dịch «vầng sáng» để không thêm chữ ngoài Pāli; 94.4 `jāyatha` với vị ngữ `seṭṭhasammatā` = đã trở thành (chú giải «uttamasammatā jāyatha»), không phải «sinh ra» — Hirī vốn đã là con gái Sakka.
