  · `sāvikā` ⇒ *nữ đệ tử* (`24.1`): trên **93** khoá `sāvikā`, *đệ tử* **89**, *nữ đệ tử* **48**; chọn *nữ đệ tử* theo `thig13.4:24.3`.
