  · `pabbajita`/`pabbajjā` ⇒ *xuất gia*: **150**/**153** khoá. `brahmacārinī` ⇒ *người sống phạm hạnh* (`14.3`, `32.3`), theo `vv31:5.2` (*sống đời phạm hạnh*).
  · `accharā` ⇒ *tiên nữ* (`9.2`): trên các khoá có `accharā-`, *tiên nữ* **29**, *thiên nữ* **20**. `kinnarī` ⇒ *nàng kinnarī* (`10.4`, `16.2`, `18.4`), theo `thi-ap5:1.2` (*nàng tiên nữ kinnara*); `ja458:1.3` có *đôi mắt như mắt kinnara*.
    `Cittalatā` là tên riêng: `vv37:1.2` (*khu rừng Cittalatā*), `vv66:1.1`. `kāsika` ⇒ *vải Kāsi* (`9.3`, `12.1`): `pv14:10.2`, `pv10:8.2`.
