  · **Số Pāli** — tự tính, không dùng công cụ đo số chuẩn của kho vì không có cụm nào trong bài thuộc bộ cụm đã xác lập:
    `Tiṁsa-` (`0.2`, `36.1`) = 30 ⇒ *Ba Mươi*, theo `ja512:0.2` và `thag17.1:0.2`; `maggaṭṭhaṅgika` (`24.2`) = aṭṭha 8 + aṅga ⇒ *tám chi phần*;
