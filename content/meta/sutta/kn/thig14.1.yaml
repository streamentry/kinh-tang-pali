  **BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh:**
  · `1.2` `subhaṁ`: đọc là tên *Subhā* ở đối cách (đồng vị với `bhikkhuniṁ`; `1.4` có `subhā` chủ cách); Sujato cũng đọc là tên. Cách đọc *vị tỳ-kheo-ni xinh đẹp* cũng khả dĩ.
  · `3.3` `parisuddhapadaṁ`: dịch *người có chỗ đứng thanh tịnh*; `pada` hiểu là chỗ đứng, nền tảng; Sujato *pure*, bản Việt nguyên bài *bản thể thanh tịnh*. Tầng đã dịch có **0** khoá chứa `parisuddhapada`.
  · `4.1`–`4.3`: Pāli dùng đối cách (`anāvilaṁ`, `vītarajaṁ`, `vimuttamānasaṁ`) đối lập với chủ cách của gã (`āvilacitto`, `sarajo`); dịch thành ba cặp đối nhau (*ông … còn tôi …*) để không thêm động từ. Sujato rút gọn, bản Việt nguyên bài giữ cấu trúc đối cách.
  · `5.1` `apāpikā`: dịch *lại không có điều ác* (`pāpa` là điều xấu, điều ác); Sujato *flawless*, bản Việt nguyên bài *không xấu xa*. Không phải *không xấu về dung mạo*.
  · `6.1` `madhurañca pavanti`: Pāli không nêu chủ ngữ của *pavanti* (*tỏa ra*); dịch *hương ngọt ngào lan tỏa* theo ngữ cảnh (*phấn hoa* ở `6.2`) và theo Sujato (*scent of pollen wafts sweet*). `samuṭṭhitā` dịch *vươn lên*, theo bản Việt nguyên bài (*vươn lên với bụi phấn*).
  · `14.2` `amanussasevitaṁ`: dịch sát là *được loài phi nhân lui tới*; Sujato diễn nghĩa *untouched by men*. Tôi không thêm ý *chưa ai chạm tới*.
  · `15.4` `vimano udikkhasi`: dịch *nhìn với tâm trí rối loạn*; `vimana` ở đây là trạng thái tâm lạc hướng, không phải *buồn*. Sujato *crazily*, bản Việt nguyên bài *mất hồn*. Tầng đã dịch có **0** khoá chứa `vimano`.
  · `16.1` `tūriyā`: dịch *nai cái*, theo cả Sujato (*doe*) lẫn bản Việt nguyên bài; **0** khoá nào khác trong tầng chứa `tūriyā`, nên không có tiền lệ độc lập.
  · `21.1` `iṅgālakuyāva ujjhito`: đọc `kuyā` ở cách xuất xứ (*bị quăng khỏi hố than hồng*), theo Sujato (*cast out like sparks from fiery coals*) và bản Việt nguyên bài (*văng ra từ chậu than hồng*); cách đọc `kuyā iva` (chủ cách, *như hố than hồng bị bỏ lại*) cũng khả dĩ. **0** tiền lệ trên tầng.
  · `21.2` `visapattoriva aggito kato`: dịch *như bát độc đã bị thiêu bằng lửa*; `aggito kato` không phân xử được tuyệt đối (*bị lửa làm hỏng* hay *được đưa vào lửa*). Sujato *worth no more than a bowl of poison* (không bám `aggito kato`); bản Việt nguyên bài *được làm cho tiêu tán*.
  · `20.1`–`20.2` `natthi hi … yatthapi dāni me siyā`: dịch *không có nơi nào mà nay tham còn có thể có ở tôi*; Sujato *there will be no more lust anywhere in me*; bản Việt nguyên bài *thậm chí ở thế gian … không có sự luyến ái nào có thể hiện hữu ở ta*. `atha` ở `20.4`, `21.4` dịch thành *vì* (nguyên nhân của việc không biết/không thấy loại tham ấy); cả hai bản đối chiếu không dùng liên từ.
  · `20.4`, `21.4` `maggena`: dịch *con đường* theo đa số tầng; nghĩa là Thánh đạo (con đường tám chi ở `24.2`), nhưng Pāli không nói *ariya*.
  · `22.1` `apaccavekkhitaṁ`: dịch *điều chưa được quán xét*; bản Việt nguyên bài chú thêm trong ngoặc *năm uẩn này*. Phần ngoặc là chú giải, không đưa vào thân kinh. `22.4` `jānantiṁ so imaṁ vihaññasi`: `jānantiṁ` (*người đã biết*) không nêu đã biết điều gì.
  · `23.3` `saṅkhatamasubhanti`: `ti` đóng lời nghĩ trong đầu nhưng Pāli không có nháy đơn; để khớp Pāli từng khoá, Việt không dùng nháy (*biết rằng pháp hữu vi là bất tịnh*).
  · `25.2` `sombhā`: dịch *những con búp bê* theo Sujato (*dolls*) và bản Việt nguyên bài; **0** tiền lệ. `25.3`, `26.1` `khīlaka` dịch *chốt* (Sujato *sticks*, bản Việt nguyên bài *thanh gỗ*); nghĩa gốc của `khīla` là cọc, chốt.
  · `26.2` `vissaṭṭhe vikale parikrite`: dịch *đã buông lỏng, rời rạc, bị tháo rời*; **0** tiền lệ cho `parikrita`; Sujato *loosed, disassembled, dismantled*, bản Việt nguyên bài *tháo rời, gỡ bỏ, phân tán*.
  · `27.1`–`27.3` `dehakāni`, `dhammehi`: dịch *các phần thân thể của tôi* và *những pháp ấy*; bản Việt nguyên bài chú trong ngoặc *đất, nước, v.v…* và *tay, chân, v.v…* — phần chú giải, không đưa vào thân kinh. Sujato dịch `dhammā` là *those things*. Giữ *pháp*, không thu hẹp thành *bộ phận*.
  · `28.1` `haritāla`: dịch *thư hoàng* (chất màu vàng khoáng); Sujato *yellow orpiment*, bản Việt nguyên bài *màu vàng*. **0** tiền lệ trên tầng; chữ *thư hoàng* ít quen, nên đã cân nhắc *chất màu vàng*, nhưng giữ tên chất liệu để không làm mất một đơn vị nghĩa của Pāli.
  · `28.4` `saññā mānusikā`: dịch *tưởng về con người*; Sujato *the perception 'human'*, bản Việt nguyên bài *cái tưởng về con người*.
  · `29.1` `māyaṁ viya aggato kataṁ`: dịch *trò ảo thuật bày ra trước mặt*. `29.4` `rupparūpakaṁ` dịch *hình nhân được bày giữa đám đông* theo Sujato (*painted doll among the people*) và bản Việt nguyên bài (*sự phô bày hình thức ở giữa đám người*); **0** tiền lệ, nghĩa chính xác của `rupparūpaka` không phân xử được bằng chứng trong tầng.
  · `30.1`–`30.4` `vaṭṭanī`, `pīḷakoḷikā`, `cakkhuvidhā`, `piṇḍitā`: Sujato *ball … mucus … eye-parts … lumped together*, bản Việt nguyên bài *viên bi … chất ghèn … các phần tử của con mắt được xoay chuyển theo nhiều lối* (đọc `piṇḍitā` khác). Dịch *viên bi tròn*, *ghèn mủ*, *phần của con mắt gom lại thành khối*; tầng có **0** khoá cho cả ba từ đầu, nên không có tiền lệ độc lập. Nghĩa `piṇḍita` là *gom thành khối*.
  · `31.1` `cārudassanā`: dịch *có dung mạo xinh đẹp*; Sujato *fair-eyed*, bản Việt nguyên bài *có khuôn mặt dễ thương*. Pāli không nêu đối tượng của `uppāṭiya` (*móc ra*), `31.3` nêu *cakkhuṁ*.
  · `31.2` `na ca pajjittha`: dịch *không hề nao núng*; Sujato *undismayed*, bản Việt nguyên bài *không tiếc nuối*. Không phân xử được hai cách đọc; cả hai cùng chỉ một thái độ không dao động của Subhā.
  · `31.3` `handa te cakkhuṁ harassu taṁ`: *te* dịch là *của ông*; bản Việt nguyên bài *con mắt cho ông*; Sujato *take this eye*.
  · `32.1`–`32.2` `tassa ca viramāsi tāvade, rāgo …`: chủ ngữ `rāgo` nằm ở dòng sau; Việt giữ ranh giới khoá, vì vậy chữ *tham* nằm ở `32.2`.
  · `33.4` `api nu sotthi siyā khamehi no`: Sujato đọc `sotthi siyā` là lời chúc dành cho Subhā, bản Việt nguyên bài đọc là câu hỏi về sự an ổn của gã. Dịch *liệu có được bình an chăng?* mà không nêu ai; `no` dịch *tôi* (người nói là một người). `32.3` `sotthi siyā brahmacārinī` dịch *Xin cho nàng được bình an* theo cả hai.
  · `34.3` `passiya varapuññalakkhaṇaṁ`: dịch sát *thấy tướng phước đức cao quý*; Sujato *the one with excellent marks of merit*. `34.4` kết `-nti`; dấu `ti` đóng lời nhưng không có nháy mở trong Pāli, nên không đưa vào Việt.
  · `8.2` `kuñjaramattakareṇuloḷitaṁ`: dịch *bị voi đực động dục và voi cái quấy động*; `matta` là trạng thái động dục của voi đực. `13.1`–`13.4`: các tính từ trước và sau `sayanaṁ` (`13.3`) cùng chỉ chiếc giường; `sāragandhika` dịch *thơm mùi lõi gỗ*. `12.2` `mālavaṇṇakaṁ` dịch *tràng hoa và phấn* (`vaṇṇaka` là mỹ phẩm, phấn thoa).
  · `24.2` `maggaṭṭhaṅgikayānayāyinī`: dịch *đi bằng cỗ xe của con đường tám chi phần*; `ariya` không có trong Pāli nên không viết *Thánh đạo*.
