    `…pe…`: Pāli **0** khoá. `… cho đến …`: **0**. `(…)` trần: Pāli **0** khoá, Việt **0** (bài này không có khoá nào mang `(…)`, nên điều khoản giữ nguyên `(…)` không áp dụng). Pāli kết `….` ở `35.1` ⇒ Việt kết ` ….`.
