notes: |-
  **Phạm vi: đủ 141/141 khoá của bài, không khoá nào ngoài danh sách.** Thứ tự khoá trong tệp
  bản dịch bằng đúng thứ tự Pāli (kiểm bằng phép so danh sách, không dùng phép cân tổng).

  **Nguồn và coverage — đo theo công thức khai ở `source/layers.yaml`
  (`substantivePaliMinChars: 40`, bỏ khối `:0`), tầng Anh tra qua manifest đã ghim:**
  · Độ dài Pāli lớn nhất của một khoá là **32 ký tự** (`35.1`, colophon), toàn kệ ngắn ⇒ **mẫu số cổng = 0/138**
    (138 khoá thân bài, `1.1`–`36.1`, bỏ ba khoá tiêu đề `0.1`–`0.3`). ⚠ Cổng coverage **không đo được gì** ở bài này; con số
    hiển thị không phải bằng chứng Sujato dịch đủ.
  · Đo thô thay thế: bản Anh Sujato đã ghim **có tệp** `thig14.1_translation-en-sujato.json` (manifest liệt kê tệp này; cùng tập khoá với Pāli),
    **136/138 khoá thân bài có chữ = 98,6%**; hai khoá để trống là `35.1` (colophon `… Subhā jīvakambavanikā therī ….`) và `36.1`
    (`Tiṁsanipāto niṭṭhito.`); bỏ riêng hai colophon thì 136/136. Ba khoá `0.x` cũng có chữ. Cả hai số đều ≥ 0,80, không cần entry `reference-gaps`.
  · Tầng `english-project` **vắng** (không có tệp cho uid này, và không cần lấp vì không có khoá kệ nào Sujato bỏ trống ngoài hai colophon).
    Tầng `vietnamese-current` **vắng** (tại commit đã ghim thư mục Việt hiện hành chỉ có Pháp Cú). Bản Việt nguyên bài của SuttaCentral
    (Bhikkhu Indacanda, nhóm Ba Mươi, 14.1) chỉ là mục *Tra cứu toàn văn* ở cuối trang, không phải tầng store, nhưng đã đọc để đối chiếu cách đọc cú pháp và
    cách gán người nói. ⇒ `triangulation` **8,9**: Pāli + một tầng Anh đủ, không có tầng Việt phân đoạn, không có bản Anh độc lập thứ hai. Các chỗ
    Sujato và bản Việt nguyên bài khác nhau hoặc cùng khác Pāli ghim đều ghi ở mục bất định. Bản Anh của Sujato có hai thẻ định dạng lạc
    (`<j>` ở `17.2`, `<em>` ở `22.4`) — không ảnh hưởng nghĩa, chỉ là hình thức của bản upstream.

  **Tái dùng nguyên văn — dựng chỉ mục Pāli→Việt ở mức segment trên toàn tầng đã dịch (gồm `thig13.1`–`thig13.5`):**
  chỉ **1 khoá** của bài có Pāli trùng nguyên văn (chuẩn hoá chữ hoa, dấu câu, nháy) với khoá ở bài khác đã dịch: `0.2` (*Bộ Ba Mươi Bài Kinh* —
  `ja512:0.2` và `thag17.1:0.2`, **2 nơi**), **giữ nguyên văn bản Việt cũ**; số cặp trùng ngoài bài mà bản Việt khác: **0**. Các khoá kệ của bài không có Pāli trùng
  với bài nào khác ở tầng đã dịch (phép chuẩn hoá bỏ dấu câu, chiều dài ≥ 8 ký tự). `0.1` (*Therīgāthā 14.1*) trùng dạng Pāli có chủ đích, như các khoá `:0.1` khác trong tầng.
  Colophon `35.1` theo khuôn `… Trưởng lão nữ Subhā, con gái người thợ rèn ….` ở `thig13.5:30.1` (*… Trưởng lão nữ [tên] ….*); `36.1` theo
  `thig13.5:31.1`, `thig8.1:10.1` (*… đã khép lại*): trên các khoá `nipāto niṭṭhito` của `thig`/`thag`, *khép lại* **13**, *hoàn tất* **8**, *kết thúc* **3**, *chấm dứt* **2**, *viên mãn* **2**; chọn dạng đa số, cũng là dạng của bài liền kề.

  **Năm phép kiểm (tự viết, in số kèm mẫu số):**
  · (1) `set(khoá Việt) == set(khoá Pāli)`: **141 / 141**, thiếu **0**, thừa **0**; thứ tự khoá khớp Pāli. Phép **có đo được**.
  · (2) Nháy kép và nháy đơn **khớp Pāli từng khoá**: lệch **0**. Pāli mở `“` ở **8 khoá** (`2.1`, `5.1`, `15.1`, `16.1`, `19.1`, `31.3`, `32.3`, `33.1`) và
    đóng `”` ở **8 khoá** (`4.4`, `14.4`, `15.4`, `18.4`, `30.4`, `31.3`, `32.4`, `33.4`); Việt cùng 8 + 8 khoá, cùng vị trí. Nháy đơn `‘’`: Pāli **0**, Việt **0**.
    Dấu cuối khoá: Pāli kết `”.` ở `4.4`, `14.4`, `15.4`, `18.4`, `30.4`, `32.4`, `33.4`, Việt kết `?”` hoặc `.”` theo cú pháp tiếng Việt (câu hỏi ở `4.4`, `15.4`, `33.4`); `31.3` Pāli kết `”,`, Việt `,”`.
    Lượt lời: `1` lời dẫn truyện; `2`–`4` Subhā nói với kẻ chặn đường (mở ở `2.1`, đóng ở `4.4`); `5`–`14` kẻ ấy nói với Subhā (mở ở `5.1`, đóng ở `14.4`);
    `15` Subhā (`15.1`–`15.4`); `16`–`18` kẻ ấy (`16.1`–`18.4`); `19`–`30` Subhā (`19.1`–`30.4`); `31.1`–`31.2` và `31.4` lời dẫn truyện, với `31.3` là lời của Subhā
    xen giữa; `32.3`–`32.4` và `33` lời kẻ ấy xin tha; `34` lời dẫn truyện; `35`–`36` colophon. Cách gán người nói theo ngữ cảnh và trùng với cả Sujato lẫn bản Việt nguyên bài;
    Pāli không ghi tên người nói ở đầu lời.
  · (3) Pāli trùng nguyên văn trong bài: **6 nhóm** (12 khoá: `3.4`≡`4.4`, `5.4`≡`6.4`, `10.3`≡`18.3`, `16.3`≡`17.3`, `20.4`≡`21.4`, `26.4`≡`27.4`), bản Việt khác về
    nội dung **0 nhóm** (cả 6 nhóm Việt giống hệt, trừ nháy đóng ở `4.4`). Phép **có đo được**. Hai cặp có Pāli gần trùng nhưng không phải nguyên văn: `2.2` (*Yaṁ maṁ ovariyāna tiṭṭhasi*) khác `3.4`/`4.4`
