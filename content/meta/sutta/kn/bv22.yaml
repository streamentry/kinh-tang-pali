notes: |-
  Đợt 19, làn 81. Dịch từ Pāli root commit đã ghim, đủ 114/114 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ hai mươi của Buddhavaṃsa (đánh số 22 trong tệp), về Đức Phật Sikhī: ba lần chứng ngộ và ba kỳ hội chúng, tiền thân Arindama dâng cúng và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng và hào quang, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn 9/9 tiền lệ (`bv16`, `bv18`, `bv29`…).
  - `0.2` “22. Dòng Kế Thừa Của Đức Phật Sikhī”: cùng khuôn với `bv20:0.2`, `bv24:0.2`.
  - `29.1` “thứ hai mươi”: `vīsatimo` = 20; Sikhī là vị Phật thứ hai mươi trong danh sách, khớp cách đánh số các phẩm anh em (`bv24:28.1` thứ hai mươi hai cho Kakusandha).

  **Số Pāli, đã tự tính.** `koṭisatasahassa` = 1 koṭi × 100 × 1.000 = **một trăm ngàn koṭi** (3.3; dùng lại nguyên văn 8/8 tiền lệ). `navutikoṭisahassa` = 90 × 1.000 = **chín mươi ngàn koṭi** (4.3; tiền lệ `bv15:5.3`). `asītikoṭisahassa` = 80 × 1.000 = **tám mươi ngàn koṭi** (5.3; `bv15:6.3`). `bhikkhusatasahassa` = 1 × 100.000 = **một trăm ngàn** tỳ-kheo (7.1; số đứng trước `sata` ở đây không có nên là một trăm, như 3.3). `asītibhikkhusahassa` = 80 × 1.000 = **tám mươi ngàn** (7.3). `sattatibhikkhusahassa` = 70 × 1.000 = **bảy mươi ngàn** (8.1). `tayo` 3 (6.1 ba kỳ hội chúng khớp ba cuộc tụ hội 7.2, 7.4, 8.2; ba lần chứng ngộ khớp `3.4`, `4.4`, `5.4`; 16.4 ba lâu đài khớp ba tên ở 16.3: Sucandaka, Giri, Vasabha). `ekatiṁsa` 30 + 1 = **ba mươi mốt** kiếp (12.3). `dasapāramī` 10 (14.4). `sattavassasahassa` 7 × 1.000 = **7.000 năm** (16.1). `catuvīsasahassa` 24 × 1.000 = **24.000** người nữ (17.1; đây là đếm người nữ, không phải cụm `Tiṁsakappasahassa`). `caturo` 4 (18.1). `aṭṭhamāsa` 8 tháng (18.3). `sattatihattha` 70 hattha (23.2). `tīṇiyojana` 3 do-tuần (24.4, 28.4). `sattativassasahassa` 70 × 1.000 = **70.000 năm** (25.1). `dvattiṁsa` 32 (23.4, 27.2). `vīsatimo` 20 (29.1). Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt hiện có (draft và published; so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 56 khoá của bài có Pāli trùng với khoá bài khác, tổng 1.169 cặp, trong đó 64 cặp có Việt khác bản tôi viết (phần lớn chỉ khác dấu cuối hay một chữ nhỏ); 51 khoá (kể cả `0.1`) dùng đúng nguyên văn một tiền lệ (so sau khi bỏ dấu câu cuối): `0.1`, `1.2`, `2.2`, `2.4`, `3.1`, `3.3`, `3.4`, `4.3`, `4.4`, `5.3`, `5.4`, `6.1`, `6.3`, `6.4`, `7.2`, `7.4`, `8.2`, `9.1`, `12.1`, `12.4`, `13.1`, `13.2`, `13.3`, `14.1`, `14.2`, `14.3`, `14.4`, `16.2`, `16.4`, `17.2`, `18.1`, `18.2`, `18.4`, `19.1`, `19.3`, `19.4`, `20.2`, `21.2`, `21.3`, `22.2`, `22.4`, `23.3`, `23.4`, `25.2`, `25.3`, `25.4`, `26.4`, `27.3`, `27.4`, `28.3`, `28.4`; 5 khoá còn lại có Pāli trùng mà Việt khác mọi tiền lệ: `12.2`, `12.3`, `15.2`, `19.2`, `27.2` (lý do ngay dưới).
  - `12.3` ‘Ekatiṁse ito kappe’: **cố ý khác** 25/25 tiền lệ (các khoá `tha-ap`, `thi-ap`, `thag2.49`, `bv28:17.1` dịch “Vào ba mươi mốt kiếp trước (đây)”, “Từ … trước”, “Cách đây …”). Các tiền lệ đều là người kể nhìn ngược về quá khứ. Ở bài này đó là lời thọ ký tương lai (`ayaṁ buddho bhavissati`, 12.4), nên hướng đếm ngược lại: 31 kiếp **sau** thời Sikhī là thời Gotama. Viết “Sau ba mươi mốt kiếp nữa,”, cùng hướng với `bv16:11.3`, `bv17:10.3`, `bv20:9.3`. Pāli ở `12.3` không có chữ chỉ hướng, hướng lấy từ động từ ở `12.4`.
  - `12.2`, `19.2` `sikhī lokagganāyako`: tiền lệ `thi-ap39:3.2`, `tha-ap354:2.2` dịch “Đức Sikhī, bậc Lãnh Đạo tối thượng của thế gian;” (2/2). Chọn “Sikhī, bậc Dẫn Đạo tối thượng của thế gian;” để cùng chữ với `bv20` và `tha-ap332:5.2`; đo `lokagganāyak-`: 22 khoá, “tối thượng” 14, “Đạo Sư” 8, “Lãnh Đạo” 5, “giáo chủ” 5, “Dẫn Đạo” 4.
  - `9.1` “Vào lúc ấy, ta,”: 9 cặp, 3 khác (hai tiền lệ “Vào lúc ấy tôi,” của `tha-ap341`, `thi-ap11`, một “Vào thời ấy, ta”); chọn “ta” vì người kể ở đây là Đức Phật Gotama, như các phẩm cùng bộ. `14.1` “Nghe lời ấy của vị ấy,”: 18 cặp, 10 “Nghe lời ấy của người ấy,” (Pāli `Tassāhaṁ`), 1 “… của vị ấy”; dùng “vị ấy” vì người nói là Đức Phật. `15.2` bỏ chữ “có” ở đầu vì 15.1 đã nêu thành ở khoá liền trước, tiền lệ thi-ap có “có vị Sát-đế-lợi tên là Aruṇa;” (2). `25.4` “vị ấy đã đưa đông đảo mọi người vượt qua.” 4/5, 1 khác `tha-ap343:1.4`. `27.2` “ba mươi hai tướng cao quý;” khác `tha-ap446:1.2` “với ba mươi hai đặc trưng;” (1 cặp), theo `bv15:23.2`. `2.2` “đã đạt giác ngộ tối thượng;” 11 cặp, 6 khác ở chủ ngữ “ta đã” (`cp35` kể ngôi thứ nhất, ở đây là Đức Phật nói về Sikhī) và dấu cuối.
  - Trùng trong chính bài: 2 nhóm Pāli trùng (`sikhissāpi mahesino` ở `6.2`, `15.4`, `20.4`: 3 khoá, 3 cặp; `sikhī lokagganāyako` ở `12.2`, `19.2`: 2 khoá, 1 cặp), tổng 4 cặp. `12.2`/`19.2` giống hệt. `15.4`/`20.4` giống hệt (“của Sikhī, bậc Đại Ẩn Sĩ.”). `6.2` **cố ý khác** (“cũng nơi Sikhī, bậc Đại Ẩn Sĩ;”) vì ở đó `sikhissāpi` đi với `sannipātā` (kỳ hội chúng xảy ra nơi Ngài) và giữ chữ “cũng” cho `-pi`, cùng cách với `bv20:5.2` ⇒ 2 cặp khác (6.2 với 15.4, 6.2 với 20.4).

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có của `kn`, trừ chính bài này).
  - `mahesi` → “Đại Ẩn Sĩ” (71 trên 135 khoá chứa `mahesi`; “Đại Hiền” 3, “Đại Tiên” 2). `khattiya` → “Sát-đế-lợi” (28 trên 36 khoá chứa `khattiyo nāma`). `aggasāvaka/-ikā` → “đệ tử thượng thủ / nữ đệ tử thượng thủ”, `aggupaṭṭhaka/-ikā` → “thị giả hàng đầu / nữ thị giả hàng đầu” (“thượng thủ” 11, “hàng đầu” 6 trên 19 khoá; cùng khuôn `bv15`–`bv18`, `bv20`, `bv24`). `pāsāda` → “lâu đài” (12 trên 35; “cung điện” 7, “cung” 7; chọn “lâu đài” theo cùng công thức `tayo pāsādamuttamā` ở 7/7 phẩm anh em). `atrajo` → “người con ruột” (8 trên 17). `hatthiyāna` → “xe voi” (`bv20:17.2`). `byāmappabhā` → “hào quang một sải” (8 trên 9, `bv27:20.3`). `abhisamaya` → “chứng ngộ” (9 trên 35), `samāgama` → “tụ hội” (16 trên 39), `sannipāta` → “hội chúng” (7 trên 27), theo `bv16`, `bv18`, `bv20`.
  - `Mārasenaṁ pamadditvā` → “đập tan đạo quân Māra” (`snp3.7:26.2`, `thag16.6:14.2`: “đập tan đạo quân Māra”, 4/4 khoá có `Mārasenappamaddan-`). `puṅgava` → “ưu việt” (4 trên 10; “đầu đàn” 5 là bò đực đầu đàn, không áp dụng cho `jinapuṅgava`). `gaṇaseṭṭha` → “tối thắng trong đoàn chúng” (`snp5.19:28.4`, 1/1). `appaṭipuggala` → “không ai sánh bằng” (4 trên 5); `asama` → “vô song”. `anubyañjana` → “tướng phụ” (`tha-ap228:2.1`, 1/2). `lakkhaṇa` → “tướng”. `yamakapāṭihāriya` → “thị hiện song đôi” (`mil5.1.2:9.2`, `bv24:4.2`). `anupalitta` → “không nhuốm bẩn” (5 khoá `anupalitt-`). `annapāna` → “thức ăn thức uống” (`tha-ap4:7.4`). `tappayati` → “làm cho no đủ” (`tha-ap45:8.4`, `bv16:2.3`). `kappiya` → “thích hợp” (`pv5:3.4`, `kp7:3.4`). `temayati` → “làm thấm ướt” (`mil5.5.9:19.3`, `ja490:9.4`; 3 khoá, đều dịch “làm ướt/thấm ướt”). `padhānacāra` → “hạnh nỗ lực tinh tấn”, `Suốt tám tháng` theo `bv15:18.3`, `bv20:17.3` (“Suốt sáu tháng”). `Kapilavhaya` → “nơi mang tên Kapila” (`bv24:11.1` dùng đúng nguyên văn). `buddhappamukha saṅgha` → “Tăng đoàn có Đức Phật dẫn đầu” (`ud2.8:9.1`, `ud4.3:5.2`: “Tăng đoàn tỳ-kheo với Đức Phật dẫn đầu”). `ratana`, `hattha`, `koṭi` giữ nguyên chữ Pāli như `bv18`, `bv20`, `bv16`.
  - Tên riêng giữ dạng Pāli có dấu: Vipassī, Sikhī, Arindama, Aruṇavatī, Aruṇa, Pabhāvatī, Sucandaka, Giri, Vasabha, Sabbakāmā, Atula, Abhibhū, Sambhava, Khemaṅkara, Sakhilā, Padumā, Puṇḍarīka (tên cây Bồ-đề, giữ nguyên), Sirivaḍḍha, Nanda, Cittā, Suguttā, Assārāma, Kapila, Māra.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `5.1`–`5.2` `yamakapāṭihāriyañca dassayante sadevake`: tôi đọc `sadevake` là định cách “ở thế gian cùng chư thiên” (nơi thị hiện). Cách đọc khác: “cho thế gian cùng chư thiên” (nơi nhận). Không thay đổi nghĩa chính; chọn cách sát hình thái định cách.
  2. `7.1`–`8.1` `-sata-sahassa-`/`-sahassa-` ở khoá chỉ đếm tỳ-kheo: đọc `bhikkhusatasahassānaṁ` là 1 × 100.000 (không có số đứng trước `sata`), `asītibhikkhusahassānaṁ` 80.000, `sattatibhikkhusahassānaṁ` 70.000. Cách đọc khác của `bhikkhusatasahassānaṁ` là “hàng trăm ngàn” (không xác định). Không thêm danh từ nào ngoài “tỳ-kheo” do chính hợp chất.
  3. `8.3`–`8.4` `anupalitto padumaṁva toyamhi sampavaḍḍhitaṁ`: `anupalitto` giống đực, `padumaṁ … sampavaḍḍhitaṁ` trung tính; tôi đọc hai câu thành một so sánh “không nhuốm bẩn, như hoa sen được nuôi lớn trong nước” mà không gán chủ ngữ. Chủ ngữ ngầm có thể là Sikhī, các tỳ-kheo hội chúng, hoặc cả hai; Pāli không nêu.
  4. `10.1`–`10.2` `dussavaraṁ … dussakoṭiṁ anappakaṁ`: `dussavara` đọc “vải thượng hạng”; `dussakoṭiṁ` đọc “một koṭi tấm vải” (koṭi là đơn vị đếm, giữ nguyên chữ Pāli), `anappakaṁ` “không phải ít” (cf. `bv24:8.4` “không ít”). Cách đọc khác: `koṭi` ở đây là “vô số/một khối lớn” hơn là con số chính xác mười triệu. Không có tiền lệ cho `dussakoṭi` trong tầng.
  5. `11.1`–`11.2` `hatthiyānaṁ nimminitvā, kappiyaṁ upanāmayiṁ`: đọc “sau khi biến đổi chiếc xe voi, ta đã dâng lên thứ thích hợp”, theo ý hiểu là xe voi không dùng được cho Tăng nên được đổi thành vật dụng thích hợp. Pāli không nói rõ “đổi thành vật gì” hay “bằng cách nào”; không thêm. `nimminitvā` ở tầng thường là “hóa hiện/tạo ra” (`cp19:7.2`, `ud2.1:3.2`), ở đây giữ “biến đổi” vì xe voi đã có (10.3).
  6. `11.3`–`11.4` `pūrayiṁ mānasaṁ mayhaṁ, niccaṁ daḷhamupaṭṭhitaṁ`: đọc `mānasaṁ` là “tâm ý”, `pūrayiṁ` là “làm cho tràn đầy”, `upaṭṭhitaṁ` là “hiện khởi” bổ nghĩa `mānasaṁ`. Cách đọc khác: “ta đã làm tròn ý nguyện của mình, ý nguyện luôn hiện tiền vững chắc” (đồng nghĩa nhưng thiên về `mānasa` là “ý định/nguyện”). Giữ nghĩa sát chữ nhất.
  7. `13.2` `…pe…`: đoạn lược che phần giữa lời thọ ký (cùng lược với `bv16`, `bv17`, `bv18`, `bv20`, `bv24`), nên không thể xác định “chúng ta” là ai; giữ một dấu `…` theo Pāli, dịch sát chữ `hessāma sammukhā imaṁ`. Nháy đơn mở ở `12.3`, đóng ở `13.3` theo Pāli từng khoá; nháy kép mở ở `1.1`, đóng ở `28.4` theo Pāli.
  8. `20.3` `khemaṅkaro nāmupaṭṭhāko`, `22.2`/`22.4` `aggupaṭṭhaka/-ikā`: truyền thống chú giải hiểu `aggupaṭṭhaka/-ikā` là những người hộ độ tại gia hàng đầu, khác `upaṭṭhāka` (thị giả); Pāli không nói tại gia hay xuất gia nên dịch cùng một chữ “thị giả”, thêm “nữ” cho số ít nữ, như `bv20:21.2`.
  9. `21.3`–`21.4` `puṇḍarīkoti vuccati`: đọc `puṇḍarīka` là tên cây Bồ-đề, giữ nguyên chữ Pāli. Cách đọc khác: “hoa sen trắng” (nghĩa thường của `puṇḍarīka`); Pāli nói đây là tên được gọi của cây, nên giữ tên riêng không dịch nghĩa.
  10. `23.1`–`23.2` `uccattanena so buddho, sattatihatthamuggato`: “về chiều cao” (cách cách), “vươn lên bảy mươi hattha”; `hattha` (khuỷ tay) giữ chữ Pāli như `bv15`, `bv16`, `bv17`, không quy đổi. `23.3` `kañcanagghiyasaṅkāso` dịch “cột trụ bằng vàng”, dùng nguyên văn `bv18:21.3`.
  11. `24.1`–`24.4`: `byāmappabhā … niccharanti … tīṇiyojanaso pabhā` đọc “hào quang một sải … tỏa ra … hào quang ba do-tuần” như `bv18:21`; `tīṇiyojanaso` “ba do-tuần” (hậu tố `-so` phân bố), không rõ là bán kính hay đường kính; giữ “ba do-tuần”. `disodisaṁ` “từng phương từng hướng”.
  12. `26.2`–`26.3` `temayitvā sadevake`, `khemantaṁ pāpayitvāna`: “làm thấm ướt thế gian cùng chư thiên” (ẩn dụ mưa Pháp), “dẫn đến chốn an ổn”; `khemanta` đọc “nơi an ổn”, nghĩa Niết-bàn là cách hiểu truyền thống, không đưa vào. Tân ngữ của `pāpayitvāna` không nêu trong Pāli; không thêm “họ”.
  13. `1.3` `sikhivhayo āsi jino`: “mang tên Sikhī” theo `kapilavhaya` (`bv24:11.1`, “mang tên Kapila”).

