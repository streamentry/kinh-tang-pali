notes: |-

  **Tầng Anh có mặt nhưng thiếu đúng một khoá.** 8/9 khoá có tiếng Anh Sujato tại commit đã ghim. Khoá thiếu là dòng kết *… X thero ….* (`:1.5`), vốn là dạng lược của công thức quy kết *Itthaṁ sudaṁ … gāthaṁ abhāsitthāti*. Tôi **không** mở rộng dòng kết: BRIEF_VI3 §10.1 nói thẳng *Pāli có dấu lược thì bản Việt giữ nguyên, không bao giờ mở rộng* — mở rộng là thêm chữ KHÔNG ĐÁNH DẤU, và đã có tiền lệ sai thật (ba ngọn lửa `rāgagginā…` bị nhân sang `sn35.29:1.15`). Tiền lệ có sẵn trên đĩa làm đúng như vậy và đã `published`: `thag1.42` là ngoại lệ ngược lại, tôi **không** theo. Số dấu lược của mọi khoá `:1.5` bằng Pāli (2 = 2). Không đối chiếu được tầng Việt hiện hành như đã nói ở trên.
  **Đặt kinh theo thứ tự khoá của lát này** (`0.1` = Theragāthā + số · `0.2` = Ekakanipāta · `0.3` = vagga · `0.4` = tên bài kệ) — cùng thứ tự với `thag1.42`, `thag1.107`, bài đã `published`. `Ekakanipāta` → *Bộ Một Bài Kinh* (159 lần trong tầng kn; chỉ `thag1.1:0.2` viết *Tập Một*). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>* (25 lần, so với 4 lần *Bài Kệ…*). `Theragāthā 1.N` giữ **số** như `thag1.42:0.1`. ở `:1.5` Pāli dùng dạng chủ cách (*Cittako*, *Suppiyo*, *Suyāmano*…); bản Việt dùng dạng gốc để thống nhất với tên bài kệ, đúng cách `thag1.113` (`Vanavaccho` → *Vanavaccha*), `thag1.34` (`Posiyo` → *Posiya*), `thag1.46` (`Samiddhitthero` → *Samiddhi*) đã làm.

  **Tên riêng giữ nguyên dạng Pāli** và đều xác minh được trong Pāli đã ghim (không phải đặt mới): Suyāmana, Cittaka, Suppiya, Sīha, Mettaji (thẳng); Ramaṇīyavihārin, Añjanavaniya, Vimalakoṇḍañña (giữ âm, dạng gốc). `lọt_pāli` trong `_hvi.py` chỉ quét khoá Pāli ≥ 40 ký tự mà mọi khoá của Theragāthā đều ngắn hơn, nên tên có dấu ở đây không bị chặn; tôi vẫn tra lại từng tên.
  **Đây là bài mạnh nhất lát về thuật ngữ, vì tiền lệ khớp cả danh sách chứ không khớp từng chữ.** `an10.20:3.2` và `an10.12` có đúng danh sách năm sự theo cùng thứ tự và đã dịch thành *dục tham · sân hận · hôn trầm thụ miên · phóng dật hoặc hối · hoài nghi*. Tôi theo cùng cách cho bốn mục `kāmacchanda` / `byāpāda` / `thinamiddha` / `vicikicchā`. Riêng `uddhacca` ở đây đứng **riêng** (Pāli là `Uddhaccaṁ`, không phải `uddhaccakukkucca` như trong danh sách AN), nên tôi theo tiền lệ của chính chữ đó: `an6.116` `Uddhaccasutta` → *Kinh Đi Quá Đà* và `Uddhaccaṁ, asaṁvaro, pamādo` → *Đi quá đà, thiếu giữ gìn, và phóng dật*. `iti111` dùng *trạo cử hối quá* cho `uddhaccakukkucca`, tức là cho cụm, không cho chữ đơn — giữ hai nghĩa riêng là đúng, không phải trôi.

  **Thuật ngữ, đếm được.** `sabbaso` → *chẳng hề*; `na vijjatī` → *có trong*. `bhikkhuno` ở `:1.2` là danh từ sở hữu của cả danh sách (*của tỳ-kheo*), nên mệnh đề ở 1.4 là *trong người ấy* — chủ ngữ là cả danh sách, nên tôi dùng mạch danh (*chẳng hề có*) thay vì chia động từ từng mục, và số ít của Pāli không bị ép thành số nhiều trong tiếng Việt.

  **Bất định đã ghi.** `sabbaso` là *hoàn toàn, bằng mọi cách*; tôi dịch *chẳng hề* vì Sujato cũng vậy (*not … at all*), nhưng đây là bản dịch bớt mạnh hơn nghĩa gốc. Không có segment nào trong bài đủ 40 ký tự nên chốt không tự bắt lỗi; tôi tự kiểm như đã nêu.**Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm — ở lát này chỉ 0/155 khoá Pāli đủ 40 ký tự, nên chốt tự kiểm 0% và assertion còn lại không tự chạy; phần tôi tự kiểm: 9/n khoá có mặt và không thừa khoá, đúng segment ID, mọi chuỗi NFC, không khoá rỗng, không khoá nội dung nào trùng nguyên văn Pāli, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài và không bao giờ âm, không còn `(…)`, không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (lát này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Theragāthā 1.N Aṅguttara Nikāya 11 không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.
