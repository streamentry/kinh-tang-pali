notes: |-
  Đủ 15/15 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Khung: Haṁcivagga → Phẩm Haṁci (9 bài, không bài nào dùng cách khác); `Haṁcivaggo dvādasamo.` → Phẩm Haṁci, thứ mười hai. `Bandhanamokkhajātaka` tôi dịch Kinh Thoát Khỏi Trói Buộc. Đã kiểm tra va chạm với tiền lệ: ja201 là `Bandhanāgārajātaka` (khác chữ, Pāli là nhà trói buộc) nên không xung đột, còn Kinh Nhà Trói Buộc ở ja201 không phải bản dịch của cùng một tên bài.

  Nghĩa bài là nghịch lý trung tâm, tôi giữ nguyên và không giải thích thêm trong thân kinh: `Abaddhā tattha bajjhanti` / `Baddhāpi tattha muccanti` — không trói thì lại mắc kẹt, đã trói thì lại thoát ra. Nếu thêm câu giải thích vào đây thì đó là ý của người dịch chứ không phải của kinh, nên tôi để ở notes này.

  `dhīrā` → bậc trí (đếm trên tầng: 4 khoá dịch bậc trí, các cách khác rải rác 1 khoá); `pabhāsare` → cất tiếng nói (giữ động từ, không rút thành danh từ như nói lời).
  `pabhāsare` xuất hiện cả hai vế nên tôi dùng cùng một cách ở 1.2 và 1.4 để sự tương phản đúng như Pāli: nơi kẻ ngu cứ nói lung tung / nơi bậc trí cất tiếng nói.

  Uddāna `Atha gadrabha sattuva kaṁsasataṁ, / Bahucinti sāsikāyātikara; / Ativela visesamanācariyova, / Dhīrāpabhāsaratena dasāti.` Tôi giữ các tên, chỉ dịch `atha` thành Rồi và vế đếm số. Không có tầng Anh đã ghim cho bài này nên tôi không có cách nào kiểm chứng các tên này trừ việc so với tên mười bài trong phẩm; kết quả so là không khớp một-một (Haṁcivagga là ja111–ja119 với tên Gadrabhapañha, Amarādevīpañha, Siṅgāla, Mitacintī, Anusāsika, Dubbaca, Tittira, Vaṭṭaka, Akālarāvi), trong khi uddāna lại ra Gadrabha, Sattuva, Kaṁsasata... Nên tôi giữ tên và ghi bất định. Ghi cả ở đây vì có thể là đặc điểm chung của các uddāna trong bản chụp này, không riêng bài này.

  LỖ HỔNG TẦNG THAM KHẢO: Không có tầng tham khảo English Sujato tại commit đã ghim: đã duyệt .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ và không có tệp cho uid này (0/15 khoá có prose), và tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên Khuddaka Nikāya cũng không có bản Hòa thượng Thích Minh Châu; bài dịch chỉ từ Pāli, chưa đối chiếu được tầng tham khảo nào nên giữ draft. Mọi khoá Pāli dưới 40 ký tự nên mẫu số coverage rỗng, bài vẫn giữ draft vì không có tầng tham khảo nào để đối chiếu. Bản Việt hiện hành không có cho Jātaka.

