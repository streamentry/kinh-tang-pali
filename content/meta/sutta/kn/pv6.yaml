notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này tại commit đã ghim.
  Pāli trùng nguyên văn: dựng chỉ mục toàn tầng thì 206/294 khoá của lát có Pāli trùng nguyên văn ở nơi khác; riêng bài này 12/42 khoá trùng và 9 chỗ đã có bản Việt — nhiều nhất trong số đó **không có bản Việt ở nơi trùng** (chỉ có Pāli ở `pv13`, `pv14`, `pv15`, `pv31`, `pv7` cùng câu), nên phần lớn phải tự dịch.
  Đã dùng lại nguyên văn: `:2.1` `“Ahaṁ bhadante petīmhi,` → Bạch ngài, con là ma (1 chỗ) · `:2.2` `duggatā yamalokikā;` → sinh về cõi khổ xa xôi, thuộc cõi của Yama (đã có sẵn ở `pv44:2.2`) · `:2.3` `Pāpakammaṁ karitvāna,` → đã tạo nghiệp ác (2 chỗ) · `:5.1` `“Kiṁ nu kāyena vācāya,` → Điều ác gì là do thân, do lời nói (2 chỗ) · `:5.2` `manasā dukkaṭaṁ kataṁ;` → do ý mà đã làm (2 chỗ) · `:5.3` `Kissa kammavipākena,` → Do quả báo của nghiệp nào (3 chỗ) · `:9.1` `Tassa kammassa vipākena,` → Do quả báo của nghiệp ấy (1 chỗ) · `:9.2` `musāvādassa cūbhayaṁ;` → cùng nghiệp nói dối cả hai điều (1 chỗ).
  Tên phẩm và tiêu đề bài theo đúng khuôn của bốn bài lân cận cùng phẩm đã có bản Việt (`pv2`, `pv3`, `pv4`, `pv8`, `pv9`): `Petavatthu` giữ nguyên (17/17 chỗ) · `Uragavagga` → Phẩm Rắn (5/5 chỗ) · `Pañcaputtakhādapetivatthu` → 6. Chuyện Ngạ Quỷ Ăn Thịt Năm Đứa Trẻ, và dòng đóng `… chaṭṭhaṁ.` → Chuyện ngạ quỷ ăn thịt năm đứa trẻ, thứ sáu (chữ thường ở đầu dòng đóng, đúng như `pv4:5.1` và `pv8:9.1`). `Piyālaphala` không có tiền lệ nên `puttakhāda` dịch thẳng là ăn thịt trẻ con.
  Bất định đã ghi, không che: (1) `vāyasi` ở `:1.2` không có tiền lệ trong tầng và cũng không rõ nghĩa chắc chắn; tôi dịch túi đựng theo nghĩa bao túi, nhưng cách hiểu thứ nhất còn có thể là bộ quạt/bơm, nếu vậy câu này cần xem lại. (2) `pubbalohitamakkhitā` ở `:9.4` — `makkhita` là bôi vẽ/quét, `lohita` là máu, còn `pubba` có thể là bổ nghĩa cho thịt (thịt đã bị bôi vẽ bằng máu) hoặc cho chủ thể (chính bà ấy từng bôi vẽ mình bằng máu); tôi chọn cách đầu, ít giả định hơn, và không thêm chủ thể nào vào thân kinh. (3) `pagghari` ở `:7.2` là trở thành/hình thành, tôi dịch là một khối máu, không suy thêm giai đoạn thai nghén.
  Dấu lược: bài này không có `…pe…` ở Pāli (đã kiểm 42/42 khoá), nên không có dấu lược nào để giữ và không có chỗ nào bịa dấu lược che chỗ thiếu. Dấu nháy kép: 4 cặp `“`/`”` ở Pāli, bản Việt giữ đúng 4 cặp và cân trên cả bài (`:1.1` mở, `:1.4` đóng; `:2.1` mở, `:4.4` đóng; `:5.1` mở, `:5.4` đóng; `:6.1` mở, `:9.4` đóng).
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Đã tự xác minh được: JSON hợp lệ, đủ 42/42 khoá trong `all` và trùng khớp 42/42 khoá Pāli trong `root/pli/ms/sutta/kn/pv/pv6_root-pli-ms.json`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt vào bản Việt, không trùng nguyên văn Pāli ở khoá có nội dung, Pāli trùng nguyên văn trong chính bài (`:8.3` và `:9.3` cùng là `Puttamaṁsảni khādāmi,`) đã dịch giống hệt nhau, và YAML parse sạnh. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.