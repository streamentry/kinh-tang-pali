notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này tại commit đã ghim.
  Pāli trùng nguyên văn: dựng chỉ mục toàn tầng thì 206/294 khoá của lát có Pāli trùng nguyên văn ở nơi khác; riêng bài này 12/42 khoá trùng và 9 chỗ đã có bản Việt — nhiều nhất trong số đó **không có bản Việt ở nơi trùng** (chỉ có Pāli ở `pv13`, `pv14`, `pv15`, `pv31`, `pv7` cùng câu), nên phần lớn phải tự dịch.
  Đã dùng lại nguyên văn: `:2.1` `“Ahaṁ bhadante petīmhi,` → Bạch ngài, con là ma (1 chỗ) · `:2.2` `duggatā yamalokikā;` → sinh về cõi khổ xa xôi, thuộc cõi của Yama (đã có sẵn ở `pv44:2.2`) · `:2.3` `Pāpakammaṁ karitvāna,` → đã tạo nghiệp ác (2 chỗ) · `:5.1` `“Kiṁ nu kāyena vācāya,` → Điều ác gì là do thân, do lời nói (2 chỗ) · `:5.2` `manasā dukkaṭaṁ kataṁ;` → do ý mà đã làm (2 chỗ) · `:5.3` `Kissa kammavipākena,` → Do quả báo của nghiệp nào (3 chỗ) · `:9.1` `Tassa kammassa vipākena,` → Do quả báo của nghiệp ấy (1 chỗ) · `:9.2` `musāvādassa cūbhayaṁ;` → cùng nghiệp nói dối cả hai điều (1 chỗ).
  Tên phẩm và tiêu đề bài theo đúng khuôn của bốn bài lân cận cùng phẩm đã có bản Việt (`pv2`, `pv3`, `pv4`, `pv8`, `pv9`): `Petavatthu` giữ nguyên (17/17 chỗ) · `Uragavagga` → Phẩm Rắn (5/5 chỗ) · `Pañcaputtakhādapetivatthu` → 6. Chuyện Ngạ Quỷ Ăn Thịt Năm Đứa Trẻ, và dòng đóng `… chaṭṭhaṁ.` → Chuyện ngạ quỷ ăn thịt năm đứa trẻ, thứ sáu (chữ thường ở đầu dòng đóng, đúng như `pv4:5.1` và `pv8:9.1`). `Piyālaphala` không có tiền lệ nên `puttakhāda` dịch thẳng là ăn thịt trẻ con.
  Bất định đã ghi, không che: (1) `vāyasi` ở `:1.2` không có tiền lệ trong tầng và cũng không rõ nghĩa chắc chắn; tôi dịch túi đựng theo nghĩa bao túi, nhưng cách hiểu thứ nhất còn có thể là bộ quạt/bơm, nếu vậy câu này cần xem lại. (2) `pubbalohitamakkhitā` ở `:9.4` — `makkhita` là bôi vẽ/quét, `lohita` là máu, còn `pubba` có thể là bổ nghĩa cho thịt (thịt đã bị bôi vẽ bằng máu) hoặc cho chủ thể (chính bà ấy từng bôi vẽ mình bằng máu); tôi chọn cách đầu, ít giả định hơn, và không thêm chủ thể nào vào thân kinh. (3) `pagghari` ở `:7.2` là trở thành/hình thành, tôi dịch là một khối máu, không suy thêm giai đoạn thai nghén.
  Dấu lược: bài này không có `…pe…` ở Pāli (đã kiểm 42/42 khoá), nên không có dấu lược nào để giữ và không có chỗ nào bịa dấu lược che chỗ thiếu. Dấu nháy kép: 4 cặp `“`/`”` ở Pāli, bản Việt giữ đúng 4 cặp và cân trên cả bài (`:1.1` mở, `:1.4` đóng; `:2.1` mở, `:4.4` đóng; `:5.1` mở, `:5.4` đóng; `:6.1` mở, `:9.4` đóng).
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Đã tự xác minh được: JSON hợp lệ, đủ 42/42 khoá trong `all` và trùng khớp 42/42 khoá Pāli trong `root/pli/ms/sutta/kn/pv/pv6_root-pli-ms.json`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt vào bản Việt, không trùng nguyên văn Pāli ở khoá có nội dung, Pāli trùng nguyên văn trong chính bài (`:8.3` và `:9.3` cùng là `Puttamaṁsảni khādāmi,`) đã dịch giống hệt nhau, và YAML parse sạnh. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Lượt cải thiện 2026-10-11 (kiểm toán độc lập; THAY THẾ các mục trên về những chỗ liệt kê dưới đây, phần còn lại của lịch sử giữ nguyên): đọc đối kháng 42 khoá bằng cặp Pāli↔Việt thì bản trước sai nghĩa trọng yếu ở 34/42 khoá. Lỗi chính: (1) chủ thể sai giới: người nói là NỮ ngạ quỷ (`petīmhi`, `gatā`, `makkhitā`), bản trước dịch thành người chồng/bà vợ ("Bà vợ tôi có thai") — `sapatī` là người vợ chung chồng, nay dịch "người vợ chung chồng với tôi"; (2) `:1.2` `pūti vāyasi` là "bốc mùi thối" (`vāyati` = toả mùi), bản trước bịa "túi đựng thối nhoài"; ghi chú bất định (1) cũ về `vāyasi` nay được giải quyết và bị bỏ; (3) `:2.2` `duggatā` = khốn khổ (không phải "sinh về cõi khổ xa xôi"), `:2.4` `petalokaṁ ito gatā` = "từ đây tôi đã đi đến cõi ngạ quỷ" (bản trước bịa "từ cõi này sang cõi loài người"); các tiền lệ `pv31`/`pv44` mà mục cũ viện dẫn chính là chỗ chứa lỗi `duggatā`, không dùng nữa; (4) `:7.2` `lohitaññeva pagghari` = "chỉ chảy ra thành máu" (không phải "mới chỉ là một khối máu"; ghi chú bất định (3) cũ bỏ); `:7.4` `mayhaṁ ñātī samānayi` = "đã tập hợp thân quyến của tôi lại" (bản trước bịa "mang tôi … đến nơi quả báo của tôi"); `:7.5-7.6` bắt thề và cho người mắng nhiếc, đúng nghĩa causative; (5) `:5.4`, `:8.3`, `:9.3` `puttamaṁsāni` = "thịt những đứa con" (bản trước "trẻ con ta"/"trẻ con"); `:8.4` `sace taṁ pakataṁ mayā` = "nếu việc ấy do tôi làm" (bản trước "nếu tôi cứ làm như thế"); (6) `:9.4` `pubbalohitamakkhitā` — `pubba` là MỦ (không phải bổ nghĩa "thịt"; `makkhitā` giống cái chỉ chính nàng): "bị mủ và máu bôi nhớp", khớp tiền lệ "mủ và máu" ở `pv14:5.1`; ghi chú bất định (2) cũ được giải quyết và bỏ; (7) `:4.4` `byasanaṁ gatan` = "kẻ đã rơi vào tai họa"; `:4.1-4.2` giữ ranh giới khoá Pāli (không dời chủ ngữ sang `:4.1`); `:6.2`/`:6.4` `pāpaṁ acetayiṁ`/`gabbhapātanaṁ` = "mưu tính điều ác", "làm cho cô ấy sẩy thai" (bản trước "ép … sẩy thai" thêm nghĩa ép buộc không có trong Pāli); (8) tiêu đề `:0.3`/`:10.1` thêm "Nữ" (`petī`) và "đứa con" (`putta`): "Chuyện Ngạ Quỷ Nữ Ăn Năm Đứa Con", đồng bộ `translationTitle`. Xưng hô: người hỏi gọi "ngươi" (khớp `pv13`/`pv14`/`pv15` `:1.1/:1.4`), ngạ quỷ nữ xưng "tôi" suốt (mở đầu "Bạch ngài, tôi là ngạ quỷ nữ", khớp `pv19:2.1`), vì dùng "con" thì `:8.3`/`:9.3` thành "con ăn thịt con" gây hiểu lầm. Dùng lại có đối chiếu Pāli: `:9.2` "và của lời nói dối, cả hai;" (khớp `pv24:17.2`), `:5.1-5.3` (không đổi), `:2.1`+`:2.2` theo `pv13`/`pv45`. Pāli trùng trong chính bài: một cặp (`:8.3`=`:9.3`), Việt giống hệt. Nháy kép khớp Pāli từng khoá (4 cặp, `:1.1/:1.4`, `:2.1/:4.4`, `:5.1/:5.4`, `:6.1/:9.4`); không `…pe…`/`(…)`; không Pāli lọt sang Việt; NFC; 42/42 khoá khớp tập khoá Pāli. Bất định còn lại, không đoán: (a) `:3.1` `kālena` đối với `sāyaṁ` (buổi tối) — nghĩa đen "đúng thời/đúng lúc", bản Việt nguyên bài ở mục Tra cứu toàn văn đọc là buổi sáng nhưng Pāli không nói; giữ "Đúng thời", không thêm "buổi sáng" vào thân kinh; (b) `:8.1-8.2` `ghorañca sapathaṁ, musāvādaṁ abhāsisaṁ` — không có `ca` sau `musāvādaṁ` nên hiểu "lời thề … là lời nói dối" (đồng vị) chứ không phải hai việc; tôi chọn đồng vị, khác `pv24:15.1-2` có `ca` thứ hai; (c) `:9.1-9.2` `cūbhayaṁ` đọc "cả hai" cho nghiệp (phá thai) và lời nói dối, theo `pv24:17.2`. Điểm: `semantic_fidelity` 9.3→9.0, `grammar_logic` 9.2→9.1, `terminology` 9.2→9.0, `triangulation` 7.5→7.8 (đối chiếu thêm các bài song song pv7/pv13/pv24/pv35 và bản Việt nguyên bài chỉ để hiểu cách đọc; vẫn không có bản Anh nên chưa vượt 8.0), `vietnamese_clarity` 9.4→8.9 (`:4.1-4.2` và `:3.1` còn đảo ngữ theo Pāli), `han_viet_balance` 9.3→9.2, `ambiguity_integrity` 9.1→9.0; các tiêu chí còn lại giữ. `final_score` 9.21→9.11 (trung bình thô của 10 điểm): điểm cũ không phản ánh việc bản trước có nhiều lỗi nghĩa trọng yếu; điểm mới chấm trên bản đã sửa, vẫn trừ vì các bất định (a)–(c) và đảo ngữ còn lại. Cổng kỹ thuật vẫn CHƯA chạy ở lượt này (không được chạy npm): `npm run validate`, `npm test`, `npm run check`, `npm run build` còn chờ coordinator; `technical_integrity` giữ 9.6. Ngoài phạm vi, báo: `pv7` (`:1.2`, `:1.3`, `:4.1`) và `pv35:1.2` còn lỗi cùng họ ("túi đựng thối nhoài", "cháy cháy", "y như gió").
