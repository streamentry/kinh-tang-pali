notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh nào cho mil5.3.8 tại commit đã ghim. Xem `blocking_errors` để có con số coverage và lý do `not-published-upstream`.
  **6 khoá có Pāli trùng nguyên văn ở bài khác (266 cặp); cả 6 đã dùng lại NGUYÊN VĂN.** `0.1` theo 168/179 bản (Milindapañha) · `0.2` theo 14/24 (Meṇḍakapañha) · `0.3` theo 4/7 (Paṇāmitavagga) — 6/8 bài mil5.3.* đã có trong tầng giữ nguyên Pāli ở ba khoá tiêu đề này · `1.1` trùng 7 bản, dùng lại lời chiếm 3/7 *Bạch ngài Nāgasena, các ngài từng nói—* · `1.7` trùng 16 bản, dùng lại lời chiếm 4/16 *Câu hỏi hai đầu này đã đến với ngài, xin ngài hãy giải quyết.* · `8.4` trùng 21 bản, dùng lại lời chiếm 6/21 *Lành thay, thưa ngài Nāgasena, đúng là như vậy, trẫm xin kính nhận*.
  **Xưng hô — theo tiền lệ trong chính tầng Milinda, không phải theo thói của tầng Tăng Bộ.** `bhante` gọi Nāgasena → *Bạch ngài* / *thưa ngài* (75 + 44 lần); `bạch thầy` = **0 lần** trong toàn tầng. `mahārāja` → *tâu đại vương* (142 lần) và *bạch đại vương* thuộc về `bhagavā`, không liên quan `mahārāja`, nên tôi không dùng. Ba bài mil5.3.1, mil5.5.2, mil5.5.4 vừa được dịch cũng theo đúng hai quy ước này.
  **Tên phẩm `0.4` và kết `9.1` — đặt theo mẫu đã có, chứ không dịch khuôn riêng.** `8. Pādasakalikāhatapañha` → *8. Câu Hỏi Về Mẩu Sỏi Bị Nghiền Nát* và `9.1` → *Câu Hỏi Về Mẩu Sỏi Bị Nghiền Nát, thứ tám.*, theo kiểu `mil5.3.9:7.1`. Lý do chọn *mẩu sỏi*: `sakalikā` là hạt đá nhỏ và thân bài dùng `sakalikā` (không dùng `pāda` = hạt) ở `1.3`, `1.4`, `2.1`, `1.5`; `pāda` trong tiêu đề có thể là *hạt* nhưng tôi không đổi sang *hạt* vì thân bài không xác nhận.
  **Thuật ngữ mới, 0 tiền lệ trong tầng, đặt kèm lý do.** `sakalikā` → mẩu sỏi · `selā` → viên sỏi (khác `sakalikā` ở chỗ `selā` là viên to dùng đập) · `papatikā`/`pappaṭikā` (Pāli ghim viết `papaṭikā`) → mảnh vỡ · `pāsāṇa` → tảng đá · `sampaṭicchitabba` → được đập vỡ · `sampāṭicchana` (ý định bị đập vỡ) → *để bị đập vỡ* · `aṅgulantarikā` → kẽ ngón tay · `paggharati` → rơi rớt · `animittakatadisā` → không để lại dấu vết · `pathavito` → Thần Đất (Sujato dịch *the earth deity*) · `kūṭāgāra` → tháp cao.
  **`apaciti` — chỗ tôi phải chọn, và ghi rõ là chỗ chọn.** 0 tiền lệ trong tầng cho từ này. Tôi dịch **nhượng bộ** vì `apacitiṁ na karonti` trong `6.2`, `6.5` và `6.4` là nói về việc có chịu hạ mình hay không; `saññatti` mới là *hòa giải* trong tầng (27 lần, ở `an2.51` và `an8.89`) và là từ khác, nên tôi không mượn. Với `nāguṇo avisesatāya` và `atithaddho anisedhanatāya` tôi dịch *không nhượng bộ trước người/kẻ không đáng*.
  **Bất định đã ghi.** (1) `pasavati na ṭhānamupagacchati` (`3.2`, `4.1`, `5.1`) — tôi dịch *không đi đến nơi nào* theo nghĩa chữ; ý sâu có thể là phần rơi sót ấy *không còn được dùng đến nữa*, nhưng Pāli không nói rõ, nên tôi không thêm. (2) `vātamaṇḍalikāya ukkhittaṁ purāṇapaṇṇaṁ` (`8.1`) — tôi đọc là tờ phiếu cũ cháy vì một vòng gió; `vātamaṇḍalikā` có thể là *vòng tròn gió* hay *gió xoáy*, chưa phân xử. (3) `1.4` `nivattā` tôi dịch *không dính vào*; Pāli cũng đọc được là *không còn ở lại*.
