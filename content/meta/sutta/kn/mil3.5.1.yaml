notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim (`11c9d708978cde8ba61096d8a75f7ddfb846f639`), bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  - |-
    **Ba tầng còn lại là Pāli root và bản Việt dự án; tầng Anh và tầng Việt hiện hành đều vắng.** Bài dịch từ Pāli một mình, `triangulation` 6.5. Đây là bài ngắn mà lập luận trục lại rất đúng — nếu dịch lệch một bước là đảo cả bài — nên `ambiguity_integrity` tôi chấm 8.4 và ghi lại mọi chỗ phải chọn.
  - |-
    **Cấu trúc lập luận phải giữ nguyên, và tôi đã giữ.** Vua hỏi *ông đã thấy Đức Phật chưa* → *không*; hỏi *thầy của ông đã thấy chưa* → *không*; rồi suy ra *vậy thì không có Đức Phật*. Tôi dùng đúng *chẳng phải là* ở các câu hỏi và *vậy thì, … không có* ở các câu kết luận, để mắt thấy được bước suy ra đó. `Tena hi, … natthi X` là kết luận logic, không phải mệnh đề mới.
  - |-
    **Thí dụ về dòng sông phải dịch đúng cấu trúc, tôi không thu gọn.** `1.7` hỏi *ngài đã thấy dòng sông Ūhā ở núi Hi-mã-lạt chưa* → `1.8` *không phải vậy*; `1.9` hỏi *cha mẹ ông đã thấy chưa* → `1.10` *không phải vậy*; `1.11` suy ra *vậy thì không có dòng sông Ūhā*; `1.12` đáp *có, dù tôi chưa thấy, cha mẹ tôi cũng chưa thấy, nhưng nó vẫn có*. `1.13` mới áp cùng khuôn cho Đức Thế Tôn. Bỏ bước nào là mất hết bài.
  - |-
    **Chỗ 0 tiền lệ, tôi ghi rõ.** `ūhā nadī` là tên riêng không rõ trong các bản Pāli đang có ở commit đã ghim; tôi giữ dấu Latin **Ūhā** thay vì tự đặt tên tiếng Việt, vì tên riêng Pāli có dấu là văn phong đã có sẵn trong tầng (Theragāthā, Pātimokkha). `himavati` (0 tiền lệ) → *núi Hi-mã-lạt*. `Buddhassa atthinatthibhāvapañha` cũng **0 tiền lệ**: tôi tách `atthi / natthi` (có / không có) và `bhāva` (bản chất) thành *sự tồn tại và chân tính*, và ghi đây là **cách đọc của tôi**, không phải bản dịch có thẩm quyền.
  - |-
    **Tiêu đề phẩm và thứ tự đã tra.** `Buddhavagga` → *Phẩm Đức Phật* theo 8 bài `kn/mil3.5.*` đã có. Số thứ tự `paṭhamo` → *thứ nhất*, khớp bài thứ nhất của phẩm. `Tena hi, bhante nāgasena, natthi buddho` là hỏi lại nhưng dạng mệnh đề, tôi dịch *“Vậy thì, thưa tôn giả Nāgasena, không có Đức Phật”ti.* — dấu hỏi là dấu hỏi của lời vua chứ không phải của Nāgasena, vì `“…”ti?` trong Pāli là câu hỏi của vua.
