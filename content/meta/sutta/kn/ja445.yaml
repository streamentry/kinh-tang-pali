  tiền lệ). Hô cách `deva` trong `ja`: *tâu đại vương* 80, *tâu bệ hạ* 7, *bệ hạ* 1, đại vương 4,
  khác 21; 9.1 đã có `mahārāja` = *tâu đại vương*, nên 9.3 `deva` dùng *tâu bệ hạ* để không lặp
  (chấp nhận lệch đa số, có lý do). `Na vāhametaṁ jānāmi` lặp ở 1.1 và 4.1: 1.1 *Tôi không biết
  người này* (vì 1.2 đi liền `ko vāyaṁ`: *ai đây*), 4.1 *Tôi không biết điều này* (vì 4.3–4.4 nêu
  sự việc); cố ý khác nhau theo văn cảnh, không phải quên tra tiền lệ. Cặp Pāli trùng nguyên
  văn trong bài: 1 (`Na vāhametaṁ jānāmi`), Việt khác có lý do như trên.

  *Còn bất định (giữ trong `ambiguity_integrity`).* (1) 5.1 `sājīvakaro`: tôi đọc *người cùng
  chung sống*; nghĩa gốc có thể là *người cùng lo sinh kế/ cùng chia sinh kế* — không phân xử
  tuyệt đối. (2) 5.5 `iddhī` giữ *thần thông* theo bảng thuật ngữ; trong văn cảnh kệ có thể chỉ
