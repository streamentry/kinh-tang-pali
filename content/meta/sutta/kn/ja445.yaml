  *Người nói — đã phân xử (blocker thứ ba được gỡ).* Từ chính Pāli ghim: 3.4 người nói gọi
  người nghe là `janādhipa`; 4.3 người nghe lại được gọi `samma` (bạn) và đáp lại, 5.3 nói về
  quyền chủ tể đã được ban; 9.1 người cầu xin gọi `mahārāja` và xin tha cho Sākha. Vậy 1–3 và 9
