  (Nigrodha là Bồ-tát lên làm vua; Sākha con nhà buôn là bạn bị bội ơn; người thứ ba bị Sākha
  đánh đuổi cầu xin tha cho Sākha). Chú giải không nằm trong tầng đã ghim và chỉ dùng để
