  **Bất định — điểm yếu thật của bài này, ghi ở đây chứ không thêm vào thân kinh.**
  (1) **`nigrodha` mang hai vai.** Ở `1.4` (`nigrodha kinti maññasi`) nó nằm cuối câu như tên
  riêng gọi thẳng người nghe; Ở `10.1` (`Nigrodhameva seveyya`) và `10.3`
  (`Nigrodhasmiṁ mataṁ seyyo`) nó là *cây/địa phương* (cây banyan, cõi banyan) vì có
  `Nigrodhasmiṁ` (cách ngữ). Tôi giữ **nguyên chuyển âm** `Nigrodha` ở cả ba chỗ và không
  dịch nó thành *đa đa* hay *cây banyan*, vì không có căn cứ để chọn một nghĩa duy nhất cho cả bài.
  (2) **`nigrodha kinti maññasi`** — `kinti` là *vì sao / vì lý gì*, nên câu này chỉ là *Ngươi nghĩ
  sao?*; nhưng cả vế `Yathā sākho cari evaṁ` (*Như bạn hiền tử đã đi thế nào*) lại là một
  mệnh đề riêng. Tôi dịch hai vế tách rời và **không** tự ghép chúng thành một câu hỏi về
  `nigrodha`.
  (3) **Ai là người nói.** `2.2` `purisā nīhariṁsu maṁ` (*có người đem tôi đi*) cho thấy người
  nói **đã từng bị người ta mang đi**; `3.3`–`3.4` và `5.x` thì người nói quay sang mỉa bạn
  hiền tử; `8.x`–`9.x` thì lại cầu xin một vị vua tha lỗi và nói *ta không muốn bị giết*. Tôi
  **không** chỉ định đây là loài vật nào, vì Pāli ghim không nói và không có bản Anh để quyết.
  (4) `mukhapahārāni` ở `2.3` — *lời chặn miệng* (những lời chửi bới cắn chặn miệng người
  nghe); `vacanaṅkarā` ở `2.4` là *lời của bạn hiền tử [đã trở thành những lời ấy]*. Đây là
  cách đọc của tôi; `mukhapahāra` cũng có thể là *cú đấm vào miệng*, tôi chọn nghĩa *lời chặn
  miệng* vì `2.4` nói *lời*.
  (5) `asappurisacintakaṁ` ở `8.2` — tôi dịch *đời không đáng để kẻ vô lương tâm nghĩ tới*;
  `cintaka` là *đáng được nghĩ tới*, và mệnh đề này buộc vào đời sống mà người nói mong có.
  (6) `sattīhi` ở `8.3` — *bằng bảy (thứ)*; tôi dịch *bằng bảy lưỡi* vì nối với `Hanantu sākhaṁ`
  (bị giết). `sattīhi` không nêu rõ là bảy *thứ gì*, nên đây là chi tiết tôi suy ra.
  (7) `iddhī` ở `5.5` → *thần thông* (đúng với cách dùng chung của tầng); `sissariyaṁ` ở `5.3`
  → *tối thượng*; `natthi saṁsayo` ở `5.6` → *không còn nghi ngờ gì*.

