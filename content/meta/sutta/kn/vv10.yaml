notes: |-
  Dịch TRỰC TIẾP từ Pāli root — không có tầng Anh đã ghim cho vv10, xem blocking_errors.
  Chỉ mục Pāli và Việt toàn tầng: 32 khoá của bài này có Pāli trùng nguyên văn ở bài khác, 27 dùng lại NGUYÊN VĂN bản Việt đã có — chủ yếu là khung câu hỏi, lời dẫn, kết quả và lời dạy (nguồn chính vv1 và vv4, hai bài có CÙNG cấu trúc khoá và cùng câu Pāli).
  0.1 Vimānavatthu: 31/32 tệp vv giữ tên Pāli. 0.2 Itthivimāna: đa số dùng Chuyện Cung Điện Nữ Hư Không. 0.3 Pīṭhavagga: Phẩm Pīṭha, theo vv1 và vv4.
  0.4 Tiladakkhiṇavimānavatthu: tầng name/ đã ghim cùng commit cho vv-name:12.vv10 bằng Sesame-Gift Mansion. Cả tầng Việt có 0 lần chữ hạt nành, nên dịch Hạt Nành và theo khuôn tên trong vv là Chuyện Cung Điện cộng Người cộng, ví dụ vv67 là Người Ban Trái Cây.
  BẤT ĐỊNH 6.3–6.5: ā-sajja là không mong cầu (4 tiền lệ cho không mong cầu), akāmā là chẳng tự nguyện (0 tiền lệ) và tiladakkhiṇa có 0 tiền lệ; cả ba là câu kệ riêng của bài này. Giữ đúng hai mức độ khác nhau: cho không mong cầu, và không tự nguyện.
  BẤT ĐỊNH ngôi kể: tầng vv đang TÁCH làm hai — 16 tệp dùng vậy tôi (vv1, vv4, vv26) và 4 tệp dùng vậy ta (vv12); 22 lần muôn phương so với 7 lần bốn phương. Chọn cụt vậy tôi cho cả 5 bài vv của lát này vì (a) vv1 và vv4 có ĐÚNG cùng cấu trúc khoá, và (b) nhất quán được cho mahānubhāva trong chính một bài. GHI RÕ: nếu coordinator chốt theo vv12 thì phải đổi cả 5 bài này cùng lúc, không đổi lẻ.
  Nguồn dùng lại nguyên văn: tha-ap105:1.3 cho 6.1, tha-ap292:2.4 cho 6.6, vv4:6.2 cho 6.2, vv1 và vv4 cho 2.x, 3.x, 4.x, 7.x, 8.x (đều cùng Pāli).
  Cổng kỹ thuật: npm run validate, npm test, npm run check do coordinator chạy; bài này draft nên không cần npm run build. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
  Lượt cải thiện 2026-10-11 (kiểm toán đối kháng; đọc từng cặp Pāli↔Việt, đo tiền lệ trên cả tầng kn): trước lượt này có 11/37 khoá sai nghĩa thật; 19/37 khoá đã đổi (11 sai nghĩa, 8 chỉnh nhẹ). Các dòng cũ phía trên về Hạt Nành, ā-sajja = không mong cầu và ngôi tôi/ngài được thay bởi mục này.
  SAI NGHĨA đã sửa (accuracy fix): 0.4 và 9.1 tila là mè, không phải nành (tầng có mè ở cnd19, mil6.4.1 và vừng ở ja252; vv17:10.2 cũng ghi Hạt Nành, lỗi cùng họ, chưa sửa ở đây); tiêu đề đổi thành Vật Cúng Dường Hạt Mè vì Pāli không có hậu tố -dāyikā nên bỏ chữ Người, dakkhiṇā theo tiền lệ vật cúng dường (vv34, vv44). 2.2 và 7.2 idha mijjhati: có được nơi này thành thành tựu được ở nơi đây (khớp vv1, vv7, vv11, vv12; vv2, vv4 và nhiều tệp khác còn lỗi cũ). 3.1 mahānubhāve là hô cách (đối chiếu ja442:4.3): Tôi hỏi ngài về đại oai lực ấy thành Tôi hỏi nàng, này thiên nữ có đại oai lực; ngài là sai ngôi vì Moggallāna nói với nữ thiên. 4.4 yassa kammassidaṁ phalaṁ là quan hệ đại từ (đây là quả của nghiệp nào), không phải quả của nghiệp này là thế: nay là về nghiệp mà đây là quả báo (theo vv15:4.4; khoảng 60 tệp còn câu cũ). 6.3 āsajja là đến gần, không phải không mong cầu (đối chiếu 36 lần āsajja trong tầng): đến gần Ngài, tôi đã dâng vật thí. 6.4 tiladakkhiṇaṁ là vật cúng dường bằng hạt mè. 8.1 mahānubhāva là hô cách của vị tỳ-kheo; 8.2 và 8.3 người nói là nữ thiên (yamakāsi, tenamhi) nên ngài thành tôi, khớp vv1, vv11, vv12.
  CHỈNH NHẸ: 2.3 và 7.3 sửa lỗi gõ khưởi thành khởi; 4.2 bị truy hỏi thành được hỏi (Pāli chỉ là pucchitā, khớp vv1, vv11, vv12); 6.2 vippasannamanāvilaṁ là vippasannaṁ cộng anāvilaṁ, không có mana (m-a-nā-vilaṁ là nối âm), nên bỏ tâm ý, dùng lắng trong, không vẩn đục theo snp3.9:49.2 và ghi chú thuật ngữ anāvila; lỗi tâm ý cùng họ ở khoảng 10 tệp vv và tha-ap chưa sửa; 6.5 bậc Đức Phật thành Đức Phật, bậc đáng được cúng dường; 6.6 bỏ chữ dâng dư để khớp 12 tệp cùng Pāli; 8.4 sắc tướng thành dung sắc, muôn phương theo 3.4.
  Điểm: semantic_fidelity 9.1 sang 8.8; grammar_logic 9.2 sang 9.0; terminology 8.9 sang 8.6; vietnamese_clarity 9.3 sang 9.0; ambiguity_integrity 9.0 sang 8.5. Các tiêu chí còn lại giữ nguyên (triangulation 7.5 vì vẫn không có bản Anh độc lập). Điểm bản trước 9.15 không đứng vững vì 11/37 khoá sai nghĩa thật; sau sửa vẫn còn bất định ở 6.3–6.4 và tiêu đề phẩm nên final_score 8.99.
  BẤT ĐỊNH CÒN LẠI: akāmā ở 6.4 có thể là không muốn (miễn cưỡng) hoặc không mong cầu gì; dùng chẳng có ý muốn để không chốt, không có bản Anh hay tiền lệ trong tầng để phân xử. 1.2 nơi đây là chỉ thị thêm so với Pāli (tiṭṭhasi không có idha), giữ vì vv33:3.2 cùng dạng, nghiêng nhẹ về diễn dịch. 6.1 virajaṁ giữ ly trần theo 22 tệp tha-ap.
  KHÔNG SỬA nhưng ghi nhận lỗi họ vv: 0.2 Itthivimāna dịch Nữ Hư Không là sai (Pāli không có ākāsa), lặp ở khoảng 51 tệp nên không sửa riêng một tệp; 0.3 Pīṭhavagga giữ Phẩm Pīṭha theo vv1, vv4 trong khi pīṭha là ghế (vv1:2.1 dịch chiếc ghế), cần quyết định chung cho cả bộ.
  Cổng kỹ thuật: npm run validate, npm test, npm run check, npm run build chưa chạy trong lượt này; technical_integrity giữ 9.6.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2011, theo ấn bản Buddha Jayanthi). 1 khoá bất đồng nghĩa → sửa 0, giữ 1 (6.4 `akāmā tiladakkhiṇaṁ`: bản nguyên bài “không có dự tính trước”, bản này “chẳng có ý muốn”; Pāli là “không muốn/không chủ ý”, tầng dịch “dù không muốn” ở pv36:12.3, ja542:6.2, ja528:16.3), bất định 0. Đã khớp với bản nguyên bài: `osadhī` (1.4: bản nguyên bài giữ chữ Pāli, bản này “sao mai” theo tiền lệ pv13:10.4), `kena … mijjhati` (2.2, 7.2), hạt mè cúng dường Đức Phật bằng chính đôi tay (6.3–6.6). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
