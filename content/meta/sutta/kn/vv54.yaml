notes: |-
  Dịch từ Pāli root (`root/pli/ms/sutta/kn/vv/vv54_root-pli-ms.json`, 38/38 khoá khớp `pre` = `vv54:`).

  **Đo mệnh đề đã yêu cầu, tự đo lại:** `:0.1` của các bài `vv` trong tầng Việt là `Vimānavatthu`
  ở 37/38 tệp (chỉ `vv69` là lệch, đặt *Chuyện về cảnh giới thần*), nên giữ nguyên Pāli. Còn ba
  mệnh đề còn lại đo cho bộ: `:0.1` của `sn` là `Saṁyutta Nikāya` ở 1598/1598 khoá, và chuỗi
  `Saṡyutta` (số mũ ș) xuất hiện trong **0 tệp** của cả `content/translation/vi/`; `:0.1` của `an`
  là `Kinh Tăng Chi Bộ` ở 887/1240 so với `Aṅguttara Nikāya` 353 — đa số đo được, nên theo đa số.

  **Pāli trùng nguyên văn: 28 khoá, 372 cặp; dùng lại y nguyên văn 22.** Sáu khoá lệch khỏi đa
  số, và cả sáu đều vì giới tính hoặc vì đa số dịch sai nghĩa — ghi rõ ở đây:
    - `Kena tetādiso vaṇṇo` (3.1) và `Uppajjanti ca te bhogā` (3.3): đa số dùng *nàng* (10 + 4 bài,
      đều thuộc `Isisvimāna`, tức cung điện **nữ**); vv54 thuộc `Purisavimāna` (nam) nên phải là
      *ngài*. Đã dùng lại y nguyên văn bản *ngài* đã có (vv56/vv57/vv59/vv77 cho 3.1, 4 bài).
    - `kena te idha mijjhati` (3.2) và `tena me idha mijjhati` (7.2): đa số dịch *có được nơi này*
      (6 + 7 bài), sai nghĩa vì `mijjhati` là *rực rỡ*; toàn tầng chỉ vv12:6.2 dịch đúng, theo đó.
    - `Vaṇṇo ca te sabbadisā pabhāsatī”ti.` (4.4): kho có **16** cách; chọn vv75:2.4/vv76:2.4
      (2 bài) vì khớp *ngài* cả khối, và giữ nguyên dấu `”.` của hai bài đó dù đọc vướng.
    - `Kenāsi evaṁ jalitānubhāvo` (4.3): hòa ngang 3–3 giữa *ngươi* và *ngài*; chọn *ngài* cho cả khối.

  **0 tiền lệ, và đây là phần khó nhất của bài — ghi ra đây thay vì giấu.** Câu trả lời 6.1–6.4 và dòng
  ngoặc 10.1 không có bản nào khác trong toàn tầng Việt, và cũng không có trong **toàn bộ Pāli đã
  ghim** (đã grep `root/pli/ms/sutta/`): chữ `kakkaṭaka` chỉ xuất hiện ở vv54. Ba chỗ phải tự phán:
    - `Kakkaṭaka` dịch **con cóc** theo nghĩa đen. 6.4 `dasapādako` (*mười chân*) cho thấy đây là
      tượng hình cóc ở cửa cung điện, nhưng không có bản song song để đối chiếu, nên đây là
      **cách đọc biên tập**, không phải kết luận đã kiểm chứng.
    - `rasadāyaka` dịch **Cho Dâng**. `dāyaka` là hậu tố *kẻ ban/cho*, có tiền lệ ngay trong cùng bộ:
      `Phaladāyaka` → *Người Ban Trái Cây* (vv67), `Bhikkhādāyaka` → *Người Dâng Cúng Vật Thực*
      (vv70), `Upassayadāyaka` → *Người Bố Thí Chỗ Trú* (vv68). `rasa` (*vị, tinh chất*) **không
      dịch**, vì 6.3 nói rõ thứ được cho ra là `jātarūpassa` (*màu vàng*); dịch `rasa` thành chữ sẽ
      thêm một danh từ không có ở nguồn.
    - `Satisamuppādakaro` dịch **Kẻ tạo ra hữu sanh** (đọc `sati-samuppāda-karo`). 6.2–6.4 cho thấy
      chủ thể của cả khối là con cóc, nên 6.2 để *đứng ở cửa bên là con cóc* để câu 6.1 bớt đứng đoán.
  Vì ba chỗ này không có nguồn đối chiếu, `ambiguity_integrity` hạ xuống 9,0 và `triangulation` bị
  chặn ở 7,5 (≤ 8,0) chứ không nâng để né blocker.

  **Dấu lược và nháy kép.** Bài này không có `…pe…` nào. Nháy kép đặt đúng như Pāli: mở ở 1.1, đóng ở
  4.4, mở ở 6.1, đóng ở 8.4 — Pāli cũng 2 mở / 2 đóng; `ngoặc()` của `_hvi.py` báo cân trên cả bài.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`. Bài ở trạng thái `draft` nên không cần `npm run build`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.

  **Kiểm toán độc lập 2026-10-11 (thay thế các nhận định cũ ở trên khi mâu thuẫn).** Đọc đối kháng 38 khoá
  cặp Pāli↔Việt; đổi 21/38 khoá, trong đó 14 khoá lỗi nghĩa thật và 7 khoá lỗi chữ nghĩa nhẹ. Điểm hạ
  từ 9,21 xuống 8,92 vì bản đã publish mang nhiều lỗi nghĩa mà lần chấm cũ không thấy.
  Lỗi nghĩa thật đã sửa:
    - `kakkaṭaka` là **con cua**, không phải con cóc (0.4, 6.2, 9.1, 10.1). Chứng cứ trong chính bài: 6.4
      `dasapādako` *mười chân* (cua có mười chân); trong toàn tầng Pāli, `Suvaṇṇakakkaṭajātaka` là
      *Cua vàng* (ja389, nơi đó đang dịch nhầm thành *rùa*; ngoài phạm vi bài này, chỉ báo). Tiêu đề cũ
      *Người Cóc Cho Dâng* còn sai cấu trúc (`dāyaka` là *người dâng*, không đứng sau danh từ như tính từ).
      `rasa` nay dịch **nước cua** (`kakkaṭakarasa` = nước/vị cua); nhận định cũ rằng 6.3 giải thích `rasa`
      là sai vì 6.3 nói về con cua vàng ở cửa, không nói về vật được dâng.
    - 6.1 `Satisamuppādakaro` là tính từ của con cua (6.2 `kakkaṭako ṭhito`), *làm khởi sanh niệm*; bản cũ
      *Kẻ tạo ra hữu sanh* vô nghĩa. 6.3 `niṭṭhito jātarūpassa` là *làm xong từ vàng ròng* (cũ: *đã xong phần
      sinh ra những vị màu vàng*, sai).
    - 8.1 `mahānubhāva` là **hô cách** (*này tỳ-kheo có đại oai lực*), không phải tân ngữ *về đại oai lực ấy*;
      8.2 `yamakāsi` do chính thiên tử nói (*phước báu tôi đã làm*), không phải *ngài đã tạo*; 8.3 `Tenamhi` là
      *nhờ đó tôi có*, không phải *oai lực ngài* (xưng ngôi sai người).
    - 5.3–5.4 `yassa kammassidaṁ phalaṁ` là *về nghiệp mà đây là quả báo*, không phải *quả báo của nghiệp này
      là thế* (đảo quan hệ).
    - 3.2, 7.2 `idha mijjhati`: *thành tựu được ở nơi đây* (cũ *rực rỡ ở nơi này*; `mijjhati` là *thành tựu*,
      không phải *rực rỡ*). Ghi chú cũ ở trên nói ngược lại, nay thôi hiệu lực.
    - 4.1 `deva` (hô cách) bị bỏ sót, nay thêm *này thiên tử*; 10.1 `pañcavimānaṁ` là *năm cung điện* (cũ
      *cung điện thứ năm*); 2.4 `nāriyo` là *nữ nhân* (cũ *tiên nữ* và thêm *lượn bay* không có trong Pāli).
  Lỗi nhẹ: 2.1 bỏ *thỏa thích*; 3.1 *sắc diện dung nhan* → *dung sắc*; 5.1 bỏ *vô cùng*; 5.2 *hỏi thăm* →
  *hỏi*; 5.3 bỏ *liền*; 7.3 sửa chữ vô nghĩa *khưởi* → *khởi*; 4.2 *phước đức* → *phước báu* cho khớp 8.2.
  Điểm đổi: semantic_fidelity 9,3→8,6; grammar_logic 9,3→9,0; segment_alignment 10→9,8; terminology
  9,2→8,6; vietnamese_clarity 9,3→8,8; han_viet_balance 9,4→9,2; ambiguity_integrity 9,0→8,6; còn lại giữ.
  Bất định còn lại (không phân xử được, không đoán): `rucakatthatā` (1.4) giữ *trải thảm rực rỡ* như các
  bản vv khác, nhưng `rucaka` có thể là vàng và *thảm* là cách đọc biên tập; 6.1 `sati` đọc là *niệm*
  (có thể là chỗ nhắc nhớ việc đã dâng; không có chú giải để kiểm); `rasa` = *nước cua* là nghĩa từ vựng,
  chưa có bản song song; 3.4/7.4 `piyā` giữ công thức chung *dễ chịu với tâm*. Tiêu đề phẩm `Purisavimāna`
  hiện là *Nam Hư Không* ở 26 tệp vv (không có `ākāsa` trong Pāli): không sửa riêng tệp này để khỏi lệch bộ,
  ghi nhận để sửa cả bộ. Cổng kỹ thuật `npm run validate`, `npm test`, `npm run check`, `npm run build`
  chưa chạy ở lượt này; `technical_integrity` giữ 9,6.

  **Lượt cải thiện 2026-10-13.** Đọc đối kháng lại 38 khoá cặp Pāli↔Việt và đo tiền lệ trên 34 bài `vv` còn lại (số
  dưới đây là số đếm trên toàn bộ `kn/vv`). Đổi 7/38 khoá và sắp lại thứ tự khoá; không đổi tập khoá hay segment ID.
    - 6.1 (accuracy fix, dấu câu): Pāli mở nháy kép ở `“Satisamuppādakaro`, bản Việt thiếu dấu mở nên 2 mở / 2 đóng của
      Pāli chỉ còn 1 mở ở Việt; đã thêm `“`. Đồng thời `khởi sanh` → `khởi sinh` (toàn `vv` chỉ chỗ này viết `sanh`; toàn
      tầng 163 `khởi sinh` so với 50 `khởi sanh`).
    - 3.1, 3.2 (terminology fix): `Do nhân gì` → `Do đâu`. `kena` là một từ ở 3.1, 3.2 và 4.3 mà bản cũ dịch hai kiểu
      trong cùng bài (4.3 đã là `Do đâu`); `nhân` còn thêm nghĩa *nguyên nhân* mà `kena` (cách công cụ) không có. Tiền lệ
      cho đúng dòng Pāli: `Do đâu ngài có được dung sắc như thế` 6 bài, `Do đâu nàng …` 30 bài, `Do nhân gì ngài …` chỉ 4 bài
      và đều kèm `sắc diện dung nhan`.
    - 2.3 (accuracy fix): `kāmaguṇettha` = `kāmaguṇā ettha`, `ettha` (*ở nơi đây*) bị bỏ sót; thêm `ở nơi đây`. Dòng Pāli này
      có ở 8 bài `vv` khác: 4 bài đã dịch `ettha` (vv55, vv58, vv77, vv85; vv85 cùng dạng `ở nơi đây`), 4 bài bỏ sót
      (vv56, vv57, vv59, vv79). Bản này theo nhóm đầy đủ; 4 bài bỏ sót ghi nhận ở đây, không sửa tệp ngoài bài.
    - 4.4 (style, theo tiền lệ): `?”.` → `?”`. Dòng Pāli này ở 65 bài hỏi: `?”` 50, `?”.` 15.
    - 8.4 (terminology fix): `sắc tướng … mọi phương”.` → `dung sắc … muôn phương.”`. `vaṇṇo` ở 3.1, 4.4, 7.1 đều là
      `dung sắc`, riêng 8.4 bản cũ đổi sang `sắc tướng` trong cùng bài; tiền lệ cho đúng dòng 8.4: `dung sắc tôi … muôn
      phương` 28 bài so với `sắc tướng … mọi phương` 7. Đặt dấu theo đa số toàn tầng cho dòng kết `”ti.`: `.”` 124 so với `”.` 50.
    - 6.4 (clarity + orthography): `toả` → `tỏa` (`tỏa sáng` 27 chỗ trong `vv`, `toả sáng` 1 chỗ — chính chỗ này); `mười chân.` đứng
      trơ → `con mười chân.` vì `dasapādako` là danh từ chủ ngữ của `sobhati` (không phải tính từ treo), và `con` chỉ là loại
      từ của con cua đã nêu ở 6.2, không thêm ý.
    - Thứ tự khoá: bản cũ để `10.1` ngay sau `1.4`; đã xếp lại đúng thứ tự Pāli (0.1…9.1, 10.1) như mọi tệp `vv` khác.
  Điểm đổi: semantic_fidelity 8,6→8,8 (khôi phục `ettha`, bỏ `nhân` thừa); segment_alignment 9,8→9,9 (nháy mở của 6.1,
  thứ tự khoá); terminology 8,6→9,0 (`kena` và `vaṇṇo` nhất quán trong bài và theo tiền lệ, một chính tả); vietnamese_clarity
  8,8→8,9 (6.4, 6.1). Giữ nguyên: ambiguity_integrity 8,6 vì bất định thật vẫn còn (`rucaka`, `sati`, `rasa`, xem trên);
  triangulation 7,5 vì không có tầng tham khảo nào. `final_score` 8,92→9,00 là trung bình thô, không `> 9,0` nên không
  đủ lên `published`; blocker `không có tầng tham khảo tiếng Anh` giữ nguyên (sự thật về upstream).
  Cập nhật ghi chú cũ: tiêu đề phẩm `Purisavimāna` nay là *Thiên Cung Của Nam Giới* ở 34/34 tệp `vv` đối chiếu, nên chú ý
  `Nam Hư Không` ở trên hết hiệu lực. Đã giải quyết thêm 0 bất định mới: `rucakatthatā` (formula 11 bài `vv` kể cả vv54: 9 bài
  `trải thảm rực rỡ`, 1 bài `được trang hoàng`, 1 bài giữ nguyên `rucaka`) vẫn là cách đọc biên tập; `satisamuppādakaro`
  và `kakkaṭakarasa` là hapax toàn Pāli đã ghim (chỉ `vv54`) nên không có bản song song để phân xử. Cổng kỹ thuật
  `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy ở lượt này; `technical_integrity` giữ 9,6.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 2 khoá bất đồng nghĩa → sửa 0, giữ 0, bất định 2 (`1.4`, `6.1`). `1.4` (`rucakatthatā`): bản nguyên bài hiểu `rucaka` là vàng (trải lót bằng vàng), bản dự án giữ *trải thảm rực rỡ* theo công thức chung của các bài `vv`; Pāli đã ghim không đủ để phân xử hai cách đọc, nên ghi bất định và không đổi riêng một bài. `6.1` (`satisamuppādakaro`): bản nguyên bài đọc là danh từ chỉ vật gợi lại ký ức, bản dự án đọc là tính từ của con cua (*làm khởi sinh niệm*); cả hai hợp ngữ pháp, `sati` có thể là niệm hay ký ức và từ này là hapax trong Pāli đã ghim nên không có song song để phân xử. Các khoá còn lại cùng nghĩa: `kakkaṭaka` là con cua, `dasapādako` là mười chân, `rasa` trong tiêu đề là nước/vị cua, `pañcavimānaṁ` là năm cung điện, hô cách ở 4.1 và 8.1, và người nói ở 8.1–8.4. Không sửa khoá nào. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.
