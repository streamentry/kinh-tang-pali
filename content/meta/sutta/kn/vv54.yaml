notes: |-
  Dịch từ Pāli root (`root/pli/ms/sutta/kn/vv/vv54_root-pli-ms.json`, 38/38 khoá khớp `pre` = `vv54:`).

  **Đo mệnh đề đã yêu cầu, tự đo lại:** `:0.1` của các bài `vv` trong tầng Việt là `Vimānavatthu`
  ở 37/38 tệp (chỉ `vv69` là lệch, đặt *Chuyện về cảnh giới thần*), nên giữ nguyên Pāli. Còn ba
  mệnh đề còn lại đo cho bộ: `:0.1` của `sn` là `Saṁyutta Nikāya` ở 1598/1598 khoá, và chuỗi
  `Saṡyutta` (số mũ ș) xuất hiện trong **0 tệp** của cả `content/translation/vi/`; `:0.1` của `an`
  là `Kinh Tăng Chi Bộ` ở 887/1240 so với `Aṅguttara Nikāya` 353 — đa số đo được, nên theo đa số.

  **Pāli trùng nguyên văn: 28 khoá, 372 cặp; dùng lại y nguyên văn 22.** Sáu khoá lệch khỏi đa
  số, và cả sáu đều vì giới tính hoặc vì đa số dịch sai nghĩa — ghi rõ ở đây:
    - `Kena tetādiso vaṇṇo` (3.1) và `Uppajjanti ca te bhogā` (3.3): đa số dùng *nàng* (10 + 4 bài,
      đều thuộc `Isisvimāna`, tức cung điện **nữ**); vv54 thuộc `Purisavimāna` (nam) nên phải là
      *ngài*. Đã dùng lại y nguyên văn bản *ngài* đã có (vv56/vv57/vv59/vv77 cho 3.1, 4 bài).
    - `kena te idha mijjhati` (3.2) và `tena me idha mijjhati` (7.2): đa số dịch *có được nơi này*
      (6 + 7 bài), sai nghĩa vì `mijjhati` là *rực rỡ*; toàn tầng chỉ vv12:6.2 dịch đúng, theo đó.
    - `Vaṇṇo ca te sabbadisā pabhāsatī”ti.` (4.4): kho có **16** cách; chọn vv75:2.4/vv76:2.4
      (2 bài) vì khớp *ngài* cả khối, và giữ nguyên dấu `”.` của hai bài đó dù đọc vướng.
    - `Kenāsi evaṁ jalitānubhāvo` (4.3): hòa ngang 3–3 giữa *ngươi* và *ngài*; chọn *ngài* cho cả khối.

  **0 tiền lệ, và đây là phần khó nhất của bài — ghi ra đây thay vì giấu.** Câu trả lời 6.1–6.4 và dòng
  ngoặc 10.1 không có bản nào khác trong toàn tầng Việt, và cũng không có trong **toàn bộ Pāli đã
  ghim** (đã grep `root/pli/ms/sutta/`): chữ `kakkaṭaka` chỉ xuất hiện ở vv54. Ba chỗ phải tự phán:
    - `Kakkaṭaka` dịch **con cóc** theo nghĩa đen. 6.4 `dasapādako` (*mười chân*) cho thấy đây là
      tượng hình cóc ở cửa cung điện, nhưng không có bản song song để đối chiếu, nên đây là
      **cách đọc biên tập**, không phải kết luận đã kiểm chứng.
    - `rasadāyaka` dịch **Cho Dâng**. `dāyaka` là hậu tố *kẻ ban/cho*, có tiền lệ ngay trong cùng bộ:
      `Phaladāyaka` → *Người Ban Trái Cây* (vv67), `Bhikkhādāyaka` → *Người Dâng Cúng Vật Thực*
      (vv70), `Upassayadāyaka` → *Người Bố Thí Chỗ Trú* (vv68). `rasa` (*vị, tinh chất*) **không
      dịch**, vì 6.3 nói rõ thứ được cho ra là `jātarūpassa` (*màu vàng*); dịch `rasa` thành chữ sẽ
      thêm một danh từ không có ở nguồn.
    - `Satisamuppādakaro` dịch **Kẻ tạo ra hữu sanh** (đọc `sati-samuppāda-karo`). 6.2–6.4 cho thấy
      chủ thể của cả khối là con cóc, nên 6.2 để *đứng ở cửa bên là con cóc* để câu 6.1 bớt đứng đoán.
  Vì ba chỗ này không có nguồn đối chiếu, `ambiguity_integrity` hạ xuống 9,0 và `triangulation` bị
  chặn ở 7,5 (≤ 8,0) chứ không nâng để né blocker.

  **Dấu lược và nháy kép.** Bài này không có `…pe…` nào. Nháy kép đặt đúng như Pāli: mở ở 1.1, đóng ở
  4.4, mở ở 6.1, đóng ở 8.4 — Pāli cũng 2 mở / 2 đóng; `ngoặc()` của `_hvi.py` báo cân trên cả bài.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`. Bài ở trạng thái `draft` nên không cần `npm run build`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
