  - >-
    **Giải quyết draft 2026-10-12 (kiểm toán độc lập, đọc lại toàn bài từ
    Pāli).** Kết luận: bản dịch thân bài cũ sai nghĩa gần như toàn bộ (đa số
    trong 44 khoá thân bài; xem danh sách dưới), nên đã viết lại thân bài
    `:1.1`–`:11.4` (44 khoá; 43/49 khoá của tệp có nội dung đổi so với bản cũ);
    các khoá tiêu đề `:0.1`–`:0.4` và `:12.1` giữ nguyên. Các lỗi nghĩa thật của
    bản cũ: `pāvāra` (áo choàng) bị dịch thành *trống*; `kacchapaloma` (lông
    rùa) thành *lá vỏ ốc*; `makasapāda` (chân muỗi) thành *ruồi chân cá*, và
    `aṭṭāla sukato daḷho avikampī` (chòi canh khéo làm, vững chắc, không lay
    chuyển) thành *số sáu mươi / kẻ mù lòa / kẻ không chớp mắt*; `sasavisāṇa`
    (sừng thỏ) thành *hội trường*; `candaṁ khādeyyuṁ mūsikā` thành người đàn ông
    bị chuột gặm nhổ *cây sành*; `makkhikā` thành một con ruồi *làm* trong than;
    `gadrabho sumukho kusalo naccagītassa` (chính con lừa có gương mặt đẹp, khéo
    múa hát) thành *người khéo đàn hay ca* thêm vào; `bimboṭṭha` (môi đỏ như quả
    bimba, tiền lệ ja543:200.3, ja542:166.4) thành *con bò có đầu để mộc*;
    `kulako sakuṇo` + `pabbataṁ gandhamādanaṁ … tuṇḍena ādāya` thành *đi trên
    ngọn núi tràn ngát hương bằng cái đuôi làm gánh*; `ceṭo` (người hầu, nô bộc;
    tiền lệ tha-ap394:10.1 *người hầu*, mil5.5.6 *kẻ hầu cận*) thành *một con
    chuột kéo*. Lời trước đây ghi `ceṭo`→*chuột* (36 lần) và `kulako`→*chim sẻ*
    là sai: quét Pāli đã ghim cho thấy `ceṭ-` chỉ còn xuất hiện ở cp14,
    tha-ap394, mil5.5.6 và đều có nghĩa người hầu; không có tiền lệ nào của
    `kulaka` là chim sẻ.
  - >-
    **Cách đọc hiện hành, từng cụm (căn cứ: hình thái Pāli + tiền lệ đếm được
    trong kho).** Cấu trúc: mười một đoạn điều kiện bất khả thi, mỗi đoạn `Yadā
    …` (đoạn 1 không có `Yadā`, tôi thêm *Khi* để khớp `tadā` ở `:1.4`) rồi câu
    điệp `atha nūna tadā siyā` y hệt 11 lần; chủ ngữ của `siyā` bị tỉnh lược
    trong chính văn kệ (câu chuyện khung không nằm trong root Pāli đã ghim), nên
    dịch *thì hẳn lúc ấy sẽ có* và không thêm chủ ngữ. `kumudinī` *có hoa súng
    trắng* (súng trắng: tiền lệ ja536:12.1, ja545:20.1 *hoa súng*);
    `saṅkhavaṇṇā` *màu trắng như vỏ ốc*; `jambu`/`tālaphala` giữ *cây
    jambu*/*quả thốt nốt* (tha-ap511 *thốt nốt*); `kacchapa` *rùa*; `makasa`
    *muỗi* (an5.140, an6.58 *ruồi, muỗi*); `aṭṭālaka` *chòi canh* (ja539:28.2,
    ja458:2.2, ja534:53.4 *chòi canh*); `sasavisāṇa` *sừng thỏ*; `nisseṇī`
    *thang* (mil6.2.1:5.4); `saggassārohaṇatthāya` *để leo lên cõi trời*; `Rāhu`
    giữ nguyên; `surāghaṭa` *bình rượu* (tiền lệ ja291:0.4 *Kinh Bình Rượu*);
    `gaṇacārin` *đi thành bầy* (ja492:15.2); `aṅgāra` *than hồng* (đa số trong
    kho); `bimboṭṭha` *môi đỏ như quả bimba* (ja543:200.3, ja542:166.4); `kusalo
    naccagītassa` *khéo múa và hát* (ja538:94.1, ja507:6.3, ja545:123.3,
    tha-ap82:15.3); `muḷāla` *cuống sen*; `Gandhamādana` *núi Gandhamādana*
    (tiền lệ 5 nơi *núi Gandhamādana*, 5 nơi *ngọn núi Gandhamādana*);
    `sāmuddikaṁ nāvaṁ` *thuyền biển* (ja529:59.1 *thuyền biển*). Pāli trùng
    nguyên văn trong chính bài: bốn dòng `atha nūna tadā siyā` ở `:1.4`–`:10.4`
    và `:11.4` (11 cặp); bản Việt giống nhau ở cả 11 cặp (0 cặp khác nhau;
    `:11.4` chỉ khác dấu đóng nháy theo Pāli).
  - >-
    **Bất định còn lại, đã ghi nhận (không đưa vào thân kinh).** (1) `:11.2`
    `sayantaṁ savaṭākaraṁ`: hapax toàn kho Pāli đã ghim; `sa-` là *cùng với*,
    `yanta` là *máy móc, cơ cấu*, còn `vaṭākara` không giải được bằng hình thái
    hay tiền lệ; tôi chỉ dịch ở mức bao quát *cùng máy móc và trang thiết bị của
    nó*, mức này không đổi hình ảnh (chiếc thuyền biển bị người hầu đem đi) dù
    thật ra đó là dây buồm, hàng hoá hay đồ nghề. (2) `:10.1` `kulaka`: tên một
    loài chim nhỏ không xác định được; thân bài giữ *chim kulaka* (không thay
    bằng tên loài cụ thể như bản cũ). (3) `:5.3` `paripāteyyuṁ`: *săn đuổi*
    (nghĩa đuổi, rượt của `paripāteti`, như `paripātiyamānā` ở mnd2, mnd15 nói
    cá bị quạ, diệc… rượt bắt), cách đọc khác là *làm cho rơi xuống*; cả hai đều
    là một việc bất khả. (4) `:8.3` `pihayeyyuṁ`: nghĩa gốc *mong mỏi, ao ước,
    ghen tị*; tôi chọn *mến mộ nhau* vì ngữ cảnh quạ–cú cùng bàn bạc kín; nếu
    hiểu là ao ước nhau thì cũng cùng ý bất khả. (5) `:2.2` `tividho`: *ba lớp*,
    cách đọc khác là *ba loại*; `:2.3` `hemantikaṁ pāvuraṇaṁ` đồng vị với
    `pāvāro` nên dịch *áo khoác mùa đông*, và không còn điểm “ba loại chỉ kể
    hai” như bản cũ ghi (đó là hậu quả của việc dịch sai `pāvāra` thành
    *trống*). (6) `:9.1` `muḷāla pattānaṁ` (dấu cách trong Pāli ghim) đọc là hợp
    từ *cuống và lá sen*; cách đọc khác coi `muḷāla` là hô cách nhưng không có
    tiền lệ nào trong các kệ cùng loại.
  - >-
    **Phân loại và xử lý blocker.** (A) Thiếu bản Anh upstream: GIỮ nguyên, vì
    đúng sự thật (ja425 không có trong tầng `english-sujato` tại commit đã ghim,
    không có `english-project`, không có `vietnamese-current` cho Khuddaka
    Nikāya; đo coverage có mẫu số 0 vì cả 49 khoá Pāli ngắn hơn 40 ký tự nên
    cổng coverage không đo được gì). (D) Blocker “mười từ hapax chưa phân xử”:
    GỠ vì căn cứ của nó sai (riêng `savaṭākara` được giữ lại thành một blocker
    hẹp theo chỉ đạo của điều phối viên, xem blocking_errors). Mười trong mười
    một từ đó (`kumudinī`, `saṅkhavaṇṇā`, `kacchapalomāna`, `makasapādāna`,
    `avikampī`, `sasavisāṇa`, `nisseṇī`, `bimboṭṭha`, `surāghaṭa`, `gaṇacārinī`)
    là hợp từ trong suốt, đọc được từ hình thái và tiền lệ nêu trên, và nghĩa
    thật của chúng khác hẳn bản cũ; chỉ còn `savaṭākara` chưa giải được, đã ghi
