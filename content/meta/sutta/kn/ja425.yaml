    **Phân loại và xử lý blocker.** (A) Thiếu bản Anh upstream: GIỮ nguyên, vì đúng sự thật (ja425 không có trong tầng `english-sujato` tại commit đã ghim, không có `english-project`, không có `vietnamese-current` cho Khuddaka Nikāya; đo coverage có mẫu số 0 vì cả 49 khoá Pāli ngắn hơn 40 ký tự nên cổng coverage không đo được gì). (D) Blocker “mười từ hapax chưa phân xử”: GỠ vì căn cứ của nó sai (riêng `savaṭākara` được giữ lại thành một blocker hẹp theo chỉ đạo của điều phối viên, xem blocking_errors). Mười trong mười một từ đó (`kumudinī`, `saṅkhavaṇṇā`, `kacchapalomāna`, `makasapādāna`, `avikampī`, `sasavisāṇa`, `nisseṇī`, `bimboṭṭha`, `surāghaṭa`, `gaṇacārinī`) là hợp từ trong suốt, đọc được từ hình thái và tiền lệ nêu trên, và nghĩa thật của chúng khác hẳn bản cũ; chỉ còn `savaṭākara` chưa giải được, đã ghi ở mục bất định (1); theo chỉ đạo, cụm này được giữ làm blocker hẹp riêng thay vì coi là hết trọng yếu. Không có blocker loại (B) hay (C) trên bài này.
