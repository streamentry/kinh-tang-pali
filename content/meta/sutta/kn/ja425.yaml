  - >-
    [THAY THẾ bởi mục “Giải quyết draft 2026-10-12” ở cuối: bản dịch cũ của các
    khoá thân bài đã bị viết lại; phần từ vựng dưới đây không còn đúng] **BẤT
    ĐỊNH TỪNG CHỖ, KHÔNG GIẤU — sáu chỗ khó nhất.** (a) `:1.1` `kumudinī` dịch
    *sen*; từ điển có hai đường (một loài cây, hoặc bông sen), nhưng vế kế
    `saṅkhavaṇṇā` (màu xanh) ủng hộ đường bông sen. (b) `:1.2` `saṅkhavaṇṇā`
    dịch *có màu xanh* — `saṅkha` là màu xanh-trắng như trăng non, và từ này
    không có tiền lệ. (c) `:3.1` `makasapadāna` dịch *con ruồi chân cá* theo
    nghĩa chữ (ruồi + chân); `pādāna` là hapax nên không có gì để kiểm chứng.
    (d) `:3.3` `avikampī` dịch *kẻ không chớp mắt* — `vi-kampī` là không lay
    động; cách đọc khác là không run rẩy. (e) `:4.1` `sasavisāṇāna` dịch *hội
    trường*; `:4.3` `saggassārohaṇatthāya` dịch *để làm đường lên cõi trời*
    (`cõi trời` là khuôn đã có, 699 lần). (f) `:7.1` `bimboṭṭha` dịch *con bò có
    đầu để mộc*; từ điển ghi là một loại bồ câu mộc đầu, tôi giữ yếu tố mộc đầu
    thay vì dịch thành một tên loài.
  - >-
    [THAY THẾ bởi mục “Giải quyết draft 2026-10-12” ở cuối: bản dịch cũ của các
    khoá thân bài đã bị viết lại; phần từ vựng dưới đây không còn đúng] **Còn
    đây là chỗ bản nháp tôi tự bắt được trong lượt review đối kháng.** `:2.2`
    `pāvāro tividho siyā` nói *ba* loại trống nhưng `:2.3` chỉ kể *hai*
    (`Hemantikaṁ` và `pāvuraṇaṁ`); đây là thiếu sót của chính Pāli, tôi
    **không** bịa thêm loại thứ ba, và ghi ra đây để người biên tập biết câu này
    không khép kín. Thêm nữa, tôi đã sửa hai chỗ sau khi đọc lại: `:4.2` từ *chỗ
    nghỉ tốt đẹp* (không giữ được dạng nữ của `nisseṇī`) thành *bến tàu tốt đẹp*
    cho khớp với `:5.1`, và `:4.3` từ *để leo lên* thành *để làm đường lên* cho
    đúng `āsārohaṇa` là đường đi lên.
  - >-
    [THAY THẾ bởi mục “Giải quyết draft 2026-10-12” ở cuối: bản dịch cũ của các
    khoá thân bài đã bị viết lại; phần từ vựng dưới đây không còn đúng] **Thuật
