    dây cáp" (a rope, cable), dẫn đúng chỗ này (Jātaka III 478, `nāvā
    sa-vaṭākarā`), từ nguyên: hoán vị của Sanskrit *vaṭārakā*, gắn với *vaṭa*
    "dây"; hình thái `sa-` + `vaṭākara` song hành với `sa-` + `yanta` cùng khoá;
    đổi "cùng máy móc và trang thiết bị của nó" (bao quát, không chắc) → "cùng
    cả máy móc lẫn dây chão". Bỏ blocker unresolvedTerm vì đã có căn cứ từ điển
    kiểm lại được trỏ đúng câu kệ. 11.4 dời dấu chấm ra sau nháy đóng cho khớp
    10 câu điệp trước và Pāli. Giữ các khoá còn lại. Bất định còn lại (không
    chặn): `yanta` của thuyền là cơ cấu/bộ buồm hay máy móc chung; `kulaka`,
    `tividho`, `paripāteyyuṁ`, `pihayeyyuṁ`, `muḷāla pattānaṁ`, chủ ngữ tỉnh
    lược của `siyā` như notes cũ. Lệch chéo (không sửa): tiêu đề "Kinh
    Aṭṭhānajātaka" lặp "jātaka" và 0.3 "Phẩm Kaccānivagga" (ja417–ja425).
