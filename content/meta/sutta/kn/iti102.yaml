notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 2.2 — «Này các tỳ-kheo, biết gì, thấy gì mà lậu hoặc tận diệt?» → «Và này các tỳ-kheo, biết gì, thấy gì mà lậu hoặc tận diệt?» (Pāli mở bằng `Kiñca`, «ca» là «và», bản cũ bỏ mất; cùng Pāli ở `sn12.23:1.3`, `sn22.101:1.3` đều có «Và»). Giữ «lậu hoặc tận diệt» thay cho «có sự đoạn tận các lậu hoặc» của bản đa số, vì khớp cách dịch `khayo` ở 2.1, 2.3, 2.4 cùng bài.
