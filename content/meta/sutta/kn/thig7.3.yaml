  0.1 giữ Pāli Therīgāthā 7.3 theo quy ước tầng (thig8.1:0.1, thig9.1:0.1 giữ y nguyên). 0.3 theo khuôn thig8.1:0.3.
  PĀLI THẮNG Ở 1.3–1.4: bản Anh đã ghim dịch Paṭivijjhi thành I penetrated, tức đổi ngôi kể từ thứ hai (đối tượng thứ hai) sang thứ nhất, và đẩy akāpurisasevitaṁ sang 1.4. Dịch theo Pāli.
  3.2 và 3.3 là HAI CÁCH apposition giải nghĩa cho maraṇaṁ (sự chết), không phải hai mệnh đề mới — bản Anh đã ghim cũng gộp vào 1.1 như vậy. Vadhabandhapariklesaṁ đảo thứ tự vadha/bandha so với Bandhaṁ vadhaṁ pariklesaṁ của sn5.6:3.3, và ta dùng lại y nguyên cụm Việt của sn5.6:3.3 (trói buộc, sát hại, não hại) vì phức hợp là danh sách các đau khổ, không có thứ tự.
  BẤT ĐỊNH 5.3: Ariyaṁ caṭṭhaṅgikaṁ maggaṁ có đúng MỘT tiền lệ khít là con đường Tránh đạo tám chi phần, (sn15.10:6.5) và KHÔNG dùng lại, vì Tránh đạo dịch sammā thành đường tránh (đọc lên nghe như tà đạo) và bản đó cũng bỏ mất ariya. Chọn Bát chánh đạo, theo đa số đo được toàn tầng (284 lần bát chánh đạo so với 147 lần tám ngành). GHI RÕ là lệch với tiền lệ.
  BẤT ĐỊNH 4.3: So me dhammamadesesi, có bản khớp ở sn8.12:3.1 là Ngài đã thuyết Pháp cho con: — ở đây người kể là Upacālā nói về chính mình (6.1 Tassāhaṁ cũng là ngôi thứ nhất) nên dùng Ngài đã thuyết Pháp cho ta,. GHI RÕ là lệch MỘT CHỮ với tiền lệ.
  6.3 Tisso vijjā anuppattā có 10 biến thể trong tầng; chọn Ba minh đã chứng đắc, (11 lần, không thêm chủ ngữ mà Pāli không có) và dùng CHÍNH CÁI NÀY cho thag7.3:7.3 vì hai khoá trùng nguyên văn và cùng nằm trong lát này. Lệch với thig8.1:7.3 (ba minh đã chứng đạt,) có chủ đích.
  1.1 Satimatī cakkhumatī dịch Tự thuộc, mắt sáng suốt, — đây là hai tính từ gọi thẳng tỳ-kheo-ni Upacālā; cakkhumatī hiểu là mắt tuệ, không bịa thêm đối tượng. 1.4 kāpurisa dịch kẻ thấp hèn (tiền lệ: kẻ thấp hèn, kẻ ác nhân, kẻ hạ tiện — cùng một nghĩa).
  Nháy kép: ba cặp kép, mở ở 1.1, 2.1, 3.1 và đóng ở 1.4, 2.4, 7.4. Cặp thứ ba xuyên suốt 3.1–7.4 vì PĀLI CŨNG VẬY — 4.x–6.x là phần kể nằm trong ngoặc kép theo quy ước SuttaCentral — nên không thêm nháy kép ở 4.1, 5.1, 6.1. Cân trên cả bài.
  8.1 có HAI dấu lược ở Pāli, giữ đúng hai. 9.1 khép tập theo thig8.1:10.1 và thag7.5:7.8.
