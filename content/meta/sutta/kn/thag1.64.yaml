notes: |-

  **Tầng Anh có mặt nhưng thiếu đúng một khoá.** 8/9 khoá có tiếng Anh Sujato tại commit đã ghim. Khoá thiếu là dòng kết *… X thero ….* (`:1.5`), vốn là dạng lược của công thức quy kết *Itthaṁ sudaṁ … gāthaṁ abhāsitthāti*. Tôi **không** mở rộng dòng kết: BRIEF_VI3 §10.1 nói thẳng *Pāli có dấu lược thì bản Việt giữ nguyên, không bao giờ mở rộng* — mở rộng là thêm chữ KHÔNG ĐÁNH DẤU, và đã có tiền lệ sai thật (ba ngọn lửa `rāgagginā…` bị nhân sang `sn35.29:1.15`). Tiền lệ có sẵn trên đĩa làm đúng như vậy và đã `published`: `thag1.42` là ngoại lệ ngược lại, tôi **không** theo. Số dấu lược của mọi khoá `:1.5` bằng Pāli (2 = 2). Không đối chiếu được tầng Việt hiện hành như đã nói ở trên.
  **Đặt kinh theo thứ tự khoá của lát này** (`0.1` = Theragāthā + số · `0.2` = Ekakanipāta · `0.3` = vagga · `0.4` = tên bài kệ) — cùng thứ tự với `thag1.42`, `thag1.107`, bài đã `published`. `Ekakanipāta` → *Bộ Một Bài Kinh* (159 lần trong tầng kn; chỉ `thag1.1:0.2` viết *Tập Một*). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>* (25 lần, so với 4 lần *Bài Kệ…*). `Theragāthā 1.N` giữ **số** như `thag1.42:0.1`. ở `:1.5` Pāli dùng dạng chủ cách (*Cittako*, *Suppiyo*, *Suyāmano*…); bản Việt dùng dạng gốc để thống nhất với tên bài kệ, đúng cách `thag1.113` (`Vanavaccho` → *Vanavaccha*), `thag1.34` (`Posiyo` → *Posiya*), `thag1.46` (`Samiddhitthero` → *Samiddhi*) đã làm.

  **Tên riêng giữ nguyên dạng Pāli** và đều xác minh được trong Pāli đã ghim (không phải đặt mới): Vimalakoṇḍañña, Suyāmana, Cittaka, Suppiya, Sīha, Mettaji (giữ âm, dạng gốc). `lọt_pāli` trong `_hvi.py` chỉ quét khoá Pāli ≥ 40 ký tự mà mọi khoá của Theragāthā đều ngắn hơn, nên tên có dấu ở đây không bị chặn; tôi vẫn tra lại từng tên.
  **Thuật ngữ, đếm được.** `ketu` → *lá cờ* (0 tiền lệ trực tiếp trong tầng kn; Sujato dùng *banner*). `paṇḍara` **0 tiền lệ**: `paṇḍaraketu` tôi dịch *lá cờ trắng muốt* — `paṇḍara` nghĩa gốc là *trắng, sáng*, và trong tầng chỉ xuất hiện ở `paṇḍaralekha` (sinh trắng) nên *trắng* là căn cứ. `padhaṁsayī` → *làm nát* (chưa có tiền lệ). `Ketuhā` → *Làm sao …* (câu hỏi tu từ).

  **Đây là bài tôi hạ điểm nhất trong 13 bài có tầng Anh.** `semantic_fidelity` 9.1 và `vietnamese_clarity` 9.1 vì hai chỗ sau, ghi ra đây chứ không giấu trong thân kinh:

  (1) `:1.1`–`:1.4` là chơi chữ *ketu* (lá cờ) với tên `Vimalakoṇḍañña`, và Pāli bỏ hẳn vị ngữ ở giữa: `Ketuhā ketunāyeva,` là câu hỏi tu từ không mệnh đề, `mahāketuṁ padhaṁsayī”ti.` mới là mệnh đề. Tôi dựng lại thành hai câu hỏi tu từ liên tiếp (*Làm sao kẻ mang cờ hạ được lá cờ, / lại làm nát lá cờ lớn*), phải chấp nhận dịch `ketunāyeva` (*chính như lá cờ*) thành *mang cờ*. Kết quả đọc hơi tròn trong tiếng Việt vì cả `kẻ mang cờ` và `lá cờ` lặp.

  (2) `:1.1` `Dumavhayāya uppanno` — `dumavhayāya` là cách ngữ sở hữu đích, tôi dịch *sinh ra đời để được gọi là cây*; `paṇḍaraketunā` ở 1.2 là công cụ (*sinh ra từ*), tôi dịch *sinh ra từ lá cờ trắng muốt*. Vậy hai câu dùng hai từ khác nhau cho cùng một ý, nhưng Pāli vốn vậy (`uppanno` / `jāto`), nên tôi giữ. Sujato đọc `paṇḍaraketu` là *one whose banner shines* — *tỏa sáng* hơn là *trắng*; hai cách đều có, tôi chọn theo nghĩa gốc của `paṇḍara` và ghi ở đây.**Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm — ở lát này chỉ 0/155 khoá Pāli đủ 40 ký tự, nên chốt tự kiểm 0% và assertion còn lại không tự chạy; phần tôi tự kiểm: 9/n khoá có mặt và không thừa khoá, đúng segment ID, mọi chuỗi NFC, không khoá rỗng, không khoá nội dung nào trùng nguyên văn Pāli, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài và không bao giờ âm, không còn `(…)`, không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (lát này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Theragāthā 1.N Aṅguttara Nikāya 11 không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.
