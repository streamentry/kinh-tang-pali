notes: |-
  **ĐÃ ĐỌC TOÀN BỘ 63 KHOÁ PĀLI TRƯỚC KHI VIẾT**, rồi in lại từng cặp Pāli↔Việt sau khi ghi.

  **TẦNG THAM KHẢO — không có tệp Anh đã ghim** ⇒ `draft`, `triangulation` 7,5. Chỉ có một đối chiếu gián tiếp: khổ kệ `Cātuddasiṁ pañcadasiṁ…` trùng với `an3.37` và `sn10.5`, và bản Sujato ở hai bài đó (đọc từ tệp đã ghim) dịch `Pāṭihāriyapakkha` là *fortnight of special displays* — dùng để kiểm chứng cách đọc của riêng khổ kệ này, KHÔNG phải bản Anh của `vv24`.

  **CẤU TRÚC.** Bài thuộc khuôn `Cittalatāvagga`: kệ 1–3 (câu hỏi của Tôn giả Moggallāna, `…pe…` ở `:2.2` `:3.2` `:10.2`), kệ 4–10 (lời nữ thiên tự thuật, trùng nhiều với `vv15`, `vv19`, `vv22`, `vv23`, `vv25`), rồi kệ 11–15 là phần **riêng** của bài: nàng hối tiếc vì đã đặt tâm vào cõi trời (`Nandana`) mà không làm theo lời Đức Phật; hỏi tuổi thọ; được Tôn giả trấn an rằng đã được Đức Phật tuyên bố là bậc Dự Lưu. Người nói ở kệ 13 và 15 là Tôn giả Moggallāna (Pāli không nêu tên ở hai khoá này; suy từ khuôn của cả phẩm và vai hỏi–đáp).

  **DÙNG LẠI NGUYÊN VĂN BẢN ĐÃ CÓ** (đo trên toàn bộ `vv` đã dịch; số trong ngoặc là số khoá đã dùng đúng dạng đó, dạng nhiều nhất): `:1.1` (12) · `:1.2` (11) · `:1.3` (10) · `:1.4` (12) · `:2.1` (20) · `:2.3` (14) · `:3.1` (24) · `:3.3` (37) · `:4.3` (4) · `:4.4` (2) · `:5.1` (3) · `:5.3` (3) · `:5.4` (4) · `:6.1` (6) · `:6.2` (4) · `:6.4` (5) · `:8.2` (5) · `:10.1` (33) — 18 khoá giữ nguyên dạng đa số; `…pe…` → `…` (3/3 khoá ở bài này; toàn tầng 77 dạng `…` so với 12 dạng `… ` có khoảng trắng). `:2.3` và `:10.3` cùng một công thức Pāli chỉ khác `te`/`me`, nên tôi dịch cùng dạng *dung sắc … chiếu sáng khắp muôn phương* (dạng này đa số ở `:2.3`: 14; riêng `:10.3` dạng *sắc tướng* có 16 khoá nhưng đứng cạnh nhiều dạng khác) để bài không tự mâu thuẫn.
  **Cặp Pāli trùng nguyên văn TRONG CHÍNH bài:** 1 cặp (`…pe…` ×3), cả ba bản Việt đều `…`; 0 cặp khác nhau.

  **CÁC CHỖ CỐ Ý KHÁC TIỀN LỆ (đã đo, xin người biên tập phán):**
  (a) `:5.2` `senāsanaṁ padīpiyaṁ;` → *chỗ ở và đèn đuốc;*. `padīpiya` là dạng của `padīpeyya` = đèn, ánh sáng; `iti75` đã dịch `seyyāvasathapadīpeyyaṁ` là *chỗ nằm, chỗ ở, đèn đuốc*. Ba tiền lệ cùng khuôn đọc khác nhau: `vv22:5.2` *chỗ nằm và tấm phản;* · `vv23:6.2` *cùng chỗ ở tận xa xôi;* · `vv25:5.2` *chỗ ngủ và thức uống;* — 0/3 phản ánh `padīpiya`. Một bản dịch Anh bên ngoài của chính bài này (đọc để đối chiếu, không phải tầng đã ghim) cũng ghi *robes, food, shelter, and lamps*.
  (b) `:6.3` `Pāṭihāriyapakkhañca,` → *cùng cả nửa tháng thần biến,*. `pakkha` là **nửa tháng** (cùng chữ với `pakkhassa` ở `:6.2`), không phải tuần; Sujato dịch *fortnight of special displays*. Tiền lệ: *tuần lễ thần biến/thần thông* ở 9 khoá (`snp2.14:28.3`, `thig2.7:1.3`, `sn10.5:2.3` `:4.3`, `vv15`, `vv19`, `vv22`, `vv23`, `vv25`) và *kỳ phép nhiệm màu* ở 5 khoá (`an3.37:5.3` `:8.3`, `an3.38:2.3` `:5.3`, `vv31`). Tôi không nhân bản chữ *tuần lễ*; các chỗ kia ngoài lát, **báo, không sửa**.
  (c) `:7.1–:7.4` — tiền lệ (5/5) dịch `Uposathaṁ upavasissaṁ` thành *Luôn giữ ngày trai giới* (dời `sadā` lên câu trước), `saṁvutā` thành *giữ mình trong sạch* và `Saññamā` thành *ý thức*. `saññama` là sự **tự chế ngự**, không phải *ý thức*. Tôi dịch: *Tôi đã giữ ngày trai giới, / luôn thu thúc trong các giới; / nhờ tự chế ngự và biết chia sẻ, / tôi cư ngụ trong cung điện này.* (`saññamā saṁvibhāgā` ở ablative ⇒ *nhờ*).
  (d) `:8.1` `Pāṇātipātā viratā` → *Tránh xa việc sát sinh,* chứ không *Từ bỏ sát người* (5/5 tiền lệ): `pāṇa` là **sinh vật**, không chỉ người. `:8.3` `aticārā` → *tà hạnh*: đứng cạnh `theyya` (trộm cắp), `musāvāda`, `pāṇātipāta`, `majjapāna` và ngay trước `Pañcasikkhāpade` (năm điều học), nên là giới tà hạnh dục; tiền lệ *không làm quá đà* quá mờ để biết là giới nào. `:8.4` `ārakā` → *xa lánh*.
  (e) `:9.1–:9.4` — bỏ *Luôn* (Pāli chỉ có `ratā`), *nhiệm mầu* (không có trong `kovidā`), và *đệ tử cư sĩ* → *nữ cư sĩ* (`upāsikā`). **Giữ** *Đấng Có Mắt Tuệ* (7/8 tiền lệ kể cả `vv12:4.2`): *Tuệ* là thêm vào `cakkhumā`, nhưng đã là quy ước của tầng nên không đổi một mình; ghi để biên tập. `:9.4` đặt *của Đức Gotama…* (sở hữu cách như `cakkhumato`).

  **SỐ PĀLI — tự tính.** `Saṭṭhi vassasahassāni` = 60 × 1.000 = **60.000 năm**. `tisso ca vassakoṭiyo` = 3 koṭi; `koṭi` = 10.000.000 theo cách tầng đã dùng (`thag1.96:1.2` `asīti vassakoṭiyo` = 80 × 10⁷ = *tám trăm triệu năm*) ⇒ 3 × 10⁷ = **30.000.000** = *ba mươi triệu năm*. Tổng thọ mạng = 30.060.000 năm. **Bất định đã ghi:** một bản chuyển ngữ ngoài kinh văn ghi con số *ba trăm triệu sáu mươi nghìn năm* cho cùng khoá — khác một bậc; tôi không phân xử được bằng tầng đã ghim và giữ giá trị đo từ `thag1.96`. Hai số hạng đứng riêng ở `:14.1` và `:14.2` (không gộp).

  **BẤT ĐỊNH — KHÔNG GIẤU.**
  · `:15.3` `visesayi` — **hapax** trong toàn bộ Pāli root đã ghim (0 chỗ khác); không tra được nghĩa chắc chắn. Tôi đọc là dạng của `visesī` (*đặc biệt, thù thắng*) làm vị ngữ bổ nghĩa cho `sotāpannā` ⇒ *là bậc Dự Lưu, bậc đặc biệt*. Hướng đọc khác (động từ `visesayati`?) không loại trừ được. Câu chính — được Đức Phật tuyên bố là bậc Dự Lưu, các cõi dữ đã đoạn trừ — không phụ thuộc vào chữ này. Điểm `ambiguity_integrity` bị hạ vì lý do này; **không** coi là blocker vì không làm đổi nghĩa của lời tuyên bố.
  · `:13.2` `vacchasuposathe` — Pāli ghim viết liền một chữ; tôi tách `vaccha` (*thân mến*) + `uposathe` (hô cách của `Uposathā`, như `:15.1`). Chữ `su-` không dịch riêng.
  · `:14.5` `Manussānaṁ sahabyataṁ` — thành ngữ *sinh về chung (cùng loài) với loài người*; tiền lệ lệch nhau (`iti83:13.2` *đến cõi loài người*, `tha-ap189:2.2` *thuộc cùng loài người*). Tôi dịch *đến chỗ sống chung với loài người*, giữ chữ *chung* của `saha-`.
  · `:12.3–:12.4` `Hīne cittaṁ paṇidhāya, sāmhi pacchānutāpinī` — *hīna* dịch *thấp kém* (cõi trời, đối lại với đạo giải thoát); nghĩa *hối tiếc về sau* theo `pacchānutāpinī`, tiền lệ `thig3.7:1.4` *ôm lòng hối hận*. Câu Việt không thêm ý *vì đã chọn cõi trời*; ý đó chỉ suy từ `:11` và để người đọc tự nối.
  · `:4.2` `sāketāyaṁ` — *thành Sāketa* (`Sāketa` là thành, như `ja237`); 0 tiền lệ cho `Uposathā` làm tên người.
  · `:15.2` `byākatā` — *tuyên bố* (không dùng *thọ ký*: Pāli nêu điều đã có, không phải điều sẽ xảy ra).

  **TÊN PHẨM.** `Vimānavatthu` giữ Pāli (69/71) · `Itthivimāna` → *Chuyện Cung Điện Nữ Hư Không* (41/43) · `Cittalatāvagga` → *Phẩm Cây Hoa Cittalatā* (9/9) · tên bài *N. Chuyện Cung Điện Nữ …* và lời kết *Cung Điện Nữ …, thứ N.* theo `vv15`, `vv19`, `vv25` (đo trên các bài cùng phẩm).

  **NGOẶC KÉP** — giữ y hệt Pāli, so từng khoá: 63/63 khoá khớp (mở `“` ở `:1.1` `:4.1` `:11.1` `:13.1` `:14.1` `:15.1`, đóng `”` ở `:2.3` `:10.3` `:12.4` `:13.4` `:14.5` `:15.4`; không có nháy đơn). **DẤU LƯỢC** — Pāli có `…pe…` ở 3 khoá, Việt đúng một `…` ở cả 3; Pāli không có `…` trần nên Việt không có. Không mở rộng chỗ nào.

  **COVERAGE ENGLISH.** Mẫu số = 0 (không khoá Pāli nào ≥ 40 ký tự, khoá dài nhất 35) ⇒ cổng coverage không đo được gì; không có `reference-gaps` cho bài này và có entry cũng không cứu được `published`.

