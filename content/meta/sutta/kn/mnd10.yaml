  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (1142/1142, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` và ngoặc đơn khớp Pāli từng khoá (0/1142 lệch); dấu lược `…` khớp Pāli từng khoá (0/1142 lệch; 312 khoá có `…`: 61 khoá có `…pe…`, 251 khoá có `…` trần; không khoá Pāli nào có `(…)`); 0 khoá rỗng; NFC; không khoảng trắng thừa; không thẻ in đậm; Pāli lọt sang Việt: chỉ còn tên riêng và từ cần giữ (Sāriputta, Pātimokkha, sāli, vīhi). Đã đọc đối kháng từng cặp Pāli – Việt ở các đoạn mới (`40`–`63`, `67`–`71`, `80`–`88`, `139`–`141`) và đối chiếu các đoạn dùng lại với bản gốc của chúng.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 176 khoá chênh lệch lớn nhất (trong 1142 khoá) → khác nghĩa 12 nhóm: sửa 2, giữ 7, bất định 7 (một số nhóm vừa giữ vừa còn bất định). Sửa: `88.1` *vượt qua gánh nặng* → *chở được gánh nặng* (`bhārassa nittharaṇatthāya` là để xe qua được với tải, song song `kantārassa nittharaṇatthāya` và công thức song song ở `sn35.239`, `mnd14:108`, `cnd23:285`); `21.6` *y, vật thực, sàng tọa, thuốc men trị bệnh* → *y áo, đồ ăn khất thực, chỗ ở, thuốc men và vật dụng cho người bệnh* (do review đối kháng toàn bài, không phải từ danh sách chênh lệch: bốn món `cīvara-piṇḍapāta-senāsana-gilānapaccayabhesajjaparikkhāra` khớp cách dịch của chính bài ở `42.2`, `80.3`, `83`–`86`; bản cũ bỏ chữ *parikkhāra* và lệch thuật ngữ trong bài). Giữ: `2.4`/`5.1` `pucchito uttamaṁ naraṁ` (lời giải `5.2`–`5.3` coi `uttamaṁ naraṁ` là bậc được hỏi, không phải đề tài; bản mù đọc *được hỏi về bậc người tối thượng*); `82.6`–`82.14` hạnh đầu-đà (`yathāsanthatiko` là nằm nơi chỗ đã trải, bản mù *giữ hạnh ở chỗ được chỉ định* lệch; `khalupacchābhattiko`, `tecīvariko` chỉ khác diễn đạt); `98.3` `kuñjarā ca mahānāgā` (theo `dhp322`, `cnd8:23`); `33.2`/`34.8`–`34.9` *xúc do danh xưng*, *xúc do va chạm* (bản mù *xúc đối kháng* không bám `paṭigha`); `13.3`–`13.6`, `128.3`–`128.6` *sự đề cao* (23/28 khoá của tầng, bản mù *đặt ra phía trước* chỉ khác thuật ngữ, cùng nghĩa); `35.2` chuỗi phiền não (`makkha` *gièm pha*, `paḷāsa` *hơn thua* theo `mnd9:36.2`; bản mù *che giấu, não hại* là cách dịch khác của tầng Hán–Việt); `117.2`, `135.2`, `105.3`, `39.2`–`39.3`, `40.1` (*nút thắt*, *tạo tác*, *cao ngạo*, *thèm khát*, *xấc xược*, *thu mình*: lựa chọn thuật ngữ đã đo ở mục thuật ngữ trên, bản mù chỉ khác từ). Bất định (không đổi thân kinh): `88.1` Pāli đã ghim ghi `vanaṁ` (rừng), đọc `vaṇaṁ` (vết thương) theo công thức song song (`ropanatthāya` là chữa lành) — chữ Pāli ở tầng ghim có vẻ hỏng một dấu, bản mù cũng không chắc; `79.3`, `87.1`, `90.3` `aviruddho ca taṇhāya` giữ *không chống đối vì tham ái* (cách hiểu `taṇhāya` là nguyên do hay đối tượng của sự chống đối chưa chắc, bản mù cũng ghi không chắc); `87.6`, `87.14` `lambika` (*hăng*, bản mù không dịch); `45.1` `korajikakorajiko`; `70.8` `ñāyatthe` (*ý nghĩa đúng lẽ*, bản mù *phương pháp đúng lý*); `97.1`–`97.2`, `98` `dantaṁ` dịch *voi đã luyện được* theo `dhp321`, `cnd8:22` trong khi Pāli ở dòng này chỉ nói `dantaṁ` (con vật đã luyện) — bản mù dịch *con đã thuần*, giữ vì thống nhất với tầng, ghi bất định; `92.7`, `92.13` `appatiṭṭhitacitto` *tâm không bất an* (công thức dùng chung với `cnd8:16.3`, bản mù *tâm không đứng lại ở đó*). Các chỗ bản mù ghi không chắc (`18.2`, `45.1`, `70.8`, `79.3`, `87.1`, `87.6`, `87.14`, `88.1`, `138.3`, `141.4`, `144.3`) đã xét; không có chỗ nào làm đổi đáng kể nghĩa mà chưa phân xử được. Bản dịch này vẫn **không có bản Anh hay bản Việt độc lập nào khác**; lượt đối chiếu này chỉ có một lần dịch lại cùng họ công cụ nên không thay được tầng tham khảo. Các cổng `npm run validate`, `npm test`, `npm run check`, `npm run build` do người điều phối chạy.
  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bài, không có bản Việt nguyên bài độc lập; đoạn song song `cnd7:62.3`, `cnd8:25.1`, `sn22.76:10.1`, `mnd3:23.7`, `ud2.4:1.3`, `ud5.5:5.5`, `sn48.44`, `mn8`): sửa 16 khoá. `17.15`, `87.2` `doso dussanā dussitattaṁ` *sự làm hại, trạng thái bị làm hại* là sai nghĩa (nghĩa bị động; `dussati` là sân hận, chủ động) → *sự sân hận, trạng thái sân hận* như `cnd7:62.3`; `60.4` `avassuto kasambujāto` *mưng mủ, hư hoại từ gốc* sai (`kasambu` là rác rưởi) → *nhiễm ô, như rác* như `ud5.5`; `133.6` `anajjhosito` *không trói buộc* → *không chấp chặt* cho đúng với `46.5`, `87.17`, `110.18`, `127.2` (đồng thời `agadhito`, `amucchito` → *không buộc chặt, không mê muội*); `80.3`–`82.12` (9 khoá) bỏ chữ *nhiều* thêm vào `lābhī` (*nhận được y áo…*, như `ud2.4`, `mnd3:23.7`); `84.1` `sallekha` *gọt giũa phiền não* (giải thích thêm) → *đoạn giảm* (như `mn8`); `100.1` `vidhāsu` *các loại phân biệt* → *giữa muôn loại* (như `cnd8:25.1`, `sn22.76:10.1`); `109.8` câu chủ ngữ bị lẫn (*vị nào không có sự nương tựa, không hiện hữu*) → *nơi vị nào sự nương tựa không có, không hiện hữu…* theo `yassa nissayatā natthi na santi…`. Giữ: `42.3`, `43.2`, `44.2` `icchāpakato` *có bản tính mong muốn* (khác `cnd23` *bị ham muốn chi phối*, nhưng tầng này nhất quán, chưa rõ hơn); `97.1` *voi* giữ theo `dhp321`; `140.3`, `140.8` *tai trong*, *tai ngoài* theo `cnd22:107`, `mnd15:31`. Bất định (không sửa): `21.3`, `117.4` `vata` *khổ hạnh* theo `mnd3:21.5`, `mnd14:183.3` nhưng `13.28`, `31.22` đặt `vata` *hạnh* còn `tapa` *khổ hạnh*; `132.4`, `135` `kappa` *tạo tác* dễ lẫn với *hành tạo tác* (`abhisaṅkhāra`); `purakkhata`/`purekkhāra` *đề cao* khác `snp4.10` *đặt phía trước* (chờ quyết định thuật ngữ chung); `40.2`, `40.5` `patilīno` *thu mình* khác `an4.38` *ẩn mật*. Cụm `tare loke visattikaṁ`, `adurāgataṁ` không xuất hiện; `atarī so visattikaṁ` (`114.4`, `118`) giữ *sự đắm say*.

  Quyết định hội đồng biên tập 2026-10-16: A4 — `70.5` (chín thể loại kinh theo mn22, bỏ “kinh khất đàm, kinh khế tùng…”); B1 — 19 khoá (`114.4` … `120.4`) (`visattikā` = “sự vướng mắc ở đời”; `tare` = “có thể vượt qua”); B3 — `10.18`, `24.9`, `27.12`, `69.2`, `70.11` (`iddhipāda` = “như ý túc”); B12 — `13.28`, `21.3`, `31.22`, `117.4` (`vata`/`sīlabbata` bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”); B13 — 18 khoá (`132.4` … `137.4`) (`kappa` = “vọng tưởng”; động từ/phân từ `kappeti` = “tạo dựng”, bỏ “tạo tác” (trùng `saṅkhāra`)); B19 — `3.6`, `142.2` (`santo` = “an tịnh”, `upasanto` = “yên lặng”).

  Nghiên cứu nguồn ngoài 2026-10-16: bản Việt song ngữ Pāli–Việt của Tỳ khưu Indacanda,
  Mahāniddesapāḷi - Đại Diễn Giải (Tam Tạng Song Ngữ Pāli–Việt, Sri Lanka 2018),
  https://tamtangpaliviet.net/TTPV/35_Nidd_I.pdf (Đại Diễn Giải, tập 35); đã tải toàn văn và đối chiếu
  phần tương ứng; nguồn độc lập với dự án, giấy phép không khai (NOASSERTION), chỉ dùng làm bằng chứng
  nghĩa, không chép. Đã đối chiếu: căn chỉnh theo đoạn 145 nhóm đoạn của bài với Indacanda (104 nhóm
  khớp từ vựng và không lệch phủ định hay số đếm, 13 nhóm trùng chữ với nhóm đã so ở bài khác, 28 nhóm
  bị cờ; nhóm bị cờ mới quét theo danh sách cờ, chưa đọc từng nhóm); đọc từng nhóm kệ trích (14 nhóm)
  cạnh Indacanda và Sujato; so 62 mục từ đầu đoạn với mục từ của Indacanda; kệ trích còn so với Sujato
  snp4.10 (138 khoá có Pāli trùng chữ với kho `snp`, 43 khoá có Việt trùng chữ, 95 khoá khác, đã xem
  mẫu: phần lớn do ngắt dòng, chấm câu hoặc do Niddesa tự đọc kệ khác Sujato). Phần lời giải Niddesa
  chỉ có Indacanda làm nguồn độc lập (Sujato không có bài này); phần kệ trích có thêm Sujato. Sửa:
  không có khoá nào. Bất định/ghi nhận: 121.3, 123.1, 123.8, 125.3 `attā vāpi nirattā vā` «ngã hay cái
  bị buông bỏ»: cùng bất định `attā nirattā` như mnd3.
  Thống nhất cấp kho 2026-10-17: paṭipassaddhi/paṭippassaddha/paṭippassambhati thống nhất «dịu xuống» ở 18.15, 24.19, 25.11, 31.4, 36.2, 45.4, 46.4, 46.13, 59.5, 63.9, 67.6, 68.6, 87.4, 87.18, 105.5, 109.8, 111.7, 117.7, 122.11, 133.4, 133.14 (DPD calming down/subsiding; «an tịnh» va chạm santi theo B19, «lắng dịu» va chạm vūpasama), như các chuỗi santo … paṭipassaddho đã dùng (dec/corpus_rest.tsv).
  Sửa 2026-10-18 theo đối chiếu khoá trùng Pāli: 42.3, 43.2, 44.2 icchāpakato «có bản tính mong muốn» → «bị ham muốn chi phối» (nghĩa từ sai: pakata là quá khứ phân từ, đã bị đọc như pakati «bản tính»; DPD icchāpakata «who is afflicted with desire; who is led astray by longing» [icchā + apakata]; chú giải CST Mahāniddesa phần 10 «Icchāpakato ti icchāya apakato, upaddutoti attho»; khớp cnd23:213.2, 214.2, 215.2 (published), mnd16:67.3, 68.2, 69.2). Quyết định giữ của lượt 2026-10-15 được đảo vì có căn cứ mới (DPD và chú giải của chính văn bản); đồng bộ cùng ngày ở an5.93, an5.165, an5.181–an5.190.
