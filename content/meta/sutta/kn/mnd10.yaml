  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `dvāsaṭṭhi` = dve 2 + saṭṭhi 60 = 62 → *sáu mươi hai* (`36.2`, 1/1, trùng nguyên văn `mnd5:31.2`); `dasahākārehi` = 10 → *mười nguyên do* (`17.4`; kiểm danh sách: 3 + 3 + 3 + 1 = 10: `17.5`–`17.7`, `17.8`–`17.10`, `17.11`–`17.13`, `17.14`); `bāttiṁsāya tiracchānakathāya` = bā 2 + tiṁsa 30 = 32 → *ba mươi hai thứ chuyện phù phiếm của loài súc sinh* (`26.10`); `catūhi vacīsucaritehi` = 4 (nói dối, nói chia rẽ, nói thô ác, nói phù phiếm: `26.2`–`26.9`); `catuddosāpagataṁ` → *không có bốn lỗi*; `dasa kathāvatthūni` = 10 → *mười đề tài* (`27.1`; danh sách ở `27.2`–`27.18` dài hơn mười mục, đúng Pāli); `tīṇi kuhanavatthūni` = 3 (`41.1`, kiểm `41.2`, `42`–`44`: 3/3); `pañca macchariyāni` = 5 (`46.7`, `133.9`; 5/5 mục ở `46.8`); `tīṇi pāgabbhiyāni` = 3 (`47.2`; thân, lời, ý: `47.4`, `55.1`, `59.1`); `tayo paṭibhānavanto` = 3 (`70.1`; 3/3: `70.3`, `70.7`, `70.10`); `cattāro ganthā` = 4 (`117.2`; 4/4 ở `117.3`); `cattāro puttā` = 4 (`122.4`; 4/4 ở `122.5`); `sattussadā` = 7 (`105.3`; 7/7 ở `105.4`: tham, sân, si, ngã mạn, kiến, phiền não, nghiệp); `catūhi kāraṇehi sato` = 4 (`102.4`; 4/4: thân, thọ, tâm, pháp); `dve` = 2 (`13.3`, `109.3`, `110.6`, `116.2`, `128.3`, `135.2`, `135.10`: 7/7, mỗi chỗ đủ 2 mục); `aṭṭha ariyapuggalā` = 8 (`61.8`), `satta sekkhā` = 7 (`76.2`); danh sách `10.15`–`10.19` (bốn thiền, bốn vô lượng, bốn thiền chứng vô sắc; tám giải thoát, tám thắng xứ, chín sự chứng đạt phép sống tiếp nối; mười sự tu tập tuệ, mười sự chứng đạt biến xứ; bốn niệm xứ, bốn chánh cần, bốn thần túc, năm căn, năm lực, bảy giác chi; mười Như Lai lực, bốn vô úy, bốn vô ngại giải, sáu thắng trí, sáu pháp của Phật) và `70.11` (… bốn Thánh đạo, bốn quả Sa-môn, bốn vô ngại giải, sáu thắng trí) khớp số Pāli từng mục; `12.4` 8/8, `12.6` 10/10, `60.8` 7 cặp (2+2+2+2+2+2+3), `141.4` 4 + 8 mục, `87.6` 6 loại nguồn vị + 12 vị, `140.2`–`140.49` 48 mục. Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi`; không có cụm