notes: |-
  **Phạm vi: đủ 1142/1142 khoá của mnd10, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải kinh `snp4.10` (Purābhedasutta, Kinh Trước Khi Tan Hoại), thuộc phẩm Aṭṭhakavagga. Cấu trúc như `mnd9`, `mnd11`, `mnd13`: dẫn từng đoạn kệ in đậm (14 đoạn: `2` là lời hỏi của vị được hóa hiện, `8`, `16`, `30`, `39`, `66`, `79`, `91`, `108`, `114`, `121`, `126`, `132`, `138` là lời đáp của Đức Thế Tôn), giải từng cụm, rồi nhắc lại cả đoạn kệ trong nháy kép (14 lần: `7`, `15`, `29`, `38`, `65`, `78`, `90`, `107`, `113`, `120`, `125`, `131`, `137`, `144`). Lời dẫn nhập: 13 lần *Vì thế, Đức Thế Tôn đã nói—* (`14`, `28`, `37`, `64`, `77`, `89`, `106`, `112`, `119`, `124`, `130`, `136`, `143`) và 1 lần *Vì thế, vị được hóa hiện ấy đã nói—* (`6`). Đoạn `10` giải nghĩa *Thế Tôn* (song song `mnd7:16`); `40.4`–`40.7` trích một bài kinh về vị tỳ-kheo thu mình (`an4.38`); `72`–`74` trích cuộc đối thoại Sāriputta – Đức Thế Tôn về tín căn (song song `sn48.44`); `75` trích một kệ (song song `dhp97`); `97`–`101` trích bốn kệ về điều phục (song song `cnd8:22`–`26`). Pāli có 189 khoá mang thẻ in đậm, bản Việt không mang thẻ. Dấu lược `…`: 312 khoá (61 khoá có `…pe…`, đều thành đúng một `…`; 251 khoá chỉ có `…` trần), mỗi khoá giữ đúng số dấu của Pāli, trong đó `46.5` có 30 dấu, `59.2` có 12, `118.15` có 8, `40.2` có 6, `69.2` có 5, `67.5` có 4; 0 khoá có `(…)`; 0 khoá Pāli kết `….` (295 khoá kết bằng `…`). Nháy: Pāli có 125 khoá chứa “ và 125 khoá chứa ”, 1 khoá chứa ‘ (`42.19`) và 1 khoá chứa ’ (`42.22`), 2 khoá chứa ngoặc đơn (`8.2`, `15.2`); bản Việt khớp Pāli từng khoá (0/1142 lệch, cả bốn loại nháy và ngoặc đơn).

  **Tên bài.** `0.1`, `0.2`, `1.1`, `145.1` theo `mnd9` (*Đại Tập Kể Lược*, *Kể Lược Phẩm Tám Kệ*, *Giờ đây, sẽ nói phần Kể Lược Kinh …—*, *Kể Lược Kinh …, thứ …*); `0.3` ghi *10.* rồi *Kể Lược Kinh Trước Khi Tan Hoại*, tên kinh theo `snp4.10:0.2` (*Kinh Trước Khi Tan Hoại*); tiêu đề Anh của Sujato cho phần chú giải này (tệp tên `mnd-name`) là *Exposition of the Discourse on Before the Dissolution*.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd10`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho `mnd10` và tệp tên `mnd-name` (chỉ có tiêu đề các bài); tệp `mnd10_translation-en-sujato.json` không tồn tại. Lớp `english-project` không có `mnd10`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **442** khoá (445 nếu đếm cả thẻ); Sujato phủ 0/442, `english-project` 0/442, `vietnamese-current` 0/442. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.10` (bài kệ mà phần này chú giải) có trong tầng đã ghim nhưng là bản của **bài khác**, nên không tính là đối chiếu English của mnd10. Chứng cứ độc lập còn lại là các bản Việt đã dịch: `snp4.10`, `cnd5`, `cnd7`, `cnd8`, `cnd10`, `cnd12`, `cnd13`, `cnd16`, `cnd17`, `cnd19`, `mnd1`, `mnd3`–`mnd9`, `mnd11`–`mnd13`, `sn48.44`, `mn132`, `mn133`, `mn107`, `mn55`, `dn2`, `dn31`, `dn33`, `an3.41`, `sn35.239`, `sn35.241`, `ps2.10`, `dhp97`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa; lượt thứ hai bỏ cả dấu câu và chữ hoa/thường) trùng với khoá đã dịch ngoài bài này: 394 khoá có tiền lệ (295 trùng nguyên dấu câu + 99 chỉ khác dấu câu hay chữ hoa), dùng lại nguyên văn 277 khoá (khác nhau chỉ ở dấu câu và chữ hoa/thường được tính là dùng lại), khác 117. Nguồn dùng lại nguyên văn (khoá trùng nguyên dấu câu, theo nguồn đầu tiên khớp): `mnd9` 35, `mnd13` 28, `cnd8` 24, `snp4.10` 20, `mnd11` 17, `mnd3` 13, `cnd16` 9, `mnd4` 7, `an8.80` 6, `cnd17` 5, `cnd19` 5, `sn48.68` 5, còn lại rải ở `mn132`, `mnd6`, `cnd7`, `dn33`, `cnd13`, `mnd1`, `cnd5`, `mnd7`. 117 khoá Pāli trùng mà bản Việt khác, kèm lý do:
        - 88 khoá là dòng kệ hoặc dòng nhắc lại dòng kệ (`2.3`, `2.4`, `4.5`, `5.4`, `7.3`, `8.1`, `8.4`, `8.5`, `15.1`, `15.4`, `16.1`–`16.3`, `29.1`–`29.3`, `39.2`–`39.4`, `63.10`, `65.2`, `65.3`, `66.1`–`66.4`, `76.5`, `78.1`–`78.3`, `79.1`–`79.3`, `90.1`–`90.3`, `91.2`, `91.4`, `105.6`, `107.2`, `108.3`, `108.4`, `113.3`, `114.3`, `120.3`, `121.1`–`121.4`, `125.1`–`125.3`, `126.1`–`126.4`, `131.1`–`131.3`, `132.1`–`132.4`, `137.1`–`137.3`, `138.1`, `138.3`, `144.1`, `144.3`; và các dòng nhắc lại cuối lời giải `20.4`, `24.20`, `25.12`, `67.8`, `68.7`, `70.19`, `76.5`, `84.3`, `103.3`, `117.8`, `128.9`, `129.3`, `133.15`, `135.16`, `138.4`, `139.6`, `141.5`, `142.3`) trùng dòng của `snp4.10`, nhưng bản Việt của `snp4.10` xếp dòng lệch so với dòng Pāli ở `1.3`–`1.4` và `9.1`–`9.4` (dòng *hữu hay phi hữu* và dòng *khát ái … không còn* bị đảo), và chọn chữ khác với lời giải của chính bài này: `taṇhā` *khát ái* ⇒ *tham ái* (đo: trong 398 khoá `mnd`/`cnd` có `taṇh`, *tham ái* 360, *khát ái* 5); `kodha` *sân* ⇒ *giận dữ* (51 so với *sân hận* 29, trong 78 khoá `mnd`/`cnd`; `cnd7:62`–`64` và danh sách `mnd9:36`); `kukkucca` *hối tiếc* ⇒ *hối hận* (15 so với 11 trong 18 khoá; *hối tiếc* dành cho `vippaṭisāra`, như `cnd17:22`); `uddhacca` *xao động* ⇒ *trạo cử* (13 so với 3); `macchariya` *bỏn xẻn* ⇒ *keo kiệt* (37 so với 8 trong 45 khoá `mnd`/`cnd`, tám khoá *bỏn xẻn* đều ở `mnd11`); `atimāna` *kiêu mạn thái quá* ⇒ *ngạo mạn* (18 so với *quá mạn* 7 trong 26 khoá; thêm *kiêu mạn thái quá* ở `snp4.10`); `purakkhata` *được đặt phía trước* ⇒ *được đề cao* (23 trong 28 khoá `purekkhāra`, `mnd3:37`, `mnd4:59`); `ussada` *kiêu mạn* ⇒ *cao ngạo* (7 trong 9 khoá); `ganthā` *trói buộc* ⇒ *nút thắt* (10 so với 7 *trói buộc* và 6 *kết thân*, `mnd4:61`, `mnd9`); `nupasaṅkheyya` *tính lường* ⇒ *tính đếm* (`cnd10:41`, 10/10 khoá có `saṅkhaṁ`); `lābha` *lợi đắc* ⇒ *lợi dưỡng* (13 so với *lợi lộc* 6); `appagabbho` *thô tháo* ⇒ *xấc xược* (`snp4.14:16.3`, 0 tiền lệ ở `mnd`/`cnd`); `apihālu` *không tham lam* ⇒ *không thèm khát* (xem mục thuật ngữ); `kappa` *sắp đặt* ⇒ *tạo tác* (`mnd4:59`, 42 khoá `mnd`/`cnd`); `nirattā` *vô ngã* ⇒ *cái bị buông bỏ* vì lời giải `123.2`–`123.5` (*ngã* là nắm giữ, *nirattā* là điều cần buông, nên không thể là *vô ngã*); `pesuṇeyye … yuto` *không dính lời ly gián* ⇒ *không dính líu đến lời ly gián* theo lời giải `63.9` (*không gắn bó, không dính dáng, không hoàn toàn gắn kết*); `saṇho` *dịu dàng* ⇒ *tinh tế* vì lời giải `69.2` áp cho cả niệm xứ, chánh cần, thần túc, căn, lực, giác chi, Thánh đạo; `sātiyesu anassāvī` *không đắm say lạc thú* ⇒ *không rỉ chảy nơi những điều ưa thích* vì lời giải `67.5` (*savati āsavati sandati pavattati*, ái *chảy* ra từ sáu căn) và `visattikā` đã là *sự đắm say*; `na saddho na virajjati` *không cả tin, không chán lìa* ⇒ *không tin theo ai, không ly tham* theo lời giải `71.2`, `76.3` và `mnd6:91.3`; `dhammesu na gacchati` *không đi đến các pháp* ⇒ *không đi theo các pháp* vì lời giải `141.4` (thiên vị do ham muốn, sân, si, sợ hãi và sức chi phối của tám phiền não);
        - `13.11`, `31.7` (2 khoá): `mnd9:81.4` *Mong rằng ta có thọ như thế này*, bài này dùng *mong rằng tôi sẽ có thọ như vậy* theo `mn132:7` và ngôi *tôi* của `13.12`, `13.13`, `31.8`, `31.9` (4 khoá, trùng nguyên văn `mn132:6.3`, `6.4`);
        - `17.8`, `17.11` (2 khoá): `mnd11:50.6`, `50.9` dịch *đã làm điều bất lợi cho người ta thương …*; bài này giữ khung nháy kép của Pāli (`“piyassa me …`) nên mở bằng *giận dữ sinh khởi khi nghĩ “người ấy đã làm …* và đóng ở `17.10`, `17.13` bằng *sẽ làm điều … ”, giận dữ sinh khởi khi nghĩ như vậy*;
        - `26.3`, `26.6`, `26.7` (3 khoá): `sn42.8:11.5`, `11.6`, `an3.28:3.3` dịch *nói hai lưỡi*, *nói lời ác*; bài này dùng *nói lời chia rẽ*, *nói lời thô ác* theo `cnd17:22.16`, `22.17` (`pisuṇā vācā` / `pharusā vācā`);
        - `40.5`, `40.6` (2 khoá): `an4.38:4.1` *bậc ẩn mật* và `an5.72:6.2` *mạn chấp ‘ta là’ … như gốc cây ka-tê*; bài này dùng *bậc thu mình* theo `snp4.10:5.1`, và công thức `ucchinnamūlo tālāvatthukato …` theo `dn33:3.3.82`, `mn55:7.6` (*chặt tận gốc, làm như thân cây thốt nốt bị chặt ngọn, làm cho không còn hiện hữu*);
        - `46.14`, `61.9` (2 khoá): cùng lý do với dòng kệ tương ứng (*thèm khát*, *keo kiệt*, *xấc xược*); `61.2` theo `dn33:3.3.5` (*sống được phòng hộ bằng giới bổn Pātimokkha, đầy đủ oai nghi và nơi đi lại thích hợp*); `63.5`, `73.11` chỉ khác dấu phẩy hoặc thêm *điều ấy* so với `mnd11:6.12`, `sn48.44:2.5` (3 khoá);
        - `92.5`, `92.8`, `94.1`, `94.3`, `94.5`–`94.8` (8 khoá): `dn33:2.2.119`, `dn33:1.11.77`, `cnd8:18`, `19` dịch *Ngài* hay *thanh*; bài này dùng *vị ấy* (chủ thể là bậc A-la-hán), *âm thanh* (như `cnd8`, `mnd9`) và *hoan hỷ cũng không ưu phiền* theo `mnd13:126.6`;
        - `100.1`, `100.4`, `101.2` (3 khoá): `sn22.76:10` dịch *Giữa muôn loại*, *trong cõi này*; `vidhā` ở đây là các loại phân biệt (mạn *ngang bằng, hơn, kém*, `103`–`104`) nên dịch *các loại phân biệt*, và `loke` là *ở thế gian*; `101.2` giữ *ở trong và ở ngoài* của `cnd8:26.2`;
        - `110.11`, `127.8` (2 khoá): `mnd11:25.7` *thanh* ⇒ *âm thanh* (như `mnd9:37.5`, `cnd9:40.10`); `127.8` dịch sát `yena taṁ vadeyyuṁ` là *có thể nói về vị ấy … bằng cái gì*, khác `mnd3:56.10` (*có thể đi … bằng cái gì*) vì động từ là `vadati`; các khoá `110.2`, `110.5` không trùng Pāli nguyên văn nhưng theo `mnd11:60.2` (*sau khi biết, sau khi nhận biết, đã cân nhắc …*);
        - `114.4`, `118.18` (2 khoá, `atarī so visattikaṁ`): dòng kệ và dòng nhắc lại cùng là *vị ấy đã vượt qua sự đắm say*, khác *đã vượt qua ái triền* của `snp4.10:10.4` (xem `visattikā` ở mục thuật ngữ);
        - `121.1` còn lệch `sn3.1:12.3` (*kẻ ấy không có con, gia súc*): bài này dùng *vị ấy*; `121.2`, `125.2` dùng *ruộng và nền nhà* (không *ruộng đất*) theo `mnd1:38.3` (*nền nhà ở, nền nhà kho …*).
     Đã dò **127 nhóm Pāli trùng nguyên byte trong chính bài** (182 khoá lặp thêm): 0 nhóm có bản Việt khác. Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 144 nhóm (233 khoá lặp thêm), 2 nhóm có bản Việt khác ngoài dấu câu: `72.6`/`73.22`/`74.3` (cùng Pāli `paññindriyaṁ … amatapariyosānan”ti`, khác khung: lời hỏi của Đức Thế Tôn có *chăng?*, lời đáp của Sāriputta và lời xác nhận của Đức Thế Tôn thì không) và `132.1`/`133.15`/`137.1` (chữ *Đã* ở dòng kệ, bỏ ở dòng nhắc lại).

  **Thuật ngữ, kèm số đếm** (đếm theo khoá `mnd`/`cnd` đã dịch, mỗi khoá một lần). `kodha` → *giận dữ* (51 so với *sân hận* 29 trong 78 khoá; `mnd11` dùng *sân hận*, `cnd7:62`–`64` và danh sách của `mnd9:36` dùng *giận dữ*); `upanāha makkha paḷāsa issā macchariya māyā sāṭheyya thambha sārambha māna atimāna mada pamāda` → *hằn học, gièm pha, hơn thua, ganh tị, keo kiệt, giả dối, xảo trá, bướng bỉnh, hung hăng, ngã mạn, ngạo mạn, tự mãn, phóng dật* theo `mnd9:36.2`; `taṇhā` → *tham ái*; `visattikā` → *sự đắm say* (75 trong 76 khoá, `mnd1:29`, `cnd8:64`); `gedha` → *lòng tham* (10 trong 16 khoá, `mnd9:98.8`); `pihā` → *thèm khát* (19 khoá `mnd`/`cnd` có *thèm* so với *khao khát* 9: `mnd7:76.3`, `cnd16:12.2`; `mnd9` dùng *khao khát* cho `pihayati`); `macchariya` → *keo kiệt*, `vevicchaṁ kadariyaṁ` → *xan tham, bủn xỉn* (`mnd6:63.7`); `atimāna` → *ngạo mạn*, `omāna` → *hạ mạn* (0 tiền lệ); `purekkhāra` → *sự đề cao* (23/28 khoá); `nissaya` → *sự nương tựa* (30/34); `kappa` → *tạo tác* (42 khoá); `ussada` → *cao ngạo* (7/9); `gantha` → *nút thắt*, `kāyagantha` → *kết thân* (`mnd4:61`); `phassa` → *xúc* (49/49), `adhivacanasamphassa` → *xúc do danh xưng* và `paṭighasamphassa` → *xúc do va chạm* (0 tiền lệ; `dn15:20` dịch *danh mục xúc*, *hữu đối xúc*); `puthujjana` → *phàm phu* (`mnd7:28.3`); `kukkucca` → *hối hận*, `cetaso vippaṭisāro` → *sự hối tiếc của tâm* (`cnd17:22`); `uddhacca` → *trạo cử*; `kuhana` → *dối trá* (`snp4.10:5.1`; `dn2:55` *dối trá và nịnh hót*), `kuhanavatthu` → *cơ sở dối trá* (0 tiền lệ); `pāgabbhiya` → *xấc xược* (`snp4.14:16.3`, 0 tiền lệ ở `mnd`/`cnd`), `jeguccha` → *đáng ghê tởm* (`snp4.10:5.3`), `bhākuṭikā` → *sự nhíu mày* (0 tiền lệ); `paṭibhāna` → *tài ứng đối* (`mnd3`, `mnd5`, `mnd11`), `adhigama` → *chứng đắc*; `chaḷaṅgupekkhā` → *sự xả có sáu chi phần* (`mnd13:126.6`); `kāmaguṇa` → *dục lạc*, `sātiya` → *điều ưa thích* (0 tiền lệ); `assāda ādīnava nissaraṇa` → *vị ngọt, nguy hại, xuất ly* (`mnd11:60.19`); `nibbuta paṭipassaddha` → *tịch tĩn