notes: |-
  Dịch trực tiếp từ Pāli root, 97/97 khoá, đúng thứ tự Pāli. Không có tầng Anh đã ghim cho tha-ap nên không có đối chiếu English độc lập; xem blocking_errors.
  Tiền lệ: dựng chỉ mục Pāli sang Việt trên toàn tầng tha-ap (495 tệp). 43 khoá có Pāli trùng nguyên văn với bài khác (không tính 0.1, 0.3 và 25.1); 37 khoá dùng lại NGUYÊN VĂN bản Việt đã có, 6 khoá khác tiền lệ và đều có lý do ghi dưới đây. Trong chính bài có 2 cặp Pāli trùng: 15.3 với 19.3 (Sabbāsave pariññāya) có bản Việt giống hệt nhau; 12.1 với 22.1 (Aparimeyye ito kappe) có bản Việt KHÁC NHAU có chủ ý, vì 12.1 nằm trong lời tiên tri của Đức Phật (tương lai, ra đời của Đức Gotama, sau vô lượng kiếp kể từ nay) còn 22.1 nằm trong lời tự thuật của vị trưởng lão (quá khứ, vào vô lượng kiếp trước); hai cách dịch này khớp đúng hai tiền lệ cùng Pāli ở tha-ap481:10.1 (tiên tri, Sau vô lượng kiếp kể từ nay) và tha-ap276:3.1, tha-ap26:14.3, tha-ap26:20.1 (quá khứ, Vào vô lượng kiếp trước). 1 cặp trùng trong chính bài mà Việt khác, đã đọc ngữ cảnh và bảo vệ.
  0.1 Therāpadāna: 483/495 tiền lệ giữ nguyên tên Pāli. 0.2 Buddhavagga dịch Phẩm Phật theo 5/5 tiền lệ.
  0.3 và 25.1: Pāli 0.3 là Mahāmoggallānattheraapadāna, KHÔNG bắt đầu bằng số thứ tự nên không thêm số; translationTitle bằng đúng giá trị 0.3. Tên bài nhận khuôn Bài Kệ Tuyên Ngôn Về Trưởng Lão cộng tên. Hai dạng chính tả đo được trong 0.3 của tầng tha-ap: toàn tầng Tuyên Ngợ 251, Tuyên Ngôn 127, Ký Sự 109; ở phạm vi gần nhất (tha-ap1 đến tha-ap30) Tuyên Ngôn 12, Tuyên Ngợ 8. Phân kỳ giữa hai phạm vi: toàn tầng nghiêng Tuyên Ngợ (dạng sai chính tả), phạm vi gần nhất nghiêng Tuyên Ngôn. Chọn Tuyên Ngôn theo chỉ dẫn của người điều phối và tiền lệ tha-ap6, tha-ap10, tha-ap11, tha-ap13 đến tha-ap15, tha-ap18; người biên tập nên phán một lượt cho cả cuốn. 25.1 dùng lại đúng tên của 0.3 kèm thứ hai (dutiyaṁ = thứ 2), theo khuôn tha-ap6:15.1 và tha-ap10:17.1.
  24.1 công thức lời kết: dùng nhóm Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (imā gāthāyo là số nhiều), không dùng dạng số ít đã từng nói bài kệ này.
  Số Pāli, mọi phép tính: sattasattati (10.1) = satta 7 + sattati 70 = 77, cộng kkhattuṁ = lần, nên bảy mươi bảy lần (khớp tha-ap418:8.1 và tha-ap497:4.3, cùng Pāli); aṭṭhasataṁ (10.3) = aṭṭha 8 + sata 100 = 108, nên một trăm linh tám lần (xem bất định số 1); pañcapaññāsa (11.1) = pañca 5 + paññāsa 50 = 55, nên năm mươi lăm lần (khớp tha-ap481, tiền lệ cùng Pāli duy nhất); khīṇāsavasahassehi (6.1) = sahassa 1000, nên hàng nghìn vị (không phải một con số chính xác); dutiyo (14.4) = thứ hai; catasso (23.1) = 4; aṭṭhime (23.2) = 8; chaḷabhiññā (23.3) = 6; dutiyaṁ (25.1) = thứ hai. Bài KHÔNG có cụm tiṁsa hay Tiṁsakappasahassa nên không có chuyện ba nghìn hay ba mươi nghìn kiếp ở đây; lưu ý người điều phối rằng tiṁsa không xuất hiện trong bài này.
  Thuật ngữ đo được: lậu hoặc cho āsava (toàn tầng tha-ap lậu hoặc áp đảo lậu hoại); vô ngại giải, tám giải thoát, sáu thắng trí, lời dạy của Đức Phật (480, 48, 57, 449 tiền lệ cùng Pāli ở 23.1 đến 23.4); Chuyển Luân Vương cho cakkavattī (5 và 4 tiền lệ); Thiên Trung Thiên cho devadeva (19 khoá Pāli); Nhân Ngưu cho narāsabha (24 tiền lệ cùng 1.2); Dẫn Đạo thế gian cho lokanāyaka; tịnh tín cho cittappasāda (22 tiền lệ); thiên nữ cho accharā (đo trên tha-ap, vv, pv và ja: thiên nữ 48, tiên nữ 28; trong tha-ap mỗi dạng 1 tiền lệ gần, chọn dạng đa số); vua rồng cho nāgarājā (xem bất định số 5); ngã mạn cho asmimāna (thag6.9, ud2.1) và mạn cho māna.
  Sáu khoá khác tiền lệ cùng Pāli: 1.1 (3 tiền lệ dịch nghĩa tên Anomadassī thành Bậc Vô Tỳ Nhiễm, 3 khoá khác giữ nguyên tên; chọn giữ tên riêng Anomadassī theo tha-ap26:4.1 và tha-ap148:1.1, cùng quy ước với Sumedha ở tha-ap6, và không dịch nghĩa một tên riêng khi Pāli không nói nghĩa); 6.1 (tiền lệ là câu chủ động Cùng hàng nghìn vị; ở đây parivuto là phân từ bị động ở 6.2 nên viết Được hàng nghìn vị đã trừ sạch lậu hoặc vây quanh, giữ cấu trúc câu qua hai vế); 7.1 (2 tiền lệ ghi Ta đã đến nơi bậc Đại Anh Hùng ấy, bỏ mất upaviṭṭhaṁ là đang ngồi và thêm động từ đi đến không có trong Pāli); 10.3 (tiền lệ tha-ap37:14.3 ghi tám trăm lần; xem bất định số 1); 15.1 (2 tiền lệ ghi Tôi đã phát khởi tinh tấn ở ngôi thứ nhất; ở đây là lời tiên tri về vị ấy nên dùng Vị ấy, giữ nguyên cách dịch pahitatto là giữ mình vững vàng); 18.1 (2 tiền lệ ghi của ta; vị trưởng lão tự thuật xưng tôi nhất quán suốt bài, như tha-ap6, và 19.4 dùng tôi sống không còn lậu hoặc theo 20 tiền lệ tôi sống không còn lậu hoặc, so với 104 tiền lệ ta toàn tầng; 6 tiền lệ đầu cùng dạng tôi nằm ở tha-ap9, 16, 33, 34, 36, 37).
  BẤT ĐỊNH (không thêm vào thân kinh): (1) 10.3 aṭṭhasataṁ: đọc theo cách cộng chữ số với sata thành 108, khớp cách đọc trong chính tầng này của sn36.22 (aṭṭhasataṁ vedanā = một trăm linh tám loại cảm thọ, 5 khoá), và khớp với cấu tạo cộng của sattasattati (77) và pañcapaññāsa (55) ở bên cạnh; nhưng tha-ap37:14.3, cùng Pāli, đang ghi tám trăm lần, và mil3.8:2.3 cũng ghi tám trăm bữa cơm. Hai cách đọc cho 108 và 800; chọn 108 theo cấu tạo cộng ở trong bài này và sn36.22; đề nghị người biên tập phán và đối chiếu tha-ap37:14.3 một lượt cho cả tầng. (2) 4.4 sampabujjhatha: dịch thức tỉnh theo nghĩa đen là tỉnh dậy; Pāli không nói Đức Phật rời khỏi trạng thái nào (truyền thống chú giải hiểu là xuất khỏi thiền định, nhưng điều đó không có trong lời kinh), nên không thêm. (3) 3.1 saṅgaṇiyaṁ gaṇaṁ: dịch nhóm bầu bạn; saṅgaṇiyaṁ có thể hiểu là nhóm tùy tùng, đám đông tụ họp, chưa phân xử được. (4) 16.4 ghātayiṁ: aorist của ghāteti có thể là tôi đã giết hoặc tôi đã khiến người giết; chọn đã giết, không thêm nội dung sai khiến. (5) 2.2 nāgarājā: dịch vua rồng; trong tầng này nāgarāja cũng có khi dịch Long vương (ja441) hoặc chúa voi (ja357), nên đây là lựa chọn theo ngữ cảnh ở dưới đại dương (2.4 mahodadhinivāsa). (6) 18.3 và 18.4 idhāpi ediso mayhaṁ maraṇakāle bhavissati: ediso không có danh từ đi kèm, dịch điều như thế, ngầm trỏ cảnh 17.4 (chết với đầu bị vỡ); không nêu rõ cách chết trong thân kinh. (7) 20.3 vāmaṅguṭṭhena: dịch ngón cái bên trái, vì aṅguṭṭha là ngón cái, có thể là ngón tay hoặc ngón chân; Pāli không ghi pāda nên không chọn ngón chân. (8) 22.2 yaṁ kammamabhinīhariṁ: abhinīharati có thể là phát khởi, hướng tâm, hoặc thực hiện; chọn phát khởi, trung tính; 22.3 tāhaṁ bhūmimanuppatto: taṁ ahaṁ, bhūmi được đọc là địa vị, khoá ngắn nên chủ ngữ bỏ lửng, dịch tôi đã đến được địa vị ấy. (9) 21.3 sāmaṇere upādāya: dịch kể từ các sa-di (upādāya là bắt đầu từ), không thêm trở lên hay kể cả.
  Phép kiểm tự viết, mẫu số ghi kèm: tập khoá Việt bằng tập khoá Pāli 97/97 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 97/97 (Pāli mở nháy kép ở 1.1, đóng ở 23.4; không có nháy đơn); dấu lược 0/97 khoá có (không có …pe… và không có … trần); không khoá rỗng; NFC đủ; không khoảng trắng thừa; không chữ số trong thân kinh; không Pāli lọt sang tiếng Việt ngoài tên riêng và nhan đề Therāpadāna. 43 cặp Pāli trùng với bài khác đã dò, 6 cặp khác tiền lệ (có lý do ở trên), 2 cặp trùng trong chính bài, 1 cặp Việt khác có chủ ý.
  Coverage English: mẫu số 1 khoá có nội dung (24.1, công thức lời kết); Sujato phủ 0/1; english-project 0; vietnamese-current 0 (tầng này chỉ có Pháp Cú). Mẫu số nhỏ như vậy nên cổng coverage hầu như không đo được gì: đây không phải sự đồng thuận về cách dịch mà là không có bản Anh nào để đối chiếu. Bài chưa có entry trong content/meta/reference-gaps.yaml; cần chạy lại npm run reference:gaps khi hợp nhất.
  Kỹ thuật: chưa chạy được các cổng trong lát này, technical_integrity đặt 9.6. Còn phải chạy: npm run validate, npm test, npm run check, npm run build.
