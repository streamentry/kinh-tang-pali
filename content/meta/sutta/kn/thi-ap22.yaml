notes: |-
  Dịch trực tiếp từ Pāli root, đủ 162/162 khoá, thứ tự khoá như Pāli; commit đã ghim không có bản Anh cho toàn bộ `thi-ap`. Tiền lệ: thi-ap23, thi-ap24, thi-ap26 (cùng Phẩm Kuṇḍalakesī, cùng kể thọ ký thời Padumuttara và cùng công thức Kassapa/vua Kikī/bảy công chúa), thi-ap1, thi-ap34 đến thi-ap40 và các bài tha-ap có chung công thức; Dhp 113 (dhp100-115) cho cặp kệ `Yo ca vassasataṁ jīve … udayabbayaṁ`.
  Đại từ ngôi thứ nhất dùng ta, theo phạm vi gần nhất: thi-ap23, thi-ap24 và thi-ap26 đều dùng ta; toàn nhóm thi-ap thì theo số đo ở bài liền kề thi-ap23 là ta 7 bài, tôi 9 bài, con 9 bài (không đo lại ở đây), nên đây là chọn theo phạm vi gần nhất, không phải đa số toàn nhóm. Ngôi số nhiều `no`/`mayaṁ` ở 14.1, 14.2, 14.4 dịch chúng ta, vì người kể xưng ta.
  `:0.3` Pāli là `Kisāgotamītherīapadāna` không bắt đầu bằng số nên không giữ số thứ tự; translationTitle bằng đúng `:0.3`; `:42.1` kết bằng thứ hai (Pāli `dutiyaṁ`). `:0.2` `Kuṇḍalakesīvagga` → Phẩm Kuṇḍalakesī theo thi-ap23, thi-ap24, thi-ap26. Tên người giữ Pāli (Padumuttara, Kikī, Samaṇī, Samaṇaguttā, Bhikkhunī, Bhikkhudāyikā, Dhammā, Sudhammā, Saṅghadāyikā, Khemā, Uppalavaṇṇā, Paṭācārā, Kuṇḍalā, Dhammadinnā, Visākhā, Kisāgotamī, Haṁsavatī, Sāvatthī, Bārāṇasī).
  Hình thức `Tuyên Ngợ` ở `:0.3`/`:42.1`: nhóm thi-ap (cả hai cây, loại trùng tên tệp) đo 27 tệp `Tuyên Ngợ` / 1 `Tuyên Ngôn` / 0 `Ký Sự`; giữ `Tuyên Ngợ` theo phạm vi gần nhất. Chữ này có dấu hiệu là lỗi chính tả của tầng, người biên tập nên phán một lượt cho cả cuốn; tôi không tự đổi riêng bài này.
  Công thức lời kết `Itthaṁ sudaṁ … abhāsitthāti` dịch nhóm `đã nói những bài kệ này` (số nhiều, khớp `imā gāthāyo`): đo 561 khoá nhóm số nhiều, 18 khoá nhóm số ít, 4 khoá khác; mở đầu `Tôi nghe như vầy` ở 578 khoá. Dấu `ti` bỏ ở 23.4 (`puttasañjīvananti`) và 24.3 (`Āharā’ti`) theo phe BỎ của quy ước tầng; không đo lại tỉ lệ phe BỎ trong bài này.
  Dùng lại nguyên văn tiền lệ: 94 khoá Pāli của bài có Pāli trùng nguyên văn với các bài `*-ap` đã dịch (cả hai cây làm việc), trong đó 90 khoá dùng đúng bản Việt đã có (chỉ khác dấu câu/hoa thường ở một số khoá), 4 khoá khác có chủ ý: 24.4 `vinayopāyakovido` dịch thiện xảo về phương tiện điều phục thay cho hiểu rõ phép tắc và phương tiện (tiền lệ chỉ 2 khoá, cùng một bài tha-ap433; `vinaya` ở đây là sự điều phục, không phải giới luật nên chọn điều phục, nhất quán với vināyaka dịch Điều Ngự); 26.2 `lokanāyakaṁ` dịch Đấng Dẫn Đạo thế gian (đo 30 khoá Đấng Dẫn Đạo thế gian + 16 Dẫn Đạo thế gian + 13 Dẫn Đạo Thế Gian so với 4 Dẫn Lộ Thế Gian, 4 Dẫn Dắt Thế Gian; tiền lệ đúng Pāli `upesiṁ lokanāyakaṁ` có Dẫn Lộ 2 khoá và Dẫn Đạo Thế Gian 1 khoá); 31.4 `satthusāsanakārikā` dịch là người làm theo lời dạy của bậc Đạo Sư (thêm là để người làm theo không bị đọc nhầm là bổ nghĩa cho người khác ở 31.3; hai tiền lệ là người làm theo ... ở thi-ap24 và làm theo ... ở thi-ap23); 35.3 ta thay con theo ngôi của bài. Số cặp Pāli trùng trong chính bài: 6 cặp (10.2=18.2, 10.3=18.3, 10.4=18.4, 38.2=39.2, 38.2=40.2, 39.2=40.2), bản Việt giống nhau ở cả 6 cặp. Chỗ khác có chủ ý theo ngữ cảnh lời thọ ký: 7.1 `Satasahassito kappe` ở thì tương lai (`bhavissati`, `hessati`) nên dịch Sau một trăm ngàn kiếp nữa (khớp thi-ap23), không dùng dạng quá khứ như 1.3 `Ito satasahassamhi` Cách đây một trăm ngàn kiếp.
  Số Pāli: `Ito satasahassamhi` (1.3) = sata 100 × sahassa 1000 = một trăm ngàn kiếp (trước đây); `Satasahassito kappe` (7.1) cùng cấu tạo = một trăm ngàn kiếp, thì tương lai = sau một trăm ngàn kiếp nữa; `Pañcamī` (13.1) = thứ năm; `Vīsavassasahassāni` (14.3) = vīsa 20 × sahassa 1000 = hai mươi ngàn năm (thang lớn nhân cả số đã tích lũy: 20 × 1000 = 20.000); `satta dhītaro` (15.4) = bảy người con gái; `sattamī` (16.4, 17.4) = thứ bảy (danh sách 16.1 đến 16.4 đủ 7 tên: Samaṇī, Samaṇaguttā, Bhikkhunī, Bhikkhudāyikā, Dhammā, Sudhammā, Saṅghadāyikā, trong đó Dhammā là chính người kể ở kiếp ấy theo 13.1 và 13.2; danh sách 17.1 đến 17.4 đủ 7 tên: Khemā, Uppalavaṇṇā, Paṭācārā, Kuṇḍalā, chính ta, Dhammadinnā, Visākhā); `vassasataṁ` (27.1) = vassa năm × sata 100 = một trăm năm; `ekāhaṁ` (27.3) = một ngày; `ekakulassa` (28.2) = của một gia đình; `catusacca` (3.2) = bốn chân lý; `tāvatiṁsa` (10.4, 18.4) là tên cõi trời Ba mươi ba (tầng đã dịch Ba mươi ba ở mọi khoá trùng Pāli; không phải số `tiṁsa` đứng riêng); `Paṭisambhidā catasso` (40.1) = bốn; `dutiyaṁ` (42.1) = thứ hai. Cụm `Tiṁsakappasahassa` không có trong bài này; `tiṁsa` chỉ xuất hiện bên trong tên `tāvatiṁsa`.
  Ghi nhận bất định: 19.3 `Duggate adhane naṭṭhe` — ba tính từ ở vị trí nơi chốn, đứng ngay sau `seṭṭhikule` (19.2) nên được đọc là bổ nghĩa cho gia đình triệu phú ấy (đã sa sút, nghèo khốn); Pāli không nêu chủ ngữ, dịch giữ dạng đồng vị không thêm gia đình ấy; 19.4 `gatā ca sadhanaṁ kulaṁ` dịch và đã đi đến một gia đình giàu có (không thêm kết hôn vì Pāli không nói, 20.1 `Patiṁ` mới cho biết có chồng). 20.1 `Patiṁ ṭhapetvā sesā me` dịch Trừ chồng ra, những người còn lại, Pāli không nêu họ là ai (không thêm nhà chồng). 20.2 `dessanti adhanā iti` dịch ghét ta, cho rằng ta không của cải, `iti` là dấu dẫn ý. 21.1 `taruṇo bhaddo` và 21.2 `komalako` — chủ ngữ `so` là đứa con vừa sinh (20.3, xác nhận ở 23.4 `putta`), `taruṇa` có thể là non trẻ hoặc thanh niên, ở đây hợp nghĩa đứa trẻ nhỏ; 0 tiền lệ cho `komalako`, dịch mềm mại. 21.3 `Sapāṇamiva kanto me` dịch đối với ta thân yêu như chính mạng sống (`sapāṇa` có thể là có mạng sống hoặc cùng với mạng sống; chọn nghĩa so sánh). 21.4 `yamavasaṁ gato` dịch rơi vào quyền lực của Yama; giữ tên Yama, không thêm thần chết hay diêm vương. 22.1 `Sokaṭṭādīnavadanā` — `sokaṭṭa` tiền lệ tha-ap541 dịch bị sầu muộn hành hạ, `ādīnavadanā` dịch mặt mày thảm não (không phải `ādīnava` nguy hại; 0 tiền lệ dạng hợp từ này); 22.2 `rudammukhā` dịch mặt đang khóc, 0 tiền lệ. 22.3 `Mataṁ kuṇapaṁ` dịch thi thể đã chết, không thêm của con (con đã nêu ở 21.1 đến 21.4). 22.4 `vilapantī gamāmahaṁ` dịch ta đã đi, than khóc. 23.1 `ekena sandiṭṭhā` — bị động của `sandiṭṭha` (gặp, được thấy), Pāli không nêu người ấy là ai; dịch ta đã được một người gặp, không thêm lời chỉ dẫn. 23.2 `abhisakkuttamaṁ` — `abhisakka` là thầy thuốc; dịch bậc lương y tối thượng chỉ Đức Phật theo ngữ cảnh 23.3 đến 24.3, 0 tiền lệ trong tầng; không phải tên riêng. 23.4 `puttasañjīvananti` dịch làm cho con sống lại. 24.1 đến 24.2 `matā yasmiṁ gehe … tato` — câu gốc đặt `gehe` ở khoá 24.2, bản Việt đưa nhà lên 24.1 và lặp từ nhà ấy ở 24.2 để câu đọc được; `siddhatthaka` dịch hạt cải trắng, 0 tiền lệ trong tầng. 25.3 `Kuto siddhatthakaṁ tasmā` dịch Do đó, lấy đâu ra hạt cải trắng; 25.4 `tato laddhā satiṁ` — `sati` ở đây là sự tỉnh thức, lấy lại tâm trí sau cơn mê loạn vì mất con; không dịch là niệm theo nghĩa thiền, 0 tiền lệ chính xác. 3.4 `vaṭṭasantisukhāvahaṁ` dịch đem lại an lạc của sự lắng dịu vòng luân chuyển (`vaṭṭa` là vòng luân chuyển, `santi` là sự lắng dịu), 0 tiền lệ. 3.3 `paramassādaṁ` dịch có hương vị tối thượng, tiền lệ chỉ có `Amataṁ paramassādaṁ`. 4.1 đến 4.4 — chủ ngữ `vīro` ở 4.1 và động từ `vaṇṇayī` ở 4.4 cách nhau ba khoá, giữ thứ tự Pāli; 4.4 `purisuttamo` dịch bậc tối thượng giữa loài người (tiền lệ 6 khoá). 5.1 đến 6.2 là một câu dài; 5.4 `yathāsatti yathābalaṁ` giữ tùy theo khả năng, tùy theo sức mình như tiền lệ (1 khoá, tha-ap489). 6.4 `ṭhānalābhāya` dịch về việc đạt được vị trí, 0 tiền lệ. 28.1 `Na gāmadhammo nigamassa dhammo` — `dhamma` ở đây là lẽ thường, quy luật; giữ pháp theo thuật ngữ của tầng, không thêm làng nào, 0 tiền lệ cho `gāmadhammo`. 28.4 `Eseva dhammo yadidaṁ aniccatā` dịch chỉ riêng pháp này, đó là sự vô thường, 0 tiền lệ cho `aniccatā`. 27.2, 27.4 `udayabbayaṁ` dịch sự sinh diệt theo dhp113 (cùng kệ). 29.2 `visodhayiṁ` dịch đã làm thanh sạch pháp nhãn theo vv81:27.4. 30.2 `yuñjantī` dịch chuyên cần theo tiền lệ `Yuñjantī satthuvacane`. 36.3 `saṅghāṭikaṁ katvā` dịch làm thành y tăng-già-lê, chủ ngữ ngầm là ta, tân ngữ ngầm là phế liệu ở 36.1 và 36.2. 37.4 `parisāsu vināyako` dịch bậc Điều Ngự giữa các hội chúng (số nhiều).
  Dấu câu: nháy kép `“”` mở ở 1.1 và đóng ở 40.3 (lời tự thuật của Kisāgotamī); nháy đơn `‘’` mở ở 7.1 và đóng ở 8.4 (lời thọ ký của Đức Padumuttara), mở ở 23.3 và đóng ở 23.4 (lời xin thuốc), mở ở 24.1 và đóng ở 24.3 (lời của Đức Phật), mở ở 27.1 và đóng ở 28.4 (hai bài kệ của Đức Phật), đúng như Pāli, khớp từng khoá (không khoá nào tự cân). `…pe…` ở 38.2, 39.2, 40.2 → đúng một `…`; Pāli không có `(…)` trần ở khoá nào nên bản Việt cũng không có.
  Tự kiểm: tập khoá Việt = tập khoá Pāli (162/162, cùng thứ tự); 0 khoá lệch nháy đơn/kép (đối chiếu từng khoá, mẫu số 162); 0 khoá lệch dấu lược `…pe…` (3/3); NFC, 0 khoá rỗng, 0 khoảng trắng thừa; 0 chữ số lọt vào thân kinh; 0 chữ Pāli lọt sang thân kinh ngoài tên riêng. Bản Việt mới dịch xong, chưa có lượt review đối kháng riêng ngoài các phép tự kiểm. technical_integrity 9.6 vì lát này không chạy gate (brief cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
