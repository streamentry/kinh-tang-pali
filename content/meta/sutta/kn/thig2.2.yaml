notes:
  - >-
    **Hai bài Trưởng Lão Nữ (thơ)**, mỗi bài tám vế chia 4 + 4. Tên riêng giữ
    nguyên dạng Pāli.
  - >-
    `Asubhāya cittaṁ bhāvehi` → *hãy nuôi dưỡng tâm hướng về điều bất thiện*
    (`asubha` → *bất thiện* theo `an10.59:1.3`); `Animittañca bhāvehi` → *hãy
    nuôi dưỡng sự không tưởng* (0 tiền lệ, đặt mới). `upasantā carissasī` →
    *ngươi sẽ sống an ổn* — **không** dịch *tịnh tịnh* như bản đầu, vì lặp từ.
  - >-
    `bāhusacca`… không có ở đây; `bojjhaṅga` → *giác chi* theo `an4.14:3.2`;
    `nibbānapattiyā` → *đưa đến Niết-bàn* theo `sn10.12:7.2`.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng
    Thích Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã
    ghi ở `content/meta/reference-gaps.yaml`.
