notes: |-
  Dịch từ Pāli root đã ghim. Tầng Anh CÓ và đã đo: `source/upstream-manifest.json` (commit 11c9d708978cde8ba61096d8a75f7ddfb846f639) liệt kê `sutta/kn/thig/thig7.2_translation-en-sujato.json`, tệp có trong cache, 32/32 khoá khớp với Pāli, không thiếu không thừa; duy nhất `thig7.2:8.1` (dòng ghi tên tác giả) để trống.
  CỔNG COVERAGE KHÔNG ĐO ĐƯỢC GÌ, MẪU SỐ BẰNG 0: 32 khoá Pāli, sau khi loại block `:0` thì không khoá nào đạt ≥ 40 ký tự (dài nhất 27) ⇒ substantivePaliSegments = 0 ⇒ `ratio` định nghĩa bằng 1 và `scripts/validate.ts` bỏ qua cổng, không cần entry trong `content/meta/reference-gaps.yaml`. Đây là `no substantive segment`, KHÔNG phải `đã đủ`. Đo bằng công thức `src/lib/canon/reference.ts` chứ không suy từ tên thư mục.
  `:0.1` giữ Pāli `Therīgāthā 7.2`: đếm trên 60 tệp thig Việt đã có, 56 giữ số, 4 bỏ số ⇒ chọn đa số. `:0.2` `Sattakanipāta` ⇒ `Bộ Bảy Bài Kinh`, cùng lý do và cùng số đếm như ở thig7.1 (cột `Bộ N Bài Kinh` 40/60 trong thig, và `thig-name:64.thig-sattakanipata` → The Book of the Sevens). `:0.3` theo đa số `Kinh Kệ Của Trưởng Lão Nữ` (30/60 trong thig).
  `:2.1`–`:4.2` và `:6.1`–`:7.4` TRÙNG NGUYÊN VĂN với bài đã dịch, nên dùng lại nguyên văn bản Việt có sẵn. Nguồn gốc: `sn5.8` (đoạn Māra hỏi tỳ-kheo-ni Sīsūpacālā về `pāsaṇḍa`) cho 2.1–4.2, và `thig8.1:7.1–7.4` + `:8.1–8.4` (trùng đúng 8 khoá liên tiếp) cho 6.1–7.4. Cụ thể: `Kaṁ nu uddissa muṇḍāsi` → Vì ai mà ngươi cạo đầu; `Na ca rocesi pāsaṇḍe` → mà ngươi lại chẳng chấp nhận giáo phái nào; `Ito bahiddhā pāsaṇḍā` → Các giáo phái ngoài đây; `na te dhammassa kovidā` → vì chúng không thiện xảo trong Chánh pháp; `Atthi sakyakule jāto` → Có bậc sanh ra trong dòng họ Sakya; `buddho appaṭipuggalo` → là Đức Phật, không ai sánh bằng; `Tassāhaṁ vacanaṁ sutvā` → Nghe lời ấy của người ấy (6 tiền lệ); `vihariṁ sāsane ratā` → ta vui vẻ sống trong sự giáo huấn ấy; `Tisso vijjā anuppattā` → ba minh đã chứng đạt (chọn y nguyên theo thig8.1 vì hai đoạn kệ trùng nhau; các cách khác trong tầng thêm chủ ngữ đầu dòng mà Pāli không có); `kataṁ buddhassa sāsanaṁ` → đã làm tròn lời dạy của Đức Phật (89 tiền lệ); `Sabbattha vihatā nandī` → Ở mọi nơi, hoan hỷ đã bị quét sạch (3 tiền lệ, đa số); `tamokhandho padālito` → khối u tối dày đặc đã bị phá tan; `Evaṁ jānāhi pāpima` → Hãy hiểu rõ điều này, kẻ xấu xa; `nihato tvamasi antaka` → ngươi đã bị đánh bại, kẻ Kết Thúc (theo thig8.1:8.4; `antaka` → kẻ Kết Thúc theo thig6.3:4.4).
  `:5.1`–`:5.4` trùng nguyên văn `sn15.10:6.3`–`:6.6` nên dịch y nguyên: sự khổ và sự sinh khởi của khổ / sự vượt qua khổ / con đường Tránh đạo tám chi phần / đưa đến chỗ ngưng dứt khổ. Riêng `dukkhūpasamagāminaṁ` có 6 cách trong tầng nên chọn luôn theo sn15.10 cho trọn cụm.
  PĀLI THẮNG Ở 1.1–1.4, VÀ ĐÂY LÀ ĐIỂM PHẢI NÊN: bản Anh đã ghim LỆCH MỘT KHOÁ so với Pāli. Pāli là `Satiṁ upaṭṭhapetvāna, / bhikkhunī bhāvitindriyā; / Paṭivijjhi padaṁ santaṁ, / saṅkhārūpasamaṁ sukhaṁ`. Sujato đặt `As a nun with developed faculties,` vào 1.1, `having established mindfulness,` vào 1.2, `I penetrated that peaceful state,` vào 1.3, và dồn cả mệnh đề cuối vào 1.4 — tức lùi nghĩa của vế `Satiṁ upaṭṭhapetvāna` sang vế sau. Dịch theo Pāli: 1.1 là `Đã an trú chánh tâm`, 1.2 là `là tỳ-kheo-ni với các căn đã tu tập`. Đây là disagreement thật đã phân xử bằng Pāli.
  `sati` ở 1.1 dịch `chánh tâm` chứ không phải `tỉnh giác`: cùng phẩm, `thig7.3:1.1` `Satimatī cakkhumatī` cho thấy `sati` đứng như một phẩm chất của tâm. `paṭivijjhi` dịch `thấu rõ` theo `snp1.5:8.1` (`Ete ca paṭivijjhi yo gahaṭṭtho` → Người cư sĩ nào thấu rõ điều này); `padaṁ santaṁ` dịch `cảnh giới tịch tịnh` y nguyên theo thig8.1:1.3.
  `:3.2` `diṭṭhiyo upanissitā` KHÔNG trùng với sn5.8:3.2 (`diṭṭhīsu pasīdanti te`, chủ ngữ là `te`) nên dịch theo Pāli của chính mình: `bám theo các kiến chấp`. Còn 3.3 `Na te dhammaṁ vijānanti` cũng là chủ ngữ thứ ba (`te`) — bản Anh đã dịch thành `They` và giữ vậy.
  `tỳ-kheo-ni` có 295 lần trong tầng so với `tỳ-kheo ni` 78 lần ⇒ dùng dấu gạch nối. `bhikkhunī bhāvitindriyā` trùng nguyên văn `thig1.7:1.2` nên chỉ y nguyên phần vế, giữ dấu gạch nối theo đa số.
  LỖI BẢN NHÁP BẮT ĐƯỢC TRONG REVIEW ĐỐI KHÁNG (đã sửa trước khi ghi): bản nháp đầu tiên dùng lẫn `Tôi` (1.3) và `tôi` (4.3) cho người kể, trong khi 6.2 đã y nguyên `ta` của thig8.1 — nghĩa là cùng một người mà bản dịch tự gọi bằng hai xưng tự. Đã thống nhất còn `ta` (như thig8.1 và thig6.8). Bản nháp cũng tự thêm chữ `và` vào 5.1, trong khi Pāli `Dukkhaṁ dukkhasamuppādaṁ` không có `ca`; đã bỏ và y nguyên sn15.10.
  `:8.1` có HAI dấu lược, đếm được (Pāli `… Cālā therī …. `), giữ đúng hai theo thig6.8:7.1 và thig8.1:9.1. Không thêm dấu `ti` vì Pāli khoá này không có.
  Dấu nháy kép: Pāli có BA cặp nháy (1.1, 2.1, 3.1 mở; 1.4, 2.4, 7.4 đóng) vì 3.1 mở nháy cho lời thoại thứ ba của chính Cālā và 7.4 đóng ngoài dấu chấm câu. Bản dịch giữ nguyên cấu trúc đó, không gộp lại.
  Tầng `vietnamese-current` vắng; không có lớp lấp `english-project` cho uid này. 32/32 khoá đã kiểm: ngoặc kép cân, không khoá rỗng, không khoá thừa, NFC sạch, không trùng nguyên văn Pāli, không lọt Pāli. Cổng kỹ thuật do coordinator chạy; bốn lệnh còn lại: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
