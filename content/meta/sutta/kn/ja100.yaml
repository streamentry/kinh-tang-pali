notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Không khoá nào có …pe…; nháy kép mở ở 1.1 và đóng ở 1.4 đúng Pāli.

  Tiền lệ có đếm và dùng lại: Jātaka → Jātaka (234), Ekakanipāta → Bộ Một Bài Kinh (296), Littavagga → Phẩm Bụi Dơ (10 ở ja1-ja10, đúng nghĩa litta là bụi). Lưu ý phải báo: 8 bài ja92-ja99 cùng phẩm Littavagga trong tầng lại để Phẩm Những Điều Nhỏ, tức 10 chọn đa số và đúng nghĩa so với 8; đó là tệp của lát khác nên không sửa. Tassuddānaṁ → Tóm lược: (ja10:3.1). Uddāna giữ tên Pāli nguyên văn và chỉ dịch vế nối, đúng khuôn ja10, ja20, ja30; dasāti → mười bài ấy (y hệt ja20:4.4). Majjhimo paṇṇāsako → Quyển thứ hai trong bộ năm mươi: 0 tiền lệ (chưa bài Jātaka nào trong tầng có khoá 5.1), đặt mới, và Paṭhamo paṇṇāsako ở ja50 dùng cùng công thức.

  Bất định chưa phân xử, ghi lại đây chứ không sửa trong thân kinh: tục lược 4.1-4.4 của bài này là Gilamakkhakutūhala mātukassā / Muninā ca aniccata pattavaraṁ / Dhanapālivaro atipaṇḍitako / Saparosahassaasātadasāti, không khớp với mười bài trong phẩm Littavagga ở Pāli đã ghim (Litta, Mahāsāra, Visāsabhojana, Lomahaṁsa, Mahāsudassana, Telapatta, Nāmasiddhi, Kūṭavāṇija, Parosahassa, Asātarūpa). Vế cuối còn chứa asātadasā, tức thứ mười tám, trong khi đây là bài thứ mười của phẩm. Đã dịch đúng những chữ có mặt — cùng Saparosahassa, bài thứ mười tám — và không tự sửa tục lược cho khớp; người đọc cần biết điểm này. Vì vậy ambiguity_integrity hạ xuống 8.4.

  Kệ 1.1-1.4: Asātaṁ sātarūpena / piyarūpena appiyaṁ dịch là Điều vốn không có thật, mượn hình dạng tốt đẹp, mượn hình dạng đáng yêu, lại không ai ưa — giữ đủ hai vế sāta và piya của hai câu kệ, không gộp thành một. Dukkhaṁ sukhassa rūpena → Khổ đau, mượn hình dạng của hạnh phúc; pamattamativattatī → cứ tiến tới kẻ phóng dật. Hạnh phúc theo glossary, phóng dật theo glossary.

  Triangulation: không có English Sujato cho uid này tại commit đã ghin (đã dò thư mục cache, 0 tệp), nên bài dịch chỉ từ Pāli. Không chạy được npm run validate|test|check|build theo lệnh phân công đợt này nên technical_integrity là 9.6.

  Kiểm toán 2026-10-15 (kiểm toán Jātaka chỉ có Pāli), Claude Sonnet 5.5 (Claude Code): Sửa 4/4 khoá kệ, tên bài và các khoá phụ. asāta là khó chịu (không dễ chịu), không phải "không có thật"; ativattati là lấn át/chế ngự (chú giải: abhibhūta, bị áp đảo), không phải "tiến tới"; tên bài Asātarūpa (cái khó chịu khoác hình thức dễ chịu) đổi từ "Kinh Người Mang Hình Dạng Vô Thực" thành "Kinh Asātarūpa" ở 0.4, 2.1 và translationTitle. 4.4 uddāna: dasāti là "mười (bài)", bản cũ "bài thứ mười tám" sai; 5.1 Majjhimo paṇṇāsako sửa thành "Quyển giữa trong bộ năm mươi" (bản cũ "thứ hai"). Tên phẩm Littavagga (khoá 0.3) đổi thành "Phẩm Litta" cho thống nhất với ja91. Chú giải Jātaka xác nhận. Không có bản Anh Sujato.

  Quyết định hội đồng biên tập 2026-10-16: C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
