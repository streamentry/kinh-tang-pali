  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 18 khoá bất đồng nghĩa → sửa 0, giữ 10, bất định 8. Giữ (bản nguyên bài khác Pāli ở): 65.2 (arati là sự chán nản, bất mãn, không phải thù hận); 73.4 (sabbadukkhā là cách xuất xứ, họ thoát khỏi mọi khổ đau, không phải khổ đau được phóng thích); 79.1 (samuddharasimaṁ là samuddharasi imaṁ, thì hiện tại ngôi hai, Ngài cứu vớt thế gian, không phải mệnh lệnh xin Ngài tiếp độ); 90.2 (agacchatha là thức giả định, song song với khīye ở 120.2, nên sẽ chứ không phải đã); 205.4 (taṁ không thể là định ngữ của vimaticchedanāya vốn ở cách tặng, nên là Ngài, như đã sửa 2026-10-12; bản nguyên bài đọc là nghi hoặc ấy); 207.4, 208.2, 208.3, 209.4 (kittayuṁ, pakittayuṁ, sakkeyyuṁ nằm trong câu giả định mở bằng bhave ở 207.2 và sace ở 210.1, nên sẽ thay cho đã); 214.4 (bhārehi bharito tathā vẫn thuộc người được ví, phần áp dụng cho chính người nói bắt đầu ở 215.1). Bất định, giữ bản dự án: 45.4 (sārambhena, đã ghi ở mục Bất định); 80.4 (dīpo là hòn đảo hay ngọn đèn; giữ hòn đảo theo cụm parāyaṇo patiṭṭhā ca đi trước và theo hai khoá cùng Pāli ở tha-ap486:9.4 và bv1:24.4); 84.2 (ākhilājaṭaṁ, xem Bất định 4); 117.2 (sake tīsu, xem Bất định 3); 186.2 (paṭivādehi có thể là cách công cụ số nhiều, bằng những lời phản biện, hoặc mệnh lệnh, xin Ngài hãy đáp lại; bản dự án chọn cách công cụ vì mệnh đề sace … pāpuṇanti cần một phương tiện và kệ không đổi người nói; trong nhóm kn không nơi nào khác dùng dạng này); 191.1 (rammake māse là tính từ hay tên tháng; giữ tính từ, tháng đẹp trời); 223.1 và 223.2 (bản nguyên bài đọc khổ này theo một dị bản khác Pāli ghim, xem blocking_errors; không dùng làm căn cứ sửa). Bản nguyên bài không phân đoạn, gần như một đoạn một kệ (235 đoạn cho 237 kệ, thỉnh thoảng gộp hai kệ vào một đoạn như 95 và 96, 205 và 206), nên đối chiếu ở mức kệ, không phải mức khoá; không có bản Anh nên không đối chiếu English. Bản ấy chỉ dùng để phát hiện chỗ cần xem lại, không sao chép câu chữ. Đọc đối kháng lại toàn bộ 943 khoá một lần nữa (số Pāli, tên riêng và danh từ chung, thức giả định, người nói và đại từ, nháy): không có khoá nào sai nghĩa thật, không đổi khoá nào trong bản dịch.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bộ 943 khoá, đối chiếu bản
