  tìm thấy sai nghĩa, sai chủ thể, phủ định hay số lượng mới. Giữ chỗ khác với bản nguyên bài: 65.2,
  73.4, 79.1, 90.2, 205.4, 207.4–209.4, 214.4 (lý do đã ghi ở mục đối chiếu 2026-10-14, kiểm lại bằng
  ngữ pháp Pāli ghim, không đổi). Bất định, không đưa vào lời kinh: 223.1–223.4 vẫn không thành câu
  trọn theo chữ ghim; phussena và parisuttamabhāravā chưa phân xử được, bản Việt giữ nguyên dạng
  phussa, không sửa chính tả Pāli theo cách đọc của bản nguyên bài. Đề xuất cho người biên tập (lớp
  comment, không phải lời kinh): đối chiếu dị bản Pāli của khổ này trong các ấn bản khác trước khi
  quyết định, rồi mới sửa nguồn ghim hoặc ghi waiver có tên; giữ blocker cho đến khi có phán quyết.
  Điểm giữ nguyên vì không có bằng chứng mới.

  Lô G7 2026-10-15: kiểm lại lỗi lặp bằng Pāli đã ghim, Claude Sonnet 5.5 (Claude Code). 16.3 `opupphā
  padumā` là sen còn búp non (PED: opuppha = bud, young flower, J vi.497), không phải "cánh rũ xuống".
