notes: |-
  Dịch trực tiếp từ Pāli root tại commit đã ghim; đủ 943/943 khoá, đúng thứ tự Pāli, không có khoá ngoài Pāli. Cấu trúc bài: 0.1 đến 0.3 là tiêu đề, 1.1 là câu mời nghe, 2.1 đến 135.4 là phần thứ nhất do Sāriputta kể (một khối nháy kép mở ở 2.1, đóng ở 135.4), 136.1 là dòng chia phần tụng đọc, 137.1 đến 236.4 là phần thứ hai (khối nháy kép mở lại ở 137.1, đóng ở 236.4), 237.1 là lời kết, 238.1 là dòng chốt. Người nói là Sāriputta ở ngôi thứ nhất nên đại từ dịch là tôi (Ta chỉ dùng ở 102.1 và 102.4 vì lời đó do Đức Phật Anomadassī nói); lời tán thán của đạo sĩ Suruci (79.1 đến 86.4, 88.1 đến 93.4), lời hỏi của Varuṇa (100.1 đến 100.4), lời thọ ký của Đức Phật Anomadassī (102.1 đến 124.4) và các cuộc đối thoại với Assaji và Kolita (144.3 đến 157.4) là các khối nháy đơn lồng trong. Đại từ tôi so với ta: ở phạm vi gần nhất (tha-ap4 đến tha-ap9, đếm chữ trong toàn bản dịch) là chữ tôi 157, chữ ta 21; ở toàn tầng, các vế lặp như viharāmi anāsavo dùng ta 150 trên 219 khoá; bài này theo phạm vi gần nhất, nên 34 khoá có Pāli trùng với bài khác khác tiền lệ chỉ ở chỗ tôi thay cho ta.

  Bài không có bản Anh Sujato ở commit đã ghim, không có bản Việt phân đoạn và chưa có lớp english-project, nên không có đối chiếu English độc lập theo tầng; xem blocking_errors. Tham chiếu phụ, không phải tầng và không tính vào coverage: bản Việt toàn văn không phân đoạn của Bhikkhu Indacanda (đọc để hiểu mạch lạc ở các chỗ khó, không sao chép câu chữ) và bản Anh Sujato của thag17.2 (một văn bản khác, có hai khổ gần như song song với 227 và 228 của bài này).

  Tên bài và tên phẩm. 0.3 và translationTitle là cùng một chuỗi, Bài Kệ Tuyên Ngôn Về Trưởng Lão Sāriputta, theo tha-ap4, tha-ap5, tha-ap6, tha-ap8 (Bài Kệ Tuyên Ngôn Về Trưởng Lão X). Pāli ở 0.3 (Sāriputtattheraapadāna) không bắt đầu bằng số nên bản Việt không thêm số thứ tự. Kiểu mở đầu tên: đo ở phạm vi gần nhất (tha-ap1 đến tha-ap12 đã có) là Bài Kệ Tuyên Ngôn 10, Bài Kệ Tuyên Ngợ 1; đo toàn nhóm tha-ap đã có (562 tệp, bỏ số thứ tự đầu tên) là Bài Kệ Tuyên Ngợ 255, Ký Sự Về 156, Bài Kệ Tuyên Ngôn 143, Kinh Kệ 5. Hai phạm vi cho hai đa số khác nhau: bài này theo đa số gần (Tuyên Ngôn), vì Tuyên Ngợ là chính tả sai; cần người biên tập phán một lượt cho cả cuốn. 0.1 giữ Therāpadāna (550 trên 561 khoá). 0.2 là Phẩm Phật theo 11 khoá tha-ap cùng Pāli Buddhavagga (Phẩm Đức Phật 17 khoá là các bài mil). 237.1 dùng công thức chung của nhóm. 238.1 dịch theo tha-ap8:158.1 (tên bài rồi thứ tự), tức Bài Kệ Tuyên Ngôn Về Trưởng Lão Sāriputta, thứ nhất.

  Lời kết 237.1. Itthaṁ sudaṁ āyasmā sāriputto thero imā gāthāyo abhāsitthāti không có chữ nghe trong Pāli; bản Việt giữ quy ước của tầng là Tôi nghe như vầy: (573 khoá) và dùng nhóm số nhiều của quy ước (407 khoá những bài kệ này) vì imā gāthāyo là số nhiều và abhāsitthāti là quá khứ của một sự kiện; không dùng nhóm đã từng nói bài kệ này (21 khoá, đã bị gọi là lỗi ở nhiều lát). Cách này trùng tha-ap4 đến tha-ap9.

  Số Pāli, đều tính tay và đối chiếu với tiền lệ cùng bộ: catuvīsa ở 36.1, 48.3 và catubbīsa ở 61.3 là catu 4 cộng vīsa 20, tức 24 và nhân sahassa 1.000 thành 24.000, dịch hai mươi bốn ngàn; cullāsīti ở 88.1 là 84 (4 cộng 80), nhân sahassa thành 84.000, dịch tám mươi bốn ngàn (khớp đo núi Neru ở 88.4 và 89.1); satasahassa ở 95.3 là 100 nhân 1.000 là 100.000, dịch một trăm ngàn vị; saṭṭhi ở 106.1 là 60, nhân sahassa là 60.000, dịch sáu mươi ngàn; soḷasa ở 107.1 là 16, nhân sahassa là 16.000, dịch mười sáu ngàn; kappasatasahassa ở 109.1 là 100 nhân 1.000, tức 100.000 kiếp, dịch một trăm ngàn kiếp; sahassakkhattuṁ ở 109.3 và 110.1 là một ngàn lần; asītikoṭī ở 113.1 là 80 koṭi (giữ koṭi, không quy đổi); koṭisatasahassaso ở 89.4 là 1 koṭi nhân 100 nhân 1.000, dịch một trăm ngàn koṭi phần; pañcasataṁ ở 129.3 là 500; kappanahuta ở 151.4 là nhiều nahuta, một nahuta là 10.000, dịch nhiều muôn kiếp; kappakoṭī ở 209.3 là hàng koṭi kiếp; sahassārāni ở 75.1 là một ngàn nan; sahassaṁ ở 218.4 là một ngàn. Các số nhỏ: pañca (35.3) năm, chasu (42.1) sáu, tisso (235.3) ba, catasso (236.1) bốn, aṭṭhime (236.2) tám, chaḷabhiññā (236.3) sáu, tīhaggīhi (215.1) ba ngọn lửa, tikkhattuṁ (198.4) ba lần, tiṇṇaṁ vedāna (137.2) ba Veda, catubbaṇṇā (181.1) bốn giai cấp. Pāli của bài không có tiṁsa và không có cụm Tiṁsakappasahassa; thọ ký về số kiếp chỉ có ở 109.1 (kappasatasahassāni, đi với devaloke ramissati) và 114.1 (apparimeyye ito kappe, dịch sau vô lượng kiếp nữa kể từ nay, thêm chữ nữa theo gợi ý họ tha-ap). Không có phép tính nào cần nhân thang lớn ngoài các phép ở trên.

  Nháy và dấu lược. Pāli có 2 nháy kép mở, 2 nháy kép đóng, 12 nháy đơn mở và 12 nháy đơn đóng; bản Việt có đúng số đó và khớp Pāli từng khoá: 0 lệch trên 943 khoá nhân bốn loại dấu. Pāli không có dấu ti nằm trong nháy. Pāli không có … hay (…) ở khoá nào nên bản Việt cũng không có: phép lược chạy với mẫu số 943 khoá và cho 0 khoá có dấu lược ở cả hai bên. Pāli ở 135.4 và 236.4 kết bằng ”. còn bản Việt kết ”. (nháy đóng rồi chấm).

  Tái dùng tầng: dựng chỉ mục Pāli sang Việt trên các bài kn đã có trong worktree lúc dịch. 314 khoá của bài có Pāli trùng nguyên văn với bài khác, tổng 5.558 cặp tiền lệ; 232 khoá dùng đúng bản Việt phổ biến nhất của tiền lệ (so sánh bỏ dấu câu và hoa thường); 82 khoá khác, trong đó 34 chỉ khác ở tôi thay cho ta, các khoá còn lại khác có chủ ý: Anomadassī giữ nguyên tên (69.1, 98.1, 101.1; tiền lệ tha-ap398 dịch nghĩa thành Bậc Vô Tỳ Nhiễm, 3 khoá, nhưng tên riêng ở 94.2 và bv28 giữ nguyên); satthā dịch bậc Đạo Sư (80.1, 114.4; tiền lệ 57 khoá ở 114.4 dùng bậc Thầy và 1 khoá ở 80.1; chọn Đạo Sư theo gợi ý họ tha-ap và để phân biệt với ācariya ở 230.3 và 232.1, dịch thầy); haṁsā dịch thiên nga (23.1; tiền lệ ngỗng trời 3 trên 4 khoá; thiên nga 74 khoá trên toàn tầng); pāramiṁ gato, abhiññāpāramippattā dịch đến bờ bên kia (41.1, 130.3; tiền lệ chỗ tận cùng ở cả 5 khoá của 41.1 và ba-la-mật 3 trên 4 khoá của 130.3; theo tha-ap4:15.2, tha-ap4:20.4 và sáu khoá của tha-ap8, và để cùng một từ pāramī trong bài chỉ có một cách dịch); 124.4 dịch chỗ tối thượng thay vị trí tối thượng của tiền lệ 1 khoá, để khớp với 233.4 (tiền lệ 2 khoá chỗ tối thượng; toàn tầng chỗ tối thượng 32, vị trí tối thượng 5); 114.1 thêm chữ nữa; 159.4 và 172.1, 173.1, 173.3, 174.2, 196.4 theo đúng tiền lệ. Các khoá còn lại khác ở một vài chữ. Pāli trùng trong chính bài: 61 nhóm gồm 169 khoá; 53 nhóm có bản Việt giống hệt nhau; 8 nhóm khác nhau: 4 nhóm chỉ khác dấu câu hay chữ hoa đầu dòng (85.3 và 93.3; 90.1 và 120.1; 163.2, 178.2 và 211.2; 163.3, 178.3 và 211.1), 4 nhóm khác có chủ ý vì người hay vật được nói đến khác nhau: 99.2 (của bậc Đạo Sư Anomadassī, sở hữu cách) với 125.2 (đối với bậc Đạo Sư Anomadassī, người ta tỏ lòng tôn kính); 105.3 (Chúng, nói về quân đội và nhạc cụ) với 108.3 (Họ, nói về các người nữ; trùng tha-ap8:39.3); 152.2 (không có tôi vì chủ ngữ đã nêu ở 152.1 Svāhaṁ) với 161.2; 180.3 (Chúng, nói về các con sông) với 181.3 (không có đại từ, chủ ngữ là bốn giai cấp ở 181.1).

  Thuật ngữ và số đếm. lokanāyaka dịch bậc Dẫn Đạo thế gian (toàn tầng bậc Dẫn Đạo 253, Đấng Dẫn Đạo 57; tha-ap1 đến tha-ap9 bậc 6, Đấng 0). lokanātha (221.3) dịch bậc Bảo Hộ thế gian (toàn tầng Bảo Hộ 57 khoá, tha-ap1 đến tha-ap9 chưa có). dhammasenāpati dịch Tướng quân Chánh pháp (12 khoá Tướng quân Chánh pháp, 1 khoá Tướng Quân Chánh Pháp). sissa dịch đệ tử theo phạm vi gần. garuḷa dịch ca-lâu-la (4 khoá, đều trong nhóm tha-ap; kim sí điểu 52 khoá toàn tầng không chọn vì lẫn nhiều nghĩa), kumbhaṇḍa dịch cưu-bàn-trà (22 khoá), dānava giữ Pāli (11 khoá), vijjādhara dịch các vị trì minh chú (2 khoá). Tên thực vật, cá và chim ở 5 đến 33 giữ dạng Pāli theo tiền lệ cùng Pāli của tha-ap407, tha-ap412, tha-ap414 (những vế như Cá pāṭhīna, cá pāvusa, Atimuttā và asoka, Kosamba, Chiêu liêu, me rừng, Táo gai, đào lộn hột), chỉ dịch những tên có tiền lệ rõ (chuối và thanh yên ở 15.2, chiêu liêu, me rừng, xoài, mận, bàng hôi, táo gai, đào lộn hột, sầu đâu, thợ săn, gấu, chó sói, linh cẩu, sen đỏ, sen xanh, sen trắng); 23.2 tambacūḷaka dịch gà mào đỏ theo nghĩa tên (tamba đỏ đồng, cūḷa mào). pettike gocare (41.2) dịch hành xứ của cha ông theo mil6.4.1:56.2 (1 khoá cùng Pāli). pāramī và paññāya pāramiṁ gantvā dịch đến bờ bên kia về trí tuệ. Chọn nghĩa theo từ: nāga ở 73.1 và 139.3 là Long Tượng, ở 234.3 là thớt voi; mātaṅga ở 26.3 là voi (không dịch kuñjara, vì bài không có); saḷala ở 9.1 và 29.1 giữ Pāli saḷala và tách khỏi sāla (cây sāla ở 8.1, 72.3, 193 và 194) theo gợi ý họ tha-ap. 71.2 sappabhāsaṁ dịch có hào quang (không có đại từ tassa trong khoá). Các nhóm gợi ý khác của họ tha-ap (caṅkami, adāsahaṁ, apothayi, anāsave, jātassara, mukhatuṇḍena, bījanī, tisso sambuddho, Migaluddo) không xuất hiện trong Pāli của bài. luddakā (27.3) là danh từ chung, dịch thợ săn (138 khoá thợ săn trên toàn tầng).

  Lỗi bản nháp đã bắt: bản nháp từ lượt trước bị ngắt giữa chừng (797 trên 943 khoá), đọc lại từng khoá đối chiếu Pāli và sửa: 26.3 chữ voi chúa (không có chúa trong Pāli) bỏ; 27.3 Cetā bị giữ như tên riêng nên đổi thành danh từ chung; 38.3 chữ đất lặp nên viết lại; 59.3 garuḷa đổi thành ca-lâu-la theo tiền lệ; 73.4 bỏ chữ chúng sinh không có trong Pāli; 94.4 đổi nhìn quanh thành nhìn về một phương (disaṁ là số ít); 129.3 thêm lần; 140.4 và 141.4 đổi hẳn là thành có lẽ (bhavissati ở đây là phỏng đoán, không phải khẳng định); 179.2 giữ dạng Candabhāgikā; các cặp Pāli trùng trong bài (85.3 và 93.3, 135.1 và 111.1, 162.3 và 8.3, 174.1 và 196.3, 178.3 và 163.3) đã thống nhất; 160.4 và 159.4 bỏ chữ sẽ vì động từ Pāli ở thì hiện tại; 41.2 theo tiền lệ.

  Bất định (không thêm vào thân kinh). (1) 223.1 phussena và 223.2 parisuttamabhāravā chưa phân xử được: phussena có thể là dạng phân từ phussa (đã chạm tới), tên riêng hay dị bản; parisuttamabhāravā đọc sát chữ là mang gánh nặng tối thượng trong hội chúng, cách đọc khác là tôn kính bậc tối thượng (khác ở chữ bhāra và gārava); khổ 223 là mệnh đề quan hệ yaṁ saddhāsaṅgahitaṁ cittaṁ không có vế chính; xem blocking_errors, bản Việt giữ phussa. (2) 219.1 đến 219.4: mahāmuni ở 219.2 có thể là hô cách (bạch bậc Đại Mâu-ni, tôi đã làm chủ các sự an trú tuần tự; Ngài đã nói giáo pháp cho tôi) hoặc chủ cách chỉ Đức Phật (bậc Đại Mâu-ni làm chủ các sự an trú tuần tự đã nói giáo pháp cho tôi); bản Việt chọn hô cách, trùng cách hiểu của bản Indacanda; kathesi cũng có thể là ngôi thứ nhất hay ngôi thứ ba; nirodho sayanaṁ dịch sát chữ diệt tận là chỗ nằm. (3) 117.2 sake tīsu visārado: tīsu không nêu danh từ; đọc sát chữ tự tin trong ba điều của riêng mình, một cách hiểu khác là tự tin nơi ba Veda của mình (bối cảnh Bà-la-môn, và 137.2 có tiṇṇaṁ vedāna). (4) 84.2 pathavī cākhilājaṭaṁ: ākhilājaṭaṁ có thể là akhila (trọn vẹn) với jaṭā (mớ rối), hoặc khila với jaṭā (gốc rễ, cây cỏ); bản Việt đọc toàn bộ mớ rối chằng chịt. (5) 205.4 vimaticchedanāya taṁ: taṁ là nghi hoặc ấy hay là Ngài; bản Việt đọc nghi hoặc ấy. (6) 201.3 kākā senāva vibbhantā: senā có thể là bầy (nữ tính) hay chim ưng; bản Việt đọc bầy quạ tán loạn, không thêm chim ưng. (7) 27.3 cetā: dịch người hầu theo bản Indacanda (người phục vụ); không có tiền lệ trong tầng; cách đọc khác là tên một nhóm người. (8) 45.4 sārambhena: dịch với sự hăng hái; cách đọc khác là sự đối nghịch hay tranh đua. (9) 129.3 abbokiṇṇaṁ pañcasataṁ: dịch liên tục năm trăm lần; Pāli không nêu danh từ đi với năm trăm. (10) 89.3 Cuṇṇito aṇubhedena: dịch có chữ nếu để nối với 90.1 đến 90.2 (khi đếm theo từng lakkha, sẽ đi đến chỗ cạn kiệt); Pāli không có từ điều kiện, chỉ có thức giả định ở 90.2. (11) 156.1 đến 156.4: Subhānurūpo āyāsi, āneñjakārito viya, Dantova dantadamatho dịch sát chữ; chưa chắc về cấu trúc của hai vế sau. (12) 73.4 sabbadukkhā pamuccare: chủ ngữ không nêu, dịch họ. (13) 232.4 ussīsamhi karomahaṁ: dịch tôi hướng đầu về phương ấy (phía đầu khi nằm); đây là cách hiểu theo thói quen, Pāli chỉ nói tôi đặt vào phía đầu. (14) 207.1 đến 207.4 và 208.1 đến 208.2: các động từ kittayuṁ và pakittayuṁ đọc là thức giả định (đều sẽ tán thán), mệnh đề điều kiện lấy từ bhave ở 207.2. (15) 215.4 giriṁ uccārito yathā: uccārito dịch bị bắt phải nâng, cách đọc khác là được nâng lên. (16) 228.4 api muddhani tiṭṭhatu: hãy để vị ấy đứng cả trên đỉnh đầu, theo thag17.2:8.4; Pāli không nêu đầu của ai. (17) 223.3 và 223.4: yaṁ saddhāsaṅgahitaṁ cittaṁ, Sadā sabrahmacārīsu: dịch tâm nào được đức tin nắm giữ, luôn luôn đối với các bạn đồng phạm hạnh; quan hệ ngữ pháp của sabrahmacārīsu (ở nơi, đối với) không rõ. (18) 224.4 gaṇaṁ dịch hội chúng; gaṇa cũng có thể là một nhóm nhỏ. (19) 105.1 đến 111.4: các động từ tương lai trong lời thọ ký giữ ngôi thứ ba (người này); phụ nữ ở 107 đến 108 dịch người nữ, phụ nữ.

  Coverage English: mẫu số là 1 khoá (Pāli có nội dung từ 40 ký tự, bỏ khối :0): 237.1 (61 ký tự, lời kết); 942 khoá còn lại gồm tiêu đề, dòng chốt và các vế kệ ngắn dưới 40 ký tự, nên cổng coverage hầu như không đo được gì. english-sujato tại commit đã ghim chỉ có 9 nhóm cp, dhp, iti, ja, kp, snp, thag, thig, ud (755 tệp) và không có tệp thân kinh tha-ap nào (tệp tha-ap duy nhất là tệp tên), nên Sujato phủ 0 trên 1; vietnamese-current chỉ có Pháp Cú; english-project chưa có entry cho bài này. content/meta/reference-gaps.yaml chưa có entry cho tha-ap3; vì mẫu số là 1 và khoá đó là công thức nên chưa cần ghi nhận gap, người điều phối vẫn cần chạy npm run reference:gaps.

