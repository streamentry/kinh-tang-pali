  https://suttacentral.net/tha-ap3/vi/indacanda; (3) chú giải Visuddhajanavilāsinī, bản Pāli CST
  (tipitaka.org, s0510a.att1.xml, đoạn 3-1 Sāriputtattheraapadānavaṇṇanā) và bản dịch Anh của U Lu Pe
  Win (https://www.wisdomlib.org/buddhism/book/apadana-commentary-atthakatha/d/doc216899.html), đã đọc
  đối chiếu các khổ khó. Đã đối chiếu cả 238 khổ kệ (943 khoá) với hai bản dịch và đọc chú giải ở các
  khổ khó; sửa 2 khoá. 45.4 `sārambhena durāsadā`: chú giải “sārambhena yugaggāhena kalahakaraṇena na
  āsādetabbā” (không thể đụng chạm bằng sự gây gổ, cạnh tranh), Indacanda “bằng sự đối nghịch”, nên
  “với sự hăng hái” sai nghĩa → “bằng sự gây gổ, khó tiếp cận”. 117.2 `sake tīsu visārado`: chú giải
  “attano kule pavattamānesu tīsu vedesu visārado”, Indacanda “ba bộ Vệ-đà”, khớp 137.2 `tiṇṇaṁ
  vedāna` → “tự tin trong ba bộ Veda của riêng mình” (trước chỉ “ba điều”, mất danh từ). Giữ, được chú
  giải xác nhận: 79.1 `samuddharasimaṁ` là `saṁ uddharasi imaṁ`, hiện tại ngôi hai (chú giải
  “saṃsārato uddharitvā nibbānathalaṃ pāpesī”; Walters và Indacanda đọc như lời xin, không theo ngữ
  pháp); 65.2 `arati` là chán nản (Walters “displeasure”); 151.2 `paccabyatha` là “các Ngài đã thấu
  đạt” (chú giải “tumhe”). Bất định còn lại, không đổi: 16.3 `opupphā padumā` — PED p.168 và Walters
  “budding” là búp non, nhưng chú giải giải là “vigalitapattakesarā” (U Lu Pe Win “shed their petals
  and hairy pollens”: cánh và nhụy đã rụng) và Indacanda “úa tàn”, hai hướng trái nhau (lô G7 chọn
  PED); 80.4 `dīpo`: chú giải Apadāna “telapadīpo viya” (U Lu Pe Win “like an oil-lamp”), chú giải
  Buddhavaṃsa (bv1:24.4) nêu cả “padīpo” lẫn “samuddadīpo” (hòn đảo), Walters “Island”, nên giữ hòn
  đảo nhưng bất định; 84.2 `cākhilājaṭaṁ`: chú giải đọc “akhilaṃ pathaviñca jahe”, Walters “exhaust
  the entire earth”, Indacanda “vượt hẳn”, tức cả ba bản đọc dạng khác chữ ghim; chữ ghim giữ, không
  dịch theo dị bản; 191.1 `rammake māse`: chú giải “kattikamāse” (U Lu Pe Win “month of kattika”),
  Walters “April”, Indacanda “tháng Rammaka”, giữ tính từ “đẹp trời”; 223.1–223.2 (blocker, giữ):
  Walters “honored by the Best of Men”, Indacanda “sự tôn kính đối với bậc Tối Thượng Nhân” đều đọc
  `parisuttamabhāravā` như một cụm tôn kính bậc Tối Thượng Nhân, chú giải không giải khổ này; chỉ là
  bằng chứng nghĩa, không đổi chữ ghim, không gỡ blocker.
