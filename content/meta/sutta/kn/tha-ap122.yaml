  Bản Việt không có chữ số Ả-rập nào (0/48): Pāli viết số bằng chữ thì bản Việt cũng vậy.

  **Vị trưởng lão trong bài này (chỉ để ở đây, không đưa vào thân kinh).** Jātipūjaka
  là bậc thấy dấu hiệu Đức Phật sắp xuất hiện (`1.1–3.4`), làm việc lành, khởi tâm tịnh
  tín rồi làm lễ tôn thờ bậc già và mệnh chung ngay tại đó (`4.1–4.4`); sinh ra ở cõi
  nào cũng vượt trội mọi chúng sanh, các yếu tố theo hộ (`5.1–7.4`); 91 đời kiếp trước
  có 34 vị chúa tể tên Supāricariyā, thêm ba đời kiếp nữa làm Chuyển Luân Vương đại
  oai lực (`7.1–8.4`). Tên nghĩa là người tôn thờ bậc già, và đó là việc cả bài kể.
