notes: |-
  Đã đọc HẾT v7/p3.txt (456 dòng, đủ 12 bài của lát) trước khi viết chữ nào. Lát này có
  144 khoá / 12 bài: 10 bài Milindapañha (mil3.4.3, mil3.5.3, mil3.5.9, mil3.6.11, mil3.6.7,
  mil3.6.8, mil3.7.8, mil6.2.10, mil6.2.6, mil6.2.7) + 2 bài Therīgāthā (thig2.3, thig2.5).
  Cách đo mọi số dưới đây: đếm theo khoá, tức một khoá có chuỗi thì tính một, và đã trừ
  12 bài của lát này khỏi tầng làm mốc so sánh.

  Khung đối tác — dùng lại nguyên văn, không dịch lại:
  · “Khéo lắm, thưa tôn giả Nāgasenā.” (19 khoá trong tầng). TIEN_LE_PHAI.md đòi đúng
    nguyên văn này cho cặp mil3.5.6:2.1 == mil3.6.6:2.1; Pāli “Kallosi, bhante
    nāgasenā”ti trùng nguyên văn ở cả 10 bài mil của lát nên tôi dùng lại y hệt ở 7 khoá
    :2.1/:3.1.
  · “thưa tôn giả Nāgasena” 10, “Vâng, này Đại vương” 5, “này Đại vương” 156 khoá.
  · Rājā āha— : 5 bài đã có trong tầng, 3 bài dùng “Vua nói:” (mil3.4.9, mil3.5.4,
    mil3.7.13) và 2 bài “Vua nói—” (mil3.5.6, mil3.6.6). Chọn theo đa số 3:2 → “Vua nói:”,
    đồng nhất 7 khoá của lát. “Trưởng lão nói” có 3 khoá (mil3.5.6 dùng “Trưởng lão nói—”).
  · Dấu “”ti.” bị bỏ ở cả 10 bài (110:7 trong tầng mil), “”ti?” → “”?.
  · Tên phẩm dùng lại đúng nguyên văn bài đã có: Nibbānavagga = Phẩm Niết-bàn
    (mil3.4.9), Buddhavagga = Phẩm Đức Phật (mil3.5.4, mil3.5.6), Sativagga = Phẩm Chánh
    Niệm (mil3.6.6), Arūpadhammavavatthānavagga = Phẩm Xác Định Pháp Vô Sắc (mil3.7.13),
    Anumānapañha = Câu hỏi về suy luận và Nippapañcavagga = Phẩm Năm Điều Đã Vứt Bỏ
    (mil6.2.8). mil6.2.* không có khoá “Rājā āha—” nên vua nói thẳng trong ngoặc kép,
    đúng như mil6.2.8:1.1.
  · Colophon “X pañho N.” → “Câu hỏi về …, thứ N.” theo cả 5 bài mil đã có.

  Thuật ngữ có tiền lệ (đếm theo khoá):
  · pañcāyatana → năm căn (151). kamma → nghiệp (1230). nibbāna → Niết-bàn (621).
    paññā → trí tuệ (647). ariyasāvako → bậc Thánh đệ tử (đệ tử 1171). dhamma → Pháp (2028).
  · sattā sacetanā → hữu tình có ý thức (hữu tình 109). vāto → gió (270).
    utu → thời tiết (12); vế đối xứng akammajā ahetujā anutujā dịch “không do nghiệp,
    không do nhân, không do thời tiết”.
  · vītarāga → đã lìa tham (12 khoá đúng cụm này; lìa tham nói chung 81).
    rajojalla → bụi bặm (33). vāyati → thổi (gió lớn 8). megha → mây (120).
  · pāpakamma → điều ác (169). apuññan → nghiệp ác (94). rājamahāmatto → đại thần (161).
  · sakkā jānituṁ X → “có thể biết X không” (cụm có thể biết 62 khoá, ví dụ mn110:3.1
    “liệu người bất thiện có thể biết người bất thiện là…”). Công thức sakkā jānituṁ
    chưa có bản mil nào dịch, nhưng cách diễn đạt có tiền lệ.
  · yakkha → Dạ-xoa (139 khoá, 32 bài; ví dụ dn32:9.8 dùng đúng Dạ-xoa cho yakkha).
    “yêu quái” có 0.
  · paṭivasatī → cư trú ở đâu (cư trú 13); “ngự trị” có 0.
  · tamokhandhaṁ padāliyā → phá vỡ khối tối tăm (1, thig5.11:4.6) — dùng lại nguyên văn.

  0 tiền lệ, đặt mới, kèm lý do (đều là 0 sau khi đã trừ lát này):
  · sippikā → các bà mụ. PED định nghĩa sippikā là người đàn bà lớn tuổi; ở đây đi cặp
    với ācariyā (các vị thầy), nên là lớp người được dạy dỗ, và chính câu hỏi của đại
    vương là sự tồn tại của lớp ấy. Thân kinh không nói thêm, nên không thêm.
  · kammāyatana / sippāyatana / vijjāṭṭhāna → phạm vi công việc / phạm vi học tập /
    chuyên môn. Đây là ba tầng phương tiện mà câu hỏi liệt kê; giữ đủ ba vì Pāli nêu rõ,
    và dùng đúng một lần cho mỗi vế của khoá mil3.6.11:1.5.
  · ayoguḷa → cục quặng vàng. PED kể một khối quặng sắt có ánh vàng; đây là vật được nung
    nóng và phủ bụi cho giống đất, tản công đại vương với hành vi ác.
  · kaṭhina → gối trúc. kaṭhinatthana là dây kasūsa để làm chất đốt; cả câu hỏi của
    mil6.2.10 là về hiện tượng đốt, nên dịch “gối trúc” chứ không dịch “trúc” trần.
  · lekhācariya → chuyên đi vẽ chữ; lekhena → nhờ chữ viết (hai cụm này có 1 khoá trong
    tầng nhưng không phải theo nghĩa thợ chép chữ).
  · “Opammaṁ karohī” có 109 khoá Pāli trong mil nhưng chưa khoá nào đã dịch, nên đặt
    mới: “Hãy xét một thí dụ” (thí dụ 7, hãy xét 8). Câu trùng nguyên văn ở mil3.4.3:2.1
    và mil3.5.9:2.1 nên chỉ dịch một cách.
  · “nông dân” 24 và “gieo hạt” 19 là tiền lệ cho ẩn dụ ruộng ở mil3.4.3 và mil3.5.9.

  Bất định đã ghi nhận, không đưa vào thân kinh:
  · mil3.5.3:1.5 `kālaṅkatassa kathaṁ` — đọc kālaṅka là tấm sắt, vì lekhācariya là thợ
    chép chữ ngay trước và lời đáp của đại vương là “Lekhena” (bằng chữ). Cách đọc còn
    lại là địa danh Kaḷaṅka; không dùng địa danh vì Pāli ở đây không có dấu câu nào
    cho thành phố. Để cả hai cách mở cho biên tập.
  · mil3.6.7:1.7 `rasarāga` — rāga đọc theo nghĩa chữ là sắc/màu (màu sắc 13 khoá), ghép
    với rasa (vị) thành “vị và màu sắc”. Có thể đọc là mùi thơm, hoặc là lòng tham bám
    vào vị ấy; chọn nghĩa chữ và ghi ở đây.
  · mil3.6.7:1.3-1.5 `ajjhosita / anajjhosito` là câu đố. Chọn “được đủ / không đủ” để
    giữ hình dạng đối đáp và để lời giải ở 1.5 (một người tìm lợi, một người không tìm
    lợi) còn là lời giải chứ không phải một câu trả lời khác. Không dịch thành “tài sản”
    vì Pāli không nói vậy.
  · mil3.6.11:1.2-1.5 `kaṭumikā sati` → “một ít niệm”. sati theo glossary là niệm
    (mục sati), giữ nguyên.

