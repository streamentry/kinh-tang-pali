notes: |-
  8/9 khoá có English Sujato ở commit đã ghim (đã kiểm source/upstream-manifest.json: sutta/kn/ja/ja79_translation-en-sujato.json có mặt); riêng dòng kết 2.1 Sujato để trống, đúng thói quen chung của lớp Anh, nên toàn bộ vế kệ đều được đối chiếu. Sujato: When cows were plundered and killed, / houses burned down, and people abducted, / then came the son of she whose son is dead, / sounding the harsh drum of war. Cowell 79 dịch đúng bộ vế này và cùng kết luận, nên đây là ba tầng khớp nhau.
  Tiền lệ đếm được: `ḍiṇḍima` giữ chữ (dn10: trống diṇḍima); `kharassara` → khô khốc (1 tiền lệ, ja146:1.2); `gāvo` → bò; `daḍḍhāni gehāni` → nhà cửa bị thiêu rụi (thiêu rụi 1 tiền lệ); `nīto` → bị lôi đi (2 tiền lệ); `viluttā` → bị trộm cướp; `putta` → đứa con (73 tiền lệ).
  BẤT ĐỊNH thật sự ở 1.3 `puttahatāya putto`: Pāli không có mệnh đề phủ định nào. Cowell phải bổ sung (A son no more, for such a son is dead), còn Sujato dịch thẳng là con của người mẹ đã mất con. Tôi dịch nguyên văn chữ, giữ luôn hai lần `putto` (một lần là chủ ngữ của `gāma`, một lần trong thành phần định danh) và không chèn phủ định — lựa chọn ít giả định nhất; ý luận điệu vẫn rõ vì cả bốn vế đứng chung. Alternative reading đã ghi, không coi là đã phân xử trọn vẹn.
  0.3 `Varuṇavagga` 0 tiền lệ: phẩm này lấy tên từ bài đầu phẩm ja71 Varuṇajātaka (cây Varuṇa), và Sujato dịch phẩm là The Warding Tree, nên chọn Phẩm Cây Varuṇa thay vì giữ chữ Pāli trần. 0.4/2.1 đặt tiêu đề theo Sujato (The Harsh Sound) vì `Kharassara` đã nói hết trong chính vế kệ, dịch ra tiêu đề không thêm nghĩa nào.
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. 0.1 Jātaka giữ nguyên (58 bài đã có) và 0.2 Ekakanipāta → Bộ Một Bài Kinh (57 bài) theo tiền lệ đếm được. 1.1 mở nháy kép, 1.4 đóng nháy kép + dấu chấm, không giữ `ti.` (tiền lệ 51/57 bài; 10 bài mới hơn cũng bỏ). Dòng kết 2.1 dùng dấu phẩy (Kinh X, thứ N) theo làn sóng gần nhất ja108…ja119; kho còn 48 bài không dấu phẩy — ghi ở đây để biên tập chuẩn hoá sau, tôi không sửa bài ngoài lát. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Chú giải Jātaka-aṭṭhakathā bằng Pāli không truy cập được trong môi trường dịch này, nên bối cảnh lấy từ truyện E. B. Cowell, The Jātaka vol. I (bản 1895, tải từ archive.org); đây là lý do triangulation không lên cao. technical_integrity 10.0 căn cứ chốt _hvi.py đã pass và tự chạy lại script kiểm bổ sung (9/9 khoá khớp Pāli, NFC, ngoặc kép cân trên cả bài, không lệch dấu lược); npm run validate|test|build không chạy theo lệnh cấm của lát.
