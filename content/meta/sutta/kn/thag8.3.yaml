notes: |-
  `Mahāpanthakattheragāthā`, bài thứ 3 của `Aṭṭhakanipāta`. 43/43 khoá. Tầng Anh đã ghim
  CÓ tệp `thag8.3_translation-en-sujato.json` (36/43 khoá có Anh); không có segment Pāli ≥ 40 ký
  tự nên không vào `reference-gaps`.

  **Tên phẩm theo đa số CỤC BỘ trong `thag8`:** `:0.2` `Aṭṭhakanipāta` → *“Bộ Tám Bài Kinh”*
  (**2/2** ở `thag8.1`/`thag8.2`) — khác `thag7.*` (*Bộ Bảy Bài Kệ*); toàn tầng Pāli này chia
  6 *Bộ Tám Bài Kệ* (lớp `ja`) và 3 *Bộ Tám Bài Kinh* (lớp `thag`/`thig`), nên đa số toàn tầng
  không dùng được ở đây và tôi theo đa số cục bộ. `:0.4` → *“Kinh Kệ Của Trưởng Lão
  Mahāpanthaka”* (2/2 cục bộ). `Aṭṭhakanipāto niṭṭhito.` → *“Bộ Tám Bài Kinh đã khép lại.”*
  (nguyên văn với `thig8.1:10.1`).

  **Tiền lệ dùng lại nguyên văn:** `Tassa mevaṁ viharato,` → *“Tôi cứ sống như thế này,”* và
  `passa vīriyaparakkamaṁ;` → *“hãy nhìn sự tinh tấn nỗ lực ấy!”* (`thag3.2:3.1`–`3.2`, cùng công
  thức); `Tisso vijjā anuppattā,` → *“Ba minh đã chứng đạt,”* (`tha-ap223:3.3`); `taṇhāsalle
  anūhate.` → *“khi mũi tên ái chưa được nhổ đi.”* (`thag3.2:2.4`); `vippamutto nirūpadhi.` →
  *“giải thoát, không còn sanh y.”*; `Tato ratyā vivasāne,` → *“Rồi khi đêm chấm dứt,”*
  (`snp3.11:32.1`); `pabbajiṁ anagāriyaṁ.` → *“ta xuất gia sống đời không nhà.”* (4 cặp trùng,
  3/4 dùng cụm *xuất gia sống đời không nhà*); `satthāramakutobhayaṁ;` → *“bậc Đạo Sư không sợ
  hãi bất cứ điều gì;”*; `Namassamāno sambuddhaṁ,` → *“đảnh lễ bậc Chánh Đẳng Giác,”*.

  **Bất định thật đã chọn và ghi rõ — kệ 2.1–2.4.** Pāli đảo trật tự (hypallage):
  `Siriṁ hatthehi pādehi, yo paṇāmeyya āgataṁ; Etādisaṁ so satthāraṁ, ārādhetvā virādhaye.`
  Trừ `Siriṁ hatthehi pādehi` ra thì mệnh đề là “ai đã tìm được một bậc Thầy như thế, sẽ đẩy lùi
   nó”. Tôi dịch theo đúng thứ tự Pāli để không bịa: *“Sự may mắn, dùng tay lẫn chân, / người đã
  tìm được / một bậc Thầy như thế, / sẽ chống đuổi nó đi.”* `siri` = *sự may mắn* (Sujato nhân
  khẩu hóa thành *Lady Luck*; tôi giữ nghĩa gốc). `ārādhetvā virādhaye` = *chống đuổi* (Sujato
  *ward her off*). Câu này **chậm đọc** — đã ghi để người biên tập xem lại nếu muốn đảo trật tự.

  **Sujato và Pāli lệch nhau ở 8.4 — Pāli thắng.** `pallaṅkena upāvisin”ti.` nghĩa đen là
  *“[tôi] đến nơi, kiết già”* (`upa + avis` = tiến tới); Sujato dịch *“so I sat down cross-legged.”*
  Tôi dịch *“tôi ngồi kiết già xuống”ti.* — vừa giữ `pallaṅkena` (kiết già, tiền lệ 28 cặp) vừa
  giữ hành động ngồi xuống mà Sujato nêu, nhưng **không** thêm chữ nào không có nguồn.

  **`Pubbenivāsaṁ jānāmi,` (7.1) chọn theo đa số:** 5 cặp trùng nguyên văn, không có cách nào
  chiếm đa số (*Con biết được…*, *Con nhớ lại…*, *Tôi biết rõ…*, *Nay tôi thấu rõ…*, *Ta biết rõ
  túc mạng…*); tôi theo *biết rõ* + *đời sống quá khứ* vì khớp với `Pubbenivāsaṁ` và với
  `dibbacakkhu` ở kệ sau. `dibbacakkhu visodhitaṁ;` → *“thiên nhãn đã được thanh tịnh sáng
  ngời;”* theo `thag6.1:5.2` nguyên văn.

  **`Sikkhāsājīvasampanno, indriyesu susaṁvuto` (4.1–4.2) 0 tiền lệ** → *“Trang bị học pháp và
  sinh khoản, / giữ các căn khéo hãm;”* (`sikkhā` = *học pháp*, `ājīva` = *sinh khoản* theo
  `sajīvasājīva`; `indriya` = *căn*, `susaṁvuta` = *khéo hãm* theo `cittaṁ susaṁvutaṁ` ở `an1`).
  `Tato me paṇidhī āsi, cetaso abhipatthito;` → *“Từ đó trong tôi có nguyện ước, / được tâm ta mong
  ước;”* — 0 tiền lệ, dịch theo nghĩa `paṇidhī` = ý nguyện, `abhipatthita` = mong ước ở tâm.
