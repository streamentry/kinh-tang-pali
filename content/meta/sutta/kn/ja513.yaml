notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja513_root-pli-ms.json` (142/142 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ; phần văn xuôi của Jātaka không nằm trong tầng Pāli đã ghim nên bối cảnh câu chuyện chỉ được suy từ chính các bài kệ.

  - Tầng tham khảo:
    Tầng English của Sujato không có ja513 (Sujato Jātaka chỉ có 83 tệp, trong đó không có uid này); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Tôi chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Tôi có xem thêm một bản Anh cũ phạm vi công cộng (H. T. Francis, E. B. Cowell biên tập, 1905) chỉ để nhận ra ai nói với ai ở từng bài kệ; đó không phải tầng đã ghim, không được dùng làm bản đối chiếu độc lập, và không câu chữ nào được lấy từ đó. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
  - Coverage English:
    Mẫu số = 0. Không khoá Pāli nào của bài đạt ngưỡng 40 ký tự theo `source/layers.yaml` (bài toàn kệ ngắn, bỏ khối `:0`), nên cổng coverage không đo được gì; điều đó không có nghĩa là không cần ghi nhận gap. Sujato phủ 0/142 khoá, `english-project` 0/142, `vietnamese-current` 0/142.
  - Phân loại & tiêu đề:
    + `0.1` "Jātaka"; `0.2` "Bộ Ba Mươi Bài Kinh" (Tiṁsanipāta, tiṁsa = 30, theo `ja512`); `0.3` "Phẩm Mong Muốn Gì" (Kiṁchandavagga, dùng lại nguyên văn `ja512:0.3`); `0.4` "3. Kinh Jayaddisa" và `34.1` "Kinh Jayaddisa, thứ ba." (tatiyaṁ = 3, khớp số "3." ở `0.4`) theo khuôn "Kinh <Tên>" / "Kinh <Tên>, thứ n" của `ja512`, `ja501` và các bài cùng đợt.
  - Người nói (Pāli không ghi tên; suy từ lời xưng hô và bối cảnh trong bài):
    + Kẻ ăn thịt người (porisāda, về sau gọi Kammāsapāda ở `13.3`): `1`, `3`, `5`, `7`, `20`, `22`, `26`, `29`, `31`; vua Jayaddisa: `2`, `4`, `6`, `9`, `11`, `13`; hoàng tử Alīnasatta: `10`, `12`, `14`, `21`, `23`–`25`, `28`, `30`; cha (`16.3`–`16.6`), mẹ (`17`), một người anh em (`18`, `bhātika`), vợ (`19`, `sāmi`) là bốn lời cầu an trước lúc hoàng tử đi; `8`, `15`, `16.1`–`16.2`, `27.1`–`27.3`, `32`, `33.1`–`33.3` là lời kể. Quy ước xưng hô: vua và hoàng tử xưng "ta" với kẻ ăn thịt người và gọi y "ngươi"; hoàng tử gọi vua là "bệ hạ"/"ngài" và xưng "con"; vua gọi hoàng tử "con".
  - Pāli trùng nguyên văn:
    Dò Pāli của 142 khoá với toàn bộ Pāli đã ghim (mọi bộ): 10 khoá dài trên 12 ký tự có ít nhất một dạng trùng ở bài khác (`0.3`, `4.4`, `5.3`, `6.4`, `7.4`, `8.1`, `8.2`, `9.4`, `29.3`, `33.2`; trùng chủ yếu ở `ja537`, chưa có bản Việt). Chỉ hai nơi so được với bản Việt hiện có: `0.3` (dùng lại nguyên văn `ja512:0.3`) và `5.3` `Ācikkha me taṁ api sakkuṇemu` (cố ý khác `pv20:1.3`, nơi bản Việt viết "dù khó nói đến đâu"; ở đây `api sakkuṇemu` được đọc là "biết đâu ta có thể" vì `5.4` nói rõ việc ta có thể cho phép đi và trở lại. Đó có thể là lỗi ngoài lát ở `pv20`, chỉ báo, không sửa). `0.1` dùng lại "Jātaka".
    Trong chính bài: 5 nhóm Pāli trùng nguyên văn (`4.3` = `6.3` = `7.3` = `8.3`; `4.4` = `6.4`; `15.1` = `27.1` = `32.1`; `18.3` = `19.3`; `6.2` = `7.2`). Bản Việt giống nhau ở 4 nhóm đầu; nhóm `6.2` = `7.2` cố ý khác ("buộc vào ta" ở `6.2`, lời của vua; "buộc vào ngươi" ở `7.2`, lời của kẻ ăn thịt người nói với vua).
  - Số Pāli:
    `sattamī` (`1.2`, trong `sattamibhattakāle`) = 7 → "ngày thứ bảy"; `sattadhā` (`29.3`) = satta 7 + hậu tố `-dhā` (từng phần) → "bảy mảnh"; `pannarasa` (`31.2`, `pannarase`) = pañca 5 + dasa 10 = 15 → "ngày rằm"; `tiṁsa` (`0.2`) = 30; `tatiyaṁ` (`34.1`) = 3, khớp `0.4`; `ubho` (`12.4`) = 2 → "cả hai". Bài không có số đếm nào khác.
  - Thuật ngữ (có đếm trên tầng):
    + `porisāda`/`purisādaka` → "kẻ ăn thịt người" (cp19, cp32 trong tầng, 4/4 khoá có bản Việt); `yakkha` → "dạ-xoa" (theo `ja512`, `ja458`); `vadaññū` → "hào phóng" (an4.53, an4.54, sn1.75, 5/8 khoá mẫu; còn "rộng lượng" 2, "rộng rãi" 1); `dhitimā` → "kiên định" (`ja502:25.2`); `pañjalika` → "chắp tay" (93 khoá); `abhisiñc-` → "làm lễ quán đảnh" (dn19:30.9, dn19:31.1); `āvī raho vā` → "công khai hay kín đáo" (`ja382:16.4`); `hatthārohā`, `rathikā` → "người cưỡi voi", "người đánh xe" (dn2, an7.67); `negamā jānapadā` → "dân thành thị và dân nông thôn" (dn5, 23 khoá, ở đó là "thành thị và nông thôn"); `sotthāna` → "lời cầu an" (an8.50 "an lành", kp5 "an ổn"; chưa có tiền lệ đúng nghĩa nghi thức cầu an trong tầng).
  - Chỗ bất định (không thêm vào thân kinh):
    + `3.1` `Seneva tvaṁ paṇasi sassamāno`: khó nhất bài. Đọc `sena` là chim ưng, `paṇasi` là "mặc cả/đem ra đánh đổi", `sassamāno` là "mong được yên thân, thoát thân"; nội dung phép so sánh với chim ưng và nghĩa của `sassamāno` không phân xử được từ Pāli một mình.
    + `3.3`–`3.4` `jighaññaṁ` đọc là "tầm thường" (hạ liệt) bổ nghĩa cho con nai; `khādissaṁ pacchā` không có tân ngữ, tôi bổ sung "ngươi" vì chỉ có thể là vua.
    + `4.2`, `5.4` `paṇhe`: đọc là "vào buổi sáng" (pubbaṇhe); cách đọc khác là `paṇha` = "vấn đề, câu hỏi" ("về việc trở lại") ít khả dĩ hơn.
    + `8.2` `kāmakāmī` → "thỏa lòng mong muốn"; `8.4` `puttamalīnasattaṁ` đọc `puttaṁ alīnasattaṁ`, `Alīnasatta` là tên hoàng tử (xác nhận ở `32.4` `paccāgamā kapilamalīnasatto` và `18.2`); cách đọc "người con không nhụt chí" cũng ngữ pháp được.
    + `9.4`, `14.2` `ñatte`: dịch "đến chỗ kẻ ăn thịt người"; nghĩa sát chữ của `ñatte` chưa tra được.
    + `10.1` `pāva`: đọc là `pāpa` (xấu), "việc xấu nào"; dạng này không rõ và có thể là bản chép sai.
    + `13.3`–`13.4` `bhidā rukkhasūle`: "xiên con vào cọc gỗ" (bhidā có thể là "đâm xuyên" hoặc "xẻ ra"); `Kammāsapāda` giữ nguyên làm tên (kẻ ăn thịt người, chân lốm đốm), không giải nghĩa trong thân kinh.
    + `14.4` `mataṁ jīvitassa vaṇṇemi` → "ca ngợi cái chết hơn là sự sống"; cách chia cách ở `jīvitassa` không chắc.
    + `16.2` `parammukho` → "quay mặt đi" (có thể là "quay mặt về hướng khác để lễ").
    + `17.1`–`17.2` `daṇḍakirañño gatassa`: "khi Rāma đã đi đến chỗ vua Daṇḍaki"; `suguttā` đọc là tính từ của người mẹ ("giữ mình chu toàn"), cách đọc "được che chở kỹ" cũng được.
    + `19.1` `anadhimanosi`: hiếm (toàn Pāli chỉ có `ja504:25.1` `adhimanā` "hoan hỷ"); dịch "chưa từng làm thiếp phật lòng", đối xứng với `19.2` `appiyosi`; cách đọc "chàng không kiêu mạn với thiếp" không loại trừ được.
    + `23.3` `mātu ca hetu`: "và vì mẹ"; vì sao vì mẹ thì Pāli không nói thêm.
    + `25.4`, `28.4` `chādayamāno … adesi`: `chādayamāno` đọc là "thích thú/vừa ý", `adesi` là dạng của `ad-` (ăn), không phải `dā-` (cho); cách đọc `chādayamāno` là "che đậy" ít khả dĩ.
    + `26.4` `sambhañja` → "gom củi" (sam + bhañj; cũng có thể là "bẻ củi").
    + `30.2`, `30.4` `avāsesi`, `sasatthuto`, `kāmaduhajja`: toàn Pāli ghim chỉ có `avāsesi` ở đây (hapax); dịch "hiến dâng chính thân mình" theo mạch câu và theo truyện Thỏ ở `ja316`; `sasatthuto` "được tán dương nhờ con thỏ"; `kāmaduha` "bậc ban điều ước", có thể là danh xưng riêng.
    + `31.2` `pannaraseva bhāṇumā`: "vầng sáng ngày rằm" (mặt trăng rằm); `bhāṇumā` thường chỉ mặt trời nên nghĩa chính xác ở đây không chắc.
    + `32.2` `pariyāya`: "đi nhiễu quanh" (đọc là gerund của `pariyāyati`); không loại trừ nghĩa khác.
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 142/142, cùng thứ tự.
    2. Nháy đơn `‘’`, nháy kép `“”` và dấu lược `…` khớp Pāli từng khoá: 0/142 lệch (Pāli 0 `…`, Việt 0; nháy đơn chỉ ở `20.3`; nháy kép mở/đóng từng đoạn thoại, `33.4` đóng bằng `”`).
    3. Pāli trùng nguyên văn trong chính bài: 5 nhóm, xem trên; Việt khác 1 nhóm, cố ý.
    4. Dấu lược `…pe…`/`(…)`: Pāli 0/142 khoá, Việt 0/142 (phép chạy rỗng).
    5. Số Pāli: xem trên.
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng (`Jātaka`, `Jayaddisa`, `Pañcāla`, `Alīnasatta`, `Kammāsapāda`, `Soma`, `Varuṇa`, `Pajāpati`, `Rāma`, `Daṇḍaki`, `Rāhu`, `Kapila`). Đã in cặp Pāli↔Việt ra đọc toàn bài (142 cặp).
