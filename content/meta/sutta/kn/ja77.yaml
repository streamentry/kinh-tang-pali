notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết. Đối chiếu Pāli + Anh Sujato
  (tệp có trong cây đã ghim; 8/9 khoá có prose, chỉ khoá chốt 3.1 Sujato để trống). Không có bản Việt hiện hành.
  Coverage English đo trên Pāli có nội dung (≥40 ký tự) của bài này là 0 phân số: không có khoá nào đạt
  ngưỡng, nên không phát sinh khoảng trống coverage cần ghi nhận. Sujato có ở commit đã ghim nhưng rất lỏng,
  nên Pāli là nguồn quyết định ở mọi chỗ lệch.
  Tiền lệ dùng lại: Jātaka (179 bài) · Ekakanipāta → Bộ Một Bài Kinh (134 bài Jātaka, 107 bài Theragāthā;
  nhóm iti dùng Phẩm Một Pháp nhưng không dùng nhóm đó ở đây) · Varuṇavagga → Phẩm Cây Varuṇa (8 bài) ·
  usabha → bò đực (dn5:1.6) · kumbha → bình (an3.30) · pokkharaṇī → ao sen/hồ sen (an1.333, an3.39) ·
  vipariyāsa → đảo lộn (mn104:17.9). Chưa có tiền lệ nào trong tầng cho siṅgālī, apākacandana, eḷakā, maṇḍūkī,
  kāka, vakā, lābu, supaṇṇa, nên tôi dịch trực tiếp từ Pāli và tra sẵn ở toàn tầng: siṅgālī → vỏ ốc (Sujato
  dịch sai thành she-jackal), apākacandana → gỗ đàn hương không nấu được (theo nghĩa chữ apāka, không theo
  lối Sujato tách thành uncookable rice rồi sandalwood), eḷakā → dê (sn17:4 có tiền lệ), maṇḍūkī → Ếch,
  kāka → quạ, vakā → sói, supaṇṇa → thiên nga.
  Bất định đã ghi nhận. Khoá 1.4 Lābūni: nếu hiểu là câu động từ thì thành câu vô nghĩa, nên tôi đọc là
  danh từ số nhiều của lābu (một loại bầu, thống nhất với alābu trong an1.314 và lông tơ cây bầu trong mn77);
  Sujato cũng dịch vế này thành pumpkins sink. Lābūni có thể còn là dạng ngữ pháp khác, đã ghi ở đây.
  Khoá 1.3 pokkharaṇī: tầng dịch chữ này là ao sen/hồ sen (mặt nước), còn ở đây nó nằm trong danh sách vật
  được lấy nên tôi dịch là hoa sen. Tiêu đề Mahāsupinajātaka dịch là Kinh Đại Thiên Nga theo mẫu
  Kinh Không Hề Ngờ / Kinh Illisa của ja76 và ja78.
  Dấu lược: cả bài không có …pe… nên hai phía đều 0.
  Ngoặc kép: Pāli mở ở 1.1 và đóng ở 1.4, còn vế hai (2.1-2.4) kết bằng ti mà không có dấu mở — đúng kiểu
  Bilara mà thag2.4 và thag2.11 đã có sẵn bản Việt xử lý bằng cách thêm dấu mở ở đầu vế hai. Tôi làm y vậy,
  nên hai phía cân: một cặp.
  Lượt soát chéo đã tự bắt và sửa 3 chỗ sau khi đọc lại từng cặp Pāli và Việt: 1.3 sửa nhập nhằng hoa sen và
  cây sen; 2.4 bỏ chữ không có trong Pāli; 1.1 chỉnh gàu bê non cho đúng với gāviyo.
  Kiểm kỹ thuật: save_vi chạy sạch. Vì mọi khoá Pāli bài này ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và
  các assertion không tự chạy, tôi tự quét MỌI khoá (script _w2_tu_kiem.py): đủ 13/13; đúng ID; không rỗng;
  NFC; không trùng nguyên văn Pāli; dấu lược bằng Pāli; nháy kép cân trên cả bài; không còn (…) đứng một mình;
  không có từ Pāli nào lọt vào. Đợt này cấm chạy npm run validate, test, check, build nên tôi KHÔNG tuyên bố
  technical gate pass; bốn lệnh đó để người điều phối chạy, và tôi hạ technical_integrity xuống 9.8.
