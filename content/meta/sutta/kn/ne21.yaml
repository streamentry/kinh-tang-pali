notes: |-
  Bản dịch từ Pāli root; không có bản Anh pinned (xem blocker), nên `triangulation` đặt 7.0 (≤ 8.0) và bài giữ `draft`. Mẫu số coverage = 147 khoá Pāli có nội dung trên tổng 198 khoá; Sujato phủ 0/147. Đã đọc đối chiếu cặp Pāli↔Việt cả 198 khoá sau khi viết.
  Tiêu đề: `:0.2` Paṭiniddesavāra → "Phần Giải Thích" (23 tệp Netti đã có `:0.2` này, kể cả `ne20`, `ne22`–`ne34`); `:0.3` Sampāta 2 → "Nhóm 2"; `:0.4` Vicayahārasampāta → "Nhóm Phương Thức Khảo Sát" theo bảng `X-hārasampāta` → "Nhóm Phương Thức X" của phần Paṭiniddesavāra (14 tiêu đề đã dịch: `ne20`, `ne22`–`ne34`). `hāra` → "phương thức": 29 khoá so với "hướng dẫn" 1 khoá trên 62 khoá `ne` có `hāra` ngoài tiêu đề; "Hướng Dẫn" chỉ nằm ở tiêu đề `ne6`–`ne19` (đánh số Nhóm 3–16, phần trước), không dùng cho nhóm Paṭiniddesavāra này. `vicaya` → "khảo sát": `ne2:1.2` có `vicayo` → "tích lũy" (1 khoá), không theo vì nghĩa Pāli là tìm xét và `pavicaya` nêu rõ ở `:2.1`. `:1.1` và `:44.3` theo mẫu `ne26:1.1`/`ne26:2.8` ("Ở đây, nhóm phương thức … là gì?"; "… đã được vận dụng").
  Tiền lệ dùng lại: bài kệ `:20.1`–`:20.6` theo `sn3.22:4.1`–`4.6` (6 khoá Pāli trùng chuẩn hoá, wording giống; `:20.6` chỉ đổi dấu cuối `;` theo Pāli); `:20.7`–`:20.8` không trùng nên viết mới (`:20.8` khác `thag14.2:14.4` vì đổi chủ ngữ); `:37.7` dùng nguyên `dn34:1.4.7`; `:37.2` "Bốn thiền." = `dn33:1.11.19`; `:37.6` theo `dn33:1.10.120`/`dn34:1.4.6`; `:27.3` "Do nguyên nhân nào?" = `ne19:8.8`, `ne19:8.14`, `ne35:3.3` (3/3); `:27.2` "đống tà định, đống chánh định, đống không định" theo `dn33:1.10.59`; công thức mười sức mạnh (`:18.2`) lấy "điều có thể và điều không thể" theo `mn12:10.1`; `:41.3` theo `mn108:21.1` (thêm ba cụm "nhiều trăm/ngàn/trăm ngàn đời" mà `mn108` không có; Pāli `anekānipi jātisatāni …`); `:42.2`/`:43.1` theo `mn94:27.2`; `:3.2` theo `mn137:27.7`; `:5.1` theo `dn34:1.6.13`; `:4.2`/`:4.5` tham chiếu `an5.27:1.7`, `dn34:1.6.73`, `an3.101:2.7` (ba bản đều khác nhau, chọn cách diễn đạt riêng); `:14.x` theo `mn115:13.1`–`13.10` ("giết", "với tâm độc hại làm chảy máu", "nhận … làm đạo sư"); `:12.x`/`:13.x` theo `mn22:2.2`, `an3.64:10.2`, `sn55.25:10.6`; `:13.4` "không còn dư y" theo `dn16:4.38.2`; `:28.3` theo danh sách `mn115:4.3`–`8.4`, `9.4`; `:36.1`/`:38.7` bộ ba `saṅkilesa`/`vodāna`/`vuṭṭhāna` theo `an10.21:9.1`, `an6.64:3.1` ("thanh tẩy", "xuất khỏi"; riêng `saṅkilesa` → "ô nhiễm" theo `ne20`, 95/163 khoá, còn `an10.21` viết "sự nhiễm ô"; `mn12:16.1` viết "thanh tịnh" cho `vodāna`, không theo). Dò toàn tầng kn/mn/an/sn/dn được 12 khoá `ne21` có Pāli trùng nguyên văn chuẩn hoá (`:0.2`, `:20.1`, `:20.3`–`:20.6`, `:20.8`, `:27.3`, `:37.2`, `:37.6`, `:37.7`, `:41.2`); Việt khác ở 3 khoá: `:20.8` (đổi chủ ngữ), `:41.2` ("Tức là" so với "Như sau đây" ở `mil5.1.4`), `:20.6` (chỉ dấu câu). Trong chính bài có 2 nhóm Pāli trùng nguyên văn (`:23.1`=`:23.14`; `:23.7`=`:23.10`=`:23.12`), cả hai nhóm Việt giống nhau (0 cặp Việt khác).
  Thuật ngữ đã đo: `taṇhā` → "tham ái" theo bộ Netti (`ne7:1.5`, `ne18:7.9`); `tattha` đầu câu → "Ở đây" (39/47 khoá `ne`; toàn tầng "Ở đó" 629 so với "Ở đây" 119, không theo vì bộ Netti nhất quán "Ở đây"); `samatha` → "chỉ" (tầng: "chỉ" 16, "tịnh chỉ" 9, "định tĩnh" 3 trên 120 khoá; `ne28:2.2` "chỉ và quán" cùng `ne34:2.2`; `ne19:5.9`, `ne23:2.3`, `ne26:2.2`, `ne30:2.3` có "sự định tĩnh" — không theo để khỏi lẫn với `samādhi` "định"); `vipassanā` → "quán" (99/116 khoá); `nevasaññānāsaññā-` → "phi tưởng phi phi tưởng" (quy ước tầng); `samāpatti` → "sự chứng đạt" (42/269 khoá; "sở chứng" 12, "thiền chứng" 5); `adhigama` → "sự đạt được" để khỏi trùng `samāpatti`; `dukkhindriya`… → "khổ căn, ưu căn, lạc căn, hỷ căn, xả căn" (121 khoá so với "căn khổ…" 10 khoá); `dhātu` → "giới" theo `mn115` (tầng còn có "phạm vi" ở `ne13:4.1`, "sở" ở `sn14.1:2.2`, không theo); `kasiṇa` → "biến xứ" (`dn33:3.3.35`, `dn34:2.3.36`, `mn77:24.2`); `vimokkhamukha` → "cửa giải thoát"; `appaṇihita` → "vô nguyện" (`dn33:1.10.123`; "vô sở chú ý" 2 khoá, "vô nguyện" 5/16); `sakkāyapariyāpanna` → "nằm trong hữu thân" (`sn55.54:7.11`, `sn22.78:2.11`; `an4.33:2.7` "thuộc về thân kiến"); `vaṭṭa` → "vòng luân chuyển" (`dn1:3.72.0`); `saṁsāra` → "luân hồi" (54/58 khoá); `kāmataṇhā`/`vibhavataṇhā` → "dục ái"/"phi hữu ái" (29/35 và 11/18 khoá; trong cùng bài vẫn để `taṇhā` thường là "tham ái" theo bộ Netti); `taṇhāvicarita` → "dòng chảy của tham ái" (`an4.199:5.4`); `dvāsaṭṭhi diṭṭhigatāni` → "sáu mươi hai tà kiến" (`sn41.3:2.4`); `āneñjābhisaṅkhāra`, `apuññābhisaṅkhāra` → "hành bất động", "hành vô phước" (`dn33:1.10.78`; "vô phước" 45 so với "phi phước" 6 trên 174 khoá); `āgāḷhā`/`nijjhāmā paṭipadā` → "đạo lộ sa đọa"/"đạo lộ thiêu đốt" (`an3.156`); `diṭṭhisampanno` → "người đầy đủ chánh kiến" (24 so với "thành tựu kiến" 8 trên 63 khoá); `nānādhimuttikatā` → "khuynh hướng khác nhau" (`mn12:14.1`, `sn52.19:0.3`, `sn52.19:1.1`; `an10.21:7.1` "kiến giải giải thoát" không theo); `kammasamādāna` → "cách thọ nhận nghiệp" theo `dn33:1.11.143` ("cách thọ nhận pháp"; `mn12:11.1` "nghiệp được tạo tác" không theo); `anodhiso` → "không theo từng phần" (`odhiso` ở `an4.172:2.1`–`5.1` "theo từng phần", 4/4 khoá); `ṭhānaso` → "theo hoàn cảnh" (`an10.21:4.1`; `mn12:11.1` "theo nền tảng"); `netaṁ ṭhānaṁ vijjati` → "điều ấy không thể có", `ṭhānametaṁ vijjati` → "điều ấy có thể có" theo `mn115` (đoạn Netti dẫn trực tiếp công thức này); toàn tầng dạng đơn (không có `anavakāso`) "không thể xảy ra" 75, "không thể có" 60, dạng khác 64 — không có đa số rõ nên chọn theo `mn115`; `suggati`/`sugati` → "cõi thiện thú" (lấy từ lời kệ `sn3.22:4.6`) / "cõi lành"; `rāgacarita` → "hạng người tính tham" (`ne6:13.3`, `pe7:7.1`); `pihā` → "khát ngưỡng" (`mn137:13.3`; `ne13:2.1` "khát"); `nekkhammasita` → "y cứ xuất ly" (`mn137:13.4`); `upakkilesa` → "tùy phiền não" để phân biệt với `saṅkilesa` → "ô nhiễm" (như `ne20`); `aṅgaṇa` → "cấu uế", `mala` → "vết nhơ" để không trùng; `bodhimūla` → "gốc bồ-đề" (5/5 khoá); `koṭi` giữ "koṭi" theo `tha-ap26:15.3`, `mil5.1.3:5.2`, `:6.2`, `:11.6`; `sabbaññutañāṇa` → "trí toàn tri" (`mil5.1.2`).
  Dấu lược và nháy: Pāli có `…pe…` ở `:22.5`, `:23.7`, `:23.10`, `:23.12` → đúng một `…`; không có `(…)`. Dấu nháy “ ” khớp Pāli từng khoá (198/198 khoá, 0 lệch; Pāli không có nháy đơn). Thẻ `<b>` ở `:21.1`–`:22.3` không đưa sang Việt (như `ne13:3.1`, `ne20:4.1`); câu lemma dịch rồi nối bằng dấu "—". Các khoá `:1.7`, `:11.2`, `:12.x`, `:14.x`, `:41.4`, `:41.5` có lời dẫn trực tiếp nhưng Pāli không có nháy nên Việt cũng không thêm nháy.
  Số Pāli (đều tự tính): `dve` = 2; `tayo`/`tīṇi`/`tīhi`/`tiṇṇaṁ` = 3; `cattāri`/`catu-` = 4; `pañca` = 5; `cha`/`chaḷaṅga` = 6; `satta` = 7; `aṭṭha`/`aṭṭhaṅga` = 8; `dasa` = 10; `ekādasa` = eka 1 + dasa 10 = 11 (`:37.4` "mười một, tám, bảy, ba và hai"); `chattiṁsa` = cha 6 + tiṁsa 30 = 36 (`:24.3`); `dvāsaṭṭhi` = dve 2 + saṭṭhi 60 = 62 (`:24.4`); `jātisata` 100, `jātisahassa` 1.000, `jātisatasahassa` = sata 100 × sahassa 1.000 = 100.000 (`:41.3`; cũng `kappasatasahasse` `:42.1` = 100.000 kiếp); mười sức mạnh `paṭhamaṁ`…`dasamaṁ` đủ 1–10 ở `:18.2`, `:27.4`, `:29.3`, `:30.2`, `:35.2`, `:38.7`, `:40.1`, `:43.3` (thứ tám, thứ chín), `:44.1`; danh sách `dhātu` `:28.3` 41 mục (Pāli 41, Việt 41); `keci …adhimuttā` `:30.1` 14 mục (14/14); các nghiệp chịu quả `:35.2` 9 mục (9/9); danh sách thời gian `:42.1`, `:43.1` 13 mục (13/13); `:27.4` bảy nơi sinh (địa ngục, súc sinh, ngạ quỷ, a-tu-la, chư thiên, loài người, Niết-bàn). Không có `Tiṁsakappasahassa`; `kappakoṭi` không quy ra số vì chưa xác lập được (mười triệu hay chỉ là số lớn).
  Bất định đã ghi nhận (không thêm vào thân kinh): (1) `:38.3`, `:38.4` `kukkuṭajhāyī` — xem blocker thứ hai. (2) `:33.4`–`:34.1` Pāli không có dấu chấm sau `micchattaniyatā` nên `imesañca puggalānaṁ` mơ hồ giữa nhóm đầu (Devadatta, Kokālika, Sunakkhatta — Ngài không giáo giới) và nhóm sau (bất thiện chưa viên mãn — Ngài giáo giới trước khi viên mãn, như Puṇṇa, vị lõa thể, Aṅgulimāla); dịch theo nhóm sau, `asamatta` → "chưa viên mãn", `abhinibbidhā` → "đột phá". (3) `:1.3` `pahānataṇhā` hiểu bổ nghĩa cho `kusalā`; `:1.7` chủ ngữ của `tadārammaṇā kusalā` không nêu, giữ "thiện lấy điều ấy làm đối tượng"; `santaṁ āyatanaṁ` hiểu "xứ an tịnh" (song song `mn137:13.3` có `etarahi` "hiện nay" — không theo). (4) `:2.1` `tassā ko pavicayo` — `tassā` giống cái, dịch "điều ấy", không chỉ định tham ái hay khát ngưỡng. (5) `:2.4` `pāramitāya` "ở mức viên mãn"; `:2.6` `yato … tato` → "khi … thì"; `dve ca visese` "hai điều thù thắng" không được nêu tên trong bài. (6) `:3.2` `saṇṭhahati` → "hiện khởi", `ukkaṇṭhā` → "chán ngán" (0 tiền lệ cho cụm này); `:3.3` `vokāro` → "sự xen tạp", `abbhatthaṁ gacchati` → "lặn mất", `evaṁ samādhi tassa samāhitassa` đọc "như vậy, trong định, nơi vị ấy đã định tĩnh". (7) `:9.2` `bhavaṅgāni` → "chi phần của hữu", `dve padāni` → "hai bước". (8) `:12.1`–`:13.4` `te` là ngôi hai ("Ngài"), theo công thức bốn điều tự tin (`an4.8`, `mn12:26.1`); `:12.4` `pubbena aparaṁ` → "theo thứ lớp". (9) `:14.1` `suhataṁ kareyya` → "đánh thật nặng" (không có song song `mn115`); `:14.5` `apadiseyya` → "nhận … làm đạo sư" theo `uddiseyya` ở `mn115:13.9`; `:14.6` `kutūhalamaṅgala` → "nghi lễ ồn ào và điềm lành" (chỉ 2 khoá tiền lệ: `mn38:24.12`, `an5.175:1.5`); `:14.2` `bhikkhuṁ` giữ nguyên "vị tỳ-kheo". (10) `:18.1` `sabbadosāpagato` → "đã lìa mọi lỗi"; `nemittako` → "kẻ gợi ý" (`mil7.4.2:1.3`); `kuhanalapananemittakattaṁ pubbaṅgamaṁ katvā` → "đặt … lên hàng đầu". (11) `:19.1` `ṭhānāṭṭhānagatā sabbe` → "tất cả những ai thuộc về điều có thể và điều không thể" (không thêm "chúng sinh"). (12) `:21.2` `dandhamaraṇa`/`adandhamaraṇa` → "cái chết chậm/không chậm" (0 tiền lệ). (13) `:21.4` `kammassakatā` → "tính là chủ của nghiệp mình" (`ps3.3:7.1`, `mn135:20.1`); `:21.5` `phaladassāvitā ca avippavāso` → "sự thấy quả của các nghiệp và sự không mất đi" (chủ thể của "không mất đi" không nêu). (14) `:23.3` `āgāḷhā ca nijjhāmā ca paṭipadā` — một danh từ số ít với hai tính từ; `an3.156` có hai đạo lộ riêng; dịch "đạo lộ sa đọa và thiêu đốt" giữ cả hai khả năng. (15) `:24.5` `cetanā cetasikakammena` → "tư và nghiệp thuộc tâm". (16) `:26.1` `ekā apāyesu, ekā devesu` → "một ở các đường dữ, một ở chư thiên". (17) `:30.1` `adhiṭṭhahanti` → "kiên trì giữ lấy". (18) `:35.1`–`:35.2` `mudu/majjha/adhimatta` → "yếu/vừa/mạnh" gắn với hành bất động/hành thiện còn lại/hành bất thiện. (19) `:39.1` `parivārā` → "tùy tùng", `:39.6` `paññāpayati` → "trình bày … theo". (20) `:42.1`, `:43.1` `lobhādayo` → "tham và những pháp tương tự" (không tự liệt kê), `ussanna/manda` → "trội/yếu", `amukāya kappakoṭiyaṁ` → "một koṭi kiếp nào đó". (21) `:44.1` `sabbaññutā pattā … uppannaṁ sabbaññutañāṇaṁ` giữ hai vế "sự toàn tri đã đạt được" và "trí toàn tri … đã sinh khởi".
