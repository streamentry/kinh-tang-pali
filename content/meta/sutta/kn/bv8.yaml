notes: |-
  Đợt 19, làn 87. Dịch từ Pāli root commit đã ghim, đủ 122/122 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ tám của Buddhavaṃsa, về Đức Phật Sobhita (vị thứ sáu theo `31.1`: `chaṭṭho`; Revata là thứ năm ở `bv7:30.1`, Anomadassī là thứ bảy ở `bv9:30.1`, nên khớp thứ tự phẩm): đức tính, chuyển bánh xe Pháp trước một hội chúng duy nhất, ba lần chứng ngộ và ba kỳ hội chúng (lễ dâng cúng của vua Uggata, của dân thành, và khi Đức Phật từ cõi trời đi xuống), tiền thân là Bà-la-môn Sujāta cúng thức ăn thức uống và được thọ ký, gia thế, xuất gia, đệ tử và thị giả, thân lượng, lời dạy ví như rừng hoa và biển cả, tuổi thọ, nhập Niết-bàn. Bài không có đoạn kể bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn của 15/15 khoá Pāli trùng.
  - `0.2` “8. Dòng Kế Thừa Của Đức Phật Sobhita”, cùng khuôn với `bv9:0.2`, `bv10:0.2`.
  - `31.1` “Dòng kế thừa của Đức Thế Tôn Sobhita là thứ sáu.” cùng khuôn `bv9:30.1`, `bv7:30.1`.

  **Số Pāli, đã tự tính.**
  - `5.3` `navutikoṭisahassānaṁ`: navuti 90 × koṭi × sahassa 1.000 = 90 nghìn koṭi, “chín mươi ngàn koṭi” (dạng đã có ở `bv22:4.3`, `bv15:5.3`).
  - `7.3` `koṭisahassānaṁ`: 1.000 koṭi, “một ngàn koṭi” (như `bv7:4.3`).
  - `9.4` `satakoṭiyo`: 100 koṭi.
  - `10.3` `navutikoṭīnaṁ`: 90 koṭi.
  - `11.3` `asītikoṭīnaṁ`: 80 koṭi.
  - `8.1` `tayo` 3 kỳ hội chúng, khớp ba kỳ ở `9.x`, `10.x`, `11.x` (hai kỳ sau có số thứ tự ở `10.4` “thứ hai”, `11.4` “thứ ba”; kỳ thứ nhất `9.x` Pāli không ghi “thứ nhất”, không thêm).
  - `4.4`, `5.4`, `7.4`: lần chứng ngộ “thứ nhất”, “thứ hai”, “thứ ba” (Pāli `paṭhama`, `dutiya`, `tatiya`).
  - `17.1` `navavassasahassāni`: 9 × 1.000 = 9.000 năm. `17.4` `tayo pāsāda` 3 lâu đài, khớp ba tên ở `17.3` (Kumuda, Nāḷina, Paduma).
  - `18.1` `sattatiṁsasahassāni`: satta 7 + tiṁsa 30 = 37, × 1.000 = 37.000, “ba mươi bảy ngàn”.
  - `19.1` `caturo` 4 dấu hiệu. `19.3` `sattāha` 7 ngày.
  - `24.1` `aṭṭhapaṇṇāsaratana`: 8 + 50 = 58 ratana.
  - `27.1` `navutivassasahassāni`: 90 × 1.000 = 90.000 năm.
  - `31.1` `chaṭṭho`: thứ sáu.
  - `13.3` `aparimeyyito kappe`: “vô lượng kiếp”, không có con số kiếp. Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Lời thọ ký.** `13.3`–`13.4` là lời nói về tương lai (`bhavissati`), nên `13.3` dịch “Sau vô lượng kiếp nữa,” cùng hướng đếm với `bv9:14.3`, `bv10:13.3`, `bv7:12.3`, `bv15:12.3`, `bv16:11.3`, `bv18:10.3`, `bv19:13.3`; khác `bv28:1.1` “Vào vô lượng kiếp trước đây,” vốn là lời nhìn về quá khứ. Pāli ở `13.3` không có chữ chỉ hướng; hướng lấy từ động từ ở `13.4`. Dấu nháy: Pāli mở nháy đơn ở `13.3` và đóng ở `14.3`, bản Việt giữ đúng như vậy (khác `bv7:12.3` mở nháy kép vì Pāli ở đó mở nháy kép).

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã dịch (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 56 khoá của bài có Pāli trùng với khoá ở bài khác, tổng 1.390 cặp, trong đó 57 cặp có Việt khác bản tôi viết; 55/56 khoá dùng đúng nguyên văn ít nhất một tiền lệ. 57 cặp lệch gồm: 21 cặp `14.2` chỉ khác ở khoảng trắng sau dấu lược (`… ` so với `…`; 965 khoá dùng `…` như tôi), 6 cặp `“…` (có nháy mở theo Pāli của khoá đó), `11.4` 5 cặp chỉ khác dấu chấm/chấm phẩy theo Pāli từng khoá, và các cặp khác về chữ, liệt kê dưới đây.
  - `1.4` “bậc vô song, không ai sánh bằng.” dùng đúng `bv22:1.4` (2/3); khoá lệch `bv19:1.2` có “đã có” vì ở đó khoá kề trước chưa có động từ; ở bài này động từ “có” nằm ở `1.2`.
  - `2.4` và `4.2` Pāli trùng (`dhammacakkaṁ pavattayi`): `2.4` “Ngài đã chuyển bánh xe Pháp.” (chủ ngữ “Vị Chiến Thắng ấy” ở `2.1` cách bốn khoá, nên nhắc “Ngài”; đúng `bv19:3.4`), `4.2` “đã chuyển bánh xe Pháp;” (chủ ngữ “bậc Chánh Đẳng Giác” ở ngay `4.1`). Bản Việt khác nhau có chủ ý theo chủ ngữ liền trước.
  - `5.4`, `10.4`, `11.4`: khác tiền lệ chỉ ở dấu cuối khoá (`;` hay `.`) theo Pāli từng khoá.
  - `12.1` “Vào lúc ấy, ta,” là dạng đa số (11/15); khoá lệch dùng “tôi” (lời tỳ-kheo-ni/trưởng lão) hoặc thiếu dấu phẩy.
  - `13.3`: xem mục Lời thọ ký. `13.4` “vị này sẽ trở thành Đức Phật.” là dạng đa số (12/13); 1 khoá `tha-ap491:1.4` viết “vị này sẽ là Đức Phật.”.
  - `14.1`: một khoá lệch chỉ ở nháy đơn mở (Pāli khoá đó có nháy mở); `14.1` ở bài này không mở nháy (nháy mở ở `13.3`).
  - `15.2` “ta hoan hỷ, tâm xúc động;” là dạng đa số (5/6).
  - `18.2` “người nữ được trang sức đẹp đẽ;” là dạng đa số (16/19); các khoá lệch là Pāli ngoài Buddhavaṃsa (`snp2.7`, `ja493`).
  - `24.4` “như mặt trời trăm tia sáng đã mọc.” dùng đúng `bv9:25.4` (khớp `tha-ap404:5.2` và hai khoá khác; hai khoá `tha-ap35:9.2`, `tha-ap523:7.2`, `tha-ap350:8.2` viết “đã bốc lên như trăm tia nắng mặt trời”).
  - `27.4` “vị ấy đã đưa đông đảo mọi người vượt qua.” là dạng đa số (9/10); khoá lệch `tha-ap343:1.4`.
  - Trùng trong chính bài: 4 nhóm Pāli trùng (2 + 3 + 2 + 2 khoá), tổng 6 cặp. `2.4`/`4.2` khác có chủ ý (xem trên). `13.2`/`20.2` (“Sobhita, bậc Dẫn Đạo thế gian;”) và `25.3`/`26.3` (“Cũng vậy, lời dạy của Ngài,”) giống hệt nhau. Nhóm `8.2`/`16.4`/`21.4` (Pāli `sobhitassa mahesino`): `8.2` “nơi Sobhita, bậc Đại Ẩn Sĩ;” (đứng sau “Đã có ba kỳ hội chúng,”, cùng khuôn `bv7:6.2`), `16.4` và `21.4` “của bậc Đại Ẩn Sĩ Sobhita.” (sở hữu: mẹ, thị giả; cùng khuôn `bv7:16.4`, `bv7:21.4`). Khác nhau theo vai trò câu, đúng như tiền lệ `bv7`. 0 cặp lệch do nhầm.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá).
  - `samāhita` → “định tĩnh” (`dn16:3.10.6`, `dn18:26.8`, `dn18:26.15`). `santacitta` → “tâm an tịnh” (9 khoá cùng cụm). `appaṭipuggala` → “không ai sánh bằng” (như `bv22:1.4`).
  - `mānasaṁ vinivattayi` → “đã xoay chuyển tâm ý” (2/2 tiền lệ: `thi-ap15:17.2`, `thi-ap9:17.2`). `kevalaṁ bodhiṁ` → “giác ngộ trọn vẹn”: không có tiền lệ cho đúng cụm; `bv18:2.1` dịch `sambodhiṁ` “giác ngộ”, nên giữ “giác ngộ” và thêm “trọn vẹn” cho `kevala`.
  - `avīci` → “địa ngục Avīci” (`iti89:5.3` `avīcinirayaṁ` “địa ngục Avīci”). `bhavagga` → “tầng cao nhất của hữu” (`sn22.76:2.4`, `sn22.77:2.4` “tầng cao nhất của hữu”; 2/2 cho dạng `bhavagga`).
  - `abhisamaya` → “chứng ngộ”, `sannipāta` → “kỳ hội chúng”, `samāgama` → “cuộc tụ hội” (như `bv9`, `bv18`, `bv27`). `marū` → “chư thiên” (`bv7:5.3`, `snp3.11:3.4`).
  - `ārāmaṁ ropayitvā` → “sau khi cho trồng một khu vườn”: `ropeti` là dạng sai khiến của `ruhati`, nên “cho trồng”; không có tiền lệ Việt cho đúng cụm (chỉ `cp22:3.4`, `cp20:5.3` với `ropayitvāna` khác nghĩa). `niyyādayī` → “dâng cúng” (`niyyādetvā` ở tầng được dịch “giao” trong ngữ cảnh học phí, `an5.192`; ở đây là hiến tặng cho Đức Phật, nên “dâng cúng”, 286 khoá dùng “dâng cúng”). `yāga` → “sự dâng cúng” (tầng dịch `āmisayāgo` “cúng tế vật chất”, `iti100:6.2`, nhưng ở đây là vật hiến tặng chứ không phải tế tự, nên không dùng “cúng tế”).
  - `dānaṁ deti` → “dâng cúng vật thí” (112 khoá `dānaṁ deti/adāsi` ở tầng; ngoài bv thường là “bố thí”; ở đây người nhận là Đức Phật nên chọn “dâng cúng”, dạng quen thuộc trong bv), `dāne` (locative) → “lễ dâng cúng”. `naruttama` → “bậc tối thượng trong loài người” (`bv17:17.4`, `bv18:17.4`), `purisuttama` → “bậc tối thượng giữa loài người” (`bv17:16.4`).
  - `puragaṇa` → “đoàn người trong thành”: không có tiền lệ Việt (0 khoá); `pura` thành + `gaṇa` đoàn, dịch sát.
  - `brāhmaṇa` → “Bà-la-môn” (trong bv: 4 khoá viết hoa “Bà-la-môn”, 1 khoá viết thường; toàn tầng: 3.278 khoá chứa “Bà-la-môn”, 1.666 khoá chứa “bà-la-môn”). `tappayiṁ` → “làm cho no đủ bằng thức ăn thức uống” (đúng `bv22:9.4`).
  - `tamevatthamanuppattiyā` → “Để đạt đến chính mục đích ấy”; `uggaṁ dhitimakāsahaṁ` → “ta đã tạo nên sự kiên quyết mãnh liệt”: không có tiền lệ Việt cho đúng cụm; `dhiti` (kiên cường, vững chí), `uggaṁ` (mãnh liệt, như `ugga` ở “tu khổ hạnh mãnh liệt”, `bv16:9.2`).
  - `suphulla` → “nở hoa rực rỡ” (`bv17:22.1` “nở rộ hoa”, `bv27:9.2` “nở rộ tươi tốt”). `pavana` → “khu rừng”: tầng dịch `araññe pavane` là “rừng hoang”, “rừng sâu” (`mn26:34.1`, `sn12.65:7.1`, `mn19:25.1`); ở đây `pavana` đứng một mình nên dùng “khu rừng”. `dhūpita` → “xông ướp”: không có tiền lệ cho `dhūpita` (tầng chỉ có `vidhūpita`, `padhūpita` nghĩa khác); “xông” (khói, hương) dịch sát. `sīlagandha` → “hương của giới”.
  - `atappiya` → “không bao giờ thấy đủ”: 0 tiền lệ Việt; `a-tappiya` (không thể làm cho no đủ). `sāgara` → “biển cả”.
  - `ovāda` + `anusiṭṭhi` → “lời giáo huấn và lời chỉ dạy”: 0 tiền lệ cho đúng cặp; hai từ gần nghĩa nên dịch thành hai chữ khác nhau. `hutāsana` → “ngọn lửa tế” (`tha-ap474:3.4`, `tha-ap333:2.4`, `tha-ap374:3.4`: “ngọn lửa tế”; 3/6 khoá). `tāpetvā` → “sau khi đã tỏa nhiệt”: xem bất định 7.
  - `balappatta` → “đã đạt đến sức mạnh” (`dn16:6.10.7`, `sn4.12:4.3`, `bv9:8.3`: 3/3 dạng “đạt đến/đạt”).
  - `varasambuddha` → “bậc Chánh Đẳng Giác cao quý” (`vara` cao quý, như `buddhavara` “vị Phật cao quý” ở `bv9:13.1`). `lokanāyaka` → “bậc Dẫn Đạo thế gian” (như `bv7:12.2`, `bv9`). `mahesi` → “Đại Ẩn Sĩ”, `mahāmuni` → “Đại Mâu-ni”, `mahāvīra` → “Đại Anh Hùng”, `jina` → “bậc Chiến Thắng” (như `bv7`, `bv9`, `bv10`). `āyu vijjati tāvade` → “là tuổi thọ lúc bấy giờ” (6/6). `dhātuvitthārika` → “việc xá lợi được rải rộng khắp” (7/7). `rittā sabbasaṅkhārā` → “mọi hành đều trống rỗng” (6/6).
  - `khīṇāsava` → “đã đoạn tận lậu hoặc”, `vimala` → “không cấu uế”, `tādī` → “bất động như vậy” (10/10 và 9/9 theo từng khoá).
  - Tên riêng: Sobhita, Revata, Jayasena, Uggata, Sujāta, Sudhamma, Sudhammā, Kumuda, Nāḷina, Paduma, Maṇilā, Sīha, Sudhammuyyāna, Asama, Sunetta, Anoma, Nakulā, Sujātā, Ramma, Sudatta, Cittā, Sīhārāma: giữ dạng Pāli có dấu (tên Đức Phật và vườn theo `bv7`, `bv9`, `bv10`; `Sobhita` đã dùng ở `bv9:1.1`). `nāga` (cây) giữ chữ Pāli như `bv7:22.4` “cây nāga”. `koṭi`, `ratana` giữ nguyên chữ Pāli (như `bv9`, `bv18`).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `2.1`–`2.2` `So jino sakagehamhi, mānasaṁ vinivattayi`: “ngay trong nhà mình” (`sakagehamhi`) và “đã xoay chuyển tâm ý”; Pāli không nêu quay khỏi cái gì hay hướng về cái gì. Cách đọc khác: tâm quay khỏi đời sống tại gia (theo truyền thống chú giải). Không thêm vào thân kinh; chỉ dịch sát chữ.
  2. `3.1`–`3.4` `Yāva heṭṭhā avīcito, bhavaggā cāpi uddhato; etthantare ekaparisā`: `uddhato` (“phía trên”) khó xác định hình thái (ablative của `uddha`?); dịch “và cả phía trên”. `ekaparisā` có thể là “một hội chúng duy nhất” (đồng một hội chúng cho cả khoảng từ Avīci đến đỉnh hữu) hoặc “một hội chúng” chỉ số lượng. Tôi dịch “một hội chúng duy nhất”. `avīci` Pāli chỉ nêu tên, tôi thêm “địa ngục” theo `iti89:5.3` (chữ `niraya` ở đó có trong Pāli). `bhavagga` dịch “tầng cao nhất của hữu”; cách đọc khác: “đỉnh của cõi hữu”.
  3. `4.1` `Tāya parisāya`: công cụ cách “cùng với hội chúng ấy”; cách đọc khác là định cách “trong hội chúng ấy”. Chọn công cụ cách theo hình thái.
  4. `5.1`–`5.2` `Tato parampi desente, marūnañca samāgame`: chủ ngữ của `desente` không nêu; tôi dịch “khi Ngài thuyết giảng” (đồng chủ ngữ với `4.1`–`4.2`). `tato parampi` “sau đó nữa”.
  5. `10.1` `puragaṇo`: “đoàn người trong thành” (hapax trong tầng). Cách đọc khác: “đoàn thể thị dân”, hay một tên riêng; không đủ chứng cứ.
  6. `11.1`–`11.2` `Devaloke vasitvāna, yadā orohatī jino`: Pāli không nêu nơi hạ xuống; tôi chỉ dịch “đi xuống”, không thêm “cõi người”.
  7. `28.3` `Hutāsanova tāpetvā`: `tāpetvā` là dạng sai khiến (“làm nóng”, “làm cho nóng”) nhưng không có tân ngữ; tôi dịch “như ngọn lửa tế sau khi đã tỏa nhiệt”. Cách đọc khác: “như ngọn lửa, sau khi đã làm nóng (thế gian)”, hoặc “… sau khi đã cháy hết”. Không đủ chứng cứ độc lập.
  8. `19.2`–`19.4` `pāsādenābhinikkhami … caritvā purisuttamo`: “đã ra đi bằng lâu đài” theo `bv17:16.2`; `caritvā` là bất biến quá khứ nên `19.4` kết bằng “sau khi thực hành,” (chủ ngữ “bậc tối thượng giữa loài người” cũng là chủ ngữ của `abhinikkhami` ở `19.2`). Khác `bv17:16.4` vốn có động từ chia `acarī`.
  9. `22.3` `Bujjhamāno ca so buddho`: “Và vị Phật ấy, khi đang giác ngộ,” rồi `22.4` “đã giác ngộ nơi gốc cây nāga”; Pāli không nêu “cây Bồ-đề” ở bài này (cây giác ngộ là cây nāga). Hai khoá `22.3`–`22.4` ở giữa danh sách đệ tử, nên chuyển ý đột ngột; giữ nguyên thứ tự Pāli.
  10. `22.1` và `23.3` cùng tên Nakulā (nữ đệ tử thượng thủ; nữ thị giả hàng đầu): Pāli không phân biệt. Giữ cùng chữ “Nakulā”.
  11. `24.1`–`24.2` `aṭṭhapaṇṇāsaratanaṁ, accuggato`: `ratana` là đơn vị đo chiều dài (không phải “châu báu”), giữ nguyên chữ Pāli như `bv9:25.1`; `accuggato` “cao vút”.
  12. `25.1`–`26.4` hai tỉ dụ (rừng hoa, biển cả): `tassa pāvacanaṁ` → “lời dạy của Ngài”. `atappiya` có thể là “không thể làm cho thỏa mãn” hoặc “không bao giờ chán”; tôi chọn “không bao giờ thấy đủ”.
  13. `29.1`–`29.2` `So ca buddho asamasamo, tepi sāvakā balappattā`: dịch “Và vị Phật ấy ngang bằng với bậc vô song, cả những vị đệ tử ấy cũng đã đạt đến sức mạnh;” Pāli không nêu “sức mạnh” gì (cách đọc khác: sức mạnh của các thắng trí, như `abhiññābalappatta` ở `bv9:8.3`); giữ nguyên chữ.
  14. `15.3`–`15.4` `Tamevatthamanuppattiyā, uggaṁ dhitimakāsahaṁ`: `anuppatti` là danh từ (sự đạt đến); `atthaṁ` có thể là “mục đích” hoặc “điều ấy”. Chọn “chính mục đích ấy”.

