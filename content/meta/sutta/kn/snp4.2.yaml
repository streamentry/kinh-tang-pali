notes:
  - >-
    Sửa lỗi nghĩa 2026-10-16: `Satto guhāyaṁ` — `satto` là quá khứ phân từ «bị
    dính mắc» (chú giải Niddesa `sattoti laggo`, chính mnd2:3.5 giải `satto
    visatto āsatto laggo`; Sujato «Trapped»; Indacanda «bị dính mắc»), không
    phải danh từ «chúng sinh»; bản cũ có hai chủ ngữ trong một câu kệ. Khoá 1.1;
    đồng bộ với mnd2.
  - >-
    Thống nhất cấp kho 2026-10-17: 1.4 suppahāya «thật khó buông bỏ» → «thật khó
    đoạn trừ» theo B10 của hội đồng (pajahati: «từ bỏ»/«đoạn trừ») và lời giải
    mnd2:18.4 (duppahāyā «khó đoạn trừ», duccajjā «khó từ bỏ»); DPD suppahāya
    easy to give up; cùng sửa dòng kệ dẫn lại mnd2:2.4, 15.1, 18.3, 18.5, 20.4.
