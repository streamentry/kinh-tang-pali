notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja382_root-pli-ms.json` (85/85 khoá, đúng thứ tự Pāli). Không có Sujato, không có Việt hiện hành, không có lớp lấp English ⇒ `draft` + blocker `noEnglishEditionUpstream` (xem `blocking_errors`).

  Cấu trúc bài: kệ đối đáp. Một người hỏi Kāḷakaṇṇī (1–3), Kāḷī nêu loại người nàng ưa (4–7), bị từ chối (8) và đáp lại (9); rồi hỏi Sirī (10–12), Sirī nêu loại người nàng ưa và loại nàng tránh (13–17), kết bằng kệ tổng kết (18). Ranh giới nháy khớp Pāli: mở tại 1.1, 2.1, 3.1, 4.1, 8.1, 9.1, 10.1, 11.1, 12.1, 13.1; đóng tại 1.4, 2.6, 3.4, 7.4, 8.4, 9.6, 10.4, 11.6, 12.4, 18.4.

  Tiền lệ có đếm và dùng lại:
  · Tầng bài: `Jātaka` → “Jātaka”; `Chakkanipāta` → “Bộ Sáu Bài Kệ” (ja381 và các bài cùng bộ); `Avāriyavagga` → “Phẩm Avāriya” (ja376–ja381, ja383–ja385). `0.4` theo mẫu “N. Kinh <tên Pāli>” như ja192 (cùng tên Sirikāḷakaṇṇijātaka) và ja380; dòng kết `19.1` theo mẫu “Kinh …, thứ bảy.” như ja381/ja383.
  · Pāli trùng nguyên văn TRONG bài: 8 nhóm (1.3=10.3; 1.4=3.4=10.4=12.4; 2.1=11.1; 2.5=11.5; 2.6=11.6; 3.1=12.1; 3.2=12.2; 4.3=7.3), bản Việt giống nhau ở cả 8/8 nhóm.
  · Pāli trùng nguyên văn Ở BÀI KHÁC: 56 cặp dò được (phần lớn là tiêu đề 0.2 `Chakkanipāta`/`Tikanipāta`… trùng chữ trong tầng); các cặp có nội dung thực là `4.2` ↔ an8.10:7.4 (ganh tị, keo kiệt, xảo trá: dùng lại), `5.1` ↔ sn37.14:2.3 (tên bài, không dùng lại), `6.2` ↔ ja443:8.2 (dùng lại “không thông đạt lợi ích của mình”), `8.4` ↔ ja478:9.2 (“các thị trấn và các kinh đô”: dùng lại, thêm “đến” vì ở đây là đích của động từ `gaccha`, còn ja478 là nơi đi qua).
  · `makkhī paḷāsī` → “xúc phạm, khinh miệt” theo mn15 (hơn 10 khoá); `issukī maccharī` → “ganh tị, keo kiệt” (mn15 và an8.10); `saṭho`/`asaṭho` → “xảo trá”/“không xảo trá” (dn25 và nhiều nơi); `sārambhī` → “hung hăng” theo mn7:4.22; `pisuṇo` → “nói lời ly gián” (dn32, sn11.11…); `kaṇḍakavāco pharuso` → “gai góc, thô ác” (mn114:6.11); `saṅgāhako` → “biết nâng đỡ” (dn31:34.17); `sakhilo` → “thân thiện” (dn4, dn5); `saṇhavāco` → “nói lời hòa nhã” (sn11.11); `nivātavutti` → “sống khiêm nhường” (dn31:34.11); `cāgavā` → “thí xả” (an8.23); `ḍaṁsasarīsapā` → “ruồi mòng, rắn rết” (sn4.6:5.2); `alakkhikā` → “xấu số” (sn47.6:1.3; ja284 dịch “không có số”) và `lakkhiṁ`/`alakkhiṁ` → “số may”/“số rủi” (khớp trường nghĩa “số” của ja284, Kinh Số Phúc).
  · 0 tiền lệ, tự đặt: `Kāḷī`/`Kāḷakaṇṇī`/`Sirī`/`Lakkhī`/`Bhūripaññā`/`Virūpakkha`/`Dhataraṭṭha` giữ nguyên tên Pāli (ja192 giữ `Sirī` và `Kāḷakaṇṇī`); `davappaluddho`, `ūmi samuddassa vaṇṇaṁ`, `karīsaṭhāna`.

  Bất định đã ghi (không đưa vào thân kinh):
  · 2.2 `virūpakkhassa caṇḍiyā`: `caṇḍiyā` có thể gắn với người con gái (nàng hung dữ) hoặc với Virūpakkha; bản Việt “của Virūpakkha, hung dữ” giữ nguyên chỗ mơ hồ ấy.
  · 7.2 `sabbamittehi dhaṁsati`: nghĩa “mất hết mọi bạn bè” (rơi khỏi/ bị tước khỏi mọi bạn) là cách đọc ít giả định nhất; không có bản song hành để phân xử.
  · 9.5 `ahaṁ devo ca me bhātā`: `devo` có thể là danh xưng chung (vị thiên) hoặc tên riêng của người anh; dịch “vị thiên là anh tôi”.
  · 9.6 `ubho naṁ vidhamāmase`: `naṁ` hiểu là “của cải ấy” (9.4); “cùng làm tiêu tan” là nghĩa của `vidhamāmase`.
  · 15.4 `ūmi samuddassa yathāpi vaṇṇaṁ`: `vaṇṇaṁ` cách đọc “vẻ đẹp” và `ūmi` “sóng”; không tìm được bản song hành để phân xử, dịch sát chữ.
  · 17.3 `etesaṁ … aññataraṁ`: “một trong những điều ấy” chưa xác định được tập hợp “những điều” trỏ tới (có thể là các thứ phúc lộc vừa kể); giữ mơ hồ như Pāli.
  · 17.5 `dittarūpaṁ`: “với vẻ kiêu ngạo”; `visamaṁ carantaṁ`: “hành xử sai trái”.
  · 4.3–4.4 và 7.3–7.4: Kāḷī nói về hạng người nàng ưa, nên mệnh đề `laddhaṁ yassa vinassati` được dịch “người có được gì cũng tiêu tan”.
  · 6.1 `ajja suveti`: dịch “hôm nay rồi lại ngày mai” (người hay trì hoãn), không dùng nháy vì Pāli không có.

  Phép kiểm 5/5 (tự đo):
  1. Tập khoá Việt = tập khoá Pāli: 85/85, đúng thứ tự, không khoá thừa, không khoá rỗng.
  2. Nháy kép/đơn khớp Pāli từng khoá: kép mở 10 khoá, kép đóng 10 khoá, đơn 0; 0 lệch (mẫu số 85).
  3. Pāli trùng nguyên văn trong bài: 8 nhóm, 0 nhóm Việt khác nhau.
  4. Dấu lược `…`: Pāli 0/85 khoá có, Việt 0/85; không `(…)`; không `…pe…`.
  5. Số Pāli: bài không có số lượng nào.

  Bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, nháy khớp Pāli từng khoá, và YAML đọc được. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để người phụ trách chạy.
