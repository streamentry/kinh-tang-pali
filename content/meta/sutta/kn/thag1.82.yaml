notes: |-
  Khung bốn khối tiêu đề giữ y hệt các bài thag1 đã có: 0.1 giữ Pāli kèm số,
  0.2 Bộ Một Bài Kinh (258 bài), 0.3 tên phẩm theo thứ tự, 0.4 Kinh Kệ Của Trưởng Lão
  với chữ Lão hoa (89 bài; bốn bài lẻ dùng lão thường). Dòng kết 1.5 giữ HAI dấu lược
  như Pāli (BRIEF_VI3 §10.1, không mở rộng), mở nháy kép ở 1.1 và đóng ở 1.4 y hệt Pāli.
  Bốn vế này tròn trơn, ít chỗ phải phán xét. puttaka là từ thân mật, con, tôi dịch con.
  sivāni abhayāni dịch an toàn, không hề nguy hiểm. subhikkhāni dịch thức ăn dồi dào;
  Sujato dịch plenty of food, cùng nghĩa. Yena yena là ở nơi nào, tôi dịch Nơi nào cho
  cả ba vế để cấu trúc lặp của câu kệ còn đúng. Tena puttaka gacchassu: gacchassu là mệnh
  lệnh đi, tôi dịch Hãy đi đến nơi ấy, con. mā sokāpahato bhavā là cầu nguyện, tôi dịch
  đừng để bị nỗi buồn chinh phục; bhavā là mệnh lệnh cầu mong nên đừng ở dạng khẳng định.
  Vì Pāli viết Kassapattheragāthā ở 0.4 nhưng … Kassapo thero … ở 1.5, tôi giữ cả hai
  dạng Kassapa và Kassapo đúng theo Pāli.

  Kỹ thuật: 9/9 khoá, không rỗng, thứ tự khớp Pāli, NFC, số dấu lược bằng Pāli từng
  khoá, nháy kép cân trên cả bài, không còn (…). save_vi sạch, chạy lại hai lần
  idempotent. Vì mọi khoá Pāli của Trưởng Lão ngắn hơn 40 ký tự nên cần trong kiểm()
  rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá bằng script riêng. Không
  chạy npm run validate|test|check|build (lát này cấm) nên technical_integrity 9.5.
  Tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên không có bản Hòa thượng
  Thích Minh Châu cho Trưởng Lão; bản Anh Sujato có mặt và tôi đã đọc ở tất cả tám bài
  này. Ô English trống ở dòng kết không phải sự đồng thuận, mà là chỗ Pāli phải tự đứng
  vững.
