notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên.
  
  **Lần thứ ba bản dịch bám Pāli ở chỗ Sujato lệch.** Sujato đặt `1.1` = *Go, child, to any place* và `1.3` = *where it's safe and free of peril* — **lệch một khoá so với Pāli**. Bản dịch căn đúng Pāli: `1.1` = `Yena yena subhikkhāni` → *Nơi nào thức ăn dồi dào*, `1.2` = `sivāni abhayāni ca` → *an toàn, không hề nguy hiểm*, `1.3` = `Tena puttaka gacchassu` → *Hãy đi đến nơi ấy, con*, `1.4` = `mā sokāpahato bhavā` → *đừng để bị nỗi buồn chinh phục*. Đúng cả bốn. Ba lần lệch chiều của Sujato trong chính lô này là lý do tôi ghi `triangulation` theo Pāli-root chứ không theo Sujato.
  
  **Danh xưng con trong `1.3`.** `puttaka` (con, n diminutive) → *con* ✓ giữ được sắc thái thân mật. `gacchassu` (thứ tự 2 ngôi của √gam) → *Hãy đi* ✓ mệnh lệnh.
  
  **`mā sokāpahato bhavā` → *đừng để bị nỗi buồn chinh phục*.** `mā` (cấm) → *đừng* ✓; `bhavā` (thứ tự 2 ngôi của √bhū, khẩu ngữ) → *hãy/đừng để* ✓; `sokāpahata` (bị chinh phục) → *bị nỗi buồn chinh phục* ✓. Đúng cả ba lớp.
  
  **Điểm làm phẳng nhẹ ở `1.2`.** Pāli `sivāni abhayāni` là hai từ: `siva` (dễ chịu, an lành) và `abhayā` (không sợ hãi, an toàn). Bản dịch gộp thành *an toàn, không hề nguy hiểm* — vế sau là `abhayāni` đúng, nhưng `sivāni` bị nâng lên thành *an toàn* nên nghĩa "dễ chịu / an lành" mất. Chỉ là làm phẳng, không sai ý; tôi trừ nhẹ ở `semantic_fidelity`.
  
  **`brahantampi` ở `1.4` → *dù lớn*.** `brahantampi` (dù rất lớn) và `vanappati` (chúa rừng, tức voi) → *dù lớn, dù là chúa rừng*. Bản dịch giữ *chúa rừng* thay vì dịch thẳng *voi*, là cách diễn đạt đúng ý danh xưng; Sujato cũng dịch *even the enormous lord of the forest*.
  
  **Tầng Anh** có mặt đủ bốn vế.
