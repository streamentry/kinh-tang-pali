notes: |-
  Tiền lệ đếm được: `saṇha` → nhiễm ô (124 tiền lệ); `sakhila` + `bhāṇi` → nói dối trá (nói dối 442 tiền lệ); `kira` → quả thật; `tiṇa` → rơm (rơm 48 tiền lệ); `hara` → lấy đi; `nikkhasata` → làng (làng 520 tiền lệ, riêng chữ này 0 tiền lệ nên ghi đây).
  `Kuhaka` là đạo sĩ tóc bệt — Cowell 89 kể đúng chuyện đó: kẻ đạo sĩ tóc bệt lừa ông tên chúa làng lấy vàng, rồi bịa cớ có một cọng rơm dính vào tóc để trả lại. Vì vậy tiêu đề đặt theo nghĩa chữ là Kinh Kẻ Tóc Bệt. Cowell 89 dịch bộ vế KHÁC (How plausible the story that the rascal told!). Bản Việt dịch đúng bộ vế ở Pāli root.
  BẤT ĐỊNH thật sự ở 1.4 `no ca nikkhasataṁ haran`: có thể đọc là phủ định thật (ta không lấy gì của làng) hoặc là chính `no ca` đóng vai trò từ đối lập (vậy mà vẫn lấy). Truyện Cowell cho thấy kẻ này đã lấy vàng, nên tôi chọn cách đọc thứ hai và dịch là vậy mà lại lấy của làng; alternative reading đã ghi.
  `Tiṇamatte asajjittho` (1.3) không tách được — matte có thể là at (vì) + matte (lượng) hoặc mattā (nghĩ); tôi dịch theo nghĩa chắc chắn duy nhất là kẻ bày ra vẻ cứ chỉnh về rơm, và không suy đoán thêm.
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. 0.1 Jātaka giữ nguyên (58 bài đã có) và 0.2 Ekakanipāta → Bộ Một Bài Kinh (57 bài) theo tiền lệ đếm được. 1.1 mở nháy kép, 1.4 đóng nháy kép + dấu chấm, không giữ `ti.` (tiền lệ 51/57 bài; 10 bài mới hơn cũng bỏ). Dòng kết 2.1 dùng dấu phẩy (Kinh X, thứ N) theo làn sóng gần nhất ja108…ja119; kho còn 48 bài không dấu phẩy — ghi ở đây để biên tập chuẩn hoá sau, tôi không sửa bài ngoài lát. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Chú giải Jātaka-aṭṭhakathā bằng Pāli không truy cập được trong môi trường dịch này, nên bối cảnh lấy từ truyện E. B. Cowell, The Jātaka vol. I (bản 1895, tải từ archive.org); đây là lý do triangulation không lên cao. technical_integrity 10.0 căn cứ chốt _hvi.py đã pass và tự chạy lại script kiểm bổ sung (9/9 khoá khớp Pāli, NFC, ngoặc kép cân trên cả bài, không lệch dấu lược); npm run validate|test|build không chạy theo lệnh cấm của lát.
