notes: |-
  Đợt 19, làn 89. Dịch từ Pāli root commit đã ghim, đủ 126/126 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ mười một của Buddhavaṃsa, về Đức Phật Sumedha: ba lần chứng ngộ và ba kỳ hội chúng, tiền thân thanh niên Uttara dâng cúng hết tám mươi koṭi tài sản, quy y, xuất gia và được thọ ký, học kinh luật rồi sinh lên cõi Phạm thiên, gia thế, ra đi bằng xe voi, chuyển bánh xe Pháp, các đệ tử và thị giả, thân lượng, hào quang, tuổi thọ, nhập Niết-bàn và xá lợi. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các phẩm anh em (16/16 tiền lệ).
  - `0.2` “13. Dòng Kế Thừa Của Đức Phật Sumedha”: cùng khuôn với `bv10:0.2`, `bv15:0.2`, `bv18:0.2`; số “13.” là số ghi trong tiêu đề Pāli.
  - `32.1` “Dòng kế thừa của Đức Thế Tôn Sumedha là thứ mười một.”: `ekādasamo` = 11, khớp thứ tự phẩm (`bv15:28.1` thứ mười ba, `bv10:30.1` thứ tám).

  **Số Pāli, đã tự tính.** `tīṇi`/`tayo` 3 (4.1 ba lần chứng ngộ khớp ba khoá `4.4`, `5.4`, `6.4` = thứ nhất, thứ hai, thứ ba; 7.1 ba kỳ hội chúng khớp ba số ở `8.4`, `9.3`, `10.3`; 19.4 ba lâu đài khớp ba tên ở 19.3 là Sucanda, Kañcana, Sirivaḍḍha). `koṭisatasahassa` = 100 × 1.000 koṭi = **một trăm ngàn koṭi** (4.3), `navutikoṭisahassa` = 90 × 1.000 = **chín mươi ngàn koṭi** (5.3), `asītikoṭisahassa` = 80 × 1.000 = **tám mươi ngàn koṭi** (6.3); cùng cách tính `bv15:3.3`, `bv15:5.3`, `bv15:6.3`. `satakoṭiyo` = **một trăm koṭi** (8.4), `navutikoṭī` = **chín mươi koṭi** (9.3), `asītikoṭī` = **tám mươi koṭi** (10.3), `asītikoṭiyo` = **tám mươi koṭi** (11.3; giữ nguyên đơn vị koṭi như toàn phẩm bv, không quy đổi). `navavassasahassa` 9 × 1.000 = **9.000 năm** (19.1). `aṭṭhāsīti` = 8 + 80 = **88** ratana (26.1; giữ nguyên chữ ratana như `bv10:24.1`, `bv18:21.1`, `bv20:22.1`). `navutivassasahassa` = 90 × 1.000 = **90.000 năm** (28.1). `yojana` = **một do-tuần** (27.2, 27.4). `dasapāramī` 10 (15.4). `caturo` 4 (21.1). `navaṅga` 9 (16.2, “chín phần”). `tevijja` 3 và `chaḷabhiññā` 6 (29.1, “ba minh và sáu thắng trí”). `anūnakaṁ aḍḍhamāsaṁ` = không thiếu + nửa tháng = **đủ nửa tháng** (21.3; cùng khuôn `bv10:19.3` “Đủ tám tháng”, `bv18:16.3` “Đủ mười tháng”). `ekādasamo` **11** (32.1). Thang lớn nhân cả số đã tích lũy, không nhân riêng chữ số đứng trước.
  - `Tiṁsakappasahassamhi` (13.3) là cụm **chưa phân xử được**: cấu tạo đầy đủ tiṁsa 3 × kappa 100 × sahassa 1.000 = 300.000, còn cách đọc “ba mươi ngàn kiếp” coi `kappasahassa` là “ngàn kiếp”. Tầng Anh đã ghim không có bản nào và toàn tầng Pāli chỉ có một dạng này, nên không có chứng cứ độc lập. Tôi dịch theo ngữ cảnh “Sau ba mươi ngàn kiếp nữa,” (lời thọ ký tương lai, `bhavissati`, nên dùng “nữa” như `bv15:12.3`, `bv17:10.3`, `bv10:13.3`; trong tầng, dạng này ở các khoá thọ ký `tha-ap486:22.1`, `tha-ap553:21.1`, `tha-ap401:21.1` là 3/3). Về con số: 19 khoá trùng Pāli trong tầng (đếm theo khoá) cho 17 khoá “ba mươi ngàn”, 1 khoá “ba nghìn” (`tha-ap151:3.1`) và 1 khoá “ba trăm nghìn” (`tha-ap109:10.1`); tôi theo đa số nhưng **không** tuyên bố đã xác lập giá trị. Người biên tập cần phán nếu muốn chọn 3.000, 30.000 hay 300.000.
  - `Tisoḷasasahassāni` (20.1) là cấu tạo **chưa phân xử được**: tiền lệ duy nhất `bv18:15.1` dịch sát chữ “Ba lần mười sáu ngàn” và không quy đổi; tôi dùng đúng nguyên văn tiền lệ đó, **không** tự tính. Nếu đọc theo lối cộng như `ticattārīsa` (3 + 40 = 43, `bv17:15.1` “Bốn mươi ba ngàn”) sẽ ra 19.000, còn nếu đọc theo lối nhân thì 3 × 16.000 = 48.000; Pāli ghim không phân xử, nên giữ nguyên dạng chữ.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã publish và draft (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 65 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 1.501 cặp, trong đó 77 cặp có Việt khác bản tôi viết; 59 khoá dùng đúng nguyên văn một tiền lệ. Cặp khác tập trung ở `13.3` (19 cặp, 19 khác; xem phần bất định), `14.2` (1.001 cặp, 27 khác; dạng `…` của `…pe…` là 974/1.001), `20.2` (20 cặp, 3 khác), `11.1` (16 cặp, 4 khác), `10.4` (8 cặp, 5 khác, chỉ khác dấu cuối `;`/`.` — Pāli ở đây kết `.` nên giữ `.`), `3.4` (6 cặp, 3 khác, chỉ khác chủ ngữ “Ngài đã” và dấu cuối), còn lại là các khoá lẻ khác dấu cuối hoặc có đúng 1 tiền lệ lệch.
  - Dùng lại đúng nguyên văn một tiền lệ: 59 khoá — `0.1`, `2.1`, `2.2`, `3.4`, `4.2`, `4.3`, `4.4`, `5.3`, `5.4`, `6.3`, `6.4`, `7.1`, `7.3`, `7.4`, `9.3`, `9.4`, `10.3`, `10.4`, `11.1`, `13.1`, `13.4`, `14.1`–`14.3`, `15.1`–`15.4`, `16.1`, `16.2`, `16.4`, `17.1`, `17.3`, `17.4`, `18.2`, `19.1`, `19.2`, `19.4`, `20.1`, `20.2`, `21.1`, `21.2`, `21.4`, `22.1`, `22.3`, `23.2`, `24.2`, `24.3`, `25.2`, `25.4`, `26.2`, `26.3`, `27.4`, `28.1`–`28.4`, `31.3`, `31.4`.
  - Các khoá có Pāli trùng nhưng tôi cố ý khác tiền lệ lẻ: `7.2`, `18.4`, `23.4` (`sumedhassa mahesino`): tiền lệ duy nhất là `tha-ap450:2.2` “là bậc đại hiền tri Sumedha;”; tôi theo khuôn của toàn phẩm bv, nơi `mahesi` luôn là “bậc Đại Ẩn Sĩ” (`bv10:6.2`, `bv10:16.4`, `bv10:21.4` “của Paduma, bậc Đại Ẩn Sĩ.”). `11.3` (`Asītikoṭiyo mayhaṁ`): tiền lệ duy nhất `tha-ap431:7.1` “Tôi có tám trăm triệu” quy koṭi ra triệu; tôi giữ “koṭi” như `tha-ap5:22.3` “Bỏ lại tám mươi koṭi” và cả phẩm bv. `22.2` giữ “thế gian” viết thường như `bv10:20.2`.
  - Trùng nguyên văn **trong chính bài**: 2 nhóm — `sumedhassa mahesino` (`7.2`, `18.4`, `23.4`) và `Sudassanaṁ nāma nagaraṁ,` (`8.1`, `18.1`). Nhóm thứ nhất: `18.4` và `23.4` cùng Việt “của Sumedha, bậc Đại Ẩn Sĩ.”, riêng `7.2` là “nơi Sumedha, bậc Đại Ẩn Sĩ;” vì đứng sau `Sannipātā tayo āsuṁ` (cùng khuôn `bv10:6.2` “nơi Paduma, bậc Đại Ẩn Sĩ;”) còn hai khoá kia chỉ sở hữu của cha mẹ và thị giả. Nhóm thứ hai: cùng Việt “Thành phố tên là Sudassana,”. Số cặp trùng trong bài mà Việt khác: 1 (`7.2`), vì khác vị trí cú pháp như trên.

  **Thuật ngữ, kèm số đếm.**
  - `dasabalo` → “bậc Mười Lực”: toàn tầng 14 khoá “Mười Lực”/“Bậc Mười Lực” so với 2 khoá “Thập Lực”; chọn đa số.
  - `yakkha` → “dạ-xoa” (284 khoá “dạ-xoa”/“Dạ-xoa” so với 14 “dạ xoa”).
  - `catusacca` → “bốn chân lý” (đa số trong các khoá `tha-ap` cùng dạng; có cả “bốn sự thật”, “Bốn Thánh Đế”).
  - `nirūpadhī` → “không còn sanh y” (5/5 khoá tầng).
  - `ñāṇāloka` → “ánh sáng trí tuệ” (`tha-ap395:2.3`, `mil3.1.15`).
  - `ratana` (đơn vị) → giữ nguyên “ratana” (3/3 phẩm bv: `bv10`, `bv18`, `bv20`).
  - `tevijja` → “ba minh” (`mn56:29.34`).
  - `kathinatthate` → “khi y kathina đã được trải” (`bv10:7.1` “Vào lúc trải y kathina”; “kathina” giữ nguyên chữ).
  - `sutta` + `vinaya` → “kinh lẫn luật”; `navaṅgaṁ satthusāsanaṁ` → “lời dạy chín phần của bậc Đạo Sư”: dùng đúng nguyên văn `bv20:12.1`, `bv20:12.2`.
  - Tên riêng giữ chữ Pāli có dấu: Sumedha, Padumuttara, Sudassana, Kumbhakaṇṇa, Devakūṭa, Uttara, Sudatta, Sudattā, Sucanda, Kañcana, Sirivaḍḍha, Sumanā, Punabbasu, Saraṇa, Sabbakāma, Sāgara, Rāmā, Surāmā, Mahānīpa, Uruvelā, Yasavā, Yasodharā, Sirimā, Medhārāma, Sudassanuyyāna (cùng khuôn `bv10:20.4` “Dhanañcuyyāna”).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `13.3` `Tiṁsakappasahassamhi` và `20.1` `Tisoḷasasahassāni`: xem mục số Pāli ở trên.
  2. `17.2` `Nisajjaṭṭhānacaṅkame`: đọc là `nisajjā` (ngồi) + `ṭhāna` (đứng) + `caṅkama` (kinh hành), dịch “khi ngồi, đứng và kinh hành” theo bộ ba oai nghi quen thuộc. Cách đọc khác: `nisajja-ṭṭhāna-caṅkame` là “ở chỗ ngồi và chỗ kinh hành”. Tầng Việt không có tiền lệ cho dạng ghép này (0 khoá khác).
  3. `9.1`–`9.2` `devakūṭe bhikkhūnaṁ kathinatthate`: `Devakūṭa` được hiểu là tên một nơi (giữ nguyên chữ, như “Sudassana”); cách đọc khác: nghĩa đen “đỉnh (núi) của chư thiên”. `kathinatthate` là định vị tuyệt đối “khi y kathina đã được trải cho các tỳ-kheo”.
  4. `5.1`–`5.2` `kumbhakaṇṇaṁ yakkhaṁ so damayī jino`: `yakkhaṁ` đồng vị với `kumbhakaṇṇaṁ`, `so jino` là chủ ngữ; dịch “Lại nữa, Kumbhakaṇṇa, / dạ-xoa, bậc Chiến Thắng ấy đã điều phục;”. Không thêm “vị” hay “mà”.
  5. `8.1`–`8.4` `Sudassanaṁ nāma nagaraṁ upagañchi jino yadā`: `nagaraṁ` là tân ngữ của `upagañchi`, nên “Thành phố tên là Sudassana, / khi bậc Chiến Thắng đã đến;” (đúng khuôn `18.1`); `satakoṭiyo` là chủ ngữ của `samiṁsu`, “một trăm koṭi đã tụ hội” (Pāli không có danh từ sau koṭi; không thêm “vị” như `bv8:9.4` “một trăm koṭi vị A-la-hán” vì ở đó Pāli có `arahantā`).
  6. `27.1`–`27.4` `Cakkavattimaṇī nāma … tassa ratanaṁ`: `ratanaṁ` ở 27.3 có thể là “bảo vật/châu báu” hoặc chỉ riêng thân Ngài (cf. `bv7:28.1` “Thân ấy tựa như châu báu”); dịch “bảo vật của Ngài”, không chỉ định thêm. `nāma` ở 27.1 chỉ dùng để gọi tên viên ngọc, dịch “viên ngọc Chuyển Luân kia”. `samantā pharati yojanaṁ` dùng đúng nguyên văn `bv7:25.4`.
  7. `29.1`–`29.4` `Tevijjachaḷabhiññehi balappattehi tādihi / Samākulamidaṁ āsi arahantehi sādhuhi`: ba cụm công cụ cách cùng chỉ một tập các bậc A-la-hán; dịch “Những bậc có ba minh và sáu thắng trí, / đã đạt được các lực, bất động như vậy; / Nơi này đã đông kín / các bậc A-la-hán hiền thiện.” `idaṁ` không nêu danh từ nên dịch “Nơi này”; cách đọc khác: “thế gian này” hoặc “hội chúng này”. `sādhu` dịch “hiền thiện” (có thể là “tốt lành”).
  8. `25.1` `Uruvelā yasavā ca`: đọc là hai tên (Uruvelā và Yasavā) vì đi với `ahesuṁ aggupaṭṭhakā` (số nhiều), như `bv7:23.3` “Sirīmā và Yasavatī”. Cách đọc khác: `yasavā` là tính từ “có danh tiếng” bổ nghĩa cho Uruvelā.
  9. `21.3` `anūnakaṁ aḍḍhamāsaṁ`: dịch “Đủ nửa tháng,” (không thiếu nửa tháng); Pāli ghim là `aḍḍhamāsaṁ`, không phải `aṭṭhamāsaṁ`, nên không đọc thành “tám tháng”.
  10. `2.4` `bahū mocesi bandhanā`: `bahū` đứng một mình (nam số nhiều); “người” lấy từ `sabbasattānaṁ` ở 2.3 (“chúng sinh”). Dịch “nhiều người”, không thêm “chúng sinh” cho 2.4.
  11. `3.1`–`3.4` `Yadā buddho pāpuṇitvā`: `buddho` dịch “Đức Phật” làm chủ ngữ; `pāpuṇitvā` “sau khi đạt được” dẫn `kevalaṁ bodhimuttamaṁ` (“giác ngộ trọn vẹn tối thượng”, cùng khuôn `bv8:2.3`); `dhammacakkaṁ pavattayi` dùng đúng nguyên văn tiền lệ.
  12. `12.3`–`12.4` `saraṇaṁ tassupagañchiṁ … pabbajjañcābhirocayiṁ`: “quy y vị ấy” và “ưa thích việc xuất gia”; `abhirocayiṁ` có thể mạnh hơn (“tán thành, mong muốn”); không thêm hành động xuất gia thực sự vì Pāli chỉ nói “ưa thích”.
  13. `13.2` `karonto anumodanaṁ`: dịch “khi tùy hỷ;” (tầng Việt không có tiền lệ cho dạng này, 0 khoá khác); cách đọc khác: “khi nói lời tùy hỷ”.
  14. `11.2` `uttaro nāma māṇavo`: `māṇava` dịch “chàng thanh niên” (tầng có “thanh niên” ở `mn95:12.2`); có thể là con trai Bà-la-môn trẻ.
  15. `30.4` `nibbutā te mahāyasā`: “các vị ấy, những bậc có danh tiếng lớn, đã nhập Niết-bàn.” (chủ ngữ số nhiều chỉ các A-la-hán, không phải riêng Sumedha, vì Sumedha nhập Niết-bàn ở 31.2).
  16. Nháy: cả bài là một lời kể mở ở `1.1` và đóng ở `31.4` (`padesato”ti`); nháy đơn của lời thọ ký mở ở `13.3` và đóng ở `14.3`, nằm trong đó. `14.2` `…pe…` giữ đúng một `…`; đoạn lược che phần giữa nên không thêm người nói (cùng cách xử lý ở `bv10`, `bv15`, `bv17`, `bv18`, `bv20`).

