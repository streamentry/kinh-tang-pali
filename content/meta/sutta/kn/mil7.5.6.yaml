notes: |-
  JARASIṄGĀLA, TÔI CHỌN KHÁC MỘT TỆP ĐÃ MERGE — LÝ DO ĐẾM ĐƯỢC. jarasiṅgāla là chó rừng già: dn24:2.6.10, dn24:2.6.11, dn24:2.7.1, sn17.8:1.3, sn17.8:1.5, sn20.11:1.2, sn20.11:1.4, sn20.12:1.2, sn20.12:1.4, an3.64:11.2 — 10 khoá ở 6 tệp — đều dịch là con chó rừng già. Riêng mil7.6.9 (4 khoá trong 1 tệp) dịch là con rắn. Tôi theo đa số 10:1 và theo cả nghĩa của ví dụ (con chó rừng già ăn xong bò thẳng tới chỗ người ta, ăn nắm thức ăn dưa trong tay ta). Người biên tập nên sửa mil7.6.9 cho khớp.

  VĂN XƯNG VÀ TIÊU ĐỀ THEO BÀI LÂN CẬN. mil7.5.5 ngay trước bài này dùng Thưa tôn giả Nāgasena, này Đại vương, và 0.2 là Câu hỏi về cách dùng dẫn với ví dụ; tôi dùng lại cả hai. 5.4 có Pāli trùng byte-for-byte với mil7.5.1:1.5, mil7.5.3:1.5, mil7.5.4:1.5 nên tôi dùng nguyên văn Trưởng lão Upasena, con trai Vanganta, đã nói:—. 2.2 (gāmaṁ piṇḍāya pāvisiṁ) trùng với thag2.39:1.4 nên tôi dùng lại nguyên văn đi vào làng khất thực. Upacikāvagga → Phẩm Con Mối theo mil7.5.1, mil7.5.4, mil7.5.5.

  yoginā yogāvacarena → người hành trì (10 khoá / 8 tệp mil; mil7.5.5 cũng dùng). sarīrayāpana → bốn thứ (1 tệp mil đã có); tôi không chú thích y phục, thức ăn khất thực, chỗ ở, thuốc men trong thân kinh vì bài 5.1 của mil5.4.9 không phải nơi tra và tên phẩm không đòi.

  BỤNG CHẾT: BA VẾ CÒN LẠI CỦA BÀI 6.1 đến 6.6 LÀ BÀ KỆ KHÓ. 6.2 nāññaṁ patthe rasaṁ bahuṁ tôi dịch theo nghĩa chữ là vị ấy biết con đường, vị ấy biết nhiều vị ngon. 6.3 Rasesu anugiddhassa: anugiddha có thể là nếm trộm hoặc đã nếm no; tôi chọn Khi đã nếm no các vị ngon ấy, vì cặp với 6.4 jhāne na ramate mano thì nghĩa là người đã no vị mà tâm không thích thiền định. 6.6 sāmaññaṁ paripūratī tôi dịch là sự tỏ ra vẻ đẹp của hạnh pháp là đầy đủ, theo nghĩa chữ của sāmañña. Cả ba vế này không có tiền lệ trong kho và không có bản Anh; người biên tập xét lại được.

  DẤU LƯỢC. Bài không có dấu lược nào; bản Việt cũng không có.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.

