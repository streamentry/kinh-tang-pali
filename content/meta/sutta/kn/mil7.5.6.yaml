notes: |-
  JARASIṄGĀLA, TÔI CHỌN KHÁC MỘT TỆP ĐÃ MERGE — LÝ DO ĐẾM ĐƯỢC. jarasiṅgāla là chó rừng già: dn24:2.6.10, dn24:2.6.11, dn24:2.7.1, sn17.8:1.3, sn17.8:1.5, sn20.11:1.2, sn20.11:1.4, sn20.12:1.2, sn20.12:1.4, an3.64:11.2 — 10 khoá ở 6 tệp — đều dịch là con chó rừng già. Riêng mil7.6.9 (4 khoá trong 1 tệp) dịch là con rắn. Tôi theo đa số 10:1 và theo cả nghĩa của ví dụ (con chó rừng già ăn xong bò thẳng tới chỗ người ta, ăn nắm thức ăn dưa trong tay ta). Người biên tập nên sửa mil7.6.9 cho khớp.

  VĂN XƯNG VÀ TIÊU ĐỀ THEO BÀI LÂN CẬN. mil7.5.5 ngay trước bài này dùng Thưa tôn giả Nāgasena, này Đại vương, và 0.2 là Câu hỏi về cách dùng dẫn với ví dụ; tôi dùng lại cả hai. 5.4 có Pāli trùng byte-for-byte với mil7.5.1:1.5, mil7.5.3:1.5, mil7.5.4:1.5 nên tôi dùng nguyên văn Trưởng lão Upasena, con trai Vanganta, đã nói:—. 2.2 (gāmaṁ piṇḍāya pāvisiṁ) trùng với thag2.39:1.4 nên tôi dùng lại nguyên văn đi vào làng khất thực. Upacikāvagga → Phẩm Con Mối theo mil7.5.1, mil7.5.4, mil7.5.5.

  yoginā yogāvacarena → người hành trì (10 khoá / 8 tệp mil; mil7.5.5 cũng dùng). sarīrayāpana → bốn thứ (1 tệp mil đã có); tôi không chú thích y phục, thức ăn khất thực, chỗ ở, thuốc men trong thân kinh vì bài 5.1 của mil5.4.9 không phải nơi tra và tên phẩm không đòi.

  BỤNG CHẾT: BA VẾ CÒN LẠI CỦA BÀI 6.1 đến 6.6 LÀ BÀ KỆ KHÓ. 6.2 nāññaṁ patthe rasaṁ bahuṁ tôi dịch theo nghĩa chữ là vị ấy biết con đường, vị ấy biết nhiều vị ngon. 6.3 Rasesu anugiddhassa: anugiddha có thể là nếm trộm hoặc đã nếm no; tôi chọn Khi đã nếm no các vị ngon ấy, vì cặp với 6.4 jhāne na ramate mano thì nghĩa là người đã no vị mà tâm không thích thiền định. 6.6 sāmaññaṁ paripūratī tôi dịch là sự tỏ ra vẻ đẹp của hạnh pháp là đầy đủ, theo nghĩa chữ của sāmañña. Cả ba vế này không có tiền lệ trong kho và không có bản Anh; người biên tập xét lại được.

  DẤU LƯỢC. Bài không có dấu lược nào; bản Việt cũng không có.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.

  STATUS. Hai blocking error ở trên là thật và đo được, nên bài đặt draft bất kể final_score.

  Giải quyết draft 2026-10-12: đọc đối kháng toàn bài từ Pāli (không có bản Anh Sujato, không có tầng Việt hiện hành), rồi viết lại. Mục này THAY THẾ các mục cũ ở trên về văn bản: "BỤNG CHẾT…" (ba vế kệ 6), phần dịch yoginā/sarīrayāpana ("bốn thứ"), và câu "bò thẳng tới chỗ người ta"; các mục còn lại (jarasiṅgāla, tiêu đề, xưng hô) vẫn đúng.

  Khoá đổi: 23 trên 27 khoá thân bài (không đổi: 3.1, 3.3, 4.1, 5.4); trong đó 12 khoá sai hoặc thêm nghĩa thật (1.2, 1.3, 2.1, 2.3, 5.1, 5.2, 6.1–6.6), 11 khoá chỉnh nhẹ hoặc đồng bộ (1.1, 1.4, 1.5, 2.2, 2.4, 3.2, 3.4, 4.2, 4.3, 4.4, 5.3). Lỗi nặng nhất: (1) 1.2 "không chịu lấy gì, cứ bò thẳng tới chỗ người ta" là điều không có trong Pāli: yāvadatthaṁ āharayati = ăn/lấy vừa đủ nhu cầu, song song đúng với sarīrayāpanamattameva paribhuñjitabbaṁ ở 1.3; (2) 1.3 "tự hưởng phần của bốn thứ, không nên mong cầu gì thêm" thêm nghĩa ngoài Pāli, nay là "chỉ nên thọ dụng vừa đủ để nuôi thân", cùng cách dịch sarīrayāpana ở mil7.6.1, mil7.6.10, mil5.3.9; (3) 5.1/5.2/6.1 "thứ sơn thứ cao", "dù thức ăn có sơn" là chữ vô nghĩa: lūkha/paṇīta là thô/ngon, theo an5.235 ("thô hay ngon") và an8.13; vicināti/vicinitabbaṁ = kén chọn, theo mil7.6.1:5.2; (4) kệ 6 đọc hỏng toàn bộ: 6.3 anugiddha = tham mê (theo thag18.1:2.3 rasānugiddho = tham mê vị ngon), không phải "nếm no"; 6.2 "vị ấy biết con đường…" không có trong Pāli, nay là "không nên mong cầu thêm nhiều vị khác"; 6.6 sāmañña = phẩm chất sa-môn (theo dn8:16.5, 16.9), paripūrati = được viên mãn; 6.5 itarītarena = với bất cứ thứ gì (mn77:8.5–8.10, an5.127); 6.1 santusse = nên biết đủ (glossary chấp nhận "biết đủ" và "tri túc", bài này dùng nhất quán "biết đủ"); (5) 2.1 senāsana là chỗ ở (thag18.1:4.1), không phải "chỗ ngủ"; kệ Mahākassapa 2.x–4.x trùng Pāli với thag18.1:4–6: 9 khoá trùng nguyên văn (2.1, 2.3, 3.1, 3.2, 3.3, 4.1, 4.2, 4.3, 4.4) nên dùng lại bản Việt của thag18.1 (xưng "tôi" thay "ta" cũ); 3 khoá lệch chữ (2.2 gāmaṁ thay nagaraṁ: theo thag2.39:1.4 "tôi đi vào làng khất thực"; 2.4 sakkacca naṁ thay sakkaccaṁ taṁ; 3.4 aṅgulipettha thay aṅguli cettha: thêm "ngay cả" cho -pi). 4.4 là lời kết trích dẫn kệ nên chỉ đóng nháy ’ (nháy mở ‘ thừa ở đầu 4.4 cũ đã bỏ); 6.6 đóng ’” khớp Pāli ’”ti. 1.1 sửa "tôn giả đã dạy" thành "đã nói" và "những phần nào"; 1.5 chuyển về dạng "Trưởng lão … đã nói:—" như các bài mil7.5.x lân cận (mil7.5.1, 7.5.4, 7.5.5, 7.5.9); 5.4 giữ nguyên (trùng Pāli với mil7.5.1:1.5, mil7.5.3:1.5, mil7.5.4:1.5).

  Phép đo: Pāli có khoá bằng 32, Việt 32, tập khoá khớp; không có số lượng, không có dấu lược (…) ở cả hai bên; cặp Pāli trùng trong chính bài: 0 (không có phép đo nội bộ để làm); nháy đơn và kép khớp Pāli từng khoá.

  Gỡ blocker: (A) giữ nguyên, đúng sự thật upstream. (B) "Coverage tầng Anh 0/27" đã gỡ: số đúng là 0/9 khoá Pāli có nội dung (1.1–1.5 và 5.1–5.4; con số 27 của tác giả cũ sai), và đó chỉ là hệ quả của (A), không phải lỗi văn bản; content/meta/reference-gaps.yaml đã có mục mil7.5.6 ghi nhận mất mát. Tôi đã đọc kỹ cả 9 khoá từ Pāli, kể cả hai đoạn Sujato trống đáng ngờ nhất (1.2 và 5.2); chúng tự đứng vững nhờ cặp song song 1.2 ↔ 1.3 và 5.1 ↔ 5.2. (C) tầng Việt hiện hành chỉ có Pháp Cú nay không còn là blocker riêng, chỉ là giới hạn tham chiếu (đã nằm trong blocker (A)). triangulation đặt 7.5, không cao hơn 8.0.

  Bất định còn lại (ghi trong notes, không đưa vào thân kinh): āharayati ở 1.2 là dạng lạ của āharati; tôi hiểu là "ăn/lấy dùng" (song song với paribhuñjitabbaṁ ở 1.3), nhưng nghĩa "mang đi" không loại trừ hẳn. sampannaṁ vā asampannaṁ vā ở 5.2 tôi dịch sát chữ "đầy đủ hay không đầy đủ"; nghĩa cụ thể (đủ vị/đủ thứ) không phân xử được. 6.2 "bahuṁ" tôi hiểu là tính từ của rasaṁ; nếu là trạng từ thì nghĩa là "mong cầu quá nhiều", khác sắc thái nhưng cùng hướng. "bỏ nắm cơm vào bát" ở 3.3 theo thag18.1:5.3 (Pāli không nói bát; Sujato ở thag18.1 cũng ghi bowl).

  Cổng kỹ thuật: tôi bị cấm chạy npm run validate, npm test, npm run check, npm run build, nên KHÔNG tuyên bố technical gate pass; technical_integrity giữ 9.6. Blocker (A) còn lại nên bài vẫn draft cho tới khi waiver no-upstream-english được người biên tập áp bằng công cụ của kho.
