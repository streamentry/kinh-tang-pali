  **Nháy.** Đã kiểm khớp Pāli từng khoá cho cả bốn loại nháy `“ ” ‘ ’`: 0 khoá lệch trên 347 khoá (tổng 188 dấu nháy trong Pāli). Pāli có thẻ HTML `<b>…</b>` quanh mười bốn danh hiệu ở `59.1`–`72.1`; thẻ không đưa vào bản Việt (không bản Việt nào trong kho giữ thẻ), nháy đơn quanh danh hiệu được giữ.

  **Dấu lược.** Pāli có một khoá `…pe…` (`13.8`), giữ đúng một `…` ở cuối khoá, không mở rộng. Không khoá nào có `(…)` trần. Không khoá nào kết bằng `….`.

  **Lỗi bản nháp đã bắt khi đọc đối kháng Pāli với Việt.** (1) `45.1` ban đầu có "bốn niệm xứ, bốn chánh cần, bốn thần túc" nhưng Pāli ở khoá ấy là một từ ghép không có số, đã bỏ số. (2) `23.3` ban đầu thêm "gồm chư thiên và loài người" sau "dân chúng có sa-môn và bà-la-môn"; Pāli khoá này chỉ có `sassamaṇabrāhmaṇī pajā`, đã bỏ phần thêm. (3) `40.3` đảo thứ tự `obhāseti pabhāseti` so với `29.3`, `29.4` ("chiếu sáng, rọi sáng"), đã sửa. (4) `33.3` dùng "không kinh hãi" cho `acchambhī` trong khi `34.1`, `39.3` dùng "không khiếp sợ" cho `acchambhito`, đã thống nhất. (5) "hoài nghi" → "nghi hoặc" (253 so 83), "hôn trầm và thụy miên" → "hôn trầm" (195 so 9), "bờ bên kia" → "đạt đến chỗ tận cùng" theo tiền lệ (số liệu ở mục thuật ngữ). (6) `81.4` ban đầu viết khác `78.4` cho cùng `aggo buddho bhavissati`, đã thống nhất vế "Đức Phật hẳn là bậc tối thượng". (7) `13.7` ban đầu "có người nọ có một cây xoài" đọc không rõ chủ ngữ, đã sửa. (8) Đếm lại các danh sách bằng cách tách mục ở `7.4`, `17.4`, `5.2`, không lệch.

