notes: |-
  `Anumānapañha`, câu hỏi thứ nhất của `Anumānavagga` (phẩm thứ tư của `Anumānapañha`, Milindapañha). 347 khoá Pāli, đã dịch đủ 347/347 (dịch mới toàn bài), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài có ba phần: lời mở và cuộc đối đáp về việc chưa thấy Đức Phật và chưa thấy các vua đời trước (`1.1`–`4.4`, kết bằng kệ suy luận), lời đáp bằng ví dụ thành phố của người thợ xây (`5.1`–`73.1`: tám cửa hàng của thành Pháp, mười ba bài kệ về cư dân, mười bốn hạng tỳ-kheo), rồi mười chín khổ kệ suy luận và lời kết (`74.1`–`95.1`). Nháy kép của lời Nāgasena chạy theo từng đoạn: `3.5`–`4.4`, `5.2`–`6.3`, rồi mỗi cửa hàng một đoạn (`7.2`–`8.4`, `9.2`–`12.4`, `13.2`–`14.4`, `15.2`–`16.4`, `17.2`–`19.4`, `20.2`–`21.4`, `22.2`–`41.4`, `42.2`–`93.3`); lời hỏi của Milinda tự đóng trong từng khoá.

  **Coverage English (đo thật, không đoán).** Mẫu số = số khoá Pāli có nội dung theo `source/layers.yaml` (từ 40 ký tự, chuẩn hoá khoảng trắng, bỏ khối `:0.x`) = **114** trên 347 khoá. Chữ English có ở tầng đã ghim = **0**, ratio = 0.0000, dưới ngưỡng floor 0.8. Đã tra `source/upstream-manifest.json` (không suy từ tên thư mục): edition `english-sujato` có 4.291 tệp, `sutta/kn/` của nó chỉ có chín sub-collection cp, dhp, iti, ja, kp, snp, thag, thig, ud, và **0** tệp thuộc `kn/mil`; manifest chỉ liệt kê `kn/mil/mil6.4.1_root-pli-ms.json` ở tầng Pāli. Tầng `name/` của edition ấy có hai tên liên quan (`mil-name:202.mil6.4.1` Problems of Inference; `mil-name:201.mil-anumanavagga` Inference) nhưng là tầng tên, không phải tầng segment nên không tính vào coverage. Tầng `vietnamese-current` cũng vắng (26 tệp, toàn Pháp Cú). Lớp lấp `english-project` không có tệp cho uid này (đã kiểm thư mục `content/translation/en/project/sutta/kn/`: các tệp mil hiện có không gồm `mil6.4.1`). Cả ba tầng tham khảo đều vắng nên bài chỉ được dịch từ Pāli root, không được tuyên bố đã đối chiếu English hay Việt hiện hành ở khoá nào; mọi chỗ khó phải tự đứng trên Pāli, ngữ cảnh trong chính bài và tiền lệ nội bộ của tầng Việt đã dịch. Đây là lý do `draft` (xem `blocking_errors`) và `triangulation` giữ ở 7.0.

  **Tiêu đề và ba đầu 0.x.** `0.1` `Milindapañha` giữ nguyên Pāli, theo các bài mil cùng bộ. `0.2` `Anumānavagga` → "Phẩm Suy Luận", đúng cách `mil6.4.2:0.3` (cùng phẩm, cùng Pāli) và theo tầng tên `mil-name:201` "Inference". `0.3` `1. Anumānapañha` → "1. Câu Hỏi Về Suy Luận", viết hoa chữ đầu từng từ như `mil6.4.2:0.4` ("2. Câu Hỏi Về Hạnh Đầu-đà") và `mil6.3.12:0.4`; tầng tên có "Problems of Inference" (`mil-name:202`). Lưu ý: ở bài này `0.2` là phẩm và `0.3` là câu hỏi, còn ở `mil6.4.2` thì `0.2` là `Anumānapañha` ("Câu hỏi về suy luận"), `0.3` là phẩm; tôi theo đúng thứ tự Pāli từng bài. Dòng kết `95.1` → "Câu hỏi về suy luận, thứ nhất." theo khuôn `mil6.4.2:64.1`.

  **Số Pāli, đã tự tính từng cụm.** `cattāro satipaṭṭhānā cattāro sammappadhānā cattāro iddhipādā pañcindriyāni pañca balāni satta bojjhaṅgā ariyo aṭṭhaṅgiko maggo` = 4 + 4 + 4 + 5 + 5 + 7 + 8 (`3.10`, `17.4`), đủ bảy nhóm. Danh sách đã đếm lại bằng cách tách mục và đối từng mục với Pāli: 27 đối tượng ở `7.4` (11 mục đầu từ `aniccasaññā` đến `ānāpānassati`, 10 mục xác chết `uddhumātaka` đến `aṭṭhika`, 4 mục từ bi hỷ xả, 2 mục `maraṇānussati` và `kāyagatāsati` = 11 + 10 + 4 + 2 = 27); 4 quả + 3 thiền chứng = 7 mục ở `13.4`; 4 Thánh đế ở `15.6`; 8 tà (tà kiến đến tà định) + 10 điều làm nôn ra (tham, sân, si, mạn, tà kiến, nghi hoặc, trạo cử, hôn trầm, không hổ thẹn và không ghê sợ, mọi phiền não) = 18 động từ ở `17.4`; 7 châu báu ở `22.4`; 9 loại giới ở `23.2`; 6 loại định ở `25.2`; 4 vô ngại giải ở `33.2`; 7 giác chi ở `40.2`; 9 sự thành tựu ở `42.3`; `navaṅga` = chín phần (`42.2`, `63.1`, `70.1`); `sannaddhapañcāvudho` = năm thứ vũ khí, khớp năm mục (tên, giáo, lao, gươm, dao găm) ở `34.1`; 5 mục giới ở `9.4`; 13 bài kệ ở `46.1`–`58.4` (52 khoá); 14 danh hiệu ở `59.1`–`72.1`; 19 khổ kệ ở `74.1`–`92.4`. `kāraṇasatena kāraṇasahassena …` ở `93.1`: sata = trăm, sahassa = ngàn, viết "hàng trăm … hàng ngàn …" từng cặp, không nhân thành một số. Danh sách nghề nghiệp và dân các xứ ở `5.2`: đã đối từng từ Pāli với từng mục Việt theo thứ tự (95 từ Pāli sau `puthū`), ghép `vammino yodhino` thành một mục "chiến binh mặc giáp" và tách các từ ghép địa danh (`sakkayavanacīnavilātā` thành bốn tên, `koṭumbaramāthurakā` thành hai, `alasandakasmīragandhārā` thành ba). Không có cụm `Tiṁsakappasahassa`, `Ekanavutito` hay các cấu tạo số đã xác lập nào trong bài.

  **Dùng lại nguyên văn.** Dò toàn tầng (dn, mn, sn, an, kn; trừ chính bài này): 36 khoá của bài có Pāli trùng nguyên văn (sau khi bỏ dấu câu và chữ hoa) với khoá đã dịch ở bài khác; 25 khoá bản Việt trùng nguyên văn, 11 khoá Việt khác. Trong 11 khoá khác, 4 khoá chỉ khác ở dấu câu, chữ hoa hoặc nháy (`2.2`, `46.1`, `56.1`, `74.2`) và 7 khoá khác thật, đều có lý do: `9.6` (11 khoá mil cùng Pāli có nhiều cách khác nhau; chọn cách có "bậc Thiên Trung Thiên" theo `mil6.4.2:61.2`); `10.1`, `10.3` (theo `dhp54`, cùng khổ kệ Dhammapada, thay vì `an3.79`); `46.3` (giữ "ly khát ái" thay vì "Vô tham" của `thag7.5`, vì `taṇhā` không phải `lobha`); `51.1` (giữ "bậc trí" cho `dhīrā` để thống nhất trong cả khổ: toàn tầng `dhīrā` → "bậc trí" 106 khoá, "hiền trí" 15 khoá, còn hai tiền lệ trùng nguyên văn `cnd1:34.3`, `snp5.1:34.3` dùng "hiền trí"); `55.1` (lấy "Thiện xảo về" của `thi-ap8:14.1` nhưng giữ "thần túc" thay "như ý túc", xem mục thuật ngữ); `80.2` (giữ "mát mẻ" thay "đã nguội lạnh" của `mn98:11.94` cho thống nhất với `sītībhūta` ở `7.5`; toàn tầng "mát" 19, "mát mẻ" 15, "mát lạnh" 3, "nguội lạnh" 2). Các khoá đã dùng lại đúng nguyên văn tiền lệ: `45.2` (`mil4.1:10.4`, `mil4.3:2.4`: "Về điều này có kệ rằng—"), `46.2` (`an5.38:6.2`, `an6.37:7.2`), `47.2`, `47.3` (`tha-ap420:2.2`, `:2.3`), `50.3` (`tha-ap407:33.3`), `54.1` (`thi-ap8:15.1`). Công thức `idaṁ sāvajjaṁ … idaṁ kaṇhasukkasappaṭibhāgan` ở `27.2` dùng lại nguyên văn `dn18:25.5` ("Đây là có lỗi, đây là không lỗi; đây nên tu tập, đây không nên tu tập; đây thấp kém, đây cao thượng; đây có phần đen, phần trắng và phần đối nghịch"); `abhidhamme abhivinaye uḷārapāmojjo` ở `68.1` dùng lại `dn33:3.3.20`, `dn34:2.3.19` ("rất hoan hỷ đối với Thắng Pháp và Thắng Luật"). Trùng nguyên văn trong chính bài: 11 nhóm; 7 nhóm Việt y hệt (`1.3`/`1.5`, `2.5`/`2.7`, `Seyyathidaṁ` ×7, `kammena taṁ kiṇitvāna` ×3, `Taṁ kissa hetu?` ×3, `dhammanagare vasanti te` ×12, `tathevimaṁ janaṁ disvā` ×2); 4 nhóm Việt khác nhưng chỉ ở dấu câu, nháy, hoặc theo chủ ngữ đã nêu hay chưa (`anumānena ñātabbaṁ` ×7 chỉ khác dấu phẩy; `ratanaṁ vo piḷandhathā’ti` ×2 chỉ khác nháy kép đóng; `anumānena jānanti` ×10: "bằng suy luận mà biết" khi chủ ngữ đã nêu ở dòng trước và "bằng suy luận người ta biết" khi chưa nêu; `aggo buddho bhavissati` ×2: `78.4` có "thì" vì đi sau `yathā`, `81.4` không). Không có cặp trùng nào mà Việt khác do lệch khoá.

  **Xưng hô.** `bhante nāgasena` → "thưa tôn giả Nāgasena" và `mahārāja` → "này Đại vương", theo `mil6.4.2`: trong mil6 "này Đại vương" 537 khoá (cả hoa lẫn thường), "tâu đại vương" 23; "Thưa tôn giả Nāgasena" 135 khoá (cả hoa lẫn thường), "Bạch ngài" 21. Lời đáp ngắn: `Na hi, mahārājā`ti → "Không phải vậy, này Đại vương." (12/23 khoá cùng Pāli trong mil; 7/23 "Không có"); `Na hi, bhante`ti → "Không phải vậy, thưa tôn giả." (65/90 trong mil); `Āma, bhante` → "Vâng, thưa tôn giả" (1/1, `mil6.1.9:7.2`); `Seyyathidaṁ—` → "Như sau đây —" (9/12 toàn tầng, 7/7 trong mil, kể cả `mil6.3.12:4.2`); `Taṁ kissa hetu?` → "Vì cớ sao?" (mil 2/2: `mil5.2.7:3.6`, `mil5.1.1:17.5`; toàn tầng "Vì sao vậy?" 372/582 nhưng 0/2 trong mil). `Katamaṁ taṁ kāraṇaṁ?` → "Lý do ấy là gì?" theo `mil` (1/1).

  **Thuật ngữ, đã đo trên tầng (nêu cả hai số khi phạm vi gần và phạm vi toàn tầng cho đa số khác nhau).**
