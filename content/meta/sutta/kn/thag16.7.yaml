  TIỀN LỆ TRÙNG NGUYÊN VĂN — ĐÃ DÒ. Đo toàn tầng (dn, mn, sn, an, kn), so Pāli bỏ dấu câu và hoa thường, không kể khoá tiêu đề `0.x` và khoá lược: 11 cặp Pāli trùng ở thân kệ, trong đó bản Việt giống 10 (2 trong số đó chỉ khác chữ `và`), khác hẳn 1. Giống: `21.1`, `21.2`, `21.3` dùng lại `thag1.97:1.1`–`1.3` (chỉ bỏ nháy mở vì Pāli bài này không có); `24.4` dùng lại `iti17:3.6`, `ja55:1.6`, `ja56:1.6`, `ja156:2.6` (4/4 cặp, `sự tận diệt mọi kiết sử.”`); `23.2` dùng theo `snp3.6:50.4` (`sợ hãi và khiếp đảm đã được đoạn tận`, giống từng chữ ngoài dấu câu cuối khoá), còn `snp3.7:41.4` và `mn92:28.13` giống ngoài việc bỏ chữ `và`. Khác 1: `thag5.11:3.4` cùng Pāli `pahīnabhayabheravo` nhưng dịch `đã đoạn trừ mọi nỗi sợ hãi kinh hoàng`; tôi theo đa số 3/4 (3 khoá `đã được đoạn tận`). Ngoài ra khoá `21.4` (`idaṁ dutiyābhisecanaṁ.`) gần với `thag1.97:1.4` (`idaṁ dutiyābhisecananti` có `ṁ`/`n” ti` khác chữ cuối) nhưng không trùng nguyên văn nên không tính là cặp trùng; tôi cố ý KHÔNG theo `lần truyền pháp thứ hai của tôi` ở đó (xem bất định). Khoá tiêu đề `0.1`, `0.2`, `0.3`, `0.4` theo khuôn thag: `0.3` `Phẩm Thứ Nhất` (đa số rõ ràng khoá `0.3` cùng Pāli ở iti, thag, cp: hàng chục khoá; ngoại lệ là tiêu đề cũ trong thag1.x).

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `sātatiko` → bền bỉ (`iti81:10.1`, `sn17.10:4.1`: `sātatikaṁ` → bền bỉ; Sujato persistent). Giữ nguyên một cách cho cả 19 khoá (`2.1`, `3.1`, `4.1`–`20.1`).
    · `jhāyati` → thiền định (thag đo riêng: trong 16 khoá thag/thig chứa `jhāy-`, 9 khoá viết `thiền định`, 4 khoá `tu thiền`, 3 khoá dạng khác có chữ `thiền`; `thag7.2:1.4` có `bhaddova jhāyati` dịch chuyên thiền định). `anupādāno` → không chấp thủ (63 khoá chứa `anupādān`, trong đó 15 viết đúng `không chấp thủ`; còn lại là cách diễn đạt khác ở bối cảnh khác).
    · `uñchāpattāgate rato` → vui thích phần vụn rơi trong bát xin ăn (`thag2.18:1.4`, 1 tiền lệ, Pāli `ratā` số nhiều nên không trùng; Sujato happy with the scraps in my bowl).
    · `bhaddo` (`2.1`, `23.1`) → may mắn (Sujato fortunate); chữ chơi với tên `bhaddiyo`, không giải thích thêm trong thân kệ.
    · Các hạnh đầu-đà (đo toàn tầng): `paṁsukūlī` → mặc y phấn tảo (`phấn tảo` 61/87 khoá chứa `paṁsukūl`; `y ráo` 5, `y vá` 1; các khoá `y ráo` nằm ở `an5.162`, `an5.182`, `an5.80`); `piṇḍapātī` → sống nhờ khất thực (`khất thực` 41/45); `tecīvarī` → chỉ dùng ba y (17/17); `sapadānacārī` → đi khất thực tuần tự từng nhà (`từng nhà` 13, `tuần tự` 5, trên 18 khoá chứa `sapadāna`: giữ cả hai nghĩa vì `sapadāna` là không bỏ sót nhà nào); `ekāsanī` → chỉ ăn trong một chỗ ngồi (`an5.188:1.1` chỉ ăn trong một chỗ ngồi; Sujato sitting alone là hiểu khác, Pāli `ekāsana` là một chỗ ngồi để ăn, không phải ngồi một mình); `pattapiṇḍī` → chỉ ăn trong bát khất (`an5.190:1.3`); `khalupacchābhattī` → từ chối thức ăn sau bữa (`an5.189:0.3`); `āraññiko` → sống trong rừng (`rừng` 150/156 khoá chứa `āraññik`); `rukkhamūliko` → ở dưới gốc cây (`gốc cây` 15/15); `abbhokāsī` → ở ngoài trời (`ngoài trời` 70/116); `sosāniko` → ở bãi tha ma (`tha ma` 4/5, `nghĩa địa` 1); `yathāsanthatiko` → nằm ở chỗ nào được trải sẵn (`trải` 4/5; `dn8:14.20`, `dn25:8.18`, `mn113:16-20.4`); `nesajjiko` → chỉ ngồi, không nằm (3 khoá tầng: `không nằm` 1, `ngồi` 1; Pāli `nesajjika` là người không nằm, chỉ ngồi).
    · Phẩm chất: `appiccho` → ít ham muốn (64/94, `thiểu dục` 9, `ít dục` 7); `santuṭṭho` → tri túc (104 so với `biết đủ` 76 trên 216 khoá chứa `santuṭṭh`: đa số `tri túc`, chọn theo đa số dù cả hai đều phổ biến); `pavivitto` → viễn ly (71/83); `asaṁsaṭṭho` → không giao du (15 trên 39 khoá chứa `asaṁsaṭṭh`; `không giao thiệp` 5, `không dính mắc` 5, `không hòa lẫn` 3, `không gần gũi` 2: chọn `không giao du` vì là đa số và hợp nghĩa không giao thiệp với đám đông, đúng với danh sách ít muốn, tri túc, viễn ly); `āraddhavīriyo` → đã khơi dậy tinh tấn (`tinh tấn` 182/219; `an1.205:1.1`, `an1.241:1.1` dịch đã khơi dậy tinh tấn cho cùng dạng).
    · `hatthigīvāya` → trên cổ voi (`thag2.39:1.3`, `dn3:2.7.2`); `sālīnaṁ odano` → cơm gạo ngon (`dn3:2.10.2`, `an5.44:5.3`); `sucimaṁsūpasecana` → chan nước canh thịt tinh khiết (`ja309:2.2`, `ja398:1.2`, `ja451:5.2`, `ja346:3.2`, 4 tiền lệ dịch nước canh thịt tinh khiết hoặc sạch).
    · `maṇḍalipākāra` → tường thành tròn (không tiền lệ cho dạng này; `pākāra` → tường thành, `dn17:1.4.1`); `aṭṭāla` → tháp canh (2/3 khoá tầng); `koṭṭhaka` → cổng lầu (`cổng` 29/37 khoá chứa `koṭṭhak`; ở đây ghép với `aṭṭāla` thành một hợp từ nên dịch cổng lầu); `khaggahattha` → người cầm gươm (hợp từ nghĩa đen cầm gươm trong tay).
    · `uttasa` → hoảng sợ (32 khoá chứa `uttas`; dạng này là động từ phân từ chỉ trạng thái sợ hãi, chọn hoảng sợ để tránh trùng `bhaya` ở `23.2`). `anutrāsī` → không hoảng sợ (`sn11.3:12.2`, `sn3.24:2.3`). `pahīnabhayabheravo` → sợ hãi và khiếp đảm đã được đoạn tận (xem cặp trùng). `vanamoggayha` → đã đi sâu vào rừng (`tha-ap22:15.1` đi sâu vào rừng hoang).
    · `sīlakkhandha` → phần giới (`an10.12:2.2`, `an11.10:2.3`, `an3.143:2.3`: phần giới vô học; `an4.198:10.4` khối giới; chọn phần giới). `bhāvayaṁ` → tu tập. `anupubbena` → tuần tự. `Paṭhamavagga` → Phẩm Thứ Nhất. `0.4` theo khuôn Kinh Kệ Của Trưởng Lão X, giữ nguyên hợp từ tên riêng như `thag1.37:0.4` (`Kumāputtasahāyaka`) và `thag1.28:0.4` (`Jambugāmikaputta`); `24.5` theo khuôn `… Trưởng lão X ….` với tên viết đủ vế (Bhaddiya, con trai của Kāḷigodhā) theo `thag10.6:10.5` (con nhà Vaṅgantā). `godhāya` ở kệ (`2.4`, `23.4`) viết Godhā, `kāḷigodhāya` ở bìa viết Kāḷigodhā (theo `tha-ap45:17.1`; `ud2.10` và `an1.193` viết Kāḷīgodhā, khác một dấu dài).

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `21.2` `sovaṇṇaṁ satarājikaṁ`: tôi dùng lại `thag1.97:1.2` (một trăm đồng vàng), cùng Pāli, và Sujato dịch gần giống (a hundred grains of gold). Nhưng đúng chữ Pāli `satarājika` là có một trăm vạch hoặc đường (rājikā), và đi cặp với `satapalaṁ kaṁsaṁ` rồi `mattikāpattaṁ` (bát đất nung) nên có thể đúng hơn là chiếc bát vàng một trăm đường vân đối lập với chiếc bát đất. Tôi chưa có chứng cứ độc lập (tầng không có bản nào ngoài `thag1.97`) để chốt, nên giữ cách dịch đã có để hai bài nhất quán; số `sata` = 100 đúng ở cả hai cách đọc, chỉ khác vật được đếm. Nếu cần đổi, phải sửa đồng thời `thag1.97:1.2` và `thag16.7:21.2`.
    · `21.4` `dutiyābhisecanaṁ`: tôi dịch lễ quán đảnh thứ hai (abhiseka là lễ rót nước tấn phong, quán đảnh theo cách dịch Phật học Việt cho lễ tấn phong của vua; `an3.13:3.8` dịch abhisekāsā là hy vọng được rót nước lễ; Sujato second initiation). Cách này khác `thag1.97:1.4` (lần truyền pháp thứ hai của tôi), mà tôi cho là xa chữ Pāli hơn (abhiseka không phải truyền pháp). Đây là 1 khoá tôi cố ý không dùng lại tiền lệ, có lý do ở trên. Ý nghĩa: lễ thứ nhất là lễ tấn phong làm vua (hay làm người thế gian có địa vị), lễ thứ hai là nhận chiếc bát đất khi xuất gia; Pāli chỉ nói idaṁ dutiyābhisecanaṁ nên bản Việt không giải thích thêm.
    · `1.1` `Yātaṁ me hatthigīvāya`: `yātaṁ` là phân từ trung tính (đã đi, đã cưỡi) với `me` sở thuộc cách: tôi từng cưỡi. `1.2` `padhāritā`: những y phục mịn đã được mặc (Sujato wearing luxurious clothes, thêm luxurious không có trong Pāli; bản Việt giữ mịn màng).
    · `2.1` `Sojja`: so ajja = hôm nay, vị ấy. Bản Việt giữ vị ấy ngôi thứ ba, và đặt chủ ngữ rõ ràng ở khoá `2.4`, `3.4`, `23.4` (là Bhaddiya, con trai của Godhā) thay vì đảo thành ngôi thứ nhất như Sujato.
    · `22.1` `maṇḍalipākāre`: pākāra là tường thành; `maṇḍali` có thể là tròn hay có nhiều lớp. Tôi dịch tường thành tròn cao, đồng nghĩa với Sujato (citadel with walls so high) khi bỏ chữ tròn; không có tiền lệ cho dạng này nên giữ nghĩa đen.
    · `22.2` `daḷhamaṭṭālakoṭṭhake`: hợp từ dạng vị trí cách; `aṭṭāla` là tháp canh hoặc chòi gác, `koṭṭhaka` có thể là cổng lầu hoặc kho; `mil1:7.2` có cùng hợp từ `daḷhamaṭṭālakoṭṭhake` trong một câu dài (không dùng làm tiền lệ vì câu dài đó dịch cả cụm thành nhiều chữ khác). Tôi chọn cổng lầu, như Sujato (gates).
    · `22.4` `uttasaṁ vihariṁ pure`: tôi sống trong hoảng sợ ngày trước. `pure` là trước đây, đối lập với `sojja` ở kệ 23.
    · Các khoá lược `x.2`–`x.4` của kệ 4–20: Pāli chỉ có `…` và `pe …`; điệp khúc đầy đủ chỉ suy ra được từ kệ 2–3, nên tôi không bung ra. Nếu độc giả muốn biết các câu đó, xem kệ 2–3 và bản Sujato; trong thân kinh chỉ có dấu lược.

