  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá). Lời nói: Pāli mở nháy ở `1.1` và đóng ở `24.4` (`…khayan”ti`), nên toàn bộ 24 bài kệ nằm trong một lời kể của Trưởng lão. Kệ 1 và kệ 21–22 nói ngôi thứ nhất (`me`, `aggahiṁ`, `vihariṁ`); các kệ 2–20 và 23 xưng ngôi thứ ba bằng tên (`bhaddiyo`, `putto godhāya`), chủ ngữ đứng cuối kệ (`sojja bhaddo … putto godhāya bhaddiyo`), nên bản Việt giữ thứ tự Pāli: Hôm nay, vị ấy … / … / là Bhaddiya, con trai của Godhā. Sujato chuyển thành ngôi thứ nhất (Today I am fortunate) ở dòng đầu rồi lại gọi tên ở dòng ba; tôi không đổi ngôi để bám Pāli. Kệ 4–20 mỗi kệ chỉ viết khoá đầu (một hạnh đầu-đà + `sātatiko`), ba khoá còn lại là lược (`…`, `pe …`, `…`) trỏ về điệp khúc của kệ 2–3: bản Việt giữ đúng một `…` ở mỗi khoá lược và KHÔNG bung điệp khúc ra thành văn, khác Sujato. Dòng bìa `24.5` theo khuôn `… Trưởng lão X ….`.

