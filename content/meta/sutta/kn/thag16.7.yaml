    5. Số Pāli (tự tính): `vīsati` (`0.2` `Vīsatinipāta`) = 20 ⇒ Bộ Hai Mươi Bài Kinh (khuôn thag đã dịch, cùng `thig13.1:0.2` và các bài `thag16.x` khác). Số kệ thực của bài là 24, không phải 20: tên bộ chỉ nhóm tên gọi truyền thống, không phải số đếm, nên không sửa. `sata` (`21.1` `satapalaṁ`, `21.2` `satarājikaṁ`) = 100: một trăm lạng, một trăm đồng vàng (theo tiền lệ `thag1.97:1.1`–`1.2`, cùng Pāli, xem bất định). `ti` (`5.1` `Tecīvarī`) = 3 ⇒ chỉ dùng ba y (`tecīvar`: 17/17 khoá tầng viết ba y). `eka` (`7.1` `Ekāsanī`, `ekāsana`) = một chỗ ngồi. `dutiya` (`21.4`) = thứ hai. Không có số nào khác.
