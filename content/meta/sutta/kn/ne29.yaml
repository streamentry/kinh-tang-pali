notes: |-
  BLOCKER THAT — GHI RA, KHONG TU NANG DIEM. Khuddaka Nikāya không có thư mục tầng Anh Sujato
  tại commit đã ghin (kiểm bằng cách liệt kê .cache/.../en/sujato/sutta/kn/ — không có thư mục
  ne), và bilara tại commit đã ghin không có bản Việt hiện hành cho Khuddaka Nikāya (chỉ có
  Pháp Cú). Tức là bài này dịch CHỈ TỪ PĀLI, không có tầng nào độc lập để đối chiếu. Vì vậy
  triangulation chỉ 7.4 và status là draft.

  CHOT KIEM CO CHAY — VA TOI VAN TU KIEM. Ở bài này chốt thật sự chạy: bốn khoá 2.1–2.4 có Pāli
  trên 40 ký tự. Tôi tự quét thêm MỌI khoá (10/10) vì 0.1–0.4 và 1.1 ngắn hơn: đủ, đúng ID, NFC,
  không trùng nguyên văn Pāli, dấu lược khớp (mọi khoá Pāli đều 0 dấu lược nên bản Việt cũng 0),
  nháy kép cân trên cả bài, không còn (…) rỗng.

  PAI TRUNG NGUYEN VAN. `Tasmā rakkhitacittassa, sammāsaṅkappagocaro”ti gāthā` ở 2.1 trùng y
  hệt sáu bài đã có trong tầng; tôi dùng lại NGUYÊN VĂN cả câu. `Paṭiniddesavāra` → *Phần Giải
  Thích* dùng lại nguyên văn (6 lượt ngoài lát). `Sampāta 10` → *Nhóm 10* theo *Nhóm 8* của ne27.
  Kết cục *Nhóm phương thức … đã được vận dụng* theo y hệt ne27, ne28, ne30, ne32, ne34.

  THUAT NGUM DAT MOI, DEM DUOC — DAY LA LY DO TÔI HA DIEM TERMINOLOGY. `vevacana` (0 lượt, đo
  trên toàn tầng) → *ngữ đồng nghĩa*, dùng y hệt ở cả 0.4, 1.1 và 2.5 như một tên; lý do:
  `veca` là lời nói và `vacana` là lời/từ, và ở chính 2.2–2.4 Pāli giải thích `vevacana` bằng
  một danh sách TỪ ĐỒNG NGHĨA của “tâm” (tâm, ý chí hành, thức…), chứ không phải của “nghĩa”.
  Lưu ý tầng Anh lấp của dự án dùng “sense-word” (từ chỉ ý nghĩa) cho cùng chữ — đó là tầng
  riêng, không phải chuẩn cho tầng Việt. `manindriya` (0 lượt) → *căn tâm*; `manāyatana`
  (0 lượt) → *cảnh giới của tâm*; `viññāṇa` → *thức* theo tiền lệ (iti77, iti94, ud1.1).
  `nekkhammasaṅkappo` → *chánh tư duy của sự từ bỏ* (0 lượt cho cụm này).

  SÁU TEN CUA PANNA Ở 2.4 — SÁU DAT MOI TRONG MOT KHOA, KHONG CO TIEN LE NAO (đo trên dn, mn,
  an, sn, kn): paññāsattha → *chỗ quy của trí tuệ*, paññākhagga → *đỉnh cao của trí tuệ*,
  paññāratana → *ngọc quý của trí tuệ*, paññāpajjoto → *ánh sáng của trí tuệ*, paññāpatoda →
  *ngọn đèn của trí tuệ*, paññāpāsāda → *chỗ nương tựa của trí tuệ* (nương tựa có 407 lượt).
  Tôi giữ thành sáu vế khác nhau để không làm phẳng.

  BA BÁT ĐINH CHUA PHAN XU. (1) `Sammādiṭṭhipurekkhāro` ở 2.4: tôi dịc *Chánh kiến chỉ là
  bóng*. `purekkhāra` là bóng/ảnh phản chiếu nhỏ (0 lượt), và đây là cách đọc chữ-gốc của cả
  cụm; nhưng vế giải nghĩa ngay sau lại đưa ra danh sách TỪ ĐỒNG NGHĨA của chánh kiến, không
  giải thích `purekkhāra`, nên chỗ này còn chưa thật sự khép lại. (2) `nekkhamma` ở 2.3 có thể
  là *từ bỏ điều ác* (đọc của tôi) hoặc *tứ pháp* (cattāri nekkhammapatipadā); tôi chọn nghĩa
  *từ bỏ* vì hai vế kế là `abyāpāda` (không gây hại) và `avihiṁsā` (không bạo hại) đều là
  điều KHÔNG LÀM, cùng một chiều. (3) `vijānanā vijānitattaṁ` ở 2.2 là hai dạng của cùng một
  gốc đứng cạnh nhau; tôi giữ cả hai (*sự biết*, *điều đã được biết*) dù có vẻ thừa, vì bỏ
  một vế là bịa rút bớt.
