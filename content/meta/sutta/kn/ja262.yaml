notes: |-
  LÁT NÀY KHÔNG CÓ TẦNG THAM KHẢO NÀO, ĐÃ ĐẾM KHÔNG SUY. Với mười ba bài Jātaka này:
  source/upstream-manifest.json tại commit đã ghim 11c9d708978cde8ba61096d8a75f7ddfb846f639 ghi tầng translation/en/sujato có 4.291
  tệp, trong đó thư mục sutta/kn/ja/ chỉ có 83 tệp, không có tệp nào chứa khoá của bài này; hàm
  upstreamPublishes của kho trả false cho cả mười ba, tức SuttaCentral không phát hành bản Anh nào
  phủ chúng. Tầng translation/vi/phantuananh tại cùng commit chỉ có đúng 26 tệp và toàn bộ là Pháp Cú
  (dhp1-20 … dhp383-423), nên KHÔNG có bản Hòa thượng Thích Minh Châu cho bất kỳ bài Jātaka nào ở đây —
  đây là đặc điểm của bản chụp upstream đã ghi ở chính source/layers.yaml, không phải thiếu sót của
  kho, và cũng không phải lý do để tôi né việc chấm điểm. Bài chỉ đối chiếu được với Pāli root một
  mình, nên triangulation chấm thấp và bài đặt draft.

  COVERAGE KHÔNG PHẢI LÝ DO BLOCK, VÀ TÔI ĐÃ TÍNH LẠI CHO ĐÚNG. Trong mười ba bài này mọi vế kệ
  Jātaka đều ngắn hơn ngưỡng 40 ký tự khai ở source/layers.yaml, và mọi khoá tiêu đề nằm trong khối
  tham chiếu, nên substantiveSegments = 0. Hàm englishCoverageFor trả ratio = 1 khi
  substantiveSegments = 0, và cả validate lẫn tests/unit/translation-store.test.ts đều bỏ qua bài có
  substantiveSegments = 0. Tôi đã chạy hàm đó cho cả mười ba: đều ratio 1.000. Vì vậy tôi KHÔNG ghi
  blocker coverage dưới ngưỡng — ghi thì sẽ là một lỗi đo sai. Blocker thật, duy nhất, là mất hẳn
  tầng tham khảo English.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt mặc định chỉ quét khoá Pāli từ 40
  ký tự trở lên; ở Jātaka mọi vế kệ đều ngắn hơn ngưỡng đó nên phần chốt đó về bản chất KHÔNG chạy.
  Tôi tự quét lại toàn bộ 238 khoá của lát bằng script riêng, đọc thẳng từ tệp đã ghi trên đĩa:
  đủ khoá và không thừa so với Pāli gốc, không rỗng, chuỗi NFC, số dấu lược khớp TỪNG KHOÁ (Pāli có
  …pe… thì Việt đúng một …, Pāli không có thì Việt không có), không có (…) đứng một mình, vị trí
  ngoặc kép mở và đóng khớp PĀLI TỪNG KHOÁ (không chỉ tổng số trên cả bài), ngoặc kép cân trên
  cả bài, không chữ phiên tự, không còn sót thẻ chữ Pāli. Kết quả 0 lỗi trên 238 khoá / 14 bài.

  TÊN PHẨM, ĐÃ ĐO THEO BẢNG CHỐT VÀ THEO TẦNG. Tikanipāta → Bộ Ba Bài Kinh: đếm trên toàn tầng
  Việt TRƯỚC khi lát này ghi, đã có 24 tệp Jātaka và 15 tệp thag3/thig3 dùng đúng cách này, và KHÔNG
  tệp Jātaka nào dùng cách khác; cách Phẩm Ba Pháp chỉ do 50 tệp iti50..iti99 dùng mà tôi không đụng
  tới. Sau khi lát này ghi, con số Jātaka là 37/37. Tôi theo đa số TRONG CHÍNH TÁC PHẨM ĐANG LÀM theo
  BRIEF_VI3 §11, và cũng vì nó khớp song song với hai mục đã chốt là Bộ Một Bài Kinh và Bộ Hai Bài
  Kinh. Người điều phối gộp có thể muốn thống nhất cả tầng iti sau này, nhưng đó không thuộc lát này.
  Saṅkappavagga → Phẩm Suy Nghĩ (trước lát này 7 tệp, không lệch; sau đó 8); Padumavagga → Phẩm Bông
  Sen (trước 1 tệp, không lệch; sau đó 9, và cả chín tệp trong phẩm đều giống nhau); Udapānavagga →
  Phẩm Nước Uống (trước 4 tệp, không lệch; sau đó 8). Dấu uddāna: trước lát này đã đếm 22 tệp có
  dạng Kinh <tên>, thứ <từ>. và 3 tệp không có dấu phẩy; tôi dùng dạng có dấu phẩy, và đã kiểm
  bằng script rằng số thứ tự trong uddāna khớp số đứng trước mặt trong 0.4 của cùng phẩm, không suy
  từ tên uid.

  PĀLI TRÙNG NGUYÊN VĂN, ĐÃ DỰNG CHỈ MỤC BẰNG SCRIPT VÀ ĐÃ DÙNG LẠI. Tôi nạp 5.764 tệp Pāli
  gốc trong cache (bỏ mọi thư mục *.apfs-orphan) và 4.038 tệp Việt dự án, ghép theo khoá, rồi so
  TRÙNG NGUYÊN VĂN có chuẩn hoá hoa thường, khoảng trắng và dấu câu biên. Riêng lát này: 102 khoá
  trùng ở nơi khác; 52 khoá trùng đó đã có bản Việt ở bài khác, và tôi DÙNG LẠI NGUYÊN VĂN 51 khoá
  (39 khoá tiêu đề, 12 khoá thân kệ). Một khoá trong 52 là ngoại lệ có chủ ý: ja264:3.1 trùng nguyên
  văn với sn1.50:11.1, nhưng bản Việt đã có mở ngoặc kép ở đầu khoá trong khi Pāli khoá này không mở,
  nên tôi chép phần chữ và bỏ ngoặc kép thay vì chép y nguyên. Ngoài ra có 8 cả ván bốn vế trùng nguyên
  văn ở bài khác, và cả tám đều chưa có bản Việt để mượn. Trong lát này có 3 khoá trùng
  nguyên văn, đều là ba vế mở đầu lặp lại trong ja265; tôi đã dùng lại đúng một cách dịch cho cả
  hai lần, và script tự kiểm bắt được chỗ lệch nếu có.

  TÊN RIÊNG CÓ DẤU PĀLI, CỐ Ý GIỮ, KHÔNG BỎ DẤU. Jātaka, Tikanipāta, Sakka, Panāda, Missībhāvitthi,
  kāḷi, Jātavedas, Gāṅgā, Yamunā, Kassapa — tất cả giữ đúng dấu Pāli như tầng đang làm; tôi không
  bỏ dấu ở bất kỳ tên nào, kể cả tên không có bản Việt nào để đối chiếu.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  STATUS. Có một blocking error thật (thiếu hẳn tầng tham khảo English Sujato tại commit đã ghim), nên
  bài đặt draft bất kể final_score. Tôi không nâng điểm để né blocker, và cũng không hạ điểm để tỏ ra
  thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có
  tầng tham khảo nào.

  VẾ 2 VÀ VẾ 3 CỦA BÀI NÀY TRÙNG NGUYÊN VĂN VỚI JA263. Tôi dịch một lần rồi dùng lại đúng nguyên
  văn cho cả hai bài, và script tự kiểm sẽ bắt lỗi nếu hai bài lệch nhau. 2.4 ārakā parivajjaye đã có
  sẵn trong tầng ở an3.29:9.2 với dịch hãy tránh xa từ xa, nên tôi dùng lại nguyên văn đó.

  CHỖ CHƯA CHẮC. (1) nāgo ở 1.2 là tiền thưởng, không phải voi và không phải rồng — đây đúng loại đa
  nghĩa đã gây lỗi ở lát khác; ở cung văn này nāga nghĩa là phần thưởng, phần đã tuyên rõ. (2) muduko
  ở 1.1 và trong tên bài: tôi dịch là càng của hắn cùn, dù pāṇi có thể là tay; vì con cua thì càng mới
  đúng nghĩa. (3) 2.3 Sīdanti: tôi dịch là họ xấu hổ, để giữ chủ từ số nhiều của Pāli; từ này còn có
  nghĩa là chìm xuống, thì câu sẽ thành chúng chìm mất khi biết điều ấy — cả hai đều dẫn tới lời can
  ở 2.4. (4) 3.3 Jātavedova saṁ ṭhānaṁ: tôi dịch là chắc chắn nơi ấy, lửa Jātavedas, giữ tên
  thần lửa theo chữ Pāli thay vì dịch thành lửa thiêu.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 14 khoá chênh lệch lớn nhất. Khác nghĩa 12: sửa 12, giữ 0, bất định 3 (1.2, 1.3, 1.4, còn trong số đã sửa). Bản cũ sai nặng nên viết lại 13 khoá (0.4, 1.1–1.4, 2.1–2.4, 3.1, 3.3, 3.4, 4.1; riêng 2.4 chỉ đổi dấu câu cho khớp Pāli). Các lỗi chính: 1.1 `pāṇi muduko` 'càng của hắn cùn' → 'bàn tay mềm mại' (pāṇi là tay, mudu là mềm; Pāli không có chữ nào là cua/càng) và theo đó tiêu đề 0.4, 4.1 'Con Cua Móng Cụt' → 'Bàn Tay Mềm' (tên bài `Mudupāṇi`); 1.2 `nāgo cassa sukārito` 'phần thưởng … đã được tuyên rõ ràng' → 'và con voi được làm cho khéo' (nāga là voi, không có nghĩa phần thưởng; sukārita là làm khéo); 1.3–1.4 `andhakāro ca vasseyya, atha nūna tadā siyā` 'thì chắc chắn hắn sẽ phải chịu bóng tối ấy' → 'và bóng tối đổ mưa, thì hẳn lúc ấy sẽ có' (vasseyya là mưa; câu kết giữ như ja425, 11/11 khoá); 2.1–2.3 `analā mudusambhāsā … sīdanti` 'không phải lời lẽ trong lành … họ xấu hổ' → 'không biết đủ, lời nói dịu ngọt … người ta chìm xuống' (sīdati là chìm); 3.1 `yaṁ etā upasevanti` 'kẻ nào đến gần chúng' → 'người nào những nàng ấy thân cận' (etā là chủ ngữ, yaṁ là tân ngữ; bản cũ đảo chủ–tân); 3.3–3.4 `Jātavedova saṁ ṭhānaṁ … anudahanti naṁ` 'chắc chắn nơi ấy, lửa Jātavedas … làm cho chúng tan tành' → 'như lửa thiêu chính nơi nó trú … họ nhanh chóng thiêu đốt kẻ ấy' (so sánh với lửa; naṁ là số ít). Các khoá 2.1–3.4 nay trùng nguyên văn cách dịch đã có ở ja507:26–28 và ja536:100–102 (cùng Pāli). Bất định còn lại ở câu 1.1–1.4: Pāli ghim không kèm truyện nên không biết ai nói gì; `sukārito` (làm khéo, có thể là huấn luyện/chuẩn bị) và `andhakāro … vasseyya` (bóng tối đổ mưa, hay đêm tối mưa) đọc sát chữ nhất có thể; `tadā siyā` không có tân ngữ. Tiêu đề 0.4/4.1 đã đổi nhưng `translationTitle` trong metadata vẫn là tên cũ, cần đồng bộ. Ngoài lát: ja263:2.3, 3.1, 3.3, 3.4 trùng nguyên Pāli với ja262 và còn nguyên lỗi cũ (cùng 'họ xấu hổ', 'kẻ nào đến gần chúng', 'lửa Jātavedas … chúng tan tành'). Không có bản Anh hay bản Việt độc lập khác; mọi phân xử dựa vào Pāli và tiền lệ nội bộ tầng.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; đoạn song song ja263, ja507,
  ja536 cùng Pāli 2.3–3.4): sửa 4 khoá: 1.2 sukārito "được làm cho khéo" (calque) → "được luyện kỹ";
  1.3 "bóng tối đổ mưa" → "trời tối đổ mưa" (andhakāro … vasseyya, rõ hơn, không đổi nghĩa); 3.2 bỏ
  "dù" và "mong" mà Pāli chandasā vā dhanena vā không có → "hoặc vì ham muốn, hoặc vì của cải" (thống
  nhất với ja263:3.2); 3.4 "kẻ ấy" → "người ấy" thống nhất với ja263:3.4 (cùng Pāli). Bất định 1.1–1.4
  (không có khung truyện, tadā siyā không tân ngữ) giữ nguyên. Ghi cho người biên tập: ja507:28.2 và
  ja536:102.2/102.4 (ngoài lô) còn "dù vì ham muốn hay vì mong của cải" / "kẻ ấy".

  Quyết định hội đồng biên tập 2026-10-16: C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").

  Nghiên cứu nguồn ngoài 2026-10-16: Rouse (Cowell chủ biên, PTS 1897),
  https://obo.genaud.net/dhamma-vinaya/pts/kd/jat/jat.2/jat.2.262.rous.pts.htm; Ānandajoti, bản dịch
  kệ và chú giải Jātaka,
  https://ancient-buddhist-texts.net/Texts-and-Translations/Jatakagathavannana/262.htm; đã đối chiếu
  1.1–1.4, 2.1–2.4, 3.1–3.4; sửa không có khoá nào; bất định 1.1–1.4: câu đố "bốn điều kiện" chú giải
  thừa nhận chưa rõ; bản Việt giữ nghĩa đen.

  Rà từng chữ bằng DPD 2026-10-16: 17 khoá đã rà; sửa 2.3 (`sīdanti`: chủ ngữ là các nàng, chú giải
  CST `sīdantī ti … nimujjanti`, `nan-ti nipātamattaṁ`, Indacanda "các nàng ấy (sẽ) đọa"; đồng bộ với
  ja263:2.3 cùng Pāli → "họ chìm xuống"); bất định: không.
  Lượt hoàn thiện 2026-10-17: thống nhất thuật ngữ: đã rà, không có khoá cần sửa (2.3–3.4 trùng chữ với ja263 cùng Pāli; "họ"/"những nàng ấy" cho `tā`/`etā` là cùng một người được nói đến, giữ như ja263); thêm 6 chú thích (1.1 câu đố của công chúa và bốn điều kiện theo chú giải; 1.2 `sukārito`; 1.4 `tadā siyā` là ước nguyện thành tựu; 2.1 người nói khổ 2–3 và hai cách hiểu `analā`; 2.3 `sīdanti` chìm vào địa ngục, `naṁ` tiểu từ; 3.3 `Jātaveda` là lửa). Các câu sau trong ghi chú cũ đã bị thay: mục đầu "LÁT NÀY KHÔNG CÓ TẦNG THAM KHẢO NÀO…" của lô (bài nay ở `review` theo waiver `no-upstream-english`, blocker vẫn ghi trong hồ sơ); ở lượt 2026-10-14, "người ta chìm xuống" (nay "họ chìm xuống", lượt DPD 2026-10-16), "và con voi được làm cho khéo", "bóng tối đổ mưa", "kẻ ấy" (đã đổi ở lượt 2026-10-15), "`translationTitle` … vẫn là tên cũ, cần đồng bộ" (translationTitle nay là "Kinh Bàn Tay Mềm") và "Pāli ghim không kèm truyện nên không biết ai nói gì"; ở mục nguồn ngoài, "câu đố bốn điều kiện chú giải thừa nhận chưa rõ" (chú giải giải rõ bốn điều kiện và người nói; xem chú thích 1.1–1.4; lời kinh vẫn giữ nghĩa đen).
  Chấm lại độc lập sau rà DPD + kiểm độc lập 2026-10-17: đọc cả 17/17 khoá (13 khoá kệ), đối chiếu chú giải CST K10-JA/262; 0 lỗi nghĩa, 0 lỗi ngữ pháp (khổ 1 câu đố của công chúa, khổ 2–3 lời nhà vua; `sīdanti` chủ ngữ là các nàng; `yaṁ etā upasevanti` đúng chủ–tân). 2.3–3.4 trùng chữ với ja263 cùng Pāli. Không có bản Anh SuttaCentral; đối chiếu chú giải CST, Rouse, Ānandajoti, Indacanda (một phần), DPD → 8,7. 6 chú thích khớp chú giải (bốn điều kiện, `āneñjakāraṇa`, hai cách hiểu `analā`, `Jātaveda`). Văn phong: 1.4 «thì hẳn lúc ấy sẽ có» tối nghĩa nếu không đọc chú thích, 2.4 «tránh xa từ xa» lặp. Kỹ thuật: check.py OK, `validate` qua, `quality:check` không lỗi cho bài; test/check/build không tự chạy nên 9,6.
