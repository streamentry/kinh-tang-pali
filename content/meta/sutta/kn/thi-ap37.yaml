  THUẬT NGỮ — kèm số đếm:
  - bhaddake kappe → hiền kiếp. Đo trên mọi khoá có bhaddakappe hay bhaddake kappe:
    hiền kiếp 7 khoá, kiếp lành 2 khoá. Hai khoá kiếp lành đều là kệ apadāna
    (Imamhi và Imasmiṁ bhaddake kappe, trong đó khoá tha-ap433:1.1 còn lặp chữ
    lành lành); 7 khoá hiền kiếp là văn xuôi. Chọn hiền kiếp là thuật ngữ chuẩn.
  - mahāmune → Đại Mâu-ni (4/4 khoá mahāmune đã dịch đều dùng Đấng Đại Mâu-ni, gồm
    thi-ap31); mahāvīra → Đại Anh Hùng (phạm vi gần tha-ap và thi-ap: Đại Anh Hùng
    8 khoá, Đại Hùng 3 khoá; toàn tầng Đại Anh Hùng 8, Đại Hùng 8, đại hùng 3 — hai
    phạm vi cho đa số khác nhau, chọn theo phạm vi gần và theo thi-ap31). Hai danh
    xưng được giữ khác nhau để không gộp mahāmune với mahāvīra.
  - saddhamma → chánh pháp: 256 khoá chánh pháp so với 11 khoá diệu pháp.
  - sāsane → giáo pháp (45 khoá giáo pháp so với 7 khoá lời dạy), nhưng công thức
    kataṁ buddhassa sāsanaṁ ở 15.3, 16.3 giữ đúng bản dịch dùng chung của tầng,
    lời dạy của Đức Phật (418/454 hit).
  - pātimokkha → giới bổn: Saṁvuto pātimokkhasmiṁ đã có tiền lệ Thu thúc trong giới
    bổn (tha-ap58:6.1, snp2.11:6.1).
  - mattaññū/mattaññunī → biết tiết độ trong ăn uống (dhp185:3, ud4.6:4.3 đều viết
    biết tiết độ trong ăn uống).
  - jāgariya → tỉnh thức; paṭibhāna → biện tài; nirutti → ngôn từ (janapadanirutti
    đã dịch ngôn từ địa phương); cetopariyañāṇa → trí biết tâm người khác (đa số
    trí biết tâm người; tha tâm trí cũng có 2 khoá).
  - pubbenivāsa → các đời sống quá khứ (đa số ở khoá trùng); dibbacakkhu → thiên
    nhãn; dibbāya sotadhātuyā → thiên nhĩ giới (39 khoá thiên nhĩ).
  - seṭṭhi → triệu phú (13 khoá triệu phú so với 10 khoá trưởng giả; chênh lệch
    nhỏ, chọn triệu phú vì khớp dạng gia chủ triệu phú dùng nhiều trong tầng);
    accharā → tiên nữ (8 khoá tiên nữ so với 2 khoá thiên nữ trên các khoá có
    accharā); puruttama → kinh thành tối thượng (7 khoá puruttama: tối thượng 3, tối
    thắng 3, tráng lệ 1).
  - dhutta → kẻ du đãng (du đãng 4 khoá, kẻ ăn chơi 1 khoá; 4 khoá cờ bạc là hợp từ
    itthidhutto/akkhadhutto nên không cùng ngữ cảnh); gaṇikā/gaṇike → kỹ nữ (32
