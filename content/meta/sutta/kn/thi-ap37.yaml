    nhìn; rūpasampadā → đầy đủ sắc đẹp.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - 1.2 brahmabandhu: nghĩa đen là thân quyến của Phạm thiên; trong tầng khoá này
    có một tiền lệ dịch thuộc họ Brāhmaṇa. Giữ nghĩa đen, không đẩy cách hiểu thuộc
    dòng Bà-la-môn vào lời kinh.
  - 3.3–4.1 Pāli lặp ahaṁ hai lần (yuttayogāhaṁ và duṭṭhacittāhaṁ), còn tân ngữ
    bhikkhuniṁ vigatāsavaṁ đứng ở 3.4, xa động từ akkosiṁ ở 4.1. Bản Việt giữ đúng
    thứ tự và dùng đối với để nối tân ngữ, lặp ta hai lần; đây là chỗ đổi cú pháp
    duy nhất, không thêm nội dung.
  - 4.2 gaṇiketi: hô cách của gaṇikā cộng ti, tức là lời mắng này kỹ nữ. Pāli không
    có dấu ngoặc ở khoá này nên bản Việt cũng không có; đã dịch là khi ấy ta đã nói:
    này kỹ nữ.
  - 5.3–5.4–6.1 Bahusova parādhīnā, pacchimāya ca jātiyaṁ rồi Kāsīsu seṭṭhikulajā:
    cụm pacchimāya jātiyaṁ có thể gắn với lệ thuộc người khác (cả đời cuối vẫn lệ
    thuộc) hoặc mở đầu mệnh đề sinh ở Kāsi (đời cuối sinh vào nhà triệu phú). Bản
    Việt giữ dấu phẩy sau và trong đời cuối cùng và để câu liền, nên giữ được cả hai
    cách đọc như Pāli.
  - 6.2 brahmacārībalena: hợp từ có thể đọc là sức mạnh của phạm hạnh (đời tu trước
    kia) hoặc sức mạnh của người sống phạm hạnh. Dịch gọn là nhờ sức mạnh của phạm
    hạnh, không chọn thêm.
  - 8.3 Pubbavāsanasampannā: vāsanā là tập khí quen thuộc từ trước, không phải thuật
    ngữ có nghĩa chính xác trong Pāli root của bài này; giữ nghĩa thông thường là
    tập khí.
  - 9.1 Tadūpasampadatthāya: tad có thể là đại từ chỉ sự thọ cụ túc giới vừa nhắc
    hoặc trạng từ chỉ khi ấy (bản tra cứu toàn văn của Bhikkhu Indacanda đọc theo
    cách sau, Sau đó); dịch theo cách đầu, Vì việc thọ cụ túc giới ấy, và không
    thêm khi ấy hay sau đó vào lời kinh.
  - 9.3 Magge dhutte ṭhite sutvā: ṭhite chỉ dạng đứng, Pāli không nói họ chặn ai; bản
    Việt không thêm chặn hay chờ sẵn.
  - 10.4 gaṇikattañca khepitaṁ: khepita có thể là cạn kiệt hoặc phá bỏ; đã dịch được
    tiêu trừ.
  - 12.4 và 17.1: tái sanh ở 12.4 theo dạng đa số của khoá trùng (4/6 hit; thi-ap5,
    thi-ap16, thag5.4, tha-ap454), dù toàn tầng thuật ngữ punabbhava là tái sinh 85
    khoá so với tái sanh 19 khoá; các chỗ sinh khác trong bài giữ dạng sinh. Người
    biên tập có thể chuẩn hoá một lượt toàn tầng.
  - Đại từ ngôi thứ nhất: bài dùng ta cho người kể xuyên suốt để khớp công thức đã
    chung của tầng ở 14.1, 15.1 (dạng đa số của ta); 17.1 là công thức lời kết nên
    Tôi nghe như vầy là lời người kể, không phải ngôi của vị ni.
  - Công thức lời kết 17.1 Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti: imā gāthāyo
    là số nhiều nên dịch những bài kệ này, theo nhóm đa số (407 khoá những bài kệ
    này so với 21 khoá bài kệ này).

