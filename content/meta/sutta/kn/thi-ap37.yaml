  SỐ PĀLI — tự tính:
  - Bài không có số kiếp, số lượng lớn hay phép nhân nào; các số duy nhất là
    pañca = năm (năm căn, 2.4), catasso = bốn (bốn vô ngại giải, 16.1), sattama =
    thứ bảy (18.1), và số 7 ở :0.3. Máy kiểm số Pāli của kho vì vậy không có gì để
    đo cho bài này — phép đó chạy rỗng, không phải pass.
  - Pāli không có cụm Tiṁsakappasahassa hay bất kỳ cụm số nào chưa phân xử được.

