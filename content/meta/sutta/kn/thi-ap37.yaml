    dịch theo nghĩa Pāli: gaṇikā + -tta = trạng thái là kỹ nữ).
  - akkosati → mắng nhiếc; paccati (apaccisaṁ) → bị nung nấu trong địa ngục, theo
    Kappaṁ nirayamhi paccatī đã có tiền lệ bị nung nấu trong địa ngục.
  - dūtopasampadā → thọ cụ túc giới qua sứ giả (upasampadā → thọ cụ túc giới 69
