notes: |-
  Bài kinh thi-ap37 — Aḍḍhakāsitherīapadāna, bài thứ bảy của Phẩm Khattiya trong
  Therīapadāna. 66/66 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào
  ngoài tập khoá Pāli. Bài kể về một tỳ-kheo-ni từng mắng một vị tỳ-kheo-ni đã hết
  lậu hoặc là kỹ nữ, vì thế chịu quả địa ngục rồi nhiều đời sinh vào thân phận kỹ
  nữ, đến đời cuối vẫn bị đặt vào thân phận ấy, rồi xuất gia, thọ cụ túc giới qua
  sứ giả và chứng quả.

