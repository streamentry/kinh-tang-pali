  - Công thức tiêu đề: đo ở phạm vi gần nhất, 9/9 tệp thi-ap đã dịch :0.3 dùng
    Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni, 0 tệp dùng Tuyên Ngôn hay Ký Sự. Toàn tầng
    tha-ap và thi-ap trong cây hiện tại: Tuyên Ngợ 256 tệp, Tuyên Ngôn 97 tệp,
    Ký Sự 97 tệp. Bài này giữ Tuyên Ngợ cho khớp cả hai phạm vi; nếu người biên
    tập xác định đó là lỗi chính tả thì cần sửa hàng loạt chứ không sửa riêng bài
    này. Tên riêng giữ dạng Aḍḍhakāsi (thig có Aḍḍhakāsitherīgāthā, tên Việt
    Aḍḍhakāsi).
  - Khoá cuối :18.1 là thứ bảy (sattamaṁ): 8/8 tệp thi-ap kề cận có colophon
