notes: |-
  **Phạm vi: đủ 448/448 khoá của cnd19, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Mogharāja (Pārāyana, câu hỏi thứ mười lăm), tức bài kệ `snp5.16`. Cấu trúc như `cnd9`, `cnd17`, `cnd18`, `cnd20`: dẫn từng đoạn kệ (in đậm ở `1`, `23`, `29`, `35`), giải từng cụm, rồi nhắc lại đoạn kệ trong ngoặc kép (`22`, `28`, `34`, `67`). Phần giải chen nhiều đoạn kinh trích nguyên văn: năm loại mắt (`4`–`19`), nghĩa chữ *isi* (`20`–`21`), bài về thế giới bị bào mòn theo `sn35.82` (`36`), năm uẩn vô ngã theo `sn22.59` (`37`–`41`), `sn12.37` (`42`–`43`), `sn22.33` (`49`), bài thế giới trống rỗng theo `ps2.10` (`50`), `sn35.246` (`54`), con nai ở ngoài tầm thợ săn theo `mn25`/`mn26` (`60`–`66`). Pāli có 56 khoá mang thẻ in đậm, bản Việt không mang thẻ. Dấu lược: tổng 97 dấu trên 97 khoá (mỗi khoá một dấu), bản Việt khớp từng khoá (0 lệch): 26 khoá `…pe…` (đều thành đúng một `…`; trong số đó 3 khoá kết `…pe….`, tức `63.1`, `64.1`, `65.1`, thành ` ….`), 70 khoá `…` trần (giữ nguyên một dấu), 1 khoá có `(…)` (`5.3`, giữ nguyên `(…)` ngay trước dấu chấm).

  **Cách trình bày lemma** theo `cnd9`, `cnd10`, `cnd18`, `cnd20`, `cnd21`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Giữ nguyên chữ Pāli ở một chỗ vì lời giải nói về chính hình thức của từ ấy: `Iccā` (`3.2`, đúng nguyên văn `cnd18:8.2`); `upakkhittaka` (`13.3`) đã được dịch sang tiếng Việt từ lượt 2026-10-13, xem bất định 1; cộng các tên loài vật, cây, hoa giữ tên Pāli theo tiền lệ của tầng (`umā`, `kaṇikāra`, `indagopaka`, `ariṭṭhaka`, `udumbara`, `setakaccha`, `pālibhaddaka`; riêng `osadhitārakā` dịch *sao mai*, xem bất định 5), kim sí điểu `Venateyya` theo `ja441`, và tên riêng `Mogharāja`, `Sāriputta`, `Gotama`, `Sakya`, `Māra` (ở công thức *làm Māra mù mắt* theo `mn25`/`mn26`).

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `cnd19`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; cache chỉ có tệp Pāli (root-pli-ms) cho `kn/cnd` và một tệp tên mục. Lớp `english-project` không có `cnd19`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **223** khoá (225 nếu tính cả thẻ); Sujato phủ 0/223 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/223, `vietnamese-current` 0/223. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp5.16` (bài kệ trùng bốn đoạn kệ của Mogharāja) đã được đọc để kiểm cách parse các dòng kệ, nhưng đó là bản của bài khác nên không tính là đối chiếu English của cnd19. Chứng cứ độc lập còn lại là các bản đã dịch của `snp5.16`, `tha-ap542`, `mn25`, `mn26`, `mn108`, `sn22.33`, `sn22.59`, `sn35.82`, `sn35.85`, `sn35.246`, `sn12.37`, `ps2.10`, `an3.80`, `mil5.1.2` và công thức chú giải ở `cnd6`, `cnd9`, `cnd10`, `cnd11`, `cnd12`, `cnd13`, `cnd15`, `cnd16`, `cnd18`, `cnd20`, `cnd21`.

  **Dùng lại tiền lệ.** Đã dò 444 khoá thân bài (bỏ bốn khoá tên `0.x`) theo Pāli bỏ thẻ in đậm, so với toàn tầng đã dịch ngoài bài này: **141 khoá có Pāli trùng nguyên văn** (theo dấu câu) với khoá đã dịch (nguồn: `cnd` 31, `sn` 26, `mn` 24, `snp` 19, `ps` 16, `dn` 10, `dhp` 6, `thag` 4, `tha-ap` 3, `vv` 2); dùng lại nguyên văn **119**, khác **22**. Thêm 67 khoá trùng sau khi bỏ dấu câu và chữ hoa/thường: đọc từng cặp, đa số dùng lại cách dịch cùng nghĩa, chỉ đổi dấu ngắt hoặc nháy theo Pāli từng khoá. 22 khoá khác, kèm lý do:
    - `15.2`–`15.5` kệ Phạm thiên thỉnh Phật (`mn26:20.14`–`20.19`, `mn85:44.14`–`44.19`, `dn14:3.7`, `sn6.1:7`): bốn bản đã dịch xếp nghĩa khác nhau qua các dòng, nên dịch lại theo từng dòng Pāli của khoá này, giữ các cụm chung với `mn26` (*đỉnh núi đá*, *bước lên*, *không còn sầu*, *bị sinh và già chế ngự*); `samantacakkhu` viết *bậc nhìn khắp* theo `cnd9:20.1`, `21.4` thay vì *Toàn Nhãn* của `mn26`, để cùng một từ trong chính bài (`17.2`) không có hai cách dịch.
    - `23.3`, `28.3` (`snp5.16:2.3`): `snp5.16:2.3` dịch *Con không biết được quan điểm*, tức chủ ngữ ngôi thứ nhất. Động từ Pāli là `nābhijānāti` (ngôi thứ ba) và lời giải `26.1` nói rõ chủ ngữ là `loko`: *tuyhaṁ diṭṭhiṁ … loko na jānāti*. Bản này dịch *Không biết quan điểm của Ngài* với chủ ngữ là thế gian (`23.1`–`23.2`), theo Pāli và theo `26.1`. Khoá `tha-ap542:25.3` có Pāli khác (`no nābhijānāmi`, ngôi thứ nhất) nên không cùng trường hợp.
    - `29.1`, `34.1` (`snp5.16:3.1`): `snp5.16:3.1` và `3.2` đổi chỗ hai dòng so với Pāli (dòng Pāli `3.1` `Evaṁ abhikkantadassāviṁ` mang bản dịch *Con đã đến với một câu hỏi*, dòng `3.2` mang *cho bậc có tầm nhìn siêu việt*), giống thứ tự của bản Anh. Bản này giữ đúng thứ tự dòng Pāli, theo `tha-ap542:26.1`–`26.2`.
    - `29.4` so với `33.2`, `35.6`, `66.7` và `34.4` so với `67.6`: cùng Pāli `maccurājā na passati` nhưng `29.4`, `34.4` là vế của câu hỏi `kathaṁ lokaṁ avekkhantaṁ`, nên dịch *để Thần chết không thấy được?* theo `snp5.16:3.4`; các khoá còn lại là câu khẳng định. Đây là khác vị ngữ, không phải lệch khoá.
    - `33.2`, `35.6`, `66.7` (`dhp170:4` *Tử vương*): `snp5.16:3.4`, `snp5.16:4.6`, `tha-ap542:26.4`, `28.2` dùng *Thần chết* cho `maccurājā`, trùng đúng bài kệ này, nên giữ *Thần chết*.
    - `36.5`, `50.3`, `50.2`, `50.24`, `50.4` (`sn35.82`, `sn35.85`): `sn35.85` dịch `attena vā attaniyena vā` là *ở chính nó hay ở cái khác*; `ps2.10` (cùng đoạn kinh) dịch *đối với tự ngã hay cái thuộc về tự ngã*, sát Pāli hơn và trùng với `snp5.16:4.3` (*quan điểm về tự ngã*), nên dùng cách của `ps2.10`.
    - `49.17`, `49.21`, `49.22` (`sn22.33:2.3`, `mn22:41.19`, `mn22:40.2`): chỉ khác dấu chấm sau nháy, hoặc *các thầy* → *các ông* cho thống nhất với `sn22.33` đã dùng ở `49.4`–`49.15`.
    - `48.3`, `49.26` (`mn35:20.13`, `sn23.46:1.6`): `vedanā` viết *thọ* (như cả bài), không *cảm thọ*.
    - `61.1` (`mn38:39.3`): bản `mn38` thêm *nhập và an trú* không có trong Pāli khoá ấy (Pāli kết `…pe…` ngay sau `dutiyaṁ jhānaṁ`); không thêm.
    Đã dò **49 nhóm Pāli trùng nguyên byte trong chính bài** (112 khoá): 47 nhóm cùng một bản Việt, 2 nhóm bản Việt khác nhau, đều thuộc trường hợp `maccurājā na passati` ở trên (vế câu hỏi so với câu khẳng định).

  **Thuật ngữ, kèm số đếm toàn tầng (các bài đã dịch ngoài cnd19).** `kāyassa bhedā paraṁ maraṇā` → *sau khi thân hoại mạng chung* (421 khoá) vs *sau khi chết* 179 (831 khoá có Pāli này). `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ upapannā` → *cõi khổ, ác thú, đọa xứ, địa ngục* (giữ đủ bốn đơn vị; trong 39 khoá có cụm này, 20 khoá ghi *ác thú, đọa xứ, địa ngục* bỏ mất *cõi khổ*, 5 khoá ghi đủ bốn). `hīne paṇīte suvaṇṇe dubbaṇṇe` → *thấp kém … cao quý* (38 và 41 khoá) vs *hạ liệt … cao sang* (7 và 10 khoá). `cavamāne upapajjamāne` → *chết đi và tái sinh* 35 vs *chết và sinh* 5. `sugatiṁ saggaṁ lokaṁ` → *thiện thú, cõi trời* (*cõi trời* 242, *thiện thú* 91, *cõi lành* 108). `kāyaduccaritena samannāgatā` → *thành tựu thân ác hạnh* (*thân ác hạnh* 8 khoá, *thành tựu thân ác hạnh* 5, *có thân hành ác* 3). `micchādiṭṭhikammasamādānā` → *hành động theo tà kiến* 13 vs *chấp hành tà kiến* 3. `ariyānaṁ upavādakā` → *phỉ báng các bậc Thánh* 21 vs *phỉ báng bậc Thánh* 4. `pāsādika` → *khả ái* (57 khoá) vs *đẹp đẽ* 47; `dassaneyya`/`dassanīya` → *dễ nhìn* (`dn4`). `sīlakkhandha`… `vimuttiñāṇadassanakkhandha` → *giới uẩn … giải thoát tri kiến uẩn* (`sn6.2:6.1`). `isi` → *ẩn sĩ*, `mahesi` → *đại ẩn sĩ* (`cnd9:4.2`, `cnd21:14.4`); `devīsi` → *thiên tiên* theo `snp5.16:1.4` (1 khoá), và lời giải `20.3` giữ *vừa là Đức Thế Tôn, vừa là bậc ẩn sĩ* đúng Pāli `bhagavā ceva isi ca`. `sahadhammika` → *hợp lý* (4 khoá `dn3`, `mn35`) vs *hợp pháp* 1. `āsayānusaya` → *khuynh hướng … tùy miên* (`cnd18:7.1`); `adhimutti` → *sự nghiêng hẳn về* theo `cnd14:2.3`; `ajjhāsaya` → *thiên hướng*, `adhippāya` → *ý hướng*, `laddhi` → *tín điều*, `khanti` → *sự chấp nhận*, `ruci` → *điều ưa thích* (`cnd12:2.1`). `rittato tucchato suññato … saṅkhatato` → *trống vắng, hư rỗng, trống rỗng … hữu vi* (`cnd10:11.23`–`11.34`, `cnd11:64.2`, `ps3.9:11.2`). `sāra` → *cốt lõi* (`cnd10:11.29`, `ps3.9:11.2`) thay vì *lõi* (`sn22.95`); `pheṇapiṇḍa` → *quả bọt*, `marīci` → *huyễn ảnh*, `māyā` → *ảo thuật* (`sn22.95`). `maccu`/`maccurājā` → *Thần chết*, `māra` → *Ma vương*, `maraṇa` → *cái chết*; `cuti` → *sự chết đi*. `lokadhātu` → *thế giới*; `sahassī cūḷanikā` → *thế giới tiểu nghìn*, `dvisahassī majjhimikā` → *thế giới trung nhị nghìn* theo `an3.80`. `uposatha` → *ngày trai giới* (38 trong 48 khoá có `uposatha`). `vipassanā` → *quán* (158 khoá; *minh sát* 17, *tuệ quán* 12). `ānāpānassati` → *niệm hơi thở* (121 trong 125 khoá). `paṭisambhidā` → *vô ngại giải* (`an1.218`, `an7.38`, `an1.593-595`). `āvajjanapaṭibaddha` → *gắn liền với sự hướng tâm* (`mil5.1.2`). `anuppannassa maggassa uppādetā … maggānugā ca sāvakā` → theo `mn108:5.3`–`5.4`. `jānaṁ jānāti passaṁ passati` → *biết mà biết, thấy mà thấy* (`mn138`, `mn133`: 4 khoá) vs *bậc biết và thấy* (`mn18`: 2 khoá). `apparajakkhe … duviññāpaye` → *ít bụi trong mắt … dễ dạy và khó dạy* (8 khoá `dn14`, `mn26`, `mn85`). `Ác Ma` trong công thức *làm Māra mù mắt* (4 khoá). `attena vā attaniyena vā` → *đối với tự ngã hay cái thuộc về tự ngã* (`ps2.10`).

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `2.1`/`2.11`/`2.12`: `dvikkhattuṁ` và `dvāhaṁ` = hai lần (2/2). `4.2`: 9 động từ `na byākāsi … na pakāsesi` = 9 Việt. `4.4`: 5 loại mắt (`pañcahi cakkhūhi`), 5 mục. `5.3`: `pañca vaṇṇā` = 5 màu, 5 mục (xanh, vàng, đỏ, đen, trắng). `5.9`/`5.12`: `yojana` = một do-tuần. `5.10`–`5.11`: `caturaṅga` = 4 chi phần, 4 điều kiện được kể (mặt trời lặn, ngày trai giới nửa tháng tối, rừng rậm dày đặc, mây đen lớn) = 4/4. `5.14`: `ekaṁ tilaphalaṁ` = một hạt mè. `6.7`: 15 mục `passeyya` (`eka` 1, `dve` 2, `tisso` 3, `catasso` 4, `pañca` 5, `dasa` 10, `vīsa` 20, `tiṁsa` 30, `cattālīsa` 40, `paññāsa` 50, `sata` 100, rồi `sahassī` tiểu nghìn, `dvisahassī` trung nhị nghìn, `tisahassī`, `mahāsahassī`) = 15 Việt, cộng vế kết `yāvatakaṁ … tāvatakaṁ`. `7.2`: 6 loại trí tuệ, 5 mục `puris-` (`āsabha`, `sīha`, `nāga`, `ājañña`, `dhorayha`), 3 mục `ananta-`, 7 động từ `netā … pasādetā` = 7 Việt; `catuvesārajja` = bốn sự tự tin; `dasabala` = mười sức mạnh. `8.2`: 5 mục `aññātaṁ … aphassitaṁ` = 5. `8.4`: 15 mục `attho` (3 + 6 cặp), 15 Việt (đã sửa số đếm 14 của lượt trước). `9.1`: 3 nghiệp. `14.2`: 5 cặp căn cơ. `14.6`: 6 tính hạnh `rāga … ñāṇa`. `14.7`–`14.12`: 6 mục tương ứng. `26.1`/`26.2`: 6 mục `diṭṭhi … adhippāya` = 6 Việt. `30.1`: 7 mục `abhikkanta … parama` = 7 Việt. `36.2`: 11 mục `niraya … sadevako` = 11 Việt. `42.7`: 11 liên kết `avijjā … jarāmaraṇa` = 11 Việt (`do duyên … mà có`). `46.1`/`46.28`: `chahākārehi` = sáu phương diện; `47.1`/`47.12`: `dasahākārehi` = mười, 10 mục `rittato … saṅkhatato`; `48.1`/`48.7`: `dvādasahākārehi` = mười hai, 12 mục `na satto … na kassaci` = 12 Việt; `37.1`–`45.9`: `dvīhi kāraṇehi` = hai lý do. `56.5`: `catūhi kāraṇehi` = bốn lý do. `57.1`: `vīsativatthukā` = hai mươi cơ sở (2 × 10); `57.7`: `dvāsaṭṭhi` = 2 + 60 = 62 → *sáu mươi hai kiến chấp*; 19 mục sau `diṭṭhi` giống `cnd6:21.2`. `57.8`: 10 động từ `ūhacca … gametvā` = 10 Việt. `58.1`: 5 động từ `tareyyāsi … vītivatteyyāsi` = 5 Việt. `1.5`/`20.1`/`21.28`: `yāvatatiya` = lần thứ ba. `68.3`: `pannarasama` = thứ mười lăm (5 + 10). Không có `navuti`, `tālīsa`, `sattati`, `koṭi`, `tiṁsakappasahassa`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
