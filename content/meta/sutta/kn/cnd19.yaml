  chuỗi vô nghĩa lặp từ cá voi nuốt cá voi nuốt; nay dịch cá khổng lồ nuốt cá voi, thống nhất ở mnd8,
  mnd14, mnd16, cnd19, ps3.1. Chuỗi timi timiṅgalo timirapiṅgalo ở an8.20/ud5.5 chưa chạm tới, để
  người biên tập quyết định. Bản này không có English độc lập nên triangulation giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: B1 — `66.3` (`visattikā` = “sự vướng mắc ở đời”; `tare` = “có thể vượt qua”); B3 — `2.8` (`iddhipāda` = “như ý túc”); B18 — `11.1` (`kenīdha … vikappayeyya` = “lấy gì ở đời này mà phán đoán được vị ấy”; `timitimiṅgala` = “cá nuốt cá nuốt cá khổng lồ”).

  Nghiên cứu nguồn ngoài 2026-10-16: bản Việt song ngữ Pāli–Việt của Tỳ khưu Indacanda,
  Cūḷaniddesapāḷi - Tiểu Diễn Giải (Tam Tạng Song Ngữ Pāli–Việt, Sri Lanka 2018),
  https://tamtangpaliviet.net/TTPV/36_Nidd_II.pdf (Tiểu Diễn Giải, tập 36); đã tải toàn văn và đối
  chiếu phần tương ứng; nguồn độc lập với dự án, giấy phép không khai (NOASSERTION), chỉ dùng làm bằng
  chứng nghĩa, không chép. Đã đối chiếu: căn chỉnh theo đoạn 68 nhóm đoạn của bài với Indacanda (36
  nhóm khớp từ vựng và không lệch phủ định hay số đếm, 7 nhóm trùng chữ với nhóm đã so ở bài khác, 25
  nhóm bị cờ; nhóm bị cờ mới quét theo danh sách cờ, chưa đọc từng nhóm); đọc từng nhóm kệ trích (4
  nhóm) cạnh Indacanda và Sujato; so 31 mục từ đầu đoạn với mục từ của Indacanda; kệ trích còn so với
  Sujato snp5.16 (52 khoá có Pāli trùng chữ với kho `snp`, 41 khoá có Việt trùng chữ, 11 khoá khác, đã
  xem mẫu: phần lớn do ngắt dòng, chấm câu hoặc do Niddesa tự đọc kệ khác Sujato). Phần lời giải
  Niddesa chỉ có Indacanda làm nguồn độc lập (Sujato không có bài này); phần kệ trích có thêm Sujato.
  Sửa: không có khoá nào. Bất định/ghi nhận: không phát sinh bất định mới.
