  Dòng `:0.4` và lục kết `:6.1`: toàn tầng *Kinh …* **409** vs *Chuyện Tiền Thân …*
  **33**, và lục kết có dạng *Kinh <Tên>, thứ <số>.* **406/409** ⇒
