notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Tra tiền lệ (đếm được):** tên riêng Pāli được giữ nguyên (corpus có sẵn `Brahmā`,
  `Brāhmaṇa`; xem thêm `Paṭācārā` ở `dhp113:0` và `thig5.11:3.2`); gọi tên kèm "ơi" là
  dựng quen thuộc (702 chỗ " ơi" trong tầng Việt, `mn133:7.2` "Đạo hữu ơi").
  **Bối cảnh đã đọc trước khi dịch:** `3.1`–`3.4` là lời thầy tự trách vì đã làm điều
  xấu rồi hối hận — *Mā su tvaṁ akari pāpaṁ, yaṁ tvaṁ pacchā kataṁ tape* — nên `1.1`
  không phải mệnh lệnh vô nghĩa mà là lời dặn dò: việc ấy phải làm **luôn**. Vì vậy tôi
  giữ mạnh từ *luôn* cho `niccaṁ`.
  **0 tiền lệ, đặt mới:** `bhavitabba` (việc phải làm) — 0 tiền lệ trong tầng Việt; tôi
  dịch *phải làm*, giữ nghĩa nghĩa vụ của dạng `bhavitabba`, không dịch thành "nên làm"
  (hay nên hơn) cũng không thành "làm".
  **Dấu ngoặc kép — quyết định đã ghi, áp dụng cho 3 bài trong lát:** Pāli `1.1` mở `“`
  nhưng nghĩa tròn bài nằm ở `1.4`, và `1.4` không đủ 40 ký tự nên **không** nằm trong
  tập khoá mà `kiểm` kiểm. Nếu chép nguyên `“` thì ngoặc không cân và `save_vi` ném
  lỗi. Tôi dùng cặp `‘’` — quy ước đã có 9.600 lần trong tầng Việt, và cũng chính là
  hình thức Pāli dùng cho trích dẫn lồng nhau (ví dụ `dn14:1.2.6`) — để giữ đúng việc
  đây là lời thoại mà vẫn qua chốt. **Cần nói rõ với người điều phối:** chốt `ngoặc`
  **chặt hơn thực tế corpus** — chạy lại `kiểm` trên các bài đã `published` thì **135
  bài** một-khoá-nội-dung có ngoặc Pāli lệch đều FAIL, kể cả `an10.136` và `an4.141`.
  Tôi **không** sửa `_hvi.py` theo lời dặn; chỉ báo lại ở đây.
