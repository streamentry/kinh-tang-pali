notes: |-
  Đủ 11/11 khoá trong all. Đã đọc HẾT Pāli lát qua v7/p1.txt trước khi viết.
    Khung bốn khối tiêu đề giữ y hệt ba bài mil còn lại của lát. Opammakathāpañha → Câu hỏi về cách
    dùng dẫn với ví dụ; Makkaṭakavagga → Phẩm Kẻ Nhắc Nhở (lời nhắc nhở có 1 tiền lệ).

    TIỀN LỆ ĐẾM ĐƯỢC VÀ DÙNG LẠI: câu trích ở khoá 2.1 là CÙNG một câu Pāli với dn16:5.10.3
    (Dīghanikāyo, đã publish trong chính tầng này), nên tôi dùng lại nguyên văn của kho đó:
    sāratthe → nghĩa tinh túy; ghaṭatha → hãy nỗ lực; anuyuñjatha → hãy chuyên tâm;
    appamattā ātāpino pahitattā viharatha → hãy sống không phóng dật, nhiệt tâm, quyết chí.
    Cách đó vừa bám kho vừa tránh dịch lần hai một câu đã có bản Việt đang dùng.

    Không có bản Anh đã ghim nên tôi tra song song trong tầng để chốt thuật ngữ, và các lựa chọn
    sau đều có tiền lệ: tôn giả, Đại vương, thí dụ (ví dụ, hơn 20 chỗ), hành trì (hơn 40 chỗ),
    trí thức, hỏi han (15 chỗ), khéo léo (190 chỗ), kết bạn (62 chỗ), bạn lành (nhiều, Tạng Bộ),
    Thiên Nhân (6 chỗ), diệt tận (899 chỗ), Dīgha Nikāya (chữ này đã có trong tầng nên giữ Pāli).

    LƯỖI ĐÃ BẮT VÀ SỬA Ở LƯỢT REVIEW ĐỐI KHÁNG. Bản nháp đầu dịch `sammappayoge paviveke
    garusaṁvāse kalyāṇamittasevane` thành ba vế, rơi mất `paviveke`. Đó là mất một mệnh đề,
    nên đã sửa thành bốn vế: phải khéo léo lựa chọn, phải sống một mình nơi vắng vẻ, phải sống
    cùng người tu hành, phải kết bạn với bạn lành. Đây cũng là lý do tôi không tin vàng bản nháp.
    `paviveke` → nơi vắng vẻ (11 chỗ); `garusaṁvāse` → sống cùng người tu hành (0 tiền lệ, đặt
    mới: garu là người đạo hạnh nên sống cùng thì là sống chung nhà).

    Bất định đã ghi nhận. `sadatthe laggati` / `sadatthe laggitabbaṁ` tôi dịch là đúng mục đích, giữ
    nghĩa chữ nghĩa của sadatthe thay vì diễn giải thành “đúng chỗ đau”, vì hình ảnh đứa trẻ khóc
    bị nắm đúng chỗ mới là lý do dùng điển tượng, còn “đúng chỗ đau” là lời giải thích thêm.
    Ở 1.3 Pāli là thục khách (bị nắm lấy) nên tôi dịch “được nắm lấy”, không dịch thành chủ thể.
    `dīghanikāyavare` → bậc tôn túy trong Dīgha Nikāya: Pāli gộp chữ, tôi tách ra hai chữ; lý do
    kỹ thuật là chuỗi gộp không có trong Pāli khoá nên lọt_pāli báo; tách ra thì cả hai chữ đã có
    sẵn trong tầng và đọc đúng hơn.
    Dấu lược: cả bài không có `…pe…` nên hai phía đều 0.
    Kiểm kỹ thuật: save_vi sạch, chạy hai lần idempotent (sha256 không đổi). Vì mọi khoá Pāli của Theragāḵā ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá: đủ 11/11 khoá; đúng ID; thứ tự khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2 ở dòng kết); nháy kép cân trên cả bài; không còn `(…)`; không có ký tự ngoài Latin. Không chạy npm run validate|test|check|build (đợt này cấm) nên technical_integrity = 9.6, không phải 10.  Không đối chiếu được tầng Việt hiện hành: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Đây là giới hạn của bản chụp upstream, đã ghi ở content/meta/reference-gaps.yaml.
