notes: |-
  Đã đọc HẾT Pāli lát (w6.pali.txt, 447 dòng, 196 khoá / 14 bài) trước khi viết chữ nào.

  TẦNG THAM KHẢO — đo, không đoán. 0/14 bài có bản Anh Sujato tại commit đã ghim: tôi đếm ở
  `source/upstream-manifest.json` (edition `translation/en/sujato` có 4291 tệp; trong `kn/` chỉ
  755 tệp thuộc cp, dhp, iti, ja, kp, snp, thag, thig, ud; KHÔNG có tệp mil* nào ngoài
  `name/sutta/mil-name`), rồi đếm lại trong `.cache/upstream/suttacentral/translation/en/sujato/`
  và bằng `find . -name 'mil*'`: kết quả vẫn 1 tệp tên. Đây là `not-published-upstream`, KHÔNG
  phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit
  đã ghim có 26 tệp và toàn bộ là Pháp Cú, nên Trường Bộ không có bản Thích Minh Châu để đối
  chiếu. Lớp lấp English của dự án (`content/translation/en/project/sutta/kn/`) có 24 tệp mil*
  nhưng không có uid nào của lát w6. Ba tầng tham khảo đều vắng ⇒ blocker thật ⇒ status `draft`.

  BẰNG CHỨNG NGOÀI TẦNG ĐÃ GHIM — ghi rõ để không ai tưởng là tầng store. Để phân xử mấy từ khó
  khó, tôi tra (1) Từ điển Pāli–Anh của PTS (Childs 2001) qua DDSA, và (2) bản dịch
  T.W. Rhys Davids 1890/1894 mà SuttaCentral dựng lại từ Internet Sacred Text Archive — bản
  công cộng, KHÔNG nằm trong `source/suttacentral.lock.json`, chỉ dùng làm bằng chứng về cách
  parse cú pháp Pāli (mục 5 của thứ bậc nguồn trong `skill/translation.md`), không phải authority.
  Cả hai đều được nêu tên ở từng chỗ dùng. Bản Việt hiện hành trên SuttaCentral (Bhikkhu
  Indacanda, 2011) tôi cố tình KHÔNG đọc, để bản dịch là của mình chứ không phải bản Việt lại.

  PĀLI TRÙNG NGUYÊN VĂN — tự tra bằng script, không tin bảng tiền lệ. Tôi dựng chỉ mục
  Pāli↔Việt của toàn tầng (155.801 khoá Pāli `kn`, 17.756 khoá Việt `kn`, khớp theo
  chuẩn hoá khoảng trắng) rồi so 196 khoá của lát: tìm được **33 cặp** Pāli trùng nguyên văn
  với bài khác, trong đó **29 cặp là khoá khối tiêu đề** (`:0.1`–`:0.4`: `Milindapañha`,
  `Opammakathāpañha`, tên phẩm) và chỉ **4 cặp là nội dung**. Cả 4 cặp nội dung đều dùng lại
  y hệt, không dịch lần hai:
  · `mil3.7.9:1.1` `Rājā āha—` và `mil3.7.9:3.1` `“Kallosi, bhante nāgasenā”ti.` — cùng nguyên
    văn với 22 và 25 khoá đã có; dùng lại đúng nguyên văn của tầng.
  · `mil7.2.4:2.2/2.3` `Nāgo pūtilataṁva dālayitvā;` / `Nāhaṁ punupessaṁ gabbhaseyyaṁ,` —
    trùng `snp1.2:12.3`/`12.4` đã `published`; dùng lại y hệt. Cả bốn vế kệ `2.1`–`2.4` lấy từ
    `snp1.2:12.1`–`12.5`.
  Ngoài ra có các khoá trùng NỘI TRONG lát, và tôi dùng lại y hệt: `Bhāsitampetaṁ …
  therena sāriputtena dhammasenāpatinā—` (mil7.3.9:1.5 == mil7.5.5:1.5),
  `Bhāsitampetaṁ … therena upasenena vaṅgantaputtena—` (mil7.5.1:1.5 == mil7.5.3:1.5 ==
  mil7.5.4:1.5), `viharanto vipassako;` (mil7.5.3:2.2 == mil7.5.4:2.2). Bảng `TIEN_LE_PHAI.md`
  không có mục nào rơi vào lát w6 (mụn gần nhất là `mil3.5.6:2.1 == mil3.6.6:2.1`).

  BỐN XUNG ĐỘT THUẬT NGỮ ĐANG TREO mà người điều phối nêu — lát w6 KHÔNG chạm tới cái nào:
  không có `Dukanipāta`, `Kulāvakavagga`, `Atthakāmavagga`, cũng không có câu
  `Channā me kuṭikā sukhā nivātā;`. Vì vậy tôi không tự chuẩn hoá gì và không sửa bài ngoài lát.
  Tương tự, hai phép đa nghĩa đã đo (`aṇḍajā nāgā` và `rañño nāgo rājabhoggo`) không xuất hiện.

  DẤU LƯỢC — theo §10 của BRIEF_VI3. Cả 14 bài không có `…pe…` nào và không khoá nào tôi nén
  bằng `…`, nên hai phía đều 0 và không có chuyện mở rộng. Tôi đã kiểm lại từng khoá, không
  có `(…)` đứng một mình.

  KIỂM THỦ CÔNG MỌI KHOÁ (không chạy npm — đợt này cấm `npm run validate|test|check|build`).
  `kiểm()` của `_hvi.py` chỉ quét khoá Pāli từ 40 ký tự trở lên; lát này có khoá dài tới 286 ký tự
  nên `cần` KHÔNG rỗng, nhưng tôi vẫn tự quét TOÀN BỘ 196 khoá: đủ khoá, đúng ID, thứ tự khoá
  y hệt Pāli, không rỗng, NFC, không khoá thừa, số dấu lược khớp từng khoá, nháy kép cân trên cả
  bài, không có `(…))`, không Pāli lọt. Kết quả 0 lỗi; 14 khoá `:0.1` trùng Pāli là tên tác phẩm,
  đúng như 45 bài mil/thig đã có trong tầng. `save_vi` gọi hai lần cho cả lát: sha256 không
  đổi một byte. **Vì technical gate tập trung chưa chạy, `technical_integrity` chấm 9.6 chứ
  không phải 10.0, và tôi KHÔNG tuyên bố technical gate pass.**
  Thuật ngữ có tiền lệ: `Opammakathāpañha`, `yoginā yogāvacarena`, `mahārāja` như mil7.2.3;
  `thera` → Trưởng lão (7+ khoá đã có); `cāpa` → cây cung (PTS: `a bow`, dẫn `Miln 352` — đúng
  trang câu đố này; tầng đã có `cây cung` 3 chỗ); `jātake` → trong bộ Jātaka (tầng đã giữ
  chữ Jātaka ở `ja*:0.1`); `Vidhura (Puṇṇaka)` — `Puṇṇaka` có tiền lệ ở an3.32:5.1
  (`Câu Hỏi Của Puṇṇaka`).

  0 tiền lệ, đặt mới: `yāvaggamūla` → gốc tựa cao ngang cái ách (yoke = cái ách xe bò); `samaka`
  → ngay thẳng; `anunamati` → hạ đầu; `paṭitthambhati` → run rẩy, cứng; `theranavamajjhimasamakesu`
  → các vị trưởng lão, các bậc mới xuất gia, các bậc trung niên và các bậc ngang hàng; `vūnudara`
  → phá nát uy; `rājavasati` → nơi vua ở.

  BẤT ĐỊNH ĐÃ GHI. `sutacchita namito` (1.2) không có mục `sutacchita` trong PTS, còn `namita`
  PTS chỉ ghi nghĩa chung `bent on, disposed to` chứ không phải nghĩa riêng của cung. Tôi dịch
  `đã được giưng cho căng và đã buộc chặt` vì đó là hai việc phải làm với một cây cung để bắn
  được, và `samakameva` thì gánh phần `cho ngay thẳng`. Rhys Davids dịch `a well-made and
  balanced bow` — cũng không đưa ra được định nghĩa từng chữ, nên tôi ghi bất định ở đây chứ
  không làm cho câu chắc hơn Pāli cho phép. Ở 1.3 bản nháp đầu của tôi đảo cấu trúc câu (đặt
  `người hành trì` trước rồi mới liệt kê), đọc thành nghĩa `với họ`; đã sửa thành liệt kê
  trước.

  **terminology fix (2026-10-04, coordinator).** `Gadrabhavagga` bị dịch "Phẩm Con Lừa" ở khối `:0.3` — lẫn với `Kumbhavagga` (con lừa). `gadra` là **con sóc**, và hai tệp cùng phẩm (mil7.2.1, mil7.2.6) đã dùng đúng "Phẩm Con Sóc". Đếm toàn tầng trước khi sửa: 6 tệp lừa / 2 tệp sóc / 1 tệp giữ PĦLI. Đã đồng nhất sang sóc.
