notes: |-
  Đã đọc HẾT Pāli lát (w6.pali.txt, 447 dòng, 196 khoá / 14 bài) trước khi viết chữ nào.

  TẦNG THAM KHẢO — đo, không đoán. 0/14 bài có bản Anh Sujato tại commit đã ghim: tôi đếm ở
  `source/upstream-manifest.json` (edition `translation/en/sujato` có 4291 tệp; trong `kn/` chỉ
  755 tệp thuộc cp, dhp, iti, ja, kp, snp, thag, thig, ud; KHÔNG có tệp mil* nào ngoài
  `name/sutta/mil-name`), rồi đếm lại trong `.cache/upstream/suttacentral/translation/en/sujato/`
  và bằng `find . -name 'mil*'`: kết quả vẫn 1 tệp tên. Đây là `not-published-upstream`, KHÔNG
  phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit
  đã ghim có 26 tệp và toàn bộ là Pháp Cú, nên Trường Bộ không có bản Thích Minh Châu để đối
  chiếu. Lớp lấp English của dự án (`content/translation/en/project/sutta/kn/`) có 24 tệp mil*
  nhưng không có uid nào của lát w6. Ba tầng tham khảo đều vắng ⇒ blocker thật ⇒ status `draft`.

  BẰNG CHỨNG NGOÀI TẦNG ĐÃ GHIM — ghi rõ để không ai tưởng là tầng store. Để phân xử mấy từ khó
  khó, tôi tra (1) Từ điển Pāli–Anh của PTS (Childs 2001) qua DDSA, và (2) bản dịch
  T.W. Rhys Davids 1890/1894 mà SuttaCentral dựng lại từ Internet Sacred Text Archive — bản
  công cộng, KHÔNG nằm trong `source/suttacentral.lock.json`, chỉ dùng làm bằng chứng về cách
  parse cú pháp Pāli (mục 5 của thứ bậc nguồn trong `skill/translation.md`), không phải authority.
  Cả hai đều được nêu tên ở từng chỗ dùng. Bản Việt hiện hành trên SuttaCentral (Bhikkhu
  Indacanda, 2011) tôi cố tình KHÔNG đọc, để bản dịch là của mình chứ không phải bản Việt lại.

  PĀLI TRÙNG NGUYÊN VĂN — tự tra bằng script, không tin bảng tiền lệ. Tôi dựng chỉ mục
  Pāli↔Việt của toàn tầng (155.801 khoá Pāli `kn`, 17.756 khoá Việt `kn`, khớp theo
  chuẩn hoá khoảng trắng) rồi so 196 khoá của lát: tìm được **33 cặp** Pāli trùng nguyên văn
  với bài khác, trong đó **29 cặp là khoá khối tiêu đề** (`:0.1`–`:0.4`: `Milindapañha`,
  `Opammakathāpañha`, tên phẩm) và chỉ **4 cặp là nội dung**. Cả 4 cặp nội dung đều dùng lại
  y hệt, không dịch lần hai:
  · `mil3.7.9:1.1` `Rājā āha—` và `mil3.7.9:3.1` `“Kallosi, bhante nāgasenā”ti.` — cùng nguyên
    văn với 22 và 25 khoá đã có; dùng lại đúng nguyên văn của tầng.
  · `mil7.2.4:2.2/2.3` `Nāgo pūtilataṁva dālayitvā;` / `Nāhaṁ punupessaṁ gabbhaseyyaṁ,` —
    trùng `snp1.2:12.3`/`12.4` đã `published`; dùng lại y hệt. Cả bốn vế kệ `2.1`–`2.4` lấy từ
    `snp1.2:12.1`–`12.5`.
  Ngoài ra có các khoá trùng NỘI TRONG lát, và tôi dùng lại y hệt: `Bhāsitampetaṁ …
  therena sāriputtena dhammasenāpatinā—` (mil7.3.9:1.5 == mil7.5.5:1.5),
  `Bhāsitampetaṁ … therena upasenena vaṅgantaputtena—` (mil7.5.1:1.5 == mil7.5.3:1.5 ==
  mil7.5.4:1.5), `viharanto vipassako;` (mil7.5.3:2.2 == mil7.5.4:2.2). Bảng `TIEN_LE_PHAI.md`
  không có mục nào rơi vào lát w6 (mụn gần nhất là `mil3.5.6:2.1 == mil3.6.6:2.1`).

  BỐN XUNG ĐỘT THUẬT NGỮ ĐANG TREO mà người điều phối nêu — lát w6 KHÔNG chạm tới cái nào:
  không có `Dukanipāta`, `Kulāvakavagga`, `Atthakāmavagga`, cũng không có câu
  `Channā me kuṭikā sukhā nivātā;`. Vì vậy tôi không tự chuẩn hoá gì và không sửa bài ngoài lát.
  Tương tự, hai phép đa nghĩa đã đo (`aṇḍajā nāgā` và `rañño nāgo rājabhoggo`) không xuất hiện.

  DẤU LƯỢC — theo §10 của BRIEF_VI3. Cả 14 bài không có `…pe…` nào và không khoá nào tôi nén
  bằng `…`, nên hai phía đều 0 và không có chuyện mở rộng. Tôi đã kiểm lại từng khoá, không
  có `(…)` đứng một mình.

  KIỂM THỦ CÔNG MỌI KHOÁ (không chạy npm — đợt này cấm `npm run validate|test|check|build`).
  `kiểm()` của `_hvi.py` chỉ quét khoá Pāli từ 40 ký tự trở lên; lát này có khoá dài tới 286 ký tự
  nên `cần` KHÔNG rỗng, nhưng tôi vẫn tự quét TOÀN BỘ 196 khoá: đủ khoá, đúng ID, thứ tự khoá
  y hệt Pāli, không rỗng, NFC, không khoá thừa, số dấu lược khớp từng khoá, nháy kép cân trên cả
  bài, không có `(…))`, không Pāli lọt. Kết quả 0 lỗi; 14 khoá `:0.1` trùng Pāli là tên tác phẩm,
  đúng như 45 bài mil/thig đã có trong tầng. `save_vi` gọi hai lần cho cả lát: sha256 không
  đổi một byte. **Vì technical gate tập trung chưa chạy, `technical_integrity` chấm 9.6 chứ
  không phải 10.0, và tôi KHÔNG tuyên bố technical gate pass.**
  Thuật ngữ có tiền lệ: `Opammakathāpañha`, `yoginā yogāvacarena`, `mahārāja` như mil7.2.3;
  `thera` → Trưởng lão (7+ khoá đã có); `cāpa` → cây cung (PTS: `a bow`, dẫn `Miln 352` — đúng
  trang câu đố này; tầng đã có `cây cung` 3 chỗ); `jātake` → trong bộ Jātaka (tầng đã giữ
  chữ Jātaka ở `ja*:0.1`); `Vidhura (Puṇṇaka)` — `Puṇṇaka` có tiền lệ ở an3.32:5.1
  (`Câu Hỏi Của Puṇṇaka`).

  0 tiền lệ, đặt mới: `yāvaggamūla` → gốc tựa cao ngang cái ách (yoke = cái ách xe bò); `samaka`
  → ngay thẳng; `anunamati` → hạ đầu; `paṭitthambhati` → run rẩy, cứng; `theranavamajjhimasamakesu`
  → các vị trưởng lão, các bậc mới xuất gia, các bậc trung niên và các bậc ngang hàng; `vūnudara`
  → phá nát uy; `rājavasati` → nơi vua ở.

  BẤT ĐỊNH ĐÃ GHI. `sutacchita namito` (1.2) không có mục `sutacchita` trong PTS, còn `namita`
  PTS chỉ ghi nghĩa chung `bent on, disposed to` chứ không phải nghĩa riêng của cung. Tôi dịch
  `đã được giưng cho căng và đã buộc chặt` vì đó là hai việc phải làm với một cây cung để bắn
  được, và `samakameva` thì gánh phần `cho ngay thẳng`. Rhys Davids dịch `a well-made and
  balanced bow` — cũng không đưa ra được định nghĩa từng chữ, nên tôi ghi bất định ở đây chứ
  không làm cho câu chắc hơn Pāli cho phép. Ở 1.3 bản nháp đầu của tôi đảo cấu trúc câu (đặt
  `người hành trì` trước rồi mới liệt kê), đọc thành nghĩa `với họ`; đã sửa thành liệt kê
  trước.

  **terminology fix (2026-10-04, coordinator).** `Gadrabhavagga` bị dịch "Phẩm Con Lừa" ở khối `:0.3` — lẫn với `Kumbhavagga` (con lừa). `gadra` là **con sóc**, và hai tệp cùng phẩm (mil7.2.1, mil7.2.6) đã dùng đúng "Phẩm Con Sóc". Đếm toàn tầng trước khi sửa: 6 tệp lừa / 2 tệp sóc / 1 tệp giữ PĦLI. Đã đồng nhất sang sóc.

  Sửa lan 2026-10-13: khoá `mil7.2.8:0.3` — `Gadrabhavagga`. Trước: «Phẩm Con Sóc» → sau: «Phẩm Con Lừa». Căn cứ: `gadrabha` là con lừa (`mil7.1:3.1` `Gadrabhassa ekaṁ aṅgaṁ` → «con lừa»; `mil5.1.1:15.2`, `mil3.7.1:7.2` đều dịch `gadrabha` là «lừa»), còn con sóc là `kalandaka` (`mil7.1:5.1`, `mil7.2.3:1.1`); câu kết phẩm `mil7.1:13.1` và `mil7.2.10:5.1` `Gadrabhavaggo paṭhamo` đã là «Phẩm Con Lừa». Mục «terminology fix (2026-10-04)» ở trên khẳng định `gadra` là con sóc là sai và được thay bằng mục này. Lưu ý (ngoài lượt này): `mil7.2.1`, `mil7.2.3`–`mil7.2.7`, `mil7.2.10` còn ghi «Phẩm Con Sóc» ở `:0.3`, và `mil7.2.1:1.1`–`1.4`, `3.1` còn dịch `gadrabha` là «con sóc».

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan). Đọc đối kháng đủ 14 khoá cặp Pāli↔Việt; đổi 9 khoá (1.1–1.5, 2.1–2.4), 5 khoá giữ nguyên (0.1–0.4, 3.1). Các mục thuật ngữ «đặt mới» ở trên (yāvaggamūla → «gốc tựa cao ngang cái ách», samaka → «ngay thẳng», anunamati → «hạ đầu», paṭitthambhati → «run rẩy, cứng», vūnudara → «phá nát uy», rājavasati → «nơi vua ở») KHÔNG khớp văn bản hiện hành và đều bị thay bởi mục này; chúng chưa bao giờ được sửa trong notes sau khi bản dịch đổi.
  · 2.1–2.4 (accuracy fix, lỗi nặng nhất). Trước: «Kẻ dũng mãnh phá nát uy cây cung, / hay cả cây trúc đang rung lắc, / đều không đi ngược chiều, / kẻ ấy sẽ sống ở nơi vua ở.”» — gán `dhīro` thành «kẻ dũng mãnh», đọc `vūnudaro` thành «phá nát uy», biến `vaṁso` thành chủ ngữ «cây trúc đang rung lắc», làm `na vatteyya` (cầu khiến, chủ ngữ là bậc trí) thành «đều không đi ngược chiều», đổi `vase` (nên sống) thành «sẽ sống», và thiếu nháy đơn đóng `’`. Sau: «Bậc trí bụng thon như cây cung, / hay như cây tre cũng biết uốn mình; / không làm điều trái nghịch, / người ấy nên sống nơi vương triều.’”». Căn cứ: cùng bốn vế Pāli có ở `ja546:153.1–4` (Vidhurajātaka; `Cāpovūnudaro dhīro, vaṁsovāpi pakampaye; Paṭilomaṁ na vatteyya, sa rājavasatiṁ vase`, chỉ khác khoảng trắng sandhi `vaṁso vāpi`), đã có bản Việt trong kho: «Bậc trí bụng thon như cây cung», «không làm điều trái nghịch», «người ấy nên sống nơi vương triều» (ja546:150.4, 152.6, 153.4, 154.4 đều dùng «nên sống nơi vương triều»). Đo trùng nội kho: 2 cặp Pāli trùng nguyên văn ngoài khối tiêu đề (2.2, 2.3 với ja546:153.2–3), 1 cặp Việt khác ở 2.2 — cố ý: giữ «cũng» cho `vāpi` mà ja546:153.2 để rơi; không sửa ja546 vì ngoài lát. Điểm: semantic_fidelity 9.2 → 8.8, grammar_logic 9.2 → 8.9.
  · 1.5 (accuracy + terminology fix). Trước: «Bậc Thế Tôn, đấng Thiên Nhân, đã nói trong bộ Jātaka, trong bài Vidhura còn gọi là Puṇṇaka:—». Mất `mahārāja`, mất sắc thái `-pi` («cũng»), và `devātideva` bị dịch «Thiên Nhân» (là `devamanussa`, một khái niệm khác; `devātideva` là «bậc trời trên chư thiên»). Sau: «Này Đại vương, điều này cũng đã được Đức Thế Tôn, bậc Thiên Trung Thiên, nói trong Chuyện tiền thân Vidhura (Puṇṇaka):—». Đo toàn tầng: «Thiên Trung Thiên» ở 55 tệp, «đấng Thiên Nhân» ở 12 tệp (kể cả bản trước của bài này; đều là mil); «trong chuyện tiền thân» có tiền lệ ở mil7.4.2, mil7.6.2. Bỏ «còn gọi là» vì Pāli chỉ để `(puṇṇaka)` trong ngoặc, không có từ «gọi là».
  · 1.3 (accuracy + terminology fix). Trước: «người hành trì phải biết nhún nhường trước các vị trưởng lão, các vị mới tu, các vị trung niên và các vị ngang hàng, không chống đối». «trung niên» (tuổi đời) sai với `majjhima` là hạng tỳ-kheo trung (tuổi hạ), đối chiếu `dn29:12.6–15.7` (`majjhimā bhikkhū` → «tỳ-kheo có tuổi hạ trung bình», `navā bhikkhū` → «mới thọ giới»); `paṭippharati` có tiền lệ «phản đối» ở mn15:3.20–6.20 và an8.14:11.2 (6 khoá), nên đổi «chống đối» → «phản đối»; thêm lại vế `yogāvacarena` («người thực hành») như mil7.2.1 và mil7.2.2; bỏ «biết» không có trong Pāli. Điểm: terminology 9.1 → 8.8.
  · 1.1 và 1.4: thêm lại `ekaṁ` («một phần») bị bỏ ở cả hai khoá (accuracy fix, nhỏ).
  · 1.2 (clarity + accuracy fix): «được đẽo gọt khéo» → «được đẽo khéo», «khi uốn thì cong đều» → «khi bị uốn thì cong theo đều», thêm vế `nappaṭitthambhati` chính xác hơn («không cứng lại chống cự»; `paṭi-` là ngược lại). Điểm: vietnamese_clarity 9.2 → 9.0, vì phát hiện ngay trong lượt này các chỗ đọc gượng của lượt trước.
  · Vidhura (Puṇṇaka): dùng «cây tre» cho `vaṁsa` theo tiền lệ (cnd23:63–66 và ja546:153.2 đều dịch `vaṁsa` là «cây tre»; «cây tre» xuất hiện 34 lần / 21 tệp toàn tầng), không dùng «cây trúc» (chỉ mil7.2.7 và thag1.72); vì vậy mil7.2.7 trong cùng phẩm vẫn ghi «cây trúc» — báo, không sửa vì ngoài lát.
  BẤT ĐỊNH CÒN LẠI (chưa phân xử được, giữ nguyên): (1) `ūnudara` — dịch «bụng thon» theo ja546:153.1 (`ūna` + `udara`, nghĩa đen «bụng thiếu/hóp»); trong ngữ cảnh Milinda (cây cung biết cong theo) có thể mang sắc thái «biết cúi mình» chứ không chỉ «gầy», nhưng không tra được chú giải nào trong kho để quyết; vế 154 ngay sau đó (`appāsī` «ăn ít») cho thấy ja546 hiểu theo nghĩa thân hình gọn. (2) `sutacchito namito` — `namito` vừa có thể là «đã cong/được uốn thành hình» vừa là «khi bị uốn» như dịch; giữ «khi bị uốn». (3) `yāvaggamūlaṁ` — «từ ngọn đến gốc» là cách đọc compound (`yāva` + `agga` + `mūla`), không có bản đối chiếu độc lập. (4) `pakampaye` — «biết uốn mình» theo ja546; nghĩa đen là «rung, lay». Điều này, cùng việc vẫn không có tầng Anh/Việt hiện hành độc lập, giữ triangulation 7.5 và hạ ambiguity_integrity 9.0 → 8.6.
  KHÔNG đổi dù nghi ngờ: 0.2 «Câu hỏi về cách dùng dẫn với ví dụ» (gượng, nhưng là quy ước chung của phần lớn các bài trong phẩm cùng tên; đổi lẻ một bài sẽ phá nhất quán); `tôn giả`/`bhante` (quy ước của các bài lân cận). Ngoài lát, báo: mil7.2.1, mil7.2.3–7.2.7, mil7.2.10 còn «Phẩm Con Sóc» ở `:0.3` (xem mục sửa lan ở trên); mil7.2.1, mil7.2.4, mil7.3.5, mil7.3.7, mil7.6.4, mil7.6.5, mil7.6.9, mil7.7.2, mil7.7.3, mil7.7.7, mil7.8.1 (11 tệp) còn dịch `devātideva` là «đấng Thiên Nhân», và mil7.3.10 dịch «bậc Thiên Nhân».
  technical_integrity giữ 9.6; chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này. Kiểm thủ công: 14/14 khoá, tập khoá và thứ tự khoá khớp Pāli, nháy `‘’` và `“”` khớp Pāli từng khoá, NFC, không khoảng trắng thừa, không Pāli lọt sang (chỉ tên riêng Nāgasena, Puṇṇaka, Vidhura), không `…`.
