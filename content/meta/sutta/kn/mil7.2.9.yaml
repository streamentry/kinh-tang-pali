notes: |-
  17 khoá, tất cả đã dịch. Đây là bài thứ 9 của `Gadrabhavagga`, ngay sau mil7.2.7 và
  mil7.2.8 đã có — nên khung `Opammakathāpañha` dùng **nguyên văn** cách dịch đã có.

  TẦNG THAM KHẢO — 0/17 có Anh Sujato (không có tệp `mil*` trong edition đã ghim ngoài tệp
  tên). Không có bản Việt hiện hành. Ba tầng vắng ⇒ `draft`.

  PĀLI TRÙNG: `0.1` (71 bài), `0.2` `Opammakathāpañha` (20 bài), `0.3` `Gadrabhavagga` (4 bài),
  và `2.4` `Bhāsitampetaṁ, mahārāja, therena sāriputtena dhammasenāpatinā—` → *Trưởng lão
  Sāriputta, Tướng quân Pháp, đã nói:—* (mil7.3.1, mil7.3.9, mil7.5.5 — 3 tiền lệ, dùng y hệt).

  **ĐA NGHĨA ĐÃ PHÂN XỬ THEO NGỮ CẢNH.** `vāyasaṅgapañha` ở đây **không** phải *con gió*.
  `āsaṅkitaparisaṅkito … carati` và `yaṁ kiñci bhojanaṁ disvā ñātīhi saṁvibhajitvā bhuñjati`
  chỉ nói được với một **chiếc thuyền**: thuyền phải có thủy thủ tập hợp, chân chèo xếp vào
  chỗ, phải tới nơi dự định, và phải chia thức ăn cho người cùng thân rồi mới ăn. `vāyasa`
  (cũng viết `vāyasā`) là *thuyền*, còn `vaya` ở `mil4.4:1.3` mới là *gió*. Tôi dịch tiêu đề
  *Câu hỏi về phần của chiếc thuyền*; 0 tiền lệ cho tiêu đề này. `āsaṅkita` = thủy thủ tập hợp,
  `parasaṅkita` = chân chèo xếp vào: 2 tiền lệ cho `nāvā` → *thuyền* (mil7.3.9) nhưng 0 cho
  hai từ này.

  **LỖI ĐÃ TỰ BẮT Ở LƯỢT REVIEW ĐỐI KHÁNG.** Bản nháp đầu của tôi ở `1.3` đã **rơi mất** `satiyā`
  (chánh niệm đã vững vàng), là mất hẳn một semantic unit giữa `yattapayattena` và
  `saṁvutehi indriyehi`. Đã sửa; đây là lý do `semantic_fidelity` không đạt 10.

  BẤT ĐỊNH CHƯA PHÂN XỬ:
  · `sabrahmacārīhi` (`2.2`) tôi dịch *những người cùng tu hành theo đời sống thanh tịnh*; 0 tiền lệ
    cho cụm này trong tầng Việt. `brahmacariya` có 1 tiền lệ là *đời sống sa-môn* (mil7.2.7), nên
    một cách khác là bám cụm đó.
  · `yathāladdhaṁ tapassino` (`3.2`) là *những gì vị tìm đạo đã tìm được, y như đã tìm cầu*;
    đường đọc khác là giữ *y như đã tìm* cho sự trùng lặp của `laddha`. 0 tiền lệ.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.

  **terminology fix (2026-10-04, coordinator).** `Gadrabhavagga` bị dịch "Phẩm Con Lừa" ở khối `:0.3` — lẫn với `Kumbhavagga` (con lừa). `gadra` là **con sóc**, và hai tệp cùng phẩm (mil7.2.1, mil7.2.6) đã dùng đúng "Phẩm Con Sóc". Đếm toàn tầng trước khi sửa: 6 tệp lừa / 2 tệp sóc / 1 tệp giữ PĦLI. Đã đồng nhất sang sóc.
