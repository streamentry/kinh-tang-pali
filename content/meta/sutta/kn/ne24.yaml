notes: |-
  Đủ 11/11 khoá trong all. Đã đọc HẾT Pāli lát qua v7/p1.txt trước khi viết.
    Đây là văn chú giải, không phải đối thoại, nên tôi dịch theo khuôn riêng của nó: bốn khối tiêu đề
    (Netti · Phần Giải Thích · Nhóm N · tên nhóm phương thức), câu hỏi Ở đây … là gì, bài kệ mở
    đầu, rồi câu chốt Nhóm phương thức … đã được vận dụng — y hệt ne27, ne28, ne32, ne34 đã có.
    Một lớp nữa: cả sampāta này là MỘT TRONG MƯỜI SÁU nhóm của Netti Paṭiniddesa, nên tôi đã đọc
    Pāli ne22, ne23, ne25, ne26, ne29, ne31, ne33, ne35 trong cache đã ghim để giữ đúng khuôn và
    tránh dịch cùng một thuật ngữ theo hai kiểu.

    TIỀN LỆ BẮT BUỘC dùng lại nguyên văn (TIEN_LE_PHAI.md): khoá 2.1 là “Do vậy, với người có tâm
    được phòng hộ, chánh tư duy là cảnh giới”, đó là bài kệ. — Pāli trùng ne27:2.1 và ne32:2.1,
    đã so ký tự, không dịch lại lần hai. Lưu ý cách dịch sẵn có hơi gượng về nghĩa (chánh tư duy
    không phải cảnh giới của người phòng hộ tâm mà là CẢNH GIỚI CỦA chánh tư duy); tôi giữ nguyên văn
    vì luật của kho là Pāli trùng thì dùng lại cách dịch đã có, và ghi bất định ở đây.

    `Taṁ kissa hetu?` ở 2.4 dịch là Vì sao vậy? — nguyên văn đã có ở 238 khoá trong tầng (đếm cả
    an3.*, an4.*, an5.*, sn11.3, sn15.*), bản nháp tôi viết Vì sao điều ấy, đã đổi sang đa số.
    `satindriya` tôi dịch là căn sáu. Đây là hợp nhất sat + indriya qua hiệu ứng giao âm (như
    satipaṭṭhāna = sati + paṭṭhāna), không phải `sati` + `indriya`; và mệnh đề kế tiếp (khi căn sáu
    đã được nắm giữ thì năm căn kia trở nên đã được nắm giữ) chỉ có nghĩa nếu đọc là sáu căn.
    Tôi so với ne31:2.3, nơi cùng công thức xuất hiện dưới dạng gahitāni bhavanti pañcindriyāni,
    và với ne24:2.3 cùng nói gahito bhavati pañcindriyāni.
    Nhưng chữ “kia” trong năm căn kia là của tôi: Pāli chỉ có pañcindriyāni. Tôi thêm để câu đọc
    được ở tiếng Việt, vì năm căn ấy đã nằm trong sáu; nếu người biên tập muốn bám sát chữ thì
    đổi thành năm căn.

    Thuật ngữ có tiền lệ, đếm được: rakkhitacitta → có tâm được phòng hộ; sammāsaṅkappa → chánh
    tư duy; gocara → cảnh giới; lakkhaṇa → dấu hiệu (19 chỗ trong khuddaka); gahita → được nắm giữ;
    niyutto → đã được vận dụng; padaṭṭhāna nền tảng.
    Chuỗi tám chi phần ở khoá 2.5: chánh kiến (586) · chánh tư duy · chánh ngữ (133) · chánh nghiệp ·
    chánh mạng · chánh tinh tấn (128) · chánh niệm (391) · chánh định (258) · chánh giải thoát (85).
    `sammākammanta` tôi dịch là chánh nghiệp chứ không phải chánh hành động (0 tiền lệ), vì trong
    tầng đã có 51 chỗ dùng đúng cụm chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm;
    đổi vế thứ ba thành chánh hành động sẽ phá vỡ cả chuỗi đã dùng. `sammāvimuttiñāṇadassana` →
    sự biết và thấy trong chánh giải thoát, bám theo cách tầng dịch ñāṇadassana là biết và thấy.
    `ariyo aṭṭhaṅgiko maggo` → Thánh đạo tám chi phần.

    KHÁC BÀI CÙNG CÔNG THỨC, ĐÃ SO SÁCH. ne35:3.2–3.4 có đúng nội dung 2.3–2.5 của bài này,
    chỉ khác ở chỗ ne35 nói `bhāvitāya bhāvito` (được tu tập) còn ne24 nói `gahitāya gahito` (được
    nắm giữ). Tôi giữ đúng sự khác biệt đó, không lấy chữ của ne35 sang.
    Dấu lược: cả bài không có `…pe…` nên hai phía đều 0.
    Kiểm kỹ thuật: save_vi sạch, chạy hai lần idempotent (sha256 không đổi). Vì mọi khoá Pāli của Theragāḵā ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và các assertion không tự chạy, tôi tự quét MỌI khoá: đủ 11/11 khoá; đúng ID; thứ tự khoá y hệt Pāli; không rỗng; NFC; dấu lược bằng Pāli (2 = 2 ở dòng kết); nháy kép cân trên cả bài; không còn `(…)`; không có ký tự ngoài Latin. Không chạy npm run validate|test|check|build (đợt này cấm) nên technical_integrity = 9.6, không phải 10.  Không đối chiếu được tầng Việt hiện hành: bilara tại commit đã ghim chỉ có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Đây là giới hạn của bản chụp upstream, đã ghi ở content/meta/reference-gaps.yaml.
