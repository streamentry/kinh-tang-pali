    xác nhận (`12.1` `te buddha`, `12.6` `buddho udakaṁ apāyī`). Pāli là authority nên tôi
    dịch *bị chính Đức Phật truy hỏi;*, không chép *Tôn giả Moggallāna* của 24 bài kia.
    Ghi rõ vì đây là khác biệt thật với phần lớn tầng.
  - `Akkhāmi te buddha mahānubhāva` (12.1) — `Akkhāmi te bhikkhu …` xuất hiện **16** lần và
    dịch *Để tôi nói cho ngài, bậc tỳ-kheo, về đại oai lực ấy:*; ở đây tân ngữ là `buddha`,
    nên tôi dịch *Để tôi nói cho Đức Phật về đại oai lực ấy:* và bỏ dấu phẩy vì `Đức Phật`
    là tên gọi chứ không phải từ bổ nghĩa cho `ngài`.
  - `Vaṇṇo ca me sabbadisā pabhāsati;` (12.4) — **trùng gần** chứ không trùng byte với
    `vv6:10.4` (`…pabhāsatī”ti.`): khác ở thì (`pabhāsati` hiện tại) và ở dấu (`;` chứ không
