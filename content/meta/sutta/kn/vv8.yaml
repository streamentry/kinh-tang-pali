    *mọi phương* của 55 cặp `Vaṇṇo ca me sabbadisā pabhāsatī”ti.`, chỉ đổi dấu chấm.
    Đây là ngoại lệ **có ý** so với luật "Pāli trùng thì chép nguyên văn", vì Pāli khác.
  - `mamedaṁ` (12.5) — 9 chỗ trong Pāli ghim; ở `vv3:5.1` nó đứng cạnh
    `Appassa kammassa phalaṁ mamedaṁ, / Yenamhi evaṁ jalitānubhāvā;` và đã dịch *Tôi từng
    tưởng quả báo của việc ấy / nhỏ bé thôi*, tức là `mā` + `idaṁ` = "chỉ bấy nhiêu đó".
    Ở đây `Etassa kammassa phalaṁ mamedaṁ` là vế đầu của một cặp đối xứng với `vv5:10.1–10.2`
    (`Tassa kammakusalassa, / idaṁ me īdisaṁ phalaṁ;` → *quả báo như thế này*), nên tôi dịch
    *Quả báo của nghiệp ấy chỉ là thế này,*.
  - `Atthāya buddho udakaṁ apāyī` (12.6) — `apāyī` là aorist của `pā` "cho, dâng" (động từ
