  khác — mẫu số khác 0, phép này **có** đo được.
  (4) Dấu lược: Pāli có `…pe…` 0 chỗ và `…` trần 0 chỗ, bản Việt cũng 0 và 0; `(…)` 0 ở
  cả hai đầu nên không có chỗ nào phải giữ. Mọi khoá khớp 0 = 0.
  (5) NFC, khoá rỗng, khoảng trắng thừa, Pāli lọt sang tiếng Việt: 55 khoá, 0 lệch. Sáu
  khoá giữ chữ Pāli **có chủ ý**: `0.1` `Vimānavatthu` (64/65 bài `vv`), `0.3` `Pīṭha`,
