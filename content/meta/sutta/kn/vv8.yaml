    `samantā caturo disā`) lấy y nguyên từ `vv78:6.2–6.4`, vì đó là đuôi cố định của
    cả phẩm.
  - `sambuddheneva pucchitā` (5.2) — **hapax** toàn Pāli ghim (1 chỗ). Khung `vv` là
    `moggallānena pucchitā` ở 18 bài và `moggallānena pucchito` ở 6 bài, nhưng **bài này
