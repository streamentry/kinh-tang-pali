  **Văn phong: đã đọc Pāli rồi kết luận, không suy đoán từ tên bộ.** `vv8` **là** thơ kệ:
  13 khúc, mỗi khúc 4 vế ngắn, cộng một dòng kết `13.1`. Xác nhận bằng chính hình thức:
  51/55 khoá kết bằng `,` `;` hoặc `.`, và **10** khoá bắt đầu bằng chữ thường — đúng khuôn
  "vế đầu viết hoa, vế sau nối liền" mà vv6/vv7/vv9 đang làm. Bài này viết đúng khuôn đó:
  chỉ vế đầu của mỗi khúc và các khoá tiêu đề `:0` viết hoa.

  **46/55 khoá có Pāli trùng nguyên văn với khoá đã dịch ở nơi khác, và 46 khoá đó tôi
  dùng lại y nguyên văn bản dịch đã có** — không dịch lại từ đầu. Đếm trên toàn tầng Việt
  dự án (5.444 tệp): **568** cặp trùng đã dò, trong đó **467** cặp có bản Việt **y hệt**
  bản của tôi và **101** cặp khác. Nguồn dùng lại: `vv6` cho 37 cặp khoá (và 3 khoá tiêu
  đề `0.1`–`0.3`), `vv78:6.2–6.4` cho 6 khoá (`2.2`–`2.4`, `10.2`–`10.4`); `12.4` lấy từ
  `vv6:10.4` rồi đổi dấu chấm cho khớp Pāli. Lý do để dùng `vv6` chứ không phải `vv7` là
  **văn ngữ**: `vv7:5.3`/`6.1` Pāli viết số ít (`bhikkhuṁ`, `kilantassa pipāsitassa`) nên
  bản dịch dùng *một vị tỳ-kheo* / *vị ấy*, còn vv8 Pāli ở `6.3`/`7.1` viết **số nhiều**
  (`bhikkhū`, `kilantāna pipāsitānaṁ`) y hệt vv6 — chép `vv7` vào đây sẽ mâu thuẫn với chính
  `vv8:6.3` và `vv8:6.4`. 101 cặp lệch rơi vào `4.4` (31), `11.1` (13), `3.1` (12), `5.4`
  (12), `11.3` (8), `3.3` (6), `6.1` (6), còn lại rải đều; xem lý do ở các mục dưới.

  **Sáu chỗ phải tự dịch, ghi thẳng ra chứ không bịa chỗ trống.**
  - `Kūṭāgārā nivesā te/me` (2.1, 10.1) — **0 tiền lệ** cho `nivesā` trong tầng Việt (đếm
    cả Pāli ghim: chỉ **3** chỗ, vv8 hai chỗ và `vv44:10.1`, mà vv44 chưa dịch). `kūṭāgāra`
    dịch *lầu gác* theo đa số **9/11** chỗ `Kūṭāgārā sattasatā uḷārā` trong phẩm `vv`
    (1 chỗ *lầu các*, 1 chỗ *nhà gác*). `nivesā` là danh từ "chỗ ở, nơi ngự", nên câu là
    "Những lầu gác là nơi ở của ngài," / "...của tôi," — đối xứng đúng ngôi kể của cặp
    `te`/`me`. Ba vế sau (`vibhattā bhāgaso mitā`, `Daddallamānā ābhanti`,
    `samantā caturo disā`) lấy y nguyên từ `vv78:6.2–6.4`, vì đó là đuôi cố định của
    cả phẩm.
  - `sambuddheneva pucchitā` (5.2) — **hapax** toàn Pāli ghim (1 chỗ). Khung `vv` là
    `moggallānena pucchitā` ở 18 bài và `moggallānena pucchito` ở 6 bài, nhưng **bài này
    không viết vậy**: nó viết người hỏi là chính Đức Phật, và hai chỗ khác trong cùng bài
    xác nhận (`12.1` `te buddha`, `12.6` `buddho udakaṁ apāyī`). Pāli là authority nên tôi
    dịch *bị chính Đức Phật truy hỏi;*, không chép *Tôn giả Moggallāna* của 24 bài kia.
    Ghi rõ vì đây là khác biệt thật với phần lớn tầng.
  - `Akkhāmi te buddha mahānubhāva` (12.1) — `Akkhāmi te bhikkhu …` xuất hiện **16** lần và
    dịch *Để tôi nói cho ngài, bậc tỳ-kheo, về đại oai lực ấy:*; ở đây tân ngữ là `buddha`,
    nên tôi dịch *Để tôi nói cho Đức Phật về đại oai lực ấy:* và bỏ dấu phẩy vì `Đức Phật`
    là tên gọi chứ không phải từ bổ nghĩa cho `ngài`.
  - `Vaṇṇo ca me sabbadisā pabhāsati;` (12.4) — **trùng gần** chứ không trùng byte với
    `vv6:10.4` (`…pabhāsatī”ti.`): khác ở thì (`pabhāsati` hiện tại) và ở dấu (`;` chứ không
    đóng ngoặc kép, vì ngoặc kép của bài đóng ở `12.6`). Giữ nguyên lựa chọn *sắc tướng* +
    *mọi phương* của 55 cặp `Vaṇṇo ca me sabbadisā pabhāsatī”ti.`, chỉ đổi dấu chấm.
    Đây là ngoại lệ **có ý** so với luật "Pāli trùng thì chép nguyên văn", vì Pāli khác.
  - `mamedaṁ` (12.5) — 9 chỗ trong Pāli ghim; ở `vv3:5.1` nó đứng cạnh
    `Appassa kammassa phalaṁ mamedaṁ, / Yenamhi evaṁ jalitānubhāvā;` và đã dịch *Tôi từng
    tưởng quả báo của việc ấy / nhỏ bé thôi*, tức là `mā` + `idaṁ` = "chỉ bấy nhiêu đó".
    Ở đây `Etassa kammassa phalaṁ mamedaṁ` là vế đầu của một cặp đối xứng với `vv5:10.1–10.2`
    (`Tassa kammakusalassa, / idaṁ me īdisaṁ phalaṁ;` → *quả báo như thế này*), nên tôi dịch
    *Quả báo của nghiệp ấy chỉ là thế này,*.
  - `Atthāya buddho udakaṁ apāyī` (12.6) — `apāyī` là aorist của `pā` "cho, dâng" (động từ
    `Anantapāyī` ở `ja296` là từ khác, không phải chứng cứ cho nghĩa này). `Atthāya` là
    "vì điều ấy". Dịch *Vì điều ấy, Đức Phật đã dâng nước.*

  **Thuật ngữ, đều kèm số đếm.** `sabbadisā` phân theo đúng vế ngữ như quy ước đã đo ở
  `vv6`/`vv7`: câu hỏi `…te sabbadisā pabhāsatī` → *muôn phương* (12/43 cặp trùng), câu đáp
  `…me sabbadisā` → *mọi phương* (55/55 cặp trùng cùng dạng với `vv6:10.4`).
  `attamanā` → *hoan hỷ* (22/23); `pucchitā` → *truy hỏi*; `mahānubhāve`/`mahānubhāva` →
  *đại oai lực*; `yassa kammassidaṁ phalaṁ` → *quả báo của nghiệp này là thế* (34/46);
  `Kena tetādiso vaṇṇo` → *Do đâu nàng có được dung sắc như thế,* (18/30);
  `kena te idha mijjhati` → *Do đâu nàng có được nơi này;* (12/14);
  `Uppajjanti ca te bhogā` → *Và của cải nào hiện khởi cho nàng,*;
  `ye keci manaso piyā` → *dù là gì dễ chịu với tâm.* (27/28);
  `bhogā` → *của cải*; `sīlodakā` → *nước mát lạnh*; `najjo` → *tấm gương*;
  `vālukasanthatā nadī` → *trải phủ cát chặt thành một dòng sông*; `puṇḍarīkā` → *bông sen*;
  `pokkharaṇi` → *sàn thuyền* (theo `pv28`, vì `ogāhasi` là bước xuống sàn, không phải
  hồ sen); `suvaṇṇa` → *vàng* (ở đây `Suvaṇṇacchadanaṁ` là *bọc vàng*); `ambā`/`sālā` giữ từ
  Việt phổ thông, còn `tilaka`/`jambu`/`uddālaka`/`pāṭali` giữ Pāli theo tiền lệ ở
  `vv6`/`vv7` và `tha-ap`.

  **Số Pāli, tự tính và in phép ra.** Toàn bài chỉ có ba con số, và cả ba đều viết ra đúng
  như cấu tạo Pāli: (1) `0.4` `8.` → 8, và `13.1` `aṭṭhamaṁ` = thứ tám — hai chỗ **khớp
  nhau**, không có mâu thuẫn cần phân xử; (2) `2.4`/`10.4` `caturo disā` = bốn phía (4),
  dùng lại nguyên văn `vv78:6.4`; (3) `Tatiyanāvā` = Nāvā thứ ba. Không có mục `Tiṁsa`
  hay cụm chưa phân xử nào trong bài, nên không có số nào phải ước đoán.

  **Năm phép kiểm, in kèm mẫu số.**
  (1) Tập khoá: 55/55 khớp Pāli, cả tập và cả thứ tự.
  (2) Nháy `‘’` và `“”` khớp Pāli **từng khoá**: so 55 khoá × 4 loại dấu = 220 phép,
  0 lệch. Pāli mở `“` ở `1.1` và `6.1`, đóng `”` ở `4.4` và `12.6` — tức **hai** lời
  thoại riêng, và bản Việt đặt ngoặc đúng hai lần, không gộp.
  (3) Pāli trùng **trong chính bài** mà Việt khác: **4** nhóm trùng
  (`2.2`↔`10.2`, `2.3`↔`10.3`, `2.4`↔`10.4`, `3.4`↔`11.4`), **0** cặp trong đó bản Việt
  khác — mẫu số khác 0, phép này **có** đo được.
  (4) Dấu lược: Pāli có `…pe…` 0 chỗ và `…` trần 0 chỗ, bản Việt cũng 0 và 0; `(…)` 0 ở
  cả hai đầu nên không có chỗ nào phải giữ. Mọi khoá khớp 0 = 0.
  (5) NFC, khoá rỗng, khoảng trắng thừa, Pāli lọt sang tiếng Việt: 55 khoá, 0 lệch. Sáu
  khoá giữ chữ Pāli **có chủ ý**: `0.1` `Vimānavatthu` (64/65 bài `vv`), `0.3` `Pīṭha`,
  `0.4`/`13.1` `Nāvā`, `8.3` `sāl`/`tilaka`/`jambu`, `8.4` `uddālaka`/`pāṭali` — tổng
  cộng 262 khoá trong 65/65 tệp `vv` đã có cùng thói quen này.

  Bốn lệnh cổng kỹ thuật do người điều phốn chạy, không chạy trong lát dịch:
