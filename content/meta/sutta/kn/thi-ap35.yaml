notes: |-
  Bài kinh thi-ap35 — Sukkātherīapadāna, bài thứ năm của Phẩm Khattiya trong
  Therīapadāna. 131/131 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào
  ngoài tập khoá Pāli. Bài kể về vị ni Sukkā: thời Đức Phật Vipassī sinh ở Bandhumatī,
  xuất gia, đa văn, thuyết pháp rồi sinh lên cõi Đâu-suất; thời Đức Sikhī và Đức Vessabhū
  (cùng ba mươi mốt kiếp trước), Đức Kakusandha, Đức Koṇāgamana và Đức Kassapa đều xuất
  gia, soi sáng giáo pháp rồi sinh lên cõi trời; đời cuối sinh ở Giribbaja trong gia đình
  triệu phú, thấy Đức Thế Tôn cùng một ngàn tỳ-kheo vào Rājagaha thì khởi tịnh tín, sau
  xuất gia nơi Dhammadinnā, thuyết pháp giữa hội chúng đông và có hàng ngàn người chứng
  ngộ; một dạ-xoa kinh ngạc, đi khắp Giribbaja nói những lời ca ngợi (25.1–26.4); bà đạt
  sáu thần thông và bốn vô ngại giải.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt:
  - :0.1 Therīapadāna giữ nguyên Pāli (26 khoá cùng Pāli: 25 giữ nguyên, 1 dịch Trưởng
    Lão Ni Ký Sự); :0.2 Khattiyāvagga → Phẩm Khattiya (8/8 khoá cùng dạng).
  - translationTitle bằng đúng giá trị :0.3 từng ký tự.
  - Số thứ tự ở :0.3: Pāli :0.3 là Sukkātherīapadāna, KHÔNG bắt đầu bằng số nên bản Việt
    không thêm số (khớp chính sách bỏ số khi Pāli không có số; 0 trường hợp thừa số trong
    toàn tầng tha-ap theo đo của phẩm). Bài liền kề thi-ap34 (Pāli có số 4) giữ số;
    bài này khác vì Pāli khác.
  - Công thức tiêu đề Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni: theo các bài kề cận trong
    Phẩm Khattiya (thi-ap31, 33, 34, 36, 37, 38, 39, 40 đều Tuyên Ngợ, 0 bài Tuyên Ngôn;
    trong cả thi-ap đã dịch chỉ thi-ap29 dùng Tuyên Ngôn). Toàn tầng tha-ap theo số đo đã
    ghi ở thi-ap34: Tuyên Ngợ 251, Tuyên Ngôn 132, Ký Sự 111 (không đo lại ở bài này). Tuyên Ngợ có vẻ là chính tả sai của
    Tuyên Ngôn; cần người biên tập phán một lượt cho cả cuốn chứ không sửa riêng bài này.
  - Khoá :33.1 là lời kết Itthaṁ sudaṁ … abhāsitthāti; imā gāthāyo là số nhiều nên dịch
    những bài kệ này theo nhóm đa số (407 khoá so với 21 khoá bài kệ này, theo đo của
    phẩm), cùng dạng với thi-ap34, 36, 39. :34.1 pañcamaṁ → thứ năm (thi-ap15:27.1 dịch
    thứ năm cho đúng Pāli). :34.2 Pañcamaṁ bhāṇavāraṁ → Phần tụng đọc thứ năm, theo
    dạng đa số của tầng cho bhāṇavāra (Navamaṁ → thứ chín, Dasamaṁ → thứ mười,
    Ekādasamaṁ → thứ mười một, Vīsatimaṁ → thứ hai mươi: 4 khoá tha-ap; còn
    Tatiyabhāṇavāraṁ → Hết phần tụng đọc thứ ba, Catutthabhāṇavāraṁ → Lần thứ tư là
    các dạng lẻ khác).
  - Tên người: Vipassī, Sikhī, Vessabhū, Kakusandha, Koṇāgamana, Kassapa, Dhammadinnā,
    Sukkā, Bandhumatī, Rājagaha, Giribbaja giữ nguyên Pāli (tên riêng, theo thi-ap36,
    37, 38, 39).

  SỐ PĀLI — tự tính, tiṁsa = 30 (không phải 3):
  - Ekanavutito (1.1) = eka 1 + navuti 90 = 91 → chín mươi mốt kiếp trước; thi-ap6, 10,
    11, 12, 36 đều dịch Vào chín mươi mốt kiếp trước (5/5).
  - Ekattiṁse ito (5.1) = eka 1 + tiṁsa 30 = 31 → ba mươi mốt kiếp trước; thi-ap33 và
    thi-ap39 (Ekattiṁse ito kappe) và thi-ap8 (Ekatiṁse ito kappe, một chữ t) đều là ba
    mươi mốt; tha-ap174:3.1 Ekattiṁsamhi = ba mươi mốt kiếp. Toàn tầng 55 khoá cùng
    Pāli: Từ ba mươi mốt kiếp trước 19, Vào ba mươi mốt kiếp trước 16, Vào ba mươi mốt
    kiếp trước đây 15, Kể từ 3 (53/55 khoá, 2 khoá còn lại dạng lẻ); bài này dùng dạng Vào
    ba mươi mốt kiếp trước theo thi-ap33 và thi-ap39 (gần nhất).
  - Ekattiṁseva (7.1) = ekattiṁsa 31 + eva (chính, ngay) → Ngay trong ba mươi mốt kiếp
    ấy; Đức Sikhī và Đức Vessabhū cùng thuộc kiếp ba mươi mốt kể từ nay. Không có tiền
    lệ nguyên dạng (0 khoá).
  - Bài KHÔNG có cụm Tiṁsakappasahassa; không cần phân xử 3.000 hay 300.000 hay 30.000.
  - bhikkhusahassena (18.1) = sahassa 1.000 → một ngàn tỳ-kheo; Nekapāṇasahassānaṁ
    (24.1) = neka (không phải một, nhiều) × pāṇa × sahassa → của nhiều ngàn chúng sinh,
    không quy thành số cụ thể.
  - tīsu sikkhāsu (15.2) = ba → ba học pháp (thi-ap34:6.4 dịch ba học pháp);
    Tāvatiṁsa (16.4) = Ba mươi ba (tên cõi trời, không phải phép tính số kiếp);
    Paṭisambhidā catasso (32.1) = bốn → Bốn vô ngại giải; pañcama (34.1, 34.2) = thứ năm.
  - Không có phép nhân lớn nào khác, nên máy kiểm số Pāli của kho không có gì để đo ở bài
    này — chỉ có phép tự tính ở trên, không phải một phép kiểm tự động đã pass.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò toàn tầng (gồm cả các bài thi-ap vừa dịch trong đợt
  này), dùng lại nguyên văn bản dịch:
  - Trong 131 khoá, 58 khoá có Pāli trùng byte với tầng đã dịch (kể cả 3 khoá …pe… và
    hai khoá :0.1, :0.2). 55/58 khoá dùng đúng một dạng đã có trong tầng; 51/58 khoá
    dùng đúng dạng đa số. 3 khoá khác mọi dạng đã có, đều có chủ ý:
    * 22.2 kilese jhāpayiṁ ahaṁ: tiền lệ duy nhất (tha-ap224:3.2) dùng ngôi con và mọi
      phiền não; bài này dùng ta cho người kể xuyên suốt, và các phiền não.
    * 25.3 Ye sukkaṁ na upāsanti: tiền lệ duy nhất (thig3.6:1.3) dịch Lại không đến thân
      cận nàng Sukkā; ye là đại từ quan hệ (những người nào không…), chữ Lại không có
      căn cứ trong Pāli, nên bài này dịch những người không đến thân cận nàng Sukkā.
    * 26.1 Tañca appaṭivānīyaṁ: tiền lệ duy nhất (thig3.6:2.1) dịch Giáo pháp ấy; ở
      thig3.6 taṁ chỉ buddhasāsanaṁ (thig3.6:1.4), còn ở đây taṁ chỉ amataṁ padaṁ
      (25.4) nên dịch trung tính Điều ấy, không thêm chữ giáo pháp vào chỗ Pāli không có.
    4 khoá dùng dạng không phải đa số nhưng có trong tầng: 1.2 (bậc Dẫn Đạo tên là
    Vipassī, 1 trong 2 dạng), 5.1 (xem phần số Pāli), 20.3 (khởi tâm tịnh tín nơi Đức
    Phật; dạng đặt trọn lòng tin có 2 khoá, tịnh tín có 2; chọn tịnh tín vì pasādetvā là
    làm cho tịnh tín), 28.4 (tái sanh 14 / tái sinh 14, hoà trong các khoá cùng Pāli; toàn tầng khoá
    punabbhavo: tái sinh 35, tái sanh 18; chọn tái sanh vì cả 7 bài thi-ap kề cận — thi-ap33,
    34, 36, 37, 38, 39, 40 — đều dùng tái sanh).
  - 25.1, 25.2, 26.2, 26.3, 26.4 dùng nguyên văn tiền lệ thig3.6 (cùng kệ): Người dân
    thành Rājagaha làm sao thế; nằm đờ đẫn như vừa uống say mật ngọt; thuần khiết thanh
    lương và tràn đầy bổ dưỡng; Những bậc có trí dường như đang uống lấy; như người bộ
    hành đón nhận làn mây mát rượi. Bản Anh Sujato của thig3.6 cho cùng kệ (What’s up
    with these people in Rājagaha; they sprawl like they’ve been drinking mead; so
    irresistible, delectable, and nutritious) là tham khảo gián tiếp cho 8 khoá 25.1–26.4,
    KHÔNG phải bản Anh của thi-ap35.
  - 27.1–29.4 và 30.1, 31.1, 31.3, 32.1, 32.3 (công thức thần thông và lời kết) dùng
    nguyên dạng đa số của tầng (cùng dạng với thi-ap34, 36, 37 khi dùng ngôi ta).
  - Trong chính bài có 6 nhóm Pāli trùng nguyên văn (không kể …pe…): pabbajiṁ anagāriyaṁ
    (2.4, 21.4), Bahussutā dhammadharā (3.1, 12.3), Tadāpi pabbajitvāna (6.1, 12.1),
    tadāpi ca tathevahaṁ (7.4, 9.4), Imasmiṁyeva kappamhi (11.1, 13.1), Uppajji
    lokasaraṇo (11.3, 13.3), và ba khoá …pe… (30.2, 31.2, 32.2, đều là … đúng một dấu
    lược): 9 cặp, 0 cặp lệch. 31.3 và 32.3 chỉ khác dấu đóng ngoặc kép nên không tính là
    trùng; bản Việt cũng chỉ khác đúng ở dấu đó.

  THUẬT NGỮ — kèm số đếm:
  - jina → Chiến Thắng; nāyaka → Dẫn Đạo (156 trong 265 khoá có nāyak, so với Lãnh Đạo
