    (ne17); không có tiền lệ cho araṇo làm danh hiệu của Đức Phật (0 khoá khác).
    amataṅgato → đã đi đến sự bất tử; maraṇantagū → đã đến tận cùng của sự chết
    (antagū → đến tận cùng, 9 khoá, vd lokantagū; 0 tiền lệ cho maraṇantagū).
  - vicittakathikā → thuyết giảng tài hoa (tha-ap537 ×3); jinasāsanakārikā → người làm
    theo giáo pháp của bậc Chiến Thắng (tha-ap491:10.4); paṭibhāna → biện tài (theo công
    thức 29.2); tusita → Đâu-suất (tha-ap452:2.1); tidiva → cõi trời (3 khoá); vipassaka
    → quán chiếu (8 khoá có vipassak: quán chiếu 2, quán sát 2, tuệ quán 2, bậc thấy
    pháp 2); visārada → tự tin (15 trong 21 khoá có visārad); paripucchā → vấn hỏi (mil5.1.4).
  - yakkha → dạ-xoa (snp1.9, snp1.10, ud4.10); amataṁ padaṁ → cảnh giới bất tử (13
    trong 17 khoá, vd tha-ap332, 486, 563); sahassakkha → vị Ngàn Mắt (ja489:20.3 Sakka Ngàn
    Mắt); vaṇṇita → ca ngợi; sikhī → ngọn lửa (cp29, ja61, bv23); danta → điều phục;
    vippamutta → giải thoát; purāṇajaṭila → cựu đạo sĩ bện tóc (0 tiền lệ).
  - siṅgīnikkha → khối vàng siṅgī (tha-ap541:10.2 siṅgīnikkhasamappabho → có hào quang
    như khối vàng siṅgī); guṇasañcaya → khối phẩm đức (tha-ap533:22.4 khối tích tụ đức
    hạnh); buddhānubhāva → uy lực của Đức Phật (tha-ap550:14.1 oai lực ấy của Đức Phật;
    tha-ap119 sức mạnh của chư Phật); yathābalaṁ → tùy theo sức mình (cp10:6.2);
    pariyāpuṭa → học thuộc (pariyāpuṇitvā → học thuộc, 3 khoá).
  - Không có tiền lệ, dịch theo nghĩa Pāli: sabbadhammavipassako → bậc quán chiếu mọi
    pháp; marupuraṁ rammaṁ → thành xinh đẹp của chư thiên; anubhosiṁ mahāsukhaṁ → ta đã
    hưởng niềm an lạc lớn lao; munimataṁ → giáo pháp của bậc Mâu-ni; yathāyukaṁ → cho đến
    hết tuổi thọ; jinavākyāni → những lời dạy của bậc Chiến Thắng; sabbadhamma, tapanto
    yasasā → rực sáng bằng danh tiếng; naravīra, susīlā lajjinī → có giới hạnh tốt, biết
    hổ thẹn.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - 22.4 pabbajitvā cirenahaṁ: cirena có thể là sau một thời gian dài (đọc theo nghĩa
    từng chữ) hoặc chẳng bao lâu (nếu hiểu theo cách dùng na cirena); Pāli không có na.
    Bản Việt giữ nghĩa từng chữ: sau khi xuất gia, trải qua thời gian dài, không quyết
    giữa hai cách hiểu. 0 tiền lệ cho cirenahaṁ.
  - 24.1–24.4: Nekapāṇasahassānaṁ có thể đi với taṁ (sự chứng ngộ ở 23.4 của hàng ngàn
    chúng sinh). Bản Việt đọc taṁ là điều ấy, theo 23.4, và giữ nguyên thứ tự câu Pāli; chủ
    ngữ của viditvā, ativimhito, abhippasanno là yakkho ở 24.3 (cùng thể nominative).
    Pāli không có động từ nói (āha) ở 24.4 trước 25.1: không thêm lời dẫn. Việc 25.1–26.4
    là lời của vị dạ-xoa là suy từ cấu trúc (24.3 yakkho, 25.3 sukkaṁ nói về Sukkā ở ngôi
    thứ ba) và từ thig3.6, không thêm vào thân kinh.
  - 18.4 sahassakkhena: epithet của Sakka; Pāli không nêu tên Sakka nên bản Việt dịch vị
    Ngàn Mắt, không thêm tên Sakka.
  - 10.2 jotayitvā yathāyukaṁ: Pāli không nêu tân ngữ; bản Việt giữ soi sáng cho đến hết
    tuổi thọ, tân ngữ ngầm hiểu là giáo pháp như 8.2, 12.4 nhưng không viết vào.
  - 7.1 Ekattiṁseva kappamhi: eva có thể là chính/ngay (cùng kiếp với 5.1) hoặc chỉ nhấn;
    dịch Ngay trong ba mươi mốt kiếp ấy, theo nghĩa ngay cùng kiếp.
  - 5.2 sikhī viya sikhī jino: sikhī vừa là tên Đức Phật vừa là ngọn lửa (cũng nghĩa
    chim công); bản Việt dịch Đức Sikhī, như ngọn lửa, bậc Chiến Thắng, không chọn nghĩa
    chim công.
  - 9.3 narasaraṇo: dạng Pāli ghim là narasaraṇo (không phải narasāraṇo); dịch nơi nương
    tựa của loài người, cùng cấu tạo lokasaraṇo.
  - 11.4 và 13.4 araṇo: có thể hiểu là không phiền não (raṇa) hoặc không tranh chấp;
    dịch vô tránh, không quyết giữa hai cách hiểu.
  - 19.1–19.2 Danto dantehi saha purāṇajaṭilehi: dantehi đi với purāṇajaṭilehi (những cựu
    đạo sĩ bện tóc đã điều phục); vippamuttehi ở 19.2 không có tân ngữ riêng và đọc như
    dantehi. Bản Việt chia thành hai vế cùng cấu trúc.
  - 14.2 pabbajitvāna sāsane và 14.1 Tassāpi naravīrassa: dịch tách thành hai khoá giữ
    đúng thứ tự Pāli; -pi dịch cũng.
  - 24.3 yakkho: dạ-xoa (không phải thần linh nói chung).
