notes: |-
  Sửa lan 2026-10-13: khổ 4 bị lệch dòng và lặp nghĩa. 4.1 `Sāgāresu ca cīvaraṁ` "Từ người có nhà, người không nhà" → "Từ người có nhà, y phục," (`sāgāresu` = từ những người có nhà, `cīvaraṁ` = y; `anagārā` là chủ ngữ ở 4.3, không thuộc 4.1); 4.2 `paccayaṁ sayanāsanaṁ` "nhận được y phục, vật dụng," → "vật dụng, chỗ nằm chỗ ngồi;" (khớp 15/18 chỗ cùng Pāli ở tầng (pv22 ×2, pv36 ×2, bv14, ja541 ×5, thi-ap19/28/30/32, tha-ap397); 3 chỗ còn lại (thag7.4, thi-ap31, thi-ap33) dịch khác); 4.3 `Anagārā paṭicchanti` "chỗ nằm và chỗ ở," → "người không nhà thọ nhận," (bản cũ dịch lặp `sayanāsanaṁ` và bỏ mất chủ ngữ `anagārā` cùng động từ `paṭicchanti`). Tập khoá giữ nguyên; điểm cũ không đổi.
