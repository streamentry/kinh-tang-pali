notes: |-
  **Phạm vi: đủ 53/53 khoá của `all`**, không có khoá nào ngoài lát. Thứ tự khoá trong tệp
  dịch bằng đúng thứ tự Pāli. Năm phép tự viết đều chạy trên 53/53: (1) tập khoá Việt bằng tập
  khoá Pāli — 53 = 53, đối xứng 0; (2) nháy kép `“”` khớp Pāli từng khoá — 0 lệch trên 53
  (Pāli mở 2, đóng 2; bản Việt mở 2, đóng 2, đúng vị trí 1.1/7.4 và 8.1/12.4); (3) Pāli trùng
  nguyên văn trong chính bài — chỉ **1** nhóm, `8.1` + `9.3` (cùng `Yathā ca me adhigatamidaṁ
  vimānaṁ`), và bản Việt **dùng lại nguyên văn** cho cả hai; (4) dấu lược — Pāli không khoá nào
  có `…pe…`, `…` trần hay `(…)`, bản Việt cũng 0 ⇒ 53/53 khớp 0 = 0, không chỗ nào bị mở rộng
  hay bị cắt; (5) số Pāli — xem dưới. Thêm: NFC 0 lỗi, khoá rỗng 0, thừa khoảng trắng 0.

  **VĂN PHONG — đã đọc Pāli rồi kết luận, không suy từ tên bộ.** `vv35` là **thơ**, không phải
  văn xuôi: 12 bài kệ 4 vế (`1.1`–`12.4` = 48 vế) + 4 khoá tiêu đề + 1 khoá chốt phẩm `13.1`.
  Chiều dài Pāli **ngắn nhất 11, dài nhất 35 ký tự**. Bối cảnh là nữ thiên kể với vua Trời Inda
  về kiếp trước của bà, nên bản Việt giữ nhịp kệ, không văn xuôi hoá. (Cảnh báo của người điều
  phối về `pv35` không áp dụng ở đây: đọc Pāli thì `vv` **đúng** là kệ.)

  **Nguồn.** Dịch từ Pāli root đã ghim (`source/upstream-manifest.json`, commit `11c9d708`, tầng
  `pali`, 5.764 tệp; `kn/vv` có 85 tệp, `vv35_root-pli-ms.json` có trong đó). Không tầng Anh, không
  bản Việt hiện hành (HT. Thích Minh Châu) — xem `blocking_errors`.

  **Coverage tầng Anh — cổng KHÔNG đo được gì.** Mẫu số = số khoá Pāli *có nội dung*
  (`≥ 40` ký tự theo `source/layers.yaml`, bỏ khối `:0`) = **0 trên 53**. Khuôn kệ của `vv` quá
  ngắn nên không khoá nào đạt ngưỡng. Đây là *mẫu số bằng 0*, **không phải** *không cần ghi nhận
  gap*, và cũng không phải lý do cho blocker.

  **MỆNH ĐỀ ĐO ĐƯỢC (đếm trên tầng, nêu cả hai phạm vi khi đa số khác nhau).** Đo trên 63 tệp `vv`
  đã có bản Việt (kể cả tệp này) và trên 62 tệp metadata `vv`:
  · `Vimānavatthu` (0.1): giữ nguyên Pāli **62/63** ⟵ *Chuyện về cảnh giới thần* 1.
  · `Itthivimāna` (0.2): *Chuyện Cung Điện Nữ Hư Không* **36/63** ⟵ *Chuyện Cung Điện Nam Hư
    Không* 17 ⟵ *Thiên Cung Của Nam Giới* 5 ⟵ *Purisavimāna* 3. (17+5+3 dạng *Nam* là **sai giới
    tính** — `Itthi` là nữ; đa số đo được là dạng *Nữ*.)
  · `Pāricchattakavagga` (0.3): *Phẩm Cây San Hô* **7/7 tệp đã có mặt** trong chính phẩm này
    (`vv29/30/31/32/35/36/38`), và **7/63** toàn tầng ⟵ *Phẩm Pīṭha* 13, *Phẩm Cây Hoa Cittalatā* 9.
    Củng cố bằng tầng tên đã ghim `vv-name:32.vv-paricchattakavagga` = *The Chapter With the Coral
    Tree*.
  · Khoá `0.4` — hai quy ước **khác nhau**, đã đo riêng và làm theo cả hai: trong **tệp dịch** số
    thứ tự được **giữ** ở **63/63** khoá ⇒ `7. Chuyện Cung Điện Nữ Pesavatī`; trong **metadata**
    trường `translationTitle` số thứ tự được **bỏ** ở **49/62** ⟵ giữ 13 ⇒
    `Chuyện Cung Điện Nữ Pesavatī`. Đầu câu *Chuyện Cung Điện* là **36/36** trong nhóm tệp có
    `0.2` dạng nữ.
  · Chữ *Nữ* trong `0.4`: toàn tầng 17 có / 19 không; riêng `Pāricchattakavagga` 3 có / 4 không.
    Tôi vẫn dùng *Nữ* vì hai tệp **cùng loại** trong phẩm này — `vv32` Latā và `vv36` Mallikā,
    đều là tên riêng nữ — đều có *Nữ*, còn bốn tệp không có thì đều không phải tên nữ (`Uḷāra`,
    `Ucchu`, `Pallaṅka`, `Pāricchattaka`). `Pesavatī` là tên nữ: bản thân Pāli `10.4` nói
    `Pesavatīti tattha jāniṁsu mamaṁ`, và uddāna của `vv38:12.3` gọi bà là *Pesa*.
  · Khoá kết `13.1`: đa số toàn tầng *Cung Điện …* **39** ⟵ *Chuyện Cung Điện …* 12 ⟵ *Thiên
    cung …* 6 ⇒ `Cung Điện Nữ Pesavatī, thứ bảy.`  ⚠ Hệ quả như `vv32`: header có *Chuyện* mà
    khoá kết thì không — đúng quy tắc đa số đã đo; muốn thống nhất thì phải sửa cả tầng `vv`.

  **DÙNG LẠI NGUYÊN VĂN BẢN DỊCH (102 lần).** Cặp trùng nguyên văn **giữa các bài** đếm được
  102 lần: `0.1` 61 lần, `0.2` 35 lần, `0.3` 6 lần. Hai khoá có bản dịch ở nơi khác mà tôi cố ý
  **không** dùng lại, và ghi lý do: `0.1` có 1 tệp dịch là *Chuyện về cảnh giới thần* (thiểu số
  1/62); `0.2` có 1 tệp khác. Ngoài ra `7.3` trùng nguyên văn với `vv53:9.3` nhưng `vv53` chưa
  có bản Việt nên không có gì để dùng lại.

  **SỐ PĀLI — tự tính, in phép.** (a) `0.4` `7.` = **7**, chữ số nguyên trong Pāli, giữ nguyên;
  (b) `2.1` `dasā disā` = dasa 10 + disā hướng ⇒ **mười phương**; tiền lệ `snp3.11:40.5`
  `Atha bhāhisi dasadisā` → *mười phương* **2/2**; (c) `2.2` `sahassaraṁsī` = sahassa 1.000 +
  `-raṁsī` tia sáng ⇒ **ngàn tia sáng**, không phải *ngàn tia tròn*; (d) `11.1` `attha` = **4** — dẫn
  xuất từ bảng số: `Cattunnavutito` = catu 4 + navuti 90 = 94 và `Aṭṭhanavutito` = aṭṭha 8 + 90 =
  98, nên `attha` (không có dấu ṭ) là **4**, không phải 8; **không có** khoá Pāli nào khác dùng
  `attha` làm số đếm được đối chiếu, ghi rõ ở đây; (e) `12.4` `Tidasa` = **Tam Thập Tam**, không
  phải *ba bước* — xem bất định bên dưới; (f) `13.1` `sattamaṁ` = satta 7 ⇒ **thứ bảy**;
  `sattamaṁ` trong tầng đã dịch là *thứ bảy* **161/167** khoá, *thứ sáu* **0**. Phép đo số hiệu
  chuẩn 3/3 OK trên ba mốc đã lập (`Ekanavutito` 109 → *chín mươi mốt* 100/109, `Catunnavutito`
  104 → *chín mươi tư* 89/101, `Sattatālīsito` 47 → *bốn mươi bảy* 1/1).

  **THUẬT NGỮ — đều có số đếm.** `Pokkharaṇī` → *hồ sen* (**31/57** khoá Pāli có bản Việt, phần
  còn lại chỉ có chữ *sen*); `pokkharaṇī` ở tiêu đề `sn13.2:0.3`/`sn56.52:0.3` cũng là *Kinh Hồ
  Sen*. `sīha` → *sư tử* (**121/164**). `paṇava` → *tù và* (**7/10**). `musati` → *mù* (theo
  `dn17:1.29.8` `musati cakkhūni`). `antimadehadharo`/`-dhārī` → *mang thân cuối cùng* (**6/6**
  khoá đã có: `sn1.25`, `sn2.14:3.4`, `mn116:6.24`, `snp3.4`, `iti100:2.1`, `mil5.5.3:1.2`) ⇒
  `12.2` dịch *mang thân cuối cùng*, và `mnd1:81.36` `antimadehadharo arahā` xác nhận đây là danh
  xưng cho bậc A-la-hān, không phải vật thể mang. `nibbuta` → *tịch diệt* (**3** khoá dạng
  `parinibbuta`); `appameyya` → *vô lượng* (**6/7**). `Magadha` → giữ *Magadha* (**216** khoá đã
  có; riêng `Maghadeva` thì tầng dịch *Makhādeva* 2, *Ma-ga-tha* 1 — không nhất quán, nhưng đó là
  tên thành khác). `asoka` giữ nguyên (tiền lệ: `an8.5:4.3` giữ *asoka*; `ja336` cũng dùng *Asokā*).
  `pāṭali` giữ nguyên (**14** khoá giữ, vd `dn14:1.8.1` *gốc cây pāṭali*). `jambu` giữ nguyên
  (**5** khoá giữ). `sāla` → *sala* (**20** khoá viết *sala*, **6** viết *sa-la*). `bhante` →
  *bạch thầy*. `suṇohi` → *hãy nghe* (**22** khoá). `avacā` → *kể lại*.

  **CÁC TỪ GIỮ NGUYÊN PĀLI** (không có cách Việt nào đã kiểm chứng, nên **không bịa** nghĩa):
  `yodhika` `bandhuka` `anojaka` (`4.2`), `saḷala` `labuja` `bhujaka` (`5.1`), `koñca` `cakra`
  (`8.2`), `kāra` `ṇaḍava` (`8.4`). `koñca` có tiền lệ đúng ở `dn32:7.55`/`dn32:12.195` →
  *tiếng công và chim koñca* (**2/2**). `labuja` có tiền lệ ở `tha-ap384:2.1`/`tha-ap469:2.1`
  (*trái cây labuja*); `dn2` dịch `labuja` thành *mít* (**6/8**) là **sai** — `amba` là xoài,
  `labuja` là chuối, tôi không theo. `saḷala` có tiền lệ *sa-la* 2 và *sala* 4 ở `tha-ap270`,
  `tha-ap372`, `tha-ap400`. `kokila` → *chim tu hú* (tên phẩm `ja331`–`ja339` đã dịch *Phẩm Chim
  Tu Hú*, **9** khoá) dù 2 khoá `dn32:7.56`/`dn32:12.196` giữ *kokila*. `anojaka` và `bhujaka` là
  **hapax toàn Pāli root** (0 khoá nào khác) — đây là thiếu sót thật, ghi lại chứ không bịa.

  **BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ (đều ghi ở đây, KHÔNG thêm vào thân kinh).**
  · `3.1` `sateratā` — **hapax** (1/284.708), 0 tiền lệ, không tầng Anh ⇒ xem `blocking_errors`.
    Tôi dùng cách nói trung tính *thứ mờ mờ kia trên bầu trời* thay vì bịa một loại sương.
  · `2.4` `sacca` — đo được nghĩa *sự thật* ở **484** khoá Pāli đã ghim, nghĩa *trống lớn* ở
    **0** khoá (không khoá nào có `saccasadda`). Tôi theo nghĩa đo được: *quả thật là thế*.
    Nhưng hình ảnh *khói bị trống lớn đánh tan* lại rất hợp với `nise` (= tan biến), nên ghi lại:
    người biên tập nên tra bản in để chốt giữa hai cách đọc. `Jala` tôi đọc là mạo từ của
    `dhūmasikho` ⇒ *khói mọc từ nước*.
  · `11.1` `atthadhammakusalaṁ` — *thành thạo bốn điều của Pháp*. Pāli **không nói** đó là bốn gì;
    tôi không thêm. Người biên tập có thể muốn chốt với chú giải.
  · `11.2`–`11.3` — **Pāli không nêu chủ ngữ** cho hai vế này (`Devamanussa pūjitaṁ mahantaṁ`,
    `Upatissaṁ nibbutamappameyyaṁ`). Tôi dịch đúng văn bản và **không** tự thêm chủ ngữ; dấu hai
    chấm là cửa vào. Người biên tập nên xác nhận đọc này (mô tả cung điện, hay mô tả Đức Thế Tôn).
  · `11.4` `sukhasaṃ` — **hapax**: 0 khoá nào khác trong Pāli root có đúng chữ này (11 khoá có
    `sukhasa` đều là `sukhasaṁvāso` = *vui vẻ sống chung*), nên tôi **không** gọi tên loài hoa và
    dịch chung là *hoa*. Người biên tập nên tra bản in.
  · `12.4` `Tidasagatā` — hai cách đọc: *chỗ Tam Bước* hay *cõi Tam Thập Tam*. Tôi chọn **cõi Tam
    Thập Tam** vì hai lý do đo được: (1) `thi-ap17:118.2` có `tāvatiṁsagatā mayaṁ` — **đúng
    khuôn `X-sagatā …`** của cả câu này; (2) `tidasa` nghĩa là Tam Thập Tam ở **29** khoá đã có
    bản Việt (`vv41:6.2`, `vv82:2.3` → *chúng Tam Thập Tam*), còn chữ *tam bước* thì **0** tiền lệ.
    Mạch 12.3 *đã rời chiếc giường của người phàm* rồi 12.4 *nơi tôi cư trú* cũng hợp cõi trời hơn.
  · `8.2`–`8.4` — cả ba vế đều có dạng câu ở. `cakra` (0 tiền lệ), `kāra` (0), `ṇaḍava` (0) là
    **hapax**; tôi giữ Pāli cho chúng. `8.3` `Dibyapilavahaṁsarājaciñṇaṁ`: `pila` = màu vàng, `vaha`
    = mang, `sara` = dòng chảy, `ciñña` = để dấu / được ghi nhận ⇒ tôi dịch *có dấu vết của màu
    vàng rực rỡ nhuộm phủ lên*. `sarāja` (0 tiền lệ) **không** xác lập được là gì; tôi không bịa
    một tên cây hay thuốc nhuộm. Người biên tập nên tra bản in.
  · `6.3` `Mānusakāmānussakā ca dibbā` — chủ ngữ là ba loại cây: *cây người trồng, cây lẽ ra phải
    săn sóc, và cây của trời*. `ānussaka` có 0 tiền lệ nghĩa thực vật (5 khoá khác đều là
    `mānusaka` = *người* như trong `vv84:13.3` và `mānusakaṁ vassasataṁ`). Đây là **cách đọc của
    tôi** theo mạch khoá 6 (cây mọc từ nước / từ đất / từ cây), **không phải** nghĩa đã kiểm chứng.
  · `10.1` `Magadhavarapuratthimena` — tôi tách `Magadhavara` + `pura` (thành) + `uratthimena`
    (phía tây) ⇒ *Ở phía tây thành phố Magadhavara*. `Magadhavara` là tên thành ghép, không có
    tiền lệ; `uratthi` 0 tiền lệ. Người biên tập nên tra bản in.
  · `3.4` `Iddhaṁ indapuraṁ` — tôi hiểu là *thành đô của vua Trời* (`iddhaṁ` = nổi tiếng/quen),
    không phải tên riêng thành `Iddhalāvapura`. Người biên tập nên xác nhận.
  · `8.2` `asaṅgha` — tôi dịch *bay tứ tán* (không theo đàn). Người biên tập có thể muốn *đơn độc*.

  **XƯNG TÔN — giữ đúng chủ ngữ Pāli.** Inda nói `1.1`–`7.4` (mở nháy ở `1.1`, đóng ở `7.4`); nữ
  thiên nói `8.1`–`12.4` (mở ở `8.1`, đóng ở `12.4`). Vì vậy `6.4` `tuyhaṁ`, `7.1`–`7.4` `te` /
  `Kenāsi` / `tava` đều là **ngươi** (Inda hỏi nữ thiên), còn `9.4` `te … bhante`, `10.2` `bhante`
  là **ngài** (nữ thiên đáp Inda). Tôi giữ đúng hai giọng này thay vì dàn đều. `3.4` `tavedaṁ` là
  *ngài* vì ở đó đang hướng về Inda.

