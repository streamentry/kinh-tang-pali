  `8.1` ≈ `9.3` (chỉ khác nháy mở ở `8.1`) — bản Việt giống nhau nguyên văn, trừ nháy. Số cặp trùng giữa
  các bài mà bản Việt khác: không dò lại ở đợt này (đã có số ở mục cũ).

