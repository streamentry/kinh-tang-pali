  **Giải quyết draft 2026-10-12 (kiểm toán độc lập; thay thế các mục cũ nêu rõ bên dưới).**
  Đọc đối kháng Pāli ↔ Việt từng khoá. Bản cũ sai nghĩa nặng: 48/53 khoá được sửa, trong đó khoảng
  27 khoá sai nghĩa thật (1.1–1.4, 2.4, 4.1, 5.2–5.4, 6.1–6.3, 7.1, 7.4, 8.2–8.4, 10.1, 10.3, 11.1–11.4,
  12.2, 12.3); các khoá còn lại chỉnh xưng hô, dấu câu, từ thừa hoặc thiếu. Họ lỗi: (a) bịa vật không có
  trong Pāli — *bàn ghế*, *bị dẫm lên*, *chiếc giường của người phàm*, *hiền triệu*, *người nữ lắng nghe*;
  (b) đọc tên chim, tên cây Pāli là từ khác (`kāraṇḍava` thành *kāra* và *ṇaḍava*; `koñca` đọc đúng nhưng
  `cakora` thành *cakra*); (c) đọc hô cách `iḷārapamhe` (mi cong) thành *bạn ơi*; (d) đảo đối tượng ở
  11.1–11.4: `Upatissaṁ nibbutaṁ appameyyaṁ` là *Upatissa đã tịch diệt, vô lượng* — người được rải hoa,
  không phải *sự tịch diệt làm nền*, và `atthadhammakusalaṁ` là *thiện xảo về nghĩa và Pháp* (tính từ của
  Upatissa), không phải *tôi thành thạo bốn điều*; (e) `puratthimena` là *phía đông*, không phải *phía tây*;
  (f) `Mānusakāmānussakā ca dibbā` là `mānusakā amānussakā ca dibbā` — loài hoa của cõi người, phi nhân và
  cõi trời — không phải *cây người trồng, cây lẽ ra phải săn sóc*; (g) `udakaruhā … pupphajātā`,
  `thalajā`, `rukkhajātā` là ba cách mọc của các loài hoa, không phải *lau sậy*; (h) `jalamiva dhūmasikho`
  là *ngọn lửa cháy rực* (`dhūmasikhiṁ patāpavaṁ` ở `ja543:147.2` là lửa), không phải *khói mọc từ nước*,
  `nise` là *giữa đêm*, `sarade` là *mùa thu* (bản cũ bỏ sót); (i) `pahāya mānusakaṁ samussayaṁ` là *xả bỏ
  thân người* (`vv20:2.3` *bỏ lại thân người* 2/2).

  **Phân loại blocker (hồ sơ cũ có 2 câu).** (A) Thiếu bản Anh upstream: GIỮ NGUYÊN câu đầu, đúng sự thật
  về bản chụp đã ghim; bài chỉ có thể lên `review` nhờ miễn trừ của người biên tập. (C) Thiếu tầng Việt hiện
  hành chỉ là giới hạn tham chiếu, đã nằm trong cùng câu (A), không phải lỗi văn bản. (D) Câu thứ hai
  (`vv35:3.1` / `sateratā`) **đã gỡ**: khẳng định cũ *hapax 1/284.708, 0 tiền lệ* là SAI. `sateratā` còn có
  4 khoá Pāli khác trong `kn`: `ja512:1.4`, `ja526:32.4`, `ja526:42.2` (cả ba `Sateratā vijjurivantalikkhe`)
  và `ja545:74.3` (`Sateratā abbhamiva`); bản Việt đã có của cả 4 khoá đều là *chớp / tia chớp*
  (*như chớp lóe giữa không trung* 3/3, *như tia chớp vào đám mây* 1/1). Cùng khoá còn có `musatīva nayanaṁ`
  (*như cướp mất đôi mắt* — lóa mắt). Nghĩa *tia chớp* vì vậy có căn cứ trong chính tầng Pāli đã ghim; chỗ
  còn chưa chắc chỉ là sắc thái từ nguyên của `sateratā`, một ví von về độ chói, không đổi giáo nghĩa, nên
  không phải blocker. Ghi lại ở mục bất định.

  **Các mục cũ bị thay thế.** (1) Phần *MỆNH ĐỀ ĐO ĐƯỢC* về `0.1`–`0.4`, `13.1` và các số đếm chuẩn hoá
  tiêu đề: vẫn đúng, không đổi (0.2 giữ *Nữ Hư Không* theo quy ước cả bộ — xem dưới). (2) *SỐ PĀLI* ở mục
  (d) cũ (`attha` = 4) bị bỏ: `atthadhammakusalaṁ` là *nghĩa* + *Pháp* (`attha` = ý nghĩa, không phải số 4);
  khoá `11.1` đã sửa. Số Pāli còn lại và đã kiểm lại: `0.4` `7.` = 7; `2.1` `dasa disā` = *mười phương*
  (dasa 10 + disā); `2.2` `sahassaraṁsī` = *ngàn tia sáng* (sahassa 1.000); `13.1` `sattamaṁ` = *thứ bảy*;
  `12.4` `Tidasa` = *Tam Thập Tam* (ba-mươi, truyền thống ghi 33; cách đọc *Tam Bước* cũ loại, 0 tiền lệ).
  (3) *XƯNG TÔN* cũ nói Inda là người hỏi — **bỏ**: Pāli không nêu người hỏi, và `3.4` so cung điện *như
  thành của Inda* nên người hỏi không thể là Inda; bản mới giữ giọng *nàng* (người hỏi) / *tôi, ngài* (nữ
  thiên đáp, `bhante`), không đưa tên người hỏi vào thân kinh (bài tương tự `vv33` cho biết đó là
  Tôn giả Moggallāna, nhưng `vv35` không nêu). (4) *BẤT ĐỊNH* cũ ở `2.4` (`sacca`, `Jala`), `3.1`, `3.4`,
  `6.3`, `8.2`, `8.3`, `10.1`, `11.1`–`11.4`, `12.4`: thay bằng danh sách mới bên dưới. (5) *CÁC TỪ GIỮ
  NGUYÊN PĀLI*: `koñca` giữ (`ja531:52.1`, `ja547:10.1` đều *chim koñca* 2/2); `cakora`, `pilava`,
  `kāraṇḍava` giữ Pāli theo `ja536:1.2`, `ja536:13.1` (3/3 giữ), `kokila` → *tu hú*, `haṁsa` → *ngỗng*,
  `mayūra` → *công*, `dija` → *loài chim*; `yodhika`, `bandhuka` giữ (`ja536:13.1`).

  **Tiền lệ mới đã đo.** `aḷārapamha` / `āḷārapamha` → *mi cong* **6/6** khoá đã có bản Việt (`tha-ap24:44.1`,
  `tha-ap474:12.1`, `ja547:151.3`, `ja527:7.1`, `pv28:5.3`, `vv64:11.2`) ⇒ `7.4` *hỡi nàng có hàng mi cong*
  (`thig14.1:18.2` `āyatapamhe` là chữ khác, *mi dài*). `sammatāḷa` → *chũm chọe* (`tha-ap116:3.2`,
  `tha-ap475:9.4` 2/2). `apacita` (`dn4:5.17`… trong chuỗi
  `sakkato garukato mānito pūjito apacito`) là *được tôn trọng*. `antimadehadhara` → *mang thân cuối cùng*
  (6/6, như bản cũ). `Padumaṁ kumudaṁ uppalaṁ` → *sen đỏ / sen trắng / sen xanh* theo `dn17:1.23.3`; `kuvalaya`
