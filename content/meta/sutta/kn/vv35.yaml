  · `10.1` `Magadhavara`: *Magadha ưu việt* hay tên ghép một địa danh; hướng *đông* chắc chắn.
  · `11.1` `apacitatthadhammakusalaṁ`: đọc `apacita` là tính từ (được tôn trọng) của Upatissa, thứ tự các
    vế không cho phép loại hẳn cách tách khác.
  · `4.2` `anojaka`, `5.1` `saḷala`, `labuja`, `bhujaka` (tên cây, hoa), `8.2` `cakora`: giữ Pāli, không bịa
