  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 6 khoá bất đồng nghĩa → sửa 1, giữ 2, bất định 3. SỬA 5.3 (trước: “huy hoàng, tựa tấm lưới ngọc,” → sau: “tựa tấm lưới ngọc, hỡi nàng danh tiếng,”): `yasassinī` là nữ cách hô gọi nữ thiên chứ không phải tính từ của hồ sen — cùng khuôn hô cách ở vv22:3.2, vv34:6.4; trong 23 khoá vv/pv khác có `yasassinī` đều chỉ người, không khoá nào chỉ vật; bản nguyên bài cũng đọc như hô cách (độ chắc: khá, không tuyệt đối). GIỮ 10.4 (`Pesavatī`; bản nguyên bài viết Sesavatī, khác dị bản, Pāli đã ghim là Pesavatī) và 6.3 (`mānusakā amānussakā ca dibbā`: bản nguyên bài viết “không thuộc về phi nhân”, Pāli là ba loài hoa người, phi nhân, cõi trời). BẤT ĐỊNH 1.4 (`rucaka`: bản nguyên bài hiểu là cát vàng, giữ nguyên Pāli), 4.4 (`dumagga`: ngọn cây hay cây tuyệt hảo; bản nguyên bài chọn nghĩa sau, bản dự án chọn ngọn), 9.1 (`santānaka`: bản nguyên bài hiểu là tàng cây, bản dự án giữ tên Pāli). Đồng nhất thuật ngữ (không tính là bất đồng nghĩa): 8.3 `haṁsarāja` “ngỗng chúa” → “vua thiên nga”, theo vv36:4.2 và đa số tầng (thiên nga 71 khoá, ngỗng 13 khoá có `haṁsa`). Các điểm bản nguyên bài xác nhận bản dự án: `puratthimena` là phía đông, `Tidasa` là cõi Tam Thập Tam, `aḷārapamha` hô cách chỉ người, `Upatissa` là người được rải hoa. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
