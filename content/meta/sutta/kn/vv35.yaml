  · `1.2` cú pháp: `addasaṁ` (*tôi đã thấy*) nằm giữa các tân ngữ; đọc `vividhacitratalaṁ` là *mặt sàn*
    (`tala`), các tính từ ở `1.1`, `1.3`, `1.4` chỉ cung điện. Cách đọc khác (tất cả cùng nối vào `addasaṁ`)
    cho cùng nghĩa.
  · `4.4` `dumagga`: *ngọn cây* hay *những cây tuyệt hảo* (`agga` hai nghĩa); chọn *ngọn*.
  · `5.2` `kusaka`: *dây leo kusaka* theo cấu trúc `latā`; có thể là cỏ kusa, 0 tiền lệ.
