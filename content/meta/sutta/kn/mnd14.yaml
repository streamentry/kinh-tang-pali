  Rà lỗi còn sót 2026-10-17: 1276/1276 khoá đã đọc (cặp Pāli–Việt, khoá lặp kiểm một lần cho công thức và mọi chỗ lặp khớp nhau); sửa 163.2, 164.2 (sai chủ thể/đối tượng: *Idhekacce bhikkhū nindanti / pasaṁsanti* đọc là *ekacce* «có những người» + *bhikkhū* đối cách số nhiều «các tỳ-kheo», vì câu sau *nindito … na vedheyya*, *pasaṁsito … unnatiṁ na kareyya* lấy vị tỳ-kheo bị chê, được khen làm chủ thể; câu cũ «có những tỳ-kheo chê bai / khen ngợi» biến tỳ-kheo thành người chê, khen và để câu không có đối tượng; căn cứ: Pāli ghim (CST s0515m.mul13 cũng đọc *bhikkhū*, *bhikkhū* là dạng chung chủ cách/đối cách), Indacanda «một số người nào đó chê bai vị tỳ khưu», «ca ngợi vị tỳ khưu»; bản Pāli Indacanda dùng đọc *bhikkhuṃ* đối cách số ít, chỉ dùng làm bằng chứng cách hiểu, không dịch theo dị bản). Không sửa: 39.2 *Ātumā vuccati attā* «Bản thân được gọi là tự thân» (thứ tự ngược quy ước lemma-trước của bài, kệ dùng «tự thân» cho *ātumā*, nhưng câu đúng ngữ pháp Pāli); 60.2, 39.3 đã kiểm hôm nay, không làm lại; các bất định đã ghi giữ nguyên.
  Lượt văn phong theo lời phê 2026-10-17 (quyết định §5.2): xử lý lời phê terminology round 2 về 13.3 (sameti/upasameti xếp ngược B19). Đổi 2 khoá 13.3 và 43.3: chuỗi sam-/upasam-/vūpasam- thành «làm an tịnh, làm yên lặng, làm lắng dịu», chỉ đổi chỗ các từ, vẫn đủ 5 cụm, khớp B19 và khớp vūpasam- «lắng dịu» ở 10 chỗ khác trong bài cũng như chuỗi danh từ 44.2, 45.3; chuỗi động từ này chỉ có ở mnd14. Không xử lý: «lăng xăng bằng mắt/chân» và «các định danh do hý luận» (chữ của dòng kệ in đậm, văn xuôi giải nghĩa phải lặp lại; đã có chú thích 97.1, 17.3); «có đệ tử ở nhà, có giáo sư» (lời trích sn35.151 đã publish, mnd1, mnd16, cnd23 cũng dịch y vậy); «đúng chánh» 25.2 (công thức chung với cnd5:47.2, mnd7:36.2, mnd11:58.14 đã publish, lý do chỉ là văn phong); vikappa, nābhijappeyya (notes đã ghi là giữ có lý do); mnd7:72.2 (bài khác). Các lời phê thuật ngữ thaddha, vesārajja, jappati, lapanā, «tám chi», 60.2 đã xử lý ở lượt trước.
  Hoàn nguyên sau kiểm văn phong 2026-10-17: thay đổi 13.3, 43.3 (thứ tự sameti/upasameti/vūpasameti theo B19) không được giữ, vì 43.2 cùng đoạn và dòng kệ 43.1 vẫn dùng «làm lắng dịu», nên đổi lẻ tạo lệch trong đoạn; người kiểm chấm delta 0. Việc thống nhất họ động từ sam- theo B19 (kể cả snp4.14:5.1) để lượt chung. Mục «Lượt văn phong theo lời phê» ngay trên đã bị thay.
