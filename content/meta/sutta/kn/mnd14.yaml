  lên ghế, Việt «xu nịnh» (cùng chữ còn ở mnd16:215.6 và cnd23:148–149, ngoài lát); `144.4` *akkhena*
  chú giải *guḷena* (viên, bi), Việt «xúc xắc», còn *khalikāya* chú giải là chơi xúc xắc trên bàn bạc,
