  cạnh Indacanda và Sujato; so 92 mục từ đầu đoạn với mục từ của Indacanda; kệ trích còn so với Sujato
  snp4.14 (179 khoá có Pāli trùng chữ với kho `snp`, 15 khoá có Việt trùng chữ, 164 khoá khác, đã xem
  mẫu: phần lớn do ngắt dòng, chấm câu hoặc do Niddesa tự đọc kệ khác Sujato). Phần lời giải Niddesa
  chỉ có Indacanda làm nguồn độc lập (Sujato không có bài này); phần kệ trích có thêm Sujato. Sửa:
