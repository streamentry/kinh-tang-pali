  179/1276 khoá (khoá có chữ Pāli trùng lemma của một mục lời giải dài từ 7 chữ cái, đã đọc cặp
  Pāli–Việt–chú giải; chú giải chỉ giải từng chữ khó và giảng nghĩa từng khổ kệ, không phủ cả bài);
