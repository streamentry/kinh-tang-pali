notes: |-
  **Phạm vi: đủ 1276/1276 khoá của mnd14, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải `snp4.14` (Tuvaṭakasutta), thuộc phẩm Aṭṭhakavagga, cùng khuôn với `mnd12`, `mnd13` (chú giải `snp4.12`, `snp4.13`), `mnd1`, `mnd3`, `mnd7`, `mnd9`, `mnd11`: dẫn từng đoạn kệ in đậm, giải từng cụm, rồi nhắc lại cả đoạn kệ trong ngoặc kép. Có 20 đoạn kệ in đậm (`2`, `17`, `29`, `35`, `42`, `49`, `56`, `97`, `112`, `119`, `125`, `138`, `150`, `162`, `169`, `182`, `201`, `208`, `214`, `221`), mỗi đoạn được nhắc lại trong ngoặc kép (`16`, `28`, `34`, `41`, `48`, `55`, `96`, `111`, `118`, `124`, `137`, `149`, `161`, `168`, `181`, `200`, `207`, `213`, `220`, `227`). Lời dẫn nhập: 2 lần *Vì thế, vị được hóa hiện ấy đã nói—* (`15`, `95`) và 18 lần *Vì thế, Đức Thế Tôn đã nói—*; 9 lần *Điều này đã được Đức Thế Tôn nói—* dẫn lời giải và các đoạn kinh, kệ trích (`11`, `76`, `78`, `86`, `89`, `116`, `143`, `156`, `198`). Pāli có 272 khoá mang thẻ in đậm, bản Việt không mang thẻ. Dấu lược `…`: 134 khoá (46 khoá có `…pe…`, đều thành đúng một `…`; 88 khoá có `…` trần), mỗi khoá giữ đúng số dấu của Pāli; 0 khoá có `(…)` (nên không có trường hợp phải giữ `(…)` trần); 0 khoá Pāli kết `….`. Ngoặc đơn chỉ có ở 7 khoá `(iti bhagavā)` và đều khớp Pāli. Nháy kép `“”` khớp Pāli từng khoá (118/118 khoá có nháy; 73 khoá có nháy không cân trong chính khoá vì lời trích đi qua ranh giới khoá, giữ y như Pāli); 0 nháy đơn, 0 nháy thẳng.

  **Tên bài.** `0.1` → *Đại Tập Kể Lược*, `0.2` → *Kể Lược Phẩm Tám Kệ* (dùng lại nguyên văn `mnd1`, `mnd11`, `mnd12`, `mnd13`); `0.3` → *14. Kể Lược Kinh Tuvaṭaka* và `228.1` → *Kể Lược Kinh Tuvaṭaka, thứ mười bốn.* cùng khuôn với `mnd13:0.3`, `mnd13:160.1`; `1.1` → *Giờ đây, sẽ nói phần Kể Lược Kinh Tuvaṭaka—* theo `mnd9:1.1`. Giữ nguyên tên Pāli *Tuvaṭaka* như `snp4.14:0.2` (đã publish); tệp tên `mnd-name` của Sujato dịch tiêu đề là *Exposition of the Discourse on the Quick Way*.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd14`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho kn/mnd và tệp tên `mnd-name`; không có tệp `mnd14_translation-en-sujato.json`. Lớp `english-project` không có `mnd14`; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage theo công thức của kho (khoá Pāli ≥ 40 ký tự, tính cả thẻ in đậm như hàm đo của kho, bỏ khối `0.x`) là **562**/1276 khoá; Sujato phủ 0/562, `english-project` 0/562, `vietnamese-current` 0/562 ⇒ ba tầng tham khảo vắng hết, `triangulation` đặt 7.8 (không nâng), `status: draft` kèm blocker. Chưa có entry trong `reference-gaps.yaml` (lát này không được sửa tệp đó); có entry cũng không cứu được `published`. Bài được đối chiếu với tiền lệ trong chính tầng Việt của dự án (không phải đọc English độc lập): `snp4.14` (kệ), `cnd7`, `cnd8`, `cnd9`, `cnd17`, `cnd19`, `cnd21`, `mnd1`, `mnd3`, `mnd7`, `mnd11`, `mnd13`, cùng `dn2`, `mn122`, `an4.121`, `an3.16`, `sn35.243`.

  **Dùng lại tiền lệ.** Dò toàn tầng Việt đã dịch ngoài bài (DN, MN, SN, AN, KN), Pāli bỏ thẻ in đậm và gộp khoảng trắng: **444** khoá có Pāli trùng nguyên văn với khoá đã dịch; bản Việt giống một bản đã có ở **328** khoá, khác ở **116** khoá. Trong 444 khoá đó, **317** khoá trùng với `mnd`/`cnd` (dùng lại nguyên văn 314; 3 khoá khác có lý do: `69.3` chỉ khác chữ hoa đầu khoá vì đi nối dòng kệ trước, `225.2` và `225.12` viết theo cùng khuôn với `218.3` và `19.1` trong bài) và **127** khoá chỉ trùng nguồn ngoài `mnd`/`cnd` (khác ở 113 khoá, trong đó 105 khoá là dòng kệ trùng với `snp4.14`, xem dưới). Trong chính bài: **97** nhóm Pāli lặp (386 cặp), **0** nhóm có bản Việt khác nhau. Dòng kệ lặp lại ở bốn chỗ trong mỗi đoạn kệ (bản in đậm, dòng nhắc lại ở cuối từng lời giải, dòng trong ngoặc kép) được dựng từ một bảng 81 dòng, nên hai lần xuất hiện nào của cùng một dòng kệ cũng cho cùng một câu Việt.

  **Chỗ bản Việt của kệ khác `snp4.14` (đã publish), kèm lý do.** Kệ trong bài được dịch theo chính lời giải đi kèm (cùng cách `mnd12`, `mnd13` làm với `snp4.12`, `snp4.13`), không chép nguyên từ `snp4.14`. Chỗ khác: *papañcasaṅkhā* → *các định danh do hý luận* (`mnd11:107`, `snp4.11:13.4`), không phải *sự tạo tác* (`snp4.14:2.1`); *mantā asmīti sabbamuparundhe* → *ý nghĩ ta là: bằng tuệ, hãy ngăn chặn tất cả* theo `20.2` (*mantā* là tuệ) và `20.11` (*mantāya* … *rundheyya*), không phải *chính là ý niệm ‘ta là’ — hãy chặt đứt tất cả*; *taṇhā* → *tham ái* (`21.4`, `cnd11:51`), không phải *ái*; *thāmaṁ kubbetha* → *cậy sức* (`mnd7:72.2`: *không nên cậy sức*), không phải *tạo sức mạnh*; *nibbuti* → *sự tịch tĩnh* (16/16 khoá `mnd`/`cnd` có chữ này, `mnd9:18.2`), không phải *tịch diệt*, còn động từ *nibbāti* giữ *tịch diệt* như `snp4.14:1.3`; *phuṭṭho anekarūpehi* → *khi bị chạm đến bởi nhiều cách* theo `38.2` (*phuṭṭho pareto samohito samannāgato*, `mnd7:41.2`), không phải *khi bị hỏi nhiều cách*; *natthi attā kuto nirattā vā* → *không có bản ngã, làm sao có phi bản ngã* theo `mnd3:62` (*bản ngã* / *phi bản ngã*), không phải *tự ngã* / *huống gì không tự ngã*; *lola* → *lăng xăng* (0 tiền lệ), không phải *dao động*; *phassena yadā phuṭṭhassa* → *khi bị xúc chạm bởi xúc* vì `113.2` giải *phasso* là *rogaphasso* (xúc của bệnh tật); *bhavañca nābhijappeyya* → *chớ khấn nguyện về hữu* (`mnd13:56.8`, 15 khoá *khấn nguyện* so với 9 khoá *cầu mong* trong 57 khoá `mnd`/`cnd` chứa *jappati*) thay cho *chớ cầu mong sự hiện hữu*; *bheravesu* → *điều kinh hoàng* (`116.2`) thay cho *hiểm nguy* (từ này dành cho *parissaya*, 28/28 khoá `mnd`/`cnd` dịch *hiểm nguy*); *ātāpī* → *nhiệt tâm*; *pesuṇiya* → *lời ly gián* theo `mnd11:6` (18/20 khoá `mnd`/`cnd` dùng *ly gián*), không phải *nói hai lưỡi*; *payuttaṁ vācaṁ* → *lời nói có mưu cầu* theo `184.3`, không phải *lời ám chỉ*; *abhibhū* → *bậc chế ngự* theo `sn35.243:7.17` (cùng danh sách sắc, tiếng, mùi, vị, xúc, pháp), không phải *bậc chiến thắng*. Dòng kệ còn lại giữ nguyên ý `snp4.14` khi lời giải không đổi nghĩa.

  **Thuật ngữ, kèm số đếm.** *viveka* → *viễn ly* (50/65 khoá `mnd`/`cnd`, còn lại *tách biệt* 14; `mnd7:8`, `mnd7:70`); *sato* → *chánh niệm* (130 khoá `mnd`/`cnd`, so với *có niệm* 8 khoá); *kukkucca* → *hối hận* (15 khoá, *hối tiếc* 11 khoá; theo khối `cnd17:22`); *thambha* → *bướng bỉnh* (19/23), *māyā* → *giả dối* (20/26), *sāṭheyya* → *xảo trá* (18/18); *pisuṇā vācā* trong khối hối hận → *lời ly gián* (131.11) để khớp *pesuñña* của cùng bài, dù `cnd17:22.16` viết *lời chia rẽ* (7 khoá *chia rẽ*); *paṭiseni* → *sự đối địch* (6/15 khoá có chữ này dịch *đối địch*); *ussada* → *sự cao ngạo* (`mnd3:32`, khớp lời giải *bảy sự cao ngạo*, `53.2`); *upavāda* → *chỉ trích* (`iti70`; *phỉ báng* ở `cnd19:6`); *khiḍḍā* → *trò chơi* (0 khoá `mnd`/`cnd`, theo `ja441`); *sīlabbata* → *giới luật và khổ hạnh* theo `mnd13`; *vata* → *khổ hạnh*; *pāgabbhiya* → *xấc xược*; *viggāhika kathā* → *lời tranh cãi*; *kulūpaka* → *người thân cận của gia đình*. Các chuỗi động từ công thức dùng lại nguyên khuôn: *nên từ bỏ, xua tan, làm chấm dứt, làm cho không còn hiện hữu; nên xa lìa, tránh xa, hoàn toàn tránh xa; nên thoát ra, xuất ly, giải thoát, không còn ràng buộc; nên sống với tâm không còn giới hạn* (`mnd13:12.4`, `mnd8:47.4`); *không nên tạo ra, làm sinh ra, làm sinh khởi, làm phát sinh, làm phát sinh trọn vẹn* (`mnd5:22.2`); *kayavikkaya*, *tandi*, *hassa*, *khiḍḍā*, *methuna*, *vibhūsā* theo `snp4.14` và `mnd7:14`. *Thánh đạo tám chi*: dạng ngắn dùng ở `11.5`, `12.6`, `44.2`, `74.4`, `93.3`, `215.6` (13 khoá `mnd` dùng *tám chi*, 3 khoá *tám chi phần*); riêng `19.3` giữ *tám chi phần* vì dùng lại nguyên văn `mnd13:157.18` (nguyên một khối).

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `caturāsītiyojanasahassāni` = catur 4 + asīti 80 = 84, sahassa 1000 → *tám mươi bốn ngàn do-tuần* (50.2); `cattārīsayojanasahassāni` = cattārīsa 40 × sahassa 1000 → *bốn mươi ngàn do-tuần* (50.3, 50.4, 50.5, đủ 3/3 chỗ). **Không phân xử được**: ba dải nước 40.000 + 40.000 + 40.000 = 120.000, lệch 84.000 của cả đại dương; Pāli đã ghim đọc *cattārīsa* ở cả ba chỗ, nên dịch đúng như Pāli, không sửa. `bāttiṁsa` = 2 + 30 = 32 → *ba mươi hai chuyện tầm phào* (106.2); danh sách `106.3` và `128.5` chỉ đếm được **27** mục (rājakathā … itibhavābhavakathā), con số 32 là của Pāli, không chỉnh theo danh sách. `aṭṭhavīsati` = 8 + 20 = 28 → *hai mươi tám chòm sao* (154.2). *aṭṭha pānāni* = 8 + 8 (120.3: ambapāna … phārusakapāna đếm được 8; 120.5: kosambapāna … rasapāna đếm được 8); *cha cīvarāni* = 6 (khoma, kappāsika, koseyya, kambala, sāṇa, bhaṅga, đếm đủ 6); *pañca tikicchā* = 5 (156.11, đủ 5); *tīṇi pāgabbhiyāni* = 3 (186.2); *dve khiḍḍā*, *dve vibhūsā*, *dve parissayā* = 2; *tayo vivekā* = 3; *chakoṭṭhāsa / pañcakoṭṭhāsa / ekakoṭṭhāsa* = 6 / 5 / 1 (139.2, 6 = 5 + 1); `59.8`: *dvepi* 2, *tissopi* 3, *catassopi* 4, *pañcapi* 5, *dasapi* 10, *vīsampi* 20, *tiṁsampi* 30, *cattālīsampi* 40, *paññāsampi* 50, *satampi* 100; `128.3`: *ekassa dutiyo* 1→2, *dvinnaṁ tatiyo* 2→3, *tiṇṇaṁ catuttho* 3→4; `19.3`: 4/4/4, 8/8/9, 10/10, 4/4/4/5/5/7, 10/4/4/6/6. Đã quét toàn bài các khoá có từ chỉ số lượng Pāli đối chiếu số Việt: không còn chỗ lệch. Đã đọc cả bài một lượt cặp Pāli↔Việt.

  **Bất định (không thêm vào thân kinh).**
  1. `17.3`, `20.1`–`20.12`, `28.3` *mantā asmīti sabbamuparundhe*: đọc theo lời giải (*mantā* = tuệ; *asmī* = ngã mạn *ta là*, `20.4`; đối tượng của *rundheyya* là *gốc hý luận và ngã mạn*, `20.11`); `snp4.14:2.3` đọc khác. Cần người biên tập quyết, và `snp4.14:2.1`–`2.3` cần xem lại cùng chỗ này.
  2. `5.4`, `46.1`–`46.10` *nirattā*: lời giải cho hai nghĩa (`46.4`: đoạn kiến; `46.6`: điều cần buông bỏ); dịch *phi bản ngã* theo `mnd3:62`, giữ cả hai cách giải ở lời giải, kệ không chọn.
  3. `4.3`, `38.1`–`38.3` *phuṭṭho*: dịch theo lời giải (bị chạm đến); `snp4.14:4.3` đọc là *bị hỏi*.
  4. `8.1`, `98.x`, `11.1`, `126.x`–`129.x` *lola*: 0 tiền lệ trong `mnd`/`cnd`; *lăng xăng* chưa phân xử với *tham đắm* / *dao động*.
  5. `9.4`, `116.x`, `163.2`, `122.2` *vedheyya / pavedheyya / sampavedheyya*: kệ dịch *run rẩy* cho *sampavedheyya*, lời giải xếp *vedheyya* là *run rẩy*, *pavedheyya* là *rung động*, *sampavedheyya* là *chấn động* (khớp `cnd18:9.7`); chưa thống nhất hẳn giữa kệ và lời giải.
  6. `30.4`–`30.6` *vā assaṁ* (cách ước): dịch bằng *tôi là*, chưa phân xử với *tôi có thể là*.
  7. `51.1` *sattasīdantarā mahāsamuddā*: giữ *Sīdantara* như tên riêng, nghĩa chưa chắc. `50.2`–`50.5`: lệch số học 84.000 so với 3 × 40.000 (xem trên).
  8. `106.2`, `128.5`: *bāttiṁsa* (32) và danh sách chỉ có 27 mục (xem trên).
  9. `113.5` *lohitena … pittena*: Pāli tách làm hai (*bệnh máu*, *bệnh mật*); `mnd1:48.7` dịch *lohitapittaṁ* thành *xuất huyết*; chưa phân xử.
  10. `116.6` *madanabhayaṁ* → *nỗi sợ say sưa* (AN có *maraṇabhaya*, nỗi sợ chết); *duggatibhayaṁ* xuất hiện hai lần trong cùng khoá, đều dịch *nỗi sợ ác đạo*.
  11. `120.4`, `120.6`: *jambu*, *phārusaka*, *kosamba*, *kola*, *badara* là tên thực vật, giữ phiên âm hoặc dịch gần nghĩa; `120.9` *bhaṅga* → *vải pha gai*; `120.2` *kummāsa* → *cháo bột*, *sattu* → *bột rang*.
  12. `121.2`: chuỗi tà mạng; *pīṭhamaddikatā* → *sự xu nịnh* (0 tiền lệ), *navakamma* → *việc xây dựng*, *nippesikatā* → *việc gièm pha* (theo `mn117:29`, có thể là chèn ép), *tiracchānavijjā* → *tà thuật thấp kém* (`dn10`).
  13. `144.4` *yathāvajja* → *chơi bắt chước tật nguyền*; `dn2:49.2` dịch *bắt chước nhạc cụ* (đã publish, khác). `144.7`: sáu chữ *mukha-* (mukhabherika …) dịch gần nghĩa, 0 tiền lệ.
  14. `128.2`: tên các chỗ ở (*māḷa* → *gian sảnh*, *aṭṭa* → *tháp canh*, *uddaṇḍa* → *lều có cột*, *leṇa* → *hầm*, *aḍḍhayoga* → *nhà một mái*) dịch gần nghĩa, chưa có tiền lệ.
  15. `170.4`, `170.7` *pañcannaṁ saddhiṁ* → *với năm hạng người đồng phạm hạnh*: Pāli không nêu danh từ; *đồng phạm hạnh* suy từ ngữ cảnh Luật (kayavikkaya đã bị cấm trong Luật).
  16. `171.3` *āsannāpi na dissanti*: *dù ở gần cũng không bị thấy* — chủ ngữ là các vị sa-môn / thiên nữ có thần thông; chưa chắc.
  17. `176.3` mười bốn chữ *lapanā* (*ālapanā … parapiṭṭhimaṁsikatā*) dịch gần nghĩa theo `mil7.2.5`, `mn117`.
  18. `185.1` *mantāpi vācaṁ bhāsati* → *cũng nói lời có tính toán* (0 tiền lệ).
  19. `204.6` *samaṇappadhānena*: đọc theo `dn25:11.3` (*samaṇappavādena*, được gọi là sa-môn); đọc đúng chữ *padhāna* thì nghĩa khác.
  20. `177.5` *kulūpako* → *người thân cận của gia đình …* (có thể là người thường lui tới nhà thí chủ).
  21. `218.2`, `224.4` *devasāsana* → *giáo pháp của bậc Thiên*: không rõ *deva* ở đây là chư thiên hay danh xưng của Đức Phật.
  22. Lỗi ngoài lát, báo chứ không sửa: `snp4.14` chưa khớp lời giải ở `snp4.14:2.1`–`2.3`, `3.3`–`3.4`, `4.3`–`4.4`, `5.4`, `8.1`, `9.1`, `9.3`, `14.4`, `15.2`, `16.2`, `20.1` (xem phần so sánh với kệ ở trên); `dn2:49.2` *yathāvajja*; kho dùng lẫn *Thánh đạo tám chi* và *tám chi phần* (`mnd`: 13 so với 3 khoá).

