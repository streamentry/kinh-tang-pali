notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B1 — snp4.10:10.4 (`visattikā` = sự vướng mắc (ở đời); `tare` = có thể vượt qua); B13 — snp4.10:13.4 (`kappaṁ neti akappiyo` = không đi đến vọng tưởng, bậc không có vọng tưởng); B14 — snp4.10:2.5, snp4.10:12.3 (`purakkhata` = đề cao).
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 12.1–12.2 (nghĩa từ và thể khả năng: `vajjuṁ` là khả năng cách của *vadati* «có thể nói», không phải «chỉ trích»; bản cũ cũng bỏ `naṁ` và dồn động từ xuống 12.2; căn cứ lời giải mnd10:127.7–127.10 *vadeyyuṁ katheyyuṁ bhaṇeyyuṁ…*, nhãn gồm cả *manusso, devo, saññī*; DPD vajjuṁ «they could say»; Sujato «that by which one might describe»; khớp mnd10:126.1–126.2): «Điều mà phàm phu / hay sa-môn, Bà-la-môn dùng để chỉ trích» → «Điều mà phàm phu có thể dùng để nói về vị ấy, / hay sa-môn, Bà-la-môn»; giữ 12.4 *vādesu* «luận tranh» (DPD vāda 3 debate; lời giải mnd10:129.2 và chú giải Snp đọc là lời chê trách, Sujato words: NGHI-GIỮ), 1.3–1.4 *uttamaṁ naraṁ*, 7.3 *taṇhāya*, 11.3 *nirattā* «vô ngã» (DPD niratta 1.1 no self, ví dụ SNP48), 14.3 *dhammesu ca na gacchati*.
