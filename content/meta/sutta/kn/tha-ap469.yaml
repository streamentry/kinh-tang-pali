notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `tha-ap`.
  Bài này và tha-ap384 là hai văn bản gần như song song (cùng thành Bandhumatī, cùng trái cây labuja) nhưng khác chữ ở nhiều khoá; phần lớn bản Việt dùng lại nguyên văn tiền lệ đếm được (20/34 khoá), kể cả khi Pāli chỉ khác ở dạng chia (`āsiṁ`/`ahaṁ`, `paṭigaṇhi`/`paṭiggaṇhi`) — giữ nhất quán để hai bài không tự mâu thuẫn.
  `Phẩm Hoa Sa-la` chọn theo 6 bài đã có; tha-ap468:0.2 dùng `Phẩm Hoa Sāla` (1×) là cách thứ hai, đề nghị coordinator gộp về một dạng.
  Bất định còn lại giống tha-ap384 và ghi ở đó: `Vittisañjanano mayhaṁ` (3.1) đọc theo dạng động từ quá khứ nên không nêu chủ thể; `diṭṭhadhammasukhāvaho` (3.2) theo nghĩa `diṭṭhadhamma` của Kinh Tư Tập; cặp kệ 4.3–4.4 (`Uppajjateva ratanaṁ … nibbattassa tahiṁ tahiṁ.`) không có tiền lệ.
  `…pe…` giữ một dấu lược; `Bốn vô ngại giải,` và bản đóng nháy dùng lại nguyên văn.
  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|check`; coordinator cần chạy đủ bốn lệnh sau trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, và `npm run build`.
