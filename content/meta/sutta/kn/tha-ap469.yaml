notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `tha-ap`.
  Bài này và tha-ap384 là hai văn bản gần như song song (cùng thành Bandhumatī, cùng trái cây labuja) nhưng khác chữ ở nhiều khoá; phần lớn bản Việt dùng lại nguyên văn tiền lệ đếm được (20/34 khoá), kể cả khi Pāli chỉ khác ở dạng chia (`āsiṁ`/`ahaṁ`, `paṭigaṇhi`/`paṭiggaṇhi`) — giữ nhất quán để hai bài không tự mâu thuẫn.
  `Phẩm Hoa Sa-la` chọn theo 6 bài đã có; tha-ap468:0.2 dùng `Phẩm Hoa Sāla` (1×) là cách thứ hai, đề nghị coordinator gộp về một dạng.
  Bất định còn lại giống tha-ap384 và ghi ở đó: `Vittisañjanano mayhaṁ` (3.1) đọc theo dạng động từ quá khứ nên không nêu chủ thể; `diṭṭhadhammasukhāvaho` (3.2) theo nghĩa `diṭṭhadhamma` của Kinh Tư Tập; cặp kệ 4.3–4.4 (`Uppajjateva ratanaṁ … nibbattassa tahiṁ tahiṁ.`) không có tiền lệ.
  `…pe…` giữ một dấu lược; `Bốn vô ngại giải,` và bản đóng nháy dùng lại nguyên văn.
  Cổng kỹ thuật CHƯA chạy — agent dịch không được phép chạy `npm run validate|test|build|check`; coordinator cần chạy đủ bốn lệnh sau trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, và `npm run build`.
  Sửa lát 2026-10-05 — 1 khoá: `tha-ap469:0.3` đặt lại số thứ tự `7.` ở đầu theo Pāli `7 Labujaphaladāyakattheraapadāna`; bản Việt trước đó bỏ mất số này (thông tin có nguồn). Số đọc từ Pāli, đối chiếu thêm bằng colophon ordinal. Chỉ đổi phần số, nội dung tên phẩm giữ nguyên.
  Hình thức: trên 116 tệp Pāli `:0.3` có số: chữ số ở đầu 98 (82 có dấu chấm, 16 không) so với chữ ở cuối 2, bỏ 16 → chọn `N. `; số đếm còn tăng vì các lát f1–f3 được áp song song. Hạ `semantic_fidelity` 9.2 → 8.8; `final_score` tính lại bằng script.

  Sửa lan 2026-10-13: `tha-ap469:3.1`–`3.2` (accuracy fix). `3.1` `Vittisañjanano mayhaṁ`: *đã liếm sạch vết thương của ta* → *làm sinh khởi niềm hoan hỷ nơi ta* (`vitti` = hoan hỷ, `sañjanana` = làm sinh khởi; bản cũ không có căn cứ Pāli; *niềm hoan hỷ* như `tha-ap402:3.3`, `tha-ap315:2.3` và `pīti` ở `4.1`–`4.2` của chính bài). `3.2` `diṭṭhadhammasukhāvaho`: *mang theo sự an lạc của điều đã thấy biết* → *đem lại an lạc ngay trong hiện tại* (`diṭṭhadhamma` = đời này/hiện tại, như `diṭṭheva dhamme` → *ngay trong hiện tại* ở `cnd22:60.3`; đúng dạng của `tha-ap177:2.2`). Cùng lỗi còn ở `tha-ap117:4.3`, `tha-ap129:4.3` (đã sửa ở đây), `tha-ap384:3.1`, `tha-ap512:3.1`, `an5.58:14.3` (ngoài lát này).

  Sửa lan 2026-10-13 (cơ học, toàn tầng): khoá tha-ap469:5.3 — `duggatiṁ nābhijānāmi` trước dịch “Ta
  không biết mình rơi vào khổ đau,”, đảo nghĩa (Pāli: không còn biết đến, tức không còn rơi vào, đọa
  xứ nào) → “Ta không còn biết đến đọa xứ,”; giữ nguyên xưng hô của bài. Cùng công thức đã dịch đúng ở
  đa số khoá trong tầng.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 34 khoá, đổi 8 khoá, đều là sửa sai nghĩa hoặc sai ranh khoá, không phải sửa văn.
  (1) `1.2` `ārāmiko ahaṁ tadā`: *ta là dân làng ở đó* → *ta là người trông nom vườn*. `ārāmika` là người làm việc/phục vụ ở `ārāma` (vườn, khu tu viện), không phải dân làng; tha-ap182:1.2 cũng hiểu theo hướng người phục vụ vườn. Còn bất định nhỏ: người giữ vườn hay người phục vụ ở khu tu viện (xem dưới).
  (2) `2.4` `paṭiggaṇhi mahāyaso`: *bậc cao lớn* → *bậc danh tiếng lớn*. `yasa` là danh tiếng; *cao lớn* làm mất `yasa` và dễ bị đọc thành vóc người. Tiền lệ `mahāyaso` ở 59 khoá toàn tầng: hầu hết dịch *danh tiếng lớn* (các biến thể còn lại đều giữ `yasa` là danh tiếng); *bậc cao lớn* chỉ có ở tha-ap384:2.4 và tha-ap512:2.4, cùng họ lỗi.
  (3) `4.1`–`4.2` `pītiṁ | vipulaṁ sukhamuttamaṁ`: trước, `4.1` kết ở *đã đạt được* còn `niềm hoan hỷ` nằm ở `4.2`, và *rộng lớn* gắn vào `pīti`. Pāli: `pītiṁ` (giống cái) thuộc `4.1`; `vipulaṁ` (trung tính) chỉ có thể đi với `sukhaṁ` (trung tính), tức *vipulaṁ sukhaṁ uttamaṁ*. Nay `4.1` *Lúc ấy ta đã đạt được niềm hoan hỷ,* và `4.2` *sự an lạc rộng lớn, tối thượng;* — sửa cả ranh khoá lẫn quan hệ tính từ.
  (4) `4.3`–`4.4` `Uppajjateva ratanaṁ, nibbattassa tahiṁ tahiṁ`: *Quý báu ấy đơn thuần là hiện khởi thôi, mỗi bước lại thêm một chút* → *Bảo vật quả thật khởi lên, ở mỗi nơi ta sinh ra.* Bản cũ không có căn cứ Pāli: `eva` là nhấn mạnh (không phải *đơn thuần … thôi*), `tahiṁ tahiṁ` là *ở mỗi nơi* (không phải *mỗi bước … thêm một chút*), `nibbattassa` là *người đã sinh ra* (tái sinh), thiếu hẳn. Đối chiếu tha-ap540:11.4 `nibbattassa tahiṁ tahiṁ` → *ở mỗi nơi con sinh ra* (khoá duy nhất khác có cụm này, 4 khoá toàn tầng). Các khoá tương ứng của tha-ap384 và tha-ap512 (4.3–4.4) vẫn mang lỗi cũ, ngoài lát này.
  (5) `3.3` `Phalaṁ buddhassa datvāna`: *quả ấy* → *trái cây*, cho thống nhất với `2.1`, `5.2`, `5.4` của chính bài (`phala` ở `5.4` là *quả báo*, nên dùng *quả* cho trái cây gây nhầm); có tiền lệ tha-ap487:13.1 *dâng trái cây lên Đức Phật*. `3.1` chỉ đổi chữ hoa đầu câu (*Làm*) theo nếp 7040/7091 khoá đầu kệ của tầng.
  Bất định còn lại: (a) `3.1`–`3.2` `Vittisañjanano … diṭṭhadhammasukhāvaho` ở dạng chủ cách giống đực, không có danh từ chủ rõ (tha-ap384 dùng dạng đối cách cùng nghĩa, bổ nghĩa cho `phalaṁ`) — có thể bổ nghĩa cho Đức Phật hoặc cho người dâng; bản Việt giữ cụm treo, không nêu chủ thể. (b) `1.2` `ārāmika`: người giữ vườn hay người phục vụ ở khu vườn tu viện; chọn nghĩa hẹp, sát `ārāma`. (c) `2.3` `Ākāseva` có thể đọc `ākāse eva` (*ngay giữa trời*) hoặc `ākāse iva` (*như đứng giữa trời*); bản Việt không dịch `eva`/`iva`. (d) `3.4` *thanh tịnh tinh khiết* cho `vippasannena` có tiền lệ 5 khoá nhưng hơi thừa; không đổi vì chưa đủ căn cứ. (e) `4.1` `pīti` và `3.1` `vitti` cùng dịch *hoan hỷ*.
  Chấm lại (từ → sang): semantic_fidelity 8.8 → 8.6 (bốn chỗ sai nghĩa trong bản đã chấm; sau sửa vẫn còn bất định a–c); grammar_logic 9.1 → 8.8 (tính từ `vipulaṁ` bị gắn sai giống, cú pháp 3.1–3.2 chưa phân xử); terminology 9.2 → 8.9 (`ārāmika`, `mahāyaso`, `phala`); vietnamese_clarity 9.2 → 9.0 (cụm treo 3.1–3.2); ambiguity_integrity 9.0 → 8.8 (bất định a–c chưa nằm đủ trong ghi chú trước). Giữ nguyên: source_provenance 9.5, segment_alignment 10.0 (sau khi chuyển `niềm hoan hỷ` về đúng `4.1`), triangulation 7.5 (vẫn không có bản Anh độc lập), han_viet_balance 9.3, technical_integrity 9.6 (cổng vẫn chưa chạy). `final_score` 9.12 → 9.0 (trung bình thô). Blocker không có tầng tham khảo tiếng Anh giữ nguyên.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 4 khoá bất đồng nghĩa → sửa 0, giữ 1 (7.1 `Svāgataṁ vata me āsi`: bản nguyên bài diễn giải rộng "đã thành công mỹ mãn"; bản dự án theo khuôn "Thật lành thay sự đến của ta" của 131 khoá tha-ap), bất định 3 (1.2 `ārāmika`: bản nguyên bài hiểu là người phụ việc ở tu viện, bản dự án là người trông nom vườn, cả hai nằm trong nghĩa của `ārāma`, Pāli không phân xử; 3.1–3.2 `vittisañjanano … diṭṭhadhammasukhāvaho`: bản nguyên bài gán cho Đức Phật, bản dự án để treo không nêu chủ thể, vì dạng chủ cách giống đực không có danh từ chủ rõ). Ngoài ra bản nguyên bài dịch `labuja` là "mít" (bản dự án giữ nguyên chữ Pāli) và cùng đọc 91 kiếp (5.1), bốn vô ngại giải, tám giải thoát, sáu thắng trí — không bất đồng. Review đối kháng cùng lượt: không tìm thấy lỗi cần sửa; không đổi khoá nào. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
