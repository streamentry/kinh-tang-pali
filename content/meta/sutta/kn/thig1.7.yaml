notes: |-
  Đối chiếu Pāli + Anh Sujato (7/8 khoá; khoá 2.1 Sujato để trống). Không có bản Việt hiện hành (bilara tại commit ghim chỉ có Pháp Cú) — giới hạn của bản chụp upstream.
  Tiền lệ đếm trong content/translation/vi/project/sutta/: giữ nguyên Therīgāthā 1.7 và Bộ Một Bài Kinh theo thig1.1 (published); Trưởng lão nữ cho therī theo thig1.1/thig2.2; chiến thắng Ma vương cùng quân đội theo an4.16:3.4; các căn đã tu tập (dn/mn); mang thân cuối cùng (ti46, mn98); dũng mãnh 25 chỗ.
  Vīrā vīrehi dhammehi đọc theo Sujato: được gọi tên Vīrā nhờ các pháp dũng mãnh. Không mở rộng diễn giải.
  Khoá 2.1 Pāli lược (… Vīrā therī ….) giữ đúng hai dấu …, không mở rộng (quy tắc §10 BRIEF_VI3).
  Bất định còn lại: không có — epithet vīra đọc thẳng theo Sujato và Pāli.

  Quyết định hội đồng biên tập 2026-10-16: A13 — thig1.7:1.4 (bỏ dấu chấm thừa sau ngoặc kép kết lời thoại (`?”.` → `?”`; cùng loại lỗi hai dấu kết liền nhau)).
