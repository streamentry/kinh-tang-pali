  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU:
  1. MÂU THUẪN NỘI TẠI CỦA BÀI. 1.3 Sa pacchā manutappati nói người ấy HỐI HẬN, nhưng cả mười câu kệ 2–11 đều kết bằng iti pacchānutappati (KHÔNG hối hận), và 12.4 sa pacchā nānutappatī cũng phủ định. Tôi dịch đúng từng chữ theo Pāli đã ghim và KHÔNG tự sửa cho khớp; người đọc cần biết đây là điểm khó của bản kinh, không phải lỗi dịch.
  2. sabbakāmarasāharaṁ (9.2) — chỉ một dạng trong toàn tầng Pāli đã ghim, không có tầng tham khảo. Tôi chọn nghĩa làm lánh bỏ và dịch thầy là kẻ lánh bỏ mọi thứ dục trần. Nghĩa thay thế là làm nền/bằng chứng của mọi thứ dục. Chưa phân xử được.
  3. mayā sippaṁ na sikkhitaṁ (3.2) — câu kệ này không dùng āsiṁ như 4.1 và 5.1 mà có mayā (bởi ta), nên ngôi kể khác hai câu kệ kia; tôi dịch chưa từng học nghề của ta. sippa dịch là nghề theo tiền lệ mn85:56.3 (hatthārūḷhaṁ aṅkusagayhaṁ sippaṁ → khéo nghề cầm mãnh châm) và dn31:28.4 (sippaṁ sikkhāpenti → dạy cho nghề nghiệp), chứ không khẳng định là dệt vóc.
  4. Kicchā vutti asippassa (3.3) — tiền lệ thag1.111:1.3 (Kicchā vutti no itarītareneva) dịch chúng tôi khó sinh tồn,; bản này dịch Khó lắm kẻ không có nghề mà sinh sống,.
  5. Pahu santo (8.3) — 0 tiền lệ cho nghĩa của santo tại đây; snp1.6:9.3 đã dịch là Dù có khả năng, bản này theo đó.
  6. Sakyarūpaṁ (3.1) — sakya giữ là người Sakya (dòng dõi), không dịch thành quyền quý.
  7. Pitaraṁ atimaññissaṁ (9.3) — 9.1–9.2 gọi người ấy là ācariya (thầy) còn 9.3 lại là pitā (cha). Tôi dịch theo chữ thành người làm cha, và ghi lại chỗ căng ở đây.
  8. Paradāraṁ asevissaṁ (6.3) — câu kệ ngay sau anāpādāsu itthisu; không chỉ rõ chủ thể thì dễ đọc thành người đàn bà phạm tội. asevissaṁ là thì hoàn thành ngôi thứ nhất nên thêm chữ tôi cho rõ; paradāra dịch vợ người khác theo dn31:4.3.
  9. Sādhu hoti tapo ciṇṇo (11.1) — 0 tiền lệ cho cụm này; dịch Thật là lành, phép tu khổ đã thực hành,.
  10. Bahūsu vata / Bahumhi vata — vata là tiếng thán từ, tầng Việt thường không dịch (dn4:12.2, dn21:1.5.29); bản này gộp vào Thật là có.
  
