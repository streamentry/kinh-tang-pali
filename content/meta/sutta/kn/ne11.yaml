notes: |-
  THEO BÀI LÂN CẬN. ne22 đã merge cho cùng vāra Paṭiniddesavāra: Paṭiniddesavāra → Phần Giải Thích, Sampāta → Nhóm, Yuttihārasampāta → Nhóm Phương Thức Dấu Hiệu, Niyutto … hāro → … đã được vận dụng. Tôi theo đúng những cách ấy cho 0.2, 0.3 và 7.5. vibhattihāra chưa có tiền lệ (5 khoá Pāli, chưa khoá nào có bản Việt) nên tôi đặt mới là nhóm phân loại hướng dẫn.

  padaṭṭhāna → nền tảng theo ne23:2.2, ne23:2.3 và ne30:2.2 (nền tảng, nền tảng ứng với). bhūmi → đất nền. nibbedhabhāgiya → thuộc phần xuyên thấu theo dn34:1.5.31 và dn33:2.2.127 (tương ứng hānabhāgiya là thuộc phần suy giảm). sādhāraṇa, asādhāraṇa → pháp chung, pháp không chung (0 tiền lệ cho cặp này trong kho; asādhāraṇa chỉ xuất hiện ở mn48 với nghĩa không chung với người phàm, tôi dùng cùng cách đó). sutta → bài nói, không dịc kinh, vì ở đây suttāni là bài được xem là đối tượng quán sát.

  VĀSANĀBHĀGIYA LÀ CHỖ TÔI TỰ ĐẶT, GHI RÕ. Vāsanābhāgiya không có tiền lệ trong kho; tôi dịch là thuộc phần nuôi dưỡng tâm, còn nibbedhabhāgiya là thuộc phần xuyên thấu. Lý do: chính bài liệt kê các bài nói thuộc vāsanābhāgiya là bố thí, giới hạnh, phương hướng, hiếm trở của các dục, lợi ích của sự từ bỏ — tức những điều người ta hướng tâm tới; còn nibbedhabhāgiya thì dẫn tới việc phân biệt biết, con đường và quả. Người biên tập xét lại được.

  5.3 LÀ ĐOẠN KHÓ NHẤT CỦA LÁT. Pāli liệt kê ô nhiễm chân thật và không chân thật, tham dục và sân hận của người phàm với người nhập giải thoát, ràng buộc thuộc phần cao hơn của người chưa nhập giải thoát, mọi sự đạt thế gian của đệ tử bậc Thánh, rồi kết bằng câu pháp chung không vượt qua lẫn nhau từng nấc thứ bật. Tôi dịch sát từng vế và KHÔNG diễn giải thêm; avītarāgehi ở 5.3 tôi để thành mệnh đề đi kèm sự đạt ấy, chỗ nào hiểu khác nhau thì đây là chỗ dễ sai nhất của bài.

  DẤU LƯỢC. Bài không có dấu lược nào; bản Việt cũng không có.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.

  STATUS. Hai blocking error ở trên là thật và đo được, nên bài đặt draft bất kể final_score. Điểm thấp hơn các bài khác của lát vì đây là kinh luận Abhidhamma nặng, lại không có tầng Anh để đối chiếu.
