notes: |-
  THEO BÀI LÂN CẬN. ne22 đã merge cho cùng vāra Paṭiniddesavāra: Paṭiniddesavāra → Phần Giải Thích, Sampāta → Nhóm, Yuttihārasampāta → Nhóm Phương Thức Dấu Hiệu, Niyutto … hāro → … đã được vận dụng. Tôi theo đúng những cách ấy cho 0.2, 0.3 và 7.5. vibhattihāra chưa có tiền lệ (5 khoá Pāli, chưa khoá nào có bản Việt) nên tôi đặt mới là nhóm phân loại hướng dẫn.

  padaṭṭhāna → nền tảng theo ne23:2.2, ne23:2.3 và ne30:2.2 (nền tảng, nền tảng ứng với). bhūmi → đất nền. nibbedhabhāgiya → thuộc phần xuyên thấu theo dn34:1.5.31 và dn33:2.2.127 (tương ứng hānabhāgiya là thuộc phần suy giảm). sādhāraṇa, asādhāraṇa → pháp chung, pháp không chung (0 tiền lệ cho cặp này trong kho; asādhāraṇa chỉ xuất hiện ở mn48 với nghĩa không chung với người phàm, tôi dùng cùng cách đó). sutta → bài nói, không dịc kinh, vì ở đây suttāni là bài được xem là đối tượng quán sát.

  VĀSANĀBHĀGIYA LÀ CHỖ TÔI TỰ ĐẶT, GHI RÕ. Vāsanābhāgiya không có tiền lệ trong kho; tôi dịch là thuộc phần nuôi dưỡng tâm, còn nibbedhabhāgiya là thuộc phần xuyên thấu. Lý do: chính bài liệt kê các bài nói thuộc vāsanābhāgiya là bố thí, giới hạnh, phương hướng, hiếm trở của các dục, lợi ích của sự từ bỏ — tức những điều người ta hướng tâm tới; còn nibbedhabhāgiya thì dẫn tới việc phân biệt biết, con đường và quả. Người biên tập xét lại được.

  5.3 LÀ ĐOẠN KHÓ NHẤT CỦA LÁT. Pāli liệt kê ô nhiễm chân thật và không chân thật, tham dục và sân hận của người phàm với người nhập giải thoát, ràng buộc thuộc phần cao hơn của người chưa nhập giải thoát, mọi sự đạt thế gian của đệ tử bậc Thánh, rồi kết bằng câu pháp chung không vượt qua lẫn nhau từng nấc thứ bật. Tôi dịch sát từng vế và KHÔNG diễn giải thêm; avītarāgehi ở 5.3 tôi để thành mệnh đề đi kèm sự đạt ấy, chỗ nào hiểu khác nhau thì đây là chỗ dễ sai nhất của bài.

  DẤU LƯỢC. Bài không có dấu lược nào; bản Việt cũng không có.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.

  STATUS. Hai blocking error ở trên là thật và đo được, nên bài đặt draft bất kể final_score. Điểm thấp hơn các bài khác của lát vì đây là kinh luận Abhidhamma nặng, lại không có tầng Anh để đối chiếu.

  GIẢI QUYẾT DRAFT 2026-10-12. Mục này thay thế các đoạn trên về thuật ngữ padaṭṭhāna, bhūmi, nibbedhabhāgiya, sutta, sīla, paṭipadā, puñña và mọi nhận xét về 5.3 ở đầu notes; phần còn lại của notes cũ giữ làm lịch sử.

  Bản cũ có 13/32 khoá lệch nghĩa thật (1.2, 3.2, 4.2, 4.5, 6.2, 6.3, 6.4, 6.5, 6.6, 7.1, 7.2, 7.3, 7.4) và 9 khoá khác đổi thuật ngữ theo tiền lệ của kho; 10/32 khoá giữ nguyên. Lỗi chính: (a) 1.2 và 7.4 đọc “dhammañca padaṭṭhānaṁ bhūmiñca” thành “lấy Pháp làm nền tảng và làm đất nền”, trong khi đây là ba mục liệt kê: pháp, nền tảng ứng với, nền; (b) 3.2 dịch saggakathā là “phương hướng” (đúng là cõi trời) và ādīnava là “hiếm trở” (đúng là sự nguy hại), cả hai đã có tiền lệ đúng ở dn3:2.21.2, dn14:3.11.2; (c) 6.2 đọc sekkhāsekkhā là “người học và người chưa học” (đúng là hữu học và vô học), aṭṭhamaka là “người mới nhập giải thoát” (đúng là bậc thứ tám, theo ps3.1:23.1 và ne5:45.8), và dịch dhammatā asādhāraṇā là “theo nghĩa là không chung” ở 6.2–6.5; (d) 7.1–7.3 đảo cấu trúc “X là nền tảng ứng với Y” thành “nền tảng của X và Y” rồi sinh ra các cụm vô nghĩa (“chỗ quy môn”, “vi cách”, “khởi đầu tốt đẹp của Tăng”, “thông suốt trong điều pháp”, “tập trung của thức”, “khó cải tán”); (e) 4.5 dịch vicayahāra thành “thu thập” và yuttihāra thành “phương thức dấu hiệu”, trái với ne6:17.1 và pe8:131.1.

  Tiền lệ đã đo trên toàn tầng (số hit Pāli có dạng ấy, trừ chính ne11): sutta → bài kinh/kinh, không có “bài nói” nào; thượng phần cho uddhambhāgiya 69/70, “phần trên” 0; puñña → phước 905, công đức 221 (nhóm ne/pe 66 so với 0); samatha → chỉ 251, sự định tĩnh 14; vipassana → quán 388; padaṭṭhāna → nền tảng ứng với 279/296; dassanabhūmi/bhāvanābhūmi → nền thấy biết/nền tu tập; puññakiriyavatthu → cơ sở tạo phước (dn33, an8.36); parato ghosa → tiếng nói từ người khác (pe1:3.3); sutamayī/cintāmayī/bhāvanāmayī → tuệ do nghe/tư duy/tu tập sinh (pe8:269); yoniso manasikāra → tác ý như lý 76; aveccappasāda → tịnh tín bất động 112; niyāmāvakkanti → sự bước vào chánh vị (mnd13:41.8); micchattaniyata/aniyata → tà định/không định (dn33:1.10.59, pe2); paṭipannaka → người đang thực hành (bv11:31.2); satthusampadā → sự thành tựu của bậc Đạo Sư; pesalā/phāsuvihāra → hiền thiện/sống an ổn (sn16.11:3.2); nibbedhabhāgiya → thấu triệt, theo nhóm pe2, pe4, pe8, ne5, ne37 (64 hit/5 tệp, so với 29 hit/6 tệp dùng “xuyên thấu”, trong đó ne11 cũ và ne17 là hai tệp trong nhóm Netti); vāsanābhāgiya → thuộc phần nuôi dưỡng tâm (66 hit/5 tệp, giữ nguyên). Cặp Pāli trùng nguyên văn trong chính bài: 7.4 lặp lại 1.2 một phần và được dịch khớp.

  Đã phân loại và gỡ blocker. (A) Không có bản Anh Sujato tại commit đã ghim: GIỮ NGUYÊN câu blocker đầu; đây là sự thật về upstream. Tầng Việt hiện hành chỉ có Pháp Cú: giới hạn tham chiếu, đã nằm trong cùng câu ấy. (B) Blocker thứ hai (độ phủ Anh 0/28, chưa có mục trong reference-gaps) đã gỡ: nó không phải lỗi văn bản mà là hệ quả của (A) cộng với việc tệp ghi nhận mất mát do công cụ của kho sinh ra; sau khi đọc đối kháng cả 28 khoá có nội dung từ Pāli một mình, bản dịch từng khoá đứng vững ở mức mô tả của Pāli. Mất mát phải được ghi vào reference-gaps bằng npm run reference:gaps khi áp dụng waiver.

  Bất định còn lại, đều ghi ở đây chứ không đưa vào thân bài. (1) dhammatā ở 6.2–6.5 dịch là bản chất (bản tính, pháp tánh đều có tiền lệ: pháp tánh 21, bản chất 9, bản tính 6); chỗ này là điểm khó nhất, văn bản chỉ nói danh xưng/pháp thì chung còn dhammatā thì không chung, và tôi không đoán thêm. (2) 4.5: desanāya phalena sīlena brahmacariyena dịch là “xét theo sự thuyết giảng, quả, giới và phạm hạnh”; quan hệ ngữ pháp giữa ba từ ở cách công cụ này không phân xử được từ Pāli một mình; yāvatikā ñāṇassa bhūmi dịch là “trong chừng mực nền của trí còn đạt tới”. (3) 5.3 “aññamaññaṁ paraṁ paraṁ sakaṁ sakaṁ visayaṁ” dịch sát từng vế, không diễn giải. (4) dummaṅku ở 7.3 dịch là “những người xấu xa” (sn16.11:3.2 dùng “những người kém cỏ”, tiền lệ duy nhất); saṅghasuṭṭhutā dịch là “sự tốt đẹp của Tăng”. (5) 4.4 “bốn bài kinh”: bài chỉ nêu hai loại sutta ở 2.1 nên con số bốn lấy theo nguyên văn, không giải thích thêm.

  Chấm lại: triangulation 6.0 (không có bản Anh độc lập và không có bản Việt hiện hành, bài là văn bản kỹ thuật nặng); semantic_fidelity 8.4, grammar_logic 8.4 vì còn các điểm bất định trên; terminology 8.7 vì đã khớp tiền lệ; ambiguity_integrity 8.2; không nâng điểm để né blocker. final_score là trung bình thô 8.57.

  Cổng kỹ thuật vẫn do người biên tập chạy sau khi gộp: npm run validate, npm test, npm run check, npm run build. Trong lượt này tôi không chạy bốn lệnh ấy nên technical_integrity giữ 9.6, không tuyên bố technical gate pass.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dịch của dự án; so 12 khoá chênh lệch lớn nhất → khác nghĩa 0: sửa 0, giữ 12, bất định 3. Các chênh lệch đều là thuật ngữ hoặc diễn đạt: bản mù dịch `padaṭṭhāna` là “nhân gần”, `vāsanābhāgiya` là “phần huân tập”, `vibhattihāra` là “phương thức phân loại”, `bhūmi` là “địa”, `paṭiniddesavāra` là “phần trình bày lại”; giữ cách của dự án theo tiền lệ đã đo (padaṭṭhāna → “nền tảng ứng với” 279/296 khoá; cấu trúc “X là nền tảng ứng với Y” ở 7.1–7.3 hai bản trùng; các tiêu đề `-hāra` “Nhóm … hướng dẫn đã được vận dụng” theo ne6:17.3, ne10:28.7, ne12:5.11). Ở 1.2, 5.3, 6.2, 6.6, 7.3 hai bản cùng một cách hiểu cú pháp; bản mù cũng ghi không chắc ở 5.3, 6.2, 7.3, đúng những chỗ dự án đã ghi là khó. Bất định (c), vẫn còn: 6.2 `Yāva desanaṁ upādāya gavesitabbā` (bản mù “Cho đến khi, dựa trên sự thuyết giảng, phải tìm hiểu”, bản dự án “dựa vào sự thuyết giảng, cần tìm xét cho đến cùng”; không phân xử được nghĩa của `yāva`), `dhammatā asādhāraṇā` ở 6.2–6.5 (“bản chất”), và vế cuối 5.3 `aññamaññaṁ paraṁ paraṁ sakaṁ sakaṁ visayaṁ nātivattanti`. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đối chiếu ne3:9.2 cho cùng câu
  kệ; không có đoạn song song): sửa 2 khoá: `1.2` `bhūmiñcā` *và nền* → *và đất nền* (ne3:9.2 là *đất
  nền*, *nền* trơn dễ lẫn với *nền tảng ứng với*; terminology fix); `5.3` vế cuối `aññamaññaṁ paraṁ
  paraṁ sakaṁ sakaṁ visayaṁ nātivattanti`: bản cũ *không vượt qua lẫn nhau, … ra khỏi phạm vi riêng*
  chồng phủ định khiến đọc như "ra khỏi phạm vi riêng", nay *không vượt qua nhau, hết pháp này đến
  pháp khác, và không pháp nào vượt khỏi phạm vi riêng của mình* (accuracy/clarity fix, `na
  ativattanti` bao `visayaṁ`). Giữ `vāsanābhāgiya` *nuôi dưỡng tâm* (ne37, pe2, pe4, pe8). Bất định
  còn: `6.2` `yāva`, `5.3` `paraṁ paraṁ`, `7.3` `saṅghasuṭṭhutāya`, `dummaṅku` *xấu xa*.

  Quyết định hội đồng biên tập 2026-10-16: B5 — `0.4`, `1.1`, `7.5` (`hāra` = “phương thức”; tiêu đề `-vibhaṅga` không dịch là “nhóm”).

  Nghiên cứu nguồn ngoài 2026-10-16: Ñāṇamoli, The Guide (Nettippakaraṇa), PTS 1962, bản scan https://archive.org/details/nettipakaranamofbhikkunanamoliptsroutledge_201_q (còn bản quyền PTS; chỉ làm bằng chứng nghĩa, không chép); Indacanda, Nettippakaraṇa song ngữ Pāli–Việt, https://tamtangpaliviet.net/TTPV/43_Net.pdf (không khai giấy phép: NOASSERTION; chỉ làm bằng chứng nghĩa; theo bản Ma/PTS-BJT, độc lập với Ñāṇamoli); đã đọc đối chiếu Pāli↔Việt↔Guide cho toàn bài (mọi khoá có nội dung), Indacanda dùng ở các khoá nêu và khi Guide hay Pāli bất định, không đọc song song toàn văn Indacanda; sửa không có; bất định không có khoá mới.

  Rà từng chữ bằng DPD 2026-10-16: 32 khoá đã rà; sửa không có (DPD khớp từng chữ nội dung: `dhammatā` *nature*, `gavesitabba` *should be investigated*, `upātivattati` *goes beyond*, `nātivattati` *does not overstep*, `saṅghasuṭṭhutā` *well-being of the community*; đối chiếu thêm Indacanda, Nettippakaraṇa song ngữ, phần Vibhattihāravibhaṅga); bất định `0.3` (*Nhóm 8* cho `Vibhaṅga 8` trùng nhãn với `Sampāta 8` ở `ne27:0.3`; quy ước chung ne4–ne19, không đổi riêng bài), `4.5` (Indacanda đọc `desanāya` là mục đích: *nhằm chỉ bảo bốn loại kinh này*), `6.2` (`yāva` → *cho đến cùng*; Indacanda không dịch chữ này và đọc `aṭṭhamaka` là *vị Nhập Lưu Đạo*/*vị Bất Lai Đạo*), `7.3` (`dummaṅku` DPD *unrepentant; obstinate*, Indacanda *kẻ ác xấu*; giữ *xấu xa*).
