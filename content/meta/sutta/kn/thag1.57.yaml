notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên. Không có blocker.
  
  **`0.4` phá vỡ quy ước tiêu đề của cả tầng — đây là điểm trừ chính.** Pāli `Dutiyakuṭivihārittheragāthā` được dịch thành *Kinh Kệ Của Vị Trưởng Lão Thứ Hai Ở Trong Túp Lều* — tức **diễn giải** tên thành mô tả. Tôi đã quét toàn bộ tầng `thag` để kiểm: **không có tệp nào** trong 264 tệp `thag` dịch tiêu đề theo kiểu mô tả; tất cả đều giữ tên riêng Pāli (*Kinh Kệ Của Trưởng Lão X…*). Tức đây là ngoại lệ duy nhất, và nó phá vỡ mạch tên của tầng: người đọc muốn tra nhị trưởng lão trong Trưởng Lão sẽ không tìm thấy. `1.5` cũng theo cùng cách (*Trưởng lão thứ hai ở trong túp lều*) nên nhất quán với `0.4`.
  
  Lưu ý: `kuṭi` (lều) đã được dịch thành *túp lều* ngay trong thân kệ (`1.1`–`1.4`), nên **cách dịch này tự thì tốt và nhất quán với chính bài**. Vấn đề chỉ nằm ở chỗ nó khác với 264 tệp `thag` còn lại. Đây là quyết định biên tập hơn là lỗi, nên tôi chỉ trừ `terminology` và `vietnamese_clarity`, không chặn.
  
  **Thân kệ dịch tốt.** Cả bốn vế đều là mệnh lệnh nói về một người tử tế và một tên người mà đang cố trú ở: `Ayamāhu purāṇiyā kuṭi` → *Đây là túp lều cũ của ngươi* ✓; `Aññaṁ patthayase navaṁ kuṭiṁ` → *mà ngươi vẫn mong một túp lều mới* ✓; `Āsaṁ kuṭiyā virājaya` → *Hãy buông hy vọng về túp lều, tỳ-kheo* ✓; `Dukkhā bhikkhu puna navā kuṭī` → *một túp lều mới chỉ thêm khổ nối khổ* ✓.
  
  **Ngôi hai và danh xưng đều đúng.** `patthayase` → *ngươi vẫn mong* ✓ (ngôi hai, `ngươi` đúng quy ước). `bhikkhu` xuất hiện hai lần ở `1.3` và `1.4` và được dịch *tỳ-kheo* cả hai ✓ — giữ đúng lặp, không rút gọn.
  
  **`virājaya` → *buông*.** `vi-rājaya` (thứ tự 2 ngôi của √raj = đi lang thang, nên `virājaya` = làm cho ngừng lang thang) → *buông* là cách dịch tự nhiên và đúng ý. Sujato dịch *Let go of hope for a hut* cũng vậy.
  
  **`Dukkhā bhikkhu puna navā kuṭī` → *một túp lều mới chỉ thêm khổ nối khổ*.** `Dukkhā` là từ chuyển từ *dukha* (khổ), nghĩa là "đau đớn" — bản dịch dùng *khổ* với sắc thái *chỉ thêm khổ* ✓.
  
  **Tầng Anh** có mặt đủ bốn vế và Sujato cũng dịch *you still want a new hut* — xác nhận ngôi hai của `patthayase`.
  
  **Tầng Việt**: không có Thích Minh Châu cho Trưởng Lão ở commit đã ghim.
