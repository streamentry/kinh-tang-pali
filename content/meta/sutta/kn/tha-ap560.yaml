notes: |-
  Bản dịch chỉ từ Pāli root; commit đã ghim không có bản Anh upstream (giới hạn upstream, không phải lỗi của người dịch). Cổng kỹ thuật để coordinator chạy (người dịch bị cấm chạy): npm run validate, npm test, npm run check, npm run build; technical_integrity đặt 9.6 vì chưa chạy được các cổng này.
  Số Pāli: Chaḷasītisahassāni = chaḷ 6 + asīti 80 = 86, nhân sahassa 1.000 = 86.000, dịch "Tám mươi sáu ngàn" (13.1). Satasahassito kappe = sata 100 × sahassa 1.000 = 100.000 kiếp (16.1). Bài này không có cụm Tiṁsakappasahassa nào, nên chưa phải dùng đến chỗ bất định tiṁsa (3 hay 30) của phẩm.
  Tiền lệ đếm trên tầng Việt tha-ap: 0.1 giữ Therāpadāna (457 so với 11); 0.2 Phẩm Yasa (5 so với 1 là Phẩm Danh Vọng). :0.3 của Pāli không có số thứ tự nên :0.3 Việt không có số và translationTitle bằng đúng :0.3. Kiểu 0.3: phạm vi gần nhất (tha-ap545 đến tha-ap575, 6 tệp) Ký Sự 4 so với Tuyên Ngợ 2; phạm vi tha-ap500 đến tha-ap600 Ký Sự 18 so với Tuyên Ngợ 15 (thêm 1 Tuyên Ngợi); toàn tầng Tuyên Ngợ 237 (thêm 10 Tuyên Ngợi) so với Tuyên Ngôn 115 so với Ký Sự 99. Chọn Ký Sự Về Trưởng Lão theo phạm vi gần nhất (tha-ap554, 555, 556, 557 cùng phẩm Yasa) và vì Apadāna là Ký Sự; hai phạm vi cho hai đa số khác nhau, và Tuyên Ngợ là chính tả sai của Tuyên Ngôn, nên cần biên tập phán một lượt cho cả cuốn. Lời kết dùng nhóm "những bài kệ này" (407 so với 21 là "bài kệ này"); 21.1 kết bằng "thứ tám" theo Aṭṭhamaṁ.
  Thuật ngữ: bhisa là ngó sen (tha-ap365: ngó sen; toàn tầng ngó sen 7, củ sen 8); muḷālika là củ sen; sappi là bơ lỏng (28 so với bơ sữa 14); paṁsukūla là y phấn tảo; cakkhumā là bậc Có Mắt (3 so với 1 bậc Hữu Nhãn); tādī là bậc Vững Vàng (11 so với Như Thật 9, Bất Động 8, Như Thị 2); devadeva là Đấng Thiên Trung Thiên (11 khoá); sambuddho ở 8.1 và 8.3 là bậc Tự Tại Giác (8.1 dùng lại nguyên văn 4 so với 0 của khoá trùng Pāli), 6.3 là Đức Chánh Đẳng Giác (dùng lại nguyên văn tiền lệ của đúng khoá). Duggatiṁ nābhijānāmi: phạm vi gần nhất 6 so với 0 là đọa xứ; toàn tầng khổ đau 135 so với đọa xứ trên 180 (gộp các dạng), nên dùng Ta không còn biết đến đọa xứ. Satasahassito kappe dùng đại kiếp (19 so với 6 là kiếp trước đây) theo đa số.
  Xưng hô trong lời thỉnh ở 4.3 đến 5.2 là con (tiền lệ tha-ap490, tha-ap308); lời Đức Phật chúc phúc ở 7.1 đến 7.4 dùng ông (tiền lệ tha-ap432), không dùng ngươi.
  Pāli trùng tiền lệ: 31 khoá có Pāli trùng nguyên văn ở các tệp khác (4.270 cặp), 24 khoá dùng lại đúng văn bản dịch đã có; 7 khoá Việt khác vì lý do đã đọc: 2.4 (anilañjase, tiền lệ không thống nhất), 3.4 và 11.4 đổi ngôi tôi thành ta cho đồng nhất với ngôi kể của bài, 6.4 (tiền lệ tha-ap343 thêm "không hề mỏi mệt" không có trong Pāli), 11.1 (tiền lệ tha-ap81 thêm "rực lửa" không có trong Pāli), 11.3 (ngữ cảnh khác tha-ap215: ở đây đang ngồi khi bị sét đánh), 12.3 (tiền lệ tha-ap56 và tha-ap434 coi Kaḷevara là tên riêng; ở đây kaḷevara là thân xác). Trong chính bài: 13.4, 14.4, 16.4 trùng Pāli và Việt giống nhau; 17.2, 18.2, 19.2 là …pe… và đều là một dấu …; 0 cặp trùng nội bộ mà Việt khác.
  Bất định: 2.4 anilañjase dịch giữa không trung (nghĩa đen đường của gió, tức bầu trời); 3.1 dhunanto chủ ngữ ngữ pháp là Đức Phật (buddho ở 2.3), giữ không ghi rõ chủ ngữ; 10.4 asanī ca phalī dịch tia sét nổ vang; 1.1 yaṁ trong Ogayha yaṁ pokkharaṇiṁ dịch kia; 4.4 muḷālikaṁ liền sau sappiṁ nên coi là món thứ ba (củ sen).
  Ghi nhận lỗi ngoài lát (không sửa): tha-ap442:13.3 Chaḷasīti ca gāthāyo dịch Sáu mươi tám bài kệ (phải 86); tha-ap67:2.1 và 5.4 dịch bhisa thành bó cỏ; tha-ap56:4.3 và tha-ap434:4.3 dịch Kaḷevaraṁ me patitaṁ thành Kaḷevara đã tìm đến ta; tha-ap343:6.4 thêm không hề mỏi mệt.
