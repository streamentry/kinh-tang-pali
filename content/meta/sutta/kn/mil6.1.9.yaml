notes: |-
  Dịch trực tiếp từ Pāli root tại commit bilara đã ghim (11c9d708978cde8ba61096d8a75f7ddfb846f639), 53/53 khoá trong `all` của lát, thứ tự y như Pāli. Không sửa khoá nào ngoài 2 tệp nêu trong giao việc.
  Văn xưng đo trên 222 tệp mil đã có trong tầng, khớp trên giá trị Pāli tuyệt đối chứ không đếm theo chuỗi Việt: `bhante nāgasena` → thưa tôn giả Nāgasena (136 lần) vs Thưa Đại đức Nāgasena (11), nên giữ thưa tôn giả xuyên suốt bài; `bhante` đứng riêng → thưa tôn giả (204) vs bạch tôn giả (34); `mahārāja` → này Đại vương (575 + 224 = 799) vs tâu (276 + 209 = 485) vs thưa (178 + 70 = 248) vs trần (122), nên lấy nhóm đa số nhất của tầng.
  `translationTitle` đo trên 222 tệp `content/meta/sutta/kn/mil*.yaml`: 222/222 đặt trong nháy kép, và 177/222 dùng khuôn `Câu Hỏi Về …` — cả hai số đều là đa số tuyệt đối, nên theo cả hai. Khoá `0.4` giữ tiền tố số như 133/135 tệp mil khác.
  `0.1 Milindapañha` dùng lại nguyên văn (211/222); `0.2 Anumānapañha` dùng `Câu hỏi về suy luận` (18/24 cặp trùng tuyệt đối; 5/24 dùng `Anumānapañha` — nhánh anh em mil6.1.3/4/6/8); `0.3 Buddhavagga` dùng `Phẩm Đức Phật` (5/7 ở đúng khoá `:0.3`, và 14/18 nếu gộp cả khoá `:0.2` của mil3.5.x); `10.1` `11.1` `12.1` theo khuôn colophon đã có (`thứ chín`, `thứ nhất`).
  Pāli trùng nguyên văn ở bài khác: dựng chỉ mục Pāli→Việt trên 5.358 tệp / 155.252 cặp khớp; 7 khoá của bài này trùng (0.1, 0.2, 0.3, 3.2, 5.3, 7.4, 12.1) và cả 7 đều dùng lại nguyên văn bản dịch đã có, theo đa số của từng cụm. Trong bài chỉ có 1 nhóm trùng (3.2 và 7.4, `Na hi, bhante`) và cả hai dịch giống nhau — 0 cặp trùng mà Việt khác.
  Thuật ngữ có tiền lệ đo được trong tầng mil: `mahāsamudda` → biển cả (5 khoá) vs đại dương (3) nên lấy biển cả; `hatthasata` → trăm sải tay (mil7.3.4:1.2) vs trăm bàn tay (mil7.3.6:2.1), lấy sải tay 1 lần cho cả cặp; `yojana` giữ nguyên chữ mượn như 6 khoá mil3.7.10/mil8; `satasahassa` = 100 × 1 000 → hàng trăm nghìn (mil7.3.10:4.1); `hatthināga`/`soṇḍā` → voi/vòi (mil5.4.4:3.3); `udakavārika` → bình nước (mil3.2.3:5.2); `sītodaka` → nước mát (mil5.5.6:5.1); `samaṇā sakyaputtiyā` → sa-môn dòng Thích Ca (mil3.1.5:5.2); `maṇiratana` → viên ngọc quý (13 khoá mil5.5.x); `candana` → chiên-đàn (mil6.1.3:1.3); `Sādhu` → Lành thay (50 khoá); `macchā` → cá (mil3.7.10); `nāvā` → thuyền; `sappaṭicchā` → tôi xin kính nhận (vì `tôi` 105 > `trẫm` 51 trong 222 tệp). Đặt mới 0 tiền lệ: `titthiyā` → đạo sĩ nữ; `bheripokkhara` → mặt trống; `pheṇamālī` → một khối bọt; `sīmā` (sobbha…ninnapokkharaṇi) → chỗ đánh bóng gợn sóng; `aggisantāpavega` → sức nóng lớn của lửa; `vātātapavega` → sức nóng của luồng gió nóng.
  Số Pāli trong bài này, tự tính: `0.4` số 9 là thứ tự câu hỏi trong phẩm (1..9 → 9); `2.1 ekindriyaṁ` = eka 1 → một giác; `6.2 hatthasata` = hattha 100 → trăm sải tay, `dve hatthasatāni` = dve 2 × 100 = 200 → hai trăm sải tay; `8.5 dvayaṁ` = dve 2 → hai trạng thái; `8.7 anekasatasahassa` = sata 100 × sahassa 1 000 = 100 000, với `aneka` = nhiều → hàng trăm nghìn; `8.8 anekasatayojanika` = sata 100 × yojana → hàng trăm yojana; `10.1 navamo` = nava 9 → thứ chín; `11.1 paṭhamo` = paṭha 1 → thứ nhất; `12.1 nava pañhā` = nava 9 → chín câu hỏi (tiền lệ mil3.2.9:5.1 viết y hệt). `8.6 hatthināgānaṁ` là từ chỉ voi, không phải số đếm. Không gặp `Tiṁsakappasahassa` trong bài này.
  Bất định đã ghi, chưa tự quyết: (1) `8.7 Hatthasatikāpi` là hapax toàn Pāli root (dò 284.708 khoá, `hatthasatik` chỉ có đúng một dạng) và không có bản Anh nào; cấu tạo chữ `hattha` 100 × `sati` 100 có thể là 10 000, còn theo `hatthasata` = 100 đã xác lập ở `6.2`, `mil7.3.4:1.2` và `tha-ap50:2.3` thì `hatthasatikā` = "hàng trăm". Tôi dịch "hàng trăm chiếc tàu lớn" theo cách đọc đó; nếu người biên tập chọn 10 000 thì sửa `8.7` một chỗ. (2) `9.1 gandhikaṁ` cũng là hapax, tôi dịc "gỗ thơm" vì nó đứng cạnh `lohitacandanaṁ` (chiên-đàn đỏ) và chỉ là vị ngữ tính từ; không có chứng cứ độc lập. (3) `1.1 kiṁ kīḷamānaṁ saddāyati` là câu hỏi bị lược; tôi giữ nghĩa hỏi ("hay là khi nó đang làm gì thì vang tiếng") thay vì chốt một đáp án.
  Coverage tầng tham khảo: mẫu số 42/53 khoá (đúng công thức `prose >= 40` sau khi gộp khoảng trắng, loại 4 khoá block `:0` và 7 khoá prose < 40) — Sujato 0/42 = 0.0%, Việt hiện hành 0/42, english-project 0/42. Không sửa `content/meta/reference-gaps.yaml` vì giao việc cấm chạm tệp đó; người điều phối chạy `npm run reference:gaps` để ghi nhận.
  `technical_integrity` = 9,6 vì lát này bị cấm chạy cổng (cấm mọi lệnh `git`/`gh` và `npm run validate|test|build|check|audit|reference:gaps`). Bốn lệnh còn lại do người điều phối chạy trước khi publish: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
