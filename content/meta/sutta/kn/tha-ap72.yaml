notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho tha-ap, xem `blocking_errors`.
  BÀI NÀY LÀ BÀI CUỐI CỦA PHẨM: `10.1` `Sakacintaniyavaggo sattamo` bảo phẩm này là phẩm thứ bảy, và `11.1–13.4` là `uddāna` liệt kê đúng 10 vị trưởng lão của phẩm (63–72) cùng tổng số kệ (`Gāthekasattati vuttā` = 70 câu). `Pāṭisambhidā catasso` ở 7.1–7.3 và `kataṁ buddhassa sāsanaṁ”.` trùng nguyên văn với `tha-ap495/497/498:10.1–10.3` → dùng lại đúng nguyên văn.
  TIỀN LỆ: `Therāpadāna` 307 lần giữ Pāli; `Sakacintaniyavagga` → `Phẩm Sakacintaniya` 7 lần; `Tassuddānaṁ` → `Tóm lược:` 302 lần; `anejaṁ aparājitaṁ`, `nisinnaṁ samaṇānaggaṁ`, `bhikkhusaṅghapurakkhataṁ`, `buddhaseṭṭhaṁ samokiriṁ`, `Tena cittappasādena`, `dvipadinda narāsabha`, `Pattomhi acalaṁ ṭhānaṁ`, `hitvā jayaparājayaṁ`, `Ekattiṁse ito kappe`, `buddhapūjāyidaṁ phalaṁ`, `Sattaratanasampannā`, `gaṇitā atthadassibhi` — mỗi cụm đều có 1–24 bản Việt trùng Pāli trong kho và đã dùng lại nguyên văn tiền lệ khi có; `gaṇitā atthadassibhi` → `đã được các bậc thông tuệ tính đếm`.
  NGÔI KỂ: `tôi` (xem tha-ap495).
  BẤT ĐỊNH 1 — NGÔI KỂ 3.1–3.4: `Đặt tôi vào lồng sắt, / làm tôi đi vào rừng sâu kia …` rồi `tôi rải lên cúng dường Đức Phật tối thượng` — ngôi xưng đổi giữa hai vế của cùng một kệ mà Pāli cũng vậy (`ṭhapetvāna` là ngôi thụ động). Dịch `Tôi bị đặt vào lồng sắt, / ở rừng sâu kia, nơi có hoa tuyệt diệu;` để không bịa thêm động từ chủ động. Vẫn ghi vào đây vì đây là chỗ dễ đọc sai nhất của bài.
  BẤT ĐỊNH 2 — `sapaccāgamanena` (12.2): `paccā` là tội lỗi; dịch `và kẻ đã lìa tội lỗi trở lại;`. 0 tiền lệ cho cụm này.
  BẤT ĐỊNH 3 — `garuḷaggaṁva pakkhinaṁ` (1.2): `garuḷa` = nhăn nhúm/quyền quạ; dịch `đã lui về ổ như cọp già nhăn nhúm`. 0 tiền lệ.
  TIÊU ĐỀ: `0.3`/`9.1` dùng `Bài Kệ Tuyên Ngợi Về Trưởng Lão …` vì 5/7 bài đã dịch trong Sakacintaniyavagga dùng mẫu này (63, 66, 68, 69, 70), còn `Ký Sự Về Trưởng Lão …` chỉ 2/7 (64, 71). Lưu ý cho người gộp: trong lát này, Kiṅkaṇipupphavagga dùng `Ký Sự` còn Sakacintaniyavagga dùng `Bài Kệ Tuyên Ngợi` — hai mẫu khác nhau trong cùng một lát, đúng theo phép đo cục bộ theo phẩm của BRIEF_VI3 §11, nhưng đây chính là điểm cần người điều phối gộp nếu muốn một mẫu duy nhất.
  SỐ KHOÁ TRÙNG PĀLI: 7/42 khoá trùng nguyên văn trong lát; toàn lát dùng lại 61 cặp, 0 lệch.
  GHI CHÚ KỸ THUẬT: `Pupphacaṅkoṭiya` chưa có tiền lệ trong kho nên bị chốt `lọt_pāli` chặn ở `9.1` và `13.2`; phải chạy `save_vi` hai lượt như đã mô tả ở tha-ap498.
