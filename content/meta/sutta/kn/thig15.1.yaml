notes: |-
  **Phạm vi: đủ 197/197 khoá của bài, không khoá nào ngoài danh sách.** Thứ tự khoá trong tệp bản dịch bằng đúng thứ tự Pāli (kiểm bằng phép so danh sách, không dùng phép cân tổng).

  **Nguồn và coverage — đo theo công thức khai ở `source/layers.yaml` (`substantivePaliMinChars: 40`, bỏ khối `:0`), tầng Anh tra qua manifest đã ghim:**
  · Độ dài Pāli lớn nhất của một khoá là **36 ký tự** (`10.2`, `24.2`, `30.2`, `31.2`), toàn kệ ngắn ⇒ **mẫu số cổng = 0/194** (194 khoá thân bài, `1.1`–`50.1`, bỏ ba khoá tiêu đề `0.1`–`0.3`). ⚠ Cổng coverage **không đo được gì** ở bài này; con số hiển thị không phải bằng chứng Sujato dịch đủ.
  · Đo thô thay thế: bản Anh Sujato đã ghim **có tệp** `thig15.1_translation-en-sujato.json` (manifest liệt kê tệp này; cùng tập khoá với Pāli), **192/194 khoá thân bài có chữ = 99,0%**; hai khoá để trống là `49.1` (colophon `… Isidāsī therī ….`) và `50.1` (`Cattālīsanipāto niṭṭhito.`); bỏ riêng hai colophon thì 192/192. Ba khoá `0.x` cũng có chữ. Cả hai số đều ≥ 0,80, không cần entry `reference-gaps`.
  · Tầng `english-project` **vắng** (không có tệp cho uid này, và không cần lấp vì Sujato chỉ bỏ trống hai colophon). Tầng `vietnamese-current` **vắng** (tại commit đã ghim thư mục Việt hiện hành chỉ có Pháp Cú). Bản Việt nguyên bài của SuttaCentral (Bhikkhu Indacanda, nhóm Bốn Mươi, 15.1) chỉ là mục *Tra cứu toàn văn* ở cuối trang, không phải tầng store, nhưng đã đọc để đối chiếu cách đọc cú pháp và cách gán người nói. ⇒ `triangulation` **8,9**: Pāli + một tầng Anh đủ, không có tầng Việt phân đoạn, không có bản Anh độc lập thứ hai. Các chỗ Sujato và bản Việt nguyên bài khác nhau hoặc cùng khác Pāli ghim đều ghi ở mục bất định.

  **Tái dùng nguyên văn — dựng chỉ mục Pāli→Việt ở mức segment trên toàn tầng đã dịch (gồm `thig14.1`, `thig13.1`–`thig13.5`):** chỉ **2 khoá** của bài có Pāli trùng nguyên văn (chuẩn hoá chữ hoa, dấu câu, nháy) với khoá ở bài khác: `0.2` (*Bộ Bốn Mươi Bài Kinh*, theo `thag18.1:0.2`) và `50.1` (*Bộ Bốn Mươi Bài Kinh đã khép lại.*, theo `thag18.1:40.6`), **cả hai giữ nguyên văn bản Việt cũ**; số cặp trùng ngoài bài mà bản Việt khác: **0**. Colophon `49.1` theo khuôn `… Trưởng lão nữ Subhā ở vườn xoài của Jīvaka ….` của `thig14.1:35.1`. `0.1` (*Therīgāthā 15.1*) trùng dạng Pāli có chủ đích, như các khoá `:0.1` khác trong tầng. Các khoá kệ còn lại không có Pāli trùng với bài nào khác ở tầng đã dịch.

  **Năm phép kiểm (tự viết, in số kèm mẫu số):**
  · (1) `set(khoá Việt) == set(khoá Pāli)`: **197 / 197**, thiếu **0**, thừa **0**; thứ tự khoá khớp Pāli. Phép **có đo được**.
  · (2) Nháy kép và nháy đơn **khớp Pāli từng khoá**: lệch **0**. Nháy kép `“”`: Pāli **3** khoá (`4.1` mở, `4.4` đóng, `5.4` mở và đóng, `6.1` mở; đóng ở `48.4` bằng `”ti`), Việt cùng vị trí. Nháy đơn `‘’`: Pāli **15** khoá, Việt **15** khoá, cùng vị trí. Lượt lời lồng nhau: lời Bodhī hỏi (`4.1`–`4.4`); lời Isidāsī kể (mở ở `6.1`, đóng ở `48.4`) và bên trong đó là lời chồng với cha mẹ chồng (`15.2`–`15.4`, `17.1`–`17.4`), cha mẹ chồng với chồng (`16`), cha mẹ chồng hỏi Isidāsī (`18.3`–`18.4`), lời Isidāsī đáp (`19`), lời cha mẹ chồng (`20.4`), lời cha của Isidāsī với người khất sĩ (`23.3`–`23.4`), lời người khất sĩ (`24.2`–`24.4`, `26.2`–`26.4`), lời cha mẹ Isidāsī (`25.3`–`25.4`), lời Isidāsī tự nghĩ (`27.3`–`27.4`), lời với ni sư Jinadattā (`30.4`), cha dặn (`31.2`–`31.4`, `33.2`–`33.4`), Isidāsī thưa cha (`32.3`–`32.4`). Dấu kết khoá: Pāli kết `’.`, Việt kết `.’` hoặc `?’`/`!’` theo cú pháp tiếng Việt.
  · (3) Pāli trùng nguyên văn trong bài: **8 nhóm** (`10.1`≡`30.1`≡`31.3`, `10.2`≡`30.2`, `15.3`≡`26.3`, `22.3`≡`48.3`, `31.1`≡`33.1`, `37.1`≡`39.1`≡`41.1`≡`43.1`, `38.3`≡`48.1`, `38.4`≡`40.4`≡`42.4`≡`43.4`), bản Việt khác về nội dung **0 nhóm** (chỉ khác chữ hoa đầu câu: `31.3` chữ thường vì nằm giữa câu, `38.3` chữ thường sau dấu chấm phẩy). Phép **có đo được**. Hai cặp Pāli gần trùng nhưng không phải nguyên văn: `15.4` (*Ekāgārehaṁ*) và `26.4` (*Ekagharehaṁ*) cùng nghĩa *trong cùng một nhà* ⇒ Việt cùng chữ; `15.2` (*āpucchahaṁ*) và `17.4` (*Apucchāhaṁ*) cùng một nghĩa *xin phép rồi sẽ đi* ⇒ Việt cùng chữ.
  · (4) Dấu lược: Pāli có `…` ở **1 khoá** (`49.1`, **2** dấu); Việt cũng **2**, lệch **0**. Mở rộng lược (Pāli không có `…` mà Việt có): **0**. `…pe…`: Pāli **0** khoá. `… cho đến …`: **0**. `(…)` trần: Pāli **0** khoá, Việt **0** (bài này không có khoá nào mang `(…)`, nên điều khoản giữ nguyên `(…)` không áp dụng). Pāli kết `….` ở `49.1` ⇒ Việt kết ` ….`.
  · (5) Số Pāli, thêm NFC, khoá rỗng, khoảng trắng: chưa NFC **0**; khoá rỗng **0**; khoảng trắng thừa hoặc hai dấu cách **0**; chữ số Ả Rập trong thân bài **0** (chỉ `0.1` có *15.1* giống Pāli, có chủ đích); Pāli lọt sang Việt chỉ là tên riêng (`Therīgāthā`, `Pāṭaliputta`, `Sakya`, `Isidāsī`, `Bodhī`, `Ujjenī`, `Sāketa`, `Lakkhī`, `Jinadattā`, `Erakaccha`, `Sindhava`, `Giridāsa`), giữ nguyên có chủ đích.
  · **Số Pāli** — tự tính, không dùng công cụ đo số chuẩn của kho vì không có cụm nào thuộc bộ cụm đã xác lập: `dve` (`1.4`) = 2 ⇒ *hai vị*; `dutiyā` (`2.2`) ⇒ *thứ hai*; `ekadhītā` (`6.3`) ⇒ *con gái duy nhất*; `ekaputtaka` (`13.3`) ⇒ *đứa con trai duy nhất*; `māsaṁ` (`22.1`) ⇒ *một tháng*; `pakkhaṁ` (`24.1`) ⇒ *nửa tháng* (một pakkha là nửa tháng âm lịch); `sattāhaṁ` (`34.3`) = 7 ngày ⇒ *bảy ngày*; `tisso vijjā` (`34.4`) = 3 ⇒ *ba minh*; `satta … jātiyo` (`35.1`–`35.2`) = 7 ⇒ *bảy kiếp sống*; `sattāhajātaka` (`38.1`) = 7 ngày tuổi ⇒ *mới sinh được bảy ngày*; `dvādasa vassāni` (`40.1`) = 12 ⇒ *mười hai năm*; `dvādase māse` (`41.4`) = tháng thứ 12 ⇒ *khi được mười hai tháng tuổi*; `tiṁsativassamhi` (`44.1`) = 30 ⇒ *năm ba mươi tuổi*; `soḷasame vasse` (`46.1`) = 16 ⇒ *năm thứ mười sáu*; `upaḍḍhasuṅka` (`21.3`) = một nửa sính lễ ⇒ *nửa số sính lễ*. Các `eka-` còn lại (`ekākinī` `27.2`, `ekamanā` `35.4`, `ekāgāra`/`ekaghara` `15.4`/`26.4`, `ekavaraka` `9.3`) là *một mình*, *nhất tâm*, *một nhà*, *duy nhất*, không phải số đếm. Không có `sata`, `sahassa`, `navuti`, `tālīsa`.
  · Đọc cặp Pāli↔Việt từng khoá (197/197 in ra đọc đối kháng): không có khối nào mang nội dung của khối bên cạnh. Bốn khối lặp cấu trúc (`37`, `39`, `41`, `43` mở bằng cùng một dòng; `38.4`, `40.4`, `42.4`, `43.4` kết bằng cùng một dòng) được giữ nguyên có chủ đích, như Pāli.

  **Thuật ngữ — đo trên tầng đã dịch, kèm số đếm:**
  · `seṭṭhi` ⇒ *triệu phú*: trên **15** khoá có `seṭṭhi`, *triệu phú* **9**, *trưởng giả* **2**; chọn *triệu phú*, theo `sn3.20` (mọi chỗ của vị *seṭṭhi gahapati*).
  · `dvipadaseṭṭha` (`33.4`) ⇒ *bậc tối thắng giữa các loài hai chân*: trên **116** khoá chứa `dvipad-`, *hai chân* **86**; chữ *tối thắng giữa các loài hai chân* theo `sn1.14:2.1`. `dvijāti` (`31.4`) ⇒ *những người hai lần sinh*: **0** tiền lệ trực tiếp cho chữ này.
  · `tisso vijjā` ⇒ *ba minh*: trên **75** khoá, *ba minh* **58**, *tam minh* **2**; chọn *ba minh*. `pabbajitā`/`pabbajj-` ⇒ *xuất gia*: **249**/**253** khoá. `nibbāna` ⇒ *Niết-bàn*: **924**/**987** khoá.
  · `bhikkhunī` ⇒ *tỳ-kheo-ni*: trên **281** khoá, *tỳ-kheo-ni* **234** so với *tỳ-kheo ni* **26**. `therī` (`49.1`) ⇒ *Trưởng lão nữ*, theo `thig14.1:35.1`; `ayye`/`ayyā` ⇒ *thưa ni sư* / *ni sư* (`4.1`, `28.1`, `30.4`), theo `thig13.4:19.1`, `thig13.4:21.1`.
  · `bahussuta` ⇒ *đa văn*: **142** so với *nghe nhiều* **59**, *học rộng* **25** trên **266** khoá; chọn *đa văn*, theo `thig13.2:9.1`. `vinayadhara` (`28.3`) ⇒ *nắm giữ Luật*: *thông hiểu Luật* **6**, *nắm giữ luật* **3**, *trì luật* **3** trên **67** khoá; chọn *nắm giữ Luật*, theo `dn16:4.10.2`.
  · `nijjareti` (`32.4`) ⇒ *làm tiêu mòn*: trên **21** khoá chứa `nijjar-`, *tiêu mòn* **6**, theo `dn34:2.3.112`, `sn42.12`. `vipāka` (`35.2`) ⇒ *dị thục*: **357** khoá, theo `dn2:32.11`, `dn33:3.2.64` (*quả và dị thục*).
  · `cavitvā` ⇒ *chết đi*: trên **63** khoá, *mệnh chung* **20**, *chết đi* **13**; chọn *chết đi* vì hợp văn cảnh tái sinh qua loài vật và địa ngục (`37.1`, `39.1`, `41.1`, `43.1`), như `dn24:2.15.3`. `niraya` ⇒ *địa ngục*: **205**/**207** khoá. `dāsī` ⇒ *nữ tỳ*: **14**, *tỳ nữ* **2**, *nữ nô* **3** trên **35** khoá.
  · `paradāra` ⇒ *vợ người khác*: **16**, *vợ người* **29** trên **46** khoá; chọn *vợ người khác*, theo `dn4:20.10`. `māna` (`14.2` `nihatamāna`) ⇒ *kiêu mạn*: *kiêu mạn* **17**, *ngã mạn* **28**, trên **1.720** khoá chứa `māna`/`mānaṁ` (phần lớn là `māna` ở nghĩa khác), nên không có đa số rõ; chọn *kiêu mạn* để khỏi đọc thành *ngã mạn* như một thuật ngữ kỹ thuật, vì Pāli không nêu `asmimāna`.
  · `satthavāha` (`45.1`) ⇒ *người dẫn đoàn buôn*: trên **33** khoá, *người dẫn đội* theo `dn23:23.12`, *thương chủ* **1**, *trưởng đoàn* **1**. `āsanaṁ paññāpeti` (`29.2`) ⇒ *trải chỗ ngồi*: **29** khoá, *trải chỗ* **3**, *soạn chỗ* **5**. `suvaṇṇakāra` (`36.2`) ⇒ *thợ vàng*: **7**/**11** khoá. `kulīna` (`1.3`, `7.2`) ⇒ *xuất thân/thuộc gia đình …*, theo `dn27:3.2` (*thuộc gia đình Bà-la-môn*).
  · `lakkhī` (`20.4`) ⇒ giữ tên *Lakkhī*: tầng có `ja382:11.3` (*Sirī và Lakkhī*) và `ja484:16.1`/`ja391:5.1` (*điềm lành*); chọn tên riêng kèm *vận may hiện thân*. `Sakya` ⇒ *Sakya*: **85**/**143** khoá chứa `sakya`.
  · Xưng hô: Bodhī gọi Isidāsī là *ni sư*; Isidāsī gọi Bodhī bằng tên và *chị*; trong lời kể, Isidāsī xưng *tôi*; chồng và người khất sĩ xưng *con* với cha mẹ/cha vợ; cha mẹ chồng gọi Isidāsī là *con*; cha gọi Isidāsī là *con yêu* (`31.2`) và *con* (`33.2`). Không đổi vai ở giữa bài.

  **BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh:**
  · `1.2` `maṇḍe`: dịch *tinh hoa*, nghĩa gốc `maṇḍa` là phần tinh túy, thượng hạng; Sujato *the cream of the world*; bản Việt nguyên bài *nơi trong lành nhất*. **0** tiền lệ trên tầng.
  · `4.3` `byālikaṁ`: dịch *điều tệ hại*; Sujato *problem*; bản Việt nguyên bài *điều xấu xa (ở cuộc sống tại gia)*. Phần ngoặc là chú giải, không đưa vào thân kinh. **0** tiền lệ.
  · `7.2`–`7.4` `uttamakulīnā … seṭṭhī pahūtaratano`: Pāli để `seṭṭhī` ở chủ cách, không nêu động từ; Sujato đọc *họ do vị triệu phú sai đến*, bản Việt nguyên bài giống. Việt chỉ nêu *vị triệu phú có nhiều châu báu* rồi tiếp *cha tôi đã gả tôi làm con dâu của ông ấy*, không thêm *sai đến*.
  · `8.3` `sirasā karomi pāde`: dịch *lấy đầu chạm xuống dưới chân*; nghĩa là cúi đầu đặt dưới chân, Sujato *bowed with my head to the feet*.
  · `9.1`–`9.3` `tamekavarakampi`: *taṁ* ở số ít, có thể chỉ riêng người chồng; dịch *thấy cả người chồng duy nhất ấy*, theo Sujato (*or even he, my one and only*). Cách đọc bản Việt nguyên bài gộp cả họ hàng lẫn chồng.
  · `10.3` `chādemi`: dịch *làm họ vừa lòng*; gốc `chādeti` ở nghĩa *làm vừa ý*; Sujato *brought out*, bản Việt nguyên bài *chiều chuộng*. **0** tiền lệ.
  · `11.1`–`11.2` `kālena upaṭṭhahitvā`: dịch *hầu hạ đúng lúc*; Sujato *risen bright and early*, bản Việt nguyên bài *thức dậy đúng giờ*. Tôi không thêm ý *thức dậy*.
  · `14.1`–`14.4` `bhattikataṁ … kārikaṁ … dussate bhattā`: các tính từ bổ nghĩa `maṁ`; `dussati` dịch *bực bội với*; nghĩa khả dĩ khác là *giận dữ*, *đối nghịch*. Không phân xử được hết.
  · `17.3` `dessāva me alaṁ me`: dịch *với con nàng chỉ là người đáng ghét, thế là đủ rồi*; `alaṁ me` đọc là *đủ rồi*, Sujato *I've had enough*. Cách đọc *đủ với con* cũng khả dĩ.
  · `19.3` `kātuyye`: dạng không chuẩn của nguyên mẫu; đọc là *làm*, theo Sujato (*What can I possibly do*).
  · `20.4` `rūpiniṁ lakkhiṁ`: dịch *Lakkhī xinh đẹp, vận may hiện thân*; `rūpinī` có thể là *có hình dạng* hoặc *xinh đẹp*; bản Việt nguyên bài viết *nữ thần Lakkhī (May Mắn) xinh đẹp*. Chữ *nữ thần* là phần chú, không đưa vào thân kinh.
  · `21.2` `dutiyakulikassa`: dịch *thuộc gia đình thứ hai*; Sujato *second wealthy family-man*; có thể hiểu *gia đình hạng nhì*, hoặc *gia đình thứ hai* mà cô gả vào. Không phân xử được.
  · `21.3`–`21.4` `tato upaḍḍhasuṅkena, yena maṁ vindatha seṭṭhi`: dịch *với nửa số sính lễ mà nhờ đó vị triệu phú đã cưới được tôi*; Sujato *half the bride-price of that which the financier paid*; `vindatha` ở đây đọc là *nhận được* (cưới được).
  · `22.2` `paṭiccharayi`: dịch *đuổi tôi đi*; gốc từ này hiếm, Sujato *wanted me gone*, bản Việt nguyên bài *đuổi tôi đi*. **0** tiền lệ.
  · `23.2` `damakaṁ dantaṁ`: dịch *người hay điều phục và đã được điều phục*; `damaka` cũng có thể chỉ người xin ăn. Sujato *a tamer of others and of himself*, bản Việt nguyên bài *huấn luyện (kẻ khác), đã được rèn luyện*.
  · `23.4`, `24.2` `poṭṭhiṁ`, `ghaṭikaṁ`, `mallakaṁ`: dịch *tấm vải rách*, *cái bình*, *cái chén*; Sujato *tonsure-cloth*, *pot*, *mug*; bản Việt nguyên bài *mảnh vải rách*, *cái tô*, *cái chậu*. **0** tiền lệ cho cả ba từ; nghĩa chắc chắn của `poṭṭhi` không phân xử được.
  · `25.4` `karihi`: dạng khó, có thể ngôi ba số ít (*cô ấy sẽ làm*) hoặc bị động; dịch dạng bị động (*sẽ được làm*) để không nêu chủ thể. Bản Việt nguyên bài nêu *vợ con sẽ làm*; Sujato *tell us what we can do*.
  · `31.2` `carāhi dhammaṁ`: dịch *thực hành Pháp*; bản Việt nguyên bài chú thêm *Phạm hạnh*. Phần chú không đưa vào thân kinh.
  · `34.4` `aphassayiṁ`: dịch *đã chứng được*; nghĩa gốc `phassati` là *chạm đến*; bản Việt nguyên bài *chạm đến ba minh*, Sujato *realized*. Chọn *chứng được* cho dễ hiểu, theo `dn1:1.31.7` (`phusāmi` ⇒ *chứng được*).
  · `35.1`–`35.3` `yassayaṁ phalavipāko`: `yassa` không nêu danh từ, đọc là *điều (đã làm)* mà đời này là quả; dịch *điều mà đây là quả cùng dị thục của nó*, không nêu rõ *nghiệp*. Sujato *the deeds of which this life is the fruit*.
  · `36.4` `so paradāraṁ asevihaṁ`: `so` ở ngôi ba nhưng động từ ngôi một; dịch *tôi đã gần gũi vợ người khác*.
  · `38.4`, `40.4`, `42.4`, `43.4` `yathāpi gantvāna paradāraṁ`: dịch *đúng như kẻ đã đến với vợ người khác*, giữ nghĩa so sánh (*như điều xảy ra với người đã …*); Sujato diễn nghĩa *because of adultery*, bản Việt nguyên bài *bởi vì*. Tôi không đổi thành quan hệ nhân quả cứng.
  · `40.3` `kimināvaṭṭo akallo` và `42.3` `andhovaṭṭo akallo`: dịch *bị giòi, cụt đuôi, không khỏe mạnh* và *mù, cụt đuôi, không khỏe mạnh*, theo Sujato (*worm-eaten, and tail-less*; *blind, tail-less, feeble*); bản Việt nguyên bài đọc `vaṭṭa` khác (*khổ sở*). **0** tiền lệ cho `vaṭṭa`/`āvaṭṭa`; không phân xử được hoàn toàn nghĩa *cụt đuôi*.
  · `41.4` `dvādase māse`: có thể là *vào tháng thứ mười hai* hoặc *khi được mười hai tháng tuổi*; Sujato nối vào câu sau (*for twelve months I drew a big plow*); dịch theo bản Việt nguyên bài.
  · `43.2` `vīthiyā dāsiyā`: dịch *nữ tỳ ở đường phố*; có thể hiểu *nữ tỳ làm việc công cộng*. Sujato *a slave in the street*.
  · `44.4` `dhanika purisapātabahulamhi`: dịch *có nhiều chủ nợ ập đến*; `dhanika` là chủ nợ hoặc người giàu; Sujato *greatly oppressed by creditors*, bản Việt nguyên bài *chịu nhiều áp chế từ những người giàu có*.
  · `46.3` `orundhatassa putto`: `orundhatassa` không phân xử được hoàn toàn; dịch *con trai của ông ấy đã giữ tôi làm vợ*, theo Sujato (*his son confined me as his wife*) và bản Việt nguyên bài (*người con trai của ông ấy đã chọn tôi làm vợ*).
  · `47.3` `anurattā bhattāraṁ`: đọc là người vợ kia *yêu mến chồng*, theo Sujato (*loyal to her husband*); bản Việt nguyên bài đọc là Isidāsī yêu chồng. `47.4` `viddesanaṁ akāsiṁ`: *tôi đã gây thù oán với nàng ấy* không nêu ai thù ai.
  · `48.2` `apakīritūna`: dịch *ruồng rẫy*; Sujato *abandoned*, bản Việt nguyên bài *ruồng rẫy*. **0** tiền lệ.
