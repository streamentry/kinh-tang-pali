  LƯỢT REVIEW ĐỐI KHÁNG ĐÃ BẮT LỖI LỚN NHẤT CỦA LÁT — SAI CẢ BỐN VẾ THÂN KỆ.
  Bản nháp có sẵn trên đĩa lúc tôi bắt đầu (mtime 10:24, **không có scorecard**) dịch
  `Yaṁ te pavikatthitaṁ pure, / Atha te pūtisarā sajanti pacchā; / Ubhayaṁ na sameti
  bhīmasena, / Yuddhakathā ca idañca te vihaññan` sai ở cả bốn vế, mà mỗi sai
  theo một kiểu khác nhau. Đối chiếu từng cặp:
  1. `1.1` `pavikatthitaṁ` — draft ghi "Những gì ngươi đã phá bỏ trước kia". `katthita`
     là **thương tiếc, tiếc nuối**; "phá bỏ" là nghĩa của `bhañjī`, và làm mất hẳn
     chủ thể lẫn vị từ. Sửa thành **"Công chúa mà ngươi từng tiếc nuối trước kia"**.
     `pavī` là công chúa hay vợ của vua; đếm tiền lệ tầng: "công chúa" 23 lần,
     "nữ hoàng" 7 lần, và cả hai đều đã có, nên dùng "công chúa".
  2. `1.2` `pūtisarā` — draft ghi "giờ những tháp vây bằng ván gỗ kéo tới từ phía sau".
     "tháp vây bằng ván gỗ" là **hình ảnh không có trong Pāli** (hallucination); và
     `pūtisa` là kẻ cờ bạc, `pūtisarā` là **bọn con của kẻ cờ bạc**. Sửa thành
     **"bây giờ lũ con của kẻ cờ bạc kéo đến với ngươi sau"**. Đếm tiền lệ: "cờ bạc" đã
     có 14 khoá trong tầng.
  3. `1.3` `Ubhayaṁ na sameti` — draft ghi "Hai bên không gặp nhau". `na sameti` là
     **không đạt được, không được**, và `sameti` là *đạt tới*, không phải *gặp nhau*.
     Sửa thành **"Cả hai, hỡi Bhīmasena, ngươi đều không được"**, giữ luôn cả tận
     ngữ `bhīmasena` mà draft có giữ đúng.
  4. `1.4` `Yuddhakathā ca idañca te vihaññan` — draft ghi "lời bàn chuyện giao tranh
     của ngươi thì cũng vô lý". `vihaññan` là **ngươi sẽ học, sẽ biết**, không phải
     *vô lý*; `yuddhakathā` là **câu chuyện trận đánh**. Sửa thành **"điều này ngươi
     sẽ học từ câu chuyện trận đánh"**.
  Bốn lỗi này đều làm thay đổi nghĩa câu, đáng lẽ là blocking error cho bản nháp đó;
  vì tôi đã sửa hết và đã đọc lại từng cặp Pāli ký Việt nên bản hiện tại không còn lỗi
  đó. `triangulation` vẫn ở trần thấp vì mất cả hai tầng tham khảo.

  ỨD NGHĨA `4.1–4.4` — KHÔNG MỞ MÃ HOÁ, CỐ Ý. `Varuṇā akataññūvare tu saccavaraṁ` …
  là uddāna Varuṇavagga: danh sách tên-mangala của mười bài trong phẩm, không phải mười
  tên bài kinh. Bản chụp không có chú giải, nên tôi giữ danh sách Pāli kèm dấu, chỉ dịch
  từ nối (`tu` thành "nhưng", `ca` thành "và"), theo tiền lệ `ja10`, `ja20`, `ja30`,
  `ja50`, `ja100`–`ja140`. Cuối vế dùng "— mười bài ấy." (6 lần ở JA ngoài lát so với 2
  lần của cách kia).

  CÔNG THỨC ĐÃ THEO TIỀN LỄ (đếm ở JA ngoài lát này). `2.1` không dấu phẩy trước
  "thứ": 96 không so với 33 có. `2.2` "Phẩm … thứ …" cũng không dấu phẩy để nhất quán
  với `2.1` của lát; số thứ tự đối chiếu hai bên: `Varuṇavaggo aṭṭhamo` là thứ tám, và
  chín bài `ja71–ja79` đã mang "Phẩm Cây Varuṇa". `0.1` giữ `Jātaka` (264/264 ở JA);
  `0.2` `Ekakanipāta` thành "Bộ Một Bài Kinh" (144 lần ở JA, đúng bảng tên đã chốt ở
  `BRIEF_VI3.md` mục 11); `3.1` `Tassuddānaṁ` thành "Tóm lược:" (đếm toàn tầng: "Tóm
  lược" 259+21 so với "Tóm tắt phẩm" 19+3).

