notes: |-
  Dịch từ Pāli root (đường dẫn đã ghim trong content/catalog/sutta/kn.json), đối chiếu
  bản dịch tiếng Anh của Bhikkhu Sujato tại cùng commit bilara. Tại commit đã ghim không
  có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya, nên không có
  tầng Việt truyền thống để so.

  COVERAGE Anh, đo bằng đúng công thức của src/lib/canon/reference.ts: substantive = 0
  (48 khoá Pāli đều ngắn hơn 40 ký tự sau nén) nên ratio = 1.0000 — bài qua cổng coverage
  một cách rỗng. Đo thủ công trên tệp Anh đã ghim: 48/48 khoá có key, 32 khoá có chữ Anh;
  16 khoá trống, và chúng rơi đúng vào các đoạn quan trọng nhất: toàn bộ khối uddāna và
  bài kệ (:10.1 đến :14.1, gồm cả bài kệ liệt kê tên các phẩm và bài giải thích Trì
  Giới Ba-la-mật). Những khoá đó dịch từ Pāli root một mình.

  TÊN, có số đếm. :0.1 Cariyāpiṭaka → Hạnh Tạng (23/26 bài cp có Pāli trùng tuyệt đối dùng
  hình thức này; 2 tệp để trống, 1 tệp giữ Pāli). :0.2 Hatthināgavagga → Phẩm Hatthināga
  (8/8). :0.3 Sīlapāramī 10 → Trì Giới Ba-la-mật Thứ Mười, theo đúng khuôn 8/8 của Sīlapāramī 1
  đến 9 đã có (Thứ Nhất/Hai/Ba/Tư/Năm/Bảy/Tám/Chín). :0.4 và :8.1 Saṅkhapālacariya →
  Hạnh Của Saṅkhapāla, theo khuôn Hạnh Của X (cp2 Hạnh Của Saṅkha, cp12 Hạnh Của Long
  Vương Bhūridatta, cp19 Hạnh Của Alīnasattu). :10.1 Tassuddānaṁ → Tóm lược: (đa số toàn
  tầng 327/443; riêng nhóm mil là 3/5 cùng hình thức này).

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ, đo bằng _c77_dup.py trên 5.238 bài Việt: :0.1 :0.2 (cp12,
  cp13, cp19…), :1.1 (đo chính xác: 10/16 bài cp khác dùng Lại nữa, vào thời thuở nọ), :1.2 (khuôn ta là Long
  vương X, có đại thần thông của cp12:1.2 và cp13:1.2), :3.1 :3.2 :3.3 :3.4 (nguyên văn
  cp12:4.1–4.4, chỉ bỏ cặp nháy đơn vì Pāli cp20 không có), :6.2 (tha-ap497:6.2), :8.1
  (khuôn Hạnh của X, thứ N của cp13:7.1).

  Cố ý KHÁC một tiền lệ, có lý do: :2.3 Caturo aṅge adhiṭṭhāya — cp12:3.3 dịch là Ta
  nương vào bốn chi phần, còn tôi dịch Ta bày ra bốn chi phần thân mình, vì Sujato đọc aṅge
  là factors nhưng bài hạt ngay sau (:3.1–:3.4) liệt kê da, gân, thịt, xương và nói xin cứ
  lấy đi, nên ở đây aṅga là chi phần thân thể; dùng lại nguyên văn cp12 sẽ thành câu vô
  nghĩa. Ngoài ra :5.1–:5.2 trùng nguyên văn :3.1–:3.2 của cp12, và tôi chỉ bỏ đúng cặp
  nháy đơn mà Pāli cp20 không có.

  THUẬT NGỮ, có số đếm. sīlapāramī → giới ba-la-mật (0 tiền lệ trong thân bài; khuôn tiêu
  đề Trì Giới Ba-la-mật đã chốt ở cp). bhojaputta → kẻ ăn thịt người (0 tiền lệ trong tầng;
  chọn theo đúng cách cp24 đã dịch Bhisacariya, cùng nghĩa). porisāda ở cp19 và cp32 →
  kẻ ăn thịt người, nên trong cp20 tôi giữ nguyên cách ấy thay vì sinh cách thứ hai cho
  cùng một nghĩa. mahiddhiko → có đại thần thông (53 lần Pāli trong tầng; khuôn cp12/cp13).
  hatthināga → Long vương (khuôn cp12, cp13). nāgasena, dhañña, pāsāṇa/sakkharika,
  ūsara, gambhīrasita: lấy từ cùng ẩn dụ ruộng đã có ở mil7.8.4.

  BẤT ĐỊNH ĐÃ GHI. (a) :2.3 Caturo aṅge adhiṭṭhāya: Sujato đọc aṅge là factors, nhưng
  ngay sau đó bài liệt kê da, gân, thịt, xương và nói xin cứ lấy đi, nên aṅga ở đây là
  chi phần thân thể; tôi dịch Ta bày ra bốn chi phần thân mình. (b) :5.2 naṅguṭṭhe
  piṭṭhikaṇṭake: Sujato dịch tail, nhưng naṅguṭṭha là vòng ở mũi và piṭṭhikaṇṭaka là gai
  sau lưng, ghép thành vị trí xuyên; tôi theo nghĩa từ. (c) :11.1–11.4 là uddāna liệt kê
  tên các phẩm của Phẩm Hatthināga (Hatthināga, Bhūridatta, Campeyya, bodhi, mahiṁso, ruru,
  mātaṅgo, dhammo, atrajo, jayaddiso); tôi dùng đúng các hình thức tên đã có trong 27 tệp
  cp (Long vương Bhūridatta, Long vương Campeyya, Trâu Vương cho mahiṁso theo cp15,
  Mātaṅga theo cp17, Jayaddisa theo cp19) và giữ Pāli cho Ruru, Bodhi, Dhamma, Atraja vì
  kho chưa có bản Việt nào cho các tên ấy. (d) :12.2 parikkhārā padesikā và :12.4
  anurakkhisaṁ (0 tiền lệ) tôi dịch là là gương đáng soi và chỉ đường cho, và giữ gìn giới
  hạnh không để xâm phạm.

  Cặp nháy kép: Pāli mở “ ở :1.1, đóng ” ở :7.4; không có nháy đơn. Bản Việt khớp đúng
  TỪNG khoá (0/48 lệch theo _c77_quotes.py). Cơ chốt _hvi.py chạy sạch: đủ mọi khoá có nội
  dung, không khoá thừa, NFC, không trùng nguyên văn Pāli, không lọt Pāli, số dấu lược
  khớp từng khoá, nháy kép cân trên cả bài.

