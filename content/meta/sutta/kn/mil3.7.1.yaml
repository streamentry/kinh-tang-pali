  Đã đọc HẾT vc/p74.txt trước khi viết.

  TIỀN LỆ ĐÃ ĐO.
    · `:0.1` `Milindapañha` giữ PĦLI: 190/201 tệp `mil`.
    · `:0.2` `Arūpadhammavavatthānavagga` → *Phẩm Xác Định Pháp Vô Sắc*: **15/15**.
    · `:0.3` `1. Satiuppajjanapañha` → *1. Câu hỏi về …*: trong tầng `mil`, mọi khoá
      `N. <X>pañha` đều đổi thành *N. Câu hỏi về …* — **79/79**; hoa/thường đo được
      *Câu hỏi về* (thường) 64 lần vs *Câu Hỏi Về* (hoa) 14 ⇒ dùng chữ thường.
    · `:19.1` `“Kallosi, bhante nāgasenā”ti.` trùng nguyên văn **77** bài; dạng phổ biến nhất
      **66/77** là *“Khéo lắm, thưa tôn giả Nāgasenā.”* — nhưng dạng đó **nuốt mất** dấu
      đóng `”`, mà cả bài PĦLI cân (5 mở / 5 đóng: `1.2`, `1.3`, `1.4`, `1.5` mở, `18.3`
      đóng, `19.1` mở+đóng). Tôi dùng *“Khéo lắm, thưa tôn giả Nāgasenā”ti.* — cùng dạng
      thân, giữ đủ nháy. Đây là chỗ tôi **không** dùng lại nguyên văn của đa số, và ghi rõ.
    · `ti` / `ti?` được **giữ** như tầng (mil: 610 `ti` + 206 `ti?`), vì tầng rõ ràng giữ.
    · `1.5` mở nháy và **không** đóng; dấu đóng của lời nói nằm ở `18.3`, đúng như PĦLI.

