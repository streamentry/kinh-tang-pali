  nguyên bài "người kia"; cùng lý do); 12.1 và 12.2 (`muddā`: dự án "ấn triện", bản nguyên bài "việc
  viết chữ" theo lời giải thích ở 12.2 về học chữ; nghĩa của `muddā` trong ngữ cảnh này chưa phân xử
  được, đã ghi ở bất định (1) phía trên). Không phát hiện lỗi nghĩa mới nào khi đọc đối kháng lại 47
  khoá. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản
  Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng 47 khoá Pāli↔Việt, đối chiếu bản nguyên bài Bhikkhu Indacanda, đoạn song song mil3.7.3:0.2, mil3.6.x:2.1): sửa 1 khoá.
  15.2: bỏ «:—» thừa, còn «cụ thể là:» (khớp 1.1 và tiền lệ kn/mil).
  Không tìm thấy lỗi nghĩa mới: chủ thể, phủ định, số lượng (mười bảy) và 17 mục đều khớp Pāli.
  Giữ: toàn bộ chỗ khác bản nguyên bài đã phân xử ngày 2026-10-14. «chánh niệm» cho `sati` giữ theo mil3.1.13 (glossary cho phép cả «niệm» lẫn «chánh niệm»); đổi sang «niệm» là quyết định thuật ngữ chung của người biên tập, không phải sửa lỗi. 5.2/6.2 `yamhi … amukasmiṁ` («nơi người nào» hay «điều nào đó») vẫn không phân xử được bằng ngữ pháp, giữ.
  Bất định: như đã ghi (muddā, kaṭumikā, oḷārika, sati = trí nhớ/niệm, Dự lưu/Nhập lưu). Không có bằng chứng mới nên giữ nguyên điểm.

  Quyết định hội đồng biên tập 2026-10-16: B6 — mil3.7.1:0.3, 1.2, 1.3 … 20.1 (40 khoá) (sati ở Milinda = “niệm” hoặc “trí nhớ”, “chánh niệm” chỉ cho sammāsati).

