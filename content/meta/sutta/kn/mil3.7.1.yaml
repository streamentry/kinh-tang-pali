  MỘT ĐIỂM PHẢI PHÁN, ĐÃ GHI.
    `sati` ở bài này là **trí nhớ** (17 dạng: trí biết trực tiếp, ký tắt, đếm, nhớ bền, nhờ
    sách, nhờ bản chép, điều đã trải qua…), **không** phải tứ giác của Tám đúng đắn. Nhưng
    `content/glossary/pali-vi.yaml` đặt `sati` → *niệm* / *chánh niệm*, và bài gần nhất
    `mil3.1.13` (`13. Satilakkhaṇapañha`) dùng *Chánh Niệm*. Tầng `name` của chính
    SuttaCentral (đã ghim, cùng commit) đặt tên `mil3.7.1` là *The Question on the Arising
    of Memory*. Bản nháp đầu đã dịch *trí nhớ*; tôi **đổi sang chánh niệm** vì glossary là
    memory máy kiểm được và `glossary:check` chạy trong CI, còn tiêu đề Anh chỉ là bằng
    chứng về cách hiểu. Nếu người biên tập muốn *trí nhớ* thì phải sửa cả glossary.

  MƯỜI BẢY THUẬT NGỮ — 0 tiền lệ cho cụm nào, đều đặt theo lời giải thích ngay sau trong
  chính bài (đây là cách duy nhất có cơ sở, không phải bịa): trí biết trực tiếp (`abhijāna`),
  việc hữu mục đích (`kaṭumikā`), trí biết tầm thường (`oḷārikaviññāṇa`), trí biết lành
  (`hitaviññāṇa`), trí biết chướng hại (`ahitaviññāṇa`), dấu hiệu giống nhau (`sabhāganimitta`),
  dấu hiệu khác nhau (`visabhāganimitta`), trí biết nhờ nghe nói (`kathābhiññāṇa`), dấu hiệu
  nhận dạng (`lakkhaṇa`), gợi nhớ (`sāraṇa`), ký tắt (`muddā`), đếm (`gaṇanā`), nhớ bền
  (`dhāraṇā`), tu tập (`bhāvanā`), nhờ sách (`potthakanibandhana`), nhờ bản chép
  (`upanikkhepa`), điều đã trải qua (`anubhūta`). `muddā` là mục khó nhất: dựa vào `12.2`
  (người học viết biết chữ nào phải viết sau chữ nào) tôi dịch *ký tắt*.

