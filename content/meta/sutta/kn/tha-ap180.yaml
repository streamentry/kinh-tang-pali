  **Không chạy `git`** (kể cả `status`/`diff`/`log`) và không chạy `gh` — đã tuân thủ.

  **NỘI DỤNG RIÊNG**: ở phía bên chân núi Himavanta có một dòng nước nông sinh ra;
  trong vùng đất lân cận bên bờ nó, bậc tự tại trú ở đó. Vị trưởng lão cầm tọa bàn ngọc quý
  dâng lên Đức Phật. 94 kiếp trước đã dâng viên ngọc ấy; 12 kiếp sau có một vị tên
  Sataraṁsī, tám vị vua trong hàng của ngươi đều là Chuyển Luân Vương, và có bốn vô ngại
  giải. Nghĩa tên suy ra từ cấu tạo: `maṇi` (ngọc quý) + `pūjaka` (người lễ bái) → "người
  lễ bái ngọc", khớp với 2.1–2.4. Chỉ để ở notes, không vào thân kinh.

  **Bất định đã ghi nhận, không giấu.**
  1. `Orena himavantassa` (`1.1`): `orena` đứng trước tên núi nghĩa là "ở phía trước / mặt
     gần" (theo địa lý Ấn Độ là phía tây). **0 tiền lệ.** Tôi dịch *Ở bên chân núi
     Himavanta* và **không** nêu hướng tây, vì Pāli không nêu và tôi không muốn suy địa lý
     vào thân kinh. Người biên tập nên xem lại nếu muốn giữ "phía tây".
  2. `Tassā cānupakhettamhi` (`1.3`): `anupakhetta` là vùng lân cận và `Tassā` là cách sở
     hữu của *dòng nước* ở `1.2`. Tôi dịch *Ở vùng đất lân cận bên bờ nó* — "bên bờ nó" là
     cách diễn đạt cho quan hệ `cānupakhettamhi`; đây là **diễn giải** chứ không phải nghĩa
     từ điển.
  3. `pallaṅka` (`2.1`): **0 tiền lệ ở dạng này.** Trong Nikāya `pallaṅka` là chỗ ngồi,
     tòa: `dn17:2.3` *sovaṇṇamaye pallaṅke* → *giường vàng*; `dn25:16.13` *nisīdati
     pallaṅkaṁ* → *ngồi kiết già*. Ở đây `Maṇiṁ paggayha pallaṅkaṁ` là "cầm lấy tòa bàn
     ngọc quý". Đây là **suy ra từ tiền lệ Nikāya**, không phải tra từ điển trong kho.
  4. `sādhucittaṁ manoramaṁ` (`2.2`): hai tính từ tả **tòa bàn ngọc**, nhưng `sādhu-citta`
     ("có tâm tốt") là nghĩa thường nói về **người**, và Pāli ở đây không cho biết nó tả
     vật hay tả người. Tôi dịch *đẹp đẽ, dễ nhìn* theo vị trí cú pháp và ghi rõ đây là
     **một cách phân xử, không phải điều chắc chắn**.
  5. `Aṭṭha te āsuṁ rājāno` (`4.3`): `te` là xưng "ngươi" (thứ hai số) + `āsuṁ` (sở hữu của
     ngươi) + `rājāno` (số nhiều). Tôi dịch *Tám vị trong hàng vua của ngươi*; `4.4` số nhiều
     `mahabbalā` bám theo "tám vị" ấy nên tôi dịch *là các Chuyển Luân Vương có đại thần
     lực* (tiền lệ `cakkavattī mahabbalā`: 55 cặp, 13 biến thể, số "các … đại oai lực" 16
     lần). Đây là **một cách đọc**; cách khác là "Tám ngươi làm vua".
  6. `sataraṁsīsanāmakā` (`4.2`): `Sataraṁsī` là **danh xưng vua** và có 3 tiền lệ giữ nguyên
     dạng Pāli (tha-ap511:1.1, tha-ap468:1.1, tha-ap54:8.3), nên tôi giữ `Sataraṁsī`. Số
     `sataraṁsī` là 320.000 theo cách tính 4×80.000 của Therāgāthā; tôi **không** dịch con số
     vì Pāli viết nó như một tên và 3 tiền lệ cũng không dịch.
  7. `Ito ca dvādase kappe` (`4.1`) **không có tiền lệ**; tôi dịch theo đúng khuôn đã đo ở
     `Ito ca aṭṭhame kappe` → *Cách đây tám kiếp về trước* (1 tiền lệ trùng chính xác ở
     tha-ap101:4.1). Đây là **ngoại suy từ 1 tiền lệ**.
  8. `buddhassa abhiropayiṁ` (`2.4`): 20 cặp trùng, 8 biến thể. Số đông nhất (7) là *rồi dâng
     lên Đức Phật* nhưng "rồi" không có trong Pāli; tôi theo *tôi dâng lên cúng dường Đức
     Phật* (4/20) vì `abhiropayiṁ` có hậu tố `-mi` — ngôi thứ nhất — mà Pāli bắt buộc phải
     có chủ ngữ.

  **ĐÃ SỬA so với lần ghi trước.** (1) Tệp bản dịch chỉ có 1/24 khoá → nay 24/24, nên
  blocker "thiếu segment bắt buộc" hết hiệu lực. (2) `6.1` đang là *… đã từng nói bài kệ
  này* (số ít `bài kệ` + thêm "từng") trong khi 41 khoá cùng công thức `Itthaṁ sudaṁ āyasmā
  <tên> thero imā gāthāyo abhāsitthāti` đã merge ở dạng *Tôi nghe như vầy: … đã nói
  **những** bài kệ này* → nay sửa theo đúng dạng đó (bỏ "từng", sửa số nhiều của `imā
  gāthāyo`). (3) `translationTitle` đổi cho khớp với `:0.3`. (4) `assessed_at` cập nhật.
  Blocker còn lại chỉ là cổng kỹ thuật chưa chạy.
