notes: |-
  Bài `tha-ap180` (24 khoá, lát n37 ghi đủ 24/24 khoá; kiểm toán độc lập 2026-10-12 ghi bên dưới). Các mục của ghi chú cũ về `Orena himavantassa`, `Tassā cānupakhettamhi`, `pallaṅka`, `sādhucittaṁ`, `Aṭṭha te āsuṁ rājāno`, `sataraṁsīsanāmakā`, `abhiropayiṁ`, `duggatiṁ nābhijānāmi`, nội dung riêng của bài, và quyết định tiêu đề `Tuyên Ngợ` đã bị mục "Giải quyết draft 2026-10-12" thay thế; không còn hiệu lực.

  **Tầng tham khảo (đo, không đoán).** Tra `source/upstream-manifest.json`, commit đã ghim: `pali` có 563 tệp `tha-ap`; `english-sujato` không có tệp thân kinh nào cho `tha-ap` (sub-collection `kn` của tầng Anh chỉ có cp · dhp · iti · ja · kp · snp · thag · thig · ud; tệp `tha-ap` duy nhất là tầng tên); `vietnamese-current` chỉ có 26 tệp Pháp Cú; `english-project`: 0 tệp cho bài này. Mẫu số coverage (Pāli ≥ 40 ký tự, bỏ khối `:0`) = 1 khoá (`:6.1`); Sujato phủ 0/1, `vietnamese-current` 0/1, `english-project` 0/1. Khoảng trống đã có entry trong `content/meta/reference-gaps.yaml` (`substantiveSegments: 1`, `substantiveWithoutEnglish: 1`, `coverage: 0`). Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; vì mẫu số chỉ 1 khoá nên số đo gần như không nói gì thêm.

  **Thuật ngữ nhất quán giữ nguyên (đo trên các khoá `kn` đã dịch).** `Therāpadāna` (`:0.1`) giữ nguyên như tên sách (đa số tầng). `Paṭisambhidā catasso` → *Bốn vô ngại giải*: 597/600 khoá. `…pe…` → `…`: nhất quán. `kataṁ buddhassa sāsanaṁ` → *đã làm tròn lời dạy của Đức Phật* (tiền lệ 348/381). `Pasannacitto sumano` → *Với tâm tịnh tín hân hoan* (66/91 khoá `Pasannacitto sumano`). `cakkavattī mahabbalā` → *là các Chuyển Luân Vương có đại thần lực* (tiền lệ số nhiều, 233 khoá có `mahabbal`; "đại thần lực" là dạng đa số; "đại oai lực"/"đại uy lực" cũng có, không thống nhất trong tầng). `sayambhū` → *bậc tự tại*; `buddhapūjāyidaṁ phalaṁ` → *quả báo của việc cúng dường Đức Phật*. Số kiếp: `Catunnavutito` = 4 + 90 = chín mươi tư (67/89 khoá cùng cụm); `dvādase` = mười hai.

  **Giải quyết draft 2026-10-12.**
  1. Phân loại blocker: blocker "cổng kỹ thuật chưa chạy" (lát n37 bị cấm lệnh npm) không phải lỗi văn bản; đã gỡ khỏi `blocking_errors`. Cổng kỹ thuật vẫn do công cụ kho chạy: `npm run validate` · `npm test` · `npm run check` · `npm run build`; ở đây không tuyên bố đã pass, `technical_integrity` giữ 9,6. Blocker còn lại duy nhất là loại thiếu bản Anh upstream (Sujato không phát hành bài này tại commit đã ghim; `english-project` cũng trống) — là sự thật về upstream nên giữ nguyên để waiver `no-upstream-english` xử lý. Không có blocker độ phủ Sujato hay lỗi văn bản treo. Giới hạn tham chiếu: tầng Việt hiện hành chỉ có Pháp Cú nên không có đối chiếu Việt truyền thống trong store; `triangulation` ≤ 8,0 (đặt 7,5).
  2. Đọc đối kháng 24 khoá từng chữ Pāli: 12/24 khoá đổi (0.3, 1.1, 1.2, 1.3, 2.1, 2.2, 2.4, 3.3, 4.2, 4.3, 6.1, 7.1). Sai nghĩa thật: 3 khoá. Thêm nghĩa/dịch thừa hoặc chữ vô nghĩa: 9 khoá.
  3. Lỗi nghĩa thật. (a) `3.3` `Duggatiṁ nābhijānāmi`: bản cũ *Tôi không biết điều lành dữ ấy* — `duggati` là cõi khổ, không phải "điều lành dữ"; nay *Tôi không biết đến đọa xứ* (đối chiếu 455 khoá cùng Pāli ở tầng: 261 dùng "đọa xứ", 50 "khổ xứ", 140 "khổ đau" kèm "rơi vào" không có trong Pāli, 4 khoá "điều lành dữ" — dạng sai, không có ở nơi nào khác trong cùng bài). (b) `4.3` `Aṭṭha te āsuṁ rājāno`: `te` là đại từ chỉ định "những vị ấy" (chủ ngữ số nhiều của `āsuṁ` = "đã là/đã có"), không phải "ngươi"; bản cũ *Tám vị trong hàng vua của ngươi* dựng ra một người nghe không có trong Pāli; nay *đã có tám vị vua ấy*. (c) `4.2` `sataraṁsīsanāmakā`: dạng số nhiều ("những vị cùng tên Sataraṁsī", đồng chủ ngữ với tám vị vua ở 4.3 và `mahabbalā` số nhiều ở 4.4); bản cũ *có một vị tên là Sataraṁsī* sai số; nay *cùng mang tên Sataraṁsī*. Cả 4.2–4.4 là một mệnh đề: tám vị vua cùng tên Sataraṁsī, đều là Chuyển Luân Vương. Số 8 do `aṭṭha`; 12 do `dvādase`.
  4. Thêm nghĩa/chữ lạ đã gỡ: `1.1` "chân núi" (Pāli `Orena himavantassa` chỉ "ở phía bên này của Himavanta", không nói chân núi) → *Ở phía bên này núi Himavanta*; `1.2` "sinh ra ở đó" (thêm "ở đó") và "dòng nước nông" → *một dòng sông nhỏ chảy ra* (tiền lệ cùng bộ: "sông nhỏ" cho `nadikā` ở 3 khoá khác); `1.3` "bên bờ nó" (Pāli không nêu bờ) → *Và ở vùng đất kề bên dòng sông ấy*, thêm `cā` = "và"; `2.1` "tọa bàn" là chữ không có nghĩa trong tiếng Việt → *Cầm lấy chiếc ghế bằng ngọc*; `2.2` "dễ nhìn" → *đẹp đẽ, làm vui lòng* (`manorama` = làm vui lòng); `2.4` "cúng dường" không có trong `abhiropayiṁ` → *tôi dâng lên Đức Phật* (tiền lệ 4 khoá); `6.1` "Tôi nghe như vầy:" là công thức `Evaṁ me sutaṁ` không có trong `Itthaṁ sudaṁ ...` → bỏ, *Tôn giả Trưởng lão Maṇipūjaka đã nói những bài kệ này như thế*; `0.3` và `7.1` `Tuyên Ngợ` là chữ vô nghĩa (và `Tuyên Ngôn` cũng không dịch `apadāna`) → *Ký Sự Về Trưởng Lão Maṇipūjaka* và *…, thứ tám*; `translationTitle` đã đổi khớp `:0.3`.
  5. Tiền lệ đo bằng số đếm và chỗ lệch có chủ ý. (i) `6.1`: 553/560 khoá cùng công thức `Itthaṁ sudaṁ āyasmā … abhāsitthāti` còn bắt đầu bằng "Tôi nghe như vầy" — là dạng lan của một bản mẫu sai; bài này đi theo Pāli và lệch 553/560, người biên tập nên quyết một lần cho cả phẩm. (ii) Tiêu đề: `:0.3` 560 khoá `theraapadāna`: "Tuyên Ngợ" 248, "Tuyên Ngôn" 138, "Ký Sự" 130; `:7.1` 119 khoá: "Tuyên Ngôn" 67, "Tuyên Ngợ" 46, "Ký Sự" 5. Đa số tầng dùng chữ vô nghĩa hoặc không dịch `apadāna`; `Ký Sự` là cách dịch chuẩn của chính nhan đề sách (`Therāpadāna`/Trưởng Lão Ký Sự) nên giữ làm cách của bài này; cần người biên tập quyết cho cả phẩm.
  6. Cách đọc `pallaṅka` (2.1): `Maṇiṁ paggayha pallaṅkaṁ` hiểu là chiếc ghế làm bằng ngọc (tiền lệ cùng tầng `Maṇimayā ca pallaṅkā` = ghế làm bằng ngọc; hai danh từ đứng liền nhau với `-ṁ` thường là hợp thành); khoá 3.2 `yaṁ maṇiṁ` vẫn dịch *viên ngọc ấy* vì Pāli dùng `maṇi` một mình. Chưa chắc 100%: cách đọc khác là hai vật (viên ngọc và chiếc ghế).
  7. Bất định còn lại (không thêm vào thân kinh). (a) `Orena himavantassa` (1.1): `orena` + sở hữu cách = "ở phía bên này/phía dưới"; hướng địa lý không được nêu, không dịch. (b) `anupakhetta` (1.3): không có tiền lệ nào trong tầng và không có từ điển trong kho; dịch theo nghĩa chung "vùng đất kề bên", không dùng "bờ". (c) `sādhucittaṁ` (2.2): `citta` có thể là "tâm" hoặc "được trang hoàng, đa sắc"; với vật dâng thì đọc "đẹp đẽ" là hợp cú pháp, nhưng đây là cách phân xử, không phải điều chắc chắn. (d) `kataṁ` (5.3): "đã làm tròn" theo tiền lệ 348/381; nghĩa gốc là "đã thực hiện", giữ theo quy ước. (e) `mahabbalā` (4.4): `bala` là sức mạnh/binh lực; giữ "đại thần lực" theo tiền lệ, không thống nhất trong tầng. (f) `Ito ca dvādase kappe` (4.1): chỉ 1 tiền lệ trùng, đọc "cách đây mười hai kiếp" (cùng chuỗi: 94 kiếp trước dâng ngọc, 12 kiếp trước làm vua — nhất quán theo thời gian). (g) `sataraṁsī`: giữ nguyên dạng tên Pāli, không dịch thành số 320.000.
  8. Đối chứng ngoài (chỉ để hiểu cách đọc, không chép câu chữ): bản Việt nguyên bài ở mục Tra cứu toàn văn đọc 2.1 là ghế làm bằng ngọc, 4.2–4.4 là "tám vị vua cùng tên Sataraṁsi", và 3.3 là "khổ cảnh" — khớp với các sửa trên. Tầng này không phải tầng store theo từng segment nên không tính vào coverage hay `triangulation`.
  9. Kỹ thuật: tập khoá Việt = Pāli (24/24, thiếu 0, thừa 0), thứ tự khoá theo Pāli, NFC, không khoá rỗng; dấu lược 5.2 `…pe…` → `…` đúng một dấu; nháy “ ở 1.1 và ” ở 5.3 khớp Pāli (Pāli cố ý để nháy chạy qua nhiều khoá, giữ nguyên); không có `(…)` trần; Pāli trùng nguyên văn trong chính bài: 0 cặp (phép này rỗng). Pāli không lọt sang bản Việt (trừ tên riêng và tên sách `Therāpadāna`, `Himavanta`, `Sataraṁsī`, `Maṇipūjaka`). `technical_integrity` 9,6; bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy ở lượt này.

  Quyết định hội đồng biên tập 2026-10-16: B2 — 1.4 (sayambhū = "bậc Tự Giác").
