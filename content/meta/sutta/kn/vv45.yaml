notes: |-
  Dịch từ Pāli root commit 11c9d708.
  Upstream không có bản dịch tiếng Anh của Sujato tại commit đã ghim.
  59/59 khoá khớp Pāli root tuyệt đối.
  Nháy kép và đơn khớp 1:1 với Pāli từng khoá.
  12 dấu lược … cân bằng chính xác với Pāli.
  Bốn câu chuyện cúng hoa (sen xanh, súng xanh, hoa rễ trắng lá xanh, hoa lài) và quả báo sinh thiên dịch chuẩn xác.

  Lượt cải thiện 2026-10-11 (đọc đối kháng từng khoá với Pāli; 40/59 khoá đổi; lỗi nghĩa thật ở 13/59 khoá; điểm tự chấm 9.28 trước đó KHÔNG đúng, hạ xuống 9.04). Mục "Dịch từ Pāli root … dịch chuẩn xác" ở trên về nội dung cúng hoa và địa điểm bị thay thế bởi mục này.
  (a) ĐẢO VẾ VÀ BỎ SÓT Ở 3.3–3.4, 7.3–7.4, 11.4–11.5, 15.4–15.5 (8 khoá): Pāli `Esikānaṁ uṇṇatasmiṁ` (vế đầu) và `Nagaravare paṇṇakate ramme` (vế sau) bản trước đặt ngược chỗ, `paṇṇakate` bị bỏ hẳn, `ramme` + `vare` gộp thành "kiều diễm tuyệt vời". Sửa: vế đầu `trên miền cao của người Esikā,`, vế sau `tại thành phố tuyệt hảo Paṇṇakata đáng yêu.` (`nagara` = thành phố theo vv16, cp19; `ramma` = đáng yêu theo thi-ap17/28, nhiều nơi khác). Bản trước dịch `Esikānaṁ uṇṇatasmiṁ` thành "nơi dựng lên những cây trụ cao lớn" (có động từ "dựng" không có trong Pāli).
  (b) `yassa kammassidaṁ phalaṁ` (2.3/6.3/10.3/14.3): bản trước `đây là quả báo của nghiệp ấy` (yassa bị đọc thành "ấy", mất mệnh đề quan hệ). Sửa: `về nghiệp mà đây là quả báo.` (14 khoá vv khác dùng đúng dạng này; 38 khoá dùng `quả báo của nghiệp này là thế` — lệch đa số có chủ ý vì đa số mất quan hệ `yassa`).
  (c) `Tena metādiso vaṇṇo` (4.1/8.1/12.1/16.1): bản trước `Do nghiệp ấy` thêm chữ "nghiệp" không có trong Pāli (`tena` = "do việc ấy/nhờ đó"). Sửa theo tiền lệ 49 khoá: `Nhờ vậy tôi có được dung sắc như thế này,`.
  (d) `Abhikkantena vaṇṇena` (1.1/5.1/9.1/13.1): `dung mạo tuyệt hảo` → `dung sắc thù thắng` (`vaṇṇa` đồng nhất với 1.3 và 4.3 là `dung sắc`; không thêm `rạng rỡ` dù 26 khoá vv dùng, vì `abhikkanta` không có nghĩa ấy). `sabbadisā` `các phương` → `muôn phương` (24 khoá cho dạng `te`, 19 khoá cho dạng `me`); câu `me` kết `.”`.
  (e) `Bhikkhuno piṇḍāya carantassa` (3.2/7.2/11.3/15.3): `lên vị tỳ-kheo…` → `cho vị tỳ-kheo đang đi khất thực` (25/25 tiền lệ, cách dative). `ahamadāsiṁ` thống nhất `dâng` (11.2/15.2 trước là `cúng dường`).
  (f) 15.1 `sumanā sumanassa sumanamakuḷāni`: bản trước bỏ `sumanassa` (chỉ có "với tâm hoan hỷ"). Nay `Tôi hoan hỷ, những nụ hoa lài dành cho vị có tâm hoan hỷ,`. 15.2 `Dantavaṇṇāni` `có màu như ngà voi` → `có màu ngà` (thag17.1: `dantavaṇṇika` = màu ngà; "voi" không có trong Pāli).
  (g) 11.1–11.2 `Odātamūlakaṁ haritapattaṁ, udakasmiṁ sare jātaṁ`: bản trước thêm "loài hoa" — Pāli không nêu danh từ. Nay `Thứ có rễ trắng, lá xanh,` / `mọc trong nước nơi hồ, tôi đã dâng;`.
  (h) TIÊU ĐỀ: 0.1 `Chuyện Thiên Cung` → `Vimānavatthu` (giữ Pāli, 84/85 tệp vv); 0.2 `Thiên Cung Nữ` → `Chuyện Cung Điện Nữ`; 0.3 → `Phẩm Mañjiṭṭhaka` (tiền lệ 5 lần); 0.4 `Chuyện Thiên Cung Bốn Nữ Thiên` → `7. Chuyện Cung Điện Bốn Người Nữ` (`itthi` = người nữ, đánh số `7.` theo Pāli; `Cung Điện` thay `Thiên Cung`, đa số tệp vv); 17.1 `Cung Điện Bốn Người Nữ, thứ bảy.`; `translationTitle` đổi khớp. Mọi khoá bỏ khoảng trắng cuối.
  GHI NHẬN, KHÔNG SỬA RIÊNG: ~51 tệp vv khác dịch `Itthivimāna` thành `Nữ Hư Không` (không có `ākāsa` trong Pāli); riêng tệp này ghi `Chuyện Cung Điện Nữ` vì đã không còn tiền lệ cần giữ; cần sửa đồng loạt toàn bộ vv.
  KHÔNG ĐỔI DÙ NGHI NGỜ: 3.1 `indīvara` → `sen xanh` và 7.1 `nīluppala` → `súng xanh`: tiền lệ toàn tầng dịch cả hai thành `sen xanh` (indīvara 5/5, nīluppala 2/2); trong cùng bài hai loại xuất hiện cạnh nhau nên phải phân biệt, và đảo gán không có căn cứ hơn. `hatthaka` = `một bó` giữ nguyên.
  BẤT ĐỊNH CÒN LẠI: (1) `Esikānaṁ` — hapax toàn Pāli root (4 lần, chỉ trong bài này). Đọc là tên dân/xứ (`miền cao của người Esikā`) dựa trên bản Việt nguyên bài ở mục Tra cứu toàn văn (dùng để hiểu cách đọc, không chép câu chữ) và vì cách đọc `cột trụ` (esikā có 72 lần ở nơi khác, nghĩa cột trụ) không giải thích được `uṇṇatasmiṁ` là vị trí của thành phố; chưa có tầng tham khảo độc lập phân xử. (2) `paṇṇakate` — đọc là tên thành `Paṇṇakata`; phương án "(thành) được làm bằng lá" chưa loại trừ được. (3) 15.1 `sumanā` có thể là tên nữ thiên (Sumanā) thay vì tính từ `hoan hỷ`; `sumanassa` có thể là sở hữu cách của `sumana` (cây lài) thay vì tính từ của vị tỳ-kheo; chọn cách đọc tính từ, không thể chứng minh. (4) 11.1 `odātamūlakaṁ haritapattaṁ` — không xác định được loài cây (chưa có tiền lệ nào trong kho); để trung tính. (5) `tena` ở 4.1 chỉ việc dâng hoa trong cả bài. Không có tầng Anh đã ghim cho vv: `triangulation` giữ 7.5.
  Số khoá đổi 40/59 (13 khoá lỗi nghĩa thật; 27 khoá còn lại là chỉnh từ ngữ, tiêu đề, khoảng trắng). Điểm đổi: semantic_fidelity 9.4→8.8, grammar_logic 9.4→9.0, segment_alignment 10.0→9.8, terminology 9.3→8.9, vietnamese_clarity 9.4→9.0, ambiguity_integrity 9.2→8.8, các điểm còn lại giữ; final 9.28→9.04. `technical_integrity` giữ 9.6; bốn lệnh `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy trong lượt này.
