notes: |-
  Đủ 15/15 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Khung: Kusanāḷivagga → Phẩm Lau Kusa (9 bài); `Kusanāḷivaggo terasamo.` → Phẩm Lau Kusa, thứ mười ba.

  Tên bài: `Kosiyajātaka` tôi GIỮ tên Pāli (Kinh Kosiyajātaka) thay vì dịch. Lý do đếm được: tầng đang làm đúng như vậy với những tên mà tôi không kiểm chứng được — ja27 Kinh Abhiṇhajātaka, ja32 Kinh Naccajātaka, ja92 Kinh Mahāsārajātaka, ja102 Kinh Paṇṇikajātaka — và `kosiya` là tên con chim nên gọi tên riêng cũng đúng; bản kinh vốn dùng `kosiye` ở câu kết để xưng hô, tôi giữ Kosiya.

  Nghĩa bài: `Yathā vācā ca bhuñjassu, / yathā bhuttañca byāhara; / Ubhayaṁ te na sameti, / vācā bhuttañca kosiye` — lời nói và cái ăn không khớp nhau. Tôi giữ đúng mệnh đề kép và không thêm lời giải thích; `bhuñjassu` và `byāhara` là cặp động từ đối xứng nên tôi dịch ăn / mang đi, giữ sự đối xứng.

  Uddāna `Kusanāḷisirivhayano ca yasaṁ, / Dadhi mamba kaṭāhakapañcamako; / Atha pāpaka khīra biḷāravataṁ, / Sikhi kosiyasavhayanena dasāti.` Khớp rõ với phẩm ở ba tên (Kusanāḷi = ja121, Kaṭāhaka = ja125, Biḷāravata = ja128); tôi tách các tên còn lại theo ranh giới chữ rõ ràng, còn `kaṭāhakapañcamako` và `kosiyasavhayanena` là ghép nên tôi giữ. `biḷāravata` trùng nguyên văn với `Biḷāravatajātaka` ở ja128 nên tôi viết đúng dạng đó.
  Vì sao không dịch nghĩa các tên: xem ghi chú ở ja10 và ja120 — uddāna trong bản chụp này không khớp một-một với tên các bài trong phẩm, nên đoán nghĩa là bịa.

  LỖ HỔNG TẦNG THAM KHẢO: Không có tầng tham khảo English Sujato tại commit đã ghim: đã duyệt .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ và không có tệp cho uid này (0/15 khoá có prose), và tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên Khuddaka Nikāya cũng không có bản Hòa thượng Thích Minh Châu; bài dịch chỉ từ Pāli, chưa đối chiếu được tầng tham khảo nào nên giữ draft. Mọi khoá Pāli dưới 40 ký tự nên mẫu số coverage rỗng, bài vẫn giữ draft vì không có tầng tham khảo nào để đối chiếu. Bản Việt hiện hành không có cho Jātaka.

