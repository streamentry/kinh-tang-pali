  **Số Pāli, tự tính.**
  `Dasa guṇe` (`9.2`, `9.4`) = mười đức tính, và `9.4` kể đủ mười mục: không tham đắm, không dính mắc, xả bỏ, đoạn trừ, không quay trở lại, vi tế, vĩ đại, khó thấu hiểu, khó gặp, vô song; 10 = 10.
  `Dasa dānāni` (`14.2`, `14.14`) = mười món, và `14.4`–`14.13` kể đủ mười mục: chất say, hội hè, phụ nữ, bò đực, tranh vẽ, vũ khí, thuốc độc, xiềng xích, gà và heo, cân gian và đấu gian; 10 = 10.
  Bảy việc khó làm: `2.1` là việc đầu, `3.1` `dutiyaṁ` hai, `4.1` `tatiyaṁ` ba, `5.1` `catutthaṁ` bốn, `6.1` `pañcamaṁ` năm, `7.1` `chaṭṭhaṁ` sáu, `8.1` `sattamaṁ` bảy; 7 khoá = bảy việc, đúng thứ tự.
  `Dve atthavase` (`25.1`, `25.5`) và `Katame dve` (`25.2`) = hai lý do, `25.3` kể đúng hai: con đường bố thí không suy giảm, và ông của các con sẽ chuộc về. `Dve dārake` = hai đứa trẻ.
  `Dasasahassiyā lokadhātuyā` = dasa 10 × sahassa 1000 = mười nghìn thế giới (`9.1`, `13.3`), giữ đúng cách dịch của `mil5.1.1` và `mil5.1.7`.
  `Pañcayojanasataṁ` = pañca 5 × sata 100 = năm trăm do-tuần (`30.2`); `tisahassayojana` = ti 3 × sahassa 1000 = ba ngàn do-tuần; `caturāsītikūṭasahassa` = caturāsīti 84 × sahassa 1000 = tám mươi bốn ngàn đỉnh; `pañcannaṁ mahānadīsatānaṁ` = 5 × 100 = năm trăm sông lớn; `dasa dvādasa yojanāni` = mười, mười hai do-tuần (`32.2`); `yojanasahassehi` = hàng ngàn do-tuần (`32.3`).
  `Catuhatthāyāma` = bốn khuỷu tay (`27.2`); `aṭṭharatanubbedho navaratanāyāmapariṇāho` = cao tám, dài và chu vi chín, với `ratana` đọc là đơn vị đo chiều dài bằng một `hattha` (khuỷu tay) và dịch cùng đơn vị (`28.2`).
  `Sahassaṁ` 1000 (`33.1`, `32.4`: một ngàn nikkha), `sata` 100 (`32.4`: một trăm nô lệ nam, nô lệ nữ, voi, ngựa, bò cái, bò đực, nikkha, `sabbasataṁ` = mọi thứ đều một trăm), `sataṁ sahassaṁ satasahassaṁ` (`15.3`) = một trăm, một ngàn, một trăm ngàn (sata 100 × sahassa 1000 = 100.000), `anekasatasahassaguṇaṁ` (`11.3`) = nhiều lần trăm ngàn, dịch `gấp nhiều trăm ngàn lần`, `satadhā vā sahassadhā vā` (`8.1`) = trăm mảnh hay ngàn mảnh. Không có cụm số nào chưa phân xử được; không có `Tiṁsakappasahassa`.

  **Tiền lệ (đếm trên tầng vi hiện có, loại tệp này).**
  Pāli trùng nguyên văn với nơi khác trong tầng: 9 khoá có Pāli trùng, tổng 564 cặp, 149 cặp bản Việt khác bản của tôi; trong phạm vi `mil` là 8 khoá, 403 cặp, 51 cặp khác; trong phạm vi `mil6.3` là 7 khoá, 51 cặp, 7 cặp khác. Dùng lại nguyên văn bản đa số: `Milindapañha` (231 trong 243), `Anumānapañha` → `Câu hỏi về suy luận` (23 trong 29), `Vessantaravagga` → `Phẩm Vessantara` (10/10), `Kiṁ kāraṇā?` → `Vì cớ gì?` (23 trong 26, `18.5`), `Katame dve?` → `Thế nào là hai?` (63 trong 107, `25.2`; tôi đổi từ `Hai lý do nào?` để theo đa số), `Na hi, bhante` → `Không phải vậy, thưa tôn giả.` (62 trong 88, `26.3`). Không theo đa số: `Katame dasa?` (`9.3`) → `Mười điều nào?` vì đa số tầng (`Mười pháp nào?`, 15 trong 39) mang nghĩa `dhamma`, còn ở đây là mười `guṇa` đã nêu ở `9.2`; `Katamāni dasa?` (`14.3`) → `Mười món nào?` (không có đa số rõ: 14 cặp, dạng nhiều nhất chỉ 3) vì ngữ cảnh là mười món bố thí; `Sabbaññutaṁ piyaṁ mayhaṁ` (`23.3`) → `trí toàn tri mới là điều ta yêu quý`: 8 cặp, 7 trong số đó ở Hạnh Tạng dịch `Mà vì Nhất Thiết Chủng Trí là điều quý báu nhất đối với ta`; tôi giữ cách dịch của `mil5.1.2` và `mil5.1.4` (trong `mil`: 12 khoá dùng `toàn tri`, trong đó 8 khoá là `trí toàn tri`, 0 khoá dùng `Nhất Thiết Chủng Trí`), và không thêm chữ `quý báu nhất` vì Pāli chỉ có `piya` (yêu quý), không có so sánh hơn nhất.
  Thuật ngữ có đếm: `dānapati` → `thí chủ` (43 trong 54 khoá toàn tầng; `người bố thí` 31, `chủ thí` 6, các dạng này có thể cùng mặt ở một khoá); `kittisadda` → `tiếng tốt` (31 trong 87; `danh tiếng` 18, `tiếng tăm` 3) và `kitti` → `danh tiếng`; `yakkha` → `dạ-xoa` (209 trong 252 khoá, `quỷ` 4); `asura` → `a-tu-la` (35 trong 43); `nāga` (loài rồng) → `rồng` (46 khoá; giữ Pāli `Nāga`/`nāga` 27); `gandhabba` → `càn-thát-bà` (67 trong 100, giữ Pāli 17); `kinnara` giữ Pāli (13 trong 18); `rakkhasa` → `la-sát` (8 trong 46); `ākāsa` → `hư không` (9 khoá `mil`, `không gian` 2); `sugati` → `cõi lành` (120; `thiện thú` 104); `apāya` → `đọa xứ`: trong công thức `apāyaṁ duggatiṁ vinipātaṁ nirayaṁ` là `đọa xứ` 123, `ác thú` 150; ngoài công thức là `đọa xứ` 9, `ác thú` 1; `apāyagāmī` đứng riêng nên theo nhóm sau; `pakkhahata` → `bại liệt nửa người` (tầng dùng `bại nửa người` ở `mn129:25.4` và `bán thân bại liệt` ở `sn3.21`); `kalyāṇadhamma` → `có thiện pháp` (đi với `sīlavā` → `có giới đức`, theo `dn23:12.6`); `yojana` → `do-tuần` (13 trong 15); `dāsidāsa` → `nô tỳ nam nữ` (theo `dn1:1.10.11`, `mn51:14.17`); `nāgarāja` (voi Uposatha) → `tượng vương` (theo `dn17:1.12.2`); `Himavanta` giữ dạng Pāli (37 khoá toàn tầng dùng dạng này, `Himavā` 3, `Himālaya`/`Hy Mã Lạp Sơn` ở `dn3`, `dn14`); `paṇṇasālā` → `chòi lá` (`ja507:19.3`, `tha-ap283:1.1`); `bhante nāgasena` → `thưa tôn giả Nāgasena` (60 trong 92 khoá `mil6`); `mahārāja` → `này Đại vương` (266 trong 485 khoá `mil6`, `tâu đại vương` 103, `thưa đại vương` 72).

  **Đặt mới hoặc lệch tiền lệ (có lý do).**
  (1) `latāya anumajjīyante` → `dùng dây leo quất lùa đi`: `anumajjati` có 5 khoá trong tầng (`mn36:28.13`, `mn85:28.13`, `mn100:25.13`, `sn3.13:6.2`, `an7.61:5.1`), đều dịch `xoa bóp`; nghĩa gốc là xoa, vuốt dọc theo; ở đây các con bị trói và bị lùa đi nên chọn `quất lùa đi` theo bối cảnh, nghĩa chính xác chưa chắc (xem bất định).
  (2) `sārajjamupagate` → `run sợ` (tầng đã dùng `không run sợ` cho `vesārajja`; 133 khoá chứa gốc `sārajja`, phần lớn là `vesārajja`); `ajjhupekkhi` → `đứng nhìn dửng dưng`; `kāruññaṁ nākāsi` → `không khởi lên lòng thương xót`.
  (3) `ruḷaruḷassa bhīmabhīmassa` → `kẻ ghê gớm, vô cùng đáng sợ`: 0 tiền lệ cho `ruḷaruḷa`; cặp lặp được đọc là nhấn mạnh (xem bất định).
  (4) `kiccakārī` → `người làm đúng điều cần làm` (15 khoá toàn tầng; `dn5:11.3` và `mn96` dịch phủ định là `không làm điều cần làm`/`chẳng làm bổn phận`; ở đây là ví dụ nước uống và thức ăn nên chọn nghĩa `làm đúng điều người ta nhờ`).
  (5) `asabbhikāraṇaṁ` → `điều không đúng đắn`: 0 tiền lệ.
  (6) `bahusādhāraṇo` → `vật chung của nhiều người` (0 tiền lệ).
  (7) `adānasammata` → `không được xem là bố thí` (0 tiền lệ); `majja` → `chất say` (khác `surāmerayamajja` → `rượu men, rượu nấu` vì ở đây đứng một mình), `samajja` → `hội hè` (`dn31:7.2` dịch `các cuộc vui`; chọn `hội hè` vì ở đây là một món để cho), `cittakamma` → `tranh vẽ` (0 tiền lệ), `saṅkhalika` → `xiềng xích`.
  (8) `candimasūriyappaṭibhāgassa vessantarassa` → `Vessantara, người sánh ngang mặt trăng và mặt trời`: `paṭibhāga` có 54 khoá trong tầng, các ví dụ đầu (`dn28:2.13`, `dn19:7.2`) dịch `đối chiếu`/`phần` theo nghĩa khác; ở đây chọn `sánh ngang` vì Pāli đặt sau tên các vật hoàn hảo rồi gắn vào chủ ngữ.
  (9) `dānapatha` → `con đường bố thí` (0 tiền lệ); `atthavasa` → `lý do` (`mil5.5.7:4.2` dịch `lợi ích` ở một bài khác; ở `25.2` Pāli hỏi `Katame dve`, đáp là hai điều dẫn tới hành động nên chọn `lý do`).
  (10) `mahābhūtagaṇālayo` → `nơi trú ngụ của những đoàn đại thần linh` (0 tiền lệ; `mahābhūta` có thể là đại chủng hoặc các loài thần, xem bất định).

  **Bất định, ghi tại đây chứ không thêm vào thân kinh.**
  (1) `3.1` `latāya anumajjīyante`: nghĩa gốc của `anumajjati` là xoa, vuốt dọc theo; `quất lùa đi` là đọc theo bối cảnh (vị Bà-la-môn dùng dây leo đánh các em), chưa có bản Anh hay Việt độc lập để đối chiếu.
  (2) `9.1` `taṁ mayaṁ dānaṁ pakittentā vikopentā nisinnā`: `vikopeti` dịch `xới xáo` (nghĩa gốc là làm xáo động, làm rối); đọc là `vừa tán thán vừa đem ra xới xáo xem là cho khéo hay cho vụng`; cách đọc khác là `vừa tán thán vừa chê trách`. `idha amhākaṁ samayaṁ anuppatto` dịch `đến với chúng ta ở đây, trong buổi hội này`; `samaya` có thể là `dịp`, `buổi họp` hoặc `giáo thuyết`, chưa chắc.
  (3) `9.2`, `9.4` `nipuṇānaṁ viññūnaṁ vidūnaṁ vibhāvīnaṁ bodhisattānaṁ dasa guṇe anudassati`: đọc bốn tính từ là bổ nghĩa cho `bodhisattānaṁ` (cùng cách, đứng ngay trước); cách đọc khác là bốn từ nhắm vào những người nghe sáng suốt, còn `bodhisattānaṁ dasa guṇe` là mười đức tính của các Bồ-tát. `buddhadhammassa` ở `9.4` đứng sau mười mục: kéo dài dịch `vô song của Phật pháp` để giữ vị trí cuối, không chắc cách đọc của người dịch gốc là chỉ gắn vào mục thứ mười hay vào cả năm mục cuối.
  (4) `12.1` `atibhayena nirujjhati` → `vì sợ hãi quá mức mà ngưng bặt`: chủ ngữ không nêu (người? lời nói? hơi thở?), giữ trung tính. `atirāgena ummattako hoti` dịch `vì tham quá mức mà hóa điên`, còn `atilobhena` dịch `vì tham lam quá mức`; hai chữ `rāga` và `lobha` cùng được tầng dịch `tham` (`mil5.1.4:9.3` cho `rāgavasena`, `dn34:1.4.19` cho `lobho`), nên Việt tách bằng `tham lam` cho `lobha`.
  (5) `13.2` `dibbaṁ vanamūlaṁ gahitampi hatthapāse ṭhitānaṁ parajanānaṁ na dassayati`: đọc là rễ thuốc trời, dù được cầm lấy cũng không hiện ra trước mắt người khác đứng trong tầm tay; cũng có thể đọc là rễ cầm trên tay khiến người cầm biến mất; giữ lời Pāli nguyên cấu trúc.
  (6) `13.2` `agado atijaccatāya pīḷāya samugghātako rogānaṁ antakaro`: `jacca` ở đây đọc là `thuần chất` (nghĩa gốc là dòng giống), dịch `phẩm chất quá thuần`; `pīḷāya` đọc là sở hữu cách của `pīḷā`.
  (7) `17.2` `asabbhikāraṇaṁ` dịch `điều không đúng đắn`; `kāraṇa` còn có thể là `lý lẽ` (`một lý lẽ không đúng đắn`); cả hai cách đều hợp ngữ cảnh.
  (8) `19.1` `ajapathaṁ saṅkupathaṁ vettapathaṁ` dịch `đường dê, đường cọc, đường mây` theo nghĩa đen; ba kiểu đường hiểm trở, đối tượng chính xác chưa chắc.
  (9) `20.1` `muddakāmo muddādhikaraṇaṁ`: `muddā` dịch `ấn tín` (chức vụ giữ ấn); cách đọc khác `muddā` là nghề đếm/tính (toán thuật) không loại trừ được trong tầng.
  (10) `25.3` `dukkhite ca me puttake vanamūlaphalehi itonidānaṁ ayyako mocessatīti`: `vanamūlaphalehi` ở cách công cụ có thể gắn với `dukkhite` (khổ sở vì rễ củ và trái cây rừng) hoặc với `mocessati` (cứu thoát khỏi cảnh ấy); chọn gắn với `dukkhite` vì liền kề; `ayyako` dịch `ông` (nghĩa gốc là ông, nội hay ngoại không nêu). `25.4` `amhākampi gamanaṁ bhavissati` dịch `việc ra đi của chúng ta cũng sẽ có`: `gamana` có thể là ra khỏi rừng, trở về; không tự thêm nghĩa.
  (11) `21.2` `na atibahukā me puttadārā, ‘na sakkomi te posetun’ti puttadāramadāsi`: gộp thành một lý do bị phủ định (`không phải vì vợ con quá đông, rồi nghĩ ‘ta không nuôi nổi các ngươi’ mà cho`); cách đọc khác tách thành hai lý do riêng không đổi nghĩa chính.
  (12) `30.2` `mahābhūtagaṇālayo`: `mahābhūta` đọc là các loài thần lớn; cách đọc khác là đại chủng (bốn đại). `32.3` `indabhavanesu`: giữ `Inda`, chưa khẳng định là Sakka.
  (13) `32.4` `ayyako te, tāta, tumhe brāhmaṇassa dhanaṁ datvā nikkiṇanto taṁ nikkhasahassaṁ datvā nikkiṇātu`: `taṁ` đọc là `số ấy` (một ngàn nikkha, khớp với `33.1` `sahassagghañhi maṁ`); `33.4` `hatthīnañca satena cā` dịch `trị giá một trăm voi và cả các thứ khác`: chữ `ca` cuối câu được đọc là còn nữa, theo danh sách đã nêu ở `32.4`; Pāli ở ja547:682.4 viết `hatthinā ca satena ca`.

  **Lỗi bản nháp đã bắt:** (a) phép đối chiếu nháy từng khoá bắt được `17.5`: bản nháp bỏ dấu mở `“` vì tôi tưởng lời đáp tiếp nối không mở nháy; đo lại từng khoá thì Pāli có dấu mở ở đó, và lời Nāgasena từ `17.5` đến `26.2` là một khối nháy liền; đã sửa theo Pāli. (b) Bản nháp đầu dịch `Katame dve?` thành `Hai lý do nào?` trái với đa số tầng (63 trong 107); đã đổi. (c) Bản nháp đầu dùng `tiếng tăm` cho `kittisadda` trong khi tầng dùng `tiếng tốt` (31) nhiều hơn `tiếng tăm` (3), và dùng `không gian` cho `ākāsa` trong khi `mil` dùng `hư không` (9); đã đổi cả hai. (d) Bản nháp `21.2` lặp cụm `cho vợ con` bốn lần làm câu nặng nề; đã rút gọn, không đổi nghĩa. (e) Hai khoá `10.4` và `11.2` bản nháp dùng dấu gạch ngang dễ đọc nhầm `taṁ kammaṁ`/`taṁ dānaṁ` là tân ngữ của câu hỏi; đã viết lại cho rõ đây là vế đồng vị (nghiệp đưa đến cõi trời).

