notes: |-
  Bản dịch tiếng Việt mới cho tha-ap452, Bodhigharadāyakattheraapadāna: bài kệ của trưởng lão Bodhigharadāyaka, bài thứ mười và là bài cuối của Vibhītakavagga (phẩm thứ bốn mươi lăm). Đủ 60/60 khoá, thứ tự và tập khoá khớp Pāli.

  Nội dung: ở thời Đức Thế Tôn Siddhattha, ông cho xây một ngôi nhà Bồ-đề (bodhighara) với tâm tịnh tín. Quả báo: sinh lên cõi Đâu-suất; sáu mươi lăm kiếp trước làm Chuyển Luân Vương ở thành Kāsika do Vissakamma tạo dựng (dài mười, rộng tám do-tuần, không có gỗ, dây leo hay đất sét), cung điện Maṅgala do Vissakamma tạo dựng (cột vàng, tháp lầu châu ngọc, mái bạc), một ngôi nhà toàn vàng; sau cùng đạt Niết-bàn (8.3-8.4). Khoá 10.1-12.3 là ba khổ kết quen thuộc (phiền não thiêu rụi, đến lành thay, bốn vô ngại giải) với hai dấu lược …pe… ở giữa mỗi khổ. Khoá 16.1-18.4 là bài kệ tóm tắt cả phẩm (Tassuddānaṁ).

  Tên bài và thể thức :0.3, đo trước khi chọn:
  - translationTitle bằng đúng giá trị khoá :0.3 trong bản dịch. Pāli :0.3 (10 Bodhigharadāyakattheraapadāna) BẮT ĐẦU bằng số nên giữ số thứ tự theo hình thức `N. `. Đo toàn tầng tha-ap hiện có (cây chính và nhánh này): Pāli có số ở 135 tệp, trong đó 117 viết `N. ` và 18 viết `N ` (không chấm); Pāli không số ở 317 tệp, 317 không thêm số; số tệp thừa số (Việt có số mà Pāli không có) là 0.
  - Hình thức đầu tên: đo trên các :0.3 đã dịch của phẩm tha-ap, toàn tầng Tuyên Ngợ và Tuyên Ngợi 244, Tuyên Ngôn 97, Ký Sự 96; ở phạm vi gần (tha-ap430 đến tha-ap475) Tuyên Ngợ 32, Ký Sự 5, Tuyên Ngôn 1; trong chính phẩm này (tha-ap443 đến tha-ap451) Tuyên Ngợ 6, Ký Sự 3, Tuyên Ngôn 0. Hai phạm vi cho đa số khác nhau và con số của tôi khác con số 128 điều phối nêu. Chọn Tuyên Ngôn vì Ngợ/Ngợi là chính tả không có nghĩa (lỗi gõ), không phải vì đa số đo được; xin biên tập phán một lượt cho cả cuốn. 14.1 dùng cùng họ Bài Kệ Tuyên Ngôn Về Trưởng Lão.
  - 0.2 Vibhītakavagga dịch Phẩm Cây Vibhītaka (8 khoá so với 1 khoá Phẩm Quả Vibhītaka ở tha-ap447).
  - 15.1 pañcacattālīsamo = pañca 5 + cattālīsa 40 = 45, dịch thứ bốn mươi lăm. Ngoài lát, báo chứ không sửa: tha-ap442:10.1 (catucattālīsamo = 44) đang ghi thứ bốn mươi tám và tha-ap462:8.1 (chacattālīsamo = 46) cũng ghi bốn mươi tám; tha-ap442:13.3 Chaḷasīti = 86 đang ghi sáu mươi tám; tha-ap292:1.1 Cullāsīti = 84 đang ghi tám mươi sáu nghìn.

  Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti (13.1): dùng nhóm số nhiều đã nói những bài kệ này (446 khoá trong tầng tha-ap) thay vì bài kệ này số ít (4 khoá), vì Pāli imā gāthāyo là số nhiều.

  Tiền lệ: 21 khoá Pāli của bài có Pāli trùng ở bài khác trong tầng tha-ap; 18 khoá dùng lại nguyên văn tiền lệ (0.1, 0.2, 1.1, 1.3, 3.1, 9.1, 9.3, 10.1-10.3, 11.1-11.3, 12.1-12.3, 16.1, 18.4); 3 khoá khác tiền lệ có lý do: 1.2 (tādino dịch bậc Vững Vàng thay vì đáng tôn kính ấy, vì cách cũ làm mất tādi; dạng Vững Vàng có 6 tiền lệ cho cặp lokajeṭṭhassa tādino), 3.2 và 6.1 (đổi tôi thành ta để giữ một ngôi trong bài; 6.1 thêm Có theo tha-ap193:1.1). Cặp Pāli trùng ngay trong bài: 2 nhóm (7.4 và 9.4 gharadānassidaṁ phalaṁ; ba khoá …pe…), Việt khớp nhau ở cả hai nhóm. Hai cặp gần trùng khác dấu câu cuối (1.4 và 9.2 bodhigharamakārayiṁ, 3.4 và 7.2 vissakammena māpitaṁ) dịch cùng một câu, chỉ khác dấu cuối theo Pāli; 5.4 māpito (nam tính) cũng cùng câu.

  Đại từ ngôi thứ nhất là ta xuyên suốt (cùng Pāli Kilesā jhāpitā mayhaṁ ở tầng: ta 80, tôi 22 và 9; ở phạm vi gần ta 32). 9.3 Duggatiṁ nābhijānāmi dịch Ta không còn biết đến đọa xứ (phạm vi gần 16, cao hơn dạng Ta không biết mình rơi vào khổ đau 15; toàn tầng thì dạng khổ đau 134 nhiều hơn dạng đọa xứ 46). Chọn đọa xứ vì duggati là cõi xấu, và dạng này sát Pāli hơn; hai phạm vi cho đa số khác nhau.

  Số Pāli, tự tính:
  - Cullāsītisahassāni (6.1) = cullāsīti 84 × sahassa 1000 = 84.000, dịch tám mươi tư ngàn (tầng tha-ap viết tám mươi tư 4 lần, tám mươi bốn 0 lần; toàn tầng sutta tám mươi bốn 144 lần, tám mươi tư 4 lần; giữ tám mươi tư theo phạm vi gần và theo hai tiền lệ cùng Pāli).
  - Pañcasaṭṭhimhito kappe (3.1) = pañca 5 + saṭṭhi 60 = 65, dịch sáu mươi lăm kiếp trước đây.
  - Tiṁsakappasahassamhi (9.1) = tiṁsa 30 × sahassa 1000 = 30.000 kiếp, dịch ba mươi ngàn kiếp trước đây. Tiṁsa là ba mươi, không phải ba: tầng ghi Ekatiṁse = ba mươi mốt (hơn 60 khoá), tāvatiṁsa = ba mươi ba, tiṁsarattiyo = ba mươi ngày đêm, bāttiṁsa = ba mươi hai. Brief điều phối nêu tiṁsa = 3 và ba nghìn kiếp là cách đúng; đo của tôi trái với điều đó nên tôi tin phép đo và ghi rõ ở đây. Khoá này vẫn cần biên tập xác nhận.
  - Ekūnāsītikā (18.3) = ekūna (kém một) + asīti 80 = 79, dịch bảy mươi chín bài. Tôi không đối chiếu được tổng 79 với số kệ của mười bài trong phẩm vì cách đếm kệ có dấu lược …pe… không xác định.
  - Dasayojana 10, aṭṭhayojana 8 (4.1-4.2), tiriyaṁ yojanaṁ 1, addhayojana nửa (5.1-5.2); dasamaṁ = thứ mười (14.1); catasso = bốn (12.1).

  Bất định đã ghi lại, không sửa trong kinh:
  - Tiriyaṁ (5.1): chỉ có nghĩa ngang, theo phương ngang; dịch chiều ngang một do-tuần, bề rộng nửa do-tuần cho addhayojanavitthataṁ. Pāli 5.1-5.2 không nêu chủ ngữ (có thể là cung điện Maṅgala nêu ở 5.3, hoặc thành); không thêm chủ ngữ vào kinh. Hai từ ngang và rộng gần nghĩa nhau nhưng tách đúng hai từ Pāli.
  - bodhighara (1.4, 9.2): dịch ngôi nhà Bồ-đề, giữ nghĩa chữ; tầng không có tiền lệ nào cho từ này. Pāli không nói là công trình che quanh cây hay một gian điện thờ; không thêm giải thích.
  - Siddhatthassa bhagavato (1.1): sở hữu cách, dịch Của Đức Thế Tôn Siddhattha (4 tiền lệ). Pāli có thể hiểu là xây cho Ngài hoặc xây ngôi nhà Bồ-đề của Ngài; giữ cách dịch trung tính.
  - tādino (1.2): bậc Vững Vàng (tầng cũng có Như Vậy, Như Thật, Bất Động).
  - niyyūhā (6.3): dịch các tháp lầu, theo tiền lệ tháp ở nơi mô tả cung điện Vejayanta; nghĩa chữ còn có thể là chòi nhô, ban công hay đỉnh nhọn.
  - 2.3-2.4 Na me sītaṁ vā uṇhaṁ vā, vāto gatte na samphuse: samphuse là cầu khiến; dịch như mô tả thường tại (không có lạnh hay nóng, gió cũng không chạm vào thân). Có thể hiểu lạnh, nóng và gió cùng là chủ ngữ của một vị ngữ; nghĩa không đổi.
  - Te sabbe (8.1) nam tính số nhiều không nêu danh từ; dịch tất cả những điều ấy, chỉ những gì đã nêu ở khổ 2 đến 7.
  - 17.2 billabhallātakappado: hiểu là hai người (Billa, tha-ap445 Billiya; và người dâng Bhallātaka, tha-ap446), vì mười tên trong bài tóm tắt khớp mười bài của phẩm; 17.4 āsanī hiểu là tha-ap449 Sīhāsanika.
  - 9.1 Tiṁsakappasahassamhi chỉ có locative, không có ito nên Vào ... kiếp trước đây theo tiền lệ (3 khoá cùng Pāli).
  - Dấu lược: 10.2, 11.2, 12.2 là …pe… trong Pāli, giữ đúng một … mỗi khoá; không có (…) trần. Dấu nháy: mở “ ở 1.1, đóng ” ở 12.3, mỗi khoá khớp Pāli; không có nháy đơn.

  Kiểm tự động: tập khoá Việt = tập khoá Pāli (60/60, cùng thứ tự); nháy kép khớp Pāli từng khoá (0 lệch); dấu lược khớp Pāli từng khoá (0 lệch); NFC, không khoá rỗng, không khoảng trắng thừa; không có từ Pāli lọt sang tiếng Việt ngoài tên riêng.

