  BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:
    1. `tīṇi sataṁ diṭṭhābhinivesā` (6.1, 28.1) dịch “ba trăm” nguyên văn; tổng các số ở 29.1–29.16 là 301, không khớp 300 và không có tầng Anh để phân xử; giữ nguyên văn, không chữa.
    2. `upādāya samuṭṭhānaṭṭhena` (18.1–25.1): `upādāya` đi với `diṭṭhiṭṭhānaṁ` ở đối cách, dịch “nương vào chỗ đứng của kiến, do ý nghĩa làm khởi sinh”; cách đọc khác “nhờ chấp thủ”, “do liên quan đến”.
    3. `yena pharati, so attā ceva loko cā` (77.8, 79.8 và các khoá cùng công thức): dịch “nhờ cái nào vị ấy lan tỏa, cái ấy vừa là tự ngã vừa là thế giới”; `yena` ở công cụ cách, đọc khác “cái mà vị ấy dùng để lan tỏa”.
    4. 109.3 `na hatthi ñāṇaṁ`: dạng `hatthi` đọc là `atthi` (“không có trí”); không có tầng Anh để phân xử, chữ viết trong Pāli root là hatthi.
    5. 113.3 `Yathābhūtedhimuccati`: dịch “hướng tâm vào cái đúng như thực”; khác với iti49:6.3 “giải thoát đúng như thực” vì Pāli ở đây dùng adhimuccati chứ không phải vimuccanti; 110.5 `nādhimuccati` vẫn là “không quyết định” theo iti49:3.2.
    6. 121.2, 122.4, 122.8, 122.13 `katamantānuggahitā`, `pubbantānuggahitā`, `aparantānuggahitā`: dịch “được bao gồm trong phần nào / quá khứ / vị lai”; không có tầng tham khảo cho dạng anuggahita này, cách đọc khác “bị nắm giữ bởi”.
    7. `vipannadiṭṭhi`/`sampannadiṭṭhi` (115–120) dịch “kiến thất nghiệp”/“kiến thành tựu” để khớp diṭṭhivipatti/diṭṭhisampadā; 123.1–125.2 `diṭṭhisampannā` giữ nguyên văn an10.63 “đầy đủ chánh kiến”, nên cùng căn sampanna nhưng hai dạng Việt.
    8. `diṭṭhivipatti` “thất nghiệp về kiến” theo an2.173 và an3.117–119 (23/25); đọc lên dễ gợi nghĩa thất nghiệp trong đời sống, cách đọc khác “sự hư hỏng về kiến”, “sự suy bại về kiến” (ps1.4 dùng “suy bại” cho vipatti trong hợp từ vipattibhava).
    9. 33.2 `saññogo` “sự ràng buộc” và 36.2 `anunayasaññojanaṁ` “kiết sử chiều theo”; 0 tiền lệ cho saññoga ở tầng, anunaya “sự chiều theo” (mnd1).
    10. 85.4, 86.5 `hotipi tiṭṭhatipi uppajjatipi nibbattatipi` dịch “vẫn có, vẫn tồn tại, vẫn sinh khởi, vẫn phát sinh”; bốn động từ gần nghĩa, không có tầng tham khảo cho chuỗi này.
    11. Các khoá lược chỉ còn tân ngữ (44.1, 45.2, 49.2, 66.2, 67.2 …): Việt thêm động từ “quán” của công thức bị lược vào mục đầu của dãy; không thêm vào các mục sau (chỉ còn danh từ và …).
    12. 106.18: Pāli không có dấu ngắt giữa hai mệnh đề (… siyā vibhavadiṭṭhiyo “neva hoti …”ti—); Việt thêm “;” để tách, không đổi nghĩa.
    13. 117–118: `yo naro` “kẻ” (117), `ariyo` “bậc cao quý” (118.4); `vasalo` “hạ tiện” theo snp1.7 (19/19); “bậc cao quý” thay vì “bậc Thánh” vì đây là đối lập đạo đức với vasala, không phải địa vị đạo.
    14. 77.5, 79.5 `parivaṭumo` “được bao quanh”, `apariyanto` “không có giới hạn”; 0 tiền lệ ở tầng.
    15. 8–16 các dòng `X etaṁ mama …`: giữ cấu trúc “X: cái này là của tôi …” (sn22.151, sn35.32 và sn35.86 dùng “của tôi”, mn146–148 dùng “của ta”; chọn “tôi”); `rūpe/sadde/gandhe…` (8.16–8.21) và `rūpaṁ` (8.2) cùng dịch “sắc”.
    16. 104.1–104.2 `olīyanābhiniveso`, `atidhāvanābhiniveso` dịch “sự chấp trước do chìm đắm / do vượt quá xa”; hợp từ không có tiền lệ.
    17. 105.x–107.x: các câu “abhiniveso … siyā bhavadiṭṭhiyo, siyā vibhavadiṭṭhiyo” dịch “trong sự chấp trước của … có thể có kiến về hữu, có thể có kiến về phi hữu”; `siyā` đọc “có thể có”, cách đọc khác “đôi khi”, “vừa là”.
    18. 93.2 và 94.2 danh sách các thuyết theo dn1 (bán thường, hữu biên–vô biên, ngụy biện trườn uốn như lươn, ngẫu nhiên sinh, hữu tưởng, vô tưởng, phi tưởng phi phi tưởng, đoạn diệt, Niết-bàn ngay trong hiện tại).

