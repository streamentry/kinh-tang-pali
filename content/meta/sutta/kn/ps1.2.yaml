notes: |-
  Đợt 19, làn 146. Dịch từ Pāli root commit đã ghim, đủ 1.675/1.675 khoá (0.1–0.3, 1.1–29.16, 30.0–128.5); thứ tự khoá đúng thứ tự Pāli, 0 khoá ngoài tập Pāli. Trước lát này chưa có bản dở nào của uid này nên dịch mới toàn bộ, không nạp tệp cũ.

  CẤU TRÚC BÀI (Diṭṭhikathā, luận bàn về kiến). Phần mở đầu (1–29): năm câu hỏi mở đầu (kiến là gì, tám chỗ đứng của kiến, mười tám sự xâm chiếm của kiến, mười sáu kiến, ba trăm sự chấp trước của kiến, sự nhổ tận gốc các chỗ đứng của kiến), tám chỗ đứng (17–25), danh sách mười tám (26) và mười sáu kiến (27), bảng số phương diện cho từng kiến (28–29). 1.2.1 (30–41): kiến vị ngọt, ba mươi lăm phương diện (khoá 30–37 và 37.x lặp công thức vị ngọt qua từng uẩn, căn, cảnh, thức, xúc, thọ; 38–41 nhắc lại các khoá 31–36). 1.2.2 (42–63): tùy kiến về ngã, hai mươi phương diện (năm uẩn × bốn cách: là ngã, ngã có nó, nó trong ngã, ngã trong nó). 1.2.3 (64): tà kiến mười cơ sở. 1.2.4 (65–66): thân kiến hai mươi. 2.5 (67–68) thường kiến có thân làm cơ sở mười lăm; 2.6 (69–70) đoạn kiến năm. 1.2.7 (71–92): kiến chấp cực đoan năm mươi (mười mệnh đề × năm uẩn). 1.2.8–1.2.10 (93–95): tùy kiến về quá khứ mười tám, về vị lai bốn mươi bốn, kiến thuộc kiết sử mười tám. 1.2.11–1.2.12 (96–99): kiến cái tôi và kiến cái của tôi bị kiêu mạn ràng buộc. 1.2.13–1.2.14 (100–103): kiến liên hệ đến ngã luận (hai mươi) và thế gian luận (tám). 1.2.15 (104–128): hữu kiến và phi hữu kiến, bài kinh hai kiến chấp (chìm đắm và vượt quá), ba hạng người kiến thất nghiệp và ba hạng người kiến thành tựu, các kệ, và phần bậc quyết định (khoá 123–128, trùng công thức với Tăng Chi Bộ).

  COVERAGE ENGLISH ĐO ĐƯỢC. Mẫu số = 409 khoá Pāli có nội dung (độ dài ≥ 40 ký tự theo source/layers.yaml, sau khi gộp khoảng trắng, bỏ khối :0) trên tổng 1.675 khoá; 1.263 khoá còn lại gồm 15 khoá tiêu đề N.0 và 1.248 khoá ngắn hơn 40 ký tự (phần lớn là các dòng lược như tên căn với dấu lược), và 3 khoá khối 0.1–0.3. Sujato: 0/409. english-project: 0/409 (không có tệp ps nào ở content/translation/en/project/sutta/kn/). vietnamese-current: 0/409 (chỉ có Pháp Cú). Ba tầng tham khảo đều vắng ⇒ triangulation 7,0 (≤ 8,0) và status draft kèm blocker noEnglishEditionUpstream. Tôi không đụng content/meta/reference-gaps.yaml (uid này chưa có entry; entry nếu có cũng không cứu được published). Bài này không được đối chiếu độc lập với English ở khoá nào. Tôi không dùng bản Việt nguyên bài nào làm nguồn; đối chiếu thuật ngữ dựa vào tầng Việt đã dịch của chính dự án (iti49, snp1.7, an1.314, an10.63, an10.64, mn44, cnd19, mnd5, dn1, ps1.1, ps1.4, ps2.1, ps2.2, ps2.5, ps3.9 …), không phải bản dịch độc lập.

  PĀLI TRÙNG NGUYÊN VĂN TRONG CHÍNH BÀI (đã đếm). Sau khi bỏ thẻ, dấu câu, dấu lược và hạ chữ hoa, bỏ ba khoá 0.x: 205 nhóm Pāli trùng, gồm 1.022 khoá, tương đương 817 cặp; cả 205 nhóm có bản Việt giống nhau về nghĩa và chữ sau chuẩn hoá (0 nhóm lệch). Khoá nào Pāli giống nhau ở vị trí đầu danh sách lược và vị trí tiếp nối chỉ khác chữ hoa và dấu câu (ví dụ 45.2–45.4 với 49.2–49.4), Việt giữ nguyên chữ.

  PĀLI TRÙNG NGUYÊN VĂN VỚI TẦNG ĐÃ DỊCH (đã dò). 224 khoá của bài (65 chuỗi Pāli phân biệt) có chuỗi Pāli trùng ở tầng Việt của bài khác (sau chuẩn hoá như trên, bỏ 0.x); 146 khoá dùng lại bản Việt phổ biến nhất của tầng, 78 khoá khác, chia như sau. (a) 36 khoá ở 49–51, 53–55, 57–59, 61–63 (rūpaṁ/vedanaṁ/saññaṁ/saṅkhāre attato samanupassati và các mục lược): ở tầng chúng là câu trọn vẹn (“thấy tưởng là tự thân …”), ở đây chúng là mục cuối của dãy “Ở đây, có người quán X … Y … Z là tự ngã”, nên bỏ động từ lặp; riêng vedanaṁ … ở 57.4 và 100.3 tầng viết “Cảm thọ …” (18/43), bài này viết “thọ” xuyên suốt như ps1.4. (b) 8.4 và 16.2: tầng (sn22.8) viết “Quán thọ: ‘Cái này là của ta …’”, ở đây giữ cấu trúc “thọ: cái này là của tôi …” của cả dãy 8–16. (c) 32.2, 32.4, 32.11, 39.2, 39.4, 39.11: bản tầng cho 32.4 và 39.4 là khoá cắt lệch của an10.104:2.5 (“sự cư ý, sự cầu, kế hoạch, và tư hoàn”) không dùng được; dùng dạng của an1.314:1.1 và 1.7 (“chủ ý nào, mong cầu nào, ước nguyện nào”), thêm “được thọ trì” cho samādinnaṁ và “theo kiến của người ấy” cho yathādiṭṭhi vì an1.314 bỏ hai ý này; 32.2 viết “địa ngục hoặc loài súc sinh”. (d) 42.6, 65.3, 65.6: chọn “quán … là tự ngã” theo cnd19:57.2 và 57.6 (tầng chia “quán” 95, “xem” 57, “thấy” 58 trên 214 khoá có samanupassati). (e) 17 khoá về mệnh đề thế giới và sinh mệnh (71.4–71.12, 75.1, 76.10, 77.1, 79.1, 81.1, 82.9, 83.1, 106.3–106.11): thêm “là” cho dễ đọc, theo dạng “Thế giới là thường còn” (19 khoá) của chính tầng, và “Sinh mệnh và thân thể là một” (24 khoá). (f) 87.5 (“không tồn tại” thay cho “không có”). (g) 12 khoá ở kệ và kinh hai kiến chấp (111.2, 113.4, 114.2–114.4, 117.1–117.4, 119.7, 121.5, 122.9): dùng lại phần lớn bản có sẵn của iti49 và snp1.7, chỉ đổi “tham hữu” thành “hữu ái” (47 khoá so với 3 cho bhavataṇhā), thêm “vị tỳ-kheo” vì Pāli 114.3 có bhikkhu, bỏ “Này các tỳ-kheo” ở 111.2 vì Pāli không có, dùng “kiến thất nghiệp” thay cho “tà kiến” ở 117.3 cho khớp vipannadiṭṭhi ở 115–120. Dùng lại nguyên văn: 117.4 (19/19), 123.1–127.3 theo an10.63 và an10.64, trừ “nhập lưu” ở 126–128 vì an10.64 dùng “nhập lưu” trong khi tầng ps dùng “Dự lưu” cho sotāpattimagga ở 7.1 (khác nhau có chủ ý: bài kinh trích công thức Tăng Chi Bộ).

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `ākāra` → “phương diện” (ps 189/189 khoá có ākārehi; cả tầng 269/701). `diṭṭhi` → “kiến”; `micchādiṭṭhi` “tà kiến”, `sakkāyadiṭṭhi` “thân kiến” (94/105), `sassatadiṭṭhi` “thường kiến” và `ucchedadiṭṭhi` “đoạn kiến” (sn22.81 và ne9), `attānudiṭṭhi` “tùy kiến về ngã” (sn22.156 tên bài “Tùy Kiến Về Ngã”), `pubbantānudiṭṭhi`/`aparantānudiṭṭhi` “tùy kiến về quá khứ/vị lai” (sn22.46; dn1 dùng “vị lai” cho aparanta), `antaggāhikā diṭṭhi` “kiến chấp cực đoan” (mnd5 và cnd6). `diṭṭhigata` “kiến chấp” và danh sách mười tám (diṭṭhigahanaṁ … diṭṭhiparāmāso) theo cnd6:21.2 và mnd5:48.9: “rừng rậm kiến chấp”, “hoang mạc kiến chấp”, “sự quanh co của kiến”, “sự dao động của kiến”, “kiết sử của kiến”; các mục còn lại (sallaṁ, sambādho, palibodho, bandhanaṁ, papāto, anusayo, santāpo, pariḷāho, gantha, upādānaṁ) tự dịch sát chữ theo tiền lệ rời: palibodha “ngăn ngại” (ps2.2), santāpa “thiêu đốt”, pariḷāha “nhiệt não” (ps1.4), gantha “kết thân” (pe9), diṭṭhupādāna “kiến thủ” (mn11, ne36). `diṭṭhiṭṭhāna` “chỗ đứng của kiến” (iti55; dn1 “căn cứ của kiến chấp”), `pariyuṭṭhāna` “sự xâm chiếm” (pe5:68.2 “bị tham xâm chiếm” cho rāgapariyuṭṭhaṁ; an10.86 “đầy tràn” cho vicikicchāpariyuṭṭhānaṁ; chọn “xâm chiếm” vì 33.2 `pariyuṭṭhitacittassa` cần dạng bị động), `samugghāta` “nhổ tận gốc” (ne36:48.1, mn32:11.15), `abhiniveso` “sự chấp trước”, `parāmāso` “sự bám víu” (cnd15, mnd3, mnd5), `vatthu` “cơ sở” (68/880; các cách khác “căn cứ” 28, “nền tảng” 22; chọn “cơ sở” vì khớp pe5:57.13 (kilesavatthu) và mnd5:48.9 (vīsativatthukā “có hai mươi cơ sở”)). `assāda` “vị ngọt” (150/188). `saññojana` “kiết sử” (35/35). `diṭṭhivipatti` “thất nghiệp về kiến” (23/25 khoá có vipatti), dù lạ tai vẫn giữ để khớp an2.173, an3.117–119. `vipannadiṭṭhi`/`sampannadiṭṭhi` “kiến thất nghiệp”/“kiến thành tựu”. `issā` “ganh tỵ” (60 khoá), `macchariya` “keo kiệt” (137/164), `paṭigha` “sân” (45/54), `anunaya` “chiều theo” (mnd1). `kasiṇa` “biến xứ” (58/99), màu “xanh, vàng, đỏ, trắng” theo ne21. `ākāsānañcāyatana…` “không vô biên xứ” (20/20). Danh sách ba mươi hai thể trược theo mn10, dn22 và kp3 (“cơ hoành”, “màng treo ruột”, “thức ăn chưa tiêu”, “chất nhờn”, “não”). Căn–xứ–giới–thức–xúc: “nhãn căn” (32/59), “xứ mắt” (6/9), “nhãn giới” (8/22; pe6), “thức mắt” (149/194), “xúc mắt” (95/180), “địa giới, thủy giới, hỏa giới, phong giới, không giới, thức giới” (tầng chia “địa đại” 43 và “địa giới” 17 cho pathavīdhātu; chọn “giới” vì ở đây là một trong sáu giới liệt kê cùng ākāsadhātu và viññāṇadhātu). `bhavataṇhā` “hữu ái” (47/68). `jīva` “sinh mệnh” (dạng công thức taṁ jīvaṁ taṁ sarīraṁ: 24 khoá). `pharati` “lan tỏa” (109/182). `tathāgato paraṁ maraṇā` “Như Lai … sau khi chết”; `neva hoti na na hoti` “phi tồn tại phi phi tồn tại” (45). `lokavāda` “thế gian luận”, `attavāda` “ngã luận”. `titthiya` “ngoại đạo” (271/434). `puthujjano assutavā` theo cnd19:57.2, cũng là công thức mn44. `bhūta` “cái đã hữu” theo iti49 (chỉ có ở iti49, 3 khoá). Thẻ <b> ở 51 khoá không đưa sang bản Việt; chỗ Pāli kết bằng `ti` được chuyển thành “X nghĩa là:” theo ps1.4 và ps3.2 (không dùng nháy vì Pāli không có nháy).

