  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 94 khoá bất đồng nghĩa (11 nhóm) → sửa 0, giữ 64, bất định 30. Về nghĩa không có khoá nào của bản dự án phải đổi; các số phương diện (35, 20, 10, 20, 15, 5, 50, 18, 44, 18, 18, 18, 20, 8, 1, 1), danh sách mười tám và mười sáu, tám chỗ đứng, mười cơ sở của tà kiến, 18 + 44 = 62, bảng hữu và phi hữu (15 + 5, tất cả hữu, tất cả phi hữu) và hai nhóm năm bậc đều trùng giữa hai bản. Giữ, vì bản nguyên bài khác Pāli hoặc chỉ diễn đạt khác: (1) 71.14–17, 72.3, 85–91, 106.13–18 và các khoá lặp (24 khoá): bản nguyên bài viết các mệnh đề về Như Lai sau khi chết thành câu hỏi "Có phải…?", Pāli là mệnh đề được trích bằng ti nên giữ là mệnh đề. (2) 43.6–7, 44.11–13, 48.5–6 và các khoá cùng thí dụ ngọn đèn (16 khoá): vaṇṇo giữ "màu", bản nguyên bài "ánh sáng". (3) 64.17 (1 khoá): sattā opapātikā là chúng sinh hóa sinh, bản nguyên bài hiểu thành sự sinh ra từ nhân của nghiệp. (4) 77.3, 78.1, 79.3, 80.1 (4 khoá): parittaṁ hoặc vipulaṁ okāsaṁ nīlakato pharati, bản nguyên bài hiểu là quan niệm bầu trời hạn hẹp hoặc bao la có màu xanh; Pāli có động từ pharati (lan tỏa) đi với nīlakato nên giữ. (5) 124.2 và 127.2 (2 khoá): antarāparinibbāyī, upahaccaparinibbāyī, bản nguyên bài diễn giải theo thời điểm trong đời kế tiếp, Pāli chỉ nêu tên bậc. (6) 32.7 và 39.7 (2 khoá): tittakattāya là vị đắng, bản nguyên bài viết chát. (7) 31.6–11, 38.6–10 và các khoá cùng công thức (13 khoá): rāga là tham, bản nguyên bài viết ái; giữ tham để không lẫn với taṇhā. (8) 36.2 và 41.6 (2 khoá): anunaya là chiều theo, bản nguyên bài quyến luyến. Bất định, cả hai cách đọc đều có chỗ dựa nên giữ bản dự án: (a) 18.1–25.1 (8 khoá) upādāya: bản nguyên bài đọc trung tính là liên quan đến chỗ đứng của kiến, bản dự án là nương vào chỗ đứng của kiến; cách đọc của bản dự án có thể gợi hướng phụ thuộc ngược lại, nên ghi để người đọc sau cân nhắc. (b) 104.1–2, 110.1, 110.3, 110.6, 111.1, 111.4 (7 khoá): olīyati ở đây là chìm đắm, bản nguyên bài nắm giữ lại; atidhāvati là vượt quá xa, hai bản trùng nhau. (c) 123.1–128.3 (15 khoá) niṭṭhā: giữ quyết định theo hai bài Tăng Chi Bộ cùng công thức, bản nguyên bài viết thành toàn. Bốn chỗ bất định đã ghi ở trên (số 3, 4, 5, 10) được bản nguyên bài đọc cùng hướng: yena pharati là công cụ cách, na hatthi ñāṇaṁ đọc là không có trí, adhimuccati là hướng tâm hoặc xác quyết, bốn động từ hotipi … nibbattatipi. Bất định số 1 giữ nguyên: bản nguyên bài cũng ghi ba trăm trong khi các số cộng lại là 301. Thuật ngữ ghi lại, thuộc phạm vi cả tầng chứ không riêng bài này: kết thân cho gantha (dùng nhất quán trong tầng); chất nhờn cho vasā (12 tệp, bản nguyên bài nước mỡ); thất nghiệp cho vipatti (29 khoá của bài, khớp an2.173 và an3.117–119 nhưng dễ bị đọc theo nghĩa mất việc làm). Sửa từ lượt review của chính bản dự án, không đổi nghĩa: 52.13 kết bằng " —" thay cho ".”" (khớp các khoá anh em 48.8 và 56.9, và để 52.14 viết thường nối tiếp được; nay 232 khoá kết " —"); 57.22–57.23 nối thành một câu ("Còn tự ngã này của tôi, thì có các hành, nhờ các hành này.") vì Pāli ngắt câu giữa chừng còn bản cũ để một mảnh câu cụt. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

