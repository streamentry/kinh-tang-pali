  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho bất kỳ bài nào trong lát này. Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là **Pāli + English Sujato + các bài song song trong chính tầng này**.

  KỸ THUẬT. Tôi KHÔNG chạy `npm run validate|test|build|check` — đợt này người điều phối cấm và chạy tập trung. Vì vậy `technical_integrity` chấm **9.6 chứ không phải 10.0**; đó là hạn chế thật của lượt đánh giá này chứ không phải lời khen. Tất cả những gì chạy được thì đã chạy.

  **`0.4 (Paṭhama) Devasabhattheragāthā` → *Kinh Kệ Của Trưởng Lão Devasabha*.** Pāli có tiều tố `(Paṭhama)` (*thứ nhất*, phân biệt với `thag1.100 (Dutiya)`) nhưng tiếng Việt đã mang số thứ tự bài rồi, nên tôi không chép `(Paṭhama)` vào tiêu đề — cùng cách bỏ chữ số mà Pĩ ấn đã dùng cho `thag1.66` và các bài kệ khác.

  **ĐÃ SỬA LỖI CHỦ NGỮ Ở `1.1`–`1.2`.** Bản dịch trước đây viết *Những vũng bùn lầy đã vượt qua, / các vực sâu đã tránh khỏi*; đọc thành văn Việt thì **chủ ngữ là vũng bùn lầy và vực sâu**, tức vũng bùn vượt qua người nói, vực sâu tránh khỏi người nói. Chủ ngữ phải là chính vị trưởng lão, và Pāli là dạng quá khứ bị động: `Uttiṇṇā paṅkapalipā` là *đã vượt lên khỏi vũng bùn lầy*, `pātālā parivajjitā` là *đã tránh khỏi vực sâu*. Chứng cứ trong kho: cụm `sabbasaṁsārapathaṁ tiṇṇā uttiṇṇā nitthiṇṇā atikkantā vītivattā` (`cnd11:54.1`) đi với cùng một chủ ngữ — **người đã vượt qua**, không phải vũng bùn vượt qua người; `pe8:191.2` cũng để `uttiṇṇā vantā viditā` cùng chủ ngữ ấy. Sujato đọc *I’ve crossed the bogs, I’ve avoided the chasms*, tức cũng để *tôi* làm chủ ngữ. Tôi sửa thành *Đã vượt qua những vũng bùn lầy, / đã tránh khỏi những vực sâu*. Vẫn giữ dạng quá khứ bị động như đã ghi, và khớp với hai vế sau đã dùng sẵn chủ ngữ ẩn (*đã thoát khỏi*, *đã quét sạch*). Chi tiết từ vựng giữ nguyên như cũ: `uttiṇṇā` = *đã vượt lên trên*, `paṅka` = bùn, `palipā` = chỗ lầy nhẫp, `pātālā` = vực sâu, `parivajjitā` = *đã tránh*.

  `Mutto oghā ca ganthā ca,` = *đã thoát khỏi cả dòng lũ lẫn sợi trói,* — `ogha` → *dòng lũ* (53 chỗ trong tầng), `gaṇṭhā` → *sợi trói* (bản uddāna Pháp Cú/Saṃyutta dùng *sợi dây*; ở đây nghĩa là *sợi trói buộc* nên tôi dùng *sợi trói*). `sabbe mānā visaṁhatā` = *mọi kiêu mạn đã quét sạch* — `māna` → *kiêu mạn* (86 chỗ), `visaṃhatā` là quá khứ của `visaṃh` (*nghiền nát, phá vỡ tận gốc*).

  `0.3 Navamavagga` → *Phẩm Thứ Chín*; `1.5` giữ hai dấu lược.
