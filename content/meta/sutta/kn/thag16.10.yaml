  KHÁC BIỆT ĐÃ PHÂN XỬ (đối chiếu Sujato).
    (1) `1.3` `ekaggassa nisinnassa`: Sujato dịch as he was seated alone; bản Việt dịch nhất tâm theo `ekagga` (một đỉnh, nhất tâm), không dịch alone.
    (2) `7.1`–`7.4`: Sujato dịch They were used to simple things, unburdensome, gentle, not pompous at heart, unsullied, not scurrilous, their thoughts were intent on the goal; Sujato bỏ `vasānugā` ở `7.4` (không có chữ dịch ứng) và dịch `nīcā niviṭṭhā` là used to simple things; bản Việt giữ cả `vasānugā` (biết tuân theo) và dịch `nīcā niviṭṭhā` sát chữ (khiêm hạ, vững vàng); xem bất định.
    (3) `9.1`–`9.4`: Sujato đảo thứ tự: dịch `Nibbutā dāni te therā` ở dòng 9.2 và `mahājhāyī mahāhitā` ở dòng 9.3. Bản Việt theo thứ tự Pāli từng khoá.
    (4) `11.1`–`11.4`: Sujato dịch This is the season for bad principles and defilements. Those who are ready for seclusion are all that’s left of the true Dhamma, tức đọc hai vế `11.3`–`11.4` là cùng một nhóm người. Bản Việt cùng cách đọc nhưng giữ trật tự khoá Pāli: `Upaṭṭhitā vivekāya` ở `11.3` đứng trước, `ye ca saddhammasesakā` ở `11.4` làm đồng vị.
    (5) `13.4`: `sasaṅgāmeva ghosite`: Sujato dịch as if they had declared war on themselves; bản Việt dịch sát: như khi chiến trận đã được loan báo; không thêm tự mình (on themselves).
    (6) `17.3`–`17.4`: Sujato dịch Not being settled internally, they think, This is the goal of the ascetic life, thêm they think và nháy; Pāli là `acchati` (ở yên, vẫn sống) và `ti` không nháy. Bản Việt dịch họ vẫn sống mà nghĩ rằng, không thêm nháy.
    (7) `24.1`–`24.4`: Sujato nối `ahirīkā na lajjare` thành Lacking conscience, they do not care; bản Việt tách hai vế vô tàm và không xấu hổ theo hai từ Pāli (`ahirīkā`, `na lajjare`).
    (8) `26.1`: `Evaṁ nānappayātamhi`: Sujato dịch When things have come to this; bản Việt dịch sát chữ: khi đã đi theo nhiều ngả như vậy (xem bất định).
    (9) `27.3`: Sujato dịch very mindfully ở dòng 27.3 (đặt `sati` vào vế người đi chân trần); bản Việt giữ `satiṁ upaṭṭhapetvāna` thành sau khi an trú niệm, không nói rõ vế nào.
    (10) `28.2`: `tesaṁ vattamanussaraṁ`: Sujato dịch recollecting their conduct; bản Việt dịch nhớ nghĩ nếp hành xử của họ, cùng nghĩa.
    (11) `29.1`–`29.4`: Sujato dịch ... said in the sāl tree grove; bản Việt nối `vatvā` (sau khi nói) với ba vế `samaṇo`, `brāhmaṇo`, `isi` theo Pāli.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `7.1` `nīcā niviṭṭhā`: `nīca` là thấp, khiêm hạ; `niviṭṭha` là an trú, vững vàng. Tôi không tìm được tiền lệ trong tầng cho cặp này; Sujato dịch used to simple things (chưa rõ cơ sở). Có thể là người khiêm hạ vững vàng trong cách sống của mình. Bản Việt giữ hai tính từ riêng.
    · `7.4` `atthacintā vasānugā`: `vasānuga` (đi theo sự chi phối) không nêu tân ngữ; có thể là tuân theo lời dạy (của Thầy, của pháp), có thể là biết nghe theo nói chung. Bản Việt dịch biết tuân theo, không thêm tân ngữ.
    · `5.1` `jīvitānaṁ parikkhāre`: `jīvitānaṁ` ở số nhiều sở hữu cách, trong khi tầng có `jīvitaparikkhāra` là hợp từ cố định (24 khoá; vật dụng 23, đời sống 21); bản Việt dịch các vật dụng của đời sống theo hợp từ.
    · `3.2` `hirikopīnachādana`: cả ba tiền lệ trong tầng bỏ chữ `hiri` (xấu hổ) hoặc dịch phần thân thể xấu hổ; bản Việt chọn che chỗ kín, không thêm xấu hổ, theo `dn29` và `mn2`.
    · `8.2` `gataṁ bhuttaṁ nisevitaṁ`: `nisevita` là thân cận, thọ dụng, thực hành; bản Việt dịch nếp sinh hoạt (rộng), có thể hẹp hơn: cách dùng các vật dụng. Sujato dịch practice.
    · `11.1`–`11.2` `yo utu`: đại từ quan hệ `yo` không có đại từ tương ứng; bản Việt dịch đây là mùa của các pháp ác và của các phiền não (theo Sujato), không dịch `yo`.
    · `11.3`–`11.4` `upaṭṭhitā vivekāya … ye ca saddhammasesakā`: hai cách đọc, (a) cùng một nhóm người (những người sẵn sàng viễn ly chính là phần sót lại của diệu pháp, như Sujato), (b) hai nhóm (người sẵn sàng viễn ly; và người còn sót lại của diệu pháp). Bản Việt chọn (a) nhưng để `họ` và `những ai là` cạnh nhau nên vẫn đọc được theo (b).
    · `13.3`–`13.4` `kilesavatthūsu … sasaṅgāmeva ghosite`: `kilesavatthu` không có tiền lệ trong tầng (0 khoá); dịch các nền tảng của phiền não. `sasaṅgāma`: có thể là như khi chiến trận đã được loan báo (đã chọn), có thể là như thể mang chiến trận trong mình (Sujato). Pāli `ghosite` là vị ngữ phân từ ở định cách, ủng hộ cách đọc thứ nhất.
    · `15.4` `akicchāni`: tôi đọc là `akiccāni` (không nên làm), theo Sujato (what they shouldn’t) và theo ngữ cảnh (bỏ của cải vợ con mà vì một muỗng cơm lại làm điều không đáng). Nhưng tầng có chữ `akiccha` ở nghĩa khác: `akicchalābhī` (`dn28:19.3`, `mn108:17.1`, `mn6:9.1` và nhiều khoá khác) dịch không khó khăn; nếu `akicchāni` ở đây là dạng đó (a + kiccha) thì nghĩa đổi thành họ làm những việc dễ dãi, không khó nhọc. Không phân xử được; đây là một điểm chưa chắc của bản dịch (đã giảm `ambiguity_integrity`).
    · `17.4` `acchati`: số ít, trong khi các chủ ngữ ở `17.1`–`17.3` số nhiều; có thể là sự phối hợp lỏng của Pāli. Bản Việt dịch họ vẫn sống.
    · `19.1` `dantaponaṁ kapitthañca`: `dantapona` là que làm sạch răng (tầng không có tiền lệ, 0 khoá), `kapittha` là trái kapittha (tiền lệ `mil5.4.1`, `tha-ap514`). Sujato dịch tooth-picks of white fig, hiểu `kapittha` là gỗ làm tăm; bản Việt hiểu hai danh từ liệt kê riêng, theo cấu trúc `ca`. `khādaniya` (0 khoá trong tầng): thức ăn nhai, thức ăn cứng (Vinaya); bản Việt dịch các thức ăn nhai.
    · `19.3` `piṇḍapāte ca sampanne`: `sampanna` có thể là thượng hạng (Sujato well-cooked) hoặc đầy đủ; bản Việt chọn thượng hạng.
    · `20.4` `issare khattiyā yathā`: `issare` có thể là quyền thế, quyền cai quản (chọn), hoặc với bậc chủ nhân (`issara` là chủ). Sujato dịch sovereignty.
    · `21.2` `apāṭukā`: tầng không có tiền lệ (0 khoá); từ gốc `paṭu` (lanh lợi, khéo) với `a-`, nên nghĩa gốc có thể là vụng về, không lanh lợi, mâu thuẫn với tính từ liệt kê; Sujato dịch sly. Tôi theo Sujato (xảo quyệt) nhưng chưa phân xử được, ghi lại như một chữ chưa chắc.
    · `21.4` `āmisaṁ paribhuñjare`: `āmisa` là vật chất, lợi lộc vật chất (chọn, không thêm lợi lộc); Sujato dịch things of the flesh.
    · `22.1`–`22.2` `lesakappe pariyāye, parikappenudhāvitā`: `lesakappa` (không có tiền lệ, 0 khoá) = cớ giả, lấy cớ; `pariyāya` = lối nói vòng (nghĩa Vinaya); `parikappenudhāvitā` = `parikappena` + `udhāvitā` (có thể `upadhāvitā`). Tôi dịch họ chạy theo bằng mưu tính; Sujato Pursuing shams, contrivances, and plans. Cấu trúc câu giữa `22.1`–`22.2` có thể được đọc theo cách khác (`lesakappe pariyāye` làm trạng ngữ), nghĩa không đổi nhiều.
    · `23.1`–`23.2` `upaṭṭhāpenti parisaṁ, kammato`: `kamma` có thể là công việc (chọn, theo Sujato business), có thể là nghi thức hay yết-ma. `upaṭṭhāpenti` dịch lập nên (Sujato assemble); có thể là chu cấp, phục vụ hội chúng. Không phân xử được.
    · `23.4` `atthato`: dịch mục đích (cùng `7.4`, `17.4`); có thể là lợi ích (của người nghe). Một chữ `attha` ở ba chỗ khác ngữ cảnh; nếu người biên tập muốn đổi `23.4` sang lợi ích thì đổi riêng khoá đó.
    · `24.2` `saṅghato paribāhirā`: đứng ngoài Tăng; `paribāhira` là bên ngoài, bị loại ra ngoài (tiền lệ `sn4.25:16.4` bị loại ra ngoài; Sujato barred from). Bản Việt giữ đứng ngoài, trung tính giữa hai cách hiểu (đứng ngoài tự chọn so với bị loại).
    · `25.1` `nānuyuttā tathā eke`: `tathā` (cũng vậy, như thế) nối với kệ 24; dịch cũng có những người … như thế. `sambhāvanā` (`25.3`; 0 khoá trong tầng): tôn trọng, danh vọng; Sujato honored.
    · `26.1` `nānappayātamhi`: 0 khoá trong tầng; `nānā` (nhiều) + `payāta` (đã đi); dịch khi đã đi theo nhiều ngả như vậy; cũng có thể là khi sự việc đã tiến triển nhiều cách như thế (Sujato When things have come to this). `26.2` `tathā` dịch như thế; có thể là đến thế, như thế này.
    · `27.3` `satiṁ upaṭṭhapetvāna`: gắn với vế người đi chân trần hay vế bậc hiền trí; xem phần khác biệt (9).
    · `28.4` `phuseyya`: khả năng cách (optative), không nêu chủ ngữ; dịch vẫn có thể chạm đến, không thêm người ấy hay hành giả.
    · `30.4` `aṅguli dibbacakkhuko`: `aṅguli` là Aṅgulimāla (rút gọn), vị có thiên nhãn là một tên hiệu, theo thứ tự bài là Anuruddha (`thag16.9`). Pāli của kệ không nêu tên nên bản Việt không nêu: vị có thiên nhãn. `Mālukyaselo` (`30.3`): hợp từ Mālukya + Sela, dịch thành hai tên riêng.
    · `0.2` `Vīsatinipāta` và 29 kệ ở bài này: tên bộ theo quy ước nipāta, không phải số kệ chính xác; không sửa.

