  Phạm vi: đủ 131/131 khoá của bài (4 khoá `:0` tiêu đề, 116 khoá kệ `1.1`–`29.4` của 29 kệ, `29.5` dòng bìa, `29.6` dòng kết bộ, và 10 khoá `30.0`–`30.8` là kệ tóm tắt cả bộ), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã in và đọc đối chiếu cả 131 cặp Pāli↔Việt, không đọc mẫu. Đây là kệ thứ ba của Trưởng lão Pārāpariya (hai bài trước là `thag1.116` và `thag16.2`): lời than về thế hệ tỳ-kheo sau so với thế hệ thuở Đức Phật còn tại thế (kệ 2–9), sự suy giảm của giáo pháp (kệ 10–11), cảnh phiền não và tà kiến lan rộng (kệ 12–14), các kiểu sống sai của tỳ-kheo đương thời (kệ 15–25), rồi lời khuyên sống chánh niệm trong thời cuối (kệ 26–28), và dòng kết (kệ 29).

