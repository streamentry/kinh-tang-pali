notes: |-
  Dịch trực tiếp từ Pāli root, vì tầng tham khảo tiếng Anh (Sujato) không có tệp cho tha-ap399 tại commit đã ghim và không có bản Việt hiện hành cho uid này. Chỉ Pāli làm chứng cứ; các điểm dưới đây là chỗ Pāli cho phép hơn một cách hiểu hoặc tầng chưa có tiền lệ.
  Tên bài `:0.3`: Pāli `Girimānandattheraapadāna` không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli bắt đầu bằng số); `translationTitle` bằng đúng giá trị `:0.3`. Mở đầu tên: đo toàn tầng tha-ap thấy Bài Kệ Tuyên Ngợ 253, Bài Kệ Tuyên Ngôn 136, Ký Sự 124 (Tuyên Ngợ là lỗi chính tả); ở phạm vi gần (tha-ap380–419) Ký Sự 19, Tuyên Ngợ 7. Hai phạm vi cho đa số khác nhau; chọn Ký Sự vì đây là cách dịch đúng của apadāna, không mang lỗi chính tả, và đa số bài liền kề (tha-ap395, 396, 401, 403–406) dùng đúng dạng này. Cần biên tập phán một lượt cho cả cuốn. Tên phẩm `Phẩm Pilindavaccha` theo tha-ap396, tha-ap400. Câu kết `:32.1` dịch thứ bảy theo Pāli `sattamaṁ`.
  Số đếm tự tính: `Tiṁsakappasahassamhi` (27.1) = `tiṁsa` 30 × `sahassa` 1000 kiếp = ba mươi ngàn kiếp; tiền lệ tầng cho đúng dạng Pāli này: ba mươi ngàn kiếp 8 khoá, ba nghìn kiếp 1 khoá. Bất định cần biên tập phán: tài liệu hướng dẫn chung của đợt dịch từng ghi `tiṁsa` = 3 (tức ba nghìn kiếp), trái với phép đo trên tầng và với từ vựng `tiṁsa` = 30; bài này theo `tiṁsa` = 30. Không có số nào khác trong bài.
  Bất định: (1) 15.2–15.4 `girimañjariṁ` dịch chùm hoa núi (không có tiền lệ trong tầng; có thể là tên một loài hoa); `dibbagandhaṁ sampavantaṁ` ở 15.3 theo dạng giống đực/trung nên hiểu bổ nghĩa cho Đức Sumedha ở 15.4 (tiền lệ tha-ap337:12.1 dùng lại nguyên văn Vị đang tỏa hương trời), nhưng cũng có thể hiểu là hương của chùm hoa; bản dịch giữ nguyên mơ hồ của cú pháp. (2) 22.4 `paṭikuṭiko agañchahaṁ` dịch tôi lùi bước ra đi (đi lùi, vừa đi vừa lễ bái, vì sự kính trọng); tầng có 1 tiền lệ gần nhất tha-ap338:6.4 `paṭikuṭiko agacchahaṁ` dịch tôi quay trở về, và 2 khoá `Gacchanto paṭikuṭiko` dịch đường hẹp; ba cách hiểu khác nhau, Pāli một mình không phân xử được. (3) 10.3–10.4 `upagacchanti` không có tân ngữ trong Pāli (có thể là đến nơi trú, đến chỗ tránh); bản dịch giữ họ tìm đến, không thêm nơi trú. (4) 19.1 `vasipattā` dịch đã đạt tự tại (tầng chỉ có tiền lệ `cetovasippatta` dịch làm chủ được tâm); `paṭipannā` ở 20.1 dịch các vị đang thực hành (đang bước trên đạo lộ), cạnh `sekhā` và `phalaṭṭhā`. (5) 24.4 `paṭisallānagocaro` dịch lấy sự độc cư làm nơi lui tới (`paṭisallāna` là độc cư thiền tịnh, tầng dịch độc cư; `gocara` là phạm vi hoạt động). (6) 18.3 `paṭipādesi me maggaṁ` dịch Ngài đã đưa tôi vào con đường, theo nghĩa đặt vào đạo lộ. (7) 7.1 `satiṁ paṭilabhitvāna` dịch sau khi lấy lại được niệm (sati ở đây có thể là sự tỉnh táo sau cơn rối loạn tâm 2.3; giữ thuật ngữ niệm, không diễn giải). (8) 1.2 `putto sīvathikaṁ gato` dịch con trai đã đi đến bãi tha ma, giữ nguyên cách nói của Pāli (nghĩa là đã chết và đã được đưa đến bãi thiêu); 1.4 `ḍayhare` là hiện tại bị động nên dịch đang bị thiêu. (9) 5.2 `mahesino` dịch Đại Ẩn Sĩ theo đa số tầng (tầng có Đại Ẩn Sĩ nhiều hơn các cách khác; tha-ap tiền lệ trùng Pāli dịch là bậc đại hiền tri). (10) 25.4 `vicarāmi` dịch du hành; 23.2 `sampajāno patissato` dịch tỉnh giác, có niệm. (11) 13.1–13.2 `jiṇṇaṁ … saṁ tacaṁ` hiểu `jiṇṇaṁ` bổ nghĩa cho `tacaṁ` (lớp da cũ), như tiền lệ bv10:28.1, ja354:1.1, ja491:15.1; 13.4 `hīyare` dịch bỏ lại, giữ hiện tại như hai vế song song với con rắn. (12) 21.1 `Mahāsamuddovakkhobho` dùng lại nguyên văn tha-ap405:13.1 (Như biển cả không thể khuấy động). (13) Ngôi và xưng hô: người kể là vị trưởng lão nói tôi; lời Đức Phật ở 9–13 dịch ngươi cho `tuyhaṁ` theo tiền lệ tha-ap405:7.1, tha-ap425:10.3 (tầng cũng có ông ở tha-ap403:7.3); lời ca ngợi ở 17–21 hướng đến Đức Phật nên dùng Ngài.
  Lượt thuật ngữ: Đấng Dẫn Đạo thế gian cho `lokanāyaka` (tầng đa số Đấng; dùng thống nhất trong bài); bậc Đại Mâu-ni cho `mahāmuni` (48 khoá trong tầng); bậc Đại Anh Hùng cho `mahāvīra`; bậc Đại Long cho `mahānāga`; bậc Chiến Thắng cho `jino`; bậc Có Mắt cho `cakkhumā`; chúng sanh cho `satte` (tầng 3 khoá chúng sanh, 1 khoá chúng sinh); trí tuệ cho `ñāṇa`; sanh y cho `nirūpadhi` (12 khoá).
  Công thức kết `Itthaṁ sudaṁ … abhāsitthāti` dịch theo nhóm đa số (những bài kệ này) thay vì nhóm số ít (bài kệ này). Hai khoá lược `…pe…` (29.2, 30.2) giữ đúng một `…`; Pāli không có `(…)` ở khoá nào. Cuối 27.4 dùng đây là quả báo của việc cúng dường Đức Phật theo đa số cả tầng (đây 59, đó 51) và cả phạm vi gần tha-ap370–430 (đây 8, đó 7).
  Đã dò tiền lệ cho 36 khoá có Pāli trùng nguyên văn với tầng tha-ap: 29 khoá dùng lại nguyên văn bản Việt của tầng, 7 khoá khác (5.2, 6.2, 7.4, 14.1, 15.4, 23.2, 27.2: cùng nghĩa hoặc khác ngôi, dấu câu hay thuật ngữ đã nêu ở trên; 6.2 bỏ chữ cũng của tiền lệ vì Pāli không có `pi`; 14.1 theo tiền lệ Hiểu rõ lời của Đức Phật). Trong chính bài có 4 nhóm Pāli trùng nguyên văn (9.4, 11.4, 12.4; 11.3, 12.3, 13.3; 29.2, 30.2; 29.3, 30.3); ba nhóm đầu Việt giống nhau, nhóm 29.3 và 30.3 chỉ khác dấu nháy đóng ” đúng như Pāli. Đã kiểm 123/123 khoá khớp tập khoá và thứ tự Pāli, nháy đơn ‘ ’ và nháy kép “ ” khớp Pāli từng khoá (nháy kép mở ở 1.1, đóng ở 30.3; nháy đơn mở ở 9.1, đóng ở 13.4, mở lại ở 17.1, đóng ở 21.4), NFC, không khoảng trắng thừa, không Pāli lọt sang bản Việt ngoài tên riêng.
