notes: |-
  Dịch từ Pāli root, 137 khoá, đủ khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli. Tên bài (khoá 0.3) lấy đúng giá trị translationTitle. Pāli 0.3 bắt đầu bằng số (1 Lakuṇḍabhaddiyattheraapadāna) nên giữ số thứ tự theo dạng N. (chính sách giữ số khi và chỉ khi Pāli có số; đo trên các tệp tha-ap trong tầng: Pāli có số mà Việt giữ số 155, bỏ số 0, thêm số ở chỗ Pāli không có 0). Kiểu tên: Ký Sự Về Trưởng Lão X chiếm 33 so với Bài Kệ Tuyên Ngợ 16 ở phạm vi tha-ap500 đến tha-ap600, và 18 so với 1 ở tha-ap530 đến tha-ap560; toàn tầng tha-ap thì ngược lại: Tuyên Ngợ 254, Tuyên Ngôn 136, Ký Sự Về 130. Hai phạm vi cho hai đa số khác nhau; theo phạm vi gần nhất và các bài liền kề tha-ap544, 547, 550 thì dùng Ký Sự Về. Chữ Tuyên Ngợ không dùng vì chưa rõ gốc; vấn đề đó để biên tập phán một lượt cho cả cuốn.
  Khoá 0.2 Bhaddiyavagga dịch Phẩm Bhaddiya (6 khoá Pāli trùng đã dịch như vậy). Khoá 34.1 theo công thức Tôi nghe như vầy ... đã nói những bài kệ này (549 khoá trong tầng dùng những bài kệ này, 2 khoá dùng số ít). Khoá 35.1 dịch Ký sự về Trưởng lão Lakuṇḍabhaddiya, thứ nhất (paṭhamaṁ: 51 colophon trong tầng tha-ap dùng thứ nhất).
  Số Pāli: satasahassa là sata 100 nhân sahassa 1000 bằng 100.000, dịch một trăm ngàn. Khoá 1.3 (Ito satasahassamhi, kappe uppajji nāyako: cách đây một trăm ngàn kiếp, kappe nằm ở khoá 1.4 nên chữ kiếp được đưa lên 1.3 cho câu Việt liền mạch, đúng như tiền lệ tha-ap544). Khoá 6.1 (Satasahassito kappe trong lời thọ ký về Đức Gotama, kappe bhavissati ở 6.4): dịch Sau một trăm ngàn kiếp nữa, theo hướng tương lai của lời thọ ký; 28 trong 52 khoá cùng Pāli của tầng viết Vào một trăm ngàn đại kiếp trước, là cách hiểu quá khứ không hợp với lời thọ ký, và dạng Sau ... nữa có tiền lệ ở tha-ap539:14.1 (trong tha-ap: 3 khoá Sau ... nữa, 3 khoá Vào ... nữa). Khoá 9.1 Dvenavute ito kappe: dve 2 cộng navuti 90 bằng 92, dịch chín mươi hai kiếp (18 trong 43 khoá cùng Pāli của tầng viết Vào chín mươi hai kiếp trước, 9 khoá thêm đây, 9 khoá Từ chín mươi hai kiếp trước; theo dạng đa số). tāvatiṁsa là cõi Ba mươi ba (3 cộng 30 bằng 33; dịch cõi trời Ba mươi ba theo quy ước tầng). Khoá 22.1 sattayojanika là satta 7 nhân yojana, dịch bảo tháp bảy do-tuần theo tha-ap51:20.1. Khoá 24.2 yojanuggataṁ là yojana cộng uggata, dịch cao một do-tuần; Pāli không ghi chữ số, chữ một là hệ quả của cấu tạo hợp từ. Khoá 32.3 tisso vijjā là ba minh, 33.1 catasso là bốn vô ngại giải, 33.2 aṭṭhime là tám giải thoát, 33.3 chaḷabhiññā là sáu thắng trí. Bài không có cụm Tiṁsakappasahassa; số tiṁsa duy nhất nằm trong tên cõi trời Tāvatiṁsa, nên không có bất định số lượng nào cần phán.
  Ngôi kể: tôi cho người kể suốt bài, kể cả các câu chuẩn của tầng; ở các công thức Kilesā jhāpitā mayhaṁ, viharāmi anāsavo, Svāgataṁ vata me āsi, đa số tầng dùng ta (116, 126 và 111 khoá) nhưng nhóm dùng tôi cũng đã có (21 hoặc 25, 28, và 9 hoặc 24 khoá tùy cách diễn đạt) và các bài liền kề tha-ap544, 547, 551 dùng tôi; chọn tôi để nhất quán trong bài. kataṁ buddhassa sāsanaṁ dịch không chủ ngữ (131 khoá so với 25 khoá có tôi ở dạng không nháy; 480 so với 25 ở dạng đóng nháy kép) và Paṭisambhidā catasso dịch Bốn vô ngại giải (513 khoá). Pāli của bài không có …pe… hay (…) nên bản Việt không có dấu lược nào; đã kiểm hai chiều.
  Pāli trùng nguyên văn trong chính bài: 5 nhóm, mỗi nhóm hai khoá, bản Việt giống nhau ở cả 5 (8.1 với 25.1, 8.2 với 25.2, 8.3 với 25.3, 8.4 với 25.4 là công thức Tena kammena sukatena; và 30.4 với 31.4 là viharāmi anāsavo, đều dịch tôi sống không còn lậu hoặc), 0 cặp trùng mà Việt khác. So với tầng: đã dò 65 khoá Pāli có trùng nguyên văn ở các bài khác của kn; 59 khoá Việt dùng lại nguyên văn một dạng đã có trong tầng (50 khoá đúng dạng đa số), 6 khoá Việt khác: 4.1 (ta chuyển thành tôi, thêm trở nên theo tha-ap539:16.1), 7.3 (tên là Bhaddiya theo tha-ap539:15.3, tầng có một khoá có tên là), 10.1 (xem dưới), 10.3 (khác tầng một chữ hoa đầu câu; dùng tất cả chúng sinh như các bài tha-ap539 và 541), 13.3 (tầng giữ Ambapiṇḍa không dịch; ở đây dịch trái xoài, xem dưới), 26.3 (Sāvatthiyaṁ puravare khác một chữ với Sāvatthiyaṁ pure vare ở tha-ap547:14.3 nên chỉ dùng lại dạng Tại kinh thành Sāvatthī tuyệt hảo).
  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 33.4; nháy đơn mở ở 5.3 và đóng ở 7.4 (lời thọ ký của Đức Phật Padumuttara), nháy đơn mở ở 22.1 và đóng ở 22.3 (lời dân chúng bàn nhau); khớp Pāli từng khoá, mỗi dấu một lần.
  Bất định, không đưa vào thân kinh: 2.2 seṭṭhiputto dịch con trai nhà triệu phú theo cách tầng dịch seṭṭhikula là gia đình triệu phú (tha-ap547:14.2, 537:20.2 và các khoá thi-ap); tha-ap80:2.1 dịch seṭṭhiputto là con trai vị trưởng giả. 2.3 Jaṅghāvihāraṁ vicaraṁ dùng lại Trong lúc đi bộ dạo chơi theo tha-ap549:8.1. 10.1 Caraṇena ca sampanno dịch đầy đủ đức hạnh; hai bài tha-ap trước viết đầy đủ đức hạnh và minh hạnh, nhưng Pāli ở đây chỉ có caraṇa, minh (vijjā) không được nêu, nên bỏ vế minh hạnh. 11.2 phussakokila: hợp từ chưa rõ; dịch con chim cu phussa (kokila dịch chim cu ở tha-ap401:3.4 và tha-ap553:3.4), chữ phussa để chữ thường và không dịch vì không chắc là tên loài chim hay chỉ liên hệ với Đức Phật Phussa; người biên tập phán. 11.1 Nandārāma hiểu là tên rừng (bv12:31.2 và bv3:23.2 giữ Nandārāma nguyên). 11.3 hương thất cho gandhakuṭi (3 khoá trong tầng viết hương thất, 0 khoá viết hương phòng). 11.4 ambarukkha hiểu là cây xoài. 13.3 Ambapiṇḍaṁ dịch trái xoài vì ở đây là một trái xoài chín, nên không dùng lại hình thức Ambapiṇḍa của tha-ap441:2.1. 13.1 Rājuyyānaṁ dịch vườn của vua (tha-ap196:1.2 ở tầng dịch rājuyyāna là đường lộn của vua, đó là dạng khó hiểu nên không theo). 15.3 Patte pakkhippa pakkhehi hiểu pakkhehi là đôi cánh (con chim đặt quả xoài vào bát bằng cánh). 15.4 pañjaliṁ katvāna mañjunā dịch chắp tay một cách dịu dàng; chưa rõ mañjunā bổ nghĩa cho chắp tay hay cho tiếng hót, vì ở 12.4 mañjunābhinikūjahaṁ cùng một từ chỉ tiếng hót du dương; chưa có đối chiếu ngoài. 16.3 vassanto hiểu là chim hót (vassati dùng cho tiếng kêu của loài vật). 17.3 sakuṇagghi dịch chim ưng (mil7.1:96.1 dịch sakuṇagghi là chim ưng; ja492:13.2 dịch seno là chim ưng). 17.2 buddhapemagatāsayaṁ dịch lòng đầy thương mến Đức Phật, là dịch phần tâm ý đã đi đến thương mến Đức Phật. 18.1 Tato cutohaṁ tusite: cutohaṁ hiểu là cuto ahaṁ, tusite là vị trí (cõi Đâu-suất; 28 khoá trong tầng tha-ap dùng Đâu-suất, 0 khoá dùng Tusita), anubhotvā ở 18.2 dịch sau khi hưởng. 18.3 Manussayonimāgacchiṁ dịch tôi đã đến với cõi người theo tha-ap560:14.1. 20.2 kutitthiye dịch các ngoại đạo sai lạc (ngoại đạo 9 khoá trong tầng tha-ap; kutitthiya theo mil5.1.1:18.11 dịch ngoại đạo sai lạc); 20.4 dùng lại nguyên văn nibbuto so sasāvako (13 khoá). 21.4 và 22.4 các động từ kubbanti, mantayanti ở thì hiện tại của Pāli dịch không thêm thì. 23.1 đến 23.4: Kikī là vua xứ Kāsi (thi-ap1:10.3); hutvāhaṁ appamāṇassa, pamāṇaṁ cetiye vadiṁ khó nhất bài: appamāṇassa hiểu là bậc Vô Lượng (Đức Phật Kassapa) ở cách sở hữu, cetiye là nơi bảo tháp, câu có nghĩa người kể đã nói ra kích thước của bảo tháp; khoá 28.1 lặp ý này (Cetiyassa pamāṇaṁ yaṁ akariṁ, kích thước tôi đã đặt ra cho bảo tháp) và nối nghiệp ấy với thân hình lùn ở 28.3. 23.2 senāya nāyako dịch chỉ huy quân đội. 24.4 và 22.2 dùng bảo tháp (28 khoá tha-ap dùng bảo tháp, 11 khoá dùng ngôi tháp). 28.3 Lakuṇḍakasarīro dịch có thân hình lùn (lakuṇḍaka là lùn, thấp; không giữ Pāli vì ở khoá 0.3 và 34.1 tên Lakuṇḍabhaddiya đã giữ nguyên, nhưng ở 28.3 từ này làm tính từ chỉ thân hình). 28.4 paribhavāraho dịch đáng bị khinh miệt. 29.2 isisattamaṁ dịch bậc tối thượng trong các bậc ẩn sĩ theo vv21:1.4. 29.4 aggattaṁ dịch địa vị đứng đầu. 30.1 phaladānena dịch việc dâng trái cây (tha-ap142:5.4 dịch phaladāna là việc dâng cúng trái cây). 30.2 guṇānussaraṇena dịch nhớ nghĩ đến các phẩm đức, không thêm chủ thể ngoài Pāli (Pāli chỉ nêu buddhassa ở khoá 30.1). 30.3 Sāmaññaphalasampanno dịch đầy đủ quả Sa-môn.
  Lời thọ ký tương lai (kappe bhavissati, hessati, lacchase): đã dịch hướng tương lai (6.1 Sau một trăm ngàn kiếp nữa, 6.4 sẽ làm bậc Thầy, 7.4 sẽ làm môn đồ, 5.4 ngươi sẽ đạt được); khoá 5.1 viyākāsi dịch đã tuyên bố theo tha-ap544:7.1; 5.3 Anāgatamhi addhāne dịch Vào thời vị lai theo tha-ap539:13.3 và 533:14.3.
  Phân biệt ngôi: khoá 18.1 đến 18.4 chuyển từ cõi Đâu-suất sang đời người; không có chủ thể nào khác ngoài người kể. 19.1 đến 19.4 là đoạn nói về Đức Phật Kassapa trong hiền kiếp hiện tại, dùng lại nguyên văn cách dịch của tha-ap550:1.1 đến 1.4 và tha-ap551:1.1 đến 1.4 (Pāli trùng nguyên văn, bản Việt hai bài giống nhau); tha-ap433:1.3 dịch Kassapo nāma gottena khác (tên là Kassapa, dòng họ Gota) nên không theo.
  Hệ quả giới hạn: tha-ap543 không có bản Anh đã ghim, không có bản Việt hiện hành và không có lớp english-project, nên toàn bài chỉ đối chiếu Pāli và tiền lệ trong tầng Việt; triangulation hạ xuống 7.5 và status giữ draft.
  Cổng kỹ thuật để coordinator chạy (người dịch bị cấm chạy): npm run validate, npm test, npm run check, npm run build. technical_integrity đặt 9.6 vì chưa chạy bốn lệnh đó.
