notes: |-
  Jātaka, không có bản Anh Sujato ở commit đã ghim (đã kiểm trong
  source/upstream-manifest.json). Draft + blocker thật. 13/13 khoá từ Pāli. `cần` RỖNG nên
  tự kiểm mọi khoá — 0 lỗi; idempotent byte-for-byte.
  KHÔNG CÓ TIỀN LỆ: Santhavavagga chưa có bản Việt nào trong tầng. Chọn Phẩm Hội Họp, khớp
  với cách gọi hội họp đã có trong tầng (3 chỗ, vd dn16 về hội chúng). Indasamānagottajātaka
  cũng chưa có; dịch theo nghĩa, người bạn của thần Indra, không bịa danh xưng khác.
  BẤT ĐỊNH 1, đã phân xử theo cú pháp: `kāpurisa` thường nghĩa là người quân tử, nhưng ở
  đây nó là tân ngữ của cấm, thành Người quân tử không giao hội họp với kẻ tiếc nhân. Nếu
  dịch ngược (quân tử là đối tượng) thì câu cấm trở nên vô nghĩa. Ghi rõ vì đây là chỗ dễ
  lật ngược.
  BẤT ĐỊNH 2: `Ariyo anariyena pajānamatthaṁ` — ariyo là chủ ngữ, anariyena là tân ngữ.
  Dịch hiểu rõ ý nghĩa ấy: quân tử với kẻ hạ chí. `pajānamatthaṁ` là hiểu rõ ý nghĩa, không
  phải người hiểu ý nghĩa.
  BẤT ĐỊNH 3: `Gajo yathā indasamānagottaṁ` — voi thì giống người bạn của Indra. Dịch
  như con voi, người bạn của thần Indra, giữ hình ẩn xưng; không bịa thêm chi tiết nào về
  con voi.
  `metti` là tình bạn, thân tình; `Teneva mettiṁ kayirātha saddhiṁ` là hãy cứ kết bạn với
  tôi, vậy thôi. Câu đối đáp của con rắn, giọng ngang hàng, không khiêm tốn quá mức.
  Hạ ambiguity_integrity 8.3, semantic_fidelity 8.4, terminology 8.3 vì còn ba bất định
  mở. triangulation 7.0: không tầng Anh, không bản Việt tham khảo.
  Sửa lan 2026-10-13: (1) 0.3 `Santhavavagga` "Phẩm Hội Họp" → "Phẩm Santhava", đồng bộ ja162 và ja164–170 (nhãn tag đổi theo); `santhava` là sự thân quen, không phải hội họp. Đoạn "KHÔNG CÓ TIỀN LỆ … Chọn Phẩm Hội Họp" và BẤT ĐỊNH 1 ở trên thuộc bản cũ và bị mục này thay thế. (2) 1.1 `Na santhavaṁ kāpurisena kayirā` "Người quân tử không giao hội họp với kẻ tiếc nhân," → "Không nên tạo sự thân quen với kẻ xấu," (`kāpurisa` là kẻ xấu, tiền lệ ja542:66.4, ja162:1.2, pv51, pv21; không phải "quân tử" — bản cũ đảo nghĩa câu cấm). (3) 1.2 `Ariyo anariyena pajānamatthaṁ` "hiểu rõ ý nghĩa ấy: quân tử với kẻ hạ chí;" → "bậc cao quý với kẻ không cao quý, người hiểu rõ điều lợi ích;" (`ariyo` bậc cao quý, `anariyena` kẻ không cao quý, `pajānaṁ atthaṁ` hiểu điều lợi ích; "hạ chí" không có tiền lệ). (4) 1.3 `Cirānuvutthopi` "dù bị khuyên dài lâu," → "dù đã sống chung lâu ngày," (`anuvuttha` là đã sống cùng, không phải bị khuyên). (5) 2.4 `Sukho have sappurisena saṅgamo` "giao du với bậc thiện chí, thật sự là điều hân hoan." → "giao du với bậc thiện nhân quả thật là an lạc." (Pāli trùng nguyên văn ja542:67.4: "Giao du với bậc thiện nhân quả thật là an lạc"; vv84:44.6 và pv37:44.6 cùng "bậc thiện nhân"). Bất định còn lại, giữ nguyên: 1.4 `Gajo yathā indasamānagottaṁ` ("như con voi — người bạn của thần Indra") và tiêu đề "Kinh Người Bạn Của Indra" chưa được kiểm lại; 2.1–2.3 chưa được kiểm lại. Điểm cũ không đổi.

  Sửa lan 2026-10-13 (accuracy fix, các mục BẤT ĐỊNH 3 và nhận định về `metti`/"con rắn" ở trên được thay bằng mục này): (1) `ja161:1.4` "như con voi — người bạn của thần Indra" → "như con voi đã làm với Indasamānagotta": `indasamānagottaṁ` là đối cách (kẻ bị con voi làm điều ác), không có `mitta` nào trong Pāli nên "bạn" là thêm vô căn cứ; `indasamānagotta` nghĩa đen "cùng dòng họ với Indra" (`samāna` + `gotta`) và là tên người — bản Anh Sujato ghi tên bài là "The Unteachable Ascetic Indasamānagotta" (`ja-name:180.ja161`) — nên giữ nguyên tên, không dịch thành danh xưng. "đã làm" chỉ khôi phục động từ lược từ `karoti pāpaṁ` ở 1.3. Tiêu đề `0.4`, `3.1` và `translationTitle` đổi "Người Bạn Của Indra" → "Indasamānagotta" cho khớp (tag `indasamanagotta`). Bất định còn lại: tình tiết cụ thể của truyện (ai là nạn nhân) suy từ tên bài của Sujato và cú pháp, không có chú giải trong tầng đã ghim. (2) `ja161:2.1`–`2.3`: bản cũ "Kẻ mà họ cho là ngang hàng với ta … chính vì thế, xin hãy kết bạn với tôi" sai: `yaṁ jaññā sadiso mamanti` = "người nào mình biết là ngang bằng với mình" (`mama` = "với mình", không phải người nói xin kết bạn); `teneva mettiṁ kayirātha saddhiṁ` = "chính với người ấy nên kết bạn" (`kayirātha` cầu khiến, ngôi ba, không có "tôi"); `cāpi` nối ba mặt (giới, tuệ, học) chứ không phải "dù … hay". Sau sửa: 2.1 "Còn người nào mình biết là ngang bằng với mình," · 2.2 "về giới, về trí tuệ và cả về học vấn," · 2.3 "chính với người ấy nên kết bạn;". 2.4 giữ nguyên (khớp `pv37:44.6`, `ja542:67.4`: "giao du với bậc thiện nhân quả thật là an lạc").

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 13/13 khoá Pāli↔Việt sau hai lượt sửa lan. Không còn lỗi nghĩa ở 1.1, 1.3, 1.4, 2.1–2.4: chủ thể/đối tượng đúng (`kāpurisa`/`anariya` là đối tượng của cấm, `indasamānagottaṁ` đối cách là nạn nhân, `kayirātha` cầu khiến ngôi ba), `-pi` ở 1.3 là "dù… vẫn", `eva` ở 2.3 là "chính". Tiền lệ đã đếm: `kāpurisa` "kẻ xấu" khớp ja162:1.2, ja542:66.4, pv21:31.1, pv51:9.1; `santhava` "thân quen" khớp ja162; tiêu đề 0.2/0.3 khớp toàn phẩm (ja151–ja199 "Bộ Hai Bài Kinh", ja162–ja165 "Phẩm Santhava"). `pajānamatthaṁ`, `sadiso mama`, `mettiṁ kayirātha` không có tiền lệ khác trong toàn tầng Pāli (quét 5 bộ, 0 chỗ ngoài bài). Một sửa rõ nghĩa: 1.2 "bậc cao quý với kẻ không cao quý, người hiểu rõ điều lợi ích;" → "bậc cao quý, người hiểu rõ điều lợi ích, không nên thân với kẻ không cao quý;" — câu cũ là mảnh rời, dễ đọc thành "giữa cao quý và không cao quý"; `ariyo` (cùng phân từ `pajānaṁ`) là chủ ngữ của `kayirā` ở 1.1, nên khôi phục động từ lược như đã làm ở 1.4. Tự kiểm: 13/13 khoá khớp Pāli, thứ tự đúng; nháy khớp Pāli 13/13 khoá; 0 cặp Pāli trùng nội bộ (phép rỗng); không `…`, không số Pāli; NFC. Điểm: semantic_fidelity 8.4 → 8.9 và grammar_logic 8.4 → 9.0 (văn bản hiện hành đã đúng nghĩa sau sửa lan, điểm cũ chấm bản sai); terminology 8.3 → 8.8 (đã đối chiếu tiền lệ bằng số đếm); ambiguity_integrity 8.3 → 8.8 (bất định còn lại ghi rõ dưới đây; trừ điểm vì notes còn chứa phân tích cũ đã bị thay thế); vietnamese_clarity 9.1 → 9.0 và han_viet_balance 9.1 → 9.0 (điểm cũ chấm trên bản có "kẻ tiếc nhân", "hạ chí" là thổi phồng; 1.1 "tạo sự thân quen" vẫn hơi dịch sát chữ, giữ vì đồng bộ danh từ "thân quen" ở ja162); technical_integrity 10.0 → 9.6 (lượt này không chạy technical gate của kho). triangulation giữ 7.0: không có bản Anh hay bản Việt tham khảo, chỉ có tên bài của Sujato. Bất định còn lại: tình tiết truyện (con voi giết vị khổ hạnh Indasamānagotta) suy từ tên bài và cú pháp, không có chú giải trong tầng đã ghim; `atthaṁ` ở 1.2 hiểu là "điều lợi ích", cách đọc "ý nghĩa" cũng khả dĩ nhưng không đổi nghĩa câu cấm. Blocker thiếu tầng English giữ nguyên.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 4 khoá chênh lệch lớn nhất (`0.3`, `0.4`, `1.1`, `1.2`) → khác nghĩa 0: sửa 0, giữ 4 (`1.1`–`1.2`: bản mù cũng đọc `ariyo` là chủ ngữ và `kāpurisena`/`anariyena` là đối tượng của `kayirā`, chỉ khác chữ "kẻ tồi" và "kẻ không phải bậc thánh"; `0.3` "Phẩm Giao Hảo" so với "Phẩm Santhava": cùng nghĩa `santhava`, giữ phiên âm đồng bộ với các bài cùng phẩm; `0.4` "Chuyện Tiền thân Indasamānagotta" so với "Kinh Indasamānagotta": cùng tên riêng, khác cách gọi thể loại; đã đo tầng Jātaka có 501 tiêu đề dạng "Kinh …" và 33 dạng "Chuyện Tiền Thân …"), bất định 0 mới (bất định cũ về tình tiết con voi vẫn còn). Chín khoá còn lại không nằm trong tệp chênh lệch, tức bản mù và bản dự án gần nhau ở đó. Không có bản Anh hay bản Việt độc lập khác.
