      `-aṅgo`, `-jutindharo`), không phải nàng. Bản cũ gán `2.1–2.4` cho một "tòa ngự làm bằng hoa sen" và
      "thân nàng", `3.3` cho "tay cầm lắc vòng hoa", `4.1–4.2` cho "mặc áo vàng, viền đẹp đẽ". Nay:
      `2.1` `Padumi padmapattakkhi` = *có hoa sen, mắt như cánh sen* (tính từ của con voi; `padumī` còn
      xuất hiện làm danh hiệu của voi ở `cnd23` và `snp1.3`, nên KHÔNG phải hapax như mục cũ ghi);
      `2.3` *thân mình rải đầy bột hoa sen*; `2.4` *đeo tràng hoa sen vàng*; `3.1–3.2` đường đi rải
      sen, `3.3–3.4` dáng đi.
    · `1.1` `varāroho` đọc *tầm vóc tuyệt hảo* (`āroha` = chiều cao/vóc dáng, cùng gốc `ārohapariṇāha`
      "chiều cao và chu vi" ở `an3.140`), bỏ *chân trắng* (không có căn cứ); `1.2` `kappano` = *được trang
      hoàng* (không phải "rải đầy"); `1.3` `thāmavā` = *mạnh mẽ* (không phải "hào quang lớn lao"); `1.4`
      `samīhati` = *di chuyển* (không phải "đứng").
    · `4.2` `soṇṇakaṁsā ratissarā` = *những chiếc chuông vàng, âm thanh vui tai* (`kaṁsa` = chuông/chiêng
      đồng, cf. `dhp134` "chuông đã vỡ"); `4.3` `Tesaṁ` = "của chúng" (không phải "của họ"; đo 6/6
      tệp vv dùng *tiếng của chúng nghe được*); `4.4` `tūriye pañcaṅgike yathā` = *như tiếng nhạc năm
      phần* (6/6 tệp khác trùng Pāli đã dùng cách này; bản cũ *trống năm mặt* là lệch và mục "dùng lại
      từ vv38" ở trên nay SAI, vv38 đã đổi).
    · `5.1–5.4`: `khandhamhi` = *trên vai* con voi; `sucivatthā alaṅkatā` mô tả NÀNG (không phải "vững
      chắc"); `mahantaṁ accharāsaṅghaṁ` là TÂN NGỮ của `atirocasi` — nàng *tỏa sáng hơn cả* đoàn tiên nữ
      (`atirocasi` + `vaṇṇena` đã dịch *tỏa sáng vượt trội về dung sắc* ở `vv34:1.4`). Mục cũ nói 4 tiền lệ
      `accharāsaṅgha` → *đoàn tiên nữ* là SAI: các lượt ấy là `accharāsaṅghāta` = búng ngón tay.
    · `6.3` `añjalikamma` = *việc chắp tay hành lễ* (không phải "nghiệp cúi chắp tay"); `6.4` bỏ *tôi hỏi*
      (`pucchitā` là phân từ "khi được hỏi").
    · `7.2` bỏ *truy hỏi* → *được Tôn giả Moggallāna hỏi* (16/18 tệp); `7.3–7.4` theo công thức đã chốt ở
      `vv10`, `vv13`, `vv14`: `yassa kammassidaṁ phalaṁ` = *về nghiệp mà đây là quả báo* (30 lượt, so với
      28 lượt *quả báo của nghiệp này là thế*; chọn mệnh đề quan hệ theo đúng cú pháp).
    · `8.2` `sataṁ` = *có niệm* (tân ngữ giống đực của `sata`), không phải *bền bỉ*; `8.4` `dussasanthataṁ` =
      *được trải vải*.
    · `9.1–9.4` đọc lại: `abbhokirissaṁ` là ĐỘNG TỪ NGÔI MỘT (nàng tự rải), tân ngữ `upaḍḍhaṁ padmamālaṁ`,
      công cụ `pattehi`; bản cũ đọc thành bị động nên mất chủ thể. `9.4` dùng đúng công thức *với tâm tịnh
      tín bằng chính đôi tay mình* (đo hơn chục tệp cùng Pāli).
    · `11.1–11.4`: `santānaṁ` là tính từ bổ nghĩa `sammāvimuttānaṁ`/`brahmacārinaṁ` (*an tịnh*, đúng
      như `sn1.10:2.2`), KHÔNG phải "dòng người"; `dajjā` và `nande` là thức cầu khiến ngôi ba ("người ấy
      sẽ hoan hỷ"), không phải mệnh lệnh *hãy hân hoan*.
    · `12.4` `sarīrantimadhārinaṁ` = *những vị mang thân cuối cùng* — bản cũ có chữ "đã mòn mỏi" không
      có trong Pāli; đã bỏ.
    · `10.1–10.4`: chỉnh `kammakusalassa` thành *của nghiệp thiện ấy* (sở hữu cách) và `apacitā` = *được chư
      thiên cung kính* (nữ thiên là người được kính, không phải người kính).
