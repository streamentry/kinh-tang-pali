      đọc là `an-ugghātī` (không xóc nảy / không chao đảo). Hình thái hiếm, chưa có tiền lệ nào trong tầng; nghĩa
      của trạng ngữ chỉ ảnh hưởng mô tả dáng đi, không ảnh hưởng giáo nghĩa.
