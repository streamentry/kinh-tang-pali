    · `13.1` `Kuñjaravimānaṁ pañcamaṁ.` → *thứ năm*. Phép tính: `pañcama` = 1+2+3+4+5 = 5.
    · `4.4` `tūriye pañcaṅgike yathā.` → *trống năm mặt*. `pañca` = 5; đây là "trống chia
      năm mặt", và tôi dùng lại nguyên văn tiền lệ ở `vv38`.
    · `9.1` `Upaḍḍhaṁ padmamālāhaṁ,` → *Nửa vòng hoa sen*. `upaḍḍha` = nửa (1 phần 2).
    · `8.2` `sataṁ` — KHÔNG phải số. Cùng `jhāyiṁ jhānarataṁ` (bậc thiền giả, vui trong
      thiền) thì `sataṁ` là tính từ *bền bỉ*, không phải *một trăm*; dịch *một trăm* ở đây
      sẽ vô nghĩa. Đây là chỗ duy nhất trong bài có hình dạng giống số mà không phải số.
    Bài không có `sahassa`, `koṭi`, `sata` (nghĩa trăm) hay bất kỳ thang số nào khác; cũng
    không gặp cụm `Tiṁsakappasahassa` (chưa phân xử được ở `BRIEF_VI4`).

