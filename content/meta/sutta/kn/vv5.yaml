  BẤT ĐỊNH (đã ghi ở đây, KHÔNG đưa vào thân kinh, KHÔNG bịa thêm):
    (1) `2.1` `Padumi padmapattakkhi,` — `Padumi` là HAPAX của toàn bộ tầng Pāli root đã ghim
      (5.764 tệp, chỉ đúng một lượt, đúng chỗ này) và `pattakkhi` cũng chỉ xuất hiện ở đây.
      Tôi đọc `Padumi` như một biến thể của `padmi` (của hoa sen) vì bốn vế `2.1–2.4` đều
      nói về hoa sen (`padma`, `padmuppala`, `padmacuṇṇā`) và vì vậy dịch *Tòa ngự làm bằng
      hoa sen*. Đây là **phỏng đoán có lý do**, không phải chứng cứ; người biên tập nên
      đọc lại. Tôi KHÔNG ghi kèm nghĩa nào cho `pattakkhi` vào thân kinh.
    (2) `9.3` `Abbhokirissaṁ pattehi,` — `abhi-okiri` là HAPAX; dạng `-issa-` có thể là
      chủ động-trung hoặc bị động. Vế trước `8.3` là `Adāsiṁ` (ngôi một, tôi đã cho), nên tôi
      chọn **bị động** — *được rải lá xuống* — để câu 8–9 liền một mạch. Nếu đọc chủ động
      thì phải là *nàng đã rải lá quanh chỗ ngồi*, mất dấu ngôi một ở `8.3`. Vế `9.4` giữ
      làm tân ngữ *bằng đôi tay tịnh tín*.
    (3) `2.4` `soṇṇapokkharamāladhā.` — `soṇṇapokkhara` là HAPAX. `pokkhara` có nghĩa *hoa
      sen* đã chứng cứ ở nơi khác (`pokkharasāti` = bậc sinh ra từ hoa sen, xuất hiện ở
      `dn3`, `dn13`, `dn32`), nên tôi dịch *có vòng hoa sen vàng*. Cách đọc còn lại là *bụi
      vàng rơi xuống* (`pokkhara` = một đám rắc); tôi chọn theo chủ đề hoa sen của cả khối.
    (4) `4.1` `Tassa pakkamamānassa,` — `pakkaṃamāna` không có tiền lệ nào trong tầng (0
      khoá). `pakkaṃ` nghĩa là *đi theo / đi cạnh*, và vế sau (`4.3` `Tesaṁ suyyati
      nigghoso`) xài `Tesaṁ` (số nhiều) nên tiếng vang là của con voi **và** đoàn tuỳ tùng;
      tôi dịch *Khi nó đi phía sau,* và không bịa thêm chi tiết nào.
    (5) `11.2` `santānaṁ brahmacārinaṁ;` — cú pháp có hai khả năng: (a) `santānaṁ` là chủ
      từ, `brahmacārinaṁ` là cách sở hữu (tôi chọn cách này: *và dòng người sống đời phạm
      hạnh*); (b) cả hai là cách sở hữu của `āsanaṁ`. Bối cảnh `10.4` `devānaṁ apacitā`
      (ngôi một) và `11.4` `evaṁ nande yathā ahaṁ` khiến (a) khớp hơn.
    (6) `6.1–6.3` — cả ba vế đều là cách sở hữu với `te` riêng ở hai vế đầu; tôi lặp *của
      nàng* hai lần (6.1 và 6.2) vì Pāli lặp `te`, nhưng không lặp ở `6.3` vì `añjalikammassa`
      không mang `te`. `6.3` có 3 Pāli trùng tuyệt đối trong `vv5`, `vv64`, `vv78`, `vv81`
      nhưng ba bài kia chưa dịch ở tầng này, nên đây là lần đầu có bản Việt cho cụm này.

