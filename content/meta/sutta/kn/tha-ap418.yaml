notes: |-
  Dịch từ Pāli root của tha-ap418 (74 khoá, thứ tự khoá như Pāli); không có bản Anh Sujato, không có bản Việt hiện hành, không có lớp lấp english-project. Mọi lựa chọn dựa vào Pāli, ngữ cảnh bài và tiền lệ đếm được trong tầng Việt của dự án (467 tệp tha-ap).
  Tên bài (:0.3): Pāli không bắt đầu bằng số nên bản Việt không có số thứ tự (chính sách đo trên 374 tệp: giữ số khi và chỉ khi Pāli có số). translationTitle bằng đúng giá trị khoá :0.3. Kiểu tên: Ký Sự Về Trưởng Lão X. Đo hai phạm vi cho hai đa số khác nhau: trong phẩm Bhaddāli (416, 417, 419, 421, 422) có Ký Sự 3, Tuyên Ngôn 1, 1 tệp còn để nguyên Pāli; ±20 bài quanh 418 có Ký Sự 8, Tuyên Ngôn 5, Tuyên Ngợ 5; toàn tầng có Tuyên Ngợ (chính tả sai) 237, Tuyên Ngôn 112, Tuyên Ngợi 10, Ký Sự 99. Chọn Ký Sự theo phạm vi gần nhất và theo tha-ap416, 417, 419 cùng phẩm; toàn tầng nghiêng về Tuyên Ngôn (kể cả hai cách viết sai chính tả), tức hai phạm vi phân kỳ, để người biên tập phán một lượt cho cả cuốn. Tên riêng Ekadīpiya giữ dạng Pāli như tha-ap179 (cùng Pāli, cùng tên); khoá :5.2 giữ Ekadīpī theo Pāli của khoá (eka một, dīpa đèn); không dịch tên thành Cúng Dường Một Ngọn Đèn vì không có chứng cứ cho cách đọc riêng và tha-ap179 đã giữ Pāli.
  Số Pāli: Sattasattatikkhattuñca = 7 + 70 = 77 lần (khớp Sattasattatikappamhi = bảy mươi bảy kiếp trong tầng); Ekatiṁsatikkhattuñca = 1 + 30 = 31 lần (tiṁsa = 30: Tiṁsatikkhattuṁ = ba mươi lần, Catutiṁsa = 34, Sattatiṁsa = 37 trong tầng; đo theo tầng, không có bản Anh độc lập để đối chiếu nên ghi là bất định mức tầng); Aṭṭhavīsatikkhattuñca = 8 + 20 = 28 lần (tiền lệ hai mươi tám); Catunnavutito = 4 + 90 = 94 kiếp (109 khoá tầng); yojanasataṁ = một trăm do-tuần; Dīpasatasahassāni (số nhiều) = hàng trăm ngàn ngọn đèn (tiền lệ Kaññāsatasahassāni, Vasīsatasahassehi); Jātiyā catuvassohaṁ = bốn tuổi; Aḍḍhamāse = nửa tháng.
  Dùng lại nguyên văn tiền lệ: trong 74 khoá có 40 khoá Pāli trùng với một khoá khác của tầng; 32 khoá dùng lại đúng chữ (không kể hoa thường), 8 khoá khác (đều có lý do: đổi ngôi tôi thành ta, chọn dạng gần Pāli hơn, hoặc khoá tên bài). Trong bài có 11 cặp Pāli trùng nguyên văn (1.2/2.2; 7.1/13.1; 12.4/13.4/14.4/15.4; 16.2/17.2/18.2), 0 cặp mà bản Việt khác.
  Ngôi kể: dùng ta xuyên suốt bài. Công thức Kilesā jhāpitā (ta 89, tôi 35 toàn tầng; ±20 bài ta 16, tôi 3), Svāgataṁ vata me āsi (ta 88, tôi 31; ±20 ta 16, tôi 3), viharāmi anāsavo (ta 92, tôi 37; ±20 ta 18, tôi 3), Duggatiṁ nābhijānāmi (ta 203, tôi 183). Lời kết 19.1 giữ nhóm 407 khoá: Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (số nhiều, đúng imā gāthāyo).
  Duggatiṁ nābhijānāmi: toàn tầng có đọa xứ 198, khổ đau 143, khổ xứ 51, khác 4; chọn đọa xứ theo đa số và theo tha-ap417, 419 gần nhất. Dạng khổ đau mình rơi vào là diễn giải thêm ngoài Pāli nên không dùng.
  Giữ tiền lệ dù chưa đẹp: Devalokā cavitvāna = Rơi khỏi cõi trời (4 trên 4); devaloke ramiṁ ahaṁ = hưởng thọ ở cõi trời (4 trên 4); devarajjamakārayiṁ = làm ra vương quyền nơi chư thiên (nhóm lớn nhất); Padesarajjaṁ vipulaṁ = Vương quốc rộng lớn ấy (10 trên 12; chữ ấy không có trong Pāli, dạng còn lại là Vương quyền cai quản các vùng đất rộng lớn, 2 trên 12); gaṇanāto asaṅkhiyaṁ = đếm không hết, vô tận (5 trên 5). Dibbacakkhuṁ visodhesiṁ dịch Ta đã làm thanh tịnh thiên nhãn (thiên nhãn là cách dịch tầng dùng, 3 khoá).
  Khác tiền lệ một khoá duy nhất: 7.2 samatiggayha pabbataṁ dịch vượt qua ngọn núi (tiền lệ một khoá đâm xuyên qua tảng núi thêm sắc thái mạnh không có trong Pāli); 10.3 Mātukucchigatassāpi dịch Dù khi đã ở trong bụng mẹ (tiền lệ một khoá thêm chữ mới); 8.1 dùng Và bảy mươi bảy lần để song song với 9.1 (tiền lệ một khoá thêm chữ nữa).
  Bất định: (1) 2.1 Āropite ca citake: hai danh từ cùng ở vị trí địa cách; đọc Đức Siddhattha là đối tượng được đặt lên giàn hỏa thiêu (khoá 2.2 cung chủ thể), khớp tiền lệ một khoá; (2) 2.4 pūjenti: động từ ngôi thứ ba số nhiều nên bản Việt thêm họ để khỏi hiểu nhầm chủ thể là Đức Siddhattha; (3) 3.4 dīpaṁ me tāva ujjali: tāva đối ứng với yāva ở 3.3, dịch suốt chừng ấy thời gian; (4) 5.2 ekadīpīti ñāyati: chủ ngữ ngữ pháp là byamhaṁ (thiên cung), dịch được biết với tên Ekadīpī; (5) 11.1 Jātiyā catuvassohaṁ và 11.3 Aḍḍhamāse asampatte: Pāli không nêu mốc bắt đầu của nửa tháng; bản Việt không thêm kể từ khi xuất gia; (6) 11.4 arahattamapāpuṇiṁ dịch đạt tới bậc A-la-hán theo tiền lệ; (7) 14.2 và 14.3 andhakāra dịch bóng tối, timira dịch cảnh tăm tối: hai từ gần nghĩa, tầng chưa có tiền lệ rõ cho timira đứng riêng; (8) 6.3 Sappabhāhi sarīrassa dịch Nhờ những tia sáng của thân.
  Dấu lược: Pāli có …pe… ở 16.2, 17.2, 18.2, bản Việt giữ đúng một dấu lược mỗi khoá; không có dấu lược trần ngoài các khoá này. Nháy kép mở ở 1.1 và đóng ở 18.3, khớp Pāli từng khoá, không có nháy đơn.
  Kiểm tự động trong phạm vi lát: đủ 74 khoá, thứ tự như Pāli, không rỗng, NFC, cân bằng dấu lược so với Pāli mỗi khoá. Coverage English: mẫu số 1, Sujato phủ 0.
