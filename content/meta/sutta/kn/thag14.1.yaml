notes: |-
  Phạm vi: đủ 61/61 khoá của bài (4 khoá `:0` tiêu đề, 56 khoá kệ `1.1`–`14.4`, 1 khoá bìa `14.5`), không khoá nào ngoài bài. Thứ tự khoá bản Việt bằng thứ tự Pāli. Bài là đơn vị nguyên tử, không phải lát dở. Đã đọc đối chiếu cả 61 cặp Pāli↔Việt, không đọc mẫu.

  ⚠️ MẪU SỐ COVERAGE THEO CỔNG = 0 — CỔNG NÀY KHÔNG ĐO ĐƯỢC GÌ. `source/layers.yaml` đặt `substantivePaliMinChars: 40` và bỏ khối `:0`. Bài có 57 khoá thân nhưng khoá Pāli dài nhất chỉ 30 ký tự ⇒ 0/57 đạt ngưỡng (do cấu trúc Theragāthā: mỗi pāda một khoá). Đây là "không đo được gì", không phải "không cần ghi nhận gap", và tôi không dùng nó làm căn cứ publish. Quy tắc kho đặt ratio = 1 khi mẫu số bằng không; đó là quy tắc của kho, không phải bằng chứng đối chiếu.

  COVERAGE ENGLISH THÔ (do người biên tập tự phán) — tra tầng đã ghim, không suy từ tên thư mục. `english-sujato` có tệp cho bài này, cùng 61 khoá ID với Pāli (tập khoá bằng nhau). Trên 57 khoá thân (bỏ `:0`), Sujato có prose ở 56/57 = 0,98; khoá trống duy nhất là `14.5` (dòng bìa `… Khadiravaniyarevato thero ….`). Trên mọi 61 khoá: 60/61. `english-project`: không có tệp cho bài này (không cần lấp). `vietnamese-current`: vắng tại commit đã ghim (bilara chỉ có Pháp Cú), đặc điểm của cả tầng ở `thag`. Bản Việt nguyên bài của sc-data chỉ dùng tra cứu toàn văn, không căn lề theo khoá. Không có entry trong `reference-gaps.yaml`; mẫu số bằng 0 nên không có gì để ghi nhận ở cổng.

  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli ở bài này (không lệch như một số bài thag khác), nên đối chiếu được ở mức khoá. Ở khối `11`, Pāli cắt ngắn `… pe` (`11.2`) và `…` (`11.3`) rồi mới tới `11.4`; Sujato bung phần lược thành văn đầy đủ (`I don't long for life`, `I await my time`). Bản Việt KHÔNG bung: giữ đúng một `…` ở mỗi khoá, theo tiền lệ `thag7.1:6.2/6.3/7.2/7.3` (`… pe` → `…`, `…` → `…`) và `thag5.3` (`… pe …` → `…`). Đo trên `thag` đã dịch: 9 khoá Pāli dạng `… pe`/`…`/`… pe …` đều dịch `…`.

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 61 = Pāli 61, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
    2. Nháy đơn và kép khớp Pāli từng khoá: 0/61 lệch. Tổng: `“` 1/1, `”` 1/1, `‘` 1/1, `’` 1/1. Lời kệ mở nháy kép ở `1.1`, đóng ở `14.4`; lời tự thoại mở nháy đơn ở `2.1`, đóng ở `2.2`.
    3. Pāli trùng nguyên văn TRONG CHÍNH bài: 2 nhóm (`1.2` = `13.2`, `agārasmānagāriyaṁ`; `10.1` = `11.1`, `Nābhinandāmi maraṇaṁ`); cả hai dịch giống hệt ⇒ 0 nhóm lệch. Pāli trùng ở bài khác (bỏ qua khác biệt dấu câu): 12 cặp trên 3 nhóm khoá (`5.1` 10 cặp ở `mn131`–`mn134`, dịch giống hệt; `12.4` 2 cặp). Có 1/12 cặp bản Việt khác: `12.4` `bhavanetti samūhatā` — `dn16:2.3.8` dịch sợi dây dẫn đến hữu đã được nhổ bỏ, còn `mn86:18.46` dịch dây trói hữu đã bị đoạn tận. Tôi theo `dn16:2.3.8` vì cách dịch bhavanetti là dây dẫn đến hữu chiếm đa số (`dn1` 2 khoá, `dn16` 3 khoá, `mn116` 2 khoá); `mn86:18.46` là ngoại lệ duy nhất trong tầng.
    4. Dấu lược: Pāli có `…` ở 3 khoá (`11.2`, `11.3`, `14.5`), Việt có đúng 3 khoá đó; `…pe…` đầy đủ 0; `(…)` trần 0 ở Pāli nên 0 ở Việt. Lỗi = 0/61. Khoá bìa `14.5` giữ hai dấu lược `… Trưởng lão Khadiravaniya Revata ….`, kết `….` không khoảng trắng trước, theo khuôn phạm vi gần `thag` (194/227 dòng bìa `… X thero ….`).
    5. Số Pāli: chỉ có một con số trong cả bài, `Cuddasaka` (nhóm tiêu đề `0.2`) = `catu` 4 + `dasa` 10 = 14 ⇒ Bộ Mười Bốn Bài Kinh, khớp với số thứ tự `14.1` của uid. Không có số nào khác trong thân kệ.
  Vệ sinh: JSON hợp lệ, 61/61 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa, 0 khoá Pāli lọt sang Việt (khoá `0.1` chứa `Theragāthā` là tên bộ giữ nguyên theo mọi bài thag đã dịch).

  THUẬT NGỮ — THEO TIỀN LỆ ĐO ĐƯỢC.
    · `nābhijānāmi` → ta không nhớ (có); `abhijānāmi` → ta nhớ (có). Tiền lệ: `mn136:5.2`, `mn86:15.2/15.6` dịch nābhijānāmi là không nhớ; `dn16:3.22.1` dịch abhijānāmi là Ta nhớ. Cách này giữ được thế đối lập giữa `1.3`–`2.3` (không nhớ có tư duy ác) và `3.1` (nhớ có tâm từ) mà Sujato diễn tả bằng aware of.
    · `saṅkappa` → tư duy (`dn34:2.1.32` chánh tư duy, `dn34:2.3.91` dục tư duy); `anariya` → không thuộc bậc Thánh (`mn139:3.1`); `dosa` → sân hận.
    · `paricita` → được làm cho quen thuộc (`dn34:1.7.36`). `sabbabhūtānukampako` → thương tưởng mọi chúng sinh (`dn32:3.5`, `dn32:12.18`). `akāpurisasevita` → không được kẻ hạ liệt thực hành (`dn34:1.6.72`). `avitakka` → không tầm; `tuṇhībhāva` → im lặng; `sampajāno patissato` → tỉnh giác, có niệm (`dn16:2.12.5`).
    · `na vedhati` → không dao động (`dn31:34.14`). `anaṅgaṇa` → không uế nhiễm (`dn10:2.21.1`). `paccanta` → biên địa (`dn28:2.3`, `dn16:1.17.3`). `satthā` → Đạo Sư (125 khoá, so Thầy 99). `saṁyojana` → kiết sử (49 khoá, so triền 8). `kataṁ buddhassa sāsanaṁ` → đã làm tròn lời dạy của Đức Phật, theo `thag7.1:7.4`. `Sampādethappamādena` → Hãy nỗ lực thành tựu, chớ phóng dật, theo `dn16:3.51.4` (cùng cấu tạo `appamādena sampādetha`, đảo thứ tự). `anusāsanī` → lời giáo huấn (`dn16:2.12.3`).
    · `parinibbissaṁ` → nhập Niết-bàn. Trên tầng, `parinibbāyati` và các dạng gần có 93 khoá: diệt độ 54 (phần lớn nói về Đức Phật), Niết-bàn 31, nhập Niết-bàn 16. Đây là lời Trưởng lão tự nói về mình, nên chọn nhập Niết-bàn thay vì diệt độ.
    · `brahmavihāra` → phạm trú (`dn17:2.13.8`). Tầng có 5 khoá: Phạm trú 1 (`dn17:2.13.8`), vô lượng tâm 4 (đều ở `mn83`, cùng một công thức, nơi nó dịch cả cụm bốn phạm trú). Ở đây Pāli là số ít, một phạm trú, nên tôi giữ phạm trú để không làm phẳng thành bốn vô lượng tâm.
    · `Cuddasakanipāta` → Bộ Mười Bốn Bài Kinh. Đo trên `thag` đã dịch: khuôn Bộ N Bài Kinh chiếm 120/240 cho Ekanipāta, 49/240 cho Dukanipāta; ở các quyển 10, 11, 12 (phạm vi gần nhất) toàn khuôn Bài Kinh. `Paṭhamavagga` → Phẩm Thứ Nhất (79 khoá). `:0.4` theo khuôn Kinh Kệ Của Trưởng Lão X (190 khoá). Tên: `thag1.42` có tiêu đề Pāli `Khadiravaniyattheragāthā` và đã dịch là Khadiravaniya; bài này có tiêu đề Pāli `Khadiravaniyarevatattheragāthā`, nên giữ cả hai thành phần của hợp từ thành Khadiravaniya Revata, và không đồng nhất hai bài với nhau trong bản dịch.

  KHÁC BIỆT ĐÃ PHÂN XỬ (đối chiếu Sujato).
    (1) `6.1`–`6.4`: Sujato đặt thành một câu Khi … thì vị ấy được ban cho sự im lặng cao quý; bản Việt giữ thứ tự Pāli (`avitakkaṁ samāpanno`, `sammāsambuddhasāvako`, `ariyena tuṇhībhāvena`, `upeto hoti tāvade`) và dịch `upeto` là được thành tựu, `tāvade` là ngay khi ấy.
    (2) `8.1`–`8.4`: `anaṅgaṇassa posassa` là sở hữu cách (với người không uế nhiễm); Sujato viết To the man who has not a blemish. Bản Việt giữ không thêm điều kiện nào ngoài Pāli, và `abbhamattaṁva khāyati` dịch dường như lớn bằng đám mây; Sujato dịch stormcloud, còn Pāli chỉ nói `abbha` (đám mây).
    (3) `10.4`: `nibbisaṁ bhatako yathā` là hai danh từ, động từ lấy từ `10.3` (`paṭikaṅkhāmi`); Việt viết như người làm thuê chờ tiền công, chữ chờ là động từ của `10.3` được lặp lại do tỉnh lược.
    (4) `14.4`: Pāli `vippamuttomhi sabbadhī` kết bằng `”ti` đóng lời kệ; Việt đóng nháy kép ở đúng khoá này.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `14.4` `sabbadhi` → khắp mọi nơi. `sabbadhi` mang cả nghĩa mọi nơi lẫn mọi phương diện; Sujato đọc in every way, bản Việt đọc khắp mọi nơi. Tầng chỉ có `dn25:17.2`, `dn33:1.11.52` dùng `sabbadhi` trong công thức lan tỏa tâm từ ("khắp mọi nơi"), nên theo nghĩa không gian. Chưa phân xử trọn vẹn; đổi sang mọi phương diện chỉ sửa một khoá.
    · `9.4` `khaṇo` → thời cơ. `khaṇa` là khoảnh khắc thuận lợi để thực hành (tầng có `akkhaṇa` dịch lúc không thuận ở `dn34:2.1.125`); Sujato dịch the moment. Việt chọn thời cơ vì hàm ý thuận lợi ấy. Chưa có tiền lệ trực tiếp cho dạng dương `khaṇo` ở tầng để đối chiếu.
    · `6.1` `avitakkaṁ samāpanno`: avitakka ở đây là danh từ/trạng thái (nhập không tầm); tôi dịch đã nhập trạng thái không tầm. Chữ trạng thái là cách đọc cấu trúc, không có chữ tương ứng trong Pāli. Cách đọc gần hơn (đã nhập vào không tầm) cho cùng nghĩa.
    · `3.3` `Anupubbaṁ paricitaṁ`: `anupubbaṁ` là trạng từ (dần dần, tuần tự) bổ nghĩa cho `paricitaṁ`; Sujato gradually consolidated. Việt theo tiền lệ `paricita` → làm cho quen thuộc, nên không dùng củng cố.
    · `5.2` `cittaṁ āmodayāmahaṁ`: `5.1` là tính từ cấu thành một cụm với `cittaṁ` (Không lung lay, không dao động). Việt giữ cụm ở `5.1` đúng nguyên văn tầng (10/10 khoá Pāli trùng ở `mn131`–`mn134` dịch như vậy), nên cụm từ đứng riêng một dòng trước câu chứa chủ ngữ, theo thứ tự Pāli.

  VÌ SAO published, VÀ BIÊN ĐỘ. Không có blocker: 61/61 khoá, 0 thừa, 0 thiếu, nháy và dấu lược khớp Pāli từng khoá, 0 số sai (không có số nào trong thân kệ), không phát hiện lỗi chủ thể/đảo vai (đã soi riêng `2.1`–`2.2`, `10.3`–`10.4`, `13.1`–`13.4`). Tầng Anh phủ 56/57 khoá thân và khớp ranh giới khoá, không phải tầng đã vỡ. Trung bình 9,23 > 9,0 ⇒ published. Biên độ 0,23 trên ngưỡng; các điểm dưới 9,0 là chỗ người biên tập nên soi trước nếu muốn hạ về review: `triangulation: 8.6` (không có tầng Việt hiện hành phân đoạn; Sujato là tầng độc lập duy nhất, và không có bản nào khác phân xử các bất định `sabbadhi`, `khaṇo`), `ambiguity_integrity: 8.9` (hai bất định chưa phân xử trọn vẹn nêu trên).

