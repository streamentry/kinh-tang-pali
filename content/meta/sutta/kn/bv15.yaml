notes: |-
  Đợt 19, làn 79. Dịch từ Pāli root commit đã ghim, đủ 110/110 khoá (110 khoá mới; tệp bản dịch chưa có từ trước), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ mười ba của Buddhavaṃsa, về Đức Phật Piyadassī: ba lần chứng ngộ gắn với Sudassana, kỳ đại hội chúng và con voi Doṇamukha, ba kỳ hội chúng, tiền thân Bà-la-môn Kassapa xây tịnh xá và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, hào quang, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn các bv đã dịch (8/8 tiền lệ).
  - `0.2` “15. Dòng Kế Thừa Của Đức Phật Piyadassī”: cùng khuôn với `bv16:0.2`, `bv17:0.2`, `bv18:0.2`, `bv20:0.2`; `vaṁso` ở `28.1` cũng là “Dòng kế thừa”.

  **Số Pāli, đã tự tính.** `tayo` 3 (3.2 ba lần chứng ngộ khớp ba khoá `3.4`, `5.4`, `6.4` = thứ nhất, thứ hai, thứ ba; 7.1 ba kỳ hội chúng khớp `7.4` thứ nhất, `8.1`–`8.2` kỳ thứ hai, `8.3` kỳ thứ ba; 16.4 ba lâu đài khớp ba tên ở 16.3). `koṭisatasahassa` = 100 × 1.000 koṭi = **một trăm ngàn koṭi** (3.3, 7.3, 10.3; cùng cách tính `bv16:3.3`, `bv17:2.3`). `navutikoṭisahassa` = 90 × 1.000 = **chín mươi ngàn koṭi** (5.3). `asītikoṭisahassa` = 80 × 1.000 = **tám mươi ngàn koṭi** (6.3; cùng cách `bv24:3.3` “bốn mươi ngàn koṭi” cho `cattārīsakoṭisahassa`). `navutikoṭī` = **chín mươi koṭi** (8.1, không có `sahassa`; `bv17:3.3` “chín mươi koṭi”), `asītikoṭiyo` = **tám mươi koṭi** (8.4; `bv17:4.3`). `navavassasahassa` = 9 × 1.000 = **chín ngàn năm** (16.1, đúng nguyên văn `bv20:15.1`). `tettiṁsa` 33, nhân 1.000 = **33.000** (17.1). `caturo` 4 (18.1). `cha` = 6, `māsa` tháng: **sáu tháng** (18.3). `asīti` **80** hattha (23.3). `navutivassasahassa` = 90 × 1.000 = **chín mươi ngàn năm** (25.3, đúng nguyên văn `bv20:23.1`). `aṭṭhārase kappasate` = 18 trăm = **1.800 kiếp** (12.3, 12.4; cùng giá trị `bv16:11.3`, `bv17:10.3`). `pañca sīle` 5 (11.3). `dasapāramī` 10 (14.4). `tiṇṇaṁ vedāna` 3 (9.4). `dvattiṁsa` **32** tướng (23.2). `tīṇi yojana` **3** do-tuần (27.4). `terasamo` **13** (28.1; đúng thứ tự: `bv16` là `cuddasamo` = 14, `bv17` mười lăm, `bv18` mười sáu). Thang lớn nhân cả số đã tích lũy, không nhân riêng chữ số đứng trước. Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã có (kể cả `bv24` mới dịch; so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 52 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 1.105 cặp, trong đó 42 cặp có Việt khác bản tôi viết (19 cặp là `12.3` dạng “trước”; xem dưới); 46 khoá dùng đúng nguyên văn một tiền lệ và 1 khoá chỉ khác dấu câu cuối. Năm khoá có Pāli trùng nhưng tôi chủ ý viết khác (1 khoá khác đa số tiền lệ, 4 khoá khác tiền lệ duy nhất):
  - `1.2` `sayambhū lokanāyako`: tiền lệ duy nhất `tha-ap490:1.2` “bậc Tự Tại, bậc Dẫn Đạo Thế Gian;”; tôi thêm “có” (cùng khuôn `bv18:1.2`, `bv24:1.2`) và viết “thế gian” thường như `bv24:3.2`.
  - `10.1` `Tassa dhammaṁ suṇitvāna`: hai tiền lệ khác nhau (`tha-ap433:7.3` “Nghe pháp của Ngài,”, `thig6.2:5.1` “Sau khi nghe Chánh pháp của Ngài,”); chọn “Sau khi nghe Pháp của Ngài,” (cùng khuôn “Sau khi nghe” của `bv16:13.1`; “Pháp” viết hoa như “thuyết giảng Pháp”).
  - `19.2` `piyadassī mahāmuni`: tiền lệ duy nhất `tha-ap312:2.2` “bậc Đại Mâu-ni ưa nhìn thấy:” là cách đọc `piyadassī` như tính từ; ở đây `piyadassī` là tên Đức Phật (như `bv15:1.4`, `tha-ap22:11.1`), nên dịch “Piyadassī, bậc Đại Mâu-ni;” theo `bv16:11.2`.
  - `24.4` `asamassa mahesino`: tiền lệ duy nhất `tha-ap491:7.2` “của bậc Đại Ẩn Sĩ vô song,”; ở đây là đồng vị với `tassa` (24.3), bỏ “của” để không lặp.
  - `25.1` `Tassāpi devadevassa`: tiền lệ `bv17:5.1` “Cũng nơi vị ấy, bậc Thiên Trung Thiên,” gắn với động từ “đã có ba kỳ hội chúng” (chỉ nơi); ở đây sở hữu của `āyu` (25.2), nên “Cũng của vị ấy, bậc Thiên Trung Thiên,”.
  - `12.3` `Aṭṭhārase kappasate` **cố ý khác** 19 trên 21 tiền lệ. Tiền lệ đa số là người kể nhìn ngược về quá khứ (“Vào một ngàn tám trăm kiếp trước,” 12 khoá; “Từ …” 3; “… đại kiếp trước,” 2; “Một …” 1; “Trong một ngàn tám trăm kiếp,” 1). Ở `12.3`–`12.4` là lời thọ ký tương lai (`bhavissati`), nên hướng đếm ngược lại: dùng đúng `bv16:11.3`, `bv17:10.3` “‘Sau một ngàn tám trăm kiếp nữa,” (2/21 cặp khớp). Pāli ở `12.3` không có chữ chỉ hướng, hướng lấy từ động từ ở `12.4`.
  - `13.2` `…pe…` → đúng một `…` (878 trên 878 cặp Pāli `…pe…` đã dịch là một `…`).
  - Dùng đúng nguyên văn một tiền lệ: 46 khoá — `0.1`, `2.2`, `3.1`–`3.4`, `5.4`, `6.4`, `7.1`, `7.3`, `7.4`, `9.1`, `9.3`, `9.4`, `11.2`, `12.1`, `12.3`, `12.4`, `13.1`–`13.3`, `14.1`–`14.4`, `16.1`, `16.2`, `16.4`, `17.2`, `18.1`–`18.4`, `19.1`, `19.3`, `20.2`, `21.2`, `21.3`, `22.2`, `22.4`, `25.3`, `25.4`, `26.1`, `26.3`, `26.4`, `27.4`. `18.2` là `bv24:18.2`, `18.3` là `bv20:17.3`, `26.3`–`26.4` là `bv24:26.3`–`26.4`.
  - Trùng trong chính bài (Pāli sau khi bỏ dấu câu và chữ hoa): 3 nhóm — `2.1`/`23.1` (`Sopi buddho amitayaso`), `3.3`/`7.3` (`Koṭisatasahassānaṁ`), `15.4`/`20.4` (`piyadassissa satthuno`). Bản Việt trong từng nhóm giống hệt nhau ⇒ 0 cặp lệch.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá, đếm số khoá).
  - `sayambhū` → “bậc Tự Tại” (3 khoá `tha-ap` “bậc tự tại”; “Bậc Tự Chứng” 1, “Tự Thắng” 1 ở `mil`). `lokanāyaka` → “bậc Dẫn Đạo thế gian” (`bv24:3.2`, `tha-ap490:1.2`; khác `lokanātha` “bậc Lãnh Đạo thế gian” ở `bv16:3.1`). `narasārathi` → “bậc Điều Ngự Trượng Phu” (2 trên 3 tiền lệ; “Chủ Xế Loài Người” 1). `mahesi` → “Đại Ẩn Sĩ”, `mahāmuni` → “Đại Mâu-ni”, `munivaro` → “bậc Mâu-ni cao quý” (`bv18:24.1`), `mahāvīra` → “Đại Anh Hùng”, `cakkhumā` → “bậc có mắt”, `devadeva` → “Thiên Trung Thiên”, `jina` → “bậc Chiến Thắng”.
  - `abhisamaya` → “chứng ngộ”, `sannipāta` → “kỳ hội chúng”, `samāgama` → “cuộc tụ hội”: cùng `bv16`, `bv17`, `bv18`, `bv20`. Điểm yếu nhất về thuật ngữ vẫn là `abhisamaya` (trên 129 khoá chứa `abhisamay-`: “thông đạt” 22, “chứng ngộ” 17, “giác ngộ” 10; chọn “chứng ngộ” như các bv đã dịch vì `abhisamaya` ở đây đếm theo số người của từng kỳ hội).
  - `ajjhāyaka mantadhara` → “Người tụng đọc, người thuộc lòng những bài tụng,” (3 trên 6 khoá; “Vị thầy tụng đọc, vị thầy thuộc điều đã ghi nhớ” 2, “thuộc lòng thần chú” 1). `tiṇṇaṁ vedāna pāragū` → “là bậc thành thạo ba Vệ Đà.” (`tha-ap128:2.4`, `tha-ap340:1.4`; “Veda” 3, “Vệ-đà” 1, “vượt qua ba thọ” 2 là cách hiểu `veda` = thọ, không hợp ngữ cảnh Bà-la-môn). `brāhmaṇa` → “Bà-la-môn”.
  - `saṅghārāma` → “tịnh xá của Tăng đoàn” (`tha-ap20:2.4`, `tha-ap563:2.4`; “tịnh xá Tăng đoàn” 2, “tu viện của Tăng chúng” 2); `ārāma` (11.1) → “tịnh xá”. `saṅghamajjhe` → “giữa Tăng chúng” (`tha-ap544:7.2`). `amāpayiṁ` → “đã cho xây dựng” (cùng `akārayiṁ` ở `tha-ap20`). `saraṇe pañca sīle` → “Quy y và năm giới” (không có tiền lệ cùng Pāli trong tầng; `tha-ap472:9.4` “năm giới”). `daḷhaṁ katvā samādiyiṁ` → “sau khi làm cho vững chắc, ta đã thọ trì” (không có tiền lệ cùng Pāli; `thi-ap40:3.2` “con đã thọ trì các giới”).
  - `devarājā` → “vua chư thiên” (`tha-ap33:7.2`, `tha-ap43:14.2`). `nihantvāna` → “sau khi tiêu diệt” (`bv18:1.3`). `amitayaso` → “có danh tiếng vô lượng” (`amita` = vô lượng; 14 khoá Pāli chứa `amitayas-`, 2 đã dịch không cùng nghĩa: `cp21:1.1` là tên riêng, `ja457:5.2` “không biết mệt”, nên không làm tiền lệ). `mahāyaso` → “bậc có danh tiếng lớn” (`bv17:1.2`). `durāsado` → “khó tiếp cận” (`bv24:1.4`). `manorama` → “khả ái” (2 trên 7 khoá; “đáng mến”, “dễ ưa”, “thích thú” mỗi dạng 1–2). `dvattiṁsavaralakkhaṇa` → “ba mươi hai tướng cao quý” (`bv27:23.4`; “tướng tốt tuyệt hảo” 8 khoá `tha-ap` là Pāli `bāttiṁsa-`).
  - `jinathūpa` → “bảo tháp của bậc Chiến Thắng ấy”: 0 tiền lệ cùng Pāli (7 khoá Pāli trùng, chưa dịch); `thūpavaro` ở `bv17:25.3` dịch “bảo tháp tối thượng của Ngài”.
  - Tên riêng: `Piyadassī` (20 khoá, 4 đã dịch giữ dấu), `Sobhita` (13), `Visākhā`, `Sujātā`, `Dhammadinnā`, `Candā` (tên mẹ), `Sudhañña`, `Sudatta`, `Kassapa`, `Sudassana`, `Pālita`, `Sabbadassī`, `Sandhaka`, `Dhammaka`, `Kakudha`, `Vimalā`, `Kañcanāveḷa`, `Sunimmala`, `Vimala`, `Giriguhā`, `Usabhuyyāna`, `Assatthārāma`, `Doṇamukha`: chưa có tiền lệ cho đúng nhân vật/địa danh này trong tầng (trừ `Sobhita`, `Visākhā`, `Piyadassī`), giữ dạng Pāli theo cách `bv16`–`bv24` giữ tên.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `4.2` `micchādiṭṭhimarocayi`: đọc là `micchādiṭṭhiṁ` + `arocayi` (`a-` là tiền tố quá khứ của `rocayi`, “ưa thích, tán đồng”); mạch kể xác nhận (`4.3` `tassa diṭṭhiṁ vinodento`, “xua tan kiến của vị ấy”). Cách đọc khác (đọc `a-` như phủ định, “không ưa tà kiến”) không hợp với `vinodento`, nên không chọn.
  2. `6.1` `doṇamukhaṁ hatthiṁ`: đọc `Doṇamukha` là tên con voi, vì `hatthiṁ` đứng sau và Pāli không có từ nào khác để giải thích; tôi không đối chiếu được chú giải, và tầng Việt chưa có tiền lệ (0 khoá khác). Cách đọc khác: `doṇamukha` là tính từ (“mặt như cái máng”), “con voi mặt máng”.
  3. `5.1`–`5.2` `Janasannipāto atulo, mahāsannipatī tadā`: dịch sát chữ, `janasannipāta` “đại chúng tụ hội”, `mahāsannipatī` “kỳ đại hội chúng”. `5.2` nói về cuộc tụ hội đông dân chúng nơi xảy ra lần chứng ngộ thứ hai, còn `7.1` và `8.3` nói về ba kỳ hội chúng của các bậc Mâu-ni; tôi dùng cùng gốc “hội chúng” cho `sannipāta` ở cả ba chỗ như Pāli, nên người đọc có thể lẫn hai việc, đó là sự mơ hồ của chính Pāli.
  4. `8.1`–`8.2` `Tato paraṁ navutikoṭī, samiṁsu ekato munī`: `navutikoṭī` đọc là “chín mươi koṭi” (không có `sahassa`, khác `5.3`); `munī` số nhiều “các bậc Mâu-ni”; `ekato` “cùng nhau”.
  5. `10.3` `Koṭisatasahassehi`: dạng công cụ cách của số lượng, không có danh từ; dịch “Với một trăm ngàn koṭi,” không thêm “vàng” hay “đồng tiền”.
  6. `16.3` `Sunimmalavimalagiriguhā`: đọc là ba tên lâu đài `Sunimmala`, `Vimala`, `Giriguhā` theo `16.4` `tayo pāsādā`; cách đọc khác: tính từ ghép cho một lâu đài. Đây là đọc theo số đếm “ba”.
  7. `17.3`–`17.4`: `Vimalā` (vợ) và `Vimala` (lâu đài, 16.3) cùng gốc tên; giữ hai dạng theo Pāli.
  8. `19.4` `usabhuyyāne`: giữ nguyên chữ Pāli “Usabhuyyāna” như một tên riêng (cùng cách `bv16` với “Anomuyyāna”); đọc là `usabha-uyyāna`, không tách.
  9. `23.4` `dissati`: “hiện ra” (nghĩa gốc “được thấy”); `sālarājāva` “như cây sāla chúa” (cùng khuôn `bv16:22.3`).
  10. `24.1` `Aggicandasūriyānaṁ`: sở hữu cách “của lửa, mặt trăng và mặt trời”, mệnh đề so sánh theo `natthi tādisikā pabhā`; không thêm “trong các vật”.
  11. `26.2` `Yugānipi tāni atuliyāni`: `yuga` đọc là “cặp, đôi” (Pāli của bài `bv14:35.2` cùng khuôn viết `Guṇāni ca tāni atuliyāni`, “các đức ấy cũng không thể cân lường”). Pāli đã ghim ở bài này viết `Yugāni` và không có tiền lệ Việt cho dạng này (0 khoá), nên tôi dịch sát chữ “những cặp ấy cũng không thể cân lường”, không đoán ra “đức hạnh”. Cách đọc khác: `yuga` = “thời đại”, hoặc bản chép lệch của `guṇa`. Đây là chỗ bất định lớn nhất của bài.
  12. `26.3`–`26.4` `Sabbaṁ tamantarahitaṁ, Nanu rittā sabbasaṅkhārā`: dùng đúng `bv24:26.3`–`26.4` (“đã biến mất”, “chẳng phải mọi hành đều trống rỗng sao?”). `bv27:24.3` dịch cùng cụm là “sẽ biến mất” vì thì khác; ở đây `antarahitaṁ` là quá khứ phân từ nên “đã biến mất”.
  13. `27.3` `Tatthevassa jinathūpo`: `assa` (của vị ấy) và `jina` (bậc Chiến Thắng) cùng chỉ Đức Phật; dịch “bảo tháp của bậc Chiến Thắng ấy” gộp cả hai, không lặp.
