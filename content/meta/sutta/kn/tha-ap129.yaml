notes: |-
  **Đã ghi đủ 40/40 khoá.** Trước đợt này tệp dịch chỉ có **1** khoá (`tha-ap129:10.1`), còn
  39 khoá trống. Lát này viết lại từ Pāli toàn bộ: 40 khoá theo đúng thứ tự Pāli, `json.dump`
  `ensure_ascii=False, indent=2` + newline cuối, đủ khoá trong `all`, 0 orphan.

  **`translationTitle` = đúng bằng `:0.3`, và `:0.3` KHÔNG có số thứ tự.** Pāli `:0.3`
  = `Phaladāyakattheraapadāna` — **không bắt đầu bằng số**, nên theo chính sách đã đo (KEEP khi
  và chỉ khi Pāli `:0.3` bắt đầu bằng số) tôi **BỎ** số thứ tự. Trước đợt này tệp ghi
  *Kinh Kệ Của Trưởng Lão Phaladāyaka*, tức vừa sai chữ **vừa lệch `:0.3`** — hai lỗi mắc
  4 lần ở 4 đợt. Nay cả hai đã khớp.

  **Đo hình thức tiêu đề, nêu cả hai phạm vi vì chúng cho hai đa số khác nhau.**
  Tại `:0.3` toàn phẩm `tha-ap` (405 mẫu): `Bài Kệ` 229 + 75 mẫu có số ở trước, `Ký Sự` 91 +
  4, `Kinh Kệ` 2 + 1, `Truyện Kệ` **0**. Tại phạm vi gần nhất: `Sereyyavagga` (3 mẫu) cho
  `Ký Sự` 2 và `8. Kinh` 1; `Bandhujīvakavagga` (9 mẫu) cho `Bài Kệ` 7 và `Ký Sự` 1.
  ⇒ Tôi chọn **`Bài Kệ Tuyên Ngôn Về Trưởng Lão <tên>`** vì ba lý do cùng lúc: đa số cả
  phẩm là `Bài Kệ`; đa số phạm vi gần nhất của bài kế bên (tha-ap153/157/158/160/161) cũng là
  `Bài Kệ`; và nhóm `Ký Sự` trong `Sereyyavagga` luôn đi kèm việc **dịch nghĩa danh hiệu**
  (Gandhodakiya → Cúng Dường Nước Thơm, Gaṇṭhipupphiya → Cúng Dường Búp Hoa), còn hai bài
  này giữ tên riêng dạng Pāli theo đúng luật *tên riêng giữ nguyên dạng Pāli* mà notes của
  chính tệp này đã xác nhận. **Còn phân kỳ giữa hai phạm vi thì ghi để biên tập phán một
  lượt cho cả cuốn** — tôi không tự sinh cách thứ N+1.

  **Chính tả `Tuyên Ngôn` — tôi đo lại và số của brief là khác phạm vi.** BRIEF_THAP ghi đa số
  là `Tuyên Ngôn` (128). Tôi đo lại: tại `:0.3` toàn phẩm thì `Tuyên Ngợ` **220** và
  `Tuyên Ngôn` **87**; toàn tầng (mọi segment có chuỗi) `Tuyên Ngợ` **433** và `Tuyên Ngôn`
  **172**. Nghĩa là trên **đếm toàn cục thì bản sai chiếm đa số**; chỉ ở phạm vi gần nhất
  (`Bandhujīvakavagga`) mới ngược lại (`Ngôn` 5 : `Ngợ` 2). Tôi dùng **`Tuyên Ngôn`** vì
  `Ngợ` không có nghĩa tiếng Việt nào ứng với `apadāna`, và vì phạm vi gần nhất cũng nghiêng
  về nó. Hai số đã nêu để biên tập phán một lượt.

  **Công thức lời-kết: đã sửa sang nhóm đông.** `Itthaṁ sudaṁ āyasmā … thero imā gāthāyo
  abhāsitthāti.` — Pāli `imā gāthāyo` là **số nhiều**. Đo tầng: `đã nói những bài kệ này`
  **424** so với `đã từng nói bài kệ này` **28** (riêng phẩm `tha-ap`: 416 so với 12). Khoá
  `:10.1` của bài này trước đợt này đang dùng **số ít** `đã từng nói bài kệ này` — thuộc
  nhóm 28 khoá bị gọi là lỗi ở bốn lát liên tiếp; **đã sửa** thành `đã nói những bài kệ này`.
  Đầu câu giữ hình thức *Tôi nghe như vầy:* (không lời hô), đo được 421 so với 7.

  **Ba chỗ tôi cố ý KHÔNG sao chép tiền lệ.**
  1. `tiṇṇaṁ vedāna pāragū;` — tiền lệ n=1 (`tha-ap7:1.2`) dịch *ba thọ*. Đó là **sai nghĩa**:
     `vedāna` ở đây là **ba Veda**, không phải `vedanā` (thọ trì). Cùng cặp đó ở `sn` dịch
     *thông thạo ba Veda*. Tôi dịch **thông thạo ba Veda**. Lỗi ở `tha-ap7` **ngoài lát của
     tôi**, tôi không sửa — báo coordinator.
  2. `ajjhāyako mantadharo,` — cùng tiền lệ dịch *Vị thầy tụng đọc*. `ajjhāyako` là người
     **học thuộc**, không phải thầy. Tôi dịch **Người tụng đọc, người thuộc lòng những bài
     tụng,** giữ khung danh từ kép mà tầng này dùng ở tha-ap, còn động từ theo đa số tầng.
  3. `anubhotvāna sampadā;` — tiền lệ n=3 dịch *anh đã thọ nhận…*, nhưng khoá kế `Pattomhi`
     là **tôi**. Đã chỉnh ngôi: **tôi đã thọ nhận được thành tựu;**

  **Nhịp nháy.** Pāli mở `“` ở `:1.1` và đóng `”` ở `:9.3` (không phải `:5.3` như brief
  nói về phẩm nói chung — ở bài này đóng ở `:9.3`), và lồng nháy đơn `‘…’` ở `:6.1`–`:6.4`.
  Tôi làm **khớp Pāli từng khoá**, không cho mỗi khoá tự cân: 6 khoá tự mất cân, đúng như Pāli;
  đọc liền cả bài thì `“=1 ”=1 ‘=1 ’=1`.

  **`_hvi.py` không dùng được ở đây** — ở `tha-ap` hầu hết khoá Pāli ngắn hơn 40 ký tự, nên
  bộ lọc của nó quét **không khoá nào** rồi báo xanh. Tôi tự viết **năm** phép kiểm, quét
  **mọi** khoá, và báo rõ mẫu số từng phép:
  - **(1) tập khoá** — mẫu số **40** khoá Pāli; thiếu 0, thừa 0, orphan 0, giá trị rỗng 0.
  - **(2) ngoặc kép và nháy đơn** — mẫu số **40**; lệch so với Pāli từng khoá: **0**.
  - **(3) `…pe…`** — mẫu số **1** khoá Pāli có `…pe…`; bản Việt giữ đúng một `…`: lệch **0**.
  - **(4) `…` trần** — mẫu số **0** khoá; mất **0**.
  - **(5) Pāli trùng nguyên văn trong chính bài mà Việt khác** — **1** nhóm trùng, **1** cặp
    đã dò, khác **0**. Nhóm đó là `āhutīnaṁ paṭiggaho;` ở `:3.2` và `:5.2`: Pāli trùng,
    Việt cũng trùng, đúng như phải có.
  - Ngoài ra: NFC sai 0, khoá có khoảng trắng thừa 0, JSON hợp lệ.

  **Bất định đã ghi, không giấu.**
  1. `Aggihuttañca me atthi, / puṇḍarīkaphalāni ca; / Puṭake nikkhipitvāna, / dumagge
     laggitaṁ mayā.` — vế này tôi đọc là *món lễ hỏa tế và trái sen trắng, bỏ vào túi rồi buộc
     lên cành cây*. Pāli không nói rõ ai làm gì với `puṭake`, và `puṇḍarīkaphala` (trái sen
     trắng) không có tiền lệ nào trong tầng — tôi dịch theo nghĩa thường, không bịa thêm chi
     tiết. Nếu người biên tập đọc `puṭaka` là *đống/bó* thay vì *túi* thì đổi một chữ ở
     `:2.3`; không có nghĩa giáo nghĩa nào đổi theo.
  2. `sukkamūla` (rễ trắng) là thuật ngữ kỹ thuật của lễ trao quả, chưa ổn định trong tầng.
     Tôi dùng **nguyên văn tiền lệ** `Bằng chính rễ củ trắng đó,` ở `:7.1` (tha-ap136:6.1),
     còn ở tha-ap162:5.2 tiền lệ là *rễ trắng* (không có *củ*). ⇒ **Hai bài trong cùng lát lệch
     nhau một chữ, do cả hai đều bám tiền lệ.** Đề nghị biên tập chọn một dạng cho cả phẩm;
     tôi để nguyên và ghi ở đây để không che giấu sự lệch.
  3. `Phaladāyakattheraapadāna` — nhóm đa số dịch tên dạng Pāli (`Phaladāyaka`), nhóm thiểu số
     dịch nghĩa (*Cúng Dường Trái Cây*). Tôi giữ dạng Pāli, đồng nhất với `:10.1` và `:11.1`
     của chính bài và với luật tên riêng. Việc dịch nghĩa danh hiệu vẫn là lựa chọn hợp lệ,
     nhưng phải phán một lượt cho cả cuốn chứ không áp cho một bài.

