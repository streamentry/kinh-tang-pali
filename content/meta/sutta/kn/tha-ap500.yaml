notes: |-
  Dịch trực tiếp từ Pāli root (147 khoá, đủ và đúng thứ tự Pāli); không có tầng Anh đã ghim cho tha-ap, xem `blocking_errors`.
  Nội dung: tiền thân Trưởng lão Pulinathūpiya là đạo sĩ Nārada trên núi Yamaka, đắp tháp cát bên sông Amarikā rồi cúng ba ngàn hoa kiṅkaṇi vàng; kiếp cuối sinh ở Sāvatthī, cha mẹ dựng bảo tháp vàng, thấy bảo tháp thì nhớ lại tháp cát và đắc A-la-hán; xuất gia nơi Tướng quân Chánh pháp.
  NGÔI KỂ: `tôi`. Đo phạm vi gần: phẩm Kiṅkaṇipupphavagga (tha-ap493–502) có 2 bài `ta`, 5 bài `tôi`, 2 bài lẫn; năm bài liền trước (tha-ap495–499) đều `tôi`. Đo rộng hơn (tha-ap480–530) cho `ta` 23 bài, `tôi` 14 bài, lẫn 4 bài; đo toàn phẩm tha-ap cho `ta` 197 bài, `tôi` 205 bài, lẫn 89 bài. Chọn `tôi` theo phạm vi gần nhất; hai phạm vi cho hai đa số khác nhau, cần người biên tập phán một lượt cho cả phẩm.
  CÔNG THỨC DÙNG LẠI NGUYÊN VĂN: `Svāgataṁ vata me āsi` (95 bài `ta`) → `Thật lành thay sự đến của tôi,` (đổi ngôi); `Kilesā jhāpitā mayhaṁ` (100 bài `ta`, 15 bài `tôi` dạng `Các phiền não của tôi đã bị thiêu rụi,`); `viharāmi anāsavo` → `tôi sống không còn lậu hoặc.` (22 bài `tôi`; bản 23 bài `tôi sống đời thanh tịnh không còn lậu hoặc` không chọn vì `thanh tịnh` không có trong Pāli); `kataṁ buddhassa sāsanaṁ` → `đã làm tròn lời dạy của Đức Phật` (111 bài chấm, 456 bài dấu nháy đóng); `Paṭisambhidā catasso` → `Bốn vô ngại giải,` (487); `sukkamūlena codito` → `được khích lệ bởi cội nguồn thiện căn;` (24/30); `Himavantassāvidūre` → `Không xa dãy Himavanta,` (12/23); `Pacchime bhave sampatte` → `Khi đời sống cuối cùng đã đến,`; `Padesarajjaṁ vipulaṁ` → `Vương quyền cai quản các vùng đất rộng lớn,` (7) thay vì `Vương quốc rộng lớn ấy,` (15) vì `ấy` không có trong Pāli và `padesa` (miền, vùng) bị mất; `gaṇanāto asaṅkhiyaṁ` → `đếm không hết, vô tận.`; `devarajjamakārayiṁ` → `tôi đã làm ra vương quyền nơi chư thiên.` (nhóm đông nhất, kể cả phạm vi gần); `cakkavattī ahosahaṁ` → `tôi từng làm Chuyển Luân Vương;`; `pattomhi acalaṁ padaṁ` → `tôi đã bước đến nơi không lay chuyển.`; `Sammukhā viya sambuddhaṁ`, `vedajāto katañjalī`, `guṇamaññāya cakkhumā`, `mahāsāle suaḍḍhake`, `Ekāsane nisīditvā`, `arahattamapāpuṇiṁ`, `Upasampādayī buddho`, `sakyaputtassa sāsane` (giữ `trong giáo pháp của Đức Phật.` theo tiền lệ 3 bài, mất sắc thái `con của dòng Thích-ca`), `Dvāvīsatimaṁ bhāṇavāraṁ` theo mẫu `Phần tụng đọc thứ N`. Lời kết `Itthaṁ sudaṁ … abhāsitthāti` dùng nhóm `những bài kệ này`. Không theo tha-ap345 ở `Satānaṁ tīṇikkhattuñca` (bản ấy dịch `Cả bảy món báu`): Pāli là `satānaṁ` (của hàng trăm), không phải `satta` (bảy); các biến thể `Satānaṁ pañcakkhattuñca` ở tha-ap430, 503, 536, 539, 558 chưa có bản Việt để đối chiếu.
  TIÊU ĐỀ: `:0.3` Pāli bắt đầu bằng số `8` nên giữ `8. `; `translationTitle` bằng đúng `:0.3`. Kiểu tiêu đề: phẩm gần nhất (tha-ap493–502) `Ký Sự` 6 / `Bài Kệ Tuyên Ngợ` 3; phạm vi tha-ap485–515 `Ký Sự` 12 / `Tuyên Ngợ` 11 / `Tuyên Ngợi` 1; toàn tầng tha-ap `Tuyên Ngợ` 241 (thêm 10 bài `Tuyên Ngợi`) / `Tuyên Ngôn` 132 / `Ký Sự` 111. Chọn `Ký Sự` (đa số ở phạm vi gần nhất, năm bài liền trước cùng phẩm đều là `Ký Sự`; `Tuyên Ngợ` là chính tả sai đã ghi nhận). Tên người giữ Pāli `Pulinathūpiya` (như `Pulinacaṅkamī` tha-ap482; `Pulinapūjaka` tha-ap29). Hai phạm vi cho hai đa số khác nhau: cần người biên tập phán một lượt cho cả cuốn.
  SỐ PĀLI (tự tính): `Catuddasasahassāni` = 14 × 1.000 = 14.000 → `Mười bốn ngàn`; `Asītikkhattuṁ` = 80 lần; `Satānaṁ tīṇikkhattuñca` = 3 × 100 = 300 → `ba trăm lần` (Pāli là `satānaṁ`, số nhiều của `sata`); `Dhātīsatasahassāni` = 100 × 1.000 = 100.000 → `Một trăm ngàn` (số nhiều có thể đọc `hàng trăm ngàn`; theo cách đọc thường của `satasahassa`); `sahasse tīṇi` = 3 × 1.000 = 3.000 → `ba ngàn đóa`; `tiyāmaṁ` = ba canh đêm; `Jātiyā sattavassena` = bảy tuổi; `Dvāvīsatimaṁ` = 2 + 20 = 22 → `hai mươi hai`; `aṭṭhamaṁ` = thứ tám. Bài không có `tiṁsa`.
  BẤT ĐỊNH 1 — `Dhātī` (18.3): dịch `người vú nuôi`; tiền lệ trong tầng chỉ có tha-ap122 `Dhātiyo` bị hiểu thành `các yếu tố` (đọc lầm `dhātu`); nghĩa `vú nuôi`, `nữ hầu` đều có thể, không có bản Anh để phân xử.
  BẤT ĐỊNH 2 — `sahasse tīṇi` (10.4): `sahasse` là cách locative số ít; đọc là `ba ngàn` (như `Ekapaññāsasahasse` → `năm mươi mốt nghìn` ở tha-ap60); không có bản Anh độc lập.
  BẤT ĐỊNH 3 — `Bodhipapaṭikaṁ` (27.1): `papaṭikā` nghĩa đen là vảy, vỏ, mảnh; dịch `mảnh vỏ cây Bồ-đề`, 0 tiền lệ trong tầng.
  BẤT ĐỊNH 4 — `diṭṭhapadā` (26.3): dịch sát chữ `đã thấy được cảnh giới` (`padaṁ` ở 20.4 là `nơi không lay chuyển`); không thêm cách hiểu của truyền thống chú giải vào lời kinh; 0 tiền lệ.
  BẤT ĐỊNH 5 — `mahāsaraṁ` (22.4): `sara` là hồ, vùng nước lớn; dịch `vùng nước lớn` vì cùng cụm với `aṇṇavaṁ` (biển cả) ở 22.2. `khettaṁ akhettaṁ` (21.3): Pāli chỉ nói `ruộng`; dịch `ruộng phước` theo nghĩa ẩn dụ ở ngữ cảnh làm việc thiện (0 tiền lệ). `Amarikā` (8.1) và `Marikā` (20.2) là hai dạng Pāli của cùng tên sông (có thể do vần luật), giữ đúng từng dạng, không hợp nhất.
  BẤT ĐỊNH 6 — `sudiṭṭhā marikā nadī` (20.2) dịch `dòng sông Marikā tôi đã thấy thật tốt lành` (chủ thể `me` của 20.1 dùng chung cho cả hai vế). `Upāsamāno … upaṭṭhahe` (5.1–5.2) dịch theo thể mong muốn `có thể gần gũi thân cận, để phụng sự`; `Upanissāya viharaṁ … saṁvaseyyāsi` (13.1–13.4) hiểu là lời tự nhắc, ngôi hai `ngươi`, Pāli không đánh dấu lời nói.
  DẤU NHÁY: Pāli mở ngoặc kép ở 1.1, đóng ở 37.3; nháy đơn mở ở 3.3 (`‘Sabbo jano…`) và đóng ở 6.4; bản Việt khớp từng khoá. Các khoá `…pe…` dịch thành đúng một `…`.
  COVERAGE ENGLISH: mẫu số 1 (chỉ khoá lời kết 38.1 đạt 40 ký tự; không tính khối `:0`); bản Sujato phủ 0/1; `english-sujato` không có `tha-ap` tại commit đã ghim, `english-project` không có uid này, `vietnamese-current` chỉ có Pháp Cú ⇒ ba tầng tham khảo đều vắng. Mẫu số quá nhỏ nên cổng coverage hầu như không đo được gì cho bài này; bài là bài kệ ngắn, mỗi vế dưới 40 ký tự.
  BẤT ĐỊNH 7 — `Āyāgaṁ` (6.1): hiểu là bậc đáng được cúng dường/phụng thờ, đi cùng `garuṁ bhāvaniyaṁ` (bậc đáng kính, đáng tôn quý); 0 tiền lệ trong tầng, không có bản Anh. `sovaṇṇaṁ māpayiṁ` (10.2): Pāli không nêu tân ngữ, dịch `tôi cho tạo tác bằng vàng` và nối sang `hoa kiṅkaṇi vàng` ở 10.3, không thêm danh từ. `Imāhaṁ kaṭṭhaṁ … tarissāmi` (23.1–23.2) là lời của người trong ví dụ (ngôi thứ nhất), Pāli không dùng dấu nháy nên bản Việt cũng không thêm. `sammukhā` (27.4) dịch sát `trước mặt`, không thêm `như thể` vì Pāli không có `viya` (khác với 11.3).
