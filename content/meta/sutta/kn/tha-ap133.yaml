  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 3 khoá bất đồng nghĩa → sửa 0, giữ 2, bất định 1. Giữ: 2.2 và 2.4 (bản nguyên bài hiểu chính người kể bật thốt lên lời; Pāli có vacanaṁ … vācāsabhimudīritaṁ là lời của Đức Phật, và ekaggo āsahaṁ là ekaggo āsiṁ ahaṁ, tôi đã nhất tâm). Bất định: 7.2 (yasuggatā: bản nguyên bài hiểu là tên của bảy vị; Pāli là số nhiều đứng cạnh cakkavattī, có thể là định ngữ lừng danh hoặc là tên; bản dự án giữ lừng danh). Các khoá còn lại cùng nghĩa; ở 6.1 đến 6.4 bản nguyên bài dùng thì tương lai còn Pāli là gerund jhāpayitvāna nên giữ. Rà đối kháng lại 41/41 khoá với Pāli: không phát hiện lỗi mới. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

