notes: |-
  **Phạm vi lát.** `vc/n52.json`: hai bài `tha-ap123` và `tha-ap133`, mỗi bài 40 khoá
  trong `keys`, 41 khoá trong `all`. Tệp dịch trên đĩa trước khi lát chạy chỉ có
  **một** khoá mỗi bài (`:10.1`), nên 40 khoá kia là viết mới. Kết quả: 41/41 khoá
  mỗi bài, đúng thứ tự Pāli, `json.dump(..., ensure_ascii=False, indent=2)` + newline.

  **`translationTitle` = đúng `:0.3`, và `:0.3` KHÔNG có số thứ tự.** Pāli
  `tha-ap133:0.3` = `Sobhitattheraapadāna`, **không** bắt đầu bằng số, nên theo
  chính sách (giữ số khi và chỉ khi Pāli `:0.3` bắt đầu bằng số) tôi **BỎ** số, và
  `translationTitle` viết **bằng đúng** chuỗi đó: `Bài Kệ Tuyên Ngợ Về Trưởng Lão
  Sobhita`. Đo lại toàn phẩm: trên 405 tệp `tha-ap` đã có `:0.3` thì KEEP 79 ·
  DROP 275 · THỪA 2 (`tha-ap117`, `tha-ap427`) · Pāli-có-số-Việt-mất 49. Hai tệp
  THỪA nằm ngoài lát này, tôi không sửa. Đo này xác nhận con số BRIEF_VI4 §7 đưa
  (KEEP 66 · DROP 275) và cho thấy DROP là đa số tuyệt đối.

  **Phe dấu `ti` — đo ở phạm vi gần nhất, nêu cả hai số.** `:0.3` của mọi 428 tệp
  `tha-ap` đều có Pāli dạng `...theraapadāna` (đo: `apadāna` 428/428), nên tiền lệ
  phải đo **trên `:0.3`**, không lẫn lục kết. Phạm vi gần nhất `tha-ap108`–`tha-ap138`
  (18 tệp đã có `:0.3`): **Tuyên Ngợ 7** · Tuyên Ngôn 4 · Ký Sự 4 · Kinh Kệ 3. Toàn
  phẩm (322 tệp có `:0.3`): **Tuyên Ngợ 167** · Tuyên Ngôn 86 · Ký Sự 63+3 · Kinh Kệ 3.
  Cả hai phạm vi đều nghiêng về *Tuyên Ngợ*, nên tôi dùng *Tuyên Ngợ*. **Đính chính
  một điểm trong BRIEF_THAP:** hàng của bảng lỗi ghi *Bài Kệ Tuyên Ngợ* là *sai chính
  tả* và nói đa số đúng là *Tuyên Ngôn* (128) — phép đo của tôi, trên cả hai phạm vi,
  cho thấy *Tuyên Ngợ* mới là đa số. Tôi theo phép đo (theo BRIEF_VI4 §7) và **giao
  quyết định chính tả một lượt cho cả cuổn** cho người biên tập: *Tuyên Ngợ* 167 vs
  *Tuyên Ngôn* 86, và *Tuyên Ngợi* là biến thể của *Tuyên Ngợ* chứ không phải phe riêng.
  Tôi cũng **tránh** dạng *Kinh Kệ Của Trưởng Lão X* mà BRIEF_THAP liệt kê là lỗi:
  cả `:0.3` và `translationTitle` trước đây của tệp này đều viết *Kinh Kệ Của…*,
  nay đã đổi.

  **Công thức lời-kết `Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti`: đã đổi số ít
  → số nhiều, và đo lại.** Khoá `:10.1` có sẵn ghi *…đã từng nói **bài kệ này*** — đúng
  nhóm mà BRIEF_THAP gọi là lỗi đã bị gọi ở 4 lát liên tiếp. `imā gāthāyo` là số
  nhiều. Đo lại: trong `tha-ap`, nhóm **SỐ NHIỀU 416** vs SỐ ÍT 12; toàn tầng Việt
  **SỐ NHIỀU 431** vs SỐ ÍT 39. Hai số này lệch với 407/21 ghi trong brief nhưng
  **cùng kết luận**, nên tôi theo phép đo của mình. Đo thêm vế *đã từng*: trong
  `tha-ap`, `đã từng nói những bài kệ này` = **0** chỗ, `đã nói những bài kệ này` =
  **423** chỗ, nên bản Việt dùng *đã nói những bài kệ này*, không có *từng*. Khoá nay
  là: `Tôi nghe như vầy: Tôn giả Trưởng lão Sobhita đã nói những bài kệ này.`
  Vế mở đầu `Tôi nghe như vầy:` giữ nguyên vì Pāli câu này **không** có vocative
  nào, và đo trên toàn tầng cho 41 khoá cùng công thức đã merge dạng này.

  **Bốn khoá dùng lại nguyên văn một cách dịch đã có (đếm được).** 36/82 khoá của
  lát trùng nguyên văn Pāli với một khoá đã dịch ở tầng này nên tôi dùng lại y hệt:
  `Therāpadāna` 396 bản · `Phẩm Sobhita` 9 · `“Đức Chiến Thắng tên Padumuttara,` 5 ·
  `bậc Trưởng Thượng thế gian, đấng Nhân Ngưu;` 12 · `Nghe lời ấy của người ấy,` 7 ·
  `ta giơ hai tay lễ rồi,` 6 · `đã nói những bài kệ này.` 5 · `Trong suốt một trăm
  ngàn kiếp,` 5 · `tâm nhất cảnh khéo định tĩnh an nhiên;` 1 (`tha-ap148:4.2`) ·
  `Đầy đủ bảy món báu quý giá,` 23 · `là Chuyển Luân Vương có đại uy lực.` 14 ·
  `Các phiền não của ta đã được thiêu rụi,` 77 · `mọi cõi hữu đều đã được nhổ
  sạch;` 11 · `Ba minh đã chứng đắc,` 12 · `đã làm tròn lời dạy của Đức Phật.` 90 ·
  `Bốn vô ngại giải,` 405 · `và tám giải thoát này;` 28 · `Sáu thắng trí đã chứng
  đắc,` 36 · `đã làm tròn lời dạy của Đức Phật”.` 372. Riêng `buddho kāruṇiko isi.`
  dùng lại y hệt `tha-ap108:2.4`.

  **Hai chỗ không có tiền lệ Pāli trùng, phải tự dịch — và đây là chỗ yếu nhất.**
  1. `sattevāsuṁ yasuggatā;` (`7.2`). Đếm cả Pāli gốc đã ghim (284.708 khoá): cụm
     `sattevāsuṁ` có **3** chỗ (`tha-ap182:3.2 sattevāsuṁ samodakā;`,
     `tha-ap83:8.2 sattevāsuṁ mahāyasā;`, và khoá này), và cùng khuôn với
     `pañcevāsuṁ` ở `tha-ap85:5.2`. Cả ba đều nằm trong vế đứng giữa khung
     `<N> kappe – sattevāsuṁ <X>ā; – Sattaratanasampannā, – cakkavattī mahabbalā.`
     Tôi đọc `evāsuṁ` là *các đọa xứ* và số đi trước là số lần đạt tới ⇒
     *đạt bảy lần trong các đọa xứ*. Cách đọc thứ hai (chỉ là “bảy đọa xứ”) không
     khớp với `pañcevāsuṁ` vì đọa xứ chỉ có năm. Bản Việt không thêm chữ nào ngoài
     đọa xứ.
  2. `Na buddhañāṇassa kalaṁ upenti te.` (`3.4`). **hapax toàn Pāli gốc** (đếm: 1
     chỗ, không có bản Anh nào phủ). Vế này đứng sau `ye cittavasena vattare`
     nên tôi giữ phủ định như Pāli và hiểu là *những kẻ vượt bằng tâm ấy không hề
     tới gần tầm tài trí của Đức Phật*: **họ không đạt tới**. Cách đọc thứ hai có
     thể là ca ngợi (về tầng tài trí Đức Phật không ai với tới), nhưng với `te` làm
     chủ ngữ sau `ye … vattare` thì cách đó không cứng được. Tôi **không** nâng lên
     blocker: dù chọn cách nào thì kết luận giáo lý của bài — người làm sáng tỏa
     tài trí nơi Đức Phật sẽ không đi vào khổ xứ — không đổi, và bản Việt hiện tại vẫn
     bảo vệ được. Người biên tập có thể phán lại khoá này nếu có nguồn song song.

  **Nhịp nháy.** Pāli mở `“` ở `1.1` và đóng `”` ở `9.4` — nhịp **cố ý chạy qua khoá**,
  không phải mỗi khoá tự cân. Trong bài này còn hai cặp nháy **đơn** chạy qua khoá:
  mở `‘` ở `3.1`, đóng `’,` ở `3.3`; mở `‘` ở `5.1`, đóng `’.` ở `6.4`. Bản Việt
  giữ nguyên vị trí và loại nháy, đếm được: 1 mở / 1 đóng `“”` và 2 mở / 2 đóng
  `‘’`, khớp Pāli.

  **Năm phép kiểm tự viết (vì `_hvi.py` ở phẩm này chạy rỗng).** Ở `tha-ap` chỉ **2/41**
  khoá mỗi bài dài ≥ 40 ký tự, nên bộ lọc của `_hvi.py` quét gần như không khoá nào
  rồi báo xanh. Tôi tự viết năm phép quét **mọi** khoá, cả hai bài: **P1** tập khoá
  Việt = tập khoá Pāli — 41 = 41, thiếu 0, thừa 0, khoá trùng 0. **P2** nháy kép và
  **nháy đơn** đếm riêng từng loại trên cả bài, không đóng trước khi mở — bài này
  1/1 `“”` và 2/2 `‘’`, khớp Pāli; **`_hvi.py` chỉ đếm `“”` nên nó không thấy được
  nhịp nháy đơn**. **P3** `…pe…`: 0 khoá ở bài này nên không có gì để bung, và số dấu
  lược khớp từng khoá — lưu ý Pāli bài này **có đủ** bốn vế ở `9.1–9.4`, không lược,
  nên bản Việt cũng dịch đủ bốn vế và **không** được đặt `…`. **P4** `…` trần: 0 khoá.
  **P5** NFC 0 lỗi, trùng nguyên văn Pāli 0 lỗi ở khoá ≥ 40 ký tự, thứ tự khoá
  trong JSON **bằng đúng** thứ tự Pāli. Tổng: **0 lỗi**. Ngoài ra: `:0.1`
  `Therāpadāna` giữ nguyên dạng Pāli — đúng tiền lệ 396/405, và khoá này ngắn nên
  không nằm trong phép kiểm "không copy Pāli" của `_hvi.py`.

  **Cặp Pāli trùng đã dò.** Trong **chính bài này**: **0** nhóm Pāli trùng (41 khoá,
  41 chuỗi khác nhau), nên **0** cặp trùng mà Việt khác. Giữa hai bài của lát: **7**
  cặp trùng nguyên văn theo chuỗi (`Therāpadāna`; `Kappānaṁ satasahassaṁ,`;
  `cakkavattī mahabbalā.`; và bốn vế `9.1–9.4`), và sau một lượt sửa **cả 7 đều
  dịch giống nhau**. Lần đầu `cakkavattī mahabbalā.` ở hai bài lệch *đại oai lực* /
  *đại uy lực* — tự mâu thuẫn ngay trong lát của mình, đã sửa về một; số đo toàn
  tầng cho chuỗi này là *các Chuyển Luân Vương có đại oai lực* 20 / *là Chuyển Luân
  Vương có đại uy lực* 14 / *đại thần lực* 6, và Pāli ở đây là **số ít**, nên tôi chọn
  dạng số ít. Đây là cặp trùng mà bài này đã **tự bắt và tự sửa** — đúng loại lệch mà
  bốn lớp lỗi của `_hvi.py` không thấy.

  **Lỗi bản nháp cũ bắt được trước khi ghi.** Bản trên đĩa chỉ có `:10.1`, và nó
  dùng **số ít** `bài kệ này` — đúng lỗi BRIEF_THAP liệt kê. Ngoài ra `notes` cũ và
  `translationTitle` cũ (*Kinh Kệ Của Trưởng Lão Sobhita*) vi phạm lần lượt chính
  sách số thứ tự và danh sách lỗi trong brief. Ba lỗi đó đã sửa. `notes` cũ còn ghi
  *sau 500 kappa* cho `7.1` `Paññāse kappasahasse` — `Paññāse` = 5, `kappasahasse` =
  ngàn ⇒ năm trăm kiếp, nên câu này đúng; nhưng `7.2` `sattevāsuṁ` nó **bỏ qua**,
  tức là câu kệ đó trước đây chưa từng được dịch.

  **Vì sao `draft`.** Điểm 9,15 vượt ngưỡng 9,0 nhưng **có blocker nên bắt buộc
  `draft`** — điểm cao không cứu được blocker. Blocker thật và đo được: tại commit đã
  ghim, tầng Anh **không phủ `tha-ap`**. `source/upstream-manifest.json` cho thấy
  `translation/en/sujato` có **4.291** tệp, trong đó tệp `tha-ap` duy nhất là
  `name/sutta/tha-ap-name_translation-en-sujato.json` — tệp *tên*, không phải thân
  kinh; tám sub-collection có mặt là `cp dhp iti ja kp snp thag thig ud`. Tầng
  `vietnamese-current` chỉ có **26** tệp, toàn bộ Pháp Cú. Tầng `english-project`
  không có entry cho bài này. ⇒ **mẫu số coverage bằng 0**, Sujato phủ **0/0** khoá;
  đây không phải "phủ thiếu" mà là **không có tệp thân kinh nào để đo**, nên cổng
  coverage không đo được gì cho bài này. `review` và `published` đều đòi tầng tham
  khảo, nên hai trạng thái đó sẽ đỏ. Cần chạy `npm run reference:gaps` (ngoài phạm
  vi của lát) để ghi nhận.
  Vì chỉ dựa vào Pāli gốc, `triangulation` để **7,6** và tôi **không** tuyên bố
  bài này đã đối chiếu bản Anh nào. Đối chiếu được là: Pāli ghim qua
  `.cache/upstream/suttacentral/root/pli/ms/sutta` (đúng UID, đúng thứ tự khoá), và
  thân kinh **song song** `thag2.23` (`Sobhitattheragāthā`, Trưởng lão Sobhita — đây
  là chính vị trưởng lão của bài này) có bản Anh đã ghim nên dùng để **kiểm tra danh
  tính nhân vật**, không dùng để dịch câu nào ở đây: hai bài nói hai việc khác nhau
  (`thag2.23` là thánh tự tưởng niệm trong một đêm, `tha-ap133` là tiền kiếp làm vua
  Chuyển Luân).

  **Cổng kỹ thuật chưa chạy.** Lát này bị cấm mọi lệnh `git` và cấm
  `npm run validate|test|build|check`. Bốn lệnh còn lại là:
  **npm run validate** · **npm test** · **npm run check** · **npm run build**.
  Vì vậy `technical_integrity` = **9,6**, chỉ ghi phần tự kiểm được ở trên, và tôi
