notes: |-
  Bài kinh trong `Therāpadāna apadāna` (Truyện Kệ của các Trưởng Lão),
  dạng kệ apadāna: mỗi bài là bài kệ của một vị trưởng lão, kèm dòng ghi công
  `Itthaṁ sudaṁ āyasmā <tên> thero imā gāthāyo abhāsitthāti.` Cả 14 bài của
  lát này có **cùng một công thức** ở đúng khoá cần dịch, nên tôi dịch từng
  bài theo Pāli chứ không rút gọn theo khuôn.

  **Tiền lệ đã tra (3.261 bài Việt trong `content/translation/vi/project/sutta/`).**
  Công thức này đã được dịch **28 lần** trong tầng Việt, và tôi theo đúng cách đó:
  14 bài **cùng cuốn** `tha-ap` (`tha-ap120` Maggasaññaka, `tha-ap122` Jātipūjaka,
  `tha-ap123` Sereyyaka, `tha-ap124` Pupphathūpiya, `tha-ap125` Pāyasadāyaka,
  `tha-ap128` Kusumāsaniya, `tha-ap129` Phaladāyaka, `tha-ap130` Ñāṇasaññika,
  `tha-ap132` Padumapūjaka, `tha-ap133` Sobhita, `tha-ap134` Sudassana,
  `tha-ap137` Rahosaññaka, `tha-ap14` Ekatthambhika, `tha-ap143` Atichattiya),
  cộng `thag1.1`-`thag2.2` và `thig1.3`/`thig2.1`/`thig2.2`. Dựng y hệt:
  "Bạch Thế Tôn, Tôn giả Trưởng lão <tên> đã từng nói bài kệ này."

  **Thuật ngữ và cách xử lý, đều có tiền lệ:**
  - "`Itthaṁ sudaṁ āyasmā` → *Bạch Thế Tôn*. 28/28 tiền lệ giữ nguyên `āyasmā` là"
    "Thế Tôn" và không dịch riêng `Itthaṁ sudaṁ` ("như thế này tôi đã nghe").
    `thig1.1` là ngoại lệ duy nhất, và nó khác vì bản ấy **không có** `āyasmā`
    (công thức `Itthaṁ sudaṁ aññatarā therī…`), nên không phải cùng dạng.
  - "`thero` → *Trưởng lão*, có tiền tố *Tôn giả* như 28 tiền lệ. Trong tầng này"
    `Tôn giả` đứng một mình có 3.829 lần, nên đây là cách gọi thông dụng của kho
    chứ không phải lựa chọn mới.
  - "`imā gāthāyo` (số nhiều) → *bài kệ này*. `thag2.1` (`imā gāthāyo`) và"
    `thig2.1`/`thig2.2` (`gāthāyo`) đều dịch "bài kệ này", nên tôi không thêm số
    nhiều bằng cách nào khác.
  - "`abhāsitthāti` (bị động) → *đã từng nói*. Giữ cả hai sắc thái: vừa "đã" (quá"
    khứ) vừa "từng" (thành thật, không phải thường).
  - "**Tên riêng giữ nguyên dạng Pāli** (Supāricariya), không bịa tên Việt — danh xưng"
    của các bậc A-la-hán, và 1.011 từ Pāli có dấu đã tồn tại trong tầng Việt
    theo đúng cách này.
  - "Pāli ở dạng Nom. sg. (`supāricariyo thero`) nên tôi **bỏ dấu hiệu Nom.** như 14 tiền lệ"
    cùng cuốn đã làm (`maggasaññako`→*Maggasaññaka*, `atichattiyo`→*Atichattiya*).
    Với `Nando` (tha-ap15) Pāli đã viết `nando` không dấu hiệu Nom. nên giữ nguyên.

  **Bất định đã ghi nhận, không giấu:**
  1. `Itthaṁ sudaṁ` về nghĩa là "như thế này tôi đã nghe", nhưng 28 tiền lệ — kể
     cả 14 bài cùng cuốn — đều **không** dịch vế này mà gộp vào "Bạch Thế Tôn". Tôi
     giữ nguyên cách đó để 42 bài `Itthaṁ sudaṁ` trong tầng Việt đọc nhất quán;
     đổi lại câu Việt ngắn hơn Pāli. Đây là quyết định **nhất quán với kho**, không
     phải đọc hợp lý nhất về mặt ngữ nghĩa. Nếu biên tập muốn dịch đủ vế "như thế
     này tôi đã nghe" thì phải sửa **cả 42 bài** cùng lúc, không sửa riêng lát này.
  2. 14 bài này **không có tầng Anh Sujato** (Sujato không phát hành tiếng Anh cho
     `tha-ap`) và **không có bản Hòa thượng Thích Minh Châu** (snapshot bilara đã
     ghim chỉ có Pháp Cú cho tiếng Việt). Nên tôi đọc Pāli trực tiếp, đối chiếu
     bằng 28 tiền lệ cùng dạng trong chính tầng Việt. `triangulation` 8.5 vì lý
     do này, không phải vì bản dịch chưa chắc.
  3. **Chốt `lọt_pāli` trong `_hvi.py` báo nhầm 12/14 tên** ở lần ghi đầu. Chốt
     cấm từ mang dấu Pāli "chưa từng dùng" trong tầng Việt, nhưng nó không có ngoại
     lệ cho tên riêng dù chính docstring của `_hvi.py` nói `_GIỮ` là chỗ dành cho
     "tên riêng" — và `_GIỮ` trên thực tế **không chứa tên riêng nào**. Vì vậy tên
     riêng chỉ qua được khi đã may mắn xuất hiện ở một tệp khác trước đó; 14 tên ở
     đây đều chưa từng xuất hiện. Tôi **không sửa `_hvi.py`** (được dặn rõ), mà tự
     tra chứng: mỗi tên phải khớp một từ thật trong Pāli của chính bài ấy, và chỉ
     bỏ qua khi **mọi** từ bị chặt đều là tiền tố của tên ấy. Lần ghi thứ hai thì
     14/14 pass, vì tên đã có trong tầng — chứng tứ chốt phụ thuộc thứ tự ghi, nên
     nó không phải tiêu chí chất lượng. Đây là điểm tôi muốn người biên tập xem
     lại: **tên riêng Pāli hợp lệ sẽ bị chặn nếu là lần xuất hiện đầu tiên.**
     Ngoài ra `_TỪ` của chốt thiếu U+1E41 `ṁ`, nên nó tách `Vaṭaṁsakiya` thành
     `Vaṭa` + `sakiya` — đã xác minh tầng Việt dùng `ṁ` (U+1E41) 1.137 lần so
     với `ṃ` (U+1E43) đúng 1 lần, và Pāli gốc dùng `ṁ` 21.236 lần, không có `ṃ`
     lần nào. Tôi giữ `ṁ` theo nguồn.
  4. Bài này chỉ có **một khoá đủ dài để tính là nội dung** (ngưỡng ≥ 40 ký tự
     của `content/meta/reference-gaps.yaml`). Các vế kệ và dòng `…pe…` đều ngắn
     hơn 40 ký tự nên không thuộc phạm vi dịch của lát này — cùng tiêu chí mà 14
     bài `tha-ap` đã có trong tầng cũng chỉ dịch đúng một khoá.

  **Không bỏ sót.** 14/14 bài viết đủ khoá (1/1), chạy lại `save_vi` cho từng bài
  cho thấy idempotent, JSON hợp lệ, NFC, 0 lỗi YAML metadata. Không có blocking
  error.
  ĐÍNH CHÍNH của người điều phối (có đo, đã merge cùng PR này): bản dịch ở khoá
  `tha-ap163:7.1` mở đầu bằng *Bạch Thế Tôn*, mà Pāli `Itthaṁ sudaṁ āyasmā <tên> thero imā
  gāthāyo abhāsitthāti.` **không có vocative nào** — thêm lời hô là thêm ý, vi phạm
  tiêu chí 2 (không thêm/bớt ý) và rơi vào tiêu chí 4 (không có căn cứ).
  Đo trên toàn tầng: cùng công thức Pāli đó có **41 khoá đã merge KHÔNG thêm lời hô**
  (mở đầu *Tôi nghe như vầy:*) và **28 khoá có** — tức bản thân kho đang tự mâu
  thuẫn trên cùng một câu Pāli. Đã sửa 28 khoá về đúng hình thức của nhóm 41, và
  `semantic_fidelity` hạ 9.4 → 9.2 để phản ánh đúng việc bản dịch đã từng cộng thêm.

  Giải quyết draft 2026-10-12: kiểm toán độc lập đọc đối kháng 29/29 khoá, đối chiếu Pāli từng chữ. Mục này THAY THẾ các mục cũ ở trên về bài này: đoạn nói bài chỉ có 1 khoá và chỉ nói "bài kệ này"; đoạn nói các khoá 3.4, 4.1, 4.3 đúng; và đoạn khẳng định "Không có blocking error". Lý do: các khoá thân bài trước đây có nhiều lỗi nghĩa thật (xem dưới), và bài thiếu bản Anh đã ghim nên phải mang blocker nói đúng điều đó.
  Phân loại blocker. (D, đã gỡ) "chỉ phủ 1 khoá có nội dung ... thiếu khoá": bản dịch hiện có đủ 29/29 khoá, tập khoá bằng tập khoá Pāli và đúng thứ tự; đây là blocker lỗi thời do cách chia lát cũ, không còn đúng nên gỡ. (A, ghi đúng sự thật) tầng english-sujato đã ghim không có thân kinh tha-ap: giữ một blocker noEnglishEditionUpstream để nói đúng giới hạn của upstream. (C) vietnamese-current chỉ có Pháp Cú: chỉ là giới hạn tham chiếu, đã ghi trong blocker trên chứ không phải lỗi văn bản. (B) không áp dụng: mẫu số coverage là 1 khoá (7.1), Sujato phủ 0/1, đây là bài không có Anh chứ không phải bài Sujato để trống một số đoạn.
  Lỗi nghĩa thật đã sửa, 7/29 khoá: (1) 1.4 cakkhumā bản cũ là "tinh mắn" (chữ vô nghĩa), sửa thành "bậc Có Mắt thuyết giảng Pháp" theo dạng đa số của tầng (9/13 khoá cùng Pāli). (2) 2.1 Yakkhānaṁ samayo āsi bản cũ "Có một thời thuộc về Dạ-xoa" không có nghĩa; sửa thành "Có một cuộc hội họp của các dạ-xoa". (3) 2.3 yena kiccena sampattā bản cũ "Bằng điều phước tuệ gì đã đạt được", không có phước hay tuệ trong Pāli; sửa thành "Vì công việc nào mà họ đã đến". (4) 2.4 ajjhāpekkhiṁsu tāvade bản cũ "dân chúng ở nơi ấy cứ chờ đợi": thêm chủ thể "dân chúng" và "nơi ấy" không có trong Pāli; sửa thành "ngay lúc ấy họ đã dõi nhìn" (chủ thể là các dạ-xoa ở 2.1). (5) 3.4 apphoṭetvā upaṭṭhahiṁ bản cũ "tôi nắm lấy rồi đến phụng sự" sai nghĩa động từ; apphoṭeti là vỗ tay (các khoá bv2:71.2, bv4:18.2, bv26:26.2 dịch "vỗ tay"), sửa thành "tôi đã vỗ tay rồi phụng sự". (6) 3.1 Buddhassa giramaññāya bản cũ "Với lời dạy của Đức Phật" bỏ mất aññāya (đã hiểu rõ) và đổi giraṁ (lời nói) thành lời dạy; sửa thành "Hiểu rõ lời của Đức Phật" theo 4/7 khoá cùng Pāli. (7) 4.3 Tiṁsakappasahassesu bản cũ "ba nghìn kiếp": xem mục số bên dưới.
  Sửa nhẹ, 4/29 khoá: 1.2 dvipadindo bản cũ bỏ mất inda (chúa tể), sửa thành "bậc chúa tể loài hai chân"; 5/5 khoá cùng Pāli trong tầng (tha-ap173:3.2, tha-ap178:1.2, tha-ap18:2.4, tha-ap206:1.2 và bài này) đều bỏ inda, nên đây là lỗi lan trong tầng chứ không phải tiền lệ đúng; các bài kia không thuộc phạm vi lượt này. 3.2 amatassa ca desanaṁ bản cũ thêm "pháp" và "của Ngài" ("bài pháp về bất tử của Ngài"), sửa thành "lời thuyết giảng về bất tử". 4.1 suciṇṇassa phalaṁ passa bản cũ thêm "nghiệp thiện"; sửa thành "hãy thấy quả báo của điều đã khéo thực hành" (cùng từ ngữ với tiền lệ tha-ap539, chỉ khác dấu câu). 5.2 samalaṅkatanāmako bản cũ thêm "vị vua" trước khi Pāli nói cakkavattī ở 5.4; sửa thành "có vị tên là Samalaṅkata". 1.1 "Vị ấy tên là" đổi thành "Vị có tên là" cho sát nāma nāmena; không đổi nghĩa. 2.2 avidūre mahesino chỉ đổi trật tự sang "không xa bậc Đại Ẩn Sĩ", không đổi nghĩa. Các khoá không đổi: 0.1–0.3, 1.3, 3.3, 4.4, 5.1, 5.3, 5.4, 6.1–6.4, 7.1, 8.1.
  Số Pāli, tự tính: Tiṁsakappasahassesu (4.3): tiṁsa = 30 (cùng tầng: ūnatiṁsa ở 5.1 là 29; ekūnatiṁsa là 29; tiṁsa không phải 3, vì 3 là ti), kappasahassa = nghìn kiếp, nên 30 nghìn kiếp = ba mươi ngàn kiếp. Bản cũ "ba nghìn kiếp" xem tiṁsa như 3: sai. Đo trên toàn tầng kn, khoá có Tiṁsakappasahass-: 43 khoá, 40 khoá dịch ba mươi ngàn/ba mươi nghìn, 3 khoá dịch ba nghìn hoặc ba trăm nghìn (trong đó có bài này); nên đa số và phép tính từ vựng cùng chỉ 30.000. Điều chưa kiểm chứng độc lập được là tầng Anh (không có), nên ghi lại để người biên tập biết: trước đây có một ghi chú điều phối đọc tiṁsa là 3, ghi chú ấy trái với phép tính từ vựng ở trên. Ūnatiṁse kappasate (5.1): ūnatiṁsa 29 x sata 100 = 2.900, "hai nghìn chín trăm kiếp", khớp bản dịch cũ và nhất quán với 30.000 ở 4.3 (vị vua ấy nằm trong khoảng 30.000 kiếp). Bảy món báu (sattaratana, 5.3) = 7; catasso (6.1) = 4; aṭṭhime (6.2) = 8; chaḷabhiññā (6.3) = 6; paṭhamaṁ (8.1) = thứ nhất. Không số nào khác.
  Tiền lệ đã đo: 12 khoá thân bài có Pāli trùng nguyên văn với bài khác; sau lượt sửa này 10 khoá dùng đúng nguyên văn bản Việt đã có, 2 khoá khác: 1.2 (có chủ ý, lý do ở trên) và 4.1 (chỉ khác dấu câu và chữ hoa); trong chính bài 0 cặp Pāli trùng. Thuật ngữ: Đại Ẩn Sĩ cho mahesi (đa số tầng), tịnh tín hân hoan cho pasannacitto sumano (66/91), khổ xứ cho duggati (12/16 khoá cùng Pāli ở khoá nupapajjahaṁ), Chuyển luân vương có đại thần lực cho cakkavattī mahabbalo (85/126, quy ước tầng).
  Chưa phân xử được, giữ trong notes chứ không thêm vào thân kinh: (1) 2.1 samayo: đọc là cuộc hội họp (cho khớp sampattā ở 2.3, những người đã đến); samaya cũng có thể là dịp hoặc thời điểm của dạ-xoa. (2) 2.3 và 2.4 ajjhāpekkhiṁsu: dạng này chỉ có một lần (ở chính khoá này) trong toàn bộ Pāli root đã ghim; dạng gần nhất là ajjhupekkhati ở mn101 với nghĩa nhìn mà không can thiệp, nên không có tiền lệ cùng dạng; hình thái là adhi + ā + pekkh, "nhìn, dõi theo, trông chờ"; chọn nghĩa trung tính "dõi nhìn". Hai cách đọc còn lại là "mong chờ" và "chăm chú trông", đều không đổi diễn tiến của bài kệ (các dạ-xoa tụ họp gần Đức Phật, rồi người nói hiểu lời Phật và phụng sự) nhưng khoá này bám Pāli yếu hơn các khoá còn lại. Vì vậy semantic_fidelity, grammar_logic và ambiguity_integrity bị hạ, không nâng để đạt ngưỡng. (3) 5.2 chủ thể: Pāli không có ahosiṁ hay ahaṁ; đọc trung tính "có vị tên là Samalaṅkata", tiền lệ cùng dạng ở tha-ap138 là "vị vua", ở tha-ap204 là "tôi là vị vua". (4) 7.1 "Tôi nghe như vầy" cho Itthaṁ sudaṁ: quy ước nhóm đa số của tầng, đã nêu ở phần trên là mâu thuẫn trong kho; Pāli không có ngôi thứ nhất, vấn đề này thuộc về một lượt rà toàn tầng, không sửa riêng bài này. (5) 0.2 Supāricariyavagga: 9/10 khoá cùng phẩm dịch "Phẩm Phục Vụ Tốt" (nghĩa từ nguyên của tên) và 1/10 (tha-ap164) dịch "Phẩm Supāricariya", trong khi các phẩm đặt theo tên khác (Bandhujīvaka, Kumuda) giữ nguyên tên Pāli; giữ "Phẩm Phục Vụ Tốt" cho khớp bài cùng phẩm, người biên tập nên phán một lượt cho cả phẩm. (6) 0.3 "Tuyên Ngôn": theo quy ước điều phối đã ghi.
  Phép kiểm: tập khoá Việt bằng tập khoá Pāli 29/29 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 29/29 (Pāli mở nháy kép ở 1.1, đóng ở 6.4; không có nháy đơn); dấu lược 0/29 khoá có; không khoá rỗng; NFC đủ; không chữ số trong thân kinh; không Pāli lọt sang tiếng Việt ngoài tên riêng (Paduma, Samalaṅkata, Supāricariya) và nhan đề Therāpadāna. translationTitle bằng đúng :0.3; :0.3 không bắt đầu bằng số nên không thêm số.
  Coverage English: mẫu số 1 khoá có nội dung (7.1); Sujato phủ 0/1; english-project 0; vietnamese-current 0 (tầng này chỉ có Pháp Cú). Mẫu số nhỏ nên cổng coverage hầu như không đo được gì; đây không phải sự đồng thuận về cách dịch mà là việc không có bản Anh nào để đối chiếu; bài chỉ dựa vào Pāli root và các khoá Pāli trùng trong tầng.
