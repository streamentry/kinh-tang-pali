  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2008, dựa trên ấn bản Buddha Jayanthi). 2 khoá bất đồng nghĩa → sửa 0, giữ 1 (1.2: bản nguyên bài hiểu dvipadindo là "chúa tể của loài người", còn Pāli dvipada là loài hai chân, inda là chúa tể; giữ "bậc chúa tể loài hai chân"), bất định 1 (5.2: bản nguyên bài thêm ngôi "tôi đã là" trước tên Samalaṅkata, Pāli không có động từ lẫn đại từ; giữ cách đọc trung tính "có vị tên là"). Các điểm từng được ghi là chưa phân xử (2.1 samayo, 2.4 ajjhāpekkhiṁsu, 3.4 apphoṭetvā, 4.3 và 5.1 về số kiếp) đều trùng hướng đọc với bản nguyên bài (hội họp; xem xét/dõi nhìn; vỗ tay; ba mươi ngàn kiếp; hai ngàn chín trăm kiếp), nên các cách đọc ấy không thay đổi và bất định về ajjhāpekkhiṁsu giảm nhưng không biến mất vì chỉ có một bản đối chiếu độc lập. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn (mỗi đoạn tương ứng một khổ bốn vế), không phải mức khoá; không có bản Anh.

  Quyết định hội đồng biên tập 2026-10-16: C5 — 0.3, 8.1 (tiêu đề và dòng kết theo "Ký Sự Về"; bỏ "Bài Kệ Tuyên Ngôn").
