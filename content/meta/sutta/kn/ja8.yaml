notes: |-
  8/9 khoá có English Sujato (sutta/kn/ja/ja8_translation-en-sujato.json có mặt); dòng kết 2.1 để trống. Sujato: Even though they do not hurry, / one who hopes for the fruit succeeds. / I am one whose spiritual life has ripened: / know this, chief. Cowell 8 dịch cùng bộ vế và cùng tiêu đề gợi ý.
  Tiền lệ đếm được: 0.3 `Apaṇṇakavagga` → Phẩm Bụi Dơ (ja1:0.3, ja2:0.3, 2 bài); `vipakka` → chín muồi (32 tiền lệ); `brahmacariya` → phạm hạnh (1.076 tiền lệ); `ataramāna` → hấp tấp (2 tiền lệ); `phala` → quả (143 tiền lệ).
  BẤT ĐỊNH thật sự ở 1.4 `gāmaṇī`: Sujato dịch là chief (tước vị), còn truyện Cowell 8 cho thấy người được gọi là vua Gāmaṇi (trước đó là hoàng tử Janni), tức đây là TÊN. Pāli root có `gāmaṇī` ở dạng tân ngữ nên tôi theo cách đọc tên, và ghi tên đúng với dấu dài của Pāli; giữ `Gāmaṇī` trong tiêu đề cũng theo tiền lệ Kinh Mitacintī, Kinh Udañcanī. Sujato dùng chức vị khi không chắc tên, đây là chỗ hai tầng lệch và Pāli + bối cảnh đã phân xử theo hướng tên.
  `phalāsāva` (1.2) là cách đảo cổ của Cowell đã ghi chú: gloss của bản chú giải đọc là `phalasā ti asaphalam`, tức quả của sự mong muốn. Tôi dịch là kẻ mong quả báo ấy, giữ cả hai vế của ý (mong — quả — đạt được) thay vì rút gọn.
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. 0.1 Jātaka giữ nguyên (58 bài đã có) và 0.2 Ekakanipāta → Bộ Một Bài Kinh (57 bài) theo tiền lệ đếm được. 1.1 mở nháy kép, 1.4 đóng nháy kép + dấu chấm, không giữ `ti.` (tiền lệ 51/57 bài; 10 bài mới hơn cũng bỏ). Dòng kết 2.1 dùng dấu phẩy (Kinh X, thứ N) theo làn sóng gần nhất ja108…ja119; kho còn 48 bài không dấu phẩy — ghi ở đây để biên tập chuẩn hoá sau, tôi không sửa bài ngoài lát. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Chú giải Jātaka-aṭṭhakathā bằng Pāli không truy cập được trong môi trường dịch này, nên bối cảnh lấy từ truyện E. B. Cowell, The Jātaka vol. I (bản 1895, tải từ archive.org); đây là lý do triangulation không lên cao. technical_integrity 10.0 căn cứ chốt _hvi.py đã pass và tự chạy lại script kiểm bổ sung (9/9 khoá khớp Pāli, NFC, ngoặc kép cân trên cả bài, không lệch dấu lược); npm run validate|test|build không chạy theo lệnh cấm của lát.
