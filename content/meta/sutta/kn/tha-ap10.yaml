notes: |-
  Dịch trực tiếp từ Pāli root, 65/65 khoá, đúng thứ tự Pāli. Không có tầng Anh đã ghim cho tha-ap nên không có đối chiếu English độc lập; xem blocking_errors.
  Tiền lệ: dựng chỉ mục Pāli sang Việt trên toàn tầng tha-ap (449 tệp). 31 khoá của bài có Pāli trùng nguyên văn với bài khác; 24 khoá dùng lại NGUYÊN VĂN bản Việt đã có, 7 khoá khác tiền lệ và đều có lý do ghi dưới đây. Trong chính bài có 2 cặp Pāli trùng (13.3 với 14.3 và 13.4 với 14.4), cả hai cặp đều có bản Việt giống hệt nhau; 0 cặp Pāli trùng mà Việt khác.
  0.1 Therāpadāna: 433/444 tiền lệ giữ nguyên tên Pāli. 0.2 Buddhavagga dịch Phẩm Phật theo 2/2 tiền lệ (tha-ap6, tha-ap7).
  0.3 và 17.1: Pāli 0.3 là Piṇḍolabhāradvājattheraapadāna, KHÔNG bắt đầu bằng số thứ tự nên không thêm số; translationTitle bằng đúng giá trị 0.3. Tên bài nhận khuôn Bài Kệ Tuyên Ngôn Về Trưởng Lão cộng tên. Hai dạng chính tả đo được trong tầng: toàn tầng khoá 0.3 có Tuyên Ngợ 234, Tuyên Ngôn 97, Ký Sự 96, Tuyên Ngợi 10; ở phạm vi gần nhất (tha-ap1 đến tha-ap60) Tuyên Ngợ 18, Tuyên Ngôn 8, Ký Sự 3, Tuyên Ngợi 2. Hai phạm vi cho đa số Tuyên Ngợ, nhưng đó là dạng sai chính tả; chọn Tuyên Ngôn theo hướng dẫn của người điều phối và tiền lệ tha-ap6, tha-ap13, tha-ap15, tha-ap38, tha-ap39. Người biên tập nên phán một lượt cho cả cuốn. 17.1 dùng lại đúng tên của 0.3 kèm thứ tám (aṭṭhamaṁ = thứ 8), theo khuôn tha-ap6:15.1.
  16.1 công thức lời kết: dùng nhóm 437 tệp Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này, không dùng dạng số ít đã từng nói bài kệ này.
  Số Pāli: aṭṭhamake (9.1) = thứ 8; catukkamo (2.2) = bốn chân (catu 4); catuddisaṁ (4.1) = bốn phương; sattaratana (9.3) = 7; catudīpa (9.4) = 4 châu; catusaṭṭhiyā (10.2) = catu 4 + saṭṭhi 60 = 64; kappasatasahassa (11.1) = sata 100 x sahassa 1000 = 100.000 (một trăm nghìn); catasso (15.1) = 4; aṭṭhime (15.2) = 8; chaḷabhiññā (15.3) = 6; aṭṭhamaṁ (17.1) = thứ 8. Không có cụm Tiṁsakappasahassa trong bài.
  Thuật ngữ đo được: lậu hoặc cho āsava (139 khoá tha-ap, so với 3 khoá lậu hoại); sanh y cho nirūpadhi (3/3 tiền lệ cùng Pāli); vô ngại giải, tám giải thoát, sáu thắng trí, lời dạy của Đức Phật (431, 38, 46, 404 tiền lệ cùng Pāli); Đại Muni cho mahāmuni; Dẫn Đạo thế gian cho lokanāyako; tịnh tín cho pasādetvā; bốn châu lục cho catudīpa; bảy món báu quý giá (47/88); đại thần lực cho mahabbalo; Bà-la-môn (16 khoá tha-ap).
  Bảy khoá khác tiền lệ cùng Pāli: 3.3 (tiền lệ ghi Nhờ thiền định đã viên mãn; Pāli vuṭṭhitassa samādhimhā là cách tuyệt đối sở hữu cách, Ngài vừa xuất khỏi thiền định, phù hợp tha-ap6:3.4); 6.1 (tiền lệ ghi Với lời dạy của Đức Phật, bỏ mất aññāya là đã nhận ra); 8.3 và 8.4 (tiền lệ là lời một người khác nói bằng ngôi tôi; ở đây Đức Phật nói nên dùng ta); 9.1 (tiền lệ ghi Cách đây tám kiếp về trước là quá khứ, trong khi động từ ở 9.2 là bhavissati, tương lai, nên dịch Từ nay, vào kiếp thứ tám); 10.3 (tiền lệ thêm hoa sen, bài này giữ Paduma là tên riêng); 11.1 (2 tiền lệ ghi Trong số một trăm nghìn kỳ; kappa được dịch là kiếp ở toàn tầng và Trong số không có căn cứ trong Pāli, nên dịch Sau một trăm nghìn kiếp).
  Khoá dùng lại tiền lệ dù chưa chắc: 1.2 sayambhū aggapuggalo dùng lại bậc tự tại, tối thắng giữa loài hai chân (5/5 tiền lệ); giữa loài hai chân là cách nói quen thuộc nhưng Pāli ở khoá này chỉ có aggapuggala, nên đây là một diễn đạt rộng hơn chữ Pāli. Chưa sửa vì đây là một quy ước đã có 5 khoá và thuộc về một lượt rà toàn tầng. 3.2 narāsabhaṁ dùng bậc trượng phu tối thượng theo 4/5 tiền lệ cùng Pāli, khác cách dịch đấng Nhân Ngưu (17 khoá) ở các dòng khác.
  BẤT ĐỊNH (không thêm vào thân kinh): (1) 10.2 mahiyā catusaṭṭhiyā: chữ lần không có trong Pāli; đọc theo khuôn catusaṭṭhikkhattuṁ rājā (tha-ap411:43.1) thành sáu mươi bốn lần, nhưng mahiyā catusaṭṭhiyā cũng có thể được phân tích khác. Con số 64 chắc chắn, đơn vị lần là suy luận. (2) 4.1 và 4.2 catuddisaṁ namassitvā: đọc catuddisaṁ là một túc từ (đảnh lễ bốn phương, và Đức Phật), không đọc là trạng từ chỉ đảnh lễ từ bốn phía; hai cách hiểu đều hợp ngữ pháp. (3) 2.4 vikkhambhanti: động từ chỉ trạng thái bị chấn động, sững sờ; chọn sững sờ, không thêm sợ hãi. (4) 12.2 brahmabandhu: nghĩa từ điển là người thuộc dòng Bà-la-môn theo huyết thống, chọn người dòng Bà-la-môn. (5) 2.3 và 7.3 saddaṁ: giữ tiếng, không thêm gầm; tiếng rống sư tử xuất hiện ở 4.4 và 8.2. (6) 1.3 purato: dịch phía trước; có thể là phía đông, chưa phân xử được.
  Phép kiểm tự viết, mẫu số ghi kèm: tập khoá Việt bằng tập khoá Pāli 65/65 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 65/65 (Pāli mở nháy kép ở 1.1, đóng ở 15.4; nháy đơn mở ở 6.3, đóng ở 6.4); dấu lược 0/65 khoá có (không có …pe… và không có … trần); không khoá rỗng; NFC đủ; không chữ số trong thân kinh; không Pāli lọt sang tiếng Việt ngoài tên riêng và nhan đề Therāpadāna. 31 cặp Pāli trùng với bài khác đã dò, 7 cặp khác tiền lệ (có lý do ở trên), 2 cặp trùng trong chính bài, 0 cặp Việt khác.
  Coverage English: mẫu số 2 khoá có nội dung (16.1, 17.1); Sujato phủ 0/2; english-project 0; vietnamese-current 0 (tầng này chỉ có Pháp Cú). Với mẫu số nhỏ như vậy cổng coverage hầu như không đo được gì: đây không phải sự đồng thuận về cách dịch mà là việc không có bản Anh nào để đối chiếu.
  Kỹ thuật: chưa chạy được các cổng trong lát này, technical_integrity đặt 9.6. Còn phải chạy: npm run validate, npm test, npm run check, npm run build.

  Lượt cải thiện 2026-10-11 (kiểm toán đọc đối kháng 65/65 khoá, đối chiếu Pāli từng chữ; đo lại tiền lệ toàn tầng tha-ap, 561 tệp): đổi 3 khoá, các khoá còn lại giữ nguyên.
  (1) 3.2 narāsabhaṁ: bản trước dịch bậc trượng phu tối thượng, tức đặt nhầm epithet bò đực giữa loài người (āsabha) vào chỗ purisuttama; số đếm thật trên toàn tầng cho narāsabha là đấng Nhân Ngưu chiếm áp đảo (khoảng 70 khoá) so với bậc trượng phu tối thượng chỉ 7 khoá lan từ một mẫu. Ghi chú cũ nói 4/5 tiền lệ là phép đo sai phạm vi và nay được thay bằng số này. Sửa thành tôi tiến đến gần đấng Nhân Ngưu, khớp đa số và khớp Pāli; đồng thời 3.2 không còn trùng chữ tối thượng với 4.2 naruttamaṁ. Phân loại lỗi: thuật ngữ epithet sai nghĩa nhẹ, 1 khoá.
  (2) 1.2 sayambhū aggapuggalo: bản trước giữ giữa loài hai chân, là chi tiết không có trong Pāli (ghi chú cũ đã tự nhận nhưng để nguyên vì có 6 tiền lệ; tiền lệ không phải lý do để thêm nghĩa). Số đếm cùng Pāli: giữa loài người 8 khoá, giữa loài hai chân 6 khoá, người tối thượng không thêm chi tiết 1 khoá. Sửa thành bậc tự tại, người tối thượng, bám đúng aggapuggala. Phân loại lỗi: thêm nghĩa ngoài Pāli, 1 khoá.
  (3) 11.1 kappasatasahassamhi: đây là thọ ký tương lai (11.4 bhavissati). Số đếm cùng Pāli: Sau một trăm ngàn kiếp nữa 10 khoá, Vào một trăm ngàn kiếp nữa 5 khoá, Sau một trăm nghìn kiếp 5 khoá, Trong số một trăm nghìn kỳ 2 khoá. Sửa thành Sau một trăm ngàn kiếp nữa theo dạng đa số, đánh dấu rõ mốc tương lai; con số 100.000 không đổi. Phân loại lỗi: lệch cách đánh dấu thì thọ ký, không sai số, 1 khoá.
  Kết quả đếm lỗi nghĩa thật: 2/65 khoá (3.2 epithet, 1.2 thêm nghĩa) cộng 1/65 lỗi nhẹ về đánh dấu thì (11.1); không có lỗi sai tên riêng hay danh từ chung, sai người nói, đảo phủ định, sai số lượng, hay tên vật hoặc thú. Đối chiếu từng dạng sai họ Therāpadāna đã biết: không có mặt trong bài này. tiṁsa không có trong bài; catusaṭṭhi (10.2) = 4 + 60 = 64 giữ nguyên; migarājā catukkamo (2.2) = chúa loài thú đi bằng bốn chân, đúng; caṅkami, apothayi, adāsahaṁ, anāsave (với nghĩa chật hẹp), saravegova, āmodiṁ kāmakāmī không xuất hiện. anāsavo ở 13.4 và 14.4 dịch không còn lậu hoặc, đúng.
  Điểm 10 tiêu chí giữ nguyên, final_score 9.02 không đổi: ba khoá sửa chỉ lấy lại phần điểm mà ghi chú cũ đã tính là yếu, và các tồn đọng thật còn đó nên không nâng. Con số 9.02 chỉ hơn ngưỡng 9.0 một khoảng rất mỏng, nên nên coi đây là bài sát ngưỡng chứ không phải bài chắc chắn.
  Tồn đọng KHÔNG sửa trong lượt này, đã đo nhưng thuộc quy ước toàn tầng hoặc chưa phân xử được: (a) 16.1 Tôi nghe như vầy cho Itthaṁ sudaṁ: Pāli là lời chốt của người kết tập, không có động từ nghe và không có ngôi thứ nhất; cụm Tôi nghe như vầy mở đầu 558 khoá cùng Pāli trong tầng, chỉ 2 khoá khác. Đây là thêm nghĩa mang tính hệ thống, cần người biên tập phán một lượt cho cả tầng, không sửa riêng một bài vì sẽ phá tính nhất quán. (b) 0.3 và 17.1 Tuyên Ngôn cho apadāna (tha-ap84 và nhóm Ký Sự dùng Ký sự): quy ước điều phối, đã ghi ở trên. (c) sayambhū dịch tự tại theo đa số tầng, nghĩa gốc là tự hiện hữu hoặc tự thân giác ngộ; chưa phân xử. (d) 2.4 vikkhambhanti sững sờ, 10.2 lần, 4.1 catuddisaṁ, 1.3 purato: giữ bất định như đã ghi. (e) 15.3 và 15.4 dùng đã ở phần thọ ký: Pāli dùng quá khứ phân từ trong lời tiên tri, giữ nguyên dạng phân từ, không thêm sẽ.
  Kỹ thuật không đổi: technical_integrity 9.6; vẫn còn phải chạy npm run validate, npm test, npm run check, npm run build.

  Quyết định hội đồng biên tập 2026-10-16: C5 — 0.3, 17.1 (tiêu đề và dòng kết theo "Ký Sự Về"; bỏ "Bài Kệ Tuyên Ngôn"); B2 — 1.2 (sayambhū = "bậc Tự Giác"); C6 — 8.4 (xưng hô: người kể "tôi", Đức Phật tự xưng "Ta", lời thưa với Đức Phật "con").
