notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên. Không có blocker. Bài sạch, và là một trong hai bài tốt nhất của lô.
  
  **Kệ nói một điều khó thật sự và bản dịch không làm mất sắc thái.** Ý là: từ khi xuất gia, **chưa từng** ý nghĩ nào không thuộc bậc Thánh mà chứa sân hận. Ba yếu tố phải giữ cùng lúc: (1) thời điểm (*Từ khi* — `Yato`), (2) phủ định quá khứ (*chưa từng* — `Nābhijānāmi`), (3) tiêu cực thuộc loại (không phải chỉ "không phải thánh giả", mà là **không thánh + có sân hận**). Bản dịch giữ đủ cả ba: `1.3` → *chưa từng biết một tư tưởng*, `1.4` → *nào không thuộc bậc Thánh mà chứa sân hận*. Chữ *chứa* (giữ `saṃhita`) và *thuộc bậc Thánh* (giữ `anariya`) đều hiện diện.
  
  **`Agārasmānagāriyaṁ` → *từ đời tại gia sang đời không nhà cửa*.** Đây là tên kỹ thuật của sự xuất gia (từ gia cảnh sang không gia cảnh). Bản dịch dùng đôi *đời tại gia* / *đời không nhà cửa* — vừa rõ vừa giữ được cách đối xứng của Pāli (hai phần tạo thành kép). Sujato dịch *from the lay life to homelessness* cũng hai vế. Tốt.
  
  **`saṅkappaṁ` → *một tư tưởng*.** `saṅkappa` = suy nghĩ, tư tưởng. Bản dịch dùng *tư tưởng* (Hán–Việt súc tích) chứ không phải *suy nghĩ* — đúng tinh thần AGENTS.md §5, giữ Hán–Việt khi nó cô đọng hơn.
  
  **Ngôi một ở `1.1` là `tôi`** (`ahaṁ`), theo đa số tầng (30 lần so với 7 lần `ta`). Xem ghi chú `thag1.21` về việc lô này dùng lẫn hai dạng.
  
  **Sujato lệch chiều ở `1.3`–`1.4`** (Sujato đặt *I've not been aware of any thought* ở `1.3` và *that is ignoble and hateful* ở `1.4`, trong khi Pāli `1.4` là `Anariyaṁ dosasaṁhitan`). Bản dịch bám Pāli — lần thứ sáu.
  
  **Tên riêng:** `Sañjaya` giữ dấu ở `0.4`, và `1.5` dùng `Sañjayo` (dạng chủ từ + o) theo Pāli ✓.
  
  **Tầng Anh** có mặt đủ bốn vế.
  
  **Tầng Việt**: không có Thích Minh Châu cho Trưởng Lão ở commit đã ghim.
