notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ja365.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 25 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Kiểm toán Jātaka chỉ có Pāli 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): đọc lại đủ khoá; sửa 4.2 (`api rajjampi kāraye` là ngôi thứ nhất "dù ta cai trị cả vương quốc", bản cũ gán cho người múa rắn nhường ngôi), 5.2 (`gabbhe tittaṁ` = hài lòng ở nhà, không phải "tâm tánh thuần hậu"), 4.4 và 3.4 (bỏ "sự bạo tàn của ngươi", "tàn nhẫn" không có trong Pāli). Đối chiếu bản Chalmers (Cowell, Jātaka III). semantic_fidelity +0,1 do sửa lỗi nghĩa thật; technical_integrity giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: C1 — `0.4`, `6.1` và translationTitle (tiêu đề giữ "Kinh X", bỏ đuôi "jātaka" hoặc "Chuyện Tiền Thân"; cùng tên Pāli thì cùng tên Việt); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
