notes: |-
  Đợt 19, làn 125. Dịch từ Pāli root commit đã ghim, đủ 775/775 khoá (cả hai khoá tiêu đề `0.1`, `0.2` và khoá kết `188.1`), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ hai của Buddhavaṃsa: chính Đức Phật Gotama thuật lại tiền thân Sumedha, vị Bà-la-môn ở thành Amaravatī từ bỏ của cải, tu khổ hạnh ở núi Himavanta, nằm xuống bùn làm cầu cho Đức Phật Dīpaṅkara đi qua, được thọ ký, rồi tìm ra mười ba-la-mật và được chư thiên, loài người chúc phúc. Ngôi kể là ngôi thứ nhất (ta); riêng hai câu thơ cuối (187.1–187.4) Pāli chuyển sang ngôi thứ ba (`so`), giữ là vị ấy. Lát trước bị ngắt giữa chừng không để lại tệp nào, bản này dựng lại toàn bộ từ Pāli.

  **Tiêu đề.** `0.1` Buddhavaṁsa → Dòng Kế Thừa Các Đức Phật (dùng lại nguyên văn các bv khác, 28/28). `0.2` Sumedhapatthanākathā → Câu Chuyện Về Nguyện Ước Của Sumedha: `patthanā` là nguyện ước, `kathā` là câu chuyện; tên Sujato ở tầng tên là Sumedha’s Wish. Khuôn số thứ tự như `bv1:0.2`, `bv3:0.2` ("2. …"). `188.1` kết bài: "Câu chuyện về nguyện ước của Sumedha đã kết thúc." cùng khuôn kết phần của các bv khác.

  **Số Pāli, đã tự tính.** `satasahasse` = sata 100 × sahassa 1000 = **100.000** (kiếp, 1.1; "một trăm ngàn kiếp", như `bv1`, `cp1:2.2`). `caturo asaṅkhiye` = **4** a-tăng-kỳ, dịch "bốn kiếp vô lượng" theo `cp1:2.2` (Pāli trùng nguyên văn, bản trước cùng chữ). `dasahi saddehi` **10** thứ âm thanh (2.1; chỉ liệt kê được voi, ngựa, trống, tù và, xe, tiếng mời ăn uống, Pāli không kể đủ mười). `sattaratana` **7** (3.3; "bảy món báu quý giá" như nhiều khoá `tha-ap`). `pañcadosa` 5, `aṭṭhaguṇa` 8, `navadosa` 9, `dvādasaguṇa` 12, `aṭṭhadosa` 8, `dasaguṇa` 10 (29–31), `sattāha` **7** ngày (33.3), `caturo nimitte` **4** (35.3), `ekokāsa` **1** chỗ (43.2). `catūhi satasahassehi` = 4 × 100.000 = **400.000** (45.3, "bốn trăm ngàn"; hiệu chuẩn bằng `bv3:15.1`). `dasasahassī` **10.000** (71.4, 84.1, 91.2, 166.4, 174.4, 184.4; "mười ngàn thế giới" như `bv1`, `bv11`, `bv16`–`bv19`). `sahassiya` **1.000** (80.1). `tividhaggi` **3** loại lửa (11.3). `tayo bhave` **3** cõi hiện hữu (58.2). `aṭṭhadhamma` **8** pháp (59.5): đếm đủ tám ở 59.1–59.4 (thân người; sự thành tựu về giới tính; nhân là được thấy bậc Đạo Sư; xuất gia; thành tựu đức hạnh; công hạnh phụng sự; ý muốn = 8 mục). `dasa pāramī` **10** (181.2, 181.4, 187.2). Thứ tự mười ba-la-mật khớp số: paṭhamaṁ 1 bố thí, dutiyaṁ 2 trì giới, tatiyaṁ 3 xuất gia, catutthaṁ 4 trí tuệ, pañcamaṁ 5 tinh tấn, chaṭṭhamaṁ 6 nhẫn nhục, sattamaṁ 7 chân thật, aṭṭhamaṁ 8 quyết tâm, navamaṁ 9 từ ái, dasamaṁ 10 xả. `navacchidda` **9** lỗ (24.2). `catūsu bhūmīsu` **4** (124.1). `ghaṭānekasahassāni` "nhiều ngàn", `kumbhīnañca satā bahū` "nhiều trăm": Pāli không cho số cụ thể (169.1–169.2). Không có cụm `Tiṁsakappasahassa`, `navuti`, `tālīsa`, `sattati`. Phép đo số chuyên dụng chỉ phủ chín cụm `navuti`/`tālīsa`/`sattati`…, không có cụm nào trong bài này nên không áp dụng; mọi số ở trên tự tính tay và đối chiếu lại từng khoá.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng kn (so Pāli sau khi bỏ dấu câu, chữ hoa, thẻ): 134 khoá của bài có Pāli trùng với khoá ở bài khác, tổng 704 cặp, trong đó 139 cặp bản Việt khác bản tôi viết; 89/134 khoá giống hệt mọi tiền lệ của chúng; các khoá còn lại lệch có lý do ghi ở dưới. Phần lớn trùng là công thức thọ ký của bv21–bv26 (`62.1`–`69.4`, `72.x`–`74.x`), giữ nguyên văn, đúng yêu cầu: `62.1` "Đã có nơi xinh đẹp mang tên Kapila," lấy đúng như `bv21:14.1`, `bv22:13.1`, `bv23:16.1`, `bv24:11.1`, `bv25:13.1`, `bv26:17.1` (6/6 bv, 0 lệch); `62.3` "Sau khi nỗ lực tinh tấn," 22/23; `68.5` "Cây Bồ-đề của Đức Thế Tôn ấy," 22/23. Trùng trong chính bài: 55 nhóm Pāli trùng (229 khoá), phần lớn là điệp khúc `dhuvaṁ buddho bhavissasi` (83–107), `na hete ettakāyeva …` (120, 125, 130, …, 160), `Imaṁ tvaṁ … tāva …`, `Vicinanto tadā dakkhiṁ …`; bản Việt trong từng nhóm giống hệt nhau (0 cặp lệch trong bài, đã hài hoà bốn khoá `89.3`/`91.3`, `129.1`/`139.1`, `165.2`).
  - Khoá lệch tiền lệ có chủ ý: `5.2` dùng "là bậc thành thạo ba Vệ Đà" (6/6 tiền lệ cùng Pāli, `bv5`, `bv15`, `bv26`…). `36.2` `nimantetvā tathāgataṁ` dịch "sau khi thỉnh mời Đức Như Lai," (động từ bất biến là `-tvā`, "sau khi"); 6 tiền lệ viết "đã thỉnh mời" vì có chủ ngữ rõ, ở đây câu lược chủ ngữ. `37.2` "am thất" (`assama`; 130 trên 162 khoá `assam-`; tiền lệ duy nhất đã dùng "trú xứ"). `40.1` dùng ngôi "ta" thay "tôi" như `bv21:10.1`, `bv28`, vì Đức Phật tự thuật (tiền lệ "tôi" ở `tha-ap` là lời của chính các vị trưởng lão). `45.3` "Cùng bốn trăm ngàn," giữ như `bv3:15.1`.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có, so Pāli với bản Việt cùng khoá).
  - `abhiññā` → "thắng trí": 15/15 khoá bv (177 trên 432 toàn kn; "thần thông" 8). `pāramiṁ gantvā` → "sau khi đạt ba-la-mật…": 9 khoá `gantvā` (`bv4`, `bv5`, `bv13`, `bv14`, `bv19`, `bv20`, `cp35` ba khoá), thêm 2 khoá `gato`; nên `gaccha` → "hãy đạt đến ba-la-mật…" và `gantvā` → "sau khi đạt ba-la-mật…". `pāramī` → "ba-la-mật" (bv1, cp). Tên mười pāramī theo `cp`: `dāna` bố thí, `sīla` trì giới, `nekkhamma` xuất gia (5 khoá `cp21`–`cp25`; nghĩa rộng hơn là xuất ly, xem bất định 25), `adhiṭṭhāna` quyết tâm (`cp26`), `sacca` chân thật (`cp27`–`cp32`), `mettā` từ ái (`cp34`, `cp35:13.3`), `upekkhā` xả (`cp35`), `khanti` nhẫn nhục (`cp35:12.3`); `paññā` trí tuệ (`thag17.2:35.1`); `vīriya` tinh tấn (0 tiền lệ pāramī cùng tên; "tinh tấn" 104 trên 234 khoá `padhān-`).
  - `nimitta` → "dấu hiệu" (25/25 trong bv; 57 trên 209 toàn kn, còn lại là "tướng"). `padhāna` → "nỗ lực tinh tấn" (46/46 trong bv). `jino` → "bậc Chiến Thắng"; `lokanāyako` → "bậc Dẫn Đạo thế gian"; `mahāmuni` → "Đại Mâu-ni" (126 trên 151) và `mahesi` → "Đại Ẩn Sĩ" (6 trên 151 `mahāmuni`, nhưng 85 trên 137 `mahesi`; hai Pāli khác nhau nên dịch khác nhau); `khīṇāsava` → "đã đoạn tận lậu hoặc" (28/28 bv); `tādī` → "bậc Bất Động" (`bv1`). `Himavanta` giữ nguyên (84 trên 100 khoá). `paṇṇasālā` → "chòi lá" (15 trên 17). `tāpasa` → "đạo sĩ khổ hạnh" (16; "đạo sĩ" 37 trên 43). `jaṭila` "người bện tóc". `sabbaññutā` → "toàn tri" (46 trên 89; "Nhất Thiết Trí" 13). `pīti` → "hỷ" (119 trên 146; bv 5/5). `kiṁ me … aññātavesena` xem bất định.
  - `añjasaṁ vaṭumāyanaṁ` (39.4, 40.6, 43.4) → "đường thẳng, đường cái, đường đi": đúng như `cnd21:40.2` (Pāli trùng nguyên văn, đã là nghĩa chú giải ba chữ). `uggatāpana` → "tu khổ hạnh mãnh liệt" (`bv18:10.2`, 3/3).
  - `osadhī` → "sao Mai": `ja506:1.2`, `ja523:14.2`, `pv13:10.4`, `pv14:11.4`, `pv15:29.4`, `ja535:44.2` đều dịch `osadhī` là "sao mai/sao Mai" (6 khoá; không có tiền lệ nào dịch "cây thuốc").
  - `ukkuṭṭhi` "hoan hô", `buddhabīja` "hạt giống Phật" (`bv4:17.4`, `bv26:25.4`), `kapilavhaya` "nơi mang tên Kapila" (`bv21`–`bv26`), `bodhimaṇḍa` "đạo tràng Bồ-đề", `pallaṅka` "kiết-già", `padakkhiṇa` "nhiễu bên phải" (tiền lệ các bv).
  - `Vedāna` → "Vệ Đà" (7 trên 22; "Veda" 9, "Vệ-đà" 2).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `2.1`–`2.6`: Pāli nói mười thứ âm thanh nhưng chỉ nêu voi, ngựa, trống, tù và, xe, và tiếng mời ăn uống; không thêm cho đủ mười. `Bherisaṅkharathāni` đọc ba danh từ nối nhau (`bheri`, `saṅkha`, `ratha`), dịch "tiếng trống, tiếng tù và và tiếng xe". `Khādatha pivatha ceva` là lời mời ăn uống, không đóng nháy vì Pāli không có.
  2. `5.4`, `34.2`: `sadhamme pāramiṁ gato` giữ "đã đạt đến sự thông suốt trong pháp của mình" theo tiền lệ `bv26:11.2` (nghĩa `sadhamme` = pháp của chính mình, tức truyền thống Bà-la-môn); `vasībhūtassa sāsane` dịch "bậc tự tại trong giáo pháp", không thêm "của mình" vì Pāli không nói.
  3. `7.1`–`7.4`: `sahaṁ` đọc là `so ahaṁ` ("ta khi ấy"); `nibbuti` → "sự tịch tịnh".
  4. `8.2`, `20.2`, `22.2` `nānākuṇapa-`: `kuṇapa` có nghĩa xác chết, vật thối rữa; dịch "các thứ thối rữa" để không nói quá về xác chết.
  5. `19.1`–`19.4`, `25.1`–`25.4` `corehi`: công cụ cách số nhiều; đọc "gặp bọn trộm cướp" (đi trong vùng có trộm cướp). Cách đọc khác "đi cùng bọn trộm" không hợp với `bhaṇḍacchedabhayaṁ` (sợ mất hàng).
  6. `14.1`–`14.2`: `kilesamaladhovaṁ` là tính từ của `amatantaḷe` (hồ nước bất tử rửa sạch cấu uế phiền não); Pāli dùng `amatantaḷe` ở cả `14.2` và `14.4`.
  7. `29.4`, `33.4`: `abhiññābalamāhariṁ` và `abhiññābalapāpuṇiṁ` đều "đã đạt được sức mạnh của các thắng trí" (`āharati` "mang lại, đạt được").
  8. `35.1`–`35.4`: bốn dấu hiệu (`caturo nimitte`) là bốn biến cố (khởi sinh, đản sinh, giác ngộ, thuyết Pháp) nêu ở `35.1`–`35.2`; Pāli chỉ nêu số bốn và hai vế đó nên dịch sát chữ.
  9. `42.3` `bījāni ropissaṁ`: hình ảnh gieo hạt giống (công đức); giữ nghĩa đen, không giải thích.
  10. `43.2`: lời của Sumedha nói với dân chúng, dùng ngôi "tôi" (lời đối thoại), còn ngôn ngữ nội tâm và thuật dùng "ta".
  11. `55.1` `aññātavesena`: "với dáng vẻ vô danh" (hình tướng không ai biết); `56.2` `thāmadassinā`: "phô bày sức mạnh" (`thāma` = sức mạnh, `dassin` = người thấy/ phô bày). Cả hai đều hiếm, không có tiền lệ trong tầng; giữ sát chữ.
  12. `59.1` `liṅgasampatti`: "sự thành tựu về giới tính" (không thêm "nam"); `59.4` `adhikāra` "công hạnh phụng sự" (cùng gốc `57.1` `adhikārena`), `chandatā` "ý muốn".
  13. `80.1` `sahassiyamhi lokamhi`: "trong một ngàn thế giới" (`sahassī` = nghìn); cách đọc "thế giới ngàn bậc" (tiểu thiên) không có chứng cứ.
  14. `91.1` `mahāsamuddo ābhujati`: "Đại dương chao động" (`ābhujati` nghĩa gốc "uốn, cuộn"); `92.1` `nirayepi dasasahasse`: "các địa ngục của mười ngàn thế giới" (`dasasahasse` bổ nghĩa theo mạch).
  15. `101.1` `rajonuddhaṁsati uddhaṁ`: đọc `rajo na uddhaṁsati` = "bụi không bay lên cao", hợp mạch các điềm lành (`100.1` không còn sợ hãi). Cách đọc khác "bụi bốc lên cao" ngược mạch điềm lành.
  16. `108.2` `dasasahassīna cūbhayaṁ`: đọc "và (lời) của những vị trong mười ngàn thế giới, cả hai (lời)"; không thêm "chư thiên" dù mạch gợi ý.
  17. `114.1` `āpannasattānaṁ`: "những người đang có thai" (tiếng Pāli chuyên dụng cho phụ nữ có thai); `114.2` `bhāramoropanaṁ` "việc đặt gánh nặng xuống" (sinh nở).
  18. `124.1` `catūsu bhūmīsu`: "trong bốn địa", không giải thích; `143.4` `na karoti paṭighaṁ tayā`: `tayā` không phân xử được (công cụ cách của đại từ ngôi hai hay dạng của `tena`), dịch "không sinh sân hận vì điều ấy", không quyết định.
  19. `148.1` `osadhī nāma`: "sao Mai" theo tiền lệ 6 khoá; Pāli chỉ nêu `osadhī`, ý "ngôi sao" lấy từ cách dùng quen thuộc của chữ này; `tulābhūtā` "như cán cân".
  20. `166.2` `sabhāvasarasalakkhaṇe`: đọc ba thành tố `sabhāva` (tự tính), `sarasa` (tác dụng), `lakkhaṇa` (đặc tướng); "tác dụng" cho `sarasa` là một lựa chọn, có thể là "vị".
  21. `168.2` `buddhassa parivesane`: "ở nơi dọn thức ăn cho Đức Phật" (`parivesana` = chỗ phân phát thức ăn); không có chứng cứ độc lập để nói rộng hơn.
  22. `174.2` `buddhabhūmiṁ`: "Phật địa"; `182.4` `jinabodhiyaṁ`: "trong sự giác ngộ của các bậc Chiến Thắng" (`bodhi` có thể là cây Bồ-đề, nhưng ở `182.2` đã có `bodhimaṇḍa`).
  23. `187.1`–`187.4`: Pāli chuyển sang `so` (vị ấy) ở câu cuối; giữ "vị ấy", không đổi thành "ta".
