notes: |-
  **ĐỌC TOÀN BỘ PĀLI TRƯỚC KHI VIẾT.** 101 khoá, đủ và đúng thứ tự Pāli; sau khi ghi đã in lại từng cặp Pāli↔Việt và đọc.

  **`:0.3` — BỎ SỐ.** Pāli `tha-ap51:0.3` = `Subhaddattheraapadāna`, không bắt đầu bằng số ⇒ bản Việt không có số thứ tự; `translationTitle` bằng đúng giá trị `:0.3` của bản Việt.

  **CHỌN `Tuyên Ngôn` — SỐ ĐO PHÂN KỲ, GHI CẢ HAI.** Đo trên các tệp `tha-ap` đã có bản Việt (495 tệp, trừ chính bài; bỏ số đầu `:0.3`), tính theo dạng chữ trong tiêu đề: toàn tầng `Tuyên Ngợ` 251 · `Tuyên Ngôn` 128 · `Ký Sự` 109 (cộng 5 tệp dạng `Kinh Kệ Của Trưởng Lão` và 1 dạng khác); phạm vi gần (uid 40–60, 18 tệp) `Tuyên Ngợ` 10 · `Tuyên Ngôn` 5 · `Ký Sự` 3; cùng phẩm Upāli (tha-ap45–52, 7 tệp) `Tuyên Ngôn` 4 · `Ký Sự` 2 · `Tuyên Ngợ` 1. `Tuyên Ngợ` có đa số số lượng nhưng là chính tả sai (không thành từ); tôi chọn dạng đúng chính tả `Tuyên Ngôn` (cũng là dạng của bài liền kề tha-ap52) và báo để biên tập phán một lượt cho cả cuốn.

  **CÁC CỤM SỐ — TỰ TÍNH, KHÔNG CHÉP.** `satasahassito kappe` (`:19.1`) = sata 100 × sahassa 1000 = **100.000** ⇒ *một trăm ngàn kiếp trước đây* (tiền lệ Pāli trùng nguyên văn: 26 khoá thêm chữ *đại* — *một trăm ngàn đại kiếp* — mà Pāli không có; 6 khoá *một trăm ngàn kiếp trước đây*; 3 khoá *một trăm ngàn kiếp trước*; 2 khoá *một trăm ngàn kiếp nữa*; chọn dạng 6 khoá vì không thêm chữ ngoài Pāli). `dasasahassi kampatha` (`:2.2`) = dasa 10 × sahassa 1000 = **10.000** ⇒ *mười ngàn thế giới đã rung chuyển*, dùng lại nguyên văn tha-ap472:4.2 (chữ *thế giới* là cách hiểu của dạng `dasasahassī` theo tiền lệ, Pāli của khoá không nêu danh từ). `sattayojanika` = satta 7 + yojana ⇒ *bảy do-tuần*. `catasso` (`:25.1`) = **bốn**. Số thứ tự: `pañcama` = *thứ năm* (`:15.1`), `navama` = *thứ chín* (`:27.1`); khớp vị trí trong phẩm (tha-ap50 là thứ tám, tha-ap52 là thứ mười). Bài **không** có cụm `tiṁsa`/`kappasahassa` nên không phải xử lý bất định `Tiṁsakappasahassa` (3.000 hay 300.000; đo tầng `tiṁsa` = 30) — không dùng đến, ghi để người biên tập biết.

  **DÙNG LẠI NGUYÊN VĂN.** Dò toàn tầng `tha-ap` (495 tệp, trừ chính bài): **31** khoá Pāli của bài có Pāli trùng nguyên văn ở nơi khác; trong đó **24** khoá dùng lại nguyên văn bản Việt đã có (tiêu biểu: `:0.1` `Therāpadāna` 484 tệp; `:0.2` *Phẩm Upāli* 7 tệp; `:1.2` *bậc tiếp nhận lễ vật hiến cúng;* 18; `:3.3` *Hân hoan với tâm hoan hỷ,* 8; `:4.1` *Nhờ thấu rõ ý định của tôi,* 12; `:4.4` 23; `:5.3` 9; `:5.4` 4; `:10.2` 22; `:14.3`/`:18.3` 18; `:14.4` 6; `:18.4` 18; `:25.1` 481; `:25.2` 667; `:25.3` 450). **7** khoá Việt khác bản trùng, đều có lý do: `:6.3` (*làm vua ở nơi ấy* thay *cai trị nơi đó*, theo `devarajjaṁ karissati` ⇒ *làm vua cõi trời*, tha-ap35:7.2); `:7.1` (*Cũng bằng cách ấy* thay *Chính nhờ phương tiện ấy*, 1 tiền lệ tha-ap441:4.3, cùng nghĩa nhưng ở đây là lời dẫn vào câu *sau khi dâng vòng hoa*, nên tôi chọn cách nói rõ hơn); `:8.3` (*từ chúng ấy*, vì `kāya` ở `:6.2`/`:8.1` dịch là *chúng chư thiên Đâu-suất* theo tha-ap472:3.1, giữ nhất quán trong bài; tiền lệ tha-ap404:9.1 là *thân ấy* trong ngữ cảnh khác); `:10.3` (*bậc Chánh Đẳng Giác* thay *Đức Toàn Giác*, theo đa số — xem mục `sambuddha` dưới); `:12.3` (`Satthāraṁ` = *bậc Đạo Sư*; hai tiền lệ *Đảnh lễ Đấng Thiện Thệ* tha-ap149:2.3 và *Tôi phát khởi một tâm tịnh tín duy nhất* tha-ap140:3.3 đều không khớp Pāli — `satthā` là bậc Thầy chứ không phải `sugata`, và tha-ap140:3.3 lệch cả khoá; không theo); `:16.2` (bỏ chữ *an nhiên* của 2 tiền lệ vì Pāli `ekaggo susamāhito` không có chữ nào tương ứng); `:18.2` (*tôi* thay *ta*, theo ngôi kể bên dưới). **Pāli trùng trong chính bài:** 1 cặp (`Sabbāsave pariññāya,` ở `:14.3` và `:18.3`), Việt giống nhau; 0 cặp trùng mà Việt khác.

  **NGÔI KỂ: *tôi* cho vị trưởng lão, *Ta* cho Đức Phật.** Phạm vi gần (tha-ap45–52, trừ chính bài) số khoá có *tôi* 46 · có *ta* 12; toàn tầng chia gần đôi. Giữ *tôi* ở phần trưởng lão tự thuật, *Ta* ở lời Đức Phật (`:5.1–:14.4`), theo bài liền kề tha-ap52.

  **`sambuddha` — `Chánh Đẳng Giác`.** Đo toàn tầng (167 khoá có Pāli chứa `sambuddh-`, không tính `sammāsambuddha`): *Chánh Đẳng Giác* 99 · *Toàn Giác* 43 · *Chánh Giác* 12 · khác 13. Dùng *Chánh Đẳng Giác* theo đa số cho `sambuddha` ở `:2.1`, `:4.3`, `:10.3`, `:11.1`. Chú ý: bài liền kề tha-ap52 (cùng phẩm) dùng *Chánh Giác* (số đo toàn tầng cho dạng này chỉ 12/167) và `sammāsambuddha` (`:14.2`) cũng dịch *Chánh Đẳng Giác* theo tiền lệ tha-ap35:4.4 — hai từ Pāli khác nhau cùng một chữ Việt, đúng như tiền lệ toàn tầng; báo để biên tập phán.

  **`lokanāyaka` (`:11.2`).** Hai dạng: *bậc Đạo sư của thế gian* 4 khoá · *bậc Dẫn Đạo thế gian* 3 khoá. Chọn *bậc Dẫn Đạo thế gian* để không trùng chữ *Đạo Sư* đang dùng cho `satthā` (`:4.2`, `:12.3`).

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
    · `pacchā me āsi bhaddakaṁ` (`:22.4`) — Pāli đứng sau `vācaṁ bhāsiṁ abhaddakaṁ` (`:22.2`, lời không tốt đẹp) và `Tena kammavipākena` (`:22.3`, do quả của nghiệp ấy) nhưng kết bằng `bhaddakaṁ` (tốt lành); đọc xuôi thì nghiệp lời xấu cho quả tốt, trái logic nhân quả thông thường. Tôi dịch sát chữ (*về sau, điều tốt lành đã đến với tôi*) và không sửa Pāli; có thể là chính tả/đọc khác của bản truyền (dạng phủ định `abhaddakaṁ` sẽ thuận nghĩa hơn) hoặc một cách nói kín mà Pāli không giải thích. Cần người biên tập phán.
    · `Āraddho ca ayaṁ pañho` (`:12.1`) — `āraddha` có thể là quá khứ phân từ của `ārabhati` (*được khởi sự*) hoặc của `ārādheti` (*được làm hài lòng/thỏa mãn*, như `āraddhacitta`); `pañho` là *câu hỏi* nên chủ ngữ của `tuṭṭho ekaggamānaso … yācayissati` (`:12.2–4`) phải là vị trưởng lão chứ không phải câu hỏi. Dịch sát chữ *Và câu hỏi này đã được khởi sự* và thêm *vị ấy* ở `:12.2` làm chủ ngữ ngầm; không chọn nghĩa *thỏa mãn* vì Pāli của khoá không nêu.
    · `Sattayojanikaṁ āsi, thūpañca ratanāmayaṁ` (`:20.1–2`) — tính từ `sattayojanikaṁ` (7 do-tuần) không nêu danh từ riêng; `thūpa` ở dòng sau. Tôi gộp ý ở `:20.1` thành *một ngôi tháp bảy do-tuần* và để `:20.2` *làm bằng châu báu*, tức đưa `thūpa` lên một dòng trong cùng khổ; khó xác định 7 do-tuần là chiều cao hay bề rộng nên không thêm chữ nào cho kích thước.
    · `tagarāmallikāhi` (`:3.2`) — `tagara` dịch *trầm hương* theo 1 tiền lệ duy nhất (tha-ap298:2.3 *Cả chiên-đàn lẫn trầm hương*); nếu `tagara` là loại cây hương riêng chứ không phải `agaru` (trầm) thì chữ này cần xét lại; tôi không kiểm được trong tầng. `candanaṁ` dịch *chiên-đàn* theo cùng tiền lệ.
    · `āropayiṁ naruttamaṁ` (`:3.4`) — `āropeti` + đối cách `naruttamaṁ`: dịch *dâng lên bậc tối thượng giữa loài người*; cách đọc *đặt lên (thân) bậc tối thượng* cũng khả dĩ (`:5.1–2` nói *phủ lên Ta*, nhất quán với cách đọc thứ hai). `pūrayitvāna` (`:3.1`) không nêu vật chứa, dịch *chất đầy chiên-đàn* chứ không bổ sung.
    · `Tadā sopagato santo` (`:10.1`) — `upagato` không nêu nơi đến, `santo` có thể là *an tịnh* hoặc *hiện là* (tiền lệ tha-ap91:1.3 `Pabbajjupagato santo` dịch *người xuất gia tịch tịnh*); dịch *Khi ấy vị ấy đã đến, là người an tịnh*.
    · `dhammasotaṁ upānayi` (`:17.4`) — `upānayi` (đưa đến gần) có tân ngữ `dhammasotaṁ`; chủ ngữ ngầm là Đức Phật (`kathayanto`, `:17.3`). Dịch *Ngài đã đưa dòng Pháp đến gần tôi*, thêm *tôi* làm tân ngữ gián tiếp ngầm; cách đọc khác (*tôi đã đưa mình đến dòng Pháp*) không loại hẳn được.
    · `jalajuttamanāyako` (`:19.2`) — đọc là danh hiệu của đức Padumuttara (`jalajuttama` ≈ *tối thượng giữa loài sinh từ nước*, cùng gốc với tên *Hoa Sen Tối Thượng*); tiền lệ 9 khoá `jalajuttamanāmako` dịch *được gọi là bậc Tối Thượng Tựa Hồng Sen* (và 2 khoá `jalajuttamanāmake`/`-nāmakaṁ` dịch *Tối Thượng Tựa Sen Hồng*), theo đó dịch *bậc Dẫn Đạo Tối Thượng Tựa Hồng Sen*.
    · `mahānāgo` (`:9.1`) — tiền lệ 22 khoá cho nhiều cách khác nhau (*Đại Nāga*, *Đại Long*, *long tượng*, *voi đực lớn*); chọn *bậc Đại Long Tượng* làm danh hiệu của Đức Phật, không giải thích trong thân kinh.
    · `varuttamaṁ` (`:7.2`) — đọc là tính từ của `mālaṁ` (*vòng hoa thượng hạng*); cách đọc `varuttama` là bậc tối thượng (Đức Phật) là tân ngữ nhận hoa khó khớp ngữ pháp nên bỏ.
    · `sabbabhaddaṁ manoramaṁ` (`:20.4`) — `sabbabhadda` không có tiền lệ; dịch *hoàn toàn tốt đẹp*, không nâng thành tên riêng.
    · `hito kāruṇiko jino` (`:23.4`) — `hita` dịch *đem lại lợi ích*; tiền lệ `kāruṇiko` *đầy lòng thương xót*/*đầy lòng từ bi*.
    · `nimmānaṁ` (`:6.4`) — giữ tên *cõi Nimmāna* theo tiền lệ tha-ap460:2.2; không quy ra tên cõi trời trong thân kinh.
    · `kāya` (`:6.2`, `:8.1`, `:8.3`) — dịch *chúng chư thiên* theo tha-ap472:3.1, không dịch *thân*.
    · `dāni` (`:24.1`) — dịch *ngay bây giờ*; tiền lệ `natthi dāni punabbhavo` là *nay* hoặc *bây giờ*. `upasampadā` ⇒ *thọ cụ túc giới* (tiền lệ trong kho cho `pabbajjā`/`upasampadā` ít nhất 7 khoá), `parinibbānaṁ` ⇒ *nhập Niết-bàn* theo cách các bài tha-ap dịch.

  **LỜI KẾT `Itthaṁ sudaṁ … abhāsitthāti`.** Dùng nhóm đa số: *Tôi nghe như vầy: Tôn giả Trưởng lão Subhadda đã nói những bài kệ này.* (407 tệp), không dùng dạng số ít *bài kệ này* (21).

  **NHỊP LỜI KỂ.** Pāli có `15.1 Pañcamabhāṇavāraṁ.` là dấu phần tụng giữa bài; dịch *Phần tụng đọc thứ năm.* (11 khoá toàn tầng: 7 khoá *Phần tụng đọc thứ N*; 4 khoá dạng khác: *Lần thứ…*, *Lần tuyên ngợ thứ…*, *Tụng phẩm thứ…*).

  **COVERAGE ĐO ĐƯỢC.** Mẫu số = **1** khoá Pāli có nội dung (≥ 40 ký tự, loại `:0`), là `:26.1` (61 ký tự) — câu kết, không phải kinh văn; 97 khoá còn lại (ngoài 3 khối `:0`) đều dưới 40 ký tự. Tầng Anh Sujato 0/1; manifest chỉ liệt kê tệp Pāli root cho `tha-ap51`, không có tệp Anh; `vietnamese-current` và `english-project` không phủ phẩm này. Theo BRIEF, đây là trường hợp cổng coverage gần như *không đo được gì* chứ không phải *không cần ghi nhận gap*.

  **DẤU LƯỢC.** Pāli có đúng một `…pe…` ở `:25.2` ⇒ Việt giữ đúng một `…` (667 khoá cùng Pāli đều là `…`). Pāli không có `(…)`; bản Việt cũng không có.

  **NGOẶC.** Pāli mở `“` ở `:1.1` và đóng `”` ở `:25.3`; mở `‘` ở `:5.1` và đóng `’` ở `:14.4`. Đếm từng khoá, khớp Pāli: `“` 1/1 · `”` 1/1 · `‘` 1/1 · `’` 1/1; 0 khoá lệch. Dấu `ti` đóng trích không có.

  **TỰ KIẾM.** Tập khoá Việt = tập khoá Pāli (101/101), thứ tự khớp; NFC 0 lỗi; 0 khoá rỗng; 0 khoảng trắng thừa; dấu cuối khoá khớp Pāli ở mọi khoá; 0 từ Pāli lọt sang Việt ngoài tên riêng và từ giữ nguyên (`Therāpadāna`, `Upāli`, `Padumuttara`, `Nimmāna`, `Upavattana`, `Kassapa`, `Tissa`, `Subhadda`, `Sakya`).

