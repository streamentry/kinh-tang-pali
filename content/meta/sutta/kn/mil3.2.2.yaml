notes: |-
  THUẬT NGỮ MỚI (0 tiền lệ cho ba từ sau, đã tra). hetu, paccayo → nhân, duyên (tôi dùng cái nhân, cái duyên để giữ số từ của Pāli: mỗi cụm lặp hai lần hetu và paccayo, và cả ba vế 1.5, 2.6, 2.7 đều có cấu trúc đó). uparamā → đến tận cùng. dhaññāgāra → kho lúa. gahapatika → người nông dân. yathāsambhatañca dhaññaṁ → đống lúa như cũ.

  MỘT VẾ DÙNG LẠI NGUYÊN VĂN, VÀ MỘT BẤT NHẤT PHẢI GHI. 2.4 Āma, bhante, jāneyyā”ti. trùng byte-for-byte với mil3.5.9:2.3, và tôi dùng lại nguyên văn: Vâng, thưa tôn giả, người ấy biết. Hệ quả là vế này KHÔNG giữ tiếng từ ti trong khi bảy khoá hội thoại khác của tôi đều giữ. Tôi chọn nguyên văn vì luật Pāli trùng thì cách dịch phải khớp, và ghi rõ ở đây để người biên tập biết là có một ngoại lệ; nếu chuẩn hoá thì sửa mil3.5.9 trước.

  CHỐT LƯỢC. 2.3 So aparena samayena là bấy giờ sau ấy, không phải sau này. yathā paccayaṁ vā kareyya là hoặc tùy theo duyên mà hành động; từ này hơi cụt trong Pāli, tôi dịch theo nghĩa gần nhất và ghi ở đây thay vì diễn giải trong thân kinh.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của kiểm cổ chỉ quét khoá Pāli từ 40 ký tự trở lên; ở bảy bài Jātaka của lát này mọi vế kệ đều ngắn hơn ngưỡng đó (vế dài nhất 35 ký tự) nên assertion về bản chất KHÔNG chạy. Tôi tự quét lại TOÀN BỘ 238 khoá của 14 bài từ tệp đã ghi trên đĩa: đủ khoá và không thừa so với Pāli (sắp theo thứ tự số), không rỗng, chuỗi NFC, số dấu lược khớp từng khoá, không có (…), không thừa dấu lược, và số dấu nháy kép so với Pāli từng khoá. Kết quả: 0 lỗi trên 238 khoá.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… hay dấu lược — đã kiểm bằng script trên từng khoá. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không mở rộng, không nén, không có (…) đứng một mình.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Tôi tự dựng chỉ mục Pāli↔Việt bằng script: nạp 5.764 tệp Pāli trong .cache/upstream/suttacentral/root/pli (bỏ *.apfs-orphan) và 4.136 tệp Việt dự án trong content/translation/vi/project/sutta — tổng 112.947 khoá Việt — ghép theo khoá, rồi quét từng khoá thân bài của lát theo nguyên văn căn thẳng và theo dạng đã chuẩn hoá dấu câu, nháy kép, hoa thường, và loại bỏ chính 14 tệp của lát để đo đúng trạng thái trước khi tôi ghi. Kết quả: 44 cặp Pāli trùng ở thân bài, 42 trùng byte-for-byte và 2 trùng sau chuẩn hoá. Trong đó 33 cặp đã có bản Việt ở bài khác, tôi DÙNG LẠI NGUYÊN VĂN ở: ja275 2.3, 2.4, 3.1, 3.2, 3.3, 3.4 ← ja274; ja294 3.1 ← sn1.1; mil3.1.11 3.2 và 3.3 ← sn10.12:5.2 và 5.3 (tôi lấy cả bộ bốn vế ở sn10.12:5.1–5.4 để bài này không tự mâu thuẫn với bài nguồn); Opammaṁ karohī ở mil3.1.11:2.1, mil3.1.14:2.1, mil3.1.15:2.1, mil3.2.2:2.1, mil3.5.10:2.1, mil3.7.16:2.1; mil3.1.14 3.1 ← mil3.1.12:3.1 và 3.5 ← mil3.1.12:3.4; Kallosi ở mil3.1.11:4.1, mil3.1.14:4.1, mil3.1.15:3.1, mil3.2.2:3.1, mil3.2.9:2.1, mil3.5.10:3.1 ← 54 tệp mil khác; mil3.2.2 2.4 ← mil3.5.9:2.3; mil3.5.10 6.1 ← mil3.4.10:5.1 và mil6.2.10:5.1; mil3.7.16 5.1 ← mil3.1.16:6.1. Mười một cặp còn lại thì chưa bản Việt nào ở bài khác có, tôi phải đặt mới: ja294 2.1 và 2.2, ja295 2.1 và 2.2 (bốn khoá này là hai cặp trùng nhau — chính bài trong lát đã trùng nhau; tôi đặt một lần rồi dùng lại nguyên văn cho cả hai bài), ja295 1.3 và 1.4 (trùng ja308:1.3 và 1.4), ja297 1.2 (trùng ja429:6.2 và ja430:6.2), ja298 1.2 (trùng sáu chỗ trong ja547), mil3.1.11 1.3 và 2.4 (trùng nhau, chỉ khác ở dấu nháy) và mil3.2.9 5.1 (trùng mil6.1.9:12.1). Ghi lại đây để lát sau dùng lại nguyên văn của tôi thay vì dịch lần hai.

  MỌI CÔNG THỨC HỘI THOẠI ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN. Rājā āha— → Vua nói: (đếm trong tầng mil có 30 tệp dùng Vua nói: và 12 tệp dùng Vua nói—, tôi theo đa số; 11 tệp còn lại dùng Vua nói:—). Thero āha— → Trưởng lão nói: (3 tệp dùng dạng có dấu hai chấm và 3 tệp dùng dạng có gạch nối, hòa nhau; tôi chọn dạng có dấu hai chấm để nhất quán với Vua nói: trong chính lát này). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā. (54 tệp mil, chỉ một cách). Opammaṁ karohī → Xin hãy xét một thí dụ ti. (đúng mil3.1.12:2.1, mil3.2.7:2.1, mil3.2.8:2.1). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa ti. (đúng mil3.1.12:3.1). Bhāsitampetaṁ, mahārāja, bhagavatā— → Điều này, này Đại vương, Đức Thế Tôn đã nói — (đúng mil3.1.12:3.4). Imasmiṁ vagge dasa pañhā và Imasmiṁ vagge soḷasa pañhā → Trong phẩm này có … câu hỏi. (đúng mil3.4.10:5.1, mil6.2.10:5.1, mil3.1.16:6.1). Rājā → vua, Mahārāja → Đại vương, bhagavā/bhagavatā → Đức Thế Tôn hoặc Đức Thật Chứng Ấy, Thero → Trưởng lão, Kāma → tình dục, sīla → đức hạnh.

  TÊN PHẨM ĐÃ CHỐT. Tikanipāta → Bộ Ba Bài Kinh (bốn bài lân cận đã có: ja276, ja291, ja292, ja293). Udapānavagga → Phẩm Nước Uống (đúng ja276 và ja279; tôi tự đếm bằng script trên Pāli gốc: 10 bài mang tên phẩm này là ja271..ja280, và ja275 nằm trong đúng khoảng đó). Kumbhavagga → Phẩm Bình Vò: tên này CHƯA có trong bảng chốt của BRIEF_VI3 §11, nên tôi theo đa số trong chính phẩm đang làm — ba bài đã có (ja291, ja292, ja293) đều dùng Phẩm Bình Vò; tôi tự đếm Kumbhavagga chiếm đúng ja291..ja300, trong đó lát này có sáu bài. Người biên tập nếu muốn chốt khác thì phải sửa cả mười bài cùng lúc. Các tên phẩm Milindapañha cũng theo đúng bầy bài lân cận: Mahāvagga → Đại Phẩm, Addhānavagga → Phẩm Khoảng Thời Gian, Buddhavagga → Phẩm Đức Phật, Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc.

  STATUS. Hai blocking error ở trên là thật và đo được (thiếu hẳn tầng Anh Sujato tại commit đã ghim; coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên mọi bài lát này đặt draft bất kể final_score. Tôi không nâng điểm để né blocker và cũng không hạ điểm để tỏ ra thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có tầng tham khảo nào.

  Giải quyết draft 2026-10-12: đọc lại đối kháng toàn bài (17 khoá) từ Pāli, một mình, vì bài không có bản Anh nào tại commit đã ghim. Mục THUẬT NGỮ MỚI (uparamā → đến tận cùng; gahapatika), mục CHỐT LƯỢC (so aparena samayena là bấy giờ sau ấy; yathā paccayaṁ), mục MỘT VẾ DÙNG LẠI NGUYÊN VĂN (2.4) và mục STATUS về hai blocker ở trên bị THAY THẾ bởi các mục dưới đây; các mục khác giữ nguyên.

  KHOÁ SỬA (lỗi nghĩa thật ở 5/17 khoá là 1.5, 2.2, 2.3, 2.6, 2.7; thêm 5 khoá chỉ sửa cách nói là 1.2, 1.3, 1.4, 2.4, 2.5). (1) 1.5, 2.6, 2.7: uparamā (cách xuất xứ của uparama, từ upa + ram, nghĩa là ngừng lại, chấm dứt) bị bản cũ đọc thành biết đến tận cùng, và cả câu bị đảo thành một người biết nhân duyên rồi biết đến tận cùng. Pāli nói khác hẳn: tassa hetussa tassa paccayassa uparamā là do nhân ấy, duyên ấy chấm dứt mà người ấy biết. Đã sửa cả ba khoá thành nhân nào, duyên nào đưa đến tái sinh (hoặc đưa đến việc làm đầy kho lúa), do nhân ấy, duyên ấy chấm dứt mà người ấy biết. Đối chiếu: tầng mil có mil3.2.4:1.8 cùng công thức Yo hetu yo paccayo … tassa hetussa tassa paccayassa uparamā, bản đó đọc uparamā là đã dứt trừ, đã tịch diệt, tức là cũng đọc là chấm dứt chứ không phải đến tận cùng; mil5.1.1:8.2 uparameyya, uparato = ngừng. (2) 2.2: bản cũ có người nông dân đã gieo hạt và cấy xuống đất, thiếu vế dhaññāgāraṁ paripūreyya (làm đầy kho lúa) và đổi kasitvā (cày) thành cấy. Đã sửa: cày và gieo xong thì làm đầy kho lúa. gahapatiko được giữ: người nông dân gia chủ, theo dn2:37.5 (nông phu, gia chủ). (3) 2.3: so aparena samayena → Sau một thời gian (đếm: trong tầng, 31/48 khoá mở đầu bằng So aparena samayena dùng Sau một thời gian; còn bấy giờ sau ấy chỉ có ở chính khoá này); yathāsambhatañca dhaññaṁ paribhuñjeyya vā visajjeyya vā bị bản cũ đọc thành cứ để y đống lúa như cũ rồi tự ăn lấy, hoặc để người ta lấy ăn, nghĩa là lúa vừa nguyên vừa bị ăn và visajjeyya (cho đi, phân phát) thành để người ta lấy; đã sửa: lúa đã tích trữ thì hoặc dùng, hoặc đem cho đi. yathā paccayaṁ vā kareyya → hoặc tùy theo nhu cầu mà làm (đếm: yathāpaccayaṁ ở 35 khoá khác trong tầng, nơi dịch là tùy ý/tùy theo ý muốn, theo nhu cầu, xử lý tùy theo; sn3.19:4.2 dùng theo nhu cầu; tôi chọn nhu cầu vì hợp với việc xử lý số lúa). (4) 2.3 và 2.6: na me dhaññāgāraṁ paripūressatī, me là sở hữu cách (của tôi) và động từ paripūressati là nội động (sẽ đầy), không phải tôi làm đầy; bản cũ viết tôi sẽ không làm đầy kho lúa của tôi, đổi chủ thể. Đã sửa: kho lúa của tôi sẽ không đầy. (5) Sửa cách nói không đổi nghĩa: 1.2/1.3 yo … so (người nào … người ấy); 1.2 viết hoa Thưa; 1.4 Bạch → Thưa (đếm trong tầng mil: thưa tôn giả 654 chỗ so với bạch tôn giả 103; chính bài này đã dùng thưa ở 1.2, 2.4, 3.1); 1.4/2.5 người ấy biết bằng cách nào; 2.4 đặt dấu chấm trong ngoặc kép (Pāli kết jāneyyā”ti.). Khoá 2.4 vì vậy khác mil3.5.9:2.3 đúng một dấu chấm: mil3.5.9:2.3 đặt dấu chấm ngoài ngoặc kép (ngoài phạm vi, báo để người điều phòng quyết).

  CÂU HẬU QUẢ Ở CÁC BÀI KHÁC (báo, không sửa). mil3.2.4:1.8 cùng công thức nhưng dịch là nguyên nhân và duyên khởi … chưa dứt trừ / đã tịch diệt: thuật ngữ nhân/duyên và cách đọc anuparamā/uparamā chưa khớp bài này. Đếm: trong tầng, cặp hetu + paccayo dịch là nhân ở 382 khoá, nguyên nhân ở 57 khoá; ở mil 3 khoá nhân, 1 khoá nguyên nhân.

  GỠ BLOCKER. Blocker 1 (không có bản Anh Sujato tại commit đã ghim; mil/ có 0 tệp) là sự thật về upstream và GIỮ nguyên. Blocker 2 (coverage tầng Anh 0 trên 7 khoá có nội dung) đã GỠ: đây là hệ quả của blocker 1, không phải lỗi văn bản; content/meta/reference-gaps.yaml đã có mục cho bài này (mil3.2.2) nên mất mát đã được ghi nhận, và tôi đã đọc từng khoá có nội dung từ Pāli, bản dịch tự đứng vững. Ba tầng tham khảo vắng hoàn toàn (Sujato không có, english-project không có, vietnamese-current chỉ có Pháp Cú) nên triangulation giữ 6,5, thấp hơn mức trần 8,0.

  BẤT ĐỊNH CÒN LẠI. (a) yathā paccayaṁ vā kareyya: nhu cầu so với hoàn cảnh; hai cách đọc đều nằm trong nghĩa của paccaya, cách chọn không đổi giáo nghĩa. (b) jāneyya/jāneyyā là cách ước định (người ấy có thể biết); bản dịch để ở thể trần thuật biết để khớp mil3.5.9 và vì câu hỏi là một thí dụ giả định. (c) Nāgasenā ở 3.1 là hô cách giữ theo công thức 54 tệp mil, trong khi 1.2 viết Nāgasena.

  KỸ THUẬT. Không chạy npm run validate, npm test, npm run check, npm run build trong lượt này; technical_integrity giữ 9,6 và không tuyên bố cổng kỹ thuật đã pass. Đã tự kiểm 17 khoá: đủ khoá, đúng thứ tự Pāli, không có Pāli lọt vào bản dịch, không dấu lược, dấu nháy khớp.
