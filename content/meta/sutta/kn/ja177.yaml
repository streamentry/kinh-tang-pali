notes: |-
  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG. `_hvi.kiểm` chỉ quét `cần` = khoá Pāli ≥ 40 ký tự. Ở 16/17 bài của lát này khoá Pāli dài nhất chỉ 19–35 ký tự nên `cần` rỗng và vòng chốt NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG CHẠY LẦN NÀO. Tôi tự quét lại **164/164 khoá** bằng chính các hàm đó (`_chk_rv3.py`): 0 lỗi — không khoá rỗng, không khoá thừa so với Pāli, không thiếu khoá, mọi chuỗi NFC, số dấu lược khớp Pāli từng khoá, ngoặc kép cân trên cả bài, ngoặc tròn cân, không còn `(…)`, không còn sót `pe…`. Chỉ `mil3.1.7` có 4 khoá ≥ 40 ký tự (`:1.2`–`:1.5`) nên ở bài đó chốt thật sự có chạy. `save_vi` chạy sạch, chạy lại hai lần idempotent.

  COVERAGE — ĐO BẰNG CHÍNH HÀM CỦA KHO (chỉ đọc, `englishCoverageFor`). Cả **17/17 bài ra `ratio = 1`**: 16 bài có `substantiveSegments = 0` vì không khoá Pāli nào đủ 40 ký tự; `mil3.1.7` có 4 khoá substantive. Không bài nào rơi dưới ngưỡng 0,8 nên **không** cần mục trong `content/meta/reference-gaps.yaml` — tệp đó tôi không đụng tới.

  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho bất kỳ bài nào trong lát này. Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là **Pāli + English Sujato + các bài song song trong chính tầng này**.

  KỸ THUẬT. Tôi KHÔNG chạy `npm run validate|test|build|check` — đợt này người điều phối cấm và chạy tập trung. Vì vậy `technical_integrity` chấm **9.6 chứ không phải 10.0**; đó là hạn chế thật của lượt đánh giá này chứ không phải lời khen. Tất cả những gì chạy được thì đã chạy.

  **BLOCKER: THIẾU TẦNG THAM KHẢO ANH.** `source/upstream-manifest.json` (tầng `english-sujato`, 4.291 tệp) **không** có `sutta/kn/ja/ja177*`; `ls .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ja/ | grep ja177` rỗng. Đây là `not-published-upstream`, không phải cache chưa tải. Bài vì thế chỉ đứng được trên Pāli root một mình, và tôi đặt `draft` — không tự nâng điểm để né blocker.

  **TÔI ĐÃ DÙNG ĐƯỢC GÌ ĐỂ ĐỌC PĀLI KHI KHÔNG CÓ TẦNG ANH.** (1) API SuttaCentral cho tên bài và blurb của chính bài: `Tinduka Jātaka`, blurb *All around us see them stand* — chuyện Đức Thế Tôn kể ở Jetavana về **sự hiểu biết toàn tâm**. (2) Blurb đó xác nhận ý câu kệ: *không phải chỉ lần này Ta mới có trí tuệ, mà trước đây Ta cũng có, và đầy tài năng sáng tạo*. (3) Tên bài dùng tiếng Anh `translations` của SuttaCentral: W.H.D. Rouse 1895, Dutoit 2007, Zoysa — tôi **không** chép văn bản dịch của họ vào thân bản, chỉ dùng metadata tên bài. Những tra cứu này là từ điển/tư liệu học thuật theo `skill/translation.md` §3.2 mục 5, không phải tầng store nên không tính vào coverage.

  **BẤT ĐỊNH ĐÃ GHI — `1.1 Dhanuhatthakalāpehi` (CHƯA PHÂN XỬ ĐƯỢC).** Đây là một chuỗi ghép không có trong chỗ nào khác của kinh điển và không có bản Anh đã ghim: `dhanu` (cung) + `hattha` (tay) + `kalāpa` (dải, hàng, cả). Tôi đọc là *tay chân chim cứng đơ như dải cung* — ấn tượng chung của bài khi chim bị trói, và khớp với `1.2` (`nettiṁ savaradhāribhi` = dây cương và những kẻ mang tên). **Đây là chỗ dịch thiếu chắc nhất của lát này**; nếu biên tập có một bản Việt Thích Minh Châu (budsas) cho Tạng Bộ thì nên đối chiếu lại đúng cặp `1.1`–`1.2`. Tôi đã hạ `semantic_fidelity` và `ambiguity_integrity` vì lý do này.

  **BẤT ĐỊNH ĐÃ GHI — `2.4 khajjathaññeva tindukan`.** `khajjathañña` = *thứ đáng ăn*. Tôi dịch *chỉ có chim Tinduka mới biết thức ăn ấy*, giữ tức từ. Cách đọc khả dĩ: cây chưa chặt (`Atthi rukkhassa acchinnaṁ`) thì **chỉ chim Tinduka biết là thức ăn** — tức là kiến thức ấy của nó là độc nhất, đúng chủ đề của bài.

  **TÊN BÀI.** `tinduka` là tên loài chim (PED), nên tôi giữ *Chim Tinduka* chứ không đoán loài cụ thể; Sujato tên bài là *Tinduka*, không dịch loài. `0.3 Kalyāṇavagga` → *Phẩm Pháp Lành* (6 tiền lệ: `ja171`–`ja176`).

  **`0.2 Dukanipāta` — TÔI CỐ Ý KHÔNG THEO ĐA SỐ, XEM DƯỚI.** 33 bài Jātaka Dukanipāta đã có trên đĩa: 26 dùng *Tập Kẻ Đau Đớn*, 7 dùng *Bộ Hai Bài Kinh*. Tôi chọn **Bộ Hai Bài Kinh** vì `duka` trong `Dukanipāta` là **số hai** chứ không phải *đau* — cùng loại với `catu`, `pañca`, `aṭṭha`, `dasā`, `ekādasa`, `dvādasa` trong dãy nipāta, và tầng này đã tự dịch `Ekakanipāta` → *Bộ Một Bài Kinh*. *Tập Kẻ Đau Đớn* là lỗi đọc từ. **Người biên tập nên sửa 26 khoá `:0.2` kia cho cả một quyết định.**

  Lượt cải thiện 2026-10-13 (đọc đối kháng từng khoá; 8/13 khoá đổi). ĐÍNH CHÍNH các mục cũ ở trên: tên loài chim, cách đọc `1.1`, và cách đọc `2.1`–`2.4` đều SAI và được thay bằng phần dưới.
  (1) `2.1`–`2.2` — sai nghĩa (accuracy fix, thay cho blocker loại 2 chưa từng được ghi). Cũ: *Biết đâu trong đám đông kia / có người biết được ý nghĩa ấy*. Pāli `bahukiccānaṁ` là sở hữu cách số nhiều của `bahukicca` = *có nhiều việc* (đo toàn Pāli ghim: dịch *nhiều việc / nhiều công việc* ở mọi nơi đã có bản Việt — dn2, dn16, dn32, mn36, mn51, mn56, mn86, mn88–90, mn99, mn108, sn44.1, an4.187, an10.30… khoảng 35 khoá; không nơi nào dịch *đám đông*). `attho jāyetha koci` = *có việc/nhu cầu gì đó phát sinh*, không phải *có người biết ý nghĩa*; `naṁ` = *với họ*. Mới: *Biết đâu những người nhiều việc, / có việc gì đó phát sinh với họ*. Điểm đổi: `grammar_logic` 8.5 → 8.8.
  (2) `2.3`–`2.4` và tiêu đề — `tinduka` là CÂY/QUẢ, không phải chim. Bản cũ ghi "tên loài chim (PED)" — khẳng định từ điển đó không kiểm chứng được và trái với toàn kho: dn9 *cây mun tinduka*, mn78 *cây tindukā*, tha-ap199 *quả tinduka* (Tindukadāyaka = vị dâng quả tinduka), ja516:12.1 *một cây tinduka*, ja547/ja540 *trái tinduka*. Ở `2.4` Pāli là `tindukaṁ` trung tính, tân ngữ của động từ ăn ⇒ *quả*; cũ *chỉ có chim Tinduka mới biết thức ăn ấy* thêm chủ thể, thêm "biết", và đọc `khajjatha` thành danh từ *thức ăn* — đều không có trong Pāli. `khajjathaññeva` = `khajjatha` + `ññeva`; đo toàn Pāli ghim: dạng `…ññeva` (`gacchaññeva`, `tvaññeva`, `maññeva`, `attānaññeva`) là `eva` nhấn mạnh sau âm nối ṁ→ñ, nên đọc *cứ ăn … thôi*. Mới `2.4`: *hãy cứ ăn quả tinduka.* `2.3` `rukkhassa acchinnaṁ`: `acchinna` = chưa bị cắt/chặt; cũ *Còn cây chưa bị chặt* biến sở hữu cách `rukkhassa` thành chủ thể "cây"; mới *Cây còn có phần chưa bị cắt*. Tiêu đề `0.4`/`3.1`: *Kinh Chim Tinduka* → *Kinh Tinduka* (tên riêng giữ nguyên, tiền lệ `ja179`; không chọn cây hay quả vì hợp từ không nói). Điểm đổi: `terminology` 8.8 → 9.0; `semantic_fidelity` giữ 8.6 vì phần còn bất định dưới đây.
  (3) `1.1`–`1.2` — `kẻ` → `người` (clarity fix): Pāli trung tính, `kẻ` thêm sắc thái thù địch không có. Bất định cũ về `Dhanuhatthakalāpehi` ("tay chân chim cứng đơ như dải cung") ĐƯỢC GIẢI QUYẾT và cách đọc đó bị bỏ: `dhanukalāpa` xuất hiện ở mn13, mn14, mn86, mn96, an5.76 (5 bài, 8+ khoá) và các bản Việt đã dịch *cung và ống tên* / *cung tên* (mn96:10.7 *cung và ống tên*); `kalāpa` ở đây là ống tên, `dhanuhattha` = tay cầm cung. `1.4` `kathaṁ mokkho bhavissati` trùng nguyên văn với `ja542:8.4` và Việt giống hệt (1/1 cặp trùng nội bộ liên bài, 0 lệch). `1.2` `nettiṁsa` = gươm (cùng nhóm `asi`), `vara` = quý/báu; giữ *gươm báu*.
  (4) `0.2` — nay 100/100 bài Dukanipāta trong kho dùng *Bộ Hai Bài Kinh* (đo lại; ghi chú cũ nói 26/7 đã lỗi thời), nên khoá này nhất quán với tầng.
  ĐIỂM: `source_provenance` 9.4 → 9.2 (ghi chú cũ nêu từ điển và cách đọc không kiểm chứng được; nay đã đính chính); `grammar_logic` 8.5 → 8.8; `terminology` 8.8 → 9.0; `vietnamese_clarity` 8.8 → 8.6 (bản cũ đọc trôi nhưng sai; bản sát Pāli hơn thì `2.3` hơi cô đọng); các tiêu chí khác giữ. Điểm cũ không phản ánh các lỗi trên.
  BẤT ĐỊNH CÒN LẠI (ghi, không đoán): (a) người "nhiều việc" là ai — Pāli không nêu, đọc theo mạch `1.1`–`1.4` là những người cầm cung, nhưng không có chú giải hay bản Anh đã ghim để xác nhận; (b) `acchinnaṁ` — phần cây nào chưa bị cắt (quả hay cành) không được nói; (c) `khajjatha` đọc là mệnh lệnh số nhiều *hãy ăn*, còn có thể là dạng thụ động `khajjati` (*được ăn*) — cả hai cùng dẫn tới *ăn quả tinduka* nhưng sắc thái khác; (d) vai nói: `1.x` là lời chung của bầy, `2.x` là lời đáp — suy từ khung hỏi–đáp của hai bài kệ, không có văn xuôi trong bản chụp ghim để xác nhận. Các điểm này giữ `semantic_fidelity` và `ambiguity_integrity` ở 8.6.
  TỰ KIỂM: 13/13 khoá, tập khoá và thứ tự khớp Pāli; dấu nháy kép và dấu lược khớp Pāli từng khoá (0 lệch); NFC; không Pāli lọt sang bản Việt; 0 cặp Pāli trùng nguyên văn trong chính bài. `technical_integrity` giữ 9.6; chưa chạy `npm run validate` · `npm test` · `npm run check` · `npm run build` trong lượt này.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 4 khoá chênh lệch lớn nhất (`0.3`, `0.4`, `1.2`, `2.4`; 9 khoá còn lại gần như trùng; đọc thêm đối kháng cả 13 cặp Pāli↔Việt) → khác nghĩa 3: sửa 0, giữ 1, bất định 2. Giữ: `2.4` (bản mù *ăn tinduka*, bỏ *quả* và ghi không chắc; giữ *quả tinduka* như phân tích lượt trước: `tindukaṁ` trung tính, tân ngữ của `khajjatha`; tầng dùng *quả tinduka* ở `tha-ap199`). Bất định: `1.2` `nettiṁ savaradhāribhi` (bản mù *gươm tốt*, bản dự án *gươm báu*; cùng đọc `nettiṁ` là gươm, khác nhau ở sắc thái tính từ `vara`; cách tách `nettiṁ` + `savara` + `dhāribhi` vẫn không chắc); `2.3` `acchinnaṁ` *phần chưa bị cắt* (đã ghi từ lượt trước, bản mù không bất đồng). `0.3`/`0.4` khác ở cách dịch tên phần và tên bài (*Phẩm Pháp Lành*, *Kinh Tinduka* theo khuôn tầng `ja`), không phải khác nghĩa. Không đổi khoá nào. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản Anh, bản Việt nguyên bài hay đoạn song song mới): sửa 0 khoá. Rà lại 13/13 khoá sau lượt sửa 2026-10-13: `dhanukalāpa` *cung và ống tên* (tiền lệ `mn96:10.7`), `parikiṇṇamha` ngôi một số nhiều, `bahukiccānaṁ`/`attho jāyetha koci naṁ`, `tindukaṁ` tân ngữ của `khajjatha` — đều đúng. `1.4` trùng `ja542:8.4` và dùng cùng câu Việt. Bất định (a)–(d) ghi trước giữ nguyên. Không có bằng chứng mới nên giữ điểm.
