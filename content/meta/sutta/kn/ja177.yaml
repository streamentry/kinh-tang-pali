  **TÔI ĐÃ DÙNG ĐƯỢC GÌ ĐỂ ĐỌC PĀLI KHI KHÔNG CÓ TẦNG ANH.** (1) API SuttaCentral cho tên bài và blurb của chính bài: `Tinduka Jātaka`, blurb *All around us see them stand* — chuyện Đức Thế Tôn kể ở Jetavana về **sự hiểu biết toàn tâm**. (2) Blurb đó xác nhận ý câu kệ: *không phải chỉ lần này Ta mới có trí tuệ, mà trước đây Ta cũng có, và đầy tài năng sáng tạo*. (3) Tên bài dùng tiếng Anh `translations` của SuttaCentral: W.H.D. Rouse 1895, Dutoit 2007, Zoysa — tôi **không** chép văn bản dịch của họ vào thân bản, chỉ dùng metadata tên bài. Những tra cứu này là từ điển/tư liệu học thuật theo `skill/translation.md` §3.2 mục 5, không phải tầng store nên không tính vào coverage.

  **BẤT ĐỊNH ĐÃ GHI — `1.1 Dhanuhatthakalāpehi` (CHƯA PHÂN XỬ ĐƯỢC).** Đây là một chuỗi ghép không có trong chỗ nào khác của kinh điển và không có bản Anh đã ghim: `dhanu` (cung) + `hattha` (tay) + `kalāpa` (dải, hàng, cả). Tôi đọc là *tay chân chim cứng đơ như dải cung* — ấn tượng chung của bài khi chim bị trói, và khớp với `1.2` (`nettiṁ savaradhāribhi` = dây cương và những kẻ mang tên). **Đây là chỗ dịch thiếu chắc nhất của lát này**; nếu biên tập có một bản Việt Thích Minh Châu (budsas) cho Tạng Bộ thì nên đối chiếu lại đúng cặp `1.1`–`1.2`. Tôi đã hạ `semantic_fidelity` và `ambiguity_integrity` vì lý do này.

  **BẤT ĐỊNH ĐÃ GHI — `2.4 khajjathaññeva tindukan`.** `khajjathañña` = *thứ đáng ăn*. Tôi dịch *chỉ có chim Tinduka mới biết thức ăn ấy*, giữ tức từ. Cách đọc khả dĩ: cây chưa chặt (`Atthi rukkhassa acchinnaṁ`) thì **chỉ chim Tinduka biết là thức ăn** — tức là kiến thức ấy của nó là độc nhất, đúng chủ đề của bài.

  **TÊN BÀI.** `tinduka` là tên loài chim (PED), nên tôi giữ *Chim Tinduka* chứ không đoán loài cụ thể; Sujato tên bài là *Tinduka*, không dịch loài. `0.3 Kalyāṇavagga` → *Phẩm Pháp Lành* (6 tiền lệ: `ja171`–`ja176`).

  **`0.2 Dukanipāta` — TÔI CỐ Ý KHÔNG THEO ĐA SỐ, XEM DƯỚI.** 33 bài Jātaka Dukanipāta đã có trên đĩa: 26 dùng *Tập Kẻ Đau Đớn*, 7 dùng *Bộ Hai Bài Kinh*. Tôi chọn **Bộ Hai Bài Kinh** vì `duka` trong `Dukanipāta` là **số hai** chứ không phải *đau* — cùng loại với `catu`, `pañca`, `aṭṭha`, `dasā`, `ekādasa`, `dvādasa` trong dãy nipāta, và tầng này đã tự dịch `Ekakanipāta` → *Bộ Một Bài Kinh*. *Tập Kẻ Đau Đớn* là lỗi đọc từ. **Người biên tập nên sửa 26 khoá `:0.2` kia cho cả một quyết định.**
