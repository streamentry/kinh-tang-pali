notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Dùng lại nguyên văn đã `published`, có đối chiếu bằng đếm chứ không bằng trí nhớ.**
  Pāli của khoá này là `Namo tassa Bhagavato Arahato Sammāsambuddhassa` — **giống hệt**
  Pāli của `ja1:1.1`, đã `published` với bản dịch *Kính lễ Đức Phật, bậc A-la-hán, bậc
  Chánh Đẳng Giác.* Tôi lấy đúng câu đó, không dịch lại và không biến thành câu khác.
  Nếu hai bài mà lệch nhau một chữ thì bốn cột đối chiếu hiện sai âm thầm.
  **Cơ sở của từng danh xưng** (theo `an10.16:1.3` đã `published`): `bhagavā` → *Đức
  Phật*; `arahā` → *A-la-hán*; `sammāsambuddho` → *Chánh Đẳng Giác*; `namo tassa` → *Kính
  lễ*. `sammāsambuddha` cũng nằm trong danh sách giữ chữ Hán–Việt của chính `_hvi.py`.
  **Điểm `triangulation` 8,6 (cao hơn 8,5) vì lý do thật:** đây là một trong hai bài
  trong lát có **tầng Việt dự án đã xuất bản nói đúng câu này** — tức là có tiền lệ Việt
  để đối chiếu, dù vẫn **không** có bản Thích Minh Châu và vẫn **không** có Anh Sujato.
  **Bối cảnh đã đọc trước khi dịch:** `2.1` trở đi là lời hỏi của bậc vua Metteyya về
  Vessantara, nên lời kính lễ ở `1.1` là lời mở của cả bài, không phải của riêng khoá.
