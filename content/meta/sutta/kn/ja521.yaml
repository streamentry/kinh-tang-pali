  Nghiên cứu nguồn ngoài 2026-10-16: H.T. Francis (dịch), The Jātaka vol. V (PTS 1905, phạm vi công cộng; đọc qua static.sirimangalo.org/old/jataka/5.htm, Jātaka 521 tr. 59–63); đã đối chiếu toàn bài (kệ 1–50, kể cả điệp khúc 40–49); không sửa khoá nào, nghĩa khớp Francis ở mọi khoá có nội dung riêng (Sirī/Alakkhī = Good Fortune/Ill Luck, năm sức mạnh, hai điều giữ-được, 'trí tuệ' là sức mạnh đứng đầu). Bất định: 5.1–5.4 `tapokammaṁ` (bản dịch giữ 'việc khổ hạnh'; Francis phóng dịch thành 'lỗi lầm trong quá khứ nên hối hận', không có bài song song trong tầng để phân xử).

  Nguồn thứ hai 2026-10-16: Tỳ khưu Indacanda, Jātakapāḷi II (Tiểu Bộ – Bổn Sanh II; [521]
  Tesakuṇajātakaṃ, kệ 2973–3021), bản Việt trực tiếp từ Pāli,
  https://tamtangpaliviet.net/TTPV/33_Ja_II.pdf (chỉ đọc đối chiếu, không chép lại); đối chiếu thêm
  Tesakuṇajātakavaṇṇanā (Jātaka-aṭṭhakathā, CST)
  https://ancient-buddhist-texts.net/Buddhist-Texts/K10-JA/521.htm làm bằng chứng nghĩa. Đối chiếu
  197/203 khoá (49 khổ kệ 2–50; không đối chiếu: tiêu đề, câu kính lễ và dòng kết); KHỚP 37, LỆCH-THẬT
  8, NGUỒN-LỆCH 4. Đã sửa: (a) 5.1 `tapokammaṁ` là việc làm gây hối hận (chú giải `tāpakaraṁ kammaṁ`;
  Indacanda "khiến cha bực bội"), không phải "việc khổ hạnh"; (b) xưng hô đảo chiều ở 5, 7, 13, 16,
  17, 18, 24, 39: người nói là các con chim (con của vua Brahmadatta) nói với cha, `tāta` là "thưa
  cha" (chú giải `tāto ti pitā`; Indacanda "Cha thân"), bản cũ gọi nhà vua là "con"; ở 13.2 thêm nghĩa
  sai khiến của `kāraya` ("hãy cho làm"). NGUỒN-LỆCH, giữ nguyên: 3 `acodayi` (Indacanda hiểu phủ
  định; chú giải và bản Việt hiểu khẳng định), 11 `bhūtapati` (chú giải hiểu là hô cách gọi nhà vua;
  bản Việt và Indacanda hiểu là tước hiệu của Sakka), 12 `pitaro` (chú giải: Phạm thiên; bản Việt "tổ
  tiên"), 15 `khattabandhuni` (chú giải: em gái của `khatta` Mahāsenagutta; bản Việt "dòng
  sát-đế-lợi"). triangulation 8.4→8.93 = cũ + 0,6 × 197/203 × 45/49 (khoá kết luận được; các khoá
  NGUỒN-LỆCH tính là chưa kết luận), tối đa 9,2. semantic_fidelity và grammar_logic +0,1 mỗi tiêu chí
  vì đã sửa lỗi nghĩa thật; các tiêu chí khác giữ nguyên.

