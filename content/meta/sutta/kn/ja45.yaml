notes: |-
  Pāli là authority: `Seyyo amitto medhāvī` là câu so sánh, không có `seyyathāpi` hay vế
  đối chiếu nào khác — dịch "Thà là … còn hơn …", giữ cả hai vế như Pāli. `bālānukampako` =
  kẻ thương lượng cho kẻ ngu (`bāla` là kẻ ngu, có tiền lệ dhp và sn; `anukampaka` = đồng tình,
  sn1.79). `jammi` = hèn hạ, thô bạo (tiền lệ dhp336:1 "tham ái hèn hạ"). `Passa` = hãy xem, mệnh
  lệnh (tiền lệ thag1.24:1.2, ja118:1.3).
  Tên riêng `Rohiṇī` giữ nguyên Pāli vì đây là tên nhân vật trong truyện; Sujato cũng giữ
  "Rohinī". `mātaraṁ hantvāna` = "đã giết mẹ", `socatī` = đang khóc (tiền lệ rất nhiều, ja18,
  sn1.31, sn1.71…). Không có lý do dịch bớt hay thêm.
  `Atthakāmavagga` KHÔNG có tiền lệ (0 chỗ), đặt mới "Phẩm Lời Nói Tử Tế"; Sujato dịch phẩm này
  là "Wanting to Help" và tên phẩm tại SuttaCentral là "Well-Meant Advice"
  (ja-name:46.ja-atthakamavagga), nên tôi theo cách gọi có bằng chứng đó.
  Vì `cần` RỖNG, tôi tự quét MỌI khoá bằng `review.py` — sạch. Không chạy npm (đợt này cấm) nên
  technical_integrity = 9.6.
