notes: |-
  Bài này. `tha-ap24` · phẩm `Subhūtivagga` (`Phẩm Subhūti`) · bài thứ hai của phẩm · Trưởng lão Upavāna · 225 khoá Pāli:
  tiêu đề `:0.1`–`:0.3`, 54 kệ `:1.1`–`:54.4` (riêng `:18` có sáu dòng, `:19` có sáu dòng), câu kết `:55.1`, câu chốt `:56.1`. Tệp dịch có đủ 225/225
  khoá, thứ tự khoá đúng thứ tự Pāli. Tên vị trưởng lão được xác nhận ba lần trong chính Pāli: `Upavānattheraapadāna` (`:0.3`), `Upavānoti nāmena` (`:50.3`),
  `āyasmā upavāno thero` (`:55.1`), `Upavānattherassāpadānaṁ` (`:56.1`).

  NỘI DUNG (đã đọc Pāli, không suy từ khuôn chung). `:1`–`:3` Đức Padumuttara nhập Niết-bàn; quần chúng dựng giàn thiêu, thu xá-lợi, chư thiên và loài người dựng bảo tháp.
  `:4`–`:6` bảo tháp bảy tầng (vàng, ngọc ma-ni, bạc, pha lê, hồng ngọc, masāragalla, rồi tầng trên cùng toàn các thứ ngọc báu), cao một do-tuần. `:7`–`:9` chư thiên bàn bạc, thấy
  xá-lợi không tách rời mà đã thành một khối nên làm lớp bọc ngoài, thêm một do-tuần: hai do-tuần. Rồi theo thứ tự các loài tụ họp và nối cao thêm một do-tuần mỗi lần: loài rồng (`:10`–`:13`, ba do-tuần),
  kim sí điểu (`:14`–`:17`, bốn), cưu-bàn-trà (`:18`–`:20`, năm), dạ-xoa (`:21`–`:24`, sáu), càn-thát-bà (`:25`–`:28`, bảy do-tuần, ngày đêm không phân biệt được). `:29`–`:33` ánh sáng không bị mặt trăng, mặt trời,
  các vì sao át; loài người không leo lên bảo tháp mà tung vật cúng lên không trung; dạ-xoa Abhisammata do chư thiên đặt nâng cờ và tràng hoa lên cao nên không ai thấy dạ-xoa; ai thấy rồi ra đi đều đến cõi lành;
  cả người chống đối lẫn người tịnh tín đều đến vì muốn thấy điều mầu nhiệm. `:34`–`:39` tiền thân là người làm thuê ở Haṁsavatī, thấy dân chúng hoan hỷ, phát nguyện làm người kế thừa giáo pháp,
  buộc tấm áo choàng đã giặt sạch lên ngọn tre làm cờ và được Abhisammata nâng lên không, rồi hỏi một vị tỳ-kheo về quả báo. `:40`–`:50` lời thọ ký trong nháy đơn (mở ở `:40.3`, đóng ở `:50.4`): đoàn tùy tùng, ba mươi ngàn kiếp
  ở cõi trời, tám mươi lần làm chúa chư thiên, một ngàn lần làm Chuyển Luân Vương; sau một trăm ngàn kiếp nữa Gotama ra đời, xuất gia, mang tên Upavāna, làm đệ tử của bậc Thầy. `:51`–`:54` quả đã thấy tại đây, chúa tể bốn châu có cờ dựng ba do-tuần
  chung quanh, không biết đến đọa xứ từ một trăm ngàn kiếp trước, bốn vô ngại giải, tám giải thoát, sáu thắng trí.

  SỐ PĀLI, TỰ TÍNH. `yojana` = do-tuần (tầng `tha-ap`, số lượt: `do-tuần` 20 · `yojana` 1). Chiều cao bảo tháp, kiểm từng bước: `:6.4` `yojanamuggato` = 1; `:9.2` thêm `aññaṁ yojanaṁ` = 1 nữa và `:9.3` `dviyojanubbedho` (dvi 2) = 2 (khớp 1+1);
  `:13.3` `Tiyojanasamubbiddhaṁ` (ti 3) = 3; `:16.3` thêm 1 nữa và `:17.1` `Catuyojanamubbiddho` (catu 4) = 4; `:20.1` thêm 1 và `:20.3` `Pañcayojanamubbiddho` (pañca 5) = 5; `:24.1` thêm 1 và `:24.3` `Cha yojanāni ubbiddho` (cha 6) = 6;
  `:28.1` `Sattayojanamubbiddho` (satta 7) = 7 (`:27` không nêu cộng thêm một do-tuần nhưng tăng bảy hàng lan can và dựng lọng; con số 7 theo Pāli, không suy). Chuỗi 1→2→3→4→5→6→7 khớp từng nấc.
  `:29.3` `yojanasate` = sata 100 = một trăm do-tuần. `:52.3` `Tiyojanāni samantā` = ba do-tuần chung quanh. `Saṭṭhitūriyasahassāni` (`:42.1`) = saṭṭhi 60 × sahassa 1.000 = 60.000 nhạc cụ (`tūriya`), viết `Sáu mươi ngàn`.
  `Chaḷāsītisahassāni` (`:43.1`) = cha 6 + asīti 80 = 86 × sahassa 1.000 = 86.000, viết `Tám mươi sáu ngàn` (khớp tiền lệ `Chaḷasītisahassāni` → `Tám mươi sáu ngàn`: `tha-ap474:11.1`, `tha-ap485:13.1`, và `Chaḷāsītimhito kappe` → `tám mươi sáu kiếp`). `Tiṁsakappasahassāni` (`:45.1`) = tiṁsa 30 × sahassa 1.000 = 30.000 kiếp →
  `ba mươi ngàn kiếp` (theo chỉ dẫn của người điều phối: `tiṁsa` = 30, không phải 3; khớp bài liền kề `tha-ap23:37.1`). Cùng Pāli này trong tầng `tha-ap` (nhìn từ cây chính): `ba mươi nghìn kiếp` 5 khoá · `ba mươi ngàn kiếp` 1 khoá; chọn `ngàn` để khớp `tha-ap23:37.1` và
  chỉ dẫn. `Asītikkhattuṁ` (`:45.3`) = asīti 80 → tám mươi lần. `Sahassakkhattuṁ` (`:46.1`) = 1.000 → một ngàn lần. `Kappasatasahassamhi` (`:47.1`) = sata 100 × sahassa 1.000 = 100.000 → một trăm ngàn kiếp, viết `Sau một trăm ngàn kiếp nữa` vì đây là thọ ký tương lai
  (`bhavissati`; cùng cách ở `tha-ap23:40.1`). `Asītikoṭiṁ` (`:49.1`) = 80 koṭi, giữ `koṭi` như `tha-ap23:41.1` và `tha-ap5`. `Satasahasse` (`:51.1`) và `Satasahassito` (`:53.1`) = 100.000 → một trăm ngàn kiếp (kiếp, như bài liền kề `tha-ap23:50.1`).
  `Paṭhamā … dutiyā … tatiyā … catutthī … pañcamiyā … chaṭṭhā` = thứ nhất … sáu (`:4`–`:5`); `Vediyo satta` (`:27.1`) = bảy hàng lan can; `sattahi ratnehi` (`:9.1`) = bảy thứ báu; `caturaṅginī` (`:41.2`) = bốn binh chủng;
  `catudīpissara` (`:52.2`) = chúa tể bốn châu; `catasso` (`:54.1`) = 4, `aṭṭhime` (`:54.2`) = 8, `Chaḷabhiññā` (`:54.3`) = 6; `dutiyaṁ` (`:56.1`) = thứ hai. KHÔNG có cụm số nào chưa phân xử trong bài; điểm `tiṁsa` ở trên theo chỉ dẫn nên nếu người biên tập quyết định khác cho
  `Tiṁsakappasahassa` thì phải sửa cả `:45.1` lẫn các khoá cùng Pāli ở `tha-ap` khác.

  `:0.3` VÀ TIÊU ĐỀ. Pāli `2 Upavānattheraapadāna` BẮT ĐẦU bằng chữ số nên giữ số thứ tự theo hình thức `N. `. Đo trên 552 tệp `tha-ap` khác của cây làm việc: Pāli có số và Việt có số 164 · Pāli không số và Việt không số 389 · Việt thêm số ở chỗ Pāli không có 0 · Pāli có số mà Việt bỏ 0.
  `translationTitle` BẰNG ĐÚNG giá trị `:0.3`: `2. Bài Kệ Tuyên Ngôn Về Trưởng Lão Upavāna`. Phe chính tả của `apadāna` ở `:0.3`, đo hai phạm vi (không tính bài này): toàn tầng `tha-ap` đã dịch `Tuyên Ngợ` 245 · `Ký Sự` 151 · `Tuyên Ngôn` 139 · `Tuyên Ngợi` 10 · `Kinh Kệ` 5; phạm vi gần nhất,
  cùng phẩm Subhūti (`tha-ap25`–`tha-ap34`, các bài đã dịch) `Tuyên Ngôn` 4 · `Tuyên Ngợ` 4 · `Tuyên Ngợi` 2. Hai phạm vi cho hai đa số khác nhau; `Tuyên Ngợ` là dạng sai chính tả (không có nghĩa trong tiếng Việt); chọn `Tuyên Ngôn` như bài liền kề `tha-ap23`, `tha-ap25`, `tha-ap26`, và dùng cùng chữ
  ở `:0.3` và `:56.1` để bài không tự mâu thuẫn. Cần người biên tập phán một lượt cho cả cuốn. `:0.1` `Therāpadāna` giữ nguyên Pāli (khớp 490/501 khoá cùng Pāli ở tiền lệ). `:0.2` `Phẩm Subhūti` khớp 7/7 tiền lệ cùng Pāli. `:56.1` theo khuôn
  `Bài Kệ Tuyên Ngôn Về Trưởng Lão <tên>, thứ <số>.` (`tha-ap23:53.1`, `tha-ap134:9.1`). `:55.1` theo nhóm `Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này` (đo trên các tệp `tha-ap` đã dịch của cây làm việc, ngoài bài này: `những bài kệ này` 547 khoá · số ít `bài kệ này` 2 khoá),
  vì Pāli `imā gāthāyo` là số nhiều.

  TIỀN LỆ, ĐO THẬT. Dựng chỉ mục Pāli → Việt trên các tệp `tha-ap` đã dịch của cây chính (không gồm bài này). Trong 225 khoá của bài, 49 khoá có Pāli trùng nguyên văn với khoá đã dịch ở bài khác; 40 khoá dùng lại nguyên văn bản Việt của tiền lệ
  (kể cả khác biệt duy nhất là dấu cuối dòng), 9 khoá khác có chủ ý: `:1.4` `Đức Chánh Đẳng Giác` thay `Đức Chánh Giác` để khớp `sambuddhaṁ` ở `tha-ap23:42.1`; `:19.4`/`:23.2`/`:36.2` `lokanāthassa tādino` thêm `cho` vào tiền lệ
  `Đấng Bảo Hộ Thế Gian, bậc Bất Động;` (2 khoá) vì là cách chỉ định thuộc cách (tặng cách) của câu, giữ nguyên các chữ còn lại; `:31.2` `abhisammatanāmako` là `tên là Abhisammata` (tiền lệ `tha-ap80:5.2` dịch `có vị vua mang tên Abhisammata` vì ở đó chủ thể là vua, ở đây là
  dạ-xoa do chư thiên đặt ra theo `:31.1`); `:42.1` `Sáu mươi ngàn nhạc cụ` thay cho hai tiền lệ sai (`tha-ap102:2.3` `sáu mươi vạn ngàn năm`, `tha-ap116:6.1` `Hai trăm năm năm mươi sáu ngàn lần`); `:43.1` `Tám mươi sáu ngàn` thay tiền lệ sai `tha-ap17:4.3`
  `Tám mươi ngàn thiên nữ` (cha 6 + asīti 80 = 86; xem mục SỐ PĀLI); `:45.1` `ngàn` thay `nghìn` (xem mục số); `:47.1` `Sau một trăm ngàn kiếp nữa` vì là thọ ký tương lai. Ba tiền lệ sai nằm ngoài lát này: báo, không sửa.
  Trong bài có 16 nhóm Pāli trùng (bỏ dấu cuối) trong chính bài (điệp khúc đoạn các loài bàn bạc `:7.2`/`:10.2`/`:14.2`/`:18.2`/`:21.2`/`:25.2`, `:7.3`/`:11.3`/`:15.3`/`:19.3`/`:23.1`/`:26.3`, `:7.4`/`:11.4`/`:15.4`/`:19.4`/`:23.2`/`:26.4`/`:36.2`, `:3.4`/`:10.4`/`:14.4`, `:10.3`/`:18.3`,
  `:14.3`/`:21.3`, `:11.2`/`:15.2`/`:19.2`/`:22.4`, `:15.1`/`:19.1`/`:22.3`, `:16.3`/`:20.1`/`:24.1`, `:16.4`/`:19.6`/`:20.2`/`:23.4`/`:24.2`, `:18.5`/`:22.1`, `:18.6`/`:22.2`, `:20.4`/`:24.4`/`:28.2`, `:41.3`/`:42.3`/`:44.3`, `:41.4`/`:42.4`/`:44.4`/`:53.4`, và `:30.2`/`:33.4`);
  15/16 nhóm bản Việt khớp nhau (đã bỏ qua khác biệt dấu cuối dòng); 1 nhóm lệch có chủ ý: `:30.2` `thūpaṁ pūjenti mānusā;` dịch `là loài người cúng dường bảo tháp;` (vì `mānusā` là chủ ngữ của mệnh đề quan hệ mở ở `:30.1` `ye keci`) còn `:33.4` cùng Pāli là mệnh đề chính nên `loài người cúng dường bảo tháp.`
  Dấu cuối dòng mỗi khoá khớp Pāli, trừ 7 chỗ có chủ ý: `:7.2`, `:10.2`, `:14.2`, `:18.2`, `:21.2`, `:25.2` (Pāli `;`, Việt `:` vì kế sau là lời bàn bạc của các loài) và `:34.4` (Pāli `.`, Việt `:` vì kế sau là lời tự nhủ trong nháy đơn, như cách dẫn lời đã dùng ở `tha-ap23`).

  THUẬT NGỮ, ĐO THẬT. `thūpa` → `bảo tháp` (tầng `tha-ap`, số lượt dùng: `bảo tháp` 25 · `tháp` 10), `cetiya` → `tháp` (5 lượt `tháp`, giữ để hai chữ Pāli khác nhau còn thấy khác nhau trong Việt). `dhātu` → `xá-lợi` (9 lượt `xá-lợi` · 7 lượt giữ nguyên `dhātu`). `yojana` → `do-tuần`. `garuḷa` → `kim sí điểu`
  (toàn tầng `sutta`, số lượt: `kim sí điểu` các dạng 48 · `garuḷa` 2). `gandhabba` → `càn-thát-bà` (24 lượt · `Gandhabba` 3 lượt). `kumbhaṇḍa` → `cưu-bàn-trà` (2 lượt trong toàn tầng, trong đó 1 lượt ở một khoá `tha-ap` cùng Pāli). `yakkha` → `dạ-xoa` (82 lượt · `dạ xoa` 14 lượt). `nāga` (chỉ loài) → `loài rồng` (5 lượt · `loài nāga` 4 lượt; chọn `rồng`
  để khác với `nāga` là voi ở `tha-ap` khác). `maṇi` → `ngọc ma-ni` (11 lượt). `appamatta`/`pamatta` → `không phóng dật`/`phóng dật` (toàn `kn`, số lượt: `không phóng dật` 86 · `không buông lung` 8; `chớ phóng dật` 11 · `chớ buông lung` 0). `pāṭihāriya` → `điều mầu nhiệm` (`sappāṭihāriyaṁ` → `sự mầu nhiệm` ở `ud6.1`).
  `lokanātha` → `Đấng Bảo Hộ Thế Gian` ở các dòng dâng cúng (tiền lệ chính xác 2 khoá; ở bài liền kề `tha-ap23` là `Lãnh Đạo thế gian` cho bối cảnh khác). `sarīrakiccaṁ katvāna` (`:3.1`) → `Sau khi lo liệu việc thân thể` (tiền lệ chính xác `cp12:3.1`; không thêm `tang lễ`).
  `jino` → `Đức Chiến Thắng` (13 khoá tiền lệ). `padesarajja` → `Vương quyền cai quản các vùng đất rộng lớn` (7 khoá · `Vương quốc rộng lớn ấy` 15; chọn dạng đầu vì `padesa` là một phần/vùng, và khớp `tha-ap23:38.1`). `ārādhayitvā` → `làm đẹp lòng` (khớp `tha-ap23:42.1`). `devindo` (`:45.3`) → `chúa chư thiên`
  (9 lượt). `bhatako` → `người làm thuê` (`tha-ap26:1.2`). `uttareyyapaṭaṁ` → `tấm áo choàng ngoài` (`tha-ap340:19.4` `chiếc áo choàng ngoài`). `kañcuka` → `lớp bọc ngoài` (0 tiền lệ; ngoài nghĩa đen `áo giáp`, chọn `lớp bọc` vì Pāli `imamhi … thūpamhi kassāma kañcukaṁ` nói bọc lên bảo tháp).
  `Indanīla`, `Mahānīla`, `Jotirasa` (`:12.1`–`:12.2`) và `masāragalla` (`:5.3`): tên ngọc, giữ nguyên Pāli, không thêm giải thích (0 tiền lệ cho `Indanīla`/`Mahānīla`/`masāragalla`; `jotirasa` đã giữ nguyên ở `tha-ap425:10.2`).
  `lohitaṅga` → `hồng ngọc` (`tha-ap474:13.2`), `rūpiya` → `bạc`, `phalika` → `pha lê`.

  BẤT ĐỊNH, GHI RÕ VÀ KHÔNG ĐƯA VÀO THÂN KINH. (1) `ānanda` (`:40.1`): đọc là `hoan hỷ` (dạng chỉ niềm vui, như `ānandī` ở bài song song `tha-ap562:41.1`, vì người kể là Upavāna nên không thể gọi Ānanda); cách đọc khác là hô cách `Ānanda`; `pītisañjananaṁ mama` (`:40.2`) dịch `điều làm khởi lên niềm hỷ nơi tôi`
  với danh từ `điều` không có trong Pāli. (2) `yassa dhātudharedisaṁ` (`:35.2`): 0 khoá cùng Pāli đã dịch trong tầng (chỉ có ở bài song song `tha-ap562`, chưa dịch); đọc `dhātudhare` + `īdisaṁ` thành `nơi chứa xá-lợi … như thế này`; có thể chủ ngữ là vật đựng xá-lợi (bảo tháp) hay là nơi giữ xá-lợi nói chung. `kāraṁ kubbaṁ na tappare` (`:35.4`) dịch `làm việc cúng dường mà không thấy đủ`: `kāra` hiểu là sự cúng kính/cúng dường, `na tappare` là không thấy đủ.
  (3) `Abhibhonti na tassābhā, candasūrā satārakā` (`:29.1`–`:29.2`): chọn chủ ngữ là mặt trăng, mặt trời, các vì sao (số nhiều khớp `abhibhonti`) và `tassābhā` là `ánh sáng của nó` (đối cách); cách đọc ngược (ánh sáng của bảo tháp không át chúng) ít khớp ngữ pháp nhưng cần người biên tập kiểm. `padīpopi na pajjali` (`:29.4`) dịch sát chữ `không cháy sáng`; có thể hiểu là không ai cần thắp. (4) `dāmaṁ passanti gacchato` (`:32.2`): `gacchato` là cách thuộc/lìa của phân từ; dịch `thấy tràng hoa đang di chuyển`, không phân định rõ chủ thể di chuyển.
  `Evaṁ passitvā gacchantā` (`:32.3`) dịch `Những ai sau khi thấy như vậy mà ra đi`: `gacchantā` có thể là ra về hoặc lìa đời, giữ mơ hồ. (5) `sabbaratanamayūpari` (`:5.4`) đọc `upari` = phía trên tầng thứ sáu, nên viết `phía trên đó`; tầng thứ bảy không được Pāli nêu bằng số. `Jaṅghā` (`:6.1`) dịch `Phần chân`. (6) `Sabbaṁ maṇimayaṁ āsi, tāvatā buddhacetiyaṁ` (`:13.1`–`:13.2`):
  `tāvatā` dịch `đến mức ấy`; cách đọc khác `lúc ấy`. (7) `Sabbaṁ maṇimayaṁ thūpaṁ, akaruṁ te ca kañcukaṁ` (`:16.1`–`:16.2`) đọc `cả bảo tháp toàn bằng ngọc ma-ni; họ cũng làm một lớp bọc`. (8) `uttari` (`:31.4`) `cao hơn nữa`. (9) `appamattā sadevakā` (`:11.2` và các khoá cùng Pāli): `sadevakā` đọc là `loài người cùng chư thiên` theo cặp `manussā … devā` ở dòng ngay trước; không thêm chủ thể ngoài hai nhóm đó.
  (10) `ukkhipanti` (`:30.4`) không có tân ngữ trong Pāli, giữ `tung lên không trung` không thêm vật cúng. (11) `Sudhotaṁ rajakenāhaṁ` (`:37.1`): `rajakena` (tác nhân, thợ giặt) dịch `được người thợ giặt giặt thật sạch`; không thêm việc nhờ người giặt. (12) `senā ca caturaṅginī` (`:41.2`) `đạo quân bốn binh chủng` (voi, ngựa, xe, bộ binh theo `:41.1`); `bheriyo samalaṅkatā` (`:42.2`) `trống bherī được trang hoàng` (giữ `bherī`).
  (13) `Tiṁsakappasahassa`: theo chỉ dẫn là 30.000 kiếp; chứng cứ độc lập vẫn không có (xem mục số). (14) `Rơi khỏi cõi trời` (`:48.1`, `cavitvāna`): 8 khoá tiền lệ cùng chữ, giữ; có thể thay bằng `mệnh chung` nhưng bị 8 tiền lệ chặn. (15) Sai số ở ba tiền lệ ngoài lát: `tha-ap17:4.3`, `tha-ap102:2.3`, `tha-ap116:6.1` (mục tiền lệ).

