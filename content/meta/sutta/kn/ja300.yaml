notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho ja300.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các thuật ngữ cổ và đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 29 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): đọc lại cả 29 khoá bằng Pāli. Sửa 3.3 (lahuṁ karonti attānaṁ là 'tự hạ thấp mình', bản cũ thêm 'dễ dàng khinh suất hủy hoại') và 3.4 (ajakāraṇā là 'vì con dê', bản cũ thêm 'nhỏ'). Bất định, giữ nguyên: 2.3 vītatapo ajjhappatto (PED ajjhappatta: đã tới / lao vào / đạt được; J iii.296 xếp nghĩa 'đạt được'), bản hiện tại thêm sắc thái 'vừa thấy'; 6.1 sirivhayano và 6.x makkaṭiyā 'khỉ cái' trong bài tóm tắt chưa phân xử được. 2/29 khoá sửa.

  Quyết định hội đồng biên tập 2026-10-16: C1 — 0.3 (tên phẩm thống nhất với các bài cùng phẩm: cùng tên Pāli thì cùng tên Việt); C2 — `4.2` (dòng kết thêm dấu phẩy: "…, thứ N."); C3 — `0.2`, `9.1`, `8.4` (tên nipāta "Nhóm N Kệ").
