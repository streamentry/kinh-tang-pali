notes: |-
  Lát c14. KHÔNG có Sujato tại commit đã ghim cho mil1 ⇒ `draft`, xem
  blocking_errors.

  2/31 khoá trùng nguyên văn: `Milindapañha` → “Milindapañha” (152 bản so với “Mi-lan-đà
  Vấn Đạo” 8, “Mi-tiên Vấn Đáp” 3); `Namo tassa Bhagavato Arahato Sammāsambuddhassa.` →
  “Kính lễ Đức Phật, bậc A-la-hán, bậc Chánh Đẳng Giác.” (8 bản — bv1:1.1 — so với “Kính
  lễ Đức Thế Tôn” 1 ở kp1:1.1 và “Kính lạ Đức Thế Tôn” 1 ở thig1.1:1.0). Đây là công thức
  khai mở rất phổ biến; tôi theo đa số và không tự tạo cách thứ N+1.

  Đây là bài có điểm thấp nhất lát, và tôi ghi rõ vì sao thay vì nâng điểm: 2.4 khoá mô tả
  thành phố Sāgalā (7.2-7.3) là HAI khoá văn xuôi liên tục dài nhất trong lát, gồm hàng
  chục danh từ ghép chưa từng có tiền lệ trong tầng Việt. Tôi đã tra từng cái (grep tầng
  Việt = 0): `yonakānaṁ nānāpuṭabhedanaṁ` (bốn ngã tư), `upavanataḷākapokkharaṇi`
  (hồ sen), `nihatapaccatthikaṁ`, `daḷhamaṭṭālakoṭṭhaka` (gạch vữa), `gopapura` (nhà trọ
  công cộng), `paripūritantarāpaṇa` (hào trong), `dānagga` (kho lẫm), `kosakoṭṭhāgāra`
  (kho lẫm lớn), `pajjotamānanidhi` (đảo ngọc), `uttarakuru` ×0, `āḷaka`/`mandā` ×0,
  `siṅgāra` ×0, `hi-mă-lạ` (Himalaya). Tên riêng Sāgalā, Āḷaka, Mandā, Siṅgāra đã khai vào
  bộ nhớ tiến trình đúng cơ chế `lọt_pāli` của `_hvi.py` (Pāli viết chúng trong từ ghép
  nên so-token không nhận ra). Không có tầng tham khảo nào để đối chiếu 310 từ đó.

  0 tiền lệ cho `Ārambhakathā` (grep tầng Việt = 0) ⇒ tôi đặt “1. Phần Dẫn Nhập” và ghi ở
  đây; người điều phối nên thống nhất với tên các phần khác của Milindapañha.

  Bất định đã ghi: `kaṅkhāṭṭhānavidālaneti` (6.4) — đây là tên bài đầu tiên của
  Milindapañha trong bản Pāli này; tôi dịch nghĩa đen “kẻ phá tung chỗ chặn của sự khao
  khát” (kaṅkhā = khao khát, āṭṭhāna = chỗ chặn/địa điểm, vidālana = phá tung). Có thể
  đây là một danh xưng riêng; tôi giữ cách dịch nghĩa và ghi ở đây.

  Một lượt review tự bắt được: `pubbayogo` (8.3) là “phương diện trước / trên bề mặt”,
  không phải “trước đây”; tôi đã sửa từ “Trước đây” thành “Trên phương diện trước”.

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  Giải quyết draft 2026-10-12: thay thế phần ghi chú cũ ở trên về 6.4, 8.3 và các từ ghép
  của 7.2–7.3 (các nhận định cũ đó sai nghĩa và đã bị gỡ). Đọc đối kháng lại cả 31 khoá từ
  Pāli; 29/31 khoá được viết lại hoặc sửa lỗi nghĩa thật, chỉ `mil1:0.1` và `mil1:0.2` giữ nguyên.
  Lỗi nghĩa thật đã sửa: (1) `mil1:1.1` `Bhagavato` là “Thế Tôn”, không phải “Đức Phật”; đối chiếu
  cùng công thức `Namo tassa bhagavato…` ở nơi khác: “Đức Phật” 14 khoá (loạt bv/cp), “Thế Tôn” 14
  khoá (mn, an, sn, dn, kp), nên đổi theo đúng từ Pāli và khớp `kp1:1.1`. (2) 3.1–3.4: `āsajja`
  là “đến gần”, `citrakathiṁ` / `ukkādhāraṁ` / `tamonudaṁ` là ba danh hiệu của vị được tìm đến;
  bản cũ “ngồi yên một chút, hẹn một cuộc trò chuyện” là bịa; `ṭhānāṭṭhānagate` là “thuộc về điều
  có thể và điều không thể” (tiền lệ `ne21:19.1`). (3) 4.1–4.4: `abbhutā lomahaṁsanā` là
  “đáng kinh ngạc, rợn da gà” (13 khoá cùng cặp từ), bản cũ “kinh ngạc nhờ, thấm sâu, chấn động”
  vô nghĩa. (4) 5.1–5.4: `ogāḷha` là “thấm sâu / đắm vào”, không phải “hố sâu”; `opammehi nayehi`
  là “các thí dụ và các phương cách”. (5) 6.2 `hāsayitvāna mānasaṁ` là “làm cho tâm hoan hỷ”,
  không phải “lắng định”; 6.4 `kaṅkhā` là NGHI HOẶC (không phải “khao khát”), `vidālane` là tính
  từ bổ nghĩa `pañhe` (đối cách số nhiều), nên là “câu hỏi … xé toang những chỗ nghi hoặc”, không
  phải một danh xưng; ghi chú cũ cho rằng đây là tên riêng là sai. (6) 7.2: bản cũ bịa “có bốn cửa
  ngõ, chia thành bốn phần”, “đống gạch vữa”, “chỗ lưu trú”, “đã dựng thành xây tường”; đã viết
  lại sát từng thành tố ghép: `yonakānaṁ nānāpuṭabhedanaṁ` = “của người Yonaka, nơi mở các kiện
  hàng đủ loại”; `sutavantanimmitaṁ` = “do những bậc có học tạo dựng”; `daḷhamaṭṭālakoṭṭhaka` = tháp
  canh và cổng lầu kiên cố; `gopuratoraṇa` = cổng thành và vòm cổng; `antepura` = nội thành. (7)
  7.3: thêm `ādi` (“và các loại khác”) cho vải Kāsī/Koṭumbara; `paripūritantarāpaṇaṁ` là các dãy
  chợ giữa phố; `kosakoṭṭhāgāra` là kho báu và kho lúa; `siṅgāravāṇija` giữ “thương nhân buôn đồ
  trang sức”. (8) 8.1: `chadhā` là “thành SÁU phần” (bản cũ bỏ mất số lượng); `pubbakammaṁ` là
  “nghiệp quá khứ” (mil2:1.1 đã đồng nhất `pubbayoga` với nghiệp quá khứ), không phải “công việc”.
  (9) 8.3: Pāli liệt kê SÁU mục (việc làm từ trước, Milindapañha, câu hỏi về đặc trưng,
  Meṇḍakapañha, câu hỏi suy luận, câu hỏi bằng chuyện ví dụ); bản cũ bỏ mục đầu và dịch sai
  `meṇḍaka` thành “trưởng giả”: Meṇḍaka là tên một phần, giữ nguyên như ở `mil5.*:0.2` (43 tiêu
  đề). (10) 9.1: `milindapañho … duvidho` là “Milindapañha có hai loại”, hai loại là câu hỏi về
  đặc trưng và câu hỏi cắt đứt nghi ngờ (`vimaticchedana`, tiền lệ “cắt đứt hoài nghi” ở 3 nơi);
  9.2: `yogikathāpañha` là “câu hỏi về chuyện của các hành giả”, `mahāvagga` là “Đại Phẩm” (như
  `mil3.1.1:0.2`). (11) 2.3 bỏ “Tôn giả” vì Pāli chỉ có `nāgasenaṁ` (kho dùng “Tôn giả” khi Pāli
  có `āyasmā`).

  Blocker đã GIỮ nguyên (loại giới hạn upstream, đúng sự thật): bản Anh Sujato không có cho
  uid này tại commit đã ghim, `vietnamese-current` vắng, lớp `english-project` không có; đây không
  phải lỗi văn bản. Phép đo độ phủ: mẫu số 7 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`), Anh
  phủ 0/7, nên cổng độ phủ không có gì để đối chiếu và Pāli phải tự đứng vững ở cả 31 khoá.
  `triangulation` giữ 7,5 (≤ 8,0). Không có blocker loại độ phủ riêng hay lỗi văn bản chưa xử lý.

  Bất định còn lại (ghi tại đây, không thêm vào thân kinh): `puṭabhedana` “nơi mở các kiện hàng”
  (hiểu là trung tâm buôn bán, dịch sát chữ); `sabhājana` trong 7.3 (hiểu là sự cung kính tiếp
  đón, không chắc là danh từ chỉ cuộc hội họp); `samattitā` ở 5.2 (“phủ khắp”, một dạng đọc
  khác là `samatthitā`); `siṅgāra` (đồ trang sức hay hàng xa xỉ); `patthara` (đá, không hiểu là đá
  quý); `caccara` (quảng trường). `Ārambhakathā` giữ “Phần Dẫn Nhập”, chưa có tiền lệ khác trong
  kho. Tên các phần giữ Pāli (Milindapañha, Meṇḍakapañha) theo tiền lệ tiêu đề `mil5.*`; ba mục
  còn lại ở 8.3 dịch nghĩa. Cổng kỹ thuật: bốn lệnh `npm run validate`, `npm test`,
  `npm run check`, `npm run build` chưa chạy trong lượt này nên `technical_integrity` giữ 9,6.
  Điểm mới: ngữ nghĩa 8,8 (còn mấy từ ghép dài chưa có đối chiếu độc lập), thuật ngữ 8,8, toàn
  vẹn về bất định 9,0 (đã ghi đủ ở trên), còn lại như cũ; trung bình thô 9,02 nhưng blocker thắng nên bài vẫn `draft`.

  Giải quyết draft 2026-10-13 (vòng 2): đọc đối kháng lại cả 31 khoá từ Pāli, đối chiếu tiền lệ trong kho. Lỗi nghĩa thật: 0/31. Ba chỗ thêm chữ không có trong Pāli đã gỡ: `mil1:7.3` bỏ “ngõ” (Pāli chỉ có bốn mục `vīthi`, `caccara`, `catukka`, `siṅghāṭaka`; bản trước có năm mục); `mil1:4.3` “đi vào tận tim” thành “đi vào tim” (`hadayaṅgama`, các nơi khác dịch “thấm vào tim”, “đi vào lòng người”); `mil1:5.3` bỏ “thật” (`citrā` chỉ là “muôn vẻ”). Các khoá còn lại giữ nguyên. Các số liệu trong mục 2026-10-12 vẫn đúng: 8.3 liệt kê đủ sáu mục khớp Pāli; 8.1 “nghiệp quá khứ” khớp `mil2:1.1`.
  Phân loại blocker: loại (A), thiếu bản Anh upstream, kiểm lại trên cache Sujato (không có tệp `mil1_translation-en-sujato.json`) và trên danh mục tệp của commit ghim (0 mục `kn/mil`); chuỗi blocker cũ lẫn nhiều ý nên đã viết lại thành một khẳng định thuần túy về upstream, bắt đầu bằng `noEnglishEditionUpstream:`; không còn lời nào về lỗi văn bản vì không có lỗi văn bản chưa giải quyết. Phần độ phủ (0/7 khoá Pāli có nội dung) là hệ quả trực tiếp của việc không có bản Anh, không phải blocker riêng. Không có blocker loại (B), (C) hay (D) nào cần giữ; phần bất định ở trên (`puṭabhedana`, `sabhājana`, `samattitā`/`samatthitā`, `siṅgāra`, `patthara`, `caccara`) là cách hiểu từ vựng đã ghi, không chặn bài. Điểm giữ nguyên (trung bình thô 9,02), `triangulation` 7,5 vì không có bản Anh độc lập; bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy nên `technical_integrity` giữ 9,6.
