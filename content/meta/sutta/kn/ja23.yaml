notes: |-
  Phẩm Nai Bốn Sừng đồng nhất với ja21/ja22/ja24/ja25 cùng vagga.
    Thuật ngữ có tiền lệ: tuấn mã 3 (ājānīya); người đánh xe 89 (sārathī hô cách);
    uống nước 73; ngựa của vua 1 (bhojja).
    0 tiền lệ, đặt mới có lý do: vaḷava/vāḷava (gelding, đối lập ngựa thuần) → ngựa thiến,
    dùng đồng nhất ở ja24:1.4; salla → mũi tên; yuñja maṁ → thắng ta vào xe.
    Người nói là con ngựa bị thương xin được ra trận — giữ nguyên khung lời trực tiếp.
  Đối chiếu Pāli đã ghim với Anh Sujato ở 8/9 khoá; khoá kết 2.1 Sujato để trống
    (công thức tên kinh + số thứ tự), dịch từ Pāli theo tiền lệ ja1 đã published
    (Kinh Bụi Dơ thứ nhất). Không có tầng Việt hiện hành cho Jātaka trong snapshot
    đã ghim (tiếng Việt upstream chỉ có Pháp Cú) — giới hạn của bản chụp, không phải
    thiếu sót của repo. Không có dấu lược …pe… trong Pāli lát này nên hai phía đều 0.
