notes: |-
  Dịch từ Pāli root, 170 khoá, đủ khoá, đúng thứ tự Pāli. Tên bài (khoá 0.3) bằng đúng translationTitle: Pāli 0.3 không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số). Kiểu tên: ở phạm vi tha-ap500 đến tha-ap600 đã dịch, Ký Sự Về là 23 tên so với Bài Kệ Tuyên Ngợ 16 tên; các bài cùng phẩm Kaccāyana (tha-ap533, 534, 537, 539, 541, 542) đều dùng Ký Sự Về nên theo đó. Chữ Tuyên Ngợ không dùng vì chưa rõ gốc; vấn đề đó để biên tập phán một lượt cho cả cuốn.
  Khoá 0.2 Kaccāyanavagga dịch Phẩm Kaccāyana, như sáu bài cùng phẩm đã có. Khoá 44.1 dịch thứ ba: Pāli tatiyaṁ trong colophon của tầng tha-ap đã dịch là thứ ba 50 khoá trên 50. Khoá 43.1 theo công thức Tôi nghe như vầy ... đã nói những bài kệ này (485 khoá trong tầng tha-ap dùng những bài kệ này, 2 khoá dùng số ít); Pāli imā gāthāyo là số nhiều nên chọn nhóm 485.
  Số Pāli, tự tính: satasahasse, Kappasatasahassāni và Satasahassito kappe là sata 100 nhân sahassa 1000 bằng 100.000, dịch một trăm ngàn ở 11.3, 13.1 và 39.1. Pañca paccekabuddhānaṁ satāni ở 17.3 và 17.4 là năm trăm (5 nhân 100 bằng 500), Pāli tách số và đơn vị qua hai khoá nên bản Việt đặt chữ năm trăm ở khoá 17.4. Sahassaparivārena ở 17.1 là một ngàn tùy tùng; bhikkhusahassāni ở 37.1 là hàng ngàn tỳ-kheo, không có số cụ thể. Temāsaṁ ở 18.1 là ba tháng. Tidasa ở 18.4 là cõi chư thiên Ba mươi ba (tidasa, ti 3 cộng dasa 10, theo quy ước tầng là Tam Thập Tam; 537:13.4 dịch cõi trời Ba mươi ba). Bài không có cụm tiṁsa nên không có số tiṁsa nào cần phán; không có Tiṁsakappasahassa nên không có bất định số lượng nào.
  Satasahassito kappe ở 13.1 là lời thọ ký tương lai (Gotama sẽ làm bậc Thầy), nên dịch Sau một trăm ngàn kiếp nữa, như tha-ap537, 539, 541, 543; còn Satasahasse kataṁ kammaṁ ở 39.1 là quá khứ (nghiệp đã làm cách đây một trăm ngàn kiếp). Cùng lời thọ ký, 11.3 đến 11.4 và 12.3 đến 12.4 dịch tương lai với chữ sẽ (nupapajjati duggatiṁ, nibbānaṁ pāpuṇissati).
  Ngôi kể: ta suốt bài, theo các bài cùng phẩm (tha-ap533, 534, 537, 539, 541). Đức Phật tự xưng Ta viết hoa ở 9.1. Khoá 39.2, 39.4, 7.4 và 36.4 là Pāli trùng với bài khác trong tầng mà đa số dịch là tôi; ở đây đổi thành ta theo ngôi của phẩm. Công thức Kilesā jhāpitā mayhaṁ (ta 100 so với tôi 41 trong tầng), viharāmi anāsavo (ta 106 so với tôi 50), Svāgataṁ vata me āsi (ta 100 so với tôi 36), kataṁ buddhassa sāsanaṁ (dịch không chủ ngữ, 111 khoá so với 23 khoá có tôi) và Paṭisambhidā catasso (Bốn vô ngại giải, 487 khoá) dùng đúng bản đa số của tầng.
  Pāli trùng nguyên văn trong chính bài: ba nhóm. Etena saccavajjena (26.3, 27.3, 28.3) và gamanaṁ me samijjhatu (26.4, 27.4) có Việt giống nhau; …pe… (40.2, 41.2, 42.2) giữ đúng một dấu lược …, Việt giống nhau. Vậy 3 nhóm, 0 nhóm Việt khác nhau. So với tầng tha-ap đã dịch: đã dò 28 khoá Pāli trùng nguyên văn (không tính khoá :0 và …pe…); 19 khoá dùng đúng bản đa số, 9 khoá khác: 7.4, 36.4, 39.2, 39.4 (tôi thành ta, như trên); 11.3 (chỉ khác chữ hoa đầu dòng); 13.1 (lời thọ ký tương lai, Sau … nữa, khác đa số 26 trên 42 là Vào một trăm ngàn đại kiếp trước, vốn là cách dịch cho cả quá khứ lẫn tương lai); 8.2 (bản duy nhất trong tầng thêm chữ lớn cho dundubhi, Pāli không có nên bỏ); 5.4 (bản duy nhất trong tầng dịch tâm hân hoan vì đóa hoa sen tuyệt nhất, không phản ánh jalajuttamanāmino, ở đây dịch của bậc mang tên Hoa Sen Tối Thượng); 15.4 (bản duy nhất dịch tôi lại trở về cung trời Đâu-suất, Pāli agamāsahaṁ không có chữ lại). Khoá 14.4 hessati satthu sāvako dùng môn đồ như bản đa số (8 trên 11 khoá trong tầng, gồm tha-ap544 và 547), dù sāvaka ở 6.2 và 31.2 dịch là đệ tử; hai cách cùng tồn tại trong tầng. Tổng 23 khoá dùng lại nguyên văn bản dịch đã có của cùng Pāli.
  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 42.3; nháy đơn mở ở 8.3 và đóng ở 14.4 (lời Đức Padumuttara thọ ký), mở ở 22.1 và đóng ở 23.2 (lời các thương nhân), mở ở 26.1 và đóng ở 28.4 (lời nguyện chân thật), mở ở 33.3 và đóng ở 33.4 (lời xin xuất gia), mở ở 34.1 và đóng ở 34.3 (lời Đức Phật); khớp Pāli từng khoá, đã kiểm 4 loại dấu trên 170 khoá, 0 lệch.
  Phép đo: tập khoá Việt bằng tập khoá Pāli, 170 trên 170, cùng thứ tự; …pe… đúng một …, 3 khoá, 0 khoá bung thành văn; Pāli bài này không có (…) trần nên Việt cũng không có; NFC, không khoá rỗng, không khoảng trắng thừa, không chữ số, không Pāli lọt sang Việt trong thân kinh.
  Bất định, không đưa vào thân kinh: 1.3 ajaṭākāse dịch giữa bầu trời quang đãng (ajaṭa là không rối, không mây, theo mạch ravīva saradambare là trời thu); 1.2 pāragū theo bản dịch đã có (bậc đã vượt qua mọi pháp, 10 trên 12 khoá). 2.1 vacanābhāya dịch bằng ánh sáng của lời nói (vacana cộng ābhā); 2.2 veneyyapadumāni dịch những đóa sen đáng được điều phục, theo veneyyaṁ đáng được điều phục có một tiền lệ trong tầng; bodheti ở 2.1 dịch làm thức tỉnh cho hợp hình ảnh hoa sen nở. 3.2 khajjotābhā yathā ravi dịch như mặt trời lấn át ánh đom đóm, chữ lấn át lấy từ hanti ở 3.1 chung cho hai vế; 3.3 saccatthābhaṁ đọc sacca cộng attha cộng ābhā (ánh sáng của nghĩa chân thật). 3.4 ratanaṁva divākaro dịch như vầng mặt trời tựa viên ngọc, đây là cách đọc ít giả định nhất; không chắc ratanaṁ là ngọc làm hình ảnh so sánh cho Đức Phật hay là vật được mặt trời làm sáng, chưa phân xử được vì không có bản Anh. 4.1 āyatibhūto dịch nơi phát sinh (đọc như āyatana, mỏ, nguồn); 4.3 Pajjunna giữ nguyên tên, theo tầng (Pajjunna, Pajjuna ở các khoá khác), không giải thích trong thân kinh. 5.1 akkhadassa dịch quan xét xử (theo 8.4 vinicchayavisāradaṁ tinh thông việc xét xử và 10.2 rājayuttaṁ viên chức của nhà vua); tầng không có tiền lệ. 5.2 nagare haṁsasavhaye dịch thành có tên Haṁsa, khớp với thành Haṁsavatī ở bài tha-ap534, nhưng bài này không nêu -vatī nên không thêm. 5.4 jalajuttamanāmino là bậc mang tên Hoa Sen Tối Thượng (jalaja là sinh từ nước, tức hoa sen; Padumuttara cùng nghĩa). 6.2 katāvino dịch đã làm xong việc cần làm (không dịch thẳng là A-la-hán); 10.3 giữ cùng chữ. 8.1 haṁsasamabhāgo dịch bậc có dáng hình cân đối như thiên nga, đây là cách đọc chưa chắc (sama cộng bhāga); 8.2 haṁsadundubhinissano dịch có tiếng như tiếng thiên nga và tiếng trống. 9.3 jīmūtavaṇṇaṁ dịch có sắc như mây mưa (jīmūta là mây mưa). 12.1 devasobhaggaṁ dịch sự huy hoàng của chư thiên; 12.3 sesena dịch nhờ phần còn lại (phần nghiệp còn lại, như Tena kammāvasesena ở hai nơi trong tầng, nhưng bài không nêu nghiệp). 15.1 sukataṁ kāraṁ dịch việc phụng sự tốt đẹp, tầng có tiền lệ kāraṁ katvāna là sau khi tỏ lòng tôn kính, hầu hạ. 16.4 keniyajātiyaṁ dịch dòng Keniya, giữ tên. 18.2 pacchādamha ticīvaraṁ dịch chúng ta đã khoác ba y lên các Ngài; tân ngữ các Ngài suy từ 17.3 và 17.4, Pāli không nêu, và cùng cách đọc với dussehi acchādayiṁ ở tha-ap534. 19.3 Kukkuṭamhi pure dịch thành Kukkuṭa. 20.3 Sesāmaccakule jātā dịch những người còn lại sinh trong các gia đình đại thần. 24.2 buddhamāmako dịch một người hết lòng với Đức Phật (māmaka có tiền lệ nghĩa người của ta, người thuộc về); 24.3 mahācandaṁ dịch rất hung dữ (canda là dữ dội), samatittikaṁ dịch đầy ắp tận miệng bờ; đây không phải tên sông. 26.1 và 26.2 cắt câu qua ranh giới khoá: Đức Phật ở 26.1 là chủ ngữ của tiṇṇo ở 26.2. 28.1 tiṇṇakantāro dịch đã vượt qua vùng hoang vắng (kantāra, 6 khoá trong tầng đều dịch là hoang vắng, đường đồng trống). 27.1 santigamo maggo dịch con đường đưa đến an tịnh. 29.1 saha kate saccavare dịch ngay khi lời chân thật cao quý được nói lên; maggā apagataṁ jalaṁ dịch nước đã rút khỏi lối đi. 30.2 udentaṁva pabhaṅkaraṁ dịch như vầng mặt trời đang mọc (pabhaṅkara là bậc làm ra ánh sáng, mặt trời); cách đọc khác là chữ ấy nói về chính Đức Phật. 30.4 dīparukkhaṁva dịch cây đèn (tầng có hai khoá cùng chữ dīparukkhaṁva, đều dịch là cây đèn). 31.3 Vāsavaṁ viya vassantaṁ giữ tên Vāsava; 31.4 desanājaladantaraṁ dịch giữa những đám mây thuyết giảng, đọc jalada là mây và antara là giữa; từ dantaraṁ ở bản Pāli ghim có vẻ ghép lạ, không có tiền lệ nào trong tầng để đối chiếu, nên đây là cách đọc chưa chắc. 32.3 āsaya dịch khuynh hướng. 33.4 bhave dịch cõi hữu theo tầng. 35.1 saha vācāya dịch ngay cùng với lời ấy (lời của Đức Phật ở 34.3). 35.2 bhikkhuvesadharā dịch mang hình tướng tỳ-kheo, 35.4 sotāpannā dịch bậc Dự Lưu (tầng dịch cả Dự Lưu lẫn Nhập Lưu). 36.1 và 36.2 chủ ngữ của gantvā và anusāsi là Đức Phật (vināyaka), không phải chúng ta, vì Pāli không có chủ ngữ số nhiều ở đây. 38.4 kappinoti dịch là Kappina, bỏ dấu ti theo phe bỏ trong phẩm (không để ngoặc). 39.3 pamutto saravegova dịch được phóng đi với tốc độ của mũi tên, chủ thể của pamutto không rõ (có thể là người nói được giải thoát, có thể là mũi tên); không có đối chiếu độc lập.
  Hệ quả giới hạn: ba tầng tham khảo đều vắng, triangulation hạ xuống 7.8 và status giữ draft.
  Cổng kỹ thuật để coordinator chạy (người dịch bị cấm chạy): npm run validate, npm test, npm run check, npm run build. technical_integrity đặt 9.6 vì chưa chạy bốn lệnh đó.
