  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 3.5 (nghĩa từ: `vimuttaṁ` «đã giải thoát» → «nghiêng hẳn về đó»; Pj II `vimuttanti ākiñcaññāyatanādīsu adhimuttaṃ`, lời giải cnd18:39.1–39.3 (bản Niddesa đọc `dhimuttaṁ`), DPD `vimutta` 3 «intent; resolved (on)», Sujato «committed to that»; người đắc Vô sở hữu xứ ở đây chưa giải thoát); sửa 4.1 (cách/quan hệ hợp từ: `ākiñcaññasambhava` «sự sinh khởi từ» → «nguồn sinh khởi của»; DPD chaṭṭhī tappurisa «source of nothingness», lời giải cnd18:43.1 `ākiñcaññāyatanasaṁvattaniko kammābhisaṅkhāro`, Pj II `ākiñcaññāyatanajanakaṃ kammābhisaṅkhāraṃ`). Như cnd2:83.5, 84.1.
