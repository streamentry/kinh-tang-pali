notes: |-
  Bản dịch tiếng Việt mới cho tha-ap34, Sāgatattheraapadāna — bài kệ của trưởng lão Sāgata, bài thứ hai của Kuṇḍadhānavagga. Đủ 60/60 khoá, thứ tự và tập khoá khớp Pāli.

  Nội dung: ở kiếp quá khứ ông là Bà-la-môn Sobhita, dẫn đệ tử đến tịnh xá, thấy Đức Padumuttara bước ra cổng, khởi tâm tịnh tín và tán thán Ngài (khoá 3.3–3.4, 4.1–7.4 là lời tán thán, nói với Đức Phật bằng ngôi thứ hai). Đức Padumuttara thọ ký (9.1–11.4) trong dấu nháy đơn: sau một trăm ngàn kiếp ở cõi trời, từ Đâu-suất mệnh chung sẽ xuất gia trong giáo pháp của Đức Thế Tôn Gotama, đạt quả A-la-hán, tên là Sāgata. Từ 12.1 là lời tự thuật của ngài ở kiếp cuối.

  Tên bài và thể thức :0.3 — đo trước khi chọn:
  - translationTitle bằng đúng giá trị khoá :0.3 trong bản dịch. Pāli :0.3 (Sāgatattheraapadāna) KHÔNG bắt đầu bằng số nên không giữ số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số).
  - Hình thức đầu tên: đo trên các :0.3 đã dịch của phẩm tha-ap trong cây này, Tuyên Ngợ 234 (cộng 10 khoá Tuyên Ngợi), Tuyên Ngôn 97, Ký Sự 96; ở phạm vi gần nhất (Kuṇḍadhānavagga, tha-ap38–42) Tuyên Ngôn 2, Tuyên Ngợ 2, Ký Sự 1. Hai phạm vi cho đa số khác nhau. Chọn Tuyên Ngôn vì Ngợ/Ngợi là chính tả không có nghĩa (lỗi gõ), chứ không phải vì đa số đo được; con số của tôi lệch con số 128 do điều phối nêu, xin biên tập phán một lượt cho cả cuốn.
  - 0.2 Kuṇḍadhānavagga dịch Phẩm Kuṇḍadhāna, đúng 5/5 tiền lệ của chính phẩm này. 16.1 `dutiyaṁ` dịch thứ hai (32 khoá thứ hai so với 10 khoá thứ nhì cho cùng công thức).

  Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti (15.1): dùng nhóm số nhiều đã nói những bài kệ này (443 khoá) thay vì đã từng nói bài kệ này (4 khoá), vì Pāli là số nhiều.

  Bất định đã ghi lại, không sửa trong kinh:
  - santhaviṁ (3.4): dịch ca ngợi. Ba khoá cùng Pāli ở các bài khác (tha-ap54, tha-ap318, tha-ap320) dịch tiến đến bậc Dẫn Dắt Thế Gian; theo Pāli santhaviṁ là aorist ngôi thứ nhất của santhavati (ca ngợi), và ngữ cảnh bài này (9.1–9.2 kittesi, Đức Phật xác nhận ông đã tán thán Ngài) khớp với ca ngợi. Đo: 25 khoá của bài có Pāli trùng khoá ở bài khác; 14 dùng lại nguyên văn tiền lệ, 11 khác (đa số khác chỉ vì ngôi, dấu câu hoặc vế phụ; riêng 3.4 là khác về nghĩa và có lý do ở đây). Cần người biên tập xác nhận và xét sửa ba khoá kia.
  - mahesi bahuke jane (5.2): mahesi hiểu là hô cách, bậc Đại Ẩn Sĩ, gọi Đức Phật (cùng nghĩa mahesī ở 8.2); bahuke jane hiểu là đối tượng của uddharitvāna (5.3) nên 5.3 dịch kéo họ ra khỏi nẻo lạc. Cách hiểu khác (bahuke jane làm trạng ngữ nơi chốn) vẫn có thể nhưng đổi nghĩa ít.
  - virūhare (4.2) là cầu khiến ngôi ba số nhiều, dịch như câu khái quát: bất kỳ loài cây nào đều sinh trưởng trên mặt đất. ruhanti (4.4) cùng gốc ruh nên dùng cùng một động từ sinh trưởng, giữ phép so sánh tathā.
  - tejodhātūsu kovido (13.2) dịch thiện xảo về các hỏa giới; không tra được tiền lệ trong tầng, và Pāli không nói rõ là thần thông hay thiền; không thêm giải thích vào kinh.
  - 8.1 pasannacittaṁ không có danh từ đi kèm; thêm tôi vì người kể là đối tượng duy nhất của cái thấy ở khoá 8.1–8.2 (tiền lệ tha-ap299:2.3 có maṁ).
  - 10.4 và 11.2 không có chủ ngữ trong Pāli; dịch vị ấy theo mạch lời thọ ký từ 9.1 (vị Bà-la-môn).
  - tādibhi (6.4) giữ bậc Như Vậy, theo cách thuật ngữ tādī đã dùng trong tầng (Như Vậy, Như Thật, Vững Vàng đều có tiền lệ).
  - Đại từ ngôi thứ nhất của phần tự thuật là tôi, giữ nhất quán trong bài; cùng Pāli viharāmi anāsavo ở tầng có ta 81 khoá, tôi 33 khoá, tức đa số chọn ta, nhưng nội bộ bài này dùng tôi xuyên suốt nên không đổi riêng một khoá.

  Số Pāli: Kappānaṁ satasahassaṁ (9.3) = sata 100 × sahassa 1000 = 100.000, dịch một trăm ngàn kiếp (cùng cấu tạo với 10 khoá dịch Trong suốt một trăm ngàn kiếp); Paṭisambhidā catasso (14.1) = bốn vô ngại giải; dutiyaṁ (16.1) = thứ hai.

  Dấu lược: 14.2 là …pe… trong Pāli, giữ đúng một …; không có (…) trần. Dấu nháy: mở “ ở 1.1 đóng ” ở 14.3 (chạy qua nhiều khoá); mở ‘ ở 9.1 đóng ’ ở 11.4; mỗi khoá khớp Pāli. Không có cặp Pāli trùng nguyên văn bên trong chính bài.

