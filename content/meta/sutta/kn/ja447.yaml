  **Một cặp trùng byte mà tôi CỐ Ý dịch khác: `1.2`.** `Kissa suciṇṇassa ayaṁ vipāko;` trùng byte
  `pv30:7.2`, mà bản đó dịch *vì nghiệp thiện nào mà có quả báo này* — thêm chữ **thiện** vào
  `suciṇṇassa` (= “đã gieo”), không có trong Pāli. Theo luật “Pāli là authority cuối cùng” tôi
  dịch *là của hạt giống nào mà có quả báo này;*. Đây là **cặp Pāli trùng đã dò mà Việt khác** duy
  nhất trong bài (1/8).

  **Điểm mấu chốt của cả bài: `miyyare` = “chết đói”.** Đây là lý do lớn nhất bài này không dễ, và
  tôi đã dồn về đó. `miyyare` xuất hiện **10** khoá của bài: `1.4` (`Kasmā nu tumhaṁ daharā na
  miyyare`) và **9** lần trong câu đệm `2.4`–`10.4` (đếm bằng script, không đếm tay). Đọc là “bỏ rơi /
  phỉ báng” sẽ **sai ngay câu đệm**: người nói dùng `amhaṁ` (chúng tôi) nên `miyyare` không thể là
  hành vi của họ. Ba bằng chứng đo được:
    · `ja510:2.2` `Narā na jīranti na cāpi miyyare` — cặp với `jīranti` (“già”), nên `miyyare`
      là **chết**, không phải hành động chủ động.
    · `cnd23:45.4` và `mnd15:19.4` `paccanti na ca miyyare` — cùng dạng bị động “không chết”.
    · `miyyati` với nghĩa **chết đói** là cách dùng cố định của Jātaka, và `pv30` (Kumārapetavatthu,
      cùng họ kệ với câu hỏi `Kissa vataṁ kiṁ pana brahmacariyaṁ` ở `pv30:7.1`) nói về ngạ quỷ
      đói. Câu hỏi `1.1`–`1.4` của bài này về cơ chế chỉ có một nghĩa khớp: người mẹ nghèo hỏi con
      giàu *“ngươi sống thế nào… tại sao các ngươi, người trẻ, không chết đói?”*
  Toàn Pāli ghim `miyyare` có **14** lần, đúng **5** tệp: `cnd23`, `ja447` (10), `ja510`, `mnd15`,
  `snp3.8`. Đọc sai chỗ này là lỗi loại 2 (sai nghĩa trọng yếu), nên tôi nêu phép đo ở đây thay vì
  tin bản.

