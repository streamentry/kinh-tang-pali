    · `0.1` `Jātaka` → ja100… (435 tệp dùng) ⇒ giữ `Jātaka`.
    · `0.2` `Dasakanipāta` → *Bộ Mười Bài Kệ* (**10** tệp khác: `ja439 442 445 446 448 449 450 451
      452 453`) ⇒ 11/11 tính cả bài này.
