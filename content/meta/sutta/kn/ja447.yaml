  **Năm phép kiếm tự chạy (mẫu số in ra, không tự kết luận).**
    1. `set(khoá Việt) == set(khoá Pāli)`: Pāli **53**, Việt **53**, thiếu 0, thừa 0.
    2. Nháy đơn `‘’` + ngoặc kép `“”` so **từng khoá**: mẫu số **53**, lệch **0**. Pāli có 3 mở
       (`1.1`, `2.1`, `11.1`) và 3 đóng (`1.4`, `10.4`, `12.4`); bản Việt y hệt. Cả ba nhịp lời
       nói là danh sách xuyên suốt, không đóng sớm ở `2.4`–`9.4`.
    3. Pāli trùng nguyên văn **trong chính bài**: mẫu số **8** khoá nằm trong cặp trùng, Việt khác
       **0**. Nhóm duy nhất là câu đệm `Tasmā hi amhaṁ daharā na miyyare. ` ở `2.4`–`9.4` (**8** khoá
       byte giống hệt nhau). `10.4` **không** vào nhóm vì Pāli kết `”. ` thay vì `. `, và `11.1`
       với `12.1` **không** giống nhau vì dấu `“` chỉ mở ở `11.1` — bản Việt tôi cũng vậy (`10.4`
       kết `”. `, `12.1` không mở nháy), tức là 8 khoá này **cố ý khác nhau ở đúng chỗ Pāli khác**.
    4. Dấu lược `…pe…` / `…` trần / `(…)`: mẫu số **53**, lệch **0**. Pāli của bài này có `…pe…`
       **0**, `…` trần **0**, `(…)` **0** ⇒ bản Việt không dấu lược nào là đúng, không phải sót.
    5. Vì mẫu số của mục 4 là 0, phép quét tự động theo ngưỡng 40 ký tự **chạy rỗng** cho bài này: tập `cần` (Pāli ≥ 40 ký
       tự, bỏ `:0`) = **0** khoá, nên nó không quét NFC, không quét `lọt_pāli`, không quét dấu lược.
       Tôi tự quét thêm: mẫu số **53**, lỗi **1** — `0.1` ghi `Jātaka` trùng nguyên văn Pāli. Đó
       **không phải lỗi**: đếm trên tầng `kn`, **435/1.845** khoá `0.1` giữ đúng `Jātaka`. NFC cả
       tệp: đúng; tệp kết thúc bằng newline.

  **Dùng lại nguyên văn bản dịch — 8 khoá Pāli trùng byte với bài khác trong tầng `kn`, dùng lại
