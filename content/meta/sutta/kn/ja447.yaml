  thế là năm phép kiếm ở trên (mẫu số đều in ra) cộng `save_vi` chạy qua `_hvi.py` không báo lỗi.
  Bốn lệnh còn lại, để người điều phối chạy trước khi coi điểm 10 là đạt:
  `npm run validate` · `npm test` · `npm run check` · `npm run build`.