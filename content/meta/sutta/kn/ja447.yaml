      dùng lại nguyên văn. Lưu ý `12.1` là `Dhammo have rakkhati dhammacāriṁ, ` **không** có `“`
      nên **không** trùng byte với `11.1`; tôi vẫn dịch hai khoá giống nhau trừ dấu mở nháy, đúng
      như Pāli.
    · `11.2` `Dhammo suciṇṇo sukhamāvahāti;` trùng byte `snp1.10:7.2` ⇒ dùng lại nguyên văn.
    · `11.3` `Esānisaṁso dhamme suciṇṇe, ` trùng byte `thag4.10:1.3` ⇒ dùng lại nguyên văn.
    · `11.4` `Na duggatiṁ gacchati dhammacārī. ` trùng byte `thag4.10:1.4` ⇒ dùng lại nguyên văn,
      **kể cả dấu cách cuối** (bản gốc không có).
    Cả bốn câu này còn xuất hiện ở `ne4:15.1–15.4`, `ne9:3.1–3.4`, `ne10:16`, `pe2:59.1–59.4` —
    những bài đó chưa có bản Việt trong tầng này, nên `ja447` là bản Việt đầu tiên của cụm đó.

  **Một cặp trùng byte mà tôi CỐ Ý dịch khác: `1.2`.** `Kissa suciṇṇassa ayaṁ vipāko;` trùng byte
  `pv30:7.2`, mà bản đó dịch *vì nghiệp thiện nào mà có quả báo này* — thêm chữ **thiện** vào
  `suciṇṇassa` (= “đã gieo”), không có trong Pāli. Theo luật “Pāli là authority cuối cùng” tôi
  dịch *là của hạt giống nào mà có quả báo này;*. Đây là **cặp Pāli trùng đã dò mà Việt khác** duy
  nhất trong bài (1/8).

  **Điểm mấu chốt của cả bài: `miyyare` = “chết đói”.** Đây là lý do lớn nhất bài này không dễ, và
  tôi đã dồn về đó. `miyyare` xuất hiện **10** khoá của bài: `1.4` (`Kasmā nu tumhaṁ daharā na
  miyyare`) và **9** lần trong câu đệm `2.4`–`10.4` (đếm bằng script, không đếm tay). Đọc là “bỏ rơi /
  phỉ báng” sẽ **sai ngay câu đệm**: người nói dùng `amhaṁ` (chúng tôi) nên `miyyare` không thể là
  hành vi của họ. Ba bằng chứng đo được:
    · `ja510:2.2` `Narā na jīranti na cāpi miyyare` — cặp với `jīranti` (“già”), nên `miyyare`
      là **chết**, không phải hành động chủ động.
    · `cnd23:45.4` và `mnd15:19.4` `paccanti na ca miyyare` — cùng dạng bị động “không chết”.
    · `miyyati` với nghĩa **chết đói** là cách dùng cố định của Jātaka, và `pv30` (Kumārapetavatthu,
      cùng họ kệ với câu hỏi `Kissa vataṁ kiṁ pana brahmacariyaṁ` ở `pv30:7.1`) nói về ngạ quỷ
      đói. Câu hỏi `1.1`–`1.4` của bài này về cơ chế chỉ có một nghĩa khớp: người mẹ nghèo hỏi con
      giàu *“ngươi sống thế nào… tại sao các ngươi, người trẻ, không chết đói?”*
  Toàn Pāli ghim `miyyare` có **14** lần, đúng **5** tệp: `cnd23`, `ja447` (10), `ja510`, `mnd15`,
  `snp3.8`. Đọc sai chỗ này là lỗi loại 2 (sai nghĩa trọng yếu), nên tôi nêu phép đo ở đây thay vì
  tin bản.

  **Cố ý khác tiền lệ: `9.3` và `10.3`.** `paralokahetu` tôi dịch *vì đời sau* (đếm `kn` lúc ghi:
  *đời sau* **70**, *thế giới bên kia* **1**, *thế giới kia* **3**), theo đa số đo được.

  **Bất định — ghi ở đây, không thêm giải thích vào thân kinh.**
    (1) **`5.1` `Samaṇe mayaṁ brāhmaṇe addhike ca`** — chỗ khó nhất. Cùng một câu ngũ trường đoại
        trong cùng phẩm, `ja444:6.1` viết `“Samaṇe tuvaṁ brāhmaṇe addhike ca, ` (tức **tu**vaṁ =
        “ngươi”), còn bản ghim ở đây là `ma**yaṁ**`. Câu kế `5.3` là `Annena pānena abhitappayāma`
        (chúng tôi 1 số nhiều, tân ngữ “ngươi”) nên người nghe **bắt buộc** là ngôi thứ hai; đọc
        `mayaṁ` là “của tôi” sẽ vỡ cú pháp. Tôi dịch **Ngươi** và ghi lại biến thể ở đây. Tôi không
        sửa Pāli ghim — nếu người biên tập cho rằng đây là lỗi chép, `5.1` phải dịch lại theo
        `tuvaṁ`, nhưng nghĩa câu không đổi.
    (2) **`4.1` `Pubbeva dānā sumanā bhavāma`** — `dānā` là cách ngữ của `dāna` (bố thí), nên tôi
        dịch *Trước đây, về phần bố thí, chúng tôi vui vẻ,*. Cách đọc còn lại là `dānā` là danh từ
        số nhiều chủ ngữ đi với `sumanā`; khác ở chỗ câu có động từ hậu tố `bhavāma` hay không.
        Tôi chọn cách có `bhavāma` cho cả hai vế của khổ 4 (`4.1` và `4.2` đều có `…ā bhavāma`).
    (3) **`8.1` `Etāsu ve jāyare suttamāsu`** — `jāyare` đã đo được là **“nơi sinh”** (an3.57:14.2,
        an5.179:22.2, sn1.49:4.4 — cả ba đều ghép với `kule` và đều được dịch là “sinh ở gia tộc”),
        không phải tên địa danh. Nhưng `suttamāsu` (số nhiều “trong các bài kinh”) làm câu khó
        đóng; tôi dịch *Ở những nơi sinh ấy, trong các bài kinh,* và **không** tự thêm mối quan hệ
        nhân quả (kiểu “nên cha mẹ phải cho con học”) vì Pāli không nói.
    (4) **`12.3`–`12.4`** — `Dhammena gutto mama dhammapālo, / Aññassa aṭṭhīni sukhī kumāro`. Vế
        `sukhī` là danh từ chủ ngữ nữ (`sukhī` 6 ký tự) còn `kumāro` là danh từ số ít nam, nên hai
        vế không cùng chủ ngữ; `aṭṭhīni` là cách ngữ của `aṭṭhī` (chỗ đứng / nền tảng). Tôi dịch
        *Người bảo vệ pháp của tôi, được Pháp che chở, / giữa những người khác, người trẻ cũng được
        an ổn* — giữ `kumāro` trung tính, **không** thêm “con trai của tôi”. Đây là lý do
        `grammar_logic` và `vietnamese_clarity` bị tôi hạ xuống 8.8.
    (5) **`6.1` `Mayañca bhariyaṁ`** — `Mayañca` là “cả tôi nữa”, đứng cạnh `amhaṁ` (chúng tôi) ở
        câu trước nên tiếng Việt thành *Chúng tôi không phỉ báng cả tôi, cả người vợ nữa*, hơi cộc.
        Tôi giữ cả hai tân ngữ vì bỏ `Mayañca` là mất một semantic unit.
    (6) `3.3` `Hitvā asante na jahāma sante` — đọc `asante`/`sante` là **bất thiện / thiện** nhất
        quán với `3.1` `dhammaṁ asataṁ satañca`; `jahāma` dịch *bỏ rơi* (đếm `kn` lúc ghi: *bỏ rơi*
        **12**, *bỏ mặc* **3**).
    (7) `7.3` `Amajjapā nopi musā bhaṇāma` — `amajjapā` dịch **không say sưa**; tiền lệ tầng có
        hai cách (`vv31:5.3` *không uống chất say*, `vv12:5.1` *không hành xử thô kệ*), tôi theo
        cách đầu vì nó giữ nghĩa “không say”.
    (8) `5.3` `abhitappayāma` — hapax toàn Pāli ghim (1 chỗ, đếm bằng `grep` toàn tầng). Tôi dịch
        *chúng tôi đã đến gặp ngươi với thức ăn uống,* theo nghĩa “tiếp cận” của `tappayati`.

  **Thuật ngữ đã đo, không đoán.** Đếm trên tầng `kn` **lúc ghi bài này: 1.871 tệp / 49.629 khoá** (tầng
  đang lớn dần, nên các số này sẽ tăng — đây là ảnh chụp lúc đo). `brāhmaṇa`/`brāhmaṇe` → *Bà-la-môn*
  (**497** chỗ) · `samaṇa` → *Sa-môn* (**63**) · `pāṇātipātā` → *sát sinh* và `adinnaṁ` → *lấy của
  không cho* (cả hai theo đúng cặp ở `iti74:3.7` *không tránh sát sinh, không tránh lấy của không cho*) ·
  `parivajj` → *tránh xa* (`iti78:7.3`, `snp1.3:23.1`) · `atikkamma` → *phỉ báng* (`ja446:2.2` *vượt
  phận*) · `dāna` → *bố thí* (**178** chỗ) · `suciṇṇa` → *khéo hành trì* (`thag4.10`, `snp1.10`) ·
  `dhammacārī` → *người thực hành Chánh pháp* (`thag4.10:1.4`) · `duggati` → *đọa xứ* (**221** chỗ) ·
  `vedaguṇa` → *quản trí biết rõ cảm giác* · `chattaṁ mahantaṁ` → *tán cây lớn* (cùng ẩn dụ ở
  `ne4:15.2`, `ne9:3.2`, `ne10:16.2`, `pe2:59.2`, `pe2:189.3` *Vassakāle yathā chattaṁ*; **0** tiền lệ
  Việt trong tầng, tôi dịch theo nghĩa “tán cây che chở”) · `paraloka` → *đời sau* (**70**, so với
  *thế giới bên kia* **1** và *thế giới kia* **3**) · `jahāma` → *bỏ rơi* (**12**, so với *bỏ mặc*
  **3**) · `anujīvino` → *nương nhờ chúng tôi* (không có tiền lệ, dịch theo nghĩa `anujīvika`).

  **Tên bài — điểm duy nhất tôi phải tự đặt, và nó chưa có tiền lệ.** `Mahādhammapālajātaka` không
  xuất hiện ở bài nào khác trong tầng, nên **0 tiền lệ**. Tôi đặt *Kinh Bảo Vệ Pháp Lớn* theo khuôn
  đã thành hệ ở dòng `0.4`: trong tầng `kn` có **417/451** tệp `ja` viết `0.4` theo mẫu
  `<số>. Kinh <tên>` (`Kinh Takkala`, `Kinh Kukkuṭa`, `Kinh Nigrodha`, `Kinh Con Muỗi`…). `dhammapāla` chỉ có một tiền lệ
  gián tiếp là `an5.42:3.2` `Taṁ devatā rakkhati dhammaguttaṁ` → *được pháp bảo vệ*, nên `12.3`
  tôi dịch *được Pháp che chở*. Nếu người điều phối chốt tên khác thì chỉ `0.4` và `13.1` đổi.

  **Số Pāli tôi dịch, kèm phép tính.** Bài này là bài kệ, **không có số lượng nào** (không có
  `Ekanavutito` hay số từ đếm được kiểu `Catunnavutito`), nên không có phép tính nào để in ra. Số
  duy nhất: `0.4` = `9.` và `13.1` `navamaṁ`; phép tính `8 + 1 = 9` (`nava` là chín), đối chiếu ba
  bài cùng phẩm đã dịch: `ja445` `sattamaṁ` → *thứ bảy* (7), `ja446` `aṭṭhamaṁ` → *thứ tám* (8),
  `ja448` `dasamaṁ` → *thứ mười* (10).

