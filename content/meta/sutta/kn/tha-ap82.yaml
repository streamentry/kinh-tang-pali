notes: |-
  Bản dịch chỉ từ Pāli root, 120/120 khoá, đúng thứ tự Pāli. Không có tầng English hay Việt tham khảo nào cho bài này, nên bài giữ draft vì blocker tầng tham khảo, không vì chất lượng câu chữ.

  DÙNG LẠI NGUYÊN VĂN. Trong tầng tha-ap đã dịch có 30 khoá Pāli (không tính khối :0) trùng nguyên văn với khoá của bài này; 27 khoá dùng lại đúng một cách dịch đã có, 3 khoá khác (xem dưới). Công thức giữ nguyên: `Bốn vô ngại giải,` (510 trên 515 khoá), `…pe…` thành đúng một `…` (707 trên 707), `đã làm tròn lời dạy của Đức Phật”.` (479 trên 513), `Đức Chiến Thắng tên Padumuttara,` (14 trên 15), `bậc đã vượt qua mọi pháp;` (10 trên 12), `Đức Padumuttara, bậc hiểu rõ thế giới,` (20 trên 21), `bậc tiếp nhận lễ vật hiến cúng;` (25 trên 27), `đã nói những bài kệ này.` (32 trên 32), `Ta sẽ tuyên thuyết về người ấy,` (15 trên 21), `đếm không hết, vô tận.` (15 trên 15), `mọi cõi hữu đều đã được nhổ sạch;` (25 trên 31), `nay không còn tái sinh nữa.` (8 trên 9), `Tóm tắt phẩm này:` (37 trên 48). Số nhiều ở dòng kết `Itthaṁ sudaṁ … abhāsitthāti`: `đã nói những bài kệ này` theo nhóm 407 khoá, không dùng nhóm số ít 21 khoá. Trong chính bài này không có cặp khoá Pāli trùng nguyên văn nào, nên phép dò nội bộ chạy rỗng (0 cặp), không phải 0 lỗi.

  CHỖ KHÁC TIỀN LỆ VÀ LÝ DO.
  (1) `:12.1` `Tiṁsakappasahassāni` — 5 khoá trong tầng viết `Trong ba mươi nghìn kiếp,`; ở đây viết `ngàn` vì cả bài và cả tầng dùng `ngàn` (225 so với 61 `nghìn`), và `ba mươi ngàn kiếp` 18 khoá so với `ba mươi nghìn kiếp` 6. Cùng một con số 30.000, chỉ khác chữ viết.
  (2) `:25.2` `yaṁ buddhamabhipūjayiṁ;` — tầng viết `khi ta cúng dường lên Đức Phật;` (5 khoá) với ngôi `ta`; ở đây ngôi `tôi` theo cả bài.
  (3) `:7.4` chỉ có 1 tiền lệ (`cọng hướng lên trên hoa hướng xuống dưới.`, kết bằng dấu chấm); ở đây `cuống hướng lên, miệng hoa hướng xuống.`, vì `vaṇṭa` là cuống hoa và `mukha` là mặt hoa.
  Ngoài ra, các khoá có tiền lệ nhưng chọn theo đa số hoặc theo bản đối chiếu: `:20.3` `Padesarajjaṁ vipulaṁ,` có 27 khoá, trong đó `Vương quyền cai quản các vùng đất rộng lớn,` 10 khoá và `Vương quốc rộng lớn ấy,` 15 khoá; chọn hình đầu vì giữ được `padesa` (vùng đất) mà hình sau làm mất, và không thêm `ấy`. `:26.1` `Kilesā jhāpitā mayhaṁ,` có 157 khoá: `của ta đã được thiêu rụi` 111, `Mọi … của tôi đã bị thiêu rụi` 24, `Các … của tôi đã bị thiêu rụi` 17; giữ `Các` (không thêm `Mọi`) vì Pāli không có `sabbe`, ngôi `tôi` theo cả bài. `:25.1` `Satasahassito kappe,` 46 khoá: `đại kiếp` 26, `kiếp` 20; theo `đại kiếp` như đa số.

  ĐO TIỀN LỆ, KHÔNG PHẢI ĐOÁN.
  `:0.1` `Therāpadāna` giữ Pāli, như tha-ap81 và 342. `:0.2` `Nāgasamālavagga` thành `Phẩm Nāgasamāla`, như tha-ap81. `:0.3` Pāli bắt đầu bằng số (`10 Tipadumiya…`) nên giữ số thứ tự theo hình thức `10. ` (chính sách KEEP khi và chỉ khi Pāli có số); `translationTitle` bằng đúng giá trị `:0.3`. Phần tên: tha-ap79·80·81 trong cùng phẩm đều `Ký Sự Về Trưởng Lão …` (3 trên 3), tha-ap73·74·75·76·77·78 dùng `Bài Kệ Tuyên Ngợ/Ngôn Về …`; phạm vi gần nhất tha-ap60–110 cho `Tuyên Ngợ` 20 · `Tuyên Ngợi` 3 · `Tuyên Ngôn` 6 · `Ký Sự` 11 (chưa tính các biến thể có số thứ tự đứng trước). Theo 3 bài liền kề cùng phẩm (`Ký Sự`) và không dùng hình `Tuyên Ngợ` (viết sai chính tả, không có gốc nghĩa). Hai phạm vi cho hai đa số khác nhau; người biên tập nên phán một lượt cho cả cuốn. Phần tên riêng: `Tipadumiya` = `ti` (ba) + `padumiya` (liên quan hoa sen), dịch nghĩa thành `Cúng Dường Ba Hoa Sen` theo tha-ap316 (`Sattapadumiya` = `Cúng Dường Bảy Hoa Sen`); ở `:28.1` và `:29.1` giữ `Tipadumiya` như tha-ap81 giữ `Ṭhitañjaliya`.
  `:30.1` `aṭṭhamo` = thứ tám; `Phẩm … là phẩm thứ …` 28 khoá so với `, thứ …` 11 và `là thứ …` 10 trong tầng, nên theo `là phẩm thứ`. `:31.1` `Tassuddānaṁ` thành `Tóm tắt phẩm này:` (37 trên 48). `:32` bộ uddāna giữ tên Pāli như tha-ap322, 563, 482; `gāthāyo pañcasattati` = `số bài kệ là bảy mươi lăm` như tha-ap563 (`số bài kệ là chín mươi lăm`).
  `chúng sinh` 24 khoá so với `chúng sanh` 10 trong tầng tha-ap, nên theo `chúng sinh`.

  SỐ PĀLI, PHÉP TÍNH. `Tiṁsakappasahassāni` (12.1) = `tiṁsa` 30 + `kappa` + `sahassa` 1000 → 30 × 1000 = 30.000 kiếp, tức `ba mươi ngàn kiếp`; `tiṁsa` là hình sandhi của `tiṁsati` = 30, không phải 3 (ở 12.3 `Tiṁsakappāni devindo` là ba mươi kiếp; nếu `tiṁsa` là 3 thì hai dòng liền nhau lệch nhau một bậc không có lý do). Đây là chỗ khác với ghi chú đo cũ nghi `ba nghìn kiếp`; chốt `ba mươi ngàn` theo cấu tạo từ và nhiều tiền lệ cùng dạng (tầng có 18 khoá `ba mươi ngàn kiếp` so với 4 khoá `ba nghìn kiếp`); ghi bất định cho người biên tập ở mục dưới. `Tiṁsakappāni` (12.3) = 30 kiếp. `Tiyojanasatubbiddhaṁ` (13.3) = `ti` 3 × `yojana` × `sata` 100 → ba trăm do-tuần (hình `dviyojanasatika` = hai trăm do-tuần, `tiyojanasatika` = ba trăm do-tuần có trong Pāli của tầng). `Diyaḍḍhasatavitthataṁ` (13.4) = `diyaḍḍha` 1,5 × `sata` 100 = 150 → một trăm năm mươi (do-tuần; đơn vị lược ở Pāli, bổ sung từ 13.3; `ps2.6:78.1` `diyaḍḍhasataṁ dhammā` xác lập `diyaḍḍhasata` = 150). `Cattārisatasahassāni` (14.1) = 4 × 100 × 1000 = 400.000 → bốn trăm ngàn. `Koṭisatasahassiyo` (15.1) = `koṭi` × `sata` × `sahassa`; dịch `một trăm ngàn koṭi`, giữ `koṭi` nguyên Pāli như tầng (`Kappakoṭimpi`, `Asītikoṭiyo` giữ `koṭi`), không quy đổi thành 10^12. `Satapāṇasahassānaṁ` (24.3) = `sata` 100 × `sahassa` 1000 chúng sinh → một trăm ngàn. `Pañcasattatikkhattuñca` (20.1) = `pañca` 5 + `sattati` 70 = 75 → bảy mươi lăm lần (cùng cấu tạo tha-ap342:9.3, 5 khoá trong tầng). `Satasahassito kappe` (25.1) = 100.000 kiếp. `Sampattiyo duve` (21.1) = hai. `Tipadumāni` / `tīṇi` = ba. `Aṭṭhamo` = tám; `dasamaṁ` = mười; `pañcasattati` = 75. Không có chứng cứ độc lập trong tầng cho tổng uddāna 75, nên giữ đúng một con số.

  BẤT ĐỊNH (ghi ở đây, không đưa vào thân kinh).
  (a) `:12.1` `Tiṁsakappasahassāni` = 30.000 kiếp hay 3.000 kiếp: dịch theo `tiṁsa` = 30; tầng Anh đã ghim không có bản nào cho dạng này, và 4 khoá Việt cũ của tầng viết `ba nghìn kiếp`. Nên người biên tập xem lại 4 khoá cũ ngoài lát này.
  (b) `:18.1`–`:18.4` `pattena pattasañchanne antobyamhavare imaṁ; attharitvā pārupitvā, tuvaṭṭissanti tāvade` — Pāli khó: `imaṁ` là tân ngữ của `attharitvā pārupitvā` (trải ra, đắp lên), chủ ngữ số nhiều của `tuvaṭṭissanti` không nêu. Dịch `họ trải thứ này ra rồi đắp lên` (đưa `imaṁ` sang 18.3 cho tiếng Việt liền mạch; 18.2 mất chữ `này` đó), không đoán `thứ này` là gì. 0 tiền lệ.
  (c) `:23.1`–`:23.4` `Ajja me dhammappattassa, vippamuttassa sabbaso; supupphitaṁ lohitakaṁ, dhārayissati matthake` — `lohitakaṁ` là tân ngữ (đóa sen đỏ), `dhārayissati` ngôi thứ ba số ít, `me` ở 23.1 là sở hữu/giới từ; không nêu ai mang và đầu của ai. Dịch `Đóa sen đỏ nở rộ tuyệt đẹp sẽ mang trên đầu`, giữ nguyên độ mở của Pāli. Nếu đọc `me` chi phối cả khổ kệ thì đó là đầu của chính vị ấy; nếu đọc theo 7.3 (`dhāriṁsu matthake tattha`) thì đó là đầu của Đức Phật.
  (d) `:3.2` `paṭimaggantarāpaṇe` — `paṭimagga` (đường đối diện/đường ngược chiều) cộng `antarāpaṇe` (giữa phố chợ; tầng có `gacchantaṁ antarāpaṇe` 7 khoá, dịch `giữa phố chợ`). Dịch `trên con đường đối diện, giữa phố chợ`; 0 tiền lệ cho `paṭimagga`.
  (e) `:22.4` `tisampadā` — ba thành tựu; Pāli không nêu ba gì (sau `duve sampattiyo` ở 21.1). Giữ đúng `ba thành tựu`, không thêm.
  (f) `:7.3` `matthake` không nêu chủ sở hữu; dịch `trên đầu`, không thêm `Ngài`, vì ở 23.4 cũng để ngỏ. `uddhaṁvaṇṭā adhomukhā` — `cuống hướng lên, miệng hoa hướng xuống`.
  (g) `:13.1` `Mahāvitthārikaṁ` — tên cung điện (nghĩa: rất rộng lớn), giữ Pāli, không dịch nghĩa, vì tầng có hai chiều (`Sen Trăm Cánh` dịch nghĩa, `Punnāga…` giữ Pāli) và không có tiền lệ cho tên này.
  (h) `:14.2` `niyyūhā ca sumāpitā` — `ca` không dịch ra chữ; `niyyūha` là `tháp lầu` (tầng: 2 khoá `tháp lầu`, 1 khoá `ban công`).
  (i) `:15.3`–`:15.4` `padakkhiṇā` — dịch `thành thạo`; chỉ có 1 tiền lệ khác nghĩa (`padakkhiṇāvaṭṭā` = hữu nhiễu) nên coi là dịch theo ngữ cảnh.
  (j) `:21.2` `anīti anupaddavo` — `anīti` = không tai ương; `anupaddava` = không hoạn nạn; 0 tiền lệ.
  (k) `:4.2` `rañño upanitehi me` — `me` dịch gộp vào 4.1 (`có ích gì cho tôi`), `upanitehi` thành `đem dâng lên`; `4.4` `labheyyahaṁ` là cách nói khả năng, dịch `tôi may ra được`.
  (l) `:1.3` `Danto dantaparivuto` — `Bậc đã được điều phục, được những vị đã điều phục vây quanh`, chỉ Đức Phật và chúng Tỳ-kheo A-la-hán đi theo; không nêu `Tỳ-kheo` vì Pāli không nêu.
  (m) `:24.1`–`:24.2` `Mama kammaṁ kathentassa, padumuttarasatthuno` — đọc là sở hữu cách tuyệt đối (khi bậc Đạo Sư Padumuttara đang kể về nghiệp của tôi); không có tiền lệ nguyên cụm.

  KIỂM TRA ĐÃ LÀM, kèm mẫu số. Tập khoá Việt bằng tập khoá Pāli, 120 trên 120, đúng thứ tự. Nháy `“”‘’` và `(…)` khớp Pāli từng khoá, 120 khoá, 0 lệch (Pāli có `“` ở 1.1, `‘` ở 3.1 và 11.1, `’` ở 5.4 và 21.4, `”` ở 27.3; không có khoá nào tự cân vì ngoặc chạy qua nhiều khoá). Dấu lược: Pāli có `…pe…` ở 27.2, Việt đúng một `…` ở đó, 0 chỗ khác; Pāli không có `…` trần và không có `(…)`. Số Pāli: mọi số được tính tay ở mục trên. NFC, khoảng trắng thừa, khoá rỗng: 0 lỗi; không có Pāli lọt sang Việt ngoài tên riêng, `Therāpadāna` và `koṭi`. Đã in 120 cặp Pāli và Việt ra đọc lại.

  Coverage English: mẫu số 1 khoá (colophon `28.1`), Sujato phủ 0/1; ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng cho uid này. Phép đo này gần như không đo được gì ở thân kệ, vì 116 trên 117 khoá không phải khối `:0` dưới 40 ký tự.

