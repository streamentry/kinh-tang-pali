notes: |-
  Bản dịch chỉ từ Pāli root, 120/120 khoá, đúng thứ tự Pāli. Không có tầng English hay Việt tham khảo nào cho bài này, nên bài giữ draft vì blocker tầng tham khảo, không vì chất lượng câu chữ.

  DÙNG LẠI NGUYÊN VĂN. Trong tầng tha-ap đã dịch có 30 khoá Pāli (không tính khối :0) trùng nguyên văn với khoá của bài này; 27 khoá dùng lại đúng một cách dịch đã có, 3 khoá khác (xem dưới). Công thức giữ nguyên: `Bốn vô ngại giải,` (510 trên 515 khoá), `…pe…` thành đúng một `…` (707 trên 707), `đã làm tròn lời dạy của Đức Phật”.` (479 trên 513), `Đức Chiến Thắng tên Padumuttara,` (14 trên 15), `bậc đã vượt qua mọi pháp;` (10 trên 12), `Đức Padumuttara, bậc hiểu rõ thế giới,` (20 trên 21), `bậc tiếp nhận lễ vật hiến cúng;` (25 trên 27), `đã nói những bài kệ này.` (32 trên 32), `Ta sẽ tuyên thuyết về người ấy,` (15 trên 21), `đếm không hết, vô tận.` (15 trên 15), `mọi cõi hữu đều đã được nhổ sạch;` (25 trên 31), `nay không còn tái sinh nữa.` (8 trên 9), `Tóm tắt phẩm này:` (37 trên 48). Số nhiều ở dòng kết `Itthaṁ sudaṁ … abhāsitthāti`: `đã nói những bài kệ này` theo nhóm 407 khoá, không dùng nhóm số ít 21 khoá. Trong chính bài này không có cặp khoá Pāli trùng nguyên văn nào, nên phép dò nội bộ chạy rỗng (0 cặp), không phải 0 lỗi.

  CHỖ KHÁC TIỀN LỆ VÀ LÝ DO.
  (1) `:12.1` `Tiṁsakappasahassāni` — 5 khoá trong tầng viết `Trong ba mươi nghìn kiếp,`; ở đây viết `ngàn` vì cả bài và cả tầng dùng `ngàn` (225 so với 61 `nghìn`), và `ba mươi ngàn kiếp` 18 khoá so với `ba mươi nghìn kiếp` 6. Cùng một con số 30.000, chỉ khác chữ viết.
  (2) `:25.2` `yaṁ buddhamabhipūjayiṁ;` — tầng viết `khi ta cúng dường lên Đức Phật;` (5 khoá) với ngôi `ta`; ở đây ngôi `tôi` theo cả bài.
  (3) `:7.4` chỉ có 1 tiền lệ (`cọng hướng lên trên hoa hướng xuống dưới.`, kết bằng dấu chấm); ở đây `cuống hướng lên, miệng hoa hướng xuống.`, vì `vaṇṭa` là cuống hoa và `mukha` là mặt hoa.
  Ngoài ra, các khoá có tiền lệ nhưng chọn theo đa số hoặc theo bản đối chiếu: `:20.3` `Padesarajjaṁ vipulaṁ,` có 27 khoá, trong đó `Vương quyền cai quản các vùng đất rộng lớn,` 10 khoá và `Vương quốc rộng lớn ấy,` 15 khoá; chọn hình đầu vì giữ được `padesa` (vùng đất) mà hình sau làm mất, và không thêm `ấy`. `:26.1` `Kilesā jhāpitā mayhaṁ,` có 157 khoá: `của ta đã được thiêu rụi` 111, `Mọi … của tôi đã bị thiêu rụi` 24, `Các … của tôi đã bị thiêu rụi` 17; giữ `Các` (không thêm `Mọi`) vì Pāli không có `sabbe`, ngôi `tôi` theo cả bài. `:25.1` `Satasahassito kappe,` 46 khoá: `đại kiếp` 26, `kiếp` 20; theo `đại kiếp` như đa số.

  ĐO TIỀN LỆ, KHÔNG PHẢI ĐOÁN.
  `:0.1` `Therāpadāna` giữ Pāli, như tha-ap81 và 342. `:0.2` `Nāgasamālavagga` thành `Phẩm Nāgasamāla`, như tha-ap81. `:0.3` Pāli bắt đầu bằng số (`10 Tipadumiya…`) nên giữ số thứ tự theo hình thức `10. ` (chính sách KEEP khi và chỉ khi Pāli có số); `translationTitle` bằng đúng giá trị `:0.3`. Phần tên: tha-ap79·80·81 trong cùng phẩm đều `Ký Sự Về Trưởng Lão …` (3 trên 3), tha-ap73·74·75·76·77·78 dùng `Bài Kệ Tuyên Ngợ/Ngôn Về …`; phạm vi gần nhất tha-ap60–110 cho `Tuyên Ngợ` 20 · `Tuyên Ngợi` 3 · `Tuyên Ngôn` 6 · `Ký Sự` 11 (chưa tính các biến thể có số thứ tự đứng trước). Theo 3 bài liền kề cùng phẩm (`Ký Sự`) và không dùng hình `Tuyên Ngợ` (viết sai chính tả, không có gốc nghĩa). Hai phạm vi cho hai đa số khác nhau; người biên tập nên phán một lượt cho cả cuốn. Phần tên riêng: `Tipadumiya` = `ti` (ba) + `padumiya` (liên quan hoa sen), dịch nghĩa thành `Cúng Dường Ba Hoa Sen` theo tha-ap316 (`Sattapadumiya` = `Cúng Dường Bảy Hoa Sen`); ở `:28.1` và `:29.1` giữ `Tipadumiya` như tha-ap81 giữ `Ṭhitañjaliya`.
  `:30.1` `aṭṭhamo` = thứ tám; `Phẩm … là phẩm thứ …` 28 khoá so với `, thứ …` 11 và `là thứ …` 10 trong tầng, nên theo `là phẩm thứ`. `:31.1` `Tassuddānaṁ` thành `Tóm tắt phẩm này:` (37 trên 48). `:32` bộ uddāna giữ tên Pāli như tha-ap322, 563, 482; `gāthāyo pañcasattati` = `số bài kệ là bảy mươi lăm` như tha-ap563 (`số bài kệ là chín mươi lăm`).
  `chúng sinh` 24 khoá so với `chúng sanh` 10 trong tầng tha-ap, nên theo `chúng sinh`.

  SỐ PĀLI, PHÉP TÍNH. `Tiṁsakappasahassāni` (12.1) = `tiṁsa` 30 + `kappa` + `sahassa` 1000 → 30 × 1000 = 30.000 kiếp, tức `ba mươi ngàn kiếp`; `tiṁsa` là hình sandhi của `tiṁsati` = 30, không phải 3 (ở 12.3 `Tiṁsakappāni devindo` là ba mươi kiếp; nếu `tiṁsa` là 3 thì hai dòng liền nhau lệch nhau một bậc không có lý do). Đây là chỗ khác với ghi chú đo cũ nghi `ba nghìn kiếp`; chốt `ba mươi ngàn` theo cấu tạo từ và nhiều tiền lệ cùng dạng (tầng có 18 khoá `ba mươi ngàn kiếp` so với 4 khoá `ba nghìn kiếp`); ghi bất định cho người biên tập ở mục dưới. `Tiṁsakappāni` (12.3) = 30 kiếp. `Tiyojanasatubbiddhaṁ` (13.3) = `ti` 3 × `yojana` × `sata` 100 → ba trăm do-tuần (hình `dviyojanasatika` = hai trăm do-tuần, `tiyojanasatika` = ba trăm do-tuần có trong Pāli của tầng). `Diyaḍḍhasatavitthataṁ` (13.4) = `diyaḍḍha` 1,5 × `sata` 100 = 150 → một trăm năm mươi (do-tuần; đơn vị lược ở Pāli, bổ sung từ 13.3; `ps2.6:78.1` `diyaḍḍhasataṁ dhammā` xác lập `diyaḍḍhasata` = 150). `Cattārisatasahassāni` (14.1) = 4 × 100 × 1000 = 400.000 → bốn trăm ngàn. `Koṭisatasahassiyo` (15.1) = `koṭi` × `sata` × `sahassa`; dịch `một trăm ngàn koṭi`, giữ `koṭi` nguyên Pāli như tầng (`Kappakoṭimpi`, `Asītikoṭiyo` giữ `koṭi`), không quy đổi thành 10^12. `Satapāṇasahassānaṁ` (24.3) = `sata` 100 × `sahassa` 1000 chúng sinh → một trăm ngàn. `Pañcasattatikkhattuñca` (20.1) = `pañca` 5 + `sattati` 70 = 75 → bảy mươi lăm lần (cùng cấu tạo tha-ap342:9.3, 5 khoá trong tầng). `Satasahassito kappe` (25.1) = 100.000 kiếp. `Sampattiyo duve` (21.1) = hai. `Tipadumāni` / `tīṇi` = ba. `Aṭṭhamo` = tám; `dasamaṁ` = mười; `pañcasattati` = 75. Không có chứng cứ độc lập trong tầng cho tổng uddāna 75, nên giữ đúng một con số.

  BẤT ĐỊNH (ghi ở đây, không đưa vào thân kinh).
  (a) `:12.1` `Tiṁsakappasahassāni` = 30.000 kiếp hay 3.000 kiếp: dịch theo `tiṁsa` = 30; tầng Anh đã ghim không có bản nào cho dạng này, và 4 khoá Việt cũ của tầng viết `ba nghìn kiếp`. Nên người biên tập xem lại 4 khoá cũ ngoài lát này.
  (b) `:18.1`–`:18.4` `pattena pattasañchanne antobyamhavare imaṁ; attharitvā pārupitvā, tuvaṭṭissanti tāvade` — Pāli khó: `imaṁ` là tân ngữ của `attharitvā pārupitvā` (trải ra, đắp lên), chủ ngữ số nhiều của `tuvaṭṭissanti` không nêu. Dịch `họ trải thứ này ra rồi đắp lên` (đưa `imaṁ` sang 18.3 cho tiếng Việt liền mạch; 18.2 mất chữ `này` đó), không đoán `thứ này` là gì. 0 tiền lệ.
  (c) `:23.1`–`:23.4` `Ajja me dhammappattassa, vippamuttassa sabbaso; supupphitaṁ lohitakaṁ, dhārayissati matthake` — `lohitakaṁ` là tân ngữ (đóa sen đỏ), `dhārayissati` ngôi thứ ba số ít, `me` ở 23.1 là sở hữu/giới từ; không nêu ai mang và đầu của ai. Dịch `Đóa sen đỏ nở rộ tuyệt đẹp sẽ mang trên đầu`, giữ nguyên độ mở của Pāli. Nếu đọc `me` chi phối cả khổ kệ thì đó là đầu của chính vị ấy; nếu đọc theo 7.3 (`dhāriṁsu matthake tattha`) thì đó là đầu của Đức Phật.
  (d) `:3.2` `paṭimaggantarāpaṇe` — `paṭimagga` (đường đối diện/đường ngược chiều) cộng `antarāpaṇe` (giữa phố chợ; tầng có `gacchantaṁ antarāpaṇe` 7 khoá, dịch `giữa phố chợ`). Dịch `trên con đường đối diện, giữa phố chợ`; 0 tiền lệ cho `paṭimagga`.
  (e) `:22.4` `tisampadā` — ba thành tựu; Pāli không nêu ba gì (sau `duve sampattiyo` ở 21.1). Giữ đúng `ba thành tựu`, không thêm.
  (f) `:7.3` `matthake` không nêu chủ sở hữu; dịch `trên đầu`, không thêm `Ngài`, vì ở 23.4 cũng để ngỏ. `uddhaṁvaṇṭā adhomukhā` — `cuống hướng lên, miệng hoa hướng xuống`.
  (g) `:13.1` `Mahāvitthārikaṁ` — tên cung điện (nghĩa: rất rộng lớn), giữ Pāli, không dịch nghĩa, vì tầng có hai chiều (`Sen Trăm Cánh` dịch nghĩa, `Punnāga…` giữ Pāli) và không có tiền lệ cho tên này.
  (h) `:14.2` `niyyūhā ca sumāpitā` — `ca` không dịch ra chữ; `niyyūha` là `tháp lầu` (tầng: 2 khoá `tháp lầu`, 1 khoá `ban công`).
  (i) `:15.3`–`:15.4` `padakkhiṇā` — dịch `thành thạo`; chỉ có 1 tiền lệ khác nghĩa (`padakkhiṇāvaṭṭā` = hữu nhiễu) nên coi là dịch theo ngữ cảnh.
  (j) `:21.2` `anīti anupaddavo` — `anīti` = không tai ương; `anupaddava` = không hoạn nạn; 0 tiền lệ.
  (k) `:4.2` `rañño upanitehi me` — `me` dịch gộp vào 4.1 (`có ích gì cho tôi`), `upanitehi` thành `đem dâng lên`; `4.4` `labheyyahaṁ` là cách nói khả năng, dịch `tôi may ra được`.
  (l) `:1.3` `Danto dantaparivuto` — `Bậc đã được điều phục, được những vị đã điều phục vây quanh`, chỉ Đức Phật và chúng Tỳ-kheo A-la-hán đi theo; không nêu `Tỳ-kheo` vì Pāli không nêu.
  (m) `:24.1`–`:24.2` `Mama kammaṁ kathentassa, padumuttarasatthuno` — đọc là sở hữu cách tuyệt đối (khi bậc Đạo Sư Padumuttara đang kể về nghiệp của tôi); không có tiền lệ nguyên cụm.

  KIỂM TRA ĐÃ LÀM, kèm mẫu số. Tập khoá Việt bằng tập khoá Pāli, 120 trên 120, đúng thứ tự. Nháy `“”‘’` và `(…)` khớp Pāli từng khoá, 120 khoá, 0 lệch (Pāli có `“` ở 1.1, `‘` ở 3.1 và 11.1, `’` ở 5.4 và 21.4, `”` ở 27.3; không có khoá nào tự cân vì ngoặc chạy qua nhiều khoá). Dấu lược: Pāli có `…pe…` ở 27.2, Việt đúng một `…` ở đó, 0 chỗ khác; Pāli không có `…` trần và không có `(…)`. Số Pāli: mọi số được tính tay ở mục trên. NFC, khoảng trắng thừa, khoá rỗng: 0 lỗi; không có Pāli lọt sang Việt ngoài tên riêng, `Therāpadāna` và `koṭi`. Đã in 120 cặp Pāli và Việt ra đọc lại.

  Coverage English: mẫu số 1 khoá (colophon `28.1`), Sujato phủ 0/1; ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng cho uid này. Phép đo này gần như không đo được gì ở thân kệ, vì 116 trên 117 khoá không phải khối `:0` dưới 40 ký tự.

  technical_integrity đặt 9.6 vì chưa chạy các cổng kỹ thuật của kho; bốn lệnh còn lại cần chạy trước khi coi tiêu chí 10 là đạt: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  LƯỢT CẢI THIỆN 2026-10-13. Đọc đối kháng lại cả 120 cặp Pāli và Việt, đo tiền lệ trên 563 tệp `tha-ap` (đối chiếu từng khoá Pāli nguyên văn), rồi quét toàn bộ Pāli root (284.708 khoá) để tìm song song cho các cụm hiếm. Đổi 6 trên 120 khoá, không đổi tập khoá hay thứ tự.
  (1) `:22.1` `Sudiṭṭho vata me buddho` từ `Thật tốt đẹp thay, tôi đã được thấy Đức Phật,` thành `Quả thật, Đức Phật đã được tôi thấy rõ,`. Lý do (accuracy fix): `su-` + `diṭṭha` là `khéo thấy / thấy rõ`; bản cũ đổi thành lời khen `tốt đẹp` mà Pāli không nói, và đổi chủ ngữ ngữ pháp (Đức Phật là `buddho`, chủ thể thấy là `me`). Đối chiếu tầng: `sudiṭṭha` (57 khoá toàn tầng) đều dịch theo `khéo thấy / thấy rõ`, không có khoá nào dịch `tốt đẹp`. Điểm: semantic_fidelity 8.9 thành 9.0.
  (2) `:23.4` `dhārayissati matthake` từ `sẽ mang trên đầu.` thành `sẽ được nâng giữ ở trên đầu.` Lý do (accuracy/clarity fix): bản cũ để `Đóa sen đỏ ... sẽ mang trên đầu` khiến đóa sen thành chủ thể của `mang` mà không có tân ngữ, tức câu Việt vô nghĩa. Tiền lệ trong tầng cho đúng cụm `Matthake dhārayissati.` là `tha-ap397:21.4` `sẽ được nâng giữ ở trên đầu` (và `tha-ap393` `được giữ trên đầu tôi`); dùng lại cách đó. Không thêm chủ thể: ai mang và đầu của ai vẫn để ngỏ như Pāli. Điểm: grammar_logic 8.9 thành 9.0.
  (3) `:17.1` `Bhittikhīle nāgadante` từ `Trên cọc tường, trên ngà voi,` thành `Trên cọc tường, trên móc ngà voi,`. Lý do (terminology fix): Pāli root có đúng cụm này ở 3 nơi khác (`mnd2:3.6`, `mnd4:39.8`, `cnd16:26.4`: `bhittikhile vā nāgadante vā`, vật bị treo mắc vào đó) và cả 3 khoá đã dịch trong kho đều là `cái cọc trên tường hay ... cái móc ngà voi`. `nāgadanta` là cái móc/chốt có hình ngà voi, không phải chính ngà voi; bản cũ đọc thành hai vật thể khác loại. Tỉ lệ tiền lệ 3 trên 3. Điểm: terminology 9.0 thành 9.2.
  (4) `:11.4` `suṇātha mama bhāsato` từ `hãy nghe lời ta nói.` thành `hãy nghe lời Ta nói.` Lý do (style/terminology fix): người nói là Đức Phật Padumuttara; khoá liền trước (`:11.3`) đã viết `Ta`; tiền lệ cho đúng Pāli này là `Ta` 23 khoá so với `ta` 13 khoá và `tôi` 2 khoá. Sửa cho nhất quán trong khổ kệ.
  (5) `:9.4` `pupphānaṁ vāhasā mayaṁ` từ `nhờ những đóa hoa này.` thành `nhờ những đóa hoa.` Lý do (accuracy fix nhỏ): Pāli không có từ chỉ định `này`; bản cũ thêm nghĩa.
  (6) `:1.4` `nagarā nikkhamī tadā` từ `khi ấy đã rời thành đi ra.` thành `khi ấy đã rời khỏi thành.` Lý do (style fix): `rời thành` và `đi ra` lặp một nghĩa (`nikkhamī` đã gồm `ra khỏi`); tiền lệ cho `nagarā nikkhamiṁ tadā` là `khi ấy tôi đã rời khỏi thành` (2 trên 2). Điểm: vietnamese_clarity 8.9 thành 9.0 (cùng với mục 2).
  Điểm không đổi và vì sao: source_provenance 9.2 · han_viet_balance 9.2 · segment_alignment 10.0 · technical_integrity 9.6 giữ nguyên. triangulation 7.2 giữ nguyên (không có tầng English, trần 8.0, và không có gì để nâng). ambiguity_integrity 8.6 giữ nguyên: các bất định (a)–(m) bên trên còn nguyên, không có căn cứ phân xử thêm.
  Căn cứ mới cho bất định cũ (chỉ ghi, không đổi thân kinh): (f) `:7.3` `Dhāriṁsu matthake tattha` — song song cùng công thức `matthake dhārayiṁsu te` ở `tha-ap342:6.4`, nơi câu 5.4 liền trước gọi thẳng Đức Phật (`Yadi buddho tuvaṁ vīra`), và `tha-ap503:7.3–7.4` (`uddhaṁvaṇṭā adhopattā, chāyaṁ kubbanti satthuno`, hoa che bóng cho Bậc Đạo Sư) cho thấy nhiều khả năng đây là đầu của Đức Phật; vì Pāli `:7.3` không nêu chủ sở hữu nên vẫn giữ `trên đầu`, không thêm `Ngài`. `uddhaṁvaṇṭā adhomukhā` có đúng cụm ở `tha-ap323:2.4` (đã dịch `cọng hướng lên trên hoa hướng xuống dưới`) và `uddhaṁvaṇṭā adhopattā` ở `tha-ap503:7.3` (`cuống hướng lên, cánh hướng xuống`); `cuống hướng lên` khớp. (a) `Tiṁsakappasahassāni`: quét toàn Pāli root không thêm chứng cứ; bản Việt nguyên bài ở mục Tra cứu toàn văn dựa trên một bản đọc khác (ấn bản Buddha Jayanthi) và cho con số khác, nên đây là khác biệt bản đọc chứ không phải căn cứ để đổi số trên bản Pāli đã ghim; vẫn giữ `ba mươi ngàn` theo `tiṁsa` = 30 và ghi bất định. (j) `anīti anupaddavo`: tiền lệ trong tầng tự mâu thuẫn (`tha-ap393`: `tai ương, tai họa` cho `anupaddavo anīti ca`; `tha-ap430`: `không tai ương` cho `anītiko`); giữ `anīti` = tai ương theo `tha-ap430`, không đổi.
  Chỗ nghi ngờ nhưng quyết định không đổi: `:12.2` `vị ấy` (tiền lệ cho đúng Pāli này `người ấy` 16 so với `vị ấy` 4) — giữ `vị ấy` vì `:20.2` và `:21.4` cùng khổ lời tiên tri dùng `vị ấy` và đổi một chỗ sẽ làm lệch trong bài. `:14.2` `tháp lầu` — tiền lệ hoà 3 `tháp lầu` : 3 `ban công` cho `niyyūha`, giữ. `:14.3` `lầu gác` giữ theo `tha-ap1`. `:24.1–24.2` đọc theo sở hữu cách tuyệt đối, giữ.
  Kiểm tra sau sửa: tập khoá Việt bằng tập khoá Pāli 120 trên 120, đúng thứ tự; nháy `“”‘’` khớp Pāli từng khoá, 120 khoá, 0 lệch; dấu lược `…` chỉ ở `:27.2` và khớp Pāli; NFC, khoảng trắng thừa, khoá rỗng: 0 lỗi; Pāli lọt sang Việt chỉ là tên riêng đã giữ có chủ ý; cặp Pāli trùng nguyên văn trong chính bài: 0 cặp nên phép dò chạy rỗng. Đo tiền lệ nguyên văn: 33 khoá Pāli của bài (không tính khối `:0`) có khoá trùng nguyên văn trong 562 tệp `tha-ap` còn lại; sau sửa, 7 khoá (`:2.2`, `:7.4`, `:12.2`, `:12.3`, `:25.2`, `:25.3`, `:26.1`) khác dạng đa số, mỗi chỗ đã có lý do ghi ở trên hoặc ở phần cũ (`:25.3` giữ hình `Tôi không còn biết đến đọa xứ nào` 101 khoá, so với `Ta không biết mình rơi vào khổ đau` 130 khoá thuộc nhóm ngôi `ta` khác, không phù hợp ngôi `tôi` của bài). technical_integrity vẫn 9.6: chưa chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  LƯỢT CẢI THIỆN LẦN HAI 2026-10-14. Đọc đối kháng lại cả 120 cặp Pāli và Việt một lần nữa, rồi đo lại tiền lệ bằng chỉ mục nguyên văn trên 562 tệp `tha-ap` còn lại (khoá Pāli trùng nguyên văn) và trên toàn tầng (các cụm hiếm). Đổi 6 trên 120 khoá, không đổi tập khoá hay thứ tự.
  (1) `:25.1` `Satasahassito kappe` từ `Vào một trăm ngàn đại kiếp trước,` thành `Vào một trăm ngàn kiếp trước,`. Lý do (terminology fix, thay thế số đo ở mục lượt 2026-10-13): đo lại đúng khoá Pāli này cho `kiếp` 39 khoá so với `đại kiếp` 28 khoá toàn tầng `tha-ap` (số cũ 26 so với 20 là chưa đủ); với mọi khoá có `kappa` mà Pāli không có `mahā`, `kiếp` 245 so với `đại kiếp` 8. Quan trọng hơn, trong chính bài này `kappa` ở `:12.1` và `:12.3` đã là `kiếp`; viết `đại kiếp` ở `:25.1` làm người đọc tưởng hai đơn vị khác nhau trong khi Pāli là cùng một từ. Điểm: terminology 9.2 thành 9.3.
  (2) `:23.1` `Ajja me dhammappattassa` từ `Hôm nay, với tôi đã đạt Pháp,` thành `Hôm nay, với tôi, người đã đạt Pháp,`. Lý do (clarity/grammar fix): `dhammappattassa` và `vippamuttassa` là phân từ sở hữu cách đồng vị với `me`, tức mệnh đề phụ về chính vị nói; bản cũ viết `với tôi đã đạt Pháp` như một mệnh đề không có chủ ngữ, tiếng Việt lủng củng. `người đã đạt Pháp` chỉ là cách Việt hoá phân từ làm định ngữ, không thêm nghĩa. Điểm: vietnamese_clarity 9.0 thành 9.2 (cùng với mục 3, 4 và 5), grammar_logic 9.0 thành 9.1.
  (3) `:23.3` `Supupphitaṁ lohitakaṁ` từ `Đóa sen đỏ nở rộ tuyệt đẹp` thành `Đóa sen đỏ nở rộ`. Lý do (accuracy fix nhỏ): `su-` ở đây là tiền tố nhấn mạnh của `pupphita` (nở), tầng dịch `supupphita` bằng `nở rộ` hoặc `đang nở hoa rực rỡ`; `nở rộ` đã mang đủ sức nhấn, còn `tuyệt đẹp` thêm một lời khen thẩm mỹ mà Pāli không nói.
  (4) `:24.1`–`:24.2` `Mama kammaṁ kathentassa, padumuttarasatthuno` từ `Khi đang kể về nghiệp của tôi,` / `bậc Đạo Sư Padumuttara;` thành `Khi nghiệp của tôi đang được kể,` / `bởi bậc Đạo Sư Padumuttara;`. Lý do (accuracy/clarity fix): đây là cấu trúc sở hữu cách tuyệt đối, `kathentassa` đồng vị với `satthuno`, nên người kể là Đức Padumuttara. Bản cũ để `đang kể` đứng một mình rồi mới đến tên Ngài, dễ bị đọc thành chính vị nói kể (hoặc `bậc Đạo Sư Padumuttara` thành hô cách). Dạng bị động trả đúng người kể cho `satthuno`, không thêm ý. Điểm: grammar_logic 9.0 thành 9.1.
  (5) `:18.1` `Pattena pattasañchanne` từ `Phủ kín hết cánh hoa này đến cánh hoa khác,` thành `Được phủ kín, hết cánh hoa này đến cánh hoa khác,`. Lý do (grammar/clarity fix): `sañchanne` là quá khứ phân từ bị động ở vị trí xứ cách, bổ nghĩa cho khoảng bên trong cung điện của `:18.2`; bản cũ dùng dạng chủ động `Phủ kín` treo lơ lửng, như thể ai đó đang phủ. Chỉ đổi thể, không đổi nghĩa; bất định (b) giữ nguyên.
  (6) Mục 25.1 ở trên là khoá thứ sáu. Tổng cộng sáu khoá: `:18.1`, `:23.1`, `:23.3`, `:24.1`, `:24.2`, `:25.1`.
  Bất định đã được phân xử có căn cứ: (a) `Tiṁsakappasahassāni`. `tiṁsa` mang niggahīta và đứng độc lập là số 30 (`tiṁsa dhammā` ở `dn34:1.4.41` là ba mươi pháp; `tiṁsa kahāpaṇe` ở `an10.46:4.12`; hợp từ `tiṁsavassasahassāni` ở `sn15.20:3.3` và `bv25:26.1` là ba mươi ngàn năm; `Tiṁsakappasahassamhi` ở `bv13:13.3` và `bv28:11.1` đã dịch ba mươi ngàn kiếp), nên dạng `ti-` = 3 không phải khả năng ngữ pháp; trong phẩm `tha-ap` 14 trên 14 khoá trùng nguyên văn đều viết `ba mươi`, không còn khoá nào viết `ba nghìn kiếp` như ghi chú cũ lo ngại. Con số 30.000 kiếp ở `:12.1` được coi là đã phân xử; chỉ còn khác biệt bản đọc đã ghi ở lượt trước. (j) `anīti anupaddavo`: tiền lệ rõ nhất là công thức `anītiko anupaddavo` ở các bài Milinda, 12 khoá đều dịch `không tai ương, không hoạn nạn`, đúng cách dịch ở `:21.2`; hai khoá `Anupaddavo anīti ca` trong `tha-ap393` đảo thứ tự theo Pāli nên không mâu thuẫn. Giữ nguyên `:21.2`, bất định (j) coi như đã giải quyết.
  Bất định còn lại, không có căn cứ để phân xử thêm: (b) `:18.1`–`:18.4` (đối tượng của `imaṁ`, chủ ngữ của `tuvaṭṭissanti`; quét Pāli root không có đoạn song song nào chứa `pattasañchanne` hay `attharitvā pārupitvā tuvaṭṭ…` ngoài bài này) giữ vì vậy `họ trải thứ này ra rồi đắp lên` ở `:18.3`; (c) và (f) chủ sở hữu của `matthake` ở `:7.3` và `:23.4`; (d) `paṭimagga` ở `:3.2`; (e) ba thành tựu ở `:22.4`. Các bất định này đã được ghi ở trên và khiến `semantic_fidelity` không được nâng ở lượt này.
  Điểm lượt này: source_provenance 9.2 · semantic_fidelity 9.0 · grammar_logic 9.1 · segment_alignment 10.0 · terminology 9.3 · triangulation 7.2 · vietnamese_clarity 9.2 · han_viet_balance 9.2 · ambiguity_integrity 8.8 · technical_integrity 9.6. Trung bình thô 90,6 chia 10 = 9,06. Biên vượt ngưỡng 9,0 chỉ là 0,06, đến từ các cải thiện nhỏ ở ba tiêu chí trên và việc phân xử bất định (a), (j); người biên tập nên đọc lại `:18` và `:23` khi duyệt. Blocker duy nhất còn lại là blocker tầng tham khảo tiếng Anh vắng (waiver `no-upstream-english` vẫn áp dụng); không có blocker nghĩa nào mới.
  Kiểm tra sau sửa: tập khoá Việt bằng tập khoá Pāli 120 trên 120, đúng thứ tự; nháy `“”‘’` khớp Pāli từng khoá, 120 khoá, 0 lệch; dấu lược `…` chỉ ở `:27.2` và khớp Pāli; NFC, khoảng trắng thừa, khoá rỗng: 0 lỗi; cặp Pāli trùng nguyên văn trong chính bài: 0 cặp nên phép dò chạy rỗng; so với tiền lệ nguyên văn, khoá `:25.1` nay thuộc nhóm `kiếp` 10 khoá cùng dạng. technical_integrity vẫn 9.6: chưa chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  Rà soát lỗi lặp 2026-10-15 (đợt 2, đối chiếu Pāli đã ghim; không có bản Anh hay Việt độc lập cho
  tầng này): sửa 2.1 `Nagare haṁsavatiyā` đổi "thành xứ Haṁsavatī" thành "thành Haṁsavatī", vì
  `nagara` là thành, "xứ" là chữ thừa (cùng tha-ap411:1.1). Các khoá khác của bài không đổi.
