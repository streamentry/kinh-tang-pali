notes: |-
  17 khoá, tất cả đã dịch. Bài này **có** tầng Anh Sujato — khác 12 bài kia của lát.

  TẦNG THAM KHẢO — có, và đã dùng. `translation/en/sujato/sutta/kn/thag/thag1.100_translation-
  en-sujato.json` tồn tại trong cache đã ghim, liệt kê trong `source/upstream-manifest.json`, và phủ
  **đủ 17/17 segment ID** (`unmatched = 0`, nên `validate` không báo thiếu ID). Sujato có prose ở 8
  khoá: `0.1–0.4` và `1.1–1.4`; để trống ở `1.5`, `1.6`, `2.0–2.6` (như mọi bài `thag` khác). Đo
  coverage theo `source/layers.yaml`: Pāli có nội dung = **0 khoá** (thêm bốn câu kệ ngắn hơn 40
  ký tự), mẫu số bằng 0 nên `ratio = 1` và cổng coverage không chặn. Lớp lấp `english-project` của
  dự án không có cho bài này, và cũng không cần: các khoá Sujato để trống đều là tựa đề, đánh số
  phẩm và mục tóm lược — không phải Pāli có nội dung. Bản Việt hiện hành không có (Pháp Cú chỉ).

  ĐỐI CHIẾU ANH: `1.1–1.4` tôi đọc cùng Sujato (*Accomplished in the four right efforts, /
  mindfulness meditation is your range; / festooned with the flowers of liberation, / undefiled,
  you'll be fully quenched*) và không để Sujato thắng Pāli ở đâu: `Sammappadhāna` → *chánh tinh
  tấn* (136 tiền lệ trong tầng), `Satipaṭṭhānagocaro` → *là bậc cư trú trong niệm xứ* (`niệm xứ`
  153 tiền lệ, `cư trú` 18), `Vimuttikusumasañchanno` → *đeo tràng hoa giải thoát* (3 tiền lệ cho
  *đeo tràng hoa*), `Parinibbissatyanāsavo` → *không nhiễm ô chân lý của Niết-bàn*.

  PĀLI TRÙNG: `0.2` `Ekakanipāta` → *Bộ Một Bài Kinh* (296 bài), `0.3` `Dasamavagga` → *Phẩm Thứ
  Mười* (9 tiền lệ), `2.0` `Tassuddānaṁ` → *Tóm lược:* (311 bài), và **`1.5` `… Devasabho thero
  ….` trùng nguyên văn với `thag1.89:1.5` → dùng lại đúng nguyên văn *… Trưởng lão Devasabha …..***
  Hai dấu lược được giữ nguyên vì Pāli có hai. `1.6` `vaggo dasamo.` → *Phẩm thứ mười, mười bài.*
  (1 tiền lệ ở thag1.10) — giữ **cả hai** số vì Pāli có hai số.

  MỤC TÓM LƯỢC `2.1–2.6`: tôi dịch thành văn xuôi liệt kê như thag1.10:2.1–2.6 đã làm, giữ
  tên riêng Pāli. `mettajī muni` → *bậc Muni hiện hòa*; `khaṇḍasumano` → *rạng ngời như trăng
  khuyên*; `mahāpañño` → *vị đại trí tuệ*; `mahāmunīti` ở bài kia → *bậc Đại Muni*.

  BẤT ĐỊNH CHƯA PHÂN XỬ:
  · `Parinibbissatyanāsavo` (`1.4`) tôi tách `parinibbāna-satya-anāsava` = *không nhiễm ô chân lý
    của Niết-bàn*. Chú giải cũng đọc vậy. Sujato dịch *you'll be fully quenched* không nêu Niết-bàn;
    tôi theo Pāli.
  · `Vimuttikusumasañchanno` (`1.3`): `vi-mutti-ku-muma` là *hoa của sự giải thoát* (Sujato: *flowers
    of liberation*) — tôi theo Sujato ở đây vì Pāli không nói hoa nào.
  · `(Dutiya)` ở `0.4` tôi dịch *(Lần thứ hai)*; 0 tiền lệ cho dạng ngoặc này trong tầng.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
