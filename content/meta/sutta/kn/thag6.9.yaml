notes: |-
  Dịch từ Pāli root tại commit bilara đã ghim, đối chiếu bản Anh của Bhikkhu Sujato (đủ mọi khoá kệ; chỉ dòng kết tên tác giả là Sujato không dịch — thông lệ mọi bài).
  atimāna và omāna ở 6.1 trong kho chưa có tiền lệ nên dịch mô tả là mạn hơn người và mạn kém người, tránh dựng thuật ngữ mới.
  Tên ghép Purohitaputtajenta trong kho chưa có tiền lệ nên dịch mô tả là Jenta Con Trai Vị Tế Sư.
  Tiêu đề 0.2 theo đa số thag6 là Trưởng Lão Kệ Nhóm Sáu (5 trên 6), 0.3 là Phẩm Thứ Nhất.
