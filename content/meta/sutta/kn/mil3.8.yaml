notes: |-
  Bài thứ tám của `Ārilapañha` trong `Milindapañha`; 35 khoá, tất cả đã dịch. TẦNG THAM KHẢO — đo, không đoán. 0/7 bài `kn` của lát này có bản Anh Sujato tại commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud` (đếm trực tiếp trên đĩa: cp 35, dhp 26, iti 11, ja 83, kp 9, snp 5, thag 264, thig 73, ud 8 tệp) — **không có `mil`**, và `ja374/376/407/412` không nằm trong 83 tệp `ja` ấy. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit đã ghim có đúng 26 tệp và tất cả đều là `dhp*` (Pháp Cú). Lớp lấp `english-project` của dự án không có uid nào trong lát. Ba tầng tham khảo đều vắng ⇒ bài dịch chỉ từ Pāli root ⇒ blocker thật, và đây là **giới hạn upstream**, không phải lỗi của người dịch. Vì vậy `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng để né blocker, và `status` là `draft` vì `scripts/validate.ts` coi tệp Anh thiếu là **error** khi status là `review` hoặc `published`.

  `0.1` → *Milindapañha* (168 bài mil), `0.2` → *Meṇḍakapañha* và `0.3` → *Santhavavagga* **giữ nguyên Pāli**, theo `mil5.5.2`, `mil5.5.4`, `mil5.5.10` (3 bài mil5.5.* đã merge); `mil5.5.7` dịch *Phẩm Santhava* và `mil5.1.9` dịch *Phẩm Meṇḍakapañha* — 1/3 và 2/9, không đủ để đổi. Ghi lại để người điều phối gộp.

  VĂN XƯNG — chọn theo bầy lân cận và đếm được trên toàn tầng `kn`: `bhante nāgasena` → **bạch ngài Nāgasena** (đếm `bạch ngài` 105 lần, `bạch thầy` **0** lần) và `thưa ngài Nāgasena` ở vị trí mở lời (theo `mil5.5.2:1.1`, `mil5.5.4:1.1`, `mil5.5.10:1.1`); `mahārāja` → **tâu đại vương** (390 lần, mạnh hơn *thưa đại vương* 130 và *bạch đại vương* 5); `thero` → **Trưởng lão**; `āyasmā` → **Tôn giả**; `bhagavatā`/`tathāgato` → **Thế Tôn** / **Đấng Như Lai**; `ajjhayana` → **chinh phục**; `vipassana` → **thấy biết rõ ràng**.

  CÔNG THỨC HAI VẾ ĐƯỢC DÙNG LẠI NGUYÊN VĂN TRONG CHÍNH BÀI, ĐẾM ĐƯỢC. `3.5` và `5.3` cùng Pāli `‘sabbaṁ mayā supucchitaṁ …’ti` (khác nhau ở `bhadantena nāgasenena` / `bhadantena`) và `3.9` và `6.4` cùng Pāli `‘sabbaṁ milindena raññā supucchitaṁ, sabbaṁ mayā suvisajjitan’”ti` — **trùng nguyên văn y hệt**. Bốn khoá này dịch một lần rồi dùng lại y hệt; kiểm bằng script mục, không bằng mắt.

  `bhadantena Nāgasenena` dịch **Đại đức Nāgasena** (tiền lệ `mil5.1.10:1.1`), **không** dịch *Trưởng lão* — vì `bhadanta` và `thero` là hai từ khác nhau, và bài này dùng cả hai cho cùng một người (`1.1` `Thero āha` vs `3.3` `bhadantena nāgasenena`). Trộn hai từ sẽ làm mất phân biệt đó.

  `rājadeyyānī` ở `1.3` đọc là *bốn tiếng trống đã được đánh lên dành cho vua* — giữ nguyên nghĩa của `deyya` (phần dâng cho) thay vì diễn giải thành *báo giờ ban lộc*, vốn không có trong Pāli. `saṅghārāma` → *tu viện của Tăng chúng* theo tiền lệ duy nhất đã có trong tầng.

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó — BRIEF cấm `npm run validate|test|build|check` trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6** vì mọi chốt tự động của `_hvi.kiểm` đã xanh (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên văn Pāli, không lọt Pāli, khớp số dấu lược) và 35/35 khoá của chính bài này; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.
