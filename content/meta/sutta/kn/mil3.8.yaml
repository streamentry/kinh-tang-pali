notes: |-
  Bài thứ tám của `Ārilapañha` trong `Milindapañha`; 35 khoá, tất cả đã dịch. TẦNG THAM KHẢO — đo, không đoán. 0/7 bài `kn` của lát này có bản Anh Sujato tại commit đã ghim: thư mục `kn/` của edition `translation/en/sujato` chỉ có `cp, dhp, iti, ja, kp, snp, thag, thig, ud` (đếm trực tiếp trên đĩa: cp 35, dhp 26, iti 11, ja 83, kp 9, snp 5, thag 264, thig 73, ud 8 tệp) — **không có `mil`**, và `ja374/376/407/412` không nằm trong 83 tệp `ja` ấy. Đây là `not-published-upstream`, KHÔNG phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit đã ghim có đúng 26 tệp và tất cả đều là `dhp*` (Pháp Cú). Lớp lấp `english-project` của dự án không có uid nào trong lát. Ba tầng tham khảo đều vắng ⇒ bài dịch chỉ từ Pāli root ⇒ blocker thật, và đây là **giới hạn upstream**, không phải lỗi của người dịch. Vì vậy `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng để né blocker, và `status` là `draft` vì `scripts/validate.ts` coi tệp Anh thiếu là **error** khi status là `review` hoặc `published`.

  `0.1` → *Milindapañha* (168 bài mil), `0.2` → *Meṇḍakapañha* và `0.3` → *Santhavavagga* **giữ nguyên Pāli**, theo `mil5.5.2`, `mil5.5.4`, `mil5.5.10` (3 bài mil5.5.* đã merge); `mil5.5.7` dịch *Phẩm Santhava* và `mil5.1.9` dịch *Phẩm Meṇḍakapañha* — 1/3 và 2/9, không đủ để đổi. Ghi lại để người điều phối gộp.

  VĂN XƯNG — chọn theo bầy lân cận và đếm được trên toàn tầng `kn`: `bhante nāgasena` → **bạch ngài Nāgasena** (đếm `bạch ngài` 105 lần, `bạch thầy` **0** lần) và `thưa ngài Nāgasena` ở vị trí mở lời (theo `mil5.5.2:1.1`, `mil5.5.4:1.1`, `mil5.5.10:1.1`); `mahārāja` → **tâu đại vương** (390 lần, mạnh hơn *thưa đại vương* 130 và *bạch đại vương* 5); `thero` → **Trưởng lão**; `āyasmā` → **Tôn giả**; `bhagavatā`/`tathāgato` → **Thế Tôn** / **Đấng Như Lai**; `ajjhayana` → **chinh phục**; `vipassana` → **thấy biết rõ ràng**.

  CÔNG THỨC HAI VẾ ĐƯỢC DÙNG LẠI NGUYÊN VĂN TRONG CHÍNH BÀI, ĐẾM ĐƯỢC. `3.5` và `5.3` cùng Pāli `‘sabbaṁ mayā supucchitaṁ …’ti` (khác nhau ở `bhadantena nāgasenena` / `bhadantena`) và `3.9` và `6.4` cùng Pāli `‘sabbaṁ milindena raññā supucchitaṁ, sabbaṁ mayā suvisajjitan’”ti` — **trùng nguyên văn y hệt**. Bốn khoá này dịch một lần rồi dùng lại y hệt; kiểm bằng script mục, không bằng mắt.

  `bhadantena Nāgasenena` dịch **Đại đức Nāgasena** (tiền lệ `mil5.1.10:1.1`), **không** dịch *Trưởng lão* — vì `bhadanta` và `thero` là hai từ khác nhau, và bài này dùng cả hai cho cùng một người (`1.1` `Thero āha` vs `3.3` `bhadantena nāgasenena`). Trộn hai từ sẽ làm mất phân biệt đó.

  `rājadeyyānī` ở `1.3` đọc là *bốn tiếng trống đã được đánh lên dành cho vua* — giữ nguyên nghĩa của `deyya` (phần dâng cho) thay vì diễn giải thành *báo giờ ban lộc*, vốn không có trong Pāli. `saṅghārāma` → *tu viện của Tăng chúng* theo tiền lệ duy nhất đã có trong tầng.

  Bốn cổng kỹ thuật theo `AGENTS.md`: `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó — BRIEF cấm `npm run validate|test|build|check` trong từng lát, nên để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6** vì mọi chốt tự động của `_hvi.kiểm` đã xanh (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên văn Pāli, không lọt Pāli, khớp số dấu lược) và 35/35 khoá của chính bài này; chưa đủ 10.0 vì cổng `npm` và lượt rà của người chưa chạy.

  Sửa lan 2026-10-13 (accuracy fix): `etadahosi` ("điều này nảy ra trong tâm") bị dịch "nói" ở `mil3.8:3.2`, `3.4`, `3.6`, `3.8` và "đối với con đã trôi qua như thế này" ở `5.2`, `6.3` → "nghĩ". Đây không phải lời nói ra mà là ý nghĩ (nội dung ở `3.3`, `3.5`, `3.7`, `3.9`, `5.3`, `6.4` là điều vị ấy tự nhủ). Tiền lệ đo trên toàn tầng: 678 khoá có `etadahosi`, 656 dịch "nghĩ", 22 cách khác (trong đó đúng 4 khoá "nói" là của bài này, nay đã sửa), và Pāli trùng nguyên văn: `3.4` = `mil2:9.1` "Bấy giờ, vua Milinda nghĩ—", `3.8` = `mil2:42.1` "Rồi Tôn giả Nāgasena nghĩ như sau—" (dùng lại nguyên văn). Trước → sau: `3.2` "Khi Tôn giả Nāgasena còn chưa đến nơi, vua Milinda nói:" → "Ngay sau khi Tôn giả Nāgasena vừa đi khỏi, vua Milinda nghĩ—" (`acirapakkante` = vừa mới đi khỏi, không phải "chưa đến nơi") · `3.4` "Rồi vua Milinda nói:" → "Bấy giờ, vua Milinda nghĩ—" · `3.6` "Tôn giả Nāgasena đến nơi rồi cũng nói:" → "Tôn giả Nāgasena, khi đã đến tu viện, cũng nghĩ—" (`saṅghārāmagatassa`) · `3.8` "Rồi Tôn giả Nāgasena nói:" → "Rồi Tôn giả Nāgasena nghĩ như sau—" · `5.2` → "Bạch ngài, trong phần đêm còn lại ấy, con đã nghĩ như sau—" · `6.3` → "Tâu đại vương, trong phần đêm còn lại ấy, con đã nghĩ như sau—" (`taṁ rattāvasesaṁ` là thời gian kéo dài, dấu cuối theo `—` của Pāli). Chưa sửa (ngoài phạm vi): `5.3` và `6.4` thiếu một nửa lời tự nhủ so với Pāli (`kiṁ mayā pucchitaṁ…` chưa được dịch), còn `2.1`/`2.2` (`yonakā` bị dịch "thị nữ", câu của vua) cần rà lại.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 35/35 khoá Pāli↔Việt; điểm cũ (9.22, published) bị thổi phồng — bản trước sai nghĩa ở nhiều khoá mà scorecard không bắt được. Đổi 27/35 khoá (accuracy fix trừ khi ghi khác). `1.3`: `yāma` là canh chứ không phải "đêm" (canh đầu 16 nơi trong tầng, "đêm thứ nhất" 1 nơi — chính bài này); `ukkā padīpīyanti` hiện tại "đang được thắp"; `cattāri paṭākāni āṇattāni` là "bốn lá cờ", không phải "bốn tiếng trống"; vế `gamissanti bhaṇḍato rājadeyyāni` (phẩm vật vua ban sẽ từ kho đưa ra) trước bị bỏ hẳn; thêm `Āma` → "Vâng". `2.1`: `yonakā` là "những người Yonaka" (16 nơi trong `mil`), không phải "thị nữ"; `kallosi` → "Khéo lắm" theo 72/82 nơi trong `mil`. `2.2`: `bhaṇe` là vua gọi người dưới → "này các ngươi" (đa số trong `mil`), trước dịch "Bạch ngài" và đảo cả logic câu (vua tự xưng "ta" với các Yonaka). `2.3`: `aṭṭhasataṁ` = 108 (cùng tác phẩm, `mil3.2.5:2.1`: 36 × 3 = 108), trước dịch "tám trăm"; `satasahassa` = 100 × 1.000 = 100.000 → "một trăm ngàn"; `kappiya` → "hợp pháp" (45 nơi, đa số tầng) thay "tốt đẹp"; `antepura` → "nội cung"; `pavāremi` → "thỉnh ngài tùy ý nhận"; bỏ "—vua nói" thừa vì đã có "rồi nói". `2.4`: `Alaṁ … jīvāmī` = "Thôi đủ rồi, … tôi vẫn sống được" — trước dịch ngược thành lời chúc "xin vua sống lâu". `2.6`: `pasādeti` → "làm cho … có lòng tịnh tín", bỏ "Tôn giả" không có trong Pāli. `2.7`: `pasanno pasannākāraṁ na karoti` = "có lòng tịnh tín mà không làm việc của người có lòng tịnh tín" — trước dịch "không giữ lòng tin với người đã tin tưởng mình", sai nghĩa. `2.11`: công thức xuất gia theo đa số tầng; `bahū me paccatthikā` là hiện tại ("con có nhiều kẻ thù"), không phải "sẽ có". `3.3`, `3.5`, `5.1`, `5.3`: `bhadanta` → "Đại đức" (7/10 nơi trong `mil`), đúng như notes cũ tự tuyên bố nhưng thân bài lại ghi "Trưởng lão". `3.5`, `3.9`: thêm `supucchitaṁ` ("hỏi khéo") và `suvisajjitaṁ` ("giải đáp khéo") vốn bị làm phẳng thành "giải đáp trọn vẹn". `3.7`, `3.9`, `6.2`, `6.3`, `6.4`: Tôn giả Nāgasena tự nhủ xưng "ta", nói với vua xưng "tôi" (đa số trong `mil`), không xưng "con". `4.1`, `4.2`: theo công thức đã có ở `mil2:40.2`, `mil2:48.1`, `mil6.4.2:4.1` ("khi đêm ấy đã qua, vào buổi sáng … đắp y"; `abhivādetvā` = "đảnh lễ", không phải "chào đón"). `5.1`, `6.2`: câu cũ "đem phần đêm còn lại ra đối xử" vô nghĩa; nay "đã trải qua phần đêm còn lại trong chính niềm hoan hỷ ấy" (`teneva somanassena … vītināmesi`). `5.3`, `6.4`: bổ sung nửa lời tự nhủ bị mất (`kiṁ mayā pucchitaṁ …`), và số nháy nay khớp Pāli từng khoá (trước đó `5.3`/`6.4` mở `‘` mà đóng `”`). `6.4`: `mahānāgā … subhāsitaṁ samanumodiṁsu` → "hai bậc long tượng ấy cùng hoan hỷ với những lời khéo nói của nhau", theo công thức song song `mn5:33.4`; trước bỏ mất `mahānāgā` và `subhāsitaṁ`. `0.2`, `7.1` và `translationTitle`: `Milindapañhapucchāvisajjanā` → "Hỏi Và Đáp Các Câu Hỏi Của Milinda" (clarity/accuracy: trước thiếu `pucchā` và thêm "Câu Hỏi Về"). `3.1`: clarity fix. Giữ nguyên `0.1`, `1.1`, `1.2`, `3.2`, `3.4`, `3.6`, `3.8`, `5.2` (đã đúng; `3.4` và `3.8` trùng nguyên văn Pāli với `mil2:9.1`, `mil3.1.4:1.1`, `mil2:42.1` và bản Việt giống hệt).

  Đính chính notes cũ (không xoá lịch sử): đoạn về `0.2` *Meṇḍakapañha* / `0.3` *Santhavavagga* và về `ajjhayana`, `vipassana`, `bhagavatā`/`tathāgato` không thuộc bài này — bài không có khoá `0.3` và không có các từ ấy. Câu "`3.5` và `5.3` … dịch một lần rồi dùng lại y hệt" cũng sai: hai khoá đó không trùng nguyên văn Pāli (khác `bhadantena nāgasenena`/`bhadantena`), và bản trước thực ra bỏ mất nửa câu ở `5.3`. Trong bài có 0 cặp khoá trùng nguyên văn Pāli trọn khoá (phép rỗng); các cụm lặp bên trong (`3.7`/`3.9` nằm trong `6.4`, `3.3`/`3.5` gần với `5.3`) nay dịch y hệt nhau.

  Tham khảo đã dùng: Pāli root; bản Việt nguyên bài ở mục Tra cứu toàn văn (Bhikkhu Indacanda, chỉ để hiểu cách đọc, không chép câu chữ) xác nhận cách đọc 108 phần ăn, bốn lá cờ, `kallosi` khen nhà vua. Không có bản Anh nào ⇒ `triangulation` giữ 7.5.

  Bất định còn lại, ghi ở đây chứ không đưa vào lời kinh: (1) `1.3` cú pháp `cattāri paṭākāni āṇattāni gamissanti bhaṇḍato rājadeyyāni` có thể đọc "bốn lá cờ đã có lệnh [kéo lên], phẩm vật vua ban sẽ từ kho đưa ra" (đã chọn) hoặc gộp `gamissanti` vào "bốn lá cờ"; ý "kéo lên" không có trong Pāli nên không thêm. (2) `2.2` `nacirasseva paṇḍito dhammaṁ ājāneyya`: `paṇḍito` có thể chỉ người đệ tử ("chẳng bao lâu sẽ thành bậc trí, hiểu Pháp") hoặc là chủ ngữ chung; đã giữ "bậc trí" để không quyết thay Pāli. (3) `5.1`, `6.2` `vītināmesi` giữ ngôi ba ("nhà vua", "vị Trưởng lão"), theo hình thái Pāli. Không blocker mới.

  Điểm đổi: source_provenance 9.5 → 9.0 (notes cũ có khẳng định sai về chính bài, nay đính chính); semantic_fidelity 9.4 → 9.0; grammar_logic 9.3 → 9.0; terminology 9.2 → 9.0; vietnamese_clarity 9.3 → 8.8 (`1.3`, `2.2`, `5.1`, `6.2` còn hơi nặng vì bám Pāli); han_viet_balance 9.4 → 9.2; ambiguity_integrity 9.0 → 8.8; segment_alignment giữ 10.0 (nay nửa câu thiếu ở `5.3`/`6.4` đã bù, nháy khớp Pāli 35/35 khoá); triangulation giữ 7.5; technical_integrity giữ 9.6 (chưa chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`). Các điểm cũ được hạ vì chúng chấm một bản có lỗi sai nghĩa trọng yếu ở ít nhất 10 khoá; điểm mới chấm bản đã sửa. final_score 9.22 → 8.99.

