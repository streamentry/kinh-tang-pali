      3. Kệ 16.3–16.4 (`Sati ajjhattavikkhepā-` / `Kaṅkhanā bahiddhāvikkhepapatthanā`): hợp từ bị cắt qua ranh giới khoá và dấu gạch nối; dịch từng chữ theo thứ tự (“niệm, sự tán loạn bên trong, sự mong đợi, sự ước muốn tán loạn bên ngoài”), không chắc sati là “niệm” hay cách vị trí; cách đọc khác là một hợp từ “sự mong đợi tán loạn bên trong”.
      4. 29.2 `paripuṇṇā abhāvitā` giữ sát chữ “đã trọn vẹn, chưa được tu tập”; có thể là biến thể của aparipuṇṇā ở các bản khác, không sửa.
      5. 52.2 `tassa me te dhammā`: `me` không dịch (hiểu là biến thể của ime hoặc tiểu từ); cách đọc khác “của tôi”.
      6. 50.1–50.2 `ānaṁ`, `āpānaṁ` giữ Pāli vì là từ đang được giải thích; assāso là “hơi thở vào”, passāso là “hơi thở ra” theo cách các bài khác dịch assasati (thở vào) và passasati (thở ra).
      7. 63.2–63.7 và 84.2–84.9 `addhānasaṅkhāte`, `ittarasaṅkhāte` dịch “được tính là một quãng dài/ngắn”, 0 tiền lệ; cách đọc khác “được kể là thời gian dài/ngắn”.
      8. 47.8 và 86.8 `upanibandhanā` “sự cột buộc” (47.8 đọc “tướng là sự cột buộc”), 0 tiền lệ; 47.4 `phuṭṭhakakacadantānaṁ vasena` “nhờ những răng cưa chạm vào”; 47.11 `mukhanimitta` “tướng ở miệng”.
      9. 33.2–33.4: `dānavosagga` “bố thí và xả bỏ”, `cāgādhimutta` “khuynh hướng về xả thí” (ne21:30.1), `paṭipadāvisuddhi` “sự thanh tịnh của lối thực hành”, `tivattagata` “đã đi đến ba giai đoạn”, `tividhakalyāṇaka` “tốt đẹp ở ba phần”, `upekkhānubrūhanā` “sự tăng trưởng của xả”, `sampahaṁsanā` “sự làm vui tâm”: không có tiền lệ cho các hợp từ này.
      10. 61.5–61.12: `indakhīla` “cột trụ cổng thành” (dn29:26.5), `aḍḍhayoga` “nhà một mái”, `hammiya` “nhà mái bằng”, `bhisi` “nệm”, `taṭṭikā` “chiếu”; 61.11–61.12 giữ hai tiền tố pari và mukha trong lời giải.
      11. Các khoá gộp `kāyo upaṭṭhānaṁ sati anupassanā ñāṇaṁ` (84.10, 88.3, 96.3) và `vedanā/viññāṇaṁ cittaṁ/dhammā upaṭṭhānaṁ sati …` (101.1, 104.8, 107.8, 109.13, 113.8, 115.11, 117.9, 119.12, 123.8, 125.11, 133.12, 135.19) không có dấu câu ở Pāli; đọc như ba mệnh đề ở 63.8–63.10 (“… là thân; sự thiết lập là niệm; sự quán là trí”), với vế đầu đặt nhãn bước lên trước (“Khi cảm nhận hỷ, theo hướng hơi thở vào và hơi thở ra: thọ; …”). Cách đọc khác: chuỗi năm danh từ liền nhau.
      12. 93.2–93.3: `santaṁ sukhumaṁ` chỉ đứng ở vế thở vào nên giữ như vậy (“làm lắng dịu thân hành, yên tĩnh, tinh tế”); 93.1 các từ ānamanā, vinamanā, sannamanā, paṇamanā dịch “cúi tới, ngả lui, nghiêng sang bên, cúi xuống”, calanā “chao đảo”, pakampanā “run rẩy”: 0 tiền lệ.
      13. 94.1 và 95.1 `iti kira` “nghe nói” là chỗ nêu luận điểm để bác ở 94.2–94.3 và 95.2–95.4; `vātūpaladdhi` “sự nhận biết gió”, `pabhāvanā` “sự hiển lộ”, `kaṁse ākoṭite` “chuông đồng bị gõ” (có thể là chiêng hoặc cồng đồng): 0 tiền lệ.
      14. 130.2 và 133.2–133.8: nidāna “nhân duyên”, samudaya “sự sinh khởi”, jāti “sự sinh”, pabhava “chỗ phát sinh” (ghép theo ps2.2:37.3), ñāṇuppāda “sự khởi lên của trí”, nirodhupaṭṭhāna “sự hiện tiền của sự diệt” (0 tiền lệ); santāpa “thiêu đốt” (129.2).
      15. 143.2 và 144.2: `bhayatupaṭṭhāne paññā` “tuệ trong sự hiện tiền như là đáng sợ”; `paṭisaṅkhā santiṭṭhanā paññā` “tuệ là sự suy xét và sự an trụ” (cách đọc khác: hai danh từ độc lập, hoặc “sự suy xét về sự an trụ”).
      16. 145.2–145.6: anusahagata “vi tế” và oḷārika “thô” theo mnd4:66.7; cách đọc khác anusahagata “còn sót lại”.
      17. 15.4–15.7, 17.1–17.4, 27.5–27.6: `abhitunna` “bị thúc ép”, `mucchanā` “sự mê mờ”, `paṭikaṅkhanā` “sự mong chờ”, `nikanti` “sự ưa thích”, `taṇhācariyā` “hành vi của ái”: 0 tiền lệ cho tổ hợp này.
      18. 49.1–49.6 giữ lời kệ gần thag10.3:2.1–2.6 nhưng không chép nguyên (xem mục tiền lệ): 49.1 “Niệm hơi thở của ai” (thag10.3 dùng “Chánh niệm hơi thở” cho dạng ānāpānasati ngắn).
      19. 57.8 `anaññaneyyatā` “không do ai khác dẫn dắt” và 58.7 `attadamathattho yathattho` “ý nghĩa tự điều phục là ý nghĩa của sự đúng như”: 0 tiền lệ; attaparinibbāpana dịch “tự làm cho tịch diệt hoàn toàn”.
      20. 59.4 `bhāsate ca tapate ca virocate ca` dịch “chiếu sáng, rực rỡ và chói ngời” (sn22.102:11.1 dịch “rực nóng” vì chủ ngữ là mặt trời).
      21. 119.6–119.11: diṭṭhi “tà kiến”, ahirika “không biết hổ thẹn”, anottappa “không biết ghê sợ” theo khuôn mười phiền não; thina “hôn trầm” đơn độc khác thinamiddha “hôn trầm thụy miên” ở 2.4.

