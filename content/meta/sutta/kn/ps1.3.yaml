  CẤU TRÚC BÀI (Ānāpānassatikathā, niệm hơi thở). 1.3.1 (1–2): phần kê đếm, 220 trí gồm 8 + 8 + 18 + 13 + 32 + 24 + 72 + 8 + 8 + 8 + 21 (hơn hai trăm), và tám cặp chướng ngại–trợ giúp của định. 1.3.2 (3–14): mười sáu phương diện, tâm an trụ trong tính đồng nhất, tám triền cái đối với tám sự thoát ra của các bậc Thánh. 1.3.3 (15–31): mười tám ô nhiễm chia ba nhóm sáu, kèm kệ. 1.3.4 (32–59): mười ba trí về sự thanh tịnh (sáu cách điều chỉnh tâm, bốn tính đồng nhất, ba phần khởi đầu–giữa–kết thúc của thiền, tuệ quán và đạo), kệ về ba pháp tướng–hơi thở vào–hơi thở ra, ví dụ cái cưa, ba pháp tinh cần–thực hành–thù thắng, kệ Ānāpānassati và các lời giải từng chữ. 1.3.5 (60–139): ba mươi hai trí của người hành động có niệm, bốn bộ bốn × tám trí; mỗi bước gồm câu hỏi, định nghĩa, các lời giải “thân/thọ/tâm/pháp là sự thiết lập, không phải niệm”, ba học, hội tụ các căn–lực–giác chi–đạo–pháp. 1.3.6 (140–145): 24 trí theo hướng định, 72 trí theo hướng tuệ quán, 8 + 8 + 8 trí nhàm chán, 21 trí về lạc giải thoát, rồi câu kết.

