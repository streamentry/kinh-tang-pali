      1. `uducitaṁ … samuducitaṁ` (3.1) không có tiền lệ ở toàn tầng (0 khoá); dịch “được gom tụ, được gom tụ hoàn toàn” theo gốc ci (chất chứa); cách đọc khác “được nâng lên, được nâng lên hoàn toàn”.
