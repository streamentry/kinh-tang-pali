  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (dịch năm 2007, dựa trên bản Buddha Jayanthi). 13 chỗ bất đồng nghĩa (101 khoá) → sửa 0, giữ 9 chỗ (96 khoá, 52.18 tính một lần), bất định 4 chỗ (5 khoá). GIỮ: (1) 1.1 và 145.8, bản nguyên bài viết “hơn 200 pháp” còn Pāli là ñāṇasatāni nên giữ “trí”; (2) 15.6–15.7, 17.1–17.4, 27.5–27.6, abhitunna và mucchanā được bản nguyên bài dịch “áp đặt” và “hứng thú”, giữ “thúc ép” và “mê mờ”; (3) 18.5–18.6 và 23.5–23.6, parapattiyā được bản nguyên bài dịch “thành tựu tái sanh”, giữ “phải nương theo người khác” vì Pāli là parapattiya đi liền với vimokkhaṁ appajānantā; (4) līna, abhinata, apanata ở 24.5, 24.9, 24.11, 25.2–25.4, 28.9, 28.11–28.12, 32.8, 32.14, 32.17, bản nguyên bài dịch “trì trệ, quá chuyên chú, lơi là”, giữ nghĩa đen “co rút, nghiêng tới, nghiêng lui” vì Pāli không có chữ nào cho “chuyên chú” hay “lơi là”; (5) tadupagavīriyavāhanaṭṭhena ở 36.4, 44.4, 51.4, 52.18, 65.2, bản nguyên bài thêm “nhằm đạt đến Niết Bàn”, Pāli không có chữ Nibbāna ở đó nên giữ; (6) sama, susama, samattha ở 36 khoá (53.1–53.8, 75–138…), bản nguyên bài dịch sama là “thanh tịnh”, giữ “quân bình” vì 78.1 liệt kê riêng “sự thanh tịnh của tâm” (cittassa vodānaṁ) làm một trong bốn mục của sama, nên sama không thể trùng với “thanh tịnh”; (7) 57.9 visavitāya, bản nguyên bài dịch “rạng danh”, giữ “đã nở rộ”; (8) 58.2 vipattibhava, vipattisambhava, sampattibhava, sampattisambhava, bản nguyên bài dịch theo nghĩa “bất hạnh / thuận lợi”, giữ dịch sát hai từ bhava và sambhava; (9) paṭividita ở 87–113 (29 khoá), bản nguyên bài dịch “cảm nhận” như paṭisaṁvedī, giữ “thấu rõ” vì Pāli dùng hai từ khác nhau. BẤT ĐỊNH: (a) 3.1 uducitaṁ samuducitaṁ, bản nguyên bài đọc “được tiếp cận, được quen thuộc”, dự án “được gom tụ, được gom tụ hoàn toàn”, Pāli ghim không có chỗ nào khác dùng hai chữ này; (b) 16.3–16.4, bản nguyên bài bỏ chữ sati và xếp bốn mục “tán nội phần, mong mỏi, tán ngoại phần, ước muốn”, dự án giữ sati là “niệm”; (c) 29.2, bản nguyên bài đọc “không toàn vẹn, không tiến” (aparipuṇṇā abhāvitā), còn Pāli ghim ghi paripuṇṇā abhāvitā; so với 30.2 và 49.2 (paripuṇṇā subhāvitā) thì cách đọc có chữ a- phủ định hợp ngữ cảnh hơn, nhưng Pāli ghim là authority nên chữ dịch vẫn theo Pāli ghim, cần người biên tập quyết định có hiệu đính hay không; (d) 47.11 mukhanimitta, bản nguyên bài đọc “môi trên” (theo chú giải), dự án giữ nghĩa đen “tướng ở miệng”. Một lỗi tiếng Việt sửa qua lượt review đối kháng: 99.4 và 99.7 “tâm thỏa ý của tâm” thừa “của tâm”, đã sửa thành “tâm thỏa ý” như 115.4–115.9. Kiểm lại khi review: tập khoá Việt khớp Pāli 1.212/1.212; nháy “ ” ‘ ’ khớp Pāli từng khoá 0 lệch trên 1.212; 127 nhóm Pāli trùng nguyên văn trong bài (452 khoá), bản Việt giống nhau ở cả 127 nhóm; các số Pāli tính lại: 8 + 8 + 18 + 13 + 32 + 24 + 72 + 8 + 8 + 8 + 21 = 220, 5 + 4 + 4 + 8 = 21 ở 145.2–145.6, 25 + 25 = 50 ở 122.7–122.8, bộ 10 ý nghĩa ở 55.2 đếm đủ 10. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đối chiếu bản nguyên bài Bhikkhu Indacanda, đoạn song song cnd21, cnd22, mnd16, ps3.8, ps3.10): sửa 1 khoá: 56.1 sayambhū "bậc Tự Tại" → "bậc Tự Hữu" (sayambhū = tự mình hiện hữu, tự sinh, không do ai tạo; "Tự Tại" là nghĩa của vasī/issara và trùng với vasībhāva "sự làm chủ" cùng khoá, nên dễ gây hiểu là hai chữ đồng nghĩa). Đọc lại các khoá 1–55 và 56–57 không thấy thêm sai nghĩa; giữ nguyên các chỗ khác bản nguyên bài đã ghi ở mục đối chiếu 2026-10-14. Lỗi chéo (không sửa ở đây, chờ người biên tập): cnd21:13.3, cnd21:32.2, cnd22:59.2, cnd22:83.1, cnd22:109.5, cnd18:2.2, mnd16:55.2 đều dịch sayambhū "bậc Tự Tại"; cần thống nhất một cách. Bất định: sayambhū "Tự Hữu" là chọn lựa thuật ngữ, PED s.v. sayambhū: "self-become, self-existent"; không tra được trang PED riêng cho ps1.3 trong lượt này.
