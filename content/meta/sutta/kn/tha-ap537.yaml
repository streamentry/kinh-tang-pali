notes: |-
  Dịch trọn 115 khoá trực tiếp từ Pāli root; không có bản Anh của Sujato, không có lớp english-project và không có bản Việt hiện hành cho tha-ap537 tại commit đã ghim. Đối chiếu thuật ngữ và công thức với các Ký Sự cùng phẩm và các bài tha-ap liền kề (tha-ap530, tha-ap531, tha-ap544, tha-ap547, tha-ap551), cùng ja12 cho đoạn kệ Nigrodha và Sākha.
  Tiền lệ đã đo: có 34 khoá mà Pāli (bỏ dấu câu và nháy) trùng nguyên văn với những khoá đã dịch ở nơi khác (5.736 cặp đã dò), trong đó 32 khoá dùng lại nguyên văn bản đã có: Therāpadāna (490 so với 11); Các phiền não của ta đã được thiêu rụi (105 so với 24 và 23 dạng tôi); ta sống không còn lậu hoặc (106); Thật lành thay sự đến của ta (100); đã làm tròn lời dạy của Đức Phật (133 và 471 ở khoá có nháy kép đóng); Bốn vô ngại giải (509); Nhờ nghiệp lành khéo làm ấy (34); cùng với tâm nguyện và chí hướng (35); sau khi từ bỏ thân người (20); ta đã đến cõi trời Ba mươi ba (15 dạng ta so với 9 dạng tôi); sinh ra trong dòng họ Okkāka (20); tên là Gotama theo dòng ấy (15); sẽ làm bậc Thầy ở thế gian (20); Người kế thừa giáo pháp của Ngài (7); là con ruột, do giáo pháp tạo nên (5); sẽ làm đệ tử của bậc Thầy (3); ta nhìn thấy Đấng Dẫn Đạo thế gian (đổi ngôi tôi thành ta, 6 so với 2); Từ đó tâm ta được giải thoát (4); hoàn toàn không chấp thủ; Với những tấm vải nhuộm nhiều màu (ja487); Chỉ nên gần gũi Nigrodha, chớ chung sống với Sākha, Thà chết bên Nigrodha (ja12, nguyên văn); xuất gia, sống đời không nhà (pv25); như người từ xa trở về nhà mình (tha-ap551). Hai khoá khác với tiền lệ: 3.1 (hai tiền lệ tự lệch nhau, Ngài đang thuyết giảng Bốn Thánh Đế ở tha-ap353 và Đang khai thị bốn chân lý ở tha-ap520; chọn bốn chân lý, dạng nhiều hơn trong các khoá cùng cụm catusacca, khoảng 5 so với 1 dạng Thánh Đế) và 10.1 (xem mục lời thọ ký). Ngôi kể dùng ta theo đa số: tầng 100 ta so với 41 tôi, phạm vi tha-ap520 đến tha-ap559 là 10 ta so với 8 tôi, khoá gần nhất tha-ap530 và tha-ap531 đều dùng ta.
  Tên phẩm Kaccāyanavagga dịch Phẩm Kaccāyana: tầng chưa có bài nào trong phẩm này; tên phẩm theo tên riêng được giữ nguyên dạng Pāli ở các phẩm khác (Phẩm Sudhā 10, Phẩm Yasa 7 so với Phẩm Danh Vọng 1, Phẩm Bhaddiya 3, Phẩm Phaladāyaka 5). :0.3 trong Pāli không có số thứ tự đầu tên nên bản Việt không thêm số; translationTitle bằng đúng giá trị :0.3. Dạng tên bài Ký Sự Về Trưởng Lão X theo đa số gần nhất (tha-ap500 đến tha-ap559: 21 so với 15 dạng Bài Kệ Tuyên Ngợ hoặc Tuyên Ngôn). Lời kết 29.1 dùng nhóm nói những bài kệ này (số nhiều, theo imā gāthāyo). Khoá 30.1 theo dạng Ký Sự Về Trưởng Lão X, thứ năm (như tha-ap530:28.1); khoá 30.2 Catuvīsatimaṁ bhāṇavāraṁ dịch Phần tụng đọc thứ hai mươi bốn (catu 4 cộng vīsati 20).
  Lời thọ ký tương lai (10.1 đến 12.4): kappe/bhavissati/hessati/pāpuṇissati dịch theo hướng sau một trăm ngàn kiếp nữa, sẽ làm, sẽ đạt. Khoá 10.1 Satasahassito kappe dùng Sau một trăm ngàn kiếp nữa; ở tha-ap544, tha-ap547 và thi-ap26 cùng đoạn thọ ký này dùng Vào một trăm ngàn kiếp nữa (3 khoá), còn các khoá cùng Pāli ở nơi khác thường là Vào một trăm ngàn đại kiếp trước (29) hoặc kiếp trước đây (7) vì đó là câu kể quá khứ; hướng tương lai ở đây chắc chắn theo bhavissati và hessati. Khoá 1.1 Ito satasahassamhi dùng Cách đây một trăm ngàn kiếp (3 trong 3 khoá giống Pāli), khoá 1.2 kappe uppajji nāyako giữ dạng tiền lệ bậc Dẫn Đạo đã xuất hiện, chữ kiếp đã có ở 1.1.
  Dấu lược: ba khoá …pe… (26.2, 27.2, 28.2) giữ đúng một …; không có (…) trần trong Pāli của bài này. Nháy: kép mở ở 1.1 và đóng ở 28.3; nháy đơn mở ở 7.3 và đóng ở 12.4, mở ở 17.1 và đóng ở 17.4, mở ở 21.3 và đóng ở 21.4; đều khớp Pāli từng khoá. Đối chiếu 115 khoá với Pāli: đủ khoá, đúng thứ tự, 0 lệch nháy, 0 lệch dấu lược, NFC sạch, không khoá rỗng. Chỉ có 1 nhóm Pāli trùng nguyên văn trong chính bài (3 khoá, 3 cặp: …pe… ở 26.2, 27.2, 28.2), cả ba bản Việt giống hệt nhau, 0 cặp lệch. Hai khoá 27.3 và 28.3 chỉ khác dấu nháy đóng nên không tính là trùng. Đã đọc cặp Pāli với Việt của cả 115 khoá.
  Số Pāli: satasahassa là sata 100 cộng với sahassa 1.000 thành một trăm ngàn (100 nhân 1.000 là 100.000), dịch một trăm ngàn kiếp ở 1.1 và 10.1; sattāhaṁ là bảy ngày; tāvatiṁsa là Ba mươi ba (cõi trời); catusacca là bốn chân lý; catasso paṭisambhidā là bốn vô ngại giải; pañcamaṁ là thứ năm; catuvīsatimaṁ là thứ hai mươi bốn. Không có cụm tiṁsakappasahassa hay số lớn nào cần phân xử.
  Bất định và lựa chọn cần người biên tập lưu ý: (1) ekāvatthasumānasaṁ ở 9.2 là từ hiếm, chỉ xuất hiện một lần trong toàn lớp Pāli đã ghim; dịch theo cách đọc eka cộng vattha là chỉ mặc một tấm vải, tâm ý tốt lành (sumānasa); nếu hiểu theo cách khác (ví dụ tâm chuyên nhất vào một điều) thì cần sửa, tầng hiện có không có chứng cứ phân xử. (2) sukhinī ajanī ở 22.3 dịch trở nên an vui, hiểu ajanī là quá khứ của jāyati; nếu hiểu là sinh nở an lạc thì nghĩa là mẹ sinh ta trong an lạc; chưa có tiền lệ trong tầng. (3) vināsetha ở 21.3 dịch hãy loại bỏ, giữ trung tính giữa hủy diệt và trục xuất; pāpikaṁ dịch xấu xa. (4) Sākhamigatrajo ở 14.3 dịch con của nai Sākha, theo ja12 (Sākha là tên một vua nai); atraja chỉ người con sinh ra từ, nhưng Pāli không nói rõ có phải cha hay đàn nai của Sākha. (5) kumāraparihārena ở 23.3 dịch với cách nuôi dưỡng như một hoàng tử; kumāra có thể là bé trai hoặc hoàng tử. (6) vicittakathika dịch thuyết giảng tài hoa (theo tiền lệ mil5.4.5:3.5 duy nhất trong tầng, tức bậc thuyết giảng tài hoa); 9.4 vicittakathikattanaṁ dịch địa vị của bậc thuyết giảng tài hoa. (7) karuṇekarasāsayo ở 7.2 dịch có tâm ý thuần một vị bi mẫn. (8) vāhasā ở 12.2 hiểu là nhờ; nếu chú giải hiểu là nhờ việc cúng dường mang đến thì cần sửa. (9) 4.3 đến 5.1: Pāli viết nānāratanapajjotaṁ không có danh từ, bản Việt thêm mái che ở 5.1 để câu có chủ ngữ; maṇḍapa dịch mái che theo đa số (5 trong 7 khoá). (10) 19.1 đến 19.4: Pāli không nêu chủ ngữ của āruyha và yuñjitvā nên bản Việt cũng bỏ chủ ngữ; atthamentamhi dịch đang tàn lụi. (11) 24.1 āgamma dịch sau khi đến với; nếu hiểu là nương nhờ vào thì cần sửa. (12) 22.3 và 22.4 hoán đổi vị trí chữ mẹ của ta sang 22.3 để câu tiếng Việt xuôi, không đổi nghĩa. (13) bodhayantaṁ ở 3.2 dịch làm cho tỉnh ngộ, không thêm sắc thái giác ngộ hoàn toàn.
  Kiểm kỹ thuật chưa chạy trong lượt này: npm run validate, npm test, npm run check và npm run build; vì vậy technical_integrity đặt 9.6 và không tuyên bố technical gate đã pass.
