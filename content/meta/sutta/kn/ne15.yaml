  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 35 khoá chênh lệch lớn nhất. Khác nghĩa 2: sửa 0, giữ 0, bất định 2 (56.1 và 56.2 `Ettāvatā paṭicca indriyakhandhadhātuāyatanāni …`: bản dự án đọc `paṭicca` là cách nói tắt của duyên khởi, bản mù đọc là phân từ 'do nương vào nhau' ⟦?⟧; tầng dùng `paṭicca` là 'do nương vào' ở ne18:7.1, ne37:292.3, nên cách đọc phân từ cũng có căn cứ, nhưng khi đó câu không có chủ ngữ; chưa phân xử). 33 khoá còn lại chỉ khác thuật ngữ hoặc diễn đạt, giữ: `otaraṇā` 'sự dẫn đưa' (42/42 dòng `otaraṇā` của bài dịch cùng một từ; bản mù 'quy nhập'; dòng kết `Niyutto … hāro` cũng theo khuôn của các bài Netti khác), `indriya` 'căn' (bản mù 'quyền'), `padaṭṭhāna` 'nền tảng ứng với' (cả tầng Netti), 40.1–42.4 các dòng kệ dùng lại nguyên văn snp4.9 (riêng 42.3 `somaṁ` giữ 'người ấy, sự dính mắc này' khớp `so + imaṁ`). Rà đối kháng toàn bài: không phát hiện lỗi nghĩa, nháy, dấu lược hay số. Ngoài lát: ne31:4.3, 6.1 dịch cùng Pāli `otaraṇā` là 'vượt bậc', lệch hẳn 'dẫn đưa' của ne15. Không có bản Anh hay bản Việt độc lập khác; mọi phân xử dựa vào Pāli và tiền lệ nội bộ tầng.

