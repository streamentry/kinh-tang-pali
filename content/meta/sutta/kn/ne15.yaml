notes: |-
  Đợt 19, làn 101. Dịch từ Pāli root commit đã ghim, đủ 169/169 khoá (0.1–0.4, 1.1–56.4), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. `ne15` là `Paṭiniddesavāra`, `Vibhaṅga 12`, nhóm `otaraṇahāra`. Không có tầng Anh cho uid này (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Pāli của bài mang thẻ đánh dấu đậm `<b>` ở 3.1–3.3, 15.1, 20.1, 25.1, 26.6–26.9, 26.11: không chép thẻ vào bản Việt (các bài `ne` đã đăng cũng không chép). Pāli bài này không có `(…)` nên Việt không có.

  **Khuôn tên bài và công thức (dùng lại nguyên văn bản Việt đã có).** Đo trên các tệp `ne*` hiện có (không tính `ne15`): `Ở đây, nhóm X hướng dẫn là gì?` 11 khoá; `Nhóm X hướng dẫn đã được vận dụng` 11 khoá; `Bởi vậy, Đức Thế Tôn nói:` 11 khoá; `Bởi vậy, Tôn giả Mahākaccāyana nói:` 8 khoá (`Trưởng lão Mahākaccāyana` 1 khoá, `ne11:7.4`). `0.1` Netti: 30/30 cặp trùng Pāli có Việt giống nguyên văn. `0.2` Phần Giải Thích: 26/27 cặp giống (cặp lệch là `ne35:0.2` còn để nguyên Pāli). `0.3` → `Nhóm 12` (26 tệp `ne*` có khoá `Nhóm N`).

  **`otaraṇa` — tầng chưa có đa số, đã chọn `dẫn đưa`.** Đo các tệp `ne*`: `dẫn đưa` ở `ne2:1.2` (danh sách mười sáu hướng dẫn) và `ne2:4.2`; `ne14:29.2` dùng `dẫn đưa` trong một câu khác nghĩa; `sự đi vào` ở `ne3:13.4` (và động từ `otarati`/`otaranti` → `đi vào` ở `ne3:13.3`, `ne19:2.1`, `ne19:2.2`); `vượt bậc` ở `ne31` (8 khoá, gồm tên bài, dạng `đây là vượt bậc so với các căn/uẩn/giới/xứ`). Ba cách, không cách nào có đa số. Chọn `dẫn đưa` vì (1) các tên nhóm hướng dẫn trong các bài vibhaṅga đã có đều theo danh sách của `ne2` (`Định Danh` ở `ne14`, `Thanh Tẩy` ở `ne16`, `Áp Dụng` ở `ne17`, `Đề Ra` ở `ne4`); (2) `ne2` là bài liệt kê hướng dẫn. Vì vậy `Otaraṇahāravibhaṅga` → `Nhóm Dẫn Đưa Hướng Dẫn` và `Ayaṁ X-ehi otaraṇā` → `Đây là sự dẫn đưa theo các X` (X = căn, uẩn, giới, xứ, duyên khởi) ở mọi chỗ (khoảng 40 khoá). Hệ quả: 7 khoá của bài trùng nguyên văn Pāli `Ayaṁ khandhehi otaraṇā.` (10.2, 16.3, 21.2, 29.6, 37.2, 45.2, 52.2) khác `ne31:4.3` (`Đây là vượt bậc so với các uẩn.`). Đây là lựa chọn thuật ngữ có chủ ý, không phải lỗi; cần người biên tập thống nhất `ne2`/`ne3`/`ne31`/`ne15` (xem bất định 1).

  **Các thuật ngữ khác, có số đếm.** `dhātu` → `giới` (`ne14`, `ne31`; `mười tám giới` ở 46.1, như `ne14:2.5`). `āyatana` → `xứ`. `khandha` → `uẩn`; `sīla-/samādhi-/paññākkhandha` → `uẩn giới`/`uẩn định`/`uẩn tuệ` (đã có `giới uẩn, định uẩn, tuệ uẩn` ở `dn33:1.11.146`; chọn thứ tự `uẩn giới…` cho khớp bốn khoá `Đây là … uẩn` trong bài, không phải lỗi). `dhammadhātu` → `giới pháp` (tầng 15 khoá/7 tệp; `pháp giới` 1 khoá, `giới tánh pháp` 10 khoá/4 tệp ở `sn14`; `ne31` viết `giới của pháp`), `dhammāyatana` → `xứ pháp` (4 khoá/4 tệp). `anāsava`/`sāsava` → `vô lậu`/`hữu lậu` (87 và 30 khoá; `ne31` viết `không ô nhiễm`). `bhavaṅga` → `hữu phần` (`ne7:3.20`, đây là tiền lệ duy nhất trong tầng; `ne31` viết `các cõi hiện hữu`). `pariyāpanna` → `nằm trong`: 0 tiền lệ trong tầng cho dạng này (`ne31` viết `đầy đủ`); chọn theo nghĩa gốc của từ. `saṅgahita` → `gom`. `saṅkhāra` trong chuỗi duyên khởi → `các hành` (`ne18:3.2`, `sn12.68`), còn `ne8:9.6` và `ne31` viết `hành pháp`; dùng `hành` cả ở `saṅkhārapariyāpanna`. `taṇhā` → `tham ái` (35 khoá/9 tệp `ne*`), kể cả trong chuỗi mười hai chi. `paṭiccasamuppāda` → `duyên khởi` (`ne3:13.1`, `ne6`, `ne18:3.2`; `ne8:9.4` viết `duyên sinh`). `jāti` → `sinh` (`ne14:3.5`–`6.8`, 8 khoá; `ne17:3.3`, `ne18:7.12` viết `sanh`). `nirodha` → `diệt tận` (`ne14`), `khaya` → `đoạn tận`. `passaddhi` → `khinh an` (175 khoá/67 tệp toàn tầng, ví dụ `ud8.4:3.2`; `lắng tịnh` 4 khoá/2 tệp, như `mn144:11.5`). `samatha` → `định tĩnh` (`ne2:11.2`), `vipassanā` → `quán`. `sekkha`/`asekkha` → `hữu học`/`vô học` (`ne17:19.3`, `ne19:7.2`–`7.3`). `anunaya` → `quyến luyến`, `paṭigha` → `bực bội` (`ne17:8.3`). `upekkhindriya` → `căn xả` (`ne8`). `saupādisesā nibbānadhātu` → `Niết-bàn giới Hữu Dư Y`, theo `ne35:3.5` (`Niết-bàn giới Vô Dư Y`); còn `iti44` viết `cõi Niết-bàn còn dư tàn` (4 khoá) và `an9.12` viết `hữu dư y` (2 khoá). `nāmarūpa` → `danh sắc`. `rūpakāya`/`nāmakāya` → `nhóm sắc`/`nhóm danh` (`ne7:3.5`).

  **Phần dùng lại nguyên văn từ bài khác trong tầng.** 2.1, 2.3, 2.4 lấy `ud7.1:5.1`, `5.3`, `5.4` (2.4 khác `sn10.3:6.4` và `snp2.5:8.4` ở chữ `tái sinh`; giữ `tái hữu` theo `ud7.1`). 2.2 theo `ud7.1:5.2` nhưng bỏ nháy đơn vì Pāli ở 2.2 không có nháy (`ud7.1` có). 14.1 ghép từ `ud8.4:3.1`–`3.7` (`dao động`, `khinh an`, `khuynh hướng`, `không có đời này, không có đời sau, không có giữa hai đời` — cùng cách ở `mn144:11.x`, `sn35.87:11.x`). 27.1–28.4 và 34.2–34.4 lấy nguyên văn `ud8.8:7.1`–`8.4`. 40.1–40.4, 41.1–41.4 lấy `ne4:3.1`–`3.4`, `5.1`–`5.4` (cũng giống `snp4.1:1.x`, `2.x`), chỉ bỏ nháy vì Pāli ở bài này đặt nháy mở ở 40.1 và nháy đóng ở 42.4. 42.1–42.4, 49.1–49.4 lấy `ne4:7.1`–`7.4`. 26.1 lấy `sn44.1:11.15`. 29.2, 29.4 lấy `mn44:23.5`, `mn44:23.3`. 4.2 lấy dạng `mn38:20.12` (`Như vậy là toàn bộ khối khổ này đoạn diệt.`, 4 cặp giống; có 12 cặp trùng Pāli, 8 cặp khác chỉ ở chữ, trong đó `sn35.106` 4 cặp viết `sự đoạn diệt của toàn bộ uẩn khổ này`; hai dạng ngang nhau, chọn dạng khớp `diệt tận` của 4.1). 25.4 theo `sn55.40:5.8` (`Thân đã khinh an thì cảm thọ lạc`), `dn10:2.12.4` (`tâm được định tĩnh`), `dn10:2.35.2`/`2.36.6` (`khi đã giải thoát thì có trí biết`, `không còn trở lại trạng thái hiện hữu này nữa`). 25.5, 26.4 theo `mn72:20.1`, `20.17` (`Bất cứ sắc/thức nào nhờ đó người ta có thể mô tả Như Lai`).
  Pāli trùng với bài khác trong tầng: 43 khoá của bài, 127 cặp, trong đó 97 cặp Việt giống nguyên văn và 30 cặp khác, ở 19 khoá: `0.2` (1 cặp, `ne35:0.2` chưa dịch); 7 khoá `Ayaṁ khandhehi otaraṇā.` (7 cặp, `ne31:4.3`, xem phần `otaraṇa`); `4.2` (8 cặp khác trong 12); `2.4` (2/3); `34.1` (1 cặp, `ja436:9.1`, Jātaka, nghĩa khác: `Bởi vậy, các ngươi an nhàn…`; chọn dạng `ud8.8:8.1` cho khớp 34.2–34.4); `40.1`–`40.4` (5 cặp, `ja467:1.1`–`1.4`, `2.2`, bài Jātaka cùng kệ nhưng dịch khác: `Với người ham muốn dục…`; chọn dạng `ne4`/`snp4.1`); `42.2` (1 cặp, `snp4.1:3.2` chỉ khác dấu cuối `,`); `42.3` và `49.3` (mỗi khoá 2 cặp khác, `thag6.14:5.3` và `snp4.1:3.3`: `với sự dính mắc trong cõi đời`; chọn `ne4:7.3` `người ấy, sự dính mắc này trong cõi đời` vì giữ được cả `so` lẫn `imaṁ`); `49.2` (1 cặp, như 42.2).
  Pāli trùng nguyên văn trong chính bài: 15 nhóm, 121 cặp (`Ayaṁ paṭiccasamuppādehi otaraṇā.` 8 khoá, `Ayaṁ dhātūhi otaraṇā.` 7, `Ayaṁ indriyehi otaraṇā.` 7, `Ayaṁ khandhehi otaraṇā.` 7, `Ayaṁ āyatanehi otaraṇā.` 6, `Sā dhammadhātu …` 4, và các nhóm hai khoá: 10.1/52.1, 18.1/32.1, 25.6/26.5, 28.2/34.2, 28.3/34.3, 28.4/34.4, 42.2/49.2, 42.3/49.3, 42.4/49.4), bản Việt giống hệt nhau ở cả 121 cặp ⇒ 0 cặp lệch.

  **Số Pāli.** `pañcindriyāni` = 5 → `năm căn`; `tīhi khandhehi` = 3 → `ba uẩn`; `tedhātuke` = ba giới (dục, sắc, vô sắc: `dục giới`, `sắc giới`, `vô sắc giới` ở 3.1–3.2) → `ba giới`; `pañcakkhandho` → `năm uẩn`; `aṭṭhārasa dhātuyo` = aṭṭha 8 + dasa 10 = 18 → `mười tám giới`; `dasa rūpīni` = 10 → `mười`; `pañca rūpīni indriyāni` 5 + `pañca arūpīni indriyāni` 5 = `dasa indriyāni` 10 → `mười căn` (47.1 tự kiểm 5 + 5 = 10); `dve indriyāni` = 2 → `hai căn` (17.1, 22.1, 31.1, 31.3, 36.2, 53.1); `duvidho`/`duvidhā` = 2 → `hai loại`; `chasu` = 6 → `sáu nội xứ`, `sáu ngoại xứ`, `sáu xứ`. Không có số lớn, không có `Tiṁsakappasahassa`.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `otaraṇa`: ba cách đã có trong tầng (`dẫn đưa`, `sự đi vào`, `vượt bậc`), chưa có người biên tập phân xử; nghĩa gốc `otarati` là đi xuống, đi vào. Cách đọc `Ayaṁ indriyehi otaraṇā` là `sự dẫn đưa (bài kệ) theo các căn` là cách hiểu của người dịch từ cấu trúc cả bài (mỗi chi của kệ được đưa vào lần lượt căn, duyên khởi, uẩn, giới, xứ); không có bản Anh để đối chiếu.
  2. `bhavaṅga` → `hữu phần`: chỉ một tiền lệ (`ne7:3.20`), nghĩa chi tiết (chi phần của hữu, hay nhân của hữu) không phân xử. `anāsavā no ca bhavaṅgā` dịch `vô lậu và không phải hữu phần` — giữ hai vế song song với `sāsavā bhavaṅgā` → `hữu lậu và là hữu phần` (18.1, 32.1).
  3. `saṅkhārapariyāpanna` → `nằm trong các hành` (0 tiền lệ): `saṅkhāra` ở đây là các pháp hữu vi, không phải hành trong chuỗi duyên khởi; `ne31:5.1` viết `đầy đủ hành pháp`, bài này viết `hành` (như chuỗi duyên khởi). Chưa phân xử.
  4. 25.5, 26.4: `khayā rāgassa khayā dosassa khayā mohassa` đặt giữa `na dhammesu` và `yena rūpena …`; Việt đọc là lý do của `không nghiêng về các sắc, …` (và lặp ở 25.6/26.5 làm lý do của `chỉ được gọi là đã tịch tịnh`). Cách đọc khác, gắn `khayā …` với vế sau, không loại trừ được. `vimutto` ở 25.5/26.4 bổ nghĩa cho `tathāgato` (không có chủ ngữ riêng ở Pāli): dịch `Như Lai đã giải thoát trong sự cạn tận của sắc`. `atthītipi na upeti` (Pāli không có nháy): dịch `không đi đến chỗ nói rằng có`, không đặt nháy. `saṅkhaya` → `cạn tận` để phân biệt với `khaya` → `đoạn tận`; `nibbuto` → `tịch tịnh` (như `mn51:5.10`; `dn16:4.3.10` viết `tịch diệt` cho `parinibbuto`). 25.6/26.5: Pāli không có chủ ngữ; dùng `vị ấy`.
  5. 26.6–26.10 (lời giải thích): `idhāgati` → `sự đến đời này`; `peccabhavo` → `sự hiện hữu ở đời sau`; `nevidhā`/`na huraṁ`/`na ubhayamantarena` giữ `đời này`/`đời sau`/`giữa hai đời` (như 14.1 và `ud8.4`, `mn144`, `sn35.87`) dù lời giải thích của Netti nối `idha` với sáu nội xứ và `huraṁ` với sáu ngoại xứ. `phassasamuditesu` → `do xúc hội tụ` (`samudita` không có tiền lệ).
  6. 15.1–15.3: `nissayo` → `nương tựa`, `taṇhānissayo`/`diṭṭhinissayo` → `nương tựa vào tham ái`/`nương tựa vào kiến` (đọc sở hữu cách là đối tượng nương tựa; cách đọc `nương tựa của tham ái` không loại trừ được). `cetanā` → `tư` (không phải `ý tư` như `manosañcetanā` ở `ne19`). `rattassa` → `người đang tham đắm`, `mūḷhassa`/`sammūḷhassa` → `người si mê`.
  7. 3.3: `tedhātuke ayaṁ asekkhāvimutti` đọc là `trong ba giới, đây là sự giải thoát của bậc vô học`; vị trí cách (locative) có thể chỉ phạm vi hoặc điều kiện, không phân xử. 8.1: `sā sekkhāvimutti` → `đó là sự giải thoát của bậc hữu học` (đại từ `sā` quy về `samugghāta`).
  8. 20.1: `samathavasena` → `theo phương diện định tĩnh` (phương diện 156 khoá theo `ne31`); câu có thể đọc là `nhờ định tĩnh`.
