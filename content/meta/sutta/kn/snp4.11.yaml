notes: |-
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 3.3, 4.3 (`niṭṭhā` «quyết định» → «cứu cánh»: Niddesa mnd11:27.4 *rūpaniṭṭho hoti* = đạt được điều tìm cầu, chú giải *āsāya samiddhi*, Sujato «aims»), 9.4 («ta» → «Ta»: người đáp là Đức Phật, §9), 10.2, 11.2 (`pariggaha` «chấp thủ» → «sở hữu»: «chấp thủ» là chữ của *upādāna*; DPD possession, Niddesa mnd11:80, Sujato «possessions»; khớp snp2.14, snp4.2), 10.3, 11.3 (`mamatta` «chấp ngã» → «sự xem là của mình»: DPD my-ness, Niddesa mnd11:81, Sujato «possessiveness»; khớp snp4.6:3.4), 14.2 (`aññaṁ taṁ pucchāma`: *taṁ* = ngài, Niddesa mnd11:112.2 *aññaṁ taṁ yācāma … uttariṁ taṁ pucchāma*, Sujato «I ask you once more»: «con lại hỏi điều khác» → «con lại hỏi ngài điều khác»), 15.4 (`kusalā vadānā` = tự xưng thiện xảo, không phải bậc thiện xảo: chú giải *kusalavādā samānā*, *paṇḍitamānino*, Niddesa mnd11:117.4, Sujato «claiming to be experts»), 16.4 (`bhavābhavāya` «hữu và phi hữu» → «hữu này hữu khác»: Niddesa mnd11:125.2 *punappunabbhavāya*, chú giải *punappunaṃ upapattiyā*, Sujato «life after life»; khớp snp3.5, snp4.5, snp5.6); giữ 5.3, 7.1 (`kodha` «sân hận»: toàn bộ Kinh Tập dùng «sân hận» cho *kodha*, 9/9 khoá ở 7 bài; không sai nghĩa, đổi riêng bài này sẽ lệch snp4.14, snp4.16), 2.5, 16.3 (*vivāda* «tranh cãi», ngang nghĩa), 3.2 (*lobhā* chủ cách theo Sujato, cách đọc chính đáng), 12.4 (*jāniyāma* số nhiều thi ca như *apucchimha* 14.1; lời nghĩ thầm), 15.3 (*samaya* «thời điểm» theo Sujato; Niddesa và chú giải đọc khác, mnd11 đã chú thích).
  Thống nhất cấp kho 2026-10-17: kusalāvadāna/kusalā vadānā dịch «tự nhận là thiện xảo» (số ít kusalāvadāno: «tự mình nhận mình là thiện xảo»), theo DPD vadāna «asserting; professing», lời giải Niddesa kusalavādā (= tuyên bố mình là) và mnd13/snp4.13; thay «tự cho (mình) là», «tán thán».
  Thống nhất cấp kho 2026-10-17 (dhīra): dhīra «bậc kiên định» → «bậc trí» theo chính lời giải của Niddesa (dhīro paṇḍito paññavā buddhimā ñāṇī vibhāvī medhāvī: mnd9:25.4, mnd11:125.3, mnd12:86.1, mnd13:133.3, mnd16:159.2), theo đa số kho (cnd2, cnd8, cnd23, snp1–snp5, snp4.2, snp4.13, snp4.16 đều «bậc trí»), cho dòng kệ Niddesa khớp bài kệ gốc snp4.13:19.3 và snp4.16:10.1; trong lời giải, chữ đầu dhīro nay là «bậc trí», sáu chữ sau giữ nguyên; snp3.6:33.4 («dũng mãnh», mạch định nghĩa vīra) không đổi.
