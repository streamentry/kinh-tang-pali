notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên. Không có blocker.
  
  **Kệ là một lời hướng dẫn 3 bước, và bản dịch giữ đủ cả ba bước theo đúng thứ tự.** Người nghe được dạy: phải hiểu dấu hiệu của tâm, phải hiểu vị ngon của sự vắng lặng, phải thiền với tâm nhớ rõ ràng — thì sẽ đạt sự an lạc không thuộc vật chất. Bản dịch:
  - `Cittanimittassa kovido` → *Người khéo rành dấu hiệu của tâm*
  - `Pavivekarasaṁ vijāniya` → *hiểu rõ vị ngon của sự vắng lặng*
  - `Jhāyaṁ nipako patissato` → *Tu thiền, kẻ đã phá bỏ, tâm nhớ rõ ràng*
  - `Adhigaccheyya sukhaṁ nirāmisan` → *sẽ đạt được sự an lạc không thuộc vật chất*
  
  **`cittanimitta` → *dấu hiệu của tâm* ✓.** `nimitta` = dấu hiệu, dấu vết; đây là thuật ngữ quen thuộc trong tầng, và bản dịch dùng đúng.
  
  **`pavivekā` + `rasa` → *vị ngon của sự vắng lặng*.** `pavivekā` là sự vắng lặng, cô độc (nền tảng của thiền), `rasa` là vị ngon, hương vị. Cách dịch ghép hai từ và giữ cả hai tầng nghĩa ✓. Sujato dịch *the nectar of seclusion* — cũng hai tầng.
  
  **`nirāmisan` → *không thuộc vật chất*.** `nirāmisan` (nam tính từ `rāmi` + `an` phủ định) = không thuộc về tham, không phải vật chất, siêu thế. Bản dịch *không thuộc vật chất* ✓; Sujato dịch *not of the flesh*.
  
  **Điểm làm phẳng ở `1.3`: `nipako` → *kẻ đã phá bỏ*.** `nipaka` là tính từ "trong sạch, không ô nhiễm", ở đây là tính ngạo từ bổ nghĩa cho người nghe (tức người đã sạch). Bản dịch biến thành danh ngạo từ *kẻ đã phá bỏ* (người đã phá bỏ điều ô nhiễm). ý không sai, nhưng là đổi từ loại và hơi suy diễn hành động; tôi trừ nhẹ ở `semantic_fidelity`.
  
  **`patissato` → *tâm nhớ rõ ràng*.** `patissato` (từ √sar, nhớ lại) = có trí nhớ rõ ràng, tỉnh thức ✓.
  
  **`jitā` — không có trong bài.** Vế `1.3` bắt đầu bằng `Jhāyaṁ`, tức **mệnh lệnh** (thứ tự 2 ngôi của √jhā). Bản dịch dùng *Tu thiền* ✓ đúng chức năng, không ép thành câu tường thuật.
  
  **Sujato lệch chiều ở `1.3`** (Sujato đặt *practicing absorption, alert, mindful* ở `1.3`, trong khi Pāli `1.3` là `Jhāyaṁ nipako patissato`). Bản dịch bám Pāli.
  
  **Tên riêng:** `Sunāga` giữ dấu ở `0.4`, và `1.5` dùng `Sunāgo` (dạng + o) theo Pāli ✓.
  
  **Tầng Anh** có mặt đủ bốn vế.
  
  **Tầng Việt**: không có Thích Minh Châu cho Trưởng Lão ở commit đã ghim.
