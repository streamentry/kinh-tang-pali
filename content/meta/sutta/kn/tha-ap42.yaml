    **288 KHOÁ CỦA LÁT NÀY CÓ 120 KHOÁ Pāli TRÙNG NGUYÊN VĂN; TÔI DÙNG LẠI 96/120 NGUYÊN VĂN
    BẢN VIỆT ĐÃ CÓ.** Chỉ mục dựng từ 136.449 cặp Pāli↔Việt của toàn tầng (loại 8 bài của lát
    ra khỏi chỉ mục). Những cặp đã dùng lại nguyên văn, kèm số cặp tiền lệ:
    `Paṭisambhidā catasso,` → Bốn vô ngại giải, (287); `…pe…` → … (406);
    `Duggatiṁ nābhijānāmi,` → Ta không biết mình rơi vào khổ đau, (83);
    `Sattaratanasampannā,` → Đầy đủ bảy món báu quý giá, (12); `cakkavattī mahabbalā.` (số nhiều)
    → là các Chuyển Luân Vương có đại oai lực. (8); `kataṁ buddhassa sāsanaṁ”.` →
    đã làm tròn lời dạy của Đức Phật”. (257); `Catunnavutito kappe,` → Vào chín mươi tư kiếp
    trước đây, (16); `Itthaṁ sudaṁ āyasmā X thero imā gāthāyo abhāsitthāti.` → Tôi nghe như vầy:
    Tôn giả Trưởng lão X đã nói những bài kệ này. (374/376 toàn tầng, 354/354 trong tha-ap).
    `…theraapadāna` → Bài Kệ Tuyên Ngợ Về Trưởng Lão <tên> (136/287). `…vaggo <N>` → Phẩm X là
    thứ N. (11/15).

    **24 KHOÁ LỆCH ĐA SỐ — LỆCH CÓ LÝ DO, KHÔNG PHẢI LỠ TAY.**
    (a) Đại từ: tôi dùng **ta** xuyên suốt vì cụm tiền lệ mà tôi dùng lại nguyên văn đều
    dùng *ta* — `Duggatiṁ nābhijānāmi` (83 lần, *Ta không biết…*), `Kilesā jhāpitā mayhaṁ`
    (52, *của ta*), `viharāmi anāsavo` (52, *ta sống*), `Svāgataṁ vata me āsi` (52, *của ta*).
    Nếu tôi dùng *tôi* ở khoá khác thì ngay trong cùng một câu kệ sẽ lệch. Đếm cả tầng: 138 bài
    dùng *ta*, 140 bài dùng *tôi*, gần như bằng nhau — không có quy tắc tuyệt đối, nên ưu tiên
    nhất quán trong bài.
    (b) `Tassuddānaṁ` (:10.1): tôi dùng **Tóm tắt phẩm này:** theo đa số *trong chính tha-ap*
    (11/15), không theo đa số toàn tầng *Tóm lược:* (295/387 trong `kn`). Đây là thứ tự tra cứu
    mà BRIEF_VI3 §11.2 chốt: tên/mối cục bộ theo chính tác phẩm đang làm. **Cần coordinator
    gộp** — `Tassuddānaṁ` đang có hai cách trong tầng.
    (c) `Siddhatthassa bhagavato` (:1.1): dịch *“Của Đức Thế Tôn Siddhattha,* vì đây là cách
    HÀNG (genitive) và cần tiếp vế sau. Đa số tiền lệ là *“Lên Đức Thế Tôn Siddhattha,* (4) và
    *“Đến Đức Thế Tôn Siddhattha,* (2) — vế trước của câu kệ ở `tha-ap182:1.1`
    (*Vipassissa bhagavato* → *“Của Đức Thế Tôn Vipassī,*) cho đúng cấu trúc.

    **TÊN PHẨM.** `Kuṇḍadhānavagga` → **Phẩm Kuṇḍadhāna**: 4/4 bài đã có trong phẩm này
    (tha-ap38–41) dùng đúng một cách này. `Sassā…` nói chỗ khác: `Phẩm Bậc Tán Thán` (`Thomakavagga`),
    `Phẩm Hoa Kumuda` (`Kumudavagga`)… mỗi agent một kiểu; ở lát này 8 phẩm, 5 cái nhất trí
    tuyệt đối, 3 cái có hai kiểu (xem `tha-ap56` và `tha-ap522`).

    **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
    · `Vicittadusse` (:1.3) — `vicitta-dutta` là tấm vải có sọc nhiều màu; tôi dịch *tấm áo nhiều
      sắc*. 0 tiền lệ cho cụm này trong toàn tầng; đọc theo gốc `-dutta` (vải) và `vi-` (nhiều màu).
    · `suceḷā aṭṭha khattiyā` (:5.2) — `khattiya` trong tha-ap đã dịch theo ba kiểu (*quân tộc* 1,
      *vua chúa sát-đế-lỵ* 3, *vua Sát-đế-lị* 1); `suceḷa` = rạng ngời, 0 tiền lệ. Tôi dịch *có
      tám vị quân tộc rạng ngời,*. Chủ từ của cả cụm là số nhiều (`khattiyā`), nên `:5.4` dịch số
      nhiều — đây là lý do tôi **không** dùng lại nguyên văn dạng số ít của nhánh `cakkavattī
      mahabbalo`.
    · `dussaṁ` (:3.3) — nghĩa đen là *cây*; `dussa` cũng nghĩa là *dữ* nên dịch *cây dữ* là
      calque gây hiểu sai trong tiếng Việt. Tôi dịch **cây gỗ**. Đây là cải thiện văn phong có
      chủ ý, không phải thêm chữ.

    **DẤU LƯỢC.** `:6.2` là `…pe…`; bản Việt giữ **đúng một** `…`, khớp từng khoá khi ghi
    (kiểm bằng `lược()` của `_hvi.py`, không sửa file đó).

    **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:6.3`; từ `:7.1` trở đi ngoài nháy kép. Tự đếm
    lại: cân.

    **CHỐT `lọt_pāli` — CỜ GIẢ, ĐÃ BÁO CÁO, KHÔNG SỬA `_hvi.py`.** Chốt bắt mọi từ mang dấu Pāli mà
    tầng Việt *chưa từng* dùng, nên nó chặt đúng lần dùng đầu tiên của một tên riêng hợp lệ;
    chính docstring của `_hvi.py` nói *tên riêng Pāli trong bản Việt là đúng*. Ở bài này nó chặt
    `Siddhattha`, `kapparukkha`, `Kapparukkhiya`, `Kuṇḍa`, `Sāgata`, `Kaccānā`, `Udāyī`,
