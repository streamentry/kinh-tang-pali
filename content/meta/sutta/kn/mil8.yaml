notes: |-
  ĐỌC HẾT BÀI TRƯỚC — MIL8 LÀ PHẦN KẾT, KHÔNG PHẢI HỘI THOẠI. Lát này giao cho tôi mil8 và trong cùng lát có mil3.2.1, mil5.4.9, mil7.5.6. Tôi đã đọc hết p17.txt: mil8 ở commit đã ghim là Nigamana, tức lời kết của toàn bộ Milindapañha (32 khoá: số liệu sách, cảnh chấn đất, lời tán dương của vua, bốn bài kệ ca ngợi trí tuệ, bài kệ ghi công việc viết sách ở Laṅkā, và lời nguyện cuối). Nó KHÔNG có câu hỏi đáp nào giữa vua và Trưởng lão, nên chỉ có hai chỗ xưng hô với tôn giả, và tôi dùng Thưa Đại đức Nāgasena theo mil5.4.10 và mil5.4.1 như người điều phòng chỉ định. Vua được gọi là Đại vương Milinda.

  CON SỐ 1.1. Pāli nói sáu mục, mỗi mục hai mươi bốn tiểu mục, đã có hơn 132 câu, chưa có 242 câu, hợp lại thành ba trăm linh bốn câu; tôi dịch đúng các số này, kể cả chữ hơn, vì Pāli có dvāsaṭṭhiadhikā và catūhi adhikā.

  4.1 ĐỌC LẠI SAU KHI ĐÃ GHI. Bản đầu của tôi đọc catūhi paccayehi thành vế của Trưởng lão, nhưng đó là sai: bốn thứ ấy là phép hộ trì mà Trưởng lão Nāgasena cùng trăm nghìn vị tỳ-kheo dâng cho vua; tôi đã sửa thành đã hộ trì bốn thứ để phụng sự Ngài.

  BÀI KỆ 6.1 đến 6.8. Tôi dịch theo mạch nghĩa của cả tứ vế: trí tuệ đứng ở yếu tố nào thì không bị kém ở yếu tố ấy, sự tôn trọng dành cho nó là thượng đẳng, vì thế người trí sau khi suy xét điều mình tự biết nên tôn trọng bậc có trí tuệ như lòng kính trọng dành cho tháp. 6.5 Tasmā hi paṇḍito poso trùng với mn143:17.11 và sn1.48:3.1 nên tôi dùng lại nguyên văn Vì thế, người trí.

  4.1 KHÔNG CHÚ THÍCH TÊN BỐN THỨ. Pāli chỉ ghi catūhi paccayehi, tức bốn thứ hộ trì, và bài này không có chỗ nào để giảng tên; tôi để nguyên văn như Pāli thay vì chèn y phục, thức ăn khất thực, chỗ ở, thuốc men vào thân kinh.

  TÊN ĐỊA DANH CÓ DẤU PĀLI. Laṅkā (7.1), Sāma và Mahācunda không có trong bài này, còn Sāriputta, Ānanda, Mahākassapa, Laṅkā thì có; cả bảy tên ấy tôi khai vào bộ nhớ _hvi._GIỮ trước khi ghi vì dạng Việt không trùng dạng Pāli ở dạng gốc.

  DẤU LƯỢC. Bài không có dấu lược nào; bản Việt cũng không có.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.

  STATUS. Hai blocking error ở trên là thật và đo được, nên bài đặt draft bất kể final_score.

  Giải quyết draft 2026-10-12. Kiểm toán độc lập đọc đối kháng từng khoá với Pāli root; bản trước có lỗi nghĩa và lỗi số nặng nên viết lại 29/32 khoá (3 khoá tiêu đề/đầu/cuối không đổi). Mục cũ BỊ THAY THẾ bởi mục này: "CON SỐ 1.1", "4.1 ĐỌC LẠI SAU KHI ĐÃ GHI", "BÀI KỆ 6.1 đến 6.8", "4.1 KHÔNG CHÚ THÍCH TÊN BỐN THỨ" và quy ước xưng hô ở đoạn đầu (không còn đúng với bản hiện tại).

  LỖI NGHĨA THẬT ĐÃ SỬA. 1.1: bản cũ đọc sai số, nay đúng Pāli: bāvīsati = 22 phẩm (không phải "mỗi mục hai mươi bốn tiểu mục"), dvāsaṭṭhiadhikā dvesatā = 200 + 62 = 262 câu đã có (không phải 132), dvācattālīsā = 42 câu chưa có (không phải 242), cộng lại 262 + 42 = 304 khớp catūhi adhikā tisatapañhā (300 + 4); kaṇḍa = sáu phần. 2.1: caturāsītisatasahassa = 84 × 100.000 viết "tám mươi bốn trăm nghìn" (bản cũ bỏ mất "trăm"), udakapariyantaṁ = lấy nước làm giới hạn, chadhā = sáu cách (không phải "sáu nơi"), vijjullatā = chớp (không phải "ngọn lửa"), meghatthanita = tiếng sấm của mây (không phải "sóng biển va vào núi"), orodhagaṇā = các cung phi (không phải "đoàn tùy tùng"). 3.1: uddhaṭadāṭho bhujagindo = chúa rắn bị nhổ nanh (không phải "rắn lột da"), sumathitamānahadayo = lòng kiêu mạn bị nghiền nát, sunikkaṅkho = dứt hẳn nghi ngờ, nirālayo = không quyến luyến. 3.2: ṭhapetvā = trừ ra, khamatha mama accayaṁ = xin tha thứ lỗi của con, upāsakaṁ ... dhāretha = xin ghi nhận con là nam cư sĩ (bản cũ viết "bạn cư sĩ"), cách nói "đã quy y từ hôm nay cho đến trọn đời" dùng lại nguyên văn tiền lệ dn4:24.5 / dn10:2.37.10 / dn31:35.5. 4.1: chủ ngữ của kāretvā, niyyātetvā, paricari là nhà vua; vua dựng tu viện, giao cho Trưởng lão và hầu hạ Nāgasena cùng hàng trăm koṭi tỳ-kheo bằng bốn món vật dụng (bản cũ đảo thành "Trưởng lão cùng trăm nghìn tỳ-kheo hộ trì bốn thứ cho vua" và đọc koṭisata thành "trăm nghìn"); tena vuttaṁ = "vì thế đã có lời nói" (không gán lời cho nhà vua). 5.3: vimatiṁ hantvā = diệt trừ hoài nghi (bản cũ "đánh bại mê lầm"), "hiền triệt" là chữ vô nghĩa nay thành "hiền trí". 6.6: sampassaṁ hitamattano = nhìn thấy lợi ích cho chính mình, dùng lại cách dịch mn143:17.12 / mn143:19.13 (bản cũ "trau dồi đức hạnh, suy xét điều mình tự biết" là bịa). 6.7-6.8: nên tôn kính bậc có trí tuệ như tháp thờ. 7: Doṇi là tên vị Đại Trưởng lão cư ngụ ở thành Doṇi tại Laṅkā (bản cũ "thành giàu có / nơi ngự trú của người giàu có" là sai), và 7.8 không nói Nāgasena "giảng chú" Milinda mà là hai vế khen: Milinda đại trí, Nāgasena rất hiền trí. 8.2-8.4: tussitaṁ = cõi Tusita (không phải "nơi hài lòng"), Metteyyaṁ anāgate passe = nguyện thấy Metteyya trong thời vị lai, suṇeyyaṁ dhammamuttamaṁ = nghe pháp tối thượng (bản cũ "đường đi không bị chặn ngăn" là bịa). 9.1: niṭṭhito = kết thúc, theo dn14:3.33.7 và dn4:27.2.

  TIỀN LỆ ĐÃ ĐO (đếm trên toàn tầng bản dịch của dự án). Gọi Milinda: "vua Milinda" 75 khoá so với "Đại vương Milinda" 5 khoá trong nhóm mil, nên dùng "vua Milinda". Gọi Nāgasena: "thưa tôn giả Nāgasena" 320 so với "thưa đại đức Nāgasena" 74 trong nhóm mil, nên dùng "tôn giả". dhammasenāpati: "Tướng quân Chánh pháp" 15 so với "Tướng quân Pháp" 7 trên 26 khoá, chọn "Chánh pháp". yojana: "do-tuần" hoặc "do tuần" 145 khoá so với "yojana" 7 khoá, chọn "do-tuần". Tusita: "Tusita" 43 so với "Đâu Suất" 7, chọn "Tusita". Pāli trùng nguyên văn: Tasmā hi paṇḍito poso dùng lại "Vì thế, người trí" (mn143:17.11, mn143:19.12; sn1.48:3.1 dịch khác "Vậy nên người có trí", 1 trong 3). Cặp Pāli trùng nguyên văn TRONG CHÍNH bài: không có cặp nào, nên phép đo này chạy rỗng, không phải đạt.

  BLOCKER ĐÃ GỠ. (1) Blocker "Coverage tầng Anh đo được là 0 trên 28 khoá" phân loại (B)/(C): đã gỡ vì tiền đề cũ không còn đúng. Bài không có tầng Anh nào tại commit đã ghim nên coverage 0 là hệ quả của giới hạn upstream, và nay content/meta/reference-gaps.yaml đã có mục mil8 (5 khoá Pāli có nội dung, 5 khoá không có Anh, coverage 0); con số "28" trong blocker cũ sai (khoá kệ ngắn dưới 40 ký tự không tính vào mẫu số). Việc đọc Pāli tự đứng vững ở cả năm khoá có nội dung (1.1, 2.1, 3.1, 3.2, 4.1) đã làm đối kháng, không còn nghĩa chưa chắc ở các khoá văn xuôi. (2) Phần Việt hiện hành (Pháp Cú duy nhất) vẫn nằm trong blocker A; đó là giới hạn tham chiếu, không phải lỗi văn bản.

  BLOCKER GIỮ. Blocker đầu (không có bản Anh Sujato upstream cho bài này) giữ nguyên vì là sự thật về upstream; bài chỉ đối chiếu được với Pāli root và tiền lệ trong kho, nên triangulation giữ 6.5 (không bao giờ cao hơn 8.0 khi thiếu bản Anh độc lập).

  BẤT ĐỊNH CÒN LẠI (không phân xử được, ghi ở đây chứ không đưa vào thân kinh). (a) 6.2 sati tattha anūnakā: đọc sati là "niệm" (danh từ nữ, hợp với anūnakā); không loại hẳn cách đọc khác. (b) 6.3-6.4 pūjā visesassādhāro, aggo seṭṭho anuttaro: giống của aggo/seṭṭho/anuttaro (nam) hợp với ādhāro nên dịch "chỗ nương của sự thù thắng", nhưng chủ ngữ của vế sau có thể bị hiểu khác. (c) 2.1 caturāsītisatasahassayojanabahalā: dịch đúng nghĩa đen "tám mươi bốn trăm nghìn do-tuần"; không có tầng Anh đã ghim để đối chiếu và không dám đổi thành 84.000 chỉ vì quen thuộc. (d) 7.1-7.2 Doṇinagara và Doṇināmena: hiểu Doṇi vừa là tên thành vừa là tên vị Đại Trưởng lão theo cú pháp; không thể xác nhận thêm. (e) 7.3-7.4: suṭṭhapitaṁ dịch "ghi lập chu đáo"; chủ thể của động từ này (chính bản viết hay nội dung hỏi đáp) mơ hồ, bản dịch giữ nguyên độ mơ hồ ấy.

  Kiểm: 32/32 khoá khớp tập khoá Pāli, thứ tự khớp, không Pāli lọt vào bản Việt, không có dấu lược nào. technical_integrity vẫn 9.6; npm run validate, npm test, npm run check, npm run build do bên điều phối chạy, nên không tuyên bố technical gate pass ở đây.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 7 khoá bất đồng nghĩa → sửa 1 (`4.1`: “cùng hàng trăm koṭi tỳ-kheo” → “cùng một trăm koṭi tỳ-kheo”, vì `koṭisatehi bhikkhūhi` là một trăm koṭi, và cùng công thức `koṭisatā arahanto` ở mil2:12.1, 13.1, 14.1, 38.1, 40.1, 57.1, 58.1 đều dịch “một trăm koṭi”; “hàng trăm” làm số thành nhiều trăm koṭi), giữ 3 (`5.2`: bản nguyên bài hiểu `katā` thành việc thuyết giảng, khác `katā` của Pāli ghim; `7.7`: bản nguyên bài hiểu `hi` là “bởi vì”, bản dự án để `hi` nhấn mạnh, cả hai đều hợp Pāli; `6.4`: bản nguyên bài gán “bậc tối cao, vô thượng” cho người có trí tuệ, còn Pāli ghim `Pūjā visesassādhāro` viết tách `pūjā`, nên giữ cách tách từ của Pāli), bất định 3 (`6.1` `khandhe`: bản nguyên bài hiểu là “vai”, bản dự án là “uẩn”, Pāli ghim không phân xử được; `6.3` `pūjā visesassādhāro`: sự tôn kính là chỗ nương của sự thù thắng, hay người ấy là chỗ nhận phần cúng dường đặc biệt; `8.2` `gacchāmi`: Pāli là hiện tại, bản nguyên bài đọc như lời nguyện). Số 262 + 42 = 304 và 84 × 100.000 khớp cả hai bản. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Ngoài phạm vi: bv9:5.3 và bv19:4.3 (`Koṭisatāni abhisamiṁsu`) đang dịch “Hàng trăm koṭi”, cần xem lại với cùng tiền lệ “một trăm koṭi”. Review đối kháng đủ 32 khoá: không tìm thêm lỗi cần sửa.
