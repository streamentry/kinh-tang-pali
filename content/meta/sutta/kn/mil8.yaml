notes: |-
  ĐỌC HẾT BÀI TRƯỚC — MIL8 LÀ PHẦN KẾT, KHÔNG PHẢI HỘI THOẠI. Lát này giao cho tôi mil8 và trong cùng lát có mil3.2.1, mil5.4.9, mil7.5.6. Tôi đã đọc hết p17.txt: mil8 ở commit đã ghim là Nigamana, tức lời kết của toàn bộ Milindapañha (32 khoá: số liệu sách, cảnh chấn đất, lời tán dương của vua, bốn bài kệ ca ngợi trí tuệ, bài kệ ghi công việc viết sách ở Laṅkā, và lời nguyện cuối). Nó KHÔNG có câu hỏi đáp nào giữa vua và Trưởng lão, nên chỉ có hai chỗ xưng hô với tôn giả, và tôi dùng Thưa Đại đức Nāgasena theo mil5.4.10 và mil5.4.1 như người điều phòng chỉ định. Vua được gọi là Đại vương Milinda.

  CON SỐ 1.1. Pāli nói sáu mục, mỗi mục hai mươi bốn tiểu mục, đã có hơn 132 câu, chưa có 242 câu, hợp lại thành ba trăm linh bốn câu; tôi dịch đúng các số này, kể cả chữ hơn, vì Pāli có dvāsaṭṭhiadhikā và catūhi adhikā.

  4.1 ĐỌC LẠI SAU KHI ĐÃ GHI. Bản đầu của tôi đọc catūhi paccayehi thành vế của Trưởng lão, nhưng đó là sai: bốn thứ ấy là phép hộ trì mà Trưởng lão Nāgasena cùng trăm nghìn vị tỳ-kheo dâng cho vua; tôi đã sửa thành đã hộ trì bốn thứ để phụng sự Ngài.

  BÀI KỆ 6.1 đến 6.8. Tôi dịch theo mạch nghĩa của cả tứ vế: trí tuệ đứng ở yếu tố nào thì không bị kém ở yếu tố ấy, sự tôn trọng dành cho nó là thượng đẳng, vì thế người trí sau khi suy xét điều mình tự biết nên tôn trọng bậc có trí tuệ như lòng kính trọng dành cho tháp. 6.5 Tasmā hi paṇḍito poso trùng với mn143:17.11 và sn1.48:3.1 nên tôi dùng lại nguyên văn Vì thế, người trí.

  4.1 KHÔNG CHÚ THÍCH TÊN BỐN THỨ. Pāli chỉ ghi catūhi paccayehi, tức bốn thứ hộ trì, và bài này không có chỗ nào để giảng tên; tôi để nguyên văn như Pāli thay vì chèn y phục, thức ăn khất thực, chỗ ở, thuốc men vào thân kinh.

  TÊN ĐỊA DANH CÓ DẤU PĀLI. Laṅkā (7.1), Sāma và Mahācunda không có trong bài này, còn Sāriputta, Ānanda, Mahākassapa, Laṅkā thì có; cả bảy tên ấy tôi khai vào bộ nhớ _hvi._GIỮ trước khi ghi vì dạng Việt không trùng dạng Pāli ở dạng gốc.

  DẤU LƯỢC. Bài không có dấu lược nào; bản Việt cũng không có.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.

