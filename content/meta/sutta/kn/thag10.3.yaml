notes: |-
  Đã đọc HẾT `vc/p75.txt` (cả 6 bài, 282 khoá) trước khi viết chữ nào, rồi mới dịch từng
  bài và ghi từng bài một.

  MỆNH ĐỀ ĐO LẠI (không tin tên thư mục):
  · `:0.1` Pāli `Theragāthā 10.3` ⇒ giữ **Theragāthā 10.3**. Đo trên 231 tệp `thag*` đã có:
    12 tệp Pāli chỉ có `Theragāthā` (không số) và 219 tệp có `Theragāthā <số>`; bài này Pāli CÓ
    số nên phải giữ số — cùng cách `thag10.2:0.1` = *Theragāthā 10.2*.
  · `:0.2` `Dasakanipāta` ⇒ **Bộ Mười Bài Kinh**. Trong CHÍNH `thag` có đúng 4 bài đã dùng
    Pāli này (`thag10.2`, `.4`, `.5`, `.6`) và cả 4 đều là *Bộ Mười Bài Kinh*; 5 lần *Bộ Mười
    Bài Kệ* đều thuộc `ja9` — tÁC PHẨM KHÁC, không phải tiền lệ cho `Theragāthā`.
  · `:0.3` `Paṭhamavagga` ⇒ **Phẩm Thứ Nhất** (99 lần trên tầng, gồm `iti1:0.3`, `iti10:0.3`).
  · `:0.4` `Mahākappinattheragāthā` ⇒ **Kinh Kệ Của Trưởng Lão Mahākappina** — đo 227/227 bài
    `thag` đã có đều theo hình `Kinh Kệ Của Trưởng Lão <tên>`, tên vị giữ Pāli, bỏ đuôi
    `theragāthā`. Nguồn: `content/meta/sutta/kn/thag10.2.yaml` notes.

  DÒNG BÌA `:10.5` `… Mahākappino thero …. ` ⇒ `… Trưởng lão Mahākappina ….` — y nguyên văn
  `thag10.2:10.5`. Hai dấu lược `…` giữ nguyên, không gộp, không thêm.

  DÙNG LẠI Y NGUYÊN VĂN (đếm được trên tầng, không phải nhớ):
  · `4.1`–`4.4` trùng nguyên văn `thag8.1:6.1`–`6.4` ⇒ lấy y nguyên văn cả bốn khoá.
  · `2.5` `Somaṁ lokaṁ pabhāseti,` ⇒ `thì soi sáng thế gian này,` — y nguyên văn `dhp172:3` và
    `dhp173:3` (3 lần). Chấp nhận chữ *thì* dù Pāli không có trạng ngữ thời gian, vì luật
    *trùng thì khớp* và 2.6 phải khớp `như trăng thoát khỏi mây.` (6 lần, `dhp172:4`).
  · `2.6` ⇒ `như trăng thoát khỏi mây.` — `dhp172:4`, `dhp173:4` (6 lần).
  · `3.4` ⇒ `đều làm sáng mọi phương trời.` — `vv9:3.4`, `vv9:9.4` (2 lần).
  · `7.4` ⇒ `vì đó là bản chất của loài hữu tình.` — `thig6.1:2.4` (Therīgāthā, bài chị em cùng
    quyển). Biến thể `chúng sinh vốn có bản chất như vậy.` chỉ có 1 lần (`snp3.8:2.4`).

  BẤT ĐỊNH ĐÃ PHÂN XỬ, GHI LẠI:
  · `1.1` `Anāgataṁ yo paṭikacca passati` — `Anāgataṁ` là tân ngữ của `yo`, nên câu là *kẻ nào
    xét xét kẻ sắp tới*; Sujato đọc theo nghĩa thời gian (*if you're prepared for the future*)
    và lệch một câu so với Pāli (Sujato đưa cả tứ câu vào `:1.1`–`:1.4` theo kiểu *thơ tự do*).
    Tôi theo Pāli: `Kẻ nào từ nay xét xét, thấy`. **Người biên tập có thể chọn khác.**
  · `1.2` `taṁ dvayaṁ` = *cả hai bên*; `Randhaṁ` (`:1.4`) = *lỗi hổng*, dịch `lỗi hổng` chứ
    không dịch `khe hở` để giữ nghĩa tìm lỗi của kẻ soi xét.
  · `5.2` `kitti-siloka` = *danh tiếng và tiếng khen* (`kitti` tiếng khen, `siloka` tiếng làm
    gợi nhớ/tiếng đồn). Sujato dịc `grows fame and reputation`. 0 tiền lệ cho cụm này.
  · `6.1` `Nāyaṁ ajjatano dhammo` = pháp này không phải chỉ dạy cho hôm nay — chốt vì `ajjatano`
    là *hôm nay*, và câu kế tiếp (`6.2` `nacchero napi abbhuto`) là lý do.
  · `8.2` `paraporisānaṁ` = *được người đời tìm kiếm / khởi viện*; Sujato dịch `celebrity` —
    hơi lệch, tôi theo nghĩa chữ. `8.3` `na lokyaṁ` = *không có lẫy lựa* (khen ngợi, nổi tiếng).

  DẤU LƯỢC: bài này **không có** `…pe…`; dấu lược chỉ ở dòng bìa `:10.5` và khớp đúng hai `…`
  như Pāli (chốt `_hvi.lược()` bắt từng khoá).

  COVERAGE: `thag` **có** bản Anh đã ghim. Nhưng không khoá Pāli nào của bài đạt
  `substantivePaliMinChars: 40` (kệ `Theragāthā` chia pāda 4 dòng, mỗi dòng 15–35 ký tự), nên
  **mẫu số của phép đo chính thức bằng không** và `reference-gaps.yaml` xếp loại *no substantive
  segment*, không chặn. Độ phủ thô trên **mọi** khoá: Sujato có tiếng ở 46/47, trống đúng khoá
  `:10.5` (dòng bìa) ⇒ **97,9%**. Con số này để người biên tập tự phán, không phải coverage của
  cổng. Tầng `vietnamese-current` không có cho bài này (bilara tại commit đã ghim chỉ có Pháp Cú).

  `triangulation` đặt 8,6: hai tầng tham khảo là Pāli root + Sujato, và Sujato ở `thag` **lệch
  căn hàng câu** (đã ghi ở `content/meta/sutta/kn/thag10.2.yaml` notes mục (1)) nên không phải
  bản đọc English độc lập cho từng câu.

  `technical_integrity` đặt 9.6: lát agent không chạy `npm run validate|test|check|build` (bị
  cấm), nên cổng kỹ thuật do coordinator chạy. Tự kiểm bằng harness `_hvi.kiểm()`: NFC, không
  Pāli lọt, không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài —
  0 lỗi.
  ĐỐI CHIẾU CHÉO BẰNG SỐ: trong lát này có **77** khoá mà Pāli của tôi trùng nguyên văn một khoá
  đã có ở tầng trước; **70/77** khớp BYTE với bản Việt đã có. Bảy khoá còn lại là các chỗ cố ý
  khác, đã liệt kê trong `notes` của chính bài ấy: `thag9.1:0.2` · `thag9.1:9.6` ·
  `sn16.10:5.1` · `sn16.10:7.1` · `sn24.96:1.4` · `sn24.96:5.1` · `sn24.96:5.3`. Riêng bài này
  (`thag10.3`) lệch **0** khoá. Ngoài ra **40/40** cặp Pāli trùng nhau *trong chính lát* đã cho bản
  Việt trùng nhau byte — không một câu nào tự mâu thuẫn với câu kế bên.
