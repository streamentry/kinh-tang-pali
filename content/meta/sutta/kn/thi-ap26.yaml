  :25.1 Tôi nghe như vầy là lời người kể, không phải ngôi của vị ni.

  THUẬT NGỮ — kèm số đếm:
  - Padumuttaro nāma jino → Đức Chiến Thắng tên Padumuttara (13 khoá cùng dạng, 1 khoá
    Bậc Chiến Thắng tên là); nāyako → bậc Dẫn Đạo (28 khoá).
  - mahāvīro → Đại Anh Hùng (25 trên 31 khoá Pāli trùng); mahāmuni → Đại Mâu-ni (37 so
    với Đại Muni 8, tổng 56 khoá có Pāli); vināyaka → Điều Ngự (5 so với Điều Phục 1,
    Dẫn Dắt 1, đạo sư 1, tổng 16); nātho → bậc Hộ Chủ (3 so với Hộ Trì 2, tổng 11).
  - devadeva → bậc Thiên Trung Thiên (tha-ap45 và tha-ap212: Thiên Trung Thiên; tha-ap350:
    bậc trời trong trời; chọn dạng có tiền lệ hai khoá).
  - tejodhātu (18.3) → hỏa giới: toàn tầng có 108 khoá chứa tejodhātu, hỏa giới 21 khoá,
    hỏa đại 38 khoá (chủ yếu ở ngữ cảnh bốn đại), giới lửa ở ud8.9; chọn hỏa giới vì
    ngữ cảnh là nhập định/dùng thần lực (sn6.5 dịch nhập hỏa giới). Người biên tập có thể
    chuẩn hoá một lượt.
  - dāyādā (6.1) → người kế thừa giáo pháp của Ngài (theo tha-ap19, 54, 61, 396 cùng
    Pāli Tassa dhammesu dāyādo); orasā dhammanimmitā (6.2) → là con ruột, do pháp tạo ra
    (theo iti100:2.2 là con ruột … do pháp tạo).
  - ārādhito (21.1) → được làm hài lòng (tha-ap391:9.1 và tha-ap408: cả 2 khoá).
  - kusīto hīnavīriyo (20.2) → biếng nhác, thiếu tinh tấn (iti34:3.2 và nhiều khoá iti,
    an4.11; mil7.5.7 dịch lười biếng, kém cỏi tinh tấn — không theo vì cùng Pāli, ít khoá hơn).
  - āraddhavīriya → khởi sự tinh tấn (tha-ap391: những vị khởi sự tinh tấn; an1.241 dịch
    đã khơi dậy tinh tấn — cùng nghĩa, chọn dạng ngắn trong cùng bộ apadāna).
  - sāsane (12.4) → giáo pháp (121 so với lời dạy 42 khoá có Pāli).
  - Không có tiền lệ, dịch theo nghĩa Pāli: sukhitā → sống an vui; pūjitā → được tôn
    kính; yobbanappattā → đã đến tuổi thanh xuân; amittā → kẻ thù; cullī → bếp lò;
    kumbhī → cái nồi; bhikkhunupassaya → chỗ trú ngụ của các tỳ-kheo-ni (vv68 dịch
    upassaya là chỗ trú ngụ); ovāda → lời giáo giới.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - 3.1–3.2 Āraddhavīriyānaggaṁ … vaṇṇesi bhikkhuniṁ jino: aggaṁ là đối cách, hợp với
    bhikkhuniṁ; bản Việt dùng thể bị động (vị tỳ-kheo-ni được Đấng Chiến Thắng tán thán) để
    tránh hiểu Đấng Chiến Thắng là bậc đệ nhất. Ở 21.3 cùng Pāli nhưng aggaṁ hợp với maṁ
    (21.4 mamāha: mama āha hay maṁ āha, đều có thể); bản Việt giữ cùng một câu ở hai chỗ.
  - 3.4 kāraṁ katvāna satthuno: kāra là việc làm biểu thị tôn kính hoặc phụng sự; dịch
    sau khi tỏ lòng tôn kính, không dịch cúng dường vì Pāli không nêu vật dâng.
  - 4.2 patthayiṁ và 4.4 sijjhataṁ paṇidhī tava: đạt được ṭhāna là địa vị đệ nhất mà Đức
    Phật vừa tán thán, nên dịch ước nguyện địa vị ấy; nháy đơn mở ở 4.4 và đóng ở 6.4
    (sāvikā’.) theo Pāli, chạy qua ranh giới khoá.
  - 5.1 Satasahassito kappe: ablative cùng hessati/bhavissati ở 5.4/6.4 là thì tương lai, nên
    dịch Vào một trăm ngàn kiếp nữa. Đo ở đúng stanza (khoá kế tiếp có okkākakula): 2 khoá
    kiếp nữa so với 1 khoá đại kiếp trước (tha-ap); tổng 40 khoá Pāli trùng chủ yếu là
    kiếp trước ở ngữ cảnh quá khứ khác. Chữ đại không có trong Pāli (kappa, không phải
    mahākappa), không dùng. Cần xem lại cả stanza ở các tha-ap khác.
  - 6.1–6.2: dāyādā và orasā ở giống cái; chủ ngữ không nêu (người — tức Soṇā, nêu ở
    6.3); bản Việt giữ Người, không thêm vị ni.
  - 7.2/7.4 jinaṁ … vināyakaṁ: hai đối cách đồng vị, động từ ở 7.3 (paricariṁ); bản Việt
    giữ thứ tự, động từ nằm giữa hai đối cách.
  - 10.3–10.4 puttāni (trung tính): có thể chỉ con nói chung; bản Việt dùng người con, không
    chọn con trai; surūpāni visesato → đặc biệt có dung mạo đẹp đẽ.
  - 11.2 jananettamanoharā: hợp từ; đọc là jana + netta + mano + harā (làm say đắm mắt và
    lòng người); cách đọc khác (janana, người sinh ra chúng) khó hợp harā hơn. Cần xem lại.
  - 12.1–12.3: akāmāya (khi ta không bằng lòng) và dasaputtapurakkhato (đồng vị với bhattā,
    người chồng đi cùng mười người con); purakkhata có thể là đi trước, được vây quanh hoặc
    được tôn trọng; dịch có mười người con đi cùng, giữ nghĩa trung tính.
  - 13.2 jīvitenālamatthu me: thành ngữ alaṁ atthu (hãy thôi, đủ rồi); dịch Mạng sống này,
    thế là đủ với ta; 13.3 cattāya patiputtehi (bị chồng và các con bỏ rơi) và
    vuḍḍhāya varākiyā (già nua và khốn khổ) là các tính từ giống cái hợp với me; bản Việt
    giữ chúng như những mệnh đề rời để khớp ranh giới khoá.
  - 14.2 sampatto yattha me pati: chỉ nói chồng đã đến nơi nào đó, không nói đã chết hay
    đã chứng; dịch nơi chồng ta đã đến, không thêm nghĩa.
  - 15.1–15.4: maṁ … ekaṁ (chỉ một mình ta) và vihāya gacchumovādaṁ (bỏ lại mà đi nghe giáo
    giới); iti đóng lời bảo ở 15.4; bản Việt thêm động từ họ đã nói thế để khớp nháy đơn
    của Pāli, vì iti hàm ý lời nói.
  - 16.2–16.3: kumbhiyā (cái nồi) và culle (bếp lò): Pāli không nêu rõ nồi bằng chất liệu gì;
    āsīnā là giống cái, chủ ngữ ngầm là ta, nên 16.1–16.3 không thêm ta; 16.4 mới có
    samādahiṁ (ta đã định tâm).
  - 18.3 tejodhātumadhiṭṭhāya: adhiṭṭhāya (chú nguyện, quyết định) hỏa giới, không nói chi
    tiết thần thông; không thêm giải thích. 18.2 uṇhodakamapucchisuṁ: hỏi về nước nóng (có
    thể là hỏi xin); giữ nghĩa hẹp hơn.
  - 19.1–19.2 vimhitā tā jinavaraṁ … etamatthamasāvayuṁ: asāvayuṁ (đã làm cho nghe, kể lại);
    bản Việt dùng đã kể lại cho bậc Chiến Thắng tối thượng sự việc này.
  - 20.1–20.4: bài kệ trùng Dhp 112 (đã có bản Việt dự án ở dhp100-115: Dù sống trăm năm …
    nếu tinh tấn hết sức mình); ở đây giữ vīriyamārabhato daḷhaṁ là nếu kiên cố khởi sự tinh
    tấn để thống nhất khởi sự (ārabhati) với āraddhavīriya ở 3.1/21.3; không chép bản Dhp
    vì ngữ cảnh trích dẫn trong ký sự này khác.
  - 21.4 mamāha: xem trên.
  - Bản tra cứu toàn văn nguyên bài trên SuttaCentral (giấy phép NOASSERTION; không phải
    tầng store, không căn lề theo khoá) nếu có cho uid này thì không được chép vào bản
    dịch và không tính vào coverage hay triangulation; bản dịch này chỉ dựa Pāli root
    cùng các tiền lệ trong chính dự án.

