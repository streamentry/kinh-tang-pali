  TRÙNG NGUYÊN VĂN VỚI pv44 — ĐÃ ĐO ĐƯỢC. pv43 và pv44 là cùng một truyện, bản nam và bản nữ. Trong hai bài
  có **25 cặp khoá Pāli trùng nguyên văn** (1.1, 1.4, 2.3, 3.1, 3.2, 3.3, 3.4, 4.1, 4.2, 4.3, 4.4, 5.1, 5.2,
  5.3, 6.1, 6.2, 6.3, 6.4, 7.1, 7.2, 7.3, 7.4, 8.1, 8.2, 8.3, 8.4). Mọi cặp đều mang **bản Việt giống hệt
  nhau**; chỗ nào Pāli khác (giống/giống cái) thì bản Việt mới khác. Kiểm lại bằng script sau khi sửa: **0/47
  cặp trùng bị dịch khác**. Lý do: nếu hai bài cùng truyện mà câu Việt lệch nhau thì người đọc tưởng khác
  giáo nghĩa — đúng cái bẫy `sn11.24` đã được ghi trong `AGENTS.md`.

  THUẬT NGỮ THEO TIỀN LỆ ĐẾM ĐƯỢC. `Petavatthu` giữ nguyên Pāli (11 nơi, **1 cách duy nhất**: pv2, pv3, pv4,
  pv41, pv46–pv50). `Mahāvagga` → “Đại Phẩm” (19 nơi, 1 cách). `…petavatthu` → “Chuyện Ngạ Quỷ …” theo pv2,
  pv3, pv4, pv9, pv41, pv46. `bhadante` → “bạch ngài” (pv9:3.1 đã dùng đúng vế này). `petā` → “ngạ quỷ / người đã
  chết” (pv46:1.2 “ngươi là ngạ quỷ”; pv4:3.3 “người đã khuất”). `kammavipāka` → “quả báo của nghiệp” (pv46).
  `kadariyo paribhāsako` → “tàn nhẫn và mắng nhiếc người khác” (an4.53, an4.54, an7.57 đã có “kadariyo
  paribhāsako”; chọn cách ghép `paribhāsa` = mắng nhiếc, `kādariya` = tàn nhẫn). `issukī kulamaccharī` →
  “đố kỵ ghen tị, xan tham keo kiệt”. `paricārako` → “kẻ hầu hạ” (tiền lệ `paricāraka` = hầu cận).

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `Gūthakhādakapetavatthu` — `gūthakhādaka` là ma **ăn phân**; dịch “Ngạ Quỷ Ăn Dơ”. Cùng cấu trúc với pv29
  (`Bhusāpetavatthu` → “Chuyện Ngạ Quỷ Trấu Thóc”), nên giữ hình tiền lệ “Chuyện Ngạ Quỷ …”.
  `hādeti` (8.1, 8.3) — `hadantañño` / `hadāmi`, cùng gốc với `gūtha` trong câu; ở đây là động từ **thải ra**
  (nhốt ra ngoài), không phải “nôn”. Dịch giữ “thứ ngài thải ra / còn thứ con thải ra” và để ý nghĩa khiếu
  cười của câu kệ hiện ra tự nhiên, không thêm chú giải vào lời kinh.
  `saddahase tuvaṃ` (1.4) — `saddahati` = tin cậy, trông cậy; `tuvaṃ` = ngươi. Dịch “bạch ngài còn mong đợi
  điều gì nữa ấy”, giữ dấu hỏi vì nghĩa là chất vấn chứ không phải hỏi thật sự. Đây là chỗ khó nhất của bài và
  không có tầng Anh để phân xử — đã ghi ở đây.
  `duggato yamalokiko` (2.2) — `duggati` = sinh về cõi khổ xa xôi (tiền lệ tha-ap: “khổ xứ”, “đọa xứ”); chọn
  “cõi khổ xa xôi”. `Yama` giữ Pāli.
  `Amitto mittavaṇṇena` (6.1) — `mittavaṇṇa` = giống bạn về **vẻ ngoài**; dịch “không phải bạn theo vẻ ngoài”
  rồi `yo te āsi kulūpako` mới là quan hệ huyết thống.
  `sīse tiṭṭhāmi matthake` (7.2) — `sīse` = làm nô lệ, `matthake` = ngay trước hiên; dịch “ở lại ngay trước
  hiên nhà người ấy làm nô lệ”, giữ đủ hai ý.

  DẤU LƯỢC — bài này **không có** `…pe…`.

  Ngoặc kép: mỗi vòng thoại là một cặp mở–đóng riêng (1.1/1.4, 2.1/2.4, 3.1/3.4, 4.1/5.4, 6.1/6.4, 7.1/8.4),
  và 8.1–8.4 **không** có nháy kép riêng vì nằm trong nháy kép của vòng 7. Đúng y như Pāli. Tự đếm lại: cân.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  Lượt cải thiện 2026-10-11 (kiểm toán đối kháng, accuracy fix). LƯU Ý: các khẳng định về từ vựng và về bản trùng với pv44 ở phần ghi chú phía trên đã bị lượt này thay thế; những chỗ sau đây là chuẩn.
  Đã đổi 23/36 khoá (1.1, 1.2, 1.3, 1.4, 2.1, 2.2, 3.4, 4.1–4.4, 5.1, 5.2, 6.1–6.3, 7.1–7.4, 8.1, 8.2, 8.4). Lỗi nghĩa thật ở 15 khoá: 1.2, 1.3, 1.4, 2.2, 3.4, 4.1, 4.4, 5.2, 6.1, 6.2, 7.1, 7.2, 7.3, 7.4, 8.1. Các khoá còn lại chỉ sửa câu chữ cho khớp mạch hoặc thuật ngữ.
  Loại lỗi: (a) người được hỏi/người nói — 1.2, 1.4, 3.4 gọi ngạ quỷ là “bạch ngài” trong khi lời hỏi là của vị tỳ-kheo (bhadante ở 2.1 là lời đáp của ngạ quỷ), 8.4 gọi tỳ-kheo trú xứ là “ngài ấy”; (b) danh từ riêng bịa — 4.1 `Ahu` là động từ “đã có” (aorist của hoti), không phải tên người; (c) đảo vai — 7.4 `mameva paricārako` là “chính là người hầu cận của con” (kẻ kia hầu con), bản cũ đảo thành con là kẻ hầu; 8.1 `yaṁ bhadante hadantaññe` = “thứ gì những người khác thải ra” (`hadantaññe` = hadanti + aññe), bản cũ hiểu thành “thứ ngài thải ra”; (d) từ vựng — `sīse tiṭṭhāmi matthake` = đứng trên đầu, trên đỉnh đầu (bản cũ: “làm nô lệ”, “ngay trước hiên”), `kulūpako` = vị hay lui tới nhà các gia đình (bản cũ: “người cùng họ hàng”), `amitto mittavaṇṇena` = kẻ thù mang dáng bạn bè (đối chiếu dn31:15–19 “kẻ thù đội lốt bạn”, bản cũ: “không phải bạn theo vẻ ngoài”), `kadariyo` = bủn xỉn (an4.53, an4.54, an7.57; bản cũ: “tàn nhẫn”), `duggato` = đã rơi vào cảnh khổ (pv13, pv19, pv27; bản cũ: “cõi khổ xa xôi”, hiểu sai dur-), 5.2 `bhikkhavo paribhāsisaṁ` = mắng nhiếc các tỳ-kheo (bản cũ đánh rơi tân ngữ và biến thành “trở thành kẻ mắng nhiếc”); (e) thức/ngữ khí — 1.3 `nissaṁsayaṁ pāpakammanto` là lời suy đoán “chắc chắn ngươi là kẻ làm ác”, không phải “từng làm không hề do dự”; 7.3 bản cũ thêm “đã chịu quả báo khổ đau” không có trong Pāli (`so ca paravisayaṁ patto`).
  Điểm đổi: source_provenance 9.5→9.3 (ghi chú cũ nêu các nghĩa từ sai, như `sīse`=nô lệ, `kādariya`=tàn nhẫn); semantic_fidelity 9.0→8.7; terminology 9.0→8.8; ambiguity_integrity 8.6→8.5 (bất định còn lại liệt kê dưới đây); các tiêu chí khác giữ nguyên. final_score 9.05→8.97: bài được sửa tốt nhưng chưa có tầng tham khảo độc lập, nên không nâng lại điểm.
  Bất định còn lại. (1) 1.4 `saddahase`: nghĩa từ vựng là “tin”, không khớp mạch; dòng song song pv51:1.4 viết `saddāyase` (kêu la), nên dịch “vì sao ngươi còn kêu la?”; chưa có chú giải để xác nhận. (2) 7.3 `paravisayaṁ patto` (“đến cõi của kẻ khác”) — nhiều khả năng là cõi ngạ quỷ nhưng không thêm vào lời kinh. (3) 4.1 `āvāsiko` và 4.3 `ajjhāsito` — nghĩa “vị tỳ-kheo thường trú” và “đã ở trong nhà” là cách đọc chắc nhất nhưng không có đối chiếu. (4) 7.1–7.2 `sīse tiṭṭhāmi matthake` — đọc nghĩa đen; chưa có chú giải để biết có hàm ý chủ–tớ hay chỉ là vị trí. (5) Tiêu đề “Ăn Dơ” (gūtha = phân) giữ lại vì phẩm tóm lược pv51:13.3 và pv44 dùng cùng tên.
  Thuật ngữ theo tiền lệ: `petomhi` → “ngạ quỷ” (pv13, pv19) thay cho “ma” (pv6, pv7, pv31, pv51 dùng “ma”: 4 so với 2 nơi dùng “ngạ quỷ”; chọn “ngạ quỷ” cho khớp tiêu đề bài). `kulamaccharī` → “keo kiệt về các gia đình” (an5.224, dn33). `paricārako` → “người hầu cận” (ja455, ja540).
  Không đổi: 3.1, 3.2 (khớp pv51:4.1–4.2 nguyên văn), 2.4, 5.4 (“thế giới của người đã chết”, tiền lệ toàn tầng), 6.4.
  Hệ quả với bài song song: pv44 (bản nữ) có đúng các lỗi trên ở các khoá trùng Pāli; pv43 không còn trùng bản Việt với pv44 cho đến khi pv44 được sửa tương tự. Lỗi `kiṁ nu saddāyase` / “người từng làm điều ác không hề do dự” cũng có ở pv51:1.3–1.4; `duggato` → “cõi khổ xa xôi” ở pv6, pv7, pv31, pv44, pv45, pv51.
  Kỹ thuật: `technical_integrity` vẫn 9.6; `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  **Sửa lan 2026-10-13** (đối chiếu pv44 — cùng truyện, bản nữ — và đếm tiền lệ). (1) `pv43:0.3`, `pv43:9.1` — *Ăn Dơ* / *ăn dơ* → *Ăn Phân* / *ăn phân* (`gūtha` = phân; pv44:0.3 *Ăn Phân*, pv51:13.3 *ăn phân*, và chính pv43:1.1 *hố phân*); `translationTitle` đổi theo. (2) `pv43:4.2` — *đố kỵ, keo kiệt về các gia đình;* → *ganh tị, bỏn xẻn về các gia đình;* (`issukī kulamaccharī`; Pāli trùng pv44:4.2, bản Việt nay giống nhau). (3) `pv43:2.4`, `pv43:5.4` — *đi sang thế giới của người đã chết* → *đi đến cõi ngạ quỷ* (`petalokaṁ ito gato`; trước khi sửa, trong `pv` có 27 khoá cùng cụm Pāli này: 21 khoá dùng *cõi ngạ quỷ*, 6 khoá dùng *thế giới của người đã chết* (2 ở chính pv43, 4 ở pv13 và pv27); pv44:2.4/5.4 đã đổi sang *cõi ngạ quỷ*); 5.4 sửa cùng 2.4 vì Pāli giống hệt. (4) `pv43:1.4` — *vì sao ngươi còn kêu la?* → *ngươi tin vào điều gì vậy?* (Pāli ghim của pv43 đọc `saddahase`, không phải `saddāyase` như pv51:1.4; cùng Pāli với pv44:1.4 nên Việt phải giống nhau). Bất định `saddahase` giữ nguyên như đã ghi ở pv44: câu có thể là lời trách hơn là câu hỏi về niềm tin, nhưng Pāli root là `saddahase` nên không dịch theo dạng khác. Phần ghi chú cũ ở trên về “kêu la” và “Ăn Dơ” bị mục này thay thế.
