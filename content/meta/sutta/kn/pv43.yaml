  TRÙNG NGUYÊN VĂN VỚI pv44 — ĐÃ ĐO ĐƯỢC. pv43 và pv44 là cùng một truyện, bản nam và bản nữ. Trong hai bài
  có **25 cặp khoá Pāli trùng nguyên văn** (1.1, 1.4, 2.3, 3.1, 3.2, 3.3, 3.4, 4.1, 4.2, 4.3, 4.4, 5.1, 5.2,
  5.3, 6.1, 6.2, 6.3, 6.4, 7.1, 7.2, 7.3, 7.4, 8.1, 8.2, 8.3, 8.4). Mọi cặp đều mang **bản Việt giống hệt
  nhau**; chỗ nào Pāli khác (giống/giống cái) thì bản Việt mới khác. Kiểm lại bằng script sau khi sửa: **0/47
  cặp trùng bị dịch khác**. Lý do: nếu hai bài cùng truyện mà câu Việt lệch nhau thì người đọc tưởng khác
  giáo nghĩa — đúng cái bẫy `sn11.24` đã được ghi trong `AGENTS.md`.

  THUẬT NGỮ THEO TIỀN LỆ ĐẾM ĐƯỢC. `Petavatthu` giữ nguyên Pāli (11 nơi, **1 cách duy nhất**: pv2, pv3, pv4,
  pv41, pv46–pv50). `Mahāvagga` → “Đại Phẩm” (19 nơi, 1 cách). `…petavatthu` → “Chuyện Ngạ Quỷ …” theo pv2,
  pv3, pv4, pv9, pv41, pv46. `bhadante` → “bạch ngài” (pv9:3.1 đã dùng đúng vế này). `petā` → “ngạ quỷ / người đã
  chết” (pv46:1.2 “ngươi là ngạ quỷ”; pv4:3.3 “người đã khuất”). `kammavipāka` → “quả báo của nghiệp” (pv46).
  `kadariyo paribhāsako` → “tàn nhẫn và mắng nhiếc người khác” (an4.53, an4.54, an7.57 đã có “kadariyo
  paribhāsako”; chọn cách ghép `paribhāsa` = mắng nhiếc, `kādariya` = tàn nhẫn). `issukī kulamaccharī` →
  “đố kỵ ghen tị, xan tham keo kiệt”. `paricārako` → “kẻ hầu hạ” (tiền lệ `paricāraka` = hầu cận).

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `Gūthakhādakapetavatthu` — `gūthakhādaka` là ma **ăn phân**; dịch “Ngạ Quỷ Ăn Dơ”. Cùng cấu trúc với pv29
  (`Bhusāpetavatthu` → “Chuyện Ngạ Quỷ Trấu Thóc”), nên giữ hình tiền lệ “Chuyện Ngạ Quỷ …”.
  `hādeti` (8.1, 8.3) — `hadantañño` / `hadāmi`, cùng gốc với `gūtha` trong câu; ở đây là động từ **thải ra**
  (nhốt ra ngoài), không phải “nôn”. Dịch giữ “thứ ngài thải ra / còn thứ con thải ra” và để ý nghĩa khiếu
  cười của câu kệ hiện ra tự nhiên, không thêm chú giải vào lời kinh.
  `saddahase tuvaṃ` (1.4) — `saddahati` = tin cậy, trông cậy; `tuvaṃ` = ngươi. Dịch “bạch ngài còn mong đợi
  điều gì nữa ấy”, giữ dấu hỏi vì nghĩa là chất vấn chứ không phải hỏi thật sự. Đây là chỗ khó nhất của bài và
  không có tầng Anh để phân xử — đã ghi ở đây.
  `duggato yamalokiko` (2.2) — `duggati` = sinh về cõi khổ xa xôi (tiền lệ tha-ap: “khổ xứ”, “đọa xứ”); chọn
  “cõi khổ xa xôi”. `Yama` giữ Pāli.
  `Amitto mittavaṇṇena` (6.1) — `mittavaṇṇa` = giống bạn về **vẻ ngoài**; dịch “không phải bạn theo vẻ ngoài”
  rồi `yo te āsi kulūpako` mới là quan hệ huyết thống.
  `sīse tiṭṭhāmi matthake` (7.2) — `sīse` = làm nô lệ, `matthake` = ngay trước hiên; dịch “ở lại ngay trước
  hiên nhà người ấy làm nô lệ”, giữ đủ hai ý.

  DẤU LƯỢC — bài này **không có** `…pe…`.

  Ngoặc kép: mỗi vòng thoại là một cặp mở–đóng riêng (1.1/1.4, 2.1/2.4, 3.1/3.4, 4.1/5.4, 6.1/6.4, 7.1/8.4),
  và 8.1–8.4 **không** có nháy kép riêng vì nằm trong nháy kép của vòng 7. Đúng y như Pāli. Tự đếm lại: cân.

