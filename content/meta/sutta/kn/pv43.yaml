  TRÙNG NGUYÊN VĂN VỚI pv44 — ĐÃ ĐO ĐƯỢC. pv43 và pv44 là cùng một truyện, bản nam và bản nữ. Trong hai bài
  có **25 cặp khoá Pāli trùng nguyên văn** (1.1, 1.4, 2.3, 3.1, 3.2, 3.3, 3.4, 4.1, 4.2, 4.3, 4.4, 5.1, 5.2,
  5.3, 6.1, 6.2, 6.3, 6.4, 7.1, 7.2, 7.3, 7.4, 8.1, 8.2, 8.3, 8.4). Mọi cặp đều mang **bản Việt giống hệt
  nhau**; chỗ nào Pāli khác (giống/giống cái) thì bản Việt mới khác. Kiểm lại bằng script sau khi sửa: **0/47
  cặp trùng bị dịch khác**. Lý do: nếu hai bài cùng truyện mà câu Việt lệch nhau thì người đọc tưởng khác
  giáo nghĩa — đúng cái bẫy `sn11.24` đã được ghi trong `AGENTS.md`.

  THUẬT NGỮ THEO TIỀN LỆ ĐẾM ĐƯỢC. `Petavatthu` giữ nguyên Pāli (11 nơi, **1 cách duy nhất**: pv2, pv3, pv4,
  pv41, pv46–pv50). `Mahāvagga` → “Đại Phẩm” (19 nơi, 1 cách). `…petavatthu` → “Chuyện Ngạ Quỷ …” theo pv2,
  pv3, pv4, pv9, pv41, pv46. `bhadante` → “bạch ngài” (pv9:3.1 đã dùng đúng vế này). `petā` → “ngạ quỷ / người đã
  chết” (pv46:1.2 “ngươi là ngạ quỷ”; pv4:3.3 “người đã khuất”). `kammavipāka` → “quả báo của nghiệp” (pv46).
  `kadariyo paribhāsako` → “tàn nhẫn và mắng nhiếc người khác” (an4.53, an4.54, an7.57 đã có “kadariyo
  paribhāsako”; chọn cách ghép `paribhāsa` = mắng nhiếc, `kādariya` = tàn nhẫn). `issukī kulamaccharī` →
  “đố kỵ ghen tị, xan tham keo kiệt”. `paricārako` → “kẻ hầu hạ” (tiền lệ `paricāraka` = hầu cận).

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `Gūthakhādakapetavatthu` — `gūthakhādaka` là ma **ăn phân**; dịch “Ngạ Quỷ Ăn Dơ”. Cùng cấu trúc với pv29
  (`Bhusāpetavatthu` → “Chuyện Ngạ Quỷ Trấu Thóc”), nên giữ hình tiền lệ “Chuyện Ngạ Quỷ …”.
  `hādeti` (8.1, 8.3) — `hadantañño` / `hadāmi`, cùng gốc với `gūtha` trong câu; ở đây là động từ **thải ra**
  (nhốt ra ngoài), không phải “nôn”. Dịch giữ “thứ ngài thải ra / còn thứ con thải ra” và để ý nghĩa khiếu
  cười của câu kệ hiện ra tự nhiên, không thêm chú giải vào lời kinh.
  `saddahase tuvaṃ` (1.4) — `saddahati` = tin cậy, trông cậy; `tuvaṃ` = ngươi. Dịch “bạch ngài còn mong đợi
  điều gì nữa ấy”, giữ dấu hỏi vì nghĩa là chất vấn chứ không phải hỏi thật sự. Đây là chỗ khó nhất của bài và
  không có tầng Anh để phân xử — đã ghi ở đây.
  `duggato yamalokiko` (2.2) — `duggati` = sinh về cõi khổ xa xôi (tiền lệ tha-ap: “khổ xứ”, “đọa xứ”); chọn
  “cõi khổ xa xôi”. `Yama` giữ Pāli.
  `Amitto mittavaṇṇena` (6.1) — `mittavaṇṇa` = giống bạn về **vẻ ngoài**; dịch “không phải bạn theo vẻ ngoài”
  rồi `yo te āsi kulūpako` mới là quan hệ huyết thống.
  `sīse tiṭṭhāmi matthake` (7.2) — `sīse` = làm nô lệ, `matthake` = ngay trước hiên; dịch “ở lại ngay trước
  hiên nhà người ấy làm nô lệ”, giữ đủ hai ý.

  DẤU LƯỢC — bài này **không có** `…pe…`.

  Ngoặc kép: mỗi vòng thoại là một cặp mở–đóng riêng (1.1/1.4, 2.1/2.4, 3.1/3.4, 4.1/5.4, 6.1/6.4, 7.1/8.4),
  và 8.1–8.4 **không** có nháy kép riêng vì nằm trong nháy kép của vòng 7. Đúng y như Pāli. Tự đếm lại: cân.

  Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.

  Kiểm toán độc lập 2026-10-11. Đọc đối kháng từng khoá Pāli↔Việt, đối chiếu bài anh em trong kho. Kết luận: bản trước (tự chấm 9.05) có lỗi nghĩa thật ở 16/36 khoá và 4 khoá lệch nhẹ hơn; đã sửa 20 khoá, điểm hạ 9.05 → 8.69. Phần ghi chú cũ ở trên được giữ làm lịch sử, nhưng các chỗ sau đây của nó KHÔNG còn đúng và đã bị thay:
  (1) `kadariyo paribhāsako` ở 4.4 trước dịch “tàn nhẫn và mắng nhiếc”, và notes cũ viện an4.53/an4.54/an7.57 làm tiền lệ. Đo lại: cùng nguyên văn Pāli ở pv19:7.2, pv38:22.4, pv38:35.4 dịch “keo kiệt, hay mắng nhiếc”, an4.54 “keo kiệt và hay rủa sả”, an7.57 “keo kiệt, bủn xỉn, hay sỉ nhục”; `kadariya` ở toàn tầng đều là “keo kiệt” (57 khoá có `kadariy`, không nơi nào là “tàn nhẫn”). Tiền lệ viện dẫn trước đây là sai; đã sửa theo đa số.
  (2) `Ahu` ở 4.1 trước giữ nguyên như một tên riêng. Đó là dạng quá khứ của `hoti` (“đã có / từng có”, như `ahu satthā` ở tha-ap345), không phải tên người. Nay dịch “Con từng có một vị trú xứ”; `āvāsika` theo tiền lệ “vị trú xứ / tỳ-kheo trú xứ” (an5.232–240).
  (3) Cả bài trước gán “bạch ngài” cho lời của vị trưởng lão hỏi (1.2, 1.4, 3.4) và gán “ngài” cho người đối thoại ở 8.1 (`bhadante hadantaññe` = “bạch ngài, thứ mà những kẻ khác thải ra”; `aññe` là “những kẻ khác”, không phải “ngài”). Ở 5.2 `bhikkhavo` là đối cách số nhiều “các tỳ-kheo” (đối tượng bị mắng), không phải hô cách “bạch ngài”. Đã sửa; vị hỏi gọi ngạ quỷ là “ngươi” như pv19:1.1, pv51:4.4, pv33:3.4.
  (3b) `ko nu dīno patiṭṭhasi` (1.2) là “kẻ khốn khổ nào đã đứng đó”, `ko` là “ai”, bản trước đọc thành “ở đâu”. `Nissaṁsayaṁ pāpakammanto` (1.3) là “chắc chắn (ngươi) là kẻ làm ác”, bản trước đọc thành “không hề do dự”.
  (4) Đảo chủ thể ở vòng 7: 7.4 `mameva paricārako` nói kẻ kia là người hầu hạ CỦA TA (ngạ quỷ nói), bản trước viết ngược “còn kẻ hầu hạ thì chính là con”. 7.2 notes cũ tự ghi “`sīse` = làm nô lệ, `matthake` = ngay trước hiên”: đây là nghĩa bịa, không có trong Pāli (`sīsa` = đầu, `matthaka` = đỉnh đầu); 7.3 `paravisayaṁ patto` bị thay bằng câu bịa “đã chịu quả báo khổ đau”. Nay dịch sát chữ.
  (5) 5.3 `tassa kammavipākena` là “do quả báo của nghiệp ấy” (nghiệp mắng nhiếc tỳ-kheo), không phải “nghiệp của người ấy”. 6.2 `kulūpako` là người hay lui tới gia đình (an5.111 “hay đến các gia đình”), không phải “người cùng họ hàng”. 6.1 `amitto mittavaṇṇena` là kẻ thù mang dáng bạn bè. 4.2 `kulamaccharī` giữ vế “keo kiệt về gia đình” (an5.237, an5.224). 2.2 `duggato` là “đã rơi vào cảnh khổ” (pv19, pv13, pv27); “khổ xa xôi” là đọc `du-` thành “xa”, không có cơ sở.
  (6) 2.1 `petomhi` đổi “ma” → “ngạ quỷ” cho khớp tiêu đề và pv19:2.1, pv45:2.1.
  Khoá đã đổi (20/36): 1.2, 1.3, 1.4, 2.1, 2.2, 3.4, 4.1, 4.2, 4.4, 5.2, 5.3, 6.1, 6.2, 6.3, 7.1, 7.2, 7.3, 7.4, 8.1, 8.4. Không đổi: 0.x, 1.1, 2.3, 2.4, 3.1–3.3, 4.3, 5.1, 5.4, 6.4, 8.2, 8.3, 9.1.
  Điểm hạ: source_provenance 9.5→9.0 (notes cũ viện tiền lệ sai), semantic_fidelity 9.0→8.2, grammar_logic 9.0→8.6, terminology 9.0→8.4, vietnamese_clarity 9.1→8.8, han_viet_balance 9.2→9.0, ambiguity_integrity 8.6→7.8; segment_alignment 10.0, triangulation 7.5, technical_integrity 9.6 giữ. final_score 8.69 (trung bình thô). Vì điểm xuống dưới 9.0, `status` do công cụ chấm quyết định lại.
  BẤT ĐỊNH CÒN LẠI (không phân xử được, không bịa): (a) 1.4 `kiṁ nu saddahase tuvaṁ`: dịch sát chữ `saddahati` = tin; nhưng bài anh em pv51:1.4 cùng công thức chỉ khác chữ (`saddāyase`, “kêu la”) nên có thể đây là dị bản của `saddāyase` (“sao ngươi kêu la”); không có tầng Anh để phân xử. (b) 7.1–7.2 `sīse tiṭṭhāmi matthake`: dịch sát chữ “đứng trên đầu, trên đỉnh đầu”, nghĩa thành ngữ (đứng trên cao hơn kẻ kia) không kiểm chứng được; `pāpakammassa` hiểu là người làm ác (vì câu sau nói `so`), cũng có thể là danh từ “ác nghiệp”. (c) 7.3 `paravisayaṁ patto`: dịch sát chữ theo sn47.6–7 (“lãnh vực của người khác”); rất có thể nghĩa là cõi ngạ quỷ nhưng chưa kiểm chứng được. (d) 4.1/4.3 `āvāsiko` + `ajjhāsito`: “vị trú xứ” và “ở trong nhà con”; `ajjhāsita` chỉ có hai lần trong toàn tầng, không có tiền lệ.
  Cố ý KHÔNG đổi dù nghi ngờ: tiêu đề “Ăn Dơ” (`gūtha` là phân; “dơ” là cách nói giảm, nhưng khớp pv44 và uddāna pv51, không sai nghĩa); `petalokaṁ ito gato` giữ “đã từ đây đi sang thế giới của người đã chết” (26/29 nơi trong tầng, chỉ pv19 dùng “cõi ngạ quỷ”). ĐỀ NGHỊ kiểm toán bài anh em: pv44 (cùng lỗi, chép nguyên), pv51:1.3–1.4 (`Nissaṁsayaṁ pāpakammanto` đọc sai y hệt), pv35:3.4 (“bạch ngài rơi vào khổ ấy”), và cụm “sinh về cõi khổ xa xôi” ở pv6, pv7, pv31, pv44, pv45, pv51.
  Pāli trùng nguyên văn trong chính bài: không có cặp nào (36 khoá); nháy kép/dấu lược khớp Pāli từng khoá, NFC, thứ tự khoá = Pāli, kiểm cổng kỹ thuật cục bộ ✓. technical_integrity giữ 9.6; bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
