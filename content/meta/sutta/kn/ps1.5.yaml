  technical_integrity đặt 9,6 vì lát này cấm chạy cổng, nên tôi không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  Sửa lan 2026-10-13: `ps1.5:53.7`, `53.14`, `53.33` (`Jhāpetīti—kilese`): *Thiêu đốt — đó là các phiền não* → *Chúng thiêu đốt — các phiền não.* `kilese` là danh từ số nhiều đối cách (vật bị thiêu), không phải vị ngữ đồng nhất với hành động thiêu đốt; chủ ngữ lấy từ câu liền trước `Jhāyantīti—dhammā` (*Chúng tu thiền — đó là các pháp*). Theo `ps3.10:15.10` (`Jhāpentīti kilese` → *Chúng thiêu đốt — các phiền não.*). Lưu ý Pāli ở đây là số ít `jhāpeti`, ở `ps3.10` là số nhiều `jhāpentī` — bản Việt theo cặp song song với `jhāyantī … dhammā` liền trước. Điểm số giữ nguyên.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (dịch 2007, theo ấn bản Buddha Jayanti). 9 điểm bất đồng về nghĩa giữa hai bản → sửa 2 điểm (10 khoá), giữ 5 điểm, bất định 2 điểm. Bản nguyên bài không phân đoạn nhưng bám sát cấu trúc Pāli từng đoạn, nên đối chiếu được ở mức đoạn và cụm từ, không phải mức khoá; không có bản Anh. Hai bản khớp ở các con số (ba, bốn, bảy, chín, mười; phép đếm chấp thủ 3-1-3-1-1-4-4-3-1-3; 4 + 4 + 2), ở thứ tự các mục và ở 258 mẫu câu Pāli khác nhau của phần 94–139.

  SỬA 2. (1) 9.3, 9.4 (`oḷārikā kāmarāgasaññojanā paṭighasaññojanā oḷārikā kāmarāgānusayā paṭighānusayā`; `anusahagatā …`): trước *dục ái kiết sử thô thiển, sân kiết sử, dục ái tùy miên thô thiển, sân tùy miên* (và *vi tế* tương ứng ở 9.4) → sau *dục ái kiết sử và sân kiết sử thô thiển, dục ái tùy miên và sân tùy miên thô thiển* (và *vi tế* ở 9.4). Vì `oḷārikā` và `anusahagatā` là tính từ số nhiều đứng trước một cặp danh từ cùng số cùng cách nên bao cả hai; nếu chỉ gắn với dục ái thì `paṭighasaññojanā` không giới hạn sẽ được liệt kê là bị xuất khỏi ở cả Nhất lai lẫn Bất lai. Mục BẤT ĐỊNH 13 ở trên (chỉ gắn với dục ái theo ps2.5:5.2 và 7.2) được thay bằng cách đọc này; các khoá cùng công thức ở bài khác (ps1.1:349.2, 365.2; ps2.5:5.2, 7.2, 15.2; mnd2:12.11; mnd7:9.11; mnd14:9.11, 9.12) chưa đổi. (2) 122.8, 122.10, 123.3, 123.5, 123.7, 124.3, 124.5, 124.7 (`tena suñño`, `yena suñño, tena nimittena animitto`, `yena nimittena animitto`): trước *nhờ đó vị ấy trống rỗng / nhờ cái mà vị ấy trống rỗng, nhờ tướng ấy mà vị ấy vô tướng / nhờ tướng nào mà vị ấy vô tướng* → sau *đối với điều ấy vị ấy trống rỗng / đối với điều mà vị ấy trống rỗng, đối với tướng ấy vị ấy vô tướng / đối với tướng nào mà vị ấy vô tướng*. `suñña` đi với cách công cụ để chỉ cái vắng mặt, đúng như `suññamidaṁ attena vā attaniyena vā` ở 3.3 (“trống rỗng đối với tự ngã”), nên cách công cụ ở đây không mang nghĩa “nhờ”. Hai sửa cơ học kèm theo, không đổi nghĩa: 138.2 viết hoa chữ đầu khoá theo Pāli (trước đó viết thường); 53.9 *nên là thiền* → *— đó là thiền* cho cùng khuôn với 53.10, 53.16, 53.18… (Pāli 53.9 có dấu gạch).

  GIỮ 5. (a) `sāmisa`/`nirāmisa` (2.15, 2.16, 34–36; 8 khoá): bản nguyên bài dịch theo hướng hệ lụy vật chất; bản này giữ *thuộc về thế tục* vì cùng dải nghĩa của `āmisa` và tầng chia gần đều (khoảng 100 khoá mỗi hướng ở các khoá có `āmisa`); lời giải thích `rūpappaṭisaññutto`/`arūpappaṭisaññutto` ở 34.2, 35.2 đã dịch nguyên. (b) `appaṭikūlā` (18.3, 18.5, 18.7, 18.9): bản nguyên bài hiểu chúng sinh không chống đối nhau; Pāli chỉ nói chúng sinh không còn đáng ghét/nghịch ý, không nêu quan hệ qua lại; giữ *không đáng ghét*. (c) `vesārajjappatta` (83.1, 85.8, 88.1): bản nguyên bài dịch *sự tự tín*, bản này *sự không run sợ*; cùng dải nghĩa; tầng có 32 khoá `vesārajja` dịch *tự tin/tự tín* và 13 khoá dịch *không run sợ* (gồm ps3.1:24.1, 50.1), nên không coi là lỗi. (d) `vasippatta` (83.1, 85.8, 88.1): bản nguyên bài dịch *ưu thế*, bản này *sự thuần thục*; 13 khoá ở cụm `vasippatto pāramippatto` dịch *thuần thục*; `vasī` là sự làm chủ/thuần thục. (e) `saññāvimokkha` (21 khoá): bản nguyên bài gọi là giải thoát do tưởng, bản này *giải thoát khỏi tưởng*; lời giải thích trong chính bài dùng `saññāya muccati` (thoát khỏi tưởng về thường…), nên giữ.

  BẤT ĐỊNH 2. (f) `vedabahula` (14 khoá: 63.6, 64.3, 64.6, 65.3, 65.14, 66.13, 67.15, 93.6, 94.3, 94.6, 95.3, 96.11, 97.3, 98.3): bản nguyên bài hiểu `veda` là hiểu biết, khớp thế song song adhimokkha–tín căn, passaddhi–định căn, `veda`–tuệ căn; bản này giữ *cảm hứng* (nghĩa phấn khởi của `veda`). Tầng dịch `vedabahulo` theo cả hai hướng: ps3.1:34.2 *đầy hớn hở* trong chuỗi từ chỉ niềm vui, an6.80:1.3 *đầy ắp tri thức*. Pāli của bài này không đủ để chốt; cách đọc *hiểu biết* mạnh hơn nhờ thế song song nhưng chưa có bằng chứng độc lập ngoài bản nguyên bài, nên không đổi; mục BẤT ĐỊNH 6 ở trên giữ nguyên. (g) `samayavimokkho`/`sāmayiko vimokkho` (2.10, 2.11, 24–27): bản nguyên bài tách hai cặp thành *có thời hạn / phụ thuộc thời hạn*, bản này cả hai cặp là *tạm thời / không tạm thời* vì phần giải thích Pāli của hai cặp y hệt; chưa có căn cứ để tách; mục BẤT ĐỊNH 3 ở trên giữ nguyên.

  Các lệch về diễn giải không tính là bất đồng nghĩa: bản nguyên bài thêm ngoặc đơn giải thích, dịch `Purimanidānaṁ` thành duyên khởi ở Sāvatthī (1.1 bản này giữ nghĩa đen), diễn giải `parato` (61.2) và `vatthuvasena pariyāyena` (43.2…) rộng hơn; các điểm này đã nằm trong mục BẤT ĐỊNH 9 và 10 ở trên. Không có bản Anh nên không tuyên bố đã đối chiếu English.

