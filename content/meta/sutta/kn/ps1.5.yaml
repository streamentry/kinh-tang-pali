notes: |-
  Đợt 19, làn 135. Dịch từ Pāli root commit đã ghim, đủ 1113/1113 khoá (0.1–0.3 đến 139.1–139.9, đúng thứ tự Pāli); thứ tự khoá đúng thứ tự Pāli, 0 khoá ngoài tập Pāli. Bản nháp có sẵn từ lượt làm trước bị ngắt giữa chừng đã được rà lại từng cặp Pāli↔Việt và ghi đè; 124 khoá thay đổi trong lượt rà này (xem THUẬT NGỮ và BẤT ĐỊNH).

  CẤU TRÚC BÀI (Vimokkhakathā, Luận Bàn Về Giải Thoát). 1.5.1 Uddesa (1–2): ba giải thoát và danh sách “sáu mươi tám” giải thoát. 1.5.2 Niddesa (3–139): ba giải thoát không, vô tướng, vô nguyện (3–5); giải thoát xuất khỏi bên trong, bên ngoài, từ cả hai phía cùng các nhóm bốn thuận theo và lắng dịu (6–15); có sắc thấy các sắc, tịnh và bốn vô sắc, diệt thọ tưởng (16–23); các cặp tạm thời–không tạm thời, có thể lay chuyển–không thể lay chuyển, thế gian–xuất thế gian, hữu lậu–vô lậu và các cặp tiếp theo (24–42); giải thoát khỏi tưởng, bằng trí, mát lạnh, thiền giải thoát, của tâm không chấp thủ (43–56); mười trí quán thoát khỏi chấp thủ (57–60); ba cửa giải thoát (61); khi tác ý vô thường, khổ, vô ngã: hành hiện khởi thế nào, tâm nhiều điều gì, căn nào làm chủ, tín giải thoát, thân chứng, đạt kiến, tùy tín hành, tùy pháp hành, thông suốt chân lý theo bốn và chín phương diện, các cặp pháp đồng nghĩa khác văn (62–116); ba giải thoát có ở thời điểm khác nhau (bốn phương diện) và cùng thời điểm (bảy phương diện) (117–124); có giải thoát, cửa, cửa giải thoát, điều đối nghịch, điều thuận theo, sự quay đi, sự tu tập, sự lắng dịu của giải thoát (125–139); hết luận và hết phần tụng thứ ba.

  COVERAGE ENGLISH ĐO ĐƯỢC. Mẫu số = 597 khoá Pāli có nội dung (độ dài ≥ 40 ký tự theo `source/layers.yaml`, sau khi gộp khoảng trắng, bỏ khối `:0`: 3 khoá `0.1`–`0.3`) trên tổng 1.113 khoá; 516 khoá không vào mẫu số (3 khoá `0.1`–`0.3` và 513 khoá dưới 40 ký tự: nhãn, câu hỏi ngắn, điệp khúc). Sujato: 0/597. english-project: 0/597 (không có tệp ps nào ở `content/translation/en/project/sutta/kn/`). vietnamese-current: 0/597 (chỉ có Pháp Cú). Ba tầng tham khảo đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker noEnglishEditionUpstream. Tôi không đụng `content/meta/reference-gaps.yaml`; entry ở đó (nếu có) cũng không cứu được `published`. Bản này được đối chiếu độc lập với English ở 0/597 khoá. Đối chiếu thuật ngữ dựa vào tầng Việt đã dịch của chính dự án (ps1.0, ps1.4, ps1.6, ps1.8, ps2.2, ps2.5, ps2.9, ps2.10 và các bài dn, mn, sn, an, kn khác), không phải bản dịch độc lập.

  PĀLI TRÙNG NGUYÊN VĂN TRONG CHÍNH BÀI (đã đếm). Sau khi bỏ thẻ <b>, dấu câu, dấu [N], hạ chữ hoa, bỏ khối `0.x`: 126 nhóm Pāli trùng, gồm 484 khoá, tương đương 1.376 cặp; 114 nhóm có bản Việt giống hệt, 12 nhóm có bản Việt khác. Cả 12 nhóm đã đọc từng khoá: (a) khác dấu cuối khoá hoặc chữ hoa đầu khoá vì Pāli từng khoá khác dấu (1.4 kết bằng dấu gạch, 2.2 kết bằng chấm phẩy, 126.2 kết bằng chấm; 5.6, 37.6, 131.18 chỉ khác chữ hoa vì 37.6 là vế tiếp của 37.5; 44.22, 45.5, 46.10 và 47.24, 48.5, 49.10 và 50.24, 51.5, 52.10 khác dấu cuối; 59.2, 59.5, 59.8… và 60.3, 60.6, 60.9 khác dấu và chữ hoa); (b) khác vì Pāli có hay không có nháy quanh tên hạng người (70.2, 70.4, 70.6, 70.8, 70.10, 70.12, 101.x “đó là …” so với 76.3, 77.8, 78.3, 79.9, 81.3, 82.8 “bậc …”); (c) 138.3 so với 139.6 (“sự chứng đạt Vô sở hữu xứ …” so với “của sự chứng đạt Vô sở hữu xứ …”), vì 138 là chuỗi đối cách dưới “sự thực hành, sự tu tập, sự làm cho sung mãn” còn 139 là chuỗi sở hữu cách dưới “sự đạt được hoặc quả dị thục”. 0 nhóm lệch do nhầm.

  PĀLI TRÙNG NGUYÊN VĂN VỚI TẦNG ĐÃ DỊCH (đã dò). 9 khoá của bài có chuỗi Pāli trùng (chuẩn hoá như trên, từ 25 ký tự) ở bài khác của tầng; 2 khoá trùng bản Việt đã có, 7 khoá khác có chủ ý: 3.3, 4.3, 5.3 (`suññamidaṁ attena vā attaniyena vā` có ba cách dịch ở tầng: mn43:33.3 “trống không đối với tự ngã hay cái thuộc về tự ngã”, sn41.7:4.3 “trống rỗng đối với tự ngã hay cái thuộc về tự ngã”, mn106:7.2 “trống không, không có tự ngã hay những gì thuộc về tự ngã”; chọn “trống rỗng đối với tự ngã hay cái thuộc về tự ngã” theo sn41.7 và mn43 để giữ cùng một chữ với `suñña` ở 61 và 126, nháy kép theo Pāli bài này) và 19.2, 20.2, 21.2, 22.2 (công thức bốn vô sắc theo khuôn dn33:3.1.175 và dn15:35.9 “do các tưởng về đối ngại chấm dứt, không tác ý đến các tưởng sai biệt, với nhận thức …” thay cho khuôn mn26:38.1; nháy kép theo Pāli bài này).

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `vimokkha` “giải thoát”. `suññato vimokkho` “giải thoát Không” (viết hoa Không, 40 khoá): ne21 và ne36 (12 khoá) viết “cửa giải thoát không” bằng chữ thường, nhưng ở bài này tên giải thoát đứng làm chủ ngữ trước động từ hay trước “là” (96.11, 98.3, 100.5, 101.14, 118.4) nên “giải thoát không làm chủ”, “giải thoát không trở nên mạnh mẽ”, “giải thoát không là bậc đạt kiến” đọc được thành phủ định; viết hoa để phân biệt với “giải thoát không tạm thời”, “giải thoát không thể lay chuyển”, “giải thoát không bị ràng buộc”, và áp dụng nhất quán cho mọi nơi tên này xuất hiện. `animitto`, `appaṇihito` “vô tướng”, “vô nguyện” (ne21, ne36). `sītisiyā` “mát lạnh” (snp5.7:5.3 và cnd2, cnd10 6/6 khoá dịch `sītisiyā vimutto` là “mát lạnh”; bản nháp trước để nguyên Pāli, đã bỏ vì làm Pāli lọt sang Việt). `vuṭṭhāna` “xuất khỏi” (ps 10/10 khoá, ps1.0:11.1). `paṭippassaddhi` “lắng dịu” (ps 47/49 khoá; toàn tầng 149/185 khoá “lắng dịu”, 65 “an tịnh”). `paṭilābha`, `paṭilabhati` “đạt được” (toàn tầng 278 khoá “đạt được”, 39 “có được”, 30 “chứng đắc”, 5 “thu được”; bản nháp trước dùng “thu được”, đã đổi theo số đếm; riêng 83.1 và 85.8 dùng “có được” cho `paṭiladdhā … paṭilabhanti` để tách khỏi “đạt đến” của `pattā … pāpuṇanti`). `samāpatti` “sự chứng đạt”; `saññāvedayitanirodha` “diệt thọ tưởng” (57 khoá, ngoài ra 13 khoá “diệt thọ tưởng định”); `ākāsānañcāyatana` … “Không vô biên xứ”, “Thức vô biên xứ”, “Vô sở hữu xứ”, “Phi tưởng phi phi tưởng xứ” viết hoa theo dn33, dn15. `adhimokkha` “thắng giải” (ps 66/67). `paṭivedha` “thông suốt” (ps 106/107). `niyyāna`, `niyyāti` “xuất ly” (ps 13/13). `vivaṭṭa` “quay đi” (ps 22/28; ps1.0:44.1 “sự quay đi của tưởng”). `passaddhi` “khinh an” (114/126). `sahajātapaccaya` “duyên đồng sanh” (ps 51/51 khoá); `ekarasa` “có cùng một vị” (ps1.4 2/2). `nirodhasacca` “chân lý về diệt tận” (ps 18/19, theo ps2.2). `abhinivesa` “chấp trước” (ps 4/4; toàn tầng 32/54). `paṇidhi` “mong cầu” (ps1.4:84.9; còn `paṇidhisampanna` ở ps1.4:60.11 và ps3.5:3.1 dịch “nguyện hướng”, nghĩa khác; `appaṇihita` là “vô nguyện”). `saddhāvimutta` “tín giải thoát” (22/23), `kāyasakkhī` “thân chứng” (13/25), `diṭṭhippatta` “đạt kiến” (19/30). `saddhānusārī`, `dhammānusārī` “bậc tùy tín hành”, “bậc tùy pháp hành”. `dukkhasacca` … “chân lý về khổ, tập khởi, diệt tận, đạo” (ps2.2). `pariññā` “hiểu rõ tột cùng” (ps2.2:25.4), `sacchikiriyā` “chứng ngộ” (ps2.2:25.6). `gotrabhū dhammā` “các pháp chuyển tộc”. `upādāna` bốn thủ: “dục thủ, kiến thủ, giới cấm thủ, ngã luận thủ”. `tadanuvattakakilesehi ca khandhehi ca … bahiddhā ca sabbanimittehi` “các phiền não đi theo điều ấy và các uẩn … mọi tướng ở bên ngoài” (ps2.5:5.2, 7.2, 8.2, 3/3). `oḷārikā`, `anusahagatā` “thô thiển”, “vi tế” (ps2.5 4/4). Danh sách quán `aniccānupassanā …` “quán vô thường, khổ, vô ngã, nhàm chán, ly tham, đoạn diệt, xả bỏ” (ps1.4:41.1, ps2.9:21.15), còn vô tướng, vô nguyện, trống rỗng theo ps1.4:84.9 và ps2.10. Thẻ <b>…</b> ở 61 khoá không đưa sang bản Việt; chỗ Pāli kết bằng `ti` ở các khoá `Siyāti` (44.1, 74.1) và `siyāti` (47.2, 50.2, 54.2, 70.13) dịch “Có thể”, “— có thể” theo khuôn “X nghĩa là” của ps1.4:60.x.

  DẤU CÂU. Nháy khớp Pāli từng khoá: 26 khoá có nháy, 25 nháy mở và 25 nháy đóng kép `“”` ở Pāli và ở Việt, 0 nháy đơn, 0 ngoặc đơn, 0 lệch; nháy mở ở 1.2 chạy qua 2.19 (khớp Pāli từng khoá, không phải mỗi khoá tự cân). Dấu lược: 73 khoá có `…pe…` và 80 khoá có `…` trần ở Pāli, không khoá nào có cả hai dạng; Việt giữ đúng một `…` ở đúng 153 khoá đó, 0 lệch; không có `(…)` ở Pāli nên Việt cũng không có. Khoá 84.36 Pāli kết `….` thì Việt kết ` ….`. Dấu gạch cuối khoá Pāli (—) giữ thành ` —`: 215 khoá Pāli, 215 khoá Việt. Dấu số lượng `[75]` ở cuối 2.19 không đưa sang (như `[10]` ở ps1.1:28.2). NFC 1113/1113, 0 khoá rỗng, 0 khoảng trắng thừa; Pāli lọt sang Việt chỉ còn `Paṭisambhidāmagga` và `Mahāvagga` ở 0.1–0.2 (tên sách và tên phẩm, như ps1.0, ps1.4).

  SỐ PĀLI (đã tính). `aṭṭhasaṭṭhi` 8 + 60 = 68 (2.1; xem bất định 1); `tayo` 3 (1.2–1.5); `dasa` 10 (43.2, 44.22, 47.2…: đếm 44.2–44.20 được đúng 10 quán, aniccā, dukkha, anattā, nibbidā, virāga, nirodha, paṭinissagga, animitta, appaṇihita, suññatā); `cattāro` 4 (bốn nhóm 6.2, 7.1, 9.1, 10.1…); chấp thủ: 58.1–58.10 ba, một, ba, một, một, bốn, bốn, ba, một, ba, khớp với các danh sách 59.2–59.29 (3, 1, 3, 1, 1, 4, 4, 3, 1, 3) và với 60.1–60.9 (bốn trí thoát ba chấp thủ, bốn trí thoát một chấp thủ, hai trí thoát bốn chấp thủ: 4 + 4 + 2 = 10); `catūhākārehi` 4 (90.3, 103.3; 5 + 4 liệt kê ở 90.5, 103.5–103.7 đếm đủ 4); `navahākārehi` 9 (91.3; 91.4 đếm 4, 91.5 đếm 5, tổng 9); `catūhākārehi tayo vimokkhā nānākkhaṇe` 4 (118.2 liệt kê đủ 4); `sattahākārehi tayo vimokkhā ekakkhaṇe` 7 (122.2 liệt kê đủ 7); `tisso vijjā` 3, `tisso sikkhā` 3, `catasso paṭisambhidā` 4, `aṭṭha vimokkhā` 8 (85.8, 86.1–88.1). Không có `sata`, `sahassa`, `navuti`, `tiṁsa…`.

  BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:
    1. `aṭṭhasaṭṭhi vimokkhā` (2.1) = 68, nhưng danh sách 2.2–2.19 đếm được 75 mục (3 + 3 + 12 + 12 + 12 + 3 + 3 + 2 + 12 + 4 + 2 + 4 + 3), đúng với dấu `[75]` ở cuối 2.19; con số 68 chỉ khớp nếu dừng đếm ở hết 2.17. Dịch đúng chữ “sáu mươi tám”, không chữa; không biết bản Pāli ghim có sai lệch truyền bản hay con số chỉ đếm một phần.
    2. `subhaṁ teva adhimutto hotīti` (2.7, 18.1, 18.10) dịch “chú tâm hoàn toàn vào tịnh”; dn15:35.7, dn16:3.33.7, dn33:3.1.173, dn34:2.1.196 (4 khoá) dịch “chú tâm hoàn toàn vào tịnh tướng”, mn77:22.6 và mn137:27.5 “chú tâm vào cái đẹp”; giữ “tịnh” vì Pāli `subhaṁ` không có `nimitta`.
    3. `samaya` (2.10, 24.1) và `sāmayika` (2.11, 26.1) cùng “tạm thời”; Pāli có hai dạng nhưng 0 tiền lệ tách nghĩa ở tầng.
    4. `sāmisa`/`nirāmisa` “thuộc về thế tục”/“không thuộc về thế tục”, `nirāmisānirāmisataro` “không thuộc về thế tục còn hơn cả không thuộc về thế tục”, `kuppa`/`akuppa` “có thể lay chuyển”/“không thể lay chuyển”; 0 tiền lệ ở tầng cho các cặp này.
    5. `sītisiyā` (2.19, 50.x): chơi chữ giữa `sīti` “mát” và `siyā` “có thể” mất đi khi dịch “mát lạnh”; cách đọc khác là giữ nguyên `sītisiyā`.
    6. `vedabahulaṁ cittaṁ` (63.6, 93.6) “tâm có nhiều cảm hứng”, 0 tiền lệ ở ps; an6.80:1.3 dịch `vedabahulo` “đầy ắp tri thức”; cách đọc khác “nhiều hoan hỷ”.
    7. `aññoyeva saddhāvimutto, añño kāyasakkhī, añño diṭṭhippatto` (73.3, 74.10) dịch “Bậc tín giải thoát là một người khác, bậc thân chứng là người khác, bậc đạt kiến là người khác”; chữ `eva` ở `aññoyeva` không có dấu riêng trong câu Việt; cách đọc khác “là ba người khác nhau”.
    8. 53.2–53.34: các câu chơi chữ `jhāyati`/`jhāpeti` dịch “tu thiền”/“thiêu đốt”; 53.6 (`Jhāyantīti—dhammā`) “Chúng tu thiền — đó là các pháp” và 53.7 (`Jhāpetīti—kilese`) “Thiêu đốt — đó là các phiền não” giữ đúng thể đối cách của `kilese`; 0 tiền lệ ở tầng.
    9. 61.2: `paricchedaparivaṭumato` “có giới hạn và bị bao quanh”, `manosamuttejanatā` “khích động tâm”, `parato` “là cái khác”, `cittasampakkhandanatā` “tâm lao vào”; 0 tiền lệ ở tầng, cách đọc khác `parato` “như ngoại vật”.
    10. `vatthuvasena pariyāyena` (43.2, 44.22 …) “theo cách dựa vào sự việc”; 0 tiền lệ ở tầng, cách đọc khác “theo cách tùy theo đối tượng”.
    11. 11.2–11.3: Pāli lược `paṭilābhatthāya` sau tân ngữ nên Việt chỉ giữ tân ngữ và một `…`, không thêm “để đạt được”; 114.1 `gotrabhū` “chuyển tộc” (2 khoá, 0 tiền lệ ở ps).
    12. 122.6 `Yato muccati, tattha na paṇidahati` dịch “Từ điều mà vị ấy thoát khỏi, ở đó vị ấy không mong cầu”; cách đọc khác “nơi nào vị ấy thoát khỏi”.
    13. 9.3–9.4: `oḷārikā`, `anusahagatā` chỉ gắn với `kāmarāga` đầu tiên theo ps2.5:5.2 và 7.2; cách đọc khác gắn với cả `paṭigha`.
