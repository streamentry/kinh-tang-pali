notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho tha-ap428.
  Pāli trùng nguyên văn: dựng chỉ mục toàn tầng thì 206/294 khoá của lát có Pāli trùng nguyên văn ở nơi khác; riêng bài này 30/42 khoá trùng và 22 chỗ đã có bản Việt. Bảy khoá `:8.1`–`:8.3`, `:9.1`–`:9.3`, `:10.1`–`:10.3` trùng **nguyên văn với tha-ap427 trong cùng lát**, nên đã dịch giống hệt ở hai bài — nếu để khác nhau thì chính lát sẽ tự mâu thuẫn.
  Đã dùng lại nguyên văn: `:0.1` `Therāpadāna` (921 chỗ) · `:0.2` `Sakiṁsammajjakavagga` → Phẩm Sakiṁsammajjaka (2 chỗ) · `:1.2` `lokajeṭṭho narāsabhaṁ;` → bậc Trưởng Thượng thế gian, đấng Nhân Ngưu (tha-ap117:1.2) · `:2.1` `Disvā cittaṁ pasādetvā,` → Thấy Ngài, lòng con bừng khởi niềm tịnh tín (1 chỗ) · `:4.1`, `:5.1` `Mama saṅkappamaññāya,` → Nhờ thấu rõ ý định của tôi (6 chỗ) · `:6.2` → tôi từng làm Chuyển Luân Vương (2 chỗ) · `:6.3` → Vương quốc rộng lớn ấy (2 chỗ) · `:6.4` → đếm không hết, vô tận (1 chỗ) · `:7.1` → Vào chín mươi tư kiếp trước đây (22 chỗ) · `:7.3` → Ta không biết mình rơi vào khổ đau (đa số trong tha-ap: 98/291) · `:8.1` → Các phiền não của ta đã được thiêu rụi (62/92) · `:8.3` → ta sống không còn lậu hoặc (63/92) · `:9.1` → Thật lành thay sự đến của ta (60/89) · `:9.3`, `:10.3` → đã làm tròn lời dạy của Đức Phật (138 chỗ) · `:10.1` → Bốn vô ngại giải (942+24 chỗ) · `Bhāgīrathī` giữ chữ Pāli có dấu theo tiền lệ ở tha-ap307:1.1.
  Số thứ tự: `12.1` `Ghatamaṇḍadāyakattherassāpadānaṁ chaṭṭhaṁ` → thứ sáu, khớp với `0.3` ghi 6 và với chuỗi phẩm Sakiṁsammajjakavagga (tha-ap423 đến tha-ap432, mười bài).
  Bất định đã ghi, không che: (1) `ghatamaṇḍa` không có tiền lệ trong tầng và `ghatamaṇḍadāyaka` ở `0.3` là một từ ghép không tách được, nên chốt Pāli lọt chặn mọi dạng có dấu của nó; tôi dịch là bó đèn và dùng nhất quán ở `0.3`, `2.2`, `7.4`, `11.1`, `12.1`. Cách hiểu này chỉ là suy đoán của tôi: `ghaṭa` là bình chậu và `maṇḍa` là đĩa hay mặt trên, nên cũng có thể là một loại đèn dầu; nếu vậy câu vẫn đúng nghĩa nhưng danh từ cần đổi. (2) `Sucintitaṁ` ở `1.1` nghĩa là được tự điển trang; tôi dịch theo nghĩa trang sức chứ không đoán rằng đó là chủ thể khác. (3) `ācitattā` ở `2.3` là dạng bị động của `āci`, tôi dịch dù đã từng dâng lên để giữ mạch lạc hội với `2.2`.
  Dấu lược: Pāli có `…pe…` ở đúng ba khoá `:8.2`, `:9.2`, `:10.2`; cả ba giữ **đúng một** `…` và không mở rộng. Nội dung bị nén là công thức `Paṭisambhidā catasso, …pe…, kataṁ buddhassa sāsanaṁ”` đã nêu đủ ngay trong cùng bài, nên giữ lược đúng như peyyāla của Pāli gốc.
  Dấu nháy kép: chỉ 1 cặp `“`/`”` ở Pāli, mở ở `:1.1` và đóng ở `:10.3` kèm `”.`; bản Việt giữ đúng 1 cặp và cân trên cả bài.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Đã tự xác minh được: JSON hợp lệ, đủ 42/42 khoá trong `all` và trùng khớp 42/42 khoá Pāli trong `root/pli/ms/sutta/kn/tha-ap/tha-ap428_root-pli-ms.json`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt vào bản Việt, không trùng nguyên văn Pāli ở khoá có nội dung, và YAML parse sạnh. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.