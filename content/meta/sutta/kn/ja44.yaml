notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ dưới 40 ký tự). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép mở ở `1.1` và đóng ở `:2.1` (hoặc `1.4`), nên cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Jātaka` giữ nguyên (129 chỗ). `Ekakanipāta` → *Bộ Một Bài Kinh*. Dòng niết `<X>jātakaṁ <số>` → *Kinh <X> thứ <số>.* theo đa số trên đĩa (71 chỗ không dấu phẩy so với 24 có). Tên riêng giữ nguyên dạng Pāli ở cả `:0.4` và dòng niết — cùng cách *Kinh Paṇṇikajātaka*, *Kinh Udañcanījātaka*, *Kinh Sālittakajātaka*, *Kinh Parosata* đã có.

  **Ngoặc kép ở khoá cuối.** Pāli `ja67:1.4` là `Yato sodariyamānayeti.` — mở `“` ở `1.1` mà **không** có `”ti` đóng. Tôi đóng `”` ở `1.4` (không có `ti`, vì Pāli không có), đúng cách `ja115:1.4` đã làm cho đúng trường hợp này. Các bài Jātaka còn lại trong lát có `”ti` ở vế cuối nên tôi giữ `”ti`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có 26 chương Pháp Cú), nên `triangulation` là Pāli + English Sujato.
  **Tôi không theo Sujato ở `1.3`, và đây là chỗ đáng để người đọc scorecard biết.** Sujato dịch `Makasaṁ vadhissanti hi eḷamūgo` thành *Thinking, “I shall kill the mosquito”* — đọc là **ý nghĩ** của kẻ ngu. Nhưng `vadhi` + `-ssanti` là dạng **định sắp làm** (sắp giết), không phải ` thinks` của `mancati`/`vitakkati`; tôi dịch *ấy đang định giết con muỗi*. Chủ thể của `eḷamūgo` (kẻ ngu) giữ nguyên, và `hi` là chữ nhấn quen thuộc trong thơ Pāli nên tôi bỏ, đúng như tôi bỏ ở các bài khác của lát.

  **Vế `1.1`–`1.2` là so sánh ghép, và đối xứng phải rõ.** `Seyyo amitto matiyā upeto / Na tveva mitto mativippahīno` — chủ thể của cả hai vế là `amitto` và `mitto`, vế nhận là `seyyō … upeto` và `na tveva`. Tôi giữ đúng hai vế đối xứng: *Kẻ thù mà biết suy nghĩ còn hơn / kẻ bạn đã bỏ hẳn suy nghĩ*. `amitto` nghĩa đen là *không phải bạn*, tức **kẻ thù**; `mativippahīno` = `mati` + `vippahīna` (*đã bỏ rơi*), nên *đã bỏ hẳn suy nghĩ* giữ đúng vế bị phủ định — đây là loại chỗ dễ vô tình thành *kẻ bạn không suy nghĩ* và đổi nghĩa.

  **Thuật ngữ đặt mới, kèm số tiền lệ.** `makasa` → *con muỗi* (**tiền lệ có**: *ruồi muỗi* đã xuất hiện trong tầng ở dạng ví tụ; 0 chỗ nào dịch `makasa` thành *con muỗi*, nên tôi đặt mới cho tiêu đề nhưng theo đúng chữ *muỗi* đã có). `Atthakāmavagga` → *Phẩm Atthakāma* (**0 tiền lệ**; giữ Pāli vì `atthakāma` = *muốn điều lành cho*, cách Việt nào cũng dài và dễ lẫn với `atthakāma` như một danh từ riêng). `upeto` → *có* (dạng *đã đạt tới*, tôi lồng vào mệnh đề *mà biết suy nghĩ*); `eḷamūgo` → *đồ ngu* (tiền lệ `dn33:3.2.67` *kẻ thiếu tuệ, đần độn, ngu ngơ* cho `jaḷo eḷamūgo`); `vadhi` → *giết*; `abbhi` + `dā` → *làm vỡ*; `uttamaṅgan` → *đầu cha ưu tú*; `putta` → *đứa con*.
  **Những lỗi bản đầu tôi tự bắt khi đọc đối kháng (đã sửa hết, ghi lại để người đọc scorecard biết điều gì đã qua):** `1.3` bản đầu dịch `vadhissanti` thành *ấy tưởng giết* — đó là nghĩa của `mancati`, trong khi `vadhi` + `-ssanti` là dạng **định sắp làm**; sửa thành *ấy đang định giết*.
