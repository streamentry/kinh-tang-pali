notes: |-
  Dịch từ Pāli root, 86 khoá, đủ khoá, đúng thứ tự Pāli; không có tầng tham khảo tiếng Anh hay tiếng Việt cho bài này nên triangulation chỉ dựa vào Pāli, các bài kệ trùng nguyên văn trong tầng Việt đã dịch (thi-ap37, thi-ap38, thi-ap40, tha-ap433, tha-ap544) và ngữ cảnh Therāpadāna.
  Tên bài (khoá 0.3) lấy đúng giá trị translationTitle: Pāli 0.3 là Vanavacchattheraapadāna, không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số). Kiểu tên: Ký Sự Về Trưởng Lão X chiếm 21 so với Bài Kệ Tuyên Ngợ 15 (cộng 1 Tuyên Ngợi) ở phạm vi tha-ap500 đến tha-ap600; toàn tầng tha-ap thì ngược lại: Tuyên Ngợ 224, Tuyên Ngôn 120, Ký Sự 103. Hai phạm vi cho hai đa số khác nhau; theo phạm vi gần nhất và bài liền kề cùng phẩm tha-ap544 thì dùng Ký Sự Về. Chữ Tuyên Ngợ không dùng vì chưa rõ gốc, vấn đề đó để biên tập phán một lượt cho cả cuốn.
  Khoá 0.2 Bhaddiyavagga dịch Phẩm Bhaddiya theo tha-ap544 (tiền lệ duy nhất cho đúng Pāli này; 1 bài). Khoá 22.1 dùng công thức Tôi nghe như vầy ... đã nói những bài kệ này (407 khoá của tầng dùng những bài kệ này, 21 khoá dùng số ít; Pāli imā gāthāyo là số nhiều). Khoá 23.1 dùng Ký sự về Trưởng lão X, thứ chín: trong các colophon navamaṁ đã có, dạng Ký sự về Trưởng lão thứ chín có 9 khoá, Ký Sự Về Trưởng Lão 3 khoá, còn Bài Kệ Tuyên Ngợ 22 và Tuyên Ngôn 9; chọn dạng Ký sự cho khớp tên bài ở 0.3 và tha-ap544.
  Số Pāli: tāvatiṁsa dịch cõi trời Ba mươi ba theo quy ước tầng (tiṁsa là 30 theo đo của tầng, 3 cộng 30 là 33; 23 trong 25 khoá cùng Pāli ở tha-ap khác dùng Ba mươi ba, 2 khoá dùng Đạo Lợi); đây là tiṁsa duy nhất của bài, bài không có cụm Tiṁsakappasahassa nên không có bất định số lượng nào phải phán. chaḷabhiññā là cha 6 cộng abhiññā, dịch sáu thắng trí theo tiền lệ của tầng (cùng cách ở các bài tha-ap khác). catasso là bốn, Paṭisambhidā catasso dịch Bốn vô ngại giải (483 khoá). navamaṁ là thứ chín. anekasataso (aneka cộng sata) dịch hàng trăm lần, không đặt con số chính xác. Bài không có cụm số lớn nào khác.
  Ngôi kể: tôi cho người kể suốt bài, kể cả các câu chuẩn; ở công thức Kilesā jhāpitā mayhaṁ đa số tầng dùng ta (99 khoá ta, 39 khoá tôi; ở phạm vi tha-ap500 đến tha-ap600 là 23 ta so với 13 tôi) nhưng nhóm dùng tôi cũng đã có và bài liền kề tha-ap544 dùng tôi; chọn tôi để nhất quán trong bài. kataṁ buddhassa sāsanaṁ dịch không chủ ngữ (121 khoá ở dạng không đóng nháy, 448 ở dạng đóng nháy kép).
  Pāli trùng nguyên văn trong chính bài: một nhóm là …pe… (19.2, 20.2, 21.2), cả ba Việt giống nhau là một dấu lược …; 19.3 và 20.3 và 21.3 khác nhau ở Pāli nên Việt khác nhau. So với tầng: đã dò 24 khoá Pāli có trùng nguyên văn ở các bài khác (gồm 3 khoá …pe… và khoá 0.1); 16 khoá Việt giống bản đa số, 8 khoá Việt khác bản đa số: 2.1, 3.4, 19.1, 19.3 (ta đổi thành tôi như đã nói); 20.1 (đa số 93 khoá viết Thật lành thay sự đến của ta, dạng có tôi 5 khoá viết Thật là sự đón tiếp tốt lành cho tôi, giữ theo tha-ap544); 11.1 (2 khoá thi-ap viết trong đời sống cuối cùng, 1 khoá tha-ap544 viết trong đời cuối cùng; theo bài liền kề); 17.1 (Pāli So me dhammamadesesi có 5 khoá trùng nhưng Việt ở các bài đó là nhiều cách không cùng nghĩa, hai khoá thig6 viết Vì lòng từ mẫn xót thương; theo Pāli, dhammamadesesi là đã thuyết Pháp cho tôi, nên dịch Vị ấy đã thuyết Pháp cho tôi); 5.1 (Mettacitto kāruṇiko có 1 khoá trùng ở tha-ap140:2.1 mà Việt là Đức Toàn Giác đã ngự đến, không khớp nghĩa Pāli là có tâm từ, có lòng bi; không dùng lại; tha-ap140 có nhiều khoá Việt lệch khỏi Pāli, báo ngoài lát).
  Bốn khoá 1.1 đến 1.4 dùng nguyên văn thi-ap37 và thi-ap40 (2 so với 1 của tha-ap433: kiếp lành lành, thuộc họ Brāhmaṇa). Các khoá 3.1 đến 3.3, 20.3, 21.1, 21.3, 0.1, 0.2 và ba khoá …pe… dùng nguyên văn đa số của tầng (cộng bốn khoá 1.x là 16 khoá giống bản đa số).
  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 21.3, không có nháy đơn; Việt khớp Pāli từng khoá. Khoá 19.2, 20.2, 21.2 là …pe… nên giữ đúng một dấu lược …; Pāli của bài không có (…) trần.
  Bất định, không đưa vào thân kinh: 1.2 brahmabandhu dịch thân quyến của Phạm thiên theo thi-ap37 và thi-ap40 (2 khoá); trong tầng brahmabandhu cũng có nghĩa Bà-la-môn chỉ nhờ dòng họ (thag3.1, thig12.1) nên đây là chỗ có hai cách đọc. 2.3-2.4 Yāvajīvaṁ caritvāna ... brahmacāraṁ tách ở hai khoá, nên phạm hạnh ở 2.4. 4.1-4.4 hiểu Tato cuto là mệnh chung từ cõi Ba mươi ba, tôi là bồ câu trong rừng, và vị tỳ-kheo ở 4.3-4.4 và 5.1-5.4 là một người; Vasate là hiện tại, giữ là cư ngụ. 5.3 mahāvīro nói về vị tỳ-kheo nên viết thường bậc đại anh hùng (tầng viết hoa cho Đức Phật), và 5.4 appamaññāsu dịch các vô lượng tâm theo snp3.5:25.4. 6.1 vinīvaraṇasaṅkappe dịch có tư duy đã thoát khỏi triền cái (saṅkappa có hai cách dịch trong tầng: tư duy và ý định), 6.2 hitāsaye dịch chí hướng vì lợi ích. 6.3 visaṭṭho (hình thức khác của vissattha) và 14.4 saṁvisaṭṭho cùng dịch thân tín; vissattho ở ja346:4.3 dịch tin cậy, và chỉ có 1 tiền lệ nên nghĩa thân tín chưa phân xử được. 7.3 sāmisaṁ deti dịch cho vật chất theo āmisadāna và dhammadāna ở iti98 (bố thí vật chất và bố thí pháp); chủ thể cho là vị tỳ-kheo, đối tượng không nêu trong Pāli, còn nghĩa vật thực cho bồ câu cũng có thể; tầng không có sāmisa. 8.4 pavāso sagharaṁ yathā đọc là như người từ xa trở về nhà mình; đây là chỗ khó nhất bài, chưa có đối chiếu ngoài. 8.2 jinatrajaṁ dịch người con của Đấng Chiến Thắng (tầng không có từ này). 11.3 Vacchagotto dijo có thể là tên riêng hoặc họ Vaccha; dịch dòng họ Vaccha. 11.4 jāyāya ahamokkamiṁ không nêu thai nên dịch nhập thai vợ của vị ấy (okkamati có 3 tiền lệ trong tầng và không có lệ nào về nhập thai). 12.1-12.4 dohaḷa dịch cơn thèm nghén (0 tiền lệ trong tầng), nicchayo dịch quyết định sống ở rừng gắn với khoá 12.3. 13.4 kāsāyena dịch bằng y cà-sa (cà-sa 116 khoá so với ca-sa 3 khoá trong tầng); paṭiggahuṁ là ngôi thứ ba số nhiều nên dịch họ đã đón nhận, chủ thể không nêu. 14.1 siddhattho là thái tử Siddhattha tức Đức Gotama (snp3.11 dịch kumāra là thái tử, 242 khoá thái tử trong tầng), không phải Đức Phật Siddhattha thời trước. 15.1 Sattasārebhinikkhante dịch khi bậc tinh túy của chúng sinh đã xuất gia (sattasāra không có tiền lệ trong tầng); hiểu đó là thái tử Siddhattha. 15.4 himavantamupāgamiṁ dịch núi Himavanta (50 khoá Himavanta so với 8 khoá Tuyết Sơn). 16.1-16.4 Kassapa dhutavādika hiểu là ngài Kassapa nói về hạnh đầu-đà (hạnh đầu-đà 5 khoá, hạnh đầu đà 3 khoá), nhưng Pāli không nêu rõ là Đại Ca-diếp; narasārathi dịch bậc Điều Ngự Trượng Phu theo thag6.1. 17.1 So hiểu là bậc Điều Ngự Trượng Phu ở 16.4 (liền trước), cách đọc khác là ngài Kassapa. 18.2 aphassayiṁ dịch chạm đến, 18.4 sumitta dịch người bạn tốt (hiểu là người bạn ở 14.3 nhưng Pāli không nêu).
  Hệ quả giới hạn: triangulation hạ xuống 7.5 và status giữ draft.
