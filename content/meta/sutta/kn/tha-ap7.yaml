notes: |-
  Dịch TRỰC TIẾP từ Pāli root — không có tầng Anh đã ghim cho tha-ap7, xem blocking_errors. Đối chiếu bằng 366 tệp tha-ap đã có: tự dựng chỉ mục Pāli và Việt trên toàn tầng, 11 khoá của bài này có Pāli trùng nguyên văn ở bài khác, 10 trong số đó dùng lại NGUYÊN VĂN bản Việt đã có; khoá còn lại là 6.4, dùng lại đúng câu của tha-ap32:4.4 nên vẫn trùng nguyên văn, chỉ khác ở chữ vua.
  0.1 Therāpadāna: 290/299 tệp tha-ap giữ nguyên tên Pāli nên theo đa số, KHÔNG dịch thành Trưởng Lão Ký Sự (dạng 9 tệp).
  0.2 Buddhavagga dịch thành Phẩm Phật. Chỉ có MỘT tiền lệ cho đúng Pāli này, ở dhp179:0.3, là Phẩm Phật-đà. Cả 366 tệp tha-ap đều theo khuôn Phẩm cộng tên, và trong Therāpadāna phẩm này gồm chính Đức Phật, Paccekabuddha, các đại vị đệ tử, nên chọn Phẩm Phật. GHI RÕ khác biệt với dhp179 để coordinator gộp; đây là điểm lệch thuật ngữ duy nhất của lát.
  0.3 và khoá .1 cuối: Tuyên Ngợ là dạng đa số (156 lần, đối chọi Ký Sự 81 và Tuyên Ngôn 62); 209 tệp đặt 0.3 đúng bằng tên ở khoá .1 cuối, nên 9.1 dùng lại đúng tên của 0.3.
  BẤT ĐỊNH caturo suppakāsakā ở 6.2: 0 tiền lệ cho suppakāsaka trong toàn tầng. Chọn bốn loại toàn giác trọn vẹn, vì suppakāsaka là tròn trọn như trăng tròn và toàn giác đã có 8 tiền lệ. Không kể danh sách bốn điều vào thân kinh vì Pāli không nêu.
  BẤT ĐỊNH saṅkhittena mahāmuni ở 2.4: dạng phụ trợ nói tóm lắt đứt CUỐI câu kệ, đúng vị trí Pāli; tiếng Việt đọc hơi cụt nhưng không thêm chữ nào không có trong nguồn.
  BẤT ĐỊNH kathāvatthuvisuddhiyā ở 5.4: cách nói gián tiếp trong Pāli, tức hiểu nghĩa Abhidhamma NHỜ sự thanh tịnh của các loại đề tài giáo luận. Giữ đúng quan hệ công cụ, không biến thành mệnh đề khác.
  Tiền lệ thuật ngữ: ba thọ cho vedanā (20 lần), Đại Muni cho mahāmuni (3 lần), thắng trí cho abhiññā, vô ngại giải cho paṭisambhidā, giải thoát cho vimokkhā, và là vua trên bốn châu lục cho catudīpamhi issarā (tha-ap32:4.4, cùng Pāli).
  Cổng kỹ thuật: npm run validate, npm test, npm run check do coordinator chạy; bài này draft nên không cần npm run build. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
