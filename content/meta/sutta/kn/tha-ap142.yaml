notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho tha-ap142.
  Pāli trùng nguyên văn: dựng chỉ mục toàn tầng thì 206/294 khoá của lát có Pāli trùng nguyên văn ở nơi khác; riêng bài này 22/42 khoá trùng và 19 chỗ đã có bản Việt — tỷ lệ cao nhất lát, vì ba kệ cuối là công thức `Paṭisambhidā catasso, …pe…, kataṁ buddhassa sāsanaṁ”` lặp ở hơn 1.700 chỗ trong tầng.
  Đã dùng lại nguyên văn: `:0.1` `Therāpadāna` (921 chỗ) · `:0.2` `Sobhitavagga` → Phẩm Sobhita (5/5 chỗ) · `:2.2` `buddhaṁ lokagganāyakaṁ;` → Đức Phật, bậc Đạo Sư tối thượng giữa thế gian (2 chỗ) · `:3.3` `Paṭiggahesi bhagavā,` → Đức Thế Tôn đã thọ nhận (2 chỗ) · `:3.4` `lokajeṭṭho narāsabho.` → bậc Trưởng Thượng thế gian, đấng Nhân Ngưu (tha-ap117:1.2) · `:4.3` `Tena cittappasādena,` → Nhờ tâm tịnh tín ấy (5 chỗ) · `:4.4` `tattha kālaṅkato ahaṁ.` → ngay tại nơi ấy tôi đã mệnh chung (5 chỗ) · `:5.2` → khi ta đã cúng dường trái cây ấy (1 chỗ) · `:5.3` `Duggatiṁ nābhijānāmi,` → Ta không biết mình rơi vào khổ đau (đa số trong tha-ap: 98/291; nhóm kế 52 lần là Tôi không còn biết đến đọa xứ nào) · `:5.4` → đây là quả báo của việc dâng cúng trái cây (13 chỗ) · `:6.3` → đầy đủ bảy món báu quý giá (14 chỗ) · `:7.1` `Paṭisambhidā catasso,` → Bốn vô ngại giải (942+24 chỗ) · `:7.3` → đã làm tròn lời dạy của Đức Phật (951 chỗ) · `:11.1` `Tassuddānaṁ` → Tóm tắt phẩm này (đa số trong tha-ap: 15/20).
  Số thứ tự uddāna đã đối chiếu bằng danh sách bài trong phẩm, không suy từ tên uid: Sobhitavagga gồm `tha-ap133`–`tha-ap142`, và `0.3` của từng bài trong phẩm cho đúng thứ tự 1 Sobhita · 2 Sudassana · 3 Candana · 4 Pupphacchadana · 5 Raho · 6 Campakapupphi · 7 Atthasandassaka · 8 Ekapasādī (`tha-ap140:0.3` ghi 8) · 9 Sāladada (`tha-ap141:0.3` ghi 9) · 10 người dâng quả (`tha-ap142:0.3` ghi 10). Ứng dụng với `13.1`–`:13.2` `Ekapasādī sāladado, dasamo phaladāyako;` ⇒ Ekapasādī, Sāladada, là thứ mười, người dâng quả. `13.3` `Gāthāyo sattati dve ca` dịch theo đúng con số Pāli là bảy mươi hai bài kệ, không suy ra số khác.
  Tên riêng: `Therāpadāna` giữ nguyên chữ Pāli. Với `Piyālaphaladāyaka` — dạng đủ `Piyālaphaladāyakattheraapadāna` ở `0.3` và dạng `piyālaphaladāyako` ở `8.1` đều là một từ ghép trong Pāli, và dạng rút gọn `Piyālaphaladāyaka` chưa từng xuất hiện trong tầng Việt nên bị chốt Pāli lọt chặn; tôi dịch `phaladāyaka` thành Dâng Quả và giữ riêng `Piyāla` (loại quả, đã có mặt trong tầng) ⇒ Dâng Quả Piyāla, dùng nhất quán ở `0.3`, `3.1`, `8.1`, `9.1`.
  Dấu lược: Pāli có `…pe…` ở đúng một khoá `:7.2`; giữ **đúng một** `…` và không mở rộng. Nội dung bị nén là công thức `Paṭisambhidā catasso, … kataṁ buddhassa sāsanaṁ` đã nêu đủ ngay trong cùng bài, nên giữ lược đúng như peyyāla của Pāli gốc.
  Bất định đã ghi, không che: (1) `āsu` ở `:6.2` là tên một loại chúng sinh, nhưng trong tầng không có tiền lệ dịch nào và cũng không có mục trong `content/glossary/pali-vi.yaml`; tôi dịch chung là chúng sinh thay vì đoán ra tiên nhân hay thần, vì đoán sai sẽ thêm một loại chúng sinh không có trong nguồn. (2) `Deyyadhammo` ở `:2.3` không có tiền lệ trong tầng (cùng câu xuất hiện ở `tha-ap26:3.1` và `tha-ap101:2.1`, cả hai đều chưa dịch); tôi dịch là tôn thờ giáo pháp, đọc `deya-dhamma` theo nghĩa món quà tu hành, và ghi ở đây. (3) `sikhisatthu` ở `:1.4` là người tập huấn trâu, tôi dịch chỗ dạy dỗ con trâu.
  Dấu nháy kép: chỉ 1 cặp `“`/`”` ở Pāli, mở ở `:1.1` và đóng ở `:7.3` kèm `”.`; bản Việt giữ đúng 1 cặp và cân trên cả bài.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Đã tự xác minh được: JSON hợp lệ, đủ 42/42 khoá trong `all` và trùng khớp 42/42 khoá Pāli trong `root/pli/ms/sutta/kn/tha-ap/tha-ap142_root-pli-ms.json`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt vào bản Việt, không trùng nguyên văn Pāli ở khoá có nội dung, và YAML parse sạnh. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Sửa lan 2026-10-13 (cơ học, toàn tầng): khoá tha-ap142:5.3 — `duggatiṁ nābhijānāmi` trước dịch “Ta
  không biết mình rơi vào khổ đau,”, đảo nghĩa (Pāli: không còn biết đến, tức không còn rơi vào, đọa
  xứ nào) → “Ta không còn biết đến đọa xứ,”; giữ nguyên xưng hô của bài. Cùng công thức đã dịch đúng ở
  đa số khoá trong tầng.

  Sửa lan 2026-10-13: khoá tha-ap142:10.1 — `Sobhitavaggo cuddasamo` *Phẩm Sobhita là phẩm thứ
  mười.* → *Phẩm Sobhita là phẩm thứ mười bốn.* Căn cứ: `cuddasama` là thứ mười bốn (Pāli:
  `dhp196:5` `Buddhavaggo cuddasamo`, `ja140:2.2` `Asampadānavaggo cuddasamo`); *thứ mười* là số thứ
  tự của bài trong phẩm ở `10.1` phía trên, không phải của phẩm. Các số khác của bài (31, 15, 72) đã
  kiểm lại: `ekattiṁse` = 31, `pannarase` = 15, `sattati dve ca` = 72.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 42 khoá như người chấm độc lập; bản trước có sai nghĩa thật ở các khoá 1.1–1.4, 2.1, 2.3–2.4 và 6.2, và ba "bất định" ghi ở mục cũ phía trên (āsu, Deyyadhammo, sikhisatthu) thực ra là lỗi đọc Pāli, không phải bất định. Các mục cũ đó được giữ làm lịch sử nhưng KHÔNG còn đúng; đã thay bằng danh sách dưới đây. 12/42 khoá đổi.
  (a) `1.1` `Pārāvato tadā āsiṁ` Thuở ấy tôi là Pārāvā → Thuở ấy tôi là chim bồ câu: `pārāvata` là chim bồ câu, đã dịch như vậy ở `ja395:0.4`, `ja395:7.1`, `ja527:6.4`; Pārāvā không phải danh từ Pāli nào. Sửa chính xác.
  (b) `1.2` `paraṁ anuparodhako` luôn luôn không từ bỏ → không gây hại cho kẻ khác: `paraṁ` là "kẻ khác", `uparodha`/`uparodheti` là làm hại, cắt đứt (`an7.64:14.1`, `pv36:5.4`, `pe6:10.14`), `anuparodhaka` là người không làm hại. Bản cũ không có căn cứ nào trong từ ngữ. Chữ `anuparodhaka` chỉ xuất hiện đúng một lần trong toàn Pāli root nên không so tiền lệ được: nghĩa "không gây hại" dựa vào gốc từ chứ không phải đối chiếu độc lập; còn bất định nhỏ, ghi ở dưới.
  (c) `1.3` `Pabbhāre seyyaṁ kappemi` nằm nghỉ trong chuồng trâu bò → nằm nghỉ trong hang núi: `pabbhāra` là sườn núi nhô ra, hang đá, đã dịch "hang núi / hang" ở `thag10.2:9.2` và `dn16:3.42.5`, `dn16:3.43.2`; "chuồng trâu bò" không có trong Pāli.
  (d) `1.4` `avidūre sikhisatthuno` không xa chỗ dạy dỗ con trâu → không xa bậc Đạo Sư Sikhī: đọc `sikhi` là chim công / người có chỏm là sai; ở đây `sikhī` là tên Đức Phật Sikhī, khớp `5.1` (31 kiếp trước, cùng công thức với các bài về Đức Sikhī) và 18 chỗ khác trong tha-ap dịch "Đức Sikhī" (cùng công thức `ekattiṁse ito kappe` ở các bài đó) (`tha-ap134:2.4`, `tha-ap193:2.4`, `thi-ap38:1.2`…); `satthu` = Đạo Sư, cùng cách dịch `padumuttarasatthuno` → bậc Đạo Sư Padumuttara (`tha-ap82:24.2`).
  (e) `2.1` `Sāyaṁ pātañca passāmi` Buổi tối tôi nhìn xuống thấy → Chiều và sáng, tôi thấy: bản cũ bỏ mất "sáng" (`pāta`) và thêm "nhìn xuống" không có trong Pāli; cặp "chiều và sáng" đã dùng ở `sāyaṁ pātaṁ namassāmi` và nhiều chỗ khác.
  (f) `2.3` `Deyyadhammo ca me natthi` Tôi không có tôn thờ giáo pháp → Tôi không có vật gì để dâng cúng: `deyyadhamma` là vật đáng dâng, lễ vật (món để cúng), không phải "giáo pháp"; khớp nguyên văn tiền lệ `thi-ap10:2.1`, `tha-ap26:3.1` (2/4 chỗ; chỗ thứ ba `tha-ap101:2.1` "giáo pháp nào để trao ban" cũng là lỗi cùng loại, ngoài phạm vi bài này, chưa sửa).
  (g) `2.4` `dvipadindassa tādino` đối với bậc hai chân đáng tôn kính ấy → lên bậc chúa tể loài hai chân, bậc Bất Động: bản cũ làm rơi `inda` (chúa tể) và đổi `tādī` thành "đáng tôn kính" (nghĩa không có). Trong tha-ap, `tādino` đi kèm đúng chữ "Bất Động" ở 26 chỗ, "Vững Vàng" ở 22 chỗ, "đáng tôn kính" ở 10 chỗ; chọn nhóm đông nhất và khớp `tha-ap205:2.4`.
  (h) `3.2` `agamaṁ buddhasantikaṁ` đi đến nơi có Đức Phật → đi đến bên Đức Phật: `santika` là chỗ gần/trước mặt, "bên Đức Phật" có tiền lệ (2 chỗ; "nơi có" chỉ 1/5).
  (i) `4.2` `paricāriṁ vināyakaṁ` phụng sự bậc đạo sư → phụng sự bậc Điều Ngự: `vināyaka` ≠ `satthu`; trong tha-ap `vināyaka` dịch "bậc Điều Ngự" ở 19/28 chỗ, còn "bậc đạo sư" chỉ ở chính khoá này (dễ lẫn với `satthu` ở `1.4`).
  (j) `5.2` `ahaṁ` ta → tôi, và `5.3` `Duggatiṁ nābhijānāmi` Ta không còn biết đến đọa xứ → Tôi không còn biết đến đọa xứ nào: người nói là Trưởng lão kể lại tiền kiếp, và cả bài xưng "tôi" ở `1.1`, `1.3`, `2.1`, `2.3`, `4.2`, `4.4`; chỉ hai khoá này đổi sang "ta" là lệch xưng hô trong cùng một lời kể (theo mục xưng hô của hướng dẫn dịch). "đọa xứ nào" 109 chỗ trong tầng (dạng "đọa xứ," 15 chỗ, "Ta … đọa xứ," 205 chỗ do sửa lan cơ học). Lưu ý sửa lan trước ở `5.3` đã sửa đúng nghĩa nhưng giữ "Ta", nay đã đồng bộ.
  (k) `6.2` `tayo āsuṁ piyālino` có ba vị chúng sinh từng dâng quả Piyāla → có ba vị mang tên Piyāli: `āsuṁ` là động từ "đã có" (`as`), không phải tên một loại chúng sinh; `piyālino` là danh từ số nhiều của `piyālī`, tên riêng; câu nối với `6.4 cakkavattī` là ba vị Chuyển Luân Vương. Khoá cũ bịa ra "từng dâng quả Piyāla" mà Pāli không nói. Khớp `tha-ap183:4.2` `tayo āsuṁ supupphitā` → "Có ba vị mang tên Supupphita". Việc ba vị được gọi theo quả đã dâng là suy ra, không có trong Pāli, nên không đưa vào lời kinh.
  Đã đối chiếu, giữ nguyên: `2.2` (`buddhaṁ lokagganāyakaṁ`, 3 chỗ cùng cách dịch; trong cả tầng `lokagganāyaka` chia gần đều "Dẫn Đạo" và "Đạo Sư" nên không có đa số rõ để đổi), `3.1`, `3.3`–`3.4`, `4.1`, `4.3`–`4.4`, `5.1`, `5.4`, `6.1`, `6.3`–`6.4` (đầy đủ bảy món báu quý giá: 37/51 chỗ), `7.x`, `8.1` (nhóm "những bài kệ này"), `9.1`, `10.1`, `11.1` (44/56 chỗ trong tha-ap là "Tóm tắt phẩm này:"), `12.x`, `13.x` (72 = `sattati dve ca`).
  Điểm đổi (trước → sau): semantic_fidelity 9.3 → 9.0 · grammar_logic 9.3 → 9.0 · terminology 9.2 → 9.0 · vietnamese_clarity 9.3 → 9.2 · ambiguity_integrity 9.2 → 8.8; các điểm còn lại giữ. Điểm không được nâng vì đã sửa: lượt chấm cũ đã quá cao so với 11 chỗ sai nghĩa vừa nêu; điểm sau phản ánh bản đã sửa, vẫn bị trừ vì (1) `anuparodhaka` chỉ có một lần trong Pāli root, (2) `piyālino` hiểu là tên riêng dựa vào song song `tha-ap183`, (3) tầng tham khảo tiếng Anh/Việt hiện hành vắng nên không có đối chiếu độc lập (triangulation giữ 7.5), (4) cách dịch `lokagganāyaka` / `tādī` trong tầng chưa thống nhất.
  Bất định còn lại: (1) `1.2` `anuparodhako` hapax trong Pāli root, nghĩa "không gây hại" suy từ `uparodha`; (2) `6.2` `piyālino` là tên riêng của ba vị vua theo song song `tha-ap183`; (3) `0.3`/`9.1` "Bài Kệ Tuyên Ngôn" so với "Ký Sự": trong Phẩm Sobhita chia 6/4 (`tha-ap133`, `135`, `138`, `141` dùng "Ký Sự"), thuộc quyết định biên tập cho cả phẩm, không đổi ở bài này.
  Cổng kỹ thuật vẫn chưa chạy lại ở lượt này: `npm run validate` · `npm test` · `npm run check` · `npm run build` để coordinator chạy; `technical_integrity: 9.6` giữ nguyên.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 9.1 (và tiêu đề 0.3) — *Bài Kệ Tuyên Ngôn Về Trưởng Lão …* → *Ký Sự Về Trưởng Lão …* (`-ssāpadānaṁ` / `apadāna` là *Ký Sự*; cách dịch này có ở hơn 30 khoá cùng loại trên tầng và ở `tha-ap141`, `tha-ap502`).
