notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho tha-ap142.
  Pāli trùng nguyên văn: dựng chỉ mục toàn tầng thì 206/294 khoá của lát có Pāli trùng nguyên văn ở nơi khác; riêng bài này 22/42 khoá trùng và 19 chỗ đã có bản Việt — tỷ lệ cao nhất lát, vì ba kệ cuối là công thức `Paṭisambhidā catasso, …pe…, kataṁ buddhassa sāsanaṁ”` lặp ở hơn 1.700 chỗ trong tầng.
  Đã dùng lại nguyên văn: `:0.1` `Therāpadāna` (921 chỗ) · `:0.2` `Sobhitavagga` → Phẩm Sobhita (5/5 chỗ) · `:2.2` `buddhaṁ lokagganāyakaṁ;` → Đức Phật, bậc Đạo Sư tối thượng giữa thế gian (2 chỗ) · `:3.3` `Paṭiggahesi bhagavā,` → Đức Thế Tôn đã thọ nhận (2 chỗ) · `:3.4` `lokajeṭṭho narāsabho.` → bậc Trưởng Thượng thế gian, đấng Nhân Ngưu (tha-ap117:1.2) · `:4.3` `Tena cittappasādena,` → Nhờ tâm tịnh tín ấy (5 chỗ) · `:4.4` `tattha kālaṅkato ahaṁ.` → ngay tại nơi ấy tôi đã mệnh chung (5 chỗ) · `:5.2` → khi ta đã cúng dường trái cây ấy (1 chỗ) · `:5.3` `Duggatiṁ nābhijānāmi,` → Ta không biết mình rơi vào khổ đau (đa số trong tha-ap: 98/291; nhóm kế 52 lần là Tôi không còn biết đến đọa xứ nào) · `:5.4` → đây là quả báo của việc dâng cúng trái cây (13 chỗ) · `:6.3` → đầy đủ bảy món báu quý giá (14 chỗ) · `:7.1` `Paṭisambhidā catasso,` → Bốn vô ngại giải (942+24 chỗ) · `:7.3` → đã làm tròn lời dạy của Đức Phật (951 chỗ) · `:11.1` `Tassuddānaṁ` → Tóm tắt phẩm này (đa số trong tha-ap: 15/20).
  Số thứ tự uddāna đã đối chiếu bằng danh sách bài trong phẩm, không suy từ tên uid: Sobhitavagga gồm `tha-ap133`–`tha-ap142`, và `0.3` của từng bài trong phẩm cho đúng thứ tự 1 Sobhita · 2 Sudassana · 3 Candana · 4 Pupphacchadana · 5 Raho · 6 Campakapupphi · 7 Atthasandassaka · 8 Ekapasādī (`tha-ap140:0.3` ghi 8) · 9 Sāladada (`tha-ap141:0.3` ghi 9) · 10 người dâng quả (`tha-ap142:0.3` ghi 10). Ứng dụng với `13.1`–`:13.2` `Ekapasādī sāladado, dasamo phaladāyako;` ⇒ Ekapasādī, Sāladada, là thứ mười, người dâng quả. `13.3` `Gāthāyo sattati dve ca` dịch theo đúng con số Pāli là bảy mươi hai bài kệ, không suy ra số khác.
  Tên riêng: `Therāpadāna` giữ nguyên chữ Pāli. Với `Piyālaphaladāyaka` — dạng đủ `Piyālaphaladāyakattheraapadāna` ở `0.3` và dạng `piyālaphaladāyako` ở `8.1` đều là một từ ghép trong Pāli, và dạng rút gọn `Piyālaphaladāyaka` chưa từng xuất hiện trong tầng Việt nên bị chốt Pāli lọt chặn; tôi dịch `phaladāyaka` thành Dâng Quả và giữ riêng `Piyāla` (loại quả, đã có mặt trong tầng) ⇒ Dâng Quả Piyāla, dùng nhất quán ở `0.3`, `3.1`, `8.1`, `9.1`.
  Dấu lược: Pāli có `…pe…` ở đúng một khoá `:7.2`; giữ **đúng một** `…` và không mở rộng. Nội dung bị nén là công thức `Paṭisambhidā catasso, … kataṁ buddhassa sāsanaṁ` đã nêu đủ ngay trong cùng bài, nên giữ lược đúng như peyyāla của Pāli gốc.
  Bất định đã ghi, không che: (1) `āsu` ở `:6.2` là tên một loại chúng sinh, nhưng trong tầng không có tiền lệ dịch nào và cũng không có mục trong `content/glossary/pali-vi.yaml`; tôi dịch chung là chúng sinh thay vì đoán ra tiên nhân hay thần, vì đoán sai sẽ thêm một loại chúng sinh không có trong nguồn. (2) `Deyyadhammo` ở `:2.3` không có tiền lệ trong tầng (cùng câu xuất hiện ở `tha-ap26:3.1` và `tha-ap101:2.1`, cả hai đều chưa dịch); tôi dịch là tôn thờ giáo pháp, đọc `deya-dhamma` theo nghĩa món quà tu hành, và ghi ở đây. (3) `sikhisatthu` ở `:1.4` là người tập huấn trâu, tôi dịch chỗ dạy dỗ con trâu.
  Dấu nháy kép: chỉ 1 cặp `“`/`”` ở Pāli, mở ở `:1.1` và đóng ở `:7.3` kèm `”.`; bản Việt giữ đúng 1 cặp và cân trên cả bài.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Đã tự xác minh được: JSON hợp lệ, đủ 42/42 khoá trong `all` và trùng khớp 42/42 khoá Pāli trong `root/pli/ms/sutta/kn/tha-ap/tha-ap142_root-pli-ms.json`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt vào bản Việt, không trùng nguyên văn Pāli ở khoá có nội dung, và YAML parse sạnh. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.