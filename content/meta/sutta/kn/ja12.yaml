  Đã đọc hết Pāli qua v4/p4.txt. Đối chiếu bản Anh Sujato ở 8/9 khoá (chỉ dòng kết 2.1 Sujato để trống); tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Mọi segment Pāli đều dưới 40 ký tự nên không có segment nội dung theo ngưỡng coverage — Pāli đứng một mình ở dòng kết, dịch theo công thức đã publish.
  Tiền lệ (đếm trong tầng Việt dự án): 0.1 giữ Jātaka và 0.2 Bộ Một Bài Kinh theo ja1, ja159; Sīlavagga → Phẩm Giới (20 chỗ Phẩm Giới; Sujato: Ethics); miga → nai (con nai 16); Nigrodha giữ nguyên tên riêng theo tiền lệ du sĩ Nigrodha ở dn25; seveyya → gần gũi (158); mataṁ seyyo ... jīvitaṁ → Thà chết ... còn hơn ...; colophon Kinh ... thứ hai theo ja1:3.1, không phẩy.
  0 tiền lệ, đặt mới, ghi lý do: Sākha giữ nguyên tên riêng (trong bài là tên con nai chúa, đối xứng với Nigrodha; Sujato dịch nghĩa là Branch nhưng tầng Việt giữ Nigrodha làm tên nên giữ cả hai để đối xứng); upasaṁvasati → chung sống (3 tiền lệ, tương phản với gần gũi ở 1.1).
  Không blocker. Triangulation 9.0 vì có Sujato ở cả bốn vế kệ lẫn tiêu đề, trừ dòng kết chỉ có Pāli.
