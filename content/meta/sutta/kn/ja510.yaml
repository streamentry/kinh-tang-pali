notes: |-
  Đợt 19, làn 77. Dịch từ Pāli root commit đã ghim, đủ 107/107 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có phần kệ (khoá 1 là bài kệ mở đầu, khoá 2–22 là 21 bài kệ cùng điệp khúc về Tử thần, khoá 23–24 là hai bài kệ về Pháp), không có văn xuôi khung truyện; người nói không được ghi vào thân kinh mà chỉ suy từ nội dung kệ (xem BẤT ĐỊNH, mục 9). Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề và colophon.**
  - `0.2` “Bộ Hai Mươi Bài Kinh” và `0.3` “Phẩm Mātaṅga”: dùng lại nguyên văn `ja497:0.2`, `ja497:0.3` và `ja508:0.2`, `ja508:0.3` (cùng bộ Vīsatinipāta, cùng phẩm Mātaṅga).
  - `0.4` “14. Kinh Ayoghara” (`Ayogharajātaka`): “Kinh” + tên, theo `ja391` (“Kinh Vijjādhara”) và `ja497` (“Kinh Mātaṅga”). `Ayoghara` giữ nguyên tên Pāli: trong bản root, uddāna (`28.4`) chỉ ghi `ayogharāti` như tên một bài, không có văn xuôi để xác định nghĩa “nhà sắt” có phải là tên người hay tên nơi, nên không dịch nghĩa ghép `ayo` + `ghara` vào tiêu đề. Số `14` ở `0.4` khớp `cuddasamaṁ` (14) ở `25.1`.
  - `25.1` “Kinh Ayoghara, thứ mười bốn.”: có dấu phẩy trước số thứ tự, theo `ja508` (cùng bộ). Đo trên các colophon `…jātakaṁ …maṁ.` đã có bản Việt: từ `ja400` trở lên 44 khoá có dấu phẩy so với 20 không; toàn bộ `ja` là 171 so với 130. `ja497` (“Kinh Mātaṅga thứ nhất.”) không có dấu phẩy, nên bộ chưa đồng nhất.
  - `26.1` “Bộ Hai Mươi Bài Kinh đã hoàn tất.”: theo `ja473:14.1`, `ja483:20.1`, `ja496:22.1` (“Bộ Mười Hai/Mười Ba Bài Kinh … đã hoàn tất”, “Bộ Tạp Tập đã hoàn tất”).
  - `27.1` `Tassuddānaṁ` → “Tóm lược:”: ở chỗ kết một nipāta, 7/7 khoá (`ja463:16.1`, `ja473:15.1`, `ja483:21.1`, `ja496:23.1`, `ja438:12.1`, `ja454:18.1`, `ja426:11.1`) dịch đúng “Tóm lược:” (ba lát gần nhất `ja473`, `ja483`, `ja496` đồng nhất); các dạng khác (“Kệ tóm tắt của phẩm ấy:”, “Tóm tắt phẩm này:”…) thuộc cấp phẩm chứ không phải cấp nipāta.
  - `28.1`–`28.4` (kệ tóm lược, uddāna): tên các bài giữ nguyên Pāli, bỏ đuôi cách (`sirimanto` → “Sirimanta”, `sarabhoti` → “Sarabha” ở `ja483:22.4`), theo khuôn `ja463:17`, `ja473:16`, `ja483:22`, `ja496:24`. Dòng `28.3` kết bằng `pañca-` và `28.4` mở bằng `Paṇḍita` (một tên bài bị cắt ngang ranh giới khoá); bản Việt giữ đúng cắt đó (“Pañca-” / “Paṇḍita”), như `ja463:17.3`–`17.4` (“Dasa-” / “ratha”). Đã dò: uddāna liệt kê 14 tên (Mātaṅga, Sambhūta, Sivi, Sirimanta, Rohaṇa, Haṁsa, Sattigumba, Bhallātiya, Somanassa, Campeyya, Brahma, Pañca-Paṇḍita, Cirassaṁvata, Ayoghara) khớp 14 số thứ tự của phẩm: bài số 11 là `ja507` (`Mahāpalobhanajātaka`), số 12 là `ja508` (`Pañcapaṇḍitajātaka`), số 13 là `ja509` (`Hatthipālajātaka`), số 14 là `ja510`, theo `0.4` của chính các bài đó. Hai tên ở vị trí 11 và 13 (`Brahma`, `Cirassaṁvata`) không trùng tên bài (`Mahāpalobhana`, `Hatthipāla`); có thể uddāna lấy chữ khác trong bài, không xác nhận được từ bản root nên giữ nguyên chữ Pāli, không giải thích. Không thêm “mười bốn bài” vì Pāli không có số.

  **Tiền lệ dùng lại nguyên văn.** Đã dò 252 cặp (khoá của bài × khoá khác trong tầng Pāli ghim) có Pāli trùng nguyên văn sau khi bỏ dấu câu; 181 cặp trong đó có bản Việt, thuộc 10 khoá của bài: `0.2`, `0.3`, `23.1`–`23.4`, `24.1`–`24.3`, `27.1`. Dùng lại nguyên văn bản Việt có sẵn cho 9 khoá: `0.2`, `0.3`; `23.1` theo `ja447:12.1` (cùng Pāli, không có nháy mở), `23.2` theo `ja447:11.2` và `snp1.10:7.2`, `23.3` theo `ja447:11.3` và `thag4.10:1.3`, `23.4` theo `ja447:11.4` và `thag4.10:1.4`; `24.1`–`24.3` theo `thag4.10:2.1`–`2.3`. `24.4` có Pāli khác `thag4.10:2.4` (`suggatin”ti` so với `suggatiṁ`) nên viết lại “Chánh pháp đưa đến thiện thú.” + nháy đóng, theo `thag4.10:2.4`. Cặp bản Việt khác: `23.2` so với `thag4.10:1.2` (“mang lại an lạc” so với “đem lại an vui”): đã chọn dạng của `ja447` và `snp1.10:7.2` (2/3); `27.1` đã giải thích ở trên (cặp khác nói đến các cấp khác). 0 khoá còn lại dùng lại nguyên văn mà bản Việt khác. Hai khoá `10.2` (`ja524:50.2`) và `24.3` (`ja530:13.3`) có Pāli trùng nhưng bài kia chưa có bản Việt, nên không đo được.

  **Trùng nguyên văn trong chính bài (có kết quả):** 3 nhóm Pāli trùng nguyên văn, và cả 3 đều đã dịch giống hệt nhau (0 cặp lệch):
  - điệp khúc `2.4`, `3.4`, … `22.4` (21 khoá, `Taṁ me matī hoti carāmi dhammaṁ.`);
  - `4.1` với `5.1` (`Hatthīhi assehi rathehi pattibhi,`): được viết thành một câu không chứa chủ ngữ hay động từ để đứng đúng cho cả `4.2` (`Parivāritā …`) lẫn `5.2` (`Sūrā pabhañjanti …`);
  - `13.3` với `15.3` (`Na maccuno nijjhapanaṁ karonti,`).
  Hai nhóm gần trùng chỉ khác dạng từ: `12.1` (`Yakkhā pisācā athavāpi petā,`) với `13.1` (`Yakkhe pisāce athavāpi pete,`) và `14.1` với `15.1`; cả hai cặp được dịch cùng chữ vì khác nhau chỉ ở cách (chủ cách/đối cách), mà câu Việt không thể hiện cách.

  **Số Pāli:** không có phép tính nào. `cuddasamaṁ` (`25.1`) = 14, khớp `14.` ở `0.4` và số thứ tự 14 của `ayogharāti` trong uddāna; `vīsati` (`0.2`) = 20; `caturaṅginiṁ senaṁ` (`3.1`) = “bốn binh chủng” (voi, ngựa, xe, bộ binh, đúng bốn thứ liệt kê ở `4.1`/`5.1`). `eka` ở `yamekarattiṁ` (`1.1`) = “một” (“đêm đầu tiên”, đi với `paṭhamaṁ`). Không gặp cụm số nào chưa phân xử được (không có `Tiṁsakappasahassa`).

  **Thuật ngữ và tiền lệ đã đo (toàn tầng `kn`, trừ khi ghi khác):**
  - `maccu` → “Tử thần”: 34 khoá (“Tử thần” 7, “tử thần” 26, “Tử Thần” 1) so với 13 khoá “Thần Chết”/“thần chết” (11 + 2). `maccurāja` (`16.3`, `22.3`) → “Tử vương”: 7 khoá “Tử vương” (`dhp170:4`, `dhp288:3`, `ud2.7:5.4`, `ud5.10:4.6`, `thag6.7:1.4`, `iti69:4.4`…) so với 1 “Vua Thần Chết” (`snp2.10`), 2 “Thần chết” (`snp5.16`) và 7 khoá “Diêm vương”/“Diêm Vương” (trong đó `ja240:2.3` dịch `maccurājaṁ`); `dhp170:4` (“Tử vương không thấy được”) là dạng gần nhất với `22.3`.
  - `Dhamma`, `dhammacārī` → “Pháp”, “Chánh pháp”, “người thực hành Chánh pháp”: dùng lại trọn bộ lời của `ja447`/`thag4.10` cho `23`–`24`; điệp khúc `carāmi dhammaṁ` → “ta thực hành Chánh pháp” để cùng một chữ với `dhammacārī` ở `23.1`, `23.4`.
  - `yakkha` → “dạ-xoa”: 22 khoá trong `ja` dùng “dạ-xoa” (và 7 khoá “Dạ-xoa” viết hoa), 0 khoá viết “dạ xoa”. `pisāca` → “quỷ pisāca”: 1 khoá (`ja347:3.3`), 13 khoá có `pisāc-` (còn lại là “con quỷ”, “ma quỷ”); chọn dạng có tên để không lẫn với `peta`. `peta` → “ngạ quỷ”: theo `pv19:11.3` (`Petā hi kira jānanti` → “ngạ quỷ”); ở chỗ khác `peta` là “người đã khuất” (`kp7`, `snp3.8`, `ja461:8.3`), nhưng ở đây `peta` đi cùng `yakkha`/`pisāca` nên chọn nghĩa loài ngạ quỷ.
  - `khattiya` → “Sát-đế-lợi”: toàn tầng 61 khoá “Sát-đế-lợi” (57 ngoài `ja`, 4 trong `ja`) so với 20 khoá “khattiya”/“Khattiya” (6 trong `ja`); trong `ja` hai dạng gần ngang nhau (4 “Sát-đế-lợi” so với 6 “khattiya”/“Khattiya”), nên theo đa số toàn tầng. `brāhmaṇa` → “bà-la-môn” viết thường: 88 khoá so với 49 khoá “Bà-la-môn” trong `ja`.
  - `akkhaṇavedhī` (`7.2`) → “trúng đích chính xác”: theo `ja181:1.3` (`Dūrepātī akkhaṇavedhī` → “bắn xa được, trúng đích chính xác”); 1 tiền lệ.
  - `upadduta` (`2.3`) → “bị … hành hạ”: theo `cp15:6.1` (“bị hành hạ”) và tầng Sujato `thag19.1:3.4` (`maccujarāyupaddutaṁ` → “harried by death and old age”); `jātijarā` → “sinh và già”.
  - `dūsaka` (`14.1`, `15.1`) → “kẻ phá hoại”: theo `ja250:2.3`, `ja46`, `ja268` và `snp1.5:7.2` (“phá hoại gia đình”); `heṭhaka` → “kẻ gây hại” (0 tiền lệ cho danh từ; `mil5.5.5` có `aviheṭhaka` → “không gây hại”); `aparādhaka` → “kẻ phạm lỗi” (0 tiền lệ).
  - `dhutta` (`9.3`) → “kẻ chơi bời”: theo `ja317:4.1` (`Dhuttā ca soṇḍā` → “Kẻ chơi bời, nghiện ngập”); `ja365:1.1` dịch “kẻ lêu lổng mê cờ bạc”, `snp1.6:17.2` có nghĩa cờ bạc ở `akkhadhutto`; chọn nghĩa rộng nhất.
  - `calācala` (`9.2`) → “chông chênh, lay động”: `ja464:4.3` dịch “lay động”; thêm “chông chênh” để giữ nghĩa lặp gốc `cala` + `acala` (“lay động và không lay động” hiểu là “lúc lay động, lúc đứng”, tức bất định).
  - `kālapariyāya` (`8.3`) → “vòng xoay của thời gian”: `ja345:2.4` dịch “lúc mạng sống chấm dứt” ở một câu khác; `ja534` có thêm 3 khoá nhưng chưa có bản Việt. Chọn nghĩa đen “sự luân chuyển của thời gian”, 1 tiền lệ khác nghĩa.
  - `katahattha` (`7.1`) → “đã luyện tay thuần thục”: 3 khoá có `katahatth-` trong tầng Pāli (`ja514:5.2`, `ja542:121.3`, `mil6.4.2:17.1`), 0 khoá nào đã được dịch ở dạng này.
  - `kūlaja` (`9.3`) → “cây mọc ở mép bờ”: 0 tiền lệ; `kūla` = bờ, `-ja` = sinh ra ở.
  - `majjhimaporisa` (`10.3`) → “người trung niên”: 2 khoá Pāli (`ja547:139.2`, `ja547:652.2`), 0 bản Việt.
  - `vijjādhara` (`22.1`) → “bậc trì chú”: `mil6.2.4:1.1` dịch “các bậc trì chú”, `mil5.2.4` dịch “vị giữ minh chú”; chọn dạng đầu (xuất hiện ở bản liệt kê loài hữu tình, ngắn hơn).
  - `māyākāra` (`18.1`) → “người làm ảo thuật”: 0 tiền lệ trong tầng đã dịch (`ja546:64.2` chưa có bản Việt); `raṅgamajjhe` → “giữa sân khấu”: 0 tiền lệ (`tha-ap537:14.2`, `thi-ap17:154.2` chưa có bản Việt).
  - `sūrā` (`5.2`) → “dũng sĩ”; `vīrā` (`7.1`) → “dũng sĩ”: cùng một chữ ở hai chỗ vì cả hai đều chỉ người chiến đấu bằng binh khí; `snp3.7:8.7` dịch `sūrā` là “dũng mãnh”.
  - `pasayha` (`3.2`, `17.2`) → “dùng sức (mạnh)”: 17 khoá tầng Pāli có `pasayha` (như `snp1.3:38.1`); chưa đối chiếu được bản Việt nào của dạng này, nên đây là lựa chọn của bài.

  **Dấu câu (khớp Pāli từng khoá).** Nháy kép `“`/`”`: Pāli 1/1 (`“` ở `1.1`, `”` ở `24.4`), Việt 1/1, lệch 0/107 khoá. Nháy đơn `‘`/`’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0 khoá, Việt 0, nên không có gì để cân (phép này chạy rỗng, không phải đã kiểm). Cấu trúc nháy: cả bài kệ `1`–`24` là một lời trích duy nhất mở ở `1.1` và đóng ở `24.4`, nên các khoá `1.2`–`24.3` không có dấu nháy trong cả Pāli lẫn Việt.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `assasanti`, `assasitu` (`12.2`, `12.3`): dịch sát “phà hơi vào”, nghĩa là thở/hắt hơi vào loài người (một kiểu tấn công của dạ-xoa). `assasati` (ā- + sas “thở”) thường có nghĩa “thở, lấy lại hơi”; khoá `ja536:53.2` (`Dīghañca assasati dukkhavedinī`) cũng dùng `assasati` theo nghĩa “thở” nhưng chưa có bản Việt. Không tìm thấy dạng `assasanti` + đối cách người ở nơi nào khác trong tầng (0 khoá). Cách đọc khác: “làm cho kinh sợ/làm cho phấn chấn” (từ `assāseti`). Ngữ cảnh (dạ-xoa nổi giận, đối lại `nijjhapanaṁ` “xoa dịu” ở `13`) ủng hộ nghĩa gây hại, nhưng không phân xử được chữ.
  2. `na yujjhamānā na balenavassitā … na jīranti na cāpi miyyare` (`2.1`–`2.2`): hai phủ định `na` đi trước và động từ `na jīranti` cũng phủ định. Đọc theo mạch bài (điệp khúc: “tất cả đều bị sinh và già hành hạ”), nghĩa là “dù giao chiến hay cậy sức mạnh, loài người cũng không thoát già, không thoát chết”. Bản Việt dịch theo nghĩa đó bằng “Dù … dù … cũng không thoát khỏi”, không dịch sát từng chữ `na`. `balenavassitā` được đọc là “cậy vào sức mạnh” (`bala` + `avassita`), nhưng dạng `avassita` ở đây không có tiền lệ trong tầng (0 khoá).
  3. `vayo` (`11.1`): dịch “tuổi xuân”, vì câu đối lập với `jiṇṇassa` “người già” ở `11.3` và `tārakarājasannibho` “giống vua các vì sao” (vầng trăng, tức thứ đầy rồi lại khuyết và trở lại). Nghĩa trung tính của `vaya` là “tuổi, thời kỳ của đời”. Ẩn dụ “vầng trăng trở lại, tuổi xuân không trở lại” là suy từ cấu trúc, chưa có chú giải để xác nhận; nên không thêm vế “vầng trăng” vào thân kinh.
  4. `bhinnagaḷā` (`6.1`): `gaḷa` là “cổ” (cổ họng), nên dịch “cổ nứt vỡ, tiết dịch” (cạnh `pabhinnā`, voi say tiết dịch); trong ngữ cảnh voi say, có thể hiểu là “thái dương” (như `gaṇḍa`). 0 tiền lệ cho `bhinnagaḷa`. Không giải thích thêm trong thân kinh.
  5. `Paṭova dhuttassa` (`9.3`): dịch “như tấm vải của kẻ chơi bời”. Không rõ hình ảnh chính xác (vải bị đem cầm cố/đánh cược, hay vải trải làm bàn cờ). Dịch sát chữ, không thêm hình ảnh. `dhutta` đọc theo nghĩa rộng (xem mục thuật ngữ).
  6. `Dhammantarī vettaraṇī ca bhojo` (`21.1`): đọc là ba tên các vị thầy thuốc (`Dhammantarī`, `Vettaraṇī`, `Bhoja`) vì đi cùng `visāni hantvāna` “đã hóa giải nọc độc” ở `21.2`; không có nơi nào khác trong tầng ghi `Dhammantarī` kèm hai tên kia (`mil6.2.8:1.2` có `Dhammantarī` trong một danh sách thầy thuốc). `Vettaraṇī` còn là tên con sông địa ngục (`Vetaraṇī`); `Bhoja` cũng có thể là danh xưng. Giữ nguyên tên Pāli; không gán chức danh vào thân kinh.
  7. `Na maccuno daṭṭhavisaṁ hananti` (`20.3`): dịch “nhưng nọc độc từ vết cắn của Tử thần thì họ không hóa giải được”, đọc `maccuno` là sở hữu cách của người cắn, `daṭṭhavisa` là “nọc độc do vết cắn”. Cách đọc khác: `daṭṭha` là “người bị cắn”, nghĩa “họ không hóa giải nọc độc của người bị Tử thần cắn”; hai cách cho cùng một nghĩa chính. Chữ “không … được” là suy từ cấu trúc đối lập (các câu ngay trước đều dùng `hananti` khẳng định).
  8. `Na maccurājassa vajantadassanaṁ` (`22.3`): đọc `vajantadassanaṁ` là `vajantā` + `adassanaṁ` (nén nguyên âm `a`), nghĩa “họ không đi vào chỗ vô hình đối với Tử vương”; `dhp170:4`/`ud5.10:4.6` (`adassanaṁ maccurājassa gacche`) ủng hộ cách đọc này (2 khoá song hành). `ghoramadhīyamānā` (`22.1`): `adhīyamāna` “đang học/tụng” với đối tượng `ghoraṁ` “điều ghê gớm” (không có danh từ đi kèm như `mantaṁ`, `vijjaṁ`), nên dịch “những điều ghê gớm”, không thêm chữ “chú thuật”.
  9. Người nói không có trong tầng Pāli đã ghim: `1`–`24` là một lời trích mở ở `1.1` và đóng ở `24.4`, xưng “ta” (`me`, `carāmi`); người nói được suy là nhân vật chính của truyện (chưa xác định được trong bản root) nhưng không ghi vào thân kinh. Các đại từ Việt (“ta”) chỉ theo ngôi thứ nhất của `me`/`carāmi`.
  10. `muccare` ở `4.2` không có tân ngữ: dịch “có một số người thoát được” (không thêm “khỏi nguy hiểm”); `Sūrā pabhañjanti padhaṁsayanti` (`5.2`) cũng không có tân ngữ nên dịch “đập tan và áp đảo” không kèm “kẻ địch”. `parivāritā` (`4.2`) → “được vây quanh” (bị vây hay được hộ tống đều có thể; giữ nguyên chữ).
  11. `Taṁ me matī hoti carāmi dhammaṁ` (điệp khúc): dịch “Vì vậy ta nghĩ: ta thực hành Chánh pháp.” `matī` (ý nghĩ, quan niệm) → “nghĩ”; `taṁ` → “vì vậy” (nối với ý của câu trước). Chữ “vì vậy” là đọc `taṁ` như liên từ; cách đọc khác là đại từ chỉ “điều ấy là ý ta”. Cùng nghĩa chính. 0 tiền lệ cho `matī` ở nghĩa này (hai khoá còn lại, `ja452:1.2` “sáng suốt” và `thag10.3:9.2` “trí tuệ”, là nghĩa khác).
  12. `uggatejā` (`19.1`) → “uy lực dữ dội”: `teja` ở đây là uy lực/độc lực; không rõ là độc tính hay vẻ uy hiếp; giữ chữ trung tính.
  13. `athavāpi` (`12.1`, `13.1`) → “hay cả”: nghĩa “hoặc cả”; không thêm “thậm chí”.
  14. `Na hi dhammo adhammo ca, ubho samavipākino` (`24.1`–`24.2`): dùng lại nguyên văn `thag4.10:2.1`–`2.2` theo quy tắc dùng lại tiền lệ (“Không phải Pháp và phi Pháp, cả hai đều đưa lại cùng một quả báo;”). Câu Việt này có thể bị đọc nhầm là “Pháp và phi Pháp không tồn tại, cả hai cùng quả báo”; nghĩa Pāli (đối chiếu `thag4.10:2.3`–`2.4` và Sujato `thag4.10:2`: “Dhamma and what is not Dhamma lead to the same results” bị phủ định, tức Pháp và phi Pháp không cùng một quả) là “Pháp và phi Pháp không có cùng một quả báo”. Không sửa riêng ở bài này để giữ nhất quán với tầng; nên sửa đồng thời `thag4.10:2.1`–`2.2` và `ja510:24.1`–`24.2` (và các bài khác có cùng Pāli, nếu có) khi người biên tập phán.
  15. `māṇavo`, `māṇavā` (`1.2`, `10.1`) → “con người”: trong văn xuôi, tầng thường dịch `māṇava` là “thanh niên”/“học trò” (138 khoá có `māṇav-`, như `snp3.5`, `ud5.9`). Ở đây `10.1`–`10.3` liệt kê “trẻ”, “già”, “đàn bà”, “đàn ông”, “trung niên” ngay sau `māṇavā`, và `1.2` nói về một sinh thể vào thai, nên “thanh niên” sẽ hẹp hơn Pāli; chọn nghĩa chung. 0 tiền lệ cho `māṇava` trong kệ.

