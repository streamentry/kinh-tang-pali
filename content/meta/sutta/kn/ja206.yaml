notes: |-
  Lát v7/7: 12 bài Jātaka Ekakanipāta (Dūkaṇipāta), 156 khoá, dịch đủ MỌI khoá
  trong `all` của v7/v7.json. Đã đọc HẾT v7/p7.txt trước khi viết.

  **Sàn coverage 80% KHÔNG kích hoạt — nhưng ô Anh trống KHÔNG phải sự đồng
  thuận.** Đo được: mọi vế kệ của Ekakanipāta đều NGẮN HƠN 40 ký tự (156 khoá,
  `substantiveSegments = 0`), nên `englishCoverageFor` cho `ratio = 1` và bài
  không cần entry trong `content/meta/reference-gaps.yaml`. Hệ quả thật: hàm
  `kiểm()` của `_hvi.py` lọc `cần = [k for k in p if len(p[k]) >= 40 …]` nên
  `cần` RỖNG ở cả 12 bài, và **NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu
  lược không tự chạy**. Tôi đã tự kiểm thủ công đủ 156 khoá bằng một lớp kiểm
  riêng áp đúng các quy tắc đó lên MỌI khoá (0 lỗi), và đọc đối kháng từng cặp
  Pāli ↔ Việt. Tầng Việt tham khảo (Hòa thượng Thích Minh Châu) ở commit đã
  ghim chỉ có Pháp Cú, nên không có bản Việt nào để đối chiếu cho 12 bài này —
  đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho.

  **Dấu lược:** không khoá nào trong 12 bài có `…pe…` hay `…`, nên cả hai phía
  đều 0. Không mở rộng, không thêm, không bớt.

  **Ngoại lệ đã đo, không phải lỗi:** khoá `:0.1` = `Jātaka` trùng nguyên văn
  Pāli ở **128/128** tệp `kn/ja*` có cả hai khoá (đếm bằng script, không suy đoán).
  Tôi giữ nguyên theo đúng tiền lệ ấy và nêu ở đây.

  **Thiếu tầng Anh:** xem `blocking_errors`. Chỗ nào Sujato im lặng thì tôi dịch
  từ Pāli; ô Anh trống ở đây KHÔNG được đọc là đồng thuận về cách dịch.
  ⚠ **Tiêu đề `Kuruṅgamigajātaka` trùng nguyên văn với `ja21:0.4`/`ja21:2.1`
  (published).** Theo TIEN_LE_PHAI.md tôi dùng lại đúng "Kinh Nai Bốn Sừng",
  dù `kuruṅga` đúng ra là **nai có đốm** và cách dịch đó hơi đặc biệt. Tôi **không
  sửa `ja21`** (ngoài phạm vi lát). Nếu người biên tập thấy "Nai Bốn Sừng" là
  nhầm, thì đó là một quyết định để xem lại cho **cả hai** bài cùng lúc — tôi
  báo ở đây thay vì tự quyết.

  **Lỗi đã sửa trong review:** `vaṭṭamayaṁ pāsaṁ` bản nháp tôi dịch "cái vòng
  trói ấy", làm mất `vaṭṭamaya` (làm bằng mấy vòng/mắt). Đã sửa thành "sợi dây
  trói xoắn thành vòng". `pāsa` = dây trói/bẫy; tiền lệ "dây trói" có 2 lần,
  "dây bẫy" 2 lần trong tầng `kn`.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja206:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  **Sửa lan 2026-10-13 (accuracy fix):** `2.1`–`2.4` bản cũ *Con rùa làm bẩn dòng nước, / nai có đốm làm bẩn cả khu rừng; / bị ném ra khỏi đống rác bảy lần, / vẫn còn đuổi con cái ra xa* — sai: `pāvisī` là *đã vào* (aorist của `pavisati`, không phải *làm bẩn*); `satapatto` (`:2.3`) là con chim gõ kiến, chủ ngữ của `apānayī`, không phải *bảy lần* (`sata` + `patta` = trăm cánh, tên chim; `ja279:0.4`/`1.5` cùng từ → *chim gõ kiến*; `mil7.6.10:7.3` cũng kể chim này); `dumaggamhā` = *từ ngọn cây* (`dumagga` + `-mhā`, cách xuất xứ); `dūre putte apānayī` = *đã đưa các con đi xa*. Bản mới: *Con rùa đã vào nước, / nai có đốm đã vào rừng; / chim gõ kiến từ ngọn cây / đã đưa các con đi xa.* Chưa sửa, nghi ngờ: `1.3`–`1.4` `Ahaṁ tathā karissāmi yathā nehiti luddako` (bản hiện hành *Ta sẽ làm đúng như lời ngươi nói, kẻ tham lam ơi* thêm *như lời ngươi nói* và đọc `luddako` — chủ ngữ — thành hô ngữ; `nehiti` rất có thể là `na` + `ehiti` = *sẽ không đến*). Điểm số giữ nguyên.

  **Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan):** đọc đối kháng đủ 13/13 khoá. Điểm
  cũ (9,11, published) **bị thổi phồng**: lúc chấm, bản dịch sai nghĩa ở `1.1`, `1.3`–`1.4`,
  `2.1`–`2.4` và `0.3` — tức hầu hết lời kệ. Sáu khoá đổi lượt này:
  - `1.1` *Nhìn kìa, sợi dây trói xoắn thành vòng;* → *Nào, sợi dây bẫy thắt vòng,* — accuracy fix.
    `iṅgha` là tiểu từ thúc giục (*nào*), không phải *nhìn kìa*; tiền lệ tầng `kn/ja*`: *Nào* ở
    đa số khoá `iṅgha` (ja542, ja547, ja516, ja507, ja238…). `pāsa` ở đây là cái bẫy con nai mắc
    vào → *dây bẫy* (ja164/ja399 *dây bẫy*, ja359:1.3 `Chinda vārattikaṁ pāsaṁ` → *cắn đứt dây
    bẫy*). Bỏ *xoắn* (không có căn cứ trong Pāli). Dấu `;` cuối vế cũ cũng lệch Pāli (`,`).
  - `1.2` *hãy cắn bằng răng, con rùa;* → *rùa ơi, hãy dùng răng cắn đứt;* — accuracy fix: `chinda`
    là *cắt/cắn đứt*, bản cũ mất nghĩa *đứt*.
  - `1.3`–`1.4` *Ta sẽ làm đúng như lời ngươi nói, / kẻ tham lam ơi* → *Tôi sẽ lo liệu sao cho /
    người thợ săn không đến* — accuracy fix, lỗi chủ thể + phủ định. `tathā … yathā` là *làm sao
    cho*; `nehiti` = `na` + `ehiti` (vị lai của `eti`) = *sẽ không đến*; `luddako` là **chủ ngữ**
    danh cách (*người thợ săn*: ja501:9.1, ja514:35.4, ja547:315.2), không phải hô ngữ *kẻ tham
    lam*. *như lời ngươi nói* không có trong Pāli. Người nói là chim gõ kiến nói với bạn rùa (ngang
    hàng) → *tôi*.
  - `2.2` *nai có đốm* → *nai bốn sừng* — terminology fix: cùng `kuruṅga` với tiêu đề `0.4`/`3.1`
    của chính bài (*Nai Bốn Sừng*) và `ja21:1.1` (*Nai bốn sừng*, theo Sujato ja21 *four-horned
    antelope*). Ghi chú cũ nói `kuruṅga` *đúng ra là nai có đốm* không dẫn được căn cứ; rút lại.
  - `0.3` *Phẩm Bó Lúa* → *Phẩm Không Bền Chắc* — accuracy fix. `Nataṁdaḷhavagga` lấy tên từ câu
    mở `ja201:1.1` `Na taṁ daḷhaṁ bandhanamāhu dhīrā` (*người trí không gọi đó là trói buộc chắc
    chắn*); tầng tên của SuttaCentral đã ghim ghi `ja-name:223.ja-natamdalhavagga` → *"That is Not
    Strong"*. Không có chữ nào mang nghĩa *bó lúa*. ⚠ Chín bài cùng phẩm (`ja201`–`ja205`,
    `ja207`–`ja210`) **vẫn** ghi *Phẩm Bó Lúa* (10/10 trước lượt này); ngoài phạm vi lượt, chưa
    sửa — cần sửa lan đồng loạt để các trang cùng phẩm khớp nhau.
  - Giữ nguyên `2.1`, `2.3`, `2.4` (sửa lan đã đúng: `pāvisī` *đã vào*, `satapatto` chim gõ kiến,
    `dumaggamhā` *từ ngọn cây*, `apānayī` *đưa đi*), `0.2`, `0.4`, `3.1`.

  **Bất định còn lại (giữ, không đoán):** `vaṭṭamaya` (`1.1`). Bản dịch bám nghĩa gốc kiểm được
  của `vaṭṭa` (*vòng, tròn*) + `-maya` (*làm bằng*) → *dây bẫy thắt vòng*. Có khả năng đây là một
  dạng đọc khác của từ chỉ **dây da** (bẫy bằng dây da) — kho không có từ điển hay chú giải để kiểm,
  bản chụp không có bản Anh hay bản Việt cho bài, và toàn tầng Pāli gốc chỉ có một lần xuất hiện
  (hapax trong kho). Nếu kiểm được, `1.1` nên đổi thành *dây bẫy bằng da*.

  Tự kiểm: tập khoá 13/13, đúng thứ tự Pāli; nháy kép/đơn khớp Pāli từng khoá 13/13; 0 cặp Pāli
  trùng nguyên văn trong bài (phép rỗng); không có `…` ở cả hai phía; NFC sạch; không có số Pāli.
  Coverage English: mẫu số = 0 (mọi vế kệ < 40 ký tự) nên cổng không đo được gì; bản chụp không
  phát hành bản Anh cho bài — blocker giữ nguyên. Chưa chạy `npm run validate` · `npm test` ·
  `npm run check` · `npm run build`; `technical_integrity` giữ 9,6.

  Điểm đổi: `semantic_fidelity` 9,2 → 9,0 (lỗi cũ đã sửa, nhưng `vaṭṭamaya` còn bất định và điểm
  cũ chấm trên một bản sai nghĩa); `terminology` 9,1 → 9,0 (`kuruṅga` nay nhất quán, nhưng tên phẩm
  lệch chín bài cùng phẩm cho tới khi sửa lan); `vietnamese_clarity` 9,3 → 9,1 (vế `1.1`–`1.2` đặt
  tân ngữ trước động từ theo thể kệ); `grammar_logic` giữ 9,2 (chủ thể/phủ định `1.4` nay đúng —
  điểm cũ không xứng với bản cũ, nay mới xứng); `ambiguity_integrity` giữ 8,8; `triangulation` giữ 7.
  `final_score` 9,11 → 9,06.

  Quyết định hội đồng biên tập 2026-10-16: B21 — :0.4, :2.2, :3.1, translationTitle (kuruṅga = linh dương); C2 — :3.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
