notes: |-
  Dịch từ Pāli root: commit đã ghim không có bản Anh Sujato cho `tha-ap` (xem blocking_errors).
  32 khoá, tất cả đã dịch, không khoá nào thiếu hay orphan. Bản dịch dùng lại nguyên văn các công thức có
  tiền lệ đếm được trong tầng (5.288 bài, 150.274 cặp Pāli–Việt đã lập chỉ mục): `Therāpadāna`
  (338×), `Tóm tắt phẩm này:` cho `Tassuddānaṁ` (18× trong `tha-ap`, nhiều nhất; 7× *Tóm lược:* và
  2× *Tóm lược phẩm ấy:*), `“Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này.`
  (414× cho đúng công thức `Itthaṁ sudaṁ āyasmā … imā gāthāyo abhāsitthāti.`), `Bốn vô ngại
  giải,` (355×), `…` cho `…pe…` (627×), `đã làm tròn lời dạy của Đức Phật”.` (323×),
  `đang ngồi giữa khe núi;` cho `Nisinnaṁ pabbatantare;` (2×), `ta đã tiến đến gần Bậc Tối Thượng
  Giữa Loài Người.` cho `upāgacchiṁ naruttamaṁ;` (2×), `Với tâm tịnh tín hân hoan,` (34×),
  `rồi dâng lên Đức Phật.` (6×), `Từ ba mươi mốt kiếp trước,` (14×),
  `Ta không biết mình rơi vào khổ đau,` (115×), `đây là quả báo của việc cúng dường Đức Phật.`
  (27×), `Đầy đủ bảy món báu quý giá,` (22×), `là Chuyển luân vương có đại thần lực.` (26×),
  `Vào … kiếp trước,` cho mẫu `…kappamhi` (7/30 tiền lệ; đa số hơn *… trước đây,* 5/30).
  Dấu lược `…pe…` giữ đúng MỘT `…` theo BRIEF_VI3 §10.1, không mở rộng.

  NGÔI THỨ NHẤT — đếm lại trên 414 bài `tha-ap`, chỉ khoá kệ `:1.`–`:7.` và đã bỏ công thức
  `Tôi nghe như vầy`: `ta` 172 · `tôi` 165 · `con` 9 · không đại từ 68. Chọn `ta` vì đa số chung và
  vì `Thomakavagga` nghiêng về `ta` 7 / `tôi` 2. Cùng ngôi với `tha-ap221` để lát này tự nhất quán.

  SỐ THỨ TỰ Ở `:0.3` — ĐO LẠI. Trên 418 bài `tha-ap` có `:0.3` ở Pāli: Pāli CÓ số thứ tự 127 bài,
  KHÔNG có 291 bài; bản Việt giữ số 68, bỏ số 350. Đọc theo góc Pāli thì 289/291 bài không có số
  ở Pāli thì bản Việt cũng không có (99,3%). `tha-ap262:0.3` Pāli là
  `Aggapupphiyattheraapadāna` — KHÔNG có số — nên số thứ tự bị bỏ khỏi `:0.3` và đặt vào khoá đóng
  `:7.1` (`dasamaṁ` → *thứ mười*), đúng như 9 bài anh em cùng phẩm đã có.

  TÊN Ở `:0.3` VÀ TÊN PHẨM Ở `:0.2` — đa số CỤC BỘ của `Thomakavagga`. Trong 9 bài của phẩm (thiếu
  `:0.3` ở vài bài), tiền tố *Bài Kệ Tuyên Ngợ* 7 và *Bài Kệ Tuyên Ngôn* 2 ⇒ chọn **Bài Kệ Tuyên Ngợ**;
  `:0.2` là *Phẩm Bậc Búi Cỏ* 6, *Phẩm Người Tán Thán* 2, *Phẩm Thomaka* 1 ⇒ chọn **Phẩm Bậc Búi
  Cỏ**. Tên riêng giữ dạng Pāli có dấu, đúng với cả 9 bài anh em cùng phẩm.

  `Thomakavaggo chabbīsatimo.` (8.1) = phẩm thứ hai mươi sáu, và đây là chỗ duy nhất trong tầng mà
  `chabbīsatimo` xuất hiện, nên không có bản Việt nào để đối chiếu. Đo bằng hai lối độc lập và hai
  lối cho cùng kết quả: (một) chuỗi thứ tự phẩm dựng từ Pāli của toàn bộ `tha-ap` đặt
  `Thomakavagga` ở vị trí 26, và bảy tiền lệ đã có trong tầng khớp đúng với chuỗi đó (Sudhā 10,
  Sobhita 14, Kumuda 18, Kuṭajapupphiya 19, Tamālapupphiya 20, Hatthi 22, Ālambaṇadāyaka 23,
  Udakāsana 24); (hai) hai câu liền kề trong cùng phẩm đã kẹp nó lại — `Tuvaradāyakavaggo
  pañcavīsatimo.` dịch *thứ hai mươi lăm* (tha-ap252:7.1) và `Padumukkhipavaggo sattavīsatimo.`
  dịch *thứ hai mươi bảy* (tha-ap272:7.1). Câu kế tiếp `…vaggo <số>thứ.` có 28 tiền lệ trong tầng
  chia làm ba cách; chọn *là phẩm thứ N.* (13/28, đa số) thay vì *là thứ N.* (7/28) hay *…, thứ N.*
  (8/28).

  REVIEW ĐỐI KHÁNG — bắt được 6 lỗi bản dịch, đã sửa hết. Lớp lỗi nguy hiểm nhất là thêm chữ không
  nguồn: bản nháp mở đầu bằng *“Lên Đức Phật Chánh Đẳng Giác màu vàng ròng,* theo đúng 5 tiền lệ
  có sẵn cho Pāli `Suvaṇṇavaṇṇaṁ sambuddhaṁ,`; nhưng Pāli khoá này KHÔNG có mảnh nào sinh ra chữ *Lên*.
  Đo lại thấy `“Lên ` xuất hiện ở khoá `:1.1` của 28/354 bài `tha-ap`, và nó là thói quen dịch sai cả
  khi Pāli không có gì để dịch: `tha-ap326:1.1` và `tha-ap84:1.1` đều là `“Jātiyā sattavassohaṁ,`
  mà bản Việt vẫn mở bằng *“Lên*. Đã bỏ chữ không nguồn và dùng lại **nguyên văn** tiền lệ còn lại
  *“Bậc Toàn Giác màu da như vàng ròng,* (2×, cùng Pāli). Năm lỗi còn lại: `Pañcavīsatikappamhi,`
  bản nháp dịch *Trong hai mươi lăm kiếp ấy,* theo nghĩa nơi chốn — đã đổi thành *Vào hai mươi lăm
  kiếp trước,* cho khớp 7/30 tiền lệ của mẫu `…kappamhi`; `ahosi amitogato;` bản nháp thêm *một vị
  chúa tể tên là* trong khi Pāli chỉ có *có một vị Amitogata*, đã sửa thành *lúc ấy có một vị
  Amitogata;*; `Sikhinaṁ sikhinaṁ yathā.` bản nháp dùng *Đã Chinh Phục* (chỉ có 1 tiền lệ, do chính
  tôi tạo ra) đã đổi thày *bậc Chinh Phục* (8 tiền lệ); `Aggajaṁ pupphamādāya,` bản nháp mở đầu
  bằng *Ta* rồi `2.2` lại lặp *ta*, đã bỏ đại từ ở `2.1`; `Obhāsayantaṁ raṁsena,` bản nháp dịch
  *tỏa sáng chói lòa cùng hào quang vàng ròng* — vế so sánh bị mất — đã sửa thành *tỏa sáng rực rỡ
  như hào quang vàng ròng*.

  UDDĀNA `10.1`–`10.4` — đây là khối khó nhất của bài. Chuỗi Pāli ghi tên rút gọn của mười vị Trưởng
  lão trong `Thomakavagga`; đối chiếu với Pāli `:0.3` của chính 10 bài đó (253–262) thì
  `Thomake` = Thomaka, `Kāsana` = Ekāsanadāyaka, `Citaka` = Citakapūjaka, `Campako` =
  Ticampakapupphiya, `Sattapāṭali` = Sattapāṭaliya, `mañjarī` = Mañjaripūjaka, `Paṇṇa` =
  Paṇṇadāyaka, `Kuṭido` = Kuṭidāyaka, `Aggapupphiyo` = Aggapupphiya. Chín phần khớp được. Phần thứ mười
  là `Pānadhi`: đếm vị trí thì nó phải là `Upāhanadāyaka` (thứ sáu của phẩm), vì năm tên còn lại đã
  chiếm đúng chỗ của Mañjaripūjaka, Paṇṇadāyaka, Kuṭidāyaka và Aggapupphiya — nhưng cách rút gọn
  không có tiền lệ nào để đối chiếu, nên tôi GIỮ NGUYÊN dạng Pāli `Pānadhi` thay vì đoán. Cũng vì
  vậy cả khối uddāna giữ dạng Pāli rút gọn, đúng thói quen đã có ở tha-ap102, tha-ap142, tha-ap182,
  tha-ap222 và tha-ap242. `Gāthāyo gaṇitā cettha, / ekatālīsameva cāti.` dịch *Số bài kệ ở đây được
  tính, / tổng cộng là năm mươi mốt.* — `ekatālīsa` là năm mươi mốt, khớp `Pañcavīsatimaṁ` =
  *thứ hai mươi lăm* đã có ở sn24.43, sn24.46-69, sn24.72-95, sn33.21-25.

  KHAI TÊM VỚI HARNESS: `lọt_pāli` của `_hvi.py` coi `Thomakekāsanacitakaṁ` là MỘT token, nên tách uddāna
  thành ba tên sẽ bị bắt oan. Đã tự tra chứng rồi mới khai `Thomake`, `Kāsana`, `Citaka` (thành phần
  của chuỗi Pāli tại `:10.1`) và `Paṇṇa` (thành phần của `paṇṇaṁ` tại `:10.3`), cùng `Aggapupphiya`
  (dạng trích dẫn của tên, có thật trong Pāli `:0.3`; Pāli `:6.1` và `:10.4` dùng dạng chủ ngữ
  `aggapupphiyo`). Không khai bừa từ nào khác.

