notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.2 — `ekanāḷāyaṁ brāhmaṇagāme` là định sở cách (“trong làng Bà-la-môn Ekanāḷā”), bản cũ “gần ngôi làng … Ekanāḷa” thêm nghĩa “gần” và sai dạng tên; giữ “vùng đồi phía Nam” cho `dakkhiṇāgiri`. Giữ nguyên khoá 1.3, 1.4, 1.5, 1.6, 2.1, 2.3, 2.4, 4.1, 16.4: bản cùng Pāli ở `sn7.11` chỉ khác ở cách gọi (“Đức Phật”/“Đức Thế Tôn”, “Kasi Bhāradvāja”/“Bhāradvāja Người Nông Dân”, “tôi”/“ta”) theo mạch từng bài và không sai nghĩa; ở 16.4 bản hiện hành giữ đúng `aññataro … arahataṁ` (“một trong những bậc A-la-hán”) còn bản đa số làm mất “một trong”.
