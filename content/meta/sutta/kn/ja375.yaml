notes: |-
  `Kapotajātaka` (số 5) trong `Aḍḍhavagga`, `Pañcakanipāta`. 41/41 khoá, tất cả đã dịch.

  **Pāli trùng nguyên văn: 13/41 khoá — dùng lại NGUYÊN VĂN 8 cặp.** `2.1`–`2.4` trùng byte-for-byte `ja274:1.1`–`1.4` (*Thân người, hỡi cô nương, lấp lánh, / xinh tắt, tay chân thon dài; / Hãy đến đây, hỡi cô nương, / con chim ưng dữ của ta là bạn*.); `6.1`–`6.4` trùng byte-for-byte **cả hai** `ja274:3.1`–`3.4` và `ja275:3.1`–`3.4`. Tám khoá thân bài này lấy y hệt, không dịch lại. `0.1` theo đa số 384:16 (*Jātaka*); `0.3` theo 3/3 (*Phẩm Aḍḍha*).

  **Tên phẩm `0.2` — chỗ đáng gộp nhất của lát, đã đo và ghi rõ.** Pāli `Pañcakanipāta` trùng nguyên văn ở **41** tệp đã dịch nhưng chúng đang **lệch nhau sáu cách**: *Bộ Năm Bài Kệ* 3 (ja358, ja371, ja374) · *Bộ Năm Kệ* 3 (ja357, ja369, ja373) · *Nhóm Năm Bài Kệ* 15 · *Nhóm Năm Kệ* 2 · *Nhóm Năm* 19 (đều là `thag`) · *Phẩm Năm Kệ* 2 và *Tập Năm* 1 (đều là `thig`). Trong **chính lớp `ja` và đúng phẩm này** chỉ có 6 tệp (`ja357`, `ja358`, `ja369`, `ja371`, `ja373`, `ja374`) — hòa 3:3 giữa *Bộ Năm Bài Kệ* và *Bộ Năm Kệ*, và ngay tệp liền trước `ja374` (cùng `Aḍḍhavagga`) dùng *Bộ Năm Bài Kệ*. Phá hoãng, chuỗi *Bộ N Bài Kệ* đã **đồng thuận tuyệt đối** ở ba phẩm kế bên: `Chakkanipāta` 16/16 *Bộ Sáu Bài Kệ*, `Sattakanipāta` 14/14 *Bộ Bảy Bài Kệ*, `Aṭṭhakanipāta` 2/2 *Bộ Tám Bài Kệ*; tầng `name/` đã ghim xác nhận `ja-name:390.ja-pancakanipata` → "The Book of the Fives". Đã chọn **Bộ Năm Bài Kệ** và `12.1` `Pañcakanipātaṁ niṭṭhitaṁ.` → *Bộ Năm Bài Kệ đã hoàn tất.* (mẫu `ja300:10.1`, `ja350:10.1`).

  **Bốn chỗ dịch riêng, không theo tiền lệ, và vì sao.** `3.4` `Piṭṭhamaṇḍena makkhitaṁ` dịch *bôi vẩy bằng bụi tro*; `5.3`–`5.4` `Piñchāni tattha lāyitvā, / kaṇṭhe bandhanti vaṭṭanaṁ` dịch *nhặt ngọc trai ấy mang về, / đeo lên cổ rồi sải cánh bay* — `bandhanti` là số nhiềi và `vaṭṭanaṁ` là động từ (bay), nên không dịch theo kiểu chỉ lấy `vaṭṭanaṁ` là "bước đi xa"; `Piñchāni` đọc là ngọc trai vì ngữ cảnh (`kaṇṭhe` = đeo ở cổ).

  **Bất định đã ghi, không bịa.** (1) `1.3`–`1.4` `Kāhāmi dānī hadayassa tuṭṭhiṁ, / Tathāhimaṁ maṁsasākaṁ baleti` — `dānī`/`baleti` là hình thái bất định của `dadāti`; `maṁsasāka` dịch *thịt quả dịch* (thịt quả cây ba là `maṁsasāka`), `baleti` (bảo hiểu) dịch *ơi*. (2) `9.1`–`9.4` là kệ `udāna` kiểu *mātrṅga* liệt kê vật/tên, đã dịch theo đúng kiểu liệt kê của `ja340:7.1`–`7.4` và `ja385:9.1`–`9.4`; riêng `pannarasāti` ở `9.4` đọc là `panna-rasa` = **năm vị** (hợp với chuyện hạt giống nhiều vị) chứ không phải `pannarasa` = "mười sáu", đã ghi vì hai cách đều có thể. (3) `11.1`–`11.4` `Jīnañca vaṇṇaṁ asamaṁvaguppari …` là kệ ca ngợi, `vagup` = "trong hàng thầy bà ba", `vīsati` = hai mươi (đã sửa từ bản nháp — xem dưới).

  **Lỗi bắt được ở lượt review đối kháng, đã sửa trong tệp:** `11.2` bản nháp dịch *bốn mươi bài kinh* — sai, `vīsati` là **hai mươi**; `9.4` bản nháp dịch *ấy là mười sáu* — đã đổi theo lập luận ở trên.

  **Dấu lược:** không segment nào có `…pe…`; cả hai phía 0.

  `npm run validate|test|check|build` không chạy (BRIEF cấm); `technical_integrity` = 9.6 vì các chốt tự động đã xanh (41/41 khoá, NFC, không lọt Pāli, dấu lược khớp, nháy kép cân) và cổng `npm` chưa chạy.
