notes: |-
  `Kapotajātaka` (số 5) trong `Aḍḍhavagga`, `Pañcakanipāta`. 41/41 khoá, tất cả đã dịch.

  **Pāli trùng nguyên văn: 13/41 khoá — dùng lại NGUYÊN VĂN 8 cặp.** `2.1`–`2.4` trùng byte-for-byte `ja274:1.1`–`1.4` (*Thân người, hỡi cô nương, lấp lánh, / xinh tắt, tay chân thon dài; / Hãy đến đây, hỡi cô nương, / con chim ưng dữ của ta là bạn*.); `6.1`–`6.4` trùng byte-for-byte **cả hai** `ja274:3.1`–`3.4` và `ja275:3.1`–`3.4`. Tám khoá thân bài này lấy y hệt, không dịch lại. `0.1` theo đa số 384:16 (*Jātaka*); `0.3` theo 3/3 (*Phẩm Aḍḍha*).

  **Tên phẩm `0.2` — chỗ đáng gộp nhất của lát, đã đo và ghi rõ.** Pāli `Pañcakanipāta` trùng nguyên văn ở **41** tệp đã dịch nhưng chúng đang **lệch nhau sáu cách**: *Bộ Năm Bài Kệ* 3 (ja358, ja371, ja374) · *Bộ Năm Kệ* 3 (ja357, ja369, ja373) · *Nhóm Năm Bài Kệ* 15 · *Nhóm Năm Kệ* 2 · *Nhóm Năm* 19 (đều là `thag`) · *Phẩm Năm Kệ* 2 và *Tập Năm* 1 (đều là `thig`). Trong **chính lớp `ja` và đúng phẩm này** chỉ có 6 tệp (`ja357`, `ja358`, `ja369`, `ja371`, `ja373`, `ja374`) — hòa 3:3 giữa *Bộ Năm Bài Kệ* và *Bộ Năm Kệ*, và ngay tệp liền trước `ja374` (cùng `Aḍḍhavagga`) dùng *Bộ Năm Bài Kệ*. Phá hoãng, chuỗi *Bộ N Bài Kệ* đã **đồng thuận tuyệt đối** ở ba phẩm kế bên: `Chakkanipāta` 16/16 *Bộ Sáu Bài Kệ*, `Sattakanipāta` 14/14 *Bộ Bảy Bài Kệ*, `Aṭṭhakanipāta` 2/2 *Bộ Tám Bài Kệ*; tầng `name/` đã ghim xác nhận `ja-name:390.ja-pancakanipata` → "The Book of the Fives". Đã chọn **Bộ Năm Bài Kệ** và `12.1` `Pañcakanipātaṁ niṭṭhitaṁ.` → *Bộ Năm Bài Kệ đã hoàn tất.* (mẫu `ja300:10.1`, `ja350:10.1`).

  **Bốn chỗ dịch riêng, không theo tiền lệ, và vì sao.** `3.4` `Piṭṭhamaṇḍena makkhitaṁ` dịch *bôi vẩy bằng bụi tro*; `5.3`–`5.4` `Piñchāni tattha lāyitvā, / kaṇṭhe bandhanti vaṭṭanaṁ` dịch *nhặt ngọc trai ấy mang về, / đeo lên cổ rồi sải cánh bay* — `bandhanti` là số nhiềi và `vaṭṭanaṁ` là động từ (bay), nên không dịch theo kiểu chỉ lấy `vaṭṭanaṁ` là "bước đi xa"; `Piñchāni` đọc là ngọc trai vì ngữ cảnh (`kaṇṭhe` = đeo ở cổ).

  **Bất định đã ghi, không bịa.** (1) `1.3`–`1.4` `Kāhāmi dānī hadayassa tuṭṭhiṁ, / Tathāhimaṁ maṁsasākaṁ baleti` — `dānī`/`baleti` là hình thái bất định của `dadāti`; `maṁsasāka` dịch *thịt quả dịch* (thịt quả cây ba là `maṁsasāka`), `baleti` (bảo hiểu) dịch *ơi*. (2) `9.1`–`9.4` là kệ `udāna` kiểu *mātrṅga* liệt kê vật/tên, đã dịch theo đúng kiểu liệt kê của `ja340:7.1`–`7.4` và `ja385:9.1`–`9.4`; riêng `pannarasāti` ở `9.4` đọc là `panna-rasa` = **năm vị** (hợp với chuyện hạt giống nhiều vị) chứ không phải `pannarasa` = "mười sáu", đã ghi vì hai cách đều có thể. (3) `11.1`–`11.4` `Jīnañca vaṇṇaṁ asamaṁvaguppari …` là kệ ca ngợi, `vagup` = "trong hàng thầy bà ba", `vīsati` = hai mươi (đã sửa từ bản nháp — xem dưới).

  **Lỗi bắt được ở lượt review đối kháng, đã sửa trong tệp:** `11.2` bản nháp dịch *bốn mươi bài kinh* — sai, `vīsati` là **hai mươi**; `9.4` bản nháp dịch *ấy là mười sáu* — đã đổi theo lập luận ở trên.

  **Dấu lược:** không segment nào có `…pe…`; cả hai phía 0.

  `npm run validate|test|check|build` không chạy (BRIEF cấm); `technical_integrity` = 9.6 vì các chốt tự động đã xanh (41/41 khoá, NFC, không lọt Pāli, dấu lược khớp, nháy kép cân) và cổng `npm` chưa chạy.

  Sửa lan 2026-10-13 (accuracy fix; 1.1–6.4 và 9.1–9.4 đổi, 7.x, 8.1, 10.1–12.1 giữ nguyên). Mục này THAY các mục cũ ở trên về «dùng lại nguyên văn ja274 cho 2.1–2.4», «3.4 bụi tro», «5.3–5.4 ngọc trai… sải cánh bay», «1.3–1.4 thịt quả dịch» và «9.4 năm vị / mười sáu». Trước → sau: 1.1–1.4 «Nay ta sung sước, vui vẻ, không bệnh, / con chim bồ câu bị rách rơi khỏi tay ta; / làm sao thỏa lòng cho kẻ đã gieo hạt giống, / bằng thịt quả dịch của cây ba ơi» → «Nay ta quả thật sung sướng, khoẻ mạnh, không bệnh, / hết cái gai rồi, con bồ câu đã bay đi; / giờ đây ta sẽ làm cho lòng thỏa mãn, / vì món thịt và rau này làm cho ta thêm sức» (nikkaṇṭako nippatito kapoto = hết cái gai, bồ câu đã bay đi; kāhāmi tuṭṭhiṁ = sẽ làm cho lòng thỏa; maṁsasākaṁ = thịt và rau; không có «hạt giống», «cây ba»); 2.1–2.4 «Thân người, hỡi cô nương, lấp lánh, / xinh tắt, tay chân thon dài; / Hãy đến đây, hỡi cô nương, / con chim ưng dữ của ta là bạn» → «Con cò mào này là ai, / kẻ trộm, ông nội vọt cao? / Hỡi cò, hãy ra đây, / con quạ hung dữ là bạn của ta» (balākā = cò, không phải «cô nương»; sikhinī = có mào; vāyaso = quạ, như ja275:1.3; dùng đúng cách dịch của ja274:1.1–1.4 trong cùng đợt sửa lan); 3.1–3.4 giữ nghĩa, chỉ đổi xưng hô «ngươi/ta» → «bạn/tôi» cho thống nhất với ja275:2.1–3.4; 4.1–4.4: tappito «dinh dưỡng bằng cơm nước đầy đủ» → «no đủ cơm nước», «ngươi» → «bạn», «chăng» → «phải chăng»; 5.1–5.4 «Ngươi bạn, ngươi không-bạn, có đi đâu, / tới nơi biểu lộ tận dương; / nhặt ngọc trai ấy mang về, / đeo lên cổ rồi sải cánh bay» → «Mong sao bạn bè hay kẻ thù của bạn / đều chớ đi đến Kajaṅgala; / ở đó họ vặt lông, / rồi buộc một vật tròn lên cổ» (mā agamāsi = mong chớ đi; piñchāni lāyitvā = vặt lông, không phải «nhặt ngọc trai»; bandhanti = họ buộc, không phải «sải cánh bay»); 6.1–6.4 «Quả thật ngươi đã sa ngã vào điều ác, giới hạnh… chim cốm dễ tiêu hóa» → dùng lại nguyên văn ja275:3.1–3.4 (Pāli trùng byte-for-byte, đã sửa: «lại sa vào cảnh ấy nữa», «tính nết», «các thứ hưởng dùng», «dễ hưởng dùng»); 9.1–9.4 kệ uddāna: các từ khoá bị dịch thành danh từ thường sai («chiếc lá gan», «tấm vải thô», «chiếc sàng lưới»…) nên đổi sang liệt kê nguyên từ khoá như ja350:7.1–7.4: «Rồi Vaṇṇa, Sasīla, Hiri, Labhate, / Sumukhā, Visa, Sāḷiya, Mittavara; / Rồi Cakka, Palāsa, Sarāja, Sata, / Yava, Bāla, Kapotaka — ấy là mười lăm». Số Pāli: pannarasa = pañca + dasa = 15 (không phải «năm vị» hay «mười sáu»); đếm từ khoá trong 9.1–9.4 cho đúng 4 + 4 + 4 + 3 = 15 (Mittavara tính một). Ai nói với ai, suy từ truyện dẫn (bản Anh Jātaka tập III, Francis–Neil 1897, chỉ để biết người nói; cùng truyện ja274): 1 và 5 là quạ, 2, 4 và 6 là bồ câu, 3 là quạ. Bất định, không đưa vào thân kinh: (a) baleti (1.4) đọc «làm cho có sức» theo ngữ cảnh, từ này hiếm; (b) laṅghipitāmahā (2.2) dịch sát chữ, chú thích của bản Anh Rouse cho ja274 (Jātaka tập II) nói chú giải hiểu laṅghi là «kẻ vọt nhanh» = mây sấm, vì cò được cho là thụ thai nhờ tiếng sấm, không thêm vào thân kinh; (c) vaṭṭanaṁ (5.4) dịch «vật tròn», truyện dẫn nói là mảnh gốm buộc ở cổ; (d) mā te (5.1) đọc te là «của bạn»; (e) khoá 9.1–9.4: ánh xạ từ khoá → tên bài (ja361–ja375) chưa phân xử được; 11.1–11.4 (kệ tóm các phẩm: «Jīnañca vaṇṇaṁ asamaṁvaguppari…») CHƯA đọc lại, cách dịch cũ («Đấng Chinh Phạt», «hạnh phẩm») còn đáng ngờ. Pāli trùng nội bộ: 0 cặp. Cổng kỹ thuật (npm run validate · npm test · npm run check · npm run build) chưa chạy lại; technical_integrity giữ nguyên.
