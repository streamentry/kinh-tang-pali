notes: |-
  Đã đọc HẾT Pāli lát (`f9.pali.txt`) trước khi viết chữ. 17 khoá, tất cả đã dịch.

  TẦNG THAM KHẢO — đo. 0/17 khoá có Anh Sujato. `source/upstream-manifest.json` cho thấy
  edition `translation/en/sujato` có 4291 tệp, trong đó 755 tệp `kn/` và **không tệp `mil*` nào**
  ngoài tệp tên. Đây là `not-published-upstream`. Bản Việt hiện hành cũng không có (`translation/vi/
  phantuananh` ở commit đã ghin chỉ có 26 tệp, toàn bộ là Pháp Cú). Ba tầng tham khảo vắng ⇒
  blocker thật ⇒ `draft`, và `triangulation` ở 7.5.

  PĀLI TRÙNG NGUYÊN VĂN — tự dựng chỉ mục Pāli↔Việt của toàn tầng rồi so 238 khoá của lát:
  tìm được **46 cặp**; 44 cặp dùng lại **đúng nguyên văn** của bài đã có, 2 cặp cố ý lệch (xem
  `pv46` và `tha-ap313`). Riêng lát này có 4 cặp: `0.1` `Milindapañha` (71 bài), `0.2`
  `Meṇḍakapañhārambhakathā` → *Lời Dẫn Nhập Cho Các Câu Hỏi Hóc Búa* (mil4.5, mil4.6),
  `0.3` `Upāsakaguṇavagga` → *Phẩm Đức Tính Người Cư Sĩ* (mil4.5, mil4.6), và `1.2` `Katamehi
  aṭṭhahi?`.

  **LỆCH CÓ CHỦ ĐÍCH ở `1.2`.** Tiền lệ ở 3 bài (`an8.17:1.2`, `an8.18:1.2`) là *Tám cách nào?*.
  Tôi dịch *Tám lý do nào?* vì danh từ đứng trước trong chính bài này là `kāraṇa` (lý do), và
  `aṭṭhahi kāraṇehi` ở `1.1` cũng đã dịch là *tám lý do*. Dùng *cách* sẽ tự mâu thuẫn trong
  một bài. Đã ghi đây để biên tập phán xử nếu muốn thống nhất theo `an8`.

  THUẬT NGỮ MỚI (0 tiền lệ trong tầng Việt, đặt theo nghĩa chữ):
  · `aṭṭhapaññāpaṭilābhakāraṇa` → *Điều Kiện Để Trí Tuệ Được Viên Mãn*. `paṭi` = đầy đủ,
    `abha` = có được, nên `paṭilābhakāraṇa` là điều kiện để viên mãn; glossary có
    `bhāvanāpāripūrī` → *viên mãn* nên tôi bám theo đó.
  · `pariṇamati paripākaṁ gacchati` → *biến đổi và đi đến chín muồi*. Không có tiền lệ.
    `paripāka` = chín, `gacchati` = đi tới.
  · `sākacchā` → *sự cần cẩn chú ý*; `snehūpasevanena` → *gần gũi và nuôi dưỡng tình thương*;
    `patirūpadesavāsena` → *ở trong chỗ thích hợp*. Đều không có tiền lệ.
  · `Bhavatīha—` → *Hãy nghe:—*. *Hãy nghe* có 16 tiền lệ trong tầng.

  Bám glossary: `yoniso manasikāra` → *tác ý như lý* (`1.3`, `2.2`).

  BẤT ĐỊNH CHƯA PHÂN XỬ, đã ghi ở đây:
  · `pabhijjati` (`3.4`) nghĩa gốc là *trở nên hiển lộ*, nhưng tôi dịch *được viên mãn* để khớp
    tiêu đề `paṭilābhakāraṇa`. Một cách đọc khác là *hiện bày rõ ràng*. Biên tập có thể chọn lại.
  · `Vayapariṇāmena` (`1.3`) tôi dịch *sự biến đổi của gió* (`vaya` = gió). Đọc theo Từ điển
    Childs 2001, `vayapariṇāma` trong khung này là biến đổi của gió; đây là bằng chứng ngoài tầng
    đã ghim, chỉ dùng để parse cú pháp, không phải authority.

  **Không nén bất cứ khoá nào bằng `…`.** Pāli bài này không có `…pe…` và không khoá nào đủ điều
  kiện §10.2 để nén (công thức tám điều kiện được viết đủ ở cả `1.3` lẫn `2.1–2.4`).

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
