notes: |-
  PĀLI TRÙNG NGUYÊN VĂN — HAI VẾ MỘT CẶP, ĐÃ DÙNG LẠI NGUYÊN CẶP. `Vikkhīṇo
  jātisaṁsāro,` trùng `thig2.2:2.3` và `natthi dāni punabbhavo”ti.` trùng `thig2.2:2.4`; tức là
  CẢ HAI VẾ của tôi là cặp kệ kết của Trưởng lão nữ Jentā, giống nhau từng chữ. Tôi dùng lại nguyên
  cặp "vòng quanh đã cạn," + "nay không còn tái sinh nữa”."
  GHI RÕ MỘT HỆ QUẢ ĐỂ NGƯỜI BIÊN TẬP PHÁN XỬ: tầng đang có TỚP BẢY cách dịch khác nhau cho
  `Vikkhīṇo jātisaṁsāro,` (sn9.6 "vòng sinh tử đã đoạn tận", iti94 và ud4.9 "sự luân hồi trong
  các đời đã tận", snp3.12 "vòng luân hồi sinh đã được tiêu diệt", ud4.10, thag1.67 "sự luân hồi
  qua các kiếp đã cùng đi", thig2.2 "vòng quanh đã cạn"), và TỚP NĂM cách cho
  `natthi dāni punabbhavo”ti.` (dn16, sn56.21, sn9.6, thig2.2, thig1.x). Tôi theo thig2.2 vì nó
  là bản CÙNG CẶP — giữ cả hai vế khớp nhau thì người đọc không thấy bài này tự mâu thuẫn với bài
  kia. Hệ quả thứ hai: `thig2.2:2.4` bỏ `ti`, còn bản này tôi cũng bỏ theo cho khớp cặp, dù
  Theragāthā nói chung hay giữ `”ti.` (59 tệp so với 22 tệp bỏ). Cả hai điểm này cần người biên tập
  chuẩn hoá, và tôi không tự sửa tệp ngoài lát của mình.
  `khandhā` = các uẩn (484 chỗ trong tầng). `padālitā` = bị phá tan (tiền lề `āsavā te padālitā`:
  snp3.6:50.2, snp3.7:41.2, mn92:28.11). `yathābhūtaṁ` = đúng như thật (tiền lề dhp203:3,
  snp1.11:2.4). Dòng kết 1.5 giữ HAI dấu lược như Pāli. Vì `cần` RỖNG, tôi tự quét MỌI khoá —
  sạch. Không chạy npm (đợt này cấm) nên technical_integrity = 9.6.
