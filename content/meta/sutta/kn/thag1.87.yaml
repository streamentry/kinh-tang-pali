notes: |-
  PĀLI TRÙNG NGUYÊN VĂN — HAI VẾ MỘT CẶP. `Vikkhīṇo jātisaṁsāro,` trùng `thig2.2:2.3`
  và `natthi dāni punabbhavo”ti.` trùng `thig2.2:2.4`; tức là CẢ HAI VẾ của bài này là cặp kệ kết
  của Trưởng lão nữ Jentā, giống nhau từng chữ. Bản dịch trước đây cố ý bám theo `thig2.2`.

  **ĐÃ SỬA `1.3`, VÀ ĐÂY LÀ CHỖ TÔI CỐ Ý ĐI NGƯỢC TIỀN LỆ KIA.** `thig2.2` dịch `jātisaṁsāro`
  là *vòng quanh đã cạn*. Cụm *vòng quanh* có **0 tiền lệ** trong tầng, còn `saṁsāra` thì có
  **137 tiền lệ** và phần lớn đều dịch là *luân hồi*: `sn9.6`, `iti94`, `ud4.9`, `ud4.10`,
  `snp3.12`, `thag1.67`. Nói cách khác, `thig2.2` là ngoại lệ chứ không phải chuẩn, và *vòng
  quanh* không phải là cách nói cho `saṁsāra`. Tôi sửa thành *luân hồi tái sinh đã cạn ráo*,
  theo đa số. Hệ quả tôi ghi lại để người biên tập phán xử: **hai bài này giờ lệch nhau**, và
  `thig2.2` nằm ngoài lát của tôi nên tôi không sửa. Nếu biên tập muốn thống nhất, hướng chuẩn
  hoá là sửa `thig2.2` theo *luân hồi*, không phải sửa ngược bài này.

  **ĐÃ SỬA `1.4`: giữ lại chữ `ti`.** Bản dịch trước đây bỏ `ti` và đặt dấu chấm ra ngoài
  dấu nháy, để khớp `thig2.2:2.4`. Nhưng Pāli viết `punabbhavo”ti.` và trong chính lát này
  **11/12** bài đều giữ `”ti.`; đếm trên tầng, 59 tệp giữ so với 22 tệp bỏ. Tôi giữ lại
  `”ti.` cho đúng chữ khoá và đúng đa số.

  **ĐÃ SỬA `0.4`: chữ Lão viết hoa.** Bản cũ ghi *Trưởng lão* thường trong khi 108 khoá và
  hơn 30 bài thag/thig khác ghi *Trưởng Lão*.
  `khandhā` = các uẩn (484 chỗ trong tầng). `padālitā` = bị phá tan (tiền lề `āsavā te padālitā`:
  snp3.6:50.2, snp3.7:41.2, mn92:28.11). `yathābhūtaṁ` = đúng như thật (tiền lề dhp203:3,
  snp1.11:2.4). Dòng kết 1.5 giữ HAI dấu lược như Pāli. Vì `cần` RỖNG, tôi tự quét MỌI khoá —
  sạch. Không chạy npm (đợt này cấm) nên technical_integrity = 9.6.
