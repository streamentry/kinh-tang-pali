notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ Vimānavatthu.
  29/30 khoá Pāli trùng nguyên văn vv56, chỉ 0.4, 5.3, 6.1, 8.1 khác — dịch giống
  hệt vv56 ở 26 khoá còn lại, đã kiểm bằng cách so trực tiếp hai tệp.
  Tiền lệ và lý do chọn thuật ngữ y hệt vv56: Vimānavatthu 22/23; Purisavimāna →
  Chuyện Cung Điện Nam Hư Không 9/18; Mahārathavagga → Phẩm Cỗ Xe Lớn 4/7;
  1.1-2.4 theo họ vv59/vv70 (đa số từng câu); So devaputto attamano 7/15;
  kammassidaṁ phalaṁ 7/19; Tena metādiso vaṇṇo 8/20.
  Chỗ khác vv56 đúng ba khoá nội dung: 5.3 `bhikkhūsu` → các tỳ-kheo (vv56 là
  `buddhesu` → các Đức Phật) và 6.1 `bhikkhu` → vị tỳ-kheo (vv56 là `buddho` → Đức
  Phật); cộng 0.4 và 8.1 là tiêu đề Lần Thứ Hai và số thứ bảy. Không dịch khác
  chỗ nào khác để hai bài không tự mâu thuẫn.
  0 tiền lệ: `Dutiyakaraṇīyavimānavatthu` chưa có; dùng cùng cách với vv56 —
  `karaṇīya` là đáng tán thán. `sabbadisā` dịch 'khắp mọi phương' dù đa số tầng
  là 'khắp muôn phương'. 5.2 `paṇḍitena vijānatā` có dấu hiệu lỗi cách.
  Tiêu đề 0.4 giữ số 7; colophon 8.1 bỏ số rồi thêm 'thứ bảy'. `…pe…` ở 3.2, 4.2,
  7.2 giữ đúng một dấu lược.
  Kiểm toán độc lập 2026-10-11: đọc đối kháng 30 khoá với Pāli. 6/30 khoá có lỗi nghĩa thật, đã sửa; 2 khoá nhỏ (thêm nghĩa) đã gọt; 1 khoá chưa sửa được.
  Lỗi nghĩa thật (accuracy fix): (1) 0.4 và 8.1, 5.1 — `karaṇīya` là 'nên làm', không phải 'đáng tán thán' (chữ đầu của kệ `Karaṇīyāni puññāni`); sửa thành 'Việc Nên Làm' / 'Những việc phước nên làm', đổi `translationTitle` cho khớp. (2) 5.2 — `paṇḍitena vijānatā` là cách công cụ chỉ tác nhân của gerundive `karaṇīyāni`: 'bởi bậc trí có hiểu biết'; bản cũ đọc thành 'bậc hiền đã biết rõ' (mất quan hệ 'nên làm bởi ai'). Đây cũng là chỗ notes cũ ghi 'có dấu hiệu lỗi cách' — nay đã phân xử. (3) 5.3 — `sammaggatesu` là 'đã đi đúng đường' (tầng đã dịch `sammaggatā` là 'đi đúng đường' ở an10.176), không phải 'hội tụ'; 5.4 'nơi vật bố thí có quả lớn' theo tiền lệ `yattha dinnaṁ mahapphalaṁ` (iti26, ja495, an5.36), bỏ 'vật cho'. (4) 4.3 — `yassa kammassidaṁ phalaṁ` là 'về nghiệp mà đây là quả báo' (quan hệ từ `yassa` + 'đây'), không phải 'quả báo của nghiệp này là thế'; đo tầng: 'quả báo của nghiệp này là thế' 49 khoá, 'về nghiệp mà đây là quả báo' 3 khoá — đa số tầng đang mang lỗi này.
  Khoá nhỏ đã gọt: 2.4 bỏ 'lượn bay' (Pāli chỉ `naccanti`, không có bay); 6.2 bỏ 'sâu' (Pāli chỉ `araññā`).
  Chưa sửa, lệch cả họ: 0.2 `Purisavimāna` dịch 'Nam Hư Không' — Pāli không có `ākāsa`; không sửa riêng một tệp (sẽ lệch cả bộ), cần sửa đồng loạt toàn bộ phẩm. Không sửa: 4.1 'vô cùng hoan hỷ' (19/27 khoá cùng Pāli, `attamano` tự đã là hoan hỷ; chỉ thêm cường độ), 2.1 'thỏa thích' (8/10 khoá), 1.4 `rucakatthatā` dịch 'trải thảm' (nghĩa chính xác của `rucaka` chưa phân xử được trong kho, 10 khoá cùng Pāli đều dùng 'trải thảm/trải vàng/trang hoàng' lệch nhau), 2.4 `nāriyo` dịch 'tiên nữ' theo họ (8/10) dù Pāli chỉ là 'phụ nữ'.
  Cùng lỗi vv56 (cùng Pāli ở 0.4, 4.3, 5.1, 5.2, 5.3 `buddhesu` dịch 'hội tụ', 8.1): cần sửa tương ứng ở vv56; vv56 không nằm trong lượt này.
  Điểm: semantic_fidelity 9.3 → 8.6, grammar_logic 9.3 → 8.8, terminology 9.1 → 8.3, vietnamese_clarity 9.3 → 9.2, ambiguity_integrity 9.0 → 8.5; final_score 9.19 → 8.93. Các tiêu chí còn lại giữ nguyên. Hạ điểm vì bản cũ có 6/30 khoá sai nghĩa thật mà lượt chấm 2026-10-04 bỏ sót.
  Không có thay đổi về `status` trong lượt này; blocker upstream giữ nguyên.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
  Lượt cải thiện 2026-10-13: đọc đối kháng lại 30 khoá với Pāli, đo tiền lệ bằng số đếm trên toàn tầng; sửa 5 khoá (accuracy/terminology fix), 25 khoá giữ nguyên.
  Khoá đổi: (1) 2.1 `Tatthacchasi pivasi khādasi ca` 'ăn uống thỏa thích' → 'uống và ăn' — Pāli chỉ có ba động từ ngồi–uống–ăn, không có chữ nào cho 'thỏa thích'; theo thứ tự Pāli và theo 4/10 khoá cùng Pāli ở họ vv (54, 55, 77, 85). (2) 3.1 `Kena tetādiso vaṇṇo` 'Do nhân gì ngài có được sắc diện dung nhan như thế' → 'Do đâu ngài có được dung sắc như thế' — `vaṇṇo` bản cũ dịch hai chữ 'sắc diện dung nhan' ở 3.1 nhưng 'dung sắc' ở 3.3, 7.1, 7.3 trong cùng bài (tự lệch); đo tầng: 'Do đâu … dung sắc như thế' 39/44 khoá cùng Pāli, dạng cũ 4/44. (3) 3.3 và 7.3 `pabhāsatī` bỏ 'rực rỡ' — Pāli không có chữ thêm cường độ; trong 135 khoá cùng Pāli, 124 khoá dịch 'chiếu sáng khắp mọi/muôn phương' không có 'rực rỡ'. (4) 3.3 thêm dấu hỏi — đây là câu hỏi `Kena … ca te sabbadisā pabhāsatī`; 3.1–3.3 là một câu hỏi; trong 71 khoá cùng Pāli `Vaṇṇo ca te sabbadisā pabhāsatī` (lời hỏi), 69 khoá có dấu hỏi — bản cũ thuộc 2 khoá còn lại. (5) 4.1 `attamano` 'vô cùng hoan hỷ' → 'hoan hỷ' — `attamano` không kèm từ chỉ mức; đo tầng: dịch `attamano` có 'hoan hỷ' 141 khoá, 'vô cùng hoan hỷ' chỉ 13; riêng 27 khoá cùng Pāli `So devaputto attamano` có 10 khoá 'vô cùng hoan hỷ' — số 19/27 ghi ở lượt 2026-10-11 không còn tái lập được, nên lý do giữ 'vô cùng' ở lượt đó không đứng vững.
  Điểm đổi: semantic_fidelity 8.6 → 8.8 (gỡ 4 chỗ thêm nghĩa: 'thỏa thích', 'vô cùng', 'rực rỡ' ×2); grammar_logic 8.8 → 8.9 (3.3 thêm dấu hỏi cho câu hỏi; 3.1 theo tiền lệ); terminology 8.3 → 8.6 (`vaṇṇo` nhất quán trong bài; mục 0.2 'Nam Hư Không' ghi chưa sửa ở lượt trước nay đã được sửa đồng loạt toàn họ thành 'Thiên Cung Của Nam Giới', tệp này đã khớp). final_score 8.93 → 8.99; vẫn `review` (không vượt 9.0). Các tiêu chí khác giữ nguyên, kể cả triangulation 7.5 (không có bản Anh độc lập) và ambiguity_integrity 8.5.
  Không đổi dù đã đo: 1.3 'nguy nga tráng lệ' (8/11 khoá cùng Pāli, `uḷārā` tự là 'cao quý, lớn lao' nên hai chữ vẫn nằm trong trường nghĩa); `sabbadisā` giữ 'khắp mọi phương' thay vì 'muôn phương' (muôn 84, mọi 49 trên tầng; 'mọi' sát chữ `sabba-` hơn và có tiền lệ trong chính họ vv54–56, 68, 70, 74, 77, nên không ép); 2.3 `kāmaguṇa` 'năm dục công đức' (tầng: 'dục lạc' 111, 'dục công đức' 37; riêng vv/pv 12 so 10, chưa có đa số rõ, glossary không có mục; không đổi riêng một tệp); 2.4 `nāriyo` 'tiên nữ' (6 trên 10 khoá cùng Pāli ở vv dùng 'tiên nữ/thiên nữ'; Pāli chỉ nói 'phụ nữ'); `suvaṇṇachannā` 'khoác trang sức vàng ròng' (5 trên 10 khoá ở vv; Pāli chỉ 'phủ vàng', 'trang sức' và 'ròng' là cách đọc của họ).
  Bất định còn lại: 1.4 `rucakatthatā` — `rucaka` là hapax trong toàn Pāli root đã ghim (chỉ nằm trong khoá lặp 1.4 của 11 bài vv), không có bản Anh, không có mục glossary, không có bài song song phân xử; 'trải thảm' là cách đọc của họ chứ không được chứng minh. Giữ trong lời kinh và ghi tại đây; không đoán nghĩa mới.
  technical_integrity vẫn 9.6: lượt này không chạy được gate. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` do coordinator chạy trước khi xuất bản.

  Sửa lan 2026-10-13 (accuracy fix): `2.3` `Dibbā rasā kāmaguṇettha pañca` "Vị ngon cõi trời cùng năm dục công đức," → "Vị ngon cõi trời cùng năm dục công đức ở nơi đây," — `ettha` (= *ở đây*) bị bỏ sót; Pāli trùng nguyên văn với `vv56:2.3` (đã có *ở nơi đây*, cũng như `vv54:2.3`, `vv85:2.3`). `3.3`, `7.3`, `4.1` giữ nguyên, không đổi. Điểm số giữ nguyên.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (dòng đầu tệp ghi tác giả). 1 khoá bất đồng nghĩa → sửa 0, giữ 0, bất định 1 (1.4 `rucakatthatā`: bản nguyên bài hiểu `rucaka` là vàng và dịch được trải lót bằng vàng, bản này giữ trải thảm rực rỡ tươi đẹp như 9 khoá cùng Pāli ở vv54, vv55, vv56, vv59, vv67, vv77, vv79, vv85 và khoá này, trong khi vv58 và vv70 dịch khác; `rucaka` là vàng hay vật khác, `atthata` là trải thảm hay trải lót, đều không phân xử được bằng Pāli, nên không sửa riêng một tệp). Toàn bài còn lại hai bản cùng nghĩa (số do-tuần mười hai, bảy trăm lầu gác, `sammaggatesu bhikkhūsu`, `atthāya vata me bhikkhu`, `tattha cittaṁ pasādetvā`). Lượt review đối kháng riêng đọc lại toàn bài: không đổi khoá nào. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Điểm triangulation 7.5 → 8.5, các tiêu chí khác giữ nguyên.

  Lượt rà soát 2026-10-15 (đợt 2, lô G5, Claude Sonnet 5.5 (Claude Code)): sửa 2.4: nāriyo "tiên nữ"
  đổi "nữ nhân"; suvaṇṇachannā "khoác trang sức vàng ròng" đổi "phủ vàng" khớp vv55, vv77, vv79, vv85.

  Sửa lỗi nghĩa 2026-10-16: vv57:1.4 `rucakatthatā` — "trải thảm rực rỡ" → "được trải vàng" (`rucaka` là vàng/cát vàng, `atthata` là được trải, không có chữ nào cho "thảm"; căn cứ https://www.wisdomlib.org/definition/rucaka (PED: rucaka = vàng/cát vàng, "suvaṇṇa-vālikā"); Vv-a ad Vv 35 (https://www.tipitaka.org/romn/cscd/s0506a.att1.xml): "rucakupatiṇṇanti suvaṇṇavālikāhi okiṇṇaṅgaṇaṃ"; Indacanda "được trải lót bằng vàng" (https://www.tamtangpaliviet.net/VHoc/30a/Vv_03.htm)).
