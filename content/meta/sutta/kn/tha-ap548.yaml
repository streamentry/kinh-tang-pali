  SỐ PĀLI, TỰ TÍNH. (1) satasahassa = sata 100 x sahassa 1.000 = 100.000: 1.3 Ito satasahassamhi = cách đây một trăm ngàn kiếp (dùng lại nguyên văn); 5.3 Pāṇasatasahassānaṁ = một trăm ngàn chúng sinh; 14.1 Satasahassito kappe là lời thọ ký về tương lai nên dịch Vào một trăm ngàn kiếp nữa (dùng lại nguyên văn tha-ap544:8.1). (2) Ekūnatiṁso 21.1 = ekūna (kém một) + tiṁsa 30 = 29, dịch hai mươi chín tuổi; tiṁsa = 30 (theo yêu cầu điều phối; ở bài này tiṁsa chỉ có hai chỗ là Ekūnatiṁso và tên cõi trời Tāvatiṁsa, nên không có phép tính nào khác để phân xử). (3) Chabbassaṁ 21.3 = cha 6 + vassa năm = sáu năm. (4) tāvatiṁsa ở 17.4 là tên cõi trời (không phải số), dịch cõi trời Ba mươi ba, dùng lại nguyên văn tha-ap544:10.4 cùng Pāli. (5) pañcavaggiye ở 23.2 là nhóm năm vị (nhóm, không phải phép tính). (6) chaṭṭhaṁ ở 32.1 = thứ sáu. Bài này không có cụm Tiṁsakappasahassa nên không có bất định số.

  NĂM PHÉP KIỂM, MỖI PHÉP IN MẪU SỐ. (1) Tập khoá: Việt 122 = Pāli 122, thừa 0, thiếu 0, thứ tự y hệt Pāli. (2) Nháy kép và nháy đơn khớp Pāli từng khoá: Pāli có 8 dấu (mở kép 1.1, mở đơn 7.1, đóng đơn 7.4, mở đơn 11.3, đóng đơn 12.2, mở đơn 13.1, đóng đơn 15.4, đóng kép 30.3), Việt đúng 8 dấu ở đúng 8 khoá; lệch 0/122 khoá. Nhịp nháy chạy qua khoá là cố ý của Pāli (kể cả đoạn nhận lời 13.1 đến 15.4 trải qua ba khổ thơ). (3) Pāli trùng nguyên văn TRONG CHÍNH bài: 2 nhóm: Kulappasādakānaggaṁ (8.3 và 27.3, hai bản Việt giống nhau) và …pe… (28.2, 29.2, 30.2, ba bản Việt giống nhau); số cặp trùng nội bộ mà Việt khác: 0. (4) Dấu lược: Pāli có 3 khoá …pe…, Việt 3 khoá đúng một …, lệch 0; không có khoá (…) trần; không có khoá … nào Pāli không có. (5) Số Pāli: xem mục trên. Phụ: NFC 122/122; khoá rỗng 0; khoảng trắng thừa 0; chữ số lọt vào thân kệ 0; từ Pāli lọt sang Việt ngoài tên riêng 0 (chỉ còn Therāpadāna ở 0.1, Bhaddiya ở 0.2, Padumuttara, Haṁsavatī, Haṁsārāma, Okkāka, Gotama, Udāyi, Kapilavatthu, Siddhattha, Lumbinī, Suddhodana, Magadha, Kapila, Isi, Kāḷudāyī).

  TIÊU ĐỀ. 0.3 = Ký Sự Về Trưởng Lão Kāḷudāyī và translationTitle BẰNG ĐÚNG giá trị đó. Số thứ tự: Pāli 0.3 là Kāḷudāyittheraapadāna, không bắt đầu bằng chữ số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số; bài không thuộc nhóm THỪA). Phe dịch apadāna: ở phạm vi gần nhất (tha-ap530 đến tha-ap560, 14 tệp) Ký Sự Về 11, Ký Sự Về có số thứ tự 3, Bài Kệ Tuyên Ngợ Về 1; toàn tầng tha-ap: Bài Kệ Tuyên Ngợ Về 163, Bài Kệ Tuyên Ngôn Về 99, Ký Sự Về 96 (chưa tính các biến thể có số thứ tự). Hai phạm vi cho hai đa số khác nhau và Tuyên Ngợ là sai chính tả theo brief; theo phạm vi gần nhất và hai bài liền kề cùng phẩm (tha-ap544, tha-ap547) dùng Ký Sự Về, nên giữ. 0.1 giữ Therāpadāna (nguyên Pāli, 507 khoá cùng Pāli trong tầng). 0.2 Bhaddiyavagga dịch Phẩm Bhaddiya, khớp 4/4 tiền lệ cùng phẩm. 32.1 dùng Ký Sự Về Trưởng Lão Kāḷudāyī, thứ sáu (chữ hoa theo 0.3 và theo tha-ap547); chaṭṭhaṁ = thứ sáu. Tên Kāḷudāyī giữ nguyên dạng Pāli, khớp 1 tiền lệ trong tầng (Bài Kệ Tuyên Ngôn Về Trưởng Lão Kāḷudāyī).

  LỜI KẾT 31.1: dùng nhóm số nhiều Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này, khớp nguyên văn tha-ap544:21.1 và tha-ap547:23.1; đo trong tầng tha-ap 481 khoá so với 2 khoá số ít (đã từng nói bài kệ này); Pāli imā gāthāyo là số nhiều.

  DÙNG LẠI NGUYÊN VĂN. Dò toàn tầng kn đã có: 36 khoá Pāli của bài này có Pāli trùng nguyên văn ở bài khác, tổng 5.298 cặp Pāli trùng đã dò; 4.592 cặp bản Việt trùng chữ với bản của bài này, 706 cặp khác (phần lớn khác ở ngôi kể ta/tôi và biến thể đứng đầu khổ). 34/36 khoá dùng lại nguyên văn một bản đã có; 2 khoá không dùng lại nguyên văn: 0.3 (tiêu đề là tên riêng của bài, dạng khác là bắt buộc) và 25.2 (bhūmipālena pesito: tiền lệ duy nhất là ta được đức vua phái đi; ở đây 25.1 là Suddhodana đứng tách một dòng nên 25.2 mang cả bhūmipāla bậc hộ trì đất lẫn pesito phái đi, ngôi tôi theo nhóm tôi của bài này). Số cặp Pāli trùng trong chính bài mà Việt khác: 0. Ngôi kể: người kể xưng tôi suốt bài, theo tha-ap544 và tha-ap547 (28.1, 28.3, 29.1 lấy dạng tôi; toàn tầng 28.1 dùng ta 119 khoá so với tôi 25+25 khoá, nhưng hai bài liền kề cùng phẩm dùng tôi nên giữ nhất quán trong bài). 17.4 Pāli tāvatiṁsamagacchahaṁ: toàn tầng ta 17, tôi 9, con 3; theo tha-ap544:10.4 (tôi đã đến cõi trời Ba mươi ba), khác với tha-ap547:13.4 là Pāli tāvatiṁsūpago (cõi Ba Mươi Ba). 18.1 Pacchime ca bhave dāni: 4 khoá trong đời cuối cùng, 4 khoá trong đời sống cuối cùng; theo tha-ap547:14.1 (trong đời cuối cùng).

  BẤT ĐỊNH, KHÔNG BỊA, KHÔNG ĐƯA VÀO THÂN KINH. (1) 4.2 anantajinasaṁsari: hapax toàn tầng Pāli (0 khoá khác chứa dạng này). Bản dịch đọc như anantajana (vô số người) cộng saṁsadi (hội chúng), tức giữa hội chúng vô số người, vì câu cần một vị trí cho Deseti ở 4.3 và saṁsari (nếu động từ) không có chủ ngữ khác. Nếu đúng là jina thì nghĩa khác. Cần người biên tập phán; đã vào blocker thứ ba. (2) 12.4 siñcanto vāmatena maṁ: vāmatena là hapax toàn tầng, hình thái không đọc ra được (không đủ chứng cứ để đọc là vāri hay amata hay vāma). Bản dịch giữ rưới lên tôi và BỎ công cụ thay vì bịa. (3) 26.3 tato purāhaṁ gantvāna: purā có thể là trước (đi trước), từ thành, hay pura (thành) cộng ahaṁ; 0 tiền lệ cho cả cụm purāhaṁ và tato purā. Chọn đi trước vì pasādesiṁ ở 26.4 có đối tượng là đại gia tộc và 26.2 đã đưa Đức Phật đến nơi có tên Kapila. (4) 2.4 titthe yojeti pāṇine: tittha là bến, yojeti là đặt vào; dịch Ngài đưa chúng sinh vào bến, không thêm bến nào (bến vượt qua, bến giải thoát) vì Pāli không nói; 0 tiền lệ cho cụm này. (5) 2.2 guṇāguṇa: dịch điều tốt và điều xấu theo tiền lệ jānantassa guṇāguṇaṁ (1 khoá); guṇa cũng có thể là đức hạnh của chúng sinh. (6) 3.2 tulayitvā: không có tân ngữ trong Pāli, dịch sau khi cân nhắc, không thêm gì. dayāsayo dịch bậc có tâm bi mẫn (āsaya là khuynh hướng nội tâm). (7) 8.1 pavedajātesu: pavedajāta không có tiền lệ trong tầng; dịch khi niềm hoan hỷ đã khởi lên (veda là hoan hỷ, kích động tâm), chủ thể ngầm là loài người, chư thiên, Phạm thiên ở 8.2 (sanarāmarabrahmasu). (8) 7.3 bhavasamuddamhi, 22.3 bhavaṇṇavaṁ: dịch biển hữu (hữu = bhava, theo tiền lệ các cõi hữu cho bhavābhave); 0 tiền lệ trực tiếp cho hai từ ghép. (9) 7.4 nimugge: tân ngữ số nhiều của uddharī, dịch những ai đang chìm (ở 7.3 đặt trước), 'uddharī' là aorist nên dịch đã cứu vớt lên, khác với samuddharati hiện tại ở tha-ap547. (10) 9.2 jātomaccakule: amacca dịch quan thần, khác mahāmacca ở 18.3 dịch quan đại thần; đo toàn tầng amacca: đại thần 10, quan 6 khoá. (11) 9.3 Pāsādiko dassaniyo dịch Dễ mến, đẹp mắt: 0 tiền lệ. (12) 10.1 Haṁsārāmamupeccāhaṁ: giữ nguyên tên Haṁsārāma (0 tiền lệ), khác tha-ap547 dịch Jetārāma là tu viện Jeta vì ở đó Jeta là tên người. (13) 10.4 tādino dịch bậc Như Thật, đo trong tầng: 91 khoá tādino (nhiều dạng, đa số mang chữ bậc Bất Động hoặc đấng Như Thật). (14) 12.1 homahaṁ: dịch nguyện tôi được như vị ấy (optative homa). (15) 13.3 đến 13.4 Kathaṁ nāma ... viphalo siyā: câu hỏi tu từ, dịch bằng dấu hỏi dù Pāli kết bằng dấu chấm; chủ thể (người đã tỏ lòng tôn kính) không nêu trong Pāli. (16) 19.4 narāsabho dịch đấng Nhân Ngưu (khớp tha-ap547:6.2). (17) 20.4 viyatto nītikovido dịch lanh lợi, thông thạo cách xử thế: nīti có thể là chính sách hay đạo lý; 0 tiền lệ; chọn nghĩa rộng nhất. (18) 21.1 đến 21.4: chủ thể là Đức Phật (Siddhattha); vayasā chỉ tuổi xuất gia, chabbassaṁ vītināmetvā chỉ khoảng sáu năm; không thêm khổ hạnh. (19) 21.4 và 22.4 āsi buddho: dịch đã thành Phật (aorist của āsi mang nghĩa trở thành theo ngữ cảnh), khớp tiền lệ Bồ-tát đã thành Phật (1 khoá ahosi). (20) 23.1 Isivhayaṁ: dịch nơi có tên Isi theo tiền lệ nơi có tên Kapila (kapilavhayaṁ, 6 khoá); không suy ra Isipatana vì Pāli không nêu. (21) 24.3 giriṁ: dịch ngọn núi ở xứ Magadha; Pāli có thể ám chỉ Giribbaja nhưng không nêu. (22) 25.3 dasabalaṁ dịch bậc Mười Lực (0 tiền lệ thơ; chỉ có dasabaladhara trong văn xuôi). (23) 26.1 mahesiṁ yācitvā: chủ thể thỉnh cầu là tác giả (tôi) còn đối tượng là Đức Phật; 26.2 pāpayiṁ = đưa đến (làm cho đến).

  SỬA BẢN NHÁP ĐÃ BẮT. Phép dò Pāli trùng nguyên văn trong chính bài bắt được một lỗi: bản nháp đầu 27.3 viết Là bậc tối thắng, lệch với 8.3 cùng Pāli (Kulappasādakānaggaṁ); đã sửa thành Bậc tối thắng trong những vị làm gia đình tịnh tín cho đồng nhất (2/2 khoá cùng Pāli trong bài). Không có lỗi cổng nào được bắt vì không được chạy cổng.

