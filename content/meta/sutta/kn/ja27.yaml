notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ dưới 40 ký tự). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép mở ở `1.1` và đóng ở `:2.1` (hoặc `1.4`), nên cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Jātaka` giữ nguyên (129 chỗ). `Ekakanipāta` → *Bộ Một Bài Kinh*. Dòng niết `<X>jātakaṁ <số>` → *Kinh <X> thứ <số>.* theo đa số trên đĩa (71 chỗ không dấu phẩy so với 24 có). Tên riêng giữ nguyên dạng Pāli ở cả `:0.4` và dòng niết — cùng cách *Kinh Paṇṇikajātaka*, *Kinh Udañcanījātaka*, *Kinh Sālittakajātaka*, *Kinh Parosata* đã có.

  **Ngoặc kép ở khoá cuối.** Pāli `ja67:1.4` là `Yato sodariyamānayeti.` — mở `“` ở `1.1` mà **không** có `”ti` đóng. Tôi đóng `”` ở `1.4` (không có `ti`, vì Pāli không có), đúng cách `ja115:1.4` đã làm cho đúng trường hợp này. Các bài Jātaka còn lại trong lát có `”ti` ở vế cuối nên tôi giữ `”ti`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có 26 chương Pháp Cú), nên `triangulation` là Pāli + English Sujato.
  **Bốn vế Pāli này không trùng bài nào đã dịch** — tôi đã quét Pāli của toàn bộ tầng Việt sẵn có và không có khoá nào trùng. Nhưng `Abhiṇhajātaka` là **công thức đặt tên theo chữ mở đầu**, nên tôi dịch cả kệ theo đúng cấu trúc `…Nālaṁ kabaḷaṁ padātave, / Na ca … na … na …; / Maññāmi …, / Nāgo …”ti.`: chữ thứ trong mỗi vế lặp lại ở vế sau.

  **Chủ thể và giới hạn đề quanh.** `Maññāmi` là số ít ngôi một, nên người nói là con voi đang kể (*Tôi nghĩ rằng…*), đúng như Sujato (*I think by seeing the dog often, the elephant grew fond of him*). `Maññāmi` là **nghĩ là**, không phải **biết chắc là** — tôi giữ *Tôi nghĩ rằng* chứ không rút thành mệnh đề khẳng định, vì đây là chỗ dễ nâng mức độ chắc chắn quá mức Pāli cho phép.

  **Thuật ngữ đặt mới, kèm số tiền lệ.** `abhiṇha` → *thường xuyên* (**0 tiền lệ** trong tầng; tôi đã dò `hay nhắc` / *tính tích* / *thường nhắc* — đều 0). Hệ quả: `Abhiṇhajātaka` tôi **giữ Pāli** trong tiêu đề thay vì đặt nhãn Việt, vì mọi cách Việt thông dụng đều trôi nghĩa (*tính tích* = chuyện phiếm; *hay nhắc lại* = chuông chùa), và tầng đã có tiền lệ giữ Pāli cho tiêu đề Jātaka khi không có cách Việt đáng tin. `nālaṁ` → *chỉ*; `kabaḷaṁ` → *miếng nhỏ*; `padātave` → *cho ăn*; `piṇḍa` → *thức ăn*; `kusa` → *cỏ*; `ghaṃs` → *xoa xát* (voi được chà xát); `abhiṇhadassanā` → *thường xuyên nhìn thấy*; `snehamakāsi` → *tạo tình*; `kukkure` (chữ cách của `kukku`) → *con chó ấy*. `Kuruṅgavagga` → *Phẩm Nai Bốn Sừng* (7 chỗ: `ja21`–`ja25`, `ja28`).
