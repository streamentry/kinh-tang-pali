  **Chỗ cố ý lệch tiền lệ — đều có số đếm, đều ghi lý do:**
  · `3.2` `nekkhammaṁ`: tiền lệ trùng nguyên văn duy nhất (`thag6.14:6.2`) viết *xuất
    giao*; tôi viết **xuất gia**. Đo toàn tầng: *xuất gia* **1.110 khoá**, *xuất giao*
    **1 khoá**. Tầng đa số ủng hộ *xuất gia*; *xuất giao* nhiều khả năng là lỗi gõ.
  · `1.4` `abbhuto lomahaṁsano.`: tiền lệ trùng nguyên văn (`thag6.1:2.4`) viết *dựng tóc
    gáy bàng hoàng*; tôi viết **rợn da gà**. Công thức Pāli `abbhutaṁ lomahaṁsanaṁ` có
    **2** bản dịch, cả hai dùng *rợn da gà* (`pv35:9.2` *đáng kinh ngạc, rợn da gà;*,
    `tha-ap113:6.2` *thật là rợn da gà kinh khủng bố;*); toàn tầng *rợn da gà* **5 khoá**.
    Tôi theo đa số công thức, không theo một bản calque.
  · `11.4` `‘āratī’ dāni sā mama.`: **không** có tiền lệ trùng nguyên văn (`āratī` có dấu
    dài, còn `thig3.7:2.4` và `thig6.3:3.4` đều viết `aratī`). Hai bản dịch ấy cùng đọc là
    *"nay không còn là thích thú với tôi"*; tôi theo cách đó, nhưng phải **giữ hai dấu nháy
    đơn** mà Pāli đặt quanh `āratī` — đây là chi tiết phép so dấu nháy bắt được, không phải
    sở thích văn phong.
  · `12.1`–`12.4`: cặp kệ này **trùng nguyên văn byte** với `thig3.7:3.1–3.4` và
    `thig3.8:3.1–3.4`, mà hai bản Việt ấy **khác nhau**. Tôi chọn theo đa số cả công thức
    (kể cả dạng chữ thường ở `thig6.3`, `thig7.3`, `thig8.1`):
    `12.1` **4/8** *Ở mọi nơi, hoan hỷ đã bị quét sạch,*;
    `12.2` **3/5** *khối u tối dày đặc đã bị phá tan;*;
    `12.3` **3/7** *Hãy hiểu rõ điều này, kẻ xấu xa,*;
    `12.4` **5/7** *ngươi đã bị đánh bại, kẻ Tận Diệt* (và `thig3.8:3.4` cho đúng dạng có
    `ti`). Trường từ theo dùng để xưng hô ở `12.4` khớp với `12.3` trong bản tôi chọn.
  · `14.1` `niṭṭhito`: trong phạm vi `thig`, **10 tệp đã dịch dùng 10 cách khác nhau**
    (*đã hoàn tất*, *đã kết thúc*, *kết thúc*, *hoàn tất*, *chấm dứt*, *viên mãn*,
    *đã khép lại*, …) ⇒ **không có đa số** trong phạm vi. Tôi theo phép so đối gần nhất:
    `thig10.1:13.1` cùng phẩm, cùng khuôn *nipāta* + mốc cấu trúc, dùng *Bộ Mười Một Bài
    Kinh đã hoàn tất.* ⇒ *Bộ Mười Hai Bài Kinh đã hoàn tất.*  Người biên tập muốn thống
    nhất cả bộ thì việc đó ngoài lát này.
  · `4.2` `dibbacakkhu visodhitaṁ;`: **27** nơi trùng nguyên văn nhưng chỉ **5** có bản dịch,
    **5/5** đều dùng gốc *thiên nhãn đã được thanh tịnh*, chỉ khác vế đuôi (*hoàn toàn*,
    *sáng ngời* ×2, *trong sạch*, *của ta được thanh tịnh*). Pāli chỉ có `visodhitā` =
    *thanh tịnh*, nên tôi giữ đúng một vế, **không** thêm vế đuôi nào.
  · `1.3` `Tassā me ahu saṁvego,`: tiền lệ trùng nguyên văn (`thig5.6:3.1`) viết *Rồi lòng
    ta khởi lên nỗi kinh cảm sâu sắc,*, có chữ *Rồi* không có trong Pāli khoá này và lệch
    ngôi kể. Tôi viết *Điều ấy làm tôi thấy ghê tởm,*.

  **BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ:**
  · `1.2` `mayaṁ āsuṁ sapattiyo` và `2.4` `sabhariyā mayaṁ ahuṁ` — **hai từ cốt lõi của cả
    bài, và không có tiền lệ nào trong tầng.** Đo được: `sabhariyā` chỉ xuất hiện **1** lần
    trong toàn bộ Pāli root đã ghim (đúng khoá này); `sapatti` có **3** nơi (`ja489:8.4`,
    `pv15:28.4`, khoá này) và **không** nơi nào có bản Việt. Sujato đọc `sapattiyo` là *co-wives
    của chính người nói*, còn cách đọc của tôi — cả mẹ lẫn con gái **đều làm vợ chung với
    chồng tôi**, nên chính tôi là kẻ cùng làm vợ — là cách đọc theo cú pháp `ubho … sapattiyo`
    + `mayaṁ āsuṁ`. Tôi theo Pāli là authority cuối cùng và dịch *làm vợ chung*, nhưng đây là
    chỗ người đọc khác có thể đọc ngược; xin biên tập cân với luận giải.
  · `6.4` `tādino` — **bất định lớn nhất của bài.** Đo được: `tādin` có **175** nơi trong Pāli
    root nhưng chỉ **3** khoá có bản Việt (`dhp94:4`, `dhp95:4`, `dhp96:4`, cả ba dịch
    *vị như vậy*) và cả ba đều ở **vị ngữ khác** (danh từ bổ nghĩa sau danh từ), không
    phải tân ngữ như `lokanāthassa tādino` ở đây. Bản Anh đã ghim dịch cụm này là *"the
    glorious protector of the world"*, tức **bỏ hẳn** `tādino`. Tôi dịch *bậc đã vững chắn* —
    đọc `tādin` là "kẻ đã vững vàng / đã tuyên quyết" — và ghi rõ đây là **lựa chọn của tôi,
    cần xác nhận**. `lokanātha` thì có tiền lệ: **5** khoá tầng dịch *Đấng Bảo Hộ Thế Gian*,
    tôi theo.
  · `7.3` `Na cāpi te dutiyo atthi koci` — Pāli không có chữ nào chỉ *"người nam"*, nhưng bản
    Anh đã ghim thêm *"male companion"*. Tôi không thêm, vì thêm chữ ở chỗ Pāli không có là
    thêm chữ không nguồn nào chứng thực tại.
  · `8.3` `napi sampavedhe` — tôi đọc là *cũng chẳng run rẩy*, theo bản văn xuôi song song
    `sn5.5:4.3` (`Lomaṁ na iñjāmi na santasāmi`) và Sujato (*nor tremble*). Nghĩa thứ hai của
    `pavedi` là *rỉ / thấm qua* thì không hợp ở đây.
  · `8.4` `Kiṁ me tuvaṁ māra karissaseko` — tôi dịch câu hỏi tuổi tương lai (*Ngươi làm được
    gì cho ta một mình, Ác Ma?*). Sujato dùng thì hiện tại. `māra` gọi thẳng tên: tầng dùng
    *Ác Ma* **nhiều hơn** *Ma vương*, tôi theo *Ác Ma*.
  · `11.4` `‘āratī’ dāni sā mama` — bản Anh đã ghim hiểu là *"is now no delight for me"*,
    tức coi `mama` là dative; cách đọc khác là chữ *āratī* **nay thuộc về tôi** (bà ấy tự
    dùng thuật ngữ của bậc giác ngộ thay cho thuật ngữ của Ma). Tôi theo cách đầu vì cả hai
    bản Việt đã có ở `thig` đều đọc như vậy. Người biên tập có thể phán lại.
  · `0.3` / `13.1` — tên viết **liền một chữ `Uppalavaṇṇā`**, khớp với `sn5.5:0.3`
