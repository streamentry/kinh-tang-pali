  **terminology fix (2026-10-04, coordinator).** `Gadrabhavagga` bị dịch "Phẩm Con Lừa" ở khối `:0.3` — lẫn với `Kumbhavagga` (con lừa). `gadra` là **con sóc**, và hai tệp cùng phẩm (mil7.2.1, mil7.2.6) đã dùng đúng "Phẩm Con Sóc". Đếm toàn tầng trước khi sửa: 6 tệp lừa / 2 tệp sóc / 1 tệp giữ PĦLI. Đã đồng nhất sang sóc.

  Sửa lan 2026-10-13, thay cho ghi chú "terminology fix (2026-10-04)" ở trên: khoá `mil7.2.10:0.3`
  *Phẩm Con Sóc* → *Phẩm Con Lừa*. Căn cứ: `gadrabha` là **con lừa** (chính bài này, `mil7.2.10:7.1`
  `Gadrabho ceva kukkuṭo`, dịch *Con lừa, con gà trống*, rồi `kalando` là *con sóc* ở `7.2`, nên hai
  con vật khác nhau); `mil7.2.10:5.1` `Gadrabhavaggo paṭhamo` đã dịch *Phẩm Con Lừa, thứ nhất*, và
  `mil7.1` cũng ghi *Phẩm Con Lừa*. Khoá `0.3` phải khớp `5.1` của cùng bài. Nhận định cũ "`gadra` là
  con sóc" là sai. Bảy tệp `mil7.2.x` khác còn ghi *Phẩm Con Sóc* (`mil7.2.1`, `3`–`8`) và hai tệp ghi
  *Phẩm Con Lừa* (`mil7.2.2`, `mil7.2.9`) nằm ngoài phạm vi lượt sửa này.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan). Đọc đối kháng đủ 23 khoá Pāli↔Việt, đo tiền lệ trên tầng Milinda (8.021 khoá), tầng Nikāya (127.856 khoá) và tầng Tiểu Bộ ngoài Milinda (145.546 khoá). Đổi 15/23 khoá; điểm cũ bỏ sót các lỗi dưới đây nên được hạ, không nâng.
  - `1.1`, `1.4`, `2.3`, `4.1`, `0.4` (accuracy + terminology fix): `aṅga` từ *đức tính* thành *phần*. Đo trong `mil7`: *phần* 193, *chi phần* 57, *đức tính* 38; khoá liệt kê tương ứng `mil7.1:12.1` đã dịch *phải nắm lấy hai phần của con khỉ*, nên bài này lệch chính khoá liệt kê của nó. `gahetabba` từ *học tập* thành *nắm lấy* (cùng đa số, như `mil7.2.1`–`9`). Khoá `1.1` bỏ cụm *Người hành giả* không có trong Pāli và đổi xưng hô sang *Thưa tôn giả Nāgasena, tôn giả đã dạy rằng* (40/67 khoá `yaṁ vadesi` ở `mil7`, cùng khuôn với `mil7.2.1`). Tiêu đề `0.4` trước đây để nguyên Pāli, nay dịch.
  - `1.2` (accuracy fix): bản cũ nuốt `tathārūpe okāse` và dịch `mahatimahārukkhe` thành *một nơi trên cội cây*; `bhīruttāṇe` thành *an toàn khỏi hiểm nguy* (đã có tiền lệ *nơi che chở cho kẻ sợ hãi* ở `mil6.4.2:29`). `sabbaṭṭhakasākhe` cũ *cành lá sum suê* là đoán; nay *cành nhánh ở khắp mọi phía* (xem bất định dưới).
  - `1.3` (accuracy + terminology fix): `lajjiṁ` *có lòng tàm quý* thành *biết hổ thẹn* (`lajjī` ở 38 khoá `an`/`mn`/`dn`/`sn`, 27 khoá dịch *hổ thẹn*, 3 khoá dịch *tàm quý*); `pesalaṁ` *khả ái* thành *hiền thiện* (`snp3.10:2.4`); `vattāraṁ` bị bỏ sót hoàn toàn nay có *biết nói*; `vacanakkhamaṁ` *biết nhẫn nại lời nói* thành *chịu được lời góp ý* (`an7.37`); `ovādakaṁ` *biết khuyên dạy* và `viññāpakaṁ` trước kia dịch trùng nghĩa (*khuyên dạy*, *khuyên răn*) nay tách thành *khuyên dạy* / *làm cho hiểu rõ*; `samuttejakaṁ` *biết thúc đẩy* thành *làm phấn chấn* (tiền lệ chuỗi `sandasseti samādapeti samuttejeti sampahaṁseti`); bỏ *thiện tri thức*, *khai thị*; đồng thời bỏ tiền tố *biết* lặp. Tên *đạo sư thiện tri thức* thành *thầy là bạn lành* theo `kalyāṇamittaṁ ācariyaṁ`.
  - `2.1`: `vāsamanubhavati` *ngủ qua đêm* thành *trải qua đêm*; `niddaṁ okkamati` thành *đi vào giấc ngủ*. `2.2` (terminology + accuracy fix): `satipaṭṭhāna` bị dịch *chánh niệm*; toàn tầng `mil` và `an`/`mn`/`sn` dịch *niệm xứ* (10/10 khoá `mil` khác chứa từ này đều là *niệm xứ*, kể cả `mil7.2.3`, `mil7.3.3`, `mil7.5.10`). Bỏ chữ *tâm* thêm vào ở `pavanābhimukhena` (Pāli chỉ nói hướng về rừng) và chữ *vắng* thêm vào ở `pavane`; `ṭhānacaṅkamanisajjāsayanaṁ niddaṁ okkamitabbaṁ` tách rõ *đứng, đi kinh hành, ngồi, nằm* và *đi vào giấc ngủ*.
  - `2.4`: thêm vế *cũng* của `bhāsitampetaṁ`, đổi *thuyết giảng* thành *nói*, đặt *Trưởng lão Sāriputta, Tướng quân Chánh pháp, nói—* theo trật tự Pāli và khớp `mil7.2.1:1.6`, `mil7.2.9:2.4`.
  - `3.3`/`3.4` (grammar fix, lỗi nặng nhất): `vaṇṇitaṁ` là trung tính, đi với `pavanantaṁ`, không phải với `bhikkhu` (nam tính); bản cũ *như được tán thán giữa chốn rừng sâu* gán việc được tán thán cho vị tỳ-kheo và đặt `pavanantaṁ` thành địa điểm. Nay *chính vùng rừng ấy được tán thán*; bỏ *vắng* thêm vào ở `3.3`.
  - `0.2` từ để nguyên Pāli thành *Câu hỏi về cách dùng dẫn với ví dụ* (42 khoá cùng tầng đã dịch như vậy, 8 khoá để Pāli). `7.1` *con gà trống* thành *con gà* (`mil7.1:4.1`, `mil7.2.2`); `7.4` *chim quạ và loài khỉ* thành *con quạ và con khỉ* (`mil7.2.9`, `mil7.1:12.1`).
  Điểm: semantic_fidelity 9.3→8.8, grammar_logic 9.3→8.9, terminology 9.2→8.9, vietnamese_clarity 9.3→9.0, han_viet_balance 9.4→9.3, ambiguity_integrity 9.2→8.5 (các tiêu chí khác giữ nguyên); final_score 9.23→9.00. Hạ vì lượt chấm cũ đã bỏ sót lỗi có thật: một thuật ngữ lệch 10/10 tiền lệ trong `mil`, một từ trong chuỗi bị bỏ, một lỗi ngữ pháp đảo chủ thể ở khoá kệ. Đúng 9.0 không đủ để vượt ngưỡng `> 9.0`.
  Bất định còn lại (không phân xử được, giữ ở đây, không đưa vào thân kinh): (1) `sabbaṭṭhakasākhe` gần như hapax trong tầng Pāli đã ghim (chỉ `sabbaṭṭhakaṁ` ở `mil6.3.3:3.6` là từ khác nghĩa); *cành nhánh ở khắp mọi phía* dựa vào ngữ cảnh một bản Việt nguyên bài đọc để hiểu, không dựa vào tầng Anh hay từ điển đã ghim; có thể là cách đọc khác của `sabbaṭṭhaka`. (2) `pavanantaṁva` (hapax): `anta` hiểu là *vùng/chốn*; `va` có thể là `eva` (*chính*) hoặc `iva` (*như*). Cách đọc `eva` được chọn vì `vaṇṇitaṁ` là trung tính; nếu là `iva` thì câu phải đọc khác. (3) `vattāraṁ` dịch *biết nói* là nghĩa đen; ý "người nói điều cần nói" chưa được ghi vào lời kinh. (4) `Tâu Đại vương` / `Này Đại vương` giữ *Tâu* (nhất quán nội bộ bài và `mil7.2.6`), nhưng toàn tầng `mahārāja` là *này* 1.307 / *tâu* 831 (trong `mil7` 308 / 174): đây là lựa chọn văn phong, không sửa. Không có tầng tham khảo tiếng Anh nên `triangulation` giữ 7.5.
  technical_integrity 9.6; chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này.
