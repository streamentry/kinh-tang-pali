notes: |-
  Đã đọc HẾT Pāli lát qua v5/p5.txt trước khi viết. Không segment nào của lát này có …pe… nên hai phía đều 0 dấu lược. Mọi dấu nháy kép đều cân trên cả bài.
  Phẩm Littavagga → Phẩm Những Điều Nhỏ: 0 tiền lệ cho tên phẩm này (ja1 Phẩm Bụi Dơ, ja12 Phẩm Giới, ja21 Phẩm Nai Bốn Sừng, ja101/106/107 Phẩm Parosata); litta = nhỏ, bé, ngắn, mà Pāli không nói cái gì nhỏ nên dịch theo nghĩa chữ, không gắn vào con vật nào. Giữ Jātaka và Bộ Một Bài Kinh theo ja1, ja12; 0.1 và 0.2 ngắn hơn 40 ký tự nên chốt không kiểm trùng Pāli, nhưng tầng đã có tiền lệ dùng nguyên văn Jātaka.

  Bốn vế trùng công thức với ja101:1.1–1.4 (đã có trong tầng), nên dịch theo đúng
  hình dạng đó. Khác biệt đã giữ đúng hai chỗ: Parosahassampi là hơn nghìn (ja101 là
  Parosatañcepi hơn trăm), nên dùng nghìn chứ không dùng trăm; Kandeyyuṁ là nấu (ja101
  là Jhāyeyyuṁ, tu thiền), nên dùng nấu chứ không dùng tu thiền. Vế 3 và 4 Pāli giống
  hệt, dùng nguyên văn cùng cách dịch.
  Tiền lệ có đếm: parosahassa = hơn nghìn (0 tiền lệ cho số này; kẻ vô trí 1, nghìn
  thì có nhưng đoạn này không dùng); kẻ vô trí, một người có trí, ý nghĩa của lời đã
  nói theo ja101.
  parosahassa không mang dấu Pāli nên không bị chốt lọt_pāli chặn; dịch bỏ hậu tố
  -jātaka trong tiêu đề và colophon được vì tiêu đề tiếng Việt không cần hậu tố khi tên
  đã là tên riêng, đúng như ja101 (Kinh Parosata).
  Pāli 1.1 không mở nháy kép còn 1.4 đóng; đã mở nháy ở 1.1 cho khớp quy ước, vì bản
  chụp ở khoá này thiếu dấu mở.
