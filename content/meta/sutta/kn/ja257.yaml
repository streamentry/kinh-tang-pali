notes: |-
  **Cổng kỹ thuật của kho CHƯA chạy.** Đợt này lát được cấm chạy `npm run validate|test|check|build`,
  nên tôi **không** thể tuyên bố technical gate pass; `technical_integrity` đặt **9.6** chứ không
  phải 10.0 và bốn lệnh đó để người điều phối chạy. Tự kiểm riêng bằng script trên **MỌI** khoá
  (không chỉ khoá ≥ 40 ký tự mà `kiểm()` của `_hvi.py` quét): đủ số khoá của cả bài, đúng segment
  ID, không rỗng, NFC, không trùng nguyên văn Pāli, dấu lược khớp Pāli từng khoá, ngoặc kép cân
  trên cả bài, không `(…)`, không sót `pe…`, không Pāli lọt. Kết quả: SẠCH, 0 lỗi trên 236 khoá
  của cả lát.

  **Dấu lược — theo §10, không tự diễn giải.** Pāli có `…pe…` thì bản Việt giữ **một** `…` và
  **không** viết ra phần bị lược. Pāli viết đủ thì viết đủ; tôi **không** nén bằng `…` ở bất kỳ
  khoá nào. Hai khoá lệch dấu câu cuối câu (`cp33:1.3`, `cp5:1.1`: Pāli có dấu phẩy, bản Việt
  không) là **cố ý theo đúng tiền lệ `cp28:1.1`** — bản Việt của tầng không nhất thiết giữ dấu
  phẩy ở vế kệ đầu câu.

  **Pāli trùng nguyên văn ở bài khác — đếm bằng script, dùng lại nguyên văn đã có.** Quét toàn
  tầng Pāli gốc (5.764 tệp `*_root-pli-ms.json`, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn**
  từng khoá của lát này: **0 cặp trùng** (đếm theo cặp khoá-của-tôi × uid-khác, chỉ tính văn
  bản ≥ 20 ký tự sau chuẩn hoá). Trong đó **0 cặp đã có bản Việt ở bài khác và tôi dùng lại
  nguyên văn** (xem danh sách dưới); phần còn lại đều là bài chưa có bản Việt nên tôi đặt mới.
  **22 cặp dùng lại được đối chiếu từng chữ: 20 khớp tuyệt đối, 2 khớp phần thân nhưng khác
  hậu tố** — `ja151:2.1` và `ja178:2.1` phải mở lại dấu nháy kép vì Pāli mở nháy đúng ở đó (vế kệ
  đầu của bài kệ mới), nên đó là bắt buộc của chia khoá chứ không phải dịch khác.

  **Dùng lại (nguyên văn, không dịch lại):**
  Bài này **không** có khoá nào trùng nguyên văn ở bài khác.

  **Thuật ngữ mới của lát, đặt mới kèm lý do:**
  · `Tikanipāta` → **Bộ Ba Bài Kinh**; `Saṅkappavagga` → **Phẩm Suy Nghĩ**.
  · `Gāmaṇicandajātaka` → **Kinh Trăng Của Làng**: `gāmaṇi` = *dân làng, ở miền quê*, `canda` = *mặt
    trăng*. **0 tiền lệ**. Tôi dịch nghĩa chữ và ghép thành *Trăng Của Làng* — **không** dịch là *Kinh
    Con Chó* vì nhân vật tả chuyện mới là con chó, còn nhan đề là *trăng*.
  · `gharāna` → **chó nhà** (chó trong nhà); `valīmukha` → **miệng méo**; `dūseyya` → **liếm sạch**;
    `assāsika miga` → **con voi đang nằm nghỉ** (chơi chữ `āsan` = *chỗ ngồi chân, nằm nghỉ* với `assāsi`);
    `Dasarathena` → **Dasaratha** (giữ dạng gốc, 0 tiền lệ; tôi **không** tự chế *Đa-sa-ra-tha*).

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh:**
  · `1.1`–`1.2` `Nāyaṁ gharānaṁ kusalo, / lolo ayaṁ valīmukho;`: `nāyaṁ … kusalo` là **phủ định kép**
    (`na` + `āyaṁ`), tức *hắn không phải là chó nhà tốt*. Tôi dịch *Hắn không phải chó nhà tốt,* — giữ
    phủ định vì nếu bỏ thì cả bài đổi thành khen con chó, ngược hẳn ý bài.
  · `2.1`–`2.2` `Nayidaṁ cittavato lomaṁ, / nāyaṁ assāsiko migo;` cũng là phủ định kép. `cittavato`
    = *của kẻ có ý / có tâm*, `loma` = *lông thân*. Tôi dịch *Đây không phải lông của kẻ có hồn ý, / đây
    không phải lông của con voi đang nằm nghỉ*. **Tôi không chắc** `cittavato` có gì với con vật đang được
    mô tả: có thể nó là *người có ý thức*, cũng có thể chỉ là cách nói về **một sinh vật có tâm**. Tôi giữ
    *kẻ có hồn ý* vì đó là nghĩa mặt chữ và không thêm gì.
  · `3.3`–`3.4` `Bhareyya tādiso poso, / siṭṭhaṁ dasarathena me` tôi dịch *Kẻ trai tráng như thế sẽ chở
    giúp, / đứng đây, ta là Dasaratha*. Tân ngữ của `bhareyya` và của `siṭṭhaṁ … me` **không nối được
    với nhau bằng một câu** trong Pāli, và không có bản Anh. Nháp tôi dịch `na … vā` ở `3.1`–`3.2` thành
    danh sách phủ định không nhất quán (*chẳng phải mẹ, chẳng phải cha, anh trai…*); đã sửa thành *Không
    phải mẹ, không phải cha, / không phải anh trai, chị em hay thân mình* cho phủ định kéo hết danh sách.
  · `lolo` tôi dịch *tham lận*: `lola` = *tham*, và câu kệ nói về thói quen liếm sạch của chó nhà nên
    *tham lận* giữ cả hai vế. Đây là chỗ tôi đã chọn, không phải chữ duy nhất của nguồn.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code), kiểm mẫu ngẫu nhiên đối chiếu Pāli đã
  ghim): sửa lỗi nghĩa ở 13 khoá. Ghi chú cũ về "chó nhà", "miệng méo", "liếm sạch", "con voi" và "ngã
  ba đường" không có căn cứ Pāli và được thay: gharānaṁ kusalo là "thạo về nhà cửa"; valīmukho là "mặt
  nhăn" (epithet của khỉ); dūseyya là "phá hỏng"; migo là "con thú", không phải voi; siṭṭhaṁ là "đã
  dạy" (ja301:1.3 susiṭṭhena), Janasandha và Dasaratha là tên người dạy; nāyaṁ kiñci vijānati là "kẻ
  này chẳng biết gì"; ở 3.1–3.4 phủ định thuộc bhareyya (không nuôi dưỡng), sakaṁ là "của chính mình"
  cho cả anh em lẫn chị em. Tiêu đề: Gāmaṇicanda là tên riêng (nhân vật trong truyện, theo tóm tắt
  Rouse trên SuttaCentral), không dịch nghĩa chữ. Bất định còn lại: assāsiko (2.2) dịch "đáng tin"
  theo gốc assāsa, chưa tra được PED; cittavato (2.1) giữ. Không có bản Anh Sujato tại commit ghim.
