notes: |-
  Phẩm Nai Bốn Sừng đồng nhất với ja21/ja22/ja23/ja25 cùng vagga.
    ājānīya → ngựa thuần chủng (ngựa thuần 60 occ, thuần chủng 46); ngựa thiến đồng nhất
    với ja23:1.3; hāyanti → bị bỏ lại; tattha → ngay tại đó.
    1.1–1.2 là lối lặp chữ yadā/yattha đảo nhau của Pāli; bản Việt giữ nguyên số lượng và
    thứ tự lặp (bất cứ lúc nào/bất cứ ở đâu) thay vì gọn nghĩa — repetition mang cấu trúc.
  Đối chiếu Pāli đã ghim với Anh Sujato ở 8/9 khoá; khoá kết 2.1 Sujato để trống
    (công thức tên kinh + số thứ tự), dịch từ Pāli theo tiền lệ ja1 đã published
    (Kinh Bụi Dơ thứ nhất). Không có tầng Việt hiện hành cho Jātaka trong snapshot
    đã ghim (tiếng Việt upstream chỉ có Pháp Cú) — giới hạn của bản chụp, không phải
    thiếu sót của repo. Không có dấu lược …pe… trong Pāli lát này nên hai phía đều 0.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): ja24:2.1 — `catuttha` dịch số thứ tự “thứ bốn” → “thứ tư”
  (dạng chuẩn của số thứ tự tiếng Việt). Giữ nguyên phần còn lại của từng khoá.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): ja24:2.1 — `catuttha` dịch số thứ tự “thứ bốn” → “thứ tư”
