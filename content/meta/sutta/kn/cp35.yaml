notes: |-
  Dịch từ Pāli root đã ghim, đối chiếu bản Anh của Bhikkhu Sujato tại cùng commit bilara. Tại commit đã ghim không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya, nên không có tầng Việt truyền thống để so.

  PHẠM VI. Bài đủ 67 khoá, khớp tập khoá Pāli, theo đúng thứ tự Pāli. Lát này viết 66 khoá; khoá `cp35:18.1` (câu kết Itthaṁ sudaṁ) được giữ nguyên từ lát trước, không sửa. Blocker cũ của bản nháp (bài chỉ phủ 1 khoá) đã hết vì bài nay đủ khoá.

  COVERAGE ANH, đo theo công thức của `source/layers.yaml` (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `:0`): mẫu số = 1 (chỉ `cp35:18.1`; toàn bộ kệ ngắn hơn 40 ký tự), Sujato phủ 1/1, ratio 1,0000. Mẫu số chỉ là 1 nên cổng gần như không đo được gì ở bài kệ này; con số có ý nghĩa hơn là: Sujato có chữ Anh ở 53/67 khoá, và 14 khoá để trống là `:5.1`, `:6.1`, `:7.1` (câu kết hạnh, kết phẩm, tiêu đề uddāna), `:8.1`–`:9.6` (toàn bộ bài kệ uddāna liệt kê tên các hạnh của phẩm) và `:19.1` (câu kết Hạnh Tạng). Những khoá đó dịch từ Pāli một mình. Tầng `english-project` và `vietnamese-current` không có gì cho bài này.

  TIỀN LỆ, có số đếm. Trong tầng Việt, Pāli trùng nguyên văn với 4 khoá: `:0.1` Cariyāpiṭaka → Hạnh Tạng (25 trong 26 bài cp đã dịch; 1 bài giữ Pāli), `:0.2` Yudhañjayavagga → Phẩm Yudhañjaya (12/12), `:7.1` Tassuddānaṁ → Tóm lược: (đa số, theo cp20:10.1 và thag1.70), `:9.2` kaṇhadīpāyano isi khớp cp31:1.2 (ở đó câu có thêm chủ ngữ ta là, nên bản Việt khác đúng chỗ cần khác). Trong chính bài có 2 nhóm Pāli trùng: `:10.4`, `:11.4`, `:12.4`, `:13.4`, `:14.4` (patto sambodhimuttamaṁ) và `:15.4`, `:16.4`, `:17.4` (esā buddhānusāsanī); cả hai nhóm bản Việt giống nhau tuyệt đối, 0 cặp lệch. Tên khoá `:0.3` Upekkhāpāramī 1 → Xả Ba-la-mật Thứ Nhất theo đúng khuôn các bài Dānapāramī, Sīlapāramī, Nekkhammapāramī, Saccapāramī (Bố Thí, Trì Giới, Xuất Gia, Chân Thật Ba-la-mật Thứ N). Tên bài `:0.4`/`:5.1` dịch theo nghĩa chữ (loma-haṁsa = dựng tóc gáy; cùng cách thag6.1 dịch lomahaṁsano là dựng tóc gáy), vì đây là tên mô tả chứ không phải tên người như các hạnh khác.

  THUẬT NGỮ, có số đếm (đo trên toàn tầng Việt hiện có). upekkhā → xả (405/416 khoá chứa chữ xả). pamāda → phóng dật (430/620; buông lung 99). kosajja → biếng nhác (14 so với lười 11). aṭṭhaṅgika magga → Bát chánh đạo (133/161; tám chi phần chỉ 5). sambodhi → giác ngộ (239/301; Chánh giác 85), và đúng cụm sambodhimuttamaṁ đã được iti34, iti79, iti110 dịch là giác ngộ tối thượng. mahesi → Đại Ẩn Sĩ (69/108). khema → nơi an toàn (snp3.1, thig11.1, thag6.14 dùng chốn/chỗ an toàn; snp5.12 dùng an ổn). saccavācānurakkhiya → giữ gìn lời nói chân thật (khớp cp32:6.3). gāmaṇḍalā → thanh niên trong làng (khớp mn12:51.2, cùng cảnh người làng đến chỗ vị tu nằm nghĩa địa). susāna → nghĩa địa (31/48; bãi tha ma 11). saṁviggamānasa → tâm xúc động (khớp tha-ap445:2.4). lābhālābhe yasāyase → được và mất, danh tiếng và tai tiếng (khớp mil7.4.1:1.3). vīriyārambha → sự khởi tinh tấn (khớp iti109:10.1 sự khởi lên tinh tấn). khanti → nhẫn nhục, nekkhamma → xuất gia, mettā → từ ái trong cụm pāramiṁ gantvā, để khớp tên các Ba-la-mật trong chính Hạnh Tạng (Xuất Gia Ba-la-mật; cp34 dùng từ ái). Tên người ở uddāna `:8.1`–`:9.4`: Yudhañjaya (cp21), Ayoghara (cp23), Vua Khỉ (cp27), Chim Cút (cp29), Vua Cá (cp30), ẩn sĩ Kaṇhadīpāyana (cp31), Sutasoma (cp32), Ekarāja (cp34) lấy đúng cách các hạnh tương ứng đã dịch; Somanassa, Bhisa, Soṇa-Nanda, Mūgapakkha, Sāma chưa có tiền lệ nên giữ Pāli.

  KHÔNG CÓ SỐ PĀLI trong bài, nên không có phép tính số. Nháy: Pāli chỉ có cặp ngoặc kép mở ở `:1.1` và đóng ở `:4.4`, bản Việt khớp từng khoá (0 lệch trên 66 khoá của lát; khoá `:18.1` giữ từ lát trước có cặp nháy đơn bao tên bài mà Pāli khoá đó không có, theo quy ước cũ). Pāli không có dấu lược `…` nào nên Việt cũng không có. Cặp Pāli↔Việt đã in ra đọc từng khoá.

  BẤT ĐỊNH ĐÃ GHI (không đưa vào thân kinh). (a) `:1.2` upanidhāya (kề, đặt gần): Sujato dịch resting on; tôi giữ nghĩa từ là kê xương người chết bên mình và không chọn gối đầu vì Pāli không nói. (b) `:1.4` rūpaṁ dassenti anappakaṁ: Sujato dịch mocked me in all sorts of ways; Pāli chỉ nói bày ra không ít hình thái; tôi dịch bày ra không ít trò và không thêm ý chế nhạo (mn12:51.2 cho thấy cảnh tương tự nhưng đó là bài khác). (c) `:3.4` dayā: Sujato dịch favor; tôi dịch sự ưu ái; nếu đọc là lòng thương xót thì nghĩa đổi. (d) `:4.1` tulābhūta dịch như cán cân thăng bằng; chữ thăng bằng suy từ hình ảnh cán cân. (e) `:8.2` ayogharabhisena: tôi hiểu là hai tên Ayoghara và Bhisa, theo thứ tự các hạnh cp23 và cp24; dạng bhisena không phân tích chắc chắn. Lưu ý: tên hạnh cp24 hiện đã dịch Kẻ Ăn Thịt Người, không khớp nghĩa chữ bhisa; không sửa ở đây vì ngoài lát. (f) `:8.3` Soṇanando: theo cp25 (Soṇa và em Nanda) tôi viết Soṇa-Nanda. (g) `:9.4` ekarājahu: hiểu là Ekarāja + ahu(ṁ) (ta đã là), cùng ngôi với āsiṁ ở `:9.3`; nếu ahu là ngôi thứ ba thì nghĩa vẫn chỉ danh sách các hạnh. (h) `:9.5`–`:9.6` vutthaṁ (từ vasati, đã sống) giữ đúng như root; nếu đọc là vuttaṁ (đã nói) thì câu thành như vậy đã được bậc Đại Ẩn Sĩ nói; Sujato để trống khoá này nên không có bản Anh đối chiếu. (i) `:15.4` buddhānusāsanī: hợp từ không đánh dấu số, Sujato đọc số nhiều; tôi viết lời Phật dạy, không chọn số. (j) Khoá `:18.1` giữ từ lát trước có chữ Tiều trong Tiều Tích Của Đức Phật; đây có thể là chữ chưa ổn, đề nghị biên tập viên xem lại, không sửa ở lát này vì ngoài khoá được giao.

