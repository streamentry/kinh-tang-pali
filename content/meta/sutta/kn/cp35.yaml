notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.

  **Bài đầu tiên của tầng Việt cho `Cariyāpiṭaka` (Tiểu Bộ phần Ký Đời Sống), nên
  tiêu đề ghép cả bối cảnh.** `cp35:0.1` = *Cariyāpiṭaka*, `0.2` = *Yudhañjayavagga*,
  `0.3` = *Upekkhāpāramī 1*, `0.4` = *Mahālomahaṁsacariya*.
  **Tra tiền lệ (đếm được, trong `content/translation/vi/project/`):** `bhagavā` → *Đức
  Thế Tôn* (`an6.1:3.1` "Đức Thế Tôn đã nói như vậy"; 0 chỗ dùng *Bậc Đáng Kính* cho
  `bhagavā` ở dạng chủ ngữ trong câu dẫn); `dhamma` → *Pháp*; `Itthaṁ sudaṁ` → **0 tiền
  lệ**, đặt mới *Nghe thế này* (cụm này chỉ xuất hiện ở tầng chú giải `thi-ap*`, tầng đó
  chưa dịch); `pariyāya` → **0 tiền lệ** cho riêng chữ này, ghép *bài trình bày Pháp*
  (331 chỗ "trình bày" sẵn có trong tầng Việt).
  **Sujato có mặt ở đúng khoá này** (53/67 khoá có Anh) — *That is how the Buddha,
  illustrating his own conduct in past lives, spoke the exposition of the teaching
  named the ‘Legends of the Buddha’.* — nên đã đối chiếu được. Đây là lý do
  `triangulation` ở bài này cao hơn 13 bài Khuddaka còn lại của lát.
  **Bất định đã phân xử:** (1) `buddhāpadāniya` là tên của bài trình bày. Sujato đặt
  tên là *Legends of the Buddha*; tôi dùng **Tiều Tích Của Đức Phật** vì đó là nghĩa của
  chữ Pāli (tiều kiếp của Đức Phật) và đọc được ngay với người Việt, còn *Legends* là
  lựa chọn tên của dịch giả chứ không phải nghĩa từ. Ghi ra đây để biên tập xem. (2) Dấu
  ngoặc kép: **Pāli khoá này không có ngoặc nào**, mà tên bài nằm giữa câu, nên tôi bọc
  bằng cặp `‘’` — vốn là quy ước đã có 9.600 lần trong tầng Việt — để không tự thêm
  `“”` mà Pāli không có. (3) `attano` là sở hữu từ (`của chính Ngài`), không phải từ
  đại từ; bản nháp đầu tiên tôi dịch là "của chính mình" rồi đã sửa.
