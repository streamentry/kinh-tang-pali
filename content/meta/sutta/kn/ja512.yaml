notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Tra tiền lệ (đếm được):** `kumbha` → *bình* (`snp2.7:27.4` "cho sữa đầy bình");
  `dadhi` → *sữa* (`snp1.2:1.1` "đã nấu cơm, đã vắt sữa"); `madhu` → *mật ong*
  (`dn26:19.4` "dầu, mật ong, mật mía và muối"); `vā … vā` → *dù là … hay …*; `rāja`
  (ngữ vực) → *vua*.
  **Bối cảnh đã đọc trước khi dịch:** `26.1`–`26.4` nói các vị trời ngày xưa uống phải
  thứ độc lấy từ hộp trầu, và `27.3` nói rõ *thứ độc ấy trong bình là do ta bỏ vào*. Vì
  vậy `27.1` cố ý đặt cả hai vế cùng cấp để người đọc hiểu: nhìn thì là sữa hay mật
  ong, thật ra là độc. Tôi giữ cấu trúc "dù là … hay …" và **không** thêm chữ nào
  nói trước là độc — phần đó thuộc vế sau, không thuộc khoá này.
  **0 tiền lệ, đặt mới:** `nayaṁ` ở đầu khoá. Tôi quét **toàn bộ** 3.261 bài Việt đã
  dịch, tìm mọi khoá Pāli dài ≥ 40 ký tự có chứa `nayaṁ` và đã có bản dịch: **0 khoá**.
  Nên "Bây giờ" là lựa chọn mới, dùng như liên từ mở câu (nó không mang nghĩa thời gian
  nào thêm). Đây là chỗ làm câu hơi nặng — tôi hạ `vietnamese_clarity` xuống 9,1 vì thế,
  thay vì bỏ chữ.
  **Dấu ngoặc kép:** Pāli khoá này không có ngoặc, và tôi cũng không thêm.
