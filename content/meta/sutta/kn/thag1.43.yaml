notes: |-
  Đủ 13/13 khoá. Đã đọc hết Pāli lát trước khi viết.
  Đối chiếu Pāli + Anh Sujato (tệp có trong cây đã ghim; 8/9 khoá có prose, chỉ khoá chốt 1.9 Sujato để
  trống). Không có bản Việt hiện hành. Coverage English đo trên Pāli có nội dung của bài này là 0 phân số:
  không có khoá nào đạt ngưỡng 40 ký tự, nên không phát sinh khoảng trống coverage cần ghi nhận.
  Tiền lệ dùng lại: Theragāthā 1.43 → giữ nguyên (112 bài thag) · Ekakanipāta → Bộ Một Bài Kinh (107 bài
  thag) · Pañcamavagga → Phẩm Thứ Năm (18 bài) · Xtheragāthā → Kinh Kệ Của Trưởng Lão X như thag1.42 và
  thag1.44 · … X thero …. → … Trưởng lão X …. (99 bài thag giữ dấu lược; chỉ thag1.42 là ngoại lệ, mở rộng
  thành câu đầy đủ, tôi không theo ngoại lệ đó) · Jhāya → hãy thiền định (thag1.119:1.3) ·
  appamatto → không phóng dật trong thag, nhưng ở đây Appamatto vihara tôi dịch là hãy sống chuyên cần, theo
  an3.156 (218 tiền lệ chuyên cần) · naṅgala → cày (sn7.11, ja123) · sādhu sāhu → lành thay (mn56:7.2,
  mn127:13.2) · sumuttiko → đã thoát khỏi, theo Sujato well freed.
  Bất định đã ghi nhận, đây là điểm yếu thật của bài này:
  Một, asitā ở khoá 1.3. Tầng không có tiền lệ cho chữ này. Nếu đọc theo gốc thì asitā gần với lưỡi cày,
  nhưng Sujato dịch là sickles, và chỉ khi hiểu là lưỡi liềm thì ba món cong quặc mới thành một bộ nông cụ
  nhất quán với cày và cuốc. Tôi chọn lưỡi liềm và ghi lại; nếu biên tập có ý kiến khác thì sửa riêng khoá này,
  còn hai khoá kia không đổi theo.
  Hai, Sumuttiko sumuttiko ở 1.1 là danh từ tuyệt đối hóa; tôi dịch Thoát rồi, thoát rồi thật tốt, và để
  Sāhu sumuttikomhi ở 1.2 thành lành thay.
  Ba, Yadipi idhameva idhameva, Atha vāpi alameva alameva là cặp lặp; tôi dịch Dù chúng ở đây, ở đây, hay ở
  nơi khác, ở nơi khác, giữ đúng hai vế lặp của Pāli.
  Bốn, khujjaka là nghĩa chung ba nông cụ cong quặc, tôi dịch là món cong quặc.
  Năm, Appamatto vihara: thag1.59 dịch appamatto là không phóng dật; nếu biên tập muốn thống nhất với thag1.59
  thì đổi riêng khoá 1.8 này, không ảnh hưởng bài khác trong lát.
  Dấu lược: khoá 1.9 có hai dấu lược ở hai đầu và tôi giữ đủ hai, nên không lệch. Cả bài không có …pe….
  Kiểm kỹ thuật: save_vi chạy sạch. Vì mọi khoá Pāli bài này ngắn hơn 40 ký tự nên cần trong kiểm() rỗng và
  các assertion không tự chạy, tôi tự quét MỌI 13 khoá: đủ khoá, đúng ID, không rỗng, NFC, không trùng Pāli,
  dấu lược khớp từng khoá, nháy kép cân trên cả bài, không còn (…) đứng một mình, không có từ Pāli lọt vào.
  Đợt này cấm chạy npm run validate, test, check, build nên tôi KHÔNG tuyên bố technical gate pass; bốn lệnh
  đó để người điều phối chạy, và tôi hạ technical_integrity xuống 9.8.
