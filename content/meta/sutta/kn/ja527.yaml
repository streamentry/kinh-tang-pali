    + `16.1` `puññā ca dhaṁse` → "rơi khỏi phước báu" (`dhaṁsati` = rơi, sa sút); `16.4`, `19.4`, `25.4`, `28.4` `adaṭṭhā` → "mà không được thấy nàng" (gerund phủ định của `daṭṭhā`, cùng gốc `13.1`; "đã trao … mà không được thấy nàng" cũng có thể đọc là "trao đi rồi không còn thấy nàng"). `17.2` `nāññatra tayā mayā vā … jaññā` → "ngoài ngài hoặc tôi ra, không ai biết được việc đã làm". `17.3`, `26.3`, `39.3` `yaṁ te mayā ummadantī padinnā` → "việc Ummādantī đã được tôi trao cho ngài" (ở `17`, `26` có thể đọc là "vì"; dịch giống nhau cả ba chỗ). `17.4`, `26.4`, `39.4` `bhusehi rājā vanathaṁ sajāhi` → "tâu vua, xin hãy mặc sức buông thả lòng ham muốn" (không xác lập: `bhusehi` đọc là trạng từ "mặc sức"; `vanatha` nghĩa gốc là bụi rậm, dùng cho ham muốn, tầng dịch phân tán "bụi rậm", "luyến ái", "ruộng bỏ hoang"; `sajāhi` đọc từ `sajati` = thả ra, cf. `ja505:8.1` `udakaṁ sajāti` "rưới nước"; nếu `sajāhi` là "từ bỏ" thì nghĩa đảo thành khuyên vua bỏ ham muốn, không phân xử được).
    + `18.2` `māyida maññiṁsu aññe` → "mong người khác đừng nghĩ đến chuyện này" (cũng có thể là "đừng nghi"); `18.4` `yuttā` → "chuyên tâm" (cũng có thể là "quan chức", như `rājāyutta` ở `an4.70`). `19.1`–`19.2` `saddheyya` + `te`: đọc là "tin ngươi", và `na me piyā` là lời Abhipāraka được thuật lại nên dịch "người yêu quý của ngươi". `20.3` `bhadante` → "thưa ngài" (hô cách; cũng có thể là "bhadraṁ te" nhưng dạng ngắn). `21`: `na pīḷitā … pariccajanti` đọc là "dù bị bức bách, vẫn không từ bỏ" (phủ định bao cả hai vế); người nói không xác lập. `22.2` `bhattā` → "người chu cấp" (cũng là "chồng" như `2.4`; ở đây đứng cùng `patī`, `posako`, `devatā` nên đọc là người chu cấp). `23.2` `nuttasate` → "không run sợ" (`na uttasati`); `23.4` `pāpena` → "như kẻ ác" (cũng có thể là "vì điều ác"). `24.1` `aññātakaṁ` → "người ngoài thân quyến" (không rõ gắn với người nhận hay với món cho). `27.1`–`27.2` `dahāti` → "đem … so với" (nghĩa gốc "đặt"); vế sau đọc là "lạc … so với lạc của chính mình", không rõ `sukhena` là lạc của ai. `29.3` `piyena` → "bằng lòng yêu quý" (cũng có thể là "bằng người yêu quý").
    + `30.1` `so` → "vậy thì"; `30.2` `kāmahetukaṁ` → "vì dục vọng". `31.1` `satiṁ` → "người vợ hiền đức"; `31.3` `sibyā` (hapax) đọc là hô cách "tâu vua Sivi", cùng cách với `33.4` `sivi`; cách đọc khác "(cho mọi người) xứ Sivi" không loại trừ được. `32.2`, `38.1`, `40.1` `katte` → "quan hầu cận" và `42.2` `kattuputta` → "con của quan hầu cận" (hô cách chỉ chức vị; nghĩa không xác lập, có thể từ `khattar` = người hầu cận hoặc quan; không có tiền lệ nào khác trong tầng). `34.1`–`34.4` `ādiyati` → "nhận"; `pūjā` → "tôn kính"; `thalamhā` → "nền đất cao". `35.2`/`36.1` `dhammātisāra` → "sự vi phạm pháp" (`atisāra` = vượt quá); `35.3` `paccuttarissāmi` → "gánh chịu" (nghĩa gốc "vượt qua để đón"). `36.2` `nicchāmi` = `na icchāmi`. `37.3` `pasanno` → "với tâm hoan hỷ". `38.4` `passaṁ` (số ít, chủ ngữ không xác lập: người nói hoặc người bị chê trách) dịch giữ mơ hồ "khi thấy".
    + `41.1` `āhuneyyo` → "đáng được cúng dường"; `41.2` `kāmapālo` → "người gìn giữ ước nguyện" (`kāma` có thể là ước muốn hoặc dục); `41.4` `kāmena` → "vui lòng". `42.3`–`42.4` `añño nu te ko idha sotthikattā`: `te` đọc là "cho ngươi" (không loại trừ cách đọc khác về ai là người được mưu lợi); `aruṇe jīvaloke` → "cõi đời rạng đông" (hapax; `aruṇa` = rạng đông hoặc đỏ hồng, nghĩa của cụm không xác lập). `43.2` `dhammagutto` → "được pháp bảo hộ" (cũng có thể là "bảo hộ pháp"); `43.4` `dhammapāla` → "bậc hộ trì pháp". `44.3`–`44.4` `sataṁ āsevitaṁ ahaṁ` → "pháp được bậc thiện nhân thực hành, do chính ta thuyết" (`ahaṁ` đọc gắn với động từ `desayissāmi` ở khoá trước). `45.2` `paññāṇavā` → "có trí tuệ". `46.3`–`46.4` `saṅghare` → "quây quần" (nghĩa gốc "tụ lại"). `47.3` `ye vāpi ñatvāna sayaṁ karonti` đọc là điều không tán thành thứ hai ("những ai đã biết mà vẫn tự mình làm").
    + `48`–`51`: `taramānānaṁ` → "lội qua sông" theo `ja334` (nghĩa gốc "vượt", `an4.70` dịch "vượt sông"); `nette … gate sati` → "người dẫn đường đi …" (`ja334`). `52.2` `amarattaṁ` → "bất tử". `53.3` `dāso` → "nô bộc"; `53.4` `vatthiyaṁ haricandanaṁ` → "y phục, đàn hương vàng" (`hari` = vàng, nâu; cũng có thể là "đàn hương vàng" hoặc "đàn hương xanh"). `54.1` `assitthiyo` đọc là `assa` + `itthiyo` ("ngựa, phụ nữ"); `54.2` `abhipālayanti` → "gìn giữ cho ta"; `54.4` `usabhomhi jāto` → "là bò đực đầu đàn, sinh ra" (ẩn dụ chỉ bậc đứng đầu, nối với hình ảnh đàn bò ở `48`–`51`). `55.1` `netā hitā uggato` → "bậc dẫn đường, người mưu lợi ích, bậc cao vời" (`hitā` không xác lập dạng và nghĩa); `55.4` `na vatto` → "không bị chi phối".
    + `56.2` `niccaṁ abyasanaṁ sivaṁ` → "an lành, không gặp tai họa" (`sivaṁ` đọc là tính từ "an lành", không phải tên Sivi). `57.1` `anumodāma` số nhiều → "chúng tôi tùy hỷ" (người nói là một người; giữ số nhiều như Pāli). `58`–`67` dùng lại `ja521:40`–`49`; `62.2` có 4 khoá trùng trong tầng (`ja495:13.4`, `ja516:42.4`, `ja521:44.2`, `tha-ap486:6.2`).
