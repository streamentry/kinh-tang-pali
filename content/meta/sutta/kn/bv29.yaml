notes: |-
  Đợt 19, làn 55. Dịch từ Pāli root commit đã ghim, đủ 74/74 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phần kết của Buddhavaṃsa: kể việc chia xá lợi sau khi Đức Phật nhập Niết-bàn và nơi cất giữ các di vật. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Đoạn song song trong tầng Việt.** `dn16:6.24`–`6.28` (Kinh Đại Bát-niết-bàn, phần chia xá lợi) kể cùng việc: tám bên xin chia, Bà-la-môn Doṇa chia thành tám phần và nhận chiếc bình, người Moriya nhận than tro, rồi bài kệ về răng và tóc lông. Tôi dùng bản Việt của đoạn đó làm tiền lệ cho tên người, tên xứ và từ vựng chung.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dịch theo nghĩa chữ (buddha + vaṁsa), cùng cách `vaṁso` đã dịch “Dòng kế thừa” ở `bv27:25.1` (0 tiền lệ khác cho vaṁsa chỉ dòng các Đức Phật). Tên truyền thống quen dùng là “Phật Sử”; chọn dịch chữ để khớp chuỗi `bv3`–`bv27`. Tương tự `cp:0.1` Cariyāpiṭaka → “Hạnh Tạng” (25/26 bài cp).
  - `0.2` “29. Bài Nói Về Việc Chia Xá Lợi”: `-kathā` → “Bài Nói Về …” theo `ps3.7:0.3`; dhātubhājanīya = việc chia (bhājanīya) xá lợi (dhātu), theo nghĩa `dn16:6.24.0` “Sự chia xá lợi”.

  **Trùng nguyên văn.** Trong chính bài có 1 cặp Pāli trùng (`1.3` và `18.1`, `Dhātuvitthārikaṁ āsi,`); bản Việt hai khoá giống hệt nhau ⇒ 0 cặp lệch. Quét toàn tầng Việt (so Pāli sau khi bỏ dấu câu và chữ hoa, khoá nội dung ngoài bài này): 3 khoá trùng, đều với `dn16:6.28.17`–`6.28.19`: `12.1` `Cattālīsasamā dantā` (dn16 viết tách `Cattālīsa samā dantā`), `12.2` `kesā lomā ca sabbaso;`, `12.3` `Devā hariṁsu ekekaṁ,` ⇒ dùng lại nguyên văn “Bốn mươi chiếc răng đều nhau,”, “cùng tóc và lông trên thân, tất cả”, “chư thiên mang đi từng chiếc,” (3/3 khớp, chỉ khác dấu cuối `;`/`,` theo Pāli từng khoá: dn16 viết dấu phẩy chỗ Pāli có chấm phẩy). `12.4` `cakkavāḷaparamparā` ≈ `dn16:6.28.20` `…paramparāti` (chỉ khác colophon `ti`) ⇒ giữ “trải khắp các cõi thế giới.”. Số cặp trùng đã dò: 3 (+1 gần trùng); 0 cặp bản Việt khác về nghĩa.

  **Số Pāli, đã tự tính.** `aṭṭha` 8 “Tám tháp xá lợi” (5.1) và có đúng 8 khoá `eko` ở `2.1`–`3.4` (Ajātasattu, Vesālī, Kapilavatthu, Allakappa, Rāmagāma, Veṭṭhadīpa, Pāvā, Kusinārā) = 8 phần/bên; `navamo` thứ chín, `dasamo` thứ mười (5.2, 5.3) = tháp chiếc bình và tháp than tro, khớp `dn16:6.27.11`. `uṇhīsa` 1 + `catasso dāṭhā` 4 + `dve akkhakā` 2 = 7 = `satta` (6.3), và ở `10.1`–`10.3` xương đòn trái/phải ở hai nơi khớp “hai”. `dāṭhā` ở `11.1`–`11.4` là 4 khoá `ekā` = bốn răng nanh, khớp `catasso`. `soḷasa` 16 (8.4); `pañca` 5, `pañca` 5, `cha` 6 (9.1–9.3), cộng 16 nāḷi; `cattālīsa` 40 (12.1; tiền lệ `dn16:6.28.17`). Lưu ý: 16 doṇa (8.4) và 16 nāḷi (tổng 9.1–9.3) là hai đơn vị khác nhau trong Pāli; tôi giữ nguyên từng đơn vị, không quy đổi. Không có số lớn (`sahassa`, `sata`, `navuti`).

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá).
  - `dhātu` → “xá lợi”: tầng có 47 khoá “xá-lợi” và 28 khoá “xá lợi”; phạm vi gần nhất, `dn16`, dùng “xá lợi” không gạch nối, nên giữ “xá lợi”.
  - `thūpa` → “tháp” (86 khoá). `cetiya` (5.2 `kumbhacetiyo`) → “tháp chiếc bình”, cùng với `thūpa` ở `dn16:6.27.9`/`6.27.11`; tầng chỉ có 11 khoá “cetiya” phần lớn là tên riêng, không có tiền lệ cho nghĩa này.
  - `kumbha` (4.1, 5.2) → “chiếc bình”, cùng vật `tumba` ở `dn16:6.25.14`. `aṅgāra` → “than tro” (`dn16:6.26.6`).
  - `jina` → “Chiến Thắng” (75 khoá; “Bậc Chiến Thắng” 40). `mahesi` → “Đại Ẩn Sĩ” (75/114; “Đại tiên” 8 trong đó 4 là “Đại tiên nhân”). `muni` → “Mâu-ni” (54/122; “bậc Hiền” 14). `anukampā` → “lòng thương” (16/31 khoá; “thương xót” 5). `pāṇī` → “chúng sinh” (20/218; “loài hữu tình” 6). `nibbuta` → “nhập Niết-bàn” (152 khoá đủ nghĩa; `dn16` dùng “diệt độ” cho `parinibbuta`, không phải cùng dạng).
  - `dāṭhā` → “răng nanh” (`cp20:1.3`, `dn30:2.28.0`; `dn16:6.28.5` viết “chiếc răng”). `danta` → “răng”.
  - `nāga` → “Nāga” (757/1.300 khoá; “rồng” 74). `tidasa` → “chư thiên Tam Thập”: tầng có “Tam Thập” 19, “Tam Thập Tam” 16, “Ba Mươi Ba” 10 khoá; chọn “Tam Thập” vì Pāli chỉ viết `tidasa` (ba mươi), không viết ba mươi ba, và `mil5.1.4:7.1` dịch `tidasabhavana` “cõi trời Tam Thập”.
  - `nivāsana` → “y vòng dưới”: 1 tiền lệ trực tiếp (`an3.39:1.4`); `kāsāva` → “cà-sa” (13/34); `veṭhana` → “khăn quấn đầu” (`dn4:26.8`); `nisīdana` → “tọa cụ” (13/19); `paccattharaṇa` → “tấm đệm” (`sn55.42:7.2` “đệm nằm”), `attharaṇa` → “tấm trải”; `kāyabandhana` → “dây lưng” (2/2); `vāsi` → “rìu đẽo” (`tha-ap242:1.3`); `uṇṇa-loma` → “sợi lông trắng” (tầng dịch `uṇṇā` là sợi lông trắng ở 5/32 khoá, “lông” 6). `patto` → “bình bát” (6) so với “bát” đứng riêng (khoảng 32): ở đây đi cùng `daṇḍa`, `cīvara` nên giữ “bình bát”. `mugga` → “đậu xanh” (22 khoá), `sāsapa` → “hạt cải” (30), `nāḷi` giữ “nāḷi” (`dn17:2.15.10`), `doṇa` đo lường giữ “doṇa”.
  - Địa danh theo tầng: Kusinārā (86 khoá), Vesālī (191), Kapilavatthu (91), Pāvā (54), Gandhāra (26), Kaliṅga (8), Campā (37), Pāṭaliputta (26), Avantī (8), Mithilā (20), Videha (30), Indapatta (1, `cp3:1.2`), Allakappa/Rāmagāma/Moriya (`dn16:6.24`–`6.27`). Pāli bài này viết `Veṭhadīpa`, còn `dn16` viết `Veṭṭhadīpa`; chọn dạng của tầng cho cùng một nơi.
  - 0 tiền lệ (giữ Pāli, dấu giữ theo nguyên văn): `Sīhaḷa` (10.1, 10.3), `Vajirā` (13.1), `Aparantaka` (17.2; tầng có `Aparanta` ở `mil6.3.3:6.2`), và đơn vị `doṇa`/`nāḷi` như trên.

  **Dấu câu.** Pāli bài không có nháy kép, nháy đơn, ngoặc hay dấu lược `…` ⇒ Việt cũng 0 ở cả 74 khoá; phép đo dấu lược và nháy chạy rỗng (không có gì để so), không tuyên bố “0 lỗi” cho chúng. Dấu cuối khoá khớp Pāli từng khoá trừ hai tiêu đề `0.1`, `0.2` (không có dấu câu). Cặp Pāli↔Việt đã in ra đọc từng khoá.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh.**
  1. `eko`/`ekā` (2.1–3.4, 11.1–11.4): Pāli không nêu danh từ. Ở `2.1`–`3.4` tôi bổ “phần” (8 bên chia, khớp `dn16:6.24`); danh từ có thể là `bhāga` (phần) hoặc `thūpa` (tháp), vì `5.1` nói tám tháp. Ở `11.1`–`11.4` bổ “răng nanh” từ `dāṭhā` ở `11.1` và `6.1`.
  2. `uṇhīsa` (6.1, 10.1) → “nhục kế”: 0 tiền lệ cho nghĩa di vật (tầng dịch `uṇhīsasīsa` là “đầu như đội khăn”, 11 khoá có “khăn”). Chọn thuật ngữ Hán–Việt quen thuộc cho uṇhīsa; cũng có thể hiểu là phần xương đỉnh đầu. Nếu hiểu là khăn đội đầu thì khác với `veṭhana` ở 15.2.
  3. `akkhakā dve ca dhātuyo` (6.2): “hai xương đòn, cũng là xá lợi”; nghĩa `akkhaka` là xương đòn suy từ `10.3` `dakkhiṇakkha` và số bảy ở `6.3`; `10.2` `vāmakaṁ` đọc là xương đòn bên trái, tôi viết “cái bên trái” để không thêm danh từ Pāli không nêu.
  4. `bhinnataṇḍulā` (7.2) “hạt gạo vỡ”; `makulavaṇṇā` (8.3) “màu nụ hoa” (makula = nụ; chưa phân xử được loài hoa); `suvaṇṇavaṇṇā` “vàng kim”, `muttavaṇṇā` “ngọc trai”. `soḷasadoṇamattikā` (8.4) “có số đo mười sáu doṇa”: không xác định `mattikā` là đo cả tổng hay từng loại.
  5. `1.3`/`18.1` `dhātuvitthārika`: hợp từ ít gặp; đọc là việc xá lợi được rải rộng khắp, `āsi` là “đã có”. `1.4` `tesu tesu padesato`: “ở những vùng này vùng nọ”.
  6. `kulaghare` (13.3): đọc là “ở nhà một gia đình”; cũng có thể là tên nơi. `karaṇaṁ` (14.2): đọc là “dụng cụ”, nghĩa chung, không xác định được vật cụ thể; có thể bị hiểu sai. `uṇṇalomaṁ` (14.4): “sợi lông trắng” theo tầng; `uṇṇā` cũng có nghĩa len, nên cách đọc khác là sợi len ở Kosala.
  7. `raṭṭhe attharaṇaṁ tadā` (15.4): `raṭṭhe` không có tên; tôi đọc là cùng xứ với `avantīsu` ở 15.3 (“ở xứ ấy”), nên cả tọa cụ lẫn tấm trải ở Avantī; cách đọc khác là xứ khác không nêu tên. `tadā` ở 15.4, 16.4, 17.4, 18.4 là chữ đệm của vần, dịch “vào lúc ấy” cho khớp chữ.
  8. `akaṁsu manujā tadā` (17.4): Pāli không nêu tân ngữ của `akaṁsu`; tôi viết “mọi người đã làm vào lúc ấy” và không bổ sung (đoán là dựng tháp hay cúng dường sẽ là thêm nghĩa). Đây là chỗ chưa chắc nhất của bài.
  9. `4.1`–`4.4`: `kāresi`/`kāresuṁ` (sai khiến làm) dịch bằng câu bị động có tác nhân (“được dựng lên bởi …”) để giữ thứ tự câu; nghĩa không đổi. `5.4` `patiṭṭhito` “được an lập”, `10.4` `patiṭṭhitā` “được an trí”.
  10. `3.4` `kosinārake`: Pāli không có `malle` ở đây; “người Kusinārā” (dn16 viết người Malla ở Kusinārā).
  11. `mahāgotama` (1.1) “Đại Gotama”: `mahā-` đọc là tôn xưng, tầng có 0 khoá “Đại Gotama”.

  **Coverage English (mục 7):** mẫu số = 0. Dài nhất sau khi nén khoảng trắng là 27 ký tự (< 40) nên 0/72 khoá có nội dung (bỏ 2 khoá `:0.`); đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `bv29` (`english-sujato` chỉ có chín tiểu bộ cp dhp iti ja kp snp thag thig ud); `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Không đụng `content/meta/reference-gaps.yaml`.

  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`. `final_score` là trung bình số học thô của đúng 10 tiêu chí, tính bằng script.
