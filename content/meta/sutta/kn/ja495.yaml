notes: |-
  Đợt 19, làn 107. Dịch từ Pāli root commit đã ghim, đủ 211/211 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; người nói của từng khổ không được ghi vào thân kinh mà chỉ suy ra từ nội dung kệ (xem bất định 1). Bài gồm 211 khoá: 4 khoá tiêu đề, 206 khoá kệ, 1 khoá kết. Một bản dịch Anh công khai bên ngoài tầng đã ghim chỉ được đọc phụ để kiểm cấu trúc mười hạng bà-la-môn và hai chỗ khó (xem bất định 3, 5); nó không phải tầng đã ghim và không được tính vào `triangulation`.

  **Tiêu đề.**
  - `0.2` “Bộ Tạp Tập” và `0.3` “Phẩm Ruộng Lúa”: dùng lại nguyên văn (12 bài cùng bộ, cùng phẩm: `ja484`, `ja485`, `ja486`…), là khoá Pāli trùng nguyên văn.
  - `0.4` “12. Kinh Mười Hạng Bà-la-môn”: `Dasabrāhmaṇa` = “mười bà-la-môn”; bản Việt thêm “hạng” vì chính bài nói rõ là mười loại (`4.1`–`4.2` `Dasa khalu mahārāja … yā tā brāhmaṇajātiyo` = “quả có mười hạng bà-la-môn ấy”), theo khuôn “N. Kinh <tên>” của `ja494:0.4`, `ja496:0.4` (hai bài cùng phẩm đã dịch tên theo nghĩa). Số `12.` ở `0.4` và `dvādasamaṁ` ở `49.1` đều là 12 ⇒ “thứ mười hai” khớp (tiếp nối `ja494` là thứ mười một). `49.1` “Kinh Mười Hạng Bà-la-môn, thứ mười hai.” theo khuôn `ja494:21.1`.

  **Tiền lệ dùng lại nguyên văn: đã dò 211 khoá với Pāli toàn tầng kn (so sau khi bỏ dấu câu và hạ chữ hoa, từ 12 ký tự trở lên): 33 khoá có Pāli trùng ở bài khác đã có bản Việt; sau khi dùng lại, bản Việt của tôi giống tiền lệ ở 18/33 khoá, khác ở 15 khoá.** Dùng lại nguyên chữ (18): `0.2`, `0.3`; `13.4` “trong các làng và thị trấn” (= `ja516:42.4`, `tha-ap486:6.2`); `17.1` “Lông nách, móng và lông thân mọc dài” (= `tha-ap414:23.1`; ở `ja496:9.3` cùng Pāli viết “lông trên thân”, lệch một chữ ở bài kia, không sửa vì ngoài làn); `17.2` “răng cáu bẩn, đầu dính bụi bặm” (= `ja469:5.2`); `21.1` “Trái chiêu liêu, trái me rừng” (= `tha-ap440:1.1`); `42.4` “khi lễ tế Soma đã đến” (= `ja459:5.2`); và 11 khoá `Yattha dinnaṁ mahapphalaṁ”.` (`2.4`, `8.4`, `12.4`, `16.4`, `20.4`, `25.4`, `29.4`, `33.4`, `37.4`, `41.4`, `45.4`) “nơi vật bố thí có quả lớn”: đo trên tầng 8 khoá cùng Pāli đã có bản Việt, “nơi vật bố thí có quả lớn” 4 (`iti26:4.4`, `vv34:19.4`, `vv34:20.4`, `vv34:21.4`), “nơi vật cho ấy có quả lớn” 2 (`vv56:5.4`, `vv57:5.4`), “nơi mà bố thí có quả lớn” 1 (`snp1.10:16.4`), “nơi nào bố thí có quả lớn” 1 (`ja496:19.4`, bài cùng phẩm, bản nháp); chọn dạng đa số. Khác có chủ ý, đã đọc (15): `1.2` `Dhammakāmo yudhiṭṭhilo` — `ja413:1.2` dịch “bậc vua ham chánh pháp, dũng mãnh trong trận”, coi `yudhiṭṭhila` là tính từ; ở đây câu đứng sau `Rājā avoca vidhuraṁ` và cùng Pāli `Yudhiṭṭhila` là tên (dòng/ gotta) vua Koravya ở `ja515:8.4` (“Yudhiṭṭhila đã nói như vậy”, 4 khoá) nên giữ là tên riêng; `1.4`, `7.5`, `11.5`, `15.5`, `19.5`, `24.5`, `28.5`, `32.5`, `36.5`, `40.5`, `44.5` (`Sīlavante bahussute`, 11 khoá) — tiền lệ duy nhất `ja468:10.2` “kẻ có giới hạnh, đa văn” (câu cũ đọc như số ít, không khớp ngữ cảnh), còn `sīlavant…` + `bahussut…` ở `ja453:9.3` “đa văn, giữ giới” và `vv73:5.4` “đa văn, giữ giới”: chọn “giữ giới, đa văn” (đo 4 khoá chứa `sīlavant…` cùng `bahussut…`: “giữ giới” 2, “có giới hạnh” 1, 1 khoá văn xuôi `mil7.2.10` khác cấu trúc); `34.1`–`34.2` `Asicammaṁ gahetvāna / khaggaṁ paggayha brāhmaṇā` — `ja469:10.1`–`10.2` dịch “Bắt một người không bị trói buộc, các bà-la-môn cầm gươm”: nghĩa lệch hẳn so với Pāli (`asicamma` = gươm và khiên), không dùng; `38.1` `Araññe kuṭikaṁ katvā` — `tha-ap46:1.1` “Trong rừng, tôi dựng một túp lều” là ngôi thứ nhất, ở đây chủ ngữ ngôi thứ ba nên đổi.

  **Trùng nguyên văn trong chính bài:** 211 khoá, 15 nhóm Pāli trùng (so sau khi bỏ dấu câu và hạ chữ hoa), gồm 134 khoá: khổ lặp mười lần `Apetā te ca brahmaññā / (iti rājā korabyo) / Na te vuccanti brāhmaṇā / Aññe vidhura pariyesa` (`7`, `11`, `15`, `19`, `24`, `28`, `32`, `36`, `40`, `44`; 4 nhóm × 10 khoá) cùng `Sīlavante bahussute` (11 khoá, thêm `1.4`); khổ lặp `Virate methunā dhammā / Ye me bhuñjeyyu bhojanaṁ / Dakkhiṇaṁ samma dassāma / Yattha dinnaṁ mahapphalaṁ”` (`2`, `8`, `12`, `16`, `20`, `25`, `29`, `33`, `37`, `41`, `45`; 4 nhóm × 11 khoá); ba nhóm lặp cuối mỗi hạng `tepi vuccanti brāhmaṇā` (10 khoá), `Akkhātā te mahārāja` (11 khoá), `tādise nipatāmase”` (11 khoá, kể cả `47.3`–`47.4`); `3.2` = `46.2` = `48.2` (`sīlavanto bahussutā`); `3.3` = `46.3` (`Viratā methunā dhammā`); `3.4` = `46.4` (`ye te bhuñjeyyu bhojanaṁ`). Bản Việt của cả 15 nhóm giống hệt nhau về chữ, 0 cặp Pāli trùng mà bản Việt khác. Bản nháp đầu viết `3.2` “những vị giữ giới, đa văn” và `48.2` kết bằng `;` làm 3 khoá `sīlavanto bahussutā` (`3.2`, `46.2`, `48.2`) lệch nhau; phép so bắt được và đã sửa cho khớp.

  **Số Pāli:** `Dasa` (`4.1`) = 10 ⇒ “mười”: đúng 10 hạng được liệt kê (thầy thuốc `6`, người hầu hạ `10`, kẻ áp bức `14`, kẻ đốn gốc cây `18`, thương nhân `23`, hạng Ambaṭṭha–Vessa `27`, kẻ giết bò `31`, bọn chăn bò–cướp rừng `35`, thợ săn `39`, kẻ kỳ cọ ghét bẩn `43`), 10/10 khớp. `ekañca bhattaṁ` (`47.1`) = “một bữa”. `12.` ở `0.4` và `dvādasamaṁ` ở `49.1` đều bằng 12. Không có số lớn, không có cụm số chưa phân xử.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `deva` (`3.1`, `46.1`) và `mahārāja` (`4.1`, `6.3`…) → “tâu đại vương”: đo 71 khoá chứa `mahārāja` (không tính `rāja` riêng) trong các bài ja đã dịch: “tâu đại vương” 28, “đại vương” không có “tâu” 14, “hỡi vua” 2, không có từ hô 27; 60 khoá chứa `deva` làm hô cách: “tâu đại vương” 19, “đại vương” 3, “bệ hạ” 1, “tâu vua” 1, không có từ hô 36. `rāja` đứng riêng (`6.1`, `10.1`…) → “tâu vua”: đo 87 khoá chứa `rāja` mà không có `mahārāja`: “tâu đại vương” 30, “hỡi vua” 18, “nhà vua” 6, “tâu vua” 4, “đại vương” không có “tâu” 2, “đức vua” 1, không có từ hô 26. Đa số tiền lệ cho `rāja` riêng là “tâu đại vương”, nhưng bản này chọn “tâu vua” để giữ được khác biệt giữa `rāja` và `mahārāja` (hai từ hô đứng sát nhau ở mỗi hạng: `6.1` `rāja` / `6.3` `mahārāja`), và vì người nói là đại thần Vidhura đối với vua của mình (“hỡi vua” kém lễ độ cho vị trí này). Lệch có chủ ý so với đa số, ghi để người điều phối quyết một lần nếu muốn đồng nhất theo “tâu đại vương”.
  - `janādhipa` (`22.4`) → “tâu chúa tể muôn dân”: đo 8 khoá trong các bài ja đã dịch, “chúa tể” 3 (gồm “chúa tể muôn dân” `ja511:16.4`), “bậc làm chủ” 2.
  - `sīlavant` + `bahussuta` → “giữ giới, đa văn”: xem trên. `viratā methunā dhammā` (`2.1`, `3.3`, `8.1`…) → “xa lìa dâm dục”: theo `snp3.11:26.1` (“Xa lìa dâm dục”); tầng có 17 khoá chứa `methun…`, cùng cách ở `snp1.12:12.1`, `snp2.14:26.3`.
  - `bhuñjeyyu bhojanaṁ` → “thọ dụng bữa ăn”; `dakkhiṇaṁ … dassāma` → “dâng cúng dường”: đo 26 khoá chứa `dakkhiṇ…`, “cúng dường” 6, “dâng” 3, “vật cúng” 1, “bố thí” 1; `samma` → “này bạn”: 49 khoá chứa `samma`, “này bạn” 18, “bạn” 23. `brahmañña` (`7.1`…) → “hạnh bà-la-môn”: theo `ud4.8:6.4` (“hạnh Bà-la-môn”, 12 khoá chứa `brahmañña…`).
  - `tikicchaka` (`6.1`) → “thầy thuốc”: 16 khoá chứa `tikicchak…`, “thầy thuốc” trong `ja510:20.2`, `mil6.3.6:4.5`, `mil7.1:98.1`; một số khoá `mil` dịch “bác sĩ”.
  - `niggāhaka` (`14.1`) → “kẻ áp bức”: theo `snp1.7:6.3` (“kẻ áp bức”, 1 tiền lệ, 1 khoá). `khāṇughāta` (`18.1`) → “kẻ đốn gốc cây”: 0 tiền lệ (`khāṇu` 8 khoá, đều nghĩa “gốc cây”); `ghāta` = đập, chặt; xem bất định 6.
  - `purohita` (`30.2`) → “tế sư”: đo 11 khoá chứa `purohit…`, “tế sư” 2 (`cp26:12.2`, `ja432:11.2`), “đại thần” 1 (`cp5:1.2`), “tư tế” 1 (`mil5.1.4:5.3`), “tế tựu” 1 (`mil5.4.7:2.4`, nghi lỗi gõ ở tiền lệ), còn lại là khoá chưa dịch hoặc văn xuôi khác nghĩa; chọn “tế sư” (khớp vai trò lo lễ tế, hai tiền lệ trong kệ).
  - `luddaka` (`39.1`) → “thợ săn”: đo 34 khoá chứa `luddak…`, “thợ săn” (`ja359:3.2`, `ja501:9.1`, `ja491:15.4`…) đa số; vài khoá dịch “tham lam” (nghĩa khác của từ).
  - `kamaṇḍalu` (`13.1`) → “bình nước”: 10 khoá, cùng cách với `snp3.4:1.7`, `ja496:17.2`. `vaṅkadaṇḍa` (`13.2`) → “cây gậy cong”: 0 tiền lệ (`vaṅka` = cong, `daṇḍa` = gậy). `Paccupessanti` (`13.3`) → “đến trước”: 0 tiền lệ; xem bất định 4.
  - Cây quả `21.1`–`22.2`: `harītaka`/`āmalaka` → “trái chiêu liêu, trái me rừng” theo `tha-ap284:2.1`, `tha-ap414:14.1`, `tha-ap440:1.1` (3/3); `amba`/`jambu`/`vibhītaka` → “xoài, mận, trái bàng hôi” theo `tha-ap284:2.2`, `tha-ap414:14.2`, `tha-ap440:1.2` (3/3); `labuja` → giữ “labuja” (đo 12 khoá chứa `labuj…`, `tha-ap` 6 nơi giữ phiên âm, `ja511:14.1` dịch “mít”: không chắc `labuja` = mít nên giữ phiên âm); `beluva` → “quả bael” (`ja322:2.1`, `ja516:41.4`; `tha-ap` giữ “beluva”, 2–2); `badara` → “táo ta” (`ja496:12.2`, `tha-ap398:3.2`, 2/2); `rājāyatana` (`22.1`) → giữ “rājāyatana”: 1 khoá trong tầng là tên chỗ ở (`tha-ap118:1.1`), không có tiền lệ cho tên quả. `dantapoṇa` (`21.3`) → “tăm xỉa răng”: 0 khoá trong tầng; nghĩa đã biết là que xỉa răng. `ucchupuṭa` (`22.1`) → “gói mía”: 0 tiền lệ. `dhūmanetta` (`22.2`) → “ống xông khói”: 0 tiền lệ; không thêm “thuốc” vì Pāli không nói. `madhuañjana` → “thuốc tra mắt mật ong”: `añjana` = thuốc tra mắt (ví dụ trong tầng), 0 tiền lệ cho cả từ ghép. `uccāvaca` (`22.3`) → “cao thấp khác nhau”: đo 15 khoá chứa `uccāvac…`, “cao thấp” 4, “đủ loại” 3, “đa dạng” 1.
  - `kasivāṇijja` (`26.1`) → “cày cấy và buôn bán”; `pavecchanti` (`26.3`) → “gả đi”, `vivāhantāvahanti` (`26.4`) → “gả đi và rước dâu về”: 0 tiền lệ (`vivāha`/`āvāha`); nghĩa “gả con gái đi” và “rước dâu về”. `Ambaṭṭha` → giữ “Ambaṭṭha” (`ja415:11.1`, `tha-ap70:8.2` giữ phiên âm, 2/2); `vessa` → giữ “Vessa”, 0 tiền lệ trong tầng.
  - `nikkhittabhikkhā` (`30.1`) → “thức ăn khất thực đã được đặt sẵn”: 0 tiền lệ; `aṇḍaccheda` (`30.4`) → “kẻ thiến hoạn”, `nilañchaka` → “kẻ đóng dấu”: 0 khoá trong tầng cho cả hai. `mahiṁsa` (`31.2`) → “trâu” (không thêm “nước”); `sūkara` → “heo”: đo 41 khoá chứa `sūkar…`, “heo” là dạng trong tầng. `goghātaka` (`31.3`) → “kẻ giết bò”: 1 khoá (`ja530:60.3`, chưa có bản Việt).
  - `asicamma` (`34.1`) → “gươm và khiên”; `khagga` (`34.2`) → “thanh kiếm”; `vessapatha` (`34.3`) → “nẻo đường buôn”: 0 tiền lệ. `satthaṁ abbāhayanti` (`34.4`) → “dẫn đoàn buôn đi”: 0 tiền lệ; xem bất định 5. `gopanisāda` (`35.1`) → “bọn chăn bò và bọn cướp rừng”: 0 tiền lệ; xem bất định 5.
  - `kūṭa` (`38.2`) → “bẫy”; `sasabiḷāra` → “thỏ và mèo”; `godhā` → “kỳ đà”; `macchakacchapa` → “cá và rùa”: theo `tha-ap401:3.1`, `tha-ap414:2.3`, `tha-ap553:3.1` (“cá và rùa”, 3/3, tổng 6 khoá chứa `macchakacch…`, 3 khoá `tha-ap` cùng cách, còn lại là văn xuôi `mil` và khoá chưa dịch).
  - `heṭṭhāmañce pasakkitā` (`42.2`) → “đã chui nấp dưới giường”: 5 khoá chứa `pasakk…`, nghĩa khác nhau (`thag1.119` “lao vào”, `thag5.9` “lấn lướt”); chọn theo nghĩa “lẻn vào/ nấp” phù hợp văn cảnh, xem bất định 7. `malamajjaka` (`43.1`) → “kẻ kỳ cọ ghét bẩn”: 0 tiền lệ (`malamajjhime` ở `ja511:3.2` là từ khác).
  - `Koravya` (`7.2`…, `korabyo`) → “Koravya”: theo `ja515` (4 khoá `korabyassa` đều “Koravya”); `Vidhura` giữ phiên âm; `Yudhiṭṭhila` giữ phiên âm.
  - `ekañca bhattaṁ` (`47.1`) → “chỉ ăn một bữa”: tầng dịch `ekabhatta` ở `ud5.6:5.2` “chỉ ăn một bữa”; `majja` → “rượu”: đo 12 khoá chứa `majj…`, “rượu” 7.
  - `nimantayā` (`48.4`) → “mời”: 11 khoá chứa `nimantay…`, “mời”/“thỉnh mời”.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: 211/211 khoá khớp số lượng cả `“`, `”`, `‘`, `’`, `"`, `(`, `)` và `…` (0 lệch). Pāli có 23 khoá mở nháy `“` và 23 khoá đóng `”`; bản Việt cũng 23 · 23, ở đúng khoá (mở ở `1.3`, `3.1`, `7.1`, `9.1`, `11.1`, `13.1`, `15.1`, `17.1`, `19.1`, `21.1`, `24.1`, `26.1`, `28.1`, `30.1`, `32.1`, `34.1`, `36.1`, `38.1`, `40.1`, `42.1`, `44.1`, `46.1`, `48.1`; đóng ở `2.4`, `6.4`, `8.4`, `10.4`, `12.4`, `14.4`, `16.4`, `18.4`, `20.4`, `23.4`, `25.4`, `27.4`, `29.4`, `31.6`, `33.4`, `35.4`, `37.4`, `39.4`, `41.4`, `43.4`, `45.4`, `47.4`, `48.4`); nháy đơn: Pāli 0, Việt 0. Dấu ngoặc `(iti rājā korabyo)` (`7.2` và 9 khoá cùng loại): Pāli có 10 khoá chứa `(`/`)`, Việt cũng 10, giữ nguyên ngoặc. Dấu lược `…` và `(…)` trần: Pāli 0, Việt 0 (phép so “…pe…” chạy rỗng vì Pāli không có lược). NFC: 211/211 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa; chữ số chỉ có ở `0.4` (“12.”).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ nội dung kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). `1`–`2` vua Yudhiṭṭhila Koravya (Pāli ghi rõ `Rājā avoca vidhuraṁ`); `3`–`6`, `9`–`10`, `13`–`14`, `17`–`18`, `21`–`23`, `26`–`27`, `30`–`31`, `34`–`35`, `38`–`39`, `42`–`43`, `46`–`47` Vidhura (khổ `4` Vidhura nói với `mahārāja`); `7`–`8`, `11`–`12`, …, `44`–`45` vua (Pāli ghi `iti rājā korabyo`); `48` vua. Bản Việt chỉ đặt nháy theo đúng Pāli, không thêm lời dẫn.
  2. `Apetā te ca brahmaññā` (`7.1`…): `brahmaññā` là xuất xứ cách của `brahmañña` (hạnh bà-la-môn): “đã lìa xa hạnh bà-la-môn” (`apeta` + xuất xứ cách). Cách đọc khác: “họ đã bị gạt ra khỏi hàng bà-la-môn”, cùng hướng nghĩa.
  3. `Bahū te paripucchanti, aṇḍacchedā nilañchakā` (`30.3`–`30.4`): có hai cách đọc cú pháp. (a) `te` = tân ngữ “họ” (các tế sư), `bahū` = “nhiều người” là chủ ngữ ⇒ “nhiều người hỏi han họ”, rồi `aṇḍacchedā nilañchakā` là đồng vị của `bahū` (những người hỏi là kẻ thiến thú, kẻ đóng dấu thú) hoặc của `te`; (b) `te` = chủ ngữ “họ”, `bahū` = tân ngữ ⇒ “họ hỏi han nhiều người”. Bản Việt viết “họ được nhiều người hỏi han, là những kẻ thiến hoạn, những kẻ đóng dấu”, theo cách đọc (a) với `aṇḍacchedā nilañchakā` đọc mô tả `te` (người đọc có thể hiểu cả hai); bản Anh công khai ngoài tầng đã ghim cho biết ý chung là các tế sư làng bói toán, “thiến và đóng dấu thú”. Không thêm “thú” vào thân kinh vì Pāli chỉ có `aṇḍa` + `ccheda`, `nilañcha`.
  4. `Paccupessanti rājāno` (`13.3`): từ ghép `paṭi` + `upa` + `pessati`/`passati`: hiểu là “đến trước (các vua)”, “chầu”; có thể là “đưa mình ra trước các vua”. Chọn “đến trước các vua” — không thêm chữ “chầu”. `Nādinne vuṭṭhahissāma` (`13.5`): lời tự nói của chính các bà-la-môn (ngôi thứ nhất số nhiều) nằm giữa kệ không có nháy trong Pāli, bản Việt giữ nguyên ngôi “chúng tôi” và không thêm nháy.
  5. `Satthaṁ abbāhayantipi` (`34.4`) và `Samā gopanisādehi` (`35.1`): `abbāhayanti` (sai khiến của `abbāhati` “kéo ra, rút ra”) có thể là “dẫn đoàn buôn đi (qua đường hiểm)” hoặc “lôi/cướp đoàn buôn”; bản Anh công khai ngoài tầng đã ghim và hạng so sánh `gopanisāda` (đọc là `gopa` “người chăn bò, người canh giữ” + `nisāda` “người sống ngoài rừng, thợ săn/cướp”) cho thấy ý “dẫn/ hộ tống” nên chọn “dẫn đoàn buôn đi”. Nếu `gopanisāda` thật ra là từ ghép số ít khác (`gopānasi-` “xà nhà” → “kẻ ẩn nấp trên xà”), thì cả “bọn chăn bò và bọn cướp rừng” và “dẫn đoàn buôn” cần sửa; không có chứng cứ trong tầng để phân xử (0 khoá chứa `gopanisād…`). Đề xuất người điều phối giữ bản Việt này và xem xét lại nếu có chú giải.
  6. `Khāṇughātasamā` (`18.1`): `khāṇu` = gốc cây, cọc; `ghāta` = đập, chặt, giết. Bản Việt “kẻ đốn gốc cây” (đồng nghĩa “thợ chặt củi”); bản Anh công khai ngoài tầng đã ghim cho “wood-hewers/stump-fellers”. Khả năng khác: “kẻ đóng cọc/ đập cọc”. Cùng hướng nghĩa (người làm công việc lao động chân tay) nhưng không chắc.
  7. `Heṭṭhāmañce pasakkitā` (`42.2`): `pasakkita` là quá khứ phân từ của `pasakkati` (“nhích tới, lẻn tới”); “chui nấp” là cách đọc theo văn cảnh (các bà-la-môn lẻn dưới giường trong lúc vua tắm trên giường lễ). Có thể là “đã bò vào”, “đã nhích tới sát”. `Malamajjaka` (`43.1`): `mala` (cáu ghét) + `majjaka` (người kỳ/ chà rửa); “kẻ kỳ cọ ghét bẩn” (người tắm/kỳ cọ thuê); không thêm nghĩa “thợ cạo” hay “người tắm cho vua”.
  8. `Nikkhittabhikkhaṁ` (`30.1`): `nikkhitta` = đặt xuống, để lại; “thức ăn khất thực đã được đặt sẵn” = phần cúng đã được dành sẵn cho họ. Cách đọc khác: “thức ăn khất thực đã bị bỏ lại/ bị gửi xuống”. Cùng hướng nghĩa.
  9. `Osadhikāyo ganthenti` (`5.3`): `ganthenti` “kết, buộc”: hiểu là “kết bó thảo dược”; cũng có thể là “làm (viết) bùa/ kết thành thuốc”; chọn nghĩa đen nhất. `nhāpayanti` (`5.4`): sai khiến “làm cho tắm” = “cho người khác tắm”; `japanti` = đọc thầm chú.
  10. `Pesanānipi gacchanti, rathacariyāsu sikkhare` (`9.3`–`9.4`): `pesana` = việc sai phái, “đi làm việc sai phái”; `rathacariyā` = việc đánh xe, “nghề đánh xe”; không thêm “xe ngựa”. `Kiṅkiṇikāyo … ghosenti puratopi te` (`9.1`–`9.2`): `puratopi` “cũng ở phía trước”; không thêm “vua”/“đoàn rước” vì Pāli không nói trước ai.
  11. `Tādise nipatāmase` (mười một lần: `6.4`…, `47.4`): `nipatāmase` (hiện tại, ngôi thứ nhất số nhiều, thể trung) = “rơi vào, bắt gặp”; hiểu là “chúng ta bắt gặp những hạng như thế”. Ở khổ `47.4` (hạng bà-la-môn thật) nghĩa trung tính vẫn dùng được. Cách đọc khác: “chúng ta đến với những hạng như thế”. Giữ một chữ cho cả 11 khoá để không phân biệt khác Pāli (Pāli giống hệt từng chữ).
  12. `Rājāyatanaṁ` (`22.1`): giữ phiên âm, không rõ có phải tên một loại quả (cây `rājāyatana`, ví dụ trong tầng chỉ có tên chỗ ở). Nếu là “nơi ở của vua” thì cả khổ `22` phải đọc lại; ngữ cảnh liệt kê trái cây khiến đọc “quả” hợp lý hơn.
  13. `Yudhiṭṭhila` (`1.2`): tên riêng (dòng Yudhiṭṭhila/Koravya) hay tính từ “dũng mãnh trong trận”: xem phần tiền lệ ở trên.

