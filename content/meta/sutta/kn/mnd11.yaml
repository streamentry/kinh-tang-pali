notes: |-
  **Phạm vi: đủ 790/790 khoá của mnd11, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải `snp4.11` (Kalahavivādasutta, Kinh Tranh Chấp Và Cãi Vã), phẩm Aṭṭhakavagga. Cấu trúc như `mnd6`, `mnd12` và các bài Cūḷaniddesa: dẫn từng đoạn kệ (thẻ in đậm ở Pāli), giải từng cụm, rồi nhắc lại cả khổ kệ trong ngoặc kép. Có 16 khổ kệ, mỗi khổ xuất hiện hai lần (khối in đậm `2`, `10`, `18`, `24`, `33`, `40`, `48`, `64`, `71`, `78`, `85`, `96`, `103`, `110`, `117`, `122` và khối nhắc lại `9`, `17`, `23`, `32`, `39`, `47`, `63`, `70`, `77`, `84`, `95`, `102`, `109`, `116`, `121`, `127`) = 132 khoá kệ; lời dẫn *Vì thế, vị được hóa hiện ấy đã nói—* ở `8`, `22`, `38`, `69`, `83`, `101`, `115` và *Vì thế, Đức Thế Tôn đã nói—* ở `16`, `31`, `46`, `62`, `76`, `94`, `108`, `120`, `126`. Pāli có 210 khoá mang thẻ in đậm, bản Việt không mang thẻ. Dấu lược `…`: 144 khoá (34 khoá có `…pe…` đều thành đúng một `…`; 110 khoá có `…` trần, mỗi khoá giữ đúng một dấu, phần lớn là các khoá lược theo danh sách như `25.7`–`25.9`, `27.5`–`27.38`, `54.3`–`54.9`, `55.3`–`55.16`), 1 khoá kết `….` (`61.6`, Việt kết ` ….`), 0 khoá có `(…)`. Nháy: Pāli có 55 khoá chứa “ và 55 khoá chứa ”, 0 nháy đơn, 0 ngoặc đơn; bản Việt khớp Pāli từng khoá (0/790 lệch), kể cả hai khối mở ở `44.8` và đóng ở `44.13`, mở ở `61.2` và đóng ở `61.7`.

  **Tên bài.** `0.1` → *Đại Tập Kể Lược*, `0.2` → *Kể Lược Phẩm Tám Kệ* (theo `mnd1`, `mnd12`); `0.3`, `1.1` và `128.1` → *Kể Lược Kinh Tranh Chấp Và Cãi Vã* (tên kinh theo `snp4.11:0.2`, cùng khuôn với *Kể Lược Kinh Tiểu Bố, thứ mười hai* ở `mnd12:116.1`).

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd11`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho kn/mnd và tệp tên `mnd-name`; không có tệp `mnd11_translation-en-sujato.json`. Lớp `english-project` không có `mnd11`; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage (khoá Pāli ≥ 40 ký tự, bỏ khối `0.x`) là **306** khoá (270 nếu bỏ thẻ in đậm trước khi đếm); Sujato phủ 0/306, `english-project` 0/306, `vietnamese-current` 0/306. Ba tầng vắng hết ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`; không nâng điểm để né blocker, và entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.11` có trong tầng đã ghim nhưng là bản của **bài khác** (bài kệ), nên không tính là đối chiếu English của mnd11; nó chỉ giúp đọc khổ kệ. Chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.11` và của các bài `mnd1`, `mnd3`–`mnd9`, `mnd12`, `cnd1`–`cnd21`, `an3.125`, `mn140`, `dn31`, `an10.176`, `an3.58`.

  **Kệ: dùng lại `snp4.11`.** 132 khoá kệ khớp từng dòng với 16 khổ của `snp4.11`: 120 khoá giữ đúng chữ của bản Việt đã có (chỉ chỉnh dấu cuối dòng cho khớp Pāli: 10 khoá từ ` —` về `,` ở `2.3`, `9.3`, `40.1`, `47.1`, `48.1`, `63.1`, `64.3`, `70.3`, `71.3`, `77.3`, và `110.4`, `116.4` từ `,` về `;`; bỏ nháy đơn ở `96.4`, `102.4` vì Pāli khoá này không có nháy đơn). 12 khoá sửa theo lời giải của chính bài này, vì lời giải đọc khác `snp4.11`:
    - `18.2`, `23.2`, `24.2`, `32.2` (cùng tiêu đề `20.1`, `20.6`, `26.1`, `26.6`) `Ye cāpi lobhā vicaranti loke`: lời giải `20.2`, `26.2` giải *ye cāpi* bằng *khattiyā … devā manussā* (người), `20.3` giải *lobhā* là *lobho …* ⇒ *những ai do tham lam mà sống ở đời*; `snp4.11:3.2`, `4.2` dịch *các tham lam lưu hành ở đời*.
    - `18.3`, `23.3`, `24.3`, `32.3` (cùng tiêu đề `21.1`, `27.1`, `29.2`) `niṭṭhā` → *cứu cánh*: `snp4.11:3.3`, `4.3` dịch *quyết định*, nhưng lời giải `27.4` (*rūpaniṭṭho hoti*, sau khi tìm cầu thì đạt được), `29.1` (*āsāya samiddhi vuccate niṭṭhā*) và `21.6` (liệt cùng *parāyanā*) không hợp với *quyết định*; tầng: khoá có *niṭṭh* ở Pāli dịch *cứu cánh* 23, *quyết định* 15.
    - `117.3`, `121.3` (cùng `119.1`, `119.3`) `samayaṁ`: `snp4.11:15.3` *một thời điểm*, lời giải `119.1` giải bằng *samaṁ upasamaṁ vūpasamaṁ nirodhaṁ paṭipassaddhiṁ* ⇒ *sự lắng dịu*.
    - `122.1`, `127.1` (cùng `123.1`, `123.4`) `Ete ca ñatvā upanissitā`: `snp4.11:16.1` *những điều ấy là có nhân*, lời giải `123.2` *ete = diṭṭhigatike*, `123.3` *upanissitā = sassatadiṭṭhinissitā …* ⇒ *những người ấy là kẻ nương tựa*.
    Hai lần `snp4.11` dịch *vivāda* là *tranh cãi* (`2.5`, `16.3`) so với *cãi vã* (`1.1`, `2.1`, `2.4`) được giữ nguyên ở các khoá kệ tương ứng (`10.5`, `15.1`, `15.14`, `17.5`, `122.3`, `124.1`, `124.6`, `124.16`, `127.3`) vì là kệ đã publish.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, gộp khoảng trắng) trùng nguyên văn với khoá đã dịch ngoài bài này: 127 khoá có tiền lệ, dùng lại nguyên văn 74 (nguồn chính: `cnd5`, `cnd9`, `cnd10`–`cnd13`, `cnd15`, `mnd3`, `mnd6`, `mnd7`, `mnd9`, `mnd12`, `thag10.1`), 53 khoá khác nội dung, kèm lý do:
    - `5.5`, `5.7` (trùng `cnd5:12.3`, `mnd6:63.6`): *macchariya* → *bỏn xẻn*, không *keo kiệt*, theo `snp4.11` (`1.2`, `2.2`, `2.4`); trong 182 khoá Việt có *macchari* ở Pāli, *keo kiệt* 156 khoá, *xan tham* 12, *bủn xỉn* 5, *bỏn xẻn* 1. Toàn bài dùng *bỏn xẻn* để tiêu đề, kệ và lời giải khớp nhau (`5.4`–`5.10`, `12.9`, `14.x`); `5.5` còn đổi *chỗ ở* thành *trú xứ* cho khớp `27.11`, `55.9` (cnd13:15.7).
    - `11.2`, `11.4`, `11.6`, `11.7`, `11.9`, `25.35` (trùng `mnd6:75.2`–`75.9`): *piya* → *được thương*, không *được ưa thích*, theo `snp4.11:3.1`, `4.1` (*các điều được thương*).
    - `25.8`, `25.9`, `25.15`, `25.16`, `25.22`, `25.23`, `27.6`–`27.19`, `55.4`–`55.16` (trùng `cnd13:15.2`–`15.15`, `mnd3:55.11`): *nơi mùi, nơi vị, nơi xúc chạm …* là lược theo động từ *āsīsati* (cầu mong nơi) ở `cnd13:15`; ở đây lược theo *pariyesati, paṭilabhati, paribhuñjati* (`25.x`), *pariyesanto … paṭilabhati* (`27.4`) và *labhissāmi* (`55.2`) nên dịch bản thân danh từ (*hương …*, *vị …*, *xúc …*, *gia đình …*), và dùng bộ *sắc, thanh, hương, vị, xúc* của `11.8` (tầng: *hương* 46 so với *mùi* 20; *thanh* 20 so với *âm thanh* 7; *xúc* 47 so với *xúc chạm* 13). Từ `45.13`, `45.14` cũng vậy (*khi thanh …*, *khi hương …* so với `cnd20:13.8`, `13.9`).
    - `87.5`–`87.7`, `88.4`–`88.7` (trùng `mnd6:33.3`–`33.5`, `32.3`–`32.6`): *pariggaha* → *chấp thủ*, *mamatta* → *chấp ngã*, không *sở hữu*, *sự xem là của mình*, theo `snp4.11:10.2`, `10.3`, `11.2`, `11.3`.
    - `110.2`, `116.1`, `116.2` (trùng `cnd2:21.1`–`21.2`): *Điều con đã hỏi, ngài đã nói cho con* theo `snp4.11:14.1`–`14.2`, không *chúng con … Ngài*.
    Thêm 15 khoá trùng sau khi bỏ dấu câu và chữ hoa/thường: dùng lại 3 (`58.7`, `58.14`, `59.17`), khác 12: chỉ khác chữ hoa đầu khoá hoặc dấu cuối ở `49.3`, `59.3`, `60.12`, `60.14`, `124.15`; `5.8` (*bỏn xẻn*), `28.1`, `110.1`, `111.4`, `112.4` theo lý do trên; `58.4` giữ *sống hộ trì Pātimokkha* theo dạng nhiều nhất của tầng (21 khoá) thay cho *thu thúc theo giới bổn* ở `mnd3:17.5`, `cnd5:45.2`; `60.5` dịch *mọi pháp là vô ngã* theo `cnd12:12.4`, khác *mọi pháp đều vô ngã* ở `dhp279:1`. Các khối công thức không có tiền lệ khoá-trùng nhưng có bản gần: *Ta thuyết pháp nhờ đã trực tiếp chứng ngộ …* `61.2`–`61.5` theo `an3.125:2.1`–`2.4`; công thức *sukhavedanīyaṁ phassaṁ paṭicca* `72.2`–`72.7` theo `mn140:19.6`, `19.9`; danh sách thẩm xét sắc `90.2` theo `cnd11:64.2` (đủ 43 mục so với 43 Pāli, bỏ *asaraṇībhūtato* vì Pāli bài này không có); sáu cửa hao tán tài sản `44.8`–`44.13` theo `dn31:7.2`; dây trói `52.x`, công thức *pisuṇavāco* `6.4`–`6.6`, `15.2`–`15.4` theo `an10.176:11.1`, `an10.211:5.1`; công thức định *samāhite citte …* `106.3` theo `an3.58:5.1`; *sampajānamusā bhāsati* → *cố ý nói dối* (`an10.217:7.3`); mười lối hỏi *mūlaṁ pucchati … samudayaṁ pucchati* `4.2`, `7.4`, `19.2`–`19.3` … theo mười mục *mūladassāvī … samudayadassāvī* của `cnd7:2.7` (*gốc, nhân, nguồn gốc, nguồn sinh, chỗ phát sinh, nơi khởi lên, thức ăn, đối tượng, duyên, tập khởi*) và *papucchati yācati ajjhesati pasādeti* → *hỏi kỹ, cầu xin, thỉnh cầu, khẩn cầu* (`cnd10:46.2`); bộ *kiṁnidānā kiṁsamudayā kiṁjātikā kiṁpabhavā* → *lấy gì làm căn nguyên, nguồn sinh, chỗ phát sinh, nguồn gốc* theo `mnd12:41.2`.
    Đã dò **85 nhóm Pāli trùng nguyên byte trong chính bài** (127 khoá lặp thêm): 7 nhóm bản Việt khác, đều vì lý do câu hỏi và câu đáp (`18.2`/`23.2` so với `24.2`/`32.2`: dấu hỏi và dấu chấm phẩy; `18.4` so với `24.4`; `23.4` so với `32.4`), chữ hoa đầu khoá ở `64.3`/`70.3` so với `71.3`/`77.3`, hoặc dịch theo vế trước (`25.8`, `25.9`, `27.8` so với `55.4`–`55.6`: *các hương …*, *các vị …*, *các xúc …* vì `55.2`, `55.3` đã nêu *các sắc, các thanh vừa ý*). Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 122 nhóm (213 khoá lặp thêm), 3 nhóm khác ngoài dấu câu (`gandhe …`, `rase …`, `phoṭṭhabbe …` như trên, chủ ý).

  **Thuật ngữ, kèm số đếm.**
    - *kalaha · vivāda · bhaṇḍana · viggaha · medhaga* → *tranh chấp · cãi vã · gây gổ · xung đột · tranh cãi*, theo `snp4.11:1.1`, `2.1`, `2.4` (*tranh chấp và cãi vã*) vì bài chú giải trực tiếp câu kệ ấy (`3.2`–`3.10`: *kalaho = tranh chấp, vivādo = cãi vã*; `124.13`). Khác `mnd5:6.3`, `mnd8:12.3`, `mnd9:114.4`, `mnd12:113.2`, `mnd12:10.2` (*cãi vã · tranh chấp · xung đột · tranh luận · tranh cãi*): trong tầng, trong 60 khoá có cả *kalaha* và *bhaṇḍana* ở Pāli, bản Việt có chữ *tranh chấp* ở 47 khoá, *cãi vã* 41, *tranh luận* 38, *tranh cãi* 31, *xung đột* 29, *gây gổ* 8, nên chưa có quy ước chung; cần người biên tập hài hoà.
    - *paridevo · soko · macchariya* → *than van · sầu muộn · bỏn xẻn* (theo `snp4.11`); tầng: *parideva* *than khóc* 89 khoá, *khóc than* 11, *than thở* 8, *than van* 4; *soko* *sầu* 156, *sầu muộn* 50, *sầu não* 10. *māno · atimāno · pesuññaṁ* → *ngã mạn · quá mạn · ly gián* (`snp4.11`; tầng *mạn* 210 khoá, *ngã mạn* 61, *kiêu mạn* 35, *quá mạn* 10; *pesuñña* *hai lưỡi* 8, *ly gián* 5, *đâm thọc* 5).
    - *sātaṁ asātaṁ* → *lạc và khổ* (`snp4.11:6.1`, `8.1`), lời giải `41.2` giải bằng *sukhā vedanā, iṭṭhañca vatthu* nên *sukhadukkhaṁ* (`42.2`, `56.2`) dịch *thọ lạc và thọ khổ*; *iṭṭha/aniṭṭha* → *đáng mong muốn / không đáng mong muốn*. *vibhavaṁ bhavañca* → *không hiện hữu và hiện hữu* theo thứ tự ở lời giải (`43.3`–`43.8`, `67.2`–`67.7`); kệ giữ *hiện hữu và không hiện hữu* của `snp4.11:6.3`, `8.3`. *vibhūta* → *biến mất* (`snp4.11:10.4`, `11.4`), *vibhāvīyati atikkamīyati samatikkamīyati vītivattīyati* → *bị làm cho biến mất, bị vượt qua, bị vượt hẳn, bị vượt quá*.
    - *chando* → *dục* (`snp4.11:5.1`; tầng *dục* 422, *ham muốn* 337, *ước muốn* 37 trong khoá có *chand* ở Pāli); năm *chanda* → *dục tìm cầu, dục đạt được, dục thọ dụng, dục tích trữ, dục phân phát* (0 tiền lệ). *icchā* → *ước muốn* (`snp4.11:11.2`).
    - *vinicchaya* → *phán quyết* (`snp4.11:5.2`, `mnd12:112.2`; trong 54 khoá Việt có *vinicchay* ở Pāli, *phán quyết* 24 khoá, *quyết định* 9). *jantu*, *yakkha* → *hữu tình* (`snp4.11:6.4`, `14.4`); *satta* → *chúng sinh* (`11.4`; trong danh sách đồng nghĩa `45.20`, `113.3`), khác `mnd12:113.5` (*hữu tình* cho *satto*). *kathaṅkathā* → *nghi hoặc* (79 khoá, *hoài nghi* 4). *mosavajja* → *nói dối* (13 khoá Pāli có *mosavajj*, 10 dịch *nói dối*). *āsā* → *mong cầu* (`snp4.11:3.3`) nhưng giữ *hy vọng* ở khổ kệ thag dẫn lại `28.1`–`28.6` theo `thag10.1:4.1`–`4.6`.
    - *nidāna · samudaya · jātika · pabhava · hetu*: *từ đâu làm nhân* (kệ), *lấy gì làm căn nguyên · nguồn sinh · chỗ phát sinh · nguồn gốc* (`mnd12:41.2`), và mười mục hỏi theo `cnd7:2.7` (nidāna = *nguồn gốc*, hetu = *nhân*); ba lớp dùng chữ *nhân/nguồn gốc* theo nhiều cách khác nhau trong tầng (`ps2.2:32.3`: *nhân duyên · nguồn gốc · nơi sinh · chỗ phát sinh*), nên ghi để người biên tập hài hoà.
    - *brūhi ācikkha desehi paññapehi paṭṭhapehi vivara vibhaja uttānīkarohi pakāsehi* → *hãy nói, hãy giải thích, hãy giảng dạy, hãy trình bày, hãy an lập, hãy khai thị, hãy phân tích, hãy làm cho hiển lộ, hãy công bố* và *brūmi …* → *Ta nói, Ta giải thích, Ta giảng dạy, Ta trình bày, Ta an lập, Ta khai thị, Ta phân tích, Ta làm cho hiển lộ, Ta công bố* theo `cnd5:20.1`, `cnd7:48.3`, `mnd7:6.2`, `cnd11:14.8` (12 khoá), không theo `mnd12:31.3` (*nói, giảng giải, thuyết giảng, công bố, xác lập, khai mở, phân tích, làm sáng tỏ, giải thích*, 1 khoá).
    - *accantaanupādāvimokkha* → *sự giải thoát hoàn toàn không chấp thủ* (`cnd10:40.8`); *Pātimokkha* giữ nguyên (`58.4`); *adhisīlasikkhā …* → *học giới/tâm/tuệ tăng thượng* (`mnd7:34.7`, `cnd5:45.1`–`47.1`); *dhutaṅga* → *hạnh …* (`cnd18:39.5`).

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `pañca macchariyāni` 5 → *năm* (5/5 mục ở `5.5`); `dve piyā` 2 → *hai* (`11.2`, `25.32`); `dvīhi kāraṇehi` 2 → *hai lý do* (`6.8`, `15.6`); `ime aṭṭha kilesā` 8 → *tám* (đủ 8/8 mục ở `7.2`) và `ime satta kilesā` 7 → *bảy* (đủ 7/7 mục ở `14.2`); `pañca chandā` 5 → *năm* (đủ 5/5 ở `25.4`); `dve vinicchayā` 2 (`44.3`); `cha bhogānaṁ apāyamukhāni` 6 → *sáu* (đủ 6/6 mục ở `44.8`–`44.13`); `tisso sikkhā` 3 (`58.2`); `catūhākārehi` 4 → *bốn* (đủ 4/4 ở `89.4`), `catūhi kāraṇehi` (`92.4`), `catasso arūpasamāpattiyo` (`92.2`), `catunnaṁ arūpasamāpattīnaṁ` (`105.3`); `pañca phassā` 5 (đủ 5/5 ở `93.3`); `channaṁ phassāyatanānaṁ` 6 (`60.19`); `pañcannaṁ upādānakkhandhānaṁ` 5 (`60.20`); `catunnaṁ mahābhūtānaṁ` 4 (`60.21`, `89.7`); `tiṇṇaṁ saṅgati phasso` 3 (`86.2`…`86.17`, 6/6); `dasasahassī lokadhātu` = dasa 10 × sahassa 1.000 = 10.000 → *mười ngàn thế giới* (`61.7`; trong 43 chỗ của tầng viết *mười ngàn* hoặc *mười nghìn* cho `dasasahassī`: *ngàn* 25, *nghìn* 18); danh sách thẩm xét sắc `90.2` 43/43; dây trói `52.x` 9/9; bệnh `54.x` 9/9; năm hạng quân `25.30` 5/5; tám chi và các nhóm mười như `113.5` 7/7. Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
    1. `119.1` `yato kiṁ, bho, ayaṁ attā kāyassa bhedā ucchijjati …`: dịch *thưa các vị, khi tự ngã này, sau khi thân hoại, bị đoạn diệt …*; *kiṁ* có thể là *kho*; cách đọc `samayaṁ` ở đây theo lời giải (xem phần kệ), chưa có tiền lệ khác. `bhavatajjitā` → *bị hiện hữu làm cho khiếp sợ* (0 tiền lệ).
    2. `52.8`, `52.9` `pakkhepabandhana`, `parikkhepabandhana` → *trói buộc bằng sự quăng vào / sự vây quanh*: dịch sát chữ, 0 tiền lệ; nghĩa cụ thể của hai kiểu trói chưa phân xử.
    3. `54.3`, `54.8` `sotarogato`, `kaṇṇarogato` cùng là *tai*: dịch *bệnh về tai* và *bệnh về lỗ tai*; cách phân biệt chưa chắc.
    4. `86.3`, `86.6` … `86.18` `rūpasmiṁ`, `nāmasmiṁ` → *ở trong sắc / ở trong danh*; `86.18` `vatthu rūpaṁ rūpasmiṁ, dhammā rūpino rūpasmiṁ` → *chỗ nương là sắc, ở trong sắc; các pháp thuộc sắc ở trong sắc*: dịch sát chữ, *vatthu* chưa có tiền lệ ở đây.
    5. `37.2`, `37.4` `sahagatā sahajātā saṁsaṭṭhā sampayuttā, ekuppādā ekanirodhā ekavatthukā ekārammaṇā`, `aññajātikā aññavihitakā`: 0 tiền lệ; dịch *đồng hành, đồng sinh, hòa lẫn, tương ưng, cùng sinh, cùng diệt, cùng một chỗ nương, cùng một đối tượng* và *khác chủng loại, khác cách thức*.
    6. `124.5` `So vimaṁsīti paṇḍito … medhāvīti ñatvā muni nissaye so vimaṁsī`: cú pháp *ñatvā … so vimaṁsī* ở đây có thể đọc theo hai cách (*sau khi biết [vị ấy] là bậc có trí …* hay *sau khi biết chỗ nương tựa, vị ấy có suy xét*); chọn cách thứ hai theo kệ.
    7. `25.30` `visajjanacchando` → *dục phân phát*: `visajjeti` ở đây là cho đi của cải để có người hộ vệ; chưa có tiền lệ cho tên năm loại dục (0 tiền lệ). `25.27`, `25.30` các khối trích trong ngoặc kép dịch trực tiếp, không thêm *nghĩ rằng*.
    8. `61.3`, `61.4` *sanidāna* → *có duyên nguồn*, *sappāṭihāriya* → *có thể chứng minh được* theo `an3.125:2.2`, `2.3` (cùng Pāli); `an8.70`, `dn16` dịch *có thể kiểm chứng* cho cùng chữ *sappāṭihāriyaṁ*.
    9. `6.11`, `15.9` `suhadayo` → *bạn thân thiết*, `abbhantariko` → *thân cận*: 0 tiền lệ; `6.14`, `15.12` `dvidhā`/`dvedhā`, `dvejjhā` → *thành hai phần*, *thành hai khối*: sắc thái hai chữ gần nhau.
    10. `3.9` `daṇḍapasutā` → *chuyên dùng gậy gộc*; `5.3` `bhogarogasīladiṭṭhibyasanena` dịch như một vế rút gọn *tai họa về tài sản, bệnh tật, giới, kiến*; `107.2` `papañcāyeva papañcasaṅkhā` → *chính hý luận là các định danh do hý luận*, dịch sát chữ.
    11. `41.2`, `41.3`, `42.2` `sātaṁ` vừa là *lạc* (kệ) vừa được lời giải đặt ngang *thọ lạc và vật đáng mong muốn*; chọn *lạc* ở cả hai chỗ.
    12. Lỗi ngoài lát, báo chứ không sửa: `snp4.11:3.2`, `4.2` (*các tham lam lưu hành ở đời*), `3.3`, `4.3`, `5.1` … *quyết định* cho *niṭṭhā*, `15.3` *một thời điểm*, `16.1` *những điều ấy là có nhân*, và hai cách dịch *vivāda* (*cãi vã* ở `1.1`, `2.1`, `2.4` so với *tranh cãi* ở `2.5`, `16.3`); cách quy ước *kalaha/vivāda* (xem phần thuật ngữ) cần hài hoà giữa `snp4.11`, `mnd5`, `mnd8`, `mnd9`, `mnd12`.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (790/790, cùng thứ tự); nháy kép `“”` khớp Pāli từng khoá (0/790 lệch; 0 nháy đơn, 0 ngoặc đơn, 0 nháy thẳng, 0 thẻ HTML); dấu lược `…` khớp Pāli từng khoá (0/790 lệch; 144 khoá có `…`); 0 khoá rỗng; NFC; không khoảng trắng thừa; Pāli lọt sang Việt: chỉ có tên *Pātimokkha* ở `58.4` và hai chữ *jāgu*, *indagu* ở `113.3`, `118.3` (giữ nguyên như `mnd1:15.3`, `mnd12:113.5`, không có từ Việt tương đương).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 5.5, 5.8 — «bỏn xẻn» → «keo kiệt» (macchariya; 141 khoá của tầng dùng «keo kiệt», 6 dùng «bỏn xẻn»), đồng bộ mọi chỗ «bỏn xẻn» còn lại trong bài; giữ nguyên khoá 86.2, 86.17 (cách «Do duyên mắt và các sắc, thức mắt sinh khởi; sự gặp gỡ của ba pháp này là xúc» khớp từng khoá 86.5–86.14 trong bài; bản đa số «tâm thức» cho manoviññāṇa sai thuật ngữ).

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli, không xem bản dự án; so 229 khoá chênh lệch lớn nhất (trong 790 khoá), phần lớn chỉ khác diễn đạt (thêm/bớt thẻ in đậm, *keo kiệt* ↔ *xan tham*, *lạc* ↔ *dễ chịu*, *Mâu-ni* ↔ *muni*; giữ bản dự án). Khác nghĩa thật 5 chỗ (15 khoá trong danh sách, 40 khoá phải sửa trong cả bài, đều là lỗi thuật ngữ/đọc nghĩa chứ không phải thiếu khoá): sửa 5, giữ phần còn lại, bất định 4.

  Sửa (đối chiếu Pāli và tiền lệ đã đếm): (1) `28.3`–`28.4` `Āsāya vāṇijā yanti, samuddaṁ dhanahārakā`: trước *ra khơi / vận chuyển hàng hoá quý giá* (mất `samuddaṁ` khỏi khoá của nó, và `dhanahāraka` là người đi lấy của cải chứ không phải việc vận chuyển) → *lên đường / ra biển, những người đi lấy của cải*, khớp `pv21:1.2`. (2) `mamatta` (`78.3`, `81.1`–`81.3`, `84.3`, `85.3`, `88.1`, `88.4`–`88.10`, `95.3`): trước *chấp ngã* → *sự xem là của mình*; `mamatta` là tính "của tôi", cùng gốc với `mamāyanti` ở `12.9`, không phải ngã (`attā`, vốn xuất hiện riêng ở `45.x`); các bài Niddesa còn lại dùng *sự xem là của mình* (`cnd8:81`, `mnd2:94`, `mnd6:32`, `mnd14:109`, `mnd15:184`). (3) `pariggaha` (`78.2`, `80.1`, `80.3`, `84.2`, `85.2`, `87.1`, `87.4`–`87.10`, `95.2`): trước *chấp thủ*, trùng với `upādāna` (*chấp thủ dục* cho `kāmupādānaṁ` ở `25.2`) → *sở hữu* (`mnd2:115`, `mnd6:33`, `mnd6:64`). (4) `bhavābhavāya` (`122.4`, `125.1`, `125.2`, `125.4`, `127.4`): trước *hữu và phi hữu* → *hữu này hữu khác*, vì lời giải ở `125.2` chỉ liệt kê các hữu nối tiếp (nghiệp hữu, tái hữu, dục hữu…) chứ không đối lập hữu với phi hữu; khớp `cnd2:37.5`, `cnd9:59`. (5) `kusalāvadānā` (`117.4`, `119.1`, `119.3`, `121.4`): trước *các bậc thiện xảo thuyết giảng về vô dư* (nghe như lời xác nhận) → *những người tự cho mình là thiện xảo về chỗ vô dư*, đúng với lời giải `119.2` (`kusalavādā` = *những người tuyên bố mình là thiện xảo*) và với `mnd12:9.4`, `mnd13:23.4`.

  Giữ: `96.1`/`103.3`/`109.3` `sametassa` (bản mù *đạt tới*; lời giải `paṭipannassa` ở `97.2`, `106.4` xác nhận *thực hành*); `vibhoti` (*biến mất*; bản mù dùng dạng bị động *bị trừ diệt* mà Pāli không có); `103.1`/`109.1` `saññasaññī`/`visaññasaññī` (bản mù *bình thường/bất thường*, lời giải nói *điên loạn, tâm rối loạn*); `124.15` `na kenaci saṁvadati` (*không đồng tình*, trùng `mn74:13.1`); `5.6` chuỗi từ keo kiệt (trùng `cnd5:12`, `mnd2:48`, `mnd6:63`); `27.22` *Thắng Pháp* (cùng `cnd18:39`); `71.4`, `75.x` *ta … ngươi* (như `snp4.11`). Các khoá nhắc lại `<b>` bản mù giữ thẻ, bản dự án bỏ theo quy ước tầng.

  Bất định (không phân xử được, không thêm vào thân kinh): (a) `nu` ở `110.3`, `113.1`, `113.6`, `116.3` là tiểu từ hỏi; bản Việt giữ giọng hỏi nhờ `udāhu` (*hay họ còn nói…*) ở `110.5`/`116.5` và dấu `?` ở `113.1`, không thêm *phải chăng* như bản mù. (b) `ye samparāyāya narassa honti` (`18.4`, `21.5`, `21.7`, `23.4`, `24.4`, `30.1`, `30.3`, `32.4`): giữ *những điều đưa người đến đời sau*, nhưng lời giải `21.6` đọc là `parāyanā` (nơi nương tựa), nên cũng có thể đọc *những điều làm chỗ nương tựa cho người ở đời sau*. (c) `pakkhepabandhanena`/`parikkhepabandhanena` (`52.8`–`52.9`): *quăng vào*/*vây quanh* theo `cnd23:29.3`, `mnd15:4.2`; nghĩa chính xác của hai kiểu trói buộc chưa rõ. (d) `sanidānaṁ` ở `61.3`/`61.5` là *duyên nguồn* (khớp `an3.125:2.4`), hơi tối nghĩa nhưng giữ để đồng nhất với bài trùng. Các câu kệ trùng nguyên văn trong `snp4.11` (`10.2`, `10.3`, `11.2`, `11.3`, `15.4`, `16.4`, `3.4`, `4.4`…) vẫn mang bản cũ ở bài đó, ngoài phạm vi lượt này. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bài 790 khoá, đoạn song song `snp4.11`, `an3.125`, `sn22.25`, `cnd12`): sửa 1 khoá. `36.2` `doso dussanā dussitattaṁ`: trước *sân, sự làm hại, trạng thái bị làm hại* (đọc `dussati` như bị động/gây hại) → *sân, sự sân hận, trạng thái sân hận*; `dussati` ở đây là nổi sân (cùng gốc `doso`, `padoso`), không phải bị làm hại, khớp cách sửa ở `cnd7:62.3`; sai nghĩa nhỏ nhưng nằm trong chuỗi đồng nghĩa của `kodho`. Công thức này còn y nguyên ở `mnd10:17.15`, `mnd10:87.2`, `mnd14:165.6`, `cnd23:297.10` (ngoài lô, cần rà). Giữ: `91.4` lược bỏ *yo … taṁ* (*Này các tỳ-kheo, hãy từ bỏ tham đắm đối với sắc*) vì trùng nguyên văn `sn22.25:1.2` đã publish; `117.3`/`121.3` *sự lắng dịu* cho `samayaṁ` theo lời giải `119.1`; `5.6` chuỗi *xan tham · bủn xỉn* theo thứ tự Pāli. Bất định: không thêm mục mới; các câu kệ trùng ở `snp4.11` còn mang bản cũ như đã báo ở trên. Đã đối chiếu hệ thống mọi đoạn song song được liệt kê; không có bản Anh, không có bản Việt nguyên bài độc lập.

