notes: |-
  **Phạm vi: đủ 565/565 khoá của mnd3, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải kinh `snp4.3` (Duṭṭhaṭṭhakasutta, Kinh Tám Kệ Về Kẻ Ác), thuộc phẩm Aṭṭhakavagga. Cấu trúc giống `mnd4`, `mnd5` và các bài Cūḷaniddesa: dẫn từng đoạn kệ, giải từng cụm, nhắc lại cả đoạn kệ (kệ in đậm ở `2`, `9`, `16`, `26`, `35`, `42`, `49`, `59`; nhắc lại trong ngoặc kép ở `8`, `15`, `25`, `34`, `41`, `48`, `58`, `65`, mỗi lần mở đầu bằng *Vì thế, Đức Thế Tôn đã nói—* ở `7.1`, `14.1`, `24.1`, `33.1`, `40.1`, `47.1`, `57.1`, `64.1`; riêng kệ Sabhiya `28` có dòng `(sabhiyāti bhagavā)`). Pāli có 127 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 94 khoá chứa dấu lược `…`: 19 khoá có `…pe…` (`5.7`, `10.10`, `13.3`, `30.8`, `36.3`, `36.4`, `37.3`, `37.4`, `51.3`, `52.7`, `53.2`, `53.3`, `56.3`, `56.4`, `60.3`, `60.4`, `61.3`, `61.4`, `61.11`, đều thành đúng một `…`), 75 khoá có `…` trần (`10.11`–`10.17`, `27.5`–`27.23`, `29.1`–`29.19`, `43.3`–`43.10`, `50.7`, `50.10`–`50.14`, `50.21`–`50.24`, `51.4`–`51.7`, `51.9`, `55.10`–`55.12`, `55.15`–`55.18`, mỗi khoá giữ đúng một dấu), 0 khoá có `(…)`, 0 khoá kết `….`; bản Việt không có `(…)` nào. Pāli có 48 khoá mang nháy kép `“”` và không khoá nào mang nháy đơn `‘’`; bản Việt khớp từng khoá (0/565 lệch, kể cả nháy mở ở khoá này và nháy đóng ở khoá sau, như `17.16`–`17.17`, `19.6`–`19.21`, `20.4`–`20.18`, `22.3`–`22.5`, `28.1`–`28.5`, `31.3`–`31.5`, `55.10`–`55.13`). Pāli có đúng 1 khoá mang ngoặc đơn là `28.2` `(sabhiyāti bhagavā)`, bản Việt giữ cặp ngoặc đơn *(Đức Thế Tôn nói với Sabhiya)* theo `snp3.6:13.2` và `cnd5:65.2`. 97 khoá kết bằng dấu gạch dài `—`, bản Việt khớp từng khoá.

  **Tên bài.** `0.1` Mahāniddesa → *Đại Tập Kể Lược*, `0.2` Aṭṭhakavagga → *Kể Lược Phẩm Tám Kệ*, `0.3` và `66.1` → *Kể Lược Kinh Tám Kệ Về Kẻ Ác, thứ ba*, theo `mnd4:0.1`–`0.3` và `mnd5:0.1`–`0.3` (tên kinh theo `snp4.3:0.2` *Kinh Tám Kệ Về Kẻ Ác*). Tầng tên của Sujato (`mnd-name`) ghi tiêu đề mnd3 là *Exposition of the Eight on Corruptions*, còn `snp4.3` ghi *Eight on Malice*; giữ tên theo `snp4.3` để hai bài khớp nhau.

  **Cách trình bày lemma** theo `mnd4`, `mnd5`, `cnd6`, `cnd9`, `cnd12`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế (chữ thường, đổi dấu cuối cho khớp Pāli). Các câu nhắc lại dòng kệ ở cuối từng đoạn lời giải (như `3.2`, `4.2`, `5.15`, `6.6`, `10.4`, `11.6`, `12.5`, `13.5`, `20.22`, `23.9`, `29.21`, `30.12`, `31.7`, `32.8`, `36.12`, `37.11`, `38.18`, `39.23`, `43.13`, `44.6`, `45.5`, `46.20`, `53.7`, `55.32`, `56.13`, `60.12`, `61.14`, `62.10`, `63.3`) giữ cùng chữ với dòng kệ; liên từ riêng của dòng kệ (*khi*, *Nhưng*, *Vì*) chỉ giữ ở dòng kệ, không mang vào lemma.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd3`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho mnd1–mnd16 và tệp tên `mnd-name`. Lớp `english-project` không có `mnd3`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **197** khoá (210 nếu đếm cả thẻ); Sujato phủ 0/197, `english-project` 0/197, `vietnamese-current` 0/197. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.3` (bài kệ chứa đúng tám đoạn kệ này) có trong tầng đã ghim nhưng là bản của **bài khác**, nên không tính là đối chiếu English của mnd3; nó chỉ được dùng để kiểm cách tách dòng ở `snp4.3:3.1`–`3.4` (xem bất định 6), cách hiểu `attā nirattā` (bất định 21) và cho thấy `niccheyya samuggahītaṁ` ở `snp4.3:6.2` được Sujato đọc là *adopted after judging among the teachings* (bất định 14). Chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.3`, `snp3.6`, `snp4.4`, `snp4.5` và các bài `mnd1`, `mnd4`, `mnd5`, `mnd7`, `mnd8`, `mnd12`, `cnd5`, `cnd6`, `cnd7`, `cnd9`, `cnd10`, `cnd11`, `cnd12`, `cnd14`, `cnd16`, `cnd21` (`mnd1`, `mnd7`, `mnd12` đang chờ vào nhánh chính).

  **Dùng lại tiền lệ.** Đã dò Pāli trùng nguyên dấu câu (bỏ thẻ in đậm, bỏ khoảng trắng thừa) với khoá đã dịch ngoài bài này: 157 khoá có tiền lệ, dùng lại 126, khác 31; đo thêm cách bỏ dấu câu và chữ hoa/thường: 208 khoá có tiền lệ, dùng lại 171, khác 37 (nguồn dùng lại nhiều nhất, đếm theo khoá: `mnd8`, `mnd12`, `mnd5`, `mnd4`, `mnd7`, `mnd1`, `snp4.3`, `cnd5`, `cnd9`). Các khoá khác tiền lệ, kèm lý do:
  - `16.1`, `16.2`, `17.1`, `20.22`, `25.1`, `25.2` (trùng `snp4.3:3.1`, `3.2`): giữ chữ của `snp4.3` nhưng tách lại dòng cho khớp Pāli (xem bất định 6);
  - `27.5`–`27.18`, `29.2`–`29.14`: chuỗi mười bốn phiền não dùng *giận dữ … hằn học … gièm pha … hơn thua … ganh tị … keo kiệt … giả dối … xảo trá … bướng bỉnh … hung hăng … ngã mạn … ngạo mạn … tự mãn … phóng dật* theo 7 tệp cnd/mnd/mn (`cnd6`, `cnd7`, `cnd11`, `mnd1`, `mnd8`, `mn7`, `mn8`); 6 khoá peyyāla của AN trùng Pāli nhưng dùng *sân giận … oán hận … khinh miệt … ngạo mạn …* (thuộc bộ khác, ngữ cảnh *abhiññāya … pahānāya*), không theo;
  - `31.2` (trùng `mnd5:16.2`): *thần túc* thay *như ý túc* — trong cnd và mnd *thần túc* 6 khoá so với *như ý túc* 2 khoá; toàn tầng *như ý túc* 126 khoá so với *thần túc* 16 khoá (đa số do `sn51`), nên ghi cả hai số; theo đa số gần nhất như `mnd4`;
  - `34.4`: dòng kệ theo `snp4.3:4.4`, không theo bản `vị ấy không còn cao ngạo ở bất cứ đâu trên đời` (1 khoá);
  - `50.3`: *Gột sạch được gọi là tuệ—* theo `mnd8:77.2`;
  - `52.4` (trùng `mnd8:77.18`): *Vị ấy là bậc đã rũ bỏ tham …* thay *Ngài là bậc …*, vì ở `mnd8` chủ ngữ là Đức Thế Tôn còn ở đây là bậc A-la-hán (`52.2`–`52.3`);
  - `52.7`: *Ở đời: …* theo `mnd1:30.1`, `mnd4:55.13` (khác *Đời:* ở 4 khoá cnd);
  - `55.11`: *các hương …* theo `mnd5:48.6` (*sắc, thanh, hương, vị, xúc*), khác *Đối với các mùi …*;
  - `21.9`: giữ chuỗi *hoặc là vị thông kinh, hoặc là vị trì luật …* theo `mnd7:32.7`, chỉ thêm *hoặc* ở đầu vì ở đây đó là mắt xích giữa các mục *hoặc …*.
  Đã dò **67 nhóm Pāli trùng nguyên byte trong chính bài** (84 khoá lặp thêm): 0 nhóm có bản Việt khác. Dò thêm sau khi bỏ dấu câu và chữ hoa/thường, bỏ thẻ in đậm: 82 nhóm (116 khoá lặp thêm), chỉ 2 nhóm có bản Việt khác ngoài dấu câu và chữ hoa/thường: `9.2`, `11.6`, `15.2` (*khi* chỉ thuộc dòng kệ, không thuộc lemma) và `42.2`, `44.6`, `48.2` (dòng kệ *được quyết định và nắm giữ giữa các pháp* theo `snp4.3:6.2`, còn lemma *sau khi quyết định và nắm giữ giữa các pháp* theo `mnd5`, xem bất định 14).

  **Thuật ngữ, kèm số đếm.** `titthiyā` → *ngoại đạo*, `sakāya diṭṭhiyā sakāya khantiyā sakāya ruciyā sakāya laddhiyā` → *kiến của mình, sự chấp nhận của mình, sở thích của mình, chủ trương của mình* (*chủ trương* 22 khoá ở mnd so với *tín điều* 5 khoá ở cnd; *sở thích* 6 khoá mnd so với *điều ưa thích* 3 khoá mnd và 5 khoá cnd), `ajjhāsaya` → *thiên hướng*, `adhippāya` → *ý hướng* (`cnd12:2.1`, `cnd19:26.1`). `titthiyā duṭṭhamanā …` → *tâm ác, tâm rất ác, tâm đối nghịch, tâm đối nghịch lại, tâm oán hận, tâm oán hận đáp lại, tâm phẫn nộ, tâm phẫn nộ đáp lại* (0 tiền lệ, xem bất định 2); `āhatacitto khilajāto` → *tâm oán hận và chai cứng* (7 khoá ở `dn33`, `dn34`, `mn16`), nên `āhatacittatā khilajātatā` ở `6.2` → *tâm oán hận … sự chai cứng của tâm*. `cetokhila` → *tâm chai cứng* (22 khoá ở `mn16`, `an9.7`) so với *tâm hoang vu* (6 khoá ở `dn33`, `dn34`); `khila` ở dòng kệ → *chướng ngại* theo `snp4.3:1.4`. `jantu` → *chúng sinh* (3 khoá: `mnd1:15.3`, `mnd5:4.10`, `cnd16:20.2`) so với *con người* (`mnd4:38.5`, 1 khoá) và *hữu tình* (`mnd12:113.5`, 1 khoá), nên `20.21` dùng *Chúng sinh*; `naro` → *Người nam* theo `mnd1:43.3`. `iti` ở `30.2` theo `cnd14:24.4` (*sự nối liền các từ …*). `Tasmā` ở lemma → *Do đó: vì thế, vì nguyên cớ ấy …* (6 khoá cnd/mnd, `cnd16`, `cnd20`, `cnd21`, `mnd5`) so với *Vì vậy: do đó …* (3 khoá, `mnd1`, `mnd12`). `asappurisa` → *người bất thiện* (84 trong 196 khoá có `asappuris-`, `mn110`) và `sappurisa` → *người thiện* (72 khoá), `ariya`/`anariya` → *bậc thánh*/*người phi thánh*, `bāla`/`paṇḍita` → *kẻ ngu*/*bậc trí*. `sīlabbata` (đi liền) → *giới luật và khổ hạnh*, riêng `sīlabbataparāmāso` → *giới cấm thủ* (`mn64:2.7`, `mnd4`). `dhutaṅga` → *hạnh đầu-đà* (`mil6.4.2`), tám hạnh theo `mnd7:32.7` (*hạnh từ chối thức ăn sau bữa*, *hạnh không bao giờ nằm*, *hạnh ngủ nơi chỗ trải sẵn*). `samādāna` → *sự thọ nhận* (nối với *đã thọ nhận* ở `17.5`); `cittaṁ paggaṇhāti padahati` → *nâng đỡ tâm, nỗ lực* (25 khoá, như `sn49.1-12`) so với *nâng tâm …* (26 khoá, như `dn33:1.11.10`). `caṅkama` → *đường kinh hành*, `vihāra` → *tịnh xá* (`thag3.2:2.2`). `kodho … pamādo` → mười bốn mục như trên; `kilesa` → *phiền não*, `duccarita` → *ác hạnh*, `daratha` → *bứt rứt*, `pariḷāha` → *nóng bức*, `santāpa` → *thiêu đốt*, `akusalābhisaṅkhāra` → *hành tạo tác bất thiện*. `ñāṇagginā daḍḍhā` và công thức *đã được đoạn trừ, nhổ tận gốc, làm lắng dịu, làm an tịnh, không thể sinh khởi nữa, bị lửa trí tuệ thiêu cháy* theo `mnd5:31.2`, `mnd4:67.4`. `dhono` → *bậc đã gột sạch*, `dhutañca dhotañca sandhotañca niddhotañca` → *đã được rũ bỏ, được rửa sạch, được gột rửa kỹ, được tẩy sạch hoàn toàn* theo `mnd8:77.5`–`77.19`; `Arahā imehi dhoneyyehi dhammehi upeto …` theo `mnd8:77.17`. `paññā` (danh sách ba mươi mục) theo `cnd5:30.2`. `kappa` → *tạo tác* (`mnd5:44.2`), `pakappanā`/`pakappitā` → *hư cấu* (`snp4.3:5.1`, `snp4.5:7.2`), `saṅkhata` → *đã được tạo tác*, `abhisaṅkhata` → *kết tạo*, `saṇṭhapita` → *an lập* (`mnd5:42.3`); `purekkhāra` → *sự đề cao* (`mnd5:49.2`, 2 khoá); `dhaja`, `keturu`, `ādhipateyya` → *cờ, biểu kỳ, chủ đạo* (`mnd5:49.7`). `ānisaṁsa` → *lợi ích* (`mnd5:10.4`–`10.24`), `diṭṭhadhammika`/`samparāyika` → *trong hiện tại*/*ở đời sau*. `tadaṅga` → *theo từng chi phần* (`ps2.10:14.1`, 3 khoá), `accanta` → *cứu cánh*, `sammuti` → *quy ước* (0 tiền lệ). `rūpasaññā paṭighasaññā nānattasaññā` → *sắc tưởng, tưởng đối ngại, tưởng sai biệt* (`mnd7:9.6`, `ps2.9:20.6`). `upayo`/`anūpayo` → *kẻ bị cuốn vào*/*bậc không bị cuốn vào* theo `snp4.3:8.1`–`8.2`, lemma `upayā` → *sự cuốn vào*. `rattoti vā … thāmagatoti vā` và `nerayikoti vā … nevasaññīnāsaññīti vā` theo `mnd5:44.8`, `44.11` (2 khoá mỗi chuỗi). `So vuṭṭhavāso ciṇṇacaraṇo gataddho gatadiso …` theo `mnd1:80.6`. `iddhipāda` → *thần túc*, `aṭṭhaṅgika magga` → *Thánh đạo tám chi* (10 khoá trong cnd/mnd), `phalakusalā nibbānakusalā` theo `mnd5:16.2`. `nevasaññānāsaññāyatana` → *Phi tưởng phi phi tưởng xứ* (quy ước 168 khoá / 62 tệp). `dvāsaṭṭhi diṭṭhigatāni` → *sáu mươi hai kiến chấp* (`mnd5:50.2`).

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `dvīhi kāraṇehi` 2 → *hai lý do* (`5.9`, `5.12`, `46.2`) rồi hai mục (`5.10`, `5.13` là *kārako … / atha vā vuccamāno …* 2/2; `46.3` 2/2); `pañca cetokhilā` 5 và `tayo khilā` 3 → *năm tâm chai cứng*, *ba chướng ngại* (`6.3`), rồi ba mục *rāga, dosa, moha khila* (`6.4`, 3/3); `aṭṭha dhutaṅgāni` 8 → *tám hạnh đầu-đà* (`17.12`), rồi 8 mục (`17.13`, 8/8); 15 nơi chốn ở `19.6`–`19.21` (`āsana` rồi `caṅkama, vihāra, aḍḍhayoga, pāsāda, hammiya, guhā, leṇa, kuṭi, kūṭāgāra, aṭṭa, māḷa, uddaṇḍa, upaṭṭhānasālā, maṇḍapa, rukkhamūla`, 15/15); 15 khoảng thời gian ở `20.4`–`20.18` (`majjhanhika, sāyanha, purebhatta, pacchābhatta, purima yāma, majjhima yāma, pacchima yāma, kāḷa, juṇha, vassa, hemanta, gimha, purima vayokhandha, majjhima vayokhandha, pacchima vayokhandha`, 15/15); 12 cơ sở ở `21.6`, `23.5`, `55.27` (`jāti … aññataraññatara vatthu`, 12/12; `30.8` chỉ nêu bốn mục đầu rồi `…pe…`); 5 mục ở `21.7`, `23.6` (5/5); 11 mục ở `21.9`, `23.7` (suttantika … yathāsanthatika, 11/11); 8 mục ở `21.10`, `23.8` (4 thiền + 4 xứ, 8/8); 13 mục *kusalā* ở `22.2`, `31.2` (13/13); `sattannaṁ dhammānaṁ` 7 → *bảy pháp* (`27.26`) rồi 7 mục (`27.27`, 7/7); 7 mục `sattussadā` ở `32.4` (7/7); 23 mục ở `27.2`–`27.24` (3 + 14 + 6) và ở `29.1`–`29.20` (23/23), 26 mục ở `50.6`–`50.26` (3 ác hạnh + 3 + 14 + 6; đều khớp từng khoá); 10 cặp `sammā`–`micchā` ở `51.1`–`51.10` (10/10); `dve pakappanā`, `dve purekkhārā`, `dve upayā` 2 → *hai* ở `36.2`, `37.2`, `53.1`, `56.2`, `60.2`, `61.2`, mỗi lần 2/2; `dve ānisaṁse` 2 (`38.4`, 2/2); `tisso santiyo` 3 → *ba sự an tịnh* (`39.2`, 3/3); 8 mục thiền ở `39.9`–`39.16` (8/8); 8 `santi` + 7 thuộc tính + 6 động từ ở `39.22` (8/8, 7/7, 6/6); 6 mục khó vượt ở `43.12` (6/6); 8 từ *niccheyya* ở `44.3` (8/8); 6 mục *aggāha* ở `44.4` (6/6); 6 tính chất + 5 động từ ở `44.5` (6/6, 5/5); 6 mục *satthā … magga* ở `46.6`–`46.11`, `46.13`, `46.19` (6/6 mỗi chỗ), hai chuỗi 6 mục *suddhi … parimutti* và *sujjhanti … parimuccanti* cùng 6 tính từ *hīnā … parittā* ở `46.11` (6/6 mỗi chuỗi); `māno` ở `55.1`–`55.27`: 1 (1/1), 2 (`attukkaṁsana`, `paravambhana`, 2/2), 3 (3/3), 4 (4/4), 5 (`rūpa, sadda, gandha, rasa, phoṭṭhabba`, 5/5), 6 (`cakkhu … mano`, 6/6), 7 (7/7), 8 (4 cặp, 8/8), 9 (3 × 3, 9/9), 10 (xem bất định 19); 14 mục ở `54.5` (14/14 sau khi tách `māyā` ra làm đầu mục); 4 lần *mā maṁ jaññā* ở `54.4` (4/4). Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi` làm số; `dvāsaṭṭhi` 62 → *sáu mươi hai* (`36.11`, `39.19`, `44.2`, `63.1`, là con số có sẵn, không có phép tính); `ariyena aṭṭhaṅgikena maggena` 8 → *Thánh đạo tám chi* (`52.1`); không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `4.1` `saccamanā saccasaññino bhūtamanā …`: dịch sát từng chữ (*có tâm chân thật, có tưởng chân thật, có tâm có thật …*); lời giải nói đây là những người tin theo các ngoại đạo ấy, nên *tâm chân thật* có nghĩa gần *tâm cho là thật*; giữ nghĩa đen, không thêm.
  2. `3.1` `duṭṭhamanā paduṭṭhamanā viruddhamanā paṭiviruddhamanā āhatamanā paccāhatamanā āghātitamanā paccāghātitamanā`: 0 tiền lệ nguyên chuỗi; *pa-/paṭi-/pacca-* hiểu là tăng cường hoặc đáp lại, chọn *rất ác*, *đối nghịch lại*, *đáp lại*; `āghāta` theo `dn26:20.3` *thù hận, phẫn nộ*.
  3. `5.9`–`5.14` `kārako`/`akārako` và `Akārakomhīti`: Pāli không có nháy ở `5.11`, `5.14` nên không đặt nháy; dịch *Tôi không phải là kẻ đã làm:* theo kiểu lemma (cùng cách ghi ở `mnd1`); ai là *kārako* (kẻ đã gây ra điều bị nói đến) chỉ suy ra từ ngữ cảnh, và `Akārakomhī` có thể là câu mà người ấy tự nhủ.
  4. `9.3`, `12.1`, `12.5`, `15.3` `sayaṁ samattāni pakubbamāno`: dòng kệ theo `snp4.3:2.3` (*tự mình tạo tác những công hạnh của mình*), trong khi lời giải `12.2`–`12.4` là `samattaṁ karoti paripuṇṇaṁ karoti anomaṁ karoti aggaṁ … pavaraṁ karoti` và được dịch *xem là hoàn bị, xem là viên mãn, xem là không thiếu sót, xem là cao nhất …* theo `mnd5:4.3`–`4.9`; hai cách đọc chưa thống nhất.
  5. `6.2`–`6.4` `khila`: *chướng ngại* ở dòng kệ (`snp4.3:1.4`) nhưng `khilajātatā` → *chai cứng* (theo `mn16`, `dn33`), cùng một gốc từ; `cetokhila` *tâm chai cứng* (22 khoá) so với *tâm hoang vu* (6 khoá).
  6. `16.1`–`16.4`, `17.1`, `20.22`, `25.1`–`25.4`: `snp4.3:3.1`–`3.2` ghi *Kẻ nào không được hỏi mà tự nói / về giới luật và khổ hạnh của chính mình cho người khác,* trong khi Pāli `3.1` là `Yo attano sīlavatāni jantu` và `3.2` là `Anānupuṭṭhova paresa pāva`; bản Sujato của `snp4.3:3.1`–`3.2` cũng tách *Some personages, unasked, tell others / of their own precepts and vows*. Giữ nguyên chữ nhưng tách lại: `16.1` *Kẻ nào, về giới luật và khổ hạnh của chính mình,* và `16.2` *không được hỏi mà tự nói với người khác;*. Không sửa `snp4.3`; báo để người biên tập quyết.
  7. `18.1` `Nāsissaṁ na pivissāmi`: dịch *Tôi sẽ không ăn, sẽ không uống,* (`nāsissaṁ` = *na asissaṁ*, không ăn); `thag3.2:2.1` và `thag4.12:3.1` ghi *Tôi không uống nước trong đó,* (bỏ mất *ăn*, thêm *nước trong đó*); bản Sujato của `thag3.2` ghi *eat or drink*. Lỗi ngoài lát, báo chứ không sửa.
  8. `19.9`–`19.20` tên các nơi chốn: 0 tiền lệ trong tầng; giữ nguyên Pāli `aḍḍhayoga`, `māḷa`, `uddaṇḍa` (nghĩa chưa phân xử); `pāsāda` → *lầu*, `hammiya` → *nhà mái bằng*, `leṇa` → *nơi trú ẩn*, `kuṭi` → *chòi*, `kūṭāgāra` → *nhà mái nhọn*, `aṭṭa` → *chòi canh*, `upaṭṭhānasālā` → *nhà hội chúng* (`dn16:1.6.2`), `maṇḍapa` → *mái che*; `11.3` `rathayāna` → *cỗ xe* (đi cạnh *xe voi*, *xe ngựa*, … *xe lừa*, `mnd1:14.5` không có mục này).
  9. `21.3` `apasādito` → *chưa được khẩn nài*: 0 tiền lệ, nghĩa chưa phân xử; `apuṭṭho apucchito ayācito anajjhesito` theo nghĩa thường.
  10. `26.2`, `30.1`, `30.3`, `34.2` `itihanti`: dòng kệ theo `snp4.3:4.2` (*không tự phô … ta đây …*), bỏ cặp nháy quanh *ta đây* vì Pāli không có nháy; `30.2` giải `iti` chỉ là tiểu từ, nên `30.3` giữ `itihanti.` nguyên văn Pāli (như `cnd14:24.5` giữ `iti.`); bản Sujato của `snp4.3:4.2` ghi *thus am I*.
  11. `26.4`, `32.1`–`32.8`, `34.4` `ussada`: dòng kệ theo `snp4.3:4.4` (*sự cao ngạo*), lời giải `32.3`–`32.4` dịch cùng chữ (*sự cao ngạo do tham, … do nghiệp*); nghĩa đen của `ussada` là *chất chứa, dồn nén*, nên *sự cao ngạo do nghiệp / do phiền não* nghe gượng; 0 tiền lệ khác; để người biên tập quyết.
  12. `27.2`–`27.4`, `27.24` `samitattā`, `santattā`: dùng chuỗi *làm yên lặng, làm an hòa, làm lắng dịu, làm tiêu mòn, làm tịch tĩnh, làm biến mất, làm dịu xuống* theo `cnd7:60.2`; `samitattā` ở `27.2` → *làm an hòa*; `29.1`–`29.20` `nibbāpitattā` → *dập tắt* theo `cnd6:15.2`.
  13. `36.6`–`36.9`, `39.22` `saṅkhata`: dịch *đã được tạo tác* ở mọi chỗ cho khớp lemma `36.6` (kể cả trong chuỗi *aniccaṁ saṅkhataṁ paṭiccasamuppannaṁ …*, nơi nhiều bài dùng *hữu vi*, `dn15:29.1`); tám cách gọi an tịnh ở `39.22` (`kuppa, pakuppa, erita, samerita, calita, ghaṭṭita, kappita, pakappita`) → *chưa vững chắc, hoàn toàn chưa vững chắc, bị dao động, bị dao động hoàn toàn, bị lay chuyển, bị va chạm, bị tạo tác, bị hư cấu*: 0 tiền lệ nguyên chuỗi, nghĩa riêng của `erita` và `samerita` chưa phân xử.
  14. `42.2`, `44.1`, `44.3`, `44.6`, `48.2` `niccheyya samuggahītaṁ`: dòng kệ theo `snp4.3:6.2` (*được quyết định và nắm giữ giữa các pháp*) nhưng lemma `44.1`, `44.3`, `44.6` theo `mnd5` (*sau khi quyết định …*, đúng với dạng bất biến từ `niccheyya`, lời giải `44.3` là các `-itvā`); `snp4.5` dịch cùng dòng kệ là *không có pháp nào được nắm giữ sau khi quyết định*; chưa thống nhất.
  15. `43.12` `na hi svātivattā durativattā duttarā duppatarā dussamatikkamā dubbinivattā`: sáu bậc khó khăn dịch *thật không dễ vượt qua, khó vượt khỏi, khó vượt sang, khó vượt hẳn, khó vượt thoát, khó quay lại*; 0 tiền lệ, sắc thái từng từ chưa phân xử.
  16. `46.3`, `46.15`–`46.17` `anabhisambhuṇanto` → *không thành tựu được*: 0 tiền lệ; có thể hiểu là *không theo nổi*, *không đạt được*; `46.5`–`46.11` `vicchindeti` → *bác bỏ* (cắt đứt, làm lung lay uy tín); `46.11` `natthettha sujjhanti …` → *ở đây không có người được thanh tịnh …* (khác `mnd8:4.3` *ở đó người ta không được thanh tịnh*, vì Pāli ở đây là `natthettha`, không phải `na tattha`).
  17. `53.5` `bhavābhavesu`: dấu phẩy của Pāli chia chuỗi *kammabhave punabbhave kāmabhave / kammabhave kāmabhave punabbhave rūpabhave / …*, dịch sát từng chỗ bằng *trong …*; 0 tiền lệ nguyên chuỗi; `upapatti` → *sự tái sinh*, `paṭisandhi` → *sự tái tục*, `attabhāvābhinibbatti` → *sự phát sinh của tự thân*.
  18. `49.3`, `54.1`–`54.5`, `55.30`–`55.32`, `58.3` `māyā`: *hư vọng* theo `snp4.3:7.3` (dòng kệ và lemma), nhưng ở các chuỗi mười bốn phiền não `māyā` là *giả dối*; `accasarā`, `nikiraṇā`, `vocchādanā`, `anuttānikamma`, `anāvikamma` (0 tiền lệ) dịch *sự lừa lọc*, *sự quanh co*, *sự che lấp*, *việc làm không minh bạch*, *việc làm không rõ ràng*: nghĩa riêng từng từ chưa phân xử.
  19. `55.21` bảy loại mạn: *mạn, quá mạn, mạn quá mạn, ty liệt mạn, tăng thượng mạn, ngã mạn, tà mạn* (cách gọi quen thuộc của Phật học Việt Nam; 0 tiền lệ trong tầng, và *ngã mạn* ở đây là `asmimāno` trong khi `māno` ở dòng kệ và các chuỗi khác cũng là *ngã mạn*); `55.26`–`55.27` `dasavidhena māno` ghi *mười* nhưng Pāli liệt kê 12 cơ sở (`jāti … aññataraññatara vatthu`); dịch đúng như Pāli ghi, không sửa số; `55.28` `maññanā maññitattaṁ unnati unnāmo dhajo sampaggāho ketukamyatā` → *sự tự cho mình, trạng thái tự cho mình, sự ngẩng cao, sự vươn lên, cờ hiệu, sự giương cao, sự ham muốn dựng cờ của tâm*: 0 tiền lệ.
  20. `56.7`, `56.10`, `56.12` `kena gaccheyya`: dịch sát *đi bằng … nào* theo `snp4.3:7.4`; `61.7`, `61.10`, `61.13` `kena vadeyya`: *tranh luận … bằng … nào*; hai nghĩa của `kena` (*bằng cái gì*, *về điều gì*) đều có thể.
  21. `59.3`, `62.1`–`62.10`, `65.3` `attā nirattā`: dòng kệ và lemma theo `snp4.3:8.3` (*bản ngã và phi bản ngã*), còn lời giải `62.4`–`62.5` nói *nắm giữ* và *buông bỏ* (khớp cách đọc *picking up and putting down* của Sujato ở `snp4.3:8.3`); cả hai cách đọc cùng được lời giải `62.2`–`62.5` hỗ trợ, giữ cả hai ở lemma.
