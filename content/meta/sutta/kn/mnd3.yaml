úng sinh* (3 khoá: `mnd1:15.3` …)» (`mnd1:15.3` nay là «Của con người»); bất định 4 «dòng kệ theo `snp4.3:2.3` (*tự mình tạo tác những công hạnh của mình*)», bất định 5 «*chướng ngại* ở dòng kệ», bất định 20 «*tranh luận … bằng … nào*», bất định 21 «*bản ngã và phi bản ngã*» (đều đã sửa ở lượt 2026-10-14); bất định 18 «`māyā`: *hư vọng*» (nay «giả dối», xem trên); «không có bản nguyên bài độc lập» ở lượt rà 2026-10-15 và «Không có bản Anh hay bản Việt độc lập khác» ở lượt 2026-10-14 (nay đã đối chiếu bản Việt của Bhikkhu Indacanda); «`50.3`: *Gột sạch được gọi là tuệ—* theo `mnd8:77.2`» (nay «Sự gột sạch …», như chính `mnd8:77.2` hiện nay).
