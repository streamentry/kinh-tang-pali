 (5) `49.4`, `56.1`, `56.13`, `58.4` `sa kena gaccheyya anūpayo so`: *đi bằng con đường nào?* → *có thể đi bằng cái gì?* (`kena` là *bằng cái gì*, không có `con đường`; `56.7` đã dịch `kena rāgena gaccheyya` là *đi bằng tham nào*). (6) `59.3`, `62.1`, `62.3`, `62.5`, `62.10`, `65.3` `attā nirattā`: *phi bản ngã* → *cái bị buông bỏ*; lời giải `62.3`/`62.5` là `nirattā ti ucchedadiṭṭhi natthi` và `muñcitabbaṁ natthi`, và `46.3` dịch `nirassati` là *buông bỏ*; *phi bản ngã* dễ đọc thành `anattā` là điều Pāli không nói. (7) `18.3` `napi passaṁ nipātessaṁ`: bỏ chữ *nữa* không có trong Pāli. BẤT ĐỊNH 10 (giữ bản dự án, không đưa vào thân kinh): `26.4`, `32.1`, `32.3`, `32.8`, `34.4` `ussada`: *cao ngạo* (khớp `anussada` *kiêu ngạo* ở dhp400, iti97) so với *tích tụ*; nhưng bảy `ussada` ở `32.4` gồm `kammussado` và `rāgussado`, nên *sự cao ngạo do nghiệp* nghe không ổn, nghĩa đúng có thể là *sự trội lên/dâng lên*; không phân xử được bằng Pāli ghim; `28.1` `pajjena katena attanā`: *nhờ đạo lộ tự mình đã đi* so với *với bản thân đã được tạo thành bằng con đường*, cùng cách dịch ở snp3.6 và cnd5; `26.2`, `30.1`, `30.12`, `34.2` `itihanti`: *ta đây* là cách đọc giải thích (lời giải `30.2` chỉ coi `iti` là tiểu từ nối), không đổi nghĩa chung của câu. Ngoài ra `12.2`–`12.4` vẫn dịch `karoti` là *xem là* (bản mù dịch *làm cho*), không sửa vì chưa chứng minh được là sai. Review đối kháng riêng toàn bài (565 khoá, đọc cả phần lời giải): đếm lại các danh sách bằng Pāli (bảy `ussada` ở `32.4`, bảy pháp bị phá vỡ ở `27.27`, tám hạnh đầu-đà ở `17.12`–`17.13`, sáu mươi hai kiến chấp, các nhóm `māna` từ một đến mười ở `55.1`–`55.27`, mười nẻo ở `56.11`, 14 từ của `māyā` ở `54.5`), 103 khoá có Pāli trùng nguyên văn ở bài khác (13 khoá bản Việt khác, đều khác diễn đạt hoặc khác phủ định theo ngữ cảnh), 52 nhóm Pāli trùng trong bài (0 nhóm bản Việt khác), nháy kép và nháy đơn khớp Pāli từng khoá, dấu lược `…pe…` đúng một `…`. Ghi nhận ngoài bài: các kệ chung với snp4.3 (`2.3`, `1.4`, `5.4`, `8.2`, `8.3`) còn ở dạng cũ *công hạnh*, *chướng ngại*, *dựa vào sự an tịnh chưa vững chắc*, *tranh luận với bậc không bị cuốn vào*, *phi bản ngã*; mnd14 `42.4`–`46.6` còn *phi bản ngã*, trong khi mnd10 `121.3`–`123.3` dùng *cái bị buông bỏ*. Không có bản Anh hay bản Việt độc lập khác; chỉ có một lần dịch lại cùng họ công cụ nên `triangulation` không vượt 8,0.

