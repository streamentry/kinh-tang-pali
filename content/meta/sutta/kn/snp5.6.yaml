notes: |-
  Lô G3 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): kiểm lại lỗi lặp bằng Pāli đã ghim; sửa
  snp5.6:4.4 thêm "như vậy" cho `evaṁ`, khớp cnd9.

  Quyết định hội đồng biên tập 2026-10-16: A5 — snp5.6:4.3 (`abhijānamāno` = thắng tri, không phải liễu tri (họ `pariññā`)); B1 — snp5.6:6.5, snp5.6:7.4 (`visattikā` = sự vướng mắc (ở đời); `tare` = có thể vượt qua).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 2): sửa 5.2, 6.4, 7.3 (`vijaññaṁ`/`viditvā` "liễu tri" → "biết rõ": DPD `vijaññaṁ` "I myself may comprehend", `viditvā` "having known"; A5/B9 dành "liễu tri" cho họ `pariññā`; khớp cnd9:36.2, 42.4, 49.3); sửa 7.4 ("vị ấy có thể vượt qua" → "con có thể vượt qua": kệ của Dhotaka mở bằng `Tañcāhaṁ abhinandāmi`, lời giải cnd9:53.6 `sato tareyyaṁ` ngôi 1, khớp cnd9:49.4; Sujato đọc "one"); giữ 6.5 (lời Đức Phật, cnd9:47.5 `tareyya` ngôi 3).
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 5.3–5.4 (sai nghĩa từ và lệch ranh khoá: 'abyāpajjamāno' dịch 'không dao động' và đặt ở 5.4, trong khi 5.3 mang 'sống ngay tại đây' của 5.4; lời giải cnd9:39.1–39.6 'na pajjati na gaṇhati na bajjhati … na paṭihaññati', DPD 'unhindered; unobstructed', Sujato 'unobstructed as space itself'; 'yathāhaṁ … careyyaṁ' là mệnh đề mục đích 'để con … có thể sống' theo cnd9:36.3–36.4, cnd2:34.3–34.4).
