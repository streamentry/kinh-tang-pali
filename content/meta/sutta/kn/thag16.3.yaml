    · `ātāpī` → nhiệt tâm (492 khoá chứa `ātāpī`/`ātāpino` ở tầng; đa số). `dhamma` (`1.2`, `2.3`, `5.3`) → Pháp, lời dạy; `iti86:3.2` dịch pháp viết thường (1 khoá), không theo vì ở đây Pāli đối tượng là bài giảng của một vị thầy. `samaṇabrāhmaṇa` → sa-môn, bà-la-môn (165 khoá dạng này so 14 khoá sa-môn và bà-la-môn, chỉ đo ở kn và sn).
    · `pāraṅgato` → đã đến bờ kia (`thag15.1:8.5`, `thag15.2:2.2`; `mn143:17.17` dịch đã qua bờ bên kia). `amatogadha` → bến bờ bất tử (`mn98:11.65`, `thag2.24:2.2`; đo lại 106 khoá chứa `amatogadh-` ở tầng: nhập vào bất tử 54, dựa vào chỗ không chết, chìm đắm trong vị bất tử, đã đạt đến chiều sâu bất tử `snp3.9:47.3`… không có đa số rõ cho dạng động từ `patto`/`anuppatta`; hai khoá cùng khuôn `mn98:11.65`/`thag16.3:2.2` dịch bến bờ bất tử nên giữ; Sujato dịch freedom from death as its objective; Pāli là `amata` + `ogadha`, độ sâu/chỗ thả neo).
    · `pāsa` → thòng lọng. `Vepacitti asura` → A-tu-la Vepacitti (`sn11.5` và `sn2.9` dịch vua A-tu-la cho `asurindo`; ở đây Pāli chỉ nói `asuro`). `Mahinda` giữ nguyên, không dịch thành Sakka hay Đế Thích (xem bất định). `bandha` → trói; `muñcaṁ` → cởi trói. `sambodhi` → giác ngộ. `pabhaṅgu` → dễ vỡ (`sn5.4:5.2`, `sn22.32`, 34 khoá). `jarāmaccu` → già và chết. `pavāhaka`/`pavāhana` → gột sạch (cả `5.4`, `12.2`, `22.4`).
    · `vicikicchā` → nghi hoặc (111 khoá, so nghi ngờ 7, do dự 10, hoài nghi 6). `kaṅkhā` → phân vân. `ganthita` (`6.1`) → bị thắt nút; `gantha` (`22.3`) → nút thắt. Tầng cho `gantha` nhiều dạng (`sn1.20:25.3` trói buộc, `dn33:1.11.169` kết thân); chọn nút thắt vì Pāli dùng cùng căn `gantha-` ở cả hai chỗ (`6.1`, `22.3`) và hình ảnh thắt nút nhất quán. `sārambha` → hung hăng (`mn3:9-15.5`, `mn7:4.22`; 43 khoá chứa `sārambh`). `kodha` → giận dữ (lượt cải thiện 2026-10-11: trong 294 khoá chứa dạng `kodho`/`kodhaṁ`/`kodhena`… ở tầng, bản Việt có chữ giận ở 198, sân ở 136, phẫn nộ ở 28; ở thag gần nhất là giận dữ `thag17.1:4.1`, `thag6.12:1.1`, `thag6.12:5.1`; trước đó dùng phẫn nộ là thiểu số). `māna` → kiêu mạn (3, so ngã mạn 3, mạn 13). `abhijappā` → tham cầu (`mn128:24.3`). `taṇhā` → tham ái (27, so ái 34). `saṅkappa` → tư duy (20, so tư tưởng 6, ý nghĩ 3). `anudiṭṭhi` → tùy kiến (đo lại: 154 khoá chứa dạng `-anudiṭṭhi-` ở tầng, bản Việt có tùy kiến ở 55, kiến giải ở 22, kiến chấp ở 15, nên tùy kiến có tiền lệ đáng kể, không phải chữ lạ; xem bất định).
    · `cirarattaṁ` (`1.1`) → suốt thời gian dài (`thag21.1:11.4`, `thag21.1:12.3`, `ps1.1:560.15`), đi cùng `vata` → than ôi như `thag4.6:4.1` (`Cirasaṅkiliṭṭhaṁ vata maṁ` dịch Than ôi, từ lâu…); bản cũ Lâu dài thay đọc `cirarattaṁ vata` như câu cảm thán về độ dài, lệch vai trò trạng ngữ của `cirarattaṁ`. `22.2` `cirarattamadhiṭṭhitaṁ` giữ từ lâu vì ghép đôi với `22.1` (`mn98:12.5`), `adhiṭṭhita` → chiếm giữ (`thag19.1:53.1` chi phối, chiếm ngự).
    · `thaddha` (`6.3`) → bướng bỉnh (36 khoá chứa `thaddh-`: bướng bỉnh 14, cứng cỏi 8, cứng nhắc 8, cứng đầu 3; cứng rắn 0 tiền lệ và mang sắc thái tích cực, nên bỏ).
    · `chaphassāyatana` → sáu xúc xứ (`dn1:3.72.1`, `mn102:25.2`, `mn105:28.1`). `tekiccha` → thầy thuốc (tầng chỉ có dạng phủ định `atekiccha` dịch không thể cứu chữa). `salla` → mũi tên (5 khoá kn). `visadosa` → nọc độc. `dhammapati` → chủ tể của Pháp. `rahada` → hồ nước. `māyā`, `usūyā` → xảo trá, ganh tị (`snp2.2:7.2` dịch đúng cặp này). `thinamiddha` → hôn trầm và buồn ngủ (183 khoá, bản chuẩn của tầng; ở thân kệ viết hôn trầm và buồn ngủ để khớp). `uddhacca` → xao động (85, so trạo cử 26). `saṁyojana` → kiết sử. `kuddiṭṭhi` → tà kiến (0 tiền lệ cho dạng này; `micchādiṭṭhi` dịch tà kiến ở khắp tầng). `vāhā` → dòng lũ (phân biệt với `sota` → dòng chảy: `sotā` dịch dòng chảy 7, dòng 8 ở kn; `snp5.2:3.1`). `lata` → dây leo. `manomaya` → do ý tạo (`dn10:2.23.2`, `dn1:2.2.3`, 72 khoá). `satthā` → bậc Đạo Sư (71, so Thầy 35). `tāṇa` → nơi che chở (5 khoá). `isisaṅgha` → chúng ẩn sĩ (`mn143:17.4`, `mn143:19.5`). `sopāṇa` → chiếc thang. `sāra` (`dhammasāramaya`) → cốt lõi. `satipaṭṭhāna` → niệm xứ. `sakkāyābhirata` → ưa thích hữu thân (`an6.14:3.4`, `an6.15:2.8`; `iti93:4.4` dịch vui thích thân kiến; đo chung `sakkāya` toàn tầng: hữu thân 70, thân kiến 90 nhưng phần lớn là `sakkāyadiṭṭhi`; chọn theo hai khoá cùng hợp từ `-abhirata`). `pajā` → chúng sinh (9, so loài người 7). `attānaṁ` → chính mình (13, so bản thân 7, tự ngã 1). `bhavanetti` → sợi dây dẫn đến hữu (`dn1:3.73.1`, `dn16:2.3.8`, `mn116:6.3`). `tittha` → bến đò (hình ảnh bến thuyền với `nāvā`). `Paṭhamavagga` → Phẩm Thứ Nhất (85 khoá `0.3` dạng này ở thag). `0.4` theo khuôn Kinh Kệ Của Trưởng Lão X. `22.5` theo khuôn `… Trưởng lão X ….`.

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · (a) `7.2` `dve ca pannarasāyutaṁ`: đúng chữ là dve (2) và pannarasa (15) và `-āyutaṁ` (gắn, buộc); với `ca` chữ Pāli đọc trần có thể là 2 và 15 (17) hoặc hai lần 15 (30). Lượt cải thiện 2026-10-11: đọc thêm bản Việt nguyên bài của sc-data (chỉ để hiểu cách đọc, không chép câu chữ; tác giả theo chân trang tệp là Bhikkhu Indacanda, không phải Hòa thượng Thích Minh Châu) thì bản ấy cũng đọc hai lần mười lăm (tức ba mươi), trùng với Sujato (twice-fifteen). Hai cách đọc hiện đại độc lập cùng chọn 30 nên con số trong bản Việt (hai lần mười lăm) có căn cứ kiểm lại được trong nguồn đã ghim; chỗ còn bất định là 30 cái gì: Pāli không nêu danh từ, Sujato hiểu là xương sườn, bản Việt nguyên bài thêm chú giải về tà kiến mà root không có; bản dịch không đưa vật gì vào, để nguyên con số (`sn11.17:2.4` cho thấy `pannarasa` là số 15 theo nghĩa số đếm, không giúp phân xử 17/30). Một khoá duy nhất; nếu cần đổi, chỉ sửa khoá này.
    · (b) `10.3` `Nānārajjena satthena`: hapax (toàn Pāli ghim chỉ xuất hiện đúng một lần, ở đây). Bản cũ ghi que dò dựa trên một chú thích của bản Anh PTS mà kho này không có để kiểm lại, nên lượt cải thiện 2026-10-11 gỡ lập luận đó và gỡ chữ que dò khỏi thân kinh. Bằng chứng kiểm được: Sujato dịch without a lance or some other blade (phủ định ngược, đọc thành vật cụ thể); bản Việt nguyên bài của sc-data đọc `nānā-` như đủ loại vật dụng (cũng không phải que dò). Hai cách đọc đã xuất bản không khớp nhau và không ai đủ căn cứ để chọn. Tôi dịch theo hình thái nhìn thấy được của từ (`nānā` đủ loại) và theo vị trí trong hàng dụng cụ: bằng đủ loại dụng cụ hay bằng dao, hay bằng cách nào khác (nằm dưới lời phủ định `Taṁ na passāmi`); nghĩa chung các cách đọc giống nhau (không có thầy thuốc nào làm được), chi tiết dụng cụ là chỗ chưa phân xử. `10.4` `vicikicchitaṁ` dịch nỗi nghi hoặc này, giữ đồng vị với mũi tên của `10.2` như Sujato (dart of doubt) mà không viết mũi tên nghi hoặc.
    · (c) `6.3` `Kodhappattamanatthaddhaṁ`: `mana` có thể là `māna` (kiêu mạn, rút ngắn vì vần) hoặc `mano` (tâm). Sujato đọc mind (stiff as a mind beset by anger) và bản Việt nguyên bài của sc-data cũng đọc là tâm (đọc để hiểu, không chép), nên hai cách đọc hiện đại nghiêng về `mano`. Ngược lại hợp từ `mānathaddha`/`mānatthaddha` có thật trong Pāli ghim (`dn4:8.17` dịch kiêu căng; `mn116:6.35` là tên một vị Phật Độc Giác nên chỉ chứng minh hợp từ tồn tại) và `kodha`/`māna` đi cặp trong danh sách phiền não. Tôi giữ kiêu mạn; hai cách đọc đều có nghĩa, chưa phân xử được. Lượt cải thiện chỉ sửa hai chữ quanh đó: phẫn nộ → giận dữ, cứng rắn → bướng bỉnh (xem thuật ngữ).
    · (d) `8.2` `saṅkappaparatejitaṁ`: không rõ `para` là tiếp đầu ngữ nghĩa thêm nữa/hơn, hay là người khác, hay là vế sau. Sujato đọc memories and intentions (thêm chữ memories mà Pāli không có). Tôi dịch bị tư duy mài sắc thêm, giữ `para` thành chữ thêm; bất định. `8.1` `anudiṭṭhi`: đọc tùy kiến (kiến giải theo sau, đi kèm); `dn1:3.71.12` dịch kiến giải cho cả hợp từ; tôi giữ tiền tố `anu-` nên chữ tùy kiến lạ với người đọc.
    · (e) `19.3`–`19.4` `Yaṁ taṁ pubbe amaññissaṁ, sakkāyābhirataṁ pajaṁ`: cú pháp hai vế (đại từ quan hệ `yaṁ taṁ` rồi đồng vị `pajaṁ`) chấp nhận nhiều cách đọc: những người ưa thích hữu thân mà trước kia tôi từng nghĩ tới, hay điều trước kia tôi quan niệm (mañña) chính là chúng sinh ưa thích hữu thân. Sujato dịch as I had obsessed over (đã quá bận tâm). Lượt cải thiện 2026-10-11: bản Việt nguyên bài của sc-data đọc cùng cấu trúc với bản của tôi (xem xét lại điều đã quan niệm trước đây, tức loài người ưa thích bản thân) nên cách đọc của tôi không đơn độc; Sujato vẫn khác. Tôi dịch điều mà trước kia tôi từng nghĩ tới—chúng sinh ưa thích hữu thân (dấu gạch ngang giữ hai vế đồng vị). `19.2` `paccavekkhisaṁ` → xem xét lại (Sujato checked back down).
    · `3.3` `Mahindapāsena`: Mahinda ở đây thường được hiểu là Sakka (Đế Thích) vì Vepacitti bị Sakka trói (`sn11.4:1.9`, `sn11.5`), nhưng Pāli không nói tên Sakka, nên giữ Mahinda; Sujato cũng giữ Mahinda. `3.1` `Antovaṅkagato`: vaṅka là lưỡi câu; dịch bị mắc lưỡi câu ở bên trong (Sujato hooked inside).
    · `16.1` `bhaddante`: đọc là lời gọi tôn xưng (thưa Tôn giả, Sujato Venerable sir); nếu đọc `bhaddaṁ te` (chúc phúc) thì nghĩa đổi nhẹ. Không có tiền lệ trực tiếp trong tầng.
    · `18.1` `sugataṁ`: có thể chỉ chiếc thang tốt đẹp (đọc tính từ) hoặc chơi chữ gợi Sugata (Đức Phật). Tôi đọc tính từ tốt đẹp; Sujato bỏ qua chữ này (strong, simple ladder).
    · `9.2`–`9.4` `paccati`, `sarati`: nung nấu, lan chạy (nghĩa đen động từ); chủ ngữ ngầm hiểu là cái mũi tên/cái thuộc về tôi, Pāli không nêu. Sujato: burns, heads. Không có tiền lệ.
    · `7.3`–`7.4` `yadi tiṭṭhati`: `yadi` có thể là nếu, hay chăng. Tôi dịch đâm xuyên rồi mà vẫn đứng đó, bỏ chữ nếu để câu không điều kiện; tầng không có tiền lệ cho dạng này.
    · Chủ ngữ ngầm của `6.1`–`7.4`: các tính ngữ (bị thắt nút, gắn với, khởi lên từ…) đều là danh từ trung tính đối cách đi với `Passa orasikaṁ bāḷhaṁ`; bản Việt để nó ngầm (nó) đến `7.3`, không thêm chữ mũi tên vào `6.x`, khác Sujato (chèn the arrow of covetousness ở `6.4`). Chỗ này giữ nghĩa nhưng câu Việt dài và khó đọc.
    · `14.3` `kuddiṭṭhiṁ`: Pāli chỉ có danh từ trừu tượng `kuddiṭṭhi` (tà kiến) ở đối cách, toàn Pāli ghim chỉ có một lần dạng này (`mil5.1.1:18.11` có `kudiṭṭhī` ở số nhiều, không phải đối cách số ít). Bản Việt viết người có tà kiến, thêm chữ người; Sujato (a person with bad views) và bản Việt nguyên bài của sc-data (kẻ có tà kiến) đều đọc như vậy, nên chữ người có hai cách đọc độc lập đỡ, nhưng vẫn là một chữ do người dịch bổ sung cho `vahanti` có tân ngữ. `vāhā` → dòng lũ (bản Việt nguyên bài cũng đọc là dòng chảy; Sujato đọc winds) là bất định nhỏ, không đổi nghĩa chung.
    · `12.1`–`12.4` (modality): `dassaye` là cách thức nguyện/khả năng (optative), không phải tương lai; lượt cải thiện 2026-10-11 đổi sẽ chỉ thành có thể chỉ (Sujato he would show; bản Việt nguyên bài cũng có thể). `12.1` `hi so seṭṭho` không có động từ, giữ là, câu hỏi `11.4` mở ra giả định mà `12.x` đáp lại; Sujato dịch would be nhưng chưa đủ căn cứ để đổi.
    · Phạm vi bất định không đổi so với lượt trước: `6.1`–`7.4` chủ ngữ ngầm, `8.2` `para`, `10.3` hapax `nānārajja`, `6.3` `mana`.

  LƯỢT CẢI THIỆN 2026-10-11 (đọc đối kháng lại cả 93 cặp Pāli↔Việt; 4 khoá đổi trên 93).
    · `1.1` (clarity + terminology): Lâu dài thay, tôi nhiệt tâm → Suốt thời gian dài, than ôi, tôi nhiệt tâm. Lý do: `cirarattaṁ` là trạng ngữ thời gian, `vata` là tiếng than; tiền lệ `thag21.1:11.4`, `thag21.1:12.3`, `ps1.1:560.15` (suốt thời gian dài) và `thag4.6:4.1` (Than ôi, từ lâu…). Điểm: `vietnamese_clarity` 8.6 → 8.7.
    · `6.3` (terminology): đã rơi vào phẫn nộ, cứng rắn vì kiêu mạn → đã rơi vào giận dữ, bướng bỉnh vì kiêu mạn. Lý do: giận 198/294 so phẫn nộ 28/294 cho `kodha`; bướng bỉnh 14/36 cho `thaddha`, cứng rắn 0/36 và sai sắc thái (khen). Điểm: `terminology` 9.0 → 9.1.
    · `10.3` (accuracy/provenance): bằng que dò hay bằng dao → bằng đủ loại dụng cụ hay bằng dao. Lý do: que dò dựa trên chú thích bản Anh PTS không kiểm lại được từ nguồn đã ghim; hapax `nānārajja` giờ dịch theo hình thái nhìn thấy được và ghi bất định ở (b). Không đổi điểm (không làm tăng độ chắc, chỉ gỡ khẳng định không kiểm được).
    · `12.4` (accuracy, modality): vị ấy sẽ chỉ cho tôi → vị ấy có thể chỉ cho tôi (optative `dassaye`). Không đổi điểm: `grammar_logic` giữ 8,8 vì chủ ngữ ngầm `6.1`–`7.4` và `19.3`–`19.4` còn nguyên.
    · Gỡ khỏi notes hai khẳng định về bản PTS (Rhys Davids): một về twice-fifteen, một về nānārajja là que dò. Kho này không có bản đó nên không kiểm lại được; thay bằng đọc thêm bản Việt nguyên bài của sc-data (Bhikkhu Indacanda, theo chân trang tệp) chỉ để hiểu cách đọc. Không chép câu chữ, vẫn là tra cứu toàn văn, không phải tầng store.
    · Đối chiếu bản Việt nguyên bài cho thấy: `7.2` con số hai lần mười lăm trùng Sujato; `19.2`–`19.4` cấu trúc trùng bản của tôi; `14.3` chữ người trùng; `6.3` bản Việt nguyên bài đọc `mana` là tâm như Sujato, nên (c) vẫn mở. Không nâng `ambiguity_integrity`/`semantic_fidelity`/`triangulation` vì các hapax `nānārajja`, `paratejita`, chủ ngữ ngầm `6.x` vẫn chưa phân xử; điểm khác giữ nguyên. Kết quả: trung bình 8,98 → 9,00, không vượt 9,0 nên vẫn `review`.
    · Không đổi khoá nào ngoài bốn khoá trên; quét cả bài: `kodha` chỉ ở `6.3`, `cirarattaṁ` ở `1.1` và `22.2` (giữ từ lâu ở `22.2` vì ghép đôi với `22.1` đã dùng lại nguyên văn `mn98:12.5`), `thaddha` chỉ ở `6.3`, `nānārajja` chỉ ở `10.3`, `dassaye` chỉ ở `12.4`. Nháy, dấu lược, số khoá (93) và thứ tự không đổi.

