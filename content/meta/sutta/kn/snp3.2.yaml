notes: |-
  **Sửa lan 2026-10-13** (theo cnd11:11.4 và cnd11:12.4, cùng kệ đạo quân của Ma). (1) `snp3.2:12.4` — *Thứ tư được gọi là ái dục.* → *Thứ tư được gọi là tham ái.* (`taṇhā`; trên 299 khoá `taṇhā` ngắn tầng dùng *tham ái* 119, *ái* 131, *khát ái* 60, *ái dục* chỉ 7; *ái dục* dễ bị đọc thành `kāmataṇhā`). (2) `snp3.2:13.4` — *Khinh mạn và cứng đầu là thứ tám.* → *Gièm pha và bướng bỉnh là thứ tám.* (`makkho thambho`; chuỗi công thức `makkha` *gièm pha*, `thambha` *bướng bỉnh* theo cnd11:12.4, cnd6:15.2; *khinh mạn* dễ lẫn với `māna`/`atimāna`). Khoá `snp3.2:16.4` (`yañce jīve parājito`) giữ nguyên: *Hơn là sống mà bị đánh bại* đã diễn đạt điều kiện `ce` bằng cấu trúc so sánh ở 16.3–16.4 (cùng thag2.37:2.4).
