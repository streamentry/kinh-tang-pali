notes: |-
  Tiền lệ đếm được: `Kuruṅgavagga` → "Phẩm Nai Bốn Sừng" (6 tệp: ja21–ja25, ja28); colophon
  không dấu phẩy, khớp cả 6 tệp cùng phẩm. Tên bài dịch mô tả theo đúng khuôn tên phẩm của
  SuttaCentral tại commit đã ghim (ja-name:33.ja29 = "The Bull Named Black"): "Kinh Con Bò Kaṇha";
  tên riêng `Kaṇha` giữ nguyên dạng Pāli, không bịa tên Việt — đúng như `Kinh Con Bò Nandivisāla`
  (ja28) và `Kinh Con Bò Sārambha` (ja88).
  Câu kệ đi đúng logic của Pāli: `Yato yato` (dù… bao nhiêu) lặp ở cả 1.1 và 1.2 nên dịch "dù …
  bao nhiêu, dù … bao nhiêu"; `gambhīravattanī` là đường lún sâu (`vattanī` = lối đi, rãnh xe),
  không phải "độ sâu nước". `Tadāssu` = "Bấy giờ"; `svāssu` = "chính con ấy", tôi giữ mạch nhân
  xưng vì đó là điểm của câu: chính con bò ấy kéo nối gánh.
  Sujato có 10/11 khoá (để trống đúng dòng kết 2.1 như mọi Jātaka) nhưng mọi khoá Pāli ngắn hơn
  40 ký tự nên substantiveSegments = 0 và sàn coverage không kích hoạt. Không có bản Việt hiện
  hành cho Jātaka ở commit đã ghim.
  Vì `cần` trong `kiểm()` RỖNG, tôi tự quét MỌI khoá bằng `review.py` — sạch. Không chạy
  `npm run validate|test|check|build` (đợt này cấm) nên technical_integrity = 9.6.

  Quyết định hội đồng biên tập 2026-10-16: B21 — :0.3 (kuruṅga = linh dương); C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
