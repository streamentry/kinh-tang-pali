notes: |-
  **Vì sao lát này tồn tại.** Tệp dịch trước đây chỉ có MỘT khoá (`tha-ap214:6.1`).
  Nguyên nhân đo được: ngưỡng 40 ký tự của cổng coverage loại hết 23 khoá còn lại
  (đo của chính bài này: **23 khoá < 40 ký tự**, chỉ **1 khoá ≥ 40**). Lát này dịch
  đủ 24/24 khoá nên blocker cũ về `requireComplete` đã hết hiệu lực; blocker còn
  lại là tầng Anh vắng, ghi ở trên.
  **Số đo năm phép kiếm (chạy bằng script, không dùng `_hvi.py`).**
  (1) `set(khoá Việt) == set(khoá Pāli)`: đúng, 24 = 24.
  (2) Ngoặc kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá: 0 lệch. Pāli có 2 dấu
  kép, Việt có 2; nháy đơn 0 ở cả hai vế.
  (3) Pāli trùng nguyên văn TRONG CHÍNH bài mà Việt khác: 0 cặp.
  (4) Dấu lược: Pāli có 1 `…pe…` và 0 `…` trần; Việt có đúng 1 `…` ở
  `tha-ap214:5.2`, 0 `…` trần. 0 lệch.
  (5) Các số dưới đây đều do script in ra.
  **Chỉ mục Pāli → Việt toàn tầng.** Đã dò **3499 cặp Pāli trùng nguyên văn**.
  **13 khoá dùng lại nguyên văn bản dịch đã có**: `Therāpadāna`, `Phẩm Hatthi`,
  `“Hỡi vị sa-môn sống trong rừng,`, `đã tu hành lâu năm;`,
  `Nhờ vào nghiệp ấy, bạch Đấng Lưỡng Túc Tôn,`,
  `bậc Trưởng Thượng thế gian, đấng Nhân Ngưu;`,
  `đây là quả báo của tiền nghiệp.`, `khi tôi làm thiện nghiệp ấy;`,
  `Tôi không còn biết đến đọa xứ,`,
  `là những vị Chuyển luân vương có đại thần lực.`, `Bốn vô ngại giải,`, `…`,
  `đã làm tròn lời dạy của Đức Phật”.` 11 khoá còn lại là Pāli không trùng nguyên văn ở
  bài nào khác nên phải dịch mới.
  **Thuật ngữ, đếm được.** `“Āraññikassa isino,` và `cirarattatapassino;` (Pāli trùng
  nguyên văn ở `ja271`, dùng lại nguyên văn). `Tena kammena dvipadinda,` (trùng 5
  khoá: 3 câu *Nhờ vào nghiệp ấy, bạch Đấng Lưỡng Túc Tôn,* / 1 *Bạch Đấng Lưỡng Túc Tôn
  chí thượng,* / 1 *Nhờ nghiệp ấy, bạch Đấng Lưỡng Túc Tôn,*). `lokajeṭṭha narāsabha;`
  (trùng 4 khoá: 3 câu *bậc Trưởng Thượng thế gian, đấng Nhân Ngưu;* / 1 *bậc Trưởng
  Thượng của đời, đấng Nhân Ngưu;*). `pubbakammassidaṁ phalaṁ.` (trùng 3 khoá, 3 cách:
  *đây là quả báo của tiền nghiệp.* / *đó là quả báu của thiện nghiệp thuở trước.* /
  *đây là quả báu của tiền nghiệp.*). `yaṁ kammamakariṁ tadā;` (trùng 39 khoá, 11
  cách; lớn nhất 11 câu *khi ta làm thiện nghiệp ấy;* + 5 câu *khi tôi làm thiện nghiệp
  ấy,* = 16 câu có *thiện nghiệp*; tôi chọn *khi tôi làm thiện nghiệp ấy;* vì ở đây
  nghiệp là việc dâng vật uống cho bậc ẩn sĩ, tức thiện nghiệp thật, không phải bổ
  nghĩa).
  **Bốn chỗ tiền lệ = 0 hoặc tiền lệ yếu — ghi thẳng, không bịa.** Đây là lý do
  `terminology` và `ambiguity_integrity` bị hạ.
  (a) `pānadhi` (1.4, 3.4): toàn tầng `kn` chỉ có **1** tiền lệ, và nó **không phải
  bản dịch** — `tha-ap222:9.1` `Hatthi pānadhi saccañca,` → *Hatthi, Pānadhi, Sacca,*
  tức trong uddāna tên riêng, giữ nguyên Pāli. Tức là **0** tiền lệ dịch nghĩa. Tôi dùng
  *vật uống* (vật uống dâng lên = `pānadhi`) và ghi rõ đây là lựa chọn của tôi, cần
  người biên tập chốt cho cả tầng.
  (b) `Dibbayānaṁ` (2.3): **0** tiền lệ trong toàn tầng (`thắng trời` = 0, `thiền giới` =
  0). Tôi dịch *con đường thắng trời* (`yāna` = đường/xe, `dibba` = thắng, siêu phàm).
  `anubhomi` ở đây là ngôi thứ nhất, nên câu phải để *tôi*.
  (c) `khattiya` (4.2): `khan hiệu` = 0, `sát chúa` = 0, `khan tước` = 0 toàn tầng;
  chỉ **1** tiền lệ `ja415` (`Ambaṭṭhakulassa khattiya,` → *người kỵ sĩ*) nên dùng *kỵ sĩ*.
  (d) `Suyānā nāma nāmena` (4.3): **0** tiền lệ. Đọc là cả tám vị ấy cùng mang một
  danh xưng, nên dịch *Tất cả đều mang danh xưng Suyānā,* theo tiền lệ
  `tha-ap187:5.3` `Isimuggasanāmā te,` → *Tất cả đều mang tên Isimugga,*. Tên riêng giữ
  nguyên Pāli có dấu.
  **Về `ti` — đo ở phạm vi gần nhất, ghi cả hai số.**
  `Hatthivagga` → *Phẩm Hatthi*: phẩm `tha-ap214-222` có 8 bài, **4** câu *Phẩm Hatthi*
  vs **2** câu *Phẩm Bậc Voi*; toàn tầng cũng 4/2. Ghi rõ mâu thuẫn này: `notes` của
  `tha-ap216` lập luận *Phẩm Bậc Voi* với lý do `hatthi` = voi, còn `notes` của
  `tha-ap221` lập luận ngược lại (4 vs 2, chọn *Phẩm Hatthi*) — tức hai lát trong cùng
  một phẩm đã chốt hai cách. Tôi đo và chọn theo đa số **đo được**, nhưng đây là chỗ
  cần người biên tập chốt vì hai cách đều có lý.
  `theraapadāna` (0.3 và 7.1) → *Bài Kệ Tuyên Ngôn Về Trưởng Lão …*: toàn tầng `tha-ap`
  đo được **372** câu ghi *Bài Kệ Tuyên Ngợ* (sai chính tả) vs **128** câu ghi *Bài Kệ
  Tuyên Ngôn*. Tôi chọn **Ngôn** vì *ngợ* không phải từ tiếng Việt. Số lệch 372/128 là
  **sự lệch thật của tầng**, cần một lượt sửa đồng loạt cho cả nhóm `tha-ap`; tôi không
  tự sửa vì ngoài lát của mình.
