notes: |-
  `Susīmajātaka`, bài thứ sáu của `Gandhāravagga` trong `Sattakanipāta`. 33/33 khoá đã dịch,
  tập khoá Việt bằng đúng tập khoá Pāli (đối chiếu bằng set, không chỉ đếm 33).

  TẦNG THAM KHẢO — đo, không đoán. Xem `blocking_errors` mục 1: không có tầng Anh, không có
  `vietnamese-current`, không có lớp lấp `english-project`. Ba tầng tham khảo đều vắng ⇒
  `draft`, và `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng điểm để né blocker.

  TÊN BÀI VÀ TÊN PHẨM — theo bầy lân cận, kèm số đếm trên 445 tệp `ja` đã có ở tầng này:
  `:0.1` → *Jātaka* (429 tệp) chứ không phải *Chuyện Tiền Thân* (16 tệp);
  `Sattakanipāta` → *Bộ Bảy Bài Kệ* (20/20 tệp có khoá `:0.2`, không có ngoại lệ);
  `Gandhāravagga` → *Phẩm Gandhāra* (10/10 tệp có khoá `:0.3`, không có ngoại lệ);
  `:0.4` → *N. Kinh X* (411/445 tệp); dòng kết `…thứ N.` (462 khoá ở 408 tệp).
  Tên riêng giữ dạng Pāli theo mẫu bầy lân cận (ja406 *Kinh Gandhāra*, ja412 *Kinh
  Koṭasimbalī*): *Kinh Susīma*. **Có đúng một tiền lệ trái chiều**: `ja163:0.4` dịch
  `3. Susīmajātaka` thành *3. Kinh Tơ Mảnh*. Tôi không theo vì (a) đó là một bài khác, (b) tầng
  đã dùng `Susīma` dạng Pāli ở `sn11.2:0.3` (*Kinh Susīma*), và (c) bầy lân cận cùng phẩm giữ
  Pāli. Người biên tập phán xử nếu thấy cần thống nhất.

  PĀLI TRÙNG NGUYÊN VĂN — 13/33 khoá có Pāli trùng byte-for-byte ở bài khác, và tôi dùng
  lại nguyên văn ở **9** khoá: ba khoá tiêu đề ở mỗi bài của lát (`0.1` `Jātaka`,
  `0.2` *Bộ Bảy Bài Kệ*, `0.3` *Phẩm Gandhāra*) cộng `7.4`, lấy **y hệt** `sn3.10:5.4`
  (*không luyến tiếc, từ bỏ khoái lạc dục lạc*) — chỉ khác ở chỗ Pāli của mình đóng bằng
  `”ti.` còn Pāli kia đóng bằng `”`, nên bản Việt cũng phải khác đúng chỗ đó. Bốn khoá kia
  (`0.1`, `0.2`, `0.3` của ja413 và ja414) được xử lý y hệt trong hai tệp kia.

  CHỖ ĐỌC LẠI, CÓ LÝ DO. (1) `2.1`–`2.2` `Mameva deva palitaṁ na tuyhaṁ / Mameva sīsaṁ mama
  uttamaṅgaṁ` — `mameva` là *chỉ một mình ta*, nên cả hai câu đều là lời nguyện cầu trời
  bạc tóc người khác chứ không phải của mình; tôi dịch *Cầu trời chỉ bạc tóc ta, / cầu trời
  chỉ bạc cả mái tóc trên đầu ta* để giữ đúng phủ định `na tuyhaṁ`. (2) Bài này chơi
  chữ `kāla`: `kāḷāni` (tóc đen, `1.1`) ↔ `kālikaṁ` (thời khắc tử vong, `3.4`) ↔ `kālo`
  (thời, `1.4` và `6.4`). Tôi dịch cả hai nghĩa ở từng chỗ thay vì chọn một nghĩa suốt bài;
  người đọc Việt không thấy chơi chữ này, đó là đánh đổi không tránh được khi bỏ Hán–Việt.
  (3) `āsītika` ở `5.2` nghĩa là **tám mươi tuổi** (PTS: `āsītika` ← `asīta` = 80; cùng
  nghĩa này được Sujato chú giải ngay ở `mn12`) — bản nháp đầu tiên của tôi đọc nhầm thành
  *sinh ra từ nhà xây*, đã sửa thành *tám mươi tuổi mà như vừa sinh ra*. Đây là lỗi lớn
  nhất review đối kháng bắt được. (4) `4.2` bản nháp ghi *tóc đen chải mượt, ăn mặc tề tắn*;
  Pāli chỉ có `sāmaṭṭhapassaṁ` (*tóc chải mượt*) + `sutanuṁ sumajjhaṁ` (*lời nghe dễ
  chịu, nói năng khéo léo*) ⇒ đã bỏ *ăn mặc tề tắn* vì đó là chữ thêm không có nguồn.
  (5) `5.2` đã bỏ *trắng* trước *nhẵn nhụi như vỏ ốc* vì `nāvutika` chỉ nói *như vỏ ốc*.
  (6) `7.3`–`7.4` sửa lại để *từ bỏ* của `7.4` (`pahāyā`) không lặp y nguyên với `7.3`:
  Pāli cũng lặp (`chetvāna` … `pahāyā`) nên giữ lặp là đúng.

  BẤT ĐỊNH — ghi ở đây, không thêm vào thân kinh. (a) `5.1` `Tamena passāmiparena nāriṁ`:
  tôi đọc `passāmipena` là *thấy qua vách* (`pena` = bức tường/rèm), dịch *Ta thấy người
  phụ nữ ấy qua bức vách*. Không có tiền lệ Việt cho `perena` và không có bản Anh ở commit
  đã ghim; đây là chỗ tôi ít chắc nhất. (b) `5.4` `Gopānasībhoggasamaṁ carantiṁ`:
  tôi đọc là *đi giữa đám đông y như bầy bò* (`gopāna` = đàn gia súc, `bhogga` = bầy/đám);
  chữ `sī` trong phép ghép tôi không phân xử được. (c) `7.1`–`7.2` `Rajjuvālambanī cesā /
  Yā gehe vasato rati` — tôi đọc là các bậc **tu sĩ** bám sợi dây và cư trú hang núi, và
  dịch *Những vị bám sợi dây, / những vị cư trú trong hang núi*; không chắc `rajjuvālambanī` có
  phải ám chỉ việc leo vách bằng dây hay không. (d) `1.3` `Tānajja setāni susīma disvā`:
  tôi đọc `susīma` là tên vua và là chủ ngữ của `disvā` ⇒ *Và lúc ấy Susīma thấy những sợi
  trắng ở đó*; cách đọc khác là `tāna` + `ca` với `susīma` là tế danh. (e) `3.2`–`3.4` tôi
  cho là lời người phụ nữ đáp ông vua, `4.1`–`6.4` cũng của người ấy (vì `6.3` `‘Ahampi
  evaṁ’` là tự nhủ về thân mình và `6.2` `Eko sayāmi` là nằm một mình); nếu `4`–`6` thuộc vua
  thì `6.3` sẽ vô nghĩa.

  DẤU LƯỢC: bài này không có khoá nào chứa `…pe…` và không có `…` trần; hai phía đều 0.
  Đây là câu kệ, không có đoạn lược.

  CỔNG KỸ THUẬT. Agent dịch không được chạy lệnh `npm` (BRIEF cấm
  `validate|test|build|check`). Tôi tự kiểm và tất cả xanh: phép tự kiểm cấu trúc pass cho cả ba bài của
  lát; set khoá Việt bằng set khoá Pāli (33/33, kể cả 33 khoá ngắn hơn 40 ký tự mà `_hvi`
  không quét); mọi giá trị NFC; không khoá nào trùng nguyên văn Pāli ngoài `:0.1`
  (`Jātaka`, ngoại lệ có chủ đích của 429/445 tệp `ja`, và nằm ngoài tập kiểm của `_hvi`);
  nháy kép cân trên cả bài (3 mở, 3 đóng — khớp đúng với Pāli) và nháy đơn `‘’` cân
  từng khoá (2/2 ở `2.3` và `6.3`); không có `(…)` đứng một mình; dấu lược khớp; thứ tự
  khoá theo số. Vì chưa chạy bốn cổng `npm` và chưa có lượt rà của người,
  `technical_integrity` đặt **9.6** chứ không phải 10.0.

  Giải quyết draft 2026-10-12 (kiểm toán độc lập, đọc đối kháng toàn bài từ Pāli). Mục này THAY THẾ các mục cũ ở trên về: các cách đọc ở `1.1`–`1.4`, `2.1`–`3.4`, `4.2`–`4.4`, `5.4`, `6.3`–`7.4`; chỗ BẤT ĐỊNH (a), (c), (d), (e) và mô tả "đọc lại" (1), (4), (5), (6); khẳng định `triangulation`/`blocking_errors` mục 2 và 3. Các mục cũ còn lại (tên bài/phẩm, Pāli trùng, dấu lược, số đếm) giữ nguyên.

  PHÂN LOẠI BLOCKER. (1) Thiếu bản Anh upstream (Sujato, `english-project`, `vietnamese-current` đều không có `ja411`): GIỮ NGUYÊN — đây là sự thật về bản chụp đã ghim, thuộc loại waiver `no-upstream-english`. (2) Mẫu số coverage = 0 (33/33 khoá Pāli < 40 ký tự): GỠ khỏi `blocking_errors` — đây không phải lỗi văn bản mà là giới hạn của phép đo; sự thật được ghi ở đây: cổng coverage KHÔNG đo được gì ở bài này, nên không có cơ sở để nói rằng đã đối chiếu tầng Anh; chỗ nào cũng phải đứng vững từ Pāli một mình. (3) Bất định `5.1` `passāmiparena` và `5.4` `gopānasībhoggasamaṁ`: GỠ vì đã phân xử được bằng căn cứ trong kho (xem dưới) — hai cách đọc cũ ở BẤT ĐỊNH (a) và (b) bị thay thế.

  LỖI NGHĨA THẬT ĐÃ SỬA (25/33 khoá đổi: lỗi nghĩa thật ở 14 khoá — `1.1`, `1.2`, `1.3`, `2.1`, `2.2`, `2.3`, `3.2`, `3.4`, `4.3`, `6.3`, `6.4`, `7.1`, `7.2`, `7.3`; 11 khoá còn lại — `1.4`, `2.4`, `3.1`, `3.3`, `4.1`, `4.2`, `4.4`, `5.4`, `6.1`, `6.2`, `7.4` — là sửa câu chữ/tiền lệ/thêm bớt chữ không có trong Pāli; 8 khoá `0.1`–`0.4`, `5.1`–`5.3`, `8.1` giữ nguyên sau khi đọc đối kháng và đối chiếu). (i) `1.3` `Tānajja setāni susīma disvā`: `Tāni ajja setāni` = *hôm nay, thấy chúng đã bạc*; `susīma` là hô cách gọi vua, không phải mệnh đề "lúc ấy Susīma thấy". Bản cũ "Và lúc ấy" sai. (ii) `1.1`: bỏ "của họ" (không có chủ sở hữu trong Pāli); `1.2` `yathāpadese` = *đúng những chỗ của chúng*, bản cũ "ở chỗ tóc, đúng những nơi ấy" lệch nghĩa. (iii) `1.4` `Dhammaṁ cara` = *hãy sống đúng pháp* (sn1.20…/ja519:34.4, ja521:40–49: "hãy sống đúng pháp"), không thêm "phạm hạnh theo chánh pháp". (iv) `2.1`–`2.2` `Mameva … palitaṁ na tuyhaṁ` là lời tâu: tóc bạc chỉ là của người nói, không phải của vua; bản cũ đọc thành lời nguyện "cầu trời bạc tóc ta" — sai hoàn toàn (không có từ nào trong Pāli nghĩa là "cầu", "trời"); `deva` ở đây là hô cách gọi vua (*tâu bệ hạ*), không phải "trời". (v) `2.3` bỏ "cho ngươi" và thể bị động "Sẽ giúp ích cho ngươi" (Pāli: `atthaṁ karissaṁ` = *tôi sẽ làm điều lợi ích*, `abhāṇiṁ` = *tôi đã nói dối*; chủ thể là người nói). (vi) `2.4` `rājaseṭṭha` = *hỡi bậc vua tối thắng* (10/10 nơi trong tầng: ja506:44.1, ja508:9.1, ja494:3.2…), bản cũ "bậc vua trong các vua". (vii) `3.2` `kaḷīro` = *măng tre* (đối chiếu `cnd23:66.2` `veḷugumbasmiṁ taruṇakā kaḷīrakā` và `ja538:100.3` `navavaṁsakaḷīraṁva` → "mầm tre non"), không phải "hạt cải đen"; `paṭhamuggato` = *vừa mới nhú lên*; bản cũ còn thêm "tóc đen đã mọc lên trước nhất" — không có nguồn. (viii) `3.3` `rajjañca kārehi` = *hãy cai quản vương quốc* (ja506:44.4); `mamañca passa` = *và hãy nhìn tôi*. (ix) `3.4` `Mā kālikaṁ anudhāvī`: cụm cố định `kālikaṁ anudhāvī` đã có tiền lệ rõ ở `sn1.20:4.4`, `sn1.20:13.4` ("chạy theo cái tương lai"), `mn70` ("chạy theo cái có kết quả về sau"), `sn4.21` ("điều thuộc về thời gian"). Bản cũ "đừng vội chạy theo thời khắc của mình" đọc `kālika` thành *thời khắc tử vong của mình* — không có căn cứ; sửa thành *chớ chạy theo cái tương lai*; chơi chữ `kāla` ở mục (2) cũ không còn đứng được ở `3.4` (còn ở `1.4`, `6.4` thì `kālo` = *lúc/thời*). (x) `4.1` bỏ "ở đó" (không có trong Pāli) và dùng `dahariṁ kumāriṁ` = *thiếu nữ còn trẻ* (ja538:100.1, ja509:13.1). (xi) `4.2` `sutanuṁ sumajjhaṁ` = *thân mảnh mai, vòng eo đẹp* (`sumajjhime` = "vòng eo đẹp" ở ja511:8.4, ja519:2.4); bản cũ "eo nhỏ"/"thân đẹp" nửa đúng. (xii) `4.3` `Kāḷappavāḷāva pavellamānā`: `pavāḷa` ở đây là chồi non, `pavellamānā` = *uốn mình đong đưa*; bản cũ "dây leo" không có căn cứ trong Pāli. (xiii) `5.4` bỏ "lưng" (không có trong Pāli) và đọc `gopānasībhoggasamaṁ` = *cong như kèo nhà* theo `dn14:2.2.1`, `dn14:2.3.5`, `mn130:5.6` (`gopānasivaṅka` = "cong như kèo nhà"). (xiv) `6.3` `pekkhamāno` = *quán xét*; "tự nhìn mà bảo" lệch ngữ. (xv) `6.4` `Na gahe rame` = *ta không vui thích ở nhà* (`gahe` = trong nhà); bản cũ "chẳng phải lúc nên hưởng thụ dục lạc" đọc `gahe rame` thành *hưởng thụ dục lạc* — sai nghĩa. (xvi) `7.1`–`7.4` là lỗi nặng nhất: bản cũ "Những vị bám sợi dây, / những vị cư trú trong hang núi" bịa ra "hang núi" và "tu sĩ" mà Pāli không có. Pāli: `rajjuvālambanī ca esā, yā gehe vasato rati` = *và đây là sợi dây để bám víu: niềm vui của người sống trong nhà*; `evampi chetvāna vajanti dhīrā` = *như vậy, sau khi cắt bỏ nó, các bậc trí bước đi* (đối chiếu `ja201:2.3` `etampi chetvāna vajanti dhīrā` = "sau khi cắt được nó, bậc trí bước đi", nơi dây trói buộc nhà cửa cũng được ví như cái cần cắt). (xvii) `7.4` đổi sang `không còn mong mỏi, đã từ bỏ dục lạc”.` — Pāli `Anapekkhino kāmasukhaṁ pahāyā”ti.` trùng nguyên văn với `ja201:2.4`; bản cũ lấy theo `sn3.10:5.4` ("khoái lạc dục lạc"). Đo tiền lệ: `ja201:2.4`, `ne9:23.4`, `ne37:272.4`, `thi-ap18:70.4` (4 nơi) dùng "không còn mong mỏi, đã từ bỏ dục lạc", chỉ `sn3.10:5.4` dùng "không luyến tiếc, từ bỏ khoái lạc dục lạc" (1 nơi) ⇒ theo đa số 4/5, và cũng thoát cách ghép "khoái lạc dục lạc" lặp nghĩa.
  Đã đọc đối kháng và GIỮ NGUYÊN `5.1` (*Rồi về sau ta thấy chính người nữ ấy*: `parena` = *về sau*, đúng với mn13:19.2 `aparena samayena … tameva bhaginiṁ passeyya āsītikaṁ vā nāvutikaṁ` = "về sau … thấy chính người phụ nữ ấy đã tám mươi, chín mươi"), `5.2` (`āsītikaṁ nāvutikaṁ va jaccā` = *tám mươi hay chín mươi tuổi đời*) và `5.3`. Mục (3) cũ của "CHỖ ĐỌC LẠI" và BẤT ĐỊNH (a) cũ (đọc `passāmipena` là *bức vách*) mô tả sai bản dịch hiện có — bản dịch `5.1` vốn đã đúng, chỉ chú thích sai.

  CÁC ĐOẠN KHÔNG CÓ BẢN ANH. Không có Sujato nào cho cả 33 khoá (không phải Sujato "để trống một số đoạn"); toàn bài chỉ dựa Pāli root, đã đọc đối kháng từng khoá và đối chiếu với tiền lệ trong kho như trên. `triangulation` giữ 7.5 (≤ 8.0). Tầng Việt hiện hành không có bản `ja` nào (giới hạn tham chiếu, không phải lỗi văn bản).

  BẤT ĐỊNH CÒN LẠI (ghi để người biên tập phán xử; không đủ để giữ blocker vì nghĩa chung của kệ không đổi). (a) `7.1` `rajjuvālambanī`: tôi tách thành `rajju` + `ālambanī` (có âm đệm `v`), nghĩa gốc *thứ dùng để bám/treo vào sợi dây*; dịch *sợi dây để bám víu*, nghĩa chung (niềm vui tại gia là sợi dây trói/bám mà bậc trí cắt bỏ) được `ja201:2.1`–`2.3` ủng hộ; hình ảnh chính xác (dây treo, dây vịn hay dây thòng) không có bản Anh hay Việt để đối chiếu. (b) `4.2` `sāmaṭṭhapassaṁ`: hiểu là *hai hông/sườn mịn màng*; cách tách `sāma` (da ngăm/vàng) + `maṭṭha` + `passa` không phân xử được. (c) `4.3` `kāḷappavāḷā`: *chồi non sẫm màu* thay vì *san hô đen*; `pavāḷa` có cả hai nghĩa, tôi chọn nghĩa chồi non vì `pavellamānā` (uốn đong đưa) đi với thực vật. (d) `3.3` `mamañca passa`: dịch sát chữ *hãy nhìn tôi*; không rõ có nghĩa *đoái hoài, chăm lo cho tôi* hay *hãy nhìn tôi (già) mà xem*. (e) Người nói: `1`–`3` là người đưa tin tóc bạc (thợ cạo/cận thần) nói với vua, `4`–`7` là lời vua; tôi suy từ nội dung (xưng tâu, nhắc đã nói dối, rồi nhắc `ahampi evaṁ` của người thấy già nua), không có chú giải đi kèm trong tầng Pāli đã ghim.

