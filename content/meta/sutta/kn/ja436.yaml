  Không khoá nào của 6 bài `ja` này có `…pe…` ở Pāli (đã kiểm 246/246 khoá), nên không có dấu lược nào để giữ và không chỗ nào bịa dấu lược che chỗ thiếu.
  Pāli mở/đóng ở 1.1/1.4, 2.1/2.4 (khoá 2.4 có cả `’”`), 3.1/3.4, 4.1/4.4, rồi mở ở `:5.1` và đóng **ở `:8.4`**, cuối cùng mở ở `:9.1` đóng ở `:9.4`. Bản nháp mở thêm ở `:8.1`; đã sửa.
  Bản này là **Samugga**, bài thứ mười của `Gijjhavagga` trong `Navakanipāta`. Đây là bài khó thứ hai của lát: nửa sau kệ, cả về cú pháp lẫn nội dung.
  Pāli trùng nguyên văn trong tầng đã có: 1 khoá (`:0.1`, **dùng lại nguyên văn**, 390/406 tệp). Trong lát này: `:6.3` = `:7.3` và `:6.4` = `:7.4` — bốn khoá đó bản Việt giống hệt nhau.
  **Bất định đã ghi, không bịa:** (1) `:5.1`–`:5.4` là đoạn khó nhất của lát và Pāli có vẻ lỗi ở đây: `Sudiṭṭharūpamuggatapānuvattinā` (`uggatapānuvattin` = kẻ đi ra rồi trở lại) không có chủ ngữ rõ, `Duṭṭhā mayī aññamabhippamodayi` có `mayī` không giải được chắc chắn, và `pāṇarivettha rakkhitā` (“được giữ trong tay”) không có tác nhân nào được nêu. Tôi dịch từng vế theo nghĩa có thể đứng vững nhất và **không** gộp chúng thành một câu kính ngạc ra; cụ thể `:5.4` tôi đọc `mayī` là “bên cạnh tôi” nên dịch *kẻ xấu xa ấy lại say mê bên cạnh tôi một người khác nữa*. Nếu `mayī` hoàn toàn là lỗi chép thì chỉ vế đó cần sửa. (2) `:6.4`/`:7.4` `Akiriyarūpo` — `akiriya` là động từ “được làm ruộc/cày cấy”, nhưng ở đây ở thế `rūpo` nên phải là trạng thái; tôi dịch *trở thành nơi chẳng ai gieo cấy*, không dịch thành hành động của nàng ấy. (3) `:4.1` `Saṁviggarūpo isinā viyākato` — `viyākato` (được tuyên/xác) không nêu ai tuyên, nên tôi giữ chủ ngữ là *người ấy được tuyên là bậc thiền hiền* thay vì bịa chủ thể khác. (4) `Vāyussa puttena sahā` xuất hiện ba lần (`:3.4`, `:4.4`) — tôi giữ nguyên cách dịch *kẻ con của gió* cả ba lần, không tự biến nó thành “người tình” hay “kẻ ngoại tình” dù ý này rất dễ trượt vào suy diễn.
  Thuật ngữ theo tiền lệ đếm được: `dhamma`/`adhamma` → Chánh pháp / phi Chánh pháp (cặp này đã dùng ở `an`, `sn`), `byasana` → tai nạn (`mil` dùng *khổ đau*), `mātugāma` → phụ nữ, `vītasoka` → vô tư sầu muốn (`ja` đã dùng *vô tư sầu*), `pāṭala`/`papāṭa` → gạch chưa nung / khối đất chưa nung (không có tiền lệ, dịch nghĩa và giữ hình ảnh gạch).
  Lỗi bắt được ở lượt review đối kháng, đã sửa: (1) `:5.1` bản nháp không mở ngoặc kép và `:8.1` bản nháp mở thêm ngoặc kép, trong khi Pāli cho thấy lời thoại chạy từ `:5.1` đến `:8.4` — đã sửa; (2) `:3.2` bản nháp dịch `Samuggapakkhittanikiṇṇamantare` là *nhốt trong bên trong tường vực*, vừa thừa chữ vừa vô nghĩa, đã sửa thành *nhốt kín trong lồng của con rắn Samugga*; (3) `:2.3`–`:2.4` bản nháp đặt dấu hỏi sai chỗ, đã sửa để `khaṇa`/câu hỏi đóng đúng.
