  0 tiền lệ, đặt mới có lý do: `adiccabandhu` → hòa thân với họ hàng Dương lực (0 tiền lệ cho cách này; Sujato dịch Kinsman of the Sun; tôi giữ Dương lực vì đây là cách gọi quen thuộc trong kinh — ghi rõ là đặt mới); `cakkhumatā` → Bậc Túc Mắt; `niyyāniko uttaraṇo` → chỉ đường đưa đi, đưa sang bờ bên kia; `āghātana` (nơi giết mổ) → lớp bò thịt, dịch theo Sujato slaughterhouse; `ñāṇavajira` → tia sét của tri kiến; `yathāvālokadassano` → như thấy trong ánh sáng trong veo; `sugambhīro` → rất sâu xa.
  `ariyo aṭṭhaṅgiko maggo` dịch bát chánh đạo (274 tiền lệ toàn kho, đúng như ghi trong notes của sn35.149).
