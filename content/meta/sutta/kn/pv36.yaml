notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pv/pv36_root-pli-ms.json` (362/362 khoá, đủ và đúng thứ tự Pāli). Tên bài lấy từ nhãn Pāli `Ambasakkarapetavatthu` (Chuyện Ngạ Quỷ Ambasakkara). Bài là bài thứ nhất của Đại Phẩm (Mahāvagga): `0.3` mang số `1.` và `88.1` ghi `paṭhamaṁ`; pv37 (Serīsaka) là bài thứ hai, pv38 (Nandaka) là bài thứ ba. Tên Ambasakkara cũng có ở bài uddāna của phẩm (pv51:13.1 `Ambasakkaro serīsako,`).

  Không tìm thấy bản Pāli song song nguyên bài trong toàn Pāli root (dò `Ambasakkar`, `Kappitak`, `kapinaccan`, `pucimandassa sūle`: chỉ có ở pv36 và uddāna pv51; `kappitakesamassu` ở ja506, ja524, ja546, vv72, vv73, vv80 và `kappitakesamassū` ở ud6.2 là một từ khác nghĩa “râu tóc cắt tỉa”). Có nhiều khoá công thức trùng nguyên văn với bài khác: bộ năm điều học (76–77, 81–82) với pv17, pv38, vv63, vv83; liệt kê vật dụng (78, 83) với pv16, pv21, sn3.24, thi-ap29 đến thi-ap33; `87.1` với pv37 và vv84; `34.1` với snp5.4, an3.32, an4.41.

  - Tầng tham khảo và coverage English:
    Tầng `english-sujato` không có pv36 (không có tệp nào của sub-collection `pv`); `english-project` chưa có cho uid này; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage = 1: trong 362 khoá Pāli (đã loại khoá `:0`), chỉ `64.2` đạt ngưỡng 40 ký tự (41 ký tự sau khi chuẩn hoá khoảng trắng); `60.1` chỉ 39 ký tự, `6.3`, `11.4`, `12.4` chỉ 38. Sujato phủ 0/1, nghĩa là coverage 0/1 = 0 thấp hơn ngưỡng 0,8 trong `source/layers.yaml`; con số này đo trên đúng một khoá nên không nói gì về phần còn lại của bài và KHÔNG được trích ra làm bằng chứng đã có tầng tham khảo. `content/meta/reference-gaps.yaml` hiện chưa có entry cho pv36 (có pv1, pv14, pv40 cùng khuôn 1/1); chưa chạy `npm run reference:gaps`, cần ghi nhận trước khi gộp, và entry đó cũng không cứu được `published`. Thứ chặn bài là việc ba tầng tham khảo đều vắng. Không có bản English độc lập nào được đối chiếu; nghĩa các chỗ khó dựa vào Pāli, ngữ cảnh bài và tiền lệ cùng bộ (pv17, pv21, pv37, pv38, vv83, pv16), nên `triangulation` đặt 7.0.
  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” (50/50 khoá giống hệt trong tầng) và `0.2` “Đại Phẩm” (31/31) theo pv37, pv38, pv39–pv51. `0.3` theo khuôn “N. Chuyện Ngạ Quỷ …” của pv38 và pv39–pv41; `88.1` theo khuôn “Chuyện ngạ quỷ …, thứ N.” của pv37, pv38 (`paṭhamaṁ` = thứ nhất, khớp số `1.` ở `0.3`). `translationTitle` không mang số, theo pv37, pv38.
  - Cấu trúc người nói (Pāli không nêu tên người nói; không thêm vào thân kinh):
    + Kệ 1 người kể. Kệ 2–6 là lời vị Licchavi nói với dạ-xoa (ngoặc mở ở `2.1`); trong đó `6.3–6.4` là một cặp nháy đơn lồng (hỏi vì sao dạ-xoa lại nói “hãy sống đi” với người bị đóng cọc), khớp Pāli. Kệ 7–10 dạ-xoa đáp; kệ 11 Licchavi xin hỏi thêm; kệ 12 dạ-xoa; kệ 13 Licchavi; kệ 14 dạ-xoa; kệ 15 Licchavi hỏi; kệ 16–17 dạ-xoa kể; kệ 18 Licchavi; kệ 19–21 dạ-xoa; kệ 22 Licchavi; kệ 23–24 dạ-xoa; kệ 25 Licchavi; kệ 26–30 dạ-xoa; kệ 31 Licchavi; kệ 32–36 dạ-xoa nói về Kappitaka; kệ 37 Licchavi; kệ 38 dạ-xoa; kệ 39 Licchavi; kệ 40 dạ-xoa; kệ 41–44.2 người kể; kệ 44.3–45 Licchavi nói với Kappitaka; kệ 46–48 Kappitaka; kệ 49–51 Licchavi; kệ 52 Kappitaka; kệ 53–56.1 người kể; kệ 56.2–56.4 Licchavi; kệ 57 dạ-xoa; kệ 58 Licchavi; kệ 59–64 dạ-xoa; kệ 65 người kể; kệ 66–67 Licchavi nói với hội chúng Licchavi; kệ 68 hội chúng; kệ 69 người kể (nháy kép trong `69.3` là lời “Đừng sợ, bạn ơi”); kệ 70 người kể nhưng Pāli mở ngoặc kép ở `70.1` (có vẻ là ngoặc của lời kể 71–73 bị đặt sớm một kệ), bản dịch giữ đúng dấu theo Pāli; kệ 71–73 Licchavi nói với Kappitaka (đóng ở `73.4`); kệ 74 Kappitaka; kệ 75 Licchavi; kệ 76–80 Kappitaka; kệ 81–84 Licchavi; kệ 85–88 người kể. Số dấu nháy trong Pāli là 74 (36 cặp kép hai chiều và 1 cặp đơn), bản dịch khớp từng khoá, 0 khoá lệch trên 362.
    + Đại từ: dạ-xoa gọi Licchavi “ông” (`rāja`, `licchavi`, `bhadante` ở `61.1` đều dịch thành “hỡi vua”, “hỡi Licchavi”, “thưa ông”), tự xưng “tôi”; Licchavi gọi dạ-xoa “ngài” và tự xưng “tôi”; Licchavi nói với Kappitaka xưng “con” (cả `bhante` và `bhadante` → “bạch ngài”, tầng: “bạch ngài” 17 khoá, “thưa tôn giả” 13 khoá khi dịch `bhante` trong kệ pv, vv); Kappitaka gọi Licchavi “ông”; hội chúng gọi Licchavi “ông”. Vì thế `82.1–82.4` dùng “con” trong khi pv38, vv63, vv83, pv17 dùng “tôi” cho các khoá Pāli trùng (người nói ở các bài ấy là vua, thiên nữ hoặc người khác không đối diện một vị tỳ-kheo).
  - Số Pāli — tự tính:
    + `vīsatirattimattā` (67.1, 71.3) = vīsati 20 + ratti “đêm” + `mattā` “chừng”, dịch “chừng hai mươi đêm”; `aṭṭha yugā` / `yugāni aṭṭha` (42.3, 45.1, 51.3, 52.3, 53.2) = 8 cặp; `ekayugaṁ duve vā` (36.1) = một cặp hoặc hai (cặp); `yugena` (39.2) = một cặp; `padāni pañca` (76.3, 81.3) = 5 điều học; `aṭṭhaṅga` (77.5, 82.5) = 8 chi phần; `tisso vijjā` (34.4) = ba minh; `Sattussada` (8.2) giữ như tên, không quy thành số; `anekabhāgena` (9.1) = nhiều phần; `ekā` trong `ekāhaṁ` (16.3) = một ngày; `dvayaṁ`, `dvayataṁ` (29.1, 29.4) = hai (loại); `ekantadukkhaṁ`, `ekantatibbaṁ` (9.3–9.4) = hoàn toàn; `ekavākyaṁ` (66.1) = một lời. Không gặp `Tiṁsakappasahassa` hay cụm số chưa phân xử.
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + Pāli trùng nguyên văn với bài khác: đã dò, có 35 khoá thân bài của pv36 (ngoài khoá tiêu đề) có Pāli trùng ở nơi khác, tạo 185 cặp Pāli↔Việt; 72 cặp trùng khít nguyên văn (sau khi bỏ dấu câu và chữ hoa), 113 cặp khác, trong đó 53 cặp thuộc riêng `78.6` (`vippasannena cetasā`, tầng có 63 khoá với 22 cách dịch khác nhau; chọn “với tâm trong sáng”, dạng nhiều nhất: 10 khoá) và phần lớn còn lại chỉ khác chữ hoa, ngôi (“con” so với “tôi”) hoặc đứng trong bài bản dịch đi theo một cách chọn khác. 22 khoá dùng lại đúng bản Việt có sẵn: `19.1`, `34.1`, `76.2`–`76.4`, `77.1`–`77.2`, `78.1`–`78.4`, `78.6`, `79.2`–`79.3`, `81.2`–`81.3`, `83.1`–`83.4`, `84.2`, `87.1`.
    + `78.2`/`83.2` `paccayaṁ sayanāsanaṁ`: tầng chia đôi 4 – 4 giữa “vật dụng, chỗ nằm chỗ ngồi” (thi-ap32:41.2, bv14:14.4, tha-ap397:22.2 và một khoá nữa) và “chỗ ngồi, chỗ nằm để dựa” (thi-ap31, thi-ap33, pv22 ×2); chọn dạng thứ nhất vì giữ `paccaya` thành “vật dụng”. `78.1`/`83.1` “Tấm y và thức ăn khất thực” (7/8). `78.3` “Cơm, nước, các món ăn” (4/4). `78.4` “y phục và chỗ ngồi nằm” (5 khoá, đa số; 2 khoá “chỗ nằm nghỉ”). `77.3`: pv38 và vv83 viết “hãy là người không uống chất say, và chớ nói dối”, pv17 “chớ uống rượu và chớ nói dối”; chọn dạng pv38.
    + `Pāṇātipātā viramassu khippaṁ` → “Hãy mau chóng tránh sát sinh” (3/3). `82.1–82.4` theo pv38:55, vv63:26, vv83:21 trừ ngôi. `76.4` `Akhaṇḍaphullāni samādiyassu` → “hãy thọ trì cho không sứt mẻ, tươi nở” (2/2).
    + `yakkha` → “dạ-xoa” (221 khoá, so với “dạ xoa” 9); `peta` → “ngạ quỷ” (ở `1.3` và nhan đề; pv38:19.3 dịch `peto` là “ngạ quỷ”); `arahā` → “A-la-hán” (58 khoá “A-la-hán”, 2 khoá “vị A-la-hán”, 1 khoá khác); `upāsaka` → “nam cư sĩ” (318, so với “cư sĩ” 277; pv37 dùng “nam cư sĩ”); `dakkhiṇeyya` → “đáng cúng dường” (26, so với “xứng đáng được cúng dường” 16 và “đáng được cúng dường” 4); `saṁvutapātimokkha` → “thu thúc theo giới bổn” (19 khoá “giới bổn”, so với 3 khoá giữ “Pātimokkha”); `sabbapapañcakhīṇa` → “diệt tận mọi hý luận” (33 khoá “hý luận”, so với “phức tạp” 6); `nirūpadhi` → “không còn sanh y” (51 khoá, nhất quán); `visalla` → “không mũi tên” (an5.48 dịch “không tên độc”, sn7.17:3.3 dịch “không phiền nhiễu”; chọn nghĩa chữ); `jutimā` → “rực sáng” (snp3.6:43.3; “chói sáng” 2 khoá); `amamo` → “không chấp là của tôi” (dn32:7.4); `avaṅko` → “không cong vạy” (pv37:43.1); `anīgho nirāso` → “không khổ, không cầu mong” (snp5.4:6.4; an3.32 “không đau khổ, không hy vọng”); `sappurisāna sevanā` → “sự thân cận các bậc thiện nhân là như vậy” (pv37:54.1; vv84 “như thế”).
    + `ujubhūta` → “những bậc ngay thẳng” (an5.36 “ngay thẳng”; tầng chia “ngay thẳng” 9, “chánh trực” 9, “chân thành” 9); `kāyassa bhedā abhisamparāyaṁ` → “khi thân hoại, ở đời sau” (4 khoá cùng Pāli dịch bốn cách: ja446 “xác định tan rã” ×2, pv30 “chắc chắn tan rã”, vv31 “sau khi thân xác tan rã”; trong 114 khoá chứa `abhisamparāy`, các khoá dn27, dn18, dn16, mn91 dịch “đời sau”); `saṁvegamalatthaṁ` → “sinh tâm khẩn thiết” (thi-ap27:60.4 `saṁvegamalabhiṁ` dịch “sinh tâm khẩn thiết”; tầng khác: “xúc động” 16, “khẩn thiết” 9, “cảm giác cấp thiết” 6, “kinh động” 4); `uddisitvā`/`ādiseyya` → “hồi hướng” (trong nhóm pv: 18 khoá “hồi hướng”); `dakkhiṇāyo` → “vật cúng dường”; `opānabhūta` → “giếng nước” (dn5:13.6 “như giếng nước cho …”); `sakhila` → “hòa nhã” (an5.38:5.4 “hòa nhã, ôn hòa”; dn4:6.24, dn5:7.24, ja382:15.1, ja458:14.5 dịch “thân thiện”, nên đây là chỗ hai cách đều khả dĩ); `vadaññū` → “hào phóng” (sn1.75:2.4); `sīvathikā` không xuất hiện; `diṭṭhivisūka` → “quanh co của tà kiến” (pv37:26.4); `dhammikathā` → “pháp thoại” (pv37:26.3); `saccanāma` → “danh xưng chân thật” (an8.55:17.3 và 2 khoá nữa); `tisso vijjā anuppatto` → “đã chứng đắc ba minh” (tầng 60 khoá); `kaṅkhā vicikicchā` → “nghi ngờ, phân vân”; `licchavi` giữ “Licchavi”, `vajji` giữ “Vajji”, `vesālī` giữ “Vesālī”; `saṅgho` ở `67.4`, `68.4` (hội chúng Licchavi) → “hội chúng” để khỏi nhầm với Tăng; `saṅgho` ở `76.2`, `81.2`, `85.4` → “Tăng”.
    + `sūlāvuta` → “người bị đóng cọc” (tầng dịch `sūle uttāsenti` là “đóng cọc” ở mn13, mn14, mn129, an2.1; ja311 `nimbasūla` “cọc …”); `pucimanda` giữ nguyên (an8.19 “cây pucimanda”; ja319 “cây neem”); `kasirā vutti` → “đời sống khổ sở” (không có tiền lệ cùng cụm, nghĩa theo ngữ cảnh); `sakkhiṁ karoti` → “kết bạn” (không có tiền lệ cùng cụm trong tầng; 61.3 `yatonidānaṁ akarimha sakkhiṁ` và 65.2 `sakkhiṁ karitvāna amānusena` cho thấy là quan hệ hai chiều giữa người và phi nhân, nên không dịch “nhân chứng”).
  - Bất định đã ghi (không thêm vào thân kinh):
    + `5.3` `ussāvabindūva palimpamāno`: `palimpamāno` chỉ có ở pv36 trong toàn Pāli root (các dạng `limp` còn lại là `upalimpati`, dn14, dn30, mn91, ja319, ja406). Dịch “như giọt sương đang tan dần” theo hình ảnh giọt sương (an7.74:2.1, cp21:1.3) và `5.4` (mạng sống sắp bị cắt đứt); cách hiểu “bị bôi trét” theo gốc `limp` cũng khả dĩ. Đây là điểm dịch theo ngữ cảnh, chưa phân xử được.
    + `3.4` `virājitatto`: hapax toàn Pāli root; dịch “bị những người kia xa lánh”. `4.1` `oggatatta` (1 khoá `uggatatta` ở ja486:16.3 “uy thế lẫy lừng”): dịch “sa sút” và “thăng tiến”.
    + `4.2` `vikalaṁ`: dịch “thiếu thốn”; nghĩa “khiếm khuyết/tàn tật” cũng khả dĩ. `5.2` `sammakkhito` → “lem luốc” (ja512:10.3), không nêu chất gì làm lem; `samparibhinnagatto` → “thân mình nứt vỡ khắp nơi”.
    + `9.1` `Anekabhāgena guṇena seyyo` → “Tốt hơn gấp nhiều lần”: `guṇa` ở đây là “bội/lần”, chưa phân xử hết.
    + `12.1`–`12.4` `Addhā paṭiññā me tadā ahu … Akāmā saddheyyavacoti katvā`: không rõ “lúc ấy” (`tadā`) nói đến lời hứa lúc nào và `akāmā` chỉ ai; dịch sát chữ “lúc ấy tôi đã có lời hứa”, “dù không muốn” (chủ ngữ ngầm là dạ-xoa).
    + `13.4` `niyassakamma`: là thuật ngữ của luật tạng (một trong các hành tác của Tăng), không có tiền lệ trong năm bộ Nikāya; dịch “xử trị”.
    + `14.3`, `64.2` `aññatthiko`: dịch “vì muốn hiểu biết”, theo nghĩa “mong cầu điều tìm hiểu”; cách hiểu “vì mục đích khác” cũng khả dĩ.
    + `16.2` `narakaṁ ahosi` → “có một hố lầy” (nghĩa chữ `naraka` là địa ngục; ở đây đứng trong `cikkhallamagge`, tức đường lầy, nên dịch “hố lầy”); `16.3–16.4` `gosīsa … setaṁ`: tầng chỉ dùng `gosīsa` ở tha-ap297 (“hương bạch đàn gosīsa”, 5 khoá) và tha-ap302:8.2 (tên ghép); ở đây chưa phân xử được là gỗ bạch đàn hay vật gì khác nên giữ nguyên “gosīsa trắng”; `17.1` `etasmiṁ` (“đặt chân lên đó”) cho thấy vật ấy dùng làm chỗ đặt chân.
    + `24.2`, `60.2` `saṅgahitattabhāvā`: dịch “có thân tâm biết thu nhiếp” (snp2.14:14.4 “giữ thân tâm mình thu gọn lại”); vv11:6.2 dịch “gom góp tài sản”, bản này không theo vì `attabhāva` là thân tâm; chưa phân xử hết.
    + `29.1`–`29.4` `Dvayajja kammānaṁ vipākamāhu … Tā devatāyo paricārayanti`: `devatāyo` là dạng giống cái của `devatā` (dùng cho thiên nói chung); dịch “những vị thiên ấy hưởng thụ”, đối tượng hưởng thụ (quả lạc) không nêu trong Pāli.
    + `30.1–30.3` `Na matthi kammāni sayaṅkatāni … ādiseyya`: dịch “tôi không có những nghiệp do chính mình làm” rồi “không có ai hồi hướng cho tôi” đối với y phục, chỗ nằm, cơm nước ở `30.3` (cách ngắt câu theo Pāli: `30.3` là tân ngữ của `ādiseyya`).
    + `33.2` `svāgamo suppaṭimuttako ca`: cả hai đều là hapax toàn Pāli root (0 khoá khác); dịch “thông hiểu truyền thống” (`āgama` = truyền thừa) và “khéo mang giữ” (`paṭimuñcati` ở sn1.35 “mang lấy”, ja497 “quàng/đeo”); không phân xử được. Đây là điểm bất định đáng kể nhất của bài.
    + `36.2` `Mamuddisitvāna`, `36.4`/`39.4`/`53.4` `sannaddhadussaṁ`: dịch “hồi hướng cho tôi”; `sannaddha` = “khoác, buộc vào” (dn23:23.13 “đeo ống tên”, ja333 “khoác áo giáp”), dịch “khoác y phục”.
    + `38.1` `kapinaccanāyaṁ`: hapax toàn Pāli root, hiểu là tên chỗ (locative), giữ “Kapinaccanā”. `38.4` `sake ācerake`: `ācera` ở ja481, ja522, ja119 là “thầy”, ở ja406:7.2 là “chỗ đức hạnh”; dịch trung tính “đường lối của mình”.
    + `40.2` `Sādhu vo licchavi nesa dhammo`: đọc như “điều này không tốt cho các ông”; cũng có thể đọc “tốt thay” rồi phủ định ở `nesa`; chưa phân xử hết.
    + `47.1` `pādakuṭhārikāhi`: hapax toàn Pāli root; dịch sát chữ “rìu-chân” (cách hiểu có thể là đá bằng chân như nhát rìu), chưa phân xử được.
    + `48.1` `tiṇena telampi`: dịch “dù chỉ chút dầu lấy bằng ngọn cỏ” (nghĩa chữ: dầu bằng ngọn cỏ); `48.2` `muḷhassa`: “người lạc lối”.
    + `50.2` `asamattabhogī` → “hưởng dụng không trọn vẹn” (không có tiền lệ); `50.4` `Kiṁ su tato dukkhatarassa hoti`: hai cách hiểu — “còn gì khổ hơn thế” hoặc “điều gì sẽ đến với kẻ còn khổ hơn thế”; dịch theo cách thứ hai (khớp `51.1`, Licchavi thấy vậy mà khẩn thiết), ghi bất định.
    + `52.2` `akkhayadhammamatthu`: dịch “được điều không cạn kiệt” (không nêu vật gì; đọc theo công đức).
    + `53.1` `ācamayitvā`: tầng chỉ có an6.37:8.1 “rửa tay, súc miệng” và mil5.2.4 (nghĩa khác); dịch “cho vị trưởng lão súc rửa”, đối tượng của nguyên nhân cách (caus.) là suy theo ngữ cảnh.
    + `53.3`–`53.4` `Paṭiggahitāni ca tāni assu … Yakkhañca passetha sannaddhadussaṁ`: người kể lặp lại câu cầu nguyện của dạ-xoa ở `36.3–36.4`; `passetha` có thể là lời kêu gọi người nghe hoặc câu nguyện ngôi thứ ba; dịch “nguyện thấy được” (không nêu chủ thể).
    + `54.2` `Ājaññamārūḷha…` → “cưỡi ngựa thuần chủng”; `54.4` `yakkhamahiddhipattaṁ` → “dạ-xoa đạt đại thần lực” (với `mahiddhi` tầng có “đại thần lực” 66, “đại thần thông” 27).
    + `62.1` `Te aññamaññaṁ akarimha sakkhiṁ`: đại từ `te` chưa rõ (vì động từ ngôi thứ nhất số nhiều); dịch “Chúng ta đã kết bạn với nhau”.
    + `66.2` `Varaṁ varissaṁ labhissāmi atthaṁ`: dịch “tôi sẽ xin một điều ước và đạt được mục đích”; có thể hiểu `varaṁ` là trạng từ “tốt nhất”. `66.4` `paṇihitadaṇḍo anusattarūpo`: dịch “bị áp dụng hình phạt, bị ghim chặt”; chưa phân xử được chữ nghĩa từng vế. `66.3` `luddakammo` → “kẻ có hành vi tàn bạo” (không phải “thợ săn”).
    + `70.1`: ngoặc kép mở ở một khoá kể chuyện (xem phần người nói).
    + `72.2` `Etassa yakkhassa vaco hi bhante`: dịch “vì lời của dạ-xoa này”; có thể hiểu là câu nói của dạ-xoa là nguyên nhân thả người, hoặc là câu trích đã nói; chưa phân xử hết.
    + `77.5` `Imañca ariyaṁ aṭṭhaṅgavarenupetaṁ`: Pāli không nói danh từ; vv31:7.1–7.3 dùng cụm tương tự cho Bố-tát tám chi (`aṭṭhaṅgupetaṁ … uposathaṁ`), nhưng ở đây không có `uposatha` nên dịch “điều cao quý này, đầy đủ tám chi phần tối thắng” và không thêm “Bố-tát”.
    + `80.3` `Muñca tuvaṁ nirayā ca tamhā`: `muñca` là mệnh lệnh cách (ngôi thứ hai) mà `74.3` dùng `mucceyya` (có thể); dịch “mong ông thoát khỏi”, hơi mềm hơn mệnh lệnh nguyên chữ.
    + `85.3` `kārakaro ca bhikkhu`: dịch “làm việc phụng sự vị tỳ-kheo” (`bhikkhu` có thể là `bhikkhuṁ` hoặc `bhikkhūnaṁ`); chưa phân xử được.
    + `86.2` `serī` → “tự tại”; `87.3`–`87.4` `aggaphalaṁ`, `phalaṁ kaniṭṭhaṁ`: dịch “quả tối thượng” và “quả thấp nhất”, không quy về tên quả cụ thể (Pāli không nêu).
  - Dấu lược: bài này không có `…` hay `(…)` ở Pāli (0/362 khoá), nên bản Việt cũng không có; không phát sinh chính sách dấu lược.
  - Kiểm tra tự động: tập khoá Việt = tập khoá Pāli (362/362, đúng thứ tự); nháy đơn và nháy kép khớp Pāli từng khoá (74 dấu, 0 khoá lệch; mẫu số 362 khoá × 4 loại dấu); 0 khoá rỗng; chuẩn NFC; không có Pāli lọt sang thân Việt ngoài tên riêng (Vesālī, Vajji, Licchavi, Ambasakkara, Kappitaka, Kapinaccanā, Sattussada) và các từ giữ nguyên (`pucimanda`, `gosīsa`). Trong bài có 30 nhóm khoá Pāli trùng nguyên văn (đều 2 khoá/nhóm); 30/30 nhóm có bản Việt giống hệt (chỉ khác dấu cuối khoá); không nhóm nào khác. Có hai nhóm Pāli chỉ khác chính tả (`Paṭiggahītāni`/`Paṭiggahitāni` ở `36.3`, `39.3`, `53.3` và `vedanīyaṁ`/`vedanīyan”ti` ở `62.5`, `74.4`, `80.4`) được dịch giống hệt nhau. Các khoá kết bằng dấu hỏi trong bản Việt (`15.4`, `18.4`, `22.4`, `25.4`, `26.4`, `37.4`, `48.6`, `50.4`, `72.4`) kết bằng dấu chấm trong Pāli; đó là câu hỏi trong lời thoại.
  - technical_integrity đặt 9.6: không chạy được `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này; cần chạy đủ bốn lệnh này (cùng `npm run reference:gaps`) trước khi gộp. Không tuyên bố technical gate đã pass.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 12 khoá bất đồng nghĩa → sửa 1 (5.3 ussāvabindūva palimpamāno: trước như giọt sương đang tan dần → sau như giọt sương đang đeo bám; gốc limp có palimpati ở hơn mười khoá của cnd23, mnd2, mnd4, mnd6, mnd9, luôn trong chuỗi không dính, không dính khắp, không dính sát, và không khoá nào nghĩa là tan; bản nguyên bài cũng hiểu là bám; thay thế mục bất định cũ ở 5.3), giữ 3 (12.3 akāmā saddheyyavaco: bản nguyên bài coi người được tin là dạ-xoa, nhưng 14.1 dạ-xoa đòi lời hứa của vua là chân thật nên người được tin là vua; 33.1 vadaññū: bản nguyên bài dịch biết lắng nghe, nhưng chữ này đi với vītamaccharā ở an4.53, an5.36, an8.49 và tầng dịch hào phóng; 50.4 dukkhatarassa ở sở hữu cách nên đọc điều gì sẽ đến với kẻ còn khổ hơn, chưa loại trừ cách đọc còn khổ nào hơn), bất định 8 (16.3 Gosīsamekāhaṁ: ekāhaṁ có thể là một ngày hoặc ekaṁ ahaṁ là một cái, và gosīsa chưa rõ là vật gì; 20.1–20.2 disvāna mantemi: bản nguyên bài hiểu là nhìn nhận và tán dương danh vọng, bản dự án giữ nghĩa chữ; 33.2 svāgamo suppaṭimuttako: bản nguyên bài hiểu là truyền thừa tốt và lời nói khôn khéo; 38.4 sake ācerake: bản nguyên bài đọc là lời giáo huấn của bậc dòng Sakya; 40.2 Sādhu vo licchavi nesa dhammo: bản nguyên bài đọc sādhu là lời khen, chưa phân xử; 48.1 tiṇena telampi; 66.4 anusattarūpo: bản nguyên bài dịch là có vóc dáng thuần phục; 73.3–73.4: bản nguyên bài đọc thành hai câu hỏi). Số Pāli đã tự tính lại: vīsatirattimattā là chừng hai mươi đêm. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đối chiếu bản nguyên bài Bhikkhu Indacanda, đoạn song song vv83, pv17, pv38, vv63, snp5.4): đọc đủ 362 khoá; sửa 2 khoá, cả hai là cú pháp tiếng Việt chứ không đổi nghĩa: 37.3 (trạng từ majja đặt sai chỗ, nay đứng trước động từ, và đại từ theo mayaṁ ở 37.2 thành chúng tôi), 72.1 (so mocito gantvā mayā: câu cũ đến thả ra khó hiểu, nay con đi đến và thả ra); giữ 8 chỗ khác bản nguyên bài là khác diễn đạt hoặc bất định đã ghi (gosīsa, ekāhaṁ 16.3; mantemi 20.2; sādhu 40.2; ācamayitvā 53.1; kārakaro 85.3). Bất định mới: 63.3 và 70.3 mukhena (bằng lời hay đối diện; bản này giữ bằng lời); 53.4 passetha là ngôi thứ hai số nhiều nhưng không rõ người nói, 36.4 dịch ông thấy còn 53.4 để trống chủ thể, giữ nguyên chờ phân xử. Không tra được PED cho gosīsa (dsal không trả kết quả).
