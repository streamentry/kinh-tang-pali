notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja409 tại commit đã ghim, `vietnamese-current` tại commit đã ghim vắng với Jātaka.
  Pāli trùng nguyên văn: 4 khoá, dùng lại nguyên văn cả 4 — `:5.1` và `:6.1` theo ja302:4.1 (Kẻ trước kia đã làm điều lành), `:5.2` theo ja90:1.2 (không hiểu được ý nghĩa của việc ấy), `:7.2` theo thag6.5:4.2 (những ai đã tập hợp ở đây).
  Bản dịch tự nhất quán trong bài: `Yo pubbe katakalyāṇo` lặp ở `:5.1` và `:6.1`, và `ye honti abhipatthitā` lặp ở `:5.4` và `:6.4` chỉ khác vế trước theo đúng nghĩa Pāli (bị phá hủy hết so với được tăng trưởng thêm).
  Bất định ghi rõ: `Ahañce daḷhadhammassa, vahantī nābhirādhayiṁ` ở `:1.1` là câu mong ước nên dịch bằng Nếu; `Dharantī urasi sallaṁ` ở `:1.3` dịch là kẻ mang tên trên ngực, giữ nghĩa của salla; `chakaṇahārikā` ở `:3.4` dịch là đồ chơi được trao tay; `pavīṇati` ở `:4.2` dịch là có tiếng loan truyền ra.
  Thuật ngữ theo tiền lệ đếm được: `sagga` → cõi trời (đã dùng 102 lần trong tầng kn và rất nhiều lần ở tầng an), `kataññu` → biết ơn (7 tiền lệ), `kumbhakāra` → kẻ làm gốm, `hinto` không có. Tên phẩm Sattakanipāta → Bộ Bảy Bài Kệ, Gandhāravagga → Phẩm Gandhāra. Tên vua Daḷhadhamma giữ nguyên dấu Pāli theo 0.4 và được khai vào bộ nhớ tiến trình của `_hvi.py`.
  Cổng kỹ thuật chưa chạy vì agent dịch không được chạy lệnh npm. Coordinator chạy bốn lệnh: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Lượt rà soát 2026-10-15 (Claude Sonnet 5.5 (Claude Code), kiểm lại từng khoá bằng Pāli đã ghim, PED, `dhp337` và các bài `ja90`, `pv21`): sửa 27 khoá. Lỗi nghĩa thật: `:1.1–1.4` là con voi cái chở Daḷhadhamma, mang mũi tên trong ngực, xông pha chiến trận (bản cũ dịch người lái xe); `:2.2` là sức mạnh và dũng lực của ta (`vikkamaporisaṁ`), không phải kẻ phản bội; `:2.3–2.4` là việc làm tốt nơi chiến trận và việc được sai đi như sứ giả; `:3.x` là không bà con, không nơi nương tựa, bị trao cho thợ gốm làm kẻ chở phân bò (`chakaṇahārikā`); `āsīsati` ở `:4.1` là hy vọng, `pavīṇati` ở `:4.2` là tôn kính (PED: pavīnati, J iii.387), `atthāpāye` ở `:4.3` là khi lợi ích mất; `:5.x–6.x` đọc `katakalyāṇo katattho nāvabujjhati` như `ja90:1.1–1.2` (người đã được làm điều lành, đã đạt mục đích, mà không nhận biết); `bhaddante` ở `:7.1` là chúc an lành (cùng công thức `dhp337`), `hotha` ở `:7.3` là mệnh lệnh biết ơn, `ṭhassatha` ở `:7.4` là thì tương lai. Bất định: `oṭṭhibyādhiṁva` ở `:4.4` là hapax trong kho đã ghim, PED không có mục, nên giữ phiên âm thay vì đoán nghĩa; `ce` ở `:1.1` giữ là điều kiện như chữ Pāli; `katakalyāṇo` có thể là người làm ơn (như `ja302:4.1`) nhưng cặp với `katattho nāvabujjhati` thì theo `ja90`. Điểm: semantic_fidelity và grammar_logic hạ về mức bản đã sửa vì bản cũ sai ở khoảng bốn phần năm số khoá.

  Quyết định hội đồng biên tập 2026-10-16: C3 — `0.2` (tên nipāta "Nhóm N Kệ").
