notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng `english-sujato` cho ja409 tại commit đã ghim, `vietnamese-current` tại commit đã ghim vắng với Jātaka.
  Pāli trùng nguyên văn: 4 khoá, dùng lại nguyên văn cả 4 — `:5.1` và `:6.1` theo ja302:4.1 (Kẻ trước kia đã làm điều lành), `:5.2` theo ja90:1.2 (không hiểu được ý nghĩa của việc ấy), `:7.2` theo thag6.5:4.2 (những ai đã tập hợp ở đây).
  Bản dịch tự nhất quán trong bài: `Yo pubbe katakalyāṇo` lặp ở `:5.1` và `:6.1`, và `ye honti abhipatthitā` lặp ở `:5.4` và `:6.4` chỉ khác vế trước theo đúng nghĩa Pāli (bị phá hủy hết so với được tăng trưởng thêm).
  Bất định ghi rõ: `Ahañce daḷhadhammassa, vahantī nābhirādhayiṁ` ở `:1.1` là câu mong ước nên dịch bằng Nếu; `Dharantī urasi sallaṁ` ở `:1.3` dịch là kẻ mang tên trên ngực, giữ nghĩa của salla; `chakaṇahārikā` ở `:3.4` dịch là đồ chơi được trao tay; `pavīṇati` ở `:4.2` dịch là có tiếng loan truyền ra.
  Thuật ngữ theo tiền lệ đếm được: `sagga` → cõi trời (đã dùng 102 lần trong tầng kn và rất nhiều lần ở tầng an), `kataññu` → biết ơn (7 tiền lệ), `kumbhakāra` → kẻ làm gốm, `hinto` không có. Tên phẩm Sattakanipāta → Bộ Bảy Bài Kệ, Gandhāravagga → Phẩm Gandhāra. Tên vua Daḷhadhamma giữ nguyên dấu Pāli theo 0.4 và được khai vào bộ nhớ tiến trình của `_hvi.py`.
