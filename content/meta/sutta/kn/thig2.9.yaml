notes: |-
  Therīgāḹā: `cần` RỖNG (mọi vế ngắn hơn 40 ký tự) nên assertion của harness không
  chạy; đã tự kiểm mọi khoá (NFC, trùng Pāli, dấu lược, nhấy kép, Pāli lọt) — 0 lỗi. Ghi
  lại `save_vi` lần hai ra tệp y hệt từng byte.
  TIỀN LỆ BẮT BUỘC: TIEN_LE_PHAI.md ghi `kataṁ buddhassa sāsanan”ti.` phải dùng lại đúng
  nguyên văn của thag1.107:1.4 (dùng chung cho thag1.108/112/117). Đã dùng lại y nguyên:
  đã làm tròn lời dạy của Đức Phật”ti. Không tự dịch lần hai.
  Tiền lệ khác: `appamādaratā` = không lười biếng, có 8 lần trong tầng đã dùng đúng cụm này.
  `:3.1` theo thag1.107:1.5, hai dấu lược.
  BẤT ĐỊNH 1, nghiêng về Pāli: Pāli đặt tên bài Abhayātherīgāthā, tức trưởng lão nữ là
  Abhayā; nhưng lời nói lại tế tán Abhayā (Abhaye) và nói về thân sắp từ giã của chính
  mình. SuttaCentral đặt tiêu đề Anh chỉ là Abhayā. Cả hai đều để mở; bản dịch giữ đúng
  tế tán Abhayā và ngôi thứ nhất, không chốt ai là ai.
  BẤT ĐỊNH 2: `satā` là hạng người thấp trong xã hội Pāli, SuttaCentral dịch ordinary
  people. Chọn kẻ tầm thường, đúng sắc thái nguồn; nếu chỉ cần trung tính thì người đời cũng
  được, nhưng như vậy là làm phẳng điều Pāli có nói.
  BẤT ĐỊNH 3: `sampajānā satīmatī` — sampajānā là tính từ nữ, satīmatī là có chánh niệm;
  dịch hoàn toàn tỉnh thức, giữ chánh niệm, không thêm chữ nào ngoài Pāli.
  `nikkhipissāmi` là tương lai của nikkhipa: ta sẽ để thân này nằm xuống. Không dịch thành
  đã chết, vì Pāli không nói.
  LỖ HỔNG TẦNG THAM KHẢO: SuttaCentral có 11/12 khoá, im lặng ở `:3.1` (20 ký tự, dưới
  ngưỡng 40 nên không vào mẫu số coverage; coverage = 100%). triangulation hạ 8.6.
  Không có bản Việt tham khảo (vietnamese-current chỉ có Pháp Cú).
  Hạ semantic_fidelity 9.2, terminology 9.1, ambiguity_integrity 9.0 vì còn ba bất định
  mở ở trên.
