    bất định bên dưới).
  - >-
    **Đo lại: ngưỡng coverage không đo được gì cho bài này.** Cả 43 khoá đều
    ngắn hơn 40 ký tự (ngự ngâm), nên `substantiveSegments = 0` và tỷ lệ được
    coi là 1 theo công thức của `src/lib/canon/reference.ts`. Nghĩa là bài này
    *qua* cổng coverage một cách rỗng — cổng không phát hiện được tầng Anh vắng
