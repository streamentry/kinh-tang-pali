  - >-
    **Thuật ngữ, có số đếm.** `indriya` → *căn* (kn=154) · `kāma` → *dục* (kn=357) · `dhīra` → *dũng mãnh* (kn=25) · `nibbatto` → *được giải thoát* · `ariyadhammā` → *các pháp cao thượng*. Cả 43 khoá là bài ngâm ngắn, dịch theo văn pháp kệ hiện có trong kho (chữ hoa ở đầu câu đầu, chữ thường ở các câu tiếp — xem `ja424`).
  - >-
    **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU — bốn chỗ dịch từ Pāli một mình.** (a) `:3.1`–`:3.4` `Kicchakāle kicchasaho / yo kicchaṁ nātivattati / Sa kicchantaṁ sukhaṁ dhīro / yogaṁ samadhigacchati`: ngự ngâm về việc hài lòng với chút ít; dịch *Ít mà còn hơn ít, / ai không vượt quá cái ít ấy; / Người dũng mãnh kia, lấy chút ít làm điều vui, / thì đạt được chỗ tập trung.* `yogaṁ samadhigacchati` dịch *đạt được chỗ tập trung* — chắc `yoga` ở đây là bốn tâm vô lượng nhưng **không có bản Anh để phân xử**, nên không dám khẳng định. (b) `:8.1` `Sohaṁ sahassajīnova` dịch *Một nghìn năm kiếp bên kia* — `sohaṁ` là dạng chữ không rõ; giữ nghĩa số lượng, không đoán thêm. (c) `:9.3` `So sukhaṁ nādhigacchāmi` — chủ ngữ `so` (ngôi 3) nhưng động từ `nādhigacchāmi` (ngôi 1); dịch *Ta không chứng ngộ được điều dễ chịu*, và ghi rõ sự lệch ngôi này thay vì chọn một bên. (d) `:5.3`–`:5.4` `Ahāso atthalābhesu, atthabyāpatti abyatho` dịch *Có vẻ như các mục tiêu đã bị xâm phạm, / mà lại không hề bị xâm phạm*; cụm này không có tiền lệ trong kho và cũng không có bản Anh.
  - >-
    **Bốn cặp nháy kép trong Pāli, giữ nguyên vị trí:** mở/đóng ở `:1.1`–`:4.4`, `:5.1`–`:5.4`, `:6.1`–`:6.4`, `:7.1`–`:9.4`. **Không đối chiếu được tầng Việt hiện hành** (tại commit đã ghim chỉ có 26 chương Pháp Cú).
