    tốt.
  - >-
    **Tên phẩm và tiêu đề, có số đếm.** `0.1` *Jātaka* (396/422 tệp `ja`; 16 tệp
    viết *Chuyện Tiền Thân*). `0.2` `Aṭṭhakanipāta` → *Bộ Tám Bài Kệ* (6/6 trong
    sáu tệp cùng Bộ Tám: ja417/418/419/420/421/424). `0.3` `Kaccānivagga` →
    *Phẩm Kaccānivagga* (6/6 — khuôn chính xác của nhóm này, giữ Pāli như *Phẩm
    Kāsāva*, *Phẩm Kāliṅga*, *Phẩm Cūḷakuṇāla* ở các phẩm khác). `0.4` → *7.
    Kinh Indriyajātaka* và `10.1` → *Kinh Indriyajātaka, thứ bảy.* (ja417 *1.
    Kinh Kaccāni*, ja418 *2. Kinh Aṭṭhasaddajātaka*, ja424 *8. Kinh
    Ādittajātaka*). `ja422` không có trong kho nên số thứ tự 7 của bài này khớp
    `0.4` của Pāli.
  - >-
    **Thuật ngữ, có số đếm.** `indriya` → *căn* (kn=154) · `kāma` → *dục*
    (kn=357) · `dhīra` → *dũng mãnh* (kn=25) · `nibbatto` → *được giải thoát* ·
    `ariyadhammā` → *các pháp cao thượng*. Cả 43 khoá là bài ngâm ngắn, dịch
    theo văn pháp kệ hiện có trong kho (chữ hoa ở đầu câu đầu, chữ thường ở các
    câu tiếp — xem `ja424`).
  - >-
    **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU — bốn chỗ dịch từ Pāli một mình.** (a)
    `:3.1`–`:3.4` `Kicchakāle kicchasaho / yo kicchaṁ nātivattati / Sa
    kicchantaṁ sukhaṁ dhīro / yogaṁ samadhigacchati`: ngự ngâm về việc hài lòng
    với chút ít; dịch *Ít mà còn hơn ít, / ai không vượt quá cái ít ấy; / Người
    dũng mãnh kia, lấy chút ít làm điều vui, / thì đạt được chỗ tập trung.*
    `yogaṁ samadhigacchati` dịch *đạt được chỗ tập trung* — chắc `yoga` ở đây là
    bốn tâm vô lượng nhưng **không có bản Anh để phân xử**, nên không dám khẳng
    định. (b) `:8.1` `Sohaṁ sahassajīnova` dịch *Một nghìn năm kiếp bên kia* —
    `sohaṁ` là dạng chữ không rõ; giữ nghĩa số lượng, không đoán thêm. (c)
    `:9.3` `So sukhaṁ nādhigacchāmi` — chủ ngữ `so` (ngôi 3) nhưng động từ
    `nādhigacchāmi` (ngôi 1); dịch *Ta không chứng ngộ được điều dễ chịu*, và
    ghi rõ sự lệch ngôi này thay vì chọn một bên. (d) `:5.3`–`:5.4` `Ahāso
    atthalābhesu, atthabyāpatti abyatho` dịch *Có vẻ như các mục tiêu đã bị xâm
    phạm, / mà lại không hề bị xâm phạm*; cụm này không có tiền lệ trong kho và
    cũng không có bản Anh.
  - >-
    **Bốn cặp nháy kép trong Pāli, giữ nguyên vị trí:** mở/đóng ở `:1.1`–`:4.4`,
    `:5.1`–`:5.4`, `:6.1`–`:6.4`, `:7.1`–`:9.4`. **Không đối chiếu được tầng
    Việt hiện hành** (tại commit đã ghim chỉ có 26 chương Pháp Cú).
  - >-
    **Kiểm toán lại 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): dịch lại 38/43
    khoá, bản cũ sai nặng.** Bản cũ đoán nghĩa, không đọc Pāli: *ngọt/đắng* thay
    *sukha/dukkha*; `yo indriyānaṁ kāmena vasaṁ nārada gacchati` thành *tiến
    thẳng, không lùi*; `pariccajjubho loke` thành *bị đè nén*; `devilo` (tên
    Devila) thành *ác ma*; `nibbatto` (sinh ra) thành *được giải thoát*;
    `bhāṇumatāmiva` thành *bậc thầy học thuộc*; `gahapatī` bị đọc thành hô ngữ.
    Vai người nói (đối chiếu ngữ cảnh tích truyện, chỉ để biết vai): 1–4
    Sarabhaṅga nói với Nārada; 5 Kāḷadevala nói với em Nārada; 6 lời Đức Phật
    dẫn câu của Devila; 7–9 lời người săn cũ, nay là ngạ quỷ, nói với vua Sivi
    (`sivi` là hô ngữ). **Còn bất định, giữ nghĩa sát chữ:** (a) `:3.2` `kicchaṁ
    nātivattati` (*không vượt khỏi gian nan*, có thể là *không vượt quá/không
    chệch*); `:3.4` `yogaṁ` giữ *yoga*. (b) `:7.1`–`:7.2` `amittānaṁva
    hatthatthaṁ, sivi pappoti māmiva` dựa cách hiểu `hatthattha` = rơi vào tay;
    `:7.5` `yase hāpetvā` hiểu *để mất những điều đem lại danh dự*. (c) `:8.1`
    `sahassajīno` hiểu `jīna` = đã mất (có chú giải hiểu ngược là *thắng*). (d)
    `:9.4` `bhāṇumatāmiva` hiểu theo chú giải: `bhāṇumā` = lửa. Chú giải chỉ
    dùng để xác định vai người nói và nghĩa các từ hiếm, không chép văn xuôi vào
    lời dịch. Bản Anh vẫn vắng; `triangulation` giữ nguyên.
  - >-
    Quyết định hội đồng biên tập 2026-10-16: A13 — 0.3 ("Phẩm Kaccānivagga"
    thành "Phẩm Kaccānī", bỏ chữ phẩm lặp); C1 — `0.4`, `10.1` và
