notes: |-
  Dịch từ Pāli root tại commit bilara đã ghim, đối chiếu trực tiếp với bản Anh của Bhikkhu Sujato tại cùng commit (đủ 30/31 khoá; dòng kết tên tác giác ở `6.7` Sujato không dịch).
  Khung tiêu đề theo đa số thag6 đã merge: 0.2 Trưởng Lão Kệ Nhóm Sáu, 0.3 Phẩm Thứ Nhất, 0.4 Kệ Ngôn Trưởng Lão Kātiyāna, dòng kết `… Trưởng lão Kātiyāna ….` với hai dấu lược.
  ⚠ Bất định có nghĩa đáng kể, đã phân xử và ghi lại: `Kūṭeneva jinātu maccurājā` (1.4). `jinātu` đọc theo nghĩa cảnh báo (mệnh lệnh của câu trước: Đừng biếng nhác) là Đừng để Tử vương nắm lấy ngươi ngay gáy; Sujato đọc là catch you in his trap. Tôi theo nghĩa cảnh báo. `maccurājā` dịch Tử vương (1 tiền lệ ở dhp167-178:4); kho còn dùng Thần Chết (snp5.16, sn55.43) và Ma vương (dhp320-333) — ba cách cùng tồn tại, tôi chọn Tử vương vì nó là cách đã có trong kho.
  Bản nháp đầu của tôi đã mất mệnh lệnh `Mā taṁ alasaṁ` ở 1.3, biến câu thành vế giả thiết; đã sửa thành Đừng biếng nhác, ngươi thuộc họ của kẻ phóng dật.
  0 tiền lệ, đặt mới có lý do: `pubbāpararattamappamatto` → đừng phóng dật trong canh đầu và canh cuối đêm; `satthā` → Bậc Đạo sư (chữ hoa vì danh xưng); `yogakkhema` → yên ổn; `anādiyāno` → đừng nắm giữ; `indasagotta` → người cùng họ với Indra; `sudīpa` → chỗ đất vững chắc; `sītibhūto` → đã nguội; `khiḍḍārati` → chơi đùa.
  jhāna dịch thiền định (9 tiền lệ trong tầng thag); Māra dịch Đấng Chiến Thắng như thag6.1.
