  - 5.3 (accuracy fix): Sa hāsayanto parisaṁ → Ngài làm cho hội chúng hoan hỷ (trước: ông ấy làm
    cho hội chúng hoan hỷ). Lý do: sa và narapuṅgavo (5.4) cùng ở danh cách, là chủ ngữ của
    abhāsatha (6.2); seṭṭhino (6.1) là người được thương tưởng nên không thể đồng thời là chủ thể
    làm hội chúng hoan hỷ. Tiền lệ cùng động từ hāsayanto gắn với Đức Phật ngay trước lời nói kệ:
    tha-ap20:4.3 và tha-ap563:4.3 (Sabbe jane hāsayanto … desesi amataṁ padaṁ: Làm cho tất cả
    mọi người hoan hỷ, Ngài đã thuyết giảng). Cách đọc cũ (người chồng) là cách chọn ở bản cũ dựa
    vào bản tra cứu toàn văn; bản này bỏ cách đó vì cú pháp và tiền lệ không đỡ nó. Khoá 5.4 và 6.1
    đọc liền mạch hơn: Ngài, khi ấy, bậc ưu việt giữa loài người, vì lòng thương tưởng vị triệu phú,
    đã nói những bài kệ này. Mục bất định 5.3 ở trên được thay bằng kết luận này.
    Tiêu chí đổi: semantic_fidelity 8.5 → 8.7 (sửa sai chủ thể); grammar_logic 8.6 → 8.7 (nhận
    ra đúng quan hệ danh cách).
  - 27.1 (clarity fix): Nisinnaṁ janakāyamhi → Ngài đang ngồi giữa đám đông (trước: Đang ngồi giữa
    đám đông, không chủ ngữ). Lý do: nisinnaṁ và desentaṁ là đối cách, bổ nghĩa cho mahāmuniṁ
    (26.4); khi bỏ trống chủ ngữ, câu Việt dễ bị đọc nhầm là chính vị Bà-la-môn đang ngồi và
    thuyết giảng. Chỉ làm rõ chủ thể đã có trong 26.4, không thêm nghĩa; 27.2 giữ nguyên dạng
    đã dùng lại (đang thuyết giảng cảnh giới bất tử). Tiêu chí đổi: vietnamese_clarity 8.8 → 8.9.
