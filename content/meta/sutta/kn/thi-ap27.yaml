  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - 5.2 taṁ ṭhānamabhipatthayiṁ và 46.2 ṭhapayiṁ: dạng -iṁ giống ngôi thứ nhất, nhưng người ước
    nguyện (5.2) là người chồng (6.3 puttaka, 8.4 sāvako ở giống đực), nên đọc là ngôi thứ ba; 46.2
    cũng đọc là người chồng (47.1 đến 47.2 nói bà chỉ dự phần). Chưa có tiền lệ trong chỉ mục
    cho -iṁ ngôi ba ở bài này; ghi lại để biên tập xem.
  - 5.3 Sa hāsayanto parisaṁ: sa có thể là người chồng (làm hội chúng hoan hỷ lúc ước nguyện,
    cách đọc của bản tra cứu toàn văn) hoặc Đức Phật; bản này chọn người chồng, và narapuṅgavo
    (5.4) là chủ ngữ của abhāsatha (6.2). Dấu chấm ở cuối 5.4 của Pāli đứng trước động từ ở 6.2,
    nên vị trí câu có thể khác.
  - 6.4 nibbuto hohi puttaka: nibbuta (tịch tịnh, dịu mát, hoặc Niết-bàn); giữ nghĩa trung tính
    hãy được tịch tịnh; không dịch thành hãy nhập Niết-bàn vì Pāli không nói rõ.
  - 16.1 aṭṭhaṭṭhakumbhīnaṁ: có thể là mỗi nhóm tám cái bình (phân phối) hoặc tám lần tám; chọn
    nghĩa phân phối, ít giả định. kumbhī và kumbha cùng dịch là bình (thi-ap26 dịch kumbhī là cái
    nồi — ngữ cảnh khác).
  - 18.2 avaṭaṁsā: vòng hoa trang trí (hoa cài, vòng hoa); 18.1 parikkhittā được đặt vòng quanh.
  - 20.1 đến 20.4 vediyo tisso … haritālena … manosilāyekaṁ … añjanena ekikaṁ: Pāli để haritāla
    không có ekaṁ, nên có thể đọc là ba bệ, một bằng mỗi chất; bản này mirror đúng Pāli. vediyo →
    bệ (2 khoá tầng dịch lan can ở ngữ cảnh làm hàng rào; ở đây có pūrayi đổ đầy nên chọn bệ).
  - 21.2 varavādino → bậc Thuyết Giảng cao quý (không tiền lệ); là danh xưng của Đức Phật, đọc
    theo ngữ cảnh.
  - 25.3 guṇenāpi: phẩm hạnh (có thể là học vấn hoặc đức hạnh); aḍḍho santo … suduggato (giàu về
    phẩm hạnh nhưng rất khốn khó về của cải) giữ như Pāli.
  - 30.1 và 48.2 sajjita: không có tiền lệ; từ điển cho trang bị, trang hoàng; dịch đầy đủ sung
    túc, cần xem lại.
  - 31.4 pubbasnehena bhattuno: tình thương từ trước của người chồng (có thể là từ đời trước).
  - 33.3 pattaṁ: Pāli đã ghim đọc pattaṁ (chiếc bát), khác với một số bản in dùng lọng; giữ
    chiếc bát đúng Pāli. 33.4 tattakaṁ: có thể là cỡ như thế hoặc đã nung luyện (cf. các khoá
    uttattakanaka và sutattakanaka dịch vàng nung luyện); chọn được nung luyện.
  - 37.1 đến 37.4: kaniyassa mama bhattuno bhāgannaṁ tassa datvāna: phần cơm của em trai chồng,
    dâng cho Đức Phật Độc Giác; tamhi (37.4) là người em ấy. 38.2 tato tassa adāsahaṁ không nêu
    vật cho và tassa có thể là người em hoặc Đức Phật Độc Giác; 38.3 ukhā āniya: chủ ngữ gerund
    đọc là người em (so ở 38.4), nên có thể đọc khác. Giữ Pāli, không thêm vật hay chủ thể.
  - 40.2 apace padusepi ca: không rõ nghĩa; đọc là tôn kính và ác ý theo ngữ cảnh (an8.38:4.4
    cùng có apace); cả khoá nói về gương mặt vẫn bình đẳng khi cho, nhận, tôn kính, ác ý.
  - 41.4 sakkaraṁ: đường (một số bản in đọc khác); saghataṁ: cùng bơ lỏng.
  - 42.4 duggandhā vadanena ca: hôi hám và cả ở miệng; vadana có thể là miệng hoặc lời nói
    (nguyên nhân thứ hai cùng với apakāra ở 42.3); giữ nghĩa miệng, ít giả định.
  - 43.2 nidhāyantamhi cetiye: nidhāyati (đặt xuống); dịch đang được hoàn tất theo ngữ cảnh,
    không có tiền lệ.
  - 44.2 nicayitvā: tẩm (cũng có thể là chất lên, phủ lên); chọn tẩm theo ngữ cảnh với hương.
  - 45.3 đến 46.2: người làm đèn là người chồng (xem trên); nếu là bà thì cả 45.1 đến 46.4 đổi
    thành ta.
  - 54.2 upaṭṭhahiṁ và 54.4 pūjayiṁ: dạng -iṁ; bản này để không chủ ngữ để theo chủ ngữ ở 53.1
    đến 53.2 (người chồng làm vua Brahmadatta); có thể là bà (hoàng hậu), xem lại.
  - 56.2 sujāto: đã khéo sinh ra (nghĩa gốc: sinh vào nhà tốt); 57.2 puruttame: thành phố ưu việt
    (loc. của purottama); 58.1 đến 58.2 ghanakañcanabimbena nimminitvāna: tạo ra ta bằng hình
    tượng vàng nguyên khối, giữ nguyên.
  - 60.1 tile jāte: khi mè đã mọc lên; có thể là mè đã nảy mầm hoặc chín; giữ nghĩa mọc lên.
  - 63.3 kalyāṇamittattaṁ: không tiền lệ; dịch việc có được bạn lành, vì kassapassa ở 63.4 là
    đối tượng.
  - Bản tra cứu toàn văn nguyên bài trên SuttaCentral (Bhikkhu Indacanda, giấy phép
    NOASSERTION, không phải tầng store, không căn lề theo khoá) chỉ được dùng để đối chiếu
    nghĩa; không chép chữ nào vào bản dịch này và không tính vào coverage hay triangulation.

