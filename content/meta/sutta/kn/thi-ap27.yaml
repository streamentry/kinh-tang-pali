notes: |-
  Bài kinh thi-ap27 — Bhaddākāpilānītherīapadāna, bài thứ bảy của Phẩm Kuṇḍalakesī trong
  Therīapadāna. 282/282 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào ngoài tập
  khoá Pāli. Bài kể lời tự thuật của Bhaddā Kāpilānī: từ thời Đức Phật Padumuttara, người chồng
  của bà (nhà triệu phú Videha ở Haṁsavatī) nghe Đức Phật tán thán vị đệ tử đệ nhất về hạnh
  đầu-đà, dâng vật thí bảy ngày, ước nguyện địa vị ấy và được thọ ký làm Kassapa ở thời Đức
  Gotama; hai vợ chồng cùng làm nhiều việc phước qua các đời (tháp bảy do-tuần, đèn dầu thơm,
  vải dâng Đức Phật Vipassī, cơm và bát bùn dâng một Đức Phật Độc Giác rồi sám hối, gạch vàng
  cho tháp Đức Phật Kassapa, đèn bơ, hầu cận các Đức Phật Độc Giác); đời cuối bà là con gái
  Bà-la-môn Kappila ở Sākala, được gả cho Kassapa, cùng xuất gia, bà theo Gotamī và chứng
  A-la-hán; lời kết nói về hai vị cùng ba minh.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt, ghi cả hai phạm vi:
  - :0.1 Therīapadāna giữ nguyên Pāli: 34 trên 35 khoá cùng dạng ở các tệp thi-ap đã có (một
    tệp là thi-ap6, viết Trưởng Lão Ni Ký Sự).
  - :0.2 Kuṇḍalakesīvagga → Phẩm Kuṇḍalakesī: 8 trên 8 khoá cùng Pāli đã dùng dạng này.
  - translationTitle bằng đúng giá trị :0.3 từng ký tự.
  - Số thứ tự ở :0.3: Pāli :0.3 là Bhaddākāpilānītherīapadāna, không bắt đầu bằng số, nên
    :0.3 không có số. Trong 35 tệp thi-ap đã có (không tính bài này) 18 tệp có số ở Pāli (12
    giữ, 6 bỏ) và 0 tệp thêm số ở chỗ Pāli không có; ở tha-ap 0 tệp thêm số trên 558 tệp.
    Bài này rơi vào nhóm không số, không thuộc nhóm thừa.
  - Từ chỉ thể loại apadāna ở :0.3 và :72.1: phạm vi gần nhất — Phẩm Kuṇḍalakesī (8 tệp đã có:
    thi-ap21 đến 26, 29, 30) Tuyên Ngợ 6 so với Tuyên Ngôn 2 (thi-ap29, thi-ap30 viết Tuyên
    Ngôn); toàn thi-ap 35 tệp: Tuyên Ngợ 32, Tuyên Ngôn 2; toàn tha-ap 558 tệp: Tuyên Ngợ 255,
    Tuyên Ngôn 141, Ký Sự 155. Cả hai phạm vi cho Tuyên Ngợ là đa số, nên bài này giữ Tuyên Ngợ
    cho khớp thi-ap26 liền trước; đó nhiều khả năng là lỗi chính tả của Tuyên Ngôn, nên cần
    người biên tập phán một lượt rồi sửa hàng loạt cả cuốn chứ không sửa riêng bài này.
  - Tên người: Bhaddākāpilānī → Bhaddā Kāpilānī (thig4.1 viết đúng dạng này; Pāli bài này viết
    liền thành một hợp từ). Kappilassa dijassa (57.3) giữ đúng chính tả Pāli đã ghim là Kappila.
  - bhikkhunī ở :71.1 → Tỳ-kheo-ni, theo thi-ap36 và thi-ap12 (đúng Pāli, cùng công thức lời
    kết: Tôi nghe như vầy: Tỳ-kheo-ni X đã nói những bài kệ này; imā gāthāyo là số nhiều).
  - Khoá cuối :72.1 sattamaṁ → thứ bảy, theo mẫu Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni X, thứ N
    của thi-ap36 đến 39.

  SỐ PĀLI — tự tính, in phép:
  - satasahassamhi kappe (1.3) = sata 100 × sahassa 1.000 = 100.000 → một trăm ngàn kiếp
    (20 trên 20 khoá cùng Pāli đã dịch một trăm ngàn). satasahassito kappe (7.1) = một trăm ngàn
    kiếp, thì tương lai (xem bất định).
  - Ekanavutito kappe (24.1) = eka 1 + navuti 90 = 91 → chín mươi mốt kiếp (122 khoá cùng Pāli,
    dạng đa số 43 là Vào chín mươi mốt kiếp trước).
  - sattayojanikaṁ (12.1) = bảy do-tuần. Sattasatasahassāni (13.1, 15.1) = sattasata 700 ×
    sahassa 1.000 = 700.000 → bảy trăm ngàn (một khoá cùng dạng Sattasatasahassānaṁ đã dịch
    bảy trăm ngàn). Sattapātisahassāni (45.1) = satta 7 × sahassa 1.000 = 7.000 → bảy ngàn chiếc
    đĩa. sattahi ratanehi (13.4, 45.2) = bảy thứ châu báu; sattapantiyo (46.2) = bảy hàng.
  - aṭṭhaṭṭhakumbhīnaṁ (16.1): aṭṭha lặp lại, kiểu phân phối: mỗi nhóm tám cái bình (xem bất định).
  - tisso (20.1) = ba; ekaṁ/ekikaṁ (20.3, 20.4) = một; aṭṭha paccekanāyake (32.2) = tám vị.
  - satehi saha pañcahi (50.2) = năm trăm; pañca satāni (50.3 đến 50.4) = năm trăm; satāni
    pañcanūnāni (54.1) = gần năm trăm (tha-ap547 cùng Pāli: Gần năm trăm vị).
  - pañcavassāni (61.3) = năm năm; temāsaṁ (51.1) = ba tháng; ticīvaraṁ (51.2) = ba y; tīhi
    vijjāhi (65.3), tevijjo (65.4) = ba minh; catasso (70.1) = bốn; ubho (55.2, 67.2) = cả hai;
    sattamaṁ (72.1) = thứ bảy.
  - Không có cụm Tiṁsakappasahassa (tiṁsa 30) hay bất kỳ cụm số nào chưa phân xử được trong
    bài; phép kiểm số của kho vì vậy không có gì cần đo ở cụm đó — phép ấy chạy rỗng, không phải
    pass.

