  bị cờ; đã đọc thủ công toàn bộ nhóm bị cờ); đọc từng nhóm kệ trích (10 nhóm) cạnh Indacanda và
  Sujato; so 62 mục từ đầu đoạn với mục từ của Indacanda; kệ trích còn so với Sujato snp4.2 (93 khoá
  có Pāli trùng chữ với kho `snp`, 80 khoá có Việt trùng chữ, 13 khoá khác, đã xem mẫu: phần lớn do
