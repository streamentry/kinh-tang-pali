  Rà từng chữ bằng DPD 2026-10-16: 1074 khoá đã rà; sửa `97.14`, `106.18` (`diṭṭhasutamutaviññātabba`: chỉ `viññātabba` là động tính từ tương lai, DPD 'visible, audible, sensible and knowable'; «nên thấy, nên nghe, nên cảm nhận, nên biết» → «được thấy, được nghe, được cảm nhận, được biết» như `mnd14:109.12`), `77.1`, `77.7`, `82.7` (`lahukaṁ jīvitaṁ`: DPD lahuka 1 'brief; short-lived', chú giải att2 'sallahukaṃ, alasapaṭisedho'; «nhẹ nhàng» → «mau tàn»; `mnd6:17.1`, `17.7` còn cùng lỗi), `128.1`, `128.2` (`parattabhāva`, `pararūpavedanā…` trong cặp đời này/đời sau: DPD para 2 'next (world/life)', att2 'Parattabhāvanti paraloke attabhāvaṃ'; «của người khác» → «ở đời sau»), `56.3` (`mokkhaṁ pāmokkhaṁ`: DPD mokkha 2.1 'foremost', att2 'Mokkhanti uttamaṃ mukhabhūtaṃ vā', Indacanda «sự mở đầu, sự dẫn đầu»; «sự giải thoát, bậc đầu» → «cửa ngõ, điều dẫn đầu»), `86.2`, `87.102`, `87.103` (Đức Phật tự xưng: «ta» → «Ta» theo §9), `102.2` (tiêu mục `antā` «Các đầu» → «Các cực» cho khớp kệ `101.1` và `mnd5:35.2`), `49.17` (dấu «;» cuối → «.» theo Pāli); bất định `48.2`, `48.15`, `48.17`, `48.18` (`buddhānaṁ sāvakānaṁ`: «của các đệ tử chư Phật» hay «của chư Phật và các đệ tử»; BJT có `buddhasāvakānaṁ`, không dùng dị bản), `44.2` và các khoá `avadāniyā` (DPD 'ungenerous; stingy; unkind' so với «cứng lòng»), `18.4`, `24.22`, `25.21` (`dubbinivatta` «khó quay lại»), `22.3` (`vevicchaṁ` «xan tham» trong danh sách tham ái, DPD 'wanting to have'), `87.63`, `87.66`, `87.69` (`kilāsa` DPD 'vitiligo', `daddu` 'ringworm', `rakhasā` so với «chàm», «mụn rộp», «lở loét»; danh sách dùng chung nhiều bài, không đổi lẻ); giữ `101.1` `vineyya` «Đã loại trừ» (att2 'chandarāgaṃ vinetvā', thể liên kết) và `123.3` `ubho loke` «cả hai ở đời» (att2 đọc `loke` là định sở cách).

  Sửa lỗi nghĩa 2026-10-16: `Satto guhāyaṁ` — `satto` là quá khứ phân từ «bị dính mắc» (chú giải `sattoti laggo`; chính 3.5 giải `satto visatto āsatto laggo`; Sujato «Trapped»; Indacanda «bị dính mắc»), không phải danh từ «chúng sinh». Khoá 2.1, 3.1, 3.5, 3.7, 4.9, 4.17, 20.1; 4.8 giữ «chúng sinh» vì là lời trích chơi chữ satta. Đồng bộ với snp4.2:1.1.

