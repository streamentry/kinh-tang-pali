notes: |-
  Dịch từ Pāli root tại commit đã ghim; đủ 102 khoá, thứ tự và tập khoá khớp Pāli, không có khoá ngoài Pāli. Không có bản Anh Sujato, bản Việt phân đoạn hay english-project cho bài này, nên không có đối chiếu English độc lập; bản dịch dựa trên Pāli và tiền lệ đếm được của nhóm tha-ap.

  Tên bài và tên phẩm. 0.3 và translationTitle là cùng một chuỗi, Ký Sự Về Trưởng Lão Cúng Dường Một Chỗ Ngồi (ekāsana là một chỗ ngồi, āsana ở 5.1, 8.3, 12.1 và 17.2 cho thấy đây là chỗ ngồi chứ không phải bữa ăn một lần; tha-ap254 cùng tên Ekāsanadāyaka nhưng nội dung là cúng một bữa ăn, nên tên người ở 26.1 giữ dạng Pāli Ekāsanadāyaka). Pāli ở 0.3 không có số thứ tự nên bản Việt không thêm số. Kiểu mở đầu tên: đo ở phạm vi gần (tha-ap400–449) là Ký Sự Về 16, Bài Kệ Tuyên Ngợ 13, Bài Kệ Tuyên Ngôn 6; đo toàn nhóm tha-ap là Bài Kệ Tuyên Ngợ 251, Bài Kệ Tuyên Ngôn 131, Ký Sự Về 111. Tuyên Ngợ là chính tả sai, còn Tuyên Ngôn không phải nghĩa của apadāna; bài này theo Ký Sự Về Trưởng Lão, cùng kiểu với tha-ap423, tha-ap424 và tha-ap426 trong cùng phẩm (tha-ap422, tha-ap427, tha-ap428, tha-ap429 dùng Bài Kệ Tuyên Ngôn). Hai phạm vi cho hai đa số khác nhau, nên để người biên tập phán một lượt cho cả cuốn. 27.1 đọc lại đúng chuỗi ở 0.3 rồi thêm thứ ba (Pāli tatiyaṁ). 0.1 giữ Therāpadāna theo tiền lệ tầng. 0.2 là Phẩm Sakiṁsammajjaka, theo các bài cùng phẩm.

  Số Pāli: paññāsakkhattuṁ (13.1) là paññāsa 50 nên năm mươi lần; asītikkhattuṁ (13.3) là asīti 80 nên tám mươi lần (tầng đã dịch Asītikkhattuṁ rājā ca là tám mươi lần làm vua); kappasatasahassāni (12.3) là sata 100 nhân sahassa 1000 thành một trăm ngàn kiếp; satasahassito kappe (22.1) là một trăm ngàn kiếp trước; pallaṅkasatasahassāni (19.3) là một trăm ngàn chiếc ghế; duve (20.1, 20.3) là hai; catasso (25.1) là bốn. Không có cụm Tiṁsakappasahassa nên không có bất định về số lớn nào chưa phân xử được. Lời thọ ký ở 12.3–14.4 và 13.1–13.4 là lời Đức Phật nói với vị ẩn sĩ về tương lai (karissasi, bhavissasi, saṁsarissasi); bản Việt giữ thì tương lai sẽ, ngươi sẽ và không đổi thành quá khứ. Không có chỗ nào trong bài là số kiếp tính về sau (kappe ở 22.1 là kiếp trước, vì Pāli là lời tự thuật quá khứ của chính vị trưởng lão).

  Dấu lược: ba khoá 23.2, 24.2, 25.2 có Pāli …pe… nên bản Việt mỗi khoá là một …; Pāli không có … hay (…) ở khoá nào khác nên bản Việt cũng không có. Nháy: Pāli mở ngoặc kép ở 1.1 và đóng ở 25.3; nháy đơn mở ở 6.1 và đóng ở 8.4, mở ở 10.1 và đóng ở 14.4; bản Việt khớp Pāli từng khoá, 0 lệch trên 102 khoá.

  Tái dùng nguyên văn tầng: 46 khoá có Pāli trùng với bài khác trong nhóm tha-ap (tổng 4.491 cặp Pāli trùng đã dò, trong đó ba khoá …pe… mỗi khoá hơn 670 cặp); 30 khoá giống cách dịch phổ biến nhất, 10 khoá theo cách ít phổ biến hơn, 6 khoá khác có chủ ý. Phần theo cách ít phổ biến: 3.3 (Đức Chánh Đẳng Giác ưa thích sự viễn ly, toàn tầng Chánh Đẳng Giác 130 khoá), 12.3 và 22.1 (Suốt một trăm ngàn kiếp; Vào một trăm ngàn kiếp trước, theo tha-ap424 cùng phẩm: kiếp thay cho đại kiếp để khớp 22.1 với 12.3 trong cùng bài), 13.1 (Năm mươi lần là chúa chư thiên, theo cùng khuôn với tha-ap424), 14.1 (Vương quyền cai quản các vùng đất rộng lớn: toàn nhóm 7 so với Vương quốc rộng lớn ấy 15, nhưng ấy không có trong Pāli và tha-ap424 cùng phẩm dùng dạng bám Pāli), 15.1, 15.4 (vua thiên nga thay vị vua hạc vì haṁsa là thiên nga, theo tha-ap424), 16.1, 22.2 (khi ta dâng cúng phẩm vật ấy: ngôi ta 6 so với ngôi tôi 8, giữ ngôi ta của cả bài), 22.3 (Ta không còn biết đến đọa xứ, phạm vi gần 25 so với Ta không biết mình rơi vào khổ đau 18, toàn nhóm 57 so với 137; duggati là đọa xứ chứ không phải dukkha). Phần khác chủ ý: 2.2 (ngôi ta thay tôi), 9.4 (Ngài đã nói lời này vì chủ ngữ là Đức Thế Tôn ở 9.1, các khoá cùng Pāli ở bài khác có ngôi tôi hay ta nên không chép), 13.3 (Và viết hoa theo đầu dòng Pāli), 19.4 (luôn luôn vây quanh ta, đúng tiền lệ một khoá), 20.1 và 20.2 (cõi hữu thay kiếp sống: bhava là cõi hữu ở 40 khoá trong tầng, và 20.2 cõi chư thiên hay cõi loài người để khớp devatte, mānuse). Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti dùng dạng Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (nhóm số nhiều, 464 khoá), không dùng dạng số ít đã từng nói bài kệ này (2 khoá). Dòng thứ ba của mỗi khổ viết hoa chữ đầu theo Pāli (23.3, 24.3 và 25.3 viết thường vì đi sau …). Ngôi kể dùng ta ở mọi khổ, kể cả lời cầu xin ở 6.1–8.4; Đức Phật xưng với vị ẩn sĩ bằng ngươi.

  Pāli trùng trong chính bài: sáu nhóm Pāli trùng và một nhóm …pe… ba khoá, mọi nhóm có bản Việt giống hệt nhau, không có cặp nào bản Việt khác: 11.2 và 21.2 (puññakkhette anuttare), 16.4 và 22.4 (ekāsanassidaṁ phalaṁ), 17.2 và 18.2, 17.3 và 18.3, 17.4 và 18.4, 21.4 và 23.3 (viharāmi anāsavo), ba khoá …pe… (23.2, 24.2, 25.2). Hai khoá kataṁ buddhassa sāsanaṁ ở 24.3 và 25.3 khác Pāli ở ngoặc đóng nên khác Việt ở ngoặc đóng đúng như Pāli.

  Bất định (không thêm vào thân kinh). (1) 7.1–7.4 kallatthikā ye passanti … etesaṁ ajaro bhave: kalla đọc là lành mạnh; 7.4 bhave đọc là thức tuỳ nguyện (mong cho họ không già nua), theo ja547:772.4 ajaro amaro bhava là hãy bất lão bất tử; cách đọc khác là bhave là vị trí cách trong cõi hữu (trong cõi hữu của họ không có già); 0 tiền lệ trong nhóm cho cả cụm, nên cần người biên tập phán. (2) 10.2 laddho jotiraso tayā: jotiraso là một loại ngọc (mil5.1.4:12.5 liệt kê ngọc jotirasa giữa các loại ngọc, tầng đã dịch là ngọc jotirasa; tha-ap393 có maṇi jotiraso yathā so sánh); bản Việt giữ viên ngọc jotirasa, không giải thích; chưa phân xử được đó là ẩn dụ chỉ chính Đức Phật hay chỉ điều ngươi vừa gặp. (3) 4.1 vanagge: đọc là trên đỉnh rừng, theo nghĩa vị Phật đang đi trên không trung ở 3.4 (anilañjasā); 0 tiền lệ trong nhóm; cách đọc khác là ở rìa rừng. (4) 16.2 sarathaṁ sandamānikaṁ: sarathaṁ viết chiến xa, sandamānikaṁ viết xe kiệu; sandamānikā là một loại xe, các bản liệt kê ở mnd4, mnd13, cnd8 không cho chi tiết, 0 tiền lệ Việt, nên chưa chắc đúng loại xe. (5) 11.3–11.4 sakkā uddharituṁ attā, yassa cittaṁ paṇīhitaṁ: đọc là người có tâm đã hướng nguyện thì tự cứu vớt được chính mình; paṇīhitaṁ theo tiền lệ đã hướng tới, theo nghĩa nguyện (cùng gốc với paṇidhi ở 12.2). (6) 8.2 pavattaphalabhojihaṁ: người ăn trái cây rụng; pavatta là rụng xuống, 0 tiền lệ. (7) 6.1 sallakatto: nhà phẫu thuật, 0 tiền lệ Việt trong nhóm. (8) 14.1 padesarajjaṁ: giữ theo tiền lệ cùng phẩm (tha-ap424 10.1). (9) 20.1 duve bhave: hai cõi hữu, theo nghĩa hai cảnh là cõi chư thiên và cõi loài người ở 20.2. (10) 12.2 và 15.2: giữ theo tiền lệ đã nêu (cetanāpaṇidhīhi 25 khoá; jalajuttamanāmako 9 khoá).

  Coverage English: mẫu số là 1 khoá có nội dung (26.1, 65 ký tự; 101 khoá còn lại là kệ ngắn dưới ngưỡng 40 hoặc khối :0); Sujato phủ 0 trên 1; english-sujato tại commit đã ghim chỉ có 9 nhóm cp, dhp, iti, ja, kp, snp, thag, thig, ud và không có tệp thân kinh tha-ap nào (tệp tha-ap duy nhất là tệp tên); vietnamese-current chỉ có Pháp Cú; english-project chưa có entry cho bài này. Cổng coverage hầu như không đo được gì ở bài này. content/meta/reference-gaps.yaml chưa có entry cho tha-ap425 (substantiveSegments 1, substantiveWithoutEnglish 1, coverage 0) nên người điều phối cần chạy npm run reference:gaps.

