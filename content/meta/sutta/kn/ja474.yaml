notes: |-
  Đợt 19, làn 6. Dịch từ Pāli root commit đã ghim, đủ 59/59 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem dưới).

  **Tiêu đề, theo khuôn của bài anh em cùng phẩm `ja475`.**
  - `0.2` “Bộ Mười Ba Bài Kinh” và `0.3` “Phẩm Xoài” dùng lại nguyên văn từ `ja475:0.2`, `ja475:0.3` (cùng `Terasakanipāta` + `Ambavagga`).
  - `0.4` “1. Kinh Xoài”: `Ambajātaka` = “Chuyện [cây] xoài”; tên chung “Kinh Xoài” có tiền lệ ở `ja124`, `ja344` (theo ghi chú của `ja475`) và khuôn “N. Kinh <tên>” ở `ja475:0.4`. `14.1` “Kinh Xoài, thứ nhất.” theo `ja475:14.1` (có dấu phẩy trước số thứ tự).

  **Tiền lệ dùng lại nguyên văn.** `8.1`–`8.2` là Pāli `Khattiyā brāhmaṇā vessā, / suddā caṇḍālapukkusā;` trùng nguyên văn với `ja362:4.1`–`4.2`; đã dùng lại đúng bản Việt của `ja362` (1 cặp trùng ra ngoài bài đã dò, 0 cặp lệch trong bản Việt của tôi). Lưu ý: `ja362:4.2` dịch `suddā` là “thợ thuyền”, trong khi tầng `mn` có tiền lệ “Thủ-đà” (ví dụ `mn84:5.13`); tôi giữ theo `ja362` để nhất quán nguyên văn, và để người điều phối quyết một lần cho `suddā` toàn tầng nếu muốn đổi.

  **Trùng nguyên văn trong chính bài:** 59 khoá, 0 nhóm Pāli trùng nguyên văn (đã quét sau khi nén khoảng trắng) ⇒ phép này chạy rỗng, không có gì để so; không tuyên bố “0 lỗi”.

  **Số Pāli:** bài này không có số lượng nào cần tính. Số `1.` ở dòng tiêu đề `:0.4` và `paṭhamaṁ` ở `14.1` = 1 ⇒ “thứ nhất” (khớp với số trong tiêu đề).

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `brahme` (1.4, 4.2) → “hỡi bà-la-môn”: tầng có 14 khoá chứa `brahme` (ví dụ `ja268:2.1`, `ja356:4.3` dịch “Bà-la-môn”); bài này dùng vocative thường nên giữ “hỡi bà-la-môn”.
  - `brahmacāri` (1.2) → “hỡi người phạm hạnh”; tầng có 20 khoá chứa `brahmacāri…`, cách dịch “phạm hạnh” là chính (ví dụ `ud4.8:6.3`).
  - `caṇḍāla` (5.1, 8.2): giữ nguyên Pāli theo `ja362:4.2` (1 tiền lệ trong `ja`).
  - `Pucimanda` (7.1) → “cây sầu đâu” theo `ja311` (`ja311:0.4`, `ja311:2.3`; riêng `ja186:2.1` dịch là “đống xoài thối”, một cách đọc khác của cùng từ).
  - `eraṇḍa` (7.1) → “cây thầu dầu”. Tầng chỉ có 1 khoá (`ja295:3.3`) và dịch là “cây dầu mè”; tôi **cố ý lệch**: `eraṇḍa` là cây thầu dầu (castor), không phải mè; xin người điều phối quyết một lần.
  - `pālibhaddaka` (7.2): 0 tiền lệ; giữ nguyên Pāli theo cách `ja475` giữ tên cây Pāli (`sāla`, `khadira`, `assakaṇṇa`, `dhava`).
  - `makkha` (6.2) → “thói xúc phạm”: tầng `mn` dịch `makkhī` là “xúc phạm” (`mn15:3.35`, `3.36`, `6.35`, `6.36`); dùng cùng gốc.
  - `mānātimāna` (9.4) → “ngã mạn và quá mạn”: cùng cách với `snp4.11:1.3`, `snp4.11:2.3` (“ngã mạn, quá mạn”).
  - `asaññata` (13.2) → “không tự chế” (27 khoá chứa `asaññat…` trong tầng; ví dụ `ud4.8:19.1`, `iti48:4.2`).
  - `akataññu` (13.1) → “vô ơn”: cùng cách với `ja90:0.4` (“Kẻ Vô Ơn”) và `ja308:3.1`.
  - `kaṇhasappa` (10.3) → “con rắn đen”: cùng cách với `ja367:1.2`, `ja389:3.1`, `ja464:11.1`.
  - `jamma` (9.2) → “kẻ thấp hèn”: tầng có 4 khoá, ý “đáng thương / thấp hèn”, không đồng nhất; chọn “thấp hèn” theo nghĩa Pāli.
  - `nakkhattayoga` (2.1, 2.3, 3.1) → “sự hội hợp của các vì sao”; `nakkhatta` được dịch “chòm sao” ở `ja49`, nhưng `yoga` ở đây là “hội hợp / kết hợp” nên giữ nghĩa đó.

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 7 dấu mở · 7 dấu đóng ở các khoá 1.1/1.4, 2.1/2.4, 3.1/4.4, 5.1/6.4, 7.1/9.4, 10.1/10.6, 11.1/13.4; Việt cũng đúng 7/7, lệch 0/59 khoá. Nháy đơn `‘’`: Pāli 1 cặp (6.3), Việt 1 cặp, lệch 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0. Một lỗi đã bắt khi tự kiểm: bản nháp đầu tôi đọc nhầm hai khoá `3.1`, `7.1` là không có dấu mở nháy; phép so từng khoá bắt được và đã sửa.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `Guyhittho atthaṁ vijaheyya manto` (5.4): không tách chắc được `guyhittho`. Tôi đọc theo hướng ít giả định nhất: “nếu việc kín bị tiết lộ, thần chú sẽ bỏ mất hiệu lực” (`guyha` = kín, điều giữ kín; `attha` = lợi ích / hiệu lực). Một cách đọc khác với `guyhittho` là dạng khác của động từ “che giấu” cũng cho nghĩa gần như vậy, nhưng chủ ngữ có thể khác.
  2. `Mā cassu me pucchito nāmagottaṁ` (5.3): tôi đọc là lời dặn của người caṇḍāla (đại từ `me` = ta, người nói trong lời dặn), kết nối với 5.4; vì quyết định này mà 5.3–5.4 không có dấu nháy kép riêng trong Pāli. Bản Việt không thêm “ông dặn”.
  3. `pūtipādaṁ` (10.2) là từ khó: tôi dịch “chỗ thối rữa” như một vế thứ tư (sau `sobbha`, `guhā`, `naraka`); cũng có thể `pūtipāda` là tính từ bổ nghĩa `naraka` (“vực có đáy thối rữa”). Không tìm được tiền lệ nào trong tầng (0 khoá).
  4. `khalayātha` (9.2): dịch “đuổi … đi”. Không có tiền lệ (0 khoá); nghĩa “đuổi ra / đẩy ra” suy từ ngữ cảnh `gale gahetvā`.
  5. `jotimadhiṭṭhaheyya` (10.4): dịch “giẫm lên lửa”; `adhiṭṭhahati` có thể là “đứng lên / đứng trên”, nghĩa gần như nhau.
  6. `Svājja na pāresi jappampi mantaṁ` (4.3) và `Ayaṁ so ko nāma tavajja dhammo` (4.4): `pāresi` dịch “thành tựu”; `dhammo` ở 4.4 dịch “lẽ” (một nghĩa của `dhamma` = cách xử sự / quy luật), không dùng “pháp” để khỏi lẫn với `dhamma` ở 5.2, 8.3, 11.x.
  7. `khaṇaṁ muhuttañca` (2.2, 3.2): dịch “thời khắc và giây lát” — `khaṇa` và `muhutta` đều là đơn vị thời gian ngắn, ngữ cảnh chiêm tinh; hai từ không phân biệt được chắc chắn.
  8. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1, 3–4: nhà vua hỏi người bà-la-môn; 2, 5–6: người bà-la-môn trả lời; 7–9: nhà vua (7–8 nói về điều quý nhất là người dạy pháp, 9 là lệnh xử người bà-la-môn); 10: người bà-la-môn cầu xin người caṇḍāla; 11–13: người caṇḍāla trả lời. Đây là suy luận từ nội dung, không được ghi vào thân kinh.

  **Coverage English (mục 7):** mẫu số = 0. Dài nhất sau khi nén khoảng trắng là 38 ký tự (< 40) nên 0/59 khoá có nội dung; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja474`; `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Tôi không đụng `content/meta/reference-gaps.yaml`.

  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
