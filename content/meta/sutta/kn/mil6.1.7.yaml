notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này tại commit đã ghim.
  Pāli trùng nguyên văn: dựng chỉ mục toàn tầng thì 206/294 khoá của lát có Pāli trùng nguyên văn ở nơi khác; riêng bài này 31/42 khoá trùng và 9 chỗ đã có bản Việt.
  Đã dùng lại nguyên văn: `:0.3` `Buddhavagga` → Phẩm Đức Phật (12 chỗ, kể cả `mil6.1.6:0.3`) · `:3.2`, `:6.3`, `:7.2`, `:8.2` và `mil3.4.6:2.7/3.7/4.7` `“Āma, bhante”ti.` → Vâng, thưa tôn giả (8 chỗ) · `:3.4`, `:4.2`, `:5.2` `“Na hi, bhante”ti.` → Không phải vậy, thưa tôn giả (đa số 120 chỗ) · `:1.3` `“Na hi, mahārājā”ti.` → Không hề, này Đại vương (4 chỗ). Trong bài này không có câu nào trùng với `an8.1`/`an11.15`, khác với `mil5.4.6`.
  Cách gọi: đo lại trên đĩa trong chính tầng `mil` (194 tệp, 606 khoá có `bhante`) thì thưa tôn giả 292 · bạch ngài 137 · bạch tôn giả 54 · thưa ngài 48; `mahārāja` (1.290 khoá): này Đại vương 568 · tâu đại vương 424. Lát này theo đa số đo được. Lưu ý bài lân cận `mil6.1.6` dùng thưa Đại đức và tâu Đại vương, nhưng đó chỉ là một lát khác; tôi đo lại toàn tầng `mil` và ghi cả hai số ở đây như yêu cầu.
  Tên phẩm: `Milindapañha` giữ nguyên (549 chỗ) · `Anumānapañha` đo riêng trong `mil6.1.x` được Câu hỏi về suy luận 10 lần so với Anumānapañha 5 lần, nên theo số đa số trong chính mục này (khác `mil6.1.6:0.2` đã dùng Anumānapañha) · `Buddhavagga` → Phẩm Đức Phật · `Abhisamayantarāyakarapañha` → Câu Hỏi Về Việc Gây Giác Ngộ Và Tạo Chướng Ngại, ghép từ tiền lệ `dhammābhisamaya` → sự giác ngộ Chánh pháp (mil6.3.8:8.1, dn14:3.18.0).
  Bất định đã ghi, không che: (1) `pārājika` — tầng không có bất kỳ tiền lệ Việt nào cho tội lỗi này, và dạng chữ Pāli `Pārājika`/`Parājika` bị chốt `lọt_pāli` chặn vì chưa từng xuất hiện trong tầng Việt; tôi dùng tên Hán–Việt đã thành quy ước là tội Ba-la-di. (2) `hatthiratanamabhiruyha` ở `:9.1` — `hatthiratana` có tiền lệ là báu voi (dn17:1.12.0, dn14, an5.143), còn `abhiruyha` là động từ phủ/đắp lên; câu này vốn cũng khó hiểu ngay cả với người dịch có bản Anh, tôi dịch theo nghĩa chữ nghĩa là đã đắp lên mình báu voi và ghi rõ ở đây. (3) `samaṇakolañño` là người thuộc hàng người sẽ thành Sa-môn, tôi dịch kẻ ràng thuộc bậc Sa-môn. (4) `ghanaselasilāta` ở `:3.3`, `:3.5` là nền đất đá cứng chắc, kín đá; tôi dịch vậy, không suy thêm loại đá.
  Dấu lược: bài này không có `…pe…` ở Pāli (đã kiểm 42/42 khoá), nên không có dấu lược nào để giữ và không có chỗ nào bịa dấu lược che chỗ thiếu. Dấu nháy kép: 29 cặp `“`/`”` ở Pāli, bản Việt giữ đúng 29 cặp và cân trên cả bài; các khoá 3.7, 4.5, 6.4, 7.3, 8.3 cố ý không đóng nháy vì Pāli cũng vậy.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Đã tự xác minh được: JSON hợp lệ, đủ 42/42 khoá trong `all` và trùng khớp 42/42 khoá Pāli trong `root/pli/ms/sutta/kn/mil/mil6.1.7_root-pli-ms.json`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt vào bản Việt, không trùng nguyên văn Pāli ở khoá có nội dung, và YAML parse sạnh. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Sửa lan 2026-10-13 (accuracy fix; thay các nhận định cũ về `samaṇakolañño` ở mục bất định (3) và về `daṇḍaleḍḍulaguḷamuggarā`):
  - `:4.1`, `:4.3`, `:4.4` `daṇḍaleḍḍulaguḷamuggarā` (daṇḍa + leḍḍu + laguḷa + muggara): "những thứ mưa phùn, bùn lầy khó lội" → "gậy, cục đất, côn, chùy" (bốn vật rắn đứng được trên đất, không đứng được trên không); đối chiếu `mil6.4.2:11.3` (laguḷa gậy, muggara chùy), `mil6.4.2:48.1` (leḍḍu cục đất, côn) và `dn27:19.11`, `mn21:6.6` (leḍḍu cục đất); câu 4.1 theo khuôn `:5.1` (mệnh đề so sánh đứng như câu khẳng định rồi mới hỏi), động từ `ṭhāna`/`tiṭṭhati` thống nhất "đứng được" như `:4.3`/`:4.4` cũ.
  - `:9.1` `kāliṅgarājā samaṇakolañño`: "vua Kāliṅga, kẻ ràng thuộc bậc Sa-môn" → "vua Kāliṅga, vị sa-môn Kolañña" (danh hiệu đi liền với vua, cùng Pāli với `ja479:2.2` "vua Kāliṅga, vị sa-môn Kolañña"; nghĩa hợp từ vẫn chưa phân xử được, có thể là tên dòng họ); `bodhimaṇḍa` "bản thả của bậc Giác Ngộ" → "đạo tràng Bồ-đề" (5 khoá `bv2`, `bv21`, `bv26`, `ja479:16.4` đều dịch đạo tràng Bồ-đề); `sattaratanaparikiṇṇo` → "được bảy báu vây quanh"; `hatthiratanamabhiruyha` → "cưỡi lên báu voi" (`abhiruyha` ở `vv60`, `vv41`, `vv61`, `ja457` là cưỡi/lên); `kuladassanāya gacchanto` "đi tỏ ra báu vật của các nhà tộc" → "đi thăm các gia tộc" (đọc `dassana` là thăm/gặp, `kula` là gia tộc; không có tiền lệ khác trong tầng, chưa chắc hoàn toàn); mở câu bằng "chẳng phải" theo `nanu`.
  - Ghi nhận, chưa sửa (ngoài phạm vi lượt này): cụm `abhisamayantarāyakara` đang dịch "gây giác ngộ và tạo chướng ngại" (`:6.4`, `:7.3`, `:8.3`, `:9.1`, tiêu đề); `antarāyakara` ở nơi khác là "gây trở ngại"; và `tena dosena` ở `:4.5`, `:5.5` dịch "lòng thù hận ấy" trong khi `dosa` ở đây có thể là lỗi/tội vừa nêu.
  - Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`; điểm `quality` giữ nguyên.
  Sửa lan 2026-10-13: cụm `abhisamayantarāyakara` (`:6.4`, `:7.3`, `:8.3`, `:9.1`, tiêu đề `:0.4` và colophon `:10.1`) «gây giác ngộ và tạo chướng ngại» → «gây trở ngại cho sự giác ngộ» (`antarāyakara` là «làm chướng ngại cho…», không phải «gây» rồi «tạo chướng ngại»; các khoá `antarāya…` ở nơi khác dịch «gây trở ngại»); `translationTitle` đổi tương ứng thành «Câu Hỏi Về Việc Gây Trở Ngại Cho Sự Giác Ngộ». `tena dosena` (`:4.5`, `:5.5`) «bị lòng thù hận ấy chặn đứt» → «bị lỗi ấy chặn đứt» (`dosa` ở đây là lỗi/tội vừa nêu, như `ja517:6.3`, `ja517:10.5`, `ja517:15.3`, `ja517:20.3` «vì lỗi ấy»; không có «thù hận»). Mục «Ghi nhận, chưa sửa» ở trên về hai cụm này nay đã xử lý. Pāli trùng nguyên văn trong chính bài: `:6.4`, `:7.3`, `:8.3` (Việt giống nhau); `:4.5` và `:5.5` chỉ khác ở `dhamma-` trong Pāli nên giữ khác ở «Chánh pháp». Điểm và status giữ nguyên.
