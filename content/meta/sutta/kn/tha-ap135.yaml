  TÊN RIÊNG KHAI VÀO BỘ NHỚ TIẾN TRÌNH.
  `Candanapūjanaka` là tên riêng Pāli thật của bài — có mặt ở `Itthaṁ sudaṁ āyasmā
  candanapūjanako thero` và ở `Candanapūjanakattherassāpadānaṁ tatiyaṁ` — nhưng chưa từng xuất
  hiện ở tầng Việt. Khai vào `_TỪ_VI` theo đúng cơ chế `lọt_pāli(pāli_riêng=…)` mà docstring
  của `_hvi.py` dành riêng cho trường hợp này; KHÔNG sửa `_hvi.py`. Đo lại trên tầng Việt TRƯỚC
  lát 54 thì đúng 3 khoá cần khai: 0.3, 10.1, 11.1.

  BẤT ĐỊNH ĐÃ PHÂN XỬ, GHI LẠI.
  (1) `Vipinaggena niyyāsi` (2.3): `vipinagga` là không một chút dối trá, `niyyāsi` là rời đi
  (Sujato: departed without deceit). Bản nháp đầu ghi ngự đi — thêm hình ảnh không có trong Pāli
  — đã sửa thành đã rời đi không một chút dối trá.
  (2) `Atthadassī` (2.1): hai tiền lệ 1x mỗi cách. Chọn bậc Đã Thấy Pháp vì là thuật ngữ Việt
  quen thuộc; giữ `tu` (chữ bổ nghĩa) bằng Nhưng.
  (3) `purisājañña` (3.1): hai tiền lệ — bậc chân nhân và bậc tuấn mã. Chọn bậc hiểu biết người
  đời để không lặp lại `narāsabho` (Nhân Ngưu) đã dùng ở 2.2 và 6.2. Người biên tập có thể
  muốn chọn lại.
  (4) `ito āsiṁsu te tayo` (8.2): `ito` rất mơ hồ. Đọc là ngươi là người thứ ba trong số ấy, khớp
  với `Rohaṇī nāma nāmena` và số nhiều `mahabbalā` ở 8.4. NGƯỜI BIÊN TẬP NÊN KIỂM.
  (5) `Saṅghāṭiṁ pattharitvāna` + `pallaṅkena` (4.3–4.4): hai từ chỉ vải. Giọng kể kinnara đang
  bay nên dịch là bung tấm áo ngoài rồi cùng tấm chiếu bay tới; KHÔNG ghi chú làm cánh vào
  thân kinh vì Pāli không nói.
  (6) `Duggatiṁ` (7.3): dùng nguyên văn đa số 98/294 là rơi vào khổ đau — cách này lấy nghĩa
  `dukkha`, khác 197 lượt còn lại trong kho dùng đọa xứ. Đã đồng nhất trong cả bài.
  (7) `Aṭṭhamabhāṇavāraṁ` (11.2): không có tiền lệ đúng giá trị Pāli; đối xứng `Catutthabhāṇavāraṁ.`
  → Lần thứ tư (tha-ap32) nên dịch Lần thứ tám.

