  Tên phẩm và tiêu đề — đa số ĐO ĐƯỢC trên tầng Việt dự án:
  · `Therīgāthā 10.1` (0.1): giữ số **47 tệp** ⟵ bỏ số 12 tệp (trong đó 8 tệp dùng *Trưởng Lão
    Ni Kệ 5.x*, 4 tệp dùng *Therīgāthā* trần). Chọn đa số.
  · `Ekādasakanipāta` (0.2): *Bộ Mười Một Bài Kinh*. Đây là **2 tệp có đúng Pāli này**
    (`ja460:0.2`, `ja460:0.1` = *Jātaka*), và nó khớp khuôn đa số của cả tầng: *Bộ Một Bài Kinh*
    18, *Bộ Hai* 10, *Bộ Ba* 8, *Bộ Bốn* 1, *Bộ Tám* 1, *Bộ Chín* 1.
  · `Kisāgotamītherīgāthā` (0.3) → *Kinh Kệ Của Trưởng Lão Nữ Kisāgotamī*, theo khuôn
    `Xtherīgāthā` → *Kinh Kệ Của Trưởng Lão Nữ X* (đa số ~28 tệp; vd `thig1.5`, `thig2.1`,
    `thig3.1`).
  · Tên riêng viết **liền một chữ `Kisāgotamī`**: 13 lần trong tầng Việt dự án (`sn5.3` ×6,
    `an1.246`, `dhp114/287/395`), khác với `mn146:2.1` dùng `Gotamī` đứng riêng. Chọn đa số cho
    đúng người này.
  · `Ekādasakanipāto niṭṭhito` (13.1) → *Bộ Mười Một Bài Kinh đã hoàn tất.*  Tiền lệ chia
    đều **2–2**: *đã hoàn tất.* (`thig1.18:3.1`, `thig4.1:6.1`) ⟵ *đã kết thúc.*
    (`thig2.10:4.1`) ⟵ *kết thúc.* (`thig3.8:5.1`). Chọn *đã hoàn tất* vì `thig1.18` có **cùng
    cấu trúc** — bài đầu tiên của một `nipāta` — nên phép so đốu gần nhất ủng hộ nó. Người biên
    tập nếu muốn thống nhất cả bốn tệp thì việc đó ngoài lát này.

  Dấu lược: chỉ một khoá có dấu lược ở Pāli là `12.1` `… Kisā gotamī therī ….` — **hai** dấu.
  Bản Việt giữ **đúng hai**: `… Trưởng lão nữ Kisāgotamī …`. 48 khoá còn lại khớp 0 = 0. Không
  khoá nào bị mở rộng. Ở `thig1.5:2.1` và `thig5.1:6.1` cùng khuôn `… X ….`, tiền lệ lại
  chia làm hai: `thig5.1` giữ hai dấu, `thig1.5` thay bằng lời dẫn — tôi theo `thig5.1` vì
  theo luật của kho, `…` ở Pāli là dấu đánh dấu lược và mở rộng chỗ lược là thêm chữ không
  nguồn nào chứng thực tại.

  Nháy kép: Pāli mở `“` ở `1.1`, `4.1`, `6.1`, `8.1` và đóng `”` ở `3.4`, `5.4`, `7.4`, `11.4` —
  tức **hai lời thoại kéo dài** (kệ khen tình bạn 1.1–3.4, lời giảng của Đức Phật 4.1–5.4,
  lời kể của Kisā 6.1–7.4, lời thương của Kisā 8.1–8.4) cùng một lời thứ năm ở 11.x. Bản Việt
  đặt nháy **đúng vị trí Pāli đặt** và cân 4 = 4; `ngoặc()` của `_hvi.py` xác nhận.

  BẤT ĐỊNH CẦN NGƯỜI BIÊN TẬP XỬ:
  · `5.1` `Galake api kantanti,` — **Pāli chống lại bản Anh Sujato.** Sujato dịch *"some
    women even cut their own throat"*, nhưng `galake` là **tân ngữ** (đứa trẻ sơ sinh) và là tân
    ngữ đối tượng; chủ ngữ là phụ nữ đang nói ở 4.1–4.4. Theo luật Pāli là authority cuối cùng
    tôi dịch *Có kẻ bẻ cổ đứa trẻ,*. Đây là điểm cố ý **không** theo Sujato; ghi lại để
    người biên tập cân. (`gala` chỉ xuất hiện 1 lần trong toàn bộ Pāli root đã ghim — đúng
    khoá này — nên không có tiền lệ đối chiếu.)
  · `5.2` `Sukhumāliniyo visāni khādanti;` — Sujato dịch *"take poison"*, Pāli `khādanti` là *ăn,
    nuốt*. Tôi dịch *nuốt phải độc*, giữ nghĩa gốc. `sukhumālinī` chỉ có 1 nơi khác
    (`mil3.4.6:4.2`, cũng chỉ là danh từ) nên 0 tiền lệ dịch; tôi dùng *nữ mảnh khảnh*.
  · `4.2` `Akkhāto purisadammasārathinā;` — **0 tiền lệ trong cả tầng** (quét
    `purisadammasārathinā` trên 5.307 tệp Việt và trên toàn bộ Pāli root). `sārathi` là *người
    cầm cương, người chỉ đường*, `purisadammasārathi` = bậc chỉ đường cho loài người trong
    pháp, tức Đức Phật. Tôi dịch *bậc Dẫn Đạo về pháp của loài người*; đây là cách dịch này
    mà tôi tự chọn, cần biên tập xác nhận.
  · `4.3–4.4` `Sapattikampi hi dukkhaṁ … sakiṁ vijātāyo` — Sujato đưa vào ngoặc kép (*"and for
    a co-wife it's especially so"*) như thể đó là lời Kisā; Pāli không có dấu nháy riêng cho
    đoạn này. Tôi giữ nguyên cấu trúc Pāli: lời giảng của Đức Phật liên tục trong một khối
    4.1–5.4, chỉ giữ chữ *và*, *nhất là* để dấu vế nối còn rõ.
  · `9.4` `Matapatikā amatamadhigacchiṁ.` — **khó nhất của bài.** `matapatikā` là một chữ, có thể
    là (i) `matā` + `pitā` + `bhātā` bị nén như `7.3` *Mātā pitā ca bhātā*, hoặc (ii) `mata`
    (đã chết) + `patikā`, theo cách Sujato hiểu là *my husband dead*. Tôi **không** chọn cách
    nào: dịch vế thành *tôi mới chấp nhận được sự bất tử.* và để vế không chủ thể, vì chủ ngữ
    mà Pāli viết ở đây thật sự không đọc được chắc, còn `amatamadhigacchiṁ` = *đạt đến bất tử*
    thì rõ. Người biên tập nên tra `tha-ap`/thảo luận về `matapatikā`; tôi không bịa danh xưng.
  · `8.2–8.4` `Anubhūtaṁ te dukhaṁ aparimāṇaṁ … jātisahassāni` — `jātisahassāni` = *hàng trăm
    ngàn kiếp*; Sujato dịch *"for many thousands of lives"*. Tôi dịch *suốt nhiều kiếp trăm
    ngàn đời* để giữ `jāti` (kiếp, đời sống) chứ không hoán đổi thành *kiếp*; cả hai cách đều
    defend được.
  · `7.4` `Ḍayhanti ca ekacitakāyaṁ` — 0 tiền lệ. `cītaka` là **giàn hỏa thiêu** (hiện tại,
    dùng ở `kha-latā`, `ud5.3:12.x`, `therī:0.x`); `ekacitakāya` = *trên một đám*. Tôi dịch
    *một đám hỏa thiêu*; Sujato dịch *"the same pyre"* — cùng nghĩa.
  · `9.1` `Vasitā susānamajjhe,` — `vasitā` = *ở/đã cư ngụ tại*; `susāna` = **nghĩa địa**
    (`dn22`, `dn27`, `ja417` dùng *nghĩa địa*/*cõi đời này*), `majjhe` = *ở giữa*, và `maṃ` là
    cơ sở của thành. Tôi dịch *giữa nghĩa địa trong thành*, ghép `vasitā` vào *Khi ở …*.
  · `7.2` `kapaṇikāya` — tiếng thán từ *khốn khổ thay*. `kapaṇa` trong tầng Việt dự án thường
    là *người khốn khổ* (`ud5.3`, `cnd7`, `an8.42`) — ở đây là thán từ đứng riêng nên tôi dịch
    *khốn khổ thay* chứ không dịch là *người khốn khổ*.
  · `10.1` `Bhāvito me maggo,` — Sujato thêm *noble eightfold* vào `maggo` dù Pāli chỉ có
    `maggo`; `ariyo aṭṭhaṅgiko` ở 10.2 mới là *bậc Thánh tám chi phần*. Tôi dịch 10.1 là *bậc
    Đạo* và 10.2 là *bậc Thánh tám chi phần dẫn đến bất tử* để không lặp *tám chi phần* hai
    lần. `sacchikataṁ` (10.3) → *chứng ngộ* theo 28 lần ở `mn70` (*chứng ngộ và chạm đến bằng
    trí tuệ*).

