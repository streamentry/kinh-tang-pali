  BẤT ĐỊNH CÒN LẠI (ghi ở đây, **không** thêm vào thân kinh).
    · `:6.3` `Titthañca sabbabuddhānaṁ` → *là bến qua của mọi bậc Giác ngộ*. `titthi` đọc
      được hai nghĩa không tương đương nhau: **bến / điểm vượt qua** (Sujato đọc *the ford where
      all the Buddhas cross over*) hoặc **chỗ đứng vững / nền tảng** (nghĩa thường của `titthi`
      trong kinh điển, và hợp với việc các câu kệ trước xếp `sīla` là *ranh giới*, *sự thu
      thúc*, *sự lặp lại của tâm*). Bản Việt theo cách đọc thứ nhất. Chỗ này **chưa phân
      xử**, và tầng không có tiền lệ nào cho công thức này để cân. Người biên tập nếu chọn cách
      đọc thứ hai thì chỉ sửa một khoá, không đụng khoá khác.
    · `:8.1` `Sīlaṁ setu mahesakkho` → *là cầu nối vững chắc*. Tôi đọc `mahesakkho` là **tính
      từ** bổ nghĩa cho `setu`, không phải danh từ *bậc trưởng lão*, vì nó đứng giữa pāda sau
      danh từ và cấu trúc song song `9.1–9.3` xác nhận đây là danh ngữ ba danh từ; tầng cũng
      dùng `mahesakkha` làm tính từ (`an4.33:1.9`, `an5.199:3.1`). **Cách đọc này là suy luận
      từ ngữ pháp và tiền lệ dùng từ, chưa có tra chứng từ điển**, nên ghi lại thay vì giả vờ
      đã chắc.
    · Bốn siêu từ `agga` (`12.1`), `uttama` (`7.2`, `9.2`, `12.2`), `seṭṭha` (`7.3`, `8.3`) và
      `anuttara` (`8.2`) đều dịch *tối thượng* nên bị làm phẳng. Trong Pāli chúng gần nghĩa
      nhau nên tôi giữ, nhưng `7.1` `appaṭimaṁ` lại dịch *không gì sánh bằng* cho cùng một ý
      ⇒ hơi không nhất quán trong chính bài. Đây là lý do `terminology: 8.8`.

