  SỬA 1 KHOÁ (đọc hết 53, tìm ra đúng một).
  `:3.3`. **LỖI ĐẢO VAI CHỦ THỂ — TÁC NHÂN / BỊ NẠN NHÂN.** Pāli `Dussīlo pana mittehi,
  dhaṁsate pāpamācaraṁ`. `mittehi` là **cách số nhiều của `mitta`** (chữ `hi` tức `-ehi`), nên
  nó là **tác nhân**: *bởi bạn bè*; còn `dhaṁsate` mang đuôi thụ động `-te` ⇒ *bị đẩy đi*;
  `pāpamācaraṁ` là chủ ngữ. Bản dịch cũ viết *"Còn kẻ thiếu giới, **cùng bạn bè** bị đẩy đi,
  kẻ làm điều ác"*, tức biến bạn bè thành **người bị đẩy đi đi cùng**, đảo ngược quan hệ tác
  nhân — và đảo mất đúng ý đối lập với `3.1–3.2` (người có giới *có được* bạn nhờ tự chế).
  Đã sửa thành *"Còn kẻ thiếu giới, bị bạn bè đẩy đi, kẻ làm điều ác."*
  Tiền lệ đã đo: `mittehi`/`paccāmittehi` trong tầng luôn là tác nhân (`dn30:1.11.6`,
  `dn30:1.6.4` dịch *bởi kẻ thù địch*); `dhaṁsate` thụ động luôn dịch *bị …* (5 khoá
  `an4.61` dịch *bị tan rã*, `thag3.3`/`thag3.15` dịch *bị thiêu đốt*). Sujato đọc ngược
  (*drives away their friends*) nhưng cách đó **không đúng ngữ pháp**: `dhaṁsate` không thể
  chủ động và `mittehi` không phải tân ngữ (tân ngữ số nhiều là `mitte`). Pāli là authority
  cuối cùng nên tôi theo Pāli và ghi lại ở đây.

  ĐÃ ĐO MÀ CỐ TÌNH KHÔNG SỬA — ba chỗ trông như lỗi nhưng đo ra là tiền lệ hoặc đúng.
    · `:8.1` `Sīlaṁ setu mahesakkho` → *"là cầu nối vững chắc"*. Trông như bỏ mất `mahesakkho`
      (nếu đọc là *"bậc trưởng lão"*) và thêm *"vững chắc"*. Nhưng `mahesakkho` ở giữa pāda và
      đứng sau danh từ là **tính từ** bổ nghĩa cho `setu` = *cầu nối vững chắc / uy lực*, và
      tầng dùng `mahesakkha` làm tính từ (`an4.33:1.9` *có oai lực lớn*, `an5.199:3.1` *có uy
      thế lớn*). Cấu trúc song song `9.1–9.3` (`sambalamevaggaṁ` / `pātheyyamuttamaṁ` /
      `seṭṭho ativāho`) xác nhận đây là danh ngữ ba danh từ, không phải câu kể. Không sửa.
    · `:3.3` trước khi sửa còn hợp với `Sujato`; đã nêu lý do ở trên.
    · `:12.5` `… Sīlavo thero ….` → *"… Trưởng lão Sīlavattha …."*. Bản Anh để trống. Khuôn
      đo ở `thag`: **194/227** dòng bìa Pāli `… X thero ….` dịch kết `….` không có khoảng
      trắng trước (toàn tầng thì ` ….` mới là đa số 398/760 — nhưng phạm vi gần hơn là
      `thag`, nên tôi theo `thag`). Giữ **đúng hai** dấu lược, không gộp.

