  mang lời của Pāli `:2.1`, `:3.2` mang lời của Pāli `:3.1`, v.v. — tức bản Anh không khớp
  ranh giới khoá Pāli, nên **không dùng được như neo đối chiếu ở mức khoá**. Nó cũng **tự
