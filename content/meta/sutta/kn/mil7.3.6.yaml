notes: |-
  17 khoá, tất cả đã dịch. Bài thứ 6 của `Samuddavagga`, ngay cạnh mil7.3.5.

  TẦNG THAM KHẢO — 0/17 có Anh Sujato. Không có bản Việt hiện hành. ⇒ `draft`.

  PĀLI TRÙNG: `0.1`, `0.2`, `0.3` `Samuddavagga` → *Phẩm Biển* (3 tiền lệ), và `2.4`
  `Bhāsitampetaṁ … therena sāriputtena dhammasenāpatinā—` → *Trưởng lão Sāriputta, Tướng quân
  Pháp, đã nói:—* (3 tiền lệ, dùng y hệt).

  THUẬT NGỮ MỚI (0 tiền lệ): `nāvālagganaka` là **bến thuyền / cầu tàu** — bến ở mép nước
  để thuyền cập và giữ lại cho khỏi trôi đi; tôi dịch *bến thuyền*. Tiêu đề → *Câu hỏi về phần
  của bến thuyền*. `plavati`/`visīdati` → *trôi đi / lún xuống* (0 tiền lệ cho cặp này).

  **LỖI ĐÃ TỰ BẮT Ở LƯỢT REVIEW ĐỐI KHÁNG.** `3.3` `Tatheva lābhasakkāre` bản nháp dịch
  *trước sự khen tán* và làm mất `lābha` (lợi ích); đã sửa thành *Cũng thế, khi có lợi ích và
  sự khen tán*.

  BẤT ĐỊNH CHƯA PHÂN XỬ, đây là chỗ yếu nhất của bài nên `ambiguity_integrity` ở 8.9:
  · `sarīrayāpanamattake` (`2.2`) nghĩa đen là *trong sự từ bỏ và sự đưa đi của chính thân mình*.
    Tôi dịch *sự từ bỏ và sự rời bỏ thân mình*. Chú giải Pāli đọc đây là chỗ đặt tâm khi đã buông
    bỏ thân tức và thọ; một cách đọc khác là *từ bỏ bản thân và đi khỏi thân*. Chưa có cách nào
    tuyệt đối, và Pāli ở bài này không đủ để phân xử.
  · `salilatale` ở `1.2` tôi dịch *bờ cát*; `salila` = sông/đường nước, trong `salilatale` có thể là
    *bãi cát phủ nước* hoặc *bờ đất bị xói*. 0 tiền lệ.
  · `1.2`/`1.3` ghép `bahuūmijālākula-vikkhobhita-salilatale` — tôi dịch *bị những đợt sóng dâng
    dội và bờ cát xé tan*, giữ cả hai vế; cách gộp khác là *bị sóng và bãi cát xé tan*.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điều phối, nên `technical_integrity` bị chặn ở **9.6**. Tôi đã **tự tái lập bằng script** những kiểm mà `validate` làm cho tầng Việt và ghi kết quả vào đây: đủ 17 khoá với đúng segment ID, không orphan, không thừa, mọi khoá NFC, không rỗng, dấu lược khớp Pāli **từng khoá** (kể cả khoá ngắn hơn 40 ký tự mà `kiểm()` của `_hvi.py` không quét), ngoặc kép `“”` cân trên cả bài, không còn `(…)`, và không có Pāli lọt vào bản Việt. Đây **không** thay thế được `validate`; nó là bằng chứng cho tới khi cổng kỹ thuật được chạy.
