notes: |-
  ĐỌC HẾT p44.txt trước khi viết. 0.1 Therāpadāna giữ nguyên Pāli (291/300 khoá :0.1 của tầng tha-ap). 0.2 Ekavihārivagga = Phẩm Sống Một Mình (2/3 tệp). 0.3 dùng tiều tố đa số Bài Kệ Tuyên Ngợ Về Trưởng Lão; Pāli ở đây không có số thứ tự nên tôi không thêm. 11.1 thứ tư (27/34 tệp).
  NHÓM KỆ 7.x, 8.x, 9.x trùng nguyên văn ở cả sáu bài tha-ap của lát này: tôi dùng lại đúng một bản Việt cho từng Pāli, lấy theo đa số đo được (Các phiền não của ta đã được thiêu rụi 56/85 · ta sống không còn lậu hoặc 56/84 · Thật lành thay sự đến của ta 54/82 · đã làm tròn lời dạy của Đức Phật 60/82 · Bốn vô ngại giải 300/300 · đã làm tròn lời dạy của Đức Phật”. 270/299 · …pe… giữ đúng một dấu lược).
  KỆ KẾT 6.1-6.4 dùng chung khuôn với năm bài anh em: Vào một trăm ngàn đại kiếp trước (7/13 tệp) · ta gọi Ngài là Đức Phật tối thượng (cùng công thức buddhaseṭṭhaṁ thaviṁ ahaṁ) · Ta không biết mình rơi vào khổ đau (93/278 tệp) · đây là quả báo của việc ca ngợi tri thức ấy. ñāṇatthavā là ñāṇatthavika rút gọn, tôi dịch là ca ngợi tri thức chứ không dịch rời tên riêng.
  TÊN VÀ THUẬT NGỮ ĐÃ TRA. Kaṇikāraṁva jalitaṁ = Rực sáng như hoa Kaṇikāra (tha-ap389:1.1, nguyên văn; 19 khoá trong tầng đã dùng chữ Kaṇikāra) · Ekaṁsaṁ ajinaṁ katvā = Vắt tấm da thú lên một bên vai (2/2 tệp) · addasaṁ dvipaduttamaṁ = bậc song chân tối thượng (tha-ap372:4.2) · vākacīra = y vỏ cây (tha-ap260:1.2, tha-ap88:1.2) · buddhaseṭṭhaṁ = Đức Phật tối thượng (5/7 tệp) · mahāvīraṁ = bậc Đại Anh Hùng (2 tệp) · mahāmuni = bậc Đại Mâu-ni (5/11 tệp) · Itthaṁ sudaṁ … như trên. 0 tiền lệ: tamandhakāra (cây ta-mà-rạch), dīparukkha (cây đèn đang cháy), kamaṇḍalu (quạt tròn), kuṇḍika (bình nước), mohajāla (màn lưới của si mê), ñāṇāloka (thế giới của sự hiểu biết), nittiṇṇo (hoàn toàn vắng lậu hoặc), sabbaññuta (bậc Toàn Giải), sabbaññutamanāvara (bậc Toàn Giải không gì sánh bằng).
  BẤT ĐỊNH ĐÃ GHI NHẬN. (1) 3.1 Tamandhakāraṁ vidhamaṁ: 0 tiền lệ cho vidhamaṁ trong ngữ cảnh này và ba chữ cuối của câu (Ñāṇālokaṁ dassetvāna … mahāmuni) là một mệnh đề; tôi dịch giữ nguyên vị trí chủ ngữ với Bên gốc cây ta-mà-rạch, Ngài chỉ bày thế giới của sự hiểu biết, bậc Đại Mâu-ni khiến tôi hoàn toàn vắng lậu hoặc, không diễn giải thêm ý nào. Nếu biên tập muốn nối liền 3.4 với 2.4 thì đó là dịch khác, phải sửa cả hai khoá. (2) 4.1 Samuddharasimaṁ lokaṁ tôi dịch Nguyên thế giới này rộng như biển cả; samuddharasima là hình ảnh đại dương bao quanh, không phải thành. (3) Nháy kép: Pāli mở ở 1.1 bằng nháy kép nhưng đóng bằng nháy đơn ở 5.4, và nháy kép đóng lại ở 9.3; tôi giữ đúng bố cục đó, nên tổng vẫn cân.
  Cổng kỹ thuật do người điều phối chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.
