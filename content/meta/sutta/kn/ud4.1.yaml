notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud4.1:22.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud4.1:22.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Rà nhất quán theo Pāli trùng 2026-10-14 (lượt quét lỏng): khoá 7.5 (sửa lan 1.6 và 7.6) — “ngươi” → “ông” cho Đức Phật nói với Tôn giả Meghiya; `Yassadāni tvaṁ, meghiya, kālaṁ maññasī` bản trước thêm “hãy đi” (Pāli không có động từ này) → “nay ông thấy lúc nào thích hợp thì cứ làm” (theo `an9.3:6.6`), và 7.5 “ngươi nói ‘tinh tấn’, vậy Ta biết nói gì” → “khi ông nói đến tinh tấn, thì Ta biết nói gì” (bỏ nháy đơn vì Pāli khoá này không có nháy); khoá 4.6 (sửa lan 2.5) — “xứng đáng” → “thích hợp” cho `alaṁ` (theo `an9.3:4.6`; giữ “tinh tấn” cho `padhāna`, dạng đa số toàn tầng: 1.967 chỗ so với “tinh cần” 780); khoá 9.3 và 10.6 — “Ta đã vì lòng tin xuất gia” → “Chúng ta quả thật đã vì lòng tin mà xuất gia” (`vatamhā` là ngôi thứ nhất số nhiều và có `vata`; theo `an9.3:7.6`, `an9.3:9.5`); khoá 21.1 — thêm “Và” (`tena ca pana`), “vị tỳ-kheo ấy”, “sau khi đã đứng vững trong năm pháp này” (theo `an9.3:19.1`). Giữ nguyên khoá 16.1 vì “trí tuệ thấy sự sinh diệt … dẫn đến sự tận diệt khổ đau hoàn toàn” đúng `udayatthagāminiyā … sammā dukkhakkhayagāminiyā` và nhất quán với khoá 20.1.
