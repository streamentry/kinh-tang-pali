notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của `_hvi.py` gần như vô dụng ở bài này**: nó chỉ quét khoá Pāli từ 40 ký tự trở lên, mà mọi vế kệ ở đây đều ngắn hơn, nên `cần` rỗng và assertion không chạy. Vì vậy tôi tự quét **toàn bộ** khoá từ đĩa: đủ khoá, đúng exact ID, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài, không Pāli lọt, không `(…)`. Kết quả: **0 lỗi trên 252 khoá**.
  - |-
    **Đã tự dựng chỉ mục Pāli↔Việt toàn tầng rồi so khoá của lát, không đoán.** Nạp mọi tệp Pāli gốc trong cache (284.708 khoá) và mọi tệp Việt dự án (111.657 khoá), ghép theo khoá vì khoá là duy nhất toàn hệ thống. Lát này tìm được **1 khoá có Pāli trùng nguyên văn với bài đã có bản Việt ngoài lát (1 cặp)**, và **16 cụm Pāli trùng nguyên văn nội lát**. Mọi bản Việt đã có đều được dùng lại nguyên văn, không dịch lần hai.
  - |-
    **Đây là bài mà `kiểm()` không bắt được gì cả**: không một vế kệ nào dài 40 ký tự, nên `cần` rỗng. Toàn bộ 18 khoá chỉ được bảo đảm bởi lượt quét tự viết.
  - |-
    **Dùng lại y nguyên.** `1.3–1.4` là nguyên văn của `thig3.1:2.1–2.2` trong chính lát, dịch giống hệt, chỉ khác dấu chấm câu vì Pāli khác (`;` và `.`) · `2.4` `khandhāyatanadhātuyo` là nguyên văn của sn8.12:3.2 → *các uẩn, các xứ và các giới* · `0.2` dùng *Bộ Ba Bài Kinh* (mẫu *Bộ Một Bài Kinh*, *Bộ Hai Bài Kinh* ở thig1.x/thig2.x) · `0.3` theo mẫu 29 tệp thig: *Kinh Kệ Của Trưởng Lão Nữ <tên>*.
  - |-
    **Bản Anh đã ghim đầy đủ cả 18 khoá**, kể cả `4.1` — nên đây là bài kệ duy nhất của lát có thể tam giác đối chiếu từng vế bằng một tầng tham khảo tiếng Anh. Chỗ Sujato chọn khác: `Sattāhaṁ ekapallaṅkena` hắn dịch *for seven days without moving*, tôi dịch *suốt bảy ngày tôi ngồi kiết già* — `ekapallaṅka` là tư thế ngồi kiết già chứ không phải *không cử động*, nên Pāli thắng.
  - |-
    **Review đối kháng bắt được 1 lỗi văn phong.** `2.2` `yā me saddhāyikā ahu` bản nháp tôi viết *vị mà tôi có lòng tin nơi* — lủng củng; sửa thành *vị mà tôi tin tưởng nơi*.
  - |-
    **Bất định.** `Catukkhattuṁ pañcakkhattuṁ` là *bốn lần hoặc năm lần*; tôi dịch *Bốn lần năm lần* vì Pāli đã lược `vā`, và thêm dấu chấm phẩy thay cho chữ *hoặc* để câu tiếng Việt đọc được. Đây là nén có dấu, không phải mở rộng, nên không vi phạm quy tắc dấu lược.
