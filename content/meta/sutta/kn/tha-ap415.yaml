notes: |-
  Dịch từ Pāli root tại commit đã ghim; đủ 111 khoá, thứ tự và tập khoá khớp Pāli, không có khoá ngoài Pāli. Không có bản Anh Sujato, bản Việt phân đoạn hay english-project cho bài này, nên không có đối chiếu English độc lập; bản dịch dựa trên Pāli và tiền lệ đếm được của nhóm tha-ap.

  Tên bài. 0.3 và translationTitle là cùng một chuỗi: 3. Ký Sự Về Trưởng Lão Tiṇasūlakachādaniya. Pāli ở 0.3 bắt đầu bằng số 3 nên bản Việt giữ số theo hình thức N. (cùng kiểu tha-ap417, Pāli 5 Nāgapallava, Việt 5.). 30.1 đọc lại tên đó không kèm số rồi thêm thứ ba (Pāli tatiyaṁ). Kiểu mở đầu tên: đo ở phạm vi gần (tha-ap400–449, trừ bài này) là Ký Sự Về 16, Bài Kệ Tuyên Ngợ 13, Bài Kệ Tuyên Ngôn 6; đo toàn nhóm tha-ap là Bài Kệ Tuyên Ngợ 235, Bài Kệ Tuyên Ngôn 134, Ký Sự Về 113. Tuyên Ngợ là chính tả sai, còn Tuyên Ngôn không phải nghĩa của apadāna; bài này theo Ký Sự Về Trưởng Lão như tha-ap416, tha-ap417, tha-ap419 và tha-ap420 cùng phẩm (tha-ap422 dùng Bài Kệ Tuyên Ngôn). Hai phạm vi cho hai đa số khác nhau, nên để người biên tập phán một lượt cho cả cuốn. Tên người giữ dạng Pāli Tiṇasūlakachādaniya: gồm tiṇasūlaka (xem bất định 1) và chādaniya (người phủ, theo chādesi ở 15.1); không dịch nghĩa vào tên. 0.1 giữ Therāpadāna (495 trên 506 bài đã dịch làm vậy). 0.2 là Phẩm Bhaddāli, theo các bài cùng phẩm.

  Số Pāli. Pañcavīsatikkhattuṁ (16.1): pañcavīsati là 25, nên hai mươi lăm lần (tầng đã dịch Pañcavīsatikkhattuñca là và hai mươi lăm lần, 3 khoá). Pañcasattatikkhattuñca (16.3): pañca 5 cộng sattati 70 là 75, nên bảy mươi lăm lần (3 khoá cùng Pāli trong tầng, 2 khoá dịch Lại thêm bảy mươi lăm lần nữa, 1 khoá dịch Và bảy mươi lăm lần; giữ dạng 2 khoá). Dvenavute (25.1): dve 2 cộng navuti 90 là 92, nên chín mươi hai kiếp trước (42 khoá cùng Pāli). Aṭṭhārasamaṁ (20.1): thứ mười tám (bhāṇavāra: tầng đa số dịch Phần tụng đọc thứ N, 9 trên 13 khoá). Catukkamo (5.2) là đi bằng bốn chân. Không có cụm Tiṁsakappasahassa nên không có bất định về số lớn nào chưa phân xử được. Lưu ý lời dặn của người điều phối về tiṁsa là 30: bài này không chứa tiṁsa; ở đây không có số kiếp tính về sau, kappe ở 25.1 là kiếp trước (lời tự thuật quá khứ). Lời thọ ký ở 15.1–19.4 là lời Đức Tissa nói về tương lai của người cúng hoa (karissati, bhavissati, pātubhavissati, nibbāyissati); bản Việt giữ thì tương lai sẽ và gọi người ấy là vị ấy, không đổi thành quá khứ.

  Dấu lược: ba khoá 26.2, 27.2, 28.2 có Pāli …pe… nên bản Việt mỗi khoá là đúng một …; Pāli không có … hay (…) ở khoá nào khác nên bản Việt cũng không có. Nháy: Pāli mở ngoặc kép ở 1.1 và đóng ở 28.3; nháy đơn mở ở 9.1 và đóng ở 12.4, mở ở 15.1 và đóng ở 19.4; bản Việt khớp Pāli từng khoá, 0 lệch trên 111 khoá (đo từng khoá, không đo cân tổng).

  Tái dùng nguyên văn tầng và phạm vi đã dò: tra từng khoá Pāli của bài trên 506 bài tha-ap khác đã dịch (không tính ba khoá …pe…, mỗi khoá có hơn 680 cặp trùng); 47 khoá có Pāli trùng nguyên văn với bài khác (3.310 cặp Pāli trùng đã dò), trong đó 33 khoá có bản Việt trùng với một cách dịch đã dùng và 27 khoá trùng đúng cách dịch phổ biến nhất của tầng; 14 khoá khác tiền lệ có chủ ý: 3.2 và 4.4 (ta sống trong am thất, bỏ từng và thảo am), 5.2 và 5.3, 8.3 (Rực rỡ như sao mai), 12.3 và 21.1 (Sau khi thiêu đốt phiền não: tiền lệ duy nhất của tầng dịch Sau khi dập tắt uế nhiễm, nhưng kilesā là phiền não ở 148 khoá cùng Pāli với 26.1, và jhāpita ở 26.1 đã là thiêu rụi), 14.2, 17.2, 19.4, 21.2, 21.3 (chỉ khác chữ hoa đầu dòng), 24.1 (ngôi ta). Sáu khoá có bản Việt trùng một cách dịch của tầng nhưng không phải cách phổ biến nhất: 1.4 (ta xuất gia sống đời không nhà: ngôi ta 2 khoá so với ngôi tôi 6, nhưng cả phẩm và bài dùng ngôi ta), 6.4 (ta nhìn thấy: nhìn thấy 12 khoá so với trông thấy 2), 17.1 (Vương quyền cai quản các vùng đất rộng lớn, 7 so với Vương quốc rộng lớn ấy 15; ấy không có trong Pāli), 21.4 (ta đã đạt tới bậc A-la-hán: ngôi ta 4 so với ngôi tôi 8, phạm vi gần 4 trên 4 là ngôi ta), 25.2 (khi ta cúng dường hoa ấy: 7 khoá, so với khi tôi dâng cúng hoa ấy 14), 25.3 (Ta không còn biết đến đọa xứ: phạm vi gần tha-ap400–449 là 13 so với Ta không biết mình rơi vào khổ đau 12, toàn nhóm 58 so với 137; duggati là đọa xứ chứ không phải khổ đau). Các lựa chọn đáng ghi: 14.1 Nhờ thấu rõ ý định của ta (ngôi ta 14 trên 30); 15.3 Ta sẽ tuyên thuyết về người ấy (11 trên 16); 21.3 ngồi trong một lần ngồi (5 trên 5); 23.4 và 25.4 đây là quả báo của việc cúng dường Đức Phật (50 khoá so với đó là 18); 7.3 và 13.3 Hân hoan với tâm hoan hỷ (10 trên 24, so với Hân hoan với tâm ý tràn đầy hỷ lạc 7); 19.4 vị ấy sẽ nhập Niết-bàn, không còn lậu hoặc (toàn tầng 8 khoá dịch sẽ vô lậu mà đi vào Niết-bàn và 8 khoá dịch sẽ nhập Niết-bàn, không còn lậu hoặc, hoà nhau; chọn dạng sau vì anāsavo là vị ngữ chỉ trạng thái và dạng đầu đảo quan hệ giữa Niết-bàn và vô lậu); 17.2 đếm không hết (tiền lệ đếm không hết, vô tận 8 khoá; bỏ vô tận vì asaṅkhiyaṁ đã có nghĩa đó). Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti dùng dạng Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (nhóm số nhiều), không dùng dạng số ít. Ngôi kể dùng ta ở mọi khổ (cùng phẩm, tha-ap416); Đức Tissa tự xưng ta, và 15.1–19.4 gọi người cúng hoa là vị ấy. Dòng thứ ba của mỗi khổ viết hoa chữ đầu theo Pāli (26.3, 27.3, 28.3 viết thường vì đi sau …).

  Pāli trùng trong chính bài: 6 nhóm Pāli trùng (7.2 và 13.2; 7.3 và 13.3; 12.3 và 21.1; 23.4 và 25.4; 24.4 và 26.3; ba khoá …pe… 26.2, 27.2, 28.2), mọi nhóm có bản Việt giống hệt nhau, 0 cặp mà bản Việt khác. Các cặp gần trùng chỉ khác dấu câu (3.2 và 4.4: ; và .; 27.3 và 28.3: . và ”.) mang đúng dấu câu của Pāli từng khoá.

  Bất định (không thêm vào thân kinh). (1) Tiṇasūla (13.4) và tiṇasūlaka (tên người, 0.3): theo tiền lệ duy nhất tha-ap159 là lưỡi cỏ, sūla là cái cọc nhọn; nhưng 15.1 Đức Phật nói người ấy phủ ngài bằng hoa (pupphehi chādesi), nên tiṇasūla có thể là một loại cỏ có hoa chứ không phải lưỡi cỏ nói chung; chưa phân xử được, 1 tiền lệ trong tầng, giữ lưỡi cỏ theo tiền lệ. (2) Nāgakesaraṁ (7.4): giữ hoa nāgakesara, không dịch nghĩa; tầng chỉ có tha-ap244 dịch nhụy hoa nāgakesara (Pāli ở đó là kesara), còn kesara trong tầng khi là nhụy khi là tên hoa, nên chưa chắc 7.4 là hoa hay nhụy hoa; 0 tiền lệ cùng Pāli. (3) 18.1 Sīsaṁnhāto cayaṁ poso: sīsaṁnhāto đọc là đã gội đầu (hapax trong tầng); cayaṁ đọc là ca ayaṁ (và người này; ayaṁ poso có 4 tiền lệ trong tầng đều dịch là người này); cách đọc khác coi caya là đống, chưa thấy căn cứ. 18.3 saṁyuttaṁ là trung tính cùng giống với pupphaṁ ở 18.2, nên 18.4 viết hoa sẽ hiện ra: hoa là chủ ngữ ngữ pháp đã có trong Pāli, không thêm nghĩa. (4) 19.1 yaṁ yaṁ icchati kāmehi: kāmehi là cách công cụ số nhiều, giữ trong các dục; cách đọc khác là bằng những điều mong muốn; 0 tiền lệ cùng Pāli trong tầng. (5) 9.3 ārādhayitvāna: đọc là sau khi làm đẹp lòng (Ngài); 0 tiền lệ trong tầng; cách đọc khác là sau khi chiều ý, sau khi phụng sự Ngài. 9.4 parimuccare là hiện tại ngôi ba số nhiều, dịch họ thoát khỏi sinh; chủ ngữ họ không nêu trong Pāli. 9.2 mocesimaṁ là mocesi cộng imaṁ (Ngài đã giải thoát thế gian này), không đọc là mocesiṁ ngôi thứ nhất. (6) 10.1 sabbaññu và 11.2 sabbaññu: đọc là hô cách (bậc Toàn Tri) nối với Đức Tissa, không phải tính từ của buddhānaṁ. 10.3 vīcinirayaṁ: giữ địa ngục Vīci, là dạng ngắn của Avīci theo vần kệ; 0 tiền lệ trong tầng. (7) 23.1–23.2 cīvare piṇḍapāte ca paccaye sayanāsane: paccaye dịch các vật dụng cần thiết (tiền lệ cīvaraṁ paccayañcahaṁ ở tha-ap340), sayanāsane chỗ nằm ngồi; 0 tiền lệ cho cả cụm. (8) 5.3 āsayā: hang ổ, và 5.4 asanī: tiếng sét; 6.3 migarājaṁ gavesanto: trong lúc tìm chúa loài thú, nêu cả hai lần chúa loài thú để người đọc thấy người kệ đi tìm con thú gầm và gặp Đức Phật; không giải thích thêm trong thân kinh. (9) 22.4 viharāmi ahaṁ sadā không có bổ ngữ, dịch ta luôn luôn an trú; 0 tiền lệ cùng Pāli (các khoá có sadā ở cuối dòng, như paricāremahaṁ sadā, dịch kiểu luôn luôn vui thú).

