  Sửa lát 2026-10-05 — 1 khoá: `tha-ap501:0.3` đặt lại số thứ tự `9.` ở đầu theo Pāli `9 Naḷakuṭidāyakattheraapadāna`; bản Việt trước đó bỏ mất số này (thông tin có nguồn). Số đọc từ Pāli, đối chiếu thêm bằng colophon ordinal. Chỉ đổi phần số, nội dung tên phẩm giữ nguyên.
