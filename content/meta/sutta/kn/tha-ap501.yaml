notes: |-

  Bản dịch tiếng Việt mới cho bài kinh tha-ap501 — trưởng lão Naḷakuṭidāyaka, bài thứ
  chín trong Kiṅkaṇipupphavagga.

  Tiền kiếp: không xa vùng núi Himavanta có một ngọn núi tên Hārito, bậc Tự Tại tên là Nārada
  ngự dưới gốc cây. Ông dựng một lều tranh phủ cỏ, dọn sạch đường kinh hành nhưng không dám
  tở ra với bậc Tự Tại. Nhờ nghiệp lành khéo làm ấy cùng với tâm nguyện và chí hướng, sau khi
  từ bỏ thân người ông đã đến cõi trời Ba mươi ba. Ở đó ông làm khéo làm bằng vàng một
  sân rộng sáu mươi do-tuần, dài ba mươi do-tuần, do vị naḷakuṭi tạo ra. Trong mười bối kiếp
  ông hưởng thọ ở cõi trời và làm vương quyền nơi chư thiên; ông từng làm Chuyển Luân Vương
  với vương quốc rộng lớn đếm không hết. Ông bước lên lầu đài của Pháp y hệt cả về mọi hình
  dạng và sống tùy ý muốn trong giáo pháp của Đức Phật. Vào ba mươi mốt kiếp trước, khi ông
  làm việc thiện lành ấy, ông không biết mình rơi vào khổ đau — đó là quả báo của việc dâng
  cúng bậc naḷakuṭi. Các phiền não của ông đã bị thiêu rụi, ông sống không còn lậu hoặc.
  Thật lành thay sự đến của ông, bốn vô ngại giải đã làm tròn lời dạy của Đức Phật.

  PÁI BẢN DÙNG LẠI NGUYÊN VĂN (luật: Pāli trùng thì khớp):
  - 1.1–2.4 trùng nguyên văn `tha-ap347:1.1–2.4` — bài trưởng lão Naḷāgāriko cùng tiếp
    cảnh non xa núi Himavanta và lều tranh. Dùng lại y nguyên bản đã có, không sinh cách
    dịch thứ hai cho cùng một câu Pāli.
  - 3.1–3.2 đúng 12 tiền lệ ("Nhờ nghiệp lành khéo làm ấy," + "cùng với tâm nguyện và chí
    hướng;"), 3.3 có 5, 3.4 có 6 — dùng lại.
  - 5.1–5.4, 6.2–6.4 trùng nguyên văn `tha-ap347` và `tha-ap498`/`tha-ap428`.
  - 8.1–8.2 dùng đúng CẶP đã có ở `tha-ap496:3.1–3.2`, cùng hai khoá Pāli.
  - 9.1 (64), 9.3 (65), 10.1 (62), 10.3 (70), 11.1 (339), 11.3 (295) — mỗi khoá lấy đa số
    đã đo trong chính tầng `tha-ap`.

  TÊN PHẨM — ĐO LẠI, ba cách ở `0.3`:
  - Đo trên 333 tệp `tha-ap` đã có `0.3` trong tầng Việt:
    `Bài Kệ Tuyên Ngợ Về Trưởng Lão …` = 160 (đa số);
    `Ký Sự Về Trưởng Lão …` = 84;
    `Bài Kệ Tuyên Ngôn Về Trưởng Lão …` = 65;
    biến thể thứ tư `Bài Kệ Tuyên Ngợi Về Trưởng Lão …` = 9.
    Gộp cả `thi-ap` thì 166 / 84 / 65 / 9 trên 339. Theo đa số → `Ngợ`.
  - Số thứ tự ở `0.3`: Pāli có số ở 113 tệp, trong đó 66 tệp bỏ số và 47 tệp giữ số.
    Theo đa số → bỏ số ở `0.3`, còn `13.1` vẫn giữ `thứ chín` theo khuôn `…padānaṁ …ṁ`.
  - `0.1` `Therāpadāna`: đo trên 400 tệp `tha-ap` — giữ nguyên Pāli 324, dịch là
    `Trưởng Lão Ký Sự` 9, không có `0.1` 67. Đa số giữ Pāli.
  - `0.2` `Kiṅkaṇipupphavagga`: cả 6/6 tệp cùng phẩm đã dùng `Phẩm Hoa Kiṅkaṇi`.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - `4.1`–`4.4` không có tiền lệ nào: `Saṭṭhiyojanamubbedhaṁ` và `tiṁsayojanavitthataṁ`
    có trong 18 khoá Pāli đã ghim nhưng chưa khoá nào được dịch. `byamhaṁ` đọc là công cụ
    `vàng`, nên câu là `Ở đó tôi đã làm khéo làm bằng vàng, / do vị naḷakuṭi tạo ra;` —
    hai vế không lặp ý: một là công trình của ông, một là kẻ tạo ra nó. Nếu đọc `byamhaṁ`
    là danh từ đồng dạng thì hai vế có thể là một ý; đã chọn cách công cụ vì nó giữ cả hai
    vế mà vẫn không thêm gì. Đơn vị `yojana` dịch `do-tuần` theo đa số cục bộ trong tầng
    Việt (50 giá trị so với `yojana` giữ nguyên 5).
  - `7.1`–`7.3` không có tiền lệ: `sabbākāravarūpamaṁ` và `Yadicchakāhaṁ vihare` chỉ xuất
    hiện ở đúng khoá này trong Pāli đã ghim. `sabbākāravarūpamaṁ` là tính từ nói lầu đài
    của Pháp ở cõi trời giống hệt công trình ở `4.1`–`4.4`; dịch `y hệt cả về mọi hình
    dạng;` là giữ cả hai vế (`sabbākāra` và `varūpama`), không thêm so sánh nào ngoài Pāli.
  - `naḷakuṭi` giữ nguyên theo Pāli: đây là tên loài chúng sinh thuộc Yakkha, và bài này
    không có tiền lệ nào trong tầng Việt cho tên ấy; tự đặt tên Hán–Việt sẽ là bịa. Cùng
    lý do, tên trưởng lão `Naḷakuṭidāyaka` giữ theo Pāli (`0.3`, `12.1`, `13.1`; Pāli ở
    `12.1` là `naḷakuṭidāyako`). Cả hai tên đã được khai vào bộ nhớ tiến trình của
    `_hvi.lọt_pāli` sau khi tra chứng, đúng cách mô tả trong chính hàm đó.
  - `8.3` `Duggatiṁ nābhijānāmi`: đa số trong `tha-ap` (103/304) là
    `Ta không biết mình rơi vào khổ đau,`; nhóm còn lại dịch theo `đọa xứ`. Theo đa số.
  - `7.4` `sakyaputtassa sāsane` chỉ có đúng một tiền lệ trong tầng Việt
    (`tha-ap518:6.4`, `trong giáo pháp của Đức Phật.`) — dùng lại nguyên văn bản ấy.
  - Dấu lược: `9.2`, `10.2`, `11.2` là `…pe…` ở Pāli, giữ đúng MỘT `…` mỗi khoá; không
    mở rộng.

