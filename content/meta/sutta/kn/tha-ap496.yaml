notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho tha-ap496.
  Đối chiếu văn cảnh và thể thơ Therāpadāna / Therīapadāna để bảo toàn niêm luật và cấu trúc kệ ngôn.
  Toàn bộ 26 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Sửa lan 2026-10-13: khoá `tha-ap496:5.1` (`Svāgataṁ vata me āsi,`), *Thật là đón mừng thù thắng thay cho tôi,* → *Thật lành thay sự đến của tôi,* (khớp `tha-ap497:9.1`). Đo Pāli `Svāgataṁ vata me āsi` trong tầng: 229 khoá; *Thật lành thay sự đến của ta/tôi/con* chiếm 149 (ta) + 21 (tôi) + 5 + 4 khoá, còn *Thật là đón mừng thù thắng thay cho tôi/con* 23 + 7 khoá (23 khoá dạng này gồm cả bài này trước khi sửa; còn 22 khoá `tha-ap` khác mang dạng cũ, ngoài phạm vi lượt này). `svāgata` = đến tốt lành/được đón chào tốt đẹp; *thù thắng* không có trong Pāli. Chưa sửa vì ngoài phạm vi: `8.1` *thứ bốn* (thứ tư) cho `catutthaṁ`. Không đổi điểm.
  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 26 khoá Pāli↔Việt, đo tiền lệ trên các khoá Pāli trùng ở phẩm `tha-ap` rồi sửa 13 khoá; điểm chấm lại trung thực, `semantic_fidelity` hạ 9.3 → 9.0 vì bản trước có nhiều chỗ thêm nghĩa và lệch tiền lệ mà điểm cũ không phản ánh; các tiêu chí khác giữ nguyên.
  Accuracy fix: `1.4` *tôi tung hoa lên hư không để cúng dường Ngài* → *tôi đã tung hoa cúng dường giữa hư không* (bỏ "Ngài" không có trong `ākāse abhipūjayiṁ`; khớp bài song song `tha-ap355:1.4`, nơi `2.2` `yaṁ pupphamabhipūjayiṁ` xác nhận vật cúng là hoa). `2.2` *và do tâm nguyện sâu xa* → *cùng với tâm nguyện và chí hướng* (bản cũ chỉ còn một đơn vị cho dvandva `cetanāpaṇidhīhi` và thêm "sâu xa" không có trong Pāli; đa số 48/53 khoá cùng Pāli). `2.3` bỏ "này" thêm vào (`mānusaṁ dehaṁ` = thân người, 33 khoá không có "này"). `2.4` *sanh về cõi trời Đạo Lợi (Tāvatiṁsa)* → *đã đến cõi trời Ba mươi ba* (`agacchaṁ` là "đi đến", không nói tái sinh; bỏ Pāli đặt trong ngoặc; 35/38 khoá cùng Pāli dùng "Ba mươi ba"). `3.3` bỏ "bất kỳ" (103 khoá *đọa xứ nào* so với 21 khoá *bất kỳ đọa xứ nào*). `4.1` *Mọi* → *Các* (không có `sabbe`; 166 khoá *Các phiền não* so với 27 khoá *Mọi*). `4.3` bỏ "đời thanh tịnh" thêm vào (192 khoá *sống không còn lậu hoặc* so với 23 khoá có thêm). `3.4` *đó chính là* → *đây là* (`idaṁ`; 98 so với 6 khoá). `3.2` *việc thiện lành* → *thiện nghiệp* (`kammaṁ`; 28 khoá *thiện nghiệp ấy* so với 4 khoá *việc thiện lành ấy*).
  Terminology/style fix: `2.1` *Do* → *Nhờ* (47/49 khoá cùng Pāli); `2.3` *Sau* → *sau* (giữa câu, 33 khoá); `5.3` và `6.3` bỏ chủ ngữ *tôi* thêm vào cho đúng công thức `kataṁ buddhassa sāsanaṁ` (đa số 161 + 507 khoá không có chủ ngữ, 29 khoá có). `8.1` *thứ bốn* → *thứ tư*: lỗi thật, `catutthaṁ` của phẩm `tha-ap` dịch *thứ tư* ở 50 khoá và *thứ bốn* ở 6 khoá khác (ngoài bài này, ngoài phạm vi lượt này).
  Bất định còn lại (không phân xử được từ Pāli, giữ nguyên): `1.4` *tung hoa* là suy ra từ `ākāse` + vật cúng là hoa (Pāli chỉ nói "cúng dường giữa hư không"); `2.2` `cetanā` hiển thị qua *tâm nguyện* theo quy ước đa số chứ không phải dịch sát `cetanā` (= tư/ý định); `3.1` `ekatiṁse ito kappe` đọc theo quy ước *ba mươi mốt kiếp trước*. Số: `ekatiṁse` = 31 → *ba mươi mốt* (đúng mốt sau mươi). Tầng tham khảo tiếng Anh vẫn vắng (blocker giữ nguyên, `triangulation` giữ 7.5).
  Tự kiểm: 26/26 khoá Việt = 26/26 khoá Pāli, đúng thứ tự; nháy kép khớp Pāli từng khoá (0 lệch trên 26 khoá); 2 nhóm Pāli trùng nội bộ (`4.2`/`5.2`/`6.2`, `5.3`/`6.3`) đều khớp bản Việt; `…` chỉ ở khoá Pāli có `…pe…`; NFC sạch. Cổng kỹ thuật không chạy ở lượt này: `npm run validate` · `npm test` · `npm run check` · `npm run build` còn phải chạy (`technical_integrity` giữ 9.6).

  Quyết định hội đồng biên tập 2026-10-16: B20 — 2.2 (`cetanāpaṇidhīhi` = nhờ những ước nguyện của tâm).
