notes: |-
  Bản dịch chỉ từ Pāli root do commit đã ghim không có bản Anh upstream (giới hạn upstream); không có bản Việt hiện hành dạng phân đoạn cho bài này. Đầy đủ 84 khoá, đúng thứ tự Pāli. Bản Việt nguyên bài (không phân đoạn) ở mục tra cứu toàn văn chỉ được dùng để đối chiếu thêm các chỗ số lượng và cách tách câu; không phải tầng store, không căn lề theo segment, không sao chép câu chữ, nên `triangulation` vẫn ≤ 8.0.
  Tiêu đề `:0.3` Pāli (`Mogharājattheraapadāna`) bắt đầu bằng chữ, không có số thứ tự; `translationTitle` và `:0.3` bằng đúng nhau và đều không mang số. Chọn "Tuyên Ngôn" (đúng chính tả, cùng phẩm: tha-ap33, 34, 35, 36, 38, 39). Đo ở phạm vi gần nhất (tha-ap30–42): Tuyên Ngôn 6 · Tuyên Ngợ 4 · Tuyên Ngợi 1 · Ký Sự 1; toàn tầng đã dịch: Tuyên Ngợ 240 · Tuyên Ngôn 118 · Ký Sự 101 · Tuyên Ngợi 10. Hai phạm vi cho hai đa số khác nhau; đây là lựa chọn biên tập, chờ biên tập phán một lượt cho cả cuốn.
  Cấu trúc nháy: ngoặc kép “ mở ở 1.1 và đóng ở 20.3; nháy đơn ‘ mở ở 13.1 và đóng ở 18.4 (lời thọ ký của Đức Atthadassī, chạy qua nhiều khoá), giữ khớp từng khoá Pāli (0 lệch trên 84 khoá). Kệ 2–11 là lời tự thuật của vị trưởng lão ("tôi"); kệ 4–9 là lời tán thán trực tiếp với Đức Phật ("Ngài"); kệ 13–18 nói về vị trưởng lão ở ngôi ba ("vị ấy").
  Số lượng: `Catuddasañcakkhattuṁ` = mười bốn lần (catu 4 + dasa 10; đối chiếu tha-ap70 `Catuddasa` = mười bốn). `Aṭṭhasataṁ` = tám trăm (aṭṭha 8 × sata 100), dịch "tám trăm lần" theo song song với tha-ap36:8.3 (`pañcasataṁ` → "năm trăm lần") và tha-ap45:12.1 (`sahassaṁ` → "một ngàn lần"). `Pañceva satakkhattuñca` = năm trăm lần (pañca 5 × sata 100, eva chen vào vì vần luật). `Tīhi vijjāhi` = ba minh. `Catasso` = bốn. Bài không có cụm `Tiṁsakappasahassa` hay bất kỳ dạng `tiṁsa` nào, nên không có số cần ghi bất định về điểm này.
  Bất định: (1) 14.3 `Pathabyā rajjaṁ aṭṭhasataṁ` không nêu đơn vị; dịch "tám trăm lần" theo song song với `-khattuṁ` ở 14.1 và 15.1 và theo tha-ap36:8.3; tha-ap61:6.3 (`sattasataṁ`) đã dịch "bảy trăm năm", hai cách hiểu chưa thống nhất giữa các bài cùng công thức, cần biên tập phán. (2) 15.1 `Pañceva satakkhattuñca`: cách hiểu khác là "năm lần và một trăm lần"; chọn "năm trăm lần" vì cấu tạo pañca-sata-khattuṁ và vì cùng công thức `pañcasataṁ`/`-khattuṁ` ở bài kề; không phân xử được độc lập bằng bản Anh. (3) 4.4 và 6.4 `samogadhā` dịch "đã được bao gồm" (tính từ, nghĩa gốc "đã chìm vào, đã thâm nhập"); chọn nghĩa "bao gồm" vì ngữ cảnh lưới và trí tuệ bao trùm chúng sinh; không có tiền lệ trong tầng (1 lần duy nhất là tên riêng Samogadha). (4) 6.1 `cetanā` dịch "ý chí" theo tiền lệ duy nhất của tầng (`mil` hỏi đáp về `cetanā`); có thể hiểu là "tư/tác ý" kỹ thuật, nghĩa là chúng sinh có tâm hành. (5) 7.1 `Samuddharasi` là ngôi hai số ít hiện tại ("Ngài cứu vớt"); tha-ap436:4.1 dịch cùng Pāli này thành "Nguyên thế giới này rộng như biển cả" — lệch hẳn nghĩa động từ; không tái dùng, không sửa ngoài phạm vi, báo để biên tập. (6) 10.2 `madhukhuddamaneḷakaṁ` = madhu + khuddam + aneḷakaṁ; đối chiếu `khuddamadhuṁ aneḷakaṁ` ở dn27:11.7, mn77:6.65, an6.54:9.6 đã dịch "mật ong tinh khiết của loài ong nhỏ"; dùng cách đó cho 10.2. `puṭaka` dịch "túi" (tha-ap có "túi muối" một lần; không có tiền lệ chỉ vật chứa mật). (7) 10.1–10.4 không nêu ai là người dâng ở 10.1 ngoài ngôi nhất ở 10.4 (`upanesiṁ`); giữ "tôi" ở 10.4. (8) 16.1–16.2 `ajjhāyako mantadharo` dịch "người tụng đọc, người thuộc lòng thần chú" (tha-ap129/484 "những bài tụng" 2, tha-ap123/7 "điều đã ghi nhớ" 2; `manta` = "thần chú" ở snp, tha-ap124, 54, 326); tha-ap123:1.2 và tha-ap7:1.2 dịch `vedāna` thành "ba thọ" — sai nghĩa (vedā = Veda), không tái dùng. (9) 17.2 `vicinissati` dịch "quán xét" (sẽ khảo xét bằng trí tuệ); 18.3 `satthavāhaggo` dịch "bậc đứng đầu những người dẫn đoàn lữ hành" (tầng có "bậc dẫn dắt tối cao" 1, "bậc dẫn đoàn lữ hành vô thượng" 1). (10) 12.4 và 13.1 `thavitaṁ` / 3.4 `santhaviṁ` đều từ gốc thu "ca ngợi"; 13.2 `thomito` "tán thán" (tha-ap54:6.2).
  Tiền lệ tái dùng nguyên văn: 26/36 khoá có Pāli trùng trong tầng (tính trên 36 khoá có tiền lệ) dùng lại nguyên văn bản dịch hiện có; 10 khoá khác vì ngôi kể, vị ngữ hoặc đã sửa lỗi nghĩa. Các cặp trùng trong chính bài: 3 cặp (4.3/6.3, 4.4/6.4, 7.3/9.3), cả 3 cặp Việt giống nhau.
  Công thức lời kết 21.1 dùng nhóm "đã nói những bài kệ này" (407 khoá), không dùng "đã từng nói bài kệ này" (21 khoá). `imā gāthā abhāsatha` ở 12.4: 18/18 khoá trong tầng dùng "đã nói những bài kệ này". `Tena cittappasādena` 13.3: "Nhờ tâm tịnh tín ấy," (21/32 khoá).
  Dấu lược 20.2 `…pe…` → đúng một `…`; Pāli không có `(…)` trần ở bài này.
