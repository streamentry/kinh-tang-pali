notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B12 — snp4.3:3.2 (`vata`/`sīlabbata`: bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”/“giới cấm”).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 2.2–2.4 (câu hỏi `kathamaccayeyya` kết ở 2.2; `yathā hi jāneyya tathā vadeyya` là câu khẳng định với optative, theo chú giải Sn «… karonto yathā jāneyya, tatheva vadeyyāti», lời giải Niddesa mnd3:13.1 và Sujato; bỏ «và … ?», thêm chủ ngữ «người ấy», như mnd3:9.2–9.4); giữ lời 2.3 «tạo tác những công hạnh» (DPD `samatta` 2.1 «adopted; undertaken», Sujato «undertakings»; Niddesa và chú giải đọc `samatta` là «hoàn bị», mnd3:12.1 dịch «xem là hoàn bị» — hai cách đọc đều có căn cứ, bất định).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 3, sau chấm lại độc lập 2026-10-17): sửa 7.3 (`māyā` «hư vọng» → «giả dối»: DPD māyā 1 «fraud; deceit; hypocrisy»; lời giải Niddesa mnd3:54.2 «Māyā vuccati vañcanikā cariyā» (che giấu ác hạnh), chú giải Niddesa cho kệ này «pāpakammaṃ paṭicchādentā titthiyā māyāya»; mnd3:49.3, 54.1, 55.30 đã «giả dối»). Sujato «illusion» theo nghĩa đen; chọn theo lời giải của chính Niddesa dẫn kệ này.
  Thống nhất cấp kho 2026-10-17: 1.4 khila «chướng ngại» → «sự chai cứng» (DPD khila 1.1 hardness, hard-heartedness; lời giải mnd3:6.2–6.4 giải bằng khilajātatā, năm cetokhila, rāga/dosa/mohakhila; mn16 «trạng thái khiến tâm chai cứng»), khớp dòng kệ dẫn lại mnd3:2.4, 6.1, 6.6, 8.4. 5.1 «đã được tạo tác, hư cấu» → «đã được hư cấu, tạo tác» theo thứ tự Pāli pakappitā saṅkhatā (lời giải mnd3:36.2–36.9 cũng giải pakappanā trước, saṅkhatā sau; mnd5:42.3 «được hư cấu, được cấu thành»), cùng sửa mnd3:35.1, 36.1, 36.12, 41.1.
  Thống nhất cấp kho 2026-10-17 (lượt văn phong §5.2, cùng mnd3): diṭṭhi «tri kiến» → «kiến» ở 2.1 («kiến của chính mình»), 6.1 (diṭṭhīnivesā «những chấp trước vào kiến»), 7.2 («một kiến được hư cấu»), 8.4 («mọi kiến»). Pāli là diṭṭhi, không phải ñāṇa; Sujato «view», «dogmatic views», «formulated view», «all views»; Bhikkhu Indacanda (bản Niddesa) «quan điểm», «tà kiến»; «tri kiến» trong kho là cách dịch ñāṇadassana nên dễ hiểu nhầm. Nghĩa không đổi; các dòng dẫn lại trong mnd3 (9.1, 15.1, 42.1, 48.1, 49.2, 58.2, 59.4, 65.4 và lemma) đổi cùng lúc, khớp nguyên văn.
