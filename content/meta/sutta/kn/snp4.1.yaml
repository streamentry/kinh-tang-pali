notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B1 — snp4.1:3.3 (`visattikā` = sự vướng mắc (ở đời); `tare` = có thể vượt qua).
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 3.3 «sự vướng mắc ở đời này» → «sự vướng mắc này ở đời» (đại từ chỉ định gắn sai danh từ, thêm ý «đời này»; somaṁ = so imaṁ, imaṁ đối cách giống cái đi với visattikaṁ, DPD «somaṃ: sandhi. he this»; lời giải mnd1:34.2 «loke vā taṁ visattikaṁ», chú giải Sn «loke visattikāsaṅkhātaṁ taṇhaṁ»; khớp dòng kệ mnd1:22.3, 28.1, 34.1, 34.3; chữ «này» lạc chỗ từ lượt thi hành B1, B1 chỉ chốt «sự vướng mắc ở đời»). Không sửa: 5.1 abalā «những kẻ yếu ớt» (lời giải mnd1:47.2 và chú giải Sn đọc là các phiền não yếu ớt; Sujato «the weak», giữ cách đọc trung tính).
