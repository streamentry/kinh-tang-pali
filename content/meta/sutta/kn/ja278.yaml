  LƯỢT CẢI THIỆN 2026-10-11. Đọc đối kháng lại từng cặp Pāli và Việt của 17 khoá, đo tiền lệ bằng số đếm trên toàn tầng.
  Số khoá đổi chữ: 1 trên 17 (1.2). Mục cũ ở trên nói tiêu đề phẩm 0.3 còn lệch giữa Phẩm Nước Uống và Phẩm Giếng Nước đã lỗi thời:
  đo lại, cả mười bài ja271 đến ja280 đều là Phẩm Giếng Nước (10/10), không còn bài nào là Phẩm Nước Uống, nên không còn lệch.
  Đổi 1.2 (clarity fix, vietnamese_clarity 9.2 thành 9.3): từ đối với kẻ nhẹ dạ, hay phản bội thành đối với kẻ nhẹ dạ và hay phản bội,
  vì dấu phẩy trước chữ hay khiến câu đọc được như lựa chọn hoặc nhẹ dạ hoặc phản bội, trong khi Pāli là hai tính chất cùng gán cho một
  người (lahucitta và dubbhī, tính từ ghép đồng vị). Nghĩa không đổi; nhẹ dạ vẫn theo quy ước của tầng (6 khoá: ja321:3.2, ja464, ja536
  ba khoá, ja278).
  Đối chiếu bổ sung, làm tăng triangulation từ 6.6 thành 7.0 (vẫn dưới 8.0 vì bài không có tầng Anh độc lập): bài song song cp15 (Mahiṁsarājacariya)
  vừa có bản Anh Sujato trong tầng ghim, vế 10.1 đến 10.4 của nó cùng cấu trúc với 3.1 đến 3.4 ở đây (hắn nghĩ về ta, hắn cũng sẽ làm thế
  với những kẻ khác, vì thế họ giết hắn, rồi ta được thoát). Khớp với cách đọc hiện tại: đối tượng của maññamāno là mam eva (chỉ ta),
  chủ ngữ ayaṁ là kẻ quấy nhiễu, và vế 3.3 đến 3.4 là hệ quả cho người nói. Không chép câu Anh nào vào thân kinh.
  Đo tiền lệ, quyết định KHÔNG đổi: (1) 2.3 Bhiyyo bālā pakujjheyyuṁ trùng nguyên văn ne37:406.1 (Kẻ ngu dại sẽ lại càng nổi giận); giữ Kẻ ngu sẽ
  càng nổi giận hơn nữa vì cùng công thức Bhiyyo bālā ở sn11.4:4.1 và sn11.5:2.1 dịch kẻ ngu sẽ càng buông thả hơn nữa (2 khoá cùng mẫu càng ... hơn nữa),
  và kẻ ngu là cách dịch bālā áp đảo toàn tầng; ne37 là ngoại lệ ngu dại cộng lại, không dùng làm chuẩn. 2.4 no cassa paṭisedhako dùng lại nguyên văn
  4/4 nơi (sn11.4:4.2, sn11.5:2.2, ne37:406.2). (2) 3.4 mutti: cp15:10.4 dịch tự do (Sujato free); giữ giải thoát vì Pāli ở đây không
  trùng nguyên văn (có thêm ti đóng lời), mutti thoát khỏi nỗi khổ do kẻ ấy gây ra, và giải thoát là cách dịch mutti và vimutti áp đảo
  trong tầng; ghi rõ đây là lựa chọn giữa hai cách đã có tiền lệ, không phải lỗi của một bên. (3) 3.3 tattha giữ tại đó (có thể đọc là ở đó hoặc
  trong trường hợp ấy; Pāli không phân xử được).
  Lỗi ngoài tệp của bài, chỉ báo, không sửa: cp15:10.1 và 10.2 (cùng Pāli với ja278:3.1 và 3.2) hiện là Nghĩ rằng ta sẽ và làm thế với người khác nữa,
  tức cắt câu lệch ranh khoá và mất chủ ngữ ayaṁ; nên xem xét lại ở bài cp15.
  Bất định còn lại: nihanāhetaṁ (nihana etaṁ), cách đọc 3.1 maññamāno có tân ngữ lược, tattha ở 3.3; không có tầng Anh độc lập cho bài này.
