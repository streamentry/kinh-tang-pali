  GIẢI QUYẾT DRAFT 2026-10-12 (thay thế các mục cũ nói về tên bài, nghĩa kệ 1 và kệ 3, STATUS và blocker coverage ở trên).
  Kiểm toán đối kháng từng vế từ Pāli; tầng Anh Sujato không có bài này nên không có bản Anh độc lập, chỉ có Pāli,
  các cặp trùng trong kho (ja321:3.2 cùng vế `lahucittassa dubbhino`, ja291:1.1 `sabbakāmadadaṁ`, sn11.4/sn11.5 `no cassa paṭisedhako`)
  và từ điển. Số khoá lỗi nghĩa thật: 7 trên 17 (0.4, 4.1, 1.1, 1.2, 1.3, 3.1, 3.2); thêm 6 khoá sửa câu chữ hoặc thuật ngữ
  mà nghĩa chính không đổi (1.4, 2.1, 2.2, 2.3, 3.3, 3.4); 2.4 giữ nguyên chữ. Tổng 13 khoá đổi chữ.
  Sửa nghĩa (accuracy fix): (a) 0.4 và 4.1 `mahiṁsa` là TRÂU, không phải bò đực: kho dịch `mahiṁsa` là trâu ở mn63:5.27
  và sn15.13:3.4 và tách riêng với bò đực ở dn1:1.13.2; nên Kinh Vua Bò đổi thành Kinh Vua Trâu, `translationTitle` khớp.
  (b) 1.1 `abhisandhāya` (vị tuyệt đối, hướng tâm tới) bị dịch thành kết hợp, một nghĩa không có trong Pāli; đổi
  thành nhắm đến mục đích gì. (c) 1.3 `sabbakāmadadasseva` = sabbakāmadada + assa + iva, dada là NGƯỜI BAN, không phải
  người được thoả mãn; bản cũ đảo vai người cho và người nhận; đổi thành như đối với người ban cho mọi điều mong muốn,
  khớp ja291:1.1 `sabbakāmadadaṁ` dịch là ban cho mọi điều mong muốn. (d) 1.2 bỏ chữ bạn: `dubbhino` chỉ là kẻ hay
  hãm hại, phản bội, không nêu bạn (chú giải nêu bạn chỉ là bối cảnh, không nằm trong lời kệ); đối với kẻ nhẹ dạ, hay phản bội.
  (e) 1.4 `imaṁ dukkhaṁ titikkhasi` giữ chịu đựng nỗi khổ này nhưng chuyển thành vế kết của câu hỏi một mệnh đề
  với 1.1–1.3 (tân ngữ của chịu đựng là 1.4, hai vế genitive 1.2 và 1.3 chỉ đối tượng). (f) 2.1–2.2 `nihana` là lệnh
  đánh, húc hạ; `adhiṭṭhaha` với `padasā` là giẫm lên (Pāli `adhiṭṭhahati` = đứng lên trên, giẫm); bản cũ dùng hạ xuống và
  đè xuống, đổi thành húc hạ nó và giẫm lên nó. (g) 2.3 dùng lại tiền lệ sn11.4:4.1 và sn11.5:2.1 (`Bhiyyo bālā …`):
  kẻ ngu sẽ càng nổi giận hơn nữa; chữ ngu dại và sẽ lại bỏ cho khớp tiền lệ. (h) 3.1–3.2 `mamevāyaṁ maññamāno` +
  `aññepevaṁ karissati` (aññe + pi): ayaṁ là chủ ngữ (hắn), mam + eva là đối tượng của maññamāno, pi là cả những
  kẻ khác; bản cũ đọc là tưởng rằng chính là ta, dù hắn làm thế với người khác, làm hỏng ý chính (con khỉ nghĩ
  chỉ mình ta chịu, nên sẽ làm với cả kẻ khác); đổi thành hắn nghĩ chỉ có mình ta, hắn cũng sẽ làm như vậy với
  những kẻ khác. (i) 3.3 bỏ ngay (không có trong Pāli): họ sẽ giết hắn tại đó. (j) 3.4 `mutti` = sự giải thoát,
  khỏi nỗi khổ do hắn gây ra; tự do dễ đọc thành nghĩa chính trị; đổi thành đó sẽ là sự giải thoát cho ta.
  Không đổi ngoặc kép: mở ở 1.1 và 3.1, đóng ở 2.4 và 3.4, khớp Pāli từng khoá.
  Blocker đã gỡ: (B) coverage Anh 0 trên 0 khoá Pāli có nội dung (mọi vế kệ ngắn hơn 40 ký tự): mẫu số bằng 0 nên cổng
  không đo được, cũng không có đoạn nào Sujato để trống ở mức có nội dung; mất mát ghi nhận ở trên là đủ, không phải
  lỗi văn bản; blocker đó là do tác giả cũ tự đặt nên đã xoá. Blocker (A) thiếu bản Anh upstream GIỮ NGUYÊN: đó là sự
  thật về bản chụp đã ghim.
  Bất định còn lại: `nihanāhetaṁ` (dạng sandhi nihana + etaṁ), tôi đọc là nihana etaṁ theo mạch lời xúi húc; `mutti` ở 3.4
  nghĩa thoát khỏi con khỉ nhưng giữ giải thoát vì không có chữ nào hẹp hơn trong Pāli. Người nói ở kệ 1 không có
  hô cách nên không thêm ngài hay ngươi. Tiêu đề phẩm 0.3 `Udapānavagga` (udapāna = giếng) hiện là Phẩm Nước Uống ở 9
  bài cùng phẩm (ja271 đến ja279) và Phẩm Giếng Nước ở ja280; sai lệch này nằm ngoài tệp của bài này nên không sửa,
  cần xử lý chung cả phẩm. Tầng Việt hiện hành không có: `vietnamese-current` chỉ có Pháp Cú, đó chỉ là giới hạn tham
  chiếu của bản chụp upstream, không phải lỗi văn bản. Không có tầng Anh độc lập nên `triangulation` giữ 6.6.
