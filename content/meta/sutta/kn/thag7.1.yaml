notes: |-
  Dịch từ Pāli root, đối chiếu Anh Bhikkhu Sujato (34/35 khoá có chữ).
  `Sattakanipāta` → Bộ Bảy Bài Kệ theo tiền lệ 8/8; `Paṭhamavagga` → Phẩm Thứ Nhất theo 87 lần. 1.1 và 5.3 cùng một công thức (`Alaṅkatā suvasanā` / `Alaṅkataṁ suvasanaṁ`) nên dịch nhất quán một cách: Trang sức lộng lẫy, xiêm y rực rỡ — tiền lệ đo được có ba biến thể khác nhau, không bê nguyên một biến thể rồi để bài tự mâu thuẫn.
  5.4 `maccupāsaṁva oḍḍitaṁ` dùng lại nguyên văn tiền lệ 2 lần (như cạm bẫy của tử thần giăng ra); 6.4 và 7.1, 7.4 cũng dùng lại tiền lệ.
  BẤT ĐỊNH: 2.3 `Sā maṁ saṇhena mudunā` — có 1 khoá tiền lệ trùng nguyên văn Pāli nhưng bản Việt của nó (cho ta dầu tinh luyện, dịu dàng) không khớp nghĩa Pāli, nên KHÔNG dùng lại; dịch theo Sujato (nhẹ nhàng, mềm mại nói với tôi). 2.4 `mhitapubbaṁ abhāsatha` có đại từ ngôi thứ hai (`ngươi đã nói`) trong khi 2.3 là ngôi thứ ba (`nàng nói`); giữ ngôi thứ ba cho cả hai và ghi ở đây.
  `…pe…` ở 6.2, 6.3, 7.2, 7.3 giữ đúng MỘT dấu lược theo `skill/translation.md` §10.1, không mở rộng.
  Toàn bộ 1.1–7.4 nằm trong một cặp nháy kép mở ở 1.1 và đóng ở 7.4, đúng như Pāli.
  Tên bộ: như thẻ ghi ở thag5.12, hai tên do coordinator nêu không có tiền lệ đo được trên đĩa (0 lần).
  Cổng kỹ thuật: `npm run validate`, `npm test`, `npm run check` do coordinator chạy; `npm run build` chỉ cần thêm cho bài `published`. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
