notes: |-
  Bản dịch có từ trước (20/20 khoá, thứ tự và tập khoá đúng Pāli). Lượt chấm cũ không ghi notes, nên lượt này đọc đối kháng lại từng khoá và ghi lại ở đây.

  Lượt cải thiện 2026-10-13:
  - `ud2.1:4.1` (terminology/accuracy): "sau khi thắng tri ý nghĩa ấy" → "sau khi biết rõ ý nghĩa ấy". `viditvā` là "đã biết, đã hiểu", không phải `abhiññā` (thắng tri, trí biết trực tiếp). Đo toàn tầng: `viditvā` có 439 khoá, chỉ 78 khoá dùng "thắng tri" (hầu hết ở công thức `etamatthaṁ viditvā … udānaṁ` của Udāna), 361 khoá dùng "biết/biết rõ/hiểu rõ"; ở công thức này ngoài Udāna là "biết rõ ý nghĩa ấy" (`dn16:1.34.2`, `dn16:3.10.3`, `dn16:4.43.1`). Giữ "thốt lên lời cảm hứng" (`udānesi`, theo đa số Udāna). Terminology 9.5 → 9.3 chứ không tăng, vì công thức này ở các bài Udāna khác còn lệch (xem bất định bên dưới).
  - `ud2.1:2.3` (terminology): "gió, mặt trời, bò sát" → "gió, nắng, các loài bò sát". `ātapa` trong dãy `ḍaṁsamakasavātātapasarīsapa-` là sức nóng của nắng; đo 44 khoá có dãy này, đa số dùng "gió, nắng và (các) loài bò sát", chỉ khoá này dùng "mặt trời".
  - `ud2.1:6.3` (accuracy, nhẹ): bỏ "nhưng" trước "sự trừ diệt ngã mạn". Pāli `asmimānassa yo vinayo, etaṁ ve paramaṁ sukhaṁ` không có tiểu từ đối lập; cùng kệ ở `pe2:124.3` cũng không có. Bản English có "But", nên đây là cách đọc của bản tham khảo chứ không phải Pāli.
  - Các khoá còn lại (18/20) giữ nguyên sau khi đọc đối kháng: số lượng (`sattakkhattuṁ` bảy vòng, `sattāha` bảy ngày), người nói/chủ thể (long vương Mucalinda; Đức Thế Tôn ở 3.1, 4.1), công thức `Tena kho pana samayena`, `ekapallaṅkena nisinno` (8/8 khoá trùng Pāli dịch giống nhau), `tassa sattāhassa accayena…` (3/3 giống nhau), nháy/ngoặc kép khớp Pāli từng khoá.

  Điểm đổi: semantic_fidelity 9.5 → 9.4, terminology 9.5 → 9.3, triangulation 9.4 → 9.0, ambiguity_integrity 9.6 → 9.4, technical_integrity 10.0 → 9.6; còn lại giữ. final_score 9.64 → 9.51. Các điểm giảm phản ánh bản chấm cũ không có căn cứ ghi lại và bỏ sót hai lỗi thuật ngữ nêu trên; không phải bản dịch xấu đi. Bài vẫn vượt ngưỡng `> 9.0`, không có blocker.

  Bất định còn lại, không giải quyết được bằng căn cứ trong kho (không đổi bản dịch):
  - `ud2.1:2.2` `uparimuddhani`: Pāli không nói rõ "trên đầu" của ai. Bản dịch giữ "trên đầu Ngài" như bản English ("over his head"); cách hiểu thường gặp là mang hổ mang xòe che trên đầu Đức Thế Tôn, nhưng không có tân ngữ trong Pāli.
  - `ud2.1:5.2` `sutadhammassa passato`: `passato` không có tân ngữ trong Pāli; "thấy pháp" theo cách đọc của bản English và theo bản Việt của kệ trùng ở `pe2:123.2`. Nếu muốn bám sát Pāli hơn thì chỉ "và thấy".
  - `ud2.1:5.3` `abyāpajjaṁ`: dịch "không hại". Ở cấu trúc tính từ của tâm, kho thường dịch "không ác ý" (`dn13`, công thức tứ vô lượng); ở `dn21:2.1.3` `abyāpajjā` là "không làm hại nhau". Cả hai đều có tiền lệ, giữ "không hại" vì cặp với `pāṇabhūtesu saṁyamo`.
  - `ud2.1:3.2` `māṇavaka`: "thanh niên Bà-la-môn" có 4 tiền lệ trong 31 khoá `māṇavaka`; bản English cũng dịch "brahmin youth".
  - Công thức `etamatthaṁ viditvā` với "thắng tri" còn ở khoảng 77 khoá khác (chủ yếu Udāna), xem báo cáo ngoài phạm vi của lượt này.

  Coverage English: tầng `english-sujato` có đủ 20/20 khoá cho bài này, không có khoảng trống phải khai gap. Tầng `vietnamese-current` không có (chỉ Pháp Cú), nên triangulation không chấm cao hơn 9.0 khi chưa có bản Việt phân đoạn để đối chiếu.

  Technical gate: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này nên không tuyên bố technical gate pass; technical_integrity đặt 9.6.
