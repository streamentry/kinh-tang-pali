notes: |-
  Lượt rà soát 2026-10-15 (kiểm mẫu ngẫu nhiên, đọc đủ 21 khoá Pāli, Việt, Anh Sujato): sửa
  snp5.13:3.5 "liền" thành "Chính vì điều đó mà" cho teneva (quan hệ do chính sự chấp thủ ấy, không
  phải "ngay lập tức"); sửa snp5.13:3.2 thêm người được gọi Bhadrāvudha (bhadrāvudhāti). Bản Anh
  Sujato lệch hàng ở 1.5 và 2.1–2.2 (câu của Pāli 1.5 nằm ở khoá 2.2 của Anh), nên khoá đó không dùng
  để đối chiếu. semantic_fidelity +0,1.

  Quyết định hội đồng biên tập 2026-10-16: B13 — snp5.13:1.4 (`kappa` = vọng tưởng, bỏ “tạo tác”/“sắp đặt” (trùng `saṅkhāra`)).
