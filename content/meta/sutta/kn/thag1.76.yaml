notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên. Không có blocker.
  
  **Bài này là một bài về hình thức bên ngoài, và bản dịch giữ đúng cấu trúc đối xứng của nó.** Kệ nói: kẻ nào đứng dậy thì ngồi xuống; kẻ nào ngồi xuống thì đứng dậy; kẻ nào đi kia thì ở lại; kẻ nào hân hoan thì đừng hân hoan. Bốn vế bốn tiêu chuẩn, và **chiều đảo** phải giữ chính xác — đảo chiều là hỏng toàn bài. Bản dịch giữ:
  - `Uppatantesu nipate` → *Khi người ấy **đứng dậy** thì hãy **ngồi xuống***
  - `nipatantesu uppate` → *khi người ấy **ngồi xuống** thì hãy **đứng dậy***
  - `Vase avasamānesu` → *Khi họ **đã đi kia** thì hãy **ở lại***
  - `ramamānesu no rame` → *khi họ **đang hân hoan** thì **đừng hân hoan***
  
  Cặp `vasa`/`avasamānesu` và `ramamānesu` đúng nghĩa: `avasamāna` = đã rời đi, `vasa` = ở lại ở chỗ này; `ramamāna` = đang vui, `ramī` = vui. Chiều đối xứng giữ ở cả hai cặp.
  
  **`no` ở `1.4` → *đừng*.** `no` là dạng cấm của √ram → *đừng hân hoan* ✓; dạng này khác với `mā` (dạng cấm của √bhū) ở `thag1.82:1.4`, và cả hai đều dịch *đừng* — xử lý đúng.
  
  **Điểm trừ nhỏ ở `1.3`: *đi kia*.** `avasamānesu` được dịch *đã đi kia*, trong đó *kia* là tiếng Việt Bắc bộ. Câu vẫn đúng nghĩa và không gượng, nhưng lẫn giọng vùng với phần còn lại là tiếng Việt trung ương/neutral. Tôi trừ nhẹ ở `vietnamese_clarity`.
  
  **Sujato lệch chiều ở đây** (Sujato đặt *Settle down when others spring up* ở `1.1`, *spring up when others settle down* ở `1.2`, *Remain when others have departed* ở `1.3`, *don't delight when others delight* ở `1.4` — chỗ này Sujato **khớp** Pāli về nghĩa, chỉ lệch vì ngắn gọn hơn). Bản dịch bám Pāli ở chiều đảo.
  
  **Tên riêng:** `Piyañjaha` ở `0.4`, và `1.5` dùng `Piyañjaho` (dạng + o) theo Pāli ✓ — cùng cách xử lý như `thag1.48`, `thag1.73`.
  
  **Tầng Anh** có mặt đủ bốn vế.
  
  **Tầng Việt**: không có Thích Minh Châu cho Trưởng Lão ở commit đã ghim.
