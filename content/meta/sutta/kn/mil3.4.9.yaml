  kallosi → Khéo lắm: 0 tiền lệ; không dùng Lành thay vì đó là chữ của sādhu, khác từ Pāli.
  Nāgasenā ở 2.1 giữ đúng biến cách hô cách của Pāli khoá đó (khác nāgasena ở 1.2).
  sabbeva … ti? → phải chăng; Na kho → Không phải vậy; api ca kho → Nhưng.
