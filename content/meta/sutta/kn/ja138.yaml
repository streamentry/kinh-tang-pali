notes: |-
  Đối chiếu: kệ này song song với Dhp394. Hòa thượng Thích Minh Châu dịch Dhp394
  là Bện tóc với da dê, Nội tâm toàn phiền não, Ngoài mặt đánh bóng suông;
  Sujato dịch Dhp394 là matted hair, skin of deer, tangle inside, polish up the
  outsides. Bản Việt theo TMC ở bện tóc, da dê, phiền não, đánh bóng suông;
  theo Sujato ở cấu trúc hỏi có ích gì cho ngươi. Chỗ lệch duy nhất: ajina là da
  dê theo TMC hay da nai theo Sujato, đã ghi nhận và chọn theo truyền thống Việt.
  Godha giữ nguyên tên riêng của vị khổ hạnh (godhā còn nghĩa là kỳ đà) vì đây là
  tên bài, 0 tiền lệ nên ghi mới.
  Có song song Pháp Cú nhưng vẫn thiếu tầng Anh trực tiếp của chính bài nên
  triangulation chỉ 8.0 và bài ở draft.

