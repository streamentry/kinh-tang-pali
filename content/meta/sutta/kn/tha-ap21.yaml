notes: |-
  **Bài này.** `tha-ap21` — phẩm `Sīhāsaniyavagga` (`Phẩm Sīhāsaniya`), bài thứ chín trong phẩm,
  vị trưởng lão `Sopāka`. Tên được xác nhận **hai lần trong chính bài**: dạng Nom. sg. `sopāko thero` ở khoá
  kệ `:13.1`, và dạng `<Tên>theraapadāna` ở `:0.3`. Ở `tha-ap22:22.1` còn có uddāna của cả phẩm ghi
  `Sopāko maṅgalo ceva`, xác nhận lần thứ ba. Giữ nguyên dạng Pāli có dấu `Sopāka` vì đó là tên riêng và
  tiền lệ đã lập trong chính tầng này (`thag1.33:1.5`, `thag1.40:2.2`, `thag7.4:6.3`, `thag7.5`).

  **Sửa lớn so với lượt trước, và lý do.** Metadata cũ khẳng định bài này *đúng MỘT khoá có nội dung* và suy
  ra cả 14 bài cùng phẩm chỉ có một câu kệ. Cái đó là hệ quả của ngưỡng 40 ký tự của chốt, không phải của Pāli:
  **52/53** khoá Pāli ở đây ngắn hơn 40 ký tự, chỉ `:13.1` là dài hơn. Tôi đã đọc lại **toàn bộ 53 khoá** của
  bài, không suy từ kết luận của lượt trước. Cấu trúc thật: **12 kệ = 48 vế kệ** (`:1.1`–`:12.4`), cộng ba
  mục tiêu đề (`:0.1`–`:0.3`), một câu dẫn nhập (`:13.1`) và một câu chú thích tận (`:14.1`). Lát này giao 52 khoá
  (`:13.1` đã có sẵn và tôi giữ nguyên); nay tệp trên đĩa có đủ 53 khoá, đúng thứ tự Pāli.

  **Số Pāli — tự tính, in phép ra.** `Catunnavutito kappe` ở `:10.1` và `:11.1`:
  `catu` = 4, `navuti` = 90 ⇒ 4 + 90 = **94**. Tôi dịch **chín mươi tư**, không phải *bốn mươi chín* (=49).
  Đo được trên tầng Việt với cùng dòng Pāli `Catunnavutito kappe,`: **98 cặp** — *chín mươi tư* 78
  (dạng đầy đủ `Vào chín mươi tư kiếp trước đây,` 43 là đa số lớn nhất), *bốn mươi chín* **20** ⇒ sai 20 khoá
  (`tha-ap257:2.1`, `tha-ap268:2.1`, …). Tôi theo đa số lớn nhất.

  **Một điều trong brief phải sửa, tôi nói thẳng thay vì tin.** Brief bảo `tha-ap21:10.3` từng bị phát hiện
  dịch `Tiṁsakappasahassamhi` thành *ba mươi ngần kiếp*. Tôi dò lại từ Pāli ghim: **`tha-ap21` không có cụm
  `Tiṁsakappasahassa…` nào cả.** Trong toàn bộ `kn`, cụm ấy xuất hiện 28 lần ở 28 khoá của 13 bài, và trong
  đó `tha-ap21` không có mặt; `:10.1` của bài này là `Catunnavutito kappe`, đã tính ở trên. Phép tính đúng của
  `Tiṁsakappasahassamhi` vẫn là `tiṁsa` = 3 × `kappasahassa` = nghìn ⇒ **ba nghìn kiếp**.

  **Lỗi `Tiṁsakappasahassa` còn sót trong tầng — báo để người điều phối xử, không tự sửa** (7 khoá ở 7 tệp,
  đều ngoài lát của tôi, đều ghi *ba mươi ngàn/nghìn* = 30.000 thay vì 3.000):
  `tha-ap47:4.1`, `tha-ap54:6.3`, `tha-ap79:1.1`, `tha-ap115:10.3`, `tha-ap200:3.3`, `tha-ap217:4.1`,
  `tha-ap450:8.1`. Chỉ `tha-ap151:3.1` là đúng (`Trong suốt ba nghìn kiếp`).

  **`translationTitle`.** Đặt **bằng đúng** giá trị khoá `:0.3`, tức
  `Bài Kệ Tuyên Ngợ Về Trưởng Lão Sopāka`, và `status` là `draft`. Pāli `:0.3` = `Sopākattheraapadāna`
  **không bắt đầu bằng số** ⇒ theo luật chỉ giữ số thứ tự khi và chỉ khi Pāli bắt đầu bằng số, tôi **không** thêm
  số. Tệp cũ ghi `Kinh Kệ Của Trưởng Lão Sopāka` — đo lại trong `tha-ap` (418 tệp có `:0.3`), dạng đó chỉ có
  **3** tệp, còn `Bài Kệ Tuyên Ngợ Về Trưởng Lão …` có **214**, `Bài Kệ Tuyên Ngôn …` **94**, `Ký Sự …` **92**.
  Đo ở phạm vi gần nhất (`tha-ap11`–`tha-ap31`, 7 tệp có dữ liệu) cho **Tuyên Ngợ 4 · Tuyên Ngợi 2 · Tuyên Ngợn 1**;
  cả hai phạm vi đều nghiêng về `Tuyên Ngợ`, nên tôi theo nó. Ghi cả hai số ra đây để biên tập phán một lượt cho
  cả cuổn nếu thấy `Tuyên Ngợi` mới là lỗi chính tả cần thống nhất.

  **Tiền lệ, đếm được, cho từng quyết định.** `:0.1` `Therāpadāna` — 409/418 tệp `tha-ap` giữ nguyên văn.
  `:0.2` `Sīhāsaniyavagga` → `Phẩm Sīhāsaniya`, cả 2 tiền lệ cùng phẩm (`tha-ap15:0.2`, `tha-ap19:0.2`).
  `:14.1` theo mẫu `<Tên>ttherassāpadānaṁ <thứ tự>` — đa số `Bài Kệ Tuyên Ngợ Về Trưởng Lão X, thứ N.`
  (191) so với `Tuyên Ngôn` (92) và `Ký sự` (62/36). Cùng công thức ấy cho `imā gāthāyo abhāsitthāti` ở `:13.1`
  là **số nhiều**: *đã nói **những** bài kệ này*, đúng nhóm đa số 407 của tầng, không phải nhóm 21 khoá *bài kệ này*.
  Những vế trùng nguyên văn đã dùng lại đúng câu đã có: `:1.3`=`tha-ap200:1.1`, `:2.2`=`tha-ap174:1.2`,
  `:3.2`=`tha-ap30:6.2`, `:4.1`–`:4.4`=`ja95:1.4`, `:5.1`=`tha-ap326:8.1`, `:5.2`=`tha-ap142:3.4`,
  `:5.4`=`thi-ap7:6.4`, `:7.1`=`tha-ap347:6.1`, `:7.2`=`tha-ap188:2.2`, `:8.2`=`tha-ap84:1.2`,
  `:8.3`=`tha-ap84:1.1`, `:8.4`=`tha-ap121:8.4`, `:9.1`=`thag5.5:1.5`, `:9.2`=`ja221:2.2`,
  `:10.3`/`10.4`=`tha-ap252:3.3`/`:3.4`, `:11.4`=`thag2.21:1.4`, `:12.1`=`tha-ap154:8.1`,
  `:12.2`/`:12.3`=`tha-ap113:10.2`/`:10.3`, `:12.4`=`tha-ap154:8.3`. Đếm được bằng script (loại chính bài này ra
  khỏi chi mục tiền lệ): **27/53** khoá có ít nhất một tiền lệ Pāli trùng nguyên văn, và **21** khoá dùng lại
  **nguyên văn** tiếng Việt của tiền lệ. Sáu khoá còn lại lệch, và tôi liệt kê cả sáu để không ai phải đoán:
  `:2.2` chỉ thêm chữ *là* ở đầu để nối với *Đức Phật* ở `:2.1`; `:3.2` và `:9.2` chỉ đổi dấu chấm cuối theo Pāli
  của bài này (`;` thay `,`); `:8.2`, `:8.4`, `:11.4` chỉ thay đại từ (xem mục Đại từ). Trong chính bài có **1**
  cặp Pāli trùng nguyên văn (`:10.1` và `:11.1`, cùng `Catunnavutito kappe,`) và cả hai khoá dùng **cùng một**
  câu Việt — không có cặp trùng nào mà Việt lệch.

  **Dấu lược và nháy.** Bài này **không có** `…pe…`, không có `…` trần, không có `(…)`, không có khoá kết `….`
  ⇒ ba quy ước tầng không vào cuộc ở đây, mẫu số 0 nên không lỗi nào có thể phát sinh. Nháy: Pāli mở `“` ở
  `:1.1`, mở `‘` ở `:4.1`, đóng `’` ở `:4.4`, đóng `”` ở `:12.4` — tức **cố ý chạy qua khoá**, và bản Việt
  khớp từng khoá y hệt (mở 2 / đóng 2 trên cả bài).

  **Sáu phép tự viết, vì `_hvi.py` ở đây chạy rỗng** (bộ lọc `len(p[k]) >= 40` không quét khoá nào). Mẫu số
  53/53 cho cả sáu: (1) `set(khoá Việt) == set(khoá Pāli)` — thiếu 0, thừa 0; (2) số nháy kép **và nháy đơn**
  khớp Pāli từng khoá — lệch 0; (3) số dấu `…` khớp từng khoá — lệch 0; (4) Pāli kết `….` → Việt kết ` ….`
  — cả hai vế 0; (5) NFC — 0 khoá lệch, và 0 khoá Việt trùng nguyên văn Pāli (trừ `:0.1` `Therāpadāna`, là tên
  chương mà 409/418 tệp giữ nguyên văn, nên cố ý); (6) quét Pāli lọt vào bản Việt — 0. Chạy lần hai cho
  byte-for-byte không đổi. **Không** tuyên bố technical gate pass: bị cấm chạy cổng nên `technical_integrity`
  đặt 9,6, và bốn lệnh còn lại là `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  **Bất định đã ghi, không giấu.**
  (a) `:3.3` `Mamañca gatimaññāya` — toàn Pāli ghim chỉ có đúng một lần. `gatimaññāya` là *đã nắm được mục
  đích*, nhưng chủ từ có thể là Đức Phật (đã ngầm nhắm đến đích đến để dạy tôi) hoặc tôi (đã hiểu đích đến
  của lời dạy). Tôi dịch theo cách đọc thứ nhất, chủ thể Đức Phật, vì câu kế tiếp `aniccatamudāhari` là lời
  tuyên ngợ của Ngài.
  (b) `:9.3` `Tosetvāna mahānāgaṁ` — toàn Pāli ghim chỉ có đúng một lần. `mahānāga` có thể là *bậc đại vĩ*
  (tôn quý bậc thượng) hoặc `nāga` theo nghĩa *chúa/người đứng đầu*; cũng không loại trừ việc chỉ các chúng
  sinh loài nāga. Tôi dịch *đã quy tụ những bậc đại vĩ*, giữ hình ảnh mà không khẳng định đối tượng. Đây là
  bất định có thể đổi nghĩa câu, nhưng không đổi nghĩa giáo lý nào, nên ghi ở đây chứ không nâng thành blocker.
  (c) `:9.4` `Alatthaṁ upasampadaṁ` — cũng chỉ có một lần trong Pāli ghim. `dn14:3.13.1` và `dn14:3.17.1` cho
  nghĩa `alatthaṃ upasampadaṃ` là *giới pháp vô thượng* (đã xuất gia, thọ cụ túc giới). Vì `:8.4` vừa nói
  A-la-hán rồi, tôi dịch theo nghĩa thuần túy là *đạt đến chỗ vô thượng*, khớp với `:12.1`–`:12.4` (bốn vô ngại
  giải và tám giải thoát) là thành tựu vô thượng. Nếu biên tập muốn bám sát `dn14` hơn thì có thể đổi thành
  *giới pháp vô thượng* — tôi không tự đổi vì nó sẽ lệch nghĩa với `:8.4`.
  (d) `:2.2` `lokajeṭṭhassa tādino` là cách sở hữu, tôi dịch thành vế danh định *là bậc tối thượng thế gian,
  bậc Vững Vàng kiên định* để câu Việt đọc được; đây là chiếm dụng ngữ pháp cho tự nhiên, và **đúng** tiền lệ
  `tha-ap174:1.2` với cùng dòng Pāli cũng làm vậy. `tādino` còn 7 cách trong tầng (`bậc Vững Vàng kiên định`
  6, `bậc đã thuần phục` 2, …); tôi theo đa số 6 chứ không tự sinh cách thứ N+1.
  (e) `:4.1` Pāli kết `,` nhưng `vata` là tiếng cảm thán, tôi kết `!` — y hệt tiền lệ `ja95:1.4` với cùng
  dòng Pāli.

  **Đại từ.** Tôi dùng *tôi* nhất quán cho hành động của chính vị trưởng lão, kể cả ở `:7.4` và `:8.2`–`:8.4`,
  thay cho các tiền lệ trong tầng dùng *ta* / *con* / vô định ngữ; lý do là bài này kể một mạch hành trình của
  một người và dùng lẫn lộn ba cách làm câu rối người đọc. Khi dùng lại tiền lệ cho vế trùng nguyên văn, tôi
  chỉ giữ nguyên phần thuật ngữ và thay đại từ cho khớp mạch này.
