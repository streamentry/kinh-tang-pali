notes: |-
  CHOT KIEM KHONG TU CHAY — DA TU KIEM. Khoá Pāli dài nhất 33 ký tự nên `cần` rỗng. Tự quét
  9/9 khoá: đủ, đúng ID, không rỗng, NFC, dấu lược khớp, nháy kép cân.

  TAU THAM KHAO: 8/9 khoá có chữ trong Anh Sujato; khoá trống là 2.1 (dòng chốt, Sujato để trống
  ở mọi bài Jātaka).

  KHUON TIÊU ĐỀ: Jātaka, Bộ Một Bài Kinh, Kinh <tên> thứ tám. `Kulāvakavagga` → *Phẩm Tổ Chim*
  dùng lại nguyên văn: đo lại trên đĩa có 5 cách, đa số là *Phẩm Tổ Chim* (ja31, ja39). Bản
  nháp tôi viết *Phẩm Chim Ưc* — đúng nghĩa `kulāvaka` là gốc rễ loài chim, nhưng lệch với
  tiền lệ nên đã đổi. `baka` (0 lượt) → *hạc*, theo Sujato (The Crane).

  DAY COT KHA NANG LAI CA MA TÔI KHONG CHOT DUNG. `Ārādheti` ở 1.3 là động từ chủ động
  “đạt tới”, nhưng vế 1.4 (`bako kakkaṭakāmivā`) lại là so sánh “như con hạc, y như con cua”,
  nên `Ārādheti` không thể đứng trọn trong khoá 1.3. Tôi dịc *Chỉ … được* rải sang 1.4. Bản
  nháp tầng đầu của tôi dịch 1.3 y hệt 1.1, tức **đã bỏ mất chữ Ārādheti**; đây là lỗi tôi tự bắt
  và đã sửa, nên tôi hạ semantic_fidelity và ambiguity_integrity. Đây là chỗ người đọc có thể
  đọc ngược thông điệp của toàn kệ, nên ghi rõ.

  LƯU Ý THÊM: `nikatippañño` lặp ở cả 1.1 và 1.3 trong Pāli, và tôi dịch hai khoá gần giống nhau
  (cả hai đều *Bậc khéo tìm tòi, có trí tuệ*) vì Pāli cũng gần giống nhau; khác biệt là chữ
  Nāccantaṁ ở 1.1 và Ārādheti ở 1.3.
