notes: |-
  Đã đọc HẾT Pāli lát qua v5/p5.txt trước khi viết. Không segment nào của lát này có …pe… nên hai phía đều 0 dấu lược. Mọi dấu nháy kép đều cân trên cả bài.
  Khung đối đáp giữ nguyên một cách dịch với mil3.4.9, mil3.5.4, mil3.7.13: Vua nói, Trưởng lão nói, thưa tôn giả Nāgasena, này Đại vương, và câu chốt Khéo lắm, thưa tôn giả Nāgasenā. Colophon Câu hỏi về …, thứ N.

  0 tiền lệ cho tên phẩm Sativagga, đặt mới: sati theo glossary là niệm (AN1.x), và
  đây là phẩm hỏi về sự biết và phân biệt, nên dịch Phẩm Chánh Niệm.
  Tiêu đề Assubhesajjābhesajjapañha dịch là Câu hỏi về việc khóc và làm thuốc: cụm
  Pāli là không-khóc và không-phải-thuốc, đúng nghĩa là sự không khóc và sự làm thuốc.
  0 tiền lệ, đặt mới có lý do: thân kinh chỉ nói nước mắt (assu), nên đưa nước mắt vào
  tiêu đề sẽ thêm chủ thể mà chữ không có.
  Tiền lệ có đếm: bhaishajya → thuốc men trị bệnh (tiêu chuẩn trong tầng, 43 chỗ);
  dài/độc → thuốc tẩy (12); assu → nước mắt; uṇa/sītala → nóng và mát; soma → sự buồn
  bã (12); pīti → niềm vui (107).
  rājadosamohehi đọc là mật và thuốc tẩy của nhà vua, theo ẩn dụ đông y: mật và thuốc
  tẩy sinh nóng, niềm vui và buồn bã sinh mát. Đó là ý Pāli dùng để đối lập, không
  phải thuyết y học của bản dịch; thân kinh không nói vì sao, nên không thêm lý do vào
  bản dịch.
  vimala sītala giữ là trong lành và mát; samala uṇa giữ là đặng lẫn lộn và nóng.
  Vế 1.4 quy tắc chung cho cả hai loại nước mắt, đã dịch đúng như Pāli chứ không
  đảo chiều thành nước mắt nào cụ thể.
