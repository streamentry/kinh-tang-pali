notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all; file Pāli và file en/sujato đều so git-hash với source/upstream-manifest.json và khớp. Tầng english-sujato CÓ mặt ở commit này: 10/11 khoá có prose, khoá colophon 2.1 Sujato để trống như ở mọi Jātaka, dịch từ Pāli theo tiền lệ 88 colophon đã có. Không có segment Pāli ≥ 40 ký tự nên sàn coverage 0,8 không kích hoạt.
  Tiền lệ có đếm: Sīlavagga → Phẩm Giới (8 tệp: ja12, ja14–ja19); Ekakanipāta → Bộ Một Bài Kinh (89/89); colophon không dấu phẩy, khớp cả 8 tệp cùng phẩm.
  Thuật ngữ: kaṇḍi là mũi tên/cây gai nhọn nên kaṇḍinaṁ sallaṁ dịch là mũi tên có gai; Sujato dịch tiêu đề là The Arrow và tôi cũng chọn Kinh Mũi Tên. gāḷhavedhin là xuyên thẳng vào hõm cổ, dịch xuyên thẳng vào cổ một người. Dhiratthu là tiếng nguyền rủa, có tiền lệ ở mn93. pariṇāyikā là nắm quyền; vasaṅgatā là rơi vào quyền lực của. Ba chữ Dhiratthu/dhikkitā đều là động từ nguyền rủa và đều được giữ.
  Bất định đã ghi: Te cāpi dhikkitā sattā / ye itthīnaṁ vasaṅgatā — sattā là số bảy, nhưng vasaṅgatā là số nữ số nhiều nên chủ từ có thể là phụ nữ phụ thuộc phụ nữ chứ không phải đàn ông phụ thuộc phụ nữ. Pāli của bài không phân xử được; Sujato đọc là creatures. Tôi dịch Bảy người ấy … là kẻ rơi vào quyền lực của phụ nữ, giữ cả số bảy lẫn đối tượng phụ nữ mà không chọn bên. Vì vậy semantic_fidelity 9.2, grammar_logic 9.2, ambiguity_integrity 9.1. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú nên không có bản Hòa thượng Thích Minh Châu để đối chiếu.

  Lượt rà soát 2026-10-15 (kiểm mẫu ngẫu nhiên, Claude Sonnet 5.5 (Claude Code)): đọc đủ 11 khoá, đối
  chiếu Sujato. Sửa 1.5: sattā (dài ā) là số nhiều của satta "chúng sinh" (PED), không phải số bảy
  (satta, ngắn, bất biến) — đính chính ghi chú cũ; dịch "Những chúng sinh ấy". Sửa 1.2: bỏ "cổ" không
  có trong Pāli (gāḷhavedhin = xuyên sâu), dịch "xuyên sâu vào một người". Phần "bất định chủ từ" ở
  ghi chú cũ nay không còn hiệu lực.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
