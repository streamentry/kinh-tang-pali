notes: |-
  Sửa lan 2026-10-13: khoá `iti76:6.6` — `neva pāpasakhā siyā`: *nên không kết bạn với kẻ ác* → *không nên kết bạn với kẻ ác*. Căn cứ: `siyā` là thức cầu khiển (`dhīro … neva pāpasakhā siyā` = bậc trí không nên là bạn của kẻ ác), nên là lời khuyên chứ không phải lời kể; bản cũ dùng *nên* như một liên từ chỉ kết quả (*nên không kết bạn*) làm câu thành mô tả. Tiền lệ cho `na/neva … siyā` ở thể khuyên: *không nên* ở `an8.43:7.2`, `an8.42:10.2`, `an8.45:7.2`, `snp2.14:26.2`, `ja515:38.4`; *chớ* ở `mnd15:83.3`, `snp4.15:10.4`. Cả ba khoá có Pāli trùng nguyên văn (`iti76:6.6`, `ja503:24.6`, `ja545:104.6`) nay có bản Việt giống nhau. Điểm không đổi; giữ nguyên các khoá còn lại.
