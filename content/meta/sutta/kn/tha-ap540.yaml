notes: |-
  Dịch trọn 182 khoá (3 khoá tiêu đề :0.x, 176 khoá kệ gồm ba khoá …pe…, khoá lời kết 46.1 và khoá kết 47.1) trực tiếp từ Pāli root; không có bản Anh của Sujato, không có lớp english-project và không có bản Việt hiện hành cho tha-ap540 tại commit đã ghim. Đối chiếu thuật ngữ và công thức với các Ký Sự cùng phẩm và liền kề (tha-ap539, tha-ap541, tha-ap543, tha-ap554, tha-ap555) cùng các bài tha-ap khác có cùng Pāli.
  Tiền lệ đã đo: có 58 khoá (không kể :0.x) mà Pāli, bỏ dấu câu và nháy, trùng nguyên văn với khoá đã dịch ở nơi khác (22.609 khoá Pāli đã có bản Việt trong 543 bài tha-ap được dò); 57 khoá dùng lại nguyên văn một dạng đã có, trong đó có Đức Chiến Thắng tên Padumuttara (24 trong 31 khoá cùng Pāli, 6 khoá chỉ khác nháy mở), Cách đây một trăm ngàn kiếp (11 trong 11 khoá cùng Pāli, 2 khoá có thêm nháy mở), vị ấy đã đưa đông đảo mọi người vượt qua (8 trong 9), Là bậc đầy lòng trắc ẩn từ bi (10 trong 11), Rực rỡ tựa như cột trụ bằng vàng, sinh ra trong dòng họ Okkāka, tên là Gotama theo dòng ấy, sẽ làm bậc Thầy ở thế gian (36 khoá ở 15.4 và 36 trong 37 khoá ở 15.2), Người kế thừa giáo pháp của Ngài (23 trong 24), là con ruột do giáo pháp tạo nên (21 trong 24), sẽ làm đệ tử của bậc Thầy (dạng có nháy đóng; 2 khoá, so với 10 khoá dạng môn đồ và 7 khoá dạng không nháy đóng, nên chọn dạng của tha-ap539 và tha-ap541, đúng với Pāli khoá này có nháy đóng), Cùng một ngàn tùy tùng (1 khoá), ta đã đạt tới bậc A-la-hán (9 trong 31 khoá cùng Pāli; các khoá còn lại chủ yếu dùng ngôi tôi theo ngôi kể của từng bài), đã đặt ta vào vị trí tối thắng, Các phiền não của ta đã được thiêu rụi (126 trong 182 khoá cùng Pāli), ta sống không còn lậu hoặc (138 trong 203), Thật lành thay sự đến của ta (121 trong 175), đã làm tròn lời dạy của Đức Phật (495 ở khoá có nháy đóng), Bốn vô ngại giải (528 trong 541). Một khoá khác với tiền lệ: 11.4 nibbattassa tahiṁ tahiṁ dịch ở mỗi nơi con sinh ra, trong khi 3 khoá tiền lệ (tha-ap384:4.4, tha-ap469:4.4, tha-ap512:4.4) dịch mỗi bước lại thêm một chút; các khoá đó nằm trong đoạn nói về một bảo vật hiện khởi, không phải lời nguyện tái sinh, và chưa chắc đã đúng nghĩa; ngoài lát, không sửa, nên rà lại.
  Ngôi kể dùng ta: phạm vi tha-ap500 đến tha-ap559 (không tính bài này) là 457 khoá chứa ta so với 321 khoá chứa tôi; toàn lớp tha-ap là 2.067 so với 1.888, nên hai phạm vi cùng nghiêng về ta; chọn ta theo các bài liền kề trong phẩm (tha-ap539, tha-ap541). Ngôi số nhiều của câu chuyện ba anh em dùng chúng ta (toàn lớp tha-ap, không tính bài này: 48 khoá chúng ta so với 4 khoá chúng tôi; trong phạm vi tha-ap500 đến tha-ap559: 20 so với 1) cho đồng nhất với ta. Lời của ba anh em với đức vua (22.1 đến 22.4) dùng bệ hạ và chúng ta; lời của Bà-la-môn với Đức Thế Tôn (11.1 đến 11.4) dùng con, theo tha-ap541:23.1.
  Tên phẩm Kaccāyanavagga dịch Phẩm Kaccāyana (tha-ap533, tha-ap537, tha-ap539, tha-ap541). :0.3 trong Pāli là 8 Uruveḷakassapattheraapadāna, bắt đầu bằng số nên bản Việt giữ số thứ tự theo hình thức N. (như tha-ap539 và tha-ap533); translationTitle bằng đúng giá trị :0.3 (8. Ký Sự Về Trưởng Lão Uruveḷakassapa). Dạng tên bài theo đa số gần nhất (tha-ap500 đến tha-ap559, không tính bài này: Ký Sự 40 so với Bài Kệ Tuyên Ngợ 15); trên toàn lớp tha-ap hai dạng kia lại nhiều hơn (Tuyên Ngợ 255, Ký Sự 144, Tuyên Ngôn 138, Kinh Kệ 5, khác 2), hai phạm vi cho hai đa số khác nhau và chữ Tuyên Ngợ có vẻ là lỗi chính tả cần người biên tập phán một lượt cho cả cuốn. Về số thứ tự, trong phạm vi tha-ap500 đến tha-ap559 có 20 tên giữ số và 35 tên không giữ số; chọn theo Pāli :0.3 có số. Chữ ḷ giữ theo Pāli :0.3 và 46.1 (Uruveḷakassapa), còn địa danh Uruvelā (35.3, 36.2 uruveḷanivāsiko) viết thống nhất là Uruvelā, như tha-ap392:30.3. Lời kết 46.1 dùng nhóm nói những bài kệ này (539 khoá, theo imā gāthāyo là số nhiều; 2 khoá dạng số ít). Khoá 47.1 theo dạng Ký Sự Về Trưởng Lão X, thứ tám (như tha-ap539 và tha-ap541); aṭṭhamaṁ là thứ tám.
  Lời thọ ký tương lai (12.1 đến 16.4): bhavissati, hessati, lacchase dịch sẽ làm, sẽ đạt được. Khoá 15.1 Satasahassito kappe dùng Sau một trăm ngàn kiếp nữa (như tha-ap539:14.1 và tha-ap541:12.1), hướng tương lai vì động từ ở 15.4 là bhavissati; trong lớp, 60 khoá cùng Pāli: 30 khoá dịch Vào một trăm ngàn đại kiếp trước, 12 khoá Vào một trăm ngàn kiếp trước đây, 7 khoá Sau một trăm ngàn kiếp nữa; hai dạng đầu là hướng quá khứ nên chỉ đúng ở những bài mà Pāli đi với động từ quá khứ. Khoá 1.3 Ito satasahassamhi dùng Cách đây một trăm ngàn kiếp (9 trong 11 khoá cùng Pāli).
  Dấu lược: ba khoá …pe… (43.2, 44.2, 45.2) giữ đúng một …; không có (…) trần trong Pāli của bài này. Nháy: kép mở ở 1.1 và đóng ở 45.3 (44.3 không có nháy đóng, đúng Pāli); nháy đơn mở ở 11.1 và đóng ở 11.4, mở ở 12.4 và đóng ở 16.4, mở ở 21.1 và đóng ở 21.4; đều khớp Pāli từng khoá, 0 lệch trên 182 khoá (3 cặp nháy đơn, 1 cặp nháy kép). Đối chiếu 182 khoá với Pāli: đủ khoá, đúng thứ tự, NFC sạch, không khoá rỗng, không khoảng trắng thừa, chữ Pāli trong bản Việt chỉ là tên riêng (Therāpadāna, Padumuttara, Haṁsavatī, Okkāka, Gotama, Kassapa, Bārāṇasī, Guṇa, Rucā, Nārada, Uruvelā, Uruveḷakassapa, Nadīkassapa, Gayā, Gayākassapa, Phussa, Videha, Kaccāyana) và đơn vị ratana. Có 4 nhóm Pāli trùng nguyên văn trong chính bài (2.4 và 6.4; 16.3 và 36.1; 43.2, 44.2 và 45.2; 44.3 và 45.3), tổng 6 cặp, 0 cặp lệch về nghĩa: 16.3 và 36.1 chỉ khác chữ hoa đầu câu (tên theo dòng họ là Kassapa so với Tên theo dòng họ là Kassapa, vì 36.1 mở câu mới), 44.3 và 45.3 chỉ khác nháy đóng, đúng theo Pāli. Đã đọc cặp Pāli với Việt của cả 182 khoá.
  Số Pāli, mỗi phép tính đã kiểm: satasahassa là sata 100 nhân sahassa 1.000 là 100.000, dịch một trăm ngàn ở 1.3, 6.1 (vassasatasahassāni là 100.000 năm) và 15.1; Ratanānaṭṭhapaññāsaṁ là aṭṭha 8 cộng paññāsa 50 là 58 ratana, giữ đơn vị ratana (như tha-ap539:5.1 và tha-ap541:5.1), không quy đổi; bāttiṁsa là ba mươi hai (5.4); dvenavute là dve 2 cộng navuti 90 là 92, dịch chín mươi hai kiếp ở 17.1 (41 trong 44 khoá cùng Pāli đã dịch chín mươi hai); sahassa ở 9.3 và 40.1 là một ngàn; dve satāni là hai trăm (38.1), tīṇi là ba (ba trăm ở 38.2), pañca satānūnā là năm trăm (38.3), cộng lại 200 cộng 300 cộng 500 là 1.000, khớp sahassaparivārena ở 40.1; dasa kammapatha là mười nghiệp đạo (32.2); catasso paṭisambhidā là bốn vô ngại giải (45.1). Không có cụm tiṁsakappasahassa nào cần phân xử, và không có tiṁsa nào trong bài. Lưu ý ngoài lát (không sửa): cùng Pāli Dvenavute ito kappe đã dịch Vào chín mươi tư kiếp trước ở tha-ap244:3.1 và tha-ap245:3.1, và Từ hai mươi chín kiếp trước ở tha-ap265:2.1, cả ba đều không đúng với dve 2 cộng navuti 90; nên rà lại.
  Bất định và lựa chọn cần người biên tập lưu ý: (1) 8.1 đến 8.4: mahāparisatiṁ ở 8.1 là hình thức khó phân tích (chưa phân tích chắc; có thể là mahāparisā ở dạng kéo dài vì vần, có thể là cách chỉ vị trí); bản Việt dịch trong hội chúng lớn, giữ vị đệ tử có hội chúng lớn (mahāparisasāvakaṁ) ở 8.2 làm tân ngữ của ṭhapentaṁ, với Đức Phật là chủ thể, giống cách bản Việt nguyên bài ở mục Tra cứu toàn văn hiểu; vị trí tối thắng (etadagga) là vị trí về việc có hội chúng lớn, khớp 42.1. (2) 7.2 sādhusammato dịch được xem là bậc hiền thiện; sādhu có thể là tính từ hay phó từ; 0 tiền lệ. (3) 9.1 đến 9.4: mahatā parivārena có thể thuộc về Đức Phật hay về người nói; sahadānaṁ không dịch riêng mà gộp vào cùng với một ngàn vị Bà-la-môn ở 9.3; 0 tiền lệ cho 9.2 đến 9.4. (4) 11.2 adhikāraguṇena dịch công đức của việc phụng sự (adhikāra là phụng sự theo 3 khoá tiền lệ, trong đó tha-ap541:11.3 và tha-ap541:24.3). (5) 12.1 đến 12.4: gajagajjitasussaro dịch giọng hay như tiếng voi rống; karavīkaruto dịch tiếng như chim ca-lăng-tần-già (2 khoá tiền lệ cho chim karavīka). (6) 14.2 sīhaghosassa bhikkhuno dịch vị tỳ-kheo có tiếng rống sư tử (0 tiền lệ). (7) 19.2 rājā paccā ahumhase đọc như rājāpaccā ahumhase (chúng ta là hậu duệ của đức vua); nếu tách rājā và paccā thì paccā không có nghĩa rõ. (8) 20.3 kupitapaccanto dịch vùng biên địa nổi loạn; 21.2 aṭṭavībalaṁ dịch lực lượng trong rừng, không thêm nghĩa giặc cướp mà Pāli không nêu (0 tiền lệ). (9) 21.4 puna dethāti bhāsatha khó nhất bài: dethā là mệnh lệnh số nhiều của dadāti và bhāsatha là hãy nói; nghĩa đang chọn: rồi lại hãy nói hãy ban cho, vì 22.2 đáp lại bằng deyyāsi (nếu bệ hạ ban bậc Dẫn Đạo), nên đây là lời mời xin phần thưởng; cách đọc khác là trao lại (giao lại lãnh địa đã bình định) hoặc hãy báo lại, như bản Việt nguyên bài ở mục Tra cứu toàn văn hiểu; không phân xử được, bản Việt giữ động từ ban cho mà không thêm tân ngữ. (10) 22.1 đến 22.4: Pāli không có nháy cho lời nói của ba anh em, nên bản Việt không đặt nháy; bệ hạ là cách xưng hô của người nói với đức vua. (11) 24.1 đến 24.4: rājānaṁ lokanāyakaṁ có thể đọc là đức vua là bậc dẫn đạo thế gian; bản Việt coi lokanāyakaṁ đồng vị với bậc Đạo Sư ở 24.1, vì 22.2 nāyakaṁ chỉ Đức Phật và 24.3 munivīraṁ là bậc Mâu-ni Anh Hùng. 23.2 bhūmipālena và 20.4 mahīpati đều dịch đức vua. (12) 25.2 paṇītāni rasāni dịch các món ngon thượng hạng; rasa ở đây chỉ thức ăn, 0 tiền lệ; 25.3 senāsanāni dịch chỗ ngồi nằm, theo tên tha-ap Senāsanadāyaka (Chỗ Ngồi Nằm; cùng Pāli senāsanāni ở một khoá khác dịch chỗ ở). (13) 26.2 dhammenuppāditāni no dịch những thứ chúng ta có được một cách đúng pháp; 0 tiền lệ. (14) 28.2 gatā tattha mahāsukhaṁ gộp gatā vào 28.1 (từ đó mệnh chung, đến cõi Đâu-suất) và dịch niềm đại lạc là tân ngữ của 28.3 anubhūtā. (15) 30.4 rucāya mama dhītuyā: rucā đọc là tên người con gái (Rucā; bản Việt giữ Rucā, bản Việt nguyên bài ở mục Tra cứu toàn văn viết Rujā), và vì Pāli không có ovādaṁ ở khoá này nên bản Việt dịch đối với Rucā, con gái ta, để lời khuyên của nàng ở 31.1 Không nhận lời khuyên; cách đọc khác là rucāya chỉ sự ưa thích của con gái, dẫn tới nghĩa khác hẳn; không phân xử được. (16) 31.2 đến 31.4: brahmunā nāradena đi với saṁsito (được chỉ dạy), diṭṭhiṁ hitvāna pāpikaṁ là đã từ bỏ tà kiến xấu ác, và 32.1 đến 32.4 hitvāna dehaṁ là đã bỏ thân; saṁsito dịch được chỉ dạy theo 0 tiền lệ. (17) 34.2 ogāhetvā mahāvanaṁ dịch đã đi sâu vào khu rừng lớn (cùng Pāli ajjhogāhetvā ở các bài khác cũng dịch đi sâu vào); bản Việt nguyên bài ở mục Tra cứu toàn văn (Bhikkhu Indacanda) đọc khác ở chỗ từ bỏ tài sản lớn lao, không có căn cứ trong Pāli khoá này. (18) 35.1 dve bhātaro dịch hai người em, dựa vào 38.1 và 38.2 (kaniṭṭha là em út, majjha là người em giữa), nên người nói là người anh cả; Pāli 35.1 và 37.1 chỉ nói bhātaro, nên đây là suy ra từ 38. (19) 37.3 sakāsanāmena dịch tên theo nơi ở gần ấy; 0 tiền lệ. (20) 38.3 pañca satānūnā dịch năm trăm, không thiếu; satānūnā đọc là sata cộng anūna. (21) 39.3 pāṭihīrāni dịch phép thần biến theo sn10.5:2.3 (1 khoá tiền lệ). (22) 40.2 ehibhikkhuko dịch tỳ-kheo Hãy Đến: Pāli là vị tỳ-kheo trở thành tỳ-kheo bằng lời gọi ehi bhikkhu (Hãy đến, này tỳ-kheo, như mn86:6.20 và thag12.2:6.3); không dùng nháy để khỏi lệch nháy Pāli, không thêm giải thích; 0 tiền lệ cho ehibhikkhuka trong tha-ap. (23) 41.4 tato maṁ isisattamo dịch bậc tối thượng giữa các ẩn sĩ (chỉ Đức Phật; 0 tiền lệ cho isisattama). (24) tādibhi ở 4.4 dịch những bậc Vững Vàng (như tha-ap539:4.4 và tha-ap541:4.4); toàn lớp tha-ap là dạng bậc Như Thật và các dạng khác chiếm nhiều hơn. (25) 46.1 dùng nhóm số nhiều của lời kết; ngoài ra 17.4 viết Đức Phussa (Phusso trong Pāli là tên bậc Phật), tham chiếu ba khoá Phussa khác trong lớp.
