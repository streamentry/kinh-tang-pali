notes: |-
  Đợt 19, làn 71. Dịch từ Pāli root commit đã ghim, đủ 99/99 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện; vì vậy người nói của một số khổ kệ không được ghi vào thân kinh mà chỉ suy ra từ nội dung (xem bất định 1).

  **Tiêu đề.**
  - `0.2` “Bộ Tạp Tập” và `0.3` “Phẩm Ruộng Lúa”: dùng lại nguyên văn các bài cùng bộ, cùng phẩm (đo lại 2026-10-13: 12/12 bài khác là `ja484`–`ja492` và `ja494`–`ja496`, cho cả hai khoá; cả hai là khoá Pāli trùng nguyên văn).
  - `0.4` “10. Kinh Thương Nhân Lớn”: `vāṇija` → “thương nhân” theo đa số (đo trên 16 khoá chứa `vāṇij…`: “thương nhân” 12 · “thương buôn” 2; ví dụ `ja466:0.4` “Kinh Thương Nhân Biển”); `Mahā-` → “Lớn” như `ja491:0.4` “Kinh Con Công Lớn”. Số `10.` ở `0.4` và `dasamaṁ` ở `23.1` đều là 10 ⇒ “thứ mười” khớp (tiếp nối `ja492` là thứ chín). `23.1` “Kinh Thương Nhân Lớn, thứ mười.” theo khuôn `ja491:18.1` và `ja466:13.1`.

  **Tiền lệ dùng lại nguyên văn (đo lại 2026-10-13 sau lượt cải thiện): 18 khoá Pāli (trong 99) có đối ứng nguyên văn đã dịch ở bài khác, tổng 714 cặp đã dò; 654 cặp giống hệt (sau khi bỏ dấu câu), 60 cặp lệch.** Trong 714 cặp, `0.1` “Jātaka” chiếm 546 (530 giống hệt, 16 lệch vì 16 bài khác dịch “Chuyện Tiền Thân”; không thuộc lát này, không đụng), và `9.2` chiếm 38.
  - Dùng lại nguyên văn: `0.1` (530/546), `0.2`, `0.3` (12/12 bài cùng phẩm); `2.4` (7/7); `9.2` “người nữ được trang sức đẹp đẽ,” (34/38, xem lượt cải thiện); `9.3` (1/1); `12.3` “bạc và vàng,” (4/5); `17.1`–`17.4` (8/8, 8/8, 5/5, 5/5, xem mục (a)); `22.3` “ly tham ái, không chấp thủ,” (6/8; `iti15:4.3`, `iti105:4.3`, `cnd22:42.3`, `cnd23:10.3`, `mnd16:43.3`, `thag16.8:25.1`).
  - Lệch có chủ ý, đã đo, không phải lệch vì muốn khác: (a) `17.1–17.4` khớp nguyên văn 4/4 khoá với `ja452:7.1–7.4`, `ja528:30.1–30.4`, `ja538:10.1–10.4` (và `17.4` còn khớp `ja516:45.4`): 0 lệch. Ghi chú cũ nói `ja452:7.3–7.4` đang dịch lệch là đã lỗi thời (các khoá ấy nay trùng bản này); không còn việc nào cần rà soát ở `ja452`. (b) `21.2` “thấy rõ lợi ích của chính mình,”: 9 cặp Pāli trùng nguyên văn nhưng không có dạng chiếm ưu thế (“nhìn thấy lợi ích cho chính mình” 3 · “thấy rõ điều lợi ích cho tự thân” 2 · “thấy rõ lợi ích của chính mình” 1 · “thấy rõ lợi ích của mình” 1 · “sau khi thấy được điều lợi của chính mình” 1 · `ja462:2.4` “suy nghĩ đến lợi ích của chính mình” 1); giữ dạng của `sn3.25:9.2`; `sampassaṁ` là “thấy rõ, nhìn xét”, chủ thể ở đây là người trí. `21.1` “Vì thế, người trí,”: 9 cặp, 3 giống hệt (`mn143:17.11`, `mn143:19.12`, `mil8:6.5`), “Do vậy, người trí,” 4, dạng khác 2 ⇒ không có đa số rõ, giữ. (c) `9.4` “đeo hoa tai ngọc.”: 13 cặp, 9 giống hệt, `tha-ap3:107.4`, `tha-ap8:38.4`, `tha-ap24:43.4` “đeo hoa tai bằng ngọc.” (3), `vv43:7.4` là cấu trúc so sánh bậc nhất; đo trên 45 khoá chứa `kuṇḍal…` thì “hoa tai” 12 · “bông tai” 8 · “vòng tai” 2. (d) `12.2` “nhiều ngọc trai và ngọc lưu ly;” khác `ja256:1.6` (“cùng rất nhiều ngọc trai và đá quý.”) và `ja419:1.2`: `veḷuriya` → “lưu ly” đo trên 32 khoá chứa `veḷuriy…`: “lưu ly” 27 · “mắt mèo” 3 · “đá quý” 3 · “ngọc bích” 1; và `pv19:5.4` (“ngọc trai và ngọc lưu ly cũng nhiều.”) cùng cặp từ Pāli. (e) `22.1` “Biết sự nguy hiểm như vậy,” khác `an4.9:3.1` (“Hiểu được tai họa ấy —”, 1 cặp); chọn “nguy hiểm” theo `iti15:4.1`. (f) `22.4` “tỳ-kheo hãy sống chánh niệm.”: 19 cặp Pāli trùng nguyên văn; giống hệt 3 (`iti15:4.4`, `iti105:4.4`, `thag2.17:2.4`, bài cùng bộ kết `22.1`–`22.4` và cùng khuôn kệ); toàn tầng thì “du hành” 10 · “đi lang thang” 2 · “sống chánh niệm” 3 · dịch ý khác 4 (`sn1.21`, `sn2.16`, các bài đó dịch cả bài kệ theo ý bài). Hai phạm vi cho hai đa số khác nhau: giữ theo phạm vi gần nhất (`iti15`, `iti105`) để cùng một khuôn kệ không có hai cách dịch trong cùng bộ Itivuttaka, và ghi rõ đây là cách rút gọn `paribbaje` (nghĩa đen “du hành, sống đời không nhà”) thành “sống”, không phải đa số của tầng.
  - Các khoá còn lại có Pāli trùng với khoá chưa dịch (ví dụ `ja547:*`, `ja529:54.3`) nên không có tiền lệ để dùng lại.

  **Trùng nguyên văn trong chính bài:** 99 khoá, 7 nhóm Pāli trùng (sau khi nén khoảng trắng, hạ chữ hoa, bỏ dấu câu), 31 cặp; bản Việt của cả 31 cặp giống hệt nhau (0 lệch, ngoài dấu câu cuối khoá theo từng khoá Pāli). Các nhóm: `3.2` = `10.4`; `3.4` = `6.2` = `8.4` = `11.4` = `14.2` (“bālā mohena pārutā”); `4.4` = `6.4` = `8.6` = `11.6` (“mayaṁ chindāma vāṇijā”); `5.1` = `7.1` = `9.1` = `12.1` (“Sā ca chinnāva pagghari”); `5.4` = `8.2` = `11.2` = `13.4` (“yāvaticchiṁsu vāṇijā”); `15.3` = `16.5`; `15.4` = `16.6`.

  **Số Pāli, đã tính:**
  - `paṇṇavīsati` (10.2, 19.2): pañca 5 + vīsati 20 = **25**, cùng cấu tạo với `Paṇṇavīsatito kappe` ở `tha-ap62:14.1` (đã dịch “hai mươi lăm kiếp”). ⇒ “hai mươi lăm người nữ”, “hai mươi lăm con (voi)”.
  - `tisatā` (19.3): ti 3 × sata 100 = **300** (cf. `snp3.7:31.1` `Brāhmaṇā tisatā ime` = “Ba trăm bà-la-môn”). ⇒ “ba trăm cung thủ”.
  - `chasahassā` (19.4): cha 6 × sahassa 1000 = **6.000** (cf. `ja264:2.4` `cha sahassāni` = “sáu nghìn”). ⇒ “sáu ngàn người mặc giáp”.
  - `eka` ở `1.4` (`ekaṁ … gāmaṇiṁ`) = “một” (một người đứng đầu); `ekā` ở `10.1` không phải số đếm độc lập mà đọc là “mỗi một” (xem bất định 5). Số thứ tự `dutiyaṁ`/`tatiyaṁ`/`catutthaṁ`/`pañcamaṁ` (6.1, 8.3, 11.3, 14.1) = lần thứ hai/ba/tư/năm. Kiểm tra đối chiếu với năm lần chặt: lần đầu ở 3.3 (`samacintesuṁ`, không đánh số) ⇒ cành đông (4.3); 6.1 “lần thứ hai” ⇒ cành nam (6.3); 8.3 “lần thứ ba” ⇒ cành tây (8.5); 11.3 “lần thứ tư” ⇒ cành bắc (11.5); 14.1 “lần thứ năm” ⇒ gốc (14.3). Khớp 5/5, đúng cấu trúc “năm lần” của kệ.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên script):**
  - `satthavāha` (15.1, 20.3) → “người dẫn đoàn lữ hành”: đo trên 9 khoá chứa `satthavāh…`; ba khoá `tha-ap33:4.2`, `tha-ap34:5.1`, `tha-ap37:18.3` dùng “dẫn đoàn lữ hành”, `mil5.4.7:18.1` “đầu đoàn xe buôn”. `gāmaṇi` (1.4) → “người đứng đầu”: chỉ chức vị chung (khác `ja8:0.4` “Kinh Gāmaṇī” là tên riêng); Pāli dùng hai từ khác nhau (`gāmaṇi` và `satthavāha`) cho cùng một người, bản Việt giữ hai danh xưng khác nhau đúng như Pāli, không tự đồng nhất.
  - `nigrodha` (2.3) → “cây đa”: đo trên 25 khoá chứa `nigrodh…`; “cây đa” 4 (ví dụ `ud1.4:1.2`, `snp2.5:7.2`), “nigrodha” 16 (phần lớn là tên riêng như `ja12`); ở đây là danh từ chung chỉ cây nên chọn “cây đa”.
  - `kantāra` (2.1) → “vùng hoang mạc”: đo lại 2026-10-13 trên khoá chứa `kantār…` (bỏ `diṭṭhikantāra`): “hoang mạc” 30 · “hoang vắng” 17 · “hoang vu” 13 · “sa mạc” 5 · “đồng trống” 1; câu gần nhất `Kantāre appodake appabhakkhe` ở `pv37:3.2`, `vv84:3.2` dịch “hoang mạc ít nước, ít thức ăn”. Số đếm cũ ghi chỉ 3 khoá là sai.
  - `sītacchāya manorama` (2.4) → “có bóng mát dịu, dễ chịu”: `ja430:8.4` “bóng mát dịu dàng, thật là dễ chịu”, `pv47:3.2` “bóng mát dễ chịu”, `ja316:3.2` “bóng râm thanh mát thật vừa ý”; chọn “dễ chịu” theo đa số.
  - `ādīnava` (22.1) → “nguy hiểm”: đo 29 khoá chứa `ādīnav…`: “nguy hại” 15 · “hiểm họa” 6 · “nguy hiểm” 5 · “tai hại” 1; chọn “nguy hiểm” vì đúng cụm `Etamādīnavaṁ ñatvā` ở `iti15:4.1` (“Biết sự nguy hiểm ấy,”), bài có cùng hai khoá kết `22.3`–`22.4`.
  - `taṇhā dukkhassa sambhavaṁ` (22.2) → “biết tham ái là nguồn gốc của khổ;” theo `iti15:4.2` (“biết tham ái là nguồn gốc của khổ—”, Pāli `Taṇhaṁ dukkhassa sambhavaṁ`); ở đây Pāli ghim ghi `taṇhā` (chủ cách) nhưng cấu trúc với `Evamādīnavaṁ ñatvā` rõ là cùng tân ngữ của `ñatvā` như `iti15`, nên dịch theo đó.
  - `lobha` (21.3) → “tham”: 71 khoá chứa `lobh…` dùng “tham” rất nhiều (ví dụ `iti1:2.4`, `iti1:3.1`); không đổi.
  - `bālā mohena pārutā` (3.4, …) → “những kẻ ngu bị si mê che phủ”: `bāla` → “kẻ ngu” (`snp1.11:7.3`, `ud7.10:5.3`); `moha` → “si mê”.
  - `paricāretvā` (11.1) → “vui thú cùng”: `thag1.96:1.3` dịch “vui chơi” cùng động từ; `paricāra…` ở `ja444:8.4` là “hầu hạ” nhưng ở đó có `kāmā` đi kèm nghĩa khác; ở đây chủ ngữ là thương nhân hưởng thụ cùng nữ nhân, nên chọn “vui thú”.
  - `veḷuriya` → “ngọc lưu ly”, `kuṇḍala` → “hoa tai”: xem mục lệch có chủ ý (d), (c).
  - `appodavaṇṇa` (7.3): `appodaka` = “ít nước” theo `ud4.3:4.1`, `ud4.3:5.2`, `ud4.3:6.2` (“cháo sữa đặc ít nước”, 3/3 khoá); `-vaṇṇa` = sắc/dáng vẻ ⇒ “trông ít nước” (xem bất định 7).
  - `kummāsa` (7.3) giữ phiên âm “kummāsa”: đo lại 2026-10-13 trên khoá chứa `kummās…` ngoài dạng ghép `odanakummāsa`: “cháo” (thô, chua, bột) 19 (`mn81`, `mn82`, `mn129`, `mn12`, `ja547:714.2`, `vv14`, `vv71`, `vv80`, `mnd14`, `mnd16`, `ne37:149.1` “cháo kummāsa”) · “bánh” (mạch, tấm, ngọt) 10 (`ja415`, `tha-ap477`, `tha-ap561`, `vv42`, `mil6.3.3`) · phiên âm đứng riêng 1 (`tha-ap482:11.3`) · tên riêng/tiêu đề 5. Số đếm cũ ghi 7 khoá là thiếu. Hai nghĩa (cháo / bánh) đều có tiền lệ và `kummāsa` là từ hiếm có nghĩa tranh luận, nên giữ phiên âm, không chọn loại thay Pāli; đây là chỗ giữ bất định (xem bất định 6).
  - `Kāsika` (13.1) → “vải xứ Kāsi”: `ja297:3.3` dịch “vải mềm dệt bằng cỏ kāsa” cho `Kāsikañca muduṁ vatthaṁ` nhưng đó là cách đọc khác (kāsa = cỏ) và có `muduṁ`; ở đây `Kāsikāni vatthāni` đi cùng danh sách hàng quý (vàng, bạc, ngọc) nên đọc là hàng của xứ Kāsi.
  - `kambala` (13.2) → “chăn len”: tầng chỉ có 2 khoá `kambal…` chứa từ này (`snp3.11:11.2` “tấm vải vàng nhạt” cho `paṇḍukambale`, `mil3.8:2.3` “một tấm chăn”); chọn “chăn len” theo nghĩa Pāli (`kambala` là tấm len), gần như không có tiền lệ.
  - `kuṭhārī` (18.3) → “rìu”: tầng có 3 khoá (`snp3.10:9.2`, `ja475:1.1`, `ja483:22.1`); `snp3.10:9.2` và `ja475:1.1` dịch “rìu” (`ja483:22.1` là tên riêng).
  - `bhasmaṁ karoti` (20.4) → “biến thành tro”: `ja417:6.4` “làm ta thành tro”, cùng cấu trúc.
  - `nāga` (19.1) → “voi”: đo 91 khoá chứa `nāg…`, “voi” 56 · “nāga” 18 · “long”/“rồng” 13 · “rắn” 6 (xem bất định 3).
  - `sannaddha` (19.2) → “đã mặc giáp”: `ja333:1.4` “khoác áo giáp”; `vammin` (19.4) → “người mặc giáp” (0 khoá chứa `vammin` ở tầng).
  - `iṅgha` (4.3, 6.3, 8.5, 11.5, 14.3) → “nào”: `iṅgha` ở tầng dùng nhiều trong lời giục (34 khoá), ví dụ `ud5.6:5.3` “hãy”, `ud7.9:2.3` “Này … hãy”; chọn “nào” cho lời hô nhắc nhau giữa nhóm.
  - Hướng của bốn cành (4.3, 6.3, 8.5, 11.5, 16.1–16.4): `purima`, `dakkhiṇa`, `pacchima`, `uttara` → “phía đông / nam / tây / bắc”. Chuỗi bốn hướng cùng thứ tự có tiền lệ ở `dn20:9.41–9.44` (xem bất định 10); ngoài ra đọc theo chức năng từng cành (đông: nước, nam: đồ ăn thức uống, tây: người nữ, bắc: mọi điều mong muốn) khớp với 5.2, 7.2–7.4, 9.2, 12.2–13.2 của chính bài.
  - `kuttiyo`, `paṭiyāni`, `uddiyāni`, `siṅgi`: không có trong `content/glossary/pali-vi.yaml` và không có trong tầng (0 khoá chứa các dạng này), giữ phiên âm (xem bất định 6).

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: 99/99 khoá khớp số lượng cả `“`, `”`, `‘`, `’`, `"` (0 lệch). Pāli có 2 cặp nháy kép: `20.1`/`20.4` (lời hạ lệnh của đội quân ra từ cây) và `21.1`/`22.4` (khổ kết, khép bằng `”ti`). Nháy đơn: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 (phép so “…pe…” và `(…)` chạy rỗng vì Pāli không có lược). Tính toàn vẹn NFC: 99/99 khoá NFC, 0 khoá rỗng, 0 khoảng trắng thừa; chữ số chỉ có ở `0.4` (“10.”).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. Người nói: đọc từ nội dung kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1–14: người kể; 15–16: người dẫn đoàn (15.1 `satthavāho yācamāno katañjalī` nêu rõ), 17: lời răn nói chung (không rõ người dẫn đoàn hay người kể; `17.1–17.4` không có dấu nháy trong Pāli, bản Việt để ngôi thứ ba); 18–19: người kể; 20: vị chỉ huy đội quân ra từ cây (không nêu tên trong kệ); 21–22: lời kết (dấu nháy mở ở 21.1, đóng ở 22.4; không rõ người nói, thường là Đức Thế Tôn kết bài kệ, nhưng không có trong tầng ghim nên không ghi).
  2. `Nāriyo samalaṅkatā` … `Sā ca chinnāva pagghari` (9.1–9.4): `pagghari` là “tuôn chảy” (nước ở 5.1–5.2); dùng cùng động từ “tuôn ra” cho cơm, thịt, người nữ, ngọc… theo Pāli, giữ một động từ cho mọi trường hợp.
  3. `nāgā … sannaddhā paṇṇavīsati` (19.1–19.2): dịch “voi” vì đi cùng cung thủ (19.3) và “người mặc giáp” (19.4) tạo thành đội quân, và `sannaddha` đi với voi chiến. Cách đọc khác: `nāga` là rồng/thần rắn (13 khoá “long/rồng” + 6 “rắn” trong 91 khoá `nāg…`), hoặc chỉ “bậc vĩ đại”. Cùng hướng nghĩa nhưng khác loài; không phân xử được từ tầng này.
  4. `Haneyyārisakaṁ manaṁ` (21.4): `ārisaka` hiếm; hiểu là “thuộc loại như thế” (cùng gốc `īdisaka`), nên “loại tâm ấy” (tâm bị tham chi phối ở 21.3). Cách đọc khác: `ari` “kẻ thù” + hậu tố ⇒ “tâm như kẻ thù”. Bản Việt dùng “loại tâm ấy”, đúng cho cách đọc đầu và không loại trừ cách đọc sau; tầng 0 khoá chứa `ārisak…`.
  5. `Api su vāṇijā ekā, nāriyo paṇṇavīsati` (10.1–10.2): `ekā` đọc là “mỗi một” (mỗi thương nhân có hai mươi lăm người nữ vây quanh). Cách đọc khác: “một thương nhân” (đối lập với số đông) với 25 người nữ chung cho cả đoàn. Cả hai cùng số 25 nhưng khác tổng số; chọn “mỗi một” vì `Te tāhi paricāretvā` (11.1) nói từng người “vui thú cùng những người nữ ấy”.
  6. `kuttiyo paṭiyāni` (12.4), `uddiyāni` (13.2), `siṅgi` (7.4): không xác định được nghĩa từ Pāli ghim và không có tiền lệ (0 khoá) nên giữ phiên âm, không gán loại. `kuttiyo`/`paṭiyāni`/`uddiyāni` có vẻ thuộc nhóm đồ trải, vải len cao cấp (cùng nhóm với `kambala` ở 13.2), nhưng đây chỉ là suy đoán về loại, không thêm vào thân kinh. Quét toàn Pāli root: `kuttiyo`, `paṭiyāni`, `uddiyāni`, `vidalasūpiyo`, `appodavaṇṇa`, `ārisaka` và `siṅgiṁ` ở dạng này đều chỉ có đúng một lần, ở bài này (hapax), nên không có ngữ liệu để phân xử. `siṅgi`: tầng có 17 khoá `siṅgī…` nghĩa vàng/màu vàng kim (`siṅgīsuvaṇṇa`, `siṅgīnikkha`, `siṅgīvaṇṇa`) và 2 khoá `siṅgīvera` nghĩa gừng (`mil3.4.1`, `tha-ap393:15.3`), không có khoá nào để `siṅgi` đứng riêng nghĩa món ăn; trong danh sách món ăn ở 7.3–7.4 giữ phiên âm, không gán loại. Số đếm cũ ghi 0 khoá chứa `siṅgi` là sai. `vidalasūpiyo` (7.4) đọc là “canh đậu chẻ” (`vidala` = chẻ/xẻ, `sūpa` = canh).
  7. `appodavaṇṇe kummāse` (7.3): xem mục thuật ngữ; `-vaṇṇa` cũng có thể là “màu” (món có màu của nước). Hai cách đọc cùng hướng nghĩa “món loãng/ít nước”, nhưng không chắc chắn.
  8. `Upakkamuṁ` (18.4): hiểu là “ra tay với … từ gốc” (bắt đầu chặt); cách đọc khác “tấn công”. Cùng hướng nghĩa.
  9. `Mā vo muñcittha jīvitaṁ` (20.2): `vo` có thể là “các ngươi” (“chớ để chúng thoát mạng khỏi tay các ngươi”) hoặc đại từ chỉ “chúng”; bản Việt chọn cách đầu, giữ cho cả hai cách đọc không đổi ý chính (không cho chúng sống). Cách đọc đầu có tiền lệ cùng công thức `mā vo muñcittha jīvataṁ`: `ja503:11.4`, `ja503:17.2` dịch “chớ để hắn thoát khỏi các ngươi khi còn sống” (2/2 khoá, `vo` đọc là “các ngươi”); `dn20:21.8` `mā vo muñcittha koci naṁ` dịch “đừng để một ai thoát”.
  10. `Purima` (4.3, 16.1): ĐÃ GIẢI QUYẾT ngày 2026-10-13. Chuỗi bốn hướng `Purimaṁ disaṁ … dakkhiṇena … Pacchimena … uttaraṁ disaṁ` ở `dn20:9.41–9.44` dịch “phương đông / nam / tây / bắc”, đúng thứ tự `purima`, `dakkhiṇa`, `pacchima`, `uttara` của bài này; nên “phía đông” là cách đọc có căn cứ, không còn là suy từ chức năng cành.

