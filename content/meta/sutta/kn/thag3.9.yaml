notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của harness gần như không kiểm gì ở bài này, nên tôi tự quét toàn bộ khoá từ đĩa.** Mọi vế kệ ngắn hơn 40 ký tự nên bộ lọc `substantivePaliMinChars: 40` trong `source/layers.yaml` không thấy segment nào; tôi đọc Pāli thật của từng khoá từ `.cache/upstream/suttacentral/` theo `sourcePath` trong catalog, đối chiếu tay với bản Việt, rồi quét máy: tập khoá Việt bằng đúng tập khoá Pāli (17/17, đúng exact ID, không orphan), mọi giá trị NFC và không rỗng, ngoặc kép cong cân trên cả bài, không có `(…)`, dấu lược khớp Pāli từng khoá.
  - |-
    **Không thể tuyên bố technical gate pass.** Đợt này bị cấm chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên tiêu chí 10 bị chặn ở 9.6: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, NFC, ngoặc kép cân cả bài và YAML sạch. Người biên tập phải chạy lại bốn lệnh trên trước khi đổi trạng thái.
  - |-
    **Hai khoá đầu tiên của khoảng 1 không phải là bản dịch, chúng là văn bản khác.** `1.1` và `1.2` nói về ánh sáng, vách đá, màu chàm, cỏ và đống củi — không một từ nào có trong Pāli. Tôi đã tra cả hai cụm trong toàn bộ corpus Pāli đã ghim: `Kālapabbaṅgasaṅkāso` chỉ có ở `thag3.9:1.1` và `thag15.1:11.1`; `kiso dhamanisanthato` chỉ có ở `thag3.9:1.2`, `thag15.1:11.2`, `pv19:1.2` và `ja516:6.2`. Ở cả bốn nơi đó, `pabbaṅga` là *chi/thành phần*, `kiso` là *gầy*, `dhamani` là *gân* và `nisanthato` là *rách rưỡi*. Tôi cũng đã thử lần theo dấu vết: cụm *vách đá* trong tầng Việt chỉ xuất hiện ở `thag1.13:1.4` và `thag1.113:1.4`, không liên quan. **Tôi không sửa, vì đợt này chỉ chấm điểm; cần người dịch viết lại `1.1` và `1.2` từ Pāli.**
  - |-
    **Phần còn lại của bài tốt, nên điểm không tệ hơn thế.** `1.3` `Mattaññū annapānamhi` giữ đúng *biết đủ phần thức ăn khất thực* (Sujato: *eating and drinking but little*). `1.4` `adīnamānaso naro` giữ đúng *tâm không chán nản*. `2.1–2.4` sạch: `Phuṭṭho ḍaṁsehi makasehi` → *bị ruồi muỗi hàm hạ*, `brahāvane` → *rừng hoang rậm u lớn*, `Nāgo saṅgāmasīseva` → *như voi giữa trận đánh*, `sato tatrādhivāsaye` → *chánh niệm mà cư trú nơi ấy*. `3.1–3.4` giữ đúng thang tương xứng *một như Phạm thiên / hai như chư thiên / ba như một làng / quá ba chỉ là đám đông*.
  - |-
    **Chỗ hơi lệch, đã ghi.** `2.3` `saṅgāmasīseva` nghĩa là *ở đầu hàng*, Sujato dịch *at the head of the battle*; bản Việt *giữa trận đánh* mất vị trí đầu hàng, làm mất ý đối lập với việc đứng cuối hàng ở tầng trên.
  - |-
    **Vì sao hạ `triangulation` xuống 7.0.** Bản Anh đã ghim ở `1.1–1.2` không hỏng — nó cho *knobbly knees, thin and veiny* — nên người dịch có đủ thông tin để bắt lỗi này mà vẫn không bắt. Đó không phải hạn chế của tầng tham khảo, đó là hạn chế của lượt đối chiếu; tôi hạ điểm tiêu chí này thay vì nâng điểm tiêu chí khác.
  - |-
    **Tầng Anh.** 12/13 khoá nội dung có prose Sujato, im lặng ở `3.5` dòng bảng hiệu. `englishCoverage` không đo được cho bài vì mọi vế kệ dưới 40 ký tự.
