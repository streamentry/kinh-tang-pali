notes: |-
  Đợt 19, làn 83. Dịch từ Pāli root commit đã ghim, đủ 118/118 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ chín của Buddhavaṃsa, về Đức Phật Anomadassī (vị thứ bảy theo `30.1`: `sattamo`, khớp thứ tự phẩm; bv28 xếp Anomadassī sau Sobhita): các đức tính và lời dạy, ba lần chứng ngộ và ba kỳ hội chúng, tiền thân là dạ-xoa chúa cúng dường thức ăn thức uống và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

    **Tiêu đề.**
    - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn của 11/11 khoá Pāli trùng (bv15–bv29, trừ phẩm chưa dịch).
    - `0.2` “9. Dòng Kế Thừa Của Đức Phật Anomadassī”, cùng khuôn với `bv18:0.2`, `bv19:0.2`.
    - `30.1` “Dòng kế thừa của Đức Thế Tôn Anomadassī là thứ bảy.” cùng khuôn `bv18:25.1`.

    **Số Pāli, đã tự tính.** `tayo` 3 (8.1 ba kỳ hội chúng; 18.4 ba lâu đài khớp ba tên ở 18.3: Sirī, Upasirī, Vaḍḍha). Ba lần chứng ngộ không có chữ `tayo` ở bài này; chúng là các số ở 5.3, 6.3, 7.3 với thứ tự “đầu tiên” (5.4), “thứ hai” (6.4), “thứ ba” (7.4). `koṭisatāni` ở 5.3: số nhiều “trăm koṭi”, không có con số cụ thể. `asītikoṭiyo` 80 koṭi (6.3). `aṭṭhasattatikoṭīnaṁ` 8 + 70 = **78 koṭi** (7.3; `aṭṭha` 8, `sattati` 70 là số đã xác lập). `aṭṭhasatasahassa` 8 × 100 × 1.000 = **800.000** (9.1), `sattasatasahassa` 7 × 100 × 1.000 = **700.000** (10.1), `chasatasahassa` 6 × 100 × 1.000 = **600.000** (11.1); ba số giảm dần 800.000 → 700.000 → 600.000 khớp thứ tự ba cuộc hội, và dạng “trăm ngàn” theo tiền lệ `bv19:7.1` (`satasahassa` “một trăm ngàn”). `dasavassasahassa` 10 × 1.000 = **10.000 năm** (18.1). `tevīsatisahassa` 3 + 20 = 23, × 1.000 = **23.000** (19.1; `tevīsati` = 23, tầng đã dịch `tevīsatikappe` “hai mươi ba kiếp”, `tha-ap238:3.1`). `caturo` 4 (20.1). `anūnadasamāsa` = không thiếu + 10 = **đủ mười tháng** (20.3). `aṭṭhapaṇṇāsaratana` 8 + 50 = **58 ratana** (25.1; `paṇṇāsa` 50). `vassasatasahassa` 100 × 1.000 = **100.000 năm** (26.1). `pañcavīsati` 5 + 20 = **25** (29.4, Pāli không nêu đơn vị). `dasapāramī` 10 ba-la-mật (16.4, giữ dạng “mười ba-la-mật”, 8/8 tiền lệ). `sattamo` thứ bảy (30.1). Không có cụm `Tiṁsakappasahassa` ở bài này; không có số kiếp ở `14.3` (chỉ nói `aparimeyyito kappe` “vô lượng kiếp”).

    **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã publish và draft (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 49 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 1.130 cặp, trong đó 50 cặp có Việt khác bản tôi viết; 42 khoá dùng đúng nguyên văn một tiền lệ (cộng `0.1`, tổng 43 kể cả `15.2`). Trong 50 cặp lệch, 21 là dạng `…` có thêm khoảng trắng ở `15.2` (853/874 giống `…` của tôi), 12 cặp chỉ khác dấu câu, chữ hoa hoặc dấu nháy theo Pāli từng khoá (`10.2` 5 cặp dùng dấu chấm, `1.1`, `5.1`, `11.2`, `12.1`, `16.2`, `23.3`, `25.4` mỗi khoá 1 cặp) và 17 cặp khác về chữ, liệt kê dưới đây:
    - `1.2` “có bậc Chánh Đẳng Giác, tối thắng giữa loài hai chân;” dùng đúng `bv24:1.2` (1/3); hai tiền lệ kia (`bv22:1.2`, `tha-ap11:2.2`) bỏ chữ “có” vì ở đó khoá kế có động từ riêng (`bv22:1.3` “đã có bậc Chiến Thắng …”). Ở bài này khoá `1.3` chỉ là tên, nên cần động từ ở `1.2`, như `bv24`.
    - `12.1` “Vào lúc ấy, ta,” là dạng đa số (7/11); 2 khoá dùng “tôi” là lời của tỳ-kheo-ni/trưởng lão (`thi-ap11`, `tha-ap341`), 1 khoá `bv18:8.1` thiếu dấu phẩy cuối.
    - `14.3` **cố ý khác** tiền lệ duy nhất (`bv28:1.1` “Vào vô lượng kiếp trước đây,”, 1 cặp). Ở bv28 người kể nhìn ngược về quá khứ; ở đây `14.3`–`14.4` là lời thọ ký tương lai (`bhavissati`), nên hướng đếm đảo ngược: “Sau vô lượng kiếp nữa,” (cùng cách với `bv15:12.3`, `bv16:11.3`, `bv17:10.3`, `bv18:10.3`, `bv19:13.3`: “Sau … kiếp nữa,”). Pāli ở `14.3` không có chữ chỉ hướng; hướng lấy từ động từ ở `14.4`.
    - `14.4` “vị này sẽ trở thành Đức Phật.” là dạng đa số (8/9); 1 khoá `tha-ap491:1.4` viết “vị này sẽ là Đức Phật.”.
    - `19.2` “người nữ được trang sức đẹp đẽ;” là dạng đa số (12/15); các tiền lệ lệch (`snp2.7:17.4`, `snp2.7:22.2`, `ja493:9.2`) là Pāli ngoài Buddhavaṃsa (cùng gốc `nāriyo`).
    - `20.4` “bậc Chiến Thắng đã nỗ lực tinh tấn.” là dạng đa số (4/5). Khoá lệch `tha-ap200:1.4` viết “nỗ lực chung thức cuối cùng” — chữ “chung thức” không có trong Pāli và có vẻ là lỗi; **lỗi ngoài lát, báo chứ không sửa.**
    - `21.2` “Anomadassī, bậc Đại Mâu-ni;” khác `tha-ap70:4.2` (“bậc Đại Muni vô tỳ nhiễm;”, 1 cặp): ở đó `anomadassī` bị dịch nghĩa “vô tỳ nhiễm”, ở đây là danh hiệu của Đức Phật được nêu tên ở `1.3`, `17.4`, `22.4`, `29.1`, nên giữ nguyên tên Pāli (tên Đức Phật được giữ ở `bv15:19.2`, `bv16:18.2`, `bv17:17.2`).
    - `25.4` “như mặt trời trăm tia sáng đã mọc.” (3 cặp: 2 viết “đã bốc lên như trăm tia nắng mặt trời”, 1 viết “như mặt trời trăm tia sáng đã mọc;”) cùng gốc `sataraṁsi` + `uggata`; chọn dạng khớp `tha-ap404:5.2`, `tha-ap187:1.1`, `tha-ap155:1.1` (“mặt trời trăm tia sáng mọc lên”, 3 khoá). Dạng “đã bốc lên” không có trong tiền lệ ngoài hai khoá `tha-ap523:7.2`, `tha-ap350:8.2`.
    - `26.4` “vị ấy đã đưa đông đảo mọi người vượt qua.” là dạng đa số (5/6; xem `bv28:2.4`, `bv20:23.4`, `bv22:25.4`, `bv24:24.4`); khoá lệch `tha-ap343:1.4` viết “cứu vớt đông đảo chúng sanh.”.
    - `16.2` “ta hoan hỷ, tâm xúc động;” là dạng đa số (4/5, `cp26:13.2`, `cp8:10.2`).
    - `18.1` “Mười ngàn năm,” là dạng đa số (2/4, `bv18:14.1`, `bv16:15.1`); hai khoá `ja461:13.1`, `ja489:1.3` thêm chữ “suốt”, mà Pāli `dasavassasahassāni` không có.
    - Trùng trong chính bài: 2 nhóm Pāli trùng (`8.3`/`11.3` và `17.4`/`22.4`, mỗi nhóm 2 khoá); bản Việt trong từng nhóm giống hệt nhau ⇒ 0 cặp lệch. `8.3`/`11.3` cùng “Của những bậc đã đạt đến sức mạnh của các thắng trí,”; `17.4`/`22.4` cùng “của bậc Đạo Sư Anomadassī.” (cùng nghĩa sở hữu: tên mẹ, tên thị giả).

    **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá, đếm số khoá).
    - `amitayasa` → “danh tiếng vô lượng” (4 khoá: `bv15:2.1`, `bv15:23.1`, `bv19:1.3`, `vv16:4.2`). `tejassī` → “đầy uy lực”: không có tiền lệ Việt cho dạng này; `bv15:3.1` dịch `atulatejo` “bậc có uy lực không thể cân lường”, nên dùng “uy lực”. `duratikkama` → “khó ai vượt qua”: tiền lệ `ud2.9:4.4` “khó vượt qua”, `mil5.2.6:1.7` “khó vượt qua”. `durāsada` → “khó tiếp cận” (`bv24:1.4`, `bv15:1.3`). `asaṅkhobbha` → “không thể bị khuấy động”: không có tiền lệ Việt cho dạng này (chỉ `bv4:36.2` Pāli chưa dịch); dịch sát nghĩa gốc `saṅkhobheti` (khuấy động, làm rung chuyển).
    - `sālarāja` → “cây sāla chúa” (3 khoá trong Buddhavaṃsa: `bv15:23.4`, `bv16:22.3`, `bv17:22.1`; ở `tha-ap` có cả “chúa cây sala”, nhưng bv thống nhất “cây sāla chúa”).
    - `bandhana` → “trói buộc” (`bv19:5.3`). `bhava` ở `2.2` `tayo bhave` → “ba cõi hiện hữu”: `bv24:2.1` dịch `sabbabhavaṁ` “toàn bộ hiện hữu”; “hữu” có `iti41:4.4`, `cnd4:3.2`, `iti44:6.4`; chưa có tiền lệ Việt cho đúng cụm `tayo bhave`. Chọn “ba cõi hiện hữu” (cõi + hiện hữu), xem bất định 2. `anivattigamana` → “đi mà không trở lui”: không có tiền lệ Việt; `anivatti` (không quay lại) + `gamana` (đi), dịch sát.
    - `tosita` → “được hài lòng” (`snp5.18:6.1`, `cnd3:6.1` “được … làm hài lòng”). `amata` → “bất tử” (`tha-ap30:6.4`, `bv16:2.3`). `pāpuṇanti` → “đạt đến”.
    - `abhisamaya` → “chứng ngộ” (nhất quán ở `bv15`–`bv20`, `bv22`, `bv24`, `bv27`: 1–5 khoá mỗi phẩm, và `bv24:5.3` “sự chứng ngộ Pháp của vị ấy,” cho `dhammābhisamayo`). `dhammavuṭṭhi` → “mưa Pháp” (`bv18:2.3` “đám mây Pháp”, `bv22:26.1` “tuôn mưa bằng đám mây Pháp”). `tappayante` ở `7.2` → “làm cho … được thỏa mãn”; `tappesiṁ` ở `13.3` → “làm cho no đủ” (cùng gốc `tappeti`, nhưng `bv22:9.4` dịch `tappesiṁ` “làm cho no đủ bằng thức ăn thức uống”, còn ở `7.2` đối tượng là chúng sinh nghe Pháp, nên tách “thỏa mãn”). `iddha`+`phīta` → “hưng thịnh, phồn vinh” (`tha-ap475:8.2`; các dạng khác: `cp21:3.4` “phồn vinh và thịnh vượng”, `bv27:9.2` “thành tựu, thịnh vượng”, `ud6.1:13.3` “thành tựu, phồn thịnh”; 1 trên 4 là đúng chữ).
    - `sannipāta` → “kỳ hội chúng” (`bv27:5.1`, `bv18:6.1`, `bv20:5.1`); `samāgama` → “cuộc tụ hội” (5 khoá ở `10.2`, 5 khoá ở `11.2`). `abhiññābala` → “sức mạnh của các thắng trí” (`bv18:8.4`). `pahīnamadamoha` → “đoạn trừ kiêu căng và si mê”: `mada` không có tiền lệ kỹ thuật (tầng dùng “say sưa” cho `issaramada`, `pv42:12.3`); `moha` → “si mê” (thông dụng). `anaṅgaṇa` → “không uế nhiễm” (`thag14.1:8.1` “không uế nhiễm”; khác: `ja392:5.1` “không có vết nhơ”, `ja134:1.4` “không tỳ vết”, `ja367:5.2` “vô nhiễm không tỳ vết”). `viraja` → “không bụi trần”. `upasanta` → “tịch tịnh” (5 khoá; “an tịnh” 10 nhưng đã dành cho `santacitta` ở `9.4`; “lắng dịu” 4, “tịch diệt” 2). `nibbuta` → “tịch diệt” (`thi-ap36:19.4`). `tapassī` → “khổ hạnh” (`pv18:14.2`, `ja496:8.2`).
    - `yakkha` → “dạ-xoa” (chữ thường 82 chỗ, “Dạ-xoa” viết hoa 188 chỗ, trong đó 135 chỗ ở giữa câu: hai dạng cùng tồn tại; chọn chữ thường vì là danh từ chung, như `ja497:16.1`, `snp2.7:28.2`, `tha-ap33:5.2`). `mahiddhika` → “có đại thần lực” (`thi-ap1:5.1`). `vasavattī` + `issara` → “chúa tể có quyền chi phối” (xem bất định 5).
    - `byākāsi` → “thọ ký” (như `bv18`, `bv19`). `visuddhanayana` → “có đôi mắt thanh tịnh”: không có tiền lệ Việt (Pāli chỉ `thi-ap24:23.1` `visuddhanayanā homi`, chưa dịch).
    - `buddhavara` → “vị Phật cao quý”: không có tiền lệ Việt cho dạng này; `vara` (cao quý, ưu việt) dịch sát. `lokanāyaka` → “bậc Dẫn Đạo thế gian” (`bv24:3.2`, `bv22:12.2`). `mahesi` → “Đại Ẩn Sĩ”, `mahāmuni` → “Đại Mâu-ni”, `mahāvīra` → “Đại Anh Hùng”, `jina` → “bậc Chiến Thắng” (như `bv18`). `satthā` → “Đạo Sư” (`bv24:14.4`, `bv22`, 17.4 / 22.4 / 28.1 / 29.1). `pāvacana` → “lời dạy”, `jinasāsana` → “giáo pháp của bậc Chiến Thắng” (`thi-ap39:5.2`, `thi-ap39:8.2`, `thi-ap38:4.2`). `arahant` → “A-la-hán”. `vītarāga` → “ly tham”. `vimala` → “không cấu uế”.
    - `nagara` → “thành phố” (`bv22:15.1`, `bv24:13.1`). `khattiya` → “Sát-đế-lợi”. `mātā` → “người mẹ”: tiền lệ duy nhất cho đúng khuôn `mātā … nāma` là `tha-ap533:21.3` “mẹ tên là Candimā,” (chữ thường vì ở giữa câu); chọn “Người mẹ tên là” cho cùng khuôn với `bv16:14.3`, `bv22:15.3`, `bv24:14.3` (các khoá đó là “Người mẹ sinh ra tên là”, vì Pāli có `janikā`; ở đây Pāli chỉ có `mātā` nên bỏ chữ “sinh ra”). `atrajo` → “người con ruột” (`bv18:15.4`, `cp7:1.2`). `nimitta` → “dấu hiệu”, `sivikā` → “kiệu” (`bv18:16.2`, `pv11`), `anūnadasamāsa` → “đủ mười tháng” (`bv18:16.3`).
    - Tên riêng: `Anomadassī` (giữ dấu `ī` như `bv28:6.2`, `bv28:7.1`), `Sobhita` (`bv28:6.1`, `bv28:5.2`), `Candavatī`, `Yasavā`, `Yasodharā`, `Sirī`, `Upasirī`, `Vaḍḍha`, `Sirimā`, `Upavāṇa`, `Nisabha`, `Anoma`, `Varuṇa`, `Sundarī`, `Sumanā`, `Ajjuna`, `Nandivaḍḍha`, `Sirivaḍḍha`, `Uppalā`, `Padumā`, `Dhammārāma`, `Sudassana`: chưa có tiền lệ đủ trong tầng Việt (các tên này mới gặp lần đầu ở bài này), giữ dạng Pāli có dấu. `Sudassana` đã có ở tầng làm tên lâu đài (`bv17:14.3`) và tên Sakka (`bv15:4.1`), không phải tên vườn: xem bất định 7. `koṭi` giữ nguyên chữ Pāli (như `bv18`, `bv16`, `bv17`). `ratana` (đơn vị đo) giữ nguyên, như `bv20:22.1`, `bv18:21.1`.

    **Bất định (ghi ở đây, không thêm vào thân kinh).**
    1. `6.1`–`6.2` `Tato paraṁ abhisamaye, vassante dhammavuṭṭhiyo`: `abhisamaye` là định cách (locative) “ở lần chứng ngộ”, `vassante` là phân từ hiện tại (khi tuôn mưa), `dhammavuṭṭhiyo` là tân ngữ. Pāli không nêu chủ ngữ của `vassante`; tôi dịch “khi Ngài tuôn mưa Pháp”, dùng “Ngài” vì `vassante` đồng chủ ngữ với `tappayante` ở `7.2` (đều là Đức Phật, đồng nghĩa với “bậc Đạo Sư tuôn mưa Pháp” ở `bv18:2.3`). Cách đọc khác: “tato paraṁ” là “thêm vào đó” (phụ thêm vào lần thứ nhất). Không đủ chứng cứ để chọn khác.
    2. `2.2` `tayo bhave`: dịch “ba cõi hiện hữu”; cách đọc khác: “ba hữu” (kāmabhava, rūpabhava, arūpabhava, theo `pe6:9.13`) hoặc “ba cõi”. Pāli chỉ nói “ba hữu”, không nêu tên cõi; “cõi” có ở tiền lệ “ba cõi” nhưng thêm nghĩa nơi chốn. `2.3` `anivattigamanaṁ maggaṁ` dịch “con đường đi mà không trở lui”: cách đọc khác “con đường dẫn đến nơi không trở lại” (hiểu `gamana` là nơi đến); Pāli không nêu “nơi”, nên dịch sát “đi”. `2.4` `desesi`: “chỉ bày” (như `bv28:20.3` “chỉ ra con đường”).
    3. `4.1`–`4.4` `Dassanenapi … tositā honti`: `api` gắn với `dassanena` (“chỉ riêng việc thấy”); tôi dịch “Ngay cả nhờ được thấy”. `tositā honti` dùng thì hiện tại của Pāli (`honti`) nhưng bản Việt không đánh dấu thì (như tầng thường làm với kệ mô tả). `byāharantaṁ` ở `4.3` có lẽ đi với `buddhaṁ` ở `4.1` (đối cách cùng giống đực), không đi với `giraṁ` (giống cái); dịch “lời Ngài đang nói”.
    4. `5.2` `Iddho phīto tadā ahu`: chủ ngữ là `abhisamayo` (`5.1`); `iddha`, `phīta` là tính từ (hưng thịnh, phồn vinh) đứng cùng. Cách đọc khác: `iddho phīto` mô tả tình hình giáo pháp, không riêng sự chứng ngộ.
    5. `12.3`–`12.4` `Nekānaṁ yakkhakoṭīnaṁ, vasavattimhi issaro`: `vasavatti` ở định cách (“trong sự chi phối”), `issaro` chúa tể. Tôi dịch “chúa tể có quyền chi phối”; cách đọc khác: “làm chủ trong sự tự tại / quyền lực” hoặc `vasavattī` là tên một cõi (Tha Hóa Tự Tại, `paranimmitavasavattī`), “chúa tể ở cõi tự tại”. Pāli không nêu tên cõi, không đủ chứng cứ độc lập.
    6. `13.1`–`13.2` `Tadāpi taṁ buddhavaraṁ, upagantvā mahesinaṁ`: `tadāpi` có thể là “khi ấy cũng” (lặp lại việc cúng dường ở các kỳ hội) hoặc “ngay lúc ấy”; tôi dịch “Khi ấy cũng vậy”. Chủ ngữ “ta” (ở `13.3` `tappesiṁ`, ngôi thứ nhất) trải sang `13.1`–`13.2`; tôi không thêm “ta” ở `13.1`–`13.2`, chỉ ở `13.3`. `13.1` và `13.2` là hai đối cách của cùng một người (Đức Phật), không phải hai người.
    7. `21.4` `uyyāne so sudassane`: `sudassana` là tên vườn “Sudassana” (theo truyền thống) hay tính từ “đẹp mắt”, “dễ nhìn” (như `thi-ap33:11.2` `sudassanā` “dễ nhìn”). Tôi dịch là tên “vườn Sudassana”; cách đọc khác: “ở khu vườn đẹp mắt”. Cùng chữ ở `bv13:22.4` (`sudassanuyyānamuttame`), chưa dịch. `so` ở `21.4` là đại từ “Ngài” (nhấn mạnh).
    8. `27.1`–`27.4`: `supupphitaṁ pāvacanaṁ` “lời dạy nở hoa rực rỡ” là phần chủ ngữ; `sobhittha jinasāsanaṁ` là câu kết, nhưng Pāli không có từ nối rõ ràng; tôi dịch thành hai vế (nhờ các bậc A-la-hán …, giáo pháp … đã chói sáng) nhưng không thêm quan hệ nhân quả ngoài `-ehi` (cách công cụ). Cách đọc khác: chủ ngữ của `sobhittha` là `pāvacana`. `pāvacana` (lời dạy) và `jinasāsana` (giáo pháp của bậc Chiến Thắng) dịch hai chữ khác nhau.
    9. `28.2` `Yugāni tāni atuliyāni`: `yuga` ở đây có thể là “cặp” (như `bv15:26.2` dịch “những cặp ấy cũng không thể cân lường”, 1 tiền lệ, và `kp6:6.2` “bốn đôi”) hoặc “thời đại”; Pāli không nêu cặp gì (đệ tử thượng thủ, cặp đệ tử, cặp tướng…). Giữ nguyên “những cặp ấy”, không giải thích; cách đọc khác: “những thời ấy”.
    10. `29.4` `Ubbedho pañcavīsatī`: Pāli không nêu đơn vị (do-tuần?). Tôi viết “chiều cao là hai mươi lăm”, không thêm “do-tuần”; các bv khác có đơn vị rõ (vd `bv17:25.4` “ba do-tuần”). Nếu cần, đơn vị phải lấy từ chú giải, không phải lời kinh.
    11. `25.3` `Pabhā niddhāvatī tassa`: `niddhāvati` “tỏa ra” (như `tha-ap523:7.1`). `25.4` `sataraṁsīva uggato` đọc là “như mặt trời trăm tia sáng đã mọc”: `sataraṁsi` (trăm tia) ngầm chỉ mặt trời, `uggato` đã mọc. Cách đọc khác: “như vầng hào quang trăm tia”.
    12. `9.2` `sannipāto tadā ahu`: `sannipāta` dịch “kỳ hội chúng”, `samāgama` ở `10.2`, `11.2` dịch “cuộc tụ hội” (tách hai chữ Pāli như `bv18`). Ba cuộc hội ở `9.x`–`11.x` đếm là “thứ hai”, “thứ ba” ở `10.2`, `11.2`, còn `9.2` Pāli không nêu “thứ nhất”; không thêm.
    13. `14.2` `visuddhanayano muni`: `nayana` là “mắt” (như `visuddhanayanā`) — cách đọc khác `naya` “lối, phương pháp” (nên nghĩa “bậc Mâu-ni có lối đi thanh tịnh”). Chọn “đôi mắt” vì Pāli ghi `nayana`.
    14. `23.4` `ajjunoti pavuccati`: `ajjuna` là tên cây (cây arjuna); giữ chữ Pāli, không dịch “cây arjuna” vì cây chưa có tên Việt chuẩn trong tầng.

