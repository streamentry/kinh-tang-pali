notes:
  - >-
    **Bốn bài Trưởng Lão (thơ) + uddāna của `thag1.10`.** Số vế **không giống
    nhau**: `thag1.10` có 4 vế, `thag1.4`/`1.14` có 6, `thag2.1`/`2.2` có 8 chia
    **4 + 4** vào hai mục. Một khuôn chung sẽ sinh khoá ma.
  - >-
    **Tên riêng giữ nguyên dạng Pāli** — Subhūti, Koṭṭhika, Kaṅkhārevata, Dabba
    (con nhà Mantāṇi), Sītavaniya, Bhalliya, Vīra, Pilindavaccha, Puṇṇamāsa,
    Vanavaccha, Uttara, Piṇḍolabhāradvāja: danh xưng tôn thánh, không bịa tên
    Việt.
  - >-
    `thag1.14` **không có lời bạt `Itthaṁ sudaṁ`**; `1.7` là ghi chú của người
    biên tập nêu tên thật của tập sự — dịch nguyên văn.
  - >-
    Thuật ngữ 0 tiền lệ, đặt mới: `apekkhaṁ` → *tự do* · `anūpalitto` → *không
    nhiễm ô* · `udayabbayañcā` → *cả khi sinh cả khi diệt* theo `an4.12:7.4`
    (*sự sanh diệt*) · `atthadassibhi` → *bậc thấy được ý nghĩa* · `nipūṇa` →
    *tinh tế* · `salla` → *bụi mịn* · `nāhāro` → *không phải món quà* ·
    `Āhāraṭṭhitiko` → *khối thức ăn là nền tảng* · `semānakopi` → *đi cả đến
    nghĩa địa*.
  - >-
    **Không đối chiếu được tầng Việt hiện hành.** Bilara tại commit đã ghim chỉ
    có Pháp Cú cho tiếng Việt, nên Tăng Bộ và Trưởng Lão không có bản Hòa thượng
    Thích Minh Châu để đối chiếu thuật ngữ. Giới hạn của bản chụp upstream, đã
    ghi ở `content/meta/reference-gaps.yaml`.
  - >-
    Sửa hình thức 2026-10-16: tiêu đề `:0.3`/`:0.4` đảo chỗ nên đổi lại cho khớp
    Pāli (vagga ở `:0.3`, tên trưởng lão ở `:0.4`); `:0.1` thêm số bài.
