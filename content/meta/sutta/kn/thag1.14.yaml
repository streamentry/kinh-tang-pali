  blocking_errors:
    - "thag1.14:1.5 — sai nghĩa trọng yếu: Pāli `Semānakopi gacchāmi` = «ngay cả
      khi nằm, tôi vẫn đi [đến rừng]» (semānaka: đang nằm). Bản Việt «con sẽ đi
      cả đến nghĩa địa» bịa ra «nghĩa địa», Pāli không có, và đổi sang thì tương
      lai. Sujato: «I go there even when lying down»."
    - "thag1.14:1.6 — sai nghĩa trọng yếu: Pāli `natthi saṅgo vijānataṁ` = «với
      người hiểu biết thì không có ràng buộc» (vijānataṁ: sở hữu cách số nhiều;
      saṅga: dính mắc). Bản Việt «biết rõ là không có sự chạy theo» đọc sai cú
      pháp thành động từ chính «biết rằng» và dịch saṅga thành «sự chạy theo»."
    - "thag1.14:1.2 — sai ngôi: Pāli `ito gacchāma sīvaka` là ngôi thứ nhất số
      nhiều («ta hãy đi khỏi đây, Sīvaka»). Bản Việt «con đi khỏi đây, Sivaka»
      thành mệnh lệnh cho ngôi thứ hai."
