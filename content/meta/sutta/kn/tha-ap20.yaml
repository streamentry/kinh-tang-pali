notes: |-
  Bài này. `tha-ap20` · phẩm `Sīhāsaniya` · thứ tám trong phẩm · Trưởng lão Raṭṭhapāla ·
  65 khoá Pāli (`:0.1`–`:0.3`, kệ `:1.1`–`:15.4`, câu kết `:16.1`, câu chốt `:17.1`). Bài này được
  vá một phần: khoá `:16.1` đã có sẵn từ trước và được giữ nguyên chữ, 64 khoá còn lại được dịch
  mới từ Pāli root đã ghim, nên tệp dịch hiện đủ 65/65 khoá, thứ tự khoá đúng thứ tự Pāli.

  NỘI DUNG (đã đọc Pāli, không suy từ khuôn chung). Raṭṭhapāla kể lại kiếp trước thời Đức
  Padumuttara (ở `:5.2` gọi bằng tôn hiệu `Jalajuttara`): dâng một con voi tuyệt hảo, định giá
  toàn bộ rồi dùng giá ấy xây một tịnh xá cho Tăng đoàn (`:1`–`:2`), cho xây năm mươi tư ngàn
  cung điện và làm đại thí (`:3`). Đức Phật tùy hỷ, giảng về cảnh giới bất tử và thọ ký ở
  `:6`–`:12` (nằm trong nháy đơn): quả báo cõi trời, làm Chuyển Luân Vương, sinh vào dòng giàu
  có thời Đức Gotama, xuất gia với tên Raṭṭhapāla và đạt vô lậu. `:13`–`:15` là lời nhận của
  chính ngài: bỏ của cải như bỏ cục nước bọt, mang thân cuối cùng, đã đủ bốn vô ngại giải,
  tám giải thoát, sáu thắng trí.

  SỐ PĀLI, TỰ TÍNH. `Catupaññāsasahassāni` (`:3.1`, `:6.1`) = catu 4 + paññāsa 50 = 54, nhân
  sahassa 1.000 = 54.000 → năm mươi tư ngàn. `Aṭṭhārasasahassāni` (`:7.1`) = 18 × 1.000 =
  18.000 → mười tám ngàn. `Paññāsakkhattuṁ` (`:8.1`) = 50 lần. `Aṭṭhapaññāsakkhattuñca` (`:8.3`) =
  aṭṭha 8 + paññāsa 50 = 58 lần → năm mươi tám lần. `Kappasatasahassamhi` (`:9.1`) = sata 100 ×
  sahassa 1.000 = 100.000 kiếp → một trăm ngàn. `catasso` 4, `aṭṭhime` 8, `chaḷabhiññā` 6.
  Lưu ý: ghi chú cũ của tệp này từng viết bốn mươi lăm; số đúng là 54 vì `catu` (4) cộng
  `paññāsa` (50), không phải 45.

  TIÊU ĐỀ `:0.3`. Pāli `Raṭṭhapālattheraapadāna` không bắt đầu bằng số nên `:0.3` không có số
  thứ tự; `translationTitle` trong tệp metadata này BẰNG ĐÚNG giá trị `:0.3`. Khuôn
  `Bài Kệ Tuyên … Về Trưởng Lão <tên>`: đo toàn tầng `tha-ap` (tệp khác, có `:0.3`) cho
  `Tuyên Ngợ` 234, `Tuyên Ngôn` 100, `Tuyên Ngợi` 10, `Ký Sự` 96, `Kinh Kệ` 5; trong chính phẩm
  Sīhāsaniya (5 bài khác) `Tuyên Ngợ` 3 (tha-ap17, 19, 21), `Tuyên Ngôn` 2 (tha-ap13, 15).
  Hai phạm vi đều nghiêng về `Tuyên Ngợ`, nhưng `Ngợ` là dạng sai chính tả (cả `Ngợi` cũng vậy).
  Tôi chọn `Tuyên Ngôn` là dạng đúng chính tả và KHÔNG tự quyết thay người biên tập: cần một
  lượt phán chung cho cả cuốn. Câu chốt `:17.1` theo đúng khuôn của tha-ap15:
  `…, thứ tám.` (Pāli có `aṭṭhamaṁ`).

  TIỀN LỆ, ĐO ĐƯỢC. Trong tầng Việt dự án, 32/65 khoá của bài này có Pāli trùng nguyên văn
  với khoá ở nơi khác, tổng 1.583 cặp Pāli trùng (phần lớn là hai khoá khuôn: `:0.1` `Therāpadāna`
  444 cặp và `:15.1`/`:15.4` 454 cặp). 21 khoá dùng lại nguyên văn một bản đã có
  (`:0.1` `:0.2` `:1.1` `:1.2` `:4.1` `:5.4` `:9.2` `:9.3` `:9.4` `:10.1` `:10.2` `:11.2` `:12.2` `:12.3` `:12.4` `:14.3`
  `:14.4` `:15.1`–`:15.4`). 11 khoá có Pāli trùng nhưng bản Việt của tôi khác mọi tiền lệ, mỗi
  chỗ đều có lý do: `:4.2` `aggapuggalo` (5 cặp cũ viết `tối thắng giữa loài hai chân`, nhưng
  `hai chân` là `dvipada`, không phải `puggala`; tôi viết `bậc tối thượng giữa loài người`);
  `:4.4` và `:8.2`/`:8.4` (diễn đạt ngôi và thì khác nhau); `:5.1`–`:5.3` (3 cặp cũ viết
  `Vị ấy đã giảng giải cho tôi, được gọi là bậc Tối Thượng Tựa Hồng Sen`, bỏ mất `buddho` và
  biến `jalajuttaranāmako` thành lời chú; tôi giữ `Đức Phật` làm chủ ngữ và giữ `Jalajuttara`
  như một danh hiệu); `:8.1`; `:9.1` (xem bất định); `:14.1`–`:14.2` (1 cặp ở snp1.4:8.1–8.2
  là lời Đức Thế Tôn nên viết `của ta` và `Chở ta`; ở đây người nói là Raṭṭhapāla nên đổi
  `ta`→`tôi` ở `:14.1`, và bỏ `ta` thừa ở `:14.2` vì Pāli không có). Pāli trùng ngay
  TRONG chính bài: 1 nhóm (`:10.2` = `:11.2`, `sukkamūlena codito;`) và bản Việt hai khoá
  giống nhau; không có nhóm trùng nào mà Việt khác.
  `hessati satthu sāvako` (`:11.4`): 2 cặp cũ dùng `môn đồ`, nhưng toàn tầng dịch
  `sāvaka` là `đệ tử` 40 lần so với `môn đồ` 7 lần, nên tôi viết `sẽ làm đệ tử của bậc Thầy`.
  Câu kết `:16.1` giữ dạng `đã nói những bài kệ này` (số nhiều, 407 khoá) chứ không dùng nhóm
  21 khoá `đã từng nói bài kệ này` (số ít) vì `imā gāthāyo` là số nhiều.

  THUẬT NGỮ. `dhuradhorayha` → `con vật kéo xe` theo snp1.4:8.1 (1 tiền lệ). `sammāsambuddha-
  sāsane` → `trong giáo pháp của Đức Chánh Đẳng Giác` (11/13). `Dhāremi antimaṁ dehaṁ` → `Tôi đang
  mang thân xác cuối cùng này` (5/16, dạng nhiều nhất). `nirūpadhi` → `không còn sanh y`
  (14/15 khoá có từ này). `sukkamūlena codito` → `được khích lệ bởi cội nguồn thiện căn`
  (7 trong 13 khoá, cùng Pāli). `kūṭāgāra` → `lầu gác` (11 khoá `Kūṭāgārā sattasatā`).
  `byamha` → `cung điện` (tầng không thống nhất: 2/8 khoá dùng `cung điện`, còn lại `thiên cung`
  hay diễn đạt khác). `mahesi` → `Đại Ẩn Sĩ` (66/86 khoá). `pāsāda` → `cung điện` (tầng không
  thống nhất: lầu, lầu các, lâu đài, cung điện; tôi chọn `cung điện` để tách khỏi `kūṭāgāra` →
  `lầu gác` trong cùng bài).

  BẤT ĐỊNH, GHI RÕ VÀ KHÔNG ĐƯA VÀO THÂN KINH. (1) `Kappasatasahassamhi` (`:9.1`) là định
  cách chỉ thời gian trong câu tương lai (`bhavissati`): tôi hiểu là một trăm ngàn kiếp NỮA kể từ
  lúc nói và viết `Vào một trăm ngàn kiếp nữa`; hai tiền lệ cùng Pāli (tha-ap54:7.1, tha-ap61:8.1)
  viết `Trong số một trăm nghìn kỳ` và tha-ap19:7.1 viết `đại kiếp trước` (sai hướng
  thời gian, vì động từ ở tương lai). Số 100.000 chắc chắn; chỉ chiều thời gian là suy ra từ thì động
  từ. (2) `urūḷhavā` (`:1.4`): Sujato dịch cùng cụm ở mn61 là `able to draw a heavy load`, tầng Việt ở
  mn61/mn66 dịch `thân lớn`/`to khỏe`; tôi viết `thân hình to khỏe`. Ba nơi khác trong tầng
  (tha-ap213:1.4, vv20:9.2, vv43:8.2) dịch `bước đi uy nghi, thân hình cao lớn` và bỏ mất
  `īsādanto` (`ngà như cán cày`, theo ud4.5:8.2 và mn61/66); tôi giữ cả hai nghĩa. Cần người biên
  tập xác nhận nếu muốn thống nhất cho cả nhóm. (3) `mahoghadānaṁ` (`:3.3`) không có tiền lệ nào
  trong tầng; tách `mahā` + `ogha` (dòng lũ) + `dāna`, dịch `đại thí như dòng lũ lớn`. (4) `agghāpetvāna`
  (`:2.3`) là dạng sai khiến (cho định giá): tôi viết `cho định giá`, không thêm rằng đã bán
  hay đổi lấy tiền vì Pāli không nói. (5) `Jalajuttara` (`:5.2`) giữ nguyên làm danh hiệu của Đức
  Padumuttara; không chú nghĩa vào thân kinh. (6) `sakappano` (`:2.2`) dịch `có đủ yên cương`
  (`kappana` là đồ trang bị của voi), không có tiền lệ. (7) `tādino` (`:1.2`): 2 tiền lệ cùng Pāli
  viết `đấng Như Thật`, còn dạng chữ thường `lokajeṭṭhassa tādino;` (16 khoá) viết `bậc Vững Vàng` ở 8 khoá; tôi dùng lại bản có cùng Pāli và
  nguyên văn hai dòng mở đầu (4 cặp trùng ở `:1.1`, 2 cặp ở `:1.2`). Nếu người biên tập thống nhất
  `tādī` thì sửa chung cả nhóm.

  NHÁY. Pāli `“` 1, `”` 1, `‘` 1, `’` 1; mở ngoặc kép ở `:1.1`, nháy đơn mở `:6.1` và đóng `:12.4`,
  ngoặc kép đóng `:15.4`. Khớp Pāli từng khoá: 0/65 khoá lệch. Không có dấu lược `…` trong
  bài (Pāli 0, Việt 0), không có `(…)`. Dấu cuối dòng mỗi khoá khớp Pāli (`,` `;` `,` `.`).

  COVERAGE ENGLISH, ĐO THẬT. Mẫu số là Pāli có nội dung từ 40 ký tự trở lên, bỏ khối `:0`:
  chỉ 1 khoá (`:16.1`, 62 ký tự); mọi khoá kệ chỉ 18–26 ký tự nên cổng coverage gần như không đo
  được gì. Sujato phủ 0/1 (tầng này không có tệp nào cho tha-ap); `vietnamese-current` 0 (26 tệp, toàn Pháp
  Cú); `english-project` không có uid này. Bài đã có mục trong reference-gaps nhưng mục đó chỉ ghi nhận
  việc mất tầng và KHÔNG cứu được `published`. Vì cả ba tầng tham khảo vắng nên `triangulation`
  đặt 7,0 (không quá 8,0) và `status` giữ `draft` kèm blocker. Điểm cao không cứu được blocker.

  KIỂM TRA ĐÃ LÀM. Tập khoá Việt bằng tập khoá Pāli (65 = 65), thứ tự khoá đúng Pāli, NFC, không
  khoảng trắng thừa, không Pāli lọt vào thân (chỉ còn tên riêng Raṭṭhapāla, Okkāka và hai tên
  nhan đề), mọi số Pāli đã tính lại ở trên. Đã đọc đối chiếu cặp Pāli-Việt từng khoá.

  `technical_integrity` đặt 9,6 vì chưa chạy cổng kỹ thuật của kho. Bốn lệnh còn lại cần chạy
  trước khi chốt: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
