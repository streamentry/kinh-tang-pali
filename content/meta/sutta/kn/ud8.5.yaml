notes: |-
  Sửa lan 2026-10-14 (cơ học, toàn tầng): khoá ud8.5:22.1 — `etamatthaṁ viditvā` trước dịch “sau khi
  thắng tri ý nghĩa ấy” (không có căn cứ trong Pāli: `viditvā` là “sau khi biết”, còn “thắng tri” là
  `abhiññā`) → “sau khi biết rõ ý nghĩa ấy”; giữ nguyên phần còn lại của khoá. Theo cách dịch
  `viditvā` ở dn16, sn3.10 và các bài khác.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 7.3 (và 4.5, 5.4, 10.3, 12.4, 15.1 cùng công thức) —
  ‘“Lành thay, bạch Thế Tôn,” … vâng lời’ → ‘“Dạ vâng, bạch Thế Tôn,” … vâng lệnh’: `evaṁ bhante` là lời
  đáp ‘vâng’, không phải `sādhu` (‘lành thay’); dạng đa số 18/30 khoá trùng. Khoá 10.6, 12.3 — ‘Này
  Ānanda, hãy đi lấy nước cho Ta; này Ānanda, Ta khát, Ta sẽ uống’ → ‘Này Ānanda, hãy mang nước đến cho
  Ta; Ta khát, này Ānanda, Ta sẽ uống’ (hô ngữ đúng vị trí Pāli, `āhara` = ‘mang đến’; 3/5 khoá trùng);
  đồng nhất vị trí hô ngữ ở 10.2 và 14.4 (cùng cấu trúc `kilantosmi, ānanda …`).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 20.3 — «Này hiền giả Cunda, điều này Ta nghe…» →
  «…điều này tôi đã nghe…» (người nói là Ānanda theo lời Đức Phật dặn, không phải Đức Phật; Ānanda
  gọi Cunda là `āvuso`, nên «Ta» sai người nói); 19.3, 20.1, 20.2 — «ngươi» → «ông» (cùng một lời
  của Ānanda nói với Cunda, xưng hô ngang hàng «hiền giả»; «ngươi» chỉ đúng khi Đức Phật nói với
  Cunda) và gỡ dấu ‘ ở đầu 20.1 vì Pāli khoá đó không mở nháy; 3.2 — thêm nghĩa sai khiến của
  `paṭiyādāpetvā` («cho sửa soạn») và `ārocāpesi` («sai người báo giờ»). Giữ nguyên các khoá
  2.2–2.5, 3.1, 4.1–4.6, 5.1–5.5, 6.1, 11.4, 20.2 vì cách dịch hiện tại đúng Pāli và chỉ khác khoá
  trùng ở dn16 về văn phong (hai cách đều đúng).
