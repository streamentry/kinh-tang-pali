notes: |-
  Dịch trực tiếp từ Pāli root vì tầng tham khảo tiếng Anh (Sujato) không có tệp cho tha-ap395 tại commit đã ghim, và không có bản Việt hiện hành cho uid này. Chỉ Pāli làm chứng cứ; các điểm dưới đây là chỗ Pāli cho phép hơn một cách hiểu hoặc chưa có tiền lệ trong tầng.
  Tên bài `:0.3`: Pāli `Sabbakittikattheraapadāna` không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli bắt đầu bằng số); `translationTitle` bằng đúng giá trị `:0.3`. Mở đầu tên: đo toàn tầng tha-ap thấy Bài Kệ Tuyên Ngợ/Ngợi 251 (241 + 10), Bài Kệ Tuyên Ngôn 132, Ký Sự 111 (Tuyên Ngợ là lỗi chính tả); ở phạm vi gần (tha-ap380–410) Ký Sự 9, Tuyên Ngợ/Ngợi 7, Tuyên Ngôn 0. Hai phạm vi cho đa số khác nhau; chọn Ký Sự vì đây là cách dịch đúng của apadāna, không mang lỗi chính tả, và các bài liền kề (tha-ap389, tha-ap390, tha-ap396, tha-ap400) dùng đúng dạng này. Cần biên tập phán một lượt cho cả cuốn. Tên phẩm `Phẩm Pilindavaccha` theo tiền lệ đã có (2 khoá Pāli `Pilindavacchavagga`, cả hai dịch thế). Tên riêng Sabbakittika giữ dạng Pāli, như các bài liền kề tha-ap396 (Madhudāyaka) và tha-ap400 (Saḷalamaṇḍapiya); một số bài khác dịch nghĩa tên (tha-ap389, tha-ap390), chưa đo tỉ lệ toàn tầng.
  Số đếm tự tính: `saṭṭhi` = 60 và `sahassa` = 1000, nên `Saṭṭhi kappasahassāni` = 60 × 1000 = sáu mươi ngàn kiếp (19.1); `sata` = 100 và `sahassa` = 1000, nên `Satasahassito kappe` = một trăm ngàn kiếp trước (26.1); `dasagāthāhi` = mười bài kệ, khớp đúng mười đoạn kệ 6–15 của lời tán thán; `catasso` = bốn (29.1); `tatiyaṁ` = thứ ba (31.1); `tevijjo` = ba minh, `tibhavantago` = đến tận cùng ba cõi hữu (14.2). Bài này không có cụm `tiṁsa`. Chữ số viết `ngàn` ở cả hai chỗ để nhất quán trong bài (tầng tha-ap: một trăm ngàn 75 khoá so với một trăm nghìn 9 khoá; riêng cụm `Saṭṭhi kappasahassa-` các tiền lệ trùng nguyên văn là sáu mươi nghìn, 5 khoá so với 0, nên đây là chọn có chủ ý vì nhất quán nội bộ). `kappa` ở 26.1 dịch đại kiếp theo công thức `Satasahassito kappe` (tầng 26 khoá đại kiếp so với 16 khoá không có chữ đại; phạm vi gần 3 so với 1), còn 19.1 là kiếp; hai chỗ khác nhau về chữ đại vì theo hai nhóm tiền lệ khác nhau.
  Bất định: (1) 4.4 `pādamūle` dịch dưới chân Ngài; chữ Ngài suy từ ngữ cảnh (đoạn 1–3 nói về Đức Phật), Pāli không nêu chủ sở hữu. (2) 5.1 `kāḷānusāriya` dịch cam tùng, theo tiền lệ tầng (3 khoá, đều là một loại rễ thơm); tên chính xác của vị hương này chưa được kiểm chứng ngoài tiền lệ. (3) 6.3–6.4 `ñāṇālokena jotesi, nāvaṭaṁ ñāṇamuttamaṁ` hiểu `nāvaṭa` là không bị che chướng (na + āvaṭa) và `ñāṇamuttamaṁ` đồng vị với ánh sáng trí tuệ; cũng có thể hiểu là hai tân ngữ tách rời. (4) 12.2–12.4 `mettākaruṇasañcayo` dịch nơi tích tụ của từ và bi; `susamo` dịch rất quân bình; `jitañjayo` dịch bậc đã chiến thắng điều cần chiến thắng; cả ba chưa có tiền lệ trong tầng (`jitañjayo` chỉ xuất hiện một lần trong toàn bộ Pāli đã ghim), nên đây là cách hiểu bám cấu tạo từ, không phải nghĩa đã được kiểm chứng. (5) 13.3 `vantadoso` dịch đã nhổ bỏ lỗi lầm theo tiền lệ duy nhất của tầng; `dosa` ở đây cũng có thể là sân hận, Pāli không phân xử. (6) 14.4 `hitavabbhuto` hiểu là hitavā + abbhuto (bậc đem lại lợi ích, bậc kỳ diệu) vì chữ ā rút ngắn trước phụ âm kép; cách hiểu khác hitavā + bhūto (đã trở thành bậc đem lại lợi ích) có khả năng nhưng kém hợp sandhi hơn; không có tiền lệ. (7) 15.2 `nidhīvassāsakārako` tách thành nidhi + iva + assāsakāraka (như kho báu, đem lại niềm an ủi); 15.4 `dappito` dịch hùng dũng theo nghĩa tích cực trong bài tán thán, nghĩa gốc là kiêu hãnh. (8) 8.4 `sabbadiṭṭhī` dịch mọi quan điểm, không thêm chữ tà vì Pāli không có tính từ ấy; không có tiền lệ. (9) 23.1–23.2 `sīlaṁ paññañca dhammañca` hiểu là tân ngữ của `thavitvā` cùng với `lokanāyakaṁ`, dịch bằng chữ về để giữ đúng ranh giới khoá. (10) 24.1–24.4 `aho nūna … tiṭṭheyya`, `vijāneyyuṁ`, `phuseyyuṁ` là cách thức mong ước, dịch mong sao; chủ ngữ của hai động từ sau không nêu trong Pāli nên dịch họ, và `aññātañca` hiểu là điều chưa được biết; không có tiền lệ trùng cho đoạn kệ này. (11) 21.4 `nibbāyissatināsavo` (nibbāyissati + anāsavo, không có dấu `ti`) có hai dạng dịch trong tầng, sẽ nhập Niết-bàn, không còn lậu hoặc (7 khoá) và sẽ vô lậu mà đi vào Niết-bàn (7 khoá); chọn dạng đầu vì sát Pāli hơn và trùng với bài liền kề tha-ap396. (12) 2.4 `maddantaṁ` và 7.2 `maddase` cùng một gốc, dịch nhiếp phục theo tiền lệ; `paratitthiye` dịch các ngoại đạo khác. (13) 19.4 `issaraṁ kārayissati` dịch sẽ làm chúa tể theo tiền lệ `issaraṁ yodha kāraye` (làm chúa tể). (14) Lời thọ ký tương lai (19–21, các động từ `-issati`) dịch ở thì tương lai. Bài không có cụm thọ ký định vị thời điểm (dạng `… kappe … bhavissati`); 19.1 `Saṭṭhi kappasahassāni` là đối cách chỉ thời lượng, nên dịch Sáu mươi ngàn kiếp, người ấy sẽ vui chơi ở cõi trời, không dùng cách nói sau … kiếp nữa.
  Đại từ: người kể là vị trưởng lão nói tôi; ở 6–15 lời tán thán gọi Đức Phật là Ngài; lời Đức Phật ở 18–21 dùng Ta; 22.3 người kể quay lại gọi Ngài. Nháy: ngoặc kép mở ở 1.1 và đóng ở 29.3; nháy đơn mở ở 6.1 và đóng ở 15.4, rồi mở ở 18.1 và đóng ở 21.4; đã kiểm 119/119 khoá khớp Pāli từng khoá.
  Công thức kết `Itthaṁ sudaṁ … abhāsitthāti` dịch theo nhóm đa số (những bài kệ này), đo ở khoá áp chót các tệp tha-ap: 403 khoá so với 1 khoá dùng bài kệ này. Hai khoá lược `…pe…` (28.2, 29.2) giữ đúng một `…`; Pāli không có `(…)` ở khoá nào.
  Đã dò tiền lệ trong 511 tệp tha-ap: 40 khoá có Pāli trùng nguyên văn với tầng, 39 khoá dùng lại nguyên văn một bản dịch đã có, 1 khoá khác (25.1, `của tôi` thay `của ta` theo ngôi kể của bài). Trong chính bài có 3 cặp Pāli trùng nguyên văn (21.3 và 25.3; 25.2 và 27.2; 28.2 và 29.2), cả 3 cặp Việt giống nhau; riêng 28.3 và 29.3 có Pāli khác nhau ở dấu nháy kép đóng nên Việt khác đúng chỗ đó. Đã kiểm 119/119 khoá khớp tập khoá và thứ tự Pāli, không khoá rỗng, NFC, không khoảng trắng thừa, không Pāli lọt sang bản Việt ngoài tên riêng Therāpadāna và tên loài hoa kaṇikāra.
  Lệnh còn phải chạy ở môi trường có quyền chạy cổng: `npm run validate`, `npm test`, `npm run check`, `npm run build`; vì vậy technical_integrity đặt 9.6 và chưa tuyên bố technical gate pass.
