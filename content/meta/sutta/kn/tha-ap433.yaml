  🔴 Bất định đã ghi, **không** tự quyết (tất cả đã quét 5.764 tệp Pāli root đã ghim):
  · `brahmaghoso` — hapax toàn Pāli root (1 khoá). Đọc theo `-ghoṣa` = tiếng, cặp với `Karavīkaruto` ngay
    vế trên; dịch "tiếng vang lời người Brāhmaṇa" và **không** nâng thành danh xưng riêng.
  · `tadāpāhaṁ` (`:8.1`) — hapax toàn root. Đọc là `tadā āhaṁ` ("bấy giờ tôi bèn nói"), giữ ngôi kể;
    không chắc chắn là lỗi chép hay chính tả, đã ghi ở đây.
  · `Sakkāyavūpakāso` / `vūpakāsassa` (`:9.1`, `:9.3`) — hapax toàn root; `vūpakāsa` = "sự bày tỏ / người
    bày tỏ", `sakkāya` = "thân tướng". Đã dịch theo nghĩa đen có chủ ngữ rõ (bậc bày tỏ cho tôi / từ tâm bậc
    ấy) và **không** bịa thêm chi tiết nào.
  · `vippanaṭṭhe anāyake` (`:6.4`) — `vippanaṭṭha` chỉ có 2 dạng toàn root, `anāyake` là hapax ở đúng câu này.
    Đã dịch "khỏi cảnh đổ nát chẳng có ai dẫn dắt", giữ cả hai vế; còn cách đọc khác (chỗ đổ nát *không*
    dẫn đến đâu) thì không loại trừ được.
  · `saṁsaggapīḷito` (`:8.4`) — hapax toàn root. Vế trên là "Một mình giữa rừng đẹp", nên dịch "dành trọn
    cho sự gần gũi" theo nghĩa "gắn bó" của `pīḷita`; **không** kết luận `saṁsagga` = "chúng hưởng dục"
    (như ở `:9.4`) vì hai nghĩa đó không cùng một câu.
