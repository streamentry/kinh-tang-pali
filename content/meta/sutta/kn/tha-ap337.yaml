notes: |-
  Bản dịch chỉ từ Pāli root, đối chiếu tiền lệ tầng Việt của chính dự án (tha-ap), vì commit đã ghim không có bản Anh upstream (giới hạn upstream, không phải lỗi người dịch).
  Số Pāli: pañcasahassā = 5.000; aḍḍhateyya = 2,5 nên aḍḍhateyyasahassa = 2.500 và 2.500 + 2.500 = 5.000, khớp với 6.1 (hai ngàn rưỡi dùng cho ngôi vua cõi trời, hai ngàn rưỡi cho ngôi Chuyển Luân Vương, phần nghiệp còn lại cho quả A-la-hán). Satasahassito = một trăm ngàn.
  Bất định đã nêu, không bịa: (1) 2.3-2.4 `saha satasahassehi, aṭṭha khīṇāsavehi` — có thể hiểu là tám lần một trăm ngàn (800.000) bậc lậu tận, hoặc hàng trăm ngàn cùng tám bậc lậu tận; bản dịch giữ nguyên thứ tự Pāli và không chốt con số. Tầng Pāli chỉ có tha-ap342 dùng `saha satasahassehi` không kèm số. (2) 10.4 và 14.4 `phusitassa idaṁ phalaṁ` — phusita vừa là giọt nước (6.1, 9.4) vừa là tên (8.4); dịch là quả của giọt nước, hiểu theo cách thay cho công thức buddhapūjāyidaṁ phalaṁ, nhưng cách đọc là tên Phusita không loại trừ được. (3) 5.3 `pakittetvā` dịch tuyên bố; tiền lệ duy nhất cho dòng này trong tầng (sau khi đã làm tròn việc của ta) lệch khỏi gốc từ nên không dùng lại. (4) 14.2 Pāli ghi candanaṁ (chiên-đàn) chứ không ghi nước hoa ở dòng này, giữ nguyên. (5) 9.4 phusitaṁva pavassati hiểu là mưa rơi như những giọt rảy. (6) 11.4 aḍḍhakose dịch nửa dặm theo tiền lệ tha-ap61; kosa không đúng bằng dặm nên đây chỉ là ước lượng quen dùng trong tầng. (7) 10.1 ugghāṭitā dịch phá bỏ.
  Tiền lệ đã đo trong tầng: lokajeṭṭho narāsabho là bậc Trưởng Thượng thế gian, đấng Nhân Ngưu (17/19); kilesā jhāpitā là thiêu rụi (126 khoá); mama saṅkappamaññāya là nhờ thấu rõ ý định (17 trên 21 với đại từ ta/tôi); Satasahassito kappe là một trăm ngàn đại kiếp (16) so với kiếp (7); Duggatiṁ nābhijānāmi với ngôi tôi là đọa xứ (81) so với khổ xứ (51); công thức kết Itthaṁ sudaṁ dùng nhóm số nhiều những bài kệ này (407) chứ không dùng nhóm số ít (21). Ba cặp Pāli trùng trong bài (3.3 và 4.3, 6.3 và 7.1, 10.4 và 14.4) đều dịch giống hệt nhau.
  Tên phiên: `:0.3` Pāli bắt đầu bằng số 5 nên giữ số thứ tự, translationTitle bằng đúng giá trị `:0.3`. Cách viết Tuyên Ngôn chọn theo đa số đã sửa chính tả, không dùng dạng Tuyên Ngợ: đo trong phạm vi tha-ap300 đến tha-ap370 thì nhóm Tuyên Ngợ và Tuyên Ngợi gộp 48, Ký Sự 8, Tuyên Ngôn 6; toàn tầng Tuyên Ngợ 234, Tuyên Ngôn 97, Ký Sự 96 — hai phạm vi phân kỳ, người biên tập cần phán một lượt cho cả cuốn. Tên phẩm Gandhodakavagga dịch Phẩm Gandhodaka theo ba tệp liền kề.
  Chưa chạy được các cổng của kho trong lượt này: npm run validate, npm test, npm run check, npm run build; technical_integrity 9.6. Status bắt buộc draft do blocker tầng tham khảo Anh.
