  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 2 khoá bất đồng nghĩa → sửa 0, giữ 2, bất định 0. Giữ `39.1` (`jarāmaraṇaṁ siyā dukkhasaccaṁ, siyā samudayasaccaṁ`: Pāli nói già chết có thể là khổ, có thể là tập khởi; bản nguyên bài để già chết là khổ rồi gán `siyā` cho sinh, khác Pāli ghim; bản dự án theo Pāli). Giữ `22.2` (`vatthuvasena pariyāyena`: dự án *theo cách dựa vào sự việc*, bản nguyên bài *về phương diện nền tảng theo thứ lớp*; `pariyāya` là cách, phương thức). Khác biệt thuật ngữ không đổi nghĩa không tính là bất đồng: `tathaṭṭha` (như thật / thực thể), `lakkhaṇa` (dấu hiệu / tướng trạng), `ākāra` (phương diện / biểu hiện), `pariggaha` (thâu nhiếp / nắm giữ). Các con số cấu trúc đều khớp: 4, 9, 12, 16 phương diện; 2, 6, 12 dấu hiệu; bốn ý nghĩa mỗi chân lý (`pīḷana`, `saṅkhata`, `santāpa`, `vipariṇāma`; `āyūhana`, `nidāna`, `saṁyoga`, `palibodha`; `nissaraṇa`, `viveka`, `asaṅkhata`, `amata`; `niyyāna`, `hetu`, `dassana`, `ādhipateyya`), mười một mắt xích từ già chết đến các hành. Không sửa khoá nào. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

