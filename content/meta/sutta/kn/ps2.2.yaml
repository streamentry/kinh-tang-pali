  Cấu trúc bài: 1.x lời Đức Thế Tôn nêu bốn điều như thật, không sai, không khác (phần mở đầu đề là Purimanidānaṁ); 2–5 bốn ý nghĩa của từng chân lý; 6–17 bốn chân lý có cùng một sự thông suốt theo bốn, chín, mười hai, mười sáu phương diện, mỗi phương diện kết bằng công thức được gom về một, tính đồng nhất, thông suốt bằng một trí; 18–20 dấu hiệu của các chân lý; 21–22 thiện, bất thiện, vô ký và việc gom chân lý vào nhau; 23–24 bài kinh thứ hai (Ta suy nghĩ về vị ngọt, nguy hại, thoát ly của năm uẩn trước khi giác ngộ); 25–26 phần giải thích kinh thứ hai gán bốn sự thông suốt vào bốn chân lý; 27–37 ba ý nghĩa của chân lý (tìm kiếm, thâu nhiếp, thông suốt) trên chuỗi từ già chết đến các hành; 38–39 gán chuỗi vào bốn chân lý.

  Số Pāli, tự tính từ danh sách trong chính bài: cattāri saccāni = bốn chân lý (khổ, tập khởi, diệt tận, đạo). Bốn ý nghĩa của mỗi chân lý (2.3, 3.3, 4.3, 5.3) mỗi nhóm đếm đủ 4. Catūhākāra (6.2) = bốn phương diện: như thật, vô ngã, chân lý, thông suốt = 4, khớp 6.3. Navahākāra (12.2) = chín: 4 phương diện trên + thắng tri, hiểu rõ tột cùng, từ bỏ, tu tập, chứng ngộ = 9, khớp 12.3; 13.3 và 14.5 đếm đủ 9 mục. Dvādasa (15.2) = mười hai: liệt kê ở 15.3 đếm đủ 12 (như thật xuất hiện hai lần, ở vị trí 1 và 8); ở 17.1 đến 17.11 dấu lược nêu 11 mục sau mục như thật đầu, cộng mục đầu là 12. Soḷasa (16.2, 17.12) = mười sáu = 4 chân lý × 4 ý nghĩa (16.3 đến 16.6; 17.13 đến 17.16). Lakkhaṇa: dve (18.2) = dấu hiệu hữu vi + vô vi; cha (19.2) = 3 của hữu vi (sinh, diệt, khác đi của cái đang trụ) + 3 của vô vi (phủ định ba điều ấy) = 6; dvādasa (20.2) = 4 chân lý × 3 = 12 (20.3 đến 20.6). Ở 22: tīṇi/ekasaccena, dve/dvīhi khớp với ba nhóm (khổ + tập khởi, khổ + đạo, khổ + diệt tận) = hai chân lý mỗi nhóm. Pañcannaṁ upādānakkhandhānaṁ (24.1) = năm thủ uẩn, khớp năm khoá 23.2 đến 23.6; tīsu ṭhānesu (25.7, 26.10) = ba trường hợp: vị ngọt, nguy hại, thoát ly; tám yếu tố ở 25.7 (kiến, tư duy, lời nói, hành động, sinh kế, tinh tấn, niệm, định) = 8. Chuỗi 27 đến 37: 12 chi từ già chết đến vô minh, 11 liên kết; 38.1 đến 38.11 đếm đủ 11 cặp. Không có số lớn.

  Thuật ngữ và tiền lệ (số đếm trên tầng; khi hai phạm vi cho đa số khác nhau thì nêu cả hai):
  - tathā avitathā anaññathā → như thật, không sai, không khác: dùng lại nguyên văn sn56.20 cho 1.2, 1.4 (Pāli trùng nguyên văn); tathametaṁ avitathametaṁ anaññathametaṁ → điều ấy như thật, điều ấy không sai, điều ấy không khác. Katamāni cattāri → là bốn nào (sn56.20:1.2). Purimanidānaṁ → dẫn nhập phần trước (ps1.8:1.1). dukkhasamudayo → tập khởi của khổ, dukkhanirodho → diệt tận của khổ (ps1.1; tầng dùng tập khởi 27 · nguồn gốc 32 trên 92 khoá có dukkhasamudayo).
  - saccaṁ → chân lý (ps2.5, ps3.3, bv4); ariyasacca (ở ps1.1, ps1.10) → Thánh đế, nhưng bài này chỉ nói sacca nên dùng chân lý và nêu tên từng chân lý là chân lý về khổ, về tập khởi, về diệt tận, về đạo (ps1.0:56 đến 59 dùng khổ, tập khởi, diệt tận, đạo cho bốn chân lý).
  - aṭṭha trong tathaṭṭha, dukkhaṭṭha và các từ cùng khuôn → ý nghĩa, theo công thức Do ý nghĩa X của ps1.9, ps1.10, ps2.5, ps3.3, ps2.9. Cụ thể: dassanaṭṭha → ý nghĩa thấy (22 khoá/6 tệp ps); hetuṭṭha → ý nghĩa là nhân (5/4); ādhipateyyaṭṭha → làm chủ (8/4); niyyānaṭṭha → xuất ly (5/4 tệp ps); tathaṭṭha → như thật (ps1.0:49, ps2.5:10.33); paṭivedha → thông suốt (ps1.9, ps2.5:10.42; tầng: thấu suốt 57 · thấu triệt 25 · thông suốt 17); abhisamaya → thấu đạt (69 trên 134; ps3.3).
  - nissaraṇa → thoát ly: trong ps có hai dạng: ps3.4 dịch các hợp từ nissaraṇa- bằng xuất ly (19 khoá/1 tệp), còn ps3.10 dịch nissaraṇa bằng thoát ly (9 khoá) và dành xuất ly cho nekkhamma; toàn tầng (540 khoá chứa nissaraṇ-) xuất ly 214 · thoát ly 108 · sự thoát 126; bài song song sn22.26, sn22.28 dùng xuất ly. Chọn thoát ly vì niyyāna (5 khoá/4 tệp ps) và nekkhamma (ps2.9) đã giữ xuất ly, nếu cùng dùng xuất ly thì ý nghĩa thoát ly của diệt tận (4.3) và ý nghĩa xuất ly của đạo (5.3) trong cùng một bài không còn phân biệt. Nếu người biên tập muốn thống nhất theo đa số thì đổi nissaraṇa sang xuất ly ở khoảng 26 khoá (4.3, 16.5, 17.15, 23.2 đến 23.6, 23.13, 23.22, 24.1, 25.5, 26.8, 38.1 đến 38.11, 39.1, 39.3) và đổi niyyāna sang dạng khác ở 5.3, 16.6, 17.16.
  - assāda → vị ngọt (221 trên 448 khoá; sn22.26, sn22.27, sn22.28); ādīnava → sự nguy hại (nguy hại 396 · tai họa 108 trên 716); chandarāgavinaya → sự nhiếp phục dục tham (nhiếp phục 25 · dục tham 25 · ham muốn 14 · loại bỏ 7 trên 42 khoá; sn22.26, sn14.31). Với 23.12 và 23.21, Pāli trùng nguyên văn với sn22.57 nhưng bản Việt ở đó dịch loại bỏ và từ bỏ ham muốn và tham; bản này theo sn22.26 vì 23.x là đoạn song song của sn22.26.
  - sukhaṁ somanassaṁ → lạc và hỷ (24 · hỷ lạc 18 · an lạc 11 trên 84). ayamantimā jāti → đây là kiếp cuối cùng, akuppā me vimutti → giải thoát của Ta không rung chuyển (an3.103, an3.104, an7.50; 15 khoá). paccaññāsiṁ → tuyên bố (sn22.26). nābbhaññāsiṁ, abbhaññāsiṁ → chưa trực tiếp biết, đã trực tiếp biết như thật (sn22.26 dịch liễu tri, an3.103 dịch thấu suốt; không dùng thấu suốt vì bài này dùng thông suốt cho paṭivedha).
  - pahāna → từ bỏ (ps: từ bỏ 17 khoá/3 tệp · đoạn tận 11 · trừ diệt 2 trên 29; toàn tầng từ bỏ 501 · đoạn trừ 251 · đoạn tận 102 trên 925 khoá); pariññā → hiểu rõ tột cùng (ps1.0:21, ps1.0:56, ps1.1:3 = 3 khoá/2 tệp ps; ngoài ps liễu tri 220 khoá/78 tệp trong sn mn an dn), chọn theo ps vì 12.3 là cùng công thức bốn chức năng ở ps1.0:56 đến 59, nếu người biên tập muốn đổi sang liễu tri thì đổi ở 12.3, 13.3, 14.5, 15.3, 17.5, 25.4, 26.7; abhiññā → thắng tri (ps 151 khoá/2 tệp); sacchikiriyā → chứng ngộ (ps 7 khoá/3 tệp; 840 toàn tầng); bhāvanā → tu tập (ps 50 khoá/5 tệp).
  - saṅgahita trong ekasaṅgahita → được gom về một (theo ps1.0:40.1 ekasaṅgahatā → tính gom về một; trong tầng saṅgahit- hầu hết là saṅgahitaparijana nên không có tiền lệ gần hơn); ekatta → tính đồng nhất (ps1.0:40.1, ne17, mil3.2.6; trong an, ne, mil tính đồng nhất 22 khoá/3 tệp); ekappaṭivedha → có cùng một sự thông suốt; ākāra → phương diện (ps 14 khoá/3 tệp; 65 trên 441 toàn tầng).
  - saṅkhata, asaṅkhata → hữu vi, vô vi; lakkhaṇa → dấu hiệu theo an3.47 (Saṅkhatalakkhaṇasutta, Asaṅkhatalakkhaṇasutta; dấu hiệu 74 · tướng 255 trên 513, nhưng an3.47 là bài đúng cặp hữu vi và vô vi); paññāyati → được nhận biết (an3.47); aññathatta → sự khác đi, ṭhita → cái đang trụ (an3.47).
  - pīḷana → chèn ép (ne7); santāpa → thiêu đốt (thiêu đốt 31 · nóng 38 · nung 13 · bức bách 9 trên 184 khoá); vipariṇāma → biến hoại (biến hoại 234 · biến đổi 126 trên 443; sn22.26 dịch chịu sự biến hoại); āyūhana → tích lũy (ps3.3:18); nidāna (ý nghĩa của tập khởi) → nhân duyên; saṁyoga → trói buộc (17 trên 21); palibodha → ngăn ngại (ne18:5.1; cnd18 dịch ràng buộc); viveka → viễn ly; amata → bất tử (ps3.9:19.2).
  - kusala, akusala, abyākata → thiện, bất thiện, vô ký (ps1.6, cnd16; bất thiện 23 khoá/4 tệp ps).
  - esana → tìm kiếm (tìm kiếm 161 · tìm cầu 114 trên 973 khoá có esan- hoặc pariyesan-); pariggaha → thâu nhiếp (ps1.9:3.1, ps2.5:3.2, ps2.5:14.1; tầng thâu nhiếp 15 · sở hữu 16 trên 78); pajānāti → biết rõ (798 trên 1679); jarāmaraṇa → già chết (già chết 111 · già và chết 86 · già-chết 61 · già, chết 55 trên 380); saḷāyatana → sáu xứ (160 · sáu căn 26); upādāna → chấp thủ; nāmarūpa → danh sắc.
  - kiṁnidāna, kiṁsamudaya, kiṁjātika, kiṁpabhava → lấy gì làm nhân duyên, làm nguồn gốc, làm nơi sinh, làm chỗ phát sinh: theo dn21 (nhân, nguồn gốc, nơi sinh, chỗ phát sinh) và sn12.24, sn12.11 (lấy sinh làm nhân, làm nguồn sinh, …); mn11 dùng nguồn, nguyên nhân, nơi sinh, khởi điểm. Chọn nhân duyên cho nidāna để không trùng với nguồn gốc dành cho samudaya trong công thức này; ở chỗ khác samudaya là tập khởi theo tên chân lý (28.5 đến 37.5), nên bản Việt có hai cách dịch samudaya, tương ứng hai cách dùng trong Pāli.

  Bất định, ghi ở đây mà không thêm vào thân kinh:
  (1) 6.6, 7.6, 8.6, 9.6, 10.5, 11.7, 12.6, 13.6, 14.8, 15.6, 16.9, 17.19: Ekattaṁ ekena ñāṇena paṭivijjhatīti là câu không có chủ ngữ; bản Việt giữ dạng không chủ ngữ và nối với cattāri saccāni ekappaṭivedhāni bằng dấu gạch; quan hệ nguyên nhân giữa hai vế (do thông suốt tính đồng nhất bằng một trí nên bốn chân lý có cùng một sự thông suốt) là cách đọc quen thuộc nhưng không được viết vào thân kinh.
  (2) 22.2, 22.10: vatthuvasena pariyāyena dịch theo cách dựa vào sự việc; nghĩa của vatthu ở đây (sự việc, trường hợp, đối tượng) và pariyāya (cách nói) chưa phân xử chắc từ Pāli một mình; phần giải thích 22.4 đến 22.9 cho thấy chỗ dựa là từng trường hợp cụ thể của chân lý về khổ.
  (3) 25.7, 26.10: bản Pāli ghim ghi diṭṭhi saṅkappo vācā kammanto ājīvo vāyāmo sati samādhi không có sammā; bản Việt không thêm chánh, dịch kiến, tư duy, lời nói, hành động, sinh kế, tinh tấn, niệm, định; nối với bhāvanāpaṭivedho maggasaccaṁ cho thấy đây là tám chi đạo, nhưng điều đó không được viết vào thân kinh.
  (4) 15.3, 17.4, 17.5: abhijānana và parijānana là danh từ chỉ hành động, khác abhiññā và pariññā ở 12.3; bản Việt phân biệt bằng cụm ý nghĩa của sự thắng tri, ý nghĩa của sự hiểu rõ tột cùng thay vì ý nghĩa thắng tri, ý nghĩa hiểu rõ tột cùng; dhammaṭṭha → ý nghĩa là pháp và phassanaṭṭha → ý nghĩa chạm tới chưa có tiền lệ trong tầng (0 khoá) nên là lựa chọn bám chữ, chưa phân xử.
  (5) 2.2 đến 5.4: dukkhassa dukkhaṭṭhā → ý nghĩa khổ của khổ; cách nói lặp này bám đúng Pāli, đọc hơi nặng nhưng không đổi thành ý nghĩa tự thân của khổ để khỏi thêm giải thích.
  (6) 16.3 đến 16.6, 17.13 đến 17.16: câu kết ở các khoá này (tathaṭṭho, abhisamayaṭṭho) dịch là ý nghĩa như thật, ý nghĩa thấu đạt của cả bốn ý nghĩa đứng trước; Pāli không có động từ nên chữ là chỉ là cách nối của bản Việt.
  (7) 19.3: ṭhitānaṁ aññathattaṁ (số nhiều) ở vế hữu vi, ṭhitassa aññathattaṁ (số ít) ở vế vô vi; bản Việt giữ đúng số.
  (8) 24.1: đoạn Pāli chạy liền nhau không dấu câu giữa hai vế; bản Việt tách bằng dấu chấm phẩy; chữ evaṁ giữ là như vậy đặt sau yathābhūtaṁ (như thật); hai dấu nháy đơn khớp Pāli (hai cặp) nhưng vị trí chữ rằng khác Pāli ở vế thứ hai (Pāli đưa cụm sadevake loke … vào trong nháy, bản Việt để ngoài).
  (9) 14.1 đến 14.3 và 17.1 đến 17.11: các dấu lược … và …pe… che phần lặp của câu hỏi; bản Việt giữ đúng một … cho mỗi khoá và nối câu hỏi bằng như thế nào ở khoá đầu, ý nghĩa … ở các khoá giữa, câu hỏi hoàn chỉnh ở khoá cuối; cách chia câu là của bản Việt.
  (10) 27.1: <b>Saccan</b>ti dịch điều gọi là chân lý (ps3.5:2.5 và ps3.10:10.1 dịch dạng này bằng nghĩa là); chọn dạng điều gọi là để câu hỏi katihākārehi saccaṁ đọc được.
  (11) 1.1: Purimanidānaṁ dịch dẫn nhập phần trước theo ps1.8:1.1; không có tên địa danh như ở các bài ps khác (ps2.9:1.1 là Sāvatthī).

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (292 = 292), thứ tự giống Pāli; nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch; 12 khoá có dấu nháy trong Pāli); dấu lược … khớp Pāli từng khoá (0 lệch; 19 khoá có dấu lược, gồm 4 khoá …pe… và 15 khoá … trần); không khoá nào là (…) trần và Pāli không có (…); không khoá nào Pāli kết ….; NFC đạt; 0 khoá rỗng; không Pāli lọt sang Việt ngoài tên riêng Paṭisambhidāmagga ở khoá tiêu đề. Pāli trùng nguyên văn trong chính bài: 18 nhóm, 96 khoá, bản Việt giống hệt nhau (0 lệch). Pāli trùng nguyên văn với tầng ngoài bài: 5 khoá, 6 cặp đã dò (sn56.20:1.1 và 1.3, sn12.65:3.1 và 6.1, sn22.57:3.5 và 15.5), 4 cặp dùng lại nguyên văn bản Việt, 2 cặp bản Việt khác (23.12 và 23.21, lý do ở trên). Các số Pāli đã tự tính và đối chiếu từng khoá. Đã in và đọc đủ 292 cặp Pāli với Việt.

