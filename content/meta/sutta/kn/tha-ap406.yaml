  bằng số nên BỎ số thứ tự (không thuộc nhóm THỪA). Mẫu câu đo được trên các bài `tha-ap` đã có `:0.3`
  ở cây làm việc: cửa sổ gần nhất tha-ap395–420 là Ký Sự 11/11; cửa sổ tha-ap380–440 là Ký Sự 21 / Tuyên Ngợ 14 /
  Tuyên Ngôn 6 / khác 1; toàn phẩm (tha-ap1–600) là Tuyên Ngợ 235 / Tuyên Ngôn 134 / Ký Sự 117 / Kinh Kệ 5 / khác 19.
  Hai phạm vi cho hai đa số khác nhau. `Tuyên Ngợ` là chính tả đáng ngờ (Pāli không có chữ nào tương ứng), nên bài này
  dùng *Ký Sự Về Trưởng Lão*, khớp tha-ap404, tha-ap405 và `:30.1` *Ký sự về Trưởng lão Dhotaka, thứ tư*. Đề nghị
  người biên tập phán một lượt cho cả cuốn.

  `:0.1` `Therāpadāna` giữ nguyên Pāli theo đa số tầng (498 khoá). `:0.2` `Metteyyavagga` → *Phẩm Metteyya*, khớp
  tha-ap404 và tha-ap405 cùng phẩm.

  THUẬT NGỮ VÀ TIỀN LỆ (đếm trên các dòng Pāli khác nhau của phẩm `tha-ap` đã có Việt):
  - Dò 53 khoá có Pāli trùng nguyên văn với một khoá đã dịch ở phẩm; 42 khoá dùng lại đúng một bản Việt đã có,
    11 khoá khác (3.4, 5.4, 10.2, 11.2 chỉ khác dấu cuối dòng theo Pāli; 6.4 dùng dấu hai chấm vì lời kể dẫn vào lời nói;
    4.1, 15.1, 17.2, 18.3, 20.2, 24.2 khác có lý do ở các điểm nêu bên dưới).
  - `Haṁsavatiyā nagare` → *Ở thành Haṁsavatī* (không dùng *thành xứ*: 6 khoá tiền lệ thêm chữ *xứ* mà Pāli không có).
  - Đại từ: *ta* xuyên suốt cho người kể và cho lời Đức Phật ở `:14`–`:23` (Pāli `suṇātha mama bhāsato`:
    10 khoá *ta* / 5 khoá *Ta*); lời thưa với Đức Phật ở `:12` xưng *con* theo tiền lệ (*Xin Đức Phật nhận lấy của con*).
  - Ba công thức kệ chung `:25`, `:26`, `:27` dùng nguyên văn đa số toàn tầng: *Các phiền não của ta đã được
    thiêu rụi* (105), *Thật lành thay sự đến của ta* (100), *Bốn vô ngại giải* (495); `…pe…` → đúng một `…`
    (692 khoá `…`, 6 khoá `… `). `viharāmi anāsavo` → *ta sống không còn lậu hoặc* (113 khoá, so với 24 khoá *tôi sống không còn lậu hoặc*).
  - `setudānassidaṁ phalaṁ` → *đây là quả báo của việc cúng dường cây cầu* (tha-ap466 dùng đúng khuôn này; tha-ap282 dùng *đó là quả báu*;
