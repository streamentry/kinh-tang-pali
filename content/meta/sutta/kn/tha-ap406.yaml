  BẤT ĐỊNH — để người biên tập phán, không thêm vào thân kinh:
  1. `Haṁsavatiyā dvārena … anusandati tāvade` (`:1.3`–`:1.4`): dịch *qua cổng thành Haṁsavatī … ở ngay đó nó chảy xuôi theo*; `tāvade` ở đây
     là trạng từ chỉ nơi/lúc (*ngay đó*), không phải *ngay lúc ấy* như ở `:6.4` và `:19.4`. Cũng có thể hiểu `dvārena` là *do cửa* (đi qua cửa thành).
  2. `evaṁnāmo mahāmuni` (`:4.4`): có thể hiểu là *tên như vậy, là bậc đại hiền giả* (chỉ vị Bà-la-môn) hoặc là lời xưng danh của chính ông; không có tiền lệ.
  3. `Natthi me dakkhiṇe kāraṁ` (`:8.3`): `dakkhiṇe` dịch *bậc đáng cúng dường* (hiểu là dạng của `dakkhiṇeyya`, đối tượng là Đức Phật);
     cũng có thể hiểu là *ở việc cúng dường*. `gatimaggavisodhanaṁ` (`:8.4`) dịch *việc thanh lọc con đường đi đến cảnh giới tái sinh*, đứng đồng vị với `kāraṁ`.
  4. `Darito pabbatato vā, rukkhato patitopiyaṁ` (`:15.1`–`:15.2`): dịch *Từ khe vực hay từ núi, hay người này rơi xuống từ cây*, hiểu `patitopiyaṁ`
     là `patito pi ayaṁ` (*người này … dù rơi*); `ṭhānaṁ` (`:15.3`) → *chỗ đứng*, theo `patiṭṭhaṁ vindāmi` ở tha-ap453 (*nơi nương đứng*). Có thể hiểu `ṭhāna` là *địa vị*.
  5. `Virūḷhamūlasantānaṁ nigrodhamiva māluto` (`:16.1`–`:16.2`): hiểu *gốc rễ nối tiếp đã mọc vững* là vế ví với cây đa chống gió, nên
     dịch *Có gốc rễ nối tiếp đã mọc vững, như cây đa trước gió*; cũng có thể hiểu `santāna` là *dòng dõi* (*người có dòng dõi vững như cây đa*).
  6. `na bhavissati vedanā` (`:18.4`): `vedanā` ở đây là cảm thọ khó chịu do nắng, nên dịch *cảm giác đau khổ*; không dịch *thọ* trần vì sẽ sai nghĩa.
  7. `Vehāsaṁ manujasseva` (`:21.3`): `vehāsaṁ` có thể là trạng từ (*trên không trung*) hoặc tính từ của `hatthiyānaṁ` (*xe voi bay*);
     `manujasseva` = `manujassa` + `eva`, dịch *cho chính con người ấy*.
  8. `jalajuttamanāmake` (`:24.2`): dịch *nơi bậc được gọi là Tối Thượng Tựa Hồng Sen* (tên `Padumuttara` dịch nghĩa); tiền lệ chỉ có dạng chủ cách (9 khoá *được gọi là bậc Tối Thượng Tựa Hồng Sen*).
  9. `vipulaṁ me bhavissati` (`:10.4`): không có danh từ trong Pāli; Việt để *việc phụng sự đã làm … sẽ trở nên rộng lớn đối với ta*, không thêm *quả báo*.
  10. `Tiṁsa` không xuất hiện trong bài này; không có bất định về số lượng, các số Pāli đã nêu ở trên đều tính được từ cấu tạo.

  CỔNG KỸ THUẬT: không chạy được trong lát này nên `technical_integrity` đặt 9.6, không tuyên bố đã qua
  cổng. Còn phải chạy trước khi gộp: npm run validate, npm test, npm run check, npm run build.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (dòng đầu tệp ghi tác giả; dịch 2008). 5 khoá bất đồng nghĩa → sửa 0, giữ 3 (3.2 `manujehi purakkhato`: bản nguyên bài hiểu là ngồi phía trước đám người, bản này vây quanh; 21.3 `vehāsaṁ`: bản nguyên bài dịch ngay cả ở đây, bản này trên không trung, vì `vehāsa` là bầu trời ở mọi chỗ khác trong tầng (dn18, dn24, ja532, ps3.2); 27.1 `svāgataṁ`: bản nguyên bài diễn thành đã thành công mỹ mãn, bản này giữ nghĩa đen), bất định 2 (15.3 `cutopi lacchatī ṭhānaṁ`: `cuta` là ngã hay chết, `ṭhāna` là chỗ đứng hay vị thế, bản nguyên bài hiểu chết và vị thế; 18.4 `na bhavissati vedanā`: bản nguyên bài các cảm thọ sẽ không có, bản này thêm đau khổ theo ngữ cảnh bị nắng thiêu, chữ đau khổ không có trong Pāli, 0 tiền lệ khác trong tầng). Bản nguyên bài không có đoạn nào ứng với 1.1 đến 1.4 (không tính là bất đồng). Mọi số (một ngàn tám trăm đệ tử, một trăm ngàn ở 10.1 và 12.1 và 22.1, một ngàn ngựa) hai bản cùng. Lượt review đối kháng riêng đọc lại 115 cặp: không đổi khoá nào. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Điểm triangulation 6.5 → 8.4, các tiêu chí khác giữ nguyên.

  Quyết định hội đồng biên tập 2026-10-16: C6 — 18 khoá (4.2, 5.2, 5.4, 6.1, 6.4, …) (xưng hô theo mục 9: người kể xưng "tôi", Đức Phật tự xưng "Ta").
