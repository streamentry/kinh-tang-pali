  LỖI BẢN NHÁP BẮT ĐƯỢC KHI REVIEW ĐỐI KHÁNG. (1) Bản nháp đầu có sáu lỗi về hoa thường và
  dấu chấm câu ở `:38.4`, `:38.6`, `:38.7`, `:38.10`, `:39.5`, `:39.9` — đã sửa, và cả sáu
  đều lệch ở ranh giới câu, tức chỗ dễ bị người đọc đọc sai là có từ bị bỏ hay lặp. (2) Bộ
  dò ký tự Pāli sót trong Việt báo nhầm `ạ` là ký tự Pāli; sau khi sửa, còn đúng 2 khoá có
  ký tự Pāli là `:0.1` và `:0.2` của phần 1, và đó là chủ ý giữ nguyên tiêu đề Pāli. (3)
  Phép đo số thứ tự thiền ban đầu không khớp “Sơ thiền” vì không phân biệt hoa thường, nên
  báo nhầm là lệch 4/4; đã sửa, thật là 4/4. (4) Trong lượt đo của chính lát này, ba phép
  đo phải bỏ vì nó đo sai và nếu ghi vào đây sẽ thành dối trá: đếm thuật ngữ bằng cách tìm
  chuỗi con nên “vô sắc hữu” bị tính nhầm thành “sắc hữu”; đếm `cetovimutti` phân biệt
  hoa thường nên bỏ sót an3.68:7.2 vì chữ “Giải” đứng đầu câu; và biểu thức tra khoá `mn52`
  của tôi lọc nhầm nên tưởng là không có tiền lệ cho bốn samāpatti, trong khi thực ra có,
  ở mn52:12.3, 13.3, 14.3. Cả ba đều là lỗi ở phép đo, không phải ở bản dịch — nhưng vì
  vậy mọi con số ở mục trên đều phải in ra phép tính chứ không được ghi “0 lệch”.

