notes: |-
  Đợt 19, làn 146. Dịch từ Pāli root commit đã ghim, đủ 4.788/4.788 khoá (các khoá 0.1–0.3 và 48 khoá tiêu đề N.0, còn lại là văn bản; chương 1–580), thứ tự khoá đúng thứ tự Pāli, 0 khoá ngoài tập Pāli, 0 khoá rỗng. Bài đã được hoàn thiện qua nhiều lát: 180 khoá đầu (0.1–31.23 và 35.8–41.9) do hai lát trước ghi; lát này thêm 4.608 khoá còn lại và hoàn tất bài. Trong 180 khoá cũ, lát này chỉ sửa 26 khoá: (a) 20 khoá 0.3, 1.0, 1.1, 2.1–17.1, 18.1 — đổi `ñāṇa` từ "sự biết / tri kiến" sang "trí" và đặt lại mô thức `paññā … ñāṇaṁ` thành "sự biết rõ điều ấy là trí tuệ, là trí do nghe mà sinh", cho khớp mẫu đề ps1.0 ("trí tuệ là trí do nghe mà sinh") và các bài ps khác ("trí về …"); (b) 6 khoá 37.20–37.22 và 38.10–38.12 — sai nghĩa nặng: `vokāra` là "uẩn" (hữu một uẩn, bốn uẩn, năm uẩn; ps1.2:15.10–12 và cnd13:15), không phải "trói buộc"; và ba căn cuối là "căn ta sẽ biết điều chưa biết / căn đã biết / căn đã biết xong" (ps1.4:90). Ghi chú của lát trước về bất định `vokāra` vì thế đã được giải quyết bằng tiền lệ trên.

  CẤU TRÚC BÀI (Ñāṇakathā, 73 trí). Mỗi chương 1.1.N giải thích dòng thứ N của mẫu đề ps1.0. 1.1.1 (1–202): trí do nghe mà sinh — năm mô thức `abhiññeyya / pariññeyya / pahātabba / bhāvetabba / sacchikātabba` lặp qua các danh sách (xứ, giới, căn, đế, uẩn, ý nghĩa của căn lực giác chi …) rồi các nhóm bốn phần tụng. 1.1.2–1.1.3 (203–252): trí do giới và do tu tập định mà sinh. 1.1.4–1.1.19 (253–421): trí về sự an trụ của pháp (chín phương diện của duyên và nhân), dò xét, sinh diệt, hoại diệt, nguy hại, xả đối với hành, chuyển tộc, đạo, quả, giải thoát, quán xét lại, và bốn loại sai biệt (căn cứ, phạm vi, hành, cõi, pháp). 1.1.20–1.1.55 (422–517): nhóm năm trí, bốn vô ngại giải, ba trí, định vô gián, trú vô tránh, chứng đạt diệt, bát-niết-bàn, ngang hàng, làm mòn, tinh tấn, chỉ rõ ý nghĩa, kiến thanh tịnh, chấp nhận, thâm nhập, trú một phần, sáu sự quay đi, thần thông, thiên nhĩ, tha tâm, túc mạng, thiên nhãn, đoạn tận lậu hoặc. 1.1.56–1.1.73 (518–580): trí về bốn đế, vô ngại giải đơn thuần, căn cơ mạnh yếu, khuynh hướng và tùy miên, thị hiện song đôi, đại bi, toàn tri và không bị che chắn; kết bằng bài kệ `Na tassa addiṭṭhamidhatthi kiñci`.

  COVERAGE ENGLISH ĐO ĐƯỢC. Mẫu số = 1.899 khoá Pāli có nội dung (độ dài ≥ 40 ký tự theo `source/layers.yaml`, sau khi gộp khoảng trắng, bỏ khối `:0`) trên tổng 4.788 khoá; 2.886 khoá ngắn hơn 40 ký tự (đa số là các dòng danh sách ngắn và dòng lược), 3 khoá khối 0.1–0.3. Sujato: 0/1.899. english-project: 0/1.899 (không có tệp ps nào ở `content/translation/en/project/sutta/kn/`). vietnamese-current: 0/1.899 (chỉ có Pháp Cú). Ba tầng tham khảo đều vắng ⇒ triangulation 7,0 (≤ 8,0) và status draft kèm blocker noEnglishEditionUpstream. Tôi không đụng `content/meta/reference-gaps.yaml`; entry ở đó (nếu có) cũng không cứu được published. Bài này được đối chiếu độc lập với English ở 0/1.899 khoá. Trang tra cứu toàn văn của SuttaCentral có một bản Việt không phân đoạn cho ps1.1, nhưng đó không phải tầng của store, không căn lề với segment và lát này không dùng làm nguồn; đối chiếu thuật ngữ dựa vào tầng Việt đã dịch của chính dự án (ps1.0, ps1.2–ps3.10, dn22, dn33, dn34, mn9, mn118, cnd, mnd, pe …), không phải bản dịch độc lập.

  QUY TRÌNH. Bản dịch do Claude Sonnet 5.5 (Claude Code) thực hiện theo 12 phần song song (362–507 khoá mỗi phần) theo một bộ quy ước chung, rồi qua 8 lượt rà soát đối kháng đọc từng cặp Pāli↔Việt trên toàn bài (4.788 khoá). Rà soát đã sửa 144 khoá (sai nghĩa 6, thuật ngữ cho khớp tiền lệ và quy ước, dấu câu và chữ hoa đầu khoá, tiếng Việt) và người điều phối sửa thêm 87 khoá thống nhất thuật ngữ; không bước nào là đối chiếu độc lập với một người dịch khác, vì cùng một công cụ làm cả hai. 101 khoá (47 tiêu đề N.0 và 54 khoá kết `…niddeso`, `…bhāṇavāro`) do người điều phối dịch riêng một lượt để thống nhất.

  MÔ THỨC LẶP. `Tena vuccati—` → "Vì thế được nói—". `Taṁ ñātaṭṭhena ñāṇaṁ, pajānanaṭṭhena paññā` → "Điều ấy, do ý nghĩa đã biết là trí, do ý nghĩa biết rõ là trí tuệ". `Kathaṁ X paññā Y ñāṇaṁ?` → "Như thế nào mà X, trí tuệ là Y?", với X và Y theo đúng cách dịch của dòng mẫu đề ps1.0 tương ứng. Hậu tố `-aṭṭha(ena)` → "ý nghĩa … / do ý nghĩa …" theo ps2. Dấu `—` cuối khoá của Pāli giữ nguyên, sát từ cuối. Thẻ `<b>` và số chú thích `[N]` của bản Pāli ghim được bỏ hoàn toàn (toàn tầng Việt không có khoá nào mang `[N]`).

  TIÊU ĐỀ. `:0.1` giữ Pāli "Paṭisambhidāmagga", `:0.2` giữ Pāli "Mahāvagga" (như ps1.0, ps1.6–ps1.10 và các bài ps khác), `:0.3` "1.1. Luận Bàn Về Trí" (khuôn "Luận Bàn Về …" của ps). Tiêu đề 1.1.N bỏ `niddesa` theo tiền lệ dn22 và giữ nguyên số mục của Pāli (có dấu chấm hoặc không theo từng khoá): "Trí Do Nghe Mà Sinh", "Trí Về Sự An Trụ Của Pháp", "Trí Chuyển Tộc", "Trí Về Sự Quán Xét Lại", "Nhóm Năm Trí", "Hai Nhóm Bốn Trí Về Chân Lý" … theo cách dịch ps1.0 của dòng tương ứng. Khoá 1.1.72–73 có tiêu đề Pāli chỉ nêu `Sabbaññutañāṇa` nên dịch "Trí Toàn Tri", dù mục 72–73 gồm cả trí toàn tri và trí không bị che chắn. Khoá kết "…niddeso N." → "Phần giải thích … , thứ N." theo ps1.3; số thứ tự đã tính từng khoá và khớp số cuối của tiêu đề: paṭhama 1 … ekūnavīsatima 19, catuvīsatima 24, aṭṭhavīsatima 28, ekatiṁsatima 31 … navatiṁsatima 39, cattālīsama 40 … tecattālīsama 43, navacattālīsama 49, paññāsama 50 … pañcapaññāsama 55, tesaṭṭhima 63, sattasaṭṭhima 67, aṭṭhasaṭṭhima 68, navasaṭṭhima 69, sattatima 70, ekasattatima 71 (47/47 khoá kết có số thứ tự, 0 lệch với số cuối của tiêu đề). `Ñāṇakathā niṭṭhitā` → "Luận bàn về trí được hoàn tất" (580.5).

  PĀLI TRÙNG NGUYÊN VĂN TRONG CHÍNH BÀI (đã đếm). Sau khi bỏ thẻ <b>, số chú thích, khoảng trắng thừa: 344 nhóm Pāli trùng, gồm 1.486 khoá; 340 nhóm dùng cùng một bản Việt, 4 nhóm khác nhau có chủ ý hoặc do ngữ cảnh: `Vedanāya …pe…` và `saññāya …` (dạng sở hữu cách ở 42–43 dịch "thọ …", "tưởng …"; dạng vị trí cách ở 46 và 455, 463 dịch "nơi thọ …", "nơi tưởng …"), và `ñāṇena avijjāya …` / `pāmojjena aratiyā …` ở 236 (nhờ trí, vô minh …) so với 470 (cùng cặp trong chuỗi "làm cạn sự vận hành").

  PĀLI TRÙNG NGUYÊN VĂN VỚI TẦNG ĐÃ DỊCH (đã dò). 490 khoá của bài có chuỗi Pāli trùng với khoá ở bài khác của tầng Việt (không tính ps1.1); 391 khoá dùng đúng bản Việt đã có, 99 khoá khác. Trong 99 khoá khác, phần lớn chỉ lệch khoảng trắng trước dấu `—`, "tính đơn nhất" so với "tính đồng nhất", "xả bỏ" so với "từ bỏ", "thiền thứ hai" so với "nhị thiền", hoặc là khoá lược chỉ có vài chữ ("Với cảm thọ …"); số khoá khác không phải lỗi vì tầng tự mâu thuẫn ở các điểm này. Có ba cách dịch tôi cố ý không theo tầng: (1) jhāna dùng "sơ/nhị/tam/tứ thiền" cho cả bài (đã là cách của các khoá 39.1–39.4 từ lát trước) thay cho "thiền thứ hai" … ở 202.x và 106.3; (2) `ekattaṁ` dịch "tính đồng nhất" (ps1.0, ps2.2, ps1.3: 3/3) thay cho "tính đơn nhất" của ps2.10 (1 chỗ); (3) `sīsa` ở 476.x dịch "đỉnh" thay cho "môn đồ" của ps3.7.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM (phạm vi tầng ps trước, phạm vi toàn tầng sau khi khác). `ñāṇa` → "trí" (ps1.0 và các bài ps khác), `paññā` → "trí tuệ"; `ākāra` → "phương diện" (ps 336/348 khoá); `-aṭṭha` → "ý nghĩa" (ps2.2, ps2.3, ps2.6); `abhiññeyya` → "cần được thắng tri" (56/57 khoá toàn tầng); `sacchikātabba` → "cần được chứng ngộ" (79/100); `pariññeyya` "cần được hiểu rõ tột cùng" và `pahātabba` "cần được trừ diệt" theo mô thức đã dùng ở 180 khoá cũ của bài (tầng chia cách dịch `pahātabba` giữa "trừ diệt" và "từ bỏ"; tôi giữ mô thức của bài); `pahāna(ṭṭha)` và `pahīna` → "trừ diệt" cho danh từ và quá khứ phân từ, còn động từ `pajahati` → "từ bỏ" (đa số trong bài); `pariccāga` → "từ bỏ" (ps1.0:22) — đây là điểm tôi thống nhất bằng cách đổi các khoá từng dùng "xả bỏ" (ps2.3) hay "từ bỏ" cho `pahāna` (5 khoá). `ekarasa` → "nhất vị" (khoảng 35 khoá theo đếm của lượt rà soát); `samatha/vipassanā` → "chỉ / quán"; `apariyāpanna` → "không thuộc cõi nào" (riêng `apariyāpannā bhūmi`: "cõi không thuộc phạm vi nào"; tầng dịch `pariyāpanna` là "thuộc phạm vi / nằm trong"); `hīna/paṇīta` → "hạ liệt / thắng diệu" (ps3.1:35); `nirodha` → "diệt tận", `avippaṭisāra` → "không hối tiếc" (58 so với 9 "hối hận", theo đếm của lượt rà soát); `āsevanā` → "sự thực hành"; `āhāra` → "vật thực" (khoảng 10 khoá), riêng công thức nhớ đời trước `evamāhāro` giữ "thức ăn như vậy" theo cnd18 (3/3); `kasiṇa` → "biến xứ màu …" (19/25 khoá so với 0/25 dạng không "màu"); `adhimutti` → "thiên hướng" (ps1.0:33); `paṭividita` → "thấu rõ" (31/36 so với "thấu hiểu" 4/36); `thāmagata anusaya` → "tùy miên đã ngấm sâu" (ps3.3, mnd3: 9 chỗ theo đếm của lượt rà soát); `anupassanā` → "quán …" (quán vô thường, khổ, vô ngã, nhàm chán, ly tham, đoạn diệt, xả bỏ, theo ps1.3:41); `vuṭṭhāti` → "xuất khỏi", `vivaṭṭati` → "quay đi" (ps1.0:10–11, 44–49). Thuật ngữ dịch lần đầu, không có tiền lệ trên tầng, đã ghi trong từng khoá và nêu ở mục bất định: `agati` "sự không có cảnh giới", `javana` "tốc hành", `aññāṇacariyā` "vô trí hành", `vatthusaṅkamanā` "sự chuyển đổi nền tảng", `antavantato` "là có sự chấm dứt", `tejitattā` "được thắp rực", `āyavaṁ` "sự nỗ lực". Hai điểm lệch với ps1.0 cần người biên tập quyết một lần cho cả hai bài: `ekarasaṭṭha` ps1.0:23 "một vị" (ps1.1:422.1, 422.9 giữ nguyên văn mẫu đề) so với "nhất vị" trong thân bài; `phassanaṭṭha` ps1.0:24 "ý nghĩa xúc chạm" (422.1, 422.9) so với "chạm tới" ở ps2 và ps1.1:71.10.

  SỐ PĀLI (đã tính). Các số đứng riêng eko…dasa ở 159–168 và các nhóm "Một …—" … "Mười …—" (94–103, 112–121, 128–136 và 532–543: một … mười, mười hai, mười tám) khớp từng khoá. `pañcapaññāsa` 55 = 1 + 2 + … + 10 (mười nhóm định ở 248–251). `pañcavīsati` 25 (252.1, 270.2, 270.3, 278.1: năm uẩn × năm đặc tính) và `paññāsa` 50 (270.3, 278.1). `catusaṭṭhi` 64 = 4 + 60 (511.1, 516.5, 517.14); `aṭṭhasata` 108 (562.55); `dvāsaṭṭhi` 62 = 2 + 60 (562.57); các số 63–71 chỉ có ở khoá kết (đã khớp tiêu đề). `soḷasa` 16 trí hành = 8 quán + 4 đạo + 4 quả (466.2, 460.1); `navahi samādhicariyāhi` 9 (467.1: 467.2 chỉ liệt kê 8 mục rồi chuyển sang cụm `paṭilābhatthāya …`, bản Việt giữ đúng văn bản, không thêm mục thứ chín); `terasa` 13 đỉnh (476.1–476.2); `cuddasa` 14: 7 + 7 ở 434.1 (bảy pháp, bảy nghĩa, mười bốn ngữ từ) và 14 = 8 + 6 trí của Phật (576.4–576.5); `ekaṁ` 1, `cha` 6 vị trí của căn (512.2–512.6, đếm đúng sáu mục); dãy các đời ở 509.3: 1, 2, 3, 4, 5, 10, 20, 30, 40, 50, `jātisata` 100, `jātisahassa` 1.000, `jātisatasahassa` 100.000 ("một trăm ngàn"). Pāli 252.1 nêu `pañcavīsati` (25) ý nghĩa của định nhưng 252.2 liệt kê 27 mục: bản Việt giữ "hai mươi lăm" và dịch đủ 27 mục theo văn bản. Pāli 203.2 `Pañca sīlāni` → "Năm giới" và 203.3 liệt kê đúng năm mục; ở 235.1 `Pañca sīlāni` cũng dịch "Năm giới" đúng Pāli, nhưng danh sách kế tiếp 235.2–235.10 là dạng lược nên không đếm được năm mục tường minh. Không có số ghép kiểu `…navutito` hay thang lớn kiểu `tiṁsakappasahassa` trong bài.

