  JHĀNA VÀ CETOVIMUTTI. `jhāna`: dạng Hán–Việt “sơ/nhị/tam/tứ thiền” 97/68/66/82 so với
  “thiền thứ nhất/hai” 65/56, nên dùng dạng Hán–Việt cho cả bốn, đồng bộ nhau. `cetovimutti`
  → “giải thoát tâm từ”: chỉ có 2 khoá tiền lệ (an3.68:7.2 và :7.3) và cả hai đều đồng
  ý; còn `bi`, `hoan hỷ`, `xả` thì 0 tiền lệ, tôi dựng theo cùng khuôn đó. Cần nói rõ:
  150 khoá “giải thoát tâm” có sẵn trong tầng đều là dùng tính chất (“sự giải thoát tâm vô
  lậu”), không phải chia bốn loại, nên chúng không phải tiền lệ cho việc chia này.

  BỐN SAMĀPATTI. an1.451–:453 dịch `āyatana` thành “xứ vô số hư không / xứ vô số thức / xứ
  vô sở hữu / xứ phi tưởng phi phi tưởng”, còn mn52:12.3, 13.3, 14.3 lại dịch đúng ba cụm
  `…āyatanasamāpatti` thành “sự chứng đạt Không vô biên xứ / sự chứng đạt Thức vô biên xứ
  / sự chứng đạt Vô sở hữu xứ”. Vì ps1.1:39.9–:39.12 là `samāpatti` (có “sự chứng đạt”)
  chứ không thuần `āyatana`, tôi theo mn52 cho ba mục đầu. Mục thứ tư không có ở mn52
  (mn52 kết ở `ākiñcaññā`), nên ghép khuôn của mn52 với cách dịch āyatana ở mn106:13.9
  (“các tưởng về phi tưởng phi phi tưởng xứ”) cho ra “sự chứng đạt phi tưởng phi phi tưởng
  xứ”. Đếm cả tầng: “vô biên xứ” 123 so với “vô số hư không” 24.

  HAI CHỖ CÒN BẤT ĐỊNH, ĐÃ CHỌN VÀ GHI LẠI. (1) Trong chín mục `:38.4`–`:38.12` đều là các
  loại `bhava`, phải dùng MỘT dạng cho cả chín. Đếm nguyên văn “hữu dục/hữu sắc/hữu vô
  sắc” chỉ 1 khoá (dn33:1.10.45) so với “dục hữu/sắc hữu/vô sắc hữu” 3 khoá (mn9:30.3,
  mn43:15.3, dn15:5.3) — theo đếm thuần thì thua 3:1. Tôi vẫn chọn “hữu dục” vì hai
  lý do đo được: một danh sách liệt kê không thể lúc này “dục hữu” lúc nọi “hữu tưởng”;
  và dn33:1.10 là ṅāṇavatthu — bảng liệt kê các nhóm “ba X” của chính Paṭisambhidāmagga,
  đúng thể loại với ps1.1, trong khi ba khoá kia chỉ là nhắc vụn trong văn xuôi, dn15:5.3
  còn là câu “chẳng hạn”. Người biên tập nếu chọn phạm vi toàn tầng thì phải đổi cả dn33.
  (2) `vokāra` là chỗ tôi yếu nhất. Cụm `vokārabhava` không có khoá nào trên tầng, và hai
  khoá duy nhất có chữ `vokāra` đứng riêng (mn98:9.21, snp3.9:23.3) lại dịch là “sai
  biệt/phân biệt”, không phải “trói buộc”. Tôi vẫn dịch “trói buộc” vì ở đây `vokāra`
  là nghĩa kỹ thuật “sợi trói” trong `ekavokāra/catuvokāra/pañcavokāra` (tức là hữu căn
  theo số sợi trói), và cách dùng “trói buộc” cho sợi trói có tiền lệ dày: 110 khoá có
  `saṃyojana` dịch “trói buộc”. Nhưng đây là lựa chọn đã ghi, không phải điều đã chứng
  minh; nếu người biên tập chọn nghĩa của mn98 thì phải đổi cả ba khoá `:38.10`–`:38.12`.
  Liên quan: `asaññā` đứng riêng chỉ có 2 khoá trên tầng, một khoá dịch “vô tưởng”
  (mn102:9.3) và một khoá bị phủ định bởi `no` nên thành “không có tưởng” (an2.84:1.1);
  không có khoá nào dịch trái, nên `hữu vô tưởng` ở `:38.8` đứng được.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ, KHÔNG DỊCH LẠI TỪ ĐẦU. Trong chính bài có 7 nhóm Pāli
  trùng nguyên văn có đủ cả hai bên đã dịch, và cả 7 đều dùng CÙNG một cách dịch, 0 lệch.
  Ba nhóm là nối từ phần 1 sang phần 2, và đây là chỗ tôi cần ghi rõ vì dễ dịch lại: `:41.5`
  dùng lại y hệt `:30.1` (Rūpaṁ), `:40.7` dùng lại y hệt `:30.2` (vedanā), `:40.2` dùng
