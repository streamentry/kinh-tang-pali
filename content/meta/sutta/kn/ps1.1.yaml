  BẤT ĐỊNH ĐÃ GHI, KHÔNG ĐƯA VÀO THÂN KINH. (1) Cặp thuộc phần an trụ / thuộc trú xứ và
  thuộc phần xuyên thấu / thuộc phần quán triệt cho ṭhitibhāgiya và nibbedhabhāgiya bị hoàn
  trên tầng; tôi chọn để bộ tứ trong an6.71 và dn34 đứng được. (2) Chữ `niddesa` ở `:1.0`
  bị bỏ theo dn22. (3) Dấu chú thích `[10]` ở :28.2, `[30]` ở :29.20 và `[5]` ở :30.5 là
  số chú thích in trong bản Pāli đã ghim, không phải thân kinh; tôi bỏ, vì toàn tầng Việt
  hiện có 0 khoá nào mang `[N]` và để lại một con số không kèm danh mục chú thích là vô
  nghĩa với người đọc. Nếu người biên tập muốn giữ dấu bộ phận, chỉ cần thêm lại ở ba
  khoá này. (4) Câu mở đầu của lát dùng thức dựng “Xét trong sự lắng tai nghe, …” để giữ
  dạng câu hỏi Kathaṁ … ṭṭhe của Pāli; đây là lựa chọn diễn đạt, không thêm nghĩa mới.

