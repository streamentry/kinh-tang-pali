notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên. Không có blocker.
  
  **Lỗi văn phong rõ nhất của lô: `1.3` — `vikkhīno` → *đã cùng đi*.** Pāli `vikkhīno` là quá khứ thể của `vikkhī` (√khi) = **hao mòn, mài mòn, mất hết**; trong ngữ cảnh luân hồi, `jātisaṁsāro` (luân hồi qua các kiếp) là điểm đến của nó. Cụm *đã cùng đi* không có nghĩa gì trong tiếng Việt và rõ ràng là dịch từng chữ — có lẽ từ chữ *đi* trong `samsāra` (luân hồi). Câu đọc lên không thành câu. Nhưng **ý thì không hỏng**, vì `1.2` (*các cõi hữu tích đều đã tuyệt diệt*) và `1.4` (*giờ đây không còn tái sanh nữa*) đã nói rõ kết cục, nên người đọc vẫn hiểu. Tôi trừ nhẹ ở `vietnamese_clarity` (9.0) và `semantic_fidelity` (9.3) chứ không chặn; đề xuất dịch lại là *đã khép lại* / *đã chấm dứt*.
  
  **Còn lại thì dịch tốt và giữ đủ cả bốn ý.** `Kilesā jhāpitā mayhaṁ` → *Các cấu uế của ta đã bị thiêu đốt* ✓ (`jhāpitā` = bị thiêu đốt, hành động của chính người tu, không phải của kẻ khác). `bhavā sabbe samūhatā` → *các cõi hữu tích đều đã tuyệt diệt* ✓ (`samūhatā` = đã bị diệt tận trọn vẹn, phủ định-có). `natthi dāni punabbhavo` → *giờ đây không còn tái sinh nữa* ✓ (`natthi` phủ định được giữ).
  
  **Bốn ý theo thứ tự, không lùi được:** cấu uế bị thiêu → các cõi hữu tích tuyệt diệt → luân hồi qua các kiếp khép lại → không còn tái sanh. Bản dịch giữ đúng cả bốn theo bốn khoá, kể cả khi vế `1.3` diễn đạt gượng. Đó là một điểm tốt: đội hình vẫn đúng dù có một vế vướng.
  
  **Ngôi một ở `1.1` là `ta`** (`mayhaṁ`). Đúng về nghĩa (đây là `ta` ngôi một theo tiền lệ tầng, xem `thag1.21`), nhưng thuộc nhóm thiểu số 7 so với *tôi* 30; lô này tự dùng lẫn hai dạng. Đã ghi ở `terminology`.
  
  **Sujato lệch chiều ở `1.3`–`1.4`** (Sujato đặt *transmigration through births is finished* ở `1.3` và *now there'll be no more future lives* ở `1.4` — chỗ này Sujato **khớp** Pāli; nhưng `1.1`–`1.2` Sujato ghép *burnt away by practicing absorption—* vào `1.1` trong khi Pāli `1.1` không có `jhāpita`). Bản dịch bám Pāli.
  
  **Tầng Anh** có mặt đủ bốn vế.
  
  **Tầng Việt**: không có Thích Minh Châu cho Trưởng Lão ở commit đã ghim.
