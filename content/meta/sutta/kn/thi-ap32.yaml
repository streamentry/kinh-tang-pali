  LƯỢT CẢI THIỆN 2026-10-13 — đọc đối kháng lại cả 178 cặp Pāli với Việt; đổi 5 khoá (4 khoá nội dung + 1 dấu câu), giữ nguyên tập khoá và thứ tự:
  - :30.4 (và dấu phẩy ở :30.3) — sửa chủ thể. Trước: "với Jaṭila, bậc Đại Mâu-ni." Đọc liền sẽ thành Jaṭila là Đại Mâu-ni, trong khi mahāmuni ở chủ cách là đồng vị của Padumuttara (:30.1) và Jaṭila ở sở hữu cách (jaṭilassa). Sau: ":30.3 đã nói lời tùy hỷ, / :30.4 bậc Đại Mâu-ni, cho Jaṭila." (cùng khuôn với thi-ap19:31.3–31.4 "đã nói lời tùy hỷ, / cho …"). Mục bất định cũ ở :30.3–:30.4 (đồng vị đặt sau Jaṭila) nay đã được giải quyết bằng thứ tự từ; ranh giới khoá giữ nguyên.
  - :25.4 — "họ đều đã chia phần như nhau" → "họ đều đã góp phần như nhau". Trước đây cụm "chia phần" đi với tân ngữ "cây cầu và tịnh xá" (:25.3) dễ bị đọc là chia nhau cây cầu, vô nghĩa; samabhāgaṁ akaṁsu ở đây là phần đóng góp bằng nhau của mọi người (phụ nữ, nam nhân, nhà cao sang lẫn thấp hèn), khớp với :26.3 (dāyādā, những người thừa kế) và :27 (mọi người cùng rải cát). Vẫn còn một cách đọc khác sát chữ hơn là "chia phần/chung phần như nhau"; chọn "góp phần" vì ngữ cảnh. 0 tiền lệ trong tầng (samabhāgaṁ chỉ còn ở pe7, nghĩa khác: cân bằng).
  - :32.4 — "tất cả sẽ gặp mặt trực tiếp" → "tất cả sẽ ở trước mặt vị ấy". Căn cứ: công thức Pāli hessāma sammukhā imaṁ (27 khoá của nhóm bv, cả 27 đều dịch "chúng ta sẽ ở trước mặt vị này", chỉ khác dấu câu cuối) trong lời thọ ký cho những người đã phụng sự vị sẽ thành Phật; ở thi-ap32 ngay khoá :31.4 nói vị ấy sẽ đạt giác ngộ, nên "vị ấy" là người vừa được thọ ký. Pāli ở đây lược tân ngữ (không có imaṁ) nên "vị ấy" lấy từ công thức song song chứ không từ khoá này; vẫn có cách đọc khác (gặp lại nhau, tức sammukhā như hình thức "đối diện nhau"; thi-ap30:43.4 te bhavissanti sammukhā dịch "họ sẽ gặp mặt trực tiếp", chưa đổi vì ngoài lát).
  - :7.1 — "lấy định làm cảnh giới" → "lấy định làm phạm vi hoạt động". Trước đây hai từ Pāli khác nhau (gocara ở :7.1 và padaṁ ở :8.3, cùng gần nhau) đều dịch "cảnh giới", dễ bị đọc như một. gocara ở các khoá khác trong tầng dịch phạm vi / chỗ hoạt động / lãnh vực hoạt động (ps1.0:16.1, ps2.3:23.2, pe8:141.2, tha-ap539:8.2); "cảnh giới" cho padaṁ ở :8.3 giữ theo amataṁ padaṁ (3 khoá).
  - Điểm đổi: grammar_logic 8.6 → 8.8 (đổi chủ thể ở :30.4, tân ngữ ở :25.4); semantic_fidelity 8.6 → 8.7 (:32.4 theo công thức song song, :25.4); terminology 8.8 → 8.9 (:7.1 tách gocara khỏi padaṁ, :32.4 đồng bộ với bv); vietnamese_clarity 8.8 → 8.9 (:25.4, :30.4 hết chỗ đọc sai). Các điểm khác giữ nguyên: triangulation vẫn 7.5 (không có bản Anh độc lập), ambiguity_integrity vẫn 8.8 (nhiều bất định thật chưa phân xử được, xem mục trên), technical_integrity vẫn 9.6.
