    nīca) nghĩa là cao và thấp, như ở :25.2 của bài này (uccanīcakulāni, gia đình cao sang lẫn
    thấp hèn); cần xem lại thi-ap31 ở chỗ có uccanīca.
  - thi-ap31:9.2 và thi-ap33:14.2 paccayaṁ sayanāsanaṁ → chỗ ngồi, chỗ nằm để dựa (xem mục
