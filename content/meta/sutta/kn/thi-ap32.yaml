notes: |-
  Bài kinh thi-ap32 — Caturāsītibhikkhunīsahassaapadāna, bài thứ hai của Phẩm Khattiya
  trong Therīapadāna. 178/178 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào
  ngoài tập khoá Pāli. Bài là lời tám mươi tư ngàn vị ni vốn là thiếu nữ Bà-la-môn thưa với
  Đức Phật rằng các vị đã diệt hết phiền não và xin được vào tịch diệt; Đức Phật cho phép, các
  vị thị hiện thần thông cho bốn chúng thấy, rồi kể lại nhân xa xưa: thời Đức Padumuttara, một
  viên quan tên Jaṭila xây cầu bắc qua sông Hằng và một tịnh xá cho Tăng đoàn, mọi người cùng
  góp công, Jaṭila nguyện giác ngộ và được thọ ký; nhờ phước ấy các vị luân chuyển trong cõi
  trời và cõi người, đời cuối sinh trong gia đình Bà-la-môn rồi xuất gia, đắc các vô ngại giải.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt:
  - :0.1 Therīapadāna giữ nguyên Pāli: 29 khoá cùng dạng so với 1 khoá dịch là Trưởng Lão Ni
    Ký Sự.
  - :0.2 Khattiyāvagga → Phẩm Khattiya (9 khoá cùng dạng, 0 dạng khác).
  - translationTitle bằng đúng giá trị :0.3 từng ký tự.
  - Số thứ tự ở :0.3: Pāli :0.3 bắt đầu bằng số (2) nên :0.3 Việt giữ số, dạng 2. Quy tắc
    của phẩm: giữ số khi và chỉ khi Pāli có số. Đo trên các tệp thi-ap đã có (không tính bài
    này) mà Pāli :0.3 bắt đầu bằng số: 8 giữ số, 6 bỏ số, 0 tệp thêm số ở chỗ Pāli không có.
  - Công thức tiêu đề, đo hai phạm vi: trong thi-ap (đếm trên :0.3 của các tệp đã có) Tuyên Ngợ
    28, Tuyên Ngôn 1, Ký Sự 0; trong tha-ap Tuyên Ngợ 255, Ký Sự 144, Tuyên Ngôn 138 (thêm
    Tuyên Ngợi 10, Kinh Kệ 5). Cả hai phạm vi cùng cho Tuyên Ngợ là đa số nên bài này giữ
    Tuyên Ngợ cho khớp; đó nhiều khả năng là lỗi chính tả của Tuyên Ngôn, và nếu người biên tập
    xác định như vậy thì cần sửa hàng loạt cả cuốn chứ không sửa riêng bài này (cùng chữ còn ở
    :46.1 của bài này, dễ tìm để sửa).
  - Tên nhóm ni dịch nghĩa theo hợp từ Pāli (Caturāsīti + bhikkhunī + sahassa) → Tám Mươi Tư
    Ngàn Tỳ-kheo-ni, theo thi-ap29 (Mười Ngàn Tỳ-kheo-ni). Khoá cuối :46.1 theo mẫu của các bài
    kề cận, tên bài bỏ số rồi thêm thứ N (dutiyaṁ → thứ hai).
  - :45.1 dùng công thức đa số Tôi nghe như vầy: … đã nói những bài kệ này (407 khoá so với 21
    khoá bài kệ này); imā gāthāyo là số nhiều. brāhmaṇakaññābhikkhunī dịch tỳ-kheo-ni thiếu nữ
    Bà-la-môn (kaññā là thiếu nữ, khác dhītā ở :5.1 dịch con gái).

  SỐ PĀLI — tự tính, in phép:
  - :1.1 Cullāsītisahassāni = cullāsīti 84 + sahassa 1000 = 84.000 → tám mươi tư ngàn.
    cullāsīti là dạng rút của caturāsīti (catu 4 + asīti 80 = 84); lớp Pāli ghim tự xác nhận
    vì :0.3 và :45.1 của chính bài này đều nói caturāsīti…sahassa. Đo Pāli Cullāsītisahassāni
    trong tầng: tám mươi tư 6 khoá (tha-ap113, 193, 326, 431, 452, 489), tám mươi bốn 1 khoá
    (thig3.5), và 1 khoá lệch là tha-ap292:1.1 viết Tám mươi sáu nghìn (= 86.000, sai; không
    sửa vì ngoài lát, xem mục lỗi ngoài lát). Dùng tám mươi tư theo đa số, nhất quán cả :0.3,
    :1.1, :45.1, :46.1.
  - satasahassa = sata 100 × sahassa 1000 = 100.000 → một trăm ngàn (:20.1, :24.1, :31.1,
    :35.1). Đơn vị lớn dùng ngàn theo đa số của phẩm (xem các bài thi-ap31, thi-ap33).
  - :22.1–22.3 divasaṁ dve tayo = một, hai, ba ngày; sattāhaṁ = bảy ngày; māsikaṁ = một
    tháng; catumāsa = catu 4 + māsa = bốn tháng.
  - :2.3 Cātuddīpā = bốn châu lục; :9.3 catunnaṁ = của bốn; :44.1 catasso = bốn (bốn vô ngại
    giải); :41.4 sahassāni = hàng ngàn; :46.1 dutiyaṁ = thứ hai.
  - Pāli không có Tiṁsakappasahassa hay cụm số nào chưa phân xử được. Phép kiểm số tự động chỉ
    nhận chín từ khoá đã xác lập; không từ nào trong số đó có mặt ở bài này, nên phép đo đó
    chạy rỗng (hiệu chuẩn 9/9 OK, nhưng 0 cần, 0 đo được), không phải pass.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò toàn tầng kn, dn, mn, sn, an:
  - Trong 178 khoá, 49 khoá có Pāli trùng byte với khoá của bài khác. 35/49 dùng lại nguyên
    văn một bản Việt đã có; 9/49 chỉ có các khoá trùng chưa dịch (không có tiền lệ); 5/49
    khác bản đã có, lý do từng chỗ:
    - :1.1 Cullāsītisahassāni: bản đã có là Có tám mươi tư ngàn (tha-ap193), Tám mươi tư ngàn,
      và Tám mươi sáu nghìn (sai). Thêm người cho có danh từ, vì ở đây số đứng đầu cả mệnh đề.
    - :1.2, :5.2 brāhmaññakulasambhavā: bản đã có (tha-ap) là con sinh ra trong gia đình
      Bà-la-môn, trong đó con là người kể; ở đây không có ngôi ấy nên bỏ con (0 ngôi thứ nhất
      trong cả hai khoá Pāli).
    - :18.4 tuyhatthāya mahāmune: thi-ap31 (:2.4, :3.4) dịch vì hạnh của Đấng Đại Mâu-ni; Pāli
      là tuyhatthāya (vì Ngài), không có từ hạnh; dùng vì Ngài, bạch bậc Đại Mâu-ni, theo
      :15.3 của thi-ap33 (Tuyhatthāya mahāvīra → Vì Ngài, bạch bậc Đại Anh Hùng).
    - :26.3 Tassa dhammesu dāyādā: bản đã có là Người kế thừa giáo pháp của Ngài (5 khoá,
      tha-ap, tassa là Đức Phật); ở đây tassa là Jaṭila (:25.3) nên không dùng giáo pháp của Ngài.
  - Trong chính bài này có 6 nhóm Pāli trùng nguyên văn (:1.2/:5.2, :1.3/:37.3, :1.4/:2.4,
    :20.1/:35.1, :21.4/:22.4, và ba khoá …pe… :42.2/:43.2/:44.2); cả sáu nhóm Việt giống hệt nhau
    trong từng nhóm, 0 cặp lệch. Các cặp chỉ khác dấu cuối khoá (ví dụ :23.4 và :24.2 setuṁ
    gaṅgāya kārayi) không tính là trùng; Việt chỉ khác nhau ở dấu cuối.
  - Các chỗ chọn giữa hai dạng đã có (đo ở phạm vi gần nhất, thi-ap và tha-ap, rồi toàn tầng):
    - :42.1 Kilesā jhāpitā amhaṁ: tầng có 215 khoá Kilesā jhāpitā…, đa số 139 viết Các phiền
      não của ta đã được thiêu rụi; thi-ap29 viết Các phiền não của chúng tôi đã được thiêu
      rụi (cùng Pāli amhaṁ), còn thi-ap31 viết Các phiền não đã thiêu rụi chúng tôi (đọc
      phiền não là chủ ngữ, jhāpitā là chủ động). Chọn dạng của thi-ap29, vì jhāpita là phân từ
      quá khứ bị động và amhaṁ là cách chỉ tác nhân (chúng tôi đã thiêu), theo cùng cấu trúc với
      mayhaṁ của 139 khoá đa số.
    - :43.1 Svāgataṁ vata no āsi: 206 khoá Svāgataṁ vata…, đa số 135 Thật lành thay sự đến của
      ta; thi-ap29 viết của chúng tôi; no → chúng tôi.
    - :16.4 natthi dāni punabbhavo: trong thi-ap, tái sanh 13 so với tái sinh 1; dùng tái sanh.
    - :37.1 Pacchime bhave sampatte: 14 khoá, 12 viết Khi đời sống cuối cùng đã đến; dùng dạng ấy.
    - :20.1 và :35.1 Satasahassito kappe: đo trong thi-ap và tha-ap, Vào một trăm ngàn đại kiếp
      trước 33 khoá (trong thi-ap: thi-ap9, 14, 15), Vào một trăm ngàn kiếp trước đây 12, Vào một
      trăm ngàn kiếp trước 6, Sau một trăm ngàn kiếp nữa 11, Vào một trăm ngàn kiếp nữa 4,
      khác 2. Chọn Vào một trăm ngàn kiếp trước (6 khoá, cùng nghĩa) thay cho dạng đa số có chữ
      đại, vì Pāli là kappe (kiếp), không có mahā; vì thi-ap29 và thi-ap33 đều dịch kappa là
      kiếp; và để cùng một đơn vị với :31.1 (Sau một trăm ngàn kiếp nữa). Đây là chỗ lệch đa số
      có chủ ý, người biên tập có thể chuẩn hoá cho cả tầng.
    - :41.2 paccayaṁ sayanāsanaṁ: 18 khoá cùng Pāli; chỗ ngồi, chỗ nằm để dựa 4 khoá (pv22 hai
      khoá, thi-ap31, thi-ap33), vật dụng, chỗ nằm chỗ ngồi 2 khoá (bv14, tha-ap397), 2 khoá dạng
      khác. Chọn dạng sau (không phải đa số): paccaya là vật dụng cần thiết (một trong bốn vật
      dụng, đứng riêng trước sayanāsana), và dạng đầu bỏ paccaya và đảo thứ tự chỗ nằm–chỗ ngồi.
      Đây là chỗ lệch đa số có chủ ý; xem mục lỗi ngoài lát.

  THUẬT NGỮ — kèm số đếm:
  - mahāvīra → Đại Anh Hùng (Đại Anh Hùng 100 khoá trong tầng); mahāmune, mahāmuni → bậc Đại
    Mâu-ni (113 khoá); muni gọi một mình → bậc Mâu-ni (88 khoá Mâu-ni, 17 ẩn sĩ); vocative lời
    thưa với Đức Phật đi kèm bạch, theo thi-ap33.
  - satthā → Đạo Sư (283 khoá); vināyaka → Điều Ngự (32 khoá, 3 Hướng Đạo); sambuddha → Chánh
    Đẳng Giác (320 khoá, 45 Toàn Giác); lokanātha → Lãnh Đạo thế gian (13 khoá, 10 Bảo Hộ, 2 Hộ
    Trì). cakkhuma → bậc có mắt sáng (snp1.2:14.3 có mắt sáng).
  - iddhi dassenti → thị hiện thần thông (thị hiện 111 khoá trong tầng, dn24 dùng cho
    iddhipāṭihāriya; cho thấy/chỉ ra là dạng cho dasseti không gắn thần thông).
  - vessa, sudda → Phệ-xá, Thủ-đà-la (ud5.5:22.2 và 22.3, cnd20:14.1 dạng Phệ-sa, Thủ-đà); bốn
    châu lục (tha-ap428, cp12); nāga giữ Pāli (34 khoá so với rồng 22 khoá); kinnara giữ Pāli
    (11 khoá kinnara và 1 khoá Kinnara trong nhóm kn, chưa thấy dạng dịch nghĩa).
  - Tên cõi: Tāvatiṁsa → cõi trời Ba mươi ba (thi-ap33; Ba mươi ba 100 khoá so với Tāvatiṁsa
    3 trong nhóm kn); Yāma → Dạ-ma (3 khoá so với Yāma 2); Tusita → Đâu-suất (35 so với 8);
    nimmite deve và vasavattī là dạng rút của Nimmānaratī và Paranimmitavasavattī (Hóa Lạc 5,
    Tha Hóa 3 khoá); dịch chư thiên Hóa Lạc và chư thiên Tự Tại, không thêm Tha Hóa vì Pāli không có.
  - vihāra → tịnh xá (trong kn gần: tịnh xá 9, trú xứ 7, tu viện 5, chỗ ở 3, tinh xá 3).
  - bhavanetti → dây dẫn đến hữu (iti44:5.4, :6.2); padaṁ trong sududdasaṁ padaṁ → cảnh giới
    (amataṁ padaṁ → cảnh giới bất tử: bv21:35.2, tha-ap20:4.4, tha-ap64:1.4); anusaya → tùy
    miên (snp3.6, snp3.7); dālita → đập tan (snp3.6:50.2 padālitā → đập tan); puññasaṅkhāra
    → phước hành (0 tiền lệ trong tầng đã dịch; có cnd8:77.5 puññābhisaṅkhāra nhưng chưa dịch).
  - suññatā → tính không (toàn tầng 38 so với tánh không 22; trong kn 1 so với 2); chọn đa số
    toàn tầng, người biên tập có thể chuẩn hoá.
  - adhikāra → việc phụng sự (mil5.1.1 dịch việc phụng sự); anumodanīya → lời tùy hỷ (an5.44
    dịch lời tùy hỷ); nimantetvā → thỉnh mời (bv21, bv23, tha-ap4); mahādāna → đại thí (8 khoá);
    kāraṁ katvāna satthuno → tỏ lòng tôn kính (1 khoá cùng Pāli).
  - 0 tiền lệ trong tầng, đã dịch theo nghĩa Pāli và ghi lý do ở đây: sattasāro → bậc tinh hoa
    của chúng sinh (sattasāra là tinh hoa, phần cốt lõi của chúng sinh; tên Jaṭila đi kèm nāma
    ở :23.2 nên sattasāro đọc là tính ngữ chứ không phải tên); paribhaṇḍa → vòng bao quanh
    (đứng sau Sineru; trong Pāli ghim chỉ còn một chỗ khác là mnd14:147.2 saparibhaṇḍaṁ, chưa dịch); pārichattaka
    → cây Pārichattaka (giữ Pāli; bv16:10.2 và bv19:11.2 dịch hoa pāricchattaka, nhưng đó là
    danh sách hoa, ở đây Pāli chỉ có một từ); mahāraha →
    vô cùng quý giá; kadalī → cây chuối (cp22:4.4 kadaliṁ); puṇṇaghaṭa → bình đầy;
    sukhumālī → mềm mại; samabhāgaṁ akaṁsu → chia phần như nhau.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - :1.4 và :2.4 pure tuyhaṁ: pure là trước đây, tuyhaṁ là của Ngài; dịch trước đây thuộc về
    Ngài. Cách đọc khác là trước mặt Ngài (pure + sở hữu cách là trước); chọn trước đây vì
    :33.4 (tuyhaṁ tā paricārikā) và :34.3 (tuyhaṁ te) cùng nói họ thuộc về Ngài.
  - :3.2 sabbadassāvino bahū: sabbadassāvī là người thấy tất cả; chỉ gặp trong cnd, mnd, ps1.3
    như tính chất của Đức Phật (sabbadassāvitāya buddho). Dịch sát chữ nhiều vị thấy tất cả, không
    thêm biết hay thấy chân lý; nghĩa kỹ thuật có thể là cái thấy trọn vẹn.
  - :3.4 phusissanti: không có tân ngữ trong Pāli; dịch sẽ chứng đạt, không nói chứng đạt gì.
  - :9.2 dīgharattaṁ katāvino: katāvino ở số nhiều có thể đi với tumhe (các ngươi đã làm từ
    lâu) hoặc với mamaṁ (với ta, người đã thực hành lâu dài); chọn cách đầu, vì upakārā tumhe ở
    :9.1 là danh từ số nhiều cùng chủ ngữ.
  - :9.3 catunnaṁ saṁsayaṁ: catunnaṁ là của bốn, danh từ không có trong Pāli; dịch nghi hoặc
    của bốn chúng vì ngay sau đó các vị ni thị hiện thần thông (:10–:14) để làm cho nghi hoặc của
    các chúng tan; cách đọc khác là nghi hoặc về bốn (chân lý) ít hợp ngữ cảnh hơn.
  - :8.3–:8.4 Sududdasaṁ padaṁ gantvā, anujānātha: gantvā là phân từ hoàn thành nhưng đi với
    anujānātha (xin cho phép) nên có nghĩa chúng tôi muốn đi; dịch đi đến cảnh giới rất khó
    thấy, xin Ngài cho phép, không thêm để và không thêm sau khi.
  - :6.1 upāhatā: dạng kéo dài của upahata (bị hủy hoại, bị phá hại); :6.2 mūlataṇhā là ái gốc
    rễ (ái là gốc rễ, hoặc ái ở gốc); chọn nghĩa sát hợp từ.
  - :7.1–:7.2 samādhigocarā, samāpattivasī katā: gocara là phạm vi hoạt động; vasī katā là đã
    trở thành bậc làm chủ (vasī). Dịch sát, không thêm sở hữu của ai.
  - :11.3 Sineruṁ paribhaṇḍañca: chưa xác định được paribhaṇḍa (vòng bao quanh hay phần bên dưới);
    chỉ dịch từ Pāli, người đọc cần chú giải.
  - :12.3–:12.4 nimmite deve, vasavattī mahissare: mahissare là các bậc đại chủ tể, đọc đi
    với vasavattī (chư thiên Tự Tại); cách đọc khác là cả hai nhóm Hóa Lạc và Tự Tại đều là đại chủ tể.
  - :13.1–:13.2 Brahmāno kāci dassenti, caṅkamañca mahārahaṁ: dịch hai tân ngữ riêng (các Phạm
    thiên, và con đường kinh hành quý giá); cách đọc khác là con đường kinh hành quý giá của
    Phạm thiên (brahmāno đọc là sở hữu cách số ít).
  - :13.4 dhammaṁ desenti suññataṁ: suññataṁ là tính không (danh từ) hoặc trống rỗng (tính từ);
    chọn thuyết pháp về tính không.
  - :18.2 saṅgamaṁ no nidassitaṁ: nidassita là được chỉ ra, được nêu; no là của chúng tôi hoặc bởi
    chúng tôi; Pāli không nói ai chỉ ra nên dịch bị động không nêu tác nhân (cùng câu ở thi-ap28:32.2
    có te thay no).
  - :23.1 sattasāro: xem mục thuật ngữ; nếu là tên riêng (Sattasāra) thì Jaṭila là tên thứ hai;
    Pāli có nāma ở :23.2 nên chọn tính ngữ.
  - :26.3 Tassa dhammesu dāyādā: dhammesu là trong các pháp; dịch sát chữ những người thừa kế
    trong các pháp của vị ấy; dhammesu có thể mang nghĩa các việc làm, các nguyên tắc của vị ấy
    chứ không nhất thiết giáo pháp. Không thêm nghĩa.
  - :28.1–:29.4 là một câu có chủ ngữ ngôi thứ nhất số ít (abhipatthayiṁ, :29.4 ta đã nguyện cầu)
    chung cho cả chuỗi phân từ :28.1–:29.3; trong khi :23–:27 kể về Jaṭila và dân chúng ở ngôi thứ
    ba, và toàn bài là lời của nhóm ni ở ngôi thứ nhất số nhiều. Pāli không chỉ rõ người nói ở
    :29.4; dịch đúng ngôi của Pāli (ta), không đổi sang ngôi thứ ba hay số nhiều.
  - :30.3–:30.4 anumodanīyaṅkāsi, jaṭilassa mahāmuni: mahāmuni là chủ cách (Padumuttara), không
    phải của Jaṭila; bản Việt đặt Đại Mâu-ni liền sau Jaṭila như đồng vị vì giữ ranh giới khoá,
    nhưng chủ thể của anumodanīyaṁ akāsi vẫn là Padumuttara (:30.1).
  - :31.2 kappo hessati bhaddako: dịch một kiếp tốt lành; đây là kiếp Bhadda (Hiền Kiếp), tên
    riêng của kiếp hiện tại theo truyền thống; không đưa tên truyền thống vào thân kinh. Tầng đã
    dịch chưa có tiền lệ cho tên này.
  - :31.1 Satasahassātikkante: đơn vị của một trăm ngàn không có trong khoá này; ở :20.1 và :35.1
    cùng số là kappe, và :31.2 có kappo, nên dịch kiếp. Dịch sau … nữa vì đây là lời thọ ký
    về tương lai (hessati, pāpuṇissati).
  - :31.4 pāpuṇissati bodhiyaṁ: bodhiyaṁ ở vị trí cách, nghĩa là đạt đến giác ngộ hoặc đạt ở cây
    giác ngộ; chọn đạt đến giác ngộ.
  - :32.4 sabbā hessanti sammukhā: sammukhā là đối mặt, trực tiếp; Pāli không nêu đối mặt với ai
    (với nhau, hay với vị sẽ giác ngộ); dịch sẽ gặp mặt trực tiếp, không nêu tân ngữ.
  - :34.1–:34.3 dibbasukhaṁ…asaṅkhiyaṁ… paricārema: paricārema là thọ hưởng (paricāreti dùng cho
    hưởng dục lạc), hai cụm dibbasukha và mānusa là tân ngữ; tuyhaṁ te là chúng tôi, những người
    thuộc về Ngài. Cách đọc paricāreti là hầu cận cũng có (paricārikā ở :33.4 là các nữ hầu cận).
  - :35.2, :36.4 sukataṁ kammasampadaṁ: sampadā là sự thành tựu; dịch sự thành tựu nghiệp đã
    khéo làm, không đoán là nghiệp thiện hay quả.
  - :38.2 na laṅkataṁ: na + alaṅkataṁ rút còn laṅkataṁ (không được trang hoàng); đọc na laṅkataṁ
    là chưa được trang hoàng; cách đọc khác là laṅkata (được trang hoàng) bị phủ định theo khoá
    trước, ít hợp ngữ cảnh.
  - :39.2–:39.3 sakkāraṁ sabbakālikaṁ, upanenti sadā sabbaṁ: chủ ngữ của upanenti không có trong
    Pāli; dịch họ.
  - :41.2 paccayaṁ: xem mục lệch đa số; vật dụng ở đây có thể chỉ thuốc men (một trong bốn vật
    dụng), nhưng không thêm.

