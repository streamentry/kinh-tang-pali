notes: |-
  Dịch trọn 906 khoá từ Pāli root, đủ khoá, đúng thứ tự: 3 khoá tiêu đề (:0.1, :0.2, :0.3), 55 khoá tiêu đề mục đánh số (:N.0, giữ nguyên số vì Pāli đã có số), 846 vế kệ của 207 khổ (trong đó 9 khổ sáu vế có 18 khoá :.5 và :.6), lời kết 208.1 và dòng ghi tên bài 209.1. Không khoá nào ngoài tập khoá Pāli. Đây là bài kể về người gác cổng ở thành Haṁsavatī thời Đức Phật Padumuttara, thắng vụ phân xử với vua Ānanda để được thỉnh Đức Phật, bố thí một trăm ngàn lọng, vải, bát cùng nhiều loại vật dụng khác, rồi nêu lợi ích của từng vật (46 mục từ 1.8.1 đến 1.8.46), nên danh sách vật dụng dày và có nhiều từ chuyên dụng hiếm.
  English và đối chiếu: không có bản Anh của Sujato cho tha-ap393 (kiểm theo danh sách tệp đã ghim: chỉ có tệp Pāli root của uid này; tệp tên tha-ap-name chứa mục tha-ap393 để trống), không có lớp english-project (không có tệp tha-ap nào), tầng vietnamese-current chỉ có Pháp Cú; do đó coverage English đo được: mẫu số 1 khoá (208.1, 65 ký tự; mọi khoá khác dưới 40 ký tự hoặc là khoá :0.x), Sujato phủ 0 trên 1, và cổng coverage không đo được gì ở 905 khoá còn lại. Có một bản dịch Việt toàn văn không phân đoạn (Bhikkhu Indacanda, qua SuttaCentral, đã khai ở mục tra cứu toàn văn, giấy phép NOASSERTION) được tham khảo để hiểu cú pháp các danh sách vật dụng sau khi đã dịch xong bản nháp từ Pāli; không sao chép câu nào, và vì không phân đoạn nên không tính là một tầng đối chiếu ở mức khoá. Vì vậy triangulation 7.5 (không quá 8.0), bài giữ draft kèm blocker, không nâng điểm để né blocker.
  Tên bài: translationTitle bằng đúng :0.3, là Ký Sự Về Trưởng Lão Pilindavaccha; Pāli :0.3 (Pilindavacchattheraapadāna) không bắt đầu bằng số nên không có số thứ tự. Mở đầu tên bài: ở phạm vi gần (tha-ap380 đến tha-ap410) Ký Sự Về 22, Bài Kệ Tuyên Ngợ 7; toàn tầng Bài Kệ Tuyên Ngợ 238 (cộng 15 khoá có số), Ký Sự Về 155, Bài Kệ Tuyên Ngôn 143; chọn Ký Sự Về theo phạm vi gần và theo 9 trên 9 bài cùng phẩm đã dịch (tha-ap394 đến tha-ap402), cần biên tập phán một lượt cho cả cuốn. Tên phẩm :0.2 là Phẩm Pilindavaccha theo 9 trên 9 bài cùng phẩm đã dịch. Dòng ghi tên bài 209.1 viết Ký sự về Trưởng lão Pilindavaccha, thứ nhất: toàn tầng Ký sự về 88, Ký Sự Về 67; trong phẩm này 7 trên 9 bài đã dịch dùng chữ thường (tha-ap396 đến tha-ap402), 2 bài dùng chữ hoa (tha-ap394, tha-ap395); dòng này vì vậy khác kiểu viết hoa so với :0.3, giống các bài liền kề.
  Lời kết 208.1: Pāli Itthaṁ sudaṁ āyasmā pilindavaccho thero imā gāthāyo abhāsitthāti không có chữ nghe, nhưng quy ước tầng là Tôi nghe như vầy: (558 trên 560 khoá có Itthaṁ sudaṁ mở đầu bằng dạng này; ở phạm vi gần 29 trên 30 khoá dùng thêm những bài kệ này), nên giữ quy ước và ghi vào đây; imā gāthāyo là số nhiều nên dùng nhóm những bài kệ này (554 khoá) chứ không dùng nhóm số ít bài kệ này (2 khoá, nhóm đã bị coi là lỗi ở các lát trước).
  Ngôi kể: người kể là tôi (khoá Kilesā jhāpitā mayhaṁ: toàn tầng ta 135, tôi 58, con 3; riêng chín bài cùng phẩm tha-ap394 đến tha-ap402: tôi 6, ta 3; chọn tôi theo phạm vi gần và theo bài kề cận trước đó). Đức Phật Padumuttara tự xưng là Ta (70 đến 85), đức vua Ānanda xưng ta và gọi người bạn là ngươi (31, 33, 35, 37, 39, 46, 48), vị gác cổng gọi vua là bệ hạ hoặc ngài, các quan toà (akkhadassā) xưng chúng tôi. Nháy theo Pāli từng khoá: nháy kép mở ở 1.1 và đóng ở 207.4 (một cặp bao toàn bài); nháy đơn mở rồi đóng ở 3.1 đến 8.4, 29.1 đến 30.4, 31.1 đến 31.4, 32.1 đến 34.4 (chạy qua ba khoá, người nói đổi từ vị gác cổng sang vua ở 33.1 rồi lại sang vị gác cổng ở 34.1), 35.1 đến 35.4, 36.1 đến 36.4, 37.1 đến 37.4, 38.1 đến 38.4, 39.1 đến 39.4, 40.1 đến 40.4, 42.1 đến 43.4, 44.1 đến 45.4, 46.1 đến 46.4, 47.1 đến 47.4, 48.3 đến 48.4, 49.1 đến 49.4, 52.1 đến 52.4, 55.3 đến 58.4, 64.1 đến 64.4, 70.1 đến 85.4; bản Việt khớp đúng, 0 lệch trên 906 khoá. Dấu lược: Pāli không có dấu lược nào (0 khoá có …pe… hoặc …), bản Việt cũng 0. Dấu hai chấm đặt trước lời nói ở 2.4, 5.2, 28.6, 41.4, 48.2, 51.4, 55.2 dù Pāli kết bằng dấu chấm hoặc chấm phẩy.
  Tiền lệ đã đo: 218 khoá có Pāli trùng nguyên văn (bỏ dấu câu, hoa thường) với khoá đã dịch ở nơi khác trong tầng tha-ap, tổng 3.693 lần xuất hiện; 107 khoá dùng lại nguyên văn một dạng đã có; 111 khoá khác tiền lệ có chủ ý, phần lớn vì ngôi kể tôi thay cho ta, và Aṭṭhānisaṁse anubhomi dịch tôi thọ hưởng tám điều lợi ích (tiền lệ 1 khoá: Ta thọ hưởng tám điều lợi ích). Không chép mù: mọi khoá Pāli trùng đều đã đối chiếu lại với Pāli trước khi dùng lại. Trong chính bài có 67 nhóm Pāli trùng nguyên văn (1.270 cặp); 7 nhóm có bản Việt khác nhau, trong đó 6 nhóm chỉ khác chữ hoa đầu câu hoặc dấu cuối câu (91.4 kết dấu phẩy dù Pāli kết dấu chấm vì câu còn tiếp ở 92.1; 18.3 và 162.1; 90.3, 100.1 và 141.3; 102.1 và 129.3; 107.1 so với 11 khoá còn lại trong nhóm Pañcānisaṁse anubhomi; 153.1 và 159.3) và 1 nhóm khác chủ thể (71.3, 73.3 là chúng, 76.3 là họ vì chủ thể là các người nữ ở 75.2).
  Số Pāli, mỗi phép tính đã kiểm: satasahassa là sata 100 nhân sahassa 1.000 là 100.000 (9.3, 10.1, 10.3, 52.1, 60.1, 62.3, 63.3, 64.1, 64.2, 91.3, 96.1; 82.1, 86.1, 174.1 là một trăm ngàn kiếp); cullāsītisahassa là 84.000 (68.3); saṭṭhi 60 nhân sahassa là 60.000 (73.1, 74.1); chaḷāsīti là cha 6 cộng asīti 80 là 86, nhân sahassa là 86.000 (75.1); tiṁsakappasahassāni là tiṁsa 30 nhân kappasahassa là ba mươi ngàn kiếp (77.1, theo người biên tập tiṁsa là 30 và cùng đáp số với bản đối chiếu toàn văn; lưu ý brief phẩm cũ ghi 3); saṭṭhisatasahassāni là 60 nhân 100.000 là 6.000.000 (143.3); sahassakkhattuṁ là một ngàn lần (77.3, 78.1); sattarattindivaṁ là bảy đêm ngày (67.1) và sattame divase là ngày thứ bảy (69.1); các số lợi ích aṭṭha 8, dasa 10, pañca 5, tīṇa 3, cha 6, dva 2 ở 89.3, 94.3, 98.3, 104.1, 107.1, 109.3, 112.3, 114.3, 118.3, 121.3, 123.3, 125.3, 127.3, 132.3, 136.3, 140.3, 142.3, 147.3, 149.3, 151.3, 155.3, 156.3, 158.3, 160.3, 162.3, 166.3, 170.3, 172.3, 175.3, 180.3, 187.3, 189.3, 191.3, 193.3, 195.3, 199.3 (bốn quả), 200.3, 202.3; aṭṭhamaṁ guṇaṁ là đức thứ tám và đúng tám đức ở 171.1 đến 171.4 (đức tin, giới, hổ thẹn, ghê sợ tội lỗi, học rộng, xả thí, nhẫn nại, trí tuệ); āyupañcamakaṁ là tuổi thọ thứ năm trong năm điều ở 192.1 đến 192.4; catu 4 ở 71.2, 165.1, 182.2, 199.3, 174.2 (caturassakā bốn cạnh); chaḷabhiññā là sáu thắng trí, catasso paṭisambhidā là bốn vô ngại giải, aṭṭha vimokkhā là tám giải thoát, tisso vijjā là ba minh (206.3, 207.1 đến 207.3); pañcavaṇṇehi là năm màu (17.3, 130.3). Không có ekanavuti hay các số kiểu navuti trong bài.
  Đã kiểm theo gợi ý họ Therāpadāna: tên riêng và danh từ chung (Padumuttara, Paduma, Ānanda, Pilindavaccha là tên; Haṁsavatī là tên thành chứ không phải chim haṁsā; naḷakāre, māṇavo, dovāriko là danh từ chung), caṅkame ở 185.1 dịch kinh hành, pattamadāsahaṁ ở 66.2 dịch đã dâng, anāsava dịch không còn lậu hoặc (51.2, 101.4, 205.4), Sumutto saravegova dịch như tốc lực của mũi tên khéo buông (86.3), satthā ở 82.4 dịch bậc Đạo Sư (danh hiệu), Kappasatasahassamhi ở 82.1 dịch sau một trăm ngàn kiếp nữa (thọ ký tương lai); bài này không có kuñjara, saḷala, jātassara, mukhatuṇḍena, haṁsā (chim), bījanī, apothayi, hay -luddo.
  Bất định và lựa chọn cần người biên tập lưu ý: (1) 17.2 dhammakuttarā dịch bình lọc nước (dhammakaraṇa là bình lọc nước trong luật tạng; dạng dhammakuttarā có thể là chép lệch); 118.2 dhammakaruttame hiểu là bên nhận theo khuôn datvā saṅghe gaṇuttame ở các khổ kề (các bậc tối thượng thực hành Pháp) và tiêu đề 118.0 Parissāvana-dhammakara dịch theo cách hiểu đó; cách hiểu khác là vật dâng (bình lọc nước loại tối thượng), như tiêu đề có vẻ gợi ý. (2) 17.3 và 17.4 Kuñcikā pañcavaṇṇehi sibbite kuñcikāghare: pañcavaṇṇehi ở cách công cụ, có thể bổ nghĩa cho việc khâu túi (khâu bằng năm màu) thay vì cho chìa khóa; 130.3 pañcavaṇṇehi dāyādo dịch sát chữ, không phân xử được. (3) 18.3 và 162.1 tumbaka dịch bình bầu, có thể là vật đo lường (tumba); 164.2 samāva calanā dịch cử chỉ bình ổn; 165.1 caturo vaṇṇe dịch bốn loại màu sắc, có thể là bốn giai cấp; 163.2 tathāgati dịch có nẻo đi tốt đẹp, chưa phân xử được. (4) 138.1 asatthake dịch gỗ asattha theo cách quen (assattha là cây đa Bồ-đề), không chắc; 181.1 padumake dịch gỗ padumaka. (5) 145.1 Niyāmaṁ sati dhāvanti: sati chưa dịch riêng, dịch chúng chạy theo con đường nhất định; 145.2 āguācārasodhanaṁ dịch làm thanh lọc hạnh kiểm tội lỗi. (6) Tên vật dụng khó: 14.1 paribhogabhājane, 19.2 malahāraka (dụng cụ lấy chất dơ), 20.2 caturomaye (làm từ bốn thứ), 22.1 kuruvinde (đá kỳ cọ), 22.3 sipāṭiphalake, 23.3 āṭalī (tăm xỉa răng), 26.3 biḷaṅgaloṇaṁ pahūtañca (pahūta có thể bổ nghĩa cả hai vật), 177.1 vikatikāyo, 177.2 kaṭṭissā, 178.2 mudukājinaveṇiyo: dịch theo nghĩa quen, không chắc chi tiết. (7) 9.2 kāresi và 15.4 pūresi có dạng ngôi ba nhưng chủ thể là người kể, dịch ngôi nhất. (8) 34.2 gajjitaṁ dịch tuyên hứa (nghĩa gốc là gầm, tuyên bố hùng hồn); 34.3 và 34.4 sabbadhamme dịch mọi pháp; 36.4 vajjaṁ me māhu jīvitaṁ dịch xin đừng để đời sống của tôi thành điều đáng chê trách. (9) 31.4 Mamādheyyaṁ sace tuvaṁ: tuvaṁ chưa dịch riêng. (10) 60.4 satamagghati dịch có giá trị hơn một trăm (Pāli không nêu đơn vị). (11) 63.1 Dhārentaṁ uparicchattaṁ dịch có chiếc lọng được giữ ở phía trên. (12) 78.3 padesarajjaṁ dịch theo tiền lệ 29 khoá; 79.3 devalokapariyantaṁ dịch cho đến tận cùng cõi trời; 81.4 brahmabandhu dịch người thuộc dòng Bà-la-môn. (13) 86.1 Satasahasse không nêu chữ kiếp, dịch cách đây một trăm ngàn kiếp theo bối cảnh 82.1. (14) 126.1 gādhaṁ dịch chỗ vững chân, 126.2 dutiyaṁ bhavaṁ dịch kiếp sống thứ hai. (15) 143.3 Saṭṭhisatasahassāni không nêu danh từ, dịch sáu triệu theo bối cảnh 143.1 đến 143.2. (16) 205.3 Nāgova bandhanaṁ chetvā dịch như thớt voi bẻ gãy mọi trói buộc theo tiền lệ 15 khoá, chữ mọi không có trong Pāli. (17) 91.4 kết bằng dấu phẩy, 103.4 cũng kết bằng dấu phẩy dù Pāli kết dấu chấm, vì câu tiếp tục sang khoá sau; khác với Pāli về dấu câu, không về nghĩa.
  Kiểm máy đã chạy: tập khoá Việt bằng tập khoá Pāli, 906 trên 906; thứ tự khoá bằng thứ tự Pāli; không khoá rỗng; NFC sạch; không khoảng trắng thừa; không nháy ASCII; chữ Pāli trong bản Việt chỉ là tên riêng, tên loài và tên phẩm (Therāpadāna, Haṁsavatī, Okkāka, harītaka, nāga, bherī); đã đọc cặp Pāli với Việt của cả 906 khoá. Chưa chạy được các cổng của kho trong lượt này: npm run validate, npm test, npm run check và npm run build; vì vậy technical_integrity đặt 9.6 và không tuyên bố technical gate đã pass. Bài chưa có record trong reference-gaps; việc ghi nhận nằm ngoài phạm vi lát này.
  Lượt cải thiện 2026-10-13: đọc đối kháng lại từng cặp Pāli với Việt của cả 906 khoá, đổi 9 khoá (17.3, 17.4, 46.1, 52.1, 87.3, 87.4, 113.3, 135.3, 199.1), 897 khoá giữ nguyên; tập khoá và thứ tự khoá không đổi. Không có số Pāli nào bị đổi; đã đếm lại số mục liệt kê so với số lợi ích ở 107.3 (năm), 123.3 (ba), 127.3 (sáu), 149.3 (sáu) và đều khớp.
  Sửa chỗ ghi chú cũ sai: mục Lời kết 208.1 ở trên viết quy ước tầng là Tôi nghe như vầy, nhưng bản Việt của 208.1 và quy ước thật của tầng là Như vậy, Tôn giả Trưởng lão X đã nói những bài kệ này. Đo lại trên các khoá Itthaṁ sudaṁ … imā gāthāyo của tầng tha-ap (gồm cả bài này): 554 trên 560 khoá dùng đúng dạng này, 2 khoá dùng đã từng nói bài kệ này (số ít), 4 khoá dùng ba kiểu khác. Khoá 208.1 đã theo nhóm 554, nên không đổi chữ nào; chỉ phần mô tả trong ghi chú sai.
  Khoá đã đổi và lý do. (a) 113.3 Nhāpite bhattake sūde: người hầu tắm thành thợ hớt tóc, thuật ngữ (accuracy fix). Nhāpita là thợ cạo, thợ cắt tóc (dn12 gọi Rosika nhāpito là thợ cắt tóc, tha-ap394:7.2 nhāpitā là thợ hớt tóc), còn người hầu tắm là nhāpaka (dn2:34.4 và tha-ap394:6.2, hai dạng đứng cạnh nhau trong cùng một danh sách). Một bản Việt toàn văn ở mục Tra cứu toàn văn đọc nhāpite là người hầu tắm, nên đây là chọn theo tiền lệ của tầng và theo hình thái từ, không phải điều chắc chắn tuyệt đối; bhattake giữ nguyên người dọn bữa. (b) 46.1 Kicchappattova hutvāna: Như người đã lâm vào cảnh khốn khó thành Quả thật đã lâm vào cảnh khốn khó (accuracy fix). Bản trước hiểu -va là so sánh, nhưng 46.3 nói đức vua biết người ấy thật sự đang rất khổ sở, nên -va đọc là nhấn mạnh chứ không phải như. (c) 17.3 và 17.4 (grammar fix): pañcavaṇṇehi là cách công cụ số nhiều, không thể bổ nghĩa cho kuñcikā (chủ cách), mà đi với sibbite (được khâu); bản trước gắn năm màu sắc vào chìa khóa. Nay 17.3 là những chiếc chìa khóa; bằng năm màu sắc, 17.4 là túi đựng chìa khóa đã được khâu, tức không còn khẳng định chìa khóa có năm màu; ranh giới hai khoá vẫn theo Pāli, và chỗ này vẫn không phải câu chữ hoàn toàn thoát mơ hồ vì năm màu đứng cuối khoá 17.3. (d) 87.3 và 87.4 (clarity fix): chủ ngữ tôi trước đây rơi vào giữa vế gerund ở 87.3, nay 87.3 là nơi mà sau khi làm việc cúng dường và 87.4 là tôi đã bước đến nơi không lay chuyển, đúng nguyên văn tiền lệ của cùng Pāli pattomhi acalaṁ padaṁ trong tầng tha-ap (4 khoá tôi, 9 khoá ta). (e) 135.3 sippaṁ: nghề thuật thành nghề, theo tiền lệ mn85 và ud3.9 (học nghề), terminology fix. (f) 199.1: nước cốt đúng như bản chất tự nhiên thành nước cốt ở trạng thái tự nhiên, clarity fix, nghĩa yathābhūtaṁ không đổi. (g) 52.1: Cùng với thành Cùng, style fix theo tiền lệ tầng tha-ap (8 khoá cùng một trăm ngàn bậc tự tại cho Pāli Vasīsatasahassehi) và cho khớp 62.3 và 63.3 của chính bài.
  Giữ nguyên dù có nghi ngờ: 168.4 và 169.4 tôi đạt được, vô song, thanh tịnh (dấu phẩy sau đạt được hơi lạ nhưng thêm danh từ vào để nối với trí ở khoá trước là thêm chữ ngoài Pāli); 34.2 giữ nghĩa bản trước, vì chưa tìm được căn cứ nào để chọn cách đọc khác của micchā taṁ bahu gajjitaṁ; 31.4 tuvaṁ vẫn chưa dịch riêng vì không thêm được động từ nào mà không thêm nghĩa; 79.3 cho đến tận cùng cõi trời vẫn có thể thuộc về chiếc lọng hoặc về thời gian.
  Bất định còn lại, chưa phân xử được bằng căn cứ độc lập, vẫn như mục Bất định và lựa chọn ở trên, trừ phần (2) về 17.3 đã nêu trên; còn nguyên các chỗ 17.2 dhammakuttarā, 118.2 dhammakaruttame, 130.3 pañcavaṇṇehi dāyādo, 18.3 và 162.1 tumbaka (một bản Việt toàn văn đọc là vật đo lường, một cách đọc khác với bình bầu hiện dùng), 163.2 tathāgati, 165.1 caturo vaṇṇe, 138.1 asatthake và 181.1 padumake, 145.1 sati. Đối chiếu bản Việt toàn văn chỉ để hiểu cách đọc, không chép câu chữ: 126.2 (kiếp sống thứ hai) và 138.1 (gỗ assattha) khớp cách đọc hiện có nhưng không phải bằng chứng độc lập, 163.2 và 165.1 không thêm chứng cứ.
  Điểm lượt này: grammar_logic 8.6 thành 8.8 (hai chỗ ngữ pháp thật ở 46.1 và 17.3 đã sửa); terminology 8.5 thành 8.7 (113.3, 135.3 và 52.1 khớp tiền lệ); vietnamese_clarity 8.8 thành 8.9 (87.3, 87.4, 199.1). Các tiêu chí khác giữ nguyên: semantic_fidelity 8.6 và ambiguity_integrity 8.6 không nâng vì bất định thật còn nguyên và lượt đọc này vừa tìm thêm được hai chỗ đọc sai; triangulation 7.5 vì không có bản Anh độc lập; technical_integrity 9.6 vì chưa chạy được npm run validate, npm test, npm run check và npm run build trong lượt này. final_score 8.88 thành 8.93; blocker noEnglishEditionUpstream giữ nguyên.
  Kiểm lượt này: tập khoá Việt bằng tập khoá Pāli, 906 trên 906, thứ tự bằng Pāli; nháy đơn và nháy kép khớp Pāli từng khoá trên 906 khoá, 0 lệch; không khoá rỗng, NFC sạch, không khoảng trắng thừa, không nháy ASCII; chữ Pāli trong bản Việt vẫn chỉ là tên riêng, tên loài và tên phẩm; Pāli trùng nguyên văn trong bài vẫn 67 nhóm (1.270 cặp), 7 nhóm có bản Việt khác (6 nhóm chỉ khác chữ hoa đầu câu hoặc dấu cuối câu, 1 nhóm khác chủ thể ở 76.3).

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 23 chỗ bất đồng nghĩa (khoá hoặc cụm khoá liền nhau) → sửa 0, giữ 14, bất định 9. Giữ (bản dự án theo Pāli): 15.1 laṭṭhimadhu giữ cam thảo, bản nguyên bài đọc là mật mía; 40.3–40.4 paṭipucchāma giữ hỏi lại, bản nguyên bài đọc là tranh cãi; 107.3 kalyāṇamittaṁ giữ thiện hữu, bản nguyên bài đọc là tâm tốt đẹp; 113.2 nāṭake giữ vũ công, bản nguyên bài đọc là người canh gác; 113.3 nhāpite giữ thợ hớt tóc theo tiền lệ dn12 và theo sự phân biệt với nhāpaka ở dn2:14.3, bản nguyên bài đọc là người hầu tắm; 122.1 subhaddo giữ tốt lành, bản nguyên bài thêm nét về giọng nói mà khoá không có; 126.1 gādhaṁ giữ chỗ vững chân trong Chánh Pháp, bản nguyên bài đọc là trí biết tâm người khác (khác dị bản; cả hai cách đọc đều đủ ba lợi ích của 125.3); 135.3 nisāmemi giữ động từ lĩnh hội, bản nguyên bài gộp vào danh sách vật thọ dụng; 144.1 tamba giữ đồng, bản nguyên bài đọc là len; 169.3 bhañjanaṁ giữ phá vỡ, bản nguyên bài đọc là gắp bỏ; 179.3 mañca giữ giường, bản nguyên bài đọc là nôi; 181.1–181.2 padumake và lohitacandane giữ gỗ padumaka và chiên-đàn đỏ, bản nguyên bài đọc là gương sen và gỗ trầm đỏ; 192.4 āyupañcamakaṁ giữ tuổi thọ là điều thứ năm, bản nguyên bài thêm phần liệt kê năm đức theo cách giải thích; 197.3 bhattaṁ giữ món ăn, bản nguyên bài đọc là tài sản. Bất định (giữ bản dự án, ghi ở đây): 18.1 và 156.1 āyoga dịch dây buộc, bản nguyên bài đọc là vải băng bó, chưa phân xử được; 18.3, 162.1, 164.4 tumbaka dịch bình bầu, bản nguyên bài đọc là vật đo lường; 34.2 micchā taṁ bahu gajjitaṁ: bahu là trung tính số ít nên không thể là chủ ngữ số nhiều như bản nguyên bài đọc (nhiều người), nhưng vẫn chưa loại hẳn cách hiểu đây là nhận xét chung về lời tuyên hứa; 145.1 niyāmaṁ sati; 163.1–163.2 sugutto và tathāgati; 165.1–165.2 caturo vaṇṇe và hatthissaratanāni (hai loại châu báu hay ba loại vật); 176.3 ñāṇaparivāraṁ (đoàn tùy tùng của trí hay đoàn tùy tùng có trí); 177.3 varapotthake; 188.2 dantasāramaye. Mọi số lượng Pāli đều khớp với bản nguyên bài: 40 mục số lợi ích ānisaṁsa, 30.000 kiếp ở 77.1, 84.000 ở 68.3, 86.000 ở 75.1, sáu triệu ở 143.3. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn (mỗi khổ kệ ứng với một đoạn), không phải mức khoá; không có bản Anh. Bản nguyên bài chỉ dùng để phát hiện chỗ xem lại, không có câu chữ nào của nó được đưa vào bản dịch; lượt này không đổi chữ nào của 906 khoá. Cổng kỹ thuật chưa chạy: npm run validate, npm test, npm run check, npm run build.
