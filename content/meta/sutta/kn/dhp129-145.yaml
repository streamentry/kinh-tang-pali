notes: |-
  Lượt cải thiện 2026-10-13: đọc đối kháng 85 khoá với Pāli root đã ghim, bản Anh Sujato và bản Việt hiện hành (Phan Tuấn Anh) cùng tầng của dự án. Đổi 20 khoá. Lượt chấm trước không có ghi chú và chấm 9.5–10 mà bỏ sót các lỗi dưới đây, nên điểm các tiêu chí 2–7 và 9 được hạ về mức sau sửa.
  Sửa nghĩa: 138:1 thiếu mục `jāniṁ` (mất mát) nên danh sách "mười cảnh" chỉ còn chín, nay đủ mười (138:1–140:2). 134:4 `sārambho te na vijjati` bị dịch thành mệnh đề phụ của Niết-bàn ("nơi không còn tranh cãi"), nay là "trong ngươi không còn tranh cãi". 142:1–2 thiếu `santo` còn `samaṁ careyya` bị dịch thành "an tịnh"; nay `samaṁ careyya` là "sống ngay thẳng" (đa số tiền lệ `samacariyā`: mn42, dn14) và `santo` là "an tịnh". 143:3 "không bị ngủ vùi" đổi thành "thức tỉnh khỏi giấc ngủ" sát `apabodheti` hơn; 143:4 bỏ "tránh" (Pāli `kasāmiva` không có động từ), khớp sn1.18:1.4. 137:1 bỏ "các vị" (thêm sắc thái tôn xưng không có ở `adaṇḍesu appaduṭṭhesu`). 136:3–4 căn lại ranh giới dòng: `sehi kammehi dummedho` và `aggidaḍḍhova tappati` (tappati = "dày vò", theo an7.64:14.4).
  Sửa thuật ngữ và tiền lệ: 141:3 `rajojallaṁ` "tro bụi" thành "bụi bẩn" (rajojalla ở mn12, mn96, dn14, dn30: "bụi bẩn" hoặc "bụi bặm"; không có tiền lệ "tro"). 144:2 `saṁvegino` "hăng hái" thành "khẩn thiết" (sn9.14: "niềm khẩn thiết"; "hăng hái" là sắc thái viriya). 137:4 `ṭhānaṁ` "nơi" thành "cảnh ngộ" (đây là các hoàn cảnh, không phải nơi chốn). 145:2 `tejanaṁ` "mũi tên" thành "cây tên" (khớp mn86:18.28). 134:1,3 và 144:6: "ông"/"các người" thành "ngươi"/"các ngươi", đúng cách xưng của Đức Phật với người nghe ở các kệ khác trong Dhp (ngươi: 15 khoá ở dhp235–238, 248, 348, 369, 376, 383, 394; các ngươi: 6 khoá ở dhp274–276, 337; "ông" chỉ còn ở dhp154 khi nói với người làm nhà).
  Sửa tiêu đề chuyện (thêm chi tiết không có trong Pāli): 129:0.4 "hành hung" và 130:0 "đe dọa" bỏ, còn "Chuyện sáu tỳ-kheo" (khớp dhp231:0, cùng Pāli `Chabbaggiyavatthu`); 131:0 "đám trẻ đập rắn" thành "nhóm trẻ nhỏ" (không có "đập rắn" trong `Sambahulakumārakavatthu`); 143:0 thêm phần tên bị rơi `Tissa` (Pilotikatissa).
  Bất định còn lại, ghi nhận: (1) dhp143:3 Pāli root ghim đọc `niddaṁ` (giấc ngủ) còn bài song song sn1.18:1.3 đọc `nindaṁ` (lời chê trách); cả hai bản Anh và Việt hiện hành đều hiểu là chê trách. Bản dịch theo root: "thức tỉnh khỏi giấc ngủ"; nếu đọc `nindaṁ` thì nghĩa là "tỉnh thức trước lời chê trách" (dự án đã dịch như vậy ở sn1.18). Không phân xử được bằng căn cứ trong tầng đã ghim; giữ root. (2) 134:2 `kaṁso upahato`: "chuông đã vỡ" theo Anh và Việt hiện hành; `upahata` còn có nghĩa "bị đánh/bị móp". (3) 138:1 `jāniṁ` chỉ dịch "mất mát" chung vì Pāli không nêu mất cái gì. (4) 142:1 `samaṁ careyya` có thể hiểu là "sống bình đẳng/điềm hòa". (5) 133:2 `vuttā` là chủ ngữ số nhiều ("những người bị nói") nhưng câu Việt để ngầm.
  Còn lệch ranh dòng ở 137:3–4 (động từ `nigacchati` đứng ở khoá 137:3, tân ngữ `ṭhānaṁ` ở 137:4) vì cú pháp Việt cần đảo vế; giữ nguyên, cùng cách xử lý với bản Anh. Tiêu đề chuyện ở các chương khác còn thêm chi tiết (ví dụ dhp258:0 "gây rối", dhp262:0 "tham vọng") chưa xử lý trong lượt này.
  Đối chiếu số đếm: Pāli trùng nguyên văn trong bài 5 cặp, 0 cặp Việt khác; khoá Việt = khoá Pāli (85/85), nháy và dấu lược khớp từng khoá; NFC đạt. Coverage English: bản Sujato phủ toàn bài; có bản Việt hiện hành (Phan Tuấn Anh) tại commit đã ghim. technical_integrity chưa chạy cổng máy trong lượt này: còn cần `npm run validate`, `npm test`, `npm run check`, `npm run build`.
