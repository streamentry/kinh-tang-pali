notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Tra tiền lệ (đếm được):** `ānayati` (mệnh lệnh) → *hãy mang/đem đến* (2 chỗ "hãy
  mang đến" sẵn có trong tầng Việt; `dn16:6.25.14` "Xin các ngài ơi" cho cách gọi
  kính ngữ); `mayhaṁ` → *cho ta*; `pi` (thêm nữa) → *… nữa*.
  **Bối cảnh đã đọc trước khi dịch:** `12.1`–`13.4` là vua đòi bảo vật hiến tế và
  Bà-la-môn buộc phải đưa những con vật ấy, `14.3`–`14.4` là vua nói sẽ tế và sẽ bố
  thí. `14.1` nói `Usabhampi` (con bò đực tượng), `14.2` nói tiếp bằng `Nisabhaṁ` — cùng
  một kiểu danh xưng "chúa của loài ấy". Vì thế tôi dịch `Nisabhaṁ gavampatiṁ` là
  *và vua bò ấy*; **0 tiền lệ** cho cụm danh xưng này nên đây là lựa chọn đặt mới.
  **Bất định đã ghi:** `tepi` (= `te` + `pi`) là "những thứ ấy **cả nữa**", nhưng Pāli
  **không nói rõ** "thứ ấy" gồm những gì — có thể là ba con vật kể trước đó, có thể là
  tất cả những gì vừa nêu. Tôi dịch trung tính là *cả những thứ ấy* và **không** ghi
  "số ba" hay "tất cả", vì đóa số vào thân kinh là bịa. `nisabha` = `na` (và) +
  `isa` (chúa); tôi dịch *và … ấy* theo đúng hai thành phần.
  **Điểm `semantic_fidelity` 9,2 và `terminology` 8,8 là do bất định trên.**
