    + `122.3`, `123.3` `kicchāladdhakehi`, `kapaṇaladdhakehi`: "có được khó nhọc", "có được trong khốn khổ"; `123.3`–`123.4` `puttehi` đọc đi với `no` ("chúng con").
    + `124.2` `jīyase`: đọc "mẹ lại mất con"; `124.4` `labhataṁ tāto paralokaṁ`: "mong cha đạt được đời sau" (có thể là lời mỉa).
    + `128.3` `campakadalamissāyo`: "xen lẫn cánh hoa campaka".
    + `136.2` `devarā`: "người em chồng" (chưa xác định có phải em chồng thật của Candā hay chỉ người nam khác).
    + `140.2` `guṇino`: "có đức hạnh" (cũng có thể là có dây, có sợi).
