  - Chỗ bất định (không thêm vào thân kinh):
    + `1.3` `brahmabandhu`: đọc "Bà-la-môn chỉ nhờ dòng họ" theo 4 khoá cùng sắc thái chê (xem trên).
    + `7.4`, `8.4`, `9.4`, `10.4` `pacurā kira hotha yaññatthāya`: `pacura` = dồi dào, nhiều; câu được đọc "các con sẽ dồi dào cho lễ tế" (nghĩa: đủ số lượng cho lễ tế); không phân xử được có phải câu nói về số người hay về "vật tế".
    + `11.3` `sabbeva sikhino deva karohi`: `sikhin` = có chỏm tóc; không xác định được đây là dấu hiệu nô bộc hay điều gì khác, dịch sát chữ "người có chỏm tóc".
    + `12.2` `accuggataṁ varuṇadantaṁ`: đọc là hai tính từ của `Nāḷāgiri` ("cao vút", "ngà varuṇa"); `varuṇa` chưa xác định nghĩa nên giữ phiên âm. `14.1` `anojaṁ` chưa xác định nghĩa nên giữ nguyên; `usabhaṁ yūthapatiṁ` và `nisabhaṁ gavampatiṁ` đọc là danh từ chung ("bò đực, chúa của đàn", "bò đầu đàn, chúa của loài bò") chứ không phải tên riêng; cách đọc còn lại là tên riêng (như bốn ngựa `13`).
    + `17.1`, `22.1`: "mẹ", "cha" là mẹ và cha của vua, suy từ `putta` (gọi vua) và `koṇḍañña` ở `20.1`; `22.2` `vasavattī` giữ phiên âm vì có thể là tên hoặc danh hiệu của người cha.
    + `31.3` `yassa honti tava kāmā`: đọc "cho người nào ngài ưng ý"; cách đọc khác là "dù ngài muốn gì". `32.4` `alampi me hotu puttayaññena`: dịch "thôi đủ rồi, ta không cần lễ tế bằng con nữa" (`alaṁ` = đủ, không cần thêm).
    + `33.3` `atha no upakkhaṭassa yaññassa`: `no` bỏ không dịch (có thể là "của chúng ta"). `35.1` `jano`: dịch "người ta".
    + `40.2` `na maṁ khaṇḍahālo ghāteyya`: đọc "sẽ không chỉ giết con" vì `40.3`–`40.4` nói sau con sẽ đến lượt vua; cách đọc khác là câu hỏi tu từ.
    + `42.2` `dubbhituṁ`: dịch "phản bội"; nghĩa rộng hơn là hãm hại. `38.4` `abhūmiyaṁ`: "không đúng chỗ".
    + `57.3`–`57.4` `na koci assa paṭighaṁ, mayā jānapado na pavedeti`: `assa` đọc là "đối với con", `mayā` đọc là "về con"; cách đọc khác là lời nói về vua.
    + `61`–`62`: người nói và người được gọi là `sīmantiniyo` không rõ; `61.4` `aparādhāhaṁ na passāmi` đọc là lời các bà phải nói với Khaṇḍahāla, dịch ngôi "tôi".
    + `63.2` `upanītatte` đọc "bị đem đến"; `63.3` `me` đọc "vì con".
    + `73`, `76`, `127`, `149`, `152` `janassa`: "mọi người" (không rõ là dân thành hay người đời).
    + `97.2`: `Erāvaṇo gajo balī dantī` là tên voi báu; `99.2` `sāḷiya nigghoso`: đọc "tiếng vang như chim sāḷiya" (`sāḷiya` giữ phiên âm, tầng giữ `Sāḷiya` ở `ja367`), không phân xử được.
    + `100.1` `sāmasamasundara`: đọc "da ngăm đẹp đồng đều" (`sāma` = ngăm, sẫm; `sama` = đều; `sundara` = đẹp); chưa phân xử được.
    + `104.2` `brahāraññā`: đọc là "rừng lớn" (`mahāraññā`).
