    + `20.2`, `25.2`, `27.2`, `155.2`, `156.2` `bhūtabhabya`: "hiện có và sẽ có", chưa xác định chắc; `155.2` đọc `yakkhabhūtabhabyāni` là "dạ-xoa, những loài hiện có và sẽ có".
    + `153.2` `nisīdite candasmiṁ`: "được cho ngồi xuống". `156.4` `pati māhaṁ ajeyyaṁ`: "xin đừng để thiếp mất chồng".
    + `159.1`–`159.4` `ko te diṭṭho rājakali`: đọc "ngươi đã thấy ai ... con và vợ đang bị giết", rồi "nhà triệu phú và các gia chủ vô tội vốn cũng mong cõi trời"; không phân xử được cách nối hai nửa.
    + `160.4` `yathā taṁ anupaghātaṁ`: "như thế là không ai bị tổn hại". `162.1`–`162.2`: chủ ngữ của `paviṭṭhā` không rõ (đoàn người tế lễ), dịch "tất cả". `167.3` `celukkhepamakaruṁ`: "đã vẫy áo" (vẫy khăn áo tỏ lòng hoan hỷ). `171.4` `aghositthāti`: `iti` đóng lời loan báo, không dịch riêng.
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 700/700, cùng thứ tự.
    2. Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá và từng vị trí đầu/cuối khoá: 0/700 lệch (Pāli có 94 khoá mang nháy; nháy đơn ở `55`, `56`, `58`, `59`).
    3. Pāli trùng nguyên văn trong chính bài: 123 nhóm, 827 cặp; Việt khác ở 7 cặp có lý do, xem trên. Pāli trùng với bài khác: 35 khoá, 663 cặp; Việt khác ở 20 cặp (3 khoá), xem trên.
    4. Dấu lược `…pe…`, `…` trần và `(…)`: Pāli 0/700 khoá, Việt 0/700 (phép chạy rỗng, không có gì để so).
    5. Số Pāli: xem trên; không có cụm chưa phân xử được.
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; không có dấu nháy thẳng; Pāli lọt sang tiếng Việt chỉ là tên riêng (`Jātaka`, `Mūgapakkha`, `Candakumāra`, `Ekarāja`, `Pupphavatī`, `Khaṇḍahāla`, `Canda`, `Candā`, `Sūriya`, `Bhaddasena`, `Sūra`, `Vāmagotta`, `Upasenā`, `Kokilā`, `Muditā`, `Nandā`, `Vijayā`, `Erāvatī`, `Kesinī`, `Sunandā`, `Puṇṇamukha`, `Bhaddiya`, `Siṅgāla`, `Vaḍḍha`, `Abhayaṅkara`, `Nāḷāgiri`, `Kesī`, `Surāmukha`, `Puṇṇaka`, `Vinataka`, `Koṇḍañña`, `Vasavattī`, `Selā`, `Vasula`, `Gotamī`, `Pañcāla`, `Erāvaṇa`, `Kāsi`, `Ghaṭṭikā`, `Uparikkhī`, `Pokkharaṇī`, `Bhārikā`) và tên cây, từ giữ phiên âm có ghi chú (`asoka`, `kaṇikāra`, `pāṭali`, `campaka`, `sāḷiya`, `varuṇa`, `anoja`, `bho`). Đã in cặp Pāli↔Việt ra đọc toàn bài (700 cặp) và sửa sau lượt đọc: `hãy không hãm hại` → "đừng làm hại", `muốn làm hại` → "muốn phản bội" (`42.2`), `bị dẫn đến` → "bị đem đến" (`63.2`), `đó là cái chết của Khaṇḍahāla` → "đó là sự giết chết Khaṇḍahāla" (`161.4`), thống nhất `65.5` với `32.3`, `47.3` và `125.4` với `71.4`, `74.4`, `147.4`, `150.4`, `107.2` với `an4.53:10.4`.
