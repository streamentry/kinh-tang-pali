  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja544_root-pli-ms.json` (700/700 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ: bốn dòng tiêu đề `0.1`–`0.4`, 171 bài kệ (`1`–`171`; phần lớn bốn dòng, riêng `31`, `46`, `119` có năm dòng và `65`, `96`, `99`, `107` có sáu dòng) và dòng kết bài `172.1`; phần văn xuôi khung truyện không nằm trong tầng Pāli đã ghim, nên người nói được suy từ xưng hô, nháy và mạch của chính các bài kệ. Bản một khoá cũ của bài (chỉ có `14.2`) do một lát dở trước để lại đã được thay hoàn toàn; `14.2` được dịch lại cho khớp phần còn lại. Nội dung chính (suy từ kệ): vua Ekarāja ở Pupphavatī hỏi chính sư Khaṇḍahāla đường lên cõi trời và được khuyên tế lễ bằng con trai, hoàng hậu, dân thành thị, bò đực, ngựa, voi, mỗi thứ bốn (`1`–`5`); vua truyền triệu tập hoàng tử, công chúa, hoàng hậu, gia chủ và các con vật báu, hẹn tế lễ lúc mặt trời mọc (`6`–`16`); mẹ rồi cha của vua can ngăn nhưng vua theo lời các thầy (`17`–`27`); các hoàng tử xin làm nô lệ thay vì bị giết, vua chùn lại, Khaṇḍahāla thúc ép (`28`–`49`); Canda phản biện (`35`–`60`); phụ nữ, Selā và Vasula van xin, vua lại chùn, Khaṇḍahāla thúc ép (`61`–`68`); đoàn vợ con theo sau, dân than khóc (`69`–`104`), rồi các phụ nữ than và nguyền Khaṇḍahāla (`105`–`115`); các hoàng tử xin lần nữa và từ biệt mẹ (`116`–`127`); lời trang sức cuối, Candā xin chết thay chồng (`128`–`143`); lời than khi các hoàng tử sắp bị chém (`144`–`152`); Candā đọc lời chân thật, một phi nhân quát vua (`153`–`159`); các hoàng tử được thả, Khaṇḍahāla bị đám đông ném đất, Canda được tôn lên ngôi (`160`–`171`).
