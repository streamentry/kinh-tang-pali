notes: |-
  **Tầng Anh đủ 8/8 khoá có nội dung** (`:2.1` dòng tên bài, Sujato để trống). Không có segment Pāli ≥ 40 ký tự nên sàn coverage 0,8 không kích hoạt.

  **Thuật ngữ, đếm được.** `Varuṇavagga` → *Phẩm Cây Varuṇa*: **1 tiền lệ đúng khoá** (`ja79:0.3`), dùng nguyên văn. `Akataññu` → *không biết ơn*; `neva naṁ abhirādhaye` → *không bao giờ khiến họ thỏa lòng*. `sīla` → *giới* (8 tiền lệ `Sīlavagga` → *Phẩm Giới*), nên `Sīlavahatthijātaka` → *Kinh Voi Có Giới*.

  **Bất định đã ghi, chưa phân xử được.** `:1.2` `niccaṁ vivaradassino`: `vivara` nghĩa gốc là *khe hở*, và `dassino` là danh từ chủ thể, nên tôi dịch *luôn ngó tìm kẽ hở* — nghĩa đen. Sujato đọc là *always looking for opportunity*, cũng hợp vì `abhirādhaye` ở câu sau. Trong toàn tầng không có từ nào dịch `vivara` theo nghĩa *lợi ích*, nên tôi giữ nghĩa đen thay vì mượn của Sujato. `Sīlavahatthi` cũng có thể đọc là *con voi im lặng* (sīla ← sīla <silā>) thay vì *có giới*; tôi theo *có giới* vì `sīla` trong chính bài này (`Sīlavagga`, 8 bản khác) là *giới*.**Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm — ở lát này chỉ 0/155 khoá Pāli đủ 40 ký tự, nên chốt tự kiểm 0% và assertion còn lại không tự chạy; phần tôi tự kiểm: 9/n khoá có mặt và không thừa khoá, đúng segment ID, mọi chuỗi NFC, không khoá rỗng, không khoá nội dung nào trùng nguyên văn Pāli, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài và không bao giờ âm, không còn `(…)`, không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (lát này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Jātaka không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.
  Sửa lan 2026-10-13: 1.3 `Sabbañce pathaviṁ dajjā` "Dù trao cả mặt đất lưu đày," → "Dù có cho cả mặt đất," (`pathaviṁ` chỉ là mặt đất, Pāli không có từ nào nghĩa "lưu đày"; Pāli trùng nguyên văn ja438:3.3 đã dịch "dù có cho cả mặt đất"; "lưu đày" chỉ xuất hiện ở ja471:2.3 cho động từ khác). Tập khoá giữ nguyên; điểm cũ không đổi.

  Quyết định hội đồng biên tập 2026-10-16: C2 — :2.1 (dòng kết có dấu phẩy trước "thứ N"); C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
