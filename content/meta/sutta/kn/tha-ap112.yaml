  **Cổng kỹ thuật chưa chạy.** Lát này bị cấm `git` và cấm `npm run validate|test|check|build`.
  Bốn lệnh còn lại thuộc cổng của người điều phối: `npm run validate` · `npm test` ·
  `npm run check` · `npm run build`. Tiêu chí 10 vì vậy là **9,6**, không phải 10,0 — tôi không
  tuyên bố technical gate pass.

  **Năm phép kiểm tự viết, quét MỌI khoá** (ngưỡng 40 ký tự của `_hvi.py` ở đây bỏ sót gần
  hết bài nên không dùng):

  1. `set(khoá Việt) == set(khoá Pāli)`: đúng bằng 32/32, **0 orphan**, 0 thiếu, 0 thừa.
  2. Dấu nháy: đếm cả **nháy kép** `“”` lẫn **nháy đơn** `‘’`, và so **theo khoá** với Pāli —
     khớp tuyệt đối. Bản Việt cố ý **không** tự cân mỗi khoá, vì Pāli cũng vậy: `“` mở ở
     `:1.1` và `“` đóng ở `:7.3`; `‘` mở ở `:4.1` và `‘` đóng ở `:4.4`. Lũy kế về cuối
     bài: kép = 0, đơn = 0.
  3. `…pe…`: đúng 1 khoá mỗi bài (`:7.2` / `:5.2`), giữ **đúng một** `…`, không mở rộng.
  4. `…` trần: **không có** khoá nào chỉ chứa `…` trần — dấu lược duy nhất trong bài chính
     là `…pe…` ở điểm 3. Mẫu số phép này = 0 khoá riêng.
  5. Cặp Pāli trùng nguyên văn **trong chính bài**: **0 cặp** trên 32 khoá (mẫu số 32 khoá,
     và cả 32 chuỗi Pāli đều khác nhau), nên không có cặp nào mà Việt bắt buộc phải khác.
     Thay vào đó tôi dò **chéo cả phẩm**: **53** dòng Pāli của ba bài này cũng xuất hiện ở
     bài `tha-ap` khác; **35** dòng tôi viết đúng bằng chuỗi đa số đang có trong kho,
     **18** dòng không.

  **Mười tám dòng không trùng đa số — phân loại, để không ai tưởng tôi tự ý làm khác:**

  - **4 chỗ chỉ khác ở đại từ Ta/Tôi** (`Mama saṅkappamaññāya` ×1, `Duggatiṁ
    nābhijānāmi` ×2, `yaṁ saññamalabhiṁ tadā` ×1). Kho đang có *Ta không biết mình rơi vào
    khổ đau,* 124 chỗ so với *Tôi không biết mình rơi vào khổ đau,* 3 chỗ. Tôi giữ **Tôi**
    vì trong chính ba bài này người kể là *tôi* (`Tôi đã tự tay nâng nước lên,` ở
    `tha-ap108:2.1`; `Tôi cầm lấy hoa Nāga …` ở `tha-ap112:2.3`; `tôi ở trong thung lũng
    núi;` ở `tha-ap130:1.2`), và sáu bài lân cận 103–106, 111, 113 cũng dùng *tôi*. Đổi
    riêng một dòng sang *ta* là tự phá vỡ chính bài mình.
  - **2 chỗ chỉ khác ở Từ/Vào** (`Ekanavutito kappe` ×2): kho đang có *Vào chín mươi mốt
    kiếp trước,* 32 chỗ và *Từ chín mươi **mốt** kiếp trước,* (số 20 ở đây là số chỗ của dạng
    sai). **ĐÃ SỬA 2026-10-05:** câu cũ *"Cả hai đều là **91**"* là **sai** — *Từ chín mươi chín*
    là **99**. Tôi vẫn giữ dạng *Từ …* vì hai bài gần nhất dùng nó, nhưng **số** phải là *chín
    mươi mốt*.
  - **12 chỗ còn lại là lựa chọn bám Pāli**; ở ba chỗ sau, tiền lệ đang làm sai và tôi
    **không** nhân:

    - `tha-ap112:1.2` `Sataraṁsiṁva bhāṇumaṁ;` — `tha-ap87:2.2` dịch *như mặt trời tỏa ra
      **trăm ngàn** tia sáng*. Pāli không có `ngàn` (`sataraṁsi` = trăm tia). Tôi viết *tựa
      như mặt trời tỏa trăm tia sáng trên mặt đất* để giữ cả `bhāṇumaṁ`. **Xin sửa
      `tha-ap87:2.2` theo; tôi không được sửa tệp ngoài lát.**
    - `tha-ap130:1.1` `Pabbate himavantamhi,` — đa số gần nhất (6 chỗ) viết *Ở nơi vùng núi
      Himavanta*; `tha-ap87:1.1` và `tha-ap260:1.1` lại dịch thành *Tuyết Sơn* / *Tuyết Lãnh*.
      Tôi giữ *Giữa núi Himavanta* (tên chuẩn `Himavanta` có 17 chỗ trong tầng `kn`). Cả ba
      cách đều đang tồn tại nên ghi ở đây.
    - `tha-ap112:2.4` `vipassissābhiropayiṁ.` — `tha-ap65:2.4` dịch Vipassi thành *Dữ Kiến*,
      tức lấy tên một vị Đại Vĩ ở bài khác. Tôi giữ *Vipassi*.

  **Thuật ngữ, đếm được trong `content/translation/vi/project/sutta/kn/`:** `Paṭisambhidā`
  → *Bốn vô ngại giải* (380 chỗ, khớp cả glossary `content/glossary/pali-vi.yaml`);
  `Itthaṁ sudaṁ āyasmā … thero imā gāthāyo abhāsitthāti` → *Tôi nghe như vầy: … đã nói
  **những** bài kệ này* — trong `tha-ap` đo được **409** bản dùng số nhiều so với **19**
  bản dùng *bài kệ này* (toàn tầng: 424 so với 45). `Therāpadāna` giữ nguyên (389);
  `…pe…` → `…` (533/533); `bài kệ` (470) so với `câu kệ` (8).

  **`translationTitle` khớp đúng chính sách ở `:0.3`** — dùng hình thức `N. ` khi và chỉ
  khi Pāli `:0.3` **bắt đầu bằng số**; hình thức này có 11 chỗ tiền lệ so với 7 chỗ viết
  `N ` trần trong 428 tệp `tha-ap`.

  **Đây là bài cuối của phẩm `Bhikkhadāyivagga`, nên nó mang thêm ba khoá mà
  hai bài kia không có: `:7.2` số thứ tự phẩm, `:9.1` `Tassuddānaṁ` và `:10.1–10.6` uddāna
  gồm tên mười vị trưởng lão.** Tôi đã đối chiếu uddāna với tiêu đề `:0.3` của chính mười
  bài `tha-ap103–112` và khớp **10/10** theo đúng thứ tự: `Bhikkhadāyī` (103) · `Ñāṇasaññī`
  (104) · `Hatthiyo` (105) · `Padapūjako` (106) · `Muṭṭhipupphī` (107) · `Udakado` (108,
  bài này) · `Naḷamālī` (109) · `Upaṭṭhako` (110) · `Biḷālidāyī` (111) · `Reṇu` (112, bài
  này). Vì vậy tôi **giữ nguyên dạng Pāli của uddāna** — kể cả `Udakado`, dù tiêu đề bài 108
  viết `Udakapūjaka`; đó là hai hình thức khác nhau trong chính kinh, và làm phẳng là bịa
  danh. Tiền lệ y hệt: `tha-ap142:12.1–13.2`, `tha-ap202:9.1–9.5`.

  **`gāthāyo cha ca saṭṭhi ca.` (`:10.6`) = sáu mươi tư.** `saṭṭhi` = 60, `cha` = 6.
  Cấu trúc `Cha ca saṭṭhi ca gāthāyo` đã có **đúng** ở `tha-ap352:9.5`, dịch *Có sáu mươi
  sáu bài kệ,*. Tôi dùng *gồm có sáu mươi tư bài kệ.* vì `ca` ở cuối Pāli là trạng ngữ nối
  câu với vế trước.

  **Bốn chỗ tôi đã tra, không đoán.**

  1. `Uḷurājaṁva pūritaṁ` (`:1.4`) — **hapax** toàn Pāli đã ghim, chỉ xuất hiện thêm một
     lần ở `tha-ap104:2.2`, **cùng đúng hai vế này**. Tôi dịch *tựa như mặt trăng đã tròn
     đầy* theo nghĩa `uḷurāja` = *trăng* trong từ điển Pāli–Myanmar, và vì `pūritaṁ` =
     *tròn đầy*. Cách đọc thay thế là *tấm ngai của vua trời* (`uḷurāja` cũng được ghi là
     tên một tấm ngai của Sakka); tôi không chọn cách đó vì `pūritaṁ` hợp với trăng hơn,
     và vì `Sataraṁsi` ở `:1.2` đã là hình tượng trăng/mặt trời. **Xin người điều phối
     phán một lượt cho cả hai khoá `:1.4` này và `tha-ap104:2.2`** — bản `tha-ap104:2.2`
     hiện dịch *đầy tràn như một con voi vua*, lấy nhầm hình ảnh `Kuñjaraṁva mahesinaṁ`
     ở `tha-ap104:1.4`; tôi không được sửa tệp ngoài lát.
  2. `sāgareheva medaniṁ` (`:2.2`) — `medani` chỉ có 4 chỗ toên root (trong đó `ja547:88.2`
     *haritaṁ dakkhisi medaniṁ*, `thi-ap17:153.4`, `tha-ap395:7.4`, và khoá này); nó là
     khối đất/đất sét. `sāgare` là của biển. Tôi dịch *như mặt đất được biển bao quanh;* —
     dựa trên nghĩa từ, không thêm mệnh đề nào.
  3. `Nāgaṁ paggayha reṇūhi` (`:2.3`) — `Nāga` ở đây là **hoa**, không phải rắn: `nāgapupphi`
     là hoa cây điều, và nó xuất hiện như vậy trong `mil6.3.1:32.2` cùng tầng `pali` đã ghim.
     `vipassissābhiropayiṁ` (`:2.4`) là **tôi** dâng lên cho Đức Phật Vipassi (`abhiropaya` =
     dâng cúng, `vipassī` = thế mạnh như là tên riêng). Tôi dịch *Tôi cầm lấy hoa Nāga còn
     đầy bột, / dâng lên Đức Thấy Triết Vipassi.* Bản `tha-ap65:2.4` cùng dòng Pāli dịch
     Vipassi thành *Dữ Kiến*, tức lấy tên một vị đại Vĩ ở bài khác — tôi không nhân.
  4. `Purakkhataṁ sāvakehi` (`:2.1`) — `purakkhata` là một trong màu áo được Tăng cho phép
     trong Luật (đọc được 21 chỗ toên root, đa số với `bhikkhusaṅgha-`/`isisaṅgha-` như
     *tăng đoàn trong bào áo nâu đỏ*). Tôi dịch *Mặc tấm áo màu nâu đỏ do đệ tử dâng,*.

  **Vì sao `semantic_fidelity` = 9,2 và `ambiguity_integrity` = 9,1 — thấp nhất trong ba
  bài của lát.** Bốn chỗ trên đều nằm ở **hai stanza ẩn dụ** (`:1.4` và `:2.1–2.4`), nghĩa
  giáo lý của bài nằm ở `:3.1–5.3` và `:6.1–7.3` (`Ekanavutito` = 91 kiếp, quả của việc
  dâng, vua tên Reṇu ở kiếp 45, bốn vô ngại giải) — phần đó tôi chắc. Nhưng tôi không che
  bốn chỗ đó: chúng đã ghi ở trên, và người đọc cần biết chỗ nào là chỗ tôi phân xử.

  **Con số trong bài này đều đối chiếu được.** `Ekanavutito kappe` = **91** = `eka` 1 + `navuti`
  90. **ĐÃ SỬA 2026-10-05 — hai lỗi trong câu cũ ở đây:** (1) *"khớp tiền lệ `tha-ap102:3.1`,
  `tha-ap113:8.1`, `tha-ap117:7.1`, `tha-ap119:7.1` (đều *chín mươi chín kiếp*)"* — bốn tiền lệ ấy
  **đều sai** (99), nên không thể là tiền lệ; tiền lệ **đúng** là 86 khoá cùng cụm đã viết
  *chín mươi mốt*. (2) *"`Ekatālīsito kappe` = 61"* — sai: `Ekatālīsito` = `eka` 1 + `tālīsa` 40 =
  **41**, đúng như *bốn mươi mốt* ở `tha-ap131:5.1`. `Paṇṇatālīsito kappe` = `paṇṇa` 5 + 40 =
  **45**, tôi viết *Vào bốn mươi lăm kiếp trước,* — phần này vẫn đúng, không đổi.

  **Hai điểm nhất quán tôi chọn có ý thức, xin ghi lại:**

  - `Tassuddānaṁ` (`:9.1`) → *Tóm tắt phẩm này:* theo đa số đo được (19 so với 8 cho
    *Tóm lược:*). Nhưng bài **tha-ap102**, cùng cấu trúc y hệt (lục kết rồi số phẩm ở
    `:7.2`, rồi `Tassuddānaṁ` ở `:8.1`, rồi uddāna), lại dùng *Tóm lược:*. Cả hai số đã
    nêu; người điều phối có thể chọn một lượt cho cả phẩm.
  - `cakkavattī mahabbalo` (`:4.4`) → *là Chuyển luân vương có đại thần lực.* theo đúng 38
    chỗ tiền lệ (kể cả chữ `luân` viết thường). Ba biến thể khác cùng tồn tại: *đại oai
    lực* 11, *đại uy lực* 10, *Chuyển Luân Vương* viết hoa 10 — tôi theo số đông và không
    tạo biến thể thứ năm.

  **SỬA LỚP LỖI SỐ PĀLI (lỗi loại 2 của quality gate — sai *số lượng*), 2026-10-05.**
  - `tha-ap112:3.1` (`Ekanavutito kappe,`) = **91**: `eka` 1 + `navuti` 90 = 91.
    Bản dịch cũ *Từ chín mươi **chín** kiếp trước,* là **99** — sai. Đã sửa thành *Từ chín mươi **mốt** kiếp trước,*. Tiền lệ trong chính tầng: 86 khoá cùng `Ekanavutito` đã viết *chín mươi mốt* (= 91) và **0** khoá nào viết *một*; 21 khoá sai nằm ở 21 tệp này (chính là số đo trước khi sửa).
  - Vế trước/sau, dấu câu và mọi thứ khác trong câu giữ nguyên y như cũ.

