  **Giải quyết draft 2026-10-12.** Thay thế các mục cũ ở trên khi mâu thuẫn: các câu *"Mặc tấm áo màu nâu đỏ do đệ tử dâng"*, *"purakkhata là một trong màu áo được Tăng cho phép"*, *"Thấy Triết"*, *"uḷurāja là tên một tấm ngai của Sakka"*, *"sáu mươi tư"* và mọi lời bảo vệ chúng đều **bị bãi bỏ**; điểm cũ (9,40) bị thay bằng bảng điểm mới.

