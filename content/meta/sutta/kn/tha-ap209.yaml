  **Chỉ mục Pāli → Việt toàn tầng.** Đã dò **3927 cặp Pāli trùng nguyên văn**.
  **15 khoá dùng lại nguyên văn bản dịch đã có**: `Therāpadāna`,
  `Phẩm Hoa Kaṇikāra`, `“Rực sáng như hoa kaṇikāra,`,
  `đang ngồi giữa khe núi;`, `Ngài tỏa sáng khắp mọi phương trời,`,
  `Vào chín mươi tư kiếp trước đây,`,
  `khi tôi dâng cúng hoa ấy;`, `Tôi không còn biết đến đọa xứ,`,
  `đây là quả báo của việc cúng dường Đức Phật.`,
  `Vào năm mươi mốt kiếp trước,`, `Thành tựu bảy báu,`,
  `là Chuyển luân vương có đại thần lực.`, `Bốn vô ngại giải,`, `…`,
  `đã làm tròn lời dạy của Đức Phật”.` 9 khoá còn lại là Pāli không trùng nguyên văn ở
  bài nào khác nên phải dịch mới.
  **Thuật ngữ, đếm được.** `“Kaṇikāraṁva jotantaṁ,` (Pāli trùng nguyên văn 7 khoá:
  5 câu *Rực sáng như hoa kaṇikāra,* / 1 *Tỏa sáng rực rỡ như hoa kaṇikāra,* /
  1 *Rực rỡ như vàng óng,*). `nisinnaṁ pabbatantare;` (trùng 6 khoá: 3 câu
  *đang ngồi giữa khe núi;* / 1 *Đức Phật đang ngự giữa hẻm núi;* / 1 *ngồi giữa
  khe núi;* / 1 *ngự an tọa giữa các rặng núi;* — bốn cách sau đều **thêm chủ từ Đức
  Phật mà Pāli không có**, nên loại; giữ câu 3 lần).
  `Obhāsentaṁ disā sabbā,` (trùng 4 khoá: 3 câu *Ngài tỏa sáng khắp mọi phương trời,*
  / 1 *Soi sáng rạng ngời khắp bốn phương,*). `buddhassa abhiropayiṁ.` (trùng 20 khoá,
  6 cách; lớn nhất 7 câu *rồi dâng lên Đức Phật.* rồi 4 câu *tôi dâng lên cúng dường
  Đức Phật.* và 4 câu *tôi dâng cúng lên Đức Phật.*). Tôi dùng *dâng cúng lên Đức
  Phật.* **không** lặp lại chủ thể *tôi* vì 2.3 đã nêu rồi — đây là khuôn dựng nối
  cụt bằng dạng động từ, không phải mất chủ thể; xem ghi chú ở dưới. `Ekapaññāsito kappe,` → *Vào năm mươi mốt kiếp trước,* (trùng nguyên văn 1
  khoá `tha-ap49`). `Duggatiṁ nābhijānāmi` → *Tôi không còn biết đến đọa xứ,*; tầng
  đang tách làm ít nhất **6** cách (122 *Ta không biết mình rơi vào khổ đau,* / 62
  *Tôi không còn biết đến đọa xứ nào,* / 45 câu này / 45 *Ta không còn biết đến đọa xứ,*
  / 20 *…bất kỳ đọa xứ nào,* / 12 *Ta không hề biết đến đọa xứ,*); tôi chọn câu trung
  tính và dùng nhất quán cho cả lát (`tha-ap208`, `tha-ap214`).
  **Tiền lệ = 0 hoặc tiền lệ hỏng — ghi thẳng, không bịa.**
  (a) `narasārathi` (1.4): toàn bộ tầng `kn` chỉ có **1** tiền lệ, `thag6.1:2.2`
  dịch là *bậc Điều Ngự Trượng Phu* — cách dịch đó không đúng nghĩa (`sārathi` =
  người cầm cương, không phải *trượng phu*). Tôi dùng *đấng Chủ Xế Loài Người* và
  ghi rõ **0** tiền lệ cho cách này; cần người biên tập chốt một lần cho cả tầng.
  (b) `jutindhara` (4.2): **0** cặp Pāli trùng nguyên văn trong `tha-ap`, và tiền lệ
  duy nhất `tha-ap213` (`disvā dantaṁ jutindharaṁ.`) dịch *rực rỡ uy quang* — sai
  nghĩa hẳn. Tôi dùng *bậc Chúa Xứ* (0 tiền lệ) và ghi rõ là chỗ cần người biên tập
  chốt.
  **Câu kệ 2.1-2.4 — đọc lại kỹ, và đây là nội dung riêng của bài.** Vị trưởng lão
  bắn cung bắn rụng một đóa hoa đang nở rồi dâng lên Đức Phật: `Dhanuṁ advejjhaṁ
  katvāna` (đã siết chặt dây cung) / `usuṁ sannayhahaṁ tadā` (khi ấy tôi đã ngắm
  bắn) / `Pupphaṁ savaṇṭaṁ chetvāna` (tôi cắt một đóa hoa nở rộ) / `buddhassa
  abhiropayiṁ` (dâng cúng lên Đức Phật). Ba câu đầu là cụm trạng ngữ nối tiếp
  (`-tvāna`, `tadā`) nên chủ thể *tôi* chỉ cần nêu một lần; 2.4 để dạng động từ
  *dâng cúng lên* là đúng, không phải bỏ chủ thể.
