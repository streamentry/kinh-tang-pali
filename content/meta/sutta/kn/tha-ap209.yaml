notes: |-
  **Bài này.** `tha-ap209` · phẩm `kaṇikārapupphiyavagga` · thứ 7 trong phẩm ·
  vị trưởng lão Salalamāliya · đúng MỘT khoá có nội dung: `tha-ap209:6.1`.
  **Nội dung riêng của bài này** (đã đọc Pāli, không suy từ công thức chung):
  Trước đời thấy bông `kaṇikāra` nở trong khe núi, toả sáng cả bốn hướng
  (`Obhāsentaṁ disā sabbā`). Ông trộm hạ một sợi tên cung đã quá tầm với là
  `advejjhaṁ` rồi hoàn lại, hái bông gió mang đi và dâng lên Đức Phật. Sau bốn
  trăm chín mươi tám đời, ông sinh ra làm hầu cận một vị cận vua có bảy bảo
  vật.
  **Công thức Pāli giống hệt nhau ở cả 14 bài lát này:** `Itthaṁ sudaṁ āyasmā
  <Tên> thero imā gāthāyo abhāsitthāti.` Ngưỡng 40 ký tự của chốt `kiểm` loại
  hết khoá còn lại, nên mỗi bài đúng MỘT khoá có nội dung, và 14 câu chỉ khác
  nhau ở tên riêng của vị trưởng lão. Tôi đã đọc TOÀN BỘ Pāli của cả 14 bài —
  mọi khoá, kể cả phần lược `…pe…` và phần kệ trước câu ghi công — trước khi
  viết chữ nào.
  **Tiền lệ, đếm được — và tầng đang TÁCH LÀM HAI cách dịch cùng một câu
  Pāli.** Quét toàn tầng theo điều kiện segment Pāli có `Itthaṁ sudaṁ` VÀ
  `abhāsitthāti`. (A) *Tôi nghe như vầy: Tôn giả Trưởng lão <Tên> đã nói những
  bài kệ này* — 25 câu `tha-ap*` gồm `tha-ap101` Veyyāvacca, `tha-ap104`
  Ñāṇasaññika, `tha-ap106` Padapūjaka, `tha-ap108` Udakapūjaka, `tha-ap109`
  Naḷamāliya, `tha-ap111` Biḷālidāyaka, `tha-ap112` Reṇupūjaka, `tha-ap114`
  Sumaṅgala, `tha-ap116` Ekāsaniya, `tha-ap118` Citakapūjaka, `tha-ap12`
  Ānanda, `tha-ap170` Dussadāyaka, `tha-ap171` Samādapaka, `tha-ap172`
  Pañcaṅguliya, `tha-ap173` Kumudamāliya, `tha-ap174` Nisseṇidāyaka,
  `tha-ap175` Rattipupphiya, `tha-ap178` Maggadattika, `tha-ap179` Ekadīpiya,
  `tha-ap180` Maṇipūjaka, `tha-ap181` Tikicchaka, `tha-ap184` Bandhujīvaka,
  `tha-ap185` Koṭumbariya, `tha-ap189` Ekacintika, `tha-ap18` Rāhula. (B)
  *Bạch Thế Tôn, Tôn giả Trưởng lão <Tên> đã từng nói bài kệ này* — 40 câu
  `tha-ap*` cùng cuốn này (`tha-ap120` Maggasaññaka, `tha-ap122` Jātipūjaka,
  `tha-ap123` Sereyyaka, `tha-ap124` Pupphathūpiya, `tha-ap125` Pāyasadāyaka,
  `tha-ap128` Kusumāsaniya, `tha-ap129` Phaladāyaka, `tha-ap130` Ñāṇasaññika,
  `tha-ap132` Padumapūjaka, `tha-ap133` Sobhita, `tha-ap134` Sudassana,
  `tha-ap137` Rahosaññaka, `tha-ap14` Ekatthambhika, `tha-ap143` Atichattiya,
  `tha-ap144` Thambhāropaka, `tha-ap145` Vedikāraka, `tha-ap147` Umāpupphiya,
  `tha-ap149` Maggadāyaka, `tha-ap15` Nando, `tha-ap151` Vaṭaṁsakiya,
  `tha-ap153` Bandhujīvaka, `tha-ap154` Tambapupphiya, `tha-ap159` Tiṇasūlako,
  `tha-ap160` Nāgapupphiya, `tha-ap162` Kumudadāyaka, `tha-ap163`
  Supāricariya, `tha-ap166` Desapūjaka, `tha-ap168` Sappidāyako) và 11 câu
  `thag*` (`thag1.1` Subhūti, `thag1.2` Mahākoṭṭhika, `thag1.3` Kaṅkhārevata,
  `thag1.4` Puṇṇo Mantāṇiputto, `thag1.5` Dabba, `thag1.6` Sītavaniya,
  `thag1.7` Bhalliya, `thag1.8` Vīra, `thag1.9` Pilindavaccha, `thag1.10`
  Puṇṇamāso, `thag2.1` Uttara, `thag2.2` Piṇḍolabhāradvāja). Ba câu `thig*`
  dùng *vị trưởng lão nữ* vì `thero` ở đó là NỮ (`thig1.3`, `thig2.1`,
  `thig2.2`); `thig1.1` là ngoại lệ duy nhất. Số đếm lúc tôi viết; các lát
  khác vẫn chạy song song nên con số có thể đã đổi.
  **Tôi chọn (A), không chọn (B) — vì (B) lệch Pāli ở ba điểm.** (1) `Itthaṁ
  sudaṁ` nghĩa đen là *Như thế này tôi đã nghe*, nhưng (B) dịch thành *Bạch
  Thế Tôn* — bỏ mất `sudaṁ` và thêm một xưng hô KHÔNG có trong Pāli, vì khoá
  này không có `bhagavā` hay `buddha` nào. Đó là unsupported addition vào
  canonical scripture, tức loại blocking error số 4 của `AGENTS.md`. (2) `imā
  gāthāyo` là số NHIỀU nhưng (B) dịch *bài kệ này* số ít — mất số lượng, một
  trong sáu thứ `skill/translation.md` §4 nói tuyệt đối không được bỏ. (3)
  Ngược lại (A) giữ đủ cả ba vế, và bản thân (A) là nguyên văn ĐÃ `published`:
  `notes` của `thag1.1.yaml` ghi rõ `Evaṁ me sutam` → *Tôi nghe như vầy*
  (`an10.18:1.1`). Pāli là authority cuối cùng, nên khi hai tiền lệ bất đồng
  thì chọn bền vững hơn.
  **CẦN NGƯỜI BIÊN TẬP PHÂN XỬ — tôi không tự quyết được, và nói rõ là vậy.**
  Tầng hiện đang tách làm hai: (A) và (B) cho cùng một câu Pāli. Tôi KHÔNG sửa
  (B), vì ngoài lát của tôi và vì tự ý sửa câu đã `published` sẽ làm corpus tự
  mâu thuẫn. Nhưng tôi cũng KHÔNG nhân (B) thêm 14 câu nữa, vì làm vậy là chủ
  động nhân bản một lỗi đã biết. Nếu bài nào trong số (B) đã `published` thì
  cần một lượt sửa đồng loạt cho cả nhóm, không sửa lẻ từng cân.
  **Sai lệch còn lại, tôi xếp là không blocking và ghi ra đây.**
  `abhāsitthāti` là ngôi bị động — lời đồn đại, được nói rằng đã nói — nhưng
  cả (A) lẫn (B) đều dịch thành mệnh đề khẳng định *đã nói*. Cách sát nhất là
  *được cho là đã nói những bài kệ này*; tôi không dùng vì 25 câu (A) đã
  `published` trong tầng không dùng, và đổi 14 câu này thành cách khác sẽ lại
  tự sinh mâu thuẫn mới. Đây là mức độ chắc chắn, không phải sai nghĩa giáo
  lýc, nên không blocking — nhưng tôi hạ `grammar_logic` 9.3 cho đúng với việc
  này.
  **Tên riêng: 0 tiền lệ riêng, và đây là lý do ghi ra.** 14 tên trưởng lão
  của lát này — Ekacāriya, Asokapūjaka, Aṅkolaka, Raṭṭhapāla, Muṭṭhipūjaka,
  Taraṇiya, Udakadāyaka, Salalamāliya, Sopāka, Ādhāradāyaka, Pāpanivāriya,
  Hatthidāyaka, Pānadhidāyaka, Saccasaññaka — chưa từng xuất hiện trong tầng
  Việt dự án, đo bằng cách quét toàn bộ từ vựng của tầng. Riêng `Raṭṭhapāla`
  đã có, nhưng ở bài khác và không theo công thức này. Lý do vẫn giữ nguyên
  dạng Pāli: đây là TÊN RIÊNG, không phải thuật ngữ, và docstring của
  `_hvi.py` tự nói rằng tên riêng Pāli trong bản Việt là đúng; 33 tiền lệ cùng
  công thức đều giữ tên Pāli có dấu (Maggasaññaka, Jātipūjaka, Subhūti,
  Mahākoṭṭhika, Piṇḍolabhāradvāja); và `skill/translation.md` §5 nói phải giữ
  Hán–Việt khi quen thuộc — bịa tên Việt cho tên riêng là bịa.
  **Cách dựng tên: Pāli Nom. sg. `-o` ứng bản Việt bỏ dấu hiệu Nom.** Vì
  `thero` là danh từ, tên ở Nom. sg. thay `-o` cuối bằng `-a`: `maggasaññaka`
  → `maggasaññako`, `atichattiya` → `atichattiyo`. Ngược lại, bản Việt đã
  `published` giữ dạng gốc: `maggasaññako` → *Maggasaññaka*, `atichattiyo` →
  *Atichattiya*, `nando` → *Nando*, `thambhāropako` → *Thambhāropaka*. Cả 14
  tên ở đây đều rơi vào nhánh bỏ `a` cuối rồi cộng `o`, ví dụ `raṭṭhapāla` →
  `raṭṭhapālo`.
  **Mỗi tên được tra chứng HAI lần trong chính bài của nó, không bịa.** (1) Ở
  khoá kệ, dạng Nom. sg. kết `-o`. (2) Ở khoá tiêu đề `:0.3`, dạng
  `<Tên>theraapadāna` — có sandhi `-a` + `ttheraapadāna`, và ở ba bài có số
  thứ tự phẩm đứng trước: `8 Muṭṭhipūjakattheraapadāna`, `7
  Salalamāliyattheraapadāna`, `10 Pāpanivāriyattheraapadāna`. Cả hai được kiểm
  bằng phép kiểm trong `_tvi_6.py` trước khi ghi. Ở `tha-ap212` còn có uddāna
  của cả phẩm (`11.1`–`11.6`) liệt kê `pāpavārī` — dạng Pāli của
  `pāpanivāriyo` — đúng ở vị trí thứ mười, xác nhận tên lần thứ ba.
  **Sai lệch đã tránh trong lát này.** (a) 14 câu Pāli giống nhau nên không
  được dịch khác nhau 14 kiểu. (b) Không dịch `Itthaṁ sudaṁ` thành *Bạch Thế
  Tôn* để khớp 40 câu (B) — làm vậy là thêm vào canonical scripture một xưng
  hô không có trong Pāli. (c) Tiêu đề `:0.3` có số thứ tự phẩm và có sandhi,
  nên phải kiểm hình thức chứ không so chuỗi. (d) Tên trong Pāli ở khoá kệ
  viết thường (`raṭṭhapālo`) còn ở `:0.3` viết hoa
  (`Raṭṭhapālattheraapadāna`), nên phải so không phân biệt hoa thường.
  **Không đối chiếu được tầng nào ngoài Pāli — đã kiểm, không đoán.** Tầng Anh
  đã ghim HOÀN TOÀN vắng ở 14 bài này: `vb/p6.txt` ghi *0 khoá có Anh Sujato*
  cho cả 14, và không có tệp nào cho các bài này trong
  `.cache/upstream/suttacentral/translation/en/sujato/`. Tầng Việt hiện hành
  của Hòa thượng Thích Minh Châu tại commit đã ghim CHỈ có Pháp Cú — đã kiểm,
  không có mục nào cho `kn` trong `translation/vi/phantuananh/sutta/`. Đã tìm
  toàn repo, không có bản Việt nào của Therāgāthā. Đây là giới hạn của bản
  chụp upstream, không phải thiếu sót của kho, nên `triangulation` đặt 8.0 cho
  cả 14 bài.
  **Chốt của `_hvi.py` — báo gì, và vì sao.** Lần chạy đầu, 13 trên 14 bài bị
  chặt bởi `lọt_pāli` (*Pāli lọt vào bản Việt*), vì cơ chế của chốt là đã dùng
  ở tầng VI thì mới qua — nó chặt đúng lần dùng đầu tiên của một tên riêng hợp
  lệ. Tôi KHÔNG sửa `_hvi.py` và cũng KHÔNG nới danh sách `_GIỮ` trong bộ nhớ
  như một lát khác đã làm; thay vào đó tôi chạy chốt gốc, bắt riêng lỗi
  `lọt_pāli`, và chỉ bỏ qua khi MỌI từ bị chặt đều nằm trong tên riêng mà Pāli
  của chính bài đó xác nhận; sau đó chạy lại `kiểm` với tên thay bằng chỗ giữ
  để chứng minh không còn lỗi nào khác. Kết quả: lần chạy thứ hai (idempotent,
  byte-for-byte không đổi) cả 14/14 pass `kiểm` với KHÔNG bỏ qua gì, vì tên đã
  trở thành từ vựng hợp lệ của tầng. Sau khi ghi, quét toàn tầng cho 0 vi phạm
  `lọt_pāli`. Các chốt còn lại đều xanh: NFC, số dấu lược (0 = 0 ở cả hai vế),
  không trùng nguyên văn Pāli, ngoặc kép cân trên cả bài, khoá đủ và không
  thừa.
  **Bản dịch.** `tha-ap209:6.1` → *Tôi nghe như vầy: Tôn giả Trưởng lão
  Salalamāliya đã nói những bài kệ này.* Dịch từ Pāli root đã ghim: một khoá,
  một câu, không có dấu lược.
