  BÀI SONG SONG — `tha-ap523` (Tiṇadāyakavagga) có **cùng bốn vế kệ** `4.1–5.4` và `6.1–8.4`, chỉ khác
  `migarāja`/`Sambuddhaṁ` và một số dạng ngữ pháp (`Aciraṁ gatamattassa` thay `gatamattaṁ maṁ`). Tôi dịch
  theo `tha-ap523` ở chỗ Pāli trùng nguyên văn. `tha-ap523` **chưa** có bản Việt trong tầng nên không có
  xung đột.

  THUẬT NGỮ, đếm được: `Therāpadāna` 327/336 · `Ekapadumiyavagga` → *Phẩm Ekapadumiya* — **6/8** (tha-ap346
  và tha-ap351 dùng *Phẩm Bậc Một Hoa Sen*) · `Sataraṁsīva` không có tiền lệ → *như trăm tia nắng mặt
  trời* · `satabheṇḍu` không có tiền lệ (tha-ap/ja chỉ có `satageṇḍu` = *trăm quả bóng tròn*) → *trăm ngọn
  tháp* · `yūpo` 1 tiền lệ (ja264:1.2 *người có cột tế lễ bằng vàng ròng*, thag2.22:1.2) → *cột đài vàng
  ròng*. Tên riêng `Tiṇamuṭṭhidāyaka` **0 tiền lệ** trong tầng ⇒ giữ dạng Pāli, khai vào bộ nhớ tiến
  trình `_hvi._GIỮ` sau khi kiểm chứng.

  BẤT ĐỊNH:
  (1) `Sumutto saravegova, / devalokaṁ agañchahaṁ.` (6.3–6.4) — cụm này lặp y hệt ở **8** bài `tha-ap`
      (tha-ap3:126.3, tha-ap11:14.3, tha-ap523:5.3, tha-ap544, 547, 546, 562, và bài này) nhưng **không bài
      nào trong số đó có bản Việt**, nên không có tiền lệ. `saravega` = *rùng rình* (rợn người);
      `Sumutto` tôi đọc là *hoàn toàn thoát kiếp* (`su-mutta`), dịch *Tuy đã thoát kiếp, vẫn rùng rình, /
      ta đã tới cõi trời.* Cách đọc khác (chẳng hạn `Sumutto` là một danh từ riêng) sẽ đổi nghĩa cả vế.
  (2) `Āsanne me kataṁ kammaṁ, / buddhaseṭṭhe anāsave;` (6.1–6.2) — `anāsava` ở đây **không** phải *vô lậu
      hoặc* (nghĩa quen thuộc trong tầng) mà là *không hề chật hẹp* khi ban tặng, nên tôi dịch *dâng lên Đức
      Phật tối thượng, không hề chật hẹp*. Nếu đọc theo nghĩa *vô lậu* thì câu kệ nói ngược ý nghĩa của
      chính nó (một người vừa dâng cúng không hề chật hẹp thì không thể đã vô lậu theo nghĩa còn lậu).
  (3) `migarājā apothayi` (5.2) — `migarāja` = *con sư tử chúa loài thú* (vì `5.3 Sīhena pothito` xác nhận
      người đàn ông bị **sư tử** đánh); `pothita` tôi dịch *vồ đánh*.
  (4) `Migaluddo tadā āsiṁ` (2.1) — tầng có hai cách cho `Migaluddo`: pv32:2.3 *Bằng người tên Bắn Hươu*
      (xem như tên) và tha-ap520:1.1 *Trước kia ta là thợ săn nai* (xem như nghề). Vì `2.2` ngay sau là
      *sống trong rừng sâu chốn hoang vu* nên tôi chọn *Lúc ấy ta là thợ săn nai,* — cũng là cách dùng của
      bài cùng cốt truyện.
  (5) `tiṇamuṭṭhimadāsahaṁ` (3.4) và `tiṇamuṭṭhidāyidaṁ phalaṁ` (10.4) — `mādāsa` = *nắm tay*, tôi dịch *đủ
      một nắm tay* và *một nắm cỏ*; không có tiền lệ cho `mādāsa` trong tầng.

