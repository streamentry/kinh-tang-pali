notes: |-
  TẦNG THAM KHẢO — đo (xem `blocking_errors`). Coverage Anh = **0/2** khoá Pāli có nội dung = 0% ⇒ `draft`,
  `triangulation` 7.5.

  48 khoá, đủ 48/48. Dấu lược: `:11.2` là `…pe…` ⇒ **một** `…`, không mở rộng. Nháy kép: 1 cặp, `:1.1`
  mở / `:11.3` đóng.

  PĀLI TRÙNG NGUYÊN VĂN — 12 khoá trùng có bản Việt, dùng lại **nguyên văn cả 12**:
  `Himavantassāvidūre,` (tha-ap78:1.1) · `araññe kānane ahaṁ;` (tha-ap98:1.2, tha-ap353:1.2, tha-ap85:1.4) ·
  `sayambhuṁ aparājitaṁ.` (tha-ap367:1.4, tha-ap518:1.4) · `Vippasannena cittena,` (tha-ap28:1.4) ·
  `nisīdanamadāsahaṁ;` (tha-ap78:4.2) · `bhiyyo cittaṁ pasādayiṁ;` (tha-ap325:2.4) ·
  `Sambuddhaṁ abhivādetvā,` (tha-ap85:3.3) · `pakkāmiṁ uttarāmukho.` (tha-ap110:2.4) ·
  `Aciraṁ gatamattaṁ maṁ,` (tha-ap83:6.1) · `tattha kālaṅkato ahaṁ.` (tha-ap68:5.4) ·
  `sukkamūlena codito;` (tha-ap187:4.2) · `pattomhi āsavakkhayaṁ.` (tha-ap96:2.4). Riêng `3.1`
  chỉ đổi **dấu tiết thúc** `.` → `,` để câu kệ 3.1–3.2 khép đúng nhịp; chữ vẫn nguyên văn.

  BÀI SONG SONG — `tha-ap523` (Tiṇadāyakavagga) có **cùng bốn vế kệ** `4.1–5.4` và `6.1–8.4`, chỉ khác
  `migarāja`/`Sambuddhaṁ` và một số dạng ngữ pháp (`Aciraṁ gatamattassa` thay `gatamattaṁ maṁ`). Tôi dịch
  theo `tha-ap523` ở chỗ Pāli trùng nguyên văn. `tha-ap523` **chưa** có bản Việt trong tầng nên không có
  xung đột.

  THUẬT NGỮ, đếm được: `Therāpadāna` 327/336 · `Ekapadumiyavagga` → *Phẩm Ekapadumiya* — **6/8** (tha-ap346
  và tha-ap351 dùng *Phẩm Bậc Một Hoa Sen*) · `Sataraṁsīva` không có tiền lệ → *như trăm tia nắng mặt
  trời* · `satabheṇḍu` không có tiền lệ (tha-ap/ja chỉ có `satageṇḍu` = *trăm quả bóng tròn*) → *trăm ngọn
  tháp* · `yūpo` 1 tiền lệ (ja264:1.2 *người có cột tế lễ bằng vàng ròng*, thag2.22:1.2) → *cột đài vàng
  ròng*. Tên riêng `Tiṇamuṭṭhidāyaka` **0 tiền lệ** trong tầng ⇒ giữ dạng Pāli, khai vào bộ nhớ tiến
  trình `_hvi._GIỮ` sau khi kiểm chứng.

  BẤT ĐỊNH:
  (1) `Sumutto saravegova, / devalokaṁ agañchahaṁ.` (6.3–6.4) — cụm này lặp y hệt ở **8** bài `tha-ap`
      (tha-ap3:126.3, tha-ap11:14.3, tha-ap523:5.3, tha-ap544, 547, 546, 562, và bài này) nhưng **không bài
      nào trong số đó có bản Việt**, nên không có tiền lệ. `saravega` = *rùng rình* (rợn người);
      `Sumutto` tôi đọc là *hoàn toàn thoát kiếp* (`su-mutta`), dịch *Tuy đã thoát kiếp, vẫn rùng rình, /
      ta đã tới cõi trời.* Cách đọc khác (chẳng hạn `Sumutto` là một danh từ riêng) sẽ đổi nghĩa cả vế.
  (2) `Āsanne me kataṁ kammaṁ, / buddhaseṭṭhe anāsave;` (6.1–6.2) — `anāsava` ở đây **không** phải *vô lậu
      hoặc* (nghĩa quen thuộc trong tầng) mà là *không hề chật hẹp* khi ban tặng, nên tôi dịch *dâng lên Đức
      Phật tối thượng, không hề chật hẹp*. Nếu đọc theo nghĩa *vô lậu* thì câu kệ nói ngược ý nghĩa của
      chính nó (một người vừa dâng cúng không hề chật hẹp thì không thể đã vô lậu theo nghĩa còn lậu).
  (3) `migarājā apothayi` (5.2) — `migarāja` = *con sư tử chúa loài thú* (vì `5.3 Sīhena pothito` xác nhận
      người đàn ông bị **sư tử** đánh); `pothita` tôi dịch *vồ đánh*.
  (4) `Migaluddo tadā āsiṁ` (2.1) — tầng có hai cách cho `Migaluddo`: pv32:2.3 *Bằng người tên Bắn Hươu*
      (xem như tên) và tha-ap520:1.1 *Trước kia ta là thợ săn nai* (xem như nghề). Vì `2.2` ngay sau là
      *sống trong rừng sâu chốn hoang vu* nên tôi chọn *Lúc ấy ta là thợ săn nai,* — cũng là cách dùng của
      bài cùng cốt truyện.
  (5) `tiṇamuṭṭhimadāsahaṁ` (3.4) và `tiṇamuṭṭhidāyidaṁ phalaṁ` (10.4) — `mādāsa` = *nắm tay*, tôi dịch *đủ
      một nắm tay* và *một nắm cỏ*; không có tiền lệ cho `mādāsa` trong tầng.

  CỔNG KỸ THUẬT CHƯA CHẠY — xem `blocking_errors`. `technical_integrity` 9.6, không tuyên bố technical gate
  pass. Bốn lệnh để coordinator chạy: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Sửa lan 2026-10-13. (1) `:1.4` `đã đi đến gần núi ấy.` → `đã kinh hành ngoài trời.`: Pāli `abbhokāsamhi caṅkami`, theo `tha-ap178:1.4`, `tha-ap523:1.4`. (2) `:3.2`–`:3.4` (`Nisīdanatthaṁ buddhassa, tiṇamuṭṭhimadāsahaṁ`) → `khi ấy, dâng bậc Đại Ẩn Sĩ ấy, / để làm chỗ ngồi cho Đức Phật, / ta đã dâng một nắm cỏ.` — `madāsahaṁ` là `adāsiṁ ahaṁ` (đã dâng), không phải `mādāsa` `nắm tay`; câu trong notes cũ về `mādāsa` không còn hiệu lực. (3) `:5.2` `gầm lên` → `đánh ta` (`apothayi`, theo `tha-ap523:4.2`). (4) `:6.2` `không hề chật hẹp` → `bậc không còn lậu hoặc` (`anāsave`). (5) `:6.3` `Tuy đã thoát kiếp, vẫn rùng rình,` → `Như tốc lực của mũi tên khéo buông,` (`Sumutto saravegova`, theo `tha-ap523:5.3`). (6) `:7.1` `cột đài vàng ròng` → `cột trụ đẹp đẽ`; `:8.1` `Hào quang của Ngài` → `Hào quang của cột ấy`; `:8.2` `như mặt trời trăm tia sáng đã mọc` (6 tiền lệ); `:8.3` `Được đông đảo thiên nữ vây quanh`; `:8.4` `tỏa ra mùi thơm ngọt ngào của tình yêu` → `tôi hoan hỷ, toại nguyện mọi ước muốn.` (`āmodiṁ kāmakāmahaṁ`, theo `tha-ap558:16.4`). (7) `:10.2` `làm chỗ ngồi nằm;` → `tôi đã dâng chỗ ngồi;`.

  Sửa lan 2026-10-13 (cơ học, toàn tầng): khoá tha-ap350:10.3 — `duggatiṁ nābhijānāmi` trước dịch “Ta
  không biết mình rơi vào khổ đau,”, đảo nghĩa (Pāli: không còn biết đến, tức không còn rơi vào, đọa
  xứ nào) → “Ta không còn biết đến đọa xứ,”; giữ nguyên xưng hô của bài. Cùng công thức đã dịch đúng ở
  đa số khoá trong tầng.

  Rà soát lỗi lặp 2026-10-15 (đợt 2, đối chiếu Pāli đã ghim; không có bản Anh hay Việt độc lập cho
  tầng này): sửa 5.1, 6.1, 7.3 (lỗi chung với tha-ap523 bản nháp đầu): 5.1 `Aciraṁ gatamattaṁ maṁ`
  "Chỉ chút ít thời gian thôi" bỏ mất `gatamatta` (vừa đi) nên đổi thành "Vừa đi chưa bao lâu"; 6.1
  `Āsanne` "ở ngay đây" đổi thành "vào lúc cận kề" khớp tha-ap523:5.1 (`āsanna` là gần); 7.3
  `satabheṇḍu` "trăm ngọn tháp" đổi thành "trăm quả cầu" khớp tha-ap523:6.3 và tha-ap312:2.3. Các khoá
  khác của bài không đổi.
