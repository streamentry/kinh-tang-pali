notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng tham khảo tiếng Anh nào ở commit đã ghim cho ja460.
  Tiền lệ đếm được: `Jātaka` -> Jātaka 418/434; `6. Yudhañcayajātaka` -> 6. Kinh Yudhañcaya theo mẫu ja445/ja446; `Yudhañcayajātakaṁ chaṭṭhaṁ.` -> Kinh Yudhañcaya thứ sáu. `rathesabha` -> bậc chiến xa đệ nhất (đa số trong 17 cặp đã dịch; đức người cầm xe 2, bậc ngự chiến xa 2, bậc thiên tượng 1); `rāja` -> nhà vua (17 lần trong bộ Jātaka đã dịch); `tāta` -> con ơi, `amma` -> mẹ ơi; `pabbaja` -> xuất gia (791 cặp ở toàn tầng); `maccuno` -> Makkha (Makkha đã có 29 lần trong tầng Việt dự án).
  HAI TÊN PHẨM 0 TIỀN LỆ, dựng từ tầng `name/` đã ghim (cùng commit với bản thân kinh), không tự đặt: `Ekādasakanipāta` — `ja-name:510` -> The Book of the Elevens ⇒ Bộ Mười Một Bài Kinh (cùng cách dựng với Bộ Một Bài Kinh ở `ja-name:1` và Bộ Hai Bài Kinh ở `ja-name:167` trong bảng đã chốt của BRIEF_VI3 §11). `Mātuposakavagga` — `ja-name:511` -> The Elephant Who Cared for His Mother ⇒ Phẩm Voi Hiếu Mẹ. Cần người điều phối ghi vào bảng tên để lát sau không phát minh thêm cách nữa.
  BẤT ĐỊNH ghi lại: (1) `Yo taṁ hiṁsati vāremi` (2.3) dịch Ai mà nói điều ấy, ta sẽ bảo — `hiṁsati` là nói, `vāremi` là ta sẽ nói; cách đọc khác là người nói về chỗ kể. (2) `sūriyuggamanaṁ pati` (7.2) dịch tỏa sáng tới chỗ tận cùng — câu này là ẩn dụ về nắng vươn tới ngọn cỏ, đã giữ cả hai vế. (3) `Yudhañcayo anuññāto, sabbadattena rājinā` (9.3-9.4) dịch Yudhañcaya không được phép, nhà vua cùng tất cả tài sản của mình — câu Pāli bị cắt cụt ở giữa, không có văn xuôi để đối chiếu. (4) `hiṁsitā me na vijjati` (3.2) dịch trong ta không hề có lòng ham muốn ấy. (5) `tāta`/`amma` trong 1.3 và 4.3 đảo chiều xưng hô (con gọi cha, cha gọi con) — giữ nguyên chiều của Pāli.
  Vì bản root `pli/ms` chỉ có thơ, KHÔNG có văn xuôi cho Jātaka, nên khung truyện không thể đối chiếu ở commit đã ghim.
  Dấu lược: Pāli ja460 không có `…pe…`; đếm lược 0 = 0.
  Chốt `_hvi.py` sạch: 49/49 khoá, khoá thừa 0, NFC OK, ngoặc kép cân và khớp đúng cấu trúc Pāli (mở ở 1.1, 2.1, 3.1, 4.1, 5.1, 6.1, 7.1, 8.1, 9.1, 11.1; đóng ở 1.4, 2.4, 3.4, 4.4, 5.4, 6.4, 7.4, 8.4, 10.4, 11.4 — 9.1 mở và 10.4 đóng vì lời vua kéo dài ba câu kệ). `Jātaka` ở 0.1 giữ nguyên Pāli là quy ước của bộ.
