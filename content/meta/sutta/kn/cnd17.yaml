  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 68 khoá chênh lệch lớn nhất → khác nghĩa 1 loại, sửa 11 khoá (2 trong tệp chênh lệch: `1.6`, `26.3`; 9 ngoài tệp: `15.1`, `15.3`, `17.6`, `28.2`, `28.4`, `28.6`, `29.1`, `29.3`, `31.3`): `aññā`/`aññāvimokkha` "thắng trí" → "chánh trí". Bản cũ dùng "thắng trí" cho cả `aññā` lẫn `abhiññā` (`13.1`–`13.2` `abhiññāpāragū` "bờ kia về thắng trí") nên hai từ Pāli khác nhau cùng một chữ Việt trong cùng bài; `aññā` là trí tối thượng của bậc A-la-hán, lời giải `15.1` và `29.1` nói rõ `aññāvimokkho vuccati arahattavimokkho`; tầng đã dịch `diṭṭheva dhamme aññā` là "chánh trí" (`dn22:22.2`, `mn70:27.8`). Số đếm trước đó chia gần đôi (chánh trí 21 khoá, thắng trí 28 khoá) nên không phân xử bằng số đếm, phân xử bằng Pāli và bằng việc tránh trùng với `abhiññā`; `13.1`–`13.2` giữ "thắng trí". Giữ 66 khoá còn lại (khác diễn đạt hay thuật ngữ: `Pārāyana` "Phẩm Bờ Kia", "Kể Lược", `thina` "hôn trầm", `kukkucca` "hối hận", `vitakka` "suy nghĩ" ở kệ so với "tầm" ở lời giải, giữ như đã ghi ở bất định 3). Bất định 4, không phân xử được: `7.4` `maccuhāyino` ("hàng phục tử thần", 5 khoá khác cùng Pāli ở tầng dịch như vậy; ba cách khác ở `sn6.13` "chiến thắng", `an3.58` "vượt qua", `thag2.5` và `iti73` "thắng"), `11.1` `visatā` ("tham ái lan tỏa" theo `mnd1:28.4`, bản mù ghi không chắc), `21.2` chuỗi đồng nghĩa của `thina` (`mnd15:95.4` dịch khác nhưng cùng công thức), `38.1`/`38.7` "sự rong ruổi của suy nghĩ" so với "suy nghĩ là sự rong ruổi" ở `36.2`: cùng một sở hữu cách `vitakkassa`. Nhận định (b) về `aññā` trong mục "Nghi ngờ nhưng quyết định không đổi" ở trên thuộc bản cũ và bị mục này thay thế. Cùng kệ còn "thắng trí" ở `cnd2:74.6`, `cnd2:76.3` (ngoài lát này) và "tri ngộ" ở `an3.33:5.3`. Không có bản Anh hay bản Việt độc lập khác.
