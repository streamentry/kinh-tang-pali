notes: |-
  **Phạm vi: đủ 263/263 khoá của cnd17, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Cūḷaniddesa chú giải Câu hỏi của thanh niên Udaya (Pārāyana, câu hỏi thứ mười ba), tức bài kệ `snp5.14`. Cấu trúc như `cnd15`, `cnd16`, `cnd20`: dẫn từng đoạn kệ, giải từng cụm, rồi nhắc lại cả đoạn kệ (kệ in đậm ở `1`, `18`, `26`, `32`, `36`, `41`, `47`; nhắc lại trong ngoặc kép ở `17`, `25`, `31`, `35`, `40`, `46`, `53`; thêm kệ về chữ *rajo* ở `3`–`5`, kệ trích ở `11` và kệ ngồi bên sườn núi ở `7`, không in đậm, không có nháy). Pāli có 86 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 34 khoá chứa `…pe…` (đều thành đúng một `…`) và 4 khoá chứa `…` trần (`23.3`–`23.6`, giữ một `…` mỗi khoá), 0 khoá có `(…)`, 1 khoá kết `….` (`6.1`, viết ` ….`). 35 khoá có nháy kép, 4 khoá có ngoặc đơn, 0 khoá có nháy đơn; tất cả khớp Pāli từng khoá.

  **Cách trình bày lemma** theo `cnd16`, `cnd15`, `cnd20`: `Từ được giải: lời giải`, kết bằng dấu gạch dài khi Pāli có `—`, rồi lặp lại cụm ở khoá kế. Giữ nguyên chữ Pāli ở hai chỗ: `Iccā` (`9.2`, theo `cnd16:3.13`, `cnd14:7.8`) và tên riêng `Pāsāṇaka` (`6.2`, theo `cnd21:2.5`, `cnd3:1.1`). Các khoá lời giải về xưng hô (`9.1`–`9.5`, `19.5`–`19.8`) theo `cnd16:3.12`–`3.16`, `cnd16:17.17`–`17.20`, `cnd15:18.10`–`18.12`: *Tôn giả Udaya nói*, *Này Udaya, Đức Thế Tôn nói*, *Này Udaya: Đức Thế Tôn gọi vị Bà-la-môn ấy bằng tên*. Khoá `2.3` liệt kê đúng 16 loại thiền rồi ba danh hiệu kết; khoá `13.7` liệt kê 12 cặp `-gato/-patto`.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `cnd17`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; không có tệp `cnd17_translation-en-sujato.json` (chỉ có tệp `cnd-name`, là nhãn tác phẩm, không phải văn bản kinh); manifest chỉ khai `cnd17_root-pli-ms.json`. Lớp `english-project` không có `cnd17`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **110** khoá (111 nếu tính cả thẻ); Sujato phủ 0/110 (`not-published-upstream`, giới hạn của bản chụp, không phải lỗi người dịch), `english-project` 0/110, `vietnamese-current` 0/110. `cnd17` chưa có entry trong `reference-gaps.yaml`; entry chỉ thừa nhận mất tầng chứ không cứu được `published`; việc chạy `npm run reference:gaps` để người điều phối làm. Bản Sujato của `snp5.14` (bài kệ trùng Pāli) đã được đọc để kiểm cách parse các dòng kệ, nhưng đó là bản của **bài khác** nên không tính là đối chiếu English của cnd17; Sujato dịch `virajamāsīnaṁ` là *rid of hopes*, khác lời giải của chính cnd17 (xem bất định 1). Chứng cứ độc lập còn lại là các bản đã dịch của `snp5.14`, `snp3.11`, `sn8.10`, `sn1.64`, `sn1.65`, `an3.33`, `dhp386` và công thức chú giải ở `cnd6`, `cnd12`, `cnd13`, `cnd14`, `cnd15`, `cnd16`, `cnd20`, `cnd21`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm) trùng với khoá đã dịch ngoài bài này: so khớp nguyên dấu câu 64 khoá (231 cặp), 53 khoá có bản Việt khớp một tiền lệ (sau khi bỏ dấu câu và chữ hoa/thường), 11 khác; so khớp sau khi bỏ dấu câu và chữ hoa/thường 108 khoá (331 cặp), 85 khoá khớp, 23 khác. Nguồn dùng lại: `snp5.14` cho gần như mọi dòng kệ ở `1`, `17`, `18`, `25`, `26`, `31`, `32`, `35`, `36`, `40`, `41`, `46`, `47`, `53` (trừ các khoá nêu dưới đây); `snp3.11:37.1`–`37.4` cho `11.1`–`11.4`; `sn8.10:3.3`, `3.4`, `5.2` cho `7.3`, `7.4`, `7.2`; `sn1.64:1.2`, `2.2` (cùng Pāli `sn1.65`) cho `32.2`, `35.2`, `36.2`, `40.2`; `cnd16:3.13`, `3.14`, `4.6`, `17.19`, `3.2` cho `9.2`, `9.3`, `13.8`, `19.7`, `39.2`; `cnd15:31.2`, `31.3`, `8.6`, `21.4`, `34.1`, `34.2` cho `12.2`, `12.3`, `16.3` (cùng `34.6`, `45.4`), `24.3` (cùng `30.5`, `39.5`, `52.3`), `54.1`, `54.2`; `cnd16:0.1`–`0.3` cho `0.1`–`0.3`. Theo công thức (không nguyên văn): `13.3`–`13.6` theo `mn111:21.2`; `27.4` theo `dn10:2.21.1`; `10.1`, `2.6`, `12.4` (chuỗi *đã được đoạn trừ, cắt tận gốc rễ, làm thành như gốc cây thốt nốt bị chặt, làm cho không còn hiện hữu, khiến không thể sinh khởi trong tương lai*) theo `cnd16:3.7`, `4.3`, `mn72:20.5`; `42.1`, `51.1` theo `cnd15:11.7`; `44.1` theo `cnd15:6.4`, `6.5`; `15.2`, `29.2` theo `cnd15:7.9`; `48`–`50` theo `cnd15:26.2`–`26.3`; `38.3` theo `cnd12:6.1`; `33.2`, `37.3` theo `cnd16:26.3`; `30.2` theo `sn12.2:14.2`; `19.6`, `19.8` theo `cnd16:17.18`, `17.20`, `cnd15:18.10`, `18.12`. Các khoá Pāli trùng mà bản Việt khác, kèm lý do:
    - `1.1`, `8.4`, `17.1` (trùng `snp5.14:1.1`, `dhp386:1`): viết *không bụi, đang ngồi*, không dùng lại *không còn cầu mong* của `snp5.14:1.1` (xem bất định 1).
    - `7.1` (trùng `sn8.10:3.1`): viết *Đang ngồi bên sườn núi*, vì `sn8.10:3.1` đưa *bậc ẩn sĩ* vào dòng một trong khi Pāli dòng một chỉ có `nagassa passe āsīnaṁ`, còn `muniṁ` ở dòng hai; `7.2` dùng *bậc ẩn sĩ* của `sn8.10:5.2` (cùng Pāli `muniṁ dukkhassa pāraguṁ`), không dùng *bậc thánh trí* của `sn8.10:3.2`.
    - `18.2`, `25.2`, `19.8` (trùng `snp5.14:2.2` *(Đức Thế Tôn trả lời:)*): viết *(Này Udaya, Đức Thế Tôn nói,)* và *Này Udaya, Đức Thế Tôn nói* để giữ hô ngữ `udayā`, theo `cnd15:17.2`, `cnd16:16.2`, `cnd16:17.20`.
    - `18.3`, `20.4`, `25.3` (trùng `snp5.14:2.3`, `an3.33:4.2`): xem bất định 2.
    - `24.2` (trùng `an3.33:4.4` *và sự ngăn chặn hoặc hối*): dùng *sự ngăn chặn hối hận* của `snp5.14:2.5`, vì bài kệ gốc và vì `kukkucca` → *hối hận* (xem thuật ngữ).
    - `35.4`, `40.4` (trùng `sn1.64:1.4`, `2.4` *mới được gọi là Niết-bàn*): giữ *mà nói đến Niết-bàn* của `snp5.14:4.4`, `5.4`, bài kệ gốc của cnd17, để `32.3`–`32.4` và `35.3`–`35.4` khớp nhau và khớp lời giải `34.4`, `39.1`.
    - `47.1`–`47.2`, `53.1`–`53.2` (trùng `snp5.14:7.1`–`7.2`): giữ đúng thứ tự dòng Pāli (*Ở trong và ở ngoài, / không hoan hỷ với thọ*); `snp5.14:7.1` dịch dòng `vedanaṁ nābhinandato` trước và `7.2` dịch `ajjhattañca bahiddhā ca` sau, tức đảo hai dòng.
    - `29.3`, `38.7`, `42.2`, `43.2`, `52.2` là lemma lặp lại cụm cuối lời giải, nên là cụm danh từ hay mệnh đề chứ không phải cả dòng kệ (`sn1.64:2.2` *Suy nghĩ là sự rong ruổi của nó* là cả câu, `38.7` viết *sự rong ruổi của suy nghĩ*; `42.2` mang *như thế nào*; `43.2`, `52.2` không có *như thế nào* và không có *thì* của `47.4`).

  **Trong chính bài:** 25 nhóm Pāli trùng nguyên văn (38 cặp, sau khi bỏ thẻ in đậm), 22 nhóm có bản Việt giống hệt, 3 nhóm khác: [`32.4`, `36.4`] và [`35.4`, `40.4`] (câu hỏi kết bằng *?*, câu đáp kết bằng *.*, đúng như `snp5.14:4.4` và `5.4`) và [`43.2`, `47.4`, `52.2`] (`47.4` là dòng kệ nên viết *thì thức chấm dứt*, đúng như `snp5.14:7.4`; `43.2`, `52.2` là lemma nên không có *thì*). Đo thêm bằng cách bỏ dấu câu và chữ hoa/thường: 35 nhóm (94 cặp), 5 nhóm khác: [`1.1`, `8.4`, `17.1`] (*Đối với* ở dòng kệ), [`26.3`, `29.3`, `31.3`] (*Ta nói đó là …* so với lemma *ta nói …*), [`36.2`, `38.7`, `40.2`] (dòng kệ *suy nghĩ là sự rong ruổi của nó*, lemma *sự rong ruổi của suy nghĩ*), [`41.1`, `42.2`, `46.1`] (*Đối với người sống chánh niệm* so với lemma *như thế nào đối với …*), [`41.2`, `43.2`, `46.2`, `47.4`, `52.2`] (*thức chấm dứt như thế nào?* / *thức chấm dứt* / *thì thức chấm dứt*); đều khác vị trí cú pháp (dòng kệ hay lemma), không khác nghĩa. Mỗi kệ lặp hai lần mang cùng bản Việt (`1`/`17`, `18`/`25`, `26`/`31`, `32`/`35`, `36`/`40`, `41`/`46`, `47`/`53`), chỉ khác dấu nháy đầu và cuối theo Pāli từng khoá.

  **Thuật ngữ, kèm số đếm (phạm vi tầng; nêu cả hai số khi phạm vi gần nhất cho đa số khác).**
    - `rajo` → *bụi* (27 khoá chứa `rajo`; `dn14:1.34.4`, `sn1.22:2.4`, `an4.50:3.1`); `viraja` → *không bụi* (102 khoá chứa `virajaṁ`, vd. *pháp nhãn không bụi* ở `dn14:3.11.6`, `dn5:29.6`; 5 khoá chứa `virajo`: `dn30:2.21.16` *không bụi trần*, `tha-ap532:20.3` *không bụi trần*; `dhp386:1` dịch *không cấu uế*); `reṇu` → *bụi đất* (0 khoá chứa cả `rajo` và `reṇu`). Chuỗi bảy từ `arajo … sabbarajavītivatto` (`2.7`) → *không có bụi, không bụi, không còn bụi, đã rời khỏi bụi, đã đoạn trừ bụi, không dính với bụi, đã vượt qua mọi bụi* (0 tiền lệ). `jino` → *bậc Chiến Thắng* (157 khoá chứa `jino`, 87 khoá có *bậc chiến thắng*; `cnd15:7.11`); `cakkhumā` → *bậc có mắt* (184 khoá chứa: *có mắt* 124, trong đó *bậc có mắt* 59). `kodho`, `upanāho` → *giận dữ*, *hằn học* theo `cnd6:15.2`.
    - `jhāyī` → *bậc thiền định* theo `snp5.14:1.1` (197 khoá chứa `jhāyī`/`jhāyiṁ`; `mn108:25.11` *người tu thiền*, `dhp386:1` *vị tu thiền*); `paṭhamaṁ jhānaṁ … catutthaṁ jhānaṁ` → *thiền thứ nhất … thứ tư* (*thiền thứ nhất* 99 khoá so với *sơ thiền* 83; *thiền thứ tư* 97 so với *tứ thiền* 66); `savitakkasavicāra`, `avitakkavicāramatta`, `avitakkaavicāra` → *có tầm có tứ*, *không tầm chỉ còn tứ*, *không tầm không tứ* theo `mn128:31.4`, `an8.63:3.1`; `sappītika`, `nippītika` → *có hỷ*, *không hỷ* (5 + 5 khoá); `sātasahagata`, `upekkhāsahagata` → *tương ưng lạc*, *tương ưng xả* (5 khoá); `lokuttara` → *xuất thế* (*xuất thế* 18 khoá so với *siêu thế* 9).
    - `kāmacchanda` → *dục tham* (99 khoá chứa `kāmacchand`, 94 khoá có *dục tham*) theo `snp5.14:2.1`; `chando` → *ham muốn* theo `cnd16`; chuỗi 13 mục ở `19.2` → *dục tham, dục nhiễm, dục hỷ, dục ái, dục luyến, dục khát, dục nhiệt não, dục mê, dục chấp chặt, dòng lũ dục, ách dục, chấp thủ dục, triền cái dục tham*: `kāmasineho`, `kāmapipāsā`, `kāmamucchā`, `kāmapariḷāho` theo `mn100:14.11`, `mn36:17.11`; `kāmanandī` theo `an4.10:1.6`; `kāmataṇhā` → *dục ái* (35 khoá chứa); `kāmayogo` → *ách dục* (11 khoá); `kāmarāgo` → *dục nhiễm* (xem bất định 11).
    - `domanassa` → *ưu não* (916 khoá chứa `domanass`: *ưu* 669, *sầu* 293, *buồn phiền* 170, *ưu não* 78; chọn *ưu não* theo `snp5.14:2.3`); `thina` → *hôn trầm* (166 trên 169 khoá chứa `thina`); `kukkucca` → *hối hận* (140 khoá chứa `kukkucc`: *hối tiếc* 86, *hối hận* 22; chọn *hối hận* theo `snp5.14:2.5`) tách khỏi `vippaṭisāra` → *hối tiếc* (195 khoá chứa `vippaṭisār`); `panūdana` → *xua đuổi* (8 khoá chứa, 2 khoá có *xua đuổi*) theo `snp5.14:2.4`; `nivāraṇa` → *ngăn chặn* (346 khoá chứa `nivāraṇ`/`nīvaraṇ`: *triền cái* 236, *ngăn chặn* 9) theo `snp5.14:2.5`.
    - `upekkhā` → *xả*, `sati` → *niệm* (và *chánh niệm* ở kệ theo `snp5.14:6.1`), `saṁsuddha` → *trong sạch* theo `snp5.14:3.1`; chuỗi `parisuddhā pariyodātā anaṅgaṇā vigatūpakkilesā mudubhūtā kammaniyā ṭhitā āneñjappattā` → *thanh tịnh, trong sáng, không uế nhiễm, lìa cấu uế, mềm dẻo, đắc dụng, an trú, đạt đến bất động* theo `dn10:2.21.1` (83 khoá chứa `mudubhūte kammaniye`).
    - `dhammatakka` → *suy xét về pháp* theo `snp5.14:3.2` (`an3.33:5.2` *trạch pháp*); `sammāsaṅkappa` → *chánh tư duy* (104 khoá chứa, đều có *chánh tư duy*); `pubbaṅgamo` → *đi đầu* (15 khoá chứa; `dn30:2.13.2`, `dn30:2.15.2`); `vipassanā` → *tuệ quán* (158 khoá chứa `vipassan`: *quán* 141, *tuệ quán* 53, *minh sát* 18).
    - `abhiññā` → *thắng trí* (1388 khoá chứa `abhiññ`: *thắng trí* 564, *thắng tri* 455; chọn *thắng trí* theo `snp5.14:1.6`); `pariññā` → *liễu tri* (473 khoá chứa, 265 khoá có *liễu tri*); `sacchikiriyā` → *chứng ngộ* (292 khoá chứa, 200 khoá có *chứng ngộ*); `bhāvanā` → *tu tập* (476 khoá chứa, 448 khoá có *tu tập*); `samāpatti` → *thiền chứng* (291 khoá chứa: *chứng* 208, *chứng đạt* 52, *thiền chứng* 15; chọn *thiền chứng* để không trùng *chứng ngộ*).
    - `vasippatto pāramippatto` → *đã đạt được sự thuần thục và sự hoàn mãn* theo `mn111:21.2`; `tāṇa`, `leṇa`, `saraṇa`, `abhaya`, `accuta`, `amata` → *chốn che chở, nơi nương náu, nơi nương tựa, không sợ hãi, không biến hoại, bất tử* theo `cnd15:19.2`, `cnd15:7.9`; `vutthavāso ciṇṇacaraṇo … jātimaraṇasaṁsāro natthi tassa punabbhavo` → *đã sống xong, đã thực hành xong … luân hồi sinh tử, vị ấy không còn tái sinh* theo `cnd16:4.6`.
    - `saṁyojana` → *trói buộc* theo `snp5.14:4.1`; `vicāraṇa` → *sự rong ruổi* theo `sn1.64:1.2`, `sn1.65:1.2` (3 khoá chứa đúng `kiṁsu tassa vicāraṇaṁ`: hai khoá *sự rong ruổi*, `snp5.14:4.2` *khiến nó dao động*); `vitakka` → *suy nghĩ* ở kệ (`sn1.64:2.2`, `sn1.65:2.2`, `snp5.14:5.2`) và *tầm* ở lời giải (400 khoá chứa `vitakk`: *tầm* 262, *suy nghĩ* 58; xem bất định 3); `nandī` → *hoan hỷ* theo `snp5.14:5.1` và `cnd16:4.1` (`sn1.64:2.1` *ưa thích*); `taṇhā` → *tham ái*; `pahāna`, `vippahāna`, `paṭinissagga`, `vūpasama`, `paṭippassaddhi` → *đoạn trừ / từ bỏ, buông bỏ, lắng dịu, an tịnh* (`paṭinissagg` 216 khoá: *buông bỏ* 101, *từ bỏ* 95; `vūpasam` 287 khoá: *lắng dịu* 166; `paṭippassaddh` 141 khoá: *lắng dịu* 106, *an tịnh* 47; chọn *buông bỏ* để không trùng *từ bỏ* của lemma); `vuccati pavuccati kathīyati bhaṇīyati dīpīyati voharīyati` → *được nói đến, được tuyên bố, được thuật lại, được nói ra, được làm sáng tỏ, được diễn đạt* (0 tiền lệ).
    - `puññābhisaṅkhāra`, `apuññābhisaṅkhāra`, `āneñjābhisaṅkhāra` → *hành phước, hành phi phước, hành bất động* theo `sn12.51:9.4`; `sahagata` → *câu hữu* theo `sn51.20:3.2`; `viññāṇaṁ uparujjhati` → *thức chấm dứt* theo `snp5.14:6.2`, `7.4`.
    - `vedanāsu vedanānupassī`, `samudayadhammānupassī`, `vayadhammānupassī`, `samudayavayadhammānupassī` → *quán thọ trên các thọ*, *quán tính chất sinh khởi*, *quán tính chất hoại diệt*, *quán cả tính chất sinh khởi lẫn hoại diệt* theo `mn10:5.2` (10 khoá ở `mn10`); `rogato gaṇḍato sallato aghato ābādhato` → *là bệnh, là ung nhọt, là mũi nhọn, là khốn khổ, là tai họa* theo `mn74:9.2` (18 khoá chứa `rogato gaṇḍato`).
    - `dukkhe aññāṇaṁ` → *sự không biết về khổ* theo `sn12.2:14.2`; `dukkhaṁ me apariññātaṁ …` (`23.7`): 0 tiền lệ cho cả khung.
    - `pāṇātipātā veramaṇī` … → *tránh xa sát sinh, tránh xa lấy của không cho, tránh xa tà hạnh trong các dục, tránh xa nói dối, tránh xa nói lời chia rẽ, tránh xa nói lời thô ác, tránh xa nói lời phù phiếm* theo `dn34:2.3.62` (`pāṇātipāt` 494 khoá: *sát sinh* 443; `adinnādān` 226: *lấy của không cho* 129; `musāvād` 377: *nói dối* 359; `pharus` 269: *thô ác* 76; `samphappalāp` 181: *vô ích* 48, *nói nhảm* 2; *phù phiếm* theo `dn34`, `dn33`); `kāyaduccarita` → *thân ác hạnh* (133 khoá chứa: *thân ác hạnh* 20, *ác hạnh của thân* 19, *ác hạnh về thân* 10; `kāyasucarita` → *thân thiện hạnh* 17); `abhijjhā` → *tham lam* (578 khoá chứa, 356 khoá có *tham lam*); `byāpāda` → *sân hận*; `micchādiṭṭhi` → *tà kiến*.
    - `akappiye kappiyasaññitā` → *tưởng điều không hợp pháp là hợp pháp* theo `mn67:17.8` (`kappiya` → *hợp pháp*); `avajje vajjasaññitā` → *tưởng điều không có lỗi là có lỗi* theo `thig5.9:1.3`, `dhp318:1` (*lỗi*).
    - `sīlesu paripūrakārī`, `indriyesu guttadvāro`, `bhojane mattaññū`, `jāgariyānuyoga`, `satisampajañña` → *làm trọn vẹn các giới, hộ trì các căn, biết tiết độ trong ăn uống, chuyên cần tỉnh thức, chánh niệm tỉnh giác* theo `cnd15:19.2`.
    - `pāsāṇake cetiye` → *bảo tháp Pāsāṇaka* theo `cnd3:1.1`, `cnd21:2.5`; `tevijjā maccuhāyino` → *những vị tam minh, hàng phục tử thần* theo `sn8.10:3.4`.

  **Số Pāli, kèm phép tính.** `cattāro āsavā` (`12.2`) = 4: *bốn lậu hoặc*, `12.3` liệt kê đúng bốn (`kāmāsavo bhavāsavo diṭṭhāsavo avijjāsavo` = 4 Việt); `dvīhi kāraṇehi` (`22.6`) = 2: *hai lý do*, `22.7` liệt kê đúng hai (`katattā`, `akatattā`); `nava vitakkā` (`38.2`, `38.4`–`38.6`) = 9: *chín tầm*, `38.3` liệt kê đúng 9 (`kāma`, `byāpāda`, `vihiṁsā`, `ñāti`, `janapada`, `amarā`, `parānudayatā`, `lābhasakkārasiloka`, `anavaññatti` = 9 Việt); `dvādasahi ākārehi` (`49.10`) = 12: *mười hai cách* = 3 (`48.1`–`48.3`) + 9 (`49.1`–`49.9`); `cattālīsāya ākārehi` (`50.4`) = 40: *bốn mươi cách* (`cattālīsa` = 40, theo `cnd16`); `terasamo` (`54.3`) = 13: *thứ mười ba* (khớp `0.4` = 13); 16 loại thiền ở `2.3` (4 + 12) = 16 Việt; sáu hợp từ `-pāragū` (`13.1`, `13.2`) = 6 Việt; mười hai cặp `-gato/-patto` (`13.7`) = 12 cặp = 24 Việt; mười ba mục `kāma-` (`19.2`) = 13 Việt; chín động từ (`15.2`, `29.2`) = 9 Việt; bảy động từ (`42.1`, `51.1`) = 7 Việt; bốn danh từ ở `14.2` (`āgamanaṁ abhikkamanaṁ upasaṅkamanaṁ payirupāsanaṁ`) = 4 Việt; `catunnaṁ maggānaṁ` (`13.2`, `28.5`) = 4: *bốn đạo*; `23.6` = *bốn niệm xứ, bốn chánh cần, bốn thần túc, năm căn, năm lực, bảy giác chi, Thánh đạo tám chi phần* (4 + 4 + 4 + 5 + 5 + 7 + 8, khớp `cnd15:7.7`). Không có `navuti`, `tālīsa` (ngoài `cattālīsā` = 40), `sattati`, `tiṁsakappasahassa`, `koṭi` làm số đếm, `sahassa`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
    1. `1.1`, `8.4`, `17.1` `virajamāsīnaṁ` → *không bụi, đang ngồi*: lời giải của chính bài (`2.5`–`2.7`: *tham là bụi, sân là bụi, si là bụi …*; `6.2`: `āsīnaṁ` là *ngồi ở bảo tháp Pāsāṇaka*; `8.4` nhắc lại) buộc đọc `viraja` + `āsīna`. `snp5.14:1.1` dịch *không còn cầu mong* (bỏ `āsīnaṁ`, không có `rajo`), Sujato dịch *rid of hopes*; `dhp386:1` dịch *không cấu uế, đang ngồi*. Giữ *không bụi* (theo `rajo` → *bụi*, không *cấu uế*) để lời giải `2.5` nói đúng điều nó nói.
    2. `18.3`, `20.4`, `25.3` `domanassāna cūbhayaṁ` → *và các ưu não, cả hai điều ấy*: lời giải `20.3` nói rõ `ubhinnaṁ` là cả hai, *dục tham và ưu não* (`kāmacchandassa ca domanassassa ca ubhinnaṁ`), nên *cả hai điều ấy* chỉ dục tham và ưu não; `snp5.14:2.3` *cả hai loại ưu não* và `an3.33:4.2` *cả các buồn phiền* không giữ `ubhayaṁ` theo nghĩa ấy. Chưa chắc `ubhayaṁ` ở dòng kệ cũng hiểu như ở lời giải, nên đây là cách đọc theo chú giải.
    3. Một từ hai cách dịch trong bài: `vitakka` → *suy nghĩ* ở các dòng kệ và lemma `38.1`, `38.7` (theo `sn1.64:2.2`, `sn1.65:2.2`, `snp5.14:5.2`), nhưng *tầm* ở `38.2`–`38.6` (theo `cnd12:6.1`, `cnd12:17.8`; *tầm* trội trong tầng, 262 so với 58). Không thống nhất được mà không bỏ một trong hai nguồn trùng Pāli; chưa phân xử. `vicāraṇaṁ` → *sự rong ruổi* (theo `sn1.64:1.2`); `snp5.14:4.2`, `5.2` viết *khiến nó dao động*, nhưng lời giải `34.1`–`34.2` (`cāraṇaṁ vicāraṇaṁ paṭivicāraṇaṁ`, `carati vicarati paṭivicarati`) là *đi, đi khắp, đi quanh* chứ không phải `iñjati`, nên không dùng *dao động*.
    4. `2.3` `jhānarato ekattamanuyutto sadatthagaruko` → *hoan hỷ trong thiền, chuyên chú vào sự nhất tâm, xem trọng mục đích của chính mình*: `jhānarato` theo `sn2.14:3.2`; `sadattha` theo `sn12.22:3.1` (*mục tiêu lớn của mình*); `ekatta` có thể là *nhất tâm* hoặc *độc cư*, chưa phân xử (0 khoá chứa `ekattamanuyutt`). Ba loại cuối của chuỗi mười sáu: `suññatenapi`, `animittenapi`, `appaṇihitenapi` → *thiền tính không, thiền vô tướng, thiền vô nguyện* (*tính không* 12 khoá so với *tánh không* 9, theo `pe7:10.3`); `lokiyenapi` → *thiền thế gian* (tầng có 2 khoá dịch `lokiya`/`lokika` là *thế gian* và 1 khoá *thế tục*).
    5. `3.1`–`5.4` `na ca pana reṇu vuccati` → *chứ không phải bụi đất được gọi là bụi*: `reṇu` hiểu là bụi vật chất, đối lập với `rajo` là bụi theo nghĩa ẩn dụ; 0 tiền lệ cho cặp. `3.2` `rajoti` không có nháy trong Pāli nên không thêm nháy quanh *bụi*.
    6. `8.2` `sabbossukkapaṭippassaddhattā` → *do mọi sự bận tâm đã được an tịnh*: `ossukka` không có dạng đứng riêng; `appossukka` → *không nhiệt tâm* (`dn14:3.2.10`), *yên tâm*/*đừng bận tâm* (`dn16:3.9.2`, `dn17:1.16.4`); *bận tâm* là lựa chọn của người dịch. Ở `8.2` `āsīno` dùng theo nghĩa bóng (an trú) nhưng vẫn dịch *đang ngồi* để khớp `8.1`, `8.3`, `8.4`.
    7. `14.1`–`14.3`: `pañhaṁ sotukāmo` → *muốn nghe câu hỏi* (nguyên văn, không thêm *để được giải đáp*); `pañhāgamo tuyhaṁ atthi` → *nơi Ngài có sự đến của câu hỏi*; `vahassetaṁ bhāraṁ` → *xin hãy mang gánh nặng ấy*: 0 khoá chứa `pañhāgam`, 0 khoá chứa `vahassetaṁ`; nghĩa chưa phân xử (có thể là *sự đến của câu hỏi* hoặc *nguồn trả lời câu hỏi*).
    8. `aññā` và `abhiññā` cùng dịch *thắng trí* (`15.1`, `26.3`, `29.1` theo `snp5.14:1.6`, `3.3`; `13.1`, `13.2`): hai từ Pāli khác nhau mà cùng một từ Việt; `an3.33:5.3` dịch `aññāvimokkhaṁ` *giải thoát nhờ tri ngộ*. Giữ theo `snp5.14` để khớp bài kệ gốc; cần quyết định thuật ngữ riêng cho `aññā` ngoài lát. `arahattavimokkha` → *sự giải thoát của quả A-la-hán* (quả A-la-hán 48 khoá trong 251 khoá chứa `arahatt`).
    9. `21.2` chuỗi `akalyatā akammaññatā olīyanā sallīyanā līnā līyanā līyitattaṁ thinaṁ thiyanā thiyitattaṁ` → *sự không sẵn sàng, sự không dễ sử dụng, sự thu rút, sự co rúm, sự chùng lại, sự chùng xuống, trạng thái chùng xuống, hôn trầm, sự đông cứng, trạng thái đông cứng của tâm*: 0 tiền lệ cho danh từ (4 khoá chứa động từ `olīyanti`, vd. `iti49:2.1` *bị chìm đắm*); nghĩa từng từ dựa vào hiểu biết của người dịch; `cittassa` ở cuối chỉ gắn vào từ cuối trong bản Việt.
    10. `22.2`–`22.5`: `hatthakukkucca` → *sự cựa quậy ở tay* (theo `mn91:12.2` *không cựa quậy tay*, 1 khoá); `kukkuccaṁ kukkuccāyanā kukkuccāyitattaṁ` → *sự hối hận, sự cảm thấy hối hận, trạng thái đã hối hận* (0 tiền lệ); `cetaso vippaṭisāro manovilekho` → *sự hối tiếc của tâm, sự xáo trộn trong ý* (`manovilekha` chỉ có 1 khoá, `cnd13:11.2`). `22.9`–`22.21` đại từ `me` → *tôi* (người tự trách), không phải *Ta* của Đức Phật; `22.12`–`22.18` dịch bằng động từ (*đã sát sinh, chưa tránh xa sát sinh …*), `22.19`–`22.20` *đã tham lam, chưa thực hành không tham lam*, `22.21` *đã có tà kiến, chưa có chánh kiến*: ba kiểu động từ cho cùng một khung `kato/akatā me`; 0 tiền lệ cho khung (nguyên văn `akatā me anabhijjhā` là *sự không tham lam chưa được tôi làm*).
    11. `19.2` `kāmarāgo` → *dục nhiễm* (0 tiền lệ cho dạng này; `an4.10:1.6` dịch `kāmarāgo` *dục tham* nhưng ở đây *dục tham* đã dành cho `kāmacchando`); `kāmajjhosānaṁ` → *dục chấp chặt* theo `cnd15:26.2` (`ajjhosāna` *chấp chặt*; `dn15:13.4` *đắm trước*).
    12. `23.7` `samudayo` → *tập khởi* (Pāli không có `dukkha-` trước `samudayo`; theo `sn12.2:14.2` *sự tập khởi của khổ*); `23.1`–`23.5` dùng lại các cụm của `cnd15:19.2` (*làm trọn vẹn các giới*, *hộ trì các căn* …) nhưng ở thể phủ định như Pāli (`aparipūrakārī`, `aguttadvāro`, `amattaññū`, `ananuyutto`, `na … samannāgato`).
    13. `27.2`–`27.3`: `ajjhupekkhanā` → *sự xả hoàn toàn*, `cittasamatā` → *sự quân bình của tâm*, `cittappassaddhatā` → *sự an tịnh của tâm*, `majjhattatā` → *sự trung lập của tâm* (0 khoá chứa `cittasamatā`, `majjhattatā`, `ajjhupekkhanā`); `sati anussati …pe… sammāsati` → *niệm, tùy niệm … chánh niệm* (0 khoá chứa `sati anussati`).
    14. `28.5` `catunnaṁ maggānaṁ pubbabhāgavipassanā` → *tuệ quán ở giai đoạn đầu của bốn đạo*: `catunnaṁ maggānaṁ` → *bốn đạo* (0 khoá có dạng này); `pubbabhāga` → *giai đoạn đầu* (4 khoá chứa `pubbabhāg`: *phần đầu* 3, *sơ khởi* 1; chọn *giai đoạn đầu* cho dễ hiểu, chưa phân xử với *phần đầu*). `28.2` `ādito hoti, purato hoti, pubbaṅgamo hoti` → *là khởi đầu, là đứng trước, là đi đầu*.
    15. `13.7` mười hai cặp: `koṭi` → *điểm cực hạn*, `pariyanta` → *giới hạn cuối cùng*, `vosāna` → *chỗ kết thúc*, `anta` → *chỗ tận cùng* (bốn từ gần nghĩa, dịch khác nhau để giữ từng cặp; `mil6.3.6:18.2` dịch `jīvitakoṭigato` *đã đến tận cùng của đời sống*, `tha-ap512:6.3` dịch `pāramippatto` *đã đạt đến chỗ tận cùng*); sáu cặp `tāṇa … nibbāna` theo `cnd15:19.2`, `cnd15:7.9`.
    16. `7.3` `Sāvakā payirupāsanti` → *Được các đệ tử hầu cận* (thể bị động như `sn8.10:3.3`, Pāli chủ động *các đệ tử hầu cận*); giữ theo `sn8.10:3.3`, `sn8.7:8.3`.
    17. `11.2` *tỳ-kheo* viết thường (khác `snp3.11:37.2` viết hoa *Tỳ-kheo*), theo cách viết thường trong `cnd16:24.2`.
    18. `45.2` `suṇoma uggaṇhāma dhārema upadhārema upalakkhema` → *nghe, học lấy, ghi nhớ, nhận rõ, nhận ra*: `upalakkhema` → *nhận ra* theo `sn33.55:2.4` (`anupalakkhaṇena` *không nhận ra*, 12 khoá chứa `upalakkh`); chuỗi năm động từ này khác chuỗi quá khứ ở `cnd15:2.1` và `cnd16:6.4`.
    19. Lỗi ngoài lát, báo chứ không sửa: `snp5.14:1.1` (*không còn cầu mong*, bỏ `virajaṁ`/`āsīnaṁ`); `snp5.14:2.2` bỏ hô ngữ `udayā` (cùng kiểu `snp5.12:3.2`, `snp5.13:3.2`); `snp5.14:2.3` (*cả hai loại ưu não*); `snp5.14:4.2`, `5.2` (*dao động* cho `vicāraṇaṁ`); `snp5.14:7.1`–`7.2` đảo thứ tự hai dòng so với Pāli.

