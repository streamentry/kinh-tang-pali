  - 29.4 visuddhāsiṁ sunimmalā: dịch ta đã thanh tịnh, hoàn toàn không cấu uế (3 trên 4
    khoá cùng Pāli ở thi-ap21–23 và 1 khoá ngôi con; đã đổi ở lượt cải thiện 2026-10-11 từ
    ta đã trở nên thanh tịnh, vô cùng trong sạch); sunimmala là rất không cấu uế.
  - Bản tra cứu toàn văn nguyên bài trên SuttaCentral (giấy phép NOASSERTION; không phải
    tầng store, không căn lề theo khoá) nếu có cho uid này thì không được chép vào bản
