notes: |-
  Bài kinh thi-ap24 — Sakulātherīapadāna, bài thứ tư của Phẩm Kuṇḍalakesī trong
  Therīapadāna. 142/142 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào
  ngoài tập khoá Pāli. Bài kể về tỳ-kheo-ni Sakulā: thời Đức Phật Padumuttara, sinh làm
  con gái vua Ānanda ở Haṁsavatī, nghe Đức Phật tán thán một vị tỳ-kheo-ni có thiên nhãn
  nên ước nguyện địa vị ấy và được thọ ký; thời Đức Phật Kassapa, làm nữ du sĩ, xin được
  chút dầu, thắp đèn suốt đêm trước bảo tháp; đời cuối sinh trong gia tộc Bà-la-môn ở
  Sāvatthī, thấy Đức Phật vào thành thì xuất gia, chứng A-la-hán và được đặt vào vị trí
  đệ nhất trong những vị có thiên nhãn.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt:
  - :0.1 Therīapadāna giữ nguyên Pāli: 26 khoá cùng dạng so với 1 khoá dịch là
    Trưởng Lão Ni Ký Sự (toàn tầng kn có Pāli trùng).
  - :0.2 Kuṇḍalakesīvagga → Phẩm Kuṇḍalakesī (2 khoá cùng Pāli ở thi-ap26 và thi-ap29, cả 2/2
    dùng đúng dạng này).
  - translationTitle bằng đúng giá trị :0.3 từng ký tự.
  - Số thứ tự ở :0.3: Pāli :0.3 là Sakulātherīapadāna, không bắt đầu bằng số, nên :0.3 không
    có số. Quy tắc chung của phẩm (giữ số khi và chỉ khi Pāli có số): trong 27 tệp thi-ap đã
    có (không tính bài này), 14 tệp có số ở Pāli (8 giữ, 6 bỏ), 13 tệp không có số ở Pāli và
    cả 13 không thêm số; ở tha-ap 373 tệp không có số ở Pāli và 0 tệp thêm số. Không có
    trường hợp thêm số ở chỗ Pāli không có; bài này rơi vào nhóm không số.
  - Công thức tiêu đề: đo ở phạm vi gần nhất (27 tệp thi-ap đã có, không tính bài này),
    Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni có 25 tệp, Tuyên Ngôn 1 tệp, dạng khác 1 tệp (để
    nguyên Pāli). Toàn tầng tha-ap (531 tệp): Tuyên Ngợ 255, Tuyên Ngôn 136, Ký Sự 133,
    dạng khác 7. Hai phạm vi cùng cho Tuyên Ngợ là đa số, nên bài này giữ Tuyên Ngợ cho
    khớp; đó nhiều khả năng là lỗi chính tả của Tuyên Ngôn, và nếu người biên tập xác
