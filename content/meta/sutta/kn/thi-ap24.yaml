notes: |-
  Bài kinh thi-ap24 — Sakulātherīapadāna, bài thứ tư của Phẩm Kuṇḍalakesī trong
  Therīapadāna. 142/142 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào
  ngoài tập khoá Pāli. Bài kể về tỳ-kheo-ni Sakulā: thời Đức Phật Padumuttara, sinh làm
  con gái vua Ānanda ở Haṁsavatī, nghe Đức Phật tán thán một vị tỳ-kheo-ni có thiên nhãn
  nên ước nguyện địa vị ấy và được thọ ký; thời Đức Phật Kassapa, làm nữ du sĩ, xin được
  chút dầu, thắp đèn suốt đêm trước bảo tháp; đời cuối sinh trong gia tộc Bà-la-môn ở
  Sāvatthī, thấy Đức Phật vào thành thì xuất gia, chứng A-la-hán và được đặt vào vị trí
  đệ nhất trong những vị có thiên nhãn.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt:
  - :0.1 Therīapadāna giữ nguyên Pāli: 38 khoá cùng dạng so với 1 khoá dịch là
    Trưởng Lão Ni Ký Sự (toàn tầng kn có Pāli trùng; đo lại 2026-10-11).
  - :0.2 Kuṇḍalakesīvagga → Phẩm Kuṇḍalakesī (9 trên 9 khoá cùng Pāli ngoài bài này dùng
    đúng dạng này; đo lại 2026-10-11).
  - translationTitle bằng đúng giá trị :0.3 từng ký tự.
  - Số thứ tự ở :0.3: Pāli :0.3 là Sakulātherīapadāna, không bắt đầu bằng số, nên :0.3 không
    có số. Quy tắc chung của phẩm (giữ số khi và chỉ khi Pāli có số), đo lại 2026-10-11 trên
    39 tệp thi-ap khác: 18 tệp có số ở Pāli (12 giữ, 6 bỏ), 21 tệp không có số ở Pāli và cả
    21 không thêm số; ở tha-ap 398 tệp không có số ở Pāli và 0 tệp thêm số. Không có
    trường hợp thêm số ở chỗ Pāli không có; bài này rơi vào nhóm không số.
  - Công thức tiêu đề :0.3: bản Việt của bài này là Ký Sự Về Trưởng Lão Ni Sakulā. Đo lại
    2026-10-11 ở 39 tệp thi-ap khác: Ký Sự Về … 36 tệp, Bài Kệ Tuyên Ngôn 2 tệp (thi-ap29,
    thi-ap30, hai tiêu đề tập thể), dạng khác 1 tệp (thi-ap6, để nguyên Pāli); ở 563 tệp
    tha-ap: Ký Sự Về … 401, Bài Kệ Tuyên Ngôn 140, dạng khác 22. Dạng Ký Sự Về … là đa số ở cả
    hai phạm vi nên bài này theo dạng đó. (Bản ghi chú trước viết Tuyên Ngợ là sai so với
    chính tệp dịch và đã được thay.)
  - Khoá cuối :37.1 là thứ tư (catutthaṁ), theo mẫu Ký sự về Trưởng lão Ni X, thứ N của các
    bài thi-ap kề cận (thi-ap14 và thi-ap34 viết thứ tư; thi-ap4 viết thứ bốn, không theo).
    Đo 2026-10-11: 33 tệp thi-ap có khoá cuối dạng …padānaṁ dùng Ký sự về …, 1 tệp dùng Bài
    Kệ.
  - Lời kết :36.1 Itthaṁ sudaṁ … abhāsitthāti dùng nhóm Như vậy, Tỳ-kheo-ni X đã nói những
    bài kệ này (imā gāthāyo là số nhiều): 29 trên 30 khoá cùng khuôn Pāli (cùng cấu trúc
    Itthaṁ sudaṁ + tên + bhikkhunī + imā gāthāyo abhāsitthāti, chỉ khác tên) ở thi-ap và
    tha-ap đã có dùng đúng khuôn này. (Bản ghi chú trước mô tả khuôn này là Tôi nghe như
    vầy …, không đúng với chính tệp dịch và đã được thay.)

  SỐ PĀLI — tự tính:
  - Ito satasahassamhi kappe (1.3) = một trăm ngàn kiếp (sata 100 × sahassa 1000 =
    100.000); Satasahassito kappe (14.1) = một trăm ngàn kiếp, tính về phía tương lai.
  - tāvatiṁsa (16.4, 20.4) = cõi trời Ba mươi ba (ti 3 + tiṁsa 30 = 33; tiṁsa là 30,
    không phải 3).
  - catasso (35.1) = bốn; catutthaṁ (37.1) = thứ tư; dvipada (19.3) = loài hai chân;
    ekacārinī (18.2) = một mình.
  - Không có Tiṁsakappasahassa hay bất kỳ cụm số nào chưa phân xử được trong bài; phép
    kiểm số tự động vì vậy không có gì cần đo ở đây, phép đó chạy rỗng chứ không phải pass.

  PĀLI TRÙNG NGUYÊN VĂN — đã dò toàn tầng kn (3.339 lượt khoá đã dịch có Pāli trùng với một
  khoá của bài này, gồm cả các tệp thi-ap và tha-ap đã dịch ở đợt này, không tính bài
  này), dùng lại nguyên văn bản dịch:
  - Đo lại 2026-10-11 (tầng kn hiện có, không tính bài này): 92 khoá của bài có Pāli trùng
    byte với khoá đã dịch ở nơi khác (6.768 cặp); 86 khoá trong đó dùng lại đúng một dạng
    đã có, và 82 khoá là dạng đa số. 6 khoá khác mọi dạng đã có: 7.1 và 30.3 chỉ khác chữ
    hoa đầu dòng (bản Việt mở đầu hoa theo Pāli x.1 và x.3, tệp này nhất quán như vậy);
    13.1 đổi con thành ta theo ngôi kể của bài; 28.3 chỉ khác chữ hoa đầu dòng;
    7.3 và 7.4 là sửa có chủ ý ở lượt cải thiện 2026-10-11 (xem bên dưới; khoá cùng Pāli
    7.3–7.4 ở tha-ap547 vẫn mang dạng cũ, đã báo).
  - Các khoá không phải dạng đa số nhưng vẫn dùng lại dạng đã có: 14.1 (xem bất định),
    19.4 (hòa 8 so với 10 so với 5 giữa ba dạng, chọn với tâm hoàn toàn tịnh tín).
    24.1 đã đổi ở lượt cải thiện 2026-10-11 sang Và nay, trong đời cuối cùng (7 so với 4 ở
    thi-ap, 10 so với 0 ở tha-ap, 17 so với 4 toàn tầng).
  - Trong chính bài này có 7 nhóm Pāli trùng nguyên văn: 10.2 và 25.2; 16.1–16.4 và
    20.1–20.4 (bốn cặp); 22.4 và 23.4; và ba khoá …pe… (33.2, 34.2, 35.2); cả 7 nhóm đều có
    bản Việt giống nhau, 0 cặp lệch. Ngoài ra 30.2, 34.3 và 35.3 cùng Pāli kataṁ buddhassa
    sāsanaṁ chỉ khác dấu cuối khoá (; . ”.) và bản Việt khác đúng ở dấu cuối đó.
  - Ba khoá …pe… đều là … đúng một dấu lược; Pāli không có … ở khoá nào khác nên bản Việt
    cũng không có.

  NGÔI KỂ: người kể dùng ta xuyên suốt, theo thi-ap26 và thi-ap36 liền kề và theo đa số
  ở các khoá công thức chung (dòng tāvatiṁsamagacchahaṁ: ta 18 so với tôi 13 ở tha-ap;
  5 so với 5 ở thi-ap, con 3). Trong lời nói của Đức Phật (13.2) dùng ngươi, theo cách
  dùng chung ở các bài kệ có lời thọ ký. Lời kết :36.1 Tôi nghe như vầy là lời người kể,
  không phải ngôi của vị ni.

  THUẬT NGỮ — kèm số đếm:
  - Padumuttaro nāma jino → Đức Chiến Thắng tên Padumuttara (22 trên 23 khoá cùng
    Pāli); nāyako → bậc Dẫn Đạo.
  - lokagaru (11.1) → bậc đáng được thế gian kính trọng: có tiền lệ garu là đáng kính
    trọng ở tha-ap549:16.1; tha-ap195 dịch tilokagaru là bậc Đạo Sư của ba cõi (1 khoá).
    Không chọn Đạo Sư vì garu ở đây không có nghĩa thầy trong Pāli; người biên tập có
    thể chuẩn hoá một lượt.
  - mahākāruṇiko (7.1, 32.1) → bậc Đạo Sư có lòng đại bi (7.1, theo 1 khoá cùng Pāli) và
    bậc Đại Bi (32.1, theo tha-ap547:7.1 cùng chữ mahākāruṇiko).
  - mahāvīro (10.3) → bậc Đại Anh Hùng (theo thi-ap36:3.1 và thi-ap26).
  - dibbacakkhu (29.2) → thiên nhãn (10 trên 16 khoá cùng Pāli: thiên nhãn đã được thanh
    tịnh); sotadhātu (28.2) → thiên nhĩ giới (7 trên 7 khoá cùng Pāli).
  - vemātā bhaginī (9.3) → chị em gái khác mẹ: không có tiền lệ; vemātā là khác mẹ,
    Pāli không nói chị hay em nên giữ chị em gái; cùng cha do 9.1–9.2 nêu Ānanda là cha.
  - rājakaññā (10.1) → vương nữ (thi-ap1:11.2).
  - upaṭṭhiṁ (19.2) → hầu cận (tha-ap116: hầu hạ; tha-ap182:
    phục vụ); sabbasaṁvariṁ (19.2) → suốt đêm (saṁvarī là đêm, ja504:17.4 dịch đêm).
  - samarocayiṁ (27.2) → ta đã ưa thích sự xuất gia (bv23:11.4: ta đã ưa thích sự xuất
    gia).
  - lakkhaṇehi (26.4) → các tướng (đã bỏ chữ chính ở lượt cải thiện 2026-10-11: Pāli chỉ
    có lakkhaṇehi, không có chữ nào nghĩa là chính; tha-ap394:50.2 lakkhaṇehi alaṅkato
    dịch được trang hoàng bằng các tướng, 1 khoá); anubyañjana (26.3) → các tướng phụ (bv22:27.1
    và tha-ap228: các tướng phụ).
  - bhavanetti (30.4) → sợi dây dẫn đến hữu (7 khoá cùng Pāli, 6 so với 1 dẫn vào hữu).
  - saṁyojana (31.4) → kiết sử (sự đoạn tận mọi kiết sử: 1 khoá cùng Pāli; dạng khác là
    sự chấm dứt của mọi trói buộc, cũng 1 khoá).
  - vippakule (24.2) → gia tộc Bà-la-môn (tha-ap539:22.3 và tha-ap541:19.3).
  - Không có tiền lệ, dịch theo nghĩa Pāli: khattiyanandanā → làm niềm vui của dòng
    Sát-đế-lợi; sirīmatī → rạng rỡ; telamattakaṁ → một chút dầu; paribbājakinī → nữ du sĩ
    (ud2.6 dịch paribbājikā là nữ du sĩ); vātapāna → cửa sổ (mil3.3.6 dịch cửa sổ);
    paracittāni → tâm của người khác (thag6.1:5.3 dịch paracitta là tâm người khác);
    sabbaṅgasampannā → đầy đủ mọi chi thể (thi-ap33:11.3).

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - 14.1 Satasahassito kappe: ablative cùng bhavissati và hessati ở 14.4 và 15.4 là thì
    tương lai, nên dịch Sau một trăm ngàn kiếp nữa. Đo ở các khoá cùng Pāli mà vế sau
    có bhavissati hoặc hessati trong 3 khoá kế tiếp: 10 khoá, trong đó 5 khoá Sau một
    trăm ngàn kiếp nữa, 4 khoá Vào một trăm ngàn kiếp nữa, 1 khoá Vào một trăm ngàn
    đại kiếp trước (tha-ap19:7.1, sai chiều thời gian; đã báo, không sửa).
    Chữ đại không có trong Pāli (kappa, không phải mahākappa), không dùng.
  - 8.2 jātā khattiyanandanā: nandanā có thể là niềm vui hoặc con gái (nandana, con trai,
    là nghĩa trong từ điển); bản Việt giữ nghĩa niềm vui, làm niềm vui của dòng Sát-đế-lợi,
    vì 9.2 đã nêu rõ dhītā (con gái). Căn cứ thêm đo 2026-10-11 từ Pāli trong kho: các hợp
    từ cùng gốc -nandana trong kn (ukkākakulanandanaṁ thi-ap25:27.4, lokanandanaṁ
    tha-ap546:12.2, naranandananandanaṁ thi-ap18:42.2) đều mang nghĩa niềm vui/làm vui lòng,
    không có hợp từ nào dùng nandana theo nghĩa con; nghĩa niềm vui vì vậy có thêm căn cứ,
    nhưng nghĩa con gái chưa được loại trừ hẳn bằng ngữ pháp.
  - 9.3 vemātā bhaginī: xem thuật ngữ; 9.4 padumuttaranāmino chỉ vị mang tên Padumuttara,
    và Pāli ghi rõ Ānanda là đại vương ở 9.1 nên Đức Phật Padumuttara là con vua; bản Việt
    không thêm quan hệ ngoài Pāli.
  - 11.1–11.4 Tadā hi so lokagaru … aggaṭṭhāne ṭhapesi taṁ: bhikkhuniṁ dibbacakkhukaṁ
    (11.2) là tân ngữ của kittayaṁ và ṭhapesi (11.4); bản Việt dùng vị tỳ-kheo-ni ở 11.2
    và vị ấy ở 11.4; Pāli không nêu tên vị ni ấy.
  - 13.2 nande: vocative của Nandā (tên riêng, cách gọi người nghe), nên dịch Này Nandā. Pāli không nói rõ Nandā là tên của vị ni sau này là Sakulā; đây là cách
    đọc dễ nhất của nande, không tìm được cách đọc khác khớp ngữ pháp; cần xem lại.
  - 13.3 Padīpadhammadānānaṁ: hợp từ ba thành tố padīpa, dhamma, dāna ở sở hữu cách số
    nhiều; đọc thành việc dâng đèn và bố thí Pháp. Cách đọc khác: padīpa là ngọn đèn Pháp
    (dhammapadīpa) hoặc hợp từ có ý khác; bản Việt giữ cách đọc sát chữ nhất, không giải
    thích thêm. Cần xem lại.
  - 13.4 phalametaṁ sunicchitaṁ: dịch quả này đã được xác quyết chắc chắn (nicchita: được
    quyết định, được xác lập); không thêm sắc thái chắc chắn hơn Pāli.
  - 13.2 nháy đơn mở ở 13.2 và đóng ở 15.4 (sāvikā’.) theo Pāli, chạy qua ranh giới khoá;
    ngoặc kép mở ở 1.1 và đóng ở 35.3 theo Pāli, và Pāli không có dấu nháy ở các khoá khác.
  - 19.2–19.3 upaṭṭhiṁ sabbasaṁvariṁ; cetiyaṁ dvipadaggassa: cetiyaṁ là tân ngữ của upaṭṭhiṁ,
    nhưng dấu chấm phẩy của Pāli ngăn giữa hai khoá; bản Việt giữ nguyên thứ tự và dấu câu
    của Pāli (hầu cận suốt đêm; bảo tháp của …).
  - 22.1–22.3 tirokuṭṭaṁ tiroselaṁ samatiggayha pabbataṁ passāmahaṁ: các đối cách là cảnh
    vật bị nhìn xuyên qua; dịch ta thấy bất cứ điều gì ta muốn, không thêm tên thần thông.
  - 24.3 pahūtadhanadhaññamhi và 24.4 mudite rājapūjite: locative đồng vị với vippakule
    ở 24.2; mudita được dịch hoan hỷ, có thể là hưng thịnh; chọn nghĩa gốc, không thêm.
  - 32.3–32.4 dibbacakkhukānaṁ aggā sakulāti naruttamo: sakulāti = sakulā + iti, lời tuyên
