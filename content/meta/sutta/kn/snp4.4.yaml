notes: |-
  Lô H1 2026-10-15 (Claude Sonnet 5.5, Claude Code): kiểm lại snp4.4:2.4 `diṭṭhī hi naṁ pāva tathā
  vadānaṁ`. Chú giải mnd4:13.2 chính là `sāva diṭṭhi taṁ puggalaṁ pāvadati`, nên pāva = pāvadati
  (tuyên bố). Sửa "tri kiến đã phản bội nó" thành "chính tri kiến tuyên bố về nó", khớp mnd4:9.4.

  Quyết định hội đồng biên tập 2026-10-16: B11 — snp4.4:3.2, snp4.4:6.2 (`muta` = cảm nhận (PED/DPD: sensed), không phải “nhận thức”/“tưởng”); B12 — snp4.4:3.2, snp4.4:5.1 (`vata`/`sīlabbata`: bỏ “khổ hạnh” (trùng `tapa`), dùng “cấm hạnh”/“giới cấm”); B18 — snp4.4:6.4 (`kenīdha … vikappayeyya`: `kena` là cách công cụ, khớp lời giải Niddesa mnd4/mnd5).

  Sửa lỗi nghĩa 2026-10-16: snp4.4:6.1 — "Vị ấy đã rũ bỏ mọi lưới độc đối với tất cả các pháp," → "Vị
  ấy đã thoát khỏi các đạo quân nơi mọi pháp," (`visenibhūta` = vi + senā + bhūta, "trở thành không
  còn đạo quân [đối nghịch]": DPD s.v. visenibhūta, dẫn chú giải "kilesasenāya viseno jāto"
  https://www.dpdict.net/search_html?q=visenibhūta; lời giải Niddesa mnd4:53.1–53.3, mnd13:143.1–143.7
  "đạo quân của Ma và các phiền não đã bị đánh bại"; khớp cách dịch mnd4:57.1, mnd13:159.1). "Lưới
  độc" không có căn cứ trong chữ Pāli.
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 2.3 (`sopadhīko` thuộc họ `upadhi`: DPD «who has attachments», chú giải Sn «rāgādīhi upadhīhi saupadhiko», glossary `upadhi` = sanh y và `saupadhika` = có sanh y; «chấp thủ» dành cho `upādāna` → «kẻ còn sanh y ấy», như mnd4:9.3, 12.1).
  Thống nhất cấp kho 2026-10-17 (diṭṭhi/ñāṇa «tri kiến», cùng mnd4): ñāṇa «tri kiến» → «trí» ở 1.4 («tin vào trí ấy») và 2.2 («nhờ trí mà»); diṭṭhī ở 2.4 «vì chính tri kiến tuyên bố về nó» → «vì chính cái kiến ấy tuyên bố về người ấy», đúng nguyên văn mnd4:9.4, 13.1, 13.15, 15.4 (lời giải mnd4:13.2 Sāva diṭṭhi taṁ puggalaṁ pāvadati). Lý do: Pāli 1.4, 2.2 là ñāṇa, không phải ñāṇadassana mà kho dịch «tri kiến» (≈341 khoá); ñāṇa đứng riêng trong Snp phẩm 4–5 là «trí» (snp4.5:4.2, snp4.9:5.1, 6.1, snp4.11:7.3, snp5.8:2.1), bài này và snp4.5 là chỗ duy nhất dùng «tri kiến»; trước đây 2.2 (ñāṇa) và 2.4 (diṭṭhī) cùng là «tri kiến». Sujato «notion», «view». Nghĩa không đổi; các dòng dẫn lại trong mnd4 đổi cùng lúc.
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 6.3 «nhìn thấy vị ấy sống rộng mở» → «chính bậc có cái thấy ấy, sống rộng mở» (chủ thể/đối tượng: dassiṁ là đối cách của dassī «người thấy», DPD dassī 2 «who sees», đồng cách với taṁ … carantaṁ, tức bậc ấy là người thấy chứ không phải bị nhìn thấy; lời giải mnd4:54.2 «Tameva suddhadassiṁ visuddhadassiṁ…», chú giải Sn «taṁ evaṁ visuddhadassiṁ», chú giải Niddesa «taṁ eva visuddhadassiṁ»; khớp dòng kệ mnd4:46.3, 54.1; Sujato «Seeing them» đọc khác, không có căn cứ ngữ pháp); sửa 8.1 bỏ «không còn giới hạn» (thêm ý không có trong Pāli: tassa natthi đi với samuggahītaṁ ở 8.2, đã dịch là «vị ấy không nắm giữ gì»; lời giải mnd4:66.15, 67.4 «Tassa … gahitaṁ … natthi», chú giải Sn «tassa natthi … ñatvā vā … disvā vā kiñci samuggahītaṁ»; Sujato không có ý này; khớp mnd4:65.1).
