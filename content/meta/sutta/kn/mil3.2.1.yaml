notes: |-
  VĂN XƯNG. Bài nằm ngay cạnh mil3.2.2 đã merge, và cả bầy mil3.2.2 đến mil3.2.9 dùng thưa tôn giả Nāgasena (tôi đếm 8 tệp) và này Đại vương (đếm 5 tệp). Đa số cả tầng mil cũng là này Đại vương (325 khoá / 93 tệp so với tâu và Tâu Đại vương 74 khoá / 14 tệp). Tôi theo đa số trong phẩm.

  CÔNG THỨC ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN, ĐẾM ĐƯỢC. Rājā āha— → Vua nói: (38 tệp mil, đa số rõ rệt; 14 tệp dùng Vua nói—, 6 tệp dùng Đức vua nói—). Thero āha— → Trưởng lão nói— (6 tệp dùng gạch nối so với 4 tệp dùng dấu hai chấm; mil3.2.2 của lát trước chọn dấu hai chấm để nhất quán với Vua nói: trong bài, tôi theo số đông của từng công thức riêng và ghi lại ở đây). Opammaṁ karohī → Xin hãy xét một thí dụ (10 tệp). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa (3 tệp). Na hi, bhante → Không phải vậy, thưa tôn giả (7 tệp). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā (60 tệp, gần như tuyệt đối). Dấu tiếng ấy-ti của Pāli được giữ nguyên ở cả bốn tệp mil đã merge; đếm cả tầng mil: 272 khoá dùng ”ti và không khoá nào dùng ”vậy, nên tôi theo ”ti; riêng 5.1 theo đúng 60 tệp đã có là chấm dấu chấm.

  THUẬT NGỮ MỚI, 0 TIỀN LỆ, ĐÃ GHI. dhammasantati → dòng pháp, sandahati → tiếp nối. ācariya → thầy dạy, sippavā → thầy tập. Động vật 2.5: kalala bê con, abbha ngựa non, pesī bò non, ghana bò cái, khuddaka ngựa nhỏ, mahanta gia súc lớn. padīpa → ngọn đèn (đã có 1 tệp mil dùng ngọn đèn). yāma → canh (chưa có tiền lệ cho canh đêm). dadhi sữa đông, navanīta bơ, ghata bơ đặc; một tệp mil đã có gọi navanīta là bơ lỏng theo một nghĩa khác nên tôi giữ bơ.

  BỔ SUNG CHỦ TỪ Ở 2.4. Pāli chỉ có dãy mātāti, pitāti, ācariyotipi, sippavātipi, sīlavātipi, paññavātipi; tôi thêm của đại đức ở những vế không có sở hữu tường minh để câu tiếng Việt đọc được (không thêm ý mới, chỉ làm rõ chủ thể).

  ĐỘNG VẬT 2.5. Đây là ví dụ về con vật bị chặt tay chân khi làm điều ác; tôi dịch theo nghĩa thông thường của sáu loại gia súc non.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.

  STATUS. Hai blocking error ở trên là thật và đo được, nên bài đặt draft bất kể final_score. Tôi không nâng điểm để né blocker và cũng không hạ điểm để tỏ ra thận trọng.

  Giải quyết draft 2026-10-12 (kiểm toán độc lập; thay thế các mục cũ nêu dưới đây).

  MỤC CŨ BỊ THAY THẾ. Mục "ĐỘNG VẬT 2.5" và "BỔ SUNG CHỦ TỪ Ở 2.4" ở trên sai và không còn hiệu lực; trong mục "THUẬT NGỮ MỚI", các cặp ācariya thầy dạy giữ nguyên nhưng sippavā thầy tập bị bỏ, và danh sách kalala bê con, abbha ngựa non, pesī bò non, ghana bò cái, khuddaka ngựa nhỏ, mahanta gia súc lớn bị bỏ. Lý do: ở 2.5 kalala, abbuda, pesī, ghana là bốn giai đoạn của thai (đúng chuỗi sn10.1:3.1–3.4, đã có bản Việt trong kho: thai tươi, thai thể, thịt khối, thai đặc), tiếp theo là khuddaka đứa trẻ nhỏ và mahanta người lớn; toàn bộ vế "mẹ của … khác" là mẹ của từng giai đoạn thân thể, không phải gia súc. Cách dịch cũ vì thế làm mất hẳn luận điểm của ví dụ.

  KHOÁ ĐỔI NGHĨA (accuracy fix), 16 khoá trên 32 (thêm 2.6 chỉ chỉnh lời xưng cho khớp 3.5 và 3.7). 2.2, 2.3, 2.9: bản cũ gọi người đối thoại là đại đức (danh xưng của tỳ-kheo) và ở 2.9 gán động từ ngôi thứ nhất ahosiṁ cho Đại vương; sửa theo Pāli: Trưởng lão nói ngài (tvaṁ) với vua, 2.9 là chính Trưởng lão (ahaṁ), và đúng theo tiền lệ mil3.1.1:4.2 (ngài) và 4.3 (tôi). 2.3 bản cũ đảo nghĩa (không phải một người khác); Pāli là Đại vương nhận mình khác đứa bé (añño … añño ahaṁ). 2.4 bỏ của đại đức (Pāli không có sở hữu), sippavā thành người có nghề (tiền lệ ja546:159.1 có nghề, cnd6:11.10 tài nghệ), và mở lời trích dẫn cho khớp Pāli (Pāli mở ngoặc ở 2.4 và đóng ở 2.5; bản cũ mở ở 2.5). 2.5 xem mục trên; sikkhati là học nghề, sikkhito là đã học xong, không phải huấn luyện. 2.7 bỏ đại đức. 3.2, 3.3: kiṁ so sabbarattiṁ padīpeyya là hỏi ngọn đèn có cháy suốt đêm không, bản cũ dịch thành điều gì khiến người ấy phải thắp. 3.4, 3.6: yā acci sā acci hỏi về sự đồng nhất của ngọn lửa giữa hai canh, bản cũ dịch thành có tiếp tục cháy. 3.8: añño so ahosi hỏi ngọn đèn mỗi canh có phải một ngọn khác, bản cũ bỏ chữ khác ở vế đầu và đảo thành khẳng định. 3.9, 4.3: bỏ tất cả đều đi kèm với bản cũ vì Pāli không có. 3.10 và 4.4 (cùng một câu, đã kiểm hai khoá khớp nhau): añño uppajjati, añño nirujjhati là pháp này sinh, pháp khác diệt (chủ ngữ của dhammasantati), không phải người; bỏ liên tục (Pāli không có); apubbaṁ acarimaṁ là không trước không sau; và purimaviññāṇe pacchimaviññāṇaṁ saṅgahaṁ gacchati là thức sau đi đến sự gồm nhận trong thức trước (saṅgaha, cùng gốc với ekasaṅgahitā ở 2.9), không có nissāya, nên câu cũ lấy cái biết trước làm nơi nương tựa là thêm nghĩa. 4.2: duyhamānaṁ là sữa đang được vắt, bản cũ dịch khuấy sữa; ghata dịch bơ lỏng, navanīta bơ tươi (tiền lệ an10.119, an4.95: bơ tươi; sappi bơ lỏng ở nhiều bài an), bản cũ gọi cả hai là bơ và bơ đặc.

  KHOÁ SẮP LẠI. Khoá 3.10 trước đây nằm sau 3.1 trong tệp; đã đưa về đúng thứ tự Pāli.

  GIỮ NGUYÊN (có đo tiền lệ). Vua nói: và Trưởng lão nói— (51 và 21 nơi tầng mil, đa số rõ rệt cho cả hai công thức). Xin hãy xét một thí dụ (nhiều tệp mil; karohi là nêu ra, cách dịch xét còn hơi nhập nhằng ai là người xét, ghi là bất định nhỏ, nhưng đã thành quy ước cả bầy). Khéo lắm, thưa tôn giả Nāgasenā.

  BLOCKER GỠ. Blocker thứ hai (coverage tầng Anh 0 và chưa có mục trong reference-gaps) đã gỡ: mục mil3.2.1 hiện đã có trong reference-gaps.yaml (16 khoá có nội dung, 0 có Anh, coverage 0), tức mất mát đã được ghi nhận theo đúng cơ chế của kho; và đây không phải lỗi văn bản mà là hệ quả của việc không có tầng Anh, vốn đã nằm trong blocker thứ nhất. Các khoá Pāli có nội dung đã đọc từng khoá đối kháng với Pāli (không một khoá nào dựa vào Anh); triangulation giữ 6,5, không cao hơn 8,0.

  BLOCKER GIỮ. Blocker thứ nhất (không có bản Anh Sujato cũng như bản Việt hiện hành tại commit đã ghim) là sự thật về upstream và được giữ nguyên.

  BẤT ĐỊNH CÒN LẠI. (1) Dịch saṅgahaṁ gacchati là được gồm vào; có thể đọc là thức sau thuộc về thức trước hoặc được tính chung với thức trước; hai cách đều không thêm quan hệ nhân quả, và không có bản đối chiếu để phân xử. (2) Dịch yo uppajjati là người được sinh ra nhờ bối cảnh tái sinh của câu hỏi; Pāli chỉ nói yo (kẻ nào). (3) Chuỗi thai 2.5: khuddaka và mahanta dịch là đứa trẻ nhỏ và người lớn theo mạch khuddaka đến mahanta; đây là cách đọc theo ngữ cảnh, không có bản đối chiếu.
