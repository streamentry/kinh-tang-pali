notes: |-
  VĂN XƯNG. Bài nằm ngay cạnh mil3.2.2 đã merge, và cả bầy mil3.2.2 đến mil3.2.9 dùng thưa tôn giả Nāgasena (tôi đếm 8 tệp) và này Đại vương (đếm 5 tệp). Đa số cả tầng mil cũng là này Đại vương (325 khoá / 93 tệp so với tâu và Tâu Đại vương 74 khoá / 14 tệp). Tôi theo đa số trong phẩm.

  CÔNG THỨC ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN, ĐẾM ĐƯỢC. Rājā āha— → Vua nói: (38 tệp mil, đa số rõ rệt; 14 tệp dùng Vua nói—, 6 tệp dùng Đức vua nói—). Thero āha— → Trưởng lão nói— (6 tệp dùng gạch nối so với 4 tệp dùng dấu hai chấm; mil3.2.2 của lát trước chọn dấu hai chấm để nhất quán với Vua nói: trong bài, tôi theo số đông của từng công thức riêng và ghi lại ở đây). Opammaṁ karohī → Xin hãy xét một thí dụ (10 tệp). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa (3 tệp). Na hi, bhante → Không phải vậy, thưa tôn giả (7 tệp). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā (60 tệp, gần như tuyệt đối). Dấu tiếng ấy-ti của Pāli được giữ nguyên ở cả bốn tệp mil đã merge; đếm cả tầng mil: 272 khoá dùng ”ti và không khoá nào dùng ”vậy, nên tôi theo ”ti; riêng 5.1 theo đúng 60 tệp đã có là chấm dấu chấm.

  THUẬT NGỮ MỚI, 0 TIỀN LỆ, ĐÃ GHI. dhammasantati → dòng pháp, sandahati → tiếp nối. ācariya → thầy dạy, sippavā → thầy tập. Động vật 2.5: kalala bê con, abbha ngựa non, pesī bò non, ghana bò cái, khuddaka ngựa nhỏ, mahanta gia súc lớn. padīpa → ngọn đèn (đã có 1 tệp mil dùng ngọn đèn). yāma → canh (chưa có tiền lệ cho canh đêm). dadhi sữa đông, navanīta bơ, ghata bơ đặc; một tệp mil đã có gọi navanīta là bơ lỏng theo một nghĩa khác nên tôi giữ bơ.

  BỔ SUNG CHỦ TỪ Ở 2.4. Pāli chỉ có dãy mātāti, pitāti, ācariyotipi, sippavātipi, sīlavātipi, paññavātipi; tôi thêm của đại đức ở những vế không có sở hữu tường minh để câu tiếng Việt đọc được (không thêm ý mới, chỉ làm rõ chủ thể).

  ĐỘNG VẬT 2.5. Đây là ví dụ về con vật bị chặt tay chân khi làm điều ác; tôi dịch theo nghĩa thông thường của sáu loại gia súc non.

  Cổng kỹ thuật do coordinator chạy sau khi gộp lát: npm run validate, npm test, npm run check, npm run build. Trong lát này tôi bị cấm chạy bốn lệnh đó, nên KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0.

