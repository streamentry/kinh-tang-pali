notes: |-
  BÀI NÀY GIỜ ĐÃ DỊCH TRỌN: 36/36 khoá Pāli. Lát trước chỉ giao 1 khoá (9.1) vì chốt
  `kiểm` của `_hvi.py` lọc `len(p[k]) >= 40`, mà ở tha-ap 23/24 khoá Pāli ngắn hơn 40
  ký tự — chốt quét không mấy khoá nào rồi báo xanh. Lát này tự viết năm phép kiểm quét
  MỌI khoá (xem cuối notes).

  `translationTitle` BẰNG ĐÚNG giá trị `:0.3` (không thêm số thứ tự). Pāli `:0.3` =
  `Citakapūjakattheraapadāna` KHÔNG bắt đầu bằng chữ số, nên theo chính sách đã đo
  (KEEP 13 · DROP 297 trên 310 tệp tha-ap có cả Pāli lẫn metadata) thì phải BỎ số. Tệp
  này trước đó ghi `Kinh Kệ Của Trưởng Lão Citakapūjaka`; đó là dạng chỉ có **3** tệp
  trong cả 428 tệp tha-ap (tha-ap108, 112, 130) và 3/17 trong phạm vi 108–140, nên tôi
  đổi theo đa số phạm vi gần nhất để không nhân bản dạng lạ. Đo ở 100–200: Bài Kệ Tuyên
  Ngôn 29 · Ngợ 21 · Ký Sự 20; ở 150–200: Ngôn 22 · Ngợ 12.

  PHE DẤU `ti`. Đo lại ở hai phạm vi: TOÀN TẦNG tha-ap có 605 khoá chứa "Tuyên Ng" →
  Ngợ 417 · Ngôn 162; phạm vi gần 100–200 có 99 khoá → Ngôn 55 · Ngợ 41; gần 150–200
  có 65 khoá → Ngôn 41 · Ngợ 21. Cả hai phạm vi gần đều nghiêng về Tuyên Ngôn, và
  `Tuyên Ngợ` là sai chính tả (nghĩa là `uddāna`), nên bài này dùng Tuyên Ngôn. Cả hai số
  đều được ghi ở đây để người điều phối gộp.

  TÊN RIÊNG giữ nguyên dạng Pāli, không dịch nghĩa. Đã đối chiếu HAI nơi trong chính bài:
  tiêu đề `:0.3` và lục kết `:10.1` — 11/11 khớp. Pāli ở dạng Nom. sg. nên bỏ dấu hiệu
  Nom., đúng như tiền lệ cùng tập.

  LỆCH CÓ CHỦ Ý, KHÔNG NHÂN BẢN TIỀN LỆ ĐÃ BIẾT SAI. `sikhino lokabandhuno` (1.4)
  có **17** khoá cùng Pāli trong tầng và **16** cách Việt, nhưng 14/14 cách có mặt đều
  sai theo cùng một lối: biến `sikhino` (tính từ, "đội đỉnh cao") thành tên riêng "Sikhī",
  và dịch `lokabandhu` ("kẻ phá tan gánh nặng của thế giới") thành "thân hữu / thân
  quyến của thế giới" — tức đảo ngược nghĩa. Tôi dịch từ Pāli: *bậc đội đỉnh cao, kẻ cởi
  gánh nặng thế gian*. Tôi bị cấm sửa tệp thuộc lát khác, nên đưa lên wording bám Pāli
  chứ không đưa lên wording đã biết là sai; **người điều phối nên quyết định một lượt
  cho cả 17 khoá** này.

  `sāmacco saparijjano` (1.2) đọc được hai hướng ngang nhau trong Pāli, và cả hai đều có
  tiền lệ: `tha-ap113:7.4` dùng nghĩa "kẻ chấm dứt trọn vẹn kẻ ác" cho cùng chuỗi Pāli.
  Ở đây ngữ cảnh là cung điện vua Vasāmi nên `sāmacco` = sáu mươi và `saparijjano` =
  bậc chúa các thành phố; tôi dịch *bậc chúa sáu mươi thành phố*. Hai tiền lệ hiện có
  cho `Ekūnatiṁsakappamhi` đều dịch sai ngữ pháp — chúng dùng "Vào … kiếp trước" trong
  khi Pāli là cách ngữ `-kappamhi`, nên tôi dịch *Trong hai mươi chín kiếp ấy*.

  SỐ ĐẾM ĐÃ HIỆU CHỈNH, KHÔNG ĐOÁN. `Ekattiṁse` (6.1) = 31 (17 tiền lệ "ba mươi mốt
  kiếp"), `Ekūnatiṁsakappamhi` (7.1) = 29 (2 tiền lệ), `soḷasa` (7.2) = 16, `sāmacco`
  (1.2) = 60. Lớt này không có `…paññāsa` nên không dính lỗi đếm sai; để chốt lại hệ đó
  cho lát sau: `ekapaññāsa`→51, `sattapaññāsa`→57, `catuppaññāsa`→54, cùng hệ `50 + chữ
  số`, đều đo từ tầng chứ không suy đoán.

  `citaka` dịch *quả ấu*, không phải chim sẻ: `citapūjā` là sự cúng dường, và tầng này
  có 2 tiêu đề dịch `Citakapūjaka` thành *Cúng Dường Trái Cây* (tha-ap284, tha-ap531). Còn
  `citaka` có **0** tiền lệ cho nghĩa cây quả, nên tôi giữ đúng nghĩa "quả" và không gọi
  tên loài.

  CÁC CÔNG THỨC ĐÃ ĐO. `Pasannacitto sumano` (2.1, 3.3) → *Với tâm tịnh tín hân hoan*
  (45/68). `Bhavane upaviṭṭhohaṁ` (4.1) → *Khi đã ngồi yên trong chính nơi ấy* (1/1).
  `Tena kammena dvipadinda` (4.3) → *Nhờ vào nghiệp ấy, bạch Đấng Lưỡng Túc Tôn* (5/7).
  `narāsabha` (4.4) → *bậc Trưởng Thượng thế gian, đấng Nhân Ngưu* (10/44).
  `sampatti` (5.1) → *thành tựu*; `acalaṁ ṭhānaṁ` (5.3) → *cảnh giới bất động* (4/7).
  `jayaparājayaṁ` (5.4) → *buông bỏ cả thắng lẫn bại* (6/7). `pupphamabhiropayiṁ`
  (6.2) → *khi tôi dâng cúng vòng hoa ấy* (14 tiền lệ cùng công thức).
  `Duggatiṁ nābhijānāmi` (6.3) chọn theo phạm vi 150–200 (32 khoá): *Tôi không còn biết
  đến đọa xứ nào* 11 và *Tôi không còn biết đến khổ xứ* 11, cộng lại 22/32 thuộc họ
  "không còn biết đến … xứ" — tôi chọn nhánh đọa xứ. `cakkavattī mahabbalā` (7.4, số
  nhiều) → *là các Chuyển Luân Vương có đại oai lực* (19 tiền lệ).

  DẤU LƯỢC. `8.2` giữ đúng MỘT `…` cho `…pe…` của Pāli, không bung văn. Chốt
  `lược()` của `_hvi.py` khớp từng khoá 36/36.

  NHÁY KÉP CHẠY QUA KHOÁ. Pāli mở ở `1.1` và đóng ở `8.3`; bản Việt cũng vậy. Đây là
  điều kiện đúng của SuttaCentral, không phải lỗi cân từng khoá.

  `:0.1` = `Therāpadāna` được giữ **nguyên văn Pāli** (tiền lệ 391/400 tệp tha-ap). Đây
  là tên mục của phẩm, không phải văn xuôi, nên giữ Pāli là đúng; đây là khoá `:0.1` này
  là toàn bộ số khoá trong lát có bản Việt trùng nguyên văn Pāli, và tôi ghi rõ để biên
  tập không tưởng là sót.

  QUÉT CƠ HỌC (tự viết, quét mọi khoá, không lọc 40 ký tự): tập khoá Việt = tập khoá Pāli
  36/36, 0 thiếu, 0 thừa, 0 orphan; ngoặc kép cân trên cả bài; 0 lệch nháy đơn; số dấu
  lược khớp từng khoá 36/36; 0 khoá trùng nguyên văn Pāli ngoài `:0.1` đã giải thích;
  0 chữ phiên Latin; NFC 36/36; 0 lặp từ liền kề; 0 khoá `(…)`. Chốt `lọt_pāli` của
  `_hvi.py` không bắt được từ Pāli mới nào (0). Cặp Pāli trùng nội bộ bài: **1** cặp —
  `Pasannacitto sumano,` ở `2.1` và `3.3` — và cả hai khoá dịch **giống nhau**, đúng,
  vì cùng một vế kệ lặp lại nguyên văn. Tỉ số độ dài Việt/Pāli: toàn bài 0.25–2.10
  (trung vị 1.40); bỏ tiêu đề, uddāna và khoá `…pe…` thì 0.81–2.10 (trung vị 1.47,
  n=29). Biên độ rộng là bình thường ở đây vì mỗi vế kệ Pāli chỉ 18–26 ký tự.

