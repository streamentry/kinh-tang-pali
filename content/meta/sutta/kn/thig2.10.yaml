notes: |-
  Đã đọc HẾT Pāli lát qua v1/f2.pali.txt trước khi viết. Không khoá nào có …pe…; nháy kép mở ở 1.1 và đóng ở 2.4 đúng Pāli. Dòng niệt danh 3.1 giữ hai dấu lược.

  Pāli trùng nguyên văn, đã đếm bằng script và dùng lại nguyên văn có sẵn — đây là phần quan trọng nhất của bài:
  1.1-1.4 trùng y hệt thig3.2:1.1-1.4 (Catukkhattuṁ pañcakkhattuṁ …), giữ nguyên Bốn lần năm lần / tôi đã rời khỏi nơi tịch trình / Chưa từng có được sự vắng lặng của tâm / sự làm chủ của tâm.
  2.1 và 2.3 trùng thig2.9:2.1, 2.3 và thig3.1:3.1, 3.3; bản nháp đầu tôi tự dịch là Tuy nhiều pháp khổ đau và Sự chấm dứt khát ái đã đạt được, một lượt review đối chiếu chéo bắt ra sự lệch này và đã sửa theo nguyên văn đã có: Tuy mang nhiều điều khổ đau và sự chấm dứt tham đã đạt được.
  2.4 kataṁ buddhassa sāsanan ti trùng thig2.9:2.4 và nằm trong bảng Pāli trùng của TIEN_LE_PHAI.md, giữ nguyên một chữ đã làm tròn lời dạy của Đức Phật ti.
  2.2 appamādaratāya me là nơi duy nhất tôi cố ý không bám theo thig2.9:2.2 và thig3.1:3.2, vốn dịch là ta vẫn không lười biếng. Có hai lý do: me là đại từ số ít thứ nhất nên bản Việt phải là tôi, và glossary content/glossary/pali-vi.yaml đã ghim appamāda là không phóng dật, còn không lười biếng là kosajja. Giữ tôi yêu thích sự không phóng dật và ghi lý do ở đây để lát sau đừng sửa nhầm thành lệch thuần ý kiến.

  Tiền lệ có đếm và dùng lại: Dukanipāta → Bộ Hai Bài Kinh (152); tịch trình (7), vắng lặng của tâm (4), sự làm chủ của tâm; taṇhā → khát ái (286); appamāda theo glossary content/glossary/pali-vi.yaml là không phóng dật, giữ đúng quan hệ với pamāda; Du khipāta niṭṭhito → Bộ Hai Bài Kinh đã kết thúc (0 tiền lệ riêng cho niṭṭhita, đặt mới; cùng khuôn với an2.179:1.6 và sn34.55:3.7).

  Một lượt review tự bắt được lỗi: bản nháp đầu dịch 2.2 là tôi không hời hợt với sự không phóng dật, nghe nghịch lý vì kép không phóng dật lại hời hợt. Pāli appamādaratāya là vì yêu thích sự không phóng dật, nên đã sửa thành tôi yêu thích sự không phóng dật.

  Triangulation: có English Sujato đủ 15/15 khoá, từng khoá đã đối chiếu tay. Không có Việt hiện hành cho Khuddaka Nikāya tại commit đã ghin. Không chạy được npm run validate|test|check|build theo lệnh phân công đợt này nên technical_integrity là 9.6.
