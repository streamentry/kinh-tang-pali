notes: |-
  **Cổng kỹ thuật của kho CHƯA chạy.** Đợt này lát được cấm chạy `npm run validate|test|check|build`,
  nên tôi **không** thể tuyên bố technical gate pass; `technical_integrity` đặt **9.6** chứ không
  phải 10.0 và bốn lệnh đó để người điều phối chạy. Tự kiểm riêng bằng script trên **MỌI** khoá
  (không chỉ khoá ≥ 40 ký tự mà `kiểm()` của `_hvi.py` quét): đủ số khoá của cả bài, đúng segment
  ID, không rỗng, NFC, không trùng nguyên văn Pāli, dấu lược khớp Pāli từng khoá, ngoặc kép cân
  trên cả bài, không `(…)`, không sót `pe…`, không Pāli lọt. Kết quả: SẠCH, 0 lỗi trên 236 khoá
  của cả lát.

  **Dấu lược — theo §10, không tự diễn giải.** Pāli có `…pe…` thì bản Việt giữ **một** `…` và
  **không** viết ra phần bị lược. Pāli viết đủ thì viết đủ; tôi **không** nén bằng `…` ở bất kỳ
  khoá nào. Hai khoá lệch dấu câu cuối câu (`cp33:1.3`, `cp5:1.1`: Pāli có dấu phẩy, bản Việt
  không) là **cố ý theo đúng tiền lệ `cp28:1.1`** — bản Việt của tầng không nhất thiết giữ dấu
  phẩy ở vế kệ đầu câu.

  **Pāli trùng nguyên văn ở bài khác — đếm bằng script, dùng lại nguyên văn đã có.** Quét toàn
  tầng Pāli gốc (5.764 tệp `*_root-pli-ms.json`, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn**
  từng khoá của lát này: **0 cặp trùng** (đếm theo cặp khoá-của-tôi × uid-khác, chỉ tính văn
  bản ≥ 20 ký tự sau chuẩn hoá). Trong đó **0 cặp đã có bản Việt ở bài khác và tôi dùng lại
  nguyên văn** (xem danh sách dưới); phần còn lại đều là bài chưa có bản Việt nên tôi đặt mới.
  **22 cặp dùng lại được đối chiếu từng chữ: 20 khớp tuyệt đối, 2 khớp phần thân nhưng khác
  hậu tố** — `ja151:2.1` và `ja178:2.1` phải mở lại dấu nháy kép vì Pāli mở nháy đúng ở đó (vế kệ
  đầu của bài kệ mới), nên đó là bắt buộc của chia khoá chứ không phải dịch khác.

  **Dùng lại (nguyên văn, không dịch lại):**
  Bài này **không** có khoá nào trùng nguyên văn ở bài khác.

  **Thuật ngữ mới của lát, đặt mới kèm lý do:**
  · `Tikanipāta` → **Bộ Ba Bài Kinh**; `Saṅkappavagga` → **Phẩm Suy Nghĩ**.
  · `Sukajātaka` → **Kinh Suka**: `suka` là **chim cút / chim đàn**. Tôi **giữ tên Pāli** chứ không dịch là
    *chim cút*, vì `kukkuṭa` đã được `ja236:0.4` dịch thành *Kinh Chim Cút* và nếu tôi cũng dịch *chim cút*
    thì hai loài khác nhau sẽ mang **cùng một tên tiếng Việt** trong cùng một tập. Giữ *Suka* theo đúng
    khuôn tầng dùng cho tên bài không có nghĩa thường quen (ja102, ja106, ja107, ja235, ja243).
  · `mattaññutā` / `amattaññū` → **biết chừng mực / không biết chừng mực**: đây là mệnh đề xuyên suốt cả bài,
    tôi dùng **một cặp từ** cho cả hai dạng (có – không) để bài đọc được như một lập luận, thay vì dùng
    hai cặp từ khác nhau.
  · `saṁsīdi` / `sīdanti` → **trượt ngã / gục ngã**: cùng một gốc nên tôi giữ cùng một nghĩa nhưng khác
    vế (vế `2.3` nói chuyện con nai, vế `3.3`–`3.4` nói về người nói chung).
  · `vihaṅgama` → **kẻ lang thang** (7 lần / 6 bài). `addhānamāpādi` / `aposayi` → **được sống thọ /
    gặp lại**.

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh:**
  · `mātarañca aposayi` (1.4) = *và gặp lại mẹ*. Trong truyện này mẹ của con nai đã chết, nên `mātarā`
    có thể mang nghĩa **sinh ra từ** chứ không phải *mẹ ruột*; nhưng `aposayi` + `mātarā` đọc thẳng
    thành *đạt được sự sống* cũng hợp với mệnh đề trước (*được sống thọ*). Tôi giữ *mẹ mình* vì đó là
    nghĩa mặt chữ; **đây là chỗ tôi không chắc**.
  · `2.1` `Yato ca kho bahutaraṁ,` / `2.2` `bhojanaṁ ajjhavāhari;`: `bahutaraṁ` ở `2.1` sửa `bhojanaṁ
    ajjhavāhari` ở `2.2`, và tân ngữ `vihaṅgamo` (con nai) đã mở ở `1.2`. Nháp tôi dịch *khi nào ngươi ăn
    quá nhiều / hỡi kẻ lấy thức ăn quá chừng* — **lặp ý hai lần** vì tôi nhân đôi `bahutaraṁ`; đã sửa
    thành *Nhưng khi nào, / hỡi kẻ lang thang ăn quá chừng,* để mỗi chữ Pāli chỉ xuất hiện đúng một
    lần. Đây là lỗi review tự bắt được.
  · Không có bản Anh; bài này dễ hơn các Jātaka khác trong lát nên `triangulation` 8.4 và
    `ambiguity_integrity` 9.3.
