notes: |-
  **Đo lại ba mệnh đề của lát.** `0.1` `Jātaka` → **Jātaka** (400/416 tệp `ja`);
  `0.2` `Navakanipāta` → *Bộ Chín Bài Kệ* **6/6**; `0.3` `Gijjhavagga` → *Phẩm Hươu*
  **6/6**. Cả ba khớp tuyệt đối với `ja429` — cùng phẩm, cùng bộ, nên tôi dùng chung
  một cách ghi.

  **Kinh tên.** `Cūḷasuvajātaka` → *Kinh Xoài Nhỏ*, đối xứng với *Kinh Xoài Lớn* của
  `ja429`; `0 tiền lệ` cho chính tên này nhưng `suvajā` = *xoài* có tiền lệ mạnh (xem
  `notes` của `ja429`). `:11.1` theo 383 cặp `<tên>jātakaṁ <số thứ>` đã có,
  `catutthaṁ` → *thứ tư* khớp 35/35.

  **Công thức trùng nguyên văn.** Trong lát này có **35 khoá** trùng nội bộ, và tôi dùng
  lại nguyên văn ở `5.1–5.4` và `6.1–6.4` (trùng `ja429` từng khoá), `9.1–9.4`, `10.1`
  (cùng `ja429`). Ngoài ra `6.2` `pattayāna vihaṅgama;` khớp nguyên văn `ja297:1.2`,
  và `9.2` khớp nguyên văn `ja398:7.2` = `ja399:7.2`.

  **`koḷāpa` — chỗ phải chọn, ghi rõ là chọn.** 0 tiền lệ trong tầng Việt cho `koḷāpa`
  trong nghĩa cây; tiền lệ gần nhất là các câu `sukkhaṁ kaṭṭhaṁ koḷāpaṁ` của tầng
  Trường Bộ, dịch *thanh gỗ khô* / *khúc gỗ khô kiệt*. Ở đây `koḷāpa` là **tên loài cây**
  trong `Cūḷasuvajātaka`, không phải gỗ chặt, nên tôi dịch *cây khô kiệt* ở `1.3` và
  `3.1`. Hệ quả phải nói thẳng: `3.1` là `sukkhañca rukkhaṁ koḷāpaṁ` — ba từ Pāli
  (*khô* · *cây* · *koḷāpa*) nhưng tiếng Việt thành *Cây khô héo, cây khô kiệt*, nghe
  lặp. Tôi giữ cả hai vì bỏ từ nào cũng là mất nghĩa; nếu biên tập muốn, cách sạch hơn
  là dùng *cây mộc* cho `koḷāpa`.

  **Hai câu tôi phải tự quyết.**
  - `2.2` `nekavassagaṇe bahū`: tôi hiểu là “dù cả nhóm cùng rớt xuống [ăn]”, dịch
    *dù cả nhóm cùng rớt xuống*. `vassagaṇa` không có tiền lệ nào trong tầng Việt, và
    tôi không chắc nghĩa là *rớt xuống* — đây là chỗ dịch theo phỏng đoán.
  - `7.2` `sapattaṁ saphalaṁ dumaṁ`: tôi dịch *khi cây kia đã cho đầy quả*; `sapattaṁ`
    là “đã tới”, nên nghĩa là “tới nơi cây kia đang đầy quả”.

  **Dấu lược:** 0/45 khoá có `…pe…`; bản Việt không có dấu lược nào.

  **Không có tầng Anh.** 0/45; `ja430` không nằm trong 83 tệp `ja` đã ghim.

  **Giải quyết draft 2026-10-12 (kiểm toán độc lập; thay thế các mục cũ nói về
  `suvajā` = xoài, `koḷāpa`, `2.2` và `7.2` ở trên).**

  *Lỗi gốc.* Bản cũ đọc `suva` là *xoài* và đặt tên bài là *Kinh Xoài Nhỏ*. Trong chính
  kho này `suva`/`suvo` là **con vẹt** (`ja484:5.2`, `6.2`, `14.3`, `ja503:2.4`, `12.2`
  đều dịch *vẹt*), và `:1.4`, `:6.1`, `:6.3` của bài gọi thẳng `suvassa`/`suva` đối với
  loài chim; không có cây xoài nào trong Pāli của bài (cây ở đây là `koḷāpa`, rồi `mahīruha`
  và `dumo` chung chung). Tên bài đổi thành *Kinh Vẹt Nhỏ*, đối xứng cặp `Cūḷa-` → *Nhỏ*
  (`ja193`, `ja263`, `ja443`…). Các khoá nặng nhất bị đọc sai, đã dịch lại:
  - `1.1` `haripattā` = *lá xanh* (bản cũ bịa *lá to bằng bàn tay khỉ*); `1.3–1.4` đây là
    câu hỏi về **tâm của vẹt** (`suvassa nirato mano`), không phải “sao ta lại bám”.
  - `2.2` `nekavassagaṇe bahū` = *đông đảo, suốt nhiều chuỗi năm* (`bahū` danh cách số
    nhiều như ở `1.2`; `vassagaṇa` cùng nghĩa với `ja545:117.1` *nhiều năm dài*). Bản cũ
    *dù cả nhóm cùng rớt xuống* là bịa.
  - `3.1–3.2` `sukkhañca rukkhaṁ koḷāpaṁ, opattamaphalaṁ dumaṁ` = *cây khô, cây mục, cây
    trụi lá, không quả*; bản cũ *cây vừa mới ra quả* ngược hẳn nghĩa, và `3.3` bản cũ *chim
    sẻ* (Pāli `sakuṇā` là chim nói chung; dùng lại *bầy chim bỏ rơi nó mà đi* của
    `ja502:10.3`, `ja533:20.3`, `ja534:15.3`, cùng Pāli, 3/3).
  - `4.2–4.4`: bản cũ *chính là những kẻ giết chim* là bịa (`pakkhapātī` không phải
    `pāṇātipātī`). Câu đúng: kẻ cầu quả mới gần, thấy hết quả thì bỏ; họ chỉ có trí vì lợi
    mình (`attatthapaññā`), kém sáng suốt (`dummedhā`), là hạng `pakkhapātī`.
  - `5.1–5.4` bản cũ (dùng chung với `ja429`) là *anh đối xử thân tình, quấn quýt bên nhau*
    / *ngươi tuyên thuyết điều chân chính, hết lòng ca ngợi bậc hiểu biết*: đều sai. Pāli
    là: *tốt thay, đã làm chứng* · *tình bạn, sự thân quen tự nói lên* · *nếu ngươi ưa pháp ấy,
    ngươi đáng được người hiểu biết khen ngợi*.
  - `6.1` `So te suva varaṁ dammi` = *Vậy ta ban cho ngươi, hỡi vẹt, một ân huệ*; `6.3`
    `vakkaṅga` = *kẻ thân cong* (3/3 tiền lệ `ja277`, `ja533`, `ja534`; bản cũ *kẻ thơm tho*
    là sai).
  - `7.1–7.4`: bản cũ *sapattaṁ* thành *đã cho đầy quả* và *kho tàng* đảo thế; `sapatta` =
    *có lá*, `api nāma passeyyaṁ` = *ước gì tôi được thấy lại*, `daliddova nidhiṁ laddhā` =
    *như kẻ nghèo có được kho báu* (`nidhi` → *kho báu*, 18 nơi).
  - `8.1–8.4`: bản cũ *họ lấy phải thứ hoa bất tử, rải xuống thân cây đa* bịa. Đúng: *rồi lấy
    thứ bất tử* (`ja485:25.3` *rưới bằng thứ bất tử*) *rưới lên cây*; cành mọc ra; *bóng
    mát dịu, dễ chịu* (`ja493:2.4`, `ja547:252.4`, `255.4`).
  - `9.1` `Evaṁ sakka sukhī hohi` là lời **vẹt nói với Sakka**: *hỡi Sakka, mong ngài được an
    lạc* (người hỏi/lời kính, không *ngươi*); `9.3–9.4` bản cũ *Y như ta nơi đây vui vẻ* lệch.
    `9.2` giữ nguyên văn *cùng với toàn thể quyến thuộc bà con;* (Pāli
    `saha sabbehi ñātibhi;` đã có 11 nơi trong tầng, 10 dùng đúng câu này, 1 chỉ khác hoa
    đầu dòng).
  - `10.1–10.4`: bản cũ *Ta cùng vợ lên đường, hành phương vào rừng Hoan Lạc* sai ngôi
    (`pakkāmi` là ngôi ba, aorist) và `nandanaṁ vanaṁ` là rừng **Nandana** (`ja546:79.2`
    *rừng Nandana*), chủ thể dùng *vị ấy* (không thêm danh xưng).
  - `0.3` `Gijjhavagga` = **Phẩm Kền Kền** (`gijjha` = kền kền: `ja164:1.1`, `ja399:2.1`,
    `ja530:42.1`, `63.1`; phẩm đặt tên theo `Gijjhajātaka` đầu phẩm). *Phẩm Hươu* của các
    bài cùng phẩm là sai; tôi chỉ sửa ở bài này, các tệp cùng `Gijjhavagga` (`ja427`,
    `ja428`, `ja431`–`ja438`… cả 10 tệp khác đo được đều ghi *Phẩm Hươu*) cần sửa cùng lúc.
  - Giữ nguyên: `0.1`, `0.2`, `6.2` (nguyên văn `ja297:1.2` — *đang sải cánh bay* hơi thừa
    chữ so với `pattayāna` nhưng giữ để thống nhất tầng, 1/1 tiền lệ).

  *Số khoá đổi.* 40/45 khoá có lỗi nghĩa hoặc lệch nghĩa so với Pāli ở bản cũ (đa số do
  đọc nhầm `suva` thành *xoài* rồi bịa tiếp quanh nó), đã dịch lại; giữ nguyên `0.1`,
  `0.2`, `6.2`, `9.2`, `11.1` (đã đúng cấu trúc, chỉ đổi tên bài). Số cặp Pāli trùng
  nguyên văn **trong chính bài**: 0 (phép này chạy rỗng, không có gì để đối chiếu). Với
  tệp `ja429`: 12 khoá trùng nguyên văn Pāli (`5.1–6.4`, `9.1–9.3`, `10.4`), nhưng bản
  `ja429` hiện sai cùng chỗ (nhận *suva* là *xoài*), nên không dùng làm tiền lệ; cần sửa
  `ja429` cùng lúc để hai bài khỏi lệch nhau.

  *Phân loại blocker.*
  - Blocker (A) không có bản Anh Sujato đã ghim: **giữ nguyên** — là sự thật của bản
    chụp upstream (45/45 khoá không có Anh), thuộc phần người biên tập xử lý riêng.
  - Blocker (C) tầng `vietnamese-current` chỉ có Pháp Cú: **đã gỡ** — đó là giới hạn
    tham chiếu của upstream, không phải lỗi văn bản; mọi bài `kn` ngoài Pháp Cú đều thiếu
    tầng này. Không có bản Hòa thượng Thích Minh Châu của bài này để đối chiếu.
  - Không còn blocker nào thuộc loại lỗi văn bản; không có chỗ nào phải giữ lại vì
    “không phân xử được”, nhưng các bất định dưới đây được ghi rõ.

  *Bất định còn lại (không thêm vào thân kinh).*
  - `koḷāpa`: 0 tiền lệ trong tầng Việt cho nghĩa này trong Jātaka; tôi hiểu là *cây khô,
    mục* (`sukkhaṁ … koḷāpaṁ` ở `DN` dịch *gỗ khô*), nên `1.3` *cây khô mục*, `3.1` *cây
    khô, cây mục*. Không khẳng định là tên loài.
  - `pakkhapātino` (`4.4`): dịch *hạng ngả theo một phe* (`pakkha` = phe/phía, `pātin` =
    ngả về); có thể có nghĩa chuyên biệt khác (loài chim theo cánh), không có tiền lệ
    trong tầng (0 nơi).
  - `metti saṁsati santhavo` (`5.2`): về văn pháp, `metti` có thể là danh cách hoặc đối
    cách rút ngắn, nên cả hai hướng *sự thân quen nói lên tình bạn* và *tình bạn, sự thân
    quen cùng tự nói lên* đều khả dĩ; tôi chọn cách trung tính không thêm tân ngữ.
  - `kiṁ dosaṁ passase` (`3.4`): *lỗi gì* ở đâu — nơi cái cây hay nơi việc bỏ đi của bầy
    chim — Pāli không nói; giữ nguyên chung.
  - `suvassa` (`1.4`): đọc là sở hữu cách *của vẹt* (nói về vẹt) thay vì `suva assa`
    *vẹt, tâm ấy của…*; không thay đổi nghĩa chung của câu hỏi.
  - Người nói ở `1` (Sakka hóa hiện, hay nói với người khác) không hiện trong Pāli của
    bài; không thêm người nói vào thân kinh.

  **Coverage English.** Mẫu số: 0 khoá Pāli có nội dung ≥ 40 ký tự (mọi dòng kệ của bài
  đều ngắn hơn ngưỡng), Sujato phủ 0/45 khoá nói chung; không có `english-project`;
  `vietnamese-current` không có bài này. Cổng coverage English **không đo được gì** ở bài
  này (mẫu số 0); không được hiểu là “đạt”;
  `triangulation` đặt 7,0 (≤ 8,0), dịch thẳng từ Pāli cộng tiền lệ đếm được trong tầng.

  **Kỹ thuật.** `technical_integrity: 9.6`: chưa chạy cổng máy; bốn lệnh `npm run validate`,
  `npm test`, `npm run check`, `npm run build` còn phải chạy trước khi coi tiêu chí 10 là
  đạt.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 10 khoá chênh lệch lớn nhất (0.2, 0.4, 1.2, 2.2, 3.1, 5.1, 5.2, 6.2, 7.1, 11.1) → khác nghĩa 2: sửa 1 (2.2: "đông đảo, suốt nhiều chuỗi năm" → "suốt nhiều chuỗi năm, thật nhiều" — "bahū" đứng liền sau "nekavassagaṇe", cùng cách và cùng số nhiều, như ở 1.2 "dumā nekaphalā bahū", nên nói về số năm; chữ "đông đảo" (số người ăn quả) là ý thêm), giữ 0, bất định 1 (5.1: "sakkhi kataṁ hoti" — bản mù hiểu là "kết thành bạn", bản dự án hiểu là "đã được làm chứng"; Pāli chỉ cho thấy câu khen tình bạn qua "metti saṁsati santhavo", nghĩa chính xác của "sakkhi" ở đây không phân xử được, giữ cách đọc cũ; cùng đoạn có ở bài song song kế bên với cùng cách dịch). Tám khoá còn lại (0.2, 0.4, 1.2, 3.1, 5.2, 6.2, 7.1, 11.1) chỉ khác diễn đạt hoặc đặt tên: "Bộ Chín Bài Kệ" theo đúng 12/12 tệp Navakanipāta của tầng; bản mù để nguyên "koḷāpa" ở 3.1 còn bản dự án dịch "cây khô mục" cùng nghĩa với tầng Trung Bộ. Rà đối kháng toàn bài (nháy, dấu lược, số, xưng hô, thuật ngữ) không thấy thêm lỗi. Không có bản Anh hay bản Việt độc lập khác.
