notes: |-
  **Phạm vi: đủ 759/759 khoá của mnd13, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải `snp4.13` (Mahābyūhasutta, Kinh Đại Bố), thuộc phẩm Aṭṭhakavagga, cấu trúc như `mnd12` (chú giải `snp4.12`), `mnd4`, `mnd5`, `mnd8`, `mnd9`: dẫn từng đoạn kệ in đậm, giải từng cụm, rồi nhắc lại cả đoạn kệ trong nháy kép. Có 20 đoạn kệ in đậm (`2`, `9`, `16`, `23`, `31`, `38`, `45`, `52`, `59`, `66`, `73`, `80`, `87`, `94`, `102`, `109`, `116`, `123`, `130`, `139`), mỗi đoạn được nhắc lại trong ngoặc kép (`8`, `15`, `22`, `30`, `37`, `44`, `51`, `58`, `65`, `72`, `79`, `86`, `93`, `101`, `108`, `115`, `122`, `129`, `138`, `159`); lời dẫn nhập có 2 lần *Vì thế, vị được hóa hiện ấy đã nói—* (`7`, `64`) và 18 lần *Vì thế, Đức Thế Tôn đã nói—*. Phần cuối giải câu *Muni* và *Bhagavā*: ba đoạn kệ trích có nháy (`142` bài kệ về đạo quân của Ma, `149`–`150` kệ về ba hạnh hiền trí, `152`–`154` kệ về bậc Mâu-ni) và lời giải danh hiệu Thế Tôn (`157`, theo `mnd7:16`). Pāli có 246 khoá mang thẻ in đậm, bản Việt không mang thẻ. Dấu lược `…`: 67 khoá (37 khoá có `…pe…`, đều thành đúng một `…`; 30 khoá có `…` trần), mỗi khoá giữ đúng số dấu của Pāli; 0 khoá có `(…)`; 0 khoá Pāli kết `….`. Nháy: Pāli có 69 khoá chứa “ và 69 khoá chứa ”, 0 nháy đơn, 2 khoá chứa ngoặc đơn (`139.5`, `159.5`); bản Việt khớp Pāli từng khoá (0/759 lệch cả ba loại), kể cả cặp nháy mở ở `117.12` đóng ở `117.14`, mở ở `149.1` đóng ở `150.4`, mở ở `152.1` đóng ở `154.4`.

  **Tên bài.** `0.1` → *Đại Tập Kể Lược*, `0.2` → *Kể Lược Phẩm Tám Kệ*, theo `mnd3`, `mnd4`, `mnd9`; `0.3` → *13. Kể Lược Kinh Đại Bố*, và `160.1` → *Kể Lược Kinh Đại Bố, thứ mười ba*, cùng khuôn với `mnd12:0.3` và `mnd12:116.1`. Tên *Kinh Đại Bố* theo `snp4.13:0.2` và `mil6.4.2:8.2` (đã publish). `1.1` → *Giờ đây, sẽ nói phần Kể Lược Kinh Đại Bố—*, theo `mnd9:1.1`, `mnd12:1.1`.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd13`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho kn/mnd và tệp tên `mnd-name` (tiêu đề bài: *Exposition of the Longer Discourse on Arguments*); không có tệp `mnd13_translation-en-sujato.json`. Lớp `english-project` không có `mnd13`; `vietnamese-current` chỉ có Pháp Cú. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự theo cách đếm của kho, bỏ khối `0.x`) là **256** khoá (225 nếu bỏ thẻ in đậm trước khi đếm); Sujato phủ 0/256, `english-project` 0/256, `vietnamese-current` 0/256. Ba tầng vắng hết ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`; không nâng điểm để né blocker, và entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.13` có trong tầng đã ghim nhưng là bản của **bài khác** (bài kệ), nên không tính là đối chiếu English của mnd13; chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.13`, các bài `mnd3`, `mnd4`, `mnd5`, `mnd7`, `mnd8`, `mnd9`, `mnd12` cùng đợt và các khoá chú giải tương ứng ở `cnd5`, `cnd11`–`cnd13`, `cnd16`, `cnd17`, `cnd19`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, gộp khoảng trắng) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: **257** khoá có tiền lệ, dùng lại nguyên văn **149** (theo khoá bản Việt trùng, mỗi khoá có thể trùng nhiều nguồn: `mnd12` 286, `mnd8` 232, `mnd9` 204, `mnd7` 184, `mnd4` 181, `mnd3` 174, `mnd5` 167, `mnd1` 113, `cnd9` 83, `cnd5` 73, `cnd17` 73), **108** khoá khác nội dung hoặc dấu câu (chủ yếu là 20 đoạn kệ và các lời nhắc lại kệ, lý do ở dưới). Thêm 104 khoá chỉ trùng sau khi bỏ dấu câu và chữ hoa/thường: dùng lại nguyên văn 6. Các khoá chú giải dài dùng lại nguyên khuôn của `mnd3`, `mnd4`, `mnd8`, `mnd9`, `mnd12`, `cnd11` (công thức *tùy miên*, *hết tham ái*, *tâm không còn giới hạn*, *chấp trước*, danh sách phiền não *giận dữ … thiêu đốt*, *gánh*, *đạo quân của Ma*, *Thế Tôn*). Đã dò **61 nhóm Pāli trùng nguyên byte trong chính bài** (78 khoá lặp thêm): 0 nhóm bản Việt khác. Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 101 nhóm (177 khoá lặp thêm), 0 nhóm bản Việt khác về nội dung sau khi chuẩn hoá dấu câu và chữ hoa (4 nhóm lúc đầu khác ở chỗ chia dòng kệ qua ranh giới khoá đã được thống nhất: `73.3`/`76.3`/`79.3`, `102.1`/`103.2`/`108.1`, `123.1`/`124.1`/`124.14`/`129.1`, `123.3`/`126.9`/`129.3`).

  **Chỗ bản Việt khác `snp4.13` (đã publish), kèm lý do.** Lời kệ của mnd13 được dịch theo chính lời giải đi kèm, không chép nguyên từ `snp4.13`, vì ở nhiều chỗ lời giải ngay trong bài này xác định nghĩa khác (tương tự cách `mnd12` xử lý `snp4.12`). Những dòng `snp4.13` đã khớp lời giải thì giữ nguyên chữ: 7 khoá bản Việt trùng đúng một dòng của `snp4.13` (`30.1`, `65.1`, `66.4`, `70.3`, `70.6`, `87.4`, `91.3`).
  - `2.1`, `3.10`, `8.1` *diṭṭhiparibbasānā* → *an trú trong kiến*, không phải *nương tựa vào tri kiến*: lời giải `3.6` giải bằng *vasanti saṁvasanti āvasanti parivasanti* và bản `mnd12:3.3` đã dịch cùng bốn động từ thành *an trú, sống chung, cư ngụ, lưu trú*.
  - `2.3`–`2.4`, `8.3`–`8.4` dịch là câu khẳng định (*tất cả họ đều rước lấy chê bai, và ở đó cũng nhận được tán thán*), không phải câu hỏi *phải chăng … hay cũng có người được tán thán* như `snp4.13:1.3`–`1.4`: lời giải `5.2`–`5.3`, `6.2` nói thẳng *sabbe ninditāyeva honti … pasaṁsaṁ … labhanti*. Hai cách đọc cho nghĩa khác nhau ở dòng này (xem bất định 1).
  - *vivāda* → *tranh luận* (không phải *tranh cãi*, vì *tranh cãi* là *medhaga* ở chuỗi năm mục `11.2`, `12.2`, `12.4`, `90.2`): `9.2`, `9.3`, `11.1`, `11.5`, `12.1`–`12.5`, `87.3`, `90.1`, `90.3`, `93.3`, `123.2`, `125.1`; so với `snp4.13` dùng *tranh cãi*, `mnd8:44.3` và `mnd8:47.1` dùng *tranh luận* (2 khoá).
