  - *vata* → *khổ hạnh* (`mnd4:38.3` *Các khổ hạnh: hạnh voi …*; 1 khoá chuỗi hạnh), *sīlabbata* → *giới luật và khổ hạnh* (`mnd4:61.6`, `mnd4:16.2`; `snp4.13:5.1` dịch *giới và nguyện*): `23.2`, `26.1`–`26.3`, `31.1`, `32.2`–`32.12`, `33.2`, `34.2`, `34.4`, `38.1`, `39.x`, `44.1`; riêng *sīlabbataparāmāso* → *giới cấm thủ* (`124.3`, `124.4`, theo `mnd4:61.3`, `dn33:1.11.170`).
