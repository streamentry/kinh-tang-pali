  - `94.1`–`94.4`, `101.1`–`101.4` *atisitvā* → *bỏ qua* (lời giải `98.1`, `99.1` giải bằng *atikkamitvā samatikkamitvā vītivattitvā*); *adakkhi ce kiñhi tumassa tena* → *nếu đã thấy, thì điều ấy có ích gì cho người ấy* (lời giải `97.5` giải *tumassa* là *tassa*, 0 tiền lệ chữ *tumassa*).
  - `102.1`–`102.4`, `108.1`–`108.4` *passaṁ naro dakkhati nāmarūpaṁ* → *con người khi thấy thì sẽ thấy danh sắc* (`snp4.13:15.1` *danh và sắc*); `102.4`, `108.4` dùng nguyên văn `mnd8:44.4`, `mnd8:50.4` (*vì các bậc thiện xảo nói rằng đó không phải sự thanh tịnh*).
  - `109.1`–`109.4`, `115.1`–`115.4` *nivissavādī* → *kẻ chủ trương cố chấp*, theo `110.2` (*… ti nivissavādī*) và `110.7` (*dubbinayo duppaññāpayo dunnijjhāpayo duppekkhāpayo duppasādayo*); *pakappitā diṭṭhipurakkharāno* → *đã hư cấu, đặt kiến lên hàng đầu*, theo `111.2`–`111.3` và `mnd4:59.15` (*lấy kiến làm cờ, biểu kỳ, chủ đạo*).
  - `116.1`–`116.4`, `122.1`–`122.4` *saṅkhā* → *nhờ trí phân định* (lời giải `117.8` ghi *Saṅkhā vuccati ñāṇaṁ*, `117.11` *saṅkhāya jānitvā tulayitvā …*), không phải *tính đếm* của `snp4.13:17.1`; *na diṭṭhisārī napi ñāṇabandhu* → *không lấy kiến làm cốt lõi, cũng không kết thân với trí* (lời giải `118.5`: *taṇhābandhuṁ vā diṭṭhibandhuṁ vā na karoti*); *upekkhatī uggahaṇanti maññe* → *vị ấy xả khi người khác nắm giữ, ta nghĩ vậy* (`120.2` *Aññe … gaṇhanti*, `127.2` *aññe … gaṇhante*); `snp4.13:17.4`, `18.4` dịch *khi người ta chấp thủ*.
  - `123.1`–`123.4`, `129.1`–`129.4` *vissajja ganthāni* → *tháo gỡ các nút thắt* (theo `mnd4:61.19`–`61.26`, *visajja* → *tháo gỡ*, 6 khoá; `snp4.13:18.1` *buông bỏ mọi trói buộc*); *na vaggasārī* → *không theo phe nhóm* (lời giải `125.2`: *na vaggehi dhammehi yāyati nīyati vuyhati saṁharīyati*).
  - `130.3`, `133.4`, `138.3` *dhīro* → *bậc kiên định* (`mnd12:86.1`: *dhīro paṇḍito paññavā buddhimā ñāṇī vibhāvī medhāvī* → *kiên định, có trí, có tuệ, sáng suốt, hiểu biết, thông tuệ, thông minh*; `snp4.13:19.3` dịch *bậc trí*); *chandagū* → *đi theo sự ưa thích* theo `132.2`.
  - `139.1`, `159.1` *visenibhūto* → *đã thoát khỏi các đạo quân nơi mọi pháp*, dùng lại nguyên văn `mnd4:46.1`, `mnd4:57.1` (và `139.2`, `159.2` từ `mnd4:46.2`, `mnd4:57.2`); lời giải `140.2`–`143.2` giải *senā* là *mārasenā*; `snp4.13:20.1` dịch *đã lìa xa mọi pháp*. `pannabhāro` → *đã đặt gánh xuống* (lời giải `144.14`: *patitabhāro oropitabhāro samoropitabhāro nikkhittabhāro paṭipassaddhabhāro*).
  - `148`–`154`: ba đoạn kệ trích có nháy tách từ nguồn khác (`iti67:3`, `an3.121:4`, `dhp268`–`269`, `snp3.6:28`); chỉ dùng lại từ ngữ khi hợp, nhưng *muni* → *bậc Mâu-ni* (tầng `snp`, `mnd` dùng *Mâu-ni*; `iti67`, `dhp` dùng *ẩn sĩ*, `an3.122` dùng *hiền nhân*: 3 cách dịch cho cùng một chữ trong ba bài khác nhau). Nội dung đã khớp lời kệ Pāli của chính mnd13.

  **Thuật ngữ, kèm số đếm.** *sacca* → *chân thật* trong kệ (`mnd12:9.3`, `9.4`; 7 dòng kệ ở `mnd12`) nhưng *thật* trong công thức *chỉ điều này là thật, ngoài ra là sai* (`4.2`, `4.4`, `70.2`, `70.5`, `96.3`, `96.5`, `110.2`, `110.4`, `132.4`, `132.5`; theo `mnd12:33.2`, `mnd8:3.3`, `mnd4:13.5`: tầng có *ngoài ra là sai* 62 khoá và *ngoài ra đều hư vọng* 84 khoá, giữ dạng của họ hàng gần nhất `mnd`). *sammuti* → *quy ước* (`snp4.13:3.1`, `10.4`, `17.3`; 0 tiền lệ khác trong `mnd`). *diṭṭhigata* → *kiến chấp*, *diṭṭhi* → *kiến*. *hīno nihīno omako lāmako chatukko paritto* → *thấp kém, hèn kém, hạ liệt, tồi tệ, đê tiện, nhỏ nhoi* (`mnd12:11.2`, `mnd5:5.10`, `mnd8:11.3`; 10 khoá chứa chuỗi này ngoài bài, chủ yếu ở `mnd12`); *appakaṁ omakaṁ thokakaṁ lāmakaṁ chatukkaṁ parittakaṁ* (`10.2`) → *ít ỏi, thấp kém, chút ít, tồi tệ, đê tiện, nhỏ nhoi* (bộ sáu từ riêng, 0 tiền lệ). *paramaṁ aggaṁ seṭṭhaṁ visiṭṭhaṁ pāmokkhaṁ uttamaṁ pavaraṁ* → *tối thượng, cao nhất, tối thắng, thù thắng, dẫn đầu, tối cao, cao quý* (`mnd4:5.3`, `mnd4:67.4`, `mnd8:71.2`; 3 khoá); `75.2` bỏ chữ *tối thượng* vì Pāli không có *paramaṁ* ở khoá đó. *satthā / dhammakkhāna / gaṇa / paṭipadā / magga* → *vị thầy / lời giảng pháp / hội chúng / đường lối thực hành / con đường* (`mnd12:98.2`, `mnd8:4.2`, `mnd9:114.7`). *kusalāvadānā …* → *tự cho mình là thiện xảo …* (`mnd12:53.7`, `mnd8:13.3`, dùng lại nguyên văn `28.4`). *dvāsaṭṭhi diṭṭhigatāni* → *sáu mươi hai kiến chấp*. *pahīnā samucchinnā vūpasantā paṭipassaddhā abhabbuppattikā ñāṇagginā daḍḍhā* → *đã được đoạn trừ, nhổ tận gốc, làm lắng dịu, làm an tịnh, không thể sinh khởi nữa, bị lửa trí tuệ thiêu cháy* (`mnd5:31.2`, `mnd9:98.10`, `mnd4:54.5`). *ajanayamāno asañjanayamāno anibbattayamāno anabhinibbattayamāno* → *không làm sinh ra, không làm sinh khởi, không làm phát sinh, không làm phát sinh trọn vẹn* (`mnd4:59.7`, `mnd9`). *pañca kāmaguṇe* → *năm dục trưởng dưỡng* (tầng: *năm dục trưởng dưỡng* 11+ khoá, *năm dục công đức* 3, *năm thứ dục lạc* 2). *puthujjanakalyāṇaka* → *phàm phu hiền thiện* (`cnd16:24.2`, `ps3.2:8.4`: 2 khoá; *phàm phu thiện lành* `ps3.1:16.2`: 1 khoá). *kappa* → *tạo tác*, *taṇhākappo / diṭṭhikappo* → *tạo tác do tham ái / do kiến* (`mnd4:55.2`–`55.5`, `cnd16:5.2`–`5.5`). *lepa* → *sự dính mắc* (`mnd9:99.7`–`99.10`, `cnd6:20.1`). *bhāra* → *gánh*; *khandhabhāra / kilesabhāra / abhisaṅkhārabhāra* → *gánh uẩn / gánh phiền não / gánh hành tạo tác*; dòng *patthayati / pihati* → *khao khát / ao ước*. *jāti-jarā-maraṇa-saṁsāra* ở `41.13` → *luân hồi sinh, già, chết* (`mnd3:62.9`, `mnd5:55.3`: *luân hồi sinh tử*). *Samaṇamuṇḍikāputta* giữ nguyên tên như `mn78:1.3`. Các tên riêng trong chuỗi hạnh ở `26.2` (*Vāsudeva, Baladeva, Puṇṇabhadda, Maṇibhadda, Inda*) giữ nguyên chữ như `mnd4:38.3` (1 khoá).

  **Số Pāli, tự tính** (phép tính chép lại theo từng chỗ). `dvāsaṭṭhi` = dve 2 + saṭṭhi 60 = 62 → *sáu mươi hai* (10 khoá, đủ 10/10 chỗ Pāli có `dvāsaṭṭhi`: `3.6`, `17.5`, `41.5`, `41.7`, `41.10`, `42.7`, `89.2`, `118.2`, `119.7`, `133.1`, như `mnd12`, `mnd5:3.3`); `dve` → *hai* ở `11.2`, `19.2`, `54.2`, `117.4`, `134.2`, `156.2` (6/6), `dvīhi` → *hai lý do* ở `32.2`, `135.1` (2/2, mỗi chỗ liệt kê đúng 2 lý do); `catūhi dhammehi` → *bốn phẩm chất* ở `25.2`, `25.3`, `25.5` (danh sách `25.4` đủ 4 chi: thân, lời, suy nghĩ, mạng sống); `catūhi ariyamaggehi` → *bốn Thánh đạo* ở `143.1`; `cattāro ganthā` → *bốn nút thắt* ở `124.2` (4/4 chi ở `124.3`); `tayo bhārā` → *ba gánh* ở `144.2` (3/3); `tīṇi moneyyāni` → *ba sự hiền trí* ở `146.1` (3/3 ở `146.2`); `cha munino` → *sáu bậc Mâu-ni* ở `151.1` (6/6 ở `151.2`); `tividhānaṁ` → *ba loại* ở `146.4`, `148.2`, `catubbidhānaṁ` → *bốn loại* ở `147.2`; `satta` → *bảy* ở `88.3`, `117.3`, `151.9`, `156.10`; `sattannaṁ dhammānaṁ` → *bảy pháp* ở `88.3`, `117.3`. Danh sách: `satipaṭṭhāna 4 · sammappadhāna 4 · iddhipāda 4 · indriya 5 · bala 5 · bojjhaṅga 7 · ariya aṭṭhaṅgika magga 8` → *bốn niệm xứ, bốn chánh cần, bốn thần túc, năm căn, năm lực, bảy giác chi, Thánh đạo tám chi* (`99.1`, `136.6`–`136.12`, `157.18`; 7/7); *aṭṭhannaṁ vimokkhānaṁ aṭṭhannaṁ abhibhāyatanānaṁ navannaṁ anupubbavihārasamāpattīnaṁ* → *tám giải thoát, tám thắng xứ, chín sự chứng đạt phép sống tiếp nối* (`157.16`, 8/8/9); *dasannaṁ saññābhāvanānaṁ dasannaṁ kasiṇasamāpattīnaṁ* → *mười / mười* (`157.17`); *dasannaṁ tathāgatabalānaṁ catunnaṁ vesārajjānaṁ catunnaṁ paṭisambhidānaṁ channaṁ abhiññānaṁ channaṁ buddhadhammānaṁ* → *mười, bốn, bốn, sáu, sáu* (`157.19`, 5/5); *catunnaṁ jhānānaṁ catunnaṁ appamaññānaṁ catunnaṁ arūpasamāpattīnaṁ* → *bốn / bốn / bốn* (`157.15`); *aṭṭhasamāpatti* → *tám thiền chứng*, *pañcābhiññā* → *năm thắng trí* (`118.5`); *catutthajjhāna* → *thiền chứng thứ tư* (`146.4`), *dutiyajjhāna* → *thứ hai* (`147.2`); *paṭhamā senā* → *thứ nhất*, *dutiyā* → *thứ hai* (`142.1`, `142.2`); danh sách các hạnh ở `26.2` đủ 22/22 mục; 10 cặp thắng bại ở `11.3` đủ 10/10; 8 tùy miên ở `56.2` đủ 8/8; 8 sức chi phối ở `125.2`, `132.2` đủ 8/8 và 4 thiên vị đủ 4/4; 7 động từ lược ở `126.2` đủ 7/7. Không có `navuti`, `tālīsa`, `sattati`, `tiṁsakappasahassa`, `koṭi`; không có cụm số chưa phân xử được.

  **Bất định (không thêm vào thân kinh).**
  1. `2.3`–`2.4`, `8.3`–`8.4` *Sabbeva te nindamanvānayanti, Atho pasaṁsampi labhanti tattha*: lời giải `5.2`–`6.2` đọc thành khẳng định (*tất cả đều bị chê bai … cũng nhận được tán thán*); `snp4.13:1.3`–`1.4` và bản Anh của `snp4.13` đọc thành câu hỏi (*phải chăng … hay cũng …*). Chọn cách đọc của lời giải vì Pāli root của bài mang chính khoá này cùng lời giải; ghi để người biên tập quyết; `snp4.13:1.3`–`1.4` (bản Việt đã publish) cần được xem lại cùng chỗ này. Hệ quả: `snp4.13:1.1`–`1.2` đã bị đóng nháy kép, còn `mnd13:2.1`–`2.4` không có nháy (khoá Pāli không có), nên không đồng bộ dấu câu.
  2. `16.2`–`16.3`, `18.1`, `19.x` *upeti / upayo / kimeyya*: *cuốn vào* (`mnd3:56.2`) là một lựa chọn trong tầng; `mnd9:108.3` dịch *cầu cạnh* (1 khoá), `snp4.13:3.2` dịch *tham dự* (1 khoá); không phân xử. *kimeyya* ≈ *kiṁ upeyya* theo `19.7`.
  3. `33.2`, `33.4` *aññāya aparaddho ahaṁ* → *tôi đã lỡ mất vì cái khác*: 0 tiền lệ ngoài `mnd12` (cùng chữ *aññāya aparaddhā*), có thể là cách thể công cụ của *añña* hay của *aññā*; dịch sát chữ, không chọn.
  4. `45.1`, `46.2` *jigucchita* ↔ *tapojiguccha*: *khổ hạnh thanh tẩy* dựa vào `dn25` và lời giải; `snp4.13:7.1` dịch *điều đáng ghê tởm*. `45.3`, `48.1`–`48.7` *uddhaṁsarā* → *đi ngược dòng* (giữ như `snp4.13:7.3`); lời giải `48.4` chỉ liệt kê bốn chủ trương (*thanh tịnh tuyệt đối, thanh tịnh nhờ luân hồi, kiến vô tác, thuyết thường hằng*) nên nghĩa gốc của *uddhaṁsara* chưa chắc.
  5. `52.2`, `54.1`–`54.9` *pavedhitaṁ vāpi pakappitesu*: *run rẩy đối với những điều được hư cấu* là cách đọc sát lời giải `54.7`–`54.8` (run rẩy cả khi nghi bị lấy mất / đang bị lấy mất / đã bị lấy mất; nghi đổi thay / đang đổi thay / đã đổi thay); `snp4.13:8.2` dịch *run sợ trước những điều nó đã tạo ra*.
  6. `73.4`, `77.1`–`77.3` *samhi*: đọc là *trong trú xứ riêng của mình* (*sakāyane*) theo lời giải `77.2`; có thể *samhi* là dạng *sake* hay *sammā* (*đúng*), chưa phân xử.
  7. `87.2`, `89.1`–`89.5`, `93.2` *dhammesu niccheyya samuggahītaṁ*: đọc phủ định (*không có điều nào được nắm giữ*), nhất quán với `mnd9` mà ngược cách `mnd3:42.2`, `mnd5:38.1` (*được quyết định và nắm giữ*), vì Pāli ở đó nằm trong câu kệ khác; cần người biên tập xác nhận cả hai.
  8. `94.3`, `97.1`–`97.7`, `101.3` *tumassa* → *cho người ấy*: chữ này chỉ xuất hiện ở bài này (hapax trong tầng đã dịch); lời giải `97.5` dùng *tassa*; có thể là *tava+assa* (*cho ông*) — nếu vậy thì *ông* là người đối thoại; dịch theo lời giải.
  9. `116.1`, `117.4`–`117.15` *saṅkhā*: *trí phân định* theo lời giải `117.8`; có thể là *saṅkhā* = *sự đếm, sự phân loại* như `snp4.13:17.1`.
  10. `139.4`, `156.9`–`156.11`, `157.22`, `159.4` *nūparato*: lời giải `156.10` kể ba hạng (phàm phu *rajjanti*; bảy bậc hữu học *āramanti viramanti paṭiviramanti*; A-la-hán *ārato virato paṭivirato nikkhanto …*) mà không nói rõ vì sao A-la-hán lại *na uparato*; dịch *không ngưng dứt* như `snp4.13:20.4`, không giải thích thêm. 0 tiền lệ.
  11. `124.12`–`124.13`, `151.4`, `151.7` *diṭṭhapadā viññātasāsanā* → *đã thấy chân lý, đã thấu rõ lời dạy*: `an7.66:10.2` *đã thấy chân lý*, `kp6:12.4` *đã thấy Niết-bàn*, `ud4.9:3.3` *đã thấy pháp* (3 cách cho một chữ, 6 khoá `diṭṭhapad-` tổng cộng); chọn *chân lý* vì trung tính.
  12. `41.8`, `41.10` *niyāmāvakkanti* → *sự bước vào chánh vị*: `ne11:7.1` dịch *mức quyết tâm nhập vào* (1 khoá); không có tiền lệ khác trong `mnd`/`cnd`.
  13. `126.6` *chaḷaṅgupekkhā* → *sự xả có sáu chi phần*: 0 tiền lệ; *sumano / dummano* → *hoan hỷ / ưu phiền*.
  14. `17.6`, `119.8`–`119.10` *puthujjā* chơi chữ giữa *puthujjanehi janitā* (do phàm phu sinh ra) và *puthu nānājanehi janitā* (do nhiều người khác nhau sinh ra): tiếng Việt không giữ được dây ngữ nguyên, dịch hai cách đọc liền nhau.
  15. `135.8` *katā me micchādiṭṭhi, akatā me sammādiṭṭhi* → *tôi đã tạo ra tà kiến, tôi chưa tạo ra chánh kiến*: dịch sát chữ *kata*; nghĩa tự nhiên có thể là *khởi tà kiến*, *chưa khởi chánh kiến*.
  16. `126.2` *santattā samitattā vūpasamitattā vijjhātattā nibbutattā vigatattā paṭipassaddhattā* (7 chữ) → *làm yên lặng, làm an hòa, làm lắng dịu, làm tiêu mòn, làm tịch tĩnh, làm biến mất, làm dịu xuống*: theo cách chia của `mnd9:36.2`; `santo / asanto` → *an tịnh / không an tịnh* ở kệ, nên dòng giải dùng *yên lặng* cho *santa* thứ nhất: hai chữ khác nhau ở cùng một khoá.
  17. Lỗi ngoài lát, báo chứ không sửa: `snp4.13:1.2`–`1.4` (câu hỏi so với khẳng định, xem 1) và dấu nháy lồng “ trong “ ở `1.2`; `snp4.13:3.2`–`3.3` *tham dự*; `snp4.13:4.2` *giới nguyện*; `snp4.13:6.4` *dưỡng nuôi sự tịch tĩnh*; `snp4.13:7.1`, `7.3` (*jigucchita*, *uddhaṁsara*); `snp4.13:8.1`, `8.2` *lẩm bẩm*, *run sợ*; `snp4.13:10.3` *lục lọi*, *luận chiến*; `snp4.13:11.4` *khẳng định thật chắc*; `snp4.13:13.2` *quán xét*; `snp4.13:17.1`, `17.4`, `18.4` *tính đếm*, *khi người ta chấp thủ*; `snp4.13:20.1` *lìa xa mọi pháp* so với *đã thoát khỏi các đạo quân* ở `snp4.4:6.1`, `mnd4:46.1`. Chưa kiểm cả bài về nội dung.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (759/759, cùng thứ tự); nháy kép `“”` khớp Pāli từng khoá (0/759 lệch; 0 nháy đơn, 2 khoá có ngoặc đơn đều khớp, 0 nháy thẳng, 0 thẻ HTML); dấu lược `…` khớp Pāli từng khoá (0/759 lệch; 67 khoá có `…`); 0 khoá rỗng; NFC; không khoảng trắng thừa; Pāli lọt sang Việt: chỉ có các tên riêng *Samaṇamuṇḍikāputta* (`25.1`) và *Vāsudeva, Puṇṇabhadda, Maṇibhadda* (`26.2`) giữ nguyên như `mn78:1.3`, `mnd4:38.3`.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 210 khoá chênh lệch lớn nhất, đọc kèm toàn bài → khác nghĩa 10 cụm (khoảng 70 khoá vì kệ và lời giải lặp lại): sửa 0, giữ 6, bất định 4. Giữ: jigucchitaṁ 45.1/46 («khổ hạnh thanh tẩy», theo chính lời giải tapojiguccha trong bài và tiền lệ ở dn25; bản mù đọc «nhàm ghê» sát chữ hơn); uggahaṇanti maññe 116.4/120/123.4/127 (lời giải 120.2 nói người khác nắm giữ còn bậc A-la-hán xả, nên «xả khi người khác nắm giữ»; bản mù đọc «xem đó là sự nắm giữ»); sakāyana và samhi 73.4/77/80.2/82/86.2 (theo lời giải 77.2 sakāyane daḷhavādā); pajappati và jappita 31.3/34/52.1/53 (khấn nguyện; bản mù đọc «khao khát/ước vọng», cùng gốc taṇhā theo 53.7); kappa và pakappa («tạo tác»/«hư cấu», tiền lệ mnd4, mnd5, mnd10, snp4.13:17.1; bản mù thống nhất «dựng lập», cùng nghĩa khác chữ); kusalāvadānā 23.4/28/63 («tự cho là thiện xảo», theo lời giải kusalavādā). Bất định: nūparato 139.4/156/159.4 (hai bản cùng đọc «không ngưng dứt», nhưng lời giải 156.10 mô tả bậc A-la-hán là ārato virato paṭivirato nên cách đọc na + uparato chưa chắc khớp); uddhaṁsarā 45.3/48 («đi ngược dòng» hay «đi lên»); aññāya aparaddho ahaṁ 33.2/33.4 (aññāya chưa rõ); vayha, sandamānikā và sajjaṁ ở 124.7 (loại xe và nghĩa «đã lắp sẵn»). 91 nhóm Pāli trùng nguyên văn trong bài đều có cùng một bản Việt (một nhóm chỉ khác dấu câu). Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt cả 759 khoá, đoạn song song `cnd11`, `snp3.2`, `mnd4`, `mnd8`, `snp4.13`): sửa 2 khoá. `56.8` *kattha jappeyya pajappeyya abhijappeyya*: bản cũ chèn *khắp nơi* cho *pajappeyya*, không có trong Pāli và lệch cách dịch *pajappati* → *khấn nguyện* ở `34.2`; nay *… ở chỗ nào, khấn nguyện, khấn nguyện dữ dội*. `106.2` *iddhipādakusalā*: *như ý túc* → *thần túc*, cho khớp `91.2`, `99.1`, `136.8`, `157.18` trong cùng bài. Không có sai nghĩa trọng yếu nào khác (phủ định, chủ thể, số lượng, quan hệ logic đã soát lại; danh sách và số đếm khớp). Giữ nguyên các chỗ khác `snp4.13` (lý do ở các mục trên). Chưa sửa, để người biên tập quyết chung: `142.1` (và `cnd11:11.1`, `mnd4:49.1`, `mnd8:67.1`, `snp3.2:12.1`) *Kāmā te paṭhamā senā* thiếu *te* (*của ngươi*); `142.2` viết hoa *Thứ hai* giữa câu theo tiền lệ. Bất định giữ như mục Bất định ở trên (không có bản Anh, không có bản Việt độc lập; PED không tra thêm trong lượt này).

  Lô G3 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): kiểm lại lỗi lặp bằng Pāli đã ghim; sửa
  mnd13:151.1 `samannāgatā` sửa thành "Những vị thành tựu ba pháp hiền trí này là sáu bậc Mâu-ni"
