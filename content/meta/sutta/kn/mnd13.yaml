  - `45.1`, `46.1`–`46.3`, `51.1` *jigucchitaṁ* → *khổ hạnh thanh tẩy* (không phải *điều đáng ghê tởm*): lời giải `46.2` giải bằng *tapojigucchavādā tapojigucchasārā tapojigucchanissitā*, theo `dn25:8.2` (*khổ hạnh thanh tẩy*; `dn25` có 38 khoá chứa `tapojiguccha`). *muta* → *được nhận thức* ở `45.2`, `47.1`–`47.3`, `51.2`, `139.2`, `159.2` (theo `mnd4:46.2`, `mnd4:16.2`, `mnd9:105.4`, `snp4.4:6.2`), không dùng *cảm nhận* của `snp4.13:7.2`, `20.2`.
