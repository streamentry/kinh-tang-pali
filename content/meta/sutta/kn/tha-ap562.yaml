notes: |-
  Bản dịch chỉ từ Pāli root; commit đã ghim không có bản Anh upstream (giới hạn upstream, không phải lỗi của người dịch). Cổng kỹ thuật để coordinator chạy (người dịch bị cấm chạy): npm run validate, npm test, npm run check, npm run build; technical_integrity đặt 9.6 vì chưa chạy được các cổng này.
  Bản song song: Pāli của tha-ap24 (cũng là Upavāna, một bản truyền khác của cùng ký sự) có trong tầng Pāli nhưng chưa có bản Việt, nên chỉ được dùng để phân xử chỗ khó đọc, không dùng làm tiền lệ dịch. 5.1 tha-ap24 ghi rõ pañcamiyā bhūmi (tầng thứ năm), nên các số thứ tự giống cái ở 4.1 đến 5.3 được hiểu là tầng (bản này không nêu danh từ). 36.1 neso đọc như heso của tha-ap24 (nhấn mạnh, "thật cao cả"), không đọc là na eso vì nghịch với cả đoạn. 36.2 disaṁ đọc như īdisaṁ (tha-ap24 ghi dhātudharedisaṁ): "nơi nhà xá-lợi của Ngài lại như thế này". 2.3 bản này ghi sugataṁ, tha-ap24 ghi sukataṁ (khéo dựng); giữ đúng chữ của bản này.
  Số Pāli (tự tính): saṭṭhi 60 x sahassa 1.000 = 60.000 nhạc cụ (43.1); chaḷasīti = chaḷ 6 + asīti 80 = 86, x 1.000 = 86.000 (44.1); tiṁsakappasahassa = tiṁsa 30 x sahassa 1.000 = ba mươi ngàn kiếp (46.1; tiṁsa là 30, không phải 3); asītikkhattuṁ = 80 lần (46.3); sahassakkhattuṁ = 1.000 lần (47.1); kappasatasahassa = sata 100 x sahassa 1.000 = 100.000 kiếp (48.1, 52.1, 54.1); asītikoṭi = 80 koṭi (50.1, giữ nguyên đơn vị koṭi theo 2 tiền lệ); chiều cao bảo tháp: 6.4 một do-tuần, 9.2 thêm một và 9.3 dviyojana = 2, 13.3 tiyojana = 3, 16.3 thêm một rồi 17.1 catuyojana = 4, 21.1 thêm một rồi 21.3 pañcayojana = 5, 25.1 thêm một rồi 25.3 chayojanika = 6, 29.1 sattayojana = 7 (chuỗi 1, 2, 3, 4, 5, 6, 7 khớp với từng lần "thêm một do-tuần" của các nhóm chư thiên, rồng, ca-lâu-la, cưu-bàn-trà, dạ-xoa, càn-thát-bà); 30.3 yojanasate = 100 do-tuần; 53.3 tīṇi yojanāni = 3; 28.1 vediyo satta = 7 hàng lan can; 9.1 sattahi ratnehi = 7 loại châu báu; 59.1 dasamaṁ = thứ mười (tha-ap560 thứ tám, tha-ap561 thứ chín, tha-ap563 mười một).
  :0.3 của Pāli là Upavānattheraapadāna, không có số thứ tự nên :0.3 Việt không có số và translationTitle bằng đúng :0.3. Kiểu 0.3: phạm vi gần nhất (tha-ap545 đến tha-ap575, 18 tệp) Ký Sự 16 so với Tuyên Ngợ 2; toàn tầng Tuyên Ngợ 245 (thêm 10 Tuyên Ngợi) so với Ký Sự 151 so với Tuyên Ngôn 140. Hai phạm vi cho hai đa số khác nhau; chọn Ký Sự Về Trưởng Lão theo phạm vi gần nhất (cùng phẩm Yasa, tha-ap553 đến tha-ap563) và vì Apadāna là Ký Sự. Tuyên Ngợ là chính tả sai của Tuyên Ngôn, nên cần biên tập phán một lượt cho cả cuốn. 0.2 Phẩm Yasa theo 9 so với 1 (Phẩm Danh Vọng). Lời kết 58.1 dùng nhóm "những bài kệ này" (407 so với 21 là "bài kệ này").
  Thuật ngữ (số tiền lệ ở tầng tha-ap): thūpa và cetiya cùng chỉ một công trình nên đều dịch bảo tháp (bảo tháp 45, ngôi tháp 13, tháp 24); yojana là do-tuần (36); dhātu là xá-lợi (9); citaka là giàn hỏa (36); sugata là Thiện Thệ (30); tathāgata là Như Lai (25); yakkha là dạ-xoa (10, so với yêu quái 3); gandhabba là càn-thát-bà (4); kumbhaṇḍa là cưu-bàn-trà (5); garuḷa là ca-lâu-la (1, so với garuḷa 1); nāga là loài rồng (rồng 16 so với nāga 17); lohitaṅka là hồng ngọc (6); phalika là pha lê (6 so với pha-lê 1); rūpiya là bạc; pamatta là phóng dật (14); phalaṁ là quả báo (551 so với quả báu 90); tādī trong lokanāthassa tādino là bậc Bất Động theo đúng 2 tiền lệ cùng Pāli (tha-ap102, tha-ap277), trong khi các bài gần nhất (tha-ap560, tha-ap563) dịch tādī là bậc Vững Vàng (theo phép đo của tha-ap563: Vững Vàng 11, Như Thật 9, Bất Động 8); chọn theo tiền lệ nguyên văn và giữ một cách dịch trong cả bài (7 khoá). Ngôi: người kể ở khung ngoài là Upavāna dùng ta (tiền lệ cùng Pāli ở 55.1: 131 ta so với 54 tôi trên 190 khoá; nhóm gần nhất tha-ap560, tha-ap561 dùng ta); lời chư thiên, rồng và các loài dùng chúng ta; lời vị sa-môn thọ ký dùng ngươi (ngươi sẽ 44 so với ông sẽ 0 ở tầng tha-ap; tha-ap563 dùng ông cho lời Đức Phật chúc phúc, còn ở đây người nói là một tỳ-kheo, nên theo nhóm 44 khoá). Satasahassito kappe là đại kiếp (30 so với kiếp trước đây 12). Sukkamūlena codito là được khích lệ bởi cội nguồn thiện căn (32 trên 38 khoá). Cakkavattī bhavissati ở 47.2 dịch "sẽ làm Chuyển Luân Vương" (5 khoá không có đại từ) đúng chỗ Pāli ở ngôi thứ ba, không thêm đại từ. Brahmabandhu là thân quyến của Phạm thiên (9 khoá, so với người dòng Bà-la-môn 4). Lời thọ ký tương lai (kappe 48.1) dịch "Sau một trăm ngàn kiếp nữa" (Sau … nữa 16 so với Vào … nữa 8).
  Pāli trùng tiền lệ: 63 khoá có Pāli trùng nguyên văn ở các tệp tha-ap khác (5.278 cặp), 50 khoá dùng lại đúng văn bản dịch đã có (đa số), 13 khoá Việt khác vì lý do đã đọc: 1.3 (jalitvā là bất biến từ quá khứ "sau khi cháy rực", tiền lệ duy nhất tha-ap146 dịch tỏa sáng); 20.2 và 24.2 chỉ thêm "cho" vì ở đây là tân ngữ gián tiếp của làm bảo tháp; 32.2 (tiền lệ duy nhất tha-ap80:5.2 gọi là vị vua, trong khi ở đây abhisammata là tên của một dạ-xoa vì 32.1 yakkho và 39.1 Abhisammatako); 35.4, 37.1, 39.4 chỉ đổi ngôi tôi thành ta cho thống nhất với bài; 42.4, 43.4, 45.4, 54.4 dùng quả báo (551) thay quả báu (2 tiền lệ, tha-ap155 và tha-ap345; 90 so với 551 toàn tầng), 54.4 dùng đây là vì người nói là chính Upavāna; 50.4 thêm "trong giáo pháp" vì sāsane đứng ở dòng này; 51.1 làm hài lòng thay làm đẹp lòng (tiền lệ ārādhayeyyaṁ). Trong chính bài: 18 nhóm Pāli trùng nguyên văn; 14 nhóm Việt giống nhau; 4 nhóm Việt khác có chủ ý: 7.4, 11.4, 15.4, 20.2, 24.2, 27.4 so với 37.2 (37.2 là tân ngữ của cúng dường nên không có "cho"); 16.4 và 21.2, 25.2 so với 20.4 và 24.4 (tân ngữ của làm tăng thêm so với phủ bằng); 31.2 so với 34.4 (mệnh đề quan hệ so với câu chính); 42.4, 43.4, 45.4 so với 54.4 (đó là so với đây là); các khoá còn lại chỉ khác dấu câu hoặc dấu nháy do Pāli khác.
  Bất định (không thêm vào thân kinh): (1) 6.1 jaṅghā dịch phần thân (nghĩa đen là ống chân); thuật ngữ kiến trúc, chưa phân xử được. (2) 16.1 đến 16.2 Sabbaṁ maṇimayaṁ thūpaṁ, akaruṁ te ca kañcukaṁ: giữ trật tự Pāli, có thể hiểu họ làm lớp áo bọc để cả bảo tháp bằng ngọc ma-ni; khoá 6.3 (thūpo toàn vàng) so với 6.1 và 6.2 (jaṅghā, vedikā bằng ngọc) cũng chưa phân xử được. (3) 30.1 đến 30.2 abhibhonti na tassābhā: dịch mặt trăng, mặt trời cùng các vì sao không át được ánh sáng của nó; một cách đọc khác là ánh sáng của nó át được chúng, nghĩa chung vẫn là ánh sáng bảo tháp hơn hẳn; 30.4 pajjali dịch bừng sáng (ngọn đèn không cần thắp là cách hiểu ngầm, không đưa vào thân kinh). (4) 36.1 đến 36.2 xem phần bản song song ở trên. (5) 41.1 ānandī dịch vui mừng (bản song song tha-ap24 ghi ānanda); 41.2 pītisañjananaṁ dịch lời khiến niềm hỷ sinh khởi, danh từ lời không có trong Pāli. (6) 33.2 gacchato dịch đang di chuyển (sở hữu cách, nghĩa đen là của kẻ đang đi); 33.3 gacchantā giữ nghĩa đang đi, không nói đi đâu. (7) 39.2 hāsi dịch đã mang đi (tha-ap24 ghi ambarehāsi, cùng động từ). (8) 12.1 indanīla, mahānīla, jotirasa và 5.3 masāragalla là tên loại ngọc, giữ nguyên dạng Pāli; 26.4 guyhaka giữ nguyên dạng Pāli vì không có tiền lệ Việt trong tầng. (9) 47.2 và 49.4: 47.2 Pāli ở ngôi thứ ba (bhavissati) trong khi các dòng quanh nó ở ngôi thứ hai; tha-ap24:46.2 ghi bhavissasi; giữ đúng Pāli của bản này, không thêm đại từ. (10) 3.1 sarīrakiccaṁ dịch các nghi lễ cho thân thể (nghĩa tang lễ, nhưng chữ tang lễ không có trong Pāli, nên chưa dùng). (11) 19.1 và 23.1 paccekaṁ dịch mỗi nhóm riêng rẽ; chữ nhóm là phần tiếng Việt cần để chỉ các hạng chúng sinh vừa kể, không có trong Pāli.
  Phép kiểm tự viết (mẫu số ghi kèm): tập khoá Việt bằng tập khoá Pāli 230/230 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 230/230 (Pāli mở nháy kép ở 1.1, đóng ở 57.3; nháy đơn mở ở 7.3 đóng ở 8.4, mở ở 10.3 đóng ở 11.4, mở ở 14.3 đóng ở 15.4, mở ở 18.3 đóng ở 20.4, mở ở 22.3 đóng ở 24.4, mở ở 26.3 đóng ở 27.4, mở ở 36.1 đóng ở 37.4, mở ở 41.3 đóng ở 51.4; nháy đơn cố ý chạy qua nhiều khoá); dấu lược …pe… 3/3 khoá (55.2, 56.2, 57.2) giữ đúng một …; Pāli không có … trần và không có (…) nên Việt không có; không khoá rỗng, NFC đủ, không chữ số trong thân kinh, không Pāli lọt sang tiếng Việt ngoài tên riêng, tên đơn vị koṭi và tên loại ngọc đã nêu. 230 cặp Pāli-Việt đã in ra đọc từng cặp.
  Coverage English: mẫu số 1 khoá có nội dung (58.1); Sujato phủ 0/1; english-project 0; vietnamese-current 0 (tầng này chỉ có Pháp Cú). Với mẫu số nhỏ như vậy cổng coverage hầu như không đo được gì: đây không phải sự đồng thuận về cách dịch mà là việc không có bản Anh nào để đối chiếu.
