notes: |-
  **Sửa lan 2026-10-13** (cùng lỗi `kosohitaṁ vatthaguyhaṁ` đã sửa ở mn91). `snp3.7:10.6`, `snp3.7:11.4` — *vật dục được che kín, và lưỡi dài rộng* → *nam căn được vỏ bọc che kín, và lưỡi dài rộng* (`kosohite … vatthaguyhe`); `snp3.7:11.5` — *Rồi Đức Phật tác ý một thần thông như sau: để bà-la-môn Sela thấy vật dục được che kín.* → *Rồi Đức Phật thực hiện một thần thông khiến bà-la-môn Sela thấy nam căn được vỏ bọc che kín của Ngài.* (`bhagavato kosohitaṁ vatthaguyhaṁ`: *của Ngài* là `bhagavato`; Pāli trùng mn92:14.1 chỉ khác dấu phẩy, nên dùng lại cách dịch của mn92). Căn cứ: `vatthaguyha` là bộ phận kín của thân (nam căn), không phải *vật dục*; tầng dùng *nam căn được vỏ bọc che kín* ở dn14:1.32.16, dn30:1.2.13, dn30:1.31.6, mil5.3.3:3.1, mil5.3.3:3.4, mil5.3.3:4.1 và mn91, mn92 sau khi sửa. Cả ba khoá của bài này có cụm Pāli ấy đã sửa cùng một cách (mô tả chỉ nêu một khoá).

  Sửa dấu lược cùng lượt (để khớp Pāli từng khoá, mỗi `…pe…` ↔ đúng một `…`; trước đó cổng kiểm dấu lược báo lệch ở hai khoá này): `snp3.7:6.3` — liệt kê *người đào lò, người chặt củi, người rửa bát nồi, người dựng bình nước, người trải chỗ ngồi* → *người đào lò … người trải chỗ ngồi* (Pāli `appekacce uddhanāni khaṇante …pe… appekacce āsanāni paññapente` chỉ có hai vế, phần giữa được lược; ba vế giữa lấy từ mn92:6.3, không phải từ Pāli của khoá này); `snp3.7:7.4` — *Danh tiếng tốt lành của bậc Tôn giả Gotama ấy đã được tuyên dương như sau:* → *Về Tôn giả Gotama ấy …* (`Taṁ kho pana bhavantaṁ gotamaṁ …pe…`; phần công thức *evaṁ kalyāṇo kittisaddo abbhuggato* bị lược trong Pāli của khoá, không viết ra trong Việt).

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 8.8 — «sau khi chiến thắng đất liền đến tận bể, sẽ
  cai trị không roi, không đòn, bằng chính nghĩa» → «chinh phục và trị vì vùng đất đến tận biển
  bằng Pháp, không dùng gậy gộc hay vũ khí» (dhammena là «bằng Pháp»; adaṇḍena asatthena không
  phải thì tương lai; theo dn14 và các bài cùng công thức); 1.7 — dùng công thức đa số 17/30
  «chứng ngộ bằng thắng trí … tuyên thuyết điều ấy» (bỏ «Ác ma» cho Māra, «các … các» thừa); 11.6
  — thêm «le lưỡi ra» (jivhaṁ ninnāmetvā) và «vầng trán» (nalāṭamaṇḍalaṁ) theo mn91 và mn92; giữ
  nguyên khoá 11.4 «nam căn được vỏ bọc che kín» vì khớp 11.5 cùng bài và đúng kosohita («vật dục»
  của bản đa số bỏ mất ý vỏ bọc).
