    Trong chính bài: 24 nhóm Pāli trùng nguyên văn (sau khi bỏ dấu câu), tổng 333 cặp (phần lớn do dãy kệ lặp `14`–`18`, `21`–`33`, `59`–`64`); bản Việt khác ở 8 cặp, đều có lý do: `12.1`/`13.1` (người nói khác: Pabhāvatī nhắc lời thầy tướng / Kusa nói lời nói nào cũng được); `60.2`/`61.2` với `62.2` (con/chiếc, loại từ cho xe); `62.2` với `63.2` (như trên); `68.2`/`69.4` (khác một chữ "của" do cú pháp: tân ngữ của "xin tha thứ" / sở hữu của "chân"); `71.x`/`74.x` (người nói khác: "thiếp"/"ta", "ngài"/"nàng"); `84.4`/`85.4` được viết giống nhau.
  - Số Pāli:
    `sattati` (`0.2`) = 70; `satta` (`35.1` `bile`, `83.2` `khattiye`, `86.1` `dhītaro`, `89.4` `khattiyā`) = bảy, khớp "bảy vị sát-đế-lợi" và "bảy người con gái" của vua Madda; `vīsatiṁ` đi với `…sahassāni` (`59.1`–`64.2`) = 20 × 1.000 = 20.000 ("hai mươi ngàn" Bà-la-môn, voi, ngựa, xe, bò đực, bò sữa); `diguṇaṁ` (`77.4`) = gấp đôi ("cánh tay gập đôi"); `ekarathe` (`91.1`) = một cỗ xe; `paṭhamaṁ` (`93.1`) = thứ nhất. Không có cụm thuộc loại chưa phân xử được, và không có `Tiṁsakappasahassa`.
