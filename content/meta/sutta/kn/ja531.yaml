notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Tra tiền lệ (đếm được):** `Kusāvatī` **đã có sẵn** trong tầng Việt dưới dạng tên
  riêng — `dn17:1.3.3.0` "1. Kinh đô Kusāvatī", `dn17:1.3.9`, `dn16:5.18.4` — nên giữ
  nguyên chữ, không dịch và không phiên âm. (Đây cũng là lý do chữ có dấu Pāli ở đây
  không bị chốt `lọt_pāli` bắt: chốt cho phép từ đã có trong tầng Việt.) `Pabhāvatī`
  (hoàng hậu, ở `1.3`) cũng đã có sẵn trong tầng Việt.
  **0 tiền lệ, đặt mới:** `paṭigacchati` (mệnh lệnh) → *hãy đến*; `khippaṁ` → *mau*;
  `nicchāmi` (ở `2.4`) → *tôi sẽ bỏ mạng*.
  **Bối cảnh đã đọc trước khi dịch:** `1.1`–`1.4` là hoàng hậu Pabhāvatị trao vương
  quốc cho vua Kusa và dặn hãy đi, nên `2.1`–`2.4` là **lời vua đáp**; `2.3` phải giữ
  ngôi thứ hai. Vì thế tôi dùng *Hãy …* (mệnh lệnh, không có chủ từ) chứ không dịch
  "anh hãy" hay "ngươi hãy" — bỏ chủ từ ở đây đúng, vì tiếng Việt không cần và thêm vào
  là bịa.
  **Dấu ngoặc kép:** Pāli khoá này **không** có ngoặc (lời thoại mở ở `2.1` với `“`),
  và tôi cũng không thêm — dùng `‘` ở đây sẽ vỡ cặp trong bốn cột.
