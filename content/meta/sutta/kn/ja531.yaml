  - Chỗ bất định (không thêm vào thân kinh):
    + `2.1`–`2.2` `anujjubhūtena haraṁ mahantaṁ`: đọc là "khom mình mang gánh nặng lớn" (`anujju` = không ngay thẳng, `hara` = mang); chỉ rõ Pabhāvatī nói với Kusa, người đang làm việc nặng. `2.4` `nicchāmi dubbaṇṇamahaṁ vasantaṁ` → "tôi không muốn ngài ở lại với dáng vẻ xấu xí" (có thể là "nước da xấu").
    + `1.2` `sakāyuraṁ` → "có vòng xuyến" (`kāyūra`; `pv24:6.3`); `sayoggaṁ` → "đủ xe cộ" (`ja499:9.2` "xe cùng ngựa kéo"); `sabbakāmūpapannaṁ` → "đầy đủ mọi điều mong muốn" (`sabbakāmasamiddhi` ở `sn9.6:2.4`). `1.4`: `piyā pabhāvatī` đọc là "nơi có Pabhāvatī yêu dấu".
    + `6.1` `abbhūti` → "tai họa" (đọc là `abhūti`; có thể là cách đọc khác, không phân xử được). `6.4` `akantaṁ kantumicchasi` → "muốn yêu mến người không đáng mến".
    + `8.2` `kaṇikārassa dārunā` → "bằng khúc gỗ kaṇikāra". `9.3`–`9.4` `yo te sātaṁ na vindāmi, tirojanapadāgato`: `yo` chỉ Kusa tự nói về mình ("ta"), đọc `tirojanapadāgato` là "người từ xứ khác đến".
    + `12.2`–`12.4` `nemittānaṁ bhavissati … kāmaṁ chindantu sattadhā`: logic của lời Pabhāvatī (dựa trên lời thầy tướng) và tân ngữ của `chindantu` không được nêu; bản Việt để mở ("cứ để họ chặt làm bảy phần, tùy ý"); `kāmaṁ` đọc là "tùy ý", cách đọc khác là "dục".
    + `14.1` `nekkhaṁ` → "dây chuyền vàng" (`nekkha` là món trang sức bằng vàng đeo cổ; "vàng" là suy ý từ nghĩa của từ). `14.3` `nāganāsūrū` → "người có đùi như vòi voi" (0 tiền lệ). `17.4` `pamhāyeyya` → "cười rạng rỡ" (nghĩa không xác lập được; `umhāyeyya` ở `16.4` → "mỉm cười", theo `umhayamānā` ở `11.1`). `18.4`: Pāli không nêu chủ ngữ, bản Việt cũng không thêm.
    + `19`: người nói không rõ, nên bản Việt không chốt đại từ; `19.4` `vetanena anatthike` → "không cần đến tiền công" (cũng có thể là "không vì tiền công"). `20`: câu chuyển từ người nói ở `19` sang Pabhāvatī là suy từ mạch.
    + `21.1` `pāmesi` → "đánh giá" (cũng có thể là "khinh thường"); `21.2` `ārohena` → "bằng tầm vóc"; `21.4` `karassu rucire piyaṁ` → "hãy làm điều vừa lòng chàng" ("chàng" là `naṁ` ở `21.1`). `28.3` `bindussaro` xem phần thuật ngữ. `32.3` `Khattiyotipi` → "cũng là bậc sát-đế-lợi".
    + `34`: người nói không nêu tên; `34.1` `upatthaddhā` → "đã sẵn sàng" (nghĩa gốc "được nâng đỡ"). `35.1` `bile` → "phần" (`bila` = mảnh, phần; không có tiền lệ).
