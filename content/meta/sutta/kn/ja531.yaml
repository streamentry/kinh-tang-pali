notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja531_root-pli-ms.json` (377/377 khoá, đúng thứ tự Pāli, không khoá thừa; bản cũ chỉ có một khoá `2.3` được viết lại cho khớp cách đọc mới). Bài toàn kệ (92 bài kệ cùng bốn dòng tiêu đề và dòng kết bài); phần văn xuôi của Jātaka không nằm trong tầng Pāli đã ghim, nên người nói ở từng bài kệ chủ yếu được suy từ lời xưng hô, nháy kép và mạch của chính các bài kệ. Nội dung chính: Kusa đi tìm Pabhāvatī, làm người nấu bếp trong cung vua Madda; nàng chê ngài xấu xí rồi nhận ra ngài khi bị cha dọa giết; Kusa thắng bảy vua đến vây thành, gả các công chúa Madda cho họ rồi đưa Pabhāvatī về Kusāvatī. Dịch sát chữ, không thêm giải thích vào thân kinh.

  - Tầng tham khảo:
    Tầng English của Sujato không có ja531 (Sujato Jātaka chỉ có 83 tệp, không có uid này; đây là not-published-upstream, không phải not-synced); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Câu chữ không lấy từ bản dịch nào ngoài tầng đã ghim; riêng việc xác định người nói ở một số bài kệ (`2`, `19`–`20`, `37`) có đối chiếu thêm với một bản tóm lược cốt truyện bên ngoài tầng, chỉ để xác định ai nói với ai, không dùng làm câu chữ hay đối chiếu độc lập. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
  - Coverage English:
    Mẫu số = 0. Trong 373 khoá không phải khối `:0`, khoá Pāli dài nhất 39 ký tự, không khoá nào đạt ngưỡng 40 ký tự theo `source/layers.yaml` (bài toàn kệ ngắn), nên cổng coverage không đo được gì; điều đó không có nghĩa là không cần ghi nhận gap, và entry `reference-gaps.yaml` cũng không cứu được `published`. Sujato phủ 0/377 khoá, `english-project` 0/377, `vietnamese-current` 0/377.
