    + `1`: Kusa nói với mẹ (`amma`); `2`: Pabhāvatī nói với Kusa (`kusa` ở `2.3`); `3`–`5`: Kusa nói với Pabhāvatī; `6`, `8`: Pabhāvatī; `7`, `9`–`11`: Kusa; `12`: Pabhāvatī; `13`: Kusa tự gọi tên; `14`–`18`: Kusa nói với cô gù (`khujje`); `19`: lời về Pabhāvatī và Kusa ở ngôi thứ ba, không rõ người nói; `20`: Pabhāvatī nói về cô gù; `21`–`33`: cô gù nói với Pabhāvatī (nháy mở ở `21.1`, đóng ở `33.4`); `34`: lời nhắn trước khi voi phá thành, người nói không nêu tên; `35`: vua Madda; `36`: lời kể (có nháy); `37`–`44`: Pabhāvatī nói (nháy mở ở `37.1`, đóng ở `44.6`; `44` nói với mẹ); `45`: lời kể (có nháy); `46`–`52`: hoàng hậu Madda nói (`46` với vua Madda, `47`–`52` với con gái; nháy mở ở `46.1`, đóng ở `52.4`); `53`: hỏi, `54`: Pabhāvatī đáp, `55`: hoàng hậu; `56`: Pabhāvatī; `57`: lời quở (mẹ hoặc cha nàng, không phân xử được); `58`–`64`: Pabhāvatī; `65`: vua Madda nói với con gái; `66`: vua Madda nói với Kusa; `67`: Kusa; `68`: vua Madda; `69`: lời kể (có nháy); `70`–`72`: Pabhāvatī; `73`–`75`: Kusa; `76`: Kusa; `77`–`84`: nháy mở ở `77.1` và đóng ở `84.4` bao cả đoạn kể `77`–`83`, `83.4`–`84.4` là lời Kusa nói với cha vợ (không có nháy riêng ở `83.4`, theo Pāli); `85`, `87`: vua Madda; `86`: Kusa; `88`–`93`: lời kể. Nháy đơn ‘ ’ không có ở bài này.
