notes: |-
  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `iti5:0.2` mang Pāli `Ekakanipāta` được
  đổi *«Phẩm Một Pháp»* → *«Bộ Một Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:1.ja-ekakanipata` → *"The Book of the Ones"*. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `1.1`, `4.1` (và `2.6`, `2.7` cùng bài) — bản trước chép nguyên Pāli vào bản Việt (`Vuttañhetaṁ bhagavatā vuttamarahatāti me sutaṁ:`, `Etamatthaṁ bhagavā avoca.`, `Tatthetaṁ iti vuccati:`, `Ayampi attho vutto bhagavatā, iti me sutanti.`) → dịch theo công thức đã dùng ở 101–106 khoá trùng (iti70, iti71, iti75…): «Điều này được Đức Thế Tôn, bậc A-la-hán, thuyết; tôi nghe như vầy:», «Đức Thế Tôn đã thuyết ý nghĩa này.», «Về điều này, người ta nói như vầy:», «Ý nghĩa này cũng được Đức Thế Tôn thuyết; tôi nghe như vầy.» Điểm và trạng thái của bài chưa chấm lại trong lượt này.
