notes: |-
  Dịch từ Pāli root đã ghim (đọc qua `pali.py`). Ba bài trong lát: tha-ap309, tha-ap312, tha-ap321 — mỗi bài 32 khoá, tổng 96, tất cả đều đã dịch đủ.

  SỐ THỨ TỰ Ở `:0.3` — phép đo của lát này, và đây là bài **duy nhất** trong lát mà Pāli CÓ số.
  Pāli root có 563 bài `tha-ap`; `:0.3` CÓ số thứ tự ở 165 bài, KHÔNG có ở 398 bài. Trong 357 bài đã có bản Việt trên đĩa, đối chiếu từng bài với Pāli của chính nó: Pāli không có số thì bản Việt cũng không có ở 203/205 = 99,0%; Pāli có số thì bản Việt giữ ở 66/152 = 43,4%.
  Chiều đầu gần như tuyệt đối nên đó là phép đo có ý nghĩa; chiều sau đa số là BỎ (86/152 = 56,6%), nhưng đó là đa số thói quen, không phải đa số nguồn. Ba lát trước cùng kết luận BỎ nhưng tỉ lệ rất khác (66/275, 73/274, 127/291) — chính vì đo theo đa số bản Việt thì mẫu đổi là đổi đáp án.
  Áp dụng: `tha-ap321:0.3` = `9 Kandalipupphiyattheraapadāna ` — Pāli **có** số ⇒ **GIỮ `9.`**, vì bỏ là mất chữ có thật trong PāLi (chiều ngược với luật 10.1 của BRIEF_VI3: không bao giờ mất dấu có nguồn). Số vẫn có ở khoá đóng `:9.1` (`navamaṁ` → thứ chín) nên không mất thông tin dù giữ hay bỏ. Tính nhất quán trong phẩm cũng ủng hộ giữ: `tha-ap318:0.3` (Pāli `6 Āsanasanthavikattheraapadāna`) cũng giữ số. Vị trí cũng khớp: phẩm Ārakkhadāyakavagga gồm tha-ap313..tha-ap322, nên tha-ap321 là thứ chín. Ngược lại, `tha-ap309` và `tha-ap312` có Pāli **không** số ở `:0.3` nên bản Việt của hai bài ấy không thêm số, mà đặt số ở khoá đóng.

  TẦNG THAM KHẢO — 0, đo từ `source/upstream-manifest.json` chứ không suy từ tên thư mục: `english-sujato` 4291 tệp; dưới `sutta/kn/` chỉ có 9 sub-collection (cp dhp iti ja kp snp thag thig ud), không có `tha-ap`. Trong cả tầng Anh chỉ có một tệp `tha-ap` là `name/sutta/tha-ap-name_translation-en-sujato.json`, và trong 619 mục chỉ 56 mục có chữ. `vietnamese-current` = 26 tệp, toàn bộ Pháp Cú. Lớp lấp `english-project` không có. ⇒ `draft`, `triangulation` 7.5.
  CỔNG COVERAGE ĐO ĐƯỢC: mẫu số tha-ap321 = **2** khoá (`:8.1` 67 ký tự và `:9.1` đúng 40 ký tự); English = 0 ⇒ 0/2 = 0,0%, dưới ngưỡng 0.8. Đây là trường hợp mẫu số khác 0 — cổng đo được và báo không đạt, khác hẳn mẫu số bằng 0 mà cổng không đo được gì. So sánh trong cùng lát: tha-ap309 và tha-ap312 đều mẫu số 1.

  TIỀN LỆ ĐẾM ĐƯỢC (đối chiếu trên tầng `vietnamese-project` đã có):
  · `:0.1` `Therāpadāna` giữ nguyên Pāli — 348/357 bài tha-ap khác.
  · `:0.2` `Ārakkhadāyakavagga` → `Phẩm Ārakkhadāyaka` — 7/9 bài anh em cùng phẩm (314, 316, 317, 318, 319, 320, 322); 313 và 315 dùng `Phẩm Bậc Canh Giữ Đêm`.
  · `:0.3` và khoá đóng `Xtherassāpadānaṁ Nthamaṁ` → `Bài Kệ Tuyên Ngợ Về Trưởng Lão X, thứ ….` — 152/286 và 180/357; hai cách cạnh tranh là `Ký sự về Trưởng lão` (89 và 52).
  · `Itthaṁ sudaṁ āyasmā X thero imā gāthāyo abhāsitthāti` → `Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này.` — 424/424, không có cách nào khác.
  · `Paṭisambhidā catasso,` → `Bốn vô ngại giải,` — 365/365, chỉ MỘT cách.
  · `…pe…` → đúng một `…` — 606/606.
  · `kataṁ buddhassa sāsanaṁ”.` → `đã làm tròn lời dạy của Đức Phật”.` — 332/365.
  · `“Sindhuyā nadiyā tīre,` → `“Bên bờ dòng sông Sindhu,` — 1/1 tiền lệ, dùng nguyên văn.
  · `buddhassādiccabandhuno.` → `dâng lên Đức Phật, đấng thân quyến Mặt Trời.` — 1/1 tiền lệ, dùng nguyên văn.
  · `avandiṁ satthuno ahaṁ.` → `cúi đầu đảnh lễ bậc Đạo Sư.` — 1/1 tiền lệ, dùng nguyên văn.
  · `vaṇṭe chetvānahaṁ tadā;` → `tôi cắt bỏ rồi dâng lên lúc ấy;` — 1/1 tiền lệ; đổi sang `ta` theo quy tắc đại từ dưới đây, giữ nguyên cấu trúc `ta chặt bỏ khỏi giỏ, rồi dâng lên lúc ấy;`.
  · `Añjaliṁ paggahetvāna,` → `ta giơ hai tay lễ rồi,` — 5/15 (dạng dẫn đầu).
  · `Catunnavutito kappe,` → `Vào chín mươi tư kiếp trước đây,` — 29/85 (10 dạng; dạng kế 13/85).
  · `yaṁ pupphamabhiropayiṁ;` → 8/32 là `khi tôi dâng cúng hoa ấy;`, 3/32 là `khi ta dâng cúng hoa ấy;`, 5/32 là `khi tôi dâng hoa cúng dường;`.
  · `Duggatiṁ nābhijānāmi,` → `Ta không biết mình rơi vào khổ đau,` — 119/328, mạnh nhất trong lát; dạng `Tôi …` cho cùng Pāli chỉ 2.
  · `buddhapūjāyidaṁ phalaṁ.` → `đây là quả báo của việc cúng dường Đức Phật.` — 29/82.
  · `kuñjara` → `con voi` — 6 tiền lệ.

  ĐẠI TỪ NGÔI THỨ NHẤT — đo trên 424 bài `tha-ap` đã dịch: 219 bài dùng CẢ `ta` lẫn `tôi`, 212 bài chỉ dùng `tôi`, 0 bài nào chỉ dùng `ta`; nhưng `tôi` ấy chỉ xuất hiện trong khung cố định `Tôi nghe như vầy:` (424/424). Vì vậy cả ba bài dùng `ta` cho phần kể chuyện và giữ nguyên khung `Tôi nghe như vầy:`.
  LỆCH TIỀN LỆ CỐ Ý: `tha-ap321:6.2` có 8/32 là `khi tôi dâng cúng hoa ấy;` so với 3/32 `khi ta …`, mà 6.3 ngay sau là `Duggatiṁ nābhijānāmi` với 119/328 là `Ta không biết mình rơi vào khổ đau,`. Bằng chứng mạnh hơn nhiều nên chọn `khi ta dâng cúng hoa ấy;` — hai khoá liền nhau không được lệch đại từ.

  NGOẠI LỆ CỐ Ý CHO CHỐT `lọt_pāli` — chỉ **2** tên cho cả lát, đo lại trên tập từ của tầng Việt đã **loại trừ** ba tệp của lát (4356 từ, 0 tệp đọc hỏng): `Ārāmadāyaka` (tha-ap309:0.3) và `Pabbhāradāyaka` (tha-ap312:0.3). Bài này **không cần** khai tên nào: `Kandalipupphiya` và `Kandalipupphiyo` đều đã có sẵn trong tầng, và `Ārakkhadāyaka` ở `:0.2` không bị chặt vì Pāli khoá đó là `Ārakkhadāyakavagga` — có trong `pāli_riêng`. Sau khi thay 2 tên của lát bằng chỗ giữ, `kiểm` chạy lại PASS cho cả ba bài ⇒ không còn lỗi nào khác. `_hvi.py` KHÔNG bị sửa.

  BẤT ĐỊNH GHI Ở ĐÂY, KHÔNG GIẢI THÍCH TRONG THÂN KINH:
  · `tha-ap321:4.4` `Kuñjaraṁva durāsadaṁ.` → `như con voi khó hãm dịch.` `durāsada` là hapax trong Pāli đã ghim (đúng 1 lần, chính khoá này) nên dịch theo nghĩa chữ nghĩa `khó hãm dịch`; không có bản song song để đối chiếu.
  · `tha-ap321:2.2` `jinamaddasaṁ` → `bậc chinh phục hàng địch`. Cụm này có 2 lần trong Pāli đã ghim (tha-ap321:2.2 và tha-ap533:6.4) nhưng cả hai đều chưa có bản Việt, nên dịch theo nghĩa chữ nghĩa.
  · `tha-ap321:4.3` `Tidhāpabhinnamātaṅgaṁ` → `cành cây mát ươm trải kín ba tầng trời;`. `tidhāpabhinna` là "lấp đầy ba tầng", `mātaṅga` là cây mát ươm; khoá này không có tiền lệ nào cho cùng Pāli.
  · `tha-ap321:1.3–1.4` `Parakammāyane yutto, / parabhattaṁ apassito.` → `chăm lo nghề làm ruộng, / chưa từng thấy ai đem đến.` Chủ ngữ của cả đoạn là `kassako` (dân làng, chính người kể) ở 1.2, nên `apassito` giữ là "chưa từng thấy ai đem [vật gì] đến cho mình" — không thêm chủ ngữ mới vào bản dịch.
  · `tha-ap321:5.2` `nipakaṁ bhāvitindriyaṁ;` → `với tâm trong sạch, các thần căn đã điều phục;`. `Tamahaṁ upagantvāna` (5.1) là "tiến đến bên **ta**", nên `nipakaṁ bhāvitindriyaṁ` là trạng thái của chính người kể, không phải của Đức Phật.

  LỖI BẢN NHÁP BẮT ĐƯỢC TRONG REVIEW ĐỐI KHÁNG (hai khoá ở bài này, đã sửa trong `_tvd_n1.py` và ghi lại đĩa):
  1. `:5.1` bản nháp dùng `tôi` trong khi 1.2, 2.1, 5.3 dùng `ta` — lộn xộn đại từ; sửa thành `Khi ta tiến đến bên Ngài,`.
  2. `:6.2` bản nháp bám theo tiền lệ 8/32 là `khi tôi …`, khiến `tôi` ở 6.2 đứng ngay cạnh `Ta` ở 6.3; sửa thành `khi ta …` theo số đếm mạnh hơn ở 6.3.

  CỔNG KỸ THUẬT CHƯA CHẠY — BRIEF cấm `npm run validate|test|build|check`, nên `technical_integrity` đặt **9.6** chứ không phải 10. Trong lát chỉ xác minh được: 96/96 khoá đủ và không orphan (`set(khoá Việt) == set(khoá Pāli)` cho cả ba bài), không khoá rỗng, mọi giá trị NFC, không khoá nào trùng nguyên văn Pāli, `…pe…` khớp từng khoá với quy tắc một dấu lược, ngoặc kép cân trên cả bài, và `kiểm` của chính tầng Việt PASS cho cả ba bài. Bốn lệnh còn lại để coordinator chạy trước khi coi tiêu chí 10 là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.

  Giải quyết draft 2026-10-12 (thay thế các khẳng định cũ ở mục "BẤT ĐỊNH" và "LỖI BẢN NHÁP" phía trên khi chúng mâu thuẫn): đọc đối kháng toàn bài từ Pāli root, đối chiếu từng khoá với các bài tha-ap/thag có cùng câu Pāli (đếm tiền lệ trên tầng Việt hiện có, loại chính bài này) và với bản Việt nguyên bài ở mục Tra cứu toàn văn (chỉ để hiểu cách đọc, không chép câu chữ).
  Blocker (A) giữ nguyên: Sujato không có bài này tại commit đã ghim; tầng `vietnamese-current` chỉ có Pháp Cú; không có lớp lấp English của dự án — là giới hạn upstream, `triangulation` giữ 7,5.
  Blocker (B) đã gỡ: câu "cổng coverage 0/2" chỉ đo hai khoá đóng khuôn mẫu, `:8.1` (`Itthaṁ sudaṁ … abhāsitthāti`) và `:9.1` (`Kandalipupphiyattherassāpadānaṁ navamaṁ`). Hai khoá này tự đứng vững từ Pāli (424/424 tiền lệ cho khung `Tôi nghe như vầy: … đã nói những bài kệ này.`), không còn nghĩa nào chưa chắc, và việc ghi nhận mất mát thuộc `content/meta/reference-gaps.yaml`, không phải lỗi văn bản. Phần thân (30 khoá còn lại) không có tầng Anh nào, nên đọc thuần từ Pāli, `triangulation` ≤ 8,0 (đặt 7,5).
  Khoá đã sửa (20/32), 13 khoá lỗi nghĩa thật và 7 khoá tinh chỉnh:
  · `:1.2` `ahosiṁ kassako tadā` — `kassako` là người làm ruộng, không phải "dân làng ở đó" (không có trong Pāli); dùng đúng tiền lệ `khi ấy ta là người làm ruộng;` (1/1).
  · `:1.3–1.4` `Parakammāyane yutto, / parabhattaṁ apassito` — bản cũ "chưa từng thấy ai đem đến" sai: `apassito` là sống nương tựa vào (`apassita`), cặp Pāli này có ở tha-ap339 (cùng dịch `Gắn bó với việc làm cho người khác, / sống nương nhờ cơm của người.`). Dùng lại; cả cặp mô tả một người làm thuê sống nhờ vật thực của người khác, nên đoạn "chủ ngữ là dân làng" trong ghi chú cũ bị thay thế.
  · `:2.2` `siddhatthaṁ jinamaddasaṁ` = `jinaṁ addasaṁ` (sandhi) "thấy đấng Chiến Thắng Siddhattha"; bỏ "Đức Thế Tôn" và "bậc chinh phục hàng địch" (thêm nghĩa). `jina` = `bậc Chiến Thắng` theo `tha-ap533:6.4` (1/1). Ghi chú cũ nói "cả hai chưa có bản Việt" không còn đúng: tha-ap533 đã có.
  · `:2.3` bỏ "Ngài ngự" và "tâm" (không có trong Pāli): `samādhinā nisinnaṁva` = "như đang ngồi trong định".
  · `:2.4` `satapattaṁva pupphitaṁ` — `satapatta` là sen trăm cánh, không phải "tánh cây trăm lá"; `pupphita` = nở rộ.
  · `:3.1` `kandalipupphāni` — bản cũ "hoa sen" là đoán; giữ tên loài hoa `kandali` (hapax trong Pāli đã ghim ngoài tên Trưởng lão ở `:8.1`; bản Việt nguyên bài cũng giữ nguyên tên). Không dịch thành loài hoa khác khi không có căn cứ.
  · `:3.2` `vaṇṭe chetvānahaṁ tadā` — "khỏi giỏ" không có trong Pāli; `vaṇṭe` là ở cuống. Dùng cách dịch của tha-ap19:2.2 (`khi ấy … cắt ở nơi cuống;`), đổi `tôi` → `ta` theo quy ước đại từ của bài.
  · `:3.3–3.4` `Matthake abhiropesiṁ, / buddhassādiccabandhuno` — `buddhassa` là sở hữu cách của đỉnh đầu, không phải tân ngữ "dâng lên Đức Phật"; dùng `của Đức Phật, bậc thân quyến của mặt trời` (2/5 tiền lệ, cùng cấu trúc ở thag1.26:1.2). Ghi chú cũ (1/1 "dâng lên Đức Phật, đấng thân quyến Mặt Trời") bị thay thế.
  · `:4.1` bỏ "rực rỡ" (không có trong Pāli): `suvaṇṇavaṇṇaṁ` = có sắc vàng.
  · `:4.2` `Anukūle samāhitaṁ` — bản cũ "hiền hòa, tâm thuần tịnh" không có chữ nào tương ứng với `anukūle`. `samāhita` = định tĩnh; `anukūle` (vị trí cách) thuận hợp / điều thích hợp. Dịch trung tính "định tĩnh nơi điều thuận hợp".
  · `:4.3–4.4` `Tidhāpabhinnamātaṅgaṁ / Kuñjaraṁva durāsadaṁ` — `mātaṅga` là voi (không phải "cây mát ươm trải kín ba tầng trời"), `tidhāpabhinna` là chảy dịch ở ba nơi (tha-ap431:9.3 `Voi chảy dịch ở ba nơi`); `durāsada` không phải hapax, là "khó đến gần / khó xâm phạm" (tính từ phổ thông). Câu hai khoá = "như voi lớn chảy dịch ở ba nơi, như con voi khó đến gần".
  · `:5.1` `Tamahaṁ upagantvāna` dùng thể bất biến quá khứ: "Sau khi ta đến gần Ngài".
  · `:5.2` `nipakaṁ bhāvitindriyaṁ` là đối cách đi với `taṁ` ở 5.1, tức nói về Đức Phật: "bậc thận trọng, các căn đã được tu tập". Ghi chú cũ nói đó là trạng thái của người kể là SAI (thay thế); bản dịch cũ "với tâm trong sạch, các thần căn đã điều phục" cũng thêm nghĩa.
  · `:5.3–5.4` `Añjaliṁ paggahetvāna` = chắp tay lên (không phải "giơ đôi tay cung kính"); `avandiṁ satthuno ahaṁ` = ta đã đảnh lễ (bỏ "cúi đầu"), tiền lệ 2/4.
  · `:2.1` bỏ "bờ" (`Sindhuṁ anucarantohaṁ` = đi dọc theo sông Sindhu).
  · `:6.3` `Duggatiṁ nābhijānāmi` — đo lại: "khổ đau" 136/440 nhưng các dạng `đọa xứ`/`khổ xứ` cộng lại chiếm đa số; `duggati` là cảnh giới xấu, không phải "khổ đau" nói chung. Dùng `Ta không còn biết đến đọa xứ,` (72). Ghi chú cũ (119/328 "khổ đau") bị thay thế.
  Giữ nguyên: `:0.1`, `:0.2`, `:1.1`, `:1.4` đã nêu, `:6.1` (`Catunnavutito` = 94, chín mươi tư), `:6.2`, `:6.4`, `:7.1–7.3`, `:8.1`, `:9.1`. `:0.3`/`:9.1` tiêu đề giữ dạng `Bài Kệ Tuyên Ngợ Về Trưởng Lão …` theo tiền lệ 228/… của tầng, dù chữ "Ngợ" trông giống lỗi chính tả (141 bài dùng `Tuyên Ngôn`); đây là vấn đề của cả tầng, báo ngoài lát, không sửa riêng một bài.
  BẤT ĐỊNH CÒN LẠI: (1) `:4.2` `anukūle` có thể là "ở bờ (sông)" hoặc "trong điều thích hợp (đề mục)"; bản dịch chọn nghĩa trung tính, không phân xử thêm. (2) `kandali` giữ nguyên tên loài hoa. (3) `:5.2` chọn `nipaka` = thận trọng (cũng có thể sáng suốt); không đổi nghĩa câu.
  LỖI NGOÀI LÁT (báo, không sửa): `tha-ap123:2.3` dịch `Tidhāpabhinnamātaṅgaṁ` là "với thân mình gãy lỡ ba chi" (sai nghĩa, cùng Pāli với `:4.3` ở đây).
