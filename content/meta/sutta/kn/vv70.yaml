notes: |-
  Bản dịch chỉ từ Pāli root do commit đã ghim không có bản Anh upstream (giới hạn upstream).
  Đầy đủ 10 tiêu chí scorecard; status bắt buộc draft do blocker tầng tham khảo Anh; technical_integrity 9.6.

  Kiểm toán độc lập 2026-10-11 (thay thế nhận định chấm ngày 2026-10-03; các mục cũ ở trên giữ làm lịch sử): đọc đối kháng 23 khoá, 14 khoá được sửa, trong đó 5 khoá sai nghĩa thật và 9 khoá thêm chữ/lệch tiền lệ.
  Lỗi nghĩa thật: 2:1 `mahānubhāvo` dịch "đại uy danh" (anubhāva là oai lực, không phải danh tiếng) nay "đại oai lực"; 3:3 `yassa kammassidaṁ phalaṁ` là mệnh đề quan hệ của câu "giải đáp" (về nghiệp mà đây là quả báo), trước đây đảo thành "quả báo của nghiệp này là như thế", nay theo cách đã chốt ở vv3/vv10/vv13; 4:3 `ekāhaṁ` là "trong một ngày" (trước đây dịch "một phần ... của mình", cả "phần" lẫn "của mình" đều không có trong Pāli); 4:4 `samaṅgi bhattena ... akāsiṁ` là "làm cho (vị ấy) được đầy đủ cơm ăn", trước đây "dâng bữa ăn chu đáo trọn vẹn" gắn `samaṅgi` vào hành vi dâng; 1:2 `samantato` là "khắp bốn phía", trước đây "chu vi rộng khắp" thêm khái niệm chu vi.
  Thêm chữ/lệch: bỏ "vô cùng" (3:1), "nhân duyên" (5:1, nay "nhờ vậy"), "rực rỡ" thừa ở 5:3, "tráng lệ" thừa ở 1:3; "bốn phương" → "khắp mọi phương" (`sabbadisā`, 2:4 và 5:3); "con" → "tôi" cho người nói là thiên tử đáp Tôn giả (4:1, 4:3, 4:4, 5:1, 5:3) theo tiền lệ đa số vv; "phước đức" → "phước báu" (2:2); "dường ấy" → "như thế" (2:3).
  Điểm: semantic_fidelity 9.3→8.8, grammar_logic 9.3→8.8, terminology 9.2→8.8, vietnamese_clarity 9.3→9.0, han_viet_balance 9.4→9.2, ambiguity_integrity 9.2→8.8; các tiêu chí còn lại giữ nguyên; final_score 9.23→9.0.
  Bất định còn lại: (a) 1:4 `rucakatthatā` chỉ có đúng ở 11 bài vv trong toàn bộ Pāli root, không có tầng tham khảo hay mục glossary; cách dịch phổ biến "trải thảm rực rỡ" là phỏng đoán nên khoá này giữ nguyên chữ `rucaka` thay vì khẳng định nghĩa, và chưa gắn rõ chủ ngữ (cột hay lầu gác); (b) 4:4 `samaṅgi` là dạng mất niggahīta của `samaṅgiṁ` (đối cách, chỉ vị tỳ-kheo) hay không là cách đọc theo ngữ pháp, chưa có nguồn đối chứng; (c) 4:2 `tasitaṁ` đọc là "khát" (không phải "sợ hãi"), "khát nước" theo vv7; (d) tiêu đề `Purisavimāna` (0:2) được dịch "Thiên Cung Của Nam Giới", không có `ākāsa` trong Pāli, khác ~51 tệp vv dùng "Nam/Nữ Hư Không" (sai) — không sửa riêng một tệp để khỏi lệch cả bộ; cách gọi `vimāna` ở đây là "thiên cung" cùng vv66/vv68/vv71, còn đa số vv dùng "cung điện".
  Blocker "không có tầng tham khảo tiếng Anh" giữ nguyên (giới hạn upstream); triangulation giữ 7.5.

  Lượt cải thiện 2026-10-11: đọc đối kháng lại 23 khoá sau kiểm toán trước, đo tiền lệ trong 11 khoá Pāli trùng của họ vv và toàn tầng KN; đổi 3 khoá, không khoá nào đổi nghĩa (không có accuracy fix).
  Terminology fix: 1:3 `kūṭāgārā` "ngôi nhà gác" → "lầu gác" (lệch tiền lệ: 10/11 khoá Pāli trùng dùng "lầu gác/lầu các", toàn tầng KN "lầu gác" 28 khoá so với "ngôi nhà" 17 khoá không kèm "gác"; vẫn bỏ "tráng lệ" vì Pāli không có); 4:3 `bhikkhaṁ` "thức ăn khất thực" → "dâng cúng vật thực", vì cùng một văn bản đang dùng hai cách cho một từ Pāli (nhan đề 0:4 và 6:1 là "vật thực", cùng cách vv27/vv28 và 2 khoá `Tassa adāsahaṁ bhikkhaṁ`).
  Style fix: 6:1 viết hoa kiểu nhan đề "Thiên Cung Người Dâng Cúng Vật Thực, thứ sáu." cho khớp 0:4 và đa số khoá kết bài vv (22/27 viết hoa kiểu nhan đề).
  Điểm: terminology 8.8 → 8.9 (chỉ vì hai chỗ nhất quán trên; `rucaka`, `thiên cung` so với "lâu đài" ở 1:1 và `ngọc báu` so với `ngọc châu` vẫn là lựa chọn thiểu số hoặc chưa phân xử nên không nâng thêm); final_score 9.0 → 9.01; mọi tiêu chí khác giữ nguyên, kể cả triangulation 7.5 (không có bản Anh độc lập).
  Không giải quyết được thêm bất định nào: `rucaka` là hapax chỉ có ở 11 bài vv, không có tầng tham khảo hay glossary, vv35 và vv79 cũng ghi chưa phân xử được; 4:4 `samaṅgi` giữ như trên. Technical gate: `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này nên technical_integrity vẫn 9.6.

  Sửa lỗi nghĩa 2026-10-16: vv70:1.4 `rucakatthatā` — "được trải rucaka" → "được trải vàng" (bỏ chữ Pāli `rucaka` khỏi lời Việt) (`rucaka` là vàng/cát vàng, `atthata` là được trải, không có chữ nào cho "thảm"; căn cứ https://www.wisdomlib.org/definition/rucaka (PED: rucaka = vàng/cát vàng, "suvaṇṇa-vālikā"); Vv-a ad Vv 35 (https://www.tipitaka.org/romn/cscd/s0506a.att1.xml): "rucakupatiṇṇanti suvaṇṇavālikāhi okiṇṇaṅgaṇaṃ"; Indacanda "được trải lót bằng vàng" (https://www.tamtangpaliviet.net/VHoc/30a/Vv_03.htm)).
