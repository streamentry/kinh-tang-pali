notes: |-
  Dịch từ Pāli root, đối chiếu bản dịch tiếng Anh của Bhikkhu Sujato tại commit bilara đã ghim. Tại commit đã ghim không có bản Việt hiện hành cho Khuddaka Nikāya, nên không có tầng Việt truyền thống để so.

  Coverage Anh, đo lại bằng đúng công thức của `src/lib/canon/reference.ts`: **substantive = 0** → `ratio = 1`, bài qua cổng coverage một cách rỗng vì cả 49 khoá Pāli đều ngắn hơn 40 ký tự. Đo thủ công trên tệp Anh đã ghim: **44/45 khoá thân bài có chữ Anh**, chỉ `:12.1` (câu kết) bị Sujato bỏ trống.

  Tên phẩm, có số đếm. `0.1` `Cariyāpiṭaka` → *Hạnh Tạng*, theo đa số đo lại được là **20 tệp cp so với 1 tệp** (`cp34`) giữ Pāli (`cp1` và `cp35` có `:0.1` rỗng nên không tính), và 20/1 là số đo trên 23 tệp có sẵn **trước khi lát này ghi** (sau khi cp14 cp15 cp19 của lát đã ghi thì toàn tầng là 23/1 trong 26 tệp); số này khác 17/1 từng được báo, xem `cp14.yaml`. `0.2` → *Phẩm Hatthināga* (4/4). `0.3` `Sīlapāramī 9` → *Trì Giới Ba-la-mật Thứ Chín*. `0.4` `Alīnasattucariya` → *Hạnh Của Alīnasattu*, tên Bồ-tát giữ Pāli theo khuôn "Hạnh Của X" (cp2 *Hạnh Của Saṅkha*, cp32 *Hạnh Của Sutasoma*, cp14 *Hạnh Của Cūḷabodhi*).

  DÙNG LẠI NGUYÊN VĂN BÀN DỊCH ĐÃ CÓ (đo bằng `_c80_dup.py` trên 5.271 bài Việt): `:0.1 :0.2` (cp13), `:4.1` (cp11:4.1), `:5.3` (cp32:5.3), `:7.1` (cp21:2.3), `:7.4` (cp32:5.4), `:9.4` (cp23:3.4), `:11.2` (cp17:6.2).

  Thuật ngữ, có số đếm. `porisāda` → *kẻ ăn thịt người* (cp32:1.3 và cp32:5.4, dùng nguyên văn ở `:7.4`). `migava` → *săn hươu* (tha-ap513). `parijana` → *bầy tùy tùng* (89 lần); Sujato dịch "attendants", bản đầu tôi viết "bề tôi" là sai ngữ nghĩa và đã sửa trong lượt review đối kháng. `khagga` → *gươm* (xem "Khi ngươi mang gươm đeo kiếm"). `dhanu` → *cung*. `pāṇātipātika` → *kẻ sát sinh vật* (an5 dịch "kẻ sát sinh"). `sīla` → *giới hạnh* (538 lần). `brāhmaṇa` → *Bà-la-môn* (2905). Tên riêng `Pañcāla`, `Kapilā`, `Jayaddisa`, `Alīnasattu` giữ Pāli vì đây là danh xưng và địa danh chưa có bản Việt nào trong kho; Sujato cũng giữ `Jayaddisa`.

  BẤT ĐỊNH ĐÃ GHI. (a) `:11.3`–`:11.4` `Pabbājesiṁ cahaṁ tassa, sadā pāṇātipātikan` dịch *Ta đã xua đuổi lâu dài cuộc săn của kẻ sát sinh vật* — `pabbājesi` là "xua đuổi / chặn đường", `cahaṁ` là "lâu dài", và tân ngữ `tassa` chiếu vào `pāṇātipātikaṃ` (người ăn thịt người); Sujato dịch "I drove out forever his attacks on living creatures" nên câu văn Việt giữ cả hai vế. (b) `:10.4` `pitāmaha` dịch *ông nội* — đây là xưng hô khiêm tốn của người khiêm nhường, không phải quan hệ huyết thống thật; chọn dịch nghĩa đích danh (có 3 chỗ trong kho) thay vì giữ chữ. (c) `:9.2` `tassa dessaṁ na byāhariṁ` dịch *ta không nói lời khinh miệt nào với hắn* — `dessa` là "chê ghét / khinh miệt", `byāhāri` là "nói với". (d) `:8.2` `kadāci so tasissati` dịch *có khi nào hắn sợ hãi chăng* — câu hỏi tu từ, giữ chi tiêu "có khi nào" và dấu chấm hỏi.

  Cặp nháy kép: Pāli mở `“` ở `:1.1`, đóng `”` ở `:11.4`; các nháy đơn `‘…’` ở `:3.4 :5.1 :5.2 :6.1 :6.4 :10.1 :10.4` tự cân theo Pāli. Cơ chốt `_hvi.py` chạy sạch với 49 khoá.