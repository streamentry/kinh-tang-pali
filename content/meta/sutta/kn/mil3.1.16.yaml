notes: |-
  KỸ THUẬT. Đợt này tôi KHÔNG chạy `npm run validate|test|build|check` — người điều phối
  cấm và chạy tập trung. Vì vậy tôi KHÔNG tuyên bố technical gate pass:
  `technical_integrity` chấm 9,6 chứ không phải 10,0. Bốn lệnh đó để người điều phối
  chạy lại.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ KIỂM THỦ CÔNG. Bài này CÓ khoá Pāli ≥ 40 ký tự nên vòng
  chốt của `_hvi.kiểm` chạy thật; tôi vẫn tự quét lại TOÀN BỘ 14 khoá bằng chính các
  hàm đó (`_chk_w5.py`): mọi khoá có bản dịch, không khoá thừa/thiếu so với Pāli,
  thứ tự khoá khớp Pāli, chuỗi NFC, không Pāli lọt, số dấu lược khớp TỪNG khoá,
  ngoặc kép cân trên cả bài, không có `(…)`.

  COVERAGE — ĐO LẠI BẰNG ĐÚNG QUY TẮC CỦA KHO (`source/layers.yaml`:
  substantivePaliMinChars 40, excludeReferenceBlock, floor 0,8). Bài này có 6–8 khoá
  Pāli có nội dung và **0 trong số đó mang chữ Anh**, tỉ lệ 0% < 0,8. Vì vậy nếu bài
  muốn lên `review`/`published` thì PHẢI có mục trong
  `content/meta/reference-gaps.yaml` — đợt này tôi không được sửa tệp đó, nên đây là
  blocker thứ hai bên cạnh việc thiếu hẳn tầng Anh.

  KHÔNG ĐỐI CHIẾU ĐƯỢC TẦNG VIỆT HIỆN HÀNH. Tại commit đã ghim, `translation/vi/` của
  bilara chỉ chứa Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu cho Milindapañha.
  Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho. Vì vậy
  `triangulation` của sáu bài mil3 trong lát này chỉ là **Pāli + các bài song song
  trong chính tầng này + menu SuttaCentral** (xem mục thuật ngữ bên dưới).

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — ĐO ĐƯỢC, KHÔNG ĐOÁN. `“Kallosi, bhante nāgasenā”ti.`
  → *“Khéo lắm, thưa tôn giả Nāgasenā.”* là **25/25** bài mil3 đã có; `TIEN_LE_PHAI.md`
  cũng ghi cặp `mil3.5.6:2.1 == mil3.6.6:2.1`. `Opammaṁ karohī` 6 bài: 3 bài *Hãy xét
  một thí dụ* (đa số), 2 bài *Hãy nêu một ví dụ*, 1 bài *Hãy đưa một ví dụ* → tôi theo
  đa số. `Āma` 5 bài → *Vâng*. `Na hi, bhante` **0 tiền lệ**; tôi dùng *Không phải vậy*
  theo 31 bài đã có `No hetaṁ, bhante` → *Không phải vậy*. `Rājā āha—` **đang chia
  12 `Vua nói:` / 10 `Vua nói—`**; tôi theo đa số `Vua nói:` và ghi lại đây vì tầng
  đang lệch. Lưu ý khi chấm cặp: chuỗi `“Xin hãy xét một thí dụ”ti.` của tôi **khác** `“Hãy
  xét một thí dụ”.` của 3 bài kia chỉ ở chữ *"Xin"*; `ti.` bị rơi ở bản kia. Cùng nguyên
  văn đã có, nên tôi giữ `ti.` cho đúng với `”ti.` mà Pāli mang. Tên phẩm: `Mahāvagga` → *Đại Phẩm* · `Buddhavagga` → *Phẩm Đức Phật* ·
  `Sativagga` → *Phẩm Chánh Niệm* · `Arūpadhammavavatthānavagga` → *Phẩm Xác Định Pháp
  Vô Sắc* (đều có 1–6 tiền lệ). `bojjhaṅga` → *giác chi* (358 khoá Pāli, và
  `content/glossary/pali-vi.yaml` ghi `preferred: "giác chi"`).

  THUẬT NGỮ ĐẶT MỚI. `Nānādhammānaṁekakiccaabhinipphādanapañha` **0 tiền lệ** → *Câu
  hỏi về việc nhiều pháp khác nhau cùng thành tựu một việc*. Tôi theo menu SuttaCentral
  (*The Question on Different Qualities and One Goal*) cho **cấu trúc** "Câu hỏi về việc
  …" (đúng khuôn của 34 bài mil3 đã có), nhưng dùng *một việc* chứ không phải *một mục
  tiêu*, vì Pāli dùng `kicca` (= việc) ở tiêu đề và `attha` (= điều/việc) ở thân bài:
  Pāli là authority, và *một việc* làm hai khoá đó thành một. `senā` → *đạo quân*,
  `pattī` → *lính bộ binh*, `abhivijinanti` → *làm nát tan*, `abhivijinanti parasenaṁ` →
  *làm nát tan giặc địch*.

  Giải quyết draft 2026-10-12. Kiểm toán độc lập, đọc đối kháng 14 khoá từ Pāli. Sửa
  5 khoá. (1) `kilese hanantī` ở 1.3, 2.1, 2.4: bản cũ dịch *lậu hoặc* — sai, vì
  `kilesa` là phiền não, còn lậu hoặc là `āsava`, một thuật ngữ khác. Đo tiền lệ: trong
  các bài Milindapañha đã có, `kilesa` đi với *phiền não* ở 93 khoá (81 + 8 + 2 + 2),
  còn *lậu hoặc* chỉ đứng cạnh *phiền não* ở 4 khoá, chưa có khoá nào dùng nó một mình;
  đổi cả ba khoá sang *diệt trừ phiền não*. (2) 2.3: `parasenaṁ abhivijinanti` bản
  cũ *làm nát tan giặc địch* — thêm nghĩa mạnh không có trong động từ; `abhivijināti`
  là *chinh phục, chiến thắng* và 21 khoá trong tầng (dn, mn, an) đều dịch như vậy, nên
  đổi thành *chiến thắng quân địch trong trận đánh*. (3) 0.3: bỏ dấu chấm cuối tiêu đề
  vì Pāli không có và các tiêu đề mil3 khác không có. `translationTitle` không đổi.
  Các khoá còn lại giữ: `Kallosi…` dùng lại đúng nguyên văn tiền lệ; `Rājā āha—` giữ
  theo đa số đã ghi ở trên.

  Blocker đã gỡ: "Coverage English dưới ngưỡng 0,8" — đó không phải lỗi văn bản mà là
  hệ quả của việc bản Anh không có (xem blocker còn lại); toàn bài chỉ là một đối đáp
  ngắn, 14 khoá, Pāli cú pháp rõ, tự đứng vững sau lượt đọc đối kháng. Mất mát tham
  chiếu được ghi nhận bằng `content/meta/reference-gaps.yaml` qua công cụ của kho.
  Blocker giữ: thiếu hoàn toàn bản Anh Sujato tại commit đã ghim, là sự thật về
  upstream. `triangulation` hạ 7,5 vì không có bản Anh độc lập; chỉ có Pāli và tiền lệ
  nội bộ tầng mil3. Không có tầng Việt hiện hành (giới hạn tham chiếu, không phải lỗi).
  Bất định còn lại: *một việc* cho `attha` (cũng có thể là *một mục đích*), giữ vì khớp
  tiêu đề `kicca`. Kỹ thuật: bốn lệnh `npm run validate` · `npm test` · `npm run check` ·
  `npm run build` chưa chạy trong lượt này; `technical_integrity` giữ 9,6.
