notes: |-
  **Sửa lan 2026-10-13** (theo lỗi đã sửa ở tha-ap2:41.2, 47.1, 47.2; Pāli ba khoá này trùng nguyên văn với tha-ap2, chỉ khác dấu nháy). (1) `snp1.3:32.2` — *Đã xua tan mọi ô nhiễm,* → *Đã xua tan mọi cấu uế,* (`upakkilese`; toàn tầng có 46 khoá `upakkilese`, trong đó 34 khoá *cấu uế* và 5 khoá *ô nhiễm*; tha-ap2:41.2 đã đổi sang *cấu uế*). (2) `snp1.3:38.1` — *chế ngự,* → *dùng sức mạnh áp đảo,* (`pasayha`) và `snp1.3:38.2` — *Như vua của các loài thú, bậc chiến thắng tự tại;* → *Vua của các loài thú, sống sau khi đã chế ngự;* (`rājā migānaṁ abhibhuyya cārī`). Căn cứ: `rājā` đứng đồng vị với `sīho` (sư tử chính là vua các loài thú) nên không có chữ *Như* thứ hai; *tự tại* không có trong `cārī`, lại trùng với *Tự Tại* dùng cho `sayambhū`. Cách dịch này giống tha-ap2:47.1–47.2.

  Sửa lan 2026-10-13 (lượt kiểm sửa lan thứ hai): (1) `snp1.3:38.3` `Sevetha pantāni senāsanāni`: *Hãy thường lui tới những chỗ trú ngụ xa xôi,* → *Hãy thân cận những trú xứ xa vắng,*. Căn cứ: Pāli trùng nguyên văn ở 6 khoá khác (`sn6.13:2.1`, `sn6.13:3.3`, `thag2.11:2.1`, `tha-ap2:47.3`, `cnd23:337.3`, `mil7.6.3:3.1`), cả 6 đều *Hãy thân cận những trú xứ xa vắng*; chữ *thường* không có trong Pāli (`sevetha` là mệnh lệnh). (2) Kiểm lại `38.1`–`38.2` (sửa lần trước): khớp `tha-ap2:47.1`–`47.2` và `cnd23:337.1`–`337.2` — giữ nguyên. (3) Mô tả "giẫy già (vivāda)" như `an10.50`: `snp1.3` không có `vivāda` và không có chữ *giẫy già* — không áp dụng, giữ nguyên.

  Lô G2 2026-10-15 (Claude Sonnet 5.5, Claude Code): kiểm lại lỗi lặp bằng Pāli đã ghim và sửa:
  snp1.3:11.2, 12.2 bỏ “chú tâm” thừa (Pāli chỉ có sādhuvihāridhīraṁ); 23.3 thêm `sayaṁ` (“Tự mình”)
  và `pasuta` (“mải mê”) theo cnd23:221.3; 26.1 `dāraṁ` “vợ chồng” đổi “vợ”; 41.1 `kāraṇatthā` bỏ “của
  mình” thừa, đổi “vì có mục đích” theo cnd23:352.1. Điểm chỉ nâng semantic_fidelity và grammar_logic
  mỗi tiêu chí 0,1 vì lỗi nghĩa thật; technical_integrity giữ nguyên.
