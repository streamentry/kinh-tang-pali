notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim (kn/ps/ps3.3_root-pli-ms.json), đủ 89/89 khoá; thứ tự khoá = thứ tự Pāli, không khoá thừa.

  Tầng tham khảo: english-sujato không có ps3.3 (đây là not-published-upstream, không phải not-synced); english-project của dự án chưa có; vietnamese-current (phantuananh) chỉ có Pháp Cú. Coverage English theo công thức của source/layers.yaml: mẫu số 53 khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối :0), tử số 0 ⇒ 0/53 = 0%, dưới ngưỡng 0,8; 36 khoá còn lại (ngắn hơn 40 ký tự) cổng không đo được gì. Bản Việt nguyên bài ở mục tra cứu toàn văn cuối trang (không phân đoạn, alignment: none) chỉ được đọc để so thuật ngữ, không phải tầng store, không cấp text cho bản này và không tính vào triangulation. Vì vậy triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft.

  Cấu trúc bài: đối thoại hỏi đáp theo khuôn "Nếu A, vậy thì B sao? — Không B." Khoá 2.1–11.2 là chuỗi cùng một khuôn đổi loại tâm (dục giới, sắc giới, vô sắc giới, về nghiệp, thuận chân lý, quá khứ, vị lai, thế gian hiện tại), dùng một khuôn Việt duy nhất. Pāli bài này không có dấu nháy nên bản Việt cũng không có. Ở 17.1–17.9 mỗi mệnh đề kết bằng ti được xét lần lượt: quá khứ (17.2–17.4), vị lai (17.5–17.7), hiện tại (17.8–18.1); 17.4, 17.7, 18.1 là phần trả lời phủ định, 17.3, 17.6, 17.9, 18.3 là phần phản bác. Khoá 17.5 và 17.8 là mệnh đề đem ra xét nên để dạng khẳng định trần.

  Thuật ngữ và tiền lệ (đo trên tầng Việt đã có): abhisamaya/abhisameti → thấu đạt (abhisamaya đã dịch ở 85 khoá: thấu đạt 52, thông đạt 11, giác ngộ 7, chứng ngộ 3; chọn thấu đạt vì đa số và vì vẫn phân biệt được với paṭivedha là thông suốt ở ps1.9). kkhaṇe → tại thời điểm (ps1.9, 4/4). aṭṭhena → do ý nghĩa (17 khoá, theo ý nghĩa 0, ps1.9:11.1 là bài song song với 13.7 và 13.8). pajahati → từ bỏ (354, so với đoạn trừ 4, đoạn tận 2). kilesa → phiền não (32 trên 41). nirodha → diệt (570, tịch diệt 8). sacchikiriyā → chứng ngộ (187). maggabhāvanā → tu tập đạo (7/7). saṅkilesika → ô nhiễm (39 trên 44). vicikicchā → nghi hoặc (202, hoài nghi 76; theo glossary). diṭṭhi → kiến (169 trên 198). rāga/dosa/moha → tham 122 / sân 101 / si 83. mānaṁ → mạn. uddhacca → trạo cử (27, phóng dật 2). pamāda → phóng dật (447, buông lung 99; theo glossary), kosajja → biếng nhác (18, lười biếng 8, lười nhác 8; theo glossary): hai từ này lệch ps1.9:10.1 (thất niệm, lười biếng); tôi theo đa số tầng và glossary, ps1.9 không sửa trong lát này. nibbāna → Niết-bàn; amatogadha → nhập vào bất tử (17 trên 22; sn48.57:1.5). vīriyindriya → tinh tấn căn (39), vīriyabala → tinh tấn lực. iddhipāda → như ý túc (267), sammappadhāna → chánh cần (63), bojjhaṅga → giác chi. adhimokkha → thắng giải (7 trên 8). paggaha → nỗ lực, upaṭṭhāna → thiết lập, avikkhepa → không tán loạn, pariggaha → thâu nhiếp, samuṭṭhāna → phát khởi, vodāna → thanh tịnh (chánh mạng), abhiniropana → hướng tâm, pharaṇa → biến mãn, upasama → an tịnh, paṭisaṅkhāna → suy xét, pavicaya → trạch pháp, paṭippassaddhi → lắng dịu, pariyosāna → cứu cánh (89 trên 380): tất cả theo ps1.9 và tầng. sakadāgāmi → Nhất lai (59 trên 69), anāgāmi → Bất lai (71 trên 111), cùng khuôn Dự lưu đạo, Dự lưu quả như ps1.9. lokuttara → xuất thế gian theo ps2.8 (tầng chia gần đều: xuất thế gian 18, siêu thế 15).

  Pāli trùng nguyên văn: 18 cặp trùng trong chính bài (13.1/14.1/15.1/16.1; 13.2/14.2/15.2/16.2; 14.4/15.6/16.11; 15.4/16.9; 15.5/16.10; 18.12/18.17), 0 cặp mà bản Việt khác. Đã dò toàn bộ tầng ps: không khoá Pāli nào của bài này trùng nguyên văn với bài khác ở độ dài từ 30 ký tự; ps1.9:11.1 chỉ trùng cấu trúc, không trùng nguyên văn.

  Bất định, không thêm vào thân kinh: (1) 12.2 taṁsampayuttaṁ nirodhagocaraṁ ở mệnh đề đầu không rõ chủ ngữ: tâm hay trí là cái tương ưng và có diệt làm phạm vi; dịch giữ chủ ngữ là tâm (cittaṁ) và ở mệnh đề sau là trí (ñāṇaṁ), hai cách đọc đều không đổi giáo nghĩa vì cả tâm đạo lẫn trí đạo đều lấy diệt (Niết-bàn) làm đối tượng. gocara dịch là phạm vi (41 khoá tầng), không dùng hành xứ (6). uppādādhipateyya và dassanādhipateyya dịch là có sự sinh khởi làm chủ, có sự thấy làm chủ. (2) 13.7: Pāli có avikkhepaṭṭhena visuddhiabhisamayo; bài song song ps1.9:11.1 có cittavisuddhi (tâm thanh tịnh) ở đúng vị trí này, nhưng Pāli bài này chỉ có visuddhi nên dịch đúng chữ có mặt là thanh tịnh, không thêm tâm. (3) 13.7: vimokkha (muttaṭṭhena) và vimutti (pariccāgaṭṭhena) đều ra giải thoát (đúng quy ước tầng, vimokkha giải thoát và vimutti giải thoát), phân biệt bằng vế ý nghĩa đi kèm (được thoát khỏi / xả ly). (4) 7.1: kammassakatacitta → tâm về sự chủ nhân của nghiệp (an5.161:1.11 là tiền lệ duy nhất, dịch kammassakatā là sự chủ nhân của nghiệp); saccānulomikacitta → tâm thuận theo chân lý (0 tiền lệ trong tầng). (5) 17.9: thāmagato anusayaṁ pajahati → người đã ngấm sâu từ bỏ tùy miên (mn64:5.4 dịch thāmagatā là ngấm sâu); chủ ngữ có thể hiểu là người có tùy miên đã vững mạnh, Pāli không nói thêm. aniṭṭhaṅgato → người chưa dứt khoát (sn22.81:12.9 dịch là không vững vàng nơi Chánh Pháp; ở đây không có vế chỉ nơi chốn đi kèm nên không thêm). parāmaṭṭha → bám chấp. (6) 17.3: atītaṁ yaṁ na atthi dịch là cái thuộc quá khứ vốn không có; atthi là có mặt, không dịch là không còn. āyūhanā → sự tích lũy (tầng chỉ có pe7:3.6 dịch là gắng sức ở nghĩa khác, 0 tiền lệ cho nghĩa này); không thêm chữ nghiệp ngoài Pāli. (7) 18.2 na anāgate …pe… dịch là không vị lai … với đúng một dấu lược, không bung thành văn. (8) 1.1: thẻ b quanh Abhisamayo bị bỏ vì không tệp nào trong tầng Việt dùng thẻ này.

  Số Pāli: không có số lớn; chỉ có các danh sách đếm được và đã đối chiếu với Pāli từng khoá: 13.3 tám chi đạo (8 mục), 13.4 bảy giác chi (7), 13.5 năm lực (5), 13.6 năm căn (5), 13.7 mười chín mục (19, đủ 18 dấu chấm phẩy), 13.8 chín mục (9).

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (89 = 89), thứ tự giống Pāli; nháy đơn, nháy kép: Pāli không có nháy ở khoá nào (0/89) nên bản Việt không có và phép so nháy chạy với mẫu số 0 khoá có nháy; dấu lược … khớp Pāli từng khoá (12 khoá có dấu lược, 0 lệch, không (…) trần); NFC, khoá rỗng, khoảng trắng thừa, Pāli lọt sang Việt: 0 lỗi trên 89 khoá.

