  HAI CHỖ CỐ Ý LỆCH TIỀN LỆ, vì tiền lệ sai theo Pāli:
    (1) `2.1–2.2` `Pucchāmi taṁ uppalamāladhārinī, Āveḷinī kañcanasannibhattace;` —
      Pāli này TRÙNG TỪNG KÝ TỰ với `vv32:3.1` / `vv32:3.2`, nhưng bản Việt của `vv32`
      dịch `Tôi hỏi nàng mang tràng hoa sen,` / `nàng xấu xí, khó sánh được vàng ròng;`.
      Cả hai sai: `uppalamāla` không phải tràng hoa sen (`saddāpuppha`/`paduma` mới là
      sen), và `Āveḷinī` (từ `āvaḷa`/`aveḷī`, đồng bằng trống) không có nghĩa là
      xấu xí. Tôi dịch `Tôi hỏi người trao tặng ngọn mía, / Āveḷinī có tài lộc như vàng
      ròng;` ⇒ Người điều phối nên sửa `vv32:3.1` và `vv32:3.2` cùng lúc, và `vv48:2.1`,
      `vv48:2.2` vẫn chưa dịch.
    (2) `10.2` `Mahājutikā` với `9.2` `Mahāvipākā` — 0 tiền lệ cho cả hai trong tầng
      (`Mahājuti` chỉ 2 chỗ trong Pāli root, đều là `vv30` và bản song song `vv48`).
      Tôi giữ đúng phân biệt: `vipāka` là QUẢ BÁO nên `là quả lớn lao` ở `9.2`;
      `juti` là uy lực/hiệu lực nên `là hiệu lực lớn lao` ở `10.2`.

