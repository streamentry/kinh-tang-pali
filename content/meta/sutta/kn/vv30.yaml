  BẤT ĐỊNH (đã ghi, không giấu, không bịa thêm):
    (1) `10.4` `Sahassanettoriva nandane vane.` — CỐT BÀI NÀY KHÔNG ĐỦ THÔNG TIN ĐỂ
      CHỐT HẾT, tôi ghi thẳng ra đây thay vì đoán. `sahassanetto` có 5 chỗ trong Pāli
      root nhưng cả năm đều theo nghĩa TAI/ĐÔT: `ja417:3.3` (`Sahassanetto
      atulānubhāvo`, nghĩa là có trăm nghìn tai để nghe tiếng gọi xa) và `ja535:83.2`
      (`Sahassanetto tidasānamindo`) — cùng bối cảnh `kosiya` (gọi vang). Ở đây không có
      `kosiya` nên có thể là NHIỀU LÁ/ĐỐT, và `riva` (ví như) cần một vật để so.
      Cách duy nhất tôi bảo vệ được là `như trăm nghìn lá trong rừng Nandan.` Tôi KHÔNG
      ghi kèm lý giải nào vào thân kinh; đây là chỗ người biên tập nên đọc lại.
    (2) `6.3` `Pīṭhaṁ gahetvā pahāraṁ adāsi me` — `pahāraṁ` là BỘT (cái đánh), `adāsi
      me` là đã đưa cho tôi. Vế này không nói rõ cái đánh rơi vào ai (người vợ hay vị
      tỳ-kheo). Tôi dịch theo nghĩa chữ `ông ấy cầm lấy miếng ăn rồi đánh tôi một
      cái,` và KHÔNG bịa thêm chi tiết nào.
    (3) `2.1` `uppalamāladhārinī` — `uppāla` có thể là ngọn mía (`ucchuppāla`) hoặc cỏ
      ngạc (`mnd16:253.5` `uppalamālaṁ` = vòng hoa cỏ ngạc). Vì bài này kể chuyện cho
      một `khaṇḍika` mía và tên cung điện là `Ucchudāyikā`, tôi chọn nghĩa ngọn mía; lý do
      đó nằm ở đây, KHÔNG đưa vào thân kinh.
    (4) `7.3` / `9.3` `paricārayāmahaṁ` — `paricārayāmi` vừa là du hành vừa là hưởng
      thụ; vế sau (`Modāmahaṁ kāmaguṇehi pañcahi`) đã nói rõ là vui thích, nên tôi giữ
      `du hành` ở đây để không lặp `hưởng thụ` hai câu liên tiếp.
    (5) `5.2` `vadhuke` là xưng hô người chồng với vợ; tôi dịch `nàng ơi` và dùng nháy
      đơn `‘ ’` cho lời của chồng, theo tiền lệ `vv17:5.2`.
    (6) CẢNH BÁO CHO NGƯỜI ĐIỀU PHỐI — `vv48` (bài song song, KHÔNG thuộc lát của tôi)
      dùng chung **43 khoá Pāli trùng tuyệt đối** với `vv30`, và bản Việt hiện trên đĩa
      (lúc 2026-10-05, có thể còn đang được viết) KHÁC ở **37** khoá. Vài chỗ trong đó
      có vẻ sai theo Pāli: `vv48:5.1` và `vv48:6.2` dịch `sassu` (chồng nàng) thành
      *thần Trăng*; `vv48:5.2` dịch `avākiri` (cất tiếng gọi) thành *ngươi đánh rơi* và
      `vadhuke` thành *kẻ giết người*; `vv48:4.3`, `9.2`, `10.2` biến `ucchu`/`khaṇḍika`
      thành tên riêng *Ucchu*; `vv48:10.4` đọc `sahassanetto` là *nghìn con mắt*
      (trong Pāli root, cả 5 chỗ đều theo nghĩa tai/đốt); `vv48:7.4` dịch `kāmaguṇehi`
      thành *dục công đức*. Tôi KHÔNG sửa `vv48` vì ngoài lát. Hai bài này cùng một văn,
      nên người biên tập nên gộp lại một công thức tiếng Việt cho cả hai.

