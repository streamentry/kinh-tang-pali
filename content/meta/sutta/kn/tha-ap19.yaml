  BẤT ĐỊNH ĐÃ GHI. (1) `:13.2` `Tatiyabhāṇavāraṁ` — 0 tiền lệ trong toàn tầng Việt
  (Pāli có nó ở 4 bài `tha-ap` khác: 135, 225, 329, 394 — những bài chưa dịch trong
