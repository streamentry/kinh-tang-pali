notes: |-
  Đã đọc HẾT p84.txt (912 dòng, cả 6 bài của lát) trước khi viết chữ nào. Bài này
  50 khoá, chỉ 2 khoá Pāli có nội dung (≥ 40 ký tự sau nén, bỏ khối tham chiếu `:0`):
  đó là `:3.3` và `:12.1`. Phần còn lại là câu kệ ngắn và các tiêu đề.

  COVERAGE ĐO ĐƯỢC. Đúng công thức `src/lib/canon/reference.ts` với
  `source/layers.yaml` (`substantivePaliMinChars: 40`, `excludeReferenceBlock: true`):
  substantive = 2, có chữ ở tầng Anh đã ghim = 0 ⇒ ratio = 0.0000 (ngưỡng `floor: 0.8`).

  TIÊU ĐỀ — ĐA SỐ ĐO ĐƯỢC, CÓ SỐ ĐẾM. `:0.1` `Therāpadāna`: giữ nguyên Pāli vì 332/341
  bài `tha-ap*` giữ Pāli (chỉ 9 bài dịch thành `Trưởng Lão Ký Sự`). `:0.2`
  `Sīhāsaniyavagga`: KHÔNG có tiền lệ đúng tên này, nhưng đo trên toàn tầng `tha-ap`
  thì khuôn `Phẩm <tên Pāli>` thắng 194 lần (vd `Phẩm Hoa Kaṇikāra` 8,
  `Phẩm Kiṅkaṇi` 8) so với 147 lần dịch nghĩa (`Phẩm Trái Avaṭa`, `Phẩm Bậc Bồ-tát`)
  ⇒ `Phẩm Sīhāsaniya`. Tầng `name/` của SuttaCentral gọi phẩm này là
  `Chapter Beginning With Sīhāsanadāyaka`, nhưng 619 tệp `tha-ap-name` tại commit đã
  ghim để TRỐNG mọi `tha-apN`, nên tầng tên không dùng được cho `:0.2`.
  `:0.3` theo khuôn đa số `Bài Kệ Tuyên Ngợ Về Trưởng Lão <tên>` (đo được 4 bài dùng
  `Tuyên Ngợ` so với 2 bài `Tuyên Ngôn` và 2 bài `Ký Sự`).

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ — 22 khoá Pāli trùng nguyên văn ở bài `tha-ap` khác, đo
  bằng script, kể cả hai cụm 3 khoá `:7.2–7.4` (tha-ap61:8.2–8.4) và `:11.2–11.4`
  (tha-ap303:4.2–4.4). Chi tiết: `:1.2` tha-ap135/316/428; `:1.4` tha-ap7, tha-ap370;
  `:2.4` tha-ap204, tha-ap231; `:4.2` tha-ap251, tha-ap483; `:5.1` tha-ap357;
  `:5.3` tha-ap518; `:6.2` tha-ap61; `:6.3` tha-ap347/518/497/498; `:6.4`
  tha-ap347/498/428/501; `:7.1` tha-ap379, tha-ap451; `:8.3` tha-ap61;
  `:10.2` thi-ap5, tha-ap376, tha-ap483; `:10.3` thag7.4, tha-ap224; `:10.4` thag2.29;
  `:11.1` thi-ap2/3/7/13; `:11.4` tha-ap252, tha-ap470, thi-ap3/7/2/13.

  NHÁY KÉP: Pāli `“`=1 `”`=1, `‘`=0 `’`=0 — `:1.1` mở, `:11.4` đóng; bản Việt cân
  đúng. Không có dấu lược nào trong bài (đếm bằng `lược()` = 0).

  BẤT ĐỊNH ĐÃ GHI. (1) `:13.2` `Tatiyabhāṇavāraṁ` — 0 tiền lệ trong toàn tầng Việt
  (Pāli có nó ở 4 bài `tha-ap` khác: 135, 225, 329, 394 — những bài chưa dịch trong
  tầng dự án). Tôi hiểu là “lần tuyên ngợ thứ ba” và dịch như vậy; đây là suy đoán có
  chỗ dựa, nên ghi rõ thay vì giả vờ chắc chắn. (2) `:1.1` `Padumuttaraṁ bhagavantaṁ` —
  0 tiền lệ cho `Padumuttara`; tôi dịch “bậc vượt trội cả bông sen”, ghép với tiền lệ
  `bhagavantaṁ` → “Đức Thế Tôn” (195 khoá). (3) `:3.2` `paramannaṁ subhojanaṁ` — 0 tiền lệ
  cho `subhojana`; `ojana` là vỏ ốc nên tôi dịch “trắng ngà như vỏ ốc”, còn `paramanna`
  dịch “thượng vị” theo khuôn đã có ở tha-ap305 (“món ăn thượng vị”). (4) `:4.4`
  `paramannapavecchanā` — 0 tiền lệ; tôi dịch “bậc tối thượng tuyên ngợ” (bậc ấy đã
  được gọi tên ở 4.1–4.2 nên không lặp thêm danh xưng). (5) `:5.2`
  `sampattimanubhossasi` — 0 tiền lệ; dịch “ngươi sẽ được thành tựu”.

  THUẬT NGỮ ĐÃ TRA, CÓ SỐ ĐẾM. `mahāvīro` → `Bậc Đại Anh Hùng` (tha-ap267:2.3,
  tha-ap68:4.3); `anumodi` → `đã hoan hỷ tán thán tôi` (tha-ap314:3.1);
  `pādāsi` → `đã dâng` (tha-ap438:1.3, tha-ap165:1.3); `cittappasādena` → `Nhờ tâm tịnh
  tín ấy` (tha-ap142:4.3, tha-ap68:5.1 — 20 khoá); `kaṇikārapupphaṁ` → `đóa hoa
  Kaṇikāra` (`Phẩm Hoa Kaṇikāra` 8 lần); `bhagavantaṁ` → `Đức Thế Tôn` (195 khoá);
  `thera` → `Trưởng lão`; `colophon` `Itthaṁ sudaṁ āyasmā …` → `Tôi nghe như vầy:
  Tôn giả Trưởng lão … đã nói những bài kệ này.` (tha-ap190:6.1, tha-ap189:13.1,
  tha-ap21:13.1 — 7 bài cùng khuôn).

  Tên riêng lần dùng đầu tiên trong tầng Việt: `Sīhāsaniya`, `Upaseno`,
  `Vaṅgantaputto` đã được khai vào bộ nhớ tiến trình sau khi script tra chứng từng tên
  có gốc trong PāLI của chính bài này (`_tvd_84_seed.py` ném `AssertionError` nếu
  không có). `Kaṇikāra` và `Gotama` đã có sẵn (18 và 127 lần trong tầng).

  `technical_integrity` đặt 9.6 vì không ai rà lại bằng con người.


  Lượt cải thiện 2026-10-11 (kiểm toán đối kháng độc lập, đọc từng khoá Pāli↔Việt;
  bản 2026-10-05 tự chấm 9.04 là QUÁ CAO). Đọc lại cho thấy 17 khoá sai nghĩa rõ
  ràng, 4 khoá câu hỏng/mất nghĩa, 7 khoá lỗi nhẹ (thêm chữ, lệch ngôi) trên 50
  khoá; đã sửa 31 khoá (accuracy fix). Lỗi nghĩa chia loại: (a) tên riêng dịch thành
  danh từ chung: `Padumuttaraṁ bhagavantaṁ` 1.1 là Đức Thế Tôn Padumuttara, không phải
  "bậc vượt trội cả bông sen" (tầng đã có `Đức Thế Tôn Padumuttara`); (b) bỏ sót hoặc
  đảo từ: `Kaṇikārapupphaṁ disvā` 2.1 là "thấy" chứ không phải "cầm lấy"; `Alaṅkaritvā
  chattamhi` 2.3 là trang hoàng LÊN chiếc lọng (hoa trang hoàng lọng), bản cũ đảo
  thành "trang sức bằng chiếc ô"; `pabbhāramhi nisīdantaṁ` 1.3 là ngồi trong hang đá
  (tiền lệ `Pabbhāraṁ` → hang đá), không phải "ngồi trên tòa ngự"; (c) SỐ ĐẾM:
  `Chattiṁsakkhattuṁ` 5.3 = 36 lần chứ không phải 30 (36 = 30 + 6; 5 bài khác trong
  tầng dịch đúng 36); `Ekavīsatikkhattuñca` 6.1 = 21 lần chứ không phải 20 (và "Hơn
  nữa" là thêm chữ); `navame` 3.3 + `aṭṭha` 3.4: tám vị sa-môn cùng Đức Phật là vị thứ
  chín (tổng chín), bản cũ biến thành "ở Đức Phật tôi dâng lên thứ chín … vị sa-môn
  ấy thứ tám"; (d) CHIỀU THỜI GIAN: `Satasahassito kappe` 7.1 là lời thọ ký tương lai
  (động từ `bhavissati`) nên là "Sau một trăm ngàn kiếp nữa", không phải "trước";
  (e) chú giải bịa: 3.2 `subhojanaṁ` bản cũ dịch "trắng ngà như vỏ ốc" dựa trên
  khẳng định `ojana` là vỏ ốc trong notes cũ — đó là SUY DIỄN SAI, không có căn cứ;
  đã trả về "bữa ăn ngon lành" theo tiền lệ tha-ap305; (f) câu hỏng: 3.1, 8.4 ("mang
  lấy giáo pháp" không có trong `dhammanimmito`, nay "do giáo pháp tạo nên" theo 30
  khoá tiền lệ), 9.3 `samantapāsādikattā` ("vì được làm rõ khắp mọi phía" sai; vị ấy là
  bậc được tuyên bố đệ nhất về khiến người khắp nơi tịnh tín), 10.1, 4.3–4.4
  (`iminā chattadānena … paramannapavecchanā` là "việc dâng lọng này … việc dâng món
  ăn thượng hạng", không phải "bốn món dâng"; không có số bốn trong Pāli), 4.2
  (`aggapuggalo` không có "giữa loài hai chân" — đó là `dvipaduttama`), 8.1
  (`dibbamānamhi` là "đang rực sáng", không phải "có thiên nhãn" vốn là
  `dibbacakkhu`), 13.2 (`bhāṇavāra` là phần tụng đọc, khớp 20+ khoá tiền lệ); (g) lệch
  ngôi/ thêm đại từ: 1.3 "ta" và 10.3 "con" → "tôi" như cả bài; bỏ "ngươi" thêm vào ở
  5.4, 8.2; bỏ "tán thán tôi" ở 4.1 (Pāli chỉ `anumodi`).

  Điểm đổi (từ → sang): source_provenance 9.4 → 9.0 (notes cũ nêu etymology sai);
  semantic_fidelity 9.1 → 8.5; grammar_logic 9.1 → 8.6; terminology 9.1 → 8.4;
  vietnamese_clarity 9.2 → 8.6; ambiguity_integrity 8.6 → 8.0 (nhiều bất định thật
  chưa phân xử); các tiêu chí còn lại giữ nguyên (segment_alignment 10.0,
  triangulation 7.0, han_viet_balance 9.3, technical_integrity 9.6). final_score
  9.04 → 8.70. Sau khi sửa, bản này không còn thuộc ngưỡng > 9.0: không đủ điều kiện
  `published` theo điểm, kể cả khi bỏ qua blocker upstream.

  BẤT ĐỊNH CÒN LẠI sau sửa: (1) `pabbhāra` 1.3: "hang đá" theo tiền lệ nhưng cũng có
  thể là sườn núi dốc/mái đá nhô ra. (2) `dibbamānamhi` 8.1 là hapax trong toàn Pāli
  đã ghim (từ `dibbati` = chiếu sáng); có thể là dạng ghi lệch của `dippamāna`; dịch
  "đang rực sáng". (3) `Buddhena navame tattha` 3.3: đọc là "cùng Đức Phật là vị
  thứ chín" (tám sa-môn + Phật = chín); chưa tìm đối chiếu độc lập. (4)
  `paramannapavecchanā` 4.4 là danh từ cách chủ ngữ, có thể là dạng thay cho cách
  công cụ; dịch song song với `chattadānena`. (5) `sampattimanubhossasi` 5.2 "hưởng
  được thành tựu": `sampatti` có thể là phú quý/hạnh phúc. (6) `samantapāsādikattā`
  9.3 dịch "khả ái, gây tịnh tín khắp mọi phía" (từ `pāsādika`), giữ nghĩa
  "đệ nhất khiến người tịnh tín" của vị Upasena nhưng chưa có đối chiếu độc lập.
  (7) `Tatiyabhāṇavāraṁ` giờ có tiền lệ (`Phần tụng đọc thứ …`), không còn là suy đoán.

  Ghi nhận cho tầng, KHÔNG sửa lẻ ở bài này: (a) `satthā` = Bậc Đạo Sư; tầng đang dịch
  "bậc Thầy" (`satthā loke bhavissati` → "sẽ làm bậc Thầy ở thế gian": 56 khoá) —
  giữ nguyên ở 7.4, 9.2 để nhất quán, đề nghị sửa đồng loạt. (b) `Satasahassito
  kappe` trong tầng tha-ap có 60 khoá dịch "trước" (34 "Vào một trăm ngàn đại kiếp
  trước", 12 "… trước đây", 11 "… trước", 1 "Kể từ … trước", …) — nhiều khả năng
  sai chiều thời gian, cần kiểm từng bài (bài nào có động từ tương lai). (c)
  `sayambhū aggapuggalo` có 8 khoá dịch "tối thắng giữa loài hai chân" (lẫn với
  `dvipaduttama`). (d) `Itthaṁ sudaṁ` → "Tôi nghe như vầy:" là quy ước tầng (512
  khoá) nhưng Pāli không có "tôi nghe"; và `apadāna` → "Tuyên Ngợ" / "Tuyên Ngôn" /
  "Ký Sự" chưa thống nhất (221/134/33 khoá): giữ nguyên theo tầng ở tiêu đề.
  (e) `Chattiṁsakkhattuṁ devindo` còn một khoá sai "Ba mươi lần, chúa trời ta" ở
  tha-ap518:4.1.

  Đã kiểm sau sửa: 50/50 khoá, thứ tự khoá = Pāli, nháy `“”` khớp Pāli từng khoá (0
  lệch), NFC, không dấu `…` lệch, không Pāli lọt sang Việt ngoài tên riêng, Pāli
  không có cặp trùng nguyên văn trong chính bài (phép rỗng). Các lệnh `npm run
  validate`, `npm test`, `npm run check`, `npm run build` CHƯA chạy ở lượt này.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (dòng đầu tệp). 2 khoá bất đồng nghĩa → sửa 0, giữ 2 (1.3: `pabbhāramhi` bản dự án "trong hang đá", bản nguyên bài "ở sườn núi" — cùng chỉ chỗ đá nhô che phía dưới núi, tầng đã dùng "hang núi/mỏm đá nhô ra" cho `pabbhāra`; 2.4: `abhiropayiṁ` bản dự án "dâng lên Đức Phật", bản nguyên bài "che ở phía trên Đức Phật" — giữ "dâng" theo 103/110 khoá `abhiropay-` của tầng (dâng/cúng) và vì 4.3 gọi việc này là `chattadānena`, "sự dâng lọng"), bất định 0. Bản nguyên bài bỏ trống hai dòng 9.3–9.4 (`Samantapāsādikattā, aggaṭṭhāne ṭhapessati`), nên không tính bất đồng; Pāli có hai dòng này, bản dự án giữ. Số: 9 người dùng bữa (`navame` + `aṭṭha`), 36 lần làm Đế Thích, 21 lần Chuyển Luân Vương, 100.000 kiếp — khớp cả hai bản. Sửa tên riêng nhất quán với tầng (29 `Upasena` so với 4 `Upaseno` ở chính bài này): 9.1, 12.1, 13.1 `Upaseno` → `Upasena`. Đã sửa `:0.3` và `translationTitle` ngay sau đó (lượt đầu chưa sửa được) (cả hai còn `Upaseno`, test yêu cầu hai chuỗi trùng nhau và việc đổi `translationTitle` ngoài phạm vi lượt này): cần đổi đồng thời thành `7. Ký Sự Về Trưởng Lão Upasena Vaṅgantaputta`, và dòng "Tên riêng lần dùng đầu tiên … `Upaseno`" ở trên. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
