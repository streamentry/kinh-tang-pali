  cho `subhojana`; `ojana` là vỏ ốc nên tôi dịch “trắng ngà như vỏ ốc”, còn `paramanna`
  dịch “thượng vị” theo khuôn đã có ở tha-ap305 (“món ăn thượng vị”). (4) `:4.4`
  `paramannapavecchanā` — 0 tiền lệ; tôi dịch “bậc tối thượng tuyên ngợ” (bậc ấy đã
  được gọi tên ở 4.1–4.2 nên không lặp thêm danh xưng). (5) `:5.2`
  `sampattimanubhossasi` — 0 tiền lệ; dịch “ngươi sẽ được thành tựu”.

