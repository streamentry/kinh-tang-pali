  chỗ dựa, nên ghi rõ thay vì giả vờ chắc chắn. (2) `:1.1` `Padumuttaraṁ bhagavantaṁ` —
  0 tiền lệ cho `Padumuttara`; tôi dịch “bậc vượt trội cả bông sen”, ghép với tiền lệ
