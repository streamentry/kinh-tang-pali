notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho tha-ap, xem `blocking_errors`.
  TIỀN LỆ ĐÃ DÙNG (đếm được trên tầng `vietnamese-project`): `Therāpadāna` 307 lần giữ nguyên Pāli (chỉ 9 lần dịch `Trưởng Lão Ký Sự`) → giữ Pāli; `Kiṅkaṇipupphavagga` → `Phẩm Hoa Kiṅkaṇi` 3/3 bài đã dịch cùng phẩm (tha-ap494, 496, 499); `Paṭisambhidā catasso` → `Bốn vô ngại giải` 322 lần; `Itthaṁ sudaṁ … abhāsitthāti` → đúng câu `Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này.` có ở 361 tệp; `thợ vàng` cho `vanakammika` đã có (dn2, mn140); `Tena kammena sukatena` → `Nhờ nghiệp lành khéo làm ấy` 7 lần; `cetanāpaṇidhīhi` → `cùng với tâm nguyện và chí hướng` 8 lần; `tāvatiṁsamagacchahaṁ` → `tôi đã đến cõi trời Ba mươi ba` 5 lần; `Haṭṭho haṭṭhena cittena` 12 lần (chọn `hân hoan với tâm hân hoan`); `padapūjāyidaṁ phalaṁ` dùng nguyên văn tiền lệ `đó là quả báo của sự cúng dường dấu chân`; `Koraṇḍaṁ pupphitaṁ disvā` → `Thấy hoa koraṇḍa nở rộ`; `Dvenavute ito kappe` → `Vào chín mươi hai kiếp trước` 11 lần; `viharāmi anāsavo` → `tôi sống không còn lậu hoặc`; `Svāgataṁ vata me āsi` → `Thật là đón mừng thù thắng thay cho tôi` 21 lần, đúng như hai bài anh em 496 và 499.
  NGÔI KỂ: đếm trên toàn tầng `tha-ap` (383 tệp) thì `tôi` 641 và `ta` 681 — gần như chia đôi; nhưng hai bài anh em ngay cạnh trong cùng phẩm là 496 và 499 dùng `tôi` (9 lần mỗi bài), 494 dùng `ta` (9 lần). Chọn `tôi` cho cả lát để không trộn hai ngôi trong cùng lời thoại; ghi đây là việc cần người điều phối gộp nếu muốn thống nhất với phe `ta`.
  BẤT ĐỊNH 1 — `Mama āsayasāmantā,` (2.1): không có chứng từ nào giải được. Tra thử 5.764 tệp Pāli đã ghim: cụm này chỉ xuất hiện 2 lần (tha-ap495 và tha-ap427, cùng một vị trưởng lão, chưa dịch), và không từ nào trong ngữ pháp Pāli cho `āsayasāmantā`. Hai tra web cũng không có kết quả. Chọn cách ít giả định: `āsaya` = lối sống, `sāmantā` = đã lìa bỏ ⇒ `Lối sống ấy của tôi đã lìa bỏ,`; cách đọc cạnh tranh là `theo lối sống ấy`. KHÔNG đưa lên đây dạng chú thích; đã ghi vào `notes` như yêu cầu.
  BẤT ĐỊNH 2 — `pitumātumatenahaṁ` (1.2): dịch trung tính `sống bằng nghề ấy cho mẹ cha;` vì không xác định được `tenahaṁ` có phải `tena haṃ` (bằng nghề ấy, tôi) hay là một từ riêng. Nếu là `đúc tiền` thì câu phải đổi; không dám thêm vì Pāli không nói.
  BẤT ĐỊNH 3 — `kusalaṁ me na vijjati` (1.4): dịch theo nghĩa giới hạn đạo vì toàn bài đang kể nghiệp lành (`kusalaṁ` = điều thiện). Nếu `kusala` ở đây là danh từ chỉ người tốt thì phải dịch `tôi không có người tốt nào`.
  BẤT ĐỊNH 4 — `Koraṇḍakachavi homi` (6.3): `chavi` = người thọ hưởng/thiền quán, dịch `tôi làm bậc thọ hưởng cây koraṇḍa`; 0 tiền lệ trong kho cho cụm này.
  TIÊU ĐỀ: `0.3` và `12.1` dùng DẠNG TÊN `Ký Sự Về Trưởng Lão Koraṇḍapupphiya`, không gloss như 496/499. Lý do có thể kiểm chứng: chốt `lọt_pāli` của kho chặn đúng lần dùng đầu tiên của một tên; `Koraṇḍapupphiya` đã có sẵn trong kho (tha-ap210), còn `Koraṇḍa` viết hoa thì chưa có, và tôi không được sửa `_hvi.py`. Đây là chỗ lệch dạng so với hai bài anh em — người điều phối nên gộp.
  SỐ KHOÁ TRÙNG PĀLI: 15/42 khoá trùng nguyên văn với bài khác trong lát; toàn lát dùng lại đúng nguyên văn 61 cặp, 0 lệch. KHOÁ LÀM KHÓA CHÍNH THỨC: `tha-ap495:0.2` (28 ký tự) không nằm trong tập khoá mà `_hvi.py` kiểm, nên mọi sai lệch ở khối tiêu đề chỉ bị bắt khi đọc lại thủ công.
  LỆCH CHÉO GIỮA CÁC LÁT (đo trong lúc làm việc, KHÔNG sửa tệp người khác): `tha-ap427` — cùng vị trưởng lão Koraṇḍapupphiya — vừa được lát khác dịch, có 39 khoá trùng Pāli nguyên văn với bài này và 24 bản Việt KHÁC nhau. Hai chỗ lệch là lỗi nghĩa, không chỉ là văn phong: `Vanakammiko` 1.1 (bên kia `Trước kia tôi là người làm nghề trong rừng`, bên này `Trước kia tôi là thợ vàng` — `vankamma` là nghề đúc vàng, `vanam` là rừng) và `Pasumārena` 1.3 (bên kia `nghề chăn trâu`, bên này `nghề bán thịt heo` — `pasu` là con heo). Đây là việc của người điều phối gộp; tôi không sửa tệp ngoài lát.

  **Sửa lan 2026-10-13.** Khoá `9.1` (`Svāgataṁ vata me āsi`): *Thật là đón mừng thù thắng thay cho tôi,* → *Thật lành thay sự đến của tôi,*. Căn cứ: `svāgata` = sự đến tốt lành (`su` + `āgata`); *thù thắng* không có trong Pāli. Đo toàn tầng trên 236 khoá Pāli `Svāgataṁ vata me āsi` (trước khi sửa): 180 khoá dịch *Thật lành thay sự đến của ta/tôi/con* (trong đó *của tôi* 22 khoá, gồm `tha-ap497:9.1` cùng phẩm), 29 khoá *Thật là đón mừng thù thắng thay cho tôi/con*, 13 khoá *Thật là sự đón tiếp tốt lành cho tôi*, còn lại là các cách khác; những khoá *đón mừng thù thắng* khác (ví dụ `tha-ap496:5.1`, `tha-ap506:5.1`) nằm ngoài phạm vi lượt sửa này. Chọn *tôi* vì người kể cả bài xưng *tôi*. Các khoá khác của bài giữ nguyên, kể cả những chỗ bất định đã ghi ở trên. Điểm chấm không đổi.

  **Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan).** Đọc đối kháng đủ 42 khoá; sửa 19 khoá, các BẤT ĐỊNH 1–4 và câu "thợ vàng đã có (dn2, mn140)" ở trên bị thay thế bởi mục này. Hai khoá có Pāli chung với `tha-ap338` và `tha-ap415` được đối chiếu để kiểm: `Mama assamasāmantā` (`tha-ap415:5.1`) dịch `Gần am thất của ta`, nên `Mama āsayasāmantā` là `Gần nơi ở của tôi`; `tisso lokagganāyako` là danh xưng `Tissa, bậc Dẫn Đạo tối thượng của thế gian` ở 3 khoá khác (`bv19:1.4`, `bv19:20.2`, `tha-ap415:14.2`), chứ không phải số `ba`. Lỗi cũ thuộc loại sai nghĩa, không chỉ văn phong: đọc `tisso` thành số đếm, `āsayasāmantā` thành `lối sống ... lìa bỏ`, `Koraṇḍakachavi` thành `bậc thọ hưởng`.
  Khoá đổi (accuracy fix trừ ghi chú): `1.1` `thợ vàng` → `người làm nghề trong rừng` (`vanakammika`; tiền lệ `tha-ap338:3.1`, `tha-ap427:1.1`, `mn45`/`mn12:48` `người làm rừng`; `thợ vàng` không có căn cứ trong Pāli). `1.2` `sống bằng nghề ấy cho mẹ cha` → `theo ý của cha mẹ` (`pitumātumatena`; khớp `tha-ap338:3.2`). `1.3` `nghề bán thịt heo` → `việc giết thú vật` (`pasu` = thú vật, không riêng heo; `māra` = giết). `1.4` bỏ `cả` (thêm nghĩa). `2.1`–`2.4` viết lại: chủ ngữ `Tissa`, bỏ `ba lối` và `tuệ` (`cakkhumā` = `bậc Có Mắt`, không phải hô ngữ, không có `tuệ`; tiền lệ `tha-ap44:4.4`, `tha-ap560:6.2`). `3.1`–`3.2` bỏ `ba lối ấy`, `Giáo chủ chúng` (`tissanāmassa satthuno` = `bậc Đạo Sư tên Tissa`). `3.4` `đặt tâm` → `làm cho tâm mình tịnh tín` (`pasādayiṁ`; tiền lệ `tha-ap74:1.4`, `tha-ap427:3.4` `phát khởi tịnh tín`). `4.3` theo `tha-ap356:2.3`. `4.4` `lễ bái ... đáng tôn nhất` → `cúng dường dấu chân tối thượng` (`apūjayiṁ` là cúng dường, cùng gốc với `padapūjā` ở `7.4`; `padaseṭṭha` theo `tha-ap356:1.4`). `6.2` thêm `dù làm` (24 trong 31 khoá chung Pāli dùng `dù làm chư thiên hay làm người`, ví dụ `thi-ap15:14.2`). `6.3`–`6.4`: `Koraṇḍakachavi homi, suppabhāso bhavāmahaṁ` → `Tôi có làn da như hoa koraṇḍa, tôi tỏa sáng rực rỡ` (`chavi` = da; `suppabhāso` dùng đúng như `tha-ap500:19.4`); bỏ `xin cho` là lời cầu không có trong Pāli. `7.2` `việc thiện lành` → `nghiệp mà tôi đã làm khi ấy` (`kamma` không kèm `kusala`; tiền lệ `tha-ap153:4.2`). Đầu khoá thứ ba các khổ kệ viết hoa theo Pāli (`1.3`, `3.3`, `4.3`, `5.3`, `6.3`, `7.3`): đếm trên tầng `tha-ap`, 4.130 khoá viết hoa / 1.403 không.
  Bất định còn lại (giữ, không đoán): (a) `pitumātumatena` — `mata` đọc là `ý/chấp thuận`; chưa loại hẳn cách đọc khác, nhưng `tha-ap338` cũng dịch như vậy. (b) `pasumārena` — nghĩa `giết thú vật` suy từ cấu tạo `pasu` + `māra`; không có tiền lệ nào khác trong kho (chỉ `ja543:163.4`, là một dạng khác). (c) `Koraṇḍakachavi` — từ chỉ có ở bài này; `chavi` = da là chắc, so sánh với hoa `koraṇḍa` là hiểu theo cấu tạo bahubbīhi. (d) `padaseṭṭha` — hiểu là `dấu chân tối thượng` theo `tha-ap356`; chưa loại cách đọc `bậc tối thượng trong loài có chân`. (e) `kusalaṁ me na vijjati` — giữ `điều thiện`; cách đọc `người tốt` không có tiền lệ. (f) `Therāpadāna`, tiêu đề `0.3` và câu kết `12.1` giữ nguyên như lượt trước; câu kết viết `Ký Sự Về Trưởng Lão ... thứ ba` giống bài cùng phẩm (6 bài), nhưng toàn tầng `tha-ap` đa số là `Ký sự về Trưởng lão` (278/72); chưa đổi vì đây là quy ước chung cần biên tập quyết một lượt.
  Chấm lại: `semantic_fidelity` 9.3 → 8.6 (bản cũ sai nghĩa ở 1.1, 1.3, 2.1–2.4, 3.1–3.2, 6.3 mà đã chấm cao; nay đã sửa nhưng còn các bất định (a)–(d)); `grammar_logic` 9.2 → 8.9 (1.2 vẫn chưa chắc về quan hệ cú pháp); `terminology` 9.1 → 9.0; `vietnamese_clarity` 9.3 → 8.9 (các vế kệ còn rời rạc, cần đọc liền hai khổ); `ambiguity_integrity` 9.0 → 8.5 (bốn bất định thật). Các điểm khác giữ: `source_provenance` 9.5, `segment_alignment` 10.0, `triangulation` 7.5 (không có bản Anh độc lập), `han_viet_balance` 9.4, `technical_integrity` 9.6 (chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này). `final_score` 9.19 → 8.99. Blocker về không có tầng tham khảo tiếng Anh giữ nguyên.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 2 khoá bất đồng nghĩa → sửa 0, giữ 2 (1.2: bản nguyên bài là 'cùng với cha và ông', tức đọc `pitupitāmaha`, còn Pāli ghim là `pitumātumatena`, 'theo ý của cha mẹ', trùng cách dịch ở tha-ap338:3.2, nên giữ bản dự án; 4.3: bản nguyên bài dịch `sakosakaṁ` là 'một nhúm' hoa, bản dự án giữ 'còn nguyên đài bọc' theo hình thái `sa-kosaka` và tiền lệ tha-ap356:2.3 và tha-ap197:1.2), bất định 0 mới. Đã so từng khoá 1.1–12.1: người làm nghề rừng, sống bằng việc giết thú vật, Tissa bậc Có Mắt để lại dấu chân vì lòng thương, tâm tịnh tín nơi dấu chân, cúng hoa koraṇḍa, sinh cõi Ba mươi ba, làn da màu hoa koraṇḍa, chín mươi hai kiếp trước (dve 2 + navuta 90 = 92) đều cùng nghĩa với bản nguyên bài, và việc bản nguyên bài cũng đọc `tisso` là danh xưng Tissa xác nhận cách sửa ở lượt trước. Các bất định cũ về pasumārena, chavi, padaseṭṭha vẫn còn vì bản nguyên bài không giải thêm. Lượt review đối kháng của bản dự án không tìm thêm lỗi. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Quyết định hội đồng biên tập 2026-10-16: B20 — 5.2 (`cetanāpaṇidhīhi` = nhờ những ước nguyện của tâm).
