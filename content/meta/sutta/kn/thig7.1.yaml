  CỔNG COVERAGE KHÔNG ĐO ĐƯỢC GÌ, MẪU SỐ BẰNG 0: 32 khoá Pāli, sau khi loại block `:0` thì không khoá nào đạt ≥ 40 ký tự (kệ ngắn nhất 13 ký tự, dài nhất 24) ⇒ substantivePaliSegments = 0 ⇒ `ratio` định nghĩa bằng 1 và `scripts/validate.ts` bỏ qua cổng, không cần entry trong `content/meta/reference-gaps.yaml`. Đây là `no substantive segment`, KHÔNG phải `đã đủ`. Đo bằng công thức `src/lib/canon/reference.ts` chứ không suy từ tên thư mục.
  `:0.1` giữ Pāli `Therīgāthā 7.1`: đếm trên 60 tệp thig Việt đã có, 56 giữ số, 4 bỏ số ⇒ chọn đa số.
  `:0.2` `Sattakanipāta` ⇒ `Bộ Bảy Bài Kinh`. Chưa có tiền lệ trong thig (đo trên 60 tệp: Ekakanipāta → Bộ Một Bài Kinh 18, Dukanipāta → Bộ Hai Bài Kinh 10, Tikanipāta → Bộ Ba Bài Kinh 8, Chakkanipāta → Tập Sáu 8, Pañcakanipāta → Nhóm Năm 9 + Tập Năm 1 + Phẩm Năm Kệ 2, Aṭṭhakanipāta → Bộ Tám Bài Kinh 1, Catukkanipāta → Bộ Bốn Bài Kinh 1, Navakanipāta → Bộ Chín Bài Kính 1, Ekādasakanipāta → Bộ Mười Một Bài Kinh 1). Cột `Bộ N Bài Kinh` chiếm 40/60, và đúng với tầng `name/` đã ghim của chính SuttaCentral: `thig-name:64.thig-sattakanipata` → The Book of the Sevens. Ghi vào đây để người gộp thống nhất với thig7.3 cùng phẩm.
  `:0.3` `Uttarātherīgāthā` trùng nguyên văn `thig1.15:0.3` nên dùng lại y nguyên `Kinh Kệ Của Trưởng Lão Nữ Uttarā`. Đếm trên 60 tệp thig: `Kinh Kệ Của Trưởng Lão Nữ` 30, `Bài Kệ Của ... Ni` 11, `Kệ Ngôn Của ... Ni` 9 ⇒ đa số ở vị trí này là `Trưởng Lão Nữ`.
  `:1.1`–`:1.4`, `:2.2`–`:2.4`, `:4.3`, `:5.1`–`:6.2` TRÙNG NGUYÊN VĂN `thig5.11` (bản của ba mươi vị trưởng lão nữ) với đúng các khoá cùng đường dẫn ⇒ dùng lại nguyên văn bản Việt đã có: Musalāni gahetvāna → Cầm cối tay lên; dhaññaṁ koṭṭenti māṇavā → các gã trai trẻ giã cám lúa; Puttadārāni posentā → Các gã trai trẻ nấu cơm cho vợ con; dhanaṁ vindanti māṇavā → kiếm được của cải; yaṁ katvā nānutappati → làm rồi sẽ không hối tiếc; Khippaṁ pādāni dhovitvā → Rửa nhanh đôi chân; ekamante nisīdatha → ngồi xuống ở một bên; Pāde pakkhālayitvāna → rửa chân rồi đặt sang một bên; Rattiyā purime/majjhime/pacchime yāme → Vào canh đầu/giữa/cuối của đêm (mỗi cụm 2 tiền lệ, thig5.11 và thig6.8); dibbacakkhuṁ visodhayiṁ → ta tịnh hóa thiên nhãn; tamokhandhaṁ padālayiṁ → ta đập tan khối si ám. `pubbajātimanussariṁ` trùng `thig5.7:4.2` (ta nhớ lại các kiếp quá khứ) nên y nguyên. `ekamante upāvisiṁ` trùng `thig5.1:4.2` nên y nguyên, chỉ đổi xưng tự cho khớp (xem dòng về lỗi bản nháp bên dưới). `saṅgāme aparājitaṁ` trùng `thig5.11:5.4` (bất khả chiến thắng trong trận) nên y nguyên.
  `:2.1` `Ghaṭetha buddhasāsane` không có tiền lệ nào trong tầng. `ghaṭ` là giã trong cối, cố ý nối lại với `Musalāni gahetvāna / dhaññaṁ koṭṭenti` ngay phía trên, nên dịch `Hãy giã xay theo lời dạy của Đức Phật,` thay vì `Hãy làm theo` (như thig5.11:2.1 với `Karotha buddhasāsanaṁ`) — hai vế đó không trùng nguyên văn nên không dịch y nhau.
  PĀLI THẮNG Ở 7.1–7.4, VÀ ĐÂY LÀ ĐIỂM PHẢI NÊN: bản Anh đã ghim lệCH CẢ KHOÁ so với Pāli. Pāli là `Sakkaṁva devā tidasā, / saṅgāme aparājitaṁ; / Purakkhatvā vihassāmi, / tevijjāmhi anāsavā`. Sujato đặt `I shall abide honoring you` vào 7.1, `as the Thirty gods honor Sakka` vào 7.2, `undefeated in battle` vào 7.3, và dồn cả `Master of the three knowledges,` vào 7.4 trước câu bản dịch, kèm cả một mảnh markup còn sót `<j>`. Nói cách khác, Sujato đã lệch nguyên kệ sang một khoá. Dịch theo Pāli: 7.1 → Như ba mươi vị thần kính Sakka (đối chiếu `thig5.11:5.3` `Indaṁva devā tidasā` → như ba mươi vị thần kính Inda); 7.3 `Purakkhatvā vihassāmi` là ngôi thứ nhất số ít, nên không theo `chúng con` của thig5.11. Đây là disagreement thật đã phân xử bằng Pāli, nên `ambiguity_integrity` hạ xuống 9.0.
  `:3.4` `parato no ca attato` cần đọc kỹ để không đảo nghĩa: `no` là cách sở hữu của `naṁ` (= của chúng ta), KHÔNG phải phủ định. Bản Anh đọc thành `as alien, not as self`, tức lấy `no` là `not` — bản dịch không theo cách đó. Hai từ đều là cách bằng (`parato` = từ phía bên kia, `attato` = từ bản thân), nên dịch `cả ở bên ngoài lẫn ở bên trong ta`. Tiền lệ gần: `an4.16:2.6` `dukkhato no ca attato` → `là khổ, và không phải là ngã`.
  `:3.1`–`:3.2`: `Cittaṁ upaṭṭhapetvāna` là gerund quá khứ, còn `Paccavekkhatha` là mệnh lệnh, nên câu kệ là `Đã thiết lập tâm / nhất tâm, khéo định tĩnh; hãy soi xét các hành` — không dịch cả vế thành mệnh lệnh như nhau. `ekaggaṁ` đo trong tầng: nhất tâm 3, tâm nhất cảnh 2, tập trung và chuyên tâm 1; `susamāhitaṁ`: khéo định tĩnh 2, thành tựu định tốt 2, khéo được định tĩnh 1. `saṅkhāre` đo 16 lần và đều dịch `các hành` ⇒ y nguyên.
  LỖI BẢN NHÁP BẮT ĐƯỢC TRONG REVIEW ĐỐI KHÁNG (đã sửa trước khi ghi): bản nháp đầu tiên dùng lẫn `ta` và `tôi` cho cùng một người kể (`ta` ở 1.4/5.2/6.2 nhưng `tôi` ở 7.3/7.4), và viết `tam minh` ở 6.3 nhưng `tam-minh` ở 7.4. Đã thống nhất còn `ta` (như thig8.1 và thig6.8, vị trưởng lão nữ kể với người đàn bà dạy dỗ) và `tam-minh` (đếm trong tầng: tam-minh 42 so với tam minh 20).
  `:8.1` có HAI dấu lược, đếm được (Pāli `… Uttarā therī …. `), giữ đúng hai theo thig6.8:7.1 (`… Trưởng lão ni Vijayā ….`). Không thêm dấu `ti` vì Pāli khoá này không có.
  Xưng tự và ngôi kể đã kiểm lại từng khoá: `Ghaṭetha / nisīdatha / Paccavekkhatha` là mệnh lệnh ngôi thứ hai số nhiều (Paṭācārā dạy tập thể); `Tassāhaṁ vacanaṁ sutvā` mở sang ngôi thứ nhất số ít (`ta`), và `katā te anusāsanī` quay về số ít tôn xưng (`bà`) — không đảo hai ngôi này.
  Tầng `vietnamese-current` vắng; không có lớp lấp `english-project` cho uid này. 32/32 khoá đã kiểm: ngoặc kép cân (mở 2 ở 1.1 và 4.1, đóng 2 ở 3.4 và 7.4), không khoá rỗng, không khoá thừa, NFC sạch, không trùng nguyên văn Pāli, không lọt Pāli. Cổng kỹ thuật do coordinator chạy; bốn lệnh còn lại: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
