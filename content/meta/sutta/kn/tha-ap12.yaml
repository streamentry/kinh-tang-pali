notes: |-
  Bài này. `tha-ap12` · phẩm `Buddhavagga` · Trưởng lão Ānanda (bài `Ānandattheraapadāna`, thứ mười trong phẩm) · 95 khoá Pāli (`:0.1`–`:0.3`, kệ `:1.1`–`:20.4`, câu kết `:21.1`, câu chốt `:22.1`, kệ tóm tắt `:23.1`–`:25.4`, câu đóng phẩm `:26.1`). Dịch mới từ Pāli root đã ghim, đủ 95/95 khoá, thứ tự khoá đúng thứ tự Pāli, không khoá nào ngoài tập khoá của bài. Khoá `:21.1` đã có sẵn trong tệp (lát trước) và được giữ nguyên: công thức lời-kết *Tôi nghe như vầy: Tôn giả Trưởng lão Ānanda đã nói những bài kệ này.*, đúng nhóm số nhiều đo được 407 khoá, không phải nhóm số ít *đã từng nói bài kệ này* (21 khoá).

  NỘI DUNG (đã đọc Pāli, không suy từ khuôn chung). Ānanda kể kiếp trước thời Đức Padumuttara: Đức Phật bước ra khỏi cổng tịnh xá, đổ xuống cơn mưa bất tử, một trăm ngàn bậc thiện trí có sáu thắng trí vây quanh như bóng không rời (`:1`–`:2`); ngài ngồi trên lưng voi, thấy Đức Phật thì sinh hoan hỷ, xuống voi và giương chiếc lọng châu báu lên cho Đức Phật (`:3`–`:4`). Biết ý ngài, Đức Padumuttara dừng câu chuyện đang nói và nói các bài kệ (`:5`). Lời thọ ký nằm trong nháy đơn từ `:6.1` đến `:15.4`: người giương lọng sẽ ở cõi Đâu-suất, ba mươi bốn lần trị vì cõi trời, tám trăm lần làm thống lĩnh quân đội, năm mươi tám lần làm Chuyển Luân Vương (`:6`–`:9`); sau một trăm ngàn kiếp, thời Đức Gotama, sẽ là bà con của Đức Phật, tên Ānanda, thị giả của bậc Đại Ẩn Sĩ, tinh cần, đa văn, khiêm nhường, đoạn lậu hoặc (`:10`–`:13`); `:14`–`:15` là hai khổ kệ so sánh về voi (xem BẤT ĐỊNH). `:16`–`:20` là lời của chính Ānanda: phụng sự Đức Phật cả ba canh, đạt quả Nhập Lưu và địa vị hữu học, ba minh, bốn vô ngại giải, tám giải thoát, sáu thắng trí; `:21`–`:26` là câu kết, câu chốt, kệ tóm tắt của cả phẩm và câu đóng phẩm.

  SỐ PĀLI, TỰ TÍNH. `Catuttiṁsatikkhattuñca` (`:8.1`) = catu 4 + tiṁsa 30 = 34 lần (cấu tạo đã có ở `tha-ap33:7.3`: *Và ba mươi bốn lần*). `Aṭṭhapaññāsakkhattuñca` (`:9.1`) = aṭṭha 8 + paññāsa 50 = 58 lần (3 tiền lệ trùng). `Balādhipo aṭṭhasataṁ` (`:8.3`) = aṭṭha 8 × sata 100 = 800 lần (tiền lệ `tha-ap37:14.3` *tám trăm lần*; cùng cấu tạo `pañcasataṁ` = 500 ở `tha-ap36:8.3`). `Satasahassaṁ` (`:2.1`) = 100 × 1.000 = 100.000. `Kappasatasahassamhi` (`:10.1`) và `Satasahassito kappe` (`:18.1`) = 100.000 kiếp. `saṭṭhihāyanā` (`:14.2`) = sáu mươi tuổi (tha-ap431:9.4 trùng). `Chasatāni ca paññāsa` (`:25.3`) = cha 6 × sata 100 + paññāsa 50 = 650 (*sáu trăm và năm mươi*; giữ dạng Pāli, không viết chữ số). `catasso` (`:20.1`) 4, `aṭṭhime` (`:20.2`) 8, `chaḷabhiññā` (`:20.3`) 6, `tisso vijjā` (`:19.3`) 3, `dasamaṁ` (`:22.1`) = thứ mười, `paṭhamo` (`:26.1`) = thứ nhất. Cụm `Tiṁsakappasahassa` KHÔNG có trong bài; `tiṁsa` = 30 ở đây chỉ là thành tố của `Catuttiṁsati` (34), con số mà đo tầng đã xác lập (4 + 30). Ghi bất định: `aṭṭhasataṁ` có thể đọc 108 trong vài văn cảnh khác; ở đây theo mẫu `pañcasataṁ`/`ekasataṁ` (cùng khuôn *Pathabyā rajjaṁ … sataṁ*) nên đọc 800, nhưng `Balādhipo aṭṭhasataṁ` không có `rajjaṁ` nên không loại trừ hẳn cách đọc 108.

  TIÊU ĐỀ `:0.3`. Pāli `Ānandattheraapadāna` KHÔNG bắt đầu bằng số thứ tự nên `:0.3` không thêm số; `translationTitle` trong tệp metadata này BẰNG ĐÚNG giá trị `:0.3` (đã so chuỗi). Đo khuôn `:0.3` trên toàn tầng `tha-ap` hiện có: `Bài Kệ Tuyên Ngợ Về` 240, `Bài Kệ Tuyên Ngôn Về` 123, `Ký Sự Về` 104, `Bài Kệ Tuyên Ngợi Về` 10, `Kinh Kệ Của` 5. Phạm vi gần nhất (tha-ap1 đến tha-ap30): `Tuyên Ngôn` 11, `Tuyên Ngợ` 6, `Tuyên Ngợi` 2. Cùng phẩm Buddhavagga (tha-ap6, 7, 9, 10, 11): `Tuyên Ngôn` 4, `Tuyên Ngợ` 1. Hai phạm vi cho hai đa số khác nhau (toàn tầng nghiêng về `Ngợ`, phạm vi gần và cùng phẩm nghiêng về `Ngôn`); `Ngợ`/`Ngợi` là dạng sai chính tả, nên tôi chọn `Tuyên Ngôn` theo phạm vi gần nhất và cùng phẩm, KHÔNG tự quyết thay người biên tập: cần một lượt phán chung cho cả cuốn. `:0.2` `Buddhavagga` → `Phẩm Phật` (5/5 tiền lệ). `:0.1` giữ `Therāpadāna` (473/484). `:22.1` theo khuôn `:0.3` kèm `thứ mười` (khớp tha-ap10 `thứ tám`, tha-ap11 `thứ chín`). `:26.1` `Apadāne buddhavaggo paṭhamo` → *Phẩm Phật trong Apadāna là phẩm thứ nhất*, theo khuôn *Phẩm X là phẩm thứ N* của các câu đóng phẩm khác; giữ `Apadāna` nguyên dạng như `Therāpadāna` ở `:0.1`.

  KỆ TÓM TẮT `:24.1`–`:25.4` liệt kê mười hai bài của phẩm theo đúng thứ tự: Buddha, Paccekabuddha, Sāriputta, Kolita (tên khi còn tại gia của Moggallāna, giữ nguyên Pāli), Kassapa, Anuruddha, Puṇṇa, Upāli, Aññāsikoṇḍañña, Piṇḍola, Revata, Ānanda. Thứ tự khớp với năm bài đã có trong tầng (tha-ap6 Anuruddha, tha-ap7 Puṇṇa, tha-ap9 Aññāsikoṇḍañña, tha-ap10 Piṇḍola, tha-ap11 Revata) và với vị trí của chính bài này (mười hai tên, Ānanda là tên thứ mười hai; `dasamaṁ` ở `:22.1` đếm từ bài Sāriputta vì hai bài đầu là Buddha và Paccekabuddha). Khuôn dịch theo `tha-ap112:10.x`, `tha-ap142:12.x`, `tha-ap352:9.x` (tên riêng giữ Pāli, nối bằng dấu phẩy hoặc `và`). `:23.1` `Tassuddānaṁ` → *Tóm tắt phẩm này:* (34/45 tiền lệ; còn lại `Tóm lược:` 9, `Tóm lược phẩm ấy:` 2). `:25.4` `gāthāyo sabbapiṇḍitā` → *các bài kệ đều đã được gộp lại* (`tha-ap342:20.2`; còn `tha-ap32:10.4` *tính đếm*, chọn *gộp lại* vì `piṇḍita` = gom lại).

  TIỀN LỆ, ĐO ĐƯỢC. Dựng chỉ mục Pāli sang Việt trên toàn bộ tệp `tha-ap` đã có (không tính chính bài này). 43/94 khoá cần dịch có Pāli trùng nguyên văn với khoá ở nơi khác, tổng 2.249 cặp trùng (phần lớn từ các khoá khuôn `:0.1` 484 cặp, `:20.1`–`:20.4`, `:19.x`). 36 khoá dùng lại NGUYÊN VĂN một bản đã có (`:0.1` `:0.2` `:2.2` `:4.2` `:5.1` `:5.4` `:6.3` `:6.4` `:7.3` `:7.4` `:8.1` `:8.2` `:8.4` `:9.1`–`:9.4` `:10.1`–`:10.4` `:13.1`–`:13.4` `:16.3` `:16.4` `:18.1` `:19.1` `:19.3` `:19.4` `:20.1`–`:20.4` `:23.1`). 7 khoá có Pāli trùng nhưng bản Việt khác mọi tiền lệ, mỗi chỗ có lý do: `:1.1` (2 cặp, chỉ khác `tịnh xá`/`tinh xá` và đầu câu; giữ `tịnh xá` theo 3/4 tiền lệ gần Pāli `ārāmadvārā`); `:1.4` (2 cặp cũ `tha-ap306:3.4` và `tha-ap119:4.2` viết *làm cho đám đông hoan hỷ*; `nibbāpesi` là *làm cho nguội, dập tắt*, không có chữ nào là *hoan hỷ* trong Pāli, nên tôi viết *làm cho đại chúng được dịu mát* và BÁO hai khoá kia để người biên tập sửa, không đụng tệp ngoài bài; khoá `tha-ap115:2.4` `saṁvejesi mahājanaṁ` cũng đang dịch *hoan hỷ*, cùng nghi vấn); `:2.3` (1 cặp, chỉ khác viết hoa đầu dòng theo Pāli); `:3.4` (1 cặp `tha-ap320:2.4` viết *niềm tin của ta đã sinh khởi*; `vitti` là *hoan hỷ, thỏa lòng*, không phải *niềm tin*; tiền lệ đúng hơn là `tha-ap315:2.3` *Niềm hoan hỷ liền khởi lên trong ta*); `:17.2` (1 cặp `tha-ap61:10.2` *vị ấy cẩn thận tỉnh giác*; `sampajāno patissato` có tiền lệ *tỉnh giác và chánh niệm* 5/9 khoá, chọn dạng đó); `:19.2` (2 cặp cũ viết *ở trước Đức Phật tối thượng!* và *khi được đến trước…*, đều thêm chữ không có trong `santike`; tôi viết *bên cạnh*); `:25.4` (xem trên). `:18.1`: Pāli `Satasahassito kappe` có 34 cặp, trong đó 23 viết *Vào một trăm ngàn đại kiếp trước* và 10 viết `kiếp`; tôi chọn `kiếp` vì `kappa` = kiếp (trong `tha-ap`, ở các khoá Pāli có `kappa`: `đại kiếp` 67 / `kiếp` không đại 626) và để khớp `:10.1` cùng bài; không lấy `đại kiếp` vì không có `mahā` trong Pāli. Pāli trùng ngay TRONG chính bài: 1 cặp là `:12.1` và `:17.1` (`Ātāpī nipako cāpi,`), bản Việt khác có chủ đích: `:12.1` là lời thọ ký ngôi ba (đi với `bhavissati` ở `:12.4`) nên không có chủ ngữ, `:17.1` là lời tự thuật ngôi nhất (đi với `abhinīhariṁ` ở `:18.2`) nên thêm `Tôi`. `:19.4` và `:20.4` có Pāli khác nhau ở dấu cuối (`.` so với `”.`) nên không tính là cặp trùng.

  THUẬT NGỮ, ĐO ĐƯỢC. `narāsabha` → *bậc trượng phu tối thượng* ở `:4.2` vì khoá này trùng nguyên văn 6/7 tiền lệ (kể cả `tha-ap10:3.2` cùng phẩm); nhưng toàn tầng `tha-ap`, Pāli chứa `narāsabha` dịch *đấng Nhân Ngưu* 66, *trượng phu* 8, khác 24, nên đây là lệch có ý thức khỏi thuật ngữ đa số để giữ nguyên văn khoá trùng; người biên tập có thể phán một lượt cho cả cuốn. `mahāmuni` → *Đại Mâu-ni* (`tha-ap16:4.4`, `tha-ap33:2.2`), `mahāisi`/`mahesi` → *Đại Ẩn Sĩ* (`tha-ap102:3.2`, `tha-ap283:1.4`, `tha-ap20:3.4`). `tusita` → *Đâu-suất* (27 lần xuất hiện của `Đâu-suất` trong toàn tầng Việt). `accharā` → *tiên nữ* (3 tiền lệ trùng; `tiên nữ` 37 / `thiên nữ` 76 toàn tầng Việt, nhưng ở khoá trùng chọn theo tiền lệ). `sotāpattiphala` → *quả Nhập Lưu* (`Nhập Lưu` 42 / `Dự Lưu` 2 toàn tầng Việt; `quả Nhập Lưu` 15, `quả Dự Lưu` 0). `sekha` → *hữu học* (199 khoá). `kovido` → *thiện xảo* (theo `Jātimaraṇakovidaṁ`, `saṅgahesu ca kovido` v.v.). `atthaddho` → *không cứng cỏi* (tiền lệ `atthaddhā susamāhitā`). `nivātavutti` → *sống khiêm nhường* (tiền lệ `Mahattapattopi nivātavutti` *vẫn sống khiêm nhường*). `dhīrā` → *bậc thiện trí* (theo `tha-ap6:4.1`, cùng phẩm). `mahiddhikā` → *có thần thông lớn* nhất quán `:2.2` và `:15.2` (`:2.2` trùng nguyên văn 2 khoá). `padesarajja` → *vương quyền cai quản các vùng đất rộng lớn* (3 tiền lệ `tha-ap421:7.1`; dạng *Vương quốc rộng lớn ấy* có 13 tiền lệ nhưng thêm `ấy` không có trong Pāli, nên không lấy). `īsādantā urūḷhavā` → *ngà như cán cày, thân hình to khỏe* (2 tiền lệ). `tidhāpabhinnā mātaṅgā` → *voi chảy dịch ở ba nơi* (`tha-ap431:9.3`). `kuñjarā saṭṭhihāyanā` → *voi chúa sáu mươi tuổi* (`tha-ap431:9.4`). `canh đầu`/`canh giữa` (29/28 trong tầng Việt). `nāga` ở `:15.3` → *long tượng* (8 khoá `long tượng` toàn tầng Việt). `kulaketu` → *cờ hiệu* (10 khoá `cờ hiệu`). `ñātibandhu` → *bà con thân tộc* (`tha-ap36:10.4`). `upaṭṭhāko` → *thị giả* (47 khoá). `bhūmi` ở `:17.4` và `:18.3` → *địa vị* (nhất quán hai chỗ). `balādhipo` → *thống lĩnh quân đội* (1 khoá `thống lĩnh` trong tầng; không có tiền lệ cho `balādhipo`).

  BẤT ĐỊNH, GHI RÕ VÀ KHÔNG ĐƯA VÀO THÂN KINH. (1) `na hontupaṇidhimhi te’` (`:15.4`) là chỗ khó nhất bài. Dạng Pāli đã ghim là `paṇidhimhi` (`paṇidhi` thường là *ước nguyện, quyết tâm*), nhưng ngữ cảnh (đàn voi rừng hùng mạnh, nhiều trăm ngàn, so với bậc long tượng là Đức Phật) khớp với `upanidhi` = *so sánh*: `ud3.2:9.3` `upanidhimpi nopeti` (*không sánh bằng*), `tha-ap405:22.4` `upanidhiṁ na hessati`, `tha-ap130:2.1` `Ñāṇe upanidhā natthi`. Tôi dịch *đều không sánh được*. Cách đọc khác: `na hontu paṇidhimhi te` = *chớ có chúng trong ước nguyện ấy*; nếu đúng thì nghĩa câu đổi hẳn. Chưa phân xử được, không có bản Anh để đối chiếu; hạ `ambiguity_integrity`. (2) `anekasatasahassā` (`:15.1`) và `paṇḍitāpi mahiddhikā` (`:15.2`): chủ thể có thể là voi (`nāgā` ở `:14.1`) hoặc người (các bậc trí); tôi dịch trung tính *Nhiều trăm ngàn* / *cả những bậc trí có thần thông lớn* và *Tất cả chúng*. (3) `yaṁ kammamabhinīhariṁ` (`:18.2`): `abhinīharati` có nghĩa *dốc lòng thực hiện, phát nguyện*; tôi dịch *nghiệp mà tôi đã khởi sự thực hiện*, không có tiền lệ trong `tha-ap` (chỉ có `akariṁ` ở `tha-ap233:2.2`); cách đọc *nghiệp mà tôi đã phát nguyện* cũng hợp lý. `Tāhaṁ bhūmimanuppatto` (`:18.3`) đọc `taṁ ahaṁ bhūmiṁ anuppatto` = *tôi đã đạt đến địa vị ấy*; `ṭhitā … ācalā` (`:18.4`) dạng giống cái trong khi chủ thể là nam, đọc như `ṭhito … acalo`. (4) `Balādhipo aṭṭhasataṁ` (`:8.3`): `balādhipa` = *thống lĩnh lực lượng/quân đội*, hoặc *chúa tể sức mạnh*; và 800 so với 108 (xem SỐ PĀLI). (5) `Taṁ kathaṁ ṭhapayitvāna` (`:5.3`): *kathā* ở đây là câu chuyện, cuộc nói chuyện đang diễn ra (bài kệ `:1`–`:4` mô tả Đức Phật thuyết giảng); tôi dịch *dừng câu chuyện ấy*, không thêm chi tiết. (6) `setacchattaṁ varuttamaṁ` (`:3.2`) ở đối cách, động từ chính `āsiṁ`; hiểu như *với chiếc lọng trắng*, không thêm động từ `cầm`; `Sucārurūpaṁ` (`:3.3`) là *bậc có dung mạo rất đẹp đẽ* (đối cách, chỉ Đức Phật). (7) `dhārayiṁ` (`:4.4`) và `adhāresi` (`:6.1`): *giương (lọng) lên*; cả hai dùng chung một chữ Việt. (8) `Ito gantvā` (`:7.1`): *từ đây ra đi*, tức rời đời này; không thêm `mệnh chung`. (9) `Ādiyāme namassāmi` (`:16.1`): hiện tại `namassāmi` đi với quá khứ `upaṭṭhahiṁ` (`:16.4`); giữ nguyên hai thì như Pāli. (10) `revatānandapaṇḍito` (`:25.2`): `paṇḍito` có thể bổ nghĩa cho Ānanda (*Ānanda bậc trí*), cũng có thể là danh hiệu chung; dịch *Revata, Ānanda bậc trí*. (11) `Sakyānaṁ kulaketussa` (`:11.1`) sở hữu cách của *bậc cờ hiệu* chỉ Đức Phật, đứng trước `ñātibandhu` (`:11.2`); dịch theo thứ tự Pāli, người đọc nối thành *bà con thân tộc của bậc cờ hiệu dòng họ Sakya*.

