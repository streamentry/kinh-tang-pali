notes: |-
  **Ba blocker, bài phải ở `draft`.** Đây là bài nhiều lỗi nhất trong lô. Không sửa bản dịch.
  
  **Về tầng Anh.** Không có tệp Sujato cho `ja183`. Tôi cũng đã thử đối chiếu chéo trong chính corpus đã ghim và **không tìm được** tệp Việt nào dịch cùng câu kệ này, nên ba lỗi ngữ nghĩa dưới đây phải đứng vững bằng Pāli và bằng các parallel Pāli trong snapshot. Tôi ghi rõ điều đó ở từng lỗi.
  
  **Lỗi 1 — `1.2`, đã dẫn chứng ở trên.** Đáng nói: đây là vế kệ duy nhất trong bài nói về hậu quả của nghiện rượu, mà bản dịch đã làm mất đúng cái hậu quả đó. `gadrabha` xuất hiện đúng 5 lần trong snapshot đã ghim và **cả 5** đều nghĩa kẻ ăn xác / loài ăn xác (`ja120`, `ja536`, `mil3.7.1`, `mil7.2.1` ×2), nên không còn cách đọc nào khác.
  
  **Lỗi 2 — `2.3`, đã dẫn chứng ở trên.** `Dhorayhasīlī` là cách viết nữ của tính từ `Dhorayhasīla`; chữ `sīla` ở đây là "đạo đức/thói lề", và Dhorayha là tên một yêu tinh. Nên *"đạo đức bậc anh hùng"* không chỉ sai nghĩa mà còn **đảo**: câu kệ nói cảnh người đó **sinh ra trong nhà có đạo đức dữ dằng**, tức tiêu cực, còn bản dịch nói tích cực.
  
  **Lỗi 3 — mất tầng Anh.** Bài không có khoá thân đủ 40 ký tự nên bộ đo coverage báo `ratio = 1` và **không bắt được** sự mất tầng; tôi ghi blocker bằng kiểm tệp trực tiếp.
  
  **Một mất ngữa nghĩa nữa, không chặn.** Ở `1.4`, Pāli `Mado na sañjāyati sindhavānaṁ` — `sindhavāna` là chỉ người sống bên bờ sông Sindhu, tức nhóm hạ trần; bản dịch *thì người uống không hề say* bỏ hẳn `sindhavānaṁ`. Cùng hệ với lỗi 1: vế này nói **sẽ không sinh ra làm kẻ ăn xác khi ở bên sông Sindhu**, và nửa sau bị rơi mất. Tôi đã trừ ở `semantic_fidelity` và ghi ở đây để biên tập xử lý cùng lúc với lỗi `1.2`.
  
  **Phần đúng.** `Appaṁ pivitvāna nihīnajacco` → *Uống có chút ít, dù sinh ra hèn hạ* ✓ giữ được kẻp `appaṁ` (chút ít). `So majjatī tena janinda puṭṭho` → *vẫn say khi vua ấy hỏi* ✓ (`puṭṭho` là thế bị động nhưng cách dịch không ép sai). `Na majjatī aggarasaṁ pivitvā` → *không say dù đã uống rượu hương vị thượng vị* ✓.
  
  **Ngoặc kép cân** trong toàn bộ tệp: `1.1` mở, `1.4` đóng; `2.1` mở, `2.4` đóng ✓.
  
  **Tên phẩm:** `Asadisavagga` → *Phẩm Bất Thành Tựu* là biến thể **thứ năm** cho cùng một Pāli trong tầng (`ja181` *Vô Đối Đẳng*, `ja182`+`ja189` *Bất Bại*, `ja187` *Asadi*, `ja188` *Vua Không Ghen*, rồi `ja183` *Bất Thành Tựu*). Không chặn — vì repo đã phân mảnh sẵn — nhưng biên tập nên chọn một và gộp. `Dukanipāta` → *Bộ Hai Bài Kinh* là nhóm phổ biến nhất (`ja153`, `ja154`, `ja155`, `ja158`, `ja161`–`ja163`, `thag2`, `thig2`); khác `ja179`/`ja192` dùng *Tập Kẻ Đau Đớn* (6 tệp), và `iti28-49` dùng *Phẩm Hai Pháp* (22 tệp). Cả ba đều đang tồn tại trong tầng.
