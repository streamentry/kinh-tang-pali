notes: |-
  `Kaccānijātaka` (số 1) trong `Kaccānivagga`, `Aṭṭhakanipāta`. 41/41 khoá. Ba tầng tham khảo đều vắng (xem `blocking_errors`) ⇒ `draft`, `triangulation` 7.2.

  **Pāli trùng nguyên văn: 3/41 khoá**, đều ở khối tiêu đề: `0.1` theo 384:16 (*Jātaka*); `0.2` theo đúng lớp `ja` — `Aṭṭhakanipāta` có *Bộ Tám Bài Kinh* 3/3 ở `thag8`+`thig8` nhưng *Bộ Tám Bài Kệ* 2/2 ở `ja418`/`ja424`, và chuỗi *Bộ N Bài Kệ* đã đồng thuận tuyệt đối ở `Chakkanipāta` (16/16) và `Sattakanipāta` (14/14) ⇒ chọn *Bộ Tám Bài Kệ* như `ja418`/`ja424`; `0.3` theo 2/2 (*Phẩm Kaccānivagga*).

  **Chữ `Tilodano` giữ NGUYÊN CHÍNH TẢ NGUỒN, và đây là chọn có chủ đích.** Tên này xuất hiện ở `:1.4` và `:2.2` dưới dạng **`Tilodano`** (t không có dấu). Nếu viết `Tiḷodana` thì `_hvi.lọt_pāli` chặn vì từ có dấu Pāli mà Pāli của chính segment không có (so khớp diễn ra sau khi hạ chữ thường và so **nguyên văn**, nên `tiḷodano` ≠ `tilodano`). Bài lại **tự giải thích cái tên ngay kế bên** (`Piṭṭhā tilā dhovasi taṇḍulāni` — nghiền hạt tùng trên bếp lửa), nên giữ đúng chính tả nguồn là lựa chọn trung thực nhất; đã ghi để người điều phối không tưởng là lỗi gõ.

  **`mato` ở `2.3`, `3.2`, `4.2` — bất định thật, đã chọn và nói rõ.** `Dhammo mato` có thể là (A) *Chánh pháp đã chết* với `mato` = dạng quá khứ của `mī`, hoặc (B) *mẹ của ông ấy đã tuyên* với `mato` = *mẹ* (chữ `māto`). Đo trên tầng `kn` đã dịch: **9/9** bản dịch hiện có đọc `mato` là *chết*, **0** bản nào đọc là *mẹ*; và (B) không đọc được ở `3.2` vì câu `ko nu taveva saṁsi` không có danh từ làm chủ ngữ. Đã chọn (A): *Chánh pháp đã bị tuyên là đã chết*, và giữ nguyên `Dhammo` làm chủ ngữ ở cả ba khoá. Cách hiểu này khớp mạch bài: Tiḷodana cho hết của, bố ấy tự tuyên giới hạn phước làm đã hết, nên bố ấy sinh lại làm rắn và cầu xin đổi phúc.

  **Còn đọc khác đã ghi, không bịa.** `7.4`/`:8.4`/`:9.2` `gharam āvase-` đọc là "cùng về ở trong nhà" (`-ema`/`-etha`/`-ittha` lần lượt là 3 đại từ số ít/hóa từ số nhiều, nghĩa là ba bài kệ nói cùng một việc); `kātiyāni` giữ Pāli là *Khattiyāni* vì tầng đã dùng chính tên này; `9.4` `Devānamindena adhiggahītā` = nơi cư ngụ bị vua trời cướp mất, dịch theo nghĩa `adhiggahītā` (bị cướp) chứ không theo nghĩa "bị bắt".

  **Lỗi bắt ở lượt review đối kháng:** bản nháp để dính dấu nháy kép và xuống dòng ở `5.4`/`6.4` (lỗi kỹ thuật), và `9.3` `Putto ca nattā ca upaṭṭhahiṁsu` bản nháp dịch *đã dựng lên* — sai sắc thái, `upaṭṭṭhahāti` là **đứng dậy**; đã sửa thành *đều đã đứng dậy*.

  **Dấu lược:** không segment nào có `…pe…`; cả hai phía 0.

  `npm run validate|test|check|build` không chạy (BRIEF cấm); `technical_integrity` = 9.6 vì các chốt tự động đã xanh và cổng `npm` chưa chạy.

  **Lượt cải thiện 2026-10-13** (đọc đối kháng từng khoá với Pāli; sửa 36/41 khoá, tức toàn bộ `1.1`–`9.4`; 5 khoá tiêu đề `0.1`–`0.4`, `10.1` được rà lại và giữ nguyên — đo tiền lệ `Kinh <tên>` 513 so với `Kinh <tên>jātaka` 34 trên tầng `ja`). Các đoạn ghi chú ở trên về `Tilodano`, `Suṇisā`, `mato` và `9.3`/`9.4` đã bị thay thế bởi các điểm dưới đây; bản trước có lỗi nghĩa nghiêm trọng mà lượt chấm trước không bắt được.

  - **`Tilodano` không phải tên người** mà là danh từ chung *tila* (mè) + *odana* (cơm) = *cơm mè* (món cúng người chết); câu tự giải thích bằng `Piṭṭhā tilā dhovasi taṇḍulāni` (mè đã nghiền, bà vo gạo). Sửa `1.4`, `2.2` thành *cơm mè*; bản trước dịch `tilā` là "hạt tùng" (sai — *mè*, đã có tiền lệ ở `dn22:5.3`, `mn126:15.1`, `mn119:7.6`) và giữ "Tilodano" như tên riêng vì né cổng Pāli-lọt, nay không còn cần.
  - **`Suṇisā` là danh từ chung *con dâu*, không phải tên nữ thần** (`mn28:10.5`, `mn37:10.1`, `dn16:5.21.1` đều là *con dâu*). Sửa `5.1`, `7.3`, `8.3`, `9.1`. Kéo theo `nattā` = *cháu trai* (không phải "mẹ") và `putto` = *con trai* của Kaccāni; bản trước ở `7.3`, `8.3` dịch thành "ta là người con, bà Suṇisā là mẹ" — sai người, sai quan hệ.
  - **Người nói đã sắp lại:** `1` Sakka cải trang Bà-la-môn hỏi; `2`, `4`, `5`, `7` Kaccāni; `3`, `6`, `8` Sakka (`6.2` `Taveva atthāya idhāgatosmi` đối ứng `7.2` `Mameva atthāya idhāgatosi`); `9` lời dẫn kết. `7.1`–`7.2` là lời Kaccāni gọi *devarāja*; bản trước gán lẫn.
  - **`Dhammo`** đổi từ *Chánh pháp* sang *Pháp*: đo trên toàn tầng `ja`, các khoá Pāli ngắn có `dhammo` thì *pháp/Pháp* chiếm đa số (50 so với 13 *Chánh pháp*); `ja422:1.1` cùng phẩm dịch *pháp*. Câu `mato` = *đã chết* giữ như bản trước (`na miyyatī` ở `3.4` cùng gốc `mī`; hợp mạch: bà tin Pháp đã chết vì kẻ ác nay được sướng, `4.3`–`4.4`).
  - Sửa chủ ngữ/tân ngữ: `2.1` *việc này không phải để ăn*; `4.1`–`4.2` tách `Daḷhappamāṇaṁ` (bằng chứng vững) khỏi `natthi mamettha kaṅkhā` (không nghi ngờ) — bản trước dịch "đo lường chẳng đúng" ngược nghĩa; `4.3`–`4.4` `Yeyeva ... pāpā` / `Te teva ... sukhitā` = *chính những kẻ nay là ác nhân, chính họ nay được sung sướng* (bản trước "chính chỗ ấy họ mới được an ổn" sai); `5.2` `vadhitvāna` = *đánh* (không phải "nắm tay"); `8.2` `Hatāpi santā` = *dù bị đánh* (không phải "bậc thiện thế … bị giết"); `9.3` `upaṭṭhahiṁsu` = *hầu hạ* (đo: `mn26:24.5`, `tha-ap292:2.3` là *chăm sóc/hầu hạ*) — sửa lại cả cái "đứng dậy" mà notes trước ghi như lỗi đã bắt; `3.3` `Sahassanetto` = *Ngàn Mắt* (`sn11.9:2.3`, `thi-ap35:18.4`), không phải "nghìn tai"; `9.1` `Kātiyānī` giữ đúng Pāli (bản trước đổi thành *Khattiyāni*, không có căn cứ).
  - **`karomi bhasmaṁ`** `6.4` = *biến thành tro* (đã có `mn56:13.15`).
  - **Bất định còn lại, không bịa:** (1) `3.3`–`3.4` `Sahassanetto atulānubhāvo … dhammavaro` — có thể hiểu là hai câu (Sakka tự xưng `Sahassanetto`, rồi nói *Pháp tối thượng không chết*, cách hiểu đã chọn) hoặc một chủ ngữ duy nhất (*bậc Ngàn Mắt, uy lực vô song, tối thượng về Pháp, không bao giờ chết*); `6.1` `Jīvāmi vohaṁ na matohamasmi` ủng hộ cách hiểu sau, nhưng không phân xử được vì không có bản Anh ghim. (2) `2.3` `tassa pahuttamajja` — *pahutta* ở đây là *dồi dào/đủ đầy*, đối tượng `tassa` là `Dhammo`; `pahutta` không có tiền lệ trên tầng đã dịch (0 khoá). (3) `1.2` `kumbhimadhissayitvā` hiểu *đặt nồi lên* (bếp); Pāli có thể đọc sát nghĩa hơn là *nằm lên*. (4) `9.4` `adhiggahītā` — gồm tính từ số nhiều cho `putto ca nattā ca` (cách hiểu đã chọn: con trai và cháu trai bị Sakka chế ngự rồi hầu hạ), nhưng ngữ pháp cũng cho phép đọc nó là nữ số ít chỉ `kātiyānī` (bà được Sakka nắm giữ/che chở). `adhigaṇhāti` chỉ có tiền lệ khác nghĩa (`iti27:3.1`, *vượt trội*). (5) `4.1` `brahme` hiểu là *Bà-la-môn* (Sakka cải trang), không phải *Phạm thiên*. (6) `5.1` `vañjhā` dịch *son sẻ* (không có tiền lệ cùng nghĩa; các khoá `vañjha` khác ở dn/mn/sn là *cằn cỗi* cho vật vô tri).
  - **Điểm đổi:** `semantic_fidelity` 8.8 → 8.6, `terminology` 8.9 → 9.0, `vietnamese_clarity` 9.0 → 8.9; `grammar_logic` 8.8 giữ; các tiêu chí còn lại giữ. `semantic_fidelity` hạ vì bản trước (điểm 8.8) vốn có nhiều lỗi nghĩa mà lượt trước không phát hiện và vì còn các bất định ở trên; nâng `terminology` vì *tila*, *odana*, *suṇisā*, *nattā*, *Dhammo* nay khớp tiền lệ. Tầng tham khảo vẫn vắng nên `triangulation` giữ 7.2: bản dịch tiếng Anh của bài này chỉ được đọc để hiểu cách hiểu bất định ở trên, không được đưa vào bản dịch, và không phải tầng đã ghim.
  - Phép kiểm: 41/41 khoá, thứ tự khoá theo Pāli, nháy `“”‘’` khớp Pāli từng khoá (41 khoá), NFC, 0 khoá chứa chữ Pāli lạ, 0 cặp Pāli trùng nguyên văn trong chính bài, 0 `…`/`…pe…`. `npm run validate|test|check|build` chưa chạy.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 13 khoá chênh lệch lớn nhất (đọc thêm đối kháng cả 41 cặp Pāli↔Việt) → khác nghĩa 3: sửa 0, giữ 0, bất định 3, đều là chỗ đã ghi ở mục bất định lượt 2026-10-13. `1.2` `kumbhimadhissayitvā` (bản mù *làm gì với chiếc nồi*, bỏ phần *đặt lên* và ghi không chắc); `2.3` `pahuttamajja` (bản mù thêm chủ ngữ *tôi chuẩn bị* mà Pāli không có và ghi không chắc; giữ không thêm); `9.4` `Devānamindena adhiggahītā` (bản mù *được vua chư thiên che chở*, bản dự án *bị vua chư thiên chế ngự*; `adhiggahītā` đọc được là số nhiều chỉ con trai và cháu, hoặc nữ số ít chỉ Kātiyānī; bản mù chọn cách đọc nữ số ít; chưa phân xử được). `3.2` bản mù *với riêng bà* chỉ nhấn `eva`, không đổi nghĩa; `8.1` giữ *Kātiyāni* đúng dạng hô cách của Pāli (bản mù *Kātiyānī*). Còn lại chỉ khác diễn đạt (*nàng*/*bà*, *hạnh phúc*/*sung sướng*, *ruồng bỏ*/*vứt bỏ*). `3.3`–`3.4` `Sahassanetto` bản mù không khác bản dự án. Không đổi khoá nào. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt; không có bản nguyên bài; quét Pāli trùng toàn kho: chỉ 6.2 có song song ja537:27.3, cùng nghĩa): sửa 1 khoá — 6.4 thiếu tân ngữ: `yā … karomi bhasmaṁ` là "kẻ nào… ta (sẽ) biến kẻ ấy thành tro", bản cũ "ta biến thành tro cùng với đứa con ấy" đọc như chính "ta" hoá tro; đổi "ta sẽ biến ả thành tro cùng với đứa con ấy" (`karomi` hiện tại mang nghĩa sắp làm). Giữ các khoá còn lại. Bất định giữ nguyên: `kumbhimadhissayitvā` (1.2), `pahuttamajja` (2.3), `adhiggahītā` (9.4). Lệch chéo (không sửa, báo người biên tập): 0.3 "Phẩm Kaccānivagga" lặp "Phẩm … vagga", nhưng cả 9 bài ja417–ja425 đều ghi vậy; cần sửa đồng loạt thành "Phẩm Kaccāni".

  Quyết định hội đồng biên tập 2026-10-16: A13 — 0.3 ("Phẩm Kaccānivagga" thành "Phẩm Kaccānī", bỏ chữ phẩm lặp); C3 — `0.2` (tên nipāta "Nhóm N Kệ").
