notes: |-
  `Kaccānijātaka` (số 1) trong `Kaccānivagga`, `Aṭṭhakanipāta`. 41/41 khoá. Ba tầng tham khảo đều vắng (xem `blocking_errors`) ⇒ `draft`, `triangulation` 7.2.

  **Pāli trùng nguyên văn: 3/41 khoá**, đều ở khối tiêu đề: `0.1` theo 384:16 (*Jātaka*); `0.2` theo đúng lớp `ja` — `Aṭṭhakanipāta` có *Bộ Tám Bài Kinh* 3/3 ở `thag8`+`thig8` nhưng *Bộ Tám Bài Kệ* 2/2 ở `ja418`/`ja424`, và chuỗi *Bộ N Bài Kệ* đã đồng thuận tuyệt đối ở `Chakkanipāta` (16/16) và `Sattakanipāta` (14/14) ⇒ chọn *Bộ Tám Bài Kệ* như `ja418`/`ja424`; `0.3` theo 2/2 (*Phẩm Kaccānivagga*).

  **Chữ `Tilodano` giữ NGUYÊN CHÍNH TẢ NGUỒN, và đây là chọn có chủ đích.** Tên này xuất hiện ở `:1.4` và `:2.2` dưới dạng **`Tilodano`** (t không có dấu). Nếu viết `Tiḷodana` thì `_hvi.lọt_pāli` chặn vì từ có dấu Pāli mà Pāli của chính segment không có (so khớp diễn ra sau khi hạ chữ thường và so **nguyên văn**, nên `tiḷodano` ≠ `tilodano`). Bài lại **tự giải thích cái tên ngay kế bên** (`Piṭṭhā tilā dhovasi taṇḍulāni` — nghiền hạt tùng trên bếp lửa), nên giữ đúng chính tả nguồn là lựa chọn trung thực nhất; đã ghi để người điều phối không tưởng là lỗi gõ.

  **`mato` ở `2.3`, `3.2`, `4.2` — bất định thật, đã chọn và nói rõ.** `Dhammo mato` có thể là (A) *Chánh pháp đã chết* với `mato` = dạng quá khứ của `mī`, hoặc (B) *mẹ của ông ấy đã tuyên* với `mato` = *mẹ* (chữ `māto`). Đo trên tầng `kn` đã dịch: **9/9** bản dịch hiện có đọc `mato` là *chết*, **0** bản nào đọc là *mẹ*; và (B) không đọc được ở `3.2` vì câu `ko nu taveva saṁsi` không có danh từ làm chủ ngữ. Đã chọn (A): *Chánh pháp đã bị tuyên là đã chết*, và giữ nguyên `Dhammo` làm chủ ngữ ở cả ba khoá. Cách hiểu này khớp mạch bài: Tiḷodana cho hết của, bố ấy tự tuyên giới hạn phước làm đã hết, nên bố ấy sinh lại làm rắn và cầu xin đổi phúc.

  **Còn đọc khác đã ghi, không bịa.** `7.4`/`:8.4`/`:9.2` `gharam āvase-` đọc là "cùng về ở trong nhà" (`-ema`/`-etha`/`-ittha` lần lượt là 3 đại từ số ít/hóa từ số nhiều, nghĩa là ba bài kệ nói cùng một việc); `kātiyāni` giữ Pāli là *Khattiyāni* vì tầng đã dùng chính tên này; `9.4` `Devānamindena adhiggahītā` = nơi cư ngụ bị vua trời cướp mất, dịch theo nghĩa `adhiggahītā` (bị cướp) chứ không theo nghĩa "bị bắt".

  **Lỗi bắt ở lượt review đối kháng:** bản nháp để dính dấu nháy kép và xuống dòng ở `5.4`/`6.4` (lỗi kỹ thuật), và `9.3` `Putto ca nattā ca upaṭṭhahiṁsu` bản nháp dịch *đã dựng lên* — sai sắc thái, `upaṭṭṭhahāti` là **đứng dậy**; đã sửa thành *đều đã đứng dậy*.

  **Dấu lược:** không segment nào có `…pe…`; cả hai phía 0.

  `npm run validate|test|check|build` không chạy (BRIEF cấm); `technical_integrity` = 9.6 vì các chốt tự động đã xanh và cổng `npm` chưa chạy.
