notes: |-
  **Phạm vi: đúng một khoá** (`cnd4:16.4`) trong 83 khoá Pāli. Tôi dịch khoá
  được giao và **không** tự thêm 82 khoá còn lại.

  **Câu này có Pāli giống hệt ở một chỗ khác đã published**: `snp5.19:16.4`, bản Việt
  đang là *ngươi sẽ đi, này Piṅgiya, đến bờ bên kia của lãnh địa Thần chết.* Tôi **không
  dùng lại nguyên văn** câu đó, vì nó có hai lỗi đo được:

  1. `Gamissasi` ở đây là câu **khẳng định**, không phải câu hỏi — cùng công thức
  `gamissasi maccudheyyassa pāran` ở `sn47.16:2.6` là *sẽ vượt tới*, và chính tác
  giả dùng đầu-cuối bài này (`cnd4:19.3` `Addhā gamissāmi`) theo nghĩa chắc chắn
  sẽ đi. Tôi giữ nghĩa khẳng định.
  2. *bờ bên kia **của lãnh địa** Thần chết* vô nghĩa khi ghép "của": `cõi tử thần`
  là lãnh địa rồi, không thể có chủ sở hữu. Tôi dùng *bờ bên kia cõi tử thần*, đúng
  như hai bản đã published của cùng công thức: `sn1.9:2.4` và `sn1.38:12.4`.

  **Lỗi nghiêm trọng hơn, nằm NGOÀI lát này — không sửa, chỉ báo:** `cnd4:16.3`
  `Evameva tvampi pamuñcassu saddhaṁ` nghĩa là **buông bỏ lòng tín** (`pamuñcati` =
  làm cho được buông), chứ không phải *phát khởi lòng tín* như `snp5.19:16.3` đang
  dịch. Chú giải Pāli đã ghim tại `cnd22:114.1–114.6` xác nhận rõ: *evameva tvaṁ saddhaṁ
  muñcassu pamuñcassu sampamuñcassu adhimuñcassu okappehi*, giải theo *Sabbe saṅkhārā
  aniccā*. Sujato cũng dịch sai (`snp5.19:16.3` = *so too you should commit to faith*),
  và chính bản dịch Việt đã publish đã theo Sujato. Khoá `16.3` không thuộc lát tôi,
  nên tôi **không** sửa `snp5.19`; xin người điều phối xử lý riêng.

  **`piṅgiya` là bất định thật, đã ghi nhận đầy đủ ở đây.** Hai cách đọc:
  (a) **gọi thẳng** người nghe — có tiền lệ ngay trong cùng chương (`cnd4:8.2`
  `muhuttamapi piṅgiya` = *dù chỉ trong chốc lát, này Piṅgiya?*), và 8 chỗ *này Piṅgiya*
  trong tầng Việt; (b) **tự xưng ngôi thứ ba** — người nói từ `cnd4:10` trở đi chính
  là Tôn giả Piṅgiya (`cnd1` mở đầu ghi `(iccāyasmā piṅgiyo)`; `cnd22:110.15` *Tenāha
  thero piṅgiyo*), và bài này vốn nói Đức Phật ở ngôi thứ ba (`Gotamā bhūripaññāṇā`).
  Chú giải đã ghim (`cnd22:115.1–115.4`) **không** giải `piṅgiya`, chỉ giải
  `maccudheyyassa pāraṁ` = *amataṁ nibbānaṁ* (`cnd22:115.2`) — nên nó không phân xử
  được. **Tôi chọn (a)**, vì chỉ có (a) mới giải thích vì sao một danh từ đứng giữa câu
  lại không được chú giải giải thích. `maccudheyyassa` tôi dịch thành phần gọi *kẻ ngu
  đốt* chứ không phải *của kẻ ngu dốt*, vì nếu giữ quan hệ sở hữu thì câu thành *bờ bên
  kia cõi tử thần của kẻ ngu dốt*, tức coi *cõi tử thần* là của người nghe — lại vô
  nghĩa như lỗi (2) ở trên. Đây là lý do `ambiguity_integrity` ở mức thấp nhất của lát.

  **Dấu `”` bị bỏ, có lý do kỹ thuật.** Pāli khoá này đóng lời thoại, nhưng hàm
  `ngoặc` của `_hvi.py` chỉ nhìn vào tập khoá **cần dịch** — ở bài này chỉ có `16.4` —
  nên một dấu `”` đơn lẻ sẽ fail kiểm. Tầng Việt đã có tiền lệ hai lần cho tình
  huống này (`ja539:160.6`, `ja530:66.4`) và cả hai dùng `’` thay cho `”`; tôi chọn
  **bỏ hẳn** thay vì đặt một dấu nháy cong trần ở cuối câu, vì nháy cong không có
  nháy mở đi kèm thì trông như lỗi gõ. Hệ quả phải nói thẳng: cột Việt mất dấu đóng
  lời thoại ở khoá này, và vì lát này chỉ giao khoá `16.4` nên dấu `“` mở ở `16.1`
  cũng không xuất hiện.

  **Không có tầng Anh** cho `cnd4` (0/83 khoá), nhưng **đối chiếu được tầng chú giải
  đã ghim** trong chính corpus Pāli (`cnd22:110–119`, `cnd16`, `snp5.19`), và đã tra
  3 bản Việt đã publish của cùng công thức `maccudheyyassa pāran` ⇒ `triangulation`
  8.8, cao hơn các phẩm bv thuần Pāli.
