notes: |-
  **Phạm vi: đủ 83/83 khoá của cnd4.** Trước lượt này tệp chỉ có một khoá (`cnd4:16.4`, bản của lát cũ). Lượt này dịch 82 khoá còn lại và **thay luôn khoá `16.4`** vì bản cũ sai (xem mục dưới). Không có khoá nào ngoài tập khoá Pāli. Không khoá nào có `…` hay `(…)` trần: Pāli của bài không có dấu lược.

  **Bài này là phần "Kệ Tiếp Theo Phẩm Bờ Kia" của Cūḷaniddesa, trùng gần như nguyên văn với `snp5.19:1.1–19.4`.** Đối chiếu từng khoá cùng vị trí: 74/83 khoá có Pāli giống hệt `snp5.19`; 5 khoá chỉ khác chính tả Pāli (`5.1` Yeme/Ye me, `15.2` upallaviṁ/upaplaviṁ, `18.2` paroparaṁ/varovaraṁ, `16.3` Evameva/Evamevaṁ, `6.1` tamonudāsino/tamanudāsino); 4 khoá là nhãn và colophon (`0.1`–`0.3`, `19.5`). Trong 74 khoá trùng Pāli, bản Việt **dùng lại nguyên văn `snp5.19` ở 68 khoá** và **khác ở 6 khoá** (`1.3`, `2.4`, `5.3`, `12.3`, `16.1`, `16.4`); ba khoá khác chính tả (`5.1`, `15.2`, `18.2`) vẫn dùng lại câu của `snp5.19`. Lý do khác từng khoá ghi dưới đây. Trong chính bài: 5 nhóm Pāli trùng (`7.1=11.1`, `7.2=9.2=11.2`, `7.3=9.3=11.3`, `7.4=9.4`, `8.3=10.3`) và cả 5 nhóm có bản Việt giống hệt nhau; `9.1` (`te`, ngươi) khác `7.1`/`11.1` (`me`, con) đúng theo Pāli.

  **Sáu khoá khác `snp5.19`, và vì sao (đối chiếu Pāli, chú giải đã ghim trong corpus `cnd22`, và bản Anh Sujato của chính `snp5.19`, nơi Pāli giống hệt):**

  1. `1.3` `Yathāddakkhi tathākkhāsi`: `addakkhi` và `akkhāsi` là aorist **ngôi thứ ba**. Chú giải `cnd22:3.1` giải `yathā addakkhi tathā akkhāsi ācikkhi desesi paññapesi…` (chủ thể là Đức Phật), và Sujato dịch `taught as it was seen by the immaculate one`. Chủ thể của `1.3–1.5` là Đức Thế Tôn, rồi `1.6` hỏi *vì sao ngài lại nói dối*. Bản `snp5.19:1.3` dịch *đúng như con đã thấy, con sẽ nói lại* (ngôi thứ nhất, tương lai) là **lệch ngôi và thì**, nên tôi không dùng lại. Lỗi đó nằm ngoài lát này, **báo, không sửa**.
  2. `2.4` `giraṁ vaṇṇūpasañhitaṁ`: `vaṇṇa` ở đây là lời ca ngợi (Sujato: `sweet words of praise`); chú giải `cnd22:15.4` giải `vaṇṇena upetaṁ…vācaṁ giraṁ`. Bản `snp5.19:2.4` dịch *lời nói đầy đủ phẩm hạnh*, nghĩa lệch khỏi `vaṇṇa` = tán thán. Tôi viết *lời nói gắn liền với sự ca ngợi*.
  3. `5.3` `Iccāsi iti bhavissati`: Pāli **không có dấu nháy**, nên tôi không đặt `‘…’` như `snp5.19:5.3` (tránh thêm dấu mà Pāli không có), mà nối lời thuật bằng *rằng* sau `5.1–5.2`.
  4. `12.3` `Namassamāno vivasemi rattiṁ`: `vivasati` là *trải qua (thời gian)*, Sujato `I spend the night in homage`. *Thức suốt đêm* ở `snp5.19:12.3` thêm ý *thức* mà Pāli khoá này không có. Tôi viết *con trải qua đêm*.
  5. `16.1` `muttasaddho` và `16.3` `pamuñcassu saddhaṁ`: xem mục bất định bên dưới.
  6. `16.4`: xem mục riêng.

  **`6.1` `Eko tamonudāsino` khác `snp5.19:6.1` ở chỗ Pāli khác chính tả, và tôi thêm *ngồi*.** `tamonuda` + `āsīno`; chú giải `cnd22:49.2` giải `Āsīno ti nisinno bhagavā pāsāṇake cetiye`, và `cnd22:51.1–3` dẫn thêm nghĩa *ngồi*. Bản `snp5.19:6.1` và Sujato (`Alone, the dispeller of darkness`) đều bỏ `āsīno`. Chữ *ngồi* có căn cứ chú giải; người biên tập muốn khớp tuyệt đối với `snp5.19` thì xoá *ngồi*.

  **Khoá `16.4` đã sửa — bản cũ sai.** Bản trước ghi *Ngươi kẻ ngu dốt, này Piṅgiya, sẽ đi đến bờ bên kia cõi tử thần* và giải thích `maccudheyyassa` là *kẻ ngu dốt* gọi trực tiếp. Pāli `maccudheyyassa pāraṁ` là *bờ bên kia của cõi (lãnh địa) tử thần*: chú giải `cnd22:115.1–2` giải `maccudheyyaṁ vuccanti kilesā ca khandhā ca abhisaṅkhārā ca` và `maccudheyyassa pāraṁ` = `amataṁ nibbānaṁ`; `maccudheyya` **không** có nghĩa *ngu dốt* ở bất kỳ chỗ nào. Hai bản đã published cùng công thức (`sn1.9:2.4`, `sn1.9:3.4`) dùng *bờ bên kia cõi tử thần*, nên tôi viết *ngươi sẽ đi, này Piṅgiya, đến bờ bên kia cõi tử thần.* `Piṅgiya` là **hô cách** (như `cnd4:8.2` *này Piṅgiya*), vì đây là lời Đức Phật nói với Tôn giả Piṅgiya. Dấu `”` đóng lời thoại được khôi phục khớp Pāli (bản cũ bỏ vì lát cũ chỉ có một khoá).

  **Bất định thật — `muttasaddho` / `pamuñcassu saddhaṁ` (`16.1`, `16.3`).** `pamuñcati` có nghĩa gốc *thả ra, buông ra* (tiền lệ `sn2.9:4.3` `Rāhu hãy thả Mặt Trăng ra`). Với lòng tín, chú giải `cnd22:114.1` giải `saddhaṁ muñcassu pamuñcassu sampamuñcassu adhimuñcassu okappehi`, tức *trao hết, quyết định, đặt trọn lòng tin*, và giải `muttasaddho` bằng `saddhādhimutto` (`cnd22:113.1`). Sujato: `committed to faith` / `commit to faith`. Tôi chọn *phó thác lòng tín*, giữ cả ba điểm: có đối tượng là lòng tín, không phải *buông bỏ* (bản lát cũ từng đề nghị *buông bỏ*: không dùng được, vì sẽ thành *bỏ lòng tín*), và không phải *phát khởi* như `snp5.19:16.3` (`pamuñcati` không có nghĩa *làm cho phát sinh*). Đây là chỗ chưa chắc hoàn toàn nên `ambiguity_integrity` ở 8.8. Lỗi nằm trong `snp5.19:16.1` (*tín thành giải thoát*) và `16.3` (*phát khởi*) — ngoài lát, **báo, không sửa**.

  **Hai quy ước giữ như `snp5.19`:** `Gotamā` (`8.3`, `10.3`) dịch *Khỏi Gotama* theo ablative và theo `snp5.19`; `Vimalo` dịch *bậc vô nhiễm*, đúng như `snp5.19:1.4`. Cả hai chỉ là lựa chọn diễn đạt, không ảnh hưởng nghĩa.

  **Tên tác phẩm.** `0.1` `Cūḷaniddesa` → *Tiểu Tập Kể Lược* (đúng `cnd3:0.1`; `cnd1` cũng dùng); `0.2` `Pārāyanavaggagāthā` → *Phẩm Bờ Kia* (đúng `cnd3:0.2`); `0.3` `4. Pārāyanānugītigāthā` → *4. Kệ Tiếp Theo Phẩm Bờ Kia*, theo `snp5.19:0.2` (*Kệ Tiếp Theo Phẩm Bờ Kia*) và theo kiểu đánh số của `cnd3:0.3`. `19.5` `Pārāyanānugītigāthā niṭṭhitā` → *Kệ Tiếp Theo Phẩm Bờ Kia đã hết.*, đúng kiểu colophon `snp3.11:20.5` (*Kệ dẫn nhập đã hết.*).

  **Không có số Pāli** trong bài (không `sahassa`, `sata`, `navuti`…) nên phép kiểm số chạy trên mẫu số 0: không đo được gì, và không có số nào cần phân xử.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root `root/pli/ms/sutta/kn/cnd/cnd4_root-pli-ms.json`, 83 khoá. Mẫu số coverage theo công thức (khoá Pāli ≥ 40 ký tự, bỏ khối `:0`) chỉ là **1 khoá** (`cnd4:16.4`), vì bài gồm các dòng kệ ngắn; nên cổng coverage đo trên mẫu số 1 và gần như không đo được gì về tầng tham khảo của 82 khoá còn lại, đây là đặc điểm của ngưỡng chứ không phải tầng tham khảo có phủ các khoá đó. Bản Anh Sujato của `cnd4` **không có** (0/83 khoá, `not-published-upstream`); `english-project` cũng không có; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ **blocker thật** `noEnglishEditionUpstream`, `triangulation` **8.0** (không nâng), `status: draft`. Triangulation 8.0 chứ không thấp hơn vì có hai bằng chứng độc lập trong chính corpus: (a) Pāli giống hệt `snp5.19` mà Sujato **có** dịch, dùng để phân xử ngôi và nghĩa ở `1.3`, `2.4`, `12.3`, `16.1`, `16.3`; (b) chú giải Pāli đã ghim `cnd22:1–125` giải từng câu kệ. Nhưng (a) là bản Anh của **bài khác** nên không tính là đối chiếu English cho cnd4.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì bị cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0. Các phép tự kiểm đã chạy và đều xanh: tập khoá bản Việt = tập khoá Pāli (83/83, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` và dấu lược `…` khớp Pāli từng khoá (0/83 lệch); 0 khoá rỗng; NFC; không khoảng trắng thừa; không Pāli lọt sang Việt ngoài tên riêng.
