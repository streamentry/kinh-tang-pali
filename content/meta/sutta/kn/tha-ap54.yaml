  BẤT ĐỊNH (ghi ở đây, không giải thích trong thân kinh):
  (1) `Ubbiddhaṁ selamāruyha,` (1.1) — `selamāru` là tên núi (Gandhamādana). Tôi dịch *núi Kỳ
      Quê*. **Đo được 0 tiền lệ** trong tầng: không có bản Việt nào cho `selamāru`, và cũng
      không có `Gandhamādana` hay `Kỳ Quê` ở bất kỳ đâu trong `content/`. Đây là lựa chọn của
      tôi theo tên Việt thông dụng của núi ấy, cần người biên tập xác nhận.
  (2) `padumuttaranāyako;` (5.2) — có hai cách đọc: (a) danh từ chung `padumuttara` = *bậc đã vượt
      qua bến nước bùn* + `nāyaka` = *bậc dẫn đường*; (b) tên riêng **Padumuttara** + `nāyaka`.
      Tầng có cả hai dạng: `Padumuttara` là tên Đức Phật quá khứ (tha-ap53:1.1 *Của Đức Phật
      Padumuttara*) nhưng cũng xuất hiện như danh từ. Tôi chọn (a) và dịch *bậc dẫn đường qua
      vùng nước bùn*; nếu biên tập chọn (b) thì `5.2` phải sửa thành *bậc Dẫn Đường
      Padumuttara*.
  (3) `Migarājāvasambhīto,` (4.3) — `Migarāja` là tên vua (miga = thú). Tôi dịch *đã gặp vua
      của loài thú* theo đúng tiền lệ ja295:1.3 và ja308:1.3, thay vì giữ `Migarāja` là tên
      riêng, để tránh đưa chữ Pāli có dấu vào bản Việt. Hệ quả: tên riêng bị dịch nghĩa —
      người biên tập có thể muốn giữ tên.
  (4) `caturo rāmanāmakā;` (11.2) — `rāmanāmakā` = *có tên là Rāma*. Trong vũ trụ Theravāda
      `Rāma` cũng là một loài thiên thần, nhưng ở đây bốn vị ấy tiếp theo là Chuyển Luân Vương
      nên là người tên Rāma. Tôi dịch *có bốn vị mang tên là Rāma*. **Đo được 0 tiền lệ** cho
      `rāmana` trong tầng.
  (5) `pabhā niddhāvate mama.` (9.4) — `pabhā` = *danh tiếng / uy tín / ánh sáng*; tôi dịch
      *danh tiếng*. Không có tiền lệ đo được cho `pabhā` trong tầng. Cũng không tiền lệ cho
      `cakkhumā` ở `4.4`, tôi dịch *kẻ có mắt* (theo `Bậc Có Mắt` ở dn20:6.10).
  (6) `jhāyī` ở `10.2` lấy theo `content/glossary/pali-vi.yaml` (`preferred: chuyên tu thiền
      định`); `jhānarato` không có mục glossary, tôi dịch *ưa thích sự tịch lặng*.
  (7) `imā gāthā abhāsatha.` ở `5.4` — `abhāsatha` là thế động/cầu mệnh (*xin hãy đọc*),
      nhưng tiền lệ 4× trong tầng đều dùng thì quá khứ *đã nói những bài kệ này*, và sibling
      tha-ap53:3.4 cũng vậy ngay trước khi bài kệ bắt đầu. Tôi theo tiền lệ; người biên tập
      có thể muốn đổi sang *xin hãy đọc bài kệ này* cho cả bài.
  
