notes: |-
  Dukanipāta là Tập Kẻ Đau Đớn (đa số 30 bài), Ruhakavagga là Phẩm Thằn Lằn (5 bài đã
  có, hai bài kia dùng Dây Leo và Dây Cung). Tên bài giữ nguyên Pāli theo ja102, ja106.
  rūpavatī có đúng một tiền lệ, sn5.4:2.1 dịch là xinh đẹp, và sīlavatī có tiền lệ
  an4.53:8.3 có giới. Bản nháp tôi viết là xinh đẹp, nhưng Pāli ở đây là siyā, là câu
  cầu mong, nên Xin hãy xinh đẹp không phải tiếng Việt; tôi đổi sang có dung mạo và
  ghi lại ở đây. Người đọc hiểu ngay và không mất nghĩa.
  Bất định: dubbhago ở 2.2. sn4.7:2.2 dịp dubbhago là kẻ cùng khổ, tức nghĩa chia sẻ
  khổ, khác hẳn nghĩa ở đây. Tôi đọc dubbhago là hạng người khó gả con gái, và dịch
  người nam sẽ khó gả con gái. Bản nháp tôi viết khó cho được, sát nghĩa chữ hơn nhưng
  người đọc không hiểu; đây là nghĩa của chữ chứ không phải tôi thêm ý, nên tôi giữ
  bản đã sửa. saddahāmi dịch Tôi tin thật, có tiền lệ an5.135:4.2 ta tin vào.
  Kāḷakaṇṇī trong Pāli viết thường, nhưng là tên riêng nên tôi viết hoa, giữ nguyên
  dạng Pāli; Sirī cũng vậy. kudācanan dịch chưa bao giờ, khớp ja28:1.2.
  Kỹ thuật: 13/13 khoá, không rỗng, thứ tự khớp Pāli, NFC, nháy kép mở ở 1.1 và 2.1
  đóng ở 1.4 và 2.4 y hệt Pāli, không dấu lược. save_vi sạch và idempotent. Không
  chạy npm run validate|test|check|build nên technical_integrity 9.5.
