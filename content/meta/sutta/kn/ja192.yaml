  (đoạn "Câu hỏi về may và rủi"; không đọc được trọn đoạn do trang bị cắt); Ānandajoti, bản dịch kệ và
  chú giải Jātaka,
  https://ancient-buddhist-texts.net/Texts-and-Translations/Jatakagathavannana/192.htm; đã đối chiếu
  1.1–1.4, 2.1–2.4; sửa 1.1–1.3 (`siyā` là thức mong đợi "giả sử", bản cũ "hãy có" nghe như mệnh
  lệnh); bất định chú giải giải thích `na samenti` bằng hai ví dụ; bản Việt giữ "không bao giờ gặp
  nhau".
