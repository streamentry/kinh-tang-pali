notes: |-
  **Hai blocker, bài phải ở `draft`.** Không sửa bản dịch.
  
  **Lỗi 1 — `1.4` đảo ngôi.** Đã dẫn chứng ở `blocking_errors`. Điều đáng nói là **cùng lô này dịch hai chiều khác nhau**: `thag1.54:1.4` `patthayasi` → *nếu ngươi muốn* (đúng quy ước), còn `ja192:1.4` `saddahāsi` → *ta đã hiểu rõ lắm*. Và tiền lệ gần nhất về đúng từ `saddahāsi` là `ja113:1.1` → *Ngươi đã tin con chó rừng*. Đây là lý do tôi coi là lỗi chủ thể chứ không phải lựa chọn văn phong: cùng một tiền lệ, cùng một cấu trúc, hai kết quả khác nhau.
  
  **Lỗi 2 — mất tầng Anh.** Đã kiểm cả ba tầng: `english-sujato` không có tệp, `vietnamese-current` không có. Bài không có khoá thân đủ 40 ký tự nên bộ đo coverage báo `ratio = 1` và **không bắt được** sự mất tầng — tôi ghi blocker bằng kiểm tệp trực tiếp.
  
  **Phần đúng — và phần này tốt.** Hai vế đầu kệ `1.1`–`1.2` giữ được cả hai điều kiện song song, không gộp: `rūpavatī` → *hãy có dung mạo* và `sīlavatī` → *hãy có giới*. Đây là điểm dễ trượt (dễ dịch thành "hãy làm người xinh đẹp và có giới"), và bản dịch không trượt. `dubbhago` → *khó gả con gái* giữ đúng sắc thái khó cầu hôn, dù cách diễn đạt hơi gượng (xem `vietnamese_clarity`). `na samenti kudācanan` → *chưa bao giờ gặp nhau* ✓ giữ đúng thì hiện tại của `samenti`.
  
  **Về `kāḷakaṇṇī` ở `2.3`:** Pāli viết thường `kāḷakaṇṇī`, bản dịch viết hoa thành *Kāḷakaṇṇī*. Vì đây là tên riêng của nhân vật nên viết hoa là đúng; khác biệt chữ thường/hoa là của người Việt, không phải của Pāli.
  
  **Tên phẩm** `Ruhakavagga` → *Phẩm Thằn Lằn* trùng nguyên văn 6 tệp đã có (`ja192`, `ja193`, `ja195`–`ja198`). `Dukanipāta` → *Tập Kẻ Đau Đớn*, xem ghi chú ở `ja183`.
