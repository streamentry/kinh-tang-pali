notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `tha-ap`/`thi-ap`.
  Đây là bản kể thứ ba cùng công thức `Tīṇuppalamāliya` (sau tha-ap344, bản thứ hai),
  nên phần lớn kệ trùng nguyên văn và đã dùng lại đúng một cách dịch cho cả hai bài.
  Tiền lệ đếm được: 18/40 khoá có Pāli trùng nguyên văn trong tầng. 0.1 `Therāpadāna`
  giữ nguyên Pāli (291/300 tệp tha-ap). 0.2 `Bodhivandanavagga` → Phẩm Đảnh Lễ Cây
  Bồ-đề (7/8; tha-ap376 dùng Phẩm Bodhivandana). 0.3 và 11.1 → Bài Kệ Tuyên Ngợ Về
  Trưởng Lão X, thứ N. (0.3: 162/305 nhóm Tuyên Ngợ; 11.1: 140/305 đúng dạng này).
  Chỗ khác tha-ap344 giữ đúng sự khác biệt của Pāli, không dịch khuôn: 2.4 `disvānattamano
  ahaṁ` và 344:2.4 `disvā attamano ahuṁ` chỉ khác chính tả nên dùng chung một cách dịch;
  4.1 `Pūjayitvāna pupphāni` (344 là `Pupphāni abhiropetvā`) và 4.2 `phussassāhaṁ
  mahesino` (344 là `vipassissa mahesino`) là hai cách kể khác nhau nên dịch khác: bản này
  nói Đại Ẩn Sĩ đã tìm đến ta; 6.3 `Jahitvā purimaṁ jātiṁ` (344 là `Jahitvā mānusaṁ
  dehaṁ`) dịch Từ bỏ kiếp trước, khác Từ bỏ thân người; 7.2 `devarajjamakārayiṁ` gộp
  một từ nhưng nghĩa như 344, nên dùng cùng cách dịch.
  Công thức dùng lại nguyên văn: `Candabhāgānadītīre` → Bên bờ sông Candabhāgā;
  `Addasaṁ virajaṁ buddhaṁ` → Tôi đã trông thấy Đức Phật ly trần; `Obhāsentaṁ disā
  sabbā` → Ngài tỏa sáng khắp mọi phương trời; `Udaggacitto sumano` → Với tâm phấn khởi,
  hoan hỷ; `vippasannena cetasā` → với tâm trong sáng; `pakkāmiṁ uttarāmukho` → rồi con
  quay mặt hướng bắc mà đi; `Tena kammena sukatena` → Nhờ nghiệp lành khéo làm ấy;
  `cetanāpaṇidhīhi ca` → cùng với tâm nguyện và chí hướng; `tāvatiṁsamagacchahaṁ` →
  ta đã đến cõi trời Ba mươi ba; `cakkavattī ahosahaṁ` → ta đã làm Chuyển Luân Vương;
  `Dvenavute ito kappe` → Vào chín mươi hai kiếp trước (33 cặp);
  `Duggatiṁ nābhijānāmi` → Tôi không còn biết đến đọa xứ nào; `buddhapūjāyidaṁ phalaṁ`
  → đó là quả báo của việc cúng dường Đức Phật.
  Ghi nhận bất định: `Lakkhaṇabyañjanūpetaṁ` và `Selantare patitvāna` không có tiền lệ
  trong tầng; xử lý y hệt tha-ap344 và ghi lý do ở đó.
  Tên `Tīṇuppalamāliyo` chứng thực trong chính Pāli bài này ở 10.1, nên giữ dạng Pāli ở
  0.3 và 11.1. `…pe…` ở 9.2 giữ đúng một dấu lược; nháy kép mở ở 1.1, đóng ở 9.3.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do
  coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`,
