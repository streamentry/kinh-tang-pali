notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `tha-ap`/`thi-ap`.
  Đây là bài có thêm khối `uddāna` (10.1-13.4) nên 40 khoá thay vì 36 như các bài khác.
  Tiền lệ đếm được: 27/40 khoá có Pāli trùng nguyên văn trong tầng — tỉ lệ cao nhất
  lát, vì phần lớn kệ ở đây là công thức dùng chung.
  0.1 `Therāpadāna` giữ nguyên Pāli (291/300 tệp tha-ap). 0.2 `Ekavihārivagga` → Phẩm
  Sống Một Mình (2/3; tha-ap437 dùng Phẩm Sống Độc Cư). 0.3 và 9.1 → Bài Kệ Tuyên Ngợ Về
  Trưởng Lão X, thứ N. (0.3: 162/305 nhóm Tuyên Ngợ; 11.1 của các bài khác: 140/305).
  10.1 `Ekavihārivaggo catucattālīsamo` theo công thức `…vaggo …samo` (40 cặp trong kho,
  dạng Phẩm X, thứ N.) → Phẩm Sống Một Mình, thứ bốn mươi tám. 11.1 `Tassuddānaṁ` →
  Tóm tắt phẩm này: (14/19 trong tha-ap/thi-ap; toàn kho đa số là Tóm lược: nhưng đó là
  an/iti/snp, không phải chính tha-ap, nên theo cách có sẵn trong phẩm).
  Công thức dùng lại nguyên văn: `Padumuttarabuddhassa` → Của Đức Phật Padumuttara
  (tha-ap56); `vippasannena cetasā` → với tâm trong sáng; `Dakkhiṇeyyassa vīrassa` →
  bậc anh hùng xứng đáng nhận sự cúng dường (tha-ap508); `adāsiṁ satthuno ahaṁ` →
  tôi đã dâng lên bậc Đạo Sư; `Tena kammena dvipadinda` → Nhờ nghiệp ấy, bạch Đấng Lưỡng
  Túc Tôn; `lokajeṭṭha narāsabha` → bậc Trưởng Thượng thế gian, đấng Nhân Ngưu;
  `Pattomhi acalaṁ ṭhānaṁ` → Tôi đã chứng đắc cảnh giới bất động (tha-ap64);
  `hitvā jayaparājayaṁ` → buông bỏ cả thắng lẫn bại; `Satasahassito kappe` → Vào một
  trăm ngàn kiếp trước đây; `Duggatiṁ nābhijānāmi` → Tôi không còn biết đến đọa xứ nào;
  `aggadānassidaṁ phalaṁ` → đó là quả báo của việc dâng cúng quả tối thượng (tha-ap554);
  `Kilesā jhāpitā mayhaṁ` → Các phiền não của tôi đã bị thiêu rụi (90 cặp);
  `viharāmi anāsavo` → tôi sống đời thanh tịnh không còn lậu hoặc (85 cặp);
  `Svāgataṁ vata me āsi` → Thật là sự đón tiếp tốt lành cho tôi; `gaṇitāyo vibhāvibhi`
  → đã được các bậc sáng suốt tính đếm (tha-ap252/352/482).
  Ghi nhận bất định, đây là lý do ambiguity_integrity 9.0: khối uddāna 12.1-13.2 liệt
  kê các tên riêng mà Pāli không giải thích, và kho không có từ điển hay bản Anh nào để
  tra. Vì vậy `saṅkhiyo`, `pāṭihīrako`, `ucchukhaṇḍī`, `kaḷambaambāṭakado`,
  `Harītakambapiṇḍī` giữ nguyên dạng Pāli (đều là tên riêng, không phải thuật ngữ), còn
  `ekavihārī` (12.1) dịch vị sống một mình theo nghĩa chữ vì `Ekavihārivagga` ở 0.2 và
  10.1 đã dịch Phẩm Sống Một Mình. Không bịa nghĩa cho ba danh từ `saṅkhi`,
  `pāṭihīraka`, `ucchukhaṇḍī` vì không có bằng chứng nào trong repo.
  `Piṇḍāya vicarantassa` (1.3) dịch đang đi khất thực với tay đầy thức ăn, giữ cả hai
  vế (`Piṇḍāya` và `vicarantassa`); `dhārato uttamaṁ yasaṁ` → đã tỏ ra danh tiếng tối
  thượng. `lokajeṭṭhassa tādino` (1.2) dịch giống tha-ap331 để hai bài cùng công thức
  không lệch nhau.
  Tên `Ambaphaliyo` chứng thực trong chính Pāli bài này ở 8.1, nên giữ dạng Pāli ở 0.3
  và 9.1. `…pe…` ở 5.2, 6.2, 7.2 giữ đúng một dấu lược; nháy kép mở ở 1.1, đóng ở 7.3.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do
  coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`,
  `npm run build`.