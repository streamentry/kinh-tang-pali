notes: |-
  Đợt 19, làn 70. Dịch từ Pāli root commit đã ghim, đủ 98/98 khoá (97 khoá mới; khoá kết `25.1` đã có sẵn từ lần trước, giữ nguyên sau khi kiểm lại: `soḷasamo` = 16 khớp thứ tự phẩm, bv3 = thứ nhất), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ mười sáu của Buddhavaṃsa, về Đức Phật Siddhattha: ba lần chứng ngộ và ba kỳ hội chúng, tiền thân Maṅgala dâng quả jambu và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn `bv28:0.1`, `bv29:0.1` (2/2 tiền lệ).
  - `0.2` “18. Dòng Kế Thừa Của Đức Phật Siddhattha”: `siddhattha-buddhavaṁsa`, phần sau là `vaṁso` ở `25.1`, nên dùng cùng chữ “Dòng Kế Thừa” với `0.1` và `25.1`. Phương án khác: “Phần Về Đức Phật Siddhattha”.
  - `25.1` giữ “Dòng kế thừa của Đức Thế Tôn Siddhattha là thứ mười sáu.”

  **Số Pāli, đã tự tính.** `tayo` 3 (3.2 ba lần chứng ngộ khớp ba khoá `3.4`, `4.4`, `5.4` = thứ nhất, thứ hai, thứ ba; 6.1 ba kỳ hội chúng khớp ba con số ở `7.1`–`7.2`; 7.3 ba trường hợp; 14.4 ba lâu đài khớp ba tên ở 14.3). `koṭisatasahassa` = 100 × 1.000 koṭi = **một trăm ngàn koṭi** (3.3; tiền lệ `mil5.1.3:11.6` dịch `kappakoṭisatasahassa` “một trăm ngàn koṭi kiếp”). `navutikoṭi` 90 koṭi (4.3, 5.3). `koṭisata` 100 koṭi, `navuti` 90 (koṭi), `asīti` 80 koṭi (7.1–7.2; ba kỳ hội chúng có số lượng 100, 90, 80 koṭi). `catunnavutito` 4 + 90 = **94** (10.3). `dasavassasahassa` 10 × 1.000 = **10.000 năm** (14.1). `tisoḷasasahassa` 3 × 16.000 = **48.000** (15.1; giữ nguyên dạng “ba lần mười sáu ngàn”, không gộp). `caturo` 4 (16.1). `anūnadasamāsa` = không thiếu + 10 = **đủ mười tháng** (16.3). `saṭṭhi` **60** ratana (21.1; `saṭṭhi` = 60 là số đã xác lập). `dasasahassī` **10.000** (21.4; ngầm chỉ thế giới, như `dasasahassī lokadhātu` ở `mil6.1.1:2.1`). `vassasatasahassa` 100 × 1.000 = **100.000 năm** (22.3). `catuyojana` 4 do-tuần (24.4). `dasapāramī` 10 ba-la-mật (12.4). `soḷasamo` 16 (25.1). Không có cụm `Tiṁsakappasahassa` ở bài này.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã publish và draft (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 17 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 1.000 cặp, trong đó 158 cặp có Việt khác bản tôi viết; 7 khoá dùng đúng nguyên văn một tiền lệ. Gồm `0.1` (2 cặp, 0 khác), `8.1` (2, 2), `9.2` (2, 2), `9.3` (6, 3), `9.4` (7, 3), `10.2` (1, 1), `10.3` (115, 115), `11.1` (1, 0), `11.2` (834, 6; dạng `…` của `…pe…` là 828/834), `12.2` (2, 2, chỉ khác dấu cuối), `13.2` (1, 1), `13.4` (8, 8), `15.2` (5, 2), `16.4` (1, 1), `17.2` (4, 3), `18.4` (8, 8), `21.3` (1, 1).
  - `9.3` “Sau khi tiếp nhận, Đức Chánh Đẳng Giác,” và `9.4` “đã nói lời này:” là dạng đa số (3/6 và 4/7), dùng đúng nguyên văn.
  - `11.1` “Sau khi nỗ lực tinh tấn,” dùng lại đúng nguyên văn `tha-ap22:15.3` (1/1). `16.4` cùng chữ `padhānaṁ padahī jino` với `tha-ap200:1.4`, nhưng tiền lệ ấy viết “nỗ lực chung thức cuối cùng” — chữ “chung thức” không có trong Pāli và có vẻ là lỗi; tôi viết “đã nỗ lực tinh tấn”, cùng chữ với `11.1`. **Lỗi ngoài lát, báo chứ không sửa.**
  - `12.2` “ta càng làm cho tâm tịnh tín bội phần;” khớp 2/2 tiền lệ, chỉ đổi dấu cuối theo Pāli từng khoá.
  - `15.2` “người nữ được trang sức đẹp đẽ;” là dạng đa số (3/5).
  - `17.2` “Đức Siddhattha, bậc Dẫn Đạo thế gian;”: 4 tiền lệ, 2 dạng cùng gốc; chọn dạng có “Đức Siddhattha” (tha-ap, 2/4).
  - `21.3` “Rực rỡ tựa như cột trụ bằng vàng,” (tha-ap205:1.1; 1/1), bỏ nháy mở vì Pāli ở đây không có.
  - `8.1` “Vào lúc ấy, ta”: 2 tiền lệ chia đôi (“tôi” ở tha-ap341, “ta” ở tha-ap429); chọn “ta” vì người kể ở đây là Đức Phật Gotama, cùng ngôi với `bv28`, `bv29`, `cp`. `9.2` dùng lại “dâng cúng lên Đức Siddhattha;” (2/2) chỉ đổi “tôi” → “ta” vì cùng lý do.
  - `10.3` **cố ý khác** 115/115 tiền lệ. Tiền lệ đều là người kể nhìn ngược về quá khứ (“Vào chín mươi tư kiếp trước đây”, 58 khoá; “Từ chín mươi tư kiếp trước”, 17; “Vào chín mươi tư kiếp trước”, 13; “Vào chín mươi tư đại kiếp trước”, 8). Ở `10.3`–`10.4` là lời thọ ký tương lai (`bhavissati`), nên hướng đếm ngược lại: 94 kiếp **sau** thời Siddhattha là thời Gotama, khớp `bv28:14.1` (`catunnavutito kappe eko āsi` = Siddhattha cách thời Gotama 94 kiếp). Viết “Sau chín mươi tư kiếp nữa,”. Pāli ở `10.3` không có chữ chỉ hướng, hướng lấy từ động từ ở `10.4`.
  - Trùng trong chính bài: 2 nhóm Pāli trùng (`4.3`/`5.3` và `13.4`/`18.4`, mỗi nhóm 2 khoá); bản Việt trong từng nhóm giống hệt nhau ⇒ 0 cặp lệch. `13.4`/`18.4` cùng chỉ “của” ở cả hai chỗ (tên mẹ, tên thị giả), nên dùng chung “của bậc Đại Ẩn Sĩ Siddhattha.” (tiền lệ ngoài bài là các câu dâng/đến, không phải sở hữu; dạng “bậc Đại Ẩn Sĩ Siddhattha” có 1 tiền lệ).

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá, đếm số khoá).
  - `nāyaka` → “bậc Dẫn Đạo” (cùng `bv28:1.2`, `bv28:2.2`, `tha-ap11:2.1`; “vị dẫn đường” 1 khoá `snp5.1:16.2`). `jina` → “bậc Chiến Thắng”. `muni` → “Mâu-ni” (`bv28`). `sambuddha` → “Đức Chánh Đẳng Giác” theo dạng đa số ở `9.3`. `cakkhumā` → “bậc có mắt” (`bv28:5.4`, 37 khoá chứa `cakkhumā`, các dạng khác “có mắt sáng”, “có Tuệ Nhãn”).
  - `mahesi` → “Đại Ẩn Sĩ” (78 trên 124 khoá chứa `mahesi`; “Đại Tiên” 8, “Đại Hiền” 6). `mahāvīra` → “Đại Anh Hùng” (36 trên 64; “Đại Hùng” 20, “đại dũng sĩ” 3). `naruttama` → “tối thượng trong loài người” (“Tối Thượng” 25 trên 30 khoá; `iti93:7.2` dùng “tối thắng trong loài người” cho `naruttamā`). `dvipaduttama` → “tối thắng giữa loài hai chân” (4/13, “tối thượng” 7), cùng `bv28:13.2`. `puruttama` (nghĩa thành tối thượng) → “kinh thành tối thượng”: 11 khoá có `puruttame` đều là danh hiệu của thành (`cp3:1.2`, `thi-ap38:5.2`, `tha-ap242:1.2` và các khoá khác), không có khoá nào là danh hiệu của người.
  - `abhisamaya` → “chứng ngộ” (14 khoá; “thông đạt” 16, “giác ngộ” 10 trên 104 khoá chứa `abhisamay-`). “Thông đạt” là dạng của `sn56` (`abhisamayāya` + bốn Thánh đế); ở đây `abhisamaya` đếm theo số người của từng kỳ hội, nên chọn “chứng ngộ”. Đây là điểm yếu nhất về thuật ngữ của bài.
  - `khīṇāsava` → “đã đoạn tận lậu hoặc” (139 khoá “đã đoạn tận”, 198 “lậu hoặc”). `vimala` → “không cấu uế” (8 khoá “không (còn) cấu/ô nhiễm/ô uế”; “thanh tịnh” 32 khoá nhưng nghĩa gần `visuddha`, “vô nhiễm” 13). `santacitta` → “tâm an tịnh” (23 khoá “tâm an/tịch tịnh/tĩnh”). `tādī` → “bất động như vậy” (“bất động” 18, “như vậy” 17; `ud3.1:4.3`, `ud3.7:6.3`, `ud4.7:4.3` đúng chữ “bất động như vậy”). `samāhita` → “an trú” (`iti90:8.2` dịch `aggadhammasamāhito` “an trú trong pháp tối thắng”; “định tĩnh” là dạng chung cho `samāhita` nhưng ở đây `samāhita` đi với `bala`).
  - `tāpasa` → “đạo sĩ khổ hạnh” (3 khoá; “đạo sĩ” 10). `jaṭila` + `uggatāpana` → “bện tóc, tu khổ hạnh mãnh liệt” (`cp22:7.2`, `cp17:1.2`). `abhiñña` → “thắng trí” (509 khoá; “thắng tri” 258). `uggateja` → “uy lực tột đỉnh” (`sn2.10:5.2`, `ja402:5.3`). `duppasaha` → “khó bị khuất phục” (`ja230:1.2`, `ja230:1.4`). `atula` → “không thể cân lường” (`mn56:29.60`), vì “vô song” đã dành cho `asama` (`an1.174:1.1` dịch `asamasamo` “ngang bằng với bậc vô song”). `appaṭipuggala` → “không ai sánh bằng” (3 khoá trên 13).
  - `sannipāta` → “kỳ hội chúng” (`dn14:1.10.1`, `dn14:1.10.2` cùng cụm `tayo sāvakānaṁ sannipātā`: “ba kỳ hội chúng đệ tử”); `samāgama` → “cuộc tụ hội”. `sāvaka` → “đệ tử” (1.665 khoá; `aggasāvaka` “đệ tử thượng thủ” `tha-ap77:1.2`, `mil5.4.4:1.1`). `upaṭṭhāka` → “thị giả” (47 khoá), dùng chung cho `upaṭṭhāko` ở `18.3` và `aggupaṭṭhaka/-ikā` ở `20.2`, `20.4` để giữ đúng một chữ Pāli một chữ Việt; xem bất định số 6.
  - `koṭi` giữ nguyên chữ Pāli “koṭi” (41 khoá; “triệu” 7, “câu-chi” 1; `bv28`). `kappa` “kiếp”, `sahassa` “ngàn” (như `bv28`). `yojana` → “do-tuần” (89 khoá; “do tuần” 6, “yojana” 8). `ratana` (đơn vị đo) và tên địa danh giữ nguyên chữ Pāli, như `bv29` giữ `doṇa`, `nāḷi`.
  - `pāramī` → “ba-la-mật” (46/47 khoá). `vata` + `adhiṭṭhāna` → “quyết tâm giữ lời nguyện” (`cp26:18.4`). `pasāda` → “tịnh tín” (256 khoá).
  - `nagara` → “thành phố” (`tha-ap475:9.1`, 18 khoá “thành phố”; “thành” 95). `khattiya` → “Sát-đế-lợi” (`tha-ap14:11.2` dịch đúng Pāli `udeno nāma khattiyo` thành “có vị Sát-đế-lợi tên Udena;”). `janikā` → “người mẹ sinh ra” (`mil5.5.4:5.1`). `atrajo` → “người con ruột” (`cp7:1.2`). `nimitta` → “dấu hiệu”. `sivikā` → “kiệu” (`pv11:1.3`, `pv11:5.1`, `tha-ap13:6.3`). `pāsāda` → “lâu đài”. `samalaṅkata` → “được trang sức đẹp đẽ” (5 khoá).
  - Tên riêng: `Siddhattha` 67 tệp/73 chỗ (giữ nguyên, không dấu); `Dhammadassī` giữ dấu theo Pāli và theo `bv28:12.4`; `Maṅgala` 5/6; `Revata` 15/43; `Suppiya` 4/16; `Udena` 9/67; `Vebhāra` 4/6; `Kaṇikāra` 22/27; `Suphassā` 2/2; `Anūpama` 2/2; `Kokanada` 2/6 (`mn85`); `Sumitta` 1/1; `Sambala`, `Sīvalā`, `Surāmā`, `Samudda`, `Rammā`, `Surammā`, `Somanassā`, `Suppala`, `Anomārāma`, `Bhīmaratha` (làm địa danh; chỉ gặp làm tên vua ở `tha-ap205:4.2`): chưa có tiền lệ trong tầng, giữ dạng Pāli có dấu. Lưu ý ngoài lát: `bv17:26.1` và `bv16:27.1` còn viết `Dhammadassi`, `Atthadassi` không dấu từ lần trước.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `11.2` `…pe…`, `11.3` `hessāma sammukhā imaṁ’`: đoạn lược che mất phần giữa, nên không xác định được “chúng ta” là ai. Trong các phẩm Buddhavaṃsa còn đầy đủ lời này là lời của chư thiên và loài người đáp lại lời thọ ký; ở phẩm này nháy đơn của lời thọ ký (mở ở `10.1`) đóng ngay ở `11.3`, nên tôi giữ nguyên nháy theo Pāli từng khoá và dịch sát chữ, không thêm người nói. `sammukhā` dịch “ở trước mặt” (tha-ap có “trước mặt”).
  2. `2.4` `nibbāpento sadevakaṁ`: `nibbāpeti` là dạng sai khiến của `nibbāyati` (tắt, nguội); tôi dịch “làm cho … được dịu mát”, hợp với hình ảnh mưa ở `2.3`. Cách đọc khác: “đưa vào Niết-bàn” (bản Việt hiện hành của Bhikkhu Indacanda). Pāli không có từ “Niết-bàn” ở đây, nên không dùng. `santārento sadevakaṁ` (2.2): `sadevaka` là tính từ của `loka`, “thế gian” được hiểu ngầm, cùng cách với `sadevake loke`.
  3. `4.1` `bhīmarathe`: tôi coi là địa danh (cùng nhóm với `vebhāre` ở `5.2`). Cách đọc khác: `bhīma-ratha` “cỗ xe khủng khiếp”, hay danh hiệu của một vùng. Không đủ chứng cứ độc lập nên giữ nguyên chữ Pāli.
  4. `4.2` `āhani dundubhiṁ`: Pāli chỉ nói “đánh trống”; truyền thống Pāli hiểu là trống Pháp nhưng lời kinh không nói, nên không thêm. Tương tự `17.3` `vatti cakkaṁ`: Pāli chỉ nói “chuyển bánh xe”, không có `dhamma`; không thêm “Pháp”.
  5. `5.2` `vebhāre so puruttame`: đọc `puruttame` là định ngữ của `vebhāre` (thành tối thượng) theo 11/11 tiền lệ; cách đọc khác coi `puruttame` là danh xưng của Đức Phật (Magadhism `-e` = `-o`), như bản Indacanda dịch “bậc Tối Thượng Nhân”.
  6. `20.2`, `20.4` `aggupaṭṭhaka/-ikā`: truyền thống chú giải hiểu là những người hộ độ tại gia hàng đầu (nam và nữ), khác `upaṭṭhāko` là vị thị giả ở `18.3`. Pāli không nói tại gia hay xuất gia nên dịch cùng một chữ “thị giả”, thêm “nữ” cho số ít nữ. Nếu cần phân biệt thì phải đổi thành “người hộ trì” (`ud2.8:9.2`, 2 khoá), nhưng đó là diễn giải.
  7. `7.1` `Koṭisatānaṁ navutīnaṁ`: `navutīnaṁ` không có `koṭi` đi kèm; tôi đọc là 90 koṭi theo song song với `asītiyāpi ca koṭinaṁ` (80 koṭi) ở khoá sau. Tôi không thêm chữ “koṭi” vào Việt ở `7.1`. Ở `3.3`, `4.3`, `5.3`, `7.1`, `7.2` Pāli chỉ nói số (sở hữu cách), không nói “vị” hay “người”; tôi không thêm danh từ (khác `bv28:20.2`, nơi bản trước thêm “vị”).
  8. `7.3` `Ete āsuṁ tayo ṭhānā`: `ṭhāna` đọc là “trường hợp / dịp”. Cách đọc khác: “ba chỗ”.
  9. `14.3` `Kokāsuppalakokanadā`: đọc thành ba tên lâu đài Koka, Suppala, Kokanada (khớp “ba” ở `14.4`), nguyên âm kéo dài là sandhi. Cách đọc khác: Kokā, Suppalā, Kokanadā (dạng nữ tính, như Indacanda).
  10. `15.3` `sā nārī` “người nữ ấy”: Pāli không nói là chính thất; không thêm “vợ” hay “chính thất”. `15.4` `atrajo` dịch “người con ruột” (`cp7:1.2`), không thêm “trai”; `13.2` `khattiyo` không thêm “cha” (Pāli không gọi là cha): danh sách ở `13.1`–`13.4` chỉ nêu thành, vị Sát-đế-lợi và người mẹ của Siddhattha.
  11. `21.1`–`21.2` `saṭṭhiratanaṁ ahosi nabhamuggato`: “ratana” ở đây là đơn vị chiều cao (hasta); tôi dịch “cao sáu mươi ratana” và giữ nguyên đơn vị. “Vươn lên bầu trời” dịch sát `nabhamuggato`, nghĩa bóng chỉ chiều cao; không quy đổi ra mét.
  12. `23.2` `pupphāpetvāna sāvake`: nghĩa đen “làm cho đệ tử nở hoa” (sai khiến của `puppha`); giữ hình ảnh, không giải thích. `23.3` `Vilāsetvā samāpatyā`: `samāpatti` dịch “thiền chứng” (`ja134:1.4`); `vilāsetvā` dịch “rạng rỡ” theo nghĩa của tha-ap (không có tiền lệ cho `vilāsa`). Cách đọc khác của cả hai khoá: “sau khi tỏa rạng bằng các tầng định”.
  13. `24.2` `Anomārāmamhi`: giữ nguyên là danh từ riêng “Anomārāma”; `ārāma` là “vườn / tu viện”, không tách để khỏi thêm nghĩa.
  14. `24.4`: `Catuyojanamuggato”ti` — `ti` là chữ đóng lời, nháy đóng nằm ở khoá này; nháy mở ở `1.1`, nên cả bài là một lời kể. Nháy đơn của lời thọ ký (10.1–11.3) nằm trong đó.

