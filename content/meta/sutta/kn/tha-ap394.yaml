notes: |-
  Dịch trực tiếp từ Pāli root vì tầng tham khảo tiếng Anh (Sujato) không có tệp cho tha-ap394 tại commit đã ghim, và không có bản Việt hiện hành phân đoạn cho uid này. Chứng cứ gồm: Pāli root; tiền lệ trong tầng tha-ap (nhất là các bài cùng phẩm tha-ap395–tha-ap402, và các bài có cùng công thức như tha-ap23, tha-ap25, tha-ap410, tha-ap411); bài Kinh Sela snp3.7 (cùng hai nhân vật Sela và Keṇiya, cùng chi tiết ba mươi hai tướng, hai tướng còn nghi, ba trăm thiếu niên) để thống nhất tên riêng và chi tiết; và bản Việt nguyên bài ở mục Tra cứu toàn văn (không căn lề theo segment, không phải một tầng của store) chỉ để kiểm lại cách parse những từ hiếm. Mọi câu Việt do người dịch viết lại từ Pāli, không sao chép bản nào. Các điểm dưới đây là chỗ Pāli cho phép hơn một cách hiểu hoặc chưa có tiền lệ trong tầng.
  Tên bài `:0.3`: Pāli `Selattheraapadāna` không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli bắt đầu bằng số); `translationTitle` bằng đúng giá trị `:0.3`. Mở đầu tên: đo toàn tầng tha-ap thấy Tuyên Ngợ 255, Ký Sự 155, Tuyên Ngôn 142, khác 7 (Tuyên Ngợ là lỗi chính tả); ở phạm vi gần (tha-ap380–430) Ký Sự 36, Tuyên Ngợ 7, Tuyên Ngôn 5, khác 1. Hai phạm vi cho đa số khác nhau; chọn Ký Sự theo phạm vi gần và các bài liền kề tha-ap395–tha-ap420. Cần biên tập phán một lượt cho cả cuốn. Tên phẩm `Phẩm Pilindavaccha` theo tiền lệ (8 khoá Pāli `Pilindavacchavagga`, cả 8 dịch thế). Khoá cuối `99.1` viết hoa từng chữ như `:0.3`: ở các khoá cuối tha-ap380–430 Ký Sự Về 18 so với Ký sự về 15 (toàn tầng các khoá cuối ghi Ký sự về 78, Ký Sự Về 64, Tuyên Ngợ 203, Tuyên Ngôn 119). `dutiyaṁ` dịch thứ hai, khớp vị trí bài thứ hai của phẩm. Tên riêng Sela, Keṇiya, Vāseṭṭha, Haṁsavatī, Aṭṭhagopānasī giữ dạng Pāli như các bài liền kề.
  Số đếm tự tính: `tiṁsa` = 30 (không phải 3) và `sahassa` = 1000, nên `Tiṁsa kappasahassāni` (23.1) = 30 × 1000 = ba mươi ngàn kiếp; kiểm chéo cùng bài: `tiṁsalakkhaṇe` (70.2) = 30 tướng, cộng `lakkhaṇe dve` (70.1) = 2 tướng còn nghi, tổng 32 tướng đại nhân, khớp snp3.7. `sata` = 100 và `sahassa` = 1000, nên `Satasahassito kappe` (94.1) = 100 × 1000 = một trăm ngàn đại kiếp trước; `Sahassakkhattuṁ` (24.1) = một ngàn lần; `pañcasataṁ` (23.3) = năm trăm lần; `Asītikoṭi` (26.1) = `asīti` 80 koṭi = tám mươi koṭi; `tīṇi satā` (18.1), `Tiṇṇaṁ satānaṁ` (19.3), `Tisatā` (20.1), `Satehi tīhi` (73.1), `tisate` (92.4) đều là 3 × 100 = ba trăm; `aṭṭha hetū` (75.4) = tám, đủ tám mục ở 76.1–77.4; `aṭṭha gopānasī` (78.1) = tám cây kèo; `pañca thambhāni` (80.1) = năm cây cột; `pañca hetū` (80.4, 84.4) = năm; `catasso` (97.1) = bốn; `dasabalo` (40.1) = thập lực; `Pannarasamaṁ` (44.1) = thứ mười lăm; `chaḷaṅge` (26.4) = sáu chi phần. `Tiṁsa` ở đây không dính cụm chưa phân xử `Tiṁsakappasahassa` của một số bài khác: bài này là đối cách chỉ thời lượng `Tiṁsa kappasahassāni`, dịch Trong ba mươi ngàn kiếp theo tiền lệ khoá trùng Pāli. `kappa` ở 94.1 là đại kiếp theo 34 khoá trùng Pāli `Satasahassito kappe` (so với 12 khoá dịch kiếp trước đây), còn 23.1 là kiếp theo tiền lệ duy nhất của dạng này; hai chỗ khác nhau về chữ đại vì theo hai nhóm tiền lệ khác nhau, như tha-ap395.
  Thuật ngữ đo ở tầng tha-ap: Sát-đế-lợi 51 so với Sát-đế-lỵ 0; Bà-la-môn 77 so với bà-la-môn 3; tỳ-kheo 135, Niết-bàn 86; mahāvīra Đại Anh Hùng 77 so với Đại Hùng 12 (khác 4); cakkhumā bậc Có Mắt 29 so với Hữu Nhãn 13 (khác 11); `lokanātha` Đấng Bảo Hộ Thế Gian và `narāsabha` đấng Nhân Ngưu theo dạng chiếm đa số; `jina` bậc Chiến Thắng; `upadhi` sanh y (tầng dịch `nirūpadhi` không còn sanh y); `sītibhāva` trạng thái mát lạnh; `nibbuti` sự tịch tịnh; `hetū` ở 75.4, 80.4, 84.4 dịch điều theo tiền lệ; `pallaṅka` chiếc ghế; `upaṭṭhānasālā` giảng đường theo ud2.2. `sambuddha` dịch Toàn Giác để đồng nhất với hai khoá trùng Pāli 17.1 và 69.1 (tiền lệ trùng Pāli: Toàn Giác 2 so với Chánh Đẳng Giác 1; toàn tầng chữ Chánh Đẳng Giác đa số), nên đây là lựa chọn nhất quán trong bài, chưa phải đa số toàn tầng. Công thức kết `Itthaṁ sudaṁ … abhāsitthāti` dịch những bài kệ này: 553 khoá so với 2 khoá dùng bài kệ này. Đại từ: người kể nói tôi, như tha-ap395 và tha-ap396 cùng phẩm (ở phạm vi tha-ap380–430 đếm chữ ta 691 so với tôi 380, hai ngôi cùng tồn tại trong tầng); Sela dạy các thiếu niên ở 67.1 nói ta; Keṇiya nói tôi; Đức Phật ở 20–21 gọi các ngươi.
  Bất định: (1) 1.2 `vīthisāmī` dịch người đứng đầu một con phố; chữ này không xuất hiện ở khoá nào khác trong toàn bộ Pāli đã ghim. (2) 3.4 và các khoá trùng `pūgadhammaṁ akaṁsu te`, 75.2, 78.2, 80.2 `pūgadhamme vasiṁ ahaṁ`: `pūgadhamma` không có tiền lệ trong toàn tầng; dịch nếp hội đoàn theo nghĩa pūga (hội đoàn, đoàn thể) cộng dhamma (lề thói, bổn phận); cách hiểu khác là tinh thần cộng đồng hoặc bổn phận của hội đoàn. (3) 4.1 `anīkaṭṭhā` quân hộ vệ theo tha-ap410; 4.2 `rathikā pattikārakā` có hai khoá trùng Pāli ở các Jātaka dịch kẻ cưỡi xe và kẻ đi bộ, đổi thành người đánh xe và bộ binh vì chữ kẻ hạ thấp và ja513 dịch rathikā là người đánh xe; 5.1 `uggā` dịch các nhà quyền quý (tha-ap410 dịch chiến sĩ dòng cao quý ở một khoá khác), cách hiểu khác là một hạng quan chức hoặc con lai; 5.2 `vesiyānā` dịch các thương nhân, không có tiền lệ, có thể là hậu duệ dòng Vessa. (4) 6.1 `āḷārikā` thợ làm bánh theo tha-ap410; 7.2 `nhāpitā` dịch thợ hớt tóc để phân biệt với `kappakā` thợ cạo ở 6.1, hai chữ đều nghĩa là người cắt tóc; 9.2 `tipulohakarā` thợ thiếc; 10.1 `ceṭakā` người hầu; 12.1–12.2 `pupphikā`, `mālikā`, `paṇṇikā`, `phalahārakā` hầu như không có tiền lệ, dịch người bán hoa, người làm vườn hoa, người bán lá, người gánh trái cây; `pupphikā` và `paṇṇikā` cũng có thể là người hái hoa và hái lá. (5) 15.3–15.4 nháy đơn bao quanh `upaṭṭhānasālaṁ sukataṁ … kārayuṁ` không rõ là lời của ai; dịch như lời kể lại và giữ nháy đúng khoá. (6) 19.2 nháy đơn đóng `’` ngay sau `cakkhumā` theo Pāli; `sampaṭicchitva` là bất biến quá khứ nên dịch tường thuật (bậc Có Mắt sau khi thọ nhận), ghép với 19.3–19.4 thành một câu; nếu đọc 19.1–19.2 là lời của người kể thì nghĩa thành lời thỉnh. (7) 20.1–20.2 `anuvattiṁsu ekato` dịch đã cùng nhau làm theo (không nêu tân ngữ); 20.3 `sampattiñhi karitvāna` dịch quả thật, sau khi tạo nên thành tựu tốt đẹp (tầng dịch `sampatti` thành quả báu hoặc thành tựu). (8) 21.2–21.4 `sītibhāvamanuttaraṁ … nibbānaṁ` hiểu là hai danh xưng cùng chỉ một đối tượng của `phassayissatha`. (9) 26.1 `nicayo` dịch tích trữ được, với chủ ngữ là Bà-la-môn Vāseṭṭha; Pāli không nói là của cải. (10) 29.4 `āhutī me na vijjati` dịch sát nghĩa nơi tôi không có lễ hiến cúng; mạch có thể là không có lễ hiến cúng nào dành cho vua. (11) 38.1 `anantavaṇṇo` dịch vô biên đức tính (vaṇṇa cũng là sắc, lời khen); 41.2 `dhammaviññāṇakhobhito` là dạng khẳng định khobhito, dịch được khuấy động bởi sự thấu hiểu Pháp, cách hiểu không bị lay động (dạng phủ định) cần chữ a mà Pāli không có; 43.1 `asamasamo` ngang bằng bậc vô song theo tiền lệ; 49.1 `ārammaṇavimuttīsu` dịch các sự giải thoát về đối tượng, không thêm chữ dựa trên; 52.1 `dhīti` dịch ý chí. (12) 54.1 `Klesabyādhibahudukkha` dịch với động từ xua tan lấy từ `vinodano` của 54.2 vì Pāli không nêu động từ riêng; 54.2 giữ đúng chữ của 48.2 vì Pāli trùng nguyên văn. (13) 58.1–58.4 chủ ngữ không nêu (Pāli `ācikkhi me` là ngôi thứ ba, nên người chỉ là vị đạo sĩ Keṇiya như snp3.7), không thêm chủ ngữ; nháy đơn đóng ở 58.4 theo Pāli dù nội dung là lời kể. (14) 60.4 `bodhipakkhiye` dịch các pháp trợ giác ngộ làm tân ngữ; cũng có thể là những người thuộc phần giác ngộ (đồng vị với `veneyye`). (15) 62.2 `dhammānucchavisaṁvaraṁ` hiểu là tân ngữ của `sikkhāpemi` ở 62.3. (16) 74.4 `vinivattayuṁ` dịch dừng lại, không nêu tân ngữ. (17) 78.4 `aparaṭṭhamaṁ` dịch thêm một điều thứ tám, không rõ; Indacanda đọc là phần phụ của điều thứ tám. (18) 81.4 `na dhaṁsemi yathā ahaṁ` là dạng chủ động ngôi thứ nhất, không có tiền lệ nào trong Pāli đã ghim; dịch tôi không bị ai công kích theo mạch các điều đạt được nhờ năm cây cột ở 81–82 (đều là trạng thái của người dâng), còn cách đọc sát chữ là tôi không công kích ai. (19) 82.2 `akhilo` không chai cứng theo tiền lệ; 82.4 `vimalo` không cấu uế. (20) 89.2 `paribhogamadāsahaṁ` dịch tôi đã dâng cho việc thọ dùng theo tiền lệ `paribhoga` là thọ dùng; không nêu vật dâng. (21) 93.4 `nibbutā upadhikkhaye` dịch đã tịch diệt khi các sanh y đã đoạn tận.
  Nháy: ngoặc kép mở ở 1.1 và đóng ở 97.3; nháy đơn mở/đóng ở 2.1–14.4, 15.3–15.4, 18.1–19.2, 20.1–21.4, 28.3–28.4, 29.1–54.4, 57.1–58.4, 59.1–60.4, 63.1–68.4; đã kiểm 387/387 khoá khớp Pāli từng khoá (nháy đơn ở 18 khoá, ngoặc kép ở 2 khoá, 0 lệch). Ba khoá không có dấu ở Pāli (55.1, 55.3, 72.3, chữ `buddhoti`, `buddho buddhoti`) dịch không dùng nháy.
  Lược: ba khoá `…pe…` (95.2, 96.2, 97.2) giữ đúng một `…`; Pāli không có `(…)` ở khoá nào và Việt không có khoá nào chỉ gồm `(…)`.
  Đã dò tiền lệ trong tầng tha-ap, kn: 88 khoá của bài có Pāli trùng nguyên văn với ít nhất một khoá đã dịch ở tầng (6.650 khoá tiền lệ trùng cộng dồn), 72 khoá dùng lại nguyên văn một bản đã có, 16 khoá khác: sáu khoá chỉ khác chữ hoa hoặc dấu (42.1, 68.2, 69.3, 87.3, 91.3, 94.3), ba khoá khác ngôi (1.3, 28.2, 86.4), 58.1 bỏ chữ tôi vì chủ ngữ khác, 55.4 bỏ chữ cũng không có trong Pāli, 86.3 bỏ chữ dài thêm (không có trong Pāli), 82.4 vì tiền lệ là lời nguyện khác nghĩa, và bốn khoá đổi có chủ ý: 2.2 phước điền thay ruộng phước để đồng nhất với 14.4, 46.2, 74.2, 4.2 người thay kẻ, 23.2 vui chơi thay hưởng thọ (ramati; cùng phẩm tha-ap395 và tha-ap396 dùng vui chơi). Trong chính bài có 15 nhóm Pāli trùng nguyên văn (266 cặp), cả 15 nhóm Việt giống nhau, 0 cặp Việt khác.
  Đã kiểm 387/387 khoá khớp tập khoá và thứ tự Pāli, không khoá rỗng, NFC, không khoảng trắng thừa, không Pāli lọt sang bản Việt ngoài tên riêng và tên thực vật, vật phẩm (Therāpadāna, Haṁsavatī, Vāseṭṭha, Keṇiya, Aṭṭhagopānasī, koṭi, timbarūsaka).
  Lệnh còn phải chạy ở môi trường có quyền chạy cổng: `npm run validate`, `npm test`, `npm run check`, `npm run build`; vì vậy technical_integrity đặt 9.6 và chưa tuyên bố technical gate pass.
  Lượt cải thiện 2026-10-13: đọc đối kháng lại 387 khoá, đo lại tiền lệ cho các khoá Pāli trùng nguyên văn với tầng (97 khoá có tiền lệ; 18 khoá khác bản đã có; ghi chú cũ đã nêu 15 khoá trong số đó, còn 3.2 và 5.1 chưa được nêu nên được xử lý dưới đây, và 22.4 chỉ khác ngôi ta so với tôi). Sáu khoá đã đổi: (1) 3.2 `mahāsālā ca brāhmaṇā` từ Bà-la-môn đại phú thành Bà-la-môn giàu có, theo hai khoá trùng Pāli ở ja532 và để bớt Hán–Việt không cần thiết (han_viet_balance 9.0 sang 9.1). (2) 4.2 `rathikā pattikārakā` từ người đánh xe và bộ binh thành người cưỡi xe và người đi bộ: 14 khoá trùng Pāli ở các Jātaka đều dịch cưỡi xe và đi bộ (chỉ khác ở chữ kẻ, ở đây đổi thành người cho đồng đều với 4.1 Người cưỡi voi, 14 khoá cùng dạng), nên bỏ chữ đánh xe vốn gần nghĩa người cầm cương hơn người chiến đấu trên xe. (3) 5.1 `uggā ca rājaputtā ca` từ hoàng tử thành vương tử theo ba khoá trùng Pāli ở ja547 (cả ba dịch vương tử); đây là khoá khác bản đã có mà phần ghi chú tiền lệ trước chưa nêu; ghi chú cũ ở trên về 4.2 và các chữ hoàng tử, đại phú được thay bằng đoạn này. Ở phạm vi toàn tầng chữ hoàng tử vẫn đông hơn (44 so với 22 khoá ngắn có rājaputta), nên đây là chọn theo tiền lệ trùng nguyên văn chứ không theo đa số chữ. (4) 15.3 bỏ chữ Một thêm vào để khoá trùng Pāli 18.3 `Upaṭṭhānasālaṁ sukataṁ` có cùng cách dịch (Giảng đường khéo làm); trước lượt này hai khoá trùng Pāli đang khác nhau bởi chữ Một, nay nhóm Pāli trùng nguyên văn trong bài là 17 nhóm, 328 cặp, 0 cặp Việt khác sau khi bỏ dấu câu và chữ hoa (đo bằng đối chiếu chuẩn hoá, khác với số 15 nhóm, 266 cặp ghi ở trên vốn đếm bằng so khớp nghiêm). (5) 33.1 `ukkāmukhapahaṭṭhova` từ vàng trong lò luyện thành vàng rực sáng ở miệng lò luyện, để giữ đủ nghĩa pahaṭṭha (rực sáng, được làm sáng) và mukha (miệng lò) như ba khoá trùng gần dạng `ukkāmukhapahaṭṭhaṁva` đã dịch rực sáng ở lò luyện; chữ vàng không có trong Pāli của khoá này, giữ theo ba khoá trùng gần dạng và theo hình ảnh quen thuộc của Sela, ghi nhận là phần thêm nhỏ có tiền lệ. (6) 90.3 `karitvā kāraṇā nānā` từ gây nhiều hình phạt thành áp dụng nhiều hình phạt, vì chữ gây hình phạt gượng; `kāraṇā` đo trong tầng ở các khoá `kammakāraṇā` đều dịch hình phạt. Điểm đổi: terminology 8.7 sang 8.9 (hai khoá 4.2, 5.1 và 3.2 nay theo bản đã có), vietnamese_clarity 8.8 sang 8.9 (15.3, 33.1, 90.3), semantic_fidelity 8.7 sang 8.8 (33.1 giữ lại nghĩa pahaṭṭha và mukha), han_viet_balance 9.0 sang 9.1; các tiêu chí khác giữ nguyên, nhất là triangulation 7.8 (không có bản Anh độc lập) và ambiguity_integrity 8.4 (các bất định ở mục Bất định vẫn còn). Chỗ nghi ngờ nhưng không đổi: 41.1–41.2 `dhammaviññāṇakhobhito` (một cách đọc khác ở bản Việt nguyên bài hiểu là không bị lay động, nhưng Pāli đã ghim là dạng khẳng định, không thêm chữ a); 78.4 `aparaṭṭhamaṁ` (bản Việt nguyên bài hiểu là phần phụ trội của điều thứ tám, giữ cách dịch hiện tại và bất định cũ); 62.2–62.3 `sikkhāpemi` vẫn đặt ở 62.2 để câu đọc được, không dời; 89.2 `paribhogamadāsahaṁ` giữ như cũ. Chưa thể giải quyết thêm bằng căn cứ: `vīthisāmī` (không có khoá nào khác trong Pāli đã ghim) và `pūgadhamma` (không có tiền lệ), nên không đổi. Lệnh cổng chưa chạy ở môi trường này: `npm run validate`, `npm test`, `npm run check`, `npm run build`; technical_integrity giữ 9.6.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 7 vị trí bất đồng nghĩa → sửa 0, giữ 4, bất định 3. Giữ: 5.1 (uggā: các nhà quyền quý theo 4 khoá ja547 cùng cụm, bản nguyên bài chú theo chú giải là con lai của dòng Sát-đế-lợi); 6.1 (kappakā: thợ cạo theo dn2, bản nguyên bài dịch người phục vụ); 28.3–30.2 (āvāho vivāho: đám cưới và lễ gả bán theo mn92, snp3.7, dn3, bản nguyên bài dịch cô dâu chú rể); 58.1 (Paggayha dakkhiṇaṁ bāhuṁ: giơ cánh tay phải lên, như paggahetvā ở mn92:11.2 và snp3.7:9.1, bản nguyên bài dịch nắm lấy cánh tay phải của tôi). Bất định: 12.1–12.2 và 13.2 (pupphikā, paṇṇikā, macchikā: bản dự án người bán hoa, người bán lá, người đánh cá; bản nguyên bài người trồng hoa, người hốt lá, bà bán cá, không đủ ngữ cảnh để phân xử); 26.1 (Asītikoṭi nicayo: bản dự án gán tám mươi koṭi cho Bà-la-môn Vāseṭṭha, bản nguyên bài gán cho Sela, danh cách đứng sau Vāseṭṭha nāma brāhmaṇo nên chọn theo trật tự câu); 41.1–41.2 (dhammaviññāṇakhobhito: bản dự án được khuấy động bởi sự thấu hiểu Pháp, bản nguyên bài không bị lay động do nhận thức đối tượng, là dị bản mang nghĩa ngược, hapax trong Pāli ghim). Bản nguyên bài không có 40 khoá 80.1–89.4 (năm cây cột, chiếc ghế); các khoá đó không có đối chiếu. devarajjamakārayiṁ và Devarajjaṁ karontassa (23.4, 24.3) dịch làm ra vương quyền theo quy ước 26 khoá của tầng, bản nguyên bài dịch cai quản Thiên quốc; không đổi riêng một bài. Các số (ba mươi ngàn kiếp, năm trăm lần, một ngàn lần, tám mươi koṭi, ba trăm, ba mươi và hai tướng, tám cây kèo, năm cây cột) khớp ở chỗ có đối chiếu. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Rà soát lỗi lặp 2026-10-15 (đợt 2, đối chiếu Pāli đã ghim; không có bản Anh hay Việt độc lập cho
  tầng này): sửa tha-ap394:94.1 `kappa` đổi "đại kiếp" thành "kiếp", vì Pāli không có `mahā` (cùng
  cách đã sửa ở tha-ap340:20.1; tầng đa số dịch "kiếp"). Các khoá khác của bài không đổi.
