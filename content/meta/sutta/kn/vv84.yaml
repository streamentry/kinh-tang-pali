notes: |-
  Dịch từ Pāli root `vv84` (229/229 khoá, tiền tố `vv84:`, thứ tự khoá đúng Pāli, không có khoá ngoài tập). Bài thuộc `Purisavimāna`, `Sunikkhittavagga`, bài thứ mười: một đoàn buôn từ Magadha và Aṅga lạc trong sa mạc, gặp dạ-xoa Serīsaka (kiếp trước là vua Pāyāsi, nhờ nghe Kumārakassapa mà bỏ tà kiến, giữ năm điều học). Dạ-xoa kể phước báo của mình, rồi chỉ người thợ cạo Sambhava là cư sĩ đáng tôn kính; cả đoàn tuyên bố làm cư sĩ, về đến Pāṭaliputta bình an và dựng pariveṇa Serīsaka.

  **Tham chiếu.** Pāli root là tiêu chuẩn duy nhất. Có đọc thêm bản Việt hiện hành không phân đoạn của Bhikkhu Indacanda (mục tra cứu toàn văn cuối trang) để hiểu cú pháp các khoá khó; đó là văn xuôi liên tục, `alignment: none`, không phải tầng của store, không được tính vào `triangulation`, và không có câu nào được chép lại. Bản Anh Sujato của `vv` không có tại commit đã ghim.

  **Pāli trùng nguyên văn trong tầng Việt.** 11/229 khoá có Pāli trùng ở bài khác, tổng 136 cặp, trong đó 3 khoá tiêu đề chiếm 127 cặp. Dùng lại nguyên văn cho 3 tiêu đề theo đa số bộ `vv`: `0.1` đồng nhất 81/83 cặp, `0.2` 25/34, `0.3` 9/10. Tổng 21 cặp lệch: 2 ở `0.1` (`vv45:0.1`, `vv69:0.1`, hai cách viết lẻ), 9 ở `0.2`, 1 ở `0.3`, và 9 cặp của 8 khoá nội dung. Các khoá nội dung lệch có lý do riêng:
    - `14.2` `pahūtamalyā bahupuṇḍarīkā` dịch *nhiều hoa, nhiều sen trắng*; `pv28:3.2` viết *hoa nhài* cho cùng Pāli, trong khi Pāli của khoá ấy không có `mallikā`. Khoá nằm ngoài lát nên chỉ báo.
    - `15.3` `masāragallā` giữ nguyên danh xưng như `dn17:1.4.2`, `dn17:1.5.4`, `dn17:1.6.2`; `vv36:3.3` dịch *san hô* trong khi Pāli `pavāḷa` (san hô) không có ở khoá đó. Ngoài lát, chỉ báo.
    - `24.1`, `24.2` trùng `ja447:1.1`, `ja447:1.2` và `pv30:7.2`. Ở `ja447` người hỏi là vua nói với đạo sĩ nên dùng *ngươi*; ở đây thương nhân hỏi một vị thiên nên dùng *ngài*. `vataṁ` dịch *hạnh nguyện* (`pv30:7.1` viết *hành trì*, `pv30:10.1` viết *sự tu hành*; hai tiền lệ, chưa có đa số).
    - `27.3`, `27.5` khớp `vv61:4.3`, `vv61:5.1` về ý (*từ bỏ sát sinh*, *không uống chất say*) nhưng `vv61` dùng *Ta*, bài này dùng *tôi*; `sát sinh` theo đa số (toàn tầng 439/490 khoá của `pāṇātipāta`, riêng `vv`/`pv`/`ja` 14/22; *sát sanh* 14 và 1).
    - `28.2` trùng `pv30:10.2` (*về nghiệp thiện của ngài mà có quả báo này*); dịch *của điều đã khéo thực hành ấy* vì `suciṇṇassa` là *điều khéo thực hành*, Pāli không có *nghiệp* hay *ngài*.
    - `44.6` trùng `ja161:2.4` (*bậc thiện chí*); xem `sappurisa` ở dưới.
  Trùng nguyên văn **trong chính bài**: 5 nhóm (`3.3`=`9.3`; `9.2`=`44.4`; `20.3`=`22.3`=`24.3`; `49.1`=`50.1`=`51.1`; `37.2`=`52.2`). Việt giống hệt ở 4 nhóm; nhóm còn lại lệch có chủ ý (`37.2` ngôi thứ nhất *chúng tôi cầu của cải*, `52.2` ngôi thứ ba, bỏ đại từ vì chủ ngữ ở `52.1`). 0 cặp lệch do lỗi.

  **Thuật ngữ, kèm số đếm.** Số trong ngoặc là toàn tầng; nêu thêm phạm vi gần nhất khi hai phạm vi cho đa số khác nhau.
    - `yakkha` → *dạ-xoa* (231/293 khoá; *yêu quái* 7, *dạ xoa* 14).
    - `satthavāha` → *người dẫn đoàn* (11 khoá, *dẫn đội* 12 khoá do bộ `dn23`, *trưởng đoàn* 1 trên 35; cách dùng gần nhất `thig15.1:45.1`, `ja493:15.1`, `sn6.1:8.2`); `vāṇija` → *thương nhân* (46/74); `sattha` → *đoàn buôn* (`dn23:21.4` viết *đoàn thương nhân*).
    - `kantāra` → *hoang mạc* (25 khoá, *hoang vắng* 16 trên 45); `vaṇṇupatha` → *sa mạc* (`ja2:0.4`, `ja2:1.1`, `ja2:2.1`).
    - `kadariya` → *keo kiệt* (36 khoá, *bủn xỉn* 18 trên 42).
    - `natthikadiṭṭhi` → *tà kiến hư vô* (`natthikavāda` ở `dn23:5.0`, `mn60:9.5` là *chủ trương hư vô*); `ucchedavādī` → *chủ trương đoạn diệt* (`dn1:3.9.1` trở đi, 16 khoá).
    - `cittakathī` → *thuyết giảng hay* (4/17 khoá, `dn23:2.6`, `sn44.1:3.4`; còn lại *giảng nói hay* 1, *xuất sắc* 2, cách khác).
    - `diṭṭhivisūka` → *sự vặn vẹo của kiến chấp* (`mn2:8.9` viết *sự quanh co của kiến chấp*; 4 khoá).
    - `pesala` → *hiền thiện* (16/45 khoá, *tốt* 10, *khả ái* 6).
    - `sappurisa` → *bậc thiện nhân*: toàn tầng 339 khoá (không tính `asappurisa`) *thiện nhân* 139, *người thiện* 102, *chân nhân* 56, *bậc thiện* 49, *thiện chí* 2; riêng tập kệ 19 khoá *chân nhân* 6, *bậc thiện* 6, *thiện nhân* 4, *thiện chí* 2 (`ja161:2.4`, `ja162:2.2`). Chọn *thiện nhân* theo toàn tầng và dùng nhất quán ở `44.6`, `54.1`; hai phạm vi cho đa số khác nhau.
    - `duggati` (`30.4`) → *đọa xứ*: toàn tầng 902 khoá *đọa xứ* 423, *ác thú* 185, *cõi dữ* 141, *khổ cảnh* 4; riêng `vv`/`pv`/`ja` 10 khoá *đọa xứ* 4, *cõi dữ* 4, *khổ cảnh* 1 (`vv16:11.4`). Chọn *đọa xứ* theo đa số ở cả hai phạm vi.
    - `masāragalla` giữ danh xưng; `lohitaṅga` → *hồng ngọc*; `jotirasa` → *ngọc jotirasa* (`mil5.1.4:12.5`, `tha-ap425:10.2`, `tha-ap23:27.3`; `vv9:7.3` viết *rực rỡ ánh lửa*); `tapanīya` → *vàng luyện* (`thig14.1:9.1`); `jambonada` → *vàng sông Jambu* (4 khoá `an4.28`, `an4.6`, `an5.42`, `an3.63` so với 2 *Jambonada* ở `mn120`, `sn2.29`); `muraja`, `ālambara` giữ danh xưng như `ja470:15.2`; `sopānaphala` → *ván bậc thang* (`pv24:1.1`).
    - `Bhummā devā` → *chư thiên trên mặt đất* (5/21 khoá; *Địa Cư Thiên* 4, *loài đất* 2, *địa thần* 2).
    - `adhisīla` → *tăng thượng giới* (21/61 khoá); `ariyavutti` → *hạnh bậc Thánh* (`sn3.24:5.3` *hạnh của bậc Thánh*, `ja290:2.3` *bậc thánh*; 3 khoá).
    - `pariṇāmaja` → *do thay đổi mà sinh khởi* (`sn36.21:3.4`, `mil5.1.8:13.4`, `mil5.1.8:4.8` cho `utupariṇāmajā`).
    - `tāta` (số nhiều, người nói gọi đoàn buôn) → *các bạn thân mến*: 190 khoá, *con* 129 (cha gọi con), *thân mến* 24 (`dn3:1.4.2`, `dn21:1.2.2`, gọi người ngang hàng); khác ngữ cảnh nên chọn *thân mến*.
    - `kumāra` (đoàn buôn gọi vị thiên) → *công tử*: chưa có tiền lệ cho dùng với một vị thiên (`ja446:4.2` *cậu trai*, `ja505:10.1` *hoàng tử*, đều là người thật). Lựa chọn mới.
    - `pariveṇa` (`53.5`) giữ Pāli: 0 khoá trong tầng; các cách dịch thường gặp (*liêu xá*, *tịnh xá nhỏ*) thêm nghĩa ngoài Pāli. `serīsamaha` → *lễ hội Serīsa*: 0 tiền lệ.
    - `ālambati` → *bám vào*: 44 khoá *tựa* 13, *bám* 9, *nương* 5, *dựa* 3, nhưng các khoá *tựa/dựa* chỉ nghĩa *tựa vào khung cửa* (`dn16:5.13.1`, `dn17:2.8.7`) không hợp ngữ cảnh *lên cung điện*; bản Indacanda dịch *bước lên*.
    - Tiêu đề: `0.2` *Chuyện Cung Điện Nam Hư Không*, `0.3` *Phẩm Khéo Đặt Để* theo đa số bộ `vv`; `0.4` giữ danh xưng *Serīsaka* như `vv85:11.4`, `dn23:33.1`.

  **Số Pāli, kèm phép tính.**
    - `15.1` `satamussitāse` = `sata` 100 → *dựng cao một trăm*; Pāli không nêu đơn vị (bản Indacanda thêm *ratana*), nên không thêm đơn vị.
    - `16.1` `sahassa` 1000 → *ngàn cột*.
    - `33.1`, `33.3` `vassasata` = 100 → *một trăm năm*.
    - `34.1` `vassasatāni pañca` = 5 × 100 = 500 → *năm trăm năm*.
    - `0.4` `10.` và `55.1` `dasamaṁ` → *mười*. Không có `navuti`, `tālīsa`, `tiṁsa`, `kappasahassa`.

  **Bất định.** Ghi lại, không đưa vào thân kinh.
    - `44.5` `taṁ khippamānena lahuṁ parena` không phân xử được. Dịch sát chữ *ông ấy, bị kẻ khác nhanh chóng quăng bỏ* theo nghĩa gốc của `khippamāna` là *bị quăng, bị phóng* (`mn13:12.1`, `mn14:11.1` cho tên và lao); `taṁ` được hiểu là người thợ cạo. Cách đọc khác của bản Indacanda coi `parena` là kẻ đang xử tệ ông ấy.
    - `36.1` `anucchaviṁ ovadiyañca me taṁ` dịch *lời ấy hợp lẽ, và là lời khuyên răn dành cho tôi*, với `taṁ` chỉ điều thương nhân vừa nói ở `35.1`–`35.4`; cách đọc khác coi `ovadiya` là lời khuyên của dạ-xoa dành cho họ. `36.2` `peyyavācaṁ` *lời thân ái* không đổi ở hai cách đọc.
    - `5.2` `anāyasaṁ paralokena tulyaṁ`: `anāyasa` dịch *vô ích* (không phải *không bằng sắt*), `paraloka` dịch *cõi đời sau*; 0 tiền lệ cho `anāyasa` trong tầng.
    - `5.1` `ujjaṅgala` dịch *khô cằn*; `dn16:5.17.2`, `dn17:1.2.2` (4 khoá) viết *hoang vắng* cho `ujjaṅgalanagarake` nhưng ngữ cảnh là thị trấn nhỏ, và *hoang vắng* dễ nhầm với `kantāra` (*hoang mạc*) ở `3.2`.
    - `15.1` `satamussitāse`: nếu `sata` là số cột chứ không phải chiều cao thì nghĩa đổi; Pāli ở `16.1` đã nêu *ngàn cột*, nên chọn *cao một trăm*.
    - `15.2` `silāpavāḷassa ca āyataṁsā` dịch *có cạnh dài bằng đá và san hô*; `āyataṁsā` (*cạnh dài*) và liên kết `silā`–`pavāḷa` đều theo cú pháp.
    - `4.2` `upādānaṁ` dịch *củi lửa* (nghĩa *nhiên liệu*); `4.4` `tatāhi uṇhāhi dāruṇāhi` là ba tính từ giống cái số nhiều chỉ `vālukāhi`, nên dịch *vốn bị nung nóng, nóng bỏng và khắc nghiệt*.
    - `33.2` `sipāṭikā phalati ekamekā` dịch *từng quả một nứt ra* (`mn45:4.1` dịch `sipāṭikā` là *quả*, `phalati` là *nứt ra*); chu kỳ nứt (mỗi trăm năm một quả, hay từng cây) Pāli không nói rõ.
    - `33.4` `kāyamhi` dịch *chúng* vì ngữ cảnh là chư thiên cõi đất (`2.2` `bhummānaṁ`); cách đọc *thân* cũng hợp ngữ pháp.
    - `34.1` `disvānahaṁ` không nêu tân ngữ; dịch *tôi thấy rằng* và để vế sau là điều thấy.
    - `21.2` `gutto` dịch *canh giữ* (chủ động); có thể là *được bảo hộ*.
    - `22.1` `adhiccaladdhaṁ` (*do ngẫu nhiên mà được*), `pariṇāmajaṁ` (*do thay đổi mà sinh khởi*); nghĩa *thay đổi* ở đây là chuyển hoá tự nhiên.
    - `31.3` `janassimassa` dịch *đám đông này*; có thể chỉ riêng hội chúng của vị thiên.
    - `30.4` Pāli không có dấu nháy đóng ở khoá kết bằng `ti`: lời đoàn buôn mở ở `29.1` và đóng ở `31.4`; Việt không thêm dấu nào ngoài Pāli.

  **Dấu lược và nháy.** Pāli không có `…` hay `(…)` nên Việt không có (0 khoá có `…`, 0 khoá `(…)`). Nháy kép khớp Pāli từng khoá: 43/229 khoá có nháy (mở ở `1.1`, `3.1`, `7.1`, `11.1`, `13.1`, `21.1`, `22.1`, `23.1`, `24.1`, `25.1`, `29.1`, `32.1`, `35.1`, `36.1`, `37.1`, `38.1`, `45.1`, `46.1`, `47.1`, `48.1`; đóng ở `2.4`, `6.4`, `10.4`, `12.4`, `20.4`, `21.4`, `22.4`, `23.4`, `24.4`, `28.4`, `31.4`, `34.4`, `35.4`, `36.4`, `37.4`, `44.6`, `45.5`, `46.4`, `47.4`, `48.4`; `49.1`, `50.1`, `51.1` có cả mở lẫn đóng quanh *Tôi trước*); nháy đơn: Pāli không có, Việt không có.

  **Kiểm trước khi chốt.** 229/229 khoá Việt khớp 229/229 khoá Pāli về tập và thứ tự; 0 lệch nháy trên 229 khoá; 0 khoá rỗng hay khoảng trắng thừa; NFC đạt; không Pāli lọt sang Việt ngoài danh xưng riêng và thuật ngữ đã ghi; đã in cặp Pāli và Việt từng khoá để đọc.

