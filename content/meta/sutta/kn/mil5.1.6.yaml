  **Đặt mới hoặc 0 tiền lệ:** `Dukūla`, `Pārikā`, `Isisiṅga`, `Mahāpanāda`, `Kusa` (tên riêng, 0 hit Việt); `balākā` → `cò` (0 tiền lệ; `ja274` có `balākā` nhưng bản Việt không dịch nghĩa); `kukkuṭa` → `gà` (16/19); `tinh dịch` cho `sambhava` (0 hit); `bộ phận sinh dục` cho `aṅgajāta` (1 hit); `y nội`; `cửa sinh` cho `yoni` trong `yonippavesa` (`4.7`); `uppattidivasa` → `ngày thọ sinh`.

  **Bất định đã phân xử, ghi lại để biên tập xem lại.**
  (1) `arahassavacanametaṁ` (`1.2`): tôi đọc `a-rahassa` = không bí mật (lời được nói giữa chư thiên và loài người), nên dịch `không bí mật`; cách đọc `arahassa` = của bậc A-la-hán (sở hữu cách số ít) cũng có thể, nhưng khác dạng `arahato` thường gặp và khác `arahantavacana` ở `mil5.5.2:4.5`. Chưa phân xử chắc từ Pāli một mình.
  (2) `kalala` (`4.4`, `4.6`, `4.11`, `4.13`): Pāli dùng cùng một từ cho (a) lớp bùn ruộng đã chuẩn bị (ví dụ hạt giống `4.4`) và (b) chỗ phôi thai đầu tiên (`4.6`, `4.11`, `4.13`). Tôi dịch `bùn nhão (kalala)` ở `4.4` rồi giữ `kalala` trơ ở các khoá sau, để phép ví dụ giữa ruộng và bụng mẹ hiện đúng như Pāli. `sn10.1:3.1` dịch `thai tươi (kalala)`. `ṭhitāya dhātuyā` (`4.6`) dịch `yếu tố (dhātu) đã an trụ`, không giải thích thêm nó là yếu tố nào (`đại` 25, `giới` 19 trong 49 hit toàn `mil` ở các nghĩa khác).
  (3) `upagatassa te eso vissāso` (`5.11`): dịch `ngài đã đến thì đây là sự thân tình của ngài`; `vissāsa` có thể là sự thân quen/tin cậy hoặc sự suồng sã, và quan hệ với `upagatassa` không rõ; không phân xử chắc, giữ nghĩa gần chữ nhất.
  (4) `kadāyaṁ kāyo na bhijjissati` (`5.11`): đọc là câu hỏi tu từ `rồi lúc nào mà nó chẳng tan rã?` (thân rồi cũng tan); cách đọc khác `khi nào thân này sẽ không tan` ít hợp văn cảnh vì câu kế `bhijjatu ayaṁ kāyo` (`cứ để thân này tan rã đi`).
  (5) `ūhasanampi sannipāto, ullapanampi sannipāto, upanijjhāyanampi sannipāto` (`8.2`): `ūhasana` → `cười đùa`, `ullapana` → `chuyện trò`, `upanijjhāyana` → `nhìn chăm chú`. `ullapana` có thể mang nghĩa trò chuyện thân mật hoặc lời mời gọi; không có tiền lệ trong tầng (`cnd23` có `ullapana` nhưng chưa dịch).
  (6) `ajjhācāra` (`8.2`, `9.1`, `9.3`): dịch `việc giao cấu`, theo văn cảnh (`anajjhācārepi … parāmasanena gabbhāvakkanti` — thụ thai nhờ chạm, không cần giao cấu). Từ này nghĩa gốc là sự vi phạm; không có tiền lệ trong tầng (`ne10:14.2` có `anajjhācāro` nhưng chưa dịch).
  (7) `ṭhānagataṁ vuḍḍhimāpajjati` (`4.11`, `4.13`) và `ṭhānagatā vuḍḍhimāpajjanti` (`4.12`): dịch `đến đúng chỗ thì tăng trưởng`, cùng một cách ở cả ba khoá vì cùng công thức; chủ thể của `ṭhāna` (kalala hay biển) không được Pāli nêu thêm.
  (8) `sannipāto osarati` (`4.16`): `osarati` (đi vào, thuộc về) dịch `nằm trong đó`; ở `4.11` dịch `đi vào kalala`. Không thêm ý.
  (9) `yonippavesena` (`4.7`): `yoni` ở đây là cơ quan sinh dục nữ (`aṅgajāte pakkhipi` ở `3.7`), dịch `cửa sinh` để không buộc phải chọn giữa âm đạo và tử cung; `yoni` ở các khoá khác nghĩa `cách sinh`.
  (10) `ekarasāyeva purimena` (`5.1`): dịch `cùng một bản chất như trường hợp trước`; `rasa` có thể là vị hoặc bản chất, không có tiền lệ.
  (11) `anūpakhette` (`15.3`): dịch `ruộng ven nước`; `anūpa` là chỗ gần nước, ẩm.
  (12) `majjhāraññaṁ` (`16.3`): coi là tên riêng `rừng Majjha` như ba tên đi kèm, nhưng cũng có thể là `rừng giữa`; không có tiền lệ.
  (13) `iminā nāma te nibbattā` (`3.1`): `iminā` chỉ cách mà Milinda kể ở `3.2`–`3.7`; dịch `bằng cách này`.
  (14) `ayañca dvinnaṁ sannipātā gabbhassa avakkanti dissati` (`1.2`): `ayañca` dịch `và cũng`; không thêm quan hệ đối lập mà Pāli không nói.
  (15) `āharayya` (`3.6`): đọc `āhara + ayya` (xin đưa đây, thưa tôn giả); phù hợp với `3.5` (Udāyi sai lấy nước, vị ni xin tự giặt).
  (16) `garukatamettatāya` (`5.4`): dịch `do lòng kính trọng và tình thương`; hợp từ có thể đọc theo nhiều cách, đây là cách ít giả định nhất.
  (17) Chủ thể của `bhaṇitañca` (`2.2`): Pāli không nêu; giữ `Và cũng có lời nói rằng:` đúng như tiền lệ một hit ở tầng, không gán cho Thế Tôn.
  (18) `chinda vimatipathaṁ, dhārehi ñāṇavarappajjotaṁ` (`1.9`): `cắt đứt con đường nghi hoặc`, `gìn giữ ánh sáng của trí tuệ tối thắng`; `dhārehi` cũng có thể là `hãy mang/giữ`, nghĩa không đổi đáng kể.

  **Lỗi bản nháp đã bắt (sau lượt đọc đối chiếu từng cặp Pāli–Việt):** `5.8` bản nháp thêm `cho họ` sau `atthakāmo` (Pāli không có tân ngữ), đã gỡ; `6.5` bản nháp lặp `tuổi thọ` hai lần, rút lại; `1.2` đổi `không dư sót` thành `không còn dư sót` theo `mil5.1.4:1.3`; `11.3` bỏ `đối với` thừa trước `bất cứ thứ gì trong tâm mong muốn`; `13.3`, `13.6` đổi `là loài` thành `trở thành loài` cho khớp `13.9`, `13.12`; `1.4`, `1.7` thêm `rằng` để dùng lại đúng văn bản gần nhất trong `mil5.1.*`. Đã cân nhắc rồi bỏ: `hội đủ` cho `sannipāta` (xem phần tiền lệ) và `thưa Đại đức` cho `bhante` trong lời Sakka (văn xưng `Đại đức` chỉ dành cho Nāgasena trong bài).

