notes: |-
  Dịch trực tiếp từ Pāli root; commit đã ghim không có bản Anh cho toàn bộ `tha-ap`/`thi-ap`.
  Bài đầu tiên trong lát có phần văn xuôi không phải kệ ở 5.1-5.2 và lời dạy xúc phạm
  trực tiếp ở 6.1-6.4, nên giữ đúng văn phong mệnh lệnh và xưng các ngươi.
  Tiền lệ đếm được: 16/40 khoá có Pāli trùng nguyên văn trong tầng.
  0.1 `Therāpadāna` giữ nguyên Pāli (291/300 tệp tha-ap). 0.2 `Sakacintaniyavagga` →
  Phẩm Sakacintaniya (4/4; dùng chung cho tha-ap68 và 70 trong lát). 0.3 và 11.1 →
  Bài Kệ Tuyên Ngợ Về Trưởng Lão X, thứ N. (0.3: 162/305 nhóm Tuyên Ngợ; 11.1: 140/305
  đúng dạng này). Pāli 0.3 không có số thứ tự nên không thêm số vào 0.3; số thứ tư chỉ
  xuất hiện ở 11.1 theo `catutthaṁ`.
  Công thức dùng lại nguyên văn: `Usabhaṁ pavaraṁ vīraṁ` → Đấng Nhân Ngưu cao quý, anh
  dũng (tha-ap232, tha-ap322); `Mahesiṁ vijitāvinaṁ` → bậc đại ẩn sĩ, bậc chiến thắng
  (snp3.9); `Suvaṇṇavaṇṇaṁ sambuddhaṁ` → bậc Chánh Đẳng Giác màu vàng ròng (16 cặp
  cùng họ); `Ko disvā nappasīdati` → Ai trông thấy mà không hoan hỷ (tha-ap139, 3 cặp,
  dùng cho cả bốn vế 1.4, 2.4, 3.4, 4.4); `Sattaratanasampannā` → đầy đủ bảy món báu quý
  giá; `cakkavattī mahabbalā` → là Chuyển Luân Vương có đại uy lực; `Catunnavutito kappe`
  → Vào chín mươi tư kiếp trước đây; `Duggatiṁ nābhijānāmi` → Tôi không còn biết đến
  đọa xứ nào; `thomanāya idaṁ phalaṁ` → đó là quả báo của việc tán thán Phật (tha-ap253).
  Ghi nhận bất định, đây là lý do ambiguity_integrity 8.9 và semantic_fidelity 9.2:
  (a) 5.2 `brāhmaṇo senasavhayo` không có tiền lệ trong tầng. Đọc là Bà-la-môn vốn là
  chỉ huy quân đội, nên dịch Bà-la-môn, vị chỉ huy quân đội — giữ danh từ `senasavhayo`
  thay vì bịa một danh xưng khác; cách đọc còn lại là `senasavhayo` là tên riêng của vị
  Bà-la-môn, khi đó câu vẫn đúng nghĩa nhưng mất dấu hiệu là danh xưng.
  (b) 8.2 `caturo āsumuggatā` không có tiền lệ. `īsala` (cây mọc nơi nước) là danh xưng
  cổ truyền cho bậc Bà-la-môn, nên dịch có bốn vị Bà-la-môn sinh ra từ rong nước; đây là
  chú giải theo ngữ nghĩa, chỉ ghi ở đây, không đưa vào thân kinh.
  (c) 3.1 `Vasudhā yathāppameyyā` đọc là không thể đem ra mà đo lường được, bỏ danh từ
  `Vasudhā` vì ở đây nó chỉ là loài người nói chung, không phải một nhân vật.
  (d) 6.4 `anubhosimanappakaṁ` dịch các ngươi sẽ không còn biết đến chật hẹp, ghép
  `anubhosi` (bị chật hẹp) với `anappaka` (không khó khăn, không hẹp) theo cặp tính từ
  củ cực mà Pāli ghép; không thêm lời giải thích nào vào thân kinh.
  Tên `Parappasādako` chứng thực trong chính Pāli bài này ở 10.1, nên giữ dạng Pāli ở
  0.3 và 11.1. `…pe…` ở 9.2 giữ đúng một dấu lược; nháy kép mở ở 1.1, đóng ở 9.3.
  technical_integrity 9.6 vì lát này không chạy gate (BRIEF cấm). Bốn lệnh gate do
  coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`,
