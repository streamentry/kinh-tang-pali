notes: |-
  **Bài thứ tư của `Kharaputtavagga` trong `Chakkanipāta`.** 37 khoá, tất cả đã dịch. Truyện: thỏ rùa bị bọ cánh cứu rồi nắm lấy bọ cánh; cáo kêu cầu; thỏ rùa đòi cáo thả bọ cánh thì mới thả cáo; người kể là Bà-la-môn.

  **Ba khoá dùng lại nguyên văn (đếm bằng script):** `1.1` ← `ja267:1.1` · `1.2` ← `ja267:1.2` · `1.3` ← `ja267:1.3` — Pāli giống hệt (*Siṅgīmigo āyatacakkhunetto* / *Aṭṭhittaco vārisayo alomo* / *Tenābhibhūto kapaṇaṁ rudāmi*), đó là bài mở đầu cùng một tình tiết (con rùa bị bắt trong lưới), nên tôi dùng lại nguyên văn. Thêm hai khoá tiêu đề: `0.2` ← `ja376`/`ja377` (*Bộ Sáu Bài Kệ*) · `0.3` ← `ja386`/`ja387` (*Phẩm Kharaputta*).

  **LỖI NGHĨA ĐÃ BẮT VÀ SỬA Ở LƯỢT REVIEW ĐỐI KHÁNG — ghi lại vì nó đáng bị nhớ.** `6.4` `Pure visaṁ gāḍhamupeti maccaṁ`. Bản nháp đầu tôi dịch *cho ta qua khỏi nơi nguy hiểm khổ đau đã tới gần* — sai hoàn toàn, và sai theo nghĩa **ngược**. Pāli đọc đúng là: `visaṁ` = *kẻ hung dữ*, `gāḍham upeti` = *đang lao tới*, `maccaṁ` = *tới ta* ⇒ *cho kẻ hung hăng đã lao tới ta được đến với ngài*. Tôi đã sửa thành đúng vế này. Sai lệch đến từ chỗ cứ ghép `gāḍha` với *nguy hiểm khổ đau* theo cảm tính, mà không đọc `upeti maccaṁ` như một vế. Đây là lý do `ambiguity_integrity` ở 8.8.

  **`5.3` `muduñca maṁsaṁ` — TÔI KHÔNG DỊCH ĐƯỢC, và tôi nói thẳng thay vì bịa.** `sādu` (thịt dê) và `thūla` (thịt chim ưng) thì rõ; `mudū` thì **không tra được nghĩa** trong chính corpus Pāli đã ghim, cũng không có bản Việt nào đã có, và không có chú giải trong kho để phân xử. Tôi dịch *và cả thịt nữa* — giữ `māṃsa` (thịt) và bỏ qua phần từ không hiểu, thay vì đoán *thịt thỏ* hay *thịt chua*. **Đây là khoảng trống thật, xin ghi nhận:** cần người có chú giải Pāli tra `mudū` thì mới sửa được. Ba khoá còn lại (`sāduñca` → *thịt dê*, `thūlañca` → *thịt chim ưng*) là của chính bài, không có tiền lệ.

  **`0.4` giữ Pāli trong tên: *4. Kinh Suvaṇṇakakkaṭa*.** Mẫu là hai bài ngay cùng phẩm: `ja386:0.4` *1. Kinh Kharaputta* (Pāli `Kharaputtajātaka`), `ja387:0.4` *2. Kinh Sūci* (Pāli `Sūcijātaka`) — giữ tên riêng, bỏ hậu tố `-jātaka`. **Tiền lệ trái chiều:** `ja267:0.4` = *7. Kinh Con Cua* cho `Kakkaṭakajātaka` (dịch nghĩa), mà `Suvaṇṇakakkaṭa` cũng là con rùa. Nếu biên tập chọn hướng dịch nghĩa thì đổi thành *4. Kinh Con Rùa Vàng* là hợp lý, nhưng đó là quyết định cho cả 392 bài `ja`, không thuộc lát này. Dòng kết `9.1` theo cùng cách: *Kinh Suvaṇṇakakkaṭa, thứ tư.*

  **Tên riêng:** `Devadatto`, `Māra`, `Ānandabhaddo` xuất hiện ở `8.1–8.3` (cái chú giải nhân vật của truyện). `Māra` đã có sẵn trong tầng và tôi dùng nguyên dạng; `Devadatto` không có dấu Pāli nên an toàn; `Ānandabhaddo` có dấu `Ā` mà **chưa** có bản Việt nào (grep = 0) — tôi khai vào bộ nhớ tiến trình của harness vì đây là tên riêng **lấy từ Pāli của chính bài**, đúng cơ chế docstring của `_hvi.py` nêu, và **không sửa `_hvi.py`**.

  **Tên phẩm — đo trên toàn bộ 392 bài `ja`, không đoán.** `0.1` → *Jātaka* 376/392 (đúng như người điều phối nêu, tôi xác nhận sau khi đếm) · `0.2` `Chakkanipāta` → *Bộ Sáu Bài Kệ* **13/13**, không lệch · `0.3` `Kharaputtavagga` → *Phẩm Kharaputta* **7/7**, không lệch. Ba khoá tiêu đề của lát này vì thế **không có** chỗ nào phải đặt mới.

  **`2.1` `mahatā phaṇena` → *bằng chiếc hàm khổng lồ*.** `phaṇa` là hàm/hàm ếch của thú săn mồi. Tôi tạt bẻ *chiếc hàm khổng lồ* thay vì *miệng khổng lồ* vì con rắn đang bung hàm để tấn công con rùa ở `2.2`. `2.3` `paritāyamāno` tôi dịch *vây quanh*; bản nháp đầu để *răn* (gợi ý *triệu tập*) — tôi đổi sang *vây quanh* vì hành động gọi bạn bè giúp con rùa đánh lừa kẻ săn, và vì `paritāya` trong nghĩa *"trải ra, vươn ra"* không có nghĩa *triệu tập*.

  **`6.2` `Uṭṭhātu poso visamāvamāmi` → *xin ngài đứng dậy, cho tôi thấy rõ tai hại*.** `poso` là cách xưng hô tôn trọng bậc thượng đối diện với `āvuso` nhưng ở đây cáo gọi con rùa — nên *ngài*, không phải *hiền giả*. Tôi ghi rõ vì trong `cp` và `dn` hai từ này là hai cách xưng khác nhau, và chọn sai sẽ đổi thái độ lời thoại.

  **Dấu nháy kép — đếm được, cân, và tôi đã kiểm kỹ vì có chỗ dễ sai.** Pāli 6 mở (`1.1`, `3.1`, `4.1`, `6.1`, `7.1`, `8.1`) / 6 đóng (`1.4`, `3.4`, `5.4`, `6.4`, `7.4`, `8.4`); bản Việt y hệt. Chỗ dễ sai là `4.1` mở nháy mà `4.4` **không** đóng — lời thoại ấy còn chạy tới `5.4` mới đóng; và `6.1` đóng ở `6.4`, `7.1` mở mới và đóng ở `7.4`. Tôi đã đếm trực tiếp trên Pāli trước khi viết để không đóng nhầm chỗ.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root: `root/pli/ms/sutta/kn/ja/ja389_root-pli-ms.json`, 37 khoá. Bản Anh Sujato **không có** tại commit đã ghim: 83 tệp `ja` của edition phủ `ja1–ja79` cộng `ja126`, `ja159`, `ja466`, `ja534`, **không có `ja389`**; `kn/` chỉ có `cp` 35, `dhp` 26, `iti` 112, `ja` 83, `kp` 9, `snp` 73, `thag` 264, `thig` 73, `ud` 80 — **không có `cnd`, `pv`, `mil`**. `find` cho 0 tệp ⇒ `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` cũng không có uid này. Tầng `vietnamese-current` vắng: thư mục `translation/` không tồn tại trong checkout này. Ba tầng tham khảo đều vắng ⇒ **blocker thật**, là giới hạn upstream. `triangulation` bị chặn ở **7.5** (≤ 8.0), **không nâng để né blocker**; `status` là `draft`.

