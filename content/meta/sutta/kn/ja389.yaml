notes: |-
  **Bài thứ tư của `Kharaputtavagga` trong `Chakkanipāta`.** 37 khoá, tất cả đã dịch. Nhân vật theo Pāli: quạ (`vāyasa`), rắn đen (`kaṇhasappa`), cua (`kakkaṭaka`) và một người (`puriso`); lời kết 8.1–8.4 đồng nhất quạ = Devadatta, rắn đen = Māra, cua = Ānandabhadda, người kể là Bà-la-môn.

  **Ba khoá dùng lại nguyên văn (đếm bằng script):** `1.1` ← `ja267:1.1` · `1.2` ← `ja267:1.2` · `1.3` ← `ja267:1.3` — Pāli giống hệt (*Siṅgīmigo āyatacakkhunetto* / *Aṭṭhittaco vārisayo alomo* / *Tenābhibhūto kapaṇaṁ rudāmi*), đó là bài mở đầu cùng một tình tiết (con cua), nên tôi dùng lại nguyên văn. Thêm hai khoá tiêu đề: `0.2` ← `ja376`/`ja377` (*Bộ Sáu Bài Kệ*) · `0.3` ← `ja386`/`ja387` (*Phẩm Kharaputta*).

  **LỖI NGHĨA ĐÃ BẮT VÀ SỬA Ở LƯỢT REVIEW ĐỐI KHÁNG — ghi lại vì nó đáng bị nhớ.** `6.4` `Pure visaṁ gāḍhamupeti maccaṁ`. Bản nháp đầu tôi dịch *cho ta qua khỏi nơi nguy hiểm khổ đau đã tới gần* — sai hoàn toàn, và sai theo nghĩa **ngược**. Pāli đọc đúng là: `visaṁ` = *kẻ hung dữ*, `gāḍham upeti` = *đang lao tới*, `maccaṁ` = *tới ta* ⇒ *cho kẻ hung hăng đã lao tới ta được đến với ngài*. Tôi đã sửa thành đúng vế này. Sai lệch đến từ chỗ cứ ghép `gāḍha` với *nguy hiểm khổ đau* theo cảm tính, mà không đọc `upeti maccaṁ` như một vế. Đây là lý do `ambiguity_integrity` ở 8.8.

  **`5.3` `muduñca maṁsaṁ` — TÔI KHÔNG DỊCH ĐƯỢC, và tôi nói thẳng thay vì bịa.** `sādu` (thịt dê) và `thūla` (thịt chim ưng) thì rõ; `mudū` thì **không tra được nghĩa** trong chính corpus Pāli đã ghim, cũng không có bản Việt nào đã có, và không có chú giải trong kho để phân xử. Tôi dịch *và cả thịt nữa* — giữ `māṃsa` (thịt) và bỏ qua phần từ không hiểu, thay vì đoán *thịt thỏ* hay *thịt chua*. **Đây là khoảng trống thật, xin ghi nhận:** cần người có chú giải Pāli tra `mudū` thì mới sửa được. Ba khoá còn lại (`sāduñca` → *thịt dê*, `thūlañca` → *thịt chim ưng*) là của chính bài, không có tiền lệ.

  **`0.4` giữ Pāli trong tên: *4. Kinh Suvaṇṇakakkaṭa*.** Mẫu là hai bài ngay cùng phẩm: `ja386:0.4` *1. Kinh Kharaputta* (Pāli `Kharaputtajātaka`), `ja387:0.4` *2. Kinh Sūci* (Pāli `Sūcijātaka`) — giữ tên riêng, bỏ hậu tố `-jātaka`. **Tiền lệ trái chiều:** `ja267:0.4` = *7. Kinh Con Cua* cho `Kakkaṭakajātaka` (dịch nghĩa), mà `Suvaṇṇakakkaṭa` cũng là con cua. Nếu biên tập chọn hướng dịch nghĩa thì đổi thành *4. Kinh Con Cua Vàng* là hợp lý, nhưng đó là quyết định cho cả 392 bài `ja`, không thuộc lát này. Dòng kết `9.1` theo cùng cách: *Kinh Suvaṇṇakakkaṭa, thứ tư.*

  **Tên riêng:** `Devadatto`, `Māra`, `Ānandabhaddo` xuất hiện ở `8.1–8.3` (cái chú giải nhân vật của truyện). `Māra` đã có sẵn trong tầng và tôi dùng nguyên dạng; `Devadatto` không có dấu Pāli nên an toàn; `Ānandabhaddo` có dấu `Ā` mà **chưa** có bản Việt nào (grep = 0) — tôi khai vào bộ nhớ tiến trình của harness vì đây là tên riêng **lấy từ Pāli của chính bài**, đúng cơ chế docstring của `_hvi.py` nêu, và **không sửa `_hvi.py`**.

  **Tên phẩm — đo trên toàn bộ 392 bài `ja`, không đoán.** `0.1` → *Jātaka* 376/392 (đúng như người điều phối nêu, tôi xác nhận sau khi đếm) · `0.2` `Chakkanipāta` → *Bộ Sáu Bài Kệ* **13/13**, không lệch · `0.3` `Kharaputtavagga` → *Phẩm Kharaputta* **7/7**, không lệch. Ba khoá tiêu đề của lát này vì thế **không có** chỗ nào phải đặt mới.

  **`2.1` `mahatā phaṇena` → *bằng chiếc hàm khổng lồ*.** `phaṇa` là hàm/hàm ếch của thú săn mồi. Tôi tạt bẻ *chiếc hàm khổng lồ* thay vì *miệng khổng lồ* vì con rắn đang bung hàm để tấn công con cua ở `2.2`. `2.3` `paritāyamāno` tôi dịch *vây quanh*; bản nháp đầu để *răn* (gợi ý *triệu tập*) — tôi đổi sang *vây quanh* vì hành động gọi bạn bè giúp con cua đánh lừa kẻ săn, và vì `paritāya` trong nghĩa *"trải ra, vươn ra"* không có nghĩa *triệu tập*.

  **`6.2` `Uṭṭhātu poso visamāvamāmi` → *xin ngài đứng dậy, cho tôi thấy rõ tai hại*.** `poso` là cách xưng hô tôn trọng bậc thượng đối diện với `āvuso` nhưng ở đây cáo gọi con cua — nên *ngài*, không phải *hiền giả*. Tôi ghi rõ vì trong `cp` và `dn` hai từ này là hai cách xưng khác nhau, và chọn sai sẽ đổi thái độ lời thoại.

  **Dấu nháy kép — đếm được, cân, và tôi đã kiểm kỹ vì có chỗ dễ sai.** Pāli 6 mở (`1.1`, `3.1`, `4.1`, `6.1`, `7.1`, `8.1`) / 6 đóng (`1.4`, `3.4`, `5.4`, `6.4`, `7.4`, `8.4`); bản Việt y hệt. Chỗ dễ sai là `4.1` mở nháy mà `4.4` **không** đóng — lời thoại ấy còn chạy tới `5.4` mới đóng; và `6.1` đóng ở `6.4`, `7.1` mở mới và đóng ở `7.4`. Tôi đã đếm trực tiếp trên Pāli trước khi viết để không đóng nhầm chỗ.

  **TẦNG THAM KHẢO — đo, không đoán.** Pāli root: `root/pli/ms/sutta/kn/ja/ja389_root-pli-ms.json`, 37 khoá. Bản Anh Sujato **không có** tại commit đã ghim: 83 tệp `ja` của edition phủ `ja1–ja79` cộng `ja126`, `ja159`, `ja466`, `ja534`, **không có `ja389`**; `kn/` chỉ có `cp` 35, `dhp` 26, `iti` 112, `ja` 83, `kp` 9, `snp` 73, `thag` 264, `thig` 73, `ud` 80 — **không có `cnd`, `pv`, `mil`**. `find` cho 0 tệp ⇒ `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` cũng không có uid này. Tầng `vietnamese-current` vắng: thư mục `translation/` không tồn tại trong checkout này. Ba tầng tham khảo đều vắng ⇒ **blocker thật**, là giới hạn upstream. `triangulation` bị chặn ở **7.5** (≤ 8.0), **không nâng để né blocker**; `status` là `draft`.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lát này **không** chạy bốn lệnh đó vì BRIEF cấm trong từng lát ⇒ để CI hoặc người điều phối chạy. `technical_integrity` đặt **9.6**, không 10.0: mọi chốt tự động của `_hvi.kiểm` đã xanh và 37/37 khoá của chính bài này, nhưng cổng `npm` chưa chạy.

  **Sửa lan 2026-10-13 (accuracy fix).** `kakkaṭa`/`kakkaṭaka` là **cua**, không phải rùa; `vāyasa` là **quạ**, không phải đàn ông. Các chỗ nhắc "rùa" trong notes bên trên đã đổi thành "cua"; những chỗ nhắc "cáo", "bọ cánh", "thỏ" không có căn cứ trong Pāli của bài (chỉ có quạ, rắn đen, cua, người). Khoá đã đổi (trước → sau): `ja389:1.1` "Con cua có đôi càng dài như sừng," → "Con thú có sừng, mắt dài," · `1.2` "đứng bằng đầu, thân ngập nước đầy;" → "da bằng xương, ở dưới nước, không lông;" (`aṭṭhittaco vārisayo alomo`) · `1.3` "Sợ hãi điều ấy, con rùa kêu lên," → "Bị nó khuất phục, ta khóc thảm thiết," (`tenābhibhūto kapaṇaṁ rudāmi`) · `1.4` "bỏ tôi" → "bỏ ta" (cùng người nói với 1.1–1.3) · `2.2` "con rắn đã lao tới tấn công con rùa;" → "con rắn đã lọt vào giữa con cua;" (`kakkaṭamajjhapatto`) · `2.4` "con rùa đã nắm lấy con rắn." → "con cua đã nắm lấy con rắn." · `3.1` "Chẳng phải đàn ông, cũng không phải con rắn đen," → "Chẳng phải quạ, cũng chẳng phải rắn đen," · `3.2` "con rùa là thứ không nên buông;" → "con cua đi tìm mồi sẽ không bắt;" (`ghāsatthiko kakkaṭako adeyya`: cua tìm mồi, `adeyya` cầu khiến "sẽ bắt") · `3.3` "Tôi hỏi con rùa thong dong," → "Hỡi kẻ mắt dài, tôi hỏi ngươi," (`āyatacakkhunetta` là hô ngữ gọi con cua, không có "thong dong") · `8.3` "còn con rùa là Ānandabhadda," → "còn con cua là Ānandabhadda,". Căn cứ: `1.1`–`1.3` có Pāli trùng nguyên văn với `ja267:1.1`–`1.3` nên dùng đúng bản Việt hiện hành của ja267 (3/3 khoá trùng, bản cũ của bài này khác cả 3). Tiền lệ `kakkaṭa` → cua: `ja267:0.4` "Kinh Con Cua", `ja267:3.1` "Những con cua nào…". Chưa sửa, còn nghi vấn cần rà tiếp ở các khoá ngoài phạm vi sửa lan: `2.1` (`phaṇa` là cái mang/mào của rắn hổ, không phải hàm; `passasanto` là phì phò), `2.3`, `5.1`–`5.3` (`sādu` ngon, `thūla` béo/to, `mudu` mềm — không phải thịt dê/chim ưng; nhận định "mudū không tra được" ở trên không đúng), `6.x`, `7.2` (`paṭibandhako`) — bài nên được rà lại toàn bộ trước khi tin điểm hiện tại.

  **Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan).** Đọc đối kháng đủ 37/37 khoá Pāli↔Việt. Kết luận: điểm `published` cũ bị thổi phồng — trước lượt sửa lan, gần như mọi khoá kệ 1–8 đều sai nghĩa, và sau sửa lan vẫn còn sai ở 2.x, 3.x, 4.2, 5.x, 6.x, 7.x, 8.4. **29/37 khoá đổi** (accuracy fix, trừ 1.4/8.1 là chỉnh xưng hô/tên riêng). Mạch truyện theo đúng Pāli: quạ (1.x) kêu bạn rắn khi bị cua kẹp; kệ 2 là lời kể: rắn lao tới cứu bạn và cũng bị cua bắt; kệ 3 hỏi vì sao cua bắt cả hai trong khi cua không ăn quạ hay rắn; kệ 4–5 cua đáp: người này đã mang nó tới chỗ nước, người ấy chết thì cua cũng mất mạng vì thân to, thịt ngon; kệ 6 rắn (`mamañca kākañca`) xin được hút nọc ra; kệ 7 cua thả rắn trước, giữ quạ làm con tin; kệ 8 nhận diện tiền thân.

  Khoá tiêu biểu (trước → sau): `2.1` "Hắn thấy bằng chiếc hàm khổng lồ," → "Nó phì phò, xòe chiếc mang lớn," (`passasanto` là thở phì phò, không phải "thấy"; `phaṇa` là mang rắn, tiền lệ `ud2.1` "xòe chiếc mang lớn", `ja472:10.1` "xòe mang") · `2.2` "con rắn đã lọt vào giữa con cua;" → "con rắn lao tới con cua;" (`kakkaṭam ajjhapatto`; tiền lệ `sn47.6:1.1` `ajjhappattā` "lao xuống", `ja523:28.4` "đến gần") · `2.3` "vây quanh bạn bè và đồng hành," → "bạn muốn che chở cho bạn mình," (`paritāyamāno` là che chở; nhận định cũ về "trải ra, vươn ra" và "gọi bạn bè" không có căn cứ) · `3.1`–`3.2` → "Quạ, và cả rắn đen nữa, / con cua đi tìm mồi sẽ chẳng ăn;" (`na … adeyya`: cua không ăn hai con này) · `3.4`, `6.1` "cả hai ta" → "cả hai chúng tôi" (`hetumha`, ngôi thứ nhất loại trừ người nghe) · `4.2` thêm "tới chỗ có nước" (`dakāya`, bản cũ bỏ sót) · `5.1` "thân tôi đang chạy trốn" → "thấy tôi thân hình to lớn" (`pavaddhakāyaṁ`, tiền lệ `ja524:4.3` "thân đồ sộ") · `5.3` "cả thịt dê, thịt chim ưng, và cả thịt nữa" → "thịt thì ngon, lại béo và mềm" (`sādu` ngon, `thūla` béo, `mudu` mềm — ba tính từ của `maṁsaṁ`; "dê", "chim ưng" là bịa) · `5.4` "đã đem chết tôi" → "cũng sẽ quấy hại tôi" (`viheṭhayeyyuṁ`, cầu khiến) · `6.2` "xin ngài đứng dậy, cho tôi thấy rõ tai hại" → "thì hãy để người ấy đứng dậy, tôi sẽ hút nọc độc ra" (`poso` là "người ấy" ở cách chủ, ngôi ba; `visam āvamāmi` "tôi hút/nhả nọc ra"; nhận định cũ rằng `poso` là cách xưng tôn kính và "cáo gọi con cua" là bịa) · `6.4` → "trước khi nọc độc ngấm sâu vào người ấy" (`pure … gāḷham upeti maccaṁ`; đoạn ghi chú cũ "LỖI NGHĨA ĐÃ BẮT VÀ SỬA" đọc `visaṁ` là "kẻ hung dữ" — cũng sai) · `7.2` "cho đến khi con quạ nào bám vào thì mới thả" → "trong khi chờ, con quạ sẽ làm con tin" · `8.1` `Devadatto` → *Devadatta* (theo `ja514:39.4`) · `8.3` *Ānandabhadda* → *Ānanda hiền thiện* (theo `tha-ap1:3.2`, `tha-ap2:3.2`, 2/2) · `8.4` "còn ta lúc đó là Bà-la-môn Đạo sư" → "còn ta, bậc Đạo Sư, khi ấy là người bà-la-môn" (`satthā` đồng vị với `ahaṁ`, không phải tước hiệu của bà-la-môn; *bậc Đạo Sư* là dạng đa số của tầng, 624 lần). Giữ nguyên `1.1`–`1.3` (trùng nguyên văn `ja267:1.1`–`1.3`, 3/3 khớp) và các khoá tiêu đề.

  Mọi nhận định ngữ văn của các mục notes bên trên mâu thuẫn với mục này (về `phaṇa`, `paritāyamāno`, `poso`, `visaṁ`, `mudū`, "cáo") **không còn giá trị**; giữ lại chỉ như lịch sử.

  **Bất định còn lại (không chặn):** `7.2` `paṭibandhako` — chỉ xuất hiện một lần trong toàn bộ Pāli root đã ghim, không có bản Anh hay chú giải trong kho để phân xử; "làm con tin" là cách đọc theo ngữ cảnh (con quạ bị giữ lại cho tới khi người kia khỏi, `7.3`–`7.4`), nghĩa truyện không đổi nếu đọc là "bị giữ lại". `6.2` `visamāvamāmi` (dạng này chỉ có một lần trong Pāli root) đọc là `visaṁ āvamāmi` "tôi hút/nhả nọc ra", theo gốc `vamati` (tuôn ra, `sn45.153:1.1`) và theo mạch `6.4`. Người nói của kệ `3` không được Pāli nêu tên (rắn hoặc quạ); bản dịch không gán tên.

  **Phép kiểm:** tập khoá 37/37 khớp Pāli và đúng thứ tự; nháy đơn/kép khớp Pāli từng khoá 37/37; 0 cặp Pāli trùng nguyên văn trong chính bài (phép rỗng); 0 dấu lược ở cả Pāli và Việt; NFC sạch, 0 khoá rỗng. Không có số Pāli nào trong kệ.

  **Điểm (trước → sau):** `source_provenance` 9.5 → 9.3 (notes cũ chứa các khẳng định ngữ văn bịa) · `semantic_fidelity` 9.3 → 8.9 (đã sửa các lỗi nghĩa, còn hai từ hiếm đọc theo ngữ cảnh) · `grammar_logic` 9.2 → 8.9 · `terminology` 9.1 → 9.0 · `triangulation` giữ 7.5 (không có bản Anh, không có Việt hiện hành, chỉ có Pāli và tiền lệ nội tầng) · `vietnamese_clarity` 9.3 → 8.9 · `han_viet_balance` 9.3 → 9.2 · `ambiguity_integrity` 8.8 → 8.6 (lịch sử notes có nghĩa bịa; bất định còn lại đã ghi) · `segment_alignment` 10.0, `technical_integrity` 9.6 giữ. `final_score` 9.16 → 8.99. Không chạy `npm run validate` · `npm test` · `npm run check` · `npm run build` trong lượt này — để CI chạy.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 12 khoá chênh lệch lớn nhất → khác nghĩa 2: sửa 0, giữ 1 (`2.2`: `kakkaṭamajjhapatto` đọc được hai cách, `kakkaṭaṁ ajjhapatto` “lao tới con cua” (niggahita giữ trước nguyên âm nên viết liền) hoặc `kakkaṭa-majjha-patto` “rơi vào giữa [vòng kẹp của] con cua”, bản mù chọn cách sau và tự đánh dấu không chắc; giữ cách đầu vì khớp `ajjhapatta` (tiền lệ `sn47.6:1.1`) và mạch `2.3`–`2.4`, cua bắt rắn sau khi rắn xông tới), bất định 1 (`7.2` `paṭibandhako`: bản mù cũng không chắc, đọc “hãy còn bị giữ lại”; “làm con tin” và “bị giữ lại” cùng một hướng nghĩa, đã ghi từ trước). Mười khoá còn lại chỉ khác diễn đạt, giữ: `0.2`, `0.4`, `9.1` (tiêu đề), `3.1`–`3.2` (bản mù cắt dòng khác nhưng cùng nghĩa: cua tìm mồi không ăn quạ cũng không ăn rắn đen), `4.2`–`4.4`, `5.1`, `5.3` (`sādu`/`thūla`/`mudu` bản mù “ngọt, dày, mềm”, bản dự án “ngon, béo, mềm”: cùng vùng nghĩa). Mạch người nói và số lượng hai bản trùng nhau. Đọc lại đối kháng 37/37 khoá: nháy `“”` khớp Pāli từng khoá, không dấu lược, không số lượng, không còn chữ của loài khác (rùa, cáo) trong bản Việt. Không có bản Anh hay bản Việt độc lập khác. `triangulation` 7,5 → 7,7: một lần dịch lại độc lập hội tụ ở mọi chỗ trừ hai chỗ chính bản mù ghi không chắc; cùng họ công cụ nên không quá 8,0. Điểm khác giữ nguyên. Chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` trong lượt này; `technical_integrity` 9,6.

  Quyết định hội đồng biên tập 2026-10-16: A13 — `1.4`, `3.4` (bỏ dấu chấm thừa sau dấu đóng lời thoại, ví dụ `?”.` thành `?”`); C3 — `0.2` (tên nipāta "Nhóm N Kệ"); C4 — `3.3` (xưng hô trong lời thoại ngắn: một cặp duy nhất, bỏ "trẫm").
