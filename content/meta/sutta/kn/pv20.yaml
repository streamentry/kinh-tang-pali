notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng tham khảo tiếng Anh nào ở commit đã ghim cho uid này.
  Tiền lệ đếm được: `Petavatthu` -> Petavatthu 22/22 bài pv; `Ubbarivagga` -> Ubbarivagga 1/1 (chỉ pv22, cùng phẩm) — không có đa số thật sự, nên giữ đúng như pv22 để khỏi tạo cách thứ N+1. `Rathakārapetavatthu` -> Chuyện Ngạ Quỷ Người Kéo Xe (pv28) nên mẫu 0.3 là 8. Chuyện Ngạ Quỷ Cūḷaseṭṭhi. `bhante` -> bạch tôn giả (pv22:3.5). `janādhipa` -> nhà vua. `Bārāṇasī` 58 so với Varanasi 9 ở toàn tầng.
  `andhakavinda` giữ chữ Andhakavinda: tầng Việt dự án đã dùng 19 lần (sn6.13, an5.120, vv43, vv78). Ở đây nghĩa có thể là ngục tối tối thay vì địa danh — đã ghi, không tự quyết.
  `saṅgha`/`saṅghe` -> Tăng đoàn (52 lần ở toàn tầng, và đây là cách dùng phổ biến cho `saṅghe` là nơi nhận); đối chiếu: Tăng chúng 310 lần — hai cách đều có tiền lệ, ghi để người điều phối gộp.
  BẤT ĐỊNH ghi lại: (1) `Naggo kiso pabbajitosi` (1.1) — dịch xuất gia trần trụi, lại còn thẹn thùng; `nagga`/`kiso` còn có thể là nghèo khó và khiêm cung. (2) `gahapati` (2.2) dịch kẻ chăn bò; nghĩa gốc là gia chủ, nhưng trong truyện này nhân vật là người hầu chăn bò của nhà vua (pv28 đã dịch `Rathakāra` thành Người Kéo Xe). (3) `Passānubhāvaṁ aparimitaṁ mamayidaṁ` (11.1) dịch Sự đi ấy của tôi là vô hạn — 0 tiền lệ cho `passānubhāva`. (4) `paramiddhipatto` (10.3) dịch điểm đến tối thượng — 0 tiền lệ cho `iddhipatta`. (5) `Bhāṇavāraṁ paṭhamaṁ` (12.2) dịc Chuyên luận, phần thứ nhất — đúng 1 tiền lệ cho đúng chuỗi Pāli này; nhưng pv28:9.2 với `Bhāṇavāraṁ dutiyaṁ` lại dùng Chuyện kể thứ hai (1 tiền lệ), tức là trong kho đang có hai cách cho cùng công thức. Chọn khớp đúng chuỗi Pāli để không tạo biến thể mới; người điều phối nên chọn một cách cho cả hai và sửa pv28.
  Dấu lược: Pāli pv20 không có `…pe…` nào; đếm lược 0 = 0.
  Chốt `_hvi.py` sạch: 49/49 khoá, khoá thừa 0, NFC OK, ngoặc kép cân (`“` mở ở 1.1/2.1/5.1/6.1/8.1/10.3 và đóng ở 1.4/2.4/5.4/7.4/8.4/11.4 — đúng như Pāli, trong đó 6.1 mở và 7.4 đóng vì hai người nói tiếp). Hai khoá giữ nguyên Pāli là Petavatthu (0.1) và Ubbarivagga (0.2), thuộc khối tiêu đề `:0`.
  Lượt cải thiện 2026-10-11 (thay thế các mục cũ nêu trên về nghĩa của từng khoá; các mục cũ về tiền lệ tên sách, dấu lược và bất định (4)–(5) vẫn là lịch sử): đọc đối kháng Pāli↔Việt cho thấy bản trước sai nghĩa ở gần như mọi khổ, nên đã viết lại 47/49 khoá (trừ 0.1, 0.2), giữ nguyên tập khoá và thứ tự. Điểm cũ không phản ánh đúng chất lượng bản cũ.
  Lỗi nghĩa đã sửa: (a) 1.1–1.4 do vua nói với ngạ quỷ — `Naggo kiso pabbajitosi` là "trần truồng, gầy ốm, là người xuất gia" (không có "thẹn thùng"), `bhante` chỉ là hô cách, `vittaṁ paṭipādaye` là "cung cấp của cải" (không phải "trả nợ"). (b) 2.1–2.4 `dūraghuṭṭhaṁ` = vang danh đi xa (không phải "chỗ khó đi lại"); `gahapati aḍḍhako` = gia chủ giàu có (không phải "kẻ chăn bò xa xôi, nghèo nàn"; nghĩa "đã nghèo" trong 2.2 là bịa); `dussīlyena` = do hành vi vô đạo đức (bản cũ biến thành người "đáng kinh khỉnh"); `yamavisayamhi patto` = đã đến cõi của Yama. (c) 3.1: `sūcikāya kilamito` là mệt lả bởi sự châm chích, bản cũ bịa ra "dùng que nhỏ đánh đập" và đảo chủ thể thành "Ngài"; 3.4 `paramhi loke` = ở đời sau (không phải "cõi trời cao nhất"). (d) 4.2–4.4: chữ vô nghĩa "bối bổ" thay `dānaṁ`/`dakkhiṇā` ở cả bài, nay là "vật thí"/"phần cúng dường" (tiền lệ pv10, pv14, pv15: "hồi hướng phần cúng dường"); `bhottuṁ` = để ăn (bản cũ "dùng thêm"); 4.4 là lời ngạ quỷ tự nói, không phải lời con gái. (e) 5.1–5.4: người nói là nhà vua, đảo "bạch tôn giả"/"tôi đã nghe" sai chủ thể — nay `suṇomā` = "chúng tôi sẽ nghe"; `Eyyāsi khippaṁ` = hãy mau đến. (f) 6.2: `Bhuñjiṁsu bhattaṁ na ca dakkhiṇārahā` là các Bà-la-môn ăn bữa cơm và không đáng nhận cúng dường (bản cũ "cướp mất phần ăn"); 6.3 `paccāgami rājagahaṁ` = trở về Rājagaha (bản cũ "cửa thành"). (g) 7.4/8.4: `pīṇito` = no đủ; 8.1–8.4 là lời ngạ quỷ khuyên nhà vua (bản cũ đảo thành "Vua đã cúng dường") với `ādisa` là mệnh lệnh hồi hướng; 7.4 `tuvaṁ` bỏ "ngươi" vì vua gọi `bhante`, nay "ngài". (h) 9.4: `petassa` = ngạ quỷ (bản cũ "con vật"); 9.3 `tathāgatassa` = Đức Như Lai; 9.1–9.2 chủ ngữ của `ārocesi`, `ādisittha` là nhà vua. (i) 10.3: `Yakkhohamasmi` = tôi là dạ-xoa (bản cũ "ngạ quỷ, là điểm đến tối thượng của chúng sinh" — bịa), `paramiddhipatto` = đã đạt thần thông tối thượng, trùng nguyên Pāli với pv21:10.3 nên dùng đúng bản ở đó. (j) 11.1–11.4: `anubhāva` = oai lực (tiền lệ pv36), `tayānudiṭṭhaṁ` là điều do vua hồi hướng (bản cũ đảo thành "tôi đã tự tay trao"), `manussadevā` là hô cách "tâu vị trời giữa loài người" (tiền lệ `naradeva` ở pv38:54.3), không phải "cõi của loài người và các chúa thiên"; `Yāmi` = tôi đi (đi đây), không phải "sẽ đi đến cõi". (k) 12.2: `Bhāṇavāraṁ paṭhamaṁ` = "Phần tụng đọc thứ nhất" (tiền lệ vv28:11.1; bản cũ "Chuyên luận" là chữ sai). (l) Tiêu đề 0.3/12.1: `Cūḷaseṭṭhi` dịch thành "Tiểu Trưởng Giả" theo cách dịch `Cūḷa-` thành "Tiểu" ở tiêu đề kinh (mn14, mn27, mn35, mn40, mn44) và `seṭṭhi` là trưởng giả; không xác định được đây là tên riêng hay danh từ chung, đã đổi `translationTitle` cho khớp.
  Điểm 2026-10-11, tiêu chí đổi: semantic_fidelity 9.2→8.8, grammar_logic 9.3→8.9, terminology 9.3→8.9, vietnamese_clarity 9.3→8.8, han_viet_balance 9.4→9.3, ambiguity_integrity 9.0→8.6, technical_integrity 9.8→9.6 (không chạy `npm run validate`, `npm test`, `npm run check`, `npm run build` ở lượt này nên không tuyên bố technical gate pass). Giữ nguyên source_provenance 9.6, segment_alignment 10.0 (49/49 khoá, đúng thứ tự Pāli), triangulation 7.0 (không có tầng tham khảo tiếng Anh độc lập). Hạ điểm vì các bất định dưới đây còn thật; sau lượt này không còn lỗi nghĩa nào đã biết nhưng chưa sửa. final_score = 8.95 là trung bình số học thô của 10 điểm.
  Bất định còn lại (không phân xử được, không tự đoán): (1) `dīno` (2.2) dịch "hèn mọn"; có thể là "bủn xỉn" (hợp với `adātā` ngay sau) hoặc "đáng thương". (2) `sūcikāya` (3.1) giữ nghĩa đen "cơn châm chích"; ngữ cảnh 3.2 gợi cơn đói nhưng không thêm chữ "đói" vào lời kinh. (3) `nipatitvā` (9.1) dịch "đi xuống"; có thể là "lao tới/vội đến". (4) `paṭipādaye` và `sakkuṇemu` (1.3–1.4): đọc là "biết đâu chúng tôi có thể; tôi có thể cung cấp của cải", câu Pāli lược nên cấu trúc có thể khác. (5) `parivisayanti brāhmaṇā` (4.3): đọc `brāhmaṇā` là tân ngữ ("dọn mời các Bà-la-môn"); nếu là chủ ngữ thì nghĩa khác. (6) `pūjaṁ kassaṁ` (5.2) dịch "cúng dường"; bài pv5 dùng "tôn kính" cho `pūjā` dành cho ngạ quỷ. (7) `na mayhamatthi samā sadisā mānusā` (10.4): `mānusā` có thể là danh từ số nhiều (loài người) hoặc tính từ nữ tính cho một vật khác; giữ "loài người". (8) `bahūhi` (11.3) không có danh từ đi kèm, bổ "thứ" để câu thành. (9) `saddhāyitaṁ hetuvaco` (5.4) đọc "lời nói có nguyên do, đáng tin". (10) Công thức `Bhāṇavāraṁ dutiyaṁ` ở pv28:9.2 vẫn là "Chuyện kể thứ hai", lệch với công thức này; ngoài phạm vi lượt này, đề nghị sửa pv28.
  Tự kiểm lượt này: 49/49 khoá, tập và thứ tự khớp Pāli, nháy kép/đơn khớp Pāli từng khoá (0 lệch), NFC OK, không Pāli lọt sang Việt ngoài tên riêng (Bārāṇasī, Rājagaha, Andhakavinda, Yama), Pāli trùng nguyên văn trong bài 2 cặp (5.3/7.3, 6.4/10.2) và Việt khớp, Pāli không có `…pe…` và Việt không có `…`; không có số lượng Pāli để kiểm.
