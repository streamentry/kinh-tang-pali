    + `64.5`–`64.6` `bharatha bhaddaṁ vo` → "hãy nuôi dưỡng ta, chúc các nàng an lành"; `bhattā` → "phu quân". `65.3`–`65.4`, `66`–`67`: `rājā` là thân phụ của Dīghāvu (đã vượt bùn lầy, đã vào đại lộ), còn Dīghāvu nói mình bước vào con đường dẫn đến cõi dữ; suy từ mạch, Pāli không ghi người nói. `68.1` `tassa te svāgataṁ` → "chào đón ngài".
