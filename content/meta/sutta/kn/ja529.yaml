  Quyết định hội đồng biên tập 2026-10-16: A13 — `1.4`, `11.4`, `21.4`, `63.4`, `65.4` (bỏ dấu chấm thừa sau dấu đóng lời thoại, ví dụ `?”.` thành `?”`); B21 — `38.2`, `39.2`, `40.2`, `62.4`, `64.4`, `65.2` (`raṭṭhavaḍḍhana` = bậc làm hưng thịnh xứ sở (DPD)); C3 — `0.2` (tên nipāta "Nhóm N Kệ").

  Nghiên cứu nguồn ngoài 2026-10-16: H.T. Francis (dịch), The Jātaka vol. V (PTS 1905, phạm vi công cộng; đọc qua static.sirimangalo.org/old/jataka/5.htm, Jātaka 529 tr. 127–133); đã đối chiếu toàn bài (kệ 1–68, các nhóm lặp 41–55 theo mẫu); không sửa khoá nào, nghĩa khớp Francis ở mọi khoá có nội dung riêng (tám điều tốt của tỳ-kheo không của cải, ví dụ con quạ trên xác voi, sáu mươi ngàn làng/voi/ngựa/xe/bò). Bất định: 36.1–36.2 `rājakattāro … suddā veyyattamāgatā` (Francis đọc 'my charioteers… a worthy king', nghĩa là người lập vua/xa phu; không có chú giải Pāli trong tay để phân xử giữa `suddā` ghim và cách đọc 'xa phu'; theo chính sách chữ Pāli ghim giữ 'Sudda' như cũ), 59.3 `vohāro` (chú thích Francis: chú giải giải thích là 'monster fish' hoặc 'whirlpool'; bản dịch 'dòng nước cuốn giữ' chưa xác nhận được).

  Rà từng chữ bằng DPD 2026-10-16: 289 khoá đã rà (đối chiếu thêm chú giải CST Ja 529 và bản Indacanda [529]); sửa `12.1` (`sadāpi` = luôn luôn, DPD always, chú giải `sabbakālaṁ bhadram-eva`; bỏ "thứ nhất" không có trong Pāli), `28.4`/`30.2` (`agatī yattha pakkhinaṁ` = nơi loài chim không thể tới, DPD agati 2 "where one cannot go", chú giải `pakkhīnaṁ agati`; bỏ "chốn nương thân" thêm ý), `44.1`/`47.1`/`50.1` (`gāmaṇīyehi` = các đội trưởng, DPD gāmaṇīya "squadron leader", chú giải `hatthācariyehi`/`assācariyehi`/`rathikehi`; đồng bộ với `ja539:50.1` … `103.1` vì Pāli `Ārūḷhā/Ārūḷhe gāmaṇīyehi` trùng và cùng ngữ cảnh voi, ngựa, xe trang bị; thay "các vị trưởng làng"), `52.2` (`rohaññā` = lông đỏ, chú giải `rattavaṇṇā`, DPD rohiṇī "red"; thôi giữ phiên âm), `61.1` (`kambusahatthāyo` = tay đeo trang sức bằng vàng, DPD kambu 1 (comm) gold, chú giải `kambusaṁ vuccati suvaṇṇaṁ`, Indacanda "cánh tay bằng vàng"), `64.6` (`bhavāmi` hiện tại, bỏ "sẽ"); bất định `13.4`/`14.4` (`koci`: chú giải là phiền não), `14.3` (`nibbuto piṇḍo`), `36.1` (`ko nu me`: chú giải `kuhiṁ nu ime`), `57.3` (`jessantaṁ`: DPD không có, chú giải `vicarantaṁ` = đi lại; trùng `ja547:66.3` nên chưa đổi riêng), `59.3` (`vohāro`: chú giải thuỷ quái/quỷ nước/xoáy nước), `64.5` (`bharatha`: DPD nuôi dưỡng, chú giải `icchatha`). Giữ `44.2` "móc câu" cho `aṅkusa` theo công thức chung của tầng và Indacanda.
  Lượt hoàn thiện 2026-10-17: thống nhất thuật ngữ `3.2` `raṭṭhesu` "các quốc độ" → "các xứ sở" (cùng chữ với `15.3`, `17.3` và `raṭṭhavaḍḍhana` "xứ sở" theo B21); `12.6` `subbatā` "giữ tròn giới nguyện" → "các vị có giới hạnh tốt" (cùng chữ với `18.6` "vị có giới hạnh tốt", như `ja547:53.6`). Giữ có lý do: `nibbuta` "tịch tịnh" (`5.6`, `7.4`, nói về người) khác "lắng dịu" (`14.3`, nói về món ăn, bất định); `ḍayhamāna` "bị thiêu đốt" (`5.6`, `7.4`, nghĩa bóng) khác "bị thiêu cháy" (`16.3`, thành phố cháy thật); `manorama` theo vật được tả (`4.4`, `40.4`). Thêm 10 chú thích (`12.1`, `13.4`, `14.3`, `36.1`, `44.1`, `52.2`, `57.3`, `59.3`, `61.1`, `64.5`) vào `content/comment/vi/project/sutta/kn/ja529_comment-vi-project.json`, nêu chú giải CST, DPD, Indacanda, Francis. Các câu sau trong ghi chú cũ đã bị thay: "`triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`" (hiện triangulation 8,4, status `review` theo waiver `no-upstream-english`; blocker vẫn ghi trong hồ sơ, kể cả câu "giữ draft" trong `blocking_errors`); "`0.2` Bộ Sáu Mươi Bài Kinh" (nay "Nhóm Sáu Mươi Kệ", C3); "`raṭṭhavaḍḍhana` → bậc làm hưng thịnh quốc độ" (nay "xứ sở", B21); "`12.1` `sadāpi` … đọc là điều tốt lành thứ nhất" và "Bất định cũ giữ nguyên (12.1 `sadāpi`" (nay "Luôn luôn", lượt DPD); "`49.3` … không thêm da vào thân kinh" (nay "có da báo và cả da hổ", G7); "`52.2` … giữ phiên âm `rohaññā`" và `rohaññā` trong danh sách chữ giữ phiên âm (nay "lông đỏ"); "`59.3` … việc buôn bán ở đó nắm giữ lấy" (nay "dòng nước … cuốn giữ", lượt 10-15); "`61.1` … tay đeo vòng vỏ ốc" (nay "trang sức bằng vàng").
