    + `8.2` `saṅghāṭipāruto` → "khoác y tăng-già-lê" theo `thag17.2`. `9.4` `dhammaṁ kāyena phassayaṁ` → "tự thân xúc chạm Pháp" (không thêm "chứng"). `10.1` `niraṅkatvā` → "ruồng bỏ" (nghĩa gốc "đặt sang một bên").
    + `27.3` `vanacetyāni` → "đền miếu trong rừng" (cũng có thể là "cây thiêng", "nơi đáng chiêm ngưỡng trong rừng"). `27.4` `na palettha` → "không bay đi khỏi". `28.1` `otaraṇī gaṅgā` → "sông Gaṅgā chảy xuống". `29.3`–`30.2`: bốn hướng không có động từ, đọc là "nó chẳng tìm được hòn đảo nào", và `agatī yattha pakkhinaṁ` ở `28.4` và `30.2` giữ cùng một câu dịch; ở `30.2` cũng có thể đọc "ở nơi mà loài chim không còn chỗ nào để đến". `30.3` `pāpattha` → "rơi xuống". `31.2` `susū` → "cá sấu susu" (giữ phiên âm). `31.4` `vipakkhakaṁ` → "mất cánh" (cũng có thể là "không còn người giúp sức").
    + `32.3` `vamissanti` → "nhả bỏ"; `32.4` `kākapaññāva te vidū` → "họ được biết đến là kẻ có trí như quạ" (chủ ngữ của `vidū` không phân xử được). `33.4` `kāhasi vā na vā` → "làm hay không làm" (không nêu tân ngữ).
    + `36.1`–`36.2` `rājakattāro … suddā veyyattamāgatā`: câu hỏi mơ hồ; dịch "những người lập vua này, những người Sudda đã đạt đến sự thông thạo" (giữ Sudda theo `dn27`); cũng có thể `suddā` là `suddhā` ("thanh tịnh"). `38.2`: chỉ rõ `dīghāvu` là tên hoàng tử (64.4 tự xưng), không phải lời gọi "trường thọ".
