  **Sửa lan 2026-10-13** (terminology fix; thay thế các chỗ ở trên ghi "Sakka Đấng Phá Thành" theo `pv17`, `vv62`): `63.2`, `64.2` `sakko purindado` *Sakka Đấng Phá Thành* → *Sakka Purindada*. `Purindada` là tên riêng (biệt danh của Sakka, "người bố thí trước"), tầng Việt giữ phiên âm ở `dn20:14.10`, `bv17:9.2`, `mn56:29.37`, `ja522:8.1`, `ja522:13.2`, `ja535:30.1`, `vv64:1.4`, `pv17:11.2`, `pv38:18.2`, `pv38:19.2`, `vv83:11.2`; dịch nghĩa *Đấng Phá Thành* chỉ ở một số khoá (`ja538`, `ja541:4.4`, `tha-ap487`, `vv62`, `pv21`) mà ghi nhớ lại vẫn còn ngoài lát này, báo người điều phối.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 60 khoá chênh lệch lớn nhất → khác nghĩa 0: sửa 0, giữ 53 (chênh lệch ở diễn đạt, tên riêng "Raṭṭhavaḍḍhana" so với "bậc làm hưng thịnh quốc độ", "deva" so với "đại vương", và ba chỗ bản mù lệch dòng: `9.3`–`9.4`, `11.3`–`11.4`, `66.3`–`66.4`, nơi bản dự án đi đúng thứ tự Pāli: "người không phải là kẻ khốn khổ khi tự thân xúc chạm Pháp"; "mong rằng ngài được ngủ yên ổn khi đã đến nơi đây"; "không gai góc, không bụi rậm" là định ngữ của `mahāpathaṁ`), bất định 7 (`30.3` `pāpattha` giữ "rơi xuống", bản mù đọc "chịu khốn cùng"; `59.3` `vohāro`; `14.3` `nibbuto piṇḍo`; `43.4` `hemakappanavāsasā`; `47.2` `illiyā…`; `12.1` `sadāpi`; `36.1` `rājakattāro`; cả bảy đã có ở mục bất định trên và bản mù cũng không chắc ở sáu chỗ). Đọc đối kháng lại cả 289 cặp: số đếm (sáu mươi ngàn, mười sáu ngàn, bảy dãy `dutiyampi`…`aṭṭhamampi`) đúng; người nói (nhà vua / con trai / các thiếu nữ) và "ta" so với "cha" nhất quán; 5 nhóm Pāli trùng trong bài mà Việt khác đều có lý do ghi ở trên; không đổi khoá nào. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đoạn song song tha-ap487:5.1, vv83:11.3, ja545:174.2; không có bản Việt nguyên bài): sửa 2 khoá. 25.2 `vuyhamānaṁ mahaṇṇave` (sai logic: bản cũ "đang bị cuốn ra biển cả" khiến xác chết đã ra biển ngay từ đầu, trong khi 28.1–28.3 mới kể sông Gaṅgā đưa con quạ `samuddaṁ ajjhagāhāsi`; `mahaṇṇave` là định sở cách "trên dòng nước lớn", cf. ja545:174.2 `oghe mahaṇṇave`); 59.3 `vohāro tattha gaṇheyya` (sai nghĩa: "việc buôn bán … nắm giữ lấy" không có nghĩa; `nāvaṁ` ở 59.1 là tân ngữ của `gaṇheyya`, nên chủ ngữ phải là thứ níu giữ được con thuyền giữa biển; `vohāra` (vi-ava-√hṛ, "sự cuốn đi") đọc là "dòng nước … cuốn giữ lấy" — vẫn bất định: có thể là thuỷ quái hay hiểm hoạ khác trên biển, không phân xử được bằng Pāli đã ghim). Giữ: 63.3 khớp tha-ap487:5.1/6.3, vv83:11.3; 5.6/7.4 theo thag18.1:10.4 như đã ghi. Bất định cũ giữ nguyên (12.1 `sadāpi`, 30.3 `pāpattha`, 32.4 `vidū`, 36.1–36.2 `rājakattāro … suddā`, 52.2 `rohaññā`).

