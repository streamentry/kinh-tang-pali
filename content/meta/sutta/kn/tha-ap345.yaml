notes: |-
  Dịch trực tiếp từ Pāli root đã ghim; đủ 32/32 khoá trong `all` của lát n2.
  ĐỘ ĐO `:0.3` (lát n2 đo lại, đi đúng hướng lát s7 là so với Pāli): Pāli của ba bài trong
  lát đều KHÔNG có số ở `:0.3` ⇒ BỎ số thứ tự ở `:0.3`. Nhóm đo: 242 bài tha-ap mà Pāli
  `:0.3` không có số và Việt đã dịch `:0.3` thì 240/242 = 99,2% cũng không có số (lát s7 đo
  289/291 = 99,3%). Nhóm đối chứng Pāli CÓ số thì đa số vẫn giữ (66/115), nên quy tắc là
  khớp Pāli chứ không phải bỏ hết. Số thứ tự đặt ở khoá đóng `:9.1` theo `tatiyaṁ`; đo
  `tatiyaṁ` toàn tầng: 261/265 dùng `Thứ ba`.
  CÔNG THỨC `:0.3` đo trên 242 bài: `Bài Kệ Tuyên Ngợ …` 128 (52,9%), `Ký Sự …` 66,
  `Bài Kệ Tuyên Ngôn …` 46. Pāli `Dhajadāyakattheraapadāna` TRÙNG NGUYÊN VĂN với
  tha-ap60:0.3, nên tôi dùng lại đúng một cách dịch đã có: `Bài Kệ Tuyên Ngợ Về Trưởng
  Lão Dhajadāyaka`. Cả 242 bài ấy đều GIỮ tên Pāli của bậc trưởng lão trong tiêu đề.
  `:9.1` cũng trùng công thức với tha-ap60:12.1 (`Bài Kệ Tuyên Ngợ Về Trưởng Lão
  Dhajadāyaka, thứ tám.`).
  TIỀN LỆ ĐẾM ĐƯỢC: 0.1 `Therāpadāna` 348 bài; 0.2 `Ekapadumiyavagga` đo 9 bài trong
  cùng phẩm: `Phẩm Ekapadumiya` 7 (đa số) vs `Phẩm Bậc Một Hoa Sen` 2 (tha-ap346,
  tha-ap351) — chọn đa số; 7.1 `Bốn vô ngại giải,` 365 bài trùng; 7.2 `…pe…` → `…` 637
  bài trùng; 7.3 `đã làm tròn lời dạy của Đức Phật”.` 332 bài trùng; 8.1 trùng nguyên văn
  với tha-ap60:11.1 nên dùng lại đúng một cách.
  DÙNG LẠI NGUYÊN VĂN khi Pāli trùng: `lokajeṭṭho narāsabho;` 9 bài → `bậc Trưởng
  Thượng thế gian, đấng Nhân Ngưu;`; `Tena kammena sukatena` 12 bài → `Nhờ nghiệp lành
  khéo làm ấy,`; `cetanāpaṇidhīhi ca;` 14 bài → `cùng với tâm nguyện và chí hướng;`;
  `Jahitvā mānusaṁ dehaṁ` 6 bài → `sau khi từ bỏ thân người,`; `tāvatiṁsamagacchahaṁ.`
  8 bài → `ta đã đến cõi trời Ba mươi ba.`; `devarajjaṁ akārayiṁ;` 1 bài (tha-ap344)
  → `ta đã làm ra vương quyền nơi chư thiên;`; `cakkavattī ahosahaṁ.` 3 bài → `ta đã làm
  Chuyển Luân Vương.`; `Padesarajjaṁ vipulaṁ` 8 bài → `Vương quốc rộng lớn ấy,`;
  `gaṇanāto asaṅkhiyaṁ;` 2 bài → `đếm không hết, vô tận;`; `Anubhomi sakaṁ kammaṁ` và
  `pubbe sukatamattano.` mỗi cặp có 4 bản Việt với 4 cách khác nhau, tôi theo tha-ap459
  (`Ta thọ hưởng nghiệp lành của mình,` + `đã khéo tạo từ thuở xa xưa.`) vì hai câu đó đi
  liền nhau trong cùng một bài nên phải nhất quán trong bài.
  `Duggatiṁ nābhijānāmi,` là câu khó nhất của tầng: đo được 15 cách, đa số tuyệt đối
  `Ta không biết mình rơi vào khổ đau,` 119 lần, kế đến `Tôi không còn biết đến đọa xứ
  nào` 63. Tôi chọn `Ta không biết mình rơi vào khổ đau,` vì (a) là đa số đo được và
  (b) trong bài này câu 5.3 đứng sau `khi ta làm thiện nghiệp ấy;` nên `Ta` mạch lạc hơn,
  khớp ngôi kể của 5.2 và 4.3. Nhóm biến thể `khổ xứ`/`đọa xứ` chiếm 245 lần nhưng
  đó là hai cách diễn đạt khác trên cùng nghĩa, không phải lỗi; biên tập có thể gộp sau.
  `Dvenavute ito kappe` đo 39 bài, `Vào chín mươi hai kiếp trước,` 13 và `Vào chín mươi
  hai kiếp trước đây,` 9; tôi dùng `Vào chín mươi hai kiếp trước đây,` vì `ito` nghĩa là
  `từ đây đếm lùi`, cần mốc quá khứ.
  BẤT ĐỊNH LỚN NHẤT, ĐÃ GHI THẲNG VÀO `blocking_errors`: `tha-ap345:3.1`
  `Satānaṁ tīṇikkhattuñca,` và `:3.3` `Satānaṁ pañcakkhattuñca,`. Đo trong toàn Pāli
  ghim, `Satānaṁ` luôn đứng trước một số-`ikkhattu` (11 lần `Satānaṁ tīṇikkhattuñca`, 11
  lần `Satānaṁ pañcakkhattuñca`) và còn đứng trước số nhiều ở chỗ khác (`Satānaṁ
  sampajānānaṁ,` `Satānaṁ cakkavattīnaṁ,`), nên nó đọc là `bảy`. Nhưng `tīṇikkhattu` =
  ba trăm và `pañcakkhattu` = năm trăm, mà cách dịch sẵn có trong kho BỎ mất cả hai số
  này: tha-ap344 và tha-ap375 (2 bài, cùng Pāli) dùng `Cả bảy món báu quý giá,` và
  `Cũng cả năm món báu quý giá,`; tha-ap459:6.3 dùng `Cũng cả trăm món báu cùng năm
  món quý;`. Tôi theo tiền lệ 2 bài vì luật của kho là Pāli trùng nguyên văn thì dùng
  lại nguyên văn, và vì thám hiểm bịa ra một cách số thứ tư còn tệ hơn — nhưng tôi KHÔNG
  coi đây là đã giải quyết xong. Người biên tập nên quyết một lần cho cả 13 bài tha-ap
  đang chứa hai dòng này, và sửa cả 3 tệp đã có nếu chốt theo hướng giữ số.
  BẤT ĐỊNH KHÁC: `tha-ap345:1.3-1.4` `Tayopadhikkhaye disvā, / dhajaṁ āropitaṁ mayā.` — `Tayopadhikkhaye`
  không có bản Việt nào trong kho và cũng không xuất hiện ở nơi khác trong Pāli ghim; hai
  chữ cuối `ikkhaye` còn bị đọc theo hai hướng khác nhau ngay trong kho
  (`Yathā rattikkhaye patte,` = ban đêm, còn `Vimutto upadhikkhaye.` được dịch
  `giải thoát khi các chấp thủ tan biến`, tức theo nghĩa `upadhi`). Bản nháp đầu đã dịch
  `ta thấy sau ba kỳ hạn,`; tôi đã sửa thành `ta thấy vào kỳ thứ ba,` — giữ số và giữ cả
  sự mơ hồ, không chốt bừa một nghĩa không có chứng cứ. Câu 1.4 (`cờ phướn của ta đã dựng
  lên.`) theo văn bản chùng tha-ap60:1.4 `dhajamāropayiṁ ahaṁ.`. Đây là suy luận từ ngữ
  cảnh, không phải tra từ điển, nên `ambiguity_integrity` bị hạ xuống 9.0.
  `tha-ap345:6.3-6.4` — `Khomadussehi chādeyyaṁ` ở tha-ap497:6.3 được dịch `phủ kín lá
  cỏ chằng chịt,`, tức không giữ `kho-madu-dussa` (vải tàn tích). Pāli của bài này
  `Khomadussena chādeyyaṁ` KHÁC (khác công cụ `dussehi`/`dussena`) nên không ràng buộc
  trùng nguyên văn, và tôi dịch theo Pāli: `được phủ kín bằng tấm vải tàn tích,` —
  khác tha-ap497 một cách, ghi ở đây để biên tập gộp nếu thấy hai bài nên đồng nhất.
  `6.4` `tadā mayhaṁ kate phalaṁ.` (`kate` = rút ra, `mayhaṁ` của ta) không có bản Việt
  nào; tôi dịch `đó là quả báo của tấm vải mà lúc ấy ta đã lấy ra.`, bám theo cấu trúc
  `…assidaṁ phalaṁ` đã có ở tha-ap336/tha-ap385/tha-ap497.
  `4.3` `Anubhomi sakaṁ kammaṁ` — chọn `nghiệp lành` vì `sakaṁ` là `sukatā` (lành), và
  `sukatamattano` ở 4.4 là `sukatam` nữa, giữ nhất quán trong bài.
  `2.3-2.4` tôi dùng `ta` cho cả hai câu (`sau khi từ bỏ thân người` / `ta đã đến…`)
  vì tiền lệ đã dùng `ta` ở đúng hai câu đó (`sau khi từ bỏ thân người,` 6 lần; `ta đã đến
  cõi trời Ba mươi ba.` 8 lần).
  `1.1` `Tisso nāma ahu satthā,` — `Tisso` là tên riêng của bậc Đạo Sư trong bài kệ, tôi
  giữ nguyên Pāli `Tisso`; đối chiếu `Vipassī nāma bhagavā` ở tha-ap113/tha-ap117 dịch
  `Đức Thế Tôn ấy tên là Vipassī,`.
  `technical_integrity` = 9,6 vì bị cấm chạy cổng: chưa chạy `npm run validate`, `npm test`,
  `npm run check`, `npm run build`. Đã tự kiểm: đủ 32/32 khoá, NFC, cân ngoặc kép trên cả
  bài (mở ở 1.1, đóng ở 7.3), `…pe…` giữ đúng một `…`, không Pāli lọt vào bản Việt, không
  trùng nguyên văn Pāli — tất cả đều qua `_hvi.py` `kiểm()`.