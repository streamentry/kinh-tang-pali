notes: |-
  **Blocker thật: không có tầng Anh.** Không có `ja193_translation-en-sujato.json` trong `kn/ja/` tại commit đã ghim. Tôi dịch từ Pāli một mình và đặt `draft`; không tự nâng điểm để né. Vì vậy `:1.3`–`:1.4` (câu khó nhất của bài) chỉ đứng được trên Pāli, và tôi hạ `semantic_fidelity`/`ambiguity_integrity` xuống vì lý do đó.

  **Thuật ngữ, đếm được.** `Ruhakavagga` → *Phẩm Thằn Lằn*: **4 tiền lệ đúng khoá** (`ja195`, `ja196`, `ja197`, `ja198:0.3`). Đây là chỗ tôi suýt sai — bản nháp đầu định dịch `ruhi` là *cây nứa*; tra tiền lệ mới thấy `ruhakā` ở đây là *thằn lằn* (monitor lizard), đúng nhóm truyện của `ja189`–`ja198`. `Dukanipāta` → *Tập Kẻ Đau Đớn* (đa số 26:7, xem `ja181`). `ludda` → *tham lam* (`ja206: luddako` → *kẻ tham lam ơi*). `kaṇṇanāsā` → *cắt tai mũi* (`an4.121`, `mn13`, `ud3.2` đều viết *chặt tai, mũi* / *cắt tai, mũi*). Tên `Cūḷapadu` đặt mới, 0 tiền lệ: `cūḷa` + `paduma` = *hoa sen nhỏ*; tôi **không** thêm màu — `paduma` xuất hiện trong tầng chỉ ở *Hoa Sen Hồng* của cõi địa ngục, không đủ cơ sở để gắn màu vào tên bài.

  **Cú pháp `:1.1`–`:1.2` khó, đã cân nhắc kỹ.** `Ayameva sā ahamapi so anañño` đọc là *người các chị nói đó, chính là tôi, chẳng phải ai khác*; `Ayameva so hatthacchinno anañño` là *chính người bị túm lấy tay ấy, chẳng phải một ai khác*. `sā` và `so` ở đây đều là vị ngữ chỉ người đang bàn, và `anañño` lặp ở cả hai câu — tôi giữ hai lần phủ định nhưng đổi cách diễn đạt ở câu hai để hai câu kệ liền nhau không lặp nguyên văn. `hatthacchinna` **không có tiền lệ nào trong toàn tầng**; tôi dịch *bị túm lấy tay* theo nghĩa thành pháp (bị túm giữ để trừng trị), và ghi ở đây là điểm còn bất định.

  **Bất định đã ghi.** `:1.3` `Yamāha ‘komārapatī maman’ti`: `komārapatī` là *kẻ cưới vợ từ thuở nhỏ* và `māman` là *vợ*, nên câu là *kẻ các chị gọi là ‘vợ của kẻ cưới vợ từ thuở nhỏ’*. Cách đọc này khớp với câu sau (*chẳng có sự thật nào như thế ở nữ giới*) và với việc nữ chính lấy lại danh tính bị khinh thường, nhưng tôi **không** chắc tuyệt đối. `Imañca` ở `:2.1` và `Imissā ca` ở `:2.3` tôi dịch *kẻ đáng thương ấy* / *Người ấy nữa*; `pāpapatibbatāya` tôi hiểu là *bị đưa đến cõi lành xấu*.**Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm — ở lát này chỉ 0/155 khoá Pāli đủ 40 ký tự, nên chốt tự kiểm 0% và assertion còn lại không tự chạy; phần tôi tự kiểm: 13/n khoá có mặt và không thừa khoá, đúng segment ID, mọi chuỗi NFC, không khoá rỗng, không khoá nội dung nào trùng nguyên văn Pāli, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài và không bao giờ âm, không còn `(…)`, không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (lát này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Jātaka không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja193:0.2` mang Pāli `Dukanipāta` được
  đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  VIỆC BIÊN TẬP của người điều phối (cùng PR): khoá `ja193:0.3` mang Pāli `Ruhakavagga` được
  đổi *«Phẩm Thằn Lằn»* → *«Phẩm Dây Leo»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã
  ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi
  tầng tên **không có** mục này; quyết bằng song ngữ Pāli **trong chính phẩm** — `ja191:1.1–1.3`: `"Api ruhaka chinnāpi, / jiyā sandhīyate puna;"` (dây bị cắt, sợi dây vẫn ghép lại), và bản Việt đã có *"Dây cung … sợi dây …"*. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of
  the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta` và **6** cho
  `Asadisavagga`: đó là lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách
  mới. `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài này.

  **Giải quyết draft 2026-10-12.** Đọc đối kháng lại cả 13 khoá từ Pāli; **8/9 khoá kệ có lỗi nghĩa thật** (`:1.1`–`:2.4`) nên đã viết lại. Các mục cũ ở trên về *"Cú pháp `:1.1`–`:1.2`"* (người nói là nữ, "các chị", *bị túm lấy tay*) và *"Bất định đã ghi"* (`komārapatī` = *vợ của kẻ cưới vợ từ thuở nhỏ*, `māman` = *vợ*, *kẻ đáng thương*, *dùi gỗ*, *bị đưa đến cõi lành xấu*) **bị thay thế hoàn toàn** bởi mục này; phần thuật ngữ `Ruhakavagga`/`Dukanipāta` đã được người điều phối chuẩn hoá và không đổi ở đây.

  **Các lỗi đã sửa.** (1) `hatthacchinno` = *bị chặt tay* (hattha + chinna), không phải *bị túm lấy tay*; khớp `mil2:8.7` *"bị chặt tay"* và cụm `hatthampi chindante` trong `mn13`/`an4.121` (*chặt tay*). (2) `komārapatī` là *chồng thuở thiếu thời* và `mamaṁ` là *của tôi* (không phải *vợ*); `yamāha` là mệnh đề quan hệ có chủ ngữ số ít ngôi ba *(nàng ấy) nói* — "các chị" là bịa. (3) Khoá `:1.4` bản cũ **bỏ mất** `vajjhitthiyo` (= `vajjhā itthiyo`, *phụ nữ đáng bị xử tử*) và chêm *"như thế"*; nay dịch đủ hai vế. Độ nghịch của vế này được củng cố bởi `:2.4` `jīvantiyā` *khi nàng còn sống*: người đàn ông bị giết, người nữ thì bị cắt tai mũi nhưng còn sống. (4) `musala` = *chày* (3 tiền lệ đúng nghĩa: `ja286:2.4`, `ja512:25.3`, `ja530:29.3`), không phải *dùi gỗ*; `hantvā` sau `musalena` = *đập chết* (bản cũ chỉ *đánh*). (5) `jammaṁ` = *thấp hèn* (**4/4** tiền lệ đúng khoá gần nhất: `ja474:9.2`, `ja497:3.4`, `ja497:8.4`, `ja533:65.3`), không phải *đáng thương*; `luddaṁ` = *tàn nhẫn* (`ja522:28.2`), `chavaṁ` = *đê tiện*, `paradārūpaseviṁ` = *lui tới với vợ người* (khớp `ja535:62.1`). (6) `imissā ca naṁ pāpapatibbatāya jīvantiyā` là ba từ giống cái sở hữu cách cùng chỉ *người nữ này* (`naṁ` chỉ là tiểu từ), tức *người nữ này, kẻ thủy chung với chồng một cách xấu ác, khi nàng còn sống* — bản cũ hiểu `pāpapatibbatāya` là *bị đưa đến cõi lành xấu*, sai hẳn. (7) `kaṇṇanāsaṁ` = *tai và mũi* (bản cũ đảo *mũi tai*).

  **Ranh khoá và nháy.** Bản cũ cắt `:1.3`/`:1.4` lệch (mở nháy đơn ở `:1.3`, đóng ở `:1.4`) trong khi Pāli mở và đóng `‘…’` trong chính `:1.3`; nay trọn trong `:1.3`. Mọi vế đứng đúng khoá Pāli của nó.

  **Blocker còn lại (loại A) giữ nguyên:** Sujato không có bài này tại commit đã ghim; đó là sự thật về upstream, để waiver của người biên tập xử lý. Không có blocker loại B/C/D: tầng English và Việt hiện hành không có hẳn nên không phát sinh gap từng đoạn; `triangulation` giữ 7,0 (không có bản đối chiếu độc lập nào).

  **Bất định còn lại (không đưa vào thân kinh).** (a) Người nói và bối cảnh không nằm trong lớp Pāli root của bài (chỉ có hai bài kệ và dòng kết); tôi dùng *"tôi"* trung tính cho ngôi một thay vì *"ta"* hay xưng hô của riêng ai. (b) `komārapatī` có thể là *chồng thuở thiếu thời* hoặc *chồng đầu tiên*; tôi giữ *thuở thiếu thời* sát từ gốc `komāra`. (c) `yamāha` có thể là *(người) mà nàng nói là* hoặc *điều nàng nói là*; hai cách đọc cho cùng nghĩa. (d) `pāpapatibbatāya`: *một cách xấu ác* (tính từ ghép của `patibbatā`) là cách đọc tôi chọn; cách hiểu *thủy chung với kẻ xấu* không bị loại hẳn bằng lớp Pāli. `technical_integrity` giữ 9,6: không chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`. Kiểm tra: 13/13 khoá khớp Pāli, thứ tự khoá đúng, nháy đơn và nháy kép khớp từng khoá, không có dấu lược, không Pāli lọt sang bản Việt, không cặp Pāli trùng nội bộ.

  Sửa lan 2026-10-13: khoá `ja193:0.3` (`Ruhakavagga`): *Phẩm Dây Leo* → *Phẩm Ruhaka*. Căn cứ: bài đầu của phẩm là `ja191` `Ruhakajātaka`, tên bài đã dịch *Kinh Ruhaka* (tên riêng) và `ja191:1.1` đọc `ruhaka` là hô ngữ *Này Ruhaka*; còn `jiyā` ở `ja191:1.2` là *dây cung*, không phải cây leo, nên nghĩa *dây leo* cho `ruhaka` không có căn cứ trong Pāli. Tiền lệ: phẩm Jātaka đặt theo tên riêng của bài đầu phẩm giữ nguyên Pāli (*Phẩm Cūḷakuṇāla*, *Phẩm Gandhāra*, *Phẩm Soṇaka*, *Phẩm Kāliṅga*…). BẤT ĐỊNH: nghĩa của `ruhaka` không phân xử được từ tầng Pāli đã ghim (không có bản Anh), nên chọn phiên âm để không khẳng định nghĩa. Ngoài lát này, `ja191`, `ja199`, `ja200` vẫn *Phẩm Dây Leo* (và `ja200:3.2` ghi *Phẩm Thằn Lằn*) — cần thống nhất.

  **Giải quyết draft 2026-10-13 (vòng 2).** Đọc đối kháng lại cả 13 khoá từ Pāli (9 khoá kệ `:1.1`–`:2.4`, bốn khoá tiêu đề, một dòng kết); **0/13 khoá lỗi nghĩa thật** nên bản dịch không đổi. Đã kiểm lại từng điểm: `ayameva sā … so anañño` (hai vị ngữ chỉ người, phủ định `anañño` giữ cả hai lần); `hatthacchinno` = *bị chặt tay*; `yamāha ‘komārapatī maman’ti` trọn trong `:1.3`, nháy đơn mở và đóng đúng khoá Pāli; `vajjhitthiyo` đủ hai vế *đáng bị xử tử* và `natthi itthīsu saccaṁ`; `musalena hantvā` = *dùng chày đập chết*; `jammaṁ`/`luddaṁ`/`chavaṁ`/`paradārūpaseviṁ` khớp các tiền lệ đã nêu ở mục 2026-10-12; `jīvantiyā` = *khi nàng còn sống*; `kaṇṇanāsaṁ` = *tai và mũi*. Tiêu đề: `:0.2` *Bộ Hai Bài Kinh* và `:0.3` *Phẩm Ruhaka* là chuẩn hoá của người điều phối/sửa lan đã ghi ở trên, `:0.4` khớp `translationTitle`.

  **Phân loại blocker: (A) thiếu bản Anh upstream; không có blocker loại B/C/D.** Đã kiểm thực tế: không có `ja193_translation-en-sujato.json` ở thư mục Sujato `kn/ja/` của bản chụp đã ghim và `source/upstream-manifest.json` không liệt kê tệp Sujato nào cho `ja193`, nên đây là sự thật về upstream (`not-published-upstream`), không phải blocker sai. Blocker được viết lại thành đúng một khẳng định về việc thiếu bản Anh (bắt đầu bằng `noEnglishEditionUpstream:`), không còn lẫn lời về lỗi văn bản. Không có blocker thứ hai: mọi bất định văn bản còn lại (mục *Bất định còn lại* ở trên, nhất là `pāpapatibbatāya`) là điểm đọc có cân nhắc, không phải chỗ chưa phân xử được làm thay đổi giáo nghĩa; chúng được ghi ở notes và phản ánh ở `ambiguity_integrity`. Tầng Việt hiện hành vắng là giới hạn tham chiếu của bản chụp (chỉ có Pháp Cú), không phải lỗi văn bản.

  **Chấm lại.** Điểm giữ nguyên (final_score 8,76 = trung bình thô 10 tiêu chí): bản đã đúng Pāli sau lượt sửa 2026-10-12, nhưng `triangulation` vẫn 7,0 vì không có bản đối chiếu độc lập nào, và `semantic_fidelity`/`ambiguity_integrity` bị giữ thấp vì cú pháp `pāpapatibbatāya` (*thủy chung với chồng một cách xấu ác* hay *thủy chung với kẻ chồng xấu ác*) chỉ đứng được trên Pāli một mình. Pāli `ja193` không có dấu lược nên không có `…`/`(…)`; không có số đếm Pāli. `technical_integrity` giữ 9,6: không chạy `npm run validate` · `npm test` · `npm run check` · `npm run build`.
