notes: |-
  **Phạm vi: đủ 495/495 khoá của `cnd2`**, thứ tự khoá đúng thứ tự Pāli, không khoá nào ngoài tập khoá Pāli. Bài là phần Kệ Phẩm Bờ Kia gồm mười sáu câu hỏi (`Pucchā`) của các thanh niên Bà-la-môn và lời đáp của Đức Thế Tôn, tức các kệ gốc của `snp5.2`–`snp5.17`, chưa kèm lời chú giải (chú giải nằm ở `cnd5`–`cnd20`). Pāli của bài **không có** dấu lược `…` hay `(…)` nên bản Việt cũng không có. Các khoá gồm ba nhãn tác phẩm (`0.1`–`0.3`), mười sáu tiêu đề câu hỏi và mười sáu dòng kết.

  **Cách làm: dựa tiền lệ, đọc lại theo từng dòng Pāli.** Pāli của bài trùng gần như từng dòng với kệ của `snp5.2`–`snp5.17` (đã được dịch) và với các câu kệ được dẫn lại ở `cnd6`, `cnd7`, `cnd9`–`cnd18`, `cnd20`. Đã dò toàn tầng: **475** khoá (trong 476 khoá không phải nhãn hay tiêu đề) có Pāli trùng với khoá ở bài khác (bỏ dấu câu và chữ hoa), tổng **2.029** cặp. Bản Việt ở đây dùng lại nguyên văn (bỏ khác biệt chữ hoa và dấu câu) ít nhất một bản ở **456** khoá: **347** khoá khớp ít nhất một bản trong nhóm `cnd`, **106** khoá chỉ khớp bản của `snp5.2`–`snp5.17`, **3** khoá (`20.1`–`20.3`) khớp bản ở `thag2.16` và `snp3.12`. **19** khoá khác mọi bản đã có; **1** khoá (`5.1`) không có tiền lệ. Khi bản của `snp5` và bản dẫn trong `cnd` lệch nhau, chọn bản khớp từng dòng Pāli (thường là bản của `cnd`), vì một số khoá của `snp5` có nội dung dịch đặt sang khoá kế bên (xem dưới).

  **19 khoá khác mọi bản đã có, và vì sao.**
  - `2.2`, `4.2`, `19.2`, `22.2`, `24.2`: lời dẫn của Đức Thế Tôn ở câu hỏi của Ajita và Mettagū dịch *(Này X, Đức Thế Tôn nói,)* theo mười ba câu hỏi khác của `cnd` có tiền lệ (42 khoá `cnd` có lời dẫn của Đức Thế Tôn đều dùng khuôn *Này*, chỉ 1 khoá khác; không có `cnd5` và `cnd8` làm tiền lệ trực tiếp), thay vì *(Đức Thế Tôn trả lời:)* của `snp5.2` và `snp5.5` (25 khoá `snp5` đều dùng dạng này).
  - `7.3`, `7.4`: ở `snp5.2:7.3`, `sn12.31` (4 khoá) và `ne5:37.4` bản Việt đặt *nói cho con* ở khoá chứa `Tesaṁ me nipako iriyaṁ`, trong khi động từ `pabrūhi` nằm ở khoá kế; dịch lại cho đúng từng dòng.
  - `8.4`: thêm *nên* để giữ thức optative của `paribbaje` (cả đoạn `8.1`–`8.4` là một câu optative).
  - `19.4`: dịch `Upadhinidānā` là *do sanh y làm nhân*, theo `20.1`–`20.3` cùng bài (`upadhi` → *sanh y* ở 104 trong 107 khoá toàn tầng có `upadhi`; `snp5.5:2.4` dịch *chấp thủ* nên lệch với `snp5.5:3.1`).
  - `25.1`–`25.4`: `snp5.5:8.3` mang *sau khi biết rõ, ngay tại đây* ở khoá chứa `Jātiṁ jaraṁ sokapariddavañca`; dịch lại từng dòng (`sinh, già, sầu và bi thương` ở `25.3`, `idheva vidvā pajaheyya dukkhaṁ` ở `25.4`), đặt `bhikkhu` ở dòng `25.2` đúng chỗ Pāli.
  - `27.1`, `27.2`: `snp5.5:10.1`–`10.2` đảo vế (*những ai Ngài thường chỉ dạy* đặt ở khoá chứa `Te cāpi nūnappajaheyyu dukkhaṁ`); dịch lại từng dòng.
  - `42.3`: bỏ chữ *Và* ở đầu, Pāli `Tattheva so sītisiyā vimutto` không có.
  - `47.4`: thêm động từ `caranti` (*sống như vậy*) mà `snp5.8:2.4` bỏ.
  - `75.3`: chọn *và cả hai loại ưu não* (`snp5.14:2.3`) thay *và các ưu não, cả hai điều ấy* của `cnd17:20.4`, vì `Domanassāna cūbhayaṁ` đi với `Pahānaṁ` ở `75.1`.
  - `87.1`: `snp5.16:3.1` đặt *con đã đến với một câu hỏi* ở khoá chứa `Evaṁ abhikkantadassāviṁ`; dịch lại từng dòng.

  **Pāli của bài khác với `snp5` ở một số khoá** (đã đo, so với `snp5.2`–`snp5.17`): tám khoá có Pāli khác khi bỏ dấu câu và chữ hoa: `5.1` (`cāpi` thay `yañca`; dịch *Cả tuệ lẫn niệm*), `40.4` và `41.4` (`paramedhimutto` thay `parame vimutto`; theo `cnd10:22.3` *nghiêng hẳn về sự giải thoát cao nhất của tưởng*), và năm khoá chỉ khác chính tả hoặc dạng chữ (`14.5` `Kaccisu`, `43.1` `Acci`, `45.4` `samūhatesu`, `46.4` `muni no`, `67.4` `Uggahitaṁ`), dịch theo `cnd7`, `cnd10`, `cnd11`, `cnd15`. Thêm mười bốn khoá khác nhau chỉ ở dấu nháy hoặc dấu câu, nên không phải khác về nghĩa.

  **Pāli trùng trong chính bài:** 60 nhóm (152 khoá); bản Việt **giống hệt** (bỏ chữ hoa và dấu câu) ở 58 nhóm; **2** nhóm khác, đều có lý do: `21.4`/`25.3` (`Jātiṁ jaraṁ sokapariddavañca`: ở `21.4` là đồng vị với dòng lũ trong câu hỏi nên *của sinh, già, sầu và bi thương?*; ở `25.3` là tân ngữ của `pajaheyya` nên *sinh, già, sầu và bi thương,*) và `30.5`/`31.5` (`Sikkhe nibbānamattano`: *con sẽ học tập* khi Dhotaka nói, *hãy học tập* khi Đức Thế Tôn nói, như `snp5.6:1.5` và `snp5.6:2.5`).

  **Lỗi dòng ở bài khác (báo, không sửa trong lượt này):** `snp5.2:7.3`–`7.4` (cùng kiểu ở `sn12.31` 4 khoá và `ne5:37.4`), `snp5.5:8.3`–`8.4`, `snp5.5:10.1`–`10.2`, `snp5.4:1.5`–`1.6`, `snp5.4:2.3`–`2.5`, `snp5.9:3.1`–`3.4` (đặt *dục và tham* và *hình tướng khả ái* lệch ranh khoá), `snp5.12:5.1`–`5.2`, `snp5.14:7.1`–`7.2`, `snp5.16:3.1`–`3.2`; ngoài ra `snp5.14:1.1` dịch `virajamāsīnaṁ` là *không còn cầu mong* trong khi `cnd17:17.1` dịch *không bụi, đang ngồi*, và `snp5.4:2.5` dịch `Āsīsamānā puṇṇaka itthattaṁ` đặt *họ đều dâng lễ tế* chồng với khoá kế.

  **Thuật ngữ, kèm số đếm (phạm vi tầng, không tính `cnd2`).**
  - `kathaṅkathā` → *nghi hoặc* (88 trong 112 khoá có `kathaṅkath-` dịch *nghi hoặc*, 10 dịch *nghi ngờ*); `snp5.6` còn dùng *nghi ngờ* nên `32.4` và `33.2` theo `cnd9` và `snp5.10`.
  - `upadhi` → *sanh y* (104/107 khoá). `Gotamanūpadhīkaṁ` → *Gotama đã khéo giảng về sự không còn sanh y* theo `cnd11:60.5` (cả hai bản đều có), không theo `snp5.5:9.2` (*không chấp thủ*).
  - `vedagū` → *bậc thông suốt tri thức* theo `snp5.5` (3 khoá); ở bối cảnh Bà-la-môn khác, *thông suốt Veda* (15 khoá).
  - `maccurājā` → *Thần chết* (5 khoá, *Tử thần* 2 khoá); `māra` → *Ma vương*; `sibbinī` → *thợ may* (12 khoá, theo `cnd6:8.2`); `viññāṇaṭṭhiti` → *trú xứ của thức* (46 khoá).
  - `nāga` (`27.3`, `70.5`) → *bậc long tượng* theo `snp5.5:10.3`; `snp5.13:1.5` viết hoa *Long tượng*, ở đây thống nhất chữ thường.
  - `Tañcāhaṁ abhinandāmi` (`23.1`, `36.1`) → *Con hoan hỷ với pháp ấy* theo `snp5.5:6.1` và `snp5.6:7.1`; `cnd9:50.3` dịch *lời dạy ấy*, cùng nghĩa.
  - Nhãn: `0.1`, `0.2` theo `cnd1`, `cnd3`, `cnd4`; `0.3` `Pucchā` dịch *Các Câu Hỏi* theo `cnd6:0.3` (bản Anh của tên mục: *The Questions*); tiêu đề *Câu Hỏi Của Thanh Niên X* theo `snp5.2`–`snp5.17` (tên theo `cnd`: *Tissametteyya*); dòng kết theo `cnd6:28.7` và các bài cùng loại, bỏ chữ *Kể Lược* vì đây không phải phần giải.

  **Số Pāli đã tính.** `Dvāhaṁ` (`85.1`) = hai lần; `yāvatatiyaṁ` (`85.4`–`85.5`) = đến lần thứ ba; `disā catasso vidisā catasso, uddhaṁ adho` (`91.1`–`91.2`) = 4 + 4 + 2 = **10** (`dasa disā`, *mười phương*); số thứ tự `paṭhamā`…`soḷasamā` = thứ nhất…thứ mười sáu, khớp tiêu đề 1–16. Không có số lớn nhân thang, không có `sata`/`navuti`/`tiṁsakappasahassa`.

  **Bất định (không thêm vào thân kinh).**
  1. `86.3` `Diṭṭhiṁ te nābhijānāti`: chủ ngữ của `nābhijānāti` và vai của `te` không rõ trong Pāli; giữ *Con không biết được quan điểm của Gotama danh tiếng* theo `snp5.16:2.3` (Sujato đọc tương tự); đọc khác là *người ta không biết quan điểm của Ngài*.
  2. `24.4`–`24.5` `Panujja viññāṇaṁ bhave na tiṭṭhe`: `panujja` có thể nối với `nandiñca nivesanañca` (theo `snp5.5:7.4`–`7.5`, giữ ở đây) hoặc với `viññāṇaṁ` (Sujato: *having cast aside consciousness*).
  3. `47.3` `Visenikatvā`: chọn *Sau khi phá tan các đạo quân* theo `cnd11:15.3`; `snp5.8:2.3` đọc *xa lìa đám đông* (Sujato cũng đọc như vậy).
  4. `74.1` `virajamāsīnaṁ`: chọn *không bụi, đang ngồi* theo `cnd17:17.1`; `snp5.14:1.1` đọc khác (*không còn cầu mong*).
  5. `8.1`–`8.4`: các động từ optative của kệ trả lời dịch thể trần (không *nên*) ở `8.1`–`8.3` và có *nên* ở `8.4`; người biên tập có thể chuyển cả đoạn thành *nên*.
  6. `42.2` `Pūgampi vassānaṁ`: *vô số năm* theo `snp5.7:5.2`; `pūga` nghĩa sát hơn là *một khối nhiều năm*.
  7. `28.4` `akhilo`: *không chướng ngại* theo `snp5.5:11.4`; không có chứng cứ độc lập cho nghĩa chính xác.
  8. `55.4` thêm *là* trước *Niết-bàn* theo `snp5.9:3.4` (Pāli là câu danh từ không có động từ nối).
  9. `53.4` `Iccāsi iti bhavissati`: Pāli không có dấu trích nhưng `snp5.9:1.4` thêm nháy; ở đây theo `cnd12:8.4` và `cnd4:5.3`, *rằng đã là như vậy, sẽ là như vậy*.

  **Tầng tham khảo — đo, không đoán.** Pāli root: 495 khoá. Bản Anh Sujato **không có** cho `cnd2`: edition đã ghim (commit `11c9d708978cde8ba61096d8a75f7ddfb846f639`) chỉ có tệp tên mục `cnd-name`, không có tệp kinh `cnd2` (tra manifest; thư mục `kn/` của edition chỉ có `cp` `dhp` `iti` `ja` `kp` `snp` `thag` `thig` `ud`) ⇒ `not-published-upstream`. Lớp `english-project` cũng không có `cnd2`. `vietnamese-current` chỉ có Pháp Cú. **Coverage English theo công thức:** mẫu số = **3** khoá Pāli có nội dung (≥ 40 ký tự, bỏ khối `:0`): `14.5`, `15.1`, `48.6`; Sujato phủ 0/3, `english-project` 0/3, `vietnamese-current` 0/3; với bài này gần như mọi dòng đều ngắn nên cổng coverage **gần như không đo được gì**, và điều đó không phải là *đã đối chiếu English*. Có chứng cứ gián tiếp: các kệ này trùng `snp5.2`–`snp5.17` mà Sujato có dịch; đã đọc đối chiếu để kiểm hiểu nghĩa, nhưng đó là bản của **bài khác**, nên không tính là tầng English của `cnd2` và không đo được ở ba khoá Pāli khác `snp5` (`5.1`, `40.4`, `41.4`). Ba tầng tham khảo đều vắng ⇒ `triangulation` đặt 8.0 (không cao hơn), `status` là `draft` kèm blocker `noEnglishEditionUpstream`, không nâng điểm để né blocker.

  **Bốn cổng kỹ thuật theo `AGENTS.md`:** `npm run validate`, `npm test`, `npm run check`, `npm run build`. Lượt này **không** chạy bốn lệnh đó (bị cấm trong lát) ⇒ để CI hoặc người điều phối chạy; `technical_integrity` đặt **9.6**, không 10.0.
