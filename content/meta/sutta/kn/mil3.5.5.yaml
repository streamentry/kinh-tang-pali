notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim (`11c9d708978cde8ba61096d8a75f7ddfb846f639`), bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    Đợt này bị cấm chạy cổng kỹ thuật, nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
  - |-
    **Ba tầng còn lại là Pāli root và bản Việt dự án; tầng Anh và tầng Việt hiện hành đều vắng.** `triangulation` bị ép 6.5; bài dịch hoàn toàn từ Pāli một mình.
  - |-
    **Tiêu đề dùng lại khuôn có sẵn của chính phẩm.** `kn/mil3.5.7:0.3` là *7. Câu hỏi về việc đi đến thân khác* và `:4.1` là *Câu hỏi về việc đi đến thân khác, thứ bảy.*; `Asaṅkamanapaṭisandahanapañha` là dạng phủ định của cùng ý, nên tôi viết *5. Câu hỏi về việc không chuyển tiếp sang thân khác* và kết *…, thứ năm.* `saṅkamati paṭisandahati cā` tôi dịch *không chuyển tiếp và không tái sinh*; `paṭisandahati` là *tái sinh / nhập lưu*, và bài này nói về việc một bậc A-la-hán không nhập lưu nữa.
  - |-
    **Câu hỏi của vua có `na ca … cā`, nên dấu chấm hỏi phải giữ.** `1.2` tôi dịch *chẳng phải là không chuyển tiếp và không tái sinh, hay sao*; nếu viết thẳng *không chuyển tiếp và không tái sinh* thì mất dạng hỏi và mất ý *vậy thì*. Ở `1.3`, `1.7`, `2.6` — những chỗ Nāgasena đáp — tôi dịch *đúng là không chuyển tiếp và không tái sinh nữa*, giữ chữ *nữa* của `cā` để lặp lại câu hỏi.
  - |-
    **Hai thí dụ phải giữ đúng quan hệ với câu hỏi, tôi không gộp.**
    `1.5`: người cầm ngọn đèn đem thắp cho ngọn đèn khác → hỏi *ngọn đèn ấy có đi tới được ngọn đèn kia không* → `1.6` *không phải vậy*.
    `2.2`: hỏi lại thời trẻ học thầy có từng nghe bài ca ngợi ca nào không → `2.3` *vâng* → `2.4` hỏi *bài ca ấy có đi đến từ bậc thầy của Ta không* → `2.5` *không phải vậy*.
    Cái hay của bài là **cùng một khuôn lập luận** dùng cho ngọn đèn và cho bài ca ngợi ca; tôi dùng lại đúng khuôn đó, và vì thế dịch `silokaṁ` là *bài ca ngợi ca* ở cả `2.2` và `2.4`.
  - |-
    **Chỗ 0 tiền lệ, tôi ghi.** `silokācariyassa santike` (0 tiền lệ) → *lúc còn theo học một bậc thầy nổi tiếng khắp thế gian*; `siloka` → *bài ca ngợi ca* (tầng đã dùng *danh tiếng* cho `lābhasakkārasiloka` ở `dn25:10.1`, nhưng ở đây `siloka` là **bài ca** — cùng gốc `sūda`, nghe tiếng — nên phải khác). `Abhijānāsi nu tvaṁ` dùng khuôn có sẵn của `kn/mil3.6.10:1.5` → *Ngài có biết không*. `Āma, bhante` → *“Vâng, thưa tôn giả”ti.*
  - |-
    Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 8 khoá bất đồng nghĩa → sửa 8 (và 2 tiêu đề cùng gốc), giữ 0, bất định 0. (1) Khoá 1.2, 1.3, 1.4, 1.7, 2.6 và tiêu đề 0.3, 4.1: Pāli na ca saṅkamati paṭisandahati ca là không chuyển sang mà vẫn tái sinh (paṭisandahati là vế khẳng định; tên bài Asaṅkamanapaṭisandahana là tái sinh mà không chuyển sang). Bản trước dịch không chuyển tiếp và không tái sinh, làm đảo cả câu hỏi của vua lẫn lời đáp của Nāgasena. Đã sửa thành không chuyển sang mà vẫn tái sinh; paṭisandahati dịch tái sinh theo mil3.2.2, mil3.2.6, mil3.1.6. (2) Khoá 1.5: bản trước thêm đang cầm … đem đi mà Pāli (padīpato padīpaṁ padīpeyya) không có, và dịch saṅkanto là đi tới được, lệch với saṅkamati ở các khoá khác; nay là thắp một ngọn đèn từ một ngọn đèn, ngọn đèn ấy có chuyển sang từ ngọn đèn kia không. (3) Khoá 2.2: silokācariya là vị thầy dạy kệ, siloka ở đây là bài kệ (gahita là học lấy); bản trước dịch bậc thầy nổi tiếng khắp thế gian và bài ca ngợi ca … nghe. Nay là vị thầy dạy kệ và học được một bài kệ; abhijānāsi dịch có nhớ theo mil3.7.4:3.6. (4) Khoá 2.4: bản trước chen của Ta (Pāli chỉ có ācariyamhā) và dịch saṅkanto là đi đến; nay là bài kệ ấy có chuyển sang từ vị thầy không, cùng khuôn với thí dụ ngọn đèn. Ghi chú cũ của bài nói bài này bàn về việc một bậc A-la-hán không còn nhập lưu; điều đó không có căn cứ trong Pāli và không còn đúng với bản dịch đã sửa. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
