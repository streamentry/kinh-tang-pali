notes: |-
  9 khoá, bản dịch phủ đủ, dấu lược `…` ở `1.5` giữ nguyên.
  
  **Bài sạch nhất trong nhóm Trưởng Lão của lô.** Cả bốn vế đều đúng và tự nhiên; tôi không tìm ra lỗi nghĩa nào.
  
  **Kép ý ở `1.1`–`1.2` được giữ trọn.** Pāli nối hai vế bằng kép `vā` … `vā`: *hoặc* khóc người chết, *hoặc* khóc người còn sống nhưng không thấy. Bản dịch giữ kép (*Mẹ ơi, người ta khóc kẻ đã chết, / hay kẻ còn sống mà không thấy đâu*) — không gộp thành một ý.
  
  **`Yo vā jīvaṁ na dissati` → *hay kẻ còn sống mà không thấy đâu*** ✓. `na dissati` là "không thấy (ở đâu)", giữ đúng nghĩa vắng mặt chứ không phải chết. Đây là chỗ dễ nhầm với kệ trước, và bản dịch không nhầm.
  
  **`Jīvantaṁ maṁ amma passantī` → *Mẹ thấy con còn sống đây*** ✓ — `maṁ` (con) và `amma` (mẹ) đúng chiều. `Kasmā maṁ amma rodasī` → *vậy sao mẹ lại khóc con* ✓ giữ cả `Kasmā` (vì sao).
  
  **Danh xưng `amma` → *mẹ*** ✓ xuyên suốt cả bốn vế, nhất quán.
  
  **Tầng Anh** có mặt đủ và còn xác nhận chi tiết mà bản dịch không sai: Sujato dịch `Yo vā jīvaṁ na dissati` là *or for one who's alive but missing* — đúng "còn sống nhưng vắng mặt", không phải chết.
  
  **Tên phẩm** `Pañcamavagga` → *Phẩm Thứ Năm* khớp 2 tệp thag cùng phẩm.
  
  **Tầng Việt**: không có Thích Minh Châu cho Trưởng Lão ở commit đã ghim.
