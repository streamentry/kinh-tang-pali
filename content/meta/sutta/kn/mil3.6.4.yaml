notes:
  - |-
    **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, bilara chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không tồn tại bản Hòa thượng Thích Minh Châu cho bài này; đó là đặc điểm của snapshot upstream, không phải thiếu sót của repo. Ba tầng còn lại là Pāli root, bản Anh Sujato đã ghim và bản Việt dự án.
  - |-
    **`kiểm()` của `_hvi.py` gần như vô dụng ở bài này**: nó chỉ quét khoá Pāli từ 40 ký tự trở lên, mà mọi vế kệ ở đây đều ngắn hơn, nên `cần` rỗng và assertion không chạy. Vì vậy tôi tự quét **toàn bộ** khoá từ đĩa: đủ khoá, đúng exact ID, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài, không Pāli lọt, không `(…)`. Kết quả: **0 lỗi trên 252 khoá**.
  - |-
    **Đã tự dựng chỉ mục Pāli↔Việt toàn tầng rồi so khoá của lát, không đoán.** Nạp mọi tệp Pāli gốc trong cache (284.708 khoá) và mọi tệp Việt dự án (111.657 khoá), ghép theo khoá vì khoá là duy nhất toàn hệ thống. Lát này tìm được **3 khoá có Pāli trùng nguyên văn với bài đã có bản Việt ngoài lát (114 cặp)**, và **16 cụm Pāli trùng nguyên văn nội lát**. Mọi bản Việt đã có đều được dùng lại nguyên văn, không dịch lần hai.
  - |-
    **Review đối kháng bắt được 2 lỗi, đều là lỗi nghĩa chữ.** (1) Bản nháp đầu bỏ trọn ba khoá `1.11–1.13` — `kiểm()` đã bắt được vì chúng dài hơn 40 ký tự; thêm vào thì nghĩa câu hỏi về Phạm thiên mới trọn vẹn. (2) `1.11` ban đầu tôi dịch `Kiṁ pana` thành *Vậy thì*, lặp y nguyên với `Tena hi` ở `1.4` và `1.13` — đổi thành *Nhưng*, khớp với `Atthi pana` `1.5` và `Kiṁ nu kho` `1.7`, ba hạt từ khác nhau thì ba cách nói khác nhau.
  - |-
    **Nguyên văn bắt buộc.** `2.1` là `“Kallosi, bhante nāgasenā”ti.` — nguyên văn giống hệt `2.1` của 32 bài mil đã có, và `TIEN_LE_PHAI.md` chỉ định dùng lại *Khéo lắm, thưa tôn giả Nāgasenā.* Tôi dùng đúng chuỗi đó, kể cả chữ `Nāgasenā` có dấu, dù tiếng Việt không có dạng nguyên như thế.
  - |-
    **Điểm lệch còn treo, cần người biên tập phán xử — xin đừng tự chuẩn hoá.** `1.10` `“Na hi, bhante”ti.` đã có ba cách trong tầng: *Không phải vậy, thưa tôn giả*`ti` (mil3.2.7/3.5.8/3.7.6) và *Không phải, bạch tôn giả* (mil3.7.2/3.7.15). Tôi theo phần lớn của cả tầng về `ti` và bỏ nó, vì đo được 605/668 khoá mil bỏ `ti` và chỉ 63 giữ; và vì ba tệp kia tự mâu thuẫn trong chính nó — chúng giữ `ti` ở `1.10` nhưng bỏ ở `2.1`. Hệ quả: ba tệp đó và tệp này dịch khác nhau ở một khoá. Nếu người biên tập muốn giữ `ti` thì phải sửa cả 4 cùng lúc, việc đó không thuộc lát này.
  - |-
    **Thuật ngữ mới đặt, không có tiền lệ** (grep toàn tầng = 0): `Sativagga` → *Phẩm Chánh Niệm* — không tra được nghĩa riêng của cái tên này, nhưng **cả 7 tệp mil3.6.x đã có đều ghi Phẩm Chánh Niệm**, nên tôi theo đó cho khớp, không tự đặt theo nghĩa đoán; `hatthipāmokkho` → *sợi dây trói voi*; `koñcanādaṁ` → *tiếng gầm vàng*; `brahmā` → *Phạm thiên* (704 bài); `brahmacārī` → *bậc tu hành* (9 bài); `karahaci` là dạng hapax của `kadāci`, dịch *bao giờ*.
  - |-
    **Bất định.** `Atthi pana te` dùng `te` (người thứ hai, của người đối diện) chứ không phải `tvaṁ`; tôi dịch *ngài*, vì đó là cách xưng hô hiện hành trong tầng và `mahārāja` đứng ngay trước.
