notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja454_root-pli-ms.json` (73/73 khoá, đúng thứ tự Pāli).

  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho ja454 (`ja454_translation-en-sujato.json` vắng mặt; tầng `english-sujato` chỉ có 83 tệp `ja`, không có uid này), nên đây là `not-published-upstream`, không phải `not-synced`. Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú. Lớp lấp `english-project` của dự án chưa có tệp cho bài này. Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.5 (≤ 8.0).
  - Coverage English:
    Mẫu số = 0. Không khoá Pāli nào của bài đạt ngưỡng 40 ký tự theo `source/layers.yaml` (bài toàn kệ ngắn), nên cổng coverage không đo được gì; điều đó không có nghĩa là không cần ghi nhận gap. Sujato phủ 0/73 khoá.
  - Phân loại & tiêu đề:
    + `0.1` "Jātaka"; `0.2` "Bộ Mười Bài Kệ" (Dasakanipāta, đồng nhất ja439–ja453); `0.3` "Phẩm Bốn Cửa" (Catudvāravagga, đồng nhất ja439–ja453).
    + `0.4` "16. Kinh Bậc Hiền Trí Ghaṭa" và `16.1` "thứ mười sáu" (soḷasama = 16). `paṇḍita` dịch "hiền trí" theo tiền lệ `ja316` (Thỏ Hiền Trí). `17.1` "Bộ Mười Bài Kệ đã hoàn tất" theo `ja438:11.1` ("Bộ Chín Bài Kệ đã hoàn tất"); `18.1` "Tóm lược:" theo ja438/ja463/ja473.
    + `19.1`–`19.4`: các tên trong bài kệ tóm lược được giữ nguyên dạng Pāli (theo `ja438:13`, `ja473:16`), không tự giải ra tên Việt vì không xác định được tên nào ứng với bài nào.
  - Pāli trùng nguyên văn:
    Dò Pāli của 73 khoá với toàn bộ Pāli đã ghim (mọi bộ): 48 khoá có ít nhất một dạng trùng ở bài khác (chủ yếu `pv18` là bản kệ song hành chưa có bản Việt, cùng `ja352`, `ja372`, `ja410`, `ja449`, `pv8`, `pv17`, `pv25`). Chỉ những chỗ đã có bản Việt mới so được: các bài đó ở nhóm `12.1`–`14.4` và `15.1`–`15.3` đã được dịch ở `ja352`/`ja372`/`ja410`/`ja449`/`pv8`. Dùng lại nguyên văn: `4.2` (`ja449:3.2`), `14.2` (4/4 tiền lệ), `14.4` (`ja449:10.4`), `15.2` (`pv5`, `kp7`, `pv8`). Cố ý khác tiền lệ: `12.1`–`13.4`, `14.1`, `15.3` — các bản đã có dịch `ghatasittaṁva pāvakaṁ` là "như cành cây khô bị lửa thiêu đốt" (sai: `ghata` là bơ lỏng, `sitta` là rưới), `abbahī vata me sallaṁ` là "đã đau đớn khổ sở" (sai: là "đã nhổ mũi tên của ta"), `puttasokaṁ` là "nỗi khó đau của người con ấy" (sai: là "nỗi sầu vì con") và `nivattayanti` là "trở ra khỏi cõi khổ đau" (sai thể: là dạng sai khiến). Khoá ở bài này theo Pāli trước, không theo tiền lệ sai. Các bản sai ở tiền lệ nằm ngoài lát này nên chưa sửa.
    Trong chính bài: 0 cặp Pāli trùng nguyên văn.
  - Số Pāli:
    `soḷasamaṁ` = 16 (soḷasa 16 + hậu tố thứ tự) → "thứ mười sáu", khớp `0.4` ("16.") và vị trí kế tiếp `ja453` (15). Bài không có số đếm nào khác.
  - Chỗ bất định (không thêm vào thân kinh):
    + `1.5` `vātā balīyanti`: dịch sát chữ "những cơn gió của người ấy đang mạnh lên" (vāta = gió/khí trong thân; ngữ cảnh là chứng loạn trí của Ghaṭa); không giải thích thêm trong thân kinh.
    + `3.4` `ko nu te sasamāhari`: `āhari` nghĩa "đem/mang/lấy"; chọn "lấy ... đi" theo ngữ cảnh (kẻ đang đòi con thỏ bị cho là bị lấy mất). Cách đọc "đem đến" cũng ngữ pháp được.
    + `7.1`–`7.2` `madhuraṁ ñāti jīvitaṁ`: `madhuraṁ` gắn với `jīvitaṁ` ("đời sống ngọt ngào"), `ñāti` là hô cách ("hỡi người thân"); cách đọc `madhuraṁ` bổ nghĩa cho `ñāti` ít khả dĩ hơn.
    + `9.3` `jāto me mā marī putto`: không có dấu nháy trong Pāli, dịch là nội dung của điều "không thể đạt được" ("Mong đứa con trai ta đã sinh ra đừng chết"); `me` là đại từ chung của lời ước, không nhất thiết là người nói.
    + `11.3` `nijjhāpaye` (dạng cầu khiến, không ghi thì): dịch không đánh dấu thì ("làm cho thấu hiểu"), vì cả `nijjhāpaye` lẫn `nibbāpaye` (12.4) ở đây đều có thể đọc là quá khứ lẫn điều kiện.
    + `2.2` `rohiṇeyyassa`: người nói ở 1.1–1.6; Pāli chỉ gọi là Rohiṇeyya, giữ nguyên tên, không suy ra danh tính khác.
    + `2.4` `bhātusokena`: "em trai" dựa theo `1.3` (`sako bhātā`) và `15.4` (`jeṭṭhaṁ bhātaraṁ`: Ghaṭa là em của Kaṇha).
