notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/ja/ja540_root-pli-ms.json` (511/511 khoá, đúng thứ tự Pāli, không khoá thừa). Bài toàn kệ: bốn dòng tiêu đề `0.1`–`0.4`, 125 bài kệ (`1`–`125`; phần lớn bốn dòng, riêng `30`, `34`, `103` có sáu dòng) và dòng kết bài `126.1`; phần văn xuôi khung truyện không nằm trong tầng Pāli đã ghim, nên người nói được suy từ xưng hô, nháy và mạch của chính các bài kệ. Nội dung chính (suy từ kệ): vua Kāsi tên Pīḷiyakkha đi săn, bắn nhầm Sāma, chàng trai đang đi lấy nước cho cha mẹ mù ở rừng lớn; Sāma nói vua đến chỗ cha mẹ chàng rồi ngất vì độc (`1`–`33`); vua hối hận, một vị thiên trên núi Gandhamādana khuyên vua nuôi cha mẹ Sāma (`34`–`41`); vua mang nước đến, cha mẹ (Dukūla và Pārikā) nghe tin, vua hứa nuôi họ (`42`–`64`); họ xin được đưa đến chỗ Sāma, than khóc, rồi lần lượt nói lời chân thật (`65`–`101`); vị thiên cũng nói lời chân thật, chất độc tan, Sāma đứng dậy (`102`–`106`); Sāma khuyên vua sống đúng pháp (`107`–`125`). Phần này không được đối chiếu với văn xuôi nào, nên các dòng tả cảnh và tả người nói dựa hoàn toàn vào kệ.
  - Tầng tham khảo:
    Tầng English của Sujato không có ja540 (ja chỉ có 83 tệp: ja1–79, ja126, ja159, ja466, ja534; đây là not-published-upstream, không phải not-synced); tầng Việt hiện hành chỉ có Pháp Cú; lớp `english-project` chưa có tệp cho bài này. Chỉ có thể dựa vào Pāli, tiền lệ Việt của tầng và bối cảnh của chính bài. Tiền lệ Việt trong tầng do cùng một nhóm dịch, nên không phải đối chiếu độc lập; tôi không dùng bản tóm lược hay bản dịch ngoài tầng đã ghim làm câu chữ hay đối chiếu. Vì vậy `triangulation` 7.5 và bài giữ `draft` với blocker `noEnglishEditionUpstream`.
