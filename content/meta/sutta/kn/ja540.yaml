  - Pāli trùng nguyên văn:
    Dò Pāli của 511 khoá với toàn bộ Pāli đã ghim (mọi bộ) có bản Việt, loại các khoá dưới 6 ký tự chuẩn hoá: 131 khoá có dạng trùng ở bài khác, tổng 933 cặp, trong đó bản Việt giống hệt (bỏ dấu câu) ở 766 cặp và khác ở 167 cặp (53 khoá). Dùng lại nguyên văn: `0.2` (2/2), `2.3`/`10.3`/`15.3` ("Thế nhưng vì cớ sao," 4/8 cặp), `14.2`/`39.2`/`102.2`/`104.2` ("trên núi Gandhamādana;"), `31.1`–`31.2`/`65.1`–`65.2` (`ja506:14.3`–`14.4`), `32.1` (`ja506:14.5`), `30.1` (`ja532:20.1`), `34.1` (`ja507:4.1`), `37.3`/`38.3` (`ja523:40.3`), `47`–`49`, `107`–`108`, `109.2`–`109.4` (`ja503:12`–`14`, `ja532:43`–`45`), `56.1`–`56.2` (`ja532:67.1`–`67.2`), `63.1` (`ja520:5.1`, `ja533:4.1`), `86.3`/`94.3` (`ja507:4.2`, đổi thứ tự), `93.3`/`101.3` (`tha-ap317:4.3`), `104.1` (`tha-ap402:10.1`), `105.1` (`tha-ap489:27.1`), `116`–`125` (`ja521:40`–`49`; mỗi dòng `Dhammaṁ cara mahārāja` có 20 cặp, 19 giống hệt; nháy mở `116.1`), `28.2`/`62.2` (`ja477:4.2`), `36.3` (`ja314:3.3`), `20.1`/`21.1` (`ja519:13.1`), `87.3`, `88.3`, … `104.3` "Với lời tuyên thệ chân thật này," (14 khoá, mỗi khoá 15 cặp: 12 giống hệt, 3 cặp "do lời chân thật này" khác).
    Cặp mà bản Việt khác có lý do: `12.1`–`12.2` (`tha-ap403:24.1`, `tha-ap486:24.1` dịch "ta"; ở đây người nói là Sāma nên "tôi"); `36.1`/`36.2` ("ta", giữ; `thi-ap6:3.3` là "tôi" của người nói khác); `41.1` (`ja533:36.1` dịch "bác" vì người nghe khác; ở đây vị thiên nói với vua nên "ngài"); `43.4`/`44.4` (`dn19:44.5` giữ "thưa vị đáng kính, ngài là ai?"; `pv19:1.4` "ngươi" vì người nói khác, ở đây cha mẹ mù hỏi người lạ); `47.3`/`107.3` ("ngài", không theo "ngươi" của `ja503:12.5` vì người nghe khác); `55.4`/`56.4` ("lòng mẹ run rẩy" của `ja532:67.4` là mẹ nói với con, ở đây mẹ nói với chồng nên "lòng tôi"); `115.4` (`ja516:20.4` "ngài", ở đây vua gọi Sāma là "chàng"); `113.1`–`113.2`/`114.1`–`114.2` (`sn7.19:2`, `snp1.6:9`, `snp1.7:12` khác nghĩa theo ngữ cảnh: ở đó là câu hỏi về người xin ăn hoặc người không phụng dưỡng cha mẹ); `114.3` (10 cặp, đa số "được tán thán ngay nơi này"; ở đây chuyển thành câu chủ động vì `naṁ` là tân ngữ nên "người ta tán thán người ấy"); `3.1`/`3.2`/`3.3`/`6.1`/`6.2` (đổi đại từ theo người nói: "ngài", "chàng", "chúng ta"); `1.3` (`sn7.7:4.1` "Dù là…", cấu trúc câu khác); `14.4` (dùng lại `ja492:1.2` "qua núi non và rừng rậm"; 3 trong 4 cặp khác là `ja427:4.4`, `ja519:20.2`, `dhp188:2`, câu khác ngữ cảnh); `116.3`–`124.3` (4 cặp khác ở mỗi khoá là "Thực hành pháp ở đời này,", 15 cặp "sau khi thực hành pháp ở đây," giữ); `42.3` (`thag6.10:3.3` "tay mang chiếc bình…"); `85.2` ("rễ cây và trái rừng?" thay vì "cùng rễ cây và trái rừng," vì ở `85` nó là tân ngữ của động từ "cho ăn", còn ở `28.2`, `62.2` là mệnh đề liệt kê).
    Trong chính bài: 88 nhóm Pāli trùng nguyên văn (sau khi bỏ dấu câu), tổng 193 cặp; bản Việt giống nhau ở 187 cặp, khác nhau ở 6 cặp, đều có lý do: `3.1`/`6.1`, `3.2`/`6.2` (người nói khác: Sāma hỏi vua, vua hỏi Sāma); `5.4`/`11.2` (cú pháp khác: `5.4` là mệnh đề thời gian của câu trước, `11.2` đứng độc lập); `17.4`/`18.4` (`17.4` là câu hỏi của vua với "chàng", `18.4` là Sāma kể về mình); `28.2`/`85.2` (xem trên); `55.2`/`60.2` (`vādinā` là cách công cụ: ở `55.2` "người nói rằng…" là tân ngữ của "nói chuyện với", ở `60.2` là nguyên nhân "vì người nói rằng…").
  - Số Pāli:
    `ekaputtaṁ` (`58.3`, `59.3`) = đứa con một (eka 1 + putta); `ekūsunā` (`40.4`) = một mũi tên; `tayo` (`40.4`) = ba, và ba người ấy là Sāma cùng cha và mẹ (1 + 1 + 1; vì thế `pitāputtā` ở `40.3` được dịch "cha mẹ và con", xem bất định bên dưới); `dutiyaṁ` (`25.1`) = thứ hai (mũi tên thứ nhất là vết bắn ở `9.1`); `ekapadī` (`30.1`) = lối chỉ đi được một người một dấu chân, dịch "lối mòn" theo `ja532:20.1`; `aḍḍhakosaṁ` (`30.3`) = nửa kosa (aḍḍha ½), không quy đổi ra đơn vị khác; `sahassāni satāni niyutāni` (`71.1`–`71.2`) = hàng ngàn, hàng trăm, hàng niyuta, đều ở dạng số nhiều không xác định số lượng; `niyuta` là đơn vị số lớn mà tầng chưa có tiền lệ (0 khoá), tôi giữ phiên âm và không quy ra con số, cùng nguyên tắc với cụm chưa phân xử được trong `BRIEF_VI4`; `tatiyaṁ` (`126.1`) = thứ ba, khớp "3." ở `0.4`. Không có cụm thuộc loại `Tiṁsakappasahassa`.
  - Thuật ngữ (có đếm trên tầng):
    + `nesāda` → "thợ săn" (25/31 khoá có gốc `nesād-`; `ja533:13.3`, `ja534:17.3`); `nesādā` ở `64.1` là hô cách số nhiều gọi cha mẹ Sāma ("hỡi các thợ săn"), không có tiền lệ riêng.
    + `kammakaro` → "người làm công" (42/71 khoá có gốc `kammakar-` dùng "làm công"; 8 dùng "làm thuê"; 2 dùng "giúp việc"; `sn3.20:5.3`, `dn31:34.5`).
    + `mātāpettibharo` (`90.2`, `98.2`), `mātāpettibharaṁ` (`113.4`) → "phụng dưỡng cha mẹ" (8 so với 4 "nuôi dưỡng" trong 12 khoá có gốc `mātāpettibhar-`; `sn11.11:1.4`, `ja501:14.2`); còn động từ `bharati`, `posati` dịch "nuôi dưỡng" (`18.2`, `26.4`, `113.1`) vì là từ Pāli khác.
    + `sā devatā` → "vị thiên ấy" (53/108 khoá `sā devatā`; "nữ thần" 0 khoá); Pāli dùng giống cái nhưng bản Việt giữ từ trung tính của tầng; `pabbatyāhaṁ` (`103.1`) → "Tôi là vị thiên của núi Gandhamādana".
    + `vāḷamiga`, `sāpada` → "thú dữ" (`vāḷa-` 11/35 khoá; hai từ Pāli khác nhau cùng một từ Việt, vì tầng chưa có tiền lệ riêng cho `sāpada`); `miga` → "thú/muông thú" (thú nói chung, `11.1` "con thú"); `migasammataṁ` → "nơi thú thường lui tới" (đọc `sammata` là "được coi là/quen thuộc"; xem bất định).
    + `kimpurisa` giữ phiên âm (28/29 khoá). `sugatī` → "cõi lành" (145/383 khoá, so với "thiện thú" 115, "cõi thiện" 18). `saccavajja` → "lời tuyên thệ chân thật" (12 trên 29 khoá, "lời chân thật" 3). `puttasoka` → "nỗi sầu vì con" (5 trên 15 khoá; `ja507:4.2`). `paridevati` → "than khóc" (110 trên 476 khoá, "khóc than" 21, "than vãn" 17). `dukkaṭa` → "việc ác" (8 khoá, "việc xấu" 2). `kālaṅkata` → "đã qua đời". `khattiya` → "sát-đế-lợi" viết thường, như `ja521:40.2` (625/721 khoá).
    + `daḷhadhammo` (`5.2`, `27.2`, `46.2`, `61.2`) → "người dùng cung mạnh" (`daḷhadhammā dhanuggaho` → "cung thủ dùng cung mạnh" ở `mn12:62.7`, `sn2.26:3.2`); tên riêng `Pīḷiyakkha`, `Dukūla`, `Pārikā`, `Gandhamādana` giữ phiên âm.
    + `usupātanaṁ` → "tầm bắn của mũi tên"; `puthusalla` → "mũi tên bản rộng"; `udahāro` → "người lấy nước"; `pāṇā piyataro` → "thân yêu hơn mạng sống"; `hato` → "bị giết".
  - Chỗ bất định (không thêm vào thân kinh):
    + `11.3` `Taṁ disvā ubbijī sāma`: chủ ngữ của `ubbijī` là con thú (hô cách `sāma` là Sāma nên không phải chủ ngữ), và `taṁ` đọc là Sāma; cách đọc này hợp với `16.1` `Na taṁ tasa migo sāma` ("con thú đã không sợ chàng": lời đáp cho `12`–`15`) và với `16.3`–`16.4` (vua thú nhận giận dữ và tham mới là nguyên nhân thật). Cách đọc khác: `taṁ` là con thú còn `ubbijī` là vua tự nói (dạng ngôi thứ nhất mất `ṁ`). `16.1` `tasa` không rõ là dạng nào của `tasati`; dịch "đã không sợ".
    + `13.1` `Yato nidhiṁ parihariṁ`: `nidhi` ("kho báu") có thể chỉ cha mẹ hoặc giới hạnh; dịch sát chữ "gìn giữ kho báu", không giải thích.
    + `7.1` `bhaddante` đọc `bhaddaṁ te` ("kính chúc ngài an lành"); `7.4` `gato saye` = đã đến nằm (Sāma đang nằm đó). `8.1` `puthusalla` ("mũi tên bản rộng"). `9.1` `paṭivāmagataṁ` đọc "đã xuyên ra bên trái" (có thể hiểu "đi ngược về bên trái"). `9.2` `dhimhāmi` đọc "thổ ra".
    + `19.1`–`19.2` `usāmattaṁ … atha sāhassa jīvitaṁ`: `usā` đọc "hơi ấm", `sāhassa` đọc `sā assa`; dịch "chỉ còn chút hơi ấm, và đó chính là mạng sống của họ". `22.2`/`22.4` `rucchati`, `avasucchati` là hình thái hiếm: dịch "than khóc" và "khô cạn" theo nghĩa thường gặp; có thể `rucchati` liên quan `rodati`.
    + `24.1` `uṭṭhānapādacariyāya`: đọc "việc đứng dậy hầu hạ" (`uṭṭhāna` + `pādacariyā`); không dịch thêm "nhớ". `24.3` `tāta` là lời gọi thân ("con ơi").
    + `30.1`–`30.2` `ussīsake` đọc "ở phía đầu"; `30.4` `agārakaṁ` đọc "túp lều nhỏ" (hậu tố nhỏ). `30.3` `aḍḍhakosaṁ` giữ "kosa" vì không có tiền lệ đổi đơn vị.
    + `32.4` `vutto vajjāsi` đọc "xin hãy nói lời đảnh lễ thay tôi" (có thể hiểu "khi được dặn thì hãy nói").
    + `34.3` `Ajarāmarohaṁ āsiṁ`: "ta từng như người không già, không chết"; thêm "như" vì Pāli là câu danh từ, không có ý khẳng định thật. `34.6` `natthi maccussa nāgamo` = "tử thần chắc chắn sẽ đến" (`sn4.9:5.4` cùng dòng).
    + `36.3`–`36.4` `Tadā hi pakataṁ pāpaṁ, cirarattāya kibbisaṁ`: `tadā` chỉ lúc bắn Sāma; `cirarattāya` bổ nghĩa cho "tội lỗi"; dịch "tội lỗi suốt thời gian dài".
    + `40.3` `Adūsakā pitāputtā`: `pitāputtā` đọc "cha mẹ và con" vì `tayo` (ba người); nếu đọc đúng chữ là "cha và con" thì chỉ hai người; cách đọc ba người (Sāma + cha + mẹ) hợp cả `tayo` lẫn mạch truyện (cha mẹ mù sẽ chết vì thiếu người chăm).
    + `41.4` `maññehaṁ sugatī tayā`: `tayā` có thể là "nhờ ngài (làm vậy)"; dịch "tôi nghĩ nhờ đó ngài sẽ được cõi lành", không nêu thêm. `Āguṁ` ở `40.1` đọc "lỗi/tội".
    + `43.2` `manussasseva āgato`: đọc "như của một con người đang đến". `44.1`–`44.2` `santaṁ vajati, santaṁ pādāni neyati` đọc phó từ "êm nhẹ" và "khẽ khàng".
    + `50.3`–`50.4` `nivāpo` đọc "thức ăn được cung cấp"; `sammā` dịch "quả thật".
    + `51.4`, `54.2` `sūnaggavellitā`: hình thái hiếm, đọc "cuộn lên ở đầu (tóc)"; không rõ `sūna` có nghĩa riêng hay không.
    + `52.4` `maññe na dūramāgato`: "tôi nghĩ nó chưa đi xa" (cách đọc khác: "nó đã trở về không xa").
    + `53.2` `tuyhaṁ` số ít nhưng người nghe là cha mẹ (số nhiều ở `53.3` `pavedetha`): dịch "các vị".
    + `57.2` `migasammate`: đọc "nơi thú thường lui tới" (xem `17.4`, `18.4`). Sự việc `sammata` ("được coi là, quen thuộc") là cách hiểu theo ngữ cảnh.
    + `58.3`, `59.3` `ghātimhi`: đọc là vị trí cách của `ghātī` ("đối với kẻ giết"), vì `59.4` `akkodhaṁ āhu paṇḍitā` chỉ đứng được như vậy; cách đọc khác là động từ ngôi thứ nhất số nhiều ("chúng ta giết") không hợp mạch.
    + `64.1`–`64.2`: `nesādā` đọc là hô cách số nhiều "hỡi các thợ săn" (cha mẹ Sāma thuộc dòng thợ săn, theo `7.1` `nesādaputto`); `tayā` số ít (ông) nên dịch "sự tôn kính đã được ông thể hiện". Cách đọc khác: `nesāda` là tên một người.
    + `66.2`–`66.3` `mukhañca bhujadassanaṁ`, `saṁsumbhamānā attānaṁ`: cả hai khó phân xử; `bhujadassanaṁ` dịch "dáng đôi cánh tay" (`dassana` = dáng vẻ, như `kalyāṇadassana`), `saṁsumbhamānā` đọc "tự gieo mình"; chữ "xuống" không thêm. `66.4` `kālamāgamayāmase` = "chờ đến thời của mình" (có thể là cái chết).
    + `67.2` `ākāsantaṁva dissati` đọc "trông như vươn đến tận bầu trời" (`ākāsanta` = chân trời). `69.4` `patikunthito` đọc như `paṁsukunthita` ở `73.2`: "bị phủ kín". `70.4` `vasathassame` đọc "nơi am thất cư ngụ" (hợp thành `vasatha-assame`); có thể là mệnh lệnh `vasatha assame` ("hãy ở nơi am thất"): không phân xử được.
    + `71.2` `niyutāni`: xem phần số Pāli.
    + `76.4` `adhammo kira bho iti`: dịch "Quả thật là phi pháp, thưa các vị"; `iti` là dấu hiệu đóng lời trích, không dịch riêng. Nháy mở ở `76.4` và đóng ở `85.4` theo Pāli.
    + `77.1`–`81.1`: `pamatto` ("lơ đãng"), `padittosi` ("bừng cháy"), `pakuddhosi` ("nổi giận"), `pasuttosi` ("ngủ say"), `vimanosi` ("buồn bã") đều dịch theo nghĩa thường; `bāḷhaṁ` là "dữ dội/rất". Lời của cha mẹ trách Sāma không đáp lại họ; `padittosi` không phân xử được là bừng cháy vì độc hay vì giận.
    + `82.1` `jaṭaṁ valinaṁ paṁsugataṁ`: "búi tóc bện nhăn nhúm, dính bụi". `84.1` `Ko dāni nhāpayissati` là nguyên nhân thể (làm cho tắm), dịch "tắm cho chúng tôi" (đối tượng suy từ mạch).
    + `87.1`–`101.4`: `Yena saccena` đọc "do lời chân thật nào mà"; `pure ahu` = "trước kia là". `91.1`–`91.2`, `99.1`–`99.2` `kule jeṭṭhāpacāyiko` đọc "người tôn kính bậc trưởng thượng trong gia tộc" (`kule` = trong gia tộc). `93.2` `pitucca te` = "của cha con" (mẹ nói với Sāma), `101.2` `mātucca te` = "của mẹ con".
    + `103.1` `Pabbatyāhaṁ`: đọc `pabbatī ahaṁ` (nữ thần núi), dịch "vị thiên của núi Gandhamādana". `103.2` `cirarattanivāsinī` = "cư ngụ nơi đây từ lâu".
    + `106.1` `bhaddaṁ vo` = "kính chúc các vị an lành"; `106.4` `Mañjunābhivadetha` = "hãy nói bằng lời dịu dàng".
    + `110.3`–`110.4` `Petaṁ taṁ sāma maddakkhiṁ, ko nu tvaṁ sāma jīvasi`: `ko nu` đọc là "ai", nên dịch "chàng là ai … mà còn sống?"; cách đọc khác `kho nu` ("có phải … còn sống?") không phân xử được.
    + `111.3` `upanītamanasaṅkappaṁ` đọc "tâm ý đã thu rút vào trong" (không có tiền lệ); `112.3` `nirodhagataṁ` đọc "đã đi vào chỗ ngưng dứt" (không thêm "tri giác").
    + `113.3` `tikicchanti` = "chữa trị" (nghĩa gốc). `114.3` `Idheva naṁ pasaṁsanti`: "ngay ở đời này, người ta tán thán người ấy".
    + `115.1` `Esa bhiyyo`: đọc "Giờ đây … càng thêm". `115.3` `Saraṇaṁ taṁ sāma gacchāmi` dịch "ta đến nương tựa nơi chàng" (không dùng chữ "quy y" vì không phải công thức Tam quy).
    + `125.4` `mā dhammaṁ rāja pāmado”ti`: "tâu vua, chớ phóng dật đối với pháp" (đã giữ `ti` chung với nháy đóng theo thông lệ của tầng).
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 511/511, cùng thứ tự.
    2. Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá: 0/511 lệch (Pāli có 72 khoá mang nháy, gồm 36 nháy mở và 36 nháy đóng, khớp từng khoá; không có nháy đơn trong bài).
    3. Pāli trùng nguyên văn trong chính bài: 88 nhóm, 193 cặp; Việt khác ở 6 cặp có lý do, xem trên. Pāli trùng với bài khác: 131 khoá, 933 cặp; Việt khác ở 167 cặp (53 khoá), phần lớn do đổi đại từ theo người nói hoặc cấu trúc câu.
    4. Dấu lược `…pe…`, `…` trần và `(…)`: Pāli 0/511 khoá, Việt 0/511 (phép chạy rỗng, không có gì để so).
    5. Số Pāli: xem trên; không có cụm chưa phân xử được trừ `niyutāni` (giữ phiên âm).
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang tiếng Việt chỉ là tên riêng và tên cây giữ phiên âm có ghi chú (`Jātaka`, `Mūgapakkha`, `Pīḷiyakkha`, `Dukūla`, `Pārikā`, `Gandhamādana`, `Kāsi`, `kimpurisa`, `tinduka`, `piyāla`, `madhuka`, `kāsumārī`, `assattha`, `niyuta`, `kosa`). Đã in cặp Pāli↔Việt ra đọc toàn bài (511 cặp) và sửa sau lượt đọc: `Ta sẽ làm người giúp việc` → "người làm công" (theo đếm trên tầng), "vị nữ thần" → "vị thiên" (53/108 và 0 cho "nữ thần"), `mātāpettibharo` → "phụng dưỡng" (8 so với 4), viết thường chữ đầu sau dấu phẩy.
