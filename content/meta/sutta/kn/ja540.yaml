  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 94 khoá chênh lệch lớn nhất (trên 511 khoá) → khác nghĩa hoặc lệch dòng 26 khoá: sửa 0, giữ 13, bất định 13; 68 khoá còn lại chỉ khác diễn đạt (kể cả lệnh `Dhammaṁ cara mahārāja` ở `116`–`125`). Giữ: `5.3`–`5.4`/`46.3`–`46.4`, `6.3`–`6.4`, `8.3`, `37.1`–`37.2`, `38.1`–`38.2` (bản mù cắt hoặc đảo nửa dòng khác Pāli; bài theo đúng ranh giới khoá), `103.1` `Pabbatyāhaṁ` (bản mù “Ta sống ở núi” bỏ mất `pabbatyā`; bài “vị thiên của núi”), `50.3` `sammā` (âm ā dài, đọc trạng từ “quả thật”; bản mù đọc hô ngữ “bạn ơi”, khác `samma` ngắn ở `3.3`). Bất định: `9.1` `paṭivāmagataṁ`, `13.1` `nidhiṁ parihariṁ`, `51.4`/`54.2` `sūnaggavellitā`, `66.1`–`66.3` `samajjantā`, `bhujadassanaṁ`, `saṁsumbhamānā`, `67.2`/`68.2`/`69.2`/`70.2` `ākāsantaṁva`, `111.3` `upanītamanasaṅkappaṁ`, `112.3` `nirodhagataṁ` (bản mù ghi không chắc ở hầu hết các khoá này, bài giữ cách đọc sát chữ). Rà đối kháng toàn bài 511 khoá: nháy khớp Pāli từng khoá, không dấu lược, xưng hô (Sāma, vua, cha mẹ, vị thiên) nhất quán, số `aḍḍhakosa` = nửa kosa, `tayo` = ba, `niyuta` giữ phiên âm; không phát hiện thêm lỗi. Ghi thêm: `40.3` `pitāputtā` dịch “Cha mẹ và con” (đủ `tayo` ba người), khác `ja515:19.3` “cha và các con trai”; giữ vì ngữ cảnh hai bài khác nhau, chưa phân xử được tiền lệ. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bài 511 khoá, đoạn song song ud6.4, tha-ap402, ja547; không có bản Việt nguyên bài): sửa 5 khoá. `70.4` sai nghĩa: `idheva vasathassame` đọc `vasatha assame` (2 số nhiều, nói với cha mẹ), "các vị hãy cứ ở lại ngay đây, trong am thất" — bản cũ gắn dòng này vào chỗ Sāma nằm, trái với `30.3` (cách nửa kosa) và với lời đáp `71` ("chúng tôi chẳng sợ thú dữ"). `66.3` sai nghĩa: `saṁsumbhamānā attānaṁ` là "tự đấm đánh thân mình" (`saṁsumbhati` = đánh, như `ud6.4:30.2` `muṭṭhīhi saṁsumbhiṁsu`), không phải "gieo mình xuống". `40.1` `kira` → "quả thật" (vị thiên chứng kiến, không phải "nghe nói"; khớp `76.4`). `14.3` `kimpurisā … gacchāma`: chủ ngữ gồm cả kimpurisa nên "Chúng tôi cùng họ vui vẻ đi". `76.4` `bho` là thán từ: "Ôi, quả thật là phi pháp." (bỏ "thưa các vị"). Giữ: `22.4`/`23.4` "như dòng sông khô cạn" (cùng cách dịch `ja547:493.4`), `104.1` (theo `tha-ap402:10.1`), `64.3` "chúng tôi" (đối xứng `63.3`). Bất định không đổi: như các mục trên; `47.2` `adurāgataṁ` để nguyên chờ quyết định chung.

  Quyết định hội đồng biên tập 2026-10-16: A1 — `47.2`, `107.2` (`adurāgataṁ` = đến không phải là điều không mong, không phải "khó nhọc"; DPD `durāgata`); B21 — `48.3`, `108.3` (`khuddakappāni` = ngọt như mật nhỏ (DPD `khuddā`, `kappa`)); B22 — `7.1` (`bhaddante` người nói thấp hơn hoặc ngang hàng thì "thưa ngài/ông/bạn", không dịch lời chúc); C3 — `0.2` (tên nipāta "Nhóm N Kệ").

  Nghiên cứu nguồn ngoài 2026-10-16: E. B. Cowell và W. H. D. Rouse (dịch), The Jātaka vol. VI (PTS 1907, phạm vi công cộng; đọc qua static.sirimangalo.org/old/jataka/6.htm, Jātaka 540 tr. 36–52; Cowell rút gọn các điệp khúc, nên các nhóm lặp 59–70, 71–85, 87–100 được đối chiếu theo mẫu); đã đối chiếu toàn bài (các nhóm 1–125); không sửa khoá nào, nghĩa khớp Cowell ở mọi khoá có nội dung riêng (Sāma bị bắn, lời kể về cha mẹ mù, lời nói chân thật của mẹ, cha và nữ thần Gandhamādana, bài thuyết pháp cuối). Ghi nhận bất đồng với quyết định B21: 48.3 và 108.3 `khuddakappāni` hội đồng chọn 'những trái ngọt như mật' (DPD; Francis ở ja532 cũng dịch 'fruits like honey'), nhưng Cowell ở đây dịch 'though few and little' (đọc là nhỏ và ít); không đổi vì là quyết định chung, chỉ báo cáo. Bất định: 13.1 `nidhiṁ parihariṁ` (bản dịch 'gìn giữ kho báu'; Cowell 'since I first donned my dress of bark'), 19.1–19.2 `usāmattaṁ… sāhassa jīvitaṁ` (bản dịch 'chút hơi ấm… mạng sống'; Cowell 'flickering spark… food at most a week's supply', chú thích: chú giải giải thích `usā` là thức ăn).
