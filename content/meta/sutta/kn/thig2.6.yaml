notes: |-
  Đủ 14/14 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Bài này gần như toàn bộ là Pāli trùng nguyên văn với thig2.5 (bài đã publish trong tầng), nên tôi dùng lại nguyên văn đã có thay vì dịch lần hai:
  · `Daṇḍamolubbha gacchāmi,` = thig2.5:1.3 → chống gậy mà bước đi,
  · `pabbataṁ abhirūhiya.` = thig2.5:1.4 → leo lên tận núi cao.
  · `pattakañca nikujjiya;` = thig2.5:2.2 → lật ngược cả cái bát;
  · `saṅghāṭi` = y ngoài, theo thig2.5:2.1 (Tôi đặt y ngoài xuống); Pāli ở đây là Nikkhipitvāna saṅghāṭiṁ, đảo thứ tự với thig2.5 nhưng cùng nghĩa nên dùng lại y hệt.
  · `Tisso vijjā anuppattā,` = mn86:18.65 và sn8.12:5.3; ở tầng còn bốn bài dịch Tôi đã chứng ngộ tam-minh cho sacchikatā, còn ở đây Pāli là anuppattā nên tôi theo sn8.12: tam minh đã được chứng đạt.
  · `kataṁ buddhassa sāsanan”ti.` → đã làm tròn lời dạy của Đức Phật”ti. (TIEN_LE_PHAI.md chỉ định nguyên văn này cho thag1.107 và ba bài anh em).
  · Khung `:0.1` giữ dạng Therīgāthā 2.6 như thig2.5/thig2.9 đã dùng (không bỏ số), `:0.3` theo dạng Kinh Kệ Của Trưởng Lão Nữ, `:3.1` giữ hai dấu lược.

  Vế không trùng với bài nào, tôi tự dịch và tra tiền lệ: cittaṁ vimucci me → tâm ta bèn được giải thoát (vimutti → giải thoát đã có nhiều trong tầng); selamhi → tảng đá (thig2.5:2.3 dùng tảng đá cho Sele khambhe); gatayobbanā → tuổi già đã kề.

  Bất định đã ghi nhận: Sujato ở 1.3–1.4 tách hình ảnh theo cách khác Pāli (I climb the mountain, / leaning on a staff, trong khi Pāli là bước đi chống gậy rồi leo lên núi). Tôi theo Pāli và dùng lại nguyên văn của thig2.5, vì thứ tự hành động trong Pāli là chống gậy đi trước rồi leo núi sau; ghi ra vì đây là chỗ hai nguồn đọc khác nhau.

  Đối chiếu tầng tham khảo: Sujato có 13/14 khoá, im lặng đúng khoá dòng kết (21 ký tự). Mọi khoá Pāli dưới 40 ký tự nên mẫu số coverage rỗng, không cần ghi reference-gaps.yaml. Bản Việt hiện hành không có cho Trưởng Lão — giới hạn bản chụp upstream.

  Kiểm thủ công trên TOÀN BỘ 14 khoá (kiểm() rỗng vì không khoá Pāli nào từ 40 ký tự): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược khớp (3.1 có 2 ở cả hai phía), nháy kép cân (mở 1.1, đóng 2.6), không `(…)` dở. save_vi hai lần, idempotent.
  Không chạy npm run validate|test|check|build (đợt này cấm), nên technical_integrity = 9.6.
