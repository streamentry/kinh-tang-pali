notes: |-
  Dịch từ Pāli root (snapshot ghim `11c9d708`), đủ 68/68 khoá, thứ tự khoá đúng thứ tự Pāli. Bài kệ ký sự của trưởng lão Nimittabyākaraṇiya (vị đạo sĩ giải đoán điềm báo, kể về điềm động đất khi bậc Chánh Đẳng Giác giáng sinh); bài thứ mười của Phẩm Hoa Sa-la (Sālakusumiyavagga), kèm uddāna cuối phẩm.
  Status bắt buộc `draft`: tầng Anh đã ghim không phủ `tha-ap` (chi tiết ở `blocking_errors`); `triangulation` ≤ 8.0. Chỉ có một nguồn tham khảo Việt không phân đoạn (bản nguyên bài của Bhikkhu Indacanda ở mục Tra cứu toàn văn); đã đọc đối chiếu nghĩa cả bài, không có căn lề theo segment nên KHÔNG tính vào coverage và không được tính là tầng tham khảo đã audit. Nó khớp nghĩa ở các điểm khó: `chaḷaṅge pāramiṁ gatā`, `uppādoyaṁ suvatthiko`, `samphussa`, `dijo`; bản dịch ở đây viết lại từ Pāli, không chép.
  `:0.3` KHÔNG có số thứ tự: Pāli `tha-ap472:0.3` = `Nimittabyākaraṇiyattheraapadāna` không bắt đầu bằng chữ số, nên theo quy tắc chung của phẩm (giữ số khi và chỉ khi Pāli có số) bản Việt không thêm. `translationTitle` BẰNG ĐÚNG giá trị `:0.3` (đã so từng ký tự). Số thứ tự nằm ở `:16.1` (`dasamaṁ` → `thứ mười`).
  Tiền tố `:0.3`: đo trên các bài `tha-ap` Việt đã có trong cây làm việc, `Bài Kệ Tuyên Ngợ Về Trưởng Lão` 236 · `Bài Kệ Tuyên Ngôn Về Trưởng Lão` 105 · `Ký Sự Về Trưởng Lão` 99 · `Bài Kệ Tuyên Ngợi Về Trưởng Lão` 10 · `Kinh Kệ Của Trưởng Lão` 5. Ở phạm vi gần nhất (tha-ap463–482): `Tuyên Ngợ` 14 · `Tuyên Ngôn` 1 · `Ký Sự` 1. Cả hai phạm vi cùng cho `Tuyên Ngợ` là đa số nên bài này theo đa số. LƯU Ý CHO BIÊN TẬP: `Tuyên Ngợ` rất có thể là lỗi chính tả của `Tuyên Ngôn` ở hơn 230 tệp; đó là việc biên tập phán một lượt cho cả cuốn, bài này không tự sửa riêng để khỏi lệch với các bài anh em cùng phẩm.
  `:0.1` `Therāpadāna` giữ nguyên Pāli (446 tệp; 11 tệp dùng `Trưởng Lão Ký Sự`). `:0.2` `Sālakusumiyavagga` → `Phẩm Hoa Sa-la` theo đa số của chính phẩm (7 tệp; 1 tệp `Phẩm Hoa Sāla`, 1 tệp `Phẩm Sālakusumiya`).
  Pāli trùng nguyên văn với bài khác ở 17/68 khoá (không tính `…pe…`), trong đó dùng lại nguyên văn bản Việt đã có ở 15 khoá; tổng 2.356 cặp đã dò, 568 cặp bản Việt khác nhau (phần lớn do nhiều biến thể của chính tầng). Hai khoá cố ý khác tiền lệ: `:6.2` `āgacchuṁ mama santikaṁ` tiền lệ duy nhất dùng `tôi` còn bài này dùng `ta` (thống nhất ngôi kể với toàn bài và các bài cùng phẩm); `:9.3` `Saññāpetvāna janataṁ` tiền lệ duy nhất `Sau khi bảo dân chúng` — `saññāpeti` là làm cho hiểu/nhận biết, nên viết `Sau khi làm cho dân chúng hiểu rõ`. Số cặp Pāli trùng TRONG CHÍNH bài: 1 nhóm (`…pe…` ở `:12.2`/`:13.2`/`:14.2`), cả ba Việt đều `…`; `kataṁ buddhassa sāsanaṁ` ở `:13.3` và `:14.3` khác nhau ở dấu nháy đóng nên Việt khác (`.` và `”.`), đúng.
  Công thức dùng lại: `Dvenavute ito kappe` → `Vào chín mươi hai kiếp trước` (15 khoá cùng dạng; 9 khoá `trước đây`, 9 khoá `Từ`); `Duggatiṁ nābhijānāmi` → `Ta không còn biết đến đọa xứ` (50 khoá, và các bài liền kề cùng phẩm); `Kilesā jhāpitā mayhaṁ` → `Các phiền não của ta đã được thiêu rụi` (87); `Svāgataṁ vata me āsi` → `Thật lành thay sự đến của ta` (81); `Paṭisambhidā catasso` → `Bốn vô ngại giải` (452); `kataṁ buddhassa sāsanaṁ` → `đã làm tròn lời dạy của Đức Phật`; `Tassuddānaṁ` → `Tóm tắt phẩm này:` (29 so với 9 `Tóm lược:`); `gaṇitāyo vibhāvibhi` → `đã được các bậc sáng suốt tính đếm` (7/7).
  DẤU LƯỢC: `:12.2`, `:13.2`, `:14.2` là `…pe…` ở Pāli, mỗi khoá giữ đúng MỘT `…` (611 khoá cùng dạng trong tầng). Pāli không có `(…)` trần ở khoá nào, nên không có `(…)` nào cần giữ.
  Nháy: Pāli mở “ ở `:1.1`, đóng ” ở `:14.3`; nháy đơn ‘ mở ở `:6.3` và đóng ’ ở `:6.4`, rồi ‘ mở ở `:7.2` và đóng ’ ở `:9.2`. Bản Việt khớp số lượng từng loại nháy ở cả 68/68 khoá (khớp Pāli từng khoá, không chỉ cân tổng). Câu hỏi `:6.4` có thêm `?` theo văn nói của tiếng Việt, Pāli không có dấu hỏi (nghi vấn nằm ở `kiṁ`); khoá đóng nháy đơn ’ như Pāli, không còn dấu chấm sau đó.
  Số trong bài (tự tính): `catupaññāsasahassāni` = catu 4 + paññāsa 50 = 54, nghìn ⇒ 54.000, viết `Năm mươi tư ngàn` theo tiền lệ duy nhất; `dasasahassi` = mười ngàn (thế giới, đọc theo ngữ cảnh động đất của toàn kệ); `Dvenavute` = dve 2 + navuti 90 = 92 ⇒ `chín mươi hai` (tiền lệ 15 khoá cùng dạng); `aṭṭhahetūhi` = tám nguyên nhân; `pañca sīle` = năm giới; `catasso` = bốn; `sattacattālīsamo` (`:17.1`) = satta 7 + cattālīsa 40 = 47 ⇒ `thứ bốn mươi bảy`; `dvesattati` (`:20.3`) = dve 2 + sattati 70 = 72 ⇒ `bảy mươi hai`. Không dùng cụm `tiṁsakappasahassa`.
  Thuật ngữ: `sambuddha` → `Chánh Đẳng Giác` (74 khoá trong tầng, so với 42 khoá `Toàn Giác`); `nāyaka` → `bậc Dẫn Đạo` (32 so với 17 `Lãnh Đạo`); `cakkhumā` → `bậc Có Mắt` (như `tha-ap471`); `nimitta` → `điềm báo`; `byākaraṇa` → `giải đoán`; `himavā` → `núi Himavanta` (như các bài khác trong tầng); `sīla` → `giới`; `mante` → `thần chú`. Ngôi kể `ta` cho toàn bài, nhất quán với các bài cùng phẩm.
  Bất định (ghi ở đây, không thêm vào thân kinh): (1) `:7.4` `uppādoyaṁ suvatthiko` — `uppāda` có thể là sự xuất hiện của điềm động đất hay của bậc Phật; dịch `sự xuất hiện này là điều an lành`, không chọn đối tượng. (2) `:8.1` `samphussa` (gerund của `samphusati`, chạm/tiếp xúc) đi với `aṭṭhahetūhi` dịch `Do tiếp xúc với tám nguyên nhân`, theo nghĩa gần sát chữ; có thể đọc thoáng hơn là `bị tác động bởi`. (3) `:4.2` `dasasahassi` thiếu danh từ (hiểu là hệ mười ngàn thế giới) — dịch `mười ngàn thế giới`. (4) `:10.3` `ubbegajātā sumanā` — `ubbega` có thể là kinh động hoặc phấn khích; vì đi với `sumanā` (hoan hỷ) và `tuṭṭhahaṭṭhā` (vui mừng hớn hở) nên dịch `Phấn khởi trào dâng`. (5) `:20.2` `dijo` đọc là `Bà-la-môn` (nhị sinh), không hiểu là chim. (6) `:19.2` `pūjā`, `:20.1` `paṭibhānī` trong uddāna là tên rút gọn của các bài `Citakapūjaka` và `Sayampaṭibhāniya`; giữ nguyên dạng Pāli của Pāli root, không suy rộng. (7) `:2.2` `chaḷaṅge` dịch sát `sáu chi phần`, không thêm tên môn.
  Hạn chế của cổng: cổng kỹ thuật CHƯA chạy vì agent dịch không được phép chạy lệnh của kho; bốn lệnh còn lại cần chạy: `npm run validate` · `npm test` · `npm run check` · `npm run build`. `technical_integrity` đặt 9.6 vì lý do đó.
  Đã tự kiểm: JSON hợp lệ; 68/68 khoá trùng tập khoá Pāli, đúng thứ tự; không khoá rỗng; NFC sạch; không khoảng trắng thừa; không khoá nào chép nguyên Pāli (trừ `:0.1` `Therāpadāna`, theo tiền lệ); tên riêng Pāli chỉ ở `:0.1`, `:0.3`, `:15.1`, `:16.1`, `:19.1`–`:20.2`.
