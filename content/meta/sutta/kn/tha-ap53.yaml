notes: |-
  **ĐỌC TOÀN BỘ PĀLI TRƯỚC KHI VIẾT.** 33 khoá; sau khi ghi đã in lại từng cặp Pāli↔Việt và đọc.

  **`:0.3` — BỎ SỐ, VÀ PĀLI LÀ CHỨNG CỨ.** Pāli `tha-ap53:0.3` = `Vidhūpanadāyakattheraapadāna`
  — KHÔNG bắt đầu bằng số. Đo lại bằng script (`_n9_final.py`) trên **437** tệp `tha-ap` đã có
  bản Việt; loại **67** tệp có `:0.3` rỗng, còn **370** lượt đo được:

    · Pāli `:0.3` **CÓ số** → bản Việt **giữ số 117**, trong đó **117/117 khớp đúng số Pāli**;
      **bỏ 0**. Số viết sai: **0**.
    · Pāli `:0.3` **KHÔNG có số** → bản Việt **giữ 0**, **bỏ 253**.

  ⇒ Giữ số thứ tự **khi và chỉ khi** Pāli `:0.3` bắt đầu bằng số. Hình thức khi giữ: chữ số
  kèm dấu chấm **101** so với số trần **16** (trong 117 tệp) ⇒ chọn `N.` Ở đây Pāli không có số
  ⇒ **bỏ**, đặt là `Bài Kệ Tuyên Ngợ Về Trưởng Lão Vidhūpanadāyaka`.

  **COVERAGE ĐO ĐƯỢC — MẪU SỐ 2, VÀ MẪU SỐ NÀY RẤT NHỎ.** Pāli ≥ 40 ký tự (loại block `:0`)
  chỉ có **2** khoá: `:8.1` (68 ký tự) và `:9.1` (42 ký tự). Tầng Anh = **0/2 = 0%**. Cảnh báo
  theo BRIEF_VI4 §4: một trong hai khoá đó (`:9.1`) là **colophon** — tiêu đề đóng bài — nên cổng
  coverage ở đây gần như **không đo được gì**, chứ không phải "không cần ghi nhận". Hai việc
  khác nhau, tôi ghi cả hai.

  **DÙNG LẠI NGUYÊN VĂN 14/33 KHOÁ.** Đo bằng script, so cả câu chữ lẫn khoá (loại chính bài
  đang dịch khỏi bảng tra): `:0.1` `Therāpadāna` (358/367 tệp giữ nguyên); `:0.2`; `:1.1`
  “**Của Đức Phật Padumuttara,** (6 tệp); `:1.2` *bậc tối thượng thế gian, bậc Vững Vàng kiên định;*
  (5); `:2.1` *Làm cho tâm mình tịnh tín,* (3); `:2.2` *chắp tay cung kính hướng về Ngài;*
  (tha-ap333:4.2); `:3.4` *đã nói những bài kệ này.* (3); `:4.2` *và nhờ những tâm nguyện thanh tịnh;*
  (2); `:4.3` *Trong suốt một trăm ngàn kiếp,* (4); `:6.4` *là các Chuyển Luân Vương có đại oai lực.*
  (12 trong 50 tệp trùng nguyên văn); `:7.1`–`:7.4` (372 · 26 · 27 · 342 tệp). Cộng thêm
  `:1.4` và `:5.4` dùng lại lời với tiền lệ đúng câu đó.

  **BỐN BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.** 0 tiền lệ cho cả bốn ⇒ dịch từ Pāli và ghi ở đây:
    · `pakkamiṁ uttarāmukho.` (`:2.4`) — `pakka` đọc được cả "bỏ đi, sang bên kia" lẫn "hướng
      bắc"; `uttarāmukha` = mặt ngửa lên. Tôi dịch *rồi quay mặt đi.* theo nghĩa "rời đi",
      vì đây là công thức lễ lạt kết bằng việc quay đi. Nếu đọc theo hướng bắc thì câu còn
      đúng, nhưng thành chi tiết địa lý không có trong kinh.
    · `Cetoguṇasamāhito;` (`:5.2`) — `cetoguna` là "ba điều kiện của tâm"; kinh **không** nói đó
      là ba điều kiện nào. Tôi giữ đúng số ba và không đoán danh tính: *gom tụ cùng ba điều kiện
      của tâm;* Đây là khoá yếu nhất của bài, nên `ambiguity_integrity` hạ.
    · `Saṭṭhikappasahassamhi,` (`:6.1`) — `Saṭṭhi` đọc là **sáu mươi**, không phải sáu: Pāli có
      `chasaṭṭhi` (66), `sattasaṭṭhi` (76), `tasaṭṭhi` (116), nên `saṭṭhi` là gốc sáu mươi; và
      dãy số trong Therāpadāna chạy 5 · 20 · 30 nghìn kiếp (`Pañcakappasahassamhi` 1 tệp,
      `Vīsakappasahassamhi` 1, `Tiṁsakappasahassamhi` 4 — tệp nào cũng có tiền lệ Việt đã dịch),
      nên 60 nghìn mới đúng thang. `Saṭṭhi` cũng có thể đọc là "sáu" trong Pāli, nên tôi ghi lại
      là bất định còn mở, dù đã chọn theo tiêu chí thang số.
    · `bījamānasanāmakā;` (`:6.2`) — "mang danh là người rao giống". `bīja` ở đây là hạt giống,
      dùng kép theo nghĩa "tra hạt"; `:4.1` Pāli gọi đúng là `bījanidānena` (tấm hạt giống).

  **DẤU LƯỢC.** Bài này **không** có khoá lược nào (0 `…` trong 33 khoá) — không có gì để
  mở rộng, không có gì để bỏ.

  **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:7.4`; **thêm** cặp nháy cong `‘` mở ở `:4.1` và
  `’` đóng ở `:4.4`, vì Pāli có đúng hai tầng đó. Đếm lại ở mức cả bài: cân kép **1/1**, cân đơn
  **1/1**. (`_hvi.ngoặc()` chỉ đếm nháy kép, nên cặp đơn tôi tự đếm — đây là loại lỗi mà chốt im
  lặng.)

  **TỰ KIẾM 4 LỚP LỖI CHỐT KHÔNG BẮT** (`_n9_selfcheck.py`, 99 khoá, **0 lỗi**): tập khoá Việt
