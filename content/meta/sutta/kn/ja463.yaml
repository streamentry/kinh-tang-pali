notes: |-
  Đợt 19, làn 49. Dịch từ Pāli root commit đã ghim, đủ 67/67 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem dưới).

  **Tiêu đề, theo khuôn của các bài anh em cùng phẩm (`ja455`–`ja462`).**
  - `0.2` “Bộ Mười Một Bài Kinh” và `0.3` “Phẩm Voi Hiếu Mẹ” dùng lại nguyên văn từ `ja462:0.2`, `ja462:0.3` (cùng `Ekādasakanipāta` + `Mātuposakavagga`).
  - `0.4` “9. Kinh Suppāraka” và `14.1` “Kinh Suppāraka thứ chín.” theo khuôn “N. Kinh <tên>” / “Kinh <tên> thứ N.” của `ja462:0.4`, `ja462:12.1` (thứ tám) và `ja461` (thứ bảy); số 9 ở tiêu đề khớp `navamaṁ` ở `14.1`.
  - `15.1` “Bộ Mười Một Bài Kinh đã hoàn tất.” theo khuôn của `ja426:10.1` “Bộ Tám Bài Kệ đã hoàn tất.” và `ja438:11.1`, với tên bộ lấy đúng như `0.2` của chính bộ này.
  - `16.1` “Tóm lược:” theo `ja426:11.1`, `ja438:12.1`.

  **Cấu trúc bài.** Kệ hỏi–đáp về sáu vùng biển. Các khoá `1.1`–`1.4`, `3.1`–`3.4`, `5.1`–`5.4`, `7.1`–`7.4`, `9.1`–`9.4`, `11.1`–`11.6` là lời các thương nhân hỏi người hoa tiêu Suppāraka; `2`, `4`, `6`, `8`, `10`, `12`–`13` là lời đáp của Suppāraka (Bồ-tát), trong đó `13.1`–`13.6` là lời tuyên thệ chân thật (`saccakiriyā`). Phân vai này suy từ nội dung kệ, không có văn xuôi để đối chứng, không ghi vào thân kinh; bản Việt không thêm “họ hỏi” hay “ông đáp”.

  **Tiền lệ dùng lại, đã đo.**
  - `13.1`–`13.2` Pāli `Yato sarāmi attānaṁ, yato pattosmi viññutaṁ;` trùng nguyên văn với `cp30:6.1`–`6.2`; đã dùng lại đúng bản Việt của `cp30` (“Từ khi ta bắt đầu nhớ lại bản thân mình, từ khi ta đạt đến sự hiểu biết”). Cặp này cũng trùng với `ja419:3.1`–`3.2` nhưng bản Việt của `ja419` khác hẳn (“tự mình giữ mình trong đời”, “đã được xác nhận”) và lỏng hơn; theo `cp30` vì sát Pāli hơn, không sửa `ja419`.
  - `13.5` `Etena saccavajjena,` trùng `cp30:7.1`; dùng lại “Với lời tuyên thệ chân thật này,”. Cụm này lặp ở khoảng 40 khoá Jātaka khác (`ja489`, `ja540`, `ja544`…) chưa dịch, nên cách dịch ở đây sẽ thành tiền lệ.
  - `13.3`–`13.4` `Nābhijānāmi sañcicca, ekapāṇampi hiṁsitaṁ;` trùng `cp30:6.3`–`6.4` (khác biệt chỉ ở chữ hoa đầu dòng) nhưng tôi **cố ý lệch**: `cp30` dịch “ta không thấy trong mình có chuyện cố ý gây hại đến một sinh vật nào”, làm mất `api` (“dù chỉ một”) và đổi `abhijānāti` (biết, nhớ) thành “thấy trong mình”; tôi dịch “Ta không biết mình đã cố ý / làm hại dù chỉ một sinh vật”. Xin người điều phối quyết một lần cho cả hai bài.
  - `2.1`–`2.2` (và `4`, `6`, `8`, `10`, `12`) Pāli `Kurukacchā payātānaṁ, vāṇijānaṁ dhanesinaṁ;` trùng nguyên văn với `ja360:3.1`–`3.2`. Bản Việt của `ja360` (“Có thành nọ tên là Kurukaccha, giàu có các thị trấn của thương nhân”) khác tôi và không theo được: `payātānaṁ` là sở hữu cách số nhiều của quá khứ phân từ `payāta` (“những người đã ra đi”), không phải mô tả thành phố; tôi theo cú pháp Pāli. Tổng đã dò: 19 cặp Pāli trùng nguyên văn với các khoá đã dịch ngoài bài (12 với `ja360`, 5 với `cp30` ở `13.1`–`13.5`, 2 với `ja419` ở `13.1`–`13.2`); trong đó bản Việt của tôi trùng bản đã có ở 3 cặp (`13.1`, `13.2`, `13.5` với `cp30`) và khác ở 16 cặp (12 với `ja360`, 2 với `cp30:6.3`–`6.4`, 2 với `ja419`), mỗi chỗ khác đều đã nêu lý do ở trên.

  **Trùng nguyên văn trong chính bài:** 6 nhóm Pāli trùng (35 khoá): `1.3`=`3.3`=`5.3`=`7.3`=`9.3`=`11.5`, `1.4`=`3.4`=`5.4`=`7.4`=`9.4`=`11.6`, `2.1`=`4.1`=`6.1`=`8.1`=`10.1`=`12.1`, `2.2`=`4.2`=`6.2`=`8.2`=`10.2`=`12.2`, `2.3`=`4.3`=`6.3`=`8.3`=`10.3`=`12.3`, và `3.2`=`5.2`=`7.2`=`9.2`=`11.4`; bản Việt của mỗi nhóm cũng trùng nhau, 0 nhóm lệch.

  **Số Pāli:** bài không có số lượng nào cần tính. Số `9.` ở `0.4` và `navamaṁ` ở `14.1` đều là 9 ⇒ “thứ chín”; `nava` ở `17.4` = 9 ⇒ “chín bài” (khớp 9 bài từ `ja455` đến `ja463`).

  **Thuật ngữ và tiền lệ, đã đo:**
  - `dadhi` (5.1) → “sữa đông”: cùng cách với `ja123:1.3`, `ja123:1.4` (“sữa đông, sữa tươi”); `khīra` → “sữa” (không có tiền lệ riêng trong `ja`, 0 khoá đã dịch có `khīra` đứng một mình để so).
  - `sobbha` + `papāta` (11.3) → “hố sâu, vực thẳm”: cùng cách với `mn86:6.15` (`Sobbhe papāte narake` → “hố sâu, vực thẳm, khe núi”) và `ja474:10.2` (“hố sâu”).
  - `bhiṁsanaka` (11.1) → “khiếp đảm”: cùng cách với `dn16:3.10.2`, `dn16:3.11.3`, `dn16:3.12.6`, `dn16:6.10.1` (cùng chữ `bhiṁsanako`).
  - `Mahabbhaya` (11.1) → “vô cùng đáng sợ”: 0 tiền lệ trong tầng cho dạng này.
  - `naḷa` (9.1) → “cây sậy”: tầng có `dn32:10.9` giữ “Naḷa” làm tên vua, `ja20` giữ tên tiêu đề; không có tiền lệ cho nghĩa thực vật, nên “cây sậy” là lựa chọn mới.
  - `veḷu` (9.1) → “cây tre”: cùng nghĩa với `ja481:6.1` (“bụi tre”).
  - `sassa` (7.1) → “hoa màu”: không có tiền lệ cho nghĩa “mùa màng, cây lương thực” (các khoá chứa `sassa` trong tầng đều là `sassata` “thường còn”).
  - `kusa` (7.1) giữ nguyên “kusa” (tên loại cỏ), theo cách giữ tên cây Pāli của `ja474`.
  - Tên biển `Khuramālī`, `Aggimālī`, `Dadhimālī`, `Kusamālī`, `Naḷamālī`, `Baḷavāmukhī` giữ nguyên Pāli làm danh từ riêng; nghĩa đen (`khura` dao cạo, `aggi` lửa, `dadhi` sữa đông, `kusa` cỏ kusa, `naḷa` sậy, `baḷavāmukha` “miệng ngựa cái”) có thể ghi ở lớp chú thích, không thêm vào thân kinh.
  - `Kurukaccha`, `Suppāraka`: giữ nguyên tên riêng (`Suppāraka` cũng giữ nguyên ở `ud1.10:1.3`, nơi là tên bến cảng).

  **Dấu câu.** Pāli có 12 dấu mở nháy kép `“` và 12 dấu đóng `”`, nháy đơn `‘’`: 0. Bản Việt khớp từng khoá: 12/12 mở, 12/12 đóng, lệch 0/67 khoá. Nháy kép mở ở `12.1` và đóng ở `13.6`, nghĩa là lời đáp của Suppāraka ở `12`–`13` là một câu nói liền, nên `12.4` không có dấu đóng và `13.1` không có dấu mở, đúng như Pāli. Dấu lược `…` và `(…)`: Pāli 0, Việt 0.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `manussā khuranāsikā` (1.2): dịch “những người mũi như dao cạo”. Từ ghép sở hữu `khura` + `nāsikā` (“mũi dao cạo”); chữ “như” tôi thêm cho thông thuận tiếng Việt vì mũi không thể là dao cạo theo nghĩa đen. Không có tiền lệ (0 khoá). Cũng có thể đây là mô tả sinh vật biển giống người; tôi không thêm chú giải.
  2. `Nāvāya vippanaṭṭhāya` (2.3 và các khoá tương ứng): dịch “khi con thuyền bị mất”. `vippanaṭṭha` có thể là “mất, hư hoại, lạc hướng, đắm”; chọn từ trung tính “mất” để khỏi chọn thay Pāli giữa “lạc hướng” và “bị huỷ”. Hình thức Pāli là cách cách (dative-like) của một quá khứ phân từ đứng làm cụm độc lập; tôi đọc là cụm độc lập chỉ thời điểm (“khi…”), phù hợp với cách `ja360:3.3` dùng `nāvā` như chủ ngữ.
  3. Chủ ngữ của `khuramālīti vuccati` và các khoá tương ứng: Pāli không nêu. Tôi thêm “biển ấy” (là chủ ngữ của câu hỏi `samuddo katamo ayaṁ`), một sự làm rõ chủ thể theo ngữ cảnh, không thêm nghĩa.
  4. `saddo suyyatimānuso` (11.2): dịch “tiếng người được nghe thấy”; `mānuso` đọc là tính từ của `saddo` (“thuộc loài người”). Các tính từ `mahabbhayo bhiṁsanako` ở 11.1 là bổ ngữ của `saddo` ở 11.2 (nên “vô cùng đáng sợ, khiếp đảm” mô tả chính tiếng người); cách đọc khác coi chúng bổ nghĩa cho biển. Tôi giữ thứ tự câu của Pāli để không chọn thay.
  5. `Tassuddānaṁ` (17.1–17.4): đây là kệ tóm lược (uddāna), liệt tên các bài của phẩm. Tôi giữ tên riêng Pāli (khuôn của `ja100:4.1`, `ja426:12.1`–`12.4`, `ja438:13.1`–`13.4`) và dịch các từ nối (`puna`/`atha` → “rồi”, `ca` → “và”, `navāti` → “chín bài”). `Sirimātusuposakanāgavaro` (17.1) giữ nguyên thành một khối, không tách: tôi không xác lập được `Siri-` là một tên riêng hay một chữ ghép với `Mātuposaka`, và không có bài nào mang tên `Siri-` trong phẩm (9 bài `ja455`–`ja463` khớp `nava`). `Pāni` (17.3) là dạng rút của `Pānīya` (`ja459`); `Dasa-`/`ratha` bị ngắt qua hai dòng theo đúng Pāli (= Dasaratha, `ja461`); `Pāragata` (17.4) đọc là tên của bài thứ chín tức chính bài này; `pāragata` nghĩa đen là “đã sang bờ”. Tôi không tách hay đoán nghĩa các tên này.
  6. `Yato pattosmi viññutaṁ` (13.2): dịch “từ khi ta đạt đến sự hiểu biết” theo `cp30:6.2`; `viññutā` cũng có nghĩa “tuổi trưởng thành / có thể phân biệt”, nghĩa gần như nhau.

  **Coverage English (mục 7):** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng là 32 ký tự (< 40) nên 0/63 khoá có nội dung; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja463`; `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Không đụng `content/meta/reference-gaps.yaml`.

