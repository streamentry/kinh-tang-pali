  (3) Pāli trùng nguyên văn trong chính bài: 2 nhóm (`4.3` = `5.4`; `11.4` = `11.8` = `11.11`), bản Việt giống hệt nhau ở cả hai nhóm, 0 cặp lệch. `6.4` khác `4.3` ở Pāli (`vinā pakatihetuṁ`) nên Việt cũng khác.
