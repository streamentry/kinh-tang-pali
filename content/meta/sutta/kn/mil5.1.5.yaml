  **Số Pāli, tự tính.** `pañcayojanasatāyāmaṁ` = pañca 5 × sata 100 = 500 do-tuần chiều dài; `yojanaputhulaṁ` = 1 do-tuần chiều rộng (khoá `8.1`). `catumāse catumāse` = cứ bốn tháng một lần; `yojanaṁ pavisati` = đi vào biển một do-tuần (khoá `7.2`). `catunnampi ariyasaccānaṁ` / `cattāri ariyasaccāni` = bốn Thánh đế (khoá `7.1`). `ubhato koṭiko` = hai đầu (khoá `1.4`). Không có cụm số nào chưa phân xử được.

  **Tiền lệ (đếm trên tầng vi hiện có, loại tệp này).**
  Pāli trùng nguyên văn với nơi khác trong tầng: đã dò 60 khoá, 8 khoá có Pāli trùng nguyên văn (`0.1`, `0.2`, `0.3`, `1.1`, `2.3`, `11.4`, `11.8`, `11.11`); trong 8 khoá đó bản Việt của tôi khác bản có sẵn ở 2 khoá (`1.1`, `2.3`, xem dưới) và dùng lại ở 6 khoá: `Milindapañha` (215 hit), `Meṇḍakapañha` → `Phẩm Meṇḍakapañha` và `Iddhibalavagga` → `Phẩm Iddhibala` theo `mil5.1.7`, `mil5.1.9`, `mil5.1.10`, và `Vua nói:` ở ba khoá `Rājā āha—`. `Rājā āha—` 76 hit: `Vua nói:` 47, `Vua nói—` 15, `Đức vua nói—` 7 ⇒ chọn `Vua nói:` (và `Nàng nói:` cho `Sā āha—`, không có tiền lệ nên theo cùng dạng). `“Na hi, mahārājā”ti.` 10 hit: `Không có, này Đại vương.` 7, `Không hề` 2, `Không phải vậy` 1; tôi chọn `Không phải vậy, tâu đại vương.` vì ở bài này câu hỏi là `api nu kho … uppajjatī` chứ không phải câu hỏi hiện hữu, và để khớp với `mil5.1.7` cùng phẩm; đây là lựa chọn có chủ ý chứ không theo đa số. `“Bhante nāgasena, tumhe evaṁ bhaṇatha—` 3 hit ở `mil3.7.*` đều là `Thưa tôn giả Nāgasena, ngài nói như vậy/rằng—`; tôi đổi `tôn giả` thành `Đại đức` và giữ `như vậy—` vì trong `mil5.1.*` `thưa Đại đức` đứng đầu (10 so với `bạch ngài` 3, trên 14 khoá có `bhante`) và `mil5.1.7`, `mil5.1.10` cùng phẩm đã dùng đúng dạng này.
  Văn xưng đo ở phạm vi gần nhất: trong `mil5.1.*` `thưa Đại đức` 10 (gồm 4 dạng viết hoa) so với `bạch ngài` 3; toàn `mil` thì `thưa tôn giả` 380 đứng đầu. Chọn `Đại đức` theo phạm vi gần nhất. `mahārāja` → `tâu đại vương` (`mil5.1.*`: 33 so với `tâu Đại vương` 7 và `này Đại vương` 1). `deva` (xưng hô vua) → `tâu đại vương`: đo 77 khoá xưng `deva` trong toàn tầng thì `Đại vương` ~39, `bệ hạ` 1 ⇒ gộp với `mahārāja`; mất phân biệt `deva`/`mahārāja` trong cùng một lời nói (`11.13`) nhưng theo đúng quy ước tầng. Vua tự xưng `trẫm` (mil5: `trẫm` 32 so với `ta` 31, `tôi` 13; `sampaṭicchāmi` → `trẫm xin kính nhận` theo `mil5.4.5`, `mil5.5.10`).
