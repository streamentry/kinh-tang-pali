  (1) `sakasaṭaṁ` (khoá `1.2`): `kasaṭa` là cặn, tạp chất (tầng có `manussakasaṭe` → `ô tạp` ở `mn51`, `samaṇakasaṭānaṁ` → `cặn bã` ở `mn40`); tôi dịch `có tạp cặn`, giữ tính từ cạnh `saniggahaṁ` (`có chỗ bị bắt bẻ`) và `sadosaṁ` (`có lỗi`). Không có tiền lệ cho cả cụm ba từ; `mil5.1.7:1.4` có cụm khác (`asesavacana…`) nên không so được.
  (2) `1.2`: cấu trúc `‘…’ti, etampi vacanaṁ sakasaṭaṁ saniggahaṁ sadosaṁ ‘hetusamugghāte…’ti sutte vuttaṁ` — tôi đặt lời kinh sau dấu chấm phẩy và dùng `trong kinh có nói:` mà không thêm `vì` hay `bởi`, để khỏi áp một quan hệ nhân quả mà Pāli không nói rõ.
