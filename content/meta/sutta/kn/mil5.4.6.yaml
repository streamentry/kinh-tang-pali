notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này tại commit đã ghim.
  Pāli trùng nguyên văn: dựng chỉ mục toàn tầng thì 206/294 khoá của lát có Pāli trùng nguyên văn ở nơi khác; riêng bài này 27/42 khoá trùng và 11 chỗ đã có bản Việt.
  Song trùng quan trọng nhất — đoạn mười một lợi ích của tình thương là **văn bản song trùng nguyên văn** với `an11.15:1.1`, `:2.1`, `:2.2` (đã có sẵn trong tầng), nên đã DÙNG LẠI NGUYÊN VĂN cả ba khoá: `:1.2` lấy đúng của `an11.15:1.1`, `:1.3` lấy đúng của `an11.15:2.1`, `:1.4` lấy đúng của `an11.15:2.2` (đủ cả 11 vế; `an8.1:2.3` chỉ có 8 vế nên không dùng làm nguồn). Đây là bằng chứng đối chiếu mạnh nhất của lát, nhưng nó là **song trùng trong chính tầng dự án**, không phải tầng tham khảo đã ghim, nên `triangulation` vẫn bị chặn ở 8.0.
  Còn lại, đã dùng lại nguyên văn: `:0.2` `Meṇḍakapañha` (20 chỗ) · `:0.3` `Sabbaññutañāṇavagga` (6 chỗ, 1 chỗ dịch sai là Phẩm Bồ-tát nên không theo) · `:2.6` mở đầu câu `Ayampi ubhato koṭiko pañho …` theo `mil5.1.10:1.11` → có hai đầu, sâu xa, tinh vi, khó tháo gỡ (tôi sửa hai vế “sâu xa, tinh vi” thành “tinh vi, thấm sâu, vi diệu, sâu xa” cho khớp thứ tự bốn tính từ `sunipuṇo parisaṇho sukhumo gambhīro`).
  Bốn câu `:4.1`, `:5.1`, `:6.1`, `:7.1` và hai câu `:4.2`, `:6.2` là Pāli trùng nguyên văn ngay trong bài, đã dịch giống hệt từng vế; `:4.5`, `:5.5`, `:6.5` cũng vậy.
  Cách gọi: đo lại trên đĩa trong chính tầng `mil` (194 tệp, 606 khoá có `bhante`) thì thưa tôn giả 292 · bạch ngài 137 · bạch tôn giả 54 · thưa ngài 48 · thưa Đại đức 42; `mahārāja` (1.290 khoá): này Đại vương 568 · tâu đại vương 424. Lát này theo đa số đo được và giữ nhất quán trong cả ba bài `mil` của lát. Riêng `:3.1` có tiền lệ riêng là “Tâu đại vương, điều này Đức Thế Tôn đã dạy—”, nhưng trong bài này đã dùng “này Đại vương” ở 9 chỗ khác, nên chọn nhất quán trong bài.
  Tên phẩm: `Milindapañha` giữ nguyên (549 chỗ) · `Meṇḍakapañha` giữ nguyên (20 chỗ) · `Sabbaññutañāṇavagga` giữ nguyên (6 chỗ) · `Mettābhāvanānisaṁsapañha` → Câu Hỏi Về Lợi Ích Của Việc Tu Tập Tình Thương, theo khuôn “N. Câu Hỏi Về …” của `mil5.4.5:0.4`.
  Dấu lược: Pāli có `…pe…` ở đúng ba khoá `:2.2`, `:2.4`, `:3.2`; cả ba giữ **đúng một** `…` và không mở rộng, theo BRIEF_VI3 §10.1. Nội dung bị nén (`…`) là công thức `… brahmalokūpago hotī’ti` đã nêu đủ ở `:1.4` ngay trong cùng bài, nên giữ lược đúng như peyyāla của Pāli gốc.
  Bất định đã ghi, không che: (1) `mahājaṭājaṭita` là tánh danh Đức Phật, trong tầng không có tiền lệ nào cho danh từ này; tôi dùng bậc Chân Truyền Chân Thật và ghi ở đây, không đưa vào glossary vì không được sửa ngoài lát. (2) `gatte sedaṁ moceyya` là cơn nhức/rát nơi thân, tôi dịch thấy nhức nhối trong thân này. (3) `ghaṭa` trong `:3.6` là công cụ dùng để đánh (chày, đuốt), tôi dịch cây chày vì không có tiền lệ; nếu hiểu là tay nắm thì câu vẫn đúng nghĩa.
  Dấu nháy kép: 4 cặp `“`/`”` ở Pāli, bản Việt giữ đúng 4 cặp và cân trên cả bài (`:1.1` mở, `:2.6` đóng kèm `”ti`; `:3.1` mở, `:7.2` đóng; `:7.3` và `:7.4` mở–đóng trong một khoá).
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Đã tự xác minh được: JSON hợp lệ, đủ 42/42 khoá trong `all` và trùng khớp 42/42 khoá Pāli trong `root/pli/ms/sutta/kn/mil/mil5.4.6_root-pli-ms.json`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt vào bản Việt, không trùng nguyên văn Pāli ở khoá có nội dung, và YAML parse sạnh. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.