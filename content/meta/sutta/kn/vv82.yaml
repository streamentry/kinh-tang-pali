notes: |-
  Dịch từ Pāli root (`vv82_root-pli-ms.json`, 38/38 khoá khớp `pre` = `vv82:`).

  **Pāli trùng nguyên văn: 13 khoá, 682 cặp; dùng lại y nguyên văn 10.** Ba khoá lệch:
    - `Vimānamāruyha anekacittaṁ;` (1.2): bản đã có (pv28:1.2, vv12:1.2, mỗi bài 1 lần) đặt *ngươi* /
      *nàng* ở trước; bản này bỏ đại từ vì 1.1 đã là lời mở đầu của chính cung điện, và vv82 thuộc
      `Purisavimāna` (nam).
    - `Kenāsi evaṁ jalitānubhāvo` (3.3): hòa ngang 3–3 giữa *ngươi* và *ngài*; chọn *ngài* cho cả khối.
    - `Vaṇṇo ca te sabbadisā pabhāsatī”ti.` (3.4): kho có 16 cách, đa số (5 bài) dùng *nàng*; chọn
      vv75:2.4/vv76:2.4 (2 bài) vì khớp *ngài* cả khối.

  **0 tiền lệ cho phần cốt lõi của bài, và đó là điều đáng ghi nhất.** Khối 5.1–8.4 (hồi cố kiếp trước,
  dựng bảo tháp, công việc lành) không có bản nào khác trong toàn tầng Việt; `Sohaṁ sumedhassa`,
  `Ratanuccaya`, `hemajālena channaṁ`, `Pūjetha naṁ pūjanīyassa dhātuṁ` và `Sukhañca dibbaṁ anubhomi
  attanā` cũng không xuất hiện ở **bài nào khác trong toàn bộ Pāli đã ghim** (đã grep
  `root/pli/ms/sutta/`). Bốn chỗ phải tự phán, ghi rõ ở đây:
    - `Sunimmito` (1.4) dịch **vị không cần hầu dâng**. Đây là danh hiệu của Sakka, nghĩa đen *được
      tạo ra mà không do ai cho*, và không có bản dịch nào trong kho để dựa vào. Giữ chữ Hán–Việt
      hay dịch tự do đều là lựa chọn của người dịch; đã chọn dịch vì người đọc Việt không có cách nào
      tra `Sunimmito` trong thân bài.
    - `Evaṁ kira saggamito gamissatha` (7.4) dịch **Như vậy, chắc chắn ngài sẽ cùng ta về một nơi**.
      `saggamito` ghép `sagga` với `-mito`, có thể là *cùng về cõi trời* (khớp 8.1–8.3 nói
      `dibbaṁ … sagga`) hoặc *đồng ý*. Đã chọn cách đọc không thêm chi tiết nào.
    - `Modāmahaṁ` (8.3) là thể nguyện cầu *mong tôi được vui*, dịch **vui mừng** như một vế trong
      câu, không thêm dấu hiệu mong muốn.
    - `dhūpa`/`thūpa` dịch **bảo tháp xá-lợi**, theo đúng tiền lệ `vv60:5.3` (*Tôi dâng lên trên bảo
      tháp xá-lợi*). `Ratanuccaya` và `Sumedha` giữ nguyên Pāli có dấu.
  Vì các chỗ này không có nguồn đối chiếu, `ambiguity_integrity` hạ xuống 8,8 và `vietnamese_clarity`
  xuống 9,0.

  **Tên phẩm đặt theo đa số đo được:** `0.3` `Sunikkhittavagga` → *Phẩm Khéo Đặt Để* (2 bài, vv75/vv76)
  thay vì giữ Pāli (1 bài, vv77). `0.2` `Purisavimāna` → *Chuyện Cung Điện Nam Hư Không* (13 bài)
  thay vì `Purisavimāna` (3 bài). `0.4` dịch tiêu đề theo 35/38 bài vv đã có.

  **Dấu lược và nháy kép.** Chỉ một khoá lược: `4.2` là `…pe…` của Pāli và bản Việt giữ **đúng một** `…`
  (luật 10.1 của brief: không mở rộng). Nháy kép đúng như Pāli — mở ở 1.1, đóng ở 3.4, mở ở 5.1, đóng ở
  8.4; `ngoặc()` báo cân. `6.7` giữ cặp `‘…’` như Pāli.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`. Bài ở trạng thái `draft` nên không cần `npm run build`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.
