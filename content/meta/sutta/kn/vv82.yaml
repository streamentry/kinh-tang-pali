notes: |-
  Dịch từ Pāli root (`vv82_root-pli-ms.json`, 38/38 khoá khớp `pre` = `vv82:`).

  **Pāli trùng nguyên văn: 13 khoá, 682 cặp; dùng lại y nguyên văn 10.** Ba khoá lệch:
    - `Vimānamāruyha anekacittaṁ;` (1.2): bản đã có (pv28:1.2, vv12:1.2, mỗi bài 1 lần) đặt *ngươi* /
      *nàng* ở trước; bản này bỏ đại từ vì 1.1 đã là lời mở đầu của chính cung điện, và vv82 thuộc
      `Purisavimāna` (nam).
    - `Kenāsi evaṁ jalitānubhāvo` (3.3): hòa ngang 3–3 giữa *ngươi* và *ngài*; chọn *ngài* cho cả khối.
    - `Vaṇṇo ca te sabbadisā pabhāsatī”ti.` (3.4): kho có 16 cách, đa số (5 bài) dùng *nàng*; chọn
      vv75:2.4/vv76:2.4 (2 bài) vì khớp *ngài* cả khối.

  **0 tiền lệ cho phần cốt lõi của bài, và đó là điều đáng ghi nhất.** Khối 5.1–8.4 (hồi cố kiếp trước,
  dựng bảo tháp, công việc lành) không có bản nào khác trong toàn tầng Việt; `Sohaṁ sumedhassa`,
  `Ratanuccaya`, `hemajālena channaṁ`, `Pūjetha naṁ pūjanīyassa dhātuṁ` và `Sukhañca dibbaṁ anubhomi
  attanā` cũng không xuất hiện ở **bài nào khác trong toàn bộ Pāli đã ghim** (đã grep
  `root/pli/ms/sutta/`). Bốn chỗ phải tự phán, ghi rõ ở đây:
    - `Sunimmito` (1.4) dịch **vị không cần hầu dâng**. Đây là danh hiệu của Sakka, nghĩa đen *được
      tạo ra mà không do ai cho*, và không có bản dịch nào trong kho để dựa vào. Giữ chữ Hán–Việt
      hay dịch tự do đều là lựa chọn của người dịch; đã chọn dịch vì người đọc Việt không có cách nào
      tra `Sunimmito` trong thân bài.
    - `Evaṁ kira saggamito gamissatha` (7.4) dịch **Như vậy, chắc chắn ngài sẽ cùng ta về một nơi**.
      `saggamito` ghép `sagga` với `-mito`, có thể là *cùng về cõi trời* (khớp 8.1–8.3 nói
      `dibbaṁ … sagga`) hoặc *đồng ý*. Đã chọn cách đọc không thêm chi tiết nào.
    - `Modāmahaṁ` (8.3) là thể nguyện cầu *mong tôi được vui*, dịch **vui mừng** như một vế trong
      câu, không thêm dấu hiệu mong muốn.
    - `dhūpa`/`thūpa` dịch **bảo tháp xá-lợi**, theo đúng tiền lệ `vv60:5.3` (*Tôi dâng lên trên bảo
      tháp xá-lợi*). `Ratanuccaya` và `Sumedha` giữ nguyên Pāli có dấu.
  Vì các chỗ này không có nguồn đối chiếu, `ambiguity_integrity` hạ xuống 8,8 và `vietnamese_clarity`
  xuống 9,0.

  **Tên phẩm đặt theo đa số đo được:** `0.3` `Sunikkhittavagga` → *Phẩm Khéo Đặt Để* (2 bài, vv75/vv76)
  thay vì giữ Pāli (1 bài, vv77). `0.2` `Purisavimāna` → *Chuyện Cung Điện Nam Hư Không* (13 bài)
  thay vì `Purisavimāna` (3 bài). `0.4` dịch tiêu đề theo 35/38 bài vv đã có.

  **Dấu lược và nháy kép.** Chỉ một khoá lược: `4.2` là `…pe…` của Pāli và bản Việt giữ **đúng một** `…`
  (luật 10.1 của brief: không mở rộng). Nháy kép đúng như Pāli — mở ở 1.1, đóng ở 3.4, mở ở 5.1, đóng ở
  8.4; `ngoặc()` báo cân. `6.7` giữ cặp `‘…’` như Pāli.

  Bốn lệnh cổng kỹ thuật do coordinator chạy, không chạy trong lát agent: `npm run validate`, `npm test`, `npm run check`. Bài ở trạng thái `draft` nên không cần `npm run build`. Vì bốn lệnh ấy chưa chạy ở lát này, `technical_integrity` đặt 9,6 chứ không 10,0.

  **Lượt cải thiện 2026-10-11 (kiểm toán đối kháng; thay thế các nhận định cũ ở trên khi mâu thuẫn).**
  Đọc lại từng cặp Pāli↔Việt: bản trước có **18/38 khoá sai nghĩa thật**, 8 khoá khác chỉ gượng/lệch nhẹ; đã đổi 26 khoá. Các lỗi:
    - Bịa nghĩa / dịch sai từ: `1.1` `darasokanāsanaṁ` (*diệt trừ lo âu và sầu muộn*; bản cũ *chỗ ngồi để tung xúc xắc*, không có trong Pāli); `1.3` `accharāsaṅgaṇena` là *đoàn tiên nữ* (cũ: *đám bất tử*; theo vv21:6.3, vv31:9.2); `5.3` `Puthujjano ananubodho` là *phàm phu, chưa chứng ngộ* (cũ: *người tại gian*); `5.4` bỏ *cùng các sa-môn* (không có trong Pāli); `7.1` `na māsi dānaṁ na ca matthi dātuṁ` là *không có vật thí, chẳng có gì để cho*; `7.3` `dhātuṁ` là *xá-lợi* (cũ: *thân tượng*).
    - Sai người nói / người nghe: `5.1` `bhadante` là hô cách số ít gọi Tôn giả Moggallāna (cũ: *Bạch các Thế Tôn*); `7.2` `pare ca kho tattha samādapesiṁ` là *tôi khuyến khích những người khác ở đó* (cũ: *ngài vẫn khuyên tôi*, đảo chủ ngữ và tân ngữ); `7.4` `gamissatha` là ngôi hai số nhiều, người nghe là những người kia.
    - Hiểu sai ngữ pháp: `7.4` `saggamito` = `saggaṁ` + `ito` (*từ đây … cõi trời*), **không** phải `sagga` + `-mito`; cách đọc *cùng ta về một nơi* ở ghi chú cũ bỏ đi, bất định `-mito` ở trên không còn. `8.3` `Modāmahaṁ` = `modāmi ahaṁ` (*tôi hoan hỷ*), không phải thể nguyện cầu; ghi chú cũ sai. `8.2` `anubhomi` là hiện tại (cũ: *sẽ tự hưởng*). `2.2` `yasena puññena ca iddhiyā ca` là cách công cụ chỉ phương diện (*về danh tiếng, phước báu, thần thông*), không phải đại từ nghi vấn. `2.3`–`2.4` `samecca` = *hội tụ*, `namassanti` = *lễ bái* (cũ: *vượt hơn*, *cúi lễ nghiêng nó như lòng trăng*). `6.1`–`6.4` các sở hữu cách `sumedhassa … satthuno parinibbutassa oghatiṇṇassa tādino` đi với `Ratanuccayaṁ hemajālena channaṁ` (cũ: *thầy của bậc …*, `Ratanuccaya` để nguyên Pāli); `5.2` bỏ *bậc Đấng*.
    - Gượng nhẹ: `1.2` `anekacittaṁ` là *muôn vẻ* (theo vv11:1.4 `Anekacittaṁ` = *muôn màu muôn vẻ*); `1.4`, `2.1`, `2.5`, `2.6`, `6.4`, `8.4` chỉnh cho sát từ; `3.4` bỏ dấu chấm thừa sau `?”`.
  Điểm đổi (trước → sau): `semantic_fidelity` 9,30 → 8,60 · `grammar_logic` 9,20 → 8,80 · `terminology` 9,20 → 8,80 · `vietnamese_clarity` 9,00 → 8,60 · `han_viet_balance` 9,40 → 9,20 · `ambiguity_integrity` 8,80 → 8,60 · các tiêu chí khác giữ. `final_score` 9,1500 → 8,9200. Điểm cũ không phản ánh việc 18 khoá sai nghĩa; điểm mới đã trừ cả phần bất định còn lại dưới đây.
  Bất định còn lại (không phân xử được, không đoán thêm vào thân kinh): (a) `Sunimmito` (1.4) — tính từ *khéo được tạo nên* (cách dịch đã chọn) hay tên Sunimmita, vua chư thiên Nimmānarati; chỉ có một chỗ trong toàn Pāli ghim, không có bản đối chiếu; `bhūtapati` là danh hiệu của Sakka theo ja500:18.4 và ja521:11.1, thân bài dịch *chúa tể các loài*. (b) `Ratanuccayaṁ` (6.3) — danh từ chung *khối/đống châu báu* chỉ bảo tháp (cách dịch đã chọn) hay tên riêng; hapax trong Pāli ghim. (c) `taṁ taṁ` (2.4) — lặp đại từ, dịch một lần *ngài*; (d) `paribbajissaṁ` (5.4) — *sống đời xuất gia du hành*, chưa phân xử giữa *xuất gia* và *du sĩ*; (e) `kira` (7.4) — *quả thật* hay *nghe nói*; (f) `darasokanāsanaṁ` (1.1) là hapax, `dara` dịch *lo âu*. Công thức `yassa kammassidaṁ phalaṁ` (4.3) giữ *quả báo của nghiệp này là thế* theo đa số tầng (≈50 tệp) dù hơi lệch cấu trúc quan hệ (vv15:4.4 sát hơn); không đổi riêng một tệp.
  Không đổi tiêu đề (`0.2` `Purisavimāna` → *Nam Hư Không*: Pāli không có `ākāsa`, lặp nhiều tệp vv; sửa theo bộ chứ không riêng tệp này); `translationTitle` giữ nguyên. Cổng kỹ thuật `npm run validate` · `npm test` · `npm run check` · `npm run build` chưa chạy ở lượt này; `technical_integrity` giữ 9,6.
