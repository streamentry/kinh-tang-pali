notes: |-
  Dịch trực tiếp từ Pāli root đối chiếu với toàn bộ các bài liên hệ trong Therāpadāna (446 tệp).
  - Tiêu đề :0.3: Pāli không bắt đầu bằng số thứ tự nên bỏ số thứ tự theo quy ước chung của phẩm, translationTitle đồng nhất 100% với :0.3 ("Bài Kệ Tuyên Ngôn Về Trưởng Lão Anuruddha").
  - Sửa lỗi chính tả "Tuyên Ngợ" -> "Tuyên Ngôn" theo hướng dẫn BRIEF_THAP.md (toàn tầng: 244 Tuyên Ngợ / 96 Tuyên Ngôn).
  - Không có tầng tiếng Anh đối chiếu: Upstream commit đã ghim không có bản dịch tiếng Anh cho tha-ap (0/4291 tệp trong thư mục tha-ap của english-sujato, vietnamese-current chỉ có 26 tệp Pháp Cú, english-project chưa có), nên bài mang trạng thái draft với blocker noEnglishEditionUpstream; điểm triangulation đặt 7.5.
  - Phép kiểm 5/5: 57/57 khoá khớp hoàn toàn Pāli; dấu nháy đơn và kép khớp đúng Pāli từng khoá (chỉ mở nháy kép ở 1.1 và đóng ở 13.4, 0 nháy đơn); tính nhất quán nội bộ đạt 100% (cụm "dīpadānassidaṁ phalaṁ." lặp 4 lần ở 7.4, 8.4, 9.4, 11.4 đều dịch đồng nhất là "đó là quả báo của việc dâng ngọn đèn."); không có dấu lược (0/0); tất cả các số đếm đều được tính toán và kiểm tra chính xác.
  - Số đếm Pāli: Sahassavaṭṭiṁ (5.1) = 1.000 bấc đèn; Sattāhaṁ (5.3) = 7 ngày; yojanasataṁ (8.1) = 100 do-tuần; Tiṁsakappāni (9.1) = 30 kiếp; Aṭṭhavīsatikkhattuñca (10.1) = 28 lần; yojanaṁ (10.4) = 1 do-tuần; Sahassalokaṁ (11.1) = 1.000 thế giới; catasso (13.1) = 4; aṭṭhime (13.2) = 8; chaḷabhiññā (13.3) = 6; catutthaṁ (15.1) = thứ tư.
  - BẤT ĐỊNH: tiṁsakappasahassito ở 12.2 dịch là "cách đây ba nghìn kiếp;" theo chỉ dẫn của BRIEF_THAP.md (tiṁsa = 3, kappasahassa = ngàn kiếp). Ghi nhận bất định theo BRIEF_SLICE.md §4 vì có cách phân tích xem tiṁsa là 30 (ba mươi ngàn kiếp).
  - Kỹ thuật: Chưa chạy các cổng kỹ thuật trong lát này do quy định cấm chạy lệnh git/npm, technical_integrity đặt 9.6. Bốn lệnh cần chạy khi kiểm định: npm run validate · npm test · npm run check · npm run build.
