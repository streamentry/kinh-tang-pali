notes:
  - |-
    **Phạm vi: đủ mọi khoá Pāli của lát — 17 khoá/bài, 238 khoá cả lát.** Tự quét MỌI khoá từ đĩa, không tin ngưỡng 40 ký tự của `kiểm()`: ở **13 bài thag của lát này `substantiveSegments` = 0** (vế kệ dài nhất 29 ký tự, `thag3.1:1.2`), nên assertion của harness **không tự chạy**; riêng `mil4.2` thì = 4 (khoá dài nhất `2.3`, 393 ký tự). Đo bằng script: đủ khoá và đúng exact ID (17/17 từng bài), 0 orphan, 0 rỗng, mọi giá trị NFC, ngoặc kép `“` cân với Pāli (14/14 bài), dấu lược khớp Pāli từng khoá, không còn `(…)`, không có script ngoài Latin. Chạy lại script dịch hai lần: idempotent, hash tệp không đổi.

    **Đợt này cấm chạy cổng kỹ thuật nên không thể tuyên bố technical gate pass.** Tôi bị cấm `npm run validate`, `npm test`, `npm run check`, `npm run build`; người điều phối chạy tập trung bốn lệnh đó. Vì vậy `technical_integrity` chấm **9.6, KHÔNG phải 10.0** — cùng cách `thag1.39` và `thag3.2` đã làm.

    **Tầng tham khảo — đo, không phải suy.** Bản Anh Sujato có ở commit đã ghim cho bài này (tệp `.cache/upstream/suttacentral/translation/en/sujato/sutta/kn/thag/<uid>_translation-en-sujato.json` tồn tại), nhưng **Sujato để trống toàn bộ 7 khoá `2.0`–`2.6`** (dòng tục lược uddāna) và dòng quy kết `1.5`. `englishCoverage` vì thế **không đo được** (`no substantive segment`), thuộc hạn chế của phép đo chứ không phải bằng chứng tầng Anh đầy đủ. Tầng `vietnamese-current` vắng: `translation/vi/phantuananh` tại commit đã ghin chỉ có 26 chương Pháp Cú, không có Thích Minh Châu cho Theragāthā — đặc điểm của snapshot upstream, không phải thiếu sót của kho. Không sửa `content/meta/reference-gaps.yaml`.

    **Dấu lược.** Dòng quy kết Pāli đã lược (`… X thero …`), bản Việt **giữ lược** theo BRIEF_VI3 §10.1, không mở rộng thành công thức `Itthaṁ sudaṁ …` — và cấu trúc mở đầu chuỗi Theragāḵā ấy **không có vocative**, nên cũng không thêm lời hô “Bạch Thế Tôn”. `Tassuddānaṁ` → *Tóm lược:* (254 tiền lệ so 21 *Tóm lược* và 19 *Tóm tắt phẩm*). Không nén bất kỳ khoá nào bằng `…`.

    **Tên phẩm — dùng đúng bảng đã chốt trong BRIEF_VI3 §11, đếm trên toàn tầng.** `Ekakanipāta` → *Bộ Một Bài Kinh* (300/300 cặp Pāli trùng trong tầng); `Dukanipāta` → *Bộ Hai Bài Kinh* (168); `Tikanipāta` → *Bộ Ba Bài Kinh* (38 ở thag3/thig3/ja25x, khớp song parallel với *Bộ Một/Hai Bài Kinh*; 50 lần *Phẩm Ba Pháp* đều thuộc `iti`, không lấy theo). `Dutiyavagga`…`Navamavagga` → *Phẩm Thứ Hai/Ba/Tư/Năm/Sáu/Bảy/Tám/Chín* (47/35/25/27/9/9/9/9 tiền lệ). Tiêu đề `<tên>ttheragāthā` → *Kinh Kệ Của Trưởng Lão <tên>* (154 bản so 4 *Bài Kệ*). Dòng `1.6` `vaggo <thứ số>` → *Phẩm thứ <số>, mười bài.* — số ở `1.6` đã đối chiếu với `0.3` của chính bài, không suy từ tên uid.

    **Pāli trùng nguyên văn — tự dựng chỉ mục Pāli↔Việt rồi đếm, không đoán.** Nạp 284.708 khoá Pāli trong `.cache/upstream/suttacentral/root/pli/ms/sutta/` (bỏ `*.apfs-orphan/`) và 115.696 khoá Việt trong `content/translation/vi/project/sutta/` (đã bỏ 14 tệp của lát), so theo segment ID. Kết quả: **30 cặp Pāli trùng nguyên văn ngay trong lát** (29/30 dùng lại nguyên văn; cặp lệch duy nhất là `thag2.36:1.4` / `:2.4`, chỉ khác dấu chấm câu) và **6.283 cặp** Pāli trùng với khoá ở uid khác đã có bản Việt, trong đó **5.454 cặp trùng nguyên văn** và 829 cặp lệch có chủ đích (chủ yếu `Tassuddānaṁ` — tầng đang có 11 cách — và các khoá chung như `Katame aṭṭha?`, nên ở đó tôi theo **đa số trong tầng** chứ không theo từng bài.

    **Điểm.** `final_score` là trung bình số học thô của đúng 10 tiêu chí, **tính bằng script**, không gõ tay. `triangulation` thấp vì Sujato im lặng ở cả dòng uddāna và không có tầng Việt hiện hành; `ambiguity_integrity` thấp hơn vì uddāna là danh sách tên có phụ danh mà không có chú giải trong tầng — các chỗ đó đã phân xử và ghi ở đây, không chú thích lẫn vào thân kinh.
  - |-
    **Đối chiếu chuỗi uddāna.** `2.1`–`2.6` = Vacchapāla (`1.71`), Ātuma (`1.72`), Māṇava (`1.73`), Suyāmana (`1.74`), Susārada (`1.75`), Piyañjaha (`1.76`), con trai Āroha = Hatthārohaputta (`1.77`), Meṇḍasira (`1.78`), Rakkhita (`1.79`), Ugga (`1.80`). Đủ mười; `Ārohaputto` ở `2.5` là tên thứ hai của người thứ bảy, tôi dịch *con trai Āroha* và ghi lại vì `0.4` bài `thag1.77` dùng dạng *Hatthārohaputta*.

    **Dùng lại nguyên văn:** `natthi dāni punabbhavo”ti.` → *nay không còn tái sinh nữa”ti.*, giống hệt `thag1.87:1.4` (Pāli trùng, đếm bằng chỉ mục; 9 chỗ khác trong tầng, đa số cùng dạng này).

    **Phân xử đã ghi.** `Yaṁ mayā pakataṁ kammaṁ / appaṁ vā yadi vā bahuṁ`: `vā … vā` là *hoặc … hoặc*, tôi dịch *dù ít hay nhiều* theo tiền lệ `an3.34:13.4` (*ít hay nhiều*). `parikkhīṇaṁ` = *đã cạn ráo*, đồng nghĩa với `Vikkhīṇo` ở `thag1.90:1.3`. `uggasavhayoti` ở `2.6`: `savhāya` (*vì kính*) là chữ Hán–Việt quen thuộc, **0** tiền lệ cho cụm này trong tầng nên tôi ghi ra; cách đọc là *Rakkhito vì kính Trưởng lão Ugga*.
