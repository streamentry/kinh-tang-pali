notes: |-
  **Nguồn.** Pāli lấy từ tầng `pali` đã ghim trong kho (cache SuttaCentral tại commit
  11c9d708…). Bài này có 48 khoá Pāli. Tệp làm việc `vc/n54.json` khai `keys` = 47 và
  `all` = 48; 47 là số khoá CHƯA có trên đĩa, còn khoá thứ 48 (`:10.1`) lát trước đã
  ghi. Tôi ghi đủ 48 theo `all`, vì `validate` bật requireComplete cho `review` và
  `published`, và vì chỉ thứ tự Pāli mới là thứ tự đúng.

  **Trạng thái đĩa trước khi làm.** Cả hai tệp dịch chỉ có ĐÚNG MỘT khoá (`:10.1`) và
  metadata cũ ghi `segment_alignment: 5.0`, tức là lát trước chết giữa chừng. Tôi coi
  như không có gì, dựng lại từng khoá từ Pāli, nạp tệp cũ rồi ghi đè (không mất khoá
  nào). Riêng khoá `:10.1` tôi đã SỬA, xem mục kế.

  **ĐÍNH CHÍNH khoá `:10.1` của lát trước.** Bản cũ ghi *đã từng nói bài kệ này* — số ít.
  Công thức Pāli `imā gāthāyo` là SỐ NHIỀU. Đo trên toàn tầng Việt dự án, riêng phẩm
  `tha-ap`: *đã nói những bài kệ này* 431 khoá / 423 tệp; *đã từng nói bài kệ này* chỉ
  5 khoá / 5 tệp, và trong 5 tệp ấy có chính hai tệp của lát này. Tôi theo nhóm 431,
  nên `:10.1` của cả hai bài đã đổi thành *đã nói những bài kệ này*.

  **Năm phép kiếm tự viết, quét MỌI khoá** (`_hvi.py` ở đây chạy rỗng vì nó lọc
  `len(pāli) >= 40` mà 47/48 khoá ở tha-ap ngắn hơn ngưỡng):

  1. `set(khoá Việt)` = 48, `set(khoá Pāli)` = 48, thiếu 0, thừa 0; thứ tự khớp Pāli:
     CÓ (48 = 48). Chuỗi không NFC: 0.
  2. Nháy đơn `‘’` + ngoặc kép `“”` khớp Pāli TỪNG KHOÁ: lệch 0/48. Dòng chảy nháy
     (Pāli cố ý mở ở `:1.1`, đóng ở `:9.3`): Pāli 0, Việt 0 — tức mỗi khoá không tự
     cân mà cả bài cân, đúng nhịp Pāli.
  3. Pāli trùng nguyên văn: xem riêng từng bài dưới đây.
  4. Dấu lược: mỗi bài có 1 khoá Pāli chứa `…` (đều là `:9.2` = `…pe…`), bản Việt giữ
     ĐÚNG MỘT `…`; không khoá nào Pāli không có `…` mà Việt có; không có
     `… cho đến …`; bản Việt không khoá nào có `(…)` nên không có chỗ nào phải giữ dấu
     lược đó. Lệch 0/48.
  5. Số Pāli: xem bảng phép tính dưới đây, in bằng script.

  **`translationTitle` = ĐÚNG GIÁ TRỊ `:0.3`**, kể cả phần số thứ tự. Cả hai bài `:0.3`
  của tầng Pāli KHÔNG bắt đầu bằng số (`Jātipūjakattheraapadāna`,
  `Padumapūjakattheraapadāna`), nên theo chính sách đa số (KEEP khi Pāli có số) tôi
  KHÔNG thêm số. Lát trước đã đặt `translationTitle` là *Kinh Kệ Của Trưởng Lão …*,
  lệch cả với `:0.3` của bài, nên tôi sửa.

  **Hình thức tiêu đề — đo ở hai phạm vi.** `tha-ap` chỉ quan sát các khoá tiêu đề
  (`:0.3`, `:11.1`, `:12.1`) trong tệp có ≥10 khoá: *Bài Kệ Tuyên Ngợ Về Trưởng Lão*
  204 khoá/204 tệp · *Ký Sự Về Trưởng Lão* 96/96 · *Bài Kệ Tuyên Ngôn Về Trưởng Lão*
  73/73 · *Kinh Kệ Của Trưởng Lão* 6/6. Tính cả tệp vỏ (≤9 khoá) thì 425 / 186 cho
  hai dạng *Tuyên Ngợ* / *Tuyên Ngôn*, nhưng 237 tệp trong số đó là tệp vỏ 1–4 khoá
  mà lát trước bỏ dở. Tôi theo đa số ở phạm vi gần nhất: *Bài Kệ Tuyên Ngợ Về Trưởng
  Lão …*. Ghi cả hai phạm vi để biên tập gộp nếu còn phân kỳ.

  **`Tassuddānaṁ` (`:13.1`).** Toàn tầng: *Tóm lược:* 360 khoá, *Tóm tắt phẩm…* 26. Nhưng
  riêng `tha-ap`: *Tóm tắt phẩm này:* 23 khoá, *Tóm lược:* 7, *Tóm lược phẩm ấy:* 2 —
  và năm bài kế bên đã dịch khoá này (112, 142, 162, 172, 182) đều dùng *Tóm tắt phẩm
  này:*. Theo luật đa số trong chính tác phẩm, tôi dùng *Tóm tắt phẩm này:*.

  **`<Vagga>vaggo <số thứ>mā` (`:12.1`).** Tiền lệ gần nhất `tha-ap162:10.1`:
  *Phẩm Bandhujīvaka, thứ mười sáu.* — tôi giữ đúng hình thức đó, giữ tên phẩm bằng
  Pāli như `:0.2` đã dịch (`Phẩm Mahāparivāra`, `Phẩm Sereyya`).

  **`Itthaṁ sudaṁ …` — bất định đã phân xử.** Đọc theo truyền thống thì `Itthaṁ sudaṁ`
  là *Như thế này tôi đã nghe*; đọc theo tiền lệ thì `Itthaṁ` là từ xưng hô. Tôi theo
  tiền lệ: 436 tệp trong tầng mở đầu *Tôi nghe như vầy: Tôn giả Trưởng lão*, và chỉ
  1 tệp dùng *Bạch Thế Tôn, Tôn giả Trưởng lão*. Hai cách đọc không đổi nghĩa giáo
  nghĩa nên không phải blocker.

  **Bất định còn lại, ghi rõ thay vì bịa nghĩa.**
  - `Mā kho tumhe pamajjittha` (`tha-ap132:5.3`): `kho` là tiểu từ quở trách, không có
    cách dịch cố định nào đã thành quy ước trong tầng này. Tôi bỏ `kho` và dịch
    *Các ngươi, đừng phóng dật*, đúng như tiền lệ `Mā kho maṁ tvaṁ` → *chớ quy y ta*
    (`mn84:10.6`, `mn94:32.1`) và `Mā kho tumhe, māṇavakā` → *Này các thanh niên, đừng
    …* (`dn3:1.23.22`). `kho` trong tầng Việt chỉ được dùng để dịch nghĩa *tổ chức*
    (yajati/samāneti), không phải tiểu từ này — đó là lý do tôi không dùng *tổ chứ*.
  - `Dhātiyo maṁ upaṭṭhanti` (`tha-ap122:6.1`): `dhāti` có thể là *yếu tố* hay *tánh*;
    cùng câu còn xuất hiện ở `thi-ap14:17.1` và `pv26:18.3` nhưng hai bài kia chưa có
    bản Việt, nên không có tiền lệ để chốt. Tôi dịch *Các yếu tố ở bên ta*, giữ nghĩa
    trung tính, và không thêm chú thích vào thân kinh.
  - `saṅkharitvāna kusalaṁ, sakaṁ cittaṁ pasādayiṁ` (`tha-ap122:4.1–4.2`): `pasādayiṁ`
    có thể là *ta đã làm thỏa lòng tâm mình* hoặc *ta đã khởi tâm tịnh tín*. Pāli
    `sakaṁ cittaṁ pasādayiṁ` trùng NGUYÊN VĂN với `tha-ap190:2.2`, và bản Việt ở đó là
    *tôi khởi tâm tịnh tín*. Theo luật dùng lại bản Việt đã có cho Pāli trùng byte, tôi
    giữ nguyên văn ấy, dù cách đọc khác có vẻ sát nghĩa hơn.

  **`navuti` = 90, KHÔNG phải 99 — và đã kiểm chéo hai lần.**
  1. Tiền lệ đo được: `Ekanavutito kappe` đã dịch *chín mươi mốt kiếp* ở 107 khoá;
     `Catunnavutito kappe` → *chín mươi tư* ở 98 khoá; `Gāthāyo pañcanavuti` →
     *bài kệ có chín mươi lăm câu* (`tha-ap482:12.3`). Cả ba đều đọc `navuti` là MỘT
     đơn vị 90. `Eka + navuti` = 91, không phải 99.
  2. Đếm độc lập: `navuti` là số câu kệ của phẩm Mahāparivāra. Tôi đếm trên Pāli gốc
     (thi-ap113–122, mỗi `…pe…` tính 2 vế, chia 4) ra đúng **90** câu, khớp `navuti`.
     Lấy cùng cách đó, phẩm Sobhita (133–142) ra **72** câu, khớp `sattati dve` mà
     `tha-ap142:13.3` đã dịch *bảy mươi hai bài kệ*.

  **Coverage tầng Anh — đo được, nhưng mẫu số cực nhỏ.** Định nghĩa của dự án: Pāli có
  nội dung = ≥40 ký tự, bỏ khối `:0`. Mẫu số của mỗi bài là **1 khoá** (đúng `:10.1`),
  không phải 0; 45 khoá còn lại là vế kệ 18–26 ký tự nên cổng không đo được chúng.
  Tầng `english-sujato` phủ **0/1** ở cả hai bài. Tôi đọc thẳng
  `source/upstream-manifest.json` (commit 11c9d708…): tầng đó có 4291 tệp, trong đó
  `tha-ap` chỉ 1 tệp và là tệp *tên*; tầng `vietnamese-current` 26 tệp toàn bộ
  `sutta/kn/dhp`; `content/translation/en/project/sutta/kn/` không có tệp `tha-ap`
  nào. ⇒ `triangulation` để **7,4**, không phải 8,5: tầng Việt dự án dùng để dùng lại
  bản dịch KHÔNG phải một lớp đọc độc lập, nên tôi không tuyên bố đã đối chiếu English.

  **Cổng kỹ thuật CHƯA chạy.** Lát này bị cấm `npm run validate|test|check|build` (và
  cấm mọi lệnh `git`), nên `technical_integrity` chỉ ghi phần tôi tự kiểm được: JSON
  hợp lệ, 48 khoá trùng đúng UID và đúng thứ tự Pāli, 0 orphan, NFC sạch, nháy cân,
  dấu lược khớp, YAML parse sạch. Bốn lệnh còn lại thuộc cổng của người điều phối:
  `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  **Vì sao `draft`, không phải `published`:** tầng tham khảo đã ghim không phủ `tha-ap`
  (xem `blocking_errors`). Điểm cao không cứu được blocker.

  **Riêng bài này (tha-ap132).** 20/48 khoá có Pāli trùng NGUYÊN VĂN với một khoá đã
  dịch ở tầng Việt dự án (3299 cặp Pāli trùng đã dò); 17 khoá tôi dùng lại NGUYÊN VĂN
  bản Việt đã có: `0.1`, `0.2`, `0.3`, `1.1`, `4.4`, `7.1`, `7.2`, `7.3`, `7.4`, `8.3`,
  `8.4`, `9.1`, `9.2`, `9.3`, `10.1`, `13.1`, `14.6`. Đáng chú ý: `:0.3` trùng byte
  `Padumapūjakattheraapadāna` với `tha-ap349:0.3`, và `:10.1` trùng byte
  `Itthaṁ sudaṁ āyasmā padumapūjako thero …` với `tha-ap349:5.1` — hai bài cùng nhắc
  cùng một vị trưởng lão, nên tôi lấy đúng bản Việt ở đó, không dịch lại từ đầu.
  Trong chính bài KHÔNG có cặp Pāli trùng nào (0 cặp), nên không có chỗ nào bản Việt
  tự mâu thuẫn. Tiền lệ đếm được: `buddhapūjāyidaṁ phalaṁ.` 92 khoá →
  *đó là quả báo của việc cúng dường Đức Phật.*; `yaṁ pupphamabhiropayiṁ;` 44 khoá →
  *khi tôi đã dâng cúng hoa ấy*; `buddhassa abhiropayiṁ.` 24 khoá →
  *tôi dâng lên Đức Phật*; `Sattaratanasampanno,` 83 khoá →
  *Đầy đủ bảy món báu quý giá,*; `cakkavattī mahabbalo.` 106 khoá →
  *là Chuyển Luân Vương có đại uy lực.*; `gaṇitā atthadassibhi.` 3 khoá →
  *đã được các bậc thông tuệ tính đếm.*; `Sereyyavagga` 7 khoá → *Phẩm Sereyya*;
  `Himavantassāvidūre,` 19 khoá, đa số *Không xa dãy Himavanta,*.

