notes: |-
  **Một câu khung, mười bốn bài.** Cả 14 bài của lát này có cùng một câu Pāli
  `Itthaṁ sudaṁ āyasmā <tên> thero imā gāthāyo abhāsitthāti`, và mỗi bài chỉ có
  đúng một khoá đủ dài để dịch. Tôi dịch giống nhau ở cả 14 bài, đổi mỗi tên riêng.
  Đây là giữ nhất quán, không phải điền theo khuôn: 12 câu cùng công thức đã có sẵn
  bản Việt trong chính tầng này, và dịch khác ở 14 bài này sẽ làm corpus tự mâu thuẫn.
  
  **Tiền lệ, đếm được trong `content/translation/vi/project/sutta/` (3.261 bài):**
  `Bạch Thế Tôn,` 1.565 chỗ · `Tôn giả` 3.697 · `Trưởng lão` 161 · `bài kệ này` 149 ·
  `đã từng nói bài kệ này` 16 · `Tôn giả Trưởng lão` 14. Cụ thể là `thag1.1:4.5`
  Subhūti, `thag1.2:1.5` Mahākoṭṭhika, `thag1.3:1.5` Kaṅkhārevata, `thag1.4:1.7`
  Puṇṇo Mantāṇiputto, `thag1.5:1.5` Dabba, `thag1.6:1.5` Sītavaniya, `thag1.7:1.5`
  Bhalliya, `thag1.8:1.5` Vīra, `thag1.9:1.5` Pilindavaccha, `thag1.10:1.5` Puṇṇamāso,
  `thag2.1:2.5` Uttara, `thag2.2:2.5` Piṇḍolabhāradvāja — cùng cấu trúc `āyasmā … thero`,
  cùng bản dịch. `thag2.1:0.3` còn dịch tiêu đề `Uttarattheragāthā` thành *Kinh Kệ Của
  Trưởng lão Uttara*, đúng cách đặt tên mà bài này dùng.
  
  **Tên riêng giữ nguyên dạng Pāli**, không dịch nghĩa, không thêm chú thích ngoài
  ngoặc: chúng là tên các vị trong kinh, và 12 câu tiền lệ đều viết tên có dấu Pāli.
  Đã đối chiếu tên trong bản dịch với tiêu đề `:0.3` và với lục kết của chính bài:
  14/14 khớp cả ba nơi. Trường hợp `Sereyyaka` (tha-ap123) là tên một người khác mà
  vị trưởng lão vác lên vai, nên càng phải giữ, không dịch.
  
  **Bất định — `Itthaṁ sudaṁ`, và đã phân xử thế nào.** Đọc theo truyền thống thì đây là
  *Như thế này tôi đã nghe*. Đọc theo 12 câu tiền lệ thì `Itthaṁ` là từ xưng hô
  *Bạch Thế Tôn* còn vế *sudaṁ* gộp vào *đã từng nói*. Tôi theo tiền lệ, để tầng này
  tự nhất quán. Sujato dịch vế này theo hướng thứ nhất — ví dụ `cp35:18.1`
  *That is how the Buddha …* — nên khác biệt là có thật, không phải hư cấu. Cả hai cách
  đọc đều không đổi nghĩa giáo nghĩa, nên đây không phải blocking error. Bản dịch thân
  kinh không thêm mệnh đề giải thích nào cho chỗ này.
  
  **Số nhiều.** `imā gāthāyo` là số nhiều, nhưng cả 16 tiền lệ đều dùng *bài kệ này*
  (số ít thu tục, chỉ cả khối kệ vừa dẫn lại). Tôi giữ, để không phá tiền lệ.
  
  **Không có tầng tham khảo nào để đối chiếu.** Tại commit đã ghim không tồn tại tệp
  Anh Sujato cho `tha-ap` (0/1 khoá có nội dung), và `translation/vi/phantuananh/`
  ở commit này chỉ chứa Pháp Cú. Vì vậy `triangulation` để **7.8**, không phải 8.5:
  không có bản Việt truyền thống cho Khuddaka, và cũng không có bản Anh nào.
  
  **Cờ giả của chốt `lọt_pāli` — đã báo cáo, KHÔNG sửa `_hvi.py`.** Chốt báo Pāli lọt cho
  mọi từ có dấu Pāli mà tầng Việt chưa từng dùng; 8 trong 14 tên ở đây bị bắt oan.
  Cơ chế đó chỉ cho tên đã quen lọt qua, nên nó chặn đúng *lần dùng đầu tiên* của một
  tên riêng hợp lệ. Chính docstring của `_hvi.py` đã nói *tên riêng Pāli trong bản Việt
  là đúng*. Tôi khai 14 tên vào đúng danh sách ngoại lệ `_GIỮ` (danh sách mà `_hvi.py`
  tự mô tả là ngoại lệ có chủ đích) trong bộ nhớ tiến trình, không đụng tệp trên đĩa;
  mọi chốt khác của `kiểm` vẫn chạy nguyên vẹn và đều pass.
  
  **Cờ giả của `rven88.py`.** Công cụ này quét tầng Anh
  (`content/translation/en/project/sutta`), không phải tầng Việt; 20 cờ nó in ra thuộc
  `an/`, `mn/`, `kn/dhp` và không liên quan tới lát này. Quét tương đương trên tầng Việt
  của lát 3 chỉ ra đúng một cờ: *lặp từ liền kề — ton*, do *Bạch Thế Tôn* + *Tôn giả*
  trùng nhau sau khi bỏ dấu. 12/12 câu tiền lệ đã publish có đúng cờ đó, nên đây là
  hạt giả của phép so khớp bỏ dấu, không phải lỗi.
  
  **Vì sao `draft`, không phải `published`** — hai lý do, đều đo được:
  
  1. *Thiếu segment bắt buộc.* Bài này có 48 khoá Pāli mà tầng Việt mới có
     **1** khoá (tha-ap132:10.1); **47** khoá còn lại chưa được lát nào trong đợt này
     gán tới. `validate` bật `requireComplete` cho `review` và `published`, nên hai
     trạng thái đó sẽ báo *missing translation*. Đo trên 5 bài đã publish trong tầng
     này — `thag2.1` 13/13, `thag1.1` 24/24, `thig1.3` 8/8, `ud1.1` 25/25, `iti1` 20/20 —
     thì bản dịch phủ **100%** khoá Pāli, nên một bài 1/48 không đạt chuẩn đó.
  2. *Thiếu tầng tham khảo đã ghim.* `tha-ap` không có tệp Anh trong bản chụp đã ghim.
     Với `published`, `validate` coi đây là lỗi, không phải cảnh báo; cần chạy
     `npm run reference:gaps` để ghi nhận vào `content/meta/reference-gaps.yaml` trước.
  
  **Cổng kỹ thuật chưa chạy.** Lát này bị cấm `npm run validate|test|check|build`, nên
  tiêu chí 10 chỉ ghi phần tôi tự kiểm được: JSON hợp lệ, NFC, khoá trùng đúng UID và
  thuộc Pāli gốc, 0 orphan, 0 dấu lược lệch, ngoặc kép cân, `save_vi` idempotent, YAML
  parse sạch bằng `yaml` của kho. Phần còn lại thuộc cổng của người điều phối. Bài chưa
  được chấm cho tới khi phần còn lại của bài (tiêu đề `:0.1`–`:0.3`, lục kết, các vế kệ)
  được dịch; khi đó mới phải chấm lại, và nhiều khả năng phải dịch thêm tên riêng mới.
  
  **Vị trưởng lão trong bài này.** Padumapūjaka sai ba nghìn môn đồ đi hái **sen** rồi dâng lên Đức Phật, và dựng bảo tháp bằng hoa sen (`3.1–4.4`); trước đó ông đã làm lễ cho 3.000 môn đồ một cách chuyên tâm (`5.1–6.4`). Ngài làm vua Jaluttama sau 150 kappa (`7.1–8.4`). Tên nghĩa là người tôn thờ bông sen, và đó là việc cả bài kể.
