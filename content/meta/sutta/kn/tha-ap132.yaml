  Bản Việt không có chữ số Ả-rập nào (0/48).

  **Bất định riêng của bài này, ghi rõ.**
  - `Pañcuttarasatā gāthā` (`14.5`) = 125: `uttarasatā` là 120 (`satā` 100 + `uttara`
    20), cộng `pañca` 5. Tôi dùng đúng hình thức tiền lệ `Gāthāyo pañcanavuti` →
    *bài kệ có chín mươi lăm câu*. Nhưng đếm trên Pāli gốc (tha-ap123–132, mỗi
    `…pe…` tính 2 vế, chia 4) chỉ ra **105** câu, lệch 20 so với con số uddāna. Số
    uddāna là dữ kiện của bản in, tôi dịch theo uddāna và KHÔNG sửa nó theo phép đếm
    của mình; nếu biên tập muốn thì đây là chỗ cần tra bản in.
  - `Vemajjha` (`2.1`) là tên riêng nên giữ nguyên dạng Pāli, không dịch và không thêm
    chú thích ngoài ngoặc — đúng như 12 tên riêng đã có sẵn trong tầng.
  - `Āsani` (`14.3`) giữ đúng dạng Pāli trong uddāna, không bổ sung dấu.
