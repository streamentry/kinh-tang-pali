  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (dịch 2011, đọc từ dòng tác giả và chân trang của tệp). Bản nguyên bài là văn xuôi, theo đúng thứ tự các khổ kệ nên so được từng khổ ở mức đoạn, cả 48 khoá (kể cả hai khối câu hỏi 7 và 10 theo đúng thứ tự). 5 khoá bất đồng nghĩa → sửa 0, giữ 5, bất định 0. Giữ: 1.3 và 1.4 `ussannapuññāpi … parittapuññāpi bhavanti heke`: bản nguyên bài thêm vào hai chữ trong ngoặc để thành thế đối nghịch (dồi dào phước mà hạ liệt, ít phước mà cao quý); Pāli chỉ có hai vế `-pi … -pi` (có người dồi dào phước, có người ít phước) và không có chữ nào thêm, nên giữ đúng chữ; 2.3 `yakkhabhūtā`: bản nguyên bài tách thành hai hạng (dạ-xoa và quỷ sứ), còn Pāli là một từ ghép đứng cạnh `sarīsapā`, theo cấu trúc `na … na … vā` chỉ có hai nhóm, nên giữ “chúng sinh dạ-xoa” theo pv36:35.3; 6.4 `aggakuliko bhavissati bhogato ca`: bản nguyên bài dịch `bhogato` thành nguyên nhân (nhờ vào tài sản) và bỏ `ca`; Pāli có `ca` nối hai khía cạnh nên giữ “về gia tộc và về tài sản”; 9.4 `sattarattaṁ`: bản nguyên bài là bảy ngày, Pāli là bảy đêm, giữ “bảy đêm”. Năm chỗ bất định đã ghi ở trên (2.2 `aṅguṭṭhasneha` là chất nhuận, 3.3 `gabbhāsaya` là phần nhau thai, 3.2 `parivattayanti` là đi vòng quanh, 1.2 `yathā puggalaṁ`, 7.1 `kissa vataṁ`) đều có bản nguyên bài đọc cùng hướng với bản này, nên nay có thêm một chứng cứ độc lập ngoài ngữ cảnh; không đổi chữ nào, và cũng không coi đó là bằng chứng từ vựng, vì hai bản cùng dựa vào cách hiểu truyền thống. Các khác biệt khác chỉ ở cách gọi (bậc Thiện Thệ, tuệ bao la với trí rộng lớn, nhau thai với chất nhơ của bào thai…) không đổi nghĩa nên không tính. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Review đối kháng lại 48 cặp Pāli↔Việt, không thấy lỗi mới, không đổi khoá nào. Không gỡ blocker nào.
