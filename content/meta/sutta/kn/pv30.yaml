  THUẬT NGỮ. sīvathikāya chaḍḍitaṁ → bị bỏ ở nghĩa địa, nguyên văn của dn22:7.1 và
  mn10:14.1 (sivathikā = nghĩa địa nơi bỏ thi thể; ở an6.29:8.1 cũng vậy). sugata →
  bậc Thiện, theo an10.123 và an10.124. byasana → tai họa (an10.88, an11.6). asaṁsaya →
  chắc chắn. yakkha/sarīsa → quỷ/long. aṅguṭṭhasneha → vũng mỡ và xoa bẩn (0 tiền lệ;
  đây là mỡ nhớp từ mũi, tức làm nhục, tôi giữ hình ảnh gốc). gabbhāsaya → tổ.
  akkhimala → phân đàn.

  BẤT ĐỊNH ĐÃ GHI. (a) :2.3–2.4 Na yakkhabhūtā na sarīsapā vā …: Sujato hiểu là kể cả
  loài người nữa, còn tôi đọc là dù là quỷ hay long thì cũng chẳng tha, giữ phủ định
  kép của Pāli. (b) :5.3 Nonītapiṇḍaṁva pavedhamānaṁ: piṇḍa là cụm thức ăn bị vò nát,
  tôi dịch bị vò thành bột như cám gạo, bị gió thổi tung. (c) :5.4 Sasaṁsayaṁ
  jīvitasāvasesaṁ: tôi dịch chắc chắn phần đời còn lại ấy còn dài bao lâu nữa — sợ rằng
  đây là câu hỏi về tự mình, chờ đợi vị ấy đáp lại. (d) :10.1 Tassa vataṁ taṁ pana
  brahmacariyaṁ: vataṁ đọc là vay (hay), nên cả khối :10.1–:10.4 là câu hỏi lặp lại từ
  :7.1–:7.4 theo peyyāla; tôi dịch là về phạm hạnh ấy của ngài, về sự tu hành ấy.
  (e) :1.1 Accherarūpaṁ sugatassa ñāṇaṁ … :10.1 của bài mở đầu bằng tranh luận về chủ
  nghĩa của các người trong truyện, còn đoạn thân giữa không có bối cảnh; tôi dịch theo
  nghĩa chữ nghĩa (không thể nghĩ bàn, phước báo suy tàn, phước báo ít ỏi) chứ không suy
  diễn thêm.

