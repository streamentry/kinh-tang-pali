  BẤT ĐỊNH CÒN LẠI (không phân xử được, các từ chỉ xuất hiện một lần trong toàn lớp Pāli root): (a) :2.2 aṅguṭṭhasneha — sneha có thể là chất nhuận/độ ẩm vật lý ("nhờ chất nhuận nơi ngón tay cái", cách đọc đã chọn: bé mút ngón tay mà sống qua đêm) hoặc "ái luyến" (nghĩa thường gặp của sneha trong tầng: snp1.3, snp2.5); không có tiền lệ trực tiếp. (b) :3.3 gabbhāsayaṁ — nghĩa sát chữ là chỗ thai/tử cung; chim không thể tha tử cung nên đọc theo văn cảnh là phần nhau thai, song đây là suy đọc từ ngữ cảnh (đối xứng với quạ lấy ghèn mắt ở :3.4). (c) :3.2 parivattayanti — dạng sai khiến, có thể là "xoay/lật bé" (ngoại động) hay "đi vòng quanh" (nội động); đã chọn "đi vòng quanh". (d) :1.2 yathā puggalaṁ byākāsi — yathā là "như thế nào" hay "tùy theo từng người"; dịch "như … đã tuyên bố về từng người". (e) :7.1 kissa vataṁ — kissa có thể là "của ai" hoặc "nào"; dịch trung tính "hạnh nguyện nào". (f) :4.3 nakkhattayogampi na aggahesuṁ — aggahesuṁ nắm lấy, dịch "chọn lấy". (g) :8.3 chủ thể của assa/so ở :8–:9 là người trong tiền kiếp của đứa bé, suy từ :10.1 tassa vataṁ; Pāli không nói rõ. (h) :6.3–6.4 aggakuliko bhavissati bhogato ca — "đứng đầu về gia tộc và về tài sản" là cách đọc bhogato ca đi cùng aggakuliko.
