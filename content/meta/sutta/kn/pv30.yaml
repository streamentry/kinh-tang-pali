  Lượt cải thiện 2026-10-11. Đọc đối kháng cặp Pāli↔Việt cả 48 khoá, đổi 44/48 khoá (giữ nguyên :0.1, :0.2, :0.3, :12.1). Bản trước có nhiều lỗi nghĩa thật mà điểm cũ không phản ánh; các đoạn ghi chú cũ ở trên bị THAY THẾ ở những điểm sau.
  (1) :11.4 vāsavassa: bản cũ ghi "Ma vương" kèm số đếm 161 so với 68 Yama — số đếm đó không tái lập được và nghĩa sai. Vāsava là danh hiệu của Sakka (ja522:9.4 Devānamindassa ca vāsavassa); mọi khoá dùng Vāsava như danh hiệu trong tầng đều giữ nguyên "Vāsava" (ja340, ja470, ja541, ja543, sn11.19, dn21, mn50… không khoá nào dịch là Ma vương). Sửa thành "Vāsava"; sahabyataṁ theo tiền lệ "chỗ sống chung với" (pv17, pv21, vv83).
  (2) :1.3 ussannapuññā: "suy tàn" sai; ussanna là dồi dào (bv12 ussannakusalā "dồi dào", mil5.1.6 ussannakusalamūla "căn lành dồi dào"). Sửa "dồi dào phước"; :1.4 parittapuñña "ít phước" (pv37:35.4, vv84:35.4).
  (3) :4.1–4.4 Nayimassa rakkhaṁ vidahiṁsu keci: là PHỦ ĐỊNH ("không ai sắp đặt bảo hộ"; không thuốc, không xông hạt cải, không chọn nakkhattayoga, không rải mọi loại ngũ cốc); bản cũ dịch ngược thành "có kẻ đã phá vỡ hộ trì". nakkhattayoga theo tiền lệ ja474 "sự hội hợp của các vì sao".
  (4) :8.3 Tatrassa cittassahu aññathattaṁ: bản cũ "tâm họ chẳng có chút đổi khác" (đảo nghĩa, sai chủ thể); sửa "tâm của người ấy đã đổi khác". :8.4 pharusaṁ asabbhaṁ: "nói lời thô ác, bất nhã" (bản cũ "không ai chịu nghe" là thêm ý). :9.4 yāguyā: bản cũ bỏ mất "cháo"; nay "dùng cháo phụng sự suốt bảy đêm" (sattarattaṁ = bảy đêm).
  (5) :7.1–7.4, :10.1–10.4: bản cũ bịa "ngài hãy nhớ", "ngài hãy tự thấy", "đại vương" (không có trong Pāli). paccanubhossati là động từ tương lai (sẽ thọ hưởng), iddhiṁ là sự thịnh vượng (ja528:19.3 iddhiṁ byasanabhāvañca "sự thịnh vượng và cảnh tai họa"). Công thức Kiṁ te vataṁ kiṁ pana brahmacariyaṁ / suciṇṇassa ayaṁ vipāko đối chiếu ja447, ja524, ja546: vata → "hạnh nguyện" (5/6 nơi có vata), suciṇṇa → "việc khéo thực hành" theo cặp ja524:30.2/34.2 (cùng cặp hỏi-đáp, nên :7.2 và :10.2 song song); hai khoá :7.3 và :10.3 trùng Pāli nguyên văn nên dịch giống nhau (1 cặp trùng trong bài, 0 cặp khác nhau).
  (6) :5.1–5.4: bản cũ "tội ác đã đi tới tận cùng" sai; uttamakicchappattaṁ theo pv36:6.1 "rơi vào cảnh khốn khổ tột cùng như thế"; navanīta "bơ tươi" (mil3.2.1, tha-ap534:20.1); pavedhamāna "run rẩy" (bv2, cp8, ja411...); bản cũ "vò thành bột như cám gạo, bị gió thổi tung" là bịa. :5.4 sasaṁsayaṁ jīvitasāvasesaṁ dịch sát chữ, bỏ câu hỏi tự thêm.
  (7) :2.3–2.4 và :3.1–3.4: yakkhabhūtā "chúng sinh dạ-xoa" (pv36:35.3), sarīsapā "bò sát" (ud2.1, snp4.16), không phải "long"; viheṭhayeyyuṁ "làm hại"; bản cũ "cào mổ chân" sai — palihiṁsu là liếm quanh chân; "xoay tròn đuôi", "kéo từ tổ đi", "kéo phân đàn ra" đều không có trong Pāli.
  (8) :1.1 sugatassa → "bậc Thiện Thệ" (196 khoá chứa sugata dùng "Thiện Thệ"; "bậc Thiện" đứng một mình chỉ là biến thể thưa); :1.2 Satthā → "bậc Đạo Sư" (bản cũ "bậc Thế Tôn" là Bhagavā); :6.1 devamanussapūjito theo kp6 "được chư thiên và loài người tôn kính"; :6.4 aggakula theo mn82 "gia tộc đứng đầu"; :11.2 và :11.3 trùng Pāli nguyên văn với ja506/ja524 và ja446/pv36/vv31, dùng lại nguyên văn bản dịch ("đầy đủ mọi dục lạc", "khi thân hoại, ở đời sau"); :11.1 ṭhatvāna "ở lại" (pv37:34.2) thay "đứng"; :2.1 "Đứa bé" thay "Thằng bé".
  (9) Ghi chú cũ nói "Sujato hiểu là kể cả loài người nữa" tại :2.3–2.4 là KHÔNG kiểm chứng được: tại commit đã ghim không có bản Anh nào cho Petavatthu. Rút lại. Ghi chú cũ về "vũng mỡ… 0 tiền lệ; mỡ nhớp từ mũi" cũng rút lại: aṅguṭṭha là ngón tay cái, không phải mũi.
