notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim (kn/ps/ps2.7_root-pli-ms.json), đủ 290/290 khoá; thứ tự khoá = thứ tự Pāli, không khoá thừa, không khoá thiếu.

  Tầng tham khảo: tầng english-sujato không có ps2.7 (thư mục sutta/kn đã ghim chỉ có cp dhp iti ja kp snp thag thig ud, và manifest chỉ liệt kê tệp Pāli root cho uid này); lớp english-project của dự án chưa có; vietnamese-current (phantuananh) chỉ có Pháp Cú. Coverage English theo công thức của source/layers.yaml: mẫu số 150 khoá Pāli có nội dung (từ 40 ký tự trở lên, bỏ khối :0), tử số 0 ⇒ 0/150. Vì vậy triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft. Phần Pāli của bài này chính là bản luận giải (Paṭisambhidāmagga) cho công thức Chuyển Pháp Luân; các bài sn56.11, sn56.12, sn47.31, sn51.9 và ne14 là những bài khác, có bản English riêng, chỉ được dùng để so cách dịch công thức udapādi và tên các đế, không phải tầng tham khảo của ps2.7 và không cấp text cho bản này.

  Cấu trúc bài: ba phần (Saccavāra, Satipaṭṭhānavāra, Iddhipādavāra), mỗi phần lặp một khuôn hỏi–đáp ý nghĩa của năm điều (mắt, trí, tuệ, minh, ánh sáng), nên các khối trùng Pāli được dịch đúng một cách: 45 nhóm khoá trùng nguyên văn trong chính bài (tính cả khác biệt duy nhất là thẻ in đậm của nguồn), 0 nhóm có bản Việt khác nhau. Pāli có thẻ in đậm của nguồn ở các khoá nhắc lại từ khoá (3.11 đến 3.19, 5.1, …): bản Việt bỏ thẻ và không thêm nháy, theo tiền lệ ps (105 khoá có thẻ ấy ở tầng ps đã dịch không thêm nháy, 7 khoá thêm nháy đơn). Các khoá Pāli không có dấu nháy ở chỗ lời trích bị lược (15.3, 15.4, 16.x, 17.3, 17.4, 21.4, 22.x, 23.3, 23.4, 28.x) thì bản Việt cũng không thêm nháy.

  Thuật ngữ và tiền lệ: cakkhuṁ udapādi, ñāṇaṁ udapādi, paññā udapādi, vijjā udapādi, āloko udapādi dịch mắt, trí, tuệ, minh, ánh sáng đã sinh khởi, lặp từng vế vì phần giải thích sau đó tách từng vế (tiền lệ cùng công thức: sn47.31 8 khoá, sn51.9 8 khoá, sn56.12 12 khoá dùng đã sinh khởi; ne14 7 khoá đã sinh khởi; sn56.11 dùng sanh 17 khoá). dhammacakka dịch bánh xe Pháp (tầng, đo ở các khoá Pāli có dhammacakka hoặc pavattet: bánh xe Pháp 64, Pháp luân 46; đã chọn đa số). Tiêu đề dịch vāra là Phần, theo ne1 đến ne3 (Phần Tụng Họp, Phần Tuyên Chúng, Phần Chỉ Rõ). ariyasacca dịch Thánh đế (226 trong 273 khoá Pāli chứa ariyasacc), tên bốn đế theo ps1.1 và sn56.12: Thánh đế về khổ, về tập khởi của khổ, về diệt tận của khổ, về con đường đưa đến diệt tận của khổ. Dạng pariññeyya dịch cần phải hiểu cho trọn, theo sn56.12 và ne14 (đúng 2 khoá cùng công thức; liễu tri 42 và hiểu rõ 24 ở bối cảnh khác); pahātabba dịch từ bỏ (129 khoá, so với đoạn trừ 122 và đoạn tận 33; sn56.12 dùng từ bỏ). Bốn niệm quán theo ps3.8 và cnd6: quán thân trên thân, quán thọ trên các thọ, quán tâm trên tâm, quán pháp trên các pháp. iddhipāda dịch như ý túc gồm định do dục (tinh tấn, tâm, quán sát) và các hành nỗ lực theo ps3.2 và dn33; vīmaṁsā dịch quán sát (30 khoá, so với suy xét 21, quán xét 12, thẩm sát 4). Phần danh sách ādhipateyyaṭṭhena, akampiyaṭṭhena, niyyānaṭṭhena và các vế còn lại dùng đúng cách dịch của ps2.5:10 (làm chủ, bất động, xuất ly, là nhân, thiết lập, nỗ lực, thành tựu, như thật, không tán loạn, quán chiếu, đồng một vị, không vượt quá nhau, thu thúc, thấy, được thoát khỏi, thông suốt, xả ly, đoạn tuyệt, lắng dịu, cội rễ, phát khởi, hội tụ, quy tụ, đứng đầu, vượt trội, cốt lõi, cứu cánh; amatogadha là nhập vào bất tử). Chuỗi hành vi chuyển vận: sakkaronto kính trọng, garuṁ karonto coi trọng, mānento tôn kính, pūjento cúng dường, apacāyamāno khiêm cung trước (mn21:10.6 cùng Pāli; dn27:8.9 dịch kính trọng, xem trọng, tôn kính, cúng dường, tôn trọng); dhammaddhajo lấy pháp làm cờ hiệu, dhammaketu lấy pháp làm biểu tượng (dn26:5.2), dhammādhipateyyo lấy pháp làm quyền chủ (dn33 và an5.133); vasippatto và pāramippatto đạt được sự thuần thục và sự hoàn mãn (mn111:21.2); vesārajjappatto đạt được sự tự tin (tự tin 41 và tự tín 8, so với không run sợ 6 khoá); dhammacariyā hành xử đúng pháp (13 khoá, ngang với sống đúng pháp 13; hành pháp 5). Khoá 26.13 (Pāli viết thường sau dấu lược) bắt đầu bằng chữ thường để phản chiếu chỗ nối. Khoá 1.2 dùng lại cách dịch của sn56.11:14.3 (Pāli trùng, chỉ khác chữ ti cuối câu).

  Số Pāli: pañca 5 (năm pháp, năm nghĩa), tự đếm danh sách 6.1 đến 6.25 gồm 5 căn, 5 lực, 7 giác chi, 8 chi đạo = 25 khoá, khớp 25 khoá Pāli; không có số lớn.

  Bất định, không thêm vào thân kinh: (1) vatthuka trong dukkhavatthukā, saccavatthukā, kāyavatthukā… dịch lấy … làm nền tảng; tầng có 164 khoá chứa vatthukā nhưng đều thuộc vatthukāma (vật dục), không có tiền lệ cho cách dùng này, và một cách đọc khác là có … làm cơ sở. (2) saṅgahitā dịch được bao gồm trong (mn44:11.x) và pariyāpannā dịch nằm trong (sn22.78:2.11, sn55.54:7.11), hai từ gần nghĩa nhau nên bản Việt khó phân biệt đủ. (3) Câu Dhammañca pavatteti cakkañca và các vế sau không có chủ ngữ rõ trong Pāli, bản Việt để trống chủ ngữ, không thêm Như Lai. (4) attho đối với aṭṭha trong dassanaṭṭho attho dịch nghĩa đối với ý nghĩa; cặp dhammo, attho trong chuỗi này không có tiền lệ đã dịch trong tầng (38 khoá Pāli, đều thuộc bài chưa dịch). (5) Hai cách đọc khả dĩ của chữ ketu là cờ hiệu và biểu tượng; chọn biểu tượng theo dn26, khác an5.133 (đài kỷ niệm, không theo). (6) muttaṭṭhena vimokkho dịch được thoát khỏi, cùng cách ps2.5:10.41 dịch vimuttaṭṭhena, dù muttaṭṭhena và vimuttaṭṭhena là hai từ khác nhau. (7) Ở các khoá không dấu nháy mà có ti nối với lời trích (15.3, 15.4, 16.5, 16.6, 17.3, 17.4…), bản Việt để câu trần, người đọc phải nối với khoá đứng trước.

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (290 = 290), thứ tự giống Pāli; nháy đơn, nháy kép khớp Pāli từng khoá (290 khoá đã đối, 0 lệch); dấu lược … khớp Pāli từng khoá (0 lệch, không còn chữ pe ở bản Việt; Pāli kết …pe… hoặc … thì Việt kết …); NFC đạt; 0 khoá rỗng; Pāli lọt sang Việt chỉ có tên riêng Paṭisambhidāmagga, Koṇḍañña, Bārāṇasī. Dò Pāli trùng nguyên văn từ 25 ký tự giữa bài này và các bài đã dịch khác: 0 cặp (1.2 trùng sn56.11:14.3 trừ chữ ti nên được dùng lại cách dịch). Đã in và đọc đủ 290 cặp Pāli với Việt.

