notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho vv58.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 25 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.
  Sửa lan 2026-10-13: khoá `vv58:2.3` `Dibbā rasā kāmaguṇettha pañca,` *Năm dục lạc nơi cõi trời này đầy đủ hương vị* → *Vị ngon cõi trời cùng năm dục công đức ở nơi đây*: bản cũ gộp `dibbā rasā` vào `pañca` và dịch `ettha` lỏng lẻo, đảo thứ tự; Pāli trùng nguyên văn ở 9 bài (`vv54`–`vv57`, `vv59`, `vv77`, `vv79`, `vv85`), trong đó 6/8 bài còn lại dịch đúng *Vị ngon cõi trời cùng năm dục công đức ở nơi đây* (`vv54`, `vv56`, `vv57`, `vv59`, `vv79`, `vv85`), nên dùng lại nguyên văn.

  Lượt rà soát 2026-10-15 (đợt 2, lô G5, Claude Sonnet 5.5 (Claude Code)): sửa 4.3: công thức yassa
  kammassidaṁ phalaṁ (quan hệ "mà… là quả") dịch lại "về nghiệp mà đây là quả báo", khớp 54 khoá vv
  khác (các khoá hỏi "kissa" không đổi); sửa 3.3, 6.3: "sắc tướng" cho vaṇṇo đổi "dung sắc", khớp hơn
  100 khoá cùng công thức; sửa 2.4: "thiên nữ khoác trang sức vàng ròng đang múa lượn" thành "nữ nhân
  phủ vàng đang múa" (nāriyo, suvaṇṇachannā, bỏ "lượn" thêm).

  Quyết định hội đồng biên tập 2026-10-16: A13 — 3.3 (bỏ dấu chấm thừa sau dấu kết lời thoại (`?”.`/`.”.` thành `?”`/`.”`)).
