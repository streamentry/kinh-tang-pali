notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ dưới 40 ký tự, nên assertion không tự chạy). Tôi quét MỌI khoá: đúng 10/10, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá (`2.1` Pāli là `… Dhammā therī …. ` — **hai** dấu lược, bản Việt giữ **hai**, không rút thành một), ngoặc kép mở ở `1.1` và đóng ở `1.6`, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Dòng lược `:2.1` giữ nguyên, không mở rộng.** Pāli là `… Dhammā therī …. `; tôi viết `… Trưởng lão nữ Dhammā ….`, đúng dạng `thig1.18:2.1` đã có, và **không** mở rộng thành *Bạch Thế Tôn, vị trưởng lão nữ Dhammā đã từng nói bài kệ này* như nhóm `thig1.10`–`1.16` đang làm — BRIEF_VI3 §10.1 nói thẳng Pāli có dấu lược thì bản Việt giữ lược; mở rộng là thêm chữ KHÔNG ĐÁNH DẤU. Tên ở `:2.1` tôi dùng dạng gốc cho khớp `:0.3`.

  **Sáu vế là sáu mốc thời gian, và tôi giữ đúng thứ tự.** `caritvāna` (*sau khi đã đi*) → `daṇḍamolubbha dubbalā` (*tựa vào gậy, yếu ớt*) → `Vedhamānehi gattehi` (*khi chi thể đang run*) → `nipatiṁ chamā` (*ngã xuống ngay tại chỗ ấy*) → `Disvā ādīnavaṁ kāye` (*nhìn thấy mối nguy trong thân*) → `athā` (*thì*) `cittaṁ vimucci me` (*tâm tôi đã được giải thoát*). `athā` là **liên từ chỉ kết quả** (*thì*), không phải *rồi* hay *sau đó* — tôi dịch *thì* để giữ quan hệ nhân quả, và `vimucci` là **aorist** (*đã được giải thoát*), khớp Sujato *was freed*.

  **Thuật ngữ, đếm được.** `kuṭikā` không có trong bài này, nhưng `thag1.58:1.1` dùng *túp lều* (15 chỗ trong tầng) — cùng cách gọi cho `kuṭikā` trong Khuddaka Nikāya, tôi giữ nhất quán. `piṇḍapāta` → *đi khất thực* (**0 tiền lệ** cho cụm này; `piṇḍapāta` là hành động đi xin ăn, không phải *bát cơm*). `daṇḍa` → *gậy nâng*; `molubbha` → *tựa vào* (**0 tiền lệ**, đặt mới; tôi **không** thêm modality *phải* — Pāli `molubbha` là dạng quá khứ của `muluñcati` *dựa vào*, không phải `aniketabba`/cần phải). `dubbalā` → *yếu ớt*; `vedhamāna` → *đang run rẩy*; `nipati` → *ngã xuống*; `chamā` → *tại chỗ ấy*; `ādīnava` → *mối nguy*; `vimuccati` → *được giải thoát* (tiền lệ: `sn45`/`an` dùng *giải thoát* cho `vimuccati`). `<X>therīgāthā` → *Kinh Kệ Của Trưởng Lão Nữ <X>* (tiền lệ `thig1.10`–`1.18`).

  **Tên riêng `Dhammā` giữ dạng Pāli** ở `:0.3` và `:2.1` (Pāli `:2.1` là `Dhammā therī`; tôi viết *Trưởng lão nữ Dhammā* — dạng danh từ, đúng hình thức `thig1.18:2.1` *Trưởng lão nữ Saṅghā* cho `Saṅghā therī`).

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có 26 chương Pháp Cú), nên `triangulation` là Pāli + English Sujato. Bản Anh đã ghim có prose ở **9/10** khoá; khoá trống duy nhất là `:2.1`, tức dòng lược.
  **Những lỗi bản đầu tôi tự bắt khi đọc đối kháng (đã sửa hết, ghi lại để người đọc scorecard biết điều gì đã qua):** `1.2` bản đầu dịch `molubbha` thành *phải tựa vào gậy nâng* — tôi thêm modality *phải* không có trong Pāli (`molubbha` là dạng quá khứ của `muluñcati`); đã bỏ *phải*.
