  Đầu 0.2 giữ Pāli `Meṇḍakapañha` theo mil5.5.7 và mil5.5.10 (2/3 bài đã merge trong phẩm).
  `:0.3` `Santhavavagga` giữ Pāli theo mil5.5.10; mil5.5.7 dịch “Phẩm Santhava” (1/3). Ghi lại
  để người điều phối gộp.

  THUẬT NGỮ — tra tiền lệ bằng `grep -o ... | sort | uniq -c | sort -rn` trước khi
  chốt, không đoán: `bhante` khi một tỳ-kheo gọi tỳ-kheo → “bạch ngài” (đếm trên toàn tầng
  `an/`: “Bạch Ngài” 28× + “bạch Ngài” 6×, mạnh hơn mọi cách khác); `mahārāja` → “tâu đại vương”
  (số đếm ở mục văn xưng trên); `bhagavatā` → “Thế Tôn”; `therena sāriputtena dhammasenāpatinā` →
  “Trưởng lão Sāriputta, Tướng quân của Chánh pháp” (theo mil7.5.7); `sotāpanno` → “Nhập Lưu”
  (tiền lệ đếm được 18× trong tầng `kn`); `samaṇakaraṇā dhammā` → “phẩm chất của bậc sa-môn”;
  `liṅga` → “dấu hiệu”; `micchā` → “sai”; `sampaṭicchāmi` → “trẫm xin kính nhận” (theo
  mil5.3.5/mil5.4.5); `seṭṭho` → “tối thượng”.

  CÔNG THỨC HAI CÂU KỆ ĐƯỢC DÙNG LẠI NGUYÊN VĂN TRONG CHÍNH BÀI, ĐẾM ĐƯỢC. Pāli
  `‘uttiṭṭhe nappamajjeyya, udare saṁyato siyā’ti` trùng nguyên văn ở **4 khoá** (2.2, 4.2, 4.5,
  5.4, 6.3 — 5 khoá) và `‘ahaṁ kho panudāyi … bhiyyopi bhuñjāmī’ti` trùng ở 4 khoá (3.2, 3.6, 4.3,
  7.2). Cả hai chuỗi đều được dịch **một lần rồi dùng lại y hệt**, kể cả dấu câu. Bản nháp đầu
  tiên lệch ở 4.3 (chấm phẩy thay chấm chấm); đã sửa trong review đối kháng. Bốn khoá 5.4 và
  6.3 có cùng Pāli và cùng bản Việt — kiểm bằng script chỉ mục, không bằng mắt.

  DANH SÁCH MƯỜI SÁU TÍNH TỪ Ở 4.5 — `sabhāvavacanaṁ asesavacanaṁ nissesavacanaṁ
  nippariyāyavacanaṁ bhūtavacanaṁ tacchavacanaṁ yāthāvavacanaṁ aviparītavacanaṁ isivacanaṁ
  munivacanaṁ bhagavantavacanaṁ arahantavacanaṁ paccekabuddhavacanaṁ jinavacanaṁ
  sabbaññuvacanaṁ` — dịch đủ cả 16, không lược. Đây là lý do đoạn này dài ở tiếng Việt: **không**
  thay bằng `…`, vì nội dung bị nén (danh sách tán tánh) không lặp lại ở đâu khác trong bài.

  BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.
  `appa-kule-kapuggama`-không-có: `kappaṭṭhiyaṁ kammaṁ āyūhi` (5.2) = đã gom tụ một khối nghiệp
  lớn. Bản nháp đầu tiên viết “tích lũy nghiệp dẫn tới địa ngục” — “địa ngục” **không có** trong
  Pāli ở khoá này; đã sửa thành “gom tụ một lượng nghiệp lớn”. `vantassa virittassa anuvāsitassa
  āturassa` (8.1) = đã được gây nôn, thụi mở ruột, săn sóc và dùng thuốc; bản nháp đầu tiên gộp
  cả ba thành “điều trị và dùng thuốc”, đã sửa để giữ đủ. `yāva tāvatiṁsabhavanaṁ kampetvā`
  (6.2) = run rẩy tới cõi Tāvatiṁsa; giữ tên Pāli `Tāvatiṁsa` (đã có trong tầng Việt) thay vì
  “cõi Tam Thiên” vốn là cách hiểu khác. `samaṇadhammaṁ pūreti` (6.1) = hoàn thành toàn bộ phạm
  chất sa-môn. `duṭṭhena cittena tathāgatassa lohitampi uppādeti` (5.1) = với tâm ôn chướng khiến
  Đức Thế Tôn nổi máu — giữ nguyên, không nói nhẹ thành “làm Đức Thế Tôn giận”.

  DẤU LƯỢC — Pāli bài này **không** có `…pe…` ở khoá nào, nên không phát sinh chính
  sách. Văn xưng, phẩm chất, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ. Toàn bộ 34 khoá đã
  đi qua `_hvi.kiểm` (thiếu khoá, thừa khoá, ngoặc kép cân trên cả bài, NFC, không trùng nguyên
  văn Pāli, không lọt Pāli, khớp số dấu lược) trước khi ghi.

  VĂN PHONG — phần lớn lát là truyện kệ, nhịp câu ngắn; giữ niêm luật kệ ngôn và
  phép lặp mang cấu trúc (bốn câu hỏi–đáp trong mil5.5.2, năm phần của voi trong mil7.5.10,
  năm ẩn dụ liên tiếp trong mil5.5.4) thay vì diễn giải, theo `skill/translation.md` §9.

