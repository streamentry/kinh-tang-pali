notes: |-
  Bản dịch chỉ từ Pāli root do commit đã ghim không có bản Anh upstream (giới hạn upstream).
  Đầy đủ 10 tiêu chí scorecard; status bắt buộc draft do blocker tầng tham khảo Anh; technical_integrity 9.6.
  Sửa lan 2026-10-13: khoá `ja280:6.2` (Tassuddānaṁ), `Sikhinī ca balāka`: *Công chúa, cò trắng* → *Con mái có mào, cò*. Căn cứ: `sikhinī` là dạng cái của `sikhin` (có mào/chỏm), không có nghĩa *công chúa*; từ khóa này lấy từ câu `Kāyaṁ balākā sikhinī` của `ja274:1.1` (đã dịch *Con cò mào này là ai*), còn `balāka` dịch *cò* ở `ja274:1.3`, `ja375:2.3`, `ja275:1.1`, `mnd2:96.2` (chữ *trắng* không có trong Pāli nên bỏ). Bất định: vì đây là từ khóa nhớ chứ không phải câu, không rõ `sikhinī` là con cò mào hay con công mái; chọn nghĩa trung tính *con mái có mào* thay vì gán *cò mào* hay *công*.

  Quyết định hội đồng biên tập 2026-10-16: C1 — `0.4`, `4.1` và translationTitle (tiêu đề giữ "Kinh X", bỏ đuôi "jātaka" hoặc "Chuyện Tiền Thân"; cùng tên Pāli thì cùng tên Việt); C3 — `0.2` (tên nipāta "Nhóm N Kệ"); C4 — `3.4` (xưng hô trong lời thoại ngắn: một cặp duy nhất, bỏ "trẫm").
