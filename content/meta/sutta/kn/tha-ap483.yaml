notes: |-
  Dịch trực tiếp từ Pāli root; cả ba tầng tham khảo đều vắng ở bài này.
  Pāli trùng nguyên văn: 24 khoá, dù lại nguyên văn 16 khoá. `:0.1` `Therāpadāna` (278/287) · `:0.2` `Paṁsukūlavagga` → “Phẩm Y Phấn Tảo” (1 nơi, tha-ap488) · `:1.2` `sayambhū aggapuggalo;` dùng lại nguyên văn tha-ap251:1.2 · `:4.3` `Buddhaseṭṭhaṁ saritvāna,` dùng lại nguyên văn tha-ap496:1.3 · `:6.1`–`:8.4` giống hệt tha-ap453 và cùng bộ câu kệ với 271/292/291 nơi khác.
  Cố ý dịch khác tiền lệ ở `:1.1`: cùng Pāli `“Tisso nāmāsi bhagavā,` có 1 tiền lệ (tha-ap186:1.1) dịch thành “Đức Thế Tôn tên gọi Tissa,” — nhưng `nāmāsi` là ngôi thứ hai số ít và `bhagavā` là tân ngữ gọi thẳng, nên câu đó là **gọi** Đức Thế Tôn chứ không phải nhắc tới ông; tôi dịch “Bạch Đức Thế Tôn, ngài có tên là Tissa,”. Đây là cố ý lệch, có lý do, không phải trôi dạt.
  Tên `0.3`, `9.1`, `10.1`: `Paṁsukūlasaññakattheraapadāna` **không** thể giữ nguyên `Paṁsukūlasaññaka` như khuôn của tha-ap484–488 (vốn giữ tên Pāli), vì chuỗi đó không phải token của Pāli khoá `0.3`/`10.1` và cũng chưa có trong tầng, nên `lọt_pāli` sẽ báo Pāli lọt; tôi dịch nghĩa chữ nghĩa “Nhớ Tướng Y Phấn Tảo” và dùng CHUNG ở cả ba khoá. `paṁsukūla` dịch “y phấn tảo” theo `tha-ap488:0.2` và ud4.6:2.1; `saññaka` (kẻ nhớ) có tiền lệ dịch nghĩa ở tha-ap84/217/327.
  Bất định: `:1.4` `jino` (bậc chiến thắng) không có tiền lệ trong tầng, dịch theo nghĩa chữ nghĩa. `:2.1` `Vinataṁ` (đầu cúi) tôi dịch “cúi đầu”. `:2.3` `Maṇḍalaggaṁ` không có tiền lệ, dịch “một bó”. `:4.4` `avandahaṁ` có thể là “đã lập nguyện” lẫn “đã đảnh lễ”; vì `:5.4` `vandanāya idaṁ phalaṁ` nói rõ quả báo của **sự đảnh lễ**, tôi chọn “đã đảnh lễ” và dùng nhất quán ở `:4.4`, `:5.2`, `:5.4`. `Tisso nāmāsi` ở `:1.1` (`Tissa`) có tiền lệ ở tha-ap186 nên tôi giữ nguyên.
  Không khoá nào trong 8 bài này có `…pe…` ở Pāli (đã kiểm 296/296 khoá), nên không có dấu lược nào để giữ, và không có chỗ nào bịa dấu lược che chỗ thiếu.
  Đo lại trên đĩa, hai con số coordinator nêu ở mục (4) của prompt KHÔNG khớp: `bhante` trong tầng `mil` dùng **“thưa tôn giả” 149 lần / 71 tệp**, “bạch ngài” chỉ 37 lần / 23 tệp, “bạch thầy” = 0 (giữ nguyên phần đúng của bạn); `mahārāja` dùng **“này Đại vương” 395 lần / 101 tệp**, còn “tâu đại vương” chỉ 169 + “tâu Đại vương” 79 = 248 lần / 32 tệp. Cả 9 bài lân cận mil3.1.12/.14 và mil7.3.1/.9 đều dùng “này Đại vương”, nên lát này theo đo được, không theo con số bạn đưa.
  Cổng kỹ thuật CHƯA chạy vì agent dịch không được chạy lệnh npm. Tôi chỉ xác minh được: JSON hợp lệ, đủ 37/37 khoá trong `all`, không orphan, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, không có `(…)` đứng một mình, ngoặc kép cân trên cả bài, không Pāli lọt, không trùng nguyên văn Pāli, và YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
