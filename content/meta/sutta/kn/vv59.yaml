notes: |-
  Dịch trực tiếp từ Pāli root vì không có tầng tham khảo tiếng Anh của Sujato tại commit đã ghim cho vv59.
  Đối chiếu văn cảnh và chú giải để xác định ngữ nghĩa các từ cổ và cấu trúc đối thoại.
  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 28 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.
  Sửa lan 2026-10-13: khoá vv59:2.3, "Vị ngon cõi trời cùng năm dục công đức,"
  → "Vị ngon cõi trời cùng năm dục công đức ở nơi đây," (dibbā rasā
  kāmaguṇettha pañca: kāmaguṇettha = kāmaguṇā + ettha, "ở nơi đây" bị bỏ sót).
  Căn cứ: nguyên văn vv54:2.3, vv56:2.3, vv85:2.3 (cùng câu Pāli); vv55:2.3 và
  vv77:2.3 cũng có ettha (ở nơi đây / ở đây). Ngoài phạm vi, ghi nhận:
  vv57:2.3 và vv58:2.3 vẫn chưa có ettha.

  Lượt rà soát 2026-10-15 (đợt 2, lô G5, Claude Sonnet 5.5 (Claude Code)): sửa 4.3: bản cũ "quả báu"
  (phala là quả) nay công thức yassa kammassidaṁ phalaṁ (quan hệ "mà… là quả") dịch lại "về nghiệp mà
  đây là quả báo", khớp 54 khoá vv khác (các khoá hỏi "kissa" không đổi); sửa 3.3, 7.3: vaṇṇo "hào
  quang" đổi "dung sắc"; sửa 2.4: nāriyo, suvaṇṇachannā, bỏ "lượn bay" thêm.

  Sửa lỗi nghĩa 2026-10-16: vv59:1.4 `rucakatthatā` — "trải thảm rực rỡ" → "được trải vàng" (`rucaka` là vàng/cát vàng, `atthata` là được trải, không có chữ nào cho "thảm"; căn cứ https://www.wisdomlib.org/definition/rucaka (PED: rucaka = vàng/cát vàng, "suvaṇṇa-vālikā"); Vv-a ad Vv 35 (https://www.tipitaka.org/romn/cscd/s0506a.att1.xml): "rucakupatiṇṇanti suvaṇṇavālikāhi okiṇṇaṅgaṇaṃ"; Indacanda "được trải lót bằng vàng" (https://www.tamtangpaliviet.net/VHoc/30a/Vv_03.htm)).
