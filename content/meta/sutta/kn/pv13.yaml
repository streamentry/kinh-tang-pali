  - Tiêu đề & phân loại:
    + `0.1` “Petavatthu” và `0.2` “Ubbarivagga” giữ nguyên Pāli như các bài cùng phẩm (7/7 tệp pv đã dịch có khoá này, vd pv14, pv20, pv23).
    + `0.3` “1. Chuyện Ngạ Quỷ Nữ Saṁsāramocaka” theo khuôn “N. Chuyện Ngạ Quỷ …” (pv10, pv14, pv16: giữ số thứ tự ở dạng `N.`); `peti` là dạng nữ của `peta` nên thêm “Nữ” như pv10 “Chuyện Ngạ Quỷ Nữ Khallāṭiya”. `22.1` “Chuyện ngạ quỷ nữ Saṁsāramocaka, thứ nhất.” (`paṭhamaṁ` = thứ nhất) cùng khuôn với pv10:16.1.
    + `Saṁsāramocaka` giữ nguyên Pāli như tên riêng; nghĩa đen của vế đầu là “người làm cho thoát khỏi luân hồi”, nhưng Pāli trong bài không giải thích vì sao nàng mang tên/hiệu ấy nên không dịch, không giải thích.
  - Số Pāli — tự tính:
    + `vassasatāni pañca` (5.1) = năm trăm năm (5 × 100 = 500).
    + `vassasataṁ dasa` (15.2): cách đọc `dasa` × `sataṁ` = 10 × 100 = **1.000 năm**; dịch “một ngàn năm”. Đây là chỗ chưa phân xử độc lập được (xem Bất định): chữ `sataṁ` số ít cạnh `dasa` cũng có thể đọc là “một trăm mười” (110). Không có bản English nào trong tầng để đối chiếu.
    + `paṭhamaṁ` (22.1) = thứ nhất. Không còn số nào khác (`caturassā` ở 19.3 là “hình vuông”, theo tha-ap18:8.4 `caturassasamāyutaṁ` → “có hình vuông”, không phải số đếm).
  - Thuật ngữ & tiền lệ (đo trên tầng đã dịch):
    + Pāli trùng nguyên văn với bài khác (đo lại ở lượt cải thiện, so không tính dấu câu và chữ hoa đầu dòng; trừ `0.1`, `0.2`): 53 khoá có Pāli trùng (530 cặp), 39 khoá dùng lại nguyên văn bản Việt có sẵn của tầng, 14 khoá khác. Trong 14 khoá ấy, 6 khoá chỉ khác dấu câu hay chữ hoa đầu dòng so với bài song song pv27 (`16.3`, `16.4`, `17.1`, `18.1`, `18.2`, `18.4`); 8 khoá khác về chữ (`4.4`, `7.1`, `13.3`, `14.4`, `17.4`, `21.1`, `21.2`, `21.4`), lý do ở các mục dưới. Lời của vị ấy ở `10.1`–`12.4` (12 khoá) dùng lại nguyên văn pv14:11.1–13.4 (công thức `Abhikkantena vaṇṇena … sabbadisā pabhāsatī`, mỗi dòng có 18–70 khoá trùng Pāli trong tầng; ở `11.2` đa số 16/21 là “thành tựu được ở nơi đây”, ở `12.1` đa số 22/23 là “Tôi hỏi nàng, này thiên nữ có đại oai lực”); `8.1`–`9.4` theo pv10, pv14, pv16 (3/3 bài cùng khuôn); `1.1`–`1.4` theo pv14:1.1–1.4 và pv15:1.1–1.3; `21.3` theo pv14:18.3 và vv21:10.3 (2/2). Bài song song pv27 (cùng cấu trúc “dâng cúng — hồi hướng — quả báo”) trùng Pāli ở 18 khoá của bài này (`2.2`, `2.3`, `8.1`, `15.4`, `16.3`, `16.4`, `17.1`, `17.3`, `18.1`, `18.2`, `18.4`, `19.3`, `19.4`, `20.2`–`20.4`, `21.3`, `21.4`); 17 khoá giống nguyên văn (không tính dấu câu), khoá còn lại là `21.4` (“chúng tôi” ở pv27:31.4, “con” ở đây vì người nói là một người).
    + `2.1` `Ahaṁ bhadante petīmhi`: 4 khoá có Pāli trùng, ba cách dịch — “tôi là ngạ quỷ nữ” (pv6:2.1, pv7:2.1), “con là ma” (pv31:2.1), “con là ngạ quỷ nữ” (pv44:2.1). Khoá này trùng nguyên văn pv44:2.1: `peti` là ngạ quỷ (tên bài và colophon trong chính bài dùng “ngạ quỷ”; pv19:2.1 `petomhi` cũng dịch “ngạ quỷ”), và `petī` là dạng nữ. Ngôi “con” theo cả bài (lời nữ ngạ quỷ thưa với một tôn giả).
    + `2.2` `duggatā yamalokikā`: đo lại 10 khoá có Pāli trùng, ba cách dịch — “sinh về cõi khổ xa xôi, thuộc cõi của Yama” (4, đều pv31), “đã rơi vào cảnh khổ, thuộc cõi của Yama” (3: pv27:2.2, pv27:6.2, pv44:2.2), “khốn khổ, thuộc cõi của Yama” (3: pv6, pv7, pv45). Khoá này theo cách thứ hai (trùng nguyên văn pv27, pv44, và pv19:2.2 cùng nghĩa `duggato yamalokiko`). “Xa xôi” không có căn cứ Pāli (`duggata` là “rơi vào cảnh khổ, khốn khổ”). Chưa sửa các bài kia (ngoài lát).
    + `2.4`/`3.4` Pāli trùng nguyên văn nhưng người nói khác nhau (2.4 là lời nữ ngạ quỷ — “con đã từ đây …”; 3.4 là lời hỏi của Sāriputta — “mà ngươi đã từ đây … ?”), nên bản Việt phải khác; cả hai theo cách dịch `petaloka` = “thế giới của người đã chết” (pv16, pv31, pv44, pv45: 7 khoá).
    + `bhante`/`bhadante` (2.1, 4.1, 6.4, 17.1, 21.4) → “bạch ngài”: trong riêng các bài pv đã dịch, 16 khoá dùng “bạch ngài” so với 1 khoá “thưa tôn giả” (pv14:18.4) và 3 khoá “bạch tôn giả”; cả tầng thì “thưa tôn giả” đa số rõ (248 so với 4). Chọn “bạch ngài” theo phạm vi gần nhất (lời một ngạ quỷ thưa với một tôn giả) và để cả bài nhất quán. `21.4` vì vậy khác pv14:18.4 (“thưa tôn giả, tôi đã đến để đảnh lễ”) dù Pāli trùng; ngôi “con” để khớp ngôi trong cả bài (2.1, 4.1, 6.x, 17.x…).
    + `7.1` `Sādhūti so paṭissutvā` theo pv16:9.1 nhưng đổi “Ông ấy” thành “Vị ấy” vì chủ thể là tỳ-kheo Sāriputta. `21.2` bỏ đại từ “tôi” của pv14:18.2 vì `21.1` đã có “Con đây”.
    + `duggatiyā` (6.4) → “khỏi cõi dữ”: `duggati` → “cõi dữ”/“đường dữ” là đa số của tầng (28 khoá ở iti, ud… dịch “cõi dữ”, ud4.2:5.6 “đường dữ”).
    + `dakkhiṇamādisi` (7.6, 14.4) → “hồi hướng phần cúng dường”: pv10:6.4, pv14:8.4, pv16:10.4 (3/3). `dakkhiṇā` (8.4) → “sự cúng dường” theo pv10:7.4, pv14:9.4, pv16:11.4.
    + `ālopa` (7.3, 14.1, 15.1) → “nắm cơm” theo mil7.5.6:3.2 (“một nắm cơm”); `pāṇimattaṁ coḷakaṁ` → “mảnh vải nhỏ cỡ bàn tay”; `thālaka` → “tô” (nước uống đựng trong một cái tô nhỏ, “tô” là cách dịch gần nghĩa); `pānīya` → “nước uống”. Không có tiền lệ Pāli trùng cho ba chữ này trong tầng.
    + `khomakappāsikāni` (17.4) → “vải lanh và vải bông” theo tha-ap45:5.4 (“cùng vải lanh và vải bông”). `koseyyakambalīyāni` → “vải tơ lụa và vải len”. `padumuppala` (20.3) → “sen đỏ và sen xanh” theo tha-ap162:1.3, tha-ap475:12.2.
    + `sunimmitā` (19.4) → “được khéo tạo thành” theo tha-ap271:1.2 (“được khéo tạo thành”). `manaso piyaṁ` (18.4) → “dễ chịu với tâm”: theo 34 khoá cùng Pāli `ye keci manaso piyā` (11.4 cũng giữ dạng này; 2 khoá lệch dạng khác); chữ vừa nghe hơi cứng nhưng nhất quán với tầng.
    + `samaṇabrāhmaṇānaṁ` (4.4) → “các sa-môn, Bà-la-môn”: dạng “sa-môn, Bà-la-môn” là đa số của tầng (38 khoá).
    + `Sāriputta`, `Nanda`, `Kāsi` giữ dạng Pāli như các bài trước (pv10:8.2, pv14:10.2, pv16:12.2 dùng “Kāsi”). `Yama` theo pv19:2.2.
    + `dubbaṇṇarūpāsi` (1.1) giữ “trần truồng” vì Pāli có `naggā`: pv6:1.1 và pv7:1.1 (2/2) bỏ mất chữ ấy (“Này ngươi gầy gò, xấu xí”). Đã báo, không sửa ngoài lát.
  - Trùng nguyên văn trong bài: 5 nhóm Pāli trùng (2.4=3.4; 7.3=14.1; 7.4=14.2; 7.5=14.3=19.1; 16.2=19.2); 2 nhóm có bản Việt khác nhau — 2.4/3.4 (khác chủ thể, xem trên) và 19.1 so với 7.5/14.3 (19.1 là tân ngữ của `passa` ở 19.2: “Về một tô nước uống, hãy xem quả báo ấy như thế nào”, còn 7.5/14.3 là một vật được dâng: “và một tô nước uống”); 16.2 và 19.2 giữ cùng một bản Việt.
  - Người nói và người nghe: kệ 1 là Sāriputta hỏi nữ ngạ quỷ (“ngươi”); kệ 2, 4–6 là nữ ngạ quỷ thưa với Sāriputta (“con”); kệ 3 là Sāriputta hỏi tiếp; kệ 7–9 là lời kể; kệ 10–12 là Sāriputta hỏi vị thiên nữ; kệ 13–21 là vị thiên nữ (“con”) thưa lại với Sāriputta. Các khoá `10.1`–`12.4` dùng nguyên văn tầng. Ở `12.1`, lượt đầu ghi sai là “Tôi hỏi ngài” (kèm số đếm 16 không đúng); đo lại: 22/23 khoá cùng Pāli là “Tôi hỏi nàng, này thiên nữ có đại oai lực”, chỉ vv18:3.1 dùng “ngài”; đã sửa theo đa số để cùng một ngôi “nàng” với `10.2`, `11.1`–`11.3`, `12.2`–`12.4`.
  - Bất định — ghi lại, không thêm vào thân kinh:
    + `vassasataṁ dasa` (15.2): “một ngàn năm” (10 × 100) hay “một trăm mười năm”. Dịch 1.000 vì đối ứng với “năm trăm năm” của cảnh khổ ở `5.1` (thời gian của quả lành lớn hơn quả ác). Lượt cải thiện quét toàn Pāli root tìm cấu trúc “`sata` số ít + số đếm”: `vassasataṁ dasa` là cụm duy nhất có dạng `vassasataṁ` + số đếm; ví dụ gần nhất là pv38:29.3 `yojanānaṁ sataṁ pañca` (tầng dịch “năm trăm do-tuần”, số đếm nhân với trăm), nhưng bản thân cách đọc đó cũng chưa được kiểm độc lập, và thag17.3:38.4 `sataṁ pañca ca uttarīti` (“một trăm, cộng thêm năm”) là cấu trúc cộng chứ không nhân. Vậy căn cứ ngữ pháp trong tầng chỉ nghiêng nhẹ về 1.000, không phân xử được; bất định giữ nguyên.
    + `Ito ahaṁ vassasatāni pañca, yaṁ evarūpā vicarāmi naggā` (5.1–5.2): `ito` có thể hiểu là “từ đây trở về trước” (đã năm trăm năm) hoặc “từ đây trở đi” (còn năm trăm năm). Dịch “Từ đây, suốt năm trăm năm, con lang thang …” giữ nguyên chữ “từ đây” và để ngôn ngữ Việt không buộc hướng thời gian. Lượt cải thiện quét `ito` đi cùng một khoảng thời gian: chỉ còn tha-ap148:5.1 (“Cách đây một trăm kiếp về trước”) và tha-ap226:4.1 (“Vào sáu kiếp về sau”), hai khoá của tầng đọc ngược chiều nhau, nên tiền lệ không phân xử được; và Pāli ở đây là hiện tại `vicarāmi` đi với `yaṁ`. Giữ bất định.
    + `pasannacittā` (4.4): số nhiều, có thể là phần của những người thân (`ye … pasannacittā` — “những người có tâm tịnh tín”) hoặc là trạng thái của việc bố thí (“với tâm tịnh tín, cho các sa-môn, Bà-la-môn”). Dịch giữ trật tự Pāli, không buộc hẳn một cách đọc; cách hiểu thứ nhất không được loại trừ.
    + `dadāhi dānaṁ` (4.3): lời khuyên bố thí không có `iti` trong Pāli, nên bản Việt dùng dấu hai chấm chứ không thêm dấu nháy (khớp Pāli từng khoá: 4.1 mở nháy kép, 6.4 đóng).
    + `tepākāsevalambare` (18.2): chữ `p` giữa `te` và `ākāse` khó phân tích (có thể là `te + ākāse + avalambare`); dịch “lại còn treo lơ lửng giữa không trung”, sát nghĩa `avalambati` (treo lơ lửng) + `ākāsa` (không trung).
    + `appaṭigandhiyā` (20.2): “không có mùi hôi” (không có mùi khó chịu); có thể đọc nhẹ hơn là “không bị mùi lạ” — không thêm “thơm”, vì Pāli không có.
    + `sampatitacchaviṁ` (13.2): “da bong tróc”; có thể là da khô nứt hoặc da rữa. Nghĩa chắc chắn của chữ ghép chỉ là “có da rơi/rụng”. Đã quét toàn Pāli root: chữ ghép này chỉ có ở pv13 (hapax); `sampatita` đứng riêng chỉ còn ja547:177.1 và ja545:170.3 (“ùa tới”, “rơi xuống”), không giúp chọn giữa “bong tróc”, “nứt nẻ” hay “rữa”. Giữ bất định này.
    + `Muni` (13.3, 21.3): Pāli không nêu tên; theo ngữ cảnh (`7.1`–`7.6`, `9.4`, `14.x`) là vị đã dâng cúng và hồi hướng, tức Sāriputta, nhưng bản dịch không ghi tên ở chỗ Pāli không ghi.
    + `Saṁsāramocaka` (0.3, 22.1): xem mục Tiêu đề. Chưa phân xử được đây là tên riêng hay một danh hiệu.
    + `uppaṇḍukiṁ` (13.1): “vàng vọt” (da vàng úa, xanh xao).
    Vì các chỗ trên và thiếu bản Anh độc lập, `semantic_fidelity` 8.8 (lượt cải thiện) và `ambiguity_integrity` 8.6.
  - Kiểm tra: 90/90 khoá đúng tập và thứ tự Pāli; NFC, không khoá rỗng, không khoảng trắng thừa; nháy kép “ ” khớp Pāli từng khoá (1.1/1.4, 2.1/2.4, 3.1/3.4, 4.1/6.4, 10.1/12.4, 13.1/21.4), nháy đơn 0/0; dấu lược `…` 0/0 (Pāli không có), `(…)` 0; không Pāli lọt vào thân bản dịch ngoài tên riêng và thuật ngữ giữ nguyên (Petavatthu, Ubbarivagga, Saṁsāramocaka, Sāriputta, Yama, Nanda, Kāsi). Đã đọc đối chiếu từng cặp Pāli↔Việt.
  - technical_integrity 9.6: cổng kỹ thuật do người điều phối chạy — npm run validate; npm test; npm run check; npm run build.
  - Lượt cải thiện 2026-10-13: đọc đối kháng lại 90 khoá, đo lại tiền lệ bằng chỉ mục Pāli→Việt toàn tầng (so không tính dấu câu), đổi 5 khoá, giữ nguyên tập khoá và thứ tự.
    + `11.2` “Do đâu nàng có được nơi này;” → “Do đâu nàng thành tựu được ở nơi đây;” (terminology/clarity: đa số 16/21 khoá cùng Pāli, gồm pv14:12.2, pv15:30.2, pv16:14.2; “có được nơi này” chỉ ở vv18, vv33 và không bám `mijjhati`).
    + `12.1` “Tôi hỏi ngài, này thiên nữ, về đại oai lực ấy:” → “Tôi hỏi nàng, này thiên nữ có đại oai lực:” (terminology: 22/23 khoá cùng Pāli; sửa luôn con số 16 sai ở lượt đầu; bỏ “ngài” để bài chỉ dùng “nàng” cho vị thiên nữ).
    + `13.1` “Vàng vọt, gầy guộc, đói ăn,” → “Vàng vọt, gầy guộc, đói,” (terminology: `chāta` → “đói” ở pv45:7.2, pv45:8.1, pv40:4.1; bỏ “ăn” vì Pāli không có `āhāra`).
    + `13.3` “Đấng Mâu-ni từ bi với thế gian,” → “Bậc Mâu-ni lòng từ bi giữa cõi đời,” (terminology: cùng cụm `muni kāruṇiko loke` với `21.3`; 3 khoá cùng cụm dạng đối cách dịch “bậc Mâu-ni lòng từ bi giữa cõi đời” (pv14:18.3, vv21:10.3, pv27:31.3), chỉ tha-ap328:3.1 dịch “từ bi với thế gian”; `loke` là vị trí cách nên “giữa cõi đời”; chưa sửa tha-ap328 vì ngoài lát).
    + `20.1` “Nước trong, bến đẹp,” → “Nước trắng trong, bến đẹp,” (semantic/terminology: `setodakā` khác `acchodakā`; tầng dịch `acchodakā` “nước trong” và `setodakā` “nước trắng trong” (dn16:4.22.5, 4.23.5) hoặc “nước trắng” (sn3.19:4.1, 6.1); “nước trong” làm mất chữ `seta`).
    + Điểm đổi: `terminology` 8.8 → 9.0 (4 khoá về tiền lệ và đại từ, 1 khoá về `seta`, và đính chính các số đếm sai ở lượt đầu: 7/7, 16 khoá, 37/32/5); `semantic_fidelity` 8.7 → 8.8 (sửa `setodakā`); `vietnamese_clarity` 8.9 → 9.0 (`11.2`, `12.1`, `13.1`). Các điểm khác giữ nguyên.
    + Không đổi dù nghi ngờ: `7.1` “Vị ấy” (khác “Ông ấy” của pv16:9.1 vì chủ thể là Sāriputta, đã có ở lượt đầu); `18.2` “lại còn” (khớp pv27:18.4, chữ `te` đã có ở `18.1`); `17.4` “cùng vải lanh …” (6 khoá cùng Pāli dịch “vải lanh và vải bông”, nhưng ở đây dòng trước là “loại vải tơ lụa và vải len,” nên `ca` đọc là nối tiếp); `21.4` “bạch ngài, con …” (khác pv14:18.4 “thưa tôn giả, tôi” nhưng khớp ngôi cả bài); `15.2` “một ngàn năm” và các bất định ở mục trên (chưa phân xử được).
    + `triangulation` giữ 7.5: bài song song pv27 là cùng một tầng dự án, không phải đối chiếu độc lập; không có tầng tham khảo tiếng Anh nào. `ambiguity_integrity` giữ 8.6: các bất định `ito`, `vassasataṁ dasa`, `pasannacittā`, `sampatitacchaviṁ`, `Saṁsāramocaka` vẫn còn. Không còn blocker nào được gỡ.
