notes: |-
  Dịch trực tiếp từ Pāli root, 79/79 khoá, đúng thứ tự Pāli. Không có tầng Anh đã ghim cho tha-ap nên không có đối chiếu English độc lập; xem blocking_errors.
  Tiền lệ: dựng chỉ mục Pāli sang Việt trên toàn tầng tha-ap (470 tệp trong kho). 69 khoá của bài có Pāli trùng nguyên văn với bài khác (tổng 4.097 cặp Pāli trùng đã dò, phần lớn là câu công thức 0.1, 15 đến 17, 21); 68 khoá dùng lại NGUYÊN VĂN một bản Việt đã có, 1 khoá khác tiền lệ (0.3, lý do ở dưới). 10 khoá không có tiền lệ nguyên văn: 2.1 và 19.1 đến 23.1 (dòng chốt, tên phẩm, bài tóm lược uddāna, dòng kết bộ). Phần lớn bài (khoá 1 đến 14) trùng với tha-ap20, cũng là ký sự của trưởng lão Raṭṭhapāla; khoá nào Pāli giống thì dùng lại đúng câu Việt của tha-ap20. Chỗ khác nhau giữa hai bài: 2.1 (Setacchattopasobhito là một từ ghép, tha-ap20 viết rời Setacchatto pasobhito, nghĩa như nhau nên giữ cách diễn đạt của tha-ap20), 5.2 (jalajuttamanāmako thay vì jalajuttaranāmako), 6.4 (suṇātha thay vì suṇotha, theo 7 tiền lệ cùng Pāli) và phần 15 đến 17 là các dòng lược công thức, bài này không có tám giải thoát hay sáu thắng trí như tha-ap20. Trong chính bài có 2 nhóm Pāli trùng (10.2 với 11.2; 15.2, 16.2 và 17.2 cùng là dấu lược); cả hai nhóm có bản Việt giống hệt nhau; 0 cặp Pāli trùng mà Việt khác.
  0.1 Therāpadāna: 457/468 tiền lệ giữ nguyên tên Pāli. 0.2 Yasavagga dịch Phẩm Yasa theo 5/6 tiền lệ (tha-ap554, 555, 556, 559, 561; tha-ap557 là Phẩm Danh Vọng).
  0.3 và 19.1: Pāli 0.3 là Raṭṭhapālattheraapadāna, KHÔNG bắt đầu bằng số thứ tự nên không thêm số; translationTitle bằng đúng giá trị 0.3. Khoá khác tiền lệ: tha-ap20 (cùng trưởng lão, Pāli giống) dùng Bài Kệ Tuyên Ngôn Về Trưởng Lão Raṭṭhapāla. Hai phạm vi cho hai đa số khác nhau: toàn tầng khoá 0.3 có Tuyên Ngợ 238, Tuyên Ngôn 116, Ký Sự 100, Tuyên Ngợi 10, Kinh Kệ 5 (Tuyên Ngợ và Tuyên Ngợi là dạng sai chính tả); ở phạm vi gần nhất, cùng Phẩm Yasa (tha-ap554 đến tha-ap561, 6 tệp), Ký Sự 4, Tuyên Ngợ 2, Tuyên Ngôn 0. Bài này theo phạm vi gần nhất, tức Ký Sự Về Trưởng Lão Raṭṭhapāla (đa số đúng chính tả, và apadāna là truyện ký sự); điều này phân kỳ với tha-ap20 và với các lát khác dùng Tuyên Ngôn, nên người biên tập cần phán một lượt cho cả cuốn. 19.1 dùng lại đúng tên 0.3 kèm thứ mười một (ekādasamaṁ = thứ 11), theo khuôn tha-ap561:7.1.
  18.1 công thức lời kết: dùng nhóm nhiều tiền lệ Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này (imā gāthāyo là số nhiều), không dùng dạng số ít đã từng nói bài kệ này.
  Đại từ: người nói ở khung ngoài (nháy kép) là Raṭṭhapāla, dùng tôi (theo tha-ap20); Đức Phật nói ở khung trong (nháy đơn, khoá 6.1 đến 12.4) dùng ta, để người đọc phân biệt hai người nói. Vì vậy công thức 15 đến 17 dùng dạng ngôi tôi thay vì dạng ngôi ta đang chiếm đa số toàn tầng: 15.1 có ta 89, tôi 35 (các biến thể ngôi tôi); 15.3 ta 93, tôi 11 cho dạng không còn lậu hoặc; 16.1 ta 83, tôi 1 cho đúng cụm Thật lành thay sự đến của tôi; 16.3 và 17.3 ta/không đại từ 98, tôi 21. Quyết định này giữ nhất quán trong bài; nếu người biên tập chọn ngôi ta cho cả cuốn thì đổi 5 khoá này (15.1, 15.3, 16.1, 16.3, 17.3).
  Số Pāli: catupaññāsa (3.1, 6.1) = catu 4 + paññāsa 50 = 54, sahassa 1000, nên năm mươi tư ngàn (54.000); aṭṭhārasa (7.1) = 18, mười tám ngàn; paññāsa (8.1) = 50, năm mươi lần; aṭṭhapaññāsa (8.3) = aṭṭha 8 + paññāsa 50 = 58, năm mươi tám lần; kappasatasahassa (9.1) = sata 100 x sahassa 1000 = 100.000, một trăm ngàn kiếp; catasso (17.1) = 4, bốn vô ngại giải; ekādasamaṁ (19.1) = 11, thứ mười một; chapaññāsamo (20.1) = cha 6 + paññāsa 50 = 56, thứ năm mươi sáu; pañcanavuti (22.6) = 5 + 90 = 95, chín mươi lăm. Không có cụm Tiṁsakappasahassa trong bài, nên lưu ý tiṁsa = 30 theo đo tầng không áp dụng ở đây.
  Thuật ngữ đo được (số tiền lệ cùng Pāli): paṭisambhidā catasso, bốn vô ngại giải (455); kataṁ buddhassa sāsanaṁ, đã làm tròn lời dạy của Đức Phật (98 dạng không đại từ, 21 dạng có tôi); sukkamūlena codito, được khích lệ bởi cội nguồn thiện căn (17/23); upasanto nirūpadhi, an tịnh, không còn sanh y (9/9); cakkavattī bhavissati, sẽ làm Chuyển Luân Vương (5/7); mahoghadānaṁ, đại thí như dòng lũ lớn (1/1); saṅghārāmaṁ, tịnh xá của Tăng đoàn (1/1); okkākakulasambhavo, sinh ra trong dòng họ Okkāka (8/8); kheḷapiṇḍeva, như đối với cục nước bọt (1/1).
  BẤT ĐỊNH (không thêm vào thân kinh): (1) 22.5 ekasataṁ: đọc là một trăm vì tổng số bài kệ đếm được từ Pāli của cả Phẩm Yasa (tha-ap553 đến tha-ap563) là 195 = 100 + 95 (khoá kết mỗi bài đứng sau khoá kệ cuối; phép đếm này kiểm lại đúng trên hai phẩm khác: tha-ap473 đến 482 ra 95, tha-ap513 đến 522 ra 83), nhưng ekasata trong tiếng Phạn và Pāli cũng có thể là một trăm lẻ một (tha-ap431 dịch Một trăm lẻ một lần cho Pathabyā rajjaṁ ekasataṁ), khi đó tổng sẽ là 196 và không khớp số đếm; chọn một trăm theo số đếm. (2) 5.2 jalajuttamanāmako: dùng lại đúng cách dịch của 3/3 tiền lệ cùng Pāli (tha-ap58, tha-ap337, tha-ap343) là được gọi là bậc Tối Thượng Tựa Hồng Sen. Chữ Tựa không có trong Pāli (jalaja = sinh ra từ nước, tức hoa sen; uttama = tối thượng); trong bài này đây là biệt hiệu của Đức Phật Padumuttara (tha-ap563:1.1), nhưng ở tha-ap337 cùng Pāli lại dùng cho Đức Vipassī nên biệt hiệu không cố định; chưa sửa vì đây là quy ước 3 khoá và thuộc một lượt rà toàn tầng. (3) 1.1 Padumuttarassa bhagavato dịch Đến Đức Thế Tôn Padumuttara theo 5/5 tiền lệ; giới từ Đến là cách diễn đạt của chuỗi tiền lệ, Pāli là cách sở hữu và cú pháp cả câu là con voi do tôi dâng (1.3) cho Đức Thế Tôn. (4) 4.2 aggapuggalo: dùng bậc tối thượng giữa loài người theo tha-ap20 (cùng bài kệ); 6 tiền lệ khác dịch giữa loài hai chân, rộng hơn chữ Pāli. (5) 1.4 urūḷhavā: dịch thân hình to khỏe theo 1/1 tiền lệ; nghĩa từ nguyên chưa phân xử được. (6) 22.2 gayākimilavajjino là ba tên ghép (Gayā[kassapa], Kimila, Vajjī[putta]); giữ ba tên như trong dòng uddāna, không thêm từ ghi chú vào thân kinh. (7) 22.4 upavāhano: giữ nguyên dạng Pāli của uddāna là Upavāhana, trong khi bài thứ 562 mang tên Upavāna; không tự sửa tên.
  Phép kiểm tự viết, mẫu số ghi kèm: tập khoá Việt bằng tập khoá Pāli 79/79 và đúng thứ tự; dấu nháy kép và nháy đơn khớp Pāli từng khoá 79/79 (Pāli mở nháy kép ở 1.1, đóng ở 17.3; nháy đơn mở ở 6.1, đóng ở 12.4; nháy đơn cố ý chạy qua nhiều khoá); dấu lược …pe… 3/3 khoá giữ đúng một … (15.2, 16.2, 17.2); Pāli không có … trần và không có (…) nên Việt không có; không khoá rỗng; NFC đủ; không chữ số trong thân kinh; không Pāli lọt sang tiếng Việt ngoài tên riêng và nhan đề Therāpadāna. 79 cặp Pāli-Việt đã in ra đọc từng cặp.
  Coverage English: mẫu số 1 khoá có nội dung (18.1); Sujato phủ 0/1; english-project 0; vietnamese-current 0 (tầng này chỉ có Pháp Cú). Với mẫu số nhỏ như vậy cổng coverage hầu như không đo được gì: đây không phải sự đồng thuận về cách dịch mà là việc không có bản Anh nào để đối chiếu.
