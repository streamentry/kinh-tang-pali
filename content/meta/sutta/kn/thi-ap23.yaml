notes: |-
  Dịch trực tiếp từ Pāli root, đủ 147/147 khoá, thứ tự khoá như Pāli; commit đã ghim không có bản Anh cho toàn bộ `thi-ap`. Tiền lệ: thi-ap26 (cùng Phẩm Kuṇḍalakesī), thi-ap33 đến thi-ap38 (liền kề), thi-ap12 đến thi-ap16 và các bài tha-ap có chung công thức.
  Đại từ ngôi thứ nhất dùng ta, theo phạm vi gần nhất: thi-ap26 ta 24/con 4 và thi-ap33 đến thi-ap38 đều nghiêng về ta (6/6 bài); đo lại 2026-10-11 trên 40 tệp thi-ap có đại từ ngôi thứ nhất thì ta là đại từ nhiều nhất ở 17 bài, tôi 13 bài, con 10 bài, nên ta vừa theo phạm vi gần nhất vừa là nhóm đông nhất. Ngôi số nhiều `mayaṁ` ở 18.2 và 18.4 dịch chúng ta, vì người kể xưng ta (thi-ap29 dùng chúng tôi cho nhiều người nói cùng lúc).
  `:0.3` Pāli là `Dhammadinnātherīapadāna` không bắt đầu bằng số nên không giữ số thứ tự; translationTitle bằng đúng `:0.3` và `:39.1` kết bằng thứ ba (Pāli `tatiyaṁ`). `:0.2` `Kuṇḍalakesīvagga` → Phẩm Kuṇḍalakesī theo thi-ap26 (2 khoá). Tên người giữ Pāli (Sujāta, Padumuttara, Kikī, Samaṇī, Samaṇaguttā, Bhikkhunī, Bhikkhudāyikā, Dhammā, Sudhammā, Saṅghadāyikā, Khemā, Uppalavaṇṇā, Paṭācārā, Kuṇḍalā, Gotamī, Visākhā) theo thi-ap26 và thi-ap29.
  Hình thức `Ký Sự` ở `:0.3`/`:39.1`: đo lại 2026-10-11, nhóm thi-ap 40 tệp (kể cả bài này) có `Ký Sự` 37 / `Tuyên Ngôn` 2 / giữ Pāli 1; nhóm tha-ap 563 tệp có `Ký Sự` 418 / `Tuyên Ngôn` 140 / khác 5; không còn tệp nào ghi `Tuyên Ngợ`. Bản Việt này theo `Ký Sự` đúng như hai phạm vi; ghi chú cũ về `Tuyên Ngợ` đã lỗi thời nên được thay bằng số đo này.
  Công thức lời kết `Itthaṁ sudaṁ … abhāsitthāti` dịch nhóm `đã nói những bài kệ này` (số nhiều, khớp `imā gāthāyo`), theo thi-ap26 và nhóm 580 khoá cùng công thức của tầng. Dấu `ti` bỏ ở `Dhammadinnāti` (12.3) theo phe BỎ.
  Dùng lại nguyên văn tiền lệ: đã dò 73 khoá Pāli trùng với các bài kn đã dịch (4.186 cặp khoá); 24 khoá trùng khớp hoàn toàn mọi tiền lệ (chỉ khác dấu câu, hoa thường), phần còn lại khác ở đại từ ta/tôi/con, dấu câu hoặc một biến thể đơn lẻ. Chỗ khác có chủ ý: 11.1 `Satasahassito kappe` ở thì tương lai (lời thọ ký) nên dịch Sau một trăm ngàn kiếp nữa (đo tiền lệ: 32 khoá Vào một trăm ngàn đại kiếp trước, 10 Vào một trăm ngàn kiếp trước đây, 5 Sau một trăm ngàn kiếp nữa; thi-ap26 dùng Vào một trăm ngàn kiếp nữa), không dùng dạng quá khứ vì Pāli nói về điều sẽ xảy ra (`bhavissati`, `hessati`); 36.1 `Svāgataṁ vata me āsi` dịch Thật lành thay sự đến của ta (191 khoá trùng Pāli: 122 ta + 12 tôi so với 24 Thật là đón mừng thù thắng thay cho tôi); 35.3 `viharāmi anāsavā` dịch ta sống không còn lậu hoặc (9 khoá ta + 5 tôi + 3 con so với 6 con sống đời thanh tịnh không còn lậu hoặc).
  Số Pāli: `Ito satasahassamhi` (1.3) = sata 100 × sahassa 1000 = một trăm ngàn kiếp; `Satasahassito kappe` (11.1) cùng cấu tạo = một trăm ngàn kiếp, thì tương lai; `Chaṭṭhā` (17.1) = thứ sáu; `Vīsavassasahassāni` (18.3) = vīsa 20 × sahassa 1000 = hai mươi ngàn năm (thang lớn nhân cả số đã tích lũy: 20 × 1000 = 20.000); `satta dhītaro` (20.4) = bảy người con gái; `sattamī` (21.4, 22.4) = thứ bảy (danh sách 21.1 đến 21.4 đủ 7 tên: Samaṇī, Samaṇaguttā, Bhikkhunī, Bhikkhudāyikā, Dhammā, Sudhammā, Saṅghadāyikā; danh sách 22.1 đến 22.4 đủ 7 tên: Khemā, Uppalavaṇṇā, Paṭācārā, Kuṇḍalā, Gotamī, chính ta, Visākhā); `tāvatiṁsa` (14.4, 23.4) là tên cõi trời Ba mươi ba (tầng đã dịch Ba mươi ba ở 23 khoá trùng Pāli; không phải số `tiṁsa` đứng riêng); `Paṭisambhidā catasso` (37.1) = bốn; `tatiyaṁ` (19.1, 39.1) = thứ ba. Cụm `Tiṁsakappasahassa` không có trong bài này.
  Ghi nhận bất định: 6.1 `ayyako` — nghĩa gốc là ông nội/bậc tôn trưởng, đồng thời có nghĩa chủ/người đứng đầu; ngữ cảnh (2.3 nói tác giả là người làm công, 6.2 nói vị ấy nhận bà làm con dâu của mình) hợp với người chủ nhà nên dịch ông chủ, 0 tiền lệ chính xác trong tầng cho dạng `me ayyako`; 6.2 `suṇisaṁ sakaṁ` dịch con dâu của chính ông. 9.2 `ghananinnādasussaro` — `ghana` có thể là mây dày hoặc dày đặc, vang; dịch có giọng hay, vang rền như tiếng mây, chữ như mây là chọn của người dịch, 0 tiền lệ trong tầng. 9.4 `sasaṅghaparivesike` — `parivesika` là người dọn/phục vụ thức ăn, 0 tiền lệ; dịch người dọn thức ăn cho ta cùng Tăng đoàn. 9.3 `Mamupaṭṭhānanirate` — `mama` là Đức Phật nói về chính Ngài, dịch ta; trùng chữ với ta của người kể nhưng ngữ cảnh phân biệt được vì cả đoạn trong dấu nháy đơn là lời Đức Phật. 17.1 `tassa` — chỉ vua Kikī ở 16.3 (khoá 16.2 liền trước nêu `narissaro`), dịch vị ấy theo Pāli, không đổi thành vua vì Pāli không lặp tên. 20.1 `Komāribrahmacariyaṁ` — 0 tiền lệ; dịch Phạm hạnh của thiếu nữ, tân ngữ của động từ ở 18.4. 25.1 `rūpaguṇūpetā` — `guṇa` có thể là phẩm chất hoặc đức hạnh, dịch đầy đủ dung sắc và phẩm chất. 26.1 đến 26.4 — chủ ngữ `sāmiko me subuddhimā` nằm ở khoá cuối, giữ thứ tự Pāli. 27.1 `anujānetvā` — dạng sai khiến, dịch sau khi được cho phép; Pāli không nêu ai cho phép (hợp với chồng ở 26.4 nhưng không nêu). 29.3 `Bhikkhuniṁ dhammakathikaṁ` — đối cách, dịch Vị tỳ-kheo-ni thuyết pháp, ta không thấy vị nào khác như vậy; không chuyển thành so sánh. 30.1 `dhīrā` dịch bậc trí (nhiều nghĩa: kiên định, thông tuệ). 30.3 `paṇḍitā` dịch bậc hiền trí. 34.4 `sunimmalā` — 0 tiền lệ ở dạng này, dịch hoàn toàn không cấu uế. 7.1 đến 7.3 — chủ ngữ `so` ở 7.1 là Đức Phật (Padumuttara), `Ṭhapesi` ở 7.3 chung chủ ngữ ấy.
  Dấu câu: nháy kép `“”` mở ở 1.1 và đóng ở 37.3; nháy đơn `‘’` mở ở 9.3 và đóng ở 12.4 (lời Đức Phật), mở ở 29.3 và đóng ở 30.2 (lời Đức Phật nói về Dhammadinnā), đúng như Pāli, khớp từng khoá (không khoá nào tự cân). `…pe…` ở 35.2, 36.2, 37.2 → đúng một `…`; Pāli không có `(…)` trần ở khoá nào nên bản Việt cũng không có.
  Tự kiểm: tập khoá Việt = tập khoá Pāli (147/147, cùng thứ tự); 0 khoá lệch nháy đơn/kép; NFC, 0 khoá rỗng, 0 khoảng trắng thừa; 0 chữ Pāli lọt sang thân kinh ngoài tên riêng. Cặp Pāli trùng nguyên văn trong bài: 14.2=23.2, 14.3=23.3, 14.4=23.4 và ba khoá `…pe…` 35.2=36.2=37.2 (6 cặp), bản Việt giống nhau ở cả 6 cặp; riêng 31.2, 36.3, 37.3 chỉ trùng chữ (khác dấu kết khoá) và bản Việt cũng chỉ khác dấu kết khoá.
  Bản Việt mới dịch xong, chưa có lượt review đối kháng riêng ngoài các phép tự kiểm. technical_integrity 9.6 vì lát này không chạy gate (brief cấm). Bốn lệnh gate do coordinator chạy trước khi xuất bản: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
  Lượt cải thiện 2026-10-11: đọc đối kháng lại cả 147 khoá theo cặp Pāli và Việt, đo tiền lệ bằng số đếm trên 2.324 tệp kn (6.789 cặp khoá trùng Pāli, 88 khoá có nội dung trùng; sau khi bỏ khoá `…pe…` và khối `:0` còn 3.405 cặp, 562 cặp khác chữ, phần lớn chỉ khác đại từ hoặc dấu câu). Không tìm thấy lỗi sai nghĩa, sai chủ thể, sai phủ định hay sai số lượng; đã chạy lại phép số Pāli (một trăm ngàn kiếp, hai mươi ngàn năm, thứ sáu, bảy người, thứ bảy, Ba mươi ba, bốn) và đều đúng. Đổi 5 khoá. 3.3 `Vihārā abhinikkhamma`: bỏ `đi ra ngoài` vì lặp ý với `rời khỏi` (một động từ Pāli; tiền lệ tha-ap114 là `Rời khỏi tịnh xá`, tha-ap64 giữ cụm dài, 1 so với 1). 10.2 `guṇavaddhitamānase`: `được nuôi dưỡng bằng` thành `được tăng trưởng nhờ`, vì `vaḍḍhita` là phân từ của tăng trưởng (tầng dịch `pavaḍḍhitaṁ` là tăng trưởng; nuôi dưỡng dành cho `saṁvaddhito` về thân). 32.3 và 32.4 `So me attho anuppatto, sabbasaṁyojanakkhayo`: theo phạm vi gần nhất thi-ap, 5 trên 6 tệp ghi `đã đạt được,` rồi `là sự đoạn tận mọi kiết sử.` (thi-ap17, 19, 20, 21, 22, 24; chỉ thi-ap17 dùng dấu hai chấm); bản này trước dùng hai chấm và bỏ `là`, nay đổi dấu hai chấm thành dấu phẩy (khớp dấu phẩy của Pāli) và thêm `là`. 33.4 `satthusāsanakārikā`: thêm `là người` vì `kārikā` là danh từ chỉ người làm (nữ); phạm vi gần nhất thi-ap18, 20, 21, 22 đều ghi `là người làm theo lời dạy của bậc Đạo Sư` (thi-ap24 bỏ `là`). Điểm đổi: terminology 8.8 thành 8.9 (ba chỗ thuật ngữ đưa về tiền lệ gần nhất), vietnamese_clarity 9.0 thành 9.1 (bỏ lặp ý ở 3.3, câu 33.4 rõ chủ ngữ). Các tiêu chí khác giữ nguyên vì chưa có cải thiện tương ứng. final_score 8.98 thành 9.00.
  Đã đo và quyết định KHÔNG đổi dù nghi ngờ: 11.4 `satthā loke bhavissati` dịch `bậc Thầy` trong khi 12.4, 31.1, 33.4 dịch `bậc Đạo Sư` cho cùng từ gốc; công thức này ở thi-ap 10 trên 10 tệp và tha-ap 44 trên 48 tệp ghi `bậc Thầy`, trong khi toàn tầng đo `Đạo Sư` 197 / `Thầy` 119, nên giữ theo công thức gần nhất và ghi lại chỗ lệch nội bộ này. 11.3 `Gotamo nāma gottena` `theo dòng ấy`: `gotta` là họ chứ không phải dòng Okkāka ở 11.2, nhưng thi-ap và toàn tầng ghi `theo dòng ấy` 56 trên 58 nên giữ; 15.3 (Kassapa) ghi `theo dòng họ` (18 trên 20) là hai công thức khác nhau. 14.2 và 23.2 `cetanāpaṇidhīhi` `tâm nguyện và chí hướng` (74 trên 79 khoá): hai danh từ Pāli là `cetanā` (tác ý, ý định) và `paṇidhi` (nguyện), cách dịch này không phân biệt rõ hai khái niệm; đây là vấn đề thuật ngữ cả tầng, không sửa riêng một bài, người biên tập nên phán một lượt. `guṇa` dịch khác nhau trong bài (10.2 đức hạnh, 25.1 phẩm chất, 29.1 phẩm đức) vì đo toàn tầng có `đức hạnh` 52 / `đức tính` 33 / `phẩm đức` 26 / `phẩm chất` 10 và nghĩa thay đổi theo ngữ cảnh (dung sắc và phẩm chất khác với phẩm đức được Đức Phật hài lòng), nên không ép về một từ. 6.4 `sambuddhaṁ` `bậc Chánh Giác` theo `Abhivādiya sambuddhaṁ` (3 khoá `bậc Chánh Giác`), trong khi công thức `Sambuddhaṁ abhivādetvā` ghi `Chánh Đẳng Giác` (16 khoá); hai công thức khác nhau nên giữ.
  Bất định đã có thêm căn cứ nhưng chưa dứt: 9.4 `parivesike` (toàn Pāli root chỉ có một lần ở đây): động từ gốc `parivisati`/`parivisi` có ở dn16:4.18 (dọn món ăn cho Đức Thế Tôn và Tăng đoàn), mn55:6.6 và an7.53:3.8 (dọn thức ăn cho Tăng), và danh từ `parivesanā` ở sn7.11:2.1 (chỗ phân phát thức ăn), nên `người dọn thức ăn` có căn cứ từ cùng gốc; bản Việt nguyên bài ở mục Tra cứu toàn văn cũng đọc là người dâng vật thực (chỉ để hiểu cách đọc, không chép chữ). 6.1 `ayyako`: bản nguyên bài đọc là người chủ, khớp ngữ cảnh người làm công (2.3) và mẹ chồng (6.3), nhưng nghĩa từ vựng thông thường của `ayyaka` trong tầng là ông nội/ông (ja, mil) nên vẫn không phân xử được bằng Pāli một mình; giữ `ông chủ`. 9.2 `ghananinnāda`: toàn Pāli root chỉ có một lần; `ghana` ở nơi khác là dày, đặc (ghanapathavī, ghanasaññā) hoặc mây dày (abbhaghana), `ninnāda` là tiếng vang (mn91:21.4 `ninnādī` ghi là vang xa), và `gajagajjitasussaro` (tha-ap540:12.2, ghi là giọng hay như tiếng voi rống) là so sánh cùng khuôn; bản nguyên bài đọc `ghana` là đều đặn, dày chứ không phải mây, nên chữ `như tiếng mây` là một trong hai cách đọc có thể, không phải kết luận. 27.1 `anujānetvā`: toàn tầng không có dạng này ở chỗ khác; bản nguyên bài đọc là đã thuyết phục được (người cho phép), còn bản này giữ `sau khi được cho phép`, cùng chỉ ra việc nhận được sự đồng ý và không nêu ai cho phép.
