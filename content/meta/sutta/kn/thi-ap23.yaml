  **Đối chiếu độc lập 2026-10-14** với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2008, theo ấn bản Buddha Jayanthi). Đã so từng khoá trong 147 khoá. 2 khoá bất đồng nghĩa → sửa 0, giữ 2, bất định 0. Giữ `:21.2` và `:21.4` (`bhikkhudāyikā`, `saṅghadāyikā`): bản nguyên bài ghi tên có `-dāsikā`; Pāli đã ghim là `dāyikā` (người dâng), bản này theo Pāli. Các khoá còn lại cùng nghĩa với bản nguyên bài, kể cả những chỗ dễ sai: `Ito satasahassamhi` = 100.000 kiếp (`:1.3`, `:11.1`), `vīsavassasahassāni` = 20.000 năm (`:18.3`), hai danh sách bảy người ở `:21` và `:22` (đếm đủ bảy), `anujānetvā` ở `:27.1` (cả hai cùng hiểu là có sự đồng ý để xuất gia), `sāmiko me` ở `:26.4` là chồng của nhân vật, `bhavanetti` ở `:31.4`. Bản nguyên bài không có đoạn ứng với `:15.1`–`:15.4` (kiếp Kassapa) và viết đủ các đoạn `…pe…`, nên những chỗ đó không đối chiếu được; không tính là bất đồng. Không tìm ra khoá nào bản dự án sai về nghĩa nên không sửa khoá nào. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

