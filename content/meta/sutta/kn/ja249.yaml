notes: |-
  Bản này chỉ có **một** tầng tham khảo: Pāli root đã ghim. **Không có Anh Sujato** —
  tại commit đã ghim thư mục `translation/en/sujato/sutta/kn/ja/` có **83** tệp
  (ja1–ja79, ja126, ja159, ja466, ja534) và **không** có tệp nào cho 14 uid của lát này.
  Đây là đặc điểm của bản chụp upstream, không phải thiếu sót của kho. Tầng Việt hiện
  hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên Jātaka
  không có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` chỉ
  8,0–8,4: dịch từ Pāli, phân xử cú pháp bằng **Pāli trùng nguyên văn ở bài khác** (sn3.15,
  sn21.6, ja202, thag2.38, vv33) và bằng chú giải Jātaka khi Pāli gốc im lặng.
  **Cổng kỹ thuật chưa chạy.** Đợt này cấm `npm run validate|test|check|build`, nên tôi
  **không** thể tuyên bố technical gate pass; `technical_integrity` hạ còn 9,8 và bốn
  lệnh đó để người điều phối chạy.
  **13 khoá, đủ cả bài** (`:0.1`–`:0.4` tiêu đề, `:1.1`–`:2.4` kệ, `:3.1` dòng kết).
  `kiểm()` của `_hvi.py` chỉ quét khoá Pāli **≥ 40 ký tự**, mà lát này **không có khoá nào**
  rơi vào tập đó — nên tôi tự kiểm riêng **mọi** khoá: phủ đủ 13/13, không rỗng, NFC,
  không trùng nguyên văn Pāli, dấu lược khớp từng khoá, ngoặc kép cân trên cả bài, dấu
  câu cuối câu kệ khớp Pāli, không còn `(…)`. Pāli lát này **không có** `…pe…` nên hai
  phía đều 0 dấu lược.
  **Tiền lệ dùng lại, đếm được trên tầng Việt:** `:0.1` `Jātaka` giữ nguyên (171 tệp
  Jātaka); `:0.2` `Dukanipāta` → *Bộ Một Bài Kinh* (237 tệp); `:0.3` `…vagga` → *Phẩm
  <tên>*, theo khuôn `Phẩm Haṁci` (ja117:0.3) và `Phẩm Bīraṇathambha` (ja211:0.3);
  dòng kết `<Tên>jātakaṁ <số>ṁ` → *Kinh <Tên> thứ <tư>*, theo `ja22:2.1` (*Kinh Chó Săn
  thứ hai.*).
  **Đa nghĩa đã phân xử, và kết quả ngược với dự đoán ban đầu.** `sālaka` trong kinh văn
  thường là *loài chim sừng nhỏ* (`sālakāva`), nhưng ở đây `Oroha dumasmā sālaka` là
  **cách xưng hô**: Rouse dẫn chú giải rằng `sālaka` nghĩa gốc là *anh rể*, và ở Jātaka này
  dùng làm lời gọi thân mật miệt thị. Tôi vì thế giữ tên riêu **Sālaka** trong cả tiêu
  đề lẫn thân bài, **không** dịch là *chim sừng nhỏ* — dịch theo nghĩa loài ở đây là bịa.
  **`Pakkhambavane` đã giải được bằng chú giải, không phải suy đoán.** Chữ này không có
  trong từ vựng Pāli đã ghim (0 lần) và bản Rouse dịch *we enjoy this ripe mango wood*
  là đọc sai. Chú giải Jātaka giải thích câu này là `imaṃ m-asmiṃ vane pakkambavane
  ramāmase` — tức **rừng tên Pakkhambavana**, `vane` (= *rừng*) đã bị lẫn vào, và
  `ramāmase` = *mong có sự vui*. Tôi dịch đúng vậy: *Ở rừng Pakkhambavana, ta cũng sẽ có
  sự vui*. Trước đó tôi đã đọc `ramāmase` là *sẽ có sự vui ở đời sau* (theo `sn5.4:2.4`
  `ehayyebhiramāmase` và `thig6.3:1.4` `ehi kheme ramāmase`) — **đã bỏ**, vì nó thêm một
  niềm kiếp mà `Pakkhambavane` không đòi.
  **Còn một điểm ngoặc kép.** `Nanu maṁ suhadayoti maññasi` theo mặt chữ là *Chẳng phải
  ngươi cho rằng ta có lòng tốt với ngươi sao*, nhưng chú giải nói đây là câu mỉa, ý là
  *ngươi tưởng ta có lòng tốt với ngươi lắm sao*. Tôi giữ mặt chữ, vì đó là những chữ
  Pāli nói, và ghi nghĩa mỉa ở đây thay vì viết vào thân kinh.
  `veḷuyaṭṭhiyā` = *gân lá cây veḷuya* (tên loài cây, giữ nguyên vì không có bản Việt
  nào); `gharakaṁ` ở `1.4` và `2.4` là cùng một chữ nhưng trỏ hai nơi khác nhau (nhà
  người mời / nhà người kia), nên tôi không gán chủ sở hữu nào cho nó.
