  Bảo toàn niêm luật kệ ngôn / cấu trúc văn xuôi, danh từ riêng giữ nguyên ký tự Pāli có dấu phụ.
  Toàn bộ 27 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.

  Sửa lan 2026-10-13: khoá `ja310:1.4` (`evaṁ seyya vijānahi`): *hãy thấu triệt điều tối thắng ấy* → *hãy biết như vậy, này Seyya*. Căn cứ: `seyya` ở đây là hô ngữ, tên riêng Seyya (tên bài `Seyyajātaka`, `0.4` đã dịch *Seyya*), không phải `seyya` = *tốt hơn*; Pāli trùng nguyên văn `ja433:2.4`, bản đã dịch *hãy biết như vậy, này Seyya.* — dùng lại. Cùng kệ, Pāli `ja310:1.1`–`1.2` (`Sasamuddapariyāyaṁ, mahiṁ sāgarakuṇḍalaṁ`) trùng nguyên văn `ja433:2.1`–`2.2` nhưng bản Việt khác (*Dẫu được cõi đất bao la này, được đại dương bao bọc quanh mình* so với *Dẫu cả cõi đất trải đến tận biển, được đại dương bao quanh*); đã dùng lại nguyên văn `ja433`. `1.3` (`Na icche saha nindāya`) vốn đã trùng. Bốn dòng `3.1`–`3.2` / `4.1`–`4.2` Pāli trùng trong chính bài, bản Việt giống nhau (2/2 cặp).
