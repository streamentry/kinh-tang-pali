  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda (bản đó là văn xuôi diễn giải, đối chiếu ở mức đoạn tương ứng từng khổ kệ, không phải mức khoá; không có bản Anh). 6 điểm bất đồng nghĩa → sửa 0, giữ 3, bất định 3. Giữ: (1.4) `māḷake` giữ *gian sảnh* (bản nguyên bài viết *khu vực bùng binh*, không có căn cứ trong Pāli, `māḷaka` là gian/lầu mở); (5.3) `khīṇāsavasahassehi` giữ *hàng nghìn vị* theo dạng số nhiều của Pāli, bản nguyên bài viết *một ngàn*; (15.1) `araññavanamoggayha` giữ *rừng hoang* (một cụm `arañña-vana`), bản nguyên bài tách thành vườn cây, rừng thưa, rừng rậm. Bất định: (10.1) `aṭṭhannaṁ payirūpāsataṁ` hapax, bản dự án hiểu *tám vị đang hầu cận*, bản nguyên bài hiểu *tám hạng Thánh nhân*, Pāli chỉ có số `aṭṭha` nên chưa phân xử được; (14.3) `pathabyā rajjaṁ pañcasataṁ` bản dự án hiểu *năm trăm lần làm vua*, bản nguyên bài hiểu *năm trăm quốc độ*, giữ như hai khoá cùng công thức trong tầng; (10.4) `saraṇaṁ taṁ upemahaṁ` là lời quy y nói thẳng với Đức Phật trong lời kể của Trưởng lão, giữ *tôi* theo quy ước kể chuyện của phẩm, bản nguyên bài dùng *con*; nếu người biên tập muốn áp quy ước lời quy y thì đổi cả ngôi. Nhận xét ngoài đối chiếu: tiêu đề `:0.3`/`:19.1` dùng *Bài Kệ Tuyên Ngôn* (khoảng 138 tệp của phẩm tha-ap) trong khi *Ký Sự* chiếm khoảng 422, bản nguyên bài cũng dùng *Ký Sự*; không đổi trong lượt này vì tiêu đề là quyết định theo cả tầng. Đối chiếu đã làm ở bài này; technical gate (`npm run validate`, `npm test`, `npm run check`, `npm run build`) do người điều phối chạy.

