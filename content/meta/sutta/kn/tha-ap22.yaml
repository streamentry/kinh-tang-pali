notes: |-
  Bài này. `tha-ap22` · phẩm `Sīhāsaniyavagga` (`Phẩm Sīhāsaniya`) · bài thứ mười và cuối phẩm ·
  Trưởng lão Sumaṅgala · 83 khoá Pāli: tiêu đề `:0.1`–`:0.3`, 17 kệ `:1.1`–`:17.4`, câu kết `:18.1`,
  câu chốt `:19.1`, và phần kết phẩm `:20.1`–`:23.1` (câu dẫn uddāna, hai kệ uddāna, dòng đóng phẩm).
  Tệp dịch có đủ 83/83 khoá, thứ tự khoá đúng thứ tự Pāli. Tên vị trưởng lão được xác nhận ba lần
  trong chính Pāli: `sumaṅgalo thero` (`:18.1`), `<Tên>theraapadāna` (`:0.3`), `Sumaṅgalattherassāpadānaṁ`
  (`:19.1`); uddāna `:22.1` ghi `maṅgalo`.

  NỘI DUNG (đã đọc Pāli, không suy từ khuôn chung). Sumaṅgala kể lại một kiếp trước thời Đức Piyadassī. Ông
  chuẩn bị thức ăn để dâng lễ hiến cúng, đang chờ các bà-la-môn trong một gian sảnh rộng thì thấy Đức Phật
  đi trên đường (`:1`–`:3`). Ông chắp tay, chỉ bằng ý mà thỉnh mời, và Đức Phật biết ý ấy, đến cửa nhà ông cùng
  hàng nghìn vị đã trừ sạch lậu hoặc (`:4`–`:5`). Ông kính lễ, mời Ngài lên lầu ngồi (`:6`), Ngài lên lầu
  ngồi (`:7`), ông tự tay dâng thức ăn có sẵn trong nhà (`:8`) rồi kính lễ và quy y (`:9`–`:10`). Đức Piyadassī
  nói các bài kệ thọ ký (`:11`–`:14`, nằm trong nháy đơn): hai mươi bảy lần làm vua cõi trời, mười tám lần làm
  Chuyển Luân Vương. `:15`–`:17` là lời nhận của chính Sumaṅgala: đã vào rừng, tinh tấn, thiêu rụi phiền
  não, không biết đến đọa xứ, và có bốn vô ngại giải, tám giải thoát, sáu thắng trí.

  SỐ PĀLI, TỰ TÍNH. `Sattavīsatikkhattuṁ` (`:13.1`) = satta 7 + vīsati 20 = 27 lần → hai mươi bảy.
  `Dasa aṭṭha cakkhattuṁ` (`:14.1`) = dasa 10 + aṭṭha 8 = 18 lần → mười tám (cùng Pāli ở tha-ap36:6.1 viết
  `Mười tám lần`). `pañcasataṁ` (`:14.3`) = pañca 5 × sata 100 = 500 → năm trăm. `Aṭṭhārase kappasate`
  (`:16.1`) = aṭṭhārasa 18 × sata 100 = 1.800 kiếp → một ngàn tám trăm (đúng nhóm tiền lệ cùng Pāli: 10 khoá
  `Vào một ngàn tám trăm kiếp trước,`). `Aṭṭhannaṁ` (`:10.1`) = 8. `catasso` (`:17.1`) = 4, `aṭṭhime`
  (`:17.2`) = 8, `chaḷabhiññā` (`:17.3`) = 6. Uddāna `Satañca aṭṭhatiṁsa ca` (`:22.3`) = sata 100 +
  aṭṭhatiṁsa (aṭṭha 8 + tiṁsa 30) = 138 → một trăm ba mươi tám.
  BẤT ĐỊNH VỀ SỐ, GHI RÕ. Giá trị `tiṁsa` = 30 được lấy từ phép đo trên tầng chứ không có tầng Anh độc lập nào
  để đối chiếu: `aṭṭhatiṁsa` = ba mươi tám ở tha-ap109:10.2 và tha-ap187:5.2, `gāthā tiṁsa ca aṭṭha ca` = ba
  mươi tám ở tha-ap242:8.6, và `tiṁsakappasate` = ba mươi kiếp ở tha-ap139:7.1. Phép tính 138 chắc theo
  Pāli của chính dòng này, nhưng KHÔNG khớp số kệ đếm được trong mười bài của phẩm: tôi đếm số kệ bốn dòng của
  tha-ap13 đến tha-ap22 là 12 + 14 + 8 + 20 + 13 + 18 + 11 + 15 + 12 + 17 = 140 (lệch 2). Tôi dịch đúng con số mà
  uddāna nêu và không sửa nó theo số đếm; người biên tập cần biết đây là con số truyền thống của chính
  Pāli, không phải số tôi đếm lại. Cụm `Tiṁsakappasahassa…` (chưa phân xử được trong tầng) KHÔNG xuất hiện trong bài này.

  TIÊU ĐỀ `:0.3`. Pāli `Sumaṅgalattheraapadāna` không bắt đầu bằng số nên `:0.3` không có số thứ
  tự; `translationTitle` trong tệp này BẰNG ĐÚNG giá trị `:0.3`. Khuôn `Bài Kệ Tuyên … Về Trưởng Lão <tên>`.
  Đo `:0.3` của các tệp `tha-ap` khác (đã đọc tệp, không suy): toàn tầng `Tuyên Ngợ` 240 · `Tuyên Ngôn` 118 ·
  `Tuyên Ngợi` 10 · `Ký Sự` 101 · `Kinh Kệ` 5. Trong chính phẩm Sīhāsaniya (tha-ap13–21): `Tuyên Ngôn` 5 (13, 14,
  15, 18, 20) · `Tuyên Ngợ` 3 (17, 19, 21). Ở phạm vi tha-ap1–45: `Tuyên Ngôn` 16 · `Tuyên Ngợ` 10 ·
  `Tuyên Ngợi` 2. Hai phạm vi cho hai đa số khác nhau (toàn tầng nghiêng về `Ngợ`, phạm vi gần nghiêng về
  `Ngôn`). `Ngợ` và `Ngợi` là dạng sai chính tả; tôi chọn `Tuyên Ngôn` (đa số ở phạm vi gần và đúng chính tả)
  và KHÔNG tự quyết thay người biên tập: cần một lượt phán chung cho cả cuốn. Câu chốt `:19.1` theo đúng khuôn
  của tha-ap20 và tha-ap62: `…, thứ mười.` (Pāli `dasamaṁ`). `:0.1` `Therāpadāna` giữ nguyên văn (468
  khoá cùng Pāli, trong đó 457 giữ nguyên văn). `:0.2` `Phẩm Sīhāsaniya` (7 khoá cùng Pāli, kể cả tha-ap15, tha-ap20, tha-ap21).
  `:23.1` theo khuôn `Phẩm X là phẩm thứ N` (tha-ap32:11.1, tha-ap62:18.1). `:20.1` `Tassuddānaṁ` →
  `Tóm tắt phẩm này:` (32 khoá so với `Tóm lược:` 9 và `Tóm lược phẩm ấy:` 2).

  TIỀN LỆ, ĐO ĐƯỢC. Trong tầng Việt dự án (loại chính bài này), 37/83 khoá của bài có Pāli trùng nguyên văn
  với khoá ở nơi khác, tổng 1.874 cặp Pāli trùng (phần lớn là các khoá khuôn: `:0.1` 468 cặp, `:17.1`
  482 cặp, `:16.3` 405 cặp). 30 khoá dùng lại nguyên văn một bản đã có (`:0.1` `:0.2` `:2.1` `:4.1` `:4.2` `:5.1`
  `:5.2` `:6.2` `:8.2` `:8.4` `:9.1` `:9.2` `:11.2`–`:11.4` `:12.4` `:13.2`–`:13.4` `:14.2` `:14.3` `:16.1`–`:16.3`
  `:17.1`–`:17.4` `:18.1` `:20.1`). 7 khoá có Pāli trùng nhưng bản Việt của tôi khác mọi tiền lệ, mỗi chỗ đều có lý do:
  `:0.3` (xem trên); `:5.3` chỉ khác chữ hoa đầu dòng (`Cùng`) theo nhịp Pāli viết hoa ở dòng ba của kệ;
  `:6.1` `Namo te purisājañña` (xem Thuật ngữ); `:8.1` và `:8.3` (tha-ap128:6.1 viết `Phần thứ có trong nhà ta,
  thuộc quyền ta` và tha-ap128:6.3 viết `Tôi đặt những đóa hoa ấy dưới chân Đức Phật`, trong khi Pāli là
  `Yaṁ me atthi sake gehe` / `Tāhaṁ buddhassa pādāsiṁ` mang nghĩa `Vật gì có trong chính nhà tôi` và `Tôi đã
  dâng vật ấy lên Đức Phật`; bài ấy dâng hoa, bài này dâng thức ăn, nên không thể lấy chữ `hoa` sang đây;
  tha-ap260:2.3 thì lệch dòng); `:9.3` (tiền lệ `Con xin lễ Đức Phật tối thượng,` là ngôi `con`, trong khi cả bài
  này dùng `tôi`); `:9.4` (tiền lệ tha-ap198:4.4 viết `Đức Phật hiền hòa dễ gần`, nhưng `uḷārata` là sự cao
  quý, giống `uḷāratarā` = `cao quý hơn` ở ja435:1.4). Pāli trùng ngay TRONG chính bài: 1 nhóm
  (`:6.3` = `:7.3`, `Pāsādaṁ abhirūhitvā,`) và bản Việt hai khoá giống nhau (`Sau khi lên lầu,`); không có
  nhóm trùng nào mà Việt khác. Câu kết `:18.1` giữ dạng `đã nói những bài kệ này` (số nhiều, nhóm 407
  khoá) vì `imā gāthāyo` là số nhiều; không dùng nhóm 21 khoá `đã từng nói bài kệ này`.

  THUẬT NGỮ, KÈM SỐ ĐẾM. `Duggatiṁ nābhijānāmi` (`:16.3`): ba dạng trong tầng là `Ta không biết mình rơi vào
  khổ đau,` 137 khoá · `Tôi không còn biết đến đọa xứ nào,` 88 · `Ta không còn biết đến đọa xứ,` 51; tôi chọn dạng
  88 vì giữ `duggati` = đọa xứ (dạng 137 làm mất `duggati`) và đúng ngôi `tôi` của bài, giống tha-ap21:10.3.
  `Mama saṅkappamaññāya` (`:5.1`): `Nhờ thấu rõ ý định của tôi,` 10 khoá, `của ta` 12 khoá; chọn `tôi` theo ngôi bài
  (cùng Pāli ở tha-ap199:3.1). `purisājañña` (`:6.1`): 6 khoá cùng Pāli, `bậc hiểu biết người đời` 3 (tha-ap114,
  tha-ap130, tha-ap135), `bậc tuấn mã` 2 (snp3.6:48.1, thag12.2:10.1), còn lại tha-ap253 `bậc giống người thuần
  thục` và tha-ap318 `bậc tối thắng giữa loài người`. `ājañña` là giống thuần chủng (ngựa quý); `hiểu biết người
  đời` là nghĩa của `lokavidū`, không phải của `purisājañña`, nên tôi dùng `bậc tuấn mã giữa loài người` như
  thag12.2:10.1. `pāsāda` → `lầu` (tầng: lầu 6 · lâu đài 4 · cung điện 3); sibling tha-ap20 chọn `cung điện`
  cho 54.000 cung điện, còn đây là tầng lầu trong nhà của một gia chủ nên giữ `lầu`. `māḷaka` (`:1.4`) → `gian
  sảnh`, theo tha-ap14:2.2 và tha-ap14:4.3 (cùng nhóm `māḷa`, 2 khoá). `saṅgha` (`:12.1`) → `Tăng đoàn`
  (toàn tầng `Tăng chúng` 12 · `Tăng đoàn` 10; trong phẩm tha-ap13–21 chỉ `Tăng đoàn` 3/3). `Bhikkhusaṅghe nisīditvā`
  (`:11.3`) → `Ngồi xuống giữa hội chúng các tỳ-kheo,` (5 khoá cùng Pāli so với `Ngồi giữa Tăng đoàn tỳ-kheo,` 3).
  `lokajeṭṭho narāsabho` (`:11.2`) → `bậc Trưởng Thượng thế gian, đấng Nhân Ngưu` (21 khoá).
  `khīṇāsava` → `đã trừ sạch lậu hoặc` (2 khoá cùng Pāli ở tha-ap199:3.3 và tha-ap246:1.1). `sayambhuṁ aggapuggalaṁ`
  (`:2.4`) → `bậc Tự Tại, bậc tối thượng giữa loài người` (theo tha-ap33:1.2). `mahāmuni` → `Đại Mâu-ni`
  (32 khoá so với `Đại Muni` 9, `Đại Ẩn Sĩ` 6, `đại hiền` 3). `kappasate` → `ngàn` (17 khoá cùng Pāli đều viết `ngàn`, 0 khoá viết `nghìn`). Tên trong uddāna (`:21`–`:22`) giữ dạng
  Pāli như các uddāna của tầng (tha-ap32:9, tha-ap252:9, tha-ap302:8): `Sīhāsanī, Ekathambhī` giữ nguyên
  chính tả Pāli của dòng này (khác `Ekatthambhika` ở nhan đề tha-ap14); `Nanda và Cūḷapanthaka`, `Pilinda và
  Rāhula`, `Vaṅganta, Raṭṭhapālaka`, `Sopāka và Maṅgala`.

  BẤT ĐỊNH, GHI RÕ VÀ KHÔNG ĐƯA VÀO THÂN KINH. (1) `Aṭṭhannaṁ payirūpāsataṁ` (`:10.1`): hapax trong tầng,
  không dòng cùng Pāli nào để đối chiếu. Cách đọc duy nhất ngữ pháp tự nhiên là genitive absolute
  (`khi tám vị đang hầu cận`) rồi `bhuñjaṁ khīṇāsavā bahū` là vế chính (`nhiều bậc đã trừ sạch lậu hoặc
  dùng bữa`), và `Tuyheveso ānubhāvo` (`:10.3`) là lời nhận rằng đây là oai lực của Ngài, tức một điều kỳ diệu
  về số lượng người thọ thực. Nhưng Pāli không nói tám vị là ai (có thể chỉ tám người hầu bàn, tám bà-la-môn
  `:1.3`, hoặc cách dùng số khác); tôi KHÔNG thêm nội dung giải thích vào thân kinh và dịch sát: `Khi tám vị đang
  hầu cận`. `bhuñjaṁ` được hiểu như dạng ngôi ba số nhiều (nhiều vị đã dùng bữa); cũng không loại hẳn
  cách đọc phân từ. Đây là chỗ có thể đổi nghĩa câu, cần người biên tập kiểm.
  (2) `sīhāsane nisīdataṁ` (`:6.4`): `nisīdataṁ` không có dòng cùng Pāli nào trong tầng. Tôi đọc là mệnh lệnh
  tôn kính (`xin Ngài ngồi`), vì đối lập với `nisīdi pavarāsane` (`:7.4`, thì quá khứ: Ngài đã ngồi) ngay sau
  đó và vì `:6` là lời mời trực tiếp (`Namo te`). Nếu hiểu `nisīdataṁ` là phân từ thuộc cách sở hữu số nhiều thì
  câu sẽ không còn chủ từ; tôi cho cách đọc mệnh lệnh là hợp lý hơn nhưng không có nguồn độc lập.
  (3) `Āhutiṁ yiṭṭhukāmohaṁ` (`:1.1`): `āhuti` là lễ vật/lễ hiến; tầng có các cách dịch `lễ tế hiến`, `lễ hiến cúng`,
  `lễ vật`; tôi viết `dâng lễ hiến cúng`. Pāli không nói đây là lễ lửa hay lễ cúng thức ăn cho bà-la-môn.
  (4) `Tāhaṁ buddhassa pādāsiṁ` (`:8.3`): `tāhaṁ` = `taṁ ahaṁ`; tôi hiểu `taṁ` chỉ `āmisaṁ` (vật thực) của `:8.2`.
  (5) `Aṭṭhārase kappasate` (`:16.1`) là cách nói thời gian đã đo trên tầng 17 khoá cùng Pāli (15 khoá `Vào/Từ một ngàn tám trăm kiếp trước`); giữ `Vào … trước` theo
  tiền lệ vì động từ `adadiṁ` là quá khứ. (6) `Sattavīsatikkhattuṁ … devarajjaṁ karissati`: giữ `lần` theo
  tiền lệ tha-ap62:7.3, tha-ap20:8.1. (7) `Tassuddānaṁ` giữ như các tệp khác trong phẩm; tên phẩm uddāna và
  số kệ `138` xem phần Số Pāli. (8) `Pathabyā rajjaṁ pañcasataṁ` (`:14.3`): đọc là `năm trăm lần làm vua trên mặt đất`
  theo tha-ap36:8.3; Pāli không có từ `lần` ở dòng này nhưng đi liền các dòng đếm lần `:13.1`, `:14.1`.
  (9) Bài không có `…pe…` hay `(…)`: dấu lược Pāli 0, Việt 0.

  NHÁY. Pāli `“` 1, `”` 1, `‘` 2, `’` 2; mở ngoặc kép ở `:1.1`, nháy đơn mở rồi đóng ngay trong `:4.4`, nháy đơn mở
  ở `:12.1` và đóng ở `:14.4`, ngoặc kép đóng ở `:17.4`. Khớp Pāli từng khoá: 0/83 khoá lệch (Việt `“` 1, `”` 1,
  `‘` 2, `’` 2). Không có dấu lược `…` trong bài (Pāli 0, Việt 0), không có `(…)`. Dấu cuối dòng mỗi khoá kệ khớp Pāli
  (`,` `;` `,` `.`); riêng `:9.4` kết bằng `!` vì Pāli có `aho` (cảm thán), `:4.4` nằm trong nháy đơn.

  COVERAGE ENGLISH, ĐO THẬT. Mẫu số là Pāli có nội dung từ 40 ký tự trở lên, bỏ khối `:0`: chỉ 1 khoá
  (`:18.1`, 62 ký tự); mọi khoá kệ chỉ 18–26 ký tự nên cổng coverage gần như không đo được gì. Sujato phủ
  0/1 (tầng này không có thân kinh tha-ap nào; tệp tha-ap duy nhất là tệp tên); `vietnamese-current` 0 (26 tệp,
  toàn Pháp Cú); `english-project` không có uid này. Vì cả ba tầng tham khảo vắng nên `triangulation` đặt
  7,0 (không quá 8,0) và `status` giữ `draft` kèm blocker. Bài không có entry trong reference-gaps; việc có hay
  không có entry cũng KHÔNG cứu được `published`, vì gate đòi tệp Anh đã ghim.

  KIỂM TRA ĐÃ LÀM. Tập khoá Việt bằng tập khoá Pāli (83 = 83), thứ tự khoá đúng Pāli, NFC, không khoảng trắng thừa,
  không khoá rỗng, không Pāli lọt vào thân (chỉ còn tên riêng Piyadassī, Sumaṅgala, Raṭṭhapālaka… và `Therāpadāna`,
  `Phẩm Sīhāsaniya` ở tiêu đề), mọi số Pāli đã tính lại ở trên, dấu lược 0/0. Đã đọc đối chiếu cặp Pāli-Việt từng khoá.

  `technical_integrity` đặt 9,6 vì chưa chạy cổng kỹ thuật của kho. Bốn lệnh còn lại cần chạy
  trước khi chốt: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
