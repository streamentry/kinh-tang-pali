notes: |-
  Tiền lệ đếm được trên tầng Việt đã có: 0.1 giữ Therāpadāna (249 so với 9); công thức Kilesā dùng giọng ta (Các phiền não của ta đã được thiêu rụi, 35 so với 20); viharāmi anāsavo (ta sống không còn lậu hoặc. 35 so với 20); Svāgata (Thật lành thay sự đến của ta, 35 so với 20); kataṁ buddhassa sāsanaṁ không chủ ngữ (đã làm tròn lời dạy của Đức Phật. 36 và đã làm tròn lời dạy của Đức Phật”. 209); Paṭisambhidā catasso (Bốn vô ngại giải, 253); Itthaṁ (Tôi nghe như vầy: Tôn giả Trưởng lão X đã nói những bài kệ này. 325/297); 0.3 và 9.1 theo kiểu việc-làm Ký Sự Về Trưởng Lão Cúng Dường X (tiền lệ tha-ap417/tha-ap437/tha-ap448/tha-ap496/tha-ap499); Pāli có …pe… thì Việt giữ một … (không mở rộng).
  Tên riêng ở khóa 8.1: chỗ nào tên đã có trong tầng Việt thì dùng thân từ (Kuṭajapupphiya, Abbhañjanadāyaka, Gayākassapa, Sattakadambapupphiya và Billiya dạng ASCII); 5 tên lần đầu xuất hiện trong tầng Việt (Ucchaṅgapupphiya, Koladāyaka, Paṁsukūlapūjaka, Ghosasaññaka, Āmaṇḍaphaladāyaka) thì khóa 8.1 giữ dạng biến cách -o khớp nguyên văn Pāli của đúng khóa đó (tiền lệ tha-ap207 dùng Nigguṇḍipupphiyo, tha-ap383 dùng Avaṭaphaladāyako và 6 tệp thag tương tự), vì chốt lọt_pāli chỉ chấp nhận tên khớp Pāli của khóa hoặc tên đã có trên đĩa.
  0.2 Phẩm Cây Vibhītaka như tha-ap444 (hòa 1–1, theo tha-ap448). Bất định: Pāli viết Billa (tựa), beluvaṁ (2.1), billapakkam (3.2) cho cùng loại trái nên Việt chuẩn hóa Bilva, ghi nhận ở đây; Imasmiṁyeva kappasmiṁ (Trong chính kiếp này, 0 tiền lệ); puññakkhetta vīra (ruộng phước cho đời, bậc Anh Hùng); khāribhāra (gánh khārī); saṁvigga (xúc động).
