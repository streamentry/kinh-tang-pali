notes: |-
  9 khoá, phủ đủ, dấu lược `…` ở `1.5` giữ nguyên.
  
  **Lỗi chính: mất lặp ở `1.1` và `1.3`.** Pāli `Cutā patanti patitā` là **ba** từ cùng nghĩa (đã đổ, họ rơi, đã rơi) — đây là lặp có chủ đích để nhấn. Bản dịch rút thành hai (*Đã sa đọa, kẻ ấy rơi xuống*), mất đi `patitā`. Tương tự `Kataṁ kiccaṁ rataṁ rammaṁ` ở `1.3`: `rataṁ` (đã thèm muốn/tìm) và `rammaṁ` (thú vị) là hai từ, bản dịch gộp thành *điều vui đã hưởng* — mất một ý. AGENTS.md §9 nói rõ: canonical translation mặc định bảo toàn nội dung lặp. Đây không phải lỗi chặn (không đổi nghĩa chính) nhưng là mất semantic unit, nên `semantic_fidelity` 9.0 và `vietnamese_clarity` 9.1.
  
  **`vihaññato` ở `1.2` — `giddhā ca punarāgatā` → *tham đắm lại quay trở về*.** Pāli: kẻ đã sa đọa rơi xuống thì lại **tham đắm và quay về** (tức là tái sinh trong hữu tích). Bản dịch giữ được cả hai vế (*tham đắm* + *quay trở về*) ✓. Sujato dịch *greedy, they return* — cũng hai vế. Đúng.
  
  **Vế kết `1.4` dịch tốt.** `sukhenanvāgataṁ sukhan` → *hạnh phúc dẫn đến hạnh phúc*. Đây là câu kệ nổi tiếng của Trưởng Lão; `anvāgata` (đi đến nhờ, do nhờ) → *dẫn đến* ✓ và `sukhan` lặp lại ở cả hai vị trí, không bị bỏ. Giữ lặp ở đây thành công — điều mà `1.1`/`1.3` đã không làm được.
  
  **Tên riêng:** `Pakkhattheragāthā` → *Trưởng Lão Pakkho*, và `1.5` dùng *Pakkho* khớp `0.4` ✓.
  
  **Tầng Anh** có mặt đủ bốn vế.
  
  **Tầng Việt**: không có Thích Minh Châu cho Trưởng Lão ở commit đã ghim.
