notes: |-
  Bản dịch tiếng Việt mới cho bài kinh tha-ap372 — trưởng lão Saḷalapupphiyo, bài thứ mười
  và bài cuối của Mandāravapupphiyavagga.

  Tiền kiếp: bên bờ sông Candabhāgā ông là một kinnara, thấy bậc Thiên trong hàng Thiên
  đang đi lang thang. Ông chất đống sala làm ngai, dâng lên Đức Phật tối thượng; Đức Phật Vipassī
  tiếp nhận rồi bảo ông đến gần hơn. Ông lễ bái bậc song chân tối thượng, chắp tay rồi leo
  lên đỉnh núi. Vào chín mươi mốt kiếp trước là quả của việc cúng dường Đức Phật.

  Bài này là bản song song của thi-ap12, cùng câu mở đầu Candabhāgānadītīre và cùng hình
  ảnh người kinnara dựng đống sala, nên đã dùng lại nguyên văn cách dịch của thi-ap12 cho các
  câu trùng: Hãy đến gần hơn, bậc Đại Anh hùng; với đống sala thơm ngát hương chư thiên.

  Bất định đã ghi lại, không sửa trong kinh:
  - `saḷala` dịch là sala theo thi-ap12:2.1 và 2.4. tha-ap270:2.3 dịch là hoa saḷala; ở
    đây động từ chất đống và lượng từ cả hai câu đều chỉ một đống, nên theo thi-ap12.
  - `pekkhamānassa me sato` (3.4) dịch là bậc mà tôi đã nhìn thấy lúc ấy; `sato` là cách
    nói của người nói.
  - `Ocinitvāna saḷalaṁ, pupphaṁ buddhassadāsahaṁ` (2.1–2.2): `pupphaṁ` là chủ ngữ tan tành
    sang câu sau, nên câu 2.2 bắt đầu bằng đống hoa ấy.
  - `Mandāravapupphiyavaggo sattatiṁsatimo` (9.1): số thứ tự là ba mươi bảy, khớp dãi 28–38
    của mười phẩm liền kề; dịch đúng con số Pāli.
  - uddāna 11.1–11.6 giữ tên Pāli nguyên văn. Đã đối chiếu từng tên với tiêu đề `0.3` của
    mười bài trong phẩm (tha-ap363–372); `Bhisakesarapupphiyo` là tên rút gọn gộp của
    Bhisamuḷāladāyaka và Kesarapupphiya, y như uddāna ghi, nên giữ nguyên.
  - Tên phẩm theo đa số trong chính phẩm này: 7 bài trong số 9 bài đã có dùng Phẩm Bậc Rải
    Hoa Mandārava; tầng `name/` đã ghim gọi phẩm này là Ekamandāriya.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của chính tầng Việt qua `_hvi.save_vi`: đủ 36/36 khoá, cân ngoặc kép trên cả bài, đúng số dấu lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10 tiêu chí, tính bằng script.
