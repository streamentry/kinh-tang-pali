  Lượt cải thiện 2026-10-13: đọc lại đối kháng từng khoá, đo lại tiền lệ bằng cách ghép Pāli trùng nguyên văn toàn tầng (chuẩn hoá dấu câu), và đã đổi 44 trên 407 khoá; không đổi tập khoá, không đổi dấu nháy hay dấu lược (đã kiểm khớp Pāli từng khoá: nháy kép và nháy đơn 0 lệch, dấu lược 0 lệch trên 89 khoá có dấu lược). (1) Khoá 18.5, 19.5, 20.5, 21.5, 24.5 đến 27.5, 40.5 đến 43.5, 52.5 đến 55.5 (16 khoá, Pāli Tena vuccati): "Vì vậy được nói" thành "Vì thế được nói". Pāli trùng 198 cặp, toàn bộ ở ps; 187 cặp dịch "Vì thế được nói", 0 cặp dịch "Vì vậy được nói"; bản trước lệch cả 16 khoá mà ghi chú cũ không nêu. Terminology 8.8 thành 9.0. (2) 24 khoá khuôn yāvatā (64.1, 65.1 đến 65.4, 67.1, 68.1 đến 68.4, 70.1, 71.1 đến 71.3, 73.1, 74.1 đến 74.3, 76.1, 77.1 đến 77.5): "Bao nhiêu … thì đã được biết" thành "Chừng nào … đã được biết". Trong ps, các khoá bắt đầu bằng yāvatā dịch "chừng nào" 71 khoá, "bao nhiêu" 0 khoá (ps1.1:577.6, 577.17, 579.1; ps1.4:96.5, 96.21; ps1.1:572.1 cùng khuôn ý nghĩa của … thuộc …). Ghi chú cũ nói khuôn này "0 tiền lệ" là sai; mục bất định 3 ở trên chỉ còn lại phần vidito → nhận rõ (ps1.1:577 cùng dùng "nhận rõ", nên không còn bất định) và phần yāvatā là liên từ tương quan. Bỏ dấu phẩy và chữ "thì" vốn chỉ để gánh chữ "bao nhiêu". Terminology 8.8 thành 9.0; vietnamese_clarity 8.8 thành 8.9. (3) Khoá 12.2 (yaṁ kiñci samudayadhammaṁ, sabbaṁ taṁ nirodhadhammaṁ): "Phàm pháp gì có tập khởi, tất cả pháp ấy đều có hoại diệt" thành "Bất cứ pháp nào có tính sinh khởi, tất cả đều có tính đoạn diệt". Công thức này trong toàn tầng: "có tính sinh khởi" 66 khoá, "có tập khởi" 2 khoá (chính bài này và sn56.11); "có tính đoạn diệt" 59, "có tính chấm dứt" 5, "có hoại diệt" 2. Bản trước làm mất sắc thái "có bản chất, có tính" của dhamma trong hợp từ. Dạng chọn là dạng đa số nguyên câu (13 cặp trùng ở dn3, dn5, dn21, sn35 và các bài khác). Ghi chú cũ nói giữ nguyên theo sn56.11 là kế thừa lệch tiền lệ; sn56.11:11.2 vẫn còn dạng cũ nhưng nằm ngoài lát này. semantic_fidelity 8.9 thành 9.0. (4) Khoá 12.1 (virajaṁ vītamalaṁ dhammacakkhuṁ): "Pháp nhãn thanh tịnh không uế nhiễm" thành "Pháp nhãn không bụi, không cấu uế". Chữ "thanh tịnh" không có trong Pāli và bỏ mất viraja (không bụi); toàn tầng 21 trên 25 khoá dịch "không bụi", và dn21:2.10.9 cùng mệnh đề Imasmiñca pana veyyākaraṇasmiṁ bhaññamāne dịch "Pháp nhãn không bụi, không cấu uế". (5) Khoá 15.1 (imaṁ udānaṁ udānesi): "lời cảm thán" thành "lời cảm hứng"; cụm này toàn tầng "thốt lên lời cảm hứng" 81 khoá, "cảm thán" 3 khoá. (6) Khoá 4.5 (nandirāgasahagatā): "đi cùng hỷ tham" thành "đi cùng hỷ và tham"; tầng "hỷ và tham" 8 khoá, "hỷ tham" 2 khoá (chính bài này và sn56.11); "hỷ tham" đọc được như một từ ghép. Đọc đối kháng 407 khoá không thấy lỗi về người nói, phủ định, số lượng hay ranh giới khoá; đo lại số Pāli (15, 30, 60, 10, 20, 40, 70, 25, 50, 100 và các dạng cộng 120, 240, 140, 280, 125, 250, 500, 150, 300, 600, 850, 1.700, 3.400) và các tổng chéo khớp như ghi ở trên.

  Quyết định không đổi dù có nghi ngờ (đã đo): khoá 10.2 "Và tri kiến đã sinh khởi nơi Ta" lệch dạng đa số "khởi lên nơi Ta" (23 cặp trùng: 11 khoá "Và tri kiến khởi lên nơi Ta", 0 khoá giống bản này), nhưng bản này giữ "đã sinh khởi" để khớp 78 lần udapādi trong chính bài và 5.1 đến 8.3 ở đầu bài; khoá 11.1 giữ "Đức Thế Tôn đã nói như vậy" (205 cặp trùng toàn tầng: "Đức Phật đã nói" 111, "Đức Thế Tôn đã nói" 37, "Đức Thế Tôn nói" 31) vì bhagavā là Đức Thế Tôn xuyên suốt bài; khoá 2.5, 3.1, 3.4 giữ "thắng tri" (khoá công thức này ở tầng "thắng trí" chiếm đa số, nhưng bài dùng "thắng tri" cho abhiññā ở 64.1 đến 66.1); khoá 5.2, 5.3, 22.1, 22.2, 65.1, 66.1 giữ "hiểu rõ tột cùng" (ps 106 khoá, so với "hiểu cho trọn" 2 khoá ở ps2.7:8.1 và 8.2; toàn tầng thì "liễu tri" 27, "hiểu cho trọn" 6); tên các cõi trời Yāma, Tusita, Nimmānaratī, Paranimmitavasavattī (13.5 đến 13.8) giữ dạng Pāli theo sn56.11 và sn55.54 vì tầng hoàn toàn lẫn lộn (Tusita 4 với Đâu Suất 1; Nimmānaratī 7 với Hóa Lạc 27 nhưng trong ngữ cảnh khác; Paranimmitavasavattī 9 với Tha Hóa Tự Tại 25); khoá 4.8 "không chấp thủ" cho anālayo không có đa số rõ (tầng: không chấp thủ 4, không bám 5, không chấp trước 3, không nương 1). Bất định còn lại giữ nguyên các mục 1 đến 12 ở trên (byañjananiruttābhilāpā, Paṭisambhidādhikaraṇa, dhātu, sự quán thọ và quán tâm ở 37.1, 37.2, 45.1, 45.2, bỏ vata bho ở 15.2, và các mục khác); lượt này không giải quyết bất định nào nên ambiguity_integrity, source_provenance, grammar_logic, triangulation, han_viet_balance và segment_alignment giữ nguyên. Blocker noEnglishEditionUpstream giữ nguyên vì là sự thật về bản chụp upstream. Chưa chạy cổng kỹ thuật toàn repo nên technical_integrity vẫn 9,6: còn phải chạy npm run validate, npm test, npm run check và npm run build.

