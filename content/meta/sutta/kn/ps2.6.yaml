  Tầng tham khảo: english-sujato không có ps2.6 (thư mục sutta/kn đã ghim chỉ có cp dhp iti ja kp snp thag thig ud, và manifest chỉ liệt kê tệp Pāli root cho uid này); english-project của dự án chưa có tệp nào cho uid này; vietnamese-current (phantuananh) chỉ có Pháp Cú. Coverage English theo công thức của source/layers.yaml: mẫu số 178 khoá Pāli có nội dung (từ 40 ký tự trở lên, bỏ ba khoá tiêu đề 0.1 đến 0.3), tử số 0 ⇒ 0/178, dưới ngưỡng 0,8; 226 khoá còn lại ngắn hơn 40 ký tự nên cổng không đo được gì ở đó. Chưa có entry cho ps2.6 trong content/meta/reference-gaps.yaml; bài ngoài phạm vi sửa của lát này. Một phần nhỏ của bài (nhóm khoá 1 đến 15, tức đoạn kinh Chuyển Pháp Luân được trích nguyên văn, 43 khoá Pāli có nội dung) trùng với sn56.11, bài có bản English Sujato riêng; bản đó chỉ được dùng để đối chiếu cách hiểu công thức, không phải tầng tham khảo của ps2.6, không ở mức khoá và không cấp text cho bản này. Phần luận giải còn lại (nhóm 16 đến 79, gồm các câu hỏi ý nghĩa, các mệnh đề đối tượng và phạm vi, và toàn bộ các phép đếm) không có bản English hay bản Việt tham khảo nào. Vì vậy triangulation bị chặn ở 7,5 (≤ 8,0) và bài giữ draft. Bản Việt nguyên bài ở mục tra cứu toàn văn cuối trang (nếu có; không phân đoạn, alignment: none) không phải tầng store và không tính vào triangulation.

  Cấu trúc bài (Paṭisambhidākathā, 9 phần vāra): 1 Dhammacakkapavattanavāra trích gần nguyên văn kinh Chuyển Pháp Luân (nhóm 1 đến 15) rồi giải từng vế (nhóm 16 đến 35): mắt, trí, tuệ, minh, ánh sáng đã sinh khởi do các ý nghĩa thấy, đã biết, biết rõ, thông suốt, chiếu sáng; năm pháp và năm nghĩa là đối tượng và phạm vi của pháp vô ngại giải và nghĩa vô ngại giải; mười ngữ từ cho ngữ từ vô ngại giải; hai mươi trí cho biện tài vô ngại giải; mỗi Thánh đế (ba chuyển) có 15 pháp, 15 nghĩa, 30 ngữ từ, 60 trí; bốn Thánh đế cộng 60, 60, 120, 240. 2 Satipaṭṭhānavāra (36 đến 47) và 3 Iddhipādavāra (48 đến 59) lặp đúng khuôn ấy cho bốn niệm xứ và bốn như ý túc. 4 Sattabodhisattavāra (60 đến 63): lời giảng giải của bảy Bồ-tát (Vipassī, Sikhī, Vessabhū, Kakusandha, Koṇāgamana, Kassapa, Gotama), mỗi vị 10, 10, 20, 40, bảy vị cộng 70, 70, 140, 280. 5 Abhiññādivāra (64 đến 66), 6 Khandhādivāra (67 đến 69), 7 Saccavāra (70 đến 72), 8 Paṭisambhidāvāra (73 đến 75) và 9 Chabuddhadhammavāra (76 đến 78) dùng khuôn "bao nhiêu ý nghĩa X của X thì đã được biết, thấy, nhận rõ, chứng ngộ, chạm đến bằng trí tuệ; không có ý nghĩa X nào chưa được chạm đến bằng trí tuệ": mỗi mục 25, 25, 50, 100. Khoá 79.1 cộng toàn chuyên đề: 850, 850, 1.700, 3.400; khoá 79.2 là câu kết.

  Số Pāli, tự tính (kèm tách từng phép): pannarasa 15; tiṁsa 30; saṭṭhi 60; dasa 10; vīsati 20; cattālīsaṁ 40; sattati 70; pañcavīsati 25; paññāsaṁ 50; sataṁ 100. Dạng cộng: vīsatisata = 20 + 100 = 120 (35.1, 47.1, 59.1: 4 × 30 = 120 khớp); cattālīsañca dve ca ñāṇasatāni = 40 + 200 = 240 (4 × 60 khớp); cattālīsasataṁ = 40 + 100 = 140 (7 × 20 khớp); asīti ca dve ca ñāṇasatāni = 80 + 200 = 280 (7 × 40 khớp); pañcavīsasataṁ và pañcavīsatisataṁ = 25 + 100 = 125 (5 × 25 khớp); aḍḍhateyyāni niruttisatāni = hai trăm rưỡi = 250 (5 × 50 khớp); pañca ñāṇasatāni = 500; dve niruttisatāni 200, cattāri ñāṇasatāni 400 (4 × 50 và 4 × 100 tương ứng 25 pháp mỗi mục: 100, 100, 200, 400); diyaḍḍhasataṁ = một trăm rưỡi = 150 (6 × 25); tīṇi niruttisatāni 300; cha ñāṇasatāni 600; aḍḍhanavadhammasatāni = tám trăm rưỡi = 850; niruttisahassañca satta ca niruttisatāni = 1.000 + 700 = 1.700; tīṇi ca ñāṇasahassāni + cattāri ca ñāṇasatāni = 3.000 + 400 = 3.400. Đối chiếu tổng khoá 79.1 với các mục trong chính bài: 60 + 60 + 60 + 70 + 125 + 125 + 100 + 100 + 150 = 850 pháp; nhân đôi 1.700 ngữ từ; nhân bốn 3.400 trí: khớp ở cả ba. Bộ đọc số tiếng Việt đã hiệu chuẩn 25/25 và 31 khoá có số đều đạt tỉ lệ pháp : nghĩa : ngữ từ : trí = 1 : 1 : 2 : 4. Cạm bẫy tiếng Việt: một trăm hai mươi (120) là cộng hai mươi vào một trăm, không phải 2.000; "một ngàn bảy trăm" là 1.700.

  Thuật ngữ và tiền lệ (đo trên tầng Việt đã có; ps là phạm vi gần nhất): paṭisambhidā → vô ngại giải (ps1.0 493 trên 516 khoá, ps3.10 544 trên 561; toàn tầng sutta 622 dòng ở 603 tệp), atthapaṭisambhidā → nghĩa vô ngại giải, dhammapaṭisambhidā → pháp vô ngại giải, niruttipaṭisambhidā → ngữ từ vô ngại giải, paṭibhānapaṭisambhidā → biện tài vô ngại giải (ps1.0:64 đến 67 và 27 đến 28). nirutti → ngữ từ (ps1.0:27.1, 66.1; tầng chỉ 8 dòng ở 5 tệp). udapādi → đã sinh khởi (ps 78 lần, so với đã khởi lên 5; toàn tầng 376 dòng ở 58 tệp; theo ps2.7:2.1 và ps2.7:15.3 cùng công thức; sn56.11 dùng sanh nhưng đó là bài khác, không theo). cakkhu, ñāṇa, paññā, vijjā, āloka → mắt, trí, tuệ, minh, ánh sáng (ps2.7:3.1 đến 3.19); dassana, ñāta, pajānana, paṭivedha, obhāsa + aṭṭha → do ý nghĩa thấy, đã biết, biết rõ, thông suốt, chiếu sáng (ps2.7:3.12 đến 3.20, Pāli trùng, dùng lại nguyên văn). ārammaṇa → đối tượng, gocara → phạm vi (ps1.0:7.1, 16.1; ps2.5). ariyasacca → Thánh đế, tên bốn đế theo ps2.7:2.1 và ps1.1:14.1 đến 17.1: Thánh đế về khổ, về tập khởi của khổ, về diệt tận của khổ, về con đường đưa đến diệt tận của khổ (tầng "Thánh đế về khổ" 38 dòng ở 15 tệp, so với "Khổ thánh đế" 6 dòng ở 3 tệp, trong đó sn56.11; không theo sn56.11 vì lệch tên đế với ps). pariññeyya, pariññāta → cần phải hiểu rõ tột cùng, đã được hiểu rõ tột cùng (ps 12 lần "hiểu rõ tột cùng" so với 2 lần "hiểu cho trọn"; khoá 5.2, 5.3, 22.1, 22.2 cố ý khác ps2.7:8.1 và 8.2 là "hiểu cho trọn" để giữ nhất quán với pariññāya pariññaṭṭho ở 65.1 trong cùng bài; cần được người rà soát hài hòa với ps2.7). pahātabba → cần phải từ bỏ, sacchikātabba → cần phải chứng ngộ, bhāvetabba → cần phải tu tập (ps2.7:11.3, ps2.1:16.3). abhiññā → thắng tri (ps 164 lần, so với thắng trí 2); công thức "upasamāya abhiññāya sambodhāya nibbānāya" (2.5, 3.1, 3.4) cũng dịch thắng tri để khớp trong bài, dù toàn tầng có 30 dòng "thắng trí" và 9 dòng "thắng tri" cho riêng công thức này (sn56.11 dùng thắng trí); đây là ba khoá lệch tầng có chủ ý. aṭṭhaṅgika → tám chi (ps 25 lần, so với tám ngành 2 và Bát Thánh Đạo 12 trong ps; toàn tầng với khoá 3.2 là "Chính là Thánh đạo tám ngành này, tức là" 9 khoá, "tám chi" 2 khoá; theo ps2.5 và ps2.8). sammādiṭṭhi …pe… sammāsamādhi → chánh kiến … chánh định (42 khoá trùng Pāli ở tầng). jāti → sinh (tầng "Sinh là khổ" 6, "Sanh là khổ" 1; tái sinh 978 so với tái sanh 170). majjhimā paṭipadā → con đường Trung đạo (sn56.11:2.4, 3.1; tầng 3 dòng). cakkhukaraṇī ñāṇakaraṇī → tác thành mắt, tác thành trí (sn56.11:2.4). ñāṇadassana → tri kiến (561 dòng); tiparivaṭṭaṁ dvādasākāraṁ → ba chuyển mười hai hành tướng (sn56.11:9.1, tiền lệ duy nhất; Sujato: three rounds and twelve aspects); abhisambuddho + sammāsambodhiṁ → đã giác ngộ hoàn toàn vô thượng chánh đẳng giác (10 khoá, so với "đã chứng đắc vô thượng chánh đẳng giác" 2 khoá, đều ở sn56.11); paccaññāsiṁ → tuyên bố (1.037 dòng). akuppā vimutti → sự giải thoát của Ta không thể lay chuyển (5 khoá trùng Pāli, tầng "không thể lay chuyển" là đa số, nhưng toàn bộ 11 cặp trùng Pāli ở khoá 10.3 lệch nhau ở chữ sinh hay sanh và dấu chấm; bản này chọn sinh). Idamavoca bhagavā → Đức Thế Tôn đã nói như vậy (197 cặp trùng Pāli: Đức Phật đã nói 111, Đức Thế Tôn đã nói 33, Đức Thế Tôn nói 31; chọn Đức Thế Tôn đã nói vì bài gọi bhagavā là Đức Thế Tôn xuyên suốt, 33 khoá). veyyākaraṇa → lời giảng giải (sn56.11:11.1; tầng 14 dòng). bhummā devā → chư Địa Cư Thiên, brahmakāyikā → chư Phạm Chúng Thiên (sn56.11:12.1, 12.10); cõi Tứ Đại Thiên Vương, cõi Ba Mươi Ba, Yāma, Tusita, Nimmānaratī, Paranimmitavasavattī (sn56.11:12.3 đến 12.9, sn55.54). dasasahassī lokadhātu → mười ngàn thế giới (dn14 dịch cả vạn thế giới, sn56.11 hệ thống mười ngàn thế giới; chọn con số nói thẳng). saṅkampi sampakampi sampavedhi → rung động, lay động, chấn động (dn14:1.17.7). bodhisatta → Bồ-tát; Sikhī (70 khoá), Vessabhū (43), Kakusandha (53), Koṇāgamana (35), Vipassī, Kassapa, Gotama (dn14, tầng). Samudayo, nirodho → tập khởi, diệt tận (theo ps1.0:61 đến 62). Quán thân trên thân, quán thọ, quán tâm, quán pháp trên các pháp và như ý túc gồm định do dục, tinh tấn, tâm, quán sát và các hành nỗ lực: theo cùng cách diễn đạt của ps2.7 (15.3, 15.4, 16.1, 21.1 và 22.1 đến 22.6); chỉ khác dấu nháy ở những khoá mà Pāli ps2.6 có nháy khác ps2.7. khandha → uẩn, dhātu → giới (cũng dùng "mười tám giới" 5 dòng; dễ đọc nhầm với giới sīla, xem bất định 4), āyatana → xứ, saṅkhata → hữu vi (216 dòng), asaṅkhata → vô vi, dukkha, samudaya, nirodha, magga → khổ, tập khởi, diệt tận, đạo (ps1.0:56 đến 59). indriyaparopariyattañāṇa → trí về căn cơ mạnh yếu, sattānaṁ āsayānusaye ñāṇaṁ → trí về khuynh hướng và tùy miên của chúng sinh, yamakapāṭihīre ñāṇaṁ → trí về thị hiện song đôi, mahākaruṇāsamāpattiyā ñāṇaṁ → trí về sự chứng đạt đại bi, sabbaññutaññāṇaṁ → trí toàn tri, anāvaraṇañāṇaṁ → trí không bị che chắn (đúng ps1.0:68 đến 73). Tiêu đề: vāra → Phần (ps2.7:1.0, 15.0 và 21.0); Dhammacakkapavattana → Chuyển Vận Bánh Xe Pháp (theo ps2.7: chuyển vận, Bánh xe Pháp); Saccavāra → Phần Chân Lý (ps2.7:1.0, Pāli trùng); Yuganaddhavagga → Phẩm Song Hành; Paṭisambhidākathā → Luận Bàn Về Vô Ngại Giải (khuôn tên ps2.5, ps2.7); câu kết → Luận bàn về vô ngại giải được hoàn tất (ps2.5).

  Pāli trùng nguyên văn: trong chính bài 40 nhóm (223 khoá): bốn khối 17 đến 21, 23 đến 27, 39 đến 43 và 51 đến 55 giống nhau từng khoá (câu hỏi ý nghĩa, mệnh đề đối tượng và phạm vi, câu kết "được nói"), 16 khoá "Ye tassā ārammaṇā te tassā gocarā" và các khoá song đôi, 11 khoá "āloko udapādi.", 11 khoá "āloko udapādi”.", 5 khoá "āloko udapādi …pe… ”.", cùng các cặp 3.3 với 4.11, 13.2 với 13.10, 36.4 với 37.6; 0 nhóm có bản Việt khác nhau (thẻ in đậm của nguồn bị bỏ nên không làm các cặp này lệch). Đã dò toàn tầng Việt đã có: 109 khoá của bài có Pāli y hệt khoá ở bài khác (từ 15 ký tự trở lên); 85 khoá trong đó bản Việt dùng lại nguyên văn mọi cặp, và 24 khoá có ít nhất một cặp lệch: 1.2 (4 cặp lệch: Đức Thế Tôn trú, nơi Vườn Nai; các bài kia dùng Đức Phật), 2.5, 3.1, 3.4 (lệch sn56.11 ở chữ thắng tri thay thắng trí), 3.2 và 4.10 (tám chi thay tám ngành hoặc Bát Thánh Đạo), 3.3 và 4.11 (68 cặp, 26 cặp lệch vì các bài kia viết đủ tám chi), 4.4, 4.7, 4.9, 5.1, 6.1, 7.1, 8.1 (tên đế và đã sinh khởi thay sanh), 4.6 (2 cặp lệch chữ "và"), 9.1, 10.1 (Thánh đế viết hoa), 10.2 (ps2.2:24.2 dịch khởi lên nơi Ta; bản này giữ đã sinh khởi cho khớp công thức trong bài và thêm Và cho ca), 10.3 (11 cặp lệch nhau, chọn sinh), 11.1 (164 trên 197 cặp lệch, theo đa số Đức Thế Tôn đã nói), 13.6, 13.7, 13.8 (các bài kia dịch Đâu Suất, Hóa Lạc hoặc bỏ chữ cõi). Tất cả đã đọc và có lý do ở trên; không có lệch do sai nội dung.

  Dấu câu, dấu nháy và dấu lược: Pāli có nháy kép hoặc đơn ở 99 khoá; bản Việt khớp Pāli từng khoá ở cả bốn loại dấu (“ ” ‘ ’), 0 lệch trên 99 khoá. Lời trích mở bằng nháy kép ở 2.1 và đóng ở 10.3; nháy đơn lồng trong 16.1, 22.1, 29.1 và các khoá tương tự giữ đúng như Pāli. Thẻ in đậm của nguồn (32 khoá có thẻ b) bị bỏ, không thêm nháy, theo ps2.5 và ps3.4. Dấu lược: Pāli có …pe… ở 88 khoá và một dấu … trần ở 13.3 (không có (…) nào); bản Việt giữ đúng một … cho mỗi khoá có dấu lược, 0 lệch Pāli từng khoá; 5 khoá Pāli kết bằng …pe… rồi nháy đóng và chấm (29.5, 31.5, 33.5, 45.7, 57.7) được dịch kết bằng khoảng trắng, …, khoảng trắng, nháy đóng và chấm. Khoá 13.3 kết bằng … trần theo Pāli, không mở rộng. Khoá 2.3 và 2.4 là câu Pāli bị chia đôi giữa hai khoá bằng dấu chấm phẩy; 2.4 mở bằng "và" để câu Việt mạch lạc, Pāli không có từ ấy. Các khoá kết bằng dấu gạch dài (1.1, 1.3, 3.2, 4.4 …) giữ dấu gạch dài.

  Bất định, không thêm vào thân kinh: (1) byañjananiruttābhilāpā (20.1, 26.1) là hợp từ dài, 0 tiền lệ trong tầng; dịch từng thành tố theo ps1.0 (ngữ từ) và cnd21:8.9 (văn tự) cộng "lời diễn đạt" cho abhilāpa (cnd dịch "lời xưng"); cũng có thể đọc là "các cách nói bằng văn tự và ngữ từ". Khoá 20.1 chia hai vế (năm pháp, năm nghĩa) mỗi vế một nhóm; không biết mỗi nhóm đếm mấy ngữ từ ngoài tổng "mười ngữ từ" ở 20.2. (2) Paṭisambhidādhikaraṇa (79.1) dịch "chủ đề vô ngại giải"; chữ adhikaraṇa mang nghĩa đề mục hoặc chủ đề ở đây, 0 tiền lệ trong tầng; có thể đọc là "phần luận về vô ngại giải". (3) Khuôn "yāvatā X-ṭṭho ñāto diṭṭho vidito sacchikato phassito paññāya" ở 64.1 trở đi dịch "bao nhiêu ý nghĩa X của X thì đã được biết, thấy, nhận rõ, chứng ngộ, chạm đến bằng trí tuệ"; yāvatā đóng vai liên từ tương quan; 0 tiền lệ đã dịch (ps1.1:572 chưa dịch); vidito → đã được nhận rõ cũng 0 tiền lệ. Chữ "thì" chỉ chuyển cấu trúc tương quan, không thêm nghĩa. (4) dhātu (68.1, 69.1) dịch "giới", có thể bị nhầm với giới sīla; Pāli ở chỗ này đứng giữa khandha và āyatana nên là mười tám giới. (5) Khoá 14.2 dasasahassī lokadhātu dịch "mười ngàn thế giới", đúng chữ Pāli; cách hiểu "hệ mười ngàn thế giới" cũng khả dĩ. (6) Khoá 37.1, 37.2, 45.1, 45.2 (Ayaṁ vedanāsu …pe…; ayaṁ citte …pe…) dịch "Đây là sự quán thọ …" và "đây là sự quán tâm …", theo ps2.7:15.x; chữ "sự quán" lấy từ công thức đầy đủ ở 36.1 mà Pāli lược. (7) Khoá 12.2 nirodhadhamma dịch "có hoại diệt" (dùng lại sn56.11:11.2, Pāli trùng); tầng ps dùng "diệt tận" cho nirodha ở chỗ khác; lệch này là kế thừa nguyên văn, không đổi. (8) Khoá 15.2 và 15.3: vata bho không có chữ tương ứng, theo sn56.11:14.2 (Sujato cũng bỏ). (9) 4.2 và 4.3: câu Pāli kết bằng dấu chấm phẩy rồi một khoá riêng; giữ dấu chấm phẩy. (10) 9.1 và 10.1: dùng "nơi Ta" theo sn56.11 cho me. (11) Cách đọc cộng của các số hợp (vīsatisata, cattālīsasataṁ, pañcavīsasataṁ) dựa trên tổng; tầng chỉ có dạng tương tự ở tha-ap và cho kết quả khớp. (12) Cách dịch pariññā: "hiểu rõ tột cùng" khác ps2.7:8.1 và 8.2 (xem thuật ngữ).

