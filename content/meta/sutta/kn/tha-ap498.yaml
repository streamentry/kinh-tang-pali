notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho tha-ap, xem `blocking_errors`.
  BÀI SONG SONG: `tha-ap428` (cùng vị trưởng lão Ghatamaṇḍadāyako, phẩm Sakiṁsammajjakavagga) có 41/42 khoá trùng Pāli nguyên văn với bài này nhưng CHƯA dịch; khi dịch `tha-ap428` phải dùng lại đúng nguyên văn của lát này.
  TIỀN LỆ: `Therāpadāna`, `Phẩm Hoa Kiṅkaṇi`, `Bốn vô ngại giải` như hai bài trên; `lokajeṭṭhaṁ narāsabhaṁ` → `bậc tối thượng ở đời, bậc anh hùng của loài người` và `Disvā cittaṁ pasādetvā` → `Thấy Ngài, lòng … bừng khởi niềm tịnh tín` có tiền lệ; `Mama saṅkappamaññāya` → `Nhờ thấu rõ ý định của tôi` 3 lần; `cakkavattī ahosahaṁ;` → `tôi từng làm Chuyển Luân Vương` 2 lần; `Padesarajjaṁ vipulaṁ` + `gaṇanāto asaṅkhiyaṁ` dùng nguyên văn tiền lệ; `Catunnavutito kappe` → `Vào chín mươi tư kiếp trước đây` 22 lần.
  NGÔI KỂ: `tôi` (xem tha-ap495 về phép đo và về việc cần gộp).
  BẤT ĐỊNH 1 — `Ekapaññāsakkhattuñca,` (6.1): có thể là lần thứ 51, cũng có thể theo chú giải là thêm 50 (tức 100). Không có tiền lệ cho cụm này (6 khoá Pāli, 0 bản Việt). Dịch trung tính `và thêm một lần nữa,` để không khẳng định con số mà Pāli không chốt.
  BẤT ĐỊNH 2 — `ghataṁ sampajjare mama;` (3.2): `ghaṭa` ở đây có lẽ là khối hoa mà vị ấy trao; dịch `tôi làm trọn món quà;` — chữ `quà` là suy ra từ `sampajjare` (làm cho trọn), KHÔNG khẳng định `ghaṭa` là hoa.
  BẤT ĐỊNH 3 — `ghorā` (3.3) dịch `tối tăm`; `kapparukkhā` (5.2) giữ nguyên tên cây vì 0 tiền lệ; `madhusakkarā` (4.2) dịch `dịu dàng ngọt ngào như mật`.
  SỐ KHOÁ TRÙNG PĀLI: 13/42 khoá trùng nguyên văn trong lát; toàn lát dùng lại 61 cặp, 0 lệch.
  GHI CHÚ KỸ THUẬT: chữ `Ghatamaṇḍa` là tên riêng chưa có tiền lệ nào trong kho, mà chốt `lọt_pāli` chặn đúng lần dùng đầu tiên. Vì vậy bài này phải chạy `save_vi` HAI LẦT: lượt 1 ghi khoá `0.3` (28 ký tự, nằm ngoài tập kiểm) để từ đó vào kho ngữ vựng của tầng, lượt 2 mới viết được `12.1`. Đây là hạn chế của cách chặn, không phải lỗi bản dịch; đã ghi lại để người điều phối biết là lát này cần chạy lặp.
  LỆCH CHÉO GIỮA CÁC LÁT (đo trong lúc làm việc, KHÔNG sửa tệp người khác): `tha-ap428` — cùng vị trưởng lão Ghatamaṇḍadāyako — vừa được lát khác dịch, có 40 khoá trùng Pāli nguyên văn với bài này nhưng 27 bản Việt KHÁC nhau. Nhóm khác biệt lớn nhất: khối tiêu đề (bên kia `Bài Kệ Tuyên Ngôn Về Trưởng Lão Dâng Bó Đèn`, bên này `Ký Sự Về Trưởng Lão Cúng Dường Ghatamaṇḍa`), và `Ekapaññāsakkhattuñca` 6.1 — bên kia chốt `Lại thêm năm mươi lần nữa`, bên này giữ trung tính `và thêm một lần nữa,` vì Pāli không nói rõ 51 hay 100. Đây là việc của người điều phối gộp; tôi không sửa tệp ngoài lát.

  Sửa lan 2026-10-13: khoá tha-ap498:5.3 (Paññāsakkhattuṁ devindo), "Năm mươi lần, bậc Trời Vua," → "Năm mươi lần là chúa chư thiên," (đúng nguyên văn tha-ap20:8.1; devindo là chúa chư thiên); 6.1 (Ekapaññāsakkhattuñca), "và thêm một lần nữa," → "Và năm mươi mốt lần," (ekapaññāsa = 51; đúng nguyên văn tha-ap341:9.3 và tha-ap45:12.3, cùng Pāli; mục BẤT ĐỊNH 1 ở trên không còn áp dụng: cách đọc 51 là nghĩa trực tiếp của từ, cách đọc 100 theo chú giải không có trong Pāli); 6.3 (Padesarajjaṁ vipulaṁ), "Vương quốc rộng lớn ấy," → "Vương quyền cai quản các vùng đất rộng lớn," (đúng nguyên văn tha-ap497:5.1 và tha-ap25:13.3, 38 khoá so với 9 khoá "Vương quốc rộng lớn ấy"); 9.1 (Svāgataṁ vata me āsi), "Thật là đón mừng thù thắng thay cho tôi," → "Thật lành thay sự đến của tôi," (đúng nguyên văn tha-ap497:9.1; toàn tầng "Thật lành thay sự đến của ta/tôi/con" ở hơn 175 khoá so với 30 khoá "đón mừng thù thắng").
  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 42 khoá cặp Pāli↔Việt, đổi 17 khoá (15 khoá lời kinh + tiêu đề 0.3 và 12.1); 25 khoá còn lại giữ. Bản trước có nhiều lỗi nghĩa mà điểm cũ không phản ánh, nên điểm các tiêu chí liên quan được chấm lại theo hiện trạng.
  (a) Sửa sai nghĩa. 1.3 `Upaviṭṭhaṁ mahāraññaṁ` "Đã quý vị bước vào rừng rậm" → "Đang ngồi giữa khu rừng lớn," (upaviṭṭha = đã ngồi xuống, tiền lệ "ngồi/an tọa/ngồi xuống" ở các khoá `upaviṭṭha` khác; câu cũ vô nghĩa). 1.4 `vātābādhena pīḷitaṁ` "bị sương gió hành hạ" → "bị bệnh gió hành hạ." (vātābādha = bệnh gió; tiền lệ `vātābādho` → "bệnh gió", `vātarogehi pīḷito` → "bị các bệnh phong hàn hành hạ"; "sương" không có trong Pāli). 2.2 `upānayiṁ` "đem … đi khắp nơi" → "mang … đến" (upa-ā-nī = đưa đến gần; "khắp nơi" không có trong Pāli). 2.3–2.4 `Katattā ācitattā ca, gaṅgā bhāgīrathī ayaṁ` "Dù ở bất cứ nơi nào, dòng sông Hằng chảy ngàn dòng ấy" → "Do đã làm, đã tích tập, sông Hằng Bhāgīrathī này," (katattā/ācitattā là sở thuộc cách-nguyên nhân "do đã làm, đã tích tập", cùng công thức `kaṭattā upacitattā` → "Do … đã làm, đã tích tập" ở 8 khoá; câu cũ thêm "bất cứ nơi nào", "ngàn dòng" không có trong Pāli). 3.1–3.2 `Mahāsamuddā cattāro, ghataṁ sampajjare mama` "Bốn đại hải, tôi làm trọn món quà" → "Bốn đại dương trở thành bơ lỏng cho tôi;" (sampajjare là ngôi ba số nhiều, chủ ngữ là sông Hằng và bốn đại dương; ghata = bơ lỏng, tiền lệ 11 khoá `ghatasittaṁva` → "rưới bơ lỏng"; `quà` và chủ ngữ "tôi" trong bản cũ đều không có trong Pāli). 3.3 `ghorā` "tối tăm" → "khủng khiếp" (tiền lệ ghora → "khủng khiếp/đáng sợ", không có "tối"). 4.2 `bhavate madhusakkarā` "bởi thế trở nên dịu dàng ngọt ngào như mật" → "trở thành mật và đường;" (chủ ngữ số ít là quả đất ở 3.3; "bởi thế", "dịu dàng" không có trong Pāli). 4.3–4.4 `Cātuddīpā ime rukkhā, pādapā dharaṇīruhā` "bốn châu đảo này, đều là cây cỏ mọc lên từ lòng đất" → "Những cây ở bốn châu lục này, những loài cây mọc từ đất," (bản cũ bỏ mất `rukkhā`, biến "cây" thành "cây cỏ", và chuyển "bốn châu" thành chủ ngữ). 5.2 `kapparukkhā bhavanti te` "đều trổ ra tia hoa kapparukkhā" → "chúng trở thành những cây như ý;" (bản cũ bịa "tia hoa" và để lọt Pāli; kapparukkha = cây ước/cây như ý theo từ điển, `bhavanti` = trở thành). 7.4 "đó là quả của việc cúng dường ghatamaṇḍa" → "đây là quả báo của tinh chất bơ lỏng." (công thức `-ssidaṁ phalaṁ` → "đây là quả báo của …" 120 khoá so với "đó là quả báo" 74 và "đó là quả" 53; bỏ "việc cúng dường" không có trong Pāli).
  (b) Thuật ngữ. `ghatamaṇḍa` đang để nguyên Pāli ở 2.2, 7.4 và tiêu đề; đổi thành "tinh chất bơ lỏng" theo tiền lệ `sappi` → "bơ lỏng", `sappimaṇḍo` → "tinh chất bơ" (dn9 và sn34, nhiều khoá trong tổng 22 khoá có `sappimaṇḍa`). Tiêu đề 0.3 và 12.1 đổi theo, đúng nếp các bài kề `tha-ap497` ("Nửa Tấm Vải") và `tha-ap499` ("Nước"); `translationTitle` khớp 0.3; khoá 11.1 giữ tên Pāli như các bài kề. 1.2 `lokajeṭṭhaṁ narāsabhaṁ` "bậc tối thượng ở đời, bậc anh hùng của loài người" → "bậc Trưởng Thượng thế gian, đấng Nhân Ngưu;" (trong `tha-ap`: 7 khoá ngoài bài này dùng dạng này, 0 khoá dùng dạng cũ; dạng cũ chỉ có ở `sn11.3`, nên "tiền lệ" mà ghi chú trước viện ra là của bộ khác, không phải của phẩm).
  (c) Xác minh các nghi vấn của lượt sửa lan. 6.1 `Ekapaññāsakkhattuñca`: ekapaññāsa = 51, giữ "Và năm mươi mốt lần," (đúng nguyên văn 5 khoá cùng Pāli; cách đọc 100 lần theo chú giải không có trong Pāli). 5.3 "Năm mươi lần là chúa chư thiên," giữ (5 khoá cùng Pāli so với 2 khoá khác). 6.3 giữ (40 khoá so với 8). 9.1 giữ (24 khoá "của tôi" so với 20 "đón mừng thù thắng"). Hai khoá 2.3–2.4 và 1.3 đã nêu trong yêu cầu kiểm toán là sai thật, đã sửa như trên.
  (d) Bất định còn lại, KHÔNG phân xử được. 1.1 `Sucintitaṁ bhagavantaṁ`: hapax trong hai bài `tha-ap428` và `tha-ap498`, không thể xác nhận là thuộc tính của Đức Thế Tôn ("bậc khéo suy xét") hay một tên riêng (mẫu `Padumuttaraṁ bhagavantaṁ`, `Sumedhaṁ bhagavantāhaṁ` cho phép đọc thành tên) hay dạng thụ động "được suy xét kỹ"; bản cũ "Suy nghĩ kỹ về Đức Thế Tôn" thì sai ngữ pháp (không có động từ, còn làm `disvā` mất tân ngữ), nên đổi sang cách đọc thuộc tính, nhưng đây vẫn là lựa chọn chưa chắc. 2.3 `Katattā ācitattā ca`: Pāli không nêu cái gì "đã làm, đã tích tập"; giữ không có tân ngữ, không chêm "nghiệp". 3.1–3.2 và 3.3–4.2: cấu trúc "sông Hằng và bốn đại dương trở thành bơ lỏng; quả đất trở thành mật và đường" dựa vào số của động từ (`sampajjare` số nhiều, `bhavate` số ít) và tiền lệ `ghata`; `madhusakkarā` là hapax, đọc "mật và đường", cũng có thể là hợp từ "đường mật". 5.2 "cây như ý" dựa vào nghĩa từ điển của kapparukkha, trong kho chỉ có tha-ap (Kapparukkhiya) giữ nguyên Pāli. Bản Việt nguyên bài ở mục Tra cứu toàn văn chỉ dùng để thấy cách đọc cú pháp, không chép câu chữ; các cách đọc ở 1.4, 2.3–4.4, 5.2, 6.1 hội tụ.
  (e) Điểm đổi: semantic_fidelity 9.3 → 8.8; grammar_logic 9.2 → 8.9; terminology 9.2 → 9.0; vietnamese_clarity 9.3 → 8.9; ambiguity_integrity 9.1 → 8.8. Điểm cũ chấm cao trong khi 1.3, 2.2–2.4, 3.2–3.3, 4.2–4.4, 5.2 đều sai nghĩa; sau sửa vẫn còn các bất định ở mục (d) nên không nâng lại mức cũ. Các tiêu chí còn lại giữ nguyên: source_provenance 9.5, segment_alignment 10.0, triangulation 7.5 (không có bản Anh độc lập), han_viet_balance 9.4, technical_integrity 9.6. final_score 9.21 → 9.04.
  Cảnh báo lệch chéo: `tha-ap428` (cùng vị trưởng lão) vẫn còn các lỗi 1.1 "đã được tự điển trang", 1.3 "vị vua rừng lớn", 1.4 "bị gió mưa hành hạ", 2.2 "bó đèn", 2.3–2.4, 3.2 "chiếc bình", 5.2 "cây hạnh đào" và tiêu đề "Dâng Bó Đèn"; việc sửa nằm ngoài lượt này, cần một lượt cải thiện riêng và phải dùng đúng nguyên văn các khoá trùng ở bài này. Technical gate chưa chạy trong lượt này: còn bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build`; technical_integrity giữ 9.6.
