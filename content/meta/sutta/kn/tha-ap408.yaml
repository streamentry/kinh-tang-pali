notes: |-
  Dịch từ Pāli root của tha-ap408 (90 khoá, thứ tự khoá như Pāli); không có bản Anh Sujato, không có bản Việt hiện hành, không có lớp lấp english-project. Mọi lựa chọn dựa vào Pāli, ngữ cảnh bài và tiền lệ đếm được trong tầng Việt của dự án (485 tệp tha-ap). Status bắt buộc draft do blocker noEnglishEditionUpstream.

  Tên bài (:0.3): Pāli Nandakattheraapadāna không bắt đầu bằng số nên bản Việt không có số thứ tự; translationTitle bằng đúng giá trị khoá :0.3 (Ký Sự Về Trưởng Lão Nandaka). Đo kiểu tên trên 485 tệp tha-ap đã có :0.3: Tuyên Ngợ (chính tả đáng ngờ) 250, Tuyên Ngôn 123, Ký Sự 104, khác 8. Hai phạm vi cho hai đa số khác nhau: cửa sổ tha-ap395–420 có Ký Sự 7 trên 7; cửa sổ tha-ap380–440 có Ký Sự 15, Tuyên Ngợ 14, Tuyên Ngôn 6, khác 1; trong phẩm Metteyya (tha-ap400, tha-ap404) Ký Sự 2 trên 2; toàn tầng nghiêng về Tuyên Ngợ và Tuyên Ngôn. Chọn Ký Sự theo phạm vi gần nhất và theo tha-ap404 cùng phẩm, khớp với lời kết 24.1 (Ký sự về Trưởng lão …, thứ sáu). Đề nghị người biên tập phán một lượt cho cả cuốn. Tên riêng Nandaka giữ dạng Pāli.

  :0.1 Therāpadāna giữ nguyên Pāli (473 trên 484 khoá cùng Pāli). :0.2 Metteyyavagga dịch Phẩm Metteyya theo tha-ap404 (cùng phẩm, tiền lệ duy nhất cho khoá này).

  Số Pāli, tự tính: sahassayuttaṁ = sahassa 1000 + yutta (thắng vào) nên dịch một ngàn ngựa thắng vào, không có thang lớn nhân thêm (đã sửa ở lượt 2026-10-13); yojanasataṁ = 100 do-tuần (7 khoá cùng Pāli, 5 khoá dạng một trăm do-tuần chung quanh); catudaṇḍe = catu 4 + daṇḍa; catuṭṭhāne = catu 4 + ṭhāna, dịch bốn cây cọc và bốn chỗ; catasso (22.1) = bốn. Bài không có tiṁsa, Tiṁsakappasahassa hay các số nhân khác. Ghi để tránh lẫn: theo đo tầng tiṁsa = ba mươi (tha-ap459:6.1 Tiṁsa kappāni = suốt ba mươi kiếp), còn cụm Tiṁsakappasahassa chưa phân xử được (3.000 hay 300.000); không dùng đến ở bài này.

  Dùng lại tiền lệ nguyên văn: trong 90 khoá có 33 khoá Pāli trùng một khoá khác của tầng kn, trong đó 25 khoá bản Việt dùng đúng chữ của một bản dịch tiền lệ (không kể hoa thường), 8 khoá khác (1.1, 1.2, 9.1, 11.3, 16.4, 17.1, 18.4, 19.3), đều có lý do: đổi ngôi tôi thành ta, bỏ chữ êm ở 9.1 vì Pāli không có, dùng mái che thay lều ở 11.3 theo tha-ap400 và để maṇḍapa nhất quán là mái che trong cả bài (tha-ap404 không có maṇḍapa; chỗ ghi nhầm ở bản trước đã được đính chính ở lượt 2026-10-13), chọn thợ săn thú ở 1.1 vì tiền lệ ta thành con nai bị săn đuổi và Migaluddo là tên ngọn núi đều không hợp Pāli của bài này. Trong chính bài có 4 nhóm Pāli trùng (không kể hoa thường): buddhapūjāyidaṁ phalaṁ ở 12.4, 13.4, 14.4, 15.4, 16.4 (5 khoá, 10 cặp); Aho me sukataṁ kammaṁ ở 13.3, 19.1 (1 cặp); gotamaṁ sakyapuṅgavaṁ ở 16.2, 17.2 (1 cặp); …pe… ở 20.2, 21.2, 22.2 (3 cặp): tổng 15 cặp, 0 cặp mà bản Việt khác.

  Ngôi kể: dùng ta xuyên suốt, theo tha-ap404 và đa số công thức chung: Kilesā jhāpitā mayhaṁ ta 99, tôi 45, con 10 (154 khoá); viharāmi anāsavo ta 100, tôi 45, con 2 (147 khoá); Svāgataṁ vata me āsi ta 98, tôi 39, con 10 (147 khoá); Duggatiṁ nābhijānāmi ta 212, tôi 192 (416 khoá); ba công thức kệ 20, 21, 22 dùng nguyên văn đa số của tầng, …pe… dịch đúng một dấu lược.

  Thuật ngữ và tiền lệ: sayambhū aparājito = bậc Tự Tại, không ai khuất phục được (đúng chữ của tha-ap404; trong 15 khoá cùng Pāli: Đấng Tự Chứng 4 + 1, bậc Tự Tại 2 + 2 + 2, Tự Hữu 2, còn lại nêu tên riêng). Duggatiṁ (11.1) = đọa xứ theo đa số tầng (trong 416 khoá Duggatiṁ nābhijānāmi: đọa xứ 214, khổ đau 147, khổ xứ 51, khác 4; dạng khổ đau thêm nghĩa ngoài Pāli); apāyā (11.2) = khổ cảnh theo tiền lệ apāyaṁ upapajjati ở tha-ap115. Pubbenivāsaṁ jānāmi (14.1) = Ta biết rõ các đời sống quá khứ (3 khoá cùng chữ trong 11 khoá cùng Pāli); dibbacakkhu visodhitaṁ (14.2) = thiên nhãn đã được thanh tịnh (4 khoá). Buddhapūjāyidaṁ phalaṁ = đây là quả báo của việc cúng dường Đức Phật (50 khoá, so với 18 khoá đó là); 10.4 maṇḍapassa idaṁ phalaṁ dịch cùng kiểu quả báo của mái che. maṇḍapa = mái che theo tha-ap400 (maṇḍapaṁ kārayiṁ ahaṁ dịch mái che) và tha-ap404 cùng phẩm. Lời kết 23.1 dùng nhóm số nhiều đã nói những bài kệ này (Pāli imā gāthāyo; 407 khoá, so với 21 khoá bài kệ này số ít); 24.1 theo tha-ap404: Ký sự về Trưởng lão …, thứ sáu (chaṭṭhaṁ = thứ sáu).

  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 22.3, cố ý chạy qua khoá; đối chiếu từng khoá cho 0 lệch trên 90 khoá; Pāli không có nháy đơn nên bản Việt cũng không có. Pāli không dùng ti nên không có chuyện phe bỏ hay giữ dấu ti. Dấu lược: ba khoá …pe… (20.2, 21.2, 22.2) đều là một dấu … ; Pāli không có dấu lược trần hay (…) nào khác.

  BẤT ĐỊNH, để người biên tập phán, không thêm vào thân kinh:
  1. 1.3 Pasadaṁ migamesanto: pasada là một loài nai (tha-ap68 có Pasadañca migaṁ); dịch một con nai đốm. Tên loài chỉ xác lập theo tầng một khoá, nên không dịch xa hơn.
  2. 2.1 Anuruddho nāma sambuddho: Pāli gọi là sambuddha, một vị Phật cùng tên với Tôn giả Anuruddha; bản Việt chỉ nói Bậc Chánh Đẳng Giác tên là Anuruddha và không thêm giải thích.
  3. 7.1 Sahassayuttaṁ hayavāhiṁ: có thể đọc cỗ xe thắng ngàn ngựa; đã đổi sang đúng chữ tiền lệ (ba khoá cùng Pāli: tha-ap5, ja541 hai lần) ở lượt 2026-10-13, nên không còn nghịch với Pāli ở chỗ lặp ngựa.
  4. 8.1 niyyamānassa (được dẫn đi) và 8.4 dharīyati (được duy trì): Pāli không nêu ai dẫn, ai giữ mái che; bản Việt không thêm chủ thể.
  5. 9.2 acchanne pupphasanthate: acchanna có thể đọc được che phủ hoặc chưa che phủ (a-channa); chọn được che phủ, trải đầy hoa vì mạch kệ nói hoa sen rơi từ hư không; tầng không có tiền lệ cho dạng này.
  6. 10.1 Marīcike phandamāne: marīcika (hơi nắng chập chờn, ảo ảnh nóng); phandamāna rung động; dịch hơi nắng lung linh rung động, tầng chỉ có tiền lệ marīci tia nắng (tha-ap459).
  7. 12.1 Mahīsaññaṁ adhiṭṭhāya: dịch quyết định tưởng về đất; loṇatoyaṁ dịch nước mặn, không thêm biển; 12.1 không có tiền lệ trong tầng (0 khoá).
  8. 18.2 gambhīraṁ nipuṇaṁ padaṁ: padaṁ dịch cảnh giới (Pāli nghĩa đen là bước chân, dấu vết, trạng thái); tầng có một khoá gambhīraṁ nipuṇaṁ atthaṁ dịch nghĩa lý sâu xa, tinh tế (tha-ap37); không áp dụng vì Pāli của khoá này là padaṁ.
  9. 6.1 Pubbakammena saṁyutto: dịch gắn liền với nghiệp quá khứ; Pāli không nói thêm nghiệp nào (việc dựng mái che hay việc khác); tầng có tha-ap485 Puññakammena saṁyutto = Nhờ gắn bó với việc làm phước thiện (có thêm chữ nhờ), nên không áp dụng chữ nhờ.
  10. 11.4 santāpo me na vijjati: dịch ta không có nỗi nóng bức nào theo mạch 10.1–10.3; santāpa còn nghĩa nung đốt, phiền muộn nhưng Pāli không nêu thêm.
  11. 3.4 và 4.1 chādayiṁ, chādayitvāna dịch phủ (tiền lệ tha-ap501 rồi phủ lên bằng cỏ) chứ không dịch lợp, để khỏi nói hình thức mái che nhiều hơn Pāli.

  Coverage English: mẫu số 1 (chỉ 23.1), Sujato phủ 0 trên 1; ba tầng tham khảo (english-sujato, english-project, vietnamese-current) đều vắng cho bài này.

  CỔNG KỸ THUẬT: không chạy được trong lát này nên technical_integrity đặt 9.6, không tuyên bố đã qua cổng. Còn phải chạy trước khi gộp: npm run validate, npm test, npm run check, npm run build.

  Lượt cải thiện 2026-10-13 (đọc đối kháng lại cả 90 khoá, so từng cặp Pāli với Việt; đo lại tiền lệ trên toàn tầng kn, 153.567 khoá có cặp Pāli và Việt):
  Năm khoá đã đổi, 85 khoá giữ nguyên.
  - 7.1: Có ngàn ngựa thắng vào, do ngựa kéo → Một ngàn ngựa thắng vào, kéo xe. Lý do: bản cũ lặp ngựa hai lần và thêm chữ Có không có trong Pāli; cả ba khoá cùng Pāli (tha-ap5:9.1, ja541:149.1, ja541:158.1) đều dùng đúng chữ mới. Số Pāli không đổi: sahassa = 1.000. Tiêu chí terminology và semantic_fidelity.
  - 6.2: ta đã đi đến cõi Đâu-suất → ta đã đến cõi trời Đâu-suất. Lý do: Pāli tusitaṁ agamāsahaṁ có 5 khoá trong tầng, trong đó 3 khoá dùng cõi trời Đâu-suất (tha-ap535:15.4 ta đã đến cõi trời Đâu-suất, tha-ap546:24.4 tôi đã đến cõi trời Đâu-suất, thi-ap4:3.4 có ghi chú Tusita), 1 khoá cung trời Đâu-suất (tha-ap362:2.4); chưa có khoá nào dùng cõi Đâu-suất trần. Tiêu chí terminology.
  - 9.1: Ta nằm trên giường → Ta nằm nghỉ trên giường. Lý do: tuvaṭṭ trong tầng (tha-ap100:3.1 và tha-ap82:18.4) dịch nằm nghỉ; tha-ap410:13.1 là dạng tuvaṭṭento khác nghĩa trằn trọc nên không áp dụng. Tiêu chí terminology.
  - 9.3: Từ hư không, hoa sen → Và từ hư không, hoa sen. Lý do: Pāli có ca (antalikkhā ca padumā) mà bản cũ bỏ sót; thêm lại để khỏi mất liên từ. Tiêu chí semantic_fidelity.
  - 17.1: Sau khi hầu cận bậc Chánh Đẳng Giác → Sau khi phụng sự bậc Chánh Đẳng Giác. Lý do: upaṭṭhahitvā/upaṭṭhitvā trong tầng có phụng sự 4 khoá (tha-ap114:7.3 cùng cụm sambuddhaṁ, tha-ap52:16.1, thi-ap17:110.3, tha-ap292:4.1), hầu hạ 2 khoá, hầu cận 1 khoá (cp31:4.1); riêng khoá cùng Pāli tha-ap434:9.1 dịch đã đến bên (Pāli là upaṭṭhitvāna nhưng nghĩa ở đó khác mạch). Tiêu chí terminology.
  Điểm tiêu chí đổi: terminology 9.0 → 9.2 (ba khoá 6.2, 9.1, 17.1 đưa về đa số tầng, cộng 7.1 đưa về tiền lệ); semantic_fidelity 8.8 → 9.0 (7.1 bỏ chữ thêm và lặp, 9.3 trả lại liên từ ca); final_score 8.93 → 8.97. Không đổi tiêu chí nào khác vì không có cải thiện tương ứng.
  Đo số liệu lại: tính theo Pāli khớp bỏ dấu câu và hoa thường, 50 khoá của bài có Pāli trùng khoá khác trong tầng kn (gồm cả tiêu đề 0.x và ba dòng …pe…), 42 khoá có bản Việt trùng đúng một bản tiền lệ, 8 khoá khác biệt có lý do: 1.2, 7.2, 8.2, 9.1, 11.3, 12.3, 17.1, 19.3 (7.2, 12.3, 19.3 chỉ khác đại từ ta so với tôi hoặc thêm ta làm chủ ngữ; 8.2 dùng một vị trời theo tha-ap337:9.1; 1.2 tiền lệ rời rạc, 8 dạng khác nhau cho 12 khoá; 11.3 mái che thay lều như đã nói; 9.1 và 17.1 nêu ở trên). Trong chính bài: 16 cặp Pāli trùng, 0 cặp Việt khác.
  Chỗ nghi nhưng giữ nguyên: 8.1 niyyamānassa (được dẫn đi) vì không tìm được tiền lệ nào khác trong tầng ngoài ja405:5.2 (bị bắt dẫn đi, khác nghĩa) nên không phân xử được; 9.2 acchanne (được che phủ) vì tầng không có dạng này ngoài vài khoá channa; 12.1 mahīsaññaṁ (tưởng về đất) và 10.1 marīcike không có tiền lệ trong tầng; 18.2 padaṁ dịch cảnh giới theo đúng cặp tha-ap3:147.2 (cùng Pāli, 2 khoá). Các bất định ghi ở trên vẫn còn; không có căn cứ mới để phân xử. Bản Anh, bản Việt hiện hành và lớp lấp English vẫn vắng, nên triangulation giữ 6.5 và blocker noEnglishEditionUpstream giữ nguyên. Cổng kỹ thuật vẫn chưa chạy trong lát này: technical_integrity 9.6; còn phải chạy npm run validate, npm test, npm run check, npm run build.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 3 khoá bất đồng nghĩa → sửa 0, giữ 2 (15.2 `oraso`: bản nguyên bài viết “tỳ khưu”, Pāli là con ruột của Đức Phật; 11.2 `apāyā pihitā`: bản nguyên bài viết “các địa ngục”, bản dự án giữ nghĩa rộng “các khổ cảnh”), bất định 1 (18.2 `gambhīraṁ nipuṇaṁ padaṁ`: bản dự án “cảnh giới sâu xa, vi tế”, bản nguyên bài “Đạo Lộ thâm sâu”; `pada` mang cả nghĩa trạng thái lẫn lối đi, ngữ cảnh 17.3–18.1 không loại hẳn cách nào, giữ bản dự án). Chủ thể 1.1–4.4 (thợ săn thấy Đức Phật, dựng mái che, đảnh lễ, bỏ cung) và các số (một ngàn ngựa 7.1, một trăm do-tuần 8.3) khớp bản nguyên bài. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
