  Phân loại 24 khoá lỗi (đã sửa):
  · Hô cách / ngôi / người nói bị đảo (7): `1.1` `Caṇḍāli vanda pādāni` là hô cách + mệnh lệnh
    ("Này Caṇḍālī, hãy đảnh lễ"), không phải ngôi ba; `1.3` *vì thương chính nàng* (cũ: *dành riêng
    cho Ngài*, "lượng" vô nghĩa); `5.3` người nói là nữ thiên *tôi*; `6.4` `Kā tvaṁ subhe devate
    vandase maman` là câu hỏi *nàng là ai* (cũ: *tại sao … tán thán ta*; `subhe devate` hô cách,
    khớp `vv30:2.4`, `vv40:1.4`, `vv48:2.4`); `7.1` `bhaddante` = *bạch ngài* (một người nghe, cũ:
    *các vị*; cùng cách dịch `snp4.14:7.3`); `9.1` chủ ngữ là *một trăm ngàn tiên nữ* (cũ: *Nàng có*);
    `10.4` người được gọi `bhante` là vị Thánh đệ tử, không phải Đức Thế Tôn (cũ: *bạch Thế Tôn*;
    đối chiếu `pv13:21`, `pv14:18`, `pv27:31`).
  · Nghĩa bị đảo (2): `2.4` `parittaṁ tava jīvitaṁ` = *mạng sống của nàng ngắn ngủi* (cũ: *xin nguyện
    bạn sống lâu*, ngược hẳn; đối chiếu `thi-ap28:9.2`, `an7.74`); `6.2` `Vimānamoruyha` =
    `vimānam` + `oruyha`, *bước xuống từ cung điện* (cũ: *bước vào*; `oruyha` có 5 nơi trong Pāli
    ghim, nên KHÔNG phải hapax — lời "hapax" ở trên là sai; `āruyha` mới là *bước lên*, xem `vv12:1.2`).
  · Bịa/thêm chủ thể, tên: `4.1`–`4.4` `Tamenaṁ avadhī gāvī` = *một con bò cái đã giết nàng*
    (`avadhī` là động từ aorist, `gāvī` là bò cái, KHÔNG phải tên người *Avadhī* hay *gác chăn*; cùng
    sự kiện `vv47:6.1`); `4.2` *đang đứng chắp tay* (cũ: *đứng bên nàng*); `4.3` *đang kính lễ bậc
    Chánh Đẳng Giác* (cũ: *Họ đảnh lễ*); `4.4` *bậc chiếu sáng giữa bóng tối* là cách gọi Đức
    Phật, cùng `sn2.10:5.1` (cũ: *hai người bừng sáng*); `5.2` bỏ *hiền giả* (không có trong Pāli).
  · Chữ vô nghĩa / sai từ (10): `3.1`–`3.2` *Được bậc đã tu tập tự thân, mang thân cuối cùng, thúc
    giục* (cũ: *Được lời thương nuôi dưỡng khuyến khích* — `bhāvitatta`, `sarīrantimadhārin`;
    đối chiếu `pv21:68.1`, `vv5:12.4`); `5.1` `vigatarajaṁ` *đã lìa bụi nhơ* (`pv17:14.3`),
    `anejaṁ` *không dao động* (`pv36:35.3`); `6.1` `mahāyasā` *có danh tiếng lớn* (cũ: *bằng oai
    lực lớn lao*; `bv4:36.4`); `7.2` `pesitā` *được … sai khiến* (cũ: *cứu sang*; cùng `ja523:9.2`);
    `8.2` `cutā` *mệnh chung* (cũ: *bị đuổi ra khỏi*; `vv16:5.2`); `9.3` `pavarā seṭṭhā` *tối thắng,
    tối thượng* (cũ: *người tuyên thuyết*, vô nghĩa; `vv33:7.2`); `10.1`–`10.2` *Đã tạo nhiều điều
    lành, tỉnh giác, chánh niệm* (cũ: *Phúc lành dồn dào, đầy trí tuệ biết lo*; `vv34:5.1`);
    `11.2` `kataññū katavedinī` *biết ơn, nhớ ơn* (cũ: *đã hiểu điều ấy*; `vv81:27.1`, `an5.39:4.4`).
  · Sửa nhẹ (không tính lỗi nghĩa): `1.4` *đã đứng lại*; `2.1`–`2.3`; `2.2` số ít (`arahantamhi
    tādini` cùng là định vị số ít, không phải số nhiều như ghi chú cũ); `3.3`, `5.4` *bậc anh hùng*
    (`pv13:6.2`, thay *tráng lực*); `6.3`, `7.3`, `8.1`, `8.4` *vườn Nandana* (như `vv13:6.6`);
    `9.2` *đặt tôi ở phía trước*; `11.4`. Tổng khoá đổi chữ: 36/49.
  · Sửa các khẳng định sai trong notes cũ: Pāli mở “ bốn lần (`1.1`, `5.1`, `6.1`, `7.1`) và đóng ”
    bốn lần (`2.4`, `5.4`, `6.4`, `10.4`) — bản chụp CÂN, không phải "không cân"; bản Việt khớp
    Pāli từng khoá. Người nói `1.1`–`2.4` KHÔNG được nêu trong Pāli (chỉ biết là một bậc A-la-hán,
    `3.1`–`3.2`), nên không còn ghi *Đức Phật*.

  Bất định còn lại (giữ, không đoán):
  · `6.2` `anekacittā` (giống cái, số ít): *muôn màu muôn vẻ* theo `citta` = đa dạng; không
    phân xử được là tính từ của nữ thiên hay của cung điện (các bài vv khác dùng dạng trung tính
    `anekacittaṁ` cho cung điện).
  · `10.4` `Taṁ bhante vanditumāgatā` — `taṁ` dịch *vị ấy* để không khẳng định ai là `muni`; các bài
    pv trùng cụm này không có `taṁ`.
  · `4.4` `andhakāre pabhaṅkaraṁ` xếp là cách gọi Đức Phật theo `sn2.10:5.1`; Pāli không có
    chủ ngữ nào khác để gán.
  · `8.2` `caṇḍālayoniyā` *dòng sinh caṇḍāla*: `yoni` là nơi/dòng sinh, theo cách đọc chữ.
  · `0.2` `Itthivimāna` hiện dịch *Chuyện Cung Điện Nữ Hư Không* theo cả bộ — `ākāsa` không có
    trong Pāli (lỗi họ, lặp ở nhiều tệp `vv`); không sửa riêng một tệp để khỏi lệch bộ, cần sửa một lượt.
  · `0.3` *Phẩm Cây Hoa Cittalatā*: `latā` là dây leo; *Cây Hoa* là phần thêm theo cả phẩm.
  · Không có tầng Anh/Việt hiện hành (`not-published-upstream`): đối chiếu chỉ dựa Pāli root và
    các cụm trùng nguyên văn trong `pv`/`vv`/`sn`/`ja` của kho; blocker và `triangulation` giữ 7.5.

