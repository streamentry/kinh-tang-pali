    5. Số Pāli (tự tính; mọi phép tính ghi ở đây):
       · `Paṇṇavīsativassāni` (`26.1`, `27.1`, `28.1`, `29.1`, `30.1`) = pañca 5 + vīsati 20 = 25 ⇒ "hai mươi lăm năm" (`thag6.6:1.1`, `thig3.1:1.1` viết đúng "Hai mươi lăm năm"; không phải "hai mươi năm" hay "năm mươi").
       · `Dvāsīti` (`11.1`) = dvi 2 + asīti 80 = 82; `dve sahassāni` (`11.2`) = 2.000; `Caturāsītisahassāni` (`11.3`) = catu 4 + asīti 80 = 84, nhân sahassa 1.000 = 84.000. Ở `11.1` Pāli không ghi `sahassāni` (lược trong vần), nhưng 82 + 2 = 84 ⇒ 82.000 + 2.000 = 84.000 đúng khớp `11.3`; và chỉ đọc 82 + 2 = 84 (nghìn) mới khớp. Nên bản Việt viết "tám mươi hai ngàn", "hai ngàn", "tám mươi bốn ngàn" (từ "ngàn" chiếm 857/1.083 khoá có `sahassa` ở tầng, "nghìn" 230). Đây là chỗ Pāli ngắn hơn Việt một chữ "ngàn" theo ngữ cảnh; ghi lại ở đây, không thêm vào thân kinh ngoài con số.
       · `Tiṁsanipāta` (`0.2`, `37.6`) = tiṁsa 30 ⇒ Bộ Ba Mươi Bài Kinh (theo `thig14.1:36.1`, `thag16.x`). Số kệ thực của bài là 37, không phải 30: tên bộ chỉ nhóm tên gọi truyền thống, không phải số đếm.
       · `Sataṁ pañca ca uttari` (`38.4`) = sata 100 + pañca 5 = 105 kệ cho cả ba bài của bộ (Phussa, Patissa, Ānanda). Bản Việt viết "một trăm, cộng thêm năm" theo khuôn `thag16.10:30.7`–`8` ("bài kệ có hai trăm, cộng thêm bốn mươi lăm"). Đếm thô số nhóm khoá kệ của ba bài trong repository: `thag17.1` 32 + `thag17.2` 37 + `thag17.3` 37 = 106, lệch 1 so với 105 của Pāli; tôi không sửa vì đó là dịch lại con số Pāli chứ không phải số do bản dịch tự đặt, và không có căn cứ để phán nguyên nhân (đếm nhóm khoá không tương đương đếm kệ truyền thống). Ghi lại để người biên tập biết.
       · `eka`/`dve`/`tayo` (`11.2`, `38.2`): `tayotime` = tayo 3 + ime ⇒ "ba vị này". `Ekova` ở `23.3` = một mình (không phải số đếm).
