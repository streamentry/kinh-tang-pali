    · `sunibbuta` → hoàn toàn tịch tĩnh (1 tiền lệ: `snp5.19:40.3`); `dhāreti antimaṁ dehaṁ` → mang thân thể cuối cùng (`sn21.4:6.3`, `thig3.6:3.3`, 2/4 khoá; `sn21.5` `giữ thân thái này là thân sau cùng`, `an4.16` `chịu mang thân sau rốt` khác).
    · `ādiccabandhu` → thân quyến của Mặt Trời (35 khoá: `thân quyến của mặt trời`/`Mặt Trời` 11, `bà con của Mặt Trời` 8); `parinibbuta` của Đức Phật → bát-niết-bàn (`thag16.9:14.4`, `16.4`; `dn16` viết `diệt độ`, `dn10` `nhập Niết-bàn`; chọn theo tiền lệ thag cùng bộ); `sambuddha` → bậc Chánh Giác; `cakkhumā` → bậc Hữu Nhãn (`thag16.9:14.4`).
    · `cittakathī` → thuyết giảng hay (`dn23:2.6`, `dn23:3.7`, `sn44.1:3.4` trong 5 khoá đã xem; `mn84:2.4` `giảng nói hay`, `sn9.4:2.3` `thuyết giảng vi diệu`); `paricāraka` → người phục vụ (`dn3:2.3.5`, `dn18`).
    · `kovida` → thiện xảo (`dhp352:2` cùng `niruttipadakovido`); `upaparikkhati` → xem xét (96 khoá: `xem xét` 17, `khảo sát` 12, `suy xét` 10, `quán sát` 8); `ussahati`/`tuleti`/`padahati` → cố gắng / cân nhắc / gắng sức (theo thứ tự `mn70:23.2`, `mn95:20.2`).
    · `upāseyya` → hầu cận (30 khoá: `hầu cận` 12, `phụng sự` 7, `thân cận` 4), `bhajati` → thân cận (`mn70:13.3`, `18.6`…).
    · `kāyagatā sati` → niệm thân (72 khoá chứa `kāyagatā`: `niệm thân` đa số, `mn119`); `kalyāṇamitta` → bạn lành (184 khoá, `dn33:3.3.11`, `mn8:12.36`).
    · `kāmasaññā` → tưởng dục, `dosasaññā` → tưởng sân (`dn33:1.10.21`: `tưởng dục, tưởng sân, tưởng hại`; 26 và 11 khoá); `sekha` → bậc hữu học (45/55); `appattamānasa` → tâm chưa thành tựu (6/22, nêu ở trên); `sakaraṇīya` → còn việc phải làm (`dn16:5.13.2`).
    · `upaṭṭhahiṁ` → đã phụng sự (`tha-ap33:1.4`, `tha-ap12:16.4`, `tha-ap52:15.1`, `tha-ap38:1.3`); `mettena kāyakammena` → bằng thân nghiệp từ ái (`dn16:5.14.5`, cùng cụm và cùng Ānanda; `dn31:33.2` viết `thân hành có lòng từ`); `caṅkamantassa`/`anucaṅkamiṁ` → kinh hành / đi theo (`dn27:2.7`).
    · `bhiṁsanaka` → khiếp đảm, `lomahaṁsana` → rợn tóc gáy (`dn16:6.10.24`–`25`; `sn6.15:8` viết `kinh hoàng`, `rợn tóc gai`).
    · `gatimanta` → thông đạt (`an1.221:1.1`, cùng ngài Ānanda; `mn12:62.8`, `tha-ap329:20.1` viết `khả năng ghi nhớ`); `satimanta` → có niệm (`tha-ap329:20.2`); `dhitimanta` → có sự kiên định (`ja513:15.1` `kiên định`, `sn7.9:3.3` `có nghị lực`); `ratanākara` → mỏ châu báu (`tha-ap139:4.2`, `tha-ap43:22.4`).
    · `Paṭhamavagga` → Phẩm Thứ Nhất, `Tiṁsanipāta` → Bộ Ba Mươi Bài Kinh, `Ānandattheragāthā` → Kinh Kệ Của Trưởng Lão Ānanda, theo khuôn `thag17.1:0.4`, `thag16.1:0.4`; bìa `37.5` theo khuôn `… Trưởng lão X …` không chấm (`thag14.2:14.5`, `thag15.2:16.5`); `Tatruddānaṁ` → Tóm tắt ở đây; `tayotime pakittitā` → ba vị này được nêu ra (khuôn `thag16.10:30.6`).
    · Ba bất định dịch theo ngữ cảnh mà tầng không có tiền lệ độc lập: `vibhūtanandī`, `kāyamacchera`, `vassupeta`, `pavattin`, `jīrati` ở ngữ cảnh con bò (xem mục bất định).

  BẤT ĐỊNH CÒN LẠI (ghi ở đây, không thêm vào thân kinh).
    · `1.2` `vibhūtanandinā`: tôi dịch `kẻ hả hê trước sự suy bại`, theo cách hiểu của Sujato (`gloater`) và bản Việt hiện hành (`vui với sự bất hạnh của người khác`); không thêm `của người khác` vào thân. `vibhūta` còn có thể hiểu là `rõ ràng`/`hiển lộ` nên nghĩa chính xác chưa chắc; tầng không có tiền lệ độc lập (0 khoá chứa `vibhūtanandi`).
    · `10.1` `Yasmiṁ patiṭṭhitā dhammā … nibbānagamane magge, soyaṁ tiṭṭhati gotamo`: `yasmiṁ` có thể là `trên con đường mà` (như Sujato và bản Việt hiện hành đọc) hoặc `nơi người mà` các pháp được thiết lập (Ānanda). Bản Việt viết `Nơi nào các pháp được thiết lập … trên con đường đưa đến Niết-bàn, chính vị Gotama này đứng vững`, giữ được cả hai cách đọc; không phán.
    · `8.4` `seyyaṁ kappeti gotamo`: thì hiện tại, tôi dịch `đang nằm xuống`; Sujato `made his bed`, bản Việt hiện hành `chuẩn bị việc nằm`. `Gotama` ở `8.4` và `10.4` là dòng họ của Ānanda, giữ nguyên chữ Pāli.
    · `11.1` `Dvāsīti`: thiếu `sahassāni` trong Pāli; đọc thành 82.000 là suy ra từ phép tính 82 + 2 = 84 (xem phép 5), không phải từ tầng.
    · `11.2` `bhikkhuto` là số ít trong Pāli; tôi viết `các tỳ-kheo` (Sujato `the monks`, bản Việt hiện hành `vị tỳ khưu`, số ít). `11.4` `ye me dhammā pavattino`: `pavattin` chỉ sự vận hành, lưu hành; dịch `truyền bá` theo Sujato (`promulgate`); bản Việt hiện hành `có sự vận hành`.
    · `12.2` `balibaddova jīrati`: `jīrati` là già đi; `dhp152:2` (biến thể `balībaddhova`) viết `lớn lên như con bò`, tôi viết `già đi như con bò đực` (Sujato `ages like an ox`, bản Việt hiện hành `trở thành già cỗi`). `balibadda` ở tầng là `bò đực` (`dn16:4.30.2`).
    · `13.1`–`13.4`: `bahussuto appassutaṁ yo sutenātimaññati` đọc là người đa văn nào vì sự học mà khinh người ít học; `tatheva paṭibhāti maṁ` là `tôi thấy đúng là như vậy` (tiền lệ `mn102:12.3` `ta thấy`).
    · `16.1` `Khantyā chandikato hoti`: `khanti` không có tân ngữ trong Pāli; tôi viết `Nhờ chấp nhận mà có ước muốn` mà không nêu `Pháp`; `mn70:23.2` có `dhammanijjhānakkhanti` (chấp nhận Pháp sau tư duy) nhưng đó là cụm dài hơn. `chanda` → `ước muốn` theo `mn70`.
    · `20.1` `Kāyamaccheragaruno`: `macchera` thường là keo kiệt, ở đây theo `thag1.114:1.1` (`Kāyaduṭṭhullagaruno`, Sujato `pampered and heavy`) và bản Việt hiện hành `chú trọng ở việc ích kỷ về thân xác`; tôi viết `Nặng lòng ích kỷ với thân`, không có tiền lệ độc lập trong tầng. `20.2` `hiyyamāne anuṭṭhahe`: chủ ngữ của `hiyyamāne` (sức sống, đời sống) không có trong Pāli; bản Việt để `đang suy tàn mà không chịu nỗ lực`, không thêm chủ ngữ.
    · `21.1` `na pakkhanti disā`: hiểu là `na pakkhāyanti` (không hiện rõ), theo `dn16:2.24.5`. `21.4` `andhakāraṁva khāyati`: `dường như chỉ còn bóng tối hiện ra`.
    · `23.4` `vassupetova pakkhimā`: tôi hiểu `vassupeta` là đến trú trong mùa mưa; Sujato `snug in its nest`, bản Việt hiện hành `đi về nơi trú ẩn`. Không tiền lệ trong tầng.
    · `24.1`–`24.4`: không rõ ai nói. Pāli không nêu; bản Việt dùng `tôi` và để `Đạo Sư` ở `25.3` làm bằng chứng (Ānanda lấy hành xử của Đạo Sư làm lý do). `24.4` `passantu samayo mamaṁ`: `samayo` hiểu là `đây là lúc`, không phải `giờ giấc`; bản Việt hiện hành đọc `giờ là thời điểm`. `mamaṁ` là `tôi`, Sujato `me`; bản Việt hiện hành `Ta` (coi như lời Đức Phật), nhưng `25.3` nói Đạo Sư ở ngôi thứ ba nên tôi giữ `tôi`.
    · `26.4`/`27.4` `passa dhammasudhammataṁ`: tầng có nhiều cách dịch cho cụm này (`thag4.2:4.2`, `thag4.9:4.2` `sự khéo léo tuyệt vời của Chánh pháp`; `thag1.24:1.2` `sự thuần thục của pháp`; `thag5.1:5.2` `tính chất nhiệm mầu của chánh pháp`); không có đa số rõ; chọn cách xuất hiện hai lần (`thag4.2`, `thag4.9`) theo luật dùng lại nguyên văn, dù `khéo léo tuyệt vời` hơi xa nghĩa `sudhammatā`.
    · `32.1`–`32.4`: Pāli không có động từ chính sau `Satthu ca parinibbānaṁ`; bản Việt giữ câu nửa vời (`và sự bát-niết-bàn của bậc Đạo Sư, vị thương xót chúng tôi`) và không thêm động từ (Sujato thêm `has become fully extinguished`; `dn16:5.13.2` có `bhavissati`, đó là câu khác).
    · `36.1`–`36.4`: `gatimanto`, `satimanto`, `dhitimanto` là ba phẩm chất; `yo isi` là đại từ liên hệ nối với `Saddhammadhārako thero`, nên `vị ẩn sĩ ấy` ở `36.2`. Câu có thể đọc hai cách; không phán.
    · `5.1`–`7.1`: Pāli chỉ giữ từ đầu của kệ (`Alattakakatā`, `Aṭṭhapadakatā`, `Añjanīva navā`) rồi `… pe`; bản Việt dịch từng từ đó mà không bổ sung phần lược. `Aṭṭhapadakatā` → `kết thành tám lọn` theo `thag16.4:4.1`, `mn82:25.13` (nơi có `kesā` = tóc); trong khoá này không có chữ `tóc`, nên chủ thể là suy ra từ kệ song song. `7.1` `Añjanīva navā` → `Như hộp đựng thuốc bôi mắt mới` theo `thag16.4:5.1` (không kèm `cittā`).
    · `9.2` `saṅgātīto`: tôi hiểu `saṅga` là sự dính mắc (Sujato `got over clinging`; bản Việt hiện hành `đã vượt qua sự bám víu`); `sunibbuto` chỉ một tiền lệ.
    · `38.1` `patisso`: tôi giữ `Patissa` như tên riêng; có thể là dạng ngắn của Upatissa (tên của Sāriputta), nhưng bài `thag17.2` ghi tên bài là `Sāriputta`, nên không đồng nhất trong thân dịch. `38.3` `saṅkhātā`: `được tính`.
    · Bản Việt nguyên bài của sc-data (Bhikkhu Indacanda, theo bản BJT) có thêm hai kệ thợ săn (BJT 1025–1026) không có trong Pāli MS đã ghim; không dịch vì Pāli của bài này không có chúng (chúng có ở `mn82:25.21`–`24`, `thag16.4:6`).
    · Các cặp Pāli trùng nguyên văn ở `5.4`/`6.4`/`7.4` dùng cùng một câu Việt, dù ở `5`–`7` Pāli lược mất `Alaṁ bālassa mohāya` (`thag16.4:3.3`); `no ca pāragavesino` đứng một mình nên `không mê được người tìm bờ bên kia` đọc đủ nghĩa nhờ ngữ cảnh kệ trước.

