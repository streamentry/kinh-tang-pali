  CẤU TRÚC VÀ ĐỐI CHIẾU ANH. Bản Anh khớp ranh giới khoá Pāli (mỗi pāda một khoá). Bài kệ này là một tập ghép nhiều khúc. Nháy theo đúng từng khoá của Pāli: mở ở `1.1` đóng ở `23.4`; mở và đóng trong `24.1`–`24.4`; mở ở `25.1` đóng ở `33.4`; mở ở `34.1` đóng ở `36.4`; mở ở `37.1` đóng ở `37.4`. Pāli không đóng nháy ở `2.4` hay mở lại ở `3.1` như Sujato chia lời, nên bản Việt không thêm nháy nào. Cấu trúc: kệ `1`–`2` về chọn bạn (bậc trí và kẻ ác); kệ `3`–`7` là các kệ về thân thể trang điểm, song song với `thag16.4:1`–`5` và `mn82:25`, bị lược ngắn theo Pāli (chỉ giữ từ đầu và dòng cuối); kệ `8`–`10` nói về chính Ānanda ở ngôi thứ ba (Gotama là dòng họ của Ānanda); kệ `11`–`19` nói về học rộng và giữ Pháp; kệ `20`–`23` là lời ngài than về thân và sự mất mát; kệ `24`–`25` về việc tiếp những người từ nơi khác đến; kệ `26`–`33` kể hai mươi lăm năm hầu cận và nỗi khiếp đảm khi Đức Phật nhập bát-niết-bàn (kệ `33` cùng Pāli với `dn16:6.10.24`–`26`); kệ `34`–`36` ca ngợi Ānanda; kệ `37` là kệ kết khuôn thag.

  NĂM PHÉP KIỂM (tự viết, in kèm mẫu số).
    1. Tập khoá: Việt 159 = Pāli 159, thiếu 0, thừa 0, thứ tự bằng thứ tự Pāli.
    2. Nháy đơn và kép khớp Pāli từng khoá: 0/159 lệch. Tổng ký tự nháy ở Pāli 10 (`“` ở `1.1`, `24.1`, `25.1`, `34.1`, `37.1`; `”` ở `23.4`, `24.4`, `33.4`, `36.4`, `37.4`), Việt đúng 10 cùng khoá. Không có nháy đơn nào ở Pāli, nên Việt cũng không có.
    3. Pāli trùng nguyên văn TRONG CHÍNH bài: 13 nhóm (`3.1`/`4.1`; `3.2`/`4.2`/`5.2`/`6.2`/`7.2`; `3.3`/`4.3`/`5.3`/`6.3`/`7.3`; `5.4`/`6.4`/`7.4`; `18.1`/`34.1`/`35.1`; `18.2`/`34.2`/`35.2`; `18.3`/`34.3`/`35.3`; `24.1`/`25.1`; `26.1`–`30.1`; `26.2`/`27.2`; `26.4`/`27.4`; `28.2`/`29.2`/`30.2`; `28.4`/`29.4`/`30.4`). Cả 13 nhóm bản Việt giống nhau từng chữ, trừ nhóm `18.1`/`34.1`/`35.1` mà `34.1` thêm đúng dấu nháy mở như Pāli (`“Bahussuto…`). 0 nhóm khác ngoài lý do nháy. Phép này có mẫu, không rỗng.
