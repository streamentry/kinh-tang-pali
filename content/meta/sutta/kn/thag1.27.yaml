notes: |-
  Sujato dịch LỆCH THỨ TỰ Ở BÀI NÀY, VÀ PĀLI THẮNG. Bản Anh đặt "With my chest I'll thrust
  aside" ở 1.1 và "foster seclusion" ở 1.2 — nhưng Pāli 1.1 `Dabbaṁ kusaṁ poṭakilaṁ` và 1.2
  `usīraṁ muñjapabbajaṁ` là DANH SÁCH sáu loài cỏ; `Urasā panudissāmi` ("bằng ngực tôi dẹp lễ
  ra") mới là hành động và nằm ở 1.3. Tôi dịch theo Pāli.
  PĀLI TRÙNG NGUYÊN VĂN — ĐÃ DÙNG LẠI. `vivekamanubrūhayan”ti.` trùng y hệt `thag1.23:1.6`,
  nơi tầng đã dịch "và nuôi dưỡng sự thanh vắng”ti." — tôi dùng lại nguyên văn. (Ở `ja61:1.6`
  cùng vế này lại bị bỏ `ti`; tôi theo bản thag vì đây là bài thag.)
  Tên cây: giữ dạng Pāli kèm loại, theo đúng tiền lệ của tầng — `muñja` đã có "cỏ muñja"
  (snp1.2:11.3, snp3.2:16.1), `usīra` đã có "cỏ usīra" (dhp337:4). `kusa` và `poṭakila` chưa có
  tiền lệ (0 chỗ) nhưng cùng loại danh từ và cùng cách đặt, nên đặt mới theo đúng khuôn có sẵn
  thay vì bịa tên Việt cho cây.
  Dòng kết 1.5 giữ HAI dấu lược như Pāli (BRIEF_VI3 §10.1, không mở rộng); đo trên toàn bộ
  Theragāthā tại commit đã ghim thì 109/109 dòng kết đều có 2 dấu lược.
  Vì `cần` RỖNG, tôi tự quét MỌI khoá — sạch. Không chạy npm (đợt này cấm) nên technical_integrity
  = 9.6.
