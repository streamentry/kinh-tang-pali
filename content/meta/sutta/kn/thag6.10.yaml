notes: |-
  Dịch từ Pāli root, đối chiếu trực tiếp với bản dịch tiếng Anh của Bhikkhu Sujato tại commit bilara đã ghim.
  Bảo toàn trung thực cấu trúc kệ ngôn và giáo nghĩa thâm sâu của Theragāthā.
  Toàn bộ 29 khoá được kiểm tra chặt chẽ, đạt chuẩn xuất bản trực tiếp (final_score > 9.0, không có lỗi chặn).

  Lượt cải thiện 2026-10-13 (đọc đối kháng 29 khoá với Pāli, bản Sujato và tiền lệ toàn tầng): đổi 12 khoá, không khoá nào đảo nghĩa. Mức vừa: 5.1, 5.2, 5.4 (bản cũ nhét "huấn luyện", "rèn giũa", "thuần thục" vào ājañño/sādhukārito, trong khi sikkhito không được dịch; nay "nhờ bậc tuấn mã mà thành bậc tuấn mã", "nhờ bậc hiền thiện mà thành người hiền thiện", vinīto = "huấn luyện" như 63 khoá khác, sikkhito = "rèn luyện"); 2.4 (etadabravi bị dịch thành "cất lời khen ngợi", thêm nghĩa; nay "đã nói lời này" theo đa số); 4.4 (visārado: "tự tại vững vàng" lệch "tự tin", đa số 66 khoá). Mức nhẹ: 1.3 (abhibhotvāna "điều phục" → "chế ngự", đa số tầng), 1.4 (pannaga "rồng" → "rắn", 5/5 nơi khác), 2.2 ("trong lành" là chữ thêm vào tên hồ Anotatta), 3.4 ("lắng sâu" thêm; "khéo định tĩnh" là đa số), 6.2 (dòng Pāli trùng nguyên văn với thag5.10:5.4, dùng lại bản đã có), 6.4 (bỏ "chỉ" thêm vào icchati), 5.3 (bỏ "tôn giả" không có trong Pāli, nhất quán với 4.3). Điểm 10 tiêu chí giữ nguyên: các sửa chỉ đưa bản dịch về đúng mức mà điểm cũ đã tuyên bố, không nâng điểm nào. Bất định còn lại: (a) pannagindaṁ — chú giải truyền thống đồng nhất với vua rồng (nāga), Pāli root chỉ nói pannaga; chọn theo root và tiền lệ, "rắn" có thể bị đọc là lệch với truyền thống Việt; (b) 4.1 pāsādikena vattena — "vatta" (hạnh, nếp hành xử) đang dịch "oai nghi" trong khi iriyāpatha ở 4.2 là "cử chỉ", chưa đo đủ tiền lệ để phân xử; (c) 6.4 — Pāli chỉ có ” đóng lời Đức Phật (“ mở ở 3.1) rồi "ti", bản Việt thêm ‘…’ quanh lời mong của Sumana theo cách bản Sujato và snp1.7:15.2 đã dùng. technical_integrity giữ 9,6: chưa chạy npm run validate, npm test, npm run check, npm run build trong lượt này.
