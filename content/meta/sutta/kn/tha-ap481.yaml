notes: |-
  Dịch trực tiếp từ Pāli root, 78/78 khoá (75 khoá nội dung và 3 khoá đầu đề `:0.1-0.3`); không có tầng tham khảo nào để đối chiếu (đo và chứng cứ ở `blocking_errors`). Đã đọc đối chiếu từng cặp Pāli với Việt cả 78 khoá.
  `translationTitle` đặt BẰNG ĐÚNG khoá `:0.3`. Pāli `:0.3` là `Pānadhidāyakattheraapadāna`, không bắt đầu bằng chữ số, nên không có số thứ tự (quy tắc: giữ số khi và chỉ khi Pāli bắt đầu bằng số). Hình thức `Bài Kệ Tuyên Ngợ Về Trưởng Lão X` theo phạm vi gần nhất: Phẩm Vòng Hoa Sậy (tha-ap473, 475-480, 482) là 8 trên 8 tệp; tha-ap456-506 là 28 `Tuyên Ngợ` · 10 `Ký Sự` · 1 `Tuyên Ngôn`; toàn tầng 237 `Tuyên Ngợ` · 115 `Tuyên Ngôn` · 99 `Ký Sự` · 10 `Tuyên Ngợi` (đo 470 tệp). Tôi đi theo `Tuyên Ngợ` vì phạm vi gần nhất áp đảo; nếu người biên tập chốt `Tuyên Ngôn` hay `Ký Sự` cho cả cuốn thì sửa một lượt, không sửa riêng bài này. Cả `:0.3` lẫn `:21.1` dùng cùng hình thức; `navamaṁ` = `thứ chín`, khớp uddāna ở tha-ap482:12.1 (Pānadhi đứng thứ chín, sau Vallikāra).
  `Naḷamālivagga` → `Phẩm Vòng Hoa Sậy` (8/8 bài đã có trong phẩm); `Therāpadāna` giữ nguyên (457/470 tệp tầng tha-ap).
  Pāli trùng nguyên văn trong tầng `tha-ap`: 38 trên 69 dòng Pāli khác nhau (75 khoá nội dung, một số dòng lặp trong bài). Dùng lại nguyên văn bản dịch đã có ở 33/38; trùng cách dịch phổ biến nhất ở 28/38. Các dòng công thức `Kilesā jhāpitā mayhaṁ` · `viharāmi anāsavo` · `Svāgataṁ vata me āsi` · `kataṁ buddhassa sāsanaṁ` · `Paṭisambhidā catasso` · `…pe…` giữ cách dịch đa số; `Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti` dùng nhóm `…đã nói những bài kệ này` (số nhiều, khớp `imā gāthāyo`; nhóm này 407 khoá, nhóm số ít 21 khoá). Cố ý khác tiền lệ, có lý do: (a) `:16.3` chọn `Ta không còn biết đến đọa xứ,` (phạm vi tha-ap470-500 là 10/21, khớp 479-480) thay vì `Ta không biết mình rơi vào khổ đau,` (136/397 toàn tầng) vì `duggati` là đọa xứ; (b) `:9.3` `Padesarajjaṁ vipulaṁ` chọn `Vương quyền cai quản các vùng đất rộng lớn,` (2/12) thay cho `Vương quốc rộng lớn ấy,` (10/12) vì cách sau bỏ mất `padesa` (vùng) và thêm `ấy` không có trong Pāli; (c) `:11.2` `oraso dhammanimmito` chọn `là con ruột, do giáo pháp tạo nên;` (1/4) vì hai bản đa số `sinh ra từ giáo pháp ấy` bỏ mất `oraso`; (d) `:11.4` chọn `sẽ nhập Niết-bàn, không còn lậu hoặc.` (3/7) thay cho `sẽ vô lậu mà đi vào Niết-bàn’.` (4/7) vì cách sau thêm dấu nháy đóng mà Pāli `:11.4` không có (nháy đóng của Pāli nằm ở `:12.4`) và đảo `anāsavo` thành trạng ngữ; (e) `:14.4` đổi ngôi `tôi` thành `ta` cho khớp ngôi cả bài (tha-ap21, 337 dùng `tôi`; tha-ap120, 121 dùng `vị ấy`, không khớp Pāli ngôi nhất); (f) `:2.3` chọn `bậc Toàn Giác` cho `sambuddhaṁ` (5 khoá Pāli trùng ở tha-ap: `Toàn Giác` 2, `Chánh Đẳng Giác` 2, 1 khoá khác, nên không có đa số rõ; `Toàn Giác` khớp tha-ap30 và tha-ap337 cho `sambuddha`, còn `Chánh Đẳng Giác` tôi để cho `sammāsambuddha`); (g) `:5.4` bỏ `rồi` của tiền lệ vì Pāli không có `ca`/`atha`, và `:13.2` dùng `voi` (số nhiều, Pāli `hatthino`) thay `con voi`. Pāli lặp trong chính bài: 5 nhóm, ở 4 nhóm bản Việt giống nhau chỉ khác dấu nháy đầu/dấu câu theo Pāli (`:1.1`/`:5.1`, `:1.2`/`:5.2`, `:18.3`/`:19.3`, ba khoá `…pe…`); 1 nhóm cố ý khác: `Aparimeyye ito kappe,` ở `:10.1` là lời tiên tri của Đức Phật về tương lai (`bhavissati`) nên dịch `Sau vô lượng kiếp kể từ nay,`, còn ở `:16.1` là lời Trưởng lão nhìn lại quá khứ (`madāsahaṁ`) nên dịch `Vào vô lượng kiếp trước,` (giữ đúng bản đã có ở tha-ap276:3.1).
  Điều quan trọng nhất cần người biên tập biết: `pānadhi` dịch `đôi dép`, không phải `vật uống`. Bối cảnh bài không để chỗ cho nghĩa `vật uống`: `:3.2-3.3` lấy ra rồi đặt dưới chân Đức Phật, `:5.3` Ngài `abhirūhitvā` (bước lên) chính `pānadhi`, `:15.3` `Datvāna pānadhiṁ ekaṁ` là vật thí. Tôi đọc `pānadhi` là dép, giày và ghi bất định bên dưới. Ngoài lát, ghi nhận để người biên tập xem, kèm số: tha-ap214:1.4 và :3.4 dịch `pānadhi` là `vật uống` (cùng tên Trưởng lão `Pānadhidāyaka` với bài này; cần soát cả bài) và tha-ap258:2.2 dịch `yaṁ pānadhiṁ dadiṁ` là `ta đã trao tòa ghế ấy rồi`. Trong tầng tha-ap, `pānadhi` có 9 khoá ở 5 bài (tha-ap214, 222, 258, 262, 482); ba bài đầu là nghĩa vật uống, tòa ghế và tên riêng ở uddāna, nên chưa có tiền lệ dép nào để đối chiếu.
  Số và thuật ngữ: `Pañcapaññāsakkhattuñca` pañca 5 + paññāsa 50 = 55, `kkhattuṁ` là lần: `năm mươi lăm lần` (cùng cấu tạo với tha-ap431:11.3 `Aṭṭhapaññāsakkhattuñca` = 58, đã dịch `năm mươi tám lần`). `Sahassakkhattuṁ` = một ngàn lần. `Aparimeyye` = vô lượng; không có cụm `Tiṁsakappasahassa` ở bài này, nên bất định `tiṁsa` = 30 hay `tiṁsakappasahassa` = 3.000 hay 300.000 không áp dụng. `Anomadassī` dịch `Bậc Vô Tỳ Nhiễm` theo dòng Pāli trùng nguyên văn ở tha-ap70:1.1 và tha-ap178:1.1 (2/2); trong tầng, `anomadassī` được dịch `Vô Tỳ Nhiễm` ở 4 khoá thuộc 2 bài (tha-ap70, 178) và giữ nguyên `Anomadassī` ở 2 khoá thuộc tha-ap148, nên cùng một danh hiệu có hai cách và cần gộp. `Okkāka`, `Gotama`, `Pānadhidāyaka` giữ Pāli. `sugatinda` chưa có tiền lệ: dịch `bậc Chúa của các bậc Thiện Thệ` (`sugata` + `inda`). `mahāvīra` → `bậc Đại Hùng` (tha-ap30:4.1, ja313, mil7.3.4, mil7.4.9), `vināyaka` → `bậc Điều Ngự` (3/6), `cakkhumā` → `có mắt sáng` (snp1.9 hai khoá, snp3.11 một khoá), `chijjamānesu` → `đang được cắt` (không có tiền lệ), `vājañña` → `ngựa thuần chủng` (ja24 `Ngựa Thuần Chủng`), `devarajjaṁ karissati` → `sẽ nắm quyền cai trị cõi trời` (tha-ap20, 36, 45), `cakkavattī` → `Chuyển Luân Vương`, `vāṇijjaṁ suppayojitaṁ` → `một việc trao đổi được sắp đặt chu đáo` (tha-ap450:6.2, 1/1; `vāṇijja` là buôn bán, nên cách này hơi mờ nhưng giữ để cùng một dòng Pāli có cùng bản dịch), `acalaṁ padaṁ` → `nơi không lay chuyển` (tha-ap434, 504). Ngôi thứ nhất chọn `ta` cho toàn bài, theo các bài cùng phẩm (tha-ap473, 475-480, 482) và khối kết `ta sống không còn lậu hoặc`.
  Bất định, ghi ở đây chứ không giải thích trong thân kinh: (1) `pānadhi` đọc là dép (chiếc hay đôi?): Pāli ở số ít (`pānadhiṁ`), số nhiều ở `:8.1` `Pānadhīnaṁ padānena`; tôi viết `đôi dép` ở các câu một vật và `dép` ở `:8.1`, không khẳng định rõ đôi hay chiếc. (2) `:1.4` `pathamāruhi` đọc là `pathaṁ āruhi` (bước lên đường) vì `:2.2` `addhānaṁ paṭipajjahaṁ` và `:2.4` `pattikaṁ` cho thấy Đức Phật đang đi trên đường; không đọc `pathama` (đầu tiên) vì không có chỗ cho nghĩa đó. Chưa tìm được tiền lệ trong tầng để đối chiếu. (3) `:2.4` `pattikaṁ` đọc là `đang đi bộ` (pattika là người đi bộ), không phải quân bộ binh; `cārudassanaṁ` dịch `dung mạo đẹp đẽ`. (4) `:4.2` `sugatinda` có thể là `bậc Thiện Thệ tối thượng` hoặc `chúa của các bậc Thiện Thệ`; tôi chọn nghĩa thứ hai, giữ đúng cấu tạo từ. (5) `:4.1` `Abhirūha` là mệnh lệnh trần; tôi thêm `Xin` vì ngữ khí cầu thỉnh với Đức Phật, không thêm nội dung. (6) `:4.4` `attho` đọc là `mục đích` (cũng có thể là lợi ích). (7) `:12.3-12.4` `Devayānapaṭibhāgaṁ yānaṁ` đọc là `một cỗ xe giống như cỗ xe của chư thiên`: `paṭibhāga` là tương tự, không phải đúng bằng; dòng Pāli tách `yānaṁ` sang `:12.4` nên bản Việt cũng tách theo. (8) `:13.1` `vayhaṁ` là một loại xe hay phương tiện chuyên chở; tôi dịch `xe cộ` (chưa có tiền lệ, không phân xử được loại cụ thể). (9) `:14.1-14.4` `Agārā nikkhamantopi` đọc là `Ngay cả khi rời khỏi nhà` (vừa xuất gia), `Kesesu chijjamānesu` là `khi tóc đang được cắt`; không thêm `cạo` hay `đạt`. (10) `:15.1` `Lābhā mayhaṁ suladdhaṁ me` đọc là `Lợi lạc của ta, ta đã khéo đạt được`, chưa có tiền lệ cho dòng này. (11) `:8.2` `sukhitoyaṁ` đọc là `sukhito ayaṁ` (người này sẽ được an vui), không đọc `sukhito` làm danh xưng. (12) Pāli `:4.4`, `:6.4`, `:12.4` kết bằng nháy đơn đóng `’` và `:1.1` mở ngoặc kép, `:19.3` đóng: lời tiên tri của chư thiên dài từ `:8.1` đến `:12.4`; bản Việt khớp Pāli từng khoá.
  Dấu lược: 3 khoá `…pe…` (`:17.2`, `:18.2`, `:19.2`) → đúng một `…` mỗi khoá, khớp Pāli 3/3; Pāli không có `…` trần và không có `(…)`. Dấu nháy: nháy đơn `‘` mở ở `:4.1`, `:6.1`, `:8.1`; `’` đóng ở `:4.4`, `:6.4`, `:12.4`; ngoặc kép `“` mở ở `:1.1`, `”` đóng ở `:19.3`; bản Việt khớp Pāli từng khoá (0 lệch trên 78 khoá).
  Cổng kỹ thuật CHƯA chạy vì không được phép chạy lệnh npm. Chỉ xác minh được: JSON hợp lệ, `set(khoá Việt) == set(khoá Pāli)` (78/78, đúng thứ tự), NFC, không khoá rỗng, không khoảng trắng thừa, nháy khớp Pāli 78/78, dấu `…` khớp Pāli, không Pāli lọt sang bản Việt ngoài tên riêng (`Therāpadāna`, `Pānadhidāyaka`, `Okkāka`), YAML parse sạch. Bốn lệnh để coordinator chạy trước khi coi `technical_integrity: 9.6` là đạt: `npm run validate`, `npm test`, `npm run check`, `npm run build`.
