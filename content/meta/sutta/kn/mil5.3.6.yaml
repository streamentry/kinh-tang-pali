    DÙNG LẤI NGUYÊN VĂN — nhiều nhất trong lát này. 0.1 Milindapañha (199/210),
    0.2 Meṇḍakapañha (26/36; nhóm cạnh tranh là Câu Hỏi Nan Đề 4 và Những Câu Hỏi Hóc Búa
    2), 0.3 Paṇāmitavagga (8/11), 3.3 và 6.3 Katame dve? = Thế nào là hai? (59/103),
    3.10 Ayampi ubhato koṭiko pañho (đa số 5/26 là Câu hỏi hai đầu này đã đến với ngài, xin
    ngài hãy giải quyết; nhóm kế cạnh là Đây là câu hỏi hai đầu mối khó khăn… 4/26 — chỉ 5
    là áp đảo nên tôi ghi số đếm chứ không gọi là tuyệt đảo).
    Bốn câu kệ Cunda ở 2.1-2.4 và 5.1-5.4: 5.2 và 5.3 trùng nguyên văn dn16:4.20.7 và
    dn16:4.20.8; 2.1, 5.1 và 2.4, 5.4 chỉ khác `cundaṁ`/`Cundassa` nên tôi dịch theo đúng
    khung của dn16: Ăn xong bữa ăn / của Cunda thợ rèn — tôi được nghe; / bậc kiên nhẫn gặp căn
    bệnh / dữ dội, đưa đến bờ chết. Vế `Ābādhaṁ samphusī dhīro` của dn16 là bậc kiên nhẫn gặp
    căn bệnh còn của ud8.5 là bậc trí bị bệnh chạm đến; tôi theo dn16 vì cả bài đối thoại vua
    Cunda với Đức Phật.
    3.2, 3.5, 6.2 theo dn16:4.42.8 và dn16:4.42.11; vế mở đầu của 3.4 và 6.4 theo
    dn16:4.42.10 (món khất thực mà sau khi ăn xong Như Lai giác ngộ Chánh Đẳng Giác vô
    thượng; món khất thực mà sau khi ăn xong Như Lai diệt độ vào giới Niết-bàn không dư y).

    `piṇḍapāta` = MÓN KHẤT THỰC, xuyên suốt cả bài kể cả tiêu đề (0.4 và 15.1). Nháp đầu tôi
    viết món trai đàn ở 7.2 và ở tiêu đề, rồi đổi sang món khất thực để tiêu đề và thân
    bài nói cùng một thứ với dn16:4.42. Ghi ra vì đây là thay đổi trong lượt review.

    NHỮNG CỤM CHƯA CÓ TIỀN LỆ (đã tra, đều 0): `anupubbavihāra` tôi dịch là tầng tiến
    trình theo sn16.10:6.4 (Chín sự an trú tiến trình); `navānupubbavihāra` là chín tầng tiến
    trình; `anulomappaṭiloma` là theo thứ lũy rồi theo thứ giảm;
    `dhammānumajjanasamāpatti` là sự tôn trọng và quyến lý Pháp, còn
    `anumajjanasamāpatti` là sự tôn trọng và quyến lý; `pakatidubbala sarīra` là thân
    xá-lợi khó chịu; `paramadāna` là sự ban cho tối thượng. `āyusaṅkhāra` tôi dùng dòng thọ;
    dn16:3.10.2 dùng lực mạng — hai cách, tôi ghi để người biên tập chọn.

    DẤU LƯỢC. Pāli của bài này không có dấu lược nào, bản Việt cũng không thêm một dấu nào.

    NĂNG LỖI LỚN TÔI BẮT ĐƯỢC Ở LƯỢT REVIEW ĐỐI KHÁNG — CẢ BA ĐỀU LÀ LỖI THẬT.
    (1) 3.8 tôi đã bạch sai người: Pāli là `Kiṁ nu kho, bhante nāgasena` (bạch tôn giả
    Nāgasena) nhưng nháp đầu tôi viết Này Đại vương, tức bạch nhầm vua; đã sửa. Đây là lỗi
    về chủ thể, nặng hơn lỗi văn phong.
    (2) 9.1 tôi dịch sai thí dụ dòng nước: `soto pakatiyā sandamāno abhivuṭṭhe mahāmeghe`
    là dòng sông vốn chảy trong bếp của chính nó, khi một cơn mưa lớn hòa vào mới thành
    dòng nước dữ dội; nháp đầu tôi viết thêm vào một dòng đã đầy, tức bịa thêm một vế
    không có trong Pāli. Đã sửa.
    (3) 10.1 `abhisannadhātu kucchi aññasmiṁ ajjhoharite` là hơi thở hít thêm vào khoảng
    trống trong bụng thì khó thở hơn; nháp đầu tôi viết hơi thở bị kìm trong lồng ngực, tức
    đổi nghĩa. Đã sửa.
    Ngoài ra 3.9 tôi làm lại `lohitapakkhandikā` (một đám đông bị nhuốm đỏ) cho đỡ nặng
    nề, và 3.7 bỏ hai chữ thì chồng nhau.

    BẤT ĐỊNH CÒN MỞ. (1) 3.9 `etthāyaṁ jano sammūḷho lobhavasena atibahuṁ khāyitena
    lohitapakkhandikā uppannāti` — chuỗi nhân quả gồm lòng tham, lời tán dương quá nhiều, và
    đám đông sinh ra rồi tin vào. Tôi đặt lòng tham trước cho câu đọc được; cách đọc khác là
    lời tán dương là nguyên nhân trực tiếp còn lòng tham là động cơ. Tôi không tự quyết
    được, ghi ở đây. (2) 0.4 và 15.1 `Piṇḍapātamahapphalapañha` tôi dịch là Câu hỏi về
    món khất thực có quả báu lớn; cách khác là Câu hỏi về lễ trai đàn và quả báu lớn, tôi
    đã dùng cách sau trong nháp đầu rồi bỏ vì không khớp với cách dịch `piṇḍapāta` trong
    thân bài.

