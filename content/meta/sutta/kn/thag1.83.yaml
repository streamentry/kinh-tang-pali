notes: |-

  **Tầng Anh có mặt nhưng thiếu đúng một khoá.** 8/9 khoá có tiếng Anh Sujato tại commit đã ghim. Khoá thiếu là dòng kết *… X thero ….* (`:1.5`), vốn là dạng lược của công thức quy kết *Itthaṁ sudaṁ … gāthaṁ abhāsitthāti*. Tôi **không** mở rộng dòng kết: BRIEF_VI3 §10.1 nói thẳng *Pāli có dấu lược thì bản Việt giữ nguyên, không bao giờ mở rộng* — mở rộng là thêm chữ KHÔNG ĐÁNH DẤU, và đã có tiền lệ sai thật (ba ngọn lửa `rāgagginā…` bị nhân sang `sn35.29:1.15`). Tiền lệ có sẵn trên đĩa làm đúng như vậy và đã `published`: `thag1.42` là ngoại lệ ngược lại, tôi **không** theo. Số dấu lược của mọi khoá `:1.5` bằng Pāli (2 = 2). Không đối chiếu được tầng Việt hiện hành như đã nói ở trên.
  **Đặt kinh theo thứ tự khoá của lát này** (`0.1` = Theragāthā + số · `0.2` = Ekakanipāta · `0.3` = vagga · `0.4` = tên bài kệ) — cùng thứ tự với `thag1.42`, `thag1.107`, bài đã `published`. `Ekakanipāta` → *Bộ Một Bài Kinh* (159 lần trong tầng kn; chỉ `thag1.1:0.2` viết *Tập Một*). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>* (25 lần, so với 4 lần *Bài Kệ…*). `Theragāthā 1.N` giữ **số** như `thag1.42:0.1`. ở `:1.5` Pāli dùng dạng chủ cách (*Cittako*, *Suppiyo*, *Suyāmano*…); bản Việt dùng dạng gốc để thống nhất với tên bài kệ, đúng cách `thag1.113` (`Vanavaccho` → *Vanavaccha*), `thag1.34` (`Posiyo` → *Posiya*), `thag1.46` (`Samiddhitthero` → *Samiddhi*) đã làm.

  **Tên riêng giữ nguyên dạng Pāli** và đều xác minh được trong Pāli đã ghim (không phải đặt mới): Sīha, Cittaka, Suppiya, Mettaji (thẳng); Ramaṇīyavihārin, Añjanavaniya, Vimalakoṇḍañña, Suyāmana (giữ âm, dạng gốc). `lọt_pāli` trong `_hvi.py` chỉ quét khoá Pāli ≥ 40 ký tự mà mọi khoá của Theragāthā đều ngắn hơn, nên tên có dấu ở đây không bị chặn; tôi vẫn tra lại từng tên.
  **Từ chối nhập chữ từ bản Anh — đã bắt được.** Sujato dịch `:1.4` là *and quickly discard this bag of bones*. Pāli khoá đó là `jaha sīghaṁ samussayan”ti.` — **không có** *bag of bones*, cũng không có động từ *discard*; `samussayana` là *lao tới, xông vào*. Tôi dịch *và hãy lao tới mau như sư tử* và **không** nhập ẩn dụ của Sujato. Cùng loại lỗi với `thag1.22` (`Karaṁvī`), và cả hai đều vi phạm đúng cái điều BRIEF_VI3 §10.1 gọi là thêm chữ không đánh dấu.

  **Thuật ngữ, đếm được.** `sīha` → *sư tử* (129 tiền lệ; `an5.99`, `an4.33` → *Kinh Con Sư Tử*, `ja162` → *Vua sư tử*, `snp3.6` → *là sư tử không chấp thủ*). `appamatta` → *không phóng dật* (`snp3.12` *sống không phóng dật, tinh cần, quyết tâm*). `kusalaṁ dhammaṁ` → *thiện pháp* — tiền lệ **rất khớp**: `ja55:1.x` và `ja56` đã dịch `Bhāveti kusalaṁ dhammaṁ` thành *trau dồi thiện pháp*, và `iti16` dịch `akusalaṁ … kusalaṁ bhāvetī` thành *từ bỏ điều bất thiện, tu tập điều thiện*. `sīgha` → *mau*; `samussayana` **0 tiền lệ**, tôi dịch *lao tới*.

  **Bất định đã ghi.** `rattindivamatandito` ở `:1.2` là danh từ tính bổ nghĩa cho chủ thể đang nói (*đã mệt mỏi suốt ngày đêm*), và trong kệ nó đứng ngay sau mệnh lệnh ở 1.1, nên tôi dịch *dù suốt ngày đêm đã mệt mỏi* — **chữ *dù* là cách nhấn nhượng bổ nghĩa**, Pāli không có từ nhượng bừng. Ghi ra đây vì đó là chỗ duy nhất tôi thêm chức năng câu. Nếu bám sát hơn thì phải viết *dù đã mệt mỏi suốt ngày đêm* với *đã* quanh chữ *mệt mỏi*.**Kiểm kỹ thuật.** Chạy `save_vi` hai lần: idempotent, tệp trên đĩa không đổi. Tôi tự quét lại **mọi** khoá chứ không chỉ khoá ≥ 40 ký tự như `_hvi.py` làm — ở lát này chỉ 0/155 khoá Pāli đủ 40 ký tự, nên chốt tự kiểm 0% và assertion còn lại không tự chạy; phần tôi tự kiểm: 9/n khoá có mặt và không thừa khoá, đúng segment ID, mọi chuỗi NFC, không khoá rỗng, không khoá nội dung nào trùng nguyên văn Pāli, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài và không bao giờ âm, không còn `(…)`, không Pāli lọt vào bản Việt. Tôi **không** chạy `npm run validate|test|check|build` (lát này cấm; người điều phối chạy tập trung), nên `technical_integrity` chấm 9.6 chứ không phải 10.0.

  **Không có tầng Việt hiện hành để đối chiếu.** Tại commit đã ghim, `translation/vi/` của bilara chỉ chứa Pháp Cú, nên Theragāthā 1.N Aṅguttara Nikāya 11 không có bản Hòa thượng Thích Minh Châu. Đây là giới hạn của bản chụp upstream, không phải thiếu sót của kho; `triangulation` vì thế là Pāli + English Sujato.
