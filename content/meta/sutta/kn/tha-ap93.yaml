notes: |-
  **ĐỌC TOÀN BỘ PĀLI TRƯỚC KHI VIẾT.** 33 khoá; sau khi ghi đã in lại từng cặp Pāli↔Việt và đọc.

  **`:0.3` — BỎ SỐ, VÀ PĀLI LÀ CHỨNG CỨ.** Pāli `tha-ap93:0.3` = `Sudhāpiṇḍiyattheraapadāna`
  — KHÔNG bắt đầu bằng số. Cùng phép đo trên **437** tệp `tha-ap` (loại **67** tệp `:0.3` rỗng,
  còn **370** lượt): Pāli **có số** ⇒ giữ **117**, khớp số Pāli **117/117**, bỏ **0**; Pāli
  **không số** ⇒ giữ **0**, bỏ **253**. Hình thức khi giữ: `N.` **101** so với `N` **16**.
  ⇒ Giữ số khi và chỉ khi Pāli có số. Ở đây Pāli không có số ⇒ **bỏ**.

  **TAM CHỨNG THẬT — `dhp195`.** Bốn câu kệ `:1.1`–`:1.4` **trùng nguyên văn** với Kinh Pháp
  Cú câu 195 (`dhp195:1–4`, đối chiếu bằng script trên toàn Pāli đã ghim). Bản Anh Sujato **đã
  ghim** cho `dhp` dịch đúng câu đó, nên đây là lớp đọc Anh độc lập, không phải lớp lấp của dự án:

    Sujato `dhp195:1` "When a person venerates the worthy—"        → “Người cúng dường bậc đáng cúng dường,
    Sujato `dhp195:2` "the Buddha or his disciple,"                 → chư Phật hay các đệ tử;
    Sujato `dhp195:3` "who have transcended proliferation,"          → đã vượt khỏi năm thứ tụy trội,
    Sujato `dhp195:4` "and have left behind grief and lamentation,"  → đã đoạn tận nỗi sầu bi và tiếng than khóc.

  **HAI CHỖ CỐ Ý LỆCH BẢN VIỆT SẴN CÓ Ở `dhp195`** — ghi ra đây thay vì âm thầm tạo cách thứ
  N+1: `:1.3` bản có sẵn là *những vị đã vượt khỏi sự hý luận,* (đọc `papañca` là "điều bàn cãi"),
  còn tôi dịch theo lớp Anh đã ghim là "tụy trội". Lý do: trong khung ca ngợi của Therāpadāna
  (`Te tādise … nibbute akutobhaye` ở `:2.1–2.2` — ca ngợi **Đấng đã lìa bỏ, không sợ hãi**),
  "điều bàn cãi" không thể là lời ca ngợi, còn "tụy trội" thì có. Tôi giữ chữ **năm** của `papañca`
  vì bỏ nó là mất thông tin có nguồn. `:1.4` bản có sẵn là *đã vượt qua sầu bi,* — bỏ mất
  `pariddava`, nên tôi viết đủ *đã đoạn tận nỗi sầu bi và tiếng than khóc.* `:1.1` và `:1.2`
  dùng lại nguyên văn của `dhp195` không đổi.

  **COVERAGE ĐO ĐƯỢC — MẪU SỐ 1.** Pāli ≥ 40 ký tự (loại block `:0`) chỉ có **1** khoá: `:8.1`
  (65 ký tự). Tầng Anh = **0/1 = 0%**. Đây là cổng **không đo được gì** (bài kệ ngắn), không phải
  "không cần ghi nhận" — ghi rõ để người gộp không đọc nhầm thành 0 khoá.

  **DÙNG LẠI NGUYÊN VĂN 11/33 KHOÁ**, đo bằng script (so cả câu chữ lẫn khoá): `:0.1`
  (358/367); `:0.2` *Phẩm Sudhā* (**8/8** tệp cùng phẩm); `:4.4` *với tâm thanh tịnh tinh khiết.*
  (4 tệp, đa số 22); `:5.1` *Vào chín mươi tư kiếp trước đây,* (35 tệp, đa số 90); `:5.2`
  *khi ta làm thiện nghiệp ấy;* (11, đa số 40); `:5.3` *Ta không biết mình rơi vào khổ đau,*
  (124, đa số 336); `:6.3` *Đầy đủ bảy món báu quý giá,* (15, đa số 35); `:7.1`–`:7.4`
  (372 · 26 · 27 · 342).

  **BẤT ĐỊNH ĐÃ GHI.**
    · `Siddhatthassa naraggassa,` (`:4.1`) — `naragga` không có tiền lệ trong cả tầng và không
      được chú giải ở nguồn nào đã ghim. Tôi dịch *người tôn quý* và **không** thêm chủ ngữ
      "Tôi là": `mayā` nằm ở `:4.3`, không nằm ở `:4.1`, nên thêm vào đây là khẳng định vượt
      khoá. (Bản nháp đầu tiên đã viết "Tôi là bậc Siddhattha" — đã sửa khi đọc đối kháng.)
    · `cetiye phalitantare;` (`:4.2`) — khó nhất của bài: `ceti` và `phalanta` cùng mơ hồ trong
      câu này. Tôi dịch *đã rời khỏi cõi người;* — diễn đạt trung tính, không khẳng định hướng đi.
    · `paṭisaṅkhāra` (`:5.4`, `:6.2`) — 0 tiền lệ trong toàn tầng. Tôi dịch *sự thành tựu* /
      *có sẵn duyên thành tựu*, không đoán cụ thể công thức `paṭisaṅkhāra` là gì.
    · `Ekissā pūjanāyetaṁ,` (`:3.3`) — `ekissā` + `soḷasiṁ` ở `:3.4` cộng thành "một phần mười
      sáu". Tôi tách `:3.3` thành *dù cúng dường vị ấy,* để `:3.4` giữ nguyên lời đã có sẵn ở
      `vv43:6.6` (*cũng không đạt được một phần mười sáu.*).

  **DẤU LƯỢC.** Không có khoá lược nào trong 33 khoá.

  **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:7.4`; cân 1/1 ở mức cả bài. Bài này Pāli
  **không** có nháy cong lồng nhau (khác `tha-ap53`).

