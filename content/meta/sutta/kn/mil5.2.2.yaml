notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng tham khảo tiếng Anh nào ở commit đã ghim cho uid này.
  Tiền lệ đếm được (khớp trên giá trị Pāli tuyệt đối, không phải trên chuỗi Việt): `Milindapañha` -> Milindapañha 194/205 bài mil; `Meṇḍakapañha` -> Meṇḍakapañha 24/34 (4 bài dùng Câu Hỏi Nan Đề, 2 Phẩm Meṇḍakapañha, 2 Những Câu Hỏi Hóc Búa, 2 Những Câu Hỏi Lưỡng Đao — theo đa số); `Abhejjavagga` -> Phẩm Không Thể Phá Vỡ 3/4 (đúng mil5.2.1/6/8, cùng phẩm).
  Bộ bốn loại câu hỏi dùng lại nguyên văn theo an4.42:1.3-1.6 — cần được trả lời dứt khoát / bằng sự phân tích / bằng câu hỏi đối chất / cần được đặt qua một bên. an3.67:2.2-2.3 có bộ bốn khác (cần phân tích / cần hỏi ngược lại / cần đặt sang bên, 4 câu ở toàn tầng); chọn an4.42 vì CÙNG THỨ TỰ và cùng công thức với mil5.2.2:2.4. Người điều phối có thể muốn thống nhất hai bộ này sau.
  Danh sách bảy vị trí `ṭhapanīya` ở 6.2-6.13 trùng nguyên văn với mn63:7.4-7.21, nên DÙNG LẠI NGUYÊN VĂN bản dịch mn63 (Thế giới là thường còn / thế giới hữu biên / thế giới vô biên / mạng sống và thân thể là một / sau khi chết, Như Lai còn tồn tại …).
  `mālukyaputta` -> Māluṅkyaputta theo mn63/mn64/mn70 và an4.257/263. `Bhante nāgasena` -> Bạch ngài Nāgasena theo đúng công thức mil5.2.1:1.1 / mil5.2.6:1.1 / mil5.2.7:1.1 (nguyên văn Pāli giống hệt nhau); `bhagavā/bhagavatā` -> Thế Tôn; `mahārāja` -> này Đại vương / tâu đại vương / thưa đại vương theo mil5.2.1/6/7/8.
  BẤT ĐỊNH ghi lại: (1) `ācariyamuṭṭhī` (1.2/1.5/2.1/1.6) dịch cẩn trọng — không có tiền lệ nào trong 1.794 bài Việt đã có; cẩn trọng 45 so với chu đáo 46 ở toàn tầng, lấy theo nghĩa của `ācariya`+`muṭṭhi`. (2) `guyhakaraṇena` (1.2/1.3/2.1) dịch kẻ cố giấu — 0 tiền lệ; tiến trình này có thể là vụng về. (3) `dvayanto ekantanissito` (1.3) và `tena hi … ajānantena na byākataṁ` (1.5) là lập luận nối tiếp của Na-gasena; bản dịch giữ đúng hai vế nhưng không thêm giải thích nào vào thân kinh. (4) `Abyākaraṇīyapañha` (0.4/8.1) dịch Câu Hỏi Cần Được Trả Lời — 0 tiền lệ; theo nghĩa `abyākaraṇīya` mà an4.42 đã dùng.
  Dấu lược: 6 khoá có `…pe…` ở Pāli (3.3, 3.4, 3.5, 4.3, 4.4, 4.5), mỗi khoá giữ ĐÚNG MỘT `…`; đếm lược khớp 6 = 6, không mở rộng.
  Chốt `_hvi.py` sạch: thiếu 0/22 khoá có nội dung, khoá thừa 0, NFC OK, ngoặc kép cân trên cả 49 khoá, không trùng nguyên văn Pāli (hai khoá giữ nguyên là `Milindapañha` ở 0.1 và `Meṇḍakapañha` ở 0.2, thuộc khối tiêu đề `:0` mà dự án cố ý giữ).
  Chênh lệch cần người điều phối gộp: lát này dùng Bạch ngài Nāgasena cho mil5.2.2 (đúng số đo trong mil5.2.x) nhưng Thưa tôn giả Nāgasena cho mil6.3.3 (đúng số đo trong mil6.3.7/8/9 cùng phẩm và là đa số toàn mil: 174 so với 114). Hai bài khác sách nên khác cách xưng hô; nếu muốn một cách duy nhất thì phải chọn và sửa cả hai.
  `Meṇḍakapañha` ở 0.2 giữ Pāli theo đa số 24/34; nhưng 4 bài mil5.2.x cùng phẩm lại dùng Câu Hỏi Nan Đề. Không tự tạo cách thứ N+1 — đã theo đa số và ghi ở đây.
