notes: |-
  Dịch trực tiếp từ Pāli root, đủ 98/98 khoá, thứ tự khoá như Pāli; commit đã ghim không có bản Anh cho toàn bộ `thi-ap`.
  Đại từ ngôi thứ nhất dùng con, khớp thi-ap12 và thi-ap13 (cùng Phẩm Ekūposathika, cùng công thức kết) và thi-ap2/3/4. Đo cả nhóm thi-ap: 7 bài nghiêng về con, 9 về tôi, 3 về ta; chọn theo phạm vi gần nhất (cùng phẩm).
  `:0.3` Pāli là `Ekāsanadāyikātherīapadāna` không bắt đầu bằng số nên không giữ số thứ tự; translationTitle bằng đúng `:0.3` và `:26.1` kết bằng `thứ tư`. Tên người `Ekāsanadāyikā` giữ Pāli theo thi-ap3 (`Maṇḍapadāyikā`) và tha-ap `Ekāsanadāyaka`.
  Hình thức `Tuyên Ngợ` ở `:0.3`/`:26.1`: nhóm thi-ap 36 khoá `Tuyên Ngợ` / 2 `Tuyên Ngôn`; nhóm tha-ap 479 / 250 (thêm 20 `Tuyên Ngợi`). Hai phạm vi cùng nghiêng về `Tuyên Ngợ` nên giữ nhất quán với phạm vi gần nhất; chữ này có dấu hiệu là lỗi chính tả của tầng, người biên tập nên phán một lượt cho cả cuốn.
  `Ekūposathikavagga` → Phẩm Ekūposathika theo thi-ap12/13/16 (Uposatha giữ Pāli). `Haṁsavatiyā` → Haṁsavatī (5 chỗ trong tầng đều có dấu). `bālikā` → bé gái.
  Công thức lời kết `Itthaṁ sudaṁ … abhāsitthāti` dịch nhóm `đã nói những bài kệ này` (số nhiều, khớp `imā gāthāyo`), theo thi-ap12/13 và nhóm 407 khoá của tầng.
  Dùng lại nguyên văn tiền lệ: 7.1–7.2 (`Tena kammena sukatena, cetanāpaṇidhīhi ca`; riêng `cetanāpaṇidhīhi ca` 26/30 khoá đã dịch cùng một cách); 3.3 (`Pasannacittā sumanā`, thi-ap13/16/5); 6.3 (`Tassa pattaṁ gahetvāna`, thi-ap6); 14.2 (`devatte atha mānuse`, 2 chỗ); 19.1 (`Maṇḍape rukkhamūle vā`, tha-ap340/416); 19.3 (`Mama saṅkappamaññāya`, 24/30 khoá dùng `Nhờ thấu rõ ý định của ta/tôi`); 20.1 (`Ayaṁ pacchimako mayhaṁ`, 3 chỗ); 22.1–24.3 (thi-ap12/13); 7.4 (`tāvatiṁsamagacchahaṁ`, 19 chỗ dạng `đã đến cõi trời Ba mươi ba`); 15.2 `Sát-đế-lợi` (480 chỗ so với 3 `Sát-đế-lỵ`, 6 `Sát-lỵ`); 9.2 pha lê (36 so với 2 `pha-lê`); 9.3 hồng ngọc (25 chỗ); 17.1 `dhātī` → vú nuôi (8 chỗ); 5.2 `mahāmuni` → bậc Đại Mâu-ni (nhóm đa số của tầng); 5.3 `Anukampaṁ upādāya` → vì lòng thương xót; 13.3 `Bhoge me ūnatā natthi` → không hề thiếu thốn (3 chỗ); 20.2 `carimo vattate bhavo` → đang diễn ra (tiền lệ tha-ap); 21.1 `Satasahassito kappe` → một trăm ngàn đại kiếp trước (23 chỗ so với 6 chỗ `kiếp trước đây`).
  Tên các tấm trải theo dn1:1.15.2: `gonaka` → tấm phủ len lông dài, `vikatikā` → tấm phủ thêu hình thú, `tūlikā` → nệm bông, `cittaka` → tấm phủ nhiều màu, `kaṭṭissa` → tấm phủ lụa, `uddalomī`/`ekantalomī` → tấm phủ lông hai mặt/một mặt; `pallaṅka` → ghế dài (dn1, an3.63; tha-ap dùng ghế). `Uddaekantalomī` là một từ ghép của `uddalomī ca ekantalomī ca`, dịch tách hai vế.
  Số Pāli: `Saṭṭhiyojana` = saṭṭhi 60 + yojana → sáu mươi do-tuần; `tiṁsayojana` = tiṁsa 30 + yojana → ba mươi do-tuần (`tiṁsa` = 30 theo `tiṁsayojanamāyāmaṁ` → dài ba mươi do-tuần và `Tiṁsakappāni devesu` → ba mươi kiếp trong tầng); `Asīti` = 80; `Sattati` = 70 (khớp `Sattatidevarājūnaṁ` → bảy mươi); `Duve` = hai; `Satasahassa` = 100 × 1000 = một trăm ngàn. Cụm `Tiṁsakappasahassa` không có trong bài này, nên bất định về cụm đó không liên quan.
  `Saṭṭhiyojanamubbedhaṁ`: dịch `cao sáu mươi do-tuần` (`ubbedha` = chiều cao, đối với `vitthata` = chiều rộng). Tiền lệ duy nhất trong tầng (1 chỗ) viết `rộng sáu mươi do-tuần` là hiểu `ubbedha` thành bề rộng; đã đo và không theo vì từ nguyên rõ, đồng thời `tiṁsayojanavitthataṁ` trong cùng khoá kệ đã mang nghĩa rộng. Chỗ cũ ở ngoài lát này, chỉ báo.
  Ghi nhận bất định: 4.4 `kālo cevettha mehiti` — dạng `mehiti` (`m` đệm + `ehiti`, như `gehamehiti` ở pv15:22.2) và `kālo` không có tiền lệ nào trong tầng, không có bản Anh để đối chiếu; dịch sát chữ `và thời điểm sẽ đến ngay nơi đây`, không nói thời điểm của việc gì. Cách hiểu hợp lý là giờ trưa đang đến cao điểm hoặc giờ khất thực sắp đến, nhưng Pāli không nói nên không thêm vào thân kinh. 6.4 `yathārandhaṁ adāsahaṁ` — `randha` ở đây là `đã nấu`, tân ngữ không nêu; dịch `đã dâng theo những gì đã được nấu sẵn`, 0 tiền lệ cho `yathārandhaṁ`. 17.2 `khujjā celāpikā` — `celāpikā` là hạng người hầu nữ (có thể là người lùn); dịch `người gù lưng và người lùn` (2 chỗ trong tầng cho từng chữ), `celāpikā` không có tiền lệ. 16.3 `Vevaṇṇiyaṁ` → `sự tiều tụy` (0 tiền lệ cho từ này; `sắc diện tiều tụy` ở ja461:8.1); `Domanassaṁ` → `ưu phiền` (33 chỗ `ưu phiền` trong tầng). 8.2 `āsanena sunimmitaṁ` — công cụ cách `āsanena` là nhờ chỗ ngồi đã dâng; giữ `nhờ chỗ ngồi`. 17.3 `aṅka` → lòng (chưa có tiền lệ dùng `aṅka` cho vòng tay bế bồng). 20.3 `Ajjāpi rajjaṁ chaḍḍetvā` — chữ `ajjāpi` giữ `ngay cả hôm nay`, vì Pāli dùng thì quá khứ `pabbajiṁ` ở khoá sau nên ngữ pháp thời gian không hoàn toàn trong sáng; không giải thích trong thân kinh.
  Bản Việt mới dịch xong, chưa có lượt review đối kháng riêng ngoài các phép tự kiểm: tập khoá Việt = tập khoá Pāli (98/98, cùng thứ tự); nháy kép `“”`, nháy đơn `‘’` khớp Pāli từng khoá (mở “ ở 1.1, ‘ ở 4.1, đóng ’ ở 5.4, ” ở 24.3); `…pe…` ở 22.2, 23.2, 24.2 → đúng một `…`; Pāli không có `(…)` trần ở khoá nào nên bản Việt cũng không có; NFC, 0 khoá rỗng, 0 khoảng trắng thừa; 4 nhóm Pāli trùng nguyên văn trong bài (12.2/12.4; 13.4=14.4=15.4=16.4=17.4=18.4=21.4; 22.2=23.2=24.2; 23.3/24.3) đều cho bản Việt giống nhau, trừ dấu ” đóng ở 24.3 theo Pāli.
