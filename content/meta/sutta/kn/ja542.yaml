  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim (825/825 khoá, đúng thứ tự Pāli, không khoá thừa). Cấu trúc: bốn dòng tiêu đề `0.1`–`0.4`; 194 bài kệ `1`–`194` (172 bài bốn dòng, 22 bài sáu dòng: `38`, `39`, `42`, `43`, `45`, `48`, `52`, `82`, `88`, `116`, `117`, `126`, `158`, `161`, `174`, `176`–`179`, `187`–`189`); dòng kết bài `195.1`. Tầng Pāli đã ghim chỉ có kệ, không có văn xuôi khung, nên người nói và bối cảnh được suy từ xưng hô, nháy và mạch của chính các bài kệ; không có gì suy từ chú giải hay tóm lược ngoài tầng được đưa vào thân kinh.
  - Nội dung (suy từ kệ):
    Vua Brahmadatta (Cūḷaneyya) xứ Pañcāla cùng 101 sát-đế-lợi bao vây Mithilā; Mahosadha, cố vấn của vua Vedeha xứ Videha, bảo vua cứ yên tâm (`1`–`9`). Brahmadatta hỏi Kevaṭṭa về cuộc gặp với Mahosadha (`12`–`15`). Mahosadha can vua Vedeha đừng cưới con gái Brahmadatta, bị quở (`16`–`21`). Mahosadha sai vẹt Mādhara hỏi con sáo giữ giường nằm của vua Pañcāla để biết mưu (`22`–`44`), rồi đi trước dựng dinh thự ở Kapila cho Vedeha (`45`–`48`). Vedeha đến xin cưới (`49`–`55`), bị quân Brahmadatta vây ban đêm, bốn quan hỏi kế rồi Mahosadha trấn an (`56`–`102`). Vedeha cùng người nhà Brahmadatta thoát qua đường hầm, lên thuyền (`103`–`117`); Mahosadha ở lại đối đáp với Brahmadatta trong cuộc tấn công lúc rạng đông (`118`–`174`); Brahmadatta khen và giữ Mahosadha không được (`175`–`181`); Mahosadha mang quân về Mithilā và dân chúng đón mừng (`182`–`194`).
  - Tầng tham khảo:
