  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 241 khoá chênh lệch lớn nhất (cả bài 825 khoá) và đọc đối chiếu toàn bài → khác nghĩa 33: sửa 2, giữ 9, bất định 22. Sửa 2: `164.3` *quả kosamba* → *tấm ván kosamba*, vì `phalaka` là tấm ván, không phải `phala` (quả); `171.3` *kẻ nào đã thả kẻ thù…* → *ngươi là kẻ đã thả kẻ thù…*, vì ở `171.1`–`171.2` Brahmadatta nói trực tiếp với Mahosadha (`adhīyase`, *ngươi học*) nên `yo` ở đây chỉ người được gọi, khác `143.3`/`144.3`/`146.3` nơi `yo` chỉ kẻ bị trừng phạt. Giữ 9: `27.1`, `27.4`, `31.4` (bản mù đọc `sughare` như vị trí cách *trong tổ đẹp*; nhưng `26.3` `āmantayi sugharaṁ, sāḷikaṁ` và lời đáp ở `28.x` cho thấy `Sughara` là tên con sáo, `sughare` là hô cách); `9.4` `palāyiti` = `palāyi` + `ti` (quá khứ), giữ *đã chạy trốn*, bản mù *sẽ bỏ chạy* là suy diễn; `14.2`, `61.1`, `104.2`, `105.4`, `163.4` (chỉ khác diễn đạt). Bất định 22, không đoán: `2.3` `ohārinī` (tầng chỉ có nghĩa *kéo xuống* ở `sn3.10:5.2`, `ja201:2.2`); `3.1`, `3.2`; `7.2` `tisandhi`; `14.4`; `19.2`, `19.3`; `27.2` `vesse`; `37.3` `paccakkhānupada`; `43.5` `okkantasattaṁ` (hai cách đọc khả dĩ: *đã qua bảy đêm* hoặc *đã vào cõi chết*); `58.3` `paduṭṭho brahmadattena` (Pāli để `Cūḷaneyya` ở `58.2`, và `Cūḷaneyya` chính là Brahmadatta như `16.2`, `18.2`, `118.2`–`119.3`, nhưng ở `58.3` tên Brahmadatta mang công cụ cách, nên bản Việt sát chữ nghe như hai người); `91.2`; `113.3` `taṁ dinnaṁ brahmadattena`; `126.2`; `127.1`–`127.2` `purisanāvutyo` (số lượng chưa phân xử, giữ phiên âm); `131.1`, `132.2`; `138.4` `khaḷuṅka` (tầng dịch *ngựa hoang* ở `thag17.1:28.4`, `an3.140`; ở đây giữ như cũ); `139.4`; `159.2` `kontimantā`; `167.1` `bhujalaṭṭhī`. Ngoài danh sách: `5.1` `ekasataṁ khatyā` đang là *một trăm lẻ một*, trong khi cùng nhóm vua chư hầu ở `ja532:5.3`, `ja532:32.1`, `ja546:41.3` dịch *một trăm*; tầng chưa nhất quán, Pāli `ekasata` có thể là 100 hoặc 101 và không phân xử được; giữ như cũ. Review đối kháng toàn bài: tập khoá 825 = 825, đúng thứ tự Pāli; nháy `“”‘’` khớp Pāli 825/825 khoá; dấu lược `…` Pāli 0 khoá và Việt 0 khoá (mẫu số 0, không phải 0 lỗi); Pāli trùng nguyên văn trong chính bài: 165 cặp thuộc 91 nhóm, trong đó 14 nhóm bản Việt khác, đều do dấu câu, ngôi xưng (`ta`/`tôi`), người nói hoặc cấu trúc theo mạch, không thấy lỗi; số: `saṭṭhihāyana` 60, `tiṁsa` 30, `gāmāsīti` 80, `dāsisatāni cattāri` 400, `bhariyāsata` 100, `nikkhasahassa` 1.000, `palasata` 100, `sattarattena` 7 đêm đều khớp. Không có bản Anh hay bản Việt độc lập khác; chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bài 825 khoá; không có bản Việt nguyên bài; đoạn song song `snp3.11:23.3`, tiền lệ `ja540:63.1`, `ja520:5.1`, `ja533:4.1`, `ja547:63.1`, `ja131:1.1`): sửa 25 khoá. Sai nghĩa: `138.3`–`138.4` (*ngài đã bị nắm giữ sai lầm, bởi chính ngài* → *Nhà vua ấy khó bị ngài bắt được, như ngựa Sindhu đối với con ngựa chứng*: `rājā` là chủ cách, hô cách là `rāja` như `138.1`, `tayā` là tác nhân của `duggaṇho`; khớp mạch `139` Vedeha đã qua sông, Brahmadatta đuổi như quạ đuổi thiên nga); `123.4` *ngày càng nhanh hơn* không có trong Pāli → *mũi này tiếp mũi khác* (đọc `sampatantu` + `itarītarā`, sandhi như `ja131:1.1`; cách tách `uttarītarā` cũng không cho nghĩa "nhanh"); `39.1`–`39.2` `tibbo saddo … suto` là tiếng đồn về hôn lễ, không phải *tiếng động dữ dội*; `105.4` `aggaḷe` số nhiều → *những then cửa*; `135.4` `siddhatthosmi` là ý nghĩ của Brahmadatta, *ta* dễ hiểu thành Mahosadha → *mình đã đạt được mục đích*; `111.3` `kicchā` là trạng từ (*khó nhọc lắm mới*). Rõ nghĩa/nhất quán: `97.4`–`100.4` thêm *giải thoát* cho khớp `95.4`–`96.4` (cùng khuôn so sánh); `151.3`–`158.3` thêm *đối với* để tên người mang sở thuộc cách không đọc như hô ngữ; `30.1`–`30.2` (*Tôi đã từng là của vua Sivi* là calque); `108.4`; `130.3` `naradhīra` ở đây là thợ tài giỏi, không phải *kiên cường*; `133.3` `sikkhitarā` (so sánh cách dùng nhấn mạnh, bỏ *giỏi hơn*).
  Giữ: `112.1` *đây không phải là Pháp* theo 4 tiền lệ cùng Pāli; `9.4` `palāyi` + `ti` (aorist; có thể là aorist khẳng định tương lai, bất định); `177.3`–`177.4` theo `ja404:6.4`.
  Bất định mới: `124.3` `pakkhandino mahānāgā` có thể là danh hiệu của các thanh niên ở `124.1` (*những bậc đại hùng xông lên*) thay vì voi đối đầu voi; `138.3` dạng `duggaṇhosi` (đọc `duggaṇho` + tiểu từ) vẫn cần người biên tập xem.

  Rà lại lỗi lặp 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): đọc lại mọi khoá Pāli↔Việt; sửa `136.2` `khurappaṁ` (mũi tên lưỡi dao cạo, theo `ja385:3.2`; trước đó để nguyên chữ Pāli). Giữ: `80.4`, `106.1`, `116.2`, `188.2` `senaka` là tên riêng/hô cách; `103.3` `sambādhapakkhandaṁ` đã dịch *rơi vào cảnh bức bách*; `31.3` `seno` là diều hâu. Không còn khoá nào khác cần sửa.
