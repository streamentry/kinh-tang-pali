  - Bất định (ghi ở đây, không thêm vào thân kinh):
    + `10`–`11`: người nói và người nghe. Bản Việt dùng "nhà vua" và "ngài", không gán tên; `ito` ở `10.3` có thể chỉ phía người nói.
    + `14`–`15`: tôi suy là Vedeha (xưng "ta"), nhưng Pāli không nói; `14.1` `mantapada` đọc là "điều bàn bạc".
    + `24.1` `bandhanena` đọc sát chữ "bằng mối ràng buộc"; có thể hiểu là sự thân tình, không thêm vào thân kinh.
    + `27.2` `vesse` đọc là hô cách ("hỡi nàng"); `27.1`, `27.4`, `31.4` `sughare` đọc là tên con sáo (Sughara), có thể là một danh hiệu.
    + `31.1` `tassa`: không dịch riêng ("lúc ấy"); `32.1` `tassā kāmā` đọc là "vì dục tình đối với nàng ấy", chưa rõ "nàng ấy" là con sáo đã chết hay con sáo đang nói.
    + `36.2` `vacchaṁ` đọc là tên người (Vaccha), có thể là danh từ chung.
    + `37.3` `paccakkhānupada` đọc là "lời từ khước".
    + `39`: người nói đoạn này không rõ; đọc `osadhī` là sao mai theo `vv14:1.4`.
    + `41.4` `nassa sakhī bhavissati`: đọc `sakhī` là danh từ chỉ "bạn" với chủ ngữ là Brahmadatta ("sẽ chẳng làm bạn"); cách đọc khác coi chủ ngữ là cô dâu.
    + `43.5` `okkantasattaṁ maṁ`: hai cách đọc, một là "bảy đêm đã hết" (dùng trong bản Việt), hai là `okkantasatta` chỉ trạng thái có mang. Không phân xử được.
    + `58.3` `paduṭṭho brahmadattena`: `brahmadattena` ở cách công cụ, bản Việt dịch Brahmadatta làm chủ ngữ ("mang ác ý"); cũng có thể đọc "bị Brahmadatta làm cho thù địch".
    + `61.1` `mantanātīto`: đọc là "đi quá lời bàn bạc" (mantanā + atīto); `bhinnamanta` = kế sách đã bị tiết lộ hoặc vỡ.
    + `2.3` `ohārinī` (đọc là "ập xuống"), `3.1` `lohavijjā` (đọc là "sắt thép lóe như chớp"), `3.2` `vāmarohinī` (đọc là "người cưỡi tuấn tú"), `7.2` `tisandhi` (đọc sát chữ "ba chỗ nối"), `8.1` `tārakajātāva`: các từ khó, bản Việt chọn nghĩa ít giả định nhất.
    + `91.2` `kuñjarānaṁvanodake`: đọc `kuñjarānaṁ va nodake` ("như loài voi nơi không có nước"); cách đọc `vana-udake` ("trong nước rừng") ít hợp mạch hơn.
    + `113.3` `taṁ dinnaṁ brahmadattena`: đọc là lời dự báo của Mahosadha, về sau (`179`–`181`) Brahmadatta thật sự ban các binh chủng ấy; `taṁ` chỉ các binh chủng.
    + `118.4` `upakāri`: giữ phiên âm, nghĩa chưa chắc (nơi ở hoặc doanh trại đã dựng); `118.3` `udentaṁ` đọc theo nghĩa "lúc mặt trời đang lên".
    + `123.1` chủ ngữ vắng; dịch thêm "tên" (cho `dhanuvega` và `paṇunnā`), vì cả đoạn chỉ có thể nói về mũi tên.
    + `127.1`–`127.2` `purisanāvutyo`, `ekekaniccitā`: số lượng chưa phân xử được (xem Số Pāli); `ekekaniccitā` đọc là "tuyển chọn từng người".
    + `131.1`–`133.1`: `vellālino`, `sikkāyasamayā`, `lohitakacchupadhāritā`, `paṭākā` không có tiền lệ trong tầng và không phân xử được; giữ phiên âm `vellāli`, đọc `sikkāyasa` là sắt tôi luyện, `lohitakacchu` là dây lưng đỏ, `paṭākā` là cờ hiệu.
    + `137.2` `mitapubbaṁ`: đọc là "mỉm cười trước rồi mới nói"; cách đọc "nói có chừng mực" ít hợp hơn.
    + `138.3`–`138.4` `duggaṇhosi tayā rājā khaḷuṅkeneva sindhavo`: đọc sát chữ "bị nắm giữ sai lầm, bởi chính ngài, như ngựa Sindhu bởi ngựa chứng"; cách đọc khác là "ngài khó bị nắm bắt", chưa phân xử được.
    + `144.1` `pātabyaṁ`: đọc là "để ăn".
    + `159.1`–`159.2` `palasataṁ`, `kontimantā`: đọc là "tấm da trăm pala" và giữ phiên âm `kontimantā`.
    + `164.3` `kosambaphalaka`, `164.4` `gaggara`, `167.1` `bhujalaṭṭhī`, `168.4`: các hình ảnh miêu tả người nữ, chọn nghĩa sát chữ; `169.4` `nālomā` đọc là "không trơ lông".
    + `170`: người nói (đọc là Brahmadatta nói với Mahosadha) và `sirivāhana` (đọc là danh hiệu "bậc mang vận may"; có thể là tên riêng).
    + `171.2` `akāsi` ở ngôi thứ ba nhưng dịch "ngươi đã làm"; `171.1`, `172.2` `dibbamāyā` đọc là "ảo thuật thần diệu".
    + `180.1` `yāva dadantu`: đọc `yāva` là "đầy đủ".
    + `24.4` `kosiyassa`: giữ tên Kosiya (không rõ là Kevaṭṭa).
  - Phép kiểm đã chạy (kết quả):
