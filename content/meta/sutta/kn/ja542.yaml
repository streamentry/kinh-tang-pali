  - Số Pāli:
    `ekasataṁ` (`5.1`) = eka 1 + sata 100 = 101 (theo quy ước tầng `ekanavutito` = 91; có thể đọc là "một trăm", nhưng 101 là con số truyền thống của truyện này; bất định); `dasa` (`4.1`) = 10 và `ekādasī` (`4.3`) = thứ mười một (mười bậc trí cộng mẹ của vua); `rattiyo sattamattiyo` (`42.2`, `43.2`) và `sattarattena` (`43.3`) = bảy đêm; `saṭṭhihāyana` (`119.2`, `122.2`, `128.2`) = saṭṭhi 60 + hāyana (năm) = sáu mươi tuổi; `tiṁsa ... purisanāvutyo` (`127.1`) = ba mươi (tiṁsa) và `nāvuti`: `nāvutika` ở `ja411:5.2` cho thấy gốc `navuti` = 90, nhưng chưa phân xử được "ba mươi nāvuti người" là bao nhiêu người, nên giữ phiên âm, không quy ra con số (không thuộc loại `Tiṁsakappasahassa`); `nikkhasahassaṁ` (`179.1`, `187.1`) = sahassa 1000 → một ngàn nikkha (đơn vị nikkha giữ phiên âm); `gāmāsīti` (`179.2`, `187.2`) = gāma + asīti 80 = tám mươi làng; `dāsisatāni cattāri` (`179.3`, `187.3`) = 4 × 100 = bốn trăm nữ tỳ; `bhariyāsata` (`179.4`, `187.4`) = một trăm người vợ; `palasataṁ` (`159.1`, `160.4`) = pala + sata 100 (tấm da trăm pala, không quy đổi đơn vị); `sataraṁsi` (`125.4`) = trăm tia sáng; `caturo` (`184.2`) = bốn người; `channaṁ` (`15.1`) = của sáu người (không rõ gồm ai); `tisandhi` (`7.2`) = ba chỗ nối (không quy ra số); `pañcamaṁ` (`195.1`) = thứ năm, khớp "5." ở `0.4`. Không còn con số nào khác trong bài.
