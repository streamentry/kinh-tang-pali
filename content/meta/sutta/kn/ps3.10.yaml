notes: |-
  Đợt 19, làn 99. Dịch từ Pāli root commit đã ghim, đủ 161/161 khoá (0.1–0.3, 1.1, 2.1–2.3, 3.1–3.8, 4.1–4.9, 5.1–5.10, 6.1–6.2, 7.1–7.3, 8.1–8.3, 9.1–9.3, 10.1–10.6, 11.1–11.6, 12.1–12.2, 13.1–13.6, 14.1–14.3, 15.1–15.33, 16.1–16.13, 17.1–17.30, 18.1–18.6, 19.1–19.4, 20.1–20.7); thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Pāli của bài không có dấu nháy đơn, nháy kép, ngoặc tròn hay `(…)` trần; bản Việt cũng không có. Pāli có 24 khoá chứa `…pe…`, bản Việt giữ đúng một `…` ở cả 24 khoá, 0 khoá lệch.

  **Cấu trúc bài.** Đây là phần cuối của Paṭisambhidāmagga và là bài giải thích các mục trong một danh sách mười chín (khoá 1.1), theo lối chiết tự: mỗi mục được định nghĩa bằng cách cho nó đi qua một chuỗi đối trị quen thuộc (xuất ly đối với dục tham, không sân hận đối với sân hận, nhận biết ánh sáng đối với hôn trầm và buồn ngủ, rồi lược đến sơ thiền đối với các triền cái và A-la-hán đạo đối với mọi phiền não). Sau đó là câu chốt bài (17.28), câu chốt phẩm (17.29), kệ tóm lược của phẩm (18) và của cả ba phẩm (19–20) và câu chốt của toàn bộ Paṭisambhidāmagga (20.7). Vì khuôn lặp, mọi khoá Pāli giống nhau đều được dịch giống hệt nhau.

  **Tầng tham khảo (mục 7 của brief).** Mẫu số = 59 khoá Pāli có nội dung (độ dài ≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`) trên tổng 161. Sujato: 0/59 (không có tệp cho uid, `not-published-upstream`); `english-project`: 0 tệp; `vietnamese-current` (Pháp Cú): không có. Ba tầng vắng hết nên bài dịch hoàn toàn từ Pāli, đối chiếu với tiền lệ nội bộ của tầng Việt 2026; không tuyên bố đã đối chiếu English hay bản Thích Minh Châu. Hai cặp gần trùng nguyên văn trong tầng Việt (iti72:2.3 và dn34:1.4.27, cả hai là câu ba vế `kāmānametaṁ nissaraṇaṁ yadidaṁ nekkhammaṁ … nirodho tassa nissaraṇaṁ`) được dùng làm tham chiếu cho 10.1–10.3 và 11.1–11.3, nhưng chúng không phải bản English.

  **Pāli trùng nguyên văn trong chính bài (đã đếm):** 161 khoá, 27 nhóm Pāli trùng (sau khi bỏ thẻ, hạ chữ hoa, bỏ dấu câu), gồm 65 khoá; bản Việt của cả 27 nhóm giống hệt nhau, 0 nhóm khác. Các nhóm lớn: `Vijjanto muccati, muccanto vijjatīti—` (4.2 = 4.5 = 4.8) · `Yo tattha saṁvaraṭṭho/avikkhepaṭṭho/dassanaṭṭho …` (5.2 = 5.8, 5.3 = 5.9, 5.4 = 5.10) · cặp `mokkho vimokkho.` (3.2 = 3.8) và `…pe…` (3.4 = 3.6) · `vijjāvimutti.` (4.3 = 4.9) · các đoạn lặp của hai khối 16 và 17: 16.5 = 17.19, 16.6 = 17.20, 16.7 = 17.21, 16.8 = 17.22, 16.9 = 17.23, 16.10 = 17.24, 16.11 = 17.25, 16.12 = 17.26 · `bhāvanāsampanno …pe…` (17.2 = 17.4 = 17.6 = 17.8 = 17.10 = 17.12 = 17.14) và `bhāvanāsampanno.` (16.2 = 17.16), `adhiṭṭhānasampanno.` (16.4 = 17.18) · `Rūpānametaṁ nissaraṇaṁ, yadidaṁ āruppaṁ.` (10.2 = 11.2) · `vosaggo.` (13.2 = 13.6) · `jhānaṁ.` (15.2 = 15.4 = 15.17 = 15.21 = 15.23), `jhānaṁ …pe…` (15.15 = 15.19), `jhānavimokkho.` (15.6 = 15.8 = 15.25 = 15.27), `jhānajhāyī.` (15.12 = 15.33), `Jhāyanto muccatīti—` (15.5 = 15.24), `Jhāpento muccatīti—` (15.7 = 15.26), `Jhāte ca jhāpe ca jānātīti—` (15.11 = 15.32), `Jhāyantīti—` / `Jhāpentīti—` (15.28, 15.30) không trùng nhóm nào vì ở 15.9 / 15.10 Pāli là một khoá có kèm `dhammā` / `kilese`. Cặp gần trùng nhưng khác có chủ ý, đã đọc từng cặp: 10.1 và 11.1 chỉ khác vế đầu và kết quả định nghĩa; 10.3 và 11.3 chỉ khác chữ cuối (`nekkhammaṁ` / `nissaraṇaṁ`); 4.1 (`muccati`) và 4.4 (`vimuccati`) khác tiền tố nên Việt viết “thoát khỏi” và “giải thoát khỏi”; 16.5 và 17.19 giống nhau, còn 16.13 (`ājīvasampanno.`) và 17.27 (`ājīvasampannoti.`) khác dấu kết `ti` (bản Việt giống nhau vì Pāli không có dấu nháy).

  **Pāli trùng nguyên văn với tầng đã dịch (đã dò):** 6 chuỗi Pāli của bài có tiền lệ nguyên văn trong tầng Việt: `0.1`, `0.2`, `15.29` (`dhammā.`), `16.12` / `17.26` (`Taṁ kissa hetu?`), `17.30` (`Tassuddānaṁ`). Dùng lại nguyên văn 5: `0.1` “Paṭisambhidāmagga” (10 khoá có tiền lệ, đều giữ nguyên Pāli làm tên bộ); `0.2` “3. Phẩm Trí Tuệ” (3/4 khoá, theo `ps3.3`, `ps3.5`, `ps3.6`; riêng `ps3.7:0.2` viết “Phẩm Trí Tuệ”); `16.12` / `17.26` “Vì sao vậy?” (375 / 540 khoá); `17.30` “Tóm lược:” (387 / 519 khoá, còn “Tóm lược” không dấu hai chấm 21). Không dùng lại 1: `15.29` `dhammā.` trùng chữ với 7 khoá khác nhưng là mảnh câu cụt trong những bối cảnh khác, bản Việt “đó là các pháp.” theo ngữ cảnh của bài.

  **Thuật ngữ và tiền lệ, đã đo (không ghi tên công cụ đo):**
  - `nekkhamma` → “xuất ly”; `nissaraṇa` → “thoát ly”. Đây là cặp quan trọng nhất của bài vì mục 10 và mục 11 định nghĩa hai từ này bằng cùng một câu ba vế. Trong tầng, `nekkhamma` (loại khoá chứa cả `nissaraṇa`) có bản Việt “xuất ly” 118 · “ly dục” 26 · “xuất gia” 16; ở phạm vi gần nhất (`ps`) “xuất ly” 2 khoá (`ps3.6:5.3`, `ps3.6:5.5`) · “ly dục” 4 khoá (`ps3.7:2.2`, `3.1`, `4.1`, `5.1`). Hai số cho đa số khác nhau; chọn đa số toàn tầng và còn lý do thứ hai: ở 10.4–10.6 và 12.1 `nekkhamma` được dùng như danh từ chung (“không sân hận là `nekkhamma` của sân hận”), nghĩa “thoát ra” chứ không phải “xa lìa dục”, nên “ly dục” sẽ làm sai nghĩa. Với `nissaraṇa`: “xuất ly” 180 · “lối thoát” 151 · “thoát ly” 95 trên toàn tầng; bài này buộc phải khác với `nekkhamma`, nên theo `dn34:1.4.27` (cùng Pāli, cùng cặp: “thoát ly … đó là xuất ly”) thay vì `iti72:2.3` (đảo cặp: “xuất ly … là ly dục”). `āruppa` → “vô sắc” theo cả hai. `bhūta saṅkhata paṭiccasamuppanna` → “đã hiện hữu, hữu vi, do duyên sinh” (“do duyên sinh” 43 · “do duyên khởi” 16).
  - Các thuật ngữ trong chuỗi đối trị theo tiền lệ: `kāmacchanda` → “dục tham” (77/82); `byāpāda` → “sân hận” (245); `abyāpāda` → “không sân hận”; `thinamiddha` → “hôn trầm và buồn ngủ” (164/167); `nīvaraṇa` → “triền cái” (217/310); `kilesa` → “phiền não” (52 · “ô nhiễm” 47; ở `ps3.6` “phiền não” 2 khoá, `ps3.7` “uế nhiễm” 2); `arahattamagga` → “A-la-hán đạo” (`ps` 6 khoá: `ps1.9`, `ps3.3`, `ps3.6` · “thánh đạo của bậc A-la-hán” 4 khoá `ps3.7`); `paṭhamaṁ jhānaṁ` → “sơ thiền” (86 · “thiền thứ nhất” 114; theo `ps3.7` vì cùng danh sách); `ālokasaññā` → “nhận biết ánh sáng” (12 · “tưởng ánh sáng” 15; theo `ps3.7`, `mn51:19.4`, `mn107:9.5`).
  - Các chỗ khác với `ps3.7` (cùng danh sách tám cặp, 17.1–17.15 ở bài này) — ghi để đồng bộ khi rà lại, không sửa ngoài lát: `uddhacca` → “trạo cử” (tầng: `ps1.9:8.2`, `ps1.9:10.1`; `ps3.7:2.2` dịch “chấp thủ”); `avikkhepa` → “không tán loạn” (5/7 khoá của tầng, `ps1.9:11.1` cho `avikkhepaṭṭha`; `ps3.7` dịch “không hồi huyễn”); `vicikicchā` → “nghi hoặc” (216/337, trùng với `ps3.7`); `dhammavavatthāna` → “xác định pháp” (18/23, trùng tên `mil3.7` “Xác Định Pháp Vô Sắc”; `ps3.7` dịch “lời giảng giải pháp”); `arati` → “bất mãn” (42, `mn6:7.1`, `mn119:33.1`, `sn4.25`; `ps3.7` dịch “lân cận”); `pāmojja` → “hân hoan” (42, trùng với `ps3.7`).
  - `nicchāta` → “không còn khát” (`dn33:1.11.209` “không còn khát”, `mn51` “không còn đói khát”); `muccati` → “thoát khỏi”, `vimuccati` → “giải thoát khỏi”, `vimutti` → “giải thoát”, `vijjāvimutti` → “minh và giải thoát” (34/55 khoá chứa `vijjāvimutti`, “minh giải thoát” 4); `mokkha` → “thoát”, `vimokkha` → “giải thoát”: 0 tiền lệ cho cặp này đứng đôi trong một danh sách, chọn “thoát” cho `mokkha` để cặp còn phân biệt được; xem bất định 2.
  - `adhisīlaṁ adhicittaṁ adhipaññā` → “giới tăng thượng, tâm tăng thượng, tuệ tăng thượng” (`an3.90:5.1`, `an3.89`, `an3.86`…); `adhisīlasikkhā` → “học giới tăng thượng” (21 khoá, `an3.86`–`an3.90`; so với “tăng thượng giới” 3 khoá ở `dn33`, `mn48`); `saṁvaraṭṭha` / `avikkhepaṭṭha` / `dassanaṭṭha` → “ý nghĩa thu thúc / không tán loạn / thấy”, `sīlavisuddhi` / `cittavisuddhi` / `diṭṭhivisuddhi` → “giới / tâm / kiến thanh tịnh”: theo đúng `ps1.9:11.1`. `passaddhi` → “khinh an” (88/123); `paṭippassambheti` → “làm lắng dịu” (`ps2.8:2.53`, 27 khoá). `pahīnattā` → “vì … đã được đoạn trừ” (“đoạn trừ” 165 · “từ bỏ” 357, nhưng “từ bỏ” đã dùng cho `pajahati`, nên dùng “đoạn trừ” để hai từ khác nhau). `ñātaṭṭhena ñāṇaṁ` → “trí do ý nghĩa đã biết”; `diṭṭhattā dassanaṁ` → “sự thấy vì đã được thấy”: 0 tiền lệ cho cả hai công thức, dịch theo từng chữ.
  - `paviveka` → “viễn ly” (302/403, `ps3.4:0.3` “Luận Bàn Về Viễn Ly”); `vosagga` / `vosajjati` → “buông bỏ”: tầng chỉ có 10 khoá chứa `vosagg-` (“xả” 8 · “buông bỏ” 3 · “từ bỏ” 5 · “xả bỏ” 2, `an2.12:2.2` và `2.8` “hướng về sự buông bỏ”); `cariyā` → “hành” (`ps3.5:1.1` “Hành nghĩa là có tám loại hành”; `ps3.5` tên bài “Luận Bàn Về Hành”).
  - `jhāyati` → “tu thiền” (40 · “thiền” 87; `jhāyī` → “người tu thiền” 40 · “tu định” 130), `jhāpeti` → “thiêu đốt” (tầng chỉ có 7 khoá “thiêu”, đều nói hỏa táng thân), `jhānavimokkha` → “thiền giải thoát”, `jhānajhāyī` → “người tu thiền bằng thiền”: 0 tiền lệ cho `jhānajhāyī`; xem bất định 3.
  - `bhāvanāsampanno` / `adhiṭṭhānasampanno` / `ājīvasampanno` → “người thành tựu tu tập / quyết tâm / lối sống”: `sampanno` → “thành tựu” (`dn16:1.24.7`, `dn33:2.1.52`); `adhiṭṭhāna` → “quyết tâm” (4 · “quyết định” 1, theo `cp26:19.4`); `ājīva` → “lối sống” (“mạng” 63 · “sinh kế” 5; không dùng “chánh mạng” vì Pāli chỉ có `ājīva` không có `sammā-`, và chính 16.6 đã dịch `sammā jīvati`); `jīvitaṁ` → “đời sống”; `samaṁ jīvati, no visamaṁ` → “sống ngay thẳng, không sống quanh co” (`samacariyā` → “hành xử ngay thẳng”, `dn14:2.14.7`; 2 khoá `mn8:14.2` và `snp4.9:9.3` dịch `sama`/`visama` “bằng phẳng / gồ ghề / bằng hay không bằng” là nghĩa đen); `kiliṭṭha` → “ô nhiễm”.
  - Công thức hội chúng (16.9–16.11 và 17.23–17.25): theo `dn16:1.24.7`, `dn33:2.1.52`, `an5.34:5.1`, `an5.213:8.1`, `ud8.6:11.1`: `yaññadeva parisaṁ upasaṅkamati` → “đi đến bất cứ hội chúng nào” (“hội chúng nào” 8 · “bất cứ hội chúng nào” 4 · “dù đi đến hội chúng nào” 2); `khattiya` → “Sát-đế-lợi”; `visārado upasaṅkamati amaṅkubhūto` → “đều đến với tự tin, không e ngại” (`amaṅkubhūta`: “không e ngại” 7 · “không hổ thẹn” 3 · “không rụt rè” 1).
  - `Mātikā` → “mẫu đề” (`ps1.0:0.3` “1.0. Mẫu Đề”, `ps1.0:74.4` “Mẫu đề đã hoàn tất”; tầng 24 khoá chứa `mātikā`: “đề mục” 4 · “mẫu đề” 4 · “mẫu” 5). Tên bài `Mātikākathā` → “Luận Bàn Về Mẫu Đề” theo khuôn “Luận Bàn Về …” của `ps1.6`–`ps2.8`, `ps3.3`–`ps3.6`. Câu kết `Mātikākathā niṭṭhitā.` → “Luận bàn về mẫu đề được hoàn tất.” theo `ps3.3`, `ps3.5`, `ps3.6`.
  - Kệ cuối (18–20): `Mahāvagga` → “Phẩm Lớn” (132 · “Đại phẩm” 39 · “Phẩm đại” 22; ba tệp `ps1.7`, `ps1.8`, `ps1.9` giữ nguyên `Mahāvagga` ở khoá `:0.2` nên không có tiền lệ cho nghĩa tiếng Việt trong bộ này); `Yuganaddhavagga` → “Phẩm Song Hành” (`ps2.8:0.2`); `paññāvagga` → “Phẩm Trí Tuệ” (`ps3.3`, `ps3.5`, `ps3.6`); `paṭisambhidā` → “vô ngại giải” (544/561); `pāḷi niṭṭhitā` → “Phần Pāli … được hoàn tất” (`dn13:83.5`, `dn23:35.7`, 2 khoá). `abhisamaya` → “sự thấu đạt” (`ps3.3:0.3`); `pāṭihāriya` → “nhiệm màu” (`ps3.6`); `samasīsī` → “ngang hàng” (tên `ps3.7`); `vipassanā` → “quán” (“quán” 41 · “minh sát” 16 · “tuệ quán” 5 trên toàn tầng; ở phạm vi `ps`: “quán” 2 khoá, `ps1.9:11.1` và `ps3.3:13.7`, cả hai cho `vipassanā`; “minh sát” 1 khoá, `ps1.0:7.1`, cho dạng `vipassane`). Hai số cùng cho đa số là “quán”.
  - Dấu `[19]` ở cuối 1.1: bản Việt bỏ, theo tiền lệ đã đo: 9/9 khoá Pāli có `[N]` cuối khoá và đã dịch đều bỏ dấu tổng (`ps1.1:28.2`, `29.20`, `30.5`, …), 0 khoá giữ.
  - Thẻ `<b>`: bỏ khỏi bản Việt vì tầng Việt không có tệp nào dùng thẻ này; các khoá `<b>X</b>ti …` dịch “X nghĩa là: …”, không dùng nháy đơn để số nháy của bản Việt khớp Pāli từng khoá (Pāli không có nháy), theo `ps3.5:1.1`.

  **Bất định (ghi ở notes, không đưa vào thân kinh):**
  1. `vijjati` (4.1, 4.4, 4.7): trong Nikāya thường là “có / tồn tại” (`netaṁ ṭhānaṁ vijjati`), nhưng ở đây `vijjā` được chiết tự từ nó, và 4.2 dùng phân từ `vijjanto` như tác nhân (`Vijjanto muccati, muccanto vijjatīti`). Đọc “có / tồn tại” cho 4.2 thành “đang tồn tại thì thoát”, vô nghĩa; nên dịch “biết”: “xuất ly biết nên là minh”. Chủ ngữ là một phẩm chất (`nekkhammaṁ`, `abyāpādo`, `arahattamaggo`) chứ không phải một người; bản Việt giữ nguyên lối nói đó, không thêm chủ ngữ.
  2. `mokkho vimokkho` (1.1, 3.1–3.8): Pāli đặt hai từ cạnh nhau như một mục (khoá 3 chỉ có một tiêu đề), phần định nghĩa chỉ dùng `muccati`. Không tìm thấy tiền lệ dịch hai từ này đứng đôi; “thoát, giải thoát” là một lựa chọn có chủ ý để giữ được hai từ riêng. Một cách khác hợp lý là dịch cả hai là “giải thoát”.
  3. `jhāyati` / `jhāpeti` / `jhānajhāyī` (15): chủ ngữ ngữ pháp của `jhāyati` ở 15.1, 15.13, 15.16, 15.20 là phẩm chất (`nekkhammaṁ`, `abyāpādo`, `ālokasaññā`, `arahattamaggo`), tức “xuất ly tu thiền”. 15.9 và 15.10 (`Jhāyantīti dhammā. Jhāpentīti kilese.`) có `dhammā` ở cách chủ và `kilese` ở cách đối cách số nhiều; dịch “Chúng tu thiền — đó là các pháp. Chúng thiêu đốt — đó là các phiền não.” giữ cả hai khả năng đọc (kilese là đối tượng bị thiêu, hay cái được gọi bằng từ `jhāpenti`). 15.11 `Jhāte ca jhāpe ca jānātīti` dịch “Biết những gì tu thiền và những gì bị thiêu đốt” theo cách đọc `jhāte` ứng với `dhammā` và `jhāpe` ứng với `kilese`; nếu hai từ này là cách vị trí (“biết trong cái đã thiền và cái đã thiêu”) thì nghĩa đổi, bài không tự giải.
  4. `nicchāto` + cách xuất xứ (`kāmacchandato nicchāto`, 2.1–2.3): dịch “không còn khát, dứt khỏi dục tham”, nghĩa là đọc `-to` như “xa khỏi”. Một cách đọc khác là “không còn khát đối với dục tham” (khao khát chính dục tham); hai cách đọc cho nghĩa gần nhau.
  5. `visālāya` (20.5): dạng nữ tính, không rõ nó bổ nghĩa cho danh từ nào bị lược (so với `gambhīro` ở 20.2 là nam tính). Dịch “rộng lớn dành cho các nhà thuyết giảng, sự soi sáng của trí dành cho các hành giả”, tức hai vế song song “dành cho …”. `ñāṇajotana` hiểu là “sự soi sáng của trí”; cách hiểu khác là “soi sáng bằng trí”. Hai phép so sánh `sāgarūpamo` (đại dương) và `jātassaro` (hồ tự nhiên) là các hình ảnh thật, không giải nghĩa thêm.
  6. 18.6 `mātikāya ca te dasāti`: dịch “cùng với mẫu đề, chúng là mười”: mười bài của phẩm là `ps3.1`–`ps3.10` (chín bài trước cộng bài mẫu đề này); bản Việt không thêm con số đó vào thân kinh.
  7. `adhiṭṭhāti` (16.3, 17.17): “Quyết tâm cho tâm theo xuất ly” là cách dịch sát chữ của `cittaṁ adhiṭṭhāti`; không tìm thấy tiền lệ cho động từ này trong tầng Việt (14 khoá chứa gốc `adhiṭṭhāna`, đều ở dạng danh từ).
  8. Hai lựa chọn thuật ngữ khác với `ps3.7` được nêu ở trên (ba chỗ có vẻ là lỗi của `ps3.7`: `uddhacca` → “chấp thủ”, `arati` → “lân cận”, `avikkhepa` → “hồi huyễn”) và lựa chọn “xuất ly” cho `nekkhamma` (khác “ly dục” của `ps3.7`) cần được đồng bộ khi các bài này được rà lại.
  Các lựa chọn trên (đặc biệt 1, 2, 3, 5) là lý do `terminology` và `ambiguity_integrity` ở mức 8,6, và `semantic_fidelity`, `grammar_logic` ở mức 8,9.

  **Coverage English (mục 7):** mẫu số = 59 khoá Pāli có nội dung (độ dài ≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`) trên tổng 161. Sujato: 0 tệp ⇒ 0/59; `english-project`: 0 tệp ⇒ 0/59; `vietnamese-current`: 0 ⇒ 0/59. Giới hạn của upstream, không phải thiếu sót của repo.

  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.

  **Lượt cải thiện 2026-10-13.** Đọc đối kháng lại cả 161 khoá bằng cách đặt cạnh các đoạn Pāli trùng hoặc gần trùng trong chính Paṭisambhidāmagga (`ps1.1:498`, `ps1.1:500`, `ps1.5:53`, `ps2.9:18`, `ps2.10:13`), rồi đếm lại tiền lệ ở phạm vi `ps` và toàn tầng. Đã đổi 21/161 khoá; 140 khoá còn lại giữ nguyên sau khi đọc lại. Sau lượt này bản dịch vẫn có 38 cặp Pāli trùng nguyên văn trong bài và cả 38 cặp đều có bản Việt giống hệt nhau; Pāli của bài không có nháy hay ngoặc nên không có nháy nào để cân.
  1. *Sửa ngữ pháp (15.10, 15.31).* `Jhāpentīti kilese`: `kilese` là đối cách số nhiều, là vật bị thiêu, không phải chủ thể. Bản cũ “Chúng thiêu đốt — đó là các phiền não” đồng nhất kẻ thiêu với phiền não, mâu thuẫn với 15.3, 15.14, 15.22 (phiền não là tân ngữ của `jhāpeti`) và với 15.11 (“những gì bị thiêu đốt”). Nay: “Chúng thiêu đốt — các phiền não.”, và 15.31 chỉ còn “các phiền não.”; bỏ chữ “đó là” để không khẳng định sự đồng nhất mà cách của danh từ không cho phép. 15.9 và 15.29 (`dhammā`, chủ cách) giữ “đó là các pháp”, trùng nguyên văn `ps1.5:53.6/13/32`. Lưu ý ngoài lát: `ps1.5:53.7/14/33` (`Jhāpetīti—kilese`) đang dịch “Thiêu đốt — đó là các phiền não” và có cùng vấn đề; cần đồng bộ khi rà lại bài đó.
  2. *Sửa tiền lệ `cittaṁ adhiṭṭhāti` (16.3, 17.17).* Bất định số 7 ở trên ghi “không tìm thấy tiền lệ”: ghi nhận đó sai. Có 5 khoá cùng công thức `… pajahanto …vasena cittaṁ adhiṭṭhātīti` ở `ps1.1:498.2/4/6/8` và `ps2.9:18.2–5` (và `ps2.9:40.17`), đều dịch “quyết định tâm theo hướng …”. Nay 16.3: “Quyết định tâm theo hướng xuất ly —”, 17.17: “Quyết định tâm theo hướng A-la-hán đạo —” (bản cũ “Quyết tâm cho tâm theo …” là calque khó đọc và không `vasena` → “theo hướng”). Bất định số 7 thay bằng: động từ này có tiền lệ, vẫn không có bản English để đối chiếu.
  3. *Sửa thuật ngữ `adhiṭṭhāna` → “quyết định” (1.1, 16.1, 16.4, 16.5, 16.9, 16.13, 17.18, 17.19, 17.23, 17.27).* Đo lại ở phạm vi `ps`: “quyết định” 32 khoá, “kiên định” 18 (`ps1.4`, `ps1.5`: `adhiṭṭhānaṭṭha` ở nghĩa chức năng của căn), “quyết tâm” 10 khoá và cả 10 đều nằm trong chính bài này; `ps1.1:468`, `ps1.1:498`, `ps2.9:18`, `ps2.10:29`, `ps3.2:14` đều “quyết định”. Số “quyết tâm 4 · quyết định 1” ở mục thuật ngữ trên là phép đo hẹp và sai về hướng đa số. `ājīva` “lối sống” và `bhāvanā` “tu tập” không đổi.
  4. *Sửa thuật ngữ `ālokasaññā` → “tưởng ánh sáng” (10.5, 15.16, 17.3).* Đo lại: toàn tầng “tưởng ánh sáng” 81 · “nhận biết ánh sáng” 15; ở phạm vi `ps` 70 · 7; cùng công thức ở `ps1.1:498.6`, `ps2.9:18.4`, `ps1.5:53.16`, `ps2.10:13.4` đều “tưởng ánh sáng”. Mục thuật ngữ cũ (12 · 15) đã đo sai.
  5. *Sửa thuật ngữ `arati` → “sự không vui” (17.11).* Phạm vi `ps`: “không vui” 23 khoá, “bất mãn” chỉ có ở chính bài này (17.11, trước lượt sửa); `ps1.5:53.25`, `ps2.10:13.8` cùng cặp `arati`/`pāmojja` đều “sự không vui”. Số “bất mãn 42” ở trên là đo toàn tầng, lấy từ bốn bài Nikāya khác bối cảnh.
  6. *Sửa rõ nghĩa (8.1–8.3).* `diṭṭhattā dassanaṁ`: “sự thấy vì đã được thấy” (vòng tròn, lại khác thể với 7.1 “do ý nghĩa đã biết”) thành “sự thấy vì đã thấy”, trung tính chủ/bị động giống “đã biết”.
  Hai chỗ đã đo và **không đổi**: (a) 13.3 và 13.5 trùng Pāli nguyên văn với `ps1.1:500.4` và `500.12` (“xả bỏ”), nhưng `vosajjati`/`vosagga` ở phạm vi `ps` dịch “buông bỏ” 61 khoá, “xả bỏ” chỉ 18 khoá và chúng nằm ở ba bài (`ps1.0`, `ps1.1`, `ps1.3`); giữ “buông bỏ” cho khớp 1.1 và 13.1, 13.2, 13.6; (b) `mokkho vimokkho` “thoát, giải thoát”: vẫn không có tiền lệ cho cặp đứng đôi nên giữ như bất định số 2.
  Điểm đổi: `semantic_fidelity` 8.9 → 9.0 (sửa 15.10 và 15.31 ở khoá chủ/tân ngữ); `grammar_logic` 8.9 → 9.0 (cùng sửa chủ/tân ngữ, và `cittaṁ adhiṭṭhāti`); `terminology` 8.6 → 8.9 (bốn thuật ngữ đưa về đa số `ps` đã đếm lại, mục 3–5 ở trên); `vietnamese_clarity` 8.8 → 8.9 (16.3, 17.17, 8.1–8.3). `final_score` 8.9 → 8.96, trung bình số học thô của mười điểm. Không đổi: `source_provenance` 9.4, `segment_alignment` 10.0, `triangulation` 7.0 (vẫn không có bản English độc lập), `han_viet_balance` 9.2, `ambiguity_integrity` 8.6 (các bất định 1, 2, 3, 5 vẫn còn thật), `technical_integrity` 9.6. Blocker `noEnglishEditionUpstream` giữ nguyên, vì đó là sự thật về upstream. Mọi mục thuật ngữ cũ ở trên về `adhiṭṭhāna`, `ālokasaññā`, `arati` và bất định số 7 được thay bằng mục này.
  Bốn lệnh của kho vẫn do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`; lượt này không chạy cổng nào.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 4 khoá bất đồng nghĩa → sửa 0, giữ 2 (15.12 `jhānajhāyī`: bản nguyên bài viết “có sự thiêu đốt do thiền”, Pāli là người tu thiền bằng thiền; 16.5 `samaṁ jīvati, no visamaṁ`: bản nguyên bài viết “tịnh lặng / không tịnh lặng”, bản dự án giữ nghĩa “ngay thẳng / quanh co” của `sama` / `visama`), bất định 2 (4.1–4.8 `vijjatīti vijjā`, `Vijjanto muccati, muccanto vijjati`: bản dự án đọc `vijjati` là “biết” còn bản nguyên bài đọc là “được biết đến”; chủ ngữ của `vijjati` ở 4.1, 4.4, 4.7 là danh từ trung tính `nekkhammaṁ`, còn `vijjanto` ở 4.2 là giống đực, nên Pāli không loại hẳn cách nào; giữ bản dự án; 18.3 `samasīsi`: bản dự án “ngang hàng” theo tiêu đề ps3.7:0.3, bản nguyên bài “đứng đầu”). Thuật ngữ khác bản nguyên bài nhưng không đổi nghĩa: `nekkhamma` bản dự án là “xuất ly”, `nissaraṇa` là “thoát ly” (bản nguyên bài dùng ngược lại); bản dự án nhất quán với từng khoá. Pāli trùng nguyên văn trong bài (16.5–16.13 với 17.19–17.27) có bản Việt giống nhau. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.
