  TIỀN LỆ, ĐÃ ĐẾM VÀ DÙNG LẠI NGUYÊN VĂN (`grep -rho` trên `content/translation/vi/project/sutta/`):
  `Petavatthu` → *Petavatthu* (4 tệp); `Uragavagga` → *Phẩm Rắn* (1, từ `pv2`); `Xpetavatthu` → khuôn
  *Chuyện ngạ quỷ X* của `pv2`/`pv46`/`pv48`/`pv49`; `tatiyaṁ` → *thứ ba*; `Migaluddo`-khoáng `kānane` →
  *trong rừng khuất*; `vaṇṇadhātu` ở `sn5.5:2.3` → *nhan sắc* (xin xem mục bất định bên dưới); `khīṇāsava`
  → *lậu hoặc* (tha-ap313); `nimayo`-khoảng `kaṇikāra` → *vàng óng* (tha-ap257); `niyyāti`/`niyyādesi` →
  *ra đi* / *từ tế*; `puppha` → *hoa*; `abhiropayi`/`pūjeti` → *tôn kính* / *cúng dường*; `homa` → *hương khói*.

  **ĐÂY LÀ CHỖ KHÓ NHẤT CỦA LÁT, NÊN `ambiguity_integrity` = 8.8.** Không có tầng tham khảo nào, nên các chỗ
  sau tôi phải tự phân xử; tôi ghi rõ ở đây thay vì giấu:
  · `1.4 Khādanti kiṁ kammamakāsi pubbe`. Số ít `khādanti` (3. số nhiều theo hình thái) đứng đầu câu, chủ ngữ
    không rõ. Tôi đọc nó là tiếp nối chủ ngữ `mukhaṃ` ở `1.3` — miệng ngươi **đang ngấn nghiến** — rồi mới sang
    câu hỏi `kiṁ kammamakāsi pubbe`. Cách đọc này khớp với việc `Pūtimukhapetavatthuvaṇṇanā` trong *Aṭṭhakathā*
    giải `pūtigandha` = `kuṇapagandha` (mùi xác) và nói `paramaduggandhaṃ te mukhaṃ kimayo khādanti`; nhưng
    **Aṭṭhakathā không phải tầng đã ghim**, nên nó chỉ là phán xử của tôi, không phải nguồn được phép dùng.
    Tôi không thêm chủ ngữ nào không có trong Pāli.
  · `1.3 kimayo`. Tôi hiểu là `kiṃ` + `ayaṃ`, thành thán từ khinh thường, và dịch *quả thế mà*. Nếu đọc
    khác thì chỗ này cũng còn đúng nghĩa chung về sự kinh ngạc khinh miệt.
  · `1.1–1.2` và `2.3` `vaṇṇadhātu`. `Aṭṭhakathā` giải là `chavivaṇṇa` (sắc thân), và truyện nói thân ngạo
    quý `suvaṇṇavaṇṇa`. Tiền lệ duy nhất trong tầng (`sn5.5:2.3`) dịch là *nhan sắc*, nhưng ở đó là ví dụ ẩn dụ;
    ở đây là sắc thân thật nên tôi dịch *sắc thân*. Đây là **lệch chủ ý so với một tiền lệ**, ghi để biên tập quyết.
  · `3.2 Anukampakā ye kusalā vadeyyuṃ`. `Aṭṭhakathā` hiểu là các bậc có lòng thương nên lẽ ra nói, tức
    `kusalā` là vế vị ngữ. Tôi dịch *mấy người có lòng thương cảm đáng lẽ đã nói lời lành:* — có `kusalā`,
    không giữ vế chủ `kā` (ngữ pháp cách điệu, không dịch được thành tiếng Việt mà vẫn đúng).
  · `3.1–3.4` người nói đổi ở `3.1` nhưng Pāli không mở ngoặc kép mới (xem `pv2`, cũng lệch y hệt). Tôi
    **giữ nguyên vị trí ngoặc kép của Pāli**: mở ở `1.1` và `2.1`, đóng ở `1.4` và `3.4`, `‘…’` ở `3.3–3.4`.
    Cân trên cả bài (2 mở `“`, 2 đóng `”`, 1 `‘`, 1 `’`) và không thêm/bớt ngoặc nào so với nguồn.

  Văn phong: giữ mỉa mai và châm biếm đúng mức của kinh — `1.3–1.4` là yêu quái chê miệng thối rồi hỏi
  ngươi đã làm việc gì; `3.3–3.4` là lời can nhắc của bậc có lòng thương cảm. Không nhẹ đi lời trách, không
  thêm lời giải thích nào vào thân kinh.

  Tên phẩm `Pūtimukhapetavatthu` dịch theo đúng khuôn *Chuyện ngạ quỷ X* đã có, nhưng `pūtimukha` thì **mới**:
  `pūti` = thối rữa + `mukha` = miệng, tôi dịch *Có Miệng Thối* — song song với `Sūkaramukha` của `pv2`
  (*Có Miệng Dễ Chịu*) và trung thành nghĩa chữ, không dịch nghĩa kép.

  Đợt này bị cấm chạy `npm run validate|test|check|build` theo chỉ đạo của người điền phối, nên
  `technical_integrity` bị chặn ở **9.6**. Bốn lệnh đó để người điền phối chạy. Tôi đã tự tái lập bằng script
  những kiểm mà `validate` làm cho tầng Việt: đủ 16 khoá với đúng segment ID, 0 orphan, 0 rỗng, mọi khoá NFC,
  dấu lược khớp Pāli **từng khoá**, không có `(…)`, ngoặc kép `“”` cân trên cả bài. Đây **không** thay thế
  được `validate`.

  Lượt cải thiện 2026-10-11 (kiểm toán độc lập; đọc đối kháng 16/16 khoá, đối chiếu Pāli từng khoá). Mục này THAY THẾ các chỗ sau của ghi chú cũ: (a) dòng "1.3 `kimayo`" và dòng "1.4 `Khādanti`" trong mục bất định (cách đọc `kimayo` = `kiṃ` + `ayaṃ` là SAI); (b) "`vaṇṇadhātu` → sắc thân" ở mục bất định; (c) "`3.2` … không giữ vế chủ"; (d) tên phẩm "Có Miệng Thối"; (e) mọi điểm cũ của các tiêu chí đổi bên dưới. Phần còn lại của ghi chú cũ giữ làm lịch sử.
  + Lỗi nghĩa thật đã sửa (14/16 khoá có đổi; 0.1 và 0.2 giữ):
    · 1.3–1.4: `kimayo` là số nhiều chủ cách của `kimi` (sâu, giòi), chủ ngữ của `khādanti` — không phải thán từ. Bản cũ để "giòi bọ" nhưng tách khỏi `khādanti` bằng dấu "!" và thêm "ngấu nghiến" (không có trong Pāli); nay là "giòi bọ / đang ăn" không thêm sắc thái. Tiền lệ `kimayo` = "giòi bọ/sâu" ở ja530:48.1, mil5.3.2:6.1 (sâu), mil5.1.1:15.4–5 (giun); pv35:1.3 chép nhầm "quả thế mà" (ngoài phạm vi, báo bên dưới). Bản Việt nguyên bài ở mục Tra cứu toàn văn (chỉ để hiểu cách đọc) cũng đọc đó là dòi rúc rỉa miệng.
    · 1.1: `dhāresi` là hiện tại; bản cũ "từng mang" đổi thì; "rực rỡ" thêm nghĩa (`subhaṁ` chỉ là "xinh đẹp"). `vaṇṇadhātu` → "dung sắc" (đồng nhất 1.1 và 2.3; bản cũ "sắc thân" rồi "sắc ấy" làm hai chỗ lệch nhau).
    · 1.2: `antalikkhe` → "giữa bầu trời"/"không trung" theo đa số (kp6, ja512, ja526, pv35…); bỏ "lơ lửng" (`tiṭṭhasi` = đứng).
    · 1.1–1.4 và 2.x–3.1: người hỏi (Nārada) gọi ngạ quỷ là "ngài", ngạ quỷ xưng "tôi" và gọi Nārada là "ngài" (bản cũ "ngươi"/"ta", vốn trái quy ước họ vv/pv đã kiểm toán).
    · 2.1: bản cũ "kẻ tội phạm" — `pāpo` là "ác", không phải tội phạm hình sự; `ati-` thành "rất". 
    · 2.2: "miệng chẳng hóa trần" là chữ vô nghĩa (đọc `asaññato` thành khỏa thân); nay "không tự chế ở miệng" (`asaññat-` dịch "không/thiếu tự chế, không thu thúc, không kiềm chế" ở 25/37 khoá chứa dạng này ngoài pv3, đa số; `mukhasā` công cụ cách "bằng/ở miệng"). `tapassirūpo` → "dáng vẻ người khổ hạnh" (không phải "tu sĩ").
    · 3.1: bản cũ "Cả hai điều ấy, ta đã tự thấy ở ngươi" ĐẢO người thấy: `tayā … diṭṭhaṁ` là "bởi ngài thấy" (Nārada thấy), và `tayidaṁ` không có nghĩa "cả hai". Nay "Điều này, Nārada, ngài đã tự mình thấy" — hô cách `nārada` giữ là hô cách.
    · 3.2: "đáng lẽ đã nói" thêm ý (điều kiện quá khứ); `vadeyyuṁ` là khả năng/lời khuyên: "sẽ nói rằng"; "lời lành" thêm vế không có; `kusalā` giữ là "thiện xảo".
    · 3.4: "yêu quái" sai (`yakkha` → "dạ-xoa", cf. pv21); "ham muốn thế dục" là chữ vô nghĩa. `kāmakāmī` → "được điều mình mong muốn" theo đa số tầng (đã đếm 13 khoá có `kāmakāmī`: "thỏa lòng/được điều mong muốn" ở ja537 ×3, ja513, ja486, vv53, vv84, pv37; "ham dục lạc" chỉ ở mnd6/mnd15 ngữ cảnh khác).
    · 2.4, 3.3: giữ "lời nói hai lưỡi" (đa số 120 khoá chứa `pesuṇ/pisuṇ`); bỏ "thối hoắc" thành "thối" (`pūti`); 3.3 `musā` → "nói dối" (bản cũ "lời dối trá" thêm danh từ).
    · 0.3/4.1: bỏ "Có" (không có trong Pāli): "Miệng Thối". `translationTitle` đổi khớp.
  + Điểm: `source_provenance` 9.5 → 9.2 (ghi chú cũ dựa vào một chú giải không có trong tầng đã ghim và khẳng định sai cách đọc `kimayo`); `semantic_fidelity` 9.1 → 8.9 (bản cũ có lỗi nghĩa 3.1, 2.2, 2.1, 3.4; đã sửa, còn bất định 3.2 và `vaṇṇadhātu`); `grammar_logic` 9.2 → 9.0 (bản cũ sai thì, đảo chủ thể 3.1; nay đã sửa nhưng `ye` ở 3.2 không có vế tương ứng trong Pāli); `terminology` 9.3 → 8.9 (`yakkha`, `kāmakāmī`, `asaññato` lệch tiền lệ bản cũ; `vaṇṇadhātu` chưa chốt giữa "dung sắc" và "nhan sắc" của sn5.5:2.3); `triangulation` 7 → 7.7 (nay đã đối chiếu bản Việt độc lập ở mục Tra cứu toàn văn và các bài song song pv2, pv34, pv35; vẫn không có bản Anh nên không vượt 8.0); `vietnamese_clarity` 9.3 → 9.0; `han_viet_balance` 9.3 → 9.2. Các tiêu chí khác giữ nguyên. Điểm cuối 9.03 (trung bình thô 90.3/10).
  + Bất định còn lại: (1) 3.2 `ye anukampakā kusalā vadeyyuṁ` không có vế đối ứng; bản dịch giữ "những ai … sẽ nói rằng" và hiểu đó là lời khuyên chung của người thương xót, không phân xử được hơn bằng tầng đã ghim. (2) `vaṇṇadhātu` "dung sắc" (đồng nhất với `vaṇṇa` đã dịch "dung sắc" ở họ vv) so với "nhan sắc" (sn5.5:2.3) và "ánh sắc" (pv17, vv83; nghĩa khác). (3) `kāmakāmī` có thể hiểu là "người đạt được điều ham muốn" hoặc "người ham dục lạc"; giữ nghĩa đa số.
  + Đã kiểm và giữ nguyên dù nghi: "tôi" thay vì "ta" cho ngạ quỷ (cùng quy ước vv); "ngài" của Nārada gọi ngạ quỷ (quy ước họ vv; Pāli chỉ có `te`/`tuvaṁ`); "ngươi" trong lời khuyên 3.4 vì là lời khuyên chung cho một người chưa xác định; "đã là" ở 2.1 (Pāli không có động từ, ngữ cảnh là lời kể về quá khứ).
  + Kiểm sau sửa: 16/16 khoá đúng tập và thứ tự Pāli; nháy kép “ ” và nháy đơn ‘ ’ khớp Pāli từng khoá; không dấu lược; NFC; không khoá rỗng; không Pāli lọt vào thân bản dịch ngoài tên riêng; 0 cặp Pāli trùng nguyên văn trong chính bài. Lỗi ngoài phạm vi bài này (báo, không sửa): pv35:1.3–1.4 chép "quả thế mà hôi hám" cho `kimayo … khādanti` (cùng Pāli với pv3:1.3–1.4), pv34:3.3, pv34:8.1–8.4 ("Cả hai điều ấy", "xin ngươi đừng nói lời dối trá, đừng nói lời dối", "xin ngài đừng làm thành kẻ ăn thịt người") cùng lỗi 3.1/3.2 như pv3; pv2:1.3–1.4, 3.3–3.4 (`sūkaramukha` "miệng heo" bị dịch "miệng dễ chịu"). technical_integrity vẫn 9.6: cổng kỹ thuật do người điều phối chạy (npm run validate; npm test; npm run check; npm run build).

  Sửa lan 2026-10-13 (terminology fix): `:3.3` `Mā pesuṇaṁ mā ca musā abhāṇi` (Pāli y hệt `pv34:8.3`): "Đừng nói lời hai lưỡi, đừng nói dối" → "Chớ nói ly gián, chớ nói dối" (dùng lại nguyên văn `pv34:8.3`; dạng `pesuṇaṁ` ở `sn11.24:4.4`, `pv37:40.3` cũng là ly gián). Giữ nguyên `:2.4` `pesuṇiyena` "lời nói hai lưỡi": đo ở dạng `pesuṇiya` thì hai lưỡi là cách dịch của `ja518:24.2`, `snp4.14:14.4`, `snp3.10:15.4`, `ne37:60.4`; hai thuật ngữ khác nhau giữa 2.4 và 3.3 là cùng một gốc `pesuṇa`, ghi nhận không sửa.

  Quyết định hội đồng biên tập 2026-10-16: A13 — 1.4 (bỏ dấu chấm thừa sau dấu kết lời thoại (`?”.`/`.”.` thành `?”`/`.”`)).
