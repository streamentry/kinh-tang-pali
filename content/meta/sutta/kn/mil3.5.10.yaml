notes: |-
  THUẬT NGỮ MỚI (0 tiền lệ cho hai từ sau, đã tra). nidassetuṁ → được chỉ rõ. anupādisesāya nibbānadhātuyā → không còn tự thân ở trong cảnh giới Niết-bàn vô dư (tầng đã có Niết-bàn 949 lần). dhammakāya → thân Pháp. parinibbūta → hoàn tịch diệt độ. att haṅgata → đã lìa và đi vào cõi vô tự (PED: atthaṅgata = vanished, gone beyond).

  CÁCH DỊCH CỨA. Câu hỏi của vua là Đức Phật có tồn tại không; câu trả lời là có, Đức Thật Chứng Ấy có tồn tại. Nhưng không thể chỉ rõ Đức Thế Tôn ở đây hay ở đó, vì Ngài đã nhập diệt cùng cảnh giới Niết-bàn vô dư, giống ngọn lửa đã tắt không còn gọi tên được; chỉ qua thân Pháp thì chỉ rõ được. Tôi giữ đúng hai tầng này và không nhập thêm ý nào.

  HAI VẾ DÙNG LẠI. 1.1 Vua nói: theo đa số tầng; 3.1 Khéo lắm, thưa tôn giả Nāgasenā. theo 54 tệp; 6.1 Imasmiṁ vagge dasa pañhā → Trong phẩm này có mười câu hỏi. theo nguyên văn mil3.4.10:5.1 và mil6.2.10:5.1.

  CHỐT ƯDDANA. Buddhanidassanapañho dasamo → thứ mười; Buddhavaggo pañcamo → Phẩm Đức Phật, thứ năm; Imasmiṁ vagge dasa pañhā → Trong phẩm này có mười câu hỏi. Tôi đối chiếu hai số kế bên: mil3.5.9 là thứ chín và mil3.4.10 cũng là Trong phẩm này có mười câu hỏi, nên chuỗi uddāna của phẩm này khớp.

  ĐỢT NÀY KHÔNG CHẠY CỔNG KỸ THUẬT CỦA KHO. Người điều phòng cấm npm run validate, npm test, npm run check và npm run build trong lát này, nên tôi KHÔNG tuyên bố technical gate pass và technical_integrity đặt 9.6 chứ không phải 10.0. Bốn lệnh đó cần người điều phòng chạy lại sau khi gộp lát.

  CHỐT KHÔNG TỰ CHẠY — ĐÃ TỰ QUÉT MỌI KHOÁ TỪ ĐĨA. Vòng chốt của kiểm cổ chỉ quét khoá Pāli từ 40 ký tự trở lên; ở bảy bài Jātaka của lát này mọi vế kệ đều ngắn hơn ngưỡng đó (vế dài nhất 35 ký tự) nên assertion về bản chất KHÔNG chạy. Tôi tự quét lại TOÀN BỘ 238 khoá của 14 bài từ tệp đã ghi trên đĩa: đủ khoá và không thừa so với Pāli (sắp theo thứ tự số), không rỗng, chuỗi NFC, số dấu lược khớp từng khoá, không có (…), không thừa dấu lược, và số dấu nháy kép so với Pāli từng khoá. Kết quả: 0 lỗi trên 238 khoá.

  DẤU LƯỢC §10. Không khoá nào trong 238 khoá của lát này chứa …pe… hay dấu lược — đã kiểm bằng script trên từng khoá. Vì vậy cả 238 bản Việt đều có 0 dấu lược, khớp Pāli. Không mở rộng, không nén, không có (…) đứng một mình.

  PĀLI TRÙNG Ở BÀI KHÁC, ĐẾM ĐƯỢC. Tôi tự dựng chỉ mục Pāli↔Việt bằng script: nạp 5.764 tệp Pāli trong .cache/upstream/suttacentral/root/pli (bỏ *.apfs-orphan) và 4.136 tệp Việt dự án trong content/translation/vi/project/sutta — tổng 112.947 khoá Việt — ghép theo khoá, rồi quét từng khoá thân bài của lát theo nguyên văn căn thẳng và theo dạng đã chuẩn hoá dấu câu, nháy kép, hoa thường, và loại bỏ chính 14 tệp của lát để đo đúng trạng thái trước khi tôi ghi. Kết quả: 44 cặp Pāli trùng ở thân bài, 42 trùng byte-for-byte và 2 trùng sau chuẩn hoá. Trong đó 33 cặp đã có bản Việt ở bài khác, tôi DÙNG LẠI NGUYÊN VĂN ở: ja275 2.3, 2.4, 3.1, 3.2, 3.3, 3.4 ← ja274; ja294 3.1 ← sn1.1; mil3.1.11 3.2 và 3.3 ← sn10.12:5.2 và 5.3 (tôi lấy cả bộ bốn vế ở sn10.12:5.1–5.4 để bài này không tự mâu thuẫn với bài nguồn); Opammaṁ karohī ở mil3.1.11:2.1, mil3.1.14:2.1, mil3.1.15:2.1, mil3.2.2:2.1, mil3.5.10:2.1, mil3.7.16:2.1; mil3.1.14 3.1 ← mil3.1.12:3.1 và 3.5 ← mil3.1.12:3.4; Kallosi ở mil3.1.11:4.1, mil3.1.14:4.1, mil3.1.15:3.1, mil3.2.2:3.1, mil3.2.9:2.1, mil3.5.10:3.1 ← 54 tệp mil khác; mil3.2.2 2.4 ← mil3.5.9:2.3; mil3.5.10 6.1 ← mil3.4.10:5.1 và mil6.2.10:5.1; mil3.7.16 5.1 ← mil3.1.16:6.1. Mười một cặp còn lại thì chưa bản Việt nào ở bài khác có, tôi phải đặt mới: ja294 2.1 và 2.2, ja295 2.1 và 2.2 (bốn khoá này là hai cặp trùng nhau — chính bài trong lát đã trùng nhau; tôi đặt một lần rồi dùng lại nguyên văn cho cả hai bài), ja295 1.3 và 1.4 (trùng ja308:1.3 và 1.4), ja297 1.2 (trùng ja429:6.2 và ja430:6.2), ja298 1.2 (trùng sáu chỗ trong ja547), mil3.1.11 1.3 và 2.4 (trùng nhau, chỉ khác ở dấu nháy) và mil3.2.9 5.1 (trùng mil6.1.9:12.1). Ghi lại đây để lát sau dùng lại nguyên văn của tôi thay vì dịch lần hai.

  MỌI CÔNG THỨC HỘI THOẠI ĐÃ CÓ TIỀN LỆ, TÔI THEO NGUYÊN VĂN. Rājā āha— → Vua nói: (đếm trong tầng mil có 30 tệp dùng Vua nói: và 12 tệp dùng Vua nói—, tôi theo đa số; 11 tệp còn lại dùng Vua nói:—). Thero āha— → Trưởng lão nói: (3 tệp dùng dạng có dấu hai chấm và 3 tệp dùng dạng có gạch nối, hòa nhau; tôi chọn dạng có dấu hai chấm để nhất quán với Vua nói: trong chính lát này). Kallosi, bhante nāgasenā → Khéo lắm, thưa tôn giả Nāgasenā. (54 tệp mil, chỉ một cách). Opammaṁ karohī → Xin hãy xét một thí dụ ti. (đúng mil3.1.12:2.1, mil3.2.7:2.1, mil3.2.8:2.1). Bhiyyo opammaṁ karohī → Xin hãy xét một thí dụ nữa ti. (đúng mil3.1.12:3.1). Bhāsitampetaṁ, mahārāja, bhagavatā— → Điều này, này Đại vương, Đức Thế Tôn đã nói — (đúng mil3.1.12:3.4). Imasmiṁ vagge dasa pañhā và Imasmiṁ vagge soḷasa pañhā → Trong phẩm này có … câu hỏi. (đúng mil3.4.10:5.1, mil6.2.10:5.1, mil3.1.16:6.1). Rājā → vua, Mahārāja → Đại vương, bhagavā/bhagavatā → Đức Thế Tôn hoặc Đức Thật Chứng Ấy, Thero → Trưởng lão, Kāma → tình dục, sīla → đức hạnh.

  TÊN PHẨM ĐÃ CHỐT. Tikanipāta → Bộ Ba Bài Kinh (bốn bài lân cận đã có: ja276, ja291, ja292, ja293). Udapānavagga → Phẩm Nước Uống (đúng ja276 và ja279; tôi tự đếm bằng script trên Pāli gốc: 10 bài mang tên phẩm này là ja271..ja280, và ja275 nằm trong đúng khoảng đó). Kumbhavagga → Phẩm Bình Vò: tên này CHƯA có trong bảng chốt của BRIEF_VI3 §11, nên tôi theo đa số trong chính phẩm đang làm — ba bài đã có (ja291, ja292, ja293) đều dùng Phẩm Bình Vò; tôi tự đếm Kumbhavagga chiếm đúng ja291..ja300, trong đó lát này có sáu bài. Người biên tập nếu muốn chốt khác thì phải sửa cả mười bài cùng lúc. Các tên phẩm Milindapañha cũng theo đúng bầy bài lân cận: Mahāvagga → Đại Phẩm, Addhānavagga → Phẩm Khoảng Thời Gian, Buddhavagga → Phẩm Đức Phật, Arūpadhammavavatthānavagga → Phẩm Xác Định Pháp Vô Sắc.

  STATUS. Hai blocking error ở trên là thật và đo được (thiếu hẳn tầng Anh Sujato tại commit đã ghim; coverage dưới ngưỡng chưa được ghi nhận trong reference-gaps.yaml), nên mọi bài lát này đặt draft bất kể final_score. Tôi không nâng điểm để né blocker và cũng không hạ điểm để tỏ ra thận trọng: điểm ghi ở trên là chấm theo đúng mười tiêu chí, kể cả triangulation thấp vì không có tầng tham khảo nào.

  GIẢI QUYẾT DRAFT 2026-10-12 (đọc đối kháng lại từ Pāli; các mục THUẬT NGỮ MỚI và CÁCH DỊCH CỨA ở trên về "hoàn tịch diệt độ", "không còn tự thân ở…", "cõi vô tự", "Đức Thật Chứng Ấy", "đã bị ngăn lại", "đi quá tầm gọi tên" BỊ THAY THẾ bởi mục này; hai vế dùng lại và chốt uddāna ở trên vẫn giữ nguyên).
  Khoá đổi: 8/17 khoá (6 khoá thân bài 1.3, 1.5, 2.2, 2.3, 2.4, 2.5 có lỗi nghĩa hoặc từ không tiền lệ; 2 khoá tiêu đề 0.3 và 4.1 chỉ lệch từ vựng): 1.3 bhagavā → "Đức Thế Tôn" (bài này dùng "Đức Thế Tôn" cho mọi chỗ bhagavā; "Đức Thật Chứng Ấy" có 0 tiền lệ trong tầng, chỉ xuất hiện ở đúng khoá này). 1.5 và 2.4 anupādisesāya nibbānadhātuyā parinibbuto → "đã diệt độ trong Niết-bàn giới không còn dư y" theo đúng cụm Pāli y hệt ở dn16:5.8.6 ("Như Lai đã diệt độ trong Niết-bàn giới không còn dư y"), dn16:3.20.1, dn16:4.38.2, an8.70:21.1, an8.19:15.2… (đếm được 30 khoá cụm anupādisesāya nibbānadhātuyā có bản Việt, đa số "Niết-bàn giới không còn dư y"); bản cũ "không còn tự thân ở trong cảnh giới Niết-bàn vô dư" thêm chữ "tự thân ở" không có trong Pāli. 2.2 jalamānassa/atthaṅgatā → "đám lửa lớn đang cháy … ngọn lửa nào đã biến mất"; atthaṅgata dịch "đã biến mất" theo cnd10:44.1–2 (7 khoá, nghĩa mặt trời thì "đã lặn"), bản cũ "rực lớn đã tắt" bỏ mất cấu trúc "ngọn lửa nào … ngọn lửa ấy". 2.3 niruddhā = "đã diệt" (bản cũ "đã bị ngăn lại" sai nghĩa niruddha); appaññattiṁ gatā → "đã đi đến chỗ không còn được chế định" (paññattiṁ gacchati = "đi đến sự chế định" ở pe8:37.3 và pe3:30.2; appaññatti chỉ có bài này là nghĩa "chế định/gọi tên", an10.94 là appaññattika, nghĩa khác); bản cũ "đi quá tầm gọi tên" thêm sắc thái "quá tầm". 2.4 atthaṅgato: bản cũ "đã lìa và đi vào cõi vô tự" bịa cõi "vô tự" không có trong Pāli — thay bằng "đã biến mất"; dhammakāyena → "bằng Pháp thân" theo dn27:9.6 ("Pháp thân", tiền lệ duy nhất cho dhammakāya ở thể danh từ; thi-ap17 và tha-ap2 là hợp từ khác); câu đổi trật tự cho đúng Pāli (…na sakkā … nidassetuṁ, dhammakāyena pana kho … sakkā). 2.5 "Dhammo hi, mahārāja, bhagavatā desito" bản cũ "chính là pháp do Đức Thế Tôn đã giảng" lơ lửng, mất liên từ hi (vì/bởi); nay "Vì này Đại vương, Pháp là điều Đức Thế Tôn đã giảng" (đối chiếu mil3.5.3:1.7 cùng cấu trúc). 0.3 và 4.1 nidassana → "chỉ rõ" cho khớp nidassetuṁ trong thân bài (bản cũ "cho thấy" lệch với "chỉ rõ"); translationTitle đổi theo "Câu Hỏi Về Việc Chỉ Rõ Đức Phật".
  Giữ nguyên, có đo: "ngươi nghĩ thế nào" ở 2.2 — trong tầng mil, 25 khoá "Taṁ kiṁ maññasi, mahārāja" có bản Việt (13 dùng "ngươi", 4 "ngài", 3 "Đại vương nghĩ", 5 khác), mil3.5.8:2.2 cùng cặp Nāgasena–vua cũng "ngươi"; để nhất quán tầng mil tôi không đổi riêng bài này, nhưng ghi nhận đây là lựa chọn của cả tầng, xưng "ngươi" với vua là điều người biên tập có thể muốn xét lại cả tầng một lần. 1.1, 1.2, 1.4, 3.1, 5.1, 6.1 đọc đối kháng đủ nghĩa, giữ. 3.1 "Nāgasenā" giữ theo 54 tệp. Số Pāli: không có số trong bài này (phẩm này "mười câu hỏi" ở 6.1 khớp dasa).
  Phép kiếm bài này (17 khoá): tập khoá Việt = tập khoá Pāli (17/17); nháy kép “ ” và nháy đơn ‘ ’ khớp từng khoá Pāli (10 khoá Pāli có nháy kép, 3 khoá có nháy đơn; 0 lệch); Pāli trùng nguyên văn trong chính bài: 0 cặp trùng nội bộ; dấu lược …pe…/(…): Pāli không có nên Việt không có (0/17).
  BLOCKER ĐÃ GỠ: blocker thứ hai ("Coverage tầng Anh đo được là 0 trên 6 khoá… reference-gaps.yaml chưa có mục cho bài này") là phát biểu của tác giả cũ về một lỗ hổng hồ sơ, không phải lỗi văn bản; nay content/meta/reference-gaps.yaml đã có mục cho mil3.5.10, nên khẳng định đó không còn đúng. Việc thiếu tầng Anh Sujato vẫn nằm trọn trong blocker thứ nhất (giữ nguyên, là sự thật của upstream tại commit đã ghim). Sáu khoá Pāli có nội dung (1.4, 1.5, 2.2, 2.3, 2.4, 2.5, đo từ 40 ký tự) tôi đã đọc kỹ từng khoá từ Pāli root một mình và bản dịch tự đứng vững; không còn đoạn nào nghĩa chưa chắc. `triangulation` giữ 6,6 (không bản Anh Sujato, không lớp english-project, không vietnamese-current; chỉ có bản Việt dự án ở bài song song mil3.5.8, mil3.5.3 và các bài DN dùng cùng cụm làm đối chiếu).
