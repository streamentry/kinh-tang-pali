notes: |-
  `Jāgarajātaka`, bài thứ chín của `Gandhāravagga` trong `Sattakanipāta`. 33/33 khoá đã dịch,
  set khoá Việt bằng đúng set khoá Pāli (đối chiếu bằng set, không chỉ đếm 33).

  TẦNG THAM KHẢO — đo, không đoán. Xem `blocking_errors` mục 1: không có tầng Anh, không có
  `vietnamese-current`, không có lớp lấp `english-project`. Ba tầng tham khảo đều vắng ⇒
  `draft`, và `triangulation` bị chặn ở 7.5 (≤ 8.0) chứ không nâng điểm để né blocker.

  TÊN BÀI VÀ TÊN PHẨM — theo bầy lân cận, kèm số đếm trên 445 tệp `ja` đã có ở tầng này:
  `:0.1` → *Jātaka* (429 tệp) chứ không phải *Chuyện Tiền Thân* (16 tệp);
  `Sattakanipāta` → *Bộ Bảy Bài Kệ* (20/20 tệp có khoá `:0.2`);
  `Gandhāravagga` → *Phẩm Gandhāra* (10/10 tệp có khoá `:0.3`);
  `:0.4` → *N. Kinh X* (411/445 tệp); dòng kết `…thứ N.` (462 khoá ở 408 tệp).
  ⇒ *9. Kinh Jāgara* và *Kinh Jāgara, thứ chín.* Tên riêng giữ dạng Pāli theo mẫu bầy lân
  cận; chưa có tiền lệ Việt nào cho `Jāgara` (đo trong toàn tầng: 0). Có một điểm cần biên
  tập lưu ý: uddāna của `Gandhāravagga` tại `ja416:10.3` ghi `Urago, Vidhuro, puna jāgarataṁ`
  — dạng *Jāgaratā* — nên đây là tên phẩm dạng tính từ, không phải tên riêng có dấu `-a`.

  PĀLI TRÙNG NGUYÊN VĂN — 5/33 khoá có Pāli trùng byte-for-byte ở bài khác: ba khoá tiêu
  đề cộng `5.1` và `5.2`, cả hai trùng `sn1.23:3.1–3.2`. Cả năm đều dùng lại nguyên văn:
  `5.1` lấy y hệt *Những ai tham, sân* và `5.2` lấy y hệt *và vô minh đã được diệt tận;*.
  Bản nháp đầu tiên của tôi ghi *Những ai mà tham ưu cùng sân, / vô minh cũng đã bị loại trừ;*
  — vừa là một cách Việt thứ hai cho cùng Pāli, vừa **lộng ngữ pháp**: `Yesaṁ` là cách sở
  hữu (*của những ai*), không phải tân ngữ bổ nghĩa cho `rāgo`/`doso`. Cả hai lý do đều buộc
  phải sửa.

  [Hai mục CHỖ ĐỌC LẠI và BẤT ĐỊNH của lượt chấm 2026-10-05 đã bị thay thế hoàn toàn bởi
  mục "Giải quyết draft 2026-10-12" ở cuối; cách đọc cũ (`sutto` = "đã nghe", `kodha` = "sân")
  là sai.]

  DẤU LƯỢC: bài này không có khoá nào chứa `…pe…` và không có `…` trần; hai phía đều 0.
  Đây là câu kệ, không có đoạn lược.

  CỔNG KỸ THUẬT. Agent dịch không được chạy lệnh `npm` (BRIEF cấm
  `validate|test|build|check`). Tôi tự kiểm và tất cả xanh: `_hvi.kiểm` pass; set khoá Việt
  bằng set khoá Pāli (33/33, kể cả 33 khoá ngắn hơn 40 ký tự mà `_hvi` không quét); mọi giá
  trị NFC; không khoá nào trùng nguyên văn Pāli ngoài `:0.1`; nháy kép cân trên cả bài
  (5 mở, 5 đóng — khớp đúng với Pāli: `1.1`→`1.4`, `2.1`→`2.4`, `3.1`→`3.4`, `4.1`→`7.4`);
  không có `(…)` đứng một mình; dấu lược khớp; thứ tự khoá theo số. Vì chưa chạy bốn cổng
  `npm` và chưa có lượt rà của người, `technical_integrity` đặt **9.6** chứ không phải 10.0.

  Giải quyết draft 2026-10-12: đọc đối kháng lại toàn bài từ Pāli; bản dịch cũ sai nghĩa ở
  hầu hết các khoá nội dung (26/28 khoá `1.1`–`7.4` đổi; `5.1`, `5.2` giữ vì trùng bài khác;
  bốn khoá tiêu đề `0.x` và `8.1` không đổi) nên đã viết lại.
  (1) `kodha` ở `1.1`/`1.2` là `ko idha` = "ai ở đây" (song song `ko`… `ko` ở `1.3`/`1.4` và
  `kathaṁ`… ở `3.x`), không phải `kodha` = "sân" như bản cũ ("Còn về sân…").
  (2) `sutto` là "ngủ" (tính từ của `supati`), đối với `jāgaro` = "thức"; `jāgarataṁ` và
  `suttesu` là cách sở hữu/vị trí số nhiều = "giữa những người đang thức / đang ngủ". Bản cũ
  đọc `sutto` là "đã nghe" (lẫn với `suta`) rồi bịa thêm "những lời nghe ấy": không có trong
  Pāli. Mạch `1`→`2`→`3`→`6` tự đối xứng chính là bằng chứng: `2.1–2.2` là lời tự nhận
  (`ahaṁ jāgarataṁ sutto`), `6.x` nhắc lại bằng `evaṁ`.
  (3) `4.3` `tesu suppamānesu` = "giữa những người đang ngủ" (`supati`, phân từ hiện tại),
  bản cũ ghi "đang canh giữ" (sai) ; `4.4` `jaggāmi` = "ta thức". `5.4` `suttosmi` = "ta
  ngủ" (bản cũ ghi "hoàn toàn thức giác" — đảo nghĩa). Hai vế `4` và `5` là hai nửa đối nhau
  của `2.1–2.2` (thức giữa kẻ ngủ / ngủ giữa người thức), và `6` tóm lại cả hai.
  (4) `4.1–4.2`: `saṁyamoti damoti ca` là hai danh từ được gọi tên bằng `iti` làm đồng vị với
  `dhammaṁ` ("pháp gọi là chế ngự và điều phục"); không thêm dấu nháy đơn vì Pāli không có.
  `saṁyamo damo` đi đôi ở `an3.45:2.2` ("chế ngự và điều phục"), dùng lại cặp ấy.
  (5) `devate` là hô cách số ít của `devatā`: lời người đáp gọi người hỏi, nên người hỏi là
  một thiên; theo tiền lệ khi chưa rõ giới (`sn1.71:3.4`, `pv17:19.2`, `pv38:53.2`,
  `pv46:2.2` đều "hỡi vị thiên") dịch "hỡi vị thiên", không nói "thiên nữ" (chỉ dùng khi
  ngữ cảnh nêu rõ nữ, như `ja538`, `ja539`). Bản cũ "bạch đấng thần" là cách dịch lạ, không có tiền lệ.
  (6) `1.3` `mametaṁ` = `mama etaṁ` ("điều này của ta"), không phải "trong số các ngươi" (thêm
  nghĩa); `1.4` `taṁ paṭibhaṇāti me` = "đáp lại ta điều ấy". Hiện tại, không phải tương lai
  ("sẽ giảng") như bản cũ. Xưng hô giữa hai bên dùng "ta"/"ngài" (Pāli chỉ có `te`, `me`,
  `tvaṁ`-ngôi hai; không có từ xưng hô thể hiện thứ bậc), tránh "ngươi" vì chưa biết ai là
  vua/ai là thiên.
  (7) `7.1–7.4` `Sādhu…` = "Tốt thay…" (tiền lệ `ja429:5.1`, `ja527:45.1`: 5 khoá "Tốt thay" /
  4 khoá "Thật tốt" trên các khoá `Sādhu` đầu câu ở tầng `ja`), đổi từ "Hay lắm".
  (8) `5.1`–`5.2` giữ nguyên lời bản đã có ở `sn1.23:3.1–3.2` (Pāli trùng; 2/8 khoá có Pāli
  `avijjā ca virājitā` ở tầng dùng chính câu này).
  Pāli trùng nguyên văn trong chính bài: 0 cặp (`1.x`/`2.x`/`3.x`/`6.x`/`7.x` đều khác ở từ
  đầu dòng); phép này không phát hiện gì cần dùng lại.
  Blocker đã gỡ: (a) "Cổng coverage KHÔNG ĐO ĐƯỢC GÌ": mẫu số bằng 0 (cả 33 khoá < 40 ký tự)
  nên cổng không có gì để chặn; đây không phải lỗi văn bản và việc thiếu tầng tham khảo đã
  nằm ở blocker còn lại. (b) "Còn bất định ở `4.4`/`5.4` `devate` và `4.2`": đã phân xử
  bằng ngữ pháp và tiền lệ như (4)–(5) ở trên. Blocker giữ nguyên: thiếu bản Anh upstream (sự
  thật của bản chụp đã ghim). `vietnamese-current` chỉ có Pháp Cú nên không có tầng Việt
  hiện hành; `english-project` chưa có.
  BẤT ĐỊNH CÒN LẠI (không đổi nghĩa bản dịch): (i) khung truyện của Jātaka này không có
  trong tầng đã ghim, nên không biết ai hỏi, ai đáp ngoài việc người hỏi là một thiên
  (`devate`); (ii) nghĩa bóng "thức/ngủ" (tỉnh thức đối với pháp) là cách hiểu ngữ cảnh
  `4`–`5`, không tuyên bố thêm vào thân kinh; (iii) `virājitā` có nhiều cách dịch ở tầng
  (`đã được diệt tận`, `ly tham`, `ly nhiễm`…) — giữ cách đã có ở bài trùng. Vì không có bản
  Anh độc lập, `triangulation` vẫn 7,5. `technical_integrity` 9,6: bốn lệnh `npm run
  validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
