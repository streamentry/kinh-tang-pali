  TÊN PHẨM `:0.3` — `translationTitle` bằng đúng `:0.3`. Pāli `Mettaguttheraapadāna` không bắt đầu
  bằng số nên BỎ số thứ tự (không thuộc nhóm THỪA). Mẫu câu đo được trên các bài `tha-ap` đã có `:0.3`
  ở cây làm việc: cửa sổ gần nhất tha-ap395–420 là Ký Sự 9/9; cửa sổ tha-ap380–440 là Ký Sự 19 / Tuyên Ngợ 13 /
  Tuyên Ngôn 6 / Tuyên Ngợi 1 / khác 1; toàn phẩm (tha-ap1–600) là Tuyên Ngợ 242 / Tuyên Ngôn 133 / Ký Sự 113 /
  Tuyên Ngợi 10 / khác 7. Hai phạm vi cho hai đa số khác nhau. `Tuyên Ngợ` là chính tả đáng ngờ (Pāli không có
  chữ nào tương ứng), nên bài này dùng *Ký Sự Về Trưởng Lão*, khớp tha-ap404 và `:29.1` *Ký sự về Trưởng lão …,
  thứ ba*. Đề nghị người biên tập phán một lượt cho cả cuốn.

  `:0.1` `Therāpadāna` giữ nguyên Pāli theo đa số tầng (494 khoá). `:0.2` `Metteyyavagga` → *Phẩm Metteyya*, theo
  cách tha-ap404 và tha-ap416 lấy tên riêng làm tên phẩm (2 khoá tiền lệ).

  THUẬT NGỮ VÀ TIỀN LỆ (đếm trên 8.812 dòng Pāli khác nhau của phẩm `tha-ap` đã có Việt):
  - Dò 38 khoá có Pāli trùng nguyên văn với một khoá đã dịch ở phẩm; 27 khoá dùng lại đúng một bản Việt đã có,
    11 khoá khác (hầu hết khác chỉ ở chữ hoa đầu câu, ở độ dài câu, hoặc ở các điểm nêu bên dưới).
  - Đại từ: *ta* xuyên suốt cho người kể, theo đa số tầng (`Kilesā jhāpitā mayhaṁ` 102 ta / 40 tôi;
    `viharāmi anāsavo` 108 ta / 46 tôi). Lời Đức Phật ở `:7`–`:13` xưng *ngươi*, theo tiền lệ `:8.1`
    *Ngươi hãy yên tâm, đừng sợ hãi* và `cakkavattī bhavissasi` → *ngươi sẽ là Chuyển Luân Vương* (2 khoá).
  - Ba công thức kệ chung `:25`, `:26`, `:27` dùng nguyên văn đa số toàn tầng: *Các phiền não của ta đã được
    thiêu rụi* (102), *Thật lành thay sự đến của ta* (97), *Bốn vô ngại giải* (491); `…pe…` → đúng một `…`
    (682 khoá `…`, 6 khoá `… `).
  - `sappi` → *bơ lỏng* (toàn tầng `content/translation/vi/project/sutta/`: chuỗi *bơ lỏng* 34 lần, *bơ sữa* 14 lần;
    riêng 3 khoá `sappi` đã dịch ở `tha-ap` thì *bơ sữa* 3 / *bơ lỏng* 1). Chọn *bơ lỏng* vì `sappi` là ghee, còn
    *sữa* là `khīra`; khác tha-ap168 (*bơ sữa*), đề nghị người biên tập phán. `sappitela` (`:3.4`) dịch *bơ lỏng và dầu*
    (dvandva), không gộp thành *bơ sữa*. `sappidānassidaṁ phalaṁ` → *đó là quả báo của việc dâng bơ lỏng* (cùng khuôn
    tha-ap168).
  - `Himavantassāvidūre` → *Không xa dãy Himavanta* (12 khoá). `sambuddho` → *Đức Chánh Đẳng Giác*; `X nāma sambuddho`
    dùng *tên là* (nhóm *Đức Toàn Giác tên là …* nhiều khoá), không dùng *tôn hiệu* (2 khoá tha-ap).
  - `aggo kāruṇiko muni` → *bậc tối thượng, bậc Mâu-ni giàu lòng bi mẫn*. Tha-ap tiền lệ duy nhất (1 khoá) dịch
    `aggo` là *đầu tiên*; `agga` nghĩa là bậc nhất, tối thượng (cùng nhóm `aggo loke sadevake` → *bậc tối thượng*), nên không theo.
  - `añjaliṁ paggahetvāna` → *ta chắp tay lên* (tiền lệ: *ta giơ hai tay lễ rồi* 6, *Chắp tay cung kính* 5, *Chắp hai tay
    cung kính* 3; hai dạng sau thêm *cung kính* mà Pāli không nói).
  - `cetanāpaṇidhīhi ca` → *cùng với tâm nguyện và chí hướng* (26 khoá). `Aho buddhā aho dhammā` → *Ôi những bậc Phật,
    ôi những pháp ấy* (4 khoá, so với 1 khoá *Ôi các Đức Phật, ôi các Đức Pháp*); `aho no satthu sampadā` → *ôi sự thành tựu
    của bậc Thầy chúng ta!* (tha-ap113).
  - `Padesarajjaṁ vipulaṁ` → *vương quyền cai quản các vùng đất rộng lớn* (7 khoá; dạng *Vương quốc rộng lớn ấy* 15 khoá
    thêm đại từ chỉ định mà Pāli không có). `gaṇanāto asaṅkhiyaṁ` → *đếm không hết, vô tận* (13+8). `Cāturanto vijitāvī`,
    `jambumaṇḍassa issaro` theo tiền lệ (3, 2 khoá).
  - `Aṭṭhārase kappasate` ở tha-ap tiền lệ là *Vào một ngàn tám trăm kiếp trước* (11 khoá) vì đó là quá khứ (`ito`);
    ở `:10.3` động từ là tương lai `ramissasi` nên dịch *trong một ngàn tám trăm kiếp nữa* (định vị cách chỉ khoảng thời gian,
    không phải *sau* một ngàn tám trăm kiếp).
  - Số Pāli: `Aṭṭhārase kappasate` = aṭṭhārasa 18 × sata 100 = 1.800 (một ngàn tám trăm); `Aṭṭhatiṁsatikkhattuñca` =
    aṭṭha 8 + tiṁsa 30 = 38 lần (ba mươi tám); `Ekapaññāsakkhattuñca` = eka 1 + paññāsa 50 = 51 lần (năm mươi mốt);
    `Saṭṭhikoṭī` = saṭṭhi 60 koṭi (sáu mươi koṭi; giữ nguyên *koṭi*); `Tiṁsakappasahassamhi` = tiṁsa 30 × sahassa 1.000 =
    ba mươi ngàn (xem bất định 1); `catasso` (`:27.1`) = bốn.
  - Pāli trùng nguyên văn trong chính bài: 5 nhóm (`:5.1`/`:9.1`/`:10.1`; `:5.2`/`:9.2`; `:5.3`/`:9.3`; `:23.4`/`:24.4`;
    `:25.2`/`:26.2`/`:27.2`), bản Việt của cả 5 nhóm giống nhau, 0 cặp lệch.
  - Nháy: Pāli mở “ ở `:1.1`, đóng ” ở `:27.3`, cố ý chạy qua khoá; lồng ‘ ở `:7.1` và đóng ’ ở `:8.4`. Đối chiếu từng khoá:
    0 lệch trên 110 khoá. Không có `ti` ở bài này.
  - Lời kết `:28.1` dùng nhóm số nhiều *đã nói những bài kệ này* (Pāli `imā gāthāyo`; 407 khoá, so với 21 khoá
    *bài kệ này* số ít), cùng khuôn `:29.1` *Ký sự về Trưởng lão …, thứ ba* như tha-ap404.

  BẤT ĐỊNH — để người biên tập phán, không thêm vào thân kinh:
  1. `Tiṁsakappasahassamhi` (`:17.1`): dịch *ba mươi ngàn kiếp* vì `tiṁsa` là ba mươi (cùng gốc `Tiṁsakappāni` → *ba mươi
     kiếp*, 2 khoá tha-ap) và `sahassa` là một ngàn. Tiền lệ phẩm là *Vào ba mươi ngàn kiếp trước đây* 6 khoá, *Trong ba mươi
     nghìn kiếp* 5 khoá, so với *ba nghìn kiếp* 2 khoá; tầng Anh đã ghim không có bản nào cho dạng này nên không có chứng cứ
     độc lập. Bỏ chữ *đây* so với tiền lệ vì Pāli không có `ito`. Lưu ý: cách đọc `tiṁsa` = 3 (tức *ba nghìn kiếp*) không khớp
     từ vựng Pāli (`tiṁsa` = 30, `ti` = 3); người biên tập cần phán chính thức.
  2. `nerupassato` (`:20.2`): hapax trong toàn bộ tầng Pāli sutta đã ghim (chỉ xuất hiện một lần). Dịch *bao nhiêu tính từ sườn núi Neru*, hiểu là
     `nerupassa` (sườn Neru) + hậu tố xuất xứ `-to`; cũng có thể hiểu là *đến chừng sườn núi Neru*. Không có tiền lệ.
  3. `viññāpitaṁ` (`:17.4`): dịch *đã từng xin* (`viññāpeti` nghĩa gốc là làm cho biết, dùng cho việc nêu lời xin). Nếu hiểu
     khác (*được báo cho biết*) thì nghĩa cả kệ đổi; câu Việt giữ ở mức *xin*.
  4. `chaḷaṅgaṁ nāma lakkhaṇaṁ` (`:15.2`): dịch *môn tướng pháp gọi là sáu chi phần*, hiểu `lakkhaṇa` là môn về các tướng
     (đối chiếu bối cảnh Bāvarī) và `chaḷaṅga` là sáu chi phần của môn học Bà-la-môn. Có thể hiểu là hai môn riêng
     (*sáu chi phần* và *tướng pháp*). Không có tiền lệ cho cụm này.
  5. `Tamandhakāraṁ vidhamaṁ` (`:15.3`) đứng trước `uppajji tvaṁ` nên được hiểu là *Ngài xua tan bóng tối ấy rồi xuất hiện*;
     `vidhamaṁ` có thể là dạng nói gọn của `vidhamanto`. `Ngài` là chủ ngữ theo `tvaṁ`, không phải người kể.
  6. `:18` (`saṅkappamaññāya … cittamaññāya`): Pāli không nêu rõ ai biết ý định của ai. Câu Việt giữ trung tính
     (*Nhờ thấu rõ ý định của ta* theo tiền lệ 14 khoá; *biết rõ tâm đã sinh khởi*) và không thêm chủ ngữ.
  7. `adhigantvā mahāyasaṁ` (`:8.2`): dịch *sau khi đạt được danh tiếng lớn* (`mahāyasa` là danh từ, tiền lệ `anubhohi mahāyasaṁ`
     → *thọ hưởng danh tiếng lớn lao*); cũng có thể hiểu là *đến với bậc Đại Danh Xưng*.
  8. `hirañña` (`:14.1`) dịch *vàng bạc* (tiền lệ tha-ap 1 khoá `hiraññassāpi` → *vàng bạc*); nghĩa chặt là vàng chưa chế tác, có thể kèm bạc.
  9. `Mamānulittagandhassa` (`:22.3`): dịch *hương thơm ta đã thoa*; Pāli không nói rõ đó là hương thơm cõi người hay cõi trời.
  10. `diṭṭhadhammika` (`:23.2`) dịch *thuộc đời này* (0 tiền lệ ở tầng cho từ này).
  11. `Padesarajjaṁ vipulaṁ` (`:11.3`) không có động từ trong Pāli; Việt để nguyên dạng danh từ nối tiếp kệ trước, không thêm *ngươi sẽ có*.

  CỔNG KỸ THUẬT: không chạy được trong lát này nên `technical_integrity` đặt 9.6, không tuyên bố đã qua
  cổng. Còn phải chạy trước khi gộp: npm run validate, npm test, npm run check, npm run build.

  Lượt cải thiện 2026-10-13: đọc đối kháng lại cả 110 khoá, đối chiếu với chỉ mục Pāli→Việt của phẩm `tha-ap` (15.911 dòng Pāli khác
  nhau đã có Việt, trừ chính bài này). Đổi 5 khoá (4 giá trị khác nhau), không đổi tập khoá hay thứ tự:
  - `:10.3` *trong một ngàn tám trăm kiếp nữa* → *trong một ngàn tám trăm kiếp*. Công thức `Aṭṭhārase kappasate, devaloke ramissati`
    ở tha-ap401, 413, 490, 553 đều dịch *Trong một ngàn tám trăm kiếp,* (4/4, không có *nữa*); chữ *nữa* chỉ dùng cho lời thọ ký
    một vị sẽ xuất hiện (tha-ap409, 414, 492: *Sau … nữa*), nên ở đây nó thêm nghĩa "từ nay trở đi" mà định vị cách của Pāli không nêu.
    (accuracy fix; `grammar_logic` 8.9 → 9.0, `semantic_fidelity` 8.8 → 8.9.)
  - `:22.4` *cũng không sánh được* → *cũng sẽ không sánh được*: `upanidhiṁ na hessati` là tương lai, cùng khuôn `:20.4`
    (*sẽ không bằng một phần nhỏ*); bản trước làm mất thì. (accuracy fix; tính vào `grammar_logic`.)
  - `:23.4`, `:24.4` *đó là quả báo* → *đây là quả báo của việc dâng bơ lỏng*: Pāli `idaṁ` là "này/đây". Đo trên toàn các câu kết
    `…idaṁ phalaṁ` của phẩm: *đây* 331 / *đó* 292; ở cửa sổ gần nhất (tha-ap380–440) *đây* 78 / *đó* 34, nên theo đa số gần nhất.
    Hai khoá có Pāli trùng nguyên văn trong bài (`:23.4` = `:24.4`) vẫn có bản Việt giống nhau. (terminology fix.)
  - `:24.2` *lấy định và thiền làm nơi sinh hoạt* → *lấy định và thiền làm cảnh giới*: cùng khuôn `X-gocaro` ở ne10:25.2
    (*lấy chánh tư duy làm cảnh giới*) và ne25 (12 khoá *…là cảnh giới*); *nơi sinh hoạt* là cách nói hiện đại hẹp hơn `gocara`.
    (terminology fix; `terminology` 9.0 → 9.1.)
  Bất định đã được thu hẹp nhờ đối chiếu Pāli trong kho (không dùng nguồn ngoài):
  - Bất định 1 (`Tiṁsakappasahassamhi`, `:17.1`): bv13:13.3 (Sumedhabuddhavaṁsa, lời thọ ký của chính Đức Sumedha)
    dùng đúng cụm này cho khoảng cách từ thời Ngài đến lúc Bodhisatta thành Phật, và bản Việt của bv13 đã là *ba mươi ngàn kiếp*;
    tha-ap17, 109, 115 cũng *ba mươi ngàn*; chỉ tha-ap151 (1 khoá) là *ba nghìn*. Giữ *ba mươi ngàn kiếp*; hướng đọc `tiṁsa` = 3
    không có căn cứ trong tầng Pāli. Vẫn là suy luận từ song song nội bộ, chưa có bản Anh độc lập, nên chưa coi là phân xử dứt khoát.
  - Bất định 5 (`Tamandhakāraṁ vidhamaṁ`, `:15.3`): tha-ap412:28.3–4 (`Tamandhakāraṁ vidhamaṁ, uppajji tāvade jino`) cho thấy
    chủ ngữ của `vidhamaṁ` và `uppajji` là Đức Phật; điều này xác nhận *Ngài xua tan … Ngài đã xuất hiện* ở `:15.3–4`. Đã phân xử.
  Điểm còn giữ nguyên: `triangulation` 6.5 → 6.8 chỉ phản ánh hai song song Pāli nội bộ vừa dò; vẫn không có bản Anh độc lập nên
  không thể cao hơn. `ambiguity_integrity` giữ 9.0 vì `nerupassato` (hapax), `viññāpitaṁ`, `chaḷaṅgaṁ nāma lakkhaṇaṁ`, `:18` và các
  bất định 6–11 ở trên vẫn chưa phân xử được. Các dòng cũ ở trên về `:10.3` (*… kiếp nữa*) và `:23.4`/`:24.4` (*đó là quả báo*) là
  lịch sử đã được dòng này thay thế.
  Cổng kỹ thuật vẫn chưa chạy trong lượt này nên `technical_integrity` giữ 9.6: npm run validate, npm test, npm run check, npm run build.
  Lỗi ngoài bài (chỉ báo, không sửa): tha-ap436:3.1 dịch `Tamandhakāraṁ` là *bóng tối của cây ta-mà-rạch* (sai: `tama` + `andhakāra`
  = bóng tối mù mịt, như tha-ap412:28.3 và tha-ap409:34.3).

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 9 khoá bất đồng nghĩa → sửa 1 (21.3: `nibbattavatthānaṁ`, trước *những vật đã sinh ra cho ta* → sau *những tấm vải đã sinh ra cho ta*, vì `vatthānaṁ` là số nhiều của `vattha` (tấm vải), không phải `vatthu`, và ba kệ 20–22 lần lượt so bơ lỏng, vải, hương thơm khớp với `vatthaṁ gandhañca sappiñca` ở 23.1), giữ 2 (17.4: `sappiṁ viññāpitaṁ mayā`, bản nguyên bài hiểu là lượng bơ lỏng, nhưng `viññāpita` là được xin, khớp với kệ kế tiếp nói vật hiện ra theo ý muốn; 18.4: `sabbe santappayāmahaṁ`, bản nguyên bài hiểu tôi được thỏa mãn, nhưng đây là dạng sai khiến và `sabbe` là đối cách, nên giữ *ta làm cho tất cả được thỏa mãn*), bất định 6 (17.1: `tiṁsakappasahassamhi`, số ba mươi ngàn kiếp hai bản khớp, nhưng bản dự án hiểu là *cách đây* còn bản nguyên bài hiểu là thời gian dâng cúng; 18.3: `cittamaññāya nibbattaṁ` có thể tính từ của `cittaṁ` hoặc chỉ vật đã hiện ra; 20.2: `nerupassato`, *tính từ sườn núi Neru* so với *được nhìn thấy từ núi Neru*; 5.4, 6.4, 9.4: `labhāmi`/`labhase` là hiện tại Pāli dùng cho lời nguyện và lời thọ ký, bản dự án giữ thì hiện tại theo quy ước 7/7 chỗ của tầng, bản nguyên bài dịch như lời nguyện). Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Quyết định hội đồng biên tập 2026-10-16: B20 — 5.2, 9.2 (`cetanāpaṇidhīhi` = nhờ những ước nguyện của tâm); C6 — 27 khoá (1.3, 2.4, 3.3, 4.3, 5.4, …) (xưng hô theo mục 9: người kể xưng "tôi", Đức Phật tự xưng "Ta", lời thưa Đức Phật xưng "con").
