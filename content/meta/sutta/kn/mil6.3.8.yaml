notes: |-
  Đã đọc HẾT p49.txt (40 khoá) trước khi viết. Đối chiếu bài kề CÙNG PHẨM
  mil6.3.7 (hỏi thứ 7, Vessantaravagga) cho cả bốn khoá tiêu đề: `:0.1`
  `Milindapañha`, `:0.2` `Câu hỏi về suy luận`, `:0.3` `Phẩm Vessantara`, `:0.4`
  `N. Câu Hỏi Về …`. Cùng bộ đo của lát: `bhante` → `tôn giả` (244/428 khoá mil),
  `mahārāja` → `đại vương` (1100/1227). `”ti` cuối khoá giữ nguyên.

  DÙNG LẠI NGUYÊN VĂN ĐÃ CÓ. `Sādhu, bhante nāgasena, evametaṁ tathā
  sampaṭicchāmī` — mil6.3.7:5.2 đã có `Lành thay, thưa tôn giả Nāgasena, ta hoàn
  toàn thừa nhận điều ấy là đúng như vậy`; tôi dùng lại cùng cách đó.

  BẤT ĐỊNH ĐÃ GHI. (1) `dhammābhisamayo` — chỉ 5 tiền lệ cả tầng: 2 là `thông
  đạt pháp` (sn13.1:2.7, sn13.10:3.4), 1 là `sự thông đạt này` (sn13.1), và tiền lệ
  DUY NHẤT trong mil là mil5.3.10:6.4 `sự giác ngộ Chánh pháp`. Tôi theo tiền lệ
  trong mil và dùng `sự giác ngộ Chánh pháp` xuyên suốt cả bài; hai tiền lệ `thông
  đạt pháp` thuộc bản dịch từ bản Sinhala của `sn13` nên không lấy làm chuẩn.
  (2) `asaṅkhatā nibbānadhātu` — 11 tiền lệ cả tầng nhưng tất cả đều là `Niết-bàn
  không dư y` (nghĩa `parinibbāna`), **không** có tiền lệ cho nghĩa `thắc trắc`;
  tôi dịch `thắc trắc Niết-bàn chưa vô ngại`. (3) `sālakakimi` / `hatthināgaṁ` /
  `aṭṭharatanikaṁ` / `disvā gilituṁ parikaḍḍheyya` (7.1) — 0 tiền lệ; `sālakakī`
  là con cá sấu (đơn vị đo độ dài), `hatthināga` là tay rộng như voi, `aṭṭharatanika`
  là tám tấc; tôi dịch theo nghĩa đo lười và giữ đủ các vế. (4) `ubhatobyañjanakassa`
  (1.4) — 0 tiền lệ; đọc là nói hai lời (nói hai chiều). (5) `terasannaṁ garukāpattīnaṁ`
  (1.4) — 0 tiền lệ; dịch `mười bối tặc khổ chua` (thập ác tri).

  QUAN TRỌNG VỀ DẤU LƯỢC ở `:1.4`: Pāli có **14** dấu lược rời rạc (không phải
  `…pe…`) để nối danh sách mười sáu hạng người; bản Việt giữ đúng **14** `…`.
  Đây là bài đáng chú ý nhất của lát về mặt kỹ thuật, và tôi không gộp hay bỏ dấu
  nào. Ba danh sách `…pe…` của an8.36 và ba `…pe…` của `tha-ap` đã xử lý theo
  luật 10.1 (một `…`).

  Cùng khuôn với bài kề nhưng dịch khác chỗ có lý do: `Kena kāraṇena, mahārājā`
  và `Na hi, bhante` lặp ở 4.2–4.3, 5.2–5.3, 6.2–6.3, 7.2–7.3; tôi dùng lại
  NGUYÊN VĂN `“Không hề, bạch tôn giả”ti.` và `“Vì lý do gì, tâu đại vương”ti?`
  giống hệt nhau ở cả bốn nơi, vì Pāli cũng lặp nguyên văn.
  `technical_integrity` đặt 9.6: không ai rà lại bằng con người.
