notes: |-

  Bản dịch tiếng Việt mới cho bài kinh thi-ap10 — trưởng lão nữ Udakadāyikā, bài thứ mười và
  là bài cuối của Sumedhāvagga (phẩm thứ nhất), kèm lời kết phẩm và bài kệ tóm tắt.

  Nội dung: tại thành Bandhumatī, tôi là người gánh nước, sống bằng nghề ấy để nuôi các con.
  Không có vật gì để dâng nơi phước điền vô thượng, tôi đến nhà cổng và dọn sẵn nước. Nhờ
  nghiệp lành ấy tôi đến cõi trời Ba mươi ba, ở đó cung điện của tôi hóa hiện nhờ việc
  gánh nước; trong một ngàn tiên nữ tôi là bậc ưu việt, và về mười phương diện tôi luôn vượt
  trội hơn họ. Tôi giữ ngôi hoàng hậu của năm mươi vị thiên vương và hai mươi vị Chuyển Luân
  Vương, luân hồi trong hai kiếp sống mà không biết đến đọa xứ, đó là quả báo của việc cúng
  dường nước uống. Muốn có nước thì nước đến ngay; đám mây lớn đổ mưa khi thấu rõ ý định
  của tôi, và có lần tôi được thân quyến dẫn đi, tôi mong mưa thì mây lớn liền khởi lên. Nay
  thân tôi không có nóng bức, nhiệt não hay bụi, tâm thanh tịnh, các lậu hoặc đã cạn kiệt,
  không còn tái sanh. Vào chín mươi mốt kiếp trước tôi đã dâng nước, từ đó không biết đến
  đọa xứ.

  SỐ LƯỢNG (tự tính, đã đối chiếu từng khoá):
  - `5.1` `Paññāsaṁ` = 50; `5.3` `Vīsati` = 20; `4.1` `sahassa` = 1000 (một ngàn tiên nữ);
    `12.1` `Ekanavutito` = eka 1 + navuti 90 = 91 (chín mươi mốt), khớp tiền lệ đã đo của tầng.
  - `21.3`–`21.4` `Ekagāthāsatañceva, tiṁsati ca taduttari`: `ekagāthāsata` là `ekaṁ gāthāsataṁ`
    (một trăm bài kệ) như ở hai bài `tha-ap` có Pāli `Ekaṁ gāthāsataṁ`; cộng `tiṁsati ca
    taduttari` (ba mươi bài nữa) = 130. Đối chiếu bằng cách đếm số nhóm khoá kệ của mười bài
    `thi-ap1`–`thi-ap10` trong phẩm (trừ hai khoá mở đầu của `thi-ap1`): ra đúng 130, khớp.

  TÊN, ĐỀ MỤC VÀ KẾT PHẨM (đã đo phạm vi gần nhất, nêu cả hai số):
  - `translationTitle` bằng đúng `:0.3` của bản dịch; Pāli `:0.3` không bắt đầu bằng số nên
    không có số thứ tự ở đầu.
  - `:0.3` dùng `Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni X` theo đa số của chính phẩm: trong các
    bài `thi-ap` đã dịch có 11 tệp dùng `Tuyên Ngợ` so với 1 tệp dùng `Tuyên Ngôn` (thêm 1
    tệp để nguyên tên Pāli); trong `tha-ap`, `Tuyên Ngợ` 236 so với `Tuyên Ngôn` 108 và
    `Ký Sự` 99. `Tuyên Ngợ` có vẻ là chính tả sai của `Tuyên Ngôn` hoặc của một từ khác, nhưng
    đây là quy ước của cả cuốn, cần người biên tập phán một lượt cho toàn bộ; bài này giữ
    nhất quán với các bài kế cận chứ không tự đổi một mình.
  - Tên therī `Udakadāyikā` giữ nguyên Pāli, theo đa số `thi-ap` (Maṇḍapadāyikā, Naḷamālikā,
    Modakadāyikā, Saḷalapupphikā, Kaṭacchubhikkhādāyikā, Ekapiṇḍapātadāyikā…); chỉ `thi-ap2`
    và `thi-ap4` dịch tên thành vế nghĩa.
  - `18.1` `Sumedhāvaggo paṭhamo` dịch `Phẩm Sumedhā là phẩm thứ nhất` theo đa số của
    `tha-ap` (20 khoá dạng `là phẩm thứ N`, 11 khoá dạng `…, thứ N`); ở các bộ khác của
    tầng Việt (Tương Ưng, Tăng Chi, Jātaka, Milinda), dạng `Phẩm X, thứ N` lại chiếm đa số. Hai
    phạm vi cho hai đa số khác nhau; chọn phạm vi gần nhất, cần phán một lượt cho cả cuốn.
  - `19.1` `Tassuddānaṁ` → `Tóm tắt phẩm này:` (29 khoá, so với `Tóm lược:` 9 khoá).
  - `16.1` dùng công thức `Tôi nghe như vầy: … đã nói những bài kệ này.` (đa số rõ, số nhiều
    đúng với `imā gāthāyo`), không dùng dạng `đã từng nói bài kệ này`.
  - Bài kệ tóm tắt `20.1`–`21.4` liệt kê mười bài của phẩm theo thứ tự: Sumedhā (thi-ap1),
    Mekhalādāyī (2), maṇḍapa (3), saṅkama (4), Naḷamālī (5), Piṇḍadadā (6), Kaṭacchu (7),
    Uppalappadā (8), Dīpadā (9), Dakadā (10). Tên riêng giữ Pāli, theo cách `tha-ap112` xử lý
    bài kệ tóm tắt của phẩm. `maṇḍapaṁ saṅkamaṁ dadā`: `dadā` (người cho) áp dụng chung cho
    hai vế; `maṇḍapa` dịch `mái che` (tiền lệ `maṇḍapaṁ kārayiṁ ahaṁ` → mái che; `thi-ap3`
    dịch `ngôi nhà lợp`), `saṅkama` dịch `chỗ bước qua` (cùng gốc với `Saṅkamanatthā` ở
    `thi-ap4`, nơi tầng đã dịch là làm cầu cho Đức Phật bước qua). Không thêm gì ngoài Pāli.

  KHOÁ DÙNG LẠI NGUYÊN VĂN TỪ TIỀN LỆ: 31 khoá Pāli của bài có Pāli trùng nguyên văn ở nơi khác
  trong tầng Việt; 25 khoá dùng lại đúng bản đã có (0.1, 0.2, 1.1, 3.1, 6.2, 6.3, 6.4, 7.1, 8.3, 10.4,
  11.1, 11.4, 12.1, 12.3, 12.4, 13.1, 13.2, 13.3, 14.1, 14.2, 14.3, 15.1, 15.2, 15.3, 19.1);
  6 khoá khác tiền lệ (1.4, 2.1, 3.2, 3.3, 5.2, 11.2), mỗi khoá có lý do ở dưới.
  Trong chính bài có 3 nhóm Pāli trùng (6.3/12.3; 6.4/10.4/12.4; 13.2/14.2/15.2) và cả 3 nhóm
  đều có bản Việt giống nhau. Khoá `12.1` `Ekanavutito kappe` chọn `Vào chín mươi mốt kiếp
  trước` theo phạm vi gần nhất (`thi-ap6`, `thi-ap12`); toàn tầng `Vào…` và `Từ…` bằng nhau
  (38 và 38), nên đây là chọn theo phạm vi gần.

  KHÁC TIỀN LỆ, CÓ LÝ DO:
  - `5.2`, `5.4` `mahesittamakārayiṁ`: dịch `tôi đã giữ ngôi hoàng hậu`. `mahesī` là hoàng
    hậu (tầng đã dịch `mahesī` = hoàng hậu ở an10.45, sn19.15…), `mahesitta` là địa vị hoàng
    hậu, `kāreti` là thực thi, cai quản; `thi-ap1:15.4` và `thi-ap1:5.3` (`sattaratanamahesī,
    itthiratanaṁ`) cho thấy đúng ngữ cảnh người nữ làm hoàng hậu. `mahesi` với một `t` mới là
    Đại Ẩn Sĩ; đây là `mahesī` + `-tta`. CẦN XỬ LÝ RIÊNG, NGOÀI LÁT NÀY: cùng Pāli này đang
    được dịch `tôn vinh Đại Ẩn Sĩ` ở `thi-ap5:4.2` và `4.4`, `thi-ap16:4.2` và `5.2`, và cụm
    `mahesittaṁ karissasi` ở `thi-ap7:3.4` và `4.2` (tổng 6 khoá trong 3 bài). `thi-ap6` đã
    dịch hướng hoàng hậu. Cả 6 khoá cần sửa cùng một lượt.
  - `11.2` `apetamanapāpikā`: không có từ điển hay tầng Anh nào ghim cho cụm này, và cụm xuất
    hiện đúng 2 lần trong toàn Pāli ghim (`thi-ap10:11.2`, `thi-ap16:7.2`). Bản `thi-ap16`
    tách thành `apetamana` (không chán ghét) và `anapāpikā` (không ác ý); tôi đọc `apeta` (đã
    rời) + `mana` (tâm) + `pāpikā` (điều ác) và dịch `điều ác nơi tâm đã rời bỏ`, vì đọc này
    chỉ dùng từ vựng có thật, không cần giả định `mana` là `chán ghét`. Đây là hapax chưa
    phân xử được; hai bản Việt khác nhau cho cùng Pāli, người biên tập quyết một lần.
  - `2.1` `Deyyadhammo ca me natthi`: hai tiền lệ (`tha-ap142`, `tha-ap101`) dịch `deyyadhamma`
    thành `giáo pháp`, trong khi `deyya` (đáng cho) + `dhamma` (vật, thứ) là vật để dâng cúng.
    Dịch `vật gì để dâng cúng`; chỗ này là bản tiền lệ sai nghĩa của từ, không sửa ở đây.
  - `3.2` `tāvatiṁsamagacchahaṁ`: một tiền lệ (`tha-ap416:5.2`) dịch `ta đã chứng đạt được mức
    ấy`, bỏ mất cõi Tāvatiṁsa; 13 trong 18 khoá cùng Pāli (dạng khác dấu câu) dịch `đã đến cõi trời
    Ba mươi ba`, dùng bản này (11 khoá viết `ta`, 2 khoá viết `tôi`; ở đây dùng `tôi` theo ngôi của bài).
  - `3.3` `Tattha me sukataṁ byamhaṁ`: tiền lệ `tha-ap501:4.1` dịch `đã làm khéo làm bằng
    vàng`, mất nghĩa `byamha` (cung điện); các nơi khác của tầng dịch `byamha` là cung điện.
  - `1.4`: chỉ đổi `ta` thành `tôi`.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - `2.3` `Koṭṭhakaṁ upasaṅkamma`: `koṭṭhaka` có ít nhất ba nghĩa (nhà cổng, nhà kho, ngăn
    gian). Tầng đã dịch `dvārakoṭṭhaka` / `pubbakoṭṭhaka` là cổng; bài không có chú giải ghim,
    nên chọn `nhà cổng` và ghi rõ đây là cách đọc ít giả định nhất, không thêm bối cảnh nào.
  - `2.4` `udakaṁ paṭṭhapesahaṁ`: `paṭṭhapeti` là đặt, bày, thiết lập; dịch `dọn sẵn nước`,
    không thêm đối tượng nhận nước vì Pāli không nói.
  - `8.1`–`8.2` `Avuṭṭhikā disā natthi, santattā kuthitāpi ca`: đọc `santattā` và `kuthitā` là
    hai tính từ của `disā` (phương bị nung nóng, nung sôi), tức là không có phương nào không
    mưa dù ở nơi bị thiêu nóng. Không thêm giải thích khí hậu.
  - `9.1`–`9.2` `Kadāci nīyamānāya, ñātisaṅghena me tadā`: cùng cặp Pāli ở `thi-ap8:10.1`–`10.2`
    (nơi vế sau là lọng lớn che trên đầu); dịch sát `được dẫn đi bởi đoàn thân quyến`, không
    suy diễn việc đi đâu, vì Pāli không nói.
  - `4.3` `Dasaṭṭhānehi`: dịch `về mười phương diện`, theo cách tầng đã dịch `dasahi ṭhānehi`
    ở `sn40.10`; Pāli không liệt kê mười phương diện ấy nên không thêm.
  - `13.3` `viharāmi anāsavā`: tiền lệ hiện có chia hai dạng; 6 trong 11 khoá thêm `đời thanh tịnh`
    (không có từ tương ứng trong Pāli), 5 khoá (trong đó `thi-ap3`, `thi-ap6`, `thi-ap7`,
    `thi-ap16`) chỉ dịch `sống không còn lậu hoặc`. Lát này chọn dạng bám Pāli.
  - `6.2` `devatte atha mānuse`: dùng lại nguyên văn bản duy nhất trong tầng, `chốn cõi trời
    hay cõi nhân gian`, để một Pāli không có hai cách dịch.
  - Dấu lược: `13.2`, `14.2`, `15.2` là `…pe…` ở Pāli, giữ đúng MỘT `…` mỗi khoá. Pāli bài này
    không có `(…)` trần.
  - Dấu nháy: Pāli mở `“` ở `1.1` và đóng `”` ở `15.3`; bài không có nháy đơn. Đã đối chiếu
    nháy từng khoá khớp Pāli (0 lệch trên 72 khoá).

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và
  `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì bị cấm, nên
  `technical_integrity` đặt 9.6 chứ không phải 10). Đã kiểm tay: đủ 72/72 khoá, thứ tự đúng
  thứ tự Pāli, NFC, không khoá rỗng, không Pāli lọt vào lời dịch ngoài tên riêng. `final_score`
  là trung bình số học thô của đúng 10 tiêu chí.
