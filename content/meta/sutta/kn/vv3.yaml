notes: |-
  Dịch TRỰC TIẾP từ Pāli root — không có tầng Anh đã ghim cho vv3, xem blocking_errors.
  Chỉ mục Pāli và Việt toàn tầng: 35/37 khoá của bài này có Pāli trùng nguyên văn ở bài khác — tỷ lệ cao nhất trong lát — và 26 dùng lại NGUYÊN VĂN bản Việt đã có. 9 khoá còn lại cùng Pāli nhưng cố ý khác cách diễn đạt, xem các ghi chú bất định bên dưới.
  0.4 và 9.1: vv4 (Pīṭhavagga, cùng cấu trúc khoá) dùng 4. Chuyện Cung Điện Pīṭha Thứ Tư, nên đối xứng là 3. Chuyện Cung Điện Pīṭha Thứ Ba, thứ ba. Tầng name/ cho vv-name:6.vv3 bằng Third Throne Mansion.
  BẤT ĐỊNH pīṭha: Ở 1.1 (Pīṭhaṁ te sovaṇṇamayaṁ, nền của nàng làm bằng vàng) chữ pīṭha là NỀN và vv1:2.1 đã dịch là nền. Ở 6.3 (Tassa adāsahaṁ pīṭhaṁ, tôi đã cho vị ấy…) cùng chữ đó là ĒN ĂN. vv4:6.3 dịch thành Tôi đã lễ bái vị ấy, tức SAI nghĩa; ở đây dịch bánh nướng (1 tiền lệ). GHI RÕ là lệch với vv4 có chủ đích.
  BẤT ĐỊNH appassa ở 5.1–5.2: appassa là nhỏ bé. vv4:5.1–5.2 dịch thành Tôi từng thấy / rằng quả báo của nghiệp này là như vậy, tức BỎ MẤT nhỏ bé. Ở đây giữ đủ nghĩa: Tôi từng tưởng quả báo của việc ấy nhỏ bé thôi. GHI RÕ là lệch với vv4 có chủ đích.
  Dùng lại nguyên văn: 1.x từ vv1:2.1–2.4; 2.x, 4.x, 7.x, 8.x từ vv1 và vv4; 6.1 từ vv28:5.1; 6.2 và 6.4 từ vv4.
  Cổng kỹ thuật: npm run validate, npm test, npm run check do coordinator chạy; bài này draft nên không cần npm run build. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
  Kiểm toán độc lập 2026-10-11 (đọc đối kháng từng khoá Pāli↔Việt; điểm cũ 9.19 không có căn cứ vì bản trước còn nhiều lỗi nghĩa thật). Các câu trên về "pīṭha = bánh nướng", "lệch vv4 có chủ đích" và "dùng lại nguyên văn" đã được kiểm toán này thay thế; hãy đọc các mục sau.
  Sửa 20/37 khoá, trong đó 14 khoá sai nghĩa thật: (a) 1.1–1.4, câu mở: pīṭha là CHIẾC GHẾ (vv1:2.1 cùng Pāli đã dịch ghế; "nền" và "thảm… cột trụ hình tia sét" không có trong Pāli); manojavaṁ = nhanh như ý nghĩ; alaṅkate malyadhare suvatthe là hô cách gọi nữ thiên (được trang sức, đeo vòng hoa, mặc y phục đẹp); vijjurivabbhakūṭaṁ = như tia chớp trên đỉnh mây; thêm "vô cùng", "thật là dễ chịu" cũng bị bỏ vì không có trong Pāli. (b) 2.2 và 7.2 idha mijjhati: thành tựu được ở nơi đây (khớp vv1, vv7, vv15). (c) 3.1 và 8.1: hô cách devi mahānubhāve / bhikkhu mahānubhāva bị đọc thành "ngài… về đại oai lực ấy" (tân ngữ); nay là "Tôi hỏi nàng, này thiên nữ có đại oai lực" và "Tôi xin nói cho ngài, này tỳ-kheo có đại oai lực". (d) 8.2 và 8.3 yamakāsi, Tenamhi: người đáp là nữ thiên nên là "tôi", bản cũ ghi "ngài". (e) 4.3–4.4 yassa kammassidaṁ phalaṁ: "về nghiệp mà đây là quả báo" (vv15:4.4 đã làm đúng). (f) 5.1–5.2 appassa kammassa phalaṁ mamedaṁ: "Đây là quả báo của một nghiệp nhỏ của tôi" — bản cũ bịa "Tôi từng tưởng… nhỏ bé thôi". (g) 6.3 pīṭhaṁ adāsahaṁ: "tôi đã dâng cho vị ấy chiếc ghế" — bản cũ ghi "bánh nướng", sai hẳn. Lỗi nhẹ: 2.3 và 7.3 sửa "khưởi" (chữ vô nghĩa) thành "khởi"; 4.2 "truy hỏi" đổi thành "hỏi" (Pāli không có sắc thái truy vấn); 6.4 "đôi bàn tay" thành "đôi tay" theo đa số (11 so với 3); 9.1 bỏ "Chuyện" thừa vì Pāli tên cuối bài không có vatthu (khớp vv1, vv2, vv7).
  Phép đo sau sửa: 37/37 tập khoá và thứ tự khớp Pāli; nháy và ngoặc kép khớp Pāli từng khoá (0 lệch trên 37 khoá); NFC sạch; không khoá rỗng, không khoảng trắng thừa; dấu lược … không có ở Pāli lẫn Việt nên phép này chạy rỗng; Pāli trùng nguyên văn trong bài có 1 cặp (2.4 và 7.4) và hai bản Việt giống nhau; không có số Pāli cần tính; hiệu chuẩn kiểm khoá OK.
  Mức điểm đổi so với 9.19: terminology 9.1 xuống 8.8 vì tiêu đề 0.2 Itthivimāna vẫn dịch "Nữ Hư Không" (Pāli không có ākāsa; lặp ở khoảng 51 tệp vv nên không sửa riêng một tệp để khỏi lệch cả bộ, cần sửa đồng loạt); semantic_fidelity 9.2 xuống 9.0 vì cùng tiêu đề đó; ambiguity_integrity 9.1 xuống 9.0 vì các bất định mới ghi dưới đây; vietnamese_clarity 9.3 xuống 9.2 vì "của cải" cho bhogā còn nặng; các tiêu chí còn lại giữ nguyên. Điểm sau 9.12 là điểm của bản đã sửa, không phải của bản trước.
  Bất định còn lại: (1) vippasannamanāvilaṁ ở 6.2 giữ "tâm ý sáng trong không chút ô nhiễm" theo 8 tiền lệ, có khả năng chữ này chỉ là vippasannaṁ anāvilaṁ (trong sáng, không vẩn đục) không có chữ "tâm ý"; không phân xử được bằng tầng Pāli đã ghim. (2) bhogā dịch "của cải" theo 22 tiền lệ nhưng nghĩa đúng hơn là các thứ thọ hưởng. (3) 6.1 "ly trần thanh tịnh" gộp thêm "thanh tịnh" trong khi vippasanna nằm ở 6.2; giữ theo 5 tiền lệ. (4) "Tôn giả" trước Moggallāna không có trong Pāli, giữ vì cả họ vv dùng; (5) 2.2 chủ thể ngầm của mijjhati (cung điện hay các phước báo) không rõ, nên giữ lối dịch trung tính "nàng thành tựu được". (6) pv13–pv16 cùng chia sẻ Pāli 2.x và 3.1 với bản trước nên có thể mang cùng lỗi hô cách và idha mijjhati; vv2, vv4 cũng còn các lỗi 1.1–1.4, 3.1, 6.3 và 8.1–8.3 giống bản cũ của bài này (ngoài phạm vi, cần kiểm toán riêng).
  Cổng kỹ thuật: lượt này không chạy được npm run validate, npm test, npm run check, npm run build; technical_integrity giữ 9.6 do coordinator chạy sau.
