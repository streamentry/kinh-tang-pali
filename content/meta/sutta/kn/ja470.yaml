notes: |-
  Đợt 19, làn 65. Dịch trực tiếp từ Pāli root snapshot đã ghim (`kn/ja/ja470_root-pli-ms.json`), đủ 89/89 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Tầng root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem dưới).

  **Tầng tham khảo.** Sujato: 0 tệp cho `ja470` (đã đối chiếu thư mục tầng Anh và manifest, đây là `not-published-upstream`, không phải `not-synced`). `english-project`: 0. `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng vắng hết ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên; không nâng điểm để né blocker.

  **Tiêu đề, theo khuôn của các bài anh em cùng phẩm.**
  - `0.2` “Bộ Mười Hai Bài Kinh” và `0.3` “Phẩm Cūḷakuṇāla” dùng lại nguyên văn từ `ja464`–`ja469`, `ja471`–`ja473` (cùng `Dvādasakanipāta` + `Cūḷakuṇālavagga`).
  - `0.4` “7. Kinh Kosiya” theo khuôn “N. Kinh <tên>”; tên “Kinh Kosiya” có tiền lệ ở `ja226:0.4` (`ja130` viết “Kinh Kosiyajātaka”, hai cách đều có trong tầng; chọn dạng ngắn theo `ja226` và theo khuôn phẩm này). `22.1` “Kinh Kosiya, thứ bảy.” có dấu phẩy trước số thứ tự như `ja471`, `ja472`, `ja475`; số `sattamaṁ` = 7 khớp “7.” ở tiêu đề `0.4` và vị trí thứ bảy trong phẩm (sau `ja469` thứ sáu, trước `ja471` thứ tám).

  **Tiền lệ dùng lại nguyên văn.** Đã dò 75 khoá không phải tiêu đề/colophon (bỏ 4 khoá `:0` và `22.1`) có Pāli trùng nguyên văn (sau khi nén khoảng trắng) với một khoá ở bài khác; trong đó 74 khoá trùng với `ja535:1`–`ja535:21` (cùng bộ kệ), nhưng `ja535` chưa có bản Việt trong tầng nên không có gì để dùng lại hay đối chiếu. Chỉ 3 khoá trùng với khoá đã có bản Việt: `16.2` = `pv11:6.4` (`Paribhāsakā samaṇabrāhmaṇānaṁ;`, bản `pv11` viết “những kẻ chê bai chúng tôi, các Sa-môn Bà-la-môn;” có thêm “chúng tôi” theo ngữ cảnh riêng của `pv11`; ở đây dùng “hay chê bai các sa-môn và bà-la-môn;” — cùng gốc “chê bai”, không có “chúng tôi” vì Pāli không có) và `16.3`, `17.3` = `ja457:10.3`, `ja457:11.3` (`Idheva nikkhippa sarīradehaṁ,`). Cả 3 khoá bản Việt của tôi khác bản đã có (3/3 cặp lệch), vì lý do ghi dưới đây. Dòng tiêu đề `0.1` “Jātaka” dùng lại đúng tầng.
  - Lệch có chủ ý ở `16.3`/`17.3`: `ja457:10.3`, `11.3` dịch `nikkhippa` như mệnh lệnh (“nên hãy để ngay tại đây, bỏ thân xác này đi”), trong khi `nikkhippa` là bất định phân (absolutive, “sau khi bỏ xuống”), đi liền với `kāyassa bhedā … vajanti` ở dòng sau: người ta bỏ thân xác ở đây rồi, khi thân hoại thì đi đến địa ngục hoặc cõi lành. Tôi dịch “bỏ lại thân xác ngay tại đây,” theo đúng ngữ pháp và không sửa `ja457` vì ngoài phạm vi; báo để người điều phối quyết một lần.

  **Trùng nguyên văn trong chính bài:** 8 nhóm (28 khoá) có Pāli giống hệt nhau sau khi nén khoảng trắng, gồm `3.1`=`5.1`=`7.1`=`10.1`=`12.1`; `3.3`=`5.3`=`7.3`=`10.3`=`12.3`; `5.2`=`7.2`=`10.2`=`12.2`; `5.4`=`7.4`=`10.4`=`12.4`; `4.3`=`6.3`=`9.3`=`11.3`; `6.4`=`9.4`; `4.4`=`11.4`; `16.3`=`17.3`. Cả 8 nhóm bản Việt đều giống hệt nhau, 0 nhóm lệch. Chú ý `3.2` khác `5.2` ở Pāli (3.2 kết bằng dấu nháy đóng) nên bản Việt khác nhau đúng ở dấu câu.

  **Số Pāli:** `duvinnaṁ` (1.4) = 2 ⇒ “hai người”; `tidasānamindo` (14.3) = “chúa tể của ba mươi ba vị trời”, đúng cách tầng đã viết ở `ja391:2.4` (và “Ba Mươi Ba” ở `sn1.11:3.4`, `sn11.18:2.4`; `tidasa` ở đây coi là `Tāvatiṁsa`); `sattamaṁ` (22.1) = 7 ⇒ “thứ bảy”; `pañcasikha` (14.4) là tên riêng, không tính. `pattha` (1.4) là một đơn vị đong lường: không có tiền lệ trong tầng, giữ nguyên Pāli “pattha” thay vì đổi ra đơn vị Việt để không làm tăng giả định về dung lượng. Không có số lượng nào khác cần tính.

  **Thuật ngữ và tiền lệ, đã đo:**
  - `maccharin`/`maccharī` (16.1, 18.2) → “keo kiệt”: tầng có 55 khoá chỉ dùng “keo kiệt”, 15 khoá “keo kiệt, bủn xỉn” (vd `an7.57:2.4`), so với 13 khoá dùng “xan tham” (11 + 2). `kadariya` (16.1) → “bủn xỉn” theo đúng cặp `maccharī kadariyo` ⇒ “keo kiệt, bủn xỉn” (15 khoá). Hai gốc kề nhau ở 16.1 nên dịch cả cặp theo cách `an7.57`.
  - `paribhāsaka` (16.2) → “hay chê bai”: tầng không đồng nhất (“hay lăng mạ” ở `sn1.49:1.2`, “hay rủa sả” 6 khoá ở `an4.53`, `an4.54`, “hay sỉ nhục” 15 khoá ở `an7.57`); chọn “chê bai” để khớp bản đã có cho đúng dòng Pāli trùng ở `pv11:6.4`.
  - `ariyamagga` (3.3, 5.3, 7.3, 10.3, 12.3) → “Thánh đạo”: tầng có 23 khoá dịch tương ứng, đều “Thánh đạo” (vd `mn117:8.2`). `samārūha` đọc là mệnh lệnh số ít (“hãy bước lên”), cùng chủ ngữ với `dehi`, `bhuñja` ở dòng trước.
  - `rosaka` (18.2) → “hay nổi giận”; tầng không đồng nhất (“hung tợn” ở `ja250:2.3`, “ưa mắng nhiếc” ở `snp1.7:21.1`); ở đây chọn nghĩa từ điển “hay gắt, hay nổi giận” vì đứng liền sau `maccharī` trong một dãy tính từ về tính khí.
  - `pāpadhamma` (18.2, 18.4) → “bản tính xấu ác”: gần nghĩa với `ja482:11.3` (“kẻ có bản chất xấu ác ấy”).
  - `pāṇissara` (15.1) → “tiếng vỗ tay”: theo `dn1:1.13`, `dn2:48`, `dn31:10.2` (“vỗ tay”). `mudiṅga`, `murajā`, `ālambara` (15.1, 15.2): giữ nguyên tên nhạc cụ bằng Pāli (`dn2:90.1` dịch `mudiṅga` là “trống con” còn hai tên kia không có tiền lệ trong tầng, 0 khoá); không đổi sang “trống con” để không gộp ba loại trống khác nhau thành một.
  - `sugati`/`kāyassa bhedā … vajanti` (16.4, 17.4) → “khi thân hoại, họ đi đến địa ngục/cõi lành”: tầng có 2 khoá cùng dạng ngắn (không có `paraṁ maraṇā`) ở dạng “Khi thân hoại, họ đi đến …” và 2 khoá ở `ja457:10.4`, `11.4` dịch “sau khi thân hoại mạng chung, họ đi vào …” (có thêm “mạng chung” mà Pāli của câu ấy không có). Chọn dạng sát Pāli.
  - `yathodhikāni` (21.4) → “cho tới mức ấy”: lấy đúng cách `snp1.3:26.3` (tầng chỉ có 1 khoá bài kệ; các chỗ khác là chú giải chưa dịch). Xem bất định 5.
  - `saṁyama` (17.2) → “sự tự chế”: tầng có 25 khoá chứa `saṁyam…`, “tự chế” là chính (vd `ja250:1.1`, `ja250:2.1`).

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: lệch 0/89 khoá. Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0 khoá, Việt 0 khoá; `…pe…` không có trong bài. Pāli khép nháy ở `3.2`, hai dòng `3.3`–`3.4` nằm ngoài nháy, rồi mở nháy ở `4.1`; bản Việt giữ đúng ranh giới nháy ấy (nháy mở ở 1.1, 2.1, 4.1, 6.1, 8.1, 11.1, 13.1, 14.1, 15.1, 16.1, 17.1, 19.1; nháy đóng ở 1.4, 3.2, 5.4, 7.4, 10.4, 12.4, 13.4, 14.4, 15.4, 16.4, 18.4, 21.4; 12 mở · 12 đóng; `17.1` mở và đóng ở `18.4` vì `17.4` kết bằng dấu chấm không có nháy).

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `Taṁ taṁ vadāmi kosiya` (3.1, 5.1, 7.1, 10.1, 12.1): không phân xử chắc được hai `taṁ` (có thể là “điều ấy” + “ngươi”, hoặc một cách nói nhấn). Dịch “Ta nói với ngươi như vậy, này Kosiya:” để bao được cả hai cách đọc. Người nói của các câu này không được ghi trong thân kinh (không có văn xuôi); đại từ “ta … ngươi” là lựa chọn của người dịch, dựa trên quan hệ ngầm (người nói là bậc có quyền khuyên Kosiya, sau đó `18.1` và `14.3` cho thấy chính là Sakka).
  2. `adānaṁ nupapajjati` (2.4): `upapajjati` có nghĩa “đến, xảy ra, thích hợp”; dịch “việc không cho là điều không thích hợp” (phủ định kép giữ nguyên, không biến thành mệnh lệnh). Một cách đọc khác là “không có chuyện không cho” (nghĩa là điều ấy không xảy ra).
  3. `hutaṁ` và `samīhitaṁ` (4.1–4.2, 6.1–6.2, 9.1–9.2): `huta` = vật đã hiến cúng, lễ cúng (dịch “việc cúng tế”); `samīhita` từ `sam + īh`, “mong cầu / cố gắng đạt tới” (dịch “điều mong cầu”). `9.2` không có động từ trong Pāli, tôi bổ sung “được thành tựu” theo tương phản với `mogha` (“vô ích”) ở `4.2`; đây là phần ngầm hiểu của người dịch.
  4. `Sarañca juhati poso` (8.1) và `Doṇe timbarutitthasmiṁ` (8.3): không chắc `sara` là “hồ nước” hay tên một con sông; `bahukāya` đọc là `Bahukā` (sông, cùng dãy `Gayā` ở các chỗ liệt kê nơi tắm cúng), `doṇe` đọc là địa danh `Doṇa` và `timbarutittha` là “bến Timbaru”. Tầng không có tiền lệ cho tổ hợp này (`timbaru` chỉ là tên vua càn-thát-bà ở `dn21`, 0 khoá về bến sông). `sīghasote mahāvahe` đọc là hai định ngữ của một dòng sông ngầm, dịch “nơi dòng chảy xiết, dòng nước lớn”.
  5. `yathodhikāni` (21.4): `odhi` là “giới hạn, ranh giới”; “cho tới mức ấy” là cách tầng đã dùng ở `snp1.3:26.3` nhưng nghĩa chưa sáng. Một cách đọc khác là “theo từng giới hạn / từng mức một” (bỏ dục dần từng bậc). Không đổi để giữ nhất quán với `snp1.3`.
  6. `upāramāmi` (20.1): động từ `upa + ram` = “dừng lại, kiềm chế”; Pāli không nêu đối tượng. Dịch “Ngay hôm nay, tôi dừng lại;” không thêm đối tượng (không nói “dừng thói keo kiệt”); ngữ cảnh gợi ý là thói keo kiệt nhưng đó là suy luận, không ghi vào thân kinh.
  7. `Uccāvacaṁ vaṇṇanibhaṁ vikubbati` (13.3): `uccāvaca` (lit. “cao và thấp”) dịch “đủ loại … khác nhau”; `vaṇṇanibhā` dịch “ánh sắc” (màu sắc ánh lên); `vikubbati` “biến hiện”. Đây là câu hỏi của người nhà Kosiya về con chó đổi hình; tiếng Việt không nói “con chó đổi hình” thêm vào, chỉ dịch động từ.
  8. `Cando ca suriyo ca ubho idhāgatā` (14.1): dịch “mặt trăng và mặt trời” theo chữ; Pāli không viết hoa, nên không quyết đây là hai vị thiên tử hay ẩn dụ cho hai người khách. `devasārathi` (14.2) dịch “người đánh xe của chư thiên”.
  9. `suggatimāsamānā` (17.1): đọc là `suggatiṁ āsamānā` (“mong cầu cõi lành”), `āsamāna` là phân từ của `āsīsati`; tầng có 12 khoá chứa dạng này, không khoá nào là bản Việt cùng dòng.
  10. `Mā pāpadhammo nirayaṁ gamittha` (18.4): `gamittha` là dạng aorist đi với `mā` mang nghĩa cấm đoán/mong muốn; dịch “để ngươi … đừng đi vào địa ngục”. Số của động từ (số nhiều/kính ngữ) trong khi `pāpadhammo` số ít không được xử lý riêng, dịch theo nghĩa chung.
  11. Người nói: đọc từ ngữ cảnh kệ chứ không từ văn xuôi (không có trong tầng Pāli đã ghim). 1: Kosiya (người keo kiệt). 2–12: lời khuyên bố thí và không ăn một mình, về sau lộ ra là Sakka và đoàn. 13: người nhà hoặc Kosiya hỏi các vị khách. 14–18: Sakka. 19–21: Kosiya đáp Sakka (`Vāsava`, `Sakka` là xưng hô). Đây là suy luận từ nội dung, không được ghi vào thân kinh. `Kosiya` ở `3.1` đọc là xưng hô gọi người keo kiệt; nếu có cách đọc đó là biệt hiệu của Sakka (như ở `ud3.7:3.12`) thì ngược lại, nhưng ở `19.1`–`21.3` Kosiya xưng hô `Vāsava`, `Sakka` nên đọc theo hướng trên.

  **Coverage English (mục 7):** mẫu số = 0. Sau khi nén khoảng trắng, dòng Pāli dài nhất ở `14.1` là 34 ký tự (< 40) ⇒ 0/85 khoá không phải `:0` có nội dung theo ngưỡng; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato 0 tệp; `english-project` 0; `vietnamese-current` 0 (chỉ Pháp Cú). Tôi không đụng `content/meta/reference-gaps.yaml`.

  **technical_integrity = 9,6:** lát này không chạy cổng kỹ thuật (bị cấm), nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
