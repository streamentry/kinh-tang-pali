  Dịch từ Pāli root tại commit đã ghim; đủ 208 khoá, thứ tự và tập khoá khớp Pāli, không có khoá ngoài Pāli. Không có bản Anh Sujato, bản Việt phân đoạn hay english-project cho bài này, nên không có đối chiếu English độc lập; bản dịch dựa trên Pāli, ngữ cảnh bài và tiền lệ đếm được của nhóm tha-ap (547 bài đã dịch được dò). Bản Việt nguyên bài ở mục Tra cứu toàn văn không phải tầng đối chiếu ở mức segment và không đưa chữ nào vào bản dịch này.

  Tên bài. 0.3 và translationTitle là cùng một chuỗi: Ký Sự Về Trưởng Lão Udena. Pāli ở 0.3 (Udenattheraapadāna) không bắt đầu bằng số nên bản Việt không có số thứ tự. 51.1 theo dạng câu Ký sự về Trưởng lão Udena, thứ mười (Pāli dasamaṁ; xem Lượt cải thiện 2026-10-13). Kiểu mở đầu tên: đo ở phạm vi gần (tha-ap400 đến tha-ap429) là Ký Sự Về Trưởng Lão 20, Bài Kệ Tuyên Ngôn Về Trưởng Lão 4; đo toàn nhóm tha-ap là Bài Kệ Tuyên Ngợ 245 (cộng 10 khoá Tuyên Ngợi), Ký Sự Về 146, Bài Kệ Tuyên Ngôn 138, Kinh Kệ Của Trưởng Lão 5. Tuyên Ngợ là chính tả sai, còn Tuyên Ngôn không phải nghĩa của apadāna; bài này theo Ký Sự Về Trưởng Lão như các bài liền kề (tha-ap408, tha-ap409, tha-ap413). Hai phạm vi cho hai đa số khác nhau, nên để người biên tập phán một lượt cho cả cuốn. Tên người giữ dạng Pāli Udena. 0.1 giữ Therāpadāna (536 trên 547 bài đã dịch). 0.2 là Phẩm Metteyya (6 trên 6 bài đã dịch có Pāli Metteyyavagga). 52.1 theo dạng Phẩm X là phẩm thứ bốn mươi mốt (tha-ap402 Phẩm Pilindavaccha là phẩm thứ bốn mươi, tha-ap422 Phẩm Bhaddāli là phẩm thứ bốn mươi hai). 53.1 Tassuddānaṁ dịch Tóm tắt phẩm này (42 khoá so với Tóm lược 10 khoá).

  Số Pāli, tự tính. Cullāsītisahassāni (25.1): cullāsīti là 84 (cūḷa cộng asīti 80 thêm 4, cùng dạng caturāsīti), nhân sahassa 1.000 là 84.000, nên tám mươi tư ngàn ẩn sĩ (tầng có 4 khoá cùng Pāli dịch Tám mươi tư ngàn, 1 khoá Có tám mươi tư ngàn). Tiṁsakappasahassāni (45.1): tiṁsa là 30 (không phải 3), nhân kappasahassa là nghìn kiếp, nên ba mươi ngàn kiếp, đúng với tiền lệ tầng (7 khoá cùng Pāli đều dịch giá trị ba mươi nghìn hoặc ba mươi ngàn; toàn nhóm tha-ap có 29 khoá viết ba mươi ngàn so với 6 khoá ba mươi nghìn, nên giữ ngàn như tha-ap413). Đây là thời gian hưởng phước ở cõi trời, không phải lời thọ ký chỉ mốc về sau, nên dịch Trong ba mươi ngàn kiếp. Sahassakkhattuṁ (45.3): một ngàn lần. Pañcāhaṁ (27.1): năm ngày. Ekacattālīsamo (52.1): eka 1 cộng cattālīsa 40 là 41, thứ bốn mươi mốt. Sattamo (54.4): thứ bảy. Dasamaṁ (51.1): thứ mười. Tīṇi gāthāsatāni (55.3): tīṇi 3 nhân sata 100 là 300, ba trăm bài kệ. Asīti tīṇi cuttariṁ (55.4): asīti 80 cộng tīṇi 3 là 83, hơn số ấy tám mươi ba bài; tổng 300 cộng 83 là 383 bài kệ cho cả phẩm theo lời tóm tắt (chưa đối soát với số bài kệ thực tế của mười bài trong phẩm). Catusaccaṁ (33.3): bốn chân lý. Paṭisambhidā catasso (49.1): bốn vô ngại giải. Không có số nào khác.

  Dấu lược và nháy. Pāli có …pe… ở 47.2, 48.2, 49.2, giữ đúng một … ở mỗi khoá; không có (…) ở khoá nào, nên bản Việt cũng không có. Pāli không có … ở khoá nào khác nên bản Việt cũng không có (3 trên 208 khoá). Nháy: Pāli mở ngoặc kép ở 1.1 và đóng ở 49.3; nháy đơn mở ở 30.1 và đóng ở 30.4, mở ở 36.1 và đóng ở 42.4, mở ở 44.1 và đóng ở 45.4; bản Việt khớp Pāli từng khoá, 0 lệch trên 208 khoá (đo từng khoá cho cả bốn loại dấu, không đo cân tổng).

  Tái dùng nguyên văn tầng và phạm vi đã dò: tra từng khoá Pāli của bài trên 547 bài tha-ap đã dịch; 62 khoá (kể cả hai khoá tên 0.1 và 0.2) có Pāli trùng nguyên văn với bài khác, 5.591 cặp Pāli trùng đã dò; 57 khoá có bản Việt trùng đúng cách dịch phổ biến nhất của tầng, 5 khoá khác cách phổ biến nhất có chủ ý: 1.3 (Am thất của ta khéo dựng, 1 khoá so với của tôi 2 khoá; ngôi kể dùng ta theo cả bài và nhóm gần), 35.4 (ta đã ca ngợi bậc Dẫn Đạo thế gian: Dẫn Đạo thế gian 90 khoá toàn nhóm so với Dẫn Lộ Thế Gian 6; ngôi ta thay cho tôi), 36.4 (hãy nghe lời ta nói viết thường vì người nói là vị ẩn sĩ kể chuyện, 14 khoá so với Ta viết hoa 15 khoá), 45.1 (ba mươi ngàn thay cho ba mươi nghìn, xem phần số), 45.4 (sẽ làm Chuyển Luân Vương theo dạng 202 khoá toàn nhóm, so với 1 khoá sẽ thành Chuyển luân vương). Các khoá lấy lại cách dịch quen của tầng: 28.1 Đức Chiến Thắng tên Padumuttara (6 khoá), 28.2 bậc đã vượt qua mọi pháp (13 trên 15), 33.1 và 43.1 Đức Padumuttara, bậc hiểu rõ thế giới (24 trên 25), 33.2 và 43.2 bậc tiếp nhận lễ vật hiến cúng (30 trên 32), 34.3 Với tâm tịnh tín hân hoan (64 trên 89), 34.4 rồi dâng lên Đức Phật (9 trên 27), 35.3 Vắt tấm da thú lên một bên vai (5 trên 5), 43.3 Ngồi giữa Tăng đoàn tỳ-kheo (21 trên 27), 43.4 đã nói những bài kệ này (41 trên 41), 44.3 Ta sẽ tuyên thuyết về người ấy (24 trên 30), 44.2 với tâm tịnh tín, bằng chính đôi tay mình (có dấu phẩy sau tịnh tín: 7 trên 12 khoá cùng Pāli; xem Lượt cải thiện 2026-10-13), 46.3 Đã hiểu rõ toàn bộ lậu hoặc (41 trên 48), 46.4 và 47.3 ta sống không còn lậu hoặc (140 trên 206), 47.1 Các phiền não của ta đã được thiêu rụi (128 trên 186), 48.1 Thật lành thay sự đến của ta (123 trên 179), 48.3 và 49.3 đã làm tròn lời dạy của Đức Phật (149 và 495), 49.1 Bốn vô ngại giải (532 trên 545), 23.1 Gánh mang đồ vật trên vai (4 trên 5; khāribhāra là gánh một khārī, chữ trên vai là cách hiểu của tiền lệ nhưng không có trong Pāli), 25.1 Tám mươi tư ngàn (4 trên 5), 20.1 Sư tử, hổ và báo, 20.2 gấu, chó sói, linh cẩu (2 trên 3), 18.1 đến 18.3 theo đúng một khoá tiền lệ cùng Pāli, 22.2 khôn ngoan, có lối sống an tịnh (1 khoá). Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti dùng dạng Tôi nghe như vầy: Tôn giả Trưởng lão Udena đã nói những bài kệ này (nhóm số nhiều, không dùng dạng số ít). Ngôi kể dùng ta ở mọi khổ của người kể; Đức Phật tự xưng Ta ở 44.x; câu 36.4 do người kể nói nên viết ta thường, 44.4 do Đức Phật nói nên viết Ta, nên hai khoá cùng Pāli có hai cách dịch khác nhau có chủ ý. Dòng thứ ba của mỗi khổ viết hoa chữ đầu theo Pāli. Thuật ngữ đã đo: dạ-xoa (yakkha) 8 khoá so với yêu quái 3 khoá; da thú (ajina) 16 khoá so với da nai 5 và da linh dương 2, nên dùng da thú ở 22.1 và 35.3 (21.2 theo công thức ajinuttaravāsanā, xem Lượt cải thiện 2026-10-13); có thần thông lớn (mahiddhika; 11 khoá toàn nhóm viết thần thông lớn, 110 khoá dùng đại thần lực cho từ khác nên không theo); dòng luân hồi theo bv11:31.1 (Saṁsārasotaṁ); dòng ái theo 1 khoá taṇhāsotaṁ; loài súc sinh (tiracchānayoniṁ) theo dn34:2.1.127 (dn12 dùng loài bàng sinh); bậc Tối Thượng Tựa Hồng Sen và bậc Dẫn Đạo Tối Thượng Tựa Hồng Sen (jalajuttamanāmako 10 khoá, jalajuttamanāyako 1 khoá, theo jalajuttama là tên gọi của Đức Padumuttara); sen đỏ và sen xanh (padumuppalakehi, 2 khoá) cho paduma và uppala, sen trắng cho puṇḍarīka (hơn 10 khoá); người dẫn đoàn lữ hành cho satthavāha (5 khoá); và là hòn đảo, bậc Tối Thượng Loài Hai Chân (dīpo ca dvipaduttamo, 1 khoá); thưa ngài cho mārisa (3 trên 4); phước điền (4 khoá nơi phước điền vô thượng); ẩn sĩ 27 khoá; am thất 43 khoá; hầu cận cho payirūpāsa (1 khoá).

  Pāli trùng trong chính bài: 14 nhóm Pāli trùng (2.2 và 14.2; 2.3 và 14.1; 3.1 và 16.1; 3.2 và 16.2; nhóm 17 khoá sobhenti mama assamaṁ; nhóm 7 khoá Dibbagandhaṁ sampavantā; 13.3 và 15.3; 20.3 và 21.3; 23.4 và 26.4; 33.1 và 43.1; 33.2 và 43.2; 36.4 và 44.4; 46.4 và 47.3; 47.2, 48.2 và 49.2); 13 nhóm có bản Việt giống hệt nhau; 1 nhóm (36.4 và 44.4) bản Việt khác có chủ ý vì người nói khác nhau, như phần trên đã nêu.

  Bất định (không thêm vào thân kinh). (1) 26.2 codentā appanāva te: appanāva không có tiền lệ ở đâu trong toàn tầng Pāli (hapax); đọc là attanā eva (tự mình), dịch tự sách tấn chính mình; cách đọc khác coi appanā là định (nhập định), nghĩa là sách tấn định; không thể phân xử bằng tầng Anh vì tầng Anh đã ghim không phủ bài này. (2) Tên cá, cây, hoa và thú giữ dạng Pāli vì không có tiền lệ cùng Pāli hoặc tiền lệ không chắc: pāṭhīna, pāvusa, balaja, muñjarohita (3.1, 3.2, 16.1, 16.2; 0 tiền lệ), kareri và tilaka (4.2; 0 tiền lệ cùng Pāli), uddālaka, pāṭali, aṅkolaka, bimbijāla, māyākārī, atimuttā, sattalikā, nāga, sāla, aṭṭhaṅga (4.3 đến 7.2), kalamba và kandalī (9.1), punnāga, giripunnāga, timira (11.1, 11.2), nigguṇḍī, sirinigguṇḍī, campa (12.1, 12.2), nayitā, ambagandhī, ketaka (19.1, 19.2), kumbhīla và susumāra (17.1; tiền lệ dịch susumāra là cá sấu), gaha và ogaha (17.2, 17.3; 0 tiền lệ, nghĩa chắc chắn của hai từ này chưa xác lập được). Một số từ có tiền lệ nhưng ít: harītaka dịch chiêu liêu, āmalaka dịch me rừng, vibhītaka dịch bàng hôi, kola dịch táo gai, bhallātaka dịch đào lộn hột, billa dịch ba-la (8.1 đến 8.3; mỗi từ 1 khoá hoặc ít hơn), nimba dịch sầu đâu (10.2). (3) 10.1 Asokapiṇḍivārī: giữ nguyên một từ ghép, không tách thành asoka, piṇḍi, vārī vì tách là một cách đọc không có chứng cứ. (4) 27.1 Pañcāhaṁ sannipatanti: dịch Cứ năm ngày họ lại tụ họp, theo nghĩa thông thường của pañcāhaṁ là mỗi chu kỳ năm ngày; chữ cứ và lại thể hiện thì hiện tại thói quen của sannipatanti. (5) 29.3 So me saṁsittha: dịch báo cho ta về bậc Chánh Đẳng Giác, theo saṁsati là thuật lại, báo tin; 0 tiền lệ cùng Pāli. (6) 31.3 Assamaṁ saṁsāmetvāna: thu dọn am thất, theo senāsanaṁ saṁsāmetvā (mn82:16.1, mn86:3.2 và nhiều khoá khác dịch thu dọn). 32.1 Ceḷeva ḍayhamānamhi: dịch sát chữ như khi tấm vải đang cháy, là hình ảnh sự gấp gáp của việc ra đi; không thêm chữ gấp gáp vào thân kinh; 0 tiền lệ. (7) 39.1 gaṇino: những vị có đồ chúng; 39.4 antogadhāva te: họ đều được bao gồm trong Ngài (không có tiền lệ cùng Pāli nguyên câu, nhưng từ antogadha có tiền lệ ở mn119:22; xem Lượt cải thiện 2026-10-13). (8) 42.1 Tiracchānayoniṁ nirayaṁ parimocesi: Pāli không nêu đối tượng của động từ giải thoát, nên Việt cũng không nêu (có thể hiểu là giải thoát chúng sinh khỏi hai cõi ấy); không có bản Anh để đối chiếu. (9) 44.1 Yo me ñāṇaṁ apūjesi: cúng dường trí của Ta; cách đọc khác là tôn kính trí ấy bằng lời; cả hai cùng nghĩa chính. (10) 21.2 ajinuttaravāsanā: đắp y bằng da linh dương, theo 6 khoá cùng Pāli ở tầng; ajina ở 22.1 và 35.3 giữ da thú theo công thức riêng của hai khoá ấy, nên cùng một từ ajina hiện hai cách dịch trong bài này và chưa phân xử được cách nào tốt hơn. (11) 23.1 Khāribhāraṁ gahetvāna giữ Gánh mang đồ vật trên vai theo 4 khoá, dù khāribhāra là một gánh khārī. (12) 54.1 Metteyyo puṇṇako thero: thero coi là thuộc Puṇṇaka (Metteyya, Trưởng lão Puṇṇaka); cách đọc khác là Trưởng lão Metteyya Puṇṇaka là một người. (13) 55.4 và tổng số bài kệ 383 là số theo lời tóm tắt của chính Pāli, chưa đối soát với số bài thực tế của mười bài trong phẩm (tha-ap403 đến tha-ap412; vài bài chưa có bản dịch).

  Lượt cải thiện 2026-10-13. Đọc đối kháng lại cả 208 khoá cặp Pāli với Việt, đo lại tiền lệ cùng Pāli trên toàn tầng (93 khoá của bài có Pāli trùng nguyên văn với bài khác; sau lượt này còn 10 khoá khác cách phổ biến nhất, đều là chủ ý đã nêu ở trên hoặc là chỗ hai tiền lệ hoà nhau 1 so với 1: 1.3, 11.1, 34.1, 35.2, 35.4, 36.3, 36.4, 38.1, 45.4 và 53.1) và quét lại từng từ hiếm. Không phát hiện sai nghĩa, sai số lượng, sai phủ định hay lệch ranh khoá; số Pāli đã tính ở trên không đổi. Đã đổi 5 khoá trên 208, tất cả là sửa thuật ngữ hoặc dạng trình bày theo tiền lệ, không đổi nghĩa. (a) 13.1 Avidūre pokkharaṇī: Không xa có một cái hồ thành Không xa có hồ sen; pokkharaṇī dịch hồ sen ở 37 khoá của tầng so với hồ đơn 6 khoá, và khoá cùng Pāli duy nhất ở tầng cũng viết hồ sen; hai dòng sau của khổ đã nêu sen đỏ và sen xanh nên không thêm nghĩa. (b) 21.2 ajinuttaravāsanā: đắp áo ngoài bằng da thú thành đắp y bằng da linh dương, theo 6 khoá cùng Pāli ở tầng, trong đó có tha-ap407 và tha-ap414; dạng cũ khác với cả 6 khoá ấy. Hệ quả để lại: ajina ở 22.1 và 35.3 vẫn là da thú (35.3 trùng nguyên văn với tha-ap436), nên trong bài này một từ Pāli có hai cách dịch; đây là một điểm chưa gọn, ghi nhận chứ không ép thống nhất vì cả hai đều có tiền lệ khoá cùng Pāli. (c) 39.4 tava antogadhāva te: họ đều nằm trong Ngài thành họ đều được bao gồm trong Ngài; antogadha dịch được bao gồm ở mn119:22.1, 22.2 và 22.3 (3 khoá), còn nằm trong chỉ có ở mil5.1.6:5.1 (1 khoá); ghi chú cũ nói chưa có tiền lệ là chưa tính tiền lệ của chính từ này. (d) 44.2 pasanno sehi pāṇibhi: thêm dấu phẩy sau tịnh tín, theo dạng có dấu phẩy 7 khoá so với 4 khoá không dấu phẩy; dấu phẩy tránh đọc nhầm bằng chính đôi tay mình là bổ nghĩa cho tâm. (e) 51.1 Udenattherassāpadānaṁ dasamaṁ: Ký Sự Về Trưởng Lão Udena, thứ mười thành Ký sự về Trưởng lão Udena, thứ mười; dòng kết bài của nhóm tha-ap viết theo dạng này ở 319 khoá so với 80 khoá viết hoa từng chữ (gần tha-ap395 đến tha-ap430: 17 so với 13; các bài tha-ap409 và tha-ap410 đều dùng dạng này); tên bài ở 0.3 và translationTitle giữ dạng viết hoa vì khoá tên cùng dạng với tha-ap410:0.3. Điểm tiêu chí đổi: terminology 8.7 thành 8.8 (ba sửa thuật ngữ có tiền lệ đếm được: 13.1, 21.2, 39.4); các tiêu chí khác không đổi vì lượt này không tìm thêm lỗi nghĩa và không giải quyết thêm bất định nào.

  Bất định giữ nguyên hoặc bổ sung sau lượt này. (1) Tiṁsakappasahassāni (45.1): giữ ba mươi ngàn kiếp vì tiṁsa là 30 và vì 15 khoá cùng Pāli ở tầng đều dịch giá trị này (9 khoá ba mươi ngàn, 6 khoá ba mươi nghìn); tài liệu hướng dẫn của dự án nêu một cách đọc khác (coi kappa là một trăm, ra 300.000) và coi cụm này chưa phân xử được vì tầng Anh đã ghim không có bản nào và toàn lớp Pāli chỉ có một dạng; ở đây chưa có chứng cứ độc lập để phân xử, nên điều này vẫn là bất định đã biết, không được coi là đã giải quyết. (2) Tổng 383 bài kệ ở 55.3 và 55.4: đếm sơ số khổ kệ bốn dòng của mười bài tha-ap403 đến tha-ap412 theo cấu trúc khoá Pāli (không tính dòng kết, dòng Itthaṁ sudaṁ và khối tóm tắt; mỗi khoá lược …pe… tính một khổ; khổ sáu dòng tính một) ra khoảng 378, lệch khoảng 5 so với 383; sai lệch này chưa giải thích được (khổ sáu dòng và khoá lược có thể được đếm khác), nên 383 vẫn là số theo lời tóm tắt của chính Pāli, không dùng để sửa bản dịch. (3) Đã xem lại và quyết định không đổi dù nghi ngờ: 23.1 Gánh mang đồ vật trên vai (5 khoá cùng Pāli ở tầng so với Mang lấy gánh khārī 3 khoá; chữ trên vai không có trong Pāli nhưng gánh đã hàm ý), 18.2 lội dưới sông cho nadīcarā (5 khoá cùng Pāli ở tầng, đã nhất quán), 53.1 Tóm tắt phẩm này (nhóm tha-ap 44 khoá, Tóm lược 10 khoá và Tóm lược phẩm ấy 2 khoá; riêng gần tha-ap380 đến tha-ap440 là 4 so với 2; toàn tầng gồm cả các nhóm khác lại là Tóm lược 399 so với 47, nên giữ theo nhóm tha-ap).

  Coverage English: mẫu số là 1 khoá có nội dung (50.1 là 57 ký tự, câu kết; 207 khoá còn lại là kệ ngắn dưới ngưỡng 40 hoặc khối :0); Sujato phủ 0 trên 1; english-sujato tại commit đã ghim chỉ có 9 nhóm cp, dhp, iti, ja, kp, snp, thag, thig, ud và không có tệp thân kinh tha-ap nào (tệp tha-ap duy nhất là tệp tên); vietnamese-current chỉ có Pháp Cú; english-project chưa có entry cho bài này. Cổng coverage hầu như không đo được gì ở bài này. Việc content/meta/reference-gaps.yaml có hay chưa có entry cho tha-ap412 chưa được kiểm; người điều phối cần chạy npm run reference:gaps. Entry ở đó không thay đổi việc bài này giữ draft.

  Cổng kỹ thuật chưa chạy (bị cấm trong lát này) nên technical_integrity đặt 9.6, người điều phối cần chạy: npm run validate, npm test, npm run check, npm run build.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 9 khoá bất đồng nghĩa → sửa 0, giữ 4, bất định 5. Giữ: 22.3 (`appāhārā`: bản nguyên bài viết hành trang ít ỏi, nhưng `āhāra` là đồ ăn, bản dự án *ăn ít* theo Pāli); 27.4 (`disāmukhā`: bản nguyên bài *bằng hướng đối nghịch*, Pāli chỉ nói hướng về các phương); 21.2 và 22.1 (`ajina`: bản nguyên bài *da dê*, bản dự án *da linh dương* ở 21.2 theo công thức `ajinuttaravāsanā` của 6 khoá trong tầng và *da thú* ở 22.1, 35.3; `ajina` là da thú sống trong rừng, chưa đủ chứng cứ Pāli để chọn một loài, nên cả hai vẫn nằm trong cùng nhóm nghĩa); 17.3 (`ogahā`: bản nguyên bài viết *rắn*, bản dự án giữ nguyên chữ Pāli vì chưa xác lập được nghĩa). Bất định: 3.2 và 16.2 (`muñjarohitā`: bản dự án *cá muñjarohita* một tên, bản nguyên bài tách *muñja* và *rohita* thành hai loài; tầng có 5 khoá viết một tên, 3 khoá viết hai tên; Pāli ở dạng hợp từ không tự phân xử, nên số loài cá là 4 hoặc 5); 10.1 (`Asokapiṇḍivārī`: bản dự án một tên, bản nguyên bài tách *asokapiṇḍī* và *varī* thành hai cây; cùng loại bất định đã ghi ở trên); 26.2 (`codentā appanāva te`: bản nguyên bài hiểu `appanā` là sự nhập định, *đang năng nổ duy trì sự nhập định*; bản dự án *tự sách tấn chính mình*, đọc là `attanā`; hapax trong Pāli ghim nên không phân xử được, bất định số 1 ở trên vẫn đứng); 38.4 (`dīpo`: bản nguyên bài *ngọn đèn*, bản dự án *hòn đảo* trong chuỗi nơi nương tựa và chỗ đứng vững; `dīpa` có cả hai nghĩa). Số Pāli đối chiếu khớp: 25.1 tám mươi tư ngàn, 45.1 ba mươi ngàn kiếp (bản nguyên bài cũng đọc ba mươi ngàn, một bằng chứng độc lập cho cách đọc đã chọn nhưng không phải bằng chứng Pāli nên bất định (1) của lượt cải thiện 2026-10-13 vẫn giữ), 55.3–55.4 ba trăm cộng tám mươi ba. Rà đối kháng lại cả 208 khoá: không thấy lỗi nghĩa mới. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Quyết định hội đồng biên tập 2026-10-16: C6 — 31 khoá (1.3, 4.4, 5.4, 6.4, 7.4, …) (xưng hô theo mục 9: người kể xưng "tôi").
