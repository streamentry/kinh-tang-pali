notes: |-
  Dịch từ Pāli root tại commit đã ghim; đủ 208 khoá, thứ tự và tập khoá khớp Pāli, không có khoá ngoài Pāli. Không có bản Anh Sujato, bản Việt phân đoạn hay english-project cho bài này, nên không có đối chiếu English độc lập; bản dịch dựa trên Pāli, ngữ cảnh bài và tiền lệ đếm được của nhóm tha-ap (547 bài đã dịch được dò). Bản Việt nguyên bài ở mục Tra cứu toàn văn không phải tầng đối chiếu ở mức segment và không đưa chữ nào vào bản dịch này.

  Tên bài. 0.3 và translationTitle là cùng một chuỗi: Ký Sự Về Trưởng Lão Udena. Pāli ở 0.3 (Udenattheraapadāna) không bắt đầu bằng số nên bản Việt không có số thứ tự. 51.1 đọc lại tên đó rồi thêm thứ mười (Pāli dasamaṁ). Kiểu mở đầu tên: đo ở phạm vi gần (tha-ap400 đến tha-ap429) là Ký Sự Về Trưởng Lão 20, Bài Kệ Tuyên Ngôn Về Trưởng Lão 4; đo toàn nhóm tha-ap là Bài Kệ Tuyên Ngợ 245 (cộng 10 khoá Tuyên Ngợi), Ký Sự Về 146, Bài Kệ Tuyên Ngôn 138, Kinh Kệ Của Trưởng Lão 5. Tuyên Ngợ là chính tả sai, còn Tuyên Ngôn không phải nghĩa của apadāna; bài này theo Ký Sự Về Trưởng Lão như các bài liền kề (tha-ap408, tha-ap409, tha-ap413). Hai phạm vi cho hai đa số khác nhau, nên để người biên tập phán một lượt cho cả cuốn. Tên người giữ dạng Pāli Udena. 0.1 giữ Therāpadāna (536 trên 547 bài đã dịch). 0.2 là Phẩm Metteyya (6 trên 6 bài đã dịch có Pāli Metteyyavagga). 52.1 theo dạng Phẩm X là phẩm thứ bốn mươi mốt (tha-ap402 Phẩm Pilindavaccha là phẩm thứ bốn mươi, tha-ap422 Phẩm Bhaddāli là phẩm thứ bốn mươi hai). 53.1 Tassuddānaṁ dịch Tóm tắt phẩm này (42 khoá so với Tóm lược 10 khoá).

  Số Pāli, tự tính. Cullāsītisahassāni (25.1): cullāsīti là 84 (cūḷa cộng asīti 80 thêm 4, cùng dạng caturāsīti), nhân sahassa 1.000 là 84.000, nên tám mươi tư ngàn ẩn sĩ (tầng có 4 khoá cùng Pāli dịch Tám mươi tư ngàn, 1 khoá Có tám mươi tư ngàn). Tiṁsakappasahassāni (45.1): tiṁsa là 30 (không phải 3), nhân kappasahassa là nghìn kiếp, nên ba mươi ngàn kiếp, đúng với tiền lệ tầng (7 khoá cùng Pāli đều dịch giá trị ba mươi nghìn hoặc ba mươi ngàn; toàn nhóm tha-ap có 29 khoá viết ba mươi ngàn so với 6 khoá ba mươi nghìn, nên giữ ngàn như tha-ap413). Đây là thời gian hưởng phước ở cõi trời, không phải lời thọ ký chỉ mốc về sau, nên dịch Trong ba mươi ngàn kiếp. Sahassakkhattuṁ (45.3): một ngàn lần. Pañcāhaṁ (27.1): năm ngày. Ekacattālīsamo (52.1): eka 1 cộng cattālīsa 40 là 41, thứ bốn mươi mốt. Sattamo (54.4): thứ bảy. Dasamaṁ (51.1): thứ mười. Tīṇi gāthāsatāni (55.3): tīṇi 3 nhân sata 100 là 300, ba trăm bài kệ. Asīti tīṇi cuttariṁ (55.4): asīti 80 cộng tīṇi 3 là 83, hơn số ấy tám mươi ba bài; tổng 300 cộng 83 là 383 bài kệ cho cả phẩm theo lời tóm tắt (chưa đối soát với số bài kệ thực tế của mười bài trong phẩm). Catusaccaṁ (33.3): bốn chân lý. Paṭisambhidā catasso (49.1): bốn vô ngại giải. Không có số nào khác.

  Dấu lược và nháy. Pāli có …pe… ở 47.2, 48.2, 49.2, giữ đúng một … ở mỗi khoá; không có (…) ở khoá nào, nên bản Việt cũng không có. Pāli không có … ở khoá nào khác nên bản Việt cũng không có (3 trên 208 khoá). Nháy: Pāli mở ngoặc kép ở 1.1 và đóng ở 49.3; nháy đơn mở ở 30.1 và đóng ở 30.4, mở ở 36.1 và đóng ở 42.4, mở ở 44.1 và đóng ở 45.4; bản Việt khớp Pāli từng khoá, 0 lệch trên 208 khoá (đo từng khoá cho cả bốn loại dấu, không đo cân tổng).

  Tái dùng nguyên văn tầng và phạm vi đã dò: tra từng khoá Pāli của bài trên 547 bài tha-ap đã dịch; 62 khoá (kể cả hai khoá tên 0.1 và 0.2) có Pāli trùng nguyên văn với bài khác, 5.591 cặp Pāli trùng đã dò; 57 khoá có bản Việt trùng đúng cách dịch phổ biến nhất của tầng, 5 khoá khác cách phổ biến nhất có chủ ý: 1.3 (Am thất của ta khéo dựng, 1 khoá so với của tôi 2 khoá; ngôi kể dùng ta theo cả bài và nhóm gần), 35.4 (ta đã ca ngợi bậc Dẫn Đạo thế gian: Dẫn Đạo thế gian 90 khoá toàn nhóm so với Dẫn Lộ Thế Gian 6; ngôi ta thay cho tôi), 36.4 (hãy nghe lời ta nói viết thường vì người nói là vị ẩn sĩ kể chuyện, 14 khoá so với Ta viết hoa 15 khoá), 45.1 (ba mươi ngàn thay cho ba mươi nghìn, xem phần số), 45.4 (sẽ làm Chuyển Luân Vương theo dạng 202 khoá toàn nhóm, so với 1 khoá sẽ thành Chuyển luân vương). Các khoá lấy lại cách dịch quen của tầng: 28.1 Đức Chiến Thắng tên Padumuttara (6 khoá), 28.2 bậc đã vượt qua mọi pháp (13 trên 15), 33.1 và 43.1 Đức Padumuttara, bậc hiểu rõ thế giới (24 trên 25), 33.2 và 43.2 bậc tiếp nhận lễ vật hiến cúng (30 trên 32), 34.3 Với tâm tịnh tín hân hoan (64 trên 89), 34.4 rồi dâng lên Đức Phật (9 trên 27), 35.3 Vắt tấm da thú lên một bên vai (5 trên 5), 43.3 Ngồi giữa Tăng đoàn tỳ-kheo (21 trên 27), 43.4 đã nói những bài kệ này (41 trên 41), 44.3 Ta sẽ tuyên thuyết về người ấy (24 trên 30), 44.2 với tâm tịnh tín bằng chính đôi tay mình (4 trên 9), 46.3 Đã hiểu rõ toàn bộ lậu hoặc (41 trên 48), 46.4 và 47.3 ta sống không còn lậu hoặc (140 trên 206), 47.1 Các phiền não của ta đã được thiêu rụi (128 trên 186), 48.1 Thật lành thay sự đến của ta (123 trên 179), 48.3 và 49.3 đã làm tròn lời dạy của Đức Phật (149 và 495), 49.1 Bốn vô ngại giải (532 trên 545), 23.1 Gánh mang đồ vật trên vai (4 trên 5; khāribhāra là gánh một khārī, chữ trên vai là cách hiểu của tiền lệ nhưng không có trong Pāli), 25.1 Tám mươi tư ngàn (4 trên 5), 20.1 Sư tử, hổ và báo, 20.2 gấu, chó sói, linh cẩu (2 trên 3), 18.1 đến 18.3 theo đúng một khoá tiền lệ cùng Pāli, 22.2 khôn ngoan, có lối sống an tịnh (1 khoá). Công thức Itthaṁ sudaṁ … imā gāthāyo abhāsitthāti dùng dạng Tôi nghe như vầy: Tôn giả Trưởng lão Udena đã nói những bài kệ này (nhóm số nhiều, không dùng dạng số ít). Ngôi kể dùng ta ở mọi khổ của người kể; Đức Phật tự xưng Ta ở 44.x; câu 36.4 do người kể nói nên viết ta thường, 44.4 do Đức Phật nói nên viết Ta, nên hai khoá cùng Pāli có hai cách dịch khác nhau có chủ ý. Dòng thứ ba của mỗi khổ viết hoa chữ đầu theo Pāli. Thuật ngữ đã đo: dạ-xoa (yakkha) 8 khoá so với yêu quái 3 khoá; da thú (ajina) 16 khoá so với da nai 5 và da linh dương 2, nên dùng da thú ở cả 21.2 và 22.1 và 35.3; có thần thông lớn (mahiddhika; 11 khoá toàn nhóm viết thần thông lớn, 110 khoá dùng đại thần lực cho từ khác nên không theo); dòng luân hồi theo bv11:31.1 (Saṁsārasotaṁ); dòng ái theo 1 khoá taṇhāsotaṁ; loài súc sinh (tiracchānayoniṁ) theo dn34:2.1.127 (dn12 dùng loài bàng sinh); bậc Tối Thượng Tựa Hồng Sen và bậc Dẫn Đạo Tối Thượng Tựa Hồng Sen (jalajuttamanāmako 10 khoá, jalajuttamanāyako 1 khoá, theo jalajuttama là tên gọi của Đức Padumuttara); sen đỏ và sen xanh (padumuppalakehi, 2 khoá) cho paduma và uppala, sen trắng cho puṇḍarīka (hơn 10 khoá); người dẫn đoàn lữ hành cho satthavāha (5 khoá); và là hòn đảo, bậc Tối Thượng Loài Hai Chân (dīpo ca dvipaduttamo, 1 khoá); thưa ngài cho mārisa (3 trên 4); phước điền (4 khoá nơi phước điền vô thượng); ẩn sĩ 27 khoá; am thất 43 khoá; hầu cận cho payirūpāsa (1 khoá).

  Pāli trùng trong chính bài: 14 nhóm Pāli trùng (2.2 và 14.2; 2.3 và 14.1; 3.1 và 16.1; 3.2 và 16.2; nhóm 17 khoá sobhenti mama assamaṁ; nhóm 7 khoá Dibbagandhaṁ sampavantā; 13.3 và 15.3; 20.3 và 21.3; 23.4 và 26.4; 33.1 và 43.1; 33.2 và 43.2; 36.4 và 44.4; 46.4 và 47.3; 47.2, 48.2 và 49.2); 13 nhóm có bản Việt giống hệt nhau; 1 nhóm (36.4 và 44.4) bản Việt khác có chủ ý vì người nói khác nhau, như phần trên đã nêu.

  Bất định (không thêm vào thân kinh). (1) 26.2 codentā appanāva te: appanāva không có tiền lệ ở đâu trong toàn tầng Pāli (hapax); đọc là attanā eva (tự mình), dịch tự sách tấn chính mình; cách đọc khác coi appanā là định (nhập định), nghĩa là sách tấn định; không thể phân xử bằng tầng Anh vì tầng Anh đã ghim không phủ bài này. (2) Tên cá, cây, hoa và thú giữ dạng Pāli vì không có tiền lệ cùng Pāli hoặc tiền lệ không chắc: pāṭhīna, pāvusa, balaja, muñjarohita (3.1, 3.2, 16.1, 16.2; 0 tiền lệ), kareri và tilaka (4.2; 0 tiền lệ cùng Pāli), uddālaka, pāṭali, aṅkolaka, bimbijāla, māyākārī, atimuttā, sattalikā, nāga, sāla, aṭṭhaṅga (4.3 đến 7.2), kalamba và kandalī (9.1), punnāga, giripunnāga, timira (11.1, 11.2), nigguṇḍī, sirinigguṇḍī, campa (12.1, 12.2), nayitā, ambagandhī, ketaka (19.1, 19.2), kumbhīla và susumāra (17.1; tiền lệ dịch susumāra là cá sấu), gaha và ogaha (17.2, 17.3; 0 tiền lệ, nghĩa chắc chắn của hai từ này chưa xác lập được). Một số từ có tiền lệ nhưng ít: harītaka dịch chiêu liêu, āmalaka dịch me rừng, vibhītaka dịch bàng hôi, kola dịch táo gai, bhallātaka dịch đào lộn hột, billa dịch ba-la (8.1 đến 8.3; mỗi từ 1 khoá hoặc ít hơn), nimba dịch sầu đâu (10.2). (3) 10.1 Asokapiṇḍivārī: giữ nguyên một từ ghép, không tách thành asoka, piṇḍi, vārī vì tách là một cách đọc không có chứng cứ. (4) 27.1 Pañcāhaṁ sannipatanti: dịch Cứ năm ngày họ lại tụ họp, theo nghĩa thông thường của pañcāhaṁ là mỗi chu kỳ năm ngày; chữ cứ và lại thể hiện thì hiện tại thói quen của sannipatanti. (5) 29.3 So me saṁsittha: dịch báo cho ta về bậc Chánh Đẳng Giác, theo saṁsati là thuật lại, báo tin; 0 tiền lệ cùng Pāli. (6) 31.3 Assamaṁ saṁsāmetvāna: thu dọn am thất, theo senāsanaṁ saṁsāmetvā (mn82:16.1, mn86:3.2 và nhiều khoá khác dịch thu dọn). 32.1 Ceḷeva ḍayhamānamhi: dịch sát chữ như khi tấm vải đang cháy, là hình ảnh sự gấp gáp của việc ra đi; không thêm chữ gấp gáp vào thân kinh; 0 tiền lệ. (7) 39.1 gaṇino: những vị có đồ chúng; 39.4 antogadhāva te: họ đều nằm trong Ngài; 0 tiền lệ cùng Pāli. (8) 42.1 Tiracchānayoniṁ nirayaṁ parimocesi: Pāli không nêu đối tượng của động từ giải thoát, nên Việt cũng không nêu (có thể hiểu là giải thoát chúng sinh khỏi hai cõi ấy); không có bản Anh để đối chiếu. (9) 44.1 Yo me ñāṇaṁ apūjesi: cúng dường trí của Ta; cách đọc khác là tôn kính trí ấy bằng lời; cả hai cùng nghĩa chính. (10) 21.2 ajinuttaravāsanā: đắp áo ngoài bằng da thú (uttaravāsana là y choàng ngoài). (11) 23.1 Khāribhāraṁ gahetvāna giữ Gánh mang đồ vật trên vai theo 4 khoá, dù khāribhāra là một gánh khārī. (12) 54.1 Metteyyo puṇṇako thero: thero coi là thuộc Puṇṇaka (Metteyya, Trưởng lão Puṇṇaka); cách đọc khác là Trưởng lão Metteyya Puṇṇaka là một người. (13) 55.4 và tổng số bài kệ 383 là số theo lời tóm tắt của chính Pāli, chưa đối soát với số bài thực tế của mười bài trong phẩm (tha-ap403 đến tha-ap412; vài bài chưa có bản dịch).

