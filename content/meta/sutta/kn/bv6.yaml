notes: |-
  Đợt 19, làn 93. Dịch từ Pāli root commit đã ghim, đủ 138/138 khoá (khoá `0.1`–`0.2`, ba mươi bốn khổ kệ `1`–`34` và khoá kết `35.1`), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ tư của Buddhavaṃsa (đánh số 6 trong tệp), về Đức Phật Sumana: giáo pháp như một thành phố và một con đường lớn, ba lần chứng ngộ và ba kỳ hội chúng, tiền thân là vua rồng Atula cúng dường và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và bảo tháp. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản Việt nguyên bài ở mục tra cứu toàn văn của trang chỉ dùng để kiểm lại cách đọc ở các chỗ khó, không cấp văn cho canonical.

  **Tiêu đề.**
  - `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn (21/21 tiền lệ).
  - `0.2` “6. Dòng Kế Thừa Của Đức Phật Sumana”: cùng khuôn với `bv5:0.2`, `bv13:0.2`, `bv23:0.2`.
  - `35.1` “Dòng kế thừa của Đức Thế Tôn Sumana là thứ tư.”: `catuttho` = 4, khớp thứ tự (bv3 thứ nhất, bv5 thứ ba).

  **Số Pāli, đã tự tính.** `koṭisatasahassiyo` (7.4) = 100 × 1.000 koṭi = **một trăm ngàn koṭi** (khớp 17x `koṭisatasahassānaṁ` ở tầng). `koṭisahassa` (8.3) = **một ngàn koṭi** (`bv5:5.3`). `navutikoṭisahassānaṁ` (10.3, 13.3) 90 × 1.000 = **chín mươi ngàn koṭi** (6 tiền lệ). `koṭisatasahassehi` (12.3; 17.1 dạng sở hữu cách) = **một trăm ngàn koṭi**. `asītikoṭisahassānaṁ` (14.3) 80 × 1.000 = **tám mươi ngàn koṭi** (5 tiền lệ). Ba kỳ hội chúng (11.1) khớp ba con số ở 12.3, 13.3, 14.3 theo thứ tự thứ nhất, thứ hai, thứ ba; ba lần chứng ngộ khớp ba khoá `7.3`–`7.4`, `8.3`–`8.4`, `10.3`–`10.4` (thứ nhất, thứ hai, thứ ba). `navavassasahassāni` 9 × 1.000 = **chín ngàn năm** (22.1; khớp `bv5:19.1`). `tayo` 3 lâu đài (22.4) khớp ba tên ở 22.3. `tesaṭṭhisatasahassāni` (23.1) = 63 × 100 × 1.000 = **6.300.000**, viết “sáu triệu ba trăm ngàn”: dựa vào `tesaṭṭhi` = 63 (`thi-ap11:8.3`, `tha-ap80:5.1`) và `satasahassa` = 100.000 (`bv3` `tīṇi satasahassāni` → “ba trăm ngàn”; `bv12:4.3` `sattatiṁsasatasahassānaṁ` → “ba triệu bảy trăm ngàn”; `bv12:6.3` `paññāsasatasahassānaṁ` → “năm triệu”). `caturo` 4 dấu hiệu (24.1). `anūnadasamāsāni` = không thiếu + 10 = **đủ mười tháng** (24.3). `navutihatthamuggato` (29.2) 90 hattha (`bv22:23.2` giữ nguyên chữ hattha). `dasasahassī` **mười ngàn** thế giới (29.4; `bv5:2.4`). `navutivassasahassāni` 90 × 1.000 = **chín mươi ngàn năm** (30.1; `bv5:27.1`). `catuyojana` **bốn do-tuần** (34.4). `cattāri` 4 quả sa-môn, `catasso` 4 vô ngại giải, `chaḷ-` 6 thắng trí, `aṭṭha` 8 thiền chứng (5.1–5.3). `dasapāramī` 10 ba-la-mật (20.4). Không có cụm `Tiṁsakappasahassa` ở bài này; `aparimeyyito kappe` (18.3) là “vô lượng kiếp”, không phải một con số.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt hiện có (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 60 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 1.623 cặp, trong đó 75 cặp có Việt khác bản tôi viết; 54/60 khoá dùng đúng nguyên văn một tiền lệ. Sáu khoá không dùng nguyên văn, đều có lý do:
  - `17.1` “Một trăm ngàn koṭi,” khác 17/17 tiền lệ “Của một trăm ngàn koṭi,”: các tiền lệ đều là chủ ngữ của “đã có lần chứng ngộ”; ở đây `koṭisatasahassānaṁ` là tân ngữ của `tappayiṁ` (làm cho no đủ), nên bỏ chữ “Của”, như `tha-ap82:15.1`.
  - `17.2`, `5.2`, `7.2`, `7.4`: chỉ khác dấu cuối dòng hoặc chữ nối theo cấu trúc dòng trước (`7.2` “trong khi cứu vớt đại chúng;” cùng chữ `tha-ap486:3.4`; `7.4` cùng chữ `tha-ap82:15.1`). `3.2` chỉ có một tiền lệ là văn xuôi `dn21:1.5.46` (“khi đạt Vô thượng Chánh giác,”); tôi dùng “giác ngộ tối thượng” theo `sambodhimuttamaṁ` ở dòng kệ Buddhavaṃsa (`bv23:2.4`).
  - `18.3` “‘Sau vô lượng kiếp nữa,” dùng lại nguyên văn `bv5:12.3` (4 tiền lệ; 1 tiền lệ “Vào vô lượng kiếp trước đây” ở `bv28:1.1`). Đây là lời thọ ký tương lai (`bhavissati` ở `18.4`) nên hướng đếm là “sau … nữa”, không phải “trước đây”; cùng cách với `bv16`, `bv18`, `bv19`.
  - Trùng trong chính bài: 3 nhóm Pāli trùng (`10.3`/`13.3`; `18.2`/`25.2`; `11.2`/`21.4`/`26.4`). Hai nhóm đầu bản Việt giống hệt nhau (0 cặp lệch). Nhóm thứ ba cố ý lệch 1 trên 3 cặp: `11.2` “nơi Sumana, bậc Đại Ẩn Sĩ;” (ba kỳ hội chúng diễn ra nơi vị ấy) khác `21.4`, `26.4` “của Sumana, bậc Đại Ẩn Sĩ.” (người mẹ, vị thị giả của vị ấy), cùng cách với `bv5:8.2` và `bv5:18.4`/`bv5:23.4`. Phần còn lại của bài không có cặp Pāli trùng nội bộ nào khác.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá).
  - `nāyaka` → “bậc Dẫn Đạo”; `jina` → “bậc Chiến Thắng”; `mahesi` → “Đại Ẩn Sĩ”; `mahāvīra` → “Đại Anh Hùng” (như `bv18`, `bv23`). `sāvaka` → “đệ tử”; `aggasāvaka/-ikā` → “đệ tử thượng thủ”, `aggupaṭṭhaka/-ikā` → “thị giả hàng đầu” (18 khoá, `bv23:25.2` và các bài cùng khuôn). `khīṇāsava` → “đã đoạn tận lậu hoặc”, `vimala` → “không cấu uế”, `santacitta` → “tâm an tịnh”, `tādī` → “bất động như vậy”; khoá `11.3` dùng lại nguyên văn 14/14 tiền lệ, `11.4` 12/12.
  - `abhisamaya` → “chứng ngộ” (14 khoá lặp lại `bv16:5.4`); `samāgama` → “cuộc tụ hội”; `sannipāta` → “kỳ hội chúng” (15/15).
  - `nirodha` → “sự diệt tận” (9.3, 10.2): 235 khoá có “diệt tận” trên 692 khoá chứa “diệt”, và `mil3.4.8` dịch đúng `nirodhanibbānapañha` là “câu hỏi về sự diệt tận”; “đoạn diệt” 172, “chấm dứt” 145. `pañha` → “câu hỏi”.
  - `amatabherī` → “trống bất tử” (`bv12:5.4`, `bv12:6.1`, `tha-ap9:15.4`); `pura` → “kinh thành” và `nagara` → “thành phố”, như `bv18:5.2` và `bv18:13.1` (hai chữ Pāli, hai chữ Việt). `vīthi` → “con đường” (`tha-ap82:10.3`). `sāmañña` → “quả sa-môn” (`mil7.3.4:1.3`, `mil5.5.2:6.1`, `ps2.8:1.2`). `paṭisambhidā` → “vô ngại giải” (`tha-ap549:4.4`, `tha-ap490:16.1`). `chaḷabhiññā` → “sáu thắng trí” (`tha-ap113:10.3`). `samāpatti` → “thiền chứng” (`bv18:23.3`).
  - `akhila` → “không chai cứng” (`snp3.6:44.4`, `snp1.12:6.3`, `sn35.132:7.3`). `hiri` → “hổ thẹn”; `vīriya` → “tinh tấn” (`an4.169:2.5` và các khoá cùng cặp). `guṇavara` → “đức hạnh cao quý”.
  - `uddharanto mahājanaṁ` → “cứu vớt đại chúng” (`tha-ap486:3.4`). `tena yogena` → “bằng phương tiện ấy” (`bv3:5.1`); `evam-etena yogena` → “như vậy, bằng phương tiện này”.
  - `pavāraṇā` → “lễ Tự tứ”, `pavāresi` → “đã cử hành lễ Tự tứ” (`bv3:12.4`). `vassaṁvuttha` → “đã an cư mùa mưa”.
  - `sakko devarājā` → “Sakka, vua chư thiên” (“Sakka” giữ nguyên tên, như `thig13.5:29.1`, `vv83:11.2`; “vua chư thiên” 24 trên 28 khoá chứa `devarāj-`). `buddhadassana` → “diện kiến Đức Phật” (`thi-ap36:12.2`).
  - `nāgarājā` → “vua rồng” (`tha-ap4:2.2`, `dn16:6.28.4`, `dn16:6.28.8`; “Long vương” 5, trong đó `cp13:1.2` là dạng gần nhất). `nāgabhavana` → “cõi rồng” (`mil6.3.1:9.1`). `mahiddhika` → “đại thần lực” (12 khoá ở dạng kệ ngắn; “đại thần thông” 12, “thần thông lớn” 10). `ussannakusalasañcaya` → “sự tích lũy thiện lành dồi dào” (`bv12:2.3` dịch `ussannakusalā` là “thiện lành dồi dào”). `dibbaturiya` → “nhạc cụ cõi trời” (`turiya` → “nhạc cụ” ở `tha-ap553:7.1`, 3 khoá). `dussayuga` + `pacceka` → “mỗi vị một cặp vải” (`tha-ap553:16.3`, `tha-ap401:16.3`). `upaṭṭhahiṁ` → “phụng sự” (27 khoá).
  - `uccattana` → “chiều cao” (`bv7:24.1`, `bv22:23.1`, `bv25:25.1`); `hattha` giữ nguyên chữ Pāli (`bv16:22.2`, `bv22:23.2`); `kañcanagghiya` → “cột trụ bằng vàng” (6 khoá). `uḷurāja` → “mặt trăng” (`bv16:22.4`, `tha-ap112:1.4`). `yasadhara` → “bậc nắm giữ danh tiếng” (`bv7:29.1`). `asādisa` → “vô đối” (`bv7:28.2`). `atula/atuliya` → “không thể cân lường” (như `bv18`); `ñāṇa` → “trí” (290 khoá “trí”, 95 “trí tuệ”); `ratana` → “châu báu” (11 khoá; “ngọc” 11, “báu vật” 1).
  - Tên riêng giữ dạng Pāli có dấu: `Maṅgala` (như `bv5`), `Sumana`, `Mekhala`, `Sudatta` 2/2 (`bv13:18.2`), `Sirimā` 1/1 (`bv20:14.3`), `Anūpama` 2/2 (`bv18:15.4`), `Cālā` và `Upacālā` (`bv20:20.1`), `Udena`, `Atula`. Chưa có tiền lệ: `Canda`, `Sucanda`, `Vaṭaṁsa`, `Vaṭaṁsikā`, `Saraṇa`, `Bhāvitatta`, `Soṇā`, `Upasoṇā`, `Varuṇa`, `Aṅgārāma`. Lưu ý: `Saraṇa` ở `26.1` (đệ tử thượng thủ) và `28.1` (thị giả hàng đầu) là cùng một chữ Pāli, giữ cùng một chữ Việt; Pāli không phân biệt hai người.

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `2.1`–`2.4`: Pāli đặt ba cụm ở cách đối cách (`amatabheriṁ` … `dhammasaṅkhasamāyuttaṁ` … `navaṅgaṁ jinasāsanaṁ`) mà chỉ có một động từ `āhanī`. Tôi đọc `dhammasaṅkhasamāyuttaṁ navaṅgaṁ jinasāsanaṁ` là định ngữ/đồng vị của `amatabheriṁ` (chính “trống bất tử” là giáo pháp chín phần, gắn liền với tù và Pháp), nên 2.3–2.4 không thêm động từ hay chữ “là”. Cách đọc khác: `navaṅgaṁ jinasāsanaṁ` là tân ngữ thứ hai, tức vị ấy vừa đánh trống bất tử vừa tuyên bố giáo pháp chín phần. Bản Việt nguyên bài (Bhikkhu Indacanda) đọc theo hướng đồng vị. `saṅkha` dịch “tù và” (không có tiền lệ trong tầng; nghĩa gốc “vỏ ốc”). `navaṅga` dịch “chín phần”, cùng `bv5:16.2`, `bv13:16.2`.
  2. `3.3`–`3.4` và `4.3`–`4.4`: `saddhammapuravaruttamaṁ` và `satipaṭṭhānavaruttamaṁ` là hai từ ghép dài (`vara` + `uttama`). Tôi đọc đồng vị với `nagaraṁ` và `mahāvīthiṁ` (“thành Chánh Pháp, cao quý, tối thượng”; “con đường lớn, niệm xứ cao quý, tối thượng”) và không thêm chữ “là”. Cách đọc khác của `4.4`: “con đường lớn có niệm xứ là cao quý, tối thượng”, hoặc coi `satipaṭṭhāna` là nội dung con đường. Cách đọc khác của `3.4`: `puravaruttamaṁ` là “kinh thành cao quý, tối thượng của Chánh Pháp” (đảo thứ tự). `satipaṭṭhāna` giữ “niệm xứ”, không thêm số “bốn” vì Pāli không nêu.
  3. `5.1`–`5.4`: `phale cattāri sāmaññe` đọc là bốn quả sa-môn (`phale` ở dạng cách Māgadhī). `pasāresi` dịch “bày ra” (nghĩa gốc “trải ra, dàn ra”); hình ảnh con đường như phố hàng được giữ, không giải thích. `tattha vīthiyaṁ` là con đường vừa dựng ở `4.3`.
  4. `6.1`–`6.4`: `akhilā` đọc là phẩm tính của người (tâm không chai cứng), `hirivīriyehupāgatā` là “đầy đủ hổ thẹn và tinh tấn”. `te te` dịch “từng người ấy” (`bv5:3.3`). `yathā sukhaṁ` dịch “tùy ý”; Indacanda dịch “một cách dễ dàng”. Chủ ngữ của `ādiyanti` là những người ở `6.1`.
  5. `7.1`–`7.4`: `yogena` dịch “phương tiện” theo `bv3:5.1` (nghĩa rộng: cách thức, nỗ lực). `koṭisatasahassiyo` ở dạng nhiều số, đối cách; tôi không thêm danh từ “vị” hay “người”.
  6. `8.2` `titthiye gaṇe`: hai từ đối cách. Tôi dịch “các nhóm ngoại đạo”; cách đọc khác “các hội chúng ngoại đạo” (Indacanda: “các đồ chúng ngoại đạo”). `8.3` `koṭisahassābhisamiṁsu` là động từ số nhiều (“đã chứng ngộ”), con số là chủ ngữ.
  7. `9.4` `saṁsayañcāpi mānasaṁ`: `mānasaṁ` đọc là “trong tâm” (định ngữ của sự hoài nghi). Cách đọc khác: `mānasaṁ` là “tâm” (đồng vị với `saṁsaya`), nghĩa gần như nhau.
  8. `12.1`–`12.2` `abhighuṭṭhe pavāraṇe`: dịch “khi lễ Tự tứ được công bố”; `abhighuṭṭha` không có tiền lệ nào trong tầng.
  9. `13.1`–`13.2` `tatoparaṁ sannipāte, vimale kañcanapabbate`: `vimale` đọc là tính từ của `kañcanapabbate` (“ngọn núi vàng không cấu uế”), không coi `Kañcanapabbata` là tên riêng (Indacanda viết “ngọn núi Kañcana”) và không đọc `vimale` là các vị tụ hội. Không thêm chữ chỉ “các vị”.
  10. `14.1` `Sakka`: giữ tên, không đổi sang “Đế Thích” (269 khoá giữ Sakka). `15.2`–`15.4`: `Atula` là tên (`nāma nāmena`), không phải tính từ `atula`.
  11. `16.1`–`16.2`: `nikkhamitvā sañātibhi` đọc `sañātibhi` = `saha ñātibhi`, “cùng thân quyến” (`ja430:9.2`: `saha sabbehi ñātibhi`). `nāgānaṁ dibbaturiyehi`: “nhạc cụ cõi trời của loài rồng”; `nāgānaṁ` là sở hữu cách số nhiều, không đọc là “các nāga cúng dường”.
  12. `17.3` `paccekadussayugaṁ`: “mỗi vị một cặp vải”, không thêm “y”; Pāli không nói người nhận cụ thể.
  13. `23.1` `Tesaṭṭhisatasahassāni`: 63 trăm ngàn = 6.300.000, như trên; Indacanda cho cùng giá trị (“sáu mươi ba trăm ngàn (sáu triệu ba trăm ngàn)”). Không dùng cách đọc 63.000 vì `satasahassa` đã xác lập 100.000 ở tầng.
  14. `25.4` `mekhale puramuttame`: `puramuttame` là định ngữ của thành (cùng `bv18:5.2`). `29.1`–`29.2`: `uccattana` + `navutihatthamuggato`, đơn vị hattha giữ nguyên, không quy đổi.
  15. `31.1`–`31.2` `tāraṇīye`, `bodhanīye`: dạng khả năng (“những người đáng được đưa vượt qua/đáng được giác ngộ”); không thêm “chúng sinh”. `31.4` `uḷurājāva atthami`: “mặt trăng” dịch `uḷurāja` (vua của các vì sao); giữ “mặt trăng” như `bv16:22.4`. `atthami` dịch “đã lặn”.
  16. `33.1`–`33.4`: `ñāṇaṁ` dịch “trí” (không thêm “của Đức Phật”), `ratanāni` “châu báu”; Pāli không nói là Tam Bảo, nên không giải thích. `nanu rittā sabbasaṅkhārā` giữ nguyên câu hỏi tu từ (`bv23:29.4`, 9/9).
  17. `34.1` `yasadharo`: “bậc nắm giữ danh tiếng” theo `bv7:29.1`; không tìm thấy tiền lệ khác. `34.4` ngoặc kép đóng nằm ở khoá này, ngoặc mở ở `1.1`; nháy đơn của lời thọ ký mở ở `18.3`, đóng ở `19.3`.
  18. `19.2` `…pe…` giữ đúng một `…`. Đoạn lược che mất phần giữa lời thọ ký; không xác định được ai là “chúng ta” trong `19.3`, nên dịch sát chữ, không thêm người nói (cùng cách với `bv5:13.3`, `bv18:11.3`).

