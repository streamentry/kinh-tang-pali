notes: |-
  TẦNG THAM KHẢO — đo, không đoán. Tầng `english-sujato` tại commit đã ghim có **0 tệp `kn/mil`**: toàn bộ Milindapañha không có một bản Anh nào trong snapshot đã ghim, chứ không phải thiếu riêng bài này. 83 tệp `kn/ja` của cùng tầng ấy đúng là `ja1`–`ja79` cộng `ja126`, `ja159`, `ja466`, `ja534`. `vietnamese-current` có 26 tệp, tất cả là `dhp*`. `english-project` không có uid nào. Ba tầng vắng ⇒ chỉ dịch được từ Pāli root, đây là giới hạn upstream nên `triangulation` bị chặn ở 7.5 và `status` là `draft` (xem `blocking_errors`).
  Coverage theo đúng công thức `source/layers.yaml` (`substantivePaliMinChars: 40`, `excludeReferenceBlock: true`): **0/23 = 0%**, dưới ngưỡng 0.8.
  Tên tầng, đo trên 194 tệp `mil` đã có sẵn: `:0.1` **Milindapañha** (183/194; 8 tệp ghi *Mi-lan-đà Vấn Đạo*, 3 tệp ghi *Mi-tiên Vấn Đáp*) · `:0.2` `Meṇḍakapañha` → **Meṇḍakapañha** (20/30; còn *Câu Hỏi Nan Đề* 4, *Những Câu Hỏi Hóc Búa* 2, *Những Câu Hỏi Lưỡng Đao* 2, *Phẩm Meṇḍakapañha* 2) · `:0.3` `Sabbaññutañāṇavagga` → **Sabbaññutañāṇavagga** (6/7; một tệp ghi *Phẩm Bồ-tát*) · `:0.4` mẫu *N. Câu hỏi về …* (5 bài `mil5.4.x` đã dịch đều dịch nghĩa, 2 tệp giữ Pāli) · lời kệ cuối mẫu *Câu hỏi về …, thứ <thứ tự>.*
  **`bhante` và `mahārāja` — đo lại trên đĩa, không tin con số đưa trước.** Đếm trên 194 tệp `mil` đã dịch, 3.963 khoá, với mỗi khoá Pāli có `bhante`/`mahārāja` đem đối chiếu đúng khoá Việt: `bhante` → **“thưa tôn giả” 301 lần** (tiều tố *thưa* 180/75 tệp, không tiều tố 69, *bạch* 34+18) so với **“ngài” 197 lần** (65+60+38+17+17) và **“Đại đức/đại đức” 52 lần** ⇒ theo đa số **thưa tôn giả**. `mahārāja` → **“đại vương” 1.229 lần / 188 tệp**, còn *trẫm* **0 lần**; theo dạng từ đứng trước: *này Đại vương* + *Này Đại vương* **600 lần** so với *tâu/Tâu đại vương* + *tâu/Tâu Đại vương* **456 lần** ⇒ theo đa số **này Đại vương**, chữ Đ viết hoa. Lưu ý khác biệt: nếu đo riêng **đúng các Pāli trùng nguyên văn của bài này** thì đa số lại nghiêng về *ngài* — `“Bhante nāgasena, bhāsitampetaṁ bhagavatā—` có *ngài* 13/21 so với *tôn giả* 4/21; `“Sādhu, bhante nāgasena, evametaṁ tathā sampaṭicchāmī”ti.` có *ngài* 11/31 so với *tôn giả* 6/31. Tôi theo **đa số toàn tầng `mil`** như đã được chỉ thị và ghi rõ hai số ở đây để người gộp lát quyết định có thống nhất theo hướng nào; cũng lưu ý `mil5.4.9:notes` đã chọn *Thưa Đại đức* theo bầy bài lân cận, nên trong chính `mil5.4` đang có ba cách.
  Ngoặc kép: Pāli mở ở `:1.1` và đóng ở `:3.9`, mở ở `:4.1` và đóng ở `:7.6`, rồi một cặp riêng ở `:7.7`; bản Việt giữ đúng ba cặp đó. Dấu lược: Pāli có `…pe…` ở 6 khoá (`:3.3`, `:3.4`, `:3.6`, `:3.7`, `:4.2`, `:4.4`) và mỗi `…pe…` là **một** dấu lược; bản Việt giữ đúng một `…` ở đúng 6 khoá ấy, không mở rộng, không bịa thêm. Cách làm theo đúng tiền lệ `mil5.4.9:1.6` (`‘nagare …pe…` → *lời ‘ở thành …*) và `mil3.3.2:4.1`: phần lược nằm cuối khoá, và khoá nối tiếp (`saddhin’ti`) bắt đầu lại không lặp dấu lược. `:3.3` và `:4.2` có Pāli **trùng nguyên văn** (`‘sace …pe…`) nên dùng cùng một chữ *‘nếu …*.
  **Pāli trùng nguyên văn trong tầng đã có: 3 khoá tiêu đề, dùng lại nguyên văn cả 3** — `:0.1` *Milindapañha* (183 tệp), `:0.2` *Meṇḍakapañha* (20 tệp, cùng `mil5.4.1/2/3/5/9/10`), `:0.3` *Sabbaññutañāṇavagga* (6 tệp). `:3.9` trùng `Ayampi ubhato koṭiko…` đã có 14 bản dịch; tôi theo dạng phổ biến nhất (5/14) và thêm *nữa* để giữ `Ayampi`. `:7.7` trùng `“Sādhu, bhante nāgasena…` đã có 31 bản dịch nhưng **cố ý khác** vì chỉ thị đo đa số `bhante` trong `mil` (xem trên).
  **Bất định đã ghi, không bịa:** (1) `:3.1` `pavutthapatikā` — `pavuttha` là “rơi vào tai nạn/hỏng”, `patikā` có thể là “bị đưa ra xử”; tôi dịch *đã từng rơi vào hoạn nạn* và không khẳng định là xử đoán. (2) `:4.6`/`:6.1`/`:7.1` `vicinantī` là “đã quét sạch” (quét sạch tội lỗi); tôi giữ nghĩa đó nhưng không thêm chủ ngữ nào. (3) `:5.1` tám vế `khaṇaṁ na passi` lặp cùng một khuôn, tôi dịch cả tám theo đúng một công thức và giữ nguyên thứ tự lý do. (4) `:7.4` liệt kê danh từ tính từ dài; tôi đếm được 27 mệnh đề tính từ cho `aṭṭhavīsatiyā` (hai mươi tám) — có thể `sapakkho` và `mittasampanno` là hai vế riêng, tôi vẫn dịch đủ mọi từ Pāli có mặt và không tự thêm mục thứ 28. (5) `khaṇa` (vị tu sĩ) và `nimantaka` (vị mời gọi) **0 tiền lệ trong tầng `mil`**; tôi dịch *vị tu sĩ* theo 21 nơi đã dùng *tu sĩ*, và *vị mời gọi* vì `nimantaka` là chủ thể mời, không phải hành động.
  Thuật ngữ theo tiền lệ đếm được: `Nāgasena` giữ Pāli (397 lần) chứ không theo `Nāgasenā` (65 lần) · `raho` → bậc A-la-hán (276 nơi trong tầng) · `pañho` → câu hỏi (đã dùng ở `mil5.4.1/2/3/4/5/9/10`) · `sāmanā`/`brāhmaṇā` → sa-môn / bà-la-môn · `aparicchāda` không có tiền lệ.
  Lỗi bắt được ở lượt review đối kháng, đã sửa: (1) `:2.4` bản nháp kết bằng `?’.` (dấu chấm câu sau dấu nháy cong) — đã sửa còn `?’`; (2) `:3.4` bản nháp có **hai** dấu lược trong khi Pāli chỉ có một `…pe…` — đã sửa; (3) `:3.8` và `:4.3` bản nháp lặp lại dấu lược ở đầu câu nối tiếp, trái với tiền lệ `mil5.4.9:1.7` và `mil5.1.10:1.8` — đã bỏ.
