notes: |-
  Bài kinh thi-ap38 — Puṇṇikātherīapadāna, bài thứ tám của Phẩm Khattiya trong
  Therīapadāna. 82/82 khoá, thứ tự khoá khớp đúng thứ tự Pāli, không có khoá nào
  ngoài tập khoá Pāli. Bài kể về một tỳ-kheo-ni từng xuất gia dưới sáu vị Phật, đa
  văn rồi sinh tự cao, nên đời cuối sinh làm con của một nữ tỳ đội ghè nước trong nhà
  Anāthapiṇḍika; bà gặp một Bà-la-môn lạnh run giữa dòng nước, nói pháp cho ông, ông
  xuất gia chứng A-la-hán, bà được trả tự do, xuất gia và chứng A-la-hán.

  TÊN PHẨM, TIÊU ĐỀ VÀ SỐ THỨ TỰ — đo trước khi chốt:
  - :0.1 Therīapadāna giữ nguyên Pāli: 13 khoá cùng dạng so với 1 khoá dịch là
    Trưởng Lão Ni Ký Sự.
  - :0.2 Khattiyāvagga → Phẩm Khattiya (3 khoá cùng dạng).
  - translationTitle bằng đúng giá trị :0.3 từng ký tự, kể cả số thứ tự.
  - Số thứ tự ở :0.3: Pāli :0.3 là 8 Puṇṇikātherīapadāna, bắt đầu bằng số, nên giữ
    số theo hình thức N. (quy tắc chung của phẩm: giữ số khi và chỉ khi Pāli có số;
    không có trường hợp thêm số ở chỗ Pāli không có). Phạm vi gần nhất không đồng
    nhất: trong các tệp thi-ap đã có mà Pāli :0.3 bắt đầu bằng số, 4 tệp giữ số và 6
    tệp bỏ số (không tính bài này). Bài này theo quy tắc chung; nếu người biên tập
    muốn thi-ap theo một lối thì cần sửa một lượt cả các tệp kề cận.
  - Công thức tiêu đề: đo ở phạm vi gần nhất (các tệp thi-ap đã có, không tính bài
    này), Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni có 13 tệp, Tuyên Ngôn 1 tệp, Ký Sự 0
    tệp, 1 tệp dạng khác. Toàn tầng tha-ap: Tuyên Ngợ 247 tệp, Tuyên Ngôn 115 tệp, Ký Sự 99 tệp.
    Hai phạm vi cùng cho Tuyên Ngợ là đa số, nên bài này giữ Tuyên Ngợ cho khớp; đó
    nhiều khả năng là lỗi chính tả của Tuyên Ngôn, và nếu người biên tập xác định
    như vậy thì cần sửa hàng loạt cả cuốn chứ không sửa riêng bài này.
  - Khoá cuối :22.1 là thứ tám (aṭṭhamaṁ): theo mẫu của các bài thi-ap kề cận,
    Bài Kệ Tuyên Ngợ Về Trưởng Lão Ni X, thứ N.
  - Tên Puṇṇikā giữ dạng Pāli; ở :12.3 Pāli nói tên là Puṇṇā (puṇṇāti), giữ đúng
    dạng Puṇṇā, không gộp hai dạng.

  SỐ PĀLI — tự tính:
  - Bài không có số kiếp, số lượng lớn hay phép nhân nào. Các số duy nhất: catasso =
    bốn (20.1, Bốn vô ngại giải); aṭṭhama = thứ tám (22.1) và số 8 ở :0.3; sata =
    một trăm ở :12.1 (ūnakasataṁ, một trăm còn thiếu, tức chỗ thiếu để đủ trăm).
  - Pāli không có Tiṁsakappasahassa hay bất kỳ cụm số nào chưa phân xử được; không
    có tiṁsa trong bài. Máy kiểm số của kho vì vậy không có gì để đo ở đây — phép đó
    chạy rỗng, không phải pass.

