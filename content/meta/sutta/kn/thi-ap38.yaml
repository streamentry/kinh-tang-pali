  - Các khoá dùng lại gồm 0.1, 0.2, 1.1, 5.1, 7.2–7.4, 8.1–8.3, 9.2–9.4, 10.2, 13.4, 14.1–14.4,
    15.1–15.4, 16.1–16.2, 16.4, 18.1–18.3, 19.1–19.3, 20.1–20.3. Các khoá 7.2–10.2 là
    lời trao đổi giữa Puṇṇikā và vị Bà-la-môn, trùng với đoạn đầu của thig12.1; dùng
    lại nguyên văn Việt của thig12.1 (ông, cô, tôi), với 7.1 và 8.4 mở/đóng nháy
