  NGÔI THỨ NHẤT: người kể dùng ta xuyên suốt, theo bài thi-ap37 liền kề và theo đa số
  của các khoá công thức chung (Các phiền não của ta đã được thiêu rụi: 92/144 khoá).
  Trong lời nói trực tiếp với vị Bà-la-môn (7.1–10.4) dùng tôi, theo thig12.1. Đây
  là chỗ hai phạm vi cho đa số khác nhau: trong thi-ap, ta xuất hiện ở thi-ap7, 16, 31,
  37, còn con (thi-ap2, 3, 4, 12, 13, 39) và tôi (thi-ap5, 6, 10, 29) chiếm đa số; công thức dùng chung ở tha-ap nghiêng về ta. Lời kết
  :21.1 Tôi nghe như vầy là lời người kể, không phải ngôi của vị ni; theo công thức
  đa số những bài kệ này (407 khoá so với 21 khoá bài kệ này) vì imā gāthāyo là
  số nhiều.

  THUẬT NGỮ — kèm số đếm:
  - Therīapadāna, Khattiyāvagga: xem trên. Vipassī giữ dạng Vipassī (Của Đức Thế Tôn
    Vipassī có 1 tiền lệ cho đúng khoá này; các dạng còn lại của khoá trùng là
    quán sát hay Lên Đức Phật: không dùng vì quán sát đổi tên riêng thành tính
    từ, còn Lên là từ dâng). Kakusandha → bậc ẩn sĩ (munino; tha-ap457:1.1 Lên bậc ẩn
    sĩ Kakusandha, bỏ chữ Lên).
  - tādī (koṇāgamanatādino) → bậc vững vàng: toàn tầng có 84 khoá tādino đã dịch,
    không dạng nào chiếm đa số tuyệt đối (đáng tôn kính 13, Vững Vàng 12, như vậy 9,
    Như Thật 9, Bất Động 8, Như Vậy 3...); chọn Vững Vàng.
  - bahussuta → đa văn (4 khoá đa văn …, cùng nhiều khoá đa học, học rộng); dhammadhara
    → thọ trì pháp (đối chiếu giữ gìn Pháp, trì pháp trong các bài kinh); payirupāsita →
    hầu cận (hầu cận chiếm đa số, thân cận và phụng sự mỗi dạng 2 khoá).
  - mahāmune → Đại Mâu-ni, theo thi-ap37 (khoá trùng 14.4 dùng lại nguyên văn).
  - dhammatthasaṁhitaṁ → gắn liền với pháp và nghĩa; xem bất định bên dưới.
  - sotthiya → thông thánh điển (tiền lệ trong tầng: bậc thông thánh điển và dòng họ
    có học vấn; dija → Bà-la-môn, theo dhp295 sotthiye dịch Bà-la-môn).
  - kumbhadāsī → nữ tỳ đội ghè nước (thi-ap13:1.2, tiền lệ duy nhất; dùng lại).
    dāsikula → gia đình nô tỳ (không có tiền lệ; nô tỳ khớp nữ tỳ đã dùng).
  - puruttama → kinh thành tối thượng (7 khoá: tối thượng 3, tối thắng 3, tráng lệ 1;
    theo thi-ap37). seṭṭhi → triệu phú (theo thi-ap37).
  - kilesā jhāpitā → thiêu rụi (92 khoá). punabbhava → tái sanh (khoá trùng 15.4:
    7 khoá tái sanh so với 3 khoá tái sinh trong các khoá cùng Pāli; người biên tập
    có thể chuẩn hoá một lượt toàn tầng).
  - mahāpaññā → đại trí tuệ (tiền lệ lẫn lộn, mỗi dạng đại trí tuệ, đại tuệ, trí tuệ lớn chỉ vài khoá; không dạng nào chiếm đa số rõ).
  - Không có tiền lệ, dịch theo nghĩa Pāli: sītaṭṭa → khổ sở vì lạnh; udakahāriya →
    gánh nước; uggahetā → người học nắm các pháp; Mānena → do ngã mạn.

  BẤT ĐỊNH ĐÃ GHI LẠI, KHÔNG SỬA TRONG KINH:
  - 1.1–2.2 Pāli là một danh sách thuộc cách sở hữu (Vipassino … Kassapassa ca
    buddhassa) rồi mới tới pabbajitvāna sāsane ở 2.2. Bản Việt giữ đúng thứ tự và
    khoá: các tên ở 1.1–2.1 là của các Đức Phật, rồi sau khi xuất gia trong giáo pháp.
    Không thêm của các Ngài ở 2.2.
  - 1.4 koṇāgamanatādino: hợp từ Koṇāgamana + tādī; dịch bậc Koṇāgamana vững vàng,
    không chọn nghĩa khác của tādī.
  - 2.3 không có ahaṁ ở Pāli nên bản Việt cũng không thêm ta cho tới 4.1.
  - 3.2 và 11.2 dhammattha-: hợp từ có thể là pháp và nghĩa (hai thành tố) hoặc nghĩa
    của pháp; dùng cùng một dạng pháp và nghĩa ở cả hai chỗ cho nhất quán.
  - 3.4 sotā payirupāsitā: Pāli không nêu đối tượng của hầu cận; bản Việt không thêm
    bậc thầy.
  - 4.4 pesalā atimaññisaṁ: pesalā có thể là đồng vị ngữ với ahaṁ (ta, người hiền
    thiện, đã tự cao) hoặc tân ngữ số nhiều (đã khinh các vị hiền thiện); atimaññati
    thường có tân ngữ. Chọn cách đầu, vì Mānena ở 17.3 nêu nguyên nhân là ngã mạn
    của chính bà, và vì không thêm tân ngữ nào vào lời kinh. Cần xem lại.
  - 6.2 sotthiyaṁ dijaṁ: có thể là một Bà-la-môn thông thánh điển hoặc là tên gọi
    Bà-la-môn Sotthiya; Pāli root không viết hoa nên dịch là danh xưng chung.
  - 8.4 và 10.4: nháy đơn đóng ở cuối khoá theo Pāli (’.), nên 8.4 là ?’. và 10.4 là
    ’., khác với thig12.1 dùng ngoặc kép.
  - 11.1 uttarantassa: không nói rõ bước lên khỏi chỗ nào; bản Việt giữ đang bước lên
    và để mạch kể ở 6.3 (giữa dòng nước) tự làm rõ, không thêm khỏi nước.
  - 12.1 ūnakasataṁ: một trăm còn thiếu một; bản Việt giữ số một trăm còn thiếu mà không
    giải thích thêm; lý do tên Puṇṇā ở 12.3 (đầy đủ) là do Pāli, không phải do bản dịch.
  - 13.1 Seṭṭhiṁ tato anujānetvā: tân ngữ ở cách đối cách nên có thể là cho phép
    hoặc xin phép; dịch được vị triệu phú cho phép, không nêu ai chủ động. Không có
    thêm sự kiện.
  - 13.3 đứng riêng một nửa câu (chẳng bao lâu) và 13.4 mới có động từ; giữ đúng ranh
    giới khoá.
  - 17.1–17.4: bốn vế đối ứng nhau (tu tập/đại trí tuệ, nghe/học rộng, ngã mạn/gia đình
    thấp hèn, nghiệp không mất). 17.4 na hi kammaṁ vinassati dịch vì nghiệp không bao
    giờ hoại diệt, giữ đúng chức năng nêu lý do; tiền lệ duy nhất (pv29:6.2) dịch
    nghiệp đã tạo không bao giờ hoại diệt, bản này bỏ đã tạo vì Pāli không có.
  - Bản tra cứu toàn văn nguyên bài của Bhikkhu Indacanda trên SuttaCentral (giấy
    phép NOASSERTION; không phải tầng store, không căn lề theo khoá) đã được đọc để
    hiểu mạch kể và kiểm lại nghĩa ở chỗ khó; không chép vào bản dịch và không được
    tính vào coverage hay triangulation. Bản đó dựa trên bản Buddha Jayanti nên khác
    văn bản Pāli root ở nhiều dòng, chẳng hạn các khoá 14–20 của bài này là dạng rút
    gọn, đối chiếu chỉ ở mức nội dung.

