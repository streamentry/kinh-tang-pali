notes: |-
  **Bài KỆ, không phải văn xuôi liệt kê.** Lát giao nhắc `pv` là văn xuôi, nhưng riêng `pv35` (Dhātuvivaṇṇapetavatthu) là **10 bài kệ + uddāna**, và `pv34` (ngay trước, cùng phẩm) cũng kệ. Tôi theo văn phong `pv34`/`pv29`: 4 pāda một khối, pāda sau viết thường nối tiếp, trích dẫn `“…”ti` đóng ở `3.4` và `10.4`. **Cơ cấu đo bằng script:** 53 khoá = 3 khoá block `:0` (`0.1`, `0.2`, `0.3`) + **42 pāda thân kinh** + 3 khoá văn sau (`11.1`, `12.1`, `13.1`) + 5 pāda uddāna (`14.1–14.5`). 42 pāda = 9 kệ × 4 + kệ `5.x` **6 pāda** (`5.1`–`5.6`) ⇒ 4×9 + 6 = 42. Phép cộng: 3 + 42 + 3 + 5 = **53** ✅ khớp đúng danh sách lát.
  **Năm phép tự chạy (không dùng `_hvi.py`, vì bài ngắn nên nó có thể chạy rỗng):** (1) `set(khoá Việt) = set(khoá Pāli)`: **53 = 53**, thiếu 0, thừa 0; thứ tự cũng khớp Pāli và khớp `all` của lát. (2) nháy đơn `‘’` + ngoặc kép `“”`: mẫu số **212 dấu** (53 khoá × 4 loại), khớp **212/212**, số khoá có lệch **0**. (3) Pāli trùng nguyên văn: trong CHÍNH pv35 có **0 nhóm** byte-trùng; `2.2`/`2.4` chỉ trùng sau khi bỏ dấu câu cuối (`okkantanti punappunaṁ;` vs `okkantanti punappunaṁ.`) và tôi dịch hai khoá **giống hệt nhau** để giữ công thức lặp. (4) `…pe…` = **0** khoá, `…` trần = **0**, `(…)` = **0** ⇒ không có khoá nào bị mở rộng hay xoá dấu lược; không có `… cho đến …`. (5) NFC: **0** khoá không NFC; khoá rỗng: **0**. Ngoài ra: **0** khoá Pāli của pv35 dài từ 40 ký tự trở lên (dài nhất là `11.1`, 31 ký tự; trung bình 21,8), nên phép (1) là phép duy nhất có thể bắt lỗi mất khoá ở đây.
