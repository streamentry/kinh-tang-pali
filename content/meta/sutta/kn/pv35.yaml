  **Pāli trùng nhưng CỐ Ý dịch khác (5 khoá):** `3.2` `manasā dukkaṭaṁ kataṁ;` — 6/7 tệp ghi *do ý mà đã làm;*, riêng pv33 và pv34 ghi *điều xấu gì ngươi đã làm nơi ý mình;*. Tôi theo 6/7; hệ quả là `dukkaṭaṁ` (*điều xấu*) thành ngầm, nhưng `3.1` dùng lại nguyên văn cũng không có *điều xấu* (chỉ *Điều gì ngươi đã làm*), nên giữ nhất quán; `idaṁ dukkhaṁ` ở `3.4` đã mang *khổ*. · `9.2` `abbhutaṁ lomahaṁsanaṁ;` — 2/4 tha-ap ghi *đáng kinh ngạc, rợn da gà;*, tôi theo đa số 2/4 (tha-ap113 *thật là rợn da gà kinh khủng bố* và tha-ap125 *sững sờ kinh hãi* là 1 mỗi bên). · `10.2` `yoniṁ laddhāna mānusiṁ;` — ba cách: ja314 *và được tái sinh làm thân người*, pv45 *được tái sinh làm thân người*, pv50 *sinh ra làm người*. Tôi lấy **pv50** vì `10.1` `Sohaṁ nūna ito gantvā,` trùng byte-for-byte `pv50:4.1` và đã dùng lại nguyên văn *Chắc hẳn từ đây đi đến,* — phải giữ `10.1–10.2` là một cặp của cùng một bài. · `13.1` `Tassuddānaṁ` — 341 cặp dùng *Tóm lược:*; tiền lệ gần nhất trong chính Paññāvaṃsa là `pv12` cũng *Tóm lược:*. · `14.5` `Vaggo tena pavuccatīti.` — 3/7 ghi *phẩm ấy vì vậy được gọi tên là vậy.* (chữ thường), tôi theo đa số.
  **Tài liệu đã tra, kèm số đếm:** `antarikha` → *không trung* (12 khoá dn16 dịch *không trung*, trong đó 9 khoá cùng nghĩa không-gian trời); `mahāmuni` → *Đại Mâu-ni* (33 khoá Pāli trùng); `vandanti` → *quỳ lạ/đảnh lễ*; `Ādīnavaṁ` → *nguy hại* (3 khoá Pāli trùng, mn82/snp1.3); `niraya` → *địa ngục* (90 khoá); `māla` → *tràng hoa* (4 lần trong danh sách chuẩn `y phục, giường nằm, tràng hoa, hương thơm, phấn sáp`; thêm 3 khoá Pāli `māla` độc lập ở iti83 / tha-ap322 / tha-ap400 / tha-ap556 cũng dùng *tràng hoa*); `uppala` → *hoa sen xanh* (9 khoá); `vilepana` → *thuốc xoa/xức hương* (53 khoá); `suṇisā` → *dâu* (dn16 *con dâu*); `dhītā` → *con gái*; `thūpa` → *tháp* (dn16.27 dùng *dựng tháp xá lợi* + *đại lễ*, tức `thūpa`+`mahā`); `punappunan` → *hết lần này đến lần khác* (tiền lệ `sakkacca naṁ punappunan”); `mārisa` → *bạn hiền* (7 lần lộ rõ, so với *ông bạn tốt* 1 lần); `yasassinī` → *danh tiếng* (23 khoá Pāli trùng); `Issara` → *chúa tể* (tiền lệ dn1/dn11 *Chúa Tể*; pv29.3.2 `sabbakulassa issarā` → *là nữ chủ làm chủ cả gia đình*); `paccattavedana` → *tự thọ* (mn50 `paccattavedaniyo` → *Tự Mình Cảm Thọ*); `bhusa` → *thóc rơm* (pv29 `Bhusapetavatthu` → *Chuyện Ngạ Quỷ Trấu Thóc*). `Cūḷavaggo` → *Phẩm Nhỏ* (2/3 tiền lệ có sẵn trong tầng). `dhanadhañña` giữ nguyên *nāga* (676 lần trong tầng kn).
  **`translationTitle` — đo, không chép:** 29 tệp `content/meta/sutta/kn/pv*.yaml` có `translationTitle`: **13** tệp có tiền tố `N. `, **16** tệp không có. Đa số **không** có tiền tố ⇒ tôi đặt *Chuyện Ngạ Quỷ Gom Xương Làm Tháp* (không số). Trong thân kinh, `0.3` và `11.1` vẫn giữ số `10.` vì Pāli có nó — giống hệt cách `pv29:0.3` giữ `4.` và `pv34:0.3` giữ `9.`.
  **Bất định đã ghi (không sửa theo phỏng đoán):** (1) `1.2` `vāyasi` — chỉ có **4** hit trong toàn Pāli root, `pv6:1.2` và `pv7:1.2` (`duggandhā pūti vāyasi;`) cùng một công thức nhưng **khác giống** (`Duggandho`), và hai tệp đó dịch *hôi hám, túi đựng thối nhoài!* — tức đọc khác hẳn của tôi. Tôi theo `thag1.28:1.4` `Kiṁ tvaṁ vāyasi netarā pajā` (gọi thẳng đối tượng) và dịch *hôi hám, thối nhoài, y như gió;*; cách đọc thứ hai là locative *trong gió*. (2) Bài kệ 2 — xem `blocking_errors`. (3) `3.2` `dukkaṭaṁ` để ngầm theo đa số 6/7 (xem trên). (4) `6.1` thêm đơn vị *năm* (xem trên). (5) `6.2` `mayaṁ paccattavedanā` không có tân ngữ trong Pāli; tôi cung cấp *khổ ấy* lấy từ `6.4` `paccāma niraye bhusaṁ` — ghi rõ đây là chỗ cung cấp tân ngữ, không phải chỗ dịch sáng. (6) `4.1` `rājagaha` dịch *khu vườn vua* vì phải dùng lại nguyên văn `pv32:2.1`/`pv33:4.1`; nhưng `rājagahe giribbaje` (*Rājagaha, núi bao bọc*) rất dễ đọc là **tên thành** Rājagaha. Giữ nguyên văn theo luật tái dùng, nhưng ghi bất định. (7) `4.4` `supahūtassa` là cách tôi hiểu danh từ bổ nghĩa cho `Issaro` (*bậc danh tiếng khắp nơi*); cách đọc khác là nó sửa cho `dhanadhaññassa`, khi ấy câu dịch phải khác. (8) `14.4` `dve luddā piṭṭhipūjanā` — uddāna Tiểu phẩm có **8** mục tên cho **10** bài. Tôi đối chiếu `pv25:22–23` (Tiểu Bộ 13 bài): `Dve seṭṭhī` đúng là **hai** bài (pv19 Dhanapālaseṭṭhi + pv20 Cūḷaseṭṭhi) ⇒ quy tắc `dve` + số nhiều = 2 bài. Vậy `dve luddā` = pv32 + pv33 (hai Migaluddaka, `11.1`/`12.1` xác nhận tên), còn `piṭṭhipūjanā` là ô duy nhất còn lại nên **buộc** phải phủ pv34 + pv35 — điều tôi **không** xác nhận được, vì `pv34` (`Kūṭavinicchayika`) không có `thūpa`/`pūjana` nào. Tôi dịch nghĩa chữ *kẻ thờ phượng dưới chân* và ghi bất định, không bịa tên bài. (9) Tên `Dhātuvivaṇṇapetavatthu` — tôi đọc `dhātū` (cái giốc) = đống xương gom lại, dựa trên `dn16:6.27.0` `Dhātuthūpapūjā` (mục 40 của DN16, tầng dịch *dựng tháp xá lợi*), nên dịch *Gom Xương Làm Tháp*; cách đọc `dhātu` = *pháp tướng* không khớp nội dung bài.
  **Coverage Anh — nêu rõ mẫu số bằng 0:** theo `source/layers.yaml` (`substantivePaliMinChars: 40`, `excludeReferenceBlock: true`, `floor: 0.8`), Pāli của pv35 có nội dung ≥ 40 ký tự sau khi loại block `:0` = **0 khoá** ⇒ **mẫu số = 0**, Sujato phủ **0/0**. Đây là bài **kệ ngắn**: 53 khoá, dài nhất **31** ký tự (`11.1`), trung bình **21,8**, và 3 khoá block `:0` bị loại. Cổng coverage vì vậy **không đo được gì** — khác hẳn với *không cần ghi nhận*. Ba tầng tham khảo: `english-sujato` 0 tệp (`not-published-upstream`), `vietnamese-current` 0 tệp, `english-project` không có tệp lẫn metadata. Đây là **giới hạn upstream**, không phải thiếu sót của repo: đo trên `source/upstream-manifest.json` (tầng `english-sujato`, 4.291 tệp) với `pali.P('kn')` thì **755** uid `kn` có tệp Anh và **2.019** uid không có (mẫu số 2.774 uid `kn` trong `P()`). Con số **2.019** là số tôi tự đo; con số 1.596 được nêu trong tài liệu định hướng **không** tái lập được từ `pali.P('kn')`, nên tôi dùng số đo của mình. Trong 755 tệp Anh đó, tầng `kn` chỉ có 9 sub-collection (`cp` `dhp` `iti` `ja` `kp` `snp` `thag` `thig` `ud`), không có `pv`.
  **Cổng kỹ thuật do coordinator chạy, ghi lại ở đây vì technical_integrity chỉ 9.6:** `npm run validate`; `npm test`; `npm run check`; `npm run build`. Tôi **không** chạy `npm run validate|test|build|check|audit|reference:gaps` (bị cấm trong lát này) và **không** chạy bất kỳ lệnh `git` nào, nên không tuyên bố technical gate pass.
  **Giải quyết draft 2026-10-12 (kiểm toán độc lập, đọc đối kháng từng khoá với Pāli). Mục này THAY THẾ các mục cũ nêu dưới đây khi mâu thuẫn:** tiêu đề *Gom Xương Làm Tháp* và mọi chỗ dịch `dhātu` = xương/cái giốc; bất định (1)–(9) của mục "Bất định đã ghi"; điểm và mục `blocking_errors` cũ về mẫu số 0 và bài kệ 2; ghi chú `6.1` thêm đơn vị *năm*; ghi chú "dùng lại" `10.1–10.2` theo bản pv50 cũ (pv50 nay đã sửa, `Tôi đây, chắc chắn, sau khi từ đây ra đi,` / `được tái sinh làm thân người;`). Các số đo cũ của phép kiểm tập khoá, nháy, NFC vẫn đúng với tập 53 khoá hiện nay.
  **Phân loại blocker.** (A) Không có bản Anh upstream: GIỮ NGUYÊN câu blocker đầu — đúng sự thật upstream (`english-sujato` ở trạng thái `not-published-upstream`), vì vậy `triangulation` không vượt 8.0 (đặt 7.4). Câu ấy cũng nêu `vietnamese-current` vắng và không có lớp `english-project`: đó là giới hạn tham chiếu, không phải lỗi văn bản, và được nêu ở đây thay cho một blocker riêng. (B) Blocker "mẫu số coverage = 0": GỠ. Mẫu số = 0 (53 khoá, khoá Pāli dài nhất 31 ký tự < 40, bỏ các khối `:0`) nên cổng độ phủ English không đo được gì và không chặn bài; `content/meta/reference-gaps.yaml` không cần entry cho bài này vì không có đoạn Pāli có nội dung nào bị bỏ trống. Đây là ghi chú về giới hạn đo, không phải lỗi bản dịch. (C) Tầng Việt hiện hành vắng (chỉ có Pháp Cú): giới hạn của snapshot, đã gộp trong câu (A). (D) Blocker "bất định bài kệ 2": GỠ vì đã giải được bằng căn cứ trong kho, không đoán — `okkantanti` = ava + kant, *cắt xẻo*: `kantati` = cắt (ja518:30.4 `mūlāni kantati` "cắt đứt cả gốc rễ"), `kantanti` = cắt (thig10.1:5.1 `Galake api kantanti` "tự cắt cổ mình"); `paripphositvā` thuộc `paripphoseti` = *rưới* (an3.102:2.5 `udakena paripphoseti` "rưới nước"; dn2:76, mn39:15.4 `paripphosakaṁ`); `satthaṁ gahetvāna` = cầm dao; `khāra` = chất kiềm (công cụ rưới lên chỗ vừa cắt). Cách đọc này khớp bản Việt nguyên bài ở mục Tra cứu toàn văn (chỉ dùng để hiểu cách đọc, không chép câu chữ). Không còn hapax chưa giải: bốn từ đều có nghĩa xác định; chỉ còn việc Pāli không nêu chủ ngữ (`họ`, ngôi thứ ba số nhiều) và tân ngữ của việc cắt, nên bản Việt cũng không thêm.
  **Lỗi nghĩa thật đã sửa: 32/53 khoá** (danh sách khoá: `0.3`, `1.2–1.4`, `2.1–2.4`, `3.1`, `3.4`, `4.1–4.4`, `5.1–5.5`, `6.1–6.4`, `7.1–7.4`, `9.1`, `9.4`, `10.1`, `11.1`, `14.4`); thêm 14 khoá chỉ sửa văn phong/khớp tiền lệ (`1.1` giữ, `5.6`, `8.1`, `8.2`, `8.3`, `8.4`, `9.3`, `10.2`, `10.3`, `10.4`, `12.1`, `14.1–14.3`, `14.5`). Chia loại: (1) Tên bài/`dhātu`: `Dhātuvivaṇṇapetavatthu` = chuyện ngạ quỷ *chê bai xá-lợi*; `dhātu` = xá-lợi (dn16:6.27.0 `Dhātuthūpapūjā` "thờ tháp xá lợi"), `vivaṇṇetvā` (6.3) = chê bai; bản cũ dịch "gom xương làm tháp", "đã kể rõ", "xương của tôi dựng tháp" — bịa nghĩa. `translationTitle` đổi khớp `0.3`/`11.1`. (2) Bịa hoặc đọc hỏng: `1.2` `vāyasi` = (ngươi) tỏa mùi (vāyati, dn17:1.15.5 `candanagandho vāyati` "tỏa hương"), bản cũ "y như gió"; `1.3` `kimayo` = giòi bọ (bản cũ đọc thành `kiṁ`: "quả thế mà"); `1.4` bản cũ thêm "phải ăn vào"; `2.1–2.4` bản cũ "lên đường… gõ tiếng kêu" hoàn toàn sai so với "cầm dao, cắt xẻo, rưới kiềm"; `9.4` "quỳ lạ" vô nghĩa → `vandanti` = đảnh lễ; `9.1` `accheraṁ` = điều kỳ diệu (bv14:12.1, cp9:36.1, ja547:222.1), bản cũ "điều không thể tin nổi". (3) Hô cách/người nói: `3.4` bản cũ chèn "bạch ngài" vào lời người hỏi (`nigacchasi` ngôi hai số ít; người hỏi gọi ngạ quỷ "ngươi" như pv33, pv43, pv44); `4.4` `mārisa` do ngạ quỷ nói với người hỏi = "thưa ngài" (pv25:5.4, pv25:11.2; bản cũ "bạn hiền" đảo vai). (4) Tên đất/danh từ chung đọc thành tên riêng: `4.1–4.2` bản cũ "khu vườn vua… ngọn núi thú thỉnh" và `4.3` "chúa tể của loài nāga" bịa; Pāli là địa danh Rājagaha, Giribbaja (khớp pv33:4.1–4.2 đã kiểm toán) và `Issaro dhanadhaññassa supahūtassa` = chủ nhân của tài sản và lúa gạo rất dồi dào (`dhanadhañña` = tài sản và lúa gạo: bv2:4.4, ja480:4.4, ja543:187.1). (5) Đảo chủ thể và bịa chi tiết ở kệ 5: `5.1–5.2` bản cũ "Chồng của bà ấy là tôi" — Pāli là vợ, con gái, con dâu *của tôi*; `5.3–5.5` bản cũ "tràng hoa sen xanh", "thuốc xoa lên chân", "Xương của tôi… họ mang về dựng tháp" — đúng là họ đang đem tràng hoa, hoa sen xanh và dầu xoa quý giá (khớp pv15:16.2) đến tháp và tôi đã ngăn họ (`vāresiṁ` thì quá khứ, ngôi một). (6) Số: `6.1` `Chaḷāsītisahassāni` = chaḷ (6) + asīti (80) = 86, ×1.000 = 86.000 (người, theo `mayaṁ`); bản cũ "bảy trăm hai mươi ngàn năm" sai cả con số lẫn đơn vị (Pāli không có `vassa`); khớp pv25:7.1, tha-ap8:38.1 "Tám mươi sáu ngàn". `6.2` `mayaṁ` = chúng tôi (bản cũ "tôi"); `6.4` `bhusaṁ` = dữ dội (bản cũ "như thóc rơm" là lỗi `bhusa` đã bị chép từ pv28, xem pv28 notes). (7) Đảo nghĩa kệ 7: bản cũ "thì tiến đến bậc A-la-hán" — Pāli `Ye ca kho thūpapūjāya, vattante arahato mahe, ādīnavaṁ pakāsenti` = những ai, khi lễ hội của bậc A-la-hán đang diễn ra, nêu điều nguy hại đối với việc cúng dường tháp; `vivecayetha ne tato` = hãy tách họ ra khỏi việc ấy (bản cũ "ước gì họ thoát ra"). (8) `3.1` bản cũ mất `dukkaṭaṁ` (điều ác); đã dùng lại nguyên văn tiền lệ "Điều ác gì là do thân, do lời nói," (16/17 tệp). (9) `10.1` `gantvā` = ra đi: dùng lại pv50:4.1 đã kiểm toán. (10) `14.4` `dve luddā` = hai thợ săn (bản cũ "hai kẻ keo kiệt"); bất định (8) cũ về `piṭṭhipūjanā` nay giải được: Cūḷavagga gồm 10 bài pv26–pv35 (câu đóng bài ghi pv30 "thứ năm", pv31 "thứ sáu", pv32 và pv33 hai thợ săn "thứ bảy" và "thứ tám", pv34 "thứ chín", pv35 "thứ mười"), uddāna có 8 mục tên: `dve luddā` = pv32 + pv33 và `piṭṭhipūjanā` là hai mục `piṭṭhi` (kẻ nói xấu sau lưng — pv34, `piṭṭhimaṁsika`) + `pūjanā` (cúng dường — pv35), khớp đủ 10 bài; dịch *kẻ nói xấu sau lưng, sự cúng dường*, bản cũ "kẻ thờ phượng dưới chân" bịa.
  **Phép đo sau sửa** (mẫu số in kèm): tập khoá Việt = Pāli: 53 = 53, đúng thứ tự; nháy kép “ ” và nháy đơn ‘ ’ khớp Pāli từng khoá: 0 lệch trên 53 khoá × 4 loại dấu; NFC/khoá rỗng/khoảng trắng thừa: 0; Pāli lọt sang Việt: chỉ tên riêng và tên bộ (`0.1`, `0.2`, `14.1–14.3`, cùng `Rājagaha`, `Giribbaja`). `…pe…`/`…`/`(…)`: Pāli có 0 khoá, Việt 0 khoá. Pāli trùng nguyên văn TRONG bài: 1 cặp (`2.2`/`2.4`), bản Việt giống hệt (chỉ khác dấu cuối). Pāli trùng nguyên văn ở bài khác: 19 khoá có trùng, 722 cặp đã dò, trong đó 171 cặp bản Việt khác; 17/19 khoá dùng lại nguyên văn (kể cả `3.1–3.4`, `5.4` cùng pv15:16.2, `5.6`, `6.1`, `8.2` cùng pv26:18.2, `9.2` 16 khoá, `10.1–10.2` cùng pv50, `13.1`, `14.5` theo 16/30 tệp); 2 khoá khác có chủ ý là `1.3`–`1.4` (pv3 cũ ghi "ngài"; theo pv3 đã kiểm toán ở nơi khác, người hỏi gọi ngạ quỷ "ngươi"). `14.5` công thức uddāna có nhiều cách dịch (16/30 tệp ghi "phẩm ấy vì vậy được gọi tên là vậy"; các tệp còn lại ghi nhiều cách khác, trong đó pv51 ghi "do đó phẩm này được gọi tên"); giữ đa số.
  **Bất định còn lại (không thêm vào thân kinh):** (1) kệ 2: Pāli không nêu chủ ngữ `họ` và đối tượng bị cắt/rưới; giữ như Pāli. (2) `7.1–7.4` `thūpapūjāya … ādīnavaṁ pakāsenti`: dịch "đối với việc cúng dường tháp… nêu rõ điều nguy hại" (người chê bai nói về điều bất lợi của việc cúng dường); cách đọc khác là *khi lễ cúng dường tháp đang diễn ra, họ nêu điều nguy hại (của việc chê bai)*; vế `vivecayetha ne tato` vẫn là tách họ khỏi việc ấy trong cả hai cách. (3) `14.4` `piṭṭhipūjanā` đọc là hai mục tên (dựa vào đếm 10 bài), không phải một hợp từ. (4) `6.2` `paccattavedanā` không có tân ngữ; dịch *mỗi người tự chịu cảm thọ riêng* thay vì thêm "khổ". (5) `5.1` `Tassāyaṁ` — đại từ `tassa` không dịch riêng (đã thành ý "của tôi"). (6) `4.4` `supahūtassa` đọc là định ngữ của `dhanadhaññassa`.
  **Coverage Anh (nói lại cho khớp phép đo mới):** mẫu số = 0 (Pāli có nội dung ≥ 40 ký tự sau khi bỏ khối `:0`), Sujato phủ 0/0 ⇒ cổng độ phủ không đo được gì; ba tầng tham khảo đều vắng (Sujato `not-published-upstream`, Việt hiện hành chỉ Pháp Cú, không có lớp `english-project`). `triangulation` = 7.4 (không bao giờ cao hơn 8.0 khi không có bản Anh độc lập); bản dịch dựa vào Pāli root + tiền lệ trong kho (pv3, pv15, pv25, pv26, pv33, pv39, pv43, pv44, pv50, pv51, dn16, an3, thig10.1, ja518…) và bản Việt nguyên bài ở mục Tra cứu toàn văn chỉ để hiểu cách đọc. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa được chạy trong lượt này (bị cấm), nên `technical_integrity` giữ 9.6, không tuyên bố technical gate pass.
