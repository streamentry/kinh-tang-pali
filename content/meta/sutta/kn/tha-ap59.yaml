  **ĐỌC TOÀN BỘ PĀLI 32 KHOÁ TRƯỚC KHI VIẾT**, rồi in lại từng cặp Pāli↔Việt để review.

  **COVERAGE TẦNG ANH — ĐO ĐƯỢC, VÀ MẪU SỐ CỰC NHỎ.** Đếm khoá Pāli ≥ 40 ký tự, bỏ
  khối tham chiếu `:0` và bỏ khoá đánh số phần: mẫu số của bài này chỉ là **1**
  (`tha-ap59:8.1`, 64 ký tự) — vì `tha-ap59:9.1` chỉ dài **38** ký tự, dưới ngưỡng.
  Tử số = **0** vì `kn/tha-ap/` không tồn tại trong `english-sujato`. ⇒ coverage **0/1 =
  0%**. Đây là **hai sự thật riêng**: tầng Anh vắng hẳn ở commit đã ghim, và ngưỡng 40
  ký tự gần như không đo được gì trên bài kệ ngắn. Cổng coverage ở đây **không có
  quyền nói** gì về chất lượng đối chiếu; đừng đọc `0%` là "đã kiểm và ổn".

  **SỐ THỨ TỰ Ở `:0.3` — ĐO LẠI, VÀ SỐ TÔI ĐƯỜNG KHÔNG KHỚP PHÉP ĐO CỦA TÔI.**
  Đo trên **414** tệp `tha-ap` có khoá `:0.3`: có số thứ tự **73**, không có **274**,
  rỗng **67** ⇒ bỏ 67 tệp rỗng thì **KEEP 73 · DROP 274**. Con số **66/275 trên 341 tệp**
  mà tôi được báo không tái lập được; hệ số vẫn nghiêng hẳn về **DROP** ở cả hai phép
  đo, nên tôi theo phép đo của mình: `:0.3` **KHÔNG** ghi số thứ tự. Cơ sở độc lập:
  Pāli `tha-ap59:0.3` = `Pañcadīpakattheraapadāna`, **không có số thứ tự**; thêm vào
  là chữ không nguồn. Ở colophon thì Pāli có `sattamaṁ` = thứ bảy nên **phải giữ** —
  đo 220 tệp `tha-ap` có colophon chứa số thứ tự trong Pāli: **KEEP 192 · DROP 0 ·
  rỗng 28**. Mỗi bài tự nhất quán: `:0.3` không số, `:9.1` có số.

  **MẪU TÊN `:0.3` — CHỌN THEO ĐA SỐ CỤC BỘ CỦA PHẨM.** Cả tầng (414 tệp, bỏ 67 rỗng):
  «Bài Kệ Tuyên Ngợ Về Trưởng Lão» **196** · «Ký Sự Về Trưởng Lão» **86** · «Bài Kệ Tuyên
  Ngôn Về Trưởng Lão» **65**. Cục bộ phẩm `Bījanivagga` (5 bài): Tuyên Ngợ **4** ·
  Tuyên Ngôn **1**. Cả hai phép đo đều nghiêng **Tuyên Ngợ** ⇒ dùng *Bài Kệ Tuyên Ngợ Về
  Trưởng Lão Pañcadīpaka* ở cả `:0.3` và `:9.1`, đúng mẫu `tha-ap56/57/60/61`.

  **`Bījanivagga` → «Phẩm Hạt Giống»** — cùng phẩm 3× (`tha-ap57/60/61`) so với 1×
  *Phẩm Bījanivagga* (`tha-ap56`); `tha-ap55` ghi *Phẩm Cái Quạt* là dịch nhầm theo tên
  bài kệ `Sayanadāyaka`.

  **TÊN DANH XƯNG GIỮ CHỮ PĀLI.** `Pañcadīpaka` giữ nguyên, nhất quán với `tha-ap63`
  (`Sakacintaniya`), `tha-ap66` (`Parappasādako`), `tha-ap68` (`Sucintito`). Tên này
  **không dịch** vì `pañca` = năm và `dīpa` = đèn, mà ở chính bài này `:2.1` nói
  `Padīpadānaṁ pādāsiṁ` — **bốn** ngọn đèn có bệ (xem notes).

  **DÙNG LẠI NGUYÊN VĂN 9 KHOÁ** (đếm được, chỉ mục Pāli→Việt trên 96.029 cặp của
  toàn tầng `vi/project`):
  · `“Padumuttarabuddhassa,` → *“Của Đức Phật Padumuttara,* (4×)
  · `sabbabhūtānukampino;` → *thương tưởng tất cả chúng sanh;* (`sn1.35`)
  · `Yaṁ yaṁ yonupapajjāmi,` → *Dù sinh vào cảnh giới nào,* (4×)
  · `Samantā yojanasataṁ,` → *Xa trăm do-tuần chung quanh,* (`an3.36` có cùng cách)
  · `Catuttiṁse kappasate,` → *Vào ba mươi tư trăm kiếp trước,* (`tha-ap55`)
  · `cakkavattī mahabbalā.` → *là Chuyển Luân Vương có đại oai lực.* (10×; có 12×
    dùng thêm "các" — tôi bỏ vì ở đây số cái **nhiều** nhưng câu đã có danh từ ở khoá
    trước nên "các" là dư)
  · `Paṭisambhidā catasso,` → *Bốn vô ngại giải,* (**355×**)
  · `…pe…` → đúng một `…` (**627×**) ·
  `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”.* (**322×**)
  · `Itthaṁ sudaṁ āyasmā … imā gāthāyo abhāsitthāti.` → *Tôi nghe như vầy: Tôn giả
  Trưởng lão … đã nói những bài kệ này.* (**348** bài dùng đúng công thức này)

  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `parivāretvāna bodhiyaṁ` (:2.2) — 0 tiền lệ nguyên văn, không có tầng Anh để
    phân xử. `parivāreti` = kính lễ / dâng lên cho (`tha-ap55:2.1` dùng cho cùng công
    thức *Nhờ việc bố thí …*), `bodhiyaṁ` = *sự giác ngộ*. Tôi dịch *ta dâng lên để kính
    lễ chứng Bồ-đề* — giữ cả hai vế, không thêm tên riêng nào.
  · `akariṁ tāvade ahaṁ` (:2.4) — số cái **nữ** `ā`, đọc là *sống với lượng sáng ấy*
    (đối chiếu với bốn ngọn đèn ở `:2.1`). Không viết thành "năm ngọn": Pāli ở đây nói
    **bốn**, và tên `Pañcadīpaka` là danh xưng riêng của vị trưởng lão, không phải số đếm
    trong câu.
  · `Tirokuṭṭaṁ tiroselaṁ, samatiggayha pabbataṁ` (:4.1–4.2) — 0 tiền lệ nguyên văn.
    `kuṭṭa` = **cây cuốc** (từ điển: spade/pickaxe), `tirosela` = từ đông sang tây
    (qua núi Sela ở phía tây), `samatiggayha pabbataṁ` = đâm xuyên tảng núi. Đây là
    hình ảnh trưởng lão tự tạo để tới chỗ thấy Đức Phật; tôi dịch theo nghĩa đen, không
    suy thêm chuyện đào đường hầm.
  · `dassanaṁ anubhomahaṁ` (:4.4) — `anubhoma` = đã đạt được. Tôi dịch *ta đã đạt được
    sự thấy ấy*, giữ chữ *đạt* của động từ thay vì chỉ *thấy*.
  · `dvipadinda` (:5.4) — **0 tiền lệ** cho danh từ này trong toàn tầng Việt (đếm:
    "Nhị Bàn Thân" 0, "lưỡng cước" 0, "Hai Bàn Chân" 0; tầng Anh đã ghim cũng không có).
    Đây là cách gọi Đức Phật hai chân, thuộc hàng danh xưng quen thuộc của kinh điển Việt
    Nam, nên tôi dùng Hán–Việt *Nhị Bàn Thân* và **ghi ở đây** vì không có tiền lệ đo
    được để đối chiếu.
  · `kammāvasesena` (:5.1) — 0 tiền lệ. Đọc là *phần dư của công đức ấy* (`vasesa` =
    phần còn lại/dư). `āsavakkhayaṁ` ở `:5.2` dịch *sát lậu hoặc* vì đây là chữ tản
    danh nối với mệnh đề, chứ không phải hành động.
  · `satacakkhusanāmakā` (:6.2) — `sanāma` = mang tên; có tiền lệ *Đều mang tên là
    Hatthiya,* (`tha-ap47:5.3`), *mang tên là Paṭijaggasa* (`tha-ap279:3.2`). Tôi dịch
    *tên là Chuyển Luân Vương trăm bậc*, giữ `pañca…`/`sat…` của câu trước làm câu nối.

  **DẤU LƯỢC.** `:7.2` là `…pe…` → **đúng một** `…`, không mở rộng.

  **NGOẶC KÉP.** `“` mở ở `:1.1`, `”` đóng ở `:7.3`; cân trên cả bài (1 mở, 1 đóng).
