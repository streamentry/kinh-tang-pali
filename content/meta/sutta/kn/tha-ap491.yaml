notes: |-
  Dịch trực tiếp từ Pāli root (106 khoá); cả ba tầng tham khảo đều vắng ở bài này (đo và bằng chứng ở `blocking_errors`). Bài thuộc phẩm Paṁsukūlavagga (Phẩm Y Phấn Tảo), bài thứ chín của phẩm: Trưởng lão Dhammaruci nhớ lại lời Đức Phật Dīpaṅkara thọ ký cho Sumedha, việc mình làm bạn với Sumedha rồi xuất gia theo, bị bạn xấu xúi giết mẹ và đọa địa ngục, kiếp cá timiṅgala nghe tiếng hô Gotama, kiếp này sinh ở Sāvatthī, bảy tuổi gặp Đức Phật và xuất gia.
  `translationTitle` đặt BẰNG ĐÚNG khoá `:0.3`. Pāli `:0.3` là `9 Dhammaruciyattheraapadāna`, bắt đầu bằng chữ số nên giữ số thứ tự theo hình thức `N. ` (đúng chính sách giữ số khi và chỉ khi Pāli bắt đầu bằng số; liền kề tha-ap482 và tha-ap501 cũng viết `10. ` và `9. `). Khoá cuối `:28.1` lặp tên bài kèm `, thứ chín` (navamaṁ), không có số đầu.
  Dạng tên bài: đo ở nhiều phạm vi, kết quả cùng nghiêng một phía nhưng khác độ lớn. Trong cây làm việc, toàn tầng tha-ap: Bài Kệ Tuyên Ngợ 251, Bài Kệ Tuyên Ngôn 132, Ký Sự 111. Ở nhóm 4xx: Tuyên Ngợ 48, Ký Sự 23, Tuyên Ngôn 8. Ở nhóm 470–499: Tuyên Ngợ 18, Ký Sự 6, Tuyên Ngôn 0. Cùng phẩm Y Phấn Tảo: Tuyên Ngợ 5/5; các bài tha-ap480–492 đã có: Tuyên Ngợ 8/8. Trong cây chính, toàn tầng: Tuyên Ngợ 250, Tuyên Ngôn 123, Ký Sự 104. Tôi theo đa số phạm vi gần nhất (Tuyên Ngợ) để cả phẩm đồng nhất, dù Tuyên Ngợ có vẻ là chính tả sai của Tuyên Ngôn; việc chọn một dạng cho cả cuốn là việc của người biên tập, để sửa hàng loạt một lượt.
  Tiền lệ đếm được: 17 khoá Pāli của bài trùng nguyên văn với khoá đã dịch ở tầng tha-ap (0.1, 0.2, 3.1, 4.3, 10.1, 10.2, 11.1, 19.2 và các khoá công thức Kilesā, Svāgataṁ, Paṭisambhidā); dùng lại nguyên văn bản Việt ở 15/17. Hai khoá cố ý khác tiền lệ: `:4.3` (tiền lệ duy nhất 1 khoá viết Mang tên gọi là Ānanda; tôi viết vị có tên là Ānanda cho gọn) và `:11.1` (tiền lệ duy nhất 1 khoá viết Tôi sống như vậy; tôi viết Ta vì người kể là Trưởng lão dùng ta trong cả bài, khớp đa số công thức Kilesā: ta 100 khoá so với tôi 24 + 15).
  Pāli trùng trong chính bài: 1 nhóm (`:24.2` = `:25.2` = `:26.2`, đều `…pe…`), 3/3 khoá Việt giống nhau (đúng một `…`). Không có cặp trùng nào khác trong bài, nên phép dò trùng nội bộ gần như rỗng.
  Số Pāli: `Aparimeyye ito kappe` là vô lượng kiếp (không phải số đếm). `sattavassiko` = 7 tuổi (sattavassa, khớp tha-ap21 và tha-ap62 lên bảy tuổi). `tikkhattuṁ` = ba lần. `satapuññalakkhaṇaṁ` = trăm tướng phước (sata = 100, khớp mil5.1.3 và dn30). `pañcasu` = năm căn. `catasso` = bốn vô ngại giải. `navamaṁ` = thứ chín. Không có cụm Tiṁsakappasahassa. Không có phép nhân thang lớn.
  Lời thọ ký tương lai: `Aparimeyye ito kappe … bhavissati` ở `:1.3–1.4` dịch Sau vô lượng kiếp nữa kể từ nay (tiền lệ tha-ap4 và tha-ap481 viết Sau vô lượng kiếp kể từ nay; tôi thêm nữa để rõ đây là thì tương lai, theo chỉ dẫn của người điều phối). Các động từ tương lai `bhavissati`, `hessati`, `bujjhissati`, `hessanti`, `upaṭṭhissati` dịch sẽ.
  Ngôi: người kể là Trưởng lão dùng ta trong lời tự thuật (khớp tha-ap490, tha-ap493 và đa số công thức Kilesā). Lời Trưởng lão thưa với Đức Phật ở `:21.1–23.4` dùng con và Ngài (khớp tha-ap490 ở lời con rùa thưa; tiền lệ Ngài cho tava/tuyhaṁ ở tha-ap34, tha-ap37, tha-ap43). Pāli không có dấu nháy cho đoạn thưa này nên bản dịch cũng không thêm nháy. Công thức kết `:27.1` dùng Tôi nghe như vầy… những bài kệ này (nhóm 407 khoá trong tầng), không dùng nhóm số ít.
  Thuật ngữ đã đo: Chiến Thắng cho jina (14 khoá Padumuttaro nāma jino…, thi-ap29, bv20); giáo pháp cho jinasāsana (bv20:12.4) và `:12.2` sāsanato, trong khi lời dạy cho công thức buddhassa sāsanaṁ (456 khoá) — hai chữ dịch cùng sāsana vì ngữ cảnh: `:10.4` và `:12.2` nói về nền giáo pháp, công thức kết nói về lời dạy phải làm tròn; Đại Mâu-ni cho mahāmuni (khớp tha-ap490); Đại Ẩn Sĩ cho mahesi (tha-ap32 và snp, đa số); Anh Hùng cho vīra (tha-ap4: mahāvīra là Đại Anh Hùng); ưu việt cho puṅgava (tha-ap404: ưu việt của dòng Sakya); ngọn đèn của thế gian cho lokapajjota (8 khoá trong tha-ap); trăm tướng phước cho satapuññalakkhaṇa (mil5.1.3, dn30); đọa xứ cho vinipāta (tha-ap26: Tôi không đi vào đọa xứ); địa ngục Mahāvīci theo tiền lệ địa ngục Avīci ở iti89 (Mahāvīci không có tiền lệ khoá nào trong tầng); cá timiṅgala theo an8.19 (không dịch nghĩa); thọ ký cho byākarī theo bv17 và bv20 (đã thọ ký cho ta), trái với tha-ap Nimittabyākaraṇiya dùng giải đoán cho nghĩa khác; cây assattha giữ nguyên tên (dn14, bv27, 5 khoá); Khemā và Uppalavaṇṇā, Khujjuttarā, Nandamātā, Upatissa, Kolita giữ nguyên tên (bv27, sn17, an2); mệnh chung cho kālaṅkata (tha-ap68, 12 khoá); hạnh kiểm xấu cho anācāra (an10.85, thi-ap39); thân tín cho saṁvisaṭṭha (tha-ap, một khoá: là người thân tín); nghiệp vô gián cho ānantariya (tiền lệ duy nhất an6.93 dịch nghiệp không gián đoạn, không dùng lại vì nghĩa kỹ thuật là năm tội vô gián).
  Bất định, ghi ở đây chứ không giải thích trong thân kinh: (1) `:22.2` `sucirakkhena` chưa phân giải, giữ nguyên chưa dịch, là blocker thứ hai ở trên. (2) `:20.2` `ciraṁ dhammarucīti maṁ`: ciraṁ là đã lâu; không rõ Đức Phật nói đã lâu theo nghĩa gì (đã lâu mới gặp lại, hay đã lâu có tên ấy); tôi dịch sát chữ, không giải thích. Pāli không có dấu nháy ở đây nên dùng dấu hai chấm, không thêm nháy. (3) `:20.4` `pubbakammapabhāvitaṁ` đứng ngay sau buddhaṁ nhưng cũng có thể chỉ lời thưa ở `:21–23`; tôi dịch do nghiệp quá khứ làm phát sinh, kết bằng dấu hai chấm, để cả hai cách hiểu còn mở. (4) `:21.1–21.4`: suciraṁ có thể thuộc passāmi (sau rất lâu mới thấy) hoặc thuộc satapuññalakkhaṇaṁ; tôi theo cách thứ nhất; paccaya trong visuddhapaccayaṁ dịch nhân duyên (có thể là các điều kiện hay vật dụng). viggahaṁ dịch thân hình. (5) `:22.1` vihatattamo (vihata + tamo) kèm mayā: dịch bóng tối đã bị con diệt trừ, dù không rõ mayā chỉ tác nhân hay sở hữu. (6) `:22.3–22.4`: nayanaṁ ñāṇamayaṁ (con mắt do trí tạo thành) không nêu rõ mắt của ai; dịch trung tính con mắt trí tuệ. (7) `:23.2` punarantaraṁ ciraṁ dịch dù cách một quãng lâu nữa, sát chữ, vì không rõ punar đi với antaraṁ hay với ciraṁ. (8) `:12.1` vitakkavasiko dịch kẻ bị những ý nghĩ chi phối (vitakka ở đây là ý nghĩ nói chung, không phải tầm trong thiền). (9) `:13.2` ghātayiṁ: dạng sai khiến nhưng thường dùng nghĩa giết; Pāli không nêu đối tượng nên không thêm mẹ, dịch đã sát hại; `:12.4` mātughātanaṁ cho biết đối tượng là mẹ. (10) `:13.3` mahāvīciṁ: đã giữ tên Mahāvīci kèm địa ngục theo iti89, không dịch mahā. (11) `:19.4` rattiyā divasassa ca đi với tikkhattuṁ; dịch ba lần trong đêm và ngày, không tách thành ba lần mỗi buổi. (12) `:15.1` asmiṁ kappe dịch trong kiếp này (không phải lời thọ ký tương lai nên không dùng sau … nữa). (13) `:9.1–9.2` saṁvisaṭṭho với locative sumedhe: dịch trở nên thân tín với Sumedha.
  Quy ước dấu: ngoặc kép “ mở ở `:1.1` và đóng ở `:26.3`; nháy đơn ‘ mở ở `:1.3` và đóng ở `:6.4`. Khớp Pāli từng khoá (106/106). `…pe…` ở `:24.2`, `:25.2`, `:26.2` thành đúng một `…` (3/3); không khoá nào có `(…)` trần.
  Tự kiểm: tập khoá Việt bằng đúng tập khoá Pāli (106 = 106, đúng thứ tự); nháy đơn và nháy kép khớp Pāli ở 106/106 khoá; dấu lược khớp 106/106; mọi giá trị NFC, không rỗng, không khoảng trắng thừa; không Pāli lọt ngoài các tên riêng và `sucirakkha` đã nêu; đã in cặp Pāli với Việt từng khoá để đọc đối kháng.
