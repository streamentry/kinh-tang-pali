notes: |-
  Tầng tham khảo: có bản Anh Sujato tại commit đã ghim, tệp có đủ 15/15 khoá (đếm bằng script trên cache đã ghim .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/). Sujato chỉ có chữ ở khối 0.x và phần đầu bài, các khoá từ 2.x trở đi để trống, nên phần đóng góp của tầng Anh có hạn và triangulation chấm vừa phải, không chấm cao. Không có bản Việt hiện hành của Hòa thượng Thích Minh Châu cho Khuddaka Nikāya trong bản chụp upstream; đây là giới hạn của bản chụp, không phải thiếu sót của repo.

  Đủ 15/15 khoá. Đã đọc hết Pāli lát f120.pali.txt trước khi viết.

  Tên phẩm: Dukanipāta → **Bộ Hai Bài Kinh** (bảng §11); Dutiyavagga → “Phẩm Thứ Hai”.

  Cặp Pāli trùng nguyên văn đã dùng lại — mạnh nhất lát này. Bản chỉ mục Pāli↔Việt toàn tầng
  (nạp 5.764 tệp Pāli trong cache, ghép 3.678 tệp Việt dự án) cho thấy 1.3–1.6 và 2.1–2.4
  của bài này TRÙNG NGUYÊN VĂN với `iti78:7.1–7.4` và `iti78:8.1–8.4`. Theo luật “Pāli trùng
  nguyên văn thì cách dịch phải khớp”, tôi dùng lại đúng bản Việt đang có:
  kẻ biếng nhác · dù sống lành cũng chìm · do đó, hãy tránh xa · thiếu tinh tấn · bậc Thánh
  viễn ly · những vị quyết tâm, thiền định · thường tinh cần · cùng sống với bậc trí.
  Bản nháp đầu của tôi dịch riêng (“kẻ lười nhác”, “bậc lành”, “sống cùng bậc hiện trí”) và
  sẽ tạo thêm một cách thứ N+1 cho cùng một câu Pāli; đã sửa theo bản đã có. Riêng 2.4 tôi
  giữ `”ti.` vì Pāli ở đây có `ti` còn `iti78` đã lược mất.

  LƯỖI ĐÃ BẮT Ở LƯỢT REVIEW ĐỐI KHÁNG. Bản nháp dịch `pavivitta` là “ly dâu” — 0 tiền lệ
  trong cả tầng và đọc khó hiểu; đã sửa theo bản `iti78` là “viễn ly” (thuộc cụm “bậc Thánh
  viễn ly”). Đồng thời bản nháp dịch `sādhujīvī` là “sống đàng hoàng”, mất vế “dù… cũng”;
  đã sửa thành “dù sống lành cũng chìm”.

  Tam giác: Sujato có chữ ở 1.x–2.4 (*If you’re lost in the middle of a great sea… a person who
  lives well sinks by relying on a lazy person. Hence you should avoid such a lazy person who
  lacks energy. Dwell with the noble ones…*). `sādhujīvī` tôi dịch “sống lành” như bản `iti78`
  đang có, thay vì “sống đàng hoàng”.

  Dấu lược: khoá 2.5 giữ đúng HAI dấu `…` như Pāli `… Somamitto thero …. `.

  Kiểm kỹ thuật: save_vi chạy sạch; vì mọi khoá Pāli ở lát này ngắn hơn 40 ký tự (khoá dài nhất 39) nên tập `cần` trong _hvi.kiểm rỗng và các assertion NFC / trùng nguyên văn Pāli / Pāli lọt / số dấu lược KHÔNG tự chạy, tôi tự quét lại MỌI khoá bằng chính các hàm đó (pal, lược, lọt_pāli, ngoặc, _TỪ): đủ 15/15 khoá, đúng ID, thứ tự khoá y hệt Pāli, không rỗng, không thừa, mọi chuỗi NFC, không trùng nguyên văn Pāli (trừ 0.1 là tên bộ Kinh, đúng như tiền lệ), số dấu lược khớp Pāli từng khoá, nháy kép cân trên cả bài và khớp đúng số mở/đóng của từng khoá Pāli, không còn (…), toàn bộ chữ cái là script Latin. Đợt này cấm chạy cổng nên technical_integrity = 9.6, KHÔNG phải 10.0; bốn lệnh npm run validate | test | check | build để người điều phối chạy.
