quy theo» (đã đổi ngày 2026-10-14 thành «được Đức Thế Tôn thu nhận»); `timitimiṅgala` «cá voi nuốt cá voi nuốt» ở mục *Thuật ngữ*, mục bản dịch mù và lượt 2026-10-15, và «cá khổng lồ nuốt cá voi» của lô G4 (nay «cá nuốt cá nuốt cá khổng lồ» theo B18); «Không có bản Anh hay bản Việt độc lập khác» (đã đối chiếu Indacanda ngày 2026-10-16); «snp4.8:3.2 (đã publish) còn bực bội» (snp4.8:3.2 nay là «lo âu»); câu ở mục bản dịch mù coi «tri kiến» / «quan điểm» là chênh lệch cùng nghĩa (nay thống nhất «kiến», «kiến chấp»).
