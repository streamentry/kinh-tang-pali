notes: |-
  **Phạm vi: đủ 412/412 khoá của mnd8, không khoá nào ngoài tập khoá Pāli, cùng thứ tự Pāli.** Bài là phần Mahāniddesa chú giải kinh `snp4.8` (Pasūrasutta, Kinh Pasūra), thuộc phẩm Aṭṭhakavagga. Cấu trúc như `mnd5` và các bài Cūḷaniddesa: dẫn từng đoạn kệ (11 đoạn; kệ in đậm ở `2`, `9`, `16`, `23`, `30`, `37`, `44`, `51`, `58`, `64`, `74`), giải từng cụm, rồi nhắc lại cả đoạn kệ trong nháy kép sau câu *Vì thế, Đức Thế Tôn đã nói—* (`8`, `15`, `22`, `29`, `36`, `43`, `50`, `57`, `63`, `73`, `85`; riêng `65`–`67` mở bằng *Điều này đã được Đức Thế Tôn nói—* rồi dẫn kệ Padhāna). Pāli có 126 khoá mang thẻ in đậm, bản Việt không mang thẻ. Pāli có 23 khoá chứa dấu lược `…`: 8 khoá có `…pe…` (đều thành đúng một `…`) và 15 khoá có `…` trần (`3.4`–`3.11`, `65.3` có 19 dấu, `77.8`, `77.11`–`77.15`; mỗi khoá giữ đúng số dấu của Pāli); 0 khoá có `(…)`, 0 khoá kết `….`.

  **Tên bài.** `0.1`, `0.2`, `0.3`, `1.1`, `86.1` theo `mnd5` (*Đại Tập Kể Lược*, *Kể Lược Phẩm Tám Kệ*, *Giờ đây, sẽ nói phần Kể Lược Kinh …—*, *Kể Lược Kinh …, thứ …*); tên kinh *Kinh Pasūra* theo `snp4.8:0.2`.

  **Tầng tham khảo, đo chứ không đoán.** Sujato không có `mnd8`: thư mục `kn` của tầng Anh đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud; manifest chỉ liệt kê tệp Pāli (root-pli-ms) cho mnd1–mnd16 và tệp tên `mnd-name`. Lớp `english-project` không có `mnd8`; `vietnamese-current` chỉ có Pháp Cú. Ba tầng tham khảo vắng ⇒ blocker `noEnglishEditionUpstream`, `triangulation` 8.0, `status: draft`. Mẫu số coverage theo công thức (khoá Pāli có nội dung ≥ 40 ký tự, bỏ khối `0.x`, bỏ thẻ in đậm) là **147** khoá (160 nếu đếm cả thẻ); Sujato phủ 0/147, `english-project` 0/147, `vietnamese-current` 0/147. Entry ở `reference-gaps.yaml` chỉ thừa nhận mất tầng chứ không cứu được `published`. Bản Sujato của `snp4.8` (bài kệ mà bài này chú giải) có trong tầng đã ghim nhưng là bản của **bài khác**, nên không tính là đối chiếu English của mnd8; chứng cứ độc lập còn lại là bản Việt đã dịch của `snp4.8`, `snp3.2`, `mnd5`, `cnd11` và các đoạn công thức ở `dn1`, `dn2`, `dn30`, `mn105`, `mn108`, `mn129`, `mn133`, `ne5`, `cnd10`, `cnd12`, `cnd14`, `cnd16`, `cnd17`, `mil6.4.1`.

  **Dùng lại tiền lệ.** Đã dò Pāli (bỏ thẻ in đậm, bỏ khoảng trắng thừa) trùng nguyên dấu câu với khoá đã dịch ngoài bài này: 98 khoá có tiền lệ, dùng lại nguyên văn 82, khác 16; thêm 52 khoá chỉ khác dấu câu hoặc chữ hoa/thường (sau khi bỏ dấu câu và chữ hoa/thường), dùng lại 39, khác 13. Nguồn dùng lại, đếm theo khoá của bài này: `snp4.8` 47 khoá (các dòng kệ), công thức *Vì thế, Đức Thế Tôn đã nói—* 11 khoá (`cnd9`, `cnd10`, `cnd11` … 43 khoá cùng dạng trong tầng), `mnd5` 15 khoá (`0.1`, `0.2`, `3.4`–`3.11`, `5.3`, `77.12`–`77.15`; `3.6`–`3.11` trùng cả `an10.93`, `an10.95`, `an10.96`), `cnd11` 4 khoá (`66.1`, `67.1`, `67.2`, `68.3`), `cnd12` / `cnd14` 1 khoá (`68.2`), `cnd16` 1 khoá (`77.3`), *Vì sao vậy?* 2 khoá (`78.3`, `78.13`; 364 khoá trong `dn`, `mn` …), `…` đơn 1 khoá (`67.3`). Các khoá Pāli trùng nguyên văn mà bản Việt khác, kèm lý do:
    - `2.1`, `8.1` (và `3.13` chỉ khác chữ hoa) trùng `snp4.12:15.1`: bản kia có nháy kép lồng nháy đơn, Pāli của mnd8 không có nháy ⇒ bỏ nháy, giữ ý;
    - `9.2`, `15.2` (và `11.4`) trùng `snp4.8:2.2` *những kẻ ngu si chê bai lẫn nhau* → *từng đôi xem nhau là kẻ ngu*, vì lời giải `11.2` giải riêng `mithu` (*Từng đôi: hai người, hai kẻ gây cãi vã …*) còn bản kệ kia bỏ mất `mithu`, và `11.3` giải `dahanti` là *coi, thấy … là kẻ ngu*;
    - `9.3`, `15.3` (và `12.5`) trùng `snp4.8:2.3` *Được người khác nương tựa* → *nương vào cái khác*, vì lời giải `12.2` giải `aññasitā` là *nissitā … aññaṁ satthāraṁ …* (chính kẻ nói đã nương vào vị thầy khác); `kathojja` → *lời cãi cọ* để `medhaga` giữ chữ *tranh cãi* ở `12.3`, `33.4`;
    - `23.4` (và `27.7`, `29.4` chỉ khác nháy) trùng `snp4.8:4.4` *rên rỉ rằng: “chúng đã thắng ta”* → *kêu rên rằng kẻ ấy đã vượt qua ta*: Pāli khoá `23.4` không có nháy, `upaccagā` số ít, lời giải `27.2` là *so maṁ vādena vādaṁ accagā*;
    - `30.3`, `36.3` (và `33.13`) trùng `snp4.8:5.3` *hãy kiềm chế việc tranh cãi* → *hãy tránh xa lời cãi cọ*, theo `virame` và `33.12` *ārato … virato*;
    - `51.3`, `57.3` (và `54.3`) trùng `snp4.8:8.3` *Ngươi hãy đi tìm đối thủ đi, hỡi Sūra* → *Kẻ ấy ở hướng nào, hỡi chiến sĩ, hãy chạy đến hướng ấy*, theo lời giải `54.2` (*yeneva so diṭṭhigatiko tena palehi, tena vaja …*); `sūra` ở đây là chiến sĩ của `52.2`, khác `pasūra` ở `64.3`;
    - `51.4` (và `55.4`) trùng `snp4.8:8.4` *vì ở đây, như trước kia, không có ai để chiến đấu* → *ngay từ trước đã không còn điều gì để chiến đấu*, theo `55.2` (*pubbeva bodhiyā mūle … te natthi*); bản kia thêm *ở đây* và *ai* mà Pāli không có;
    - `58.2`, `63.2` (và `60.5`) trùng `snp4.8:9.2` *nói rằng “chỉ điều này là chân thật”* → bỏ nháy kép (Pāli không có nháy) và *khẳng định rằng* cho `vādayanti`;
    - `64.1` (và `68.4`, `73.1`) trùng `snp4.8:10.1` *sống xa lìa đám đông* → *sống sau khi đã phá tan các đạo quân*, vì `65.2`–`65.3`, `68.1` giải `senā` là đạo quân của Ma và `cnd11:7.3` dịch `Visenikatvā` là *Sau khi phá tan các đạo quân*;
    - `74.3`, `85.3` trùng `snp4.8:11.3` *Ngươi đã gặp đối thủ cân sức nơi bậc đã được gột sạch* → *Ngươi đã đi đến cuộc đối đầu từng cặp với bậc đã gột sạch*, vì lời giải `78.2`–`78.12` khẳng định Pasūra không có khả năng (`na paṭibalo`) đối đầu ngang cặp với bậc ấy; `85.4` (và `74.4`) *vì ngươi không thể đối đáp lại* → *vì ngươi không thể theo kịp* (`sampayātave`).
    Đã dò **34 nhóm Pāli trùng nguyên byte trong chính bài** (43 khoá lặp thêm): 0 nhóm có bản Việt khác. Dò thêm sau khi bỏ dấu câu và chữ hoa/thường: 65 nhóm (106 khoá lặp thêm), 0 nhóm có bản Việt khác ngoài dấu câu và chữ hoa/thường.

  **Thuật ngữ, kèm số đếm.** `vadanti kathenti bhaṇanti dīpayanti voharanti` → *nói, thuyết, tuyên bố, làm sáng tỏ, diễn đạt* (20 khoá ở `cnd11`); dạng `evaṁ …` ở `mnd5:5.10`, `16.4` là *trình bày như vậy, gọi như vậy* (2 khoá), nhưng bài này giữ một bộ cho cả bài để `4.4`, `24.1` cùng bộ với `3.2`, `12.4`, `48.2`. `vādayanti` → *khẳng định* (`snp4.8:1.1` dịch *tuyên bố*, `snp4.8:9.2` *nói rằng*; *tuyên bố* đã dành cho `bhaṇanti`). `suddhi visuddhi parisuddhi mutti vimutti parimutti` → *thanh tịnh, thanh tịnh hoàn toàn, thanh tịnh trọn vẹn, giải thoát, giải thoát hoàn toàn, giải thoát trọn vẹn* theo `mnd5:5.8`–`5.9`, `10.12`–`10.14` (5 khoá cùng Mahāniddesa); `cnd11` dùng *sự thanh lọc, sự hoàn toàn thanh sạch, sự thoát khỏi, sự hoàn toàn thoát khỏi* ở 19 khoá có `suddhiṁ visuddhiṁ … vadanti kathenti …`; chọn dạng mnd5 để `4.4`, `3.2`–`3.12`, `48.2` cùng một bộ với `4.3` dùng lại `mnd5:5.8`–`5.9`. `kalaha bhaṇḍana viggaha vivāda medhaga` → *cãi vã, tranh chấp, xung đột, tranh luận, tranh cãi* theo `mnd5:6.3`; `kalahakāraka`, `bhaṇḍanakāraka`, `bhassakāraka`, `vivādakāraka`, `adhikaraṇakāraka` → *kẻ gây cãi vã, gây tranh chấp, gây cãi nhau, gây tranh luận, gây kiện tụng* (`an5.212` dịch `bhaṇḍana` là *tranh cãi* và `kalaha` là *đấu tố*, 2 khoá). `kathojja` → *lời cãi cọ*: 0 tiền lệ. `paridevati` → *than vãn* (`snp4.8:4.3`, 1 khoá) trong khi tầng dùng *than khóc* ở 49/50 khoá (`mn129`, `mn13` …); giữ *than vãn* để lời giải `26.2`–`26.19` khớp dòng kệ. `hīnato nihīnato omakato lāmakato chatukkato parittato` → *thấp kém, hèn kém, hạ liệt, tồi tệ, đê tiện, nhỏ nhoi* (`mnd5:12.2`, `17.3`). `nissitā sannissitā allīnā upagatā ajjhositā adhimuttā` → *đã nương vào, đã nương tựa hoàn toàn, đã bám vào, đã đi đến, đã chấp chặt, đã nghiêng hẳn về* (`mnd5:17.2`; `cnd14` dùng *đã đến với* cho `upagata`, 4 khoá). `niviṭṭhā` → *đắm chìm* theo `snp4.8:1.4`. `anurodhavirodha` → *thuận ý và nghịch ý* (`mnd5:53.4`; trong tầng 11 khoá: `mn38` 4 khoá *ưa và ghét*, `sn4.14` 2 *thuận và nghị