  Rà nhất quán theo Pāli trùng 2026-10-14: khoá `79.2` — «chưa biết, chưa thấy, chưa rõ, chưa chứng ngộ, chưa chạm đến bằng tuệ» → «chưa được biết, chưa được thấy, chưa được hiểu, chưa được chứng ngộ, chưa được chạm đến bằng tuệ» (công thức của mnd14, ps3.1); `82.5` — «Trí của Đức Phật lan tỏa khắp, vượt trội … mà đứng vững» → «Sau khi trùm khắp và vượt trội tuệ của chư thiên và loài người, trí của Đức Phật vẫn đứng vững.» (giữ hai tuyệt đối từ `pharitvā abhibhavitvā`); `83.3` — «quy theo» → «được Đức Thế Tôn thu nhận» (`upakkhittakā`, 3 nơi cùng cách). Giữ «tuệ» cho `paññā` thay vì «trí tuệ» của bản đa số, vì cả bài mnd8 dùng «tuệ» cho `paññā` và «trí» cho `ñāṇa`.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 181 khoá chênh lệch lớn nhất (trong 412 khoá; 19 khoá bản mù ghi không chắc) → khác nghĩa 7: sửa 0, giữ 4, bất định 3. Giữ: (1) 33.6–33.10 `kalahaṁ … medhagaṁ na kareyya` (bản mù đảo `viggaha` thành «tranh cãi» và `medhaga` thành «xung đột»; bản dự án dùng đúng bộ năm chữ cãi vã / tranh chấp / xung đột / tranh luận / tranh cãi như ở 12.3, 31.3, 33.4 và các khoá trùng ở `mnd9`, `mnd11`, `mnd12`, nên giữ); (2) 2.3, 5.1, 5.5, 8.3 `Yaṁ nissitā tattha subhaṁ vadānā` (bản mù «nương vào điều nào, ở đó họ nói là tốt đẹp» sát chữ hơn, còn bản dự án «trong giáo pháp mình nương tựa» gộp `yaṁ` và `tattha`; lời giải 5.2–5.3 liệt kê thầy, lời giảng, hội chúng, kiến, đường lối, con đường, nên «giáo pháp» là cách gọi gộp, không sai nghĩa, và khoá trùng `snp4.8:1.3` cùng cách dịch, giữ cho nhất quán); (3) 82.1 `timitimiṅgalaṁ` (bản mù giữ phiên âm; bản dự án «cá voi nuốt cá voi nuốt» dùng lại `mnd14:64.1`, `mnd16:30.1`, tương ứng cách dịch `timirapiṅgala` ở `an8.20`, nên có thể lệch một bậc so với `timi`/`timiṅgala`, đã ghi để người biên tập cân nhắc cả tầng); (4) 44.1–45.5, 50.1 `vighātabhūmi` «nền tảng sa đọa» (bản mù «nền tảng tổn hại»; lời giải 45.4 liệt kê sáu chữ đồng nghĩa nên «sa đọa» lệch nhẹ so với «tổn hại/phiền nhiễu» là cách dịch `vighāta` ở 6 khoá khác trong tầng, nhưng không đổi giáo nghĩa và trùng `snp4.8:7.1`, giữ). Bất định: (a) 26.4 `samaggāya parisāya hetu kathāsallāpo puna bhañjissāmi` (bản dự án «vì hội chúng hòa hợp, ta sẽ lại phá vỡ cuộc luận bàn», bản mù hiểu là điều kiện «nếu hội chúng hòa hợp thì…»; đặt sau 26.3 «hội chúng này chia phe, không hòa hợp» thì cách đọc điều kiện hợp mạch hơn, nhưng Pāli không có `sace`, nên giữ và ghi bất định như ở các đoạn trên); (b) 58.3–58.4, 61.1, 61.7, 63.3–63.4 `na hi tedha atthi` (bản dự án «ở đây ngươi không có ai», đọc `te` là sở hữu cách của `tvaṁ`; bản mù «họ không có ở đây», đọc `te` là các đối thủ, gần với lời giải 61.5 «te natthi»; hai cách đọc đều hợp ngữ pháp, giữ nguyên theo `snp4.8:9.3` và bất định (8) ở các đoạn trên); (c) 74.4, 77.1, 78.1, 83.5, 85.4 `sampayātave` (bản dự án «theo kịp», bản mù «đối chọi nổi»; lời giải 78.2 nói Pasūra không đủ sức đối đầu và đàm luận với bậc Giác Ngộ nên nghĩa «đối chọi» gần hơn một chút, nhưng cả hai đều hợp ngữ cảnh và `snp4.8:11.4` dùng «đối đáp lại»; giữ). Các chênh lệch còn lại chỉ là diễn đạt hoặc thuật ngữ cùng nghĩa («tri kiến» / «quan điểm», «phấn khích» / «hứng khởi», «chiến sĩ» / «dũng sĩ», «ngươi» / «ông», nhan đề phẩm, các khoá lặp giữa phần dẫn kệ và phần nhắc lại kệ). Đọc lại toàn bài (412 khoá): tập khoá và thứ tự khớp Pāli, nháy kép khớp Pāli từng khoá, dấu lược `…pe…` thành đúng một `…`, danh sách thuật ngữ đối thủ / thế đấu (khuất phục, đối phó, vượt trội, vượt lại, quấn trói, gỡ thoát, cắt đứt, vây vòng) nhất quán ở 18.4, 19.6, 25.6, 61.2, 75.4, số lượng trong các danh sách (62 kiến, 13 loại thiện xảo, 15 loại lợi ích) không đổi. Không có bản Anh hay bản Việt độc lập khác.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt toàn bài 412 khoá, đoạn song song `snp4.8`, `dn1`, `dn2`, `dn29`, `mn77`, `ps3.1`, `mnd16`, `cnd11`, `cnd19`; không có bản Việt nguyên bài): sửa 0 khoá. Đã kiểm lại bằng Pāli: công thức tranh luận `59.2` (*āropito te vādo*, *adhiciṇṇaṁ te viparāvattaṁ*) trùng chữ với `dn1:1.18.2`, `dn2:53.2`, `mnd9:58.3` và hợp `dn29:1.5`, `mn77:6.31`; chuỗi 78.15 (`anunetā` → *người hòa giải*) trùng `ps3.1:24.1`, `mnd16:8.1`, `mnd16:26.2`; 71.2 và 78.5 đủ 7/7 và 6/6 từ; `kāmā te paṭhamā senā` (`67.1`) cùng cách dịch ở `snp3.2:12.1`, `cnd11:11.1`, `mnd4:49.1`, `mnd13:142.1`. Giữ có chủ ý: `78.14`–`78.15` *trí tuệ* cho `-pañño` (theo `ps3.1`, `mnd16`) dù 77.2 dùng *tuệ* cho `paññā`; `77.11` *Thánh đạo tám ngành* (207 khoá dùng *tám ngành*, 108 khoá *tám chi phần*; cả hai đều có tiền lệ); `65.3` *ác hạnh về lời* (42 khoá) khác `mnd7:46.6` *ác hạnh về khẩu* (6 khoá). Bất định thêm (không sửa, thuộc quyết định chung): `67.1` bỏ `te` (*của ngươi*, Ma) trong *Kāmā te paṭhamā senā*, cùng lệch ở 5 bài trùng; `78.5` `aggo` → *cao nhất* trong khi `mnd7:71.3` `aggaṁ` → *tối thượng*; `26.4` điều kiện hay nhân (đã ghi); `82.1` *cá voi nuốt cá voi nuốt* theo `mnd14`, `mnd16`.

