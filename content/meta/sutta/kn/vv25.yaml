notes: |-
  Dịch trực tiếp từ Pāli root; không có tầng Anh đã ghim cho vv, xem `blocking_errors`.
  BA MỆNH ĐỀ ĐANG TÁCH ĐÔI — đo cục bộ trong tầng `vv` (40 tệp, 1.177 segment): ngôi kể `tôi` 137 vs `ta` 23 ⇒ `tôi`; `mahānubhāva` `đại oai lực` 18 vs `uy thế lớn lao` 12 ⇒ `đại oai lực`; `sabbadisā` dạng `te` `muôn phương` 13 vs `mọi phương` 7 vs `bốn phương` 5 ⇒ `muôn phương` (đúng vv1+vv4), dạng `me` `mọi phương` 18 vs `muôn phương` 10 ⇒ `mọi phương`. Bài này dùng đúng hai cách ấy: `2.3` (ngôi hai) → `muôn phương`, `10.3` (ngôi một) → `mọi phương`.
  TIỀN LỆ: `Vimānavatthu` 39/40 giữ Pāli; `Itthivimāna` → `Chuyện Cung Điện Nữ Hư Không` 16 lần; `Cittalatāvagga` → `Phẩm Cây Hoa Cittalatā` 3/3; mẫu `8. Chuyện Cung Điện Nữ X` và `…, thứ tám.` theo vv36:0.4/9.1. Dùng lại nguyên văn tiền lệ cho: `“Abhikkantena vaṇṇena` (7 lần), `yā tvaṁ tiṭṭhasi devate;` (6 lần), `Obhāsentī disā sabbā` (6 lần), `osadhī viya tārakā` (7 lần), `Kena tetādiso vaṇṇo,` (10 lần), `Sā devatā attamanā,` (12 lần), `yassa kammassidaṁ phalaṁ.` (20 lần), `yā ca pakkhassa aṭṭhamī;`, `Pāṭihāriyapakkhañca`, `aṭṭhaṅgasusamāgataṁ`, `Saddhā sīlena sampannā`, `Pañcasikkhāpade ratā`, `ariyasaccāna kovidā`, `Upāsikā cakkhumato`, `gotamassa yasassino`, `Tena metādiso vaṇṇo,` (20 lần), `vaṇṇo ca me sabbadisā pabhāsatī”ti.` (`và sắc tướng tôi chiếu sáng khắp mọi phương`).
  BẤT ĐỊNH 1 — `Niddāti mamaṁ aññaṁsu` (4.1): nghĩa là các nữ thiên khác gọi ta là `Niddā`; giữ tên `Niddā` (0 tiền lệ trong kho, không có bản Anh đã ghim, không dịch nghĩa).
  BẤT ĐỊNH 2 — `Uposathaṁ upavasissaṁ` (7.1): dịch `Luôn giữ ngày trai giới`; `trai giới` đã có 25 lần trong kho cho `uposatha`, còn chữ `Uposatha` viết hoa thì xuất hiện 19 lần (giữ dạng Pāli ở chỗ dẫn tục).
  BẤT ĐỊNH 3 — `Theyyā ca aticārā ca, / majjapānā ca ārakā` (8.3–8.4): `ārakā` là dạng phủ định của `araka`; dịch `cũng không trộm cắp, không làm quá đà; / cũng không rượu chè say sưa.` Không thêm `tà dâm` cho `aticārā` vì Pāli chỉ nói `quá đà`.
  BẤT ĐỊNH 4 — `Saññamā saṁvibhāgā ca` (7.3): cặp khuôn `sát sinh và bố thí`; dịch `cả việc sát sinh lẫn sự chia phần` theo nghĩa chính, không theo nghĩa tế lễ của truyền thống.
  SỐ KHOÁ TRÙNG PĀLI: 8/42 khoá trùng nguyên văn với vv46 và với tha-ap trong lát; toàn lát dùng lại 61 cặp, 0 lệch.
  Kiểm toán độc lập 2026-10-11 (đọc đối kháng từng cặp Pāli↔Việt, đối chiếu họ `vv`). Mục này THAY THẾ các mục cũ ở trên khi chúng mâu thuẫn: BẤT ĐỊNH 3 và BẤT ĐỊNH 4 bị thay hoàn toàn; tiền lệ `ta`/`thiên nữ khác`/`dạng` ở 4.1–4.2 bị bác bỏ.
  KẾT LUẬN: bản trước chấm 9.25 là quá cao. Đổi 24/42 khoá; 9 khoá sai nghĩa thật trong thân kệ (≈ 21%), 15 khoá lỗi nhẹ hoặc thêm nghĩa.
  Khoá sai nghĩa thật, đã sửa:
  · `7.3` `saññamā saṁvibhāgā ca`: `saññamā` là *sự tự chế* (thể xuất xứ/nguyên nhân), KHÔNG phải *sát sinh*; bản trước *cả việc sát sinh lẫn sự chia phần* đảo ngược nghĩa (nữ cư sĩ đang kể công đức giữ giới) và BẤT ĐỊNH 4 cũ dựa trên đó là sai. Nay *nhờ tự chế và chia sẻ*, khớp công thức đã kiểm toán `vv15:5.3`, `vv23`, `vv24`.
  · `4.1` `Niddāti mamaṁ aññaṁsu`: bản trước *Các thiên nữ khác gọi ta là Niddā* thêm chủ thể *thiên nữ khác* (Pāli không nêu, và người nói là nữ thiên từng là nữ cư sĩ ở nhân gian) và xưng *ta* (nữ thiên xưng *tôi*). Nay *Người ta biết đến tôi là Niddā*, như `vv23:4.1`, `vv24:4.1`, `vv26:4.1`.
  · `4.2` `Rājagahasmiṁ upāsikā`: bản trước *dạng nữ cư sĩ ở Rājagaha* thêm *dạng* (không có trong Pāli, dễ hiểu thành hình thể thiên); nay *một nữ cư sĩ ở Rājagaha*.
  · `5.2` `senāsanaṁ padīpiyaṁ`: bản trước *chỗ ngủ và thức uống* — `padīpiya` là *đèn đuốc/vật thắp sáng*, không phải thức uống; nay *chỗ ở và đèn sáng* (như `vv23:5.2`).
  · `6.3` `Pāṭihāriyapakkhañca`: `pakkha` là *nửa tháng*, không phải *tuần lễ*; bản trước *cùng cả tuần lễ thần biến*, nay *cùng cả kỳ nửa tháng thần biến* (như `vv15`, `vv31`). Bản Sujato của `an3.37` (cùng công thức) dịch là *fortnightly special displays*; chữ *thần biến* cho `pāṭihāriya` giữ theo tiền lệ dự án nhưng vẫn chưa chắc (xem Bất định).
  · `7.4` `vimānaṁ āvasāmahaṁ`: `āvasāmi` là *ở, cư ngụ*; bản trước *được thừa hưởng* đổi động từ thành sở hữu/hưởng lợi; nay *tôi cư ngụ trong cung điện* (bỏ *này* vì Pāli không có chỉ định).
  · `8.1` `Pāṇātipātā viratā`: *Từ bỏ sát người* thu hẹp `pāṇa` (sinh mạng) thành *người*; nay *Tránh xa sát sinh*.
  · `3.3` `yassa kammassidaṁ phalaṁ`: mệnh đề quan hệ nối với động từ ẩn sau `…pe…` (*pañhaṁ puṭṭhā viyākāsi*): nữ thiên giải đáp *về nghiệp mà đây là quả báo*. Bản trước *quả báo của nghiệp này là thế* biến thành câu khẳng định độc lập, đổi `yassa` (quan hệ) thành chỉ định; theo `vv15:4.4`, `vv26:3.3`.
  · `8.4` `majjapānā ca ārakā`: `ārakā` là *xa lánh*; bản trước *cũng không rượu chè say sưa* bỏ nghĩa *xa* và thêm *say sưa* (không có trong Pāli); nay *và xa lánh việc uống rượu*.
  Khoá lỗi nhẹ / thêm nghĩa, đã sửa:
  · `1.1` bỏ *rạng rỡ* (`abhikkanta` = *thù thắng*, không thêm nghĩa ánh sáng); `1.4` bỏ *rực rỡ* (từ `obhāsentī` ở `1.3`, không có ở `1.4`); `1.2` bỏ *nơi đây* (Pāli không có chỉ nơi chốn).
  · `2.3`/`10.3`: cặp hỏi–đáp lặp đúng `vaṇṇo ca te/me sabbadisā pabhāsati` nên phải cùng một cách dịch: nay cả hai là *dung sắc … chiếu sáng khắp mọi phương* (bản trước một bên *dung sắc … muôn phương*, một bên *sắc tướng … mọi phương*, lệch `vaṇṇo` giữa `2.1`/`10.1` và `10.3`); `2.3` bỏ dấu chấm thừa sau `?”`.
  · `4.4` `saṁvibhāgaratā`: *sẵn lòng* → *hoan hỷ trong việc* (`ratā` = vui thích, cùng từ ở `9.1`); *chia phần* → *chia sẻ* cho đồng bộ với `7.3`.
  · `5.3` `ujubhūtesu`: *chân thành* → *ngay thẳng* (`uju` = thẳng); *trao* → *dâng* (đối với các vị tỳ-kheo).
  · `5.4` bỏ *thanh tịnh* (`vippasanna` = *trong sáng*; không có chữ thứ hai trong Pāli).
  · `7.1`/`7.2`: *Luôn* dời đúng chỗ — `sadā` chỉ có ở `7.2` (`sadā sīlesu saṁvutā`), không ở `7.1`; bỏ *giới hạnh giữ mình trong sạch* (*trong sạch* không có trong Pāli); `upavasissaṁ` kể quá khứ nên *Tôi đã giữ ngày trai giới*.
  · `8.3` `aticārā`: *không làm quá đà* là chữ gượng, mơ hồ; nay *không tà hạnh* (bối cảnh năm giới ở `9.1`), theo `vv23`/`vv24`.
  · `9.1` bỏ *Luôn gìn giữ* (`ratā` = hoan hỷ trong; `sadā` không có ở đây); `9.2` bỏ *nhiệm mầu* (`kovidā` = thông tỏ); `9.3` `upāsikā` = *nữ cư sĩ* (bản trước *đệ tử cư sĩ* mất giới tính và lệch `4.2`), `cakkhumato` bỏ *Tuệ* thêm vào (*Bậc Có Mắt*); `9.4` bỏ *thơm* (*lẫy lừng danh thơm* → *danh tiếng*, theo `yasassino`).
  Lỗi còn lại, KHÔNG sửa riêng (lan cả họ, cần người biên tập quyết chung):
  · `0.2` `Itthivimāna` dịch *Nữ Hư Không*: Pāli không có `ākāsa`; nghĩa đúng là *cung điện của các nữ thiên*. `0.3` `Cittalatāvagga` dịch *Phẩm Cây Hoa Cittalatā*: `Cittalatā` là tên khu rừng/ngự uyển, *Cây Hoa* không có căn cứ. Giữ để khỏi lệch cả bộ.
  Bất định còn lại: (a) `pāṭihāriyapakkha` — *kỳ nửa tháng thần biến* là cách hiểu theo tiền lệ dự án; Sujato `an3.37` *fortnightly special displays*, chưa có căn cứ tầng tham khảo để phân xử chữ *thần biến*; (b) `aticārā` — *tà hạnh* là cách hiểu theo bối cảnh năm giới, Pāli chỉ nói *vượt phạm*; (c) `ujubhūta` — *ngay thẳng* so với *chân thành*, chọn nghĩa đen; (d) `osadhī-tārakā` = *sao mai* là cách hiểu truyền thống, không kiểm được.
  Chấm lại: semantic_fidelity 9.3 → 8.8, grammar_logic 9.3 → 9.1, terminology 9.3 → 8.6 (hai tiêu đề phẩm còn lỗi họ, *thần biến*), vietnamese_clarity 9.4 → 9.2, ambiguity_integrity 9.2 → 8.9; các điểm khác giữ. final_score 9.25 → 9.06.
  Cổng kỹ thuật chưa chạy trong lượt này: `npm run validate`, `npm test`, `npm run check`, `npm run build` — `technical_integrity` giữ 9.6.
