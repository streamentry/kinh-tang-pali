notes: |-
  Đã đọc HẾT `vc/p75.txt` trước khi viết; bài này ghi ngay sau khi dịch xong, không dồn
  cuối.

  MỆNH ĐỀ ĐO LẠI:
  · `:0.1` `Theragāthā 9.1` ⇒ giữ số (xem `thag10.3`).
  · `:0.2` `Navakanipāta` ⇒ **Bộ Chín Bài Kinh**. Đây là chỗ **phải phán**, nên ghi rõ:
    trong CHÍNH `thag` chưa bài nào mang `Navakanipāta` (0 tiền lệ cục bộ). Ngoài `thag` có
    8 lần *Bộ Chín Bài Kệ* — tất cả ở `ja429/430/431/433/434/435/436/437`, tức `Jātaka`, một
    tác phẩm khác — và 1 lần *Bộ Chín Bài Kính* ở `thig9.1:0.2`, trong đó **chữ *Kính* là lỗi
    chính tả** (kính = nhọn/sắc; kinh = kinh). Chọn *Bộ Chín Bài Kinh* vì ba lý do đo được:
    (1) tầng `name/` của chính SuttaCentral cho `thag-name:263` = *The Book of the Nines* — y
    hệt mọi `-nipaata` khác, mà hai cái đã chốt trong `BRIEF_VI3` §11 (`Ekakanipāta`, `Dukanipāta`)
    đều là *Bộ … Bài Kinh*; (2) trong chính `thag`, `Dasakanipāta` = *Bộ Mười Bài Kinh* 4/4 và
    5/8 nhóm `-nipaata` theo hình *Bộ <số> Bài Kinh*; (3) `thig9.1:9.6` đã dùng *Bộ Chín Bài Kính*
    cho đúng Pāli `Navakanipāto niṭṭhito.` ⇒ giữ nguyên hình đó chỉ sửa một chữ.
    **CÒN VIỆC CỦA NGƯỜI ĐIỀU PHỐI:** `thig9.1:0.2` và `thig9.1:11.1` (ngoài lát này) vẫn
    mang lỗi *Kính*; nên sửa cả hai cùng lúc để `thig` và `thag` khớp nhau.
  · `:0.3` `Paṭhamavagga` ⇒ **Phẩm Thứ Nhất** (99 lần).
  · `:0.4` `Bhūtattheragāthā` ⇒ **Kinh Kệ Của Trưởng Lão Bhūta**.

  CÔNG THỨC LẶP — ĐÃ DỊCH MỘT LẦN, DÙNG LẠI Y NGUYÊN VĂN:
  `Tato ratiṁ paramataraṁ na vindati.` xuất hiện **8 lần** (`1.4`, `2.4`, `3.4`, `4.4`, `5.4`,
  `6.4`, `7.4`, `8.4`) và `9.4` là `…vindatī”ti.`. Tất cả chín lần đều dịch giống nhau:
  `từ đó, không còn niềm vui nào cao hơn thế.` — nếu để mỗi câu một cách, bài sẽ tự mâu thuẫn ở
  chín khoá liền nhau. `Tato` = *từ đó*, `paramataraṁ` = *cao hơn*, và `na vindati` là **phủ
  định**: *không có gì cao hơn*, không phải *tìm được điều lạc lớn hơn*.
  `Bhikkhū ca pabbhāragatova jhāyati,` (`:5.3` và `:7.3`) cũng trùng nguyên văn, dùng lại y nguyên văn.

  DÒNG BÌVA `:9.5` `… Bhūto thero … ` ⇒ `… Trưởng lão Bhūta …` (hai dấu lược, giữ nguyên;
  khác hình `….` của `thag10.2:10.5` vì Pāli ở đây không có dấu chấm nối). `:9.6`
  `Navakanipāto niṭṭhito.` ⇒ `Bộ Chín Bài Kinh đã khép lại.`
  `:10.0` `Tatruddānaṁ` ⇒ **Tóm tắt ở đây:** — 5 lần, cả 5 đều trong `thag`
  (`thag1.120`, `thag5.12`, `thag6.14`, `thag7.5`, `thag8.3`) ⇒ y nguyên văn. (Riêng
  `Tassuddānaṁ` của Liên tục là *Tóm lược:* 319 lần — đây là hai từ Pāli khác nhau, không lẫn.)

  BẤT ĐỊNH ĐÃ PHÂN XỬ:
  · `2.1`–`2.2` `dukkhassāvahani` / `papañcasaṅghātadukhādhivāhini` là hai tính từ bổ nghĩa cho
    `Taṇhaṁ` ở `2.3` (`tham`), theo Sujato (*clinging, the carrier of suffering … and craving,
    the carrier of this painful mass*). Tôi dịch `Khi tham, kẻ gánh chịu khổ ấy, bị lay chuyển, /
    kẻ làm lay cả đám khổ ưu não vơ vãn,` để tân ngữ ở `2.3` (*được từ bỏ*) có chủ thể.
  · `4.1` `virajaṁ` / `asaṅkhataṁ` — dịch **không nhiễm** và **bất tân**. Đây là chỗ đáng lưu ý:
    tiền lệ trong tầng nghiêng về *vô vi* (`asaṅkhata` 5 lần: `idaṁ vuccati … asaṅkhataṁ`),
    nhưng ở đây `asaṅkhataṁ` là **tính từ** đứng cạnh `asokaṁ` và `virajaṁ` trong cụm
    `santaṁ padaṁ …` (bước chân an tịnh), và Sujato dịch *unconditioned* chứ không dịch
    *unchanging*. Giữ *bất tân* (nghĩa đen, không sanh diệt). **Người biên tập quyết cuối nếu
    muốn theo *vô vi*.**
  · `8.3` `vītakhila` — `khila` là *bụi chân, tuyệt vọng, mất hồn*; dịch *tuyệt vọng*. Sujato dịch
    *heartlessness*, vốn là nghĩa của `khila` ở nghĩa thứ hai nhưng bỏ mất cảm giác uể oải.
  · `8.2` `Nagantare nagavivaraṁ samassito` = *ở chốn núi, chỗ trú trong khe núi* (chỗ trú vắng
    giữa núi). Sujato: *between the mountains, sheltered inside a cleft* — khớp.
  · `10.2` `eko khaggavisāṇavā` — thói khổ hạnh một mình; `tathaddaso` (`:10.1`) là tên gọi
    kiểu *Tathaddasa* (vị trưởng lão ấy), dịch *nọ kia* cho đúng thể uddāna.

  DẤU LƯỢC: bài **không có** `…pe…`; hai dấu lược ở dòng bìa `:9.5` khớp Pāli.

  COVERAGE: như `thag10.3` — không khoá Pāli nào đạt 40 ký tự nên mẫu số bằng không, xếp loại
  *no substantive segment*. Sujato có tiếng ở 40/47 khoá, trống ở `:9.5` (dòng bìa) và toàn bộ
  khối uddāna `:10.*` ⇒ độ phủ thô **85,1%** (40/47), để người biên tập tự phán. Tầng
  `vietnamese-current` không có cho bài này.

  `triangulation` đặt 8,6 vì lý do đã nêu ở `thag10.3` (Sujato lệch căn hàng câu trong `thag`).
