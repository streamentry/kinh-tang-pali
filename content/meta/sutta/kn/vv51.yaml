notes: |-
  Bản dịch tiếng Việt mới cho bài kinh vv51.

  Chuyện chú ếch lắng nghe tiếng Đức Phật thuyết pháp, bị người chăn bê giết và sinh thiên với đại danh tiếng.

  Đối chiếu Pāli root (không có tầng tham khảo tiếng Anh upstream).

  Kiểm toán độc lập 2026-10-11

  Đọc đối kháng 21 khoá Pāli↔Việt, đo tiền lệ trên tầng kn. Không có lỗi hô cách, ngôi nói (Đức Phật xưng "ta", thiên tử ếch xưng "con") hay số lượng. Đã sửa 12/21 khoá, chủ yếu là thuật ngữ lệch tiền lệ và vài chỗ thêm nghĩa nhẹ:
  - 2.4: `avadhī` "đánh chết" → "đã giết" (động từ không nêu cách giết; tiền lệ vv21:4.1, vv47:6.1, ja542:31.3 đều "giết"); `vacchapālaka` "người chăn nghé" → "người chăn bê" (`vaccha` trên tầng là "bê", nghé là con trâu). Semantic_fidelity 9.3 → 9.2.
  - 2.3, 4.2: `dhammaṁ` "Chánh pháp" → "Pháp" (`dhamma` là "Pháp" ở vv33:49.3, 104.1, vv53:10.3, 20.3, 23.4; "Chánh pháp" là của `saddhamma`); bỏ "chăm chú" (không có trong Pāli) và "được lắng nghe" (thể bị động sai; `assosuṁ` là "đã nghe").
  - 1.3: "sắc tướng tuyệt vời" → "dung sắc rạng rỡ thù thắng" (cùng Pāli `Abhikkantena vaṇṇena`, 31/37 khoá trùng dùng đúng cách này).
  - 1.2, 3.2: `yasa` "uy danh" → "danh tiếng" (7 nơi "danh tiếng", 1 nơi "uy danh").
  - 2.2: `vārigocaro` "kiếm ăn nơi vùng sông nước" → "thường qua lại nơi sông nước" (bỏ nghĩa "kiếm ăn" thêm vào; tiền lệ tha-ap490:2.2 "sống dưới nước").
  - 3.1: "phát khởi tâm tịnh tín" → "Nhờ tâm tịnh tín chỉ trong giây lát" (`cittapasādassa` là sở hữu cách chỉ nguyên nhân; bỏ động từ "phát khởi" không có trong Pāli). Ambiguity_integrity 9.2 → 9.0.
  - 4.3: `Pattā` thêm "đã" (quá khứ phân từ).
  - 0.3 "Đại Xa Phẩm" → "Phẩm Cỗ Xe Lớn" (11/13 khoá cùng Pāli trên tầng); 0.4 và 5.1: bổ sung `devaputta` = "Thiên Tử" (trước đó "chàng" làm mất từ này); `translationTitle` đổi khớp.
  Bất định còn lại: (a) `cittapasādassa` ở 3.1 là sở hữu cách, đọc là "quả của tâm tịnh tín chốc lát" hay chỉ nguyên nhân thì nghĩa thực chất như nhau, nhưng cách đọc cú pháp chưa phân xử độc lập; (b) `vārigocaro` và `vacchapālaka` đọc theo nghĩa từ vựng, chưa đối chiếu chú giải. Tiêu đề 0.2 "Thiên Cung Của Nam Giới" là cách dịch gần Pāli hơn "Nam Hư Không" ở 26 tệp khác trong bộ, nhưng lệch số đông; không sửa riêng một tệp. Thuật ngữ `vimāna` ở đây là "Thiên Cung", trong khi đa số vv dùng "Cung Điện"; giữ nguyên vì cả hai đều đúng nghĩa. Không có tầng tham khảo tiếng Anh upstream nên triangulation vẫn 7.5. Technical_integrity giữ 9.6; các lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
