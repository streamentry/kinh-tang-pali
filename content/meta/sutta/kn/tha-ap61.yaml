  **TÊN PHẨM — đa số đo được, không đoán.** `:0.1` `Therāpadāna` giữ Pāli: **327/336**
  tệp `tha-ap` đã dịch (9 tệp dùng *Trưởng Lão Ký Sự*; 67 tệp chưa có khoá này).
