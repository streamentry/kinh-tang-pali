  bản Việt đang có: *Phẩm Cái Quạt* (`tha-ap55`, **sai nghĩa** — `bīja` là hạt/giống),
  *Phẩm Bījanivagga* (`tha-ap56`), *Phẩm Hạt Giống* (`tha-ap57`, `tha-ap60`).
  Đa số trong số đó dùng nghĩa đúng là **Phẩm Hạt Giống** (2) — tôi theo đa số này và
  **không** nhân bản lỗi của `tha-ap55`. `:0.3`/`:13.1` `…sāpadānaṁ…` → tiền tố đa số
  **154/336** là *Bài Kệ Tuyên Ngợ Về Trưởng Lão* (63 *Tuyên Ngôn*, 84 *Ký sự/Ký Sự*,
