  **BẤT ĐỊNH ĐÃ GHI, KHÔNG GIẤU.**
  · `Padumuttaramunissa;` (`:2.3`) — **0 tiền lệ cho đúng câu này**. Đọc là
    `Padumuttara` + `muni` + `ssa` (bậc Mâu-ni Padumuttara, tân ngữ của câu bị động
    `pahaṭṭho ukkhipimambare`), nên tôi dịch *Bậc Mâu-ni Padumuttara đã* và để `:2.4` mang
    động từ *ném lên giữa tầng trời*. `muni` có tiền lệ: *bậc Mâu-ni* (`tha-ap201:2.2`),
    *Đấng Mâu-ni* (`tha-ap167:1.3`), *bậc ẩn sĩ* (3), *Muni*, *bậc hiền giả* — tôi theo *bậc
    Mâu-ni* vì ở đây `muni` chỉ Đức Phật, không phải ẩn sĩ.
  · `Sadhajaṁ padumaṁ gayha,` (`:2.1`) — `sadhaja` = *tự sinh*; **bản nháp đầu của tôi đã
    thêm "ở nơi ấy"** — một cụm không có trong Pāli, đã gỡ. Giờ dịch *Ta cầm lấy nhành sen
    tự sinh,*. `sadhaja` 0 tiền lệ trong tầng.
  · `aḍḍhakose ṭhito ahaṁ;` (`:2.2`) — **0 tiền lệ**. `aḍḍhakosa` là **đơn vị đo** (nửa
    *dặm*), không phải "nửa bước chân" như một bản nháp dễ dịch; tôi dịch *đứng cách nửa
    dặm;*. Nếu coordinator đọc khác thì đây là chỗ phải sửa.
  · `Catusaccaṁ pakāsento,` (`:1.1`) — cùng công thức có **4** cách đã dịch và **không có
    đa số**: *bốn sự thật* (`tha-ap251:1.3`), *Bốn Thánh Đế* (`tha-ap353:2.1`), *bốn chân lý*
    (`tha-ap520:2.1`), *bốn Chân Lý Thánh* (`tha-ap64:1.3`). Tôi dịch *Tỏ ra bốn sự thật*.
  · `Tiṁsakappāni devindo,` (`:6.1`) — `Tiṁsakappāni` là danh xưng của Inda (*ba mươi kỳ*),
    `devindo` = *chúa tể các vua trời*; gộp thành *Ngài là chúa tể của ba mươi kỳ,*. 0 tiền lệ.
  · `vasudhaṁ āvasissati` (`:6.4`) — `āvasissati` (tương lai của `āvasā`, *cư ngụ*) + tân ngữ
    `vasudhaṁ`; tôi dịch *rồi sẽ cư ngụ nơi quần đất này.* 0 tiền lệ cho `āvasissati`.
  · `rajjaṁ sattasataṁ` (`:6.3`) — sandhi `rajja-satta-sataṁ` = **bảy trăm** năm trị vị;
    `vasudhaṁ` giữ làm tân ngữ câu sau, nên tôi dịch *làm vua trên mặt đất bảy trăm năm, /
    rồi sẽ cư ngụ nơi quần đất này.*
  · `nibbāyissatināsavo’.` (`:9.4`) — `nibbāyissati` (*sẽ đi vào Niết-bàn*) + `anāsavo` (*vô
    lậu*); tôi dịch *sẽ vô lậu mà đi vào Niết-bàn’.* `vô lậu` có tiền lệ (68 lần / 27 tệp),
    cạnh tranh với *không lậu hoặc* (107 lần / 68 tệp) — tôi chọn *vô lậu* vì gọn và đúng sắc thái
    Hán–Việt quen thuộc, đã ghi ra đây.
  · `Nikkhamitvāna kucchimhā,` (`:10.1`) — `kucchi` là bụng mẹ; bản nháp đầu của tôi dịch
    *bụng bà* (sai — đây là người mẹ), đã sửa thành *Sau khi ra khỏi bụng mẹ,*.
  · `:3.1` `Āgacchante ca padume,` — bản nháp đầu dịch *đến nơi* (vô nghĩa), đã sửa thành
    *Khi các nhành sen kia đến gần,*. `:2.4` cũng đã bỏ dạng từ "nó" không có trong Pāli.
  · `:10.3` `Jātiyā pañcavassohaṁ,` — bản nháp đầu dịch *từ ngày mới sinh ra năm năm* (cụt),
    đã sửa thành *khi đã sinh ra được năm năm,*.

