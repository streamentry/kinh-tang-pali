notes: |-
  Đợt 19, làn 82. Dịch từ Pāli root commit đã ghim, đủ 118/118 khoá (117 khoá mới; khoá kết `30.1` đã có sẵn từ lần trước, giữ nguyên sau khi kiểm lại: `tevīsatimo` = ti 3 + vīsati 20 = 23, khớp thứ tự phẩm, bv3 = thứ nhất nên bv25 = thứ hai mươi ba), thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bài là phẩm thứ hai mươi ba của Buddhavaṃsa, về Đức Phật Koṇāgamana: ba lần chứng ngộ Pháp (ba mươi ngàn koṭi, hai mươi ngàn koṭi, mười ngàn koṭi), hai kỳ hội chúng, tiền thân là vị Sát-đế-lợi Pabbata cúng dường và được thọ ký, gia thế, xuất gia, chuyển bánh xe, các đệ tử và thị giả, thân lượng, tuổi thọ, nhập Niết-bàn và xá lợi. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.** `0.1` Buddhavaṁsa → “Dòng Kế Thừa Các Đức Phật”: dùng lại nguyên văn `bv20`, `bv24`, `bv27` (và `bv16`, `bv17`, `bv18`; 6/6 tiền lệ). `0.2` “25. Dòng Kế Thừa Của Đức Phật Koṇāgamana”: cùng khuôn với `bv20:0.2`, `bv24:0.2`, `bv27:0.2`. `30.1` giữ “Dòng kế thừa của Đức Thế Tôn Koṇāgamana là thứ hai mươi ba.”

  **Số Pāli, đã tự tính.** `tiṁsakoṭisahassa` = 30 × 1.000 koṭi = **ba mươi ngàn koṭi** (3.3); `vīsatikoṭisahassa` = 20 × 1.000 koṭi = **hai mươi ngàn koṭi** (4.3); `dasakoṭisahassa` = 10 × 1.000 koṭi = **mười ngàn koṭi** (6.3). Cả ba là `koṭisahassa`, không phải cụm `Tiṁsakappasahassa` còn bỏ ngỏ, và ở đây không có chữ `kappa`. Thang lớn nhân cả số tích lũy: “ba mươi ngàn” = 30.000, không phải 1.030. `tiṁsabhikkhusahassa` = 30 × 1.000 = **ba mươi ngàn tỳ-kheo** (8.1). `tīṇi vassasahassa` = 3 × 1.000 = **ba ngàn năm** (18.1). `anūnasoḷasasahassa` = không thiếu + 16 × 1.000 = **đủ mười sáu ngàn** (19.1; `anūna` → “đủ”, như `bv24:18.3` và `bv16:17.3`). `chamāsa` = **sáu tháng** (20.3). `tiṁsahattha` = **ba mươi hattha** (25.2; giữ nguyên đơn vị `hattha`, không quy đổi; tầng Việt giữ chữ hattha ở 118 khoá chứa `hattha`, còn “cánh tay” 2 và “khuỷu tay” 2). `tiṁsavassasahassa` = 30 × 1.000 = **ba mươi ngàn năm** (26.1). `tayo pāsāda` 3 (18.4) khớp ba tên ở `18.3`; `caturo nimitta` 4 (20.1); `eko samāgamo` 1 (7.2); `dasa dhamma` 10 (2.1) và `dasapāramī` 10 (14.4). Không có số nào dịch theo phỏng đoán; đã tự kiểm lại từng phép nhân. Đối chiếu độc lập với tầng Việt đã dịch của bài song song `dn14` (cùng Đức Phật Koṇāgamana, cùng Pāli root): `dn14:1.10.5` “30.000 vị tỳ-kheo” khớp `8.1` và `dn14:1.7.5` “tuổi thọ 30.000 năm” khớp `26.1`.

  **Trùng nguyên văn trong tầng.** Dò toàn tầng Việt đã dịch (so Pāli sau khi bỏ dấu câu và chữ hoa, trừ chính bài này): 49 khoá của bài có Pāli trùng với khoá đã dịch ở bài khác, tổng 249 cặp, trong đó 57 cặp có Việt khác bản tôi viết; 35 trên 49 khoá dùng đúng nguyên văn mọi tiền lệ. 14 khoá còn lại không giống hệt nhưng đều có lý do: `1.2` thêm “có” theo `bv24:1.2` vì ở đây câu mở đầu thiếu động từ (tiền lệ `tha-ap11:2.2`, 1 cặp, không thêm “có”); `1.4` kết dấu chấm theo Pāli từng khoá, như 2 tiền lệ `tha-ap142:3.4`, `tha-ap306:1.4` (25 tiền lệ khác kết chấm phẩy vì Pāli ở đó kết chấm phẩy); `2.4`, `4.4`, `12.4`, `14.2`, `16.4`, `23.3`, `26.4`, `19.2`, `9.1` khác ở dấu câu cuối hoặc thêm bớt “ta”/“đã” theo Pāli từng khoá của tiền lệ; `3.3` “Của ba mươi ngàn koṭi,” có chữ “Của” vì `3.4` `paṭhamābhisamayo ahu` nhận sở hữu cách (như `bv20:3.3`, `bv24:3.3`), còn tiền lệ `bv24:4.3` là cấu trúc khác; `12.3` mở nháy đơn theo Pāli (6 trong 7 tiền lệ nháy kép hoặc không nháy vì Pāli ở đó khác, `bv24:10.3` cùng nháy đơn); `7.1` dùng đúng `bv15:25.1`; `13.1` dùng đúng `bv24:11.1`.
  - Pāli trùng trong chính bài: 1 nhóm (`17.4`/`22.4` `koṇāgamanassa satthuno.`); bản Việt hai khoá giống hệt nhau ⇒ 0 cặp lệch. Hai khoá gần giống `3.2` `koṇāgamananāyake` (vị trí cách) và `21.2` `koṇāgamananāyako` (chủ cách) có Pāli khác nhau nên không tính là trùng; cả hai dịch “Koṇāgamana, bậc Dẫn Đạo”.
  - Dấu lược: Pāli có `…pe…` ở đúng một khoá (`13.2`) → bản Việt một `…`; Pāli không có `…` ở khoá nào khác, bản Việt cũng không; Pāli không có `(…)` nên bản Việt không có.
  - Nháy: Pāli mở nháy kép ở `1.1` và đóng ở `29.4` (`”ti`); mở nháy đơn ở `12.3` và đóng ở `13.3`; đếm khớp Pāli từng khoá, 0 lệch.
  - `12.3` `Imamhi bhaddake kappe` “Trong hiền kiếp này” không có số kiếp nên lưu ý về “sau … kiếp nữa” (lời thọ ký tương lai, `bhavissati`, như `bv20:9.3`, `bv16`, `bv18`) không áp dụng cho số kiếp ở đây; `12.4` “vị này sẽ trở thành Đức Phật” là tương lai (6/7 tiền lệ), không đảo hướng.

  **Thuật ngữ, có số đếm** (đo trên tầng Việt hiện có; so Pāli với bản Việt cùng khoá).
  - `nāyaka` → “bậc Dẫn Đạo” (100 trên 211 khoá chứa `nāyak`; “lãnh đạo” 25); `lokajeṭṭha` → “bậc Trưởng Thượng thế gian” và `narāsabha` → “đấng Nhân Ngưu” (25/29 tiền lệ ở `tha-ap`); `jina` → “bậc Chiến Thắng”; `muni` → “Mâu-ni”; `mahāvīra` → “Đại Anh Hùng”; `naruttama` → “bậc tối thượng trong loài người” (như `bv24:19.4`; “tối thượng giữa loài người” 18 và “trong loài người” 6 trên 39 khoá chứa `naruttam`; theo `bv24`, `bv18`, `bv17` giữ “trong”); `purisuttama` → “bậc tối thượng giữa loài người” (3/3 tiền lệ); `dvipaduttama` → “tối thắng giữa loài hai chân” (như `bv24:1.2`).
  - `pāṭihīra` → “thần thông” (4 trên 5 khoá chứa `pāṭihī` có dạng tương ứng; “phép lạ” 1); `pāṭihāriya` “thần thông” 75, “thần biến” 13. `vikubbana` → “sự biến hóa” (6 trên 10 khoá chứa `vikubb`; “thần thông” 5, “biến hiện” 1). Hai chữ cùng xuất hiện ở `4.1` và `5.1`, nên giữ hai từ khác nhau để không mất phân biệt.
  - `kantāra` → “hoang mạc” (9 trên 24 khoá chứa `kantāra`; “sa mạc” 1); không thêm “luân hồi” trong ngoặc như bản nguyên bài (đó là lời chú, không phải Pāli). `pavāhiya malaṁ` → “rửa sạch mọi cấu uế”: `mala` → “cấu uế” (tiền lệ `dhp243:2`, `iti89:11.3`).
  - `abhisamaya` → “chứng ngộ” (như `bv16`, `bv18`, `bv24`, `bv27`). `sabbaññutā` → “Nhất Thiết Chủng Trí” (như `bv24:13.3`, 1/1 tiền lệ trùng Pāli). `ogha` → “dòng lũ” (60 và “lũ” 66, “bộc lưu” 46, “dòng nước” 7 trên 469 khoá chứa `ogha`; đa số kỹ thuật là “bộc lưu” nhưng ở kệ này Pāli là danh từ số nhiều đi với `atikkanta` “đã vượt qua”, nên chọn “dòng lũ” cho súc tích). `maccu` → “tử thần” (74 trên 177 khoá chứa `maccu`; “thần chết” 32, “tử vong” 20, “cái chết” 8).
  - `pakaraṇa` → “bộ luận” (0 tiền lệ có `bộ luận` cho chữ này: các khoá chứa `pakaraṇ` phần lớn nghĩa “vụ việc, lý do”); chọn “bộ luận” vì Pāli nói `pakaraṇe satta` (bảy luận) khi Đức Phật thuyết trên cõi trời, nhưng không viết “Vi Diệu Pháp” hay “Abhidhamma” vì chữ đó không có trong Pāli.
  - `dhammacetiya` → “tháp Pháp” (`mn89`, `mn90`: 8 khoá chứa `dhammacet`). `dhammadussa` → “tấm vải Pháp” (0 tiền lệ; `dussa` là vải, áo). `dhammapupphaguḷa` → “chùm hoa Pháp” (0 tiền lệ; `guḷa` là viên, cụm, chùm).
  - `paṇḍukambala` → “tấm thảm vàng nhạt” ghép với `silā` thành “tảng đá phủ tấm thảm vàng nhạt”, theo `mn134:2.11` và `mn134:5.15` cùng cụm `paṇḍukambalasilāya` (2/2; `mn79`, `mn80` dịch `paṇḍukambala` “tấm thảm len màu nhạt”, `sn2.29` “tấm nỉ vàng”). `koseyya` → “lụa tơ tằm”, `kambala` → “vải len” (`tha-ap340:14.1`, `pv13:17.3`: “vải lụa tơ tằm và vải len”, 2/2). `cīnapaṭṭa` → “lụa Trung Hoa” (0 tiền lệ). `pattuṇṇa` giữ nguyên chữ Pāli “Pattuṇṇa” (0 tiền lệ, không rõ là tên xứ hay tên loại vải; xem bất định 3).
  - `yadicchakaṁ` → “tùy theo ý muốn” (8 trên 28 khoá chứa `yadicchak`; “tùy ý muốn” 1; 19 khoá còn lại là dạng khác như `yadicchakāhaṁ vihare`). `mahārajja` → “vương quốc lớn” (`bv20:8.3`, 1/1). `santike` → “bên” (118 trên 439 khoá chứa `santike`) với `pabbajiṁ jinasantike` → “ta đã xuất gia bên bậc Chiến Thắng” (như `bv20:8.4`, `bv24:13.4`; nguyên cụm `jinasantike` có 0 tiền lệ).
  - `mittāmacca` → “bạn hữu và quan thần”: ở tầng Việt, `mittāmacca` trong bối cảnh cư sĩ đa số là “bạn bè, đồng liêu” (`sn55.16`, `sn55.17`, `dn31:34.4`; “đồng liêu” 13 trên 260 khoá chứa `amacc`, “đại thần” 35), còn ở đây Pāli nói về một vị vua Sát-đế-lợi nên chọn “quan thần” (như `ja358:4.2` “bạn bè đại thần”).
  - `anantabalavāhana` → “binh lực và xe cộ vô biên” (0 tiền lệ nguyên cụm; `tha-ap116:1.4` có `sayoggabalavāhano`, nghĩa khác). `sajinasaṅgha` → “Tăng chúng cùng bậc Chiến Thắng” (0 tiền lệ).
  - Tên riêng đã có tiền lệ trong tầng (số tệp, trừ chính bài này): `Koṇāgamana` 10, `Kakusandha` 16, `Kapila` 51, `Uttarā` 11, `Sāmā` 9, `Sobha` 3 (`dn14`, `tha-ap475`, `bv16`), `Sobhavatī` 1 (`dn14`), `Yaññadatta` 3 (`dn14`, `cp31`, `ja444`), `Sotthija` 1 (`dn14`), `Sīvalā` 1 (`bv18`), `Somadeva` 1 (`tha-ap147`). Chưa có tiền lệ: `Pabbatārāma`, `Rucigattā`, `Satthavāha`, `Samuddā`, `Bhiyyasa`, `Pattuṇṇa`; `Tusita` và `Santusita` có ở tầng nhưng là tên cõi trời, ở đây là tên lâu đài (xem bất định 14); `Pabbata` có ở `mn116`, `snp3.6` là “núi”, ở đây là tên người (bất định 12); giữ dạng Pāli có dấu, như `bv24`, `bv18`. `dn14:1.9.5` viết tên đôi đệ tử là “Bhiyyosa và Uttara” (Pāli `dn14` là dạng `Bhiyyosa`), còn Pāli bài này là `Bhiyyaso` nên giữ “Bhiyyasa” theo Pāli của chính bài; chỗ lệch này nên được người biên tập thống nhất, ghi ở bất định 15.
  - Tên cây Bồ-đề `udumbara` giữ chữ Pāli “Udumbara”, như tên các cây Bồ-đề ở `bv15`–`bv24` (Kakudha, Campaka, Bimbijāla, Kaṇikāra, Āmaṇḍa, Sirīsa: 6/6 giữ Pāli) và `dn14:1.8.5` “cây udumbara” (giữ Pāli); tầng có “cây sung” cho `udumbara` ở `ja298` và `tha-ap277` (nghĩa thực vật), nên đây là chọn có chủ ý để cùng khuôn chuỗi bv, ghi ở bất định 7.
  - `kambu` → “vàng” (`ukkāmukhe yathā kambu`; xem bất định 6).

  **Bất định (ghi ở đây, không thêm vào thân kinh).**
  1. `13.1` `Ahu kapilavhayā rammā`: `ahu` là quá khứ (`ahosi`), nhưng toàn đoạn `12.3`–`13.3` là lời thọ ký tương lai (`bhavissati`, `hessāma`), và dạng này chỉ bị che bởi `…pe…` ở `13.2`. Tôi dịch sát chữ (“Đã có nơi xinh đẹp mang tên Kapila”), đúng bản `bv24:11.1` (cùng Pāli; 1 cặp, giống hệt), vì không có chứng cứ độc lập để đổi thì. **Cùng một khoá Pāli này nằm ở `bv2:62.1`, `bv21:14.1`, `bv22:13.1`, `bv23:16.1`, `bv24:11.1`, `bv25:13.1`, `bv26:17.1`**: cần thống nhất cho cả bảy khi các phẩm còn lại được dịch.
  2. `8.3`–`8.4` `Oghānamatikkantānaṁ, bhijjitānañca maccuyā`: `bhijjitānaṁ` là sở hữu cách số nhiều đồng vị với `oghānamatikkantānaṁ` (các vị đã vượt dòng lũ); `maccuyā` là dạng nữ tính của `maccu`, có thể là công cụ cách hoặc xuất xứ cách. Tôi đọc là “đã phá tan tử thần” (các vị A-la-hán đã thắng cái chết), hợp ngữ cảnh `Khīṇāsavānaṁ` ở `7.3`; cách đọc công cụ cách thuần túy là “bị cái chết phá vỡ” thì ngược nghĩa với ngữ cảnh nên không chọn. Bản nguyên bài cũng hiểu là đã làm tiêu tán sự tử vong. Pāli không phân xử hoàn toàn được.
  3. `11.1` `Pattuṇṇaṁ cīnapaṭṭañca`: `pattuṇṇa` là loại vải (tơ hoặc len mịn, thường gắn với xứ Pattuṇṇa), `cīnapaṭṭa` là lụa Trung Hoa; tôi giữ “Pattuṇṇa” như tên riêng vì không xác lập được nghĩa. `kambalampi ca` đọc là vải len (không phải “mền”).
  4. `11.4` `adāsiṁ satthusāvake`: tân ngữ là `satthusāvake` (các đệ tử của bậc Đạo Sư), không phải “bậc Đạo Sư và các đệ tử” (đó là bản nguyên bài); tôi giữ nguyên chữ của Pāli.
  5. `5.3`–`5.4` `Vasate tattha sambuddho, silāya paṇḍukambale`: `silāya` và `paṇḍukambale` đều ở vị trí cách; đọc là “trên tảng đá phủ tấm thảm vàng nhạt” theo `mn134`. Bản nguyên bài hiểu là tảng đá ngai của vua trời Sakka; Pāli bài này không nói thế nên không thêm.
  6. `25.3` `Ukkāmukhe yathā kambu`: `kambu` có nghĩa vỏ ốc, vòng (đồ trang sức) và vàng; ở miệng lò nung chỉ vàng hoặc đồ vàng mới “rực” được, nên dịch “vàng”. Tầng có `ja442:2.1` `suppaṭimukkakambu` “đeo vòng vàng” và bản nguyên bài hiểu là “chiếc vòng vàng”; cách đọc đó khả dĩ nhưng thêm “vòng” mà Pāli không nói, nên không chọn.
  7. `23.4` `udumbaroti pavuccati`: đọc là Bồ-đề của Ngài được gọi là `udumbara` (cây sung, Ficus racemosa); giữ chữ Pāli (bất định 7 ở phần thuật ngữ).
  8. `28.1`–`28.2` `Mahāvilāso tassa jano, siridhammappakāsano`: `jano` đọc là đoàn người của Ngài (các đệ tử); `mahāvilāso` “rực rỡ lớn lao”; `siridhammappakāsano` là hợp chất `siri` (huy hoàng) + `dhamma` + `pakāsana` (làm sáng tỏ). Cách đọc khác của hợp chất: “làm sáng tỏ Pháp tối thắng”. Tôi giữ “làm sáng tỏ Pháp huy hoàng”, không thêm từ.
  9. `27.2` `dhammadussavibhūsitaṁ`: `dussa` là vải, áo; “tấm vải Pháp” là nghĩa sát chữ, bản nguyên bài hiểu là cờ hiệu (nghĩa chú giải); tôi không thêm “cờ”.
  10. `2.1` `Dasa dhamme pūrayitvāna`: Pāli nói “mười pháp”; chú giải đọc là mười ba-la-mật (`dasapāramī` ở `14.4`) nhưng bản ghim ở đây chỉ nói `dasa dhamma`, nên dịch “mười pháp”, không đổi thành “mười ba-la-mật”.
  11. `4.1`–`4.2` `Pāṭihīraṁ karonte ca, paravādappamaddane`: hai vị trí cách đứng riêng; đọc là “khi thực hiện thần thông, (khi) đè bẹp các luận thuyết của người khác” (cùng mệnh đề thời gian); `3.4` và `4.3`/`4.4` tương ứng.
  12. `9.2` `pabbato nāma khattiyo`: `pabbata` vừa là “núi” vừa là tên người; theo `nāma` đọc là tên (`Pabbata`), và bản nguyên bài cũng vậy.
  13. `17.1` `Brāhmaṇo yaññadatto ca`: `ca` thừa nghĩa (đệm câu thơ) nhưng giữ bằng “Và” ở đầu; 
  14. `18.3` `Tusitasantusitasantuṭṭhā`: đọc là ba tên lâu đài Tusita, Santusita, Santuṭṭha (khớp “ba” ở `18.4`); cũng có thể đọc là ba tính từ “hài lòng, rất hài lòng, thỏa mãn”; chọn tên riêng như bản `bv24:16.3` (Kāma, Kāmavaṇṇa, Kāmasuddhi).
  15. `22.1` `Bhiyyaso uttaro nāma`: đọc là hai tên Bhiyyasa và Uttara (cùng một chữ `nāma` đứng cuối); cách đọc khác: một tên “Bhiyyasa Uttara”. Pāli số nhiều `ahesuṁ aggasāvakā` ở `22.2` và `dn14:1.9.5` (“một đôi đệ tử tối thắng … Bhiyyosa và Uttara”) xác nhận hai người; `dn14` viết `Bhiyyosa`, bài này theo Pāli `Bhiyyaso`.
  16. `19.1`–`19.4`: không có động từ nối giữa các khoá; theo khuôn `bv24:17`, `bv20:16`.

