notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ của bài kệ dưới 40 ký tự, nên assertion không tự chạy). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Dòng lược kết `:1.5` giữ nguyên hai dấu lược.** Pāli là `… <tên> thero …. `; tôi viết `… Trưởng lão <tên> ….`, đúng dạng `thag1.98`, `thag1.101`, `thag1.106` đã có trên đĩa, và **không** mở rộng thành *Bạch Thế Tôn, vị trưởng lão … đã từng nói bài kệ này* như nhóm `thig1.10`–`1.16` đang làm — BRIEF_VI3 §10.1 nói thẳng Pāli có dấu lược thì bản Việt giữ lược, mở rộng là thêm chữ KHÔNG ĐÁNH DẤU. Tên ở `:1.5` tôi dùng **dạng gốc** cho khớp tên ở `:0.4`, đúng cách 20 tệp thag/thig đã làm, dù Pāli dùng dạng chủ cách.

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Ekakanipāta` → *Bộ Một Bài Kinh* (160 chỗ trên đĩa, thắng *Phẩm Một Pháp* của 27 tệp `iti`). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>*. `Tatiyavagga` → *Phẩm Thứ Ba* (`iti21`–`iti26`), `Catutthavagga` → *Phẩm Thứ Tư* (`iti80`–`iti85`), `Pañcamavagga` → *Phẩm Thứ Năm* (`iti90`–`iti92`), `Sattamavagga` → *Phẩm Thứ Bảy* (`thag1.66`). Với `Chaṭṭhavagga`, `Aṭṭhamavagga`, `Navamavagga` chưa có tiền lệ nào trong tầng, tôi đặt mới *Phẩm Thứ Sáu* / *Thứ Tám* / *Thứ Chín* theo đúng công thức số thứ tự của loạt `Phẩm Thứ Hai`…`Thứ Mười Hai`. `Theragāthā 1.N` giữ **số** như `thag1.42`, `thag1.101`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có Pháp Cú), nên `triangulation` là Pāli + English Sujato. Bản Anh đã ghim có prose ở **8/9** khoá của mỗi bài; khoá trống duy nhất là `:1.5`, tức dòng lược — đúng như BRIEF_VI3 §10.1 nói, chỗ đó Pāli phải tự đứng vững.
  **Bốn vế trùng nguyên văn với `thag20.1:21.2` và `:22.4`** (`vālaggaṁ usunā yathā`), nhưng `thag20.1` chưa có bản dịch Việt trên đĩa nên không có nguyên văn để dùng lại — tôi ghi lại để lát sau không dịch hai chỗ đó khác đi. Cùng `buddhassādiccabandhuno;` trùng `sn8.1:5.2`, và đó **là** tiền lệ dùng lại được, nên tôi chọn nguyên văn: *của Đức Phật, bậc thân quyến của mặt trời* (chỉ thêm mối quan hệ sở hữu *của* vì Pāli ở đây là cách sở hữu).

  **Tôi cố ý không theo Sujato ở `1.3`.** Sujato dịch `Paccabyadhiṁ hi nipuṇaṁ` thành *I penetrated the subtle truth* — đọc `adhi` là *xuyên thấu*. Nhưng `adhi` nghĩa chính là *học, nghiên cứu*, và tiền lệ trong chính tầng là *như lý tác ý* / *khéo tác ý* cho `yonisomanasikāra`; cùng động từ ở `thag20.1:22.3` (`Paccabyādhiṁsu nipuṇaṁ`) nằm trong cặp *xuyên thấu / học hành* nên nghĩa *học hành* an toàn hơn. `paccabha` là tiền tố *liên tục*, nên tôi dịch *học hành liên tục*.

  **Bất định đã ghi:** `vālaggaṁ usunā yathā`. `vālagga` là *đầu sợi tóc / độ mảnh bằng sợi tóc*; `usu yathā` là *như / giống như*. Câu này không có mệnh đề động từ nào đứng sau (đối tượng `vālagga` đứng trần ở vị trí trung tố), nên nếu dịch sát chữ sẽ thành *như đầu sợi tóc vậy* — khó hiểu. Tôi chọn **dễ dàng như đầu sợi tóc**, vì Sujato đọc hình ảnh đó là độ chính xác (*like a hair-tip with an arrow*), và vì `thag20.1:21.1` (`Sukhumaṁ te paṭivijjhanti, vālaggaṁ usunā yathā`) xác nhận ý này: những điều tinh vi ấy được thấy thấu dễ dàng như đầu sợi tóc. Tôi **không** thêm *mũi tên* như Sujato — Pāli không có chữ ấy. Đây là lý do `semantic_fidelity` 9.2 và `ambiguity_integrity` 8.9.

  **Thuật ngữ đặt mới, kèm số tiền lệ.** `ādiccabandhu` → *bậc thân quyến của mặt trời* (nguyên văn `sn8.1:5.2`; **0 tiền lệ** cho `ādicca` — tôi dùng đúng cụm đã có). `subhāsita` → *khéo nói* (tiền lệ *khéo nói* / *lời khéo nói*; 95 chỗ `subhāsita` trong tầng). `nipuṇa` → *tinh tế* (tiền lệ: `dn14:3.2.6` và `mn26:19.12` *Pháp nghịch dòng, vi tế, / Pháp đi ngược dòng, tinh tế,*). `paccabyadhi` → *học hành liên tục* (**0 tiền lệ**, đặt mới). `vālagga` → *đầu sợi tóc* (**0 tiền lệ**, đặt mới). Tên `Abhaya` và dòng kết `… Abhayo thero ….` → *… Trưởng lão Abhaya ….* có **tiền lệ y hệt** ở `thag1.98:0.4` và `thag1.98:1.7`.
