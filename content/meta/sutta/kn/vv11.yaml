notes: |-
  Dịch TRỰC TIẾP từ Pāli root — không có tầng Anh đã ghim cho vv11, xem blocking_errors.
  Chỉ mục Pāli và Việt toàn tầng: 25 khoá của bài này có Pāli trùng nguyên văn ở bài khác, 17 dùng lại NGUYÊN VĂN bản Việt đã có (lời dẫn 4.x, phần dâng cúng 6.3–6.4, và các câu rải rác ở 3.x, 7.x, 8.x); 8 khoá còn lại cùng Pāli nhưng cố ý đổi xưng ngài và đổi uy thế lớn lao thành đại oai lực, để giữ một cụt xuyên suốt lát.
  0.4 Paṭhamapatibbatāvimānavatthu: tầng name/ đã ghim cho vv-name:13.vv11 bằng Honest Wife Mansion. vv12 (Pāli Dutiyapatibbatā, cùng chữ patibbatā) đã dịch Chuyện Cung Điện Nữ Gả Chồng Thứ Hai nên đối xứng là Thứ Nhất. Cả tầng Việt có 0 tiền lệ cho patibbatā; theo từ điển patibba là người phụ nữ đã kết hôn nên dịch Nữ Gả Chồng. Đây là BẤT ĐỊNH.
  BẤT ĐỊNH — VĂN BẢN PĀLI: 6.1 đọc Sacce ṭhitā mosavajjaṁ pahāya. Dạng chuẩn của cụm này ở vv là Saccaṭṭhānaṁ mosavajjaṁ, nghĩa là bốn lời nói dối giả, nên Sacce ṭhitā gần như chắc là biến thể không chính tắc. Dịch theo nghĩa và ghi kỹ ở đây; KHÔNG sửa Pāli và KHÔNG giải thích biến thể trong thân kinh.
  BẤT ĐỊNH 1.1–1.2: cả bốn câu mở đầu là của riêng vv11, 0 tiền lệ. mayūrā thành con công (tiền lệ thag2.46:1.1), haṁsā thành thiên nga (tiền lệ sn6.6:5.1), kokilā thành chim cút (tiền lệ mn66 và dn3), pupphābhikiṇṇa thành rải đầy hoa (tha-ap100:3.2), naranārisevita thành có nam nữ hầu hạ (hầu hạ 70 tiền lệ).
  BẤT ĐỊNH 2.1–2.4: Pāli trùng vv12:1.3 và 1.5–1.6, nhưng vv12 dùng cụt ngươi và uy thế lớn lao. Ở đây chuyển sang ngài và đại oai lực; nghĩa Pāli không đổi, chỉ đổi cách xưng.
  BẤT ĐỊNH 5.2–5.4: patibbatānaññamanā, mātāva puttaṁ anurakkhamānā và kuddhāpihaṁ nappharusaṁ avocaṁ đều có 0 tiền lệ. Giữ đúng quan hệ: kính trọng chồng, chăm sóc con như mẹ, và KHÔNG nói lời cay nghiệt, vì nappharusa là không đắc độc.
  3.1 của vv11 KHÔNG phải câu hỏi Pucchāmi như ở vv3, vv10, vv13, vv14, mà là Deviddhipattāsi mahānubhāve, nghĩa là nàng đã chứng đắc thiên thần lực. Đã bắt lỗi này ở một lượt review đối kháng và sửa; giữ lại đây để người sau không dán nhầm khung chung.
  Cổng kỹ thuật: npm run validate, npm test, npm run check do coordinator chạy; bài này draft nên không cần npm run build. technical_integrity 9.6 vì chưa tự chạy các lệnh này trong lát này.
  Lượt cải thiện 2026-10-11 (kiểm toán độc lập, đọc đối kháng từng khoá Pāli↔Việt): bản trước có 13/37 khoá sai nghĩa thật (35%), nên điểm cũ 9.09 không đúng sự thật; chấm lại 8.83. Các mục "lệch tiền lệ/tiền lệ" ở notes cũ phía trên có chỗ sai và nay bị thay: tiền lệ "chim cút" ở mn66 và dn3 là laṭukikā, KHÔNG phải kokilā; kokilā ở ja506:33.2 (cùng Pāli Vaggussarā kokilā sampatanti) và đa số các nơi khác là chim tu hú. "bốn lời nói dối giả" ở 6.1 là lỗi: Sacce ṭhitā mosavajjaṁ pahāya là "đã an trú nơi chân thật, đã từ bỏ lời nói dối", không có số bốn và không có biến thể Pāli bất thường nào cần giải thích.
  LỖI NGHĨA ĐÃ SỬA (khoá: trước → sau; vì sao; tiêu chí):
  1.1 "công trời và những con hạc" → "Sếu, công, và thiên nga cõi trời": bản cũ gắn diviyā vào công và bỏ mất haṁsā (thiên nga) dù notes cũ ghi đã dịch; koñcā là sếu theo ja506:33.1 (semantic_fidelity).
  1.2 "chim cút tự bay đến bên" → "chim tu hú tiếng êm tai bay đến": kokilā là chim tu hú (ja506:33.2 cùng Pāli, 69 nơi có kokila), bản cũ bỏ vaggussarā và thêm "tự" (semantic_fidelity, terminology).
  1.3 "thơm ngát" → "xinh đẹp": rammaṁ là xinh đẹp (đa số trên tầng, 51 nơi); "thơm ngát" không có trong Pāli.
  1.4 "tâm tư đa dạng" → "muôn màu muôn vẻ": anekacittaṁ nói về cung điện, một cung điện không có tâm tư; citta ở đây là sặc sỡ, nhiều vẻ. Bản cũ chép từ pv23, pv28, vv12, vv21 (cùng lỗi lan, ngoài lát, chưa sửa).
  4.2 "bị Tôn giả Moggallāna truy hỏi" → "được Tôn giả Moggallāna hỏi": pucchitā chỉ là được hỏi, "bị truy hỏi" thêm sắc thái thẩm vấn (16 nơi dùng "bị…truy hỏi", 2 nơi "được…hỏi"; chọn theo Pāli).
  5.2 "tôi đã kính trọng chồng mình" → "tôi là người vợ chung thủy, không để tâm đến ai khác": patibbatā anaññamanā; bản cũ bỏ cả patibbatā lẫn anañña (semantic_fidelity).
  5.4 "tôi không nói lời cay nghiệt, đắc độc nào" → "dù đang giận, tôi cũng không nói lời thô ác": bản cũ mất kuddhā api và "đắc độc" là chữ vô nghĩa; pharusa là thô ác (131 nơi) (semantic_fidelity, vietnamese_clarity).
  6.1 "đã từ bỏ bốn lời nói dối giả" → "Đã an trú nơi chân thật, đã từ bỏ lời nói dối": bỏ số "bốn" bịa và mất sacce ṭhitā (semantic_fidelity; lỗi nặng nhất của bài).
  6.2 "mê mẫn việc cho, gom góp tài sản" → "ưa thích bố thí, có thân tâm biết thu nhiếp": saṅgahitattabhāvā không có nghĩa tài sản; dùng nguyên văn pv36:24.2 cùng Pāli (2 nơi trùng, bản cũ khác cả hai).
  7.2 "nhờ vậy tôi có được nơi này" → "nhờ vậy tôi thành tựu được ở nơi đây": mijjhati là thành tựu, theo quyết định chung của họ vv; cố ý lệch 15 khoá trùng Pāli ở vv khác vì chúng dịch lơi.
  7.3 "hiện khưởi" → "hiện khởi" (lỗi gõ).
  8.1–8.3 "Để tôi nói cho ngài, bậc tỳ-kheo, về đại oai lực ấy: khi còn làm người, ngài đã tạo phước báu gì; Nhờ điều ấy mà ngài có oai lực" → "Tôi xin nói cho ngài, này tỳ-kheo có đại oai lực: khi còn làm người, tôi đã tạo phước báu nào; Nhờ điều ấy mà tôi có oai lực": mahānubhāva là hô cách chứ không phải tân ngữ; yamakāsi là "tôi đã làm" (akāsiṁ, người nói là nữ thiên) và tenamhi là "nhờ đó tôi (amhi)". Bản cũ đảo người nói: nữ thiên bị cho là nói phước báu của Tôn giả Moggallāna. Dùng khuôn đúng của vv33:10.1–10.3. Lỗi này lan ở ~13–14 tệp vv khác (vv1–vv4, vv6, vv7…), ngoài lát, chưa sửa.
  0.4, 9.1 "Nữ Gả Chồng" → "Người Vợ Chung Thủy": patibbatā là người vợ chung thủy, tận tụy với chồng (cp9:49.4, cp9:52.2, ja535:61.2, thi-ap27:36.4), không phải "nữ gả chồng" (tên cũ nghĩa là con gái đã lấy chồng, không có chung thủy). Cặp vv12 (Dutiyapatibbatā) cùng tên cũ; sửa đồng bộ sẽ là việc của vv12, chưa sửa ở đây.
  2.1, 2.3 "ngài" → "nàng": cùng một người nói (Moggallāna) và cùng một người nghe, 3.x đã là "nàng" (63 nơi cho 3.4); bản cũ đổi xưng giữa hai khổ liền nhau. Chỉ là thống nhất xưng hô.
  5.3 "như mẹ chăm sóc con trai mình" → "như mẹ gìn giữ con trai": anurakkhamānā là gìn giữ; bỏ "mình" thêm vào; đối tượng được gìn giữ (chồng) để ngầm như Pāli.
  Điểm đổi: source_provenance 9.5 → 9.0 (notes cũ nêu tiền lệ sai), semantic_fidelity 9.0 → 8.4, grammar_logic 9.1 → 8.8, terminology 8.8 → 8.4, vietnamese_clarity 9.2 → 8.8, han_viet_balance 9.4 → 9.3, ambiguity_integrity 8.8 → 8.5; segment_alignment 10.0, triangulation 7.5 và technical_integrity 9.6 giữ nguyên.
  Còn lại (không sửa, nghi ngờ hoặc lệch cả họ): 0.2 Itthivimāna vẫn "Nữ Hư Không" (không có ākāsa; lặp ở 49 tệp, không sửa riêng); 4.4 "quả báo của nghiệp này là thế" dịch yassa kammassidaṁ phalaṁ như câu khẳng định thay vì "đây là quả của nghiệp nào" (67 nơi, giữ cho đồng bộ); 7.4 "dễ chịu với tâm" cho manaso piyā (43 nơi, piya là ưa thích hơn là dễ chịu, giữ); 1.1 phạm vi của diviyā (chỉ thiên nga hay cả ba loài chim) và 1.4 anekacittaṁ là BẤT ĐỊNH; 6.2 saṅgahitattabhāvā theo tiền lệ pv36 nhưng "thân tâm" cho attabhāva chưa được kiểm độc lập; 5.3 đối tượng gìn giữ chỉ được ngầm hiểu (chồng). Blocker "không có tầng tham khảo tiếng Anh" giữ nguyên. Cổng kỹ thuật vẫn do coordinator chạy.

  Đối chiếu độc lập 2026-10-14: với bản Việt nguyên bài của Bhikkhu Indacanda. 1 khoá bất đồng nghĩa → sửa 0, giữ 0, bất định 1 (6.2 `saṅgahitattabhāvā`: bản dự án “có thân tâm biết thu nhiếp” theo tiền lệ pv36:24.2, bản nguyên bài hiểu là tính nhân hậu; Pāli không đủ để loại hẳn cách nào, giữ bản dự án). Hai chỗ khác chỉ là chênh cách đọc, không đổi nghĩa: 2.2 `Iddhī vikubbanti anekarūpā` (bản nguyên bài gán chủ ngữ cho nữ thiên, bản dự án để không chủ ngữ như Pāli) và 5.3 (đối tượng được gìn giữ không nêu; bài song song an7.63:8.2 `Mātāva puttaṁ anurakkhate patiṁ` cho thấy đó là người chồng, nhưng Pāli ở khoá này không nói nên không thêm vào thân kinh). Các khoá còn lại cùng nghĩa. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt, đối chiếu bản nguyên bài Bhikkhu
  Indacanda, đoạn song song vv12 vv31 vv33 vv49 vv4 pv23): sửa 4 khoá: 4.3–4.4 `Pañhaṁ puṭṭhā
  viyākāsi, yassa kammassidaṁ phalaṁ` *Được hỏi, nàng đã giải thích rằng / quả báo của nghiệp này là
  thế* → *Được hỏi câu hỏi, nàng đã giải đáp / về nghiệp mà đây là quả báo* (`yassa` là quan hệ từ,
  cách cũ biến thành khẳng định; theo vv7:4.3–4.4 đã phân xử 2026-10-14); 2.3 `Imā ca te accharāyo`
  thêm *Và*, *ấy* → *này* (bỏ sót `ca`, `imā`; theo vv12:1.5); 8.4 `vaṇṇo` *sắc tướng* → *dung sắc*
  (nhất quán với 3.4, 7.1) và dấu câu `”.` như vv7. Giữ: 5.2 *người vợ chung thủy* cho `patibbatā`
  (không đổi chữ Pāli ghim; bất định 0.4 đã phân xử 2026-10-11 theo cp9/ja535/thi-ap27), 6.1 `Sacce
  ṭhitā` *an trú nơi chân thật* (Indacanda cùng nghĩa, không có bất định còn lại), 6.2
  `saṅgahitattabhāvā` giữ theo pv36:24.2. Chờ người biên tập: tiêu đề 0.2, xưng hô 2.1/3.x
  (Moggallāna–nữ thiên). Không có bản Anh.

  Lô H2 2026-10-15 (Claude Sonnet 5.5 (Claude Code)): `2.4` `pamodayanti` là sai khiến của `pamodati`
  (PED: làm cho hoan hỷ); "đang vui chơi" đổi thành "đang làm cho hoan hỷ" theo vv67:2.5, vv82:2.6.
