notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B11 — snp4.6:9.4, snp4.6:10.2 (`muta` = cảm nhận (PED/DPD: sensed), không phải “nhận thức”/“tưởng”).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 2.4 (`āvase` là optative của āvasati, Niddesa mnd6:35.5 giải «eko careyya vihareyya», mnd6:31.4: «người ấy không còn sống trong nhà» → «thấy như vậy, không nên sống đời tại gia»; trả `iti disvā` về đúng khoá 2.4 nên 2.3 thành «Sự chia lìa vốn là điều chắc chắn», chú giải Snp «vijjamānavinābhāvameva idaṃ»), 3.4 (`māmako`: DPD māmaka «follower; disciple; lit. one of mine», Niddesa mnd6:44.6 «buddhamāmako dhammamāmako saṅghamāmako», chú giải Snp «mama upāsako bhikkhu vā», Sujato «follower of mine»; `nametha` optative: «kẻ có lòng tham ái không cúi đầu trước sở hữu» → «đệ tử của Ta không nên cúi theo sự xem là của mình», như mnd6:38.4).
