notes: |-
  Quyết định hội đồng biên tập 2026-10-16: B11 — snp4.6:9.4, snp4.6:10.2 (`muta` = cảm nhận (PED/DPD: sensed), không phải “nhận thức”/“tưởng”).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16: sửa 2.4 (`āvase` là optative của āvasati, Niddesa mnd6:35.5 giải «eko careyya vihareyya», mnd6:31.4: «người ấy không còn sống trong nhà» → «thấy như vậy, không nên sống đời tại gia»; trả `iti disvā` về đúng khoá 2.4 nên 2.3 thành «Sự chia lìa vốn là điều chắc chắn», chú giải Snp «vijjamānavinābhāvameva idaṃ»), 3.4 (`māmako`: DPD māmaka «follower; disciple; lit. one of mine», Niddesa mnd6:44.6 «buddhamāmako dhammamāmako saṅghamāmako», chú giải Snp «mama upāsako bhikkhu vā», Sujato «follower of mine»; `nametha` optative: «kẻ có lòng tham ái không cúi đầu trước sở hữu» → «đệ tử của Ta không nên cúi theo sự xem là của mình», như mnd6:38.4).
  Đồng bộ sau lượt rà DPD Niddesa 2026-10-16 (đợt 4): sửa 3.1–3.2, 4.1–4.4, 5.1–5.2, 6.1–6.4 (bản cũ dồn nội dung giữa các dòng theo câu Anh, vd. 3.1 `maraṇenapi taṁ pahīyati` mang ý «nghĩ đây là của ta» của 3.2, 6.1 `sokapparidevamaccharaṁ` mang ý «tham đắm» của 6.2; đưa mỗi dòng Việt về đúng dòng Pāli, như mnd6:38.1–38.2, 50.1–50.4, 56.1–56.2, 62.1–62.4; 5.2 `yesaṁ … pavuccati` là mệnh đề quan hệ bị động, không phải «ta gọi tên họ»), 7.1 (`patilīnacara`: B14 «thu mình», chú giải Snp «patilīnaṃ cittaṃ katvā carantassa», DPD «wandering withdrawn»: «ẩn cư» → «thu mình»), 7.4 (`bhavane`: DPD bhavana «home; dwelling place / realm», Niddesa mnd6:70.16 «nơi ở» của các loài, chú giải Snp «nirayādibhede bhavane», Sujato «a home»: «trong gia đình» → «ở nơi ở nào»); giữ 7.3 `sāmaggiya` «sự hòa hợp» (theo lời giải Niddesa; DPD, chú giải Snp «patirūpaṃ» và Sujato đọc «thích hợp» — bất định, ghi tại mnd6:67.3), 2.2, 6.3, 8.3, 10.3–10.4 (khác chữ, không sai Pāli).
  Đối chiếu kệ Snp với lời giải Niddesa 2026-10-17: sửa 8.3 (nghĩa từ: `parideva` «sầu muộn» → «than khóc»; «sầu» là `soka` như chính 6.1 «Sầu, bi»; lời giải mnd6:76.3 `paridevo` = ādevo paridevo … lālappo, tách khỏi `soko` ở 63.2; DPD «wailing; crying; lamentation»; Sujato «Lamentation»; như mnd6:73.3; thay nhận định «khác chữ» của lượt 2026-10-16 cho khoá này). 40 dòng kệ đã đối chiếu; nghi-giữ, không sửa: 10.3 `aññena` «nhờ kẻ khác» (lời giải mnd6:90.2 đọc «nhờ con đường khác», snp4.4:2.3 «nhờ cái khác»; Pāli và Sujato «by another» đọc được cả hai, giữ quyết định 2026-10-16), 2.3 «điều chắc chắn» (lời giải mnd6:34.2 sante saṁvijjamāne «có thật»), 4.1 «những gì đã gặp» (mnd6 «sự gặp gỡ»).
