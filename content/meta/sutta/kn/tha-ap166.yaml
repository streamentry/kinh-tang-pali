notes: |-
  Bài kinh trong `Therāpadāna apadāna` (Ký Sự của các Trưởng Lão): mỗi bài là một bài kệ
  của một vị trưởng lão, dạng `0.1`–`0.3` là khối tiêu đề tham chiếu, `1.1`–`5.3` là thân
  kệ (5 khổ × 4 vế), `6.1` là dòng ghi công `Itthaṁ sudaṁ āyasmā <tên> thero imā gāthāyo
  abhāsitthāti.`, `7.1` là dòng đóng `…therassāpadānaṁ <thứ tự>.`. Cả 4 bài có **cùng bộ khung**,
  nhưng tôi dịch từng vế từ Pāli trong bối cảnh bài, không rút gọn theo khuôn.
  
  **Tầng tham khảo — đo được, không suy đoán (nguồn: `source/upstream-manifest.json`, commit đã
  ghim).** Tầng Anh `english-sujato` có **755** tệp dưới `sutta/kn`, trải trên **9**
  sub-collection: cp 35 · dhp 26 · iti 112 · ja 83 · kp 9 · snp 73 · thag 264 · thig 73 · ud 80.
  Không có `tha-ap`, và manifest không liệt kê tệp nào cho 4 uid này ⇒ `not-published-upstream`,
  KHÔNG phải `not-synced`. Tầng `vietnamese-current` (Hòa thượng Thích Minh Châu) ở commit đã ghim
  chỉ có **26** tệp, toàn bộ là Pháp Cú, không có `tha-ap`. Tầng `english-project` chưa có thư
  mục nào cho `tha-ap147/149/151/166`. Cả ba tầng tham khảo vắng ⇒ `triangulation` hạ 8.0 và
  bài giữ `draft`.
  **Coverage** theo đúng công thức `source/layers.yaml` (mẫu = Pāli ≥ 40 ký tự, bỏ khối `:0`):
  mẫu số = **1** segment mỗi bài (`6.1`, 62–63 ký tự) ⇒ tổng **4**; Sujato phủ **0**; coverage
  **0.00** so ngưỡng 0.80. Mất mát đã được ghi nhận sẵn trong `content/meta/reference-gaps.yaml`
  (mỗi uid: substantiveSegments 1, substantiveWithoutEnglish 1, coverage 0), nên đây là khoảng
  trống **đã ghi nhận**, không phải khoảng trống bị bỏ sót.
  
  **Dùng lại nguyên văn bản dịch đã có (đo, không đoán).** Tôi dựng chỉ mục Pāli→Việt của toàn
  tầng: **5.407** tệp Việt, **155.826** khoá, **97.528** đoạn Pāli phân biệt. Trong **96** khoá
  của lát này, **49** khoá có Pāli trùng nguyên văn ở bài khác, và tôi đã **dò 9.013** cặp
  (khoá của lát × khoá nơi khác). Trong đó **40** khoá tôi dùng lại **nguyên văn** bản Việt đã có
  vì Pāli trùng tuyệt đối. 49 khoá còn lại là Pāli trùng nhưng **không** có bản Việt trùng, hoặc
  Pāli là hapax — những khoá ấy tôi dịch mới và ghi lý do riêng ở cuối.
  **Pāli trùng nguyên văn TRONG CHÍNH bài: 0 nhóm ở cả 4 bài**, nên không có cặp nào phải lệch.
  
  **Công thức dùng chung, chọn theo tiền lệ ĐẾM ĐƯỢC (phạm vi gần nhất = `tha-ap140`–`tha-ap200`,
  đếm cả số tệp lẫn số lần):**
  - `Therāpadāna` → giữ nguyên *Therāpadāna*: **352** tệp / 361 (thiểu số là *Trưởng Lão Ký Sự*, 9).
  - `Chattavagga` → *Phẩm Chatta*: **3/3**, nhất quán tuyệt đối.
  - `Paṭisambhidā catasso,` → *Bốn vô ngại giải,*: **353/361**.
  - `…pe…` → **đúng một** `…`: **511/511** trong `tha-ap`, **642/642** toàn tầng.
  - `kataṁ buddhassa sāsanaṁ”.` → *đã làm tròn lời dạy của Đức Phật”.*: **323/360**.
  - `Itthaṁ sudaṁ āyasmā <tên> thero imā gāthāyo abhāsitthāti.` → *Tôi nghe như vầy: Tôn giả
    Trưởng lão <tên> đã nói những bài kệ này.*: **25/25** bài đã đủ khoá trong dải 140–200.
    ⚠️ Tôi **sửa `6.1` của cả 4 bài**: trên đĩa trước khi tôi ghi là *… đã từng nói bài kệ này*,
    lệch với 25/25 ở hai chỗ — bỏ số nhiều của `imā gāthāyo`, và bỏ `đã từng`. Kể cả `Itthaṁ
    sudaṁ` vẫn được dịch đủ thành *Tôi nghe như vầy:* như trước, nên không thêm lời hô.
  - `0.3` và `7.1` → *Bài Kệ Tuyên Ngôn Về Trưởng Lão <tên>*: **14/24** trong dải gần nhất
    (đối thủ *Ký sự về Trưởng lão …* là 10/24). Giữ số thứ tự Pāli viết ở `0.3` (ví dụ `5.`) và
    dịch thứ tự ở `7.1` (*thứ năm / thứ bảy / thứ chín / thứ tư* — cả 6 mẫu quan sát được trong
    dải gần nhất đều thuộc tập này).
  - `Duggatiṁ nābhijānāmi,` → *Tôi không còn biết đến khổ xứ,*: dải gần nhất **8/17**, toàn tầng
    **45/325**. Có hai nhóm lớn hơn ở tầng (*Ta không biết mình rơi vào khổ đau,* 122 tệp;
    *Tôi không còn biết đến đọa xứ nào,* 58+20 tệp) nhưng cả hai đều **lệch Pāli**: nhóm thứ nhất
    đổi ngôi kể và thêm ý *rơi vào*, nhóm thứ hai thêm *nào* trong khi Pāli `Duggatiṁ` là số ít.
    Pāli thắng.
  - `Sattaratanasampannā,` → *Đầy đủ bảy món báu quý giá,*: **17/35** toàn tầng, **6/12** dải gần
    nhất. `Sattaratanasampanno,` → cùng cách đó: **25/62** toàn tầng.
  - `cakkavattī mahabbalā.` → *là Chuyển Luân Vương có đại uy lực.*: **7/15** dải gần nhất (toàn
    tầng đa số là *các Chuyển Luân Vương có đại oai lực*, 14/49 — nhóm thịnh số nằm ở tệp cũ hơn).
    `cakkavattī mahabbalo.` → *là Chuyển luân vương có đại thần lực.*: **4/11** dải gần nhất và
    **31/82** toàn tầng — hai phạm vi cùng đa số.
  - `yaṁ pupphamabhiropayiṁ;` → *khi tôi dâng cúng hoa ấy;*: **3/6** dải gần nhất, **8/32** toàn
    tầng.
  - `Catunnavutito kappe,` → *Vào chín mươi tư kiếp trước đây,*: dải gần nhất hòa **2–2**, xuống
    tới đa số toàn tầng **30/85**.
  - `buddhapūjāyidaṁ phalaṁ.` → *đây là quả báo của việc cúng dường Đức Phật.*: **6/10** dải gần
    nhất, **30/83** toàn tầng.
  - `umāpuppha` → *hoa umā*: `dn16:3.29.2`, `dn33:3.1.153`, `dn34:2.1.174`, `mn77:23.15` đều dùng
    *umā*; tôi giữ dạng Pāli thay vì *hoa gai dầu* của `tha-ap323:2.1`.
  - `kudāla piṭaka` → *cuốc và giỏ*: xem phần riêng bên dưới.
  
  **Đo `ti`.** Quy ước `ti` trong tầng không đồng nhất, nên tôi đo ở **hai** phạm vi và ghi cả
  hai: nội dung Pāli có tiền tố số (`3.1 `…) là **0/1.457** segment ở dải gần nhất `tha-ap140`–`200`
  và **0/12.114** segment ở cả cuốn `tha-ap`; trong chính lát này là **0/96**. Nghĩa là **bốn bài
  này không có khoá nào mang `ti` trong nội dung Pāli** — số thứ tự chỉ nằm trong tên khoá, nên
  không có gì để dịch và không có xung đột để báo cáo. Đây là *không áp dụng*, không phải *pass*.
  
  **Chuẩn hoá chữ.** Tầng dùng `ṁ` (U+1E41) ở **1.795** tệp và `ṃ` (U+1E43) ở **2** tệp; Pāli
  root dùng `ṁ`. Bản này giữ `ṁ` và không dùng `ṃ`. Cả **96/96** chuỗi đều ở dạng NFC.
  
  **Cổng kỹ thuật KHÔNG chạy được** vì bị cấm lệnh trong lát này, nên `technical_integrity` đặt
  **9,6** chứ không phải 10,0, và tôi không tuyên bố technical gate pass. Bốn lệnh còn lại:
  `npm run validate` · `npm test` · `npm run check` · `npm run build`.
  
  
  `Supāricariyavagga` → *Phẩm Phục Vụ Tốt*: **3/4** tiền lệ trong tầng, và cả 3 đều là 3 bài
  lân cận `tha-ap165`, `tha-ap167`, `tha-ap169`; bản lệch *Phẩm Supāricariya* là `tha-ap164`.
  
  **Bất định đã ghi nhận:**
    - `gosujātasanāmako;` (4.2): `gosujāta` là hapax (**1** segment trong Pāli root, **0** bản
      Việt). Tôi giữ tên vua ở dạng Pāli `Gosujāta` như tầng giữ `Devuttara`, `Suppabuddha`,
      không dịch *chào đời từ bò* vì đó là diễn giải chứ không phải nghĩa của tên riêng.
    - `Tāhaṁ desaṁ apūjesiṁ,` (2.3) cũng là hapax. `apūjesiṁ` đọc được cả 1sg (tôi) lẫn 3sg
      (Ngài); tôi chọn 1sg vì 2.4 `pasanno sehi pāṇibhi` (*bằng chính đôi tay ấy*) mô tả chính
      tay người cúng dường.
    - `gacchate anilañjase.` (1.4): cụm đúng chuỗi có **0** tiền lệ; cùng họ `anilañjase` có
      **19** segment trong Pāli root, trong đó 1 bản dịch *đang đi trên lối không dấy bụi*
      (`tha-ap269:1.4`) và 4 bản ghi *đang ngự giữa bầu trời lộng gió*. Tôi chọn *lối không
      dấu bụi* vì 1.3 đã dùng *bầu trời* cho `vehāsa`, không lặp lại.
    - `Ekādase kappasate,` (4.1) là hapax (**1** segment trong Pāli root, **0** bản Việt); đọc
      `ekādasahi` = 11 trăm = **một ngàn mốt trăm kiếp**. `Aṭṭhārase kappasate,` (3.1) thì có
      tiền lệ và tôi dùng nguyên văn *Vào một ngàn tám trăm kiếp trước,* (`tha-ap135:7.1`,
      `tha-ap192:4.3`).
    - `desapūjāyidaṁ phalaṁ.` (3.4) chưa có bản Việt nào; vì `desa` ở đây là Đức Phật và
      `buddhapūjāyidaṁ phalaṁ.` đã được **30** bản dịch thành *việc cúng dường Đức Phật*, tôi dùng
      đúng cụm đó cho nhất quán.
    - `lokajeṭṭho narāsabho;` (1.2) trùng nguyên văn ở **11** bài khác, và **10** bản dùng
      *bậc Trưởng Thượng thế gian, đấng Nhân Ngưu* — tôi dùng nguyên văn bản ấy. Bản lệch
      *bậc Tối Thắng của thế gian, bậc Bất Động* chỉ có **1** tiền lệ (`tha-ap167:1.2`).
