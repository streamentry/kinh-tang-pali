notes: |-
  **Tự kiểm, vì `cần` của `_hvi.py` RỖNG** (mọi vế kệ của bài kệ dưới 40 ký tự, nên assertion không tự chạy). Tôi quét MỌI khoá: đúng 9/9, đúng segment ID, NFC, số dấu lược bằng Pāli từng khoá, ngoặc kép cân trên cả bài, không Pāli lọt, không còn `(…)`. `kiểm()` chạy lại từ đĩa pass; `save_vi` hai lần không đổi byte.

  **Dòng lược kết `:1.5` giữ nguyên hai dấu lược.** Pāli là `… <tên> thero …. `; tôi viết `… Trưởng lão <tên> ….`, đúng dạng `thag1.98`, `thag1.101`, `thag1.106` đã có trên đĩa, và **không** mở rộng thành *Bạch Thế Tôn, vị trưởng lão … đã từng nói bài kệ này* như nhóm `thig1.10`–`1.16` đang làm — BRIEF_VI3 §10.1 nói thẳng Pāli có dấu lược thì bản Việt giữ lược, mở rộng là thêm chữ KHÔNG ĐÁNH DẤU. Tên ở `:1.5` tôi dùng **dạng gốc** cho khớp tên ở `:0.4`, đúng cách 20 tệp thag/thig đã làm, dù Pāli dùng dạng chủ cách.

  **Tiêu đề và phẩm theo tiền lệ, đếm được.** `Ekakanipāta` → *Bộ Một Bài Kinh* (160 chỗ trên đĩa, thắng *Phẩm Một Pháp* của 27 tệp `iti`). `<X>theragāthā` → *Kinh Kệ Của Trưởng Lão <X>*. `Tatiyavagga` → *Phẩm Thứ Ba* (`iti21`–`iti26`), `Catutthavagga` → *Phẩm Thứ Tư* (`iti80`–`iti85`), `Pañcamavagga` → *Phẩm Thứ Năm* (`iti90`–`iti92`), `Sattamavagga` → *Phẩm Thứ Bảy* (`thag1.66`). Với `Chaṭṭhavagga`, `Aṭṭhamavagga`, `Navamavagga` chưa có tiền lệ nào trong tầng, tôi đặt mới *Phẩm Thứ Sáu* / *Thứ Tám* / *Thứ Chín* theo đúng công thức số thứ tự của loạt `Phẩm Thứ Hai`…`Thứ Mười Hai`. `Theragāthā 1.N` giữ **số** như `thag1.42`, `thag1.101`.

  **Không đối chiếu được tầng Việt hiện hành** tại commit đã ghim (bilara `translation/vi/` chỉ có Pháp Cú), nên `triangulation` là Pāli + English Sujato. Bản Anh đã ghim có prose ở **8/9** khoá của mỗi bài; khoá trống duy nhất là `:1.5`, tức dòng lược — đúng như BRIEF_VI3 §10.1 nói, chỗ đó Pāli phải tự đứng vững.
  **Không có vế nào trùng bài khác** — đã quét Pāli của toàn bộ tầng Việt sẵn có.

  **Vế `1.1`–`1.2` là hai tầng âm thanh, và tôi giữ đúng hai tầng chứ không gộp.** `Cihacihābhinadite` = `cihacihā` (*tiếng kêu đủ vặt, tạp thanh*) + `abhinadite` (*đang vang lên*); `sippikābhirutehi ca` = `sippikā` (*tiếng kêu lách cách*) + `bhirutehi` (*với những âm thanh*) + `ca` (*cùng*). Sujato dịch cả hai vế thành một cục (*the chirping and cheeping of the birds*) — tôi tách thành *tiếng kêu chích chích vang lên,* / *cùng tiếng lách cách của chim;* để hai chữ onomatopoeia của Pāli không bị mất.

  **Mệnh đề quan hệ `1.3`–`1.4` tôi giữ đúng sắc:** `Na me taṁ phandati cittaṁ` (*tâm tôi không vùng vẫy vì điều ấy*) và `ekattanirataṁ hi me` (*vì tôi đã nhất tâm vào một chỗ*). `taṁ` là tân ngữ của *điều ấy*; `hi` là chữ nhấn quen thuộc trong thơ nên bỏ. `phandati` tôi dịch **vùng vẫy** theo tiền lệ `dhp34:3` (*tâm này vùng vẫy* cho `Pariphandatidaṁ cittaṁ`) — không dùng *chập chờn* vì *chập chờn* có 0 tiền lệ trong tầng và dịch theo nó sẽ phải đổi cả `dhp34`.

  **Thuật ngữ đặt mới, kèm số tiền lệ.** `ekattanirata` → *nhất tâm vào một chỗ* (**0 tiền lệ**; *nhất hướng* có 40 chỗ trong tầng nhưng tôi đo không tra được nghĩa *một chỗ / duy nhất một điểm*, và *nhất tâm* giữ đúng ý *đơn điểu* của `ekatta`; ghi lại để biên tập cân nếu muốn thống nhất với nhóm dùng *nhất hướng*). `cihacihā` → *chích chích*; `sippikā` → *lách cách*; `abhinadi` → *vang lên*; `bhiruta` → *tiếng* (hợp nhất vào *tiếng lách cách của chim*); `phandati` → *vùng vẫy* (tiền lệ có). Tên `Rāmaṇeyyaka` giữ Pāli ở `:0.4` và `:1.5` (Pāli `:1.5` dùng dạng chủ cách `Rāmaṇeyyako`).
  **Những lỗi bản đầu tôi tự bắt khi đọc đối kháng (đã sửa hết, ghi lại để người đọc scorecard biết điều gì đã qua):** `1.1`–`1.2` bản đầu dịch `Cihacihābhinadite` thành *Từ tiếng kêu chích chích* — mất `abhinadite` (*vang lên*); và dịch `ca` thành *và* thay vì *cùng*. Đã sửa thành *Tiếng kêu chích chích vang lên,* / *cùng tiếng lách cách của chim;*
