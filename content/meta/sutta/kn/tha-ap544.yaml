notes: |-
  Dịch từ Pāli root, 82 khoá, đủ khoá, đúng thứ tự Pāli. Tên bài (khoá 0.3) lấy đúng giá trị translationTitle: Pāli 0.3 không bắt đầu bằng số nên không có số thứ tự (chính sách giữ số khi và chỉ khi Pāli có số). Kiểu tên: Ký Sự Về Trưởng Lão X chiếm 18 so với Bài Kệ Tuyên Ngợ 15 (cộng 1 Tuyên Ngợi) ở phạm vi tha-ap500 đến tha-ap600; toàn tầng tha-ap thì ngược lại: Tuyên Ngợ 222, Tuyên Ngôn 116, Ký Sự 100. Hai phạm vi cho hai đa số khác nhau; theo phạm vi gần nhất và bài liền kề tha-ap554/555/556/557 thì dùng Ký Sự Về. Chữ Tuyên Ngợ không dùng vì chưa rõ gốc, vấn đề đó để biên tập phán một lượt cho cả cuốn.
  Khoá 0.2 Bhaddiyavagga dịch Phẩm Bhaddiya (cùng quy ước Phẩm cộng tên Pāli với Phẩm Yasa, Phẩm Sobhita, Phẩm Sudhā; 0 bài đã dịch trong tầng mang đúng Bhaddiyavagga để so). Khoá 22.1 dùng Ký sự về Trưởng lão X, thứ nhì: dạng Ký sự có thứ nhì 10 so với thứ hai 8 trong các colophon dutiyaṁ đã có, và bài liền kề tha-ap554 dùng thứ nhì. Khoá 21.1 theo công thức Tôi nghe như vầy ... đã nói những bài kệ này (469 khoá dùng những bài kệ này, 2 khoá dùng số ít).
  Số Pāli: satasahassa là sata 100 nhân sahassa 1000 bằng 100.000, dịch một trăm ngàn ở 1.3 (Ito satasahassamhi, kappe uppajji nāyako: cách đây một trăm ngàn kiếp; kappe nằm ở khoá 1.4 nên chữ kiếp được đưa lên 1.3 để câu Việt liền mạch), ở 8.1 (satasahassito kappe trong lời thọ ký về Đức Gotama: vào một trăm ngàn kiếp nữa, theo tha-ap11:9.1) và ở 16.1 (nghiệp đã làm cách đây một trăm ngàn kiếp, dùng lại nguyên văn tha-ap11:14.1). tāvatiṁsa dịch cõi trời Ba mươi ba theo quy ước tầng (3 cộng 30 là 33; 15 trong 17 khoá cùng Pāli dùng Ba mươi ba, 2 khoá dùng Đạo Lợi). Bài không có cụm Tiṁsakappasahassa; số tiṁsa duy nhất là trong tên cõi trời, nên không có bất định số lượng nào cần phán.
  Ngôi kể: tôi cho người kể suốt bài, kể cả các câu chuẩn của tầng; ở các công thức Kilesā jhāpitā mayhaṁ, viharāmi anāsavo, Svāgataṁ vata me āsi, đa số tầng dùng ta (91, 95 và 85 khoá) nhưng nhóm dùng tôi cũng đã có (10, 10 và 3 khoá) và bài liền kề tha-ap554 dùng tôi; chọn tôi để nhất quán trong bài. kataṁ buddhassa sāsanaṁ dịch không chủ ngữ (98 so với 21 khoá có tôi; 430 so với 21 ở dạng đóng nháy kép) và Paṭisambhidā catasso dịch Bốn vô ngại giải (458 khoá). Khoá 18.2, 19.2, 20.2 là …pe… nên giữ đúng một dấu lược …; Pāli của bài không có (…) trần.
  Pāli trùng nguyên văn trong chính bài: chỉ một nhóm là …pe… (18.2, 19.2, 20.2), cả ba Việt giống nhau; 19.3 và 20.3 khác nhau ở Pāli (20.3 có dấu nháy kép đóng) nên Việt khác nhau đúng ở dấu đó. So với tầng: đã dò 26 khoá Pāli có trùng nguyên văn ở các bài tha-ap khác (gồm 3 khoá …pe…); 19 khoá Việt giống bản đa số, 7 khoá Việt khác bản đa số: 8.1 (19 khoá của tầng viết vào một trăm ngàn đại kiếp trước, kể cả cho lời thọ ký tương lai, đổi thành nữa theo tha-ap11:9.1 vì Pāli ở đây là lời thọ ký), 9.2 (đa số tầng 2 so với 1 viết sinh ra từ giáo pháp ấy và bỏ mất oraso; giữ vế là con ruột, do giáo pháp tạo nên theo tha-ap33:10.2), 10.4, 18.1, 18.3, 19.1 (ta chuyển thành tôi như đã nói), và 16.3 (đa số 2 so với 1 viết Tuy đã thoát kiếp, vẫn rùng rình, không bám sát sumutto saravegova; dùng cách dịch mũi tên khéo buông theo tha-ap11:14.3).
  Dấu nháy: Pāli mở nháy kép ở 1.1 và đóng ở 20.3; nháy đơn mở ở 7.3 và đóng ở 9.4 (lời thọ ký), nháy đơn mở ở 15.1 và đóng ở 15.4 (lời Đức Phật), khớp Pāli từng khoá.
  Bất định, không đưa vào thân kinh: 1.2 cakkhumā dịch bậc Hữu Nhãn đối với mọi pháp. 2.2 haṁsadundubhinissano đọc là tiếng như thiên nga, như trống lớn; hợp từ cũng có thể đọc thành một vật duy nhất. 2.3 nāga hiểu là voi (cũng có nghĩa rắn thần). 2.4 candasūrādikappabho đọc kappa như chỉ sự giống nhau (hào quang như trăng, mặt trời và những thứ tương tự); đây là chỗ khó nhất bài, chưa có đối chiếu ngoài. 4.2 veneyyaṁ vinayaṁ bahuṁ hiểu vinayaṁ như một phân từ (điều phục nhiều người đáng được điều phục), cùng cấu trúc với tha-ap394:60.3 Vinayanto ca veneyye; cách đọc khác là dạy nhiều giới luật cho người đáng điều phục. 7.1 viyākāsi dịch đã tuyên bố vì trong tầng tha-ap đã dịch thọ ký 0 khoá, còn tuyên bố dùng ở tha-ap11:15.4 (paññapesi) và giảng giải 4 khoá cho Taṁ me buddho viyākāsi. 11.3 kulasampanne dịch đầy đủ dòng dõi, chưa có tiền lệ trong tầng. 13.2 kappākappe hiểu là điều hợp thức và không hợp thức (kappa theo nghĩa giới luật, không phải đơn vị kiếp). 17.1 disvā có tân ngữ jhānarataṁ, hiểu là người kể (tôi), cùng nhân vật với maṁ disvā ở 14.4. Bài kệ 15 trùng Pāli với Udāna 5.7:4; đã dùng lại cách dịch của ud5.7 (bất cứ nghi hoặc nào ở đời này hay đời sau; thuộc tự thân hay thuộc tha nhân; những vị thiền định từ bỏ tất cả; những vị tinh cần sống phạm hạnh). tha-ap544 không có bản Anh đã ghim nhưng ud5.7 có Sujato, nên 4 khoá của nhóm này có đối chiếu Anh gián tiếp qua bài kệ trùng; toàn bài vẫn không có đối chiếu Anh độc lập.
  Hệ quả giới hạn: triangulation hạ xuống 7.5 và status giữ draft.
