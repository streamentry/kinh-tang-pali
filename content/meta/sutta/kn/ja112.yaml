notes: |-
  Đã đọc HẾT v7/p0.txt trước khi viết. Dịch đủ 11/11 khoá trong all từ Pāli root; file Pāli đã so git-hash với source/upstream-manifest.json (khớp). Bài không có segment Pāli ≥ 40 ký tự nên `cần` trong kiểm() rỗng và coverage không kích hoạt sàn 0,8, nhưng thiếu tầng Anh vẫn là lỗi chặn nên vẫn draft.
  Tiền lệ có đếm: Jātaka giữ nguyên tên bộ (101/101 tệp kn/ja*); Ekakanipāta → Bộ Một Bài Kinh (89/89); Haṁcivagga → Phẩm Haṁci (8 tệp: ja111, ja113–ja119). Colophon có dấu phẩy trước số thứ tự, khớp cả 8 tệp cùng phẩm. pañha → Câu Hỏi theo ja111 (Gadrabhapañhajātaka → Kinh Câu Hỏi Về Con Lừa), nên tiêu đề là Kinh Câu Hỏi Của Amarādevī.
  Lần dùng đầu tiên trong tầng: Amarādevī (0.4 và 2.1) là tên riêng lấy nguyên văn từ chính tiêu đề Pāli của bài (2. Amarādevīpañhajātaka), đúng như tiền lệ Rādha, Litta, Gāmaṇī, Mitacintī. _hvi.py không bắt được vì pāli_riêng tách Amarādevīpañhajātaka thành một từ; ghi lại đây thay vì khai tên vào bộ nhớ tiến trình (lát này cấm sửa _hvi.py). palāsa thì đã có tiền lệ (an3.5.1.12 khu rừng cây palāsa).
  Bất định đã ghi: sattubilaṅgā (bảy lưng, bilaṅga = bờ cao/lưng) và Diguṇapalāso (cây palāsa hai quả) là câu đố của tiên nữ Amarādevī; bản dịch không thêm tên dòng sông vì Pāli của bài không nói. Chỗ chưa phân xử được: yavamajjhakassa — yava là quân cờ vua trong văn học Pāli nên dịch là người chơi cờ vua, nhưng cũng đọc được là kẻ ở giữa ruộng lúa yava; và Etaṁ channapathaṁ (ngã tư) chưa rõ là ngã tư của con đường ấy hay của bàn cờ. Commit đã ghim không có bản Anh Sujato cho bài nên không có cách đối chiếu; giữ cách đọc thông dụng và ghi ở đây. Vì vậy semantic_fidelity 8.9, grammar_logic 9.0, ambiguity_integrity 8.6.
