  - `10.4` “cùng nắm quyền cai quản này” → “cùng nắm giữ quyền chủ tể này” (terminology fix): `issariya` đã có dạng “quyền chủ tể” ở tầng (4 khoá); bỏ chữ “cai quản” không có trong Pāli. Không đổi nghĩa.
