notes: |-
  Đợt 19, làn 82. Dịch từ Pāli root commit đã ghim, đủ 117/117 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ và dấu nháy (xem dưới). Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú.

  **Tiêu đề.** `0.1` Jātaka giữ nguyên (485 khoá trong tầng, so với 16 khoá dịch thành “Chuyện Tiền Thân”). `0.2` “Bộ Hai Mươi Bài Kinh” dùng lại nguyên văn bản dịch của `Vīsatinipāta` (16/16 khoá cùng một dạng). `0.3` “Phẩm Mātaṅga” dùng lại nguyên văn `ja497:0.3` (6/6 khoá cùng dạng). `0.4` “2. Kinh Cittasambhūta” và `29.1` “Kinh Cittasambhūta thứ hai.” theo khuôn của `ja497` (“1. Kinh Mātaṅga” / “Kinh Mātaṅga thứ nhất.”) và `ja486` (“Kinh Mahāukkusa, thứ ba”). Số `2.` và `dutiyaṁ` đều là 2.

  **Tiền lệ dùng lại nguyên văn.** Đã dò toàn tầng (Pāli đã ghim, so khớp sau khi nén khoảng trắng và bỏ dấu câu, bản Việt đã có): 20 khoá của bài này có Pāli trùng nguyên văn với khoá ở bài khác (`0.1`, `0.2`, `0.3`, `4.2`, `6.2`, `9.1`, `9.3`, `9.4`, `12.2`, `14.3`, `17.1`, `17.2`, `18.1`, `18.2`, `19.1`, `19.2`, `20.1`, `21.1`, `26.1`, `26.3`). 19/20 khoá dùng lại nguyên văn bản Việt có sẵn (chỉ thêm dấu nháy cho khớp Pāli ở bài này, và viết hoa chữ đầu dòng theo nhịp kệ); riêng `12.2` thêm chữ “là” ở đầu để nối với `12.1`, phần còn lại y nguyên; 0 khoá lệch về nghĩa. Chỗ tầng có nhiều dạng khác nhau, đã chọn như sau: `9.1`, `9.3`, `9.4` theo `ja509:3.1`, `3.3`, `3.4` (cùng công thức đón khách trong kệ Jātaka) chứ không theo `dn19:44.12`, `44.14`, `44.15` (“Chỗ ngồi, nước, dầu thoa chân”, “xin cho chúng tôi được dâng lễ tiếp đãi”); `17.1`, `18.1`, `19.1`, `20.1` theo `sn2.19:2.1` (2 khoá dạng “đang bị đưa dần”) chứ không theo `sn1.3:2.1` (2 khoá dạng “bị cuốn đi”) hay `an3.51:3.1` (1 khoá), 3 dạng không có đa số rõ, chọn dạng đi cùng `17.2` “bị đưa đến già nua, không còn chỗ nương tựa” (`sn2.19:2.2`) vì khớp từng dòng; `12.2` theo `snp3.8:1.2` “đời sống của người phàm ở đây”; `26.1` theo `ja484:17.3`; `26.3` theo `ja483:18.3` (cùng `sn1.41:5.5`); `4.2` theo `ja483:9.2`; `6.2` theo `snp2.7:18.2` và `22.4`; `14.3` theo `sn3.4:4.1` (“Khi bị thần chết chi phối,”). `26.4` gần như trùng `ja483:18.4` về Pāli nên dịch theo cùng ý “không bị chê trách, hãy đi đến nơi chốn cõi trời”.

  **Trùng nguyên văn trong chính bài.** 117 khoá, 6 nhóm Pāli trùng (sau khi nén khoảng trắng và bỏ dấu câu): `1.1`=`2.1`=`3.1`, `1.2`=`2.2`=`3.2`, `13.2`=`14.4`, `17.1`=`18.1`=`19.1`=`20.1`, `17.2`=`18.2`=`19.2`, `17.3`=`18.3`=`19.3`=`20.3`. Cả 6 nhóm dùng đúng một bản Việt, 0 nhóm lệch. Bản Việt chỉ khác ở dấu nháy mở/đóng và dấu câu cuối khoá theo Pāli từng khoá (`1.1` có nháy mở, `2.1` không; `13.2` kết `?` theo `14.4`, dù Pāli `13.2` kết `;`). Điệp khúc `17`–`20` chỉ khác ở dòng 4 (và dòng 2 của `20`): `dukkhudrayāni` → “có kết cục là khổ”, `dukkhapphalāni` → “có quả là khổ”, `rajassirāni` → “lấy bụi trần làm đầu”, `kammaṁ nirayūpapattiyā` → “nghiệp đưa đến tái sinh vào địa ngục”.

  **Số Pāli:**
  - `Vīsati` (0.2) = 20, “Hai Mươi”, theo tầng.
  - `dutiyaṁ` (29.1) = 2, khớp số `2.` của `0.4`.
  - `dasevimā vassadasā` (12.1) = `dasa` 10 `eva` (chỉ) × `vassadasā` (mỗi `dasā` là một thập niên, 10 năm) = 10 × 10 = 100 năm; dịch “mười thập niên” (không đổi thành 100 để giữ cấu tạo Pāli). Đây là cách đọc `dasā` theo nghĩa “thập niên”, không có tiền lệ trong tầng (0 khoá `vassadas-`).
  - `catasso` (25.1) = 4, “bốn phương”.
  - `satañca` (4.4) = `sata` 100, “một trăm”; Pāli không nói trăm cái gì (xem bất định 3).

  **Thuật ngữ và tiền lệ, đã đo:**
  - `isi` (5.2, 7.4, 8.3, 21.2) → “ẩn sĩ”, theo `ja497`. Trong 28 khoá `ja` chứa `isi`/`isayo`/`isī`: “ẩn sĩ” 11, “đạo sĩ” 7, “thiền hiền” 5, “hiền triết” 1, “tiên” 1, khác 3; “ẩn sĩ” là dạng nhiều nhất.
  - `rāja` hô cách (11.1, 13.4, 24.3, 27.1) → “tâu đại vương”: trong 38 khoá `ja` có `rāja` hô cách, “tâu đại vương” 12, “hỡi vua” 9, “tâu vua” 2, khác 15. `deva` hô cách (3.3) cũng “tâu đại vương” (theo `ja509:14.4`, `ja306:1.1`).
  - `janinda` (15.1, 24.1) → “chúa loài người”, theo `ja456:1.1`, `ja411:3.4`; trong 19 khoá `ja` chứa `janinda`: “chúa” 11, “vua” 2, “nhân chủ” 2, khác 4.
  - `khattiya` → “Sát-đế-lợi”: 397/519 khoá chứa `khattiy-` trong toàn tầng dùng dạng này (khác 110, “vương” 12). `brāhmaṇa` → “bà-la-môn”, `samaṇabrāhmaṇa` → “sa-môn và bà-la-môn”.
  - `caṇḍāla` → giữ nguyên Pāli “caṇḍāla” (15.2, 15.4, 16.1), theo `ja362:4.2`, `ja474:5.1`, `ja474:8.2`, `ja487:11.2`–`13.2` (6/6 khoá `ja` chứa `caṇḍāl-` đều giữ Pāli “caṇḍāla”, kể cả `ja474:5.1`); `mn93`, `mn96`, `sn3.21` dịch thành “Chiên-đà-la”/“người phẫu uế” nên không có dạng thống nhất toàn tầng. `yoni` ở 15.2 → “thai sinh”, `gabbha` ở 15.4 → “thai”.
  - `ukkusa` (16.3) → “ó cá”; tầng không có khoá nào dịch chim `ukkusa` (các khoá `ja486` giữ tên riêng “Ukkusa”), 0 tiền lệ; xem bất định 6. `miga` (16.2) → “nai”: tầng `ja` có 8 khoá `migā`: “thú” 3, “nai” 2, “hươu” 2, khác 1; chọn “nai” (`ja202:1.2`), vì ở 16.2 `migā` đi cùng địa danh và chim, không có tín hiệu “thú nói chung”.
  - `nārīgaṇa` (10.2, 27.2) → “đoàn nữ nhân”, theo `ja483:17.3` (1 khoá `ja` chứa `nārīgaṇ-`).
  - `gāmavara` (4.4) → “làng thượng hạng”, theo `ja456:12.1`, `ja441:14.4` (10 khoá `ja` chứa `gāmavar-`: “thượng hạng” 4, “ưu tú” 4, “làng mạc” 1, khác 1).
  - `mudiṅga` (7.1) → “trống mudiṅga” theo `ja470:15.1`; `bheri` (7.1) → “trống bherī” (tầng có “trống lớn” ở `an4.114`, `an5.140`, `dn16:5.18.8`; chọn giữ tên để phân biệt với `mudiṅga`); `saṅkha` → “tù và” theo `dn16:5.18.8`, `dn17:1.3.11`.
  - `agha` → “lễ vật tiếp đãi” theo `ja509:3.3`, `dn19:44.14`.
  - `sīlavata` (8.3) → “giới và hạnh nguyện”: 0 tiền lệ cho dạng ghép này; `vata` hiểu là hạnh nguyện, không phải cấm giới.
  - `mada` (27.1) → “say đắm” theo `ja497:6.2` (`dn19:46.18`).
  - `kāma` → “dục lạc” (21.3, 22.3, 24.2).
  - `dhanesanā` → “tìm cầu của cải”, 0 tiền lệ trong tầng.
  - `bali` (24.3) → “thuế cống”: `mil5.2.3:3.2`, `3.6` dịch `bali` là “cống”/“nộp cống”; xem bất định 5.
  - `nābhisambhoti gantuṁ` (22.2) → “không thể đi đến được”; `anubbajāmi` (22.4) → “không theo được”: xem bất định 4.
  - `maccu` (14.2) → “tử thần” (theo `ja509:13.4`), `antaka` (14.3) → “thần chết” (theo `sn3.4:4.1`): hai chữ Pāli khác nhau, giữ hai chữ Việt khác nhau.
  - `vassadasā` xem phần số.

  **Dấu câu.** Nháy kép `“”` và nháy đơn `‘’` khớp Pāli từng khoá, lệch 0/117 khoá (đã thử từng khoá, không chỉ cân tổng). Pāli có 15 cặp nháy kép mở/đóng cân (`1.1`–`2.4`, `3.1`–`3.4`, `4.1`–`4.4`, `5.1`–`5.4`, `6.1`–`7.4`, `8.1`–`8.4`, `9.1`–`9.4`, `10.1`–`10.4`, `11.1`–`20.4`, `21.1`–`23.4`, `24.1`–`28.4`) và một cặp nháy đơn lồng (`5.3`–`5.4`). `28.4` Pāli kết `”ti.` được dịch thành `”.`. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 ⇒ không có `…pe…`, không có `(…)` trần.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `Na kammunā kiñcana moghamatthi` (1.2, 2.2, 3.2): `kammunā` là công cụ cách; dịch “không có nghiệp nào là vô ích chút nào”. Cách đọc khác: “không có gì do nghiệp mà thành vô ích”. Cả hai cùng ý “mọi nghiệp đều có quả”.
  2. `Iddho mano` (2.4, 3.4): `iddha` “thịnh vượng, hưng thịnh”, `mano` dịch “tâm”; có thể `mano` ở đây gần nghĩa “ước nguyện”. Dịch “tâm … thịnh vượng”, chưa phân xử được. Người nói của 1–3 suy từ ngữ cảnh (1: Citta; 2: Sambhūta, đã là vua; 3: một người đáp, nói với vua) và không ghi vào thân kinh.
  3. `Dadāmi te gāmavaraṁ satañca` (4.4): Pāli không nói “một trăm” là trăm gì; dịch “và cả một trăm”, không bổ sung danh từ. `gāmavara` cũng có thể đọc là “ân thưởng là một làng” (`vara` “điều ban”); chọn “làng thượng hạng” theo `ja456`, `ja441`. `sutamaññato te` (4.1): đọc là “nghe từ người khác”, chủ ngữ “ngài” bổ sung theo nghĩa câu hỏi.
  4. `Passaṁ thalaṁ nābhisambhoti gantuṁ` (22.2) và `Na bhikkhuno maggamanubbajāmi` (22.4): Pāli 22.4 chỉ nói “không đi theo”; tôi dịch “không theo được” vì phép ví ở 22.1–22.2 nói rõ con voi “không thể” đến bờ và vì 21.4 nói “khó từ bỏ”; cách đọc thẳng “tôi không theo con đường của tỳ-kheo” cũng đúng ngữ pháp nhưng mất nét “bị mắc kẹt”.
  5. `Dhammiṁ baliṁ paṭṭhapayassu` (24.3): `bali` có thể là “thuế cống” (dạng tầng dịch ở `mil5.2.3`) hoặc “lễ vật/phẩm cúng”; ngữ cảnh 24.3–24.4 (“trong nước của ngài”, “chớ để việc phi pháp”) hợp với “thuế cống đúng pháp” hơn, và 25–26 là việc bố thí riêng. Dịch “thiết lập thuế cống đúng pháp”; chưa phân xử được hẳn.
  6. `Ukkusā` (16.3): `ukkusa` thường được giải là chim ưng cá / chim ưng biển; dịch “ó cá”, không dịch “chim ưng biển”. `Tyajja` (16.4) = `te ajja`, hiểu “nay họ/chúng ta”, chọn “nay chúng ta” theo 16.1–16.3 (`ahumha`, `avasimha`). `Brāhmaṇakhattiyā` (16.4) hiểu là hai người (một bà-la-môn và một Sát-đế-lợi), nhưng không viết “hai” vào thân kinh.
  7. `Karohi okāsamanuggahāya` (10.3): `okāsaṁ karohi` có thể là “hãy cho phép / hãy tạo cơ hội”, và `anuggahāya` “vì sự giúp đỡ, vì lòng thương” (ai giúp ai không nói rõ). Dịch “Xin hãy tạo cơ hội, vì sự giúp đỡ”, không thêm tân ngữ. `Nārīgaṇehi paricārayassu` (10.2): dịch “hãy để các đoàn nữ nhân hầu hạ ngài”; `paricārayassu` cũng có thể là “hãy vui hưởng với …”.
  8. `Rajassirāni` (19.4): 0 tiền lệ trong tầng; dịch sát cấu tạo “lấy bụi (trần) làm đầu” (`rajas` + `sira`). Cách đọc khác: “nghiệp làm bụi rơi lên đầu” hoặc “nghiệp nhuốm bụi ở đầu mối”. Chưa phân xử được; `raja` ở tầng thường dịch “bụi” (`dn3:2.21.6` “Pháp nhãn không bụi”).
  9. `Dukkhudrayāni` (17.4): `udraya` “kết cục, kết quả”; dịch “có kết cục là khổ”; 0 tiền lệ.
  10. `Apattaññeva taṁ odhiṁ, naḷo chinnova sussati` (12.3–12.4): Pāli không có chủ ngữ; không thêm “người ta”, giữ nguyên chủ ngữ ẩn. `odhi` “giới hạn, ranh”: hiểu là giới hạn mười thập niên của 12.1.
  11. `Abbhokāsasayo jantu, vajantyā khīrapāyito; Parikiṇṇo suvānehi, svājja rājāti vuccatī` (28): `vajantyā` là nữ tính, công cụ cách của `vajantī` “người/con (cái) đang đi”; dịch “một người nữ đang đi qua”, nhưng chưa chắc là người; có thể là một con vật cái. 0 tiền lệ trong tầng. `Parikiṇṇo` đọc “vây quanh”, không thêm “được” hay “bị”. Người nói và nghĩa tượng trưng của kệ không có trong tầng Pāli đã ghim; không bổ sung.
  12. `Paṭigāhi gāthaṁ` (5.3): dịch “đáp lại bài kệ”; `paṭigāhi` cũng có thể là “nhận lấy (bài kệ)”. Người nói của 5.1–5.4 và 6–10, 11–20, 21–23, 24–28 suy từ ngữ cảnh và nháy, không ghi vào thân kinh: 4: vua Sambhūta; 5: người đáp kệ 3 (không phải Citta), thuật lại lời một ẩn sĩ; 6–8: vua; 9: những người đến đón; 10: vua; 11–20: ẩn sĩ; 21–23: vua; 24–28: ẩn sĩ.
  13. `Antakenādhipannassa` (14.3) dùng lại “Khi bị thần chết chi phối” của `sn3.4:4.1`, vì đó là khoá trùng nguyên văn; đại từ ngôi một ở 14 là “ta”, nhưng ở 21–23 (vua nói với ẩn sĩ) dịch “tôi” để giữ nét kính trọng; `8` và `4` (vua nói một mình hoặc với người dưới) dịch “ta”.

