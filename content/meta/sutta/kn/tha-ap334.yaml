notes: |-
  Dịch trực tiếp từ Pāli root đã ghim; đủ 32/32 khoá trong `all` của lát n2.
  ĐỘ ĐO `:0.3` (lát n2 đo lại, đi đúng hướng lát s7 là so với Pāli): Pāli của ba bài trong
  lát đều KHÔNG có số ở `:0.3` (`Udakapūjakattheraapadāna`, `Dhajadāyakattheraapadāna`,
  `Pāṭalipupphiyattheraapadāna`) ⇒ BỎ số thứ tự ở `:0.3`. Trong nhóm 242 bài tha-ap mà Pāli
  `:0.3` không có số và bản Việt đã dịch `:0.3`, bản Việt cũng không có số ở 240/242 =
  99,2% (lát s7 đo 289/291 = 99,3%; tôi đo lại trên nhóm khác mẫu nên con số hơi lệch).
  Nhóm đối chứng Pāli CÓ số thì đa số Vẫn giữ (66/115), nên quy tắc là khớp Pāli chứ không
  phải bỏ hết. Số thứ tự đặt ở khoá đóng `:9.1` theo `dutiyaṁ`; đo `dutiyaṁ` toàn tầng:
  263/270 dùng `Thứ hai`.
  CÔNG THỨC `:0.3` đo trên 242 bài cùng nhóm: `Bài Kệ Tuyên Ngợ …` 128 (52,9%),
  `Ký Sự …` 66 (27,3%), `Bài Kệ Tuyên Ngôn …` 46 (19,0%) ⇒ chọn `Bài Kệ Tuyên Ngợ`.
  Cả 242 bài ấy đều GIỮ tên Pāli của bậc trưởng lão trong tiêu đề, không dịch danh tạo.
  TIỀN LỆ ĐẾM ĐƯỢC: 0.1 `Therāpadāna` 348 bài đã dùng nguyên văn (đối lập `Trưởng Lão
  Ký Sự` 9); 0.2 `Gandhodakavagga` → `Phẩm Gandhodaka` 2/2 trong cùng phẩm, và 357/357 bài
  tha-ap dùng tiền tố `Phẩm `; 0.3 công thức nêu trên; 8.1 trùng nguyên văn với tha-ap108
  nên dùng lại đúng một cách: `Tôi nghe như vầy: Tôn giả Trưởng lão Udakapūjaka đã nói
  những bài kệ này.`; 7.1 `Bốn vô ngại giải,` 365 bài trùng; 7.2 `…pe…` → `…` 637 bài
  trùng; 7.3 `đã làm tròn lời dạy của Đức Phật”.` 332 bài trùng.
  DÙNG LẠI NGUYÊN VĂN khi Pāli trùng: `ākāse ukkhipiṁ ahaṁ;` 2 bài (`tôi rải giữa hư
  không cúng dường;` — tôi giữ vị ngữ `tung lên … để cúng dường` cho khớp chủ ngữ `Ta`
  của câu trước); `Antalikkhe ṭhito satthā` 3 bài, đa số `Bậc Đạo Sư đứng giữa hư không,`
  (2) vs `Đức Thầy Tạng…` (1); `Mama saṅkappamaññāya` 6 bài `Nhờ thấu rõ ý định của ta,`
  và 5 `…của tôi` — chọn `ta` để đồng bộ với ngôi kể của bài; `Tena kammena dvipadinda`
  3 bài `Nhờ vào nghiệp ấy, bạch Đấng Lưỡng Túc Tôn,`; `lokajeṭṭha narāsabha` 3 bài `bậc
  Trưởng Thượng thế gian, đấng Nhân Ngưu;`; `Pattomhi acalaṁ ṭhānaṁ` 3 bài `Tôi đã chứng
  đắc cảnh giới bất động,`; `hitvā jayaparājayaṁ` 6 bài `buông bỏ cả thắng lẫn bại.`
  `Sahassarājanāmena` trùng 1 bài (tha-ap41) là `Đều mang tên gọi là Sahassarāja,` — tôi
  bỏ chữ `Đều` vì câu kế tiếp `tayo ca` (`và ba vị…`) là số nhiều, `Đều` sẽ vỡ ngữ pháp.
  LỆCH CÓ CHỦ ĐÍCH, ghi lại để biên tập gộp: `Sahassarāja` để nguyên Pāli (tiền lệ 348 bài
  cũng để nguyên tên Pāli); `Padumuttara` để nguyên Pāli.
  BẤT ĐỊNH ĐÃ GHI, KHÔNG BỊA: (1) `cāturantā janādhipā` (6.4) — `cāturanta` chỉ có thêm
  một chỗ trong toàn Pāli ghim (`ja488:4.3`, dịch `trái đất vắt ngang tới bốn cõi`) và
  KHÔNG có bản Việt nào cho `cāturantā`; tôi dịch theo mệnh đề chính `là bốn vị chúa tể
  muôn dân.` (`janādhipā` có tiền lệ `có tám vị chúa tể muôn dân`, `có các vị chúa tể
  nhân quần`) và KHÔNG thêm nghĩa `bốn biên cương` vào thân kinh. (2) `Pañcasaṭṭhikappasate`
  (6.3) — đo `kappasate` trong tầng: `Aṭṭhārase kappasate` → `Vào một ngàn tám trăm kiếp
  trước,` và `Catuttiṁse kappasate` → `Vào ba mươi tư trăm kiếp trước,`, tức `kappasate`
  mang nghĩa TRĂM kiếp; `pañcasaṭṭhi` = 5 × 60 = 300 ⇒ 300 trăm = ba mươi ngàn, nên dịch
  `trong ba mươi ngàn kiếp,`. Đây là suy luận có số đếm đi kèm, không phải tra từ điển.
  (3) `Kappasatasahassampi` (4.3) = 100 × 1000 = trăm ngàn kiếp; đối chiếu
  `Satasahassito kappe` → `Vào một trăm ngàn kiếp trước đây,`.
  (4) `Sampaṭicchi mahāvīro` (2.3) — `sampaṭicchi` nghĩa là đón tiếp/đáp lễ (đối chiếu
  `mil4.6:1.1` `“sādhū”ti sampaṭicchitvā` → `thốt lời Lành thay rồi`), nên dịch `Đại anh
  hùng đã đón tiếp,`; `kāruṇiko isi` có tiền lệ `aggo kāruṇiko isi` → `là bậc đầu tiên,
  là vị Ẩn Sĩ có lòng từ bi`, nên dịch `vị đại hiền đầy lòng thương xót`.
  (5) `anilañjas` (1.2) dịch `không hề lay chuyển` theo đúng Pāli trùng ở tha-ap65
  (`đang bước đi không lay chuyển;`) và tha-ap66 (`Ngự ấy tựa gió không lay chuyển`).
  (6) `pītiuppādanena` (4.2) chỉ có 2 khoá trong toàn Pāli ghim và 0 bản Việt; dịch theo
  nghĩa từ `pīti` (hoan hỷ) + `uppāda` (khởi lên) ⇒ `cùng sự hoan hỷ khởi lên`, ghi ở đây
  vì đây là chỗ duy nhất tôi phân tích từ mà không có bản Việt nào để đối chiếu.
  TRÙNG LẶNG BÀI KHÁC CẦN BIẾT: `tha-ap108` là CÙNG một vị trưởng lão Udakapūjaka và
  trùng gần như toàn bộ 24 câu kệ của bài này (`Suvaṇṇavaṇṇaṁ sambuddhaṁ` … `cāturantā
  janādhipā`), chỉ khác ở phẩm (`Bhikkhadāyivagga`) và số thứ tự (`chaṭṭhaṁ` thay cho
  `dutiyaṁ`). Tệp Việt của tha-ap108 trên đĩa mới dịch được 1/32 khoá (`:8.1`), nên không
  có câu nào để dùng lại; tôi không sửa tha-ap108 vì ngoài lát của tôi. Người biên tập nên
  biết hai uid này là trùng nội dung ở tầng upstream.
  `technical_integrity` = 9,6 vì bị cấm chạy cổng: chưa chạy `npm run validate`, `npm test`,
  `npm run check`, `npm run build`. Đã tự kiểm: đủ 32/32 khoá, NFC, cân ngoặc kép trên cả
  bài (mở ở 1.1, đóng ở 7.3), `…pe…` giữ đúng một `…`, không Pāli lọt vào bản Việt, không
  trùng nguyên văn Pāli — tất cả đều qua `_hvi.py` `kiểm()`.
  SỬA SAU REVIEW ĐỐI KHÁNG (đã ghi vào tệp dịch): 1.3 và 1.4 bản nháp đầu dịch trùng nghĩa
  — cả hai đều là `thiêu rụi nhà`, trong khi Pāli phân biệt `Ghatāsana` (lửa thiêu rụi
  LÀNG) với `Ādittaṁva hutāsanaṁ` (lửa đã đốt phá NHÀ). Đã sửa thành `rực rỡ tựa ngọn lửa
  thiêu rụi cả làng,` + `tựa ngọn lửa đã đốt phá nhà cửa.`; việc này cũng làm 1.4 khớp với
  tha-ap374:3.4 về hình thức so sánh.