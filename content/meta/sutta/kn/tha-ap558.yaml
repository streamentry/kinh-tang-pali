notes: |-
  Dịch trực tiếp từ Pāli root (tha-ap558, 158 khoá, đủ mọi khoá, đúng thứ tự Pāli); không có bản Anh của Sujato, không có Việt hiện hành, không có lớp english-project cho bài này, nên tam giác đối chiếu chỉ còn Pāli cộng tiền lệ trong phẩm Therāpadāna đã dịch.
  Tên phẩm `:0.2` Yasavagga dịch là Phẩm Yasa, theo 8/9 bài liền kề tha-ap553–563 (tha-ap557 là bài duy nhất viết Phẩm Danh Vọng).
  Tên bài `:0.3` Uttarattheraapadāna không có số thứ tự ở Pāli nên không thêm số; translationTitle bằng đúng giá trị `:0.3`. Hình thức Ký Sự Về Trưởng Lão theo đa số phạm vi gần nhất (tha-ap540–563: 15 bài Ký Sự Về so với 2 bài Bài Kệ Tuyên Ngợ); toàn tầng tha-ap thì Bài Kệ Tuyên Ngợ 255, Bài Kệ Tuyên Ngôn 137, Ký Sự Về 134 — hai phạm vi cho đa số khác nhau, người biên tập nên phán một lượt cho cả cuốn.
  Số: Tiṁsakappasahassamhi (35.1) đọc tiṁsa là 30, nghĩa là ba mươi ngàn kiếp trước, theo chỉ dẫn của người biên tập và tiền lệ 13 khoá (Vào ba mươi ngàn kiếp trước đây); tầng Anh đã ghim không có bản nào độc lập để phân xử cách đọc khác (ba nghìn hoặc ba trăm nghìn kiếp) nên đây vẫn là bất định về nguyên tắc. Các số khác tự tính: bāttiṁsa 32 (ba mươi hai tướng), saṭṭhi 60 và tiṁsa 30 (sáu mươi do-tuần cao, ba mươi do-tuần rộng), sahassa 1.000 (nghìn tấm vách), satasahassa 100.000 (một trăm ngàn ban công), saṭṭhi 60 nhân sahassa 1.000 là 60.000 (sáu mươi ngàn nhạc cụ), yojanasata 100 (một trăm do-tuần), satānaṁ pañcakkhattuṁ là 5 lần trăm tức 500 lần và tīṇikkhattuṁ là 300 lần, tīṇi pupphāni 3 đóa hoa, sattavassa 7 tuổi, catasso 4 (bốn vô ngại giải), duve 2 (hai cõi hữu, hai dòng tộc).
  Dùng lại nguyên văn bản Việt đã có cho các vế trùng Pāli: công thức quả báo buddhapūjāyidaṁ phalaṁ (đây là quả báo của việc cúng dường Đức Phật), công thức cetanāpaṇidhīhi ca, sau khi từ bỏ thân người, tôi đã đến cõi trời Ba mươi ba, bậc Tối Thượng Nhân đã ngồi, hai vế quả cung điện Có nghìn tấm vách, trăm ngọn tháp và Một trăm ngàn ban công (cùng Pāli ở tha-ap339), vế Sau khi xếp chân kiết già (cùng Pāli ở tha-ap413), vế Bāttiṁsavaralakkhaṇo (cùng Pāli ở tha-ap125), công thức Kilesā jhāpitā và ba khoá Svāgataṁ vata me āsi, Paṭisambhidā catasso, kataṁ buddhassa sāsanaṁ, và công thức Itthaṁ sudaṁ (nhóm Tôi nghe như vầy: Tôn giả Trưởng lão … đã nói những bài kệ này, 407 khoá). Ngôi kể là tôi cho cả bài, theo bài liền kề tha-ap557 và tha-ap559, dù nhiều bài trùng Pāli dùng ta.
  Dấu lược: ba khoá `…pe…` (36.2, 37.2, 38.2) giữ đúng một dấu lược; Pāli không có dấu lược trần hay (…) nên Việt cũng không có. Ngoặc kép mở ở 1.1 và đóng ở 38.3 khớp Pāli từng khoá; Pāli không có nháy đơn nên bản Việt không có.
  Bất định đã ghi, không thêm vào thân kinh: (1) 5.1 Vanaggā, đọc là đỉnh rừng (tiền lệ tha-ap425 Vanagge là đỉnh rừng), chủ ngữ của nikkhamitvāna là các tia hào quang buddharaṁsī (abhidhāvare ở ngôi ba số nhiều). (2) 11.4 yenicchakā yadicchakā, dịch sát tùy nơi muốn, tùy ý thích; chưa phân xử được chủ thể (các chiếc ghế hay cách dùng). (3) 12.3 Uddhalomiñca ekantaṁ, đọc thành một món là tấm trải có lông dựng ở một mặt (uddhalomi cùng ekanta), không phải hai món; chưa kiểm chứng độc lập. (4) 16.2 tālehi, dịch chũm chọe theo tiền lệ thông dụng của tầng, nghĩa vỗ tay cũng có thể. (5) 30.4 mahāsālesu aḍḍhake, số nhiều rồi số ít; dịch những gia đình đại phú, giàu có. (6) 29.3 vevaṇṇiyaṁ dịch nước da xấu xí, chưa có tiền lệ cùng bộ. (7) 30.1 Rơi khỏi cõi trời theo đa số tầng (11 khoá so với 1 khoá mệnh chung). (8) 35.3 Duggatiṁ nābhijānāmi dịch Tôi không còn biết đến đọa xứ nào (99 khoá, cùng nhóm với 557) thay vì dạng Ta không biết mình rơi vào khổ đau (138 khoá).
  Thuật ngữ kèm số đếm: như ý túc (iddhipāda) 322 khoá so với thần túc 53; vô ngại giải 586 khoá so với tuệ phân tích 1 khoá; nhiệt não 113 khoá; Ba Mươi Ba (chư thiên) 165 khoá so với Ba mươi ba (cõi trời) 65 khoá, giữ hai dạng như tiền lệ; viễn ly (viveka) theo 6 khoá cùng Pāli ở tha-ap383; Sát-đế-lợi và Bà-la-môn theo tha-ap530/533.
  Cổng kỹ thuật chưa chạy trong lượt này nên technical_integrity đặt 9.6, cần chạy thêm `npm run validate`, `npm test`, `npm run check` và `npm run build`. Kết quả tự đo: tập khoá Việt bằng tập khoá Pāli (158/158, đúng thứ tự); ngoặc kép khớp Pāli ở 158/158 khoá; ba nhóm Pāli trùng nguyên văn trong bài (104 cặp) đều cho bản Việt giống nhau; không có dấu lược thừa hay thiếu; chuẩn hoá NFC, không khoá rỗng, không khoảng trắng thừa, không chữ số trong thân kinh.
