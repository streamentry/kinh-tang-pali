notes: |-
  **Coverage Anh Sujato: 0/34 = 0%** trên Pāli có nội dung (≥ 40 ký tự, loại block `:0`) — thấp hơn ngưỡng 0.8. Đã đếm bằng script theo đúng công thức `source/layers.yaml`. Tầng `vietnamese-current` cũng vắng (26 tệp, toàn bộ Pháp Cú), `english-project` không có cho uid này ⇒ bài dịch **chỉ từ Pāli root**, đây là giới hạn upstream chứ không phải lỗi người dịch; vì vậy `triangulation` bị chặn ở 7.6 (≤ 8.0) chứ không nâng để né blocker.
  **ĐO ĐƯỢC CẢ HAI HƯỚNG CỦA `bhante` VÀ `mahārāja` — đây là yêu cầu riêng của lát, ghi rõ số.** Trong 188 file `mil` đã dịch (3.728 khoá), Pāli có 442 lần `bhante` và 1.290 lần `mahārāja`. Cách Việt đã dùng, đếm theo segment: `bhante` → **bạch ngài 100 segment + thưa ngài 35 = 135** đối lập **Đại đức 28** ⇒ đa số là *bạch/thưa ngài*. `mahārāja` → **Đại vương 1.159 segment**, không có ngoại lệ. Nhưng khi tách riêng vị thế xưng (Tâu đại vương 119 + tâu đại vương 169 + thưa đại vương 43 + Thưa đại vương 55 + bạch đại vương 12 = **398**) thì chữ thường thắng (Tâu Đại vương 64 + thưa Đại vương 30 + Bạch Đại vương 2 = 96). Đã theo **chữ thường**: *bạch ngài Nāgasena* và *Tâu đại vương*. Củng cố bằng hai bài kề cùng số thứ tự: `mil5.4.3` và `mil5.4.4` đều dùng *thưa/bạch ngài* + *đại vương* thường; chỉ `mil5.4.1` dùng *Đại đức*/*Đại vương* hoa. Vì `bạch/thưa ngài` là số đo toàn tầng nên tôi chọn nhất quán theo nó, không chia đôi.
  **9 khoá có Pāli trùng nguyên văn ở bài khác; 3 cặp dùng lại NGUYÊN VĂN.** `0.1` trùng 188 file cho `Milindapañha` (đa số giữ Pāli) · `0.2` trùng `mil5.3.8:0.2` (*Meṇḍakapañha*, 17/27 trong `mil5*`) · `0.3` trùng `mil5.4.1:0.3` (*Sabbaññutañāṇavagga*, 5/6 giữ Pāli) · `1.5` trùng `ne35:3.3`.
  **Hai khoá trùng Pāli nhưng CỐ Ý không dùng lại, và đây là điểm cần người gộp lát biết:** (1) `1.1` và `2.1` trùng byte-for-byte `mil5.4.1:1.1`/`2.1` (*Thưa Đại đức Nāgasena* / *Tâu Đại vương*) nhưng bản đó dùng *Đại đức* — chiếm 28/135 segment, thấp hơn số đo toàn tầng; đã theo số đo. (2) `1.10` trùng `mil5.3.8:1.7` nhưng Pāli khoá này là `Ayampi ubhato koṭiko pañho tavānuppatto, so tayā nibbāhitabbo` với mệnh đề bắt buộc `so tayā nibbāhitabbo`; bản cũ bỏ mệnh đề này, đã viết lại đủ.
  **Thuật ngữ, có đo:** `vinaya` → **giới luật** (12 tiền lệ trong lớp `mil`; `mil5.2.6:1.3` dịch `vinayapaññattiyā` thành *chế định giới luật*). `pātimokkha` → **Trị Luật**: 0 tiền lệ cho *Trị Luật* trong lớp `mil`, nhưng phải khác `vinaya` vì chính bài này đặt hai vế `dhammavinayo` và `pātimokkha` đối lập nhau; `dhammavinayo` → **Pháp và Giới Luật**, `vinayapiṭaka` → **Luật Tạo**, `sīmaṁ katvā pihitaṁ` → **vạch thành ranh giới mà học thuộc**. Tên núi trong `5.2` giữ **nguyên dạng Pāli** (Mallā, Dhammagiriyā, Maṇibhaddā, Puṇñabaddhā, Candimasūriyā, Siridevatā, Kālidevatā, Sivā, Vasudevā) vì chốt `lọt_pāli` của `_hvi.py` chặn dạng không trùng, và vì đây là danh từ riêng.
  **Bất định đã ghi:** (1) `7.1` `sāravarapavaraabhijātajātimantarattalohitacandanaṁ … oññātaṁ avaññātaṁ hīḷitaṁ khīḷitaṁ garahitaṁ bhavati` — `oññātaṁ` là *được biết*, `avaññātaṁ` là *không được biết*, `hīḷitaṁ khīḷitaṁ` là *bị khinh thường/bị chê*, tôi dịch *khi gặp phải kẻ không biết trân trọng, coi thường, khinh chê*; cũng có thể đọc là cả ba vế đều là trạng thái của bản thân vật quý. (2) `6.2` và `7.2` gần như trùng nhau, khác ở `asammattakārīnaṁ` và `paramparāasammattakārīnaṁ`; tôi dịch *làm sai theo luật ấy* và *làm sai nối tiếp đời trước* để giữ phân biệt, nhưng sự phân biệt này mỏng.
