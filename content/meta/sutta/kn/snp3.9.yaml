notes: |-
  Rà nhất quán theo Pāli trùng 2026-10-14: khoá 1.5 — `ayamantarākathā udapādi` thiếu nghĩa *giữa* của `antarā` → thêm “giữa hai vị” (khuôn “câu chuyện này khởi lên giữa các vị/giữa họ” của `sn41.1:3.2`, `sn3.12:1.2`, `sn42.10:1.2`…); khoá 4.2 — `sakyaputto sakyakulā pabbajito` “dòng dõi Thích-ca … gia tộc Thích-ca” → “người dòng Sakya … gia tộc Sakya” (khuôn của `dn4`, `dn5`, `dn12`, `mn82`; “Thích-ca” chỉ còn ở khoá này). Khoá 4.4 — Pāli rút gọn `itipi …pe… buddho bhagavā` nhưng bản cũ chép đầy đủ các danh hiệu (thêm nghĩa ngoài Pāli của khoá): đổi thành “Quả thật … bậc Phật, Thế Tôn.” (một dấu lược, khuôn của `sn40.10:12.2`, `an7.67:14.3`). Giữ nguyên khoá 1.3 (“đại phú, danh tiếng lừng lẫy” cho `brāhmaṇamahāsālā`: “đại phú” là dạng thường dùng ở `dn`, `mn`) và 5.3 (đúng Pāli); giữ “hiền giả” cho `bho` vì cả 8 khoá trong bài dùng nhất quán.
