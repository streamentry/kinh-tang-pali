  (3) **`triangulation` bị chặn ở 7.0.** Không có bản Anh độc lập nào để đối chiếu. Tôi **không**
  tuyên bố bài này đã đối chiếu English. Nguồn đối chiếu duy nhất là Pāli ghim cùng commit và tiền lệ
  trong chính tầng `vietnamese-project`.

  **Nguồn.** `ja469` = `6. Mahākaṇhajātaka`, thuộc `Cūḷakuṇālavagga` của `Dvādasakanipāta`, Kiểu tra
  `content/catalog/sutta/kn.json` cho `sourcePath = root/pli/ms/sutta/kn/ja/ja469_root-pli-ms.json`;
  `json.dump(..., ensure_ascii=False, indent=2)` + newline cuối; đủ **53** trên **53** khoá của `all`
  và đúng thứ tự Pāli.

  **Mọi số Pāli tôi dịch, kèm phép tính — toàn bài chỉ có ba chỗ mang số.**
  * `ja469:0.4` = `6.`. Tôi **không** chép số này. Tôi liệt kê lại `Cūḷakuṇālavagga` từ chính Pāli ghim
    bằng `:0.3` rồi đếm: **20** tệp dùng chung tên phẩm này, gồm hai chuỗi `ja341`–`ja350` và
    `ja464`–`ja473`. Trong chuỗi thứ hai `ja469` là mục thứ **6** trên **10** (`ja464`=1, `ja465`=2,
    `ja466`=3, `ja467`=4, `ja468`=5, `ja469`=6) ⇒ `6.` khớp.
