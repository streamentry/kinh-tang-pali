    Kinh 50, `Pañcakanipāta`→Bộ Năm Bài Kệ 5 / Nhóm Năm Bài Kệ 16 / Bộ Năm Kệ 3 / Nhóm Năm 1 (tức
    chính tầng này còn **4** cách cho Pāli này — tôi báo ra chứ không dựng thêm cách thứ năm),
    `Chakkanipāta`→Bộ Sáu Bài Kệ 19, `Sattakanipāta`→Bộ Bảy Bài Kệ 21, `Aṭṭhakanipāta`→Bộ Tám Bài
    Kệ 9, `Navakanipāta`→Bộ Chín Bài Kệ 12, `Dasakanipāta`→Bộ Mười Bài Kệ 11,
    `Ekādasakanipāta`→Bộ Mười Một Bài Kinh 4.
  * `:0.3` `Cūḷakuṇālavagga` → **Phẩm Cūḷakuṇāla**, **14/14**, không ngoại lệ.
  * `:0.4` theo khuôn `<số>. Kinh <tên>`: **455/455** tệp `ja` có khoá `:0.4` khớp `^<số>. `.
    (Số của lát trước là 417/451; tôi đo lại ra 455/455 và tin phép đo của mình.)
  * `translationTitle` = `:0.4` **bỏ** số thứ tự: **413/452**; giữ số **30/452**; khác hẳn **9/452**.
    Tôi theo đa số, viết **Kinh Mahākaṇha**. Bài anh em `ja468` đặt `translationTitle` kèm số — tôi
    vẫn theo đa số đo được, vì số thứ tự thuộc về dòng `:0.4` chứ không thuộc trường tiêu đề.
  * Dòng kết `:13.1`: không dấu phẩy trước *thứ N* là **71**, có dấu phẩy **66**, tổng **137** →
    tôi viết **Kinh Mahākaṇha thứ sáu.** theo phía đông đa số (và khớp `ja464`/`ja468`).

  **Tên riêng: giữ `Kaṇha`, không bịa loài vật.** `kaṇha` nghĩa là *đen*, và tầng đã có tiền lệ giữ
  tên Pāli cho loài vật có tên: `ja29` `9. Kaṇhajātaka` → *Kinh Con Bò Kaṇha*, và `ja101` giữ *Kinh
  Parosata*. Pāli ghim **không** nói loài vật nào: ở `1.4` người nói gọi `sunakho tava` = *o con chó*,
  nên người đọc biết đây là loài chó — nhưng *chồn*/*sói*/*gấu* là suy đoán của tầng dịch, không có
  trong root. Tôi vì thế giữ **Kaṇha** và để `con chó` ở `1.4` làm chứng cứ duy nhất cho loài; xem mục
  bất định (1).

  **Dùng lại nguyên văn bản dịch ở bài khác — đo bằng script.** Tôi dựng chỉ mục Pāli→Việt trên **5421**
  tệp Việt của kho (**156.252** cặp `(uid, khoá)`; hai số này chụp lúc đo, và tầng đang lớn thêm vì
  nhiều lát chạy song song — khi đo lại có thể cao hơn, phần `601` cặp trùng Pāli thì không đổi),
  rồi so **nguyên văn** từng khoá của `ja469` với
  **5764** tệp Pāli ghim: **601** cặp trùng byte-for-byte với bài khác, liên quan **12** khoá trên **53**.
  * **9** khoá **dùng lại nguyên văn** bản dịch đã có: `0.1` *Jātaka* (khớp hàng trăm tệp),
    `0.2` *Bộ Mười Hai Bài Kinh*, `0.3` *Phẩm Cūḷakuṇāla* (**14/14**), `3.2`+`4.2`
    *đầu cạo trọn, mặc y ngoài;* (nguyên văn `thig2.7:2.4`), `7.1`+`8.1` *Mẹ cha cũng vậy,*
    (nguyên văn `thag6.9:3.1`), `7.2`+`8.2` *đã già yếu, tuổi xuân đã qua;* (nguyên văn
    `ja468:8.2`).
  * **3** khoá **chưa bài nào trong kho có bản Việt** nên tôi đặt mới: `5.2` (`ja547`, `ja495`,
    `tha-ap414`, `tha-ap3`), `10.2` (`ja495`), `11.1` (`ja547:186.1`).
  * **0** khoá nào tôi cố ý dịch khác bản đã có.
  Vì sao `7.2`/`8.2` không dùng bản của `snp1.6:9.2` (*Khi họ đã già, tuổi thanh xuân đã qua,*): ở
  `snp` câu đó mở một mệnh đề có động từ (`Yo mātaraṁ pitaraṁ vā … na bharati`), còn ở `ja469` nó là
  thành ngữ bổ nghĩa sau *Mẹ cha cũng vậy,*; dùng bản của `snp` sẽ sinh một mệnh đề quan hệ mà Pāli
  không có. Tôi dùng bản của `ja468` vì đó là cùng phẩm và cùng chức năng cú pháp.

  **Trùng nguyên văn TRONG CHÍNH bài — đo bằng script.** **5** nhóm / **17** khoá trên **53**:
  `tadā kaṇho pamokkhati.` (**9** khoá), `Mātaraṁ pitarañcāpi,` (**2**), `jiṇṇakaṁ gatayobbanaṁ;`
  (**2**), `Yadā loke gamissanti,` (**2**), `muṇḍā saṅghāṭipārutā;` (**2**). Nhóm Việt khác nhau:
  **0/5**. Lượt review đối kháng bắt được **1** lỗi thật ở đây: tôi đã gõ `4.3` là *Khi họ ra khỏi thế
  giới này,* mà `9.3` lại là *Khi họ rời khỏi thế giới này,* trong khi Pāli hai khoá trùng byte. Đã
  sửa `9.3` cho trùng `4.3`.

  **Dấu lược.** Bài này **không** có khoá nào chứa `…pe…`, `…` trần hay `(…)` — đếm trên **53** khoá,
  cả hai vế đều **0**. Nên không có dấu lược nào để bung hay để cắt.

  **Ngoặc kép — theo đúng vị trí Pāli, và cân ngay.** Pāli ghim có **3** dấu `“` (`1.1`, `2.1`,
  `3.1`) và **3** dấu `”` (`1.4`, `2.4`, `12.4`). Tôi đặt **3** và **3** ở đúng ba khoá mở và ba khoá
  đóng ấy. Lưu ý cấu trúc: lời mở ở `3.1` **không** đóng ở `3.4` mà kéo tới `12.4` mới đóng — nghĩa
  là `3.1`–`12.4` nằm trong một lời kêu dài. Tôi giữ đúng vị trí Pāli, không sửa cấu trúc này.

  **Bất định, ghi ở đây chứ không thêm vào thân kinh.** Bốn cụm dưới đây là hapax trong **toàn bộ**
  Pāli ghim, và bài không có bản Anh nào để phân xử; tôi dịch theo thành phần và nêu rõ, không tuyên bố
  là đã giải quyết.
  (1) **`kaṇha`/`kaṇho`** — tôi giữ tên **Kaṇha**. Nếu người biên tập muốn *Kẻ Đen* thì chấp nhận
  được (`kaṇha` = đen), còn *chồn*/*sói*/*gấu* thì không: Pāli chỉ cho ta `sunakha` = *con chó*.
  (2) **`usīnaka`** (`2.2`) — **1** lần trong cả Pāli ghim. Tôi dịch *con chồn*. Căn cứ ngoài tầng:
  từ điển Myanmar–Pāli ghi `usīnaka` ⇄ `ဥသီနက`, mà `သီကျ` là *jackal*. Đây là nguồn ngoài kho, tôi
  ghi rõ là nguồn ngoài, không phải bằng chứng trong tầng.
  (3) **`Dīghottaroṭṭhā`** (`5.1`) — **1** lần trong cả Pāli ghim. Tôi tách `dīgha` + `oṭṭha/roṭṭha`
  (`roṭṭha` = hủy hoại, đã thấy ở `ja250:5.3`) và dịch *Tàn tưới hủy hoại,*. Có thể đọc khác; tôi
  không có gì để chọn giữa các cách đọc.
  (4) **`Sukkacchavī vedhaverā`** (`11.1`) — **2** lần trong cả Pāli ghim (`ja469:11.1` và
  `ja547:186.1`), và **không** bài nào trong kho có bản Việt. Tôi dịch từng thành phần:
  `sukkacchavī` = có mào trắng, `vedhaverā` = những sợi gân ⇒ *Mào trắng, gân bạch,*. Ngữ cảnh
  `ja547:186` (`ulūkaññeva vāyasā`) là loài vật, nên cách đọc “mào trắng” không vô lý; nhưng tôi **không**
  tuyên bố đã phân xử, và `asappurisacintakā` (`12.2`) cũng là **1** lần trong cả Pāli ghim — tôi dịch
  *nghĩ tưởng bất thiện*.
  (5) **`Yadā loke gamissanti` (`4.3`, `9.3`) vs `Yadā loke bhavissanti` (`12.3`)** — Pāli cố tình
  khác nhau: `gamissanti` = *sẽ đi*, `bhavissanti` = *sẽ có*. Tôi dịch *Khi họ ra khỏi thế giới này,*
  cho hai khoá `gamissanti` và *Khi họ sinh ra ở thế giới này,* cho `bhavissanti`, để giữ khác biệt.
  Cách đọc cạnh tranh là “ra đến thế giới này” (tức *sinh ra*); tôi chọn cách ít giả định theo nghĩa
  động từ, và **không** gộp hai khoá về một cách.
  (6) **`Pahū santo na bharanti`** (`7.3`) — **1** lần trong cả Pāli ghim; gần giống `snp1.6:9.3`
  `Pahu santo na bharati` mà kho đã dịch *Dù có khả năng cũng không nuôi dưỡng*. Tôi giữ nghĩa *đủ
  sức* cho `pahū` nhưng dịch `bharanti` là *đem họ đi* chứ không phải *nuôi dưỡng*, vì mệnh đề chốt
  của cả khúc là `pamokkhati` (thả ra khỏi gánh). Tôi **không** sửa bài `snp1.6` của lát khác.
  (7) **`māyāvi`** (`12.1`) — tầng đã có hai nghĩa được dịch: `dn20:10.1` `māyāvino dāsā` → *thuộc hạ
  giỏi huyễn thuật* (nghĩa máy thuật), còn nghĩa thường là *kẻ lừa dối*. Tôi giữ nghĩa có tiền lệ
  (*huyễn thuật*) vì nó không bịa; *Kẻ lừa dối* cũng là một lựa chọn chấp nhận được cho người biên
  tập. Ở đây `māyāvino nekatikā` là **cặp danh từ tính từ**, nên tôi dịch hai từ thành hai vế khác
  nhau thay vì lặp lại một nghĩa.
  (8) **`Asicammaṁ gahetvāna`** (`10.1`) — **2** lần trong cả Pāli ghim (`ja469:10.1`, `ja495`), chưa
  bài nào trong kho có bản Việt. Tôi đọc `asi-` + `camma` = *không bị trói* và dịch *Bắt một người
  không bị trói buộc,*. Cách đọc cạnh tranh là `asi` = *lưỡi dao* + `camma` = *cọng sen*; tôi chọn cách
  đọc khớp chủ đề của cả khúc (cướp đường) và **không** tuyên bố đã phân xử.
  (9) **`Adhicca vede sāvittiṁ … yaññatantañca brāhmaṇā`** (`6.1`–`6.2`) — Pāli lặp `brāhmaṇā` hai
  lần ở hai vế theo kiểu hypallage (chủ ngữ đứng sau tân ngữ). Tiếng Việt chỉ mang một lần *các
  bà-la-môn*; tôi đặt chủ ngữ ở đầu câu cho tự nhiên. Không mất ý, vì đó là cùng một danh từ.

