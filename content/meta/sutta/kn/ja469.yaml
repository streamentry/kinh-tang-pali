  `cặp cùng đơn vị để so: 211` · `số lệch: 0` · `0 tệp`, và cả ba dòng hiệu chuẩn đều in `OK`
  (`Ekanavutito` cần 0 · đo được 0 OK; `Catunnavutito` cần 0 · đo được 0 OK; `Sattatālīsito` cần 0 ·
