    bài `Dvādasakanipāta` đều chưa có bản Việt. Trong lúc tôi làm việc, ba bài anh em cùng phẩm đã
    có (`ja464`, `ja468`, `ja471`) và **3/3** dùng đúng *Bộ Mười Hai Bài Kinh* ⇒ tôi trùng khớp.
    Tôi ghép theo **giá trị Pāli**, không đếm chuỗi Việt: `Ekakanipāta`→Bộ Một Bài Kinh 150,
