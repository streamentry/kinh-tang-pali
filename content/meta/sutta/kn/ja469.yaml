  tự, bỏ khối tham chiếu `:0`): **0** khoá đạt trên tổng số **53** khoá; khoá dài nhất của cả bài chỉ
  **26** ký tự, vì toàn bộ là kệ. `validate.ts:242` có điều kiện `substantiveSegments > 0` nên cổng
  không đỏ — nhưng đó là **cổng không đo được**, **không** phải *đã đủ tham khảo*. Tôi ghi điểm này ra
  đây để không ai đọc `validate` xanh thành bằng chứng rằng bài này đã đối chiếu Anh.

  (3) **`triangulation` bị chặn ở 7.0.** Không có bản Anh độc lập nào để đối chiếu. Tôi **không**
  tuyên bố bài này đã đối chiếu English. Nguồn đối chiếu duy nhất là Pāli ghim cùng commit và tiền lệ
  trong chính tầng `vietnamese-project`.

  **Nguồn.** `ja469` = `6. Mahākaṇhajātaka`, thuộc `Cūḷakuṇālavagga` của `Dvādasakanipāta`, Kiểu tra
  `content/catalog/sutta/kn.json` cho `sourcePath = root/pli/ms/sutta/kn/ja/ja469_root-pli-ms.json`;
  `json.dump(..., ensure_ascii=False, indent=2)` + newline cuối; đủ **53** trên **53** khoá của `all`
  và đúng thứ tự Pāli.

  **Mọi số Pāli tôi dịch, kèm phép tính — toàn bài chỉ có ba chỗ mang số.**
  * `ja469:0.4` = `6.`. Tôi **không** chép số này. Tôi liệt kê lại `Cūḷakuṇālavagga` từ chính Pāli ghim
    bằng `:0.3` rồi đếm: **20** tệp dùng chung tên phẩm này, gồm hai chuỗi `ja341`–`ja350` và
    `ja464`–`ja473`. Trong chuỗi thứ hai `ja469` là mục thứ **6** trên **10** (`ja464`=1, `ja465`=2,
    `ja466`=3, `ja467`=4, `ja468`=5, `ja469`=6) ⇒ `6.` khớp.
  * `ja469:13.1` `Mahākaṇhajātakaṁ chaṭṭhaṁ.` = `cha` (**6**, chữ số Pāli) + hậu tố thứ tự `ṭṭha`
    ⇒ **6** ⇒ *thứ sáu*. Cùng kết quả với cách đếm ở trên, tức hai chỗ tự kiểm lẫn nhau.
  * `ja469:1.3` `pañcahi rajjūhi` = `pañca` (**5**) + `hi` (số nhiều) ⇒ **năm** sợi dây.
  `cặp cùng đơn vị để so: 211` · `số lệch: 0` · `0 tệp`, và cả ba dòng hiệu chuẩn đều in `OK`
  (`Ekanavutito` cần 0 · đo được 0 OK; `Catunnavutito` cần 0 · đo được 0 OK; `Sattatālīsito` cần 0 ·
  đo được 0 OK). Không có cụm số nào khác trong bài — tôi quét từng từ số Pāli và chỉ hai khoá
  trên là ra.

  **Tên phẩm và tên bài — đo lại trên chính tầng, đếm theo giá trị Pāli tuyệt đối.**
  * `:0.1` `Jātaka` → **Jātaka**: **439** trên **455** tệp `ja` có khoá `0.1` (**96,5%**), đối lập
