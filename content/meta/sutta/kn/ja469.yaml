  **Nghĩa đã sửa, kèm căn cứ.**
  * `1.1`/`1.4`: *kaṇho kaṇho ca ghoro ca* là tả con chó (đen, đen sì, hung tợn), không phải hô cách "Kaṇha, Kaṇha và kẻ ghê sợ"; `sunakho tava` là chủ ngữ (*con chó của ông*), không phải hô cách "o con chó", và `ravi` là động từ chia ở ngôi ba, không phải "ngươi sủa". Người hỏi (vua) hỏi người chủ chó, nên xưng *ông*.
  * `2.1`–`2.3`: bản cũ ("Lấy loài hươu này làm phương tiện, sẽ trở thành con chồn; Quy tụ người loài rồi") là bịa. Đúng: `nāyaṁ migānamatthāya … bhavissati` = *không vì lợi ích của loài thú … sẽ hiện hữu*; `manussānaṁ anayo hutvā` = *trở thành tai họa của loài người*. `usīnaka` là hô cách (xem bất định dưới), không phải một loài vật: đã bỏ "con chồn".
  * `3.1`–`3.3`: `pattahatthā` = *tay cầm bát*, `naṅgalehi kasissanti` = *sẽ cày bằng những chiếc cày*; bản cũ ("bị túm ở chân trước … xách đi trong giỏ") hoàn toàn không có trong Pāli.
  * `3.2`/`4.2`: *đầu cạo trọn* → *đầu cạo trọc, khoác y ngoài* — đúng nguyên văn `thig2.7:2.4`. (Mục cũ nói "mặc y ngoài" là chép sai tiền lệ.)
  * `4.1`: `tapassiniyo` là giống cái → *các nữ khổ hạnh* (bản cũ mất giống). `4.3`/`9.3`/`12.3`: `loke` là vị cách (*trong thế gian*), không phải "ra khỏi thế giới này"; `gamissanti` = *sẽ đi*, `bhavissanti` = *sẽ có mặt*.
  * `5.1`: `dīghottaroṭṭhā` = `dīgha` + `uttaroṭṭha` (môi trên) với sandhi — đối chiếu `ja547:480.3` *Dīghuttaroṭṭho* → *môi trên dài*. Bản cũ ("Tàn tưới hủy hoại") là bịa. Đây không còn là hapax chưa giải.
  * `5.3`: `iṇaṁ codāya gacchanti` = *đòi nợ rồi ra đi* (`iṇa` = nợ; `codāya` = sau khi đòi/thúc). Bản cũ "theo lời xúi của kẻ khuyết tật" không có trong Pāli.
  * `6.1`: `vede` số nhiều → *các Veda*; `sāvittiṁ` → *bài kệ Sāvitrī* (tiền lệ `snp3.4:7.3`; `mn92:26.2` viết Sāvitrī).
  * `7.1`–`7.3`: `pahū santo na bharanti` = *dù có khả năng, họ không nuôi dưỡng* (tiền lệ `snp1.6:9.3`, `ja468:8.3`); bản cũ "Người lành … đem họ đi" sai chủ thể và nghĩa. `7.1`/`8.1` dùng *Cả mẹ lẫn cha* như `ja468:8.1`.
  * `8.3`: `bālā tumheti vakkhanti` = *họ sẽ nói rằng các ngươi là kẻ ngu* (`bālā` là vị ngữ, `tumhe` là chủ ngữ); bản cũ đảo vai.
  * `9.2`: `mātulāni` = *mợ* (vợ của cậu), `pitucchakiṁ` = *cô bên cha*; bản cũ "cậu bên mẹ, dì bên cha" sai giới tính và quan hệ. `9.1` `sakhiṁ` giống cái → *người bạn nữ*. `9.3` khác `4.3` có lý do: ở đây động từ có tân ngữ là các bà ở `9.1`–`9.2` (*đi đến những người ấy*), còn ở `4.3` là nội động từ.
  * `10.1`–`10.2`: `asicammaṁ` = *gươm và khiên* (không phải "người không bị trói buộc"); Pāli trùng nguyên văn `ja495:34.1–2` và dùng lại đúng bản Việt đó (cũng khớp `ja542:133.2` *gươm và khiên*).
  * `11.1`: dùng lại nguyên văn bản Việt của Pāli trùng `ja547:186.1`.
  * `12.1`: `māyāvī` → *giả dối* (tiền lệ `mn8:16.34`); `nekatika` → *lừa đảo* (`dn32:5.4`). `12.2`: `asappurisacintakā` → *mang tư duy của người bất thiện*, theo `asappurisacintī` ở `mn110:7` (*có sự tư duy của người bất thiện*) — không còn là hapax chưa giải. `12.4`: `pamokkhatī` — bản cũ "đã tuyên bố" là bịa; đúng là *sẽ được thả ra*.
  * Điệp khúc `tadā kaṇho pamokkhati` (9 khoá) là thì tương lai: *lúc đó Kaṇha sẽ được thả ra*, thống nhất cả 9 khoá và `2.4`/`12.4`; `Kaṇho` viết chuẩn hoá *Kaṇha*. Cặp trùng nội bộ: `7.1`=`8.1`, `7.2`=`8.2`, `3.2`=`4.2`, các điệp khúc — bản Việt giống nhau; chỉ `4.3`/`9.3` khác có lý do nêu trên.
  * `10.3` `panthaghātaṁ` giữ *cướp đường*; `11.3` giữ *phá tan tình bạn* (`mittabheda`). Số Pāli: không đổi (`pañcahi rajjūhi` = 5; `chaṭṭhaṁ` = 6).

