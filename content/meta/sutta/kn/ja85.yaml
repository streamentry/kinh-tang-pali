notes: |-
  Tiền lệ đếm được: `dosa` → tai họa; `kāma` + `paṭisevati` → nếm dục lạc (dục lạc 209 tiền lệ); `vipāka` → quả báo (95 tiền lệ) và chín muồi (32 tiền lệ); `bhakkh` → ăn.
  `Kiṁpakka` là tên một cây có quả độc, không có cách Việt hóa tương đương. Cowell 85 dịch nó là What-fruit và kể cây ấy cho giống xoài nhưng ăn vào thì chết; tôi giữ chữ trong tiêu đề và trong vế 1.4 (như kẻ đã ăn quả cây Kiṁpakka) theo luật giữ thuật ngữ rồi giải thích ở notes, không dịc nghĩa thành quả độc vì Pāli không nói.
  Cowell 85 dịch bộ vế KHÁC (As they who ate the What-fruit died, so Lusts…) nhưng cùng ý. Bản Việt dịch đúng bộ vế ở Pāli root.
  1.3 `Vipākante hananti naṁ` không nêu chủ ngữ trong tiếng Pāli (chính các dục trần là thứ giết, theo Cowell); tôi dịch chủ ngữ ẩn thành chúng, không thêm danh từ nào.
  Dịch đủ 9/9 khoá từ Pāli root tại commit đã ghim, đã đọc toàn văn trong bối cảnh. 0.1 Jātaka giữ nguyên (58 bài đã có) và 0.2 Ekakanipāta → Bộ Một Bài Kinh (57 bài) theo tiền lệ đếm được. 1.1 mở nháy kép, 1.4 đóng nháy kép + dấu chấm, không giữ `ti.` (tiền lệ 51/57 bài; 10 bài mới hơn cũng bỏ). Dòng kết 2.1 dùng dấu phẩy (Kinh X, thứ N) theo làn sóng gần nhất ja108…ja119; kho còn 48 bài không dấu phẩy — ghi ở đây để biên tập chuẩn hoá sau, tôi không sửa bài ngoài lát. Tầng vietnamese-current ở commit đã ghim chỉ có Pháp Cú, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu. Chú giải Jātaka-aṭṭhakathā bằng Pāli không truy cập được trong môi trường dịch này, nên bối cảnh lấy từ truyện E. B. Cowell, The Jātaka vol. I (bản 1895, tải từ archive.org); đây là lý do triangulation không lên cao. technical_integrity 10.0 căn cứ chốt _hvi.py đã pass và tự chạy lại script kiểm bổ sung (9/9 khoá khớp Pāli, NFC, ngoặc kép cân trên cả bài, không lệch dấu lược); npm run validate|test|build không chạy theo lệnh cấm của lát.
  Sửa lan 2026-10-13: `Apāyimhavagga` — tên phẩm lấy từ vế đầu của `ja81:1.1`, mà `apāyimha` là thức aorist ngôi thứ nhất số nhiều có tiền tố `a-` (*chúng tôi đã uống*), cùng dạng với `agāyimha` (*chúng tôi đã hát*) và `anaccimha` (= `a-` + `naccimha`, *chúng tôi đã nhảy múa*); dạng phủ định phải là `na`/`nā`. Bản cũ đọc `a-` là phủ định (*Chưa Từng Uống*). Tiền lệ đo trên tầng: ở `kn` các động từ aorist ngôi 1 số nhiều có `a-` (`agamimha`, `adāsimha`, `apucchimha`, `akarimha`… 20+ khoá) đều dịch khẳng định. Khoá `ja85:0.3`: *Phẩm Chưa Từng Uống* → *Phẩm Chúng Tôi Đã Uống* (cùng tên ở `ja81`…`ja90`, một tên phẩm cho cả phẩm; `ja90:4.1` giữ `Apāyimha` là tên trong bài tóm lược, không đổi). Điểm không đổi; giữ nguyên các khoá còn lại.

  Quyết định hội đồng biên tập 2026-10-16: C3 — :0.2 (tên nhóm kệ "Nhóm N Kệ", bỏ chữ "Kinh").
