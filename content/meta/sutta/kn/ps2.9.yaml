notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim (kn/ps/ps2.9_root-pli-ms.json), đủ 265/265 khoá; thứ tự khoá = thứ tự Pāli, không khoá thừa, không khoá rỗng.

  Tầng tham khảo: tầng english-sujato không có ps2.9 (manifest đã ghim chỉ liệt kê tệp Pāli root cho uid này; thư mục sutta/kn của Sujato chỉ có cp dhp iti ja kp snp thag thig ud, không có ps); lớp english-project của dự án chưa có tệp cho ps; vietnamese-current (phantuananh) chỉ có Pháp Cú. Đây là not-published-upstream (giới hạn của bản chụp), không phải not-synced. Coverage English theo công thức của source/layers.yaml: mẫu số 153 khoá Pāli có nội dung (từ 40 ký tự, bỏ khối 0.x), tử số 0 ⇒ 0/153; 112 khoá còn lại ngắn hơn ngưỡng hoặc là khối tiêu đề. Bản tra cứu toàn văn nguyên bài ở cuối trang (không phân đoạn, alignment: none) không phải tầng store và không cấp text cho bản này. Vì vậy triangulation bị chặn ở 7,0 (≤ 8,0) và bài giữ draft; không nâng điểm để né blocker.

  Cấu trúc bài: 1.x duyên khởi tại Sāvatthī và lời nêu năm lực; 2.x nêu sáu mươi tám lực; 3–7 năm lực đầu (mỗi lực: câu hỏi, câu định nghĩa bằng bất động trước đối nghịch, khuôn chín nghĩa, câu kết); 8–10 hổ thẹn, kính sợ, suy xét theo chín cặp; 11–18 tu tập, không đáng chê trách, thu nhiếp, chấp nhận, chế định, thấu hiểu, tự tại, quyết định; 19–21 lực chỉ và lực quán; 22 lực hữu học và vô học; 23–27 mười lực của bậc đã đoạn tận lậu hoặc; 28 mười lực thần thông; 29–38 mười lực của Như Lai; 39–40 hỏi và đáp ngắn cho cả sáu mươi tám lực. Chín cặp đối trị dùng chung cho 8–18: xuất ly với dục tham, không sân hận với sân hận, tưởng ánh sáng với hôn trầm và buồn ngủ, không tán loạn với trạo cử, xác định pháp với nghi hoặc, trí với vô minh, hân hoan với sự không vui, sơ thiền với các triền cái, A-la-hán đạo với mọi phiền não; đã đối chiếu từng khoá để cặp không bị lệch.

  Số Pāli, tự tính từ danh sách trong chính bài: aṭṭhasaṭṭhi (2.1) = aṭṭha 8 + saṭṭhi 60 = 68. Danh sách ở 2.2: 5 lực đầu + 13 lực từ hổ thẹn đến quán = 18 lực lẻ, cộng 5 nhóm mười (hữu học, vô học, đã đoạn tận lậu hoặc, thần thông, Như Lai) = 50; 18 + 50 = 68, khớp. Mười pháp hữu học và vô học ở 22.x: chánh kiến, chánh tư duy, chánh ngữ, chánh nghiệp, chánh mạng, chánh tinh tấn, chánh niệm, chánh định, chánh trí, chánh giải thoát = 10. Mười lực của bậc đã đoạn tận lậu hoặc: mục 1 vô thường của các hành (23), mục 2 dục như hố than hồng (24), mục 3 tâm nghiêng về viễn ly (25), mục 4 bốn niệm xứ (26), mục 5 đến 9 là bốn chánh cần, bốn như ý túc, năm căn, năm lực, bảy giác chi (27.1 đến 27.5), mục 10 đạo tám chi (27.6, 27.7) = 10. Mười thần thông ở 28.2 đếm đủ 10. Mười lực của Như Lai ở 29–38 đếm đủ 10: có thể và không thể, quả của nghiệp, đường thực hành dẫn đến mọi nơi, thế giới nhiều giới, khuynh hướng sai khác, cao thấp của các căn, ô nhiễm và thanh lọc và xuất khỏi của thiền định, đời sống quá khứ, thiên nhãn, đoạn tận lậu hoặc. Số nhỏ khác: pañca 5, cattāro 4, satta 7, aṭṭhaṅgiko 8, ekampi 1 và dvepi 2 (36.2, 36.6); không có số lớn.

  Thuật ngữ và tiền lệ (số đếm trên tầng; khi hai phạm vi cho đa số khác nhau thì nêu cả hai):
  - bala → lực. Năm lực đầu: tín lực, tấn lực, niệm lực, định lực, tuệ lực, cùng tên với ps1.9. Các lực còn lại dùng dạng lực + từ Việt để tên đọc được (lực hổ thẹn, lực kính sợ, lực suy xét, lực tu tập, lực không đáng chê trách, lực thu nhiếp, lực chấp nhận, lực chế định, lực thấu hiểu, lực tự tại, lực quyết định, lực chỉ, lực quán), nên danh sách 2.2 pha hai dạng gọi tên; đây là chọn có chủ ý để giữ tên quen thuộc của năm lực đầu mà không đặt thêm từ Hán–Việt lạ. Tầng an dịch balāni là sức mạnh (an5.13, an10.90); ps1.9 và ps2.8 dùng lực, chọn lực vì cùng bộ. Tathāgatabala → lực của Như Lai (19 khoá trong tầng); khīṇāsavabala → lực của bậc đã đoạn tận lậu hoặc.
  - hirī → hổ thẹn (149 trên 196 khoá có hirī-; tàm 29); ottappa → kính sợ (116 trên 260; quý 69); động từ có tân ngữ là phiền não dịch hổ thẹn về và kính sợ về theo an5.2. paṭisaṅkhāti → suy xét (84 trên 117).
  - nekkhamma → xuất ly (119 trên 182; ly dục 27). abyāpāda → không sân hận (79 trên 106). kāmacchanda → dục tham (77 trên 82). avikkhepa → không tán loạn (20 trên 27). thinamiddha → hôn trầm và buồn ngủ; uddhacca → trạo cử; vicikicchā → nghi hoặc. dhammavavatthāna → xác định pháp (chỉ có tiền lệ ở tên phẩm Arūpadhammavavatthānavagga của mil). pāmojja → hân hoan (42; hoan hỷ 119), dùng hân hoan vì hoan hỷ đã dành cho nandī ở 21.15 (129 trên 301) để hai từ khác nhau không trùng trong cùng bài. arati → sự không vui (an6.13; an6.113 dùng bất lạc, an4.28 dùng bất mãn).
  - khīṇāsava → đã đoạn tận lậu hoặc (đoạn tận 145 trên 292; theo an10.90, nội dung song song 23–27). sikkhati → học tập (69 trên 201). anupassanā → quán: quán vô thường 48 trên 48 khoá có aniccānupassan-; quán từ bỏ 13 · quán buông 15 trên 41 khoá có paṭinissaggānupass-, chọn quán từ bỏ vì an7.61 dùng đúng dạng này cho bộ ba virāga, nirodha, paṭinissagga liền nhau; quán nhàm chán (an2.6 dùng chán nản), quán ly tham (22 trên 23), quán đoạn diệt. samatha → chỉ (samath- 192 khoá: an định 37 · chỉ 29 · tịnh chỉ 12; chọn chỉ vì cặp chỉ và quán ở ne28, và vì an định dễ lẫn với định lực ở bài này); vipassanā → quán (quán 99 · tuệ quán 48 · minh sát 18 trên 116).
  - sahajāta → đồng sinh (đồng sinh 2 · đồng sanh 8, ps1.9; chọn sinh để cùng chính tả với chúng sinh và tái sinh trong bài). Khuôn chín nghĩa (3.3, 4.3, 5.3, 5.4, 6.3, 6.4, 7.3, 7.4) cùng công thức ở ps1.9:1.2: giữ cách ps1.9 cho trợ duyên cho các pháp đồng sinh, diệt trừ các phiền não, làm thanh tịnh sự thông suốt và các điều tiếp theo, thanh lọc tâm, chứng đắc thù thắng, an lập trong sự tịch diệt; khác ps1.9 có chủ ý ở ba mục: adhiṭṭhāna → quyết định tâm (ps1.9 dịch an định tâm, dễ lẫn với định) để cùng gốc với lực quyết định ở bài này; uttaripaṭivedha → thông suốt cao hơn (ps1.9: thông suốt bậc cao); saccābhisamaya → thấu đạt các chân lý (theo ps3.3 abhisamaya → thấu đạt; ps1.9: thể nhập).
  - pamāda → phóng dật (169 trên 230); kosajja → biếng nhác (22; lười biếng 8); assaddhiya → không có niềm tin (8; không tin 5); samāpatti → sự chứng đạt (42 trên 269; cùng dạng ở an11.16); nevasaññānāsaññāyatana → phi tưởng phi phi tưởng xứ (quy ước 168 khoá). Tưởng về sắc, tưởng đối ngại, tưởng sai biệt (20.6) theo an10.99 (an11.16 dùng va chạm và đa dạng).
  - brahmacakkaṁ → Phạm luân: tầng dịch Pháp luân 26 · Phạm luân 2 cho cùng Pāli; chọn Phạm luân bám đúng chữ brahma của Pāli, không thêm cách giải (tiền lệ an5.11), nếu người biên tập muốn thống nhất theo đa số thì đổi ở bốn khoá 29.3, 30.2, 31.2, 38.2. āsabhaṁ ṭhānaṁ paṭijānāti → tuyên nhận địa vị của con bò đực (24 trên 40). dibbena cakkhunā … cavamāne upapajjamāne → thiên nhãn thanh tịnh, vượt trên mắt người, đang chết đi và đang tái sinh (an3.58, an11.14). pubbenivāsa → đời sống quá khứ (82 trên 110 khoá có pubbenivāsaṁ; túc mạng 14); anussarati → nhớ lại (89 trên 256; hồi tưởng 33); ekampi jātiṁ dvepi jātiyo → một đời, hai đời (68 khoá có ekampi jātiṁ; một kiếp 8). seyyathidaṁ đứng riêng → như sau đây (7 trên 7). ṭhānañca ṭhānato aṭṭhānañca aṭṭhānato → điều có thể là có thể, điều không thể là không thể.

  Bất định, ghi ở đây mà không thêm vào thân kinh:
  (1) 21.14: Pāli ghim ghi attasaññāya kampatīti, thiếu na trước kampatīti, trong khi sáu khoá song song (21.12, 21.13, 21.15 đến 21.18) và 21.19, 20.2 đến 20.10 đều có na kampati, và 40.1 đến 40.5 xác định bala là bất động (akampiya). Bản Việt đọc như có na (không dao động trước tưởng ngã) vì đọc theo chữ sẽ nghịch hẳn với mạch bài; chưa có bản Pāli độc lập trong tầng để xác nhận, nên đây là điểm cần người biên tập phán. Nếu bản Pāli đã ghim được coi là đúng nguyên văn thì khoá này phải sửa lại.
  (2) paññāpeti, paññatti (15.x, 40.14): dịch chế định tâm và lực chế định theo nghĩa bám chữ. Tầng dịch paññāpeti là tuyên bố 41 · trình bày 13 · thiết lập 5 trên 96 khoá, nhưng các nghĩa đó đều có tân ngữ là người hoặc lời nói, không phải tâm, nên không dùng; nghĩa của lực này chưa phân xử được từ Pāli một mình.
  (3) nijjhāpeti, nijjhatti (16.x, 40.15): dịch làm cho tâm thấu hiểu và lực thấu hiểu, theo mn48 (làm nhau hiểu ra) và an2.51; mn48 cũng có thuyết phục (4 khoá) nhưng cho nghĩa người này nói người kia.
  (4) khamati, khanti (14.x, 40.12): dịch được chấp nhận và lực chấp nhận (khamati: chấp nhận 49 trên 138; nhẫn 3). Chủ ngữ của khamati ở đây là pháp đối trị (xuất ly, không sân hận, …) nên không dịch nhẫn nhục.
  (5) vasaṁ vatteti (17.x): dịch làm chủ tâm (làm chủ 19 · điều ngự 9 · tự tại 21 trên 69); tên lực issariya dịch lực tự tại.
  (6) adhiṭṭhāti (18.x, 40.17): quyết định tâm là cách nói hơi cứng, giữ vì cùng gốc với quyết định ở thần thông (28.2) và với tên lực.
  (7) saṅgaṇhāti → thu nhiếp: thu nhiếp 0 khoá, thâu nhiếp 1, nhiếp 2 trên 15; chọn thu nhiếp (dạng chuẩn), có thể đổi sang thâu nhiếp nếu người biên tập muốn.
  (8) 28.2: vijjāmayā iddhi dịch thần thông do minh tạo thành (vijjā → minh); manomayā → do ý tạo thành (an10.29:3.3); ñāṇavipphārā, samādhivipphārā → do sự lan tỏa của trí, của định (an3.60 dịch vipphāra là lan tỏa); mệnh đề cuối tattha tattha sammā payogappaccayā ijjhanaṭṭhena iddhi dịch thần thông theo ý nghĩa thành tựu do sự vận dụng đúng đắn ở từng trường hợp; nghĩa của vijjāmayā chưa phân xử được.
  (9) 36.4: Pāli là câu dở yampi tathāgato … anussarati kết bằng chấm rồi seyyathidaṁ; bản Việt giữ dạng dở và không thêm vế sau.
  (10) 40.24: tassa ijjhatīti, tassa có thể chỉ chính vị ấy hoặc điều vừa nói; dịch thành tựu cho vị ấy.
  (11) kammasamādāna (30.x): dịch các nghiệp đã thọ nhận trong quá khứ, vị lai và hiện tại, quả báo theo trường hợp và theo nhân; không dùng an10.21 làm tiền lệ vì bản đó có chỗ chép sai chữ (phát đành).
  (12) anavajja → không đáng chê trách: tầng dịch không có tội 43 · không lỗi 25 · đáng chê trách 4 trên 194 khoá có anavajj-; ở đây vajja là điều đáng chê trách chứ không phải tội theo giới luật, nên chọn dạng này dù là thiểu số.
  (13) 19.3: paṭinissaggānupassī (chỉ người) dịch ở vị quán từ bỏ, theo hướng hơi thở vào hoặc ra. (14) 8.2 đến 10.10: hirīyati, ottappati, paṭisaṅkhāti không có chủ ngữ trong Pāli nên bản Việt cũng không thêm chủ ngữ. (15) 8.x đến 10.x: Pāli có nhiều nhóm khoá chỉ khác nhau một từ nên bản Việt cùng khuôn, đó là khuôn của Pāli chứ không phải khuôn của người dịch.

  Phép kiểm đã chạy: tập khoá Việt = tập khoá Pāli (265 = 265), thứ tự giống Pāli; nháy đơn và nháy kép khớp Pāli từng khoá (0 lệch; 7 khoá có dấu nháy kép trong Pāli, 0 khoá có nháy đơn); dấu lược … khớp Pāli từng khoá (0 lệch; 46 khoá có dấu lược, kể cả …pe… và … trần); không khoá nào là (…) trần; 6 khoá Pāli kết …pe…. (32.2, 33.2, 34.2, 35.2, 36.7, 37.3) đều kết Việt bằng khoảng trắng rồi ….; NFC đạt; 0 khoá rỗng; không Pāli lọt sang Việt ngoài tên riêng Paṭisambhidāmagga ở khoá tiêu đề và Sāvatthī ở 1.1. Pāli trùng nguyên văn trong chính bài: 4 nhóm (22.5 = 22.15 = 40.21; 22.6 = 22.16 = 40.22; 36.2 = 36.6; 36.7 = 37.3), 10 khoá, bản Việt giống hệt nhau (0 lệch). Pāli trùng nguyên văn với tầng ngoài bài: 14 khoá, 664 cặp đã dò, 116 cặp bản Việt khác; khác chủ yếu vì tầng an dịch bala là sức mạnh (an5.13 đến an5.16, an10.90), vì 21.5 và 21.6 dịch nơi tưởng, nơi các hành thay vì với tưởng, trong các hành (sn22.111, sn22.147), vì Seyyathidaṁ dịch theo đa số mil (như sau đây), và vì 27.6 dịch Thánh đạo tám chi (22 khoá) thay vì tám ngành; không sửa phía tầng. Đã in và đọc đủ 265 cặp Pāli với Việt.

  Chưa chạy cổng kỹ thuật nên technical_integrity đặt 9,6: còn phải chạy npm run validate, npm test, npm run check, npm run build.

  **Đối chiếu độc lập 2026-10-14** với bản Việt nguyên bài của Bhikkhu Indacanda (bản dịch 2007, theo ấn bản Buddha Jayanthi). Đã so từng khoá, theo từng nhóm công thức, trong 265 khoá. 18 khoá bất đồng nghĩa → sửa 2, giữ 1, bất định 15. Sửa `:3.3` và `:4.3` (`paṭivedhādivisodhanaṭṭhena`): trước *do ý nghĩa làm thanh tịnh sự thông suốt và các điều tiếp theo* → sau *do ý nghĩa làm thanh tịnh phần đầu của sự thông suốt*. Bản nguyên bài hiểu `ādi` là phần đầu; Pāli ủng hộ cách đó vì cùng bài `ps1.4:66.8` và `ps1.4:70.1` dùng `ādivisodhana` như một thuật ngữ riêng (*làm thanh tịnh từ đầu*), và mục kế `uttaripaṭivedha` (thông suốt cao hơn) đứng đối xứng với phần đầu của sự thông suốt; Cách đọc `ādi` = *vân vân* không có thuật ngữ song song nào trong tầng. Cách cũ theo tiền lệ `ps1.9` (8 khoá cùng công thức `paṭivedhādivisodhanāya` còn dịch *… và các điều tiếp theo*, ngoài lát, xin sửa theo). Giữ `:21.14` (`attasaññāya kampatīti`): Pāli đã ghim thiếu `na`; cả bản này lẫn bản nguyên bài đều đọc là *không dao động* (bản nguyên bài là ấn bản khác nên xác nhận độc lập cách đọc có `na`), vì sáu khoá song song và `:40.5` đều là bất động; Pāli đã ghim không đổi, bất định cũ ở mục (1) vì vậy được xác nhận (người biên tập vẫn có thể ghi chú chữ Pāli thiếu `na`). Bất định `:15.1`–`:15.7` và `:40.14` (`paññāpeti`, `paññatti`; 8 khoá): bản này *chế định tâm / lực chế định*, bản nguyên bài *chuẩn bị tâm / lực của sự chuẩn bị*; `paññāpeti` có cả nghĩa thiết lập, trình bày lẫn chuẩn bị (xếp đặt), không phân xử được từ Pāli. Bất định `:16.1`–`:16.6` và `:40.15` (`nijjhāpeti`, `nijjhatti`; 7 khoá): bản này *làm cho tâm thấu hiểu / lực thấu hiểu*, bản nguyên bài *khiến tâm được thuyết phục / lực của sự thuyết phục*; `nijjhāpeti` là dạng sai khiến, có thể là làm cho (ai) hiểu ra hoặc thuyết phục; hai cách dịch đều trong nghĩa từ, chưa chọn được. Không tính là bất đồng nghĩa mà chỉ khác thuật ngữ đã có tiền lệ: `ottappa` *kính sợ* (bản nguyên bài: ghê sợ), `anavajja` *không đáng chê trách* (không sai trái), `saṅgaṇhāti` *thu nhiếp* (củng cố), `vasaṁ vatteti` *làm chủ* (thống lãnh), `vijjāmayā iddhi` *do minh tạo thành* (do sự hiểu biết); đã đo ở lượt trước, giữ. Bản nguyên bài không phân đoạn nên đối chiếu ở mức đoạn, không phải mức khoá; không có bản Anh. Đây là review của AI, không phải chứng nhận của chuyên gia Pāli.

  Lượt rà soát 2026-10-15 (Claude Opus 5.5, đọc đối kháng Pāli↔Việt cả 265 khoá, đối chiếu bản nguyên
  bài Bhikkhu Indacanda, đoạn song song an10.90, an8.28, sn50.1-12, dn28 và ps1.4:66.8, 70.1): sửa 0
  khoá; không thấy lỗi sai nghĩa. Đã đếm lại 68 = 18 + 5 nhóm mười; mười lực của bậc đã đoạn tận lậu
  hoặc (23–27), mười lực thần thông (28.2), mười lực của Như Lai (29–38); chín cặp đối trị ở 8–18 khớp
  từng khoá. Xác nhận cách đọc paṭivedhādivisodhana ở 3.3, 4.3 là "phần đầu của sự thông suốt"
  (ādivisodhana là thuật ngữ riêng ở ps1.4:66.8, 70.1). Giữ: 21.14 vẫn đọc như có na (cả bản nguyên
  bài cũng dịch "không rung động"), chữ Pāli ghim thiếu na ghi ở mục (1), người biên tập phán; bản
  nguyên bài dịch paññāpeti "chuẩn bị", nijjhāpeti "thuyết phục", saṅgaṇhāti "củng cố", khamati "nhẫn
  nại" (khác thuật ngữ, bất định (2)–(4) giữ). Ghi cho người biên tập: ps1.9 còn 8 khoá cùng công thức
  paṭivedhādivisodhanāya dịch "và các điều tiếp theo", lệch với ps2.9 sau lượt trước; anāsava ở 38.1
  là "không lậu hoặc" còn ps2.1:31 và 21.3 dùng "vô lậu".

  Quyết định hội đồng biên tập 2026-10-16: B10 — `19.3`, `21.3`, `21.4`, `21.10`, `21.18` (`paṭinissagga` = “xả bỏ”); E — `21.14` giữ “không”: Pāli ghim thiếu `na` (lỗi chép của nguồn), bản Việt theo câu song song `ps1.1:464.6` (`Anattānupassanāya attasaññāya na kampatīti`) và đối chiếu Indacanda; ghi chú, không coi là blocker, không đổi khoá.
