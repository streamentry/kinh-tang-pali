notes: |-
  Dịch trực tiếp từ Pāli root snapshot bilara đã ghim, đường dẫn `kn/pe/pe3_root-pli-ms.json` (330/330 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập Pāli). Đây là nền tảng thứ ba (`Suttādhiṭṭhānatatiyabhūmi`) của Peṭakopadesa, thuộc Trưởng lão Mahākaccāyana, vị cư ngụ ở rừng Jambu (86.1). Bài liệt kê mười bốn `adhiṭṭhāna` (2.1): tham, sân, si, vô tham, vô sân, vô si, thân nghiệp, khẩu nghiệp, ý nghiệp, tín căn, tinh tấn, niệm căn, định căn, tuệ căn; mỗi mục đi cùng một bài kệ hay một đoạn kinh, rồi được chỉ ra theo nhân (`hetu`), dòng tuôn chảy (`nissanda`), quả (`phala`); sau đó phân biệt kinh chung (`sādhāraṇa`) và kinh không chung (`asādhāraṇa`). Văn bản Pāli ghim nhiều chỗ hỏng hay cụt (xem phần bất định): bản Việt dịch sát chữ, không gỡ hộ.

  - Tầng tham khảo:
    Upstream commit đã ghim không có bản dịch tiếng Anh của Bhikkhu Sujato cho pe3: tầng `english-sujato` chỉ có chín nhánh `cp dhp iti ja kp snp thag thig ud` dưới `sutta/kn/` (755 tệp), không có thư mục `pe`; chỉ có tệp tên `pe-name_translation-en-sujato.json` (pe3 = "The Third Stage: The Terminology of the Discourses"), không kèm prose của bài. Đây là `not-published-upstream`, không phải `not-synced`. Lớp lấp `english-project` chưa có tệp nào cho `pe`. Bản Việt hiện hành (`translation/vi/phantuananh/`) tại commit đã ghim chỉ có Pháp Cú (26 tệp). Ba tầng tham khảo đều vắng nên bài mang trạng thái `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7.0 (≤ 8.0). Bài này dịch chỉ từ Pāli, từ tiền lệ thuật ngữ của chính tầng dự án (pe4, pe7, pe9, ne4, ne10, ne14, ne21, ne36), và từ các bài kinh, kệ Nikāya mà bài trích lại (an1.16, an3.3, an3.53, an5.34, an5.174, an6.54, an11.15, sn8.5, sn10.4, sn15, sn51.10, sn55.26, dn31, dn16, dhp8, dhp231–233, dhp246–247, dhp281, dhp349, iti27, iti41, iti62).
    Tên Sujato của pe3 dịch `adhiṭṭhāna` là "terminology" ("The Third Stage: The Terminology of the Discourses"), khác cách đọc "an lập" của bản này (xem thuật ngữ); không có prose của Sujato để xác định ý của ông, nên không đổi theo tên ấy.
  - Coverage English:
    Mẫu số = 120 khoá Pāli có nội dung (≥ 40 ký tự theo `source/layers.yaml`, bỏ khối `:0`). Sujato phủ 0/120 (0/330 khoá tổng); coverage English 0%, dưới ngưỡng, nên bài chưa thể `review`/`published`; `reference-gaps.yaml` có entry cũng không cứu được `published` (ngoài phạm vi lát này, không chạm). Không có cách đọc English độc lập nào cho bài này.
  - Tiền lệ cùng bộ (`pe`, `ne`):
    `0.1` "Peṭakopadesa" dùng lại nguyên văn của `pe4:0.1`, `pe7:0.1`, `pe9:0.1`. `0.2` giữ số thứ tự "3." như `pe4:0.2` ("4."), `ne1:0.2`, `ne2:0.2`; tên "Nền Tảng Thứ Ba: An Lập Kinh" theo cách `pe4:0.2` đặt "Nền Tảng Thứ Tư: Khảo Xét Kinh" (`bhūmi` → "nền tảng"). `86.1` đi cùng nhịp "tên chương, tên tác giả" của `pe4:13.1` và `pe9:65.1` ("vị cư ngụ ở rừng Jambu" theo `pe9:65.1`). `76.1` dùng lại nguyên văn `pe9:54.1` (Pāli trùng, kể cả dấu ":" thêm vào vì Pāli không có dấu câu). Tên các hāra/naya không xuất hiện trong bài này (bài chỉ nói `hetu`, `nissanda`, `phala`, `adhiṭṭhāna`, `sādhāraṇa`/`asādhāraṇa`), nên không dùng "phương thức" (`ne21`–`ne35`) hay "lối" (`pe9`, `ne3`, `ne4`); chỗ duy nhất có `naya` là `18.5` ("theo lối, theo pháp", theo `pe9`).
  - Pāli trùng nguyên văn:
    Dò Pāli của 330 khoá với toàn bộ Pāli đã ghim (dn, mn, sn, an, kn), so sau khi bỏ dấu câu, nháy và chữ hoa: 83 khoá có Pāli trùng ở bài khác mà phía kia đã có bản Việt, tổng 248 cặp. Trong đó 58 khoá bản Việt của bài này giống ít nhất một bản đã có (sau khi bỏ dấu câu), 25 khoá khác mọi bản đã có. Riêng với `pe`/`ne`: 16 cặp, 13 giống, 3 chỉ khác chính tả `sanh khởi` ↔ `sinh khởi` (`38.1`, `38.4`, `80.4` so `ne14:22`; bài này dùng `sinh khởi` theo 76 khoá so 15 "sanh khởi" trên toàn tầng). Dùng lại nguyên văn ở các khoá còn lại, trong đó: `62.1`–`62.3` (`ne10:2`), `38.2`–`38.3` (`ne14:22`, `dn16`, `sn51.10`), `25.2`–`25.4` (`dhp8`), `46.1`–`46.3` (`sn8.5`), `57.1`–`58.4` (`sn55.26`), `74.1`–`74.3` (`an6.54:27`), `74.5`–`74.6` (`an6.54:28`), `22.3`–`22.4` (`an4.17`, `dn31`), `65.1` (`sn10.4`), `43.3`–`43.4`, `49.3` (`dhp231`, `dhp233`), `52.1`–`52.2`, `52.4` (`dhp281`), `31.4` (`ne4`).
    25 khoá khác mọi bản đã có, kèm lý do: `4.1` "tầm" thay "tư tưởng" (`dhp349:1`), vì các khoá `5.1`, `5.6` giải thích `vitakka` là `kāmavitakka` và tầng `pe` (`pe7`) đã dùng "tầm"; `4.3` "ái" thay "tham ái" (`dhp349:3`), vì `5.3` chú giải `taṇhā` là `kāmataṇhā` ("dục ái") và tầng `pe9` dùng "ái" (839 khoá "ái" so 376 "tham ái" trên 1.333 khoá có `taṇhā`); `7.1`, `7.3`, `7.4` (`an5.34:8`), vì bản cũ bỏ mất `amaṅkubhūto` (không bối rối) và gộp `visārado` thành ba cụm; `10.2`–`10.6`, `11.1`, `11.2` (`an5.174:9`–`10`, `dhp246`–`247`), vì hai bản cũ khác nhau (`musāvāda` "nói dối" 360, "dối trá" 11, "giả dối" 2 trên 378 khoá, trong kệ chọn "dối trá" theo `dhp246:2`; `surāmeraya` "rượu men" 57 và "rượu nấu" 30 khoá, còn `an5.174` ghi "rượu beer và rượu vang"; `11.1` bỏ "ấy" vì Pāli không có; `11.2` "kẻ phạm giới" thêm "kẻ" cho `dussīlo`; `paradārañca gacchati` dịch sát "đi đến vợ người" như `dhp246:4`, không diễn nghĩa "phạm tội"); `17.3` thêm "họ" cho `karissanti` (số nhiều) vì `17.1`–`17.2` không có chủ ngữ; `22.1`, `22.2` (`dn31:6`, `an4.17:2`), vì tầng chia ba cách cho `chanda` ("tham" `dn31`, "ái dục" `an4.17`, "ưa thích" `ne10:13.1`–`13.4`, 4 khoá), chọn cách của `ne10` cho cùng bộ bốn `agati`; `25.5` thêm "người ấy" cho `taṁ` (`dhp8:5`); `29.2` giữ `mettāyati` (bản cũ `iti27:7.2` bỏ mất); `29.4` "nhiều phước" cho `pahūta` (`iti27:7.4` "vô lượng"); `38.1`, `38.4` chỉ khác chính tả; `44.1` giữ "này" cho `imāni` (`iti65:2.1` bỏ); `52.3` "nghiệp đạo" thay "nghiệp" (`dhp281:3`), vì `kammapatha` → "nghiệp đạo" 35 khoá và `14.7` cùng bài dùng cùng chữ; `54.2` "kiêng tránh" thay "từ bỏ" (`mn117:25.2`, `mn141:27.2`; 2 khoá) và "tránh xa" (`dn33`, `dn34`; 3 khoá), theo "kiêng tránh" 23 khoá (`an10.171`, `an10.178`, …) so "tránh xa" 3 và "từ bỏ" 2 trong các khoá mở đầu bằng cụm `pāṇātipātā veramaṇī`; `78.3` giống `22.1`; `80.4` chỉ khác chính tả. `74.4` "chỉ và quán" giống `pe9:47.2`, `ne36:62.1`, khác `an6.54:27.4` "an tịnh và minh sát" (tầng chia 9/9 trên 29 khoá).
    Trong chính bài: 1 nhóm Pāli trùng nguyên byte (`80.1` và `85.1`), bản Việt giống nhau; sau khi bỏ nháy và dấu câu có 12 nhóm (`10.1`/`77.3`, `16.1`/`78.1`, `21.1`/`37.2`, `22.1`/`78.3`, `25.1`/`79.1`, `33.1`/`80.1`/`85.1`, `38.1`/`80.4`, `43.1`/`81.1`, `57.1`/`83.1`, `62.1`/`83.3`, `65.1`/`84.1`, `74.1`/`85.3`), 0 nhóm bản Việt khác.
  - Thuật ngữ (đếm trên tầng Việt hiện có, cùng Pāli):
    + `adhiṭṭhāna` → "an lập" theo `pe4:6.10`, `pe4:6.12` (`suttādhiṭṭhāne` "sự an lập kinh") và `ne36:54.2` ("sự an lập nơi các căn"): 3 khoá. Cũng có "áp dụng" (9 khoá, `ne2`, `ne3`, `ne17`, `ne33`, nhưng đó là tên hāra) và "sự quyết định" (5 khoá `ne36` cho bốn `adhiṭṭhāna`); `pe7:10.5` dịch "ý lập" cho nghĩa khác (bốn `adhiṭṭhāna` của tuệ, chân thật, xả, tịnh). Chọn "an lập" vì bài này là chương thứ ba cùng bộ với `pe4`. Nếu người biên tập đổi, đổi 14 mục ở `2.1` cùng 23 khoá mang chữ này.
    + `hetu` → "nhân", `nissanda` → "dòng tuôn chảy" (`pe4:6.9`, `6.11`, `10.9`, `12.3`, `pe9:2.12`: 5 khoá; `an5.30` dịch "kết quả" 5 khoá, trùng nghĩa với `phala` nên không dùng), `phala` → "quả"; `niddisati` → "chỉ ra" (`pe4`, `pe7`, `pe9`: 27/27 khoá; `ne` chia "chỉ rõ" 26 so "chỉ ra" 6 trên 34 khoá, chọn theo `pe`). `vatthu` → "cơ sở" (`iti60:2.3`, `an8.36`: "cơ sở tạo phước"). `sādhāraṇa`/`asādhāraṇa` → "chung"/"không chung" (`ne11:5`–`6`, `ne18:2`, `pe9:30.4`, `ne36:56.4`).
    + `kāmarāga` → "tham dục" (`cnd12:18.2`), `kāmacchanda` → "dục tham" (`ne5:27.6`, `28.2`, `mn10`, `dn22`, 135 khoá), `kāmataṇhā` → "dục ái", `rāga` → "tham" (`pe9`: "tham" 529/947), `tibbarāga` → "tham dục mãnh liệt" (`dhp349:2`), `taṇhā` → "ái".
    + `assāda`/`ādīnava`/`nissaraṇa` → "vị ngọt" (233 khoá) / "nguy hại" (`ne3:2.1`, `ne4:1.4`, 19 khoá `ne`; so "hiểm họa" ở `pe7:9.2` và 15 khoá toàn tầng; "nguy hại" 408 khoá) / "lối thoát" (`ne4:1.4`, `ne4:24.1`, 18 khoá `ne`; toàn tầng "lối thoát" 167 so "xuất ly" 214).
    + `veramaṇī` → "kiêng tránh" (23 khoá cho bộ ba `pāṇātipātā … adinnādānā … kāmesumicchācārā`); `samphappalāpa` → "phù phiếm" (130); `anabhijjhā` → "không tham lam" (65 so "không tham muốn" 17, "không tham dục" 9), `abyāpāda` → "không sân hận" (85); `kammapatha` → "nghiệp đạo" (35); `dussīla` → "phạm giới" (41 so "ác giới" 31); `kālaṁ karoti` → "chết" (38; "qua đời" 5, "mệnh chung" 4); `avippaṭisārī` → "không hối hận" theo `pe9` (`vippaṭisāra` "hối hận", để "hối tiếc" cho `kukkucca` ở `pe7:1.7`; toàn tầng "hối tiếc" 144 so "hối hận" 40).
    + `kusalamūla`/`akusalamūla` → "gốc thiện"/"gốc bất thiện" (32/43); `sammatta` → "chánh tánh" (`ne10:15.1`, `15.2`: 2 khoá; `dn33:3.1.6` dịch "chánh" 1 khoá); `ājīva` → "mạng" trong "chánh mạng" (146); `paṭivijjhati` → "thấu suốt" (43 so "thấu triệt" 9), còn `nibbedha` → "thấu triệt" (`iti41:4.2`, `iti93:7.4`) để hai gốc từ khác nhau; `saṅkhaya` → "diệt tận" (`jātimaraṇasaṅkhaya` → "diệt tận sinh tử"; "sinh tử" 12 so "sinh và tử" 11); `sammā pajānāti` → "chánh tri" theo `iti41:4.3`.
    + `agatigamana` → "đi theo thiên vị" (`ne10:13.1`–`13.4`, `pe9`); `chanda` (trong bộ bốn) → "ưa thích"; `bālalakkhaṇa` → "dấu hiệu của kẻ ngu" (`an3.3:1.1`, `mn129`: "dấu hiệu"); `dukkhaṁ domanassaṁ paṭisaṁvedeti` → "cảm thọ khổ và ưu" (`an3.53`); `ekādasānisaṁsā mettāya cetovimuttiyā` → "mười một lợi ích của tâm giải thoát bằng từ" (`iti27`, `an11.15`: "tâm giải thoát bằng lòng từ" 5 khoá); `aveccappasāda` → "tịnh tín bất động" (107); `uddānagāthā` → "bài kệ tóm lược" (`pe9:54.1`); `veyyākaraṇa` → "lời giải đáp" (`ne3:21.1`, `ne36:10.1`, `pe4:6.16`, `pe9:61.1`).
    + `makkha` → "gièm pha" (33), `paḷāsa` → "hơn thua" (11; tầng rất phân tán: "ngạo" 14, "tranh" 10), `issā` → "ganh tị" (58), `macchariya` → "keo kiệt" (96), `kodha` → "giận dữ" (120), `aññāṇa` → "vô tri", `asampajañña` → "không tỉnh giác" và `assati` → "thất niệm" (`pe7`, `pe9`), `anusaya` → "tùy miên" (`pe9`).
    + `sutamayī`/`cintāmayī`/`bhāvanāmayī paññā` → "tuệ do nghe/tư duy/tu tập sinh" (`ne4:28.2`–`29.3`, `pe9`); `anaññātaññassāmītindriya`/`aññindriya`/`aññātāvindriya` → "căn ta sẽ biết điều chưa biết / căn đã biết / căn của vị đã biết xong" (`pe9:38.9`, `iti62:2.3`); `chandaṁ janeti vāyamati vīriyaṁ ārabhati cittaṁ paggaṇhāti padahati` → "khởi ý muốn, cố gắng, phát khởi tinh tấn, nâng đỡ tâm, nỗ lực" (`ne5:44.3`–`44.5`); `khīṇā jāti, vusitaṁ brahmacariyaṁ, kataṁ karaṇīyaṁ, nāparaṁ itthattāyā` → "sinh đã tận, phạm hạnh đã thành, việc cần làm đã làm, không còn trở lại trạng thái này nữa" (`ud3.2:14.2`, `snp1.4:16.3`; "đã thành" 81 khoá).
    + `sambhava` → "sinh khởi" (76 so "sanh khởi" 15); `tula`/`atula` → "cái đo được"/"cái không đo được" (`sn51.10:18.1`, `ne14:22.1`); `bhavasaṅkhāra` → "hữu hành" (`dn16:3.10.5`, `ne14:22.2`); `avijjaṇḍakosa` → "vỏ trứng vô minh" (`ne14:23.8`, `cnd`); `samatha`/`vipassanā` → "chỉ"/"quán" (`pe9:47.2`, `ne36:62.1`; `an6.54:27.4` dịch "an tịnh"/"minh sát", tầng chia 9/9 trên 29 khoá); `pavatti`/`nivatti` → "sự tiếp diễn"/"sự dừng lại" (`ne9:44.4`).
    + `vitakka` → "tầm" (`pe7`); `puññakiriyā` → "việc tạo phước" (không có `vatthu`); `devesu upapajjati` → "sinh vào cõi trời"; `satthā` → "bậc Đạo Sư" (`ne4:28.1`); `naradammasārathi` → "Bậc Điều Ngự Trượng Phu".
  - Số Pāli:
    `suttādhiṭṭhāna` có 14 mục (2.1, đếm được đúng 14 chữ `-ādhiṭṭhāna`: tham, sân, si, vô tham, vô sân, vô si, thân, khẩu, ý, tín, tinh tấn, niệm, định, tuệ; bài mở 14 mục tại `3.1`, `9.1`, `15.1`, `24.1`, `28.1`, `32.1`, `42.1`, `45.1`, `48.1`, `56.1`, `61.1`, `64.1`, `67.1`, `70.1`); `tividhaṁ` 3 (6.1: dòng tuôn chảy, nhân, quả); `pañca verāni` 5 (11.1, 13.1, `pañcannaṁ bhikkhāpadānaṁ`); `tīṇi bālalakkhaṇāni` 3 (14.1–14.2, đúng ba mục: nói điều xấu, nghĩ điều xấu, làm điều xấu); `tīṇi tajjāni dukkhāni` 3 (14.6, 14.10; nêu ở 14.7, 14.8, 14.9); `pāṇātipātādidasaakusalakammapatha` 10 (14.7; bài không liệt kê); `sata … sahassānaṁ … kappānaṁ` 16.1 và 78.1: sata 100 × sahassa 1.000 = 100.000, nhưng không phân xử được, xem bất định; `pañcakkhandhe pañca diṭṭhiyo` 5, 5 (18.3); `cattāri saccāni` 4 (19.1), `catunnaṁ ariyasaccānaṁ` 4 (35.4); `cattārimāni agatigamanāni` 4 (20.3; 20.4–20.6 nêu chanda, bhaya → tham, dosa, moha: 4 điều; `78.4` `catūhi agatīhi` 4); `tīṇi akusalamūlāni` 3 (20.7); `ekādasānisaṁsā` 11 và `ekādasa dhammā` 11 (31.1, 31.2; bài không liệt kê mười một mục); `tīṇi indriyāni` 3 (35.1; đúng ba mục); `aṭṭha sammattāni` 8 (36.6); `tīṇi kammāni` 3 (36.8: tư duy, tinh tấn, định); `tayo dhamme` 3 (36.10: chánh ngữ, chánh nghiệp, chánh mạng); `dve dhamme` 2 (36.11); `dve vimuttiyo` 2 (36.12: 3 + 3 + 2 = 8 khớp với `aṭṭha sammattāni`); `dvīhi kāraṇehi` 2 (39.5; hai lý do ở 39.6 và 39.7); `dve vacanāni` 2 và `navasu padesu` 9 (40.3), nhưng `40.2` nêu 10 mục (ái, giận dữ, không tỉnh giác, tùy miên, gièm pha, hơn thua, thất niệm, ganh tị, keo kiệt, vô tri): không phân xử được, giữ đúng Pāli; `tīṇi sucaritāni` 3 (44.1–44.2; đúng ba mục); `cattārimāni vacīsucaritāni` 4 (47.1); `tīṇi manosucaritāni` 3 (50.1; đúng ba mục); `tisso pārisuddhiyo` 3 (53.1–53.2); `cattārome sammappadhānā` 4 (63.1); `cattāro satipaṭṭhānā` 4 (66.1); `tayome samādhī` 3 (69.1–69.2; đúng ba mục); `tisso paññā` 3 (72.1–72.2; đúng ba mục); `pañcimāni indriyāni` 5 (75.1; kệ 74 nêu năm mục: tín, niệm, tinh tấn, chỉ, quán); `tīsu aveccappasāde` 3 (75.3); `tīṇi tassa bālalakkhaṇaṁ` 3 (77.4); `tīṇi indriyāni` 3 (80.2); `tīṇi sucaritāni` 3 (81.2); `tisso pārisuddhiyo` 3 (82.4); `tīṇi samādhayo` 3 (84.4); `tisso paññā` 3 (85.2); `pañcindriyā` 5 (74.2, 85.4); `ekampi` 1 (29.1, 79.3, `ekadhammampi` 27.1). Số lớn duy nhất là `sata … sahassānaṁ` ở 16.1 và 78.1 (xem bất định); không có số lớn nào khác.
  - Chỗ bất định (không thêm vào thân kinh):
    + `16.1`–`16.4`, `78.1` `satañceva sahassānaṁ … kappānaṁ saṁsarissati`: không có bản Anh nào để đối chiếu và chỉ có một dạng trong toàn lớp Pāli. Có thể đọc là "một trăm ngàn kiếp" (sata 100 × sahassa 1.000 = 100.000), hoặc "hàng trăm và hàng ngàn kiếp" (hai danh từ riêng), hoặc `satañ ce eva` (nếu một trăm …). Dịch "một trăm ngàn" theo cách đọc đầu, không đoán thêm. `saṁsarissati` (ngôi thứ ba số ít) và `gamissatha` (ngôi thứ hai số nhiều) đứng cùng một câu; dịch "người ấy sẽ trôi lăn" và "các ông sẽ đi", không hòa giải.
    + `17.1`–`17.2` `anupādāya buddhavacanaṁ` / `saṅkhāre attato upādāya`: dịch "không nắm giữ lời của Đức Phật" / "mà nắm giữ các hành là tự ngã" để giữ phủ định của `anupādāya`; cũng có thể đọc `anupādāya` là "không chấp thủ" (lời Phật không phải để chấp thủ).
    + `8.3` `Yañcetaṁ` cụt (mảnh đầu của một câu mà `8.4` hoàn tất); dịch "Và điều này." `8.4` `yaṁ bahukassa janassa piyo bhavati manāpo ca` dịch "điều khiến người ấy được nhiều người yêu mến, vừa ý".
    + `12.1` `duṭṭho` (có tâm sân); `12.4` `amittā janayanti` (kẻ thù sinh ra / kẻ thù làm sinh ra) không có tân ngữ, và `yathāparadāravihārī` là so sánh không có vế sau rõ; dịch sát chữ.
    + `13.1` `bhikkhāpadānaṁ`: có thể là chép sai của `sikkhāpadānaṁ` (điều học); dịch "điều học". `sā paṇṇatti` dịch "đó là sự chế định".
    + `14.4` `Tāyaṁ`: không phân giải được, bỏ qua trong bản Việt. `14.6` `sabhaggato vā parisaggato vā tajjaṁ kathaṁ kathanti`: "được gọi đến hội đồng hay hội chúng" (`an3.28:1.5`, `mn41:9.2`, `mn114:6.9`); `kathanti` (ngôi ba số nhiều) dịch "người ta nói những lời tương ứng", không có chủ ngữ rõ trong Pāli.
    + `14.9` `āsanā samārūḷho yāva yā me gati bhavissati ito pecca paraṁ maraṇā`: `āsanā samārūḷho` ("đã ngồi lên chỗ ngồi") và `yāva` không rõ; có thể là chép sai của `āsanne maraṇe`; dịch sát chữ.
    + `18.2` `payojanāni` → "mục đích"; `avijjāsutte` → "kinh về vô minh" (không xác định được kinh nào, không thêm tên kinh). `18.4` `nikkhittaṁ … nikkhipitaṁ`: hai dạng của cùng một động từ, dịch "được đặt ra … được đặt vào". `18.5` `nayena dhammena` → "theo lối, theo pháp".
    + `19.1` `yaṁ tattha appajānanā, idaṁ dukkhaṁ, ayaṁ hetu`: có thể đọc "sự không biết rõ ở đó chính là khổ" hoặc "điều khổ ấy lấy sự không biết rõ làm nhân"; dịch sát chữ. `19.3` `diṭṭhigatāni parāmasati` → "cố chấp vào các kiến chấp".
    + `20.3` `Yathā kiṁ bhave cattārimāni, bhikkhave, agatigamanāni`: dịch "Chẳng hạn như thế nào?" (`ne6:3.8`, `ne8:1.5`) rồi câu còn lại. `20.4` đặt `bhayā` cùng `chandā` vào tham (còn `ne10:13.4` đặt `bhayā` cùng `mohā` vào si): giữ đúng Pāli.
    + `23.1` `Kattha chandā ca ayaṁ lobho`: dịch "Ở đâu? Sự ưa thích: đây là tham"; cách đọc khác `chandā` là cách năm "vì ưa thích". `20.2` `Hetu khalu āditoyeva sutte nikkhipissanti` dịch sát chữ.
    + `26.2` `mama āyatanasocitaṁ`: `socita` có thể là "nỗi sầu" (`socati`) hoặc chép sai; không phân giải được, dịch "của tôi, nỗi sầu nơi các xứ, khi không chấp thủ". `26.4`–`26.5` `vatthuto`, `gocarato`, `parato` (ba cách `-to`): "theo cơ sở", "theo phạm vi" (`gocara` "phạm vi" 40 khoá, `pe4`), "theo phía khác" (`parato` cũng có thể là "về sau" hay "từ bên ngoài").
    + `27.4` `anuppanno kāmarāgo pariyādiyati rūparāgaṁ arūparāgaṁ`: chủ cách và tân cách lẫn nhau; dịch "tham dục chưa sinh, tham sắc, tham vô sắc bị làm cạn kiệt" (`pariyādiyati` "làm cạn" 6 khoá). Không phân xử được ai làm cạn ai.
    + `30.2` `Nigghātena assādo`: `nigghāta` ("dẹp bỏ") và `assāda` ("vị ngọt") ghép nhau không rõ; dịch sát chữ. `30.3` `paṇḍiccena paṇḍito` → "bậc trí nhờ sự hiền trí". `30.7` `Yāva abyāpajjo bhūmiyaṁ`: đọc như một cụm "cho đến vùng đất không sân hại", cũng có thể là "bao lâu còn là người không sân hại, trong vùng đất ấy". `31.2` `lokikāya bhūmikā` → "vùng đất thế gian"; `yaṁ sukhaṁ āyatiṁ manāpo hoti manussānaṁ` không nêu mười một mục (`an11.15` nêu); dịch sát chữ. `31.3` `akatāvī` → "người chưa hoàn tất" (đối chiếu `an11.15`: "nếu chưa thấu suốt thêm, sinh vào cõi Phạm thiên"); `brahmakāye` → "chúng Phạm thiên".
    + `35.10` `Yena sabbaso āsavānaṁ khayā hetu`: chủ ngữ của `hetu` không rõ; dịch sát chữ. `35.6` `yā ca maggo` (đại từ giống cái, danh từ giống đực) → "và đạo".
    + `36.11` `aviparītadassanampi ca anabhilāpanaṁ`: `anabhilāpana` ("không nói ra") không phân giải được; có thể là một yếu tố của đạo (như `sati`) hoặc chép sai; dịch sát chữ ("cái thấy không đảo lộn, và sự không nói ra"); nếu đúng thì hai pháp ấy là hai chi còn lại của tám chánh tánh (3 + 3 + 2 = 8). `36.8` `tīṇi kammāni` dịch "ba nghiệp" (tư duy, tinh tấn, định).
    + `39.1` `tulasaṅkhataṁ atulasaṅkhataṁ`: có thể là `tulaṁ saṅkhataṁ` / `atulaṁ asaṅkhataṁ` (hữu vi / vô vi), như `ne14:23.1`–`23.2` ("cái đo được là hành giới", "cái không đo được là Niết-bàn giới") và `39.2` (`ye saṅkhatā tulaṁ`); dịch sát chữ "hữu vi thuộc loại đo được, hữu vi thuộc loại không đo được" và không sửa `atulasaṅkhataṁ`. `39.6` `Ettakaṁ etaṁ netaṁ paramatthīti tena atulaṁ`: logic không rõ ("chừng ấy là điều này, đây không phải là nghĩa tối thượng — do đó không đo được"), `paramatthī` có thể là `paramattha + iti`. `39.7` `pāpuṇā` → "nhờ đạt được". `39.8`–`39.10` ba mục `amoho`, `alobho`, `adoso` ghép với ba chữ của kệ (`ajjhattarato samāhito` → `adoso`); `39.13` `lobho` đứng giữa hai danh từ không có động từ; dịch sát chữ. `39.14` `avijjaṇḍakosaṁ sambhedo` → "sự vỡ ra của vỏ trứng vô minh".
    + `40.2`–`40.3` `navasu padesu` ("chín mục") không khớp với 10 mục ở `40.2` (nêu ở số Pāli); `Yassimāni dve vacanāni dhammapadāni niddiṭṭhāni na so atthi kilesā yo …` dịch sát chữ ("không có phiền não nào đi đến … ở chín mục này"), không bảo vệ được canonical wording. `40.2` `So dhamme` (`so dhammo`?) và `tehi ye ca vatthūhi` không rõ.
    + `59.1`–`59.4` `Saddhā ve nandikā ārādhiko / No tassa saddhoti / Sabbaṁ siyāti bhagavantaṁ / Tathārūpo dhammasampasādo`: không phân giải được (`nandikā` giống cái, `ārādhiko` giống đực; `No tassa saddhoti` cụt; `Sabbaṁ siyāti bhagavantaṁ` có tân cách `bhagavantaṁ` không có động từ); dịch sát chữ từng dòng, không nối thành câu hoàn chỉnh.
    + `68.1`–`68.4`: cú pháp kệ không rõ (`Ākaṅkhato te` thuộc `nisevato` hay đứng riêng; `kasiṇāpi pāṇino` "toàn thể chúng sinh" hay "cả chúng sinh"; `araṇaṁ` "vô tránh"); dịch sát chữ.
