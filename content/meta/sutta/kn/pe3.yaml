    + `77.2` `dadaṁ piyo naro iti` → "người bố thí được yêu mến, như vậy" (`iti` đóng ý, không có nháy). `61.1`, `63.1` đều dùng `vīriyādhiṭṭhānaṁ` (không có `indriya`), khác `2.1` `vīriyindriyādhiṭṭhānaṁ`; dịch đúng từng chỗ ("an lập về tinh tấn" so "an lập về tinh tấn căn").
    + `1.1`–`2.1`: `adhiṭṭhāna` → "an lập" (xem thuật ngữ); cách đọc khác "nền tảng", "thiết lập" hoặc "quyết định" (`ne36`); người biên tập phán xử.
  - Phép kiểm tra:
    1. Tập khoá Việt = tập khoá Pāli: 330/330, cùng thứ tự.
    2. Nháy kép `“”` khớp Pāli từng khoá: Pāli 22 khoá có `“` và 22 khoá có `”` (`18.4`, `19.1`, `19.3`, `35.6` có cả hai trong cùng một khoá), 0/330 lệch; nháy đơn `‘’`, dấu `"`, dấu `'` và ngoặc `()`: Pāli 0 khoá có, Việt 0 khoá có (Việt bỏ các chữ `iti` đóng ý, không thêm nháy).
    3. Pāli trùng nguyên văn trong chính bài: 1 nhóm trùng byte (`80.1`/`85.1`) và 12 nhóm sau khi bỏ nháy và dấu câu (gồm cả nhóm ấy); bản Việt giống nhau ở cả 12 nhóm, 0 nhóm khác.
    4. Dấu lược `…`: Pāli 2/330 khoá có `…pe…` (`54.4`, `75.6`); Việt đúng một `…` ở mỗi khoá (`54.4` kết ` …`, `75.6` kết ` …`); 328 khoá còn lại cả hai bên 0; không có `(…)`.
    5. Số Pāli: xem trên; số lớn duy nhất `sata … sahassānaṁ` chưa phân xử được.
    NFC đạt, không khoá rỗng, không khoảng trắng thừa; Pāli lọt sang Việt chỉ ở tên riêng `Peṭakopadesa` (0.1, 86.1) và `Mahākaccāyana` (86.1). Dấu cuối khoá khớp Pāli, trừ tiêu đề `0.2` (không dấu), `76.1` (thêm ":" theo `pe9:54.1`), `86.1` (Pāli có "Iti" ở đầu, bản Việt theo `pe4:13.1` không dịch "Iti" riêng) và `10.6` (kết bằng ".", theo Pāli; câu tiếp ở `11.1`).
