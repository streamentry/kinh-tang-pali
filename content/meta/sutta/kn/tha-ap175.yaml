  **`:0.3` và `:7.1` — đo ở phạm vi gần nhất, ghi cả hai số.** Hai khoá mang cùng một hợp
  thành Pāli (`<Tên>theraapadāna` ở `:0.3`, `<Tên>therassāpadānaṁ` ở `:7.1`) nên tôi dùng
  MỘT cụm tiếng Việt cho cả hai khoá trong cùng một bài. Số đo ở phạm vi gần nhất
  (377 tệp `tha-ap` có `:0.3` với `theraapadāna`, 110 tệp có `:7.1` với `therassāpadānaṁ`):
  - `:0.3`: *Bài Kệ Tuyên Ngợ Về Trưởng Lão* **159** / *Ký Sự Về Trưởng Lão* 91 /
    *Bài Kệ Tuyên Ngôn Về Trưởng Lão* 49 (78 khoá khác mẫu vì có số thứ tự ở đầu).
  - `:7.1`: *Bài Kệ Tuyên Ngôn Về Trưởng Lão* **63** / *Bài Kệ Tuyên Ngợ Về Trưởng Lão* 43
    (4 khoá khác mẫu).
  Tức **hai khoá có hai đa số khác nhau**. Tôi chọn *Tuyên Ngợ* cho cả hai vì (1) cùng
  một hợp thành Pāli thì phải cùng một cách nói, (2) *tuyên ngợ* đúng nghĩa "tuyên ngợ
  bài kệ" hơn, (3) mẫu lớn hơn (377 so với 110) cũng nghiêng về *Tuyên Ngợ*.
  **CẦN NGƯỜI BIÊN TẬP PHÂN XỬ** sự lệch này một lượt cho cả cuốn, vì nó làm tiêu đề và
  lục kết của cùng một bài đọc khác nhau. `tha-ap168:0.3` còn có **tiền lệ trùng Pāli
  chính xác** là `tha-ap221:0.3` → *Ký Sự Về Trưởng Lão Sappidāyaka* (1 cặp); tôi **không**
