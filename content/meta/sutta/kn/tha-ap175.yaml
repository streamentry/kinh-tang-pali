  **Không chạy `git`** (kể cả `status`/`diff`/`log`) và không chạy `gh` — đã tuân thủ.

  **NỘI DỤNG RIÊNG**: vị trưởng lão tên Migaluddo sống trong rừng và thấy Đức Phật
  Vipassi; ông thấy hoa kuṭaja nở trong đêm, nhổ cả gốc dâng lên Đức Bậc Tôn giả; 91 kiếp
  trước đã dâng hoa ấy; 8 kiếp sau có một vị tên Suppasanna làm vua, đủ bảy báu, và có
  bốn vô ngại giải. Nghĩa tên suy ra từ cấu tạo: `ratti` (ban đêm) + `pupphiya` (đã nở) →
  "người có hoa nở trong đêm", khớp với 2.1–2.4. Chỉ để ở notes, không vào thân kinh.

  **Bất định đã ghi nhận, không giấu.**
  1. `Migaluddo` (`1.1`) là danh xưng trong câu kệ này, nhưng tầng đang chia làm **8 cách**
     cho 11 cặp trùng: *trước kia ta thành con nai bị săn đuổi* (3), *thợ săn thú* (2),
     *thợ săn nai* (1), *dãy núi Migaluddo* (1), *thợ săn hươu* (3+1)… Tôi **giữ nguyên
     tên Pāli** và không thêm "con nai", vì ở bài này `miga` + `luddha` (qua r-sandhi
     `luddo`) là **danh xưng của một người** đang dâng hoa cho Vipassi, không phải con
     vật — trong khi `thag20.1:18.4` `socante migaluddake` lại dùng `migaluddaka` như một
     loài thú mà thợ săn giết. Tôi **không** bịa nghĩa cho cái tên này; đây là điểm người
     biên tập có thể phán xử lại.
  2. `araññe kānane ahaṁ` (`1.2`): 7 cặp trùng, 4 cách, **không có đa số** — 3 câu *ta
     lang thang trong rừng khuất* và 2 câu *sống trong rừng sâu chốn hoang vu*. Cả hai đều
     thêm chữ vốn không có trong Pāli ("lang thang", "hoang vu"). Tôi dịch *trong rừng,
     giữa hàng cây tôi ở* — giữ cả hai danh từ `arañña` + `kānana` và mạo từ `ahaṁ`.
  3. `devadevaṁ narāsabhaṁ` (`1.4`) trùng nguyên văn `tha-ap141:2.4` → *bậc Thiên Trung
     Thiên, đấng Nhân Ngưu này*; nhưng Pāli của `tha-ap141` kết bằng dấu nháy đơn `’` còn
     Pāli ở đây kết bằng `.`, nên tôi dùng cùng cụm từ nhưng với dấu chấm: *bậc Thiên Trung
     Thiên, đấng Nhân Ngưu.*
  4. `Ito ca aṭṭhame kappe` (`4.1`) có **tiền lệ trùng chính xác** `tha-ap101:4.1` →
     *Cách đây tám kiếp về trước*; tôi dùng lại nguyên văn. Nhưng tôi **không** cộng thêm
     phép tính nào để ra một con số lớn hơn; nếu người biên tập hiểu `aṭṭhame` là "thứ tám
     kể từ đời Vipassī" thì con số phải sửa ở cả hai bài.
  5. `rājāhosiṁ mahabbalo` (`4.4`): **không có tiền lệ trùng Pāli.** `rājā` = vua, `hosi` =
     aorist của √bhū, `mahabbalo` = vĩ lược. Tôi dịch *tôi làm vua, vĩ lược*. Đáng chú ý:
     `4.3–4.4` nói *đủ bảy bảo* nhưng **không** có `cakkavattī` — Pāli không gọi vua tên
     Suppasanna là Chuyển Luân vương, và tôi không tự thêm.
  6. `upanesiṁ mahesino` (`2.4`): aorist thứ nhất + từ xưng hô, tôi dịch *tôi đem dâng lên
     bậc Đại Ẩn Sĩ*. `Đại Ẩn Sĩ` 50 lần trong tầng; cùng cụm xuất hiện ở tha-ap324:3.4,
     tha-ap437:2.4, vv60:5.2, vv83:4.2, thi-ap7:3.4, thi-ap7:4.2, thig6.4:5.1.
  7. `3` đứng trước `Rattipupphiyattheraapadāna` ở `:0.3` là số thứ tự trong phẩm, và
     `tha-ap175:7.1` xác nhận `tatiyaṁ` = thứ ba. Tôi giữ nguyên chữ số ở `:0.3` vì Pāli có
