notes: |-
  Lát c14. KHÔNG có Sujato tại commit đã ghim cho ja390 ⇒ `draft`, xem
  blocking_errors.

  Tiền lệ có đếm và dùng lại: `Chakkanipāta` → “Bộ Sáu Bài Kệ” (9/9, cùng ja381);
  `Kharaputtavagga` → “Phẩm Kharaputta” (5/5); `Jātaka` → “Jātaka” (358);
  `pecca sagge pamodatī”ti.` có ba cách ngang phiếu (2/2/2) nên tôi chọn “và sau khi chết
  hoan lạc trên cõi trời”ti.”; `Evameva idhekacco,` đã có 1 bản “Cũng vậy, ở đây một hạng
  người,” nên tôi mở đầu đoạn 3.1 bằng đúng nguyên văn đó.

  0 tiền lệ, phải tự đặt: `mayhaka` (loài muỗi/muỗi nhỏ — tên phẩm, 0 lần trong tầng
  Việt), `dijasaṅgha` (đàn sâu tơ, 0 lần), `rakkhato` (kẻ canh giữ, 0 lần), `pipphali`
  (trứng/ấu trùng, 0 lần). Cả bốn giữ theo nghĩa từ ngữ có thể xác định từ chính câu kệ,
  không cần đoán tên riêng.

  Bất định đã ghi:
  · `nevattano na ñātīnaṁ yathodhiṁ paṭipajjati` (3.3-3.4) — chữ `nevattano` (genitive
    “của chính hắn”) đi cùng `na ñātīnaṁ` và động từ `paṭipajjati`; cách đọc khả dĩ là
    “hắn không tuỳ ý mình mà phát cho bản thân hay cho bà con”. Tôi dịch theo cách đọc này
    (khớp với 4.1-4.4 ngay sau, nơi hắn không hưởng gì và không gom góp cho bà con), nhưng
    cấu trúc cú pháp Pāli ở đây rối nên ghi rõ.
  · `akhajjabhojjaleyyapeyyasāyanīyaṁ` không có trong bài này; các khoá liên quan ở mil1
    dùng cụm tương tự và tôi đã dịch “thích hợp cho uống, ăn, liếm và tắm” — dùng lại để
    nhất với cùng một công thức trong lát.

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.
