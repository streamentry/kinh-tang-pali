notes: |-
  Lát c14. KHÔNG có Sujato tại commit đã ghim cho ja390 ⇒ `draft`, xem
  blocking_errors.

  Tiền lệ có đếm và dùng lại: `Chakkanipāta` → “Bộ Sáu Bài Kệ” (9/9, cùng ja381);
  `Kharaputtavagga` → “Phẩm Kharaputta” (5/5); `Jātaka` → “Jātaka” (358);
  `pecca sagge pamodatī”ti.` có ba cách ngang phiếu (2/2/2) nên tôi chọn “và sau khi chết
  hoan lạc trên cõi trời”ti.”; `Evameva idhekacco,` đã có 1 bản “Cũng vậy, ở đây một hạng
  người,” nên tôi mở đầu đoạn 3.1 bằng đúng nguyên văn đó.

  0 tiền lệ, phải tự đặt: `mayhaka` (loài muỗi/muỗi nhỏ — tên phẩm, 0 lần trong tầng
  Việt), `dijasaṅgha` (đàn sâu tơ, 0 lần), `rakkhato` (kẻ canh giữ, 0 lần), `pipphali`
  (trứng/ấu trùng, 0 lần). Cả bốn giữ theo nghĩa từ ngữ có thể xác định từ chính câu kệ,
  không cần đoán tên riêng.

  Bất định đã ghi:
  · `nevattano na ñātīnaṁ yathodhiṁ paṭipajjati` (3.3-3.4) — chữ `nevattano` (genitive
    “của chính hắn”) đi cùng `na ñātīnaṁ` và động từ `paṭipajjati`; cách đọc khả dĩ là
    “hắn không tuỳ ý mình mà phát cho bản thân hay cho bà con”. Tôi dịch theo cách đọc này
    (khớp với 4.1-4.4 ngay sau, nơi hắn không hưởng gì và không gom góp cho bà con), nhưng
    cấu trúc cú pháp Pāli ở đây rối nên ghi rõ.
  · `akhajjabhojjaleyyapeyyasāyanīyaṁ` không có trong bài này; các khoá liên quan ở mil1
    dùng cụm tương tự và tôi đã dịch “thích hợp cho uống, ăn, liếm và tắm” — dùng lại để
    nhất với cùng một công thức trong lát.

  Bị chặn cổng kỹ thuật (đợt này không được chạy `npm run validate|test|check|build`), nên tiêu chí 10 bị chặn ở **9.6**: tôi chỉ xác minh được JSON hợp lệ, đủ khoá, không orphan, không rỗng, mọi giá trị NFC, dấu lược khớp Pāli từng khoá, `(…)` không đứng một mình, ngoặc kép cân trên cả bài và YAML sạch. Bốn lệnh `npm run validate`, `npm test`, `npm run check`, `npm run build` để coordinator chạy.


  Giải quyết draft 2026-10-12 (thay thế các mục cũ nói về `mayhaka`, `dijasaṅgha`, `rakkhato`, `pipphali`, `nevattano…yathodhiṁ` và `Tiền lệ` của lát c14 ở trên khi mâu thuẫn).

  Kiểm toán độc lập đọc đối kháng Pāli↔Việt từng khoá. Bản cũ sai nghĩa thật ở khoảng 18/26 khoá nội dung: `sakuṇo mayhako` là một con chim (không phải “chim sâu”); `dija` là chim (dvija, “sinh hai lần”), `dijasaṅghā` là các đàn chim (không phải “đàn sâu”); `pipphali` là một cây/quả ăn được (có cả `āruyha` “leo lên” lẫn `bhutvāna` “ăn”), không phải “trứng” hay “đẻ trứng”; `girisānudarīcaro` là “đi lại nơi sườn núi và khe núi” (`cara`), không phải “rào quanh”; `idhekacco` không có chữ “tham lam”; `anubhoti` là “hưởng” chứ không phải “có”, và `sakiṁ` (“một lần”) bị bỏ; `mayhaṁ mayhanti rakkhato` là người ấy canh giữ “của tôi, của tôi”, không phải “kẻ canh giữ lũ mayhaka”; `dāyādā ye va appiyā` là “những người thừa kế không ưa” (tiền lệ cnd23:170/mnd7:59: “những người thừa kế không ưa”), không phải “người thân, hay kẻ không thân”; `dhīro` là “bậc trí” (không phải “dũng mãnh”); `saṅgaṇhāti ñātake` là “giúp đỡ bà con” (tiền lệ mil5.5.10: “bao bọc giúp đỡ”), không phải “gom góp/tụ lượm”. Đã sửa 1.1–1.4, 2.1–2.4, 3.1–3.4, 4.1–4.4, 5.1–5.6, 6.1–6.3 (đổi “hắn/vị ấy” gán cho con người/con chim thành “người ấy/nó/con chim ấy”). Giữ nguyên 0.1–0.4, 6.4 (“và sau khi chết hoan lạc trên cõi trời” theo tiền lệ ja532/iti106), 7.1. `yathodhikāni` (cùng gốc `odhi`) đã được dịch “cho tới mức ấy” ở ≥ 6 khoá trong tầng (ja408, ja470, ja509, ja535, snp1.3, cnd23), nên 3.3–3.4 dịch “xử sự cho đúng mức”. Không có số lượng trong bài. Cặp Pāli trùng nội bộ: 5.1 = 2.1 (`Tassevaṁ vilapantassa,`) và 5.6 ≈ 2.4 (chỉ khác `dijo`/`naro`), đều dịch giống nhau trừ chủ thể. Dấu lược: Pāli không có `…`, bản Việt không có.

  Bất định còn lại (đều ghi, không thêm vào thân kinh): (1) `pipphali` — cây/dây hay quả, loại nào; giữ nguyên chữ `pipphali` kèm “cây” (do `āruyha`), không nhận định loài; (2) `nevattano na ñātīnaṁ yathodhiṁ paṭipajjati` (3.3–3.4) — cấu trúc phủ định kép với động từ khẳng định; cách đọc đã chọn là “không vì bản thân, cũng không vì bà con mà xử sự cho đúng mức”, khớp với 4.1–4.4 (người ấy không hưởng gì, không giúp bà con); (3) `mayhaka` giữ như tên chim (tên mô phỏng tiếng kêu `mayhaṁ mayhaṁ` “của tôi”), không dịch.

  Blocker đã xếp loại: blocker còn lại duy nhất là loại (A) — bản chụp đã ghim không phát hành bản Anh cho bài (và tầng Việt hiện hành chỉ có Pháp Cú, không có lớp Anh của dự án); giữ nguyên câu, vì là sự thật về upstream; `triangulation` ở 7.5 (≤ 8.0). Không có blocker loại B/C/D riêng. Tầng tham khảo vắng nên bản dịch tự đứng vững từ Pāli root; điểm ngữ nghĩa/ngữ pháp/thuật ngữ đã hạ vì lỗi cũ nghiêm trọng và vì các bất định trên. Cổng kỹ thuật `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này nên `technical_integrity` giữ 9.6.

  Giải quyết draft 2026-10-13 (vòng 2): kiểm toán đọc đối kháng lại toàn bài 31 khoá (24 khoá kệ + 7 khoá đầu/cuối), đối chiếu Pāli từng khoá với bản Việt hiện tại. Kết quả: không còn lỗi nghĩa thật; các sửa của vòng 2026-10-12 (chim, pipphali, anubhoti, dāyādā, dhīro…) đứng vững. Sửa 5 khoá về ngữ pháp/sắc thái: (1) `vilapatveva` ở 2.4 và 5.6 là `vilapatu eva`, mệnh lệnh ngôi ba (“cứ để/mặc cho than thở”) nên dịch “cứ việc than thở” thay cho “vẫn cứ than thở”; (2) 2.1 và 5.1 bỏ chữ “cứ” không có trong `vilapantassa` (phân từ hiện tại “đang than thở”); (3) 6.1 `adhigamma` là phân từ liên kết nên dùng “sau khi có được” thay cho “khi đã có được”, để câu nối `ca` với `saṅgaṇhāti` không lẫn hai thể. Giữ 6.4 “và sau khi chết hoan lạc trên cõi trời” (mười khoá `pecca sagge` trong tầng: cách này ba lần, không cách nào khác quá hai lần; chữ “và” là nối mệnh đề theo nhịp 6.3–6.4, giống 6 trong 10 bản trong tầng). Tiêu đề 0.4 “5. Kinh Mayhaka” và 7.1 khớp tiền lệ cùng phẩm (ja381, ja384, ja385, ja387, ja388, ja393–ja395: “Kinh …, thứ …”); `translationTitle` không đổi.

  Số lượng: bài không có số Pāli (mẫu số 0). Cặp Pāli trùng nội bộ đã dò: 2 (5.1 = 2.1; 5.6 gần 2.4 chỉ khác `dijo`/`naro`), cả hai dịch nhất quán, chỉ khác chủ thể. Dấu lược: Pāli không có `…`, bản Việt không có.

  Phân loại blocker: blocker duy nhất còn lại thuộc loại (A) thuần — Sujato không có tệp cho ja390 (manifest chỉ có `root/pli/ms` của uid này; toàn thư mục Sujato `kn/ja` có 83 tệp, không có ja390). Đã viết lại thành một câu ngắn bắt đầu bằng `noEnglishEditionUpstream:` và tách khỏi mọi lời về văn bản, vì không còn bất định văn bản nào lẫn trong đó. Không có blocker B (độ phủ: mẫu số 0 vì không khoá Pāli nào đủ 40 ký tự — cổng không đo được gì, không phải đạt), C hay D riêng. Bất định còn lại (không thêm vào thân kinh): `pipphali` là cây hay quả chưa phân định; 3.3–3.4 `nevattano na ñātīnaṁ yathodhiṁ paṭipajjati` đọc “không vì bản thân, cũng không vì bà con mà xử sự cho đúng mức” — cách đọc khớp 4.1–4.4 nhưng cú pháp Pāli có thể đọc “đối với bản thân… đối với bà con”; hạ `ambiguity_integrity` xuống 9,0 vì hai bất định này. `triangulation` giữ 7,5 (≤ 8,0; không có bản Anh độc lập). `technical_integrity` giữ 9,6; `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.

  Đối chiếu bản dịch mù độc lập 2026-10-14: một dịch giả khác (cùng họ công cụ) dịch lại bài từ Pāli không xem bản dự án; so 6 khoá chênh lệch lớn nhất (trên 31 khoá) → khác nghĩa 1: sửa 1 (`3.3`–`3.4` `nevattano na ñātīnaṁ yathodhiṁ paṭipajjati`: *không vì bản thân, cũng không vì bà con mà xử sự cho đúng mức* → *Đối với bản thân cũng không, đối với bà con cũng không, người ấy chẳng xử sự cho đúng mức* — hai genitive song song đứng trước động từ, phủ định áp lên `paṭipajjati`; bản cũ có thể đọc ngược là *vì bản thân/bà con mà không cư xử đúng*; cách đọc mới cũng khớp `4.1`–`4.4`, nơi người ấy không hưởng gì cho mình và không giúp bà con; nó thay cho cách đọc ghi ở phần bất định phía trên), giữ 4 (`0.2`, `0.4`, `7.1` theo tiền lệ tên bộ, phẩm và dòng kết; `5.5` *lấy của cải rồi đi* ≈ *mang tài sản đi*), bất định còn lại: nghĩa chính xác của `yathodhi` (*đúng mức* hay *đúng phần*) và `pipphali` là cây hay quả. Rà soát đối kháng toàn bài: 31/31 khoá, nháy kép khớp Pāli từng khoá, không số đếm; `mayhaka`, `dijasaṅgha` giữ theo bản dịch hiện hành (*chim Mayhaka*, *các đàn chim*), phần ghi chú đầu bài về *muỗi*, *đàn sâu tơ*, *trứng/ấu trùng* không còn khớp bản dịch hiện hành. Không có bản Anh hay bản Việt độc lập khác. `npm run validate`, `npm test`, `npm run check`, `npm run build` chưa chạy trong lượt này.
