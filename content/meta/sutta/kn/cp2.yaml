notes: |-
  `Saṅkhacariya`, `Dānapāramī 2` trong `Akittivagga`. 41/41 khoá, tất cả đã dịch. Bài này là **bài duy nhất trong lát có tầng Anh**: `sutta/kn/cp/cp2_translation-en-sujato.json` có trong git tree của commit đã ghim (tầng `english-sujato` có 35 tệp `cp`, đủ `cp1`–`cp35`) và trong cache; **40/41 khoá có chữ Anh**, chỉ `10.1` (`Saṅkhacariyaṁ dutiyaṁ.`) bị Sujato để trống ⇒ dịch khoá đó từ Pāli + tiền lệ `cp5/cp6/cp7`. Không có bản Việt hiện hành (`translation/vi/phantuananh` tại commit đã ghim chỉ có 26 tệp, toàn bộ là Pháp Cú) và không có lớp lấp `english-project`.

  **SỐ ĐO TÊN — khác với con số đưa trong BRIEF, đã theo đo.** BRIEF nói `0.1` của `cp` giữ Pāli `Cariyāpiṭaka` "(đo được 11/12)". Đo lại trên đĩa cho **14:1 ngược lại**: 14 tệp `cp` dịch `Cariyāpiṭaka` → *Hạnh Tạng* (cp3, cp5, cp6, cp7, cp13, cp17, cp18, cp21, cp24, cp25, cp27, cp28, cp32, cp33), chỉ **cp34** giữ nguyên Pāli, và cp1/cp35 không có khoá `:0.1`. Vì đa số 14:1 và vì người đọc Việt cần tên tác phẩm chứ không phải thuật ngữ, đã dùng **Hạnh Tạng** và ghi rõ ở đây để người gộp lát đảo lại nếu muốn. Ngược lại, `0.2` `Akittivagga` → *Phẩm Akitti* là 4/4 (cp3, cp5, cp6, cp7); `0.3` `Dānapāramī 2` → *Bố Thí Ba-la-mật Thứ Hai* theo mẫu `Dānapāramī 3/5/7` của chính bộ; `0.4` `Saṅkhacariya` → *Hạnh Của Saṅkha* và `10.1` → *Hạnh của Saṅkha, thứ hai* theo mẫu 13 tệp `cp` (`Hạnh Của …` ở `:0.4`, `Hạnh của …, thứ N.` ở khoá cuối). Tầng `name/` đã ghim cũng xác nhận: `cp-name:4.cp2` → "The Conduct of Saṅkha", `cp-name:2.cp-danaparami` → "The Perfection of Generosity".

  **Pāli trùng nguyên văn: 6/41 khoá.** Dùng lại NGUYÊN VĂN 3 khoá: `1.1` `“Punāparaṁ yadā homi,` theo đa số đo được 7/13 (*Lại nữa, vào thời thuở nọ*) — 6 khoá còn lại (`cp5`, `cp28`, `cp32`, `cp34`, `cp6`) dùng biến thể khác; `0.1` theo 14/14; `0.2` theo 4/4. Ba khoá còn lại **dịch riêng, có lý do**: `2.2` `Sayambhuṁ aparājitaṁ;` trùng `tha-ap388/526` và `tha-ap439` — đó là kệ tán Đức Phật với `sayambhu` + danh xưng riêng, còn ở đây người kể đang **nhìn thấy** một vị trên đường (`Tatthaddasaṁ paṭipathe`) và Sujato dịch "one self-awakened, undefeated"; `8.3` `Tassa pādāni vanditvā,` trùng `thig6.5:4.3` — khác chủ thể (Sujato: "and bowed to his feet"); `9.2` `Sukhumālo sukhedhito;` trùng `tha-ap80` — khác ngữ cảnh (Sujato: "more delicate and pampered than him").

  **Dấu lược:** không segment nào của bài có `…pe…` ⇒ không vấn đề dấu lược; cả hai phía đều 0.

  **Chỗ đã cân nhắc và ghi lại:** `8.2` `orohitvā upāhanā` là "cởi dép ra" (Sujato: "I took off my sandals") — cặp `8.2`/`8.4` cùng nhắc dép: ở `8.4` `chattupāhana` là **một cây lọng và một đôi dép**, dịch đủ hai vật như Sujato ("an umbrella and sandals") và không bỏ vật nào. `9.1`–`9.2` `Tenevāhaṁ sataguṇato, Sukhumālo sukhedhito` là một mệnh đề so sánh ("dù nhẹ hơn… trăm lần / dễ chịu hơn và được chiều đãi hơn"), `sukhumāla` giữ nghĩa *mỏng manh, dễ chịu* theo Sujato "delicate".

  Bốn cổng kỹ thuật theo `AGENTS.md` (`npm run validate`, `npm test`, `npm run check`, `npm run build`) **không chạy** trong lát này vì BRIEF cấm; `technical_integrity` đặt **9.6** vì mọi chốt tự động đã xanh (phủ 41/41 khoá, NFC, không trùng nguyên văn Pāli ngoài khối tiêu đề, không lọt Pāli trên quét 143.023 khoá toàn tầng = 0, khớp số dấu lược, nháy kép cân trên cả bài) và cổng `npm` chưa chạy.
