  cả cuốn** vì 169 tệp vẫn đang viết *Tuyên Ngợ*.
  Chữ chính tả: **không** dùng *Tuyên Ngợ* (sai) — tôi dùng *Tuyên Ngôn*.
  `:0.3` **không** có số thứ tự, và Pāli `:0.3` = `Sīhāsanadāyakattheraapadāna`
  **không bắt đầu bằng chữ số** ⇒ theo luật *giữ số khi và chỉ khi Pāli bắt đầu bằng
  số*, tôi bỏ. Đo toàn tầng `tha-ap`: KEEP **66** · DROP **357**.
  Lục kết `14.1 …therassāpadānaṁ paṭhamaṁ` → *Ký sự về Trưởng lão …, thứ nhất.*
  đúng hình thức **62** tệp (không kèm *Bài Kệ*); *thứ nhất* là **40**/62.
