  đã có `:0.1`) ⇒ tôi giữ nguyên chữ Pāli ở `0.1`. Đây là **quy ước tầng** như
  `nevasaññānāsaññāyatana`, không phải khoá bỏ dịch: nó là tên bộ sách và xuất
  hiện y hệt ở 562 khoá Pāli khác.
  `Sīhāsaniyavagga` → *Phẩm Sīhāsaniya* **9/9** tiền lệ cùng phẩm (`tha-ap15`,
