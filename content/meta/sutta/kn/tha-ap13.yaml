notes: |-
  **Bài này.** `tha-ap13` · phẩm `Sīhāsaniyavagga` (Phẩm Sīhāsaniya) · trưởng
  lão Sīhāsanadāyaka · bản đầu tiên của phẩm · **53 khoá Pāli, 53 khoá đã dịch,
  đủ và không thừa**. Tệp dịch và tệp metadata đều **không tồn tại** trước lát này
  nên tôi dựng mới từ Pāli root đã ghim. 53/53 khoá Pāli đều **dưới 40 ký tự**
  (vế kệ chỉ 18–26 ký tự) ⇒ công cụ quét sẵn có quét **không mấy khoá nào** rồi báo xanh;
  đó là không kiểm, không phải đạt. Năm phép dưới đây tôi tự viết và quét **mọi**
  khoá.

  **Năm phép kiếm, mỗi phép in số kèm mẫu số** :
  1. Tập khoá: `set(khoá Việt)` = 53, `set(khoá Pāli)` = 53, bằng nhau — đúng;
     thiếu 0, thừa 0, orphan 0; **thứ tự khoá bằng thứ tự Pāli** — đúng. Mẫu số 53.
  2. Nháy kép `“”` và nháy đơn `‘’`: tổng Pāli 1 kép / 0 đơn, Việt 1 kép / 0 đơn.
     So **từng khoá** lệch **0** trên 53. Ở bài này nháy kép **cố ý chạy qua khoá**:
     mở ở `1.1`, khép ở `12.4` ⇒ số dư luỹ kế sau khoá cuối = **0** ở cả hai bên.
     Lần chạy đầu của tôi báo "lệch 2" vì đòi mỗi khoá tự cân — đó là **lỗi của
     phép đo**, không phải của bản dịch; tôi sửa phép rồi chạy lại.
  3. Dấu lược: trong 53 khoá Pāli của bài này **không có** `…pe…`, **không có**
     `…` trần, **không có** `(…)`, **không có** `….` ⇒ không có gì để bung và
     không có gì để nén. Ba quy ước tầng (`(…)`, *xứ phi tưởng phi phi tưởng*,
     ` ….`) **không xuất hiện** ở bài này nên tôi không đụng tới.
  4. Pāli trùng nguyên văn **trong chính bài** mà Việt khác: **0 nhóm**, tức
     **0 cặp** trên tổng 53 khoá. (Bài này không có khoá lặp.)
  5. NFC: 53/53 chuỗi đã chuẩn hoá; dấu nháy thừa 0; khoảng trắng kép 0; không
     khoá nào còn sót nguyên văn Pāli **trừ** `0.1` xem mục thuật ngữ.

  **Pāli trùng ở bài khác: 31 khoá / 53, dùng lại nguyên văn 21.**
