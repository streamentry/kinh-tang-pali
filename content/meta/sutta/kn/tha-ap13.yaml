  `Catunnavutito kappe` → *chín mươi tư* (tiền lệ 115 bản trùng, `tha-ap104:4.1`,
  `tha-ap41:4.1`, `tha-ap169:3.1`);
  `Duggatiṁ nābhijānāmi` → *không biết mình rơi vào khổ đau* **128** vs
