  `puññakammassidaṁ phalaṁ` → *đó là quả của nghiệp phước* **6/17**;
  `Pasannacitto sumano` → *Với tâm tịnh tín hân hoan* (90 bản trùng);
  `Tena cittappasādena` → *Nhờ tâm tịnh tín ấy* (34 bản trùng);
  `Maṇimayā ca pallaṅkā` → *Tấm ghế làm bằng ngọc ngà* (`tha-ap449:3.3`);
