notes: |-
  **Bài này.** `tha-ap13` · phẩm `Sīhāsaniyavagga` (Phẩm Sīhāsaniya) · trưởng
  lão Sīhāsanadāyaka · bản đầu tiên của phẩm · **53 khoá Pāli, 53 khoá đã dịch,
  đủ và không thừa**. Tệp dịch và tệp metadata đều **không tồn tại** trước lát này
  nên tôi dựng mới từ Pāli root đã ghim. 53/53 khoá Pāli đều **dưới 40 ký tự**
  (vế kệ chỉ 18–26 ký tự) ⇒ `_hvi.py` quét **không mấy khoá nào** rồi báo xanh;
  đó là không kiểm, không phải đạt. Năm phép dưới đây tôi tự viết và quét **mọi**
  khoá.

  **Năm phép kiếm, mỗi phép in số kèm mẫu số** (`_chk_n68.py`):
  1. Tập khoá: `set(khoá Việt)` = 53, `set(khoá Pāli)` = 53, bằng nhau — đúng;
     thiếu 0, thừa 0, orphan 0; **thứ tự khoá bằng thứ tự Pāli** — đúng. Mẫu số 53.
  2. Nháy kép `“”` và nháy đơn `‘’`: tổng Pāli 1 kép / 0 đơn, Việt 1 kép / 0 đơn.
     So **từng khoá** lệch **0** trên 53. Ở bài này nháy kép **cố ý chạy qua khoá**:
     mở ở `1.1`, khép ở `12.4` ⇒ số dư luỹ kế sau khoá cuối = **0** ở cả hai bên.
     Lần chạy đầu của tôi báo "lệch 2" vì đòi mỗi khoá tự cân — đó là **lỗi của
     phép đo**, không phải của bản dịch; tôi sửa phép rồi chạy lại.
  3. Dấu lược: trong 53 khoá Pāli của bài này **không có** `…pe…`, **không có**
     `…` trần, **không có** `(…)`, **không có** `….` ⇒ không có gì để bung và
     không có gì để nén. Ba quy ước tầng (`(…)`, *xứ phi tưởng phi phi tưởng*,
     ` ….`) **không xuất hiện** ở bài này nên tôi không đụng tới.
  4. Pāli trùng nguyên văn **trong chính bài** mà Việt khác: **0 nhóm**, tức
     **0 cặp** trên tổng 53 khoá. (Bài này không có khoá lặp.)
  5. NFC: 53/53 chuỗi đã chuẩn hoá; dấu nháy thừa 0; khoảng trắng kép 0; không
     khoá nào còn sót nguyên văn Pāli **trừ** `0.1` xem mục thuật ngữ.

  **Pāli trùng ở bài khác: 31 khoá / 53, dùng lại nguyên văn 21.**
  Toàn tầng tôi dò **284.708** segment Pāli đã ghim (`kn` `sn` `an` `dn` `mn`).
  Trong 53 khoá của bài này có **31** khoá có Pāli trùng ở ít nhất một bài khác:
  **21** khoá dùng lại **nguyên văn** bản Việt đã có, **8** khoá cố ý viết khác với
  lý do nêu, **2** khoá trùng Pāli nhưng bài trùng **chưa có bản Việt** nên tôi dịch
  mới (`1.3`, `6.4`), và **22** khoá không có Pāli trùng ở đâu. Ba số cộng lại
  31 + 22 = 53, đủ.

  **Hai mươi mốt khoá dùng lại nguyên văn** (mỗi khoá có ít nhất một bản Việt sẵn
  trùng đúng chuỗi Pāli; ngoặc là số bản Pāli trùng):
  `0.1` (562) · `0.2` (9, `tha-ap15:0.2` + `tha-ap19:0.2`) · `0.3` (1,
  `tha-ap177:0.3` — **Pāli trùng byte tuyệt đối**, kể cả lỗi gõ `kattheraapadāna`)
  · `1.1` (12, `tha-ap177:1.1`) · `2.1` (90) · `3.3` (34) · `3.4` (7) · `6.1` (12,
  `tha-ap150:2.3`) · `7.1` (1, `tha-ap449:3.3`) · `9.1` (115) · `9.2` (62,
  `tha-ap21:10.2` — trùng đúng **cả cặp kệ** `9.1`–`9.4` với `tha-ap21:10.1`–`10.4`)
  · `9.3` (454) · `9.4` (18) · `10.1` (3, `tha-ap104:5.1` + `tha-ap190:4.1`) ·
  `11.3` (50) · `11.4` (2, `tha-ap7:6.4` + `tha-ap15:7.4`) · `12.1` (599) ·
  `12.2` (85) · `12.3` (92) · `12.4` (593) · `13.1` (1, `tha-ap177:6.1`).

  **Tám chỗ cố ý viết khác — mỗi chỗ một lý do:**
  1. `2.2 sīhāsanamakāsahaṁ;` — bản duy nhất trong tầng (`tha-ap449:5.2`) là *ta đã
     làm và đã dâng cúng tòa sư tử ấy*, tức **nuốt mất** động từ `akāsahaṁ` và
     gộp hai vế vào một. Tôi dịch đủ: *tôi làm tòa sư tử rực trắng*.
  2. `5.1 Sataṁ kaññāsahassāni,` — xem blocker thứ ba. Theo tiền lệ tầng, không
     phải vì tôi bảo 5.000.000 là sai.
  3. `6.3 Pāsādā sivikā ceva,` — **không có** tiền lệ đúng chuỗi này (`tha-ap150:3.1`
     là `Pāsādā sivikā vayhaṁ`, `dn32:7.30` là `Pāsādā sivikā`), nên tôi tự dịch
     theo nghĩa: *Ghế ngồi, ghế nằm*. Hai bản kia dùng *lâu đài* và *cung điện*
     cho `pāsādā` trong ngữ cảnh cung điện của thiên cõi; ở đây kệ đang liệt kê
     đồ dùng mà sinh ra tuỳ ý nên *ghế* đúng hơn.
  4. `8.1 Soṇṇamayā rūpimayā,` — `tha-ap449:3.1` chèn thêm danh từ *Ghế ngồi*
     vốn không có ở Pāli khoá này. Tôi **không** chèn, vì chèn danh từ là thêm
     chữ không đánh dấu.
  5. `8.4 pādapīṭhassidaṁ phalaṁ.` — `tha-ap450:8.4` cùng cấu trúc nhưng dịch là
     *đây là quả báo của việc cúi đầu lễ bái*, tức lấy nhầm nghĩa của một khoá khác
     trong bài đó. Tôi dịch đúng: *đó là quả báo của gốc cây*.
  6. `7.4 sīhāsanassidaṁ phalaṁ.` — hai bản trùng (`tha-ap110:4.4`,
     `tha-ap449:2.4`) dùng *quả báu*, còn tầng nghiêng *quả báo* **254:66** với cụm
     *…của việc*. Tôi dùng *quả báo* và giữ nhất quán với `8.4` trong cùng bài.
  7. `5.2 parivārenti maṁ sadā;` — `tha-ap116:6.2` dịch *họ luôn vây quanh tôi*,
     tức thêm chủ từ *họ* không có trong Pāli. `mā` là *ta/tôi* của chính vị trưởng
     lão đang kể, nên tôi dịch *luôn luôn vây quanh ta*.
  8. `10.3 Dvesattatimhito kappe,` — xem blocker thứ hai.

  `11.1 Samasattatito kappe,` là **hapax** toàn Pāli root, không có tiền lệ nào để
  đối chiếu; tôi tính cùng cấu tạo với `10.1` (sama 3 + sattati 70 = 73) và ghi
  trong blocker thứ hai.

  **Hai mươi mốt khoá dùng lại nguyên văn** (đều có bản Việt sẵn trùng đúng chuỗi
  Pāli): `0.1` (562 bản trùng), `0.2` (`tha-ap15:0.2`, `tha-ap19:0.2`), `0.3`
  (`tha-ap177:0.3` — **Pāli trùng byte tuyệt đối**, kể cả lỗi gõ `kattheraapadāna`),
  `1.1` (`tha-ap177:1.1`), `2.1` (90 bản trùng), `3.3` (34), `6.1` (`tha-ap150:2.3`),
  `7.1` (`tha-ap449:3.3`), `9.1` (115), `9.2` (`tha-ap21:10.2` — trùng đúng cả cặp
  kệ `9.1`–`9.4` với `tha-ap21:10.1`–`10.4`), `9.3` (454), `11.3` (50),
  `11.4` (`tha-ap7:6.4`, `tha-ap15:7.4`), `12.1` (599), `12.2` (85), `12.3` (92),
  `12.4` (593), `13.1` (`tha-ap177:6.1`), `1.3`, `3.4`, `5.2`, `10.1`.

  **Lời-kết `13.1` — theo nhóm 407, không phải nhóm 21.**
  Pāli `Itthaṁ sudaṁ āyasmā sīhāsanadāyako thero imā gāthāyo abhāsitthāti`
  có `imā gāthāyo` là **số nhiều** còn `abhāsitthāti` là quá khứ của **một** sự kiện.
  Tôi dùng dạng của nhóm đông đảo: *đã nói **những bài kệ này***. Nhóm 21 khoá dùng
  *số ít* *bài kệ này* đã bị gọi là lỗi ở bốn lát liên tiếp trước đây. Ở bài này
  chỉ có **1** bản trùng (`tha-ap177:6.1`) và nó nằm trong nhóm 407, nên không có
  mâu thuẫn nào để hòa giải.

  **Thuật ngữ, đếm được:**
  `Therāpadāna` giữ nguyên **414** vs *Trưởng Lão Ký Sự* **9** (423 tệp `tha-ap`
  đã có `:0.1`) ⇒ tôi giữ nguyên chữ Pāli ở `0.1`. Đây là **quy ước tầng** như
  `nevasaññānāsaññāyatana`, không phải khoá bỏ dịch: nó là tên bộ sách và xuất
  hiện y hệt ở 562 khoá Pāli khác.
  `Sīhāsaniyavagga` → *Phẩm Sīhāsaniya* **9/9** tiền lệ cùng phẩm (`tha-ap15`,
  `tha-ap19`, `tha-ap21`), 0 cách khác.
  `:0.3` — phe dấu `ti`, đo ở **phạm vi gần nhất**: `tha-ap165`–`tha-ap195` cho
  **Tuyên Ngôn 14 · Tuyên Ngợ 6**; toàn tầng `tha-ap` (khuôn *Bài Kệ X Về Trưởng
  Lão*) cho **Tuyên Ngợ 169 · Tuyên Ngôn 70 · Tuyên Ngợi 3**. Hai phạm vi cho hai
  đa số khác nhau. Tôi chọn **Tuyên Ngôn** vì hai lý do đo được: phạm vi gần nhất
  nghiêng về nó, và `tha-ap177:0.3` có **Pāli trùng byte tuyệt đối** với `tha-ap13:0.3`
  rồi dịch đúng bằng *Tuyên Ngôn*. **Phân kỳ này để người biên tập phán một lượt cho
  cả cuốn** vì 169 tệp vẫn đang viết *Tuyên Ngợ*.
  Chữ chính tả: **không** dùng *Tuyên Ngợ* (sai) — tôi dùng *Tuyên Ngôn*.
  `:0.3` **không** có số thứ tự, và Pāli `:0.3` = `Sīhāsanadāyakattheraapadāna`
  **không bắt đầu bằng chữ số** ⇒ theo luật *giữ số khi và chỉ khi Pāli bắt đầu bằng
  số*, tôi bỏ. Đo toàn tầng `tha-ap`: KEEP **66** · DROP **357**.
  Lục kết `14.1 …therassāpadānaṁ paṭhamaṁ` → *Ký sự về Trưởng lão …, thứ nhất.*
  đúng hình thức **62** tệp (không kèm *Bài Kệ*); *thứ nhất* là **40**/62.
  `Paṭisambhidā catasso` → *Bốn vô ngại giải* **423**;
  `vimokkhāpi ca aṭṭhime` → *và tám giải thoát này* **41**;
  `Chaḷabhiññā sacchikatā` → *Sáu thắng trí đã chứng đắc* **48**;
  `kataṁ buddhassa sāsanaṁ` → *đã làm tròn lời dạy của Đức Phật* **381**;
