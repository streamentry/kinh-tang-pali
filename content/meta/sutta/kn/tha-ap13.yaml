  **thay thế** mọi chỗ xung đột ở phần trên: các mục *Hai mươi mốt khoá dùng lại
  nguyên văn*, *Tám chỗ cố ý viết khác*, *Số Pāli*, *hai từ chỉ xuất hiện một lần*,
  *Vì sao draft*, quy ước `yojana`, và các câu đọc *gốc cây*, *ngọc trai*, *vòng*,
  *Ghế ngồi, ghế nằm*, *ba loài*, *Tuyên Ngôn*. Đọc lại toàn bài từng khoá với Pāli,
  kiểm toán đối kháng: **19/53** khoá sai nghĩa thật (đa số do tầng cũ chép tiền
  lệ sai hoặc đoán từ lẻ), **41/53** khoá được sửa chữ.

  **Khoá sai nghĩa đã sửa (Pāli → cách đọc):**
  - `1.2` `siddhatthe dvipaduttame` — **Siddhattha** là tên Đức Phật (khớp *chín mươi
    tư kiếp* ở `9.1`; cùng tên ở `tha-ap14`, `tha-ap21`, `tha-ap42`…), *dvipaduttama*
    = *tối thắng giữa loài hai chân* (bv, snp). Bản cũ nuốt mất tên và bịa *Đấng Đạo Sư
    tỏ ra rõ ràng*.
  - `1.3`–`1.4` `vitthārike pāvacane … bāhujaññamhi sāsane` — *giáo pháp được truyền
    rộng, trong lời dạy được đông đảo người biết đến* (`tha-ap329:16.1–2`, `tha-ap8:7.1`,
    `bv3:14.1`), không phải *nhờ hiểu biết nhiều*.
  - `2.2`, `2.4` — `akāsahaṁ` là *đã làm*; `sīhāsana` là tòa sư tử; **`pādapīṭha` là
    ghế kê chân** (đã chuẩn ở `tha-ap450`), không phải *gốc cây*; *rực trắng* bịa.
    Cùng lỗi *gốc cây* ở `8.4` đã sửa.
  - `3.1`–`3.2` `sīhāsane ca vassante, gharaṁ tattha akāsahaṁ` — *khi mưa rơi trên tòa
    sư tử, tôi làm một ngôi nhà ở đó* (`vassante` là mưa, chữ `s` đôi; không phải *cư trú*).
  - `4.x` — `tāvade` = *ngay lúc ấy* (131 khoá bv/tha-ap); đơn vị `yojana` → *do-tuần*
    (**166** vs *yojana* 4 trong toàn kn; **65** vs 1 trong `tha-ap`); `vitthārena` =
    *chiều rộng*, `āyāmena` = *chiều dài*.
  - `5.1` `sataṁ kaññāsahassāni` — *kaññā* là **thiếu nữ**, không phải số hay *vòng*:
    *một trăm ngàn thiếu nữ* (`vv20:8.3`, `vv43:7.3`; `pv34:2.3` *dasa kaññāsahassāni* =
    *mười ngàn thiếu nữ*). Ứng viên 5.000.000 của bản cũ do đọc *kañña* như một số, **bác bỏ**.
  - `5.3`–`5.4` `byamhe` = *trong cung điện* (locative của `byamha`, 63 khoá);
    `sunimmitaṁ` bổ nghĩa cho chiếc ghế dài (`pallaṅka`): *khéo được tạo ra, hiện có
    trong cung điện*. Bản cũ bịa *ở ngay bên ta*.
  - `6.3`–`6.4` `pāsādā sivikā` = *các lâu đài và kiệu ngồi* (`tha-ap150:3.1`, `tha-ap481:13.1`);
    bản cũ *Ghế ngồi, ghế nằm* sai. `6.1`: bỏ *kéo* (Pāli chỉ *hatthiyāna/assayāna*,
    *Xe voi, xe ngựa* **8** vs *kéo* 3).
  - `7.1`–`7.2` `maṇimayā`, `sāramayā` = *bằng ngọc ma-ni*, *bằng lõi gỗ* (`tha-ap1:21.3`);
    *ngọc trai* sai. `pallaṅka` → *ghế dài* (kn: *ghế dài* **20** · *ghế* **21** · *giường* 7;
    chọn *ghế dài* để tách khỏi `pīṭha`/`āsana`).
  - `8.2` `phalikāveḷuriyāmayā` = *pha lê và lưu ly* (*lưu ly* ≈ **61** trong kn; *ngọc lam* sai).
  - `8.3` `pādukā abhirūhāmi` — *pādukā* là dép/guốc (`ja547:113.3`, `thag7.1:1.4`),
    *abhirūhāmi* là *mang/bước lên*, không phải *dựng những tấm đệm*.
  - `9.2`, `9.3` — bỏ *thiện* và *mình rơi vào khổ đau* thêm ngoài Pāli:
    *nghiệp mà tôi đã làm vào lúc ấy* (`tha-ap21:10.2`), *không biết đến đọa xứ nào* (`tha-ap28:3.3`).
  - `10.2`, `10.4`, `11.2` `nāmakā`, `tayo janā` = **ba vị mang tên** Inda, Sumana, Varuṇa
    (khuôn *…nāmakā* 32 khoá, ví dụ `tha-ap15:6.2`, `tha-ap54:11.2`); bản cũ *ba loài*,
    *chúa thiên Indra*, *Sumanā* sai.
  - `11.1` `Samasattatito` — xem blocker số đã gỡ bên dưới: *vào đủ bảy mươi kiếp trước*.
  - `0.3` — chuyển *Bài Kệ Tuyên Ngôn Về Trưởng Lão* sang *Ký Sự Về Trưởng Lão* cho khớp
    `14.1` ngay trong bài và `tha-ap450:0.3`: **169** (130 + 39 có số) *Ký Sự* vs **138**
    *Tuyên Ngôn* vs hơn 220 *Tuyên Ngợ/Ngợi* trong 423 tệp `tha-ap` (không phân kỳ được
    bằng đa số; chọn theo nghĩa *apadāna* và theo khuôn trong chính bài). `translationTitle`
    khớp.
  - Đồng nhất đại từ: `3.2`, `4.3`, `5.2`, `7.3`, `9.3` đổi *ta* → *tôi* (người kể xưng *tôi* ở
    `2.x`, `3.4`, `8.3`, `9.2`). `7.4`/`8.4`/`9.4` dùng *đây là quả của…* (Pāli `idaṁ phalaṁ`).

  **Blocker đã xử lý:**
  1. *Thiếu bản Anh upstream* (loại A) — **giữ nguyên**; đó là sự thật của bản chụp đã ghim.
     Câu này cũng nêu việc thiếu tầng `vietnamese-current` (loại C: chỉ có Pháp Cú, giới hạn
     tham chiếu, không phải lỗi văn bản) và `english-project` chưa có.
  2. *Số 10.1/10.3/11.1* (loại D) — **gỡ**. `Tesattatimhito` = te 3 + sattati 70 = **73**
     (`tha-ap62:13.1`, `tha-ap104:5.1`, `tha-ap190:4.1`, `tha-ap244:4.1`, `tha-ap245:4.1` đều 73);
     `Dvesattatimhito` = dve 2 + sattati 70 = **72** (tầng hiện thống nhất: `tha-ap172:4.1`
     và `tha-ap212:5.1` đều *bảy mươi hai*; các giá trị 28 và 140 trong ghi chú cũ **không còn**
     trong tầng). `Samasattatito`: *sama-* đứng trước số là *đủ/trọn* (`Samatiṁsasahassāni` =
     *đủ ba mươi ngàn* ở `bv5:20.1`, `bv19:18.1`) ⇒ *đủ bảy mươi* = 70, **không** phải 73
     (73 lặp lại `10.1`, vô lý trong một dãy kiếp giảm dần). Bất định còn lại (ghi, không đưa
     vào thân kinh): từ này là hapax (1 khoá trong toàn Pāli root) nên không có đối chiếu độc
     lập; nếu người biên tập chứng minh được *sama-* là chép sai của *eka-* thì đổi thành 71.
  3. *Số 5.1* (loại D) — **gỡ**: xem `5.1` phía trên.
  4. *Chưa có entry trong `reference-gaps.yaml`* — **gỡ**: đó không phải lỗi văn bản mà là
     trạng thái của một tệp do công cụ của kho sinh; bài không có bản Anh nào nên mất mát
     thuộc blocker thứ nhất, do waiver `no-upstream-english` xử lý.

  **Phép kiểm sau khi sửa.** 53/53 khoá Pāli ↔ 53/53 khoá Việt (thứ tự khớp), nháy kép
  `“` ở `1.1` và `”` ở `12.4` cân (Pāli và Việt đều 1/1, nháy đơn 0/0), không `…`, `(…)` hay
  `….` ở cả hai bên, 0 khoá Pāli trùng nguyên văn **trong chính bài**, 53/53 chuỗi NFC;
  kiểm tra cấu trúc và tập khoá của lô ✓. Số Pāli đã tính lại: catubbīsa = 4 + 20 = **24**;
  catuddasa = 4 + 10 = **14**; catunnavuti = 4 + 90 = **94**; sata × sahassa = **100.000**
  (thiếu nữ); tesattati **73**; dvesattati **72**; samasattati **70** (xem trên);
  catasso 4 · aṭṭhime 8 · chaḷabhiññā 6 · sattaratana 7 · catudīpa 4.

  **Từ khó, ghi lại.** `abhirūhāmi` (`8.3`) đọc là *mang* (dép/guốc) theo Vinaya
  (*pādukaṁ abhiruhati*) và `thag7.1:1.4` (*pādukāruyha*) — không có ví dụ trực tiếp trong
  kn, độ chắc vừa phải. `vassante` (`3.1`) đọc là mưa (không phải *vasati*) — hợp ngữ cảnh
  *làm nhà che tòa sư tử*, nhưng Pāli không nói *che*. Chiếc ghế/ghế dài ở `5.3`, `7.1`,
  `7.2` đều là `pallaṅka`. `issarā` (`11.4`) giữ *là vua* theo khuôn 3 khoá cùng chuỗi.

