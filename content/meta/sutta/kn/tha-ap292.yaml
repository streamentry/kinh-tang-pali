notes: |-
  Bản dịch tiếng Việt mới cho bài kinh tha-ap292 — trưởng lão Pubbaṅgamiyo, bài thứ mười
  và bài cuối của Paṇṇadāyakavagga trong Therāpadāna (Kinh Tạng bộ, tập Trường Bộ).

  Tiền kiếp: tám mươi sáu nghìn người xuất gia không vướng mắc, ông đi trước trong số ấy
  nhờ chứng ngộ điều tối thượng; họ phụng sự ông rồi ông hồi tưởng các bậc Chấp Giác, tuổi
  thọ đi đến tận cùng và ông thọ phước làm thiên thần. Vào chín mươi tư kiếp trước ông gìn
  giữ phẩm hạnh, không biết mình rơi vào khổ đau; đó là quả của sự thiền định ấy.

  Bất định đã ghi lại, không sửa trong kinh:
  - `Sarāgā` (2.1) xuất hiện đúng một lần trong toàn bộ Pāli đã ghim. Nghĩa lấy từ chính
    kinh điển cùng commit: `ps1.1:404.2` giảng `Sarāgā caratīti` ngay cạnh `Sadosā`,
    `Samohā`, `Samānā`, `Sadiṭṭhi`, `Saudḍhaccā`, `Savicikicchā`, `Sānusayā` — tức nhóm
    “không còn X”. Vì vậy dịch là không còn dục tham. Đây là suy luận từ mạng lưới từ vựng
    trong kinh điển đã ghim, không phải từ từ điển, và không có bản Anh nào để đối chiếu.
  - `Cullāsītisahassāni, pabbajimha akiñcanā` (1.1–1.2): con số không có mệnh đề chi phối
    trong câu kệ. Giữ nguyên vị trí và chủ từ “tôi” như Pāli. Cùng con số này ở tha-ap489:3.1
    lại đi với “đệ tử của tôi”, nên đây là đặc điểm của thể tụng, không phải lỗi sao chép.
  - `sambuddhānaṁ patissato` (4.2): `patissato` là hồi tưởng; bản dịch không thêm chữ
    nào không có nguồn ứng với.
  - `Paṇṇadāyakavaggo ekūnatiṁsatimo` (9.1): số thứ tự truyền thống là chín mươi mối, lệch
    với dãi 28–38 của mười phẩm liền kề (282 là 28, 302 là 30, 312 là 31, 322 là 32, 332
    là 33, 342 là 34, 352 là 35, 362 là 36, 372 là 37, 382 là 38). Dịch đúng con số Pāli,
    không tự sửa thành 29 — sửa số thứ tự phẩm là sửa dữ kiện của kinh điển.
  - uddāna 11.1–11.5 giữ tên Pāli nguyên văn (Paṇṇa, Phala, Paccuggama, Ekapupphi,
    Maghavā, Upaṭṭhākā, Padāna, Pabbajjā, Buddhupaṭṭhāko, Pubbaṅgamo), theo tiền lệ
    tha-ap252:9. Đã đối chiếu từng tên với tiêu đề `0.3` của mười bài trong phẩm
    (tha-ap283–292) và thấy khớp cả mười.
  - `aṭṭhatālīsa kittitā` (11.6): tám mươi tám bài kệ, dịch là đã được tuyên ngợ, phân biệt
    với `piṇḍitā` ở tha-ap32:10.4 dịch là tính đếm.

  Thuật ngữ đã chốt sau khi đếm tiền lệ trong tầng: `Therāpadāna` (8 bài cùng lát),
  `Bài Kệ Tuyên Ngợ Về Trưởng Lão` (232 so với 118 “Tuyên Ngôn” và 112 “Ký Sự Về Trưởng
  Lão”), `Tôn giả Trưởng lão` (366), `Bốn vô ngại giải` (275), `đã làm tròn lời dạy của
  Đức Phật`, `Tóm tắt phẩm này`, `Vào chín mươi tư kiếp trước` cho `Catunnavutito kappe`
  — đây là 94, và tiền lệ đa số cũng là chín mươi tư; nhóm nhỏ dịch “bốn mươi chín” là đọc
  sai số, không lấy. Tên phẩm `Paṇṇadāyakavagga` theo đa số trong chính phẩm này (6 bài
  “Phẩm Paṇṇadāyaka” so với 3 “Phẩm Bậc Cho Lá”), và tầng `name/` đã ghim xác nhận
  nguồn Pāli cho tên phẩm.

  Bốn lệnh cổng kỹ thuật của dự án là `npm run validate`, `npm test`, `npm run check` và `npm run build` (lớp CI chạy cả bốn; lát này không tự chạy vì BRIEF cấm, nên `technical_integrity` đặt 9.6 chứ không phải 10). Trong lát, mọi khoá đã qua kiểm của chính tầng Việt qua `_hvi.save_vi`: đủ 36/36 khoá, cân ngoặc kép trên cả bài, đúng số dấu lược theo Pāli, NFC, không trùng nguyên văn Pāli, không lọt Pāli. `final_score` là trung bình số học thô của đúng 10 tiêu chí, tính bằng script.
