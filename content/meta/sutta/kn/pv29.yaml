  Toàn bộ 28 khoá được kiểm tra cẩn thận về phân đoạn, cân bằng dấu ngoặc kép và chuẩn hóa Unicode NFC.


  Lượt cải thiện 2026-10-11 (đọc đối kháng từng khoá Pāli↔Việt; thay thế phần tự chấm 2026-10-04 về chất lượng nghĩa, các mục trên giữ làm lịch sử):
  Đã sửa 23/28 khoá: 0.3, 1.1–1.4, 2.1–2.4, 3.1–3.4, 4.1, 4.4, 5.2–5.4, 6.1–6.4, 7.1.
  - 1.1–1.2: bản cũ gán "kẻ này ăn trấu thóc / kẻ kia ăn máu thịt chính mình", bỏ mất `punāparo` và `ayañca nārī`. Nay: một kẻ ăn trấu của lúa sāli, lại một kẻ khác nữa, và người nữ này ăn máu thịt của chính mình; 1.3–1.4 nối động từ `paribhuñjasi` ("ngươi ăn lấy; đây là quả báo của việc gì?"), cùng cách dịch `kissa ayaṁ vipāko` ở pv9, pv36, pv40.
  - 2.3: bản cũ bịa "Người phụ nữ này ăn thịt loài khác" (Pāli chỉ có `ayaṁ`, không có nārī; `maṁsāni` là các miếng thịt, không có "loài khác"). 2.1 "hãm hại" → "làm hại" (`hiṁsati`, như pv21).
  - 3.2: bỏ lặp "nữ chủ làm chủ" → "nữ gia chủ, là bà chủ của cả gia tộc" (cùng Pāli ở pv39:7.2). 3.3–3.4: bỏ "tài vật", "chẳng chịu đem bố thí" (thêm ý chí không có trong Pāli).
  - 5.2: "cùng nghiệp nói dối cả hai điều" tối nghĩa → "và của lời nói dối, của cả hai". 5.3–5.4: bỏ "thanh sạch", "lại", "hôi thối" thêm vào. 6.1–6.4: bỏ "Quả thật", "đã tạo", "bao giờ", "tởm lợm", "phải… như vậy"; `kiminaṁ` = đầy giòi bọ.
  - 0.3/7.1 và `translationTitle`: "Trấu Thóc" → "Trấu" (`bhusa` = trấu; Pāli không có "thóc"; 7.1 theo mẫu "…, thứ tư" của các bài pv khác). 1.4 bỏ dấu chấm thừa sau ”.
  Điểm đổi: semantic_fidelity 9.3 → 8.8; grammar_logic 9.3 → 9.0; terminology 9.2 → 9.0; vietnamese_clarity 9.3 → 8.9; ambiguity_integrity 9.2 → 8.8; các tiêu chí còn lại giữ (triangulation vẫn 7.5, không có bản Anh độc lập). final_score 9.23 → 9.05. Hạ điểm vì bản cũ có nhiều khoá sai nghĩa thật, nay đã sửa nhưng còn bất định dưới đây.
  Bất định còn lại (không phân xử được từ nguồn trong kho): (a) 1.1 `Bhusāni eko sāliṁ punāparo` đọc là "trấu của lúa sāli / một kẻ khác" hay "một kẻ ăn trấu, một kẻ khác ăn lúa sāli" (cấu trúc eko/punāparo gợi bốn chủ thể mỗi người một món); bản dịch theo cách đọc thứ nhất và không nêu kẻ khác ăn gì. (b) 2.1–2.4 ba "ayaṁ" không xác định được khớp với ai trong 1.1–1.2. (c) 3.3 `santesu` không có tân ngữ; "của" là phần bổ sung tối thiểu. (d) `akantaṁ` giữ "ghê tởm" (nghĩa gốc: không đáng ưa).
  Số liệu: 28/28 khoá khớp Pāli, nháy và dấu lược khớp từng khoá, NFC sạch; kiểm tra kỹ thuật chưa chạy trong lượt này: `npm run validate`, `npm test`, `npm run check`, `npm run build`.