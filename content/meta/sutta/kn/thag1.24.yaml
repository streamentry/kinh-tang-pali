notes: |-
  **Trưởng lão Sugandha, phẩm Phẩm Thứ Ba.**

  **`1.3`–`1.4` dùng lại NGUYÊN VĂN bắt buộc của 4 bài khác.** `Tisso vijjā anuppattā, / kataṁ buddhassa sāsanan”ti.` trùng y hệt `thag1.55:1.3-1.4`, `thag1.66:1.5-1.6`, `thag1.107:1.3-1.4` và `thag1.108`/`112`/`117:1.4`. TIEN_LE_PHAI.md liệt kê `thag1.107:1.4 == thag1.108/112/117:1.4` là *một chữ cho cả 4 bài*, và bản đã `published` ghi *đã làm tròn lời dạy của Đức Phật”ti.* — tôi dùng lại y nguyên văn cả hai vế: *Tôi đã chứng ngộ tam-minh, / đã làm tròn lời dạy của Đức Phật”ti.* `Tisso vijjā` → *tam-minh* (2 tiền lệ cho đúng cụm này; `thag1.117` dùng *ba thắng trí* cho `tisso abhiññā`, là cụm khác).

  **`anuvassiko pabbajito` tôi dịch *Đã thọ trì trọn mùa mưa rồi xuất gia*.** `anuvassika` = người đã qua trọn một mùa mưa (`vassa` → *mùa mưa*, 63 tiền lệ); `pabbajito` → *xuất gia* (rất nhiều tiền lệ).

  **Bất định còn lại, ghi ra đây:** `passa` ở `1.2` là mệnh lệnh ngôi hai (*hãy xem*), trong khi `1.3` lại là ngôi một (*Tôi đã chứng ngộ*). Pāli đúng như vậy và Sujato cũng đọc `passa` là mệnh lệnh (*See the excellence of the teaching!*) nhưng lại **đảo** `1.1` và `1.2` (Sujato `1.1` = *See…*, `1.2` = *Just one rainy season after I went forth*) — tôi theo Pāli. `dhammasudhammataṁ` tôi dịch *sự thuần thục của pháp*; chữ này không có tiền lệ, tôi chọn vì nó giữ được nghĩa *đã thành tựu, viên mãn* của `sudhamma` và nối với chủ đề *tu hành* của `anuvassiko pabbajito`. `sūro`/`balavā`/`vissuto` không có ở đây.

  **Công thức đặt kinh theo đa số, không theo nhóm lệch.** `0.3` = phẩm, `0.4` = *Kinh Kệ Của Trưởng Lão <tên>*. Đo được: 40+ tệp thag/thig đã có dùng đúng thứ tự này (`thag1.23`, `34`, `37`, `42`, `46`, `66`, `92`, `93`, `96`–`99`, `101`–`119`), còn 13 tệp cũ (`thag1.1`–`thag1.14`, `thag2.1`, `thag2.2`, `thag2.35`, `thag6.2`) **đảo** `0.3`/`0.4` cho nhau. Tôi theo đa số, và không sửa nhóm lệch vì ngoài lát. `Ekakanipāta` → *Bộ Một Bài Kinh*; `Theragāthā 1.N` giữ **số** như `thag1.42:0.1`.

  **Dấu lược ở dòng kết `:1.5`.** Pāli khoá này là `… <tên> thero ….` — hai dấu lược — và tôi giữ đúng hai, không mở rộng. Sujato **để trống** cả `:1.5` ở cả tám bài; tầng Việt có tiền lệ giữ nguyên dạng lược này (`thag1.23`, `thag1.107`, `thag1.113`), nên tôi không sinh câu *Bạch Thế Tôn, … đã từng nói bài kệ này* như một số bài khác trong tầng đã làm. Ô Anh trống ở đây không phải sự đồng thuận.

  **Tôi không chạy `npm run validate|test|check|build`** (đợt này cấm), nên `technical_integrity` chấm 9.6 chứ không phải 10.0. Hàm `kiểm()` của `_hvi.py` chỉ quét khoá Pāli ≥ 40 ký tự nên ở cả tám bài này `cần` RỖNG và assertion không tự chạy; tôi đã tự quét MỌI khoá (đúng segment ID, NFC, trùng nguyên văn, số dấu lược, Pāli lọt, cân ngoặc kép) và in từng cặp Pāli ↔ Việt để đọc đối kháng. Tầng Việt Thích Minh Châu không có ở commit đã ghim (chỉ có Pháp Cú), nên đối chiếu là Pāli + Sujato.
