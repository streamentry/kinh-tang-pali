  - Người nói (Pāli không ghi tên; suy từ xưng hô và nháy kép, không thêm vào thân kinh):
    + `1`, `3`, `8`, `10`, `14`, `15`, `20`, `23`, `25`–`26`: Sutasoma (`1.3` tóc bạc, `3.3`/`10.3` mong cầu cõi trời, `15.1` gọi Candā, `20.4` "saggaṁ mama patthayānassa", `26.2` gọi Somadatta); `2`: một người nói với vua ("deva") về bảy trăm người vợ; `4`–`5`: mẹ của Sutasoma (`4.2` "mātā"); `6`–`7`: cha mẹ hoặc người thân lớn tuổi ("amhe jiṇṇe", `6.3`); `9`: các người nữ trong cung (`9.3` `vikandantiyo` giống cái số nhiều); `11`–`13`: vợ của Sutasoma đang mang thai (`11.2` "bhariyā", `13.4` "vidhavā"), chính là Candā của `15.1`; `16`: con trai của Candā và Sutasoma (`16.1` "amma", `17.3` "pitā te"); `17`: Candā đáp con; `18`, `19`, `21`: người nói không xác định; `22`, `24`: người can ngăn xưng "deva" (có thể là Somadatta, không phân xử được); `27`: người đáp lại `26`, được gọi Sutasoma ở `27.2`; `28`–`31`: một người nói khác, xưng "chúng ta" ở `28.4` rồi nói về mạng sống ngắn ngủi; `32`: người dân; `33`–`49`: người đáp `32`; `50`–`51`: Sutasoma từ biệt dân chúng. Dấu nháy kép khớp Pāli từng khoá (52 khoá có nháy, 0 lệch).
  - Pāli trùng nguyên văn:
    Dò Pāli của 215 khoá với toàn bộ Pāli đã ghim (mọi bộ) có bản Việt: 9 khoá có dạng trùng ở bài khác: `0.1`, `0.2`, `0.3`, `15.2` (`ja485:10.2`), `29.1`/`30.1` (`ja485:1.1`), `31.1` (`iti93:5.1`), `54.1`, `27.3` (`thig13.4:15.3`, `:17.5`). Dùng lại nguyên văn ở 8 khoá (`27.3` trùng `thig13.4:15.3`, khác `thig13.4:17.5` "con" vì người nói là người con). Cặp trùng tổng cộng 547 (533 là `54.1`), trong đó bản Việt khác ở 2 khoá: `54.1` (117/533 dạng khác, như "Kệ tóm lược của phẩm ấy:" ở MN; ở ja luôn là "Tóm lược:") và `27.3`.
    Trong chính bài: 30 nhóm Pāli trùng nguyên văn (sau khi bỏ dấu câu); bản Việt khác ở 2 nhóm, đều cố ý: `14.4`/`23.4` (`taṁ hitvā`: ở `14.4` chỉ đứa con trai sắp sinh, nên "bỏ lại đứa ấy"; ở `23.4` chỉ kho báu, kho lẫm và đất đai ở `23.1`–`23.3`, nên "bỏ những thứ ấy"), `15.4`/`17.4` (`17.4` là lời Sutasoma được Candā kể lại sau `pitā te maṁ tāta avaca` nên thêm "rằng"). Trong 33–48, bản Việt giống nhau ở mọi khoá có Pāli trùng.
  - Số Pāli:
    `cattālīsa` (`0.2`) = 40 ("Bộ Bốn Mươi", khớp `ja521`–`ja523`, `thag18.1`); `sattasatā` (`2.3`) = satta 7 × sata 100 = 700 ("bảy trăm", khớp `vv56:1.3`, `vv59:1.3`, `vv70:1.3`, `ja519:28.1` dùng đúng cụm `sattasatā`); `pañcamaṁ` (`52.1`) = thứ năm, khớp số `5.` ở `0.4`; `ekā` (`13.3`) và `ekako` (`49.4`) là "một mình", không phải số đếm. Không có cụm số nào thuộc loại chưa phân xử được.
  - Thuật ngữ (có đếm trên tầng):
    + `dhāti` → "vú nuôi" (8/13); `itthāgāra` → "hậu cung" (9 so với "cung nữ" 3 và "nội cung" 2, trong 14 khoá); `ñātisaṅgha` → "đoàn thân quyến" (`thi-ap10:9.2`, `thig13.4:3.2`; "bà con cùng tộc" ở `ja518:14.4`, `ja11:1.4` là cho `purakkhata`, không phải `parikiṇṇo`); `kūṭāgāra` → "lầu gác" (6/12 khoá ở kệ; "phòng mái nhọn" 52/118 toàn tầng, chủ yếu DN/MN/SN); `ambavana` → "rừng xoài" (15 so với "vườn xoài" 6 ở kệ; toàn tầng 29 so với 61), giữ "rừng" cho `kaṇikāravana`, `pāṭalivana` cho đồng bộ; `uyyāna` → "khu vườn"; `pokkharaṇī` → "hồ sen"; `kaṇikāra` giữ phiên âm ("kaṇikāra thơm hương cõi trời", `tha-ap558:6.2`); `pāṭali` giữ phiên âm ("hoa pāṭali", `tha-ap257:1.3`); `asoka` giữ phiên âm ("cây asoka", `tha-ap198:3.3`).
    + `tiracchānayoni` → "súc sinh" (54 so với "bàng sinh" 12 toàn tầng; ở kệ gần nhất `tha-ap412:42.1` "súc sinh", còn `iti93:5.2` cùng cụm kệ này dịch "bàng sinh"; hai phạm vi chia đôi, chọn đa số toàn tầng); `pettivisaya` → "cõi ngạ quỷ" (83/123); `asurakāya` → "hàng a-tu-la" (`dn33:3.2.54`); `taṇhā` → "tham ái" (17 so với "khát ái" 6 trong ja/thag/thig/snp); `kāsāya` → "cà-sa" (103 so với "ca-sa" 4 toàn tầng; `ja509:2.3` dùng "ca-sa" nhưng ở ja chỉ 1/4); `saggaṁ` → "cõi trời" (21/23); `mettacitta` → "tâm từ" (74/82); `deva` (xưng hô vua) → "tâu vua" (20/30 ở ja); `dhammarāja` → "vua Chánh pháp" (`snp3.7:19.3`); `dulladdhaṁ` → "bất hạnh" (`dn16:4.42`, `mn28`, `sn8.1`); `ukkaṇṭhita` → "chán nản" (7 so với "chán ngán" 3); `arati` → "bất mãn" (`snp3.2:12.2`; `cp31:2.4` dịch "chán nản"); `antarāya` → "chướng ngại" (65 so với "trở ngại" 64); `anapekkha` → "không luyến tiếc" (`dn25:13.16`, `sn3.10:5.4`); `avajjha` → "không đáng bị giết" (`ja516:8.2`); `vijitāvī` → "người đã chiến thắng"; `abhumme` → "Khổ thân tôi!" (`mn66:6.23`, 1/1); `upanīyati` → "đang bị đưa đi" (`ja485:1.1`; `ja498:17.1` "đang bị đưa dần"); `vanatimiramattakkhi` → "đôi mắt như rừng tối" (`ja485:10.2`, 1/1); `sabbakālika` → "mọi thời" (`vv39:2.4`); `vināsa` → "mất mát" (đa số tầng dùng "hoại mất/đoạn diệt" cho ngữ cảnh DN/MN về đoạn kiến; ở đây là lời nói về người thân nên chọn "mất mát"); xưng hô: Sutasoma xưng "ta"; các người nói khác xưng "tôi" / gọi "ngài", theo cách `ja523`.
  - Chỗ bất định (không thêm vào thân kinh):
    + `1.2` `parissaje` → "những người trong hội chúng": đọc là dạng của `parisajja` (thành viên hội chúng); cũng có thể là "những người thân cận". `1.1` `nigama` → "thị dân": nghĩa gốc là thị trấn, dùng cho dân trong thị trấn. `1.4` `rocahaṁ` đọc là `roceti` + `ahaṁ`.
    + `2.1` `abhumme`: hapax ngoài `mn66:6.23` và `ja547:62.3` (chưa có bản Việt); đọc là tiếng thốt than. `2.2` `kappesi` → "cắm" (nghĩa gốc "sắp đặt, cắt"; "cắt/cứa mũi tên vào ngực" không loại trừ được).
    + `3.1` `Paññāyihinti etā`: đọc là `paññāyissanti` ("sẽ hiện rõ, được nhận biết"); nghĩa của câu (họ sẽ "tự xoay xở" hay "sẽ được người khác biết đến") không phân xử được. `3.3` `Saggañcassa`: `assa` không có chỗ rõ ràng, không dịch riêng (có thể là sở hữu cách "của người này"); `10.3`/`25.3` không có `assa`.
    + `5.2` `vijāyissaṁ`: dạng giống tương lai, đọc như quá khứ ("đã sinh ra"). `6.1` `dhammo` → "đạo lý" (có thể là "pháp"); `8.4` `vināsabhāvo` → "sự mất mát": "chia lìa" cũng được, không chắc.
    + `12.3` `kucchipaṭisandhiṁ` → "thai đã kết nơi bụng tôi". `13.2` `yāva naṁ vijāyāmi`: câu lược, ngầm là lời xin chờ cho đến khi sinh; không thêm chữ "xin chờ" vào thân kinh. `13.3` `Māhaṁ ... addakkhiṁ` → "mong sao tôi ... chẳng phải thấy": `mā` với aorist.
    + `16.3` `Kaṁ avajjhaṁ ghātemi` → "dù người ấy vốn không đáng bị giết": đọc `avajjha` như `ja516:8.2`; cách đọc "ai trong số những người không đáng bị giết" có thể. `17.1`–`17.2` `vijitāvī yo maṁ tāta kopesi`: kẻ làm Candā giận là chính Sutasoma, nhưng Pāli không nói thẳng.
    + `18`–`21`: không xác định được người nói. `19.2` `jeṭṭhassa bhātuno` → "người anh cả": không nói rõ của ai. `21.1` `pabhaṅkaraṁ`: tôi đọc là tên riêng (khớp với `kumāra` ở `20.2`; `tha-ap338` có tên Pabhaṅkara); cũng có thể là tính từ "làm ra ánh sáng". `21.1` `dadeyyaṁ`: không nói đem cho ai.
    + `25.2` `Kulavaddhana` → "người làm hưng thịnh gia tộc": có thể là cách gọi Somadatta (xem `26.2`), không phân xử được. `22`, `24`: người nói xưng "deva"; không chắc là Somadatta.
    + `28.1` `Na hi sakkā pabbajituṁ` → "Thật không thể xuất gia": không rõ chủ thể (ai không thể xuất gia) và ý (không thể cho phép xuất gia, hay không thể xuất gia mà không làm khổ dân); dịch sát chữ. `28.2` `na hi paccati` → "chẳng có gì được nấu chín": đọc `paccati` là bị động, nấu nướng; có thể hiểu là dân cư bỏ bếp vì sầu.
    + `29.2`/`30.2` `caṅkavāramhi`: hapax toàn Pāli đã ghim; dạng vị trí cách của một danh từ chỉ vật chứa (nước ở trong nó) nên dịch "cái caṅkavāra" giữ phiên âm; nghĩa chính xác không xác lập được.
    + `31.3` `bandhanabaddhā` → "bị trói bằng dây trói". `32.1` `Ūhaññate rajaggaṁ` → "Bụi đang cuộn lên" (`rajagga` như `an5.75`; `ūhaññate` bị động, xem `mn19:8.9` "bị xao động"). `32.2` `pubbakamhi pāsāde` → "cung điện cũ": cũng có thể là "cung điện trước kia của vua", đã bao hàm. `32.3`, `49.1` `no`/`vo`: đọc là đại từ ("của chúng ta", "của các vị") vì `32` và `33`–`49` là hai người nói khác nhau; nếu là tiểu từ đệm thì không có nghĩa riêng.
    + `33`–`48` `itthāgārehi` (số nhiều, công cụ cách) → "hậu cung" chỉ những người trong hậu cung, theo `sn2.23`. `37.1` `asokavanikā` → "khu vườn asoka" (`vanikā` là rừng nhỏ). `47.2` `aṇḍajehi` → "các loài sinh từ trứng": đọc là chim nước, giữ nghĩa đen, không thêm chữ "chim".
    + `50.3` `Mā vo kāmā haniṁsu` → "mong các dục lạc đừng giết hại các vị": `haniṁsu` là aorist. `50.4` `sudassanaṁ nagaraṁ` → "thành Sudassana" (có tiền lệ tên thành `bv13:3.3`); cách đọc "thành đẹp mắt" (cả `rammaṁ` và `sudassanaṁ` là tính từ) không loại trừ được. `51.3` `Agacchittha`: dạng aorist, đọc như tương lai ("sẽ đi đến"); cũng có thể là lời cầu chúc.
    + `55.1` `kuṇḍalino` giữ phiên âm (không rõ là tên hay dạng số nhiều); `55.3` `sirīvhayako` giữ phiên âm ("người mang tên Sirī" là cách đọc khả dĩ); `55.4` `arindhamarājavaro` → "Arindhama, bậc tối thắng trong các vua", theo dạng `paṇḍaranāgavaro` ở `ja520:42.3`.
