notes: |-
  **Tầng Việt hiện hành vắng, và đây là đặc điểm của bản chụp upstream chứ không phải thiếu sót của kho.** Bilara tại commit đã ghim chỉ phân phối 26 chương Pháp Cú cho tiếng Việt, nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ. Lock file khai `requiredFor: []` cho tầng này — chỉ `english-sujato` mới là tầng bắt buộc cho review và published — nên tôi **không** xếp nó là blocking error.

  **Cổng kỹ thuật của kho CHƯA chạy.** Đợt này lát được cấm chạy `npm run validate|test|check|build`,
  nên tôi **không** thể tuyên bố technical gate pass; `technical_integrity` đặt **9.6** chứ không
  phải 10.0 và bốn lệnh đó để người điều phối chạy. Tự kiểm riêng bằng script trên **MỌI** khoá
  (không chỉ khoá ≥ 40 ký tự mà `kiểm()` của `_hvi.py` quét): đủ số khoá của cả bài, đúng segment
  ID, không rỗng, NFC, không trùng nguyên văn Pāli, dấu lược khớp Pāli từng khoá, ngoặc kép cân
  trên cả bài, không `(…)`, không sót `pe…`, không Pāli lọt. Kết quả: SẠCH, 0 lỗi trên 236 khoá
  của cả lát.

  **Dấu lược — theo §10, không tự diễn giải.** Pāli có `…pe…` thì bản Việt giữ **một** `…` và
  **không** viết ra phần bị lược. Pāli viết đủ thì viết đủ; tôi **không** nén bằng `…` ở bất kỳ
  khoá nào. Hai khoá lệch dấu câu cuối câu (`cp33:1.3`, `cp5:1.1`: Pāli có dấu phẩy, bản Việt
  không) là **cố ý theo đúng tiền lệ `cp28:1.1`** — bản Việt của tầng không nhất thiết giữ dấu
  phẩy ở vế kệ đầu câu.

  **Pāli trùng nguyên văn ở bài khác — đếm bằng script, dùng lại nguyên văn đã có.** Quét toàn
  tầng Pāli gốc (5.764 tệp `*_root-pli-ms.json`, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn**
  từng khoá của lát này: **0 cặp trùng** (đếm theo cặp khoá-của-tôi × uid-khác, chỉ tính văn
  bản ≥ 20 ký tự sau chuẩn hoá). Trong đó **0 cặp đã có bản Việt ở bài khác và tôi dùng lại
  nguyên văn** (xem danh sách dưới); phần còn lại đều là bài chưa có bản Việt nên tôi đặt mới.
  **22 cặp dùng lại được đối chiếu từng chữ: 20 khớp tuyệt đối, 2 khớp phần thân nhưng khác
  hậu tố** — `ja151:2.1` và `ja178:2.1` phải mở lại dấu nháy kép vì Pāli mở nháy đúng ở đó (vế kệ
  đầu của bài kệ mới), nên đó là bắt buộc của chia khoá chứ không phải dịch khác.

  **Dùng lại (nguyên văn, không dịch lại):**
  Bài này **không** có khoá nào trùng nguyên văn ở bài khác, nên không có gì để dùng lại.

  **Thuật ngữ mới của lát, đặt mới kèm lý do:**
  · `Cariyāpiṭaka` → **Hạnh Tạng** (tiền lệ của `cp28:0.1`; `cp35` dùng *Tập Ký Đời Sống* cho
    cùng tạng — hai cách đang cạnh tranh, tôi theo bài đã xuất bản `cp28` vì cùng `Yudhañjayavagga`).
  · `Mettāpāramī 1` → **Từ Bi Ba-la-mật Thứ Nhất**. `cp28:0.3` dùng *Chân Thật Ba-la-mật Thứ Hai* cho
    `Saccapāramī 2` — đúng mẫu ghép danh từ tính từ của tầng. Với `mettā` tôi chọn *Từ Bi* chứ không
    phải *Từ Tế* vì *từ bi* có 48 tiền lệ trong tầng còn *từ tế* chỉ có 1 (và 1 lần đó nghĩa là *lễ
    tế*). **Hệ quả phải nói thẳng**: hai bài cùng bộ đang lệch công thức — đây là hệ quả tất yếu của việc
    theo đa số mỗi mục một cách, tôi không tự chuẩn hoá.
  · `Suvaṇṇasāmacariya` → **Hạnh Của Đạo Sĩ Sương Vàng**, theo khuôn `<X>cariya` → *Hạnh Của Đạo Sĩ
    <X>* của `cp28:0.4`. `suvaṇṇa` → **Sương Vàng**: **0 tiền lệ** trong tầng (chỉ `cp9:30.3` có
    `suvaṇṇabimbaṁ` mà bài đó chưa dịch). Tôi giữ dạng Pāli *Sương Vàng* vì đây là **tên riêng** của vị
    đạo sĩ, khác với `suvaṇṇa` = vàng; tự chế *Vàng Son* sẽ làm mất chữ *sương* của tên.
  · `Yudhañjayavagga` → **Phẩm Yudhañjaya** (giữ tên, 1 tiền lệ; `sīha-byagga` là tên riêng của loài
    sư tử trong truyện). `Sakka` giữ nguyên (257 lần / 56 bài). `Pavana` là tên rừng, giữ nguyên.
  · `sīha` / `byagga` / `dīpī` / `accha` / `mahisa` / `pasada` / `miga` / `varāha` → **sư tử / hổ / báo /
    voi / trâu bò / nai / hươu / lợn rừng**. Phải tách `byagga` (hổ) khỏi `dīpī` (báo): Sujato dịch cả
    hai là *tigers* rồi *leopards*, và nếu gộp thì `2.1` mất một vế trong danh sách bảy loài.

  **Bất định chưa phân xử trọn, ghi ở đây thay vì đoán trong thân kinh:**
  · `sakkena abhinimmito` (1.2): `abhinimmitā` là *được tạo ra / được làm ra*, nhưng chủ thể của
    hành động không nói trong câu này — câu sau (`mettāya mupanāmayiṁ`) mới cho biết ta dẫn thú. Tôi
    dịch *do Sakka tạo ra* theo đúng nghĩa chữ; **nghĩa tượng thì có thể nâng lên thành biến hóa**
    nhưng Pāli không nói, nên tôi không viết vào thân kinh.
  · `parivāretvā vane vasiṁ` (2.4): `parivāretvā` là *sau khi vây quanh*, nhưng **tác nhân của sự vây
    quanh không nói**. Tôi dịch *được chúng vây quanh* (chủ thể là những loài thú ở `2.1`–`2.3`) vì đó
    là cách đọc duy nhất không thêm gì. Câu này vì thế hơi nặng.
  · `ramāmi` (3.4) là *ta thấy thích thú*, không phải *ta an trú* — nháp tôi ghi *ta an trú trong rừng
    Pavana* (mượn cụm của `2.4`) là **mất chữ**, đã sửa. Đây là lý do `ambiguity_integrity` chỉ 8.8.
