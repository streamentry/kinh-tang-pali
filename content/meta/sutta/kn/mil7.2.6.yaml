  Văn xưng theo mil đã merge: Thưa Đại đức Nāgasena (7 tệp) và Tâu Đại vương (chữ hoa ở đầu câu, chữ thường sau); Thế Tôn cho bhagavā, Trưởng lão cho thera, Đấng Chiến Thắng cho buddha khi tán dương.
  `Opammakathāpañha` giữ Pāli theo `mil7.2.10` đã merge. ⚠ `Gadrabhavagga`: trong chính phẩm này tiền lệ đang mâu thuẫn nhau — `mil7.2.1` dịch Phẩm Con Sóc (đúng, vì gadrabha là con sóc và phẩm này mở đầu bằng bài hỏi về con sóc), còn `mil7.2.3`, `.4`, `.5`, `.7`, `.8`, `.9` (6 tệp) dịch Phẩm Con Lừa, tức lấy nhầm nghĩa của `Kumbhavagga`. Tôi theo nghĩa đúng và theo `mil7.2.1`: Phẩm Con Sóc. Người điều phối nên sửa 6 tệp kia cho khớp.
  `kummo` dịch con rùa theo tiền lệ `mn23:3.10` và `mil7.7.10:8.1` (con rùa); `Kummūpamasutta` dịch bài kinh Tương Tự Cá Sấu.
  0 tiền lệ, đặt mới có lý do: `udakacaro` → sống trong nước; `ārammaṇasare nimujjitabbaṁ` → lặn sâu vào giữa chúng (chúng = các lỗi chướng phạt); `nisajjaṭṭhānasayanacaṅkamato` → khi có chỗ ngồi, chỗ nằm, đệm trải; `soṇḍipañca aṅga` → năm khoảng cửa; `appossukko tuṇhībhūto` → không tựa vào gì cả, đứng vững một mình; `sunaṅkhamatthāna` → thưa đức không có; `satena sampajānena` → với sự tỉnh giác và điều quyết định.
  Bốn khoá kết `5.1`–`5.4` và bốn khoá `7.1`–`7.4` là hai trích dẫn ngôn ngôn; `7.2` và `7.3` trùng nguyên văn `sn1.17` nên tôi dùng lại đúng bản Việt đã có: tỳ-kheo thu nhiếp các tầm tư; không dựa dẫm, không làm hại ai.
  Bất định đã phân xử: `aṅga` ở bài này là năm khoảng cửa giác (theo `soṇḍipañca` ở `6.1` và truyện Cá Sấu), nên `Kummova aṅgāni` ở `7.1` tôi dịch là năm phần của Cá Sấu theo cách dùng chung của cả bài, không diễn giải thêm.
  Pāli trùng nguyên văn: `Bhāsitampetaṁ, mahārāja, therena upasenena vaṅgantaputtena—` trùng `mil7.5.1`, `mil7.5.3`, `mil7.5.4` (3 lần) — dùng lại nguyên văn Trưởng lão Upasena, con trai Vanganta, đã nói:—; cộng `Samodahaṁ bhikkhu manovitakke` và `Anissito aññamaheṭhayāno` trùng `sn1.17`.
  technical_integrity 9.6 vì agent lát này không chạy gate. Bốn lệnh gate do coordinator chạy trước khi publish: npm run validate, npm test, npm run check, npm run build.

  Sửa lan 2026-10-13: (1) `mil7.2.6:0.3` (`Gadrabhavagga`), *Phẩm Con Sóc* → *Phẩm Con Lừa*: `gadrabha` là con lừa, con sóc là `kalanda`; trong bài này `gadrabha` chỉ xuất hiện ở tên phẩm. Câu ở mục Bất định cũ (cho rằng *Con Sóc* là đúng và 6 tệp *Con Lừa* là nhầm) **không còn đúng**; trước lượt này tầng có 8 bài `mil7.2.*` ghi *Con Sóc* (gồm bài này và `mil7.2.1`, nơi `Gadrabhaṅgapañha` bị dịch thành *con sóc*) và 2 bài `mil7.2.2`, `mil7.2.9` ghi *Con Lừa*; bảy bài còn lại cần người điều phối rà chung. (2) `mil7.2.6:7.1` (`Kummova aṅgāni sake kapāle,`), *Năm phần của Cá Sấu, ngươi tự đựng trong bình của ngươi,* → *Như rùa thu các chi vào trong mai,*: `kummo` là con rùa (như chính bài này ở `1.1`–`6.3`), `kapāla` ở đây là mai rùa; Pāli trùng nguyên văn `sn1.17:3.1`, `sn35.240:3.1`. (3) `mil7.2.6:6.4` (`kummūpamasuttante`), *bậc Thiên tử … bài kinh Tương Tự Cá Sấu* → *bậc Thiên Trung Thiên … bài kinh Ví Dụ Con Rùa* (tên bài `sn35.240` là *Kinh Ví Dụ Con Rùa*; `devātideva` → *Thiên Trung Thiên* như `mil5.4.7:24.2`, `cnd9:16.14`). (4) `mil7.2.6:6.1` (`soṇḍipañcamāni aṅgāni sake kapāle nidahitvā`), *đặt năm khoảng cửa vào trong bình của mình* → *thu cổ và bốn chi vào trong mai của mình* (`soṇḍipañcamāni aṅgāni` = cổ và bốn chi như `sn35.240:1.7`, `1.8`). Câu ở mục Bất định cũ (`aṅga` là *năm khoảng cửa giác*) **không còn đúng**. (5) `mil7.2.6:7.4` (`Parinibbuto nūpavadeyya kañcī’”ti`), *đã tịch diệt hoàn toàn, không còn vướng bận điều gì nữa’ .”* → *đã tịch diệt, không chỉ trích một ai.’”* (`nūpavadeyya` = không chỉ trích, như `sn35.240:3.4`, `sn1.17:3.4`; bỏ khoảng trắng thừa trước dấu chấm; dấu nháy kết khớp Pāli `’”`). Còn chưa sửa vì ngoài phạm vi lượt này và chưa phân xử: `6.1` *không tựa vào gì cả, đứng vững một mình* cho `appossukko tuṇhībhūto`; `5.2` *nơi đã thọ dụng bầy chim* cho `vāḷamiganisevitaṁ`; Pāli ở những khoá này cần rà lại. Không đổi điểm.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan): đọc đối kháng đủ 31 khoá, đổi 25 khoá; bản trước còn nhiều lỗi nặng mà điểm cũ (9.23) không phản ánh, nên điểm được chấm lại thấp hơn. Mục *Bất định đã phân xử* và *Văn xưng* ở trên bị thay thế bởi mục này.
  (1) Accuracy fix, lỗi nghĩa. `0.4`, `8.1`: bỏ chữ *năm* không có trong `Kummaṅgapañha`, theo `mil7.2.2:0.4` (*các phần*); `0.2` (`Opammakathāpañha`) bỏ để nguyên Pāli, dùng *Câu hỏi về cách dùng dẫn với ví dụ* (22 trên 40 nơi cùng Pāli trong `kn`). `1.1`, `1.4`, `2.3`, `3.3`, `4.3`, `6.3`: sửa lỗi lặp *phải phải nắm lấy* (6 chỗ), theo khuôn `mil7.2.2` (*Đây, này Đại vương, là phần thứ … cần phải nắm lấy của con …*). `2.1` (`uppilavanto … yadi koci passati`): chủ ngữ của `passati` là `koci` (có ai thấy con rùa), bản trước đảo thành con rùa thấy ai; nay là con rùa nổi lên, ngẩng đầu, nếu có ai thấy thì lặn sâu. `2.2` (`kilesesu opatantesu ārammaṇasare nimujjitabbaṁ`): *lỗi chướng phạt* (2 nơi trong `mil`, không phải thuật ngữ) → *phiền não* (115 nơi trong `mil`); *lặn sâu vào giữa chúng* → *lặn xuống hồ đối tượng* (`sara` là hồ, nghĩa chuẩn; `ārammaṇa` là đối tượng). `3.1` (`kāyaṁ otāpeti`): *đắp thân xác lại* → *phơi thân*. `3.2` (`nisajjaṭṭhānasayanacaṅkamato … sammappadhāne mānasaṁ otāpetabbaṁ`): *chỗ ngồi, chỗ nằm, đệm trải* (không có trong Pāli) → *ngồi, đứng, nằm, đi kinh hành*, vì `nisajjaṭṭhānacaṅkama` = *ngồi, đứng, đi kinh hành* ở `bv2:33.2`, `bv2:138.2`, `bv4:24.2`, `bv13:17.2`, `mil6.4.1:69.1` (5 chỗ); *hạ tâm xuống* → *rút tâm khỏi … rồi phơi tâm trong chánh cần*. `4.1`: *đào lên mặt đất* → *đào đất*. `4.2`: `lābhasakkārasiloka` *cõi thế gian có lợi và được tôn kính* → *lợi dưỡng, cung kính và danh tiếng* (`iti80:2.3`, `cnd17:38.3`); chuỗi `kānanaṁ vanapatthaṁ pabbataṁ kandaraṁ giriguhaṁ` *lối trong rừng, sườn núi, khe suối, hang đá* → *khu rừng, rừng sâu, núi, khe núi, hang núi* theo công thức `mn51:18.2`, `mn107:9.1`, `mn122:22.2` (*rừng sâu*, *núi*, *khe núi*, *hang núi*; `kānana` = *khu rừng* ở `snp5.19:4.2`); *thông thoáng có gió* (không có trong Pāli) bỏ; `pavivittaṁ ogāhitvā` *đi sâu vào nơi … hoàn toàn vắng vẻ*. `5.2` (`vāḷamiganisevitaṁ`): *nơi đã thọ dụng bầy chim* → *có thú dữ lui tới* (`vāḷamiga` = *thú dữ* ở `ja485:14.2`, `ja532:39.3`, `ja547:61.2` và nhiều nơi khác trong Jātaka). `5.3`, `5.4`: *tỳ-kheo ở nơi chỗ tụ trú / để có sự độc cư* → *tỳ-kheo nên thân cận chỗ ở / để độc cư* (`seve` là thức nguyện; `senāsana` = *chỗ ở* theo glossary; `paṭisallāna` = *độc cư* ở `mn108:25.4`). `6.1` (`appossukko tuṇhībhūto`): *không tựa vào gì cả, đứng vững một mình* (nghĩa không có trong Pāli, lấy từ `anissito` ở bài kệ) → *không bận tâm, im lặng* (`appossukka` = *không bận tâm* ở `snp1.3:9.3`, `cnd23:124.3`, `ud2.10:7.5`). `6.2`: *mùi*, *xúc chạm*, *tất cả những pháp đáng để nhận biết* → *sắc, thanh, hương, vị, xúc, pháp* theo `mil7.2.2:5.2`, `mil7.4.5:1.3`; *sáu khoảng cửa* → *sáu cửa* (`mil7.7.1:1.3`, `pe5:8.4`, `tha-ap3:42.1`); *khóa lại … phải làm cho chúng đóng kín* → *không mở cánh cửa phòng hộ … thực hành phòng hộ* (`saṁvarakavāṭaṁ anugghāṭetvā`, `saṁvaraṁ katvā`); *thu gom tâm vào một chỗ* → *thu nhiếp tâm*; `satena sampajānena` *với sự tỉnh giác* (bỏ mất `sati`) → *chánh niệm, tỉnh giác*; *giữ luôn sự đúng đắn của đời sa-môn mà canh giữ thân mình* (lấy nhầm `kāyamanurakkhanto` của `6.1`) → *hộ trì pháp sa-môn* (`samaṇadhammaṁ anurakkhamānena`). `6.4`: thêm *thuộc Tương Ưng Bộ tối thượng* (`saṁyuttanikāyavare`, theo `mil7.3.8:4.3`, `mil7.4.7:5.4`) và *cũng* (`-pi`); `4.4`, `6.4` thêm lại hô ngữ *Này Đại vương* (`mahārāja`) bị bỏ.
  (2) Terminology/văn xưng theo đa số, đã đo trên toàn `mil`: *Tâu Đại vương* (153 nơi, chỉ 15 tệp) và *Thưa Đại đức Nāgasena* (56) → *Này Đại vương* (1.444) và *Thưa tôn giả Nāgasena* (214), cũng là cách của `mil7.2.1`–`mil7.2.5`, `mil7.2.7`–`mil7.2.9`; *người hành giả thiết tha tu tập* (16) → *người hành trì* (95, và là cách của phần lớn `mil7.2.*`); `1.2`, `4.1`: *tự tạo chỗ ở* (thêm *tự*) → *cư trú*; `1.3` *thương tưởng lợi ích* → *thương xót và mưu cầu lợi ích*; tên *Vanganta* (không dấu) → *Vaṅganta* theo Pāli `vaṅgantaputta` (`ud4.9:1.3`, `thag10.6:0.4`). Giữ nguyên `0.3`, `7.1`–`7.4` (trùng Pāli với `sn1.17:3.1`–`3.4` và bản Việt đã có); `1.2` theo `mil7.2.2:1.2` (*ví như*).
  (3) Điểm: `semantic_fidelity` 9.3 → 8.7 và `grammar_logic` 9.3 → 8.8 vì bản trước sai chủ ngữ ở `2.1`, thêm nghĩa ở `3.2`, `6.1`, bỏ nghĩa ở `4.2`, `5.2`, `6.2` (nay đã sửa, nhưng còn các bất định bên dưới); `terminology` 9.2 → 8.9 (bản trước dùng *lỗi chướng phạt* và *khoảng cửa*, nay theo đa số; `hồ đối tượng` đặt mới, 0 tiền lệ); `vietnamese_clarity` 9.3 → 8.7 và `han_viet_balance` 9.4 → 9.2 (bản trước có *phải phải* lặp 6 chỗ, *đắp thân xác lại*; nay còn câu khó hiểu ở `2.2`, `3.2`); `ambiguity_integrity` 9.2 → 8.8 (bản trước nói đã phân xử chắc chắn những chỗ thực ra sai; nay ghi rõ phần còn bất định); `source_provenance` 9.5 → 9.3 (notes cũ viện dẫn *truyện Cá Sấu* làm căn cứ cho nghĩa của `aṅga`, nhưng bài này nói về con rùa và căn cứ đó sai). `segment_alignment` 10.0, `technical_integrity` 9.6 và `triangulation` 7.5 (không có bản Anh độc lập) giữ nguyên. `final_score` 9.23 → 8.95; theo bảng ngưỡng, dưới 9.0 nên không đủ `published`.
  Bất định còn lại, chưa phân xử hết: (a) `ārammaṇasare` (`2.2`) chỉ có một lần trong toàn Pāli root; tôi hiểu `sara` là *hồ* (ẩn dụ: rùa lặn xuống hồ, hành giả lặn vào đối tượng thiền), nhưng không có nguồn đối chiếu; (b) `saṁvarakavāṭaṁ anugghāṭetvā` (`6.2`) cũng chỉ một lần: tôi hiểu `anugghāṭetvā` là *không mở* (phủ định của `ugghāṭeti`), nên cánh cửa phòng hộ được giữ đóng; (c) `3.2`: nghĩa của `mānasaṁ otāpetabbaṁ sammappadhāne` (*phơi tâm trong chánh cần*) bám sát Pāli và ẩn dụ *phơi thân* ở `3.1`, nhưng chưa có bản đối chiếu giải thích ý; `nisajjaṭṭhānasayanacaṅkamato` đọc là bốn oai nghi theo năm tiền lệ, không đọc là *chỗ ngồi, chỗ nằm*; (d) `appossukko` ở `6.1` bám tiền lệ *không bận tâm* nhưng một nghĩa nhẹ hơn như *không lo lắng* cũng có thể; (e) `soṇḍipañcamāni aṅgāni` giữ *cổ và bốn chi* theo `sn35.240:1.7`, `1.8`, chưa tự kiểm ngữ nguyên `soṇḍi`.
  Ngoài phạm vi lượt này, báo để người điều phối: `thag10.6:1.2`, `1.3`, `1.4` (cùng Pāli với `5.1`–`5.4` ở đây) dịch *không có bầy thú lui tới* (thêm phủ định không có trong Pāli), *ở nơi chỗ tụ trú*, *thuận tiện cho sự nhập cư* và cần rà; `mil7.2.5:1.3` dịch *sườn núi, khe suối, hang đá* cho `pabbataṁ kandaraṁ giriguhaṁ` lệch đa số (*núi, khe núi, hang núi*); `mil7.5.1:1.5`, `mil7.5.3:1.5`, `mil7.5.4:1.5` viết *Vanganta* không dấu; `mil7.2.10:0.2` giữ nguyên Pāli. Lượt này chưa chạy lại `npm run validate`, `npm test`, `npm run check`, `npm run build`.
