notes: |-
  Đã đọc HẾT Pāli lát (w6.pali.txt, 447 dòng, 196 khoá / 14 bài) trước khi viết chữ nào.

  TẦNG THAM KHẢO — đo, không đoán. 0/14 bài có bản Anh Sujato tại commit đã ghim: tôi đếm ở
  `source/upstream-manifest.json` (edition `translation/en/sujato` có 4291 tệp; trong `kn/` chỉ
  755 tệp thuộc cp, dhp, iti, ja, kp, snp, thag, thig, ud; KHÔNG có tệp mil* nào ngoài
  `name/sutta/mil-name`), rồi đếm lại trong `.cache/upstream/suttacentral/translation/en/sujato/`
  và bằng `find . -name 'mil*'`: kết quả vẫn 1 tệp tên. Đây là `not-published-upstream`, KHÔNG
  phải `not-synced`. Tầng `vietnamese-current` cũng vắng: `translation/vi/phantuananh` tại commit
  đã ghim có 26 tệp và toàn bộ là Pháp Cú, nên Trường Bộ không có bản Thích Minh Châu để đối
  chiếu. Lớp lấp English của dự án (`content/translation/en/project/sutta/kn/`) có 24 tệp mil*
  nhưng không có uid nào của lát w6. Ba tầng tham khảo đều vắng ⇒ blocker thật ⇒ status `draft`.

  BẰNG CHỨNG NGOÀI TẦNG ĐÃ GHIM — ghi rõ để không ai tưởng là tầng store. Để phân xử mấy từ khó
  khó, tôi tra (1) Từ điển Pāli–Anh của PTS (Childs 2001) qua DDSA, và (2) bản dịch
  T.W. Rhys Davids 1890/1894 mà SuttaCentral dựng lại từ Internet Sacred Text Archive — bản
  công cộng, KHÔNG nằm trong `source/suttacentral.lock.json`, chỉ dùng làm bằng chứng về cách
  parse cú pháp Pāli (mục 5 của thứ bậc nguồn trong `skill/translation.md`), không phải authority.
  Cả hai đều được nêu tên ở từng chỗ dùng. Bản Việt hiện hành trên SuttaCentral (Bhikkhu
  Indacanda, 2011) tôi cố tình KHÔNG đọc, để bản dịch là của mình chứ không phải bản Việt lại.

  PĀLI TRÙNG NGUYÊN VĂN — tự tra bằng script, không tin bảng tiền lệ. Tôi dựng chỉ mục
  Pāli↔Việt của toàn tầng (155.801 khoá Pāli `kn`, 17.756 khoá Việt `kn`, khớp theo
  chuẩn hoá khoảng trắng) rồi so 196 khoá của lát: tìm được **33 cặp** Pāli trùng nguyên văn
  với bài khác, trong đó **29 cặp là khoá khối tiêu đề** (`:0.1`–`:0.4`: `Milindapañha`,
  `Opammakathāpañha`, tên phẩm) và chỉ **4 cặp là nội dung**. Cả 4 cặp nội dung đều dùng lại
  y hệt, không dịch lần hai:
  · `mil3.7.9:1.1` `Rājā āha—` và `mil3.7.9:3.1` `“Kallosi, bhante nāgasenā”ti.` — cùng nguyên
    văn với 22 và 25 khoá đã có; dùng lại đúng nguyên văn của tầng.
  · `mil7.2.4:2.2/2.3` `Nāgo pūtilataṁva dālayitvā;` / `Nāhaṁ punupessaṁ gabbhaseyyaṁ,` —
    trùng `snp1.2:12.3`/`12.4` đã `published`; dùng lại y hệt. Cả bốn vế kệ `2.1`–`2.4` lấy từ
    `snp1.2:12.1`–`12.5`.
  Ngoài ra có các khoá trùng NỘI TRONG lát, và tôi dùng lại y hệt: `Bhāsitampetaṁ …
  therena sāriputtena dhammasenāpatinā—` (mil7.3.9:1.5 == mil7.5.5:1.5),
  `Bhāsitampetaṁ … therena upasenena vaṅgantaputtena—` (mil7.5.1:1.5 == mil7.5.3:1.5 ==
  mil7.5.4:1.5), `viharanto vipassako;` (mil7.5.3:2.2 == mil7.5.4:2.2). Bảng `TIEN_LE_PHAI.md`
  không có mục nào rơi vào lát w6 (mụn gần nhất là `mil3.5.6:2.1 == mil3.6.6:2.1`).

  BỐN XUNG ĐỘT THUẬT NGỮ ĐANG TREO mà người điều phối nêu — lát w6 KHÔNG chạm tới cái nào:
  không có `Dukanipāta`, `Kulāvakavagga`, `Atthakāmavagga`, cũng không có câu
  `Channā me kuṭikā sukhā nivātā;`. Vì vậy tôi không tự chuẩn hoá gì và không sửa bài ngoài lát.
  Tương tự, hai phép đa nghĩa đã đo (`aṇḍajā nāgā` và `rañño nāgo rājabhoggo`) không xuất hiện.

  DẤU LƯỢC — theo §10 của BRIEF_VI3. Cả 14 bài không có `…pe…` nào và không khoá nào tôi nén
  bằng `…`, nên hai phía đều 0 và không có chuyện mở rộng. Tôi đã kiểm lại từng khoá, không
  có `(…)` đứng một mình.

  KIỂM THỦ CÔNG MỌI KHOÁ (không chạy npm — đợt này cấm `npm run validate|test|check|build`).
  `kiểm()` của `_hvi.py` chỉ quét khoá Pāli từ 40 ký tự trở lên; lát này có khoá dài tới 286 ký tự
  nên `cần` KHÔNG rỗng, nhưng tôi vẫn tự quét TOÀN BỘ 196 khoá: đủ khoá, đúng ID, thứ tự khoá
  y hệt Pāli, không rỗng, NFC, không khoá thừa, số dấu lược khớp từng khoá, nháy kép cân trên cả
  bài, không có `(…))`, không Pāli lọt. Kết quả 0 lỗi; 14 khoá `:0.1` trùng Pāli là tên tác phẩm,
  đúng như 45 bài mil/thig đã có trong tầng. `save_vi` gọi hai lần cho cả lát: sha256 không
  đổi một byte. **Vì technical gate tập trung chưa chạy, `technical_integrity` chấm 9.6 chứ
  không phải 10.0, và tôi KHÔNG tuyên bố technical gate pass.**
  Thuật ngữ có tiền lệ: `Opammakathāpañha`, `yoginā yogāvacarena`, `mahārāja` như mil7.2.3;
  `therena rāhulena` → Trưởng lão Rāhula (đúng nguyên văn 2 khoá `Trưởng lão Rā…` đã có trong
  tầng); `buddhena bhagavatā` → bậc Thế Tôn; `satthusāsana` → lời dạy của bậc Thầy;
  `vaṁsa` → cây trúc (đúng nguyên văn `cây trúc` ở thag1.72:1.1).

  0 tiền lệ, đặt mới: `anulometi` (PTS: `to conform to, to be in accordance with`) → ngả theo;
  `anulomayitvā` → đi theo; `navaṅgaṁ satthusāsanaṁ` → **chín phần chánh pháp của bậc Thầy**.
  Tôi cố tình KHÔNG dịch `navaṅga` thành `tứ phần`: `tứ phần chánh pháp` là `cattāri aṅgaṁ
  saddhamma` (Aṅguttara), khác hẳn với chín phần ở đây, và gộp hai sẽ làm sai. `samaṇadhamma`
  → đời sống sa-môn. `ṭhatvāpāyaṁ` không có mục từ điển nào trong PTS.

  BẤT ĐỊNH ĐÃ GHI. `ṭhatvāpāyaṁ samuttarin` (2.4) là vế khó nhất của lát này: `ṭhatvā` là
  `đã đứng vững`, nhưng `apāya` không có mục riêng trong PTS và tôi chỉ suy được là `tiến tới /
  đến gần`. Tôi dịch `đứng vững rồi tiến tới mà vượt qua`, giữ đủ ba động từ và không gộp. Cách
  đọc khác là đọc `ṭhatvāpāya` thành một vế `đứng yên ở đó`. Rhys Davids dịch cả vế thành
  `I have passed beyond rebirth in evil states`, tức bỏ hẳn `ṭhatvāpāya`; tôi không theo vì bỏ
  hai từ là mất ý. `anulometvāna` (2.2) tôi đọc là `anulometvā` + trợ từ `na`, dịch `nắm theo
  khắp mọi nơi`.

  **terminology fix (2026-10-04, coordinator).** `Gadrabhavagga` bị dịch "Phẩm Con Lừa" ở khối `:0.3` — lẫn với `Kumbhavagga` (con lừa). `gadra` là **con sóc**, và hai tệp cùng phẩm (mil7.2.1, mil7.2.6) đã dùng đúng "Phẩm Con Sóc". Đếm toàn tầng trước khi sửa: 6 tệp lừa / 2 tệp sóc / 1 tệp giữ PĦLI. Đã đồng nhất sang sóc.

  Sửa lan 2026-10-13: khoá mil7.2.7:0.3 (Pāli Gadrabhavagga), "Phẩm Con Sóc" → "Phẩm Con Lừa"; căn cứ: gadrabha là con lừa (kalanda mới là sóc), và vế kết phẩm mil7.1:13.1 (Gadrabhavaggo paṭhamo) cùng mil7.2.9:0.3 đã dịch "Phẩm Con Lừa". Mục "terminology fix (2026-10-04, coordinator)" ở trên, khẳng định gadra là con sóc và Kumbhavagga là con lừa, được thay thế bởi mục này: Kumbhavagga (mil7.1:76.1) là Phẩm Bình Vò.

  Lượt cải thiện 2026-10-13 (kiểm toán lại sau sửa lan). Đọc đối kháng đủ 14 khoá; đổi 7 khoá (1.2, 1.3, 1.4, 1.5, 2.2, 2.3, 2.4), giữ nguyên ID và tập khoá.
  · 2.2 `anulometvāna sabbadā`: "nắm theo khắp mọi nơi" → "luôn luôn noi theo". LỖI NGHĨA: `sabbadā` là "mọi lúc/luôn luôn" (thời gian), không phải "khắp mọi nơi" (chỗ); các nơi đã xem trong tầng kn đều dịch theo thời gian (chú giải mnd: "luôn luôn, mọi lúc"; thi-ap11 "mọi lúc"; thi-ap34 "luôn luôn"). `anulometvā` → "noi theo", đúng tiền lệ mil7.7.10:1.2–1.3 (`anulometvā`, `anulomayitvā`).
  · 2.4 `ṭhatvāpāyaṁ samuttarin’`: bản cũ "đứng vững rồi tiến tới mà vượt qua" bịa nghĩa "tiến tới" cho `apāya` và ghi sai rằng PTS không có `apāya`; `apāya` là từ thông dụng (mil6.3.1 `apāyagāmī` → "đọa xứ"; mil3.3.11). Cách đọc đã chọn: `ṭhatvā` + `apāyaṁ` + `samuttariṁ` (n’ti trong bản ghim = ṁ + ti, như `dukkhan’ti`; aorist ngôi 1 số ít cùng mẫu với `atariṁ`, `tariṁ`) → "đã đứng vững mà vượt qua đọa xứ"; chủ ngữ để ngầm như Pāli. Mục "ṭhatvāpāyaṁ không có mục từ điển nào trong PTS" và lời dẫn bản Rhys Davids ở trên không được kiểm lại trong lượt này và không còn là căn cứ; căn cứ mới là hình thái và quét toàn Pāli root (`samuttarin` chỉ xuất hiện đúng một lần, ở đây).
  · 2.4 còn thiếu dấu `’` đóng nháy đơn mà Pāli có (`samuttarin’”ti`): thêm `’`, nay nháy khớp Pāli từng khoá (14/14).
  · 2.3: "Ở nơi thích hợp, không chê trách" → "Trong điều thích hợp, không đáng chê trách": `kappiye anavajjasmiṁ` là hai vị trí cách (điều thích hợp, điều không đáng chê trách), không phải "nơi chốn"; đồng nhất với 1.3.
  · 1.2: thêm từ so sánh `yathā` ("ví như") bị bỏ, để vế `evameva` (1.3) có điểm tựa; `nāññatthamanudhāvati` → "không chạy theo nơi khác"; bỏ "chiều gió" không có trong Pāli.
  · 1.3: bỏ "chánh pháp" (không có trong Pāli; `satthusāsana` = lời dạy của bậc Thầy), "chín phần lời dạy của bậc Thầy" (cùng khuôn `navaṅgaṁ buddhavacanaṁ` mil6.4.1 và `navaṅgaṁ satthusāsanaṁ` → "bậc Thầy" ở tha-ap8:108.2); khôi phục `buddhena bhagavatā` = "Đức Phật, bậc Thế Tôn" (bản cũ bỏ `buddhena`); "đã dạy" → "đã nói" (`bhāsita`); "đi theo" → "noi theo"; `samaṇadhamma` "đời sống sa-môn" → "sa-môn pháp" (tiền lệ mil7.3.4:1.3; chỉ 1–2 tiền lệ nên điểm thuật ngữ không nâng); `pariyesitabbaṁ` "tìm hiểu" → "tìm cầu" (pariyesati là tìm kiếm, không phải nghiên cứu); `ṭhatvā` được dịch ("đứng vững") thay vì chìm trong "ở trong".
  · 1.4: khôi phục `ekaṁ` ("một phần"): bản cũ bỏ chữ "một" khỏi `ekaṁ aṅgaṁ`. Các bài anh em mil7.2.1/2.3/2.4/2.8 cũng bỏ chữ này (4/4) — lệch tiền lệ có chủ ý, vì Pāli có `ekaṁ` và ở 1.1 đã dịch "một phần"; không sửa ngoài bài.
  · 1.5: khôi phục `Bhāsitampetaṁ, mahārāja` ("Này Đại vương, điều này cũng đã được … nói"). Bản cũ bỏ cả "cũng" lẫn hô ngữ; đo 40 khoá Pāli `Bhāsitampetaṁ, mahārāja, therena …` ở các bài mil khác: 20 khoá giữ "điều này" và 20 khoá bỏ hẳn; chỉ 7 khoá giữ "cũng", gồm ba bài cùng phẩm (mil7.2.1, mil7.2.2, mil7.2.9). Theo mẫu cùng phẩm và đúng chữ Pāli, vì `pi` ("cũng") có trong nguyên văn.
  Giữ nguyên, có chủ ý: 0.2 "Câu hỏi về cách dùng dẫn với ví dụ" (42 khoá `:0.2` trong mil dùng cùng dạng dù câu chữ gượng; sửa riêng một bài sẽ lệch đa số, nên để người điều phối quyết định cho cả loạt); 0.3 "Phẩm Con Lừa" (đúng với `gadrabha`; 6/6 bài cùng phẩm đã đọc là mil7.2.1, 2.2, 2.3, 2.6, 2.8, 2.9 đều dùng cùng dạng); 1.1 dùng khuôn "tôn giả" như mil7.2.1/2.3/2.4/2.8/2.9.
  Điểm đổi: source_provenance 9.5→9.3 (khẳng định sai về PTS ở notes cũ); semantic_fidelity 9.3→8.9 (lỗi `sabbadā` và `apāya` nay đã sửa nhưng là lỗi nghĩa thật, và `samuttariṁ` vẫn là hình thái chỉ gặp một lần); grammar_logic 9.3→9.0 (phân tích kệ cũ sai; nay đúng nhưng hapax); segment_alignment 10.0→9.8 (thiếu nháy đóng ở 2.4); terminology 9.2→8.9; vietnamese_clarity 9.3→9.1; han_viet_balance 9.3→9.1; ambiguity_integrity 9.0→8.6 (khẳng định nguồn không kiểm chứng ở notes cũ; hapax còn đó); triangulation 7.5 và technical_integrity 9.6 giữ nguyên. final_score 9.2→8.98.
  BẤT ĐỊNH CÒN LẠI: (1) `samuttariṁ` đọc là aorist ngôi 1 từ hình thái và quét Pāli, không có bản Anh/Việt pin để đối chiếu; cách đọc khác (danh từ chỉ người làm hành động vượt qua) sẽ đổi "đã vượt qua" thành mô tả chung; chủ thể của kệ (Rāhula tự nói hay nêu chung) để ngầm. (2) `navaṅga` không được liệt kê chín phần trong bài. Chưa chạy `npm run validate` · `npm test` · `npm run check` · `npm run build` trong lượt này nên `technical_integrity` giữ 9.6.
