notes: |-
  **Đo lại ba mệnh đề của lát.** `0.1` → **Jātaka** (400/416). `0.2`
  `Dasakanipāta` → *Bộ Mười Bài Kệ* (0 tiền lệ thật — xem `notes` của `ja439`). `0.3`
  `Catudvāravagga` → *Phẩm Bốn Cửa* (0 tiền lệ thật; dựa trên `catudvāra` → *bốn cửa* đã
  có 2 lần trong tầng).
  Kinh tên: *Kinh Cakkavāka* là **tiền lệ trực tiếp** — `ja434:0.4` đã dịch *8. Kinh
  Cakkavāka* cho đúng Pāli `8. Cakkavākajātaka`, nên tôi dùng lại nguyên văn. `11.1`
  theo 383 cặp đã có; `terasamaṁ` → *thứ mười ba* nối theo `ekādasamaṁ` → *thứ mười
  một* (tiền lệ 1/1).

  **Trùng nguyên văn — 8 khoá, và hai chỗ tôi phải chọn giữa hai tiền lệ mâu thuẫn.**
  - `4.3` = `8.1` `Ahampi samma bhuñjāmi,` (trùng nội bộ): dùng lại nguyên văn cho cả hai.
  - `6.4` = `7.4` `tena vaṇṇo tavediso.` (trùng nội bộ): dùng lại nguyên văn.
  - `5.3` `Na ca me tādiso vaṇṇo,` → nguyên văn `ja434:6.5` (*sắc đẹp của tôi không
    phải như vậy,*).
  - `7.3` `Laddho piṇḍo na pīṇeti,` → nguyên văn `ja394:3.3`.
  - `9.1`–`9.2` → nguyên văn `ja321:4.1`–`4.2`.
  - `5.2` `suciṁ maṁsūpasecanaṁ;` có **hai tiền lệ mâu thuẫn**: `ja309:2.2` *được rưới
    nước canh thịt tinh khiết;* và `ja346:3.2` *chan nước xúp thịt thơm ngon tinh sạch;*.
    Cả hai đều thêm một chữ không có trong Pāli (`tinh khiết` lặp `suciṁ`; `thơm ngon`
    không có trong Pāli). Tôi chọn **nguyên văn `ja309`** vì `5.1` của tôi là danh từ
    (*Món ăn nấu cho loài người*) nên dạng bị động *được rưới …* hợp vị ngữ hơn. Vẫn còn
    lệch so với `ja346` ở một khoá — người biên tập nên thống nhất một trong hai.

  **Tên riêng khai vào bộ nhớ tiếp trình.** `Pāṭhī` (`2.1` `Pāṭhīnaṁ`) có 0 tiền lệ;
  tôi khai vào `_hvi._từ_vi()` trong `_tvd_65.py` sau khi xác chứng nó có thật trong Pāli
  của bài. Tương tự `Cakkavāka` không cần khai vì đã xuất hiện ở `ja434:0.4` (nên
  `lọt_pāli` cho qua ở `0.4`).

  **Câu tôi phải tự quyết.**
  - `4.4` `loṇiyateliyaṁ`: tôi dịch *cây mè mọc trong làng*. `loṇi` = mè, nhưng
    `yateliyā` là một loài cây nữa mà tôi không xác định được, nên đây là cách đọc của
    tôi, không phải điều từ nên xác nhận. 0 tiền lệ cho cụm này.
  - `6.3` `Utrasto ghasasī bhīto`: tôi dịch *miệng óc dạ, bụng co rúm, kinh hoảng hối*
    — ba vế theo đúng thứ tự Pāli, nhưng `utrasta` ở đây tôi hiểu là nôn ói.

  **Dấu lược:** 0/45 khoá có `…pe…`.

  **Không có tầng Anh.** 0/45; `ja451` không nằm trong 83 tệp `ja` đã ghim.

  **Giải quyết draft 2026-10-12.** Các mục trên về `4.4`, `6.3`, `7.2`, `5.1`, `3.x` và về
  «ba mệnh đề lát» chỉ còn đúng với `0.1`–`0.4`, `11.1`; mọi mục khác về nghĩa các khoá kệ
  **bị thay thế** bởi mục này (bản cũ có lỗi nghĩa thật ở nhiều khoá).
  - **Blocker gỡ:** «`vietnamese-current` chỉ có Pháp Cú» (loại giới hạn tham chiếu, không phải
    lỗi văn bản; mọi bài `kn` ngoài Pháp Cú đều thiếu tầng này). **Blocker giữ:** không có
    tầng Anh SuttaCentral đã ghim cho `ja451` (sự thật về upstream; để waiver của người biên tập xử lý).
    Không có blocker kiểu «Sujato trống» vì không có tầng Anh nào để đo.
  - **Lỗi nghĩa thật trong bản cũ: khoảng 20/41 khoá kệ (18 khoá nặng: `1.2`, `1.4`, `2.1`, `2.2`, `3.2`–`3.4`, `4.3`, `4.4`, `6.3`, `6.4`, `7.2`, `7.4`, `8.1`, `8.3`, `9.2`, `10.2`, `10.3`)** đọc lại từ Pāli. Người nói: `1`–`2`, `4`–`5`
    là con quạ (`dhaṅka`, `7.2`) nói với cakkavāka; `3` và `6`–`10` là cakkavāka đáp.
    Đã sửa: `2.1`–`2.2` (câu cũ «Con cá Pāṭhī nói: … lớn lên ngoài bờ bùn» là bịa; thật ra là bốn
    tên cá `pāṭhīna`, `pāvusa`, `balaja`, `muñjarohita` — tiền lệ `ja546:71`, `tha-ap3:6`, 5/8 khoá
    gộp «cá balaja, cá muñjarohita»); `3.2` (`jaṅgalāni odakāni vā` = những thứ trên cạn, dưới
    nước, không phải «củ rễ rừng khô cạn»); `3.3` (`sevālapaṇaka` = rong rêu, bèo bọt, theo `mil7.6.2:2.1`
    và `mil3.1.10`, không phải «cháo gạo và bánh»); `3.4`/`4.3`/`8.1` (`samma` = «này bạn», 117 khoá
    tầng; cũ «đúng điều» là vô nghĩa); `4.4` (`loṇiyateliyaṁ` = món nấu với muối và dầu, **không**
    phải «cây mè mọc trong làng»; `loṇiya` = mặn, `teliya` = có dầu); `5.1` (`manussesu kataṁ` =
    nấu giữa loài người, không «cho»); `6.1`–`6.4` (`utrasto … bhīto` = hoảng hốt, sợ hãi — cũ
    «miệng óc dạ, bụng co rúm» là bịa; `tena vaṇṇo tavediso` = vì thế dung sắc ngươi như vậy, không
    phải «phải biết sắc đẹp của mình»); `7.1`–`7.2` (`viruddha` + `pāpena kammunā`: cũ «dấu vết của một
    nghiệp xấu»); `8.3` (`appossukko nirāsaṅkī` = không bận tâm, không lo ngại, theo `ja492:3.3`; cũ
    «không chán ghét, không oán hận» sai); `9.1`–`9.4`; `10.1`–`10.4` (cũ «không chinh phục, không
    làm khổ ai», «lập tâm thiện»: sai; dùng lại `iti27:10.1`–`10.4`); `1.1`–`1.4` (cũ «lông tơi dày»,
    «tỳ vết» là thêm nghĩa).
  - **Trùng nguyên văn:** 10.1–10.4 với `iti27:10` (4/4, dùng lại); `7.3` với `ja394:3.3` (dùng lại);
    `5.2` với 8 khoá `suciṁ maṁsūpasecanaṁ` (`ja496`×4, `ja538:86.4`, `ja309`…; dùng lại, 8/9 cùng dạng,
    `ja346:3.2` lệch); `8.3`–`8.4` với `ja492:3.3`–`3.4` (dùng lại, bỏ dấu ngoặc cuối); `9.1` với
    `ja321:4.1` (dùng lại). **Cố ý khác tiền lệ:** `9.2` bỏ «buông lung phóng túng» của `ja321:4.2` vì
    Pāli `sīliyaṁ` không có nghĩa ấy; `5.3` dùng «ta» và «dung sắc» thay «tôi … sắc đẹp» của `ja434:6.5`
    để nhất quán đại từ trong bài (quạ và cakkavāka đều «ta»/«ngươi») và vì `vaṇṇo` ở `6.4`/`7.4` là
    sắc xấu nên không dùng «sắc đẹp». Trùng nội bộ: `4.3`=`8.1`, `6.4`=`7.4` (2 cặp, 0 cặp khác nhau).
    Số khoá Pāli trùng nguyên văn với bài khác đã dò: 13 (11 khoá kệ), trong đó khác bản Việt có chủ ý: 2 (`5.3`, `9.2`).
  - **Số:** `terasamaṁ` = 13, khớp `0.4`; `Dasaka` = 10; không có số lượng nào khác.
  - **Dấu ngoặc:** khớp Pāli từng khoá (mở ở `1.1`, `3.1`, `4.1`, `6.1`; đóng ở `2.4`, `3.4`, `5.4`, `10.4`).
    Dấu lược: 0/45 khoá. Tên khoá: 45/45 khớp tập khoá Pāli.
  - **Bất định còn lại (ghi tại đây, không đưa vào thân kinh):** (1) `1.2` `ghano sañjātarohito`
    — `ghana` = săn chắc; `rohita` có thể là sắc đỏ (bản dịch chọn) hoặc `lohita` = máu huyết (tức
    «máu thịt đã đầy đặn»); 0 tiền lệ. (2) `1.4` `mukhindriya` hiểu là «mặt và các căn». (3) `6.1`
    `attani veraṁ` — locative «nơi chính mình» giữ nguyên tính mơ hồ (thù oán ở ngay mình / hướng về
    mình); không chọn một cách hiểu. (4) `9.1`–`9.2` `karassu ānubhāvaṁ`, `vītivattassu sīliyaṁ` — «ra
