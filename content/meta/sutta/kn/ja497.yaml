notes: |-
  Đợt 19, làn 70. Dịch từ Pāli root commit đã ghim, đủ 97/97 khoá, thứ tự khoá đúng thứ tự Pāli, không có khoá ngoài tập Pāli. Không có tầng Anh cho uid (xem blocker); tầng Việt hiện hành chỉ có Pháp Cú. Bản root `pli/ms` của Jātaka chỉ có phần kệ, không có văn xuôi khung truyện, nên người nói của từng đoạn không được ghi vào thân kinh; chỉ đọc từ ngữ cảnh kệ (xem dưới).

  **Tiêu đề.**
  - `0.2` “Bộ Hai Mươi Bài Kinh” dùng lại nguyên văn bản dịch của `Vīsatinipāta` ở `thag16.1`, `thag16.2`, `thig13.1`, `thig13.2` (4/4 khoá cùng một dạng); các bộ cùng tầng `ja` dùng khuôn “Bộ N Bài Kinh” (ví dụ `ja461:0.2` “Bộ Mười Một Bài Kinh”).
  - `0.3` “Phẩm Mātaṅga”: giữ nguyên tên riêng theo khuôn “Phẩm Parosata”, “Phẩm Asampadāna”, “Phẩm Santhava” của tầng. `0.4` “1. Kinh Mātaṅga” và `24.1` “Kinh Mātaṅga thứ nhất.” theo khuôn “N. Kinh <tên>” / “Kinh <tên> thứ N.” (`ja461:0.4`, `ja461:14.1`). Số `1.` và `paṭhamaṁ` đều là 1 ⇒ “thứ nhất” khớp số trong tiêu đề.

  **Tiền lệ dùng lại nguyên văn.** Đã dò toàn tầng (Pāli đã ghim ↔ bản Việt hiện có): 8 khoá của bài này có Pāli trùng nguyên văn với khoá ở bài khác. Kết quả: `0.2` giữ nguyên (4/4 cùng dạng); `6.2`, `7.2` (`Lobho ca doso ca mado ca moho;`) dùng lại nguyên văn `dn19:46.18` “tham, sân, say đắm và si mê;”; `8.3` dùng lại nguyên văn `ja474:9.1`; `23.1`–`23.2` trùng với `sn1.23`, `sn7.6`, `sn11.19`, `thag4.4` (và `ja414:5.1`–`5.2`), 5 cặp mà bản Việt chia thành 4 dạng (“Những ai tham, sân / và vô minh đã được diệt tận” ở `sn1.23` và `ja414`, “Những ai đối với tham, sân và vô minh / đã ly nhiễm” ở `sn7.6`, “đã ly diệt tham, sân” ở `sn11.19`, “đã dứt trừ tham, sân” ở `thag4.4`) nên không có dạng đa số rõ; tôi chọn dạng của `sn7.6:4.1`–`4.2` vì nó tách rõ “tham, sân và vô minh” cùng là đối tượng của “đã ly nhiễm”, tránh câu “Những ai tham, sân” có thể bị đọc ngược nghĩa (kẻ tham sân) ngay trước lời dạy rằng bố thí cho bậc lậu tận mới có quả lớn. `23.3` “Bậc lậu tận, những vị A-la-hán,” theo `sn7.6:4.3` (các dạng khác cùng nghĩa ở `sn1.23`, `sn1.28`, `sn6.5`); `10.2` (`isi saccaparakkamo;`, trùng `ja431:9.2` “bậc thiền hiền nỗ lực hướng tới chân lý”) **cố ý khác**: xem `isi` dưới đây.

  **Trùng nguyên văn trong chính bài.** 97 khoá, 8 nhóm Pāli trùng (sau khi nén khoảng trắng): `1.2`=`12.2`, `1.3`=`12.3`, `5.4`=`7.4`, `6.2`=`7.2`, và bốn khoá `11.1`–`11.4`=`15.1`–`15.4`; ngoài ra `6.1`≈`7.1` chỉ khác dấu mở nháy. Cả 8 nhóm (và cặp `6.1`/`7.1`) đã dùng đúng một bản Việt, 0 cặp lệch. Riêng `1.3` và `12.3` (`Saṅkāracoḷaṁ paṭimuñca kaṇṭhe,`): Pāli y hệt ở hai nơi, dùng cùng một câu mệnh lệnh “Hãy quàng mảnh giẻ rác lên cổ,”; ở `12.3` nó là lời lặp lại câu mắng ở `1.3` (xem bất định 9).

  **Số Pāli:** bài này không có số lượng nào cần tính (`Vīsati` ở `0.2` = hai mươi, theo `thag16`/`thig13`; `paṭhamaṁ` = 1).

  **Thuật ngữ và tiền lệ, đã đo:**
  - `isi` → “ẩn sĩ”. Tầng `ja` có 12 khoá chứa `isi`/`isayo`/`isiṁ`/`isinā` với 5 cách dịch khác nhau: “thiền hiền” 5 (`ja431`, `ja433`, `ja436`), “đạo sĩ” 2 (`ja250`), “hiền triết” 1 (`ja372`), “ẩn sĩ” 1 (`ja422`), “tiên tri” 1 (`ja453`), còn lại không rõ cùng dạng. Không có dạng đa số. Chọn “ẩn sĩ” vì là từ phổ thông rõ nghĩa; “thiền hiền” là cách tổ hợp riêng của vài tệp, khó hiểu với người đọc hiện đại.
  - `saccaparakkama` (10.2) → “tinh tấn theo chân thật”, theo `an3.40:6.6` (“tinh tấn theo chân thật”); `ja431:9.2` dịch khác (“nỗ lực hướng tới chân lý”), 1 cặp lệch có chủ ý.
  - `saccappaṭiñña` (14.4) → “giữ lời chân thật”, theo `dn30:2.18.2`.
  - `dummavāsī` (1.1, 12.1) → “ăn mặc xấu xí” (0 tiền lệ; `dumma` = `du` + `-vāsī`, “mặc đồ xấu”). `otallaka` (1.2, 12.2) → “tả tơi”: 0 tiền lệ trong tầng, chọn nghĩa “rách rưới, tiều tụy”, xem bất định 1.
  - `paṁsupisācaka` → “quỷ bụi đất”: tầng có 3 khoá, `ja347:4.2` “loài quỷ bụi đất” (jātaka), `mn79:8.3` và `ud4.4:7.3` “quỷ bùn”; chọn theo `ja347`.
  - `yakkha` → “dạ-xoa”: tầng `ja` có 20 khoá chứa `yakkh-`, “dạ-xoa” 18 (14 chữ thường + 4 viết hoa), “yêu quái” 2.
  - `brahmacāri` (17.2) → “bậc phạm hạnh”: tầng `ja` có 7 khoá, “phạm hạnh” 6.
  - `jamma` (3.4, 8.4) → “thấp hèn”, theo `ja474:9.2` (“kẻ thấp hèn”).
  - `dakkhiṇeyya` → “xứng đáng được cúng dường” / “đáng được cúng dường” (125 khoá trong tầng cùng gốc: “đáng được cúng dường” 80, trong đó “xứng đáng được cúng dường” 39; “đáng được hiến tặng” 6).
  - `ārādhaye` (4.4) → “làm hài lòng”, theo `tha-ap391:3.1` (“làm hài lòng Đấng Toàn Giác”); `snp3.5:27.3` dịch “thành tựu nhờ…” (khác nghĩa nhẹ, chọn dạng “làm hài lòng” vì `dakkhiṇeyye` ở đây là đối tượng trực tiếp).
  - `jātimantūpapanna` (5.3) → “có dòng dõi cao quý”; `ja324:1.3` dịch “danh giá”. Cùng gốc, khác chữ nhưng cùng nghĩa.
  - `jātimada` (6.1, 7.1) → “kiêu mạn dòng dõi”, theo `thag6.9:1.1` (“say sưa vì kiêu mạn dòng dõi”). `atimānitā` → “thói quá mạn”, cùng gốc với `ja474:9.4` “quá mạn”.
  - `mado` (6.2, 7.2) → “say đắm”, theo `dn19:46.18` (1 khoá trùng nguyên văn cả dòng). Trong khoá này `mado` đứng sau `jātimado` ở 6.1 nên “kiêu mạn” và “say đắm” là hai chữ khác nhau cho hai chữ Pāli khác nhau.
  - `aguṇa` (6.3, 7.3) → “khuyết điểm”: tầng có 128 khoá chứa chuỗi `aguṇ`, hầu hết là `kāmaguṇa` (không liên quan); không có tiền lệ cho `aguṇa` đứng riêng.
  - `supesala`/`apesala` (5.4, 6.4, 7.4) → “rất tốt đẹp”/“không tốt đẹp”: `pesala` ở tầng chủ yếu chỉ người (“hiền thiện”, “khả ái”); ở đây chỉ thửa ruộng nên dùng “tốt đẹp”.
  - `upajjhāya` không dịch “thầy tế độ”: xem bất định 2.
  - `bhūripañña` (13.1, 14.1, 19.3) → “(bậc) trí tuệ rộng lớn”: tầng có 36 khoá chứa `bhūripañ-`, “trí tuệ rộng lớn” là dạng chính (`dn19:3.15`, `mn56:29.51`).
  - `kasāva` (21.3) → “cấu lỗi”, theo `mn125:30.2` (“đã lắng lọc mọi cấu lỗi”, gốc `kasāva`).
  - `asaññata` (21.4) → “không tự chế”: cùng cách với `ja474:13.2` (27 khoá chứa `asaññat-` trong tầng).
  - `puññakhetta` (21.2) → “phước điền”.
  - `ajina` (22.1, 22.4) → “da thú” theo `snp5.1:35.3` (“tóc búi và da thú”), 1 tiền lệ; không dịch “da linh dương” để khỏi thêm loài.
  - `tāyati` (22.4) → “che chở”, theo `ja211:1.4` (“không được che chở”).
  - `khīṇāsava arahanto` (23.3) → “lậu tận, A-la-hán”, thứ tự như `sn7.6:4.3`.
  - `maṇḍabya`, `mātaṅga`, `upajotiya`, `upajjhāya`, `gaṇḍakucchi`: giữ nguyên Pāli (tên riêng hoặc tên chưa chắc, xem bất định 2).

  **Dấu câu.** Nháy kép `“”` khớp Pāli từng khoá: Pāli 20 dấu mở · 20 dấu đóng, Việt cũng 20/20, lệch 0/97 khoá (đã thử từng khoá, không chỉ cân tổng). Nháy đơn `‘’`: Pāli 0, Việt 0. Dấu lược `…` và `(…)`: Pāli 0, Việt 0 ⇒ không có `…pe…`, không có `(…)` trần. Một lỗi đã bắt khi tự kiểm: bản nháp đầu bỏ sót dấu mở nháy ở `10.1` (Pāli có `“Idaṁ vatvāna mātaṅgo,`); phép so từng khoá bắt được và đã sửa.

  **BẤT ĐỊNH, ghi lại thay vì đoán, không thêm vào thân kinh:**
  1. `Otallako` (1.2, 12.2): 0 tiền lệ; dịch “tả tơi”. Có thể là “rách rưới/tiều tụy”; nghĩa gần như nhau, không thay đổi cấu trúc câu.
  2. `Kvettha gatā upajotiyo ca, / Upajjhāyo ca atha vā gaṇḍakucchi` (8.1–8.2): tôi đọc `upajotiyo`, `upajjhāyo`, `gaṇḍakucchi` là ba tên người (động từ `gatā` số nhiều, cùng danh cách; `gaṇḍakucchi` có vẻ là biệt hiệu “bụng bướu”), nên giữ nguyên Pāli. Tầng Pāli đã ghim không có văn xuôi để xác nhận; nếu `upajjhāyo` thật sự là danh từ chung “thầy tế độ”, nghĩa đoạn vẫn không đổi (kêu các người giúp việc đến), chỉ khác ở chỗ có viết hoa tên riêng hay không.
  3. `Giriṁ nakhena khaṇasi, … Jātavedaṁ padahasi` (9.1–9.3): `padahasi` 0 tiền lệ trong tầng (các khoá `padahati` còn lại đều là “tinh cần”). Tôi chọn “nuốt lửa” theo ngữ cảnh ba việc bất khả (đào núi bằng móng, nhai sắt bằng răng, … lửa); nếu đúng nghĩa là “dẫm/đạp lên lửa” hay “châm lửa” thì mất ý “tự hại”, nhưng ba việc vẫn đều bất khả. Chưa phân xử được. Người nói của khoá `9` không xác định được: dấu nháy kép trong Pāli mở ở `8.1` và chỉ đóng ở `9.4`, nên `8`–`9` là cùng một lời dẫn; tôi giữ đúng cấu trúc nháy, không gán người nói.
  4. `Anūpakhette` (4.2): `anūpa` = đất ngập nước, đầm lầy; dịch “ruộng đầm lầy”. 0 tiền lệ trong tầng. Một cách đọc khác coi `anūpa` là “không đúng chỗ”; cả hai đều cùng ý “gieo hạt cả nơi không tốt vẫn mong có quả”.
  5. `Saṅkāracoḷaṁ paṭimuñca kaṇṭhe` (1.3, 12.3): `paṭimuñca` là mệnh lệnh ngôi hai; dịch “Hãy quàng … lên cổ” ở cả hai nơi vì Pāli y hệt. Cách đọc khác của 12.3: các môn sinh đang tả lại chính lời mắng ở 1.3 (như trong lời kể); bản Việt giữ câu mệnh lệnh nguyên dạng để không tự phân xử.
  6. `Anvāgatā isayo sādhurūpā` (16.2): `anvāgatā` “theo sát, đi theo” (dạ-xoa theo sát các ẩn sĩ). Cách đọc khác `isayo` là chủ ngữ (các ẩn sĩ đã đến); không đổi ý chính của kệ. `Te duṭṭhacittaṁ kupitaṁ viditvā` (16.3): `te` = “họ” (các dạ-xoa), tân ngữ “kẻ ác tâm đang nổi giận” là người con (từ 16.4 `puttamakaṁsu`); không nêu thêm danh từ.
  7. `Appeva naṁ putta labhemu jīvitaṁ` (13.4): `putta` đọc là “con trai” (đối tượng của việc giữ mạng sống); cách đọc khác coi `putta` là hô cách, nhưng không có người nghe thích hợp trong kệ này. “giữ được mạng sống” là cách dịch `labhemu jīvitaṁ`.
  8. `Tadeva hi etarahi ca mayhaṁ` (18.1): `tadeva` đọc là “lúc ấy” (đối với “bây giờ” ở `etarahi`); tầng không có tiền lệ cho dạng này.
  9. Người nói và người nghe, suy từ ngữ cảnh, không có trong tầng Pāli đã ghim: 1 và 3, 5, 8: người bà-la-môn Maṇḍabya; 2, 4, 6–7, 16, 18, 20–23: vị ẩn sĩ Mātaṅga; 11, 13, 15, 17, 19: một người mẹ (giống cái ở `gatāsmi`, `anvāgatā` trong 17.3–17.4, nên “bà” ở 12.4, 16.4, 18.3, 20.2, 20.4 là suy ra từ đó); 12, 14: các môn sinh. Người nói của `9` không xác định (xem 3); `10` là lời dẫn (mở nháy ở 10.1). Không ghi những điều này vào thân kinh; đại từ ngôi hai trong bản Việt chỉ dùng “ngài”/“tôi”/“ta”/“ngươi”.
  10. `Mahakkasāvesu` (21.3): tôi đọc `mahā-` + `kasāva` “cấu uế” (cùng gốc `mn125:30.2`). `kasāva` còn có nghĩa “nhuộm màu vàng”; nếu là nghĩa này thì “kẻ nhiều cấu lỗi” sẽ khác, nhưng đi cùng `kiliṭṭhakammesu asaññatesu` (hành nghiệp ô nhiễm, không tự chế) và đoạn kết (tham, sân, vô minh), nghĩa cấu uế hợp ngữ cảnh hơn.
  11. `Jaṭā ca kesā ajinā nivatthā` (22.1): dịch sát “búi tóc bện và mái tóc, y bằng da thú”; không tách chắc `jaṭā` (búi tóc bện) và `kesā` (tóc) là hai vật hay một. `Jarūdapānaṁva mukhaṁ parūḷhaṁ` (22.2): “gương mặt mọc um tùm như giếng cũ”; `jarūdapāna` ở `ja256` được dịch khác (“giếng nước bùn”, trong tiêu đề), nên 1 cặp khác nhau có chủ ý theo nghĩa `jarā` “cũ”.
  12. `Pathaddhuno pannaraseva cando` (14.2): “trên hành trình của nó” cho `pathaddhuno` (0 tiền lệ); nghĩa cơ bản “trên đường/hành trình”.

  **Coverage English (mục 7):** mẫu số = 0. Khoá Pāli dài nhất sau khi nén khoảng trắng là 35 ký tự (< 40) nên 0/93 khoá có nội dung; 4 khoá `:0` bị loại trước. Đây là *cổng không đo được gì*, không phải *không cần ghi nhận*. Sujato: 0 tệp cho `ja497`; `english-project`: 0; `vietnamese-current`: 0 (chỉ Pháp Cú). Ba tầng đều vắng ⇒ `triangulation` 7,0 (≤ 8,0) và `status: draft` kèm blocker ở trên. Tôi không đụng `content/meta/reference-gaps.yaml`.

  **technical_integrity = 9,6:** lát này cấm chạy cổng, nên không tuyên bố technical gate pass. Bốn lệnh còn lại do người điều phối chạy tập trung: `npm run validate` · `npm test` · `npm run check` · `npm run build`.
