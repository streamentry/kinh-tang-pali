notes: |-
  Dịch trực tiếp từ Pāli root cho đủ 100 khoá; không có bản Anh của Sujato, không có bản Việt hiện hành và không có lớp lấp english-project cho tha-ap127. Chỉ có tiền lệ nội bộ của chính phẩm tha-ap (7.645 dòng Pāli khác nhau đã dịch, tra được) để giữ thuật ngữ nhất quán.

  Tiêu đề: translationTitle bằng đúng giá trị khoá :0.3 (Ký Sự Về Trưởng Lão Sammukhāthavika). Pāli ở :0.3 không bắt đầu bằng số thứ tự nên :0.3 không có số. Phần mở đầu của tiêu đề phân kỳ trên tầng tha-ap và cần người biên tập phán một lượt cho cả cuốn. Đo toàn tầng: Bài Kệ Tuyên Ngợ 240, Bài Kệ Tuyên Ngôn 123, Ký Sự 104, Bài Kệ Tuyên Ngợi 10. Đo ở tha-ap100 đến tha-ap160: Tuyên Ngợ 19, Tuyên Ngôn 19, Ký Sự 16. Đo ở tha-ap115 đến tha-ap140: Tuyên Ngợ 12, Tuyên Ngôn 9, Ký Sự 3. Đo ở tha-ap120 đến tha-ap129: Tuyên Ngợ 5, Tuyên Ngôn 3, Ký Sự 1. Chọn Ký Sự vì Tuyên Ngợ là dạng sai chính tả, còn Tuyên Ngôn không có gốc trong Pāli apadāna; Ký Sự đúng nghĩa apadāna, trùng cách tha-ap126 liền trước dùng, và dòng kết :26.1 theo cùng dạng (đo trên các dòng kết tha-ap: Ký sự về Trưởng lão 109, Bài Kệ Tuyên Ngợ 217, Bài Kệ Tuyên Ngôn 119, nên Ký sự không phải đa số ở dòng kết; chọn vì hai trường này phải khớp nhau và vì tha-ap126 liền trước dùng đúng dạng này). Tên người giữ nguyên Pāli (Sammukhāthavika), không dịch nghĩa như tha-ap126 đã làm ở tiêu đề.

  Số Pāli, tự tính theo cấu tạo và đối chiếu chuỗi liên tục: Ekanavutito = eka 1 + navuti 90 = 91 (:12.1); navuti = 90 (:13.1); ekūnanavuti = 90 trừ 1 = 89 (:14.2); aṭṭhāsīti = 88 (:15.1); sattāsīti = 87 (:16.1); chaḷasīti = 86 (:17.2); pañcasīti = 85 (:18.2); cullasīti = 84 (:19.2); teasīti = te + asīti = 83 (:20.2); dveasīti = 82 (:21.2); ekasīti = 81 (:22.2); asīti = 80 (:23.2). Mười một vị vua lập thành dãy liên tục 90, 89, 88, ..., 80, khớp với 91 kiếp lúc tán thán Đức Phật ở :12.1. Dạng số: bốn mươi bảy, tám mươi tư (tư là đa số: hậu tố mươi tư 125 so với mươi bốn 17 trên tầng tha-ap), mốt sau chục, lăm sau chục. Bài không có cụm Tiṁsakappasahassa nên không đụng bất định tiṁsa (3 hay 30). Mười ngàn thế giới ở :2.2: dasasahassi là danh từ giống cái chỉ mười ngàn (thế giới); tiền lệ tha-ap33 và tha-ap472 đều thêm chữ thế giới, giữ theo.

  Công thức dùng lại nguyên văn từ tiền lệ tầng: Paṭisambhidā catasso (Bốn vô ngại giải, 471/484) và kataṁ buddhassa sāsanaṁ (đã làm tròn lời dạy của Đức Phật, 440/482); Sattaratanasampanno (Đầy đủ bảy món báu quý giá, 50/91); cakkavattī mahabbalo (là Chuyển luân vương có đại thần lực, 63/113 gộp hoa thường; tha-ap126 và tha-ap66 dùng đại uy lực, 11/113, nhưng tầng và cả vùng tha-ap100 đến tha-ap160 nghiêng về đại thần lực); Duggatiṁ nābhijānāmi (Tôi không còn biết đến đọa xứ nào, 89/407, là dạng gần nhất và trùng tha-ap126); thomanāya idaṁ phalaṁ (đó là quả báo của sự tán thán, đúng như tha-ap318; tha-ap66 và tha-ap253 có thêm chữ Phật nên không theo, vì Pāli không có). Công thức lời kết Itthaṁ sudaṁ ... abhāsitthāti dùng nhóm số nhiều những bài kệ này (407 khoá), không dùng nhóm số ít bài kệ này.

  Thuật ngữ và các chỗ đã cân nhắc: pācināmukho = mặt hướng về phương đông (pācīna là phương đông; tha-ap81, tha-ap99, tha-ap288 đều dịch phương đông; tha-ap86 viết hướng nam là sai và nằm ngoài phạm vi bài này). lokanāyaka = bậc Dẫn Đạo thế gian (đa số trên tầng). cakkhumā = bậc Có Mắt (tiền lệ trong tha-ap). dhammatā = bản tính (an4.21 viết bản tính, sn6.2 viết bản tánh, cùng câu esā buddhāna dhammatā). vācāsabhimudīresi = cất lên lời nói hùng dũng theo tha-ap9; sn52.9 dịch āsabhiṁ vācaṁ là lời nói của bậc ngưu vương. saṁvejayitvā = làm cho xúc động theo cách dn16 dịch saṁvejanīya (gây xúc động). avīcaggi = lửa Avīci, giữ tên Avīci như iti89.

  Bất định ghi lại, không đưa vào thân kinh. Một: ở :1.3, nibbāpayiñca janataṁ có thể là thì quá khứ (nibbāpayiṁ + ca, dạng sandhi) hoặc nibbāpayi ca; vì nằm trong lời được trích (nháy đơn mở ở :1.3, đóng ở :10.4) nên chọn đọc theo nghĩa tiên báo, sẽ làm dịu mát dân chúng, song chủ ngữ và thì không tự hiển lộ trong Pāli. Hai: ở :2.3 và :2.4, so dāni bhagavā satthā ... dhammaṁ deseti dùng dāni (nay) và thì hiện tại trong lời trích ở thời điểm Vipassī vừa sinh ra; dịch sát chữ, không giải quyết mâu thuẫn thời gian bằng suy diễn. Ba: aorist (ahu, sandayuṁ, pajjali, sañcari, jotayuṁ, āsuṁ) và hiện tại (kampati, vāyati) xen nhau trong dãy điềm báo; dùng chữ đã cho dạng aorist và để dạng hiện tại không đánh dấu thì. Bốn: vātakkhandha dịch khối gió, bám khandha (khối, đống), chưa tìm được tiền lệ trong tầng; padavikkamā dịch bước chân. Năm: các khoá nhắc tên vua (Pathavīdundubhi, Obhāsa, Saritacchedana, Agginibbāpana, Gatipacchedana, Vātasama, Ratanapajjala, Padavikkamana, Vilokana, Girasāra) giữ nguyên dạng Pāli; không dịch nghĩa danh xưng. Sáu: tha-ap442:13.3 (Chaḷasīti ca gāthāyo) hiện được dịch là sáu mươi tám trong khi chaḷasīti là 86 (tha-ap485:13.1 và tha-ap560:13.1 dịch đúng Tám mươi sáu ngàn); nằm ngoài phạm vi bài này nên chỉ báo, không sửa.

  Kiểm tự động và thủ công: 100 khoá Việt khớp tập khoá và thứ tự Pāli (100/100); nháy đơn, nháy kép khớp Pāli từng khoá (0 lệch trên 100 khoá); Pāli có đúng một dấu lược ...pe... ở :24.2 và Việt giữ đúng một dấu ba chấm; Pāli không có dấu lược trần hay ngoặc tròn nên Việt cũng không có; 5 nhóm Pāli trùng nguyên văn trong chính bài (tổng 46 khoá) đều có bản Việt giống nhau, 0 cặp khác; NFC sạch, không khoá rỗng, không khoảng trắng thừa, không chữ Pāli lọt sang Việt ngoài tên riêng. Chưa chạy các lệnh của kho: npm run validate, npm test, npm run check, npm run build; vì vậy technical_integrity ghi 9.6, chưa tuyên bố technical gate đã pass. reference-gaps.yaml chưa có mục cho tha-ap127 (tha-ap126 và tha-ap128 có); cần chạy npm run reference:gaps để thêm mục này với mẫu số 2 khoá nội dung (25.1 và 26.1).
