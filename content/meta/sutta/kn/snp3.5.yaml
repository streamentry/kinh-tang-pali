notes: |-
  Sửa lan 2026-10-13 (terminology fix): khoá `14.2` `Bhavābhavāya idha vā huraṁ vā` "đối với hữu hay phi hữu ở đời này hay đời sau" → "đối với hữu này hay hữu khác, ở đời này hay đời sau". `bhavābhava` dịch là *hữu này hữu khác*, không phải *hữu và phi hữu*. Căn cứ: cùng dòng Pāli ở `mnd5:34.2` (và `mnd5:40.2`) đã dịch *vì hữu này hay hữu khác, ở đời này hay đời sau*; đo trên 146 khoá Pāli có `bhavābhav-` thì 52 khoá Việt dùng *hữu này hữu khác/hữu này hay hữu khác/hữu này hữu kia* (`cnd9:60.5`, `snp5.5:12.2`, `snp4.2:5.4`, `thag14.2:3.2`…) so với 13 khoá dùng *phi hữu*. Điểm số giữ nguyên.
