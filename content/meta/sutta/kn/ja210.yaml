    **Tầng Việt hiện hành vắng — đây là đặc điểm của snapshot, không phải thiếu sót.** Đếm trực tiếp trên `source/upstream-manifest.json` tại commit đã ghim `11c9d708978cde8ba61096d8a75f7ddfb846f639`: tầng `vietnamese-current` có **0** file cho 14 uid của lát này (bilara chỉ phân phối Pháp Cú cho tiếng Việt). Nên không có bản Hòa thượng Thích Minh Châu để đối chiếu thuật ngữ ở bất kỳ bài nào; `budsas.org` chỉ là tham khảo toàn văn, không dựng cột.
  - >-
    **Tầng Anh Sujato — đếm từng khoá, không suy.** Đo `coverage` theo đúng công thức khai ở `source/layers.yaml` (Pāli ≥ 40 ký tự, bỏ khối tham chiếu `:0`, chỉ tính ô Anh có chữ): kết quả ghi ở từng bài. Ở bốn bài Tăng Bộ, những khoá Sujato để trống đều là khoá `…pe…` mà bilara không dịch — tôi **không** mở rộng những khoá đó và **không** lấy tiếng Anh của bài khác để bịa chữ.
  - >-
    **48 cặp khoá có Pāli trùng ở bài khác — đã đếm bằng script, và đã dùng lại nguyên văn.** Quét toàn tầng Pāli gốc (5.764 file, bỏ thư mục `*.apfs-orphan`) so **chính nguyên văn** của từng khoá của lát này: **45 cặp trùng byte-for-byte**, thêm **3 cặp** trùng sau khi chuẩn hoá dấu câu và nháy kép = **48 cặp**. Trong đó **35 cặp** đã có bản Việt ở bài khác và tôi **dùng lại nguyên văn** (28 cặp khớp từng chữ; 7 cặp còn lại được nêu riêng dưới đây), **13 cặp** chưa bài nào trong kho có bản Việt thì tôi đặt mới. Không có cặp nào tôi dịch khác mà không ghi lý do.
  - >-
    **Nhịp và hình thức — không lặp khuôn.** Bốn bài Tăng Bộ là `peyyāla` thuần: mỗi mục phải phát lại đúng công thức của Pāli, nên sự lặp ở đây là **bắt buộc của nguồn**, không phải lỗi khuôn. Mười bài Jātaka thì mỗi bài một bài kệ riêng, nhịp khác nhau; tôi không dùng chung một công thức dịch cho cả mười bài.
  - >-
    **Từ đa nghĩa: đã giữ đúng nghĩa theo ngữ cảnh từng câu, và nhắc lại vì đây đúng là loại nhầm đã có tiền lệ ở lát khác.** `nāgo` ở `ja190` là **gọi lớn lên** (lời cầu xin), **không phải *rồng*** và cũng không phải *con voi* — đó là hai nghĩa của `nāga` đang có trong tầng. `rājāna` ở `ja160`/`ja170` là **các vị hoàng tử** (số nhiều của `rājan`), **không phải *các vua***. `kakaṇṭako` ở `ja170` là **gai** (gai đâm vào móng), **không phải *con rắn*** — `ahi` mới là rắn. `vinīla` ở `ja160` là **chim xanh**, **không phải *thiên nga*** vì `haṁsa` mới là thiên nga và hai từ đứng cạnh nhau trong `1.4`. `muttā` ở `ja256` là **ngọc trai**, `veḷuriya` là **đá quý**, và ba dạng kim loại `ayasa`/`loha`/`tipusī` là **thiếc / sắt / đồng vàng**, không gộp làm *đồng*. `mora` ở uddāna `ja160` là **con côc** (Sujato dịch *peacock*), **không phải *con gấu***.
  - >-
    **Bất định ở `2.1` `Acāri` — tôi dịch *Cây không mục ơi*, và đây là cách đọc cần xác nhận.** `Acāri` là tế từ của `acārin` (*bền, không mục*). Ai đang gọi ai? Có hai cách: (a) cây gọi người chặt cây; (b) người kể gọi người chặt cây. Vì `2.3`–`2.4` là giọng kể với `Atha`/`Yatthabbhidā`, tôi chọn (b) và dịch tế từ theo nghĩa *không mục* để không ghép thêm chủ từ. Nếu biên tập chọn (a) thì phải rút lại phần chủ thể ở `2.1`. Ghi lại.
  - >-
    **`sinnapatto sakaṇṭako` ở `1.2` — bản nháp tôi bỏ mất `sinnapatto`, đã sửa.** Cụm là *rơi về phía gai đầy* (`sinnapatto` = rơi/đâm vào, `sakaṇṭako` = đầy gai). `asāraka` → **không có lõi** (đối lập `jātasāra` = *có lõi sẵn trong*, `2.3`) — cặp này là trục của cả kệ nên phải đối xứng. `khadira` giữ Pāli vì là tên loài cây và đã có trong tầng Việt. `garuḷo` → **nặng** (đối lập `ekappahārena` = *một nhát* ở `1.3`).
  - >-
    **Tên bài `Kandagalakajātaka` tôi dịch *Con Chào Chào* — đây là tên loài chim, cần nói rõ.** `kandagalaka` là chim chào chào (chào chào trắng), và ý nghĩa bài là con người đông như loài chim nhỏ này. Tiếng Việt không có mục từ điển cho tên loài này nên tôi dùng tên gọi quen; không dịch *bông tranh* (đó là `pupphaṇḍḍa`).
  - >-
    **Tên phẩm theo đa số.** `Dukanipāta` → **Tập Kẻ Đau Đớn** (45/73) · `Nataṁdaḷhavagga` → **Phẩm Bó Lúa** (8/8, nhất quán tuyệt đối). `3.2` `chaṭṭho` → **thứ sáu**.
  - >-
    **Từ đa nghĩa: đã giữ đúng nghĩa theo ngữ cảnh từng câu, và nhắc lại vì đây đúng là loại nhầm đã có tiền lệ ở lát khác.** `nāgo` ở `ja190` là **gọi lớn lên** (lời cầu xin), **không phải *rồng*** và cũng không phải *con voi* — đó là hai nghĩa của `nāga` đang có trong tầng. `rājāna` ở `ja160`/`ja170` là **các vị hoàng tử** (số nhiều của `rājan`), **không phải *các vua***. `kakaṇṭako` ở `ja170` là **gai** (gai đâm vào móng), **không phải *con rắn*** — `ahi` mới là rắn. `vinīla` ở `ja160` là **chim xanh**, **không phải *thiên nga*** vì `haṁsa` mới là thiên nga và hai từ đứng cạnh nhau trong `1.4`. `muttā` ở `ja256` là **ngọc trai**, `veḷuriya` là **đá quý**, và ba dạng kim loại `ayasa`/`loha`/`tipusī` là **thiếc / sắt / đồng vàng**, không gộp làm *đồng*. `mora` ở uddāna `ja160` là **con côc** (Sujato dịch *peacock*), **không phải *con gấu***.
  - >-
    Đợt này bị cấm chạy `npm run validate|test|check|build` theo lệnh lát, nên `technical_integrity` đặt **9.6** chứ không phải 10.0: tệp JSON hợp lệ, đủ khoá, NFC, không rỗng, dấu lược khớp Pāli từng khoá, ngoặc kép cân cả bài, không Pāli lọt — tất cả đã quét bằng script riêng trên **mọi** khoá, không chỉ khoá ≥ 40 ký tự — nhưng cổng kỹ thuật của repo thì chưa chạy, nên không thể tuyên bố là đã pass.
  - >-
    **VIỆC BIÊN TẬP của người điều phối (cùng PR):** khoá `ja210:0.2` mang Pāli `Dukanipāta` được đổi *«Tập Kẻ Đau Đớn»* → *«Bộ Hai Bài Kinh»*. Căn cứ: tầng **tên** của chính SuttaCentral tại commit đã ghim (`source/upstream-manifest.json` → `english-sujato`, **123** tệp `name/`) ghi `ja-name:167.ja-dukanipata` → *"The Book of the Twos"*, cùng `thag-name:134` và `iti-name:32`. `duka` là **số hai** trong dãy `ekādasa / dvādasa / dasā / aṭṭha / pañca / catu`, không phải `dukkha`. Song song chính xác với `Ekakanipāta` = *Bộ Một Bài Kinh* ← *"The Book of the Ones"*. Tầng này trước đợt sửa có **17** cách cho `Dukanipāta`, **6** cho `Asadisavagga`: đó là     lý do các agent đợt trước đi theo đa số cục bộ rồi tự sinh cách mới.     `terminology` giữ nguyên — đây là chuẩn hoá, không phải lỗi riêng của bài.
