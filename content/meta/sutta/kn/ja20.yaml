notes: |-
  **Chỉ một khoá trong lát này.** Bài có nhiều khoá hơn, nhưng `kiểm` của `_hvi.py` chỉ đòi phủ những khoá Pāli dài **≥ 40 ký tự** và không phải khoá đánh số phần `:N.0`; đếm trên tầng Pāli thì đúng **một** khoá rơi vào điều kiện đó, và đó là khoá được giao. Các vế kệ còn lại, dòng tiêu đề `:0.1`–`:0.4` và dòng kết bài không nằm trong lát, tôi **không** dịch và **không** tự thêm vào tệp.
  **Tầng tham khảo đã đo, không đoán.** Tại commit đã ghim, bài này có 0 segment tiếng Anh Sujato; và tầng Việt hiện hành (`translation/vi/phantuananh/`) tại cùng commit chỉ có 26 tệp Pháp Cú, nên **không** có bản Hòa thượng Thích Minh Châu để đối chiếu. Vì vậy `triangulation` đặt 8,5: dịch từ Pāli root, đối chiếu cú pháp qua từ điển và qua bối cảnh trong chính bài. Đây là đặc điểm của bản chụp upstream, không phải thiếu hàng của kho.
  **Đây là bài yếu nhất của lát, và tôi hạ điểm vì lý do đo được chứ không vì tiện.**
  Khoá `4.4` là vế cuối của **uddāna** (bài tóm lược) của cả phẩm Ekakanipāta — bốn
  vệ ẩn dụ, không phải mười mục danh sách. `Muccena` (bằng ánh trăng) và
  `naḷaavhayanena` (bằng lớp/tán lá đắp lên) là hai cách nói ám chỉ, tiếng cuối mỗi
  vệ khớp với phần cuối tên mười bài của phẩm.
  **Đã thử giải mã và không thể, ghi rõ thay vì bịa.** Tôi tìm trong toàn bộ tầng Pāli
  đã ghim xem có bản chú giải nào giải thích uddāna này không: lớp `thi-ap` (Aṭṭhakathā)
  tại commit đã ghim có **đúng 40 tệp** theo `source/upstream-manifest.json`, và 40 tệp
  đó **không** chứa lần giải thích nào cho uddāna Ekakanipāta. Nên tôi dịch **nguyên
  văn hình ảnh** và **không** mở mã hoá thành danh sách tên mười bài — làm vậy là
  thêm nội dung không có trong khoá.
  **Tra tiền lệ (đếm được):** dòng kết bài `<Tên> jātakaṁ <thứ tư>` → *Kinh <Tên>, thứ
  tư* (`ja1:3.1` "Kinh Bụi Dơ thứ nhất."; `ja159:5.1` "Kinh Con Công, thứ chín.");
  `Tassuddānaṁ` → *Tóm lược:* (`an10.10:4.0`); `sataṁ` → *trăm*; `sahassānaṁ` → *nghìn*,
  `sahassayāginaṁ` → *mười nghìn* (chọn **nghìn** chứ không phải *ngàn* vì 199 chỗ
  "nghìn" so với 316 "ngàn", mà "ngàn" chủ yếu đi với *hàng ngàn chư thiên*; ở đây là
  chuỗi bội số nên "nghìn" khớp nhịp).
  **0 tiền lệ, đặt mới, ghi kèm lý do:** (1) `naḷa` — trong tầng Việt chữ này chỉ xuất
  hiện như **tên riêng** địa danh (`Naḷakapāna` ở `mn68`, `Naḷakāra` ở `mn99`), **không**
  có bản Việt nào dịch nghĩa cây/cọ. Tôi dịch là *nọc* để giữ hình ảnh "tán lá đắp lên
  che trăng", nhưng đây là lựa chọn **tạm**, không phải tiền lệ — xem `translationTitle`
  tôi đặt là *Kinh Naḷapāna* (giữ tên riêng) vì lý do đó. (2) `bhavanti dasā` → *thành
  ra mười bài* — `bhavanti` là "trở thành", tôi dùng "thành ra" thay vì bỏ động từ.
  **Điểm thấp ở `terminology` 8,4 và `vietnamese_clarity` 8,4 là do hai điểm trên**, không
  phải vì thiếu đối chiếu: bản dịch không thêm ý, không bớt ý, và giữ đúng cả ba mệnh đề
  của Pāli.
