notes: |-
  Dịch trực tiếp từ Pāli root (snapshot SuttaCentral/Bilara đã ghim). Bài: Maccupāsamuttipañha, câu hỏi thứ tư của Abhejjavagga (Meṇḍakapañha), về việc đã có lời Phật nói không nơi nào thoát khỏi bẫy tử thần mà vẫn có các kinh hộ trì. 67/67 khoá, đúng thứ tự Pāli, không khoá nào ngoài tập khoá Pāli.

  TẦNG THAM KHẢO (đo, không đoán): bản Sujato không có cho bài này. Thư mục `kn/` của edition `translation/en/sujato` tại commit đã ghim chỉ có cp, dhp, iti, ja, kp, snp, thag, thig, ud, và `source/upstream-manifest.json` chỉ liệt kê tệp Pāli root cho uid này (không có tệp `translation-en`) nên đây là `not-published-upstream`, không phải `not-synced`. Tầng `vietnamese-current` cũng vắng (bilara tại commit ghim chỉ phân phối Pháp Cú). Lớp `english-project` của dự án chưa có tệp cho bài này. Coverage English theo công thức của `source/layers.yaml` (Pāli có nội dung từ 40 ký tự sau nén khoảng trắng, bỏ khối :0.x): 0/46 = 0%, dưới ngưỡng 0,80. Ba tầng tham khảo đều vắng nên bài chỉ được đối chiếu với Pāli root, bài giữ `draft` với blocker `noEnglishEditionUpstream`, và `triangulation` đặt 7,5 (không quá 8,0). Đây là giới hạn của snapshot, không phải lỗi dịch.

  KỸ THUẬT: chưa chạy `npm run validate`, `npm test`, `npm run check`, `npm run build`, nên `technical_integrity` đặt 9,6 và không tuyên bố cổng kỹ thuật đã qua.

  TIÊU ĐỀ: `:0.2` giữ `Meṇḍakapañha` (30/42 khoá `:0.2` cùng Pāli ở tầng mil giữ nguyên Pāli, 12 viết `Câu Hỏi Nan Đề`; trong mil5.2.* có 3 bài giữ Pāli và 3 bài viết `Câu Hỏi Nan Đề`; theo dạng đa số của tầng). `:0.3` dùng đúng `Phẩm Không Thể Phá Vỡ` (5/6 khoá `Abhejjavagga` ở tầng; 1 bài viết `Phẩm Abhejja`). `:0.4` giữ số thứ tự `4.` (133/133 khoá `:0.4` mil có số ở Pāli đều giữ số ở Việt) rồi `Câu Hỏi Về Sự Thoát Khỏi Bẫy Của Tử Thần`; `maccupāsa` → bẫy của tử thần (tầng có `bẫy của tử thần` 3 khoá ở thag4.1, thag4.9 và thag7.1, `bẫy của Thần Chết` 1 khoá ở ja366:4.4; `tử thần` xuất hiện 45 lần). Lời kết `15.1` theo khung `Câu hỏi về …, thứ tư` (194/196 khoá lời kết có `pañho` kèm số thứ tự trong tầng mil viết `Câu hỏi về`).

  VĂN XƯNG: `bhante` trong lời vua → `bạch ngài`. Đếm toàn tầng mil cho 394 `thưa tôn giả` và 144 `bạch ngài`; đếm gần hơn trên mil5.* cho 63 `bạch ngài` và 42 `tôn giả`; trên mil5.2.* cho 23/25 `bạch ngài`. Chọn theo phạm vi gần nhất và giữ nhất quán trong cả bài. Hệ quả có chủ ý: ba khoá có Pāli trùng với tầng và đa số tầng viết `thưa tôn giả` (11.4 và 12.4 `Āma, bhante` → 12/13; 14.5 `Na hi, bhante` → 42/58 `Không phải vậy, thưa tôn giả`) ở đây là `Vâng, bạch ngài` và `Không phải vậy, bạch ngài`; phần `Không phải vậy` giữ theo đa số. `mahārāja` → `thưa đại vương`: trong mil5.2.* có 29 `thưa`, 10 `tâu`, 9 `này`; toàn tầng mil thì `này Đại vương` đông hơn (821 so với `tâu` 548 và `thưa` 286); theo phạm vi gần nhất và theo mil5.2.5 liền kề.

  CÁC KHOÁ PĀLI TRÙNG VỚI TẦNG: đã dò 7 khoá có Pāli trùng nguyên văn với khoá ở bài khác (1.1, 2.2, 2.3, 3.2, 11.4, 12.4, 14.5). Dùng lại nguyên văn bản dịch ở 3 khoá: 2.2 `không chui vào khe núi,` và 2.3 `không có chỗ nào trên đời,` (dhp127 và dhp128, 2/2), 3.2 `Như sau đây —` (2/2). 4 khoá khác bản đã có theo lý do trên (11.4, 12.4, 14.5) hoặc vì giữ `pi` của `bhāsitampetaṁ` (1.1: `điều này cũng đã được Đức Thế Tôn dạy`; trong 27 khoá cùng Pāli, tầng bỏ `cũng`, dạng đông nhất là `điều này đã được Thế Tôn dạy`; đã giữ `cũng` vì `pi` là một đơn vị nghĩa của Pāli, và theo `dạy` thay vì `nói`). Câu kệ 2.1 `Không giữa hư không, không giữa biển,` theo đúng dạng dhp128:1.

  TRÙNG NỘI BỘ: 3 nhóm Pāli trùng trong chính bài (9.3 và 10.3, 11.3 và 12.3, 11.4 và 12.4; khác nhau chỉ ở dấu phẩy hoặc dấu cuối khoá), 0 nhóm Việt khác nhau. Khoá 7.4 giống 9.3 và 10.3 về câu chữ (chỉ khác ở dấu đóng nháy theo Pāli).

  SỐ PĀLI (tự tính): `sattavassasatāni` (10.1) = satta 7 × sata 100 = 700 → `bảy trăm năm`; `kumbhasahassena` (5.1) = sahassa 1000 → `cả ngàn bình`; `anekasatāni` (7.3) = nhiều trăm, không xác định → `hàng trăm trường hợp`; `dvīhi` (13.9) = 2 → `hai lý do` (ăn quá nhiều, hơi ấm yếu kém = 2 mục); `tīhi` (14.1) = 3 → `ba lý do` (nghiệp ngăn che, phiền não ngăn che, không tin = 3 mục); danh sách 3.3 có 7 mục (Kinh Châu Báu, Kinh Tâm Từ và năm kinh hộ trì) khớp 7 từ Pāli. 0 lệch.

  DẤU NHÁY: so từng khoá với Pāli cho cả bốn loại dấu `“ ” ‘ ’`, 0 lệch trên 67 khoá. Nháy kép mở ở 1.1 và đóng ở 3.7; mở ở 4.1 và đóng ở 6.2; 7.1, 7.2, 7.3, 7.4, 8.1 tự cân; mở ở 8.2 và đóng ở 9.1; 9.2 tự cân; mở ở 9.3 và đóng ở 10.1; 10.2 tự cân; mở ở 10.3 và đóng ở 11.1; 11.2, 11.3, 11.4 tự cân; mở ở 11.5 và đóng ở 12.1; 12.2 đến 12.5 và 13.1 đến 13.9 tự cân; mở ở 13.10 và đóng ở 14.4; 14.5 đến 14.9 tự cân. Nháy đơn: mở ở 2.1 và đóng ở 2.4; mở ở 3.5 và đóng ở 3.6; mở ở 4.1 và đóng ở 4.2; 7.4, 9.3, 10.3 tự cân; 10.1, 11.1, 12.1 đóng cả nháy đơn lẫn nháy kép ở cuối khoá, đúng Pāli.

  DẤU LƯỢC: Pāli có `…pe…` ở 3.5 và 4.1, đều ở cuối khoá, câu kệ bị cắt rồi nối sang khoá sau bằng từ `maccupāsā`. Cả hai giữ đúng một `…` (`Không giữa hư không …`), và khoá sau (3.6, 4.2) nối tiếp bằng `bẫy của tử thần’`, theo tiền lệ mil3.2.6:3.2 và mil3.3.2:4.1. Không có `…` trần và không có `(…)` trong Pāli của bài, nên bản Việt cũng không có.

  THUẬT NGỮ (kèm số đếm):
  - `paritta` (danh từ, kinh bảo hộ): tầng chưa có tiền lệ cho danh từ này (`paritta` 0 khoá, `hộ kinh` 0 khoá, `Paritta` chỉ xuất hiện trong tên chư thiên `Parittasubha` ở mn41 và mn42). Chọn `kinh hộ trì` (`hộ trì` có 237 lần ở 107 tệp với nghĩa bảo vệ). `parittakammaṁ` → việc hộ trì; `parittabalaṁ` → sức mạnh hộ trì; `kataparitta` → người đã thực hành hộ trì. Tên bảy mục ở 3.3 theo tiêu đề đã có: `Kinh Châu Báu` (kp6, snp2.1), `Kinh Tâm Từ` (snp1.8), `Đỉnh Cờ` (sn11.3), `Āṭānāṭiya` (dn32), `Aṅgulimāla` (mn86), `Con Công` (ja159 `Kinh Con Công`); riêng `khandhaparitta` giữ `Khandha`, không dịch `uẩn`, vì chưa phân xử được nghĩa của `khandha` trong tên này.
  - `kammāvaraṇa`/`kilesāvaraṇa` → nghiệp ngăn che / phiền não ngăn che (an6.86, 2/2 khoá có từ này). `apetakammāvaraṇa` → không bị nghiệp ngăn che.
  - `āyukkhaya` → hết tuổi thọ (4/4 khoá, dn1 và dn24); `khīṇāyuka` → người đã hết tuổi thọ (0 tiền lệ). `āyusaṅkhāra` → lực mạng: 6 khoá dn16 (so với 3 khoá `thọ mạng` ở ud6.1 và tha-ap119, 4 khoá `yếu tố duy trì mạng sống` ở mn43 và dòng thọ ở mil5.3.6); chọn `lực mạng` theo dn16.
  - `koḷāpa` → kiệt quệ, gần với `khô kiệt` của mn85 và mn100 (8/15 khoá có `koḷāpa` viết `khô kiệt`).
  - `ubhato koṭiko pañho` → câu hỏi hai đầu (34/41 khoá; 5 `hai ngọn`, 2 `lưỡng đầu`). `diṭṭhijāla` → lưới kiến (2/3 khoá có gốc này, gồm dn1:3.74.3 `Lưới Kiến`).
  - `halāhalaṁ visaṁ` → chất độc chết người (mil5.1.5, 2/3 khoá có từ này).
  - `usmā` → hơi ấm (16/20 khoá có `usmā`, chủ yếu ở mn43).
  - `visūcikā` → dịch tả (an10.60 liệt kê `kiết lỵ` cho `pakkhandikā` và `dịch tả` cho `visūcikā` trong cùng một danh sách bệnh); mil5.3.2:10.5 viết `kiết lỵ` cho cùng từ, 1 khoá, và không theo vì lệch với an10.60.
  - `niratthaka` → vô ích (5/6 khoá có gốc này).
  - `sabbatthika` → luôn hữu ích (sn46.53:15.4; mil3.1.13:4.12 viết `ở mọi nơi`).
  - `vijjādhara` → vị giữ minh chú (tha-ap366 `tiên minh chú`; mil5.4.7 `thông thạo mọi thuật`); `dānava` giữ nguyên tên Pāli như `Dānaveghasa` ở dn20:12.6.
  - `āhāratthaṁ vā pharati` → thấm khắp thành thức ăn (0 tiền lệ).

  BẤT ĐỊNH ĐÃ GHI (ambiguity 8,8), không đưa vào thân kinh:
  1. `vayasampanna` (4.2, 5.3, 6.1, 6.2): 0 tiền lệ trong tầng; dịch `đúng độ tuổi`, dùng chung cho người và cho cây lúa non (`taruṇaṁ meghasannibhaṁ vayasampannaṁ`). Cách hiểu `vaya` là tuổi đời hay độ sinh trưởng chưa phân xử được.
  2. 9.1: `visaṁ pātīyamāno visaṁ cikkhassanto uddhamadho ācamayamāno` gồm ba phân từ về việc chất độc ra khỏi người bị rắn cắn nhờ câu chú; `cikkhassanto` và `ācamayamāno` không có trong tầng. Dịch theo ngữ cảnh: tống chất độc ra, tuôn chất độc ra, súc xả ra cả trên lẫn dưới. Nên kiểm lại khi có từ điển hoặc bản đối chiếu.
  3. 14.2: `paresaṁ putte akkosante vā paharante vā pahāraṁ deti`; hai phân từ đứng ở dạng `-e` nên về ngữ pháp có thể hiểu hai cách. Chọn nghĩa đứa con là người mắng, đánh con của người khác, vì 14.3 viết người khác nổi giận rồi bắt nó (`te tassa kujjhitvā`) và `aparaddho … velātivatto` (nó đã phạm lỗi).
  4. 14.4: `labhati … kātuṁ` có bốn danh từ đi trước (`ākaḍḍhanaparikaḍḍhanaṁ gāhaṁ sāmino upanayanaṁ`) mà không có từ chỉ việc ngăn; dịch trung tính `có được phép làm gì trước việc …` để không tự thêm chữ `ngăn`. `sāmino` dịch `các vị chủ`; `parisāya` (14.3) dịch `cùng đám đông`; cả hai có thể hiểu khác.
  5. 12.1: `mahesiyā saddhiṁ sampaduṭṭho` dịch `có quan hệ sai trái với hoàng hậu`; từ Pāli không nói rõ loại quan hệ.
  6. 8.2: `hadayaṁ byāvaṭṭati` dịch `tim rung động`; nghĩa chính xác của `byāvaṭṭati` chưa được kiểm trên tầng.
  7. 9.4: `ukkhittalaguḷampi na sambhavati` dịch `không thể dùng được` (không thêm chữ `giáng xuống`).
  8. 10.1: `akataparittassa` có thể là cùng con công hôm không hộ trì, hoặc con khác; bản Việt `con chưa làm hộ trì` giữ cả hai khả năng.
  9. 14.8: `vañjhaṁ karoti` dịch `bị làm cho vô hiệu quả`.
  10. 14.9: `gaṇivarapavaramāsajjā` dịch `ngài đã đạt đến bậc tối thượng, ưu việt nhất trong những vị đứng đầu hội chúng`; ba bài mil khác dịch cụm này theo ba cách và không có chỗ nào trùng nhau.
  11. 3.4: dãy chín từ `pāsāda … pabbatantara` dịch theo từng từ (lâu đài, cốc, hang đá, hang động, vách đá nhô, hố sâu, lỗ hầm, khe núi, khoảng giữa các núi); ranh giới nghĩa giữa `leṇa`, `guhā`, `dari`, `bila` không phân xử được trên tầng.
  12. Cả bài dùng hai chuỗi `parittabhesajjakiriyā` (7.4, 9.3, 10.3) và `bhesajjaparittakiriyā` (6.2) với cùng một dịch `việc thực hành kinh hộ trì và thuốc men`; Pāli đổi thứ tự hai thành tố nhưng không đổi nghĩa ở đây.

