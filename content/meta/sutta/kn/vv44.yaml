notes: |-
  Bản dịch tiếng Việt mới cho vv44, dịch từ Pāli root (109/109 khoá khớp tiền tố `vv44:`; thứ tự khoá đúng thứ tự Pāli). Không có tầng tham khảo tiếng Anh hay tiếng Việt truyền thống ở commit đã ghim, nên mọi chỗ khó đều do Pāli và ngữ cảnh bài tự phân xử.

  **Coverage English theo công thức của `source/layers.yaml`** (Pāli có nội dung ≥ 40 ký tự, loại khối `:0`): mẫu số là **0** khoá — mọi khoá đều là kệ ngắn hoặc tiêu đề (dài nhất chưa tới 40 ký tự; `16.4` = 38, `18.3` = 36, `20.4` = 36). Với mẫu số 0, cổng coverage **không đo được gì**; điều đó khác với "không cần ghi nhận". Có blocker nên bài giữ `draft`; `content/meta/reference-gaps.yaml` do người điều phối ghi nhận bằng `npm run reference:gaps`.

  **Năm phép kiểm.** (1) Tập khoá Việt = tập khoá Pāli, 109/109, cùng thứ tự. (2) Nháy kép `“”` khớp Pāli từng khoá, 0 lệch trên 109 khoá (Pāli mở ở 1.1, đóng ở 7.4; mở ở 8.1, đóng ở 15.4; mở ở 16.1, đóng ở 16.4; mở ở 17.1, đóng ở 26.4); Pāli không có nháy đơn `‘’` nên Việt cũng không có. (3) Pāli trùng nguyên văn trong chính bài: 6 nhóm (`2.1`/`3.1`, `2.2`/`3.2`, `4.3`/`5.3`, `4.4`/`5.4`, `8.2`/`17.2`, `9.2`/`16.2`); 5 nhóm Việt giống hệt, 1 nhóm (`9.2`/`16.2`) Việt khác có chủ ý: `9.2` do vị thiên nữ kể (*tôi có được cung điện…*), `16.2` do tôn giả nói với nàng (*nàng đã có được cung điện…*) — Pāli giống nhau nhưng ngôi kể khác nên bản Việt phải khác. (4) Dấu lược: `1.2` là `…pe…` ⇒ đúng một `…`; Pāli chỉ có một khoá có `…`, Việt cũng chỉ có đúng khoá ấy; không có `(…)` ở Pāli nên Việt không có. (5) Số Pāli: `soḷasayojanāni` (9.3) = 16 do-tuần; `satayojanaṁ` (10.4) = sata 100 ⇒ *một trăm do-tuần*; `pañcaṅgike` (4.4, 5.4) = năm phần; `cattāri … yugāni` (21.2) = bốn đôi; `cattāro … cattāro` (22.1–22.2) = bốn và bốn; `chaṭṭhaṁ` (27.1) = thứ sáu; `dutiyaṁ` (27.2) = thứ hai. **`aṭṭha sataṁ` (21.1) KHÔNG phải 108**: `sataṁ` là sở hữu cách số nhiều của `sant` (*các bậc thiện*), nên đọc *tám hạng người được các bậc thiện tán thán* — đúng như tiền lệ `kp6:6.1`, `snp2.1:6.1`. Không có phép nhân thang lớn nào. Ngoài ra kiểm NFC, khoá rỗng, khoảng trắng thừa, Pāli lọt sang Việt: 0 lỗi (trừ tên riêng và tên cây cố ý giữ nguyên: Vimānavatthu, Mañjiṭṭhaka, Sāvatthī, Sunimmita, mañjūsaka, jambu).

  **Tra tiền lệ (đếm trên toàn tầng `kn` đã dịch).** 39 khoá Pāli của bài trùng nguyên văn với khoá đã dịch ở nơi khác; 15 khoá dùng lại nguyên văn, 24 khoá viết khác có chủ ý. Phần lớn 24 khoá ấy là tám kệ `2–7` trùng Pāli với `vv38:2–7`, và bản Việt ở đó có lỗi nghĩa: đọc `tassā te naccamānāya` thành *bà ấy* (đúng là *nàng đang múa*), đọc `yā veṇīsu piḷandhanā` (*đồ trang sức nơi bím tóc*) thành *cây đàn*, `pañcaṅgike` thành *trống năm mặt* (`vv36:4.4` đã dịch *nhạc năm phần*), `sucigandhā` thành *thơm ngon*, và `Ghāyase taṁ sucigandhaṁ` thành mệnh lệnh *hãy hít lấy*. Đây là lỗi ở tệp ngoài lát, được báo chứ không sửa. `Devate pucchitācikkha` (7.3): 7 khoá đã dịch *Này nữ thiên, hãy nói lời hỏi* (nghĩa là *hãy nói lời hỏi*, ngược với `pucchitā ācikkha` = *được hỏi, xin hãy cho biết*) so với 1 khoá `vv24:13.3` *Này nữ thiên, được hỏi, hãy cho biết* — theo Pāli và theo khoá sau. Cũng không dùng lại `hiện ra như những dãy thềm` (3 khoá, `vv8`/`vv78`) cho `Daddallamānā ābhanti` (10.3): ở đó câu trước nói về bậc thềm, còn ở đây là lầu gác; `daddallamānā` = chói lòa, theo `pv24:5.5`.

  **Dùng lại nguyên văn.** `0.1` Vimānavatthu (74 tệp, giữ Pāli); `0.2` *Chuyện Cung Điện Nữ Hư Không* (44 khoá, so với *Thiên Cung Nữ* 1 và *Thiên Cung Của Nữ Giới* 1); `0.3` *Phẩm Mañjiṭṭhaka* (9 khoá); `1.1` *Với dung sắc rạng rỡ thù thắng* (16 khoá, so với *Với dung mạo tuyệt hảo* 4 và *Với sắc tướng tuyệt vời*, `vv43:1.1`); `1.3` *rực rỡ tựa như sao mai* (17 khoá); `12.1` `12.2` `12.4` theo `pv24:2.3`, `pv24:2.4`, `pv24:3.2`; `10.1` `10.2` theo `vv8:10.1`, `vv8:10.2`; `11.4` theo `pv24:1.2`; `3.4` `6.2` theo `pv24:1.4`; `21.1` `21.2` `21.3` theo `kp6:6.1–6.3`; `26.3` theo `pv16:18.3`. `27.2` *Bhāṇavāraṁ dutiyaṁ* ⇒ *Phần tụng đọc thứ hai* (13 khoá cùng dạng ở `tha-ap`/`iti`, so với *Chuyên luận, phần thứ…* 2 khoá ở `vv`/`pv`). `bhante` / `bhadante` ⇒ *thưa tôn giả* (11 dòng / 5 tệp trong `vv`, so với *bạch ngài* 6 dòng / 1 tệp và *bạch thầy* 3 dòng / 2 tệp).

  **Tiêu đề.** `Itthivimāna` ⇒ *Chuyện Cung Điện Nữ Hư Không* theo đa số (44 khoá), nhưng chữ *Hư Không* không có trong Pāli — `itthi` = nữ, `vimāna` = cung điện; đây là quy ước di truyền cần người điều phối quyết một lần cho cả bộ. `Vihāravimānavatthu` ⇒ *Chuyện Cung Điện Tinh Xá* và `Vihāravimānaṁ chaṭṭhaṁ` ⇒ *Cung Điện Tinh Xá, thứ sáu* theo khuôn `vv53:25.1`, `vv43:10.1`. `mahāvihāra` ⇒ *đại tinh xá* theo `ja488:11.1`.

  **Chỗ cần người biên tập phán (bất định, không đưa vào thân kinh):**
    - `7.1–7.2` `Ghāyase taṁ sucigandhaṁ, rūpaṁ passasi amānusaṁ`: về hình thái là ngôi hai (*ngươi ngửi / ngươi thấy*), nhưng nội dung đứng trước và sau là lời của tôn giả nói về vị thiên nữ, nên ngôi hai không có nghĩa tự nhiên; tôi dịch theo thể bị động không nêu người (*mùi hương ấy được ngửi thấy, hình dáng phi nhân được nhìn thấy*) để không áp ngôi. Có thể đọc `taṁ` là *nàng* (*ngửi thấy nàng, hương trong sạch*) — Pāli không phân xử dứt khoát.
    - `4.1–4.4` `Vivattamānā kāyena, yā veṇīsu piḷandhanā`: `vivattamānā` (nữ, số ít/nhiều) có thể bổ nghĩa cho đồ trang sức (`piḷandhanā`) — cách tôi chọn: *theo thân nàng xoay chuyển, những đồ trang sức nơi bím tóc; tiếng của chúng nghe được* — hoặc cho vị thiên nữ. Cả hai đều cho cùng một hình ảnh. `veṇī` dịch *bím tóc* (`thig13.1:4.2` đã dịch *bím tóc*).
    - `5.1` `vaṭaṁsakā`: dịch *vòng hoa cài tai* theo `tha-ap229:1.3`; từ này cũng có thể chỉ tràng hoa đội đầu.
    - `6.4` `mañjūsaka`: 1 tiền lệ trong tầng (`vv38:6.4`, giữ nguyên Pāli); là tên một loại cây, giữ nguyên.
    - `8.4` `Disvā agārañca piyañca metaṁ`: `metaṁ` = `me etaṁ`; Pāli không nêu `piya` chỉ gì (một người thân hay một việc). Dịch sát chữ *ngôi nhà ấy và điều thân thương ấy của tôi*, không chọn nghĩa.
    - `11.2` `puthuloma`: từ điển ghi là một loại cá; dịch *đàn cá* mà không thêm chi tiết nào.
    - `13.1` `tālā` dịch *cây thốt nốt* theo các khoá đã dịch có *quạt thốt nốt*; `jambuyo` giữ *jambu* theo `vv35:9.2` (*cây jambu*); `panasa` ⇒ *mít*; `nāḷikera` ⇒ *dừa*.
    - `13.4` `aropimā`: dịch *được trồng*; chủ thể trồng không nêu nên không thêm *tôi*.
    - `14.3–14.4` `sopi vitto siyā naro`: `vitta` có hai nghĩa trong từ điển, *hoan hỷ* hoặc *của cải*; chọn *hoan hỷ* theo mạch kệ, đồng thời `19.2`, `20.3` `dadātha vittā` đọc *hãy hoan hỷ dâng* cùng một cách. Nếu đọc theo nghĩa *giàu có*, ba chỗ này đổi theo.
    - `14.1–14.2` hai câu mô tả cung điện, nhưng danh từ `vimānaṁ` chỉ xuất hiện ở `15.2`; Việt giữ nguyên thứ tự để người đọc nối sang `15.1`. `14.3` `maṁ` giữ là *tôi*.
    - `15.4` `Alaṁ puññāni kātave`: `alaṁ` + động từ nguyên mẫu dịch *thật xứng đáng để làm các việc phước*.
    - `16.4` `gati` dịch *cảnh giới* theo `tha-ap339:3.1`, `thi-ap33:17.3`.
    - `18.1` `tassa sunimmitassa`: đọc `Sunimmita` là tên vị thiên vương ở cõi Hóa Lạc (cũng có thể đọc là tính từ *khéo hóa hiện*, như `sunimmita` ở nhiều khoá `tha-ap`; Pāli không phân xử dứt khoát); `pajāpati` ⇒ *chánh hậu* theo `vv41:6.3`.
    - `18.2` `Acintiyā kammavipākā`: *bất khả tư nghì* theo `mil5.4.1` (6 khoá); `kammavipāka` ⇒ *dị thục của nghiệp*.
    - `18.3` `Yametaṁ pucchasi kuhiṁ uppannā sāti`: câu hỏi được dẫn lại không có nháy trong Pāli nên dịch không nháy.
    - `20.1–20.4`: câu quan hệ `Yaṁ maggaṁ … adesayi` mở ở `20.1`, mệnh lệnh `dadātha` ở `20.3`; dịch giữ cấu trúc ấy, không thêm *đó là*. `maggādhipati` ⇒ *bậc Chủ Tể của đạo lộ*, `brahmassara` ⇒ *giọng Phạm âm*; `kañcanasannibhattaca` ⇒ *làn da tựa vàng ròng* theo `vv41:5.1`.
    - `22.3–22.4` `paññāsīlasamāhito`: `samāhita` đọc *đầy đủ* theo mạch (Tăng vừa có trí vừa có giới), không đọc *định*.
    - `23.3` `opadhikaṁ puññaṁ` ⇒ *phước hữu sanh y* theo `iti27:2.1`, `iti83:17.1`.
    - `24.3` `Etehi seṭṭhā naravīrasāvakā`: `etehi` (cách công cụ / xuất xứ) dịch *trong số họ*, cách ít giả định nhất; cũng có thể là *nhờ những vị này*.
    - `25.1–25.2` `Tesaṁ sudinnaṁ suhutaṁ suyiṭṭhaṁ, ye saṅghamuddissa dadanti dānaṁ`: *họ* chính là người nhắm đến Tăng mà dâng bố thí; `sā dakkhiṇā` ⇒ *vật cúng dường ấy*.
    - `26.2` `vedajātā` ⇒ *hoan hỷ dâng trào* theo `tha-ap337:4.2`, `cp8:10.3`. `26.4` `saggamupenti ṭhānaṁ` ⇒ *đạt đến cõi trời*, `ṭhāna` không tách riêng.
    - Nhóm khoá `2.1–2.4`, `3.1–3.4`: `sabbaso` dịch *khắp cả thân*, nghĩa là *trọn vẹn / mọi mặt*; `savanīyā` ⇒ *đáng nghe*; `manoramā` ⇒ *làm đẹp lòng*.

  Bốn lệnh cổng kỹ thuật chưa chạy trong lát này (người dịch bị cấm chạy): `npm run validate`, `npm test`, `npm run check`, `npm run build`. `technical_integrity` đặt 9,6, không phải tuyên bố đã pass cổng. Bài ở trạng thái `draft` do blocker không có tầng tham khảo tiếng Anh, bất kể điểm.
