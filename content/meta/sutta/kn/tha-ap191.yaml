notes: |-
  **Bài này.** `tha-ap191` · phẩm `kuṭajapupphiyavagga` · thứ chín trong phẩm ·
  vị trưởng lão Ekacāriya. Lát `n42` giao 3 bài / 81 khoá; bài này có
  **28 khoá** trong `all`, tôi dịch và ghi đủ **28/28**. Trong đó 27 khoá nằm
  trong `keys`; khoá `tha-ap191:7.1` đã có sẵn từ đợt trước và tôi **giữ nguyên
  văn**, không dịch lại (xem mục công thức `:7.1` bên dưới).
  **Vì sao tệp cũ chỉ có MỘT khoá — và blocker cũ đã được gỡ.** Đợt trước lát
  này được chia bằng bộ lọc `len(Pāli) >= 40` của chốt coverage, mà ở `tha-ap`
  **23/24** khoá Pāli ngắn hơn 40 ký tự, nên bộ lọc loại hết kệ và chỉ còn lại
  `:7.1`. `blocking_errors` cũ ghi đúng điều đó. Lát n42 dùng `missingAll`, tôi
  đủ **28/28** khoá, nên blocker thiếu khoá **không còn**; blocker duy nhất còn
  lại là tầng Anh đã ghim không phủ `tha-ap` (nêu ở trên).
  **Nội dung riêng của bài này — đã đọc Pāli, không suy từ công thức chung.**
  Người kể là vị trưởng lão Ekacāriya. Bốn câu kệ đầu dựng lại một cảnh:
  trong cõi trời Tāvatiṁsa có tiếng reo dội lớn, Đức Phật đã tịch diệt trong
  đời, và chính người kể cũng chớm lòng chán ghét. Rồi chúng trời chấn động,
  bước vào khổ đau ưu sầu; người kể cầm hoa mạn-đà-la gom thành một chùm và
  dâng lên nơi tế của Đức Phật đúng lúc Đức Phật nhập tịch diệt. Kết quả: chư
  thiên đều hân hoan, riêng người kể thì không; suốt một trăm ngàn kiếp không
  còn rơi vào đọa xứ; trong sáu mươi nghìn kiếp thì từ đó có mười sáu người,
  tên là Mahāmallajanā, đều là Chuyển Luân Vương có đại uy lực; và chứng bốn
  vô ngại giải trong giáo pháp của Đức Phật.
  **Công thức `:7.1` — đo lại, và số đo khác brief là do mẫu khác.** Điều kiện
  đo: Pāli chứa `Itthaṁ sudaṁ` **và** `abhāsitthāti`, quét toàn tầng
  `vietnamese-project/sutta/kn`. Kết quả đo lúc tôi chạy: **417** khoá dùng
  *…đã nói **những** bài kệ này* và **35** khoá dùng *…đã từng nói **bài kệ
  này***, cộng 1 câu lạ (`cp35:18.1` là câu dẫn chuyện khác, không theo công
  thức này). Brief ghi 407 / 21; tôi tin phép đo của mình và nêu rõ ở đây. Cả
  hai vế đều nghiêng về **số nhiều**, đúng với `imā gāthāyo` (số nhiều) — vì
  vậy tôi giữ nguyên văn `:7.1` sẵn có, vốn thuộc nhóm 417.
  **`translationTitle` phải BẰNG ĐÚNG `:0.3`, và đây là chỗ tệp cũ sai.**
  Tệp cũ ghi *Kinh Kệ Của Trưởng Lão Ekacāriya* trong khi `:0.3` cũ (nếu có)
  chưa từng được viết. Tôi đã đo tiền lệ ở **phạm vi gần nhất** (`tha-ap183`–
  `tha-ap212`, 27 tệp có `translationTitle`): *Bài Kệ Tuyên Ngôn* **11**,
  *Ký Sự* **5**, *Bài Kệ Tuyên Ngợ* **4**, *Kinh Kệ Của Trưởng Lão* **4**,
  *Tự Thuật Của Trưởng Lão* **3**. Cả tầng `tha-ap` (428 tệp): *Bài Kệ Tuyên
  Ngợ* **200**, *Ký Sự* **94**, *Bài Kệ Tuyên Ngôn* **72**, *Kinh Kệ Của Trưởng
  Lão* **28**, *Tự Thuật Của Trưởng Lão* **9**, *Truyện Kệ* **6**. Tôi theo
  đa số gần nhất và **bỏ** dạng *Kinh Kệ Của Trưởng Lão* — đó là mẫu brief đã
  gọi là lỗi. Về chữ *Tuyên Ngợ / Tuyên Ngôn*: đa số gần nhất là **Tuyên Ngôn 11
  vs Tuyên Ngợ 4**, còn cả tầng nghiêng ngược (**Ngợ 200 vs Ngôn 72**) vì nhiều
  lát cũ đã nhân bản chính tả sai *Ngợ*. Tôi theo đa số gần nhất (đúng chính
  tả) và **giao người biên tập phán một lượt cho cả cuốn** — hai phạm vi cho
  hai đa số khác nhau, không tự ý dọn lẻ từng tệp.
  **Chính sách số thứ tự ở `:0.3`: Pāli `:0.3` của bài này KHÔNG bắt đầu bằng
  số**, nên bản Việt cũng không có số. Cùng phẩm có những tệp khác Pāli có
  số (`6 Bodhiupaṭṭhāka…`, `8. …Muṭṭhipūjaka…`) và tôi giữ số ở đó; ở đây
  không thêm. Đo toàn tầng: **THỪA 0** trong các tệp tôi thấy có số lạc — không
  có tệp nào thêm số ở chỗ Pāli không có.
  **`:0.1` giữ nguyên dạng Pāli, có tiền lệ đếm được.** `Therāpadāna` được giữ
  ở **376/385** tệp `tha-ap` có bản dịch (9 tệp dùng *Trưởng Lão Ký Sự*). Tôi
  giữ `Therāpadāna`, và đây là **một** khoá có Pāli lọt nguyên văn sang bản
  Việt — có chủ đích, không phải sót. `:0.2` tôi đo riêng theo từng phẩm vì
  cùng một Pāli `:0.2` phải nhất quán trong phẩm: `Kuṭajapupphiyavagga` 6 tệp
  ⇒ *Phẩm Hoa Kuṭaja* **3**, *Phẩm Kuṭajapupphiya* **2**, *Phẩm Bậc Rải Hoa
  Kuṭaja* **1**. Tôi theo 3. (Hai phẩm kia của lát: `Tamālapupphiyavagga` 7 tệp
  ⇒ *Phẩm Tamālapupphiya* **5** thắng *Phẩm Hoa Tamāla* **2**;
  `Kaṇikārapupphiyavagga` 8 tệp ⇒ *Phẩm Hoa Kaṇikāra* **6** thắng **1+1**.)
  **`:8.1` — số thứ tự đo theo chữ Pāli, không đoán.** `navamaṁ` được dịch thành
  *thứ chín* ở **7/7** tệp; `catutthaṁ` thành *thứ tư* **5/8** (3 tệp dùng
  *thứ bốn*). Bài này `navamaṁ` ⇒ *thứ chín*.
  **Nhịp nháy: đúng như Pāli, chạy qua khoá.** Pāli mở `“` ở `:1.1` và đóng
  `”` ở `:6.3`, tức cố ý không cân trong từng khoá. Tôi **không** làm mỗi khoá
  tự cân: `:1.1` mang `“`, `:6.3` mang `”`, các khoá khác không dấu. Phép kiểm
  của tôi so **từng khoá** cả hai vế và cả nháy đơn `‘’`; 28/28 khớp.
  **Dấu lược `:6.2`.** Pāli là `…pe…` nên bản Việt giữ **đúng một** `…` và
  **không** mở rộng (luật fidelity của `BRIEF_VI3` §10.1). Không có khoá nào
  dùng `…` trần, và không có khoá nào còn dạng `(…)` của khoá chưa dịch.
  **Thuật ngữ — tiền lệ đếm được trong chính tầng này, không tự đặt.**
  `Paṭisambhidā catasso` ⇒ *Bốn vô ngại giải* (tiền lệ dùng chung ở **393** tệp,
  gần nhất 5/5); `kataṁ buddhassa sāsanaṁ` ⇒ *đã làm tròn lời dạy của Đức Phật*
  (gần nhất 5/5; cả tầng có bốn biến thể, tôi theo biến thể gần nhất và
  không có dấu hai phẩu); `duggatiṁ nupapajjahaṁ` ⇒ *không còn rơi vào đọa xứ*
  (tầng có *khổ xứ* và *đọa xứ*; tôi theo *đọa xứ* vì `duggati` không phải
  `dukkha`); `cakkavattī mahabbalā` ⇒ *Chuyển Luân Vương có đại uy lực*
  (gần nhất 4/7; cả tầng *đại oai lực* và *đại thần lực* cùng tồn tại — tôi
  theo gần nhất, vì `mahabbalā` là **sức mạnh**, *oai lực* cũng được nhưng
  *thần lực* là thần thông, lệch nghĩa); `Kappānaṁ satasahassaṁ` ⇒ *một
  trăm ngàn kiếp*; `Saṭṭhikappasahassamhi` ⇒ *sáu mươi nghìn kiếp*; `Mandāravaṁ`
  ⇒ *hoa mạn-đà-la* (tiền lệ `tha-ap363:1.3`); `abhiropayiṁ` ⇒ *dâng lên cúng
  dường Đức Phật*; `Tāvatiṁsa` giữ dạng Pāli vì đó là tên cõi trời.
  **Tên riêng giữ dạng Pāli — đếm được.** `Ekacāriya` đã có sẵn ở `:7.1` của
  chính bài này (giữ nguyên), và 33 tệp cùng công thức trong tầng đều giữ tên
  Pāli có dấu. Tên `Mahāmallajanā` ở `:5.3` cũng giữ dạng Pāli: đây là tên
  riêng, và bịa tên Việt cho tên riêng là bịa nghĩa.
  **Câu lời-kết đã đọc lại từng cặp.** Tôi in ra toàn bộ 28 cặp Pāli ↔ Việt và
  đọc lại sau khi ghi; không phát hiện lỗi chủ thể, phủ định, số lượng hay lệch
  khoá nào. Ba chỗ dễ sai ở đây là số: `Kappānaṁ satasahassaṁ` =
  100 × 100.000 = **mười triệu kiếp** (một trăm ngàn kiếp), `Saṭṭhikappasahassamhi`
  = 60 × 1.000 = **sáu mươi nghìn kiếp**, `soḷasa` = 16 — cả ba tôi đã kiểm
  lại bằng công thức số Pāli chứ không suy từ tầng.
  **BẤT ĐỊNH — ghi rõ, không giấu, và không bịa để lấp.**
  (1) `tha-ap191:1.2` `mahāghoso tadā ahu`. Có hai cách đọc: **tên riêng**
  `Mahāghosā` (bậc nữ trong cõi Tāvatiṁsa, như `notes` của đợt trước đã nói),
  hoặc **danh từ thường** *tiếng reo lớn*. Tôi chọn cách thứ hai và dịch *khi
  ấy dấy lên tiếng reo dội lớn*. Lý do: Nom. sg. nữ của `ghoṣā` là `-ā`, mà Pāli
  ở đây viết `-o`; và `Tesaṁ saṁvegajātānaṁ` ở `:2.1` (`Tesaṁ` = *những vị ấy*)
  chỉ hợp với cách đọc *chúng trời reo lên*. Cách đọc còn lại vẫn bảo vệ được
  vì câu kệ không đổi nghĩa giáo lý và hai bên đều dẫn tới hành động cúng dường ở
  `:3.1–3.4`; tôi hạ `ambiguity_integrity` cho đúng việc này.
  (2) `tha-ap191:2.3` `Sabalena upatthaddho`. Đây là khoá khó nhất của bài:
  `sabalena` chỉ xuất hiện **2** lần trong toàn bộ Pāli root (`tha-ap191:2.3`
  và `tha-ap198:2.1`) và tôi **không** tra được nghĩa từ vựng nào trong máy
  (PED/PCED trên `dictionary.sutta.org` hiển thị bằng JavaScript nên không đọc
  được; `sirīmaṅgala` trả *File not found*; bản Việt Hòa thượng Thích Minh Châu
  trên `budsas.org` — tôi đã tải và quét — **không chứa** các chương apadāna
  có ba bài này, nên không dùng được làm tham khảo). Cách sát nhất mà tôi bảo vệ
  được là **danh xưng** `sabalena` cho **nguyên nhân thúc giục** ngay trước đó:
  `:2.2` đã nêu `soka` (khổ đau ưu sầu), nên tôi dịch *Bị nỗi buồn kia thúc
  giục, tôi*. Tôi **không** gán một danh từ cụ thể cho `sabalena` vì chưa có
  chứng từ. Cách đọc này không đổi nghĩa giáo lý, nên tôi xếp là **không
  blocking** và ghi ở đây để người biên tập đo lại nếu có nguồn.
  (3) `tha-ap191:5.2` `ito soḷasa te janā`. `te janā` không có cách đọc nào khác
  rõ trong bài; tôi dịch *từ đó có mười sáu người* — giữ đủ `soḷasa` và `ito`,
  và để chỗ này mở vì `janā` rộng. Cũng ghi ở đây.
  **Lỗi bản nháp thật trong tầng mà tôi đo được và BÁO, không tự sửa** (đều ngoài
  lát n42 nên tôi không chạm vào):
  (a) `tha-ap192:5.1` `Teraseto kappasate` đang dịch *mười bảy ngần kiếp*.
  `teraseta` = 13.000 và hậu tố `-to` ở đây là dấu nhân nghìn — đúng kiểu đã được
  dịch chuẩn ở `tha-ap145:4.1` (`Soḷaseto` → *một nghìn sáu trăm kiếp*) và ở
  `tha-ap19:7.1` (`Satasahassito kappe` → *một trăm ngàn đại kiếp*). Nên đúng là
  **mười ba nghìn**, tức tệp đó thừa bốn nghìn kiếp. Cùng loại lỗi số mà brief đã
  liệt kê với `Tiṁsakappasahassamhi`. Trong bài này tôi dịch `:5.1` bằng cùng
  phép đo đó.
  (b) `tha-ap140:4.1` `Sattarase kappasate` đang dịch *chín mươi tư kiếp trước*;
  `sattarase` = 1.700 (thiện dụng), và chính Pāli này ở `tha-ap143:3.1` đã được
  dịch đúng là *một nghìn bảy trăm kiếp*.
  (c) `tha-ap241:2.1` `Aṭṭhārase kappasate` đang dịch *Từ tám trăm kiếp trước*;
  `Aṭṭhārase` = 1.800, và **29** tệp khác trong tầng đều dịch *một ngàn tám
  trăm*.
  (d) `tha-ap186:5.1` `Ito terasakappamhi` đang dịch *Cách đây mười ba kiếp về
  trước* — **thiếu nhân nghìn**: `terasakappa` = 13.000 kiếp.
  (e) `tha-ap48:4.1` `Sattatālīsito kappe` đang dịch *bốn mươi bảy kiếp*;
  `sattatālī` = 7 + 60 = **sáu mươi bảy**.
  (f) `tha-ap140:1.4` `agamaṁ buddhasantikaṁ` đang dịch *đã đến dự lễ tế của
  tôi* — thêm *của tôi*, không có trong Pāli (`buddhasantikaṁ` là *nơi tế của
  Đức Phật*). Ở bài này tôi dịch *bước đến nơi tế của Đức Phật*.
  **Coverage English — nêu rõ cả ba tầng và cả mẫu số.** Tra
  `source/upstream-manifest.json` (commit `11c9d708…`): `english-sujato` có
  4.291 tệp, trong đó `sutta/kn` chỉ có **9** sub-collection — `cp 35 · dhp 26 ·
  iti 112 · ja 83 · kp 9 · snp 73 · thag 264 · thig 73 · ud 80` = **755** tệp —
