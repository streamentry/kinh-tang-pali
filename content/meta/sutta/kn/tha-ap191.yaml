  `vietnamese-current` (Thích Minh Châu) ở commit đã ghim có **26** tệp, toàn bộ
  là Pháp Cú (`sutta/kn/dhp/…`), không có mục nào cho `tha-ap`. Tầng
  `english-project` không có entry cho bài này — `content/meta/en/kn/` có
  **0** tệp `tha-ap*`. **Mẫu số** của cổng coverage: đo trên Pāli **có nội dung**
