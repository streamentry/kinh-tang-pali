notes: |-
  Đủ 15/15 khoá. Đã đọc HẾT w7.pali.txt trước khi viết.

  Pāli trùng nguyên văn, dùng lại:
  · `2. Siṅgālajātaka` và `Siṅgālajātakaṁ dutiyaṁ.` trùng y hệt ja142:0.4 và ja142:2.1, đã có trong tầng: 2. Kinh Chó Rừng và Kinh Chó Rừng thứ hai. Lưu ý đây là bài khác: ja142 ở Bộ Một Bài Kinh / Phẩm Kakaṇṭaka, còn ja152 ở Bộ Hai Bài Kinh / Phẩm Tàn Tật; cả hai đều là jātaka Siṅgāla thứ hai theo cách đánh số riêng của từng phẩm, nên dùng lại nguyên văn là đúng và tôi không sửa tên bài cho khác phẩm.
  · `Daḷhavagga` → Phẩm Tàn Tật (4 bài so với 1 bài Phẩm Người Yêu ở ja159); `Dukanipāta` → Tập Kẻ Đau Đớn — xem ghi chú cuối về bốn xung đột thuật ngữ.

  Nghĩa bài và hai vế đối xứng, tôi giữ nguyên: 1.1–1.4 nói về kẻ tuổi sống không soi xét thì bị thiêu đốt như lửa nuốt vào miệng hang tối tăm; 2.1–2.6 nói bậc sư gầm thì con thú hoang hoảng sợ mà vào rừng trú, nhưng lòng không rối loạn. Tôi không thêm lời giải thích nào vào thân kinh.

  Chỗ chưa chắc:
  · `daddara` và `siṅgāla` tôi dịch cùng là con thú hoang, vì hai từ cùng chỉ loài thú hoang (chó rừng/sói) và Pāli cố ý dùng hai từ. Tiêu đề vẫn theo tiền lệ là Kinh Chó Rừng.
  · `uṇhaṁvajjhohitaṁ mukhe` tôi dịch một miệng hang tối tăm. Đây là vế so sánh: việc ác thiêu đốt chúng y như lửa đã nuốt vào một khoét tối. Tôi không diễn giải thêm (ví dụ thêm "giấu giếm điều ác") vì Pāli không nói.
  · `hadayañcassa apphalī` tôi dịch lòng nó không hề rối loạn. `apphalī` nghĩa gốc là không tái nhợt/ không tái đổi màu; “không rối loạn” là cách đọc theo ngữ cảnh câu kệ, ghi lại vì nó là chuyển nghĩa duy nhất tôi thực hiện.

  LỖ HỔNG TẦNG THAM KHẢO: Không có tầng tham khảo English Sujato tại commit đã ghim: đã duyệt .cache/upstream/suttacentral/translation/en/sujato/sutta/kn/ và không có tệp cho uid này (0/15 khoá có prose), và tầng Việt hiện hành tại commit đã ghim chỉ có Pháp Cú nên Khuddaka Nikāya cũng không có bản Hòa thượng Thích Minh Châu; bài dịch chỉ từ Pāli, chưa đối chiếu được tầng tham khảo nào nên giữ draft. Mọi khoá Pāli dưới 40 ký tự nên mẫu số coverage rỗng, bài vẫn giữ draft vì không có tầng tham khảo nào để đối chiếu. Bản Việt hiện hành không có cho Jātaka.

  BỐN XUNG ĐỘT THUẬT NGỮ ĐANG TREO — đã đi theo đa số để không tự mâu thuẫn trong cùng phẩm, xin người điều phối gộp: Dukanipāta trong tầng đang có Tập Kẻ Đau Đớn ở 31 bài Jātaka, Bộ Hai Bài Kinh ở 13 bài Jātaka và 6 bài Trưởng Lão/Trưởng Lão Nữ, Tập Hai ở 2 bài Jātaka và 1 bài Trưởng Lão. Tôi chọn Tập Kẻ Đau Đớn cho ja152 và ja156 vì đó là đa số trong Jātaka, và Bộ Hai Bài Kinh cho thag2.16, thig2.4, thig2.6, thig2.7 vì đó là đa số trong Theragāthā/Therīgāthā (8 bài so với 1). Tôi không sửa bài ngoài lát.

  Kiểm thủ công trên TOÀN BỘ 15 khoá (kiểm() rỗng): đủ khoá, đúng ID, không rỗng, NFC, không trùng nguyên văn, dấu lược bằng Pāli (cả hai phía 0), nháy kép cân xuyên suốt bài (mở/đóng ở 1.1–1.4 rồi mở/đóng ở 2.1–2.6), không `(…)` dở. save_vi hai lần, idempotent.
